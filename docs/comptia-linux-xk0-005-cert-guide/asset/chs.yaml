  \n**b. monitor2reject**\n\n**c. fail2ban**\n\n**d. scan2act**\n\n**6.** 在你的 Red\
  \ Hat/Fedora 系统上，你正在使用命令通过 `firewalld` 技术配置 `iptables` 规则。该命令的名称是什么？\n\n**a. ufw**\n\
  \n**b. rhiptables**\n\n**c. apparmorctl**\n\n**d. firewall-cmd**\n\n### 基础主题\n\n\
  正如本书开头提到的，通用的远程连接以及获取远程 shell 以便你可以在该远程系统的命令行上执行所需的所有操作，对于任何系统操作员来说都是至关重要且必要的技能。\n\
  \n### SSH (Secure Shell)\n\n到此时，你可能已经意识到 `Telnet` 协议明文发送密码和数据，不应用于重要的会话和任务。`Secure\
  \ Shell` (`SSH`) 套件包含一个协议、一个守护进程和客户端工具，使得你的主机到主机之间的 shell 会话安全得多——几乎等同于物理控制台。\n\n\
  `SSH` 作为远程协议受青睐的特性之一是其端到端加密，它不仅加密用户名和密码，还加密所有通信。\n\n`SSH` 套件替换了 `telnet` 以及 `rsh`、`rexec`、`rcp`\
  \ 和其他不安全的工具。你可以使用 `SSH` 连接进行 shell 会话，也可以使用 `scp` 命令通过 `SSH` 在主机之间建立的安全管道远程传输文件。\n\
  \n#### SSH 组件\n\n![Images](img/key_topic_icon.jpg)\n\n• `ssh`: 用于在另一个主机上进行远程 shell\
  \ 会话，它替换了 `telnet`、`rsh` 和 `rexec` 命令。\n\n• `scp`: 用于远程复制操作，它替换了 `rcp` 命令。\n\n•\
  \ `sshd`: SSH 守护进程。\n\n• `ssh-agent`: 作为用户会话的封装运行并在请求时提供身份验证。\n\n• `ssh-add`: 将用户的密钥加载到代理中。\n\
  \n`SSH` 包配置文件有些分散。SSH 守护进程和全局配置文件保存在 `/etc/ssh` 目录下，而本地或用户特定的配置文件保存在每个用户的 `~/.ssh`\
  \ 目录下。\n\n![Images](img/key_topic_icon.jpg)\n\n全局配置文件包括\n\n• `/etc/ssh/sshd_config`：这是\
  \ `sshd` 守护进程的主配置。\n\n• `/etc/ssh/ssh_host_[dr]sa_key`: 这些文件（即 `ssh_host_dsa_key`\
  \ 文件和 `ssh_host_rsa_key` 文件）位于同一目录，是主机密钥结构的私有部分，应受到保护以免被公开。这些文件的权限为 root 用户的 600\
  \ 或 `rw`，其他任何人都没有权限。\n\n• `/etc/ssh/ssh_host_[dr]sa_key.pub`: 这些文件（`ssh_host_dsa_key.pub`\
  \ 文件和 `ssh_host_rsa_key.pub` 文件）位于同一目录，是主机密钥结构的公共部分。这些必须对世界可读，且仅允许 root 用户写入，或设置为\
  \ 644。\n\n• `/etc/nologin`: 这不是 SSH 的一部分。但如果存在，除了 root 用户外，无人能通过 SSH 登录。非 root 用户看到\
  \ `/etc/nologin` 文件的内容，然后被拒绝访问系统。\n\n\n\n\n\n几对特殊文件会影响 SSH 的工作方式，特别是 `/etc/ssh/ssh_known_hosts`\
  \ 和 `~/.ssh/known_hosts` 文件。全局文件（`/etc/ssh/ssh_known_hosts`）用于检查尝试通过 SSH 连接的主机公钥。本地文件（`~/.ssh/known_hosts`）是客户端从中获取远程服务器公钥的文件。如果开始到之前未\
  \ own 的主机的新连接，用户将看到一条消息，说明该主机未知，并询问用户是否想要将主机的密钥存储在其已知 hosts 文件中。如果用户回答肯定，该主机的公钥将添加到\
  \ `~/.ssh/known_hosts` 文件中。\n\n`/etc/ssh/ssh_known_hosts` 文件应该是所有人可读且仅 root 可写的。`~/.ssh/known_hosts`\
  \ 文件必须由用户所有并允许该用户写入。\n\n![Images](img/key_topic_icon.jpg)\n\n另一个值得关注的文件是 `~/.ssh/authorized_keys`\
  \ 文件，它只影响特定用户的环境。该文件用于存储可以用于登录该用户的公钥。这些密钥将与登录请求时由 `ssh` 或 `scp` 客户端提供的密钥进行匹配。\n\n\
  SSH 客户端实用程序功能强大，有许多选项可用于自定义体验。你只需要了解 Linux+ 考试所需的基础知识，但本节包含了一些有趣的选项。\n\n`ssh` 命令专门用于替代\
  \ RSH 和 Telnet 程序。其语法如下：\n\n![Images](img/key_topic_icon.jpg)\n\n```\n# ssh -l username\
  \ remotehost\n```\n\n如果你没有使用 `-l` 选项指定用户名，`ssh` 命令将假设你想要使用你当前本地登录的账户名称。例如，如果你以用户\
  \ `ross` 身份登录并执行不带 `-l` 选项的 `ssh` 命令，该命令将尝试在远程系统上以 `ross` 的身份登录你。\n\n例如，我可以使用以下命令以\
  \ `snuffy` 用户身份连接到主机 `mp3server`：\n\n```\n# ssh -l snuffy mp3server\n```\n\n如果我以前没有连接过这台服务器，我将收到一条与此处所示类似的消息：\n\
  \n```\nThe authenticity of host ‘mp3server (192.168.33.44)’ can’t be\nestablished.\n\
  RSA key fingerprint is\n73:4f:fa:b0:42:a4:3a:a8:64:2c:ad:26:1d:b1: 21:e0.\nAre you\
  \ sure you want to continue connecting (yes/no)?\n```\n\n如果我回答 yes，主机的公钥将添加到我的 `~/.ssh/known_hosts`\
  \ 文件中，看起来如下：\n\n```\n192.168.3.44 ssh-rsa\nAAAAB3NzaC1yc2EAAAABIwAAAIEA1gFIB9VQpFKWAZUzNM+ac/U81Tk9R8O\n\
  CFfUkegVJXwj6nqCISPyV2iJwaukcVVaVAQ+JR3EhvOvh4PhoSg4yzBSUkJ\n8aUBYoRSGj7PCD+vyWyi1922HGxWbWooMBAO/Was8I7N0zQ6jxDO9qNOHcr\n\
  IFeU7qbOCrKjQDM08HQjk0=\n```\n\n与其使用 RCP 或 FTP 进行文件传输工作，我倾向于使用 SCP。`scp` 命令使用 SSH\
  \ 协议并加密从一个主机发送到另一个主机的文件。例如，如果我想将我的机器上 root 用户主目录下的 `file1` 传输到名为 `remotehost` 的主机的相同位置，可以使用以下命令：\n\
  \n```\n# scp /root/file1 root@remotehost:/root/file1\n```\n\n如果我以前没有通过此账户连接过此系统，系统将向我提问\
  \ RSA 密钥问题（如上一个 `ssh` 示例所示）。我会被提示输入密码，然后系统将传输文件。文件传输的输出看起来像这样：\n\n```\n# root@192.168.1.73’s\
  \ password:\nmypubkey.txt 100% |**********************| 1379 00:00\n```\n\n你可以像之前那样将文件从你的主机复制到另一个主机，或者通过反转源和目标指定将文件从远程主机复制到你的系统。\n\
  \n你甚至可以将文件从一个远程系统复制到另一个远程系统。例如，以下命令将在提示你两个主机的密码后，递归地将 `remote1` 主机的 `/data` 目录及其所有内容复制到\
  \ `remote2` 主：\n\n```\n# scp -r root@remote1:/data root@remote2:/data\n```\n\nSSH\
  \ 协议的另一个用途是登录主机并使用 SSH 将 X 客户端的输出传回你的显示器。此功能可以通过 `-x` 选项专门调用，被称为 X11 隧道。\n\nSSH\
  \ 允许在计算机之间登录时跳过密码提示，如果你频繁使用 `ssh` 或 `scp` 命令，并且不在意可能有人坐到你不小心解锁的工作站并对你的网络为所欲为，这会非常方便。\n\
  \n### 注意\n关于为什么从用户目录中删除 `.rhosts` 文件是重要的，已经有了很多讨论。基本上，如果你有一个用户在她的 `.rhosts` 文件中包含一个主机名，而该主机在它的\
  \ `/etc/hosts_equiv` 文件中也有该用户的主机名，那么该用户就可以使用 `rlogin` 命令无密码登录。这将带来安全风险，因此我的建议使用以下命令删除这些文件：\n\
  \n![Images](img/key_topic_icon.jpg)\n\n```\n# find /home -iname .rhost -exec rm\
  \ -f {} \\;\n```\n\n### 注意\n这会删除在用户主目录中找到的所有 `.rhosts` 文件，且不会在每次删除时提示你。\n\n### 注意\n\
  SSH 客户端的系统级配置保留 `/etc/ssh/ssh_config` 文件中，而每个用户的 SSH 客户端个人配置保留在用户的 `~/.ssh/config`\
  \ 文件中。\n\n下面的示例显示了启用无密码 SSH 使用所需的步骤。在此示例中，我有两台机器，`fattyre` 和 `murphy`，它们都是 Linux\
  \ 工作站，并按照默认加载了必要的 SSH 软件。此演示假设 `fattyre` 和 `murphy` 都在对方的 `/etc/hosts` 文件中，或者可以通过\
  \ DNS 解析。\n\n![Images](img/key_topic_icon.jpg)\n\n以下是你可以启用无密码 SSH 的方法：\n\n**步骤 1.**\
  \ 以 root 用户身份登录 `fattyre`。\n\n**步骤 2.** 对于此示例，创建一个名为 `user1` 的新用户：\n\n```\nuseradd\
  \ -m user1\n```\n\n**步骤 3.** 使用 `passwd` 命令为 `user1` 设置你喜欢的密码：\n\n```\npasswd user1\n\
  ```\n\n**步骤 4.** 切换到 `user1` 用户账户：\n\n```\nsu - user1\n```\n\n**步骤 5.** 创建并设置 `.ssh`\
  \ 目录的权限：\n\n```\nmkdir .ssh ; chmod 700 .ssh\n```\n\n**步骤 6.** 生成 RSA 密钥：\n\n```\n\
  ssh-keygen -b 1024 -t rsa\n```\n\n**步骤 7.** 当提示文件位置时，按 **Enter** 接受默认值。\n\n**步骤\
  \ 8.** 当提示密码语时，输入\n\n```\nse\n```\n\n**步骤 9.** 提示时再次输入密码语。\n\n**步骤 10.** 进入 `.ssh`\
  \ 目录并设置 `id_rsa.pub` 文件的权限：\n\n```\ncd .ssh ; chmod 644 id_rsa.pub\n```\n\n**步骤\
  \ 11.** 将 `id_rsa.pub` 文件复制到新文件 `authorized_keys` 中：\n\n```\ncp id_rsa.pub authorized_keys\n\
  ```\n\n### 注意\n接下来的步骤在 `murphy` 主机上进行。\n\n**步骤 12.** 从 `murphy` 主机，通过 ping 确保可以连接\
  \ `fattyre` 主机：\n\n```\nping fattyre\n```\n\n**步骤 13.** 以 root 用户身份登录 `murphy` 主机。\n\
  \n**步骤 14.** 添加名为 `user2` 的用户：\n\n```\nuseradd -m user2\n```\n\n**步骤 15.** 为 `user2`\
  \ 设置密码：\n\n```\npasswd user2\n```\n\n**步骤 16.** 输入两次密码以确认。\n\n**步骤 17.** 切换到 `user2`\
  \ 账户：\n\n```\nsu - user2\n```\n\n**步骤 18.** 创建目录并使用以下命令设置权限：\n\n```\nmkdir .ssh\
  \ ; chmod 700 .ssh\n```\n\n### 注意\n接下来的步骤在 `fattyre` 主机上进行。\n\n**步骤 19.** 从 `fattyre`\
  \ 主机，以 `user2` 身份连接 `murphy` 主机：\n\n```\nssh -l user2 murphy\n```\n\n**步骤 20.**\
  \ 当提示 RSA 密钥时，回答 yes，然后输入 `user2` 的密码。\n\n**步骤 21.** 在通过 SSH 以 `user2` 登录 `murphy`\
  \ 主机时，使用以下命令从 `fattyre` 主机复制 `authorized_keys` 文件：\n\n```\nscp user1@fattyre:~/.ssh/authorized_keys\
  \ ~/.ssh\n```\n\n`scp` 程序的输出看起来如下：\n\n\n\n\n\n```\nauthorized_keys 100% |************************|\
  \ 236 00:00\n```\n\n### 步骤 22. 在主机 `murphy` 上退出 `user2` 并返回 `fattyre` 的 `user1`。\n\
  \n### 步骤 23. 在 `fattyre` 上以 `user1` 身份调用 `ssh-agent` 作为 shell 的封装：\n\n```\nssh-agent\
  \ $SHELL\n```\n\n### 步骤 24. 将你的密钥添加到代理：\n\n```\nssh-add\n```\n\n### 步骤 25. 当提示输入密码短时，输入以下内容：\n\
  \n```\nno more tears\n```\n\n随后你将看到类似下面的输出：\n\n```\nIdentity added: /home/ssha/.ssh/id_rsa\
  \ (/home/ssha/.ssh/id_rsa)\n```\n\n### 步骤 26. 尝试在 `murphy` 上作为 `user2` 登录并观察发生了什么：\n\
  \n```\nssh -l user Murphy\n```\n\n你不应该看到任何密码提示；你只会看到上次登录地点的确认：\n\n```\nLast login:\
  \ Wed May 26 13:46:55 from fattyre\n```\n\n### 步骤 27. 如果你确实看到了密码提示，请像之前一样输入 `no\
  \ more tears`。\n\n只需这些操作就可以设置两个账户和机器使用 SSH 工具，而无需输入 `ssh-agent` 命令和密码短语以外的任何内容。记住，`ssh-agent`\
  \ 留在内存中，并为你的 shell 会话封装了一层安全防护，为你回答任何与 SSH 相关的安全请求。`ssh-add` 用于将密钥信息添加到代理中，只要密钥信息不变，就不需要再次运行。\n\
  \n注意\n\n`ssh-copy-id` 命令也是将用户的授权密钥发送到另一个服务器的可能选择。例如，为了让用户 `ZakkW` 的授权密钥存在 `Eternal`\
  \ 服务器上，你可以使用命令：\n\n```bash\n# ssh-copy -id -i ~/zakkw/.ssh/keyfile zakkw@eternal\n\
  ```\n\n这会将用户 `zakkw` 的文件复制到远程服务器并安装到 `authorized_keys` 文件中，并提示输入密码以验证该过程。\n\n理想情况下，这应该由两个系统的\
  \ root 用户执行，并假设你正处于 `Eternal` 服务器的远程系统。\n\n## 隧道传输\n\n![Images](img/key_topic_icon.jpg)\n\
  \nSSH 最强大的功能之一是它可以从一个网络内部（甚至在防火墙之后）提供“隧道”或导管，连接到另一个网络。在许多情况下，使用隧道传输可以让你执行一些网络管理员不希望你做的事情，或者你由于过度限制的策略（例如在某个咖啡馆或网吧）而需要做的事情。\n\
  \n让我们聊聊隧道传输派上用场的的一些各种场景。\n\n### X11 转发\n\nX 有时非常复杂且难以设置，看起来从另一台机器将 X 隧道化并显示在你的机器上似乎也很困难，但由于\
  \ SSH 隧道的魔法属性，这其实非常简单！\n\n假设你有一个名为 `cygnusx1` 的 Linux 系统，你想在上面的 GUI 环境中运行一个程序，但你希望运行在远程主机上的程序显示在**你的**本地系统上？\n\
  \n以下可能是你可能采取的步骤。\n\n**步骤 1**。在 Mac 上，你可能使用 `xQuartz`（在 `xquartz.org` 找到），你需要下载并安装它。\n\
  \n**步骤 2**。然后你运行命令 `ssh -X ursulak@cygnusx1`。\n\n**步骤 3**。将在远程主机（`cygnusx1`）的终端中打开一个\
  \ shell，你可以在其中运行程序。\n\n**步骤 4**。几秒钟后，作为远程主机进程运行的远程应用程序将显示在**你的**系统上，就像在本地运行一一样。\n\
  \n这只是如何将运行在主机上的 X11 应用程序转发到你的本地系统的一个示例。可能会出现各种问题，但这些都不在 Linux+ 考试的范围之内，重要的是概念，我们已经充分涵盖了该概念。\n\
  \n### 端口转发\n\n大多数时候，当人们谈论端口转发时，是因为需要绕过某些过度严格或受控的网络或防火墙状况。请记住，这些限制和规则通常也有非常有充分的理由，所以要负责任，不要故意使用端口转发制造问题。\n\
  \n使用 SSH 转发端口有几种路径，但核心概念是相同的：你正在使用一个系统上的 ssh 客户端隧道到另一个系统上的 ssh 服务器，并使一个系统上的端口表示的服务映射或看起来连接到另一个系统。\n\
  \n通常，端口转发以三种主要方式发生：\n\n- **本地端口转发 (Local Port Forwarding)**：在这种情况下，你使一个远程端口被映射并看起来像是在你的本地系统上。类似于挂载\
  \ NFS 共享，将从远程系统端口映射到你的本地，实际上看起来就像你的本地系统正在提供该服务。\n- **远程端口转发 (Remote Port Forwarding)**：反转场景，允许你的本地系统资源被远程机器使用。例如，我可能会将远程系统的端口\
  \ `8080` 映射到我的本地 `5500` 端口，任何连接到该远程服务器 `8080` 端口的人都将传输到我的本地端口和服务。\n- **动态端口转发 (Dynamic\
  \ Port Forwarding)**：有时你不想显式地分配端口，只想让系统上的 SOCKS 代理使用动态分配的本地端口并处理所有细节。想象你需要访问会议中心网络设置不允许的端口和协议的情况，你可以使用有效的\
  \ VPN/代理来穿透本地受限的网络栈，让你能够与所需的目标主机、服务和端口自由地连接和通信。\n\n注意\n\n使用 SSH 隧道实现这些目的的完美之处在于，你不需要担心这样做会不必要地暴露本地网络或系统，你正在使用非常安全的\
  \ SSH 协议和栈来完成这一切！\n\n## 以另一个用户的身份执行命令\n\n到此时，你可能已经意识到 Telnet 协议以明文发送密码和数据，不应信任用于重要的会话和任务。安全\
  \ Shell (SSH) 套件包含一个协议、一个守护进程和客户端实用，它们使得你的主机到主机的 shell 会话安全得多——大约与在物理控制台前一样安全。\n\
  \n### sudo 命令\n\n`su` 命令的问题在于，为了为用户提供提升权限，你需要为用户提供 root 密码，然后该用户将拥有对系统的完全管理权限。\n\
  \n通常你希望允许普通用户作为 root 用户执行某些命令，而不是所有命令。例如，如果用户的工作站发生网络错误，你可能希望允许该用户重启网络服务。在某些系统上，可以通过执行以下命令来实现：\n\
  \n```bash\n# /etc/rc.d/init.d/network restart\n```\n\n要成功执行此命令，用户需要拥有 root 权限。\n\
  \n这时你要么给他们 root 密码（不要这样做！），要么通过正确且合理的方法（通过 `sudo` 命令及其伙伴工具）来执行。\n\n与其向用户提供 root\
  \ 密码，你可以设置 `sudo` 命令允许用户只运行必要的命令。要做到这一点，你需要以 root 用户身份登录，然后执行以下命令：\n\n```bash\n\
  # visudo\n```\n\n此命令允许你编辑 `/etc/sudoers` 文件，该文件允许你为特定用户提供特定命令的 root 权限。`visudo`\
  \ 命令假设假设使用 `vi` 编辑器编辑此文件。要使用不同的编辑器（例如 `nano` 编辑器），执行如下命令：\n\n```bash\n# export EDITOR=nano\n\
  ```\n\n注意\n\n![Images](img/key_topic_icon.jpg)\n\n\n\n\n\n为什么使用 `visudo` 命令而不是直接编辑\
  \ `/etc/sudoers` 文件呢？`visudo` 命令会在你退出编辑器时执行一些错误检查，以确保你没有犯格式化错误。\n\n### sudoedit\
  \ 命令\n\n授予用户编辑配置文件的权限，一个难题之一是：如果你使用 `vi`/`vim`，你本质上是赋予了用户以 root 身份运行任何命令的能力。\n\n\
  为了防止用户在以 root 身份运行 `vi`/`vim` 时，通过简单的按键操作获取 shell 访问，存在 `sudoedit` 命令，它实际上仅仅是 `sudo`\
  \ 命令中包含的一个函数的符号链接。\n\n![Images](img/key_topic_icon.jpg)\n\n`sudoedit` 命令允许你许可用户使用任何编辑器，而不仅仅是\
  \ `vi`/vim`。它还允许用户以自己的身份编辑指定的文件，而不是以 root 用户身份编辑。\n\n当用户使用 `sudoedit` 功能编辑文件时，系统会创建一个文件的临时副本，并且该副本由该用户所有。由于用户现在是临时文件的所有者，他们可以在没有\
  \ root 权限的情况下成功编辑文件。在保存文件后，由用户拥有的临时副本将被复制回原始文件位置，并恢复原始所有权；不再需要的临时副本会被丢弃。\n\n要配置\
  \ `sudoedit`，请向 `/etc/sudoers` 文件添加以下行：\n\n```\n%newsudo ALL = sudoedit /some/path/to/a/file\n\
  ```\n\n在 `/etc/sudoers` 中配置 `newsudo` 组，包含你想要使用 `sudoedit` 的用户，然后他们只需要运行该命令即可：\n\
  \n```\nsudoedit /path/to/that/file\n```\n\n`/etc/sudoers` 文件有很多选项。对于 Linux+ 认证考试，你只需要知道如何提供用户以\
  \ root 用户身份执行命令的能力。例如，如果你想让名为 `ross` 的用户账户能够以 root 用户身份运行所有命令，请添加以下行：\n\n```\nross\
  \ ALL=(ALL) ALL\n```\n\n要将用户限制为特定命令（例如 `/etc/rc.d/init.d/network` 命令），请添加以下行：\n\n\
  ```\nross ALL=(ALL) /etc/rc.d/init.d/network\n```\n\n用户要以 root 身份执行命令，需要使用 `sudo`\
  \ 命令。语法如下：\n\n```\n# sudo /etc/rc.d/init.d/network restart\n```\n\n随后用户会被提示输入自己的密码（而不是\
  \ root 密码）。如果提供了正确的密码并根据 `/etc/sudoers` 文件中的条目允许访问，命令将以 root 用户身份执行。如果用户尝试执行其未授权执行的命令，屏幕上会显示错误信息，并且该尝试会被记录。\n\
  \n### 用户权限提升\n\nLinux 系统上的用户有多种类型，了解你所登录的类型以及如何随意地提升或降低权限是非常重要的。可选的用户类型如下：\n\n-\
  \   **Root：** 这是 root 用户，是超级用户也是系统上权限最高的用户。系统中应该只有一个 root，其特征是名为 `root` UID（用户 ID）为\
  \ 0。\n-   **Standard（标准用户）：** 也称为“普通”或“常规”用户，这些是系统中的普通用户；他们没有特殊权限，UID 范围通常在 1000\
  \ 及以上。\n-   **Service（服务用户）：** 这些是为了确保系统上的每个服务或守护进程以用户身份运行而必须存在的账户，因为每个进程必须关联一个用户。这些账户不会登录；它们存在于\
  \ `/etc/passwd` 文件中，甚至可能指定的 shell 为 `/bin/nologin`。\n\n最佳安全实践是除非你需要执行特定的管理命令，否则避免以\
  \ root 用户登录。在大多数情况下，你不应该直接以 root 用户登录，而应该通过执行 `su` 命令或 `sudo` 命令来获取 root 权限。\n\n\
  **注意**\n\nwheel 组在今天的 Linux 系统中是一个特殊的存在。传统上用于 Unix 系统以允许用户获取 root 权限的 wheel 组现在通常直接与拥有\
  \ `sudo` 权限相关。\n\n如果配置 wheel 组通过 `sudo` 和 `/etc/sudoers` 文件拥有特权访问，那么将用户添加到 wheel\
  \ 组就会赋予该用户这些权限。例如，在我们的 openSUSE 系统中，wheel 组被设置为允许该组成员执行任何命令，就像 root 能够做的那样：\n\n\
  ```\n%wheel  ALL=(ALL) ALL\n```\n\n该条目通常被注释掉，但在默认文件中只需删除前面的单个 `#` 注释，即可让 wheel 组（及其成员）拥有系统的完全管理权限。\n\
  \n### su 命令\n\n要使用 `su` 命令访问另一个用户账户，请使用以下语法：\n\n```\nsu account_name\n```\n\n![Images](img/key_topic_icon.jpg)\n\
  \n例如，切换到 root 账户，执行以下命令：\n\n```\n# su root\n```\n\n这会为你提供一个 root 用户的非登录 shell。通常你想要一个登录\
  \ shell，因为它为你提供了完整的用户环境（环境变量、shell 自定义等）。这可以通过 `-l` 选项或直接使用 `-` 选项来实现：\n\n```\n\
  # su - root\n# su -l root\n```\n\n要访问普通用户账户，你必须提供账户名称。然而，如果你不提供账户名称，`su` 命令会假设你想切换到\
  \ root 账户。因此，以下命令都是等价的：\n\n-   `su - root`\n-   `su -l root`\n-   `su -`\n-   `su\
  \ -l`\n\n从 root 账户切换到普通用户账户不需要密码。这意味着 root 用户可以切换到普通用户账户来测试该账户的功能（或为用户排除故障），而无需更改该用户的密码。\n\
  \n从普通用户账户切换到任何其他账户，你必须知道你所切换到的账户的密码。\n\n**注意**\n\n某些发行版版本的 `su` 命令允许使用 X 和远程 X；只需使用\
  \ `sux` 命令代替 `su` 命令即可。这在 openSUSE 和 SUSE Linux Enterprise 发行版中最为常见。\n\n### PolicyKit\n\
  \nPolicyKit 的存在是为了对特权进程的非特权访问提供应用程序级的定义和处理。例如，你可以使用 PolicyKit 允许通过执行具有高权限的命令来执行任务的能力（和权利）。如果这听起来很像\
  \ `sudo` 命令，那是理解理解，它们的目标非常相似。\n\n区别之一是，PolicyKit 稍微简单，而且比在几乎每项操作前加上 `sudo` 命令要少麻烦得多！\n\
  \n**注意**\n\n正如 Linux+ 目标可能出现的情况，这里提到的包（PolicyKit）已被 `polkit` 包取代。然而，由于目标指定了 PolicyKit，我们必须谈论它，并在大部分时候忽略\
  \ polkit。\n\nPolicyKit 的主要优点在于它是定义和访问策略的中心，允许非特权用户执行通常需要特权的操作。\n\nPolicyKit 的本地配置保留在\
  \ `/etc/polkit-1/localauthority` 中，并使用包含文件的方法，文件包含 PolicyKit 配置并以 `.conf` 结尾，或者是更专门的\
  \ `.pkla` 文件。\n\nPolicyKit 可以配置执行这些类型操作示例包括：\n\n-   允许用户配置无线连接\n-   允许挂载和卸载 USB\
  \ 以及其他离线媒体设备\n-   让用户管理关机、重启和休眠事件\n-   允许访问上难以访问的设备，例如系统音频\n\n### pkexec 命令\n\n\n\
  \n\n\n在之前对 PolicyKit 软件包的讨论之后，`pkexec` 就变得意义重大，因为它是利用 PolicyKit 策略的最常用方式。\n\n`pkexec`\
  \ 命令在用于运行另一个命令时，将以目标用户的身份执行该命令。可以指定用户，或者如果没有指定，`pkexec` 将尝试以 root 用户身份执行目标命令。\n\n\
  例如，要以 root 用户身份执行 `lemmy.sh` 脚本，你需要输入：\n\n![Images](img/key_topic_icon.jpg)\n\n\
  ```\n# pkexec lemmy.sh\n```\n\n由于我们没有指定用户，`pkexec` 的默认行为是尝试以 root 用户运行随后的命令、脚本或可执行文件。\n\
  \n### Note\n\n不要忘记 PolicyKit 正在逐渐退出舞台，尽管 `polkit` 在很大程度上取代了它，但这些概念仍然足够相似，以至于当你在生产环境中执行此类操作时，你能够识别出其工作原理！\n\
