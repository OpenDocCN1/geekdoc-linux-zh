  **此内容正在开发中。**\n\n## 第 5 章 使用网络工具和配置文件 [此内容正在开发中。]\n\n**此内容正在开发中。**\n\n## 第 6 章 构建与安装软件\n\
  \n本章涵盖了以下主题：\n\n• 包管理\n\n• 沙盒应用\n\n• 系统更新\n\n本章涵盖的考试目标如下：\n\n• **1.6**：给定场景，构建并安装软件。\n\
  \nLinux 系统由许多软件包组成，软件包是代码、目录、文件以及支持文件的集合，通常也是预编译的应用程序二进制文件。软件包是软件世界的顶层体现，它们的构造使得分发、安装、删除和其他管理任务变得更容易，且不容易出现错误和冲突。\n\
  \nLinux 系统是为了有用的，例如作为某种应用程序服务器或允许用户读取电子邮件或浏览网页。Linux 内核非常强大，但它本身并不多；要让 Linux 系统变得有用，你需要软件。\n\
  \nLinux 有大量的软件，你只需要安装它们。根据你的发行版和软件包打包的方式，你可以通过几种方式安装软件。软件包有不同的格式，但有两种最流行：Debian\
  \ 式和 Red Hat 式。你需要了解这两种主要样式，因为许多计算环境拥有两种系统，且软件包样式取决于项目和提供的服务。\n\n此外，我们将查看新的应用沙箱领域，也称为应用容器化，通过\
  \ Snap、FlatPak 和 AppImage 实现。\n\n### “你已经知道了吗？”测试\n\n“你已经知道了吗？”测试可以帮助你评估是应该阅读整个章节，还是应该直接跳转到“考试准备”部分进行复习。如果你有疑问，请阅读整章。表\
  \ 6-1 列出了本章的主要标题和相应的“你已经知道了吗？”测试题。你可以在 附录 A “‘你已经知道了吗？’测试和复习题的答案](#appa.xhtml_appa)”中找到答案。\n\
  \n\n\n\n\n自评估的目标是衡量你对本章主题的掌握程度。如果你不知道某个问题的答案，或者只对答案部分确定，那么为了自评估，你应该将该问题标记为错误。对于你猜对的答案给自己分会歪曲自评估结果，并可能给你带来虚假的安全感。\n\
  \n1. 以下哪项最可能是 Debian/Ubuntu 包文件？\n\na. `packagename.tgz`\n\nb. `packagename.rpm`\n\
  \nc. `packagename.deb`\n\nd. `packagename.sh`\n\n2. 某类型的包被描述为 `cpio` 归档的衍 string，并添加了一些元数据。哪包类型最符合这种描述？\n\
  \na. `RPM`\nb. `Slackware`\nc. `Debian`\nd. `Gentoo`\n\n3. 以下哪项不是使用沙箱化应用程序的预期特性？\n\
  \na. 为任何和每一个发行版构建\nb. 对依赖项的完全控制\nc. 需要访问宿主机资源的权限\nd. 通过宿主机发行版更新应用程序\n\n4. Linux\
  \ 软件中流行的 3 种应用沙箱方法（`AppImage`、`Flatpak` 和 `Snap`）具有哪些共同特性？（多选）\n\na. 无需 root 权限即可运行\n\
  b. 必须从未压缩的源运行\nc. 可能同时运行多个版本\nd. 可与发行版独立更新\ne. 访问系统级资源\nf. 与厂商无关的仓库\n\n5. 哪些类型的更新最适合作为实时内核补丁（Live\
  \ Kernel Patching）更新？\n\na. 二进制\nb. 安全\nc. 特性\nd. 模块\n\n6. 这种应用沙箱方法具有“每个应用一个文件”的规范。以下哪项最能描述它？\n\
  \na. `Snapd`\nb. `Flatpak`\nc. `AppImage`\nd. `AppArmor`\n\n# 基础主题\n\n## 包管理\n\n\
  包（Package）是一个压缩归档文件，包含了组成特定命令、应用程序或一组应用程序的所有必要文件。包有多种不同的格式，例如 `RPM`、`DEB` 以及其他，但尽管格式略有不同，它们的功能是相似的。\n\
  \n### 最常见的包类型\n\n![Images](img/key_topic_icon.jpg)\n\n最常见的包类型是 `rpm`（Red Hat 包管理器）和\
  \ `deb`（Debian 包格式）文件。包可以是其他几种格式，其中主要的是压缩文件，如 `.tar`（tar 归档）、`.tgz`（使用 `gzip` 命令压缩的\
  \ tar 归档）和 `.gz`（使用 `gzip` 命令压缩的包）。\n\n压缩文件（`.tar`/`.tgz`/`.gz`）并不是可以由 `RPM` 或 `Apt`\
  \ 等包管理器安装的包。相反，它必须先解压，以便其中的文件可以从源码编译，或者如果是二进制文件，则复制到适当的执行位置。\n\n`RPM` 包文件通常采用 `cpio`\
  \ 归档格式，扩展名为 `.rpm`（例如 `application.rpm`），包含以下内容：\n\n• **Header（头部）：** 头部是一个独立的结构，定义了文件的格式和标记数据，这些数据包含了包信息、版权和版本、构建主机以及包的完整性签名。\n\
  • **Archive（归档）：** 归档包含包文件，包括安装期间运行的脚本、要复制的文件以及要创建的链接。\n\nDebian 包通常采用 ar 归档格式，扩展名为\
  \ `.deb`（例如 `application.deb`），包含以下内容：\n\n• **data.tar.gz：** 一组层次相关的文件、手动帮助页（man\
  \ pages）、链接等，在安装期间会被复制到系统中。\n• **control.tar.gz：** 所有包信息，包括版权、描述等。还包含任何在安装或删除包过程中应该运行的脚本。\n\
  \n### 包管理器\n\n包管理器的发明是为了解决软件版本泛滥以及由于多次升级或安装产生的额外或遗弃文件残留问题。\n\n包管理器跟踪哪些文件属于哪个包，哪些包依赖于其他包，以及不同类型文件的存储位置。。所有现代\
  \ Linux 发行版都以某种方式使用包管理器。\n\n### Debian 包管理\n\nDebian 以及基于 Debian 的衍生系统（如 Ubuntu）拥有一个强大的包管理系统，为管理员提供了查找、安装、查询和删除包的方法。包跟踪应用程序的各个，并帮助你确定安装给定包需要哪些其他包（依赖项），以及是否有包依赖于其他包。\n\
  \nDebian 包管理的单元单元是扩展名为 `.deb` 的文件（例如 `application.deb`），如前所述。\n\n你可以使用 `dpkg` 工具安装、删除和查询包，通常处于单包模式下。安装多个包是可能的，但由于相互锁的依赖关系，可能会变得非常麻烦。\n\
  \n要安装包及其所有依赖项，甚至从在线更新源获取新包，你需要使用如 `APT`（高级包工具）套件之类的包管理工具。\n\n`APT` 套件通常合称为 `apt-get`，它可以将许多部分的包安装、更新甚至整个系统的升级简化为几个易于记忆的命令和选项。\n\
  \n`aptitude` 和 `synaptic` 等图形和文本界面构建在 `APT` 工具之上。它们为你提供了一个比记忆命令更易使用的界面。\n\n所以，总结一下：本地包是\
  \ `.deb` 文件并用 `dpkg` 安装。APT 处理搜索远程包仓库和下载包。Aptitude 等工具提供了 APT 的图形界面。图形工具和 APT 工具使用\
  \ `dpkg` 命令作为底层的包交互工具，为其提供所需的命令、选项和参数，以有效地、方便地自动化大量包的安装、删除和更新/升级过程。\n\n#### 管理本地\
  \ Debian 包\n\n![Images](img/key_topic_icon.jpg)\n\n`dpkg` 工具操作系统上的包并可以处理你可能下载的 `.deb`\
  \ 包。如果你系统上有一个包，可以使用 `--info` 选项查看其内容，如示例 6-1 所示。\n\n**示例 6-1**——查看 .deb 文件的内容\n\n\
  ```\n# dpkg --info acct_6.5.5-1_amd64.deb\n new debian package, version 2.0.\n size\
  \ 120424 bytes: control archive=1899 bytes.\n 79 bytes, 4 lines conffiles\n 746\
  \ bytes, 18 lines control\n 1766 bytes, 27 lines md5sums\n 507 bytes, 30 lines *\
  \ postinst #!/bin/sh\n 370 bytes, 26 lines * postrm #!/bin/sh\n 163 bytes, 7 lines\
  \ * prerm #!/bin/sh\n Package: acct\n Version: 6.5.5-1\n Architecture: amd64\n Maintainer:\
  \ Mathieu Trudel-Lapierre <mathieu.tl@gmail.com>\nInstalled-Size: 380\n Depends:\
  \ dpkg (>= 1.15.4) | install-info, libc6 (>= 2.3)\n Section: admin\n Priority: optional\n\
  \ Homepage: http://www.gnu.org/software/acct/\n Description: The GNU Accounting\
  \ utilities for process and login accounting\n ...\n```\n\n包信息包含在 `.deb` 文件内部；`dpkg`\
  \ 命令为你漂亮地显示它。顶部部分描述了提供 `dpkg` 使用元数据的控制文件。文件本身为 120,424 字节，内部包含 1899 字节的控制文件归档。在该归档内部有\n\
  \n• **conffiles：** 用于在安装后配置包的文件列表。这些文件的处理方式与包中的其他文件不同；例如，在删除包时，它们不会被移除。\n\n\n\n\n\
  \n- `control`: 包含所有关于包元数据的文件，例如依赖关系。\n- `md5sums`: 文件列表及其校验和，你可以借此验证文件在任何时候都没有发生过更改。\n\
  - `postinst`: 在安装后运行的 shell 脚本。\n- `postrm`: 在移除包后运行的 shell 脚本。\n- `prerm`: 在移除包之前运行的\
  \ shell 脚本。\n\n在控制信息之后，你会看到关于包的各种信息，例如名称、版本、它适用于哪些硬件以及依赖关系。\n\n## 使用 dpkg 安装包\n\n\
  安装包最常用的方法是在当前目录下通过命令行使用以下命令之一：\n\n```bash\n# dpkg --install gcc-4.7-base_4.7.2-5_amd64.deb\n\
  # dpkg -i gcc-4.7-base_4.7.2-5_amd64.deb\n```\n\n这将返回与以下内容类似的输出：\n\n```\nSelecting\
  \ previously unselected package gcc-4.7-base:amd64.\n(Reading database ... 142987\
  \ files and directories currently\ninstalled.)\nUnpacking gcc-4.7-base:amd64 (from\
  \ gcc-4.7-base_4.7.2-5_amd64.deb) ...\nSetting up gcc-4.7-base:amd64 (4.7.2-5) ...\n\
  ```\n\n有时你可能为某个包安装依赖项。你可以先安装依赖项，也可以在同一条命令行中指定所有必要的包。后一种选项的命令如下：\n\n```bash\n# dpkg\
  \ -i gcc-4.7-base_4.7.2-5_amd64.deb\nlibgcc1_1%3a4.7.2-5_amd64.deb\n```\n\n## 移除包\n\
  \n当你需要使用 `dpkg` 命令移除包时，可以使用两种方法：`remove` 或 `purge`。`-r` 或 `--remove` 选项移除包的文件，但会在磁盘上保留任何配置文件。另一种移除包的方法是\
  \ `-P` 或 `--purge` 选项，它会移除包的所有文件，包括任何配置文件。\n\n要移除包但保留其配置文件，请使用以下命令之一：\n\n```bash\n\
  # dpkg --remove package_name\n# dpkg -r package_name\n```\n\n要彻底清除包（包括其配置文件），请使用以下命令之一：\n\
  \n```bash\n# dpkg --purge package_name\n# dpkg -P package_name\n```\n\n当包安装时，任何配置文件都会记录在\
  \ `conffiles` 文件中。你可以使用该文件来确定哪些文件在移除操作期间被保留，哪些文件在清除操作中也应该被彻底删除。\n\n## 依赖问题\n\n当你处理包时，一个预期的包安装通常会在包数据库中找到与它尝试安装的文件发生冲突的条目。此外，有时在移除过程中，某个包想要移除的文件恰好是其他包所依赖的。\n\
  \n基于 Debian 健健且不冗余的特性，使用包工具的 `--force` 选项可能会给机器带来一些非常不愉快的后果。在移除具有依赖关系的包时请务必小心，并详细阅读\
  \ `dpkg` 手页中 `force` 部分的内容。对于 Linux+ 考试，你需要知道如何强制执行操作，但不需要知道所有 20 个左右的强制选项。\n\n\
  要强制移除数据库中标记为需要重新安装的损坏包，请使用以下命令：\n\n```bash\n# dpkg --force-reinstreq package_name\n\
  ```\n\n对标记为需要重新安装的包使用 `--force-reinstreq`；它允许 `dpkg` 移除这些包。\n\n此外，你可以在 `--install`\
  \ 之后使用 `--force-depends` 选项将所有糟糕的错误信息转换为严重的警告，但工具随后会允许你执行即将进行的任何不明智的操作。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n这是一个示例：\n\n```bash\n# dpkg --install --force-depends package_name\n```\n\n最后，你可以使用\
  \ `--force-remove-essential` 选项。但请注意，覆盖依赖建议可能会导致你的系统处于损坏状态。\n\n如果你确实必须这样做（通常是根据供应商或附近的\
  \ Debian 大师的指示），你可以强制安装一个包，无论与命令和选项产生了什么冲突，如下：\n\n```bash\n# dpkg --install new_pkg.deb\
  \ --force-conflicts\n```\n\n如果你在强制跳过任何冲突后，发现该包或其他包出现问题，请记住你已经收过警告。\n\n## 查询包\n\n\
  请记住，当你查询包而不是引用本地磁盘或挂载文件系统上的 `.deb` 文件时，你实际上是在查询包数据库——即当前通过 `dpkg` 或其他包管理工具安装到系统的所有包及其文件位置的完整列表。\n\
  \n可以对当前安装的包查询大量的信息。特别特别是，你可以使用 `-l` 或 `--list` 选项列出包的存在、版本、名称和描述：\n\n```bash\n#\
  \ dpkg --list krb*\n# dpkg -l krb*\n```\n\n你可以使用单个包名（例如与 Kerberos 相关包的 `krb5-user`）或之前的文件名来查看如下输出所示的列表：\n\
  \n```\n# dpkg --list krb*\nDesired=Unknown/Install/Remove/Purge/Hold\n|\nStatus=Not/Inst/Conf-files/Unpacked/halF-conf/Half-inst/trig-aWait/Trig-pend\n\
  |/ Err?=(none)/Reinst-required (Status,Err: uppercase=bad)\n||/ Name Version Architecture\
  \ Description\n+++-=================-===============-===============-\n==============================\n\
  un krb5-doc <none> (no description available)\nii krb5-locales 1.10.1+dfsg-5+all\
  \ all Internationalization\nsupport for MIT Kerberos\nun krb5-user <none> (no description\
  \ available)\n```\n\n在一些表头之后，输出显示有三个以 `krb5` 开头的包。其中两个以字符串 `un` 开头的行是未安装的，而 `krb5-locales`\
  \ 已安装版本为 1.10.1。Debian 包系统会向你显示以前在系统上安装过的包，这与其他系统不同。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n你可以使用 `-s` 或 `--status` 选项检查特定包或多个包的状态：\n\n```bash\n# dpkg --status krdc\n```\n\
  \n返回的输出是你使用 `--info` 选项内容的简缩版本。\n\n你可以使用 `-L` 或 `--listfiles` 选项查看包安装的文件：\n\n```bash\n\
  # dpkg --listfiles coreutils\n```\n\n这将产生类似于以下输出（已截断以适应显示）：\n\n```\n/.\n/bin\n/bin/cat\n\
  /bin/chgrp\n/bin/chmod\n/bin/chown\n```\n\n使用 `-S` 或 `--search` 选项可以通过包数据库搜索磁盘上的安装文件，例如：\n\
  \n```bash\n# dpkg -S apt.conf\n```\n\n以下输出包含了从数据库条目中找到的 `apt.conf` 文件的各种位置：\n\n\
  ```\napt: /etc/apt/apt.conf.d/01autoremove\nunattended-upgrades:\n/etc/apt/apt.conf.d/50unattended-upgrades\n\
  apt: /usr/share/man/ja/man5/apt.conf.5.gz\napt: /usr/share/man/pt/man5/apt.conf.5.gz\n\
  apt: /usr/share/doc/apt/examples/apt.conf\napt-listchanges: /etc/apt/apt.conf.d/20listchanges\n\
  aptdaemon: /etc/apt/apt.conf.d/20dbus\naptdaemon: /etc/dbus-1/system.d/org.debian.apt.conf```\n\
  \n输出列出了所有包含 `apt.conf` 文件的包。包名在左侧，文件名在右侧。注意搜索字符串可以出现在文件名的任何位置，即使是目录名。\n\n## 重配置包\n\
  \n某些包包含在安装包时执行的配置工具。该工具使得你安装的软件的初始设置变得简单。如果一个包包含此类配置工具，你可以使用 `dpkg-reconfigure`\
  \ 命令加上包名再次运行该实用程序。\n\n图 6-1 显示了了使用此命令运行 Postfix 邮件服务器配置的输出：\n\n```bash\n# dpkg-reconfigure\
  \ postfix\n```\n\n![Images](img/06fig01.jpg)\n\n\n\n\n\n**图 6-1**–使用 `dpkg-reconfigure`\
  \ 重新配置 Postfix\n\n### 使用仓库\n\nCD/DVD 或 CD/DVD 的 ISO 镜像可能包含有限的软件（或软件包）。对于任何发行版，可用软件量都在不断扩大，可以在网上找到，可以是单一源代码集、可下载的预编译软件包，或者是官方、半官方和非常非官方位置的组合，统称为*仓库*（repositories）。\n\
  \nDebian/Ubuntu 中的仓库可能会让人感到困惑，因为 Ubuntu 和 Canonical 之间关系紧密，因此在讨论仓库时，无法避免或不显示 Main\
  \ 或官方 Canonical 支持的仓库。为了简单起见，我们将从 Ubuntu 发行版的角度讨论仓库，你可以查阅学习标准 Debian 可能需要的任何内容。\n\
  \nAPT 工具通过维护一个关于远程服务器上可用软件包的本地缓存（包括依赖项）来工作。这意味着你搜索本地缓存的速度要比查询远程服务器快得多。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n远程仓库列表存储在 `/etc/apt/sources.list` 以及 `/etc/apt/sources.list.d` 下的各个文件中。每一行代表一个仓库。\n\
  \n一个 `sources.list` 文件可能看起来示例 6-2。\n\n**示例 6-2**–默认源列表文件\n\n```\ndeb http://cdn.debian.net/debian/\
  \ wheezy main\ndeb-src http://cdn.debian.net/debian/ wheezy main\n\ndeb http://security.debian.org/\
  \ wheezy/updates main\ndeb-src http://security.debian.org/ wheezy/updates main\n\
  \n# wheezy-updates, 以前称为 ‘volatile’\ndeb http://cdn.debian.net/debian/ wheezy-updates\
  \ main\ndeb-src http://cdn.debian.net/debian/ wheezy-updates main\n```\n\n### 什么是仓库？\n\
  \n![Images](img/key_topic_icon.jpg)\n\n从简单上说，仓库是系统可以寻址的软件集合或归档。仓库可以存在于本地磁盘、连接或挂载的磁盘上，甚至可以通过\
  \ HTTP 或 FTP 等共享协议跨越局域或广域网络存在于服务器上。\n\nUbuntu 仓库有多种类型，包括\n\n* **Main：** Canonical\
  \ 支持的自由和开源软件包\n* **Universe：** 社区维护的自由和开源软件包\n* **Restricted：** 设备的专有驱动程序\n* **Multiverse：**\
  \ 具有版权或法律问题的软件\n\n通常，Ubuntu 安装媒体包含提取自最新版本 Main 和 Restricted 仓库的软件包，以便你实际上可以完成一个正确的安装。在现代\
  \ Linux 中，安装只是开始；为了获取更新和额外软件，有必要配置正确的仓库。\n\n### 查看已配置的仓库\n\n在安装期间，系统通过在 `/etc/apt/sources.list`\
  \ 文件中放置相应的条目，或者如果你愿意，通过在 `/etc/apt/sources.list.d` 目录中放置以 `.list` 结尾的文件来配置若干默认仓库。\n\
  \n一个填充好的 `sources.list` 文件示例在示例 6-3 所示。\n\n**示例 6-3** sources.list 文件的内容\n\n```\n\
  # deb cdrom:[Ubuntu 18.04.1 LTS _Bionic Beaver_ - Release amd64 (20180725)]/\nbionic\
  \ main restricted\n# 查看 http://help.ubuntu.com/community/UpgradeNotes 如何升级到\n# 较版本的发行版。\n\
  deb http://us.archive.ubuntu.com/ubuntu/ bionic main restricted\n# deb-src http://us.archive.ubuntu.com/ubuntu/\
  \ bionic main restricted\n\n## 在发行版最终发布后产生的重大错误修复 \n## 更新。\ndeb http://us.archive.ubuntu.com/ubuntu/\
  \ bionic-updates main restricted\n# deb-src http://us.archive.ubuntu.com/ubuntu/\
  \ bionic-updates main restricted\n## 注意：此仓库中的软件完全不受 Ubuntu \n## 团队支持。此外，请注意 universe\
  \ 中的软件将不会收到\n## 来自 Ubuntu 安全团队的任何审查或更新。\ndeb http://us.archive.ubuntu.com/ubuntu/\
  \ bionic universe\n# deb-src http://us.archive.ubuntu.com/ubuntu/ bionic universe\n\
  deb http://us.archive.ubuntu.com/ubuntu/ bionic-updates universe\n# deb-src http://us.archive.ubuntu.com/ubuntu/\
  \ bionic-updates universe\n## 注意：此仓库中的软件完全不受 Ubuntu \n## 团队支持，并且可能不受免费许可。请自行确认\n\
  ## 使用该软件的权利。此外，请注意 multiverse 中的\n## 软件将不会收到 Ubuntu \n## 团队的任何审查或更新。\ndeb http://us.archive.ubuntu.com/ubuntu/\
  \ bionic multiverse\n# deb-src http://us.archive.ubuntu.com/ubuntu/ bionic multiverse\n\
  deb http://us.archive.ubuntu.com/ubuntu/ bionic-updates multiverse\n# deb-src http://us.archive.ubuntu.com/ubuntu/\
  \ bionic-updates multiverse\n```\n\n在此示例中，几行包含以 `#`（井或注释）字符开头的注释。未注释的行是实际的仓库配置。\n\
  \n仓库行的分解如下：\n\n* **deb：** 这表示该仓库包含预编译或二进制软件包；它是最常见的仓库类型。\n* **deb-src：** 这意味着该仓库包含源代码软件包，这些代码组合在一起便于传输和“安装”，或复制到用户系统。\n\
  * **URL：** 在大多数情况下（即四个主要的仓库通道），URL 为 `http://us.archive.ubuntu.com/ubuntu/`。查阅 `www.ubuntu.com`\
  \ 上的官方镜像列表以获取更多选项。\n* **Trusty：** 这是 Ubuntu 发行版的发布名称或版本，并影响从仓库中拉取的软件。\n* **Main：**\
  \ 这是组件或部分的名称，全小写并用空格隔开。可以有多个组件或部分。\n\n### 添加仓库\n\n要从命令行手动添加仓库，你可以编辑 `/etc/apt/sources.list`\
  \ 文件，向 `/etc/apt/sources.list.d` 目录添加包含相应行的文件，或者使用 `add-apt-repository` 命令，如示例 6-4\
  \ 所示：\n\n**示例 6-4** 通过 add-apt-repository 命令添加仓库\n\n```\n# sudo add-apt-repository\
  \ “deb\nhttp://us.archive.ubuntu.com/ubuntu/ bionic universe”\nHit:1 http://us.archive.ubuntu.com/ubuntu\
  \ bionic InRelease\nGet:2 http://us.archive.ubuntu.com/ubuntu bionic-updates InRelease\
  \ [88.7 kB]\nGet:3 http://security.ubuntu.com/ubuntu bionic-security InRelease [83.2\
  \ kB]\nGet:4 http://us.archive.ubuntu.com/ubuntu bionic-backports InRelease [74.6\n\
  kB]\nGet:5 http://us.archive.ubuntu.com/ubuntu bionic-updates/ main i386 Packages\n\
  [389 kB]\nGet:6 http://us.archive.ubuntu.com/ubuntu bionic-updates/ main amd64 Packages\n\
  [437 kB]\nGet:7 http://us.archive.ubuntu.com/ubuntu bionic-updates/ main\nTranslation-en\
  \ [164 kB]\nGet:8 http://security.ubuntu.com/ubuntu bionic-security/ main i386 Packages\n\
  [164 kB]\nGet:9 http://security.ubuntu.com/ubuntu bionic-security/ main amd64 Packages\n\
  [206 kB]\nGet:10 http://security.ubuntu.com/ubuntu bionic-security/ main Translation-en\
  \ [81.0 kB]\nFetched 1687 kB in 1s (1376 kB/s)\nReading package lists... Done\n\
  ```\n\n此过程向 `/etc/apt/sources.list` 文件添加相应的仓库行，使得该软件可以被查询、安装和使用。\n\n虽然你可以使用 `apt-add-repository`\
  \ 命令执行许多操作，包括添加、删除和添加时自动更新，但传统的做法是使用你喜欢的文本编辑器直接对 `/etc/apt/sources` 的文件和目录树进行更改，甚至使用图形化软件工具，这些超出了本文讨论的范围。\n\
  \n#### 安装远程软件包\n\n\n\n\n\n现在你已经了解什么是软件库以及如何将它们添加到系统中，你可以使用 `apt-get` 实用程序进行大多数远程软件安装操作。每次调用\
  \ `apt-get` 后都会跟着一个指示执行操作的命令。使用 `install` 命令来安装软件包，如示例 6-5 所示。\n\n### 示例 6-5–安装远程软件包\n\
  \n```\n# sudo apt-get install nginx-light\n[sudo] password for tux:\nReading package\
  \ lists... Done\nBuilding dependency tree\nReading state information... Done\nThe\
  \ following additional packages will be installed:\n  libnginx-mod-http-echo nginx-common\n\
  Suggested packages:\n  fcgiwrap nginx-doc\nThe following NEW packages will be installed:\n\
  \  libnginx-mod-http-echo nginx-common nginx-light\n0 upgraded, 3 newly installed,\
  \ 0 to remove and 8 not upgraded.\nNeed to get 449 kB of archives.\nAfter this operation,\
  \ 1,503 kB of additional disk space will be used.\nDo you want to continue? [Y/n]\
  \ y\nGet:1 http://us.archive.ubuntu.com/ubuntu bionic-updates/ main\namd64 nginx-common\
  \ all 1.14.0-0ubuntu1.2 [37.4 kB]\nGet:2 http://security.ubuntu.com/ubuntu bionic-security/universe\n\
  amd64 libnginx-mod-http-echo amd64 1.14.0-0ubuntu1.2 [21.3 kB]\nGet:3 http://security.ubuntu.com/ubuntu\
  \ bionic-security/universe\namd64 nginx-light amd64 1.14.0-0ubuntu1.2 [390 kB]\n\
  Fetched 449 kB in 1s (448 kB/s)\nPreconfiguring packages ...\nSelecting previously\
  \ unselected package nginx-common.\n(Reading database ... 163823 files and directories\
  \ currently installed.)\nPreparing to unpack .../nginx-common_1.14.0-0ubuntu1.2_all.deb\
  \ ...\nUnpacking nginx-common (1.14.0-0ubuntu1.2) ...\nSelecting previously unselected\
  \ package libnginx-mod-http-echo.\nPreparing to unpack .../libnginx-mod-http-echo_1.14.0-0ubuntu1.2_amd64.deb\n\
  ...\nUnpacking libnginx-mod-http-echo (1.14.0-0ubuntu1.2) ...\nSelecting previously\
  \ unselected package nginx-light.\nPreparing to unpack .../nginx-light_1.14.0-0ubuntu1.2_amd64.deb\
  \ ...\nUnpacking nginx-light (1.14.0-0ubuntu1.2) ...\nProcessing triggers for ufw\
  \ (0.35-5) ...\nProcessing triggers for ureadahead (0.100.0-20) ...\nSetting up\
  \ nginx-common (1.14.0-0ubuntu1.2) ...\nCreated symlink /etc/systemd/system/multi-user.target.wants/nginx.\
  \ service\n /lib/systemd/system/nginx.service.\nProcessing triggers for systemd\
  \ (237-3ubuntu10.6) ...\nProcessing triggers for man-db (2.8.3-2ubuntu0.1) ...\n\
  Setting up libnginx-mod-http-echo (1.14.0-0ubuntu1.2) ...\nSetting up nginx-light\
  \ (1.14.0-0ubuntu1.2) ...\nProcessing triggers for ureadahead (0.100.0-20) ...\n\
  Processing triggers for ufw (0.35-5) ...\n```\n\n示例 6-5 通过 `apt-get install nginx-light`\
  \ 安装了 `nginx-light` 软件包。程序判断也需要 `nginx-common` 软件包，因此两个软件包都会下载并安装。此时还会运行包括 `dpkg-reconfigure`\
  \ 在内的任何设置脚本。\n\n![图像](img/key_topic_icon.jpg)\n\n最后，请注意 `apt-get` 和 `dpkg` 命令之间的区别，特别是关于第一个选项。`apt-get`\
  \ 命令开头没有短横线或多个短横线，而 `dpkg` 命令有。例如，`dpkg -i` 安装本地软件包，而 `apt-get install` 安装远程软件包。不要被任何试图混淆这两者的问题所误导，例如\
  \ `apt-get --install pkgname`。\n\n#### 使用缓存\n\nAPT 工具通过维护远程服务器上可用软件包（包括依赖项）的本地缓存来工作。搜索本地缓存的速度比查询远程服务器快得多。\n\
  \n在修改 `sources.list` 或获取任何上游更改后，必须更新软件包缓存。通过运行 `apt-get update` 可以实现这一点。\n\n当 APT\
  \ 缓存是最新的，你可以使用 `apt-cache` 命令调查软件包：\n\n- `apt-cache search *term*`：搜索匹配术语的软件包\n\
  - `apt-cache show *package_name*`：显示指定软件包的信息，包括描述和依赖项\n- `apt-cache showpkg *package_name*`：显示软件包的更多技术细节，例如什么依赖于它、它依赖什么以及它提供了哪些服务\n\
  \n#### 升级系统\n\n系统安装了许多软件包——数百个甚至数千个。这些软件包中的每一个在某些可能都需要更新。更新的形式有：\n\n- 安全更新：修复软件包中可能导致坏人在机器上执行坏事的问题\n\
  - 错误修复：修正软件中导致其运行不正常、崩溃甚至丢失数据的问题\n- 功能改进：更新到某些软件的最新版本\n\n要更新特定软件包，如下所示重新安装该软件包：\n\
  \n```\n# apt-get install cpio\nReading package lists... Done\nBuilding dependency\
  \ tree\nReading state information... Done\nSuggested packages:\n libarchive1\nThe\
  \ following packages will be upgraded:\n cpio\n```\n\n输出的最后两行显示 `apt-get` 是升级该软件包而不是重新安装它。如果\
  \ `cpio` 未被安装，它将会被安装。如果当软件包缺失时不安装它是至关重要的，请添加 `--only-upgrade` 长选项。\n\n逐个软件包地更新是很枯燥的。你可以运行\
  \ `apt-get dist-upgrade` 一次升级系统上的所有软件包。如果你运行的是较为保守的系统，使用 `apt-get upgrade` 是一个更安全的选择。这两个升级选项之间的区别在于，`dist-upgrade`\
  \ 移除一些少量软件包以处理依赖问题，而 `upgrade` 宁愿失败也不会移除软件包。\n\n#### 移除软件包\n\n总有一天你想完全摆弃一个软件包。`apt-get`\
  \ 命令有两个选项：`remove` 和 `purge`。区别在于 `remove` 会留下配置文件，而 `purge` 则会完全删除它们。\n\n#### 图形化管理器\n\
  \n有时在界面中查看软件包管理是有用的，你可以图形化地查看软件包而不是在命令行操作。Debian 提供了两个图形化软件包管理器：aptitude 和 synaptic。它们都是\
  \ APT 工具的前端。Aptitude 有文本模式界面，而 Synaptic 是完全图形化的。图 6-2 显示了两者并列，Synaptic 运行在左侧，Aptitude\
  \ 运行在右侧的终端窗口内。\n\n![生成的计算机截图](img/06fig02.jpg)\n\n**图 6-2**–图形化软件包管理器\n\n### RPM\
  \ 和 YUM 软件包管理\n\n![图像](img/key_topic_icon.jpg)\n\nRPM 不仅指软件包格式，还指 `rpm` 命令和 RPM\
  \ 数据库。RPM 软件包管理风格的组件如下：\n\n- **RPM 数据库**：管理系统中 RPM 的文件集合\n- **软件包文件**：以 `.rpm` 扩展名分发的\
  \ RPM 格式软件包\n- **rpm 命令**：用于所有的软件包安装、删除和查询任务\n\n图形化软件包管理工具（如 ggnorpm 或内置在各种文件管理器（如\
  \ Nautilus 和 Konqueror）中的 RPM 处理程序）通常只是文本模式 `rpm` 命令的前端，并为安装软件包提供了一个友好的界面。\n\n>\
  \ 注意：顺便提一下，在其他发行版中广泛使用之前，RPM 最初代表 Red Hat Package Manager（红帽软件包管理器）。将系统称为 RPM Package\
  \ Manager 会引起你办公室里老鸟们的不满，就像你把银行的自动取款机称为“ATM machine”一样。\n\n#### RPM 数据库\n\nRPM 数据库是\
  \ Berkeley 数据库文件的集合，它们共同组系统中安装的软件包以及这些软件包所安装的文件的数据库。\n\n\n\n\nRPM 数据库位于 `/var/lib/rpm`\
  \ 目录。该目录包含许多二进制格式的文件，供 `rpm` 命令使用。幸运的是，你不需要了解该目录中的所有文件及其用途，只需要知道它们存在且处于未损坏的状态即可。\n\
  \n对 RPM 数据库的修改限制限于 root 用户。非特权用户可以查询此数据库并对已安装的软件包进行验证。\n\n在频繁使用后，RPM 数据库可能会过时或损坏，可能需要重新构建。要从已安装软件包的头文件重建数据库，你需要以\
  \ root 用户身份使用以下命令：\n\n```\n# rpm --rebuilddb\n```\n\n除非发现错误，否则此命令不会产生输出；即使如此，这些错误也纯粹是信息性的，对解决问题没有太大帮助。\n\
  \n一次只能有一个用户使用数据库。这可以防止数据损坏，并防止两个人相互覆盖安装软件。如果你不小心在其中一个 `rpm` 命令锁定数据库时尝试运行另一个 `rpm`\
  \ 命令，你会看到以下内容：\n\n```\nwarning: waiting for transaction lock on\n/var/lib/rpm/.rpm.lock\n\
  ```\n\n此消息仅表示数据库正在使用中，目前无法为额外的任务锁定。这防止了多个系统管理员因执行不兼容的任务而导致损坏。\n\n## RPM 软件包文件\n\n\
  ![Images](img/key_topic_icon.jpg)\n\nRPM 软件包有两种类型：源码包和二进制包。二进制 RPM 文件是一个离散包，安装时会将编译后的二进制文件复制到指定位置，以及其他关联文件（如文档和配置）以及运行该包所需的任何其他文件。\n\
  \n源码 RPM 文件是安装软件包所需的源代码文件集合，外加上一些从源码构建二进制 RPM 的指令。\n\n已安装的软件包与未安装的软件包文件之间存在重要区别。已安装软件包的信息来自\
  \ RPM 数据库，而未安装软件包的信息来自 RPM 文件本身。在安装 RPM 文件后，就不再需要原始的 RPM 文件了。\n\n在大多数情况下，RPM 软件包包含一组文件和配置脚本，构成了一个软件程序或应用程序。显著的例外是专门用于放置文本配置文件的包，例如\
  \ `/etc` 目录下的文件。\n\n![Images](img/key_topic_icon.jpg)\n\nRPM 软件包至少应包含以下内容：\n\n-\
  \ 压缩的二进制应用程序文件\n- 软件包软件的名称和版本\n- 构建日期以及构建主机\n- 软件包的描述及其用途\n- 所需的校验和依赖项\n\n### 软件包命名规范\n\
  \n已安装的通过短名称，尽管某些操作要求使用长名称。通常，当存在多个短名称相同的软件包时，删除操作需要长名称。\n\n这是一个短软件包名称的示例：\n\n```\n\
  wireshark\n```\n\n这是一个长软件包名称的示例：\n\n```\nwireshark-2.6.4-1.fc30\n```\n\n要找到安装了同一软件不同版本的两个软件包，请使用：\n\
  \n```\n# rpm -q kernel\n5.19.0-39-generic.fcXX.x86_64\n4.31.0-13-generic.fcXX.x86_64\n\
  ```\n\n如果你使用 `-l` 和 `-i` 选项查看文件列表和信息页，查看特定软件包的信息可能会很困难。大多数情况下，你只想查看其中一个软件包的信息，因此为了只查看该软件包的详情，你必须在查询中使用长名称（`5.19.0-39-generic.fcXX`），这可以在查询中隔离出该特定的软件包。\n\
  \n## rpm 命令\n\n![Images](img/key_topic_icon.jpg)\n\n文本模式 `rpm` 软件包工具用于对系统上的软件包执行所有操作，无论是已安装并在\
  \ RPM 数据库中的，还是未安装并在磁盘上的。\n\n使用 `rpm` 命令的常用操作包括：\n\n- 安装软件包\n- 升级软件包\n- 移除和卸载软件包\n\
  - 查询 RPM 数据库信息\n- 验证软件包文件\n- 检查已安装文件\n\n`rpm` 命令的关键字和选项有几种格式。常用选项是单字母（例如用于安装的 `-i`）。几乎总会有匹配的长选项，且某些选项仅以长格式出现。\n\
  \n**注意**：在 Linux+ 考试中，你可能会在多个位置看到长选项，要么在短选项直接之后，要么在整个命令的末尾。重要的是要尝试过长选项，并知道你可以将它们附加在末尾，只要没有其他内容依赖于该选项的位置即可。\n\
  \n### 软件包验证\n\n出于安全考虑，对于从发行版网站以外的任何源下载的软件包，验证或检查其签名是非常重要的；否则，你可能会安装恶意软件。RPM 使用两种检查来确保软件包的完整性：MD5\
  \ 和 PGP（或其开源变体 GPG）。\n\nMD5 作为校验和，确保软件包内容自创建以来没有更改。PGP 或 GPG 签名与特定的个人或组织绑定，表明该个人或组织创建了该软件包。\n\
  \n验证软件包通常访问或安装软件包时，尽管也可以显式触发。要检查 `R` 统计环境的 MD5 校验和 GPG 签名，你可以使用以下命令：\n\n```\n# rpm\
  \ -K R-3.5.1-1.fcXX.x86_64.rpm\n```\n\n这将返回以下输出：\n\n```\nR-3.5.1-1-fcXX.x86_64.rpm:\
  \ RSA sha1 ((MD5) PGP) md5 NOT OK (MISSING KEYS: (MD5) PGP#8e1431d5)\n```\n\n`NOT\
  \ OK` 的出现表示签名无法验证。从发行网站导入密钥可以解决问题。例如，如果你在 Fedora 系统上工作，可以执行以下操作：\n\n```\n# rpm --import\
  \ https://getfedora.org/static/8E1431D5.txt\n# rpm -K R-3.5.1-1-fcXX.x86_64.rpm\n\
  R-3.1.2-1-fcXX.x86_64.rpm: rsa sha1 (md5) pgp md5 OK\n```\n\n对于 Linux+ 考试，你只需要知道签名有\
  \ MD5 和 GPG 两种，加上 `--checksig` 和 `-K` 选项。关键是要确保你手中的软件包是维护者的原始包，而不是一个充满木马和根内核的包。\n\
  \n### 软件包安装\n\n![Images](img/key_topic_icon.jpg)\n\n通过软件包安装软件需要 root 权限、`rpm` 命令以及一个或多个软件包。在安装之前，`rpm`\
  \ 命令会检查以下内容：\n\n- 有足够的可用磁盘空间。\n- 现有文件不会被覆盖。\n- 软件包中列出的所有依赖项已满足。\n\n你至少使用 `-i` 选项（或\
  \ `--install`）安装软件包，通常还可以包含其他改进体验的选项。要安装 `R` 软件包并获取进度条（由屏幕打印的井号组成）和安装过程的详细信息，请使用以下命令：\n\
  \n```\n# rpm -ivh R-3.5.1-1-fcXX.x86_64.rpm\nPreparing... #################################\
  \ [100%]\nUpdating / installing...\n 1: R-3.5.1-1-fcXX #################################\
  \ [100%]\n```\n\n这些选项对于安装一组软件包也有效。不要像之前那样指定单个软件包，而是指定一个文件通配符（file glob）：\n\n```\n\
  # rpm -ivh *.rpm\n```\n\n通配符可以用于安装和升级，但不能用于移除软件包，因为通配符运算符 `*` 展开匹配当前目录下的文件，而不是 RPM\
  \ 数据库中的软件包。目前，你只需要理解 `*.rpm` 意味着“任何以 `.rpm` 结尾的文件”。\n\n### 附加安装选项\n\n\n\n\n\n每当你安装\
  \ RPM 包时，请记住可能会出现特殊情况，例如系统上存在某些 `RPM` 并并不感知的文件，但这些文件将被软件包的内容所覆盖。这种情况通常发生在有人手动安装软件时，或者之前的软件包操作失败时。\n\
  \n此类情况可以通过 `--replacefiles` 或 `--force` 选项来处理。（`--force` 选项会覆盖许多此类安全保护措施，包括 `--replacefiles`，后者仅会覆盖重名文件保护。）例如，如果你尝试安装一个名为\
  \ `tarfoo-1.2-3.i386.rpm` 的包，而它发现系统上有一个文件将被包中的某个文件覆盖，你将收到一条相应的错误信息，且安装失败：\n\n```\n\
  # rpm -ivh tarfoo-1.2-3.i386.rpm\ntarfoo /etc/tarfoo.conf conflicts with file from\
  \ foobar-1.1\n```\n\n解决方案是检查引起冲突的文件，如果它不需要则将其删除，或者使用此命令强制执行：\n\n```\n# rpm -ivh\
  \ --force tarfoo-1.2-3.i386.rpm\n```\n\n如果软件包由于未解决的依赖关系无法安装，你可以（尽管这有点愚蠢！）使用 `--nodeps`\
  \ 选项让 `rpm` 命令忽略依赖关系。在没有明确解决方案或不了解依赖项从何处来的情况下使用 `--nodeps`，几乎会在你尝试使用软件包提供的软件时导致问题。\n\
  \n例如，如果你尝试安装 `pebkac` 软件包，而它存在依赖问题，它看起来可能像这样：\n\n```\n# rpm -ivh pebkac.1-1.fcXX.x86_64.rpm\n\
  ```\n\n这会返回如下输出：\n\n```\nerror: Failed dependencies:\n id10t = 3.5.1-1-fcXX is needed\
  \ by pebkac.5.1-1-fcXX.x86_64\n loosenut = 3.5.1-1-fcXX is needed by pebkac.5.1-1-fcXX.x86_64\n\
  \ hubproblem = 3.5.1-1-fcXX is needed by pebkac.5.1-1-fcXX.\nx86_64\n```\n\n如果你在没有发行版厂商建议或支持专业建议的情况下使用\
  \ `--nodeps` 选项，你面临着严重搞乱系统的风险。你可能会严重地损坏软件，以至于完全重装成为唯一的选择。\n\n### 验证软件包的完整性\n\n在某些情况下，你可能需要验证软件包是否运行正常。例如，如果用户抱怨运行软件包自带的软件时出现问题，或者你怀疑有人篡改了你的计算机，你可能想要验证软件包。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n使用 `-V` 选项（或 `--verify`）如下所示验证已安装的 RPM 包：\n\
  \n```\n# rpm -V logrotate\nS.5....T. c /etc/logrotate.conf\n```\n\n软件包的状态以九个字符的形式返回，表示九项不同测试的结果：\n\
  \n- **S**: 文件大小不同。\n- **M**: 模式不同（权限或文件类型）。\n- **5**: MD5 校验和不同；这在 `--checksig`\
  \ 中也能看到。\n- **D**: 设备的主/次设备号不匹配。\n- **L**: 存在 `readLink(2)` 路径问题。\n- **U**: 用户所有权已更改。\n\
  - **G**: 组所有权已更改。\n- **T**: 修改时间与原始时间不同。\n- **P**: 文件设置的权限（capabilities）不同。\n\n\
  九项测试之后是一个属性标记，帮助你理解该文件是否应该作为正常操作的一部分发生变化。最常见的选项是配置文件，由字母 `c` 表示。\n\n输出显示 `/etc/logrotate.conf`\
  \ 是一个配置文件，自 RPM 安装以来，其大小、内容和修改时间都发生了变化。\n\n变化并不总是坏事。配置文件经常变化，因为发行版提供的默认设置可能与当前需求符。邮件配置、日志清理策略和\
  \ Web 服务器配置都是经常被自定义的内容，因此显示为变化。如果你预计它们会变化，可以忽略这些输出，这就是为什么配置文件有单独的属性标记。如果你看到二进制文件（如\
  \ `/bin/ls`）发生变化，你应该保持警惕。\n\n![Images](img/key_topic_icon.jpg)\n\n要验证系统上所有软件包的状态，你需要添加\
  \ `-a` 而不是指定包名，如下：\n\n```\n# rpm -Va\n```\n\n**注意**\n\n如果你选择运行 `rpm -Va` 命令，它将尝试验证系统中由每个软件包安装的每个文件的九个状态点，这可能会/将花费长时间并消耗大量\
  \ CPU。\n\n如果你想记录配置文件的状态以便与未来的日期进行比较，可以使用此命令检查系统上每个配置文件的状态并写入文件：\n\n```\n# rpm -Vac\
  \ > /root/somelog.txt\n```\n\n### 刷新 (Freshening) 与 升级 (Upgrading)\n\n对新安装的系统进行日常维护可能涉及作为软件包更新下载的更新和修复。将这些更新和修复妥善应用到系统需要一些技巧，特别是对于必须保持尽可能稳定的系统，或者在没有经过严格测试的情况下不添加新软件的系统。\n\
  \n`-U` 和 `--upgrade` 选项设计用于安装或将软件包升级到最新版本。这些选项的一个有趣的副作用是会移除目标软件包的所有其他版本，只保留安装最新版本。\n\
  \n例如，以下命令将系统升级到从发行版厂商下载的特定补丁和修复目录中 RPM 的最新版本：\n\n```\n# rpm -U *.rpm\n```\n\n`-U`\
  \ 和版权 upgrade` 选项会升级已安装的软件包，并安装未安装的软件包。\n\n使用 `-F` 和 `--Freshen` 选项刷新系统在一个重要方面有所不同：如果软件包尚未安装而你尝试用新的\
  \ RPM 刷新它，则将跳过安装。如果软件包已经安装，刷新的行为与升级相同。\n\n例如，你使用以下命令将包含安全补丁和修复的 RPM 文件目录应用到防火墙或其他安全服务器上：\n\
  \n```\n# rpm -Fvh *.rpm\n```\n\n此功能对于本地软件包缓存更新非常有用，在这种情况下，你将最新的补丁和修复下载到本地网络资源，并希望在机器上运行脚本将它们更新到最新的安全发布。\n\
  \n我构出的解释这一过程的最有趣的类比之一是你在酒吧喝完一杯鸡尾酒发生的情况：`-U` 可以得到一个完全不同的或相同的，因为杯是空的；而如果你只喝了一半被问及是否要加汤时，你当然会用相同的配料直接\
  \ `--Freshen` 它。\n\n### 移除软件包\n\n移除软件包或一组软件包由使用 `-e` 或 `--erase` 选项组成，并需要 root 权限。移除软件包的依赖问题可能更加棘手，因为随着时间的推移，软件包可能会深埋在依赖树中。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n移除没有依赖关系的软件包很容易。要移除 `tarfoo` 软件包，你使用以下命令：\n\
  \n```\n# rpm -e tarfoo\n```\n\n通常没有输出，软件包被移除，系统返回提示符。\n\n当你有多个具有相同短名称的软件包（例如内核）时，麻烦就开始了。当系统中有两个版本的内核包时，如所示查询数据库软件包会返回两个包的长格式名称：\n\
  \n```\n# rpm -q kernel\n5.19.0-39-generic.fcXX.x86_64\n4.31.0-13-generic.fcXX.x86_64\n\
  ```\n\n如果你尝试通过短名移除软件包，你会得到此错误：\n\n```\n# rpm -e kernel\nerror: “kernel” specifies\
  \ multiple packages:\n 5.19.0-39-generic.fcXX.x86_64\n 4.31.0-13-generic.fcXX.x86_64\n\
  ```\n\n相反，请使用软件包的长名：\n\n```\n# rpm -e 5.19.0-39-generic.fcXX\n```\n\n\n\n\n你可以通过一条命令删除两个软件包，如下所示：\n\
  \n```\n# rpm -e kernel --allmatches\n```\n\n如果操作成功，则不会返回输出；你将直接返回命令行提示符。如果你不想同时删除这两个软件包，唯一的选择是指定你想要删除的软件包的完整名称。\n\
  \n### 其他删除选项\n\n有时，你需要强制删除某个软件包，或者无论会产生什么损坏的依赖关系都要删除它。例如，你可能通过强制删除并重新安装某个损坏的软件包来修复它，从而刷新那些损坏的文件和链接。（你应该在支持专业人员的建议下这样做，而不是根据你在六年前的论坛上找到的某个帖子！）\n\
  \n![Images](img/key_topic_icon.jpg)\n\n要删除一个被其他软件包依赖的包（包），请使用以下命令：\n\n```\n# rpm\
  \ -e foobar --nodeps\n```\n\n在删除你无法替换的软件包，或者当你没有原始软件包文件可供重新安装时，要格外小心。你需要找到原始软件包或从源代码重新构建它。如果你删除了其他软件包所依赖的软件包，那些软件包将无法运行。\n\
  \n删除软件包的过程可能会留下被修改或自定义的配置文件。例如，如果你修改了软件包的主配置文件并然后删除该软件包，该配置文件将以原始名称加上后缀 `.rpmsave`\
  \ 保存。此配置文件可以存档备后之用；或者如果使用 `-U` 选项升级软件包，则会使用一组复杂的算法来确保配置被正确应用。\n\n### 查询软件包\n\n查询软件包数据只是管理软件包时所执行的步骤之一，尽管可以说，它是\
  \ RPM 执行的所有任务中选项最多的项。\n\n重要的是，你必须理解安装在系统上的软件包（显示在 RPM 数据库中）与仅作为磁盘或其他资源上的文件存在的软件包之间的区别。`rpm`\
  \ 命令用法的主要区别增加了 `-p` 选项，用于指定所操作的软件包是磁盘上的文件。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n最基本的查询是检查特定软件包是否已安装：\n\n```\n# rpm -q cogl\ncogl-1.18.2-9.fc21.x86_64\n```\n\n\
  只需通过在此查询中添加几个修饰字符，你就可以收集关于任何软件包的大量信息。例如示例 6-6 显示了如何获取软件包的信息。\n\n**示例 6-6**–查询软件包信息\n\
  \n```\n# rpm -qi tree\nName          : tree\nVersion      :1.7.0\nRelease      :15.fcXX\n\
  Architecture: x86_64\nInstall Date: Wed 24 Oct 2018 08:01:29 PM EDT\nGroup     \
  \   : Unspecified\nSize         :114531\nLicense      : GPLv2+\nSignature    : RSA/SHA256,\
  \ Sun 15 Jul 2018 07:08:52 PM EDT, Key ID\na20aa56b429476b4\nSource RPM   : tree-1.7.0-15.fcXX.src.rpm\n\
  Build Date   : Sun 15 Jul 2018 10:27:43 AM EDT\nBuild Host   : buildvm-11.phx2.fedoraproject.org\n\
  Relocations :(not relocatable)\nPackager     : Fedora Project\nVendor        : Fedora\
  \ Project\nURL           : http://mama.indstate.edu/users/ice/tree/\nBug URL   \
  \   : https://bugz.fedoraproject.org/tree\nSummary      : File system tree viewer\n\
  Description :\nThe tree utility 递归地以树状格式显示目录的内容。Tree 基本上是 DOS tree 工具的 UNIX 端口。\n\
  ```\n\n要获取有关软件包文件的信息，请同时使用 `-q`（查询）和 `-l`（文件列出）选项，如下输出所示：\n\n```\n# rpm -ql tree\n\
  /usr/bin/tree\n/usr/lib/.build-id\n/usr/lib/.build-id/78\n/usr/lib/.build-id/78/0d8723b45ad93065b6912439e4d2355d3c8e3e\n\
  /usr/share/doc/tree\n/usr/share/doc/tree/LICENSE\n/usr/share/doc/tree/README\n/usr/share/man/man1/tree.1.gz\n\
  ```\n\n当你遇到关于列出软件包文件或信息的 Linux+ 考试题时，请记住列出数据库中的软件包内容与列出磁盘上的软件包内容之间的区别：\n\n`rpm -qil\
  \ *package_name*`: 用于已安装的软件包，指定短名称或名称。\n\n`rpm -qilp *package_name*.rpm`: 用于未安装的软件包，指定文件。\n\
  \n此外，记住你可以以任何顺序指定这些选项，只要它们都在即可。实际上，`rpm -qipl`、`rpm -qlip` 和 `rpm -pliq` 均有效。\n\n\
  要查看软件包的修订历史或变更日志，请使用以下命令：\n\n```\n# rpm -q --changelog tree\n* Sat Jul 14 2018 Fedora\
  \ Release Engineering\n  <releng@fedoraproject.org> - 1.7.0-15\n- Rebuilt for https://fedoraproject.org/wiki/Fedora_29_Mass_\n\
  Rebuild\n\n* Fri Feb 23 2018 Florian Weimer <fweimer@redhat.com> - 1.7.0-14\n- Use\
  \ LDFLAGS from redhat-rpm-config\n```\n\n此输出与大多数软件软件包源码库中的发布说明相似，后者描述了软件包更改的历史。混合使用\
  \ `rpm` 命令的长选项和短选项是考试出题者在 Linux+ 考试中喜欢使用的方法。如果你从未将 RPM 用到这种程度，这些问题将难倒你。不要忘记你必须同时使用\
  \ `-q` 和 `--changelog` 选项；否则，你会得到语法错误。\n\n注意\n\n我们常用的示例 `tree` 命令没有配置文件，因此我们将使用具有配置文件的工具，例如\
  \ postfix 套件。\n\n![Images](img/key_topic_icon.jpg)\n\n要找到一个软件包的所有配置文件，你使用查询和配置选项，如示例\
  \ 6-7 所示。此输出仅显示被软件包标记为配置文件的文件。如果你需要软件包内文件的完整列表，则需要使用 `rpm -ql`。\n\n**示例 6-7**–查找软件包的配置文件\n\
  \n```\n# rpm -qc postfix\n/etc/pam.d/smtp.postfix\n/etc/postfix/access\n/etc/postfix/canonical\n\
  /etc/postfix/generic\n/etc/postfix/header_checks\n/etc/postfix/main.cf\n/etc/postfix/master.cf\n\
  /etc/postfix/relocated\n/etc/postfix/transport\n/etc/postfix/virtual\n/etc/sasl2/smtpd.conf\n\
  ```\n\n要查看其他功能或软件包依赖，使用 `--requires` 或 `-R` 选项（记住它是磁盘上的包，所以使用 `-p`），如示例 6-8 所示。\n\
  \n**示例 6-8**–查询软件包文件的依赖关系\n\n```\n# rpm -qRp tree-1.7.0-16.fcXX.x86_64.rpm\nlibc.so.6()(64bit)\n\
  libc.so.6(GLIBC_2.2.5)(64bit)\nlibc.so.6(GLIBC_2.3)(64bit)\nlibc.so.6(GLIBC_2.3.4)(64bit)\n\
  libc.so.6(GLIBC_2.4)(64bit)\nrpmlib(CompressedFileNames) <= 3.0.4-1\nrpmlib(FileDigests)\
  \ <= 4.6.0-1\nrpmlib(PayloadFilesHavePrefix) <= 4.0-1\nrpmlib(PayloadIsXz) <= 5.2-1\n\
  rtld(GNU_HASH)\n```\n\n这种查找依赖关系的方法可以你需要哪些文件或软件包，而不需要安装该软件包。你可以将依赖关系追溯到软件包，例如找到提供\
  \ `tree` 所需 `libc.so.6` 文件的软件包，如下：\n\n```\n# rpm -qf /usr/lib64/libc.so.6\nglibc-2.28-9.fcXX.x86_64\n\
  ```\n\n那么查找安装特定文件的软件包的问题呢？例如，如果 `/etc/krb.conf` 文件意外损坏，你可以通过此命令找到它来自哪个软件包：\n\n```\n\
  # rpm -qf /etc/krb5.conf\nkrb5-libs-1.16.1-21.fcXX.x86_64\n```\n\n#### 使用 YUM 管理软件包\n\
  \nYUM，Yellowdog Updater, Modified，是 RPM 的前端。正如 `apt-*` 系列工具让处理 `dpkg` 和远程仓库变得更容易一样，YUM\
  \ 将 `rpm` 和远程仓库结合在一起，并提供了一个需要记忆的选项更少的界面进行封装。\n\n##### 安装软件包\n\n使用 `yum install`\
  \ 安装软件包（例如 R 统计语言），如示例 6-9 所示。\n\n**示例 6-9**–从远程仓库安装软件包\n\n\n\n\n\n```\n# yum install\
