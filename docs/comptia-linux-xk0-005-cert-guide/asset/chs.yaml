  \ `requisite`**\n**b. `supposed`**\n**c. `efficient`**\n**d. `optional`**\n\n# 第\
  \ 9 章：实现身份管理\n\n本章涵盖了以下主题：\n\n• 账户创建与删除\n• 账户管理\n\n本章涵盖的考试目标如下：\n\n**目标 2.2：** 给定定场景，实施身份管理\n\
  \n账户和身份是 Linux 系统的核心。任何进程都必须关联或“拥有”一个账户（无论是服务账户还是用户账户）才能在内核之外执行。\n\n随账户而来的还有组、密码、所有定义账户和组的相关配置文件、用户主目录模板、用户和组管理命令以及影响整体环境的命令。\n\
  \n许多命令设计用于 root 用户使用，但某些命令也是双重用途的，根据运行命令的用户的不同，可以获得不同的权限集。\n\n## “我已经掌握这些了吗？”测验\n\
