  md: '# RAM


    System memory is by far the most necessary resource for a server that handles
    a high volume of Web requests. Once the physical memory has been exhausted, the
    server machine will begin to utilize swap memory, which will slow it down. Frequently
    monitor the memory usage of the server. If a large amount of swap space is used,
    increase the amount of RAM on the machine.


    If possible, go to the top of the directory that will serve all of the Web pages,
    and use the du -s command to see how much RAM it would take to hold them all.
    There must be enough memory to hold all of the Web pages plus an extra 50MB to
    hold the operating system and the applications that are running.


    # Hardware


    For high loads, faster is better. For reference, old Pentium-based machine with
    adequate memory can use most of a 10MB connection. This varies widely, depending
    on factors such as the type of content and network. Hardware has become much faster
    since the old Pentium, so a modest machine by modern standards should still be
    usable for many applications.


