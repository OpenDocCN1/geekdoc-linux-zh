  md: '# request


    This is the actual HTTP request that was received from the client, enclosed in
    quotes.


    # status


    This is the three-digit HTTP status code returned to the client from Apache. Of
    these, the most common are 200, 202, 301, 302, 400, 403, and 404. Common status
    codes are shown in Table 1.2.


    # bytes


    This is the number of bytes in the response sent back to the client, not including
    the response headers.


    # Alias


    The Alias directive is a way of creating the equivalent of symlinks for our URLs.


    # Authentication-mod_access and mod_auth


    The Alias command allows modification of the response to a request. commonly used
    reference can be placed at an actual location, which is different from where the
    server serves to be getting it.


    To format the alias command, use:


    ```

    # Alias fakename realm

    Alias /icons/ /usr/local/share/apache/icons/*

    Alias /gifs/ /web/ncsa/gifs/

    Alias /gif/ /web/ncsa/htdocs/gif/

    ```


    Table 1.2 Status Codes and Their Meanings


    | CODE | MEANING |

    | 200 | Everything is working great |

    | 202 | Accepted |

    | 301 | Moved permanently |

    | 302 | Moved temporarily |

    | 400 | Bad request |

    | 403 | Forbidden |

    | 404 | Not found |'
