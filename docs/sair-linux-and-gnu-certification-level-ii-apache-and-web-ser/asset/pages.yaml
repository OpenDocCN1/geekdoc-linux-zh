  md: '# What Is TCP/IP and How Does Apache Use It?


    In a Transmission Control Protocol/Internet Protocol (TCP/IP) network, every computer
    gets a unique IP address. TCP/IP is the main protocol suite that allows all the
    computers on the Internet to communicate.


    Rather than remembering the number of every computer you want to connect to the
    Internet, an easy-to-remember name is used to connect to Web sites. Name-to-number
    translation is possible with the Domain Name System (DNS), a group of distributed
    servers that exist to translate the string of numbers (such as IP address 64.208.42.41)
    into names (such as www.apache.org). Every time the name of a Web site is entered,
    the name must be resolved through an IP address look-up on a DNS server to determine
    where to send the request.


    Apache relies on TCP/IP for many things, not the least of which is to communicate
    with Internet browsers. Web browsers and servers use a different language that
    primarily depends on TCP/IP as a transport. Although other protocols can be used,
    TCP/IP port 80 is typically used for Internet Web servers to carry the request/response
    protocol known as HTTP.


    # HTTP


    Hyper Text Transfer Protocol (HTTP) is the protocol that browsers and servers
    use to submit and serve requests. Uniform Resource Identifier (URI), Uniform Resource
    Location (URL), and Uniform Resource Name (URN) are all part of the communication
    between clients and servers using HTTP to communicate. Each request/response is
    preceded by a bit of information about the request/response that is contained
    in a header.


    # Headers


    The client and the server know they are actually dealing with hypertext when they
    transfer information back and forth because, when they send data, they start their
    transmissions with headers.


    A header is a piece of information that tells the client or the server what kind
    of information it is receiving. Thanks to headers, the Web browser usually knows
    the difference between text files, HTML files, JPEG images, and so forth.'
  merge: -1
  pgno: 134
