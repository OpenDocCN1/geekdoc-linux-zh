    the user nobody. Running Apache as nobody is dangerous because other processes
    run as nobody already. In the event of a security breach, trying to figure out
    which nobody affected your system becomes quite difficult. Remember also that
    any CGI script that Apache runs does its business as the same user as Apache.


    The obvious solution is to run Apache as a different user. We recommend configuring
    Apache to run as webuser, as a member of webgroup.


