  md: 'To negate the meaning for any of these tests, prefix them with an exclamation
    (!).


    CondPattern has two possible sets of flags: nocase | NC and ornext | OR. The first,
    nocase | NC, makes the test-insensitive. TestString, teststring, and tEstTrinG
    all become the same. ornext | OR combines rule conditions, which allows a user
    to rewrite conditions.


    Without OR, the following code:


    ```

    RewriteCond ${HTTP_USER_AGENT}      "Lynx/.*" [OR]

