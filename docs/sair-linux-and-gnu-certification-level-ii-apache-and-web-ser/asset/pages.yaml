    Running CGI scripts on Apache allows a user to create dynamic content. A drawback
    of this expanded functionality is that security holes can result if you do not
    correctly configure the server and verify that the CGI scripts are functioning
    properly.


    The nature of scripts means they have to be interpreted with the access capabilities
    of some user, typically the same as the httpd process. Make'
