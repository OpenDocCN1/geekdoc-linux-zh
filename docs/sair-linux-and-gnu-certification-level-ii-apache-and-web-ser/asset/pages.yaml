    Sometimes an allowed directory will have files inside that need to be blocked.
    Implementing a <Files> container can take care of this. For example, the .htaccess
    file contains information about local changes to the configuration and may be
    of interest to prying eyes.


    Here is an example using a <Files> container to block access to a file:


    ```

    <Files .htaccess>

