  md: '# 130 Chapter 3


    where variable is the environmental variable.


    Apache looks up the variable through internal structures. If it does not

    find it there, it uses getenv() from the Apache server process.


    %{HTTP:header}


    Use %{HTTP:header} where header is any HTTP MIME-name to

    to find the value of header.


    %[LA-U:variable]


    If you want to determine the value of a variable that is actually set later in

    an API phase, use %{LA-U:variable}. It performs an internal (URL-

    based) subrequest and determines the final value of the variable.


    %{LA-F:variable}


    A synonym of %{LA-U:variable} is %{LA-F:variable}. Rather than

    performing a URL-based subrequest, it performs an internal, file name-

    based subrequest.


    # RewriteRule


    RewriteRule is the directive that completes the tasks in the preceding

    example, and it is often used with mod_rewrite.


    The syntax is as follows:


    ```

    RewriteRule Pattern Substitution [flag]

    ```


    where Pattern is a POSIX regular expression in Apache versions 1.2.x

    and later. The RewriteRule can be applied more than once. Pattern

    applies to the URL as it stands when it reaches Rewrite

    Rule, not the URL originally requested. So if there are problems getting

    RewriteRule to work properly, look at what has been done to the URL

    ready to see if it has changed to something unrecognizable. As with

    RewriteCond, (! ) can be used as a Pattern prefix.


    # Substitution


    Substitution is the string that replaces the URL pattern matched. Table 3.2

    gives a list of substitution flags and their respective actions.


    RewriteRule uses the original URL and URI in two special variables

    called SCRIPT_URL and SCRIPT_URI.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Table 3.2 Substitution Flags


    | FLAG | ACTION |

    | Redirect| R [=code ] | Prefixes Substitution with http://currenthost[:port],
    which forces an external redirection. If code blank is left, the HTTP response
    302 (MOVED TEMPORARILY) is given. "code" can be any number in the range of 300
    to 400. |

    | Forbidden|F | Immediately sends back an HTTP response of 403 (FORBIDDEN). |

    | gone|G | Immediately sends back an HTTP response of 410 (GONE). |

    | proxy| P | Forces Substitution to make a proxy request and redirects it through
    the proxy module. All rewriting processing stops here. If you do not have the
    proxy module compiled, this flag will fail. |

    | last|L | Stops the rewriting process at the flag. |

    | next|N | Runs the rewriting process from the first rewriting rule. It does not
    use the original URL, however, the URL as stands after processing. An infinite
    loop can be created with this flag, so be careful. |

    | chain|C | Groups the current rule with the next rule. The effect becomes apparent
    if a rule does not match because rewriting skips all following chained rules.
    |

    | type|T=MIME-type | Changes the MIME-type of the target file to MIME-type. |

    | nosubreq|NS | Forces the rewriting engine to skip a rewriting rule if the current
    request is an internal request. |

    | nocase|NC | Makes pattern case-insensitive when matching against the current
    URL. |

    | qsappend|QSA | Instead of replacing the current string, it appends a query string
    part in Substitution to the existing string. |

    | passthrough|PT | Looks at the internal request_rec structure and sets the URI
    field to value of file name. |

    | skip|S=sum | Skips the next next rules when the current rule matches. |

    | env|E=VAR:VAL | Gets an environmental variable named VAR that has the value
    of VAL, which can contain regex backreferences $N and %N. Use this flag as often
    as you wish to set variables. |


    Any server on a network faces security risks. The next chapter will discuss methods
