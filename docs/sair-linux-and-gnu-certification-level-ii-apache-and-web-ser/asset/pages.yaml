  md: '# Starting httpd at Boot


    Most users want Apache to start automatically when the system boots. Each Linux
    distribution has a different method of doing this; try to follow the conventions
    if possible. Some of the RPM and DEB packages may automatically add Apache to
    the startup scripts; others may not.


    On a Red Hat 6.2 system, the RPM will probably not set Apache unless it was installed
    at the same time as the OS. To enable it at startup, use the ntsys program. This
    program allows the user to determine which system services should be started at
    boot time.


    If the proper way to start Apache at boot time cannot be determined, try adding
    it to the local startup script. Usually this will be found in /etc/rc.d/rc.local.
    Assuming Apache has been installed in /www/, add the following entry:


    ```

    /www/apachectl start

    ```


    # Setting Up Apache


    The majority of the Apache setup is done via the httpd.conf file. If Apache is
    running during configuration changes, certain steps must be taken for the configurations
    to take place. These steps are outlined in the sections that follow.


    # Starting and Stopping Apache


    Whenever the user alters the server, such as modifications in httpd.conf, Apache
    should be restarted for the changes to take effect. Apache comes with a script
    apachectl that can be used for this purpose. apachectl works like the service
    initialization scripts that most distributions have in the /etc/ rc.d/init.d directory.
    Specify start, and restart to start or stop the Apache server.


    # Starting httpd Manually


    To use apachectl, provide the path to the script. Adjust the path to make apachectl
    more convenient to use. Use a command-line option to tell the script what to do.
    With no options, apachectl will display the help screen as shown:'
