  md: '# CHAPTER 1


    # Installation and Configuration


    # Objectives


    +   - Define the evolution of Apache.

    - List the Apache levels of configuration.

    - Define Apache configuration options and methods.


    # Theory of Operations


    Almost two-thirds of the Web servers on the Internet use Apache (see Figure 1.1).
    Apache is common for the same reason that screwdrivers and crescent wrenches are
    common—doing a job right takes the proper tool. Apache is an excellent tool for
    World Wide Web hosting.


    Although Apache may not perform well in some benchmark tests, it performs extremely
    well in the field. It is a fully capable, industrial-strength Web server that
    is able to compete with other servers that are much more costly to purchase or
    license. It is extremely stable and has been heavily tested over the years in
    many different environments and platforms. The'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Apache is based on NCSA’s httpd, a daemon that was first used in the early
    years of the Internet. Rob McCCool was the creator of the NCSA Web server and
    continued his work on it until 1994. No single programmer took his place, but
    the server continued to grow in popularity. After his departure from the project,
    incompatibilities between versions began to develop. Web administrators had to
    make changes on their if they wanted to fix bugs or add features. Eventually,
    a group of administrators began working together to regain control of the project.
    Their efforts created a single path through which patches and enhancements to
    httpd could be submitted. The name of the project is derived from its origins:
    a series of patches applied to the original httpd daemon. The project came to
    be known as “a patchy server,” and from there, Apache server.'
  merge: -1
