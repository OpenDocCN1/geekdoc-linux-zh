  md: '# Source RPMs


    Software development using RPM proceeds in strict stages from sources with local
    patches applied, through configuration, compilation, and installation. The final
    output of a build consists of a source package and one or more binary packages
    that can be installed. The entire build process is described in something called
    a spec file.


    The focus on encapsulating all components necessary to produce a binary package
    in RPM prevents reuse of common code. The encapsulation is called a source RPM
    and consists of the sources, local patches, and the spec file describing the build
    process. The spec file is augmented with certain configuration information such
    as the compiler flags to use and the architecture on which the package is being
    built. The other information is of little use in preparing a package.


    The example that follows the structure of SRPMS. It assumes the user has a Red
    Hat CD-ROM RPM for the Apache program:


    ```

    # ls

    COPYING README SRPMS TRANS.TBL

    # cd SRPMS

    # ls apache*

    apache-x.x.x.src.rpm

    # rpm -i apache-x.x.x.src.rpm

    # cd /usr/src/redhat/SPECS

    # ls

    apache.spec

    # ls /usr/src/redhat/SOURCES/

    ```


    The rpm -i apache* command installed the patches in the /usr/src/redhat/SOURCES
    directory. The specs file describes the architecture-specific compilation procedure.


    # Installation


    Before unpacking a tarball, examine the contents. To do this, run the following
    command:


    ```

    tar -tzvf apache_1.3.19.tar.gz

    ```


    To unpack a tarball, first change to the directory where it will be unpacked.
    Then, execute the following command:


    ```

    tar -xzvf apache_1.3.19.tar.gz

    ```'
