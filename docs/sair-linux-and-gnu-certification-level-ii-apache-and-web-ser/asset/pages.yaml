    RewriteRule ^/(.+)$ http://newerver/~$1 [R,L]

    ```


    # 3. Using RewriteCond based on the client.


    ```

    RewriteCond %{HTTP_USER_AGENT} "Mozilla/3.*"

    RewriteRule ^foo.html$ foo.NS.html [L]

    RewriteCond %{HTTP_USER_AGENT} "Lynx/" [OR]

    RewriteCond %{HTTP_USER_AGENT} "Mozilla/[12]."

    RewriteRule ^foo.html$ foo.20.html [L] RewriteRule ^foo_html32.html [L]

    ```


    +   4. Save the changes to httpd.conf.


    +   5. Restart httpd.


    # Questions


    +   1. How can a mod_rewrite be used to change a URL only if a certain condition
    is met?


    +   2. Before any rewriting rules will function properly, what directive must
    be present in httpd.conf?


    # Answers


    +   1. The RewriteCond directive must be specified, along with a matching statement,
    in order to provide a matching condition.


    +   2. RewriteEngine On must be present before mod_rewrite will work.


