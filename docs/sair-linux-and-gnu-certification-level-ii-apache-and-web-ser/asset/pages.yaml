- img_proc: true
  md: 'Buffer overflows problems have recently been exploited in such popular network
    daemons as qopper, named, wu-ftpd, and many others. Candidates for the buffer
    overrun exploit can include older versions of ProFTPD and wu-ftp. Due to insufficient
    bounds checking in these programs, it is possible to subvert an FTP server by
    corrupting its internal stack. By supplying carefully designed commands to the
    FTP server, intruders could force the server to execute arbitrary commands using
    root privilege. Thus, intruders who are able to exploit this vulnerability can
    ultimately gain interactive access with the remote FTP server. The most vulnerable
    systems are the ones with the ftp daemon installed and enabled by default.


    Temporary solution to this attack is to disable any world-writable directories
    to which the user may have access by making them read-only. This action will prevent
    an attacker from building an unusually large path, which is required to execute
    these particular attacks. The other preferred solution is to upgrade the programs
    with patches that address the potential buffer overruns.


    Of even more, CERT reported a buffer overrun in 1998 in <cfg_getline()> that possibly
    allowed malicious users to gain access, not as root, but as the User of Apache.
    This is all the more reason to run Apache as any non-privileged user, other than
    nobody.


    Using pre-1.2.5 versions of Apache are susceptible to this buffer overflow in
    <cfg_getline()>. <cfg_getline()> is a function that the Apache core and several
    Apache modules use to read certain types of files from disk. Examples of the type
    of files that we read with are htaccess, htpasswd, and mod_imap files.


    It is possible to create a sequence of data that this buffer overrun occurs while
    <cfg_getline()> is reading from a file. If someone has access to create any of
    these types of files on the server, that hole is generally exploitable to gain
    full access to the user that Apache runs as. On most systems, this is of little
