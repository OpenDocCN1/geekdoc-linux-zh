  md: '# Benchmark Your Server


    # Purpose


    The purpose of this lab is to use several built-in monitoring features to monitor
    Apache''s performance. Various tools, such as Apache Bench (ab), `mod_status`,
    and `mod_info`, are used to establish a baseline for performance.


    # Theory


    Apache is equipped with a tool for benchmarking its performance. Apache Bench
    (ab), the HTTP server benchmarking tool, does this by giving an indication of
    how many requests per second the server can handle, with other statistics. These
    requests simulate real-world activity and aid in diagnosing potential bottlenecks
    in server performance.'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'The most common options used with ab are as follows:


    +   - -n Specifies the number of requests. Default is a potential request.


    +   - -t Specifies the number of seconds ab should spend performing the benchmark.
    By default there is no time limit.


    +   - -c Lists the number of simultaneous requests to perform. The default is
    one or no concurrency.


    +   - -w Prints results in HTML tables.


    The benchmark results may lead to changes the server configuration file. Apache
    provides a means of starting, stopping, and obtaining information about the use
    of apachectl. The Apache HTTP server control interface (apachectl) provides a
    convenient means of controlling the httpd daemon handles all Web page requests.
    As the heart of Apache, the httpd daemon handles If the configuration file for
    the httpd daemon, httpd.conf, is changed the daemon must be restarted to read
    new settings. The httpd daemon can be stopped and restarted manually, but apachectl
    provides an easier means of accomplishing this, along with providing other information.
    Table X.1 shows a list of options available for the apachectl script.


    # Table X.1 Options for apachectl


    | OPTION | DESCRIPTION |

    | --- | --- |

    | Start | Starts the Apache daemon. |

    | stop | Stops the Apache daemon. |

    | fullstatus | Shows the full status. (This feature requires the mod_status module
    and the Lynx browser.) |

    | restart | Sends a SIGHUP signal to the daemon, which restarts the daemon or
    starts the daemon if it is not running. |

    | graceful | Once, the daemon will not accept any new requests; it will finish
    all pending requests before it restarts. The method is less. |

    | configtest | This option tests the configuration file for errors. This is a
    syntax check, not an efficiency check. |

    | status | Gives an abbreviated status screen (requires mod_status and Lynx.)
    |

    | help | Lists all the options available for apachectl. |'
  merge: -1
  pgno: 266
