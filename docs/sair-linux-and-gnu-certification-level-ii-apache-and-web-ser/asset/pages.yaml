  md: '# Install Apache+SSL


    # Purpose


    The purpose of this lab is to install the Secure Socket Layer (SSL) protocol for
    an Apache Web server. With SSL, Apache offers the high level of security necessary
    for the safe transmission of sensitive data. With more and more businesses performing
    online transactions, security has become necessary for the continued growth of
    the Internet.


    This lab will use an Open Source patch of SSL that is available from the Apache+SSL
    project and provides a secure connection between the server and the client''s
    Web browser. This process will provide an interface between Apache and SSL.


    # Theory


    SSL provides secure communications between a client and a server, allowing for
    mutual authentication, use of digital signatures, and encryption of communications.
    SSL is a low-level authentication and encryption method used to secure transactions
    for upper-level protocols, such as HTTP and FTP. Originally developed by Netscape,
    SSL includes provisions for server'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'authentication, encryption of data in transit, and client authentication. Using
    these methods, it is possible to send encrypted data, such as passwords and credit
    card numbers, across the Internet with a large degree of safety.


    Due to various export restrictions, Apache and SSL are distributed separately;
    therefore, SSL is installed using a patch. Before using Apache+SSL, legal compliance
    should be checked.


    > **NOTE** Everything from here forward will be done in the working directory
    /usr/src/apache+ssl.


    # Lab Exercises


    This lab will cover the following steps:


    +   1. Downloading the latest release of the Apache server.

    2. Compiling Apache with mod_ssl support.

    3. Verifying that Apache was compiled with mod_ssl.

    4. Testing the sample page in a Web browser.


    # Downloading the Apache server


    As root, create the directory /usr/src/apache+ssl using the following:


    ```

    $ mkdir /usr/src/apache+ssl

    ```


    From the sites open-ssl, apache.org, and apache-ssl, download openssl-0.9.6a.tar.gz,
    apache_1.3.14.tar.gz, and apache_1.3.14+ssl_1.42.tar.gz, respectively. These files
    should be placed in the /usr/src/apache+ssl directory as shown here:


    ```

    $ls

    apache_1.3.14+ssl_1.42.tar.gz

    apache_1.3.14.tar.gz

    openssl-0.9.6a.tar.gz

    ```


    Next, untar and install each file. From the /usr/src/apache+ssl directory, perform
    the following:'
  merge: -1
