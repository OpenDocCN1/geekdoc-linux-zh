    is /etc/apache and /var/lib/apache in Slackware). All supporting files and directories
    will be based from this location.


    The server will listen on all network interfaces that exist on the host. This
    may or not be desired, but for a default install it ensures that Apache will be
    listening on an active interface and be accessible for testing.


    Paths, startup configurations, and a test page are all provided.


    Configuring with defaults is just a matter of invoking the following command in
    the source directory:


    ```

    $ ./configure

    ```


    This is fairly simple. A lot of work has gone into providing this clean and easy
    installation process, available since the release of Apache 1.3.


    # Customization


    As mentioned previously, Apache uses something similar to the GNU configure script
    to prepare everything for compiling. One aspect of Apache''s script is a wide
    variety of options that configure can take as arguments. For a general install,
    there is no need to learn them all.


    Another important configuration option involves steps to modify, which will be
    discussed briefly to prepare for later chapters where they will be needed for
    things like CGI scripting.


    It is often desirable to have additional functionality with a Web server, such
    as scripting or database integration. Additionally, an administrator may not want
    to have Apache in the default directory of /usr/local/apache. For specifying changes
    to the default, they can be added at the command line as options to configure.
    Invoking configure with command-line options will generally take the following
    form:


    ```

    $ ./configure --some_option=argument_forthatoption

    ```'
