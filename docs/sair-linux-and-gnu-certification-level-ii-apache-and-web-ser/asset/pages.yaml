    # motd and issue Files


    These files reside in the /etc/ directory and can be used to alert system users
    to security issues and prepare them for changes in the system. The issue file
    contains the text that appears after the login prompt, and the motd file contains
    the text that will be presented to each user after login. Configuring is simple;
    add the desired message in /etc/motd or /etc/issue.


    # U.S. Encryption Export Laws


    Encryption is a method to secure data. It is crucial to any type of network security.
    Unfortunately, encryption is not built into the IP protocol; therefore, it is
    good to use some of add-on encryption protocol for sensitive information that
    travels over a network, especially the Internet. Protocols to consider are PGP,
    SSL, and IPSec.


    At the time of this, the regulations pertaining to encryption are undergoing change.
    Currently, any use of strong encryption (key lengths greater than 40 bits for
    the RC4 method and 512 bits for RSA) is limited in regard to how it is used or
    distributed to places outside the United States. There is much controversy over
    this, and some changes are occurring that may allow stronger exportable encryption
    in the future. Until then, the safest approach is to use weak encryption for any
    aspect of an implementation that cross U.S. borders.


    # Authentication


    Apache has, by default, multiple authentication methods available. There is a
    handy password authentication method, an access file authentication method, an
    anonymous access method, and an as-yet digest authentication method. The digest
    authorization method implements the MD5 specification of digest authentication
    and is not currently supported by many browsers. For more information on digest
    authentication, please read the mod_digest module information in the Apache Reference
    Manual usually comes with the installation. This is usually located in /usr/local/apache/htdocs/
    manual/mod/mod_digest.html file.'
