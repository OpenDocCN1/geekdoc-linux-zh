    which is important for Apache. It is an especially good idea to watch for changes
    in the networking code because they may be beneficial to users who want more performance
    out of their Web servers. Newer versions of Apache may be better optimized as
    well. For production systems, wait a few weeks before using a new version to ensure
    that it is stable.


    # File Handles and Inodes


    Each file that is opened on the system must have an associated file handle, or
    inode, to keep track of it. The latest Linux kernels have a default limit of 4,096
    file handles. If the server will have many files open at once, the limit may be
    exceeded. This is important when running multiple virtual hosts with separate
    log files.


    # Introduction to Packages


    Linux software is generally distributed in a format called a package. A package
    is a collection of files combined into a single file to simplify distribution
    and installation. A good package system will also contain dependencies. A package
    can list all of the prerequisite packages that must be'
