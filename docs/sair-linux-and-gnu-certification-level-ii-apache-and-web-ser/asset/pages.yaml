  md: '# Matrix of Ideal Permissions


    Permissions can be set to read (r), write (w), or execute (x). Users require various
    levels of permissions, in order to both accomplish their tasks and keep the system
    secure. Not every user should have permissions to every file. Table 4.3 offers
    guidelines for setting the permissions of different groups.


    > NOTE Logs also include the lock and state files created by Apache /var.


    # User Access Control


    In the past, administrators used the access.conf file to define locations that
    the world could access on the server machine. It is still available for legacy
    purposes, but its directives have all rolled into the httpd.conf file. Although
    it is not needed, access.conf may be used. In our examples, we use the httpd.conf
    file for all directives, including those for access control.


    # Common Access Controls


    The following represent some general access directives that affect the server
    as a whole.


    # Directoryindex.html


    This directive defines the default index page, the file that will be loaded when
    a directory is accessed without specifying a file. Sites on the Internet on which
    the main page looks like an FTP directory usually are missing the index file for
    this directory. index.html is often used, but other names are also common. If
    a list of file names is specified and matches several of the names are present,
    the first file on the list is the one that Apache uses.


    Table 4.3 Matrix of Ideal Permissions


    | GROUP | CONFIGURATION | TOOLS | CGI | DOCUMENTATION |

    | --- | --- | --- | --- | --- |

    | Webmaster | r-x | r-x | r-x | r-x |

    | Web developer | --- | --- | r-x | r-x |

    | Web author | --- | --- | r-x | r-x |

    | Web server | --- | --- | r-x | r-x |'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# AccessFileName .htaccess


    When the AllowOverride directive is allowed in a directory, some access methods
    can control the settings for that directory. This directive sets the name for
    that file to .htaccess.


    # Blocking Access


    It is possible for the outside world to view the entire contents of a server machine’s
    file system if there are improper symbolic links to content that is accessible
    from outside the server. If an innocuous index.html file were linked to </>, everything
    on the system would be available for perusal.


    The <Directory> directive can prevent mistakes. It allows a user to apply rules
    exclusively to a particular directory. By default, the server will inherit the
    preexisting directives on the server.


    To control access to your Web content, the server are a number of directives at
    your disposal:


    +   - Deny and Allow

    - Order

    - Deny and Allow


    These directives use the visitor’s originating host as a criterion to determine
    if access will be permitted. As with most Linux/Unix security models, these criteria
    are based on one of two perspectives that specifically denies or allows.


    The syntax is as follows:


    ```

    Deny from host

    ```


    or


    ```

    Allow from host

    ```


    The host specified can be a specific host name, an IP address, or any of the following
    criterion arguments:


    +   - **all**: Wildcard, all hosts.

    - **domain-name**: Exact or partial names will be matched.

    - **IP address**: Exact or partial addresses will be matched.'
  merge: -1
