  md: '# SQL Databases


    SQL (often pronounced sequel) stands for Structured Query Language. It is the
    best-known database language. It has widely implemented and is available in almost
    every commercial relational database management (RDBMS) system and many open source
    systems as well. SQL provides the abilities to create and maintain the database
    and to query the database. SQL is recognized by the American National Standards
    Institute (ANSI) as the standard language for relational database management systems.
    SQL is a comprehensive database language, with statements for data definition,
    query, and update. Although most database use SQL, many of them also have their
    own proprietary extensions that are available only on their system. A good RDBMS
    can perform all standard operations without having to call on the proprietary
    extensions.


    # Selecting a Database


    Several database systems exist for Linux. While some commercial packages, others
    are free (open source). Considerations when choosing a database include the amount
    of data to be stored, the type and frequency of transactions, security features,
    multi-user support, access method, speed, and accuracy. MySQL will be used for
    this lesson because of its ease of use and also because of the extensive selection
    of third-party tools available freely on the Web. As of June 2000, MySQL was released
    under the GNU GPL-license, which makes it free for use in commercial systems.


    The main feature of MySQL is that it is multithreaded, optimized for speed and
    for large tables. MySQL gains its speed advantage at the cost of such desirable
    SQL features as triggers, subselect, and transaction processing. Developers, though,
    will gradually roll certain desirable features into the product over time. The
    intended use of the product is as a quick, fast implementation of simple applications.


    For more information on MySQL, visit the Web site at www.mysql.com.


    Other database systems are available for Linux. Commercial packages include Oracle
    8i, IBM DB2, and Informix SE.


    The MySQL package is available as freeware at prices comparable to those for MySQL
    at www.hughes.com.au/ products/msql/. It is free for non-commercial use.'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'PostgreSQL is derived from the Postgres research database. It is a full-featured
    object-relational database system. It supports declarative queries in SQL, query
    optimization, concurrency control, and transactions. It is completely Open Source
    and released under GPL. PostgreSQL comes standard with many distributions and
    is quite powerful. It can be found at www.postgresql.org.


    # Database Design Considerations


    Before beginning to implement a database system, users must analyze their needs
    by examining how many records of what size and kind will be generated over the
    life of the project and what kinds of operations are expected to be performed
    on the data. Also, they examine how the data will be accessed and how fast the
    connection will be. Transaction processing is a special task and places extra
    demands on a database system. After determining what system needs will be, users
    should examine different database packages and which one matches the application.


    After settling on a specific platform, design the database using whatever tools
    are available on that system to assist in the design work. Remember that part
    of the design is a security profile, a plan for which users will have access to
    which portions of the database.


    After these steps, the database should be ready for data entry.


    # MySQL Architecture


    MySQL uses a client/server architecture. In very simplified terms, a client/server
    architecture means that the data and all of the software necessary to manage the
    data (the server) is kept separate from the software that is requesting and using
    the data (the client). Also, a typical server is able to handle multiple clients.
    The MySQL distribution package includes both server and client components.


    Because the client and server are not required to be on the same physical machine,
    it is common to have a variety of client systems accessing the same server and
    sharing the same data. There is no limit on where the systems can be located;
    either client or server could be anywhere in the world. This fact does not imply
    that anyone in the world can access data on a server without consent. The MySQL
    administration section covers how to secure a database, allowing access to the
    server from specific hosts and assigning access levels to different users. Finally,
    the multi-user nature of the client/server system requires concurrency control
    so that two users are not able to modify the same record at the same time.'
  merge: -1
