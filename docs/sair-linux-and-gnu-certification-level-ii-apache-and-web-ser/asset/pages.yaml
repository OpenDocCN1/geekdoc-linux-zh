    not have a valid username and password, as is defined in the /etc/.htpasswd file.


    # Getting the Most Out of mod_status with ExtendedStatus


    When mod_status and server status, more information can be obtained by using the
    ExtendedStatus directive. This directive takes a value of either On or Off. Having
    ExtendedStatus turned on results in a degradation in performance because the server
    is using resources for capturing the data. Unless actively examining the server’s
    performance and capacity, the user should leave this option off.'
