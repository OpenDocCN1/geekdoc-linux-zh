    Information about the users is stored in a special file that you can create for
    a given Web resource. This file requires encoded passwords, and a utility called
    htpasswd exists to generate such entries:


    ```

    htpasswd -c filename

    ```


    The -c tells htpasswd to create a new password file. If there is already a file
    by name, the -c is not necessary; otherwise, the password file will be rebuilt
    and truncated. Here is an example:


    ```

    htpasswd -c /www/passwd file tux

    ```


    After invoking htpasswd with the desired arguments, the user will be prompted
    to enter a password. The username will then be added with its encoded password.


    # Group


    A file containing group information is useful to authorize several users at once.
    Being an authorized user does not guarantee access to the protected'
