  md: '# ab


    Apache comes with a benchmarking program ab (Apache bench). It will be in bin
    within the main Apache directory if it has been installed from source. Although
    it is difficult to simulate a real-world situation, ab can put a heavy load on
    Apache and the underlying Linux system.


    The following is the syntax for ab:


    ```

    ab options http://hostname:port/path

    ```


    It ends up looking something like this in operation:


    ```

    # ab -n1000 -c100 http://192.168.1.1:80/htdocs

    ```


    A number of options allow benchmarks to be tailored to run in various ways. Some
    of the main options for use with ab are:


