    # CGI Scripts


    CGI is a stand-alone process that is forked by Apache. CGI can do whatever the
    operating system will let it do. It is launched by the user Apache runs under,
    but if it has the suid or sgid set, it will give those permissions, too; therefore,
    CGI can be a dangerous process.


    The worst-case scenario is that .cgi is activated for the whole server, and someone
    creates a .cgi file somewhere in the home directory or the Web directory. Directory
    then the user can pull that URL in a Web browser and execute the script. But,
    if the user can create a .cgi file in the home directory, then the user can probably
    create one in the main cgi-bin directory as well, and there is the original problem.
    Regardless, by the time the errant .cgi file is found, it is likely that the script
    will have already run. In the end, limiting .cgi to one directory does not help
    security significantly, but it may make it easier for the administrator to discover
    breaches.


    The following are a couple of directives for enabling CGI scripts.


    # ScriptAlias Directive


    ScriptAlias works just like Alias, only it marks the target directory containing
    CGI scripts. So, if assuming the following:


    ```

    ScriptAlias /cgi-bin/ /usr/local/my_dir/cgi-bin/

    ```


    then the URL http://localhost/cgi-bin/my_cgi.cgi will execute my_cgi .cgi if it
    exists in:


    ```

    /usr/local/my_dir/cgi-bin

    ```'
