  md: "# server-info\n\nFor real-time updates on how a server is configured, the server-info\
    \ handler supplied in mod_info generates a page that reports on the server's configuration.\
    \ Instead of showing performance data, the page displays information about how\
    \ the server is configured: what the loaded modules are, which directives they\
    \ support, and the actual settings of the directives (under some circumstances).\
    \ The information from server-status report should be secured from the public\
    \ eye.\n\nAdd these directives to http.conf:\n\n```\nLoad@Module info_module modules/mod_info.so\n\
    ...\nAddModule mod_info.c\n...\n<Location /server-info>\n  SetHandler server-info\n\
    Order deny,allow\nDeny from all\nAllow from localhost\n</Location>\n```\n\nSimilar\
    \ to mod_status, mod_info creates a Web page (at the location specified by the\
    \ Location tag) that shows a detailed listing of the installation, including all\
    \ installed modules and configuration file directives. Because this module reads\
    \ server information at run time, any changes made to the configuration files\
    \ since the last server restart will not show.\n\nDisable modules that will not\
    \ be used. This will make your computer much faster.\n\n> TIP It is a good idea\
    \ to restrict access to the server-info page for security reasons. Remember that\
    \ if mod_info is compiled into the server, it can be used from any configuration\
    \ file, including the per-directory .htaccess files. You may want to load the\
    \ module dynamically, making it available only when it is needed.\n\n# Some Good\
