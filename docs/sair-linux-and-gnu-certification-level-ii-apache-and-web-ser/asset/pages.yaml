    # Overview of Content Negotiation


    Modern browsers allow users to indicate any preferences for files that they will
    receive from a Web server. This includes content type (for example, a preference
    of tar.gz over .zip files for compressed files), preferred image formats, and
    preferred language.


    To handle these preferences, each document has its own set of variants. The way
    in which these variants differ is called the document’s dimensions. Apache can
    negotiate along the dimensions of type, encoding, and language.


    # Type


    Every document has a type. An example type is text/html. If a Web browser tells
    Apache that it can accept only a given type of document, Apache will serve only
    that type to the browser.


    # Encoding


    If a resource is compressed or otherwise not in its final, usable format, it is
    encoded. The Web transport recognizes only the compress and gzip encodings currently.
    There are other, experimental encodings that the the'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'standard can handle now. Their encoding is preceded with x-, as in x-stuffit
    for Stuff archives.


    ```

    AddEncoding x-stuffit

    ```


    # Language


    For once, when referring to language in computer terms, we really mean human spoken
    and written languages. The language of a file is designated by adding a file extension
    to it, then using Apache''s AddLanguage directive, AddLanguage MIME extension
    [extension].


    An example of a file or document name using language extensions is:


    ```

    index.html.fi

    dummy.zip

    ```


    The httpd.conf file defines the file types specified by the file syntax would
    look like the following:


    ```

    AddLanguage en.en

    AddLanguage fi.fi

    ```


    These two directives specify that any file with the en or fi language tag located
    at the end of a file name will be classified as English or Finnish, respectively.
    They also show that the tag may be one dot before the last section of the file
    name.


    # Choosing Document Parameters


    A Web server can handle multiple variable dimensions, as can any given client.
    The client preferences are listed in order of quality. Values for quality range
    from 0.000 (never show the given dimension) to 1.000 (the most preferred dimension).


    For example, a browser might send the following in its header:


    ```

    Accept-Language: en; q=1.0, no; q=0.7

    ```


    This means the browser accepts English first and Norwegian second.'
  merge: -1
