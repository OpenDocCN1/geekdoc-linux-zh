  md: '# UserDir html


    System users can create a directory in which any content they place will be served.
    This directive defines the name of the directory within the user''s home directory.
    A URL such as www.xyz/~joe would go to /home/joe/html, the specified directory
    within joe''s home directory.


    The following directives define some rules that are directory specific, they are
    bracketed within a <Directory> section. The general form is:


    ```

    <Directory />

    Options

    AllowOverride

