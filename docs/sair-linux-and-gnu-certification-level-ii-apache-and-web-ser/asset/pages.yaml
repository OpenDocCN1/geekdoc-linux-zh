- img_proc: true
  md: 'installed before it can run. The role of a system administrator is to maintain
    packages by installing, upgrading, removing, and verifying them.


    The three most common packaging formats are RPMs, DEBs, and tar-balls. RPMs are
    used in Red Hat, Caldera, and most other distributions. DEBs are used in Debian
    and Corel Linux. Tarballs are used by Slackware and source packages.


    # RPM Security Tasks


    The following is a list of suggestions for security procedures for software that
    has been acquired from the Internet. To maintain a high level of security, practice
    these on a regular basis.


    # Issues with Stock Vendor Packages


    If the user installs the packaged Apache that comes with the distribution, he
    or she should rely heavily on the documentation that comes with the package. Patches,
    server defaults, module options, and any number of things follow a style that
    is unique and limited to that particular distribution.


    If your location has specific needs with respect to modules or will rely on Apache
    for many aspects, obtain the sources and build it yourself. Keep in mind that
    the prepackaged distributions are built in a way that will accommodate a varying
    range of needs. If your needs stray outside of this range, you will have to do
    that anyway. This process will be easier if it is started.


    # Security Updates


    Prepackaged distributions are designed to run on most systems. They include many
    services that the user and the system administrator need to either update or remove
    from the system. For example, the “Ramen worm” currently affects only Red Hat
    servers that have not had all of the security updates applied, as by the CNETNews.com
    story dated January 17, 2001 (http://news.cnet.com/news/0-1003-200-4508359.html).


    # Validating Packages


    Verifying a package compares information about files with the same from the original
    package. Verifying compares the size, MD5 sum, permissions, type, owner, and group
    of each file.


    The command rpm -V verifies a package.'
