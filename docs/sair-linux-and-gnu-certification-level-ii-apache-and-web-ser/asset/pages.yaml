- img_proc: true
  md: 'Each IP address could belong to a different instance of the Web server daemon,
    or the Web server could send requests to a different virtual host based on the
    IP address.


    IP-based hosting does not require a full directory tree for each host, the user
    will want to have directories that contain content, logs, and other information
    specific to each host. Creating these directories in an orderly fashion with names
    that correspond to their relevant hosts will save time later, when performing
    tasks specific to each site.


    With the examples that follow, we follow a hosts/ directory within the main Apache
    tree and branch off there. At a bare minimum, make a single directory for DocumentRoot.
    The user might want to create additional directories that contain logs for errors
    and user accesses.


    As with name-based hosts, add a section within httpd.conf, which contains all
    of the settings that control the behavior of each host. Both types of virtual
    hosting can use most directives available for a stand-alone server, but a minimal
    configuration requires only a few.


    The following section has been added near the bottom of the existing httpd.conf
    file and defines two IP-based hosts:


    ```

    <VirtualHost 192.168.0.3 >

    DocumentRoot /www/hosts/ipbased1/docs

    ServiceName www.iptest.com

    </VirtualHost>

    <VirtualHost 192.168.0.4 >

    DocumentRoot /www/hosts/ipbased2/docs

    ServiceName www.iptest.com

    </VirtualHost>

    ```


    A set of basic hosts running with the IP method requires just a few parameters
    for each host. Here is a breakdown of the directives that have been used with
    the first host in the example configuration.


    # <VirtualHost 192.168.0.3 >


    Each host requires a section within httpd.conf that contains the configurations
    specific to that host. The VirtualHost statement is followed by the IP address
    that has been aliased for the host. The host will be accessible at this IP address.'
