    # mod_perl


    Perl is a high-level programming language written by Larry Wall. It is derived
    from the C language and contains lots of functions and tools for numerous tasks,
    such as system administration, database access, string manipulation, networking,
    and, most importantly, Web programming. The newest version of Perl is freely available
    at www.perl.com.


    Perl has its own module system. Perl modules are similar to libraries in other
    programming languages. A module is a set of functions that provide additional
    functionality to the Perl language and can be included and used easily in Perl.
    Perl modules are stored in files with an extension of .pm.pm would be a Perl module,
    files without an extension, or ending in .pl, are Perl programs. All Perl modules
    can be downloaded from the new Comprehensive Perl Archive Network (CPAN), which
    contains all known Perl material and modules. CPAN can be found at the www.perl.com
    site and many mirror sites.


    Apache''s mod_perl module integrates a Perl interpreter for the Apache Web server.
    It contains Perl code that provides for an object-oriented interface to the new
    Perl-enabled Apache server. The mod_perl module contains lots of functions and
    classes that add great functionality to the Apache server. With mod_perl, it is
    possible to write Apache modules unless entirely in Perl. The major advantages
    of mod_perl are speed and the ability to deal with the inner workings of the Apache
    Web server. CGI scripts can also run under mod_perl.Installation of mod_perl is
    fairly complex. Please do not try to do this without reading the README files
    that come with the module installation files. The simplest way to install is to
    use the Makefile.pl script with the right parameters.


    mod_perl mailing lists and more are located at http://perl.apache.org.


    # Introduction to the Apache API


    The Apache Application Programming Interface (API) is the method by new pieces
    of code (i.e., Apache modules) integrate their handlers into the main flow of
    operation in Apache. Knowing the steps Apache follows when handling a request
    can help you to understand how Apache works.'
