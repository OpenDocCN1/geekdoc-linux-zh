    This directive appears again as we specify where the home directories exist. It
    also marks the beginning of the section that contains the special directives that
    are needed.


    Here is an example of the second directive:


    ```

    Options Indexes +SymLinksIfOwnerMatch IncludesNoExec

    ```


    These turn on a set of options in a section. Choices can be None, All, or any
    combination of Indexes, Includes, FollowSymLinks, ExecCGI, or MultiViews. The
    MultiViews option must be explicitly named because it is not included in Options
    All. Note that the FollowSym-Links option, while helpful, could allow a user to
    accidentally create a symbolic link to an area that should not be visible to visitors,
    as /etc. The SymLinksIfOwnerMatch allows the use of symbolic links without opening
    this potential security leak.


    Here is an example of the third directive:


