  md: '# DocumentRoot /www/hosts/ipbased1/htdocs


    Within each section, a DocumentRoot needs to be assigned that tells Apache where
    the base directory for a host''s html content resides. In these examples we have
    branched off from the /www directory and created a directory for each host. The
    user can place them anywhere, as long as they are defined in each DocumentRoot.


    # ServerName www.iptest.com


    If a host is to have its domain name associated with its IP address, it needs
