    Also, as they can examine the payload of a packet, proxy servers can filter inappropriate
    content.


    There are two types of proxy servers:


    +   Application proxy servers. For each protocol that needs to run through the
    proxy server, the application proxy server provides separate services. One example
    of a proxy server is a squid proxy server that provides HTTP and FTP proxies.


    +   SOCKS proxy server. This server provides generalized proxy services for applications
    that can use a SOCKS proxy server.


    # IP Masquerading Proxy Servers


    In to use NAT to its full potential, IP masquerading can be used. As a firewall
    tool, NAT provides the following benefits:


    +   Hidden internal network. Because the internal networks are not routed over
    the Internet, networks behind the firewall are hidden from the rest of the world
    (i.e., the Internet). The hidden network cannot be examined externally and so
    security is greatly enhanced.


    +   Utilization of fewer valid IP addresses. When the firewall uses NAT, the network
    needs fewer registered IP addresses.


    Thus, IP masquerading allows all internal machines to access the Internet from
    behind the firewall using the firewall’s IP address. As a result, the Internet
    sees only the firewall machine and nothing beyond it. Breaking through a properly
    secured Linux IP masquerading host and into the internal network is extremely
    difficult.'
