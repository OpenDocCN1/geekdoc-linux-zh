    # Shells and Commands


    Sometimes Apache will employ outside programs or modules when confronted with
    data over a network. These programs can configure incoming requests and data into
    formats that Apache understands and can process effectively. Several of these
    programs are presented in this section.


    # URL Rewriting mod_rewrite


    Apache comes with a rule-based engine that allows changing URLs after receiving
    the request; this engine is mod_rewrite. As with most powerful tools, a complete
    understanding is required before using it.


    mod_rewrite analyzes the URLs it changes in a non-intuitive way. Studying the
    API will help users understand Apache''s approach and how'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# 126 Chapter 3


    to develop for it correctly. A description of the API is on Apache''s reference
    for mod_rewrite.


    The Apache mod_rewrite module is very complex, but once a user understands it,
    almost any URL can be transformed into another one. The module uses a rule-based
    rewriting engine to requested URLs. This feature with its powerful URL manipulation
    mechanism, the Web server can examine every URL that arrives if it matches any
    patterns by the rewrite rules. If it finds a match, Apache internally rewrites
    the URL using the matching rule. Here, the module operates on full URLs in both
    a per-server context (httpd.conf) and a per-directory context (.htaccess). To
    use mod_rewrite, add the following line to the configuration file before compiling
    the server:


    ```

    AddModule modules/standard/mod_rewrite.o

    ```


    Some examples of mod_rewrite in action.


    With a proxy, users can make sure it is used only by those desired. A 403 Forbidden
    page can be shown to unwanted users. For instance, users want to use the proxy
    server for URLs with a name ending in .anu.edu.au:


    ```

    RewriteRule !^proxy:http://[^/]*\.anu\.edu\.au/ - \ [forbidden]

    ```


    Because mod_rewrite has access to many server variables, it can be used instead
    of a CGI or JavaScript to redirect Web browsers based on their type and version.
    The following example was adapted from Apache''s URL Rewriting Guide (the link
    is provided at the end of this section):


    ```

    RewriteCond %{HTTP_USER_AGENT} *"Mozilla/3.*"

    RewriteRule /index\.html$ /index.NS.html [L]

    RewriteCond %{HTTP_USER_AGENT} *"Lynx.*" [OR]

    RewriteCond %{HTTP_USER_AGENT} *"Mozilla/[12].*"

    RewriteRule /index\.html$ /index.20.html [L]

    RewriteRule /index\.html$ /index.32.html [L]

    ```


    > The use of RewriteCond is one of the most important directives of mod_rewrite.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Networking 127


    Following is the syntax:


    ```

    RewriteCond TestString CondPattern [flag]

    ```


    # CondPattern TestString


    CondPattern is an extended regular expression that has some additions.,


    +   - When combined with CondPattern, treat it as a plain string and compare lexically
    to TestString.

    - Returns true if CondPattern is lexically lower than TestString.

    - Returns true if CondPattern is lexically greater than TestString.

    - Returns true if CondPattern is lexically equal to TestString.


    Put the operator at the beginning of CondPattern, like so:


    ```

    <CondPattern

    ```


    Table 3.1 shows some of the options available when using CondPattern


    Table 3.1 Options for CondPattern

    | Table 3.1 |

    | OPTION | DESCRIPTION |

    | --- | --- |

    | -d | Treats TestString as a path name; it tests TestString exists and that it
    is a directory.

    | -f | Treats TestString as a path name; it tests that it exists and that it is
    a regular file.

    | -S | Treats TestString as a path name; it makes sure TestString exists and that
    its size is greater than zero.

    | -l | Treats TestString as a path name; it tests that it exists and is a symbolic
    link.

    | -F | Does not deal with path names but checks if TestString is a valid file.
    Checks to see if the file is accessible via all the server''s controls for that
    path. Uses an internal subrequest for this check; server performance degrades
    accordingly.

    | -U | Makes sure TestString is a valid URL and is accessible via the server''s
    access controls for that path. Uses an internal subrequest; server performance
    lags the more it is used.'
