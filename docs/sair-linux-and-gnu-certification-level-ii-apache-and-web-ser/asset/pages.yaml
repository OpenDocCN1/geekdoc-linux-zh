    # Database Concepts


    One of computer’s most powerful tools is the ability to store and retrieve data.
    Many techniques for retrieving data have been tried over the years, from linear
    search of plain-text files to Indexed Sequential Access Method (ISAM) tables.
    This search for effective retrieval methods has led to the development of database
    management systems (DBMS). Different classes of DBMS have been developed, including
    hierarchical, relational, and object. The relational model, formally described
    by E. F. Codd in the late 1960s, has been extremely successful and is the type
    of database that will be examined here.


    A database consists of a set of data organized for easy retrieval and software
    that is designed to retrieve it. In a relational database, the underlying concept
    is that everything is stored in tables. Although there are special technical terms
    for the components of a database, the more familiar common terms will be used
    in this discussion, with some reference to classical programming terms. A table
    consists of rows (records), which are divided into columns (fields). Each row
    in a table can be accessed and manipulated separately from all others, possibly
    using one or more columns or even using keys built up from multiple columns. In
    classi'
