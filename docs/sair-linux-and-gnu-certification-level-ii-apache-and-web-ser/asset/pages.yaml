  md: '# Installation and Configuration


    For details about the many available arguments for use with configure, read the
    INSTALL file in the main source directory.


    # Configuration Files


    There are several configuration files within the Apache source tree. It is strongly
    recommended that these not be altered. Users may want to read some of them to
    see how the install works, but altering them could have unpredictable results
    on how things are installed. For reliable compiles and installs, customization
    should be done strictly with configure options. After invoking configure with
    or without options, there will be some text output as scripts prepare the sources.
    Most systems that have been installed with a developer option should have everything
    needed to compile. Otherwise, the configure script will stop with an error that
    provides hints as to what might be wrong. Use the error message to determine what
    additional components should be installed.


    # CGI Scripts


    Turning on cgi scripts for the entire server poses a security threat. Someone
    can create a .cgi file in a location other than the Web directory or another specified
    location; or he can execute the script at a date later unknown to the Webmaster.
    In short, it is better to allow .cgi files in one directory. It is much easier
    to monitor one directory than an entire server.


    The following subsections outline a few directives for enabling CGI scripts with
    which you should become familiar.


    # ScriptAlias Directive


    The ScriptAlias directive defines a directory where CGI scripts are expected to
    be. Any script placed here, with proper permissions, will be available to any
    directory.


    ```

    ScriptAlias /cgi-bin/ /usr/local/share/apache/cgi-bin/

    ```


    # AddHandler Directive


    The AddHandler directive tells Apache the extension to look for on CGI scripts.


    # Processing of Requests


    Requests from the network proceed through a series of stages inside Apache. At
    each stage, modules may deal with the request. Each hook can'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Chapter 1


    succeed, defer to another module, or return an HTTP error response. In addition,
    they can modify the request object as it is seen by later stages.


    In order, these stages are as follows:


    +   1. URI to file name translation

    2. Authentication

    3. Authentication access checking

    4. Nonauthentication access checking

    5. Determining MIME type

    6. Fixups

    7. Sending the response

    8. Logging the request


    These stages match the Apache documentation phases.


    Modules may start subrequests, in which Apache asks itself what would happen in
    response to a client request. For example, the module that produces directory
    indices (mod_autoindex) performs a subrequest to find information about each of
    the files in a directory.


    Separate from subrequests, Apache can redirect the request to a different location.
    Apache does this either as an internal redirect, in which generates the content
    that would have been produced by the new request, or by an external redirect,
    in which Apache sends a response to the client identifying a different location
    to use.


    # Installation Summary


    The steps for installing Apache are similar to those used for other applications
    and servers. Apache configuration will be discussed in greater detail later in
    this chapter. Following are the general steps for installing Apache:


    +   - If it is in source form, verify the file.

    - Extract the archive to a temporary directory.

    - Configure it.

    - Compile it.

    - Verify the install on the local system and then the network.

    - Add content.'
