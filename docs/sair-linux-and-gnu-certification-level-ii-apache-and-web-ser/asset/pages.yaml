    A certain amount of trust is required of scripts and those who have writ-ten them.
    Because many CGI scripts can be rather complicated, evaluating them for problems
    can be difficult. Many scripts are available on the Inter-net for download, and
    some of the authors have motives that go beyond providing you with a feature for
    your server. Similarly, an author can write a script without full knowledge of
    the repercussions of the security issues involved, leaving the server open to
    attack by someone familiar with the failings of that script.


    > **WARNING** Never place interpreters in the *cgi-bin* directory. This applies
    to Perl, PHP, or any other language. This is usually a problem with the Windows
    environment, but Linux users need to be aware of.


    # suExec


    One problem with CGI scripts is that they are run by the owner of the server,
    which can cause serious problems if the script is written in a mali-cious or careless
    way. Typically, the damage is restricted to whatever the server processes'' owner
    access. Under some circumstances, a visitor can enter data that causes a script
    to do things the author didn’t intend, or a visitor who has access to the system
    can modify a script to do things beyond the intentions of the original author.


    The `<sueexec>` option allows CGI scripts to run under a user ID other than the
    owner of the server and, at the same time, applies a series of strict tests to
    what the script is trying to do. If a script tries to step out of the pre-scribed
    parameters, it is terminated and an error is logged to the `<sueexec>` log file.


    The Apache documentation warns that `sueexec` should be used only by someone who
    is familiar with the `uid` and `sgid` processes. An improper implementation by
    an inexperienced administrator could result in un-pected actions by the script.


    > **NOTE** Configuring `sueexec` is beyond the scope of this course. If you would
    like to experiment with it, read the server documentation carefully, paying close
    attention to permissions and ownerships.'
