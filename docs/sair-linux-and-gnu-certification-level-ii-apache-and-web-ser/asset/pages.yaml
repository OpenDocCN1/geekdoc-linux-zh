    # What Is CGI?


    According to the World Wide Consortium, the Common Gateway Interface (CGI) is
    a “standard for external gateway programs to interface with information servers
    such as HTTP servers.” In practice, this means CGI is a method of allowing the
    execution of programs on Web servers and then passing data back to the Web client
    to viewed.


    When a Web browser requests a page from a Web server, the server must know whether
    that page is a CGI page. If it is, the server must execute it and then pass the
    returned content back to the Web browser. Although commonly called CGI scripts,
    these programs can be any type of valid program recognized by the Web server.
    This recognition process is shown in Figure 2.1.


    # When to Use CGI


    Typical Web pages are static, meaning the content shown when a page is viewed
    does not change from time to time or based on environment. CGI'
