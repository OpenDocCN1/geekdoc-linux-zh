  md: '# Use the file or virtual attribute to get different results. For example:


    ```

    <!--include file="base.html" -->

    ```


    is different from


    ```

    <!--include virtual="/base.html" -->

    ```


    Using the file attribute is a little less useful. It must be a file path relative
    to the current directory, and it can not start with / or .. The virtual attribute
    specifies a URL to the page in which it is served, and it must be on the same
    server.


    # Executing Scripts


    Because any file using SSI can be included, the output from CGI scripts can also
    be included. For example, the following:


    ```

    <!--include virtual="/cgi-bin/cool_hit_counter.cgi" -->

    ```


    would include the preceding cgi in the HTML document.


    # Embedding XSSIs


    An important note is that includes can be embedded. For example, imagine that
    a footer is used for files residing deep in a Web site''s directory structure,
    but it needs to access the cool_hit_counter cgi. Two includes can be in every
    file:


    ```

    <!--include file="footer.shtml" -->

    ```


    ```

    <!--include virtual="/cgi-bin/cool_hit_counter.cgi" -->

    ```


    To change CGIs and to move to the groovy_hit_counter.cgi, the include in every
    file must be changed. An alternative is to have the virtual include exist only
    in footer.shtml, which will make upgrading hit counters less troublesome.


    # Conditional Statements


