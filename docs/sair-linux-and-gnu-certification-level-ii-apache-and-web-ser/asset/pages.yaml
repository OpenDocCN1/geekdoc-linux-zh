    | www-data 10190 | 10185 | 09:31:15 ? | 0:00 | /usr/apache/bin/httpd |


    Process 10185 is running as root; this is known as the Apache process. The StartServers
    directive is set to 5 in the httpd.conf file, and we see five other http processes
    running as www-data. Their parent ID is 10185, the Apache parent process.


    Changing the httpd.conf file makes it necessary to tell Apache to reread it by
