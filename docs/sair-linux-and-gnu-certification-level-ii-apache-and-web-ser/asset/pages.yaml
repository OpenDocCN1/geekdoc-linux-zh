  md: '# Phases


    Phases are one of the three critical components of the Apache API. The Apache
    flow of operation goes through eight phases each time Apache receives a request
    to serve a Web page. A request flows from Phase 1 to Phase 8 in sequential order.
    Apache receives a request for a document, it starts by passing through Phase 1;
    by the time it reaches Phase 8, the response has been sent and Apache waits for
    a new request. The eight phases of Apache are illustrated in Figure 2.3.


    # Handlers


    A handler is a set of C functions that a module uses to perform a task. Inside
    the code of each module is a structure identifying what type of processes it can
    perform, as well as the code to actually perform it; this is a handler. Each module
    can have one or more handlers defined in it.


    The handler is the part of the module that performs actions. If a module is written
    to process CGI scripts, the module will have a structure telling Apache which
    handler function to call when it sees a request for a


    ![](img/4f53a2ec2fc0bfcb7b575d742d376f8c_100_0.png)


    Figure 2.3 Apache phases.'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'script. Apache keeps a list of which handlers perform which functions and which
    modules are associated with each handler.


    When each module is initialized, Apache looks at the module’s handler structure(s)
    to determine what that module does. These structures tell Apache each phase for
    which they are appropriate, as well as to call the handler when needed. Each handler
    has the option of declining the request or attempting to handle the request when
    called.


    If the request is declined, Apache tries the next handler registered for that
    phase. If the request returns a success, the next phase is attempted. If it returns
    a failure, the request goes straight to the last phase: logging the request.


    There are exceptions to this flow of operations. For instance, when a handler
    returns a success after handling a request, the request moves to the next phase,
    except for the Non-authentication Access Checking, Fixup and Logging the Request
    phases. In these phases, all handlers run as long as no failures are returned
    by previous handlers. Apache handlers are shown in Figure 2.4.


    ![](img/4f53a2ec2fc0bfcb7b575d742d376f8c_101_0.png)


    Figure 2.4 Apache handler processing.'
