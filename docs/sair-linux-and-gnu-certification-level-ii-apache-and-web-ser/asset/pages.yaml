- img_proc: true
  md: 'made to the outside network, the client is actually giving the request to the
    proxy. If the proxy has the information requested, it serves it back to the client.
    If not, the proxy makes the formal request to the specified server and receives
    the information. At this point, the proxy provides the data to the requesting
    client. Even though the original request to the proxy is via HTTP, the proxy may
    use any protocol to actively retrieve the requested document(s).


    An HTTP proxy cache accepts requests for objects that people want to download
    and handles their requests. If the user wants to download a Web page, he or she
    asks the proxy server to retrieve the page. The proxy connects to the remote server
    and requests the page. It then transparently streams the data through itself to
    the client machine, but at the same time it keeps a copy. The next time someone
    wants that page, the proxy simply reads it off disk, transferring the data to
    the client machine almost immediately.


