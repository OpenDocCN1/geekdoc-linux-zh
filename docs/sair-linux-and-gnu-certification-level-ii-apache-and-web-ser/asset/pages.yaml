    # Backing Up of Your Data


    Backing up is one of the first principles of survival when using a computer. A
    backup (if done properly) can protect data from a range of problems, from a system
    crash (is the power cord when someone might trip over it?) to an act of vandalism
    (is there a government building nearby that might be subject to a terrorist attack?)
    to a weather problem (how much snow did you say the roof can support?). All these
    events have occurred in recent years; the most reliable system might not be able
    to continue operating under extreme conditions. Backing up and keeping the backup
    at a different location can make a world of difference in how long a system is
    down if something unexpected happens.


    There are two ways to make a backup. Because MySQL uses common data files in the
    Linux file system (unlike optional configurations on large commercial databases),
    a backup can be performed by copying all table files (*frm, *.MYD, *.MYI) at a
    time when the server is not updating anything. Updates can be prevented by locking
    system-level backup by doing a LOCK TABLES/UNLOCK TABLES set of commands. A read
    lock will allow queries to continue during the backup, while disallowing updates.


    Backing up with the mysqldump command will allow updates to take place during
    the backup. To be able to capture the updates, first stop mysqld and start it
    with the --log-update option. This example assumes that log-update is not already
    turned on:'
