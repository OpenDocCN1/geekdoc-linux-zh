  md: '# Chapter 1


    For purposes of this course, it is important to understand that these files may
    not exist, and they may or may not be used. The user can start Apache with the
    -f option to specify the configuration file; therefore, the rc scripts should
    be checked as well to verify which httpd.conf file is being called. We will use
    only the httpd.conf in /etc/httpd/conf.


    Usually, the default installation will work without any problems. If it does not,
    check the error log for a hint to the problem area. To find the error log, search
    the httpd.conf file for ErrorLog (grep -i error-log httpd.conf). In our installation
    it is located in /var/log/httpd. We do not recommend leaving the server configured
    with the defaults, especially without understanding some of the consequences.
    Therefore, we will cover a few aspects to monitor.


    Basic configuration of Apache is accomplished by modifying the directives in the
    httpd.conf file.


    For a list of these directives, see www.apache.org/docs/mod/directives.html or
