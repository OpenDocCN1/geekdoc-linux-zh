- img_proc: true
  md: '# Installation 199


    to Apache, you might be wondering how to find documentation on editing the configuration
    files; the answer is surprising. Most of the required documentation is found in
    the configuration file itself, in the form of more than 650 commented-out statements.
    Most of these statements contain hints and instructions on how to set up the server.
    Without all of the comments, the file is only about a third as long.


    Now, changes toward customization will take place. Open the httpd.conf file in
    Vi or the editor of your choice. The configuration depends greatly on what the
    Web server is going to do. It might be a good idea to uncomment the lines containing
    the modules that were installed. This can be done by finding the dynamic shared
    object (DSO) header in the httpd.conf file and changing the paths of the modules
    in the following lines to where modules are located:


    ```

    LoadModule perl1_module modules/libperl1.so

    #LoadModule php_module modules/mod_php.so

    LoadModule php3_module modules/libphp3.so

    ```


    LoadModule is the directive to show that a module is being loaded, and it is followed
    by the module name and path. If the modules for the packages you just installed
    are in another directory, include the full path here.


    Most of the other changes to make in the server configuration will be done simply
    by uncommenting lines. First determine what you want the server to do. After this
    is established, the needed changes can be made and the desired effect can be achieved.


    # Questions


    +   1. How would an administrator keep clients from making more than one request
    per connection?

    2. How would you find out what package is contained in a .rpm file?

    3. If there is no DNS name for your machine, what should the server name be?

    4. Where are the best places to find RPM modules?'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Answers


    +   1. Modify the KeepAlive directive so that it is turned off.

    2. Use the -qp argument on the rpm command. (rpm -qp <package>).

    3. The machine''s IP address.

    4. The sites of official vendors.


    # Advanced Questions


    +   1. What would be a reason to edit a configuration file (other than httpd.conf)?

    2. Describe the advantage of using DSO modules.

    3. Describe the advantage of using static modules.'
