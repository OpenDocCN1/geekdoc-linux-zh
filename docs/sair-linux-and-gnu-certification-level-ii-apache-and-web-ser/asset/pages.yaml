- img_proc: true
  md: 'The server can also have quality values on multiple variants. When it has to
    make a decision between multiple variants that are equally acceptable to the client,
    the server uses its own quality preferences.


    # MultiViews


    MultiViews instruct Apache to look for a document that is the best match for a
    client''s preferences. For example, if a client requests http://www.linux.org/index
    and no file matches that request, Apache scans the directory involved for variants
    of index. Apache finds all files with similar names, then checks the client''s
    content preferences (Type, Encoding, and Language) to find a suitable match.


    > NOTE Scanning greatly increases disk I/O activity, slowing down the Web server.


    Because of the high I/O bandwidth inherent with MultiViews, when specifying Options
    All, MultiViews are off. To turn MultiViews on, one must specify:


    ```

    Options +MultiViews

    ```


    for a given scope. This adds MultiViews to the existing options.


    For more information about content negotiation, visit the following two sites:


    ```

    http://httpd.apache.org/docs/content-negotiation.html

    http://httpd.apache.org/docs/mod/mod_negotiation.html

    ```


