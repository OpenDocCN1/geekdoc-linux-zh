  md: '# Glossary


    .cgi This extension describes CGI scripts.

    **access_log** Apache adds a line to this log file for every request it receives.

    **access_conf** A file for controlling access to documents.

    **Access control** This involves using directives, such as Allow, Order, Deny,
    and AllowOverride, to control which users have access to the Web-space.

    **Access permissions** Read, write, and execute the possible permissions that
    a user or group can be given for a particular file.

    **AccessFileName** This directive sets the name for the file that can control
    the settings for the AllowOverride directive.

    **Actions** These work with handlers to extend the capabilities of Apache and
    PHP.

    **AddHandler** This directive allows files with specified extensions to be mapped
    to a particular action.

    **AddLanguage** Users designate what language a file is by adding a file extension
    to it and using Apache’s AddLanguage directive.

    **Alias** An alternative name or label that refers to another particular name
    or label. The Alias directive creates the equivalent of symlinks for URLs.'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Glossary


    **Allow** This directive, along with Order, controls who has access to the pages
    in the Web directory.


    **Allow changes** The number of days before the user can change the password.


    **Anonymous access authentication** Using the anon_auth_module, anonymous users
    can sign in with a default username and a valid e-mail address. These users can
    then access information.


    **Apache** A popular, stable Web server, based on NCSA’s httpd. It can be found
    at www.apache.org.


    **APACHE***** This is a version of Apache that has Secure Sockets Layer (SSL)
    security built into it.


    **apachectl** This is the Apache server control interface; it helps control the
    httpd daemon.Fullstatus.


    **AuthGroupfile** The file that associates group names with their members.


    **AuthName** This access directive allows users to access password-protected areas,
    if they can complete the password challenge.


    **AuthType** This access directive should be set to basic: Digest can be placed
    here to enable encrypted passwords.


    **UserFile** This directive points to the file that contains usernames and passwords.


    **BrowserMatch** This directive defines environment variables based on the user-agent
    header.


    **Browsers** A browser is an application that allows users to view and interact
    with information on the World Wide Web. PHP can tell a lot about Web browser by
    reading the headers sent by it.


    **Buffer overflows** The source of most attacks on Linux systems. These attacks
    occur when variables receive more data than the programmer anticipates or prepared
    for, leaving the system vulnerable.


    **cgi-bin** The main directory for .cgi files.


    **checksum** Information on a segment of data that can be checked against the
    data itself, in order to determine if the data arrived at its destination undamaged.


    **Child processes** These are replications of Apache that do out content and complete
    process requests.


    **Cipher Suite Negotiation** This element of the handshake allows the client and
    server to choose Cipher Suite that is supportable by both of them.'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'Common Gateway Interface (CGI) This allows Web users to interact with information
    servers, in order to provide a dynamic interface (as opposed to static)


    Common Gateway Interface (CGI) scripts These are invoked through a Web server
    for server-side, dynamic processing of data from users.


    configest Use the configest command to have the httpd configuration files parsed
    without having to restart the server.


    Container A container consists of a paired set of delimiters with the name of
    the scope to which the container applies.


    Content negotiation The method in which Apache can make different languages or
    media types, which are found in a single resource, compatible, usually through
    an index page where a user can select an item.


    Control structures These are statements in code that test conditions, such as
    the if, and for statements.


    Cookies These are client-side files used to store data, sometimes allowing sites
    to record user actions without consent.


    CookieTracking If mod_usertrack is compiled into Apache, cookietracking will enable
    Apache to send a user-tracking HTTP cookie for all new requests.


    Cryptography This is the science of information security. Cryptography deals primarily
    with the encryption and decryption of data.


    CustomLog This directive is used by Apache to customize a log file format.


    Daemon A program that runs in the background and interacts with the user only
    when called on.


    Deny This directive can be used to prohibit access to specific clients.


    Directives Directives can be grouped into containers that refer to a single directory,
    location, or virtual server in order to modify the default behavior in the main
    body of httpd.conf.


    DirectoryIndex This directive indicates the default files for a Web site in order
    of priority.


    Domain Name System (DNS) This is an efficient, reliable, distributed system that
    allows the mapping of arbitrary names to IP addresses across a network.


    Dynamic Shared Objects (DSO) These allow the user to add and remove features from
    Apache or to update a feature to a newer version, without recompiling the server.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# 284 Glossary


    Dynamic Web page A Web page that can change as it is updated from the server through
    a script or program; it can allow user interaction.


    Encrypted signatures A method to send documents that are verifiable and undeniable.


    Encryption This is any procedure used to convert plain text into scrambled text,
    in order to make it more difficult for unauthorized persons to intercept and interpret
    data.


    Engine directive This directive dictates the directories or virtual servers that
    PHP should examine.


    EOF End File.


    error_log Apache uses this to keep a log of all errors.


    Extended SSI (XSSI) Expands on SSI by allowing conditions to be attached to directives,
    definition of variables by the user, and extension of external programs and CGIs.


    Filtering The process of acting on the stream of content as it travels to or the
    server, allowing a user to alter the data multiple times with different modules.


    Forking When a stand-alone process splits into multiple processes.


    Form handler Handles input into a form using GET or POST formats and generates
    appropriate response.


    Forms Forms are used in scripting languages, such as HTML and PHP, to create data
    fields where the user can enter information.


    Fragment attacks These attacks use the IP fragmentation feature to create very
    small packets that split the TCP header information into separate packets, when
    reassembled, create a buffer overflow, which results in a denial of service.


    Function This is a set of code that performs an action, which the user may want
    to call repeatedly. Use a function to implement the function.


    Group A group is a collection of users; groups help system administrators organize
    users with similar needs into manageable units. Each user is placed into at least
    one group, and additional group membership can be assigned to the /etc/group file.


    Header A part of the request/response that contains information that tells the
    client or the server the type of information it is receiving.


    htpasswd This is an application provided by Apache that somewhat automates the
    generation of username/password files to be used with Web-based authentication.'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'HTTP HyperText Transfer Protocol is the protocol that browsers and servers
    use to submit and server requests.


    **http** A script that can start Apache’s daemon (located in `/usr/sbin/`).


    **httpd** Apache finds its settings in this configuration file. It has all the
    functionality of the former `access.conf` and `srm.conf` files.


    **HyperText Transfer Protocol (HTTP)** The protocol that Web browsers and servers
    use.


    **include** This directive can insert additional directives into the configuration
    files.


    **inetd** Daemon started at boot-up that tells the system which sockets to listen
    for and what programs to start when those sockets are accessed.


    **IP address** An identification code that uses four bytes of binary digits to
    distinguish a host on a network system.


    **KeepAlive** When in effect, it causes child processes to spend time waiting
    for requests on an open connection.


    **Keep-Alive** Allows persistent connections that help to send multiple requests
    over the same ICP connection.


    **Link** A reference to a file or a directory.


    **LogFormat** This directive is used by Apache to allow customization of the log
    file format.


    **logresolve** This simple script comes with Apache and allows a user to turn
    IP addresses in the `access_log` file into resolved hostnames.


    **Lynx** This is a widely used, text-mode Web browser. It can be found on any
    Linux distribution.


    **MD5** Reads data and calculates a cryptographic “checksum” that is very hard
    to duplicate, giving confidence that a file has not been intentionally modified.


    **mod_access** Along with `mod_auth`, it provides the authentication functions
    of Apache.


    **mod_auth** Provides the authentication functions of Apache and is used in combination
    with `mod_access`.


    **mod_perl** A package that allows a user to write Apache modules completely in
    Perl.


    **mod_php** A server-side, HTML-embedded scripting language that allows database
    requests through the Apache Web server.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# 286 Glossary


    mod_rewrite This module, found in Apache versions 1.2 and higher, uses a rule-based
    rewriting engine to rewrite requested URLs.


    mod_ssl This module is derived from the Apache+SSL patch. It provides Secure Sockets
    Layer (SSL) security to Apache.


    Module An Apache module is a piece of software, external to the main program,
    which allows customization and additional options.


    Multiview Instructs Apache to look for a document that is the best match for a
    client''s preferences.


    MySQL An open source relational database management system that is frequently
    used for accessing, adding, and processing data that is in a data-base.


    Name-based virtual hosting A virtual hosting scheme that allows more than one
    host to be run on the same IP address by adding names to the DNS as a CNAME.


    NameVirtualHost This is how the user will specify on which IP address the server
    will take petitions for name-based virtual hosts.


    Nobody This is a user with practically no privileges over a given system.


    Opera This Web browser is smaller than popular browsers, such as Netscape, but
    is known for its stability and speed.


    Order This directive, with Allow, controls who have access to the pages in the
    Web directory.


    Package A collection of files combined into a single file to simplify distribution
    and installation.


    Packet A data block that is transmitted over a network or the Internet. A packet
    is made up of three pieces of data: the data being sent, the data that guides
    the packet along the way, and the data that fixes problems that arise during the
    process.


    Packet filtering A router that allows the firewall to examine each packet of data
    against a set of predefined rules and determine whether to accept or deny the
    packet based on those rules.


    Perl Program used on various platforms that integrates the best features of awk,
    grep, sed, and tr.


    Phases Phases are one of the three critical components of the Apache API. The
    Apache flow of operation goes through eight phases each time Apache receives a
    request to serve a Web page, and a request flows from Phase 1 to Phase 8 in sequential
    order.'
  merge: -1
  pgno: 308
- img_proc: true
  md: 'PHP A script language and interpreter that is primarily used with Linux Web
    servers. It provides flexibility for producing dynamic content.


    Port A 16-bit number used to identify a network service on a host. Also, Port
    is a directive that can, when used in combination with BindAddress, specify an
    address and port, allowing different instances of the Apache server running on
    the same machine to listen for requests on different addresses or ports.


    Port 80 The port most commonly used for a Web server or Hypertext Transfer Protocol
    traffic.


    Port-based virtual hosting These hosts can be used if another IP address or alias
    for the server is not available.


    Pretty Good Privacy (PGP) Program used to secure communications, to verify that
    files have not been tampered with, and to verify that people are who they say
    are.


    Proxy This acts as a gateway for Web requests and services, permits and restricts
    access to a network based on a client''s IP address, caches to help the system
    run more efficiently, and controls access (or helps firewalls control access)
    to networks.


    Red Hat Package Manager (RPM) A program that provides flexibility in aging packages
    and is used in a number of Unix and Linux distributions.


    Request This log contains the actual HTTP request that was sent by a client, enclosed
    in quotes.


    Rewrite Often used with mod_rewrite, this directive helps perform an internal
    file-based subrequest. Rewrite can be used more than once.


    RewriteCond A directive used with mod_rewrite, RewriteCond defines a condition
    for RewriteRule. With one or more conditions preceding it, RewriteRule will not
    be used unless all these conditions apply.


    Rewrite rule This directive can run multiple times. It defines a simple rule for
    rewriting.


    Running herd A situation in which networks use TCP/IP to communicate with their
    clients rapidly increase their offered loads.


    ScriptAlias This directive is an important setting in the srm.conf file that gives
    an alias for the directory containing server-executed scripts.


    Secure Sockets Layer (SSL) This protocol layer provides communication between
    client and server, by allowing mutual authentication, and the use of digital signatures
    for integrity, and encryption for privacy.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Glossary


    **ServerName** This is the location where a host must be defined if it is going
    to have its own domain name associated with its IP address.

    **Server Side Includes (SSI)** This directive can be used in HTML documents to
    echo information for any environmental variable.

    **ServerSignature** This directive adds a line to logs with the server version
    number and the server name of the virtual host that generated the line.

    **ServerType** Stand-alone Mode in the `ServerType` directive in which the `httpd`
    daemon listens for connections.

    **Setcookie** This directive will use PHP to set a cookie in a Web browser, avoiding
    the JavaScript method.

    **Spoofing** An attack in which packets are disguised to look as if they originally
    came from another source, often the internal network behind the firewall.

    **Squid caching proxy** A program for caching HTTP information that does not require
    high-end hardware for significant performance increases.

    **srm.conf** A file for specifying what kind of documents can be created.

    **Standalone** This option is the default method for Apache. In stand-alone mode,
    servers are ready and waiting for connections. It is especially good for busy
    sites.

    **Static Web page** A Web page that does not change.

    **Style sheets** Describes to browsers how documents are presented on screens
    or print.

    **Sudo** Allows a system administrator to give certain users or groups of users
    the ability to run specific commands as root or another user while logging the
    commands and arguments.

    **Superuser** The only account that may request certain system services such as
    changing date/time, adding a new user account, and increasing the priority of
    a process.

    **TCP/IP** Transmission Control Protocol/Internet Protocol (TCP/IP) is the main
    protocol that allows all the computers on the Internet to communicate. Every computer
    is given a unique IP address.

    **TCP wrappers** These have a set of wildcards that allow matching services and
    clients.

    **Thundering herd** A problem in which all one thread put themselves back on the
    wait queue to wait for the next connection.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Glossary 289


    **Trojan horse** A program that appears to do a certain task for the user, its
    primary function is to perform another, possibly malicious, task.


    **Trusted networks** Apache secure networks that employ one or more of the following:
    Apache+SSL, `mod_ssl`, password authentication, `.htac-cess authentication, and
    anonymous access.


    **Uniform Resource Identifier** (URI) A subset of the URL that identifies the
    path to the Web page.


    **Uniform Resource Location** (URL) Part of the communication between clients
    and servers using HTTP.


    **Uniform Resource Name** (URN) Part of the communication between clients and
    servers using HTTP.


    **UserDir** Anything that uses a process on a system.


    **UserDir** A directive that assigns the name of the directory that is used as
    the individual''s root directory.


    **Virtual hosts** Allow multiple domain names to be hosted under one IP address
    or multiple IP addresses with different domain names to be hosted.


    **Webuser/Webgroup** Webuser and webgroup are the user and group that Apache will
    use to read files, execute CGIs, and create child processes.


    **Worms** A form of attack that enters a computer system as a stand-alone program,
    not attached to other pieces of code, and may cause unintentional damage or resource
    depletion.'
  merge: -1
