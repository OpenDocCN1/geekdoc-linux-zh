    # hosts.allow and hosts.deny


    One measure you take to lock down a system from remote intruders is controlling
    TCP wrappers. Two files determine who can utilize the services that are under
    control of TCP wrappers: `/etc/hosts.deny`. Using two lists gives flexibility
    in how to structure security. For tight security or for a system that does not
    need to offer many services to outsiders, a user can deny access to all clients
    and then follow through with the `hosts.allow` file to permit only a narrow range
    of clients to get through. An open configuration can allow all clients and then
    limit certain clients from accessing services. A user has the option of using
    both methods. Connections that have not been specifically denied are accepted
    by default.


    TCP wrappers have a set of wildcards allowing matching services and clients. One
    important wildcard needed to get a basic configuration together is ALL. It matches
    everything in the daemon or client fields such as the following:


    ```

    ALL:ALL

    ```


    will match all services and all clients.


    A configuration line can contain multiple entries for each field, which must be
    separated by a space or a comma. What follows is an example with multiple entries
    for `hosts.allow` that grants Telnet and FTP services to everyone from within
    the local domain and everyone `trusted.domain.com`:


    ```

    #/etc/hosts.allow

    in.ftpd, in.telnet.d: LOCAL, trusted.domain.com

    ```


    Clients can be denied or allowed in either file as long as it is specified with
    the DENY or ALLOW flag at the end of the configuration line. The following demonstrates
    a denial in the allow file:


    ```

    #/etc/hosts.allow

    ALL : untrusted.domain.com DENY

    ```'
