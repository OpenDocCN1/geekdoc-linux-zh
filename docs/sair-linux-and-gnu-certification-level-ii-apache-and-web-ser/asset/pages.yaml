  md: '# LAB

    VIII

    URL Rewriting


    # Purpose


    The lab will teach students the basics of URL rewriting, using Apache’s URL rewriting
    engine. Students will attempt two tasks involving mod_rewrite: rewriting a URL
    to point to a different Web server and rewriting a URL to a different file based
    on browser type.


    # Theory


    Apache has a powerful tool to redirect certain URLs based on pattern matching.
    The method that Apache uses to redirect URLs is to rewrite the URL sent to the
    server with the URL to which the client should be redirected. This is useful because
    it provides backward compatibility for outdated URLs. To be able to rewrite URLs,
    the server must have mod_rewrite installed and have appropriate patterns for the
    RewriteRule directive to match.


    mod_rewrite comes with several directives that can be used to rewrite URLs. Several
    important mod_rewrite directives are listed in Table VIII.1.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '| DIRECTIVE | DESCRIPTION |

    | --- | --- |

    | RewriteEngine | Enables URL rewriting |

    | RewriteLog | Sets the rewriting log file |

    | RewriteLogLevel | Determines the logging level |

    | RewriteCond | Provides conditionality of rewriting |

    | RewriteRule | Specifies actual rewriting rules |


    The RewriteEngine directive is the most important directive and must be set On
    in order to be able to make use of URL rewriting.


    RewriteRule is the most common directive and is used to actually change a URL.
    Every URL that should be changed must start with the RewriteRule directive, which
    takes the form:


    ```

    RewriteRule pattern substitution [flags]

    ```


    pattern is a regular expression for Apache to match, and substitution is the string
    that should be substituted into a matching URL. flags are optional modifiers that
    alter the directive. mod_rewrite recognizes wildcards when rewriting a URL, and
    several flags can be appended to a RewriteRule directive. pattern must start with
    (^) and end with ($). RewriteRule also performs wildcard expansion and can backreference
    selected text. An example of backreferencing is this:


    ```

    RewriteRule ''^(important\.docs) /secret/$1

    ```


    In this example, the $1 backreferences important\.docs (the slash is used to escape
    the period). Several backreferences can be used, by changing $1 to $N, where N
    represents the Nth backreference. Also supported are the wildcards (.), (*), and
    (+). The period matches only one character, the asterisk matches zero or more
    characters, and the plus matches one or more characters.


    Some of the flags that can be appended to a RewriteRule directive are listed in
    Table VIII.2.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Table VIII.2 RewriteRule Flags


    | FLAG | DESCRIPTION |

    | F | Return an http 403, forbidden, error |

    | G | Return an http 410, gone, error |

    | P | Perform an internal proxy request to substitution via the ProxyPass directive
    |

    | R | Perform an external redirect |

    | NC | Pattern is matched without respect to case |

    | C | Chain the current rule with the next rule |

    | L | Do not apply any more rewriting rules |


    RewriteCond is also commonly used so that a condition may be tested before executing
    a RewriteRule directive, much like an if statement when programming. The syntax
    for RewriteCond is:


    ```

    RewriteCond testpattern condpattern [flags]

    ```


    where testpattern is checked against condpattern and flags are optional modifiers.
    This can be remembered by the statement "if test-pattern matches condpattern,
    execute the following code." The RewriteRule syntax includes the use of server
    variables, specified as %{variable}, and backreferences to text grouped by parentheses,
    like RewriteRule.


    Some of the server variables supported by RewriteCond are:


    | REMOTE_ADDR REMOTE_HOST DOCUMENT_ROOT |

    | SERVER_NAME SERVER_USER SERVER_PORT SERVER_PROTOCOL |

    | TIME_YEAR TIME_MON TIME_DAY TIME_HOUR TIME_MIN TIME_SEC |

    | HTTP_USER_AGENT HTTP_REFERER HTTP_HOST HTTP_ACCEPT |


    A complete list can be found in the documentation for RewriteCond on the Apache
    Web site at http://httpd.apache.org/docs/mod_rewrite.html.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# A basic example of RewriteCond is this:


    ```

    RewriteCond %REMOTE_HOST ^theserver.com

    RewriteRule /$ /theerverpage.html

    ```


    This would rewrite all URLs to DocumentRoot/theerverpage.html only if the variable
    REMOTE_HOST matches theserver.com.


    Additionally, RewriteCond supports two optional flags: [OR] and [NC]. [OR] is
    used to test multiple conditions, while [NC] is used to disable case sensitivity
    for testpattern and condpattern. For example:


    ```

    RewriteCond %REMOTE_HOST 192.168.3.14 [OR]

    RewriteCond %REMOTE_HOST ^thatserver.com [NC]

    RewriteRule /$ /theerverpage.html

    ```


    will match the hosts 192.168.3.14, thatserver.com, or That-SERVER.com.


    For additional help constructing regular expressions, consult the regex man page.


    # Lab Exercises


    For this lab, it is assumed that the user has Apache running, with mod_rewrite
    installed. mod_rewrite will be used to rewrite URLs for two different cases: redirecting
    from one server to a new server and redirecting a user to a browser-specific page,
    based on the Web browser being used to access the server.


    Using the RewriteRule directive, add a line to httpd.conf to redirect a user from
    http://oldserver/~theuser/somepath to http://newserver/~theuser/somepath.


    Using the RewriteCond conditional statement, search for a user’s client type and
    then, with RewriteRule, redirect the user to a client-specific page.


    +   1. Open httpd.conf in a text editor.

    2. Redirect the home directories from one location to another using mod_rewrite.'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'Use mod_rewrite to redirect all URLs to /theuser/somepath/ to http://newerver/~the/somepath/
    with the following:


    ```

