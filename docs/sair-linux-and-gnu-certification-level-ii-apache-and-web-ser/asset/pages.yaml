  md: '# Apache Today


    Apache possesses a level of complexity that easily surpasses some operating systems.
    Although it is not necessary to learn every feature to gain a functional understanding
    of Apache, an introduction to the overall design of the environment and methods
    used is a good start.


    The purpose of this section is to describe some of the configuration styles that
    Apache uses and to provide an overview of some commonly encountered features.
    Later in the course, when topics are described in more detail, a context is developed
    on which to base further learning. Ultimately, the goal of this book is to teach
    the user to set up an Apache server.


    The user can also go to the Apache Web site, www.apache.org/docs/, and study the
    full documentation in depth. The online user documentation for Apache is one of
    the most well-written and accessible sources of information for any project.


    # How Does Apache Work?


    Apache is a monolithic Web server. It looks to centralized configuration files
    for all parameters that are not compiled. Apache works much like the Linux kernel.
    It forks off child processes, accepts loadable modules, and operates via user-specified
    configurations.


    # Web Server Concepts


    On a system functioning as a Web server, the server process listens for incoming
    requests on a specified port of the network interface and responds to them appropriately.
    Originally, a Web site consisted of a directory of static documents, which would
    be served on request. Special functions could be handled by CGI scripts that are
    executed on request.


    Over the years, people have developed variations of this basic function, requiring
    a reiring and retooling of the original Web server definition to the point that
    today''s Web users and authors expect a certain amount of active participation
    by the server. Dynamic content is everywhere now; today''s server must not only
    provide a Web page, it must create it on user demand. Although the basic process
    is the same, expected enhancements place much more demand on a server than what
    was required when static content was the only possibility.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Apache Child Processes


    Apache works by splitting itself and having the Apache copy handle the process.
    Child processes are the processes that actually do out content. When Apache receives
    a request, it chooses one of its idle child processes to handle the request. When
    the child is done, it returns to an idle state, ready for work.


    Every child completes its list of requests before dying. Killing a child process
    after it completes its list of requests also kills side effects of those processed
    requests, such as memory leaks. The user can determine the number of children
    Apache spawns at one time, as well as its life span. By default, each child handles
    an unlimited number of requests.


    # Apache Conventions


    A good way to learn how Apache functions is through its configuration. The first
    level of configuration occurs when Apache is compiled. RPM- and Debian-based installations
    decide many things by default, but when compiling from source these can be:


    +   - Whether Apache uses Dynamic Stored Objects or statically linked modules
    (modules will be described in further detail later in the chapter)

    - If static modules are chosen, tell Apache which modules to compile into the
    server at this point

    - Default location

    - Layout of Apache''s files and directories


    The next level of configuration occurs in http.conf after the installation. http.conf
    is a global preferences file that controls all aspects of the server, including
    the following:


    +   - Who can access the Web server

    - What dynamic modules the server loads

    - Where certain functions occur

    - What kind of information Apache will log

    - The location of the virtual Web sites Apache controls

    - What content is allowed'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'The last level of configuration may occur in .htaccess files, depending on
    what is stated in httpd.conf. These are small, local files that contain specific
    orders that apply to the directories where they reside.


    The httpd.conf file contains more than three-fourths of the Apache configuration
    options. It allows administrators to configure Apache to an optimal level at performance.
    This is possible because, based on users'' needs, Apache offers many levels of
    control through the httpd.conf file. These levels are called scopes. A scope can
    apply to an entire system, a virtual host, an absolute directory path, or even
    a single file. Wild cards can be used with scopes to give greater freedom. Containers
    are used to define each scope.


    The following are the four main containers:


    ```

    <Directory /path>

    # This container applies to the filesystem location of a directory.

    # For example, /home/user/public_html would point to user''s public_html directory.

    Directive

    </Directory>

    ```


    ```

    <Location /~*>

    # Location applies to a url. For example ~/user would point to user''s public_html
    directory.

    Directives

    </Location>

    ```


    ```

    <VirtualHost host_name>

    # VirtualHost applies to a virtual web site you are hosting, such as mysite.com

    Directives

    </VirtualHost>

    ```


    ```

    <Files file_name>

    # Applies to a file name, no matter where it is located. If file_name were index.html,
    then all instances of index.html (no matter what their location) would be affected
    by your directives.

    Directives

    </Files>

    ```


    # Directives


    A directive is a command given to Apache that controls its behavior. Directives
    are a single line of text with the following format:


    ```

    Directive [option [option]]

    ```'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'As shown, there is more than one option for your key word. Although there can
    be more than one directive in a given scope, each directive must occur on its
    own line. Directives that do not reside in any container apply to all scopes.


    # Handlers


    When a user requests a file, Apache decides what to do with it. For example, if
    the user accesses a file `hiccup.cgi`, Apache must execute that file as a CGI
    script and not try to display it as an HTML file. Handlers help you direct Apache
    to the correct helper application. For example, add a handler called `cgi-script`
    and apply it to all files with an extension of .cgi at the end.


    # Logging


    Apache logs almost everything that happens to it, from errors to http transactions
    and even cookies. The user can set the level of logging and what is logged in
    the `httpd.conf` file.


    # Modules


    Modules are chunks of software (usually written in Perl or C) that allow customization
    of Apache. For instance, for Apache to use Server Side Includes, the user must
    install that module.


    Even though Apache was originally developed with this concept in mind, it was
    not available when the first versions of Apache were being developed. Still, because
    it was already being planned at that time, integration of dynamic module loading
    into the Apache server came relatively easily.


    In early versions of Apache, modules were statically linked to the application
    during compilation. The specific configuration of a server was defined during
    the configure process before compilation. Using this method, many helpful modules
    of customization were available over the years, making a tremendous demand for
    the Apache server. Since the release of Apache version 1.3, it is possible to
    compile the server and the modules to support dynamic loading. With this option,
    the configuration of the server can be changed by restarting the server after
    editing the configuration file (rather than recompiling the server). Different
    instances of the server, with different features, can be started at separate times
    or simultaneously using different configuration files running the same base installation.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'Today, only two modules absolutely must be compiled into the server: http_core.c,
    which provides the core functionality of the server, and mod_so.c, the module
    that supports Dynamic Shared Objects (DSO).


    # Static Module Advantages


    On occasion, it may be desirable to compile other modules into the server so that
    they are always available, giving a slightly faster response and guaranteeing
    a specific version of the module is present at all times.


    # Static Module Disadvantages


    One disadvantage of compiling a module statically is the server that it continues
    to take up space within the server, even if its features are not used. Another
    disadvantage is that upgrading the static module requires the user to recompile
    the server.


    # DSO Advantages


    For the most part, the benefit of being able to add or remove a feature or update
    a feature to a newer version without having to recompile the server is tremendously
    helpful.


    # DSO Disadvantages


    When using DSO files to configure Apache, the server is approximately 20 percent
    slower at startup because the module loader must find all of the modules, load
    them, and resolve relocation symbols. This is not a serious problem, though, because
    startup is an infrequent event.


    On some platforms, the server may run about 5 percent slower because relative
    addressing of position-independent code is more complicated and slower than absolute
    addressing.


    There are a few other potential problems with implementing DSO modules, but these
    mainly apply to platforms other than Linux. See the Apache Web site for further
    details.


    # DSO Files


    Since the advent of DSO files, it is much more common for distributions to include
    the Apache server with binaries already installed and make installation of the
    source code optional. This means that the full set of files necessary to compile
    a new module acquired from another source is not initially present on the system.
    So that this would not be a problem, the authors developed the APache eXtension
    (APXS) product. This is a Perl program created at installation that gives access
    to all Apache header files,'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'as well as platform-dependent compiler and linker flags. The user is then able
    to compile Apache modules without the Apache source tree and without struggling
    with platform-dependent linker and compiler flags.


    # APXS Usage


    The following code gives a generic example of APXS usage, which builds a module
    that can be dynamically loaded into the Apache server:


    ```

    $ cd /path/to/the_module

    $ apxs -c mod_new_module.c

    $ apxs -i -a -n foo mod_new_module.so

    ```


    # Browsers


    There will be labs during this course in which you need to simulate what a client
    sees. To aid in this simulation, you will need an Window system install, as well
    as a few extra Web browsers, namely Netscape 4.7x, Mozilla, and a recent beta
    of Opera. Installation of these browsers, in addition to the X Window system,
    is recommended for this course.


    It is highly unlikely that a Web server would ever need a graphical interface
    or graphically enhanced browsers because they tend to make use of valuable resources.
    They will be used throughout this course, however for testing, examples, and labs.
    In addition, graphical interfaces will be recommended, if not required.


    > NOTE Throughout the course we use Lynx as a test tool. We recommend this program
    over Netscape due to the resource overhead that Netscape adds to your machine.
    If you prefer a GUI tool, use Netscape instead of Lynx.


    To download Lynx go to www.slcc.edu/lynx/realease. For more Lynx information go
