    Open your http.conf file and add the following lines:


    ```

    Auth_MySQL on apache_user

    Auth_MySQL_Info localhost apache_user k14u137

    Auth_MySQL_Encryption_Types MySQL

    ```


    Auth_MySQL_Info designates the standard database you are using,

    t username and password you use to connect to it, and the location

    from which you plan to connect (in this case, localhost).


    Auth_MySQL_Encryption_Types is the method by which

    mod_auth_mysql will encrypt your passwords. There are three

    options here:


    +   - Plain text

    - Crypt_DES

    - MySQL


