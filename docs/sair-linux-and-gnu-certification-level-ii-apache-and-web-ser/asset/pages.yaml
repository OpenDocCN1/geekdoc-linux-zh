  md: 'The -R switch causes the operation to be performed recursively so that all
    directories below the current directory are affected by the chown chmod commands.


    > **NOTE** You can specify both the owner and the group name in the chown command
    by separating them with a period, which will save you from having to run a separate
    chgrp command to change the group ownership.


    To use directory indexes or to read the directory from a script or Web page, directories
    will have to be set world-executable:


    ```

    # chmod o+x directory

    ```


    A common problem with log files is that the Apache process is not able to write
    to the log files or log directory. If this is the case, a simple solution is to
    give ownership of the log file to the webuser account:


    ```

    # touch /var/log/apache/(error,access).log

    # chown webuser /var/log/apache/(error,access).log

    ```


    The Touch statement creates the log files; the second statement gives ownership
    to the webuser account. For additional protection (on newer file systems), you
    can also restrict the user to append-only access on the log files:


    ```

    # chatter +a /var/log/apache/(error,access).log

    ```


    These commands are helpful when first creating the log files and also be included
    in any log rotation scripts you install so that the attributes are maintained
    across log rotations.


