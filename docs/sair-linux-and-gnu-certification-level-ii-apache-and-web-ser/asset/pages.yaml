  md: '# Installation


    # Purpose


    In this exercise, you will learn how to install and update Web server modules,
    features, and configurations so that they can meet your needs.


    This exercise will be centered around four packages that you will install: the
    apache-1.x.x.i386.rpm, php-4.0.x.i386.rpm, mod_php-4.x.x.i386.rpm, mod_perl-1.x.x.i386.rpm.
    The installation of these modules will give you moderate Web server functionality.


    After these are installed, you will also need to complete any site-specific configurations
    to the Web server that are required. The files used in this part of the exercise
    will commonly be contained in the apache/conf directory, with most of the work
    centering on the httpd.conf directory.


    # Theory


    For this exercise, we are using the .rpm files for the installation/update. The
    .rpm files are commonly used among many different distributions, not just Red
    Hat; however, a few distributions, including Debian, Slackware,'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'and Corel, do not include .rpm files in their distribution media, such as CD-ROMs.
    Even though .rpm files are not available in these distributions, you will often
    find that the rpm program is included. This program allows the user to install
    .rpm files, even if they are not included on the distribution-CD.


    # Lab Exercises


    This lab will go step by step through the installation, from downloading the required
    packages to getting them installed and configured. The lab will include the following
    steps:


    +   1. Downloading modules.

    2. Preinstalling Query.

    3. Installing the package.

    4. Setting up the base server.


    At the completion of this lab, the server should have the basic functions needed.


    # Downloading Modules


    The first step of this exercise is to acquire the packages needed. This can be
    found in many ways, including distribution media installation and acquisition
    from the Internet. The two most common places to find the packages are distribution
    CDs or the Internet. The packages on distribution CDs are not always up-to-date,
    and the desired packages are not always available. It is much easier to use packages
    downloaded from the Internet because they offer a centralized location where the
    packages can be found. This makes the packages very easy to find and readily available.


    Finding the .rpm packages on the distribution''s CD is easy. First, make sure
    the media is mounted. Then, enter the directory structure and locate the .rpm
    files. These are usually located in a directory that shares its name with the
    distribution. For example, the command for installing a package on a Red Hat CD
    would likely be this:


    ```

    bash# -i /mnt/cdrom/redhat/RPMS/packagename.ver.rpm

    ```'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Installation 197


    ```

    bash# rpm -i /mnt/cdrom/suse/sd/packagename.rpm

    ```


    The location of the packages varies between distributions, and it can take

    s time to locate the packages you desire. The most up-to-date packages

    must be obtained from the Internet.


    To find packages on the Internet, you must first locate a reliable site.

    RPMfind (www.rpmfind.com) and the official Red Hat Web site (www.redhat.com) and
    one of the most reliable sources for finding . rpm packages.


    The packages that you will need for this list are:


    ```

    apache-1.x.x.i386.rpm

    mod_perl-1.x.x.i386.rpm

    php-4.x.x.i386.rpm

    mod_php-4.x.x.i386.rpm

    ```


    The x’s represent the available, or current, minor version number of the

    package.


    Once you have these packages, make sure they contain what you will

    need and do not contain errors.


    # Preinstallation Query


    Once you have the packages, make sure that the packages are legitimate and

    do not have any visible errors. To do this, you will have to run the rpm command

    verify that the acquired packages are valid. This is done by running

    rpm with the -qp argument, which allows you to query the uninstalled

    package. The following is an example of how to query the uninstalled

    Apache package:


    ```

    bash# rpm -qp apache-1.3.12-25.i386.rpm

    ```


    If nothing is wrong with the package, the command will return the name

    of the package contained in apache 1.3.12-25.i386.rpm, as in the

    following:


    ```

    bash# rpm -qp apache-1.3.12-25.i386.rpm

    apache-1.3.12-25

    ```'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'This means that the apache-1.3.12-25.i386.rpm package contains the apache-1.3.12-25
    package. Repeat this process with all of the packages you are going to install.
    The next step will be to install the packages and then verify them.


    # Package Installation


    To install this package, use the -i option. It will install the selected package,
    as shown:


    ```

    bash# rpm -i apache-1.3.12-25.i386.rpm

    ```


    This installs the file that has been identified as the Apache package. Once this
    package is installed, continue to install all of the other packages in the same
    fashion. After the packages are installed, you will have to verify them to make
    sure they were installed properly, without errors. To do this, run rpm once again;
    this time use the -V option and the name of the installed package. The following
    command will test the integrity of the Apache package that was just installed:


    ```

    bash# rpm -V apache-1.3.12-25

    ```


    If the package has returned output, then errors are in the installation, and you
    should refer to the rpm man page in the signatures section; however, if the command
    did not return any output, then the package has been verified and should be safe
    to use. After all modules are installed and verified, you may wish to view the
    files installed by the packages. This can be done by using the rpm command in
    the following manner:


    ```

    bash# rpm -ql apache-1.3.12-25

    ```


    This will display the list of files that are part of the specified package, in
    this case apache-1.3.12-25. The displayed output will be quite long, and you will
    not need to see many of the results. For most of this exercise, you will want
    to focus your attention on the files in the httpd/conf directory to customize
    the installation.


    # Basic Server Setup


    Now that the verification and installation has been completed, the next step should
    be to edit the configuration files to customize Apache. This step is very easy
    if the administrator knows what to change to. If you are new'
  merge: -1
