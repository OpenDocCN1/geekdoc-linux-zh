    # Log File Formats


    The log file format can be changed. Most log analysis tools understand the default
    CLF format, but they may also support other formats. Apache allows customization
    of log files using the `LogFormat CustomLog httpd.conf` directives.


    To use the CLF format, type the following in the `httpd.conf` file:


    ```

    LogFormat "%h %l %u \%r" %>s %b" common

    CustomLog /var/apache/logs/access_log

    ```


    The LogFormat directive defines a format and assigns it a name. In this case,
    it is named common. Then the CustomLog directive tells Apache that the `/var/apache/logs/access_log`
    file is in the common format.


    Another popular format is the combined log format, which includes the referring
    URL and the browser type in each request.'
