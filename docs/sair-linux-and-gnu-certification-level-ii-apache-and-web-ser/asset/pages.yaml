    While no system connected to a network can be totally secure, the combination
    of Apache and Linux is quite distinguished in terms of security. The fact that
    Apache has a good security record may be surprising, given that it is freely available.
    Still, even some expensive commercial Web servers cannot come close to Apache’s
    security record. Of course, server management will make a big difference in how
