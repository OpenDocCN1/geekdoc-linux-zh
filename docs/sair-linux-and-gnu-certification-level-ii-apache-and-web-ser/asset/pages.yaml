    # Apache Initialization


    When Apache starts up, it begins as root reading the /etc/apache/httpd.conf file.
    It opens the log files and launches a number of child processes, by the StartServers
    directive in the httpd.conf file. These child processes run as the user and group
    defined by the User and Group directives in the httpd.conf file. This can be seen
    by starting the Apache server and typing:


    ```

    root@$ ps -ef | grep httpd

    ```


    This script returns the following:


    | Owner | PID | PPID | | |

    |---|---|---|---||

    | root10185 | 1 | 09:31:14 ? | 0:01 | /usr/apache/bin/httpd |

    | www-data 10189 | 10185 | 09:31:15 ? | 0:00 | /usr/apache/bin/httpd |

