    # Security Policies


    System attacks are possible on any network system. Absolute security is impossible,
    so policies specific to handling these issues as they happen must be in place.
    A security breach within a large company could affect thousands of users. How
    quickly the potential chaos can be resolved depends greatly on the preparation
