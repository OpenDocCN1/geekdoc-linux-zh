- img_proc: true
  md: 'These three methods can be used in any combination, but they are subject to
    limitations of the operating system. We will examine each method and offer some
    insight that will assist in choosing what will work best to fulfill a location''s
    hosting requirements. The choice of methods may be limited by facilities provided
    by the operating system and hardware of the host machine. In the instance of name-based
    virtual hosting, the methods may be limited depending on whether the intended
    audience is expected to be using earlier browsers.


    The term virtual hosting refers to the process of running more than one Web site
    from a single instance of the Apache Web server daemon. One machine can appear
    to many from the perspective of the Internet; hence, the hosts contained within
    are virtual. The virtual host area is a characteristic of Apache, independent
    of the operating system.


    At the other end of the spectrum is the extremely busy Web site that requires
    several machines to handle its load; many machines appear to be one site. This
    is beyond the scope of the course, as it entails more than just Apache. For most
    sites that require multiple Web servers, it is best to divide the pages into different
    sections. Each section should be on a different server, each with a different
    host name such as www.apache.org, dev.apache.org, and java.apache.org.


    The obvious way to run a Web site is to have one machine for each server. This
    arrangement is easy to describe and relatively simple to implement. The first
    few machines are not difficult. The limited range of sizes available for any Web
    site and any given machine makes the machine to be too large and sometimes even
    too small for the Web site. For moderately sized Web sites, a typical computer
    could be too large. The benefit of sharing the cost of a computer (including hardware
    costs, rack space rent, and maintenance costs) among several Web sites becomes
    obvious. Allocation of excess capacity on a shared server can provide a comfortable
    safety margin for all Web sites hosted from the server; they are not all likely
    to have peak usage at the same time.


    # Base Systems


    There are many configuration options for the networking end of Apache. Whether
    to use multiple instances of Apache for multiple domains, many Apache daemons
    should be running, and how to employ IP-based or name-based configurations are
    decisions that many Apache administrators'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'will encounter when running Apache. This section will provide information and
    background that is sure to help administrators as they decide how to use their
    Apache installation.


    # Virtual Hosting


    When hosting multiple Web sites, users have the option to run a single stand-alone
    daemon that will handle all of the hosted sites as virtual sites or to have a
    separate daemon for each. A combination of these methods will work as well (multiple
    stand-alone daemons with multiple virtual servers on one). The single daemon method
    consumes fewer resources because there is only one master process running.


    When a separate daemon is used for each hosted site, each one consume a share
    of system resources, but maintenance will be easier. Moving one of the daemons
    to a different machine involves only copying it, shutting it down on the first
    machine, bringing up the new copy on the new machine.


    Running multiple daemons allows each one to run under a separate (restricted)
    user ID, simplifying security management. It eliminates the need for suExec and
    secures scripts that cannot use suExec, such as scripts running under mod_perl
    and mod_php.


    Running multiple daemons on a machine requires additional resources. Multiple
    daemons, such as HTTPD, would require more memory, CPU time, and additional IP
    addresses for each daemon. If the machine does not have the resources to support
    such demands, consider some of the other virtual hosting options instead.


    # Configuring Separate Daemons


    To separate instances of Apache on the same server, a different IP address is
    required for each server. Then tell Apache which IP addresses to listen to the
    Listen directive. The following is the syntax for Listen:


    ```

    Listen <IP Address>:<port

    ```


    The Listen tells Apache which IP addresses and port number to listen to for HTTP
    requests. Each instance of the server should listen to a different IP address:


    ```

    # Listen 123.456.789.10:11

    ```'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'If a server configuration does not specify which IP address to listen to, Apache
    listens to all valid addresses. Hence, when running multiple daemons on the same
    machine, it is important to specify which address each daemon should listen to.


    # Directing the Request to a Virtual Host


    The first step in sharing a machine among multiple Web sites is finding a means
    of attaching the Web server to a unique address, which enables a Web browser and
    the Web server to find each other. With a system using Ethernet, this involves
    plugging another Ethernet card into an expansion slot and assigning a unique IP
    address to this new interface. Start another Web daemon, and configure it to respond
    to this new IP address. This setup works well and has few limitations.


    Although adding more Ethernet cards is not overly expensive, the cost of adding
    a card for each site may not be justified. The bandwidth of a single card exceeds
    the needs of most Web sites by such a margin that the first card would have been
    able to handle several Web sites if only there was a way to share them. As the
    user adds more sites to a system, the number of expansion slots can be depleted
    before the machine’s capabilities to run additional server daemons are exceeded.


    Even though there may be times when the user finds the need to add cards to a
    machine, obtaining a Web server daemon to distinguish between requests for several
    different Web sites could allow several different sites to be served through a
    single card on a single machine.


    There are two ways to distinguish between requests, IP-based virtual hosting and
    name-based virtual hosting.


    # Single Daemon/Virtual Hosting


    This method uses a single instance of the http daemon in conjunction with IP-
    or name-based hosting to manage things. Consider the basic characteristics of
    the single daemon method to determine if it is suitable for your location’s needs:


    Using the single-daemon http method has the advantage of consuming fewer system
    resources because there is only one http daemon running. On a busy site, this
    can make a difference in system load.'
  merge: -1
