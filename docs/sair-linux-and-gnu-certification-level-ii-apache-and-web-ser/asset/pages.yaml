    # Password Authentication


    Apache can perform authentication tasks through the mod_auth module. It is not
    necessary to specify its inclusion during compilation, as it is part of the default
    configuration. A handful of directives are needed to implement authentication
    with mod_auth. These directives work in conjunction with the .htaccess file or
    <Directory> section to control access.


    For authentication to work, you must provide mod_auth with the information it
    needs about the users and the content that is to be protected, including the following:


    +   - User and group information

