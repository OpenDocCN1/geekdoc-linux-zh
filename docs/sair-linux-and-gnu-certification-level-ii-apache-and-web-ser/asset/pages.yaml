- img_proc: true
  md: '# Networking 119


    Settings may be easier to maintain because some of the configurations are shared,
    such as having only one httpd.conf file to edit when making changes to the daemon''s
    behavior. The user can add new hosts by adding a small section in httpd.conf with
    host-specific information. All other major settings will be inherited from the
    directives outside of the VirtualHost sections. Using the Include directive allows
    creation of separate configuration files for each virtual host.


    A potential security/privacy problem arises when using a single daemon. The httpd
    daemon runs with permissions that have been assigned to it. If Webmasters are
    be able to access certain content or tailor the server''s behavior to their needs,
    they must have the permissions to implement them. Permissions also give them the
    ability to see or even change parameters that control the other hosts.


    # IP-Based Virtual Hosting


    If there are many available IP addresses, IP-based virtual hosting is one option
    for hosting multiple Web sites. Each host has a unique network address that allows
    it to be found on the network. IP-based virtual hosting is operating system dependent
    and requires IP aliasing, the assignment of multiple IP addresses to the same
    interface.


    To set a single NIC with multiple IP addresses with IP aliases, enable the feature
    in the kernel.


    IP aliasing should be enabled by default with most distributions. If IP aliasing
    has not been enabled, the user will need to recompile the kernel to enable support
    for this feature. IP aliasing can be found under Network Options in the kernel
    configuration menus.


    Use ifconfig (interface configuration) command to control which IP addresses are
    attached to the interfaces on a system. Initially an interface has a single IP
    address, determined when the system is first configured.


    Issuing ifconfig command with no arguments displays the current status of all
    interfaces on the system:


    ```

    # ifconfig

    eth0 Link encap:Ethernet Hwaddr 00:80:C8:14:73:77

    inet addr:192.168.0.255 broadcast:192.168.0.255 \ UP BROADCAST RUNNING MULTICAST
    MTU:1500 \ Metric:1

    RX packets:1849 errors:0 dropped:0 overflows:0 frame:0

    TX packets:1359 errors:0 dropped:0 carrier:0

    ```'
