  md: '# Security Fundamentals


    > NOTE The -f option is used to specify the configuration file.


    The visitors to a Web site have access similar to the user ID that is running
    the server process, which is fine because user ID should have limited permissions.
    When things are configured properly, the user ID has a narrow range of functions
    that it is allowed to perform on the machine. Keeping the secure means keeping
    that user ID''s access to a narrow range.


    > NOTE Although Apache can be started by an individual without root access, the
    Apache process will not be able to ea to a different user ID (therefore running
    as that user) and will not be able to attach to a port number less than 1,024.
    This can be useful under some limited circumstances but is not ideal for a publicly
    accessible system.


    # Permissions


    File permissions are an important aspect of security for a Linux system. If care
    is not taken with the permissions of certain critical files, regular users can
    implement changes that are normally restricted to the superuser.


    For Apache to run as a non-privileged user on port 80 (or any port less than 1,024),
    the user must launch it from root. This non-privileged user (let''s call it webuser)
    must be able to read the Web document tree (but probably not make changes to it).
    So that the webuser is able to read the document tree, be sure that all files
    and directories that must be served from the document tree are set-readable:


    ```

