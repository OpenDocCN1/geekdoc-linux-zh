  md: 'This chapter will introduce the Apache API with a general overview. It will
    give information about how Apache handles Web requests (i.e., what is going on
    under the hood).


    # Modules


    Modules are the first critical component of the Apache API. A module is a bit
    of code written to handle a specific task, such as logging, authentication, directory
    and alias handling, access control, content negotiation, CGI and Server-Side Includes.
    Most of Apache is implemented as a module—the Apache core handles some pieces
    of the server but generally hands processing off to a module.


    Each module can be compiled into Apache, similar to a statically linked library,
    or compiled as a dynamically shared object (DSO), similar to a shared library.
    Static modules become part of the httpd binary and are automatically recognized
    by the Apache core. DSOs each have a file on the file system and must be loaded
    by a LoadModule command in Apache’s httpd.conf file in order to be initialized.
    The flow of operations is shown in Figure 2.2.


    +   1 Apache starts up

    2 All static modules are initialized

    3 httpd.conf is parsed, looking for LoadModule commands

    4 Referenced DSO modules are loaded from the filesystem

    5 Referenced DSO modules are initialized

    6 Apache is ready to listen to web requests


    Figure 2.2 Apache flow of operations.'
