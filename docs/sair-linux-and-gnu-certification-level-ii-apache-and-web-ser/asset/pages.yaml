    # System Calls


    Most CGI programs perform system calls, such as reading from or writing to a disk
    file, or perhaps executing other programs. If any of the variables passed to the
    CGI are used in formulating the parameters to this system calls, malicious users
    can manipulate them to do undesirable things.


    Certain commands are very dangerous; the eval command is one of them. eval lets
