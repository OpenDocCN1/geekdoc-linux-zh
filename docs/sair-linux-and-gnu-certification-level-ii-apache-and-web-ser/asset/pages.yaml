  md: '# Configuration of a Proxy


    # Purpose


    The purpose of this lab is to teach you how to configure a caching HTTP proxy.
    A proxy can perform some of a firewall''s functions, but typically it is used
    to allow users to access Web pages from behind a firewall or to speed up performance
    of an Internet connection.


    # Theory


    A proxy server is a machine that processes requests for data from one system,
    then passes that request on to the proper server. Proxies are often used to process
    HTTP requests through a firewall. If the proxy also saves requested data, it becomes
    a caching proxy. Because they store information locally and do not need access
    to the primary server, caching proxies allow more efficient use of the network.
    Apache''s functionality may be extended to include proxy features by using the
    module mod_proxy.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Installing mod_proxy


    The first step to setting up Apache with a proxy server is to install mod_proxy.
    Apache can be updated with mod_proxy in two ways. First, Apache can be recompiled
    to include mod_proxy in the core distribution. Second, if Apache has Dynamic Shared
    Object (DSO) support, mod_proxy will be inserted as a module at run time. For
    this lab, mod_proxy will be loaded as a module at run time. Therefore, Apache
    must have mod_so compiled, which will provide loadable module support.


    # Configuring httpd


    After mod_proxy has been integrated into Apache, httpd.conf must be changed to
    take advantage of the proxy features. This is done by adding directives recognized
    by mod_proxy to httpd.conf. Table VII.1 lists some of the most common directives
    supported by mod_proxy.


    A more detailed list of directives for mod_proxy can be found on the Apache Web
    site: http://httpd.apache.org/doc/mod/mod_proxy.html.


    After making changes to httpd.conf, the Web server must be restarted for the configuration
    changes to take place.


    Table VII.1 mod_proxy Directives

    | DIRECTIVE | DESCRIPTION |

    | ProxyRequests | Determines if Apache will function as a proxy |

    | ProxyRemote | Specifies a proxy for Apache to use |

    | ProxyPass | Converts requests for local data to a proxy request |

    | ProxyBlock | Blocks proxy connections to specified sites |

    | NoProxy | Instructs Apache to serve requests directly, instead of proxying |

    | ProxyDomain | Appends the domain name within intranets |

    | CacheRoot | Sets the directory to write cache files to |

    | CacheSize | Sets the size of the cache in kilobytes |

    | NoCache | Specifies locations not to cache from |'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Configuring the Client


    Once the proxy server has been properly set up, any client wishing to use the
    proxy server must be configured to use the server. This is done by changes to
    the client''s Web browser settings. For the purposes of this lab, it is assumed
    that the client is running Netscape Navigator for HTTP connections. After the
    settings have been changed, the client should be able to make HTTP connections
    through the newly configured proxy.


    # Lab Exercises


    The following exercises will take you through the steps of installing mod_proxy,
    configuring httpd, and configuring the client.


    # Installing mod_proxy


    The mod_proxy module is required for Apache to run on a proxy server. The following
    steps show you how to install mod_proxy.


    +   Make sure that Apache has loadable module support compiled in. From the command
    prompt, type:


    ```

    httpd -l

    ```


    +   This will list all currently loaded modules. If mod_so is not listed, Apache
    must be recompiled to include it. If mod_proxy was listed, there is no need to
    complete the rest of this section. Skip to the next section.


    +   Compile the mod_proxy module according to the instructions included with the
    distribution of Apache. mod_proxy is part of the base Apache distribution and
    is included with the Apache source.


    +   To have mod_proxy loaded every time Apache is started, use the LoadModule
    directive. First, open httpd.conf with a text editor, and add the following to
    the Global Environment Section:


    ```

    LoadModule mod_proxy path/to/mod_proxy.so

    ```


    # Configuring httpd


    This section shows you how to enable the proxy server.


