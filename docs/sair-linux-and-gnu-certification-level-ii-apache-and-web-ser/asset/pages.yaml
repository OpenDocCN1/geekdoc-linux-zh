  md: '# 94 Chapter 2


    The fields are as follows:


    ```

    host ident autuser date request status bytes.

    ```


    If no information exists, the log shows a hyphen (-) in its place.


    # host


    This is the IP address we come from. Apache can automatically do a reverse look-up
    on each IP and fill in the actual host name. To enable this, edit the httpd.conf
    file and turn on the HostnameLookups directive. Type:


    ```

    HostnameLookups On

    ```


    DNS look-ups to be very slow, so this feature should not be activated. If actual
    host names must be tracked for traffic analysis purposes, the DNS look-ups at
    log analysis time. Most popular log analysis tools have an option to resolve IP
    addresses.


    # ident


    Apache can do an ident check (see RFC 1413) on the incoming HTTP connection. An
    ident check is an attempt to determine the identity of a user of a particular
    TCP connection. To turn on this feature, edit the httpd.conf file, and add:


    ```

    IdentityCheck On

    ```


    IdentityCheck requires that the client run ident if it is to work.


    > NOTE ident checks can be extremely slow, so do not use this feature on a busy
    Web server. ident checks can also be faked, so the information should not be explicitly
    trusted.


    # autuser


    If the requested document requires access authentication, then the authenticated
    user ID is placed in this field.'
