  md: '# Theory of Operation


    Now that Apache is installed, the administration of the Apache server and modules,
    as well as the hardware and operating system that is running the Apache server,
    must be continued. This section will discuss the various roles and responsibilities
    a system administrator or Webmaster will have while configuring and installing
    the Apache server.


    # Being a Webmaster


    The title of Webmaster carries many different duties, all of which will be the
    responsibility of one person at some of the smaller Web installations. In a larger
    installation, different parts of the task are likely to be divided among several
    different people. The main groups of duties are:


    +   - **System administrator.** Having total authority over the system.

    - **Configuration management.** Configuring the Web server.

    - **Content management.** Controlling design and deployment of the Web pages.


    The system administrator has responsibility for the integrity of the system itself.
    This person is suspicious of changes to the system and is ever vigilant against
    intrusions from outside or from ordinary users exceeding their boundaries. The
    system administrator is in charge of the base operating system and usually the
    the well.


    In the Web server''s space, there are settings specific to each Web server, the
    domain of the Webmaster. This Webmaster is interested in protecting the more than
    the system, and yet changes made to the server configuration files can cause problems
    for the system administrator. This manager must have awareness of the consequences
    at this level specific to Web operation and beyond the knowledge of a general
    Unix system administrator. Though the Web daemon must be started by someone with
    root privilege, this person has no other needs for root privilege. Integrity of
    the Web server configuration files is the highest priority of this task.


    There is yet another Webmaster—one who trades in content and process more than
    configuration. This person works with the artists who create the Web pages and
    directs the structure of the Web site. This person depends on the configuration
    being correct and makes requests based on the needs of the site. The tree of the
    Web site is built by this person. Direct contact'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'with building the Web server and setting the configurations is not central
    to this job, though this person will need to request changes when new features
    or new revisions become available.


    In an individual''s site or a moderately sized corporate site, these three conflicting
    personalities can be embodied in a single individual, or all duties can be shared
    by several people. In a larger site, they can be handled by two, three, or more
    people, with the root user possibly being a different person than the Webmaster.
    The lines that separate the responsibilities can vary from one installation to
    another. At an Internet Service Provider (ISP), the provider could perform the
    first job or the second jobs (the third job will fall mainly with the end client).
    With virtual system methods, an ISP could gain control of an entire "virtual system"
    to a client or just the configuration and content files or content files alone.
    If you are in charge of a system that is shared by many users, you will have to
    decide where the responsibilities lie and what powers to give each level of Webmaster.


    When the system is controlled by a single organization, the lines of division
    are much less critical. At a corporate site, the system administrator might give
    up root privileges to the Web managers, either temporarily or for a specific system
    dedicated to Web use.


    When a system is shared among unrelated users, decisions at this level have more
    impact on system security. You will have to decide how much freedom to give to
    the Webmasters at your site and how much personal freedom to give in order to
    maintain control. If you keep control over server configuration, you will have
    to be available to perform configuration changes. If you give up control, you
    will want to do it in one way that doesn''t give up the security of your other
    clients.


    Specific commands can be opened up to the Webmaster or to the end user with tools
    like the following:


    +   **sudo (super-do or pseudo-su).** Allows a user to run selected commands as
    superuser. Visit www.courtes.com/sudo.


    +   **chroot (change root).** Restricts access to another user''s directory tree
    by changing the root directory that the user sees as the root of the actual system
    (probably just the user''s personal directory). Visit http://hoohoo.ncsa.uiuc.edu/tutorials/chroot.html.


    +   **suex.** Switches the effective user of a CGI script to that of the user
    account. Visit www.apache.org/docs/suex.html.'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'When a group of Web sites is shared by the same organization, or perhaps different
    divisions or departments of the same corporation, the group of sites will probably
    be managed by the same person or group of people. There is no concern about information
    being shared between them or one of the sites being sabotaged by a partisan of
    another site. In another installation, perhaps in a public Web hosting service,
    the adjacent Web site may be occupied by a total stranger. In this latter instance,
    there is a need for separation between users of each site. Control of the Web
    server configuration file becomes a sensitive issue.


    Of course, there are several solutions. A separate Web server daemon for each
    site could allow Web client to manage its own configuration file and not have
    access to its neighbor''s. Restricting management of the configuration file to
    the site administrator is another alternative.


    # Tuning


    Running Apache on Linux works quite well, even under high server loads. There
    are a number of settings and directives that can be adjusted to enhance performance.
    Apache 1.3 introduced a number of performance-enhancing changes to the code and
    default configuration. As a result, not much needs to be modified, compared to
    previous releases. A few things still remain that can enhance performance further,
    including optimizing Linux for increased speed and process capacity.


    Before optimizing, think about what the server needs to do. Will other services,
    such as mail, FTP, and databases, running on the same box? Will enough images
    be served to require a separate server?


    Many large Apache installations separate the data server from the HTTP. If planning
    a database-driven Web site, it pays to look at that option. Freeing the Web server
    from working with a database helps it focus on delivering static html content.


    # Preparing Apache


    The Apache developers have increased the performance of the server with the release
    of 1.3.14. As a result, performance is nearly optimal. Some additional adjustments
    that can increase performance have not been included by default because their
    optimal settings can be determined only by the administrator at a given location.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# Allow and Deny


    The Allow and Deny directives can slow things down, depending on how they are
    used. If the target location is an IP address, there is not a problem. If the
    target is a domain name, it will take some time to resolve the domain name into
    an IP address. Apache incorporates spoofing protection with these directives,
    a reverse look-up also occurs. Use IP addresses with these directives to avoid
    the look-penalty. Deny access starting at the system root directory, and allow
    access selectively where needed. This way access permissions will not have to
    be checked with each request.


    # MaxClients


    This directive controls how many visitors Apache will handle at once. If the number
    of requests exceeds this value, clients will be locked out. This is a safety feature
    to keep Apache from taking the entire machine along as it absorbs all available
    system resources. Check to see if swapping is taking place when MaxClients is
    reached, and adjust the value accordingly. If there is no swapping at this point,
    the value can be increased. Decreasing can reduce swapping. Adding RAM can also
    reduce swapping and increasing MaxClients, resulting in more simultaneous connections.


    The upper limit of 256 is hard-coded at compile time. Increasing beyond the current
    limit will require a recompile, after putting the desired value in the HARD_SERVER_LIMIT
    variable that is defined in httpd.h.


    # TCP/IP Version


    Be sure to have the latest version of the system kernel. The serving of HTTP invalidates
    many assumptions built into Unix kernels from as recently as 1994 or 1995.


    # Host Name Look-Ups


    Before Apache 1.3, host name look-ups defaulted to On. This required a completed
    DNS look-up before Apache could finish a request. With Apache 1.3, the feature
    is defaulted to Off. Now, if the allow from domain or deny from domain features
    are used, a reverse DNS look-up will be performed (a reverse followed by a forward
    to ensure that the reverse is not being spoofed). If an IP address is used instead
    of a domain name, this penalty will not occur.'
  merge: -1
  pgno: 81
