  md: '# Firewalls and Network Architecture


    There are different ways to set up networks, and the architecture ultimately depends
    on the requirements of the network. The simplest network has two components: an
    internal network and an external network with a firewall between the two.


    Still, corporations have needs that exceed the simple two-network design. As a
    result, separate networks are created to house the public access servers. Often
    referred to as the demilitarized zone (DMZ), this network contains the mail, DNS,
    FTP, and Web servers. For security, the DMZ is configured to provide limited access
    from the Internet to specific public information servers.


    As different services and requirements are needed, new portions of the network
    can be designed. The bottom line for creating all of these separated networks
    is to allow the application of different sets of security rules for each network.


    # Securing the Firewall Machine


    Obviously, it is of great importance to make sure that the firewall machine is
    locked down and not open to attacks. The first step in doing this is to turn off
    all necessary services. Then, rename or delete the current `/etc/inetd.conf` file
    and create a new one with this line:


    ```

    telnet stream tcp nowait /usr/sbin/in.inetd in.inetd

    ```


    This allows for Telnet service for remote management of the firewall system. After
    creating the new inetd file, send the SIGHUP signal to inetd.


    The /etc/passwd and /etc/shadow should contain an absolute number of accounts
    belonging to the administrator, root, bin, daemon, sync, shutdown, halt, and operator.
    Furthermore, the system should not be part of an NIS domain, and the machine should
    be used only for firewall administration and operation.


    Superfluous daemons (nfsd, dhcpd, named, atd, etc.) as well as Windows, should
    not run on the system. To disable particular daemons from starting at run level
