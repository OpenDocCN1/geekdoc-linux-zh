    Untarring the apache_1.3.14+ssl_1.42.tar.gz will place the contents in the same
    directory as the other Apache files. To do this, use the following:


    ```

    tar xzvf apache_1.3.14+ssl_1.42.tar.gz

    ```


    # Compile Apache with mod_ssl Support


    The next step is to apply the SSL patch to Apache. Apache+SSL comes with a script
    to handle this step. If the script does not work on the system, the patch should
