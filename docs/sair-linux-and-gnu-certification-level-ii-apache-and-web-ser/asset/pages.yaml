    ```

    </VirtualHost>

    ```


    Finally close each section with the virtual host closing statement. This statement
    is the same for each host. Any directive is permissible in a Virtual-Host section
    except those that affect low-level server operations.


    Examples of such prohibited directives include the following:


    +   - ServerType

    - User

    - Group

    - StartServers

    - MaxServers

    - MinSpareServers

    - MaxRequestsChild

    - BindAddress

    - PidFile

    - TypeConfig

    - ServerRoot


    Besides the standard directives, there are two special directives specific to
    the VirtualHost section: ServerAlias and ServerPath.


    Also, be sure to include configuration for separate log files for each virtual
    server.


    # Name-Based Virtual Hosting


    Another way to do virtual hosting does not require multiple IPs but uses the NameVirtualHost
    directive. Apache listens on one IP address and serves the Web site based on the
    Host Header sent by the browser.'
