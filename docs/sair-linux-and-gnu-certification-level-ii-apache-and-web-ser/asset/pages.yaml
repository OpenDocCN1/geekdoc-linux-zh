  md: '# Module Performance and Functionality


    Apache implements a high-performance Web server with high yields in stability.
    The combination of Apache and Linux provides the modular design, speed, and stability
    that is essential for a great Web server. With its modular architecture, users
    may either add or remove modules to adapt its functionality for individual needs.
    Modules make Apache the best choice for a Web server in a scalable environment.
    A wide variety of modules is available to cover most needs.


    Users can compile Apache with dynamic modules and add or remove them as needed.
    For example, to increase security, search the Internet and download mod_ssl and
    turn an existing Apache server into a secure server with 128-bit encryption.


    Apache is the most flexible and extensible Web server available today. Internet
    polls have shown it to be the most prevalent server as well.


    On top of Apache’s SSL capabilities and its modular design, users can also run
    Common Gateway Interface (CGI) programs. CGI is a standard that allows programs
    to communicate with the Web server, as well as transfer information to from the
    World Wide Web. Any program can run as a CGI as Apache is configured properly.
    CGI allows the program to communicate with the Web browser and run the user as
    a protected process. Under Linux, CGI programs run the user as Apache. This allows
    users to forget about some of the security concerns associated with the scripts
    running as root. CGI scripts are a very important part of the Apache server; Apache’s
    resources are not limited to SSL, CGI, and modules. Apache also provides great
    documentation on all of its features available on its Web site.


    # Enabling Modules


    The Apache server implements modules to enhance the functionality of the httpd
    daemon. The modules contain source code that provide the many functions of Apache.
    Users can explicitly choose which modules to use at compile time by specifying
    them in the configure stage. Inserting modules one at a time at the command prompt
    allows specification of the modules to compile. Be careful; the more modules added,
    the higher the binary size, and there may be a slight degradation in performance
    as well. There is another way to specify modules in Apache. The src direc'
