  md: '# Host Header Request


    Unlike HTTP/1.0, HTTP/1.1 requires a host header in the client’s request, even
    if it is blank. The following is an example of a 1.1 header that includes the
    host header:


    ```

    GET /e8926506/siberia.htm HTTP/1.1

    Host: studi.tuwien.ac.at

    ```


    # Chunking


    HTTP/1.1 chunks data as it sends back to the client who requested it. According
    to HTTP/1.1’s RFC, chunking means the following:


    > The...encoding modifies the body of a message in order to transfer it as a series
    of chunks, each with its own size indicator, followed by an OPTIONAL trailer-entity-headers.


    Further, chunking “allows dynamically produced content to be transferred along
    the information necessary for the recipient to verify that it has received the
    full message.


    So what does mean mean?ing came about as a way to get around the need for a server
    to know the size of a response is sending. If a Web server is to use persistent
    connections with HTTP/1.1, it must know the Content-Length of a response sends
    back to a client. Because of the dynamic content created by CGIs and like, Content-Length
    of a given page become variable and impossible to know before hand. The server
    grabs a small bit of the dynamic output, determines its length, and sends it out
    to the client. Then it goes back for more.


    As an additional advantage, once the server has sent all of a chunk-encoded document,
    it has the option to send additional response headers. Because the server is chunking
    all the data anyway, these headers can be dynamic, just like the content.


    # Multiple Hosts


    Apache has three separate ways to host many sites on a single machine:


    +   - Run multiple instances of the httpd daemon.

    - Use Apache’s IP-based virtual hosting.

    - Use Apache’s name-based virtual hosting.'
  merge: -1
