  pgno: 204
- img_proc: true
  md: 'To set a variable in XSSI, use the set command:


    ```

    <!--#set var="boat" value=''Titanic'' -->

    ```


    Now, whenever boat (<!--#echo var="boat"-->) is used, XSSI will return "Titanic".


    For another reference, see Apache''s SSI tutorial at http://httpd.apache.org/docs/howto/ssl.html.


    # ModSSL versus Apache+SSL


    There are two main SSL packages that can be used in an Apache install, ModSSL
    and the Apache+SSL patch. The following section presents the advantages, disadvantages,
    and installation issues of both packages.


    # SSL-mod_ssl


    mod_ssl is a module derived from Ben Laurie''s Apache+SSL patch.


    Essentially, these patches are given to the community at large, alternatives to
    one another. They are no different from choosing whether to use Vi or Vim.


    The Secure Sockets Layer (SSL) protocol was developed by Netscape to provide a
    secure channel for sensitive information, as that used in online credit card transactions.
    SSL is now an Internet standard, and Apache is able to implement it through a
    module.


    # SSL–Secure Sockets Layer


    The Secure Sockets Layer protocol is a protocol layer that may be placed between
    a reliable connection-oriented network layer protocol (e.g., TCP/IP) and the application
    protocol layer (e.g., HTTP). SSL provides secure communication between client
    and server by allowing mutual authentication, the use of digital signatures for
    integrity, and encryption for privacy.


    The SSL protocol is designed to support a range of choices for specific algorithms
    used for cryptography, digests, and signatures. This allows algorithm selection
    for specific servers to be based on legal, export, or other concerns, and it also
    enables the protocol to take advantage of new'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# 184 Chapter 4


    algorithms. Choices are negotiated between client and server at the establishment
    of a protocol session.


    The SSL protocol is a low-level authentication and encryption method used to secure
    transactions in higher-level protocols, such as HTTP and FTP. It was developed
    by Netscape, but support is provided by most browsers and Web servers. The current
    SSL protocol version is 3.0, but the IETF Transport Layer Security (TLS) specification
    Version 1.0 actually supersedes it. (SSL and TLS are generally discussed together,
    as TLS is mainly a refined version of SSL.)


    SSL includes provisions for server authentication (verifying the server''s identity
    to the client), encryption of data in transit, and optional client authentication
    (verifying the client''s identity to the server). By employing SSL-enabled servers
    and clients, it is possible to send encrypted data, such as passwords and credit
    card numbers, across the Internet without fear of interception.


    Clients requesting documents stored in SSL-enabled directories must use the https://
    URL format instead of the standard http:// format. One reason for this is that
    SSL-enabled Web services are generally offered on a different port than non-encrypted
    transmissions, normally port 443.


    # Implementing SSL in Apache


    There are two ways to add SSL to Apache. The first method is to replace Apache
    with Apache-SSL. This is a version of Apache that has SSL security included (Actually,
    it is distributed as a patch to the Apache source code). The other way is to add
    the mod_ssl module to a standard version of Apache (In most circumstances, Apache
    must be recompiled to make mod_ssl work). More information on mod_ssl can be found
    at www.apache.org/. We will focus on Apache-SSL for the rest of this course.


    # Legal Issues


    SSL data transport requires encryption, and many governments have restrictions
    on the import, export, and use of encryption technology. Also, a few of the encryption
    algorithms are patented in some countries. With SSL included in a software package,
    its distribution involves a number of legal issues. This is why SSL is distributed
    separately from the standard Apache distribution.'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'Until recently, the United States prohibited the export of strong encryption,
    normally defined as anything beyond 40 bits. This ban has recently eased, but
    the full implications of the new law have not been entirely analyzed. Within the
    United States, SSL can be used for any purpose due to the expiration of the patent
    held by RSA Data Security on the RSAREF code. This patent never applied generally
    outside the United States, so now you should be able to use the code for any purpose.


    Even though your Apache server should be well established by now, it will require
    constant maintenance. The next chapter will discuss some simple solutions to common
    problems that may arise.'
  merge: -1
