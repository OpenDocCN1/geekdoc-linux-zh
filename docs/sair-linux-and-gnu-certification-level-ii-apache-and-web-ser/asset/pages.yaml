  md: '# Introduction


    Preparing for test content is paramount in criteria-based certification tests,
    and Cair takes pride in the coordination of test topics from the Knowledge Matrix,
    objectives, competencies, study guides, and exams. These topics specify exact
    criteria that the candidate must meet. The tests directly measure these topics,
    and results are reported with a detailed summary for each of these six areas:
    theory of operation, base system, shells and commands, utilities, applications,
    and troubleshooting.


    Each exam consists of 50 questions that can be answered, reviewed, and changed
    up to 60 minutes. Typical test takers use about 45 minutes to complete the exam.
    Successful completion of each test requires 74 percent correct, or 37 correct
    answers. Unlike tests that assign a rank to a test relative to all other test
    takers, Cair emphasizes mastery of material. The results directly inform the candidate
    of the mastery level in each area, allowing each student to focus future studies
    on areas of relative weakness. Prospective employers can also use the detailed
    summary to evaluate applicants'' or employees'' areas of strength. Cair is unique
    in this regard. Other certifications supply the test taker with only a relative
    score of some type, without a raw score, percentage correct, or other measure
    for evaluating his or her performance. The effect of this practice is to leave
    the test taker who fails without guidance as to how to prepare for reexamination.


    # Minimum Candidate Requirements


    The Cair Linux and GNU tests were not designed for the novice computer user. It
    is assumed that the candidate has approximately two years of computer experience
    and experience in the configuration of one or more operating systems. For example,
    the candidate should be familiar with basic hardware concepts, such as CPU, memory,
    interface adapters, hard disks, and networks. The candidate should also be familiar
    with basic operating system concepts, such as booting, file access, and device
    drivers. Finally, the candidate should know basic commands and the use of a Unix-type
    editor, such as Joe, Pico, Vi, or Emacs.


    # Knowledge Matrix


    The test is based on the Apache Knowledge Matrix shown at www.linux-certification.com.
    Examination topics are listed here. Note that the major topics listed in the Knowledge
    Matrix will not change, some subtopics may be added as needed to update the material.
    Please check the Cair Web site for any additions to this list.'
