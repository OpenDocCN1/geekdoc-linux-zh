  md: '# 114 Chapter 3


    HTTP/1.1, although it does not implement all features. Luckily there are modules
    to make up for many HTTP/1.1 features Apache does not support at its core.


    # BrowserMatch


    Depending on the Web browser hitting a site, Apache can react in different ways,
    using the BrowserMatch directive. BrowserMatch goes beyond clients like Netscape
    and Opera to include clients such as RealPlayer. For example:


    ```

    BrowserMatch "Mozilla/2" nokeepalive

    BrowserMatch "MSIE 4\.02" nokeepalive downgrade-1.0 force-response-1.0

    BrowserMatch "Realplayer 4\.0" force-response-1.0

    BrowserMatch "Java/1\.0" force-response-1.0

    BrowserMatch "JDK/1\.0" force-response-1.0

    ```


    # Expirations


    mod_expires is a module that allows Apache to dictate when it should refresh a
    cached document. Expirations are useful to make sure the client is not viewing
    cached data when there is a more recent version available. Expirations also serve
    the purpose of caching information that will not change for a long time, such
    as images. mod_expires controls the setting of the Expires header in server responses
    to control a client''s use of cached files.


    # Keep-Alive


    Keep-Alive is actually an HTTP/1.0 term for what is called persistent connections
    in 1.1. Persistent connections create the possibility of requests to occur over
    one TCP connection. Persistent connections can reduce latency in serving HTML
    documents quite substantially, especially on Web sites with many images. Some
    Web browsers support Keep-Alive, and others (like Internet Explorer 4.0b2) have
    a broken implementation.


    To support Keep-Alive, turn it in httpd.conf with the following command:


    ```

    KeepAlive On

    ```


    For more information visit http://httpd.apache.org/docs/mod/core.html#keepalive.'
