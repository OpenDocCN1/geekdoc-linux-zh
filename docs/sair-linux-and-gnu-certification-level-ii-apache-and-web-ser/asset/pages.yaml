    # Dynamic Shared Objects


    The --enable-module=so option gives the ability to add other modules at a later
    time or at run. These are analogous to loadable modules and the Linux kernel.
    For example, to add php to the server, simply add mod_php without recompiling
    Apache.


    Once the configure script has run and determined the features available on a system,
    the software can be built.


    # Installing


