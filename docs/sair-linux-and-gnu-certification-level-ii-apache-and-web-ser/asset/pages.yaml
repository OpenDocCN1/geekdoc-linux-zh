    ```

    INSERT INTO mysql_auth (username, password, groups) VALUES (''user_1'',

    password(''c0ff33''), ''test'')

    ```


    user_1 will be the first Web-based user for us to use.


    Notice the use of password c0ff33 as the value that went into the

    mysql_auth password field. Type the following:


    ```

    select * from mysql_auth;

    ```


    You will notice that the password column does not look like c0ff33

    at all. password() is the default function mod_auth_mysql uses

