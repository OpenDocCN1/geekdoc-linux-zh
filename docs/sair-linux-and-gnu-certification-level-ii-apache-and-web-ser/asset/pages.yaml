  md: '# Configuring Apache to Perform Common Tasks 209


    connection often provides more than enough bandwidth for these sites; in this
    case, an additional site may be run. Therefore, the next task will be to set up
    a virtual host.


    There are three separate ways to host multiple Web sites on a single machine:


    +   - Use multiple instances of the daemon

    - Use IP-based virtual hosting

    - Use name-based virtual hosting


    Similar to IP-based hosting, name-based hosting allows multiple server names to
    point to one machine. One of the benefits is that a number of hosts can use a
    single IP address, avoiding the need to obtain an additional IP address. Name-based
    hosting is available because of a feature available in most browsers. When a browser
    requests a page, the destination name is included in the header. Apache is able
    to use this information and direct the request to the location handling information.


    Configuring a system to use name-based hosting takes place in the httpd.conf file.
    In most distributions, the virtual host section is commented out; the easiest
    way is to implement virtual hosting by removing the comments. The following steps
    show how to add name-based hosting to a site:


    +   1. Open the Apache configuration file (httpd.conf) in a text editor.

    2. Add the following text to the file:


    ```

    <VirtualHost 123.45.67.89> - specifies the IP address for name-based hosting

    ServerName www.sitel.com - states the requested name for the first website

    ServerAdmin webmaster1@sitel.com - specifies the email for the administrator

    DocumentRoot /home/web/sitel - sets the directory containing the first website

    ErrorLog /var/log/sitel-error_log - sets the error log directory for the first
    site

    </VirtualHost>

    #Second host

    <VirtualHost 123.45.67.89> - specifies the IP address for name-based hosting

    ServerName www.sitel2.com - states the requested name for the second website

    ServerAdmin webmaster2@sitel2.com - specifies the email for the administrator

    DocumentRoot /home/web/site2 - set the directory containing the second website

    ErrorLog /var/log/sitel2-error_log - sets the error log directory for the second
    site

    </VirtualHost>

    ```'
