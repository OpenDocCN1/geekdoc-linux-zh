    The design of the facilities that you will add to your file manager is not difficult.
    However, you must consider and handle many details. The buffering exercises (Parts
    C and D) introduce a new level of complexity due to the need to handle asynchronous
    concurrency.


    # The open() Function


    You need to design your own descriptor(s) that are analogous to the internal inode
    in VFS. Your data structure(s) should contain some information from the'
