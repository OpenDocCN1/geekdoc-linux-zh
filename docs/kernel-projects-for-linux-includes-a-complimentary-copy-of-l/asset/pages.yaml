  md: '# Preface


    # TO THE STUDENT


    Experience has shown that the best way to learn the details of how an operating
    system (OS) works is to experiment with it—to read, modify, and enhance its code.
    However, OS software, by its nature, must be carefully constructed. This is because
    it directly controls the hardware used by all of the processes and threads that
    execute on it. As a result, experimenting with an asimental version of the OS
    might disable the test machine. This laboratory manual provides you with a learning
    path for studying the Linux kernel with as little risk as possible. By learning
    the Linux kernel in this way, you will develop a technique by which you can learn
    and experiment with other kernels as well. Consider this learning path to be a
    graduated set of exercises. First, you will learn to inspect various aspects of
    the OS internal state without changing any code. Second, you will extend the OS
    by writing new code to read (but not write) kernel data structures. Third, you
    will reimplement existing data structures. Finally, you will design and add your
    own functions and data structures to the Linux kernel.


    The Linux kernel is written in the C programming language. Therefore you need
    to be relatively proficient in using C before you study the kernel. If you know
    C++, then you will not have difficulty understanding the source code, though when
    you add or change parts of the kernel code you will not be able to use objects.'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'This manual is designed as a companion to a general OS textbook. It consists
    of two parts. Part 1 offers an overview of the Linux design. At the beginning
    of your first OS course, you might discover that Part 1 discusses several topics
    that are new to you. However, work through it to get a feeling for how Linux is
    built. It gives the “big picture” but not many details. Then go back to Part 1
    as needed as you work the exercises.


    Part 2 consists of a dozen laboratory exercises that help you to learn to use
    Linux. Each exercise is a self-contained unit consisting of the following sections:


    +   - Introduction

    - Problem Statement

    - Attacking the Problem


    The exercises link the general concepts and the Linux details. Each begins with
    an introduction that explains Linux concepts and details relevant to the exercise.
    The introduction explains how the generic concepts that you will have learned
    in lecture and textbooks are realized in Linux. The next part of the exercise
    presents the problem on which you will be working. It includes detailed Linux-specific
    information that you need to solve the problem. Sometimes, a quick review of the
    pertinent parts of Part 1 will help you to frame the work of the exercises before
    you dive into the details.


    Your school’s laboratory probably has already been set up as a Linux lab. For
    you to solve most of the exercises in this manual, the laboratory administrator
    will provide you with a copy of the Linux source code and superuser permission
    to create new versions of the OS. Do not abuse your privilege as a superuser!
    You need this privilege in order to modify the kernel, but you must not use it
    for other purposes. This manual includes a CD-ROM, containing the Linux source
    code, that you can use to install Linux on your own computer.


    Good luck with your study of operating systems. I hope that this exercise manual
    is a valuable learning tool for exploring OS concepts in Linux.'
  merge: -1
