    # The MS-DOS Disk Format


    MS-DOS defines a particular format for floppy disks. The MS-DOS BIOS (Basic Input/Output
    System) provides a set of programs that can read and write disk sectors. It also
    provides an additional abstraction on the disk address called the logical address.
    Logical sector 0 corresponds to the surface at surface O (on a hard disk), track
    0 of the floppy disk (Surfaces and tracks are numbered from zero, but sectors
    are numbered from 1; the reasons for this have long been forgotten). Logical sector
    1 is at surface O, track 0, sector 2, and so on.


    Before a floppy disk can be used for normal I/O operations, it must be formatted
    to contain essential information in specified locations. Specifically, logical
    sector 0 contains a reserved area (also called the boot sector or boot record).
    The MS-DOS boot sequence relies on the boot sector''s being located at logical
    sector 0 and organized as shown in Figure 2.14; see also Part 1, Section 3'
