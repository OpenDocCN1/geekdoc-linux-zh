  md: 'disk-resident file descriptor (the FAT directory entry), though other information
    kept in the open-file table can describe the state of the I/O session.


    An open operation takes a filename and the access mode as input parameters. It
    finds an unused entry in the open-file table, fills in information extracted from
    the file system, initializes other fields, and then returns an open-file table
    handle (index) to the caller.


    The open operation must resolve the filename, which may be a pathname, to get
    the directory entry for the file. Processing a pathname is laborious but straightforward.
    Here are the steps.


    +   1. Start at the root directory or current directory (depending on whether
    the pathname is absolute or relative), and look up the subdirectory whose name
    appears first in the path. If the name cannot be found, then the open will fail.
    Otherwise, go on the next step.


    +   2. The found subdirectory has a directory entry, so the corresponding file
    is then treated as a directory in Step 1. Continue this path traversal until the
    leaf name—the last name in the path—is encountered. If this name is found in the
    appropriate subdirectory, an open-file descriptor can be prepared.


    +   3. Check the file access permissions.


    +   4. Allocate space for an open-file descriptor. Then copy the information from
    the directory entry that you will need, including the name, attributes, start
    cluster address, and file size.


    +   5. Set the file pointer to zero. Return the handle to the open-file descriptor
    to the calling process.


    # Caching the FAT


    Your solution to this exercise is to perform multiple operations on the floppy
    disk at one time. Note that the floppy disk will become a performance bottleneck
    if your FAT manipulation reads and write the FAT in place, in addition to performing
    the obvious read and write operations for the normal data I/O. If you have a machine
    with two floppy disk drives, then you should read on one and writes on the other.
    You might find it challenging to support FAT I/O and data I/O on one floppy disk
    so that everything works correctly. If you decide to use a single floppy disk
    drive with two open files to cache the FAT when you open the file, then you will
    need to be very careful to propagate FAT updates so that all file operations use
    the correct FAT values (rather than stale copies). Handling this problem will
    become especially difficult in Part B.'
