    the device completes the operation. Then the interrupt handler for the device
    runs, awakening the sleeping task and eventually resuming user-space processing.


    Figure 2.11 shows a family of device drivers for *block devices* and another for
    *character devices*. In traditional UNIX systems, the interfaces for block devices
    differ substantially from those for character devices; this distinction is not
    significant in Linux. I/O operations for block devices transfer multiple bytes
    to/from the primary memory cache on each hardware operation, whereas character
    devices transfer information byte-by-byte without using caching. As suggested
    by the figure, a disk is a block device and a serial port is a character device.


    All UNIX systems are designed so that device drivers can be defined when the system
