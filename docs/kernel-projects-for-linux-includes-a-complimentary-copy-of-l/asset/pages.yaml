    # The MS-DOS FAT


    The disk format is based on a FAT file system in which the media (floppy disk)
    is divided into a *reserved area* (containing the boot program), the *allocation
    tables*, a *root directory*, and file space; see Figure 2.15. The second copy
    of the FAT is the same as the first copy; it is used to recover the disk if the
    first copy of the FAT is accidentally destroyed. Space allocated for files is
    represented by values in the allocation table, thereby effectively providing a
    linked list of all of the blocks in the file. Special values designate EOF, unallocated
    blocks, and bad blocks. The original FAT had many limitations. It had no subdirectories
    and was limited to very small disks. In addition, recovering the disk if the allocation
    tables were damaged was very difficult.


    During the time of the explosive growth of the personal computer, the size of
    disk drives also increased dramatically. At the same time, different variants
    of FAT were derived to accommodate larger disks. The basic FAT organization (see
    Figure 2.16) differs among disk types as follows:


    +   - By the size of the entries ($M$ in the figure can be 12 or 16 but can be
    12, or 32 in Windows 98 and Windows 2000)

    - By the number of actual tables

    - By the size of the logical sector addressed by a FAT entry


    In the simplest variant, one FAT entry corresponds to each sector on the disk.
    A file is a set of disk sectors, with the FAT entry corresponding to the first
    entry designating the logical sector number of the second block. Similarly, the
    FAT entry of the second block specifies the logical sector number of the third
    block,'
  merge: -1
