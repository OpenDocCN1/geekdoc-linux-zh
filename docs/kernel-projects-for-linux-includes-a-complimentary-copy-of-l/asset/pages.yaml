  md: '# Further Study


    The exercises in this manual teach you how the Linux kernel is designed and organized.
    Each exercise focused on one or a few aspects of the kernel and then provided
    you with the opportunity to experiment with that aspect of the kernel. All parts
    of the kernel were at least touched on, but some were not discussed deeply and
    might be topics for further study on your part, including the following.


    +   - The virtual memory system is pervasive in the kernel data structures. Because
    the Linux virtual memory uses dynamic memory allocation, added complexity exists
    in understanding how and when page frames are taken away from one process (buffer
    pool) and added to another. The discussion of virtual memory in this manual barely
    scratched the surface of the virtual memory system.


    +   - Most of the code in the kernel is for the file system. The Linux file system
    is certainly one of the larger and more complex parts of the kernel. Its increased
    complexity results from the need to handle buffering. Many details of the file
    system were omitted, so a next phase of study should focus more on the existing
    file systems.


    You can continue your study of kernels in any of several ways. This manual''s
    goal is to provide you with enough background and experience so that you can read
    and modify kernel code. By necessity, the exercises must be bounded to small problems
    so that they are good learning tools. After solving the exercises in this manual,
    you will be prepared to tackle kernel problems (though some situations require
    considerable additional study of the code). Here are a few suggestions for further
    study.


    +   - Redesign and reimplementation any module of the kernel.


    +   - Extend the functionality; for example, write your own implementation of
    threads.'
