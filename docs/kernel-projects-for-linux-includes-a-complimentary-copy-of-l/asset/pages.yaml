  md: '# The Shared Memory


    You can use shared memory to allow any process to dynamically define a new block
    of memory that is independent of the address space created for the process before
    it began to execute. As explained in Part 1 of this manual, every Linux process
    is created with a large virtual address space, only a portion of which is used
    to reference the compiled code, static data, stack, and heap. The remaining addresses
    in the virtual address space are initially unused. A new block of shared memory,
    once defined, is mapped into a block of the unused virtual addresses, after which
    the process can read and write the shared memory as it were were ordinary. More
    than one process can map the shared memory block into its own address space, so
    code segments read or write shared memory are normally considered to be critical
    sections.


    The following four system calls define the full kernel interface to support shared
    memory:


    ```

    #include <sys/types.h>

    #include <sys/ipc.h>

    #include <sys/shm.h>

    shmget(key_t key, int size, int shmflg);

    void shmat(int shmid, char *shaddr, int shmflg);

    void *shmdt(char *shaddr);

    shmctl(int shmid, int cmd, struct shmid_ds *);

    ```


    +   - shmget() creates the shared memory block.

    - shmat() maps an existing shared memory block into a process''s address space.

    - shmdtl() removes (unmaps) a shared memory block from the process''s address
    space.

    - shmctl() is a general-purpose function (in the style of ioctl()) used to perform
    all other commands to the shared memory block.


    To create a new block of shared memory, the process must call shmget(). If shmget()
    successfully creates a new block of memory, then it returns a shared memory identifier
    of type int. The shared memory identifier is a handle into a kernel data structure.
    The next section discusses how shared memory is implemented, illustrating that
    it is actually an index into a kernel array. If shmget() can create the new block
    of shared memory, then the kernel array index is returned references an instance
    of the struct shmid_kernel data structure, which includes a field, as follows.'
