    Linux, Solaris, and other versions of UNIX provide a very useful mechanism for
    inspecting the kernel state, called the /proc file system. This is the key mechanism
    that you can use to do this exercise.


    # /proc File System


    According to McKusik, et al. [1998], the /proc file system comes from UNIX Eighth
    Edition and has been used with 4.4 BSD. "In the /proc system, the address-space
    of another process can be accessed with read and write system calls, which allows
    a debugger to access a process being debugged with greater efficiency. The page
    (or pages) of interest in the child process is mapped into the kernel address
    space. The requested data can be copied directly from the kernel to the parent
    address space." (page 113) In addition, /proc can be used to collect information
    about processes in the system, even though that is not in 4.4 BSD.


    The /proc file system is an OS mechanism whose interface appears as a directory
    in the UNIX file system (in the root directory). You can change /proc just as
    you change to any directory. For example,


    ```

    bash$ cd /proc

    ```


    makes /proc the current directory. Once you have made /proc the current directory,
    you can list its contents using the ls command. The contents appear to be ordinary
