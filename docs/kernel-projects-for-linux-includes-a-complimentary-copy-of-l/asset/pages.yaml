  md: '[Ousterhout, et al., 1985]. This suggests that a 1GB or larger file system
    might contain on the order of a million files. Such a large number of files requires
    a way to organize them so that people can remember which file contains what information.
    A hierarchical, or tree-structured, file system is a popular technique for organizing
    a large collection of files. In UNIX systems, the file system has a root directory
    that contains entries to reference other directories and files. Each subdirectory,
    in turn, contains entries to reference other directories and files. This recursive
    definition of a directory files forms the hierarchical structure for the file
    system. In windows-oriented interfaces to the file system, each directory is represented
    as a file folder that can contain other file folders or documents (files).


    Hierarchical file systems are relatively easy to implement, as is usually the
    case, directories are implemented by using ordinary files. Thus the nucleus of
    the file manager can be written with no particular knowledge of directories and
    a client of this nucleus can then use ordinary file operations—open, read, and
    write—to implement the directory data structures and algorithms. UNIX systems
    are traditionally designed in this manner, as is the Linux file manager.


    A directory entry must contain enough information to allow the file manager to
    match a character string filename with the entry''s name, and if names match,
    to find the external file descriptor on disk. For example, in a UNIX system (including
    Linux ext2), the directory entry is required to have only the filename and the
    inode number for the file. All specific information related to the file is kept
