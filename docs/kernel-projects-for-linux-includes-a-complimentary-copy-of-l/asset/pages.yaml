- img_proc: true
  md: 'and so on. The FAT entry for the last block contains an EOF designator. Thus
    the FAT is a linked list of disk sectors. If you know the address of the first
    sector, $i$-and therefore the index into the FAT—you can use the FAT to reference
    the logical sector in the file (see the figure). The content, $j$, of FAT index
    $i$ is a logical sector number, as well as an index to the second FAT entry for
    the file.


    As disks grew larger than 32MB, the FAT organization began to use the notion of
    a cluster of sectors. A cluster is a group of contiguous sectors that are treated
    as a virtual sector within the FAT. In contemporary implementations of the file
    system, the FAT entry addresses a cluster rather than an individual disk sector.
    With the use of cluster, the FAT organization can address groups of, four sectors
    as if they were a single sector containing four bytes as a single sector. This
    means that disk space is allocated to a file on a cluster-by-cluster basis. However,
    a 12-bit FAT is still limited to 128MB. Today, floppy disks use 12-bit FATs and
    hard disks use 16-bit or 32-bit FATs.


