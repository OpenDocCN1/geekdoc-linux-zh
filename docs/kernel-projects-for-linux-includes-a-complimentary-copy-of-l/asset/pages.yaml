  md: '# part 1


    # Overview of Linux


    Linux is a contemporary, open implementation of UNIX, available at no cost on
    the Internet. Since its introduction in 1991, it has become a highly respected,
    robust operating system (OS) implementation, enjoying great success as a platform
    for studying contemporary OSs, especially the internal behavior of a kernel. Just
    as significant, Linux is now used in many corporate information processing systems.
    Thus studying Linux internals provides valuable career training as well as being
    an excellent means of educational experimentation. Today, several new companies
    provide industrial-strength support for Linux.


    +   1 The Evolution of Linux


    Linux has evolved within the UNIX community. The UNIX OS was introduced to the
    public in a classic research paper in 1973 [Ritchie and Thompson, 1973]. UNIX
    established two new trends in OS design. First, previous OSs were huge software
    packages, typically the largest software package that ran on a computer, and they
    were designed for a specific hardware platform. By contrast, UNIX was intended
    to be a small, no-fills OS that could be made to run on any small computer. Second,
    the UNIX philosophy was that the OS kernel should provide the minimum essential
    functionality and that additional functionality should be added (as user programs)
    on an as-needed basis. For these reasons, UNIX was revolutionary. Within half
    a dozen years, it had become the preferred OS by programmers in multivivendor
    hardware environments (universities, re-search laboratories, and system software
    development organizations).'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Even though the UNIX kernel could be ported to a new hardware platform without
    the entire OS’s having to be redeveloped, the source was owned by AT&T Bell Laboratories.
    Other organizations could obtain the right to use the source code (for example,
    to port it onto their preferred hardware) by paying a licensing fee to AT&T. By
    1980, however, many universities and research labs had obtained the source code
    and were busy modifying it to meet their needs. The most prominent work at that
    time was at the University of California at Berkeley under a Defense Advanced
    Research Projects Agency contract. Commercial computer vendors had also begun
    to use the source code to derive their own versions of the UNIX OS.


    By 1985, two primary versions of UNIX were running on many different hardware
    platforms: the main line version from AT&T Bell Labs (called System V) and an
    alternative version from the University of California at Berkeley (called BSD
    UNIX). The primary hardware for BSD UNIX was the DEC VAX, so BSD UNIX was more
    specifically called Version 4 BSD UNIX, or 4x BSD UNIX. Both AT&T and BSD versions
    implemented system interfaces that were recognizable as UNIX, though they differed
    from each other in details. In particular, substantial differences existed in
    the way that the two OS kernels were implemented. The competition between System
    V and BSD systems was very active, with programmers swearing by one version or
    the other. By 1988, AT&T and the leading proponent of 4x BSD UNIX (Sun Microcomputers)
    reached a business agreement by which these two versions were merged into a common
    version of UNIX, called the Sun Solaris OS.


    Meanwhile, other computer makers were pushing for an alternative implementation
    of the UNIX system interface. As a result by 1989, a committee had been formed
    to develop a standardized interface. The result was an API, a system call interface,
    called POSIX 1.¹ Using POSIX, everyone was free to design and build kernels that
    provided the functionality that it specified. For example, a group of OS researchers
    at Carnegie Mellon University led by Richard developed the Mach OS that had a
    POSIX/UNIX system call interface. Mach was an alternative to the 4x BSD and System
    V UNIX kernel implementations. Eventually, a version of Mach was used as the basis
    of the Open Systems Foundation OSF-1 kernel. The first technique used to implement
    the POSIX/UNIX interface in Mach was simply to incorporate substantial amounts
    of


    > The system call interface is often called "POSIX," though that term can be misleading
    because the POSIX committee developed several different APIs and only the first
    of the addresses the kernel system call interface. This book considers only POSIX
    1, so it uses the more popular, but less accurate, designation of POSIX to refer
    to the POSIX 1 system call interface.


    # Overview of Linux'
