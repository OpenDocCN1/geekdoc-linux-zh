    | Descriptor | Heads | Sectors/Track | Cylinders | Capacity |

    |---|---|---|---||

    | 0x0fe | 1 | 8 | 40 | 160K |

    | 0xff | 2 | 8 | 40 | 320K |

    | 0x0fc | 1 | 9 | 40 | 180K |

    | 0x0fd | 2 | 9 | 40 | 360K |

    | 0x0f9 | 2 | 9 | 80 | 720K |

    | 0x0f0 | 2 | 18 | 80 | 1.44M |


    ![](img/6c31018b7f7824a12d3ff3ed95320f0a_212_1.png)


    | Value | Meaning |

    |---|--|

    | 0x000 | Unused |

    | 0xFF0-0xFF6 | Reserved cluster |

    | 0xFF7 | Bad cluster |

    | 0xFF8-0xFFFF | Last cluster in a file |

    | (anything else) | Number of the next cluster in the file |


