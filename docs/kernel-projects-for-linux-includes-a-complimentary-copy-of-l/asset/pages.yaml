  md: '# Directories and File Storage


    Information about files is stored in a directory. You can look up information
    about a file (its size, its location on the floppy disk, the time it was created,
    and so on) by using the file''s name. FAT-12 (the version of FAT with 12-bit FAT
    entries) uses a simple list of fixed-size directory entries. A directory entry
    can be found in a directory by searching linearly through the disk sectors that
    contain the directory list. That is, traversing the list of directory entries
    in a directory looking at multiple disk sectors and at multiple entries within
    each sector.


    A directory entry contains the filename and a description of the location of the
    file''s data. The entry also contains the file''s size in bytes (in case the file
    size is not an exact multiple of the sector size). Directory entries vary whether
    they are in the root directory or in a subdirectory. Each entry is 32 bytes long,
    thereby allowing 16 entries per standard 512-byte sector. The root directory has
    a fixed maximum of entries (the number is stored in the boot sector) and occupies
    a contiguous group of logical sectors, as determined by the format. By contrast,
    subdirectories are stored in a set of sectors that are managed in the same manner
    as files. That is, logically contiguous sectors are not necessarily physically
    contiguous on the disk, and they must be accessed using the FAT.


    Figure 2.17 shows the layout for a directory entry. All multibyte integers are
    in little-endian order, meaning that the largest significant byte is stored first.


    The filename and extension are stored as uppercase ASCII characters. Invalid entries
    have names beginning with 0x00 (the entry has not been used before) or 0xE5 (the
    entry was used before but has been released). The starting cluster number is slightly
    deceiving. Although it references the starting cluster (sector) number, it cannot
    reference sectors used for the boot record, FAT copies, or root directory. A starting
    cluster number k actually refers to logical number 3 + k.


    ![](img/6c31018b7f7824a12d3ff3ed95320f0a_210_0.png)


    | Offset | Length | Description |

    |---|---|---|

    | 0x00 | 8 | Filename |

    | 0x08 | 3 | Extension |

    | 0x0B | 1 | Bit field for attributes |

    | 0x0C | 10 | Reserved |

    | 0x16 | 2 | Time (coded as Year2048+Min*32+Sec/2) |

    | 0x18 | 2 | Date (coded as Year-1980)*512+Month*32+Day) |

    | 0x1A | 2 | Starting cluster number |

    | 0x1C | 4 | File size (in bytes) |'
