    device''s status register to determine when the operation has completed.


    +   - A driver that uses *interrupts* starts the device and then suspends itself
    until the device completes and raises an IRQ. When the IRQ occurs, the ISR runs,
    possibly postponing certain aspects of the interrupt handling to a bottom half
    routine or to be a unit of work kept in the task queue. In this case, the user
