  md: 'Blocks 0 through 11 are accessed via the direct pointers in the inode, and
    blocks 12 through 1,011 are accessed indirectly through the single indirect block.
    the fourteenth block pointer in the inode is the double indirect pointer. it points
    to a block that contains pointers to blocks of the type referred from the single
    indirect field. the double indirect pointer points to a block that points to 1,000
    indirect blocks, so 1,012 to 1,001,011 are accessed through the double indirect
    list. the fifteenth block pointer is the triple indirect pointer. it points to
    a block that contains double indirect pointers. again, if each block can store
    1,000 block addresses, then the triple pointer indirectly addresses blocks 1,001,012
    to the maximum-sized file (under these assumptions) of 1,001,001,011 blocks.


    When this block allocation strategy is used, very large files are possible, even
    as files grow larger, the access times also increase. Also, other considerations
    (designed into the inode structure) prevent a file from reaching this maximum
    size. For example, with the block sizes previously, using the triple indirect
    index would require a device capable of storing 4,000GB. Current versions of BSD
    do not use the triple indirect pointer. this is partly because of the incompatibility
    of file sizes with storage device technology and partly because the 32-bit file
    offsets used in the file system preclude file sizes larger than 4GB.


