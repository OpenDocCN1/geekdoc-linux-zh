    addresses. Unmapped virtual addresses in the kernel segment are permanently mapped
    and associated with fixed physical memory addresses used by the kernel. This means
    that every process''s virtual address space shares the same kernel segment, since
    the kernel virtual addresses all map to the physical addresses used by the kernel.


    Each of the kernel and user segments is further partitioned into code sectors
    and data sectors. Each virtual address contains within the sector identification
    and an offset. When the CPU is in the instruction fetch phase, it always references
    a code sector (in either the user or kernel segment). Therefore the compiler does
    not bother to generate the sector identification as part of the address used by
    an instruction (special object code formats for Linux are not needed).


