  md: 'in Figure 2.19. The FAT space, for clusters with two or more sectors, can contain
    the values for an entry, as shown in Figure 2.20.


    # FAT Packing


    The data structure would be easier to manipulate if the cluster numbers in the
    FAT were stored in two-byte groups in the FAT sectors. But early MS-DOS machines
    were limited in space, so designers decided to pack two 12-bit FAT entries into
    3 bytes. Thus bytes $3k$ through $3k+2$ contain elements $2k$ and $2k+1$ of the
    FAT array. In particular:


    +   * $3k$ contains the least significant 8 bits of FAT[2k].

    * The least significant 4 bits of $3k+1$ contain the most significant 4 bits of
    FAT[2k].

    * The most significant 4 bits of $3k+1$ contain the least significant 4 bits of
    FAT[2k+1].

    * $3k+2$ contains the most significant 8 bits of FAT[2k+1].


    As an example of how entries are packed into the FAT, suppose that a short file
    has been written to a new 1.44MB floppy disk. This new file begins at the first
    part of the file space, in cluster 2. The rest of its sectors follows continuously
    (be-cause the disk was not already fragmented when it was written). The beginning


