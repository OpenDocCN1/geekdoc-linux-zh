    # Rebuilding the Kernel


    Ultimately, the kernel is just another program that must be compiled and linked
    into its runtime environment in preparation for execution. Unlike other programs,
    however, its environment is determined by the logical configuration—the configuration
    dictated by the hardware and the system administrator’s parameter choices. Thus
    it cannot depend on the existence of other software in its runtime environment.


    Software engineers have spent many years refining the technique for building UNIX.
    Linux uses those accumulated tools in its build environment. Because you are using
    a running Linux machine that has the source code, the build environment should
    already be in place on the machine (it is installed with the source code).


    The build procedure takes place from the base directory of the Linux source, typically
    in /usr/src/linux, though your linux source directory may be installed elsewhere.
    /usr/src/linux is the source subtree described in Exercise 3. The linux directory
    contains the directories that have source code, include files, and library routines.
    It also includes the files README and Makefile. You should read the README file,
    even if you cannot understand all of it at this point. It provides information
    regarding, for example, where the build environment should be installed (/usr/src)
    and what to do if things go badly while you are doing kernel root.


    The Makefile in the linux root directory is the top-level myfile for building
    the Linux kernel. As you might expect, it is relatively complex, as is designed
    to automate most of the details of building and installing a new kernel. It does
    this by invoking various other tools and by using other makefiles in subdirectories.
    In a properly installed build environment, the kernel is rebuilt with only five
    commands (executed by a superuser):


    ```

    # make clean

    # make <config_opt>

    # make depend

    # make

    ```'
