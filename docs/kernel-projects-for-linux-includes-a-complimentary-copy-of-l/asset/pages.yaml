    than 12 blocks, then the file system allocates an index block and links it to
    the single indirect (thirteenth) pointer of the inode. Hence, 13 to k are directly
    addressed from the inode via the indirect block identified by the thirteenth pointer
    in the inode. Similarly, larger files use the fourteenth pointer to point to a
    double indirect block, and the largest files use the fifteenth pointer to point
    to a triple indirect block.


    How large can UNIX files be? This depends on the block size as well as the sizes
    of the disk addresses used in the system. In a simplification of the arithmetic,
    suppose that an indirect block can store 1,000 disk addresses (ordinarily, the
    number of disk addresses would be a power of 2, such as 1,024). A single indirect
    block will provide pointers to an additional 1,000 disk blocks.


