  md: '# Kernel Timers


    ![](img/6c31018b7f7824a12d3ff3ed95320f0a_98_0.png)


    **Exercise Goal:** You will begin learning about kernel source code by studying
    the kernel''s time management algorithms. First, you will study how the kernel
    implements interval timers (in part by reading kernel code). Then you will put
    that knowledge to work by creating a user-space mechanism to measure the execution
    time of a multithreaded program. As you do the exercise, you will also learn how
    to use signals.


    # Introduction


    The kernel keeps the current time by reading a clock device and maintaining a
    kernel variable with the current time. The current time is accessible to user-programs
    via system calls. `gettimeofday()` is the usual interface to the current time
    maintained by the system. It is also used to determine when the currently running
    process should be removed from the CPU so that another process can use it, or
    to keep track of the amount of time that a process executed in user mode or supervisor
    mode. As background information for doing this exercise, the next sections explain
    the basic strategy for keeping time and discuss how various time quantities are
    recorded for each process.'
  merge: -1
  pgno: 98
- img_proc: true
  md: "# How the Kernel Maintains the Time\n\nTime is stated relative to some important\
    \ epoch. For example, time in the United States is calculated using the Gregorian\
    \ calendar, which is based on a time of zero to be about 2,000 years ago. When\
    \ you type the command to a shell, the kernel will read the kernel variable to\
    \ determine the time, say Jun 21 09:01:28 MDT 2001, which can be interpreted as\
    \ mean that 2001.5 years have elapsed since the beginning of the epoch.\n\nUNIX\
    \ systems were not around before 1970, so they avoid representing time before\
    \ 1970. This is accomplished by beginning the time epoch at 12 A.M. January 1,\
    \ 1970 (00:00:00 Greenwich Meridian Time (GMT)). Two long variables keep track\
    \ of the number of seconds and microseconds, respectively, that have passed since\
    \ the beginning of the UNIX time epoch. A userspace program can read the system\
    \ time as.\n\n```\n#include <sys/time.h>\n...\\struct timeval theTime;\n...\n\
    gettimeofday(&theTime, NULL);\n```\n\n```\nstruct timeval {\n  long tv_sec;\n\
    \  long tv_usec;\n};\n```\n\nWhen the code fragment completes, the time structure\
    \ will have variable theTime.tv_sec set to the (long) integer number of seconds\
    \ that have passed since 12 A.M. January 1, 1970. theTime.tv_usec, also a variable\
    \ of type long, provides the number of microseconds that have elapsed since the\
    \ last second. The date translates the kernel time to the local time and the Gregorian\
    \ calendar time epoch before it produces a result on stdout.\n\nYou can see how\
    \ gettimeofday() works by inspecting the kernel function, sys_gettimeofday(),\
    \ in the file kernel/time.c. (Remember that references to Linux source code assume\
    \ that the current directory is the root of the subtree that contains all of the\
    \ source code, usually /usr/src/linux.) You might find interesting to look at\
    \ the implementation of the i386-specific implementation of the function do_gettimeofday()\
    \ that appears in arch/i386/kernel/time.c."
