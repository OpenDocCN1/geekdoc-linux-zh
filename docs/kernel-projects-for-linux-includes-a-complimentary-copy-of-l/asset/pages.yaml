    # The System Call Linkage


    A user-space program calls a system call stub, which contains a trap instruction.
    As a result, the CPU switches to supervisor mode and begins to execute at a specified
    location in kernel space. In the i386 hardware, the trap instruction actually
    causes interrupt 0x80 to occur, with the ISR address pointing at the point of
    the system_call() assembler routine (see arch/i386/kernel/entry.S). This code
    uses an argument as the offset in the sys_call_table (also defined in arch/i386/kernel/entry.S).
    In the Version 2.2.12 source table is defined as follows.


