- img_proc: true
  md: '# Figure 2.24

    Buffering Sectors


    ![](img/6c31018b7f7824a12d3ff3ed95320f0a_226_0.png)


    Buffering is ordinarily implemented in kernel space, though the same mechanisms
    can be implemented in user space. The idea is to design the file manager so that
    it uses asynchronous i/O to start read sectors (to read ahead N sectors on the
    byte stream) and writes (that write behind the current file pointer up to N sectors).
    A read operation that requests the device read operation to complete before it
    can return a result to the application. As soon as i has determined that the read
    operation has completed on buffer i, it can immediately start an asynchronous
    read on sector i + 1. In a kernel-space implementation, an interrupt notifies
    the software when the device has completed its operation. In a user-space buffer
    manager, a signal (or other form of asynchronous procedure callback (APC)¹) can
    be used to notify the application that the sector read operation has completed.


    Figure 2.25 illustrates one way to organize a solution to the problem. The numbers
    refer to the following steps in a read operation.


    +   1. The application performs a read call on the file manager.

    2. The file manager interrogates the open-file table to determine if the required
    information resides in a buffer or needs to be read from the disk.

    3. When a disk read is required, the file manager reads the FAT to determine which
    disk sector needs to be read next.


    > ¹ Linux does not provide APCs except in the network RPC package. You can achieve
    the same effect by using signal and user-written signal handlers. See Attacking
    the Problem in Exercise 3.'
  merge: -1
