    # 2.2 Sharing Resources


    The Linux notion of a resource implicitly relies on the idea that processes can
    request resources, use them, and then release them. When a process requests a
    resource, it ordinarily needs exclusive use of that resource. Exclusive of a resource
    means that when a unit of the resource is allocated to one process, then no other
    process has access to that unit of resource. Two critical aspects apply to this
    resource management: the competition to acquire units of a resource and the assurance
    of exclusive use.


    # 2.2.1 Managing Competition for Resources


    Competition for a resource is controlled by that resource''s manager. The OS must
    contain a component that will be responsible for accepting requests to use each
    resource, for allocating the resource to a process, and for retrieving a resource
    when a process releases it. Following is the simplest model for using a resource
    (see Figure 1.1).


    +   1. Process P requests units of resource X from the manager for resource X.

    a. If units of resource X are available, then the manager allocates them to process
    P (marking its internal assigned and available data structures to indicate that
    they are allocated and unavailable).

    b. If K units are not available, then the manager for resource X blocks process
    P while it waits for K units of X to become available. P will be prevented from
    further execution until the resource manager for X allocates the K units to P.

    2. When at least K units of resource X become available through a deallocation
    by some other process Pᵢ, the manager for X chooses one'
