    # Address Translation


    Whenever a process references the primary memory, the hardware generates a virtual
    address and sends it to the memory mapping mechanism so that it can be translated
    into the physical address of the information in the machine''s primary memory
    (see Figure 2.7). The address translation mechanism is hardware that converts
    the virtual address according the strategy described in Part 1, Section 5.4. The
    process has a page directory. Part of the address selects the page directory entry
    for the address, another part selects the page middle entry (not used in the i386),
    the third part selects the page table entry, and the fourth selects the byte offset
    within the page. Because of cost considerations, the paging memory system usually
    employs a part of the various page-related tables into a translation nowadays
    buffer (TLB). References to the cached parts of the page tables use the TLB rather
    than the actual page tables. The page fault handler must also participate in the
    TLB management whenever it occurs or loads pages. Address translation is performed
    by very low-level software (often written in assembly language) or by hardware.
    A collection of macros to manipulate the page tables is defined in include/asm/pgtable.h.


    If address translation fails because the target page is not loaded, the address
    translation mechanism forces a page fault interrupt. This interrupt initially
    is handled like all other interrupts (see Part 1, Section 5.4) before it is determined
    to be a missing page fault. The general interrupt handler will call do_page_fault(),
    which will complete the handling of the missing page interrupt.'
