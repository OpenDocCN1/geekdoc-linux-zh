  md: 'When you install a module using insmod (see Attacking the Problem that follows),
    the following happens.


    +   1. The new module is added to the kernel address space (via a kernel function,
    create_module()).


    +   2. Another kernel function, get_kernel_syms(), resolves the external symbol
    references in the module by searching the exported kernel symbols, followed by
    the list of other modules that have already loaded. This means that if one module
    references symbols that are defined in other modules, then the module that defines
    the symbol must be loaded before the one(s) that reference it.


    +   3. create_module() allocates memory space for the module.


    +   4. The module is loaded by the init_module() system call. Here when the symbols
    defined by this module are exported for other modules that might be loaded later.


    +   5. insmod calls the init_module() function for the newly loaded module.


    When the module is to be removed (by using rmmod; see Attacking the Problem),
    cleanup_module() is called. Then the space used by the module is released and
    the virtual addresses unmapped.


    Note that if a module has been installed and another module is installed after
    it uses symbols from it, removing the first module will cause an error in the
    second. Because the second module uses variables declared in the first, the first
    module must remain loaded as long as the second still needs to refer those variables.


