    Creating mechanisms to guarantee exclusive use of a resource can be very difficult.
    Over the years, OS and hardware designers have evolved to use a model of operation
    whereby the mechanism to ensure exclusive use is implemented partly in the OS
    and partly in hardware. A key aspect of this approach is that the hardware "knows"
    when the OS is executing on the CPU. This allows the hardware mechanisms to react
    to instructions issued by trusted software—software that has been carefully designed
    and analyzed so that it performs exactly as intended. At the same time, the hardware
    mechanisms ignore attempts to perform instructions that violate exclusive use
    (executed by software that is untrusted by the OS).


    Contemporary CPUs such as the Intel 80286 microprocessor and above are built with
    a mode bit that can be set to supervisor mode or user mode. The CPU is in supervisor
    mode, also called kernel mode, it is presumed to be executing trusted software
    and the hardware will execute any instruction in its repertoire and reference
    any memory address. When the CPU is in user mode, it is presumed to executing
    untrusted software and the hardware will not execute privileged instructions (such
    as I/O instructions) and will reference only memory allocated to the process that
    is currently using the CPU.


    The bit is a very powerful mechanism. Linux and other contemporary OSs use it
