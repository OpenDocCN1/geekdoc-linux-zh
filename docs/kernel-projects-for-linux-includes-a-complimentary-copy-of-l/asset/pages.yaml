  md: 'cussion in Part 1, Section 7). As a result, the mounted file system then logically
    appears as a subtree in a higher-level file system. UNIX systems have a system
    boot block and bootstrap program. It also contains the system root directory.
    When the system is initialized, it mounts file systems at various mount points
    in the root file system according to a strategy chosen by the system''s administrator.


    Large disk devices can be partitioned to contain multiple file systems. Doing
    this has two important advantages:


    +   1. If the file manager is limited as the size of disk that it can manage,
    then it can work on an individual disk partition that has its own file system.
    This is common in the Windows 95/98 OSs, in which a file system is not allowed
    to be larger than 2GB.

    2. Partitioning the disk so that it has multiple file systems enables the archiving
    utilities to dump or restore the disk on a file system. Dumping or restoring the
    entire disk at once is not necessary (instead, one file system is dumped or restored
    at a time).


    The Linux file system organization is summarized in Figure 2.12(b). Two separate
    interfaces interface the device: the device driver interface and the file manager
    interface. However, in UNIX systems (including POSIX and Linux), the functions
    for the device API have been derived from the file manager API. Also used on the
    device API are the familiar open(), close(), read(), write(), lseek(), and ioctl().
    You will use the device interface in this exercise, so it is discussed in more
    detail in the following Attacking the Problem section.


    The UNIX file manager performs operations on the storage device according to which
    the relevant directory or file is located. This allows it to use the floppy disk
    driver when it manages files on the floppy disk and the hard disk driver when
    it manages files. Most contemporary UNIX kernels, the Linux file manager extends
    this idea by incorporating the VFS (Virtual File System) switch (see Figure 2.12(b)).
    The VFS exports a single, local API for manipulating files to the user-space programs.
    However, it is designed so that it can read and write disks that have radically
    different kinds of file systems. Specifically, a file system that has been formatted
    for DOS, MINIX, Linux''s preferred file system (ext2), or other formats can be
    mounted onto the Linux root directory. This is accomplished by designing the file
    manager to have certain functions that define the API and are independent of the
    details of the disk or file system. However-this component will cooperate with
    any disk-dependent component to translate disk-specific information into an internal
    VFS format.'
