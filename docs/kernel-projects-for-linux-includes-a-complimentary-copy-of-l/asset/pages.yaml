    \ V Release 4 (SVR4), POSIX, and ANSI C. In each version, the system file, signal.h\
    \ (found in include/asm/signal.h in Linux source code trees), defines a number\
    \ of symbolic names for the signals. For example, all versions of UNIX define\
    \ the SIGINT signal type. This signal is raised by the terminal driver when the\
    \ user presses the terminal interrupt character, usually Delete or Ctrl-C. Application\
    \ programmers are not allowed to create new signals. Most versions of UNIX define\
    \ SIGUSR1 and SIGUSR2, which can be used for application-to-application signaling.\n\
    \nA signal is raised by the kill() function and identifying the process to receive\
    \ the signal and the signal type. Essentially, a receiving process can cause a\
