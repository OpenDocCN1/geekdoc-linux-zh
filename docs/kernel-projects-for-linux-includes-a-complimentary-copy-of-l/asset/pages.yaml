    **Exercise Goal:** You will learn how to make a system call and about reading/writing
    user space from the kernel by adding a new function to the kernel. The function
    itself is trivial—it simply returns the value of **xtime**.


    # Introduction


    A system call is the name of a kernel function that is exported for use by user-space
    programs. In Part 1, Section 3.2, you learned that kernel functions that appear
    on the system call interface cannot be called directly like an ordinary function.
    Instead, they must be called indirectly via the trap table. Thus if you write
    a new kernel function, then you need to create a new entry in the kernel trap
    table to reference your new function. If user-space programs are to call the program
    like any other system call, then you also need to provide a system call stub function
    (that contains a trap instruction). Strictly speaking, you can avoid creating
    the system call stub by using the **system_call()** routine, as explained in Section
    5.1.3 that follows.'
