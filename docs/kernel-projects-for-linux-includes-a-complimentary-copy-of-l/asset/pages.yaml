    ![](img/6c31018b7f7824a12d3ff3ed95320f0a_160_0.png)


    **Exercise Goal:** You will add a new synchronization mechanism to the kernel.
    This will require you to create a design for a new mechanism and then to add its
    implementation to the kernel.


    # ## Introduction


    Every modern kernel provides one or more synchronization primitives to enable
    application programmers to coordinate the behavior of multithreaded software.
    Classic UNIX systems did not provide mechanisms for fine-grained multithread operation;
    the primary means for synchronizing processes was pipes (and files). System V
    UNIX provided semaphores as part of the shared memory implementation; these primitives
    are defined in POSIX and hence are supported by Linux.


    # ## Blocking a Task


    As a *task* (a process executing in kernel space) runs, it might have to wait
    for some condition to become true before it can continue. For example, it might'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'wait for an I/O operation (an interrupt to occur). When a task decides to block
    itself, it changes its state, by changing the current-state field in its descriptor
    from TASK_RUNNING to either TASK_INTERRUPTIBLE or TASK_UNINTERRUPTIBLE. Then it
    enqueues itself on a list of blocked processes and invokes the scheduler to run
    a different task. A task in the TASK_INTERRUPTIBLE state can be reactivated by
    a signal or interrupt, whereas a task in the TASK_UNINTERRUPTIBLE state can be
    reawakened only if an interrupt occurs and changes in the machine state so that
    the task can run again. For example, when a task starts an I/O operation, the
    device driver code places the task in the TASK_UNINTERRUPTIBLE state. The task
    can be awakened only by the interrupt that indicates the I/O operation has completed.


    As mentioned, when a task blocks itself, the kernel code locks into a list of
    tasks, waiting for the given condition to become true. Thus you can think of each
    condition on which a task could block as defining a list of tasks. Whenever the
    corresponding condition becomes true, one or more (depending on the semantics
    of the condition) of the blocked tasks in the list become unblocked. For example,
    the classic Dijkstra semaphore (Chapter 8 in Nutt [2000]) is a form of condition
    that can block a task. A binary semaphore is an unsigned integer variable that
    has an initial value 1. Its value can be changed only by one of two functions,
    P(S) or V(S). Think of a semaphore like a C++ class or an abstract data type.
    It has private data to represent the unsigned integer value and two public functions
    on its interface. The binary semaphore is the simplest form; it take on only values
    of 0 or 1. By contrast, general semaphores can take on binary non-negative values.
    For a binary semaphore, when P(S) is called and S has the value 1, then S is decremented-to0
    and the calling process continues to execute. If S has the value 0, the calling
    process is blocked until S is incremented to 1. The V(S) operation increments
    the semaphore.


    The paradigm for using a semaphore is to call P(S) before it enters a critical
    section, code that could cause a race condition of the type described in Exercise
    6. When the process completes executing the critical section code, it calls V(S)
    to increment the semaphore. Note that if one process in a critical section-S has
    been set to 0—another process that attempts to enter its critical section by calling
    P(S) will be blocked until the first executes V(S). The P() and V() functions
    are themselves critical sections, meaning that when they are being executed, they
    cannot be interrupted.


    # Synchronization Mechanisms'
