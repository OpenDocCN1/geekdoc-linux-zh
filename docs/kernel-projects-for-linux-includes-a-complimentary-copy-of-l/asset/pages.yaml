  md: 'my students have been able to complete perhaps six to eight programming assignments
    per semester. This manual provides enough exercises to allow you to choose a subset
    that best suits your students'' backgrounds and your preferences. Most of the
    exercises include options that allow you to vary the assignments from term to
    term (thereby reducing the probability of public solutions from previous terms).
    As mentioned previously, my intention is to release frequent editions of this
    manual. I expect the new editions will have new exercises that require new solutions.


    Also provided is a solution to each exercise. Those much difficult exercises can
    be chosen, and as necessary as you can distribute the solution that are not published
    in the manual.


    None of these exercises are as difficult as building a new kernel from scratch.
    Rather, they emphasize having students study the existing Linux kernel modifying
    extending its components. The first ones are easy, and the background material
    is comprehensive. Later exercises increase in difficulty, with decreasing amounts
    of "handholding" information. Exercises 1 and 2 will ordinarily require a week
    or less to complete, but the last third of exercises are likely to require a couple
    of weeks each. If your students need extra practice with C programming, you might
    carefully consider using Exercises 1 and 2 as tutorials. This might require that
    you provide a little extra assistance, especially with the concurrency elements
    of Exercise 2.


    # THE CD-ROM VERSION OF LINUX


    Any hands-on study of an OS must commit to a particular version of the OS. With
    the rapid evolution of Linux, Version 2.2.x will be out of date by the time the
    book is published. In an attempt to avoid the problem of the book and the OS code
    being out of sync, I have included the source code for Version 2.2.14. This first
    edition of the manual was originally written for Version 2.0.36. Then it was updated
    for Linux Version 2.2.12 just before it entered the publication cycle. As the
    book was going to the printer, I discovered that only 2.2.14 (and not 2.2.12)
    was available for distribution with the manual. Minor differences exist between
    2.2.12 and 2.2.14—generally in coding style rather than content. However, some
    of these differences show up in a couple of exercises. Specifically, watch for
    them in the virtual memory and scheduler parts of the kernel code. I will correct
    them in the next edition. By including a complete 2.2.14 installation was better
    than the manual''s having no CD-ROM. Though newer versions of the source code
    will be available when you use this book, I encourage you to install this version
    on your laboratory machines so that your students will have a software environment
    that is consistent'
