- img_proc: true
  md: '4. The file manager reads the required disk. If other input buffers are available,
    then the file manager starts an asynchronous I/O operation that will call a read
    callback routine once the next sector has been read.


    5. The kernel-level asynchronous I/O mechanism issues an APC to the file manager''s
    read callback routine (which will perform any housekeeping to finish the read
    and then initiate the next read operation).


    6. The block of bytes is returned to the calling program.


