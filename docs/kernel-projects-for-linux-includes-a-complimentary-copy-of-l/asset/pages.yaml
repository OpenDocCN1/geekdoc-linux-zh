  md: '# File Systems


    **Exercise Goal:** You will learn about how the Linux file manager is organized.
    Then you will design and implement a set of directory operations for a simple
    file system. The Linux file manager is designed to accommodate many different
    kinds of disk devices, with different file system organizations and disk formats.
    While Linux provides its own file system organization for hard disks (ext2), the
    file manager can be extended to work with any file system format.


    # Introduction


    Contemporary OSs provide multiple ways for a program to read or write a storage
    device such as a disk (see Figure 2.12(a)). An API for the device driver allows
    a user-space program to directly manipulate the disk hardware, thereby enabling
    programs to read or write individual disk blocks. However, when a user-space program
    is allowed to read/write the disk directly, the OS will have difficulty ensuring
    that its data structures are stored on the disk will not be destroyed by a rogue
    user. Thus the file manager is usually the primary program that uses the device
    driver; other programs use only the device API under unusual circumstances. An
    example of an unusual circumstance is the OS''s allocating the device exclusively
    to a process and giving the process permission to read and write the device, for
    example, with a data-'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'base manager. No processes would be using the device during the time that was
    allocated to the given process.


    A disk device has enough capacity to store bytes for many files, but the bytes
    are stored in a collection of disk blocks. The file manager uses its own data
    structures and algorithms to implement an abstraction that enables information
    to be read or written from/to the disk blocks as if it were a named, logical stream
    of bytes—that is, a file. File managers can usually be partitioned to include
    a part that manages the collection of files, referred to as the file manager''s
    directory operations. For example, a process can identify a particular byte stream
    by its external name (or pathname), copy the file, remove the file, and so on.
    Another part of the file manager is responsible for reading and writing a specific
    file. Once the file has been opened, the process can read or write a specific
    number of bytes, independent of the block size on the underlying disk.


    In UNIX systems, file systems are defined to manage devices with removable media,
    such as floppy disks, and CD-ROMs. The idea is that each removable media is organized
    as a hierarchical collection of files that share a single root directory, an independent
    file system. The root directory of the file system can be logically attached at
    a mount point in another file system (the dis


