  md: '# Part C


    Redesign your read routine so that it supports read-ahead buffering for N = 3.
    You need to use the FAT to determine which sectors to read and then perform sector
    reads on the floppy disk. You likely will need to add considerable new mechanism
    to your synchronous read routine.


    Several simplifying assumptions for the buffer implementation apply, as follows:


    +   1. You do not need to worry about shared files (so you don''t have to worry
    about consistency).

    2. A file may be opened only for reading or writing.

    3. Files are accessed sequentially.

    4. Your read and write routines are synchronous.

    5. Filenames are the old-style MS-DOS names (up to eight characters in the name
    and up to three characters in the extension).

    6. You can ignore file protection.


    You need to design an open-file descriptor to keep the state of the open file,
    for example its file pointer value and whether it is open for read or write (you
    need not implement files that are open for read and write at the same time). Finally,
    you need to design and implement a driver program to test each function.


    # Part D


    Design your write routine to implement write-behind buffering for up to N=3 buffers.
    You need to use the FAT to determine which sectors to write and then perform sector
    writes on the floppy disk handle. You likely will need to add considerable new
    mechanism to your synchronous read routine.


