  md: '# Shared Memory


    # six


    # introduction


    **Exercise Goal:** You will learn how the existing System V shared memory facility
    is implemented in the kernel. Then, you will modify the standard kernel so that
    it uses a dynamic data structure for managing memory segments.


    *Shared memory* is a common block of memory that is mapped into the address spaces
    of two or more processes. Information that a process writes to a location in the
    shared memory can be read with a memory read operation in any other process that
    is using the shared memory. Within an individual computer–either uniprocessor
    or multiprocessor–shared memory is usually the fastest for two processes to share
    information.


    Linux''s shared memory feature is derived from the form of shared memory introduced
    in System V UNIX. Even though the shared memory mechanism allows multiple processes
    to map a common memory segment into their own address spaces–the segment is logically
    a part of the memory manager–it was designed and implemented in System V UNIX
    as a part of the IPC (interprocess communication) mechanism.'
