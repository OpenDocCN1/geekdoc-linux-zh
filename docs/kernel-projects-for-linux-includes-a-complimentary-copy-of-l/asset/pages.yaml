  md: '# # Linux Mandrake Quick Install Guide

    Version 7.0


    This install guide will help you install Linux Mandrake for the first time. The
    install program for Linux Mandrake has been designed to eliminate some of the
    most common pitfalls that have plagued installation of earlier Linux distributions.
    Linux Mandrake has carefully designed its graphical installer, DrakX, to guide
    you through every step of the installation process.


    With in mind, the text will move quickly through the installation process, and
    notes will be made at critical intervals, so you can avoid potential problems.


    # ### Pre-installation Procedures


    Before installing Linux Mandrake, you will need to make sure your system is ready.
    Here are a few simple tasks you may need to perform, to ensure a clean, smooth
    install.


    +   1. Make sure that your hardware is Linux compatible. If you have any doubts,
    check the Linux Hardware database at http://www.linux-mandrake.com/en/fhard.php3
    or http://lhd.dataperower.com/. The information contained on the database refers
    to hardware currently supported. You can also access the Linux Documentation site
    at http://www.linuxdoc.org/HOWTO/Hardware-HOWTO.html.


    +   2. Important: Make back copies of critical files, or perform a complete backup
    to save the entire disk contents. Sometimes things can go wrong, be prepared.


    +   3. If your computer will support more than one operating system, such as Windows
    or NT, and you would like to choose which system you will use at boot time, install
    the Windows/NT system first. You will have to use a partition utility (such as
    Partition Magic or the fips program) to allocate the remaining disk space for
    Linux. This will allow the correct installation of the Linux boot loader, if you
    want LILO to handle the boot loading tasks.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '+   4. Prepare a partitioning strategy, (how you will use the disk efficiently)
    or if you are unsure how to do this, Mandrake''s DraX will handle the task for
    you.


    +   5. If your computer will be used for Linux only, disregard steps 2 and 3


    +   6. Remember, the minimum required specification for installing Linux Mandrake
    are as follows:

    - At least 32MB of RAM memory if you plan to use X Windows. If the machine will
    be used as a server or console (text mode) use only, 16Mb is adequate.

    - Installing all the software will take up little over 1.5Gb. A +2Gb disk would
    allow growth, if required.


    +   1. The Linux Mandrake CD that is bootable. If your computer BIOS supports
    this feature change the settings to boot the CDROM The first computer BIOS can
    be accessed in many ways, depending on the manufacturer. Most computers will give
    you an option to access the setup menu during the "power on self-test" phase.
    Check your computer user guide for more details.


    +   2. If your computer BIOS does not support CDROM boot, you''ll need to obtain
    a 1.44Mb floppy disk to build a boot disk. Instructions on how to build a boot
    disk is contained in the following section "Building a Boot Disk."


    # Building a Boot Disk


    Creating a boot disk for Linux Mandrake is easy, follow the instructions below
    and you''ll be on your way.


    # Using Windows


    Insert the installation CD in the drive and change directories to the appropriate
    drive letter (commonly D or E, this may vary). For an example the X: drive will
    be our reference.


    +   - Open outfile or the Windows Explorer, and change to X:\dosutils. Double
    click the Rawwrite icon, this will start the graphical write utility.

    - The graphical interface will allow input for Image file and Floppy. Choose the
    file called cdrom.img and indicate the floppy disk letter (usually a:)

    - Click the Write button and Rawwrite will do the rest.

    - If you are installing in a DOS environment, use the non-graphical rawwrite utility.
    This can be done by accessing the X:\dosutils directory and issuing the following
    command at the DOS prompt:

    Xdosutils>rawwrite


    The rawwrite utility will prompt you with the following


    Enter the disk source file name:


    You will type:


    ```

    X:\images\cdrom.img

    ```


    The rawwrite utility will prompt you for a destination drive, indicate the correct
    letter for your floppy disk. After the utility is finished you are ready to start
    your installation of Linux Mandrake.'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Using Linux or UNIX


    Insert the CDROM, using root (or super-user account) mount the CD with the following
    command:


    ```

    # mount /dev/cdrom

    ```


    Using the mount point /mnt/cdrom, type this command at the prompt:


    ```

    # cp /mnt/cdrom/images/cdrom.img /dev/fd0

    ```


    This will copy the boot image to the floppy (use the appropriate drive, fd0, fd1,
    which ever may apply).

    After the copying process, you are ready to start your install.


    # Finding Installation Help


    Should you encounter a problem during the installation that is not covered by
    this guide, please point your browser to http://www.linux-mandrake.com/en/fdoc.php3
    for more Mandrake support documentation.


    # Installing Linux Mandrake 7.0


    To begin the installation, insert the CDROM into the computer and restart the
    computer.


    +   - If the computer BIOS supports CDROM boot up, the installation program should
    start automatically.

    - Once the BIOS does not support CDROM boot up, you can start the CDROM installation
    by inserting the boot disk and restarting the computer.

    - Once the installation starts, see the Linux Mandrake "splash screen". Strike
    the <enter> key to continue. The installation program will begin the hardware
    detection phase, and start the second stage of the installation.

    - The Drakx graphical installer will now take over the task of getting you through
    the installation process.

    - One of the unique features of Drakx is the ability to move around during the
    install. If you input a wrong parameter, you can go back and change it. The left
    side of the installation screen contains click-able buttons that will allow you
    to jump forward or backward.


    # Choose Your Language


    +   1. The first Mandrake Install screen will allow you to change the installation
    language. The language-menu is a pull down type menu. Use the mouse to scroll
    to the correct language.


    # Select Installation Class


    +   1. Installation Class: The installation class has three selections, Recommended,
    Customized, Expert.

    - Recommended–Suggested for the first time of Mandrake. Contains all the packages
    needed for maximum performance.

    - Customized–For experienced Linux users who know exactly what they want on their
    systems.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '+   - Expert–for a highly tailored installation, those who may have special
    application needs, i.e. kemel development or programming.


    +   - Once you''ve made your choice from the three options above, DraK will give
    you an opportunity to further tailor your system. You can specify, normal (everyday
    use), development (includes compilers and other programming tools), or server
    (email, webserver or DNS).


    # # Setup SCSI Devices


    +   1. DraK will prompt you to indicate any PCI SCSI devices. If you click Yes,
    and there are detected devices, the drivers will be loaded automatically. If you
    are unsure of the type of SCSI device, click the “Hardware Info” button and the
    recognized components will be displayed.


    +   2. Note: If there are devices that are not detected, DraK will present a pull-down
    menu with SCSI devices, choose the correct driver from the list.


    +   3. Clicking the No button will pass you to the next screen.


    # # Choose Install or Upgrade Method


    +   4. DraK will inquire whether you are installing or upgrading, click the install
    button for first time installations.


    # # Configure Mouse


    +   5. Your next pull down menu is for mouse selection. The mouse should be auto-detected
    by the install program. If the system choice is not correct, you can scroll up
    or down to find your particular mouse.


    +   6. The install program will ask you to identify the correct port for your
    mouse.


    # # Configure Keyboard


    +   7. Next, you will be able to choose the keyboard layout for your particular
    use. The default is the US layout, if US language is chosen.


    # # Miscellaneous Questions:


    The questions found in this section will allow you to configure your installation
    with certain goals in mind.


    +   - Hard Drive optimization is suggested for expert users only. Leaving this
    unchecked is recommended


    +   - Security levels defaults to “medium”. This should be sufficient for general
    stand-alone use. If the machine is connected to a network, then the “high” setting
    should be considered. You have to configure basic network services yourself.


    +   - Precise RAM size setting. Input your RAM here if it differs from what the
    system has found.


    +   - Removable media auto-mounting is for first time installations


    +   - Enable NumLock at start is based on your preference'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Setup Filesystems (Partitioning Scheme)


    +   - Correctly partitioning a hard disk will take some effort. DraX can help
    you by auto allocating the

    - Custom partitioning is detailed, and goes beyond the scope of this text. You
    can find more help at http://www.linuxdoc.org/HOWTO/mini/Partition.html, or if
    you are using more than one hard disk, this URL will help you, http://www.linuxdoc.org/HOWTO/Multi-Disk-HOWTO.html#toc21.


    # Format Partitions


    DrakX will format all newly created filesystems (partitions)


    # Choose Installed Packages


    If you have chosen the “recommended” install, DraX will automatically start your
    package installation.


    # Configure Time zone


    Choose time zone from the pull down menu listing.


    # Configure Printer


    DrakX will give you the opportunity to configure a number of printers. Choose
    you printer, if listed, or one that closely resembles your model.


    # Set Root Password


    **Important:** This password **should not** be easily guessed, or written down
    and put in a centrally accessible location. This user account has complete control
    over the system!


    # Add a User


    This user account should be used to perform daily work tasks, not related to system
    administration.


    # Create a Boot Disk


    **Important:** It is advisable to create a boot disk. This will help you boot
    the system in case something goes wrong. Please take precautions, have a formatted
    1.44Mb available


    # Install Boot Loader (LILO)


    DrakX will help you install the LILO boot loader. If you have special needs, (booting
    more than one operating system) you''ll find help at http://www.linuxdoc.org/HOWTO/mini/LILO.html#toc1.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Configure X Window System


    The Mandrake Installation program will auto-detect your monitor and graphics card.
    If you run into problems configuring X Window System, review some of the information
    at http://www.mandrakeuser.org/xwin/xtrouble.html


    # Exit Installation Program


    Hey, You are finished! Have a good time and "may the source be with you"'
