  md: 'process to open/close, read/write, and move the file position pointer (Iseek)
    in the file byte stream. As summarized in Figure 2.22, the file manager reacts
    to a write() call by placing the information in one or more output buffers. If
    a buffer becomes full, then the file manager will enqueue a write request for
    the device driver. When the device driver detects that the storage device is idle,
    and it decides that the buffer is the next one to write, it initiates a write
    operation to transfer the information from the output buffer into the storage
    device. A read operation causes the file manager to determine the current file
    position and then issue a read operation to the device driver. In this way, the
    data will be placed in an input buffer before the user process performs a call
    on the struct file-operations interface. The following discussion offers more
    details about the open/close and read/write operations (including block buffering).


    # ## Open and Close Operations


    The open function validates the request, adjusts the file descriptor table and
    file structure table, and then loads the inode into the internal VFS inode table
    (see Figure 2.13). The sys_open() function in fs/open.c performs these functions.
    It allocates the file descriptor and file structure entries, validates the access,
    and then calls filp_open(), which is also defined in fs/open.c.


