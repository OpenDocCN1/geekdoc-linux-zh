    # # Primary Memory Allocation


    The memory manager uses a dynamic page allocation strategy, meaning that the number
    of page frames allocated to a process varies according to the behavior of that
    particular process and the overall activity in the system. Here, process behavior
    refers to the size of the process''s working set—the number of different pages
    that the process is using at any given time. For example, the process might be
    using 10 different pages that contain code and another 15 that contain data. The
    size of the working set would then be 25 pages. Another process might be using
    only 12 code pages and 6 data pages, or 18 total pages. When a process generates
    a page fault, the memory manager ordinarily tries to allocate an additional page
    frame to load the missing page (see the __get_free_pages() function in mm/page_alloc.c).
    Thus, when one process needs another page frame, some other process might lose
