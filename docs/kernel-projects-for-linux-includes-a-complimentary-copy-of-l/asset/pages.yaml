  md: '# 2.1 Resource Abstraction


    *Resource abstraction* is the creation of software (usually) to simplify the operations
    that must be applied to the hardware to cause it to function properly. For example,
    a device driver is a software resource abstraction that hides the details of how
    the physical device is manipulated to perform an input/output (I/O) operation.
    Once a device driver has been implemented, other software can use it to read or
    write the device without knowing details such as how to load commands and data
    into the device''s controller registers. Abstraction can also be used to create
    resources that have no particular underlying hardware; examples of such resources
    are messages and semaphores. Abstract data types and objects are common software
    mechanisms that are used to create abstract


    Historically (and in Linux), the computer''s components are abstracted into processes
    and resources. In conventional computers, an object program (produced by the compiler
    and loader) (*random access memory*, or RAM) is placed in the machine''s executable
    memory. A process is an abstraction of the CPU operation that executes the object
    program.


    Linux is a *multiprogrammed* OS. That is, it has been designed so that multiple
    programs can be loaded into RAM at once and the OS will execute one for a while
    and then switch to another that is currently loaded in memory. The RAM is *space-multiplexed*—divided
    into blocks called memory partitions, each of which contains a program ready for
    execution. The CPU can then be *time-multiplexed*, that is, when a process is
    allocated the CPU, no other process can use the CPU for a specified period of
    time. Time-multiplexing enables the CPU to execute the programs currently loaded
    in different memory partitions. The OS must keep track of which program is being
    executed for which user (by using some previously allocated set of resources).
    The process abstraction allows the OS to control the execution of each instance
    of a program. For example, the OS can decide which process should execute and
    which should be made to wait for the CPU to become available. All of the aspects
    of the OS that implement the process abstraction are known as *process management*.


    *Resource management* is the procedure for creating resource abstractions and
    allocating and deallocating the system''s resources to and from the processes
    as they execute. A system resource is any logical component that the OS manages
    and can be obtained only by having the process request from the OS. For example,
    RAM is a system resource. A portion of RAM must be allocated to a process when
    the process begins and must be made available to other processes when the'
