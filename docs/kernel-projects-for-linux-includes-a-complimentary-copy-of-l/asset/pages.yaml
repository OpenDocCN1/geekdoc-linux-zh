    # The Kernel printk() Function


    When writing kernel code, you will often want to print messages to stdout as you
    develop and debug it. (Note that if your program is using printk(), then the process
    that executes the code must be running with root user id.) Of software, that implements
    the kernel does not have the stdio library available to it; thus you cannot necessarily
    use printf to write to stdout. Kernel programmers decided many ago that they could
    not live without a print statement and also that they did not want to rely on
    printk() working in the kernel, so they developed their own version of printk(),
    called printk(). printk() behaves the same as printf(); it is actually implemented
    by using printf in Linux (see include/linux/kernel.h). if printk() is not printing
    to your console, you can find the messages embedded in the system log - /var/log/messages.


