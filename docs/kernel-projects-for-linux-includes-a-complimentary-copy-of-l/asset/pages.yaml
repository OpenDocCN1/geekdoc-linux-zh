  md: 'of the FAT entry appears as shown in the hexadecimal dump in Figure 2.21. The
    first 3 bytes (F0 FF) are the two reserved entries and are ignored. The first
    entry corresponding to the example file is for cluster 2, beginning block. By
    the algorithm, the entry for cluster 2 is obtained by combining parts of bytes
    at offsets 3 and 4. This gives 0X03, which is less significant. This means that
    the FAT entry for cluster 2 is a pointer to its next cluster, number 3. To fetch
    number 3, you use the bytes at offsets 4 and 5, resulting in 0X04. The FAT entry
    for cluster 3 points to the next cluster in the file, number 4. cluster 4 is 0X05
    for the next cluster, and so on. Finally, at cluster 9/ (4 * 1), reading the entries
    at offsets 13 and 14 (3 * 4 + 1 and 3 * 4 + 2) gives 0Xffff, a reserved value
    that indicates the last cluster in a file. So cluster 9 marks the end of the file
    that began cluster 2. The remaining clusters, from 10 up, are still unallocated
    and have the reserved value 0.


    # Converting Clusters to Logical Sectors


    If each cluster has one logical sector, each logical sector has an entry. However,
    because the FAT area stores only information about file space, and the first two
    entries are reserved, the first cluster in the file space is cluster 2. To convert
    from a cluster number to a logical sector number, do the following:


    +   1. Subtract 2 from the cluster number.

    2. Multiply by the number of sectors in a cluster (1 for the 1.44MB floppy disks).


    Thus on media that have 1 sector per cluster, with a 1-sector reserved area, 18
    sectors for FAT, and 14 sectors for the root directory (exactly the description
    of a 1.44MB floppy), the logical sector number of the first sector of file space
    is 0 + 1 + 18 + 14 = 33. This sector will correspond to FAT cluster 2, logical
    sector 34 to FAT cluster 3, and so on.


