  md: 'BSD UNIX code into the Mach. However, by Version 3, Mach had been redesigned
    as a microkernel with servers. Although this version of the microkernel contained
    no licensed source code, the BSD server still implemented the 4-x BSD system call
    interface by using the BSD source code [Tanenbaum, 1995].


    On a smaller scale, in 1987 Andrew Tanenbaum designed and implemented a complete
    version of UNIX named MINIX. "The name MINIX stands for MINIX because it is small
    enough that even a enguru can understand how it works" [Tanenbaum, 1987]. MINIX
    implements a once-popular version of the AT&T UNIX system call interface called
    Version 7 UNIX, the basis of both BSD and System V UNIX. Tanenbaum distributed
    MINIX as a supplement to his OS textbook, providing also a comprehensive discussion
    of how the kernel was designed and implemented. He noted that MINIX "... was written
    a decade after UNIX, and has been structured in a more modular way". That is,
    it is based on a microkernel with servers, as opposed to the monolithic design
    of BSD and System V UNIX which was initially successful as a pedagogical OS, but
    it eventually lost some of its support because of its main feature—its simplicity.
    It was small enough to study but not robust enough to use as a practical OS.


    In 1991, Linus Torvalds began creating the first version of Linux inspired by
    the success of MINIX, he intended his OS to be more robust and useful than MINIX.
    Torvalds released his Linux source code to anyone who wanted to use it (by making
    it available over the Internet under the GNU Public License). It quickly caught
    on as a significant implementation of POSIX. Linux was the first version of UNIX
    for which the source code was completely free. Soon, people began to contribute
    their modifications and enhancements to Torvalds''s original code. The Linux distribution
    includes as well as a wide range of supplementary tools written by many different
    contributors. In addition to the original 80386/80486/80586 (also called the x86
    or i386) implementation, implementations were created for the Digital Alpha, Sun
    Sparc, Motorola 68K, MIPS, and PowerPC. By 1996, Linux had become a significant
    part of the commercial OS scene, while continuing in its first role, as a free
    implementation of the UNIX interface.


    Following the UNIX philosophy, Linux is actually the nucleus, or kernel, of an
    OS rather than the complete OS. The UNIX kernel was introduced as a minimal


