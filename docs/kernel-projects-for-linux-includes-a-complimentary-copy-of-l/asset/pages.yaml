  md: '# Virtual Memory


    # seven


    **Exercise Goal:** You will study how Linux implements virtual memory. A general
    architecture-independent memory model is the basis of all Linux virtual memory
    implementations, though any specific implementation depends on the particular
    hardware platform. This discussion focuses on the i386-implementation. The introduction
    explains the memory manager design. You will also study the code details so that
    you can instrument the virtual memory code to detect the rate at which the system
    is incurring page faults.


    # Introduction


    Part 1, Section 4 introduced the operation of the virtual memory system. Briefly,
    each process is created with a 4GB virtual address space, 1GB of which is mapped
    to the kernel for its use (this enables a user to reference kernel addresses,
    though it does not give the program *permission* to do so). No address can be
    used until it is mapped. The loader maps the addresses generated by the compiler
    and linker editor into the lower 3GB user portion. When a process is defined,
    the contents of virtual address spaces are defined by mapping information to specific
    blocks of virtual addresses; unused portions of the virtual address space also
    can be mapped at runtime. The mapped portions of the virtual address space are
    divided into equal-sized pages, 4K per page. The contents of mapped pages can
    be in the swap space (either a file or disk).'
