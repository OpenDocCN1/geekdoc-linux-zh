  md: '# OPERATING SYSTEMS/LINUX


    # Kernel Projects FOR Linux


    # GARY NUTT


    A LAB MANUAL FOR YOUR OPERATING SYSTEMS COURSE


    With Kernel Projects for Linux, Professor Gary Nutt provides a series of 12 lab
    exercises that illustrate how to implement core operating system concepts in the
    increasingly popular Linux environment. Part I presents an overview of the Linux
    design, offering some insight into such topics as runtime operation and process,
    file, device management. Part II consists of exercises where students move from
    inspecting various aspects of the operating system''s internals to developing
    their own functions and data structures for the Linux kernel. This hands-on manual
    complements any core operating system book by demonstrating how theoretical concepts
    are realized in Linux.


    # HIGHLIGHTS


    +   - The manual includes an expansive introduction to Linux and working in the
    Linux environment.

    - Twelve exercises provide hands-on learning by allowing students to work on programs
    that implement key theoretical operating system concepts.

    - The makeup of the manual allows students to learn concepts on a modern operating
    system—while at the same time viewing the source code.


    # ABOUT THE AUTHOR


    Gary Nutt is a professor of Computer Science at the University of Colorado. His
    interests are in operating systems, distributed systems, performance, and collaboration
    technology. He teaches in these areas, as well as in the areas of object-oriented
    software and networks. Dr. Nutt is also the author of Operating Systems: A Modern
    Perspective, Second Edition and Operating System Projects Using Windows NT™, both
    published by Addison-Wesley.


    For the latest information about Macmillan Computer Science books, visit us on
    the World Wide Web at aw.macl.com


    This book includes a complimentary copy of Linux-Mandra™ OS 7.0 Complete, kernel
    version 2.2.14 (compatible with Red Hat™); along easy installation tools. For
    more information on Linux or to purchase the Macmillan Linux-Mandrake™ product
    along with technical support, visit www.macmillan.com


    # SYSTEM REQUIREMENTS FOR LINUX™ MANDKE OS 7.0


    +   - CPU Intel Pentium and compatible processors (Pentium/MMX/Pro/II/Celeron/III
    AMD K6/K6-2, Cytrix 6x86/M-II)

    - RAM: 16MB required, 64MB recommended for Windows System

    - Disk Space: 600MB minimum, 1.5GB+ recommended

    - CD-ROM drive


