    System calls are defined in sys_call_table. Thus when you add a new system call,
    you need to add an entry to the table. You can do this by editing the table in
    the arch/i386/kernel/entry.S file, as follows.


    ```

    .data

    ENTRY(sys_call_table)

    .long SYMBOL_NAME(sys_ni_call)    /* 0 */

    .long SYMBOL_NAME(sys_exit)

    ...

    .long SYMBOL_NAME(sys_ni_call)    /* 190 */

    .long SYMBOL_NAME(sys_my_new_call)  /* 191 */

    ...

    .rept NR_syscalls-191

    .long SYMBOL_NAME(sys_ni_call)

    .endr

    ```


    This editing allows to trap (interrupt 0x80) with an argument of 191 to invoke
    a new kernel function, sys_my_new_call(). Notice that by editing this file, you'
