    # Introduction


    Part 1, Section 6. introduced the device manager strategy for the Linux kernel.
    In summary, each physical peripheral device—keyboard, display, mouse, disk, serial
    port, parallel port, network adapter, and so on—has a software device driver specifically
    designed to control that device. The device driver software encapsulates these
    details of how to control the device and exports a canonical set of operations
    through a specific interface (see Figure 2.11). The kernel uses the canonical
    device interfaces (block and character interfaces) to export the device operations
    to user-space programs via the file system interface.


    Each device driver may use a polling strategy or an interrupt strategy.


    +   - A driver that uses polling starts the device and continuously reads the
    device''s status until it completes the operation. Thus the user-space process'
