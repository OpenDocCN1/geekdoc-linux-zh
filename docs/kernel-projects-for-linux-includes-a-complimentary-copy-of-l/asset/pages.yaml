    The attribute byte stores bits for attributes, similar to UNIX attributes. The
    bit fields are shown in Figure 2.18. Note that bit 0 is the least significant
    bit. A bit set to 1 means the file has that attribute and 0 means that it does
    not. So, for example, a file with attributes 0x20 == 00100000b has the bit set
    and all others cleared. A hidden, read-only subdirectory occupies 0001011b ==
    0x13.


    # Clusters and File Storage


    Files on FAT disks are divided into clusters of N sectors. N ranges from 1 to
    32, depending on the format (hard disks use large clusters, so their allocation
    does not get too large). To access a file, you need to determine the list of clusters
    that it occupies. For example, a 2K file FOO.TXT occupies clusters 34, 19, and
    47. Because the directory has a fixed size, there is no room to store an arbitrary
    list of clusters in the directory entry. Instead, the system stores only the first
    cluster; the FAT is used to link the rest. For example, to find out what cluster
    follows cluster C use the Cth entry in the FAT. For FOO.TXT, the system would
    use 34 in the directory for the first cluster.


    ```

    FAT[34] == 19

    FAT[19] == 81

    FAT[81] == 47

    FAT[47] == 0xff8

    ```


    The special value 0xff8 marks the last cluster in the file. Any value from 0xff8
    through 0xffff may be used for this purpose. Use of this value is redundant because
    the file length indicates how many clusters there are, but the redundant information
    helps in recovering damaged disks.


    # More on the FAT


    The first two entries of the FAT (for clusters 0 and 1) are reserved. The first
    one holds the media descriptor, which, for floppy disks, takes on the values which'
