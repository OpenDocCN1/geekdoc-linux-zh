    **Exercise Goal:** You will learn how to write a UNIX shell program. This will
    give you the opportunity to learn how child processes are created to perform large-grained
    work and how the parent process can follow up on a child process''s work.


    # Introduction


    In Part 1, Section 3.6, you studied how a process is assigned to each login port
    when the machine is booted up and how a copy of a shell program is executed on
    behalf of a user that logs in on any port. A *shell, or command line interpreter
