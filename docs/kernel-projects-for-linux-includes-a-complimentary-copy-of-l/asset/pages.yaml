  md: '# Kernel Modules


    # four


    **Exercise Goal:** You will study the *module*, a mechanism unique to Linux. Modules
    can be used to dynamically add functionality to the kernel. You will write a module
    that executes as a kernel-space extension of Linux to report the values of the
    kernel''s *xtime* variable.


    # Introduction


    A Linux *module* is a set of functions and data types that can be compiled as
    an independent program (with appropriate flags to indicate that it is kernel code).
    It is then linked into the kernel when the module is *installed*. Linux modules
    can be installed when the kernel is started—*static loading*. They can also be
    installed while the kernel is *running*, called *dynamic loading*. If a function
    in a dynamic module is called before the module has been installed, the call will
    fail. But if the module has been installed, then the kernel will fill the system
    call and pass it on to the corresponding function.


    Linux systems typically have several modules loaded during normal kernel initialization
    (though the kernel can be built so that modules cannot be used with it). You can
    easily determine which, if any, modules (static or dynamic) are running on your
    Linux machine by reading the file /proc/modules.'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'Modules are generally used to implement device drivers. UNIX systems, however,
    have a traditional static mechanism for defining and adding device drivers at
    kernel configuration (you will learn more about device drivers in Exercise 10).
    One consequence of this is that the module API generally conforms to the API for
    a device driver. Even so, modules can be used to implement any desired function.


    # Module Organization


    A module, once installed, will be executed in supervisor mode in the kernel''s
    address space. Thus the module can read and write kernel data structures, provided
    that it knows their addresses. Because Linux is implemented as a monolithic kernel,
    a common problem is functions implemented in one file possibly needing to reference
    data that is defined in another file. In conventional programs, this problem is
    handled by using external (global) variables that the link editor can resolve
    when it builds the program executable object file.


    Because modules are designed and implemented independently of the kernel, they
    cannot reference kernel data structures by names by relying on static linking.
    Instead, the Linux kernel incorporates a mechanism by which files that implement
    a data structure can export the symbolic name of the structure so that the structure
    can be used at runtime. Debuggers rely on this runtime binding to allow users
    to reference data structures by symbolic name, so it was not necessary to invent
    the technique just to support modules.


