  md: '# Read and Write Operations


    The essential purposes of the read and write operations is to serialize the byte
    stream on read operations (also called unmarshaling the data) to pack (or marshal)
    the byte stream into sectors for write operations (see Figure 2.23). For example,
    suppose that the file pointer is addressing byte number i + 2 and this byte is
    stored in the ith sector in the file. Then the file system must determine where
    sector i is located on the disk. The file manager must next read the disk sector
    into memory so that the read routine can return byte i + 2 as the result of of
    the function call. Write operations require a similar approach.


    The byte stream interface allows a process to read or write an arbitrary-sized
    block of bytes, ranging from 1 byte to larger than a sector (or cluster). The
    first read operation causes the read routine to read at least one sector of disk.
    If the read operation requests less information than a sector contains, then the
    entire sector is read and kept in an input buffer. Subsequent reads on the file
    will reference the remaining bytes in the buffered sector. If a read operation
    requests more bytes than the file currently holds, then the routine will read
    another sector (i + 1 in Figure 2.23) in order to satisfy the request. The new
    sector will then be buffered and the old sector (i) released.


    A write operation behaves similarly. In many byte stream file systems, if a write
    threads to some point in the file, the new information is appended to the file
    at the file pointer''s location. Then all old information from the original file
    pointer to the end of the file is released. This means that the current sector
    is retained but that all later sectors in the file are deallocated from the file.
    In some cases, the file manager might allow the thread to simply overwrite bytes
    in the middle of a file.


    The sys_read() and sys_write() system calls are implemented in fs/read_write.c.
    Here is an annotated skeleton of sys_read().


    ```

    asmlink ssize_t sys_read(unsigned int fd,char * buf,size_t count)

    {

    ...

    struct inode * inode;

    ...

    file = fgetfd(fd); // Get the file pointer from task_structure

    // Miscellaneous error checking

    ...

    // Be sure that the kernel can write data into user''s area

    ```'
