    be recovered by copying the second copy over it. Each root directory entry uses
    32 bytes. Location 0x11 in the boot sector indicates how many entries are in the
    disk (1.44MB floppy disks have space for 224 directory entries, using 14 sectors).


    Each floppy disk drive has a fixed geometry that specifies the fundamental parameters
    for this drive. These include the number of


    +   * bytes by disk block (a block is usually called sector in the disk drive
    literat),

    * sectors in each track,

    * read/write heads, and

    * cylinders (tracks).


    A floppy disk is formatted with the geometry in its boot sector. Logical sectors
    are numbered from zero, even though individual sectors on a track are typically
    numbered from 1. The logical sector S / on track T, head H, sector S is located
    at


