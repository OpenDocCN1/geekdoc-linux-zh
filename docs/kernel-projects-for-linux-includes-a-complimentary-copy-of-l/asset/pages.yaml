  md: '# TO THE INSTRUCTOR


    Today, abstraction is the basis of most software that is written—in the classroom
    or practice. Students are taught to think of software solutions in terms of objects,
    components, threads, messages, and so on. This perspective teaches them to leverage
    the power of the hardware to solve increasingly complex tasks. In this way, they
    reduce programming time while reusing lower-level abstractions. At the bottom
    of all these abstractions is the operating system—processes and resources (and
    sometimes threads). Application software and middleware use these OS abstractions
    to create their own higher-level abstractions. These range from accounting packages,
    spreadsheets, and missile-track to windows, databases, objects, components, messages,
    and continuous media streams.


    This trend toward the heavy use of abstraction prompts some to argue that OS are
    no longer worthy of study, since they are largely transparent to the application
    programmers working at higher layers of abstraction. However, the OS is still
    fundamental because its design and implementation are the basis of the design
    and implementation of all the other abstractions. Programmers will be able to
    write better middleware and application programs if they understand how OSs work.
    Moreover, the need for people who understand basic OS technology remains, whether
    to create new microkernel servers, or to provide new systems capable of efficiently
    evolving requirements such as continuous media.


    Typically an OS instructor has to decide whether an OS course should focus on
    issues and theory or provide an environment in which students can experiment with
    OS code. The 1991 (and draft 2001) IEEE/ACM undergraduate course recommendation
    describes a course that contains of a substantial amount of time spent on issues,
    but also includes a significant laboratory component. Even though the trend is
    toward courses based on conceptual materials, students and instructors seem to
    agree that hands-on experience is invaluable in learning about OSs. Many courses
    attempt to follow the IEEE/ACM recommendation by leading the course into lecture
    and laboratory components, with the lecture component focusing on issues and theory
    and the laboratory component providing some form of hands-exercises.


    The IEEE/ACM recommendation supports the idea that the laboratory component should
    allow students to learn how to use the OS mechanisms, specifically by focusing
    on the OS application programming interface (API) as the primary mechanism for
    experimentation. The philosophy behind this approach is that students must learn
    how to use an OS before they can really understand how'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'to design one. This philosophy drives a companion book on programming Windows
    NT over the Win32 API [Nutt, 1999] and on laboratory exercises [Nutt, 2000].


    However, in a 1998 survey of 78 universities conducted by Addison-Wesley, 43 indicated
    that they teach OS internals in the introductory OS course. Of these 43, 26 used
    a variant of UNIX as the target OS, 13 used Linux, 0 an unspecified version of
    UNIX, and 3 MINIX. Each said they used other OS as the subject system (such as
    Nachos), and the remaining 9 did not specify the OS they used. The survey clearly
    showed that a significant fraction of the community teaches OS internals as a
    component of an introductory OS class, despite the IEEE/ACM recommendation and
    despite the heavy use of conceptual OS textbooks. It also showed that most of
    these courses use two books: a traditional OS theory book (such as [Silberschatz
    and Galvin, 1998 [Nutt, 2000]) and a reference book (such as [Stevens, 1993],
    [McKusick, et al., 1996], or [Beck, et al., 1998]). Of, no single-term undergraduate
    course can possibly cover all of the material in both a book and a book that describes
    an entire OS. The lack of a good laboratory manual forces the instructor to have
    students buy a supplementary book that contains more information than they will
    have time to learn in a single academic term. The instructor will have to learn
    all of the material in both books, as well to learn the subject OS, derive a suitable
    set of exercises, and provide some guidance through the OS reference materials
    so that the students can solve the exercises.


    This textbook is a laboratory manual of Linux internal exercises. It complements
    an OS theory book by providing a dozen specific exercises on Linux internals that
    illustrate how theoretical concepts are implemented in Linux. The instructor does
    not need to become a “complete” Linux expert or derive a set of exercises (either
    with full documentation for the exercise or with appropriate sections in a supplementary
    reference book). Instead, the instructor, lab assistant, and students can use
    this manual as a self-contained source of background data and exercises to study
    how concepts are implemented. The less expensive laboratory manual replaces a
    general reference book, while providing focused information for a set of kernel
    exercises. For students who want to understand related information that is not
    required in order to solve the exercise, the background material for exercises
    provides pointers to reference books (and the literature).


    A single-semester OS course consists of 15 weeks of course material. In experience,
    many undergraduate students have difficulty doing a substantial programming exercise
    in less than one and a half to two weeks. This means that'
