    # 2.2.3 Managed Sharing


    In cases, two or more processes need to share a resource. For example, one process
    reads a file that contains the number of hours that each employee worked and a
    second writes payroll checks. While the second process is writing the check for
    record $i$, the first process could be reading the hours for record $i + 1$. How
    can the first process tell the amount of the check that it should write? If the
    two processes share a block of memory, then the first process can write the amount
    for record $i$ into the shared memory and then immediately starting reading record
    $i + 1$. When the second process is ready to write the check for record $i$, it
    can read the amount from the shared memory.


    The barriers that the system uses to enforce the exclusive use of a resource (for
    example, to prevent one process from reading or writing the memory that has been
    allocated to another) generally prevent sharing strategies. To accommodate when
    it is needed, the OS must make some provision for violating the exclusive use
    mechanism when both processes share a resource. Just as the mechanism that is
    used to enforce exclusive use varies among resources, so does the mechanism for
    allowing resource sharing. This adds a new level of complexity to the design of
    the resource manager.


    # 2.3 A Partition of OS Functions


    OS designers partition the functions that must be performed by the OS into the
    following four categories.


    +   **Process and resource management.** Process and resource management is the
    heart of a multitasking OS. It creates the software environment that is the illusion
    of multiple virtual machines, with their own logical resources being used by multiple
    processes.


    +   **Memory management.** Memory management is responsible for allocating memory
    to processes, for protecting allocated memory from unauthorized access, and sometimes
    for automatically moving information back and forth between the memory and storage
    devices. The Linux manager employs *virtual memory* based on paging. Systems with
    virtual memory provide the most general functionality, accomplishing all the goals
    of allocation, protection, and automatic movement. However, virtual memory carries
    costs—in time, space, and hardware.


    +   **Device management.** A computer can be configured with a wide array of different
    device types. Some are low-speed character devices, for ex-'
