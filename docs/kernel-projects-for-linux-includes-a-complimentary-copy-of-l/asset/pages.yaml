    # # Compiling a Module


    Once you have designed and coded your module, you must compile it into an object
    file suitable for loading by the kernel. You need to instruct the compiler to
    compile this as kernel code rather than normal user code; do this by passing the
    flag __KERNEL__ to the compiler (notice the two underbar preceding and following
    KERNEL). Use the MODMODULE compile-time flag to tell the compiler that the file
    is a module rather than an ordinary file. Use the -w compiler option to pass a1
    to the loader and the -c switch to tell the compiler not to call the linker after
    it compiles the file.


    A command to compile a file foo that contains a module might look like this:


    ```

    gcc -c -W -D__ __KERNEL__ -DMMODULE foo.c

    ```


    The mandate Kernel distribution requires an additional argument -D_Loose_Kernel_Names
    before it will handle kernel symbols properly.


