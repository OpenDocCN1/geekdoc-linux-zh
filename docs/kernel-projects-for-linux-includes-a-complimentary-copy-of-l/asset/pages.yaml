    File descriptors-inodes are kept in a hash table, hash_table, that is defined
    in fs/buffer.c (in the directory ...linux). Each hash table entry includes a struct
    *inode field, which is defined in include/fs.h (...linux) as follows.


    ```

    struct inode {

    ...

    uid_t i_uid;

    gid_t i_gid;

    ...

    time_t i_atime;

    time_t i_mtime;

    time_t i_ctime;

    };

    ```


    The listed fields specify the file owner''s user and group IDs (i_uid and i_gid,
    respectively), and the three time_t fields specify the last time that the file
    was accessed, the last time that it was modified, and the time at which it was
    created. The kernel variable, static struct file * inuse_filps (declared in fs/file_table.c),
    points to a list of all file descriptors in the system. The struct file definition
