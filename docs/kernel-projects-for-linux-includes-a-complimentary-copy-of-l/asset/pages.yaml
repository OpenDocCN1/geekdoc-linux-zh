  md: '# # make <boot_opt>


    All of these commands use linux/Makefile to create a new kernel and boot it in
    linux/arch/<arch_type>/zimage.


    Next, you will examine each command more closely. Assume <arch_type> is i386.


    +   - make clean: Removes old relocatable object files and other temporary files
    so that your build will have a clean environment in which to build.


    +   - make <config_opt>: Defines the logical environment in which the new kernel
    should exist. Generally, the <config_opt> parameter can be set to config. In this
    case, make will run a bash script Configure, which reads a configuration file,
    linux/arch/i386/config.in. Then it queries the system builder regarding kernel
    options to be installed in the new kernel. You usually will not want to change
    the config.in file, though you should inspect it to get an idea of how it works
    (If you decide to change the config.in file, you will need to dig deeper into
    the tools and configurations than you will in this manual. Start your exploration
    by reading Section 2.3 of Beck et al. [1998].) To use the default options for
    making the kernel configuration, use the oldconfig value for <config_opt> rather
    than the config value for this step. This part of Makefile creates linux. and
    linux/include/linux/autocf.h files. The .config file captures responses from the
    interactive dialog that determines the exact configuration; if you make config
    again, it will use the responses from .config. The autofocus.h is a header file
    that is used to invoke compile-time options that correspond to the choices made
    in the interactive dialog with make.


    +   - make depend: Many files must be compiled and in a particular order. make
    depend creates a file, linux/.depend, that specifies the compile-order dependencies.
    Specifying dependencies is a simple, but laborious, task that is automated by
    the depend option of Makefile.


    +   - make: Compiles all of the kernel source code, producing linux/vmlinux, the
    kernel executable file. If you have written new kernel code, or modified existing
    files, then this step will compile that code (there this is probably where you
    will encounter your first problems in building a new kernel). This is the most
    complex part of Makefile. It invokes make on all of the subdirectories and ultimately
    links the results together to form the kernel executable.


