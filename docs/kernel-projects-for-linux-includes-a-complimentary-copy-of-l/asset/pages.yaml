    though they ultimately cause sector I/O in the device driver. Once the buffer
    management code determines which blocks to read or write—the process is complex—it
    calls the device driver ll_rw_block() function in drivers/block/il_rw_blk.c to
    perform the operation.


    # # Problem Statement


    # # Part A


    Design and implement a character device driver for a virtual FIFO. Recall that
    a FIFO is equivalent to a pipe: One process can write into the FIFO, and another
    can read from it. The first character written to the FIFO is the first character
    returned by a read operation. Your driver should implement N FIFOs queues (N=4)
    by implementing 2N minor device numbers. Even-numbered devices are write-only
    devices, and odd-numbered are read-only devices. Characters written to device
    i are readable from device i + 1.


    Your driver should be a loadable device driver, that is, it should be implemented
    as a module. Use a major device number, K, assigned to you by your instructor.
    Use mknod to create a special file with the name /dev/fifoLK, where L is a number
    in the range [100, 255].


    Reading from an empty FIFO device should return an EOF if the other end is not
    currently open. Otherwise, the process calling the read operation must be blocked.
    Write operations (and a close on a write device) must wake up a blocked reader,
    if one exists.


    FIFO device drivers must cope with writes that are too large using a variant of
    sleep() and wakeup(). A write operation might be too large for the remaining space
    or for the statically allocated space. Alternatively, you may implement a FIFO
    device of unbounded size that dynamically obtains kernel space.


    # # Part B


    Demonstrate that your device driver operates properly. Be sure that your test
    program exercises the boundary conditions for the driver.'
