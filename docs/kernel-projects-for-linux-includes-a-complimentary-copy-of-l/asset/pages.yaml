  md: 'ity process preempted and the higher-priority process begins to run. Of course,
    in the normal timesharing (SCHED_OTHER) policy, processes do not preempt one another,
    since they all have a static priority of zero.


    Any task/process that uses the SCHED_FIFO policy must have a priority of 1 to
    99 (that is, it has a higher priority than all SCHED_OTHER tasks). Thus a SCHED_FIFO
    task that becomes runnable takes priority over every SCHED_OTHER task. The SCHED_FIFO
    policy does not reschedule on a timer interrupt. A SCHED_FIFO task gets control
    of the CPU, it will retain control until either it completes, blocks by an I/O
    call, calls sched_yield(), or until a higher priority task becomes runnable. If
    it yields or is preempted by another, higher-priority, task, it is placed at the
    end of the queue at the same priority level.


    The SCHED_RR policy has the same general semantics as the SCHED_FIFO policy, except
    that it uses the time-slicing mechanism to multiplex among tasks that are in the
    highest-priority queue. A running SCHED_RR task that is preempted by a higher-priority
    task is placed back on the head of its queue so that it will resume when its priority
    is again the highest in the system. The preempted process will then be allowed
    to complete its quantum.


    The SCHED_OTHER policy is the default timesharing policy. It uses the conventional
    time-slicing mechanism (rescheduling on each timer interrupt) to put an upper
    bound on the amount of time that a task can use the CPU continuously if other
    tasks are waiting to use it. This policy ignores the static priorities used to
    discriminate among tasks in the other two policies, instead a dynamic priority
    is computed on the basis of the value assigned to the task by the nice or setpriority()
    system call and by the amount of time that a process has been waiting for the
    CPU to become available. The counter field in the descriptor becomes the key component
    in determining its dynamic priority. It is adjusted on each timer interrupt (when
    the interrupt handler adjusts the various timer fields for the task).


