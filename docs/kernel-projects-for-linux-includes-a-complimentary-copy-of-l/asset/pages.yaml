  md: "```\nstruct shmid_kernel\n{\n    shmid_ds u;\n};\n```\n\nThe arguments to shmget()\
    \ are key, size, and int shmflag. The size argument specifies the size of the\
    \ new block of memory. All memory allocation operations are in terms of pages.\
    \ That is, if a process requests 1 byte of memory, the memory manager allocates\
    \ a full page (PAGE_SIZE = 4096 bytes on i386 machines). Thus the size of the\
    \ new shared memory block will be the value of the size argument rounded up to\
    \ the next multiple of the page size. A size of 1 to 4,096 results in a 4K (one-page)\
    \ block, 4,097 to 8,192 results in an 8K (two-page) block, and so on.\n\nThe key\
    \ argument may be either the of an existing memory block, 0, or IPC_PRIVATE. When\
    \ it is IPC_PRIVATE, the shmget() call creates a new block of shared memory. When\
    \ it is 0, and the IPC_CREAT flag is set in the shmflag argument then shmflag\
    \ also can cause a new block to be created.¹ A process that refers to a shared\
    \ memory block that was created by another process (such a parent or server) will\
    \ usually obtain the struct shmid_kernel reference from the creator. However,\
    \ it can also set the key argument to the value of an existing memory block. If\
    \ key's value is set, and shmflag is set with IPC_CREAT | IPC_EXCL, then shmget()\
    \ will fail. shmflag must also define the access permissions for user, group,\
    \ and world- as its lower 9 bits (by using the same bit pattern as file protection).\n\
    \nWhen a shared memory region is successfully created, shmget() returns an integer\
    \ reference to its struct shmid_ds.\n\n```\nstruct shmid_ds {\n    struct ipc_perm\
    \ shm_perm; /* operation perms */\n    int shm_segsz;               /* size of\
    \ segment (bytes) *\n    kernel_time_t shm_atime;    /* last access time */\n\
    \    kernel_time_t shm_dtime;    /* last detach time */\n    kernel_time_t shm_ctime;\
    \    /* last change time */\n    kernel_ipc_pid_t shm_cpid;  /* pid of creator\
    \ */\n    kernel_ipc_pid_t shm_lpid;  /* pid of last operator */\n    unsigned\
    \ short shm_nattch;   /* no. of current attaches */\n    unsigned short shm_unused;\
    \  /* compatibility * */\n```\n\n> ¹ The shmflag argument is a set of single-bit\
    \ flags. Setting multiple flags in shmflag involves combining them with a logical\
    \ OR operator (|) and assigning them to shmflag."
