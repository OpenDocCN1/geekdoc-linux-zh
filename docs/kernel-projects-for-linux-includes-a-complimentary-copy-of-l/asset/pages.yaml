  md: 'You first saw struct task_struct in Exercise 1. This structure contains more
    than 75 fields, a few of which you have already seen. Next, you will consider
    the ones related to time values.


    ```

    struct task_struct {

    ...

    long counter;

    ...

    unsigned long policy, rt_priority;

    unsigned long it_real_value, it_prof_value, it_virt_value;

    igned long it_real_incr, it_prof_incr, it_virt_incr;

    struct timer_list real_timer;

    // Contains tms_utime, tms_stime, tms_cutime, and tms_cstime

    struct tms;

    unsigned long start_time;

    long per_cpu_utime[NR_CPUS], per_cpu_stime[], cutime, cstime;

    ;

    ```


    These fields are updated in the update_process_times() function located in kernel/sched.c
    (invoked as part of the ret_from_sys_call bottom half processing). This function
    calls update_one_process(), which calls other functions to update the values and
    decide whether a signal should be raised to indicate that a timer has expired.
    The counter field is used to determine whether the process needs scheduling attention.


    The interval timers (it_XXX_value/it_XXX_incr) use the kernel to keep track of
    the following three intervals of time relevant to every process.


    +   - ITIMER_REAL: Reflects the passage of time and is implemented by using the
    it_real_value and it_real_incr fields.

    - ITIMER_VIRTUAL: Reflects the passage of virtual time. This time is increased
    only when the corresponding process is executing.

    - ITIMER_PROF: Reflects the passage of time during which the process is active
    (virtual time) plus the time that the kernel is doing work on behalf of the corresponding
    process (for example, reading a timer).


    Each of these timers is actually a countdown timer. That is, it is periodically
    initialized to some prescribed value and then reflects the passage of time by
    counting down toward zero. When the timer reaches zero, it raises a signal to
    notify another part of the system (in the OS or a user-space program) that the
    counter has reached zero. Then it resets the value and begins counting down again.'
