    # Process States


    The state field in the task descriptor can have any of the following values:


    TASK_RUNNING


    TASK_INTERRUPTIBLE


    TASK_UNINTERRUPTIBLE


    TASK_ZOMBIE


    TASK_STOPPED


    As you go through the kernel code, you will often see statements of the form


    current->state = TASK_...;


    For example, the sleep_on() code, state is set to TASK_UNINTERRUPTIBLE before
    the process is placed on a wait queue. In wake_up(), state is set back to TASK_RUNNING
    after it is removed from the wait queue. Recall

    that the distinction between the TASK_INTERRUPTIBLE and TASK_UNINTERRUPTIBLE_TASK_UNINTERRUPTIBLE
    states relates to the sleeping task''s ability to accept signals.

    TASK_ZOMBIE represents a state in which a process has terminated, but its parent
    has not yet performed a wait() system call to recognize that it has terminated.
    That is, the task does not disappear from the system until the parent is notified
    of its termination. The final possible value for the state field

    is TASK_STOPPED, which means that the task has been halted by a signal

    through the ptrace mechanism. Thus most of the kernel codes

    the state field to TASK_RUNNING, TASK_INTERRUPTIBLE, or TASK_UNINTERTIBLE.


    Outside the kernel, a different set of process states is visible to users. The

    states are defined by the POSIX model rather than the Linux implementation, though
    they are analogous to the internal states kept in the task descriptor.

    You can review these external states by inspecting the manual page for the\STAT
    command in a ps command. The ps has three fields. The first field may be

    one of the following:


    +   R: The process is running or runnable (its kernel state is TASK_RUNNING).

    S: The process is sleeping (its kernel state is TASK_INTERRUPTIBLE).'
