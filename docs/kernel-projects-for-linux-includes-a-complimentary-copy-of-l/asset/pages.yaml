  md: 'The actual read request occurs in the file->f_op->read() call. It is here that
    the disk-independent code calls the disk-dependent code of one of the file systems
    (for example, generic_file_read() in ext2), then you will see where the details
    come into play. The read function interacts with the virtual memory so that it
    can be assured that memory space is available into which the data can be copied.
    It must also interact with the buffer management mechanism. This mechanism, in
    turn, must interact with the device driver and interrupt routines (reconsider
    the actuality that is implied by Figure 2.22).


    # Block Allocation


    Every file ultimately gets stored on the block device in some collection of disk
    blocks (sectors). The strategy used to allocate disk blocks to a file, and to
    keep track of which blocks that file is using, is determined by the individual
    file systems. The VFS does not have a strategy for block management. It defers
    that strategy to the disk-dependent part of the file manager.


    For example, the ext2 file system (see fs/ext2/balloc.c) uses a traditional UNIX
    strategy. The blocks that comprise a file are stored according to four substrategies.
    (See also Part 1, Section 7.)


    +   1. **First 12 blocks**: Referenced directly from the inode.

    2. **Second group of blocks**: Referenced by using a single level of indirection
    (via a table stored on the disk).

    3. **Third group of blocks**: Referenced indirectly through two layers of indirect
    tables.

    4. **Last group of blocks**: Referenced indirectly through three layers of indirect
    tables.


    The ext2 file system handles free blocks by using a block bitmap. One bit responds
    to each disk block; a block allocated to some file is marked with a 1.


    # Buffer Management


    Ordinary sector-based read and write operations implicitly cause the file manager
    to buffer at least one input and one output sector per file as part of serializing
    and packing blocks. As summarized in Figure 2.24, you can exploit buffering by
    having a number of buffers used on input and output streams. The advantage of
    doing this is better performance. That is, the file manager can read ahead on
    the input stream to avoid making the application block on a sector reader. Similarly,
    the file manager can write behind so that the thread does not have to block while
    waiting for a sector write operation to finish.'
