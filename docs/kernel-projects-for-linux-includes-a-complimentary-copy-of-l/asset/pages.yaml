    # The Virtual Address Space


    When a process is created, it inherits a 32-bit (4GB) virtual address space from
    its parent. It uses locations 0x0 to 0xFFFFFFFF when it executes in user space
    and locations 0xC0000000 to 0xFFFFFFFF when it executes in supervisor mode. The
    last 1GB references kernel components, this portion of the address space has the
    same mapping for every process. In terms of the architecture-independent model
    introduced in Part 1, Section 5, every process uses the same page table to reference
    the addresses used by the kernel (meaning the page middle directory entry for
    this part of the address space references the same page table in every process).


    A virtual address includes a segment, specified by a segment selector, and an
    offset in the segment. The kernel addresses and user space addresses have different
    segment names. Each segment is subdivided into segments that hold data (that can
    be read or written) and code (that can only be executed and read). User code uses
    the segment selector implicitly set to user, so the code provides offsets within
    the user segment. Each segment has its own page table (the collection of page
    tables for the process is kept in the page middle directory). The memory translation
    mechanism can then prevent the user-space process from referencing locations in
    the kernel segment, and it warns the kernel when it is referencing user-space
    locations (to prevent inadvertent reading or writing). Various macros are provided
    to manipulate the different segments defined in include/segment.h. The put_user_byte/word/long(i)
    and get_user_byte/word/long(i) allow kernel-space software to bypass the protection
    mechanism to write or read 1 byte, 2 bytes, or 4 bytes (long) in a user segment.
    The file also defines others to copy and manipulate segment contents.


    The organizations of the use-space segments are specific to the version of Linux
