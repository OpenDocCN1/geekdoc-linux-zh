    open() is called when the area is mapped into the virtual address space, and close()
    is called when it is removed from the virtual address space. swapout() copies
    a loaded page back to the swap space. The page fault handler calls swapout() when
    it decides to remove a page from the primary memory. swapin() copies a page from
