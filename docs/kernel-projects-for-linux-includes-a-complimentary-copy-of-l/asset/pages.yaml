  md: '# 3.1 Interrupts


    The kernel reacts to service requests from any active, external entity. In some
    cases, the external entity is a process that performs a system call (described
    in Part 1, Section 3.2). In other cases, a hardware component can request service
    from the kernel by issuing an interrupt. An interrupt is an electronic signal
    produced by an external component (such as a device) that is fielded by the CPU
    hardware, thereby causing the CPU to begin executing a program sequence that is
    independent of the one it was executing at the time the interrupt occurred. Usually,
    the interrupt signals that a device has finished an I/O operation that was started
    earlier by a device driver. However, sometimes it signals an event, such as the
    physical clock having "ticked."


    In the i386 architecture, the hardware behavior of an interrupt is represented
    by the algorithm shown in Figure 1.3. The basic part of the fetch-execute hardware
    algorithm has the program counter (PC) holding the address of the next instruction
    to be executed. When it is time to execute the instruction, the instruction is
    copied from memory into the instruction register (IR). The control unit part of
    the CPU then decodes and executes the instruction from the IR.


    When an external component wants service, it makes an interrupt request (IRQ)
    that sets a conceptual interrupt request flag, InterruptRequest, in the CPU. As
    shown in Figure 1.3, the control unit hardware checks InterruptRequest at the
    end of each fetch-execute cycle. If an IRQ occurs, the hardware algorithm causes
    the CPU to cease executing the sequence of instructions addressed by the hardware
    PC. It then calls the CPU to branch to an interrupt service routine (ISR) (also
    generally referred to as an interrupt handler in other OSs) for this IRQ, by writing
    the address of the ISR into the PC with the restore_PC(IRQ) function in the algorithm
    description. The ISR address is stored in a kernel table that was set up when
    the kernel was initialized. When the branch occurs, the hardware saves the original
    PC (the address of the next instruction to be executed) of the interrupted process.


    When the ISR begins executing, the CPU registers will contain values that are
    being used by the interrupted process (excluding the PC). The ISR immediately
    saves all of the general and status registers of the interrupted process and copies
    its own into every CPU register so that it can run the main part of the ISR routine
    to handle the interrupt occurrence.


    A problem can result if an interrupt occurs while one ISR is in the middle of
    execution when the second IRQ occurs. That is, before, the CPU can finish the
    first interrupt, it could restart due to the occurrence of a second'
