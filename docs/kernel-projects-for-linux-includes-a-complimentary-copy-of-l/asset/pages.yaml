  md: '# Opening a File


    To open a file, the file manager does the following.


    +   1. Traverses the composite file system to locate the file descriptor in its
    native format (for example, MS-DOS format) on the disk. The file reference is
    the file''s external name.


    +   2. Extracts the file description from the on-disk descriptor.


    +   3. Translates the information needed by the VFS.


    +   4. Stores the requisite information into VFS tables using disk-independent
    Linux format.


    The design of the internal file descriptor and tables is inspired by conventional
    UNIX designs. That is, the VFS has a file descriptor table for each process, file
    structure table, and an inode for each open file (see Figure 2.13). When a file
    is opened, entries are made into each of these data structures.


    Each process''s file descriptor table (the struct files_struct files in the process''s
    struct task_struct) has one entry for each open file for the process. The default
    value for descriptor 0 is stdin, for 1 is stdout, and for 2 is stderr. The entry
    defines file open and close actions and provides a pointer to a file structure
    table entry of type struct file (see include/linux/fs.h).


    Figure 2.13

    VFS-Disk Translation


