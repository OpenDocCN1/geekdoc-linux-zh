  md: '# Observing Linux Behavior


    # one


    **Exercise Goal:** You will learn several important characteristics of the Linux
    kernel, processes, memory, and other resources. You will write a program to use
    the /proc mechanism to inspect various kernel values that reflect the machine''s
    load average, process resource utilization, and so on. After you have obtained
    the kernel status, you will prepare a report of the cumulative behavior that you
    observed.


    # Introduction


    The Linux kernel is a collection of data structure instances (kernel variables)
    and functions. The collective kernel variables define the kernel''s perspective
    of the state of the entire computer system. Each externally invoked function—system
    call or an IRQ—provides a prescribed service and causes the system state to be
    changed by having the kernel code change its kernel variables. If you could inspect
    the kernel variables, then you could infer the state of the entire system.


    Many variables make up the entire kernel state, including variables to represent
    each process, each open file, the memory, and the CPU. Kernel variables are no
    different than ordinary C program variables, other than they are kept in kernel
    space. They can be allocated on a stack (in the kernel space) or in static memory
    so that they do not disappear when a stack frame is destroyed. Because the kernel
    is implemented as a monolithic module, many of the kernel'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'variables are declared as global static variables. Some of the kernel variables
    are instances of built-in C data types, but most are instances of an extensible
    data type, a `struct`.


    In general, the extensible data structures are defined in C header files (also
    called include files or .h files) in the Linux source code tree. The Linux source
    code may be loaded in any subdirectory in your laboratory computer, the conventional
    location is in `/usr/src/linux`. Most of the system''s `include` files are stored
    in the `../linux/include` directory. This directory''s exact contents depend on
    the version of the source. In Version 2.2.12, it includes the directories `asm-generic`,
    `asm-i386`, `linux`, `net`, `scsi`, and `video`. Also inside is a symbolic link
    `asm` that points to `asm-i386`. All of the machine-independent `include` files
    are kept in the `linux` subdirectory, and most of the machine-dependent subdirectories
    contain miscellaneous other `include` files.


    The `include` file `/linux/sched.h` defines a data structure used for the process
    descriptor.


    ```

    struct task_struct {

    /* These are hardcoded - don''t touch */

    volatile long state; /* -1 unrunnable, 0 runnable, >0 stopped */

    ...

    int pid;

    ...

    uid_t uid, ...;

    gid_t gid, ...;

    ...

    };

    ```


    The source code file `kernel/sched.c` contains a declaration of the form `struct
    task_struct *task[NR_TASKS] = {init_task, task};`


    The `task` kernel array is the pointer to all of the process descriptors. If you
    could read the `task` kernel variable and wanted to know the kernel state of a
    process with a process ID of, say, 1234, you could find the record `task[i]` such
    that `task[i]->pid == 1234`. Knowing the value `i`, you could then read the value
    of the `task[i]->state` field to determine the current state of the process. The
    `task[i]->uid` field is the user ID for the process, and `task[i]->gid` is the
    group ID for the process. (A process descriptor contains many more fields, as
    you will discover in subsequent exercises.)'
