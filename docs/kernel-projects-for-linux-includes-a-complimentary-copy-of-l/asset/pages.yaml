- img_proc: true
  md: 'that implemented the bare necessities and software to provide the desired bells
    and whistles to libraries and other user-mode software. The early UNIX kernel
    followed the principle of "small is beautiful." In the intervening quarter of
    a century, new features were continually added to it, creating creeping futurism
    that caused it to grow quite large. Today, UNIX can no longer be considered a
    minimal set of functionality.


    Though Linux is usually thought of as "UNIX kernel," in 1991 it started as a new
    design without the collection of hacks and patches that in the current kernels.
    It has attempted to follow the "small is beautiful" philosophy of UNIX while still
    implementing POSIX. However, because it is freely available, anyone can add features
    to the kernel. Thus it is susceptible to the same "creeping futurism" that grew
    the UNIX kernel. The Linux kernel is still relatively small but is growing rapidly.
    The Version 2.2 kernel is larger and more complex than the Version 2.0, which
    is larger and more complex than Version 1.


    This manual discusses the design and implementation of the Version 2.2 Linux kernel.
    The exercises and explanations were based on the latest stable release of Linux
    in early 2000, Version 2.2.12. Part 1 of this manual describes the kernel''s overall
    organization. The exercises in Part 2 focus on different aspects of the kernel,
    each considering considerably more detail about the part of the kernel that is
    relevant to the exercise.


    # 2 General Kernel Responsibilities


    The UNIX family of OSs divides functionality into two classes. In the first, the
    kernel executes with the CPU in supervisor mode (see Part 1, Sections 2.2.2 and
    3.2), whereas in the second, all other OS components execute with the CPU in user
    mode. This manual focuses on the Linux kernel. In general, the kernel is responsible
    for abstracting and managing a machine''s hardware resources and for managing
    the sharing of resources among executing programs. Because Linux implements a
    UNIX-style interface, the general definitions of resource abstractions and sharing
    models are already determined. The kernel must support processes, files, and other
    resources so that they can be managed with the traditional UNIX system calls.
    Linux differs from other systems that implement a UNIX interface in the data structures
    and algorithms that it uses to meet these responsibilities.'
  merge: -1
