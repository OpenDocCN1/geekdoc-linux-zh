    +   - **File management** File management implements a specialized resource abstraction
    for storing information on the computer''s storage devices (such as disk drives).
    The file manager also provides directories for organizing files. Like most contemporary
    OSs, Linux uses a hierarchical file directory. The file manager uses the functionality
    of the device manager to implement these abstractions.


    The UNIX philosophy, to which Linux adheres, is to implement the minimum amount
    of mechanism for kernel functions, with the remainder implemented in user space
    software (libraries, runtime software, middleware, and application programs).
    A simple example that reflects this philosophy is the way in which files are handled.
    Applications programs nearly always manipulate records of data instead of linear
    streams of bytes. In the UNIX philosophy, only byte stream files are implemented
    in the kernel. If an application intends to organize the stored information as
    records, then it is responsible for


    +   - defining the data''s structure (for example as a C struct),

    - translating the structure into a byte stream before it is written into a file,

    - translating the byte stream back into a structure after it has been read from
    the file.


    The kernel file mechanism has no knowledge of any application''s data structures;
    it only handles byte streams. User-space code (libraries such as the stdio library
    or the application software) defines the data structures used with each byte stream
    file.


