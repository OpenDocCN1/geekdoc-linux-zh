  md: '# The Page Fault Handler


    The page fault handler is responsible for


    +   - finding a page frame in the physical memory (possibly swapping an existing
    page back to the swap space)

    - swapping the missing page into the page frame, and

    - adjusting the page tables.


    Recall that Linux uses the copy-on-write strategy for sharing pages among-address
    spaces. Thus whenever any process attempts to write to a page that is marked to
    be copied on a write operation (that is, it is marked as read-only), the write
    operation will cause a page write violation fault. Figure 2.9 summarizes the kernel
    functions that accomplish this work (though this discussion omits most of the
    details). The address translation mechanism raises 0x80 when it detects a missing
    page or other page fault (such as a protection violation). The system interrupt
    handler dispatches `do_page_fault()` to handle the interrupt.


    The `do_page_fault()` function is architecture-specific code located in arch/i386/mm/fault.c.
    The following abstraction of the code highlights critical aspects of the page
    fault handler.


    ```

    asmlinkage void do_page_fault(

