    You use the struct ipc_perm shm_perm field to define the owner of the shared memory
    block and the permissions for other processes to use the block.

    It contains fields to specify the user''s and group ids, the creator''s and group
    ids, the access mode (read or write), and the key value for the memory block.
    (The man page for shmget() describes shm_ds and ipc_perm struct fields).


    The void shmat(int shmid, char *shmaddr, int shflig) system call maps the memory
    block into the calling process''s address space. The shmid argument is the result
    returned by the shmget() that created the block. The shmaddr pointer is the virtual
    address to which the first location in the shared memory block should be mapped.
    If the calling process does not choose the address to which the memory block will
    be mapped, it should pass a value of 0 for shmaddr. shmaddr''s value should be
    aligned with a page boundary. If shmaddr is specified, and SHM_RND is asserted
    in shflig, then the address will be rounded down to a multiple of the SHMBA constant.
    shflig is used in the same way as the corresponding flag in shmget(), that is,
    to assert a number of 1-bit flags to the shmat() system call. In addition to asserting
    the SHM_RND flag, the calling process can assert SHM_RDONLY to attach the memory
    block so that it can be only read, and not written.


    When a process finishes using a shared memory block, it calls shmdt(char *shaddr),
    where shaddr is the address used to attach the memory block. The kernel then updates
    the corresponding struct shmid_kernel to reflect that this process is no longer
    using the memory block.


    The final shared memory call is int shmctl(int shmid, int cmd, struct *buf). This
    call performs control operations on the shared memory block descriptor. The shmid
    argument identifies the shared memory block and the cmd argument specifies the
    command to be applied to the descriptor. If cmd is set to IPC_STAT, then the calling
    process must provide a buffer, buf, that is at least as large as a struct shmid_kernel.
    shmctl() fills in the current values of the shmid_ds and returns them in buf.
    If then the data structure will be updated, provided the calling process is an
    owner or creator (or hasuser permission). A call with cmd set to IPC_RMID causes
    the memory segment to be destroyed (it will not otherwise be destroyed, even when
    no process is attached to it). A superuser can lock or unlock the block.


    # Shared Memory'
