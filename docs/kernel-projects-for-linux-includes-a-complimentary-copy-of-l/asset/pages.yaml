- img_proc: true
  md: 'Note that you are beginning to inspect Linux source code, you should always
    use the grep shell command when looking for functions and variable names. For
    example, you can find do_gettime_ofday() by changing to arch/i386/kernel and using
    grep to find the files that contain do_gettime_ofday.


    For the tv_use value to be correct at all times, it must be changed exactly once
    every microsecond (a million of a second). All modern computers use the same approach
    for keeping track of time. The hardware includes a programmable timer device that
    can be set to issue an interrupt every K units; in the case of Linux machines,
    K is set to 10 milliseconds. The system can track the passage of time by counting
    the number of interrupts that have occurred since the system was booted. If the
    time the machine was booted is known, then the more accurately, the better time
    that has elapsed since the machine was booted) can be computed to within 10 milliseconds.
    In i386 machines, a time-of-day clock runs whether or not the machine is powered
    up (machines usually have a battery backup provides power for this clock). The
    time-of-day clock is not very accurate, but it establishes a baseline that can
    be used in conjunction with the 10-millisecond clock.


    The clock ISR timer_interrupt() in file arch/i386/kernel.c calls the do_timer()
    function in kernel/sched.c. This function increments a counter, in a kernel variable
    named jiffies each time it runs. It marks TIMER_BH (the timer bottom half) for
    execution in the ret_from_sys_call sequence (see Part 1, Section 3.1) so that
    it will run timer_bh in kernel/sched.c. When the bottom half runs, it updates
    the system time as well as a set of timers for each process (per process timers;
    see the next subsection). For the system time, the timer bottom half uses the
    current value of jiffies to compute the current time. It stores the value in struct
    timevalxtime, where the value can be read by other kernel functions (such as sys_gettimeofday()).


    # Per Process Timers


    The kernel accumulates time and manages various timers for each process. For example,
    the scheduling strategy depends on each process''s having a record of the amount
    of CPU time that it has accrued since last acquired the CPU. Because these time
    values are associated with each process, they are saved in the process''s descriptor.
    When the kernel creates a task, it allocates a new task descriptor of type struct
    task_struct from the kernel''s heap space (i.e., it uses the kernel kmalloc()
    call).'
