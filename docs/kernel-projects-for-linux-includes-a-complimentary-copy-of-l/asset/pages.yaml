    # 7 File Management


    The Linux file manager defines a single internal view of files that application
    programs use to read and modify files written onto all storage devices. Each type
    of storage device implements the common view in its file manager. For example,
    a disk that contains files written using MS-DOS (or a Windows OS with DOS-compliant
    format) can be read or rewritten by a Linux application using the Linux file manager.
    According to the internal Linux view, a file is a named byte stream that can be
    saved in the secondary storage system. This byte stream is fragmented into a set
    of blocks, and then the blocks are stored on the secondary storage device according
    to a strategy chosen by a particular type of file system. The file manager fetches
    and puts the blocks that contain the portions of the byte stream that an application
    program writes or reads. That is, it determines which disk blocks should be read
    or written whenever any part of the byte stream is read or written.


