    In ANSI C programs, the compiler uses function prototypes to check that a function
    call agrees with the target function header. The function call is compiled only
    if it provides the correct number and types of arguments according to the prototype
    definition. The system call linkage is dynamic, meaning that it does not use the
    compiler''s type checking mechanism. Instead, when the kernel begins to execute,
    it presumes that arguments have been placed on the stack when the function is
    called. In several cases, the kernel function checks for obvious error values
    (such as an attempt made to dereference a null pointer), but you have no assurance
    that bad parameter values will be caught by the kernel function.


