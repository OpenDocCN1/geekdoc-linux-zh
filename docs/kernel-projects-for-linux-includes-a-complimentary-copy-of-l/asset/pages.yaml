    # Driver Organization


    A driver is a collection of functions and data structures whose purpose is to
    implement a simple interface for managing a device. The kernel uses the interface
    to request the driver to manipulate its I/O operations. Alternatively, you can
    view a device driver as an abstract data type that creates a common function interface
    to every hardware device in the computer.


    As mentioned in Part 1, Section 6, the kernel references a device driver by a
    major number and a minor number. The major number normally identifies the class
    of devices that the driver can manage. The Linux community has agreed on a set
    of major numbers for device classes that are typically supported. For example,
    floppy disks have a major number of 2, IDE hard disks have a major number of 3,
    and parallel ports have a major number of 6. The file include/linux/major.h provides
    the full list of major numbers for the release of Linux which you are working.


    The minor number is an 8-bit number that references a specific class (major number).
    Thus two floppy disks on a machine would have a major number of 2, with the first
    disk having a minor number of 0 and the second minor number of 1.


    The kernel must be informed of the device''s existence. When booted, the kernel
    creates a special file for each device in the system. A special file is an entry
    in /dev for the device that will be used to identify the driver for it. This can
    be done with the mknod command:


    ```

    mknod /dev/<dev_name><type><major_number><minor_number>

    ```


    The <dev_name> parameter is the special file''s name (you can view the list of
    special files in the /dev directory). The <type> is c for character device and
    b for a block device. The <major_number> and <minor_number> are the device''s
    major number and minor numbers, respectively.


    The interface to a device is intended to look the same as an interface to the
    file system. Recall from Part 1, Section 7 that each file system defines a fixed
