  md: '# File I/O


    # twelve


    **Exercise Goal:** You will learn how the Linux file manager reads and writes
    files and then modify the file manager that you created in Exercise 11. In that
    exercise, you learned to read, interpret, and modify the FAT and directory information
    on an MS-DOS floppy disk. However, you were not required to allocate new sectors
    to a file (or otherwise write to the disk except to change the FAT). In this exercise,
    you will add functions to your file manager to make directories, to copy files,
    and to read and write files using buffers. You again will be using the system
    call interface to the floppy disk driver to read and write sectors on the disk
    surface.


    # Introduction


    In Linux (and MS-DOS), a *file* is a named, linear sequence of bytes that is stored
    on a persistent storage device (such as a disk, a CD-ROM, or a tape). Directory
    operations (defined in `struct inode_operations`) are used to manipulate the file
    hierarchy. You implemented a few fundamental operations in Exercise 11. The file
    manager also must provide functions so that processes can manipulate the information
    that is stored *inside* of a file—essentially, the functions that allow the process
    to read and write a file. Your first goal in this exercise is to learn to read
    and write a file. Then you can provide additional directory operations (these
    require you to rewrite a directory file).


    The system calls for performing file I/O operations are defined by the `file_operations`
    functions (see Exercise 11). These functions enable a user'
