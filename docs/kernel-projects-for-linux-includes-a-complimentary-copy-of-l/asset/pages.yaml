    \ Dick has three, and Harry has six. Fair-share scheduling calls for ten runnable\
    \ processes and instead of each process getting 10% of the CPU cycles, the three\
    \ groups each get one-third of the CPU cycles to allocate to the processes that\
    \ they own. Tom's process would get 33% of the available CPU cycles, each of Dick's\
    \ processes would get about 11% of the available CPU cycles, and Harry's six processes\
    \ would get about 5.5% of the CPU cycles. If Betty belonged to Dick's group and\
    \ she logged in to the machine and created two more processes, Tom's group would\
    \ have one process but still receive one-third of the CPU cycles. Dick and Betty\
    \ would have five processes and would be allocated one-third of the CPU cycles,\
    \ distributed equally among the five processes, with each receiving about 6.7%\
    \ of the total machine cycles. Each of Harry's six processes would continue to\
