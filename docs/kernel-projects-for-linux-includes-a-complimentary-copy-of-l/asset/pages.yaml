    # Exercises


    This manual''s exercises are intended to complement the materials that you learn
    in your undergraduate OS course. In the lecture part of your course, the focus
    is on concepts and issues, with side discussions on Linux, UNIX, and/or Windows
    NT. This manual''s goal is to put those theories into practice with a series of
    hands-on exercises using the Linux kernel.


    The exercises use the public distribution of the Linux source code, Version 2.2.12.
    Version 2.2.14 is included on the CD. By the time that you have completed these
    exercises, you will have studied and experimented with considerable OS software
    and will have gained a deep insight into how Linux and other modern OS are designed.


    The exercises address almost all of the aspects of the OS. Following is a summary
    of what you will do in:


    +   Exercise 1: Learn about the kernel by having you the /proc file system interface
    to read the values of various kernel variables. You will gain an intuitive understanding
    of kernel behavior and learn a valuable tool for inspecting the kernel.


    +   Exercise 2: Gain experience with programming applications that consist of
    multiple processes. While not focusing on kernel internals, it does provide prerequisite
    experience with concurrency and file descriptors.


    +   Exercise 3: Your first opportunity to inspect the Linux kernel source code.
    You will learn how interval timers are implemented in the kernel and then use
    them to profile a user program.'
