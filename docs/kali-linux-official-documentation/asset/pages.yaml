  md: '# # Install NVIDIA Drivers on Kali


    This document explains how to make use of NVIDIA video hardware and install the
    drivers on a Kali Linux system. The first step is to fully update your Kali Linux
    system and make sure you have the kernel headers installed.


    ```

    apt-get update

    apt-get install -y linux-headers-$(uname -r)

    ```


    Next, download the latest NVIDIA driver for your architecture and video card here.
    To locate your NVIDIA card model, execute the following command.


    ```

    root@kali:~# lspci | grep -i vga

    02:00.0 VGA compatible controller: NVIDIA Corporation GT218 [GeForce G210M] (rev
    a2)

    03:00.0 VGA compatible controller: NVIDIA Corporation C79 [GeForce 9400 G] (rev
    b1)

    ```


    The next step is to disable the nouveau driver. Nouveau is a open source NVIDIA
    driver project, however it lacks the 3D graphics acceleration needed to run Cuda
    pentest tools.


    ```

    sed ''s/quiet nouveau.modeset=0/g'' -i /etc/default/grub

    update-grub

    reboot

    ```


    Once the system has rebooted and you are looking at the GDM login screen, press
    CRTL+ALT+F1 in order to get'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'to a TTY, which will be a black screen with a login prompt. We need to login
    as root and stop the gdm3 service as follows.


    ```

    service gdm3 stop

    ```


    If you are on a 64-bit Kali system, you may want to install the ia32-libs package
    in order to allow the NVIDIA installer to install the 32-bit libraries, although
    this is optional. If you choose not to do it, simply select **no** when the installer
    asks if you want to install the 32-bit libraries.


    ```

    dpkg --add-architecture i386

    apt-get update

    apt-get install ia32-libs

    ```


    Assuming you downloaded the NVIDIA driver to your /root/ directory, we need to
    give it executable permissions and run it.


    ```

    chmod 755 NVIDIA-Linux-x86_64-310.44.run

    ./NVIDIA-Linux-x86_64-310.44.run

    ```


    Once the installer finishes, you should reboot your machine. Once the system boots
    back up, you may see a NVIDIA splash screen, which will indicate that the drivers
    installed correctly, however, this is not always the case. In order to check if
    the drivers are working properly, execute the following command.'
