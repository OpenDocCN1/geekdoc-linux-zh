  md: '# Generate an Updated Kali ISO


    Kali Linux allows you to generate updated ISOs of Kali using Debian live-build
    scripts on the fly. The easiest way to generate these images is from within a
    Kali Linux environment as follows.


    You will first need to install the live-build and cdebootstrap packages:


    ```

    apt-get install live-build cdebootstrap

    ```


    Next, we clone the Kali cimage Git repository as follows:


    ```

    git clone git://git.kali.org/live-build-config.git

    ```


    Now you can change to the live directory under cimage.kali.org and build your
    ISO.


    ```

    cd live-build-config

    lb clean --purge

    lb config

    lb build

    ```


    > The live build scripts allow for complete customization of Kali Linux images.
    For more information about Kali live build scripts, check out our Kali customization
    page.'
  merge: -1
  pgno: 7
