  md: '# # KALI LINUX


    The last step is to setup the .ssh/authorized_keys file so that archive.kali.org
    can trigger your mirror:


    ```

    $ mkdir -p .ssh

    $ wget -O - -q http://archive.kali.org/pushmirror.pub >>.ssh/authorized_keys

    ```


    If you have not unpacked the ftpsync.tar.gz in the home directory, then you must
    adjust accordingly the “~/ftpsync” path, which is hard-coded in .ssh/authorized_keys.
    Now you must send an email to devel@kali.org with all the URLs of your mirrors
    so that you can be added in the main list and to use your rsync access on archive.kali.org.
    Please indicate clearly who should be in contact of problems (or changes must
    be made/coordinated to your mirror setup). Instead of waiting for the first push
    archive.kali.org, you should run an initial rsync with mirror close to you, using
    the mirror list linked above to select one. Assuming you picked archive-4.kali.org,
    here''s what you can run as your dedicated mirror user:


    ```

    $ rsync -qAHH archive-4.kali.org:/srv/mirrors/kali/ &

    $ rsync -qAHH archive-4.kali.org::kali-security /srv/kali-security/ &

    $ rsync -qAHH archive-4.kali.org::kali-images /srv/mirrors/kali-images/

    ```


    # # Manual Mirror of ISO Images


    The ISO images repository does not use push mirroring so you must schedule a daily
    rsync run. We provide a bin/mirror-kali-images script, which is ready to use that
    you can add in the crontab of your dedicated user. You just have to configure
    etc/mirror-kali-images.conf.


    ```

    $ sudo su - archvsync

    $ cp etc/mirror-kali-images.conf.sample etc/mirror-kali-images.conf

    $ vim etc/mirror-kali-images.conf

    $ grep -E ''^#\'''' etc/mirror-kali-images.conf

    TO=/srv/mirrors/kali-images/

    $ crontab -e

    $ crontab -l

    # m h dom mon dow command

    ```'
