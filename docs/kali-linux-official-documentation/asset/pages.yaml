  md: '# Custom ODROID X2 U2 Image


    The following document describes our method of creating a **custom Kali Linux
    ODROID image** and is targeted at developers. If you would like to install a pre-made
    Kali ODROID image, check our [Install Kali on ODROID]() article.


    # 01. Create a Kali rootfs


    Start by building a Kali roots as described in our Kali documentation using an
    **armhf** architecture. By the end of this process, you should have a populated
    rootfs directory in `~/arm-stuff/rootfs/kali-armhf`.


    # 02. Create the Image File


    Next, we create the physical image file which will hold our ODROID rootfs and
    boot images.


    ```

    apt-get install kpartx xz-utils uboot-mkimage

    cd ~

    mmkdir -p arm-stuff

    cd arm-stuff/

    mmkdir -p images

    cd images

    dd if=/dev/zero/zero of=kali-custom-odroid.img bs=1MB count=7000

    ```


    # 03. Partition and Mount the Image File


    parted kali-custom-odroid.img --script -- mklabel mdsos

    parted kali-custom-odroid.img --script -- mkpart fat32 4096s 266239s

    parted kali-custom-odroid.img --script -- mkpart ext4 266240s 100%


    ```

    loopdevice=`loopetup -f --dev kali-custom-odroid.img`

    device=`kpartx -va $loopdevice | sed -E ''s/.*/([0-9]).*/\1/g'' | head -1`

    device=`dev/mapper/${device}`

    boot=${device}p1

    root=${device}p2

    mkfs.vfat $boot

    mkfs.ext4 -L kaliiroot $rootp

    root`

    ```'
