  md: '# Kali Linux Virtual Box Guest


    Should you decide to install Kali Linux within VirtualBox, you will need to follow
    the instructions below in order to successfully install the Linux Guest Additions
    tools.


    You must use **4.2.xx or higher** of VirtualBox in order to take advantage of
    the improvements, including compatibility updates, and enhanced stability of both
    the core application and the Guest Additions.


    # Installing VirtualBox Guest Additions in Kali Linux


    In order to have proper mouse and screen integration as well as folder sharing
    with your host system, you will need to install the VirtualBox Guest Additions.


    Once you have booted into your Kali Linux virtual machine, open a terminal window
    and issue the following command to install the Linux Kernel headers.


    ```

    apt-get update && apt-get install -y linux-headers-$(uname -r)

    ```


    Once this is complete you can now attach the Guest Additions CD-ROM. This can
    be done by selecting ''Devices'' from the VirtualBox Menu and selecting ''Install
    Guest Additions.'' This will mount the GuestAdditions iso to the virtual CD Drive
    in your Kali Linux virtual machine. When prompted to autorun the CD, click the
    Cancel button.'
  merge: -1
  pgno: 65
- img_proc: true
  md: '![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_66_0.png)


    From a terminal window, copy the VboxLinuxAdditions.run file from the Guest Additions
    CD-Rom to a path on your local system ensure it is executable and run the file
    to begin installation.


    ```

    cp /media/cd-rom/VboxLinuxAdditions.run /root/

    chmod 755 /root/VboxLinuxAdditions.run

    cd /root

    ./VboxLinuxAdditions.run

    ```'
  merge: -1
