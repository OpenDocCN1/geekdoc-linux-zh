    # Building Kali Linux for older i386 architecture


    The Kali Linux i386 ISO has PAE enabled. If you require a default kernel for older
    hardware, you need to rebuild a Kali Linux ISO. The rebuilding process is much
    the same as the above, other than the 686-pae parameter that needs to be changed
    to 486 in auto/config :


    ```

    apt-get install git live-build cdebootstrap kali-archive-keyring

    git clone git://git.kali.org/live-build-config.git

    cd live-build-config

    sed -i ''s/686-pae/486/g'' auto/config

    lb clean

    lb config --architecture i386

    lb build

    ```


    # Speeding up future builds


    If you plan to build custom ISOs often, you might want to cache kali packages
    locally for future builds. This can easily be done by installing apt-cacher-ng,
    and configuring the http_proxy environment variable before every build.


    ```

    apt-get install apt-cacher-ng

    /etc/init.d/apt-cacher-ng start

    export http_proxy=http://localhost:3142/

    .... # setup and configure your live build

    ```'
