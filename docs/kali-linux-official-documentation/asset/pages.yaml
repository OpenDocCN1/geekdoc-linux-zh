    If you are running a 64 bit Kali Linux system, add i386 architecture support to
    your development environment as follows.


    ```

    dpkg --add-architecture i386

    apt-get update

    apt-get install ia32-libs

    ```


    # Download Linaro Toolchain


    Download the Linaro cross-compiler from our Git repository.


    ```

    cd ~~

    mkdir -p arm-stuff/kernel/toolchains

    ```'
