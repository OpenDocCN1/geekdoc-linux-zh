  md: '# 06. Kali Linux ARM Architecture


    Install Kali ARM on an EfikaMX


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_77_0.png)


    The EfikaMX is a low end, low cost ARM computer. Despite its less-than-stellar
    specifications, its affordability makes it an excellent option for a tiny Linux
    system.


    # Stock Kali on EfikaMX - Easy Version


    If all you want to do is to install Kali on your EfikaMX, follow these instructions:


    +   - Get a fast 8 GB (or more) SD card. Class 10 cards are highly recommended.

    - Download the Kali Linux EfikaMX image from our downloads area.

    - Use the **dd** utility to image this file to your SD card. In our example, we
    assume the storage device is located at /dev/sdb. **Change this as needed.**


    > > Alert! This process will wipe out your SD card. If you choose the wrong storage
    device, you may wipe out your computers hard disk.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '```

    root@kali: ~ dd if=kali-1.0.3-efikamx.img of=/dev/sdb bs=512k

    ```


    This process can take a while depending on your USB storage device speed and image
    size. Once the dd operation is complete, boot up your EfikaMX with the SD card
    plugged in. You will be able to log in to Kali (root / to) and startx. That''s
    it, you''re done!


    # # Kali on EfikaMX - Long Version


    If you are a developer and want to tinker with the Kali EfikaMX image, including
    changing the kernel configuration and generally being adventurous, check out our
    Custom EfikaMX Image article.'
