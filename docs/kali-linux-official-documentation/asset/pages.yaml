  md: '5. Once the process is complete, mount your persistence USB partition using
    the following commands:


    ```

    mkdir /mnt/usb

    mount /dev/sdb2 /mnt/usb

    echo "/union" >> /mnt/usb/persistence.conf

    umount /mnt/usb

    ```


    6. Plug the USB stick into the computer you want to boot up. Make sure your BIOS
    is set to boot from your USB device. When the Kali Linux boot screen is displayed,
    select “Live boot” from the menu (don''t press enter), and press the tab button.
    This will allow you to edit the boot parameters. Add the word “persistence” to
    the end of the boot parameter line each time you want to mount your persistent
