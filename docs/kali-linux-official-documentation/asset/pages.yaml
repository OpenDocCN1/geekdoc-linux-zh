    # Ensure the Origin of the SHA1SUMS File


    Before verifying the checksums of the image, you must ensure that the SHA1UMS
    file is the one generated by Kali. That''s why the file is signed by Kali''s official
    key with a detached signature in SHA1SUMS.gpg. Kali''s official key can be downloaded
    in one of two ways:


    ```

    $ wget -q O - http://archive.kali.org/archive-key.asc | gpg --import

    #

    $ gpg --keyserver subkeys.pgp --recv-key 44C6513A8E4FB3D037F758ED44FF07D8D0BF6

    ```


    Once you have downloaded both SHA1SUMS and SHA1SUMS.gpg, you can verify the signature
    as:


    ```

    $ gpg --verify SHA1SUMS.gpg SHA1SUMS

    gpg: Signature made Thu Mar 7 21:26:40 2013 CET using RSA key ID 7D8D0BF6

    gpg: Good signature from "Kali Linux Repository <devel@kali.org>"

    ```


    If you don''t get "Good signature" message or if the key ID doesn''t match, you
    should stop the process and review whether you downloaded the images from a legitimate
    Kali mirror. If the SHA1UMS file is the one provided by Kali, you can verify that
    the downloaded image has the required checksum. You can either generate the checksum
    and a manual comparison with what''s listed in SHA1UMS or use a tool that knows
    how to verify these checksums. **TODO: explain how to use GPG on OS X and Windows.
    See https://www.torproject.org/docs/verifying-signatures.html.en for inspiration.


    # Verifying SHA1 Checksums on Linux


    With a manual comparison:


    ```

    $ shasum kali-linux-1.0-i386.iso

    796e32f51d1bf51e838499c32c71a1c92cc052 kali-linux-1.0-i386.iso

    $ grep kali-linux-1.0-i386.iso SHA1SUMS

    796e32f51d1bf51e838499c32c71a1c952cc052 kali-linux-1.0-i386.iso

    ```'
