  md: '# KALI LINUX


    # 03. Installing Kali Linux


    # Kali Linux Hard Disk Install


    # Kali Linux Installation Requirements


    Installing Kali Linux on your computer is an easy process. First, you''ll need
    compatible computer hardware. Kali Linux is supported on i386, amd64, and ARM
    (both arm and armhf) platforms. The hardware requirements are minimal as listed
    below, although better hardware will naturally provide better performance. The
    i386 have a default PAE kernel, so you can run on systems with over 4GB of RAM.
    Download Kali Linux and either burn the ISO to, or prepare a USB stick with Kali
    Linux Live as the installation medium. If you do not have a DVD drive or USB port
    on your computer, check out the Kali Linux Network Install.


    # Installation Prerequisites


    +   - A minimum of 8 GB disk space for the Kali Linux install.

    - For i386 and amd64 architectures, a minimum of 512MB RAM.

    - CD-DVD Drive / USB boot support


    # Preparing for the Installation


    +   1. Download Kali linux.

    2. Burn The Kali Linux ISO to DVD or Image Kali Linux Live to USB.

    3. Ensure that your computer is set to boot from CD / USB in your BIOS.


    # Kali Linux Installation Procedure


    +   1. To start your installation, boot with your chosen installation medium.
    You should be greeted with the Kali Boot screen. Choose either *Graphical* or
    *Text-Mode* install. In this example, we chose a GUI install.'
