- img_proc: true
  md: '# Penetration Testing Tools Policy


    # Kali Linux Tools Policy


    We realize that there are many tools or scripts that can do the same job. Some
    are better than others, some are just a matter of personal preference. With this
    mind, keeping an updated, useful penetration testing tool repository is a challenging
    task. The Kali Development team uses some of the following litmus tests to determine
    whether a specific tool should be included in the Distribution.


    +   - Is the tool useful / functional in a Penetration Testing environment?

    - Does the tool contain functionality of other existing tools?

    - Does the licensing of the tool allow for free re-distribution?

    - How much resources does the tool require? Will it work in a "standard" environment?


    Depending on the answers to these questions, and other considerations, we then
    decide if the tool should be marked for inclusion in Kali.


    The majority of the members of the Kali development team are penetration testers,
    and thus we rely on our combined experience to choose the best tools that add
    the most value to the Kali distribution, while taking in other considerations
    as well. Tools which are specifically aimed at DOS, DDOS or anonymity are rarely
    used in legitimate engagements, and are therefore not installed by default in
    Kali Linux.


    # New Tool Requests


    We are always open to adding new and better tools to our distribution, however
    a valid case must be made for each tool. Please put some thought and effort into
    the tool submission and not just send the developers a one line request. Submissions
    for new tool requests can be made through our Kali Linux bug tracker.'
  merge: -1
