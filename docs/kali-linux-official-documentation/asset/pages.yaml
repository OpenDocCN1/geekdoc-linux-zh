  md: 'Chroot into the rootfs and create an initrd. Make sure to use the correct kernel
    version/extraversion for the mknititramfs command. In our case, it is “3.8.13”.


    ```

    LANG=C chroot ~/arm-stuff/images/root/\apt-get install initramfs-tools uboot-mkimage

    cd /

    # Change the example "3.8.13" to your current odroid kernel revision

    mkinitramfs -c lzma -o .initramfs 3.8.13

    mkimage -A -O linux -T ramdisk -C none -a 0 -e 0 -n initramfs -d /initramfs /ulnitrd

    rm initramfs

    exit

    ```


    # 06. Prepare the Boot Partition


    Copy the kernel and generated initrd file to the mounted boot partition as shown
    below.


    ```

    mv ~/arm-stuff/images/root/ulnitrd ~/arm-stuff/images/boot/

    cp arch/arm/boot/zImage ~/arm-stuff/images/boot/

    ```


    Dump a boot.txt file, which contains required boot parameters for the ODROID in
    the boot partition.


    ```

    cat << EOF > ~/arm-stuff/images/boot/boot.txt

    setenv initrd_high "0xffffff"

    setenv fdt_high "0xffffff"

    setenv bootcmd "fatload mmc 0:1 0x40008000 zImage; fatload mmc 0:1 0x42000000
    ulnitrd; bootm 0x40008000 0x42000000"

    setenv bootargs "console=tty1=ttySAC,115200n8 root=LABEL=kaliroot rootwaitt

    mem=2047M"

    ```'
