  md: '# VMware Tools in a Kali Guest


    Should you decide to create your own VMware installation of Kali Linux rather
    than our pre-made VMware images, you will need to follow the instructions below
    in order to successfully install VMware Tools in your Kali installation. You can
    opt to install open-vm-tools, or the native VMware tools.


    # Installing open-vm-tools


    This is probably the easiest way to get “VMware tools” functionality inside a
    kali VMware guest.


    ```

    apt-get install open-vm-tools

    ```


    # Installing VMware Tools in Kali


    If open-vm-tools does not work for you, or if you prefer using native VMware tools,
    begin by installing some packages that are required by the VMware Tools installer:


    ```

    echo cups enabled >> /usr/sbin/update-rc.cd

    echo vmware-tools enabled >> /usr/sbin/update-rc.cd


    apt-get install gcc make linux-headers-$(uname -r)

    in -s /usr/src/linux-headers-$(uname -r)/include/generated/uapi/linux/version.h
    /usr/src/linux-headers-$(uname -r)/include/

    ```


    Next, mount the VMware Tools ISO by clicking “Install VMware Tools” from the appropriate
    menu. Once the VMware Tools ISO has been attached to the virtual machine, we mount
    the drive and copy the VMware Tools installer to /tmp/.


    ```

    mkdir /mnt/vmware

    ```'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# KALI LINUX


    Official Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    mount /dev/cdrom/mnt/vmware/

    cp -rf /mnt/vmware/VMwareTools* /tmp/


    Finally, change directory to /tmp/, extract the tarball and start the installer:


    ```

    cd /tmp/

    tar zxpf VMwareTools-*.tar.gz

    cd vmware-tools-distrib/

    ./vmware-tools-install.pl

    ```


    Follow the prompts for the VMware Tools installation and you are done.


    # Slow Mouse Movement in VMware


    If your mouse movement is slow and sluggish in a Kali Linux VMware guest, try
    installingthe**xserver-xorg-input-vmmouse** package in the Kali guest.


    ```

    apt-get install xserver-xorg-input-vmmouse

    reboot

    ```


    # VMware Tools Won''t Compile!


    This is an unfortunate reality that has plagued us, as Kali Linux uses a bleeding
    edge kernel which is not always supported by VMware. On occasion, it might be
    required to search for “upstream compatibility VMware Tools patches” from the
    [VMware community].'
