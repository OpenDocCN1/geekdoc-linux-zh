  md: '# 10. Kali Linux Policies


    # Kali''s Relationship With Debian


    Kali Linux 1.0 is a Debian derivative based on Debian Whezy. Therefore, most of
    the Kali packages are imported unmodified from the Debian repositories. In some
    cases, never packages got imported from Unstable or Experimental, either because
    it improved the user experience, or because it was required to fix some bugs.


    # Forked Packages


    Some packages obviously had to be forked in order to implement some of the Kali-specific
    features but Kali strives to keep that number of packages to a minimum by importing
    the upstream packages when possible (either by integrating the feature directly,
    or by adding the required hooks so that it''s trivial to enable it without actually
    modifying the upstream packages).


    Each package forked by Kali is maintained in a Git repository with a "debian"
    branch so that updating a forked package can be easily done with a simple *merge
    debian* in the master branch.


    # New Packages


    On top of this, Kali brings many new Debian packages, which are specific to the
    penetration testing and security auditing field. A large percentage of these packages
    are free according to Debian’s Free Software Guidelines and Kali intends to contribute
    those to Debian and maintain them directly within Debian.


    As a consequence of this, Kali packages strive to be compliant with the Debian
    Policy and follow the best practices in use in Debian.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Kali Linux Open Source Policy


    Kali Linux is a Linux distribution that aggregates thousands of free software
    packages in its main section. As a Debian derivative, all of the software complies
    with the Debian Free Software Guidelines.


    As an exception to the above, Kali Linux''s non-free section contains several
    tools which are not open source, but allowed for redistribution by Offensive Security
    through default licensing or specific license agreements with said vendors. If
    you want to build a Kali derivative, you should review the license of each Kali-specific
    non-free package before including it in your distribution (non-free packages which
    are imported from Debian are safe to redistribute).


    More importantly, all of the specific developments that Kali made for its infrastructure
    or to integrate the provided software have been put under the GNU GPL.


    If you want more information about the license of any given piece of software,
    you can either check debian/copyright in the source package or /usr/share/doc/package/copyright
    for a package that you have already installed.'
