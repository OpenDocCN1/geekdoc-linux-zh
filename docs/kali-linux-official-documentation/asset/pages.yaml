  md: '# # Kali Linux Live USB Install


    Booting and installing Kali from a USB stick is our favorite and fastest method
    of getting up and running. In order to do this, we first need to create the Kali
    ISO image on a USB drive. If you would like to add persistence to your Kali Linux
    USB stick, please read the full document before proceeding to create your image.


    # ## Preparing for the USB copy


    +   1. [Download Kali linux](https://www.kali.org/get-kali/).

    2. If running Windows, download [Win32 Disk Imager](https://projects.sourceforge.net//).

    3. No special software is needed for a *nix OS.

    4. A USB Key (at least 2GB capacity).


    # ## Kali Linux Live USB Install Procedure


    # ### Imaging Kali on a Windows Machine


    +   1. Plug your USB stick into your Windows port and launch the Win32 Disk Imager
    software

    2. Choose the Kali Linux ISO file to be imaged and verify that the USB drive to
    be overwritten is the correct one.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# # KALI LINUX


    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_34_0.png)


    +   3. Once the imaging is complete, safely eject the USB drive from the Windows
    machine. You can now use the USB device to boot into Kali Linux.


    # ## Imaging Kali on a Linux Machine


    Creating a bootable Kali Linux USB key in a Linux environment is easy. Once you''ve
    downloaded your Kali ISO file, you can use dd to copy it over to your USB stick
    as follows:


    > > WARNING. Although the process of imaging Kali on a USB stick is very easy,
    you can just easily destroy arbitrary partitions with dd if you do not understand
    what you are doing. Consider yourself warned.


    +   1. Plug in your USB device to your Linux computer''s USB port.

    2. Verify the device path of your USB storage with dmesg.

    3. Proceed to (carefully!) image the Kali ISO file on the USB device:


    ```

    dd if=kali.iso of=/dev/sdb bs=512k

    ```'
  merge: -1
