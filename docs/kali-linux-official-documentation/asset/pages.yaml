    # ## 2nd Stage chroot


    This is where we configure base image settings such as keymaps, repositories,
    default network interface behavior (change if needed), etc.


    ```

    cd ~/arm-stuff/roots

    LANG=C chroot kali-$architecture/debootstrap/debootstrap --second-stage


    cat << EOF > kali-$architecture/etc/apt/sources.list

    deb http://http.kali.org/kali kali main contrib non-free

    deb http://security.kali.org/kali-security/updates main contrib non-free

    EOF


    echo "kali" > kali-$architecture/etc/hostname


    cat << EOF > kali-$architecture/etc/network/interfaces

    auto lo

    iface lo inet loopback

    auto eth0

    iface eth0 inet dhcp

    EOF


    cat << EOF > kali-$architecture/etc/resolv.conf

    nameserver 8.8.8.8

    EOF

    ```


