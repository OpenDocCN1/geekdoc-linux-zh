  md: '# # Kali Linux Community Forums


    Kali Linux has official community-driven forums located at forums.kali.org


    We welcome everyone to the Kali Linux community and we have outlined a few simple
    rules below. Please take a few moments to review them before joining the forums.


    # ## Forum Rules


    +   * By registering with our forums you agree to be bound by the following rules.

    * We do not condone any illegal activity at all.

    * Any advice/information offered in the forums is to be used for the legal informational/professional/educational
    purposes for which it is intended.

    * New registrations will be moderated first, causing a slight delay in the post
    appearing – DO NOT report problems with your post not appearing instantly during
    your first 3 days of membership.

    * Use sensible titles for your posts – not titles as “Please Help!!” or “Need
    Assistance” or “What Am I Doing Wrong?” etc

    * Do not cross-post – 1 in the relevant area is enough!

    * Search for previous postings before creating a new thread. If you create a new
    thread asking something that has already been asked, don''t be surprised if the
    thread gets deleted without notice.

    * Do not post about breaking into networks that do not belong to you and for which
    you have no permissions.

    * Any religious, political, or pornographic references will not be tolerated.

