  md: '# 05. Kali Linux General Use


    # Kali Linux sources.list repositories


    We''ve seen many people break their Kali Linux installations by following unofficial
    advice, or arbitrarily populating their sources.list file with unneeded repositories.
    The following post aims to clarify what repositories should exist in sources.list,
    and when they should be used.


    Any additional repositories added to the Kali sources.list file will most likely
    BREAK YOUR KALI LINUX INSTALL.


    # Regular repositories


    On a standard, clean install of Kali Linux, you should have the following two
    entries present:


    ```

    deb http://http.kali.org/kali kali main non-free contrib

    deb http://security.kali.org/kali-security kali/updates main non-free

    ```


    # Source repositories


    In case you require source packages, you might also want to add the following
    repositories as well:


    ```

    deb-src http://http.kali.org/kali kali main non-free contrib

    deb-src http://security.kali.org/kali-security kali/updates main non-free

    ```


    # Bleeding Edge repositories


    If you have a need for bleeding edge repositories, you can add the following entry.
    Do not add this repo “for the heck of it” - it’s “bleeding edge” for a reason.
    Packages in this repository are NOT manually maintained (they are auto-generated),
    and are low priority in general.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '```

    deb http://repo.kali.org/kali kali-bleeding-edge main

    #deb-src http://repo.kali.org/kali kali-bleeding-edge main

    ```'
  merge: -1
