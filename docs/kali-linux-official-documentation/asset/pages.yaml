  md: '# Preparing a Kali Linux ARM chroot


    Although you can download Kali ARM images from our Download area, some prefer
    building their own updated bootstrapped rootfs. The following procedure shows
    an example of building a Kaliarmhf rootfs. Change to armel if needed.


    # Install Required Tools and Dependencies


    ```

    apt-get debootstrap qemu-user-static

    ```


    # Define Architecture and Custom Packages


    This is where you define some environment variables for your required ARM architecture
    (armel vs armhf) and list the packages to be installed in your image. These will
    be used throughout this article, so make sure to modify them to your needs.


    ```

    export packages="xfce4 kali-menu wpasupplicant kali-defaults initramfs-tools uboot-mkimage
    nmap openssh-server"

    export architecture="armhf"

    ```


    # Build the Kali rootfs


    We create a standard directory structure and bootstrap ARM rootfs from the Kali
    Linux repositories. We then copy over qemu-arm-static from our host machine into
    the rootfs in order to initiate the 2nd stage chroot.


    ```

    cd ~

    mkdir -p arm-stuff

    cd arm-stuff/

    mkdir -p kernel

    mkdir -p rootfs

    cd rootfs

    ```'
