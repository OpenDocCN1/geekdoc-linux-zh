  md: '# Official Kali Linux Mirrors


    # Using Official Repositories


    Kali provides three repositories, which are mirrored world-wide:


    +   - kali.org (mirrorlist): the main package repository;

    - security.kali.org (mirrorlist): the security package repository;

    - cdimage.kali.org (mirrorlist): the repository with ISO images.


    When you use the above 3 hosts, you''ll be automatically redirected to a mirror
    close to you, which is guaranteed to be up-to-date. If you prefer to manually
    select a mirror, click on the *mirrorlist* link near each hostname and select
    a mirror that suits you.


    # Setting Up a Kali Linux Mirror


    # Requirements


    To be an official Kali Linux mirror, you need a server with lots of disk space,
    good bandwidth, rsync, and an SSH server. As of 2013-03-14, the main package repository
    is about 160 GB and the ISO images repository is about 10 GB but you can expect
    these numbers to grow regularly. You are expected to make the files available
    over HTTP and RSYNC so you will need the corresponding services too. FTP access
    is optional.


    # Push Mirroring of Package Archives


    The mirroring infrastructure uses SSH-based triggers to ping the mirrors when
    they need to be refreshed. This currently takes place 4 times a day.


    If you don''t have yet an account dedicated for the mirrors, create such an account
    (here we call it "archvsync"):


    ```

    $ sudo adduser --disabled-password archvsync

    Adding user ''archvsync'' ...n[...

    Is the information correct? [Y/n]

    ```'
