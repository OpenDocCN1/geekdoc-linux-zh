    # ARM Cross-Compilation


    The following guide will demonstrate how to set up an ARM cross-compilation environment
    in Kali Linux. This guide is the starting point for many of our contributed “Custom
    ARM Images” articles.


    # Setting Up Your Development Box


    Compiling kernels and generating images usually comes at the cost of disk space.
    Make sure you have at least 50 GB of disk space available on your Kali development
    machine as well as ample RAM and CPU juice.


    # Install Dependencies


    Start off by installing the required dependencies for ARM cross-compilation.


    ```

    apt-get install git-core gnupg bison gperf libbsd0-dev build-essential \

    zip curl libncurses5-dev zlib1g-dev libncurses5-dev gcc-multilib g++-multilib

