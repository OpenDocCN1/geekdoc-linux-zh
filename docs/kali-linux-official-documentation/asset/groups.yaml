    # # Install NVIDIA Drivers on Kali


    This document explains how to make use of NVIDIA video hardware and install the
    drivers on a Kali Linux system. The first step is to fully update your Kali Linux
    system and make sure you have the kernel headers installed.


    ```

    apt-get update

    apt-get install -y linux-headers-$(uname -r)

    ```


    Next, download the latest NVIDIA driver for your architecture and video card here.
    To locate your NVIDIA card model, execute the following command.


    ```

    root@kali:~# lspci | grep -i vga

    02:00.0 VGA compatible controller: NVIDIA Corporation GT218 [GeForce G210M] (rev
    a2)

    03:00.0 VGA compatible controller: NVIDIA Corporation C79 [GeForce 9400 G] (rev
    b1)

    ```


    The next step is to disable the nouveau driver. Nouveau is a open source NVIDIA
    driver project, however it lacks the 3D graphics acceleration needed to run Cuda
    pentest tools.


    ```

    sed ''s/quiet nouveau.modeset=0/g'' -i /etc/default/grub

    update-grub

    reboot

    ```


    Once the system has rebooted and you are looking at the GDM login screen, press
    CRTL+ALT+F1 in order to get'
- md: '

    to a TTY, which will be a black screen with a login prompt. We need to login as
    root and stop the gdm3 service as follows.


    ```

    service gdm3 stop

