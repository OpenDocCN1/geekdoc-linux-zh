    # Change the example "3.8.13" to your current odroid kernel revision

    mkinitramfs -c lzma -o .initramfs 3.8.13

    mkimage -A -O linux -T ramdisk -C none -a 0 -e 0 -n initramfs -d /initramfs /ulnitrd

    rm initramfs

    exit

    ```


    # 06. Prepare the Boot Partition


    Copy the kernel and generated initrd file to the mounted boot partition as shown
    below.


    ```

    mv ~/arm-stuff/images/root/ulnitrd ~/arm-stuff/images/boot/

    cp arch/arm/boot/zImage ~/arm-stuff/images/boot/

    ```


    Dump a boot.txt file, which contains required boot parameters for the ODROID in
    the boot partition.


    ```

    cat << EOF > ~/arm-stuff/images/boot/boot.txt

    setenv initrd_high "0xffffff"

    setenv fdt_high "0xffffff"

    setenv bootcmd "fatload mmc 0:1 0x40008000 zImage; fatload mmc 0:1 0x42000000
    uinitrd; bootm 0x40008000 0x42000000"

    setenv bootargs "console=tty1=ttySAC,115200n8 root=LABEL=kaliroot rootwaitmem=2047M"

    boot

    EOF

    ```


    Generate a **boot.scr** file, which is required to boot the ODROID.


    ```

    mkimage -A arm -T script -C none "Boot.scr for ODROID" -d ~/arm-stuff/images/boot/boot.txt

    ~/arm-stuff/images/boot.scr

    ```


    Unmount the root and boot partitions, then ummount the loop device.


    ```

    cd ~/arm-stuff/images/

    umount $bootp

    umount $rootp

    kpartx -dv $loopdevice


    wget http://www.mdrjet.net/odroid/mirror/old-releases/BSPs/Alpha4/unpacked/boot.tar.gz

    tar xzf boot.tar.gz

    cd boot

    sh setup.sh $loopdevice

    cd ..


    umount -d $loopdevice

    ```


    Now, image the file onto your storage device. Our device is **/dev/sdb**. Change
    this as needed.


    ```

    dd if=kali-custom-odroid.img of=/dev/sdb bs=1M

    ```


