    # ARM 交叉编译


    本指南将演示如何在 Kali Linux 中设置 ARM 交叉编译环境。该指南是我们许多“自定义 ARM 镜像”文章的起点。


    # 设置你的开发机


    编译内核和生成镜像通常是以磁盘空间为代价的。确保你的 Kali 开发机器上有至少 50 GB 的可用空间，以及足够的内存和 CPU 性能。


    # 安装依赖项


    首先安装 ARM 交叉编译所需的依赖项。


    ```

