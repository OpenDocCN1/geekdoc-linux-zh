  mdcn: "\n对于希望密切关注 Kali Linux 进展的用户，或想要知道何时应该运行 `apt-get upgrade` 的人员，我们的 Git 仓库树供公开查阅。\n\
    \n## 社交媒体\n\n- twitter\n- facebook\n\n我们不经常发推文，但当我们发布时，它是非常重要的。发布信息和博客文章将推送到我们的\
    \ twitter 账号 @KaliLinux。\n\n与我们的 Twitter 账号一样，我们不会在 Kali Facebook 页面上向你推送大量信息，但当我们发布时，它是非常值得的。\n\
    \n## Kali Linux 错误跟踪器\n\nKali Linux 有一个官方的错误跟踪器，我们的用户可以在向开发者提交漏洞和/或修复，并建议将新工具纳入发行版。任何人都可以注册该网站，但我们要求您审阅以下规则，以确保以正确的信息和正确的格式正确提交漏洞。\n\
    \n- 错误跟踪器**不是**用于支持问题的。\n- 使用真实的电子邮件地址，以便在我们需要进一步说明时可以联系您。\n- 提供一个具有描述性的主题。\n\
    - 提供尽可能详细的信息，包括控制台输出、架构类型和确切版本。\n- 工具请求必须附带 URL 以及添加该工具的理由。\n- 不要将您的漏洞分配给任何人。开发者将决定由谁分配工单。\n\
    \n## Kali Linux 社区论坛\n\nKali Linux 拥有官方的社区驱动论坛，位于 forums.kali.org\n\n我们欢迎每个人加入\
    \ Kali Linux 社区，我们在下方列出了几条简单的规则。请在加入论坛之前花几分钟审阅这些规则。\n\n### 论坛规则\n\n- 注册我们的论坛即表示您同意受以下规则的约束。\n\
    - 我们完全不容忍任何非法活动。\n- 论坛中提供的任何建议/信息都应用于其预期的法律信息/专业/教育目的。\n- 新注册将首先经过审核，这会导致帖子出现有轻微延迟——在入会的前\
    \ 3 天内，**请勿**报告您的帖子未立即出现的问题。\n- 为您的帖子使用合理的标题——不要使用如“请帮帮我!!”或“需要帮助”或“我哪里做错了？”之类的标题。\n\
    - 不要跨区域发布——在相关区域发布一次就足够了！\n- 在创建新线程之前请搜索之前的帖子。如果您创建的新线程询问了已经问过的问题，如果线程在未通知的情况下被删除，请不要感到惊讶。\n\
    - 不要发布关于破解不属于您且您没有权限的网络的帖子。\n- 任何宗教、政治或色情引用将不被容忍。\n- 这里不需要像“噢！看！！我破解了邻居的无线 AP”或“我如何黑入网络？”之类的帖子。\n\
    - 请不要骚扰垃圾信息——它们将被移除/移动/编辑/删除，并且您将被封禁。\n- 成员签名**不得包含**任何形式的 URL 链接。\n- 我们不会忍忍辱性的、种族主义的任何其他贬性言论，或成员表现得像自封管理员。论坛工作人员在这里为您提供帮助。请使用他们的服务。如果**任何**成员对论坛内**任何**帖子的内容有意见，请使用“报告此帖子”（REPORT\
    \ THIS POST）按钮——在默认论坛主题下是红色三角形图标，在 Blackberry 论坛主题下是星号图标，位于帖子的右上角。\n- 违反论坛规则可能会导致违规处罚，从失去发布权限到临时或永久封禁不等。\n\
    - 这些规则可能会更改和/增加。了解任何更改是您的责任。\n\n## 10. Kali Linux 策略\n\n### Kali 与 Debian 的关系\n\
    \nKali Linux 1.0 是基于 Debian Whezy 的 Debian 衍生版。因此，大多数 Kali 包是从 Debian 仓库中未经修改地导入的。在某些情况下，某些包从未从\
    \ Unstable（不稳定版）或 Experimental（实验版）导入，是因为它们改进了用户体验，或者因为需要修复某些漏洞。\n\n### 分支包 (Forked\
    \ Packages)\n\n某些包显然必须分支以实现某些 Kali 特有的功能，但 Kali 努力通过尽可能导入上游包来将此类包的数量减少到最低（通过直接集成功能，或添加所需的钩子，以便在不实际修改上游包的情况下轻松启用它）。\n\
    \n Kali 分支的每个包都维护在一个带有“debian”分支的 Git 仓库中，这样通过在 master 分支中执行简单的 *merge debian*\
    \ 就可以轻松更新分支包。\n\n### 新包\n\n除此之外，Kali 还引入了许多新的 Debian 包，这些包专门针对渗透测试和安全审计领域。这些包中很大一部分根据\
    \ Debian 的自由软件指南是免费的，Kali 打算将它们贡献给 Debian 并在 Debian 内部直接维护。\n\n因此，Kali 包力求符合 Debian\
    \ 策略并遵循 Debian 中使用的最佳实践。\n\n### Kali Linux 开源策略\n\nKali Linux 是一个在其实际部分汇总了数千个免费软件包的\
    \ Linux 发行版。作为 Debian 的衍生版，所有软件都符合 Debian 自由软件指南。\n\n作为上述异常，Kali Linux 的非免费部分包含几个不是开源的工具，但\
    \ Offensive Security 通过默认许可或与此类供应商的特定许可协议允许重新分发。如果您想构建 Kali 衍生版，应在将其纳入您的发行版之前，审阅每个\
    \ Kali 特有的非免费包的许可证（从 Debian 导入的非免费包是可以安全重新分发的）。\n\n重要的是，Kali 为其基础设施或集成提供的软件而进行的所有特定开发都已……\n\
    \n*(注：原文后续存在大量 OCR 重复，译文已提取唯一内容。)*\n"
