    # Kali Linux Trademark Policy


    Kali Linux and Offensive Security want to promote the widespread recognition of
    our trademarks among the Internet community however, we also need to ensure our
    trademarks solely identify our company and our products. At the heart of our trademark
    policy is trust - we want to avoid the public from being confused believing they
    are dealing with Kali Linux and/or Offensive Security when, in fact, they are
    not. This is of particular importance with regards to the development and distribution
    of trusted penetration testing distribution such as Kali Linux.


    This document identifies and describes our trademarks and provides guidance as
    to their fair use. We are generally quite accommodating when it comes to fair
    and honest use of our trademarks so if you are so inclined, feel free to contact
