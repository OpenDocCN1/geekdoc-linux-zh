    # Install Kali ARM on a Raspberry Pi


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_92_0.png)


    # Raspberry Pi


    The Raspberry Pi is a low end, low cost ARM computer. Despite its less-than-stellar
    specifications, affordability makes it an excellent option for a tiny Linux system
    and it can do far more than act as a media PC.


    # Stock Kali on Raspberry Pi - Easy Version


    If all you want to do is to install Kali on your Raspberry Pi, follow these instructions:


    - Get a nice 8 GB (or more) SD card. Class 10 cards are highly recommended.

    - Download the Kali Linux Raspberry Pi image from downloads area.

    - Use the dd utility to image your file to your SD card. In our example, we assume
    the storage device is located at /dev/sdb. Change this as needed.


    > Alert! This process will wipe out your SD card. If you choose the wrong storage
    device, you may wipe out your computers hard disk.


    ```

    root@kali:~ dd if=kali-pi.img of=/dev/sdb bs=512k

    ```


    This process can take a while depending on your USB storage device speed and image
    size. Once the dd operation is complete, boot up your Raspberry Pi with the SD
    card plugged in. You will be able to log in to Kali (root / root) and startx.
    That''s it, you''re done!


    # Kali on Raspberry Pi - Long Version


    If you are a developer and want to tinker with the Kali Raspberry Pi image, including
    changing the kernel configuration and generally being adventurous, check out our
    Custom Raspberry Pi Image article.


    # Preparing a Kali Linux ARM chroot


    Although you can download Kali ARM images from our Download area, some prefer
    building their own updated bootstrapped rootfs. The following procedure shows
    an example of building a Kaliarmhf rootfs. Change to armel if needed.


    # Install Required Tools and Dependencies


    ```

    apt-get debootstrap qemu-user-static

    ```


    # Define Architecture and Custom Packages


    This is where you define some environment variables for your required ARM architecture
    (armel vs armhf) and list the packages to be installed in your image. These will
    be used throughout this article, so make sure to modify them to your needs.


    ```

    export packages="xfce4 kali-menu wpasupplicant kali-defaults initramfs-tools uboot-mkimage
    nmap openssh-server"

    export architecture="armhf"

    ```


    # Build the Kali rootfs


    We create a standard directory structure and bootstrap ARM rootfs from the Kali
    Linux repositories. We then copy over qemu-arm-static from our host machine into
    the rootfs in order to initiate the 2nd stage chroot.


    ```

    cd ~

    mkdir -p arm-stuff

    cd arm-stuff/

    mkdir -p kernel

    mkdir -p rootfs

    cd rootfs

    ```


    # KALI LINUX


    Official Linux Documentation This PDF has been autogenerated on docs.kali.org
    - Aug 19, 2013


    debootstrap --foreign --arch $architecture kali-$architecture http://archive.kali.org/kali
    cp /usr/bin/qemu-arm-static kali-$architecture/usr/bin/


    # 2nd Stage chroot


    This is where we configure base image settings such as keymaps, repositories,
    default network interface behavior (change if needed), etc.


    ```

    cd ~/arm-stuff/roots

    LANG=C chroot kali-$architecture/debootstrap/debootstrap --second-stage


    cat << EOF > kali-$architecture/etc/apt/sources.list

    deb http://http.kali.org/kali kali main contrib non-free

    deb http://security.kali.org/kali-security/updates main contrib non-free

    EOF


    echo "kali" > kali-$architecture/etc/hostname


    cat << EOF > kali-$architecture/etc/network/interfaces

    auto lo

    iface lo inet loopback

    auto eth0

    iface eth0 inet dhcp

    EOF


    cat << EOF > kali-$architecture/etc/resolv.conf

    nameserver 8.8.8.8

    EOF

    ```


    # 3rd Stage chroot


    This is where your customization comes in. Your $packages are installed and a
    default "root" root password is set as well as other configuration changes and
    fixes.


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_95_0.png)


    # KALI LINUX


    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    export MALLOC_CHECK_=0

    export LC_ALL=C

    export DEBIAN_FRONTEND=noninteractive


    mount -t proc proc /kali-$architecture/proc

    mount -o bind /dev/kali-$architecture/dev/

    mount -o bind /dev/pts /kali-$architecture/dev/pts


    ```

    cat << EOF > kali-$architecture/defconf

    console-common console-data/keymap/policy select Select keymap from full list

    console-common console-data/keymap/full select en-latin1-nodekeys

    EOF

    ```


    ```

    cat << EOF > kali-$architecture/third-stage

    #!/bin/bash

    dpkg-divert --add --local --divert /usr/sbin/invoke-rc.d.chroot --rename /usr/sbin/invoke-rc.d

    cp /bin/true /usr/sbin/invoke-rc.d

    ```


    ```

    apt-get update

    apt-get install locales-all

    locale-gen en_US.UTF-8

    ```


    ```

    debconf-selections /debconf-set

    rm -f /debconf-set

    apt-get update

    apt-get -y install git-core binutils ca-certificates initfs-tools uboot-mkimage

    apt-get -y install locales-common less nano

    echo "root:root" | chpasswd

    sed -i ''s/KERNEL=.*/ /lib/udev/rules.persistent-net.rules''

    rm -f /etc/udev/rules/persistent-net.rules

    apt-get --yes --force install $packages

    ```


    ```

    rm -f /usr/sbin/invoke-rc.d

    dpkg-divert --remove --rename /usr/sbin/invoke-rc.d

    ```


    ```

    rm /third-stage

    EOF

    ```


    ```

    chmod +x kali-$architecture/third-stage

    LANG=C chroot kali-$architecture/third-stage

    ```


    # Manual Configuration Within the chroot


    If needed, you can perform any final modifications in your rootfs by manually
    chrooting into it and making necessary changes.


    ```

    LANG=C chroot kali-$architecture

    make additional changes

    exit

    ```


    # Cleanup


    Lastly, we run a cleanup script in our chroot to free up space used by cached
    files and run any other jobs:


    ```

    cat << EOF kali-$architecture/cleanup

    #!/bin/bash

    rm -rf /root/.bash_history

    apt-get update

    apt-get clean

    rm -f cleanup

    EOF


    chmod +x kali-$architecture/cleanup

    LANG=C chroot kali-$architecture/cleanup


    umount kali-$architecture/proc

    umount kali-$architecture/dev/pts

    umount kali-$architecture/dev/


    cd ..

    ```


    Congratulations! Your custom Kali rootfs is located in the kali-$architecture
    directory. You can now tar up this directory or copy it to an image file for further
    work.


    # 07. Kali Linux Development


    ## Custom i.MX Image


    The following document describes our method of creating a custom Kali Linux i.MX
    image and is targeted at developers. If you would like to install a pre-made Kali
    image, check out our Install Kali on i.MX article.


    ## 01. Create a Kali rootfs


    Build a Kali rootfs as described in our Kali documentation, using armhf architecture.
    By the end of process, you should have a populated rootfs in ~arm-stuff/rootfs/kali-armhf.


    ## 02. Create the Image File


    Next, we create the physical image file which will hold our i.MX rootfs and boot
    images.


    ```

    apt-get install kpartx xz-utils sharutils

    cd ~

    mkdir -p arm-stuff

    cd arm-stuff/

    mkdir -p images

    cd images

    dd if=/dev/zero of=kali-custom-imx.img bs=1MB count=7000

    ```


    ## 03. Partition and Mount the Image File


    ```

    parted kali-custom-imx.img --script -- mklabel dos

    parted kali-custom-imx.img --script -- mkpart primary ext2 4096s 266239

    parted kali-custom-imx.img --script -- mkpart primary ext4 266240s 100%

    ```


    ```

    loopdevice=`losetup -f --show kali-custom-imx.img`

    ```


    ```

    device=''kpartx -va $loopdevice| sed -E ''s/.*/(loop[0-9]).*/\1/g'' | head -1''

    device=''/dev/mapper/${device}''

    boot=${device}p1

    root=${device}p2

    ```


    ```

    mkfs.ext2 $bootp

    mkfs.ext4 $rootp

    mkdir -p boot

    mkdir -p root

    mount $bootp boot

    mount $rootp root

    ```


    # 04. Copy and Modify the Kali rootfs


    ```

    rsync -HPavz /root/arm-stuff/rootfs/kali-armhf/ root

    echo "nameserver 8.8.8.8" > /root/etc/resolv.conf

    sed ''s/0-1//g'' /root/etc/init.udev

    ```


    # 05. Compile the iMX Kernel and Modules


    If you''re not using ARM hardware as the development environment, you will need
    to set up an ARM compilation environment to build an ARM kernel and modules. Once
    that''s done, proceed with the following instructions.


    ```

    cd ~/arm-stuff

    mkdir -p kernel

    cd kernel

    git clone --depth 1 https://github.com/genesi/linux-legacy.git

    cd linux-legacy

    export ARCH=arm

