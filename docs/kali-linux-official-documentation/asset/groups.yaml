    # Kali Linux Encrypted Disk Install


    At times, we have sensitive data we would prefer to encrypt using full disk encryption.
    With the Kali Installer, you can initiate an LVM encrypted install on either Hard
    Disk or USB drives. The installation procedure is similar to a "normal Kali Linux
    Install", with the exception of choosing an Encrypted LVM partition during the
    installation process.


    # Kali Linux Encrypted Installation Requirements


    Installing Kali Linux on your computer is an easy process. First, you''ll need
    compatible computer hardware. The hardware requirements are minimal as listed
    below, though better hardware will naturally provide better performance. The i386
    images have a default PAE kernel, so you can run on systems with over 4GB of RAM.
    Download Kali Linux and either burn the ISO to DVD, or prepare a USB stick with
    Kali Linux Live as the installation medium.


    # Installation Prerequisites


    +   - A minimum of 8 GB disk space for the Kali Linux install.

    - For i386 and amd64 architectures, a minimum of 512MB RAM.

    - CD-DVD Drive / USB boot support


    # Preparing for the Installation


    +   1. Download Kali linux.

    2. Burn the Kali Linux ISO to DVD or Image Kali Linux Live to USB.

    3. Ensure that your computer is set to boot from CD / USB in your BIOS.


    # Kali Linux Installation Procedure


    +   1. To start your installation, boot with your chosen installation medium.
