    \n```bash\ncd ~/arm-stuff/images\ngit clone git://github.com/raspberrypi/firmware.git\
    \ rpi-firmware\ncp -rf rpi-firmware/boot/* boot/\nrm -rf rpi-firmware\n\ncp ~/arm-stuff/kernel/tools/mkimage/kernel.img\
    \ kgdboc=ttyAMA,115200 console=ttyAMA0,115200 console=tty1\necho \"dwc_otg.enable=0\
