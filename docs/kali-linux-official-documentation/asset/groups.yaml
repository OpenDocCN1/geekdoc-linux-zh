- md: '

    # 00. Introduction to Kali Linux


    ## What is Kali Linux?


    Kali Linux is an advanced Penetration Testing and Security Auditing Linux distribution.


    ## Kali Linux Features


    Kali is a complete rebuild of BackTrack Linux, adhering completely to Debian development
    standards. All-new infrastructure has been put in place, all tools reviewed and
    packaged, and we use Git for our VCS.


    - **More than 300 penetration testing tools:** After reviewing every tool that
    was used in BackTrack, we eliminated a great number of tools that either did not
    work or had other tools available that provided similar functionality.

    - **Free and always will be:** Kali Linux, like its predecessor, is completely
    free and always will be. You will, never have to pay for Kali Linux.

    - **Open source Git tree:** We are huge proponents of open source and our development
    tree is available for all to see and all sources are available for those who wish
    to tweak and rebuild packages.

    - **FHS compliant:** Kali has been developed to adhere to the Filesystem Hierarchy
    Standard, allowing Linux users to easily locate binaries, support files, libraries,
    etc.

    - **Vast wireless device support:** We have built Kali Linux to support as many
    wireless devices as possibly can, allowing it to run properly on a wide variety
    of hardware and making it compatible with numerous USB and other wireless devices.

    - **Custom kernel patched for injection:** As penetration testers, the development
    team often needs to do wireless assessments so our kernel has the latest injections
    included.

    - **Secure development environment:** The Kali team is made up of a small group
    of trusted individuals who only commit packages and interact with the repositories
    while using multiple secure protocols.

    - **GPG signed packages and repos:** All Kali packages are signed by individual
    developer when they are built and committed and the repositories subsequently
    sign the packages as well.

    - **Multi-language:** Although pentesting tools to be written in English, we have
    ensured that Kali has true multilingual support, allowing more users to operate
    in their native language and locate the tools they need for the job.

    - **Completely customizable:** We completely understand that not everyone will
    agree with our decisions we have made it as easy as possible for our more adventurous
    users to customize Kali Linux to their liking, all the way down to the kernel.

    - **ARMEL and ARMF support:** Since ARM-based systems are becoming more and more
    prevalent and inexpensive, we knew that Kali''s ARM support would need to be as
    robust as we could manage, resulting in working installations for both ARMEL and
    ARMF systems. Kali Linux has ARM repositories integrated with the mainline distribution
    tools for ARM will be updated in conjunction with the rest of the distribution.
    Kali is currently available for the following ARM devices:


    - rk3306 mk/ss808

    - Raspberry Pi

    - ODROID U2/X2

    - Samsung Chromebook

    - EfikaMX

    - Beaglebone Black

    - CuBox

    - Galaxy Note 10.1


    Kali is specifically tailored to penetration testing and therefore, all documentation
    on this site assumes prior knowledge of the Linux operating system.


    ## KALI LINUX


    ## Should I Use Kali Linux?


    ## Differences Between Kali Linux and Debian


    Kali Linux is geared towards penetration testing and security auditing. As such,
    several core changes have been implemented in Kali Linux which reflect these needs:


    - 1. **Single user, root access by design**: Due to the nature of security audits,
    Kali linux is designed to be used in a "single, root user" scenario.

    - 2. **Network services disabled by default**: Kali Linux contains sysvinit hooks
    which disable network services by default. These hooks allow us to install various
    services on Kali Linux, ensuring that our distribution remains secure by default,
    no matter what packages are installed. Additional services such as Bluetooth are
    also blacklisted by default.

    - 3. **Custom Linux kernel**: Kali Linux uses an upstream kernel, patched for
    wireless injection.


    ## Is Kali Linux Right For You?


    As the distribution developers, one would likely expect us to recommend that everyone
    uses Kali Linux. The fact of the matter is however, that Kali is a Linux distribution
    specifically geared towards professional penetration testing and security auditing
    and as such, it is **NOT** a recommended distribution for those unfamiliar with
    Kali.


    In addition, misuse of security tools within your network, particularly without
    permission, may cause irreparable damage and result in significant consequences.


    > If you are looking for a Linux distribution to learn the basics of Linux and
    need a good starting point, Kali Linux is not the ideal distribution for you.
    You may want to begin with Ubuntu or Debian instead.


    ## KALI LINUX


    ## Kali Linux Default Passwords


    ## Kali Linux Default root Password is toor


    ## Default root Password


    During installation, Kali Linux allows users to configure a password for the *root*
    user. However, should you decide to boot the live image instead, the i386, amd64,
    VMWare and ARM images are configured with the default root password - "toor",
    without the quotes.


    ## 01. Downloading Kali Linux


    ## Download Official Kali Images


    > Alert! Always make certain you are downloading Kali Linux from official sources
    and be sure to verify the SHA1 checksums against our official values. It would
    be easy for a malicious entity to modify a Kali installation to contain malicious
    code and host it unofficially.


    ## Official Kali Linux Images


    ### ISO Files


    Kali Linux is available as a bootable ISO in both 32 and 64-bit formats.


    - Download Kali ISOs


    ### VMware Images


    Kali is available as a pre-made VMware virtual machine with VMware Tools installed.
    The VMware image is available in a 32-bit PAE format.


    - Download Kali Vware Images


    ### ARM Images


    Due to the nature of ARM architecture, it is not possible to have a single image
    that will work across all devices. We have Kali Linux images available for the
    following:


    - rk3306 mk/ss808

    - Raspberry Pi

    - ODROID U2/X2

    - Samsung Chromebook


    ## Verifying SHA1 Checksums of Downloaded Images


    When you download an image, be sure to download the SHA1SUMS and SHA1SUMS.gpg
    files that are next to the downloaded image (i.e. in the same directory on the
    server).


    ## Ensure the Origin of SHA1SUMS


    Before verifying the checksums of the image, you must ensure that the SHA1UMS
    file is the one generated by Kali. That''s why the file is signed by Kali''s official
    key with a detached signature in SHA1SUMS.gpg. Kali''s official key can be downloaded
    in one of two ways:


    ```bash

    $ wget -q O - http://archive.kali.org/archive-key.asc | gpg --import

    $ gpg --keyserver subkeys.pgp --recv-key 44C6513A8E4FB3D037F75ED44FF07D8BF6

    ```


    Once you have both SHA1SUMS and SHA1SUMS.gpg, you can verify the signature as:


    ```bash

    $ gpg --verify SHA1SUMS.gpg SHA1SUMS

    gpg: Signature made Mar 7 21:26:40 2013 using RSA key 7D8DBF6

    gpg: Good signature from "Kali Linux Repository <devel@kali.org>"

    ```


    If you don''t get "Good signature" message or if the key ID doesn''t match, you
    should stop the process and review whether you downloaded the images from a legitimate
    Kali mirror. If the SHA1UMS file is the one provided by Kali, you can verify that
    the downloaded image has the required checksum. You can either generate the checksum
    and a manual comparison with what''s listed in SHA1UMS or use a tool that knows
    how to verify these checksums.


    ## Verifying SHA1 Checksums on Linux


    With a manual comparison:


    ```bash

    $ shasum kali-linux-1.0-i386.iso

    796e32f51d1bf51e838499c32c71a1c92cc052 kali-linux-1.0-i386.iso

    $ grep kali-linux-1.0-i386.iso SHA1SUMS

    796e32f51d1bf51e838499c32c71a1c952cc052 kali-linux-1.0-i386.iso

    ```

    '
