    \ /root/arm-stuff/rootfs/kali-armel/ root\necho nameserver 8.8.8.8 > root/etc/resolv.conf\n\
    ```\n\n# 05. Compile the Raspberry Pi Kernel and Modules\n\nIf you're not using\
    \ ARM hardware as the development environment, you will need to set up an ARM\
