    Depending on your Internet connectivity speed, this could take some time. Eventually,
    you will finally be

    prompted to install GRUB to finish the installation.


    ## KALI LINUX


    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_56_0.png)


    ## Post Installation


    Now that you''ve completed installing Kali Linux, it''s time to customize your
    system. The Kali General Use section of our site has more information and you
    can also find tips on how to get the most out of Kali in our User Forums.


    ## Kali Linux Network PXE Install


    ### Setup a PXE Server


    Booting and installing Kali over the network (PXE) can be useful from a single
    laptop with no CDROM or USB ports, enterprise deployments supporting pre-seeding
    of pre-seeding.


    First, we need to install dnsmasq to provide the DHCP/TFTP.


    ```bash

    apt-get install dnsmasq

    ```


    In dnsmasq.conf, we need to define the following:


    ```bash

    dhcp-range=192.168.1.50,192.168.1.150,255.255.255.0

    dhcp-option=3,192.168.1.1

    dhcp-option=6,192.168.1.2

    ```


    After configuring, dnsmasq needs to be restarted:


    ```bash

    service dnsmasq restart

    ```

