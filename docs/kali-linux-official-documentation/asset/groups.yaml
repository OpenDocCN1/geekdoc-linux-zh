    +   - Reproducibility

    - Select Profile

    - Steps to Reproduce

    - Additional Information

    - Upload File (error logs, screenshot)


    # Decide the proper Category


    There are currently four (4) categories available in the Kali bug tracker. Before
    you begin your request ensure it is properly designated for one of the following:


    +   - General Bug

    - Kali Package Bug

