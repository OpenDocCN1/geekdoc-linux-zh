    Once rebooted, your new kernel should be running. If things go wrong and your
    kernel does not boot, you can still boot the original stock Kali kernel and fix
    your issues.'
  - '[PAGE 140]


    # 08. Troubleshooting Kali Linux


    # Submitting Bugs for Kali Linux


    # Introduction


    This document will guide a reporter on how best to present a bug report so it
    gets addressed as quickly as possible. The goal of a bug report is to enable the
    Kali Linux developers to reproduce the issue and see the failure. If the Kali
    Linux developers can make it, they will need to gather extra information until
    the root cause is known. If the Kali developers are unable to reproduce the failure,
    they will require additional information until they experience the same results
    as the submitter. Please note, submissions are best read by our team in english.


    Kali Linux was born out of labor of love to give back to the community. It is
    our drive to make things better for everyone who keeps this project evolving.
    The developers who provide support to you, are volunteers doing so out of altruism.
    Please keep this in mind when making your comments.


    Here are a few pointers that will lead to success in getting issues resolved:


    +   - You are reporting the bug because you fixed it, supply all the information
    you can.

    - Make it very clear in your submission what facts are and what are hypotheses.

    - Keep the bug report objective, just the facts needed for research.

    - Do not quote Wikipedia and other non-primary resource as fact in your submission.

    - One report, per person, per hardware combination, per bug.

    - Do not stack multiple issues into a single report, submit additional reports
    as needed.

    - Do not post comments that are unhelpful as "Me too" or "+1"

    - Do not complain about how long it takes to fix a bug.


    # How to report bugs


    The Kali Linux bug tracker can be found at http://bugs.kali.org. This document
    will guide you through account creation, creating a system profile, and how to
    submit a detailed report for submission to the bug tracker.


    # Create a Kali Linux Bug Tracker Account


    If you have not already created an account, you will need to complete this first.
    Creating the account will allow you to submit reports and continue on existing
    ones.


    On the bug tracker website, click ''Signup for new account'' to begin the process.'
