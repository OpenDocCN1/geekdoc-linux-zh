    # Kali Linux Security Update Policies


    Kali Linux is tightly woven with the Debian repositories and as such, receives
    security updates just as frequently as the main Debian distribution for all the
    packages that Kali left unchanged (i.e. the vast majority). Other packages are
    supported on a best-effort basis by the Kali team.

