    # 01. Create a Kali rootfs


    Build a Kali rootfs as described in our Kali documentation, using an **armhf**
    architecture. By the end of this process, you should have a populated rootfs directory
    in ~/arm-stuff/rootfs/kali-armhf.


    # 02. Create the Image File


    Next, we create the physical image file, which will hold our Beaglebone Black
    rootfs and boot images.


    ```bash

    apt-get install kpartx xz-utils squash

    cd ~

    mkdir -p arm-stuff

    cd arm-stuff/

    mkdir -p images

    cd images

    dd if=/dev/zero of=kali-custom-bbb.img bs=1MB count=7000

    ```


    # 03. Partition and Mount the Image File


    ```bash

    parted --script kali-custom-bbb.img mklabel msdos

    fdisk kali-custom-bbb.img << __EOF___

    n

    p

    +64M

    t

    te

    p

    w

    __EOF__

    ```


    # Kali Linux


    ```bash

    w

    parted --script kali-custom-bbb.img set 1 boot on

    fdisk kali-custom-bbb.img << __EOF__

    n

    p

    2

    w

    __EOF__

    ```


    ```bash

    loopdevice=`losetup -f --show kali-custom-bbb.img`

    device=`kpartx -va $loopdevice|sed -E ''s/.*/(loop[0-9]).*/\1/g'' | head -1`

    device="/dev/mapper/${device}"

    boot=${device}p1

    root=${device}p2


    mkfs.vfat -F 16 $bootp -n boot

    mkfs.ext4 $rootp -L kaliroot

    mkdir -p boot

    mkdir -p root

    mount $bootp boot

    mount $rootp root

    ```


