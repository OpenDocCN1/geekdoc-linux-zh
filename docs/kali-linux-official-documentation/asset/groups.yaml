    # Use in Print, Web, Media and Public Display


    It is important to maintain the look and spelling of the trademarks. Examples
    of modifying the marks include abbreviating names, adding logos to the marks,
    or combining the marks with other words. We recommend you use the trademarks in
    the exact form as we use them.


    The Offensive Security trademarks are to designate the source of our products
    and services. We encourage others to use the marks so long as they are used to
    identify the products and services of Offensive Security. We do not want to confuse
    the public into believing that we are dealing with, in fact, they are not.


    The first mention of an Offensive Security trademark should be accompanied by
    a symbol indicating whether the mark is a registered trademark “™” or an unregistered
    trademark “™”. Please refer to the above list for the appropriate symbol to use
    and if in doubt, use “™”.


    The use of an Offensive Security trademark should be set apart from surrounding
    text, either by capitalizing it or by italicizing, bold or underlining it. The
    Offensive Security trademarks are to designate the source of our products and
    services.


    When using an Offensive Security trademark in written materials, you should provide
    a statement indicating that the [trademark] is a trademark of Offensive Security.
    For example:


    “KALI LINUX ™” is a trademark of Offensive Security.” This statement can be provided
    directly in your text, or as a footnote or an endpoint.


    The use of Offensive Security trademarks in your domain names is prohibited because
    such use will lead to the confusion of customers. Any other use outside of the
    scope of the Trademark Policy is not permitted without express permission of Offensive
    Security.


    You may make t-shirts, desktop wallpaper, or other merchandise with Offensive
    Security Marks on them, though only for yourself and your friends (meaning people
    from whom you don''t receive anything of value in return). You can''t make the
    trademarks on anything that you produce commercially (whether or not you make
    a profit) —'
