    zip curl libncurses5-dev zlib1g-dev libncurses-dev gcc-multilib g++-multilib

    ```


    如果你运行 64 位 Kali Linux 系统，按照以下方式为你的开发环境添加 i386 架构支持。


    ```

    dpkg --add-architecture i386

    apt-get update

    apt-get install ia32-libs

