    # KALI LINUX


    # 02. Building Custom Kali Images


    # Live Build a Custom Kali ISO


    # Build Your Own Kali ISO - Introduction


    Building a customized Kali ISO is easy, fun, and rewarding. You can configure
    virtually every aspect of your custom Kali ISO build using the Debian live-build
    scripts. These scripts allow one to easily build live system images by providing
    a framework that uses a configuration set to automate and customize all aspects
    of building the image. We have adopted these scripts and use them for the official
    Kali ISO releases.


    # Prerequisites


    Ideally, you should build your custom Kali ISO from within a pre-existing Kali
    environment. However, if this is not the case for you, make sure you are using
    the latest version of live-build (in the 3.x branch which targets Debian whezy).


    # Getting Ready


    We need to prepare the Kali ISO build environment with the following commands:


    ```

    apt-get install live-build cdebootstrap kali-archive-keyring

    git clone git://git.kali.org/live-build-config.git

    cd live-build-config

    lb config

    ```


    # Configuring the Kali ISO Build (Optional)


    Through the config directory, your ISO supports significant customization options,
    which are well documented on the Debian live build 3.x page. However, for the
    impatient, the following configuration files are of particular interest:


    **config/package-lists/kali.chroot** - contains the list of packages to install
    in the Kali ISO. You can choose specific packages to be installed, while dropping
    others. This is also where you can change your Kali ISO Desktop Environment (KDE,
    Gnome, XFCE, LXDE, etc).


    hooks/ - The directory allows us to hook scripts in various stages of the Kali
    ISO live build. For more information about hooks, refer to the live build manual.
    As an example, Kali adds its forensic menu this way:


    ```

    $ cat config/hooks/forensic-menu.binary

    #!/bin/sh


    cat >>binary/isolinux/live.cfg<<END


    label live-forensic

    menu label ^Live (forensic mode)

    linux /live/vmlinuz

    initrd /live/initrd.img

    append boot=live nofig username=root hostname=kali noswap noautomount

    END

    ```


    # Building the ISO


    Before you generate your ISO, you can specify your required architecture, choosing
    either amd64 or i386. Note that “lb build” requires root rights. If you do not
    specify an architecture, live build will generate an ISO with the same architecture
    as the host machine.


    If you want to build a 64 bit ISO on a 32 bit system, make sure you enable multi-arch
    support:


    ```

    dpkg --add-architecture amd64

    apt-get update

    ```


    Configure live-build to generate with a 64 bit or 32 bit ISO:


    ```

    lb config --architecture amd64 # for 64 bit

    # ...or...

    ```


    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ```

    lb config --architecture i386 # for 32 bit

    lb build

    ```


    The last command will take a while to complete, as it downloads all of the required
    packages needed to create your ISO. Good time for a coffee.


    # Building Kali Linux for older i386 architecture


    The Kali Linux i386 ISO has PAE enabled. If you require a default kernel for older
    hardware, you need to rebuild a Kali ISO. The rebuilding process is much the same
    as the above, other than the i386-pae parameter that needs to be changed to 486
    in auto/config:


    ```

    apt-get install live-build cdebootstrap kali-archive-keyring

    git clone git://git.kali.org/live-build-config.git

    cd live-build-config

    sed -i ''s/i386-pae/486/g'' auto/config

    lb clean

    lb config --architecture i386

    lb build

    ```


    # Speeding up future builds


    If you plan to build custom ISOs often, you might want to cache packages locally
    for future builds. This can be easily done by installing apt-cacher-ng, and configuring
    the http_proxy environment before every build.


    ```

    apt-get install apt-cacher-ng

    /etc/init.d/apt-cacher-ng start

    export http_proxy=http://localhost:3142/

    lb build

    ```


    # Customize the Kali Desktop


    # Changing the Desktop Environment


    Although Kali Linux uses Gnome for its default environment, we recognize that
    not all users wish to use Gnome so we have made it simple to change to a WM of
    your choosing. To build your own Kali ISO image with a custom Desktop Environment,
    start by following the [Live Build a Custom ISO guide](https://docs.kali.org).
    Before building your ISO, the last section of **config/package-lists/kali.chroot**
    contains the entries related to the desktop environment of your choice:


    ```

    # Graphical desktops depending on the architecture

    # You can replace all the remaining lines with a list of

    # packages required to install your preferred graphical desktop

    # or you can just comment everything except the packages of the

    # preferred desktop.


    - KDE

    - Gnome

    - LXDE

    - XFCE

    - X

    - MATE


    ```

    kali-defaults

    kali-root-login

    desktop-base

    kde-plasma-desktop


    - gnome-core

    kali-defaults

    kali-root-login

    desktop-base

    - kali-defaults

    kali-root-login

    desktop-base

    lxde

    - kali-defaults

    kali-root-login

    desktop-base

    xfce4

    xfce4-places-plugin

    ```


    The “MATE” desktop is not included by default in our repositories, and requires
    a few more steps to integrate into a Kali build:


    ```

    echo "deb http://repo.mate-desktop.org/debian whezy main" >> /etc/apt/sources.list

    apt-get update

    apt-get install mate-archive-keyring

    ```


