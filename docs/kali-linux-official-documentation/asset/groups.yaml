    # Install Kali Samsung Chromebook


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_85_0.png)


    The Samsung ARM Chromebook is an ultraportable laptop. It was quite a challenge,
    but we have a Kali image that runs great on the Chromebook.


    > Our Kali Chromebook image contains two boot partitions – one holds a kernel
    hardcoded to boot from SD, and the other holds a kernel hardcoded to boot from
    USB. Depending on your USB storage media type, make sure to mark the relevant
    boot partition with higher priority after you dd the image to your USB device,
    as instructed in the last stages of this guide.


    # Kali on Chromebook - User Instructions


    If all you want do is install Kali on your Samsung ARM Chromebook, follow these
    instructions:


    - 1. Get a fast 8 GB SD card or USB stick.

    - 2. Put your Chromebook in developer mode.

    - 3. Download the Kali Samsung ARM Chromebook image from our [downloads](downloads)
    area.

    - 4. Use the dd utility to image this file to your USB /SD device. In our example,
    we use a USB stick which is located at /dev/sdb. **Change as needed.**


    > Alert! This process will wipe out your SD card. If you choose the wrong storage
    device, you may wipe out your computer''s hard disk.


    ```

    dd if=kali-chromebook.img of=/dev/sdb bs=512k

    ```


    This process can take a awhile depending on your USB storage device speed and
    image size.


    This is the point where you need to mark each boot partition 1 or 2 to have higher
    priority. The number with the higher priority will boot first. The example below
    will give priority 10 to the first partition (-I), and will thus boot successfully
    from a SD card.


    ```

    cgpt repair /dev/sdb

    cgpt add -i 1 -S 1 -T 5 -P 10 -I KERN-A /dev/sdb

    cgpt add -i 2 -S 1 -T 5 -P 5 -I KERN-B /dev/sdb

    ```


    To see your partition list and order, use the command **cgpt show**.


    ```

    root@kali:~# cgpt show /dev/sdb

    start size part contents

    0 1 PMBR

    1 1 Pri GPT header

    2 32 Pri GPT table

    8192 32768 1 Label: "KERN-A"

    Type: ChromeOS kernel

    UUID: 63AD66C9-AD94-4B42-80E4-798BBE6BE466

    Attr: priority=10 tries=5 successful=1

    40960 32768 2 Label: "KERN-B"

    Type: ChromeOS kernel

    ```


