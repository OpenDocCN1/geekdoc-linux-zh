    # # Kali Linux Forensic Mode


    BackTrack introduced a "Forensic Boot" option to the operating system that continued
    on through BackTrack 5 and now exists in Kali Linux. The "Forensics Boot" option
    has proven to be very popular due to the widespread availability of our operating
    system. Many people have Kali ISOs laying around and when a forensic need comes
    up, it is quick and easy to put Kali Linux to the job. Pre-loaded with the most
    popular open source forensic software, Kali is a handy tool when you need to do
    some open source forensic work.


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_72_0.png)


    When booted into the forensic boot mode, there are a few very important changes
    that are made.


    +   1. First off, the internal hard disk is not touched. This means that if there
    is a partition it will not be used and no internal disk will be mounted. To verify
    this, we took a standard system and removed the hard drive. Attaching this to
    a commercial forensic package we took a hash of the drive. We then re-'
- md: '

    attached the drive to the computer and booted off of Kali in forensic boot mode.
    After using Kali for a period of time, we then shut the system down, removed the
    hard drive, and took the hash again. These hashes matched, indicating that at
    no point was anything changed on the drive at all.


    + 2. The other, just as important, change that was made was we disabled the auto
    mount of any removable media. So thumb drives, CDs, and so on will not be auto-mounted
    when inserted. The idea behind all of this is simple: Nothing should happen to
    any media without direct user action. Anything that you do as a user is on you.


    If you are interested in using Kali for real world forensics of any type, we recommend
    that you don''t just take our word for any of this. All forensic tools should
    always be validated to ensure that you know how they will behave in any circumstance
    that you may place them.


    And finally, as Kali is focused on having the best collection of open source penetration
    testing tools available, it is possible that we may have missed your favorite
    open source forensic tool. If so, let us know! We are always on the lookout of
    high quality open source tools that we can add to Kali to make it even better.


    ## VMware Tools in a Kali Guest


    Should you decide to create your own VMware installation of Kali Linux rather
    than our pre-made VMware images, you will need to follow the instructions below
    in order to successfully install VMware Tools in your Kali installation. You can
    opt to install open-vm-tools, or the native VMware tools.


    ## Installing open-vm-tools


    This is probably the easiest way to get “VMware tools” functionality inside a
    kali VMware guest.


    ```

    apt-get install open-vm-tools

    ```


    ## Installing VMware Tools in Kali


    If open-vm-tools does not work for you, or if you prefer using native VMware tools,
    begin by installing some packages that are required by the VMware Tools installer:


    ```

    echo cups enabled >> /usr/sbin/update-rc.cd

    echo vmware-tools enabled >> /usr/sbin/update-rc.cd


    apt-get install gcc make linux-headers-$(uname -r)

    in -s /usr/src/linux-headers-$(uname -r)/include/generated/uapi/linux/version.h
    /usr/src/linux-headers-$(uname -r)/include/

    ```


    Next, mount the VMware Tools ISO by clicking “Install VMware Tools” from the appropriate
    menu. Once the VMware Tools ISO has been attached to the virtual machine, we mount
    the drive and copy the VMware Tools installer to /tmp/.


    ```

    mkdir /mnt/vmware

    ```


