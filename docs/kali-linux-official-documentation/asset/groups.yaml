  - '[PAGE 27]


    # Dual Boot Kali with Windows


    # Kali Linux Dual Boot with Windows


    Installing Kali alongside a Windows installation can be quite useful. However,
    you need to exercise caution during the setup process. First, make sure that you''ve
    backed up any important data on your Windows installation. Since you''ll be modifying
    your hard drive, you''ll want to store this backup on external media. Once you''ve
    completed the backup, we recommend you peruse Kali Linux Hard Disk Install, which
    explains the normal procedure for a basic Kali install.


    In our example, we will be installing Kali Linux alongside an installation of
    Windows 7, which is currently taking 100% of the disk space in our computer. We
    will start by resizing our Windows partition to occupy less space and then proceed
    to install Kali in the newly-created empty partition.


    Download Kali Linux and either burn the ISO to DVD, or prepare a USB stick with
    Kali Linux Live as the installation medium. If you do not have a DVD or USB port
    on your computer, check out the Kali Linux Network Install. Ensure you have:


    +   - Minimum of 8 GB free space on Windows

    - CD-DVD / USB boot support


    # Preparing for the Installation


    +   1. Download Kali Linux.

    2. Burn The Kali Linux ISO to DVD or copy Kali Linux Live to USB.

    3. Ensure that your computer is set to boot from CD / USB in your BIOS.


    # Dual Boot Installation Procedure


    +   1. To start your installation, boot with your chosen installation medium.
    You should be greeted with the Kali Boot screen. Select *Live*, and you should
    be booted into the Kali Linux default desktop.

    2. Now launch the **gparted** program. We''ll use **gparted** to shrink the existing
    Windows partition to give us enough room to install Kali Linux.'
