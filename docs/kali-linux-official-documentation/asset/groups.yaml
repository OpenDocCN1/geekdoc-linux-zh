    # ARM Cross-Compilation


    The following guide will demonstrate how to set up an ARM cross-compilation environment
    in Kali Linux. This guide is the starting point for many of our contributed “Custom
    ARM Images” articles.


    # Setting Up Your Development Box


    Compiling kernels and generating images usually comes at the cost of disk space.
    Make sure you have at least 50 GB of disk space available on your Kali development
    machine as well as ample RAM and CPU juice.


    # Install Dependencies


    Start off by installing the required dependencies for ARM cross-compilation.


    ```

    apt-get install git-core gnupg bison gperf libbsd0-dev build-essential \

    zip curl libncurses5-dev zlib1g-dev libncurses5-dev gcc-multilib g++-multilib

    ```


    If you are running a 64 bit Kali Linux system, add i386 architecture support to
    your development environment as follows.


    ```

    dpkg --add-architecture i386

    apt-get update

    apt-get install ia32-libs

    ```


    # Download Linaro Toolchain


    Download the Linaro cross-compiler from our Git repository.


    ```

    cd ~

    mkdir -p arm-stuff/kernel/toolchains

    cd arm-stuff/kernel/toolchains

    git clone git://github.com/offensive-security/arm-eabi-linaro-4.6.2.git

    ```


    # Set Environment Variables


    To use the Linaro cross-compiler, you will need to set the following environment
    variables in your session.


    ```

    export ARCH=arm

    export CROSS_COMPILE=~/arm-stuff/kernel/toolchains/arm-eabi-linaro-4.6.2/bin/arm-eabi-

    ```


    Now your ARM cross-compilation environment is complete and you can proceed with
    building your own kernels.


    # Rebuilding a Package from Source


    On occasion, we need to rebuild a Kali package from source. Fortunately, this
    is as simple as apt-getting the package sources, modifying them to your needs,
    and then rebuilding them using Debian tools. In this example, we will recompile
    the libfree package in order to add some extra hardcoded Mifare access keys into
    the mifare-format tool.


    # Downloading the Package Source


    ```

    # Get the source package

    apt-get source libfreefare

    cd libfreefare-0.3.4~svn1469/

    ```


    # Edit the Package Source Code


    Make the changes needed to the source code of the package. In our case, we modify
    an example file, mifare-classic-format.c.


    ```

    nano examples/mifare-classic-format.c

    ```


    # Check for Build Dependencies


    Check for any build dependencies the package may have. These need to be installed
    before you can build the package.


    ```

    dpkg-checkbuildldeps

    ```


