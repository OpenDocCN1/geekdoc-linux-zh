    # Install Kali ARM on ODROID U2


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_90_0.png)


    # Odroid U2 / X2


    ODROID U2 is a tricky piece of hardware as console output is not a given. Ideally,
    when purchasing an ODROID, you should also get a USB UART cable, for serial debugging
    of the boot process. Saying this, these machines are (at this time) some of the
    most impressive in terms of size, horsepower and memory availability.


    # Kali on ODROID U2 - User Instructions


    If all you want do is install Kali on your awesome ODROID, follow these instructions:


    - 1. Get a fast 8 GB (and above) microSD. Class 10 cards are highly recommended.

    - 2. Download the Kali Linux ODROID U2 image from downloads area.

    - 3. Use the **dd** utility to image this file to your micro card. In our example,
    we assume the storage device is located at /dev/sdb. **Change as needed.**


    > Alert! This process will wipe out your SD card. If you choose the wrong storage
    device, you may wipe out your computer''s hard disk.


    ```

    dd if=kali-ordoidu2.img of=/dev/sdb bs=1M

    ```


    This process can take a while depending on your USB storage device speed and image
    size. The dd operation is done, boot up the Odroid with the microSD plugged in.
    You should be welcomed with a Gnome login screen - (root /toor). That''s it, you''re
    done!


    # Troubleshooting


    To troubleshoot the Odroid boot process, you will need to connect a UART serial
    cable to the Odroid. Once the cable is connected, you can issue the following
    command to connect to the console:


    ```

    screen /dev/ttySAC1 115200

    ```

