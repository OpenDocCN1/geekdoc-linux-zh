    ## Post Installation


    Now that you''ve completed installing Kali Linux, it''s time to customize your
    system. The Kali General Use section of our site has more information and you
    can also find tips on how to get the most out of Kali in our User Forums.


    ## 04. Kali Linux Network Installs


    ### Kali Linux Mini ISO Install


    ### Kali Mini ISO Install


    The Kali mini ISO is a convenient way to install a minimal Kali system and install
    it “from scratch”. The mini install ISO will download all required packages from
    our repositories, meaning you need to have a fast Internet connection to use this
    method.


    ## Installation Prerequisites


    - A minimum of 8 GB disk space for the Kali Linux install.

    - For i386 and amd64 architectures, a minimum of 512MB RAM.

    - CD-DVD Drive / USB boot support


    ## Preparing for the Installation


    1. Download the Kali mini ISO.

    2. Burn The Kali Linux ISO to DVD or Image Kali Linux Live to USB.

    3. Ensure your computer is set to boot from CD / USB in your BIOS.


    ## Kali Linux Installation Procedure


    When you first boot the mini ISO, you will be presented with a small boot menu
    with various options. For this article, we will simply be doing a basic install.


    ## KALI LINUX


    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_52_0.png)


    You will next be prompted for various things such as your language and keyboard
    type, then you will need to select a hostname for your installation. We will stick
    with the default of kali.


    ## KALI LINUX


    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_53_0.png)


    Next, you will need to select your time zone, then you''ll be shown the partition
    options. To get up and running quickly, we will use ''Guided - use entire disk''
    and follow the prompts all the way through to create the new partitioning setup.


    ## KALI LINUX


    Official Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_54_0.png)


    In order to reduce network bandwidth, a small subset of packages will be selected
    by default. If you wish to add different services or features, this is the area
    you would make your selections.


    ## KALI LINUX


    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ```

