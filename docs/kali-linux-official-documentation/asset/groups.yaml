    \ kpartx xz-utils squashutils\ncd ~\nmkdir -p arm-stuff\ncd arm-stuff/\nmkdir\
    \ -p images\ncd images\ndd if=/dev/zero of=kali-custom-rpi.img bs=1MB count=7000\n\
    ```\n\n# 03. Partition and Mount the Image File\n\n```bash\nparted kali-custom-rpi.img\
