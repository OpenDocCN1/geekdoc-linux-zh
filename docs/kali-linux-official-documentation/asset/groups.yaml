    # 联系我们


    如果您有任何问题或建议，或者希望举报对 Offensive Security 商标的滥用，请与我们联系。


    # Kali Linux Root 用户策略


    大多数发行版都鼓励用户在运行操作系统时使用普通用户权限。这是一项明智的安全建议，因为这种行为在用户和操作系统之间提供了额外的安全防护。这对于需要用户权限分离的多用户系统来说尤为如此。


    从本质上讲，Kali Linux 是安全和审计平台，许多工具需要以 root 权限运行。通常情况下，使用 Kali Linux 时不太可能处于多用户环境中，因此默认的
    Kali 用户是“root”。此外，Kali Linux 不推荐 Linux 初学者使用，因为他们在在使用超级用户账户时更容易犯下破坏性的错误。


    # 渗透测试工具策略


    # Kali Linux 工具策略


    我们意识到有很多工具或脚本可以完成相同的工作。有些比其他的更好用，有些则仅仅取决于个人偏好。基于这种想法，维护一个更新且实用的渗透测试工具库是一项具有挑战性的任务。Kali
    开发团队使用以下某些金石测试来决定特定工具是否应该包含在发行版中。


    - 该工具在渗透测试环境中是否有用/功能如何？

    - 该工具是否包含了其他现有工具的功能？

    - 该工具的许可是否允许自由分发？

    - 该工具需要多少资源？它能在“标准”环境中运行吗？


    根据这些问题的答案以及其他考虑，我们随后决定该工具是否应标记为纳入 Kali。


    Kali 开发团队的大多数成员是渗透测试员，因此我们依靠共同经验来选择为 Kali 发行版增加最大价值的工具，同时也会考虑其他因素。专门针对 DOS、DDOS
    或匿名性的工具在合法任务中很少使用，因此在 Kali Linux 中不会默认安装它们。


    # 新工具请求


    我们随时欢迎向发行版中添加新的、更好的工具，但必须为每个工具提供合理的理由。请在提交工具时投入一些思考和努力，而不仅仅是向开发者发送单行请求。可以通过 Kali
    Linux 错误跟踪器（bug tracker）提交新工具请求。


