    \ the dd operation is complete, unmount and eject the SD card and boot your Pi\
    \ into Kali Linux\n\n# KALI LINUX\nOfficial Linux Documentation\nThis PDF has\
    \ been autogenerated on docs.kali.org - Aug 19, 2013\n\n# Custom Chromebook Image\n\
    \nThe following document describes our method of creating a **custom Kali Linux\
    \ Samsung Chromebook image** and is targeted at developers. If you would like\
    \ to install a pre-made Kali image, check out our Install Kali on Samsung article.\n\
    \nIn this guide, we create an image with two boot partitions - one containing\
    \ a kernel hard-coded to boot from the SD card and the other containing a kernel\
    \ hard-coded to boot from USB. Depending on your storage media type, make sure\
    \ to mark the relevant boot partition with higher priority after dd image to your\
    \ USB as instructed in the last stages of this guide.\n\n### 01. Create a Kali\
    \ rootfs\n\nStart by building a Kali rootfs as described in our Kali documentation,\
    \ using **armhf** architecture. By the end of this process, you should have a\
    \ populated rootfs directory in `~/arm-stuff/rootfs/kali-armhf`.\n\n### 02. Create\
    \ the Image File\n\nNext, we create the physical image file that will hold our\
    \ Chromebook rootfs and boot images.\n\n```bash\napt-get install kpartx xz-utils\
    \ gdisk uboot-mkimage vboot-tools vboot-utils\ncd ~\nmkdir -p arm-stuff\ncd arm-stuff/\n\
    mkdir -p images\ncd images\ndd if=/dev/zero of=kali-custom-chrome.img bs=1MB count=7000\n\
    ```\n\n### 03. Partition and Mount the Image File\n\n```bash\nparted kali-custom-chrome.img\
    \ --script -- mlabel msdos\nparted kali-custom-chrome.img --script -- mkpart primary\
    \ fat32 0 64\nparted kali-custom-chrome.img --script -- mkpart primary ext4 64\
    \ -1\ngdisk kali-custom-chrome.img --script -- gpt\n```\n\n```bash\nloopdevice=`losetup\
    \ -f --show kali-custom-chrome.img`\ndevice=`kpartx -va $loopdevice | sed -E 's/.*(loop[0-9]).*/\\\
    1/g' | head -1`\ndevice=\"/dev/mapper/${device}\"\nboot1=${device}p1\nboot2=${device}p2\n\
    root=${device}p3\n```\n\n```bash\nmkfs.ext4 $root\nmkdir -p root\nmount $root\
    \ root\n```\n\n# 04. Copy and Modify the Kali rootfs\n\nCopy over the Kali rootfs\
    \ you bootstrapped earlier using **rsync** to the mounted image.\n\n```bash\n\
    cd ~/arm-stuff/images/\nrsync -HPavz ~/arm-stuff/rootfs/kali-armhf/ root\necho\
    \ nameserver 8.8.8.8 > root/etc/resolv.conf\n```\n\n```bash\nmkdir -p root/etc/X11/\n\
    cat << EOF > /root/etc/X11/xorg.conf/50-touchpad.conf\nSection \"InputClass\"\n\
    Identifier \"touchpad\"\nMatchIsSynaptics\nOption \"TapButton1\" \"1\"\nOption\
    \ \"TapButton2\" \"3\"\nOption \"TapButton3\" \"2\"\nOption \"FingerLow\" \"15\"\
    \nOption \"FingerHigh\" \"20\"\nOption \"FingerPress\" \"256\"\nEndSection\nEOF\n\
    ```\n\n# 05. Compile the Samsung Kernel and Modules\n\nIf you're not using ARM\
    \ hardware as the development environment, you will need to set up an ARM-ilation\
    \ environment to build an ARM kernel and modules. Once that's done, proceed with\
    \ the following instructions.\n\nFetch the Chromium kernel sources and place them\
    \ in our development tree:\n\n```bash\ncd ~/arm-stuff\nmkdir -p kernel\ncd kernel\n\
    git clone http://git.chromium.org/chromiumos/third_party/kernel.git -b chromeos-3.4\
    \ chromeos\ncd chromeos\n```\n\n# KALI LINUX\nOfficial Linux Documentation\nThis\
    \ PDF has been autogenerated on docs.kali.org - Aug 19, 2013\n\n```bash\ncat <<\
    \ EOF > kernel.its\n/dt-v1;\ndescription = \"Chrome OS kernel image with one or\
    \ more blobs\";\n#address-cells = 0;\nimages {\n  kernel@1 {\n    description\
    \ = \"kernel\";\n    data = \"/incbin(arch/arm/boot/zimage)\";\n    type = \"\
    kernel_noload\";\n    arch = \"arm\";\n    os = \"linux\";\n    compression =\
    \ \"none\";\n    entry = 0;\n  };\n  fdt@1 {\n    description = \"exynos5250-snow.dtb\"\
    ;\n    data = \"/incbin(arch/arm/boot/exynos5250-snow.dtb)\";\n    type = \"flat_dt\"\
    ;\n    arch = \"arm\"\n    compression = \"none\";\n    hash@1 {\n      algo =\
    \ \"sha1\";\n    }\n  }\n};\nconfigurations {\n  default = \"conf@1\";\n  conf@1\
    \ {\n    kernel = \"kernel@1\";\n    fdt = \"fdt@1\";\n  }\n};\nEOF\n```\n\n#\
    \ KALI LINUX\nOfficial Linux Documentation\nThis PDF has been autogenerated on\
    \ docs.kali.org - Aug 19, 2013\n\nPatch the kernel, in our case, with wireless\
    \ injection patches.\n\n```bash\nmkdir -p ../patches\nwget http://patches.airrack-ng.org/mac80211.compat08082009.wl_frag+ack_v1.patch\
    \ -O ../patches/mac80211.patch\nwget http://patches.airrack-ng.org/channel-negative-one.patch\
    \ -O ../patches/negative.patch\n```\n\nWait, the OCR had some mess in the logic:\n\
    \nConfigure, then cross-compile the Chromium kernel as shown below.\n\n```bash\n\
    export ARCH=arm\nexport CROSS_COMPILE=~/arm-stuff/kernel/toolchains/arm-eabi-linaro-4.6.2/bin/arm-eabi-\n\
    ./chromeos/scripts/prepareconfig chromos-exynos5\n# Disable LSM\nsed 's/CONFIG_SECURITY_CHROMIUM=y/#\
    \ CONFIG_SECURITY_CHROMIUM is not set/g' .config\n```\n\n```bash\nmake menuconfig\n\
