    # # Manual Configuration Within the chroot


    If needed, you can perform any final modifications in your rootfs environment
    by manually chrooting into it and making any necessary last changes.


    ```

    LANG=C chroot kali-$architecture

    {make additional changes within the chroot}

    exit

    ```


    # ## Cleanup


    Lastly, we run a cleanup script in our chroot to free up space used by cached
    files and run any other cleanup jobs we may require:


    ```

    cat << EOF kali-$architecture/cleanup

    #!/bin/bash

    rm -rf /root/.bash_history

    apt-get update

    apt-get clean

    rm -f cleanup

    EOF


    chmod +x kali-$architecture/cleanup

    LANG=C chroot kali-$architecture/cleanup


    umount kali-$architecture/proc

    umount kali-$architecture/dev/pts

    umount kali-$architecture/dev/


    cd ..

    ```'
