    # # KALI LINUX


    Support or engagement of illegal activity - it should go without saying, but we
    don''t want to help break the law or do things you shouldn''t. Such queries are
    off-topic for the channel, freenode as a whole, and may well get you removed from
    the channel and network. Please don''t ask. Laws from country to channel ops may
    determine whether a specific discussion is appropriate for the channel or not.
    Warez/Cracks/Pirated Software – these too are oftopic for the channel and network
    so please don''t ask.


    # Political/Religious Matters


    Many people have very strong political/religious beliefs and we respect that.
    We also recognize that these are volatile topics, which have nothing to do with
    Kali Linux and are best discussed elsewhere.


    # Asking for Help


    If you''re asking for help, first off, thanks! – questions and the resulting discussion
    of the answer(s) in a collaborative environment are what make IRC great and by
    helping to add to the atmosphere, you benefit all of us. We often find that we
    learn a lot from questions we already know the answers to – about people, alternative
    approaches, and cool resources and tools. However, if you are intending to ask
    a question, we''d appreciate it if you''d follow a couple guidelines to help you,
    and us, make the best of our time: Do your research first – it''s very frustrating
    when people ask a question that can be answered by punching the keys into a Google
    search! We also have forums and a wiki that contains answers to many questions
    we see so it''s everyone''s benefit if these assets are used before asking in
    IRC.


    # Give Us the Whole Picture


    If you''re asked for more information, please provide it accurately. The correct
    answer will depend on it. Looking at this from another angle: the more we learn
    about your problem, the more this independently benefits us too – a large part
    of the development of new releases is derived from helping others with issues
    discovered with specific setups; even if you''re asking us questions, you can
    help teach us something too! If you find the answer somewhere else, tell us –
    it''s not isnputny, but if you don''t get an answer to your question in the channel
    but you find it elsewhere, letting us know! Way, we can help the next person with
    a similar question. It also lets people know that you already have an answer you
    are happy with, or if anyone''s searching the question for you, they can wait.
    Wait for – not everyone in the channel is online all the time – you may find an
    answer a few minutes, or hours, later. Feel free to stick around and chat, or
    even answer other peoples questions – it helps pass the time and makes others
    likely to help you! Help us build a community of friendly security professionals
    and enthusiasts.


    # Spam, Flooding, and Various Other Forms of Disruptive Behaviour


    Spam, flooding, disrespect or verbal attacks against other users, misleading links,
    intentionally wrong answers, and other forms of disruptive behaviour not otherwise
    specified are unwelcome.'
