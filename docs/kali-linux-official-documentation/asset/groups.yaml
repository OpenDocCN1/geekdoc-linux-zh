    \ in a text file and uploaded. (Discussed later within this document.)\n\n- search\n\
    - list\n- status\n\nSample Output\n\n```\nroot@kali:~# # which chromium\n/usr/bin/chromium\n\
    root@kali:~# # type chromium\nchromium is /usr/bin/chromium\nroot@kali:~# # dpkg\
    \ -search /usr/bin/chromium\nchromium: /usr/bin/chromium\nroot@kali:~# # dpkg\
    \ --list chromium\nDesired=Unknown/Install/Remove/Purge/Hold\n| Status=Not-Install/Conf-files/Unpacked/Half-conf/Half-inst/trig-aWait/Trig-pend\n\
