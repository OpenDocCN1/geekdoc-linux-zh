    Official Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    UUID: 37CE46C9-0A7A-4994-B0FC-C0FCB4FDC1

    Attr: priority=5 tries=1 successful=1

    73728 3832490 3 Label: "Linux filesystem"

    Type: 06C3DAF-8483-4772-8E79-369D8477DE4

    UUID: E9E67EE1-C02E-481C-BA3F-E721515DB

    125045391 3 Sec GPT table

    125045423 1 Sec GPT header

    root@kali:~#


    Once the dd operation is complete, boot up the Chromebook with SD / USB plugged
    in (NOT THE BLUE USB!). At the developer prompt, hit CTRL+ALT+U, which should
    boot you into Kali. Log in to Kali (root /toor) and startx. That''s it!


    # Kali on Samsung Chromebook - Developer Instructions


    If you are a developer and want to tinker with the Samsung Chromebook, including
    changing the kernel configuration and generally being adventurous, check out our
    Custom Chromebook Image.


