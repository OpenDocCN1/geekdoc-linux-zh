- md: '

    # KALI LINUX


    Official Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    By using shalsum -c:


    ```

    grep kali-linux-1.0-i386.iso SHA1SUMS | shalsum

    kali-linux-1.0-i386.iso: OK

    ```


    # Verifying SHA1 Checksums on OSX


    With a manual comparison:


    ```

    $ shasum kali-linux-1.0-i386.iso

    796e32f5d1bf51e838499c32671a952cc052 kali-linux-1.0-i386.iso

    $ grep kali-linux-1.0-i386.iso SHA1SUMS

    796e32f5d1bf51e838499c32671a952cc052 kali-linux-1.0-i386.iso

    ```


    # Verifying SHA1 Checksums on Windows


    Windows does not have the native ability to calculate SHA1 checksums so you will
    need a utility such as Free MD5 SHA1 verifier to verify your download.


    # Generate an Updated Kali ISO


    Kali Linux allows you to generate updated ISOs of Kali using Debian live-build
    scripts on the fly. The easiest way to generate these images is from within a
    Kali Linux environment as follows.


    You will first need to install the live-build and cdebootstrap packages:


    ```

    apt-get install live-build cdebootstrap

    ```


    Next, we clone the Kali cimage Git repository as follows:


