    # # Official Kali Linux Sites


    Kali Linux has a number of sites available to serve our users. Listed below are
    the official Kali sites and the purpose each serves. Note that these sites are
    the only official Kali Linux sites and are the only authoritative sources of information
    available for the distribution.


    > > The sites listed below are the ONLY official outlets for the Kali Linux Distribution.


    # Public Websites


    +   - www.kali.org

    - docs.kali.org

    - forums.kali.org

    - bugs.kali.org

    - git.kali.org


    The main Kali Linux website is our primary means of communicating about Kali Linux
    news, basic information, and updates about our project in general. It is where
    you will find posts about new tools, features, and tricks about Kali Linux and
    should be your one and only source to download the distribution.


    This is where you are right now. Our documentation site contains a basic set of
    Kali Linux related documentation and tutorials. The changes that have been introduced
    with Kali are substantial and we have tried to cover a wide range of commonly
    asked questions. Sub-domains of docs.kali.org are also considered official (document
    translation servers).


    Should you encounter an issue or situation that isn''t covered in the official
    Kali Linux documentation, there is a very high likelihood that there is a member
    of the Kali Linux Forums knows the answer. You will find that the Kali forum members
    are from all the world, cover the entire range of skill levels, and are open and
    willing to help newcomers who are willing to learn.


    Despite our best efforts at making Kali Linux perfect, unanticipated bugs and
    errors are inevitable. We are always open to improve and can effectively do so
    when issues or suggestions are reported to us. You are encouraged to submit bug
    reports at bugs.kali.org to help us make Kali even better.'
