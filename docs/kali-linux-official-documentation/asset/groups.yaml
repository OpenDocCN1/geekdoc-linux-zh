    # Create a Profile in Kali Linux Bug Tracker


    Although not required, it is recommended to create a unique profile as part of
    your bug tracker account. You can create a custom profile for each system, or
    select from the default profiles provided. These profiles are shortcuts to define
    the values for your Platform, OS and version information submitted as part of
    your bug report.


    To create or edit a custom profile, select My Account from the main page and the
    select Profiles. Add the specific information and description for your system
    and click the Add Profile button when done.'
- md: "\n# KALI LINUX\n\nOfficial Linux Documentation\nThis PDF has been autogenerated\
    \ on - Aug 19, 2013\n\n![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_144_0.png)\n\n\
    The profile is as added, it will appear in the ‘Select Profile’ dropdown list\
    \ when you create a new Report Issue.\nYou can create as many different profiles\
    \ as you require, just ensure you select the appropriate one when submitting your\
    \ bug report.\n\n# Ensure you are not duplicating a previous request\n\nBefore\
    \ starting your report, search the site for keywords relating to your issue. If\
    \ there is already an existing bug not related to hardware, please do not duplicate\
    \ the request or add notes that are unnecessary. (i.e. “Me Too” or “+1”) if it\
    \ has been reported, you can view the status of the issue by clicking the ID link.\n\
    \nIf you believe the issue to be hardware related, please submit a new report\
    \ with your specific information, it appears similar. There is a strong chance\
    \ that your hardware does not exactly match that of another report issuer. Do\
    \ not assume because you have the same desktop or laptop model that your issue\
    \ is not unique.\n\n© Offensive Security 2013 Page: 145 / 175\n\n# Creating the\
    \ report\n\nTo begin your report, log into your account and click the \"Report\
    \ Issue\" link on the landing page. You will need to fill out as much information\
    \ as possibly can. If it helps, review the pointers at the beginning of the document\
    \ to make sure you are conforming to expectations.\n\nThe following fields are\
    \ mandatory within the report:\n\n- Category\n- Summary\n- Description\n\nEven\
    \ though the other fields are not mandatory, we recommend you try to include as\
    \ much information as possible within each option paying special attention to\
    \ the following:\n\n- Reproducibility\n- Select Profile\n- Steps to Reproduce\n\
    - Additional Information\n- Upload File (error logs, screenshot)\n\n# Decide the\
    \ proper Category\n\nThere are currently four (4) categories available in the\
    \ Kali bug tracker. Before you begin your request ensure it is properly designated\
    \ for one of the following:\n\n- General Bug\n- Kali Package Bug\n- New Tool Requests\n\
    - Tool Upgrade\n\nDo not request support within the bug tracker. Kali Linux offers\
    \ several options for support including http://docs.kali.org, https://forums.kali.org\
    \ and the IRC chat room on freenode (#kali-linux)\n\n# Providing a Descriptive\
    \ Summary\n\nThe summary field is essentially the 'name' of the report, it will\
    \ be the first thing the Kali developers and other visitors provide. Provide a\
    \ short, yet descriptive summary that can describe the issue or request.\n\nGood:\
    \ Chromium Package installed from Repo will not run as root user\n\nBad: Chromium\
    \ doesn't work\n\nThe summary does not need to include everything, but it should\
    \ convey your reason for submitting the report.\n\n# Using dpkg to find the package\
    \ and version for the report\n\nYou can find which package is installed using\
    \ a combination of dpkg flags. It is important to include relevant information\
