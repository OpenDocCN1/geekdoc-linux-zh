    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_17_0.png)


    - 2. Select your preferred language and then your country location. You''ll also
    be prompted to configure your keyboard with the appropriate keymap.


    # KALI LINUX


    Official Kali Linux Documentation  This PDF has been autogenerated on docs.kali.org
    - Aug 19, 2013


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_18_0.png)


    # Select a language


    Choose the language to be used for the installation process. The selected language
    will also be the default language for the installed system.


    - Chinese (Simplified) - 中文

    - Chinese (Traditional) - 中文(繁體)

    - Croatian - Hrvatski

    - Czech - Če

    - Danish - Dansk

    - Dutch - Nederlands

    - Dzongkha - བོད་ཁ

    - English

    - Esperanto - Esperanto

    - Estonian - Eesti

    - Finnish - Suomi

    - French - Français

    - Galician - Galego

    - Georgian - ქართული

    - German - Deutsch


    Screenshot Go Back Continue


    - 3. The installer will copy the image to your hard disk, probe your network interfaces,
    and then prompt you to enter a hostname for your system. In the example below,
    we''ve entered “kali” as our hostname.


    # KALI LINUX


    Configure the network


    Please enter the hostname for this system.


    The hostname is a single word that identifies your system to the network. If you
    don''t know what your hostname should be, consult your network administrator.
    If you are setting up your own home network,


    Hostname:


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_19_0.png)


    - 4. Enter a robust password for the root account.


    # KALI LINUX


    Set up users and passwords


    You need to set a password for ''root'', the system administrative account. A
    malicious or unqualified user with root access can have disastrous results, so
    you should take care to choose a root password that is not easy to guess. It should
    not be a word found in dictionaries, or a word that could be easily associated
    with you.


    A good password will contain a mixture of letters, numbers and punctuation and
    should be changed at regular intervals.


    The root user should not have an empty password. If you leave this empty, the
    root account will be disabled and the system''s initial user account will be given
    the power to become root using the "sudo" command.


    Note that you will not be able to see the password as you type it.


    Root password:


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_20_0.png)


    Please enter the same root password again to verify that you have typed it correctly.


    Re-enter password to verify:


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_20_1.png)


    Screenshot Go Back Continue


    - 5. Next, set your time zone.


    # KALI LINUX


    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_21_0.png)


    ## Configure the clock


    > If the desired time zone is not listed, then go back to the step "Choose language"
    and select a country that used the desired time zone (the country where you live
    or are located).

    Select your time zone:


    - Eastern

    - Central

    - Mountain

    - Pacific

    - Alaska

    - Hawaii

    - Arizona

    - East Indiana

    - Samoa


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_21_1.png)


    - 6. The installer will now probe your disks and offer you four choices. In our
    example, we’re using the entire disk on our computer and not configuring LVM (logical
    volume manager). Experienced users can use the “Manual” partitioning method for
    more granular configuration options.


    # KALI LINUX


    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_22_0.png)


    # Partition disks


    The installer can guide you through partitioning a disk (using different standard
    schemes) or, if you prefer, can do it manually. With guided partitioning you will
    still have a chance later to review and customise the results.


    If you chose partitioning for an entire disk, you will next be asked which disk
    should be used.


    Partitioning method:


    ## Guided - use entire disk


    - Guided - use entire disk and set up LVM

    - Guided - use entire disk and set up encrypted LVM

    - Manual


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_22_1.png)


    - 7. Next, you''ll have one last chance to review your disk configuration before
    the installer makes irreversible changes. After you click *Continue*, the installer
    will go to work and you''ll have an almost finished installation.


    # KALI LINUX


    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_23_0.png)


    # Partition disks


    If you continue, the changes listed below will be written to the disks. Otherwise,
    you will be able to make further changes.


    WARNING: This will destroy all data on partitions as well as on the partitions
    that are going to formatted.


    The partition tables of the following devices are changed:


    - sda (0,0,0)


    The following partitions are going to formatted:

    partition #1 of sda (0,0,0) as ext4

    partition #5 of sda (0,0,0) as swap


    Write the changes to disks?


    - No

    - Yes


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_23_1.png)


    - 8. Configure network mirrors. Kali uses a central repository to distribute applications.
    You''ll need to enter any appropriate proxy information as needed.


    > NOTE! If you select “NO” in this screen, you will NOT be able to install packages
    from Kali repositories.


    # KALI LINUX


    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_24_0.png)


    ## Configure the package manager


    A network mirror can be used to supplement the software that is included on the
    CD-ROM. This may also make newer versions of software available.


    Use a network mirror?


    - No

    - Yes


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_24_1.png)


    - 9. Next, install GRUB.


    # KALI LINUX


    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_25_0.png)


    ## Install the GRUB boot loader on a hard disk


    It seems that this new installation is the only operating system on your computer.
    If so, it should be safe to install the GRUB boot loader to the master boot record
    of your first hard drive.


    Warning: If the installer failed to detect another operating system that is present
    on your computer, modifying the master boot record will make that operating system
    temporarily unbootable, though GRUB can be manually configured later to boot it.


    Install the GRUB boot loader to the master boot record?


    - No

    - Yes


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_25_1.png)


    Go Back Continue


    - 10. Finally, click Continue to reboot into your new Kali installation.


    # KALI LINUX


    Official Kali Linux Documentation

    This PDF has been autogenerated on docs.kali.org - Aug 19, 2013


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_26_0.png)


    ## Finish the installation


    > installation complete

    Installation is complete, so it is time to boot into your new system. Make sure
    to remove the installation media (CD-ROM, floppies), so that you boot into the
    new system rather than restarting the installation.


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_26_1.png)


    # Post Installation


    Now that you''ve completed installing Kali Linux, it''s time to customize your
    system. The Kali General Use section of our site has more information and you
    can also find tips on how to get the most of Kali in our User Forums.


    # Dual Boot Kali with Windows


    # Kali Linux Dual Boot with Windows


    Installing Kali alongside a Windows installation can be quite useful. However,
    you need to exercise caution during the setup process. First, make sure that you''ve
    backed up any important data on your Windows installation. Since you''ll be modifying
    your hard drive, you''ll want to store this backup on external media. Once you''ve
    completed the backup, we recommend you peruse Kali Linux Hard Disk Install, which
    explains the normal procedure for a basic Kali install.


    In our example, we will be installing Kali Linux alongside an installation of
    Windows 7, which is currently taking 100% of the disk space in our computer. We
    will start by resizing our Windows partition to occupy less space and then proceed
    to install Kali in the newly-created empty partition.

