    # Install Kali ARM on MK/SS808


    ![](img/a9ef2e82e60ca0e2c1f6c67b184f6420_88_0.png)


    # SS808 ARM Devices (rk3306)


    The Smart SS808 is a rockchip-based ARM device that comes in various forms and
    flavors. It has a dual-core 1.6 GHz processor with 1 GB of RAM and runs Kali very
    well.


    # Stock Kali on SS808 - Easy Version


    If all you want do is to install Kali on SS808, follow instructions below:


    - Get a fast 8 GB (or more) microSD card. Class 10 cards are highly recommended.

    - Download the Kali Linux SS808 image from our [downloads](https://docs.kali.org)
    area.

    - Use the `dd` utility to image this file to your microSD card. In our example,
    we assume the storage device is located at /dev/sdb and are using SS808 device.
    **Change as needed.**

    - Download the [MK808-Finless-1.6-Custom-ROM](https://docs.kali.org) to a Windows
    machine and extract the zip file.

    - Read the README file the MK808 Finless ROM tool, and ensure that it says "Android
    Loader" at the bottom. Deselect kernel.img and recovery.img from the list, and
    flash the device.

    - Next overwrite both kernel.img and recovery.img in the Finless ROM directory
    with "kernel.img".

    - In the Finless ROM tool, make sure only "kernel.img" and "recovery.img" are
    selected, and flash your device again.

    - Insert your microSD card in the SS808 and boot it up.


    > **Alert!** This process will wipe out your SD card! If you choose the wrong
    storage device, you may wipe out your computer''s hard disk.


    ```

    dd if=kali-SS808.img of=/dev/sdb bs=1M

    ```


    This process can take a while depending on your USB storage device speed and image
    size. Once the dd operation is done, boot up your SS808, with the microSD card
    plugged in. Log in to Kali (root /toor) and **startx**. That''s it, you''re done!


    # Kali on SS808 - Long version


    If you are a developer and want to tinker with the Kali SS808 image, including
    changing the kernel configuration and generally being adventurous, check out our
    Custom MK/SS808 Image.


