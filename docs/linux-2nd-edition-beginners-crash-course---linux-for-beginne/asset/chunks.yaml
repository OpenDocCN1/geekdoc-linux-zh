    # Chapter 8: Command Line Tutorial


    Now you know what Linux is all about, it’s time to start actually using it. We’ll
    start with a basic command line tutorial, but first you need to know how to open
    the terminal. This isn’t hard, but all systems are different, so use this as a
    guideline only:


    - Mac users should open Applications, Utilities and then click on Terminal. A
    shortcut would be to press `Command+Space`, which will open Spotlight, after which
    you can type in the word `Terminal`. Click on the result when it shows up.

    - Linux users should look in `Applications>System` or `Applications>Utilities`.
    A shortcut is to right click on your desktop and look for the option to “Open
    in Terminal”. If it is there, click on it.

    - Windows users can simply type the word `Command` in the search bar on their
    start menu. Click on the option for `Command Prompt` and it will take you straight
    to it.


