    ls

    file1.txt file2.txt file3.txt even…

    cd /

    pwd

    /

    ls

    bin boot dev etc home lib var

    …

    cd ~/Documents

    pwd

    /home/Simon/Documents


    cd ../../

    pwd

    /home


    cd

    pwd

    /home/Simon

    ```


    ## Tab completion


    Repeatedly typing out these paths can become tedious and you may end up making
    errors. However, there is a neat mechanism in the command line that can help with
    this. It’s called tab completion. When you begin to type out a path, no matter
    where you are on the command line and what command you are using, you can press
    the `Tab` key to invoke auto-complete. If nothing changes, it means that there
    are a number of possibilities for completing the path. Pressing the `Tab` button
    again will show those possibilities. Continue typing your path and then hit `Tab`
    again to narrow the possibilities down to the right one. Have a go on your own
    command line and see how you get on.


    ## Files


    In Linux, everything is a file. Directories, text files, even your keyboard (but
    only one that your system can read from) – all of them are files. The monitor
    that your system writes to is a file as well. This isn’t going to have any effect
    on what you do, but you should keep it in mind to help you understand how Linux
    works.


    ### Extensionless system


    This might take some getting used to, but as you work your way through the programming,
    it will start to make sense. File extensions are usually a set of characters,
    between two and four, after a dot at the end of the file name. The extension tells
    you what the file type is. Some common extensions are:


    ● `file.exe` – a file or program that is executable

    ● `file.txt` – a file that is plain text

    ● `file.png` – an image file

    ● `file.gif` – an image file

    ● `file.jpg` – an image file


    In systems like Windows, the file extension is very important because the system
    uses it to see what file type it is dealing with. Linux is different in that it
    ignores the file extension, instead looking into the file itself to see what it
    is. As an example, you could take a `.jpg` file that you have on your system,
    perhaps a photo of your house, and change the extension to `.txt`. Linux would
    ignore that, look inside the file, and then treat it as the image file it actually
    is. But it isn’t always easy to determine what file type a file should be considered,
    and that’s where a little command named `file` comes in.


    ```

    file [path]

    ```


    Now, you might be thinking at this point, why has a command line been specified
    as a path instead of a file? Remember, when a file or a directory is specified
    on the command line, it is actually a path. Also, directories are nothing more
    than a specific type of file; a path is used to get us to a particular place in
    the system and that place is a file.


    ## Linux is case sensitive


    This is very important to remember, and is one of the biggest causes of the problems
    experienced by newcomers to Linux. Many operating systems are not sensitive to
    case, but Linux is, especially when you are referring to files. In Linux, it is
    perfectly possible to have two files or directories with names that are identical
    except for the cases, for example:


    ```

    ls Documents

    FILE1.txt File1.txt file1.TXT

    …

    file Documents/file1.txt

    Documents/file1.txt: ERROR: cannot open ''file1.txt'' (No such file or directory)

    ```


    Linux sees all of these as different files. You should also be aware of case when
    you are dealing with command line options. For example, with the `ls` command,
    there are two options – `S` and `s` – which do two different things. One of the
    most common mistakes is to enter options uppercase where they should be lowercase
    and then wonder why the output isn’t what you expected it to be.


    ## Spaces in names


    There is nothing wrong with having spaces in directory and file names, but you
    should be careful with them. A space on the command line is used to separate things
    – they are how we determine the program name and are able to identify the arguments
    on the command line. Let’s say that you wanted to move to a directory named Holiday
    Photos. This example would not work:


    ```

    ls Documents

    FILE1.txt File1.txt file1.TXT Holiday Photos

    …

    cd Holiday Photos

    bash: cd: Holiday: No such file or directory

    ```


    In this example, Holiday Photos is treated as two separate command line arguments.
    The command `cd` moves to the directory that is specified by the first argument
    only. To get round this and make it work, we need to let the terminal know that
    Holiday Photos is to be seen as a single command line argument. There are two
    equally valid ways we can do this.


    ### Quotes


    The first way is to enclose Holiday Photos in quote marks – single or double,
    it doesn’t matter which, so long as you use a matching pair. Anything that is
    written inside the quotes is treated as one single item:


    ```

    cd ''Holiday Photos''

    pwd

    /home/Simon/Documents/Holiday Photos

    ```


    ### Escape characters


    Another way is to use something called an escape character. This is a backslash
    (`\`) and what this does is nullify the special meaning that the next character
    has:


    ```

    cd Holiday\ Photos

    pwd

    /home/Simon/Documents/Holiday Photos

    ```


    In this example, the space that is between the words Holiday and Photo would usually
    have a special meaning – to separate them as individual command line arguments.
    However, putting the backslash in front nullified that meaning. If you use tab
    completion before you come across a space inserted in the directory name, the
    terminal will escape the space automatically for you.


    ## Hidden files & directories


    Linux has a very nice mechanism for telling you that a directory or file has been
    hidden. If the name of the file or directory starts with a dot (`.`) it is classed
    as hidden. There are no special commands or actions needed to hide a file or directory.
    There are a number of reasons why you might want to hide a file or directory.
    For example, you might have another user who hides their configuration fees so
    they don’t get in your way.


    To hide a file or directory, simply add a dot to the start of the name. If you
    have already created the file, simply rename it with a dot in the front. In the
    same way, you can remove the dot from a file or directory to unhide it.


    One thing to keep in mind – the `ls` command will NOT list any directories or
    files that are hidden unless you modify the command by adding the command line
    option `-a`. Only then will it list anything has been hidden.


    ```

    ls Documents

    FILE1.txt File1.txt file1.TXT

    …

    ls -a Documents

    . .. FILE1.txt File1.txt file1.TXT .hidden .file.txt

    …

    ```


