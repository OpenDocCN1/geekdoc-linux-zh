    # Chapter 5: Linux File Systems


    Whether you are using Linux or Windows, you will have to perform a partition before
    you can store any data. Whenever you format a partition in Linux, the operating
    system will write special data that is known as the file system on that partition.


    Every operating system supports its own set of file systems. Compared to Windows,
    Linux supports a wide range of file system types. Linux-supported file systems
    are listed in the table given below:


    | Filesystem | Description |

    | :--- | :--- |

    | coherent | A filesystem compatible with that used by Coherent Unix |

    | ext | The predecessor of the `ext2` filesystem; supported for compatibility
    |

    | ext2 | The standard Linux filesystem |

    | hpfs | A filesystem compatible with that used by IBM’s OS/2 |

    | iso9660 | The standard filesystem used on CD-ROMs |

    | minix | An old Linux filesystem, still occasionally used on floppy diskettes
    |

    | msdos | A filesystem compatible with Microsoft’s FAT filesystem, used by MS-DOS
    and Windows |

    | nfs | A filesystem compatible with Sun’s Network File System |

    | ntfs | A filesystem compatible with that used by Microsoft Windows NT’s NTFS
    filesystem |

    | sysv | A filesystem compatible with that used by AT&T’s System V Unix |

    | vfat | A filesystem compatible with Microsoft’s FAT32 filesystem, used by Windows
    9x |

    | xenix | A filesystem compatible with that used by Xenix |


    # Chapter 6: Inter-Process Communication


    Inter-process communication is a process where various communication protocols
    are used to share data between different processes. Servers and clients are two
    types of applications that use inter-process communication. In this application,
    the clients are mapped to single or multiple servers from whom they request information
    in the form of data. The server or servers send in the data. Different platforms
    provide different ways for the clients to access data. Below are the mechanisms
    that Linux provides for inter-process communication to take place:


    1. The kernel or processes send in signals to the process that they wish to communicate
    with. Signals are the cheapest forms of inter-process communication that the Linux
    platform provides, and can be in the form of events or states. Events and states
    both infer or notify that some change has occurred in the process of one process
    or kernel.


    2. `|` is called a pipe. It sets up by the shell that the platform uses to transfer
    input from one process to another. The two ends of the pipe are linked as a one
    to one communication mechanism with the help of file descriptors on both ends.
    These file descriptors are associated with single functionality that are read-only
    or write-only. The end from which the details are to be sent uses the reading
    file descriptor that reads the data from the process. Meanwhile, the end where
    the data has to be taken from will use the writing descriptor so that it can write
    the data received. Since the data flow is single-sided, the mechanism is known
    as a half duplex mechanism. Processes that have a parent-child relationship where
    the parents create the pipes to their children through which they can communicate
    with them and also create pipes between their children so that they can communicate
    between themselves can use these pipes. This happens because the file descriptors
    are copied into their address spaces.


    3. First-in first-out (`FIFO`) pipes are also known as named pipes, and are used
    in the same way as unnamed pipes. The only difference is that these are used when
    the processes are not related to each other. The processes using these pipes communicate
    using `FIFO` files instead of file descriptors. `FIFO` files have the same mechanism
    as file descriptors: one `FIFO` file has reading functionality and the other has
    writing functionality. Therefore this mechanism is also half-duplex.


    4. For single or multiple processes to read or write from single or multiple processes,
    we use message queues. This mechanism is similar to that of a post box. The process
    that wants to share the data comes and places the packet containing the data onto
    the message queue and leaves. The process that wants to take the data comes and
    takes the packet. This saves a lot of time, as the process sharing the data needn’t
    wait for the other process. There are two different specifications for message
    queues. First are `SysvV` message queues, where the messages that are being sent
    contain a number so that the process receiving the message can take the data matching
    a particular number or accept everything except the packet that matches a particular
    number. The second, `POSIX`, is a mechanism that works on priority. It sends the
    packets in their priority order. The priority number is attached with the packets
    when the process is sending them. So when the other process receives the details
    the data in the highest priority packet is taken first.


    5. There are counters that queue the order of processes that will receive the
    shared resources one after another. These counters are known as semaphores. They
    lock the shared resource so that only one process can access the shared resource.
    Once this process is done using the resource it is released. Then the process
    that is next in priority will get the resource, or the process that requested
    the resource irrespective of the priority will get the resource. This is similar
    to the `SysV` and `POSIX` mechanisms of the message queues, so these are known
    as `SysV` semaphores and `POSIX` semaphores.


    6. The mechanism in which multiple processes share the memory space available
    is known as the shared memory mechanism. This helps two or more processes that
    share the memory to communicate more efficiently so there is less interference
    of the kernel. There are also two types of shared memory, `SysV` shared memory
    and `POSIX` shared memory, and they work in the same way as above. That is, the
    priority is considered in one but not in the other.


    # Chapter 7: Linux Shell


    As you already know, a computer can only understand zeros and ones, i.e., binary
    language. In the first generation of computing, instructions were given directly
    in binary language. But binary language is extremely hard to understand, and writing
    code in it is time consuming and difficult. To solve this problem, a special program
    called the shell was introduced to operating systems. A shell accepts commands
    given in English and checks if they are valid. If a given command is valid, the
    shell passes it to the kernel. The shell is a command line interpreter. It can
    take input from a file or from a standard input device like a keyboard. Though
    the shell is not part of the kernel, it uses the kernel for creating files, executing
    programs etc.


    Most basically, the shell is an interface between the user and the system kernel,
    but the shell can execute some basic commands without passing them to the kernel.


    If you wish to know the available shells that are present in your system, use
    the following command:


    ```

    $ cat /etc/shells

    ```


    Though there are many shells available within an operating system, all of them
    are designed to do the same job. Different shells have different syntaxes and
    different built-in functions. In MS-DOS, `command.com` is a shell that the Windows
    operating system uses. It is less powerful than the shells present in Linux.

