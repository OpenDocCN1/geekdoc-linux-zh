    # 第 5 章：Linux 文件系统


    无论你使用的是 Linux 还是 Windows，在存储任何数据之前都必须进行分区。每当在 Linux 中格式化分区时，操作系统会在该分区上写入称为文件系统的特殊数据。


    每个操作系统都支持自己的一套文件系统。与 Windows 相比，Linux 支持多种类型的文件系统。Linux 支持的文件系统列如下表所示：


    | Filesystem | 描述 |

    | :--- | :--- |

    | coherent | 与 Coherent Unix 使用的文件系统兼容的文件 |

    | ext | `ext2` 文件系统的前身；为了兼容性而支持 |

    | ext2 | 标准的 Linux 文件系统 |

    | hpfs | 与 IBM OS/2 使用的文件系统兼容的文件 |

    | iso9660 | 用于 CD-ROM 的标准文件系统 |

    | minix | 一种旧的 Linux 文件系统，仍偶尔用于软盘 |

    | msdos | 与 Microsoft FAT 文件系统兼容的文件，供 MS-DOS 和 Windows 使用 |

    | nfs | 与 Sun 网络文件系统兼容的的文件系统 |

    | ntfs | 与 Microsoft Windows NT 的 NTFS 文件系统兼容的文件 |

    | sysv | 与 AT&T System V Unix 使用的文件系统兼容的文件 |

    | vfat | 与 Microsoft FAT32 文件系统兼容的文件，供 Windows 9x 使用 |

    | xenix | 与 Xenix 使用的文件系统兼容的文件 |


    # 第 6 章：进程间通信


    进程间通信是指各种通信协议在不同进程之间共享数据的过程。服务器和客户端是使用进程间通信的两种类型的应用程序。在这种应用中，客户端映射到单个或多个服务器，并向这些服务器以数据的形式请求信息。服务器或多个服务器发送数据。不同的平台为客户端提供了访问数据的不同方式。以下是
    Linux 为实现进程间通信提供的机制：


    1. 内核或进程向它们想要通信的进程发送信号。信号是 Linux 平台提供的最廉价的进程间通信形式，可以是事件或状态的形式。事件和状态都推断或通知某个进程或内核的处理过程中发生了某些变化。


    2. `|` 被称为管道。它由平台使用的 shell 设置，用于将输入从一个进程传输到另一个进程。管道的两个端在两端文件描述符的帮助下被链接为一种一对一的通信机制。这些文件描述符与单一的只读或只写功能相关。要发送细节的一端使用读取文件描述符来从进程中读取数据。同时，获取数据的一端将使用写入描述符，以便其能够写入接收到的数据。由于数据流是单向的，这种机制被称为半双机制。具有父子关系的进程可以使用这些管道，父进程为子进程创建管道以便与其通信，并并在子进程之间也创建管道以便它们之间进行通信。这种现象发生是因为文件描述符被复制到了它们的地址空间中。


    3. 先入先出（`FIFO`）管道也称为命名管道，其使用方式与无名管道相同。唯一的区别是，当进程之间互不相关时使用它们。使用这些管道的进程使用 `FIFO`
    文件而不是文件描述符进行通信。`FIFO` 文件具有与文件描述符相同的机制：一个 `FIFO` 文件具有读取功能，另一个具有写入功能。因此这种机制也是半双工的。


    4. 为了让单个或多个进程从单个或多个进程进行读写，我们使用消息队列。这种机制类似于信箱。想要共享数据的进程来并将包含数据的包放在消息队列上然后离开。想要获取数据的进程来并取出包。这节省了大量时间，因为共享数据的进程不需要等待另一个进程。消息队列有两种不同的规范。首先是
    `SysV` 消息队列，发送的消息包含一个数字，以便接收消息的进程可以获取匹配特定数字的数据或接受除匹配特定数字包之外的所有内容。其次，`POSIX`是一种基于优先级的机制。它按优先级顺序发送包。当进程发送包时，会将优先级数字附加在包上。因此，当另一个进程接收详细信息时，首先获取最高优先级包中的数据。


    5. 有计数器按顺序对接收共享资源的进程进行队列。这些计数器被称为信号量。它们锁定共享资源，使得只有一个进程可以访问共享资源。一旦该进程完成对资源的使用，资源就会被释放。然后，优先级下一个进程将获得资源，或者请求资源但不考虑优先级的进程将获得资源。这与
    `SysV` 和 `POSIX` 消息队列机制类似，因此它们被称为 `SysV` 信号量和 `POSIX` 信号量。


    6. 多个进程共享可用内存空间的机制被称为共享内存机制。这有助于共享内存的两个或多个进程更有效地通信，从而减少对内核的干扰。共享内存也有两种类型：`SysV`
    共享内存和 `POSIX` 共享内存，它们的工作方式与上述相同。也就是说，其中一种考虑优先级，而另一种则不考虑。


    # 第 7 章：Linux Shell


    如你所知，计算机只能理解 0 和 1，即二进制语言。在第一代计算中，指令直接以二进制语言给出。但二进制语言极难理解，用它编写代码既耗时又困难。为了解决这个问题，操作系统引入了一种称为
    shell 的特殊程序。shell 接受以英文输入的命令并检查它们是否有效。如果给定的命令有效，shell 将其传递给内核。shell 是命令行解释器。它可以从文件或从键盘等标准输入设备获取输入。虽然
    shell 不是内核的一部分，但它使用内核来创建文件、执行程序等。


    最根本的是，shell 是用户和系统内核之间的接口，但 shell 可以在不将它们传递给内核的情况下执行某些基本命令。


    如果你想知道系统中存在的可用 shell，请使用以下命令：


    ```

    $ cat /etc/shells

    ```


    尽管操作系统中有许多可用 shell，但它们都设计用于执行相同的工作。不同的 shell 有不同的语法和不同的内置函数。在 MS-DOS 中，`command.com`
    是 Windows 操作系统使用的 shell。它比 Linux 中存在的 shell 弱得多。


