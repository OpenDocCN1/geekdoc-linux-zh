- fmt: '

    In the last chapter we created some blank files. In this chapter we are going
    to look at a tool that helps us to put some content into those files and allows
    us to edit the content as well. `vi` is a nice text editor, something different
    from most of the text editors you have used in the past. It will take you a while
    to learn it but, once you have, you will see just how powerful it is.


    Essentially, `vi` is a command line editor. As you know by now, the command line
    is somewhat different from the Linux GUI. It is just one window where you input
    text and output text, that is all. `vi` works within those strict limitations,
    making it an extremely powerful editor. It is a plain text editor, similar to
    TextEdit on the Mac or Notepad on Windows. It is NOT a word processor, but it
    is more powerful than either of the aforementioned built-in editors.


    You do not need your mouse with `vi`; everything in done on the keyboard.


    There are two separate modes – Insert (input) and Edit. In the Insert mode, you
    type in content to go into a file. In Edit, you move around inside the file, and
    edit the content, as by deleting, searching, copying, replacing, saving, etc.
    One of the most common mistakes that people make is to start inputting commands
    without being in Edit mode or to start typing in their input without being in
    Insert mode. Do check before you start. That said, if you do make one of these
    mistakes, it is easy to recover from it.


    To run the `vi` text editor, you use a single command line argument, naming the
    file you want to edit:


    ```

    vi <file>

    ```


    If you don’t name a file, you can open it within, `vi` but it is actually easier
    to shut the editor down and start again. Do remember as well that you can use
    a relative or an absolute path to specify the file name.


    First of all, with your terminal open, move to the directory that you made called
    `linxtutorialwork`. We want to make some files, and we can store them here to
    keep them away from everything else you do.


    Now we need to edit your first file, so type this into the command line:


    ```bash

    vi firstfile

    ```


    When this command is run, it will open up the file, but if the file does not exist,
    it will create it before opening it up. When you get into `vi`, it may look a
    little like this (depending on what system you are running):


    ```

    ~

    ~

    ~

    ~

    ~

    "firstfile" [New File]

    ```


    Always start in Edit mode. In this case, we now want to go into Insert mode, so
    press `i`. You will see from the bottom left corner of your screen when you go
    into Insert mode.


    ```

    ~

    ~

    ~

    ~

    ~

    INSERT --

    ```


    Type in some text, anything you like, and press `Esc`. This takes you back into
    Edit mode.


    ## Saving & exiting


    There are a couple of ways to do this; just choose whichever method suits you,
    but do make sure that you are in Edit mode first by glancing at the bottom left
    corner of the screen. If it is blank, you are OK; if it says `INSERT` you need
    to get back into Edit mode first. To do this, you could just press `Esc` – if
    you are already in Edit mode, it won’t do anything. Then, to save and exit, type
    either of the following:


    - `:wq` + `Enter`

    - `ZZ`


    Most of `vi` commands will be executed as soon a a key sequence is entered. If
    a command begins with a colon (`:`) you will need to hit the `Enter` key for the
    command to be completed.


    Save and exit out of the file that you are in now.


    ## Other ways to view files


    You can edit files in `vi`, and you can also view files. However, there are a
    couple of other commands that are a bit better for doing that. The first is `cat`,
    short for concatenate. It is usually used to join two files together, but it can
    be used to view a file as well:


    ```bash

    cat <file>

    ```


    Running the `cat` command with just a single command line argument will let you
    see the file content on the screen, followed by the prompt. If you run the `cat`
    command with a command line argument, the cursor will move onto the next line
    but nothing else will happen. If you type in some text and then press Enter, `cat`
    would mirror what you input onto the screen. You can get out of this by pressing
    `Ctrl+C`, which is the Cancel signal in Linux. (You can use this to get out of
    most trouble that you get into in Linux.)


    ```bash

    cat firstfile

    # here you will see

    # whatever content you entered in your file

    ```


    This is a neat command to use if you only have a small file to look at, but when
    the files are larger, the content will fly across your screen and you will only
    be able to view the last page. To view larger files, we use a different command
    called `less`:


    ```bash

    less <file>

    ```


    The `less` command lets you move through the file contents with the arrow keys.
    You can forward to the next page with the spacebar or you can press “b” to go
    back a page. When you are finished, just press “q” to quit.


    Try using both of those commands on the file you created and see how you get on
    with them.


    ## Navigating a file in vi


    Now, go back to that file and input some more content. While you are in Insert
    mode, you can use the arrow keys to get around. Type in two more paragraphs and
    then press `Esc` so you go back into Edit mode.


    The following list shows some of the commands that can be used to traverse through
    a file; practice with them and get to grips with how they work:


    - Arrow keys – move the cursor around

    - `j`, `k`, `h`, `l` – move the cursor down, up, left and right (similar to the
    arrow keys)

    - `^` (caret) – move cursor to beginning of current line

    - `$` – move cursor to end of the current line

    - `nG` – move to the nth line (e.g., `5G` moves to 5th line)

    - `G` – move to the last line

    - `w` – move to the beginning of the next word

    - `nw` – move forward n words (e.g., `2w` moves two words forward)

    - `b` – move to the beginning of the previous word

    - `nb` – move back n words

    - `{` – move backward one paragraph

    - `}` – move forward one paragraph


    ## Deleting content


    You now know a few ways to move around in `vi`. Deleting works in a similar way;
    there are a number of different delete commands that you can use to define what
    you want to delete. The list below shows some of the ways to delete. Practice
    with them, but only after you have read the section on how to undo a deletion:


    - `x` – delete a single character

    - `nx` – delete n characters (e.g., `5x` deletes five characters)

    - `dd` – delete the current line

    - `dn` – `d` followed by a movement command. Delete to where the movement command
    would have taken you (e.g., `d5w` means delete 5 words).


    ### Undoing


    It is a fairly easy process to undo a delete in `vi`; just use the letter “u”.


    - `u` – Undo the last action (you can keep pressing `u` to keep undoing)

    - `U` (Note: capital) – Undo all changes to the current line


    ## Taking it further


    Now you know how to insert content, delete it, undo the delete, save it and then
    exit. This is how to do basic editing work in `vi`. While we can’t go into all
    the details of `vi` here, you should explore these other features of the text
    editor on your own:


    - copy and paste

    - search and replace

    - buffers

    - markers

    - ranges

    - settings


    Have fun; learning `vi` will be painful at times, but once you have gotten to
    grips with it, you won’t want to use any other text editor.


    # Conclusion


    Not many years ago, Linux was just a word that computer geeks used to enhance
    their resumes. But nowadays, you can find Linux in almost all of the data centers
    and servers in the world. The Linux operating system is pretty straightforward
    and it is not as complex as other operating systems. Linux is available free of
    charge, which makes it available for everyone who wishes to learn it. Once you
    install Linux on your computer, you become part of a huge Linux community where
    you can learn everything about Linux from people who are willing to help newbies
    like you.

