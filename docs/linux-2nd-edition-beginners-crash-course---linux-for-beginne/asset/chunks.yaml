    combinations. These numbers can also be shown in binary, which has just two symbols
    – 0 and 1\. The table below shows how we map from octal to binary:


    | OCTAL | BINARY |


    | 0 | 000 |


    | 1 | 001 |


    | 2 | 010 |


    | 3 | 011 |


    | 4 | 100 |


    | 5 | 101 |


    | 6 | 110 |


    | 7 | 111 |


    Now, all of the octal values can also be represented with three binary bits, and
    every combination of ones and zeros has been included. Now we have three permissions
    and three bits. The 1 represents on and the 0 represents off, and with that, we
    can use a single octal number to represent a specific set of permissions for a
    specific set of people. Using three numbers we can set permissions for the owner,
    the group and others. Let’s have a look at an example – don’t forget to refer
    to the above table to see how it all works:


    ls -l frog.png


    -rw-r----x 1 harry users 2.7K Jan 4 07:32 frog.png


    chmod 751 frog.png


    ls -l frog.png


    -rwxr-x--x 1 harry users 2.7K Jan 4 07:32 frog.png


    chmod 240 frog.png


    ls -l frog.png


    --w-r----- 1 harry users 2.7K Jan 4 07:32 frog.png


    One convenient method is to remember a common sequence for different file types,
    e.g., 750 and 755 are used for scripts.


    ### Permissions for directories


    We can use the same permissions for directories, but they will behave a little
    differently:


    ● r – You have the ability to read the contents of the directory (i.e., do an
    ls).


    ● w – You have the ability to write into the directory (i.e., create files and
    directories).


    ● x – You have the ability to enter that directory (i.e., cd).


    Let’s look at some examples of how these work:


    ls testdir


    file1 file2 file3


    chmod 400 testdir


    ls -ld testdir


    -r-------- 1 Simon users 2.7K Jan 4 07:32 testdir


    cd testdir


    cd: testdir: Permission denied


    ls testdir


    file1 file2 file3


    chmod 100 testdir


    ls -ld testdir


    ---x------ 1 Simon users 2.7K Jan 4 07:32 testdir


    cd testdir


    ls testdir


    ls: cannot open directory testdir/: Permission denied


    When we ran ls on lines 5 and 14, we included the option –d, which means directory.
    Normally, if ls is given an argument that is a directory, it will show the contents
    for the given directory as an output. However, in this example, what we have asked
    for is to see the permissions for the given directory, and that is what we have
    been shown.


    Permissions can seem somewhat confusing to start with, but you just need to remember
    that these particular ones are for the directory and not the files that are contained
    in it. For example, if you have a directory that you do not have a read permission
    for, that contains a file that you do have the read permission for, then provided
    you know that the file is there and you know its name, you are still able to read
    the file:


    ls -ld testdir


    --x------- 1 Simon users 2.7K Jan 4 07:32 testdir


    cd testdir


    ls testdir


    ls: cannot open directory .: Permission denied


    cat samplefile.txt


    Kyle 20


    Stan 11


    Kenny 37


    ## The root user


    There are just two people who can change the file or directory permissions: the
    owner for the specific directory or file and the root user. This super user has
    access everything and can do anything. Usually, only a system administrator has
    access to the root account, and he uses it to keep the system maintained. Normal
    users generally only have access to their own files and directories, those located
    in their home directory, and perhaps a couple of others that are being shared
    or that they are collaborating on with other users. This is how the stability
    and the security of the system are maintained.


    ## Basic security


    Your space is your home directory and it is up to you to make sure that it remains
    yours. Most users tend to give themselves full permissions for read, write and
    execute in their home directory and will not give permissions to the group or
    to others. However, everyone has a different setup.


    To maintain security, you should refrain from giving write access to your home
    directory to anyone in the group or others. However, being able to execute without
    read permission can be handy at times. This allows others to get to your home
    directory, but they will not be able to see what is contained in it. One good
    example of this is when it is used for personal web pages. Systems typically run
    web servers and each user is given their own bit of space. If you put a directory
    into your home directory and call it public_html, the webserver will generally
    be able to read the contents and display them. However, because the webserver
    is a different user, it will not be able to access and read the files. This is
    where you might want to give execute permissions on the home directory so that
    the webserver can do its job.


