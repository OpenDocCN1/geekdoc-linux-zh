  trans: '


    所有的 Shell 都通过文件或键盘等输入设备接收用户输入的命令，并向 Linux 操作系统传递信息，说明用户的需求。


    如果用户使用键盘等输入设备给出命令，则被称为命令行界面（CLI）。下下方的命令显示了你当前正在使用的 Shell：


    ```

    $ echo $SHELL

    ```


    # Shell 脚本


    所有的 Shell 都是交互式的，这意味着它们接受用户的命令并可以执行这些命令。你可以一个一个地给出命令，也可以将它们按顺序全部存储在一个文本文件中，并交给
    Shell 执行。一次性给出所有命令被称为 Shell 脚本编写（shell scripting）。


    Shell 脚本通常定义如下：


    “Shell 脚本是编写在纯文本文件中的系列命令。Shell 脚本就像 MS-DOS 中的批处理文件，但它比 MS-DOS 批处理文件强大得多。”


    ### 编写 脚本的原因


    - 你可以直接或通过文件向 Shell 脚本提供输入，它会在屏幕上输出结果。

    - 你可以使用 Shell 脚本创建自己的命令。

    - Shell 脚本通过一次性执行所有命令来为你节省大量时间。

    - Shell 脚本可用于自动化日常任务。

    - 你还可以使用 Shell 脚本实现系统管理的自动化。


    ### 如何编写 Shell 脚本


    编写 Shell 脚本时，请遵循以下步骤：


    - 使用编辑器如 `mcedit` 或 `vi`。

    - 在 Shell 脚本中编写一组命令后，你应该使用 `chmod permission your-script-name` 为准备好的脚本设置执行权限。例如，
    `$ chmod +x your-script-name` 或 `$ chmod 755 your-script-name`。系统管理员或所有者应具有读/写/执行权限（7）。设置组权限时，你应该只使用读取和执行权限（5）。

    - 现在，你应该按照下面的语法执行你编写的脚本：


    语法：

    ```

    bash your-script-name

    sh your-script-name

    ./your-script-name

    ```


    示例：

    ```

    $ bash bar

    $ sh bar

    $ ./bar

    ```


    - 注意，`./` 表示当前工作目录，点 `.` 表示在当前 Shell 中执行给定的命令文件，而不初始化新的 Shell 副本。使用点的语法为 `. command-name;`；例如，`$
    . foo`。


    - 现在你可以使用 `vi` 命令列表编写一个名为 `First Shell` 的新 Shell 脚本（或任何其他编辑器）：


    ```

    $ vi first

    #

    # My first shell script

    #

    clear

    echo "First Shell"

    ```


    - 保存脚本后，你可以通过 `$ ./first` 运行它，但你必须先用 `$ chmod 755 first` 设置权限。现在当你输入 `$ ./first`
    时，屏幕会被清空，然后打印出 Shell 脚本中给的消息：


    输出：`First Shell`


    | 脚本命令 | 含义 |

    | :--- | :--- |

    | `$ vi first` | 启动 vi 编辑器 |

    | `# # My first shell script #` | `#` 后面跟随任何文本都会被视为注释。注释提供了关于脚本的更多信息；它是对 Shell
    脚本的逻辑解释。语法：`# comment-text` |

    | `clear` | 清除屏幕 |

    | `echo "First Shell"` | 在屏幕上打印消息或变量值，我们使用 `echo` 命令。echo 命令的一形式如下：语法：`echo "Message"`
    |


    # 基础命令行编辑


    为了编辑和回溯命令，可以使用下面的组合键：


    - `CTRL + L`: 清除屏幕。

    - `CTRL + W`: 删除光标起始处的单词。

    - `CTRL + U`: 清除整行，即删除命令行中的所有单词。

    - `向上和向下方向键`: 回溯命令。

    - `Tab`: 自动完成文件、目录、命令名等。

    - `CTRL + R`: 搜索之前使用的命令。

    - `CTRL + C`: 取消当前运行的命令。

    - `CTRL + T`: 交换光标前最后两个字符。

    - `ESC + T`: 交换光标前最后两个单词。

    - `CTRL + H`: 删除光标起始处的字母。


    ### 执行命令


    要执行命令，只需在终端中输入它并按回车键。例如，`date` 命令将当前日期和时间作为输出，所以当你输入 `date` 并按回车时，你会得到类似 `Wed
    Jan 27 05:35:56 IST 2015` 的内容。


    # Bash 命令


    以下是来自 http://ss64.com/bash/ 的所有 bash 命令按字母排序列表：


    - `alias`: 创建别名

    - `apropos`: 搜索帮助手册页 (`man -k`)

    - `apt-get`: 搜索并安装软件包（Debian/Ubuntu）

    - `aptitude`: 搜索并安装软件包（Debian/Ubuntu）

    - `aspell`: 拼写检查器

    - `awk`: 查找并替换文本，数据库排序/验证/索引

    - `basename`: 从文件名中提取目录和后缀

    - `bash`: GNU Bourne-Again SHell

    - `bc`: 任意精度计算器语言

    - `bg`: 发到后台

    - `break`: 退出循环

    - `builtin`: 运行 shell 内置命令

    - `bzip2`: 压缩或解压命名文件

    - `cal`: 显示日历

    - `case`: 条件执行命令

    - `cat`: 合并并打印（显示）文件内容

    - `cd`: 目录

    - `cfdisk`: Linux 分区表操作

    - `chgrp`: 更改所有组

    - `chmod`: 更改访问权限

    - `chown`: 更改所有者组

    - `chroot`: 在不同的目录下运行命令

    - `config`: 系统服务（级别）

    - `cksum`: 打印 CRC 和计数

    - `clear`: 清除终端

    - `cmp`: 比较两个文件

    - `comm`: 按行比较排序后的文件

    - `cp`: 将一个或多个文件复制到另一个位置

    - `cron`: 执行命令的守护进程

    - `crontab`: 调度在稍后时间运行命令

    - `csplit`: 将文件分成上下文决定的部分

    - `cut`: 将文件分成部分

    - `date`: 显示或更改日期和时间

    - `dc`: 桌面计算器

    - `dd`: 转换并复制文件，写入磁盘头，引导记录

    - `ddrescue`: 数据恢复工具

    - `declare`: 声明变量并赋予属性

    - `df`: 显示空磁盘空间

    - `diff`: 显示两个文件之间的差异

    - `diff3`: 显示三个文件之间的差异

    - `dig`: DNS 查找

    - `dir`: 简单列出内容

    - `dircolors`: `ls` 的颜色设置

    - `dirname`: 将完整路径转换为路径

    - `dirs`: 显示目录列表

    - `dmesg`: 打印内核和驱动程序消息

    - `du`: 估算文件空间占用

    - `echo`: 在屏幕上显示消息

    - `egrep`: 搜索文件中匹配扩展表达式的行

    - `eject`: 弹出移动式介质

