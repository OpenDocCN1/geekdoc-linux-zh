    # 第 8 章：命令行教程


    现在你已经了解 Linux 是什么了，是时候开始实际使用它了。我们将从基础命令行教程开始，但首先你需要知道如何打开终端。这并不难，但所有的系统都不同，因此请仅将此作为指南：


    - Mac 用户应该打开“应用程序”(Applications)，“实用工具”(Utilities)，然后点击“终端”(Terminal)。快捷键是按下 `Command+Space`
    打开 Spotlight 搜索，然后输入单词 `Terminal`。在结果出现时点击它。

    - Linux 用户应该在 `Applications>System` 或 `Applications>Utilities` 中查找。快捷键是在桌面上右键点击，并寻找“在终端中打开”选项。如果有该选项，点击它。

    - Windows 用户可以直接在开始菜单的搜索栏中输入单词 `Command`。点击`命令提示符`(Command Prompt) 即可直接进入。


    ## 注释 / 备注


    描述后带有点（•）的命令是默认 shell 命令。


    ## 命令列表


    - `rename`: 重命名文件

    - `renice`: 更改运行进程的优先级

    - `remsync`: 通过电子邮件同步远程文件

    - `return`: 退出 shell 函数

    - `rev`: 反转文件行

    - `rm`: 删除文件

    - `rmdir`: 删除文件夹

    - `rsync`: 远程复制（同步文件树）

    - `screen`: 终端复用，通过 `ssh` 运行 shell

    - `scp`: 安全拷贝（远程文件复制）

    - `sdiff`: 交互式合并两个文件

    - `sed`: 流编辑器

    - `select`: 接受输入

    - `seq`: 打印数字序列

    - `set`: 操作变量和函数

    - `sftp`: 安全文件传输程序

    - `shift`: 移动位置参数

    - `shopt`: Shell 选项

    - `shutdown`: 机或重启 linux

    - `sleep`: 延迟指定时间

    - `slocate`: 查找文件

    - `sort`: 排序文本文件

    - `source`: 从文件运行命令 `.`

    - `split`: 将文件分割为固定大小的部分

    - `ssh`: 安全 Shell 客户端（远程登录程序）

    - `stat`: 显示文件或文件系统状态

    - `strace`: 跟踪系统调用和信号

    - `su`: 切换用户

    - `sudo`: 以其他用户身份执行命令

    - `sum`: 输出文件的校验和

    - `suspend`: 挂起此 shell 的执行

    - `sync`: 将磁盘数据与内存同步

    - `tail`: 输出文件的最后部分

    - `tar`: 在归档中存储、列表或提取文件

    - `tee`: 将输出重定向到多个文件

    - `test`: 评估条件表达式

    - `time`: 测量运行时间

    - `timeout`: 带时间限制运行命令

    - `times`: 用户和系统时间

    - `touch`: 修改文件时间戳

    - `top`: 列出系统上运行的进程

    - `put`: 设置终端相关属性、颜色、位置

    - `traceroute`: 追踪主机路由路径

    - `trap`: 在设置信号时运行命令 (bourne)

    - `tr`: 翻译、压缩和/或删除字符

    - `true`: 什么都不做，成功返回

    - `tsort`: 拓扑排序

    - `tty`: 在 `stdin` 上打印终端的文件名

    - `type`: 描述命令

    - `ulimit`: 限制资源

    - `umask`: 用户文件创建掩码

    - `umount`: 卸载设备

    - `unalias`: 别名

    - `uname`: 打印系统信息

    - `expand`: 将空格转换为制表符

    - `uniq`: 唯一文件处理

    - `units`: 将单位尺度转换为另一种

    - `unrar`: 从 rar 归档提取文件

    - `unset`: Remove 变量或函数

    - `unshar`: 解包 shell 脚本

    - `until`: 执行命令（直到错误）

    - `uptime`: 显示运行时间

    - `useradd`: 创建新用户账户

    - `userdel`: 删除用户账户

    - `usermod`: 修改用户账户

    - `users`: 列出当前登录的用户

    - `uuencode`: 编码二进制文件

    - `udecode`: 解码由 `uuencode` 创建的文件

    - `v`: 详细列表目录内容 (`ls -l -b`)

    - `vdir`: 详细列表目录内容

    - `vi`: 文本编辑器

    - `vmstat`: 报告虚拟内存统计

    - `wait`: 等待进程完成 •

    - `watch`: 定期执行/显示程序

    - `wc`: 打印字节、字和行数

    - `where`: 在用户的 `$path` 中搜索程序，查找帮助页

    - `which`: 在用户的 `$path` 中搜索程序

    - `while`: 执行命令

    - `who`: 打印所有登录的用户名

    - `whoami`: 打印当前用户和名称 (`id`)

    - `wget`: 通过 HTTP、FTP 获取网页或文件

    - `write`: 向另一个用户发送消息

    - `xargs`: 执行实用程序并传递参数列表

    - `xdg-open`: 在用户偏好的应用程序中打开文件或 URL

    - `yes`: 持续打印字符串直到被中断

    - `zip`: 打包并压缩（归档）文件

    - `.`: 在当前 shell 中运行命令脚本

    - `!!`: 再次运行上一个命令

