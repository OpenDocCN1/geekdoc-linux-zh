- fmt: '

    Line 1 always starts with the prompt with your username@bash. We also put a command
    in there – `ls` – and the command is always the first thing that you type. Following
    that are what we all command line arguments. Be aware that there must always be
    a space between the command and the first argument. The very first command line
    argument is `-l` and this is called an option. These are used to change the way
    the command behaves. They are always listed before any other argument and start
    with a dash (-).


    Lines 2 to 5 are outputs that come from running the command that you typed in.
    Nearly all commands will produce an output, and it will always be listed immediately
    under the command issued. A few commands just execute and don’t produce any information
    unless there is an error.


    Line 6 is the prompt again. Once the command has been run, the terminal is ready
    for use again and will display the prompt. If there is no prompt showing, the
    command is most likely still running.


    ## Shortcuts


    While the terminal may seem a little overwhelming at first, there is nothing to
    be worried about. Linux is packed full of handy shortcuts that will make things
    much easier and can also stop you from making mistakes like typographical errors.
    I will go through some of them as I go through this chapter so make a note of
    them as you come across them.


    Your first shortcut is this – whenever you enter a command it is stored in a history,
    and you can work your way through this history by using the up and down arrow
    keys. So you don’t need to type out commands that you have already typed; if you
    need to enter the same one again, simply use the arrow keys to find it. If you
    want to edit a command, use the left and right arrow keys to put the cursor where
    you need it to make the change.


    ## Basic navigation


    The very first command we’ll look at is `pwd`, which stands for Print Working
    Directory. (Many of the Linux commands are shortened to abbreviations and this
    makes it much easier to remember them.) This command does exactly what it says
    it does – prints the working directory to the screen. Give it a go:


    ```

    pwd

    /home/Simon

    ```


    Many of the commands that you type in on the terminal will only work if you’re
    in the right location. But as you will be moving around quite a bit, it will be
    easy to get lost. Simply typing `pwd` at the command prompt will tell you your
    location, so make use of it whenever you’re in doubt.


    The next thing you might want to know is what’s in your current location. The
    command to find that out is `ls`, which is short for list.


    ```

    ls

    bin Documents public_html

    ```


    Where `pwd` runs without arguments, `ls` has a bit more power. In this example,
    we haven’t given it any arguments, so that we just get a list of what is in the
    current location. But you can do more with it, for example:


    ```

    ls [options] [location]

    ```


    The `[]` square brackets indicate that the text inside them is optional so the
    command can run with them or without them. The example below show the `ls` command
    run in a number of different ways just to give you an idea of what it can do:


    ```

    ls

    bin Documents public_html

    ```


    This is `ls` in its absolute most basic format – the result is a list of the contents
    of the directory we are in.


    ```

    ls -l

    total 3

    drwxr-xr-x  2 Simon users 4096 Mar 23 13:34 bin

    drwxr-xr-x 18 Simon users 4096 Feb 17 09:12 Documents

    drwxr-xr-x  2 Simon users 4096 May 05 17:25 public_html

    ```


    Using `ls` with the command line option `-l` indicates that we want to do a long
    listing, which consists of:


    ● The first character indicates the file type – normal (-) or directory (d)

    ● The following nine characters are file or directory permissions

    ● The next field is the number of the blocks

    ● The next field indicates the file or directory owner

    ● The next field indicates the group that the directory or file belongs to

    ● Next is the size of the file

    ● Next is the file modification time

    ● Last is the name of the directory or file


    ```

    ls /etc

    a2ps.cfg aliases alsa.d cups fonts my.conf systemd

    …

    ```


    This time, `ls` is run with a command line argument, `/etc`, which is telling
    `ls` that it shouldn’t list the current directory; instead it should list the
    contents of the directory. (The ellipsis `…` indicates that some of the output
    has been cut out to save space; if you actually run this command, you will get
    a much longer listing of directories and files.)


    ```

    ls -l /etc

    total 3

    -rwxr-xr-x  2 root root 123 Mar 23 13:34 a2ps.cfg

    -rwxr-xr-x 18 root root 78 Feb 17 09:12 aliases

    drwxr-xr-x  2 Simon users 4096 May 05 17:25 alsa.d

    …

    ```


    Now `ls` is run with a command line option and a command line argument, resulting
    in a long listing of the directory `/etc`.


    ## Paths


    In these last commands, we started to introduce paths. It is important that you
    learn what these are and how to use them as you cannot be proficient in the Linux
    language until you do so. When we talk about a directory or a file on the command
    line, we are talking about a path. Just like in the physical world, a path is
    a way of getting somewhere, in this case to a specific directory or file on the
    system.


    ### Absolute & relative paths


    We use two different paths – absolute and relative – to refer to a directory or
    file. Either can be used, as they both take you to the same place. To start with,
    you need to understand that Linux has what’s known as hierarchical structure.
    Right at the top is the root directory. The root directory contains sub-directories,
    and so on. Any of these sub-directories can contain files.


    An absolute path specifies a particular file or directory relative to the root
    directory indicated by `/`. A relative path specifies a file or directory relative
    to your current location and does not start with a slash.


    Have a look at this example:


    ```

    pwd

    /home/Simon


    ls Documents

    file1.txt file2.txt file3.txt

    …

    ```


    Now `ls` is run with a relative path. But this command will give different results
    depending on where you are in the system. If you were in the home directory of
    another system user, it would provide you with a list of the contents of that
    user’s Documents directory.


    ```

    ls /home/Simon/Documents

    file1.txt file2.txt file3.txt

    …

    ```


    Finally, `ls` is run with an absolute path. This command is not reliant on where
    you are; the result will be exactly the same.


    ### Building blocks


    As you learn Linux, it will soon become apparent that there are loads of different
    ways to get things done. The following are building blocks, and they will help
    you to build up your paths:


    ● `~` (tilde) – A shortcut for the home directory. For example, if your home directory
    is called `/home/Simon`, you can refer to the Documents directory with the path
    `/home/Simon/Documents`, or you could just type `~/Documents`.

    ● `.` (dot) – A reference to the current directory. Take the earlier example where
    we referred to Documents with a relative path. We could also have written it as
    `./Documents`.

    ● `..` (dotdot) – A reference to the parent directory. This can be used any number
    of times in a single path if you want to keep on traversing upwards through the
    hierarchy. For example, if you were in `/home/Simon`, you could simply type in
    `ls../../` and you would get a listing of the root directory as your output.


    Now you can start to see that you can refer to locations in a number of ways.
    As to which way you should use, the answer is you can use any of them. If you
    make a reference to a directory or file on the command line, you are referring
    to a path, and that can be made up with any of the elements we talked about. The
    best way is whichever way you find the easiest.


    Have a look at these examples:


    ```

    pwd

    /home/Simon


    ls ~/Documents

    file1.txt file2.txt file3.txt

    …


    ls ./Documents

    file1.txt file2.txt file3.txt

    …

    ```

    '
