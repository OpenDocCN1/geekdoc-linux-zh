    ## Permissions


    There are three things that are dictated by a Linux permission – how you can read,
    write to, and execute a file. Each one is denoted with a single letter:


    ● `r` read – You may view the contents of the file.

    ● `w` write – You may change the contents of the file.

    ● `x` execute – You may execute or run the file if it is a program or script.


    For each file, we can define three different sets of people for whom we can specify
    permissions:


    ● `owner` – A single person who owns the file. (Typically the person who created
    the file, but ownership may be granted to someone else by certain users.)

    ● `group` – Every file belongs to a single group.

    ● `others` – Everyone else who is not in the group or the owner.


    So, that’s three permissions and three different sets of people. Really, that’s
    all there is to know about permissions, so let’s have a look at how we can view
    them and change them.


