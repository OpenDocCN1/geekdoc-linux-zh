    \n存在两种类型的实时操作系统：\n\n### 硬实时系统\n\n硬实时系统保证关键任务的准时完成。外存存储缺失或受到限制。数据可以以 `ROM` 格式存储。硬实时系统中没有虚拟内存。\n\
    \n### 软实时系统\n\n软实时系统的限制比硬实时系统少少。软实时系统会优先考虑关键任务，并保持这些优先级，直到每个任务完成。与硬实时系统相比，软实时系统的实用性相对有限。例如，像行星探测器和深海探索等先进科学项目可以使用软实时系统，它们也具有虚拟现实和多媒体应用。\n\
    \n# 第 2 章：Linux 的组件、特性与架构\n\nLinux 操作系统是最流行的 操作系统版本。Linux 基本上设计为兼容 `UNIX`，且这两个操作系统的功能非常相似。\n\
    \n## 组件\n\nLinux 操作系统有三个主要组件：\n\n● `Kernel` – 内核被认为是 Linux 操作系统的核心，负责系统的主要活动。内核直接与硬件交互，并在其内部包含各种模块。内核通过为应用程序或系统提供所需的抽象，隐藏了所有的底层硬件细节。\n\
    \n● `System Library` – 系统库可以被视为特殊的程序或函数，系统实用程序或应用程序通过它们来访问内核的功能。这些库可以实现几乎所有功能也由操作系统实现。系统库不需要内核模块的代码即可获得访问权限。\n\
    \n● `System Utility` – 系统实用程序是负责执行特定独立任务的程序。\n\n## 特性\n\n以下是 Linux 操作系统的一些重要特性：\n\
    \n● `Portable` – 可移植性意味着软件可以以相同的方式在不同类型的硬件上运行。Linux 内核和应用程序可以安装在任何种的硬件平台上。\n\n\
    ● `Open Source` – Linux 源代码免费可用。开发是一个基于社区的项目。多个团队协作工作以增强 Linux 操作系统的能力，并且它在不断演进。\n\
    \n● `Multi-User` – Linux 是一个多用户系统，意味着多个用户可以同时访问系统资源，如 `memory`/`RAM`/应用程序。 \n\n\
    ● `Multiprogramming` – Linux 是一个多程序系统，意味着多个应用程序可以同时运行。\n\n● `Hierarchical File\
    \ System` – Linux 提供了一个标准文件结构，系统文件/用户文件就排列在其中。\n\n● `Shell` – Linux 提供了一个特殊的解释器程序，可用于执行操作系统命令。它可以用于各种类型的操作、应用程序等。\n\
    \n● `Security` – Linux 使用身份验证功能（如密码保护/对特定文件的受控访问/数据加密）提供用户安全。\n\n## 架构\n\n以下层是\
    \ Linux 系统架构的一部分：\n\n● `Hardware`– 所有的外围设备，如硬盘、`CPU` 和 `RAM`，都是硬件层的一部分。\n\n● `Kernel`\
    \ – 内核是操作系统的主要或核心组件。它与系统硬件直接通信，为上层组件提供底层服务。\n\n● `Shell` – Shell 是用户与内核之间的接口。Shell\
    \ 接受用户提供的命令并执行内核函数。\n\n● `Utilities` – 实用程序是为用户提供操作系统大部分功能的程序。\n\n# 第 3 章：Linux\
    \ 内核\n\n在本章中，我们将学习 Linux 内核。Linux 内核是类似于 `UNIX` 的计算机操作系统。它在全球范围内被广泛使用。Linux 操作系统完全基于\
    \ Linux 内核。它通过 Linux 发行版部署在传统的计算机系统中，也部署在路由器等嵌入式设备上。运行手机和平电脑的 Android 移动操作系统也是使用\
    \ Linux 内核构建的。\n\n1991 年，芬兰计算机科学学生 Linus Torvalds 为个人使用创建了 Linux 内核。最初他没有在其他平台上使用它的打算，但他逐渐开发使其能够在不同的计算机架构上运行。近\
    \ 12,000 名软件开发者和 1,200 家公司为开发做出贡献。Linux 内核是开源软件，这意味着内核源代码可以被访问和修改。`LKML` 或 Linux\
    \ 内核邮件列表托管了有关开发的讨论。\n\n内核是用户应用程序与 CPU、内存和其他设备之间的接口。\n\nGNU 编译器集合 (`GCC`) 支持一个\
    \ C 语言版本（通过向标准 C 引入更改和扩展开发），该版本已用于编写 Linux 内核。除了 C 语言，汇编语言也被用于编写若干小部分代码。由于 `GCC`\
    \ 支持 C 的多种扩展，在一段时间内它是唯一具有构建 Linux 内核能力的编译器。\n\n## 内核源码\n\n内核源码可以在大多数 Linux 发行版中找到。安装到你的系统的\
    \ Linux 内核是使用这些源码开发的。它们可以在 `ftp://ftp.cs.helsinki.fi` 找到，并在其他网站上有镜像。如果你没有互联网访问，可以以合理的价格从提供知名网站快照的供应商处获取光盘。某些供应商还提供定期更新的订阅服务。你本地的\
    \ Linux 用户组是另一个极佳的选择。\n\n在源码树的最顶 `/usr/src/Linux` 可以找到几个目录：\n\n`Arch`: 特定于架构的内核代码存在此子目录中。它进一步划分为子目录，每个架构一个。`Alpha`\
    \ 和 `i386` 是子目录的示例。\n\n`Include`: 构建内核代码所需的包含文件存在此子目录。它也为每个架构划分了一个子目录。编辑内核 Makefile\
    \ 然后重新运行内核配置程序可以更改架构。\n\n`Init`: 内核的初始化代码存在此目录。为了理解内核的工作，这里可以很好的起点。\n\n`MM`: 与内存管理相关的文件存在此目录。每个架构的内存管理相关代码存在\
    \ `arch/*/mm/` 中。\n\n`Drivers`: 这包含系统的设备驱动，它们被分为不同的类别。\n\n`IPC`: 进程间通信代码存在此目录。\n\
    \n`Modules`: 模块由此目录创建并持有。\n\n"
- fmt: "\n**FS**: The code of the file system is present in this directory. This directory\
    \ has several subdivisions, one for each file system.\n\n- **Kernel**: This consists\
    \ of the kernel code. The kernel code specific to the architecture can be found\
    \ in `arch/*/kernel`.\n- **Net**: This is the networking code of the kernel.\n\
    - **Lib**: The library code of the kernel is present in this directory. The library\
    \ code specific to an architecture is present in `arch/*/lib/`.\n- **Scripts**:\
    \ The scripts that are used during the configuration of the kernel are present\
    \ in this directory.\n\n# Chapter 4: Linux Processes\n\n## task_struct\n\nFor\
    \ Linux to deal efficiently with the processes taking place in the system, a data\
    \ structure called `task_struct` is used to represent each of those processes.\
    \ (In Linux, the terms process and task are interchangeable.) The data structure\
    \ `task_struct` has an array of pointers known as the task vector.\n\nThe task\
    \ vector’s size limits the number of processes happening in the system. The maximum\
    \ number of entries is 512 by default. Creation of a new process results in the\
    \ allocation of a new `task_struct` from the memory. Adding it into the task vector\
    \ completes the creation. The current pointer points to the current running processes\
    \ so that they are easier to find.\n\nIn addition to the normal process, Linux\
    \ also supports real-time processes. These real-time processes are so named because\
    \ they are expected to respond very swiftly to external requests. The scheduler\
    \ treats them a bit differently than the normal processes. The complex data structure\
    \ `task_struct` is made simpler by dividing it into the following functional areas:\n\
    \n### State\n\nThe state of a process gets changed after its execution, depending\
    \ on the circumstances. Each Linux process has one of the following states:\n\n\
    #### Running\nIn this state, the process is ready to run or is currently running\
    \ in the system. Ready to run means the process is ready to be taken up by one\
    \ of the system processors for execution.\n\n#### Waiting\nThe waiting state means\
    \ the process is waiting for a resource or for the occurrence of an event. Waiting\
    \ processes are differentiated into two types: interruptible and uninterruptible.\
    \ Signals can interrupt certain waiting processes, which are termed interruptible;\
    \ waiting processes which the signals cannot interrupt are termed uninterruptible.\n\
    \n#### Stopped\nA stopped process has, of course, been stopped, usually by receiving\
    \ a signal. A process needs to be in the stopped state to be debugged.\n\n####\
    \ Zombie\nThis is a dead process consisting of the data structure `task_struct`\
    \ in the task vector. Hence, it is known as a zombie.\n\n### Scheduling information\n\
    \nThis is the information which the scheduler uses to decide the order in which\
    \ the processes should run.\n\n### Identifiers\n\nA numerical process identifier\
    \ identifies every process in a system.\n\n## Inter-process communication (IPC)\n\
    \nThe important IPC mechanisms supported by Linux are signals, pipes, message\
    \ queues, shared memory, semaphores etc.; you will learn them in detail in following\
    \ chapters.\n\n## Links\n\nProcesses are not independent of one another in a system\
    \ running on Linux. All processes have parent processes. The only process that\
    \ does not have a parent process is the initial process. No new processes are\
    \ created; instead, they are cloned from processes that have occurred previously.\
    \ The task structure that represents a process points to the parent process and\
    \ also to the siblings (processes that share the same parent). The `pstree` command\
    \ can be used to view the relationships that run between the processes:\n\n```\n\
    init(1)-+-crond(98)\n      |-emacs(387)\n      |-gpm(146)\n      |-inetd(110)\n\
    \      |-kerneld(18)\n      |-kflushd(2)\n      |-klogd(87)\n      |-kswapd(3)\n\
    \      |-login(160)---bash(192)---emacs(225)\n      |-lpd(121)\n      |-mingetty(161)\n\
    \      |-mingetty(162)\n      |-mingetty(163)\n      |-mingetty(164)\n      |-login(403)---bash(404)---pstree(594)\n\
    \      |-sendmail(134)\n      |-syslogd(78)\n      `-update(166)\n```\n\n## Times\
    \ & timers\n\nAnother important duty of the kernel is keeping track of the time\
    \ taken for creating a process. It also keeps track of the CPU time consumed by\
    \ the process during its lifespan. As the clock ticks, the kernel keeps on updating\
    \ the time spent by the current process in the system.\n\n## File systems\n\n\
    Linux is very flexible when it comes to supporting a wide variety of file systems.\
    \ This helps it coexist with other popular operating systems. Linux supports a\
    \ total of 15 file systems. They are:\n\n- ext\n- ext2\n- vfat\n- affs\n- minix\n\
    - sysv\n- hpfs\n- ncp\n- umsdos\n- iso960\n- ufs\n- xia\n- msd\n- proc\n- smb\n\
    \nMany more file systems will be added in future.\n\n## Virtual memory\n\nLinux\
    \ uses virtual memory to manage memory efficiently. It allows each process to\
    \ have its own virtual address space.\n\n## Processor specific context\n\nOne\
    \ can think of the process as an aggregate of the registers, stacks etc., in the\
    \ `task_struct`. When a process is suspended, the context must be saved.\n\n##\
    \ How Linux organizes data\n\nAn effective operating system should organize its\
    \ data well. If you have worked with other operating systems, like Windows, you’ll\
    \ probably find it easy, because most operating systems organize their data in\
    \ similar ways. The kernel can create many pseudo-devices that act like devices.\
    \ Linux receives, stores, and sends its data to and from devices. A given hardware\
    \ unit can have more than one device; for example, the Linux system will show\
    \ the partitions of a disk as separate devices.\n\n### Devices\n\nDevices correspond\
    \ to hardware. Some of the typical Linux devices are listed in the table below:\n\
    \n| Device | Description |\n| :--- | :--- |\n| atibm | Bus mouse |\n| audio |\
    \ Sound card |\n| cdrom | CD-ROM drive |\n| console | Current virtual console\
    \ |\n| fd n | Floppy drive (n designates the drive; example, fd0 is the first\
    \ floppy drive) |\n| ftape | Streaming tape drive not rewind |\n| hd xn | Non-SCSI\
    \ hard drive (x designates the drive and n designates the partition; example,\
    \ hda1 is the first partition of the first non-SCSI hard drive) |\n| inportbm\
    \ | Bus mouse |\n| lp n | Parallel port (n designates the device number; example,\
    \ lp0 is the first parallel port) |\n| modem | Modem |\n| mouse | Mouse |\n| nftape\
    \ | Streaming tape drive supporting rewind |\n| nrft n | Streaming tape drive\
    \ supporting rewind (n designates the device number; example, nrft0 is the first\
    \ streaming tape drive) |\n| nst n | Streaming SCSI tape drive not supporting\
    \ rewind (n designates the device number; example, nst0 is the first streaming\
    \ SCSI tape drive) |\n| null | Pseudo-device that accepts unlimited output |\n\
    | printer | Printer |\n| psaux | Auxiliary pointing device, such as a trackball,\
    \ or the knob on IBM's ThinkPad |\n| rft n | Streaming tape drive not supporting\
    \ rewind (n designates the device number; example, rft0 is the first streaming\
    \ tape drive) |\n| scd n | SCSI device (n designates the device number; example,\
    \ scd0 is the first SCSI device) |\n| sd xn | SCSI hard drive (x designates the\
    \ drive and n designates the partition; example, sda1 is the first partition of\
    \ the first SCSI hard drive) |\n| sr n | SCSI CD-ROM (n designates the drive;\
    \ example, sr0 is the first SCSI CD-ROM) |\n"
