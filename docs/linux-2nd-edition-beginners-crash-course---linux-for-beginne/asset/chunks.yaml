- fmt: '

    All shells take commands from the user through a file or an input device such
    as a keyboard and convey messages to the Linux operating system saying what the
    user requires.


    If the user gives the command using an input device like a keyboard, it is known
    as the command line interface. The command given below shows the current shells
    on which you are working:


    ```

    $ echo $SHELL

    ```


    # Shell scripts


    All shells are interactive, which means that they accept commands from the user,
    and can execute them. You can either give your commands one after another or you
    can store them all in a sequence in a text file and give this to the shell to
    execute. Giving the commands all at once is called shell scripting.


    Shell scripts are commonly defined as follows:


    “A shell script is a series of commands written in a plain text file. A shell
    script is just like a batch file in MS-DOS, but it has more power than the MS-DOS
    batch file.”


    ### Reasons to write shell scripts


    - You can give input to a shell script directly or through a file, and it will
    give the output on the screen.

    - You can create your own commands using shell scripts.

    - Shell scripting will save you a lot of time by taking all the commands at once.

    - Shell scripting can be used for automating day-to-day tasks.

    - You can also automate system administration using shell scripting.


    ### How to write shell scripts


    When writing a shell script, follow these steps:


    - Use an editor such as `mcedit` or `vi`.

    - After writing your set of commands in the shell script, you should set the execute
    permissions the script prepared with `chmod permission your-script-name`. For
    example, `$ chmod +x your-script-name` or `$ chmod 755 your-script-name`. The
    system admin or owner should have read/write/execute permission (7). When setting
    the permission for a group you should only use read and execute (5).

    - Now you should execute your written script following the syntax given below:


    syntax:

    ```

    bash your-script-name

    sh your-script-name

    ./your-script-name

    ```


    Examples:

    ```

    $ bash bar

    $ sh bar

    $ ./bar

    ```


    - Note that `./` indicates your current working directory and the dot `.` indicates
    the execution of the given command file present in the current shell without initializing
    a new copy of the shell. The syntax for using the dot is `. command-name;`; for
    example, `$ . foo`.


    - Now you can write your own new shell script called `First Shell` using the `vi`
    command list (or any other editor):


    ```

    $ vi first

    #

    # My first shell script

    #

    clear

    echo "First Shell"

    ```


    - After saving the script, you can run it with `$ ./first`, but first you have
    to set the permission with `$ chmod 755 first`. Now when you input `$ ./first`
    the screen will be cleared and then the message given in your shell script will
    be printed:


    Output: `First Shell`


    | Script Command(s) | Meaning |

    | :--- | :--- |

    | `$ vi first` | Start vi editor |

    | `# # My first shell script #` | `#` followed by any text is considered a comment.
    A comment gives more information about the script; it is a logical explanation
    about a shell script. Syntax: `# comment-text` |

    | `clear` | clear the screen |

    | `echo "First Shell"` | To print message or value of variables on screen, we
    use the `echo` command. The general form of echo command is as follows: syntax:
    `echo "Message"` |


    # Basic command line editing


    For editing and recalling commands, you can use the key combinations given below:


    - `CTRL + L`: Clears the screen.

    - `CTRL + W`: Delete the word starting at cursor.

    - `CTRL + U`: Clear the line i.e. Delete all words from command line.

    - `Up and Down arrow keys`: Recall commands.

    - `Tab`: Auto-complete files, directory, command names etc.

    - `CTRL + R`: Search through previously used commands.

    - `CTRL + C`: Cancel currently running commands.

    - `CTRL + T`: Swap the last two characters before the cursor.

    - `ESC + T`: Swap the last two words before the cursor.

    - `CTRL + H`: Delete the letter starting at cursor.


    ### Executing a command


    To execute a command, just type it on the terminal and press the enter key. For
    example, the `date` command will give the current date and time as output, so
    when you type `date` and press enter you get something like: `Wed Jan 27 05:35:56
    IST 2015`.


    # Bash shell commands


    Here is an alphabetical list of all the bash commands from http://ss64.com/bash/:


    - `alias`: Create an alias

    - `apropos`: Search Help manual pages (`man -k`)

    - `apt-get`: Search for and install software packages (Debian/Ubuntu)

