    Linux 曾被认为是一个不受主流的操作系统，在很一段时间内，它在强大的 Windows 阴影下默默无闻。但最近，Linux 在软件开发者和企业中赢得了广泛赞誉。这种
    Unix 变体曾经仅为极客和发烧友熟悉，现在在普通家庭电脑用户中也流行。


    Linux 是免费的，并且可以在不同的平台上运行。它一直在积累一个忠实的用户群，并日益吸引以下人群的兴趣：


    - ● 熟悉 Unix 并兴趣在个人电脑上运行它的的人

    - ● 对实验操作系统原理感兴趣的人

    - ● 想要获得最大控制权操作系统的的人

    - ● 不满 Microsoft Windows 的人


    管理 Linux 比使用 Windows 更困难，但 Linux 更加灵活，并拥有更多的配置选项。


    许多企业似乎也克服了对 Linux 的非理性疑虑，并将 Linux 应用于许多业务应用程序。由于 Linux 是开源的，公司在进行此类适配时无需担心许可问题。这使其成为一个非常有吸引力的提议。


    # 第 1 章：Linux 及其他操作系统


    如果你是一名计算机程序员，你已经了解 Linux 了。如果不是，你可能读过关于它的介绍，或者从朋友那里听过。无论如何，Linux 都是有趣的，你对 Linux
    了解得越多，关于它的有趣问题就越多。


    ## 什么是 Linux？


    通常来说，PC 用户分为两类。大多数人将电脑视为神奇的工具，用于浏览网页、玩游戏、看电影和听音乐等酷活动。他们甚至可能知道硬件组件，如 `RAM`、处理器以及音视频卡。但他们并不真正关心这些简单过程背后的复杂性。他们打开浏览器，输入地址，网站就不知怎么打开了。他们对了解它是如何发生的并不。


    然后是第二类人，他们实际上对内部运作原理感兴趣。几乎所有人都将操作系统视为额外的软件。其实不是。操作系统和硬件组件一样，是计算机的一个重要部分。在需要时，操作系统可以升级或更换为更合适的系统。


    ## Linux 的优势


    你可能会认为谈论 Linux 的人夸大了它有多么棒，但事实上，它与其他操作系统相比确实有许多真实优势。这些包括：


    ### 无崩溃性


    Linux 是一个不会崩溃的操作系统。当你使用 Linux 时，不会遇到屏幕光标冻结、系统突然崩溃或不重启系统就无法消除的错误信息。在 Linux 操作系统上运行的程序或应用程序可能会崩溃，但操作系统仍将运行。没有任何应用程序可以在崩溃时将其崩溃。在
    Linux 中，与其他操作系统不同，你只需在程序崩溃后清理并继续即可。Linux 无崩溃的可靠性在处理航天或核能等操作时是一项巨大的资产，因为在这些领域，你无法承担系统崩溃可能导致的巨大费用、受伤或死亡风险。


    ### 安全性


    Linux 的下一个优势是安全性。Linux 操作系统的安全性远高于有很多安全漏洞的 Windows。其原因是投入了多年大量的计算机科学研究。在 Linux
    中，如果你没有适当的权限，将不允许访问特定的硬件或系统中的特定文件夹。隐私可以设置为个人所有，他们只能访问自己的文件。`root` 用户将拥有整个系统的访问权限，并限制其他用户的访问。


    ### 免费且共享


    Linux 的另一个主要优点是它是免费的操作系统。更新将免费下载，当操作系统的新版本发布时，你可以无需额外费用即可替换当前版本。事实上，你实际上可以下载任何你版本的
    Linux。由于它是免费软件，可以在一组人之间共享。默认应用程序如图像查看器、音乐播放器、图像编辑器等都可以共享。这在 Windows 或大多数其他操作系统中是不可能的，因为复制此类应用程序并与他人共享会让你成为软件盗版。但在
    Linux 中，与其他用户共享软件是完全合法的——实际上是被鼓励的。


    ### 兼容性


    Linux 的另一个好处是它甚至可以在旧硬件上运行。你不需要像运行其他操作系统最新版本那样需要高性能、尖端的 PC。例如，Windows 的新版本需要新硬件才能运行。Linux
    操作系统即使在过时的硬件上也可以工作。因此，如果你想运行 Linux，就不需要新电脑。如果你在同一台硬件上安装 Linux 和任何其他操作系统，你可以亲身看到差异。Linux
    操作系统的运行会比 Windows 这样耗电的操作系统更快、更好。Linux 社区鼓励用户回收和重复使用组件，以充分利用现有硬件。你实际上可以通过旧电脑系统上安装
    Linux 让它重获新生。即使你不需要它，也可以把它送给没有电脑的朋友或家人。


    ### 灵活性


    Linux 操作系统极其灵活。Linux 运行在几乎 60% 的电脑上，并可以使用宽带网络连接。你可以将旧硬件变成 Web 服务器、邮件服务器、防火墙或你设想的任何其他。使用其他操作系统这样做将花费你巨额资金，因为你需要一台性能极高的计算机。


    ### Linux 社区


    但 Linux 最好的特性无疑是 Linux 社区。Linux 不仅仅是一个计算机操作系统。当你开始使用 Linux 时，你就成了遍布全球巨大社区的一部分。成为
    Linux 社区的一部分有其自己的优势。其中之一是无论你遇到什么问题，离找到解决方案都不远。该社区的大多数人都是 Linux 传教士，喜欢帮助他人解决问题。Linux
    社区的新成员被称为 newbies（新手），这听起来像是贬义，但实际上是从专业 Linux 程序员那里学习的好机会。这些程序员相信知识应该被自由共享，并乐意帮助他人学习
    Linux。当有人宣称自己的身份是 newbie 时，人们会花时间帮助他。毕竟，那些专业人士曾经也是 newbie。


    ## 操作系统的特征


    操作系统可以被视为计算机硬件与用户之间的接口或中介。操作系统为用户提供了一个环境，允许他们高效、方便地执行不同的程序。从技术上讲，操作系统是管理其运行的硬件并控制各种程序执行的软件。操作系统负责分配处理器、内存、设备和信息等服务和资源。Linux
    就是其中一种操作系统。任何操作系统的重要功能如下：


    - ● 内存管理

    - ● 设备管理

    - ● 处理器管理

    - ● 安全性

    - ● 文件管理

    - ● 系统性能的控制

    - ● 错误检测

    - ● 作业计费

    - ● 用户与其他软件之间的协调


    ### 内存管理


    内存管理是管理主存或主要内存。内存可以被视为一个巨大的字节或字数组，它有自己的地址。

