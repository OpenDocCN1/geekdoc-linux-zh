    例如：


    `man ls`


    # 名称

    `ls` - 列出目录内容


    # 概要

    `ls [option] ... [file] ...`


    ### 搜索

    你可以通过手册页搜索特定的关键词。当你需要提醒自己需要哪个命令时，这非常有帮助——即当你知道想做什么，但不确定需要使用哪条命令时。在找到你想要的内容之前，你可能需要尝试几次。你可能还会发现你搜索的特定关键词出现在多个页面中，这时你就必须筛选这些页面以找到正确的一个。语法如下：


    `man -k <search term>`


    你还可以在手册页内部进行搜索。当你处于某个页面并想搜索该页面上的内容时，按下正斜杠（`/`）键，然后输入搜索词。按回车键，结果就会出现。如果搜索词出现多次，你可以按‘n’在它们之间移动。


    ## 关于运行命令的更多信息

    精通 Linux 的很大程度上在于知道使用正确的命令行选项，来修改命令的行为以适应你的需求。大多数命令都有长格式版本和简写版本。例如，我们上面讨论过隐藏文件。我们可以使用命令
    `-a` 或者使用 `-all` 来列出所有目录项和任何隐藏文件。前者是简写版本，后者是长格式。你可以使用任何一个版本；它们没有区别，因为它们的作用是相同的。使用长格式有一个优势，那就是你可能会发现更容易记住你的命令在做什么。然而，简写方法的优势是你可以将多个命令链在一起：


    ```

    pwd

    /home/Simon

    ls -a

    ls --all

    ls -alh

    ```


    以长格式编写的命令行选项以双横杠（`--`）开头，而简写版本以单横杠（`-`）开头。通过在横杠后紧跟所有指示这些选项的字母，可以一次性调用多个选项。


    ## 创建目录

    随着时间的推移，你将积累大量数据。正如此，你应该使用 Linux 的层级系统创建一个目录系统来组织和管理这些数据。养成为新内容创建新目录并将现有文件存储在正确目录中的习惯。


    创建目录很容易的；我们只需要使用 `mkdir` 命令（它是 `make directory` 的缩写），如下所示：


    `mkdir [options] <Directory>`


    使用 `mkdir` 并提供一个目录名称，它就会为你创建它：


    ```

    pwd

    /home/Simon

    ls

    bin Documents public_html

    mkdir linuxtutorialwork

    ls

    bin Documents linuxtutorialwork public_html

    ```


    在上面的示例中，我们首先检查当前位置，然后运行列出命令，以便确切知道该目录包含什么。然后我们运行 `mkdir` 命令创建一个名为 `linuxtutorialwork`
    的目录。记住，当我们在命令行中提供目录名称时，我们提供的是路径。


    在接下来的示例中，我们看到了几种创建创建目录的方法：


    ```

    mkdir /home/Simon/foo

    mkdir ./blah

    mkdir ../dir1

    mkdir ~/linuxtutorialwork/dir2

    ```


    `mkdir` 有一些非常有用的选项。其中第一个是 `-p`，它告诉 `mkdir` 命令根据需要创建父目录。第二个是 `-v`，它命令 `mkdir` 告诉它正在做什么。


    这是一个带有 `-p` 选项的示例：


    ```

    mkdir -p linuxtutorialwork/foo/bar

    cd linuxtutorialwork/foo/bar

    pwd

    /home/Simon/linuxtutorialwork/foo/bar

    ```


    现在让我们看看使用 `-v` 选项的相同示例：


    ```

    mkdir -pv linuxtutorialwork/foo/bar

    mkdir: created directory ''linuxtutorialwork/foo''

    mkdir: created directory ''linuxtutorialwork/foo/bar''

    cd linuxtutorialwork/foo/bar

    pwd

    /home/Simon/linuxtutorialwork/foo/bar

    ```


    ## 删除目录

    创建一个新目录很容易，删除一个目录也很容易。请记住，当你在 Linux 上使用命令行删除东西时，没有“撤销”选项。所以，请务必小心，并养成在执行删除之前双重检查一切的习惯。我们用于删除目录的命令是
    `rmdir`，它是 `remove directory` 的缩写：


    `rmdir [options] <Directory>`


    这里需要记住两点：首先，`rmdir` 同时支持 `-p` 和 `-v` 选项；第二，在删除目录之前它必须是空的。


    ```

    rmdir linuxtutorialwork/foo/bar

    ls linuxtutorialwork/foo

    ```


    ## 创建空文件

    许多涉及数据操作的命令有一个特性：如果我们引用一个尚存在的目录，它们会为我们创建。我们可以使用名为 `touch` 的命令创建空文件：


    `touch [options] <filename>`


    例如：


    ```

    pwd

    /home/Simon/linuxtutorialwork

    ls

    foo

    touch example1

    ls

    example1 foo

    ```


