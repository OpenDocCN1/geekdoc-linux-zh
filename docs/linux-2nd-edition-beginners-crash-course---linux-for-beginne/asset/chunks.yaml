  trans: "\n\n**FS**: 文件系统的代码位于此目录。该目录有几个子目录，每个子目录对应一个文件系统。\n\n- **Kernel**: 这包含了内核代码。特定架构内核的代码可以在\
    \ `arch/*/kernel` 中找到。\n- **Net**: 这是内核的网络代码。\n- **Lib**: 内核的库代码位于此目录。特定架构的库代码位于\
    \ `arch/*/lib/`。\n- **Scripts**: 在内核配置期间使用的脚本位于此目录。\n\n# 第 4 章：Linux 进程\n\n##\
    \ task_struct\n\n为了让 Linux 高效地处理系统中运行的进程，使用名为 `task_struct` 的数据结构来表示每个进程。（在 Linux\
    \ 中，process 和 task 术语是可以互换的。）`task_struct` 数据结构包含一个名为任务向量（task vector）的指针数组。\n\
    \n任务向量的大小限制了系统中发生的进程数量。默认最大条目数为 512。创建新进程会导致从内存中分配一个新的 `task_struct`。将其添加到任务向量中即完成了创建。当前指针指向当前运行的进程，以便于查找。\n\
    \n除了普通进程外，Linux 还支持实时进程。这些实时进程之所以得此名，是因为它们预期会对外部请求做出迅速响应。调度器处理它们的方式与普通进程略不同。通过将复杂的\
    \ `task_struct` 数据结构划分为以下功能区域，使其变得简单：\n\n### State（状态）\n\n进程的状态根据执行情况发生改变。每个 Linux\
    \ 进程都有以下状态之一：\n\n#### Running（运行）\n在此状态下，进程准备就绪或正在系统中运行。准备就绪意味着进程已准备好被系统处理器之一接管执行。\n\
    \n#### Waiting（等待）\n等待状态意味着进程正在等待资源或事件的发生。等待进程分为两种类型：可中断和不可中断。信号可以中断某些等待进程，这些被称为可中断进程；信号无法中断的等待进程则被称为不可中断进程。\n\
    \n#### Stopped（停止）\n停止的进程显然已经停止了，通常是通过接收信号停止的。进程需要处于停止状态才能进行调试。\n\n#### Zombie（僵尸）\n\
    这是一个死去的进程，由任务向量中的 `task_struct` 数据结构组成。因此，它被称为僵尸。\n\n### Scheduling information（调度信息）\n\
    \n这是调度器用于决定进程运行顺序的信息。\n\n### Identifiers（标识符）\n\n数字进程标识符标识系统中的每一个进程。\n\n## Inter-process\
    \ communication (IPC）（进程间通信）\n\nLinux 支持的重要 IPC 机制包括信号、管道、消息队列、共享内存、信号量等；将在后续章节详细学习。\n\
    \n## Links（链接）\n\n在运行 Linux 的系统中，进程并非相互独立。所有进程都有父进程。唯一没有父进程的进程是初始进程。没有创建新进程；而是从之前发生的进程克隆出来的。表示进程的任务结构指向父进程，也指向兄弟进程（共享父进程的进程）。可以使用\
    \ `pstree` 命令查看进程之间运行的关系：\n\n```\ninit(1)-+-crond(98)\n      |-emacs(387)\n  \
    \    |-gpm(146)\n      |-inetd(110)\n      |-kerneld(18)\n      |-kflushd(2)\n\
    \      |-klogd(87)\n      |-kswapd(3)\n      |-login(160)---bash(192)---emacs(225)\n\
    \      |-lpd(121)\n      |-mingetty(161)\n      |-mingetty(162)\n      |-mingetty(163)\n\
    \      |-mingetty(164)\n      |-login(403)---bash(404)---pstree(594)\n      |-sendmail(134)\n\
    \      |-syslogd(78)\n      `-update(166)\n```\n\n## Times & timers（时间与计时器）\n\n\
    内核另一个重要职责是跟踪创建进程所花费的时间。它还跟踪进程在其生命周期内消耗的 CPU 时间。随着时钟移动，内核不断更新当前进程在系统中花费的时间。\n\n\
    ## File systems（文件系统）\n\nLinux 在支持各种文件系统方面非常灵活。这有助于它与其他流行的操作系统共存。Linux 总共支持 15\
    \ 种文件系统。它们是：\n\n- ext\n- ext2\n- vfat\n- affs\n- minix\n- sysv\n- hpfs\n- ncp\n\
    - umsdos\n- iso960\n- ufs\n- xia\n- msd\n- proc\n- smb\n\n未来还将添加更多文件系统。\n\n##\
    \ Virtual memory（虚拟内存）\n\nLinux 使用虚拟内存来高效管理内存。它允许每个进程拥有自己的虚拟地址空间。\n\n## Processor\
    \ specific context（处理器特定上下文）\n\n可以将进程看为 `task_struct` 中寄存器、栈等的集合。当进程被挂起时，必须保存上下文。\n\
    \n## How Linux organizes data（Linux 如何组织数据）\n\n高效的操作系统应该良好地组织数据。如果你用过其他操作系统（如\
    \ Windows），你可能会发现这很容易，因为大多数操作系统组织数据的方式相似。内核可以创建许多充当设备的伪设备。Linux 接收、存储并向设备收发数据。给定的硬件单元可以有多个设备；例如，Linux\
    \ 系统会将磁盘的分区显示为独立的设备。\n\n### Devices（设备）\n\n设备对应于硬件。下表列出了一些典型的 Linux 设备：\n\n| Device\
