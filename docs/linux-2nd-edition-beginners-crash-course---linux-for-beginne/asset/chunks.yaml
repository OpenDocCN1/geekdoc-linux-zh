    中，完全可能存在两个名称除大小写外完全相同的文件或目录，例如：


    ```

    ls Documents

    FILE1.txt File1.txt file1.TXT

    …

    file Documents/file1.txt

    Documents/file1.txt: ERROR: cannot open ''file1.txt'' (No such file or directory)

    ```


    Linux 将所有这些都视为不同的文件。在处理命令行选项时，你也应该注意大小写。例如，使用 `ls` 命令时，有两个选项——`S` 和 `s`，它们执行不同的任务。最常见的错误之一是在应该输入小写字母的地方输入了大写字母，然后纳奇为什么输出不符合你的预期。


    ## 名称中的空格


    在目录和文件名中使用空格没有问题，但你对它们要小心。命令行中的空格用于分隔内容——我们通过它们确定程序名并能够识别命令行上的参数。假设你想移动到一个名为 `Holiday
    Photos` 的目录。这个示例将不起作用：


    ```

    ls Documents

    FILE1.txt File1.txt file1.TXT Holiday Photos

    …

    cd Holiday Photos

    bash: cd: Holiday: No such file or directory

    ```


    在这个示例中，`Holiday Photos` 被视为两个独立的命令行参数。`cd` 命令只移动到第一个参数指定的目录。为了解决这个问题并使其生效，我们需要让终端知道
    `Holiday Photos` 被视为一个单一的命令行参数。有两种同样有效的方法可以做到。


    ### 引号


    第一种是将 `Holiday Photos` 包裹在引号中——单引号或双引号都可以，只要使用成对的即可。引号内的任何内容都会被视为一个单一项目：


    ```

    cd ''Holiday Photos''

    pwd

    /home/Simon/Documents/Holiday Photos

    ```


    ### 转义字符


    另一种方法是使用所谓的转义字符。这是一个反斜杠 (`\`)，它的作用是抵消下一个字符具有的特殊含义：


    ```

    cd Holiday\ Photos

    pwd

    /home/Simon/Documents/Holiday Photos

    ```


    在这个示例中，单词 `Holiday` 和 `Photo` 之间的空格通常具有特殊含义——将它们作为独立的命令行参数分隔。然而，在前面加上反斜杠抵消了该含义。如果你在遇到目录名中的空格之前使用
    Tab 补全，终端会自动为你转义空格。


    ## 隐藏文件与目录


    Linux 有一种非常好的机制来告诉你目录或文件已被隐藏。如果文件或目录的名字以点 (`.`) 开头，它就被归类为隐藏。隐藏文件或目录不需要特殊的命令或操作。你可能想要隐藏文件或目录有很多原因。例如，你可能有另一个用户隐藏了他们的配置文件以免干扰到你。


    要隐藏文件或目录，只需在名称开头添加一个点。如果你已经创建了文件，只需在前面加一个点重命名。同样，你可以删除文件或目录前面的点来取消隐藏。


    记住一点——`ls` 命令不会列出任何隐藏的目录或文件，除非你通过添加命令行选项 `-a` 来修改命令。只有这样，它才会列出所有隐藏的内容。


    ```

    ls Documents

    FILE1.txt File1.txt file1.TXT

    …

    ls -a Documents

    . .. FILE1.txt File1.txt file1.TXT .hidden .file.txt

    …

    ```


    ## 手动页


    Linux 提供了一组页面，告诉你有关于每一个命令的所有信息——它们是做什么的、如何工作、如何运行它们以及每个命令接受的命令行参数。对于 Linux 新手来说，其中一些可能有点难以理解，但它们是一致的。一旦你掌握了几个，它们就会对你产生意义，你会发现它们处理起来更方便。手动页通过以下命令调用：


    '
- fmt: '

    `man <command to look up>`


    For example:


    `man ls`


    # Name

    `ls` - list directory contents


    # Synopsis

    `ls [option] ... [file] ...`


    ### Searching

    You can search through the manual pages for a specific keyword. This is helpful
    if you need a reminder of what command you need – when you know what you want
    to do but aren’t certain of the command that you need to use. You might need to
    try this a few times before you find what you’re after. You also may find that
    the particular keyword you are searching for shows up in a number of pages, and
    then you’ll have to sift through them to find the right one. The syntax is:


    `man -k <search term>`


    You can also search inside of a manual page. While you are on a page and you want
    to search for something on that page, press the forward slash (`/`) button and
    follow it up with the search term. Press enter and your results will appear. If
    there are numerous instances of the search term, you can press ‘n’ to move through
    them.


    ## More on running commands

    Much of being good at Linux is knowing the right command line options to use to
    modify the way the commands behave to suit your requirements. Most commands have
    both a long and a shorthand version. For example, we talked about hidden files
    above. We can use the command `-a` or we can use `-all` to list all directory
    entries and any hidden files. The first is the shorthand version while the second
    is the longhand. You can use either version; it makes no difference because they
    both do the same thing. There is one advantage to using longhand, and that is
    that you may find it easier to remember what your commands are doing. However,
    an advantage of the shorthand method is that you can chain a number of commands
    together:


    ```

    pwd

    /home/Simon

    ls -a

    ls --all

    ls -alh

    ```


    Command line options written in longhand start with a pair of dashes (`--`) while
    the shorthand version starts with one single dash (`-`). The single dash can be
    used to invoke a number of options by putting all the letters that indicate these
    options together following the dash.


    ## Making a directory

    As time goes by, you will build up quite a lot of data. Because of this, you should
    create a system of directories to organize and manage it using Linux’s hierarchical
    system. Get into the habit of creating new directories for new stuff and storing
    existing files in their correct directory.


    Creating a directory is easy; we simply use the command `mkdir`, shorthand for
    make directory, as follows:


    `mkdir [options] <Directory>`


    Use `mkdir`, supply a directory name, and it will be created for you:


    ```

    pwd

    /home/Simon

    ls

    bin Documents public_html

    mkdir linuxtutorialwork

    ls

    bin Documents linuxtutorialwork public_html

    ```


    In the above example, we start off by checking our current location, then run
    a listing so that we know exactly what that directory contains. We then run the
    `mkdir` command and make a directory named `linuxtutorialwork`. Remember, when
    we give the directory name in the command line, we are giving a path.


    In the following examples we see a few more ways to create directories:


    ```

    mkdir /home/Simon/foo

    mkdir ./blah

    mkdir ../dir1

    mkdir ~/linuxtutorialwork/dir2

    ```


    There are some very useful options for `mkdir`. The first of these is `-p`, which
    is telling the command `mkdir` that it should create parent directories as necessary.
    The second is `-v`, which commands `mkdir` to tell us what it’s doing.


    Here’s an example with the `-p` option:


    ```

    mkdir -p linuxtutorialwork/foo/bar

    cd linuxtutorialwork/foo/bar

    pwd

    /home/Simon/linuxtutorialwork/foo/bar

    ```


    Now let’s look at the same example using the `-v` option as well:


    ```

    mkdir -pv linuxtutorialwork/foo/bar

    mkdir: created directory ''linuxtutorialwork/foo''

    mkdir: created directory ''linuxtutorialwork/foo/bar''

    cd linuxtutorialwork/foo/bar

    pwd

    /home/Simon/linuxtutorialwork/foo/bar

    ```


    ## Removing a directory

    It’s easy to make a new directory, and it is also very easy to delete one. Do
    keep in mind that there is no undo option when you delete something on Linux using
    the command line. So be careful and get into the habit of double-checking everything
    before you go ahead and delete. The command we use to delete a directory is `rmdir`,
    short for remove directory:


    `rmdir [options] <Directory>`


    There are two things to bear in mind here – first, `rmdir` supports both the `-p`
    and the `-v` options; and second, the directory has to be empty before you can
    delete it.


    ```

    rmdir linuxtutorialwork/foo/bar

    ls linuxtutorialwork/foo

    ```


    ## Creating a blank file

    A feature of many commands that are involved with the manipulation of data is
    that, if we refer to a directory that does not yet exist, they will create it
    for us. We can use this to create blank files with a command named `touch`:


    `touch [options] <filename>`


    For example:


    ```

    pwd

    /home/Simon/linuxtutorialwork

    ls

    foo

    touch example1

    ls

    example1 foo

    ```


    The `touch` command is used to modify the modification and access times on files.
    It isn’t always needed, but it can be helpful to use if you are testing a system
    that relies on file modification or file access times. What is important, as I
    said earlier, is that if you touch on a file or directory that does not exist,
    it will be created for you.


    Much of what we do in Linux cannot be done automatically, but when you know how
    a certain command behaves and some of the deeper aspects of the system, you can
    use the command in creative ways to get the outcome you desire.


    ## Copying a file or directory

    Sometimes you might want to make a copy of a directory or a file, for example
    if you’re about to make changes to it and you want a backup so that, if things
    do go wrong, all is not lost! The command for this is `cp`, which is short for
    copy:


    `cp [options] <source> <destination>`


    There are a number of options for this command, one of which I will demonstrate
    now:


    ```

    ls

    example1 foo

    cp example1 barney

    ls

    barney example1 foo

    ```


    Did you see that both the destination and the source are paths? These can be referred
    to using both relative and absolute paths, as per these examples:


    ```

    cp /home/Simon/linuxtutorialwork/example2 example3

    cp example2 ../../backups

    cp example2 ../../backups/example4

    cp /home/Simon/linuxtutorialwork/example2 /otherdir/foo/example5

    ```


    When you use the `cp` command, it can be either a path to a file or a path to
    a directory. If it goes to a file, a copy of the source will be created and it
    will be named by the filename that is specified in the destination path. If the
    path goes to a directory, the file will be copied into that directory and be named
    the same as the source.


    By default, `cp` only copies a file. If we use the option `-r`, which stands for
    Recursive, we can copy directories. Recursive means that you want to see a directory
    and you want to see all of the files and the directories contained in it. For
    the subdirectories, simply go into them and repeat the command, and so on:


    ```

    ls

    barney example1 foo

    cp foo foo2

    cp: omitting directory ''foo''

    cp -r foo foo2

    ls

    barney example1 foo foo2

    ```


    In this example, the files and the directories that are contained in the directory
    named `foo` are copied to `foo2`.


    ## Moving a file or directory

    If you want to move a directory or a file, you can do so with the command `mv`,
    which stands for move. It works in pretty much the same way as `cp`, with one
    small advantage – we don’t need to use the `-r` option to move a directory:


    `mv [options] <source> <destination>`


    For example:


    ```

    ls

    barney example1 foo foo2

    mkdir backups

    mv foo2 backups/foo3

    mv barney backups/

    ls

    backups example1 foo

    ```


    Let’s break that down. In line 3, a new directory called `backups` is created.
    In line 4, the directory called `foo2` is moved into the new `backups` directory
    and renamed `foo3`. Then the file called `barney` is moved to the directory called
    `backups`. It retains the same name because we didn’t give a new destination name.


    ## Renaming files & directories

