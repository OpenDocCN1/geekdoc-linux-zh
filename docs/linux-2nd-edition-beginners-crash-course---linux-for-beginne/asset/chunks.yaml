    第 1 行始终以你的用户名@bash 提示符开头。我们还在那里放置了一个命令 – `ls` – 而且该命令始终是你输入的第一个内容。紧随其后的是我们所说的命令行参数。请注意，命令和第一个参数之间必须有一个空格。第一个命令行参数是
    `-l`，这被称为“选项”（option）。它们用于更改命令的行为方式。它们总是列在任何其他参数之前，并以破折号 (-) 开头。


    第 2 到第 5 行是运行你输入的命令后产生的输出。几乎所有的命令都会产生输出，并且输出将紧挨列在所执行的命令下方。少数命令只负责执行任务，除非发生错误，否则不会产生任何信息。


    第 6 行再次是提示符。一旦命令运行完毕，终端就可以再次使用并会显示提示符。如果没有显示提示符，命令可能仍在运行。


    ## 快捷键


    虽然终端初看起来可能有点让人无从下手，但不必担心。Linux 充满了实用的快捷键，它们会让事情变得简单得多，还能防止你犯下拼写错误等错误。我将在本章中介绍一些快捷键，因此在遇到它们时请做下笔记。


    你的第一个快捷键是这个——每当你输入一个命令，它都会存储在历史记录中，你可以使用向上和向下箭头键遍历这些历史。所以你不需要重新输入已经输入过的命令；如果你需要再次输入相同的命令，只需使用箭头键找到它即可。如果你想编辑命令，使用左、右箭头键将光标移动到你需要更改的位置。


    ## 基础导航


    我们将查看的第一个命令是 `pwd`，它代表“打印工作目录”（Print Working Directory）。许多 Linux 命令都缩写为缩写词，这使得它们更容易记忆。）此命令的作用正如其字面意思——将工作目录打印到屏幕上。试一试：


    ```

    pwd

    /home/Simon

    ```


    你在终端中输入的许多命令只有在你处于正确位置时才会起作用。但由于你会经常移动位置，很容易迷路。只需在命令提示符处输入 `pwd` 就能告诉你你所在的位置，所以当你疑问时请随时利用它。


    你可能还想知道的是当前位置有什么内容。查找该内容的命令是 `ls`，它是“列出”（list）的缩写。


    ```

    ls

    bin Documents public_html

    ```


    当 `pwd` 在不带参数的情况下运行时，`ls` 则更有威力。在这个示例中，我们没有给它提供任何参数，因此我们只得到了当前位置内容的列表。但你可以用它做更多事情，例如：


    ```

    ls [options] [location]

    ```


    `[]` 方括号表示其中的文本是可选的，因此该命令可以带上它们运行，也可以不带它们运行。下面的示例展示了以不同方式运行 `ls` 命令，以便让你直观了解它可以做什么：


    ```

    ls

    bin Documents public_html

    ```


    这是 `ls` 最基础的格式——结果是我们当前所在目录的内容的列表。


    ```

    ls -l

    total 3

