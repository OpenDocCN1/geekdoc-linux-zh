    ## 复制文件或目录

    有时你可能想复制目录或文件，例如，如果你正准备对其进行更改，并且想要一个备份，这样万一出错，一切也不会丢失！执行此操作的命令是 `cp`，它是 `copy`
    的缩写：


    `cp [options] <source> <destination>`


    该命令有很多选项，我现在将演示其中一个：


