    ## Wildcards


    Wildcards are building blocks that let you come up with a pattern that defines
    a set of directories or files on Linux. Remember that when we refer to directories
    and files on the command line, it is a path that we are referring to. When we
    do this, we can use wildcards within the path, which allows us to turn it into
    a set of directories or files.


    The basic wildcards are:


    ● `*` represents zero or more characters.

    ● `?` represents a single character.

    ● `[]` represents a range of characters.


    For the first example, we will use `*` to request a list of all entries that begin
    with the letter “b”:


    ```

    pwd

    /home/Simon/linuxtutorialwork

    ls

    barry.txt blah.txt bob example.png firstfile foo1 foo2

    foo3 frog.png secondfile thirdfile video.mpeg

    ls b*

    barry.txt blah.txt bob

    ```


    ### Under the hood


    This is quite interesting. At first glance, you might assume that the `ls` command
    is receiving argument `b*` and is translating that to bring up the requested matches.
    However, the translation is being done by `bash`, which is the program that is
    responsible for giving us the command line interface. When we put in this command,
    it will spot that we have included wildcards. Then, before it can run the command,
    it will replace that pattern with every single directory or file that matches
    it. We give the command


    ```

    ls b*

    ```


    and it is translated into


    ```

    ls barry.txt blah.txt bob

    ```


    before the program is executed. The program itself will not see the wildcards
    and will not know that they have been used. This means that they can be used whenever
    you want on the command line.


    ### Some more examples


    Let’s look at a few more examples of how wildcards behave. For these examples,
    assume that we are working from a directory called `linuxtutorialwork` that contains
    all of the files listed in the above example. We’ll keep using the `ls` command,
    but please note that wildcards can be used with any command.


    In this example, I am going to ask for all the files that end with the `.txt`
    extension. I have used an absolute path, but wildcards work on both absolute and
    relative paths:


    ```

    ls /home/Simon/linuxtutorialwork/*.txt

    barry.txt blah.txt

    ```


    Now, let’s add the `?` operator into the mix. For the next example, I want to
    look for all files whose second letter is an “i”. Note that we are building this
    patern with the use of more than one wildcard:


    ```

    ls ?i*

    firstfile video.mpeg

    ```


    Or we could look for all the files that have a three-letter extension:


    ```

    ls *.???

    barry.txt blah.txt example.png frog.png

    ```


    Lastly, let’s look at the range operator, denoted by a pair of square brackets
    `[]`. Unlike the first two wildcards we looked at, both of which specified any
    character, this range operator will limit you to a specific subset. For example,
    we can find all files that begin with an “s” or a “v”:


    ```

    ls [sv]*

    secondfile video.mpeg

    ```


    When we use ranges, we can also use a hyphen to include a set. In this example,
    we want to find all of the files that have a digit in their name:


    ```

    ls *[0-9]

    ```


    And we can use the caret `^` to reverse a range. This means it will look for files
    that are NOT one of those:


    ```

    ls [^a-k]*

    secondfile thirdfile

    ```


