  mdcn: "\n## 使用 GPIO 控制 LED\n\n### 连接电路板\n\n07 将一根导线插入 1 号引脚，另一端插入面包板。注意，你插入面包板的位置并不重要，但请确保周围有足够的空槽，以便后续添加\
