    #### Open the raspi-config tool


    01 Start by double-clicking the LXTerminal icon on your desktop. This will start
    the command prompt, where you''ll be able to run the config tool. To do this you''ll
    need to run a command.


    ```

    sudo raspi-config

    ```


    When asked for your password, you won''t actually see it being typed. When you''ve
    typed the password and pressed Enter to submit it, the config screen will be shown
    to you. There are a few settings of particular interest that we''ll cover in this
    section, although they all have their uses in the running of your Pi. Some of
    the settings in this menu are important and some are irreversible, so use them
    with caution!


    - **Change password**: Change the password for your default pi username to make
    it something more personal or easier to remember for you.

    - **Expand root**: Allow you to very quickly and easily change the partition of
    the root to fill the SD card completely!


    ![](img/59caadfa348382a5c408c25137901e27_21_0.png)


    - **Configure your keyboard**: Set the correct keyboard, as there are many different
    layouts. Using the wrong one can be annoying!

    - **Overclocking**: Allows you to quickly and easily overclock your Pi to give
    you some extra speed and power with little risk.


    ### Did you know...


    You can access the config tool anytime by typing `sudo raspi-config` from a terminal
    window or the command line.


    #### Change boot behaviour


    06 By default, the Raspbian distribution boots into a command-line interface,
    where you have to first log in as ''pi''.


    If you then want to run a window manager (in this case, it''s called "X"), you
    have to give the system a command to let it know what you really want to do. For
    a lot of people, this isn''t really ideal since command lines scare them. Because
    of this, there''s an option to start X automatically, on boot. Set this option
    to "Yes" to enable this behaviour by default.


    You can obviously revert this at any time to return to a "text-based login where
    you have to start manually."


    001 start


    #### Expand the root file system


    02 By default, the Raspbian root file system will be 2GB - this is done so that
    the image provided for it can fit on as many different SD cards as possible.


    If your card is larger, the ''expand root'' option will make the OS use the entire
    space. Upon using this option, the command will be executed immediately. The operation
    can take some time. Reboot your system to see the changes.


    #### Overclock your Pi


    04 You can set the clock speed and voltage of your Pi to several different preset
    settings. The clock speed and voltage at higher rates than the specification can
    cause instability, so do so in small increments. Ensure good airflow around your
    Pi.


    If you see any noticeable instability, run this wizard again and set the clock
    speed back down to something slightly lower - repeat until your system is completely
    stable. For the scope of this tutorial, a Mild/Medium overclock is recommended
    - it seems to give a little extra performance with no noticeable side effects.
    It is also recommended to re-boot your system after making this change. Hold the
    Shift key to temporarily disable overclocking.


    ![](img/59caadfa348382a5c408c25137901e27_22_0.png)


    #### Turn overscan on and off


    07 You may have noticed one of two behaviours if you''re using your Pi with a
    modern HD TV.


    - There is a black border the whole way around the image output by the Pi - it
    just doesn''t fit correctly. This is caused by underscan.

    - If you can''t see the edges of your screen, you''re suffering from overscan.

    - You may have the former issue, you may need to either turn on overscan, or enable
    ''auto'' mode or similar on your TV.

    - You''ve have the latter issue, you need to turn overscan off so that you can
    see the edges.


    #### Configure your location


    03 Locale is the language and regional settings that your Pi is using - while
    this generally has little impact on what you see, it is also responsible for any
    default currency settings, etc., so could prove to be important at a later time
    if wrong.


    Upon selecting the option, you''ll be taken through a wizard. Use the arrow keys
    to check the default locale before building more (it takes a while).


    Timezone will take you to a tzdata screen where you can adjust it.


    #### Change the memory split


    05 Changing the memory split of the Pi allows you to give either the system or
    the graphics processor a larger amount of memory.


    The value you give to it must be either 16/32/64/128/256. Here are our recommendations:


    - 32MB GPU memory for basic distro usage where video and 2D rendering aren''t
    required.

    - 64MB GPU memory for desktop use that requires video playback or have 3D effects
    enabled.

    - 128MB GPU memory for graphical applications and games that do extensive multimedia
    or play 3D rendered games.


    For most people, a 64MB split for graphics will suffice.


    #### Update raspi-config


    08 The raspi-config tool receives updates from time to time. This is generally
    to either add more features or fix small bugs, or both!


    It''s not a bad idea to run the update when you use the tool - before you start
    changing any system settings. While it''s much more likely that it''ll be updated
    to look better and do more things, it''s not impossible there could be miscellaneous
    bugs hidden within that could otherwise cause you some grief.


    Remember, though, when you''re trying to update your Pi, you need an active internet
    connection, either through an LAN cable or wireless dongle.


    Without them, it''s never going to get any newer. Always try to make sure you''re
    on the latest version.


    # Getting started


    ## What you''ll need...


    - Any Raspberry Pi distro: www.raspberrypi.org/downloads

    - Wi-Fi dongle or Ethernet


    ### Did you know...


    > If your Raspberry Pi is going to be placed near your internet router, all you
    need to do is plug in an Ethernet cable.


    ![](img/59caadfa348382a5c408c25137901e27_23_0.png)


    *Fig 1. With a Wi-Fi dongle attached, run the utility and scan for available networks.*


    ![](img/59caadfa348382a5c408c25137901e27_23_1.png)


    *Fig 2. Enter the pre-shared key in order to connect to your home router.*


