    \ RaspBX image (www.raspberrypi-siemxk.org/download)\n\nUse your Raspberry Pi\
    \ as a voice over IP server, perfect for phone calls in the home or a small business.\n\
    \n![](img/59caadfa348382a5c408c25137901e27_109_0.png)\n\nRasPBX is a project that\
    \ brings Asterisk – industry-standard voice over IP software – to the Raspberry\
    \ Pi. There are VoIP clients for many platforms, including hardware that converts\
    \ VoIP to a conventional telephone line. Each client gets a phone number and can\
    \ call other clients. You can also have conference calls, perfect for meetings\
    \ over the phone. As an extension of this article, you could also share the VoIP\
    \ server over the internet, allowing remote clients to connect.\n\n**Call**\n\
    Call other VoIP numbers and have their phone ring just like a normal call.\n\n\
    **Connect**\nWe recommend using wired networking, especially if you want to 'set-and-forget'\
    \ your VoIP server.\n\n**Serve**\nThe Raspberry Pi makes the perfect server for\
    \ this kind of project.\n\n### Initial setup\n\nRasPBX is good to go as soon as\
    \ the image is flashed to your SD card! There is a Web interface for configuration,\
    \ and SSH is included for remote login. As this will be a server, we'll log in\
    \ with the user 'root' and password 'raspberrly' and change the IP address to\
    \ a static one so that we always know where it is on this network.\n\n```bash\n\
    root@raspbx:~# ifconfig show eth0 | grep inet\n    inet 172.17.173.94/24  brd\
    \ 172.17.173.255  scope  global  eth0\n    inet6 fe80::ba27:ebff:fef3:9016/64\
    \  scope  link\ndefault  via 172.17.173.1  dev  eth0\nroot@raspbx:~# ip route\
    \ grep default\ndefault  via 172.17.173.1  dev  eth0\nroot@raspbx:~# cat /etc/resolv.conf\n\
    nameserver  127.0.0.1\nnameserver  8.8.8.8\nnameserver  8.8.4.4\n```\n\n### Assign\
    \ a static IP address\n\nTo set up the network configuration go:\n\n`iface eth0\
    \ inet static`\n`address 172.17.173.1`\n`netmask 255.255.255.0`\n`network 172.17.173.0`\n\
    `broadcast 172.17.173.1.255`\n\nNow that we have the network configuration, we\
    \ can assign a static IP address: Open `/etc/network/interfaces` in an editor\
    \ such as nano, and change the line:\n\n`Ifaces eth0 inet dhcp`\n\nto a configuration\
    \ similar to our example. We don't have to worry about DNS. Load your network\
    \ config with:\n\n`sudo /etc/init.d/networking restart`\n\n![](img/59caadfa348382a5c408c25137901e27_110_0.png)\n\
    \n### The web interface\n\n**03** Type the static IP address of your Raspberry\
    \ Pi into a web browser. You'll be taken to the FreePBX web interface for configuring\
    \ Asterisk. Click the FreePBX Administration button and use the username 'admin'\
    \ and password 'admin'. The User Control Panel allows users to listen to their\
    \ voicemails.\n\n![](img/59caadfa348382a5c408c25137901e27_110_2.png)\n\n### Add\
    \ extensions\n\n**04** Each device that will be connected needs its own extension.\
    \ To add an extension, hover over the Applications tab, then select Extensions.\
    \ Select Generic SIP Device as the device type and click Submit. The User Extension\
    \ is the number to call to get to that device. The Display Name can either be\
    \ the name of a person or just the same as the User Extension. The one other thing\
    \ that you will need to fill in is the secret, which is a passphrase that allows\
    \ the device to connect. One of these will have been generated, but you can change\
    \ it if you like. Scroll to the bottom and click Submit. Add as many extensions\
    \ as you like.\n\n**05** Go to the Applications section and select Conferences.\
    \ Choose a number and name for the conference, and a PIN number if you'd like\
    \ users to require a PIN to join. Click Submit Changes once you've done.\n\n###\
    \ Apply config\n\n**06** Changes such as adding extensions and conferences are\
    \ not made until the Apply Config button is pressed, so be sure to do that before\
    \ closing the web interface.\n\n### Trying it out\n\n**07** If you're using an\
    \ Android OS phone, we recommend CspSimple, which can be found on Google Play.\
    \ We recommend LyncPhone for Linux clients. We'll use two Android phones as an\
    \ example. When adding an account in CspSimple, scroll down to the Generic wizards\
    \ section and select Basic. Then fill in the information as shown in the image\
    \ below. Once you have two devices set up, try calling between the two.\n\n![](img/59caadfa348382a5c408c25137901e27_110_1.png)\n\
    \n### Trying a conference call\n\n**08** Call the conference number from the devices\
    \ you set up. Enter the PIN code you'll need to follow by the # key. You'll be\
    \ told that you are the only person in this conference, and will hear a notification\
    \ whenever anyone else joins and leaves the conference.\n\n> \"Each client gets\
    \ a phone number and can call other clients. You can also have conference calls\"\
    \n"
  mdcn: "\n# 项目\n\n## 你需要什么...\n\n- 一个便携式硬盘\n- **Raspbian**（www.raspberrypi.org/downloads）\n\
    - 带有 **Deluge** 的桌面环境 PC（http://deluge-torrent.org）\n\n## 构建一个常开电力的电驴盒子\n\n通过低功耗、迷你电驴盒子，更快地获取最新的发行版、软件包和测试构建版本。\n\
    \n通过电驴（Torrent）获取开源软件具有许多优势——它可以更快、减轻带宽负担，并允许你回馈社区。发行版、软件包等均可通过电驴获取，而 Raspberry\
    \ Pi 是构建小型、低功耗、常开电驴盒子的绝佳选择，有助于更好地管理你的文件。\n\n### 安装 Raspbian\n\n**01** Raspbian\
    \ 对于我们的电驴盒子运行完美。将镜像安装到 SD 卡上并完成基本设置过程，务必在高级选项中启用 SSH 并禁用桌面。\n\n### 远程访问\n\n**02**\
    \ 在你的 Pi 命令行中输入 `ifconfig` 以查找 IP 地址。此时，你可以拔掉显示器并通过远程进行设置，但无论如何，你现在都可以通过输入以下命令访问\
    \ Pi：\n\n```bash\n$ ssh [user]@[IP address]\n```\n\n...并输入密码登录。\n\n![](img/59caadfa348382a5c408c25137901e27_107_0.png)\n\
    \n**外部存储**\n将完成的文件存储在外部硬盘上，以提供更多空间或便于携带。\n\n**有线网络**\n由于你将传输大量数据，因此有线网络是必须的。\n\
    \n**小巧且方便**\n将你的 Pi 变成一个常开的电驴盒子，你可以将其隐藏在通风良好的小空间中。\n\n![](img/59caadfa348382a5c408c25137901e27_107_1.png)\n\
    \n> “Raspberry Pi 是构建小型、低功耗、常开电驴盒子的绝佳选择，有助于更好地管理你的文件”\n\n### 挂载硬盘\n\n**03** 除非你计划重新格式化你的可移动驱动器，否则你需要在\
    \ Pi 上安装 NTFS 支持。\n\n输入：\n```bash\n$ sudo apt-get install ntfs-3g\n```\n将硬盘添加到\
    \ `/etc/fstab`（使用 `sudo nano /etc/fstab` 打开它），添加以下行：\n```\n/dev/[hard drive address]\
    \ [Mount point] auto noatime 0 0\n```\n使用 `fdisk` 查找存储设备名称，并使用 `mkdir` 创建挂载点，例如\
    \ `/home/portsmnts`。重启以使挂载生效。\n\n![](img/59caadfa348382a5c408c25137901e27_108_0.png)\n\
    \n### 安装 Deluge\n\n**04** 我们将使用 Deluge 来处理我们的电驴任务。使用以下命令安装它：\n```bash\n$ sudo\
    \ apt-get install deluge deluge-console\n```\n现在启动然后停止 Deluge，以便它创建一个我们可以编辑的配置文件：\n\
    ```bash\n$ deluged\n$ sudo pkill deluged\n$ deluged\n```\n最后，运行以下命令以备份配置文件，以防我们搞砸了。\n\
    ```bash\n$ cp ~/.config/deluge/auth ~/.config/deluge/auth.old\n```\n\n### 基本配置\n\
    \n**05** 使用以下命令编辑该文件：\n```bash\n$ nano ~/.config/deluge/auth\n```\n并添加位置：\n```\n\
    [username]:[password]:10\n```\n...以限制访问。现在启动它：\n```bash\n$ deluged\n$ deluge-console\n\
    ```\n\n![](img/59caadfa348382a5c408c25137901e27_108_1.png)\n\n### 远程连接\n\n**06**\
    \ 现在你进入了客户端，输入以下三个命令：\n```bash\nconfig -s allow_remote True\nconfig allow_remote\n\
    exit\n```\n使用以下命令重启 Deluge 守护进程：\n```bash\n$ sudo pkill deluged && deluged\n```\n\
    现在在你的 Linux PC 上打开图形客户端。\n\n![](img/59caadfa348382a5c408c25137901e27_108_2.png)\n\
    \n![](img/59caadfa348382a5c408c25137901e27_108_3.png)\n\n### 远程界面\n\n**07** 转到“编辑\
    \ > 首选项 > 界面”，然后禁用“经典模式”并重启 Deluge。点击“连接管理器”中的“添加”，在“主机名”中输入 IP，并输入我们之前设置的用户。点击“连接”以查看你正在下载或上传的任何电驴。\n\
    \n### 下载位置\n\n**08** 再次转到“编辑”然后“首选项”，如果未显示，请切换到“下载”选项卡。将下载位置设置为我们挂载硬盘的目录，如果你打算将电驴发送到\
    \ Pi，请启用“自动添加发送到任何目标的电驴”。\n\n### 开机自启\n\n**09** 可以使用来自 Ubuntu.com 的初始化脚本让 Deluge\
    \ 在开机时启动。使用以下命令下载它：\n```bash\n$ sudo wget -O /etc/default/deluge-daemon http://bit.ly/13nKKSj\n\
    ```\n用 nano 打开 `/etc/default/deluge-daemon` 并将用户名更改为我们之前设置的用户名。保存它，然后下载完整的初始化脚本并更新：\n\
    ```bash\n$ sudo wget -O /etc/init.d/deluge-daemon http://bit.ly/13hKktz\n$ sudo\
    \ chmod 755 /etc/init.d/deluge-daemon\n$ sudo update-rc.d deluge-daemon defaults\n\
    ```\n\n# 构建一个 VoIP 服务器\n\n## 你需要什么...\n\n- 路由器或交换机\n- 智能手机 & 计算机\n- 带电源的 USB 集线器\n\
    - 最新的 RaspBX 镜像（www.raspberrypi-siemxk.org/download）\n\n使用你的 Raspberry Pi 作为 IP\
    \ 语音（VoIP）服务器，非常适合家庭或小企业的电话通话。\n\n![](img/59caadfa348382a5c408c25137901e27_109_0.png)\n\
    \nRasPBX 是一个将行业标准 IP 语音软件 Asterisk 带到 Raspberry Pi 的项目。许多平台都有 VoIP 客户端，包括将 VoIP\
    \ 转换为传统电话线的硬件。每个客户端都会分配一个电话号码，并可以拨打其他客户端。你还可以举行会议电话，非常适合电话会议。作为本文的扩展，你还可以通过互联网共享该\
    \ VoIP 服务器，允许远程客户端连接。\n\n**通话**\n拨打其他 VoIP 号码，让对方的电话像普通通话一样响铃。\n\n**连接**\n我们建议使用有线网络，特别是如果你想将你的\
    \ VoIP 服务器设置为“即设即用”。\n\n**服务**\nRaspberry Pi 是这类项目的完美服务器。\n\n### 初始设置\n\n一旦将镜像刷入你的\
    \ SD 卡，RasPBX 即可随时使用！有一个 Web 界面用于配置，并包含 SSH 用于远程登录。由于这将是一个服务器，我们将使用用户 'root' 和密码\
    \ 'raspberrly' 登录，并将 IP 地址更改为静态 IP，以便我们始终知道它在这个网络上的位置。\n\n```bash\nroot@raspbx:~#\
    \ ifconfig show eth0 | grep inet\n    inet 172.17.173.94/24  brd 172.17.173.255\
    \  scope  global  eth0\n    inet6 fe80::ba27:ebff:fef3:9016/64  scope  link\n\
    default  via 172.17.173.1  dev  eth0\nroot@raspbx:~# ip route grep default\ndefault\
    \  via 172.17.173.1  dev  eth0\nroot@raspbx:~# cat /etc/resolv.conf\nnameserver\
    \  127.0.0.1\nnameserver  8.8.8.8\nnameserver  8.8.4.4\n```\n\n### 分配静态 IP 地址\n\
    \n要设置网络配置，请执行以下操作：\n\n`iface eth0 inet static`\n`address 172.17.173.1`\n`netmask\
    \ 255.255.255.0`\n`network 172.17.173.0`\n`broadcast 172.17.173.1.255`\n\n现在我们已经有了网络配置，我们可以分配一个静态\
    \ IP 地址：在编辑器（如 nano）中打开 `/etc/network/interfaces`，并将行：\n\n`Ifaces eth0 inet dhcp`\n\
    \n更改为类似我们示例的配置。我们不必担心 DNS。使用以下命令加载你的网络配置：\n\n`sudo /etc/init.d/networking restart`\n\
    \n![](img/59caadfa348382a5c408c25137901e27_110_0.png)\n\n### Web 界面\n\n**03**\
    \ 将你的 Raspberry Pi 的静态 IP 地址输入到 Web 浏览器中。你将进入用于配置 Asterisk 的 FreePBX Web 界面。点击“FreePBX\
    \ 管理”按钮，并使用用户名 'admin' 和密码 'admin'。用户控制面板允许用户收听他们的语音邮件。\n\n![](img/59caadfa348382a5c408c25137901e27_110_2.png)\n\
    \n### 添加分机\n\n**04** 每个要连接的设备都需要自己的分机。要添加分机，将鼠标悬停在“应用程序”选项卡上，然后选择“分机”。选择“通用 SIP\
    \ 设备”作为设备类型并点击“提交”。用户分机是拨打以到达该设备的号码。显示名称可以是人的名字，也可以与用户分机相同。你需要填写的另一件事是密钥（secret），这是一个允许设备连接的密码短语。其中一个已生成，但你可以更改它。滚动到底部并点击“提交”。添加你喜欢的分机数量。\n\
    \n**05** 转到“应用程序”部分并选择“会议”。为会议选择一个号码和名称，如果你希望用户需要 PIN 码加入，还可以选择一个 PIN 码。完成后点击“提交更改”。\n\
    \n### 应用配置\n\n**06** 诸如添加分机和会议之类的更改只有在按下“应用配置”按钮后才会生效，因此务必在关闭 Web 界面之前执行此操作。\n\
    \n### 试用\n\n**07** 如果你使用的是 Android 系统手机，我们推荐使用 Google Play 上可找到的 CspSimple。对于\
    \ Linux 客户端，我们推荐 LyncPhone。我们将以两部 Android 手机为例。在 CspSimple 中添加账户时，向下滚动到“通用向导”部分并选择“基本”。然后按照下图所示填写信息。一旦你设置好两个设备，试试在两者之间互相拨打。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_110_1.png)\n\n### 试用会议通话\n\n**08**\
    \ 从你设置好的设备拨打会议号码。输入 PIN 码后你需要按 # 键。系统将告知你只有你一个人在这个会议中，并且每当其他人加入或离开会议时，你会听到通知。\n\
    \n> “每个客户端都会分配一个电话号码，并可以拨打其他客户端。你还可以举行会议通话”\n"
