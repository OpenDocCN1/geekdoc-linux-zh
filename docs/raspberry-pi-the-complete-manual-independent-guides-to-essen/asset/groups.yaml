    \n![](img/59caadfa348382a5c408c25137901e27_130_0.png)\n\n## 树莓派控制遥控车的构建过程\n\n\
    为了让我们的玩具车利用最新的 Web 技术和我们的信用卡大小的计算机“活”起来，我们需要对其工作机制进行一些相当重大的改动。幸运的是，构建中最复杂的方面可以通过购买两个可负担的物品来完成，即一个舵机控制器板（用于处理转向和油门）和一个\
    \ 5V 电池包（以确保树莓派平稳运行）。\n\n### 识别并移除旧无线电接收器\n\n01 这个项目实际上是用新的系统替代汽车的常规发射器和接收器。注意原始接收器上的三个插座：一个连接到电机控制器，一个连接到转向舵机。一些遥控车还为电子元件配备单独的电池，但那些（特别是带有带\
    \ BEC 的电子调速器）直接从调速器获得 5V 电源，从而节省了组件。如果没有带 5V BEC 的调速器，你需要在其他地方获取 5V 电源。许多商店出售\
    \ 5V 电池电源——通常作为手机应急充电宝。www.modmypi.com 以 20 英镑以下出售合适的 5V 电池充电宝，你的树莓派可以运行几个小时。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_131_0.png)\n\n**通电**\n5V 电池包可让我们的树莓派运行五个小时左右\n\
    \n**舵机控制**\n来自 www.modmypi.com 的 Adafruit PWM I2C 舵机驱动板\n\n**树莓派驱动**\n树莓派放在前部中央，以尽可能保持其安全\n\
    \n**选择车辆**\n你可以使用几乎任何可负担的车来完成这个项目\n\n### 将舵机线缆连接到新控制器\n\n02 我们根据 www.modmypi.com\
    \ 的说明焊接了我们的 16 通道 I2C 舵机控制器板，并简单地将第 6 通道（转向）和第 1 通道（电机）插头插入其中。总共有六根线缆：底部两根是地线；中间两根是电源线；顶部两根是\
    \ PWM（脉冲宽度调制）信号线。这是一个思考额外组件安装位置的好时机，而最佳的固定方法似乎是有背胶的魔术贴。\n\n![](img/59caadfa348382a5c408c25137901e27_132_0.png)\n\
    \n### 将 I2C 总线连接到树莓派\n\n![](img/59caadfa348382a5c408c25137901e27_132_1.png)\n\n\
    03 我们使用树莓派的 I2C 总线来控制舵机接口板，它只需要四根线缆——它们都连接在树莓派和舵机控制板之间，如图片所示。访问 http://bit.ly/N3nq41\
    \ 获取有关如何在树莓派上设置 I2C 的教程。从上到下，我们需要使用 1、GND、2、SCL、3、SDA 和 4 VCC，它们直接映射到树莓派上的相应端口。本质上这是电源、地线和两个通信通道。\n\
    \n### 将其连接到树莓派\n\n04 在 Rev 1 树莓派上，I2C 线缆看起来是一样的。虽然 Rev 版本板子上的标签不同，但物理引脚位置相同。左下角（最靠近树莓派电源连接器处）是\
    \ 3.3V 电源；旁边是 SDA 插针，即数据通道。下一排旁边是 SCL 通道，用于控制 I2C 设备的时钟。最后——在右上角端口——是接地。我们建议打印一张带标签的\
    \ GPIO 引脚图片。\n\n### 主要组件概览\n\n05 你现在应该将舵机板放在中间，一侧是转向舵机和调速器，另一侧是树莓派。电机连接到调速器的另一端（那一端应该有更粗的电线）；调速器还有两根粗线连接到主车电池——在这种情况下是\
    \ 7.2V 镍镉电池。现在我们有两个非常独立的电源系统，高电流电机在一侧，低电流电子元件在另一侧。让我们确保保持这种状态！\n\n### 让一切找到归宿\n\
    \n06 现在我们可以组装了。使用大量的有背胶魔术贴、扎带或橡皮筋来固定所有部件，并在车身中寻找空间尽可能隐藏电线。虽然可以将树莓派直接粘贴或螺丝固定在车上，但我们建议使用至少半个外壳以提供额外的保护并方便访问。插入我们的\
    \ SD 卡、网线或 Wi-Fi 网卡以及电源。坐下来欣赏你的黑客技能吧！\n\n![](img/59caadfa348382a5c408c25137901e27_132_2.png)\n\
    \n"
