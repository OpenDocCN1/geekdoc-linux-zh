    # GPIO 端口详解


    了解如何利用树莓派上 GPIO 端口的强大功能。这比你想的更容易……


    树莓派上的通用输入/输出（GPIO）引脚通常是你在这本书中发现的项目成功的关键。如果没有它们，你就无法与真实世界进行接口交互，无论是触发灯、按钮或蜂鸣器，还是读取传感器。


    GPIO 引脚并非 Pi 独有；它们实际上是一种标准，旨在帮助控制各种集成电路的输入和输出行为。通常你会发现，任何单一的 GPIO 引脚都没有预定义的特定用途，并且默认情况下它们是关闭的。


    ## 树莓派 GPIO


    树莓派上的 GPIO 引脚可以通过多种方式进行控制和触发。你可以直接从终端使用它们，通过 Bash 脚本，或者使用为流行编程语言专门设计的模块来控制它们。由于
    Python 是树莓派的官方语言，你会发现 Python 的 GPIO 模块提供了可用的对输入和输出的最佳控制。该库名为 RPi.GPIO，默认安装在所有树莓派上，但也可以像安装任何有用的
    Python 库一样安装。该项目托管在 SourceForge 上，可以在 sourceforge.net/projects/raspberry-gpio-python
    找到。你还会找到有用的链接、信息以及如何从简单的 Python 脚本中使用和控制 GPIO 引脚的示例。如果你计划使用 RPi.GPIO，对 Python
    有基本的理解会有所帮助，因此我们推荐像 www.codeacademy.com 上提供的基础入门课程，或者阅读 www.python.org/doc 上的官方
    Python 文档。


    树莓派上有 26 个 GPIO 引脚，你可以按意愿使用其中的绝大多数。然而，有几个引脚具有特殊用途，因此我们建议你熟悉它们的布局。例如，最顶行的一排引脚旨在为外部设备（如按钮和灯光）提供电力。由于需要接地线（通常称为“地线”）才能安全地创建电路，你也会发现
    GPIO 端口中有几个地线引脚。


    ## 如何使用 GPIO 引脚


    为了利用 GPIO 端口的强大功能，你需要几个基本组件，其中最重要的是跳线。由于端口上的引脚是“公”的，你需要根据打算连接到 Pi 的硬件购买“母对公”或“母对母”电缆。假设你要连接的设备也有公连接器，“母对母”跳线就很合适，而且你通常会使用面包板来原型化电路，在这种情况下首选“母对公”连接器。电缆和面包板可以从销售树莓派配件的任何在线商店廉价买到，通常可以在商店的“原型制作”部分找到。


    ## 命名约定


    一旦准备好连接设备，下一个任务就是为工作找到正确的引脚。虽然确实所有 GPIO 端口都是多用途的，但有些比其他更通用！如前所述，某些引脚保留用于 5V、3.3V
    和地线。其他引脚也具有特殊功能，更糟糕的是，它们还可以被称为不同的名称。例如，GPIO 18 也被称为引脚 12 和 PCM_CLK。这个特定引脚（位于 GPIO
    端口右侧中部）能够进行硬件脉冲宽度调制（PWM），对于控制 LED 灯和电机等非常有用。


    你在 Python 脚本中使用的引脚命名约定可以手动设置。你可以将其设置为 BCM（Broadcom 引脚名称）或物理引脚位置（BOARD）。


    你会看到，在任何使用 GPIO 端口的示例项目中，都有一行包含括号内的 BCM 或 BOARD：


    ```python

    GPIO.setmode(GPIO.BCM)

    ```


    解决 GPIO 引脚命名问题最简单的方法是选择一个约定并坚持使用！


    ![](img/59caadfa348382a5c408c25137901e27_50_0.png)


    > 熟悉 GPIO 引脚的布局及其功能 – 一些引脚具有特殊用途，例如地线引脚


    ## 你知道吗……？


    RPi.GPIO 库有一些非常有用的本地化功能 – 你只需在本地 PC 上执行 pip install：`sudo apt-get install python-rpi.gpio`


    '
