  - "[PAGE 68]\n\n# Create a complete media centre\n\n# Install Raspbmc\n\n+   1.\
    \  Raspbmc has a downloadable installer that always gets the latest image for\
    \ your Pi. Create a new directory and then download it with:\n+       $ wget http://svn.stmlabs.com/svn/raspbmc/release/installers/python/install.py\n\
    +   \n+       Make it executable with:\n+   \n+       $ chmod +x install.py\n\
    +   \n+       And then run it with:\n+   \n+       $ sudo python install.py\n\
    +       Follow the on-screen instructions and it will then install onto your Pi\n\
    \n![](img/59caadfa348382a5c408c25137901e27_68_0.png)\n\n# Scrape your media\n\n\
    +   4.  After selecting a source, you can choose what service to scrape information\
    \ from. This gives you more info on the films you’re watching, such as episode\
    \ summaries and proper names. Make sure your films have the year appended to them,\
    \ and that your TV shows do too.\n\n![](img/59caadfa348382a5c408c25137901e27_68_1.png)\n\
    \n# Android Remote\n\n+   7.  There’s an official Android Remote app on the Google\
    \ Play Store. Can control XBMC once the web server is enabled. Download it to\
    \ your phone and launch it. Go to the Settings, add new host, and enter the IP\
    \ address and port (80 by default) like in the previous step.\n\n![](img/59caadfa348382a5c408c25137901e27_68_2.png)\n\
    \n# Setup\n\n+   2.  By installing Raspbmc this way, the distro will then download\
    \ the latest image and update to run on your Pi on first boot. This will take\
    \ a while, and involve a couple of restarts, but will only happen the first time.\
    \ Select your language in XBMC and you’re done.\n\n# Get some apps\n\n+   5. \
    \ On any content tab, go to Add-Ons. It will display the apps you already have,\
    \ which is none by default. By selecting More, the full list of available apps\
    \ will be shown. You can install them with one button click from there.\n\n![](img/59caadfa348382a5c408c25137901e27_68_3.png)\n\
    \n# Using CEC\n\n+   8.  If your TV supports it, CEC can be used over HDMI to\
    \ control your XBMC-powered Pi. CEC should be enabled by default, so you can control\
