    # 项目


    ## 控制你的树莓派驱动汽车


    使用智能手机和最新的 Web 技术控制一辆玩具车


    ### 你需要准备什么……


    - 一辆树莓派汽车，准备就绪

    - 互联网连接

    - 一部较新的智能手机/平板电脑

    - Pi 汽车源代码

    - [github.com/shaunuk/picar](https://github.com/shaunuk/picar)


    ### 下载并安装软件


    01


    为了让 LCD 连接正常工作，你可以遵循第 64–65 页的步骤。接下来，我们需要为我们的新项目代码找一个“家”——`/var/www/picar` 怎么样？在终端中输入
    `sudo mkdir /var/www/picar` 来创建目录，然后切换到该目录：`cd /var/www/picar`


    现在，要使用 Git 下载项目，请输入 `sudo git clone https://github.com/shaunuk/picar`（如果你还没有安装
    Git，请使用 `sudo apt-get install git` 进行安装）。


    这将下载用于驾驶汽车的定制软件，但在我们开始“烧胎”（指高速行驶）之前，我们仍然需要 Web 服务器和其他一些组件……


    ![](img/59caadfa348382a5c408c25137901e27_133_0.png)


    > 我们的代码将通过二十毫秒的间隔向汽车发送指令。驾驶时会非常灵敏！


    现在，我们的酷炫树莓派驱动汽车已经布线好并充满电了，是时候让它“活”过来了。我们使用了 JavaScript 编程语言提供的最佳 Web 技术，利用你手势的自然运动无线驾驶车辆。每一个细微的动作都会触发一个事件，该事件计算汽车应该做什么，然后通过套接字连接发送出去。


    下方 完成你的项目所需的一切只是访问一部智能手机或平板电脑


    ### 下载并安装 Node.js


    02 接下来，我们将使用 Node.js 及其包管理工具，Node 包管理器（npm）。请输入 `sudo wget http://nodejs.org/dist/v0.18.21/node-v0.18.21-linux-arm-pi.tar.gz`。这将下载一个相对较新的
    Node.js 版本——Raspbian 仓库中的版本太旧了，无法与我们即将使用的新技术兼容。通过输入以下命令解压 node 包：`sudo tar -xzvf
    node-v0.18.21-linux-arm-pi.tar.gz`


    ### 配置 Node.js


    03 为了便于从任何地方运行，我们将为 Node 和 npm 二进制文件创建符号链接。请输入 `sudo ln -s /var/www/node-v0.18.21-linux-arm-pi/bin/node
    /bin/node`，然后输入 `sudo ln -s /var/www/node-v0.18.21-linux-arm-pi/bin/npm /bin/npm`。然后，要获取额外模块，请输入
    `npm install socket.io node-socket.io adafruit-i2c-pwm-driver sleep-optimist`


    ![](img/59caadfa348382a5c408c25137901e27_134_0.png)


    ### 了解项目


    04 现在所有东西都准备好了，你应该能看到三个文件：服务器端（app.js）、客户端（socket.html）以及用于客户端的 jQuery JavaScript
    库。服务器端不仅驱动舵机，它还是一个 Web 服务器，并在请求时向浏览器发送 socket.html 文件和 jQuery——这是一个非常简洁且简单的设置，非常适合我们要实现的目标。


    ### 测试舵机


    05 我们便捷的小程序（app.js）有一个专门用于测试的特殊模式。这里我们要使用两个关键词：beta 用于舵机 0（转向），gamma 用于舵机 1（电机控制）。请输入
    `node app.js beta=300`。你应该能看到前轮转动。现在需要对数字进行实验。在我们的示例中，340 代表向左，400 代表居中，470 代表向右。通过输入
    `node app.js gamma=400` 对电机做同样的操作，并记录你汽车的各种极限值。


    ![](img/59caadfa348382a5c408c25137901e27_135_0.png)


    > *我们使用了 JavaScript 编程语言所能提供的最佳 Web 技术*


    ![](img/59caadfa348382a5c408c25137901e27_135_1.png)


    ### 配置合理的默认值


    06 既然你了解了你的汽车的能力，我们可以在 app.js 和 socket.html 中设置默认值。编辑 app.js，找到写着 function emergencyStop()
    的部分。将这两个数字调整为你汽车的静止值。然后打开 socket.html，在此处定义你的变量。


    ### 试跑一番


    07 我们几乎可以试试了，但你需要知道你的 Pi 汽车的 IP 地址，因此在终端中输入 ifconfig。然后通过输入 node app.js 启动应用。现在拿起你手边最近的智能手机或平板电脑，确保它与你的
    Pi 处于同一网络中。打开 Web 浏览器并访问 http://[你的 IP 地址]:8080/socket.html。你应该会收到一条说“ready”（准备就绪）的警报信息，一旦你点击确定，手机上的陀螺仪数据就会发送到汽车，然后你就会出发！


    ### 完整代码列表


    **socket.html**


    ```html

    <html>

    <head>

    <script src="jquery-2.0.3.min.js"></script>

    <script src="socket.io/socket.io.js"></script>

    <meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0"
    />

    <script>

    //------ 在此处定义你的变量

    var socket = io.connect(window.location.hostname + '':8080'');

    var centerbeta = 400; //中心在哪里？

    var minbeta = 340; //右极限

    var maxbeta = 470; //左极限

    var multbeta = 3; //乘以原始陀螺仪数值的系数

    var centergamma = 330;

    var adjustmentgamma = 70; //角度如何调整以达到目标

    var mingamma = 250; //后退极限

    var maxgamma = 400; //前进极限

    var multgamma = 1; //乘以原始陀螺仪数值以得到所需加速度的系数

    window.lastbeta=''0'';

    window.lastgamma=''0'';

    $(function() {

    window.gyro = ''ready'';

    alert(''Ready - Lets race !'');

    });

    window.ondeviceorientation = function(event) {

    var beta = Math.round((event.beta - centerbeta)*multbeta);

    if (beta < minbeta) {

    beta=minbeta;

    }

    if (beta > maxbeta) {

    beta=maxbeta;

    }

    gamma = Math.round(event.gamma + adjustmentgamma)*multgamma;

    //停止重复发送相同的指令

    send = ''N'';

    if (window.lastbeta != beta) { send = ''Y'' }

    if (window.lastgamma != gamma) { send = ''Y'' }

