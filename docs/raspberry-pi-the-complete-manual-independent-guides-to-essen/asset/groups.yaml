    # Fix permissions


    +   03 The files that we just copied will be owned by the Pi user, which isn''t
    what we want. We''re going to change the ownership of the music directory and
    all subdirectories, to the mpd user /etc/ and the audio group.


    ```

    sudo chown -R mpd:audio /var/lib/mpd/music

    ```


    # Configure the daemon


    +   04 We want to edit/etc/mpd. conf. We need to use sudo to do it, so write sudo
    nano /etc/ mpd.conf in the terminal. The first change is to make the daemon listen
    on all interfaces, so we can use MPD clients from other devices. Do this by changing
    the line.


    ```

    bind_to_address "localhost" to bind_to_address "any"

    ```


    # Configure a stream


    +   05 At the moment, the only audio output is the 3.5mm one on the Pi. To set
    up a stream, scroll down the config file until you find the httpd stream output
    that is commented out. Uncomment the entry, and change the format line to produce
    stereo output instead of mono. Our entry was as follows:


    ```

    audio_output {

    type "http"

    name "My HTTP Stream"

    encoder "vorbis"

    port "5600"

    quality "5.0"

    bitrate "128"

    format "44100:16:2"

    }

    Save the changes and restart the daemon with:

    sudo /etc/init.d/mpd restart

    ```


    > "MPD can output audio to any sound card connected to the system, including iOS
    and Android"


    ![](img/59caadfa348382a5c408c25137901e27_96_0.png)


    # Playing music


    +   08 Press the Tribe def'' button in the bottom-left corner. This will take
    you to the Artists section of the music library. To play music from an artist,
    all you need to do is long-press on the artist and select ''Add, replace and play''
    if you have speakers or headphones connected to the Pi, you should hear music
    coming out of them. You may need to use the volume slider on the Now Playing screen
    to adjust the volume to suit.


    # Set up a client


    +   06 It''s still quite a walk through /etc/ settings to use a client on each
    different platform, but the steps translate fairly easily. For Linux, we suggest
    Sonata, for Android we suggest MProid, and for iOS we suggest MPDroid. We''re
    going to set up MPDroid on Android, so go ahead and download that from the Play
    Store.


    # Connect to the server


    +   07 Once in the MProid app, select ''MLAN-based connection and choose your
    access point. Then fill in the Host field with the IP address of your Pi and fill
    in the ''Streaming host'' field with the same details. Everything else should
    be the default. Once you''ve done this, go to the Now Playing screen. We need
    to update the music library, as it has never been scanned before. To do this,
    press the Menu button and go to Settings. Then select the ''Update option, with
    the caption "Refresh MPD''s Database".


    # Further improvements


    +   09 This article has illustrated a very simple MPD setup. Further possible
    improvements include:

    +   - Putting music on an external hard drive so that you have more storage space
    available;

    +   - Taxing the streaming settings to the Pi''s CPU,less look at the encoder
    plugin, section of user manual at www.mp3help.org/doc/user/;

    +   - Setting up a Samba share, to give access to the music files over the network
    which is compatible with all major operating systems.'
