    \ this case, and in that of many other operating systems as well. What you've\
    \ done is use a command, specifically in this case to start the X server. The\
    \ X server handles the graphical interface and can be turned off by default on\
    \ some Pi systems.\n\n- **What you'll need...**\n  - Raspbian\n  - www.raspberrypi.org\n\
    \n- **Did you know...**\n  The command arrow enables your last commands. Simply\
    \ use the Up and Down arrows to use them.\n\n![](img/59caadfa348382a5c408c25137901e27_15_0.png)\n\
    \nFig 1: The terminal emulator allows you to access the command line while still\
    \ being in the desktop environment\n\n![](img/59caadfa348382a5c408c25137901e27_16_0.png)\n\
    \n## A new world\n\nGetting your Raspberry Pi into the desktop isn't the only\
    \ thing you can do on the command line, though. There's a whole world of functionality\
    \ built into the command line; in fact, most of the graphical programs you're\
    \ using are just executing these commands in such a way. You don't have to leave\
    \ the comfort of the desktop environment to perform these commands either, as\
    \ all Raspberry Pi operating systems will come with an application known as a\
    \ Terminal emulator.\n\nThis creates a window where a command can be written in\
    \ the same way that we launched the desktop, and use the exact same commands (Fig\
    \ 1). On Raspbian, look for the app LX Terminal in the Accessories section of\
    \ the menu and click on it. If you've had to use **startx** to get into the desktop,\
    \ then we can now fix that before continuing. In the terminal, enter:\n\n```\n\
    $ rpi-config\n```\n\nHere's the initial setup screen (Fig 2). From here you can\
    \ enable the desktop on boot (Fig 3), and even update the firmware and add support\
    \ for the official Raspberry Pi camera module. This allows you to modify Raspbian\
    \ without having to reinstall again.\n\nYou won't be using those two commands\
    \ very often, though, so is there practical use for delving into the command line?\
    \ Very much so. For starters, Raspbian doesn't have an official package manager.\
    \ This is a program that allows you to browse the available software for the operating\
    \ system, similar to the Pi Store.\n\nHowever, there's other software available\
    \ to Raspbian that you can't get through the store. You also can't specifically\
    \ update the Pi software either, and all of this can be fixed using the command\
    \ line.\n\nFig 2. Access rpi-config to change settings such as boot-to-desktop\
    \ or adding a camera module\n\n![](img/59caadfa348382a5c408c25137901e27_16_1.png)\n\
    \nFig 3. Change the default selection to desktop for the next time you use the\
    \ Raspberry Pi\n"
