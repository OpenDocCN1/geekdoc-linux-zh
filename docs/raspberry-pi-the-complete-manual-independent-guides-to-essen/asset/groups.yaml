    \n![](img/59caadfa348382a5c408c25137901e27_123_0.png)\n\n### 弹药（Ammo）\n\n**08**\
    \ 然而，类最有趣的地方在于，你可以使用一个类来创建许多不同的东西。例如，你可以有一个宠物类。从这个类中，你可以创建一只猫（会移动）和一只狗（会吠叫）——它们在很多方面不同，但它们都有毛并且有四条腿，所以可以由同一个父类创建。我们的\
    \ Ammo 类就是这样做的，用它来创建玩家子弹和外星导弹。它们颜色不同且发射方向相反，但本质上是一回事。\n\n### 游戏\n\n**09** 我们的最后一个类称为\
    \ Game。这是游戏本身所有主要功能所在的地方，但请记住，到目前为止这仍然只是大量的原料——直到创建了一个 `Game` 对象（在代码的最底部！）之前，什么都不会实际发生。Game\
    \ 类是游戏主要目标所在的地方，因为我们在那里初始化 Pygame，为我们的主角和外星反派设置图像，并创建一些 GameState 属性，用于控制外部类的关键方面，例如改变玩家矢量（方向）。\n\
    \n### 主循环\n\n**10** Game 类中有许多方法（类函数），每个方法都旨在控制游戏设置或游戏过程本身的特定方面。决定游戏任何一轮中发生什么的逻辑都包含在\
    \ pyxiders.py 脚本底部的 main_`loop()` 方法中，它是解锁你游戏所需确切变量和函数的关键。\n\n### 主循环关键逻辑 – 第一部分\n\
    \n**11** 首先，游戏检查 end_`game` 属性是否为假 – 如果为真，main_`loop()` 中的整个循环被跳过，我们直接调用 pygame.quit()，退出游戏。只有当玩家在\
    \ start_`screen` 上穿过游戏窗口或按下 Esc 键时，这个标志才会被设置为真。假设 end_`game` 和 start_`screen`\
    \ 为假，主循环可以正确开始，使用 control() 方法，该方法检查玩家位置是否需要改变。接下来我们尝试创建一个敌方导弹，并使用 random 模块限制可以创建的导弹数量。接下来，我们使用简单的\
    \ for 循环为屏幕上的每个 actor 调用 update() 方法。这确保在我们在 calc_`collisions()` 中检查碰撞之前，每个人都已经更新并移动。\n\
    \n### 主循环关键逻辑 – 第二部分\n\n**12** 一旦计算完碰撞，我们需要看看游戏是否还应该继续。我们用 is_`dead()` 和 defences_`breached()`\
    \ 来做 – 如果这些方法中任何一个返回 true，我们就知道需要返回到开始屏幕。另一方面，我们还需要检查是否杀死了所有外星人。从我们的 `round()`\
    \ 内部开始，假设我们没有死亡，但外星人死了，我们就知道可以调用 next_`round()` 方法，该方法创建一批新的外星人并增加它们在屏幕上围绕的速度。最后，我们刷新屏幕，以便所有已移动、发射或击杀的内容都可以从屏幕上更新或移除。请记住，主循环每秒运行\
    \ 20 次 – 因此，我们在循环末尾不要求屏幕更新并无大碍。\n"
