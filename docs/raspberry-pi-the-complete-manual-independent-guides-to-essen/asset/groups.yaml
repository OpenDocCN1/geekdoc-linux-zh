    To access a world of utilities, apps and resources you need to get online. This
    is how to do it...


    #### Get online


    The easiest way to get online is to buy a Raspberry Pi Model B, as it comes with
    an RJ45 Ethernet socket. The Model A not only lacks the Ethernet port, but is
    handicapped by only having one USB port. That means you will have to buy a power
