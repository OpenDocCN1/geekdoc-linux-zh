  md: "\n## Create a time-lapse camera trigger\n\n# Time-lapse camera trigger\n\n\
    Make shooting time-lapse video with your DSLR camera a cinch with our expert advice\n\
    \nYou'd be forgiven for thinking that creating mesmerising time-lapse videos like\
    \ those of Vincent Laforet (<http://www.laforetvisuals.com>) or John Elkind (<http://www.theartoftime\
    \ lapse.com>) might be out of reach of the Average Joe. With the help of the Raspberry\
    \ Pi and a sprinkling of Python code, though, that's no longer the case. In this\
    \ guide we're going to trigger our DSLR camera to create pixel-perfect time-lapse\
    \ imagery...\n\n### What you'll need...\n\n- Latest Raspberry Image <http://www.raspberrypi.org/downloads>\n\
    - Breadboard\n- Connectors\n- Jumper wire\n- DSLR camera\n- Compatible shutter\
    \ cable\n\n### Set up the Raspberry Pi\n\n**01** For this tutorial we're assuming\
    \ you're using a recent build of Ras pi on, with the Raspberry Pi set up with\
    \ a keyboard, mouse and monitor. Open the terminal and type:\n\n```bash\nsudo\
    \ apt-get update\n```\n\n### Install the RPi.GPIO library\n\n**02** Next we want\
    \ to make sure your development environment is set up. Follow these steps to make\
    \ sure you've all set in the terminal, type:\n\n```bash\nsudo apt-get install\
    \ python-dev\nsudo apt-get install python-rpi-gpio\n```\n\n### Set up the Pi Cobbler\n\
    \n**03** For this tutorial we've used a cheap prototyping breadboard and an Adafruit\
    \ Pi Cobbler to give us easy access to the Raspberry Pi's GPIO pins. As you can\
    \ see from the picture, the Cobbler straddles the centre-point of the breadboard\
    \ and a ribbon cable connects the two.\n\n### Full code listing\n\n```python\n\
    import RPi.GPIO as GPIO\nimport time\n\nprint 'Welcome to the Complete Manual\
    \ Time-lapse Tool.'\nprint \"Just tell us how many shots you'd like to take and\
    \ the interval between them.\"\nprint \"Try googling 'time-lapse interval calc'\
    \ if you need help deciding.\\n\"\n\ndef main():\n    shots = raw_input('How many\
    \ shots would you like to take?\\n -> ')\n    interval = raw_input('How frequently\
    \ do you want to take them (in seconds)?\\n -> ')\n\n    if shots.isdigit() and\
    \ interval.isdigit():\n        shots = int(shots)\n        interval = int(interval)\n\
    \n        print \"You'll be shooting for %d minutes.%n\" % (shots * interval /\
    \ 60)\n        answer = raw_input('Are you ready to proceed?(yes/no): ')\n\n \
    \       if confirm:\n            GPIO.setmode(GPIO.BOARD)\n            GPIO.setup(16,\
    \ GPIO.OUT)\n            taken = 1\n\n            print 'Starting a run of %d\
    \ shots' % (shots)\n\n            for i in range(0, shots):\n                print\
    \ 'Shot %d of %d!' % (taken, shots)\n                taken += 1\n            \
    \    GPIO.output(16, GPIO.HIGH)\n                time.sleep(0.5)\n           \
    \     GPIO.output(16, GPIO.LOW)\n                time.sleep(interval)\n      \
    \      GPIO.cleanup()\n        else:\n            print \"Let's try again (or\
    \ press Ctrl + C to quit).\\n\"\n            main()\n    else:\n        print\
    \ \"Oops - You can only enter numbers. Let's try again!\\n\"\n        main()\n\
    \nprint 'Thanks for using the Complete Manual Time-lapse Tool!'\nagain = raw_input('Would\
    \ you like to do another time-lapse? (Yes/no):\\n > ')\nproceed = again.lower()[0]\
    \ in ['yes', 'y']\nif proceed:\n    main()\nelse:\n    print \"See you next time!\\\
    n\"\n    quit()\n\nif __name__ == '__main__':\n    main()\n```\n\n### Manual focus\n\
    \nWe want to control the autofocus with our Python app, so set the focus to manual\
    \ and select your camera settings in advance of the shoot.\n\n![](img/59caadfa348382a5c408c25137901e27_100_0.png)\n\
    \nUsing a cheap Canon EOS DSLR, so to trigger the shutter with the Raspberry Pi,\
    \ we need a simple 2.5mm to 3.5mm cable.\n\n### Pi Cobbler\n\nWe’re using the\
    \ Pi Cobbler as a breakout for the Pi’s GPIO pins, making the build process easier\
    \ (though it’s not required).\n\n### Configure the breadboard\n\n**04** For the\
    \ Raspberry Pi’s GPIO to control the camera, we need to create a circuit between\
    \ a pin on the GPIO (in this case pin 23 on the cobbler - but it’s actually physical\
    \ pin 16) and the pin that connects to the ‘head’ or ‘tail’ of the camera cable\
    \ that activates the shutter when connected. The base of the connector cable is\
    \ always ground, so make sure you ground the ‘GND’ pin on the Cobbler and the\
    \ middle pin on the audio jack. With the circuit complete, we can focus on the\
    \ code.\n\n### The Time-lapse Photography Tool\n\n**05** We’ve created a small\
    \ 55-line Python utility called The Linux User Time-lapse Photography Tool, which\
    \ asks the user to input how many shots they’d like to take and the frequency\
    \ they’d like them taken. It then takes that information and uses it in a For\
    \ loop to activate the shutter using GPIO pin 16. If you’d like to use the project\
    \ in the field, we’d recommend using the Android app ConnectBot to SSH into your\
    \ RasiPi for input and feedback. Don’t forget to start your script with `sudo\
    \ python time_lapse_camera.py`.\n\n### Create a video\n\n**06** With your camera\
    \ packed with images, we need to collect and output them as a video file. While\
    \ it’s possible on the Pi, copy them to an easily accessible folder on a separate\
    \ Linux PC to make it much faster. We’re going to use FFmpeg with the terminal\
    \ open in the folder where your images are stored, type: `ffmpeg -i image%04d.jpg\
    \ -vcodec libx264 -b 800k video.avi`. This assumes you have libx264 installed\
    \ on your machine and the image%04d.jpg assumes the file format and the number\
    \ of digits it’s displaying in (in this case: 'picture0001.jpg').\n\n## Stop motion\
    \ animation with the Camera board\n\n### What you'll need...\n\n- Latest version\
    \ of Raspbian\n- <http://www.raspberrypi.org/downloads>\n- picamera Python module\n\
    - <http://picamera.readthedocs.org>\n- RasPi camera module\n- <http://bit.ly/raspicam>\n\
    - Pygame\n- <http://www.pygame.org>\n\nFancy yourself as the next Nick Park? Set\
    \ up this DIY stop-motion studio and see what you can do\n\n![](img/59caadfa348382a5c408c25137901e27_101_0.png)\n\
    \nThe Raspberry Pi camera module opens the door for your Pi projects to incorporate\
    \ aspects of photography and movie making. We're combining both here to create\
    \ a fully featured stop-motion animation application, Pi-Motion, which makes it\
    \ incredibly easy to create impressive HD animations.\n\nWe've written this project\
    \ with Python and it relies on two libraries that you'll need to install. Picamera\
    \ (<http://picamera.readthedocs.org>) is a pure Python interface to the Raspberry\
    \ Pi camera module and is a must for all camera module owners. Pygame (<http://www.pygame.org>),\
    \ on the other hand, ensures our images can be displayed on demand. The project\
    \ in its current state is merely a proof-of-concept for a bigger stop motion animation\
    \ application. It's not perfect either, but goes to prove that the Raspberry Pi\
    \ in tandem with the Camera board and a bit of know-how can offer amazing results!\n\
    \nKeep an eye on <http://github.com/russb78/pi-motion> for updates on the project\
    \ in the future...\n\n### Set up the camera module\n\n- **01** First things first,\
    \ you need to make sure your Raspberry Pi is up to date. In the terminal, type:\n\
    \n```bash\nsudo apt-get update && sudo apt-get upgrade\n```\n\n- Next we need\
    \ to update the Pi's firmware and ensure camera module is activated. Bear in mind\
    \ that this takes some time.\n\n```bash\nsudo rpi-update\nsudo raspi-config\n\
    ```\n\n### Full code listing\n\nThe first job is to import the libraries we’ll\
    \ be using with the project and set some key variables.\n\nNext we initiate Pygame\
    \ so we can use it in our project and set some key variables around it.\n\n```python\n\
    import pygame, picamera, os, sys\n\npics_taken = 0\ncurrent_alpha, next_alpha\
    \ = 128, 255\nfps = 5\n```\n\n```python\npygame.init()\nres = pygame.display.list_modes()\
    \ # return the best resolution for your monitor\nwidth, height = res[0]\nprint\
    \ \"Reported resolution is:\", width, \"x\", height\nstart_pic = pygame.image.load(os.path.join(\"\
    data\", \"start_screen.jpg\"))\nstart_pic_fix = pygame.transform.scale(start_pic,\
    \ (width, height))\nscreen = pygame.display.set_mode((width, height))\npygame.display.toggle_fullscreen()\n\
    pygame.mouse.set_visible = False\n```\n\nBelow Pi-Motion is available on GitHub\
    \ via <https://github.com/nsbd2/Pi-Motion>\n\n![](img/59caadfa348382a5c408c25137901e27_102_0.png)\n"
  mdcn: "\n## 创建延时摄影相机触发器\n\n# 延时摄影相机触发器\n\n凭借我们的专家建议，使用单反相机拍摄延时视频将变得轻而易举。\n\n你可能会觉得，像文森特·拉弗雷（[Vincent\
    \ Laforet](http://www.laforetvisuals.com)）或约翰·埃尔金德（[John Elkind](http://www.theartoftime\
    \ lapse.com)）那样制作令人着迷的延时视频可能超出了普通人的能力范围。不过，借助树莓派和少量的 Python 代码，这种情况已经不再存在。在本指南中，我们将触发单反相机以创建像素完美的延时摄影图像……\n\
    \n### 你需要准备什么……\n\n- 最新树莓派系统镜像 [http://www.raspberrypi.org/downloads](http://www.raspberrypi.org/downloads)\n\
    - 面包板\n- 连接器\n- 跳线\n- 单反相机\n- 兼容的快门线\n\n### 设置树莓派\n\n**01** 本教程假设你正在使用较新版本的 Ras\
    \ pi on，并且树莓派已配备键盘、鼠标和显示器。打开终端并输入：\n\n```bash\nsudo apt-get update\n```\n\n###\
    \ 安装 RPi.GPIO 库\n\n**02** 接下来，我们需要确保开发环境已设置好。请按照以下步骤操作，确保在终端中一切就绪，输入：\n\n```bash\n\
    sudo apt-get install python-dev\nsudo apt-get install python-rpi-gpio\n```\n\n\
    ### 设置 Pi Cobbler\n\n**03** 在本教程中，我们使用廉价的实验面包板和 Adafruit Pi Cobbler 来轻松访问树莓派的\
    \ GPIO 引脚。正如图片所示，Cobbler 横跨面包板的中心点，并通过一条扁平电缆将两者连接起来。\n\n### 完整代码列表\n\n```python\n\
    import RPi.GPIO as GPIO\nimport time\n\nprint 'Welcome to the Complete Manual\
    \ Time-lapse Tool.'\nprint \"Just tell us how many shots you'd like to take and\
    \ the interval between them.\"\nprint \"Try googling 'time-lapse interval calc'\
    \ if you need help deciding.\\n\"\n\ndef main():\n    shots = raw_input('How many\
    \ shots would you like to take?\\n -> ')\n    interval = raw_input('How frequently\
    \ do you want to take them (in seconds)?\\n -> ')\n\n    if shots.isdigit() and\
    \ interval.isdigit():\n        shots = int(shots)\n        interval = int(interval)\n\
    \n        print \"You'll be shooting for %d minutes.%n\" % (shots * interval /\
    \ 60)\n        answer = raw_input('Are you ready to proceed?(yes/no): ')\n\n \
    \       if confirm:\n            GPIO.setmode(GPIO.BOARD)\n            GPIO.setup(16,\
    \ GPIO.OUT)\n            taken = 1\n\n            print 'Starting a run of %d\
    \ shots' % (shots)\n\n            for i in range(0, shots):\n                print\
    \ 'Shot %d of %d!' % (taken, shots)\n                taken += 1\n            \
    \    GPIO.output(16, GPIO.HIGH)\n                time.sleep(0.5)\n           \
    \     GPIO.output(16, GPIO.LOW)\n                time.sleep(interval)\n      \
    \      GPIO.cleanup()\n        else:\n            print \"Let's try again (or\
    \ press Ctrl + C to quit).\\n\"\n            main()\n    else:\n        print\
    \ \"Oops - You can only enter numbers. Let's try again!\\n\"\n        main()\n\
    \nprint 'Thanks for using the Complete Manual Time-lapse Tool!'\nagain = raw_input('Would\
    \ you like to do another time-lapse? (Yes/no):\\n > ')\nproceed = again.lower()[0]\
    \ in ['yes', 'y']\nif proceed:\n    main()\nelse:\n    print \"See you next time!\\\
    n\"\n    quit()\n\nif __name__ == '__main__':\n    main()\n```\n\n### 手动对焦\n\n\
    我们希望使用 Python 应用程序控制自动对焦，因此将相机设置为手动对焦，并在拍摄前预先选择相机设置。\n\n![](img/59caadfa348382a5c408c25137901e27_100_0.png)\n\
    \n使用廉价的佳能 EOS 单反相机，为了用树莓派触发快门，我们需要一条简单的 2.5mm 转 3.5mm 线缆。\n\n### Pi Cobbler\n\n\
    我们使用 Pi Cobbler 作为树莓派 GPIO 引脚的扩展板，使构建过程更加简便（尽管这不是必须的）。\n\n### 配置面包板\n\n**04**\
    \ 为了让树莓派的 GPIO 控制相机，我们需要在 GPIO 的一个引脚（在本例中是 Cobbler 上的 23 号引脚——但实际物理引脚是 16 号）和连接相机线缆“头”或“尾”以激活快门的引脚之间创建一个电路。连接线缆的基部始终是地线，因此请确保将\
    \ Cobbler 上的“GND”引脚和音频插头的中间引脚接地。电路完成后，我们就可以专注于代码了。\n\n### 延时摄影工具\n\n**05** 我们创建了一个名为“《Linux用户》延时摄影工具”的小型\
    \ 55 行 Python 实用程序，它会询问用户希望拍摄多少张照片以及拍摄频率。然后，它会将这些信息用于 For 循环，使用 GPIO 引脚 16 激活快门。如果你想在野外使用该项目，我们建议使用\
    \ Android 应用程序 ConnectBot 通过 SSH 连接到你的 RasiPi 进行输入和反馈。别忘了使用 `sudo python time_lapse_camera.py`\
    \ 启动你的脚本。\n\n### 创建视频\n\n**06** 当你的相机充满了图像后，我们需要将它们收集并输出为视频文件。虽然在树莓派上可以做到这一点，但为了加快速度，请将它们复制到另一台\
