    ## 配置守护进程\n\n  04 我们需要编辑 /etc/mpd.conf。必须使用 sudo 来执行此操作，因此在终端中输入 `sudo nano /etc/mpd.conf`。第一项更改是让守护进程监听所有接口，这样我们就可以使用来自其他设备的\
    \ MPD 客户端了。通过将 `bind_to_address \"localhost\"` 这一行更改为 `bind_to_address \"any\"\
    ` 来实现这一点。\n\n## 配置流媒体\n\n  05 目前，唯一的音频输出是 Pi 上的 3.5mm 接口。要设置流媒体，向下滚动配置文件直到找到被注释掉的\
    \ httpd 流媒体输出部分。取消该条目的注释，并将 format 行更改为输出立体声而不是单声道。我们的条目如下所示：\n\n```\naudio_output\
    \ {\ntype \"http\"\nname \"My HTTP Stream\"\nencoder \"vorbis\"\nport \"5600\"\
    \nquality \"5.0\"\nbitrate \"128\"\nformat \"44100:16:2\"\n}\n```\n\n保存更改并通过以下方式重启守护进程：\n\
    \n```\nsudo /etc/init.d/mpd restart\n```\n\n> “MPD 可以将音频输出到连接到系统的任何声卡，包括 iOS 和\
