    ```

    ```


    # Voice synthesizer


    # Voice synthesizer


    Add the power of speech to your Raspberry Pi projects with the versatile espeak
    Python library


    We''ve shown how the Raspberry Pi can be used to power all kinds of projects,
    but as a tiny computer it can also be the centre of an Internet of Things in your
    house too. For these reasons and more, using the Raspberry Pi for text-to-voice
    commands could be just what you''re looking for. Due to the Debian base of Raspbian,
    the powerful espeak library is easily available for anyone looking to make use
    of it. There''s also a module that allows you to use espeak in Python, going beyond
    the standard command-line prompts so you can perform automation tasks.


    # Pi''s first words


    02 The espeak library is pretty simple to use — to get it to just say something,
    type in the terminal:


    ```

    ```bash

    $ espeak "[message]"

    ```

    ```


    This will use the library''s defaults to read whatever is written in the message,
    with decent clarity. Though this simple command can do, there''s much more we
    can do...


    # Say more more


    03 You can change the way espeak will read text with a number of different options,
    such as gender, read speed and even the way it pronounces syllables. For example,
    writing the command like so...


    ```

    ```bash

    $ espeak -venf3 -k5 -s150 "[message]"

    ```

