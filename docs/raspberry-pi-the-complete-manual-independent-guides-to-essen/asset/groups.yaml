    \ text = \"Read this\", command = read_text)\nentry_ready.pack()\n\nhello_button\
    \ = Button(box, text = \"Hello World\", command = hello_world)\nhello_button.pack()\n\
    time_button = Button(box, text = \"What's the time?\", command = time_now)\ntime_button.pack()\n\
    \nroot.mainloop()\n```\n\n> “甚至还有一个模块允许你在 Python 中使用 eSpeak，这样你就可以执行自动化任务了”\n\n\
    # 项目\n\n# 构建你的第一个 Web 服务器\n\n使用 Google Coder 将你的 Raspberry Pi 变成一个微型、低耗费的 Web\
    \ 服务器和 Web 主机！\n\n在这本书中，我们教你以多种不同的方式在 Raspberry Pi 上编程，因此探讨 Web 开发似乎也很合适。\n\n\
    在 Raspberry Pi 上还有一种使用 Web 的新方式：互联网巨头 Google 最近专门为这种微型计算机发布了 Coder。这是一个基于 Raspberry\
    \ Pi 的镜像，它将你的 Pi 变成 Web 服务器和 Web 开发工具包。它可以轻松通过局域网访问，并开箱即支持 jQuery，这是提高你 Web 开发技能的简单且极佳的方式。\n\
    \n# 你需要准备...\n\n- 互联网连接\n- Web 浏览器\n- Google Coder (google.com/ads/pi/pub/scode/raspberrypi/scripts/teaching.html)\n\
    \n![](img/59caadfa348382a5c408c25137901e27_79_0.png)\n\n# 获取 Google Coder\n\n\
    01 前往 Google Coder 网站，下载该镜像的压缩版本。解压到你希望的任何位置，并像安装其他 Raspberry Pi 镜像一样使用 sd 命令进行安装。\n\
    \n```bash\nsd -if=[path to]/raspi.img of=/dev/[path to SD card] bs=1M\n```\n\n\
    # 连接 Coder\n\n03 在主系统上打开浏览器，访问 http://coder.local。你可能需要手动接受许可证。它会要求你设置密码，然后你就可以进入系统并开始编码了。\n\
    \n# 保护你的 Coder\n\n在这里设置密码。使用强密码是个好主意。\n\n![](img/59caadfa348382a5c408c25137901e27_79_1.png)\n\
    \n# 插入你的 Pi\n\n02 对于这个教程，你只需要将一根网线连接到 Pi。插入新写入的 SD 卡，连接电源并等待片刻。如果你已经连接了显示器，你会注意到\
    \ Raspberry Pi 启动序列引导至命令行登录界面。\n\n# Web 的语言\n\n04 现在是时候创建你自己的应用程序或网站了。点击示例旁边的框，给你的应用程序命名，然后点击\
    \ Create。你将进入应用程序的 HTML 部分。将 Hello World 行更改为：\n\n```html\n<h1>This is HTML</h1>\n\
    <p>This is a new block of default text</p>\n```\n\n![](img/59caadfa348382a5c408c25137901e27_80_0.png)\n\
    \n# 令人印象深刻的样式\n\n05 点击 CSS 选项卡。这允许在不需每次都在主代码中进行修改的情况下更改网页的外观和样式。你可以使用以下内容更改背景颜色和字体：\n\
