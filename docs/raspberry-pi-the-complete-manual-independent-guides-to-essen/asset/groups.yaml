    \ come up then there may be a problem at the router end. The modem/router should\
    \ be running a DHCPD server and when it connects to it, it will be given the IP\
    \ address. If it isn't running then nothing else connected to it will be able\
    \ to access the internet either. Use the web interface with another device to\
