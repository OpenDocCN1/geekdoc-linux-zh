    \ 270 欧姆略高或略低的电阻，但如果不使用任何电阻，LED 很可能会烧毁。\n\n### 添加电阻\n\n09 接下来我们需要添加电阻。将电阻的一端放在面包板上接地线的旁边，另一端放在\
