    cd /\ncd Desktop\nsudo nano gpio.py\ntry:\n    import RPi.GPIO as GPIO\nexcept\
    \ RuntimeError:\n    print(\"Error importing GPIO lib\")\n```\n\n![Image](img/59caadfa348382a5c408c25137901e27_76_0.png)\n\
    \n> **你知道吗…**\n>\n> 官方 Python 文档是初学者和专业人士的优秀资源。http://python.org/doc.\n\n### 测试脚本\n\
