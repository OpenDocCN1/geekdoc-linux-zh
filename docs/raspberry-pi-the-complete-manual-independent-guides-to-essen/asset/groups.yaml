    \ Git：\n  - `sudo apt-get install git`\n  - 打开一个终端，导航到您的主目录（使用 `cd ~`）\n  - 输入：\n\
    \    - `git clone https://github.com/nuss878/pi-mation.git`\n  - 如果你玩代码时弄坏了它，你可以使用以下命令将其恢复原始状态：\n\
    \  - `git checkout pi-mation`\n\n## 运行和测试 Pi-Motion\n\n- 现在导航到 pi-mation 文件夹并使用以下命令运行应用程序：\n\
    \  - `python pi-mation.py`\n  - 控制非常简单，并在你首次进入应用程序时显示在屏幕上。你可以随时按 F1 返回控制屏幕。祝你玩得开心！\n\
    \n# 制作便携式互联网收音机\n\n## 你需要什么……\n\n- 无线互联网连接\n- 2 x 瞬时开关\n- 4 x 母转母引线（用于将 Pi 连接到面包板）\n\
    - 2 x 220 欧姆电阻\n- 4 x 公转公引线\n- 连接到 3.5mm 耳机插孔的扬声器\n\n将你的树莓皮变成一个便携式 Wi-Fi 流媒体收音机\n\
    \n互联网上有成千上万个免费电台，通过这个项目，你可以从一个小盒子里收听所有电台。所以让我们使用树莓皮、扬声器和一些零散部件来构建我们的流媒体收音机……\n\
    \n![img/59caadfa348382a5c408c25137901e27_105_0.png](img/59caadfa348382a5c408c25137901e27_105_0.png)\n\
    \n## 让我们开始设置\n\n1. 首先，我们需要准备我们的 Pi。使用 Raspbian，并且 Pi 已连接到互联网，打开一个终端并切换到 root 用户。\n\
    \n   ```\n   sudo su\n   ```\n\n   然后更新你的软件包列表，并将你的 Pi 升级到最新软件：\n\n   ```\n  \
    \ apt-get update && apt-get upgrade -y\n   ```\n\n## 安装额外的软件包\n\n2. 我们需要安装 Python\
    \ 软件包以访问 GPIO。在终端中，以 root 身份登录，输入以下内容\n\n   ```\n   apt-get install python-rpi-gpio\n\
    \   ```\n\n   现在安装 MPlayer，它将用于播放我们的音频。\n\n   ```\n   apt-get install mplayer\n\
    \   ```\n\n## 使文件可执行并安装\n\n3. 要安装工具，我们需要导航到 Pi 上的 3.5mm 音频插孔。master/Install 我们现在需要使\
    \ `installIAUITSuite.sh` 对所有用户可执行，所以请使用：\n\n   ```\n   chmod 777 installIAUITSuite.sh\n\
    \   ```\n\n   现在文件可执行了，让我们安装：\n\n   ```\n   sudo ./ installIAUITSuite.sh\n   ```\n\
    \n## 完整代码列表\n\n我们导入 RPi.GPIO 库并将其设置为使用 BCM 编号系统\n\n```python\n#!/usr/bin/env python\n\
    import time\nimport sleep\nimport os\nimport RPi.GPIO as GPIO\n```\n\n在这里，我们设置引脚\
    \ 23 和 24，它们控制电台选择\n\n```python\n# 1. Found loads of BBC Radio streams at from\
    \ http://bbestreams.com/\nGPIO.setmode(GPIO.BCM)\nGPIO.setup(23, GPIO.IN)\nGPIO.setup(24,\
    \ GPIO.IN)\n```\n\n在这里，我们说如果按下 23 的按钮，运行下面的命令\n\n```python\nwhile True:\n if GPIO.input(23)==1:\n\
    \ os.system('sudo killall mplayer')\n os.system('mplayer -playlist http://bb...uk/radio/listen/live/1.asx')\n\
    ```\n\n在这里，我们看到脚本终止任何打开的 Mplayer 进程，然后加载电台\n\n```python\nif GPIO.input(24)==1:\n\
    \ os.system('sudo killall mplayer')\n os.system('mplayer -playlist http://bb...uk/radio/listen/live/r6.asx\
    \ &')\n sleep(0.1)\nGPIO.cleanup()\n```\n\n## 设置软件\n\n4. 将 `radio.py` 从 www.instructurs.co.uk/utlateral-files\
    \ 复制到你的主目录。你可以重新链接它：在 www.instructurs.co.uk/user/later no. 现在打开一个终端并切换到 root，并通过执行以下操作编辑你的网络接口配置\n\
    \   ```\n   nano /etc/network/interfaces\n   ```\n\n## 配置收音机在启动时运行\n\n6. 在终端中，以\
    \ root 身份，导航到 `/etc/init.d/` 并使用 nano 创建一个名为 `radio` 的文件\n   ```\n   nano radio\n\
    \   ```\n\n   在该文件中，输入以下内容：\n   ```\n   #!/bin/bash\n   modprobe snd_bcm2835\n\
    \   amixer cset numid=3 1\n   python /home/pi/radio.py\n   ```\n\n   这加载了声卡的内核模块。Amixer\
    \ 将输出设置为 3.5mm 耳机插孔。这就是我的意思，HDMI 是 8。最后它调用 Python 脚本。\n\n## Raspi-config\n\n8.\
    \ 在终端中，以 root 身份，使用 `raspi-config` 改变你的 Pi 的启动行为。我们不希望加载桌面，我们只需要一个终端，所以项目在未来使用中将不需要屏幕。完成后，重启\
    \ Pi，并观看启动输出如何冲刷屏幕。\n\n## Wi-Fi 配置\n\n5. 我们希望 Pi 在启动时自动通过 Wi-Fi 连接到你的路由器。编辑你的\
    \ `/etc/network/interfaces` 文件，使其类似于这样：\n\n   ```\n   auto lo\n   iface lo inet\
    \ loopback\n   iface eth0 inet dhcp\n   allow-hotplug wlan0\n   auto wlan0\n \
    \  iface wlan0 inet dhcp\n   wpa-conf \"ssid\"\n   wpa-psk \"password\"\n   ```\n\
    \n   用你自己的详细信息替换 `'ssid'` 和 `\"password\"`，但保留引号。\n\n## 使其可执行\n\n7. 通过按 Ctrl-X\
    \ 保存并退出 `/etc/init.d/` 中的 `radio`，然后回答提示是。现在通过输入以下命令（作为 root）使 `radio` 可执行：`chmod\
    \ 755 radio`。然后，作为 root，通过在终端中输入以下命令将 `radio` 注册为在启动时运行：`update-rc.d radio defaults`\n\
    \n## 第一次测试\n\n9. 一旦 Pi 完成加载，按键盘上的一个按钮。几秒后，你应该能听到声音通过耳机插孔传出。就这样，你有一个无线互联网收音机。为什么不用映射添加静音功能呢。示例：manpages.example\
    \ mutetime mappings/syslog.man/lan/syslogd.html 以及另一个监视器屏幕。你甚至可以添加一个 LCD 屏幕：www.piblog.com/20/12/17/interfacing-16x2-lcd-with-raspberry-pi-html)\
    \ 来显示电台详情。\n\n"
