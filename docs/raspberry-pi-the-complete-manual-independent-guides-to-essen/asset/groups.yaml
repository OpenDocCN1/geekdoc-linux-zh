    \n## Pivaders 第二部分：图形和声音\n\n这次我们将扩展我们的《太空侵略者》克隆版，加入身临其境的动画和声音效果。\n\n我们在上一期教程中创建基础版《太空侵略者》克隆版（Pivaders）时玩得非常开心。Pygame\
