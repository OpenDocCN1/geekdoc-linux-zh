    > 将你的树莓派改造为一个高度安全且极其便携的路由器，以保护你的安全与匿名……\n\n本书的其他章节中，我们已经向你展示了如何将树莓派打造为终极便携式无线路由器，它功耗极低，只要有最基础的互联网连接，就能为你提供一个无线网络。但如果仅仅知道可以搜索网络还不够呢？如果你希望在进行操作时完全确保安全呢？那么，是时候使用\
    \ Tor 升级路由器以保护你在互联网上的隐私了。\n\n正如 Adafruit 所称，这个“洋葱 Pi”结合了 Raspbian 和 Tor，仅使用树莓派即可创建并保护无线接入点。这能让你在线保持匿名——在隐私担忧遍布整个网络的时代，这是一个非常实用的功能。\n\
    \n即使树莓派未连接互联网，它仍应作为无线路由器正常工作。\n\n#### 你知道吗……\n\n由于某些政府机构的行动，如今人们对互联网安全非常感兴趣\n\n\
    #### 全是软件\n\n这不是硬件破解——一张备用 SD 卡即可用于 Tor 路由器，其他 SD 卡也可用于不同功能，毫无问题\n\n#### 安全第一\n\
    \n使用我们构建的不仅仅是树莓派，你可以将更多系统通过启用 Tor 的接入点进行路由，从而确保匿名\n\n#### 支持 Wi-Fi\n\n通过无线网络连接所有设备——无需使用线缆直接连接到树莓派\n\
    \n#### 需要以太网\n\n只要几乎有任何互联网连接的地方（如亲戚家、酒店房间等）即可接入互联网\n\n![](img/59caadfa348382a5c408c25137901e27_115_0.png)\n\
    \n![](img/59caadfa348382a5c408c25137901e27_116_0.png)\n\n![](img/59caadfa348382a5c408c25137901e27_116_1.png)\n\
    \n#### 安装 Raspbian\n\n**01** Raspbian 是我们在洋葱 Pi 中将使用的树莓派发行版。下载 zip 文件，提取镜像，然后使用以下命令将其应用到\
    \ SD 卡：\n\n```\n$ dd bs=4M if=Raspbian[version].img of=/dev/[SD card location]\n\
    ```\n\n如果你愿意，也可以使用 NOOBS 来安装 Raspbian。\n\n#### 设置 Raspbian\n\n**02** 完成初始的 Raspbian\
    \ 设置，并确保启用 SSH 服务器，同时禁用桌面自动登录——这是不必要的，只会消耗额外的电力。如果空间允许，你还可以设置填满剩余的空间。\n\n####\
    \ 树莓派 IP\n\n**03** 我们将通过 SSH 访问并配置你的树莓派。为此，我们需要知道它的 IP 地址——你可以通过在命令行输入 `ifconfig`\
    \ 来查找。记下该地址并关闭你的树莓派。\n\n#### SSH 连接\n\n**04** 将 USB 无线适配器插入树莓派并重新启动。在连接到同一网络的另一台计算机上，打开终端或在命令行中输入：\n\
    \n```\n$ ssh [user]@[IP address]\n```\n\n如果被要求，请输入你的 Raspbian 树莓派的密码。\n\n####\
    \ 安装 DHCP\n\n**05** 为了方便任何连接至树莓派接入点的系统，我们需要在上面安装一个 DHCP 服务器。操作方法如下：\n\n```\n$\
    \ sudo apt-get install hostapd isc-dhcp-server\n```\n\nDHCP 会自动为联网设备分配 IP 地址，意味着你不需要静态\
    \ IP。\n\n#### 配置 DHCP\n\n**06** 现在我们需要配置 DHCP 服务器。使用以下命令编辑配置文件：\n\n```\n$ sudo\
    \ nano /etc/dhcp/dhcp.conf\n```\n\n首先，在两个 option domain-name 条目前面加上 #，然后移除 authoritative\
    \ 和 server 行前面的 #，并继续向下操作。\n\n![](img/59caadfa348382a5c408c25137901e27_116_2.png)\n\
    \n#### 服务器地址\n\n**07** 在配置文件末尾添加以下内容：\n\n```\nsubnet 192.168.42.0 netmask 255.255.255.0\
    \ {\n    range 192.168.42.10 192.168.42.55;\n    option broadcast-address 192.168.42.255;\n\
    \    default-lease-time 600;\n    max-lease-time 7200;\n    option domain-name\
    \ \"local\";\n    option domain-name-servers 8.8.8.8, 8.8.4.4;\n}\n```\n\n保存并退出。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_116_3.png)\n\n#### DHCP 服务器\n\n**08**\
    \ 编辑服务器配置文件，使其设置为与无线适配器协同工作：\n\n```\n$ sudo nano /etc/default/isc-dhcp-server\n\
    ```\n\n滚动到 INTERFACES= 并将其更改为：\n\n```\nINTERFACES=\"wlan0\"\n```\n\n#### 传入 Wi-Fi\n\
    \n**09** 我们需要设置 Wi-Fi 适配器，使其既作为静态 IP 又能接受传入信号。首先：\n\n```\n$ sudo nano /etc/network/interfaces\n\
    ```\n\n在 iface wlan0 以及 wpa-roam、iface default 和任何其他面向 wlan0 的行前加上 #。\n\n####\
    \ 静态 IP\n\n**10** 现在为无线接口分配静态 IP – 在 allow-hotplug wlan0 行之后，输入以下内容：\n\n```\n\
    iface wlan0 inet static\n    address 192.168.42.1\n    netmask 255.255.255.0\n\
    ```\n\n保存并退出，然后使用以下命令设置 wlan0 的地址：\n\n```\n$ sudo ifconfig wlan0 192.168.42.1\n\
    ```\n\n![](img/59caadfa348382a5c408c25137901e27_117_0.png)\n\n#### 创建 WLAN\n\n\
    **11** 我们需要创建一个新的文件，保存我们无线网络的所有信息。我们将为其设置密码保护，以便只有我们希望允许的人才能访问。要创建该文件，请从以下命令开始：\n\
    \n```\n$ sudo nano /etc/hostapd/hostapd.conf\n```\n\n完成后，你可以继续下一步……\n\n> “洋葱 Pi\
    \ 结合了 Raspbian 和 Tor。这能让你在线保持匿名。在隐私担忧遍布整个网络的时代，这是一个非常实用的功能”\n\n#### WLAN 配置\n\n\
    **12** 假设你已按照第 11 步打开了 hostapd.conf：请编写：\n\n```\ninterface=wlan0\ndriver=rtl8192x\n\
    ssid=<access point name>\nhw_mode=e\nchannel=1\nmacaddr_acl=0\nauth_algs=1\nignore_broadcast_ssid=0\n\
    wpa=2\nwpa_passphrase=<password>\nwpa_key_mgmt=WPA-PSK\nwpa_pairwise=TKIP\nrsn_pairwise=CCMP\n\
    ```\n\n#### Hostapd\n\n**13** 保存并退出后，我们需要编辑 hostapd，使其指向这个新文件。使用以下命令打开它：\n\n```\n\
    $ sudo nano /etc/default/hostapd\n```\n\n然后找到 #DAEMON_CONF=\"\" 这一行。移除 #，并将其更改为：\n\
    \n```\nDAEMON_CONF=\"/etc/hostapd/hostapd.conf\"\n```\n\n#### 网络寻址\n\n**14** 设置\
    \ NAT 将允许多个客户端连接。为此，打开终端窗口（如果尚未打开），并输入以下内容：\n\n```\n$ sudo nano /etc/sysctl.conf\n\
    ```\n\n并在文件底部添加：\n\n```\nnet.ipv4.ip_forward=1\n```\n\n保存，退出，然后运行以下命令完成设置：\n\n\
    ```\n$ sudo sh -c 'echo 1 > /proc/sys/net/ipv4/ip_forward'\n```\n\n#### IP 表\n\
    \n**15** 运行以下三条命令以确保互联网连接正确转发。请仔细将它们复制到终端中。\n\n```\nsudo iptables -t nat -A POSTROUTING\
    \ -o eth0 -j MASQUERADE\nsudo iptables -A FORWARD -i eth0 -o wlan0 -m state --state\
    \ RELATED,ESTABLISHED -j ACCEPT\nsudo iptables -A FORWARD -i wlan0 -o eth0 -j\
    \ ACCEPT\n```\n\n#### 应用配置\n\n**16** 为了确保即使树莓派重启后这些设置依然有效，请输入：\n\n```\n$ sudo\
    \ sh -c 'iptables-save > /etc/iptables.ipv4.nat'\n```\n\n然后在 /etc/network/interfaces\
    \ 末尾添加：\n\n```\nUp iptables-restore < /etc/iptables.ipv4.nat\n```\n\n#### Wi-Fi\
    \ 最终设置\n\n**17** 最后，将其设置为守护进程，以便在启动时运行，使用以下命令：\n\n```\nsudo service hostapd start\n\
    sudo service isc-dhcp-server start\nsudo update-rc.d hostapd enable\nsudo update-rc.d\
    \ isc-dhcp-server enable\n```\n\n无线接入点部分到此结束。\n\n#### 安装 Tor\n\n**18** 重启后，我们现在需要安装\
    \ Tor。操作很简单：\n\n```\n$ sudo apt-get install tor\n```\n\n安装完成后，你需要使用以下命令编辑 Tor\
    \ 配置文件：\n\n```\n$ sudo nano /etc/tor/torrc\n```\n\n按照下一步骤，将所需的所有信息添加到其中。\n\n![](img/59caadfa348382a5c408c25137901e27_118_0.png)\n\
    \n#### Tor 配置\n\n**19** 将此内容放在 FAQ 注释下方：\n\n```\nLog notice file /var/log/tor/notices.log\n\
    VirtualAddrNetwork 10.192.0.0/10\nAutomapHostsSuffixes .onion, .exit\nAutomapHostsOnResolve\
    \ 1\nTransPort 9040\nTransListenAddress 192.168.42.1\nDNSPort 53\nDNSListenAddress\
    \ 192.168.42.1\n```\n\n#### 清除表\n\n**20** 现在我们需要清除当前的 IP 表，以便路由可以正常通过。\n\n```\n\
    $ sudo iptables -F\n$ sudo iptables -t nat -F\n```\n\n如果你希望保持 SSH 开放以便远程连接，你需要为此创建例外，使用：\n\
    \n```\n$ sudo iptables -t nat -A PREROUTING -i wlan0 -p tcp -dport 22 -j REDIRECT\
    \ --to-port 22\n```\n\n#### 重新路由\n\n**21** 首先使用以下命令路由所有 DNS 流量：\n\n```\n$ sudo\
    \ iptables -t nat -A PREROUTING -i wlan0 -p udp -dport 53 -j REDIRECT --to-port\
    \ 53\n```\n\n然后使用以下命令路由任何 TCP 流量：\n\n```\n$ sudo iptables -t nat -A PREROUTING\
    \ -i wlan0 -p tcp --syn -j REDIRECT --to-ports 9040\n```\n\n![](img/59caadfa348382a5c408c25137901e27_118_1.png)\n\
    \n#### 检查和保存\n\n**22** 你可以使用以下终端命令检查表设置。如果有效，你需要保存它，请继续阅读：\n\n```\n$ sudo iptables\
    \ -t nat -L\n```\n\n如果你对此感到满意，像之前一样将其保存到 NAT 文件：\n\n```\n$ sudo sh -c \"iptables-save\
    \ > /etc/iptables.ipv4.nat\"\n```\n\n#### 日志记录\n\n**23** 我们应该创建一个日志文件。如果你使用这三个命令，这一点很重要。\n\
    \n```\n$ sudo touch /var/log/tor/notices.log\n$ sudo chown debian-tor /var/log/notices.log\n\
    $ sudo chmod 644 /var/log/tor/notices.log\n```\n\n你也可以使用以下命令检查它：\n\n```\n$ ls\
    \ -l /var/log/tor\n```\n\n#### 保护路由器\n\n**24** 最后，我们可以启用 Tor 服务，以便开始安全地使用接入点：\n\
    \n```\n$ sudo service tor start\n```\n\n你可以使用以下命令检查它是你的：\n\n```\n$ sudo service\
    \ tor status\n```\n\n"
