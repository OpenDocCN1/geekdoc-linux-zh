  - "[PAGE 43]\n\n# Access your files with SSH\n\nUse the terminal of your home computer\
    \ to gain quick and secure access to your Raspberry Pi\n\n+   **What you’ll need...**\n\
    +   \n+   Any Raspberry Pi distro\n+   www.raspberrypi.com/downloads\n+   Internet\
    \ connection\n+   Second computer\n\nWhile remotely logging into the full X environment\
    \ is – as we demonstrated on the previous pages – very useful, it has its disadvantages.\
    \ Firstly, it’s not particularly quick or convenient to do. The user experience\
    \ can be slow and cumbersome too, but worst of all, it’s not as secure as we’d\
    \ really like.\n\n> **Did you know...**\n> \n> SSH is the most secure method of\
    \ accessing any machine remotely. It’s also quicker than VNC.\n\nIf you want to\
    \ take a more convenient and secure approach to accessing your Raspberry Pi from\
    \ another computer, you’ll find that all well-versed Pi enthusiasts will use SSH.\
    \ SSH stands for Secure Shell and is a cryptographic network protocol which is\
    \ designed to ensure secure data communication via the command line.\n\nWhile\
    \ beginners might argue it’s easier to remotely access their Raspberry Pi using\
    \ the full graphical interface, as soon as you’ve learnt a handful of basic command-line\
    \ techniques you’ll quickly find ‘dipping in’ to your Raspberry Pi via SSH is\
    \ by far the most convenient way to talk to it remotely.\n\nYou’ll be pleased\
    \ to hear that SSH is already well configured out of the box – there’s very little\
    \ you need to do to make it work, especially if your remote computer runs Linux\
    \ or OS X, as we’re going to demonstrate here.\n\n![](img/59caadfa348382a5c408c25137901e27_43_0.png)\n\
    \n# SSH is easy with Linux and OS X\n\nAssuming your Raspberry Pi is on and connected\
    \ to a network either by Ethernet or a Wi-Fi dongle, the only piece of information\
    \ you need is the IP address of your Pi. To discover this, all you have to do\
    \ is open a terminal window on your Raspberry Pi and type the command ifconfig\
    \ (Fig 1).\n\nIf you’re connected by Ethernet cable you’ll see ‘eth0’, then several\
    \ lines of results. The IP address will be the number on the second line next\
    \ to words ‘inet addr’. If you’re connected by Wi-Fi,"
  - '[PAGE 44]


    # Access your files with SSH


    the result will be on the second line of ‘what?’. The IP address itself is a group
    of four numbers separated by full stops. If you’re on your home network, it will
    likely be similar to 192.168.0.15. We’ll use this number for our guide, but replace
    it with the IP address you’ve seen via ifconfig.


    With this information in hand, all you need to do is open a terminal window on
    your remote Linux PC and type:


    ```

    ssh pi@192.168.0.15

    ```


    This assumes your Raspberry Pi’s username is still the default (which is pi) and
    you’re replacing the IP address with the one you made note of just now. If you’ve
    added user accounts or changed the default, you’ll need to replace the username
    before the ‘@’ with whatever you’ve changed it to. When you press Enter, you’ll
    be prompted to enter the password for your Raspberry Pi – again, if it’s the default
    you can type `raspberry`, otherwise type in your Pi’s password and press `Return`.


    You’ll now see that the username details on the command line have changed to reflect
    those of your Raspberry Pi – you’re now connected remotely. Try looking through
    your files or using nano to open a file to edit it!


    # Never type another IP address


    Of course, if you take your Raspberry Pi to another network, your Pi’s IP address
    will be different. If you just want to connect to it remotely, it becomes incredibly
    tiresome to set up your Pi with a keyboard, mouse and monitor just to get the
    IP address. Wouldn’t it be easier if you could just type the Raspberry Pi’s name
    into the terminal to connect? It sounds too good to be true, but it’s actually
    very easy to do.


    All you need is a small piece of software which effectively lets you discover
    hosts and services on your local network by name instead of IP address (Fig 2).
    To set it up on your Pi all you need to do is open a terminal and type:


    ```

    sudo apt-get install avahi-daemon

    ```


    Once the installation is complete, all you have to do to access your Raspberry
    Pi via SSH is type the following into the terminal:


    ```

    ssh pi@raspberrypi.local

    ```


    What’s more, you can use the name of your Raspberry Pi when you access it via
    any other form of networking, be it Samba, remote login with VNC or anything else!


    ![](img/59caadfa348382a5c408c25137901e27_44_0.png)


    # SSH with Windows


    As is the way with most things in the Windows world, accessing your Raspberry
    Pi with Microsoft’s operating system isn’t quite as straightforward as you’d think.
    Fortunately, there is a useful tool to help: Putty allows you to make your Secure
    Shell connection and it’s easy to set up and use. You can download Putty from:
    [www.chiark.greenend.org.uk/ ~sgtatham/putty/](www.chiark.greenend.org.uk/ %20~sgtatham/putty/)


    ![](img/59caadfa348382a5c408c25137901e27_44_1.png)'
  - '[PAGE 45]


    # What you''ll need... Rapsbian www.raspberrypi.org/downloads Internet connection


    Did you know... You can network with other Linux, Windows and Mac OS X computers
    with Samba – it''s totally cross-platform.


    # Share your files with Samba


    # Share your files with Samba


    Configure your Pi to share the contents of the home folder over your home network


    Regardless of whether you plan to set your Raspberry Pi up as a media centre,
    gaming machine or full-on development platform, the ability to share and access
    the contents of your Pi from other machines is very useful.


    While the Raspberry Pi is very well configured, by default it doesn''t include
    the ability to share the contents of your home folder with your local network.
    As you''ll see from this guide, though, it''s not too difficult to accomplish
    thanks to Samba and can help you access your scripts, media or documents from
    any other machine.


    ![](img/59caadfa348382a5c408c25137901e27_45_0.png)


    # Update & install Samba


    Open a terminal window and type the following into the terminal to update the
    Raspbian repository and then install Samba


    ```

    sudo apt-get update && sudo apt-get install samba samba-common-bin

    ```


    The operation itself shouldn''t take too long. Just make sure that you''re connected
    to the internet before you start


    # Load smbc.conf


    With the core packages installed, you now need to tell Samba how you want it to
    work. You do this by putting your preferred settings in Samba''s configuration
    file. This file is called smbc.conf and it''s located in the /etc/samba folder.
    While it''s easy to locate it using the file managers, it''s easier to open and
    edit it from the command line. Type the following into the terminal window to
    open it with nano:


    ```

    1 sudo nano /etc/samba/smb.conf

    ```


    # Initial setup


    Take a look through the file. There''s lots of information here and it seems a
    bit daunting, but there are only a handful of changes and additions to make. Firstly,
    you need to make sure you have assigned the correct workgroup. Unless your network
    has been configured differently, it will likely be called WORKGROUP. To find the
    workgroup setting, press Ctrl+W and type workgroup, then press Enter – this will
    take you to the first occurrence of the word ''workgroup''. Use the arrow keys
    to move between lines – the mouse doesn''t work in nano.


    ![](img/59caadfa348382a5c408c25137901e27_45_1.png)


    # Windows support


    If you have Windows computers in your network, you''ll need to ensure WINS support
    is allowed. Assuming you''re working from the default smbc.conf configuration
    file, you''ll find the flag for WINS support a few lines below the workgroup line.
    Edit it so it looks like this:


    ```

    wins support = yes

    ```'
