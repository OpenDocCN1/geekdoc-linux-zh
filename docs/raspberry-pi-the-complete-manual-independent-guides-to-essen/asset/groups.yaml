    \ notes at those tones at the tempo we've set. You can create longer and shorter\
    \ strings, and also change the way they play.\n\n### Your first note\n\n03 Our\
    \ first thing to try on Sonic Pi is simply being able to play a note. Sonic Pi\
    \ has a few defaults preset, so we can get started with:\n\n```\nplay 50\n```\n\
    \nPress the Play button and the output window will show you what's being played.\
    \ The pretty, bell sound is the default tone for Sonic Pi's output, and 50 determines\
    \ the pitch and tone of the sound.\n\n![](img/59caadfa348382a5c408c25137901e27_72_0.png)\n\
    \n![](img/59caadfa348382a5c408c25137901e27_72_1.png)\n\n### Advance your melody\n\
    \n05 We can start making more complex melodies by using more of Sonic Pi's functions.\
    \ You can change the note type by using `with_synth`, reverse a pattern, and even\
    \ create a finite loop with the `times` function, to end and signify the start\
    \ and end of the loop. Everything is played in sequence before repeating, much\
    \ like an if or while loop in normal code.\n\n### Full code listing\n\n```ruby\n\
    set_tempo   200\nplay_pattern  [40,25,45,25,50,50]\n2.times do\n  with_synth \"\
    beep\"\n    play_pattern  [40,25,45,25,50,50]\n    play_pattern  [40,25,45,25,50,50].reverse\n\
    \  end\nplay_pad \"saws\", 3\nin_thread do\n  with_synth \"fm\"\n    6.times do\n\
    \      if rand < 0.5\n        play 30\n      else\n        play 50\n      end\n\
    \      sleep 2\n    end\n  end\n2.times do\n  play_synth \"pretty_bell\"\n   \
    \ play_pattern  [40,25,45,25,50,50]\n    play_pattern  [40,25,45,25,50,50].reverse\n\
    \  end\nend\n```\n\n### Playing a concert\n\n06 Using the `in_thread` function,\
    \ we are able to create another thread for the Sonic Pi instance, and have several\
    \ lines of musical code play at once instead of in sequence.\nWe have made it\
    \ create a series of notes in a random sequence, and have them play alongside\
    \ extra notes created by the position and velocity of the mouse using the `play_pad`\
    \ function.\n\n## Projects\n\n### What you'll need...\n\n- **Breadboard:**\n \
    \ www.pctric-pt.co.uk/half-size-breadboard\n- **3mm LED light:**\n  www.ultralife.co.uk/led-product-category/basic-leds-3-5-8-10mm.html\n\
    - **Wires:**\n  www.pctric.co.uk/product/breadboard-wires\n- **270-ohm resistor:**\n\
    \  http://goo.gl/xDwfD#p991\n\n![](img/59caadfa348382a5c408c25137901e27_73_0.png)\n\
    \n*Fig 1:* All the items you will need to get going: adjusting an LED using PWM.\
    \ The wires should have a male and female ends.\n\n![](img/59caadfa348382a5c408c25137901e27_73_1.png)\n\
    \n*Fig 2:* Place the female end onto the Pi, noting pin number 1 being identified\
    \ by the small Pi. The blue wire is ground.\n\n![](img/59caadfa348382a5c408c25137901e27_73_2.png)\n\
    \n*Fig 3:* Once everything is connected up, plug in your USB power cable.\n\n\
    ![](img/59caadfa348382a5c408c25137901e27_73_3.png)\n\n*Fig 4:* Switch the power\
    \ on. The LED will light up. If it's dim, use a lower rated resistor.\n\n### Control\
    \ an LED using GPIO\n\nAn introduction into using an external output, such as\
    \ an LED, on the Pi\n\nAfter you have fired up your Pi, maybe installed XBMC and\
    \ had a play around with streaming, you might be ready for your next challenge.\
    \ One route to go down is to find interesting uses for one of the many desktop\
    \ OSes available for the little computer, perhaps using it as a web server, an\
    \ NAS or retro arcade console. This is all great fun, but an often-overlooked\
    \ feature of the Pi is its hardware pins. If you've never done any electronics\
    \ before, then the Pi is a great place to start. Or maybe you have used a programmable\
    \ microcontroller such as Arduino in the past; the Pi, with its increased CPU\
    \ and RAM over the Arduino, opens up many more possibilities for fun projects.\n\
    \nThe Raspberry Pi features a single PWM (pulse width modulation) output pin,\
    \ along with a series of GPIO (General Purpose Input/Output) pins. These enable\
    \ electronic hardware such as buzzers, lights and switches to be controlled via\
    \ the Pi. For people who are used to either just 'using' a computer, or only programming\
    \ software that only acts on the machine itself, controlling a real physical item\
    \ such as a light can be a revelation.\n\nThis tutorial will assume no prior knowledge\
    \ of electronics or programming, and will take you through the steps needed to\
    \ control an LED using the Raspberry Pi, from setting it up to coding a simple\
    \ application.\n\n![](img/59caadfa348382a5c408c25137901e27_73_4.png)\n\n> “We'll\
    \ take you through the steps needed to control an LED using the Pi, from setting\
    \ it up to coding”\n\n![](img/59caadfa348382a5c408c25137901e27_74_0.png)\n\n-\
    \ **Breadboard**\n  The breadboard, or prototype board, provides an easy-to-use\
    \ and selfless environment for creating and changing your development circuits.\n\
    - **Breadboard wire**\n  A must for any budding electrical engineer, these male-to-male\
    \ and male-to-female wires make for fast and easy circuit building.\n- **GPIO\
    \ header**\n  This provides a mechanism for both gathering input and providing\
    \ output to electrical circuits, enabling reactive program design.\n- **Coloured\
    \ LED**\n  Different coloured LEDs are a great way to physically see which part\
    \ of the software is running and help you understand the program flow.\n\n###\
    \ The Pi's pins\n\n01 Before we dive into writing code, let's take a look at the\
    \ layout of the pins on the Pi. If you have your Pi in a case, take it out and\
    \ place it in front of you with the USB ports on the right. Over the next few\
    \ steps we'll look at some of the uses you'll encounter when using the GPIO port.\n\
    \n**Pi revision 1 or 2?**\n\n02 Depending on when you purchased your Pi, you may\
    \ have a revision 1 or revision 2 model. The GPIO layout is slightly different\
    \ for each, although they do have the same functionality. Here we have a revision\
    \ 1; revision 2 became available towards the end of 2012.\n\n**Pin numbers**\n\
    \n03 If you take a look at the top right of the board you'll see a small wire\
    \ label, P1: This is pin 1 and above it is pin 2. To the right of pin 1 is pin\
    \ 3, and above 3 is 4. This pattern continues until you get to pin 26 at the end.\
    \ As you'll see in the next step, some pins have important uses.\n\n**Pin uses**\n\
    \n04 Pin 1 is 3V3, or 3.3 volts. This is the main pin we will be using in this\
    \ guide to provide power to our LED. Pins 2 and 4 are 5V. Pin 6 is the other pin\
    \ we will use here, which is ground. Other ground pins are 9, 14, 20 and 25. You\
    \ should always ensure your project is properly grounded.\n\n**GPIO pins**\n\n\
    05 The other pins on the board are GPIO (General Purpose Input/Output) These are\
    \ used for other tasks that you need to do as your projects become more complex\
    \ and challenging. Be aware that the USB power supply doesn't offer much scope\
    \ for powering large items.\n\n**Basic LED lighting**\n\n06 Okay, so let's get\
    \ down to business and start making something. Firstly, get your breadboard, two\
    \ wires, a 220Ω resistor and an LED. Note the slightly bent leg on one side of\
    \ the LED; this is important for later on. Make sure your Pi is unplugged from\
    \ the mains supply.\n"
  mdcn: "\n## 使用 Sonic Pi 制作音乐\n\n### 制作音乐\n\n使用 Sonic Pi 编程创作你自己的旋律，并制作音乐音效或机器人蜂鸣声\n\
    \n### 你需要准备...\n\n- 便携式扬声器\n- 或耳机\n- Sonic Pi\n- www.cl.cam.ac.uk/projects/raspberrypi/sonicpi/teaching.html\n\
    \n### 你知道吗...\n\nSonic Pi 默认已安装在最新版本的 Raspbian 操作系统中。如果它缺失了，请遵循第一步！\n\nScratch\
    \ 的主要特点之一是它能够向儿童和没有计算背景的人教授编程基础。对于儿童来说，由于它允许他们通过创建可互动的电子游戏作为学习的一部分来吸引他们，因此特别有吸引力。在这种类似的情况下，Sonic\
    \ Pi 使用音乐来教授人们编程。它使用一种简单的语言，利用基本的逻辑步骤，但以比 Scratch 更高级的方式进行。它可以用作 avid coders 的下一步，或者作为一种方式为物联网或机器人创作音乐。\n\
    \n> “通过使用 Sonic Pi 的更多功能，我们可以开始制作更复杂的旋律”\n\n![](img/59caadfa348382a5c408c25137901e27_71_0.png)\n\
    \nSonic Pi 是学习基本编程原理并享受乐趣的好方法\n\n![](img/59caadfa348382a5c408c25137901e27_71_1.png)\n\
    \n### 获取 Sonic Pi\n\n01 如果你安装了最新版本的 Raspbian，Sonic Pi 将默认包含在内。如果你仍然使用稍旧的版本，那么你需要通过软件仓库安装它。操作如下：\n\
    \n```\n$ sudo apt-get install sonic-pi\n```\n\n### 开始使用 Sonic Pi\n\n02 Sonic Pi\
    \ 位于菜单中的“教育”类别中。打开它，你会看到一个看起来像 IDE 的东西。左侧窗格允许你输入项目的代码，并带有针对其自身语言风格的适当语法高亮。运行时，信息窗格详细说明了\
    \ Sonic Pi 正在播放的内容——任何错误也会在单独的窗格中列出以供参考。\n\n### 设定节拍\n\n04 对于任何乐曲，你都需要设定速度。我们可以从在代码开头放置\
    \ `set_tempo 200` 开始。我们可以通过使用 `play_pattern` 创建一串 midi 音符来测试它：\n\n```\nplay_pattern\n\
    [40,25,45,25,50,50]\n```\n\n这将按照我们设定的速度，以漂亮的钟声音调播放这些音调。你可以创建更长或更短的信，也可以改变它们的演奏方式。\n\
    \n### 你的第一个音符\n\n03 我们在 Sonic Pi 上首先要尝试的是简单地能够播放一个音符。Sonic Pi 有几个默认预设，因此我们可以从以下开始：\n\
    \n```\nplay 50\n```\n\n按播放按钮，输出窗口将向你显示正在播放的内容。Sonic Pi 输出的默认音调是漂亮的钟声，而 50 决定了声音的音高和音调。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_72_0.png)\n\n![](img/59caadfa348382a5c408c25137901e27_72_1.png)\n\
    \n### 推进你的旋律\n\n05 通过使用 Sonic Pi 的更多功能，我们可以开始制作更复杂的旋律。你可以使用 `with_synth` 改变音符类型，反转模式，甚至使用\
    \ `times` 功能创建一个有限的循环，以结束并标志循环的开始和结束。在重复之前，所有内容都是按顺序播放的，很像普通代码中的 if 或 while 循环。\n\
    \n### 完整代码列表\n\n```ruby\nset_tempo   200\nplay_pattern  [40,25,45,25,50,50]\n\
    2.times do\n  with_synth \"beep\"\n    play_pattern  [40,25,45,25,50,50]\n   \
    \ play_pattern  [40,25,45,25,50,50].reverse\n  end\nplay_pad \"saws\", 3\nin_thread\
    \ do\n  with_synth \"fm\"\n    6.times do\n      if rand < 0.5\n        play 30\n\
    \      else\n        play 50\n      end\n      sleep 2\n    end\n  end\n2.times\
    \ do\n  play_synth \"pretty_bell\"\n    play_pattern  [40,25,45,25,50,50]\n  \
    \  play_pattern  [40,25,45,25,50,50].reverse\n  end\nend\n```\n\n### 举办音乐会\n\n\
    06 使用 `in_thread` 功能，我们能够为 Sonic Pi 实例创建另一个线程，并有几行音乐代码同时播放，而不是按顺序播放。\n我们让它创建一个随机序列的音符系列，并使用\
    \ `play_pad` 功能让它们在由鼠标位置和速度创建的额外音符旁边播放。\n\n## 项目\n\n### 你需要准备...\n\n- **面包板：**\n\
    \  www.pctric-pt.co.uk/half-size-breadboard\n- **3mm LED 灯：**\n  www.ultralife.co.uk/led-product-category/basic-leds-3-5-8-10mm.html\n\
    - **导线：**\n  www.pctric.co.uk/product/breadboard-wires\n- **270欧姆电阻：**\n  http://goo.gl/xDwfD#p991\n\
    \n![](img/59caadfa348382a5c408c25137901e27_73_0.png)\n\n*图 1：* 开始所需的所有物品：使用 PWM\
    \ 调整 LED。导线应有公头和母头两端。\n\n![](img/59caadfa348382a5c408c25137901e27_73_1.png)\n\n\
    *图 2：* 将母头端放置在 Pi 上，注意引脚 1 由小 Pi 标识。蓝色线是接地。\n\n![](img/59caadfa348382a5c408c25137901e27_73_2.png)\n\
    \n*图 3：* 连接好一切后，插入 USB 电源线。\n\n![](img/59caadfa348382a5c408c25137901e27_73_3.png)\n\
    \n*图 4：* 打开电源。LED 将亮起。如果它暗淡，请使用更低额定值的电阻。\n\n### 使用 GPIO 控制 LED\n\n介绍如何在 Pi 上使用外部输出，例如\
    \ LED\n\n在你启动你的 Pi，也许安装了 XBMC 并尝试了一下流媒体之后，你可能已经准备好迎接下一个挑战了。一条路线是寻找小电脑上可用的众多桌面操作系统之一的有趣用途，也许将其用作\
    \ web 服务器、NAS 或复古街机游戏机。这都很有趣，但 Pi 的一个常被忽视的功能是其硬件引脚。如果你以前从未做过电子学，那么 Pi 是一个很好的起点。或者也许你过去使用过诸如\
    \ Arduino 之类的可编程微控制器；Pi 凭借其比 Arduino 更强的 CPU 和 RAM，为有趣的项目打开了更多的可能性。\n\nRaspberry\
    \ Pi 具有单个 PWM（脉宽调制）输出引脚，以及一系列 GPIO（通用输入/输出）引脚。这些使得诸如蜂鸣器、灯和开关等电子硬件可以通过 Pi 进行控制。对于习惯于只是“使用”计算机，或仅编写仅针对机器本身起作用的软件的人来说，控制灯等实际物理物品可能是一种启示。\n\
    \n本教程假设没有电子或编程先验知识，并将带你走过使用 Raspberry Pi 控制 LED 所需的步骤，从设置到编写简单应用程序。\n\n![](img/59caadfa348382a5c408c25137901e27_73_4.png)\n\
    \n> “我们将带你走过使用 Pi 控制 LED 所需的步骤，从设置到编程”\n\n![](img/59caadfa348382a5c408c25137901e27_74_0.png)\n\
    \n- **面包板**\n  面包板，或原型板，提供了一个易于使用且无私的环境，用于创建和更改你的开发电路。\n- **面包板导线**\n  这是任何新兴电气工程师的必备品，这些公对公和公对母导线使电路构建快速且容易。\n\
    - **GPIO 接头**\n  这为收集输入和向电路提供输出提供了一种机制，从而实现响应式程序设计。\n- **彩色 LED**\n  不同颜色的 LED\
    \ 是物理上看到软件哪部分正在运行的绝佳方式，并帮助你理解程序流程。\n\n### Pi 的引脚\n\n01 在我们深入编写代码之前，让我们看看 Pi 上引脚的布局。如果你的\
    \ Pi 在机箱中，将其取出并放在你面前，使 USB 端口在右侧。在接下来的几个步骤中，我们将看看使用 GPIO 端口时你会遇到的一些用途。\n\n**Pi\
    \ 修订版 1 或 2？**\n\n02 取决于你何时购买 Pi，你可能拥有修订版 1 或修订版 2 型号。GPIO 布局略有不同，尽管它们具有相同的功能。这里我们有修订版\
    \ 1；修订版 2 在 2012 年底变得可用。\n\n**引脚编号**\n\n03 如果你看一下板子的右上角，你会看到一个小的导线标签，P1：这是引脚 1，其上方是引脚\
    \ 2。引脚 1 的右侧是引脚 3，3 的上方是 4。这种模式一直持续到末尾的引脚 26。你会在下一步中看到，某些引脚有重要用途。\n\n**引脚用途**\n\
    \n04 引脚 1 是 3V3，或 3.3 伏。这是我们将在此指南中使用的主要引脚，为我们的 LED 供电。引脚 2 和 4 是 5V。引脚 6 是我们将在这里使用的另一个引脚，即接地。其他接地引脚是\
    \ 9、14、20 和 25。你应该始终确保你的项目正确接地。\n\n**GPIO 引脚**\n\n05 板上的其他引脚是 GPIO（通用输入/输出）。这些用于当你的项目变得更加复杂和具有挑战性时你需要执行的其他任务。请注意，USB\
    \ 电源供应在为大项目供电方面提供的空间有限。\n\n**基本 LED 照明**\n\n06 好的，让我们开始着手做点什么。首先，获取你的面包板、两根线、一个\
    \ 220Ω 电阻和一个 LED。注意 LED 一侧略微弯曲的引脚；这对后续很重要。确保你的 Pi 已断开与主电源的连接。\n\n"
