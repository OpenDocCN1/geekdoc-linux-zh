    comes with this by right-clicking over each element and selecting Delete.


    ![](img/59caadfa348382a5c408c25137901e27_58_3.png)


    # Controlling the pen draw


    +   05 From the Control group drag out a ‘forever’ loop which sits on top of the
    code goes inside. Go to Motion and drag out a ‘go to’. Click on the down arrow
    and select ‘mouse-pointer’. Go to Pen and grab a ‘pen up’. tuck this under the
    ‘go to’.


    # How to control the colour changes


    +   07 From Control grab an ‘if’ and from Sensing put a ‘touching’ condition inside.
    Set trigger to Sprite1. From Pen get ‘set pen color to’, click the colour square
    and use the dropdown to sample the sprite. From Sound get ‘play sound’ and select
    ‘meow’.


    # Setting the pen size


    +   08 Add another ‘if’ and put ‘key pressed a’ as the subject. Select ‘up arrow’
    as the trigger. Get ‘change pen size by’ and enter 1. Use a ‘play sound’ with
    ‘pop’ then add a ‘wait’ for 0.25secs. Repeat this group but with the ‘down arrow’
    and pen size of -1.'
