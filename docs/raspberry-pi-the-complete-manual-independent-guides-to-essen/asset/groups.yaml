    \ 对于调试或更好地理解代码非常有用。\n\n### 功能操作\n\n实际上只有三个主要功能需要关注。`get_pot()` 读取与每个电位器关联的模拟引脚值，并返回分别代表红、绿、蓝的值的元组。这被\
    \ `colour_mixing()` 使用，以向每个关联的 PWM 引脚分配值，从而改变 LED 的颜色。\n\n### 保持运行\n\n`main()`\
    \ 函数是其他功能开始工作的地方。在函数内部，我们要求 Python 永远混合颜色，除非我们按下 Ctrl+C – 触发键盘中断。由于我们想先清理，此操作将触发\
    \ `close_pins()`，关闭连接到 LED 的任何引脚。\n\n"
