    # # Program a quadcopter


    # ## Projects


    # Sensor viewpoint diagram


    How sensors in the quadcopter''s point of view are converted to the Earth (horizontal/vertical)
    viewpoint to provide horizontal motion


    ![](img/59caadfa348382a5c408c25137901e27_138_0.png)


    # Interpreter


    **01** The command interpreter converts a series of commands either from a radio
    control or programmed into the code itself. The commands combine the direction
    and speed compared to the horizon that the user want the quadcopter to follow.
    The code converts these commands into a series of targets for vertical speed,
    horizontal speed and yaw speed – any command from a pair of joysticks can be broken
    down into a set of these targets.


    # Inputs


    **02** The inputs to the quadcopter come from a series of electronic sensors providing
    information about its movement in the air. The main two are an accelerometer which
    measures acceleration force (including gravity) in the three axes of the quadcopter,
    and a gyroscope which measures the angular speed with which the quadcopter is
    pitching (nose/tail up and down), rolling (left/right side up and down), and yawing
    (spinning clockwise and anticlockwise around the central axis of the quadcopter
    itself).


    # Axes


    **03** The accelerometer is relative to the orientation of quadcopter axes, but
    the command targets are relative to the Earth''s axes – the horizon and gravity.
    To convert the sensor output between the quadcopter axes and the Earth axes requires
    the use of a lot of mathematics, specifically trigonometry. You also need knowledge
    of the tilt angles in pitch and roll axes of the quadcopter with respect to the
    Earth. It''s pretty complicated stuff, but the diagrams on these pages should
    help you understand the logic.'
  - "[PAGE 139]\n\n![](img/59caadfa348382a5c408c25137901e27_139_0.png)\n\n*Above Kits\
    \ are available as ready to fly (RTF) if you just want the joy of flight, but\
