  - "[PAGE 63]\n\n# Build a multiple-choice quiz\n\n# Build a multiple-choice quiz\n\
    \nLearn how to use lists to create questions and answers for a fast-paced Scratch-based\
    \ quiz\n\nThe key feature of this Scratch quiz is the ability to process text\
    \ and numbers. However, Designer is more designed for animated graphics and its\
    \ weak areas – arrays, text display and variable inputs – are all required for\
    \ a project like this. It centres around using lists, which are Scratch equivalents\
    \ of arrays. The main drawback though is that while lists can have multiple rows,\
    \ they only have one column. For this project we need columns for the questions,\
    \ three different answers and a code for the right answers to match with the keyboard\
    \ input. With ten questions that would require a 10x5 array variable. With Scratch,\
    \ that in turn means we need five 10x1 lists. Let's get started...\n\n# What you'll\
    \ need...\n\n+   - Scratch\n\n![](img/59caadfa348382a5c408c25137901e27_63_0.png)\n\
    \n**Joining up words**\nThe feature of the code is the Scratch equivalent of adding\
    \ strings together from the list, in a string variable\n\n**Questions and answers**\n\
    All the text questions, answers and the right answer as a number are kept in lists,\
    \ which are simple arrays\n\n> **Did you know...**\n> \n> You can 'bring' upon\
    \ made by other users by using their project, as the base for your own, as long\
    \ as you credit them!\n\n**Tick boxes showing**\nOnce all lists have been populated\
    \ you need to remove them from the screen. Unbox here to do so\n\n**Got it right?**\n\
    These code detects whether the correct answer has been entered just by checking\
    \ the answer list and incrementing the score\n\n![](img/59caadfa348382a5c408c25137901e27_63_1.png)\n\
    \n# Create the lists\n\n+   1. Click on Variables and make a list called Questions.\
    \ As soon as you do the list appears in the stage window ready for you to edit.\
    \ Click on the Plus sign to start adding elements. Type in all the country names\
    \ units you have in a list of 10. Click on the x gadget of the 11th if needed."
  - '[PAGE 64]


    # # Build a multiple-choice quiz




    # ## Fill out the answers


    **02** Repeat this process for three new lists, each with an answer. It pays to
    arrange them side by side while doing this so you can ensure you get a right answer
    in each one. Create a final list that has a number one to three. This identifies
    which number list has the right answer.


    ![](img/59caadfa348382a5c408c25137901e27_64_0.png)


    # ## Set it up


    **03** Now create three new variables called ‘Capital’, ‘YourScore’ and ‘counter’.
    Untick all the variables in the list so they disappear from the stage. Set the
    ‘counter’ to 1 and ‘YourScore’ to 0. Position the sprite and warn the player to
    be ready.


    ![](img/59caadfa348382a5c408c25137901e27_64_1.png)


    # ## Create loop, set question


    **04** Drag a ‘Repeat’ loop from Control and set it to 10 for the number of questions.
    Add function ‘Set Capital’ to 0. Drag in an Operator called ‘Join ()’. Make the
    first half text. Add a variable to the other half and put ‘Counter’ into ‘Questions’.


    # ## Display the answers


    **05** From Looks add a ‘Say ()’ and drop in ‘Capital’. Then create the three
    answers by using the ‘Say’ command and adding a ‘Join ()’. The first entry is
    simply the number of the answer, the second part is the text.


    ![](img/59caadfa348382a5c408c25137901e27_64_2.png)


    # ## Scan for the answers


    **06** There are pauses between the answers being displayed. Add ‘Say’ to prompt
    to press 1, 2 or 3. Drag in a ‘Wait until’ Control. Go into Operators. There are
    only ones with two conditions so use that, then put an extra two conditions into
    the second box to make three.


    ![](img/59caadfa348382a5c408c25137901e27_64_3.png)


    # ## Is the answer right?


    **07** Drag in an ‘If ()’ Control. Drop a ‘)’ and ‘()’ Operator into the space.
    In the first space add ‘Key 1 pressed’ and ‘0 = [?] Operator’. In the second put
    another ‘[?] = [?] Operator’. In the first part add Item ‘[?] of [?]’ from ‘Variable’
    with ‘Counter’, and in the second type ‘1.’


    ![](img/59caadfa348382a5c408c25137901e27_64_4.png)


    # ## Repeat and add score


    **08** Add a ‘Change Your Score by 1’ for a correct answer. Repeat this twice
    for the other answers. Then increase the ‘Counter’ variable by 1 and clear the
    screen. Outside the loop add some pauses to show the quiz is over and then display
    the score in ‘YourScore’. Well done, you’ve finished your first quiz game!'
  - "[PAGE 65]\n\n# Projects\n\n\n\nWhat you'll need...  \nBreadboard  \nLEDs  \n\
