    \ 11 帧大小和宽度完全相同的帧。像素级的精确尺寸和宽度至关重要，这样我们就可以简单地乘以倍数来找到下一帧。\n\n![](img/59caadfa348382a5c408c25137901e27_126_0.png)\n\
    \n## 加载精灵表\n\n07 由于我们通过继承 Sprite 类来创建 Player 类，我们可以通过更改 Pygame 文档中的设置轻松地改变玩家在屏幕上的外观。首先，我们需要使用\
    \ `pygame.image.load()` 加载我们的飞船精灵表。由于我们制作的精灵表具有透明背景，我们可以在线路末尾添加 `convert_alpha()`，以便飞船帧正确渲染（没有任何背景！）。然后，我们使用\
    \ `subsurface` 将初始 Player 图像设置为精灵表上的中间飞船精灵。这被设置为 `self.ani_pos`，其初始值为 5。更改此值将改变绘制到屏幕上的飞船图像：“0”\
    \ 会使其完全向左倾斜，“11” 则完全向右倾斜。\n\n## 动画标志\n\n08 在我们 Game 类的初始化代码中稍靠后的位置，我们还为玩家动画设置了两个标志：`self.ani_left`\
