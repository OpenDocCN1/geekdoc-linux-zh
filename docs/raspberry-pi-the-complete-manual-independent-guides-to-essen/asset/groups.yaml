    \n我们可以使用位于绿色旗帜正上方的三个按钮设置视图模式。\n\n左侧的两个按钮增加或减少舞台区域面板的大小。较小的舞台区域意味着 Studio 的中心区域在相对尺寸上增加。\n\
    \n右侧按钮是演示模式，它在全屏模式下显示舞台（见图 5）。通过左上角的弯曲箭头按钮或按‘esc’键退出演示模式。\n\n![](img/59caadfa348382a5c408c25137901e27_54_1.png)\n\
