    \ we also set two flags for our player animation: `self.ani_left` and `self.ani_right`.\
    \ As you'll see in the `Control` method of our Game class, we use these to flag\
    \ when we want animates to happen with `True` and `False`. It also allows us to\
    \ automatically animate the player sprite back to its natural resting state (otherwise\
    \ the ship will continue to look as it's flying left when it has stopped).\n\n\
    ## The animation method\n\n09 We use flags again in the code for the player. `animate_player()`.\
