    # Top four add-on boards


    Get more out of your Raspberry Pi by using these add-on boards to extend its functionality


    ![](img/59caadfa348382a5c408c25137901e27_31_0.png)


    # GetBoardo £30


    Created by one of the original designers of the Raspberry Pi, Get van Loon, the
    GetBoardo is an add-on for the GPIO ports that allows the Raspberry Pi to interact
    with the real world. It''s used for doing physical computing tasks: driving motors
    to open a garage door or open blinds, curtains, sensing temperatures so you know
    when to turn off heating, access to LED lights and more. While it''s not quite
    at the level of an Arduino, it''s more integrated into the Raspberry Pi and a
    great teaching tool. It does require a little soldering to construct, although
    you can find Getboards pre-assembled for very little extra If you look hard enough
    and don''t fancy putting it together yourself – it''s quite a job!


    There''s a great project to try out with the GetBoardo over on RasPiTV [bit.ly/tebawWA]
    where, using a Wii Remote video-game controller, you can create a calciphony of
    motion and noise that shows off exactly just how much you can do with the Getboard.
    From waving flags to starting fans and ringing bells, you can create your own
    Raspberry Pi-powered Rube Goldberg machine. All you need is a Bluetooth dongle
    to sync a Wii Remote up to your Raspberry Pi, and the Droid Pithon library to
    start messing around with it.


    # Gertduino £20


    The big brother to the GetBoard, the Gertduino is a hybrid Arduino board that
    has better connectivity with the Raspberry Pi. Arduinos are open source microcontrollers
    that allow you to control physical objects – with a lot more control, precision
    and automation than what you can do with the GetBoard. The Gertduino''s biggest
    feature is that it has the same chip as the Arduino Uno, the flagship Arduino
    board that is a lot of folks who make hobby projects use for their electronics.
    It''s highly configurable and all the compatible Arduino extras for the Uno work
    with the Gertduino.


    There''s also a special chip called the Atmega88 built into the Gertduino that
    you won''t find in the Uno. Its main functions include a backup battery and a
    high-precision clock, both of which allow the Gertduino to be unplugged from the
    Pi once you''ve finished programming it. All of this means you can set it up to
    open a chicken coop at a set time each morning without the need for the Raspberry
    Pi to be there as well. Apparently Get van Loon, the board''s inventor, uses his
    Gertduino for his chickens.


    The full manual for the Gertduino has some great example projects to try out with
    the board, and can be found on the element14 website [bit.ly/1afc8RD].


    ![](img/59caadfa348382a5c408c25137901e27_31_1.png)'
  - '[PAGE 32]


    # Top four add-on boards


    # Getting started


    # PiFace £20


    Physical computing is a popular addition to the Raspberry Pi, and PiFace is another
    series of boards that allow you to interact with the outside world on your Pi.
    PiFace comes with a twist, as it allows you to use a CLI to control individual
    ports of the PiFace boards that you can get. These include a simple LED display
    as well as a standard interfacing board; both of these boards have lesson plans
    and other educational tools available to help people learn how to program and
    generally use their Raspberry Pi. It''s fully compatible with Scratch and can
    also be used with Python and C to make more complex applications.


    While the PiFace doesn''t actually allow you to control devices, it can detect
    the state of many types of digital device. You can then use this in some kind
    of Internet of Things, sending out tweets or manipulating network-connected devices.
    Some of the tutorials available from the PiFace site teach you how to create a
    memory game, a countdown timer/advert calendar and how to make a playable organ.


    ![](img/59caadfa348382a5c408c25137901e27_32_0.png)


    # RasWIK £50


    Another Arduino-based board that allows you to perform some physical computing.
    However, this one is for those that don''t want to wrangle so much with wiring
    up the GPIO ports. The magic of the RasWIK is that it comes with a wireless radio
    chip that fits snugly onto the GPIO ports out of the box, and a custom version
    of RaspberryPi that makes the process of using the main Arduino board much quicker.
    It even comes with a collection of components for circuits you can build, from
    remote buzzers and traffic lights to light and temperature sensing projects. Instructions
    on how to get going with these come with the custom Raspbian SD card, and can
    make the entire process easier if you don''t fancy soldering together a board.


    Some of these projects and more are on the Cisco website (bit.ly/1H1m5dD), so
    you can give them a browse before finalising on getting a RasWIK. You can even
    use the projects without a RasWIK if you have the correct components, and it teaches
    you how to use Python in the process. It''s an easy and hassle-free way to get
    into physical computing from your Pi, and the instructions are excellent for kids
    and novices to start with programming and controlling.


    ![](img/59caadfa348382a5c408c25137901e27_32_1.png)


    > “The magic of the RasWIK is that it comes with a wireless radio chip that fits
    snugly onto the GPIO ports out of the box”'
