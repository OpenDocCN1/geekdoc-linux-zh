  - '[PAGE 12]


    # Set up your Raspberry Pi


    # Getting started


    ![](img/59caadfa348382a5c408c25137901e27_12_0.png)


    # Analogu e output


    For setups that don''t use HDMI, the yellow video output is available. To use
    this with sound, you''ll need to use the small black port next to it, with headphones,
    or an auxiliary cable to pipe out the audio


    # USB


    All the performance you want to connect via USB – USB hub, keyboard, mouse, USB
    storage — is plugged in here. Ensure you have external power to the USB Hub if
    you have to use one though


    # SD card


    The SD card goes in underneath the Raspberry Pi board. This will hold your operating
    system that runs the Raspberry Pi. The PI OS needs to be set up from another computer
    before using it though.


    # Digital output


    The HDMI ports a the main video (and audio output of the Raspberry Pi, allowing
    you to do display video on the display at a resolution of up to 1080p. TVs that
    support it will also pick up the audio automatically though.


    # Networking


    The Raspberry P does not come with wireless internet, and while you can add a
    USB adapter it''s usually easier to plug in an ethernet cable. This will plug
    into the back of your router on the other end and give you internet and access
    to your home network.


    # Cabling


    Make sure you have the right selection of cables, such as an ethernet cable for
    networking and internet, and an HDMI or Video cable for video out. The HDMI can
    handle audio, but the video-only will require an additional auxiliary cable'
