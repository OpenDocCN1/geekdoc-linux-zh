    # The Raspberry Pi Store


    # # The Pi Store


    There’s a mixture of free and paid-for games and applications in the Pi Store


    Launched in 2012, the Pi Store aims to provide a hub for both professional and
    amateur developers who want to make their software available for the Pi. The service
    was created by the Raspberry Pi Foundation in co-operation with companies IndleCity
    and Veloxi.


    It’s possible to browse the Store and log in as a customer using a web browser
    or the dedicated Pi application. So far, most of the items on the Pi Store are
    free or low priced, and it’s clear that the developers of the site hope to build
    a thriving community. In particular, they have emphasised that they would like
    to see developers of all age groups. This approach ties in with the whole strategy
    of using the Pi to encourage interest in software development. In addition, the
    Pi Store is possibly the easiest way for beginners to expand their Pi.


    As well as being a platform for browsing, installing and buying applications,
    the Pi Store has integrated features for developers to create a profile and upload
    projects. Customers can also create a profile and participate in the social side
    of things.


    # ## Browsing the Store


    The store can be browsed via the web [http://store.raspberrypi.com] or by using
    the dedicated Pi app. To install the app, type

    $\blacksquare$ sudo apt-get install pistor


    The Store should then be visible as a clickable icon on the backdrop. Upon launching
    you are presented with a two-pane window with tabs along the top and a main area
    below (main image). The first tab is Explore, and this is where you go to find
    new applications. The main window itself makes use of more tabs for the content
    categories. The Apps and Games categories contain the heart of what people expect
    from a device-specific app store. Each of these items, like all store items, features
    customer feedback in the form of a rating out of five and a comments section.
    Many of the products are versions of existing programs that have been repackaged'
