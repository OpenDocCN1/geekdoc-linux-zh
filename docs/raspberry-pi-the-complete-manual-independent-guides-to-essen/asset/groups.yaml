    specifically for the Pi. The Dev Tools are resources and tools to help developers,
    such as ready-made sound and graphics packs.


    The Tutorials are resource packs designed to educate you on various aspects of
    the Pi. The power of this feature is that these packages aren’t limited to flat
    text files and may contain other resources. For example, one tutorial demonstrates
