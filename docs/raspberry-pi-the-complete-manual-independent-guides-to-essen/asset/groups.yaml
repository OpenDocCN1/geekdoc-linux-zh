    ```\n\n## 动画与声音\n\n04 与上个月教程中的游戏相比，你会发现现在是一个动态得多得多的项目。飞船现在会在你改变方向时向转弯方向倾斜，并在静止时自行校正。当你射击外星飞船时，它会以多帧动画爆炸；如果你被击中，你的飞船上会发生较小的爆炸。音乐、激光和爆炸音效也伴随动画的发生而响起。\n\
    \n## 寻找用于动画的图像\n\n05 在编写任何代码之前，明智的做法是先正确设置素材。我们选择使用一些精灵表（sheets）；这些可以在网上找到，或者通过\
    \ GIMP 稍加练习即可创建。它们是由大小和间距均匀的单个帧组成的马赛克，代表每个阶段。我们在 opengameart.org 上找到了我们的素材。\n\n\
