    \ see options to Disconnect or Reconnect, event history and the results of the\
    \ most recent scan. Click on Status to see how it's performing.\n\n## Checking\
    \ the connection\n\nTo check that the Pi has a valid internet connection, double-click\
    \ on LX Terminal. Enter this command:\n\n```\nip addr\n```\n\nYou should see a\
    \ list of numbers, with the bottom line starting ‘inet' and then the IP address\
