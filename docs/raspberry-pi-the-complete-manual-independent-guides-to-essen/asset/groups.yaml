    ![](img/59caadfa348382a5c408c25137901e27_53_0.png)


    The website for Scratch, http://scratch.mit.edu, contains boxs of programs and
    games other users have made.




    ![](img/59caadfa348382a5c408c25137901e27_53_1.png)


    Located at the top of the Studio are three quick-access icons and the main menu
    (Fig 3). The first globe-style icon sets the language for the Studio. The other
    two buttons provide rapid access to the project save and share features. Under
    the ‘File’ menu there’s a typical set of file-management features to open, save
    and import Scratch projects. There is also a Project Notes’ option where we are
    able to enter feature descriptions and comments.


    The ‘Edit’ menu contains a mixed bag of animation, image and audio-editing tools.
    While the ‘Help’ section


    provides access to the browser-hosted help pages. Rather interestingly, the ‘Share’
    menu allows us to share our projects with the whole world. Any Scratch project
    can be posted onto the Scratch community website via the ‘Share This Project Online...’
    option


    ![](img/59caadfa348382a5c408c25137901e27_53_2.png)


    and the ‘Upload To Scratch Server’ form (Fig 3)


    Let’s load the ‘Aquarium’ example project. Select the ‘Open...’ option in the
    ‘File’ menu to display the Open Project dialog. From the list of large buttons
    on the left, click on the one called ‘Examples’. Next, on the right, select the
    ‘Animation’ folder with a double click. Then select the ‘6 Aquarium’ item. The
    open dialog window contains should look similar to Fig 1.


    With the Aquarium project loaded our Scratch Studio should look similar to Fig
    1. We’ll begin our Studio tour with the staging area.


    # Program with Scratch


    Program with Scratch


    > An interactive guide to coding with the Pi''s graphical programming language


    Would you like to delve into the world of animation and game creation? Do you
    want to bring your creative ideas to life without learning a software-development
    language? With Scratch you can do all this, and much more.


    Scratch 1.4 is already installed on the official ‘Wheezy’ Raspbian operating system
    image. If your Raspberry Pi doesn’t already have Scratch installed, don’t worry,
    just hop on over to the official MIT Scratch website to find the download and
    install instructions.


    To begin, all we need to do is open the Scratch Studio. Click on Scratch’s cat
    icon on the desktop, or find Scratch in the LXDE desktop menu.


    The Scratch Studio is a complete development environment. It’s divided up into
    a number of separate panels. Each panel has a specific role in the app-construction
    process and its own specific set of features and tools.


    ![](img/59caadfa348382a5c408c25137901e27_53_3.png)'
