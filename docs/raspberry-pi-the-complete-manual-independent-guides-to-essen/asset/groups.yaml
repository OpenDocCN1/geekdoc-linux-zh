    ```\n\nThen type:\n\n```bash\npython ez_setup.py user\n```\n\nOnce this is complete,\
    \ you'll be able to use the easy_install command to install pyserial...\n\nYou\
    \ might be wondering why we want to attach an Arduino to our Raspberry Pi. While\
    \ there are lots of reasons, probably the most poignant is the extra six PWM-capable\
    \ pins and another six analogue pins that a standard Arduino Uno offers. While\
    \ the Raspberry Pi has an excellent array of pins and capabilities, it can't do\
    \ analogue and we can't do real-time processing out of the box. With an Arduino,\
    \ additions like servos, potentiometers and a whole array of analog sensors are\
    \ trivially easy to trigger and control. With this guide you can control it from\
    \ your Raspberry Pi and you don't even have to program in C++!\n\nfolder in the\
    \ terminal (cd ~) and do the following in the terminal, one after the other:\n\
    \n```bash\neasy_install nampy\nsudo apt-get install git\ngit clone https://github.com/nampy/nampy.git\n\
    ```\n\n### Configure your Arduino Uno\n\n#### 05\n\nWhy have we cloned the original\
