    \n## CSI 接口\n\n新近推出的摄像头模块插在这里，赋予树莓派拍摄照片和录制视频的能力。\n\n## 以太网端口\n\n同样，与 Model A 不同，Model\
    \ B 配备了以太网端口，因此您无需 Wi-Fi 适配器即可连接互联网。\n\n## 双 USB 端口\n\nModel B 的主要优势在于它有两个 USB\
    \ 端口（Model A 只有一个）。这减少了对 USB 集线器的需求。\n\n## 快速入门\n\n### 入门套件\n\n![](img/59caadfa348382a5c408c25137901e27_9_0.png)\n\
    \n树莓派的内涵远不止表面所见。以下是一些帮助您入门的重要外设。为了从树莓派中获得最佳体验，除了树莓派主板本身，您还需要获取一些额外的配件。例如，您需要键盘和鼠标来输入命令并进行导航。虽然不进行初始设置的情况下可能用某些项目不需要键盘和鼠标，但在初始设置阶段它们是必需的。SD\
    \ 卡也是重要的购置物品——它是操作系统的存储介质。也许您需要某种 Wi-Fi 适配器，或者只是一根网线。此外还有树莓派的基础电子部分，开展入门级电子和控制实验需要哪些组件呢？显然，树莓派的可能性比许多人想象的要丰富得多。\n\
    \n当我们提到外设时，当然指的是可以连接到树莓派并加以利用的其他硬件。它们可能只是一条得体的 HDMI 线，也可能是能增强您项目功能的最新定制设备。树莓派拥有广阔的可能性领域，从机械臂到遥控直升机……唯一的限制是可用硬件和您的想象力！\n\
    \n> **您知道吗……**\n>\n> 大多数在线零售商都提供包含所有可能需要配件的套装（甚至预装了 SD 卡）。\n\n### 键盘和鼠标\n\n![](img/59caadfa348382a5c408c25137901e27_9_1.png)\n\
    \n让我们从最基础的组件开始：键盘和鼠标。一般来说，几乎任何 USB 键盘和三键滚轮鼠标都能与树莓派兼容。虽然某些项目甚至不需要键盘和鼠标，但在初始设置阶段它们是必不可少的。\n\
    \n### SD 卡\n\n![](img/59caadfa348382a5c408c25137901e27_9_2.png)\n\nSD 卡是存储树莓派操作系统的存储设备，无论您决定使用哪种系统。您可以购买预装了操作系统的\
    \ SD 卡，也可以从多个渠道购买空白卡。SD 卡有多种尺寸和速度，但对于基本用途，2GB 或更大的容量即可满足需求。\n\n### 电源线\n\n树莓派使用标准的\
    \ micro USB 连接器作为电源输入，电压应为 5V。在大多数情况下，micro USB 转 USB 线缆就足够了，其一端可以插入笔记本电脑或 PC\
    \ 的 USB 端口。安卓手机充电器也应能完美工作（5.25V 1500mA）。\n\n![](img/59caadfa348382a5c408c25137901e27_10_1.png)\n\
    \n### 外壳\n\n虽然外壳并非完全必要，但将树莓派放入外壳中显然可以保护它，并防止其精密的 GPIO 引脚弯曲。除了防止意外损坏外，外壳还可以使树莓派看起来更具吸引力或更醒目，例如用作客厅媒体中心。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_10_2.png)\n\n### 视频输出\n\n您会发现两个视频输出端口：一个\
    \ HDMI 端口和一个 RCA 插孔。对于大多数用户而言，HDMI 很可能成为主要的视频输出连接器。但如果您的电视或显示器没有 HDMI 接口，则可以使用\
    \ RCA 视频输出端口连接电视、显示器或 SCART 线缆。\n\n![](img/59caadfa348382a5c408c25137901e27_10_3.png)\n\
    \n### 带电源的 USB 集线器\n\n在购买树莓派初期，考虑额外购买 USB 端口是值得的。连接好键盘和鼠标后，您就会明白原因了！使用带电源的 USB\
    \ 集线器非常重要，它可以防止树莓派自身供电不足，并允许您连接外部硬盘等设备。\n\n![](img/59caadfa348382a5c408c25137901e27_10_4.png)\n\
    \n### 树莓派摄像头板\n\n这是一款定制的附加板，通过柔性电缆连接到树莓派主板上的插座之一。它极其小巧，但功能强大，原生分辨率为五百万像素，并支持 1080p\
    \ 视频。它本质上是树莓派的智能手机摄像头！\n\n![](img/59caadfa348382a5c408c25137901e27_10_5.png)\n\
    \n### USB Wi-Fi 适配器\n\n使用 USB Wi-Fi 适配器可以让树莓派的摆放位置更加自由。您不再需要从路由器拉一根以太网线，它还可以用于更高级的项目，而在这些项目中，有线互联网连接并非可行选项。购买时请确保该适配器支持\
    \ Linux 系统。\n\n## 设置您的树莓派\n\n通过我们易于遵循的指南，了解全新树莓派中各个部分的功能和位置。\n\n虽然设置起来看起来可能令人望而却步，但实际上配置树莓派用于日常使用非常简单。就像电视或普通计算机一样，只有特定的线缆才能插入特定的插槽，主要任务实际上只是确保在任一时刻您已插入了所需的设备。树莓派本身并没有对主板上的大部分部件进行标注。不过，大多数优质外壳都会为您完成这项工作——如果您决定购买一个的话。\n\
    \n- **电源适配器**\n  树莓派使用 micro USB 线缆供电，这与许多现代安卓手机类似。它可以通过笔记本电脑或电脑供电，但为了充分发挥其性能，合适的电源适配器（如这种）是理想的。\n\
    \n- **显示器**\n  树莓派能够输出 1920 x 1080 分辨率——即所谓的 1080p。某些现代显示器允许直接插入 HDMI 线，就像电视一样。但是，如果您的电视没有\
    \ HDMI 接口，您可能需要一个适配器。\n\n- **USB 集线器**\n  树莓派上的 USB 端口数量有限（如果是 Model 3A 则只有一个）。为了解决这个问题，您需要一个\
    \ USB 集线器。重要的是要选择一个带电源的集线器，因为树莓派自身的供电能力不足。\n\n- **外壳和配件**\n  正确使用树莓派并不需要外壳，但得体的外壳可以有效防止灰尘，并方便在运行期间移动设备。不过，您需要一张至少\
    \ 4GB 的 SD 卡。\n\n- **键盘和鼠标**\n  与任何计算机一样，如果您使用树莓派进行标准的 PC 风格操作，就需要键盘和鼠标。与键盘类似，大多数标准鼠标都适用，但某些特殊鼠标可能需要额外软件。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_11_0.png)\n![](img/59caadfa348382a5c408c25137901e27_11_1.png)\n\
    ![](img/59caadfa348382a5c408c25137901e27_11_2.png)\n![](img/59caadfa348382a5c408c25137901e27_11_3.png)\n\
    \n"
