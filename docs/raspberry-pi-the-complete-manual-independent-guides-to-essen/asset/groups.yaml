    \"*1 +\n                    str(int(distanceFromBlock)) + \" blocks away\")\n\n\
    \        lastDistanceFromBlock = distanceFromBlock\n\n    sleep(2)\n\n    timeTaken\
    \ = time() - timeStarted\n    mc.postToChat(\"Well done \" + str(int(timeTaken))\
    \ +\n        \"seconds to find the diamond!\")\n\nif __name__ == \"__main__\"\
    :\n    main()\n```\n\n## 编写你自己的 Twitter 机器人\n\n## 你需要什么...\n\n-   互联网连接\n-   最新版本的\
    \ Raspbian\n-   www.raspberrypi.org/downloads\n\n![](img/59caadfa348382a5c408c25137901e27_87_0.png)\n\
    \n创建你自己的 Twitter 机器人，它可以转发来自他人的智慧片段\n\nTwitter 是与世界分享信息的有用方式，也是我们快速、便捷地表达观点的首选方法。数百万人通过电脑、移动设备甚至电视使用该微博平台。\n\
    \n不过，你不必一直点击那个转发按钮。只需少许 Python 代码，就可以让树莓代劳。以下是创建你自己的 Twitter 机器人的方法...\n\n## 安装所需的软件\n\
    \n**01** 使用用户名 *Pi* 和密码 *raspberry* 登录 Raspbian 系统。使用命令 `sudo apt-get update`\
    \ 获取最新的软件包列表。然后使用 `sudo apt-get install python-pip` 安装 Python 包安装器。\n\n完成后，运行\
    \ `sudo pip install tweepy` 安装我们将使用的 Twitter 库。\n\n## 在 Twitter 上注册你的“应用程序”\n\n\
    **02** 我们需要使用 OAuth 进行 Twitter 身份验证。在此之前，你需要前往 https://dev.twitter.com/apps 并使用你希望树莓派发推的账户登录。点击“Create\
    \ a new application”按钮。我们将应用程序命名为“LUD Pi Bot”，并将网站设置为 www.linuxuser.co.uk。\n\n\
    ## 完整代码列表\n\n```python\n#!/usr/bin/env python2\n\n# A Twitter Bot for the Raspberry\
    \ Pi that retweets any content from\nimport sys\nimport time\nfrom datetime import\
    \ datetime\nfrom tweepy import Tweepy\n\nclass bot:\n    def __init__(self, c_key,\
    \ c_secret, a_token, a_secret):\n        # Create a Tweepy API instance\n    \
    \    self.api = Tweepy(c_key, c_secret, a_token, a_secret)\n\n        # Make sure\
    \ we are authenticated correctly\n        try:\n            self.api.verify_credentials()\n\
    \        except:\n            sys.exit(\"Authentication Failed\")\n\n        last_ran\
    \ = datetime.now()\n\n    @staticmethod\n    def timestr_to_datetime(timestr):\n\
    \        # Convert a string like Sun 09 09:29:55 +0000\n        # 2013 to a datetime\
    \ object. Get rid of the timezone\n        # and make the year the current one\n\
    \        timestr = '{0} {1}'.format(timestr[:19], datetime.now().year)\n\n   \
    \     # We now have Sat Nov 09 09:29:55 2013\n        return datetime.strptime(timestr,\
    \ '%a %b %d %H:%M:%S %Y')\n\n    def retweet_task(self, screen_name):\n      \
    \  # We get tweets from a user's screen name, but we've not seen it from a user\n\
    \        print 'Checking for new tweets from {0}'.format(screen_name)\n\n    \
    \    # Get a list of the users latest tweets\n        timeline = self.api.get_user_timeline(screen_name\
    \ = screen_name)\n\n        # Loop through each tweet and check if it was\n  \
    \      # posted since we were last called\n        for tweet in timeline:\n  \
    \          tweet_created_at = bot.timestr_to_datetime(tweet.created_at)\n    \
    \        if tweet_created_at > self.last_ran:\n                print \"Retweeting\
    \ {0}\".format(tweet.id)\n                self.api.retweet(id = tweet.id)\n\n\
    if __name__ == \"__main__\":\n    # The consumer keys can be found on your application's\n\
    \    # Details page located at https://dev.twitter.com/apps/<Your_Oauth_Settings>\n\
    \    c_key =\n    c_secret =\n\n    # The access tokens can be found on your application's\n\
    \    # Details page located at https://dev.twitter.com/apps (located under 'Your\
    \ access token')\n    a_token =\n    a_token_secret =\n\n    # Create an instance\
    \ of the bot class\n    twitter = bot(c_key, c_secret, a_token, a_token_secret)\n\
    \n    # Tweet anything new every 5 minutes\n    while True:\n        # Update\
    \ the time after we've done a retweet task so we're\n        # only retweeting\
    \ new stuff\n        twitter.retweet_task('lunUserMag')\n        twitter.last_ran\
    \ = datetime.now()\n        time.sleep(5 * 60)\n```\n\n## 创建访问令牌\n\n**03** 转到设置标签页，将访问类型从“Read\
    \ only”更改为“Read and Write”。然后点击“Update this Twitter application's settings”按钮。接下来我们创建访问令牌。点击“Create\
    \ my access token”按钮！如果你刷新详细信息页面，你应该会看到一个消费者密钥（consumer key）、消费者密钥（consumer secret）和访问令牌，以及访问令牌密钥。这些就是我们在\
    \ Twitter 上进行身份验证所需的一切。\n\n## 在 Twitter 上进行身份验证\n\n**04** 我们将创建一个机器人类，并在构造函数中与\
    \ Twitter 进行身份验证。我们将前几步获取的令牌作为参数，并使用它们创建 Tweepy API 的实例。我们还有一个变量 last_ran，它被设置为当前时间。这用于稍后检查是否有新推文。\n\
    \n## 转发用户的内容\n\n**05** 我们需要做的第一件事是获取该用户最新推文的列表。然后我们遍历每条推文，获取其创建时间的字符串，并将其转换为 datetime\
    \ 对象。接着我们检查推文的时间是否比函数上次调用时的时间更新——如果是，则转发该推文。\n\n## 主部分\n\n**06** 最后一部分很简单。我们使用令牌创建机器人类的实例，然后进入无限循环。在此循环中，我们检查我们监控的用户是否有新的转发（我们可以针对不同的用户运行转发任务），然后更新所有操作的上次运行时间，并休眠五分钟。\n\
    \n"
