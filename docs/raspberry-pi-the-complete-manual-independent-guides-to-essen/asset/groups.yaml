    \ of the bot class\n    twitter = bot(c_key, c_secret, a_token, a_token_secret)\n\
    \n    # Tweet anything new every 5 minutes\n    while True:\n        # Update\
    \ the time after we've done a retweet task so we're\n        # only retweeting\
    \ new stuff\n        twitter.retweet_task('lunUserMag')\n        twitter.last_ran\
    \ = datetime.now()\n        time.sleep(5 * 60)\n```\n\n## Creating an access token\n\
    \n**03** Go to the Settings tab and change the Access type from 'Read only' to\
