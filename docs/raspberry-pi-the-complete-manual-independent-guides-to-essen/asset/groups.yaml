  md: "\n## Access your files with SSH\n\nUse the terminal of your home computer to\
    \ gain quick and secure access to your Raspberry Pi\n\n- **What you’ll need...**\n\
    \  - Any Raspberry Pi distro\n  - www.raspberrypi.com/downloads\n  - Internet\
    \ connection\n  - Second computer\n\nWhile remotely logging into the full X environment\
    \ is – as we demonstrated on the previous pages – very useful, it has its disadvantages.\
    \ Firstly, it’s not particularly quick or convenient to do. The user experience\
    \ can be slow and cumbersome too, but worst of all, it’s not as secure as we’d\
    \ really like.\n\n> **Did you know...**\n> \n> SSH is the most secure method of\
    \ accessing any machine remotely. It’s also quicker than VNC.\n\nIf you want to\
    \ take a more convenient and secure approach to accessing your Raspberry Pi from\
    \ another computer, you’ll find that all well-versed Pi enthusiasts will use SSH.\
    \ SSH stands for Secure Shell and is a cryptographic network protocol which is\
    \ designed to ensure secure data communication via the command line.\n\nWhile\
    \ beginners might argue it’s easier to remotely access their Raspberry Pi using\
    \ the full graphical interface, as soon as you’ve learnt a handful of basic command-line\
    \ techniques you’ll quickly find ‘dipping in’ to your Raspberry Pi via SSH is\
    \ by far the most convenient way to talk to it remotely.\n\nYou’ll be pleased\
    \ to hear that SSH is already well configured out of the box – there’s very little\
    \ you need to do to make it work, especially if your remote computer runs Linux\
    \ or OS X, as we’re going to demonstrate here.\n\n![](img/59caadfa348382a5c408c25137901e27_43_0.png)\n\
    \n### SSH is easy with Linux and OS X\n\nAssuming your Raspberry Pi is on and\
    \ connected to a network either by Ethernet or a Wi-Fi dongle, the only piece\
    \ of information you need is the IP address of your Pi. To discover this, all\
    \ you have to do is open a terminal window on your Raspberry Pi and type the command\
    \ `ifconfig` (Fig 1).\n\nIf you’re connected by Ethernet cable you’ll see ‘eth0’,\
    \ then several lines of results. The IP address will be the number on the second\
    \ line next to words ‘inet addr’. If you’re connected by Wi-Fi, the result will\
    \ be on the second line of ‘what?’. The IP address itself is a group of four numbers\
    \ separated by full stops. If you’re on your home network, it will likely be similar\
    \ to 192.168.0.15. We’ll use this number for our guide, but replace it with the\
    \ IP address you’ve seen via `ifconfig`.\n\nWith this information in hand, all\
    \ you need to do is open a terminal window on your remote Linux PC and type:\n\
    \n```bash\nssh pi@192.168.0.15\n```\n\nThis assumes your Raspberry Pi’s username\
    \ is still the default (which is pi) and you’re replacing the IP address with\
    \ the one you made note of just now. If you’ve added user accounts or changed\
    \ the default, you’ll need to replace the username before the ‘@’ with whatever\
    \ you’ve changed it to. When you press Enter, you’ll be prompted to enter the\
    \ password for your Raspberry Pi – again, if it’s the default you can type `raspberry`,\
    \ otherwise type in your Pi’s password and press `Return`.\n\nYou’ll now see that\
    \ the username details on the command line have changed to reflect those of your\
    \ Raspberry Pi – you’re now connected remotely. Try looking through your files\
    \ or using nano to open a file to edit it!\n\n### Never type another IP address\n\
    \nOf course, if you take your Raspberry Pi to another network, your Pi’s IP address\
    \ will be different. If you just want to connect to it remotely, it becomes incredibly\
    \ tiresome to set up your Pi with a keyboard, mouse and monitor just to get the\
    \ IP address. Wouldn’t it be easier if you could just type the Raspberry Pi’s\
    \ name into the terminal to connect? It sounds too good to be true, but it’s actually\
    \ very easy to do.\n\nAll you need is a small piece of software which effectively\
    \ lets you discover hosts and services on your local network by name instead of\
    \ IP address (Fig 2). To set it up on your Pi all you need to do is open a terminal\
    \ and type:\n\n```bash\nsudo apt-get install avahi-daemon\n```\n\nOnce the installation\
    \ is complete, all you have to do to access your Raspberry Pi via SSH is type\
    \ the following into the terminal:\n\n```bash\nssh pi@raspberrypi.local\n```\n\
    \nWhat’s more, you can use the name of your Raspberry Pi when you access it via\
    \ any other form of networking, be it Samba, remote login with VNC or anything\
    \ else!\n\n![](img/59caadfa348382a5c408c25137901e27_44_0.png)\n\n### SSH with\
    \ Windows\n\nAs is the way with most things in the Windows world, accessing your\
    \ Raspberry Pi with Microsoft’s operating system isn’t quite as straightforward\
    \ as you’d think. Fortunately, there is a useful tool to help: Putty allows you\
    \ to make your Secure Shell connection and it’s easy to set up and use. You can\
    \ download Putty from: [www.chiark.greenend.org.uk/~sgtatham/putty/](https://www.chiark.greenend.org.uk/~sgtatham/putty/)\n\
    \n![](img/59caadfa348382a5c408c25137901e27_44_1.png)\n\n## Share your files with\
    \ Samba\n\nConfigure your Pi to share the contents of the home folder over your\
    \ home network\n\n- **What you'll need...**\n  - Raspbian\n  - www.raspberrypi.org/downloads\n\
    \  - Internet connection\n\n> **Did you know...**\n> \n> You can network with\
    \ other Linux, Windows and Mac OS X computers with Samba – it's totally cross-platform.\n\
    \nRegardless of whether you plan to set your Raspberry Pi up as a media centre,\
    \ gaming machine or full-on development platform, the ability to share and access\
    \ the contents of your Pi from other machines is very useful.\n\nWhile the Raspberry\
    \ Pi is very well configured, by default it doesn't include the ability to share\
    \ the contents of your home folder with your local network. As you'll see from\
    \ this guide, though, it's not too difficult to accomplish thanks to Samba and\
    \ can help you access your scripts, media or documents from any other machine.\n\
    \n![](img/59caadfa348382a5c408c25137901e27_45_0.png)\n\n### Update & install Samba\n\
    \nOpen a terminal window and type the following into the terminal to update the\
    \ Raspbian repository and then install Samba:\n\n```bash\nsudo apt-get update\
    \ && sudo apt-get install samba samba-common-bin\n```\n\nThe operation itself\
    \ shouldn't take too long. Just make sure that you're connected to the internet\
    \ before you start.\n\n### Load smb.conf\n\nWith the core packages installed,\
    \ you now need to tell Samba how you want it to work. You do this by putting your\
    \ preferred settings in Samba's configuration file. This file is called `smb.conf`\
    \ and it's located in the `/etc/samba` folder. While it's easy to locate it using\
    \ the file managers, it's easier to open and edit it from the command line. Type\
    \ the following into the terminal window to open it with nano:\n\n```bash\nsudo\
    \ nano /etc/samba/smb.conf\n```\n\n### Initial setup\n\nTake a look through the\
    \ file. There's lots of information here and it seems a bit daunting, but there\
    \ are only a handful of changes and additions to make. Firstly, you need to make\
    \ sure you have assigned the correct workgroup. Unless your network has been configured\
    \ differently, it will likely be called `WORKGROUP`. To find the workgroup setting,\
    \ press `Ctrl+W` and type `workgroup`, then press Enter – this will take you to\
    \ the first occurrence of the word 'workgroup'. Use the arrow keys to move between\
    \ lines – the mouse doesn't work in nano.\n\n![](img/59caadfa348382a5c408c25137901e27_45_1.png)\n\
    \n### Windows support\n\nIf you have Windows computers in your network, you'll\
    \ need to ensure WINS support is allowed. Assuming you're working from the default\
    \ `smb.conf` configuration file, you'll find the flag for WINS support a few lines\
    \ below the workgroup line. Edit it so it looks like this:\n\n```bash\nwins support\
    \ = yes\n```\n\n![](img/59caadfa348382a5c408c25137901e27_46_0.png)\n\n### Add\
    \ your share\n\n**05** Next you need to find the section of the file called Share\
    \ Definitions. Again, you can use the key combination `Ctrl+W` to open the search\
    \ function, then type ‘share definitions’ and press Enter to be taken directly\
    \ to it – it’s located right towards the end of the document.\n\nGo to the very\
    \ end of the document and add the following.\n\n```bash\n[pi]\npath=/home/pi\n\
    only guest = no\nbrowseable = yes\nwritable = yes\ncreate mask = 0777\ndirectory\
    \ mask = 0777\npublic = no\n```\n\n### Set up passwords\n\n**06** You have finished\
    \ editing the `smb.conf` file now. So, to save and exit, press `Ctrl-X`, then\
    \ press `Y` to save, and Enter to exit.\n\nWith this configuration, a layer of\
    \ password security is in place, so we now need to set up a Samba password to\
    \ use with it. In your terminal window, type the following command:\n\n```bash\n\
    smbpasswd -a pi\n```\n\nYou’ll be prompted to enter and confirm a new password.\
    \ This is now your username and password for accessing your files.\n\n### Restart\
    \ Samba\n\n**07** The final step is simply to restart Samba for your new settings\
    \ to take effect.\n\nAt the terminal, type the following command to do so:\n\n\
    ```bash\nsudo /etc/init.d/samba restart\n```\n\nThe next time you look at your\
    \ home network from another machine, you’ll see your Raspberry Pi’s home folder\
    \ listed as a share.\n"
  mdcn: "\n## 通过 SSH 访问您的文件\n\n使用您家用电脑的终端快速安全地访问您的树莓派\n\n- **您需要...**\n  - 任意树莓派发行版\n\
    \  - www.raspberrypi.com/downloads\n  - 互联网连接\n  - 第二台电脑\n\n虽然远程登录完整的 X 环境（如我们在前几页中展示的）非常有用，但它也有其缺点。首先，这样做并不特别快捷或方便。用户体验可能会显得缓慢且笨重，但最糟糕的是，它并没有我们真正希望的那样安全。\n\
    \n> **你知道吗...**\n> \n> SSH 是远程访问任何机器最安全的方法。它也比 VNC 更快。\n\n如果你想以更方便且更安全的方式从另一台电脑访问你的树莓派，你会发现所有经验丰富的树莓派爱好者都会使用\
    \ SSH。SSH 代表 Secure Shell（安全外壳），是一种加密网络协议，旨在通过命令行确保数据安全通信。\n\n尽管初学者可能会争辩说使用完整的图形界面远程访问树莓派更容易，但一旦你学会了一些基本的命令行技巧，你就会很快发现通过\
    \ SSH“潜入”树莓派是远程与之交互的最方便方式。\n\n你会很高兴地听到，SSH 已经经过良好的出厂配置——你几乎不需要做任何事情就能让它工作，尤其是如果你的远程电脑运行的是\
    \ Linux 或 OS X，正如我们将要展示的那样。\n\n![](img/59caadfa348382a5c408c25137901e27_43_0.png)\n\
    \n### 在 Linux 和 OS X 上使用 SSH 很简单\n\n假设你的树莓派已开机并通过以太网或 Wi-Fi 无线网卡连接到网络，你唯一需要的信息就是你的树莓派的\
    \ IP 地址。要查找这个地址，你只需在树莓派上打开一个终端窗口并输入命令 `ifconfig`（图 1）。\n\n如果你是通过以太网连接的，你会看到‘eth0’，然后是几行结果。IP\
    \ 地址将是位于‘inet addr’一词旁边的第二行上的数字。如果你是通过 Wi-Fi 连接的，结果将位于‘what?’下的第二行。IP 地址本身是由句点分隔的四组数字。如果你在家用网络上，它可能类似于\
    \ 192.168.0.15。我们在指南中将使用这个数字，但你应将其替换为你通过 `ifconfig` 看到的 IP 地址。\n\n有了这些信息，你只需在远程\
    \ Linux PC 上打开一个终端窗口并输入：\n\n```bash\nssh pi@192.168.0.15\n```\n\n这假设你的树莓派用户名仍然是默认的（即\
    \ pi），并且你用刚才记录的 IP 地址替换了示例中的 IP 地址。如果你已添加了用户账户或更改了默认值，你需要将‘@’前面的用户名替换为你更改后的用户名。当你按下回车键时，系统会提示你输入树莓派的密码——同样，如果是默认密码，你可以输入\
    \ `raspberry`，否则请输入你树莓派的密码并按下 `Return`。\n\n现在你会看到命令行上的用户名详情已更改为反映你的树莓派的信息——你现在已远程连接。试着浏览你的文件或使用\
    \ nano 打开文件进行编辑！\n\n### 再也不用输入 IP 地址了\n\n当然，如果你把树莓派带到另一个网络，你的树莓派 IP 地址将会不同。如果你只是想远程连接它，仅仅为了获取\
    \ IP 地址而设置树莓派并连接键盘、鼠标和显示器就变得极其令人厌烦。如果你只需在终端中输入树莓派的名称就能连接，岂不更容易？这听起来好得令人难以置信，但实际操作起来非常简单。\n\
    \n你只需要一个小型软件，它可以让你通过名称而不是 IP 地址来发现本地网络上的主机和服务（图 2）。要在树莓派上安装它，你只需打开终端并输入：\n\n```bash\n\
    sudo apt-get install avahi-daemon\n```\n\n安装完成后，你只需在终端中输入以下内容即可通过 SSH 访问你的树莓派：\n\
    \n```bash\nssh pi@raspberrypi.local\n```\n\n更重要的是，当你通过其他任何形式进行网络访问时，比如 Samba、通过\
    \ VNC 远程登录或任何其他用途，你都可以使用树莓派的名称！\n\n![](img/59caadfa348382a5c408c25137901e27_44_0.png)\n\
    \n### 在 Windows 上使用 SSH\n\n在 Windows 世界中，大多数事情都是如此，使用微软的操作系统访问你的树莓派并不像你想的那么直接。幸运的是，有一个有用的工具可以帮助：Putty\
    \ 允许你建立安全外壳连接，而且易于设置和使用。你可以从以下地址下载 Putty：[www.chiark.greenend.org.uk/~sgtatham/putty/](https://www.chiark.greenend.org.uk/~sgtatham/putty/)\n\
    \n![](img/59caadfa348382a5c408c25137901e27_44_1.png)\n\n## 使用 Samba 共享你的文件\n\n\
    配置你的树莓派，以便通过家用网络共享主文件夹的内容\n\n- **您需要...**\n  - Raspbian\n  - www.raspberrypi.org/downloads\n\
    \  - 互联网连接\n\n> **你知道吗...**\n> \n> 你可以使用 Samba 与其他 Linux、Windows 和 Mac OS X 电脑进行网络通信——它完全支持跨平台。\n\
    \n无论你计划将树莓派设置为媒体中心、游戏机还是全功能的开发平台，能够从其他机器共享和访问你树莓派的内容都非常有用。\n\n虽然树莓派配置得很好，但默认情况下它不包括与本地网络共享主文件夹内容的功能。不过，从本指南中你会看到，借助\
    \ Samba，实现这一点并不难，它可以帮助你从任何其他机器访问你的脚本、媒体或文档。\n\n![](img/59caadfa348382a5c408c25137901e27_45_0.png)\n\
    \n### 更新并安装 Samba\n\n打开一个终端窗口并在终端中输入以下内容，以更新 Raspbian 存储库并安装 Samba：\n\n```bash\n\
    sudo apt-get update && sudo apt-get install samba samba-common-bin\n```\n\n操作本身不应该花太长时间。只需确保在开始之前已连接到互联网。\n\
    \n### 加载 smb.conf\n\n安装核心软件包后，你需要告诉 Samba 你希望它如何工作。你通过将首选设置放入 Samba 的配置文件中来实现这一点。此文件名为\
    \ `smb.conf`，位于 `/etc/samba` 文件夹中。虽然使用文件管理器很容易找到它，但从命令行打开和编辑它更简单。在终端窗口中输入以下内容以使用\
    \ nano 打开它：\n\n```bash\nsudo nano /etc/samba/smb.conf\n```\n\n### 初始设置\n\n浏览一下该文件。这里有很多信息，看起来有点令人望而生畏，但只需进行少数几处修改和添加。首先，你需要确保分配了正确的工作组。除非你的网络配置不同，否则它可能名为\
    \ `WORKGROUP`。要找到工作组设置，请按 `Ctrl+W` 并输入 `workgroup`，然后按回车——这将带你到单词 'workgroup'\
    \ 的第一次出现位置。使用方向键在不同行之间移动——在 nano 中鼠标不起作用。\n\n![](img/59caadfa348382a5c408c25137901e27_45_1.png)\n\
    \n### Windows 支持\n\n如果你的网络中有 Windows 电脑，你需要确保允许 WINS 支持。假设你正在使用默认的 `smb.conf`\
    \ 配置文件，你会发现 WINS 支持的标志在工作组行下方几行处。编辑它使其看起来像这样：\n\n```bash\nwins support = yes\n\
    ```\n\n![](img/59caadfa348382a5c408c25137901e27_46_0.png)\n\n### 添加共享\n\n**05**\
    \ 接下来，你需要找到文件中名为 Share Definitions 的部分。同样，你可以使用组合键 `Ctrl+W` 打开搜索功能，然后输入 ‘share\
    \ definitions’ 并按回车，直接跳转到该部分——它位于文档的最末尾附近。\n\n转到文档的最末尾并添加以下内容。\n\n```bash\n[pi]\n\
    path=/home/pi\nonly guest = no\nbrowseable = yes\nwritable = yes\ncreate mask\
    \ = 0777\ndirectory mask = 0777\npublic = no\n```\n\n### 设置密码\n\n**06** 你现在已经完成了对\
    \ `smb.conf` 文件的编辑。因此，按 `Ctrl-X` 保存并退出，然后按 `Y` 保存，再按回车退出。\n\n通过此配置，一层密码安全机制已到位，因此我们现在需要设置一个\
    \ Samba 密码来配合使用。在终端窗口中，输入以下命令：\n\n```bash\nsmbpasswd -a pi\n```\n\n系统将提示你输入并确认一个新密码。现在这就是你访问文件所需的用户名和密码。\n\
    \n### 重启 Samba\n\n**07** 最后一步只是重启 Samba，以使你的新设置生效。\n\n在终端中，输入以下命令：\n\n```bash\n\
    sudo /etc/init.d/samba restart\n```\n\n下次你从另一台机器查看家用网络时，你会看到树莓派的主文件夹作为一个共享项列出。\n\
    \n"
