    \ sudo 前缀。\n\n```\nsu\nsudo\n```\n随后输入密码，或者在每个命令前添加 `sudo`\n\n### 下载 GPIO 库\n\n\
    14 有一个方便的 GPIO 库，使操作 GPIO 引脚变得轻而易举。在终端窗口中，使用 wget 下载 tar 包文件，然后使用 `tar` 提取它。这将为新目录中的所有文件生成副本：\n\
    \n```\nwget https://pypi.python.org/packages/source/R/RPI.GPIO/RPI.GPIO-0.5.2a.tar.gz\n\
    tar zxf RPI.GPIO-0.5.2a\ncd RPI.GPIO-0.5.2a\n```\n\n### 安装库\n\n15 现在我们需要安装该库。这只需要使用\
