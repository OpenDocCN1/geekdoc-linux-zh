    \ compensates for the flaws in the other, resulting in a noise-free, long-term\
    \ accurate reading. There are many versions of these mathematical noise/drift\
    \ filters. The best common one is by Kalman; the one we've chosen is slightly\
    \ less accurate, but easier to understand and therefore to code: the complementary\
    \ filter.\n\nNow with an accurate angle in hand, it's possible to convert accelerometer\
    \ sensor data to inputs relative to the Earth's axes and work out how fast the\
    \ quadcopter is moving up, down, left, right and forwards and backwards compared\
    \ to the targets that have been set.\n\n![](img/59caadfa348382a5c408c25137901e27_139_1.png)\n\
    \n# PIDs\n\n**06** So we now have a target for what we want the quadcopter to\
    \ do, and an input for what it’s doing, and some motors to close the gap between\
    \ the two; all we need now is a way to join these together. A direct mathematical\
    \ algorithm is high on impossible – accurate weight of the quadcopter, power per\
    \ rotation of each blade, weight imbalance etc. would need to be incorporated\
    \ into the equation. And yet none of these factors is stable during flight (and\
    \ cached), blades get damaged, batteries move in the frame, grass/mud/moisture\
    \ changes the weight of the copter, humidity and altitude would need to be accounted\
    \ for. Hopefully it’s clear this approach simply won’t fly.\n\nInstead, an estimation\
    \ method is used with feedback from the sensors to fine-tune that estimate. Because\
    \ the estimation/feedback code loop spins at over 100 times a second, this approach\
    \ can react to ‘errors’ very quickly, indeed, and yet it knows nothing about all\
    \ the factors which it is compensating for – that’s all handled blindly by the\
    \ feedback, this is the PID algorithm. It takes the target, subtracts the feedback\
    \ input, resulting in the error. The error is then processed via a Proportional,\
    \ Integral and a Differential algorithm to produce the output.\n\n# Blender\n\n\
    **07** The outputs are applied to each ESC in turn; the vertical speed output\
    \ is applied equally to all blades, the pitch rate output is split 50/50 subtracting\
    \ from the front blades and adding to the back, producing the pitch. Roll is handled\
    \ similarly. Now yaw is handled in a similar way, but applied to diagonal blades\
    \ which spin in the same direction.\n\nThese ESC-specific outputs are then converted\
    \ to a PWM signal to feed to the hardware ESCs with the updated propeller/motor\
    \ speeds.\n\n![](img/59caadfa348382a5c408c25137901e27_140_0.png)\n\n# Quadcopter\
    \ orientation\n\nThe orientation of the quadcopter compared to the direction of\
    \ travel, the rotation of the propellers and the axes used in the code\n\n# Understanding\
    \ quadcopters…\n\nAlthough this article focuses on software, a very basic background\
    \ into the hardware from the kit is necessary to provide context.\n\nA quadcopter\
    \ has four propellers (hence the name) pointing upwards to the sky, each attached\
    \ to its own brushless DC motor at one of the four corners of usually a square\
    \ frame. Two motors spin clockwise, two anti-clockwise, to minimise angular momentum\
    \ of the quadcopter in flight.\n\nEach motor is driven independently by an electronic\
    \ speed controller (ESC). The motors themselves have three sets of coils (phases),\
    \ and the ESCs convert a pulse-width-modulation (PWM) control signal from software\
    \ (hardware to the three phase) high-current output to drive the motors as a speed\
    \ determined by the control signal.\n\nThe power for the ESCs and everything else\
    \ on the system comes from a Lithium Polymer battery (LiPo) rated at 250~3300mA\
    \ with peak surge current of 100A. It’s hairless less the power!\n\n# Sensors\n\
    \nThe quadcopter’s sensors report data according to these x, y and z axes\n\n\
    # Orientation\n\nThe overall orientation of the quadcopter depicting front, back,\
    \ left and right relative to the sensor and propeller layouts\n\n# Code and reality\n\
    \n![](img/59caadfa348382a5c408c25137901e27_141_0.png)\n\nIn this code, there are\
    \ nine PIDs in total. In the horizontal plane, for both the X- and Y axes, the\
    \ angle desired PIDs convert the user-defined desired tilt target to the angle\
    \ desired and angle of tilt target, the angles required to convert this desired\
    \ tilt angle to the desired tilt rate. The rotation speed PID then converts the\
    \ desired tilt rate to a motor speed, which in the vertical direction, a single\
    \ PID converts the desired rate of yaw to a motor speed. Finally, prevention of\
    \ yaw (like a spinning top) uses two PIDs - one to set the desired spin rate,\
    \ one to keep rotation steady. The output of the nine PIDs can be compared to\
    \ the front and back propellers. While some PIDs are independent, others interact\
    \ with each other. For example, the X-axis PID interacts with the Y-axis PID,\
    \ and the tilt PID interacts with the heading PID. This means that changing one\
    \ PID can affect the others.\n\nHeadwind will drift backwards. A tailwind will\
    \ drift forwards. Crosswind will drift sideways. These drifts are caused by the\
    \ horizontal thrust of the propellers. When the copter is accelerating, it pitches\
    \ forward or backward to generate the required thrust. This causes a horizontal\
    \ force that moves the copter in the direction of the wind. To counteract this,\
    \ the flight controller can use the vertical PIDs to adjust the copter's attitude\
    \ and reduce the drift.\n\n> Taking the drift suppression first, a quadcopter\
    \ in a headwind will drift backwards due to the force applied by the wind\n\n\
    The most critical part of the PID tuning is the heading PID. This PID is responsible\
    \ for keeping the copter pointing in the desired direction. If the heading PID\
    \ is not tuned correctly, the copter will oscillate or drift. The heading PID\
    \ is also affected by the wind. A strong headwind will cause the copter to yaw\
    \ backwards, while a tailwind will cause it to yaw forwards. The crosswind will\
    \ cause the copter to yaw sideways. To counteract these effects, the heading PID\
    \ can be adjusted to compensate for the wind.\n"
  mdcn: "\n# 编程控制四旋翼无人机\n\n## 项目\n\n### 你需要的东西...\n\n- 树莓派\n  www.raspberrypi.org/downloads\n\
    - Python\n  www.python.org/doc\n\n# 编程控制四旋翼无人机\n\n如何挑战树莓派的极限？给它装上翅膀。安迪·贝克向我们展示了其中的奥秘……\n\
    \n树莓派是一款出色的项目主板。由于我们热爱挑战，我们开始寻找一些能真正极限考验我们黑客技巧和编程技能的东西。我们选择了四旋翼无人机。\n\n本文使用在线提供的\
    \ Python 代码作为指南，介绍构建四旋翼无人机所需的一切内容，从隐喻上的“螺栓组装”入手，以便在文章结束时，你不仅理解了代码，还理解了与现实世界的交互，从而让你有信心构建自己的四旋翼无人机。你可以在安迪的博客上找到他的代码。\n\
    \n# 你知道吗...\n\n> 本文作者安迪·贝克维护着一个博客，位于 blog.pistuffing.co.uk，那里是对他项目的绝佳洞察\n\n![](img/59caadfa348382a5c408c25137901e27_137_0.png)\n\
    \n**右图** 借助我们的专家编程指南，将你的树莓派送入天空！\n\n## 传感器视角示意图\n\n四旋翼无人机视角中的传感器如何转换为地球（水平/垂直）视角，以提供水平运动\n\
    \n![](img/59caadfa348382a5c408c25137901e27_138_0.png)\n\n# 解释器\n\n**01** 命令解释器将一系列命令从无线电控制器或编程到代码本身中进行转换。这些命令结合了用户希望四旋翼无人机跟随的相对于地平线的方向和速度。代码将这些命令转换为一系列目标，包括垂直速度、水平速度和偏航速度——来自双摇杆的任何命令都可以分解为这组目标。\n\
    \n# 输入\n\n**02** 四旋翼无人机的输入来自一系列电子传感器，这些传感器提供有关其空中运动的信息。主要的两个传感器是加速度计，用于测量四旋翼无人机三个轴上的加速度力（包括重力），以及陀螺仪，用于测量四旋翼无人机俯仰（机头/机尾上下运动）、滚转（左/右侧上下运动）和偏航（围绕四旋翼无人机自身的中心轴顺时针和逆时针旋转）的角速度。\n\
    \n# 轴\n\n**03** 加速度计是相对于四旋翼无人机轴向定向的，但命令目标是相对于地球轴向的——即地平线和重力。要在四旋翼无人机轴和地球轴之间转换传感器输出，需要大量的数学运算，特别是三角学。你还需要了解四旋翼无人机相对于地球在俯仰和滚转轴上的倾斜角度。这相当复杂，但这些页面上的图表应该有助于你理解其逻辑。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_139_0.png)\n\n*上方* 如果你只想要飞行的乐趣，可以购买即飞（RTF）套件，但那样还有什么挑战呢？我们从几乎即飞（ARTF）套件——大疆\
    \ Flame Wheel F450——开始，它包含所有硬件，但没有控制电子元件或软件。许多爱好者使用 Arduino 微控制器创建了 DIY 四旋翼无人机，因此我们知道\
    \ DIY 组装是可能的，但非常讲究，而且据我们所知，还没有人成功使用树莓派。\n\n# 角度\n\n**04** 加速度计和陀螺仪都可以提供这种角度信息，但两者都有缺陷。可以使用欧拉算法通过加速度计输出来计算角度。然而，加速度计的输出受到电机/螺旋桨噪声的困扰，这意味着单次读数可能极其不准确；从积极的一面看，平均读数随时间推移保持准确。\n\
    \n相比之下，陀螺仪输出不受噪声影响，但由于测量的是角速度，需要对其进行积分才能找到四旋翼无人机相对于地平线的绝对角度。积分中的舍入错误会导致误差随时间不断增加，最终限制了飞行的最大时长。\n\
    \n# 滤波器\n\n**05** 它们都有缺陷，可以在数学上合并，使每个传感器弥补另一个的缺陷，从而得到无噪声、长期准确的读数。有很多版本的这些数学噪声/漂移滤波器。最常见的是卡尔曼滤波器；我们选择的稍微不够准确，但更易于理解，因此也易于编码：互补滤波器。\n\
    \n现在，有了准确的角度，就可以将加速度计传感器数据转换为相对于地球轴向的输入，并计算出四旋翼无人机向上、向下、向左、向右以及向前和向后移动的速度与设定目标的比较。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_139_1.png)\n\n# PID 控制器\n\n**06** 因此，我们现在有了希望四旋翼无人机执行的目标，有了它实际执行的输入，以及一些用于缩小两者差距的电机；我们现在所需要的只是一种将它们结合在一起的方式。一种直接的数学算法几乎是不可能的——需要把四旋翼无人机的精确重量、每片叶片的每转功率、重量不平衡等纳入方程。然而，这些因素在飞行期间（以及缓存中）都不稳定，叶片会受损，电池在机架中移动，草/泥/湿度会改变无人机的重量，湿度和海拔也需要考虑。希望现在很清楚，这种方法根本行不通。\n\
    \n相反，使用一种估算方法，并结合传感器的反馈来微调该估算。由于估算/反馈代码循环每秒旋转超过 100 次，这种方法可以非常快地对“误差”做出反应，事实上，它对正在补偿的所有因素一无所知——这一切都由反馈盲目处理，这就是\
    \ PID 算法。它获取目标，减去反馈输入，从而得出误差。然后，误差通过比例、积分和微分算法进行处理，以产生输出。\n\n# 混合器\n\n**07** 输出依次应用于每个电子调速器（ESC）；垂直速度输出均匀地应用于所有叶片，俯仰率输出以\
    \ 50/50 拆分，从前叶片中减去并加到后叶片，产生俯仰。滚转以类似方式处理。现在，偏航也以类似方式处理，但应用于朝相同方向旋转的对角叶片。\n\n这些针对\
    \ ESC 的输出随后转换为 PWM 信号，以向硬件 ESC 提供更新的螺旋桨/电机速度。\n\n![](img/59caadfa348382a5c408c25137901e27_140_0.png)\n\
    \n# 四旋翼无人机朝向\n\n四旋翼无人机相对于行进方向、螺旋桨旋转方向以及代码中使用的轴的朝向\n\n# 理解四旋翼无人机……\n\n虽然本文侧重于软件，但了解套件中硬件的基本背景是提供上下文所必需的。\n\
    \n四旋翼无人机有四个螺旋桨（因此得名），指向天空，每个螺旋桨都连接在一个通常呈方形框架的四个角上的独立无刷直流电机上。两个电机顺时针旋转，两个逆时针旋转，以最小化飞行中四旋翼无人机的角动量。\n\
    \n每个电机由电子调速器（ESC）独立驱动。电机本身有三组线圈（相），ESC 将来自软件（对三相硬件）的脉宽调制（PWM）控制信号转换为高电流输出，以驱动电机，其速度由控制信号决定。\n\
    \nESC 和系统上其他所有部件的电力来自锂聚合物电池（LiPo），额定容量为 250~3300mA，峰值浪涌电流为 100A。没有它就没有动力！\n\n\
    # 传感器\n\n四旋翼无人机的传感器根据这些 x、y 和 z 轴报告数据\n\n# 朝向\n\n四旋翼无人机的整体朝向，显示相对于传感器和螺旋桨布局的前、后、左和右\n\
    \n# 代码与现实\n\n![](img/59caadfa348382a5c408c25137901e27_141_0.png)\n\n在这段代码中，总共有九个\
    \ PID。在水平面中，对于 X 轴和 Y 轴，期望角度 PID 将用户定义的期望倾斜目标转换为期望角度和倾斜角度，即将期望倾斜角度转换为期望倾斜率所需的角速度。旋转速度\
    \ PID 随后将期望倾斜率转换为电机速度，而在垂直方向上，单个 PID 将期望偏航率转换为电机速度。最后，防止偏航（像旋转陀螺一样）使用两个 PID——一个用于设定期望旋转率，另一个用于保持旋转稳定。九个\
    \ PID 的输出可以与前螺旋桨和后螺旋桨进行比较。虽然一些 PID 是独立的，但其他 PID 会相互影响。例如，X 轴 PID 与 Y 轴 PID 相互作用，倾斜\
    \ PID 与航向 PID 相互作用。这意味着改变一个 PID 可能会影响其他 PID。\n\n顶风会导致向后漂移。尾风会导致向前漂移。侧风会导致侧向漂移。这些漂移是由螺旋桨的水平推力引起的。当无人机加速时，它会向前或向后俯仰以产生所需的推力。这会产生一种水平力，使无人机朝风向移动。为了抵消这一点，飞控可以使用垂直\
    \ PID 来调整无人机的姿态并减少漂移。\n\n> 首先考虑漂移抑制，在顶风中的四旋翼无人机会由于风力施加的作用力而向后漂移\n\nPID 调谐最关键的部分是航向\
    \ PID。该 PID 负责保持无人机指向期望的方向。如果航向 PID 未正确调谐，无人机将会振荡或漂移。航向 PID 也受风的影响。强烈的顶风会导致无人机向后偏航，而尾风会导致其向前偏航。侧风会导致无人机侧向偏航。为了抵消这些影响，可以调整航向\
    \ PID 以补偿风的影响。\n\n"
