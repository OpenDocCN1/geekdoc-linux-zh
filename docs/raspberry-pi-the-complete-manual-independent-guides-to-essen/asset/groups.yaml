    \n### 通电\n\n11 现在拿起你的 Micro-USB 线，将大头插入墙壁插座，或者插入电脑或笔记本的端口（并确保电脑已开机！）。你应该能看到 LED\
    \ 亮起。如果没有，请检查面包板或 Pi 上的连接，或者尝试换一个 LED。\n\n### 设置编程环境\n\n12 现在，我们需要做的不仅仅是打开灯——我们希望能够通过代码控制它。设置一个新的\
    \ Raspbian 安装（相关指南见第 278 页）。你不需要图形用户界面（GUI）——如果你愿意，完全可以透过终端完成。在开始之前，最好通过以下命令确保所有软件都是最新的：\n\
