    \ should fill any holes with missing components.\n\n```python\n#!/usr/bin/env\
    \ python\n\nfrom nappy import Arduino\nfrom time import sleep\n\n# set LED pins\
    \ - these go to the Digital pins of your Arduino\nredPin = 3\ngreenPin = 6\nbluePin\
