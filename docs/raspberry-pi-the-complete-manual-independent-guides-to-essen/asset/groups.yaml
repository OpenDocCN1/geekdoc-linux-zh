    # Turn your Pi into

    an office suite


    How to add a full, free office suite to your Raspberry Pi to turn it into the
    smallest home office ever


    You can''t get far with a computer if you don''t have tools that cater for things
    like letter writing, spreadsheets and presentations. Thankfully this is well within
    the scope of the Raspberry Pi''s capabilities and, although Raspbian comes bundled
    with a couple of text editors, sometimes you need the extra functionality a full
    office suite can offer. This is really easy on the Pi and the best option available
    is open source and thus completely free: LibreOffice.


    LibreOffice is a fully featured Microsoft Office drop-in replacement and the Raspberry
    Pi will handle it well so long as you''re not creating huge documents with hundreds
    of images. You''ll need a working internet connection for this tutorial, so make
    sure your LAN cable or wireless dongle is plugged in and functional, because we''ll
    be using the built-in package manager. Installation does take some time, though.


    # Install LibreOffice


    +   01

    +   The best thing about open-source software is the fact that you can install
    it any time (so long as you have an internet connection or installation medium...
    anyway!) at your total convenience - without having to worry about handing over
    payment details. So, let''s get right on with doing exactly that: open your terminal
    - you can do this by double-clicking LXTerminal from your desktop. Install the
    LibreOffice office suit by using the package manager.


    ```

    sudo apt-get install libreoffice

    Now type in your password. Press ''Y'' and Enter when prompted to install other
    dependency packages. Now sit back, relax or make some tea

    ```


    # Presentations


    A really impressive piece of kit, it allows creation of presentations in just
    a few simple clicks


    # Drawing


    Not artistic drawing as you might think, but a great application for creating
    quick, good looking flow and process diagrams


    ![](img/59caadfa348382a5c408c25137901e27_35_0.png)


    # Word processing


    LibreOffice comes with a great word-processing application that works brilliantly
    on the Pi with no hassle


    # Spreadsheets


    Also bundled is a spreadsheet application - its ability to read any popular spreadsheet
    file format makes it very powerful'
