    \ with:\n\n```\n$ sudo nano /etc/hostapd/hostapd.conf\n```\n\nOnce this is complete\
    \ you can continue to the next step...\n\n> “The Onion Pi combines Raspbian and\
    \ Tor. This will keep you anonymous online. A handy feature in a time of privacy\
    \ concerns all around the web”\n\n#### WLAN configuration\n\n**12** Assuming you’ve\
