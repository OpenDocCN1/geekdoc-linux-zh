  - "[PAGE 66]\n\n# Connecting the breadboard\n\n**02**  \nPower off your Pi, and\
    \ disconnect the power cable. Get your breadboard, an LED, a 330-ohm resistor\
    \ and two GPIO cables ready. We'll want to connect the 3.3V pin (top-right pin,\
    \ closest to the SD card) to one end of the 330-ohm resistor, and then connect\
    \ the positive terminal of the LED (the longer leg is positive) to the other end.\
    \ The resistor is used to limit the amount of current that can flow to the LED.\n\
    \nThen put the negative terminal of the LED into the negative rail of the breadboard.\
    \ Connect one of the GROUND pins (for example, the third pin from the right on\
    \ the bottom row of pins) to the negative lane. Now connect the power to your\
    \ Pi. We'll should light up. If it doesn't, then it's likely that you've got the\
    \ wrong way round, so disconnect the power, swap the legs around and then try\
    \ again.\n\n# Switching the LED on and off\n\n**03**  \nAt the moment, the LED\
    \ is connected to a pin that constantly provides 3.3V. This isn't very useful\
    \ if we want to be able to turn it on and off, so let's connect it to GPIO 17,\
    \ which we can turn on and off. GPIO 17 is the sixth pin from the right, on the\
    \ top row of pins. Power the Pi back on. We can't turn the LED on by exporting\
    \ the GPIO pin, setting it to an output pin and then setting its value to 1. Setting\
    \ the value to 0 turns the LED back off.\n\n```\n```\necho  17 > /sys/class/gpio/\n\
    export\n\necho out > /sys/class/gpio/\ngpio1/direction\n\necho  1 > /sys/class/gpio/\n\
    gpio1/value\n\necho  0 > /sys/class/gpio/\ngpio1/value\n```\n```\n\n![](img/59caadfa348382a5c408c25137901e27_66_0.png)\n\
    \n# Controlling the LED from Scratch\n\n**04**  \nStart the LXDE desktop environment\
    \ and open ScratchGPIO. Go to the control section and create a simple script that\
    \ broadcasts pin 10 when Sprite1 is clicked. Then click the sprite. The LED should\
    \ light up. Then add to the script to wait 1 second and then broadcast pin 1 off\
    \ to click the sprite again. The LED will come on for a second and then go off.\
    \ Scratch/GPIO3\n\n# Wiring up our push button\n\n**05**  \nPower off the Pi again.\
    \ This circuit is a little bit more complicated than the LED one we created previously.\
    \ The first thing we need to do is connect 3.3V to the top-right pin we used to\
    \ test our LED to the positive rail of the breadboard. We need to connect a 10kOhm\
    \ resistor to the positive rail, and the other end to an empty track on the breadboard.\
    \ Then on the same track, add a wire that has one end connected to GPIO 4. This\
    \ is two pins to the right of GPIO 17. Then, on the same track again, connect\
    \ one pin of the push button. Finally, connect the other pin of the push button\
    \ to ground by adding a wire that is connected to the same negative rails that\
    \ ground is connected to.\n\nWhen the button is not pressed, GPIO 4 will be reading\
    \ 3.3V. However, when the button is pressed, the circuit to ground will be completed\
    \ and GPIO 4 will be reading 0V (and have a voltage of 0V, because there is much\
    \ less resistance on the path to ground). We can use this in action by watching\
    \ the pin's value and then pressing the button to make it change.\n\n```\n```\n\
    echo 4 > /sys/class/gpio/\nexport\n\necho in > /sys/class/gpio/\ngpio4/direction\n\
    \necho $ 0.5 cat /sys/class/\ngpio/gpio4/value\n```\n```\n\n# Let there be light!\n\
    \n**06**  \nBoot up the Pi and start ScratchGPIO. Go to the control section and\
    \ add when green flag clicked, then attach a forever loop, and inside that an\
    \ if else statement. From the operators section and add an if [] is [] operator\
    \ to it statement. Then go to the sensing section and add a value sensor to the\
    \ left side of the equality statement, and set it to pin7. Enter 0 on the right.\
    \ Broadcast pin 1 on if the sensor value is 0, and broadcast pin 1 off otherwise.\
    \ Click the green flag. If you push the button, the LED will light up."
  md: "\n## Build a multiple-choice quiz\n\nLearn how to use lists to create questions\
    \ and answers for a fast-paced Scratch-based quiz\n\nThe key feature of this Scratch\
    \ quiz is the ability to process text and numbers. However, Designer is more designed\
    \ for animated graphics and its weak areas – arrays, text display and variable\
    \ inputs – are all required for a project like this. It centres around using lists,\
    \ which are Scratch equivalents of arrays. The main drawback though is that while\
    \ lists can have multiple rows, they only have one column. For this project we\
    \ need columns for the questions, three different answers and a code for the right\
    \ answers to match with the keyboard input. With ten questions that would require\
    \ a 10x5 array variable. With Scratch, that in turn means we need five 10x1 lists.\
    \ Let's get started...\n\n### What you'll need...\n\n- Scratch\n\n![](img/59caadfa348382a5c408c25137901e27_63_0.png)\n\
    \n**Joining up words**\nThe feature of the code is the Scratch equivalent of adding\
    \ strings together from the list, in a string variable\n\n**Questions and answers**\n\
    All the text questions, answers and the right answer as a number are kept in lists,\
    \ which are simple arrays\n\n> **Did you know...**\n> \n> You can 'build' upon\
    \ projects made by other users by using their project, as the base for your own,\
    \ as long as you credit them!\n\n**Tick boxes showing**\nOnce all lists have been\
    \ populated you need to remove them from the screen. Untick here to do so\n\n\
    **Got it right?**\nThis code detects whether the correct answer has been entered\
    \ just by checking the answer list and incrementing the score\n\n![](img/59caadfa348382a5c408c25137901e27_63_1.png)\n\
    \n### Create the lists\n\n1. Click on Variables and make a list called Questions.\
    \ As soon as you do the list appears in the stage window ready for you to edit.\
    \ Click on the Plus sign to start adding elements. Type in all the country names\
    \ you have in a list of 10. Click on the x gadget of the 11th if needed.\n\n###\
    \ Fill out the answers\n\n2. Repeat this process for three new lists, each with\
    \ an answer. It pays to arrange them side by side while doing this so you can\
    \ ensure you get a right answer in each one. Create a final list that has a number\
    \ one to three. This identifies which number list has the right answer.\n\n![](img/59caadfa348382a5c408c25137901e27_64_0.png)\n\
    \n### Set it up\n\n3. Now create three new variables called ‘Capital’, ‘YourScore’\
    \ and ‘counter’. Untick all the variables in the list so they disappear from the\
    \ stage. Set the ‘counter’ to 1 and ‘YourScore’ to 0. Position the sprite and\
    \ warn the player to be ready.\n\n![](img/59caadfa348382a5c408c25137901e27_64_1.png)\n\
    \n### Create loop, set question\n\n4. Drag a ‘Repeat’ loop from Control and set\
    \ it to 10 for the number of questions. Add function ‘Set Capital’ to empty. Drag\
    \ in an Operator called ‘Join ()’. Make the first half text. Add a variable to\
    \ the other half and put ‘Counter’ into ‘Questions’.\n\n### Display the answers\n\
    \n5. From Looks add a ‘Say ()’ and drop in ‘Capital’. Then create the three answers\
    \ by using the ‘Say’ command and adding a ‘Join ()’. The first entry is simply\
    \ the number of the answer, the second part is the text.\n\n![](img/59caadfa348382a5c408c25137901e27_64_2.png)\n\
    \n### Scan for the answers\n\n6. There are pauses between the answers being displayed.\
    \ Add ‘Say’ to prompt to press 1, 2 or 3. Drag in a ‘Wait until’ Control. Go into\
    \ Operators. There are only ones with two conditions so use that, then put an\
    \ extra two conditions into the second box to make three.\n\n![](img/59caadfa348382a5c408c25137901e27_64_3.png)\n\
    \n### Is the answer right?\n\n7. Drag in an ‘If ()’ Control. Drop a ‘=’ Operator\
    \ into the space. In the first space add ‘Key 1 pressed’ and ‘0 = [?] Operator’.\
    \ In the second put another ‘[?] = [?] Operator’. In the first part add Item ‘[?]\
    \ of [?]’ from ‘Variable’ with ‘Counter’, and in the second type ‘1’.\n\n![](img/59caadfa348382a5c408c25137901e27_64_4.png)\n\
    \n### Repeat and add score\n\n8. Add a ‘Change Your Score by 1’ for a correct\
    \ answer. Repeat this twice for the other answers. Then increase the ‘Counter’\
    \ variable by 1 and clear the screen. Outside the loop add some pauses to show\
    \ the quiz is over and then display the score in ‘YourScore’. Well done, you’ve\
    \ finished your first quiz game!\n\n## Get interactive with Scratch\n\n### What\
    \ you'll need...\n\n- Breadboard\n- LEDs\n- Buttons\n- Resistors\n- Jumper wires\n\
    - ScratchGPIO3\n\nExperiment with physical computing by using Scratch to interact\
    \ with buttons and lights on your Pi\n\nScratch is a very simple visual programming\
    \ language, commonly used to teach basic programming concepts to learners of any\
    \ age. In this project we'll learn how to light up an LED when a button is pressed\
    \ in Scratch, and then change a character's colour when a physical button is pressed\
    \ using the General Purpose Input/Output (GPIO) pins on your Raspberry Pi. With\
    \ these techniques you can make all manner of fun and engaging projects, from\
    \ musical keyboards to controllers for your Scratch games and animations. You'll\
    \ need some components for this guide. Just search online for 'Raspberry Pi GPIO\
    \ basic kit' to get you started.\n\n> Below Scratch can be used to do Internet\
    \ Of Things projects with a few tweaks\n\n![](img/59caadfa348382a5c408c25137901e27_65_0.png)\n\
    \n> \"In this project we'll learn how to light up an LED when a button is pressed\
    \ in Scratch using the GPIO pins\"\n\n### Installing the required software packages\n\
    \n1. Log in to the Raspbian system with the username `Pi` and the password `raspberry`.\
    \ Start the LXDE desktop environment using the command `startx`. Next, open up\
    \ a terminal and then type the following commands:\n\n```bash\nwget http://liamfraser.co.uk/lud/Install_scratchgpio3.sh\n\
    chmod +x install_scratchgpio3.sh\nbash install_scratchgpio3.sh\n```\n\nThis will\
    \ create a special version of Scratch on your desktop called ScratchGPIO3. This\
    \ is a normal version of Scratch with a Python script that handles communications\
    \ between Scratch and the GPIO. ScratchGPIO was created by smples (simpleyc.wordpress.com).\n\
    \n### Connecting the breadboard\n\n2. Power off your Pi, and disconnect the power\
    \ cable. Get your breadboard, an LED, a 330-ohm resistor and two GPIO cables ready.\
    \ We'll want to connect the 3.3V pin (top-right pin, closest to the SD card) to\
    \ one end of the 330-ohm resistor, and then connect the positive terminal of the\
    \ LED (the longer leg is positive) to the other end. The resistor is used to limit\
    \ the amount of current that can flow to the LED.\n\nThen put the negative terminal\
    \ of the LED into the negative rail of the breadboard. Connect one of the GROUND\
    \ pins (for example, the third pin from the right on the bottom row of pins) to\
    \ the negative lane. Now connect the power to your Pi. The LED should light up.\
    \ If it doesn't, then it's likely that you've got it the wrong way round, so disconnect\
    \ the power, swap the legs around and then try again.\n\n### Switching the LED\
    \ on and off\n\n3. At the moment, the LED is connected to a pin that constantly\
    \ provides 3.3V. This isn't very useful if we want to be able to turn it on and\
    \ off, so let's connect it to GPIO 17, which we can turn on and off. GPIO 17 is\
    \ the sixth pin from the right, on the top row of pins. Power the Pi back on.\
    \ We can turn the LED on by exporting the GPIO pin, setting it to an output pin\
    \ and then setting its value to 1. Setting the value to 0 turns the LED back off.\n\
    \n```bash\necho 17 > /sys/class/gpio/export\necho out > /sys/class/gpio/gpio17/direction\n\
    echo 1 > /sys/class/gpio/gpio17/value\necho 0 > /sys/class/gpio/gpio17/value\n\
    ```\n\n![](img/59caadfa348382a5c408c25137901e27_66_0.png)\n\n### Controlling the\
    \ LED from Scratch\n\n4. Start the LXDE desktop environment and open ScratchGPIO.\
    \ Go to the control section and create a simple script that broadcasts pin 10\
    \ when Sprite1 is clicked. Then click the sprite. The LED should light up. Then\
    \ add to the script to wait 1 second and then broadcast pin 1 off to click the\
    \ sprite again. The LED will come on for a second and then go off.\n\n### Wiring\
    \ up our push button\n\n5. Power off the Pi again. This circuit is a little bit\
    \ more complicated than the LED one we created previously. The first thing we\
    \ need to do is connect 3.3V to the top-right pin we used to test our LED to the\
    \ positive rail of the breadboard. We need to connect a 10kOhm resistor to the\
    \ positive rail, and the other end to an empty track on the breadboard. Then on\
    \ the same track, add a wire that has one end connected to GPIO 4. This is two\
    \ pins to the right of GPIO 17. Then, on the same track again, connect one pin\
    \ of the push button. Finally, connect the other pin of the push button to ground\
    \ by adding a wire that is connected to the same negative rails that ground is\
    \ connected to.\n\nWhen the button is not pressed, GPIO 4 will be reading 3.3V.\
    \ However, when the button is pressed, the circuit to ground will be completed\
    \ and GPIO 4 will be reading 0V (and have a voltage of 0V, because there is much\
    \ less resistance on the path to ground). We can use this in action by watching\
    \ the pin's value and then pressing the button to make it change.\n\n```bash\n\
    echo 4 > /sys/class/gpio/export\necho in > /sys/class/gpio/gpio4/direction\ncat\
    \ /sys/class/gpio/gpio4/value\n```\n\n### Let there be light!\n\n6. Boot up the\
    \ Pi and start ScratchGPIO. Go to the control section and add when green flag\
    \ clicked, then attach a forever loop, and inside that an if else statement. From\
    \ the operators section and add an if [] = [] operator to it statement. Then go\
    \ to the sensing section and add a value sensor to the left side of the equality\
    \ statement, and set it to pin7. Enter 0 on the right. Broadcast pin 1 on if the\
    \ sensor value is 0, and broadcast pin 1 off otherwise. Click the green flag.\
    \ If you push the button, the LED will light up.\n"
  mdcn: "\n\n## 制作多项选择题测验\n\n学习如何使用列表为快节奏的基于 Scratch 的测验创建问题和答案\n\n这个 Scratch 测验的关键特性是处理文本和数字的能力。然而，Designer\
    \ 更偏向于动画图形，而其薄弱环节——数组、文本显示和变量输入——恰恰是这类项目所必需的。该项目的核心是使用列表，即 Scratch 中数组的等价物。主要缺点是，虽然列表可以有多行，但只有一列。对于这个项目，我们需要列来存放问题、三个不同的答案以及用于匹配键盘输入的正确答案代码。如果包含十个问题，这将需要一个\
    \ 10x5 的数组变量。在 Scratch 中，这意味着我们需要五个 10x1 的列表。让我们开始吧……\n\n### 所需材料...\n\n- Scratch\n\
    \n![](img/59caadfa348382a5c408c25137901e27_63_0.png)\n\n**组合单词**\n代码的特性是 Scratch\
    \ 中从列表中将字符串相加的等价功能，生成一个字符串变量\n\n**问题和答案**\n所有文本问题、答案以及作为数字的正确答案都存储在列表中，这些列表是简单的数组\n\
    \n> **你知道吗...**\n> \n> 只要注明出处，你就可以使用其他用户制作的项目作为基础，在此基础上“构建”属于自己的项目！\n\n**勾选框显示**\n\
    一旦所有列表都已填充，你需要将它们从屏幕上移除。取消勾选此处即可实现\n\n**答对了吗？**\n这段代码仅通过检查答案列表并递增分数来检测是否输入了正确答案\n\
    \n![](img/59caadfa348382a5c408c25137901e27_63_1.png)\n\n### 创建列表\n\n1. 点击“变量”并创建一个名为\
    \ Questions 的列表。一旦创建，列表就会出现在舞台窗口中，等待你编辑。点击加号开始添加元素。在一个包含 10 个国家的列表中，输入你所有的国家名称。如有需要，点击第\
    \ 11 个元素的 x 小部件。\n\n### 填写答案\n\n2. 对三个新列表重复此过程，每个列表包含一个答案。在操作时并排排列它们很有用，这样你可以确保每个问题都有一个正确答案。创建一个最终的列表，包含数字\
    \ 1 到 3。这标识了哪个数字列表拥有正确答案。\n\n![](img/59caadfa348382a5c408c25137901e27_64_0.png)\n\
    \n### 设置\n\n3. 现在创建三个新变量，分别名为 ‘Capital’、‘YourScore’ 和 ‘counter’。取消勾选列表中的所有变量，使它们从舞台上消失。将\
    \ ‘counter’ 设置为 1，将 ‘YourScore’ 设置为 0。定位角色并警告玩家准备就绪。\n\n![](img/59caadfa348382a5c408c25137901e27_64_1.png)\n\
    \n### 创建循环，设置问题\n\n4. 从“控制”中拖动一个 ‘Repeat’（重复）循环，并将问题数量设置为 10。添加函数 ‘Set Capital’\
    \ 并将其置空。拖动一个名为 ‘Join ()’（合并）的运算符。使前半部分为文本。在后半部分添加一个变量，并将 ‘Counter’ 放入 ‘Questions’。\n\
    \n### 显示答案\n\n5. 从“外观”中添加一个 ‘Say ()’（说），并放入 ‘Capital’。然后使用 ‘Say’ 命令并添加 ‘Join ()’\
    \ 来创建三个答案。第一个条目只是答案的编号，第二部分是文本。\n\n![](img/59caadfa348382a5c408c25137901e27_64_2.png)\n\
    \n### 扫描答案\n\n6. 在显示答案之间有暂停。添加 ‘Say’ 提示按下 1、2 或 3。拖动一个 ‘Wait until’（等待直到）控制块。进入运算符。只有两个条件的运算符，所以使用它，然后在第二个框中再放入两个额外的条件以构成三个。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_64_3.png)\n\n### 答案正确吗？\n\n7. 拖动一个\
    \ ‘If ()’（如果）控制块。将一个 ‘=’ 运算符放入空格中。在第一个空格添加 ‘Key 1 pressed’ 和 ‘0 = [?] 运算符’。在第二个放入另一个\
    \ ‘[?] = [?] 运算符’。在第一部分添加来自 ‘变量’ 的 Item ‘[?] of [?]’，其中 ‘Counter’，并在第二部分输入 ‘1’。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_64_4.png)\n\n### 重复并添加分数\n\n8. 为正确答案添加一个\
    \ ‘Change Your Score by 1’（将你的分数改变 1）。对其余两个答案重复此操作两次。然后将 ‘Counter’ 变量增加 1 并清除屏幕。在循环外部添加一些暂停以显示测验结束，然后显示\
    \ ‘YourScore’ 中的分数。干得好，你完成了你的第一个测验游戏！\n\n## 使用 Scratch 进行交互式操作\n\n### 所需材料...\n\
    \n- 面包板\n- LED\n- 按钮\n- 电阻\n- 跳线\n- ScratchGPIO3\n\n通过使用 Scratch 与树莓派上的按钮和灯光进行交互，探索物理计算\n\
    \nScratch 是一种非常简单的可视化编程语言，通常用于向任何年龄的学习者教授基本编程概念。在这个项目中，我们将学习如何在 Scratch 中点亮一个\
    \ LED 当按钮被按下时，然后使用树莓派上的通用输入/输出 (GPIO) 引脚，在按下物理按钮时改变角色的颜色。利用这些技术，你可以制作各种有趣和引人入胜的项目，从音乐键盘到\
    \ Scratch 游戏和动画的控制器。你需要一些组件来完成本指南。只需在线搜索 \"Raspberry Pi GPIO basic kit\" 即可开始。\n\
    \n> 稍作调整，下面提到的 Scratch 可用于物联网项目\n\n![](img/59caadfa348382a5c408c25137901e27_65_0.png)\n\
    \n> “在这个项目中，我们将学习如何使用 GPIO 引脚，在 Scratch 中当按钮被按下时点亮一个 LED”\n\n### 安装所需的软件包\n\n\
    1. 使用用户名 `Pi` 和密码 `raspberry` 登录 Raspbian 系统。使用命令 `startx` 启动 LXDE 桌面环境。接下来，打开终端并输入以下命令：\n\
    \n```bash\nwget http://liamfraser.co.uk/lud/Install_scratchgpio3.sh\nchmod +x\
    \ install_scratchgpio3.sh\nbash install_scratchgpio3.sh\n```\n\n这将在你的桌面上创建一个名为\
    \ ScratchGPIO3 的特殊版本 Scratch。这是一个普通版本的 Scratch，包含一个 Python 脚本，用于处理 Scratch 和 GPIO\
    \ 之间的通信。ScratchGPIO 由 smples (simpleyc.wordpress.com) 创建。\n\n### 连接面包板\n\n2. 关闭\
    \ Pi 的电源，并断开电源线。准备好你的面包板、一个 LED、一个 330 欧姆电阻和两根 GPIO 电缆。我们将把 3.3V 引脚（右上角引脚，最靠近\
    \ SD 卡）连接到 330 欧姆电阻的一端，然后将 LED 的正极端（较长的引脚为正极）连接到另一端。电阻用于限制流向 LED 的电流大小。\n\n然后将\
    \ LED 的负极端插入面包板的负极轨。将其中一个 GROUND 引脚（例如，底部一行引脚从右数第三个引脚）连接到负极轨。现在将电源连接到你的 Pi。LED\
    \ 应该会亮起。如果它没有亮起，那么很可能是你接反了，所以断开电源，交换引脚位置，然后重试。\n\n### 开关 LED\n\n3. 目前，LED 连接到一个持续提供\
    \ 3.3V 的引脚。如果我们想要能够打开和关闭它，这并不是很有用，所以我们把它连接到 GPIO 17，我们可以将其打开和关闭。GPIO 17 是顶部一行引脚从右数第六个引脚。重新打开\
    \ Pi 的电源。我们可以通过导出 GPIO 引脚，将其设置为输出引脚，然后将其值设置为 1 来点亮 LED。将值设置为 0 可以关闭 LED。\n\n```bash\n\
    echo 17 > /sys/class/gpio/export\necho out > /sys/class/gpio/gpio17/direction\n\
    echo 1 > /sys/class/gpio/gpio17/value\necho 0 > /sys/class/gpio/gpio17/value\n\
    ```\n\n![](img/59caadfa348382a5c408c25137901e27_66_0.png)\n\n### 从 Scratch 控制\
    \ LED\n\n4. 启动 LXDE 桌面环境并打开 ScratchGPIO。进入控制部分，创建一个简单脚本，当点击 Sprite1 时广播 pin 10。然后点击角色。LED\
    \ 应该会亮起。然后在脚本中添加等待 1 秒，然后广播 pin 1 off 再次点击角色。LED 将亮起一秒然后熄灭。\n\n### 连接我们的按压按钮\n\
    \n5. 再次关闭 Pi 的电源。这个电路比之前创建的 LED 电路稍微复杂一点。我们需要做的第一件事是将 3.3V 连接到我们之前用于测试 LED 的右上角引脚，连接到面包板的正极轨。我们需要将一个\
    \ 10kOhm 电阻连接到正极轨，另一端连接到面包板上的一个空轨道。然后，在同一轨道上，添加一根导线，其一端连接到 GPIO 4。这是在 GPIO 17\
    \ 右侧两个引脚的位置。然后，再次在同一轨道上，连接按压按钮的一个引脚。最后，通过将导线连接到与 ground 相同的负极轨，将按压按钮的另一个引脚连接到地。\n\
    \n当按钮未被按下时，GPIO 4 将读取 3.3V。然而，当按钮被按下时，到地的电路将被闭合，GPIO 4 将读取 0V（并且具有 0V 的电压，因为通往地的路径电阻小得多）。我们可以通过监视引脚的值然后按下按钮使其变化来利用这一特性。\n\
    \n```bash\necho 4 > /sys/class/gpio/export\necho in > /sys/class/gpio/gpio4/direction\n\
    cat /sys/class/gpio/gpio4/value\n```\n\n### 让我们点亮！\n\n6. 启动 Pi 并打开 ScratchGPIO。进入控制部分，添加当绿色旗帜被点击，然后附加一个\
    \ forever 循环，并在其中添加一个 if else 语句。从运算符部分添加一个 if [] = [] 运算符到该语句。然后进入 sensing 部分，在等式左侧添加一个\
    \ value 传感器，并将其设置为 pin7。在右侧输入 0。如果传感器值为 0，则广播 pin 1，否则广播 pin 1 off。点击绿色旗帜。如果你按下按钮，LED\
    \ 将会亮起。\n\n"
