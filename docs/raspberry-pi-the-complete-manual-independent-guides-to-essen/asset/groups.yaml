    4.  代码开头没有特别复杂的内容，“Tux”和包体的初始位置被设置，同时也设置了 Tux 的初始速度和方向。这些设置也在得分时和重置游戏场地时使用。每次生成时，方向和速度都会设置为随机值。\n\
