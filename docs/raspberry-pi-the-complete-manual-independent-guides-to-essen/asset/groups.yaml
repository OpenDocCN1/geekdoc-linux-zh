    \n```\nsudo nano gpio.py\nGPIO.setmode(GPIO.BOARD)\n```\n\n### 设置引脚模式\n\n**19**\
    \ 在引脚工作之前，必须将其定义为输入或输出。GPIO 库通过调用 GPIO.setup 方法简化了这一点。然后传入引脚编号，以及 GPIO.OUT 或 GPIO.IN。由于我们要使用\
    \ LED，所以它是输出。你将频繁使用这些约定，因此请尽可能多地学习它们，以便牢记在心。\n\n```\nGPIO.setup(12, GPIO.OUT)\n\
    ```\n\n### 使用 PWM\n\n**20** 下一步是告诉引脚输出，然后设置退出程序的方法。这里我们再次调用 GPIO 类和 PWM 方法，传入引脚编号，第二个值是频率（赫兹）——在这种情况下为\
    \ 0.5。\n\n```\np = GPIO.PWM(12, 0.5)\np.start(1)\ninput('Press return to stop:\
    \ ')\np.stop()\nGPIO.cleanup()\n```\n\n### 调整 PWM\n\n**21** 为了在 LED 上添加定时器使其淡出，我们首先需要导入\
    \ time 库，然后将 12 号引脚设置为 50Hz 频率以开始。\n\n```\nimport time\nimport RPi.GPIO as GPIO\n\
    GPIO.setmode(GPIO.BOARD)\nGPIO.setup(12, GPIO.OUT)\np = GPIO.PWM(12, 50) # channel=12\
    \ frequency=50Hz\np.start(0)\n```\n\n### 添加淡入淡出\n\n**22** 然后我们添加另一个 try/except\
    \ 块，这次检查 LED 的功率——当它达到一定水平时，我们反转过程。要运行此代码，只需保存它，然后运行 sudo python gpio.py。\n\n\
    ```\nwhile 1:\n    for dc in range(0, 101, 5):\n        p.ChangeutyCycle(dc)\n\
    \        time.sleep(0.1)\n    for dc in range(100, -1, -5):\n        p.ChangeutyCycle(dc)\n\
    \        time.sleep(0.1)\n    except KeyboardInterrupt:\n        pass\n\np.stop()\n\
    GPIO.cleanup()\n```\n\n![Image](img/59caadfa348382a5c408c25137901e27_76_1.png)\n\
    \n> “我们将 GPIO 模式设置为 BOARD。无论你使用哪个版本的 Pi，这都能正常工作”\n\n## 你需要什么...\n\n- 便携式 USB 音箱\n\
    - python-espeak 模块\n- espeak\n- Raspbian（最新镜像）\n\n> **你知道吗...**\n> 使用 espeak，你可以控制单词的发音方式以增加强调，或者让声音听起来不同\n\
    \n![Image](img/59caadfa348382a5c408c25137901e27_77_0.png)\n\n### 你需要的所有东西\n\n\
    01 我们将一次性安装本教程中计划使用的所有内容。这包括 espeak 库和展示其功能所需的 Python 模块。打开终端并使用以下命令安装：\n\n```bash\n\
    $ sudo apt-get install espeak python-espeak python-tk\n```\n\n### 语音合成器\n\n使用多功能的\
    \ espeak Python 库为你的树莓派项目添加语音功能\n\n我们展示了树莓派如何用于驱动各种项目，但作为一台微型计算机，它也可以成为你家中物联网的中心。出于这些原因及其他原因，使用树莓派进行文本转语音命令可能正是你在寻找的。由于\
    \ Raspbian 基于 Debian，功能强大的 espeak 库很容易让想要使用它的人获取。还有一个模块允许你在 Python 中使用 espeak，超越了标准的命令行提示，以便你可以执行自动化任务。\n\
    \n### Pi 的第一句话\n\n02 espeak 库的使用非常简单——要让它说点什么，在终端中输入：\n\n```bash\n$ espeak \"\
    [message]\"\n```\n\n这将使用该库的默认设置朗读消息中写的内容，清晰度相当不错。虽然这个简单命令就能做到，但我们还可以做更多事情...\n\
    \n### 说更多\n\n03 你可以通过许多不同的选项更改 espeak 朗读文本的方式，例如性别、阅读速度甚至音节发音方式。例如，这样编写命令...\n\
    \n```bash\n$ espeak -venf3 -k5 -s150 \"[message]\"\n```\n\n...将使声音变为女性，强调大写字母，并使阅读速度变慢。\n\
    \n![Image](img/59caadfa348382a5c408c25137901e27_77_1.png)\n\n"
