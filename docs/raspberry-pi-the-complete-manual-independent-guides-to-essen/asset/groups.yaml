    **06** You have finished editing the /samba.conf file now. So, to save and exit,
    press Ctrl-X, then press Y to save, and Enter to exit.


    With this configuration, a layer of password security is in place, so we now need
    to set up a Samba password to use with it. In your terminal window, type the following
    command:


    ```

    `smbpasswd -a pi`

