    \ -vcodec libx264 -b 800k video.avi`。这假设你的机器上已安装 libx264，并且 image%04d.jpg 假设了文件格式及其显示的数字位数（在本例中为：'picture0001.jpg'）。\n\
    \n## 使用相机板制作定格动画\n\n### 你需要准备什么……\n\n- 最新版本的 Raspbian\n- [http://www.raspberrypi.org/downloads](http://www.raspberrypi.org/downloads)\n\
    - picamera Python 模块\n- [http://picamera.readthedocs.org](http://picamera.readthedocs.org)\n\
    - RasPi 相机模块\n- [http://bit.ly/raspicam](http://bit.ly/raspicam)\n- Pygame\n-\
    \ [http://www.pygame.org](http://www.pygame.org)\n\n觉得自己是下一个尼克·帕克（Nick Park）吗？搭建这个\
    \ DIY 定格动画工作室，看看你能创造出什么。\n\n![](img/59caadfa348382a5c408c25137901e27_101_0.png)\n\
    \n树莓派相机模块为你的树莓派项目打开了摄影和电影制作方面的大门。我们将在这里结合两者，创建一个功能齐全的定格动画应用程序 Pi-Motion，使制作令人印象深刻的\
    \ HD 动画变得极其简单。\n\n我们用 Python 编写了这个项目，它依赖于两个你需要安装的库。Picamera（[http://picamera.readthedocs.org](http://picamera.readthedocs.org)）是树莓派相机模块的纯\
    \ Python 接口，是所有相机模块所有者的必备工具。另一方面，Pygame（[http://www.pygame.org](http://www.pygame.org)）确保我们的图像可以按需显示。该项目目前的形态只是一个更大规模定格动画应用程序的概念验证。它并不完美，但证明了树莓派配合相机板和一点专业知识可以带来惊人的效果！\n\
    \n密切关注 [http://github.com/russb78/pi-motion](http://github.com/russb78/pi-motion)\
    \ 以获取该项目未来的更新……\n\n### 设置相机模块\n\n- **01** 首先，你需要确保树莓派已更新到最新版本。在终端中，输入：\n\n```bash\n\
    sudo apt-get update && sudo apt-get upgrade\n```\n\n- 接下来，我们需要更新树莓派的固件并确保激活相机模块。请记住，这需要一些时间。\n\
    \n```bash\nsudo rpi-update\nsudo raspi-config\n```\n\n### 完整代码列表\n\n第一项工作是导入我们将与项目一起使用的库，并设置一些关键变量。\n\
    \n接下来我们初始化 Pygame，以便在我们的项目中使用它，并设置一些围绕它的关键变量。\n\n```python\nimport pygame, picamera,\
    \ os, sys\n\npics_taken = 0\ncurrent_alpha, next_alpha = 128, 255\nfps = 5\n```\n\
    \n```python\npygame.init()\nres = pygame.display.list_modes() # 返回适合你显示器的最佳分辨率\n\
    width, height = res[0]\nprint \"Reported resolution is:\", width, \"x\", height\n\
    start_pic = pygame.image.load(os.path.join(\"data\", \"start_screen.jpg\"))\n\
    start_pic_fix = pygame.transform.scale(start_pic, (width, height))\nscreen = pygame.display.set_mode((width,\
    \ height))\npygame.display.toggle_fullscreen()\npygame.mouse.set_visible = False\n\
    ```\n\nPi-Motion 目前在 GitHub 上可通过 [https://github.com/nsbd2/Pi-Motion](https://github.com/nsbd2/Pi-Motion)\
    \ 获取\n\n![](img/59caadfa348382a5c408c25137901e27_102_0.png)\n"
