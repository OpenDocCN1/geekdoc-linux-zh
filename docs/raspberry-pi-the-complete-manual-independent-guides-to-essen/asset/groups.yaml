  - "[PAGE 39]\n\n# Projects\n\n# What you’ll need . . .\n\n+   - **Geany** – www.geany.org\n\
    +   - www.geany.org/Documentation/Manual\n\n# Get started with Geany\n\n# Get\
    \ started\nwith Geany\n\nProgram better on your Pi using one of the best text\
    \ editors and basic IDEs around: Geany\n\nWhen you come to do some real coding\
    \ on your Pi, it can be a bit confusing where you need to start. For everything\
    \ Python, the superb IDLE integrated development environment (IDE) is included,\
    \ and kids can get started using Scratch to make some basic games. Python isn’t\
    \ the only language to code in, though, and Scratch has its own way of programming\
    \ that can’t be used for real software. This is where the fantastic Geany comes\
    \ in – a text editor and IDE. As a very lightweight application, Geany is perfect\
    \ for the Pi. One of the main features it includes for programming is syntax highlighting\
    \ – where appropriate parts of the code are coloured differently; IDLE does this\
    \ for Python, and some other text editors include this feature, however, Geany\
    \ also allows for autocomplete of commands and can build software as well. It\
    \ supports a wide variety of languages, so whatever project you’re starting, you’ll\
    \ be able to use a familiar and comfortable environment to do it in.\n\n![](img/59caadfa348382a5c408c25137901e27_39_0.png)\n\
    \n# Install Geany\n\n+   01 Geany should be installed by default on Raspbian.\
    \ However, if it’s not there, it’s very simple to install otherwise. Open the\
    \ LX Terminal and then type:\n+   $ sudo apt-get install geany\n+   This will\
    \ go through the installation process; afterwards it will appear in the Programming\
    \ sub-menu.\n\n> Did you know . . .\n> \n> Geany is just one of many great development\
    \ environments available to you. Google ‘Linux IDE’ for more ideas."
  - '[PAGE 40]


    # ## Get started with Geany


    # ## Projects


    ![](img/59caadfa348382a5c408c25137901e27_40_0.png)


    # ### New file


    **02** To start a new file as is easy as pressing File followed by New, much like
    a word processor or text editor. It will create a blank file that you can immediately
    start typing into. Save it with the appropriate file type, such as .py, and Geany
    will recognise the code is Python and start marking it up.


    # ### Marking up


    **03** If you can''t save it as the relevant file type, you can also force Geany
    to show code with a specific markup. Go to Documents>Set Filetype and choose from
    one of the available options there. It supports at least 50 different languages.


    # ### Opening files


    **04** Opening a pre-existing file in Geany is easy -- by clicking File followed
    by Open (just like in a word processor). For now, we''ll test out some of Geany''s
    features by opening one of the pre-packaged Python files from the **python\_games**
    folder in the **pi** directory.


    # ### Navigating code


    **05** The left column of the IDE lists the line number of the important parts
    of your code. For Python, this includes the functions and variables that make
    up the program. You can also click on them individually to jump to where they
    first appear or are defined in the code.


    ![](img/59caadfa348382a5c408c25137901e27_40_1.png)


    # ### Advanced navigation


    **06** Your code can start looking a bit convoluted once you have multiple functions
    and imports dotted around. Geany is smart enough to recognise these and allows
    you to minimise loops, functions and a block of imports if it''s not necessary
    while checking over your code.


    ![](img/59caadfa348382a5c408c25137901e27_40_2.png)


    # ### Auto-complete


    **07** When you''re writing out your program, you may notice that Geany will try
    to guess the function or variable you''re trying to use. This can be useful if
    you''ve forgotten exactly what the variable is called, as you can use the arrow
    keys to move down a list of relevant commands for what you''ve just typed.


    # ### Testing your code


    **08** You can test your code by clicking on the gears in the top bar -- these
    allow you to run the code. Any errors will be shown in the following window, but
    if everything goes to plan, it should run without any issue. Exit the windows
    and click on the Run button again to stop the test.


    ![](img/59caadfa348382a5c408c25137901e27_40_3.png)


    # ### Compiling


    **09** Once you''ve finished your code, you can compile and build it using the
    built-in tools. Any errors that occur in the process will be documented, allowing
    you to sift through them one by one until you have everything working properly.'
  - "[PAGE 41]\n\n# Garn remote desktop access\n\n# Garn remote\n\ndesktop access\n\
    \nLearn how to get access to your Raspberry Pi\n\ndesktop without it being in\
    \ front of you . . .\n\nVNC (Virtual Network Computing) is a graphical desktop\
    \ access and\n\nshar ing system that allows a user to remotely control and use\
    \ the\n\ndesktop of another computer from their own system.\n\nIt's handy in many\
    \ ways: to give you control over a remote\n\nsystem; to help out another user\
    \ elsewhere; to allow a computer to\n\nremain powered on, but without the need\
    \ for a keyboard, mouse or\n\neven a monitor.\n\nIn our case, we aim to allow\
    \ access to the Raspberry Pi desktop\n\nwithout it being hooked up to the aforementioned\
    \ peripherals. This\n\nway, you can do everything you would normally do, but with\
    \ just\n\nthe power supply and network attached, thereby freeing up space\n\n\
    and saving extra expense. In real-world terms, this means you could\n\npotentially\
    \ access the Pi desktop via an Android tablet or phone!\n\n# What you'll need.\
    \ . . .\n\nTightVNC\n\nwww.tightvnc.com/en/relas2.7.php\n\n# Did you know. . .\
    \ .\n\nTightVNC/Viewer is a free\n\nresource for accessing VNC\n\nservers, like\
    \ the one we'll install\n\nin this tutorial\n\n![](img/59caadfa348382a5c408c25137901e27_41_0.png)\n\
    \n# Static IP address\n\n+   1.  The first step for us is to make\n+   sure that\
    \ the Raspberry Pi\n+   \n+   has a static IP address. Basically, an IP\n+   \n\
    +   address is a group of numbers that\n+   \n+   your network assigns to devices\
    \ in\n+   \n+   order to tell them apart. To set up a\n+   \n+   static IP address,\
    \ simply double-click\n+   \n+   LXTerminal and type the following\n+   \n+  \
    \ and then press Enter:\n+   \n+   `sudo nano /etc/network/`\n+   `interfaces`\n\
    \n# Static IP part 2\n\n+   2.  This file controls the IP\n+   addressing for\
    \ the Pi. You need\n+   \n+   to scroll down to the `iface eth0` line\n+   \n\
    +   and remove DHCP and replace it with\n+   \n+   static. Now, on the line directly\
    \ below,\n+   \n+   enter the IP address that you want\n+   \n+   your Pi to have,\
    \ along with the\n+   \n+   subnet mask and the gateway:\n+   \n+   ```\n+   address\
    \ 192.168.1.93\n+   \n+   netmask 255.255.255.0\n+   \n+   gateway 192.168.1.254\n\
    +   ```\n\n![](img/59caadfa348382a5c408c25137901e27_41_1.png)\n\n# Static IP part\
    \ 3\n\n+   3.  After you've entered those\n+   details, exit nano by pressing\n\
    +   \n+   Ctrl+Q, followed by Y to accept the\n+   \n+   changes, and then press\
    \ Enter a\n+   \n+   couple of times to get back to the\n+   \n+   command prompt\
    \ in the terminal. You\n+   \n+   can now either reboot your Pi, or type\n+  \
    \ \n+   the following into the terminal:\n+   \n+   `sudo /etc/init.d/network\
    \ stop`"
  - "[PAGE 42]\n\n# # Gain remote desktop access\n\n# ## Projects\n\n# ### Installing\
    \ VNC part 1\n\n+   04 Now we'll install VNC and ensure that it starts automatically\
    \ whenever the Pi is booted up. This used to be a bit annoying under older Raspbian\
    \ versions, as configuring services often had a nasty habit of breaking the system.\
    \ But no longer. Enter the following commands, pressing Enter after each one.\n\
    \n```\nsudo apt-get update\n\nsudo apt-get install tightvncserver\ntightvncserver\n\
    ```\n\n![](img/59caadfa348382a5c408c25137901e27_42_0.png)\n\n# ### Installing\
    \ VNC part 2\n\n+   05 When the packages have downloaded and installed, follow\
    \ the instructions on screen (see below) to set up a password and confirm it.\
    \ But answer 'N' to the view only option. This really is just a security feature\
    \ and since you are only accessing the Pi at home, it's not absolutely necessary\
    \ - it's still good practice, though.\n\n```\nYou will require a password\n\n\
    to access your\ndesktops\nPassword:\nVerify:\nWould you like to enter a\nview-only\n\
    password (y/n)? n\nNew 'X desktop is raspberryi:1\n```\n\n# ### Configuring VNC\
    \ server\n\n+   06 That's the VNC server installed, up and running. Now we need\
    \ to make sure it loads up as a service every time the Raspberry Pi reboots, so\
    \ you can access it even if the Pi undergoes a power cycle. To configure the Pi\
    \ to do this, type the following in the terminal and press Enter.\n\n```\nsudo\
    \ nano /etc/init.d/\ntightvncserver\n```\n\n# ### Configuring boot service\n\n\
    +   07 We'll be back in nano, and we'll need to enter some lines of commands in\
    \ order to allow the Raspberry Pi to activate the VNC server when it boots. In\
    \ the editor, type:\n\n```\n#!/bin/sh\n\n# /etc/init.d/tightvncserver\n# Set the\
    \ $VNCUSER variable to\nthe name of the user to start\ntightvncserver under\n\
    VNCUSER='pi'\ncase \"$1\" in\nstart)\n        su $VNCUSER -c '/usr/bin/\ntightvncserver\
    \ :1'\n        echo \"Starting TightVNC\n        server for $VNCUSER\" ;;\nstop)\n\
    \        pkill Xtightvnc\n        echo \"tightvncserver stopped\"\n        ;;\n\
    *)\n        echo \"Usage: /etc/init.d/\ntightvncserver {start|stop}\"\n      \
    \  ;;\nesac\nexit 0\n```\n\n# ### Reboot and ready to go\n\n+   08 Now press Ctrl+X,\
    \ then Y to save, followed by Enter a couple of times to get you back into the\
    \ terminal. What we need to do now is add the permissions of the script we've\
    \ just created so that it's executable and active. Do this by typing the following\
    \ commands into the terminal, ensuring that you press Enter after each one otherwise\
    \ it will not be registered\n\n```\nsudo chmod 755 /etc/init.d/\ntightvncserver\n\
    sudo update-rc.d tightvncserver\ndefaults\nsudo reboot\n```\n\n+   Once you have\
    \ completed these steps, the final thing that you will need to do is to unplug\
    \ the Raspberry Pi and locate a somewhere that has easy access to a network cable.\
    \ If you install the likes of TightVNC Viewer, or any other remote access software\
    \ (as long as it uses the Tight protocol) then you should be able to point the\
    \ client to the Pi address (192.168.1.91 or whatever the static IP address is\
    \ of the network that you wish to connect the device to) and have full access\
    \ to the Raspberry Pi.\n\n![](img/59caadfa348382a5c408c25137901e27_42_1.png)"
