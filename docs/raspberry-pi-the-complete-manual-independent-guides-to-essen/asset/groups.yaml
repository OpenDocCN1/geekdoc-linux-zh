    # Create a portable wireless access point


    With the help of a Wi-Fi adaptor, you can turn your Raspberry Pi into a wireless
    access point for other devices


    The Raspberry Pi''s portability makes it ideal for carrying around as an emergency
    wireless router or access point. Perfect if you''re visiting a hotel without the
    service, or less tech-adept friends and family. Here''s how to get it set up…


    # Did you know…


    Aside from XBMC setting up your Pi''s as a Wi-Fi access point is one of the most
    common projects to undertake


    ![](img/59caadfa348382a5c408c25137901e27_111_0.png)


    # Install Raspbian


    **01** For this project, we recommend using Raspbian to power our access point.
    To do this install the image on an SD card and go through the basic setup process,
    making sure to enable SSH during installation. You can also turn off the desktop
    during setup as well if you don''t plan to use it, though you might want to keep
    it for other projects.


    # Connect through SSH


    **02** Find the IP address of your Raspberry Pi by typing `ifconfig` into the
    command line, and make a note of it. Unplug your Raspberry Pi, then plug your
    wireless adaptor, and then plug the power back in. In a networked computer''s
    terminal, type:


    ```

    `ssh [user]@[IP address]`

    ```


    # Install DHCP


    **03** Install a DHCP server with:

    `sudo apt-get install hostapd isc-dhcp-server`

    Now we need to set it up. Edit the configuration file with:

    `sudo nano /etc/dhcp/dhcpd.conf`

    And start by putting a # in front of the two option domain-name entries, then
    remove the fi in front of ‘authoritative;’

