    ```\n\nThen add to the end of /etc/network/interfaces:\n\n```\nUp iptables-restore\
    \ < /etc/iptables.ipv4.nat\n```\n\n#### Wi-Fi final\n\n**17** Finally, set it\
    \ up as a daemon so it runs at boot with the following commands:\n\n```\nsudo\
    \ service hostapd start\nsudo service isc-dhcp-server start\nsudo update-rc.d\
    \ hostapd enable\nsudo update-rc.d isc-dhcp-server enable\n```\n\nAnd the wireless\
    \ access point part will be finished.\n\n#### Install Tor\n\n**18** After a reboot,\
    \ we now need to install Tor. Do this simply with:\n\n```\n$ sudo apt-get install\
    \ tor\n```\n\nOnce it’s installed, you need to edit the Tor config file with:\n\
    \n```\n$ sudo nano /etc/tor/torrc\n```\n\nFollow the next step to add all the\
    \ necessary information to it.\n\n![](img/59caadfa348382a5c408c25137901e27_118_0.png)\n\
    \n#### Tor configure\n\n**19** Put this below the FAQ comment:\n\n```\nLog notice\
    \ file /var/log/tor/notices.log\nVirtualAddrNetwork 10.192.0.0/10\nAutomapHostsSuffixes\
    \ .onion, .exit\nAutomapHostsOnResolve 1\nTransPort 9040\nTransListenAddress 192.168.42.1\n\
    DNSPort 53\nDNSListenAddress 192.168.42.1\n```\n\n#### Table flush\n\n**20** Now\
    \ we need to flush the current IP tables so that we can get the routing to go\
    \ through.\n\n```\n$ sudo iptables -F\n$ sudo iptables -t nat -F\n```\n\nIf you\
    \ want to keep SSH open to connect remotely, you’ll need to make an exception\
    \ for that with:\n\n```\n$ sudo iptables -t nat -A PREROUTING -i wlan0 -p tcp\
    \ -dport 22 -j REDIRECT --to-port 22\n```\n\n#### Reroute\n\n**21** Route all\
    \ DNS traffic first, using the following commands:\n\n```\n$ sudo iptables -t\
    \ nat -A PREROUTING -i wlan0 -p udp -dport 53 -j REDIRECT --to-port 53\n```\n\n\
    And then route any TCP traffic with:\n\n```\n$ sudo iptables -t nat -A PREROUTING\
    \ -i wlan0 -p tcp --syn -j REDIRECT --to-ports 9040\n```\n\n![](img/59caadfa348382a5c408c25137901e27_118_1.png)\n\
    \n#### Check and save\n\n**22** You can check the table setup with the following\
    \ terminal command. You’ll need to save it if it works so read on:\n\n```\n$ sudo\
    \ iptables -t nat -L\n```\n\nIf you’re happy with it, save it to the NAT file\
    \ like before with:\n\n```\n$ sudo sh -c \"iptables-save > /etc/iptables.ipv4.nat\"\
    \n```\n\n#### Logging\n\n**23** We should create a log file. This is important\
    \ in case you use these three commands.\n\n```\n$ sudo touch /var/log/tor/notices.log\n\
    $ sudo chown debian-tor /var/log/notices.log\n$ sudo chmod 644 /var/log/tor/notices.log\n\
    ```\n\nYou can also check it with:\n\n```\n$ ls -l /var/log/tor\n```\n\n#### Secure\
    \ the router\n\n**24** Finally, we can activate the Tor service so that we can\
    \ start using the access point securely with:\n\n```\n$ sudo service tor start\n\
    ```\n\nYou can check that it’s you with:\n\n```\n$ sudo service tor status\n```\n"
  mdcn: "\n\n## 项目\n\n### 构建洋葱 Pi 并私密浏览\n\n#### 你需要准备的材料……\n\n- 树莓派\n  - http://raspberry-ai.org/downloads\n\
