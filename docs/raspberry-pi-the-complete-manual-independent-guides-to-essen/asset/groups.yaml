    \ popular today\n\nHere, we will create a version of the classic Snake game where\
    \ you move the snake around the Scratch stage using the arrow keys. You control\
    \ the head of the snake and must avoid a collision with either the body of the\
    \ snake or the edge of the stage.\n\nThe snake body grows longer each time you\
    \ eat an egg. You get points added to your score for eating good yellow eggs and\
    \ lose points for eating bad black eggs. There are also bonus sprites to eat for\
    \ extra points.\n\nBy following this tutorial you will learn to create your own\
    \ simple sprite graphics, send and receive broadcast events, use a list variable\
    \ to store data, play sound effects, generate random numbers and use sensing commands\
    \ to detect when a sprite is touching something.\n\n![](img/59caadfa348382a5c408c25137901e27_59_0.png)\n\
    \n![](img/59caadfa348382a5c408c25137901e27_59_0.png)\n\n![](img/59caadfa348382a5c408c25137901e27_59_0.png)\n\
