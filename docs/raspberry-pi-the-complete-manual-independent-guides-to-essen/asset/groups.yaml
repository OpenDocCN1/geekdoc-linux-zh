  md: "\n## Projects\n\n### Create a portable wireless access point\n\n#### What you'll\
    \ need…\n\n- Raspbian\n  - www.raspberrypi.org/downloads\n- Wi-Fi adaptor\n\n\
    #### Create a portable wireless access point\n\nWith the help of a Wi-Fi adaptor,\
    \ you can turn your Raspberry Pi into a wireless access point for other devices.\n\
    \nThe Raspberry Pi's portability makes it ideal for carrying around as an emergency\
    \ wireless router or access point. Perfect if you're visiting a hotel without\
    \ the service, or less tech-adept friends and family. Here's how to get it set\
    \ up…\n\n#### Did you know…\n\nAside from XBMC, setting up your Pi as a Wi-Fi\
    \ access point is one of the most common projects to undertake.\n\n![](img/59caadfa348382a5c408c25137901e27_111_0.png)\n\
    \n#### Install Raspbian\n\n**01** For this project, we recommend using Raspbian\
    \ to power our access point. To do this, install the image on an SD card and go\
    \ through the basic setup process, making sure to enable SSH during installation.\
    \ You can also turn off the desktop during setup as well if you don't plan to\
    \ use it, though you might want to keep it for other projects.\n\n#### Connect\
    \ through SSH\n\n**02** Find the IP address of your Raspberry Pi by typing `ifconfig`\
    \ into the command line, and make a note of it. Unplug your Raspberry Pi, then\
    \ plug your wireless adaptor in, and then plug the power back in. In a networked\
    \ computer's terminal, type:\n\n```bash\nssh [user]@[IP address]\n```\n\n####\
    \ Install DHCP\n\n**03** Install a DHCP server with:\n`sudo apt-get install hostapd\
    \ isc-dhcp-server`\n\nNow we need to set it up. Edit the configuration file with:\n\
    `sudo nano /etc/dhcp/dhcpd.conf`\n\nAnd start by putting a # in front of the two\
    \ `option domain-name` entries, then remove the `fi` in front of `‘authoritative;’`\
    \ seven lines down.\n\n![](img/59caadfa348382a5c408c25137901e27_112_0.png)\n\n\
    #### Server address\n\n**04** At the end of the configuration file, add these\
    \ lines:\n\n- `sudo nano /etc/network/interfaces`\n- 保存并退出，然后输入以下命令：\n  - `sudo\
    \ ifconfig wlan0`\n\n#### Disable Wi-Fi\n\n**05** Edit the server name with `sudo\
    \ nano /etc/default/dhcpd-server` and set `INTERFACES` to `wlan0` and save.\n\n\
    #### Enable access\n\n**06** After the line `#lo-hotplug` in `/etc/network/interfaces`,\
    \ add the following:\n\n- `iface wlan0 inet static`\n- `address 192.168.42.1`\n\
    - `netmask 255.255.255.0`\n\nSave and exit. Set `wlan0`'s address with `sudo ifconfig\
    \ wlan0 192.168.42.1`\n\nNow create a new file to use to start creating the wireless\
    \ network:\n\n- `sudo nano /etc/hostapd/hostapd.conf`\n\n#### Wireless networking\n\
    \n**07** Create your wireless network with the following code:\n\n```text\ninterface=wlan0\n\
    driver=rtl871xdrv\nssid=CissCiss point me\nchannel=1\nmacaddr_acl=0\nauth_algs=1\n\
    ignore_broadcast_ssid=0\nwpa=2\nwpapassphrase=[Password]\nwpa_key_mgmt=WPA-PSK\n\
    wpa_pairwise=TKIP\neap_identity=%copp\nwpa_rsn_pairwise=TKIP\n```\n\nSave and\
    \ exit. Now edit `hostapd` to point to the new file with `sudo nano /etc/default/hostapd`.\n\
    \n#### Network addressing\n\n**08** Run `sudo nano /etc/sysctl.conf`\n\nAdd this,\
    \ `ipv4_ip_forward=1`, to the bottom of the file.\n\nSave this, then run `sudo\
    \ sh -c \"echo 1 > /proc/sys/net/ipv4/ip_forward\"`\n\nRun the following three\
    \ commands to make sure the internet is forwarded correctly.\n\n- `sudo iptables\
    \ -t nat -A POSTROUTING -o eth0 -j MASQUERADE`\n- `sudo iptables -A FORWARD -i\
    \ eth0 -o wlan0 -m state --state RELATED,ESTABLISHED -j ACCEPT`\n- `sudo iptables\
    \ -A FORWARD -i wlan0 -o eth0 -j ACCEPT`\n\n#### Finish up\n\n**09** So that this\
    \ works after a reboot, type:\n\n`sudo sh -c 'iptables-save > /etc/iptables.ipv4nat'`\n\
    \nThen add `up iptables-restore < /etc/iptables.ipv4nat` to the end of `eth` in\
    \ `/etc/network/interfaces`.\n\nFinally, set it up as a daemon with:\n\n- `sudo\
    \ service hostapd start`\n- `sudo service isc-dhcp-server start`\n- `sudo update-rc.d\
    \ hostapd enable`\n- `sudo update-rc.d isc-dhcp-server enable`\n\n![](img/59caadfa348382a5c408c25137901e27_112_1.png)\n\
    \n## Projects\n\n### Build a security camera\n\n#### What you'll need...\n\n-\
    \ A router or switch\n- A Linux-compatible webcam\n- Raspbian [www.raspberrypi.org/downloads](http://www.raspberrypi.org/downloads)\n\
    - Powered USB hub\n\n#### Build a security camera\n\nWant to keep an eye on something\
    \ from the comfort of your web browser? All you need is a Pi and a webcam!\n\n\
    This article will teach you how to use the MJPG-streamer software to stream video\
    \ straight from a webcam to your web browser. You could record the stream, and\
    \ also display multiple streams from multiple Raspberry Pis on one page. The streams\
    \ can also be viewed from mobile devices and tablets.\n\n#### Did you know...\n\
    \n> Most modern webcams are compatible with the Raspberry Pi, but check in a [support\
    \ forum](https://forum.raspberrypi.com) before you buy.\n\n#### Check compatibility\n\
    \nMost USB cameras should work with your Pi out of the box, but it’s worth checking\
    \ compatibility first.\n\n![](img/59caadfa348382a5c408c25137901e27_113_0.png)\n\
    \n#### Extra power\n\nDepending on your webcam, you may need a powered USB hub\
    \ to get it working.\n\n#### Network investigation\n\nThe first job we need to\
    \ do is investigate the network your Raspberry Pi is on, so we can assign it a\
    \ static IP address. That way, we’ll always know where it is on the network so\
    \ we can access with ease.\n\n```bash\npi@raspberrypi ~ $ ip addr show dev eth0\
    \ | grep inet\n        inet 172.17.173.94/24 brd 172.17.173.255 scope global eth0\n\
    pi@raspberrypi ~ $ ip route | grep default\ndefault via 172.17.173.1 dev eth0\n\
    pi@raspberrypi ~ $ cat /etc/resolv.conf\nnameserver 172.17.173.1\n```\n\n####\
    \ Assign a static IP address\n\nNow that we have the network configuration, we\
    \ can assign a static IP address. Open `/etc/network/interfaces` in an editor\
    \ such as nano, and change the line:\n\n`iface eth0 inet dhcp`\n\nto a configuration\
    \ similar to our expert's. Reboot to load the new configuration.\n\n```text\n\
    iface eth0 inet static\naddress   172.17.173.94\nnetmask   255.255.255.0\nnetwork\
    \   172.17.173.0\nbroadcast 172.17.173.255\n```\n\n![](img/59caadfa348382a5c408c25137901e27_114_0.png)\n\
    \n#### Installing the software\n\n**03** Log into the Raspberry Pi system with\
    \ the username 'pi' and the password 'raspberry'. The MJPG-streamer software isn't\
    \ packaged for the Raspberry Pi, so we'll need to compile it ourselves. Update\
    \ the package index with `sudo apt-get update`. We need to install Subversion,\
    \ which we'll use to download source code. We'll also need libpng and imagemagick,\
    \ both of which are required by MJPG-streamer. Install these with:\n\n`sudo apt-get\
    \ install subversion libjpeg-dev imagemagick`\n\n#### Compile MJPG-streamer\n\n\
    **04** Download and compile MJPG-streamer as shown below:\n\n```bash\npi@raspberrypi\
    \ ~ $ svn checkout svn://svn.code-sf.net/mjpg-streamer-code /code/mjpg-streamer-code\n\
    pi@raspberrypi ~ $ cd mjpg-streamer-code/mjpg-streamer\npi@raspberrypi ~ $ make\
    \ clean all\n```\n\n#### Testing it out\n\n**05** To start MJPG-streamer, export\
    \ `LD_LIBRARY_PATH=:/mjpg_streamer-* \"input_uvc.so\" \"output_file.so -w /www/`\n\
    \nYou have to export the library path variable to the current directory so that\
    \ the various input and output plug-ins can be used. Type your Raspberry Pi's\
    \ IP address followed by :8000 into a browser and click the Stream tab. If the\
    \ Stream tab doesn't work, try the example that uses JavaScript, that should work\
    \ on most browsers, including Android.\n\n#### Start MJPG-streamer at boot\n\n\
    **06** Edit the `/etc/rc.local` file (you'll need to use sudo) to include the\
    \ following lines, ensuring that it still ends with `exit 0`.\n\n```bash\nexport\
    \ STREAMER_PATH=/home/pi/mjpg-streamer-code/mjpg-streamer\nexport LD_LIBRARY=STREAMER_PATH\n\
    $STREAMER_PATH/mjpg_streamer -i \"input_uvc.so\" -o \"output_file.so -w $STREAMER_PATH/www/\
    \ &\"\n```\n\nReboot the Pi to check that it comes back up happily and starts\
    \ the stream.\n\n#### Extensions and improvements\n\n**09** This example setup\
    \ is very basic and has a few flaws. There is no authentication or SSL encryption,\
    \ which means the streams are insecure and should not be shared over the internet.\
    \ The HTTP module that comes with MJPG-streamer is quite simple, so you could\
    \ get SSL by using a reverse proxy, such as Pound. You'd be able to SSL for each\
    \ Pi you have with a single Pound instance and access the different Pis by having\
    \ something like `/stream, stream2` in the URL.\n\n> \"Use the MJPG-streamer software\
    \ to stream video straight from a webcam to your web browser\"\n\n#### Recording\
    \ the stream\n\n**07** You can easily download a motion JPEG stream and convert\
    \ it to a useful format using VLC:\n\n`cvlc stream://172.17.173.94:8000 0/actions?stream=1-sout\
    \ #file=/m4:stream.mp4`\n\nAlternatively, you can just download the stream URL\
    \ with wget like so:\n\n`wget stream://172.17.173.94:8000/0/actions?stream`\n\n\
    #### Multiple streams at once\n\n**08** Here is an example of how to put multiple\
    \ streams on a single webpage. These streams could come from a number of different\
    \ Raspberry Pis all over the house.\n\n```html\n<HTML>\n<TABLE BORDER=\"1\">\n\
    <TR>\n<TD><IMG SRC=\"172.17.173.94/8000/actions?stream=2/\">\n</TD>\n<TD><IMG\
    \ SRC=\"172.17.173.94:8000/actions?stream=1/\">\n</TD>\n</TR>\n</TABLE>\n</HTML>\n\
    ```\n"
  mdcn: "\n\n## 项目\n\n### 创建一个便携式无线接入点\n\n#### 你需要准备……\n\n- Raspbian\n  - www.raspberrypi.org/downloads\n\
    - Wi-Fi 适配器\n\n#### 创建便携式无线接入点\n\n借助 Wi-Fi 适配器，你可以将你的树莓派（Raspberry Pi）变成其他设备的无线接入点。\n\
    \n树莓派的便携性使其非常适合作为紧急无线路由器或接入点随身携带。如果你住在没有无线服务的酒店，或者陪伴不太精通科技的朋友和家人时，它再合适不过了。以下是设置方法……\n\
    \n#### 你知道吗……\n\n除了 XBMC，将树莓派设置为 Wi-Fi 接入点是最常见的操作项目之一。\n\n![](img/59caadfa348382a5c408c25137901e27_111_0.png)\n\
    \n#### 安装 Raspbian\n\n**01** 对于这个项目，我们建议使用 Raspbian 系统来驱动我们的接入点。为此，请将系统镜像安装到 SD\
    \ 卡上，并完成基本设置流程，确保在安装过程中启用 SSH。如果你不打算使用桌面环境，也可以在设置期间将其关闭，不过你可能希望保留它以便用于其他项目。\n\n\
    #### 通过 SSH 连接\n\n**02** 在命令行中输入 `ifconfig` 以查找树莓派的 IP 地址，并记录下来。拔掉树莓派的电源，然后插入无线适配器，最后重新连接电源。在另一台联网电脑的终端中输入：\n\
    \n```bash\nssh [user]@[IP address]\n```\n\n#### 安装 DHCP\n\n**03** 使用以下命令安装 DHCP\
    \ 服务器：\n`sudo apt-get install hostapd isc-dhcp-server`\n\n现在我们需要对其进行配置。使用以下命令编辑配置文件：\n\
    `sudo nano /etc/dhcp/dhcpd.conf`\n\n首先，在两个 `option domain-name` 项前加上 #，然后删除下面七行中\
    \ `‘authoritative;’` 前面的 `fi`。\n\n![](img/59caadfa348382a5c408c25137901e27_112_0.png)\n\
    \n#### 服务器地址\n\n**04** 在配置文件的末尾，添加以下内容：\n\n- `sudo nano /etc/network/interfaces`\n\
    - 保存并退出，然后输入以下命令：\n  - `sudo ifconfig wlan0`\n\n#### 禁用 Wi-Fi\n\n**05** 使用 `sudo\
    \ nano /etc/default/dhcpd-server` 编辑服务器名称，将 `INTERFACES` 设置为 `wlan0` 并保存。\n\n\
    #### 启用访问\n\n**06** 在 `/etc/network/interfaces` 文件中 `#lo-hotplug` 这一行之后，添加以下内容：\n\
    \n- `iface wlan0 inet static`\n- `address 192.168.42.1`\n- `netmask 255.255.255.0`\n\
    \n保存并退出。使用 `sudo ifconfig wlan0 192.168.42.1` 设置 `wlan0` 的地址。\n\n现在创建一个新的文件，用于开始创建无线网络：\n\
    \n- `sudo nano /etc/hostapd/hostapd.conf`\n\n#### 无线组网\n\n**07** 使用以下代码创建你的无线网络：\n\
    \n```text\ninterface=wlan0\ndriver=rtl871xdrv\nssid=CissCiss point me\nchannel=1\n\
    macaddr_acl=0\nauth_algs=1\nignore_broadcast_ssid=0\nwpa=2\nwpapassphrase=[Password]\n\
    wpa_key_mgmt=WPA-PSK\nwpa_pairwise=TKIP\neap_identity=%copp\nwpa_rsn_pairwise=TKIP\n\
    ```\n\n保存并退出。现在编辑 `hostapd`，使用 `sudo nano /etc/default/hostapd` 指向新文件。\n\n####\
    \ 网络寻址\n\n**08** 运行 `sudo nano /etc/sysctl.conf`\n\n在文件底部添加这一行：`ipv4_ip_forward=1`。\n\
    \n保存后，运行 `sudo sh -c \"echo 1 > /proc/sys/net/ipv4/ip_forward\"`\n\n运行以下三条命令，以确保互联网流量被正确转发。\n\
    \n- `sudo iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE`\n- `sudo iptables\
    \ -A FORWARD -i eth0 -o wlan0 -m state --state RELATED,ESTABLISHED -j ACCEPT`\n\
    - `sudo iptables -A FORWARD -i wlan0 -o eth0 -j ACCEPT`\n\n#### 完成设置\n\n**09**\
    \ 为了让这些设置重启后仍然生效，输入：\n\n`sudo sh -c 'iptables-save > /etc/iptables.ipv4nat'`\n\
    \n然后在 `/etc/network/interfaces` 中 `eth` 部分的末尾添加 `up iptables-restore < /etc/iptables.ipv4nat`。\n\
    \n最后，将其设置为守护进程：\n\n- `sudo service hostapd start`\n- `sudo service isc-dhcp-server\
    \ start`\n- `sudo update-rc.d hostapd enable`\n- `sudo update-rc.d isc-dhcp-server\
    \ enable`\n\n![](img/59caadfa348382a5c408c25137901e27_112_1.png)\n\n## 项目\n\n\
    ### 构建安全摄像头\n\n#### 你需要准备……\n\n- 路由器或交换机\n- 兼容 Linux 的网络摄像头\n- Raspbian [www.raspberrypi.org/downloads](http://www.raspberrypi.org/downloads)\n\
    - 带电源的 USB 集线器\n\n#### 构建安全摄像头\n\n想坐在舒适的网络浏览器前监视某样东西吗？你只需要一个树莓派和一个网络摄像头！\n\n本文将教你如何使用\
    \ MJPG-streamer 软件将视频直接从网络摄像头传输到你的网络浏览器中。你可以录制视频流，也可以在同一个页面上显示来自多个树莓派的多个视频流。这些视频流也可以在移动设备和平板电脑上观看。\n\
    \n#### 你知道吗……\n\n> 大多数现代网络摄像头都与树莓派兼容，但购买前最好先在 [支持论坛](https://forum.raspberrypi.com)\
    \ 中确认一下。\n\n#### 检查兼容性\n\n大多数 USB 摄像头应该可以直接在你的树莓派上使用，但先检查兼容性是值得的。\n\n![](img/59caadfa348382a5c408c25137901e27_113_0.png)\n\
    \n#### 额外供电\n\n根据你的网络摄像头类型，你可能需要一个带电源的 USB 集线器才能让它正常工作。\n\n#### 网络调查\n\n我们需要做的第一项工作是调查树莓派所在网络的状况，以便为其分配一个静态\
    \ IP 地址。这样，我们就始终知道它在网络中的位置，从而轻松访问。\n\n```bash\npi@raspberrypi ~ $ ip addr show\
    \ dev eth0 | grep inet\n        inet 172.17.173.94/24 brd 172.17.173.255 scope\
    \ global eth0\npi@raspberrypi ~ $ ip route | grep default\ndefault via 172.17.173.1\
    \ dev eth0\npi@raspberrypi ~ $ cat /etc/resolv.conf\nnameserver 172.17.173.1\n\
    ```\n\n#### 分配静态 IP 地址\n\n既然我们已经有了网络配置，就可以分配一个静态 IP 地址了。在 nano 等编辑器中打开 `/etc/network/interfaces`，并将行：\n\
    \n`iface eth0 inet dhcp`\n\n更改为与专家配置类似的设置。重启以加载新配置。\n\n```text\niface eth0 inet\
    \ static\naddress   172.17.173.94\nnetmask   255.255.255.0\nnetwork   172.17.173.0\n\
    broadcast 172.17.173.255\n```\n\n![](img/59caadfa348382a5c408c25137901e27_114_0.png)\n\
    \n#### 安装软件\n\n**03** 使用用户名 'pi' 和密码 'raspberry' 登录树莓派系统。MJPG-streamer 软件没有针对树莓派进行打包，因此我们需要自己编译它。使用\
    \ `sudo apt-get update` 更新软件包索引。我们需要安装 Subversion，我们将用它来下载源代码。我们还需要 libpng 和 imagemagick，两者都是\
    \ MJPG-streamer 的必需项。使用以下命令安装它们：\n\n`sudo apt-get install subversion libjpeg-dev\
    \ imagemagick`\n\n#### 编译 MJPG-streamer\n\n**04** 如下图所示，下载并编译 MJPG-streamer：\n\
    \n```bash\npi@raspberrypi ~ $ svn checkout svn://svn.code-sf.net/mjpg-streamer-code\
    \ /code/mjpg-streamer-code\npi@raspberrypi ~ $ cd mjpg-streamer-code/mjpg-streamer\n\
    pi@raspberrypi ~ $ make clean all\n```\n\n#### 试用\n\n**05** 要启动 MJPG-streamer，请导出\
    \ `LD_LIBRARY_PATH=:/mjpg_streamer-* \"input_uvc.so\" \"output_file.so -w /www/`\n\
    \n你必须将库路径变量导出到当前目录，以便可以使用各种输入和输出插件。在浏览器中输入树莓派的 IP 地址后跟 :8000，然后单击“Stream”选项卡。如果“Stream”选项卡不起作用，请尝试使用\
    \ JavaScript 的示例，那在大多数浏览器中（包括 Android）应该都能工作。\n\n#### 开机启动 MJPG-streamer\n\n**06**\
    \ 编辑 `/etc/rc.local` 文件（你需要使用 sudo），加入以下行，并确保文件仍以 `exit 0` 结尾。\n\n```bash\nexport\
    \ STREAMER_PATH=/home/pi/mjpg-streamer-code/mjpg-streamer\nexport LD_LIBRARY=STREAMER_PATH\n\
    $STREAMER_PATH/mjpg_streamer -i \"input_uvc.so\" -o \"output_file.so -w $STREAMER_PATH/www/\
    \ &\"\n```\n\n重启树莓派，检查其是否能正常启动并开始视频流。\n\n#### 扩展与改进\n\n**09** 此示例设置非常基础，存在一些缺陷。没有身份验证或\
    \ SSL 加密，这意味着视频流是不安全的，不应在互联网上共享。MJPG-streamer 自带的 HTTP 模块相当简单，因此你可以使用反向代理（如 Pound）来获取\
    \ SSL。你可以通过单个 Pound 实例为每个树莓派提供 SSL，并在 URL 中使用类似 `/stream, stream2` 的方式来访问不同的树莓派。\n\
    \n> “使用 MJPG-streamer 软件将视频直接从网络摄像头传输到你的网络浏览器”\n\n#### 录制视频流\n\n**07** 你可以轻松地使用\
    \ VLC 下载运动 JPEG（motion JPEG）视频流并将其转换为有用的格式：\n\n`cvlc stream://172.17.173.94:8000\
    \ 0/actions?stream=1-sout #file=/m4:stream.mp4`\n\n或者，你可以像这样使用 wget 直接下载视频流 URL：\n\
    \n`wget stream://172.17.173.94:8000/0/actions?stream`\n\n#### 同时显示多个视频流\n\n**08**\
    \ 这里展示了如何在单个网页上放置多个视频流。这些视频流可以来自房子里各处不同的树莓派。\n\n```html\n<HTML>\n<TABLE BORDER=\"\
    1\">\n<TR>\n<TD><IMG SRC=\"172.17.173.94/8000/actions?stream=2/\">\n</TD>\n<TD><IMG\
    \ SRC=\"172.17.173.94:8000/actions?stream=1/\">\n</TD>\n</TR>\n</TABLE>\n</HTML>\n\
    ```\n\n"
