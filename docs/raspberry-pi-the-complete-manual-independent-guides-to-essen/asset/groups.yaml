    # Make music with Sonic Pi


    # Make music


    Program your own melodies using Sonic Pi and create musical cues or robot beeps


    # What you''ll need...


    +   Portable speakers

    +   or headphones

    +   Sonic Pi

    +   www.cl.cam.ac.uk/projects/raspberrypi/sonicpi/teaching.html


    # Did you know...


    Sonic Pi is installed by default on the latest versions of the Raspbian operating
    system. If it''s missing, follow step one!


    One of the major features of Scratch is its ability to teach the fundamentals
    of coding to kids and people with no computing background. For kids, it''s especially
    appealing due to the way it allows them to create videogames to interact with
    as part of their learning. In this kind of vein then, Sonic Pi teaches people
    to code using music. With a simple language that utilises basic logic steps but
    in a more advanced way than Scratch, it can either be used as a next step for
    avid coders, or as a way to create music for an Internet of Things or a robot.


    > “We can start making more complex melodies by using more of Sonic Pi’s functions”


    ![](img/59caadfa348382a5c408c25137901e27_71_0.png)


    Below Sonic Pi is a great way to learn basic coding principles and have fun


    ![](img/59caadfa348382a5c408c25137901e27_71_1.png)


    # Getting Sonic Pi


    **01** If you’ve installed the latest version of Raspbian, Sonic Pi will be included
    by default. If you’re still using a slightly older version, then you’ll need to
    install it via the repos. Do this with:


    ```

    $ sudo apt-get install sonic-pi

    ```'
  - "[PAGE 72]\n\n# Make music with Sonic Pi\n\n# Projects\n\n# Starting with Sonic\
    \ Pi\n\n**02** Sonic Pi is located in the Education category in the menus. Open\
    \ it up and you'll be presented with something that looks like an IDE. The pane\
    \ on the left allows you to enter the code for your project, with proper syntax\
    \ highlighting for its own style of language. When running, an info pane details\
    \ exactly what's being played via Sonic Pi -- and any errors are listed in their\
    \ own pane as well, for reference.\n\n# Set the beat\n\n**04** For any piece of\
    \ music, you'll want to set the tempo. We can start by putting `1.itb_tempo 200`\
    \ at the start of our code. We can test it out by creating a string of midi notes\
    \ using `play_pattern`:\n`play_pattern`\n`[40,25,45,25,50,50]`\n\nThis will play,\
    \ pretty, bell notes at those tones at the tempo we've set. You can create longer\
    \ and shorter strings, and also change the way they play.\n\n# Your first note\n\
    \n**03** Our first thing to try on Sonic Pi is simply being able to play a note.\
    \ Sonic Pi has a few defaults preset, so we can get started with:\n`play 50`\n\
    Press the Play button and the output window will show you what's being played.\
    \ The pretty, bell sound is the default tone for Sonic Pi's output, and 50 determines\
    \ the pitch and tone of the sound.\n\n![](img/59caadfa348382a5c408c25137901e27_72_0.png)\n\
    \n![](img/59caadfa348382a5c408c25137901e27_72_1.png)\n\n# Advance your melody\n\
    \n**05** We can start making more complex melodies by using more of Sonic Pi's\
    \ functions. You can change the note type by using `with_synth`, reverse a pattern,\
    \ and even create a finite loop with the x.times function, to end and signify\
    \ the start and end of the loop. Everything is played in sequence before repeating,\
    \ much like an if or while loop in normal code.\n\n# Full code listing\n\n```\n\
    `with_tempo   200\nplay_pattern  [40,25,45,25,50,50]\n2.times do\n  with_synth\
    \ \"beep\"\n    play_pattern  [40,25,45,25,50,50]\n    play_pattern  [40,25,45,25,50,50].reverse\n\
    \  end\nplay_pad \"saws\", 3\nin_thread do\n  with_synth \"fm\"\n    6.times do\n\
    \      if rand < 0.5\n        play 30\n      else\n        play 50\n      end\n\
    \      sleep 2\n    end\n  end\n2.times do\n  play_synth \"pretty_bell\"\n   \
    \ play_pattern  [40,25,45,25,50,50]\n    play_pattern  [40,25,45,25,50,50].reverse\n\
    \  end`\n```\n\n# Playing a concert\n\n**06** Using the `in_thread` function,\
    \ we are able to create another thread for the Sonic Pi instance, and have several\
    \ lines of musical code play at once instead of in sequence.\nWe have made it\
    \ create a series of notes in a random sequence, and have them play alongside\
    \ extra notes created by the position and velocity of the mouse using the `play_pad`\
    \ function."
  - "[PAGE 73]\n\n# # Projects\n\n# # What you'll need...\n\n+   **Breadboard:**\n\
    +   www.pctric-pt.co.uk/half-size-breadboard\n+   \n+   **3mm LED light:**\n+\
    \   www.ultralife.co.uk/led-product-category/basic-leds-3-5-8-10mm.html\n+   \n\
    +   **Wires:**\n+   www.pctric.co.uk/product/breadboard-wires\n+   \n+   **270-ohm\
    \ resistor:**\n+   http://goo.gl/xDwfD#p991\n\n![](img/59caadfa348382a5c408c25137901e27_73_0.png)\n\
    \n*Fig 1:* All the items you will need to get going: adjusting an LED using PWM.\
    \ The wires should have a male and female ends.\n\n![](img/59caadfa348382a5c408c25137901e27_73_1.png)\n\
    \n*Fig 2:* Place the female end onto the Pi, noting pin number 1 being identified\
    \ by the small Pi. The blue wire is ground.\n\n![](img/59caadfa348382a5c408c25137901e27_73_2.png)\n\
    \n*Fig 3:* Once everything is connected up, plug in your USB power cable.\n\n\
    ![](img/59caadfa348382a5c408c25137901e27_73_3.png)\n\n*Fig 4:* Switch the power\
    \ on. The LED will light up. If it's dim, use a lower rated resistor.\n\n# # Control\
    \ an LED using GPIO\n\nAn introduction into using an external output, such as\
    \ an LED, on the Pi\n\nAfter you have fired up your Pi, maybe installed XBMC and\
    \ had a play around with streaming, you might be ready for your next challenge.\
    \ One route to go down is to find interesting uses for one of the many desktop\
    \ OSes available for the little computer, perhaps using it as a web server, an\
    \ NAS or retro arcade console. This is all great fun, but an often-overlooked\
    \ feature of the Pi is its hardware pins. If you've never done any electronics\
    \ before, then the Pi is a great place to start. Or maybe you have used a programmable\
    \ microcontroller such as Arduino in the past; the Pi, with its increased CPU\
    \ and RAM over the Arduino, opens up many more possibilities for fun projects.\n\
    \nThe Raspberry Pi features a single PWM (pulse width modulation) output pin,\
    \ along with a series of GPIO (General Purpose Input/Output) pins. These enable\
    \ electronic hardware such as buzzers, lights and switches to be controlled via\
    \ the Pi. For people who are used to either just 'using' a computer, or only programming\
    \ software that only acts on the machine itself, controlling a real physical item\
    \ such as a light can be a revelation.\n\nThis tutorial will assume no prior knowledge\
    \ of electronics or programming, and will take you through the steps needed to\
    \ control an LED using the Raspberry Pi, from setting it up to coding a simple\
    \ application.\n\n![](img/59caadfa348382a5c408c25137901e27_73_4.png)\n\n> > “We'll\
    \ take you through the steps needed to control an LED using the Pi, from setting\
    \ it up to coding”"
  - '[PAGE 74]


    # Control an LED using GPIO


    **Projects**


    ![](img/59caadfa348382a5c408c25137901e27_74_0.png)


    **Breadboard**

    The breadboard, or prototype board, provides an easy-to-use and selfless environment
    for creating and changing your development circuits.


    **Breadboard wire**

    A must for any budding electrical engineer, these make-to-make and male-to-female
    wires make for fast and easy circuit building.


    **GPIO header**

    This provides a mechanism for both gathering input and providing output to electrical
    circuits, enabling reactive program design.


    **Coloured LED**

    Different coloured LEDs are a great way to physically see which part of the software
    is running and help you understand the program flow.


    # The Pi''s pins


    01

    Before we dive into writing code, let''s take a look at the layout of the pins
    on the Pi. If you have your Pi in a case, take it out and place it in front of
    you with the USB ports on the right. Over the next few steps we''ll look at some
    of the uses you''ll encounter when using the GPIO port.


    Pi revision 1 or 2?

    02

    Depending on when you purchased your Pi, you may have a revision 1 or revision
    2 model. The GPIO layout is slightly different for each, although they do have
    the same functionality. Here we have a revision 1; revision 25 became available
    towards the end of 2012.


    # Pin numbers


    03

    If you take a look at the top right of the board you''ll see a small wire label,
    P1: This is pin 1 and above it is pin 2. To the right of pin 1 is pin 3, and above
    3 is 4. This pattern continues until you get to pin 26 at the end. As you''ll
    see in the next step, some pins have important uses.


    Pin uses

    04

    Pin 1 is 3V3, or 3.3 volts. This is the main pin we will be using in this guide
    to provide power to our LED. Pins 2 and 4 are 5V. Pin 6 is the other pin we will
    use here, which is ground. Other ground pins are 9, 14, 20 and 25. You should
    always ensure your project is properly grounded.


    # GPIO pins


    05

    The other pins on the board are GPIO (General Purpose Input/Output) These are
    used for other tasks that you need to do as your projects become more complex
    and challenging. Be aware that the USB power supply doesn''t offer much scope
    for powering large items.


    # Basic LED lighting


    06

    Okay, so let''s get down to business and start making something. Firstly, get
    your breadboard, two wires, a 220Ω resistor and an LED. Note the slightly bent
    leg on one side of the LED; this is important for later on. Make sure your Pi
    is unplugged from the mains supply.'
