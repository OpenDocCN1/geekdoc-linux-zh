    # Projects


    What you''ll need...


    +   - Raspbian

    +   - Scratch


    ![](img/59caadfa348382a5c408c25137901e27_57_0.png)


    Scratch was made by MIT Media Lab in 2003. It’s ideal as a first language for
    children as young as five years of age.


    # Make a drawing app with Scratch


    # Make a drawing app with Scratch


    Here’s how to add colour and pencil sizes using the built-in Pen tool


    The aim of this tutorial is to use the Pen tool in Scratch to develop a more useful
    drawing application that you can then expand on yourself. It uses only the sprites
    that are bundled with the installation on the Pi, but you could easily make some
    custom ones to generate the colour changes.


    All you have to do is move the pencil cursor over the colour sprite for it to
    start using that colour, then simply click and draw. Any time the colour is changed
    a sound is played to let you know. Pressing up or down on the keyboard arrow keys
    increases and decreases the size of the pencil nib, not the sprite for it. A sound
    plays for this as well.


    As with all Scratch programs you simply click on the green flag to run the scripts,
    the red circle to stop.


    ![](img/59caadfa348382a5c408c25137901e27_57_1.png)


    # Blocks of code


    The code is split up into blocks that have specific shapes to fit into each other,
    representing the programming syntax visually.


    # Sprites on call


    The sprites loaded to the system appear here and will sit in the middle of the
    screen unless ordered otherwise


    # The sprite script


    Each sprite has its own scripted program and can be started on a variety of conditions
    or actions


    # Customise the look


    A sprite can be repainted to look completely different or it can use photos and
    camera grabs


    ![](img/59caadfa348382a5c408c25137901e27_57_2.png)


    # Load up sprites


    +   1. Click in the top-right to use the Full Stage option. Then, in the sprite
    window, click on Load Sprites. Select the red sunglasses and load them. They will
    appear in the site window. Click on Ctrl in the commands window. Drag the ‘when
    clicked’ header into the Script window.'
