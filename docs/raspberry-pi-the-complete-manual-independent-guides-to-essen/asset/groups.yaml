    \n### 全局变量与元组\n\n**05** 一旦我们导入了项目所需的模块，就会有一长串大写字母变量。大写字母表示这些变量是常量（或全局变量）。这些是重要的数字，它们从不改变——它们代表代码中经常引用的事物，如颜色、块大小和分辨率。你还会注意到颜色和大小在括号中持有多个数字——这些是元组。你可以使用方括号（使其成为列表），但在这里我们使用元组，因为它们是不可变的，这意味着你不能重新分配其中的单个项目。对于常量来说很完美，因为它们本来就不被设计为会改变。\n\
