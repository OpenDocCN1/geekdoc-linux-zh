  mdcn: "\n## 项目\n### 使用摄像头板\n\n以下是如何在树莓派上设置你的新 Pi 摄像头板，以及如何使用它……\n\n#### 你需要什么……\n\
    - **树莓派**\n  - 系统：Raspbian: www.raspberrypi.org/downloads\n- **Pi 摄像头**\n  - Adafruit\
    \ 的 picam 模块：https://github.com/adafruit/picam\n\n![](img/59caadfa348382a5c408c25137901e27_51_0.png)\n\
    ![](img/59caadfa348382a5c408c25137901e27_51_1.png)\n![](img/59caadfa348382a5c408c25137901e27_51_2.png)\n\
    \n树莓派最新的配件之一是小巧的 Pi 摄像头板——一块安装了摄像头传感器的小型 PCB，通过排线连接到树莓派。它并不是即插即用的，因此你需要进行一些额外的设置。\n\
    \nPi 摄像头具有多种功能，例如延时摄影、用作网络摄像头，甚至作为树莓派驱动的机器人（就像我们要制作的那个）的光学传感器。因为它不占用 USB 接口，且功耗极低，所以它比标准网络摄像头要灵活得多。\n\
    \nPi 摄像头本身也不是低质量的设备——它配备 5MP 传感器，能够创建高达 1080p 质量的视频，与树莓派的 HDMI 输出相同。\n\n> **你知道吗...**\n\
    > 摄像头板使用的传感器和硬件类型与大多数手机中的摄像头相同。\n\n#### Pi 准备\n**02** 在我们尝试启用树莓派摄像头之前，我们需要通过快速软件升级确保我们的固件和软件都是最新的。在\
    \ Raspbian 中，我们通过打开终端并使用以下命令来实现：\n```bash\n$ sudo apt-get update\n```\n然后执行：\n\
    ```bash\n$ sudo apt-get upgrade\n```\n\n#### 连接摄像头\n**01** 要将摄像头连接到树莓派，请找到以太网口和\
    \ HDMI 口之间的插槽，并轻轻抬起卡扣。插入摄像头板的排线，确保排线的连接器与树莓派上的连接器对齐。排线上的蓝色标签应面向以太网口。\n\n#### Pi\
    \ 配置\n**03** 完成后，在终端或命令提示符中运行：\n```bash\n$ sudo raspi-config\n```\n启动标准配置屏幕。向下导航至*启用摄像头*，按\
    \ Enter 键，然后简单地导航到“启用”并再次按 Enter 键确认。选择**完成**，然后重新启动。\n\n![](img/59caadfa348382a5c408c25137901e27_52_0.png)\n\
    ![](img/59caadfa348382a5c408c25137901e27_52_1.png)\n\n#### 拍照\n**04** 要使用树莓派摄像头拍照，你只需输入：\n\
    ```bash\n$ raspistill -o image.png\n```\n这将显示摄像头的输入五秒钟预览，然后捕获视频的最后帧。\n\n#### 录制视频\n\
    **05** 要录制视频，我们使用类似的命令 raspivid，如下所示：\n```bash\n$ raspivid -o video.h264\n```\n\
    默认情况下，它也会录制五秒的视频。\n\n#### Picam\n**06** 如果你想更多地使用 Pi 摄像头，目前有一个简单的 Python 封装库叫做\
    \ picam。不过，你需要先安装它，我们将使用 pip 来完成。使用以下命令安装 pip：\n```bash\n$ sudo apt-get install\
    \ python-pip\n```\n然后输入：\n```bash\n$ pip install https://github.com/ashisters/picam/zipball/master#egg=picam\n\
    ```\n\n#### Picam 照片\n**07** 安装了该模块后，我们现在可以使用 Python 构建一个脚本，使用 picam 模块拍照。这并不像你可能想的那么难，所以即使你以前从未使用过\
    \ Python，也值得一试。你只需输入：\n```python\nimport picam\ni = picam.takePhoto()\ni.save('/home/pi/test.jpg')\n\
    ```\n运行它将拍摄一张名为 test.jpg 的照片。\n\n#### 高级照片\n**08** 你可以通过编辑代码使其看起来像这样，来拍摄特定大小和质量的照片，并使用基于时间的命名：\n\
    ```python\nimport picam\nimport time\ni = picam.takePhoto(picam.TakeDetails(640,\
    \ 480, 85))\nfileName = \"tmp/picam-%s.jpg\" % time.strftime(\"%Y%m%d-%H%M%S\"\
    )\ni.save(fileName)\n```\n\n#### 保存及更多\n**09** Picam 还允许你以与上述类似的方式录制视频，主要区别在于你将使用\
    \ recordVideo 命令。你可以使用代码来拍摄照片或视频，以注册延时摄影的间隔，或者在指定事件发生时触发拍摄。\n\n> “凭借 5MP 传感器，它能够创建高达\
    \ 1080p 的视频，与树莓派的 HDMI 输出相同”\n\n## 使用 Scratch 编程\n\n#### 需求\n- Scratch\n- 互联网连接\n\
    \n![](img/59caadfa348382a5c408c25137901e27_53_0.png)\n\nScratch 的网站 http://scratch.mit.edu\
    \ 包含其他用户制作的程序和游戏。\n\n![](img/59caadfa348382a5c408c25137901e27_53_1.png)\n\n位于\
    \ Studio 顶部的是三个快速访问图标和主菜单（图 3）。第一个地球仪样式的图标用于设置 Studio 的语言。另外两个按钮提供了快速访问项目保存和共享功能。在‘文件’菜单下，有一组典型的文件管理功能，用于打开、保存和导入\
    \ Scratch 项目。还有一个项目备注选项，我们可以在其中输入功能描述和注释。\n\n‘编辑’菜单包含一组混合的动画、图像和音频编辑工具。而‘帮助’部分提供对基于浏览器的帮助页面的访问。相当有趣的是，‘共享’菜单允许我们将项目与全世界共享。任何\
    \ Scratch 项目都可以通过‘将此项目在线共享...’选项发布到 Scratch 社区网站\n\n![](img/59caadfa348382a5c408c25137901e27_53_2.png)\n\
    \n以及‘上传到 Scratch 服务器’表单（图 3）。\n\n让我们加载‘Aquarium’（水族馆）示例项目。选择‘文件’菜单中的‘打开...’选项以显示打开项目对话框。从左侧的大按钮列表中，点击名为‘示例’的按钮。接下来，在右侧，双击选择‘动画’文件夹。然后选择‘6\
    \ 水族馆’项。打开对话框窗口应与图 1 类似。\n\n加载水族馆项目后，我们的 Scratch Studio 应与图 1 类似。我们将从舞台区域开始我们的\
    \ Studio 之旅。\n\n使用 Pi 的图形编程语言进行编码的交互式指南\n\n你想深入探索动画和游戏创作的世界吗？你想在不学习软件开发语言的情况下让你的创意想法成真吗？使用\
    \ Scratch，你可以做到所有这些，甚至更多。\n\nScratch 1.4 已经安装在官方的 ‘Wheezy’ Raspbian 操作系统镜像中。如果你的树莓派尚未安装\
    \ Scratch，别担心，只需访问 MIT 官方 Scratch 网站查找下载和安装说明即可。\n\n要开始，我们只需打开 Scratch Studio。点击桌面上的\
    \ Scratch 猫图标，或在 LXDE 桌面菜单中找到 Scratch。\n\nScratch Studio 是一个完整的开发环境。它被划分为若干个独立的面板。每个面板在应用程序构建过程中都有特定的角色，以及自己特定的一套功能和工具。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_53_3.png)\n\n![](img/59caadfa348382a5c408c25137901e27_54_0.png)\n\
    \n图 2：Scratch Studio 菜单 – Scratch Studio 的主菜单和快捷图标正在发挥作用\n\n#### Scratch Studio\
    \ 舞台\n**02** 舞台是所有动作发生的地方，位于 Scratch Studio 的右上角。\n\n舞台由称为角色（sprites）的图形元素构成。这里我们有植物、气泡、鱼和其他生物。你也可以使用\
