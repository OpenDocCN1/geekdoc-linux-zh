    ## 入门指南


    ### 命令行基础


    ![](img/59caadfa348382a5c408c25137901e27_17_0.png)


    ![](img/59caadfa348382a5c408c25137901e27_17_1.png)


    ### 适用于所有情况的软件


    你要做的第一件事是让 Raspbian 确切了解在线可用资源。这是一个非常简单的任务，你只需要做以下操作：


    ```

    $ sudo apt-get update

    ```


    这将遍历包含 Raspbian 使用软件的在线软件仓库（或简称 repos）列表。完成后，命令行提示符会再次出现，等待你的下一条命令。由于这是第一次执行此操作，你可能需要更新树莓派上当前的软件。你可以使用以下命令来执行更新：


    ```

    $ sudo apt-get upgrade

    ```


    系统可能会要求你确认升级，如果是这种情况，请输入 Y 然后按 Enter 键。我们两次都在使用命令行包管理器 APT (apt-get)，首先检查软件仓库，然后根据检查结果升级软件包（图
    4）。第一个命令中的 sudo 允许其以管理员身份运行 apt-get 任务，并且在许多其他命令行操作中也会用到。


    要安装软件，请使用 install 代替 update 或 upgrade，并跟随软件包的名称。例如，对于数学编程语言，你可以使用以下命令安装它：


    ```

    $ sudo apt-get install wolfram-engine

    ```


    #### 你知道吗...


    - 你可以使用 "Tab" 键自动补全命令。只需开始输入并按下 Tab 键。如果你无法自动补全，请查看你按下的 `Enter` 键是否意为 `Finish`（结束）


    ### 移动和创建


    安装和更新只是你在命令行中可以做的许多事情中的两项。你还可以浏览整个文件系统、移动文件、创建文件夹以及删除项目。所有这些操作都非常简单。


    当你首次打开终端时，它会进入你的主文件夹。虽然你无法具体指出这一点，但你可以通过以下方式显示目录中具体有哪些类型的文件（图 5）：


    ```

    $ ls

    ```


    波浪号（~）用于表示主文件夹，可用于在文件系统中导航。为了导航，我们将使用 cd 命令，后跟你要移动到的位置。可以这样做：


    ```

    $ cd /home/pi/Downloads

    ```


    这将把你移动到 Downloads 目录。由于我们最初是在主文件夹开始的，实际上我们只需要这样做：


    ```

    $ cd Downloads

    ```


    它是上下文敏感的，知道要在其当前所在的目录中查找。还有一个技巧，你可以使用它而不必记住路径的确切名称 – 命令行或终端会尝试自动补全短语，如果你在只输入了一部分时按下
    Tab 键。再次尝试 cd 命令，但在只写了 ‘Down'' 时尝试按下 Tab：


    最后，有一些快速命令可用于操作文件。单个文件可以使用 cp 命令复制，后跟文件名和新位置，如下所示：


    ```

    $ cp file.txt ~/Documents/file.txt

    ```


    你还可以通过以下方式重命名文件：


    ```

    $ cp file.txt otherFile.txt

    ```


    然后可以使用 rm 命令删除原始文件：


    ```

    $ rm file.txt

    ```


    想要创建一个新文件夹？使用 cd 移动到你添加文件夹的目录，然后使用 mkdir 后跟你想给文件夹起的名字：


    ```

    $ mkdir NewFolder

    ```


    你可以使用命令行做很多事情，但这些是非常基础的内容。随着你越来越多地使用 Linux，你会遇到需要命令线的任务，通过这个过程，你将学会像街头智慧的电影黑客一样工作能完成多少事情。


    ### 入门


    你知道吗...


    - 你可以通过在命令行中输入 cd 并按 Enter 随时返回主文件夹


    ![](img/59caadfa348382a5c408c25137901e27_18_0.png)


    图 5. 有许多简单的命令行工具可以帮助你浏览和使用你的系统


    ## Raspbian 桌面


    ![](img/59caadfa348382a5c408c25137901e27_19_0.png)


    虽然树莓派的操作系统比 Windows 更接近 Mac，但桌面最像后者


    乍一看可能有点陌生，但使用 Raspbian 与使用 Windows 几乎没有区别（当然除了 Windows 8）。有一个菜单栏、一个网页浏览器、一个文件管理器，以及不缺乏预安装应用程序的桌面快捷方式。正如你所料，我们只需双击它们即可开始...


    ### 桌面快捷方式


    一些预安装的应用程序在桌面上有图标。要运行相关应用程序，只需双击图标。图标可以被移动并拖放到其他位置。单击并拖动以移动它们。有各种任务的图标 - 从用于编程的
    Python 和 Scratch 等应用程序，到用于网络浏览的 Midori，用于直接使用命令对系统进行操作的 LX 终端，以及参考材料。如果你不再想在桌面上显示图标，可以移除甚至删除它们。在任何图标上右键单击以查看可用的选项。


    ### 菜单栏


    就像 Windows 的开始菜单一样，点击角落即可调出程序和选项的菜单。主要类别包括附件、教育用途的应用程序、图形、互联网（包括一些替代浏览器）、编程、通用应用程序和实用程序的混合，以及系统工具。你会发现从
    Pi Store 下载的一些程序（见 [链接](https://example.com)）和 InfoCliff 也会出现在这里。还有一组偏好选项，用于配置系统某些元素的工作方式，例如键盘和鼠标。Run
    选项与 Windows 中的类似 - 它打开一个命令行解释器来运行命令。


    ### 文件管理器


    没有文件管理器，电脑就不完整。点击这里将其调出。可以通过将文件拖到查看器中的光标处来复制、重命名和删除文件。你还可以在文件浏览器中创建标签/窗口或打开更多窗口。可以将文件夹位置标记为‘保存访问’，并且‘文件管理器’可以放大为图标列表查看。如果你需要做任何命令行工作，当前图形文件夹也可以在终端中打开（点击当前文件夹的‘在终端中打开’）；使用文件管理器作为
    Midori 的快捷方式，在新窗口中打开，以及双桌面功能。


    ### 网页浏览器


    Pi 提供多种浏览器 – 默认的是 Midori。有一个桌面图标来启动它。将光标悬停在窗口侧面或角上可以调整窗口大小。网页地址输入到长地址栏中，而搜索查询输入到带有
    Duck Duck Go 字样的较短栏中。有标准的导航按钮用于在网页之间前后移动。Midori 支持多标签窗口，并具有私人浏览和清除浏览数据的功能。点击工具栏末尾的
    Options 图标以访问这些功能。


    ![](img/59caadfa348382a5c408c25137901e27_20_0.png)


    ### Pi Store


    有一个到 Pi Store 的桌面快捷方式，一旦运行，这里也会出现一个图标，以及任务栏上的一个最小化窗口。你可以通过点击它来访问 Pi Store，此外，来自
    Store 的消息也会出现在这里，工作方式很像 Steam、Google Play 或 App Store。你需要在 IndieCity 注册一个账户，你可以直接在
    Store 界面上完成。对于未来的访问，你需要登录。从 Store 下载和安装的应用程序随后会出现在名为 My Library 的标签下。有些只能从这里运行。


    ### 电源和时间


    当树莓派正在运行桌面时，不要只是拔掉电源插头，最好点击这里并选择‘注销桌面’。这处理任何临时文件并离开桌面，将你带回命令行。然后你可以拔掉电源。如果电源符号是时钟，点击它以显示日历，突出显示当前日期。如果你在菜单上右键单击，你可以获得选项来设置
    Digital Clock 的自定义设置，或完全从面板中移除它。


