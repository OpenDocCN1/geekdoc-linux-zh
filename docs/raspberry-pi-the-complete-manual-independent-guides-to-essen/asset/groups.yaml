  mdcn: "\n\n## 项目\n\n### 打造完整的媒体中心\n\n**所需材料...**\n- 互联网连接\n- 外部硬盘\n- VESA 支架\n-\
    \ HDMI 线缆\n\n**打造完整的媒体中心**\n\n通过安装一些简单的软件并进行微调，将您的树莓派变身完美的媒体中心。作为家庭影院电脑（HTPC），树莓派有多种使用方式，其中基于\
    \ XBMC 的发行版是最好的选择之一。OpenELEC 是一种非常适合专门用于此目的轻量级方案，但我们将介绍更具可定制性的基于 Debian 的 Raspbmc。\n\
    \n**你知道吗...**\n\n树莓派最受欢迎的用途之一是将其转换为媒体中心。它运行快速、安静，且易于隐藏。\n\n**完美适配树莓派**\n树莓派是完美的媒体中心，且有相应软件可利用这一优势。\n\
    \n**多种选择**\n在不同 HTPC 解决方案之间做出选择，它们各有优劣。\n\n**使用多个共享**\n以完整的 1080p 分辨率观看本地和网络视频，还可以播放音乐和查看图片。\n\
    \n**使用网页应用**\n让基于网络的流行视频流媒体应用直接运行在您的树莓派上。\n\n![](img/59caadfa348382a5c408c25137901e27_67_0.png)\n\
    \n![](img/59caadfa348382a5c408c25137901e27_67_1.png)\n\n### 安装 Raspbmc\n\n1. Raspbmc\
    \ 提供可下载的的安装程序，始终为您获取最新的树莓派镜像。创建一个新目录，然后使用以下命令下载：\n   ```bash\n   $ wget http://svn.stmlabs.com/svn/raspbmc/release/installers/python/install.py\n\
    \   ```\n   使用以下命令使其可执行：\n   ```bash\n   $ chmod +x install.py\n   ```\n   然后运行它：\n\
    \   ```bash\n   $ sudo python install.py\n   ```\n   遵循屏幕上的说明，然后它将安装到您的树莓派上。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_68_0.png)\n\n### 抓取您的媒体信息\n\n4. 选择源之后，您可以选择从哪个服务抓取信息。这为您提供正在观看的影片更多详细信息，例如剧集摘要和正式名称。确保您的电影文件名后缀带有年份，您的电视剧也需如此。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_68_1.png)\n\n### 安卓遥控\n\n7. 谷歌应用商店有官方的\
    \ Android Remote 应用。一旦启用 Web 服务器，它就可以控制 XBMC。将其下载到手机并启动。进入设置，添加新主机，并输入前一步骤中的 IP\
    \ 地址和端口（默认 80）。\n\n![](img/59caadfa348382a5c408c25137901e27_68_2.png)\n\n### 设置\n\
    \n2. 通过这种方式安装 Raspbmc，该发行版将在首次启动时下载最新镜像并更新以在您的树莓派上运行。这会比较耗时，并需要重启几次，但仅在第一次发生时。在\
    \ XBMC 中选择您的语言，即可完成设置。\n\n### 获取一些应用\n\n5. 在任何内容标签页中，前往附加组件（Add-Ons）。它会显示您已经安装的应用，默认为无。选择“更多”（More）后，将显示所有可用应用的完整列表。您可以从那里一键安装它们。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_68_3.png)\n\n### 使用 CEC\n\n8. 如果您的电视支持，可以通过\
    \ HDMI 使用 CEC 来控制基于 XBMC 的树莓派。CEC 默认应已启用，因此您可以使用一个遥控器控制您的设置。请参阅 XBMC 维基以了解您的电视是否支持\
    \ CEC，以及如何利用它：[bit.ly/18ykHdf](bit.ly/18ykHdf)\n\n![](img/59caadfa348382a5c408c25137901e27_68_4.png)\n\
    \n### 网络共享\n\n3. 您可以为 XBMC 添加文件源。首先前往视频，然后添加源（Add Source）。前往浏览（Browse），您可以添加本地或网络文件。对于网络共享，选择\
    \ UPnP 或 SMB 共享。查看网络上可见的内容，或者如果您知道直接路径，则选择“添加网络位置”（Add network location）。音乐和图片的操作也与此相同。\n\
    \n### Web 遥控器\n\n6. 在设置中，前往服务（Services），然后选择 WebServer（Web 服务器）。启用它，现在您就可以使用 Web\
    \ 浏览器控制您的树莓派。要访问 Web 浏览器遥控器，请在浏览器中输入 IP 地址——可在主屏幕的设置标签下的系统信息中找到——后跟‘:80’。\n\n\
    ### 传统遥控器\n\n9. XBMC 支持大量通用遥控器，这些遥控器包含或支持 USB IR 接收器。其中最优秀的设备之一是 FLIRC，这是一种完全可编程的\
    \ USB IR 接收器，允许您使用任何遥控器与树莓派配合。\n\n![](img/59caadfa348382a5c408c25137901e27_68_5.png)\n\
    \n## 项目\n\n**所需材料...**\n- RetroPie\n- bit.ly/retrohack.com/download/retro-pie-image\n\
    \n**你知道吗...**\n\n模拟器在某种程度上处于法律的灰色地带。您必须拥有原始游戏才能在树莓派上模拟它们。\n\n### 打造你自己的复古游戏机\n\
    \n使用 RetroPie，一个为将昔日游戏带到树莓派上的发行版，满足您的复古游戏瘾。人们创建自己的街机柜或自行组装复古游戏机的趋势正在增长，树莓派的体积和性能使其完美适用于此。按照我们的教程，将您的树莓派变成一个功能强大的模拟平台。\n\
    \n**控制权限**\n开箱即可正确配置 USB 和 P3 控制器。\n\n**快速且灵活**\n配置 RetroPie 以获得更强的电力控制。\n\n**兼容\
    \ Xbox**\n安装驱动程序以使用 Xbox 360 控制器。\n\n**几十年的乐趣**\n将您的树莓派变为终极便携式复古游戏机。\n\n![](img/59caadfa348382a5c408c25137901e27_69_0.png)\n\
    \n### 安装 RetroPie\n\n01 从网站下载最新的 RetroPie 镜像并解压。与安装其他树莓派发行版类似，您只需要使用以下命令将镜像写入\
    \ SD 卡：\n```bash\n$ sudo dd bs=8M if=[path to image] of=/dev/[path to sd card]\n\
    ```\n\n### 初始设置\n\n02 首次启动时，系统将要求您配置控制器，这可以通过键盘、标准 USB 控制器或 P53 控制器完成。RetroPie\
    \ 的初始设置仅提供非常有限的控制，您需要启动一个单独的工具来进行更好的配置。\n\n### 校准控制器\n\n03 按下您设置好的菜单按钮，并进入 ext。您将进入命令行。连接\
    \ USB 控制器并输入以下内容：\n```bash\n$ cd RetroPie/retroarch/tools\n..and then\n$ . /retroarch-joyconfg\
    \ >> ~/RetroPie/configs/all/retroarch.cfg\n```\n按照屏幕上的说明正确配置您的控制器。\n\n### 使用 Xbox\
    \ 360 手柄\n\n04 要使用有线或 PC 兼容的 Xbox 360 控制器，您首先需要安装正确的驱动程序：\n```bash\n$ sudo apt-get\
    \ install xboxdrv\n```\n然后编辑 `~/etc/local`，添加：\n```bash\n$xboxdrv --trigger-as-button\
    \ --wid 0 -L 02 -O zone 4000 --silent &\nsleep 1\n```\n..在 `ext 0` 之前。如果是有线控制器，将\
    \ `--wid` 更改为 `-id`。重启。\n\n### 识别 360 控制器\n\n05 首先前往 tools 并将 360 手柄添加到您的配置文件中：\n\
    ```bash\n$ cd ~/RetroPie/retroarch/tools\n```\n然后输入以下内容：\n```bash\n$ . /retroarch-joyconfg\
    \ -o -p cfg -p 1 -j 0\n```\n最后使用以下命令将文件添加到 RetroArch：\n```bash\n$ sudo cat p.cfg\
    \ >> ~/RetroPie/configs/all/retroarch.cfg\n```\n保存并重启。\n\n### 添加一些游戏\n\n06 将游戏添加到树莓派很简单。从树莓派中取出\
    \ SD 卡并将其插入电脑。将任何 ROM 或兼容的电脑文件移动到：\n```bash\n[path to SD card]/home/pi/RetroPie/roms/\n\
    ```\n相关文件夹中。\n\n![](img/59caadfa348382a5c408c25137901e27_70_0.png)\n\n### 导航 RetroPie\n\
    \n07 当特定模拟器有游戏时，RetroPie 会自动登录并允许您访问它。按左或右可以在模拟器之间移动，这些模拟器随后提供选项以加载 SD 卡上的游戏。\n\
    \n### 双人对战\n\n08 对于多人游戏，最好使用两个同类型的控制器。前往 `~/RetroPie/configs/all/retroarch.cfg`\
    \ 的底部，复制代码 `input_player1_joypad_index = \"0\"` 并粘贴给玩家。将每个 `player1` 实例更改为 `player2`，第二个控制器就可以正常工作了。\n\
    \n### 安全重启\n\n09 某些模拟器无法退出，意味着您每次都需要通过拔掉电源物理重启树莓派。我们可以再次前往 `retroarch.cfg` 并在末尾添加热键，以退出模拟器：\n\
    ```bash\ninput_enable_hotkeys_btn = \"4\"\ninput_exit_emulator_btn = \"4\"\n```\n\
    \n"
