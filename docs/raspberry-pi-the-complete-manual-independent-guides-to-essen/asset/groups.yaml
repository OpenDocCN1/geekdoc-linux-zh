    \ application like GIMP to configure them to suit your needs. We started with\
    \ the central ship sprite and centred it into a new window. We set the size and\
    \ width of the frame between copies of either frames either side of it. We ended\
    \ up with 11 frames of exactly the same size and width in a single document. Pixel-perfect\
    \ precision on size and width is key so we can just multiply it to find the next\
    \ frame.\n\n![](img/59caadfa348382a5c408c25137901e27_126_0.png)\n\n## Loading\
