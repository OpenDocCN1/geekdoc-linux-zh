    # # Raspberry Pi (Model A)


    While more limited than Model B in terms of hardware connections, it''s still
    a capable little machine


    The main differences between the two flavours of Pi are the RAM, the number of
    USB 2.0 ports and the fact that the Model A doesn''t have an Ethernet port (meaning
    a USB Wi-Fi is required to access the internet. While that results in a lower
    price for the Model A, it means that a user will have to buy a powered USB hub
    in order to get it to work for many projects. The Model A is aimed more at those
    creating electronics projects that


    require programming and control directly from the command line interface.


    Both Pi models use the Broadcom BCM2835 CPU, which is an ARM11-based processor
    running at 700MHz. There are overclocking modes built in for users to increase
    the speed as long as the core doesn''t get too hot, at which point it is throttled
    back. Also included is the Broadcom VideoCore IV GPU with support for OpenGL ES
    2.0, which


    ![](img/59caadfa348382a5c408c25137901e27_7_0.png)


    +   - **SD card slot**

    +   An SD card slot provided on the flip-side of your Pi. The maximum size it
    can hold is 32GB

    +   - **Video out**

    +   RCA composite video means you can use your Raspberry Pi to watch pictures
    and video

    +   - **Audio out**

    +   It also features a 3.5mm jack. Plug for audio output

    +   - **Micro USB power**

    +   The Micro USB adapter doesn''t come with your Pi. It has a minimum rating
    of 500mA for Model A and 700mA for Model B

    +   - **HDMI port**

    +   Hi-res video output with sound (combo courtesy of the HDMI socket) that can
    power TV and monitors up to 1080p

    +   - **Single USB port**

    +   There is only one USB port on Model A, so the first accessory you''ll probably
    want is a powered USB hub'
