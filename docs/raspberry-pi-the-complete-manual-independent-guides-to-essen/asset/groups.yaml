    wpa=2\nwpa_passphrase=<password>\nwpa_key_mgmt=WPA-PSK\nwpa_pairwise=TKIP\nrsn_pairwise=CCMP\n\
    ```\n\n#### Hostapd\n\n**13** After saving and exiting, we need to edit hostapd\
    \ to point it to this new file. Open it with:\n\n```\n$ sudo nano /etc/default/hostapd\n\
    ```\n\nAnd then find the line #DAEMON_CONF=\"\". Remove the #, and change it to:\n\
    \n```\nDAEMON_CONF=\"/etc/hostapd/hostapd.conf\"\n```\n\n#### Network addressing\n\
    \n**14** Setting up a NAT will allow multiple clients to connect. To do this,\
    \ open a terminal window (if one isn’t already open) and type the following:\n\
    \n```\n$ sudo nano /etc/sysctl.conf\n```\n\nAnd add to the bottom of the file:\n\
    \n```\nnet.ipv4.ip_forward=1\n```\n\nSave, exit, and then finish by running:\n\
    \n```\n$ sudo sh -c 'echo 1 > /proc/sys/net/ipv4/ip_forward'\n```\n\n#### IP tables\n\
