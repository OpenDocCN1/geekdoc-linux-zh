  - "[PAGE 75]\n\n# Control an LED using GPIO\n\n# Wiring the board\n\n07 Plug one\
    \ wire into the number 1 pin, and the other end into the breadboard. Note that\
    \ it doesn't matter where on the breadboard you plug it in, but make sure there\
    \ are enough empty slots around it to add the LED and resistor to. Now get another\
    \ wire ready.\n\n# Adding another wire\n\n08 Place the female end of the wire\
    \ into pin number 6 (ground) and the other end into the breadboard, making sure\
    \ to leave room for the resistor, depending on how large it is. Next, get your\
    \ resistor ready. You can use a little higher or lower than 270 ohms, but not\
    \ using a resistor at all will likely blow the LED.\n\n# Add the resistor\n\n\
    09 Next we need to add our resistor. Place one end next to the ground wire on\
    \ the breadboard, and the other one silt below the 3V3 wire connection. This will\
    \ sit next to the LED when we add it in a second. Note that there is no correct\
    \ or incorrect way to add a resistor.\n\n# Add the LED\n\n10 Grab your LED and\
    \ place the 'bent' leg next to the 3V3 wire in the breadboard. Place the other\
    \ leg next to the resistor leg opposite the ground wire. This now completes the\
    \ circuit and we are ready to test out our little task.\n\n# Power it up\n\n11\
    \ Now get your micro-USB cord and either plug the main end into the wall, or plug\
    \ it into a computer or laptop port (and powered on!). You should see the LED\
    \ light up. If not, then check your connections on the breadboard or Pi, or try\
    \ a different LED.\n\n# Setting up programming environment\n\n12 Now, we need\
    \ to be able to do a little bit more than just turn a light on — we want to be\
    \ able to control it via code. Set up a new Raspbian installation (a guide to\
    \ this is found on page 278). You don't need a GUI for this — it can be all done\
    \ via the terminal if you so wish. Before starting, it's best to check everything\
    \ is up-to-date with:\n\n```\n```\nsudo apt-get dist-upgrade\n```\n```\n\n# Open\
    \ up terminal\n\n13 Assuming we want to use the GUI, rather than SSH into the\
    \ Pi, open up a new terminal window by double-clicking on the XTerm icon. We need\
    \ root access to control the LEDs, so either enter `su now`, or remember to prefix\
    \ any commands with sudo.\n\n```\n```\nsu\nsudo\n```\nfollowed by password or\
    \ add `sudo` to the start of each command\n```\n\n# Downloading GPIO library\n\
    \n14 There is a handy GPIO library that makes manipulating the GPIO pins a breeze.\
    \ From within your terminal window, use wget to download the tarball file, then\
    \ extract it using `tar`. This will give us all the files in a new directory:\n\
    \n```\n```\nwget https://pypi.python.org/packages/source/R/RPI.GPIO/RPI.GPIO-0.5.2a.tar.gz\n\
    tar zxf RPI.GPIO-0.5.2a\ncd RPI.GPIO-0.5.2a\n```\n```\n\n# Install the library\n\
    \n15 Now we need to install the library. This is simply a case of using Python's\
    \ install method, so we need the dev version of Python. Make sure you are in the\
    \ directory of the library before running this command:\n\n```\n```\nsudo apt-get\
    \ install python-dev\nsudo python setup.py install\n```\n```\n\n# Importing the\
    \ library in a script\n\n16 Create a new Python script. Next import the main GPIO\
    \ library and we'll put it in a try-except block. Save the file using Ctrl-X and\
    \ choosing 'yes':\n\n```\n```\ncd /\ncd Desktop\nsudo nano gpio.py\ntry:\n   \
    \ import RPi.GPIO as GPIO\nexcept RuntimeError:\n    print(\"Error importing GPIO\
    \ lib\")\n```\n```"
  - "[PAGE 76]\n\n# Control an LED using GPIO\n\n![](img/59caadfa348382a5c408c25137901e27_76_0.png)\n\
    \n> Did you know…\n> \n> The official Python docs are a great resource for beginners\
    \ and professionals alike. http://python.org/doc.\n\n# Test the script\n\n**17**\
    \ Now to make sure that the script imported okay, we just need to run the python\
    \ command and then tell it the name of the script that we just created. If all\
    \ goes well, you shouldn’t see any error messages. Don’t worry if you do, though.\
    \ Just go back through the previous steps to check everything is as it should\
    \ be.\n\n```\nsudo python gpio.py\n```\n\n# Set GPIO mode\n\n**18** Reload the\
    \ script in nano again. We will then set the GPIO mode to BOARD. This method is\
    \ the safest for a beginner and will work whichever revision of the Pi you are\
    \ using. It’s best to pick a GPIO convention and stick to it – it saves confusion\
    \ later on.\n\n```\nsudo nano gpio.py\nGPIO.setmode(GPIO.BOARD)\n```\n\n# Set\
    \ pin mode\n\n**19** A pin has to be defined as either an input or an output before\
    \ it can work. This is simplified in the GPIO library by calling the GPIO.setup\
    \ method. You then pass in the pin number, and then either GPIO.OUT or GPIO.IN.\
