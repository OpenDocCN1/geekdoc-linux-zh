    \ *distanceBetweenPoints*。这可能是游戏中最重要的部分之一，它计算你在 3D 空间中离目标方块的确切距离。答案以组成部分的平方根形式返回。你不需要理解该函数的工作原理，但记住它对于未来项目会非常有帮助，因为它确实会非常有用。下一个函数使用\
