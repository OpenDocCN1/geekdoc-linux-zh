  mdcn: "\n# 让你的树莓派联网\n\n最终，Wi-Fi 连接将获得一个新的 IP 地址。如果你点击“管理网络”选项卡，该网络现在会被列出，并且“启用”单选按钮处于激活状态。要接入互联网，只需启动\
    \ Midori 浏览器即可连接。Wi-Fi 实用程序将继续运行在面板的右下角。如果你右键点击 Wi-Fi 图标，你会看到断开或重新连接的选项、事件历史记录以及最近一次扫描的结果。点击“状态”以查看其运行表现。\n\
    \n## 检查连接\n\n为了检查树莓派是否具有有效的互联网连接，请双击 LX Terminal（终端）。输入以下命令：\n\n```\nip addr\n\
    ```\n\n你应该会看到一串数字列表，最后一行以“inet”开头，随后是树莓派连接的 IP 地址（图 3）。通常这是像 192.168.1.11 这样的地址，这表明连接正在工作，因为树莓派已根据你互联网调制解调器/路由器使用的地址被分配了一个\
    \ IP 地址。如果没有显示，则路由器端可能存在问题。调制解调器/路由器应该运行一个 DHCPD 服务器，当它连接时，它会分配 IP 地址。如果没有运行，那么连接到它的其他设备也无法访问互联网。使用另一台设备通过\
    \ Web 界面登录 192.168.1.0 或你调制解调器的实际 IP 地址，以检查 DHCPD 服务器服务是否已启用。最后，在终端中输入：\n\n```\n\
    ping google.com\n```\n\n## 共享连接\n\n如果你没有 Wi-Fi 适配器、带电源的 USB 集线器或足够长的以太网线，但有一台已连接互联网的其他计算机，还有另一种获取访问权限的方式。在\
    \ Mac 上，通过 USB 或以太网线将其连接到树莓派。打开系统偏好设置；在“互联网与无线”下，点击“共享”。点击“互联网共享”，然后选择 Wi-Fi（用于\
    \ AirPort）作为要共享的连接类型，并选择树莓派如何连接到你的 Mac（图 4）。在 Windows PC 上，前往 Windows 资源管理器 >\
    \ 网络 > 网络和共享中心 > 更改适配器设置。\n\n## 入门\n\n![](img/59caadfa348382a5c408c25137901e27_24_0.png)\n\
    图 3：虽然看起来连接没有正常工作，但这里有一些简单的方法可以检查发生了什么\n\n![](img/59caadfa348382a5c408c25137901e27_24_1.png)\n\
    图 4：Windows 和 Mac 计算机都可以与直接连接的树莓派共享互联网连接\n\n![](img/59caadfa348382a5c408c25137901e27_24_2.png)\n\
    \n23\n\n# 入门\n\n**你需要的**\n\n- Raspbian\n  www.raspberrypi.org/downloads\n- 互联网连接\n\
    \n![](img/59caadfa348382a5c408c25137901e27_25_0.png)\n*图 1 教程是一个可工作的软件作品，配有文档供学习*\n\
    \n![](img/59caadfa348382a5c408c25137901e27_25_1.png)\n*图 2 此部分列出了你安装的所有应用程序，你可以从此处启动已安装的应用程序，或者选择删除它们*\n\
    \n![](img/59caadfa348382a5c408c25137901e27_25_2.png)\n*图 3 使用可识别的用户名和图片自定义你的个人资料，以便其他用户可以找到你*\n\
    \n![](img/59caadfa348382a5c408c25137901e27_25_3.png)\n*图 4 如果你计划上传自己的创作，请点击“上传”选项卡开始编辑你的开发者个人资料*\n\
    \n# 树莓派商店\n\n## Pi 商店\n\nPi 商店中混合了免费和付费的游戏及应用\n\nPi 商店于 2012 年推出，旨在为希望让他们的软件可用于树莓派的专业和非专业开发者提供一个中心。该服务由树莓派基金会与\
    \ IndieCity 和 Veloxi 公司合作创建。\n\n你可以使用 Web 浏览器或专用的 Pi 应用程序浏览商店并以客户身份登录。到目前为止，Pi\
    \ 商店上的大多数物品都是免费或低价的，显然网站开发者希望建立一个繁荣的社区。特别地，他们强调希望看到各个年龄段的开发者。这种方法与使用树莓派鼓励对软件开发兴趣的整体策略相符。此外，Pi\
    \ 商店可能是初学者扩展其树莓派的最简单方式。\n\n除了作为浏览、安装和购买应用程序的平台外，Pi 商店还集成了功能，允许开发者创建个人资料并上传项目。客户也可以创建个人资料并参与社交方面。\n\
    \n## 浏览商店\n\n你可以通过 Web [http://store.raspberrypi.com] 或使用专用 Pi 应用来浏览商店。要安装该应用，请输入：\n\
    \n```\nsudo apt-get install pistor\n```\n\n然后，商店应该会显示为背景上可点击的图标。启动后，你会看到一个双栏窗口，顶部有选项卡，下方是主区域（主图）。第一个选项卡是“探索”，这是你寻找新应用程序的地方。主窗口本身也使用更多的选项卡来表示内容类别。“应用程序”和“游戏”类别包含人们对特定设备应用商店所期望的核心内容。每个这些项，像所有商店物品一样，都以五星评分和评论区形式包含客户反馈。许多产品都是现有程序的重打包版本，专门针对树莓派。开发工具是帮助开发者的资源和工具，例如现成的声音和图形包。\n\
    \n教程是旨在向你介绍树莓派各个方面的资源包。此功能的强大之处在于，这些包不限于纯文本文件，还可以包含其他资源。例如，一个教程展示了如何使用 Python\
    \ 编程语言和 SQL（一种用于访问数据库的语言）构建数据库程序（图 1）。\n\n## 我的图书馆\n\n点击“我的图书馆”选项卡可以查看你已购买和安装的应用程序。从这里，你可以启动已安装的应用程序，从系统中删除它们，或重新安装它们。最后这个功能非常有用，因为它意味着你可以抹去并重新安装你的树莓派，而不会永久失去你从商店获取的内容。此部分还包括一个以图标形式显示的当前已安装应用程序的运行计数（图\
    \ 2）。\n\n如果你点击你的用户名，你可以编辑你的个人资料（图 3）。你可以更改首次注册时商店分配给你的用户名，并添加你的网站链接和照片。这样做有助于你在提供反馈时在社区中建立存在感。\n\
    \n## 上传内容\n\n点击“上传”选项卡允许你创建开发者个人资料（图 4）。这会在网站上给你一个可自定义的综合主页。你可以选择配色方案和横幅图像，并且可以将其连接到你的\
    \ Facebook 和 Twitter 动态。请注意，一旦你创建了开发者页面并保存，将来无法更改名称。\n\n从这里，你还可以添加产品。当你添加产品时，你可以指定它是公开可见还是隐藏的，以及它是已完成的还是正在进行的。你还可以指定你的项目的类别（游戏、应用程序、教程、开发工具或媒体），添加截图、盒装艺术、年龄分级、标签、描述和价格。一旦项目公开，你可以查看与页面浏览量和下载量相关的统计数据。你还可以指定你为产品偏好的许可证。例如，你可能选择允许其他人重新混合你创建的内容。\n\
    \n## 文件本身\n\n我想让你亲自动手！如果你不直接操作文件本身，事情就会顺利运行，但如果出了问题，知道它们在哪里很有用。与你的个人资料和配置相关的文件不是设计为手动编辑的，但可以在你的主目录（/home）中找到。一个有用的故障排除文件是（你的主目录）/home/pi/.pistor/previews/scripts.log。此文件记录所有状态活动，并且在故障排除时是一个无价的资料来源。右键点击此文件以在文件管理器中打开它。\n\
    \n组成应用程序本身的文件可以存储在你的 SD 卡上的各个位置，但许多较大的、与游戏和应用程序相关的文件最终位于 /usr/local/bin/index/。\n\
    \n![](img/59caadfa348382a5c408c25137901e27_26_0.png)\n\n"
