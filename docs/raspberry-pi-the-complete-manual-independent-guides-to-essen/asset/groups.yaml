    \ supports CEC, and how you can take advantage of it: [bit.ly/18ykHdf](bit.ly/18ykHdf)\n\
    \n![](img/59caadfa348382a5c408c25137901e27_68_4.png)\n\n# Network sharing\n\n\
    +   3.  You can add file sources to XBMC. Go to first of all going to Video, then\
    \ Add Source. Go to Browse and you can add local or networked files. For network\
    \ shares, choose either UPnP or SMB shares. See what’s visible on the network,\
    \ or ‘Add network location’ if you know the direct path. This works the same for\
    \ Music and Pictures.\n\n# Web remote\n\n+   6.  In Settings, go to Services and\
    \ then WebServer. Enable it and you will now be able to control your Raspberry\
    \ Pi using a web browser. To access the web browser remote, enter the IP address\
    \ – found in System Info under the home screen’s Settings tab – into your browser,\
