    \n# 完整代码列表\n\n导入必要的 eSpeak 和 GUI 模块，以及用于查询时间的模块\n\n```python\nfrom espeak import\
    \ espeak\nfrom Tkinter import *\nfrom datetime import datetime\n```\n\n定义不同的函数，其中一个是一个简单的固定消息，用于告知时间，另一个是自定义消息\n\
    \n```python\ndef hello_world():\n    espeak.synth(\"Hello World\")\n\ndef time_now():\n\
    \    t = datetime.now().strftime(\"%X %M\")\n    espeak.synth(\"The time is %s\"\
    %t)\n\ndef read_text():\n    text_to_read = input_text.get()\n    espeak.synth(text_to_read)\n\
    ```\n\n使用 Tkinter 为界面创建基本窗口，并创建用于文本输入的变量\n\n```python\nroot = Tk()\nroot.title(\"\
    Voice box\")\ninput_text = StringVar()\nbox = Frame(root, height = 200, width\
    \ = 500)\nbox.pack_propagate(0)\nbox.pack(pady = 5, padx = 5)\n```\n\n文本输入附加到我们创建的变量，每个按钮调用我们在代码上方定义的特定函数\n\
    \n```python\nLabel(box, text=\"Enter text\").pack()\nentry_text = Entry(box, exportselection\
