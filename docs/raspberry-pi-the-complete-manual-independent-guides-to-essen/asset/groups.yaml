    \ three-colour lamp that employs three potentiometers (twisty knobs) to control\
    \ each of the three colours in an RGB LED light. With it you can make most of\
    \ the colours of the rainbow.\n\n# Program with Arduino\n\n# Full code listing\n\
    \n01 Assuming you've followed the steps from the previous two pages your Raspberry\
