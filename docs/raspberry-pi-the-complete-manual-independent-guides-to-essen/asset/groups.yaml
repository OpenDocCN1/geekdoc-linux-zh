    # Welcome to


    # Raspberry Pi


    # The Complete Manual


    The Raspberry Pi is one of the most exciting things to happen to computers since
    Steve Jobs revealed the iPad. As an educational tool this credit card-sized PC
    has reignited interest in bare-metal computing in schools. As a platform for open-source
    software it has inspired almost three million people to try Linux, many for the
    first time. Best of all, though, is that in its role as a development platform,
    the Raspberry Pi has empowered people from all walks of life to code and make
    some truly stunning projects, many of which we''ll demonstrate in this book...


    ![](img/59caadfa348382a5c408c25137901e27_2_0.png)'
