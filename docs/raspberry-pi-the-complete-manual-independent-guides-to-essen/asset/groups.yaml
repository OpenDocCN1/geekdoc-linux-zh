    for i in range(50):\n    print (“The value of the knob is:”, knob)\n    sleep(1)\n\
    \n# Sometimes you want to delay what the arduino does.\n# This can help you get\
    \ consistent, solid readings\ndef get_value():\n    value = Arduino.analogRead(knob)\n\
    \    Arduino.digital(13)\n    return value\n\nfor i in range(100):\n    print\
    \ (“The value is:”, get_value())\n```\n\n## Projects\n\n### Create a three-colour\
    \ lamp\n\n#### What you'll need...\n\n- Arduino Uno\n- Breadboard\n- Set of prototyping\
    \ cables\n- RGB LED (cathode)\n- 3x potentiometers\n- 3x 330 Ohm resistors\n\n\
    ![](img/59caadfa348382a5c408c25137901e27_91_0.png)\n\nUse the power of Arduino\
    \ to do otherwise impossible projects with just a Raspberry Pi alone\n\nIn the\
    \ previous project we showed you how you can use an Arduino microcontroller to\
    \ help the Raspberry Pi become proficient in new skills that can drastically increase\
    \ the reach of your projects. With the aid of the extra 12 pins capable of PWM\
    \ and analogue input, you could easily add multiple servos, analogue sensors and\
    \ even add input devices like joysticks.\n\nIn this project we're going to demonstrate\
    \ this by creating a three-colour lamp that employs three potentiometers (twisty\
    \ knobs) to control each of the three colours in an RGB LED light. With it you\
    \ can make most of the colours of the rainbow.\n\n### Program with Arduino\n\n\
    #### Full code listing\n\n##### 01\n\nAssuming you've followed the steps from\
    \ the previous two pages your Raspberry Pi and Arduino Uno are ready to go. You'll\
    \ also need the components from the list above. The resistors should be 330-ohm\
