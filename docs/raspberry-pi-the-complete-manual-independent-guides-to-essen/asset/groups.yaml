  - "[PAGE 99]\n\n# Create a time-lapse camera trigger\n\n# Time-lapse\ncamera trigger\n\
    \nMake shooting time-lapse video with your DSLR camera a cinch with our expert\
    \ advice\n\nYou'd be forgiven for thinking that creating mesmerising time-lapse\
    \ videos like those of Vincent Laforet ([www.laforetvisuals.com](http://www.laforetvisuals.com))\
    \ or John Elkind ([www.theartoftime lapse.com](http://www.theartoftime%20lapse.com))\
    \ might be out of reach of the Average Joe. With the help of the Raspberry Pi\
    \ and a sprinkling of Python code, though, that's no longer the case. In this\
    \ guide we're going to trigger our DSLR camera to create pixel-perfect time-lapse\
    \ imagery...\n\n# What you'll need...\n\n+   - Latest Raspberry Image www.raspberrypi.org/downloads\
    \  \n+   - Breadboard  \n+   - Connectors  \n+   - Jumper wire  \n+   - DSLR camera\
    \  \n+   - Compatible shutter cable\n\n# Set up the Raspberry Pi\n\n**01** For\
    \ this tutorial we're assuming you're using a recent build of Ras pi on, with\
    \ the Raspberry Pi set up with a keyboard, mouse and monitor. Open the terminal\
    \ and type:\n\n```\nsudo apt-get update\n```\n\n# Install the RPi.GPIO library\n\
    \n**02** Next we want to make sure your development environment is set up. Follow\
    \ these steps to make sure you've all set in the terminal, type:\n\n```\nsudo\
    \ apt-get install python-dev\nsudo apt-get install python-rpi-gpio\n```\n\n# Set\
    \ up the Pi Cobbler\n\n**03** For this tutorial we've used a cheap prototyping\
    \ breadboard and an Adafruit Pi Cobbler to give us easy access to the Raspberry\
    \ Pi's GPIO pins. As you can see from the picture, the Cobbler straddles the centre-point\
    \ of the breadboard and a ribbon cable connects the two.\n\n# Full code listing\n\
    \n```\nimport RPi.GPIO as GPIO\nimport time\n\nprint 'Welcome to the Complete\
    \ Manual Time-lapse Tool.'\nprint \"Just tell us how many shots you'd like to\
    \ take and the interval between them.\"\nprint \"Try googling 'time-lapse interval\
    \ calc' if you need help deciding.\\n\"\n\ndef main():\nshots = raw_input('How\
    \ many shots would you like to take?\\n -> ')\ninterval = raw_input('How frequently\
    \ do you want to take them (in seconds)?\\n -> ')\n\nif shots.isdigit() and interval.isdigit():\n\
    shots = int(shots)\ninterval = int(interval)\n\nprint \"You'll be shooting for\
    \ %d minutes.%n\" % (shots * interval / 60)\nanswer = raw_input('Are you ready\
    \ to proceed?(yes/no): ')\n\nif confirm:\nGPIO.setmode(GPIO.BOARD)\nGPIO.setup(16,\
    \ GPIO.OUT)\ntaken = 1\n\nprint 'Starting a run of %d shots' % (shots)\n```"
  - "[PAGE 100]\n\n# ## Create a time-lapse camera trigger\n\n# # Projects\n\n# **Manual\
    \ focus**\n\nWe want to control the autofocus with our Python app, so the focus\
    \ to manual and select your camera settings in advance of the shoot.\n\n![](img/59caadfa348382a5c408c25137901e27_100_0.png)\n\
    \n2.5mm to 3.5mm Using a cheap Canon EOS DSLR, so to trigger the shutter with\
    \ the Raspberry Pi, we need a simple 2.5mm to 3.5mm cable.\n\n# **Pi Cobbler**\n\
    \nWe’re using the Pi Cobbler as a breakout for the Pi’s GPIO pins, making the\
    \ build process easier (though it’s not required)\n\n```\n```python\nfor i in\
    \ range(0, shots):\n    print 'Shot %d of %d!' % (taken, shots)\n    taken +=1\n\
    \    GPIO.output(16, GPIO.HIGH)\n    time.sleep(0.5)\n    GPIO.output(16, GPIO.LOW)\n\
    \    time.sleep(interval)\n    GPIO.cleanup()\nelse:\n    print \"Let's try again\
    \ (or press Ctrl + C to quit).\\n\"\n    main()\nelse:\n    print \"Oops - You\
    \ can only enter numbers. Let's try again!\\n\"\n    main()\nprint 'Thanks for\
    \ using the Complete Manual Time-lapse Tool!'\nagain = raw_input('Would you like\
    \ to do another time-lapse? (Yes/no):\\n > ')\nproceed = again.lower()[0] in ['yes',\
    \ 'y']\nif proceed:\n    main()\nelse:\n    print \\\"See you next time!\\n\\\"\
    \n    quit()\nif __name__ == '__main__':\n    main()\n```\n```\n\n# ### Configure\
    \ the breadboard\n\n**04** For the Raspberry Pi’s GPIO to control the camera,\
    \ we need to create a circuit between a pin on the GPIO (in this case pin 23 on\
    \ the cobbler - but it’s actually physical pin 16) and the pin that connects to\
    \ the ‘head’ or ‘tail’ of the camera cable that activates the shutter when connected.\
    \ The base of the connector cable is always ground, so make sure you ground the\
    \ ‘GND’ pin on the Cobbler and the middle pin on the audio jack. With the circuit\
    \ complete, we can focus on the code.\n\n# ### The Time-lapse Photography Tool\n\
    \n**05** We’ve created a small 55-line Python utility called The Linux User Time-lapse\
    \ Photography Tool, which asks the user to input how many shots they’d like to\
    \ take and the frequency they’d like them taken. It then takes that information\
    \ and uses it in a For loop to activate the shutter using GPIO pin 16. If you’d\
    \ like to use the project in the field, we’d recommend using the Android app ConnectBot\
    \ to SSH into your RasiPi for input and feedback. Don’t forget to start your script\
    \ with `sudo python time_lapse_camera.py`.\n\n# ### Create a video\n\n**06** With\
    \ your camera packed with images, we need to collect and output them as a video\
    \ file. While it’s possible on the Pi, copy them to an easily accessible folder\
    \ on a separate Linux PC to make it much faster. We’re going to use FFmpeg with\
    \ the terminal open in the folder where your images are stored, type: `ffmpeg\
    \ -i image%04d.jpg -vcodec libx264 -b 800k video.avi`. This assumes you have libx264\
    \ installed on your machine and the image%04d.jpg assumes the file format and\
    \ the number of digits it’s displaying in (in this case: 'picture0001.jpg')."
