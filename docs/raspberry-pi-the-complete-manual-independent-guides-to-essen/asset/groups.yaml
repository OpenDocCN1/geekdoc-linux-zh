    ## Projects


    Create a Snake clone in Scratch


    ### What you''ll need...

    - Scratch project archives

    - http://scratch.mit.edu/explore/?date=ever


    ### Create a Snake clone in Scratch


    Design your own version of Snake to test your new programming skills!


    > Did you know...

    > Snake is a very popular beginner game that started life on the arcades in the
    Seventies and is still popular today.


    Here, we will create a version of the classic Snake game where you move the snake
    around the Scratch stage using the arrow keys. You control the head of the snake
    and must avoid a collision with either the body of the snake or the edge of the
    stage.


    The snake body grows longer each time you eat an egg. You get points added to
    your score for eating good yellow eggs and lose points for eating bad black eggs.
    There are also bonus sprites to eat for extra points.


    By following this tutorial you will learn to create your own simple sprite graphics,
    send and receive broadcast events, use a list variable to store data, play sound
    effects, generate random numbers and use sensing commands to detect when a sprite
    is touching something.


    ![](img/59caadfa348382a5c408c25137901e27_59_0.png)

    ![](img/59caadfa348382a5c408c25137901e27_59_4.png)


    ### Paint the Snake sprite


    - 01 Click the New Sprite: Paintbrush icon to paint the Snake sprite.

    - In the Paint Editor, draw a small green ellipse for the snake head and add a
    red rectangle for the tongue.

    - It''s important that the tongue is a different colour to the head. Name your
    sprite Snake.


    ### Add a Snake sound


    02 When the Snake tongue touches the snake body or the edge of the stage, we are
    going to play a Game Over sound. We need to add this sound to the Snake sprite.
    With the Snake sprite selected, click the Sound tab and choose Import. Select
    the Electronic-Screetch sound.


    ![](img/59caadfa348382a5c408c25137901e27_60_0.png)


    ### Make Snake variables


    04 Click on the Variables palette. Make two variables, Score and Speed, that are
    visible to all sprites. Make a list called Next Direction which is visible to
    all sprites; it will store the sequence of directions that the head takes. Only
    the Score variable checked so it appears on the stage.


    ![](img/59caadfa348382a5c408c25137901e27_60_6.png)


    ### Initialise Snake variables


    05 Use a ''when green flag clicked'' Control command and initialise the Snake
    variables as shown, using commands from the Variables palette. We want to start
    the game with an empty Next Direction list, so delete all of its entries. The
    Score must start at zero. The Speed sets difficulty.


    ![](img/59caadfa348382a5c408c25137901e27_60_1.png)


    ### Draw Snake body


    06 Use commands from the Pen palette to code the drawing of the snake body. You
    should also use commands from the Motion palette to move the snake to the centre
    of the stage and point left at the beginning of each game. The pen is off until
    the snake is in the starting position. In the next steps we''ll use colours to
    check if the snake head is touching anything it shouldn''t.


    ![](img/59caadfa348382a5c408c25137901e27_60_4.png)


    ### Add main action loop


    07 Use a ''forever'' command with an ''if-else'' command nested inside: We have
    a collision if the red tongue is touching the blue body (the body is always touching
    the body) or the Snake sprite is touching the edge. Use the Eyedropper tool to
    select colours within Scratch.


    ![](img/59caadfa348382a5c408c25137901e27_60_2.png)


    ### Handle Game Over


    08 When a collision has been detected, broadcast a Game Over event (you''ll need
    to create a new event) to the other sprites so they can react. Also, play the
    Screetch sound effect and stop all scripts so that the snake freezes in its current
    position at the end of the game.


    ![](img/59caadfa348382a5c408c25137901e27_60_5.png)


    ### Respond to arrow keys


    03 Drag four ''when key pressed'' commands from the Control palette, and four
    point in direction commands from the Motion palette. Configure them as shown so
    that the up arrow changes the direction to 0 degrees (up) and so on. Click the
    green flag above the stage to test this.


    ![](img/59caadfa348382a5c408c25137901e27_60_3.png)


    ### Handle movement


    09 Now handle the typical case where there is no collision and the snake must
    move in its current direction. The pen is down so it will draw the body. The Speed
    variable determines how many steps to move. Add the current direction to the Next
    Direction list for the tail to read.


    ![](img/59caadfa348382a5c408c25137901e27_61_0.png)


    ### Try out the snake


    10 You can now try out your Snake sprite. It will move around the screen in response
    to pressing the arrow keys. It will draw its body, which will just get longer
    and longer because we need the tail to erase it. And it will stretch and end the
    game on detecting a collision.


    ![](img/59caadfa348382a5c408c25137901e27_61_1.png)


    ### Paint the tail


    11 Click the New Sprite Paintbrush icon to paint the Tail sprite. Draw a small
    green circle to represent the end of the tail. Name this sprite Tail. The Tail
    sprite will follow the Snake and erase the end of its tail so that the snake body
    doesn''t grow indefinitely.


    ### Make a Grow variable


    12 Make a Grow variable which is used for this sprite only – no other sprites
    need access to it. The Grow variable is used to determine when the snake body
    needs to grow and the tail therefore needs to grow, before following to allow
    the head to get further ahead.


    ![](img/59caadfa348382a5c408c25137901e27_61_2.png)


    ### Handle events


    13 The Tail needs to listen for two new events which you create as you need them.
    When it receives a Egg Eaten event from one of the Egg sprites, it sets Grow=1
    so that the tail can pause. And when it receives a Game Over event from the Snake,
    it must freeze.


    ![](img/59caadfa348382a5c408c25137901e27_61_3.png)


    ### Initialise the tail


    14 When the green flag is clicked to start the game, Grow is set to 1 so the snake
    gets a short body. Move to the centre of the stage with the pen up and configure
    the pen to draw a tail the same colour and size as the stage background so that
    it erases the body.


    ### Grow and move


    15 Use a ''forever'' command to keep the tail moving. If Grow is 1 it should pause
    and reset Grow to 0 – this makes the body grow longer. Use the first value from
    Next Direction to set the direction and remove it for a new value next time. Move
    Speed steps.


    ![](img/59caadfa348382a5c408c25137901e27_61_4.png)


    ### Try out the tail


    16 Now you can try out the Tail sprite. The snake won''t keep growing yet because
    it won''t receive any Egg Eaten events. But the tail will follow the snake head
    around the stage, erasing the snake body as it goes by drawing over it with a
    white pen the same colour as the background.


    ![](img/59caadfa348382a5c408c25137901e27_61_5.png)


    ### Paint the Egg sprite


    17 Click the New Sprite: Paintbrush icon to paint a new sprite. In the Paint Editor,
    draw a small yellow ellipse. Name the sprite Egg. The Egg will appear randomly
    on the stage and cause the snake to grow and increase its score.


    ![](img/59caadfa348382a5c408c25137901e27_62_0.png)


    ### Add Egg sound


    18 Go to the Sounds tab for the Egg sprite and import the Recreation-Symbol Crash
    sound. Or you can choose a different sound if you like. This sound will play when
    the snake eats an egg.


    ![](img/59caadfa348382a5c408c25137901e27_62_1.png)


    ### Add Egg scripts


    19 Copy the Egg script so that the Egg appears randomly at the start of the game.
    When the Egg senses that it has been eaten, it must hide, play the Cyber sound
    (or whatever you chose in step 18), update the score, broadcast the Egg Eaten
    event and then randomly appear again. When the Game Over event is received, it
    must stop.


    ### Make Bad Egg


    20 Create the black Bad Egg in the same way as the Egg but using a different graphic
    and the Instruments-StringPluck sound. Drag the Egg''s green flag scripts onto
    the Bad Egg to copy them – just change the sound that is played and reduce the
    score instead of increasing it.


    ![](img/59caadfa348382a5c408c25137901e27_62_2.png)


    ### Grow Bad Egg


    21 Add another ''when green flag clicked'' script to the Bad Egg so it sets its
    size to the default 100% when a new game is started and then increases its size
    by 10 every 10 seconds. The Bad Egg will get bigger and bigger and harder to avoid.


    ![](img/59caadfa348382a5c408c25137901e27_62_4.png)


    ### Create Bonus sprite


    22 Create the Bonus sprite in a similar way. You can choose the shape and sound
    for the Bonus. Its scripts are similar to the Egg ones so you could drag one of
    those to the Bonus sprite and work from that. Make sure you change the sound and
    increase the score by a random bonus.


    ![](img/59caadfa348382a5c408c25137901e27_62_3.png)

