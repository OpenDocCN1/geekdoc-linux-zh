    ## 实验与调优


    虽然代码准确反映了我们在本文中描述的所有内容，但有一组关键的步骤只能通过实时测试来发现：那就是 PID 增益。对于每个正在运行的 PID，都有一个独立的**比例（Proportional）、积分（Integral）和微分（Differential）**增益，这些只能通过估算/实验来确定。每架四轴飞行器的结果都会不同。幸运的是，有一种相对安全的操作方式。


    首先，找到 PWM 起飞速度：通过将四轴飞行器放在地面上，缓慢增加 PWM 值，直到它开始显得轻飘飘的——对于我们的专家来说，这大约是 1590us 的脉冲宽度（或者如代码所示的
    1500us + 90us）。


    接下来，整理稳定 PID——假设你的四轴飞行器是正方形且重心大致居中，那么俯仰（pitch）转向的结果也适用于偏航（yaw）转向。对于俯仰转向，禁用两个对角相对的电机并将它们支撑在平面上——四轴飞行器水平地搁置在中间。将悬垂电机的
    PWM 功率调至略低于起飞速度（在我们的专家的情况下为 1550us 脉冲宽度）。四轴飞行器是点头、摇晃、表现出某种控制姿态、在被轻推时自我校正，还是毫无反应？


    相应地微调 P 增益。一旦 P 增益良好，就添加一点 I 增益——这将确保回到 0 以及稳定性。D 增益是可选的，但能增加稳固性和灵敏的响应。轻拍一个 D
    增益稳定的四轴飞行器就像敲击桌子一样——它纹丝不动。


    垂直速度 PID 可以估算。1590us 是起飞；期望的起飞速度是 0.5m/s，所以 100 的 P 增益是可以的。不需要 I 或 D 增益。有了这个，真正的起飞、悬停和降落是安全的，这是很好的，因为这些是调优方向
    PID 的唯一途径。只是要谨慎——过度的增益会导致四轴飞行器撞击墙壁，或者在空中翻滚后坠入地面。最好在户外宽阔的空地/花园/公园里执行，最好在夜间降雨后地面柔软的地方！


    没有捷径可走，所以要接受会有碰撞和损坏，并尽可能享受这场混战！


    假设上述一切按计划进行，那么你就有一架即使在微风条件下也能起飞、悬停和降落的四轴飞行器。下一步是添加遥控器，但我们留待以后再说！


