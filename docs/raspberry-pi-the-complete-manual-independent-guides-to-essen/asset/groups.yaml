  mdcn: "\n\n## 将您的树莓派变成办公套件\n\n### 探索该套件\n\n**02** 安装完 LibreOffice 后，您可以通过按下系统菜单来欣赏您的新应用程序。您会看到一个新的“Office”类别，在其下方您会看到以下应用程序：\n\
    - **LibreOffice Base** – 一个数据库管理应用程序。\n- **LibreOffice Calc** – 电子表格。\n- **LibreOffice\
    \ Draw** – 用于制作流程图可视化。\n- **LibreOffice Impress** – 用于创建演示文稿。\n- **LibreOffice\
    \ Writer** – 文字处理器，它与 Word 非常相似。\n\n这些应用程序中的大多数都能打开在 Microsoft Office 对应软件中创建的大多数文档，并且功能几乎同样丰富。\n\
    \n正确选择您文档中的章节。要创建索引，请在文档顶部留出一些空间，然后通过使用菜单转到 *索引和表格* 来插入您的索引。选择选项，并在您满意时点击 *确定*。它将插入到光标所在的文档部分。\n\
    \n### 关于图像呢？\n\n**05** 没有比精心挑选的图像更能让文档生动起来的方法了。这也可以相对轻松地实现。有几种解决方案——最简单的一种是直接从文件管理器将图像拖入文档。假设图像在您的桌面上，只需将文件拖到\
    \ LibreOffice Writer 上，您就会看到图标发生变化，松开鼠标后，您的图像将大致出现在您释放的位置。或者，您可以使用 *插入 > 图像 >\
    \ 从文件* 选项。\n\n### 使用注释来帮助自己\n\n**07** 在撰写长篇文档时，您经常会想到一些真正应该稍后检查或添加到文档中的事项。当您想到这些项目时，您可以使用“注释”来为它们做笔记——当有多个人员正在处理该文档时，这甚至更有用。可以使用\
    \ **Ctrl+Alt+C** 或通过菜单选项 *插入 > 注释* 在文档当前位置添加注释。如果您想取消“注释”窗格，可以使用“查看”菜单来切换它。\n\n\
    ![](img/59caadfa348382a5c408c25137901e27_36_0.png)\n\n![](img/59caadfa348382a5c408c25137901e27_36_1.png)\n\
    \n### 添加一些样式\n\n**03** 这里我们重点关注树莓派上的一些文字处理功能，因此请继续打开 LibreOffice Writer。在撰写文档时，通常是格式方面让人们感到棘手。开始写作时，在字体下拉菜单的左侧，还有一个当前显示为“默认”的下拉菜单。选择一些文本，然后使用此下拉菜单更改当前应用的样式。如果您不喜欢默认设置，请从下拉菜单中选择“更多”，或按\
    \ **F11**。这将允许您自定义样式等内容。\n\n### 导出为 PDF\n\n**06** PDF 格式是交换文档的非常常见的方式——许多人都这样做，因为它是其最简形式；它是阻止文档意外更改或修改的简单方法。对\
    \ PDF 设置密码并阻止有意修改也很简单。然而，PDF 的主要优势是，您不必担心接收方是否有特定的应用程序来查看它们。大多数现代操作系统都内置了某种 PDF\
    \ 查看器，因此您可以确保获得一致的体验。使用 LibreOffice，这很容易。您可以使用 *文件 > 导出* 到 PDF 的菜单选项将文档保存为 PDF。只需选择您想要的选项，点击导出并将其保存到适当的位置。\n\
    \n### 链接到世界\n\n**08** 如果您在文档中使用了外部资源并希望引用它们，或者也许您不需要直接包含所有信息——拥有一个稍后返回该文档的方式可能很有用。您可以在文档末尾包含一个信息附录，链接到这些其他资源。您可以轻松使用超链接工具按钮，该按钮位于\
    \ *插入 > 超链接* 的同一菜单中。当您输入链接后，它会弹出一个对话框，让您链接到其中一个合适的地方。需要注意的是，直接文档链接使用完整的系统路径。如果这是要发送给别人的，请避免使用这些，因为它们对读者会失效。理想情况下，仅在您自己的机器上使用个人参考指南。\n\
    \n### 添加索引\n\n**04** 使用格式化的一个伟大之处在于，它允许您轻松地为您的工作创建一个目录页。只要您对文档的不同级别使用一致的标题，这就是一种快速简便的方式来提供您文档内容的指南。另一个优势是，如果您将文件导出为\
    \ PDF，您将看到目录中的每个标题都直接热链接到相应的地方。\n\n## 项目\n\n### Nano 初学者指南\n\n学习如何使用 Linux 最佳工具之一在命令行和终端中编辑文本\n\
    \n#### 您需要什么...\n\n- **完整的 nano 手册**\n  - www.nano-editor.org/dist/v2/nano.1.html\n\
    \n> **你知道吗...**\n>\n> Nano 是初学者最好的命令行编辑器之一，但有很多其他选项，如 Kate 和 Vim。\n\n如果您有渴望在 Pi\
    \ 上做得更多的冲动，为了实现许多项目，您需要学习的一项技能是编辑系统文件的能力。命令行文本编辑器 nano 绝对是从事此项工作的最佳工具之一。文本编辑器是非常基本的工具；在这种情况下，线索就在名字里。您不会得到文字处理器中那样的格式化或颜色等功能，但这正是重点。您将要创建或编辑的文件通常包含代码——代码不需要加粗或项目符号。Nano\
    \ 去除了所有这些干扰，但仍然具有您在图形文本编辑器中会找到的几个更实用的功能。我们将教您如何最大限度地利用 nano，使您的项目快速高效地运行。\n\n\
    ![](img/59caadfa348382a5c408c25137901e27_37_0.png)\n\n- **写作**\n  - 在命令行中创建纯文本文件，甚至为程序编写一些代码。\n\
    - **编辑**\n  - 根据您的需求和项目编辑系统文件，无需翻遍文件管理器。\n- **高级功能**\n  - 使用 nano 的一些内置功能进行搜索、复制、粘贴和从另一个文件插入文本。\n\
    \n#### 打开 nano\n\n![](img/59caadfa348382a5c408c25137901e27_38_0.png)\n\n**01**\
    \ 打开终端，或进入命令行，并简单地输入 **nano**。这将打开一个新的空白文件。从这里，您可以创建一个简单的文本文件，如列表，或创建系统文件、脚本或一段代码。系统如何解释您的文件取决于您写的内容以及您保存它的方式。\n\
    \n#### 保存并继续\n\n![](img/59caadfa348382a5c408c25137901e27_38_1.png)\n\n**02** 完成使用\
    \ **nano** 后，您可以使用 **Ctrl+O** 保存/写出。所有此类快捷方式和功能都是使用 **Ctrl** 和一个字母键完成的。您会被要求将文件保存为什么名字。无论您给它起什么名字，除非您指定路径，否则它都将保存在您打开\
    \ **nano** 所在的目录中。\n\n#### 打开文件\n\n![](img/59caadfa348382a5c408c25137901e27_38_2.png)\n\
    \n**03** 要编辑已存在的文件，您首先需要知道它们的位置和名称。要在 **nano** 中打开它们，输入以下内容：\n\n```bash\n$ nano\
    \ /path/FileName\n```\n\n例如，要编辑文件，您将输入：\n\n```bash\n$ nano /etc/fstab\n```\n\n\
    #### 保存并退出\n\n![](img/59caadfa348382a5c408c25137901e27_38_3.png)\n\n**04** 完成修改文件并需要继续下一个任务时，您可以按\
    \ **Ctrl+X** 退出 **nano**。它会询问您是否要保存任何修改，只需按 'Y' 确认即可。如果您想退出不保存更改，可以只使用 N。要在做出决定之前取消，请使用\
    \ **Ctrl+C**。\n\n#### 复制和粘贴\n\n![](img/59caadfa348382a5c408c25137901e27_38_4.png)\n\
    \n**05** 这更多是一个特定于终端的命令，但它也可以很好地用于 **nano**。虽然您不能使用鼠标在 **nano** 中导航文件，但您可以像在图形文本编辑器中一样突出显示文本。一旦突出显示，按\
    \ **Ctrl+Shift+C** 将复制任何文本。**Ctrl+Shift+V** 将粘贴复制的文本。\n\n#### 从文件插入\n\n![](img/59caadfa348382a5c408c25137901e27_38_5.png)\n\
    \n**06** 如果您想直接插入另一个文件的内容，有一种快速的方法，无需使用复制和粘贴。按 **Ctrl+R** 并输入文件的路径将插入到光标所在处。\n\
    \n#### 高级导航\n\n![](img/59caadfa348382a5c408c25137901e27_38_6.png)\n\n**07** 您可能一直在使用箭头键逐个空格向左、向右、向上或向下移动。不过，还有其他方法可以在文件中移动。使用\
    \ **Ctrl+A** 将起到与图形编辑器中 Home 键相同的作用，将光标移动到行首。同样，**Ctrl+E** 像 End 键一样将您移动到行尾。**Ctrl+Y**\
    \ 是向下翻页，**Ctrl+V** 是向上翻页。\n\n#### 搜索文件\n\n![](img/59caadfa348382a5c408c25137901e27_38_7.png)\n\
    \n**08** 有时您会在大型文本文件中寻找特定的行或短语。与其阅读每一行，您可以使用 **nano** 搜索行，使用 **Ctrl+W**。输入搜索词将开始在文档中查找，完成后您可以按\
    \ **Enter** 查找下一个实例，或按 **Ctrl+C** 退出搜索。\n\n#### 额外帮助\n\n![](img/59caadfa348382a5c408c25137901e27_38_8.png)\n\
    \n**09** **nano** 中还有更多可用的功能。要获取完整的命令列表，您可以使用 **Ctrl+G**，它列出了所有快捷键及其功能。在此列表中，脱字符符号\
    \ (^) 表示使用键盘上的 Ctrl。\n\n"
