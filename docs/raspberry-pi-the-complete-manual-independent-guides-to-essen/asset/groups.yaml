    # Experimentation and tuning


    While the code accurately reflects everything we''ve described here, there''s
    one critical set of steps which can only be found through live testing: these
    are the PID gains. For each PID running, there is an independent Proportional,
    Integral and Differential gain that can only be found with estimation/experimentation.
    The results for every quadcopter will be different. Luckily there is a relatively
    safe way to proceed.


    First, find the PWM take-off speed: this is done by sitting your quadcopter on
    the ground and slowly increasing the PWM value until the starts looking light-footed
    – for your expert, this was about the 1590us pulse width (or 1500us + 590u, as
    shown in the code).


    Next, sorting out the stability PIDs – assuming your quadcopter is square and
    its balance is roughly central, then the result of pitch turning also applies
    to yaw turning. For pitch turning, disable two diagonally opposed motors and rest
    these on a surface – the quadcopter sits horizontal in between. Power up the dangling
    motors'' PWM to just under take-off speed (1550us pulse width in our expert''s
    case). Does the quad nod, manually, wobble in some pretence of control, self-right
    when nudged, or do nothing?


    Tweak the P gain accordingly. Once P gain is good, add a touch off gain – this
    will ensure return to 0 as well as stability. D gain is optional, but adds firmness
    and crisp response. Tapping a D gain stable quad is like knocking on a table –
    it doesn''t move.


    Vertical speed PID can be guesstimated. 1590us is taking off; desired take-off
    speed is 0.5m/s so a P gain of 100 is okay. No I or D gain needed. With that a
    real take-off, hover and landing are safe, which is good as these are the only
    way to tune the directional PIDs. Just be cautious here – excessive gains lead
    to quadcopters slamming into walls or performing somersaults in mid-air before
    powering themselves into the ground. Best executed outside in a large open field/garden/park
    where the ground is soft after overnight rain!


    There isn''t a shortcut to this, so just accept there will be crashes and damage
    and enjoy the carnage as best you can!


    Assuming all the above has gone to plan, then you have a quadcopter that takes
    off, hovers and lands even in breezy conditions. Next step is to add a remote
    control, but well saved that for another day!'
