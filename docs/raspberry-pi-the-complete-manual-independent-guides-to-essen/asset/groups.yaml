    # 四大附加板


    使用这些附加板扩展树莓 Pi 的功能，从而挖掘其更多潜力


    ![](img/59caadfa348382a5c408c25137901e27_31_0.png)


    ## GetBoardo £30


    GetBoardo 由树莓 Pi 的原始设计师之一 Get van Loon 创建，是 GPIO 端口的扩展板，使树莓 Pi 能够与真实世界互动。它用于执行物理计算任务：驱动电机以打开车库门或百叶窗、窗帘，感应温度以便您知道何时关闭暖气，控制
    LED 灯等。虽然它尚未达到 Arduino 的水平，但它与树莓 Pi 集成度更高，且是一款非常棒的教学工具。组装它需要进行少量焊接，不过如果您愿意花点心思寻找，可以找到预组装好的
    Getboard，只需多花一点点钱。如果您不想自己动手组装，这也是个不错的选择——组装起来可是项大工程！


    在 RasPiTV 上有一个基于 GetBoardo 的精彩项目可供尝试 [bit.ly/tebawWA]，通过 Wii 远程视频游戏控制器，您可以制造出一系列充满动感与噪音的效果，展示使用
    Getboard 能实现多少功能。从挥舞旗帜到启动风扇和响铃，您可以用树莓 Pi 驱动鲁布·戈德堡机械（Rube Goldberg machine）。您只需要一个蓝牙模块来将
    Wii 远程与树莓 Pi 同步，并借助 Pybluez Python 库开始折腾。


    ![](img/59caadfa348382a5c408c25137901e27_31_1.png)


    ## Gertduino £20


    作为 GetBoard 的“大哥”，Gertduino 是一款混合 Arduino 板，与树莓 Pi 的兼容性更好。Arduino 是开源的微控制器，允许您控制物理对象——与使用
    GetBoard 相比，它提供了更多的控制、更高的精度和自动化能力。Gertduino 最大的特点在于它搭载了与 Arduino Uno 相同的芯片。Uno
    是许多制作业余电子项目的人常用的旗舰级 Arduino 板。Gertduino 高度可配置，且所有兼容 Uno 的 Arduino 附加配件都能用于 Gertduino。


    Gertduino 中还内置了一个名为 Atmega328 的特殊芯片，这在 Uno 中是没有的。其主要功能包括备用电池和高精度时钟，这两者允许 Gertduino
    在完成编程后从树莓 Pi 上拔下单独运行。这意味着您可以设置它在每天早上指定时间打开鸡舍，而不需要树莓 Pi 始终在场。据悉，该板的发明者 Get van
    Loon 就使用他的 Gertduino 来管理他的鸡舍。


    Gertduino 的完整手册包含一些使用板子的绝佳示例项目，可在 element14 网站上找到 [bit.ly/1afc8RD]。


    ## 入门指南


    ## PiFace £20


    物理计算是树莓 Pi 的热门扩展功能，PiFace 是另一系列允许您在 Pi 上与外部世界互动的板子。PiFace 别具一格，因为它允许您使用命令行界面（CLI）来控制
    PiFace 板上独立的端口。这些板子包括一个简单的 LED 显示屏和一个标准的接口板；这两种板子都提供了教案和其他教育工具，帮助人们学习编程及一般使用树莓
    Pi。它完全兼容 Scratch，也可使用 Python 和 C 构建更复杂的应用程序。


    虽然 PiFace 实际上不允许您控制设备，但可以检测许多类型数字设备的状态。您可以将此功能应用于某种物联网场景，发送推文或操纵联网设备。PiFace 网站提供的一些教程教您如何制作记忆游戏、倒计时器/广告日历以及可演奏的风琴。


    ![](img/59caadfa348382a5c408c25137901e27_32_0.png)


    ## RasWIK £50


    另一种基于 Arduino 的板子，允许您执行一些物理计算任务。然而，这款板子适合那些不想在连接 GPIO 端口时进行繁琐布线的人。RasWIK 的神奇之处在于，它自带一个无线芯片，开箱即可紧密贴合在
    GPIO 端口上，并附带定制版 Raspbian 系统，这使得使用主 Arduino 板的过程变得更快。它甚至附带了一系列用于构建电路的组件，从远程蜂鸣器、红绿灯到光感应和温度感应项目。定制
    Raspbian SD 卡随附了如何启动这些项目的说明，如果您不喜欢焊接板子，这可以让整个过程更轻松。


    这些项目中的一些及更多内容可在思科（Cisco）网站上找到 [bit.ly/1H1m5dD]，因此您可以在最终决定购买 RasWIK 之前先浏览一下。如果您拥有正确的组件，甚至可以没有
    RasWIK 也使用这些项目，并且在此过程中学习如何使用 Python。这是从树莓 Pi 入门物理计算的一种轻松且省心的方式，其教程非常适合儿童和初学者开始编程与控制学习。


    ![](img/59caadfa348382a5c408c25137901e27_32_1.png)


    > “RasWIK 的神奇之处在于，它自带一个无线芯片，开箱即可紧密贴合在 GPIO 端口上”


    ## 用树莓 Pi 编写代码与创造


    学习如何用您信用卡大小的 PC 实现更多功能


    如果您一直跟随本教程，您已经牢固掌握了 Linux 的基础知识，并学会了如何高效地使用树莓 Pi。这只是您冒险旅程的开始。接下来您将找到世界上最全面的树莓
    Pi 项目集合之一。无论您是想让树莓 Pi 成为媒体中心、学习编程，还是了解如何将其安装到遥控车上，我们希望接下来的页面能激发您的灵感，让您今天就用树莓 Pi
    创造出令人惊叹的东西……


    ![](img/59caadfa348382a5c408c25137901e27_33_0.png)


    ### 项目


    ![](img/59caadfa348382a5c408c25137901e27_34_0.png)


    > *接下来是世界上最全面的树莓 Pi 项目集合之一*


    ### 将您的树莓 Pi 变身办公套件


    您需要……


    - LibreOffice

    - 通过教程使用 apt-get 安装


    如何为树莓 Pi 添加一套完整的免费办公套件，使其成为有史以来最小的家庭办公室


    如果您没有处理信函撰写、电子表格和演示文稿等需求的工具，计算机能做的就有限。幸运的是，这在树莓 Pi 的能力范围内。虽然 Raspbian 自带了几个文本编辑器，但有时您需要完整办公套件提供的额外功能。这在树莓
    Pi 上非常容易实现，最佳选择是开源的，因此完全免费：LibreOffice。


    LibreOffice 是功能齐全的 Microsoft Office 替代品，只要您不创建包含数百张图片的巨大文档，树莓 Pi 就能很好地处理它。本教程需要一个可用的互联网连接，因此请确保您的
    LAN 线缆或无线网卡已插入且功能正常，因为我们将使用内置的包管理器。不过安装确实需要一些时间。


    #### 安装 LibreOffice


    1. 开源软件最大的优点在于您可以随时安装（只要您有互联网连接或安装介质……总之！），完全按您的方便程度来——无需担心提供付款信息。那么，让我们直接开始吧：打开您的终端——您可以通过双击桌面上的
    LXTerminal 来实现。使用包管理器安装 LibreOffice 办公套件。


    ```

    sudo apt-get install libreoffice

    Now type in your password. Press ''Y'' and Enter when prompted to install other
    dependency packages. Now sit back, relax or make some tea

    ```


    ![](img/59caadfa348382a5c408c25137901e27_35_0.png)


    #### 演示文稿


    这是一款真正令人印象深刻的设备，只需几次简单的点击即可创建演示文稿


    #### 绘图


    并非指您想象中的艺术绘图，而是一款极佳的应用程序，用于创建快速、美观的流程图和过程图


    #### 文字处理


