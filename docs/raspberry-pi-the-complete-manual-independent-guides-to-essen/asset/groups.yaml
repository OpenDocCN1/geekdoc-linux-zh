  - '[PAGE 70]


    # Make your own retro games console


    **Projects**


    # **Install RetroPie**


    01 Download the latest RetroPie image from the website and unzip it. Like installing
    other Raspberry Pi distros, you simply need to write the image to the SD card
    with:


    ```

    $ sudo dd bs=8M if=[path to image] of=/dev/[path to sd card]?

    ```


    # **Initial setup**


    02 On the first boot, you''ll be asked to configure a controller, which can be
    done with a keyboard, a standard USB controller or a P53 controller. The initial
    setup on RetroPie is for very limited controls, and you''ll need to launch a separate
    tool for better config.


    # **Calibrating controllers**


    03 Press the menu button you set up, and go to ext. You''ll get to a command line.
    Connect a USB controller and enter the following:


    ```

    $ cd RetroPie/retroarch/tools

    ..and then

    $

    $ . /retroarch-joyconfg >> ~/RetroPie/configs/all/retroarch.cfg

    Follow on the on-screen instructions to properly configure your controller.

    ```


    # **Using an XBox 360 pad**


    04 To use a wired or PC compatible XBox 360 controller, you first need to install
    the correct drivers:


    ```

    $ sudo apt-get install xboxdrv

    Then edit .~/etc/local by adding:

    $xboxdrv --trigger-as-button

    --wid 0 -L 02 -O zone 4000

    --silent &

    sleep 1

    ..before ext 0. Change --wid to -id if it''s a wired controller. Reboot.

    ```


    # **Recognising the 360 controller**


    05 Add the 360 pad to your configuration file by first going to tools with:


    ```

    $ cd ~/RetroPie/retroarch/tools

    Then type in the following:

    $

    $ . /retroarch-joyconfg -o -p cfg -p 1 -j 0

    And finally add the files to RetroArch with:

    $

    $ sudo cat p.cfg >> ~/RetroPie/configs/all/retroarch.cfg

    Save and reboot.

    ```


    # **Add some games**


    06 Adding games to your Raspberry Pi is fairly simple. Grab the SD card from the
    Pi and put it in your PC. Move any ROMs or compatible PC files to the relevant
    folders in:


    ```

    [path to SD card]/home/pi/RetroPie/roms/

    ```


    ![](img/59caadfa348382a5c408c25137901e27_70_0.png)


    # **Navigate RetroPie**


    07 RetroPie will automatically log in when if there are games for a specific emulator
    and allow you to access it. Pressing left or right will move between the emulators,
    which then have options to load the games on the SD card.


    # **Two players**


    08 For multi-player gaming, it''s best to use two controllers of the same type.
    Go to the bottom of ~/RetroPie/configs/all/retroarch.cfg and copy and paste the
    code from input_player1_joypad_index = "0" to the player. Change each instance
    of player1 to player 2, and a second controller will now work.


    # **Safe restart**


    09 Some of the emulators can''t be quit out of, meaning you''ll need to physically
    reboot your Pi by unplugging it each time. We can add a hotkey to exit the emulators
    by again going to retroarch.cfg and adding to the end:


    ```

    input_enable_hotkeys_btn = "4"

    input_exit_emulator_btn = "4"

    ```'
