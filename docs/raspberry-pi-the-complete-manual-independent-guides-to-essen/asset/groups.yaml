    # How to play Minecraft-Pi


    # Projects


    ![](img/59caadfa348382a5c408c25137901e27_82_0.png)


    # Installation


    +   02  There''s no official package for Minecraft-Pi in the Raspbian repositories,
    so unlike most of the extra programs you''ll install from the projects in this
    book, we can''t use ''sudo apt-get install''. Instead we''ll first download the
    compressed package for the game from the official source, decompress it with the
    tar command and then learn how to manually start the game.


    Make sure you''re already in your home folder (by typing cd ~ in the terminal)
    and download the Minecraft-Pi package with the following command:


    ```

    wget https://s3.amazonaws.com/assets.minecraft.net/pi/minecraft-pi-v1.1.1.tar.gz

    ```


    Once it has finished downloading, we''ll need to decompress it to use it. Copy
    the following command into the terminal window:


    ```

    tar --zxf minecraft-pi-v1.1.1.tar.gz

    ```


    Next, we need to move into the newly decompressed Minecraft-Pi directory and try
    running the game for the first time. In the terminal window, type the command:


    ```

    cd mcpi

    ```


    # Minecraft-Pi


    +   03  Assuming you''ve followed all the commands correctly, the game will load
    up into a window. While, like us, your first instinct might be to expand the window
    to the full width and height of your screen, due to a mouse pointer bug in this
    early version of Minecraft-Pi you''ll lose control of part of the screen. If you
    plan to hack the game with Python, you''ll need the game to be running in a relatively
    small window anyway, so you can tab out of the game and into your Python script.


    # Minecraft-Pi controls


    Finally, have a good look around the game! If you''re not familiar with *Minecraft*
    already, you control movement with the mouse and the WASD keys. Numbers


    1-8 select items in your quickbat, the space bar makes you jump, and Shift makes
    you walk slowly (so you don''t fall off edges). E will open your inventory and
    double-tapping the space bar will also toggle your ability to fly.


    # Minecraft-Pi limitations


    +   04  The Raspberry Pi edition of the game is very similar to the Pocket Edition
    of Minecraft designed for tablets and smartphones. You can only play in Creative
    Mode, however, and fans of the latest version of *Minecraft* might be a little
    disappointed to find that none of the more recent additions to the game are present
    - cats, horses, new flowers and the like. It''s also currently not possible to
    sprint or use the bow that''s included in the inventory.


