- pgno: 86
  md: "# Projects\n\n![](img/59caadfa348382a5c408c25137901e27_86_0.png)\n\n> Once\
    \ you've got the hang of it, try changing the settings to create your own version\
    \ of the game\n\n# The 'main' function explained\n\n**05** Next we have the main()\
    \ function. As the name suggests, this is where the meat of the program resides.\
    \ We will create a new random block for the player to find, and post to the chat\
    \ window to let the player know the game has begun. We then make use of the **time**\
    \ library to help us keep reporting how far the player currently is from the secret\
    \ block of diamond. We then check to see if the 'seeking' variable is set to True.\
    \ If so, we keep checking the player's location and then report back to say whether\
    \ the player has got closer or further away from the secret block. We will then\
    \ overwrite the last distance with the new distance.\n\n# Finding diamonds\n\n\
    **06** How do we see if the player has found the diamond? We keep repeating the\
    \ block of code inside 'while true' until the player's position is less than two\
    \ blocks in distance away from the diamond. If the player is next to the diamond,\
    \ it's fair to assume they've spotted it, so we can stop the clock and let them\
    \ know they've succeeded and tell them exactly how long it took them to find it.\
    \ It's a very quick and simple game, but it really shows off the API tools. Have\
    \ fun making your own projects!\n\n![](img/59caadfa348382a5c408c25137901e27_86_1.png)\n\
    \n```\nreturn randomBlockPos\n\ndef main(): # the main function of Hide & Seek\n\
    \tglobal lastPlayerPos, playerPos\n\tseeking = True\n\tlastPlayerPos = playerPos\n\
    \n\trandomBlockPos = randomBlock()\n\tmc.setBlock(randomBlockPos, block.DIAMOND_BLOCK)\n\
    \tmc.postToChat(\"A diamond has been hidden somewhere nearby!\")\n\n\tlastDistanceFromBlock\
    \ = distanceBetweenPoints(\n\t\trandomBlockPos, lastPlayerPos)\n\ttimeStarted\
    \ = time()\n\n\t# This is the main loop of the game\n\twhile seeking:\n\t\t# Get\
    \ players position\n\t\tplayerPos = mc.player.getPos()\n\t\t# Has the player moved?\n\
    \t\tif lastPlayerPos != playerPos:\n\t\t\tdistanceFromBlock = distanceBetweenPoints(\n\
    \t\t\t\trandomBlockPos, playerPos)\n\n\t\tif distanceFromBlock < 2:\n\t\t\t#Found\
    \ it!\n\t\t\tseeking = False\n\t\telse:\n\t\t\tif distanceFromBlock > 4:\n\t\t\
    \t\tmc.postToChat(\"Warmer \" + \"\U0001F525\"*3)\n\t\t\tstr(int(distanceFromBlock))\
    \ + \" blocks away\")\n\t\t\tlastDistanceFromBlock:\n\t\t\tmc.postToChat(\"Colder\
    \ \" + \"\U0001F525\"*2 +\n\t\t\t\tstr(int(distanceFromBlock)) + \" blocks away\"\
    )\n\n\tlastDistanceFromBlock = distanceFromBlock\n\n\tsleep(2)\n\n\ttimeTaken\
    \ = time() - timeStarted\n\tmc.postToChat(\"Well done \" + str(int(timeTaken))\
    \ +\n\t\t\"seconds to find the diamond!\")\n\nif __name__ == \"__main__\":\n\t\
    main()\n```"
