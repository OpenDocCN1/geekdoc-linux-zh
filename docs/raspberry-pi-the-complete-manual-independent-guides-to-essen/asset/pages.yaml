  md: '# Projects




    # What you''ll need...


    +   * Keyboard & mouse

    +   * Internet connection


    # How to play Minecraft-Pi


    Play one of the greatest games ever made on your Raspberry Pi!


    # Did you know...


    stuffaboutcode.com is a great resource for fun and technical games and projects
    to do with Minecraft-Pi.


    Mojang''s *Minecraft* is probably the biggest game on the planet right now. The
    exploits of its main protagonist, a simple block character called Steve, fill
    hundreds of thousands (if not millions) of hours of YouTube video, and modifying
    and rekindling the game has become a cottage industry you can imagine. The game
    is available on just about any format you can imagine, from PCs to gaming consoles
    to mobile phones. It should probably come as no surprise that it’s also available
    on the Raspberry Pi. While at first glance Minecraft-Pi is a simplified version
    of the Pocket Edition (designed for tablets and smartphones), the Raspberry Pi
    edition is very special since it’s the only version of *Minecraft* that you allowed
    (and even encouraged) to hack yourself.


    We''re going to demonstrate how you can create your own fun Minecraft-Pi mini-games
    by exploiting the Python API in the next project over the page. In this article,
    however, we’ll explain how to install and play the game, and prepare your environment
    for easy hacking.


    ![](img/59caadfa348382a5c408c25137901e27_81_0.png)


    # Requirements


    01 Minecraft-Pi requires you to be running Raspberry Pi on your Pi, so if you
    don''t have one, go to rasberrypi.org and get one. You can find our guide to doing
    this that on pages 14-15 of this book. With the current version of Minecraft-Pi
    you need to have X Window loaded too. So, assuming your Raspberry Pi doesn''t
    boot into the graphical interface by default, once you''ve entered your username
    and password, at the command prompt you just need to type startx.'
