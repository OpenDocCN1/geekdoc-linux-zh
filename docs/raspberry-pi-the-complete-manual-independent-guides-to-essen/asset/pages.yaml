  md: '# The Raspberry Pi Store


    # Getting started


    specifically for the Pi. The Dev Tools are resources and tools to help developers,
    such as ready-made sound and graphics packs.


    The Tutorials are resource packs designed to educate you on various aspects of
    the Pi. The power of this feature is that these packages aren’t limited to flat
    text files and may contain other resources. For example, one tutorial demonstrates
    how to build a database program using the Python programming language along with
    SQL, a language for accessing databases (Fig 1).


    # My Library


    You can see what apps you have purchased and installed by clicking on the My Library
    tab. From here you can launch apps that you have installed, delete them from your
    system or reinstall them. This last feature is handy because it means that you
    can wipe and reinstall your Raspberry Pi without permanently losing the content
    you have obtained from the Store. This section also includes a running count,
    in icon form, of the applications that you currently have installed (Fig 2).


    If you click on your username, you can edit your profile (Fig 3). You can change
    your username from the one that the store assigns you when you first sign up and
    add a link to your website and a photo. Doing this helps you to establish a presence
    within the community when you’re giving feedback.


    # Uploading content


    Clicking on the Upload tab allows you to create a developer profile (Fig 4). This
    gives you a comprehensive homepage on the site that you can customise. You can
    choose the colour scheme and banner image, and you can connect it to your Facebook
    and Twitter streams. Note that once you have created a developer page and saved
    it, you cannot change the name in the future.


    From here, you can also add a product. When you add a product, you can specify
    that it will be publicly viewable or hidden and that it is finished or a work-in-progress.
    You can also specify the category of your project (game, application, tutorial,
    dev tools or media), add screenshots, box art, age rating, tags, description and
    prices. Once the project has gone public, you can view statistics relating to
    number of page views and downloads. You can also specify your preferred licence
    for the product. For example, you may opt to allow other people permission to
    remix what you have created.


    # The files themselves


    I’d like to get your hands dirty! Things run smoothly if you don’t directly manipulate
    the files themselves, but it’s handy knowing where they are if something goes
    wrong. Files relating to your profile and configuration are not designed to be
    edited by hand, but they can be found in your home directory (/index). A useful
    file for troubleshooting is (your home directory) /indexcy/previews/scripts.log.
    This file logs all state activity and can be an invaluable source of information
    when troubleshooting. Right-click on this file in order to open it in a file manager.


    The files that make up the applications themselves can be stored in various locations
    on your SD card, but many of the bigger, game and application-related files end
    up in /usr/local/bin/index/.


    ![](img/59caadfa348382a5c408c25137901e27_26_0.png)'
