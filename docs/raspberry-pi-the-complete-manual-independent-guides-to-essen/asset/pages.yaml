    \n> Most modern webcams are compatible with the Raspberry Pi, but check in a [support\
    \ forum](https://forum.raspberrypi.com) before you buy.\n\n# **Check compatibility**\n\
    Most USB cameras should work with your Pi out of the box, but it’s worth checking\
    \ compatibility first\n\n![](img/59caadfa348382a5c408c25137901e27_113_0.png)\n\
    \n# **Extra power**\nDepending on your webcam, you may need a powered USB hub\
    \ to get it working\n\n# ## Network investigation\n\nThe first job we need to\
    \ do is investigate the network your Raspberry Pi is on, so we can assign it a\
    \ static IP address. That way, we’ll always know where it is on the network so\
    \ we can access with ease.\n\n```\n```bash\npi@raspberrypi ~ $ ip addr show dev\
    \ eth0 | grep inet\n        inet 172.17.173.94/24 brd 172.17.173.255 scope global\
    \ eth0\npi@raspberrypi ~ $ ip route | grep default\ndefault via 172.17.173.1 dev\
    \ eth0\npi@raspberrypi ~ $ cat /etc/resolv.conf\nnameserver 172.17.173.1\n```\n\
    ```\n\n# ## Assign a static IP address\n\nNow that we have the network configuration,\
    \ we can assign a static IP address. Open `/etc/network/interfaces` in an editor\
    \ such as nano, and change the line:\n\n```\n```text\niface eth0 inet dhcp\nto\
    \ a configuration similar to our expert's. Reboot to load the new configuration.\n\
    \niface eth0 inet static\naddress   172.17.173.94\nnetmask   255.255.255.0\nnetwork\
    \   172.17.173.0\nbroadcast 172.17.173.255\n```\n```"
