  md: "![](img/59caadfa348382a5c408c25137901e27_85_0.png)\n\n# Creating the game\n\
    \n04\n\nIf you look at the start of our full code listing to the right you'll\
    \ see that our boilerplate imports have grown somewhat to include things like\
    \ *sleep* and *time*. All the imports listed beyond Vec3 are all part of Python's\
    \ standard library so will work straight away without having to install any more\
    \ packages. One of the less clear things about the early code is probably the\
    \ function *distanceBetweenPoints*. It's probably one of the most important parts\
    \ of the game and it's what calculates exactly how far away you are from the target\
    \ block in 3D space. The answer is returned as a square root of the constituent\
    \ parts. You don't need to understand how the function works, but it's great to\
    \ keep it in mind for future projects as it's sure to come in very handy indeed.\
    \ The next function uses the **random** library to place the diamond.\n\n# Full\
    \ code listing\n\n```\n#!/usr/bin/env python\nfrom mcpy.minecraft import Minecraft\n\
    from mcpy import block\nfrom mcpy.vec3 import Vec3\nfrom time import sleep, time\n\
    import random, math\nmc = Minecraft.create() # make a connection to the game\n\
    playerPos = mc.player.getPos()\n# function to quickly calc distance between points\n\
    def roundVec3 (vec3):\n    return Vec3 (int (vec3.x), int (vec3.y), int (vec3.z))\n\
    # function to quickly calc distance between points\ndef distanceBetweenPoints\
    \ (point1, point2):\n    xd = point2.x - point1.x\n    yd = point2.y - point1.y\n\
    \    zd = point2.z - point1.z\n    return math.sqrt((xd*xd) + (yd*yd) + (zd*zd))\n\
    \ndef random_block(): # create a block in a random position\n    randomBlockPos\
    \ = roundVec3(playerPos)\n    randomBlockPos.x = random.randrange(randomBlockPos.x\
    \ - 4, randomBlockPos.x + 50)\n    randomBlockPos.y = random.randrange(randomBlockPos.y\
    \ - 5, randomBlockPos.y + 5)\n    randomBlockPos.z = random.randrange(randomBlockPos.z\
    \ - 4, randomBlockPos.z + 50)\n```"
