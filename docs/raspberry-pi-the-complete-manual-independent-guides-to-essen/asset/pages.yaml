  md: '# Projects


    # What you''ll need...


    Raspioan

    www.raspberrypi.org/downloads

    Python

    www.python.org/doc

    Pygame

    www.pygame.org/docs

    Art assets

    opengameart.org


    > **Did you know...?**

    > Space Invaders is one of the most cloned games in the world. It makes a great
    first project for game-programmers.


    +   Setting up dependencies

    +   **01** You''ll get much more from the exercise if you download the code (`git.io/8Qsk-w`)
    and use it for reference as you create your own animations and sound effects.
    Regardless of whether you just want to simply preview and play or walk-through
    the code to get a better understanding of basic game creation, you''ll still goings
    to need to satisfy some basic dependencies. The two key requirements here are
    Pygame and Git, both of which are installed by default on up-to-date Raspberry
    Pi installations. That''s easy!


    # Pivaders part 2: graphics and sound


    # Pivaders Pt 2: graphics & sound


    This time we''ll expand our Space Invaders clone to include immersive animation
    and sound


    We had great fun creating our basic Space Invaders clone, Pivaders, in the previous
    guide. Pygame''s ability to group, manage and detect collisions thanks to the
    Sprite class really made a great difference to our project, not just in terms
    of code length, but in simplicity too. If you missed the first part of the project,
    you can find the v1.01 code listing on GitHub via `git.io/c8VTBg`, while you can
    find version v1.02 of the code, including all the images, music and sound effects
    we''ve used at `git.io/8Qsk-w`.


    To help keep our project code manageable and straightforward (as our projects
    grow keeping your code easy to follow becomes increasingly harder) we integrated
    a few animation methods into our Game class and opted to use a sprite sheet. Not
    only does it make it very easy to draw to the screen, but it also keeps the asset
    count under control and keeps performance levels up, which is especially important
    for the Raspberry Pi. We hope you have fun using our techniques to add animation
    and sound to your project!


    +   Downloading pivaders

    +   **02** Git is a superb version control solution that helps programmers safely
    store their code and associate files. Not only does it help you retain a full
    history of changes, it means you can ''clone'' entire projects to use and work
    on from places like `github.com`. To clone the version of the project we created
    for this tutorial, go to your home folder from the command line (cd) and type:

    +   `git pull https://github.com/russb8/pivaders.git`

    +   This creates a folder called pivaders.


    +   Navigating the project

    +   **03** Within pivaders sit a licence, readme and a second pivaders folder.
    This contains the main game file, pivaders.py, which launches the application.
    Within the data folder you''ll find subfolders for both graphics and sound assets,
    as well as the font we''ve used for the title screen and scores. To make Pivaders
    a test-drive, simply enter the pivaders subdirectory (cd pivaders/pivaders) and
    type:

    +   `python pivaders.py`

    +   Use the arrow keys to steer left and right and the space bar to shoot. You
    can quit with the Escape key.'
