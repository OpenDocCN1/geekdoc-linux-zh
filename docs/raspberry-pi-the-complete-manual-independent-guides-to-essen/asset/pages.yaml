  md: '# # Set up your Raspberry Pi


    Learn what goes where in your brand new Raspberry Pi with our easy-to-follow guide


    While it looks daunting, setting up the Raspberry Pi for day-to-day use is actually
    very simple. Like a TV or a normal computer, only certain cables will fit into
    the specific slots, and the main job really is making sure you''ve got plugged
    in what you need at any one time. The Raspberry Pi itself doesn''t label much
    of the board. However, most good cases will do that for you anyway -- if you decide
    to invest in one.


    +   - **Power adapter**

    +   The Raspberry Pi is powered using a micro USB cable, much like a lot of modern
    Android phones. It can be powered off of a laptop or computer, but to make the
    most out of it, a proper mains adapter -- like this one -- is ideal

    +   - **Monitor**

    +   The Raspberry Pi is capable of displaying a 1920 x 1080 output -- otherwise
    known as 1080p. Some modern monitors allow you to plug HDMI straight into them,
    just like TVs do. However you may need an adapter if your TV doesn''t.


    +   - **USB hub**

    +   There are only a limited number of USB ports on a Raspberry Pi (just one,
    if you have Model 3A). To get around this you''ll need a USB hub. It''s important
    to get a powered one, as the Pi can''t supply enough juice on its own

    +   - **Case and accessories**

    +   A case is not necessary to use the Pi correctly, but a decent one can keep
    it well protected from dust, and make it easier to move while in operation. You
    will need an SD card, however, of at least 4GB.


    +   - **Keyboard and mouse**

    +   Like any computer, you''ll need a keyboard and mouse for any standard PC-style
    operations you do with the Raspberry Pi. The mouse has the keyboard, better, same
    with the mouse, as some special ones need additional software


    ![](img/59caadfa348382a5c408c25137901e27_11_0.png)


    ![](img/59caadfa348382a5c408c25137901e27_11_1.png)


    ![](img/59caadfa348382a5c408c25137901e27_11_2.png)


    ![](img/59caadfa348382a5c408c25137901e27_11_3.png)'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Set up your Raspberry Pi


    # Getting started


    ![](img/59caadfa348382a5c408c25137901e27_12_0.png)


    # Analogu e output


    For setups that don''t use HDMI, the yellow video output is available. To use
    this with sound, you''ll need to use the small black port next to it, with headphones,
    or an auxiliary cable to pipe out the audio


    # USB


    All the performance you want to connect via USB – USB hub, keyboard, mouse, USB
    storage — is plugged in here. Ensure you have external power to the USB Hub if
    you have to use one though


    # SD card


    The SD card goes in underneath the Raspberry Pi board. This will hold your operating
    system that runs the Raspberry Pi. The PI OS needs to be set up from another computer
    before using it though.


    # Digital output


    The HDMI ports a the main video (and audio output of the Raspberry Pi, allowing
    you to do display video on the display at a resolution of up to 1080p. TVs that
    support it will also pick up the audio automatically though.


    # Networking


    The Raspberry P does not come with wireless internet, and while you can add a
    USB adapter it''s usually easier to plug in an ethernet cable. This will plug
    into the back of your router on the other end and give you internet and access
    to your home network.


    # Cabling


    Make sure you have the right selection of cables, such as an ethernet cable for
    networking and internet, and an HDMI or Video cable for video out. The HDMI can
    handle audio, but the video-only will require an additional auxiliary cable'
  merge: -1
  img_proc: true
