  md: "# Getting started\n\n# The starter kit\n\n![](img/59caadfa348382a5c408c25137901e27_9_0.png)\n\
    \n# # The starter kit\n\nThere's more to your Pi than first meets the eye. Here\
    \ are some vital peripherals to get you started\n\nIn order to get the very best\
    \ experience from your Raspberry Pi, you're going to have to get hold of a few\
    \ extras on top of the actual Raspberry Pi board itself. For example, you're going\
    \ to need a keyboard and mouse with which to enter commands and navigate. While\
    \ it's possible to do projects without a keyboard and mouse attached, you'll need\
    \ them for the initial setup. An SD card is also an important purchase -- it's\
    \ where the operating system lives. Perhaps you'll need a Wi-Fi adapter of some\
    \ description, or maybe just a length of network cable. Then there's the basic\
    \ electronics side of the Raspberry Pi, what would you need to start some of the\
    \ beginner electronics and control experiments? Clearly, there's more to the Raspberry\
    \ Pi than some might think.\n\nWhen we say peripherals, we of course mean other\
    \ hardware that can be attached and utilised by the Raspberry Pi. They could be\
    \ something as simple as a decent HDMI or they could be the latest, greatest bespoke\
    \ gadgets that enhance your project capabilities. There is an entire world of\
    \ possibilities available for the Raspberry Pi, from robot arms to remote-controlled\
    \ helicopters... The only limits are the hardware available and your imagination!\n\
    \n> **Did you know...**\n> \n> Most online retailers sell packages (complete with\
    \ all the accessories you might need - even preloaded SD cards)\n\n# Keyboard\
    \ and mouse\n\n![](img/59caadfa348382a5c408c25137901e27_9_1.png)\n\nLet's start\
    \ with the most basic of components, the keyboard and mouse. Generally speaking,\
    \ virtually any USB keyboard and three-button scroll mouse will work with the\
    \ Raspberry Pi, and although for some projects you won't even need a keyboard\
    \ and mouse, you'll need them for initial set-up.\n\n# SD card\n\n![](img/59caadfa348382a5c408c25137901e27_9_2.png)\n\
    \nThe SD card is the storage device that contains the Raspberry Pi operating system,\
    \ whichever you decide to be. There can be bought pre-installed with the OS, or\
    \ blank from a number of sources. SD cards come in a variety of sizes and speeds,\
    \ but for the basics a card of 2GB or over is acceptable."
  merge: -1
  img_proc: true
- pgno: 10
  md: '# The starter kit


    # Getting stated


    ![](img/59caadfa348382a5c408c25137901e27_10_0.png)


    # Power cable


    The Raspberry Pi uses a standard micro USB connector for its power input, which
    should run at 5V. In most cases a micro USB to USB cable will suffice, of which
    one end can be plugged into a laptop or PC USB port. An Android phone charger
    should also work perfectly (5.25V 1500mA).


    ![](img/59caadfa348382a5c408c25137901e27_10_1.png)


    # Case


    Although not totally essential, placing your Raspberry Pi in a case will obviously
    protect it and prevent its delicate GPIO pins from being bent. Aside from accidental
    damage, the case can make your Raspberry Pi a more attractive or striking unit,
    for use as a living room media centre for example.


    ![](img/59caadfa348382a5c408c25137901e27_10_2.png)


    # Video output


    You''ll find two video output ports, a HDMI port and an RCA Socket. HDMI is more
    than likely to be the primary video-output connector for most users, but if you
    don''t have HDMI on your TV or monitor, then the RCA video-out port can be used
    to connect TVs, monitors or to a SCART cable.


    ![](img/59caadfa348382a5c408c25137901e27_10_3.png)


    # Powered USB hub


    Extra USB ports are worth considering as an early purchase with your Pi. Once
    you''ve connected a keyboard and mouse you''ll realise why! Using a powered USB
    hub is important, to stop any power being drained from the Pi, and allow you to
    attach the likes of an external hard drive, for example.


    ![](img/59caadfa348382a5c408c25137901e27_10_4.png)


    # Raspberry Pi camera board


    This is a custom designed add-on board that attaches to one of the Raspberry Pi''s
    on-board sockets via a flexible cable. It''s extremely small, but remarkably powerful,
    having a native resolution of five megapixels and supporting 1080p video. It''s
    essentially a smartphone camera for the Pi!


    ![](img/59caadfa348382a5c408c25137901e27_10_5.png)


    # USB Wi-Fi adaptor


    Using a USB Wi-Fi adaptor will free up the location of the Raspberry Pi. You''ll
    no longer have to run an Ethernet cable from your router, and it could be used
    for more advanced projects where running a wired internet connection isn''t a
    valid option. Just make sure it''s Linux-friendly when you buy it.'
  merge: -1
  img_proc: true
