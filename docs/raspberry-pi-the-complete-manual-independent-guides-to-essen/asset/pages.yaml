  md: "# Pivaders part 2: graphics and sound\n\n# Loading the sprite sheet\n\n**07**\
    \ Since we're inheriting from the Sprite class to create our Player class, we\
    \ can easily alter how the player looks on screen by changing Pygame/docs. First,\
    \ we need to load our ship sprite sheet with pygame.image.load(). Since we made\
    \ our sheet with a transparent background, we can append convert_alpha() to the\
    \ end of the line so the ship frames render correctly (without any background!).\
    \ We then use subsurface to set the initial Player image to the middle ship sprite\
    \ on the sheet. This is set to self.ani_pos, which has an initial value of 5.\
    \ Changing this value will alter the ship image drawn to the screen: '0' would\
    \ draw it leaning fully left, '11' fully to the right.\n\n# Animation flags\n\n\
    **08** Slightly further down the list in the initialising code for our Game class,\
    \ we also set two flags for our player animation: self.ani_left and self.ani_right.\
    \ As you'll see in the Control method of our Game class, we use these to flag\
    \ when we want animates to happen with True and False. It also allows us to automatically\
    \ animate the player sprite back to its natural resting state (otherwise the ship\
    \ will continue to look as it's flying left when it has stopped).\n\n# The animation\
    \ method\n\n**09** We use flags again in the code for the player. animate_player().\
    \ Here we use nested if statements to control the animation and physically set\
    \ the player image. It states that if the animate_right flag is True and if the\
    \ current animation position is different to what we want, we incrementally increase\
    \ the ani_pos variable and set the player's image. The Else statement then animates\
    \ the ship sprite back to its resting state and the same logic is then applied\
    \ in the opposite direction.\n\n```\nGameState.end_game = False  \nGameState.start_screen\
    \ = True  \nGameState.vector = 8  \nGameState.shoot_bullet = False\n\ndef control(self):\
    \  \n for event in pygame.event.get():  \n if event.type == pygame.QUIT:  \n GameState.start_screen\
    \ = False  \n GameState.end_game = True  \n if event.type == pygame.KEYDOWN \\\
    \  \n or key == pygame.K.ESCAPE:  \n if GameState.start_screen:  \n GameState.start_screen\
    \ = False  \n GameState.end_game = True  \n self.kill_all()  \n else:  \n GameState.start_screen\
    \ = True  \n \n self.keys = pygame.key.get_pressed()  \n if self.keys[pygame.K.LEFT]:\
