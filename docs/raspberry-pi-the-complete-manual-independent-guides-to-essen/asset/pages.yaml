- pgno: 74
  md: '# Control an LED using GPIO


    **Projects**


    ![](img/59caadfa348382a5c408c25137901e27_74_0.png)


    **Breadboard**

    The breadboard, or prototype board, provides an easy-to-use and selfless environment
    for creating and changing your development circuits.


    **Breadboard wire**

    A must for any budding electrical engineer, these make-to-make and male-to-female
    wires make for fast and easy circuit building.


    **GPIO header**

    This provides a mechanism for both gathering input and providing output to electrical
    circuits, enabling reactive program design.


    **Coloured LED**

    Different coloured LEDs are a great way to physically see which part of the software
    is running and help you understand the program flow.


    # The Pi''s pins


    01

    Before we dive into writing code, let''s take a look at the layout of the pins
    on the Pi. If you have your Pi in a case, take it out and place it in front of
    you with the USB ports on the right. Over the next few steps we''ll look at some
    of the uses you''ll encounter when using the GPIO port.


    Pi revision 1 or 2?

    02

    Depending on when you purchased your Pi, you may have a revision 1 or revision
    2 model. The GPIO layout is slightly different for each, although they do have
    the same functionality. Here we have a revision 1; revision 25 became available
    towards the end of 2012.


    # Pin numbers


    03

    If you take a look at the top right of the board you''ll see a small wire label,
    P1: This is pin 1 and above it is pin 2. To the right of pin 1 is pin 3, and above
    3 is 4. This pattern continues until you get to pin 26 at the end. As you''ll
    see in the next step, some pins have important uses.


    Pin uses

    04

    Pin 1 is 3V3, or 3.3 volts. This is the main pin we will be using in this guide
    to provide power to our LED. Pins 2 and 4 are 5V. Pin 6 is the other pin we will
    use here, which is ground. Other ground pins are 9, 14, 20 and 25. You should
    always ensure your project is properly grounded.


    # GPIO pins


    05

    The other pins on the board are GPIO (General Purpose Input/Output) These are
    used for other tasks that you need to do as your projects become more complex
    and challenging. Be aware that the USB power supply doesn''t offer much scope
    for powering large items.


    # Basic LED lighting


    06

    Okay, so let''s get down to business and start making something. Firstly, get
    your breadboard, two wires, a 220Ω resistor and an LED. Note the slightly bent
    leg on one side of the LED; this is important for later on. Make sure your Pi
    is unplugged from the mains supply.'
  merge: -1
  img_proc: true
- pgno: 75
  md: "# Control an LED using GPIO\n\n# Wiring the board\n\n07 Plug one wire into\
    \ the number 1 pin, and the other end into the breadboard. Note that it doesn't\
    \ matter where on the breadboard you plug it in, but make sure there are enough\
    \ empty slots around it to add the LED and resistor to. Now get another wire ready.\n\
    \n# Adding another wire\n\n08 Place the female end of the wire into pin number\
    \ 6 (ground) and the other end into the breadboard, making sure to leave room\
    \ for the resistor, depending on how large it is. Next, get your resistor ready.\
    \ You can use a little higher or lower than 270 ohms, but not using a resistor\
    \ at all will likely blow the LED.\n\n# Add the resistor\n\n09 Next we need to\
    \ add our resistor. Place one end next to the ground wire on the breadboard, and\
    \ the other one silt below the 3V3 wire connection. This will sit next to the\
    \ LED when we add it in a second. Note that there is no correct or incorrect way\
    \ to add a resistor.\n\n# Add the LED\n\n10 Grab your LED and place the 'bent'\
    \ leg next to the 3V3 wire in the breadboard. Place the other leg next to the\
    \ resistor leg opposite the ground wire. This now completes the circuit and we\
    \ are ready to test out our little task.\n\n# Power it up\n\n11 Now get your micro-USB\
    \ cord and either plug the main end into the wall, or plug it into a computer\
    \ or laptop port (and powered on!). You should see the LED light up. If not, then\
    \ check your connections on the breadboard or Pi, or try a different LED.\n\n\
    # Setting up programming environment\n\n12 Now, we need to be able to do a little\
    \ bit more than just turn a light on — we want to be able to control it via code.\
    \ Set up a new Raspbian installation (a guide to this is found on page 278). You\
    \ don't need a GUI for this — it can be all done via the terminal if you so wish.\
    \ Before starting, it's best to check everything is up-to-date with:\n\n```\n\
    ```\nsudo apt-get dist-upgrade\n```\n```\n\n# Open up terminal\n\n13 Assuming\
    \ we want to use the GUI, rather than SSH into the Pi, open up a new terminal\
    \ window by double-clicking on the XTerm icon. We need root access to control\
    \ the LEDs, so either enter `su now`, or remember to prefix any commands with\
    \ sudo.\n\n```\n```\nsu\nsudo\n```\nfollowed by password or add `sudo` to the\
    \ start of each command\n```\n\n# Downloading GPIO library\n\n14 There is a handy\
    \ GPIO library that makes manipulating the GPIO pins a breeze. From within your\
    \ terminal window, use wget to download the tarball file, then extract it using\
    \ `tar`. This will give us all the files in a new directory:\n\n```\n```\nwget\
    \ https://pypi.python.org/packages/source/R/RPI.GPIO/RPI.GPIO-0.5.2a.tar.gz\n\
    tar zxf RPI.GPIO-0.5.2a\ncd RPI.GPIO-0.5.2a\n```\n```\n\n# Install the library\n\
    \n15 Now we need to install the library. This is simply a case of using Python's\
    \ install method, so we need the dev version of Python. Make sure you are in the\
    \ directory of the library before running this command:\n\n```\n```\nsudo apt-get\
    \ install python-dev\nsudo python setup.py install\n```\n```\n\n# Importing the\
    \ library in a script\n\n16 Create a new Python script. Next import the main GPIO\
    \ library and we'll put it in a try-except block. Save the file using Ctrl-X and\
    \ choosing 'yes':\n\n```\n```\ncd /\ncd Desktop\nsudo nano gpio.py\ntry:\n   \
    \ import RPi.GPIO as GPIO\nexcept RuntimeError:\n    print(\"Error importing GPIO\
    \ lib\")\n```\n```"
  merge: -1
  img_proc: true
- pgno: 76
  md: "# Control an LED using GPIO\n\n![](img/59caadfa348382a5c408c25137901e27_76_0.png)\n\
    \n> Did you know…\n> \n> The official Python docs are a great resource for beginners\
    \ and professionals alike. http://python.org/doc.\n\n# Test the script\n\n**17**\
    \ Now to make sure that the script imported okay, we just need to run the python\
    \ command and then tell it the name of the script that we just created. If all\
    \ goes well, you shouldn’t see any error messages. Don’t worry if you do, though.\
    \ Just go back through the previous steps to check everything is as it should\
    \ be.\n\n```\nsudo python gpio.py\n```\n\n# Set GPIO mode\n\n**18** Reload the\
    \ script in nano again. We will then set the GPIO mode to BOARD. This method is\
    \ the safest for a beginner and will work whichever revision of the Pi you are\
    \ using. It’s best to pick a GPIO convention and stick to it – it saves confusion\
    \ later on.\n\n```\nsudo nano gpio.py\nGPIO.setmode(GPIO.BOARD)\n```\n\n# Set\
    \ pin mode\n\n**19** A pin has to be defined as either an input or an output before\
    \ it can work. This is simplified in the GPIO library by calling the GPIO.setup\
    \ method. You then pass in the pin number, and then either GPIO.OUT or GPIO.IN.\
    \ As we want to use an LED, it’s an output. You’ll be using these conventions\
    \ frequently, so learn them as best you can so they soak in.\n\n```\nGPIO.setup(12,\
    \ GPIO.OUT)\n```\n\n# Using PWM\n\n**20** The next step is to tell the pin to\
    \ output and then set a way of escaping our program. Here we call the GPIO class\
    \ again and then the PWM method, passing in the pin number, the second value is\
    \ the frequency in hertz – in this case, 0.5.\n\n```\np = GPIO.PWM(12, 0.5)\n\
    p.start(1)\ninput('Press return to stop: ')\np.stop()\nGPIO.cleanup()\n```\n\n\
    # Adjusting PWM\n\n**21** To add a timer to the LED so it fades out, we first\
    \ need to import the time library and then set the 12 pin to have 50Hz frequency\
    \ to start off with.\n\n```\nimport time\nimport RPi.GPIO as GPIO\nGPIO.setmode(GPIO.BOARD)\n\
    GPIO.setup(12, GPIO.OUT)\np = GPIO.PWM(12, 50) # channel=12 frequency=50Hz\np.start(0)\n\
    ```\n\n# Add the fade\n\n**22** Then we add in another try/except block, this\
    \ time checking what power the LED is at – and once it reaches a certain level,\
    \ we reverse the process. To run this code, simply save it then and sudo python\
    \ gpio.py.\n\n```\nwhile 1:\n    for dc in range(0, 101, 5):\n        p.ChangeutyCycle(dc)\n\
    \        time.sleep(0.1)\n    for dc in range(100, -1, -5):\n        p.ChangeutyCycle(dc)\n\
    \        time.sleep(0.1)\n    except KeyboardInterrupt:\n        pass\n\np.stop()\n\
    GPIO.cleanup()\n```\n\n![](img/59caadfa348382a5c408c25137901e27_76_1.png)\n\n\
    > “We’ll set the GPIO mode to BOARD. This will work whichever revision of the\
    \ PI you are using”"
  merge: -1
  img_proc: true
