  md: '# Beginner''s guide to nano


    Projects


    # Open nano


    ![](img/59caadfa348382a5c408c25137901e27_38_0.png)


    01 Open the terminal, or enter the command line, and simply type **nano** This
    will open a blank new file. From here you can create a simple text file such as
    a list, or create a system file, script or piece of code. How the system interprets
    your file depends on what you write and how you save it.


    # Save and continue


    ![](img/59caadfa348382a5c408c25137901e27_38_1.png)


    02 Once you''ve finished with **nano**, you can save/write out using Ctrl+O. All
    shortcuts and functions such as this are done using Ctrl and a letter key. You''ll
    ask you what **nano** to save the file under. Whatever you name it, it will be
    saved in the directory you opened **nano** from unless you specify a path.


    # Opening files


    ![](img/59caadfa348382a5c408c25137901e27_38_2.png)


    03 To edit already existing files, you''ll first need to know their location and
    name. To open them in **nano**, type the following:


    ```

    `$ nano /path/FileName`

    - For example, to edit files you would type:

    ```


    ```

    `$ nano /etc/fstab`

    ```


    # Save and exit


    ![](img/59caadfa348382a5c408c25137901e27_38_3.png)


    04 Once you''ve finished modifying the file and need to get on with the next task,
    you can press Ctrl+X to exit **nano**. It will ask if you want to save any modifications,
    which just requires a ''Y'' to confirm. If you want to exit without saving changes,
    you can just use N. To cancel before making a decision, use Ctrl+C.


    # Copy and paste


    ![](img/59caadfa348382a5c408c25137901e27_38_4.png)


    05 This is more of a terminal-specific command, but it can be used just as well
    in **nano**. While you cannot use our mouse to navigate around the file in **nano**,
    you can highlight text in the same way you would in a graphical text editor. Once
    highlighted, pressing Ctrl+Shift+C will copy any text. Ctrl+Shift+V will paste
    the copied text.


    # Insert from file


    ![](img/59caadfa348382a5c408c25137901e27_38_5.png)


    06 If you want to directly insert the contents of another file, there''s a quick
    way to do so without needing to use copy and paste. Typing Ctrl+R and entering
    the path to the file will insert it into the spot your cursor is at.


    # Advanced navigation


    ![](img/59caadfa348382a5c408c25137901e27_38_6.png)


    07 You''ve probably been using the arrow keys to move one space at a time left,
    right, up or down. There are other ways to move around the file, though. Using
    Ctrl+M will act the same **nano** as the Home key does in a graphical editor,
    moving the cursor to the start of the line. Same with Ctrl+E moving you to the
    end like the End key. Ctrl+Y is page down, and Ctrl+Y is page up.


    # Searching a file


    ![](img/59caadfa348382a5c408c25137901e27_38_7.png)


    08 Sometimes you''ll be looking for a specific line or phrase in a large text
    file. Instead of reading every line, you can use the **nano** search line with
    Ctrl+W. Entering the search term will begin looking through the document, and
    once you''ve finished you can press Ctrl+C to exit the search.


    # Extra help


    ![](img/59caadfa348382a5c408c25137901e27_38_8.png)


    09 There are many more functions available in **nano**. For a full list of commands,
    you can use Ctrl+G, which lists all the shortcuts and what they do. The caret
    symbol (^) in this list denotes the use of Ctrl on your keyboard.'
  merge: -1
  img_proc: true
