- pgno: 121
  md: '# Projects


    # Program a Space Invaders clone


    # Setting up dependencies


    **01** If you''re looking to get a better understanding of programming games with
    Python and Pygame, we strongly recommend you copy the Paversders code in this
    tutorial into your own program. It''s great practice and gives you a chance to
    tweak elements of the game to suit you, be it a different ship image, changing
    the difficulty or the ways the alien waves behave. If you just want to play the
    game, that''s easily achieved too, though. Either way, the game''s only dependency
    is Pygame, which (if it isn''t already) can be installed from the terminal by
    typing:


    ```

    sudo apt-get install python-pygame

    ```


    # Installation


    **02** For Pyaders we''ve used Git, a brilliant form of version control used to
    safely store the game files and retain historical versions of your code. Git should
    already be installed on your Pi, if not, you can acquire it by typing:


    ```

    sudo apt-get install git

    ```


    As well as acting as caretaker for your code, Git enables you to clone copies
    of other people''s projects so you can work on them, or just use them. To clone
    Paversds, go to your home folder in the terminal (cd ~), make a directory for
    the project (mkdir paversds), enter the directory (cd paversds) and type:


    ```

    git pull https://github.com/russb78/paversds.git

    ```


    # Testing Paversds


    **03** With Pyaders installed and the project cloned to your machine (you can
    also find the .zip on this issue''s over DVD – simply unpack it and copy it to
    your home directory to use it), you can take it for a quick test drive to make
    sure everything''s set up properly. All you need to do is type python paversders.py
    from within the paversders directory in the terminal to get started. You can start
    the game using the space key, shoot with the same button and simply use the left
    and right arrows on your keyboard to move your ship left and right.


    # Creating your own clone


    **04** Once you''ve tackled up to a good high score (anything over 2,000 points
    is respectable) and got to know our simple implementation, you''ll get more from
    following along with and exploring the code and our brief explanations of what''s
    going on. For those who want to make their own project, create a new project folder
    and use either IDLE or Leafpad (or perhaps Intellij/CLion) to create and save
    a .py file of your own.


    # Global variables & tuples


    **05** Once we''ve imported the modules we need for the project, there''s quite
    a long list of variables in block capitals. The capitals denote that these variables
    are constants (or global variables). These are important numbers that never change
    – they represent things referred to regularly in the code, like colours, block
    sizes and resolution. You''ll also notice that colours and sizes hold multiple
    numbers in braces – these are tuples. You could use square brackets (to make them
    lists), but we use tuples here since they''re immutable, which means you can''t
    reassign individual items within them. Perfect for constants, which aren''t designed
    to change anyway.


    # Classes – part 1


    **06** A class is essentially a blueprint for an object you''d like to make. In
    the case of our project, it contains all the required info, from which you can
    make multiple copies (we create a player instance in the make_player() method
    halfway through the project). The great thing about the classes in Paversders
    is that they inherit lots of capabilities and shortcuts from Python''s Sprite
    class, as denoted by the pygame.sprite.Sprite found within the braces of the first
    line of the class. You can read the docs to learn more about the Sprite class
    via


    ```

    www.pygame.org/docs/ref/sprite.html

    ```


    ![](img/59caadfa348382a5c408c25137901e27_121_0.png)


    > “We''ve tried to use many features of Python, which is designed to make the
    creation of games and interactive applications easier”'
