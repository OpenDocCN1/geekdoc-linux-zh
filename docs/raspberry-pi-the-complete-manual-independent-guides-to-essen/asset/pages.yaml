  md: "# Projects\n\n# Create a three-colour lamp\n\n# What you'll need...\n\n+  \
    \ - Arduino Uno\n+   - Breadboard\n+   - Set of prototyping cables\n+   - RGB\
    \ LED (cathode)\n+   - 3x potentiometers\n+   - 3x 330 Ohm resistors\n\n![](img/59caadfa348382a5c408c25137901e27_91_0.png)\n\
    \n# Create a three-colour lamp\n\nUse the power of Arduino to do otherwise impossible\
    \ projects with just a Raspberry Pi alone\n\nIn the previous project we showed\
    \ you how you can use an Arduino microcontroller to help the Raspberry Pi become\
    \ proficient in new skills that can drastically increase the reach of your projects.\
    \ With the aid of the extra 12 pins capable of PWM and analogue input, you could\
    \ easily add multiple servos, analogue sensors and even add input devices like\
    \ joysticks.\n\nIn this project we're going to demonstrate this by creating a\
    \ three-colour lamp that employs three potentiometers (twisty knobs) to control\
    \ each of the three colours in an RGB LED light. With it you can make most of\
    \ the colours of the rainbow.\n\n# Program with Arduino\n\n# Full code listing\n\
    \n01 Assuming you've followed the steps from the previous two pages your Raspberry\
    \ Pi and Arduino Uno are ready to go. You'll also need the components from the\
    \ list above. The resistors should be 330-ohm ideally, but can be of a higher\
    \ resistance if needed. A quick visit to www.cpc.co.uk should fill any holes with\
    \ missing components.\n\n```\n```python\n#!/usr/bin/env python\n\nfrom nappy import\
    \ Arduino\nfrom time import sleep\n\n# set LED pins - these go to the Digital\
    \ pins of your Arduino\nredPin = 3\ngreenPin = 6\nbluePin = 9\n# set pot pin numbers\
    \ - these go to the (A)Analogs pins of your Arduino\npot_c_Pin = 0\npot_g_Pin\
    \ = 1\npot_b_Pin = 2\n\n#set three coloured pins as outputs\nfor pins in (redPin,\
    \ greenPin, bluePin):\n    Arduino.pinMode(pins, Arduino.OUTPUT)\n\n# set pot\
    \ pins as inputs\nfor pins in (pot_c_Pin, pot_g_Pin, pot_b_Pin):\n    Arduino.pinMode(pins,\
    \ Arduino.INPUT)\n\ndebug = False\n```\n```\n\n# Populate the breadboard\n\n02\
    \ The circuit for this project might look a little complicated at first glance,\
    \ but actually there's very little going on. As you'd expect, we want to control\
    \ the LED light using PWM-enabled pins (to have fine-grained control of the brightness)\
    \ and the potentiometers (pots) are being read by the analogue pins."
