  md: "# Projects\n\n# Build a portable internet radio\n\n# Full code listing\n\n\
    We import the RPi.GPIO library and set it to use BCM numbering system\n\n```\n\
    ```\n#!/usr/bin/env python\nimport time\nimport sleep\nimport os\nimport RPi.GPIO\
    \ as GPIO\n```\n\n```\n\nHere we set up pins 23 and 24, which control the radio\
    \ station selection\n\n```\n```\n# 1. Found loads of BBC Radio streams at from\
    \ http://bbestreams.com/\nGPIO.setmode(GPIO.BCM)\nGPIO.setup(23, GPIO.IN)\nGPIO.setup(24,\
    \ GPIO.IN)\n```\n\n```\n\nHere we say that if the button is pressed for 23, run\
    \ the command below\n\n```\n```\nwhile True:\n if GPIO.input(23)==1:\n os.system('sudo\
    \ killall mplayer')\n os.system('mplayer -playlist http://bb...uk/radio/listen/live/1.asx')\n\
    ```\n\n```\n\nHere we see the script kill any open Mplayer processes and then\
    \ load the radio station\n\n```\n```\nif GPIO.input(24)==1:\n os.system('sudo\
    \ killall mplayer')\n os.system('mplayer -playlist http://bb...uk/radio/listen/live/r6.asx\
    \ &')\n sleep(0.1)\nGPIO.cleanup()\n```\n\n```\n\n# Set up the software\n\n+ \
    \  04 Copy radio.py from www.instructurs.co.uk/utlateral-files to your home directory.\
    \ You can re-link to it: at www.instructurs.co.uk/user/later no. Now open a terminal\
    \ and switch to root, and edit your network interface config by doing the following\n\
    +   1nano /etc/network/interfaces\n\n# Configure the radio to start at boot\n\n\
    +   06 In a terminal, as root, navigate to /etc/init.d/ and then create a file\
    \ called radio using nano\n+   nano radio\n+   \n+   In that file, type in the\
    \ following:\n+   #!/bin/bash\n+   bedrobbe snd_bcm2835\n+   amixer cset numid=3\
    \ 1\n+   python /home/pi/radio.py\n+   \n+   This loads the kernel module for\
    \ the sound card Amixer sets the output to the 3.5mm headphone jack. That's what\
    \ I mean, HDMI is 8. Last it calls the Python script.\n\n# Raspi-config\n\n+ \
    \  08 In a terminal as root, use raspi-config to change the boot behaviour of\
    \ your Pi. We don't want to load the desktop, a terminal is all we need, so the\
    \ project will not require a screen for future use. Once complete, reboot the\
    \ Pi and watch as the output from boot whitewashes the screen.\n\n# Wi-Fi configuration\n\
    \n+   05 We want the Pi to automatically connect to your router via Wi-Fi during\
    \ boot. Edit your /etc/network/interfaces file to resemble this:\n+   \n+   auto\
    \ lo\n+   iface lo inet loopback\n+   iface eth0 inet dhcp\n+   allow-hotplug\
    \ wlan0\n+   auto wlan0\n+   \n+   iface wlan0 inet dhcp\n+   wpa-conf\"ssid\"\
    \n+   \n+   wpa-psk \"password\" Replace the 'ssid' and \"password\" with your\
    \ own details, but keep the quotation marks.\n\n# Make it executable\n\n+   07\
    \ Save and exit radio in /etc/init.d/ by pressing Ctrl-X and then answer yes to\
    \ the prompt. Now make radio executable by typing(as root): chmod 755 radio Then,\
    \ as root, register radio to start on boot by typing in terminal: update-rc.d\
    \ radio defaults\n\n# First test\n\n+   09 Once the Pi has finished loading, press\
    \ one of the buttons on your keyboard. After a few seconds you should hear the\
    \ audio come through the headphone jack. That's it, you have a wireless internet\
    \ radio. Why not add a mute function using a mapping. Example: manpages.example\
    \ mutetime mappings/syslog.man/lan/syslogd.html and another monitor screen. You\
    \ can even add an LCD screen: www.piblog.com/20/12/17/interfacing-16x2-lcd-with-raspberry-pi-html)\
    \ to show the station details."
