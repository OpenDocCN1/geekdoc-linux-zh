- pgno: 16
  md: '![](img/59caadfa348382a5c408c25137901e27_16_0.png)


    # # A new world


    Getting your Raspberry Pi into the desktop isn''t the only thing you can do on
    the command line, though. There''s a whole world of functionality built into the
    command line; in fact, most of the graphical programs you''re using are just executing
    these commands in such a way. You don''t have to leave the comfort of the desktop
    environment to perform these commands either, as all Raspberry Pi operating systems
    will come with an application known as a Terminal emulator.


    This creates a window where a command can be written in the same way that we launched
    the desktop, and use the exact same commands (Fig 1). On Raspbian, look for the
    app LX Terminal in the Accessories section of the menu and click on it. If you''ve
    had to use **startx** to get into the desktop, then we can now fix that before
    continuing. In the terminal, enter:


    ```

    $ rpi-config

    ```


    Here''s the initial setup screen (Fig 2). From here you can enable the desktop
    on boot (Fig 3), and even update the firmware and add support for the official
    Raspberry Pi camera module. This allows you to modify Raspbian without having
    to reinstall again.


    You won''t be using those two commands very often, though, so is there practical
    use for delving into the command line? Very much so. For starters, Raspbian doesn''t
    have an official package manager. This is a program that allows you to browse
    the available software for the operating system, similar to the Pi Store.


    However, there''s other software available to Raspbian that you can''t get through
    the store. You also can''t specifically update the Pi software either, and all
    of this can be fixed using the command line.


    Fig 2. Access rpi-config to change settings such as boot-to-desktop or adding
    a camera module


    ![](img/59caadfa348382a5c408c25137901e27_16_1.png)


    Fig 3. Change the default selection to desktop for the next time you use the Raspberry
    Pi'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# # Getting started


    # # Command line basics


    ![](img/59caadfa348382a5c408c25137901e27_17_0.png)


    ![](img/59caadfa348382a5c408c25137901e27_17_1.png)


    # ## Software for all


    The first thing you''ll want to do is let Raspbian know exactly what''s available
    online. It''s a very simple task; all you need to do is:


    ```

    `$ sudo apt-get update`

    ```


    This will run down a list of online repositories (or repos) that contain the software
    that Raspbian uses. Once it''s finished, the command-line prompt will pop up again
    waiting for your next command. As this is the first time we''re doing it, you''ll
    likely need to update the current software on your Raspberry Pi. You can do that
    with the command:


    ```

    `$ sudo apt-get upgrade`

    ```


    It may ask you to confirm the upgrade, in which case type Y and then press Enter.
    What we''re doing both times is using the command-line package manager APT (apt-get)
    to first check the repos, and then upgrade packages according to that (Fig 4).
    The first command, sudo, allows it to run the apt-get task as an administrator,
    and is used in a lot of other command-line operations.


    To install software you use install instead of update or upgrade, followed by
    the name of the package. For example, with the mathematical programming language,
    you can install it with:


    ```

    `$ sudo apt-get install wolfram-engine`

    ```


    # ### Did you know...


    > > You can use the "Tab" to complete commands. Just start typing and hit tab.
    If you can''t, see what you hit `Enter` to `Finish`'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Command line basics


    # Move and create


    Installing and updating are just a couple of the many things you can do in the
    command line. You can also browse the entire file system, move files, create folders
    and delete items. All of these are very simple operations.


    When you first open the terminal, it will open up in your home folder. While you
    can''t specifically tell that it is, you can display exactly what kind of files
    are in the directory with (Fig 5):


    ```

    $ ls

    ```


    The tilde sign (〜) is used to denote the home folder and can be used for navigating
    around the file system. To navigate, we''ll be using the cd command, followed
    by the location you want to move to. This can be done like so:


    ```

    $ cd /home/pi/Downloads

    ```


    This will move you to the Downloads directory. As we were starting off in the
    home folder to begin with, we actually only needed to do this:


    ```

    $ cd Downloads

    ```


    It''s context sensitive and knows to look in the directory it''s already in. There''s
    another trick you can use so you don''t have to remember the exact name of the
    path – the command line or terminal will try to autocomplete the phrase if you
    press the Tab key while something is only partially typed. Try the cd command
    again, but try pressing Tab when you''ve only written ‘Down'':


    Finally, there are some quick commands you can use to manipulate files. Individual
    files can be copied using the command cp, followed by the filename and the new
    location like so:


    ```

    $ cp file.txt ~/Documents/file.txt

    ```


    You can also use this to rename files by doing:


    ```

    $ cp file.txt otherFile.txt

    ```


    The original file can then be deleted by using the rm command:


    ```

    $ rm file.txt

    ```


    Want to create a new folder? Use cd to move to the directory you need to add a
    folder to, and then use mkdir followed by the name you want to give the folder:


    ```

    $ mkdir NewFolder

    ```


    There''s a lot more you can do with the command line, but these are the very basics.
    As you use Linux more and more, you''ll be confronted with tasks that need the
    command line, and through this process you''ll learn just how much can be accomplished
    when you work like a streetwise movie hacker.


    # Getting started


    Did you know . . .


    You can always return to your home folder in the command line by typing cd and
    pressing Enter


    > “The command line or terminal will try to autocomplete the phrase if you press
    the Tab key while something is partially typed”


    ![](img/59caadfa348382a5c408c25137901e27_18_0.png)


    Fig 5. There are many simple command line tools that can help you browse and use
    your system'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# The Raspbian desktop


    ![](img/59caadfa348382a5c408c25137901e27_19_0.png)


    Although the Raspberry Pi’s operating system is closer to the Mac than Windows,
    it’s the latter that the desktop most closely resembles


    It might seem a little alien at first glance, but using Raspbian is hardly any
    different to using Windows (barring Windows 8 of course). There’s a menu bar,
    a web browser, a file manager and no shortage of desktop shortcuts of pre-installed
    applications. As you’d expect, we simply double-click them to get started...


    # Desktop shortcuts


    A number of the pre-installed apps have icons on the desktop. To run the associated
    apps, simply double-click on the icon. The icons can be moved and dropped into
    other locations. Click-and-drag to move them. There are icons for a variety of
    tasks - from apps such as Python and Scratch for programming, to Milford for web
    browsing, LX Terminal for using commands to the system directly, to reference
    materials. Icons can be removed or even deleted if you don’t want them on the
    desktop any more. Right-click over any icon to see the options available for it.


    # Menu bar


    Just like Windows’ Start menu, click on the corner to bring up a menu of programs
    and options. The main categories include accessories, apps for educational use,
    graphics, internet (including some alternative browsers), programming, a general
    assortment of apps and utilities, and the system tools. You will find that some
    programs you download from the Pi Store (see [Link]) and InfoCliff will appear
    here. There are also a set of preference options for configuring how certain elements
    of the system work, such as keyboard and mouse. The Run option is just like the
    one in Windows - it opens a command-line interpreter to run commands.


    # File manager


    The computer would be complete without a file manager. Click here to bring it
    up. Files can be copied, renamed and deleted by dragging to the cursor in the
    viewer. You can also create tabs/windows in the file browser or open further ones.
    Folder locations can be bookmarked for ‘Save Access’ and ‘File Manager’ can be
    viewed as icons in an enlarged list. If you need to do any command line work,
    the current graphical folder can also be opened in the terminal (click the current
    folder’s ‘Open in Terminal’); use the file manager as a shortcut to Midori, open
    in a new window, and a dual desktop feature.


    > “It might seem a little alien at first glance, but using Raspbian is hardly
    any different to using Windows”'
  merge: -1
  img_proc: true
