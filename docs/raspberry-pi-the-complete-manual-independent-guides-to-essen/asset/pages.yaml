    \nin this tutorial\n\n![](img/59caadfa348382a5c408c25137901e27_41_0.png)\n\n#\
    \ Static IP address\n\n+   1.  The first step for us is to make\n+   sure that\
    \ the Raspberry Pi\n+   \n+   has a static IP address. Basically, an IP\n+   \n\
    +   address is a group of numbers that\n+   \n+   your network assigns to devices\
    \ in\n+   \n+   order to tell them apart. To set up a\n+   \n+   static IP address,\
    \ simply double-click\n+   \n+   LXTerminal and type the following\n+   \n+  \
    \ and then press Enter:\n+   \n+   `sudo nano /etc/network/`\n+   `interfaces`\n\
    \n# Static IP part 2\n\n+   2.  This file controls the IP\n+   addressing for\
    \ the Pi. You need\n+   \n+   to scroll down to the `iface eth0` line\n+   \n\
    +   and remove DHCP and replace it with\n+   \n+   static. Now, on the line directly\
    \ below,\n+   \n+   enter the IP address that you want\n+   \n+   your Pi to have,\
    \ along with the\n+   \n+   subnet mask and the gateway:\n+   \n+   ```\n+   address\
    \ 192.168.1.93\n+   \n+   netmask 255.255.255.0\n+   \n+   gateway 192.168.1.254\n\
    +   ```\n\n![](img/59caadfa348382a5c408c25137901e27_41_1.png)\n\n# Static IP part\
    \ 3\n\n+   3.  After you've entered those\n+   details, exit nano by pressing\n\
    +   \n+   Ctrl+Q, followed by Y to accept the\n+   \n+   changes, and then press\
    \ Enter a\n+   \n+   couple of times to get back to the\n+   \n+   command prompt\
    \ in the terminal. You\n+   \n+   can now either reboot your Pi, or type\n+  \
    \ \n+   the following into the terminal:\n+   \n+   `sudo /etc/init.d/network\
