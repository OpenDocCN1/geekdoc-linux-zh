- pgno: 72
  md: "# Make music with Sonic Pi\n\n# Projects\n\n# Starting with Sonic Pi\n\n**02**\
    \ Sonic Pi is located in the Education category in the menus. Open it up and you'll\
    \ be presented with something that looks like an IDE. The pane on the left allows\
    \ you to enter the code for your project, with proper syntax highlighting for\
    \ its own style of language. When running, an info pane details exactly what's\
    \ being played via Sonic Pi -- and any errors are listed in their own pane as\
    \ well, for reference.\n\n# Set the beat\n\n**04** For any piece of music, you'll\
    \ want to set the tempo. We can start by putting `1.itb_tempo 200` at the start\
    \ of our code. We can test it out by creating a string of midi notes using `play_pattern`:\n\
    `play_pattern`\n`[40,25,45,25,50,50]`\n\nThis will play, pretty, bell notes at\
    \ those tones at the tempo we've set. You can create longer and shorter strings,\
    \ and also change the way they play.\n\n# Your first note\n\n**03** Our first\
    \ thing to try on Sonic Pi is simply being able to play a note. Sonic Pi has a\
    \ few defaults preset, so we can get started with:\n`play 50`\nPress the Play\
    \ button and the output window will show you what's being played. The pretty,\
    \ bell sound is the default tone for Sonic Pi's output, and 50 determines the\
    \ pitch and tone of the sound.\n\n![](img/59caadfa348382a5c408c25137901e27_72_0.png)\n\
    \n![](img/59caadfa348382a5c408c25137901e27_72_1.png)\n\n# Advance your melody\n\
    \n**05** We can start making more complex melodies by using more of Sonic Pi's\
    \ functions. You can change the note type by using `with_synth`, reverse a pattern,\
    \ and even create a finite loop with the x.times function, to end and signify\
    \ the start and end of the loop. Everything is played in sequence before repeating,\
    \ much like an if or while loop in normal code.\n\n# Full code listing\n\n```\n\
    `with_tempo   200\nplay_pattern  [40,25,45,25,50,50]\n2.times do\n  with_synth\
    \ \"beep\"\n    play_pattern  [40,25,45,25,50,50]\n    play_pattern  [40,25,45,25,50,50].reverse\n\
    \  end\nplay_pad \"saws\", 3\nin_thread do\n  with_synth \"fm\"\n    6.times do\n\
    \      if rand < 0.5\n        play 30\n      else\n        play 50\n      end\n\
    \      sleep 2\n    end\n  end\n2.times do\n  play_synth \"pretty_bell\"\n   \
    \ play_pattern  [40,25,45,25,50,50]\n    play_pattern  [40,25,45,25,50,50].reverse\n\
    \  end`\n```\n\n# Playing a concert\n\n**06** Using the `in_thread` function,\
    \ we are able to create another thread for the Sonic Pi instance, and have several\
    \ lines of musical code play at once instead of in sequence.\nWe have made it\
    \ create a series of notes in a random sequence, and have them play alongside\
    \ extra notes created by the position and velocity of the mouse using the `play_pad`\
    \ function."
  merge: -1
  img_proc: true
