  md: '# What you''ll need... Rapsbian www.raspberrypi.org/downloads Internet connection


    Did you know... You can network with other Linux, Windows and Mac OS X computers
    with Samba – it''s totally cross-platform.


    # Share your files with Samba


    # Share your files with Samba


    Configure your Pi to share the contents of the home folder over your home network


    Regardless of whether you plan to set your Raspberry Pi up as a media centre,
    gaming machine or full-on development platform, the ability to share and access
    the contents of your Pi from other machines is very useful.


    While the Raspberry Pi is very well configured, by default it doesn''t include
    the ability to share the contents of your home folder with your local network.
    As you''ll see from this guide, though, it''s not too difficult to accomplish
    thanks to Samba and can help you access your scripts, media or documents from
    any other machine.


    ![](img/59caadfa348382a5c408c25137901e27_45_0.png)


    # Update & install Samba


    Open a terminal window and type the following into the terminal to update the
    Raspbian repository and then install Samba


    ```

    sudo apt-get update && sudo apt-get install samba samba-common-bin

    ```


    The operation itself shouldn''t take too long. Just make sure that you''re connected
    to the internet before you start


    # Load smbc.conf


    With the core packages installed, you now need to tell Samba how you want it to
    work. You do this by putting your preferred settings in Samba''s configuration
    file. This file is called smbc.conf and it''s located in the /etc/samba folder.
    While it''s easy to locate it using the file managers, it''s easier to open and
    edit it from the command line. Type the following into the terminal window to
    open it with nano:


    ```

    1 sudo nano /etc/samba/smb.conf

    ```


    # Initial setup


    Take a look through the file. There''s lots of information here and it seems a
    bit daunting, but there are only a handful of changes and additions to make. Firstly,
    you need to make sure you have assigned the correct workgroup. Unless your network
    has been configured differently, it will likely be called WORKGROUP. To find the
    workgroup setting, press Ctrl+W and type workgroup, then press Enter – this will
    take you to the first occurrence of the word ''workgroup''. Use the arrow keys
    to move between lines – the mouse doesn''t work in nano.


    ![](img/59caadfa348382a5c408c25137901e27_45_1.png)


    # Windows support


    If you have Windows computers in your network, you''ll need to ensure WINS support
    is allowed. Assuming you''re working from the default smbc.conf configuration
    file, you''ll find the flag for WINS support a few lines below the workgroup line.
    Edit it so it looks like this:


    ```

    wins support = yes

    ```'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Share your files with Samba


    Projects


    ![](img/59caadfa348382a5c408c25137901e27_46_0.png)


    # Add your share


    **05** Next you need to find the section of the file called Share Definitions.
    Again, you can use the key combination Ctrl+W to open the search function, then
    type ‘share definitions’ and press Enter to be taken directly to it— it’s located
    right towards the end of the document.


    Go to the very end of the document and add the following.


    ```

    ```​

    [pi]

    path=/home/pi

    only guest = no

    browseable = yes

    writable = yes

    ```

    ```


    # Set up passwords


    ```

    ```​

    create mask = 0777

    director mask = 0777

    public = no

    ```

    ```


    **06** You have finished editing the /samba.conf file now. So, to save and exit,
    press Ctrl-X, then press Y to save, and Enter to exit.


    With this configuration, a layer of password security is in place, so we now need
    to set up a Samba password to use with it. In your terminal window, type the following
    command:


    ```

    `smbpasswd -a pi`

    ```


    You’ll be prompted to enter and confirm a new password. This is now your username
    and password for accessing your files.


    # Restart Samba


    **07** The final step is simply to restart Samba for your new settings to take
    effect.


    At the terminal, type the following command to do so


    ```

    `sudo /etc/init.d/samba restart`

    ```


    The next time you look at your home network from another machine, you’ll see your
    Raspberry Pi’s home folder listed as a share'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Back up your Pi


    # Back up your Pi


    Take the initiative and back up your Raspberry Pi to make sure you never lose
    files again


    # What you''ll need...


    +   - A second computer

    +   - External storage


    # Did you know...


    SD cards don''t last forever, so always make sure you''ve got a backup of your
    files and your entire OS.


    ![](img/59caadfa348382a5c408c25137901e27_47_0.png)


    While the Raspberry Pi is a very solid piece of kit, failure can happen, so it''s
    best to be well prepared and keep your files safe.


    The good news is that the Pi''s files are all kept externally on the SD card.
    If your Pi breaks, everything will still be available on the SD card and accessible
    from elsewhere. The SD card is still susceptible to problems, though. There are
    a number of ways to back up a Pi. The methods can be broken down into two main
    categories: saving the important files and creating an exact copy of the state
    of the SD card. The former involves having copies of files elsewhere, while the
    latter has you create the same kind of image that you''d normally write to the
    SD card when installing Raspbian or other Pi-operating systems.


    # Important files


    To save important files, we need to create a copy on an external source, such
    as external hard drive or another PC. One of the best methods to do this doesn''t
    even involve a Pi! all you need is a PC or laptop with a card reader and you''re
    good to go.


    Turn off your Pi, unplug it and remove the SD card from the slot. Find the SD
    card reader on your PC and slot it in.


    The main file system of the SD card can be read by Linux PCs by default, and a
    Windows or Mac computer once you''ve installed a program that lets it read the
    ext file system, such as Ext2Fsd. On Windows, the SD card will be listed with
    the rest of the drives under My Computer (Fig 1). On Linux and Mac, it will be
    listed wherever storage is shown on the menus and file managers.


    Once you''ve found the SD card on here, open it up and navigate to home and then
    pi. This is where the Documents, Downloads, Desktop and other directories can
    be found. All you need to do is select the files you want to copy and move them
    to a secure directory on your PC or a connected external hard drive.'
