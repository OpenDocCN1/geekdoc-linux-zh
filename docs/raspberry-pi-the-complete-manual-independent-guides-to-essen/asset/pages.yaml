  md: "# Create a three-colour lamp\n\n\n\n```\n```python\ndef get_pot\\s():\n   \
    \ \"\"\"\n    Graba reading from each of the pot pins and\n    send it to a tuple\
    \ to be read by the colour mixer\n    \"\"\"\n    r = Arduino.analogRead(pot_r_Pin)\
    \ / 4\n    Arduino.delay(1)\n    g = Arduino.analogRead(pot_g_Pin) / 4\n    Arduino.delay(1)\n\
    \    b = Arduino.analogRead(pot_b_Pin) / 4\n    Arduino.delay(1)\n    return r,\
    \ g, b\n\ndef colour_mixing():\n    \"\"\"\n    Call get_pot\\s() and set\n  \
    \  the colour pins accordingly\n    \"\"\"\n    r, g, b = get_pot\\s()\n    Arduino.analogWrite(redPin,\
    \ r)\n    Arduino.analogWrite(greenPin, g)\n    Arduino.analogWrite(bluePin, b)\n\
    \    Arduino.delay(1)\n\ndef close_pins():\n    \"\"\"\n    Close pins to quit\
    \ cleanly (doesn't work with a 'for\n    loop' despite the pins happily initialising\
    \ that way!)\n    \"\"\"\n    Arduino.digitalWrite(redPin,Arduino.LOW)\n    Arduino.digitalWrite(greenPin,Arduino.LOW)\n\
    \    Arduino.digitalWrite(bluePin,Arduino.LOW)\n\ndef main():\n    \"\"\"\n  \
    \  Mix the colours using three pots.\n    Ctrl+C cleans up the pins and exits.\n\
    \    \"\"\"\n    try:\n        print \"Adjust the pots to change the colours\"\
    \n        while True:\n            colour_mixing()\n            sleep(.02) # debug\n\
    \            print \"Red: {rd} | Green: {gd}\n            | Blue: {bd}\".format(r,\
    \ g, b)\n    except KeyboardInterrupt:\n        close_pins()\n        print \"\
    nPin\\s closed\"\n\nif __name__ == \"__main__\":\n    main()\n```\n```\n\n# Connect\
    \ the Arduino and Raspberry Pi\n\nAssuming you don't plan to wire up the code\
    \ immediately yourself, you can grab it from the website and drop it in your home\
    \ folder. With the USB cable from the Arduino plugged into the Raspberry Pi, run\
    \ the code with the following\n\n```\n```bash\n$ python RGB_Mixer.py\nAdjust the\
    \ pots for the corresponding\ncolour of the LED and the colours\nshould change.\
    \ If the pots are\nadjusting the wrong colours, just swap\nthe wires over.\n```\n\
    ```\n\n# Setting up the pins\n\nAs we demonstrated in the last project, it's easy\
    \ to name and set the Arduino pins with Nangy – in our code we've used two simple\
    \ for loops. The default value below simply points the values of each pot to the\
    \ terminal – very useful for debugging or getting a better handle on the code.\n\
    \n# Functional operation\n\nThere are only really three main functions to worry\
    \ about. `get_pot\\s()` reads in the analog-pin value associated with each pot\
    \ and returns a tuple of the value for red, green and blue respectively. This\
    \ is used by `colour_mixing()` to assign values to each of the associated PWM\
    \ pins to change the colours of the LED.\n\n# Keeping things running\n\nThe `main()`\
    \ function is where the other functions are set to work. Inside the function,\
    \ we're asking Python to mix the colours forever, except if we press Ctrl+C –\
    \ initiating the keyboard interrupt. Since we want to clean up first, this action\
    \ will with trigger `close_pins()` turning any pins attached to the LED off."
