  md: "# Use an accelerometer\n\nUse an accelerometer\n\nAdding tilt technology to\
    \ your next Raspberry Pi project is easier than you might think\n\nIn this project\
    \ we’ll be using an ADXL345 accelerometer kit to create a prototye controller\
    \ for a Space Invaders-style game we’re working on. The kit is only £20, but does\
    \ require about 15 minutes of basic soldering. Beyond that, the physical setup\
    \ is really quite simple. We’ll be placing the ADXL345 on our breadboard ‘controller’\
    \ and using just four wires to communicate with the Raspberry Pi’s GPIO pins using\
    \ I2C. You’ll have a full set-up guide available from the retailer. Let’s start\
    \ by making sure your Pi is up to date. Open a terminal window and type: sudo\
    \ apt-get update && sudo apt-get upgrade\n\n# Full code listing\n\n```\n```\n\
    import pygame\nfrom sdl2_1345 import ADXL345\n\nadxl345 = ADXL345() # Initialise\
    \ the accelerometer\npygame.init() # Initialise Pygame\n\n# Create a screen of\
    \ 800x600 resolution\nscreen = pygame.display.set_mode((800, 600))\n\n# Name the\
    \ game window\n# Set the mouse visibility and start an FPS clock\npygame.display.set_caption('ADXL345\
    \ Space Tect - Press ESC or quit')\nclock = pygame.time.Clock()\n\n# Load the\
    \ images we're using from:\nbackground_image = pygame.image.load('Space-Background-40_40').convert()\n\
    player_image = pygame.image.load('ship8.png').convert()\n\n# We can use colour\
    \ key method to remove the background from the ship\nplayer_image.set_colorkey((0,\
    \ 0, 0))\n\nplayer_position = [50, 350] # Initial ship starting point\ngame_over\
    \ = False # Decide if the game should end\n```\n```\n\n# What you'll need...\n\
    \n+   ADXL accelerometer\n+   shop.pimoroni.com\n+   \n+   Latest Raspbian Image\n\
    +   www.raspberrypi.com/downloads\n+   \n+   Breadboard\n+   shop.pimoroni.com\n\
    +   \n+   Male-to-female prototyping cables\n+   shop.pimoroni.com\n+   \n+  \
    \ 30M soldering iron\n+   shop.pimoroni.com\n\n# Install i2c-tools\n\n01 In a\
    \ terminal, type sudo apt-get install i2c-tools followed by sudo nano /etc/modprobe.d/raspberrypi.conf.\
    \ This will open a file in nano – locate the line blacklist i2c-bcm2708 and comment\
    \ it out so it looks like this\n\nblacklist i2c-bcm2708\n\nSave with Ctrl-X, then\
    \ press Y and Enter to exit. Finally, edit the /etc/modules file with nano, adding\
    \ the line i2c-bcm2708 to i2c-dev to ensure it loads every time. How: Reboot to\
    \ finish the operation.\n\n# Connect the hardware\n\n02 We’ll also need to install\
    \ the smbus Python library. Type sudo apt-get install python-smbus in the terminal.\
    \ Then wire up the accelerometer to the Pi with male-to-female prototyping cables.\
    \ The connect pins are marked on the Pi for where to plug them into. The Pi.\n\
    \n# Projects"
