  md: '# Build an Onion Pi and browse privately


    # Incming Wi-Fi


    **09** We need to set up the Wi-Fi adaptor to be both static and accept incoming
    signals. First


    ```

    ```

    $ sudo nano /etc/network/interfaces

    ```


    ```


    Put a # in front of iface wlan0 and following lines with wpa roam, iface default
    and any other facing wlan0.


    # Static IP


    **10** Now give the wireless interface a static IP – after the line allow-hotplug
    wlan0, enter the following:


    ```

    ```

    iface wlan0 inet static

    address 192.168.42.1

    netmask 255.255.255.0

    ```


    ```


    Save and exit, then set wlan0’s address with


    ```

    ```

    $ sudo ifconfig wlan0

    192.168.42.1

    ```


    ```


    ![](img/59caadfa348382a5c408c25137901e27_117_0.png)


    # WLAN creation


    **11** We need to create a new file that holds all the information for our wireless
    network. We are going to make it password protected so that only the people we
    want to can access it. To create the file, start with


    ```

    ```

    $ sudo nano /etc/hostapd/

    hostapd.conf

    ```


    ```


    Once this is complete you can continue to the next step...


    > > “The Onion Pi combines Raspbian and Tor. This will keep you anonymous online.
    A handy feature in a time of privacy concerns all around the web”


    # WLAN configuration


    **12** Assuming you’ve followed step 11 to open hostapd.conf: Write


    ```

    ```

    interface=wlan0

    driver=rtl819xdrv

    ssid=<access point name>

    hw_mode=e

    channel=1

    macaddr_acl=0

    auth_algs=1

    ignore_broadcast_ssid=0

    wpa=2

    wpa_passphrase=<password>

    wpa_key_mgmt=WPA-PSK

    wpa_pairwise=TKIP

    rsn_pairwise=CCMP

    ```


    ```


    # Hostapd


    **13** After saving and exiting, we need to edit hostapd to point it to this new
    file. Open it with


    ```

    ```

    $ sudo nano /etc/default/

    hostapd

    ```


    ```


    And then find the line #DAEMON_CONF=" . Remove the #, and change it to


    ```

    ```

    DAEMON_CONF="/etc/hostapd/

    hostapd.conf"

    ```


    ```


    # Network addressing


    **14** Setting up a NAT will allow multiple clients to connect. To do this, open
    a terminal window (if one isn’t already open) and type the following:


    ```

    ```

    $ sudo nano /etc/sysctl.conf

    ```


    ```


    And add to the bottom of the file


    ```

    ```

    net.ipv4.ip_forward=1

    ```


    ```


    Save, exit, and then finish by running


    ```

    ```

    $ sudo sh -c ''echo 1 > /

    proc/sys/net/ipv4/ip_forward''

    ```


    ```


    # IP tables


    **15** Run the following three commands to make sure the internet connection is
    forwarded correctly. Make sure you copy them carefully into the terminal.


    ```

    ```

    sudo iptables -t nat -A

    POSTROUTING -o eth0 -j

    MASQUERADE

    sudo iptables -A FORWARD

    -i eth0 -o wlan0 -m state

    --state RELATED,ESTABLISHED

    -j ACCEPT

    sudo iptables -A FORWARD -i

    wlan0 -o eth0 -j ACCEPT

    ```


    ```


    # Apply configuration


    **16** So that this still continues to work even after the Raspberry Pi has been
    rebooted, Type


    ```

    ```

    $ sudo sh -c ''iptables-save

    > /etc/iptables.ipv4.nat''

    ```


    ```


    Then add to the end of /etc/network/interfaces


    ```

    ```

    Up iptables-restore < /etc/

    iptables.ipv4.nat

    ```


    ```'
