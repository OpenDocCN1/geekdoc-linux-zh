  md: "# Projects\n\n\n\nWhat you'll need...  \nBreadboard  \nLEDs  \nButtons  \n\
    Resistors  \nJumper wires  \nScratchGPIO3\n\n# Get interactive  \nwith Scratch\n\
    \nExperiment with physical computing by using  \nScratch to interact with buttons\
    \ and lights on your Pi\n\nScratch is a very simple visual programming language,\
    \ commonly  \nused to teach basic programming concepts to learners of any age.\
    \  \nIn this project we'll learn how to light up an LED when a button  \nis pressed\
    \ in Scratch, and then change a character's colour when  \na physical button is\
    \ pressed using the General Purpose Input/  \nOutput (GPIO) pins on your Raspberry\
    \ Pi. With these techniques you  \ncan make all manner of fun and engaging projects,\
    \ from musical  \nkeyboards to controllers for your Scratch games and animations.\
    \  \nYou'll need some components for this guide. Just search online for  \n'Raspberry\
    \ Pi GPIO basic kit' to get you started.\n\n> Below Scratch can be used to  \n\
    > do Internet Of Things projects  \n> with a few tweaks\n\n![](img/59caadfa348382a5c408c25137901e27_65_0.png)\n\
    \n> \"In this project we'll learn how to light  \n> up an LED when a button is\
    \ pressed in  \n> Scratch using the GPIO pins\"\n\n# Installing the required \
    \ \nsoftware packages\n\n+   01 Log in to the RasPiBian system with  \n+   the\
    \ username `Pi` and the password `raspberry`. Start the  \n+   LXDE desktop environment\
    \ using  \n+   the command `startx`. Next, open  \n+   up xTerminal and then type\
    \ the  \n+   following commands:\n\n```\nwget http://liamfraser.co.uk/  \nlud/Install_scratchgpio3.sh\
    \  \nchmod +x install_scratchgpio3.sh  \nauto bash install_scratchgpio3.sh\n```\n\
    \n+   01 This will create a special version  \n+   of Scratch on your desktop\
    \ called  \n+   ScratchGPIO3. This is a normal version  \n+   of Scratch with\
    \ a Python script that  \n+   handles communications between  \n+   Scratch and\
    \ the GPIO. ScratchGPIO  \n+   was created by smples  \n+   (simpleyc.wordpress.com)."
