    \n# # Use graphical  \ninstallations\n\nWould you prefer a graphical interface\
    \ to install new programs? If so, then read on...\n\nIf you're new to Linux, you\
    \ may find using its built-in Apt package management tool a bit intimidating and\
    \ confusing. The apt-get command is used for installing applications through the\
    \ internet, connecting to the remote servers – called repositories – which house\
    \ the programs as packages. But it is used through the terminal command prompt,\
    \ which can be daunting, so we need an alternative: a desktop environment interface\
    \ method of getting hold of packages.\n\nThis is where Synaptic comes in. Synaptic\
    \ is a friendly-looking graphical interface to the apt-get terminal command which\
    \ allows you to manage your application installations, and removals, through the\
    \ already familiar desktop environment. Think of it as a kind of online shop where\
    \ you can pick and choose the programs you want and have them downloaded and installed\
    \ onto your Raspberry Pi without you having to drop into the terminal.\n\n![](img/59caadfa348382a5c408c25137901e27_29_1.png)\n\
