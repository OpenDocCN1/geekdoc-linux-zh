  md: "# Code your own Twitter bot\n\n# Projects\n\n# Creating an access token\n\n\
    **03** Go to the Settings tab and change the Access type from 'Read only' to 'Read\
    \ and Write'. Then click the 'Update this Twitter application's settings' button.\
    \ Next we create an access token. Click the 'Create my access token' button! If\
    \ you refresh the details page, you should have a consumer key, a consumer secret\
    \ and access token, plus an access token secret. This is everything we need to\
    \ authenticate with Twitter.\n\n# Authenticating with Twitter\n\n**04** We're\
    \ going to create our bot as a class, where we authenticate with Twitter in the\
    \ constructor. We take the tokens from the previous steps as parameters and use\
    \ them to create an instance of the Twython API. We also have a variable, last_ran,\
    \ which is set to the current time. This is used to check if there are new tweets\
    \ later on.\n\n# Retweeting a user\n\n**05** The first thing we need to do is\
    \ get a list of the user's latest tweets. We then loop through each tweet and\
    \ get its creation time as a string, which is then converted to a datetime object.\
    \ We then check that the tweet's time is newer than the time the function was\
    \ last called -- and if so, re-tweet the tweet.\n\n# The main section\n\n**06**\
    \ The final section is straightforward. We create an instance of the bot class\
    \ using our tokens, and then go into an infinite loop. In this loop, we check\
    \ for any new retweets from the users we are monitoring (we could run the retweet\
    \ task with different users), then update the time everything was last run, and\
    \ sleep for five minutes.\n\n```\ndef timestr_to_datetime(timestr):\n    # Convert\
    \ a string like Sun 09 09:29:55 +0000\n    # 2013 to a datetime object. Get rid\
    \ of the timezone\n    # and make the year the current one\n    timestr = '{0}\
    \ {1}'.format(timestr[:19], datetime.now().year)\n\n    # We now have Sat Nov\
    \ 09 09:29:55 2013\n    return datetime.strptime(timestr, '%a %b %d %H:%M:%S %Y')\n\
    ```\n\n```\ndef retweet_task(self, screen_name):\n    # We tweets from a user's\
    \ screen name, but we've not seen it from a user\n    print 'Checking for new\
    \ tweets from {0}'.format(screen_name)\n\n    # Get a list of the users latest\
    \ tweets\n    timeline = self.api.get_user_timeline(screen_name = screen_name)\n\
    \n    # Loop through each tweet and check if it was\n    # posted since we were\
    \ last called\n    for tweet in timeline:\n        tweet_creat_at = bot.timestr_to_datetime(tweet.created_at)\n\
    \        if tweet_time > self.last_ran:\n            print \"Retweeting {0}\"\
    .format('{:id}')\n            self.api.retweet(id = '{:id}')\n```\n\n```\nif __name__\
    \ == \"__main__\":\n    # The consumer keys can be found on your application's\n\
    \    # Details page located at https://dev.twitter.com/apps/<Your_Oauth_Settings>\n\
    \    c_key =\n    c_secret =\n\n    # The access tokens can be found on your application's\n\
    \    # Details page located at https://dev.twitter.com/apps (located under 'Your\
    \ access token')\n    a_token =\n    a_token_secret =\n\n    # Create an instance\
    \ of the bot class\n    twitter = bot(c_key, c_secret, a_token, a_token_secret)\n\
    \n    # Tweet anything new every 5 minutes\n    while True:\n        # Update\
    \ the time after we've done a retweet task so we're\n        # only retweeting\
    \ new stuff\n        twitter.retweet_task('lunUserMag')\n        twitter.last_ran\
    \ = datetime.now()\n        time.sleep(5 * 60)\n```"
