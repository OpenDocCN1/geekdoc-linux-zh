    need to install. Picamera (picamera.readthedocs.org) is a pure Python interface
    to the Raspberry Pi camera module and is a must for all camera module owners.
    Pygame (www.pygame.org), on the other hand, ensures our images can be displayed
    on demand. The project in its current state is merely a proof-of-concept for a
    bigger stop motion animation application. It''s not perfect either, but goes to
    prove that the Raspberry Pi in tandem with the Camera board and a bit of know-how
    can offer amazing results!


    Keep an eye on http://github.com/russb78/pi-motion for updates on the project
    in the future...


