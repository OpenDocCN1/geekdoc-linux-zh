- pgno: 28
  md: '# Update and upgrade


    01  Getting hold of a package on the Raspberry Pi involves dropping into the command-line
    terminal, via the LXTerminal icon on the desktop, and entering a few commands.
    But before we do that, we need to make sure the system is up to date. Enter the
    following into the terminal


    ```

    sudo apt-get update

    sudo apt-get upgrade

    or

    sudo apt-get update && sudo apt-get upgrade

    ```


    # Search for a package


    02  The apt-get command (Advanced Package Tool) is the key to downloading and
    installing packages on the Raspberry Pi. In the previous instance, we updated
    the existing packages and system, upgraded any that needed it, and updated the
    current package list. Now, let’s search the list of server packages for available
    games.


    ```

    apt-cache search game | less

    ```


    ![](img/59caadfa348382a5c408c25137901e27_28_0.png)


    # Apt searching


    03  The current list you find yourself in is the name of all the packages labelled
    as ‘games’ from the available server. In the list, the part before the hyphen
    tells you the name of the package, which is what you will need to know to be able
    to install it. Use the arrow keys/up/down to navigate, press ‘Q’ to exit.


    # Install and use packages


    # Installing a package


    04  Using the up and down arrow keys, navigate the list. If you find something
    you like the look of, say Angry Drunken Dwarves, remember the name of the package,
    in this case ‘angrydd’, and press ‘Q’ to exit the list. To install the package,
    enter the following in the terminal:


    ```

    sudo apt-get install angrydd

    ```


    # Executing the package


    05  The result of the previous command should be the successful download and installation
    of the game, Angry Drunken Dwarves. To execute the newly installed package, you
    can either run it from the LXDc Menu under Games>Angry Drunken Dwarves, or by
    typing in the following into the terminal


    ```

    angrydd

    ```


    ![](img/59caadfa348382a5c408c25137901e27_28_1.png)


    # Remove a package


    06  This installing of packages is perfectly fine, and you can see just how powerful
    a command Apt really is. But, what if you want to remove a package?


    Using the Apt command again, let’s say we want to completely remove all trace
    of Angry Drunken Dwarves from the Raspberry Pi.


    ```

    sudo apt-get --purge remove angrydd

    Enter ‘Y’ to accept the removal.

    ```


    # Getting started


    # Apt Easter eggs


    07  The Apt command is a short, non-menu-driven variant of the Aptitude command.
    This command has a ring history in Linux, and as a result has some rather special
    ‘features’, also known as Easter eggs. Purrley for a little bit of fun, type in
    the following commands and see the results:


    ```

    aptitude moo

    aptitude -v moo

    aptitude --vv moo

    aptitude -vvv moo

    aptitude ~vvvv moo

    aptitude ~vvvvv moo

    aptitude -vvvvvv moo

    sudo apt-get moo

    ```


    ![](img/59caadfa348382a5c408c25137901e27_28_2.png)


    # Man the Apt command


    08  As you can see, there is more to the simple Apt command than what first meets
    the eye. There are many different sub-commands that you can run, and many different
    variations in which to run them.


    If you want to see what else the Apt command can do, enter the following:


    ```

    man apt

    ```


    ![](img/59caadfa348382a5c408c25137901e27_28_3.png)'
  merge: -1
  img_proc: true
