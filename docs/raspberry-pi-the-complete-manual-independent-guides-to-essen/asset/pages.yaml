- pgno: 21
  md: '# Getting started


    # What you''ll need...


    Raspbian:

    www.raspbian.org


    # Master the Config tool


    # Master the Config tool


    Tell your Raspberry Pi how to behave using the powerful built-in config tool


    The ''RasPi Config'' tool allows configuration of your system that would otherwise
    be trickier in the Linux environment and it''s the first thing you''ll see when
    you install Raspbian. Why? Tasks such as setting the date and time or regional
    settings for your keyboard are often done in a command-line interface with no
    dialogs, no additional help – for a new user, this is a nightmare.


    There are some further specifics for the Pi and Raspbian itself, such as the ability
    to easily enable overscan for your TV, change the split of memory to the computer/graphics
    card or even overclock your system to make it a little faster; enable remote SSH
    access to the system; stop the system booting into the desktop environment among
    other things. The RasPi Config tool takes the pain out of the process and puts
    real power at your fingertips.


    # Open the raspi-config tool


    01

    Start by double-clicking the LXTerminal icon on your desktop. This will start
    the command prompt, where you''ll be able to run the config tool. To do this you''ll
    need to run a command.


    ```

    sudo raspi-config

    ```


    When asked for your password, you won''t actually see it being typed. When you''ve
    typed the password and pressed Enter to submit it, the config screen will be shown
    to you. There are a few settings of particular interest that we''ll cover in this
    section, although they all have their uses in the running of your Pi. Some of
    the settings in this menu are important and some are irreversible, so use them
    with caution!


    **Change password**

    Change the password for your default pi username to make it something more personal
    or easier to remember for you


    **Expand root**

    Allow you to very quickly and easily change the partition of the root to fill
    the SD card completely!


    ![](img/59caadfa348382a5c408c25137901e27_21_0.png)


    **Configure your keyboard**

    Set the correct keyboard, as there are many different layouts. Using the wrong
    one can be annoying!


    **Overclocking**

    Allows you to quickly and easily overclock your Pi to give you some extra speed
    and power with little risk.


    # Did you know...


    You can access the config tool anytime by typing *sudo raspi-config* from a terminal
    window or the command line.'
  merge: -1
  img_proc: true
