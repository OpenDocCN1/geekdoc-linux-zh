    \ run `sudo pip install tweepy` to install the Twitter library we'll be using.\n\
    \n# Registering your 'app' with\nTwitter\n\n**02** We need to authenticate with\
    \ Twitter using OAuth. Before this, you need to go to https://dev.twitter.com/apps\
    \ and sign in with the account you'd like your Pi to tweet from. Click the 'Create\
    \ a new application' button. We called our application 'LUD Pi Bot' and set the\
