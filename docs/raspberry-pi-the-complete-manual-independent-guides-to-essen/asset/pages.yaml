- pgno: 40
  md: '# ## Get started with Geany


    # ## Projects


    ![](img/59caadfa348382a5c408c25137901e27_40_0.png)


    # ### New file


    **02** To start a new file as is easy as pressing File followed by New, much like
    a word processor or text editor. It will create a blank file that you can immediately
    start typing into. Save it with the appropriate file type, such as .py, and Geany
    will recognise the code is Python and start marking it up.


    # ### Marking up


    **03** If you can''t save it as the relevant file type, you can also force Geany
    to show code with a specific markup. Go to Documents>Set Filetype and choose from
    one of the available options there. It supports at least 50 different languages.


    # ### Opening files


    **04** Opening a pre-existing file in Geany is easy -- by clicking File followed
    by Open (just like in a word processor). For now, we''ll test out some of Geany''s
    features by opening one of the pre-packaged Python files from the **python\_games**
    folder in the **pi** directory.


    # ### Navigating code


    **05** The left column of the IDE lists the line number of the important parts
    of your code. For Python, this includes the functions and variables that make
    up the program. You can also click on them individually to jump to where they
    first appear or are defined in the code.


    ![](img/59caadfa348382a5c408c25137901e27_40_1.png)


    # ### Advanced navigation


    **06** Your code can start looking a bit convoluted once you have multiple functions
    and imports dotted around. Geany is smart enough to recognise these and allows
    you to minimise loops, functions and a block of imports if it''s not necessary
    while checking over your code.


    ![](img/59caadfa348382a5c408c25137901e27_40_2.png)


    # ### Auto-complete


    **07** When you''re writing out your program, you may notice that Geany will try
    to guess the function or variable you''re trying to use. This can be useful if
    you''ve forgotten exactly what the variable is called, as you can use the arrow
    keys to move down a list of relevant commands for what you''ve just typed.


    # ### Testing your code


    **08** You can test your code by clicking on the gears in the top bar -- these
    allow you to run the code. Any errors will be shown in the following window, but
    if everything goes to plan, it should run without any issue. Exit the windows
    and click on the Run button again to stop the test.


    ![](img/59caadfa348382a5c408c25137901e27_40_3.png)


    # ### Compiling


    **09** Once you''ve finished your code, you can compile and build it using the
    built-in tools. Any errors that occur in the process will be documented, allowing
    you to sift through them one by one until you have everything working properly.'
  merge: -1
  img_proc: true
