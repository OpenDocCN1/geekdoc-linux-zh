- pgno: 115
  md: '# Projects


    Build an Onion Pi and browse privately


    # What you''ll need...


    +   - Raspi

    +       - http://raspberry-ai.org/downloads

    +   - Compatible Wi-Fi adaptor

    +       - http://adafruit.com/products/814


    # Build an Onion Pi and browse privately


    > Turn your Raspberry Pi into a highly secure and very portable router to keep
    safe and anonymous...


    Elsewhere in this book we''ve shown you how to turn your Raspberry Pi into the
    ultimate portable wireless router, requiring very little power and giving you
    a wireless network wherever there''s the most basic of internet connections. What
    if it''s not enough to know you can search the web, though? What if you want to
    be wholly secure as you do it? Then it''s time to upgrade the router with Tor
    to protect your privacy on the internet.


    This ''Onion Pi'', as dubbed by Adafruit, combines Raspbian and Tor to create
    and secure a wireless access point using just a Raspberry Pi. This will keep you
    anonymous online - a handy feature in a time of privacy concerns all around the
    web.


    When the Pi is not connected to the internet, it should still function as a wireless
    router.


    # Did you know...


    There is much interest in internet security today due to the actions of some government
    agencies


    # It''s all software


    This isn''t a hardware hack - a spare SD card can be used for Tor router, and
    other SD cards can be used for different functions without any problems


    # Safety first


    Using our built more than a Raspberry Pi, you can route more of your systems through
    Tor-enabled access point, guaranteeing anonymity


    # Wi-Fi enabled


    Connect everything over a wireless network - no need to directly connect to the
    Pi with a cable


    # Ethernet needed


    Hook into the internet just about anywhere there''s an internet connection - a
    relative''s house, hotel rooms and more


    ![](img/59caadfa348382a5c408c25137901e27_115_0.png)'
  merge: -1
  img_proc: true
