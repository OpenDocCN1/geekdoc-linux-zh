    # Make a Pong clone with Python


    We update the retro classic Pong for the Linux generation with a new library called
    SimpleGUIK


    ![](img/59caadfa348382a5c408c25137901e27_97_0.png)


    Before ''Tux for Two'' is a great little Pong clone using the beloved Linux mascot,
    Tux, in the centre of the action


    The Raspberry Pi is a fantastic way to start learning how to code. One area that
    can be very rewarding for amateur coders is game programming, allowing for a more
    interactive result and a greater sense of accomplishment. Game programming can
    also teach innovation and advanced mathematics skills for code. We''ll be using
    the fantastic SimpleGUIK module in Python, a very straightforward way of creating
    graphical interfaces based on Tkinter.


    # Python module preparation


    +   1.  Head to the websites we''ve listed in ''What you''ll need'' and download
    a zip of the source files from the Git-Hub pages. Update your Raspbian packages
    and then install the following:

    +       `sudo apt-get install python-dev python-setuptools tk8.5-dev tcl8.5-dev`

    +   2.  Open the terminal and use `cd` to move to the extracted .zip folder. Once
    there, type:

    +       `sudo python setup.py install`

    +       Once that''s complete, move to the **simpleguiK** folder and use the same
    command to install that as well.

    +   3.  Launch IDLE 2, rather than IDLE 3, and open a new window. Use the code
    listing to create our game ''Tux for Two''. Be careful to follow along with the
    code to make sure you know what you''re doing. This way you can make your own
    changes to the game rules if you wish.


    # The SimpleGUIK code


    +   4.  There''s nothing to groundbreaking to start the code ''Tux''s and the
    packages'' initial positions are set, along with the initial speed and direction
    of Tux. There are also used when a point is won and the playing field is reset.
    The direction and speed is set to random for each spawn.

    +   5.  The important parts in the code are the **draw**, **line**, **draw**,
    **image** and **draw_text** functions. These are specifically from SimpleGUIK,
    and allow you to easily put these objects on the screen with a position, size
    and colour. You need to see them to an object, though — in this case, **canvas**.
    This tells the software we want to put these items on the screen for people to
    see.

    +   6.  The last parts are purely for the interface. We tell the code what to
    do when a key is depressed and then released, and give it a frame to work in.
    The frame is the solid white functions handle the graphics, key functions etc.
    Finally, we give it **frame.start()** so it starts.


