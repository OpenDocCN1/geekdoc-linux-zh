  md: "# # Stop motion animation with the Camera board\n\nNext we use the picamera\
    \ library to create our camera object and create our first function\n\n```\n```python\n\
    play_clock = pygame.time.Clock()\ncamera = picamera.PiCamera()\ncamera.resolution\
    \ = (width, height)\n\ndef take_pic():\n    global pics_taken, prev_pic\n    pics_taken\
    \ += 1\n    camera.capture(os.path.join('pics', 'image_' + str(pics_taken) + '.jpg'),\
    \ use_video_port = True)\n    prev_pic = pygame.image.load(os.path.join('pics',\
    \ 'image_' + str(pics_taken) + '.jpg'))\n\ndef delete_pic():\n    global pics_taken,\
    \ prev_pic\n    if pics_taken >= 1:\n        pics_taken -= 1\n        prev_pic\
    \ = pygame.image.load(os.path.join('pics', 'image_' + str(pics_taken) + '.jpg'))\n\
    ```\n```\n\nWe can preview our animation with the animate() function\n\n```\n\
    ```python\ndef animate():\n    camera.stop_preview()\n    for pic in range(1,\
    \ pics_taken):\n        anim = pygame.image.load(os.path.join('pics', 'image_'\
    \ + str(pic) + '.jpg'))\n        screen.blit(anim, (0, 0))\n        play_clock.tick(fps)\n\
    \        pygame.display.flip()\n        play_clock.tick(fps)\n    camera.start_preview()\n\
    ```\n```\n\nWe need to update the display so we can show the new images we've\
    \ taken on screen\n\n```\n```python\ndef update_display():\n    screen.fill((0,\
    \ 0, 0))\n    if pics_taken > 0:\n        screen.blit(prev_pic, (0, 0))\n    play_clock.tick(30)\n\
    \    pygame.display.flip()\n```\n```\n\n```\n```python\ndef make_movie():\n  \
    \  camera.stop_preview()\n    pygame.quit()\n    print(\"\\nQuitting Pi-Motion\
    \ to transcode your video.\")\n    os.system(\"avconv -r\" + str(fps) + \" -i\
    \ \" + str(os.path.join('pics', 'image_%d.jpg')) + \" -vcodec libx264 video.mp4\"\
    )\n    sys.exit()\n```\n```\n\nThe functions here are vital to ensure Pi-motion\
    \ can output videos and close cleanly\n\n```\n```python\ndef change_alpha():\n\
    \    global current_alpha, next_alpha\n    camera.stop_preview()\n    current_alpha,\
