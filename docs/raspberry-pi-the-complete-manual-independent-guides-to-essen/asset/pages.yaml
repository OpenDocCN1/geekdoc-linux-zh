    \ . . .\n\nVNC (Virtual Network Computing) is a graphical desktop access and\n\
    \nshar ing system that allows a user to remotely control and use the\n\ndesktop\
    \ of another computer from their own system.\n\nIt's handy in many ways: to give\
    \ you control over a remote\n\nsystem; to help out another user elsewhere; to\
    \ allow a computer to\n\nremain powered on, but without the need for a keyboard,\
    \ mouse or\n\neven a monitor.\n\nIn our case, we aim to allow access to the Raspberry\
    \ Pi desktop\n\nwithout it being hooked up to the aforementioned peripherals.\
    \ This\n\nway, you can do everything you would normally do, but with just\n\n\
    the power supply and network attached, thereby freeing up space\n\nand saving\
    \ extra expense. In real-world terms, this means you could\n\npotentially access\
    \ the Pi desktop via an Android tablet or phone!\n\n# What you'll need. . . .\n\
    \nTightVNC\n\nwww.tightvnc.com/en/relas2.7.php\n\n# Did you know. . . .\n\nTightVNC/Viewer\
