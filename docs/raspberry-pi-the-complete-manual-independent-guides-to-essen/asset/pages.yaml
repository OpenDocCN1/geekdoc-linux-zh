    ![](img/59caadfa348382a5c408c25137901e27_114_0.png)


    # Build a security camera


    # Projects


    # Installing the software


    +   **03** Log into the Raspberry Pi system with the username ''pi'' and the password
    ''raspberry''. The MJPG-streamer software isn''t packaged for the Raspberry Pi,
    so we''ll need to compile it ourselves. Update the package index with sudo apt-get
    update. We need to install Subversion, which we''ll use to download source code.
    We''ll also need libpng and imagemagick, both of which are required by MJPG-streamer.
    Install these with:

    +   **sudo** apt-get install subversion libjpeg-dev imagemagick


    # Compile MJPG-streamer


    +   **04** Download and compile MJPG-streamer as shown below:

    +   piraeuserpi ~ $ svn checkout svn://svn.code-sf.net/mjpg-streamer-code /code/mjpg-streamer-code

    +   pi@raspberrypi ~ $ cd mjpg-streamer-code/mjpg-streamer

    +   pi@raspberrypi ~ $ make clean all


    # Testing it out


    +   **05** To start MJPG-streamer, export LD_LIBRARY_PATH=:/mjpg_streamer-* "input_uvc.so"
    "output_file.so -w /www/

    +   You have to export the library path variable to the current directory so that
    the various input and output plug-ins can be used. Type your Raspberry Pi''s IP
    address followed by :8000 into a browser and click the Stream tab. If the Stream
    tab doesn''t work, try the example that uses JavaScript, that should work on most
    browsers, including Android.


    # Start MJPG-streamer at boot


    +   **06** Edit the /etc/rc.local file (you''ll need to use sudo) to include the
    following lines, ensuring that it still ends with exit 0.

    +   **export** STREAMER_PATH=/home/pi/mjpg-streamer-code/mjpg-streamer

    +   **export** LD_LIBRARY=STREAMER_PATH

    +   **$STREAMER_PATH/mjpg_streamer -i "input_uvc.so" -o "output_file.so -w $STREAMER_PATH/www/
    &"**

    +   Reboot the Pi to check that it comes back up happily and starts the stream.


    # Extensions and improvements


    +   **09** This example setup is very basic and has a few flaws. There is no authentication
    or SSL encryption, which means the streams are insecure and should not be shared
    over the internet. The HTTP module that comes with MJPG-streamer is quite simple,
    so you could get SSL by using a reverse proxy, such as Pound. You''d be able to
    SSL for each Pi you have with a single Pound instance and access the different
    Pis by having something like /stream, stream2 in the URL.


    > "Use the MJPG-streamer software to stream video straight from a webcam to your
    web browser"


    # Recording the stream


    +   **07** You can easily download a motion JPEG stream and convert it to a useful
    format using VLC:

    +   cvlc stream://172.17.173.94:8000 0/actions?stream=1-sout #file=/m4:stream.mp4

    +   Alternatively, you can just download the stream URL with wget like so:

    +   wget stream://172.17.173.94:8000/0/actions?stream


    # Multiple streams at once


    +   **08** Here is an example of how to put multiple streams on a single webpage.
    These streams could come from a number of different Raspberry Pis all over the
    house.

    +   <HTML>

    +   <TABLE BORDER="1">

    +   <TR>

    +   <TD><IMG SRC="172.17.173.94/8000/actions?stream=2/">

    +   </TD>

    +   <TD><IMG SRC="172.17.173.94:8000/actions?stream=1/">

    +   </TD>

    +   </TR>

    +   </TABLE>

    +   </HTML>'
