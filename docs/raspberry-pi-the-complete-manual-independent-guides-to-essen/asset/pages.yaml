- pgno: 36
  md: '# Turn your Pi into an office suite


    # Projects


    # Explore the suite


    **02** When you’ve installed LibreOffice, you can admire your new applications
    by hitting the system menu. You’ll see a new ‘Office’ category, underneath which
    you’ll see the following applications: **LibreOffice Base** – A database management
    application. **LibreOffice Calc** – Spreadsheets. **LibreOffice Draw** – To make
    flowchart visualisations. **LibreOffice Impress** – For creating presentations.
    **LibreOffice Writer** – The word processor, which is very similar to Word. Most
    of these applications are able to open a majority of documents created in Microsoft’s
    Office counterparts and are almost as feature rich.


    correct section within your document. To create your index, create some space
    at the top of your document, and then insert your index by using the menus to
    go to your *Index Indices and Tables* indices and Tables. Select the selected
    options and click *OK* when you’re happy. I’ll insert to the section of the document
    that your cursor is on.


    # What about images?


    **05** There’s no better way to liven up a document than with carefully chosen
    images. This can be achieved with relative ease too. There are a couple of solutions
    – the easiest of which is to drag an image in from the file manager directly into
    the document. Assuming the image is on your desktop, simply drag the file onto
    LibreOffice Writer and you’ll see the icon change, upon letting go, your image
    will appear roughly where you dropped it. Alternatively, you can use the Insert
    > *Picture > From File* option.


    # Help yourself by using comments


    **07** When writing a long document you’ll often think of things that you should
    really check up on or add to the document later. When you think of these items,
    you can make notes about them using ‘Comments’ – even more useful when there are
    multiple people moving through the document. Comments can be added at the current
    point in the document with **Ctrl+Alt+C** or by using the menu option *Insert
    > Comment*. If you want to get rid of the Extra ‘Comments’ pane, you can use the
    View menu to toggle it.


    ![](img/59caadfa348382a5c408c25137901e27_36_0.png)


    ![](img/59caadfa348382a5c408c25137901e27_36_1.png)


    # Add some style


    **03** We’re focusing on some of the word-processing features on the Pi specifically
    here, so go on ahead and open up LibreOffice Writer. When you’re writing documents,
    it’s usually the formatting where people stumble. When you start writing, to the
    left of the font drop-down menu there’s another drop-down that currently reads
    ‘Default’. Select some text, then use this drop-down to change the current applied
    style. If you don’t like the default, select ‘More’ from the drop-down, or press
    **F11**. This will allow you to customise the styles and more.


    # Export as a PDF


    **06** The PDF format is a very common way of exchanging documents – many because
    it’s simplest form; it’s an easy way of stopping accidental changes or modifications
    to a document. It’s also easy to set passwords on PDFs and stop purposeful modifications
    to them. The main advantage of PDFs, however, is that you don’t really need to
    worry about the recipient having a specific application to view them with. Most
    modern operating systems have some sort of PDF-viewer built in so you can be sure
    of a consistent experience. With LibreOffice, this is easy. You can save your
    document as a PDF using the *File > Export* to PDF menu option. Simply choose
    your desired options, click Export and save it in the appropriate place.


    # Linking out to the world


    **08** If you’ve used outside resources in a document that want to reference,
    or maybe you don’t directly need to include all the information – it might be
    handy to have a way of getting back to that document later on. You could include
    an Appendix of information at the end of your document that links to these other
    resources. You can hyperlink to these easily using the Hyperlink tool button on
    the same menu from the Insert > Hyperlink. When you’ve typed out the link, it
    will be presented with a dialog to link to one of the appropriate places. It’s
    important to note that direct document links use full system paths. It’s being
    sent to someone else, using away these as they’ll break for the reader. Ideally
    use only a personal reference guide on your own machine.


    # Add an index


    **04** One of the great things about using formatting that it allows you to create
    a contents page for work easily. So long as you use consistent headings for the
    different levels of your document, it’s a quick and easy way to give a guide to
    what’s in your document. Another advantage is that if you export the file to PDF,
    you’ll end up with each heading in the contents hotlinking directly to the appropriate
    place.


    17'
