  md: "# Use an accelerometer\n\n\"We'll be placing the ADXL345 on our breadboard\
    \ 'controller' using I2C\"\n\n![](img/59caadfa348382a5c408c25137901e27_94_0.png)\n\
    \n```\ndef update_pos():\n    '''Poll the adxl345 and update player pos based\
    \ on readings''' \n    move_data = adxl345.getAxes(True) # Returns a dict of axes\
    \ results\n    if move_data['x'] < -0.1 or move_data['x'] > 0.1: \n        player_position[0]\
    \ += move_data['x'] * 20\n    if move_data['y'] < -0.1 or move_data['y'] > 0.1:\n\
    \        player_position[1] += move_data['y'] * 20\n```\n\n```\ndef check_pos():\n\
    \    # Check player pos to make it wrap-around the game window'''\n    if player_position[0]\
    \ > 850:\n        player_position[0] = -75\n    elif player_position[0] < -75:\n\
    \        player_position[0] = 850\n```\n\n```\nif player_position[1] > 650:\n\
    \    player_position[1] = -75\nelif player_position[1] < -75:\n    player_position[1]\
    \ = 650\n```\n\n```\n#### MAIN PROGRAM LOOP #####\nwhile not game_over: # Handle\
    \ control events while the game is in play\n    for event in pygame.event.get():\n\
    \        if event.type == pygame.QUIT:\n            game_over = True # Quit if\
    \ close button is pressed\n        if event.type == pygame.KEYDOWN:\n        \
    \    if event.key == pygame.K_ESCAPE:\n                game_over = True\n    \
    \            # Quit if escape key is pressed\n```\n\n```\nupdate_pos() # Update\
    \ the player's position\ncheck_pos() # Check the player's position\n\n# Update\
    \ the background then the player's position on the screen\nscreen.blit(background_image,\
    \ [0, 0])\nscreen.blit(player_image, [player_position[0],player_position[1]])\n\
    \npygame.display.flip() # Refresh the screen\nclock.tick(20) # Force frame-rate\
    \ to desired number\n\npygame.quit() # Quit gracefully when 'game_over' is True\n\
    ```\n\n# Projects\n\n# Final checks\n\n03\n\nWith accelerometer attached to Pi,\
    \ power it up, open a terminal window and type sudo idlecheck -y1. The '1' at\
    \ the end assumes you're using a Rev 2 Pi – replace it with 0 if your Pi is older.\
    \ You should see some numbers denoting that the ADXL345 has been recognised. Finally,\
    \ well use Git to grab the project – type the following\n\n```\nsudo apt-get install\
    \ git\n```\n\n# Cloning and testing\n\n04\n\nFrom the terminal, navigate to your\
    \ home folder (with cd ~) and create a project folder (with mkdir). To clone the\
    \ folder and from the terminal type the following to clone the finished project\
    \ from our GitHub.com account git clone https://github.com/russ018/ADXL345_project.git\n\
    \n# How it works\n\n05\n\nTo run the project from the adxl345_project_folder type\
    \ python adxl345_p1.py. The Pygame window will open. Pick up your breadboard 'controller'\
    \ and tilt it around. The ship should move around the screen in reaction to your\
    \ movements. If it's backwards, you can adjust the orientation of the breadboard\
    \ – it might just be upside down!\n\n# Why it works\n\n06\n\nThe code for this\
    \ project is an excellent backbone for a make-brawlers-style game written in Python\
    \ and Pygame. The code collects data from the ADXL345 accelerometer using the\
    \ update_pos() function which pulls data using move_data variable. This data is\
    \ placed in the player_position array – which is the form of x and y co-ordinates.\
    \ The move_data pushes the image of the spaceship around the screen."
