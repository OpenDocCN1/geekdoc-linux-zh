    # Build an always-on torrent box


    # Build an always-on torrent box


    Get the latest distros, packages and test builds faster with a low-power, mini
    torrent box


    Torrenting your open source software has a number of advantages – it can be faster,
    alleviates bandwidth and allows you to share back with the community. Distros,
    packages and more are available via torrents, and the Raspberry Pi makes for a
    great tiny, low-wattage, always-on torrent box to better manage your files.


    # Install Raspbian


    **01**


    Raspbian works just fine for our torrent box. Install the image on an SD card
    and go through the basic setup process, making sure to enable SSH in the advanced
    options and to disable the desktop.


    # Remote access


    **02**


    Type ifconfig into your Pi''s command line to find the IP address. At this point
    you can unplug the monitor and set it up remotely, but either way you can now
    access the Pi by typing:


    ```

    ```bash

    $ ssh [user]@[IP address]

    ```

    ```


    ...and entering your password to log in.


    ![](img/59caadfa348382a5c408c25137901e27_107_0.png)


    **External storage**

    Store completed files on an external hard drive, for more space or easy transport


    **Wired networking**

    You''ll be transferring large amounts of data, so wired networking is a must


    **Tiny and convenient**

    Turn your Pi into an always-on torrent box you can hide in a well-ventilated small
    space


    ![](img/59caadfa348382a5c408c25137901e27_107_1.png)


    > "The Raspberry Pi makes for a great tiny, low-wattage, always-on torrent box
    to better manage your files"'
