  md: "# Projects\n\n# Build a VoIP server\n\n# What you'll need...\n\n+   - A router\
    \ or switch\n+   - Smartphones & computers\n+   - Powered USB hub\n+   - The latest\
    \ RaspBX image\n+   www.raspberrypi-siemxk.org/download\n\n# Build a\nVoIP server\n\
    \nUse your Raspberry Pi as a voice over IP server, perfect for phone calls in\
    \ the home or a small business\n\n![](img/59caadfa348382a5c408c25137901e27_109_0.png)\n\
    \nRasPBX is a project that brings Asterisk -- industry-standard voice over IP\
    \ software -- to the Raspberry Pi. There are VoIP clients for many platforms,\
    \ including hardware that converts VoIP to a conventional telephone line. Each\
    \ client gets a phone number and can call other clients. You can also have conference\
    \ calls, perfect for meetings over the phone. As an extension of this article,\
    \ you could also share the VoIP server over the internet, allowing remote clients\
    \ to connect.\n\n# Call\n\nCall other VoIP numbers and have their phone ring just\
    \ like a normal call\n\n# Connect\n\nWe recommend using wind networking editor,\
    \ especially if you want to 'set-and-forget' your VoIP server\n\n# Serve\n\nThe\
    \ Raspberry Pi makes the perfect server for this kind of project\n\n# Initial\
    \ setup\n\nRasPBX is good to go as soon as the image is flashed to your SD card!\
    \ there is a Web interface for configuration, and SSH is included for remote login.\
    \ As this will be a server, we'll log in with the user 'root' and password 'raspberrly'\
    \ and change the IP address to a static one so that we always know where it is\
    \ on this network.\n\n```\n```bash\nroot@raspbx:~# if config show eth0 | grep\
    \ inet\n    inet 172.17.173.94/24  brd 172.17.173.255  scope  global  eth0\n \
    \   inet6 fe80::ba27:ebff:fef3:9016/64  scope  link\ndefault  via 172.17.173.1\
    \  dev  eth0\nroot@raspbx:~# ip route  grep default\ndefault  via 172.17.173.1\
    \  dev  eth0\nroot@raspbx:~# cat  /etc/resolv.conf\nnameserver  127.0.0.1\nnameserver\
    \  8.8.8.8\nnameserver  8.8.4.4\n```\n```\n\n# Assign a static IP address\n\n\
    To set up the network\nconfiguration go:\n`iface eth0 inet static`\naddress 172.17.173.1\n\
    netmask 255.255.255.0\nnetwork 172.17.173.0\nbroadcast 172.17.173.1.255\nNow that\
    \ we have the network configuration, we can assign a static IP address: Open `/etc/network/interfaces`\
    \ in an editor such as nano, and change the line:\n`Ifaces eth0 inet dhcp`\nto\
    \ a configuration similar to our example: We don't have to worry about DNS. Load\
    \ your network config with:\n`Sudo /etc/init.d/networking restart`"
