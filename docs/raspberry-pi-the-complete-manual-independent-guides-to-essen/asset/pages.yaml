  md: "# Code Arduino with Python\n\nfolder in the terminal (cd ~) and do the following\
    \ in the terminal, one after the other:\n\n```\n```\neasy_install nampy\nsudo\
    \ apt-get install git\ngit clone https://github.com/nampy/nampy.git\n```\n```\n\
    \n# Configure your Arduino Uno\n\n05 Why have we cloned the original Git repository?\
    \ Nampy relies on an update to the Arduino firmware to function correctly, so\
    \ you'll need to access the firmware folder from the nampy project directory to\
    \ do it. Before typing the following into the terminal, plug your Arduino Uno\
    \ into a spare port on the Raspberry Pi. Beware: the following takes some time!\n\
    \n```\n```\ncd nampy/firmware\nexport BOARD=nano\nmake\nmake upload\n```\n```\n\
    \n# Testing Arduino\n\n06 With the installation finally complete, we can test\
    \ the setup to make sure it works properly. Before we do a proper 'Hello World'\
    \ application in the code segment to the right, let's first ensure Nampy is properly\
    \ installed and the connection between Pi and Arduino is working. From your home\
    \ folder (cd ~), type the following into the terminal:\n\n```\n```\nnano nampy_test.py\n\
    ```\n```\n\nIn the nano editor, simply write:\n\n```\n```python\nfrom nampy import\
    \ Arduino\n```\n```\n\nNow press Ctrl+X, then Enter to save your new file.\n\n\
    Finally, in the terminal, type:\n\n```\n```\npython nampy_test.py\n```\n```\n\n\
    If you don't see an error, then everything should be working fine. Now you can\
    \ play with the code across the page to start learning your way around Nampy.\n\
    \n# Full code listing\n\n```\n```python\n# Like all good hardware-based ‘Hello,\
    \ World’ applications,\n# we’ll start\n# by making the light on the Arduino board\
    \ flicker off and on.\nfrom nampy import Arduino\nfrom time import sleep\nArduino.pinMode(13,\
    \ Arduino.OUTPUT)\nfor i in range(10):\n    Arduino.digitaLWrite(13, Arduino.HIGH)\n\
    \    sleep(2)\n    Arduino.digitaLWrite(13, Arduino.LOW)\n    sleep(2)\n\n# This\
    \ will make the light controlled by pin 13 on the Arduino\n# turn on and off every\
    \ two seconds ten times.\nlight = 13\nArduino.pinMode(light, Arduino.OUTPUT)\n\
    \n# You can also assign multiple pins at the same time:\nred_pin = 3\ngreen_pin\
    \ = 5\nblue_pin = 9\nfor pins in (red_pin, green_pin, blue_pin):\n    Arduino.pinMode(pins,\
    \ Arduino.OUTPUT)\n\n# If you’ve got an LED screen for your RaspPi you’ll probably\n\
    # find it works out of the box with Nampy. Just make sure you\n# assign the right\
    \ pin numbers for your screen:\n\nfrom nampy import Arduino, Lcd\nscreen = Lcd(7,\
    \ 8, 9, 10, 11, 12), [16, 2])\nscreen.printString(“Hello, World!”)\n\n# If you’re\
    \ using potentiometers, buttons or analog sensors,\n# you’ll need to assign them\
    \ as inputs\nknob = 0\nArduino.pinMode(knob, Arduino.INPUT)\nvalue = Arduino.analogRead(knob)\n\
    for i in range(50):\n    print (“The value of the knob is:”, knob)\n    sleep(1)\n\
    \n# Sometimes you want to delay what the arduino does.\n# This can help you get\
    \ consistent, solid readings\ndef get_value():\n    value = Arduino.analogRead(knob)\n\
    \    Arduino.digitaL(13)\n    return value\n\nfor i in range(100):\n    print\
    \ (“The value is:”, get_value())\n```\n```"
