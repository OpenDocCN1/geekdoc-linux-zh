  md: '# Projects


    # Build your first web server


    # Build your first web server


    Use Google Coder to turn your Raspberry Pi into a tiny, low-powered web server
    and web host!


    We''re teaching you how to code in many different ways on the Raspberry Pi in
    this book, so it only seems fitting that we look at web development too.


    There''s a new way to use the web on the Raspberry Pi as well: Internet giant
    Google has recently released Coder specifically for the tiny computer. It''s a
    Raspberry Pi-based image that turns your Pi into a web server and web development
    kit. Accessible easily over a local network and with support for jQuery out of
    the box, it''s an easy and great way to further your web development skills.


    # What you''ll need...


    +   * Internet connectivity

    +   * Web browser

    +   * Google Coder (google.com/ads/pi/pub/scode/raspberrypi/scripts/teaching.html)


    ![](img/59caadfa348382a5c408c25137901e27_79_0.png)


    # Get Google Coder


    01 Head to the Google Coder website, and download the compressed version of the
    image. Unpack it wherever you wish, and install it using sd, like other Raspberry
    Pi images. sd -if=\[path to\]/raspi.img of=/dev/\[path to SD card\] bs=1M


    # Connect to Coder


    03 Open up the browser on your main system, and go to http://coder.local. You
    may have to manually accept the licence. It will ask you to set up your password,
    and then you''ll be in and ready to code.


    # Protect Your Coder


    Set a password here. It''s a good idea to use a strong password.


    ![](img/59caadfa348382a5c408c25137901e27_79_1.png)


    # Plug in your Pi


    02 For this tutorial, you''ll only need to connect a network cable into the Pi.
    Plug in your newly written SD card, plug in the power and wait a few moments.
    If you''ve got a display plugged in anyway, you''ll notice a Raspberry Pi startup
    sequence leading to the command-line login screen.'
