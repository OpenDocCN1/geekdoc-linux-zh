  md: '# Build an Onion Pi and browse privately


    ![](img/59caadfa348382a5c408c25137901e27_116_0.png)


    ![](img/59caadfa348382a5c408c25137901e27_116_1.png)


    # Install Raspbian


    **01** Raspbian is the Raspberry Pi distro we''ll be using for the Onion Pi. Download
    the zip file, extract the image and then apply it to an SD card using:


    ```

    $ dd bs=4M if=Raspbian number]-""[eezy-"ersion.img of=/dev/[SD card location]You
    can also use NOOBS to install Raspbian if you wish.

    ```


    # Set up Raspbian


    **02** Go through the initial Raspbian setup and make sure to turn on the SSH
    server, and to disable autologin to desktop – this is unnecessary and will only
    use extra power. You can also tell it to fill up the rest of the card if there''s
    room for it.


    # Pi IP


    **03** We''ll be accessing your Raspberry Pi via SSH to set it up. To do this
    we need to know its IP address – you can find it by typing `ifconfig` into the
    command line. Make a note of it and turn off your Pi.


    # SSH connection


    **04** Plug your USB wireless adapter into the Pi and turn it back on. On another
    computer connected to the same network, open a terminal or type into the command
    line:


    ```

    $ ssh [user]@[IP address]Then enter the password for your Raspbian Pi if it asks
    for it.

    ```


    # Install DHCP


    **05** To make life easier for any system connecting to the Pi access point, we
    need to install a DHCP server to it. We do this with:


    ```

    $ sudo apt-get install hostapd isc-dhcp-serverDHCP will automatically assign IP
    addresses to network-attached devices, meaning you won''t need static IPs.

    ```


    # Set up DHCP


    **06** Now we need to configure the DHCP server. Edit the configuration file with:


    ```

    $ sudo nano /etc/dhcp/dhcp.confAnd start by putting a # in front of the two option
    domain-name entries, then remove the # in front of authoritative, server lines
    down.

    ```


    ![](img/59caadfa348382a5c408c25137901e27_116_2.png)


    # Server address


    **07** At the end of the configuration file, add the following:


    ```

    subnet 192.168.42.0 netmask 255.255.255.0 {    range 192.168.42.10    192.168.42.55;    option
    broadcast-address      192.168.42.255;    option broadcast-address      192.168.42.255;    default-lease-time
    600;    max-lease-time 7200;    option domain-name "local";    option domain-name-servers      8.8.8.8,
    8.8.4.4;}Save and exit

    ```


    ![](img/59caadfa348382a5c408c25137901e27_116_3.png)


    # DHCP server


    **08** Edit the server configuration file so that it''s set to work in conjunction
    with the wireless adapter:


    ```

    $ sudo nano /etc/default/isc-dhcp-serverScroll to INTERFACES= and change it to:INTERFACES="wlan0"

    ```'
