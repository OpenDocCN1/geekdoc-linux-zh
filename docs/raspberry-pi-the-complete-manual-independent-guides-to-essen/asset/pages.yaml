- pgno: 30
  md: '# Getting started


    # Use graphical installations


    # Update the system


    **01** Unfortunately, if you have an aversion to drooping into the command-line
    terminal, then you''re going to be stuck at the first step. Before we install
    anything, we need to make sure that the Raspberry Pi is fully updated and any
    existing packages are upgraded. Simply enter the following into the LX Terminal:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    ![](img/59caadfa348382a5c408c25137901e27_30_0.png)


    # Installing Synaptic


    **02** To install Synaptic, you''ll first need to enter the LX Terminal and run
    the command below – don''t forget to type Y to any prompts asking you to accept
    the installation:


    ```

    sudo apt-get install synaptic

    ```


    ![](img/59caadfa348382a5c408c25137901e27_30_1.png)


    # Running Synaptic – Part 1


    **03** In essence, that''s all you need to do. Synaptic is now installed and ready
    to use. However, due to its complexity, there may be some bugs that need ironing
    out first, so it''s best to follow these steps. To test if Synaptic is working
    okay, first enter the following command into the terminal.


    ```

    gksudo synaptic

    ```


    ![](img/59caadfa348382a5c408c25137901e27_30_2.png)


    # Running Synaptic – Part 2


    **04** You should be now looking at the Synaptic program window, where you can
    scroll through the list of available programs and click on each to download and
    install. Now we need to test whether it will run from the LXDE menu. Click on
    the icon in the bottom left, then go to Preferences**>\***Synaptic Package Manager.


    # Running Synaptic – Part 3


    **05** Running Synaptic from the LXDE menu results in an error. Don''t panic;
    however all it''s doing is asking for a password. Enter the following password
    into the box


    ```

    raspberry

    ```


    This is the default Pi password so we''re assuming you have not changed it!


    # Fixing Synaptic – Option 1


    **06** This will temporarily fix the issue, but to permanently resolve it, do
    one of the following. First, right-click the Synaptic icon in


    the menu and left-click Properties. In the Executable text box, change the text
    to add the gksudo command. So instead of ''synaptic-pkexec'', it will read


    ```

    gksudo synaptic-pkexec

    ```


    # Fixing Synaptic – Option 2


    **07** The second, and best, option is to drop back into the terminal and alter
    the way in which the program is executed from the menu. All that is needed is
    to change one line so another, so that the gksudo command is again used instead
    of the plain synaptic-pkexec. From the terminal, type:


    ```

    sudo nano /usr/share/applications/

    synaptic.desktop

    ```


    Change Exec**=synaptic-pkexec** to ...


    ```

    Exec=gksudo synaptic-pkexec

    ```


    # Synaptic fully working


    **08** After you''ve entered those changes, exit nano via Ctrl**X, then press
    Enter a couple of times to get back to the command prompt. You can now launch
    Synaptic from the menu or by entering the following command when you''re in the
    terminal


    ```

    gksudo synaptic

    ```


    ![](img/59caadfa348382a5c408c25137901e27_30_3.png)'
