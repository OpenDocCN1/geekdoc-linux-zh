  md: "# Create a time-lapse camera trigger\n\n# Time-lapse\ncamera trigger\n\nMake\
    \ shooting time-lapse video with your DSLR camera a cinch with our expert advice\n\
    \nYou'd be forgiven for thinking that creating mesmerising time-lapse videos like\
    \ those of Vincent Laforet ([www.laforetvisuals.com](http://www.laforetvisuals.com))\
    \ or John Elkind ([www.theartoftime lapse.com](http://www.theartoftime%20lapse.com))\
    \ might be out of reach of the Average Joe. With the help of the Raspberry Pi\
    \ and a sprinkling of Python code, though, that's no longer the case. In this\
    \ guide we're going to trigger our DSLR camera to create pixel-perfect time-lapse\
    \ imagery...\n\n# What you'll need...\n\n+   - Latest Raspberry Image www.raspberrypi.org/downloads\
    \  \n+   - Breadboard  \n+   - Connectors  \n+   - Jumper wire  \n+   - DSLR camera\
    \  \n+   - Compatible shutter cable\n\n# Set up the Raspberry Pi\n\n**01** For\
    \ this tutorial we're assuming you're using a recent build of Ras pi on, with\
    \ the Raspberry Pi set up with a keyboard, mouse and monitor. Open the terminal\
    \ and type:\n\n```\nsudo apt-get update\n```\n\n# Install the RPi.GPIO library\n\
    \n**02** Next we want to make sure your development environment is set up. Follow\
    \ these steps to make sure you've all set in the terminal, type:\n\n```\nsudo\
    \ apt-get install python-dev\nsudo apt-get install python-rpi-gpio\n```\n\n# Set\
    \ up the Pi Cobbler\n\n**03** For this tutorial we've used a cheap prototyping\
    \ breadboard and an Adafruit Pi Cobbler to give us easy access to the Raspberry\
    \ Pi's GPIO pins. As you can see from the picture, the Cobbler straddles the centre-point\
    \ of the breadboard and a ribbon cable connects the two.\n\n# Full code listing\n\
    \n```\nimport RPi.GPIO as GPIO\nimport time\n\nprint 'Welcome to the Complete\
    \ Manual Time-lapse Tool.'\nprint \"Just tell us how many shots you'd like to\
    \ take and the interval between them.\"\nprint \"Try googling 'time-lapse interval\
    \ calc' if you need help deciding.\\n\"\n\ndef main():\nshots = raw_input('How\
    \ many shots would you like to take?\\n -> ')\ninterval = raw_input('How frequently\
    \ do you want to take them (in seconds)?\\n -> ')\n\nif shots.isdigit() and interval.isdigit():\n\
    shots = int(shots)\ninterval = int(interval)\n\nprint \"You'll be shooting for\
    \ %d minutes.%n\" % (shots * interval / 60)\nanswer = raw_input('Are you ready\
    \ to proceed?(yes/no): ')\n\nif confirm:\nGPIO.setmode(GPIO.BOARD)\nGPIO.setup(16,\
    \ GPIO.OUT)\ntaken = 1\n\nprint 'Starting a run of %d shots' % (shots)\n```"
