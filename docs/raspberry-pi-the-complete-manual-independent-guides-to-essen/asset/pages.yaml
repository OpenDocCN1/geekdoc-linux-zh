  md: '# Projects


    # Stream music


    # What you''ll need...


    A router or switch

    Raspberry Pi

    tiny-robot

    An iOS or Android device

    A Linux computer


    # Stream music


    > Remotely control a Raspberry Pi that plays your music collection and stream
    your music to your phone


    Music Player Daemon (MPD) is a piece of software that acts as both a music player
    and a music server. It can output audio to any sound card connected to the system,
    and be controlled by an MPD client. Clients are available for almost any platform,
    including iOS and Android. MPD can also output audio to a stream, which can be
    used by most clients. This is great for people with large music libraries who
    can''t fit it all on their device.


    ![](img/59caadfa348382a5c408c25137901e27_95_0.png)


    # Android & iOS


    While there are lots of applications suitable for this project, we recommend MPDroid
    for Android and MPoD for Apple''s iOS devices


    # Music collection


    Your music collection must be stored in the directory `/var/lib/mpd/music` on
    your Raspberry Pi. Once the database is set up, you can access it from any mobile
    device or computer


    # Server connection


    Once your Android or iOS app is set up, we are able to connect to our music server
    using the Raspberry Pi''s IP address


    # Streaming daemon


    We can come the Raspberry Pi Music Player Daemon to listen on all interfaces so
    we can access the music from all kinds of devices


    # Install the required software


    +   01  Log into the Raspberry Pi system with the username `pi` and the password
    `raspberry`. First, find the IP address of the Pi using `ip addr` | `grep inet`
    and note it down for use later. Get the latest package lists using the command
    `sudo apt-get update`. Then install MPD using `sudo apt-get install mpd`. There
    may be some errors, but you''ll just be able to ignore those. Next we need to
    change some permissions...


    # Add music


    +   02  The default music directory is `/var/lib/mpd/music`. We''ll first make
    this folder world-readable, writable and executable so that the Pi user can write
    to it. Do this with `sudo chmod 777 /var/lib/mpd/music`. Then find some music.
    You''d like to copy on your Linux computer and use `scp` to copy it. For example:
    `scp -r -P 1122 /var/lib/mpd/music/* 192.168.157.28:/var/lib/mpd/music/`'
