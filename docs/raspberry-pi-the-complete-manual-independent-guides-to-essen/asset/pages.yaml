- pgno: 138
  md: '# # Program a quadcopter


    # ## Projects


    # Sensor viewpoint diagram


    How sensors in the quadcopter''s point of view are converted to the Earth (horizontal/vertical)
    viewpoint to provide horizontal motion


    ![](img/59caadfa348382a5c408c25137901e27_138_0.png)


    # Interpreter


    **01** The command interpreter converts a series of commands either from a radio
    control or programmed into the code itself. The commands combine the direction
    and speed compared to the horizon that the user want the quadcopter to follow.
    The code converts these commands into a series of targets for vertical speed,
    horizontal speed and yaw speed – any command from a pair of joysticks can be broken
    down into a set of these targets.


    # Inputs


    **02** The inputs to the quadcopter come from a series of electronic sensors providing
    information about its movement in the air. The main two are an accelerometer which
    measures acceleration force (including gravity) in the three axes of the quadcopter,
    and a gyroscope which measures the angular speed with which the quadcopter is
    pitching (nose/tail up and down), rolling (left/right side up and down), and yawing
    (spinning clockwise and anticlockwise around the central axis of the quadcopter
    itself).


    # Axes


    **03** The accelerometer is relative to the orientation of quadcopter axes, but
    the command targets are relative to the Earth''s axes – the horizon and gravity.
    To convert the sensor output between the quadcopter axes and the Earth axes requires
    the use of a lot of mathematics, specifically trigonometry. You also need knowledge
    of the tilt angles in pitch and roll axes of the quadcopter with respect to the
    Earth. It''s pretty complicated stuff, but the diagrams on these pages should
    help you understand the logic.'
  merge: -1
  img_proc: true
- pgno: 139
  md: "![](img/59caadfa348382a5c408c25137901e27_139_0.png)\n\n*Above Kits are available\
    \ as ready to fly (RTF) if you just want the joy of flight, but where's the challenge\
    \ in that? We started with a almost-ready to fly (ARTF) kit - the DJI Flame Wheel\
    \ F450 - all the hardware, but none of the control electronics or software. Many\
    \ enthusiasts have created DIY quadcopter using Arduino microcontrollers, so we\
    \ knew a DIY build was possible, but very fussy, if any, have successfully used\
    \ the Raspberry Pi*\n\n# Angles\n\n04 Both the accelerometer and gyro can provide\
    \ this angle information, but both have flaws. The accelerometer output can be\
    \ used to calculate the angle by using the Euler algorithm. However, the accelerometer\
    \ output is plagued by noise from the motors/propellers, meaning a single reading\
    \ can be hugely inaccurate; on the plus side, the average reading remains accurate\
    \ over time. \n\nIn contrast, the gyro output does not suffer from the noise,\
    \ but since it is the angular speed being measured, it needs to be integrated\
    \ over time to find the absolute angle of the quadcopter in comparison to the\
    \ horizon. Rounding errors in the integration lead to ever increasing errors over\
    \ time, ultimately curtailing the maximum length of a flight.\n\n# Filter\n\n\
    05 They are both flawed, they can be merged mathematically such that each compensates\
    \ for the flaws in the other, resulting in a noise-free, long-term accurate reading.\
    \ There are many versions of these mathematical noise/drift filters. The best\
    \ common one is by Kalman; the one we've chosen is slightly less accurate, but\
    \ easier to understand and therefore to code: the complementary filter. \n\nNow\
    \ with an accurate angle in hand, it's possible to convert accelerometer sensor\
    \ data to inputs relative to the Earth's axes and work out how fast the quadcopter\
    \ is moving up, down, left, right and forwards and backwards compared to the targets\
    \ that have been set.\n\n![](img/59caadfa348382a5c408c25137901e27_139_1.png)"
