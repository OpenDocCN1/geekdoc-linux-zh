- pgno: 14
  md: '# Install a distro


    # Getting started


    # Obtaining OSs


    01 One of your first questions may be ''where can I find some operating systems
    to download?''


    Most of the common images can be found on the main Raspberry Pi site: *http://www.raspberrypi.org*/
    *downloads*. These are stable and well tested systems worth investigating.


    # Unzipping


    02 When you''ve downloaded your image, the first thing you''ll most likely need
    to do is unzip it. This can be done in Windows by right clicking and choosing
    ''extract...''. In OS X, just double click to extract the files.


    # OS Format


    03 Within the zip you''ll find a file with a .img or .iso extension. These are
    the equivalent of a ''snapshot'' of an installation CD or DVD. Simply copying
    the file to the SD card won''t do anything, you''ll need to use a program to extract
    it.


    # SD card format


    04 The SD card that you''ll boot to make sure there is nothing important on it
    first. You''ll also need to format it to use the FAT32 file system. This is a
    common system, used by most USB sticks and cameras.


    # Formatting the card


    05 In Windows, to format the card simply insert and wait for it to mount. Then
    click on ''My Computer'' and then right click on the cards icon. After that choose
    format and then ''FAT32'' from the drop-down menu.


    # Using the terminal


    06 If you are using OS X or Linux, then you''ll have to use the terminal to copy
    the image. In OS X, the Terminal app comes installed by default, and most Linux
    versions come with one in some form or other. It may be referred to as the ''console''
    or ''command line''.


    # DD command


    07 The command you need to use is called *dd*. This is entirely in the format
    of sudo dd bs=1m <file>| <device>|. An example of this can be seen below:


    ```

    sudo dd bs=32m if=/Users/rachel1crab/Desktop/archlinux/armchlinux-hf-2013-02-11.img
    of=/dev/disk1

    ```


    # Win 32 Disk Imager


    08 Windows users can use Win32 Disk Imager. Once you''ve downloaded the tool,
    simply right click on the *.exe*, and choose ''run as administrator'' and follow
    the prompts. When the installation is complete you can put the SD card in your
    Pi. Easy!'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Command line basics


    Getting started


    # Command line basics


    Learn an alternative way to control your Raspberry Pi by using the command line
    and your keyboard


    We''ve probably all been there with the Raspberry Pi. You''ve installed Raspbian
    or another Raspberry Pi OS to your SD card and you''ve rushed through the setup
    script or not quite done your research. You start the operating system and...
    you end up at a command line. The first step here is not panic; this is perfectly
    normal. It may just be a bit of a foreign concept to you, only seen in films with
    streetwise hackers who want to bring down ''the system''.


    The second step, at least in Raspbian''s case, is simply to type:


    ```

    $ start x

    ```


    That''s it. Raspbian will load up the desktop and you''ll start using the mouse
    again. Quick and painless in this case, and in that of many other operating systems
    as well. What you''ve done is use a command, specifically in this case to start
    the X server. The X server handles the graphical interface and can be turned off
    by default on some Pi systems.


    # What you''ll need...


    +   Raspbian

    +   www.raspberrypi.org


    # Did you know...


    The command arrow enables your last commands. Simply use the Up and Down arrows
    to use them.


