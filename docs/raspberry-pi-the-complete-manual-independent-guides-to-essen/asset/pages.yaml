  md: "# Build an always-on torrent box\n\n# Mount hard drive\n\n03 Unless you plan\
    \ to reformat your portable drive, you'll need to install NTFS support onto your\
    \ Fi.  \nType:\n```\n$ sudo apt-get install ntfs-3g\n```\nAdd the hard drive to\
    \ /etc/fstab (open it with sudo nano /etc/fstab) by adding the line:\n```\n/dev/[hard\
    \ drive address]\n[ Mount point(] auto noatime 0 0\n```\nUse fdisk to find the\
    \ name of the storage, and create a mount point such as /home/portsmnts with mkdir.\
    \ Reboot for it to mount.\n\n![](img/59caadfa348382a5c408c25137901e27_108_0.png)\n\
    \n# Install Deluge\n\n04 We'll use Deluge for our torrents. Install it with:\n\
    ```\n$ sudo apt-get install deluge\n deluge-console\n```\nNow start and then stop\
    \ Deluge so it creates a config file we can edit with:\n```\n$ deluged\n$ sudo\
    \ pkill deluged\n$ deluged\n$ deluged\n```\nAnd finally, run the following to\
    \ copy the config file in case we mess up.\n```\n$ cp ~/.config/deluge/auth ~/.config/\n\
    \  deluge/auth.old\n```\n\n# Basic configuration\n\n05 Edit the file with:\n```\n\
    $ nano ~/.config/deluge/\nauth\n```\nAnd add the location:\n```\n[username]:[password]:10\n\
    ```\n... to restrict access. Now start it up with:\n```\n$ deluged\n$ deluge-console\n\
    ```\n\n![](img/59caadfa348382a5c408c25137901e27_108_1.png)\n\n# Remote connection\n\
    \n06 Now you're in the client, type the following three commands:\n```\nconfig\
    \ -s allow_remote True\nconfig allow_remote\nexit\n```\nRestart the Deluge daemon\
    \ with:\n```\n$ sudo pkill deluged &&\n deluged\n```\nNow open the graphical client\
    \ on your Linux PC.\n\n![](img/59caadfa348382a5c408c25137901e27_108_2.png)\n\n\
    ![](img/59caadfa348382a5c408c25137901e27_108_3.png)\n\n# Download location\n\n\
    08 Go again to Edit then Preferences, and change to the Downloads tab if it's\
    \ not on there already. Set the download location to the directory we mounted\
    \ the hard drive to, and enable Auto add torrents* sent to any destination if\
    \ you plan to dump torrents to the Fi.\n\n# Start on boot\n\n09 An init script\
    \ from Ubuntu.com can be used to have Deluge start on boot. Download it with:\n\
    ```\n$ sudo wget -O /etc/default/\n  deluge-daemon http://bit.\n  ly/13nKKSj\n\
    ```\nOpen /etc/default/deluge-daemon with nano and change the username to the\
    \ one we set up earlier. Save it, then download the full init script and update\
    \ with:\n```\n$ sudo wget -O /etc/init.d/\n deluge-daemon http://bit.\n ly/13hKktz\n\
    $ sudo chmod 755 /etc/init.d/\n deluge-daemon\n$ sudo update-rc.d deluge-\n daemon\
    \ defaults\n```\n\n# Remote interface\n\n07 Go to Edit>Preferences> Interface,\
    \ then disable Classic Mode and restart Deluge. Click Add on the Connection Manager,\
    \ and enter the IP in Hostname and the user we set up earlier. Click Connect to\
    \ see any torrents you have downloading or uploading."
