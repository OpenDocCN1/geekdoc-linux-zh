  md: '# The Kali-Dev Repository


    This repository is not for public use. It is a space Kali developers resolve dependency
    problems arising from the merge of the Kali-specific packages into Debian Testing.


    It is also the place where updated packages land first, so if you need an update
    that was released recently and has not yet reached Kali-rolling, you might be
    able to grab it from this repository. This is not recommended for regular users.


    # The Kali-Bleeding-Edge Repository


    This repository contains packages automatically built out of the upstream Git
    (or Subversion) repository. The upside is that you are immediately access to the
    latest features and bug fixes less than 24 hours after they have been committed.
    This is an ideal way to verify if a bug that you reported upstream has been fixed.


    The downside is that these packages have not been tested or vetted: if the upstream
    changes impacting the package (adding a new dependency), then that package might
    not work. Because of this, the repository is marked in such a way that APT does
    not automatically install packages from it, particularly during an upgrade.


    You can register the repository either by editing /etc/apt/sources.list d directory
    or by creating a new file under the /etc/apt/sources.list which has the benefit
    of leaving the original system sources file un-altered. In this example, we opt
