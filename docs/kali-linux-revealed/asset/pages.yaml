  md: 'The offsec-defaults package will contain a few files:


    +   - /etc/apt/sources.list/offsec.list: a sources.list entry for APT, enabling
    the company''s internal package repository

    - /etc/apt/trusted.gpg/offsec.gpg: the GnuPG key used to sign the company''s internal
    package repository

    - /etc/salt/minion.offsec.conf: a SaltStack configuration file to indicate where
    to the Salt master

    - /usr/share/images/offsec/background.png: a nice background image with the Offensive
    Security logo

    - /usr/share/glib-2.0/schemas/90_offsec-defaults.gschema.override: a file providing
    alternate default settings for the GNOME desktop


    First, create an offsec-defaults-1.0 directory and put all the files in that directory.
    Then run dh_make --native (from the dh-make package) to add Debian packaging instructions,
    which will be stored in a sub-directory:


    ```

    $ mkdir offsec-defaults-1.0; cd offsec-defaults-1.0

    $ dh_make --native

    Type of package: (single, indep, library, python)

    [s/i/l/p?] i

    Email-Address : buxy.kali.org

    License : gpl3

    Package Name : offsec-defaults

    Maintainer Name : Raphael Herzog

    Version : 1.0

    Package Type : indep

    Date : Thu, 16 Jun 2016 18:04:21 +0200

    Are the details correct? [Y/n/q] y

    Currently there is not top level Makefile. This may require additional tuning

    Done. Please edit the files in the debian/ subdirectory.

    ```


    First, you are prompted for a package type. In the example, we selected indep,
    which indicates that this source package will generate a single binary package
    that can be shared across all architectures (architecture: all). single acts as
    a counterpart, and produces a single binary package that is dependent on the target
    architecture (Architecture: any). In this case, indep is more relevant, since
    the package only contains text files and no binary programs, so that it can be
    used similarly on computers of all architectures. The library type is useful for
    shared libraries, since they need to follow strict packaging rules. In a similar
    fashion, python should be restricted to Python modules.'
