    [page 19] and that you have used a USB key big enough to hold the ISO image (roughly
    3 GB) and the data of the directories that you want to persist. We also assume
    the USB key is recognized by Linux as /dev/sddb and that it only contains the
    two partitions that are part of the default ISO image (/dev/sddb1 and /dev/sddb2).
    Be very careful when performing this procedure. You can easily destroy data if
    you re-partition the wrong drive.


    To add a new partition, you must know the size of the image that you copied so
