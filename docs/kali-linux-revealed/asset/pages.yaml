  md: 'A pre-dependency is very demanding for apt because it adds a strict constraint
    on the ordering of the packages to install. As such, pre-dependencies are discouraged
    unless absolutely necessary. It is recommended to consult other developers on
    debian-dev@lists.debian.org before adding a pre-dependency as it is generally
    possible to find another solution as a work-around.


    # Recommends, Suggests, and Enhances Fields


    The Recommends and Suggests fields describe dependencies that are not compulsory.
    The recommended dependencies, the most important, considerably improve the functionality
    offered by the package but not indispensable to its operation. The suggested dependencies,
    of secondary importance, indicate that certain packages may complement and increase
    their respective utility, but it is perfectly reasonable to install one without
    the others.


    You should always install the recommended packages unless you know why you do
    not need them. Conversely, it is not necessary to install suggested packages unless
    you know why you need them.


    The Enhances field also describes a suggestion, but in a different context. It
    is indeed located in the suggested package, and not in the package that benefits
    from the suggestion. Its interest lies in that it is possible to add a suggestion
    without having to modify the package that is concerned. Thus, all add-ons, plug-ins,
    and other extensions of a program can appear in the list of suggestions related
    to the software. Although it has existed for several years, this last field is
    still largely ignored by programs such as apt or synaptic. The original goal was
    to let a package like xul-ext-adblock-plus (a Firefox extension) declare Enhances:
    firefox, firefox-esr and thus appear in the list of suggested packages associated
    to firefox and firefox-esr.


    # Conflicts: the Conflicts Field


    The Conflicts field indicates when a package cannot be installed simultaneously
    with another. The most common reasons for this are that both packages include
    a file of the same name, provide the same service on the same transmission protocol
    (TCP) port, or would hinder each other''s operation.


    If it triggers a conflict with an already installed package, dpkg will refuse
    to install a package, except if the new package specifies that it will replace
    the installed package, in which case dpkg will choose to replace the old package
    with the new one. APT always follows your instructions: if you choose to install
    a new package, it will automatically offer to uninstall the package that poses
    a problem.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Incompatibilities: the Breaks Field


    The Breaks field has an effect similar to that of the Conflicts field, but with
    a special meaning. It signals the installation of a package will break another
    package (or particular versions of it). In general, this incompatibility between
    two packages is transitory and the Breaks relationship specifically refers to
    the incompatible versions.


    When a package breaks an already installed package, dpkg will refuse to install
    it, and apt will try to resolve the problem by updating the package that would
    be broken to a newer version (which is assumed to be fixed and, thus, compatible
    again).


    This type of situation may occur in the case of updates without backwards compatibility:
    this is the case if the new version no longer functions with the older version
    and causes a malfunction in another program without making special provisions.
    The Breaks field helps prevent these types of problems.


    # Provided Items: the Provides Field


    This field introduces the very interesting concept of a virtual package. It has
    many roles, but are two of particular importance. The first role consists in using
    a virtual package to associate a generic service with it (the package provides
    the service). The second indicates that a package completely replaces another
    and for this purpose, it can also satisfy the dependencies that the other would
    satisfy. It is thus possible to create a substitution package without having to
    use the same package name.


    | Meta-Package and Virtual Package | It is essential to clearly distinguish meta-packages
    from virtual packages. The former are real packages (including .deb files), whose
    only purpose is to express dependencies. |

    | Virtual packages, however, do not exist; they are a means of identifying real
    packages based on common, logical criteria (for example, service provided, or
    compatibility with a standard program or a pre-existing package). |


    Providing a Service Let''s discuss the first case in greater detail with an example:
    all mail servers, such as postfix or sendmail are said to provide the mail-transport-agent
    virtual package. Thus, any package that needs this to be functional (e.g. mailing
    list manager, such as smartlist or sympa) simply states in its dependencies that
    it requires a mail-transport-agent instead of specifying a large yet incomplete
    list of possible solutions. Furthermore, it is useless to install two mail servers
    on the same machine, which is why each of these packages declares a conflict with
    the mail-transport-agent virtual package. A conflict between a package and itself
    is ignored by the system, but this technique will prohibit the installation of
    two mail servers side by side.'
  merge: -1
