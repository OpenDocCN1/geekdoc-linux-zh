  md: '# How would you rate the severity of the problem or report?


    +   critical makes unrelated software on the system (or the whole system) break,
    or causes serious data loss, or introduces a security hole on systems where you
    install the package.


    +   grave makes the package in question unusable by most or all users, causes
    data loss, or introduces a security hole allowing access to the accounts of users
    who use the package.


    +   serious is a severe violation of Debian policy (that is, the problem is a
    violation of a ''must'' or ''required'' directive); or may not affect the usability
    of the package. Note that non-severe policy violations may be ''normal'', ''minor'',
    or ''wishlist'' bugs. (Package maintainers may designate other bugs as ''serious''
    and thus release-critical; however, end users should not do so). For the canonical
    list of issues worsening severity you can refer to this webpage: http://release.debian.org/testing/rc_policy.txt


    +   important a bug that has a major effect on the usability of a package, without
    rendering it completely unusable to everyone.


    +   does-build a bug that stops the package from being built from source. (This
    is a ''virtual severity'').


    +   normal a bug that does not undermine the usability of the package; for example,
    a problem with a particular option or menu item.


    +   minor things like spelling mistakes and other cosmetic errors that do not
    affect the core functionality of the package.


    +   wishlist suggestions and requests for new features.


