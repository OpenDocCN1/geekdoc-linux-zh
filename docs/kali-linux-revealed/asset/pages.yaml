  md: "# 9.2. Recompiling the Linux Kernel\n\nThe kernels provided by Kali include\
    \ the largest possible number of features, as well as the maximum number of drivers,\
    \ in order to cover the broadest spectrum of existing hardware configurations.\
    \ This is why some users prefer to recompile the kernel in order to include only\
    \ what they specifically need. There are two reasons for this choice. First, it\
    \ is a way to optimize memory consumption since all kernel code, even if it is\
    \ never used, occupies physical memory. Because the statically compiled portions\
    \ of the kernel are never moved to swap space, an overall decrease in system performance\
    \ will result from having drivers and features built in that are never used. Second,\
    \ reducing the number of drivers and kernel features reduces the risk of security\
    \ problems since only a fraction of the available kernel code is running.\n\n\
    > Important: If you choose to compile your own kernel, you must accept the consequences:\
    \ Kali cannot ensure security updates for your custom kernel. By keeping the kernel\
    \ provided by Kali, you benefit from updates prepared by the Debian Project.\n\
    \nRecompilation of the kernel is also necessary if you want to use certain features\
    \ that are available as patches (and not included in the standard kernel version).\n\
    \n| The Debian Kernel Handbook | The Debian kernel team maintains the Debian Kernel\
    \ Handbook (also available in the debian-kernel-handbook package) with comprehensive\
    \ documentation about most kernel-related tasks and how official Debian kernel\
    \ packages are handled. This is the first place you should look into if you need\
    \ more information than what is provided in this section. \n* http://kernel-handbook.alioth.debian.org\n\
    \n# 9.2.1. Introduction and Prerequisites\n\nSurprisingly, Debian and Kali manage\
    \ the kernel in the form of a package, which is not how kernels have traditionally\
    \ been compiled and installed. Since the kernel remains under the control of the\
    \ packaging system, it can then be removed cleanly, or deployed on several machines.\
    \ Furthermore, the scripts associated with these packages automate the interaction\
    \ with the bootloader and the initrd generator.\n\nThe upstream Linux sources\
    \ contain everything needed to build a Debian package of the kernel, but you still\
    \ need to install the build-essential package to ensure that you have the tools\
    \ required to"
