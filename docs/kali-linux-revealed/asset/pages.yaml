    lrwxr-wx 1 root 47 May 6 04:43 ldinux.c32 -> debian-installer/amd64/boot

    -screens/r-r-- 1 root lldinux.c32

    -rw-r-- 1 root 2650724 May 6 04:43 netboot.tar.gz

    lrwxr-wx 1 root 33 May 6 04:43 pselux.0 -> debian-installer/amd64/

