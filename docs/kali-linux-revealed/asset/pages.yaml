- img_proc: true
  md: 'as firewalls and packet filtering. Finally, we reviewed monitoring tools and
    strategies and showed how to best implement them to detect potential threats to
    your system.


    Summary Tips:


    +   * Take time to define a comprehensive security policy.

    * If you are running Kali on a publicly accessible server, change any default
    passwords for services that may be configured (see section 7.3, "Securing Network
    Services") [page 153]) and restrict their access with a firewall (see section
    7.4, "Firewall or Packet Filtering") [page 153]) prior to launching.

    * Use fail2ban to detect and block password-guessing attacks and remove brute
    force attacks.

    * If you run web servers, host over HTTPS to prevent network intermediaries from
    sniffing your traffic (which might include authentication cookies).

    * Real risk arises when you travel from one customer to the next. For example,
    your laptop could be stolen while traveling or seized by customs. Prepare for
    unfortunate situations by using full disk encryption (see section 4.2.2, "Installation
    on a Fully Encrypted File System" [page 85]) and consider the feature ("Adding
    a Nuke Password for Extra Safety" [page 245]) to protect your clients.

    * Implement rules (see section 7.4, "Firewall or Packet Filtering") [page 153])
    to forbid all outbound traffic except the traffic generated by your VPN access.
    This is meant as a safety net, so that when the VPN is down you immediately notice
    it (instead of falling back to the local network access).

    * Disable services that you do not use. Kali makes it easy to do this since all
    external network services are disabled by default.

    * The Linux kernel enables the netfilter firewall. There is no turn-key solution
    for configuring any firewall, since network and user requirements differ. However,
    you can control netfilter from user space with the iptables and iptables commands.

    * The logcheck program logs every file by default and sends unusual log messages
    in emails to the administrator for further analysis.

    * top is an interactive tool that displays a list of currently running processes.

    * dpkg --verify (or dpkg -V) displays the system files that have been modified
    (potentially by an attacker), which relies on checksums,

    * The Advanced Intrusion Detection Environment (AIDE) tool checks integrity and
    detects any changes against a previously-recorded image of the valid system.

    * Tripwire is very similar to AIDE but uses a mechanism to sign the configuration
    file, so that an attacker cannot make it point at a different version of the reference
    database.

    * Consider the use of rkhunter, checksecurity, chrootkit to help detect rootkits
    on your system.'
