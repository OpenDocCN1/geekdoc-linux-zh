    Ensure You Use the Latest Version It is very frustrating for developers to receive
    bug reports for problems that they have already solved or problems that they can''t
    reproduce with the version that they are using (developers almost always use the
    latest version of their product). Even older versions are maintained by the developers,
    the support is often limited to security fixes and major problems. Are you sure
    that you are using one of?


    That is why, before filing a bug report, make sure that you are using the latest
    version of the problematic system and application and that you can reproduce the
    problem in situation.


    If Linux does not offer the latest version of the application (neither in kali-rolling
    nor kali-bleeding-edge, see section 8.1.3.3, "The Kali-Bleeding-Edge Repository"
