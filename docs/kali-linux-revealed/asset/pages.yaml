- img_proc: true
  md: '# 5.3.1. Configuring a Specific Program


    When you want to configure an unknown package, you must proceed in stages. First,
    you should read what the package maintainer has documented. The /usr/share/doc/package/README
    file is a good place to start. This file will often contain information about
    the package, including pointers that may refer you to other documentation. You
    will save yourself a lot of time, and avoid a lot of frustration, by reading this
    file first since it details the most common errors and solutions to most common
    problems.


    Next, you should look at the software''s official documentation. Refer to section
    6.1, "Documentation Sources" [page 124] for tips on how to find various documentation
    sources. The dpkg -l package gives a list of files included in the package; you
    can quickly identify the available documentation (as well as the configuration
    files, located in /etc/). Also, dpkg -s package displays the package meta-data
    and shows any recommended or suggested packages; in turn, you can find documentation
    or use a utility that will ease the configuration of software.


    Finally, the configuration files are often self-documented by many explanatory
    comments detailing the various values for each configuration setting. In some
    cases, you can get software up and running by uncommenting a single line in the
    configuration file. In other cases, examples of configuration files are provided
    in the /usr/share/doc/package/examples/ directory. They may serve as a basis for
    your own configuration file.


    # 5.3.2. Configuring SSH for Remote Logins


    SSH allows you to remotely log into a machine, transfer files, or execute commands.
    It is an industry standard (ssh) and service (sshd) for connecting to machines
    remotely.


    While the openssh-server package is installed by default, the SSH service is disabled
    by default and is not started at boot. You can manually start the SSH service
    with systemctl start ssh or configure it to start at boot with systemctl enable
    ssh.


    The SSH service has a relatively default configuration, but given its powerful
    capabilities and sensitive nature, it is good to know what you can do with its
    configuration file, /etc/ssh/sshd_config. All the options are documented in sshd_config(5).


    The default configuration disables password-based logins for the root user, which
    means you must first up SSH keys with ssh-keygen. You can extend this to all users
    by setting PasswordAuthentication to no, or you can lift this restriction by changing
    PermitRootLogin yes (instead of the default prohibit-password). The SSH service
    listens by default on port 22 but you can change this with the Port directive.


    To apply the new settings, you should systemctl reload ssh.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# Generating New SSH Keys


    Each SSH server has its own cryptographic keys; they are named "SSH host keys"
    and are stored in /etc/ssh/ssh_host_*. They must be kept private if you want confidentiality
    and they should not be shared by multiple machines.


    When you install your system by copying a full disk image (instead of debian-installer),
    the image might contain pre-generated SSH host keys that you should replace with
    newly-generated keys. The image also comes with a default root password that you
    want to reset at the same time. You can do all this with following commands:


    ```

    # password

    ...

    # rm /etc/ssh/ssh_host *

    # dpkg-reconfigure openssh-server

    # service ssh restart

    ```


    # 5.3.3. Configuring PostgreSQL Databases


    PostgreSQL is a database server. It is rarely useful on its own but is used by
    many other services to store data. Those services will generally access the database
    server over the network and usually require authentication credentials to be able
    to connect. Setting up those services requires creating PostgreSQL databases and
    user accounts with appropriate privileges on the database. To be able to do that,
    we need the service to be running, let''s start it with systemctl start postgresql.


    | Multiple PostgreSQL versions supported | The PostgreSQL packaging allows for
    multiple versions of the database server to be co-installed. It is also possible
    to handle multiple clusters (a cluster is a collection of databases served by
    the same postmaster). To achieve this, the configuration files are stored in /etc/postgresql/version/cluster-name/.
    In order for clusters to run side-by-side, each cluster assigns the next available
    port number (usually 5433 for the second cluster). The postgresql.service file
    is an empty shell, making it easy to act on all clusters together as each cluster
    has its own unit (postgresql@version-cluster.service). |


    # Connection Type and Authentication


    By default, PostgreSQL listens for incoming connections in two ways: on TCP port
    5432 of the host interface and on file-based socket /var/run/postgresql/.PGSQL.5432.
    This can be configured in postgresql.conf with various directives: listen_addresses
    for the addresses to listen to, port for the TCP port, and unix_socket_directories
    to define the directory where the file-based sockets are created.'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'Depending on how they connect, clients are authenticated in different ways.
    The pg_hba.conf configuration file defines who is allowed to connect on each socket
    and how they are authenticated. By default, connections on the file-based socket
    use the Unix user account as the name of the PostgreSQL user, and it assumes that
    no further authentication is required. The TCP connection requires the user to
    authenticate with a username and a password (though not a Unix username/password
    rather one PostgreSQL itself).


    The postgres user is special and has full administrative privileges over all databases.
    We will use this identity to create new users and new databases.


    # Creating Users and Databases


    The createuser command adds a new user and drop removes one. Likewise, the createdb
    command adds a new database and dropdb removes one. Each of these commands have
    their own manual pages but we will discuss some of the options here. Each command
    on the default cluster (running on port 5432) but you can --port=port to modify
    acts and databases of an alternate cluster.


    These commands must connect to the PostgreSQL server to do their job and must
    be authenticated as a user with sufficient privileges to be the executed operation.
    The easiest way to achieve this is to use the postgres Unix account and connect
    over the file-based socket:


    ```

    # su - postgres

    $ createuser -P king_phisher

    ter password for new role:

    Enter it again:

    $ createdb -T template0 -E UTF-8 -O king_phisher king_phisher

    $ exit

    ```


    In the example above, the -P option asks create for a password once it creates
    the new king_phisher user. Looking at the createdb command, the -O defines the
    user owning the new database (which will have full rights to create tables and
    grant permissions and so on). We also want to be Unicode strings, so we add the
    -E UTF-8 option to set the encoding, in which requires us to use the -O option
    to pick another database template.


    We can now test that we can connect to the database over the socket listening
    on localhost (-h localhost) as the king_phisher user (-U king_phisher):


    ```

    # psql localhost -U king_phisher king_phisher

    Password for user king_phisher:

    psql (9.5.2)

    SSL connection (protocol: TLSv1.2, cipher: ECDHE-RSA-AES256-GCM-SHA384, bits:
    256,

    ↳ compression: off)

    ```


    Type "help" for help.


    king_phisher=>'
