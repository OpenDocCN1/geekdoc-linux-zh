  md: "APT retrieves its packages from a repository, a package storage system or simply,\
    \ \"package source\". The /etc/apt/sources.list file lists the different repositories\
    \ (or sources) that publish Debian packages.\n\n# 8.1.2. Understanding the sources.list\
    \ File\n\nThe sources.list file is the configuration file for defining package\
    \ sources, and it is important to understand how it is laid out and how to configure\
    \ it since APT will function without a properly defined list of package sources.\
    \ Let's discuss its syntax, take a look at the various repositories that are used\
