    Unlike other systems, Linux possesses only one such hierarchy, and can integrate
    data from several disks. One of these disks becomes the root, and the others are
    mounted on directories in the hierarchy (the Linux command is called mount). These
    other disks are available under the mount points. This allows storing users''
    home directories (traditionally stored within /home/) on a separate hard disk,
    which will contain the busy directory (along with home directories of other users).
    Once you mount /home/, these directories become accessible at their locations,
    and paths such as /home/bxy/Desktop/hello.txt keep working.


    There are many file system formats, organizing to many ways of physically storing
    data on disks. The most widely known are ext2, ext3, and ext4, others exists.
    For instance, VFAT is the filesystem that was historically used by DOS and Windows
