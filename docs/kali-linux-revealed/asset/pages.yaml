  md: '(+), or subtracting (-). Thus u=rw,g+rw,o gives the owner, write, and execute
    rights, adds read and write rights for the owner group, removes rights for other
    users. Rights not altered by the addition or subtraction in a command remain unmodified.
    The letter a, for all, covers three categories of users, so that a-rx grants all
    three categories the same rights (read and execute, but not write).


    The (octal) numeric representation associate each right with a value: 4 for read,
    2 for write, and 1 for execute. We associate each combination of rights with the
    sum of the three figures, and a value is assigned to each category of users, in
    the usual order (owner, group, others).


    For instance, the chmod 754 file will set the following rights: read, write and
    execute for the owner (5 = 4 + 2 + 1); read-only for others. The 0 means no rights;
    chmod 600 file allows read and write permissions for the owner, and no rights
    for anyone else. The most frequent rights are 755 for executable files and directories,
    and 644 for data files.


    To represent special rights, you can prefix a digit to this number according to
    the same principle, which the setuid, setgid, and sticky bits are 4, 2, and 1,
