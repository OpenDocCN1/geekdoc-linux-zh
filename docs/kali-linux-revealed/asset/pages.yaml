  md: '# 11.2. Types of Assessments


    Now that you have ensured your Kali environment is ready, the next step is defining
    exactly what sort of assessment you are conducting. At the highest level, we may
    describe four types of assessments: a vulnerability assessment, a compliance test,
    a traditional penetration test, and an application assessment. An engagement may
    involve various elements of each type of assessment but it is worth describing
    them in some detail and explaining their relevance to your Kali Linux build and
    environment.


    Before delving into the different types of assessments, it is important to first
    note the difference between a vulnerability and an exploit.


    A vulnerability is defined as a flaw that, when taken advantage of, will compromise
    the confidentiality, integrity, or availability of an information system. There
    are many different types of vulnerabilities that can be encountered:


    +   * File Inclusion: File inclusion vulnerabilities¹ in applications allow you
    to include the contents of a local or remote file into the computation of a program.
    For example, a application may have a "Message of the day" function that reads
    the contents of a file and includes it in the web page to display to the user.
    When this type of feature is programmed incorrectly, it can allow an attacker
    to modify their web request to force the site to include the contents of a file
    of their choosing.

    * SQL Injection: A SQL injection² attack is one where the input validation routines
    for the program are bypassed, allowing an attacker to provide SQL commands for
    the targeted program to execute. This is a form of command execution that can
    lead to potential security issues.

    * Buffer Overflow: A buffer overflow³ is a vulnerability that bypasses input routines
    to write data into a buffer’s adjacent memory. In some cases, adjacent memory
    location to be critical to the operation of the targeted program and code execution
    can be obtained through careful manipulation of the overwritten memory data.

    * Race Conditions: A race condition⁴ is a vulnerability that takes advantage of
    dependencies in a program. In some cases, the workflow of a program depends on
    a specific sequence of events. If you can alter this sequence of events, that
    may lead to a vulnerability.


    An exploit, on the other hand, is software that, when used, takes advantage of
    a specific vulnerability, although not all vulnerabilities are scalable. An exploit
    must create a running process, forcing it to make an unintended action, exploit
    creation can be complex. Furthermore, there are a number of anti-exploit technologies
    in modern computing platforms that have


    > ¹https://en.wikipedia.org/wiki/File_inclusion_vulnerability

    ²https://en.wikipedia.org/wiki/SQL_injection

    ³https://en.wikipedia.org/wiki/Buffer_overflow

    ⁴https://en.wikipedia.org/wiki/Race_condition'
  merge: -1
