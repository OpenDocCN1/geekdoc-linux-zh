  md: 'With package-lists, you can only include packages that are already available
    in the official Kali repository. But if you have custom packages, you can include
    them in the live image by placing the .deb files in a packages.chroot directory
    (for example kali-config/config-gnome/packages.chroot if you build the GNOME variant).


    Meta-packages are empty packages whose sole purpose is to have many dependencies
    on other packages. They make it easier to install sets of packages that you often
    want to install together. The kali-linux source package builds all the meta-packages
    provided by Kali Linux:


    +   * kali-linux: the base system (it is pulled by all the other meta-packages)

    * kali-linux-full:the default Kali Linux installation

    * kali-linux-all: meta-package of all the meta-packages and other packages (almost
    everything that Kali provides so it is really huge)

    * kali-linux-sdr: Software Defined Radio (SDR) tools

    * kali-linux-gpu: GPU-powered tools (tools using the computing power available
    in your graphical card)

    * kali-linux-wireless: wireless assessment and analysis tools

    * kali-linux-web: web applications assessment tools

    * kali-linux-forensic: forensic tools (finding evidence of what hasened)

    * kali-linux-voip: Voice Over IP tools

    * kali-linux-pwtools: password cracking tools

    * kali-linux-top10: the ten most popular tools

    * kali-linux-rfid: RFID tools


    You can learn these meta-packages when you create custom package lists for live-build.
    The full list of available meta-packages and the tools they can include can be
    found at http://tools.kali.org/metapackages


    | Debconf Preeding of Installed Packages | You can provide Debconf preseed files
    (see section 4.3.2, "Creating a Preseed File" [page 93] for explanations) as preseed/*.cfg
    files. They will be used to configure packages installed in the live |


    # 9.3.4. Using Hooks to Tweak the Contents of the Image


    live-build offers hooks that can be executed at different steps of the build process.
    Chroot hooks are executable scripts that you install as hooks/live/*.chroot files
    in your config tree and are executed within the chroot. While chroot is the command
    that lets temporarily change the operating system''s root directory to a directory
    of your choice, it is also used by extension'
