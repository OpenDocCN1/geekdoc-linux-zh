    **Figure 4.1** Boot Screen


    Once booted, the installation program guides you step-by-step through the process.
    We will take a look at each of these steps in detail. We will cover installation
    from a standard Kali Linux DVD-ROM; installations from a mini.iso may look slightly
    different. We will also address graphical mode installation, but the only difference
    from classic text-mode installation is the appearance. The versions pose identical
    questions and present identical options.'
