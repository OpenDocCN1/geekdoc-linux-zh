    The unpacked files include the pselux bootloader, which uses the same configuration
    files as syslinux and isolux. Because of this, you can tweak the boot files in
    debian-installer/amd64/boot-screens/ as you would when generating custom Kali
    Linux Live images.


    For example, assuming that you have picked the textual installer, you can add
    parameters to preed the language, country, keymap, hostname, and domainname values.
    You can also point the installer to an external preset URL and configure the timeout
    so that the boots automatically if no key is pressed within 5 seconds. To accomplish
    this, you would first modify the debian-installer/amd64/txt.cfg file:


    ```

    label install

    menu label ^Install

    kernel debian-installer/amd64/initrd.gz quiet language=en

    append vga=788 initrd-debian-installer/amd64/initrd.gz ---

    country=US keymap=us hostname=kali-domain url=http://192.168.101.1/

    -preseed.cfg

    ```


    Then, you would modify the debian-installer/syslinux.cfg to adjust the timeout:


    ```

    # D-I config version 2.0

    # search path for the c32 support libraries (libcom, bitutil etc.)

    path debian-installer/amd64/boot-screens/

    include debian-installer/amd64/boot-screens/menu.cfg

    default debian-installer/amd64/boot-screens/vesamenu.c32

    prompt 0

    timeout 50

    ```


    Armed with the ability to boot any machine from the network via PXE, you can take
    advantage of all the features outlined in section 4.3, “Unattended Installations”
    [page 91], enabling you to do full booting, preseeding, and unattended installation
    on multiple computers without physical boot media. Also, don''t forget the flexibility
    of the boot parameter preset/url=http://server/preseed.cfg (or the use of an alias),
    which allows you to set a network-based preset file.'
