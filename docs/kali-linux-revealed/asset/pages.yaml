    # 7.4.3. Creating Rules


    Each rule requires one invocation of iptables or ip6tables. Typing these commands
    manually can be tedious, the calls are usually stored in a script so that the
    system is automatically configured the same way every time the machine boots.
    This script can be written by hand but it can also be interesting to prepare it
    with a high-level tool such as fwbuilder.


    ```

    # apt install fwbuilder

    ```


    The principle is simple. In the first step, describe all the elements that will
    be involved in the actual rules:


    +   - The firewall itself, with its network interfaces

    - The networks, with their corresponding IP ranges

    - The servers

    - The ports belonging to the services hosted on the servers


    Next, create the rules with simple drag-and-drop actions on the objects as shown
    in Figure 7.2, "Fbuilder''s Main Window" [page 160]. A contextual menu can change
    the condition (negating it, for instance). Then the action needs to be chosen
    and configured.


    As far as IPv6 is concerned, you either create two distinct rulesets for IPv4
    and IPv6, or only one and let fw translate the rules according to the addresses
    assigned to the objects.'
