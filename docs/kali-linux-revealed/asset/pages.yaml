  md: '# Retrieving Sources from Git


    You might have noticed the apt source invocation tells you about a possible Git
    repository used to maintain the package. The might may point to a Debian Git repository
    or to a Kali repository.


    All Kali-specific packages are maintained in Git repositories hosted on git.kali.org/.
    You can retrieve the sources from those repositories with git clone git://kali.org/packages/source-package.
    If the operation doesn''t yield the expected sources, switching to the kali/master
    branch with git checkout kali/master.


    Contrary to what you get with apt source, the obtained tree will not have patches
    automatically applied. Have a look at debian/patches/ to learn about the possible
    changes made by kali.


    ```

    $ git clone git://kali.org/packages/kali-meta

