  md: '# 7.4.2. Syntax of iptables and ip6tables


    The iptables and ip6tables commands are used to manipulate tables, chains, and
    rules. -t table option indicates which table to operate on (by default, filter).


    # Commands


    +   - -L chain lists the rules in a chain. (for example, iptables -n -L INPUT
    will display the rules related to incoming packets).

    - -N chain creates a new chain. You can create new chains for a number of purposes,
    including testing a new network service or fending off an attack.

    - -X chain deletes an empty and unused chain (for example, iptables -X ddos-attack).

    - -A chain adds a rule at the end of the given chain. Remember that rules are
    processed from top to bottom so to keep this in mind when adding rules.

    - -I chain rule_num inserts a rule before the rule_num. As with the -A option,
    keeping the processing order in mind when inserting new rules into a chain.

    - -D chain rule_num (or -D chain) deletes a rule in a chain; the first syntax
    identifies the rule to be deleted by its number (iptables -L --line-numbers will
    display these numbers), which the latter identifies by its contents.

    - -F flushes a chain (deletes all its rules). For example, to delete all of the
    rules related to outgoing packets, you would run iptables -F OUTPUT. If no chain
    is mentioned, all in the table are deleted.

    - -P chain defines the default action, or “policy” for a given chain; note that
    only standard chains can have a policy. To drop all incoming traffic by default,
    you would run iptables -P INPUT DROP.


    # Rules


    Each rule is expressed as conditions -j action action_options. If several conditions
    are described in the same rule, then the criterion is the conjunction (logical
    AND) of the conditions, which is at least restrictive as each individual condition.


    The -p protocol condition matches the protocol field of the IP packet. The most
    common values are tcp, udp, icmp, and icmp6. This condition can be complemented
    with conditions on the TCP ports, with clauses such as --source-port port and
    --destination-port.'
