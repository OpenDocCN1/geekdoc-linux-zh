    \ of the /etc/apt/sources.list.d/* ) contains the description of a source, made\
    \ of three parts separated by spaces. Comments begin with a # character:\n\n```\n\
    # deb cdrom:[Debian GNU/Linux 2016.1 Kali-rolling_ Official Snapshot amd64 LIVE/\n\
    \ INSTALL Binary 20160830-11:29]/kali-rolling contrib main non-free\n```\n\ndeb\
    \ http://kali.kali.org/kali-rolling main non-free contrib\n\nLet's take a look\
    \ at the syntax of this file. The first field indicates the source type:\n\n+\
    \   - deb for binary packages,\n- deb-src for source packages.\n\nThe second field\
    \ gives the base URL of the source: this can consist of a Debian mirror or any\
    \ other archive set up by a third party. The URL can start with file:// to indicate\
    \ a local source installed in the system's file hierarchy, or with ftp:// for\
    \ a source available on an FTP server. The URL can start with cdrom: for CD-ROM/DVD-ROM/Blu-ray\
    \ based installations, this is less frequent since network-based installation\
    \ methods are more and common.\n\nThe cdrom entries describe the CD/DVD-ROMs.\
    \ Unlike other entries, a CD-ROM is not always available, since it has to be inserted\
    \ into the drive and only one disc can be read at a time. For those reasons, these\
    \ sources are managed in a slightly different way and need to be added with the\
    \ apt-cdrom program, usually executed with the add parameter. The latter will\
    \ then request the disc to be inserted in the drive and will browse its contents\
    \ for Packages files. It will use these files to update its database of available\
    \ packages (this operation is usually done by the apt update command). After that,\
    \ APT will request the disc if it needs a package\n\nThe syntax of the last field\
    \ depends on the structure of the repository. In the simplest cases, you simply\
    \ indicate a subdirectory (with a required trailing slash/) of the desired source\
    \ (this is often a simple \"./\", which refers to the absence of a subdirectory—the\
    \ packages are directly"
