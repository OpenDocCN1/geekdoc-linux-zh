    # 4.6. Summary


    In this chapter, we focused on the Kali Linux installation process. We discussed
    Kali Linux’s minimum-installation requirements, the installation process for standard
    and fully encrypted file systems, preseeding, which allows unattended installations,
    how to install Kali Linux on various devices, and what to do in the rare case
    of an installation failure.


    Summary Tips:'
