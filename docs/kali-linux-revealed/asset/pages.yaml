  md: '• RETURN: interrupt processing of the current chain and return to the calling
    chain; in case the current chain is a standard one, there''s no calling chain,
    so the default action (defined with -P option to iptables) is executed instead.


    • SNAT (only in the nat table): apply Source Network Address Translation (SNAT).
    Extra options describe the exact changes to apply, including the --source-address:port
    option, which defines the new source IP address and/or port.


    • DNAT (only in the nat table): apply Destination Network Address Translation
    (DNAT). Extra options describe the exact changes to apply, including the --to-destination:port
    option, which defines the new destination IP address and/or port.


    • MASQUERADE (only in the nat table): apply masquerading (a special case of Source
    NAT).


    • REDIRECT (only in the nat table): transparently redirect a packet to a given
    port of the firewall itself; this can be used to set up a transparent web proxy
    that works with no configuration on the client side, since the client thinks it
    connects to the network whereas the communications actually go through the proxy.
    --to-ports(s) option indicates the port, or port range, where the packets are
    redirected.


    Other actions, particularly those concerning the mangle table, are outside the
    scope of this text. The iptables(8) and iptables(8) pages have a comprehensive
    list.


    # What is ICMP?


    Internet Control Message Protocol (ICMP) is the protocol used to transmit ancillary
    information on communications. It tests connectivity with the ping command, which
    sends an ICMP echo request message, which the recipient is meant to answer with
    an ICMP echo reply message. It signals a firewall rejecting a packet, indicates
    an overflow in a receiver buffer, proposes a better route for the next packets
    in the connection, and so on. This protocol is defined by several RFC documents.
    RFC777 and RFC792 were the first, but many have been extended and revised by the
    protocol.


    ```

    ⇒ http://www.faqs.org/rfcs/rfc777.html

    ```


    ```

    ⇒ http://www.faqs.org/rfcs/rfc792.html

    ```


    For reference, a receiver buffer is a small memory storing area between the time
    it arrives from the network and the kernel handles it. If this zone is full, new
    data cannot be received and ICMP signals the problem so that the emitter can down
    its transfer rate (which should ideally reach an equilibrium after some time).


    Note that IPv4 network can work without ICMP, ICMP6 is strictly required for IPv6
    network, since it combines several functions that were, in the IPv4 world, spread
    across IPv4, Internet Group Membership Protocol (IGMP), and Address-Resolution
    Protocol (ARP). ICMP6 is defined in RFC4443.


    ```

    ⇒ http://www.faqs.org/rfcs/rfc4443.html

    ```


    ![](img/f888cd88b4fb3dd45062e14ce223cc4f_181_0.png)'
