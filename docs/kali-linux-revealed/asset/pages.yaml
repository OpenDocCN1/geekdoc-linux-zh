    # Managing PostgreSQL Clusters


    First, it is worth noting that the concept of "PostgreSQL cluster" is a Debian-specific
    addition and that you will not find any reference to this term in the official
    PostgreSQL documentation. From the point of view of the PostgreSQL tools, such
    a cluster is just an instance of a database server running on a specific port.


    That said, Debian''s postgres-common package provides multiple tools to manage
    such clusters: `pg_createcluster`, `pg_dropcluster`, `pg_ctlcluster`, `pg_upgradecluster`,
    `pg_renamecluster`, and `pg_lsclusters`. We won''t cover all those tools here,
    but you can refer to their respective manual pages for more information.


    What you must know is that when a new version of PostgreSQL gets installed on
    your system, it will create a new cluster that runs on the next port (usually
    5433) and you will keep using the old version until you migrate your databases


    You can retrieve a list of all clusters and their status with `pg_lsclusters`.
    More importantly, you can automate the migration of your cluster to the latest
    PostgreSQL version with `pg_upgradecluster old-version cluster-name`. For this
    to succeed, you might have to remove the (empty) cluster created for the new version
    (with `pg_dropcluster new-version cluster-name`). The old cluster is not dropped
    in the process, but it also won''t be started automatically. You can drop it once
    you have checked that the upgraded cluster works.


    # 5.3.4. Configuring Apache


    A typical Linux installation includes the Apache web server, provided by the apache2
    package. Being a network service, it is disabled by default. You can manually
    start it with systemctl start apache2.


    With and more applications being distributed as web applications, it is important
    to have some knowledge of Apache in order to host those applications, whereas
    for local usage or for making them available over the network.


    Apache is a modular server and many features are implemented by external modules
    that the main program loads during its initialization. The default configuration
    only enables the most common modules, enabling new modules is easily done by running
    a2enmod module. Use a2dismod module to disable a module. These programs actually
    create (or delete) symbolic links in `/etc/apache2/mods-enabled/`, pointing at
    the actual files (stored in `/etc/apache2/mods-available/`).


    There are many modules available, but two are worth initial consideration: PHP
    and SSL. Web applications with PHP are executed by the Apache web server with
    the'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'module provided by the libapache-mod-php package, and its installation automatically
    enables the module.


    Apache 2.4 includes the SSL module required for secure HTTP (HTTPS) out of the
    box. It first needs to be enabled with a2enmod ssl, then the required directives
    must be added to the configuration files. A configuration example is provided
    in /etc/apache2/sites-available/default-ssl.conf. See http://httpd.apache.org/docs/2.4/mod_ssl.html
    for more information.


    The full list of standard Apache modules can be found online at http://httpd.apache.org/docs/2.4/mod/index.html.


    With its default configuration, the web server listens on port 80 (as configured
    in /etc/apache2/ports.conf), and serves pages from the /var/www/html/ directory
    by default (as configured in /etc/apache2/sites-enabled/000-default.conf).


    # Configuring Virtual Hosts


    A virtual host is an extra identity for the web server. The same Apache process
    can serve multiple websites (say www.kali.org and www.offensive-security.com)
    because the HTTP requests embed both the name of the website requested and the
    URL location (this feature is known as name-based virtual hosts).


    The default configuration for Apache 2 enables name-based virtual hosts. In, a
    default virtual host is defined in the /etc/apache2/sites-enabled/000-default.conf
    file; this virtual host is used if no host matching the request sent by the client
    is found.


    > Requests concerning unknown virtual hosts will always be served by the first
    defined virtual host, which is why the package ships a 000-default.conf configuration
    file, which sorts first among other files that you might create.


    Each extra virtual host is defined by a file in /etc/apache2/sites-available/.
    The file is usually named after the hostname of the website followed by a .conf
    suffix (for example: www.example.com.conf). You can enable the new virtual host
    with a2ensite www.example.com. Here is a minimal virtualhost configuration for
    a website whose files are stored in /srv/www/example.com/www/ (defined with the
    DocumentRoot option):


    ```

    <VirtualHost *:80>

    ServerName www.example.com

    ServerAlias example.com

    ```'
