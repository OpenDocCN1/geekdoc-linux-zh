    # ## 11.3. Formalization of the Assessment


    With your Kali environment ready and the type of assessment defined, you are almost
    ready to start working. Your last step is to formalize the work to be done. This
    is critically important, as this defines the expectations for the work will be,
    and grants you permission to conduct what might otherwise be illegal activity.
    We will cover this at a high level, but this is a very complex and important step
    you will likely want to check with your organization''s legal representative for
    assistance.

    as part of the formalization process, you will need to define the rules of engagement
    for the work. This covers items such as:


    +   * What systems are you allowed to interact with? It is important to ensure
    you don''t accidentally interfere with anything that is critical to business operations.

    * What time of day and over when your attack window is the assessment allowed
    to occur? Some organizations like to limit the times that the assessment work
    can be conducted.

    * When you discover a potential vulnerability, are you allowed to exploit it?
    If not, what is the approval process? There are some organizations that take a
    very controlled approach to each exploitation attempt, whereas others would like
    a more realistic approach. It is best to define these expectations clearly before
    work begins.

    * If a significant issue is discovered, how should it be handled? Sometimes, organizations
    want to be informed right, otherwise it is typically addressed at the end of the
    assessment.

    * In case of emergency, who should you contact? It is always important to know
    who to contact when a problem of any sort occurs.

    * Who will know about the activity? How will it be communicated to them? In some
    cases, organizations will want to test their incident response and detection performance
    as part of the assessment. It is always a good idea to know this beforehand, so
    you know if you should take any degree of stealth to the assessment.


