    Manual Pages\" [page 124]).\n\n# 8.3.2. Managing Package Priorities\n\nOne of\
    \ the most important aspects in the configuration of APT is the management of\
    \ the priorities associated with each package source. For instance, you might\
    \ want to extend your Kali Rolling system with one or newer packages from Debian\
    \ Stable or Debian Experimental. It is possible to assign a priority to each available\
    \ package (the same package can have several priorities depending on its version\
    \ or the distribution providing it). These priorities influence APT's behavior:\
    \ for each package, it will always select the version with the highest priority\
    \ (except if this version is older than the one installed and its priority is\
    \ less than 1000).\n\nAPT defines several default priorities. Each installed package\
    \ has a priority of 100. A non-installed version has a priority of 50 by default\
    \ but it can jump to 990 if it is part of the target release (defined with the\
    \ -t command-line option or APT::Default-Release configuration).\n\nYou can modify\
    \ the priorities by adding entries in the /etc/apt/preferences file with the names\
    \ of the affected packages, their version, their origin and their new priority.\n\
    \nAPT will never install an older version of a package (that is, a package whose\
    \ version number is lower than the one of the currently installed package) unless\
    \ its priority is higher than 1000. APT will always install the highest priority\
    \ package that follows this constraint. If two packages have the same priority,\
    \ APT installs the newest one (whose version number is the highest). If two packages\
    \ of same version have the same priority but differ in their content, APT installs\
