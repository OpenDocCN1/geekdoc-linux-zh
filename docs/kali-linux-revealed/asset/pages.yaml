  md: 'Kali has been built a highly modular and customizable penetration testing framework
    and allows for some fairly advanced customization and usage. Customizations can
    happen at multiple levels, beginning at the source code level. The sources of
    all Kali packages are publicly available. In this chapter, we will show how you
    can retrieve packages, modify them, and build your own customized packages out
    of them. The Linux kernel is somewhat of a special case and as such, it is covered
    in a dedicated section (section 9.2, “Recompiling the Linux Kernel” [page 232]),
    where we will discuss where to find sources, how to configure the kernel build,
    and finally to compile it and how to build the associated packages.


    The second level of customization is in the process of building ISO images. We
    will show how the live-build offers plenty of hooks and configuration options
    to customize the resulting ISO image, including the possibility to use custom
    Debian packages in place of the packages available.


    We will also discuss how you can create a persistent ISO built onto a USB key
    that will preserve files and operating system changes between reboots.


    # 9.1. Modifying Kali Packages


    Modifying Kali packages is usually a task for Kali contributors and developers:
    they update packages with new upstream versions, they tweak the default configuration
    for a better integration in the distribution, and they fix bugs reported by users.
    But you might have specific needs not fulfilled by the official packages and knowing
    how to build a modified package can then be very valuable.


    You might wonder why you not bother with the package at all. After all, if you
    have to modify a piece of software, you can always grab its source code (usually
    with git) and run the modified version directly from the source checkout. This
    is fine when it is possible and when you use your home directory for this purpose,
    but if your application requires a system-wide setup (for example, with a make
    install) then it will pollute your file system with files unknown to dpkg and
    will soon create problems that cannot be caught by package dependencies. Furthermore,
    with proper packages you will be able to share your changes and deploy them on
    multiple computers more easily or revert the changes after discovering they were
    not working as well as you hoped.


    So when you would want to modify a package? Let’s take a look at a few examples.
    First, we will assume that you are a heavy user of SET and you noticed a new upstream
    release but the Kali developers are all busy for a conference and you want to
    try it immediately. You want to update the package yourself. In another case,
    we will assume that you are struggling to get your MIFACE card working and you
    want to rebuild “libfree” to enable debug messages in order to have actionable
    data to provide in a bug report that you are currently preparing. In a last case,
    we will assume that the “pyrit” program fails with a cryptic error message. After
    a search, you find a commit that you expect to fix your problem in the upstream
    GitHub repository and you want to rebuild the package with this fix applied.'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'We will go through all samples in the following sections. We will try to generalize
    the explanations so that you can apply better the instructions to other cases
    but it is impossible to cover all situations that you might encounter. If you
    hit problems, apply your best judgment to find a solution or go seek help on the
    most appropriate forums (see chapter 6, “Helping Yourself and Getting Help” [page
    124].


    Whatever change you want to make, the general process is always the same: grab
    the package, extract what you want, then build the package. For each step, there
    are often multiple tools that can handle the task. We picked the most relevant
    and most popular tools, and our review is not exhaustive.


    # 9.1.1. Getting the Sources


    Rebuilding a Kali package starts with getting its source code. A source package
    is composed of multiple files: the main file is the *.dsc (Debian Source Control)
    file as it lists the other files, which can be *.tar.gz,bz2, xz, sometimes *.diff.gz,
    or *.debian.tar.gz,bz2, xz files.


    The source packages are stored on Kali mirrors that are available over HTTP. You
    could use your web browser to download all the required files by the easiest way
    to accomplish this is to use the apt source package_name command. This command
    requires a deb-src line in the /etc/apt/sources.list and up-to-date index files
    (accomplished by running apt update). By default, Kali doesn''t add it as few
    Kali users need to retrieve source packages but you can easily add it (see sample
    file in section 8.1.3, “Kali Repositories” [page 173] and the associated explanations
    in 8.1.2, “Understanding the sources.list File” [page 172]).


    ```

