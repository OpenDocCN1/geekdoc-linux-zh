    Need to get 456 KB of archives.

    After this operation, 14.6 MB of additional disk space will be used.

    Do you want to continue? [Y/n]

    --]

    ```


    In this sample, all build dependencies can be satisfied with packages available
    to APT. This might not always be the case as the tool kali-rolling does not ensure
    install of build dependencies (only dependencies of binary packages are taken
    into account). In practice, binary dependencies and build dependencies are often
    tightly coupled and most packages will have their build dependencies satisfiable.


    # 9.1.3. Making Changes


    We can''t cover all the possible changes that you might want to make to a given
    package in this section. This would amount to teaching you all the gritty details
    of Debian packaging. However, we will cover the three common cases presented earlier
    and will explain some of the unavoidable parts (like maintaining the changelog
    file).


    The first thing to do is to change the package version number so that the reboot
    packages can be distinguished from the original packages provided by Kali or Debian.
    To achieve this, we usually add a suffix identifying the entity (person or company)
    applying the changes. Since buxy is my IRC name, I will use it as the suffix.
    Such a change is best effected with the dch command (Debian Changelog) from the
    devscripts package, with a command such as dch --local buxy invokes


    > https://www.debian.org/doc/manuals/maint-/'
