    You might also consider adding CustomLog and ErrorLog directives to configure
    Apache to output

    logs in files dedicated to the virtual host.


    # Common Directives


    This section briefly reviews some of the commonly-used Apache configuration directives.

    nThe main configuration file usually includes several Directory blocks; they allow
    specifying dif-

    fer behaviors for the server depending on the location of the file being served.
    Such a block

    includes Options and AllowOverride directives:


    ```

    <Directory /var/www>

    Options Includes FollowSymLinks

    AllowOverride All

    DirectoryIndex index.php index.html index.htm

    </Directory>

    ```


    The DirectoryIndex contains a list of files to try when the client requests a
    direc-

    t first file in the list is used and sent as a response.

    The Options directive is followed by a list of options to enable. The None value
    disables all options;

    correspondingly, All enables all except MultiViews. Available options include:


    +   - ExecCGI—indicates that CGI scripts can be executed.

    - FollowSymLinks—tells the server that symbolic links can be followed, and that
    the response

    should contain the contents of the target such links.

    - SymLinksIfOwnerMatch—also tells the server to follow symbolic links, but only
    when the

    link and its target have the same owner.

    - Includes—enables Server Includes (SSI). These are embedded in HTML pages

    and executed on the fly for each request.

    - Indexes—tells the server to list the contents of a directory if the HTTP request
    by the

    client points to a directory without an index file (that is, when no files mentioned
    by the

    DirectoryIndex exist in this directory).

    - MultiViews—enables content negotiation, this can be used by the server to return
    a web

    page matching the preferred language as configured in the browser.


    Requiring Authentication In some circumstances, access to part of a website needs
    to be re-

    stricted, so only legitimate users who provide a username and a password are granted
    access to

    the contents.'
