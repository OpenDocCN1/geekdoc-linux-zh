  md: 'This is pretty much like all existing Linux distributions but there are other
    features that differentiate Kali Linux, many of which are tailored to the specific
    needs of penetration testers. Let''s have a look at some of those features.


    # 1.4.1. A Live System


    Contrary to most Linux distributions, the main ISO image that you download is
    not simply dedicated to installing the operating system; it can also be used as
    a bootable live system. In other words, you can use Kali Linux without installing
    it, just by booting the ISO image (usually after having copied the image onto
    a USB key).


    The live system contains the tools most commonly used by penetration testers so
    if your day-to-day system is not Kali Linux, you can simply insert the disk or
    USB key and reboot to run Kali. However, keep in mind that the default configuration
    will not preserve changes between reboots. If you configure persistence with a
    USB key (see section 9.4, “Adding Persistence to the Live ISO with a USB key”
    [page 239]), then you can tweak the system to your liking (modify config files,
    save reports, upgrade software, and install additional packages, for example),
    and the changes be retained across reboots.


    # 1.4.2. Forensics Mode


    In general, when doing forensics on a system, you want to avoid any activity that
    would alter the data on the analyzed system in any way. Unfortunately, modern
    desktop environments tend to interfere with this objective by trying to auto-mount
    any disk(s) they detect. To avoid this behavior, Kali Linux has a forensics mode
    that can be enabled from the boot menu: it will disable all features.


    The live system is particularly useful for forensics purposes, because it is possible
    to reboot your computer into a Kali Linux system without accessing or modifying
    its hard disks.


    # 1.4.3. A Custom Linux Kernel


    Kali Linux always provides a customized recent Linux kernel, based on the version
    in Debian unstable. This ensures solid hardware support, especially for a wide
    range of wireless devices. The kernel is patched for wireless injection support
    since many wireless security assessment tools rely on this feature.


    Since many hardware devices require up-to-date firmware files (found in /lib/firmware/),
    Kali installs them all by default—including the firmware available in Debian''s
    non-free section. Those are not installed by default in Debian, because they are
    closed-source and thus not part of Debian proper.'
