  md: '# Detecting Network Hardware


    In this step, the installer will try to automatically identify the network card
    and load the corresponding module. If automatic detection fails, you can manually
    select the module to load. If all else fails, you can load a specific module from
    a removable device. This last solution is usually only needed if the appropriate
    driver is not included in the standard Linux kernel, but available elsewhere,
    such as the manufacturer’s website.


    This step must absolutely be successful for network installations (such as those
    done when booting from a mini.iso), since the Debian packages must be loaded from
    the network.


    # Configuring the Network


    In order to operate the process as much as possible, the installer attempts an
    automatic network configuration using dynamic host configuration protocol (DHCP)
    for IPv4 and IPv6 and ICMPv6’s Neighbor Discovery Protocol (for IPv6), as shown
    in Figure 4.5, “Network Autoconfiguration” [page 71].


    ![](img/f888cd88b4fb3dd45062e14ce223cc4f_96_0.png)


    If the automatic configuration fails, the installer offers more choices: try again
    with a normal DHCP configuration, attempt DHCP configuration by declaring the
    name of the machine, or set up a static network configuration.


    This last option requires an IP address, a subnet mask, an IP address for a potential
    gateway, a machine name, and a domain name.'
