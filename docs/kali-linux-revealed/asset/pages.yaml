  md: 'Systemd journal also stores multiple logs (stdout/stderr output of daemons,
    syslog messages, kernel logs) and makes it easy to query them with journalctl.
    Without any arguments, it dumps all the available logs in a chronological way.
    With the -r option, it will reverse the order that newer messages are shown first.
    With the -f option, it will continuously print log entries as they are appended
    to the database. The -u option can limit the messages to those emitted by a specific
    systemd unit (ex: journalctl -u ssh.service).


    # 3.4.6. Discovering the Hardware


    The kernel exports many details about hardware through the /proc/ and /sys/ virtual
    filesystems. Several tools summarize those details. Among them lspci (in the pciutils
    package) lists PCI devices, lsusb (in the ususb package) lists USB devices, and
    lspcmia (in the pcmciutils package) lists PCMCIA cards. These tools are useful
    for identifying the exact model of a device. This also allows more precise searches
    on the web, which can lead to more relevant documents. Note that the pciutils
    and ususb packages are already installed on the base Kali system but pcmciutils
    must be installed with apt install pcmciutils. We will discuss more about package
    installation in a later chapter.


    > Example 3.1 Example of information provided by lspci and lsusb


    ```

    $ lspci

    ...

    00:02 Display controller: Intel Corporation Mobile 915GM/GMS/910GL Express Graphics
    Controller (rev 03)

    00:1c PCI bridge: Intel Corporation 82801FB/FBM/FR/FW (ICH6 Family) PCI Express
    Part 1 (rev 03)

    00:1d USB Controller: Intel Corporation 82801FB/FBM/FR/FW (ICH6 Family) USB HCI
    #1 (rev 03)

    n01:00 Ethernet controller: Broadcom Corporation Nettreme BCM5751 Gigabit Ethernet
    PCI Controller (rev 01)

    02:03$ lsusb

    Bus 005 Device 004: ID 413c:a005 Dell Corp.

    Bus 005 Device 08: ID 413c:a901 Dell Corp.

    Bus 005 Device 007: ID 045e:00ddd Microsoft Corp.

    Bus 005 Device 006: ID 046d:c0d3 Logitech, Inc.

    ...

    Bus 002 Device 004: ID 413c:0103 Dell Corp. Wireless 3500 Bluetooth

    ```


    These programs have a -v option that lists much more detailed (but usually unnecessary)
    information. Finally, the lsdev command (in the procinfo package) lists communication
    resources used by devices.


    The lshw program is a combination of the above programs and displays a long description
    of the hardware discovered in a hierarchical manner. You should attach its full
    output to any report about hardware support problems.'
  merge: -1
