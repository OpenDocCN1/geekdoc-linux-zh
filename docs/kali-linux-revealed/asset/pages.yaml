  md: 'image you that should not blindly trust the mirror. The mirror you directed
    to have been compromised, or you might be the victim of an attack.


    To alleviate this, the Kali project always provides checksums of the images it
    distributes. But to make such a check effective, you must be sure that the checksum
    grabbed is effectively the checksum published by the Kali Linux developers. You
    have different ways to ascertain this.


    # Relying on the TLS-Protected Website


    When you retrieve the checksum from the TLS-protected download webpage, its origin
    is indirectly guaranteed by the X.509 certificate security model: the content
    you see from a web site is effectively under the control of the person who requested
    the TLS certificate.


    Now you should generate the checksum of your downloaded image and ensure that
    it matches what you recorded from the Kali website:


    ```

    $ sha256 kali-linux-2017.1-amd64.iso kali-linux-2016.2-amd64.iso

    49b1c5769b9022e06dc4c0e11ae09d7a27a80d2590e573101df62e11e9d

    ```


    If your checksum matches one on the Kali Linux download, you have the correct
    file. If the checksums differ, there is a problem, although this does not indicate
    a compromise or an attack downloads occasionally get corrupted as you traverse
    the Internet. Try downloading again, from another official Kali mirror, if possible
    (see "cdimage.kali.org" [page 14] for more information about available mirrors).


    # Relying on PGP''s Web of Trust


    If you don''t trust HTTPS for authentication, you are a bit paranoid but rightfully
    so. There are many examples of badly managed certificate authorities that issued
    rogue certificates, ended up being misused. You may also be the victim of a "friendly"
    man-in-the-middle-attack implemented on many corporate networks, using a custom,
    browser-installed trust store that presents fake certificates to encrypted websites,
    allowing corporate auditors to monitor encrypted traffic.


    For cases like this, we provide a GPG key to use to sign the checksums of the
    images we provide. The key identifiers and fingerprints here:


    ```

    pub rsa4096/0XED44FF70D00BF6 2012-03-05 [SC] [expires: 2018-02-02]

    Key fingerprint = 44C6 531A 8E4F B3D3 0875 F758 ED44 4FF0 7D8D 0BF6 Kali Linux
    Repository <devel@kali.org>

    sub rsa4096/0XA837E18FC0D0DBC 2012-03-05 [E] [expires: 2018-02-02]

    ```


    This key is part of a global web of trust because it has been signed by (Raël
    Herzog) and I am part of the web of trust due to my heavy GPG usage as a Debian
    developer.'
