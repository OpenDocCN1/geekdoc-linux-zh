  md: '# Installing the GRUB Boot Loader


    The boot loader is the first program started by the BIOS. This program loads the
    Linux kernel into memory and executes it. The boot loader often offers a menu
    that allows you to choose the kernel to load the operating system to boot.


    Due to its technical superiority, GRUB is the default boot loader installed by
    Debian: it works with many file systems and therefore doesn''t require an update
    after each installation of a new kernel, since it reads its configuration during
    boot and finds the exact position of the new kernel.


    You should install GRUB to the Master Boot Record (MBR) unless you already have
    another Linux system installed that knows how to boot Linux. As noted in Figure
    4.17, “Install the GRUB Boot Loader on a Hard Disk” [page 83], modifying the MBR
    will make unrecognized operating systems that depend on it unbootable until you
    fix GRUB''s configuration.


    ![](img/f888cd88b4fb3dd45062e14ce223cc4f_108_0.png)


    Install the GRUB boot loader on a hard disk


    It seems that this new installation is the only operating system on this computer.
    If so, it should be safe to install the GRUB boot loader to the master boot record
    of your first hard drive.


    Warning: If the installer failed to detect another operating system that is present
    on your computer, modifying the master boot record will make that operating system
    temporarily unbootable, though GRUB can be manually configured later to boot it.


