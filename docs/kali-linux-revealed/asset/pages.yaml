  md: '# VOCABULARY


    Cache is a temporary storage system used to speed up frequent data access when
    the usual access method is expensive (performance-wise). This concept can be applied
    in numerous situations and at different scales, from the core of microprocessors
    up to high-end storage systems.


    # Cache


    In the case of APT, the reference Packages files are located on Debian mirrors.
    That said, it would be very ineffective to push every search through the online
    package databases. That is why APT stores copies of files (in /var/lib/apt/lists/)
    contains a cached copy of already downloaded packages to avoid downloading them
    if you need to reinstall them.


    To avoid disk usage when you upgrade frequently, you should regularly sort through
    the /var/cache/apt/archives/ directory. Two commands can be used for this: apt
    autoclean (or apt-get autoclean) entirely removes the directory; apt autoclean
    (apt-get autoclean) only removes packages that can no longer be downloaded because
    they have disappeared from the mirror and Note that the configuration parameter
    APT:Clean-Installed can be used to prevent the removal of .deb files that are
    currently installed. Also, note that apt drops the downloaded files once they
    have been installed, so this matters when you use other tools.


    The apt-cache command can do keyword-based package searches with apt-cache search
    key. It can also display the headers of the package''s available versions with
    apt-cache search package. This command provides the package''s description, its
    dependencies, and the name of its maintainer. This feature is particularly useful
    in determining the packages that are installed via meta-packages, such as kali-linux-wireless,
    kali-linux-web, and kali-linux-gpu. Note that apt search, apt soft search, aptitude
    search, and aptitude work in the same way.


    # Alternative: axic-cache


    apt-cache search is a very rudimentary tool, basically implementing grep on package
    descriptions. It often returns many results or not at all, when many keywords
    are included.

    axic-cache search term, on the other hand, provides better results, sorted by
    relevancy. It uses the Xian search engine and is part of the apt-xian-index package,
    which indexes all package information (and more, like the .desktop files from
    all Debian packages). It knows about tags and returns in time of milliseconds.


    > ### axi-cache search forensics graphical


