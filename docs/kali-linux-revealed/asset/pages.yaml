  md: 'Through the addition of suffixes to package names, you can use apt (or apt-get
    and aptitude) to install certain packages and remove others on the same command
    line. With an apt inst all command, add "-" to the names of the packages you wish
    to remove. With an apt remove command, add "+" to the names of the packages you
    wish to install.


    The next example shows two different ways to install package1 and to remove package2.


    ```

    # apt install package12-

    ...

    # apt remove package1+

    ...

    ```


    This also can be used to exclude packages that would otherwise be installed, for
    example due to a Recommends (discussed later). In general, the dependency solver
    will use that information as a hint to look for alternative solutions.


    To remove all data associated with a package, you can purge the package with the
    dpkg -P or apt purge package commands. This will completely remove the package
    and all user data, and in the case of apt, will delete dependencies.


    ```

    # dpkg -f debian-cd

    (Reading database ... 97747 files and directories currently installed.)

    Removing debian-cd (3.1.17) ...

    # dpkg -P debian-cd

    (Reading database ... 97481 files and directories currently installed.)

    Removing debian-cd (3.1.17) ...

    Purging configuration files for debian-cd (3.1.17) ...

    ```


    > Warning! Given the definitive nature of purge, do not execute it lightly. You
    will lose everything associated with that package.


