    #  9.2.3. Configuring the Kernel


    The next step consists of configuring the kernel according to your needs. The
    exact procedure depends on the goals.


    The kernel build depends on a kernel configuration file. In most cases, you will
    most likely keep as close as possible to that proposed by Kali, which like all
    Linux distributions, is installed in the /boot directory. Rather than reconfiguring
    from scratch, it is sufficient to make a copy of the /boot/config-version file
    (The version name be the same as version of the kernel currently used, which can
    be found with the uname -r command). Place the .config in the directory containing
    the kernel sources.


    ```

    $ cp /boot/config-4.9.0-kali1-amd64 ~/kernel/linux-source-4.9/.config

    ```


    Alternatively, since the kernel provides default configurations in arch/configs/*-defconfig,
    you can select your configuration in a command like x86_64_defconfig (in the case
    of a 64-bit PC) or i386_defconfig (in the case of a 32-bit PC).


    Unless you need to change the configuration, you can stop here and skip to 9.2.4,
    "Compiling and Building the Package" [page 235]. If you need to make changes or
    if you decide to reconfigure from scratch, you must take time to configure your
    kernel. There are various dedicated interfaces in the kernel source directory
    that can be used by calling the make target command, where target is one of the
    values described below.


    makeconfig compiles launches a text-mode kernel configuration interface (this
    is where the libncurses-dev package is required), which allows navigating the
    many available kernel options in a hierarchical structure. Pressing Space key
    changes the value of the selected option, and Enter validates the button selected
    at the bottom of the screen; Select to the selected sub-menu; Exit the current
    screen and moves back in the hierarchy; Help will display detailed information
    on the selected option. The arrow keys allow moving within the list of options
    and buttons. To exit the configuration program, choose Exit from the main menu.
    The program then offers to save the changes that you have made; accept if you
    are satisfied with your choices.


    Other interfaces have similar features but they work within more modern graphical
    interfaces, such as makeconfig, which uses a Qt graphical interface, and make
    gconfig, which uses GTK+. make libqt4-dev, which the latter depends on libgrade2-dev
    and libgtk2-0-dev.'
