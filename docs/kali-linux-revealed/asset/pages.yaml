- img_proc: true
  md: "+   • Orchestration of a sequence of operations across multiple minions\n\n\
    +   • Applying states over SSH without installing the salt-minion service\n\n\
    +   • Provisioning systems on cloud infrastructures and bringing them under management\n\
    \n+   • And more\n\nSaltStack is quite vast and we can't possibly cover all the\
    \ features here. In fact, there are books dedicated entirely to SaltStack and\
    \ the online documentation is very extensive as well. Check out if you want to\
    \ learn more about its features:\n\n⇒ https://docs.saltstack.com/en/latest/\n\n\
    If you manage a significant number of machines, you will be well advised to learn\
    \ more about SaltStack as you can save a significant amount of time when deploying\
    \ new machines and you will be able to maintain a coherent configuration throughout\
    \ your network.\n\nTo give you a taste of what it looks like to work with state\
    \ files, we will cover a simple example: how to enable the APT repository and\
    \ install a package that you create in section 10.3.3,\"Creating a Package Repository\
    \ for APT\" [page 269] and section 10.3.2,\"Creating Configuration Packages\"\
    \ [page 263]. You will also need a SSH key in root's account so that you can login\
    \ remotely in case of problems.\n\nBy default, state files are stored in /srv/salt\
    \ on the master; they are YAML structured files with a sla extension. Just for\
    \ running commands, applying a state relies on many state modules:\n\n⇒ https://docs.saltstack.com/latest/topics/tutorials/starting_states.html\n\
    \n⇒ https://docs.saltstack.com/en/latest/ref/states/all/\n\nYour /srv/salt/offsec.sls\
    \ will call three of following modules:\n\n```\noffsec_repository:\npkgrepo.managed:\n\
    \  name: deb http://pkgrepo.offsec.com offsec-internal main\n  file: /etc/apt/sources.list.d/offsec.list\n\
    \  key_url: salt://offsec-apt-key.asc\n  require_in:\n    pkg: offsec-defaults\n\
    ```\n\n```\noffsec-defaults:\npkg.installed\n```\n\n```\nssh_key_for_root:\nssh_auth.present:\n\
    \  user: root\n  name: offsec-rsa AAAAB3NzaCyc2...89C4N rertzog@kali\n```\n\n\
    The offsec_repository state relies on the pkgrepo state module. The example uses\
    \ the managed function in that state module to register a package repository.\
    \ With the key_url attribute, you"
