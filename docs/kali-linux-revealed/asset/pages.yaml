    # 9.2.2. Getting the Sources


    Since the Linux kernel sources are available as a package, you can retrieve them
    by installing the linux-source-version package. The apt-cache search ^linux-source
    command should list the latest kernel version packaged by Kali. Note that the
    source code contained in these packages does not correspond precisely with that
    published by Linux Torvalds and the kernel developers; like all distributions,
    Debian and Kali apply a number of patches, which might (or might not) find their
    way into the upstream sources. These modifications include backports of fixes/features
    from newer kernel versions, new features not yet (entirely) merged in the upstream
    Linux tree, and sometimes even Debian or Kali specific changes.


