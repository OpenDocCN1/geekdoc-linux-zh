    times and can only be closed when all issues have been fixed, or the developers
    must file the supplementary reports that you created in the first place.


    # 6.3.2. Where to File a Bug Report


    To be able to decide where to file the bug report, you must have a good understanding
    of the problem and you must have identified in which piece of software the lines.


    Ideally, you track the problem to a file on your system and then you use dpkg
    to find out which package owns that file and where that package comes from. Let''s
    assume that you found a bug in a graphical application. After looking at the list
    of running processes (the output of aux), you discovered that the application
    was started with the executable:


    ```

    $ dpkg -S /usr/bin/sparta

    $ dpkg -s sparta | grep Version:

    Version: 1.0.1+git20150729-0kali

    ```


    You learn that /usr/bin/sparta is provided by the sparta package, which is in
    version 1.0.1+git20150729-0kali. The fact that the version string contains kali
    indicates to you that the package'
