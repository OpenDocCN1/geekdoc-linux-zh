- img_proc: true
  md: "![](img/f888cd88b4fb3dd45062e14ce223cc4f_180_0.png)\n\nFigure **7.1** How Netfilter\
    \ Chains are Called\n\nEach chain is a list of rules; each rule is a set of conditions\
    \ and an action to perform when the conditions are met. When processing a packet,\
    \ the firewall scans the appropriate chain, one rule after another, and when the\
    \ conditions for one rule are met, it jumps (hence the -j option in the commands)\
    \ to the specified action to continue processing. The most common behaviors are\
    \ standardized and dedicated actions exist for them. Common one of these standards\
    \ interrupts the processing of the chain, since the packet fates is already sealed\
    \ (barring an exception mentioned below). Listed below are the *Netfilter* actions.\n\
    \n+   - ACCEPT: allow the packet to go on its way.\n- REJECT: reject the packet\
    \ with an Internet control message protocol (ICMP) error packet (the --reject-with\
    \ type option of `iptables determines the type of error to send).\n- DROP: delete\
    \ (ignore) the packet.\n- LOG: log (via syslog) a message with a description of\
    \ the packet. Note that this action does not interrupt processing, and the execution\
    \ of the chain continues to the next rule, which is why refused packets requires\
    \ both a LOG and a REJECT/DROP command. Common parameters associated with logging\
    \ include:\n  - --log-level, with default value warning, indicates the syslog\
    \ level.\n  - --log-prefix allows specifying a text prefix to differentiate between\
    \ logged messages.\n- --log-tcp-sequence, --log-tcp-options, and --log-ip-options\
    \ include extra data to be integrated into the message: respectively, the TCP\
    \ sequence number, TCP options, and IP options.\n- ULOG: log a message via ulog,\
    \ which can be better adapted and more efficient than syslog for handling large\
    \ numbers of messages; note that this action, like LOG, also returns processing\
    \ to the next rule in the calling chain.\n- *chain_name*: jump to the given chain\
    \ and evaluate its rules."
