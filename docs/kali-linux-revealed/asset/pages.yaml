  md: 'do its job, dpkg relies on checksums in its own database which is stored on
    the hard disk (found in /var/lib/dpkg/info/package.md5sums). A thorough attacker
    will modify these files so they contain the new checksums for the subverted files,
    or an advanced attacker will compromise the package on your Debian mirror. To
    protect against this class of attack, use APT''s digital signature verification
    system (see section 8.3.6, "Validating Package Authenticity" [page 202]) to verify
