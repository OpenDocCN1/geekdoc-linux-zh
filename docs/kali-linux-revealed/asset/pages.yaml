    Git history) to see that there hasn''t been any change that could fix the problem
    that you are seeing (and then the will find the bug you did not try the latest
    version).


    Do Not Mix Issues in a Single Bug Report File one bug report per issue. That way,
    the discussions do not get too messy and each bug can be fixed according to its
