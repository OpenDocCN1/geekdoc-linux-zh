- img_proc: true
  md: '# Likelihood of Occurrence


    According to the National Institute of Standards and Technology (NIST), the likelihood
    of occurrence is based on the probability that a particular threat is capable
    of exploiting a particular vulnerability, with possible ratings of Low, Medium,
    or High.


    +   - High: the potential adversary is highly skilled and motivated and the measures
    that have been put in place to protect against the vulnerability are insufficient.

    - Medium: the potential adversary is motivated and skilled but the measures put
    in place may impede their success.

    - Low: the potential adversary is unskilled or lacks motivation and there are
    measures in place to protect against the vulnerability that are partially or completely
    effective.


    # Impact


    The level of impact is determined by evaluating the amount of harm that could
    occur if the vulnerability in question were exploited or otherwise taken advantage
    of.


    +   - High: taking advantage of the vulnerability could result in very significant
    financial losses, serious harm to the mission or reputation of the organization,
    or even serious injury, closing of loss.

    - Medium: taking advantage of the vulnerability could lead to financial losses,
    harm to the mission or reputation of the organization, or human injury.

    - Low: taking advantage of the vulnerability could result in some degree of financial
    loss or impact to the mission and reputation of the organization.


    # Overall Risk


    Once the likelihood of occurrence and impact have been determined, you can then
    determine the overall risk rating, which is defined as a function of the two ratings.
    The overall risk can be rated Low, Medium, or High, which provides guidance to
    those responsible for securing and maintaining the systems in question.


    +   - High: There is a strong requirement for additional measures to be implemented
    to protect against the vulnerability. In some cases, the system may be allowed
    to continue operating but a plan must be designed and implemented as soon as possible.

    - Medium: There is a requirement for additional measures to be implemented to
    protect against the vulnerability. A plan to implement the required measures must
    be done in a timely manner.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '+   • Low: The owner of the system will determine whether to implement additional
    measures to protect against the vulnerability or they can opt to accept the risk
    instead and leave the system unchanged


    # In Summary


    With many factors making up the true risk of a discovered vulnerability, the pre-defined
    risk ratings from tool output should only be used as a starting point to determine
    the true risk to the overall organization.


    Competently-created reports from a vulnerability assessment, when analyzed by
    a professional, can provide an initial foundation for other assessments, such
    as compliance penetration tests. As such, it is important to understand how to
    get the best results possible from this initial assessment.


    Kali makes an excellent platform for conducting a vulnerability assessment and
    does not need any special configuration. In the Kali Applications, you will find
    numerous tools for vulnerability assessments in the Information Gathering, Vulnerability
    Analysis and Web Application Analysis categories. Several sites, including the
    aforementioned Kali Linux Listings13, the Kali Linux Official Documentation14
    site, and the free Metasploit Unleashed15 provide excellent resources for using
    Kali Linux during a vulnerability assessment.


    # 11.2.2. Compliance Penetration Test


    The next type of assessment in order of complexity is a government- and industry-mandated
    required penetration test. These are the most common penetration tests based on
    a compliance framework the entire organization operates under.


    While there are many industry-specific compliance frameworks, the most common
    would likely be Payment Card Industry Data Standard16 (PCI DSS), a framework dictated
    by payment card companies that retailers card-based payments must comply with.
    However, a number of other standards such as the Defense Information Systems Agency
    Security Technical Implementation17 (DISA STIG), Federal Risk and Authorization
    Management Program18 (FedRAM), Federal Information Security Management Act19 (FISMA),
    and others. In some cases, a corporate client may request an assessment, or to
    ask to see the results of the most recent assessment for various reasons. Whether
    ad-hoc or managed, these sorts of assessments are collectively


