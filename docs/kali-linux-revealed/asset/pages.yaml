    # What Is a File Fingerprint?


    As a reminder: a fingerprint is a value, often a number (although in hexadecimal
    notation), that contains a signature for the contents of a file. This signature
    is calculated with an algorithm (MD5 or SHA1 being well-known) that more or less
    guarantees that the tiniest change in the file contents will result in a change
    of the fingerprint; this is known as the "avalanche effect". A numerical fingerprint
    serves as a litmus test to check the contents of a file has been altered. These
    algorithms are not reversible; in other words, for most of them, knowing a fingerprint
    doesn''t allow finding the corresponding contents. Recent mathematical advances
    seem to weaken the robustness of these principles but it is not into question
    so, since creating different contents yielding the fingerprint seems to be a difficult
    task.


    dpkg -V will verify all packages and print a line for each file that fails verification.
    Each character denotes one on specific meta-data. Unfortunately, dpkg does not
    store the meta-data for most tests and will thus output the checksum test yield
    a 5 on the third character (when it fails).


    ```

    dpkg -V

    ??????? /lib/systemd/system/ssh.service

    ??????? /c /etc/libvirt/qemu/networks/default.conf

    ??????? /c /etc/lvm/lvm.xml

    ??????? /c /etc/salt/roster

    ```


    In the example above, dpkg reports a change to SSH''s service file that the administrator
    made to the packaged file instead of using an appropriate /etc/systemd/system/ssh.service
    override (which would be stored below /etc/ any configuration change should be).
    It also lists multiple configuration files (identified by the "c" letter on the
    second field) that have been legitimately modified.


    # Monitoring Files: AIDE


    The Advanced Intrusion Detection Environment (AIDE) tool checks file integrity
    and detects any change against a previously-recorded image of the valid system.
    The image is stored as a database (/var/lib/aide/aide.db) containing the relevant
    information on all of the system (fingerprints, permissions, timestamps, and so
    on).


    You can install AIDE by running apt update followed by apt install aide. You will
    first initialize the database with aideinit; it will then run daily (via the /etc/cron.daily/aide
    script) to'
