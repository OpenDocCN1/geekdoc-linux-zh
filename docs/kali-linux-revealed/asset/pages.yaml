  md: 'In this chapter, we will focus on the Kali Linux installation process. First,
    we will discuss the minimum installation requirements (section 4.1, "Minimal Installation
    Requirements" [page 66]) to ensure that your real or virtual system is well-configured
    to handle the type of installation that you will pursue. We will then go through
    each step of the installation process (section 4.2, "Step by Installation on a
    Hard Drive" [page 66]) for a plain installation, as well as for a more secure
    installation involving a fully encrypted file system. We will also discuss preeding,
    which allows unattended installations (section 4.3, "Unattended Installations"
    [page 91]) by providing predetermined answers to installation questions. We will
    also show how to install Kali Linux on various devices (section 4.4, "ARM Installations"
    [page 94]), which expands Kali''s capabilities far beyond the desktop. Finally,
    we will show you what to do in the rare case of an installation failure (section
    4.5, "Troubleshooting Installations" [page 95]), so you can work through the issue
    and successfully finish a tough install.


    # 4.1. Minimal Installation Requirements


    The installation requirements for Kali Linux vary depending on what you would
    like to install. On the low end, you can set up Kali as a Basic Shell (SSH) server
    without desktop, using as little as 128 MB of RAM (512 MB recommended) and 2 GB
    of disk space. On the higher end, if you install the full GNOME desktop and the
    kali-linux-full meta-package, you should really aim for at least 2048 MB of RAM
    and 20 GB of disk space.


    Besides the RAM and hard disk requirements, your computer needs to have a CPU
    supported by at least one of the amd64, i386, armel, armhf, or arm64 architectures.


    # 4.2. Step by Step Installation on a Hard Drive


    In this section, we assume that you have a bootable USB drive or DVD (see section
    2.1.4, "Copying the Image on a DVD-ROM or USB Key" [page 19]) for details on how
    to prepare a drive) and that you booted from it to start the installation process.


    # 4.2.1. Plain Installation


    First, we will take a look at a standard Kali installation, with an unencrypted
    file system.


    # Booting and Starting the Installer


    Once the BIOS has begun booting from the USB drive or DVD-ROM, the Isolux boot
    loader appears, as shown in Figure 4.1, "Boot Screen" [page 67]. At this stage,
    the Linux kernel is not yet loaded; this menu allows you to choose the kernel
    to boot and enter optional parameters to be transferred to in the process.'
  merge: -1
