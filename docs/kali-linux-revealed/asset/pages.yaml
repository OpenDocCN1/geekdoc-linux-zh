- img_proc: true
  md: 'In addition to man, you can use konqueror (KDE) and yelp (GNOME) to search
    man pages as well.


    # 6.1.2. Info Documents


    The GNU project has written manuals for most of its programs in the info format;
    this is why many manual pages refer to the corresponding info documentation. This
    format offers some advantages but the default program to view these documents
    (also called info) is slightly more complex. You would be well advised to use
    apt pinfo (from the pinfo package). To install it, simply run apt update followed
    by apt install pinfo (see section 8.2.2.2, "Installing Packages with APT" [page
    177]).


    The info documentation has a hierarchical structure and if you invoke pinfo without
    parameters, it will display the list of nodes at the first level. Usually, nodes
    bear the name of the corresponding commands.


    You can use the arrow keys to navigate between nodes. Alternatively, you could
    also use a graphical browser (which is a lot more user-friendly) such as konqueror
    or yelp.


    As far as translations are concerned, the info system is always in English and
    is not suitable for translation, unlike the man page system. However, when you
    ask the pinfo program to display a non-existing info page, it will fall back on
    the man page by the same name (if it exists), which might be translated.


    # 6.1.3. Package-Specific Documentation


    Each package includes its own documentation and even the least documented programs
    generally have a README containing some interesting and/ important information.
    This documentation is installed in the /usr/share/doc/package/ directory (where
    package represents the name of the package). If the documentation is particularly
    large, it may not be included in the program''s main package, but might be offloaded
    to a dedicated package which is usually named package-doc. The main page generally
    recommends the documentation package so that you can easily find it.


    The /usr/share/doc/package/ directory also contains some files provided by Debian,
    which complete the documentation by specifying the package''s particularities
    or improvements compared to a traditional installation of the software. The README.Debian
    file indicates all of the adaptations that were made to comply with the Debian
    Policy. The changelog.Debian. file allows the user to follow the modifications
    made to the package over time; it is very useful to try to understand what has
    changed between two installed versions that do not have the same behavior. Finally,
    there is sometimes a NEWS.Debian.gz file that documents the major changes in the
    program that may directly concern the administrator.'
