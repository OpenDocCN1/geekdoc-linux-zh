  md: 'check that nothing relevant changed. When changes are detected, AIDE records
    them in log files (/var/log/aide/*..log) and sends its findings to the administrator
    by email.


    # Protecting the Database


    Since AIDE uses a local database to compare the states of the files, the validity
    of its results is directly linked to the validity of the database. If an attacker
    gets root on a compromised system, they will be able to replace the database and
    cover their tracks. One way to prevent this subversion is to store the reference
    data on read-only storage media.


    You can use options in /etc/default/aide to tweak the behavior of the aide package.
    The AIDE configuration program is stored in /etc/aide/aide.conf and /etc/aide/aide.conf.d/
    (actually, these files are only used by update-aide to generate /var/lib/aide/aide.conf,
    autogenerated). The configuration identifies properties of which files need to
    be changed. For instance, the content of log files changes routinely, and changes
    can be ignored as long as the permissions of these files stay the same, but both
    contents and permissions of executable programs must be constant. Although not
    very complex, the configuration syntax is not fully intuitive and we recommend
    reading the aide.conf (5) manual for more details.


    A new version of the database is generated daily in /var/lib/aide/aide.db.new,
    if recorded changes were legitimate, it can be used to replace the reference database.


    Tripwire is very similar to AIDE; even the configuration syntax is almost the
    same. The main addition provided by tripwire is a mechanism to sign the configuration
    file so that an attacker cannot point it at a different version of the reference
    database.


    Samhain offers similar features as well some functions to help detect rootkits
    (the sidebar “The checksecurity and chkrootkit/rkhunter packages” [page 164]).
    It can also be deployed globally on a network and record its traces on a central
    server (with a signature).


    # The checksecurity and chkrootkit/rkhunter packages


    checksecurity consists of several small scripts that perform basic checks on the
    system (searching for empty processes, new set files, and when you find conditions
    are detected. Despite its explicit name, you should not rely solely on it to make
    a Linux system secure.


    The chkrootkit and rkhunter packages detect certain rootkits installed on the
    system. As a reminder, these are pieces of software designed to hide the compromise
    of a system while keeping control of the machine. The tests are not 100 percent
    reliable but they can usually draw your attention to potential problems.


    # 7.6. Summary


    In this chapter, we took a look at the concept of security policies, highlighting
    various points to consider when defining such a policy and outlining some of the
    threats to your system and to you as a security professional. We discussed laptop
    and desktop security measures as well'
