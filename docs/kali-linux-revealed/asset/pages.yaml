    use in and of itself. You must burn it on a DVD-ROM or copy it onto a USB key
    to be able to boot your machine into Kali Linux.


    We won''t cover how to burn the ISO image onto a DVD-ROM, as the process varies
    widely by platform and environment, but in most cases, right clicking on the .iso
    file will present a contextual menu item that executes a DVD-ROM burning application.
    Try it out!


    > > Warning

    > In this section, you will learn how to overwrite an arbitrary disk with a Kali
    Linux ISO image. Always double-check the target disk before launching the operation
    as a single mistake would likely cause complete data loss and possibly damage
    your setup beyond repair.


    # Creating a Bootable Kali USB Drive on Windows


    As a prerequisite, you should download and install Win32 Disk Imager:


    +   - https://sourceforge.net/projects/win32diskimager/


    Plug your USB key into your Windows PC and note the drive designator associated
    to it (for example, "E:").


    Launch Win32 Disk Imager and choose the Kali Linux ISO file that you want to copy
    on the USB key. Verify that the letter of the device selected corresponds with
    that assigned to the USB key. Once you are certain that you have selected the
    correct drive, click the Write and confirm that you want to overwrite the contents
    of the USB key as shown in Figure 2.2, "Win32 Disk Imager in action” [page 20].'
