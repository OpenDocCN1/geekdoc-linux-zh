    # 10.4. Summary


    Kali Linux scales beyond the desktop to medium or large scale deployments and
    even to the enterprise level. In this chapter, we covered how to utilize management
    of multiple Kali installations with SaltStack, allowing you to quickly deploy
    highly secure Kali systems preconfigured for your specific needs. We also revealed
    how to keep them synchronized thanks to Kali''s (semi-automatic) installation
    of package updates.


    We discussed for, which allows you to create your own customized distributable
    source packages.


    In summary, let''s review the major steps required to establish Salt masters and
    minions, which allow remote control and configuration of remote hosts.


    Summary Tips:


    +   - Boot machine from the network with PXE, with at least a TFTP file server,
    a DHCP/BOOT server (and a web server for debconf preeasing). dnsmasq handles both
    DHCP and TFTP, and the apache web server comes pre-installed (but disabled) on
    Kali.

