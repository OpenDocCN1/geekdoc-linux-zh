  md: 'The command apt-cache search ^linux-source should list the latest kernel version
    packaged by Kali, and apt install linux-source-version-number installs a compressed
    archive of the kernel source into /usr/src.


    The source files should be extracted with tar -xaf into a directory other than
    /usr/src (such as ~/kernel).


    When the time comes to configure your kernel, keep these points in mind:


    +   * Unless you are an advanced user, you should first populate a kernel configuration
    file. The preferred method is to borrow Kali''s standard configuration by copying
    /boot/config-string to ~/kernel/Linux-source-version-number/.config. Alternatively,
    you can make architecture_defconfig to get a reasonable configuration for the
    given architecture.


    +   * The text-based makeconfig configuration tool will read the .config file
    and present you all the configuration items in a huge menu that you can navigate.
    Selecting an item shows you its documentation, its possible values, and permits
    you to enter a new value.


    When run from your kernel source directory, make clean will remove previously-compiled
    files and make deb-pkg will generate you Debian packages. The linux-image-version
    .deb contains the kernel image and the associated modules.


    To actually use the built kernel, install the required packages with dpkg -i file.deb.
    The "linux-image" package is required; you only the "linux-headers" package if
    you have some external kernel modules to build, which is the case if you have
    "*-dkms" packages installed (check with dpkg -l "*-dkms" | grep i). The other
    packages are generally not needed (unless you know why you need them!).


    # 9.5.3. Summary Tips for Building Kali Live ISO Images


    Official Kali Images are built with live-build, which is a set of scripts that
    allows for the complete automation and customization of all facets of ISO image
    creation.


    Your live-build configuration can be retrieved from Kali''s Git repositories with
    two commands: apt install curl live-build by clone git://kali.org/live-build-config.git


    To generate an updated but unmodified Kali ISO image, simply run ./build.sh --verbose.
    The build will take a long time to complete as it will download all the packages
    to include. When finished, you will find the new ISO image in the images directory.
    If you use --variant to the command line, it will build the given variant of the
    Kali ISO image. The various variants


    > http://kali-live.alioth.debian.org/live-build/'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'are defined by their configuration directories kali-config-variant-*. The main
    image is the gnome variant.


    There are several ways to customize your ISO by modifying live-build''s configuration
    directory:


    +   - Packages can be added to (or removed from) a live ISO by modifying package-lists/*.
    chroot files.

    - Custom packages can be included in the live image by placing the .deb files
    in a packages. chroot directory. Their installation can be preseeded with preseed/*.cfg
    files.

    - You can add files to the live filesystem by putting them at their expected location
    below the includes.chroot config directory.

    - You can execute scripts during the live system''s chroot setup process by installing
    them as hooks/Live/*.chroot files. You can also execute scripts at boot time of
    the generated live image: you must arrange for them to be installed in /usr/lib/live/config/XXXX-name,
    for example by relying on the includes.chroot config directory.

    - The Debian Live Systems Manual¹ is an excellent reference for live-build configuration
    and testing.


    Setting up encrypted and unencrypted persistence on a USB key: it''s fairly simple
    to create a standard Kali USB installation. Although the process may seem syntactically
    complex, it is relatively straightforward-forward to add both encrypted and unencrypted
    persistence to your portable installation to significantly extend its functionality.


    In the next chapter, we will discuss how Kali scales to the enterprise. We will
    discuss configuration management and show you how to extend and customize Kali
    Linux in a way that is easy to deploy whether you have a pair of machines, or
    several thousand.'
