  md: '# 1.4.4. Completely Customizable


    Kali Linux is built by penetration testers for penetration testers but we understand
    that not everyone agree with our design decisions or choice of tools to include
    by default. With this in mind, we always ensure that Kali Linux is easy to customize
    based on your needs and preferences. To end this, we publish the live-build configuration
    used by the official Kali images so you can customize it to your liking. It is
    very easy to start from this published configuration and implement various changes
    based on your needs thanks the versatility of live-build.


    Live-build includes many features to modify the installed system, install supplementary
    files, install additional packages, run arbitrary commands, and change the values
    pre-seeded to debconf.


    # 1.4.5. A Trustable Operating System


    Users of a security distribution rightfully want to know that it can be trusted
    and that it has been developed in plain sight, allowing anyone to inspect the
    source code. Kali Linux is developed by a small team of knowledgeable developers
    working transparently and following the best security practices: they upload source
    packages, which are built on dedicated build daemons. The packages are checksummed
    and distributed as part of a signed repository.


    The work done on the packages can be fully reviewed through the packaging Git
    repositories¹⁴ (which contain signed tags) that are used to build the Kali source
    packages. The evolution of each package can also be followed through the Kali
    package tracker¹⁵.


    # 1.4.6. Usable on a Wide Range of ARM Devices


    Kali Linux provides binary packages for the armel, armhf, and arm64 ARM architectures.
    Thanks to the easily installable images provided by Offensive Security, Kali Linux
    can be deployed on many interesting devices, from smartphones and tablets to Wi-Fi
    routers and computers of various sizes and shapes.


    # 1.5. Kali Linux Policies


    Kali Linux strives to follow the Debian policy whenever possible, there are some
    areas where we made significantly different design choices due to the particular
    needs of security profession.


