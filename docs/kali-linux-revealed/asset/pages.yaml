  md: '# 8.2.3. Upgrading Kali Linux


    As a rolling distribution, Kali Linux has spectacular upgrade capabilities. In
    this section, we will take a look at how simple it is to upgrade Kali, and we
    will discuss strategies for planning your updates.


    We recommend regular upgrades, because they will install the latest security updates.
    To upgrade, use apt update followed by apt upgrade, apt-get upgrade, or aptitude-upgrade.
    These commands look for installed packages that can be upgraded without removing
    any packages. In other words, the goal is to ensure the least intrusive upgrade
    possible. The apt-get command line tool is slightly more demanding than apt or
    aptitude because it will refuse to install packages that were not installed beforehand.


    The apt tool will generally select the most recent version number (except for
    packages from kali-bleeding-edge, which are ignored by default whatever their
    number).


    To tell apt to use a specific distribution when searching for upgraded packages,
    you need to use the -t --target-release option, by the name of the distribution
    you want (for example: apt -t kali-rolling upgrade). To avoid this option every
    time you use apt, you can add APT:Default-Release "kali-rolling"; in the file
    /etc/apt/apt.conf.d/.


    For important upgrades, such as major version upgrades, use apt full-upgrade.
    With this instruction, apt will complete the upgrade even if it removes obsolete
    packages or install new dependencies. This is also the command that should use
    for regular upgrades of your Kali Rolling system. It is so simple that it hardly
    needs explanation: APT''s reputation is based on its great functionality.


    Unlike apt and aptitude, apt-get doesn''t know the full-upgrade command. Instead,
    you should use apt-get dist-upgrade (distribution upgrade), a well-known command
    that apt and aptitude also accept for backwards compatibility.


    > Be Aware of Important Changes: To anticipate some of these problems, you can
    install the apt-listchanges package which displays information about possible
    problems at the beginning of a package upgrade. This information is compiled by
    the package maintainers and put in /usr/share/doc/package/NEWS.Debian files for
    your benefit. Reading these files (possibly through apt-listchanges) should help
    you avoid nasty surprises.


    Since becoming a rolling distribution, Kali can receive several times a day. However,
    that might not be the best strategy. So, how often should you upgrade Kali Linux?
    There is no hard rule but there are some guidelines that can help you upgrade:


    +   * When you are aware of a security issue that is fixed in update

    * When you suspect that an updated version might fix a bug that you are experiencing

    * Before reporting a bug to make sure it is still present in the latest version
    that you have'
  merge: -1
  pgno: 204
- img_proc: true
  md: '• Often enough to get the security fixes that you have not heard about


    There are also cases where it is best not to upgrade. For example, it might not
    be a good idea to upgrade:


    +   - If you cannot afford any breakage (for example, because you go offline,
    or because you are about to give a presentation with your computer); it is best
    to use the latest version, when you have enough time to troubleshoot any issue
    introduced in the process.

    - If a disruptive change happened recently (or it is still ongoing) and you fear
    that all issues have not yet been discovered. For example, when a new GNOME version
    is released, not all packages are updated at the same time and you are likely
    to have a mix of packages with the old version and the new version. Most of the
    time this is fine and it helps everybody to release those updates progressively,
    but there are always exceptions and some applications might be broken due to such
    discrepancies.

    - If the apt output tells you that it will remove packages that you consider important
    for your work. In those cases, you want to review the situation and understand
    why apt wants to remove. Maybe the packages are currently broken and you might
    wait until fixed versions are available, or they have been observed and you should
    identify their replacements and proceed with the full upgrade anyway.


    In general, we recommend that you upgrade Kali once a week. You can certainly
    upgrade daily but it doesn''t make sense to do it often than that. Even if mirrors
    are synchronized four times a day, the updates coming from Debian usually land
    only once a day.


    # 8.2.4. Removing and Purging Packages


    Removing a package is even simpler than installing one. Let''s take a look at
    how to remove a package with dpkg and apt.


    To remove a package with dpkg, supply the -r or --remove option, followed by the
    name of the package. This removal is not, however, complete: all of the configuration
    files, maintainer logs, files (system logs), data generated by the daemon (such
    as the content of an LDAP server directory or the content of a database for an
    SQL server), and most other user data handled by the package remain intact. The
    remove option makes it easy to uninstall a program and later re-install it with
    the same configuration. Also remember that dependencies are not removed. Consider
    this example:


    ```

    # dpkg --remove kali-linux-gpu

    (Reading database ...317681 files and directories currently installed.

    Removing kali-linux-gpu (2016.2) ... )

    ```


    You can also remove packages from the system with apt remove package. APT will
    automatically delete the packages that depend on the package that is being removed.
    Like the dpkg example, configuration files and user data will not be removed.'
