  md: '# Configuration without DHCP


    If the local network is equipped with a DHCP server that you do not wish to use
    because you prefer to define a static IP address for the machine during installation,
    you can add the netcfg/use_dhcp=false option when booting. You just need edit
    the desired menu entry by pressing the Tab key and adding the desired option before
    pressing the Enter key.


    # Root Password


    The installer prompts for a password (Figure 4.6, "Root Password" [page 72]) since
    it automatically creates a super-user root account. The installer also asks for
    a confirmation of the password to prevent any input error which would later be
    difficult to adjust.


    ![](img/f888cd88b4fb3dd45062e14ce223cc4f_97_0.png)


    Set up users and passwords


    You need to set a password for ''root'', the system administrative account. A
    malicious or unqualified user with root access can have disastrous results, so
    you should take care to choose a root password that is not easy to guess. It should
    not be a word found in dictionaries, or a word that could be easily associated
    with you.


    A good password will contain a mixture of letters, numbers and punctuation and
    should be changed at regular intervals.


    The root user should not have an empty password. If you leave this empty, the
    root account will be disabled and the system''s initial user account will be given
    the power to become root using the "sudo" command.


    Note that you will not be able to see the password as you type it.


    Root password:


    ●••••••


    +   - Show Password in Clear


    Please enter the same root password again to verify that you have typed it correctly.

    Re-enter password to verify:


    ●••••••


    +   - Show Password in Clear


    Figure 4.6 Root Password'
