  md: '# 9.1.2. Installing Build Dependencies


    Now that you have the sources, you still need to install build dependencies. They
    will be necessary to build the desired binary packages but are likely required
    for partial builds that you might want to run to test the changes while you make
    them.


    Each source package declares its build dependencies in the Build-Depends field
    of the debian/control file. Let''s instruct apt to install them (assuming that
    you are in a directory containing an unpacked package):


    ```

    $ sudo apt build-dep ./

    Note, using directory ''/'' to get the build dependencies

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    The following NEW packages will be reinstalled:

    autocon automake autopoint autools-dev bepher-dh-autoreconf

    dh-strip-nondeterminism gettext itiltool-debian-libarchive-zip-perl

    libfile-strip-nondeterminism-libtool po-debconf

