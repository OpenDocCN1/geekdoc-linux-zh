    # 8.2. Troubleshooting


    Sooner or later, you will run into a problem when interacting with a package.
    In this section, we will outline some basic troubleshooting steps that you can
    take and provide some tools that will lead you to a potential solution.


    # Handling Problems after an Upgrade


    In spite of the Kali/Debian maintainers'' best efforts, a system upgrade isn''t
    always as smooth as we would hope. New software versions may be incompatible with
    previous ones (for instance, their default behavior or their data format may have
    changed), or bugs may slip through the cracks despite the tempting efforts by
    package maintainers and Debian Unstable.


    Leveraging Bug Reports You sometimes find that a new version of software doesn''t
    work at all. Generally happens if the application is particularly popular and
    hasn''t been tested enough. The first thing to do is to have a look at the Kali
    bug tracker³ and the Debian tracking system⁴://bugs.debian.org/package, and check
    whether the problem has already been reported. If it hasn''t, report it yourself
    (see section 6.3, "Filing a Bug Report" [129] for detailed instructions). If it
    is already known, the bug and the associated messages are usually an excellent
    source of information related to the bug. In some cases, a patch already exists
    and has been made available in the bug report itself; you can then recompile a
    version of the package locally (see section 9.1, "Modifying Kali Packages" [page
    222]). In other cases, users may have found a workaround for the problem and shared
    their insights about it in their replies to the report; those instructions may
    help you work around the problem until a fix or patch is released. In a best-case
    scenario, the package may have already been fixed and you may find it in the bug
    report


    ```

    http://bugs.kali.org

    ```


    ```

    https://bugs.debian.org

    ```'
