  md: 'Although this has been a lengthy setup, the "heavy lifting" is now completed.
    You can boot your networked machines via PXE, install a customized version of
    Kali Linux without interaction thanks to a network-delivered preset, configure
    SaltStack to manage your configurations (and control minions!), create custom
    packages, and distribute those packages through your own package repository. This
    provides centralized management and enterprise-level control over multiple Kali
    Linux installations. In short, you can now deploy highly secure Kali systems preconfigured
    for your specific needs and keep them synchronized thanks to Kali''s (semi-automatic)
