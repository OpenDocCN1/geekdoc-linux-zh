- img_proc: true
  md: "Unaccepted Keys:\nkali-scratch\nProceeded? [n/Y] y\nKey for minion kali-scratch\
    \ accepted.\n\n# 10.2.2. Executing Commands on Minions\n\nAs soon as minions are\
    \ connected, you can execute commands on them from the master:\n\n```\nmaster#\
    \ salt '*' test.ping\nkali-scratch:\n  True\nkali-master:\n  True\n```\n\nThis\
    \ command asks all minions (the '* ' is the wildcard targeting all minions) to\
    \ execute the ping function from the test execution module. This function returns\
    \ a True value on success and is a simple way to ensure that the connection is\
    \ working between the master and the various minions.\nYou can also target a specific\
    \ minion by giving its identifier in the first parameter, and possibly a subset\
    \ of minions by using a less-generic wildcard (such as '*-scratch' or 'kali-*').\
    \ Here is an example of how to execute an arbitrary shell command on the kali-minion:\n\
    \n```\nmaster# salt kali-scratch cmd.shell uptime -a\nkali-scratch:\n05:25:48\
    \ 44 min, 2 users, load average: 0.00, 0.01, 0.05\nLinux kali-scratch 4.5.0-kali1-amd64\
    \ #1 SMP Debian 4.5.3-2kali1 (2016-05-09) x86_64\nGNU/Linux\n```\n\nThere are\
    \ many modules available for all sorts of cases. We cover them all, but the full\
    \ list is available at https://docs.saltstack.com/en/latest/ref/modules/all/index.html.\
    \ You can also obtain a description of all the execution modules and their available\
    \ functions on a given minion with the salt minion doc command. Running this command\
    \ returns a long list of functions, but you can filter the list by passing the\
    \ name of a function or module prefixed by its parent module as a parameter:\n\
    \nSalt Module Reference\n\n```\nmaster# salt kali-scratch sys.doc disk.usage\n\
    disk.usage:\n```\n\nReturn usage information for volumes mounted on the\n\n+ \
    \  - minion\n\nOne of the most useful modules is pkgk, which is a package manager\
    \ abstraction relying on the appropriate package manager for the system (apt-get\
    \ for Debian and its derivatives like Kali)."
