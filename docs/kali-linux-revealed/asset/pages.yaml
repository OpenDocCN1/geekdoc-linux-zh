  md: "As a more concrete sample, you could easily set up a distributed Nmap scan\
    \ with dnmap. After installing the package # on all the minions, you start the\
    \ server in a first terminal:\n\n```\nserver# salt '*' pkg.install dnmap\n...]\n\
    server# vim dnmap.txt\nserver# dnmap_server -f dnmap.txt\n```\n\nAssuming that\
    \ the server IP is 1.2.3.4, you can now tell all minions to start a client process\
    \ that connects to the server:\n\n```\nserver# salt '*' cmd.run_bg template=jinja\
    \ 'dnmap_client -s 1.2.3.4 -a {{ grains.id }}'\nkali-scratch:\n\npid:\n  17137\n\
    ...]\n```\n\nNote that the example uses cmd.run_bg to run the dnmap_client command\
    \ in the background. Don't wait until it finishes, since it is a long-running\
    \ process. Unfortunately, it doesn't kill itself properly when you interrupt the\
    \ server so you might have to clean it up:\n\n```\nserver# salt '*' cmd.shell\
    \ -kill -f dnmap_client\n```\n\n# 10.2.3. Salt States and Other Features\n\nWhile\
    \ remote execution is an important building block, it is only a tiny fraction\
    \ of what SaltStack can do.\n\nWhen setting up a new machine, you often run many\
    \ commands and tests to determine the details of the system prior to installation.\
    \ These operations are formalized in re-usable configuration templates called\
    \ state files. The operations described in state files can then be performed with\
    \ a single state.apply command.\n\nTo save some time, you can rely on many ready-to-use\
    \ state files that have been created by the community and are distributed in \"\
    Salt formulas\":\n\n+   https://docs.saltstack.com/en/latest/topics/development/conventions/formulas.html\n\
    \nThere are many other features that can be combined:\n\n+   - Scheduled execution\
    \ of actions\n- Defining actions in response to events triggered by minions\n\
    - Collecting data out of minions"
  merge: -1
