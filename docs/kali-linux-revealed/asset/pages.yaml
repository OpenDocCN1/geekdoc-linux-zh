    # GNOME is Kali Linux''s Desktop Environment


    A desktop environment is a collection of graphical applications that share a common
    toolkit and are meant to be used together on workstations. They usually provide
    an application launcher, a file manager, a web browser, an office suite, etc.


    GNOME is one of the most popular desktop environments (with KDE, Xfce, LXDE, MATE)
    and is installed on main ISO images produced by Kali Linux. If you dislike GNOME,
    it is easy to build a custom ISO with the desktop environment of your choosing.
    Instructions to do so are covered in this book in chapter 9, "Advanced Usage"
    [page 222].


    In parallel, we increased our efforts to ensure that Kali Linux always has the
    latest version of all pentesting applications. Unfortunately, that goal was a
    bit at odds with the use of Debian Stable as a base for the distribution, because
    it required us to backport many packages. This is due to the fact that Debian
    Stable puts a priority on the stability of the software, often causing a long
    delay from the release of an upstream update to when it is integrated into the
    distribution. Given our investment in continuous integration, it made quite a
    natural to rebase Kali Linux on Debian Testing so that we could benefit from the
    latest version of all Debian packages as soon as they were available. Debian Testing
    has a much more aggressive update cycle, which is more compatible with the philosophy
    of Kali Linux.


    This is, in essence, the concept of Kali Rolling. While the rolling distribution
    has the rolling nature of distribution: when Kali 2016 was the first release to
    embrace this nature, your system actually tracks the Kali Rolling distribution
    and every single day you get new updates. In the past, Kali releases were snapshots
    of the underlying Debian distribution with Kali-specific packages injected into
    it.


    A rolling distribution has many benefits but it also comes with multiple challenges,
    both for those of us who are building the distribution and for the users who have
    to cope with a never-ending flow of updates and sometimes backwards-incompatible
    changes. This book aims to give you the knowledge required to deal with everything
    you may encounter while managing your Kali Linux installation.


