    # 4.2.2. Installation on a Fully Encrypted File System


    To guarantee the confidentiality of your data, you can set encrypted partitions.
    This will protect your data if your laptop or hard drive is lost or stolen. The
    partitioning tool can help you in this process, both in guided and manual mode.'
  merge: -1
