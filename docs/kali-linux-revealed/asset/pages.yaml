    # 11.2.3. Traditional Penetration Test


    A traditional penetration test has become a difficult item to define, with many
    working from different dimensions, depending on the space they operate in. Part
    of this market confusion is driven by the fact that the term "Penetration Test"
    has become more commonly used for the previously mentioned compliance-based penetration
    test (or even a vulnerability assessment) where, by design, you are not delving
    deep into the assessment that would go beyond the minimum requirements.


    For the purposes of this section, we will side-step that debate and use this category
    to cover assessments that go beyond the minimum requirements; assessments that
    are designed to improve the overall security of the organization.


    As opposed to the previously-assessed assessment types, penetration tests don''t
    often start with a scope definition, but instead a goal such as, "simulate what
