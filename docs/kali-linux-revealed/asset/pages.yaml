  md: 'No matter how many years of experience you have, there is no doubt—sooner or
    later—you will encounter a problem. Solving that problem is then often a matter
    of understanding it and then taking advantage of various resources to find a solution
    or work-around.


    In this chapter, we will discuss the various information sources available and
    discuss the best strategies for finding the help you need or the solution to a
    problem you might be facing. We will also take you on a tour of the Kali Linux
    community resources available, including the forums and Internet Relay Chat (IRC)
    channel. Lastly, we will introduce bug reporting and show you how to take advantage
    of bug filing systems to troubleshoot problems and lay out strategies to help
    you find your own bug report so that undocumented issues can be handled quickly
    and effectively.


    # 6.1. Documentation Sources


    Before you can understand what is really going when there is a problem, you need
    to know the theoretical role played by each program involved in the problem. One
    of the best ways to do this is to review the program''s documentation. Let''s
    begin by discussing where, exactly, you can find documentation since it is often
    scattered.


    | How to Avoid RTFM Answers | This acronym stands for "read the f***manual," but
    can also be expanded in a friendly variant, "read the fine manual." This phrase
    is sometimes used in (terse) responses to questions from newbies. It is rather
    abrupt, but contains a certain nuance at a question asked by someone who has not
    bothered to read the documentation. Some say this classic response is better than
    no response at all since this at least hints that the answer lies within the documentation.
    |


    When you are posting questions, not necessarily be offended by the occasional
    RTFM response, but do what you can to show that you have taken the time to do
    some research before posting the question; mention the sources you consulted and
    describe the steps you have personally taken to find information. This will go
    a long way to show that you are not lazy and truly seeking knowledge. Following
    Raymond''s guidelines is a good way to avoid the most common mistakes and get
    useful answers.


    +   - http://catb.org~/esr/faqs/smart-questions.html


    # 6.1.1. Manual Pages


    Manual pages, while relatively terse in style, contain a great deal of essential
    information. To view a manual page, simply type *manual-page*. The manual page
    usually coincides with the command name. For example, to learn about the possible
    options for the cp command, you would type *cp* at the command prompt.


    Man pages not document programs accessible from the command line, but also configuration
    files, system calls, C library functions, and so forth. Sometimes names can collide.
    For example,'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'the shell''s read command has the same name as the read system call. This is
    why manual pages are organized in the following numbered sections:


    +   1. Commands that can be executed from the command line

    2. System calls (functions provided by the kernel)

    3. Library functions (provided by system libraries)

    4. Devices (on Unix-like systems, these are special files, usually placed in the
    /dev/ directory)

    5. Configuration files (formats and conventions)

    6. Games

    7. Sets of macros and standards

    8. System administration routines

    9. Kernel routines


    You can specify the section of the manual page that you are looking for: to view
    the documentation for the read system call, you would type man 2 read. When no
    section is explicitly specified, the first section that has a manual page with
    the requested name will be shown. Thus, man shadow returns shadow(5) because there
    are no manual pages for shadow in sections 1–4.


    Of course, if you do not know the names of the commands, the manual is not going
    to be of use to you. Enter the apropos command, which searches manual pages (or
    more specifically their descriptions) for any keywords that you provide. The apropos
    command returns a list of manual pages whose summary the requested keywords along
    the one-line summary from the manual page. If you choose your keywords well, you
    will find the name of the command that you need.


    # Example 6.1 Finding cp with apropos


    | apropos "copy file" |

    | cp (1) | copy files and directories |

    | cpio (1) | copy files to and from archives |

    | gfs-copy (1) | Copy files |

    | gfs-move (1) | Copy files |

    | hcopy (1) | copy files from or to an HFS volume |

    | install (1) | copy files and set attributes |

    | ntfscp (8) | copy file to an NTFS volume |


    | Browsing Documentation by Following Links | Many manual pages have a "See Also"
    section, usually near the end of the document, which refers to other manual pages
    relevant to similar commands, or to external documentation. You can use this section
    to find relevant documentation even when the first choice is not optimal.'
