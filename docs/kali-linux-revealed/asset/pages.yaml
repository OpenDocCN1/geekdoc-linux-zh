  md: '# Dependences: the Depends Field


    The package dependencies are defined in the Depends field in the package header.
    This is a list of conditions to be met for the package to work correctly—this
    information is used by tools such as apt in install the required libraries, in
    appropriate versions fulfilling the dependencies of the package to be installed.
    For each dependency, you can restrict the range of versions that meet that condition.
    In other words, it is possible to express the fact that you need the package libc
    in operators greater than "2.15" (written "libc6 >= 2.15"). Version comparison
    operators are:


    +   * <<; less than;

    * <=; less than or to;

    * =: equal to (note that "2.6.1" is not equal to "2.6.1-1");

    * >=; greater than or to;

    * >>; greater than;


    In a list of conditions to be met, the comma serves as a separator, interpreted
    as a logical "AND." In conditions, the vertical bar "|" expresses logical "OR"
    (it is an inclusive "OR," not an exclusive "either/or\). Carrying greater priority
    than "AND," you can use it many times as necessary. Thus, the dependency "(A OR
    AND C)" should be written as A | B, A | C. In contrast, the expression "A OR (B
    AND C)" should be written as "(A OR B) AND (A OR C)", since the Depends field
    does not tolerate parentheses that change the order of priorities by the logical
    operators "OR" and "AND". It would have to be written A | B, A | C. See http://www.debian.org/doc/debian-policy/ch-relationships.html
    for more information.


    The dependencies system is a good mechanism for guaranteeing the operation of
    a program if it has another with meta-packages. These are empty packages that
    only describe dependencies. They facilitate the installation of a consistent group
    of programs preselected by the meta-package maintainer; as, apt install meta-package
    will automatically install all of these programs using the meta-package''s dependencies.
    The gnome, kde-full, and kali-linux-full packages are example


    ples of meta-packages.


    # Pre-Depends, a More Demanding Depends


    Pre-dependencies, which are listed in the Pre-Depends field in the package headers,
    complete the normal dependencies; their syntax is identical. A normal dependency
    indicates that the package in question must be unpacked and configured before
    configuration of the package declaring the dependency. A pre-dependency stipulates
    that the package in question must be unpacked and configured before execution
    of the pre-installation script of the package declaring the pre-dependency, that
    before its installation.'
