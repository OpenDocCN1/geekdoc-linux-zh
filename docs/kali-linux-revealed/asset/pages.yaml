    /usr/lib/x86 64-linux-gnu/zsh/5.2/zsh

    [...]

    ```


    The /var/lib/dpkg/status file contains a series of data blocks (in the format
    of the famous man headers request for comment, RFC 2822) describing the status
    of each package. The information from the control file of the installed packages
    is replicated there.


    ```

    $ more /var/lib/dpkg/status

