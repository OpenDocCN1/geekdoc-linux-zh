  md: 'Congratulations! Hopefully you should now be more familiar with your Kali Linux
    system and you should not be afraid of using it for any experiment that you can
    think of. You have discovered its most interesting features but you also know
    its limits and various ways to work around those limitations.


    If you have not put all features into practice, keep this book around for reference
    purposes and refresh your memory when you are about to find a new feature. Remember
    that there is nothing better than practice (and perseverance) to develop new skills.
    Try Harder'', as the Offensive Security trainers keep repeating.


    # 12.1. Keeping Up with Changes


    With a constantly-changing distribution like kali-rolling, some parts of the book
    will necessarily become obsolete. We will do our best to keep it up to date (at
    least for the online version) but for most parts we tried to provide generic explanations
    that should be useful for a long time to come.

    That said, you should be ready to embrace changes and find out solutions any problem
    that might pop up. With the better understanding of Kali Linux and its relationship
    to Debian, you can rely on both the Kali and Debian communities and their numerous
    resources (bug trackers, forums, mailing lists, etc.) when you are getting stuck.


    Don''t be afraid to file bugs (see section 6.3, "Filing a Good Bug Report" [page
    129])! If you are like me, by the time you have completed the steps involved in
    filing a good bug report (and it takes some time), you will have solved the problem
    or at least found a good work-around. And by actually fixing the bug, you will
    be helping others who are affected by the issue.


    # 12.2. Showing Off Your Newly Gained Knowledge


    Are you proud of your new Kali Linux skills? Would you like to ensure that you
    remember the really important things? If you answer yes to one of those questions,
    then you should consider applying for the Kali Linux Certified Professional program.


    It is a comprehensive certification that will ensure that you know how to deploy
    and use Kali Linux in many realistic cases. It is a nice addition to your resume
    and it also proves that you are ready to go further.


    # 12.3. Going Further


    This book taught you a lot of things that any Kali Linux user should know, but
    we made some hard choices to keep it short, and there are many topics that were
    not covered.


    > ¹https://www.offensive-security.com/offsec/say-try-harder/'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# 12.3.1. Towards System Administration


    If you want to learn more about system administration, then we can only recommend
    that you check out the Debian Administrator''s Handbook:


    +   - https://debian-handbook.info/get/


    You will find many supplementary chapters covering common Unix services that we
    have entirely skipped in this book. And even for chapters that have been reused
    in the Kali book, you will find plenty of supplementary tips, notably on the packaging
    system (which is also covered more extensively at its lowest level).


    The Debian obviously presents more the Debian community and why it is organized.
    While this knowledge is not vital, it is really useful when you have to interact
    with Debian contributors, for example through bug reports.


    # 12.3.2. Towards Penetration Testing


    You probably noticed by now this book did not teach you penetration testing. But
    the things you learned are so important. You are now ready to fully exploit the
    power of Kali Linux, the best penetration testing framework. And you have the
    basic Linux skills required to participate in Offensive Security’s training.


    If you feel that you are not ready for a paid course, you can start by following
    the Metasploit Unleashed² free online training. Metasploit is a popular penetration
    testing tool and you have to know if you are serious about your plans to learn
    penetration testing.


    The next logical step would then be to follow the Penetration Testing with Kali
    Linux³ online course leading to the famous “Offensive Security Certified Professional”
    certification. This course can be followed at your own pace but the certification
    is actually difficult, 24h long, real-word, hands-on penetration test which takes
    place in an isolated VPN network.


    Are you up to the challenge?


    > ²https://www.offensive-security.com/metasploit-unleashed/


    > ³https://www.offensive-security.com/information-security-training/'
