  md: 'We covered many Kali Linux-specific features up to this point you should have
    a strong understanding of what makes Kali special and how to accomplish a number
    of complex tasks.


    Before putting Kali how to use, there are a few concepts relating to security
    assessments that you should understand. In this chapter, we will introduce these
    concepts to get you started and provide references that will help you use Kali
    to perform a security assessment.


    To start with, it is worth taking some time to explore exactly "security" means
    when dealing with information systems. When attempting to secure an information
    system, you focus on three primary attributes of the system:


    +   - Confidentiality: can actors who not have access to the system or information
    access the system or information?

    - Integrity: can the data or the system be modified in some way that is not intended?

    - Availability: are the data or the system accessible when and how is it intended
    to be?


    Together, these concepts make up the CIA (Confidentiality, Integrity, Availability)
    triad and in large part, are the primary items that you will focus on when securing
    a system as part of standard deployment, maintenance, or assessment.


    It is also important to note that in some cases, you may be far concerned with
    one aspect of the CIA triad than others. For instance, if you have a personal
    journal that contains your most secret thoughts, the confidentiality of the journal
    may be far important than to you the integrity or the availability. In other words,
    you may not be concerned about whether one can write to the journal (as opposed
    to reading it) or whether not the journal is always accessible. On the other hand,
    if you are securing a system that tracks medical prescriptions, the integrity
    of the data will be most critical. While it is important to prevent other people
    from reading what someone uses and it is important that you can access this list
    of medications, if someone were able to change the contents of the system (altering
    the integrity), it could lead to life-threatening results.


    When you are securing a system and an issue is discovered, you will have to consider
    which of these three concepts, or which combination of, the issue falls into.
    This helps you to understand the problem in a more comprehensive manner and allows
    you to respond accordingly. It is possible to identify vulnerabilities that impact
    a single, or multiple items from the CIA triad. To use a web application with
    a SQL injection vulnerability as an example:


    +   - Confidentiality: a SQL injection vulnerability that allows an attacker to
    extract the full contents of the web application, allowing them to have full access
    to read the data, but no ability to change the information or disable access to
    the database.

    - Integrity: a SQL injection vulnerability that allows an attacker to change the
    existing information in the database. The attacker can''t read the data or prevent
    others from accessing the database.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '+   Availability: SQL injection vulnerability that initiates a long-running
    query, consuming a large amount of resources on the server. This query, when initiated
    multiple times, leads to a denial of service (DoS) situation. The attacker has
    no ability to access or change data that can prevent legitimate users from accessing
    the web application.


    +   Multiple: SQL injection vulnerability leads to full interactive shell access
    to the host operating system running the web application. With this access, the
    attacker can break the confidentiality of the system by accessing data as they
    please, compromise the integrity of the system by altering data, and if they choose
    so, destroy the web application, leading to a compromise of the system.


    The concepts behind the CIA triad are not overly complicated, and realistically
    are items that you are working with intuitively, even if you don''t recognize
    it. However, it is important to mindfully interact with the concept as it can
    help you recognize where to direct your efforts. This conceptual foundation will
    assist you with the identification of the critical components of your systems
    and the amount of effort and resources worth investing in correcting problems.


    Another concept that we will address in detail is risk, and how it is made up
    of threats and vulnerabilities. These concepts are not too complex, but they are
    easy to get wrong. We will cover these concepts in detail later on, but at a high
    level, it is best to think of risk as what you are trying to prevent from happening,
    threat as what you would do to, and vulnerability as what allows them to do it.
    Controls can be put in place to address the threat or vulnerability, with the
    goal of mitigating the risk.


    For example, when visiting parts of the world, you may be at substantial risk
    of catching malaria. This is because the threat of mosquitoes is very high in
    some areas, and you are almost not immune to malaria. Fortunately, you can control
    the vulnerability with medication and attempt to control the threat with the use
    of bug repellent and mosquito nets. Controls in place addressing both the threat
    and the vulnerability, you can help ensure the risk does not actualize.


    # 11.1. Kali Linux in an Assessment


    When preparing to use Kali Linux in the field, you must first ensure you have
    a clean, working installation. A common mistake that novice security professionals
    make is using a single installation across multiple assessments. This is a problem
    for two primary reasons:


    +   Over the course of an assessment, you will often install, tweak, or change
    your system. These one-off changes may get you up and running solve a particular
    problem, but they are difficult to keep track of; they make your system more difficult
    to maintain; and they complicate future configurations.


    +   Each security assessment is unique. Leaving behind notes, code, and other
    changes can lead to confusion, or worse — cross-contamination of client data.'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'That is why starting with a clean Kali installation is highly recommended and
    why a pre-customized version of Kali Linux is ready for automated installation
    pays off. Be sure to refer back to section 9.3, “Building Custom Kali ISO Images”
    [page 236] and section 4.3, “Unattended Installations” [page 91] on how to do
    this, since the more you automate today, the less time you waste tomorrow.


    Everyone has different requirements when it comes to how they Kali configured
    when they are in the field, but there are some universal recommendations that
    you really want to follow. First, consider using an encrypted installation as
    documented in section 4.2.2, “Installation on a Fully Encrypted File System” [page
    85]. This will protect your data on the physical machine, which is a life-saver
    if your laptop is stolen.


    For extra safety travel, you might want to think the decryption key (see “Adding
    a Nuke Password for Extra Safety” [page 245]) after having sent an (encrypted)
    copy of the key to a coworker in the office. That way, your data are secure until
    you get to the office where you can restore the laptop with the decryption key.


    Another item is that you should double-check the list of packages that you have
    installed. Consider what tools you might need for the work you are setting to
    accomplish. For example, if you are embarking on a wireless security assessment,
    you may consider the *kali-linux-wireless* metapackage, which contains all of
    the wireless assessment tools available in Kali Linux, or if a web application
    assessment is coming up, you can install all of the available web application
    testing tools with the *kali-linux-web* metapackage. It is best to assume that
    you will not have easy access to the Internet while conducting a security assessment,
    so be sure to prepare as much as possible in advance.


    For the same reason, you might want to review your network settings (see section
    5.1, “Configuring the Network” [page 104] and section 7.3, “Securing Network Services”
    [page 153]). Doublecheck your DHCP settings and review the services you are listening
    on assigned IP address. These settings might make a critical impact to your success.
    You can’t assess what you can’t see and excessive listening services may flag
    your system and get shut down before you get started.


    If your role involves investigating network intrusions, paying close attention
    to your network settings is even more important and you to avoid altering the
    impacted systems. A customized version of Kali with the *kali-linux-forensic*
    metapackage booted up in forensics mode will not automatically mount disks or
    use a swap partition. In this way, you can maintain the integrity of the system
    under analysis while making use of the many forensics tools available in Kali
    Linux.


    It is critical that you properly prepare your Kali Linux installation for the
    job. You will find that a clean, efficient, and effective Kali environment will
    always make everything that much smoother.'
