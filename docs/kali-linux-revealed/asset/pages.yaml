  md: '# Example 5.2 Static Configuration in /etc/systemd/network/50-static.network


    ```

    [Match]

    Name=enp2s0


    [Network]

    Address=192.168.0.15/24

    Gateway=192.168.0.1

    DNS=8.8.8.8

    ```


    Note that system-networkd is disabled by default, so if you want to use it, you
    should enable it.

    It also depends on systemd-resolved for proper integration of DNS resolution,
    which in turn requires to replace /etc/resolv.conf with a symlink to /run/system/resolve/resolv.conf,
    which is managed by systemd-resolved.


    ```

    # systemctl enable systemd-networkd

    # systemctl enable systemd-resolved

    # systemctl start systemd-networkd

    # ln -sf /run/system/resolve/resolv.conf /etc/resolv.conf

    ```


    Although systemd-networkd has some limitations, like the lack of integrated support

    for wireless networks, you can rely on a pre-existing external wpa_significant
    configuration for

    wireless support. However, it is particularly useful in containers and virtual
    machines and was

    originally developed for environments in which a container''s network configuration
    depended on

    its host''s network configuration. In this scenario, systemd-networkd makes it
    easier to manage

    both sides in a consistent manner while supporting all sorts of virtual network
    devices that

    you might need in this type of scenario (systemd.netdev(5)).


    # 5.2. Managing Unix Users and Groups


    The database of Unix users and groups consists of the textual files /etc/passwd
    (list of users),

    /etc/shadow (encrypted passwords of users), /etc/group (list of groups), and /etc/gshadow

    (encrypted passwords of groups). Their formats are documented in passwd(5), shadow(5),

    group(5), and gshadow(5) respectively. While these files can be manually edited
    with tools like

    vipw and vigr, there are higher level tools to perform the most common operations.


    # 5.2.1. Creating User Accounts


    Although Kali is most run when authenticated as the root user, you may often need
    to create

    non-privileged user accounts for various reasons, particularly if you are using
    Kali as a primary'
