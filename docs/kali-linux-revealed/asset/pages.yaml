  md: 'In this chapter, we will take a look at various ways you can configure Kali
    Linux. First, in section 5.1, “Configuring the Network” [page 104], we will show
    you how to configure your network settings using a graphical environment and the
    command line. In section 5.2, “Managing Users and Unix Groups” [page 107], we
    will talk about users and groups, showing you how to create and modify user accounts,
    set passwords, disable accounts, and manage groups. Finally, we will discuss services
    in section 5.3, “Configuring Services” [page 109] and explain how to set up and
    maintain generic services and also focus on three very important and specific
    services: SSH, PostgreSQL, and Apache.


    # 5.1. Configuring the Network


    # 5.1.1. On the Desktop with NetworkManager


    In a typical desktop installation, you''ll have NetworkManager already installed
    and it can be controlled and configured through GNOME’s control center and the
    top-right menu as shown in Figure 5.1, “Network Configuration Screen” [page 104].


    ![](img/f888cd88b4fb3dd45062e14ce223cc4f_129_0.png)


    Figure 5.1 Network Configuration Screen'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'The default configuration relies on DHCP to obtain an IP address, DNS server,
    gateway, but you can use the gear icon in the lower-right corner to alter the
    configuration in many ways (for example: set the MAC address, switch to a static
    setup, enable or disable IPv6, and add additional routes). You can create profiles
    to save multiple network configurations and easily switch between them. For wireless
    networks, their settings are automatically tied to your public identifier (SSID).


    NetworkManager also handles connections by mobile broadband (Wireless Wide Area
    Network WWAN) and by modems using point-to-point protocol over ethernet (PPPoE).
    But not least, it provides integration with many types of virtual private networks
    (VPN) through dedicated plugins: SSH, OpenVPN, VPNNC, PPTP, Strongswan. Check
    out the network-manager-* packages; most of them are not installed by default.
    Note that you need the packages suffixed with -gnome to be able to configure them
    through the graphical user interface.


    # 5.1.2. On the Command Line with Ifupdown


    Alternatively, when you prefer not to use (or don''t have access to) a graphical
    desktop, you can configure the network with the already-installed ifupdown package,
    which includes the ifup and ifdown tools. These tools read definitions from the
    /etc/network/interfaces configuration file and are at the head of the /etc/init.d/networking
    init script that configures the network at boot time.


    Each network device managed by ifupdown can be deconfigured at any time with ifdown
    network-device. You can then modify /etc/network/interfaces and bring the network
    back up (with the new configuration) ifupdown network-device.


    Let''s take a look at what we can put in ifupdown''s configuration file. There
    are two main directives: auto network-device, which tells ifupdown to automatically
    configure the network interface once it is available, and iface network-device
    inet/inet6 type to configure a given interface. For example, a plain DHCP configuration
    looks like this:


    ```

    auto lo

    iface lo inet loopback


    auto eth0

    iface eth0 inet dhcp

    ```


    Note that the special configuration for the loopback device should always be present
    in this file. For a fixed IP address configuration, you have to provide more details
    such as the IP address, the network, and the IP of the gateway:'
  merge: -1
  pgno: 130
- img_proc: true
  md: '```

    auto eth0

    iface eth0 inet static

    address 192.168.0.3

    netmask 255.255.255.0

    broadcast 192.168.0.0

    network 192.168.0.0

    gateway 192.168.0.1

    ```


    For wireless interfaces, you must have the wpasupplicant package (included in
    Kali by default), which provides many wpa-* options that can be used in /etc/network/interfaces.
    We have a look at /usr/share/doc/wpasupplicant/README.Debian.gz for examples and
    explanations. The most common options are wpa-ssid (which defines the name of
    the wireless network to join) and wpa-psk (which defines the passphrase or the
    key protecting the network).


    iface wlan0 inet dhcp

    wpa-ssid MyNetwork

    wpa-psk plaintextsecret


    # 5.1.3. On the Command Line with systemd-networkd


    ifdown is the historical tool used by Debian, and while it is still the default
    for server or other minimal installations, there is a newer tool considering:
    systemd-networkd. Its integration with the systemd init system makes it a very
    attractive choice. It is not specific to Debian-based distributions (contrary
    to ifdown) and has been designed to be very small, efficient, and relatively easy
    to configure if you understand the syntax of systemd unit files. This is an especially
    attractive choice if you consider NetworkManager bloated and hard to configure.


    You configure systemd-network by placing .network files into the /etc/systemd/network/.
    Alternatively, you can use /lib/systemd/network/ for generated files or run/systemd/network/
    for runtime files. The format of these files is documented. The Match section
    indicates the network interfaces the configuration applies to. You can specify
    the interface in many ways, including by media access control (MAC) address or
    device type. The Network section defines the network configuration.


    > Example 5.1 DHCP-based Configuration in /etc/systemd/network/80-dhcp.network


    ```

    [Match]

    Name=en*


    [Network]

    DHCP=yes

    ```'
