    [page 77]). You can modify each partition individually by selecting a partition.
    For example, you could choose another file system if the standard (ext4) is not
    appropriate. In most cases, however, the proposed partitioning is reasonable and
    you can accept it by selecting "Finish partitioning and write changes to disk."
    It may go without saying, choose wisely as it will erase the contents of the selected
    disk.


    ![](img/f888cd88b4fb3dd45062e14ce223cc4f_102_0.png)


