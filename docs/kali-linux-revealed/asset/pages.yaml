  md: 'Alternatively, you can also force the expiration of a password using the passwd
    -e user command, which forces the user to change their password the next time
    they log in.


    # 5.2.3. Disabling an Account


    You may find yourself needing to disable an account (lock out a user) as a disciplinary
    measure, for the purposes of an investigation, or simply in the event of a prolonged
    or definitive absence of a user. A disabled account means the user cannot login
    or gain access to the machine. The account remains intact on the machine and no
    files or data are deleted; it is simply inaccessible. This is accomplished by
    using the command passwd -l user (lock). Re-enabling the account is done in similar
    fashion, with the -u option (unlock).


    # 5.2.4. Managing Unix Groups


    The addgroup and delgroup commands add or delete a group, respectively. The groupmod
    modifies a group''s information (its gid or identifier). The command gpasswd-wd
    group changes the password for the group, while the gpasswd -r group command deletes
    it.


    | Working with Several Groups | Each user may be a member of many groups. A user''s
    main group is, by default, created during initial configuration. By default, each
    file that a user belongs to the user, as well as to the user''s main group. This
    is not always desirable; for example, when the user needs to work in a directory
    shared by a other group. In this case, the user needs to change groups using one
    of the following commands: newgrp, starts a new shell, or sg, which executes a
    command using the supplied group to which they do not belong. If the group is
    protected, they will need to supply the appropriate password before the command
    is executed. Alternatively, the user can set the setgid bit on the directory,
    which causes files created in that to automatically belong to the correct group.
    For more details, see setgid directory and sticky bit [page 58]. The id command
    displays the current state of a user, with their personal identifier (uid variable),
    current main group (gid variable), and the list of groups to which they belong
    (groups variable). |


    # 5.3. Configuring Services


    In this section we will take a look at services (sometimes called daemons), or
    programs that run as a background process and perform various functions for the
    system. We will start discussing configuration files and will proceed to explain
    how important services (such as SSH, PostgreSQL, and Apache) function and how
    they can be configured.'
