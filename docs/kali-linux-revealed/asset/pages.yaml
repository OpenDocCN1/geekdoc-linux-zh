  md: '# Bootable Kali USB Drive on OS X/macOS


    For reference, if stands for "input file" and of "output file." The dd command
    reads data from the input file and writes it back to the output file. It does
    not show any progress so you must be patient while it is doing its work (It is
    not unusual for the command to take more than half an hour!). Look at the work
    activity LED on the USB key if you want to double check that the command is working.
    The statistics above are displayed only when the command has completed. On OS
    X/macOS, you can also press CTRL+T during the operation to get statistical information
    about the copy including how much data has been copied.


    OS X/macOS is based on UNIX, so the process of creating a bootable Kali USB drive
    is similar to the Linux procedure. Once you have downloaded and verified your
    chosen Kali ISO file, use dd to copy it over your USB stick.


    To identify the device name of the USB key, run diskutil list to find the disks
    available on your system. Next, insert your USB key and run the diskutil command.
    The second output should list an additional disk. You can determine the device
    name of the USB key by comparing the output from both commands. Look for a new
    line identifying your USB disk and note /dev/diskX where X represents the disk
    ID.


    You should make sure the USB key is not mounted, which can be accomplished with
    an explicit unmount command (assuming /dev/disk6 is the device name of the USB
    key):


    ```

    $ diskutil unmount /dev/disk6

    ```


    Proceed to execute the dd command. This time, add a supplementary parameter —
    bs for block size. It defines the size of the block that is read from the input
    file and written to the output file.


    ```

    # dd if=kali-linux-light-2017.1-amd64.iso of=/dev/disk6 bs=1M

    1011+ records in

    1011+ records out

    1060241408 bytes transferred in 327.061 secs (324328 bytes/sec)

    ```


    That''s it. Your USB key is now ready and you can boot from it or use it to install
    Kali Linux.


    | Booting an Alternate Disk | To boot from an alternate drive on an OS X/macOS
    system, press the boot menu by pressing and holding the Option key immediately
    after powering on the device and selecting the drive you want to use. |

    | OS X/macOS |


    For more information, see Apple''s knowledge base¹.


    > http://support.apple.com/kb/ht1310'
  merge: -1
