- img_proc: true
  md: "In order to set up dnsmasq, you must first configure it through /etc/dnsmasq.conf.\
    \ A basic configuration consists of only a few key lines:\n\n```\n# Network interface\
    \ to handle\ninterface=eth0\n# DHCP options\n# IP range to allocate\ndhcp-range=192.168.101.100,192.168.101.200,128\n\
    # Gateway to announce to clients\ndhcp-option=router,192.168.101.1\n# DNS servers\
    \ to announce to clients\ndhcp-option=dns-server,8.8.8.8,8.8.4.4\n# Boot file\
    \ to announce to clients\ndhcp-boot=pxelinux.0\n# TFTP options\nenable-tftp\n\
    # Directory hosting files to serve\ntftp-root=/tftpboot/\n```\n\nWith /etc/dnsmasq.conf\
    \ configured, you will need to place the installation boot files in the /tftpboot/\
    \ directory. Kali Linux provides a file archive dedicated to this purpose that\
    \ can be directly unpacked into /tftpboot/. Simply select 32-bit (i86) and 64-bit\
    \ (amd64) and standard or general (gtk) install methods for your target machine\
    \ and choose the appropriate archive:\n\n+   - http://http.kali.org/dists/kali-rolling/main/installer-amd64/current/images/netboot/gtk/netboot.tar.gz\n\
    - http://http.kali.org/dists/kali-rolling/main/installer-amd64/current/images/netboot/netboot.tar.gz\n\
    - http://http.kali.org/dists/kali-rolling/main/installer-i386/current/images/netboot/gtk/netboot.tar.gz\n\
    - http://http.kali.org/dists/kali-rolling/main/installer-i386/current/images/netboot/netboot.tar.gz\n\
    \nOnce you have selected the archive, create /tftpboot/, download the archive,\
    \ and unpack it into that directory:\n\n```\n# mkdir /tftpboot\n# cd /tftpboot\n\
    # wget http://http.kali.org/dists/kali-rolling/main/installer-amd64/current/images/\n\
    \    netboot.tar.gz\n# tar xf netboot.tar.gz\n# ls -l\ntotal 25896\ndrwxr-xr-x\
    \ 3 root root 4096 May 6 04:43:3 debian-installer\n```"
