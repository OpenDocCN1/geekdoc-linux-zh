  md: '# Detecting Disks and Other Devices


    This step automatically detects the hard drives on which Kali may be installed,
    each of which will be presented in the next step: partitioning.


    # Partitioning


    Partitioning is an indispensable step in installation, which consists of dividing
    the available space on the hard drives into discrete sections (partitions) according
    to the intended function of the computer and those partitions. Partitioning also
    involves choosing the file systems to be used. All of these decisions will have
    an influence on performance, data security, and server administration.


    The partitioning step is traditionally difficult for new users. However, the Linux
    file systems and partitions, including virtual memory (or swap partitions) must
    be defined as they form the foundation of the system. This task can become complicated
    if you have already installed another operating system on the machine and you
    want the two to coexist. In this case, you must make sure not to alter its partitions,
    or if need, resize without causing damage.


    To accommodate more common (and simpler) partition schemes, most users will prefer
    the Guided mode that recommends partition configurations and provides suggestions
    each of the way. More advanced users will appreciate the Manual mode, which allows
    for more advanced configurations. Each mode shares certain capabilities.


    ![](img/f888cd88b4fb3dd45062e14ce223cc4f_99_0.png)


    Figure 4.8 Choice of Partitioning Mode'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Guided Partitioning The first screen in the partitioning tool (Figure 4.8,
    "Choice of Partitioning Mode" [page 74]) presents entry points for the guided
    and manual partitioning modes. "Guided - use entire disk" is the simplest and
    most common partition scheme, which will allocate an entire disk to Kali Linux.


    The next selections use Logical Volume Manager (LVM) to set up logical (instead
    of physical), optionally encrypted, partitions. We will discuss LVM and encryption
    later in this chapter.


    Finally, the last choice initiates manual partitioning, which allows for more
    advanced partitioning schemes, such as installing Kali Linux alongside other operating
    systems. We will discuss manual mode in the next section.


    In this example, we will allocate an entire hard disk to Kali, so we select "Guided
    - use entire disk" to proceed to the next step.


    The next screen (shown in Figure 4.9, "Disk to Use for Guided Partitioning" [page
    75]) allows you to choose the disk where Kali will be installed by selecting the
    corresponding entry (for example, "Virtual disk 1 (vda) - 32.2 GB Virtio Block
    Device"). Once selected, guided partitioning will continue. This option will erase
    all of the data on this disk, so choose wisely.


    ![](img/f888cd88b4fb3dd45062e14ce223cc4f_100_0.png)


    Figure 4.9 Disk to Use for Guided Partitioning'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'Next, the guided partitioning tool offers three partitioning methods, which
    correspond to different usages, as shown in Figure 4.10, "Guided Partition Allocation"
    [page 76].


    ![](img/f888cd88b4fb3dd45062e14ce223cc4f_101_0.png)


    Figure 4.10 Guided Partition Allocation


    The first method is called "All files in one partition." The entire Linux system
    tree is stored in a single file system, corresponding to the root (\) directory.
    This simple and robust partitioning scheme works perfectly well for personal or
    single-user systems. Despite the name, two partitions will be created: the first
    will house the complete system, the second virtual memory (or "swap").


    The second method, "Separate /home/ partition," is similar, but splits the file
    hierarchy in two: one partition contains the Linux system (//), and the second
    contains "home directories" (meaning user data, in files and subdirectories available
    under /home/). One benefit to this method is it easy to preserve the user data
    if you have to reinstall the system.


    The last partitioning method, called "Separate /home, /var, and /tmp partitions,"
    is appropriate for servers and multi-user systems. It divides the file tree into
    many partitions: in addition to the root (\/) and user accounts (/home/) partitions,
    it also has partitions for server software data (/var/), and temporary files (/tmp/).
    One benefit to this method is that end users cannot lock the server by consuming
    all available hard drive space (they can only fill up /tmp and /home/). At the
    same time, daemon (especially logs) can no longer clog the rest of the system.'
  merge: -1
  pgno: 101
