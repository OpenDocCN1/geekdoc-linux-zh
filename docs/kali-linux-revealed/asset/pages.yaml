    # 8.2. Basic Package Interaction


    Armed with a basic understanding of the APT landscape, let''s take a look at some
    basic package interactions including the initialization of APT; installation,
    removal, and purging of packages; and upgrading of the Kali Linux system. Then
    let''s venture from the command line to take a look at some graphical APT tools.'
