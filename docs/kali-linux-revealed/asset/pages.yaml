  md: 'The pkg.refresh_db command updates the package list (that is, it performs apt-get
    update) while pkg.upgrade installs all the available updates (it performs apt-get
    upgrade or apt-dist-upgrade, usually on the options received). The pkg.list upgrades
    lists the pending upgrade operations (that would be performed by the pkg.upgrade
    dist_upgrade=True command).


    The service module is an abstraction of the service manager (system in the case
    of Kali), which lets you perform all the systemctl operations: service.enable,
    service.disable, service.start, service.stop, service.restart, and service.reload:


    ```

    master# salt ''*'' service.enable ssh

    kali-scratch:

    True

    kali-master:

    True

    master# salt ''*'' service.start ssh

    kali-master:

    True

    kali-scratch:

    True

    master# salt ''*'' pkg.refresh_db

    kali-scratch:

    -------

    kali-master:

    -------

    master# salt ''*'' pkg.upgrade dist_upgrade=True

    kali-scratch:

    -------

    changes:

    -------

    base-files:

    -------

    new:

    1:2016.2.1

    old:

    1:2016.2.0

    ...]

    zaproxy:

    -------

    new:

    2.5.0-kali3

    old:

    2.4.3-kali3

    comment:

    result:

    True

    ```'
