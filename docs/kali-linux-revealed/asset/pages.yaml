  md: '# Is This Book for You?


    If you are eager to dive into the intellectually rich and incredibly fascinating
    field of information security, and have rightfully selected Kali Linux as a primary
    platform, then this book will help you in your journey. This book is written to
    help first-time Linux users, as well as current Kali users seeking to deepen their
    knowledge about the underpinnings of Kali, as well as those who have used Kali
    for years but are looking to formalize their learning, expand their use of Kali,
    and fill in gaps in their knowledge.


    In addition, this book can serve as a roadmap, technical reference, and study
    guide for those pursuing the Kali Linux Certified Professional certification.


    # General Approach and Book Structure


    This book has been designed so that you can put your hands on Kali Linux right
    from the start. You don''t have to read half of the book to get started. Every
    topic is covered in a very pragmatic manner, and the book is packed with samples
    and screenshots to help make the explanations more concrete.


    In chapter 1, "About Kali Linux" [page 2], we define some basic terminology and
    explain the purpose of Kali Linux. In chapter 2, "Getting Started with Kali Linux"
    [page 14], we guide you stepbystep from the download of the ISO to getting Kali
    Linux running on your computer. Next comes chapter 3, "Linux Fundamentals" [page
    48] which supplies the basic knowledge that you need to know about any Linux system,
    such as its architecture, installation, file system hierarchy, permissions, and
    more.


    At this point, you have been Kali Linux as live system for a while. With chapter
    4, "Installing Kali Linux" [page 66] you will learn how to make a proper Kali
    Linux installation (on your disk) and with chapter 5, "Configuring Kali Linux"
    [page 104] how to tweak it to your liking. A regular Kali user, it is time to
    get familiar with the important resources available to Kali users: chapter 6,
    "Helping Yourself and Getting Help" [page 124] gives you the keys to deal with
    the unexpected problems that you will likely face.


    With the basics well covered, the rest of the book dives into into more advanced
    topics: chapter 7, "Securing and Monitoring Kali Linux" [page 150] gives you tips
    to ensure that your Linux installation meets your security requirements. Next,
    chapter 8, "Debian Package Management" [page 170] explains how to leverage the
    full potential of the Debian packaging ecosystem. In chapter 9, "Advanced Usage"
    [page 222], you learn how to create a fully customized Kali Linux ISO image. All
    topics are even more relevant when you deploy Kali Linux at scale in an enterprise
    documented in chapter 10, "Kali Linux in the Enterprise" [page 252].'
