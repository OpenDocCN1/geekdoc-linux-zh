  md: '# Preface


    You have no idea how good you have it.


    In 1998, I was an up-and-coming hacker, co-founding one of the earliest professional
    white hat hacking teams. We were kids, really, with dream jobs, paid to break
    into some of the most secure computer systems, and buildings on the planet.


    It sounds pretty sexy, in reality, we spent most of our time hovering over a keyboard,
    armed with the digital tools of our trade. We wielded a sordid collection of programs,
    designed to map networks and locate targets; then scan, exploit, and pivot through
    them. In some cases, one of us (often Jim Chapple) would write custom tools to
    wicked things like a Class Network (something no other tool could do, at the time),
    but most often we would use or modify tools written by the hacker community. In
    those pre-Google days, we frequented BugTraq, AstLaVista, Packet Storm, w0w0w,
    SecurityFocus, X-Force, and other resources to conduct research and build our
    arsenal.


    Since we had limited time on each gig, we had to move quickly. That meant we couldn''t
    spend a lot of time fiddling with tools. It meant we had to learn the core tools
    inside and out, and keep the ancillary ones on tap, just in case. It meant we
    had to have our tools well-organized, documented, and tested so there would be
    few surprises in the field. After all, if we didn''t get in, we lost face with
    our clients and they would take our recommendations far less seriously.


    Because of this, I spent a lot of cataloging tools. When a tool was released or
    updated, I''d go through a routine. I had to figure out if it would run on the
    attack platform (some didn''t), and whether it was worthwhile (some weren''t);
    I had to update any scripts relied on it, and test it, including carrying over
    any changes made to the previous version.


    Then, I would shake out the tools and put them in directories based on their purpose
    during an assessment. I''d write wrapper scripts for certain tools, chain some
    tools together, and correlate all that into a single CD that we could take into
    sensitive areas, when customers weren''t let us take in attack machines or remove
    media from their labs.


    This process was painful, but it was necessary. We knew that we had the ability
    to break into any network—if we applied our skills and expertise properly, stayed
    organized, and worked efficiently. Although remaining undefeated was a motivator,
    it was about providing a service to clients who needed us to break into networks,
    so they could plug gaps and move toward critical-neglected information security
    programs.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'We spent sharpening our skills and expertise but we wouldn''t have been successful
    without organization and efficiency. We would have failed if we couldn''t put
    our hands on the proper tool when needed.


    That''s why I spent so much time researching, documenting, testing, and cataloging
    tools, and at the turn of the 21st Century, it was quickly becoming an overwhelming,
    full-time job. Thanks to the Internet, the worldwide attack surface exploded and
    the variety and number of tools increased exponentially, as did the workload required
    to maintain them.


    Starting in 2004, the Internet exploded not only as a foundation for business
    but also as a social platform. Computers were affordable, more consumer-friendly
    and ubiquitous. Storage technology expanded from megabytes to gigabytes. Ethernet
    jumped from hundreds of kilobytes to megabytes per second, and Internet connections
    were faster and cheaper than ever. Ecommerce was on the rise, social media sites
    like Facebook (2004) and Twitter (2006) came online and Google (1998) had matured
    to the point that anyone (including criminals) could find just anything online.


    Research became critical for teams ours because we had to keep up with new attacks
    and toolsets. We responded to more computer crimes, and forensic work demanded
    that we treat lightly as we mucked through potential evidence. The concept of
    a live CD meant we could perform forensics on a compromised machine without compromising
    evidence.


    Our little team had to keep up with all the latest attack and exploit methodologies;
    and we had to, you know, do what we paid for—penetration tests, which were in
    high demand. Things were spinning out of control, and before, we were spending
    less time in battle and much more time researching, sharpening our tools, and
    planning.


    We were not alone in this struggle. In 2004, Mati "Muts" Aharoni, a hacker and
    security professional released "WHoppix" (White Hat Knoppix), a live Linux CD
    that was the "ultimate testing live CD." it included "all the exploits from SecurityFocus,
    Packet Storm and k-otik, Metasploit Framework 2.2, and much, much."


    I remember downloading WHoppix and thinking it was a great thing to have. I downloaded
    other CDs, thinking that if I were in a real place, live CDs could save me bacon
    in the field. But I wasn''t to rely on WHoppix or any other CD for real work.
    I didn''t trust any of them to fulfill the majority of my needs; none of them
    felt right for my workflow; they were not full, installable distributions; the
    moment I downloaded them they were out of age. An aged toolset is the kiss of
    death in our industry.


    I simply added these CDs, despite their relatively massive size, to our arsenal
    and kept the painful process of maintaining our "real" toolkit.


    But despite my personal opinions at the time, and perhaps despite Muts'' expectations,
    WHoppix and its descendants had a seismic impact on his life, our industry, and
    our community.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '2005, WHOPpiX evolved into WHAX, with a expanded and updated toolset, based
    on the "more modular SLAX (Slackware) live CD." Muts and a growing team of volunteers
    from the hacker community realize that no matter how insightful they were, they
    could never anticipate the growth and fluctuation of our industry and that their
    CD would have varied needs in the field. It was obvious that Muts and his team
    were using WHAX in the field, and they seemed dedicated to making it work for
    me.


    2006, Muts Moser, and his team consolidated Auditor Security Linux and WHAX into
    a single distribution BackTrack. Still on SLAX, BackTrack continued to grow, adding
    more tools, more frameworks, extended language support, extensive wireless support,
    a menu heavily modified kernel. BackTrack became the leading security distribution,
    but many still used it as a backup for their "real tools."


    By 2009, Muts and his team had BackTrack was no longer a live CD but a full-blown
    Ubuntu-based distribution leveraging the Ubuntu software repositories. The shift
    marked a serious evolution: BackTrack 4 had an update mechanism. In Muts'' words:
    "When syncing with our BackTrack repositories, you will regularly get security
    tools updates after they are released"


    This was a turning point. The BackTrack team had tuned into the struggling pen
    testers, forensic analysts and others working in our industry. Their efforts would
    save countless hours and provide a firm foundation, allowing us to get back into
    the fight and spend more time doing the important (and fun) stuff. As a result,
    the community responded by flocking to the forums and wiki; and by pitching in
    the dev team. BackTrack was truly a community effort, with Muts still the charge.


    BackTrack 4 finally became an industrial-strength platform and I, and others like
    me, breathed with a sigh of relief. We knew firsthand the "pain and suffering"
    Muts and his team were bearing, because we had been there. As a result, many of
    us were using BackTrack as a primary foundation for our work. We, that still fiddled
    with tools, wrote our own code, and developed our own exploits and techniques;
    we researched and experimented; but we did not spend all our time collecting,
    updating, validating, and organizing tools.


    BackTrack 4 R1 and R2 were further revisions in 2010, leading to the ground-up
    rebuild of BackTrack 5 in 2011. Still based on Ubuntu, and picking up with every
    release, BackTrack was now a massive project that required a heroic volunteer
