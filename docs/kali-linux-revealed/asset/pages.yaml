    # 9.4.3. Setting Up Encrypted Persistence on a USB Key


    Live-boot is also able to handle persistent file systems. You can thus protect
    the data of your persistent directories by creating a LUKS encrypted partition
    holding the persistence data.

    The initial steps are the same as the creation of the partition but instead of
    formatting it with an ext4 file system, cryptsetup to initialize it as a LUKS
    container. Then open container and setup the ext4 file system in the same way
    as in the non-encrypted setup, instead of using the /dev/sdb3 partition, use the
    virtual partition created by cryptsetup. This virtual partition represents the
    decrypted content of the encrypted partition, which is available in /dev/mapper/kali_persistence.
    Again, ensure that you are using the correct drive and partition. In the example
    below, we will use the name kali_persistence.


    ```

    # cryptsetup --verbose --verify-passphrase luxFormat /dev/sdb3

    ```


    WARNING!

    =======

    This will overwrite data on /dev/sdb3 irrevocably.


    Are you sure? (Type uppercase yes): YES'
