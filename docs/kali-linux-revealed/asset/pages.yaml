  md: 'Before you can master Kali Linux, you must be at ease with a generic Linux
    system. Linux proficiency will serve you well, because a large percentage of web,
    email, and other Internet services run on Linux servers.


    In this section, we strive to cover the basics of Linux, but we assume that you
    already know computer systems in general, including components such as the CPU,
    RAM, motherboard, and hard disk, as well as device controllers and their associated
    connectors.


    # 3.1. What Is Linux and What Is It Doing?


    The term "Linux" is often used to refer to the entire operating system, but in
    reality, Linux is the operating system kernel, which is started by the boot loader,
