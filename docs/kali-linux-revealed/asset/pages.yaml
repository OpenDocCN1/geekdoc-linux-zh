  md: 'with the proposed OpenPGP Internet standard as described in RFC 4880.

    [...]


    You can also use dpkg to compare package version numbers with the --compare-versions
    option, which is often called by external programs, including configuration scripts
    executed by dpkg itself. This option requires three parameters: a version number,
    a comparison operator, and a second version number. The different possible operators
    are: lt (strictly less than), le (less than equal to), eq (equal), ne (not equal),
    ge (greater than equal to), and gt (strictly greater than). If the comparison
    is correct, dpkg returns 0 (success); if not, it gives a non-zero return value
    (indicating failure). Consider these comparisons:


    ```

    $ dpkg --compare-versions 1.2-3 gt 1.1-4

    $ echo $?

    0

    $ dpkg --compare-versions 1.2-3 lt 1.1-4

    $ echo $?

    1

    $ dpkg --compare-versions 2.6.0pre3-1 lt 2.6.0-1

    $ echo $?

    1

    ```


