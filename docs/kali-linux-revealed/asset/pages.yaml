  md: '# Configuring the Package Manager (apt)


    In order to be able to install additional software, APT needs to be configured
    and told where to find Debian packages. In Kali, this step is mostly non-interactive
    as we force the mirror to be http.kali. org. You just have to confirm whether
    you want to use this mirror (Figure 4.15, “Use a Network Mirror?” [page 81]).
    If you don''t use it, you won''t be able to install supplementary packages with
    apt unless you configure a package repository later.


    ![](img/f888cd88b4fb3dd45062e14ce223cc4f_106_0.png)


    Configure the package manager


    A network mirror can be used to supplement the software that is included on the
    CD-ROM. This may also make newer versions of software available.


    +   Use a network mirror?

    - No

    - Yes


