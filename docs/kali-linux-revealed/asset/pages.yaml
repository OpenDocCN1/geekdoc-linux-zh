  md: "The PGP/GPG security model is very unique. Anyone can generate any key with\
    \ any identity, but you would only trust that key if it has been signed by another\
    \ key that you already trust. When you sign a key, you certify that you are the\
    \ holder of the key and that you know the associated identity is correct. And\
    \ you define the initial set of keys that you trust, which obviously includes\
    \ your own key.\n\nThis model has its own limitations so you can opt to download\
    \ Kali's public key over HTTPS (from a keyserver) and just decide that you trust\
    \ it because its fingerprint matches what we have announced in multiple places,\
    \ including just in this book:\n\n```\n$ wget -q 0 - https://www.kali.org/archive-key.asc\
    \ | gpg --import\n[ or ]\n$ gpg --keyserver hkp://kali.gpgnu.net --recv-key ED44FF07D8D0BF6\n\
    gpg: key 0xED44FF07D8D0BF6: public key \"Kali Linux Repository <devel@kali.org>\"\
    \ngpg: Total number processed: 1\ngpg:\n imported: 1 (RSA: 1)\n[]\n$ gpg --fingerprint\
    \ 7D8D0BF6\n[...]\n```\n\nAfter you have retrieved the key, you can use it to\
    \ verify the checksums of the images. Download the file with the checksums (SHA256SUMS)\
    \ and the associated signature file (SHA256SUMS.gpg) and verify the signature:\n\
    \n```\n$ wget http://cdimage.kali.org/current/SHA256SUMS\n[...]\n$ wget http://cdimage.kali.org/current/SHA256SUMS\n\
    [...]\n$ gpg --verify SHA256SUMS.gpg SHA256SUMS\ngpg: Signature made: Thu 16 Mar\
    \ 2017 08:55:45 AM MD\ngpg: using RSA key ED44FF07D8D0BF6\ngpg: Good signature\
    \ from \"Kali Linux Repository <devel@kali.org>\"\n```\n\nIf you get \"Good signature\"\
    \ message, you can trust the content of the SHA256SUMS file and use it to verify\
    \ the files you downloaded. Otherwise, there is a problem. You should review whether\
    \ you downloaded the files from a legitimate Kali Linux.\n\nNote that you can\
    \ use the command line to verify that the downloaded file has the checksum that\
    \ is listed in SHA256SUMS, provided that the downloaded ISO is in the same directory:\n\
    \n```\n$ grep kali-linux-2017.1-amd64.iso SHA256SUMS | sha256sum -c\nkali-linux-2017.1-amd64.iso:\
    \ OK\n```\n\nIf you get not OK, then the file you have downloaded is different\
    \ from the one released by the Kali team. It cannot be trusted and should not\
    \ be used."
