    # 3.4.4. Managing Rights


    Linux is a multi-user system so it is necessary to provide a permissions system
    to control the set of authorized operations on files and directories, which includes
    all the system resources and devices (on a Unix system, any device is represented
    by a file or directory). This principle is common to all Unix-like systems.


    Each file or directory has specific permissions for three categories of users:


    +   * Its owner (symbolized by u, as in user)


    +   * Its owner group (symbolized by g, as in group), representing all the members
    of the group


    +   * The others (symbolized by o, as in other)


    Three types of rights can be combined:


    +   * reading (symbolized by r, as in read)


    +   * writing (or modifying, symbolized by w, as in write);


    +   * executing (symbolized by x, as in eExecute).


    In the case of a file, these rights are easily understood: read access allows
    reading the content (including copying), write access allows changing it, and
    execute access allows running it (which will only work if it is a program).'
