  md: '# 2.3. Summary


    In this chapter, you learned about the various Kali Linux ISO images, learned
    how to verify and download them, and learned how to create bootable USB disks
    from various operating systems. We also discussed how to boot the USB disks and
    reviewed how to configure the BIOS and startup settings on various hardware platforms
    so that the USB disks will boot.


    Summary Tips:


    +   - kali.org is the only official download site for Kali ISOs. Do not download
    them from any other site, because those could contain malware.


    +   - Always validate the sha256sum of your downloads with the sha256sum command
    to ensure the integrity of your ISO download. If it doesn''t match, try the download
    again or use a different source.


    +   - You must write the Kali Linux ISO image to a bootable media if you want
    to boot it on a physical machine, use Win32 Disk Imager on Windows, the Disk Utility
    on Linux, or the dd command on Mac OS/macOS. Be very careful when writing the
    image. Selecting the wrong disk could permanently damage data on your machine.


    +   - Configure the BIOS/UEFI setup screens on a PC or hold the Option key on
    OS X/macOS to allow the machine to boot from the USB drive.


