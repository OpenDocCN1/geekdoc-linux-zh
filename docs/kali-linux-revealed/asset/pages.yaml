    # 6.2. Kali Linux Communities


    There are many Kali Linux communities around the world using many different tools
    to communicate (forums and social networks). In this section, we will only present
    two official Kali Linux communities.


    # 6.2.1. Web Forums on forums.kali.org


    The official community forums for the Kali Linux project are located at forums.kali.org¹.
    Like every-based forum, you must create an account to be able to post and the
    system remembers what posts you have already seen, making it easy to follow conversations
    on a regular basis.

    Before posting, you should read the forum rules:


    ```

    http://docs.kali.org/community/kali-linux-community-forums

    ```


    We won''t copy them here but it is worth noting that you are not allowed to speak
    about illegal activities such as breaking into other people''s networks. You must
    be respectful of other community members so as to create a welcoming community.
    Advertising is banned and off-topic discussions are avoided. There are enough
    categories to cover everything you would like to discuss about Kali Linux.


    # 6.2.2. #kali-linux IRC Channel on Freenode


    IRC is a real-time chat system. Discussions happen in chat rooms that are called
    channels and are usually centered around a particular topic or community. The
    Kali Linux project uses the #kali-channel on the Freenode² (you can use chat.freencode.net
    as IRC server, on port 6667 for a TLS-encrypted connection or port 6666 for a
    clear-text connection).


    > ¹http://forums.kali.org


    > ²http://www.freencode.net'
