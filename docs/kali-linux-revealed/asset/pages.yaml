    # 11.2.4. Application Assessment


    While most assessments have a broad scope, an application assessment is a specialty
    that is narrowly focused on a single application. These sorts of assessments are
    becoming more common due to the complexity of mission-critical applications that
    organizations use, many of which are built in-house. An application assessment
    is usually added to a broader assessment, as required. Applications that may be
    assessed in this manner, but are not limited to:


    +   - Web applications: The most common externally-facing attacking surface, web
    applications make great targets simply because they are accessible. Often, standard
    assessments find basic problems in web applications, however a more focused review
    is often worth the time to identify issues relating to the workflow of the application.
    The kali-linux-web-meta-package has a number of tools to help with these assessments.

    - Compiled desktop applications: Server software is not the only target; desktop
    applications make also a wonderful attack surface. In years past, many desktop
    applications such as


