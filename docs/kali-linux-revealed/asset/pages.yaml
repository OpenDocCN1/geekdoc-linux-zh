  md: 'at the specified URL. But in the most common case, the repositories will be
    structured like a Debian mirror, with multiple distributions having multiple components.
    In those cases, name the chosen distribution, then the components (or sections)
    to enable. Let''s take a moment to introduce these sections.


    Debian and Kali use three sections to differentiate packages according to the
    licenses chosen by the authors of each work.


    Main contains all packages that fully comply with the Debian Free Software Guidelines¹.


    The non-free archive is different because it contains software that does not (entirely)
    conform to these principles but can nevertheless be distributed without restrictions.


    Contrib (contributions) is a set of open source software that cannot function
    without some non-free elements. These elements may include software from the non-free
    section or non-free files such as game ROMs, BIOS of consoles, etc. Contrib also
    includes free software whose compilation requires proprietary elements, such as
    VirtualBox, which requires a non-free compiler to build some of its files.


    Now, let''s take a look at the standard Kali Linux package sources, or repositories.


    # 8.1.3. Kali Repositories


    A standard sources.list file for a system running Kali refers to one repository
    (kali-rolling) and the three previously mentioned components: main, contrib, and
    non-free:


    ```

    # Main Kali repository

    deb http://http.kali.org/kali kali-rolling main contrib non-free

    ```


    Let''s take a look at the various Kali repositories.


    # The Kali-Rolling Repository


    This is the main repository for end-users. It should always contain installable
    and recent packages. It is managed by a tool that merges Debian Testing and the
    Kali-specific packages in a way that ensures each package''s dependencies can
    be satisfied within kali-rolling. In other words, barring you by maintainer scripts,
    all packages should be installable.


    Since Debian Testing evolves daily, so is Kali Rolling. The Kali-specific packages
    are also regularly updated as we monitor the upstream releases of the most important
    packages.


    > ¹https://www.debian.org/social_contract#guidelines'
