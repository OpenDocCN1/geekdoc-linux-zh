- img_proc: true
  md: '# 11.4.1. Denial of Service


    Denial of service attacks leverage a vulnerability to create a loss of service,
    often by crashing the vulnerable process. The Stress Testing category of the Kali
    Linux menu contains a number of tools for this purpose.


    When many people hear the term "denial of service attack", they immediately think
    of resource consumption attacks that are sent out from multiple sources at once
    against a single target. This would be a distributed denial of service attacks,
    DDoS. These sorts of attacks are rarely part of a professional security assessment.


    Instead, a singular denial of service attack is most often the result of an improper
    attempt to exploit a vulnerability. If an exploit writer releases partially functional,
    or proof-of-concept (PoC) code and is used in the field, this could create a denial
    of service. Even properly-coded code may only work under very specific circumstances
    but cause a denial of service under lesser circumstances. It may seem that the
    solution is to only safe and tested code, or to write your own. Even with this
    solution, there are no guarantees and this severely limits the assessor, causing
    undue constraints, and results in a looser assessment. Instead, the key is to
    compromise. Avoid PoC code and untested exploits in the field and always make
    you have a lawyer covered for other mishaps


    Typically, denial of service attacks are not launched intentionally. Most automated
    vulnerability tools will clear denial of service vulnerabilities as lower risk
    due to the fact that they remove a service from operation, that service cannot
    be exploited for code execution. However, it is important to remember that not
    all exploits are released publicly and a denial of service vulnerability may mask
    a deeper, more serious threat. A code execution for a known denial of service
    may exist but not be public. The point is, pay attention to denial of service
    vulnerabilities and encourage your customer to get them patched regardless of
    their (often low) threat rating.


    # 11.4.2. Memory Corruption


    Memory corruption happens when a location within the memory space of a process
    is accidentally modified by programming mistakes. Memory corruption bugs usually
    lead to unpredictable program behavior, however in many cases, these bugs allow
    process manipulation in such a way that the program execution flow can be controlled,
    allowing attacker-defined activity.


    These attacks are typically referred to as buffer overflows, although this is
    an oversimplification. The most common types of memory corruption are vastly different
    from one another and have their own tactics and techniques required for successful
    exploitation.


    +   * Stack Buffer Overflow: When a program writes more data to a buffer on the
    stack than there is space available for it, adjacent memory can be corrupted,
    often causing the program to crash.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '+   • Heap Corruption: Heap memory is allocated at run- time and usually contains
    data from the running program. Heap corruptions occur by manipulating the data
    to overwrite through the linked list of heap memory pointers.


    +   • Integer Overflow: These overflows occur when an application tries to create
    a numeric value that can''t be contained within its allocated storage space.


    +   • Format String: When a program accepts user input and formats it without
    checking it, memory locations can be revealed or overwritten, depending on the
    format that they are used.


    # 11.4.3. Web Vulnerabilities


    Due to the fact that modern websites are no longer static pages, but instead dynamically
    generated for the user, the average website is quite complex. Web vulnerabilities
    take advantage of this complexity in an effort to attack either the back page
    logic or the presentation to the visitor of the site.


    These sorts of attacks are extremely common, as many organizations have reached
    the point where they have very few facing services. Two of the most prevalent
    web application attack types³¹ are SQL injection and cross-site scripting (XSS).


    +   • SQL injection: These attacks take advantage of improperly-programmed applications
    that do not sanitize user input, leading to the ability to extract information
    from the database or even the complete takeover of the server.


    +   • Cross-site scripting: As SQL injection, XSS attacks result from improper
    sanitization of user input, allowing attackers to manipulate the user or site
    into executing code in the context of their browser session.


    Complex, rich, and complicated web applications are very common, presenting a
    welcome attack surface for malicious parties. You will find a large number of
    useful tools in the Web Application Analysis category and the kali-linux-web metapackage.


    # 11.4.4. Password Attacks


    Password attacks are attacks against the authentication system of a service. These
    attacks are often broken into online password attacks and offline password attacks,
    which you will find reflected in the Password Attacks category. In an online password
    attack, multiple passwords are attempted against a running system. In an offline
    password attack, the hashed or encrypted values of the passwords are obtained
    and the attacker to obtain the clear text values. The protection against this
    sort of attack is the fact that it is computationally expensive to work through
    this process, limiting the number of attempts per second you can generate.


    > ³¹ https://www.owasp.org/index.php/Top_10_2013-Top_10'
  merge: -1
  pgno: 321
- img_proc: true
  md: 'workarounds for this do exist, such as graphic processor units (GPUs) to accelerate
    the number of attempts that can be made. The kali-linux-gpu metapackage contains
    a number of tools that tap into this power.


    Most commonly, password attacks target vendor-supplied passwords. As these are
    wellknown values, attackers will scan for these default accounts, hoping to get
    lucky. Other common attacks include custom dictionary attacks where a wordlist
    is created that has been tailored to the target environment and then an online
    password attack against common, default, or known accounts is conducted where
    each word is attempted in sequence.


    In an assessment, it is very important to understand the potential consequences
    of this sort of attack. First, they are often very noisy due to the repeated authentication
    attempts. Secondly, these attacks can often result in an account lock out situation
    after too many invalid attempts are performed against a single account. Finally,
    the performance of these attacks is quite slow, resulting in difficulty when attempting
    to use a comprehensive wordlist.


    # 11.4.5. Client-Side Attacks


    Most attacks are conducted against servers, but as services have become harder
    to attack, easier targets have been selected. Client-side attacks are a result
    of this, where an attacker will target the various applications installed on the
    workstation of an employee within a target organization. The Social Engineering
    Tools menu has a number of excellent applications that can help conduct these
    types of attacks.


    This sort of attack is best exploited by the Flash, Acrobat Reader, and Java attacks
    that were very common in the early 2000s. In these cases, attackers would try
    to solicit a visit to a malicious web page. These pages would contain specialized
    code that would trigger vulnerabilities in these client-side applications, resulting
    in the ability to run malicious code on the targets system.


    Client-side attacks are incredibly difficult to prevent, requiring a great deal
    of user education, constant application updates, and network controls to effectively
    mitigate the risk.


    # 11.5. Summary


    In this chapter, we take a brief look at Kali''s role in the field of information
    security. We discussed the importance of a clean, working installation and the
    use of encryption before heading out to the field to protect your client''s information,
    and the importance of legal representation to protect you and your client''s interests.


    The components of the CIA (confidentiality, integrity, availability) triad are
    the primary items that you will focus on securing a system as part of standard
    deployment, maintenance, or assessment. This conceptual foundation will assist
    you with the identification of the critical com-'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'ponents of your systems and the amount of effort and resources worth investing
    in correcting identified problems.


    We discussed several types of vulnerabilities including file inclusion, SQL injection,
    buffer overflows, and race conditions.


    The accuracy of the signatures is extremely important to get useful vulnerability
    assessment results. The more data that are provided, the higher chance there is
    to have accurate results from an automated signature-based scan, which is why
    authenticated scans are so popular.


    Since automated tools use a database of signatures to detect vulnerabilities,
    any slight deviation from a known signature can alter the result and the likelihood
    of the perceived vulnerability.

    We also discussed four types of assessments: the vulnerability assessment, compliance
    test, traditional penetration test, and the application assessment. Even though
    each type of assessment leverages a core set of tools, many of the tools and techniques
    overlap.


    The vulnerability assessment is relatively simple in comparison to the other assessment
    types and often consists of an automated inventory of discovered issues within
    a target environment. In this section, we discussed that a vulnerability is a
    flaw that, exploited, will compromise the confidentiality, integrity, or accuracy
    of an information system. Since it is signature-based, this type of assessment
    relies on accurate signatures and can present false positives and negatives. We
    will find the core tools for this type of assessment in the Vulnerability Analysis
    and Exploitation Tools categories of Kali Linux.


    Compliance tests are based on government- and industry-mandated requirements (such
    as DSS, DSA STIG, and FISMA), which are in turn based on a compliance framework.
    This test usually begins with a vulnerability assessment.


    A traditional penetration test is a thorough security assessment designed to improve
    the overall security posture of an organization based on certain real-world threats.
    This type of test involves several steps (mirrored by the Kali Linux menu structure)
    and culminates in exploitation of vulnerabilities and pivoting to other machines
    and networks within the target scope.


    Application assessments (usually white- or black-box) focus on a single application
    and use specialized tools as those found in the Web Application Analysis, Database
    Assessment, Reverse Engineering, and Exploitation Tools menu categories.


    Several types of attacks were discussed including: denial of service, which breaks
    the behavior of an application and makes it inaccessible; memory corruption, which
    leads to manipulation of process, often allowing an attacker to code execution;
    web attacks, which attack web services using techniques like SQL injection and
    XSS attacks; and password attacks, which often leverage password lists to attack
    service credentials.'
