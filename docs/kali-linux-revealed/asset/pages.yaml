  md: '# 5.5. Summary


    In this chapter, we learned how to configure Kali Linux. We configured network
    settings, talked about users and groups, and discussed how to create and modify
    user accounts, set passwords, disable accounts, and manage groups. Finally, we
    discussed services and explained how to set up and maintain generic services,
    specifically SSH, PostgreSQL, and Apache.


    Summary Tips:


    +   * In a typical desktop installation, you will have NetworkManager already
    installed and it can be controlled and configured through GNOME''s control center
    and through the top-right menu.


    +   * You can configure the network from the command line with ifup and ifdown
    tools, which read their instructions from the /etc/network/Interfaces configuration
    file. An even newer tool, systemd-networkd works with the systemd init system.


    +   * By default, the shadow of users consists of the textual files /etc/passwd
    (list of users), /etc/shadow (encrypted passwords of users), /etc/group (list
    of groups), and /etc/gshadow (encrypted passwords of groups).


    +   * You can use the getent command to control the user database and other system
    databases.


    +   * Theadduser command asks a few questions before creating the account, which
    is a straight-forward way to create a new user account.


    +   * Several commands can be used to modify specific fields in the user database
    including: passwd (change password), chfn (change full name and the GECOS, general
    information field), chsh (change login shell), chage (change password age), and
    passwd -e user (forces the user to change their password the next time they log
    in).


    +   * Each user can be a member of one or multiple groups. Several commands can
    be used to modify user identity: newgrp the current group ID, sg executes a command
    using the supplied alternate group, the setgid bit be placed on a device created
    in that directory to automatically belong to the correct group. In addition, the
    id command displays the current state of a user using a list of group membership.


    +   * You can manually start SSH with systemctl start ssh or permanently enable
    it with systemctl enable ssh. The default configuration disables password-based
    logins for the root user, which you must first setup SSH keys with ssh-keygen.


    +   * PostgreSQL is a database server. It is rarely useful on its own but is used
    by many others to store data.


    +   * A Kali Linux installation includes the Apache web server, provided by the
    apache2 package. Being a network service, it is disabled by default. You can manually
    start it with systemctl start apache2.'
