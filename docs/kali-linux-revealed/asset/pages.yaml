  md: '# The Administrator Password


    The root user''s password should be long (eight characters or more) and impossible
    to guess, attackers target Internet-connected computers and servers with automated
    tools, attempting to log in with obvious passwords. Sometimes attackers leverage
    dictionary attacks, using many combinations of words and passwords. Using the
    names of children or parents and dates of birth, because these are easily guessed.


    These remarks are equally applicable to other user passwords but the consequences
    of a compromised account are less drastic for users without administrative rights.


    If you are lacking inspiration, don''t hesitate to use a password generator, such
    as pwgen (found in the package of the same name, which is already included in
    the base Kali installation).


    # Configuring the Clock


    If the network is available, the system''s internal clock will be updated from
    a network time protocol (NTP) server. This is beneficial because it ensures timestamps
    on logs will be correct from the first boot.


    If your country spans multiple timezones, you will be asked to select the timezone
    that you want to use, as shown in Figure 4.7, “tzone Selection” [page 73].


