- img_proc: true
  md: 'In some cases, a vulnerability will only exist on a specific architecture,
    so knowing this bit information can be critical for an accurate signature.


    +   - Software Version: The version of the targeted software is one of the basic
    items that need to be captured to identify a vulnerability.


    These, and other data points, will be used to make up a signature as part of a
    vulnerability scan. As expected, the more data points that match, the more accurate
    the signature will be. When dealing with signature matches, you can have a few
    different potential results:


    +   - True Positive: The signature is matched and it captures a true vulnerability.
    These results are the ones you need to follow up on and correct, as they are the
    items that malicious individuals can take advantage of to hurt your organization
    (or your client''s).


    +   - False Positive: The signature is matched; however the detected issue is
    not a true vulnerability. In an instance, these are often considered noise and
    can be quite frustrating. You never want to dismiss a true positive as a false
    positive without more extensive validation.


    +   - True Negative: The signature is not matched and there is no vulnerability.
    This is the ideal scenario, verifying that a vulnerability does not exist on a
    target.


    +   - False Negative: The signature is not matched but there is an existing vulnerability.
    As bad as a false positive, a false negative is quite messy. In this case, problem
    exists but the scanner did not detect it, you have no indication of its existence.


    As you can imagine, the accuracy of the signatures is extremely important for
    accurate results. The more data that are, the greater the chance there is to have
    accurate results from an automated signature-based scan, which is why authenticated
    scans are so so.


    With an authenticated scan, the scanning software will use credentials to authenticate
    the target. This provides a deeper level of visibility into a target than otherwise
    be possible. For instance, on a normal scan you may only detect information about
    the system that can be derived from listening services and the functionality they
    provide. This can be a bit of information sometimes it can''t compete with the
    level and depth of data that will be obtained if you authenticate to the system
    and comprehensively review all installed software, applied patches, running processes,
    and so on. This breadth of data is useful for detecting vulnerabilities that might
    not have been discovered.


    A well-conducted vulnerability assessment presents a snapshot of problems in an
    organization and provides metrics to measure change over time. This is a fairly
    lightweight assessment, but even still, many organizations will regularly perform
    automated vulnerability scans in off-hours to avoid potential problems during
    the day when service availability and bandwidth are most critical.


    As previously mentioned, a vulnerability scan will check check many different
    data points in order to get all these checks can create load on the target system
    as well as consume bandwidth. Unfortunately, it is difficult to know exactly how
    many resources will be consumed on the target as it depends on the number of open
    services and the types of'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'checks that would be associated with those services. This is the cost of doing
    a scan; it is going to occupy system resources. Having a general idea of the resources
    that will be consumed and how much load the target system can take is important
    when running these tools.


    # Scanning Threads


    Most vulnerability scanners include an option to set threads per scan, which equates
    to the number of concurrent checks that occur at one time. Increasing this will
    have a direct impact on the load on the assessment platform as well as the networks
    and targets you are interacting with. This is important to keep in mind as you
    use these scanners. It is tempting to increase the threads in order to complete
    scans faster but remember the substantial load increase with doing so.


    When a vulnerability scan is finished, the discovered issues are typically linked
    back to industry standard identifiers such as CVE number⁹ EDB-ID¹, and vendor
    advisories. This information, along with the vulnerabilities CVSS score¹¹, is
    used to determine a risk rating. Along with false negatives (and false positives),
    these arbitrary risk ratings are common issues that need to be considered when
    analyzing the scan.


    Since automated tools use a database of signatures to detect vulnerabilities,
    any slight deviation from a known signature can alter the validity of the perceived
    vulnerability. A false positive incorrectly flags a vulnerability that does not
    exist, while a false negative is effectively linked to a vulnerability and does
    not report it. Because of this, a scanner is often said to only be as good as
    its signature rule base. For this reason, many vendors provide multiple signature
    sets: one might be free to home users and another fairly expensive set that is
    more comprehensive, which is generally sold to corporate customers.


    The other issue is that often encountered with vulnerability scans is the validity
    of the suggested risk ratings. These risk ratings are defined on a generic basis,
    considering many different factors such as privilege level, type of software,
    and pre- or post-authentication. Depending on your environment, these ratings
    may or may not be applicable so they should not be accepted blindly. Only those
    well-versed in the systems and the vulnerabilities can properly validate risk
    ratings.


    While there is no universally defined agreement on risk ratings, NIST Special
    publication 800-30¹² is recommended as a baseline for evaluation of risk ratings
    and their accuracy in your environment. NIST SP 800-30 defines the true risk of
    a discovered vulnerability as a combination of the likelihood of occurrence and
    the potential impact.


    > ⁹https://cve.mitre.org

    ¹⁰https://www.exploit-db.com/about/

    ¹¹https://www.first.org/cvss

    ¹²https://csrc.nist.gov/publications/PubsSps.html#800-30'
