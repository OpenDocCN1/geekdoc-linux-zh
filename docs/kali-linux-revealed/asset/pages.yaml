  md: '# 10.2. Leveraging Configuration Management


    With the ability to install Kali on multiple computers very quickly, you will
    need some help in managing those machines post-installation. You can leverage
    configuration management tools to manage or configure replacement computers to
    any desired state.


    Kali Linux contains many popular configuration management tools that you might
    want to use (ansible, chef, puppet, saltstack, etc.) but in this section, we will
    only cover SaltStack.


    +   => https://saltstack.com


    # 10.1. Setting Up SaltStack


    SaltStack is a centralized configuration management service: a salt master manages
    many salt minions. You should install the salt-master package on a server that
    is reachable by all the hosts you want to manage and salt-minion on the hosts
    you wish to manage. Each minion must be told where to find their master. Simply
    edit /etc/salt/minion and set the master key to the Salt master. Note that Salt
    uses YAML for its configuration.


    ```

    minion# vim /etc/salt/minion

    minion# grep master /etc/salt/minion

    master# 192.168.122.105

    ```


    Each minion has a unique identifier stored in /etc/salt/minion_id, which defaults
    to its hostname. This minion identifier will be used in the configuration rules
    and as such, it is important to set it properly before the minion opens its connection
    to the master:


    ```

    minion# echo kali-scratch >/etc/salt/minion_id

    minion# systemctl enable salt-minion

    minion# systemctl start salt-minion

    ```


    When the salt-minion service is running, it will try to connect to the Salt master
    to exchange some cryptographic keys. On the master side, you have to accept the
    key that the minion is using to identify let the connection proceed. Subsequent
    connections will be:


    ```

    master# systemctl enable salt-master

    master# systemctl start salt-master

    master# salt-key --list all

    Accepted Keys:

    Denied Keys:

    accepted Keys:

    kali-scratch

    Rejected Keys:

    master# salt-key --accept kali-scratch

    The following keys are going to be:

    ```'
