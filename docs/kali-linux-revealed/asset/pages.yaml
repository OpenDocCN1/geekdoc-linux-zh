    # Reinstalling Packages with --reinstall and aptitude


    When you mistakenly damaged your system by removing or modifying certain files,
    the easiest way to restore them is to reinstall the affected package. Unfortunately,
    the packaging system finds that the package is already installed and politely
    refuses to reinstall it. To avoid this, you would use the --reinstall option of
    apt and apt-get commands. The following command reinstalls postfix if it is already
    present:


    ```

    # apt --reinstall install postfix

    ```


    The aptitude command line is slightly different but achieves the same result with
    aptitude reinstall postfix. The dpkg command does not prevent-reinstallation,
    and it is rarely called directly.


    > Do Not Use apt --reinstall to Recover from an Attack Using apt --reinstall to
    restore packages modified during an attack will certainly not recover the system
    as it was.


    After an attack, you can''t rely on: dpkg and apt might have been replaced by
    malicious programs, not reinstalling the files as you like them to. The attacker
    might have altered or created files outside the control of dpkg.


    Remember that you can specify a distribution with apt as well, which means you
    can roll back to an older version of a package (for instance you know that it
    works), provided that it is still available in one of the sources referenced by
    the sources .list file:


    ```

    # apt install w3af/kali-rolling

    ```


