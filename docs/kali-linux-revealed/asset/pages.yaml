    In 2015, when Debian 8 "Jessie" came out, we worked to rebase Kali Linux on top
    of it. While Kali Linux 1.x avoided the GNOME Shell (relying on GNOME Fallback),
    in this version we decided to embrace and enhance it: we added some GNOME Shell
