    # The Bootable USB Drive from the Command Line


    Even though the graphical process is fairly straightforward, the operation is
    just easy for command line users.

    When you insert your USB, the Linux kernel will detect and assign it a name, which
    is printed in the kernel logs. You can find its name by inspecting the logs returned
    by dmesg.


    ```

    $ dmesg

    [234473.980134] sdb 1:1:2: New high-speed USB device number 6 using ehci-pci

    [234473.980764] sdb 1:1:2: New USB device found, vendor=0bec, product=0920

    [234473.980771] sdb 1:1:2: New USB device strings: Mif=1, Product=

    [234473.990741] sdb 1:1:2: Product: Store''ngo

    [234473.990777] sdb 1:1:2: Manufacturer: Verbatim

    [234473.990780] sdb 1:1:2: SerialNumber: 0390627052AF2FB97

    [234473.990217] scsi 7:0:0:sdb-usb storage device 1-2.2.1:0

    [234473.993818] scsi 7:0:0: Direct-Access

    [234473.994245] sdb 7:0:0: Attached generic scsi logical type 0 6.51

    [234473.994699] sdb 7:0:0: [sdb] 390347 512 blocks: (2.00 GB (1.8 GiB))

    [234473.996663] sdb 7:0:0: [sdb] Write Protect is off

    [234473.996699] sdb 7:0:0: Mode Sensor: 45 00 00 08

    [234473.997518] sdb 7:0:0: [sdb] No Caching mode page found

    [234473.997524] sdb 7:0:0: [sdb] Assuming drive cache: write speed

    [234473.998075] sdb 7:0:0: [sdb] ready

    [234473.015113] sdb 7:0:0: [sdb] Attached SCSI removable device

    ```


    Now that you know the USB key is /dev/sdb, you can proceed to copy the image with
    the dd command:


    ```

    # dd if=kali-linux-light-2017.1-amd64.iso of=/dev/sdb

    207078440 records in

    207078440 records out

    1060241408 bytes (1 GB, 1021 MiB) copied, 3.2 MB/s

    ```


    Note that you need root permissions for this operation to succeed and you should
    also ensure that the USB key is used. In that, you should make sure that none
    of your partitions are mounted. The command also ensures that it is run in the
    directory hosting the ISO, otherwise the full path will need to be provided.'
  merge: -1
