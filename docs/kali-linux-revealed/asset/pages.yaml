  md: 'Let''s discuss the configuration files and see how they interact. In general,
    the postinst script is executed prior to installation of the package, Likewise,
    premrm invoked before removal of a package and postrm afterwards. An update of
    a package is equivalent to removal of the previous version and installation of
    the new one. It is not possible to describe in detail all the possible scenarios
    here we will discuss the most common two: an installation/removal and a remote.


    These sequences can be quite confusing, but a visual representation may help.
    Manoj Srivastava made these diagrams explaining how the configuration scripts
    are called by dpkg. Similar diagrams have also been developed by the Debian Women
    project; they are a bit simpler to understand, but less complete.


    +   - https://people.debian.org/~srivasta/MaintainerScripts


    +   - https://wiki.debian.org/MaintainerScripts


    | Symbolic Names of the Scripts | The sequences described in this section call
    configuration scripts by specific names, such as old-prem or new-postinst. They
    are, respectively, the premrm script contained in the old version of the package
    (installed before the update) and the postinst script contained in the new version
    (installed after the update). |


    # Installation and Upgrade Script Sequence


    Here is what happens during an installation (or an update):


    +   1. For an update, dpkg calls the old-prem upgrade new-version.


    +   2. Still for an update, dpkg then executes new-preinst upgrade old-version;
    for a first installation, it executes new-preinst install. It may add the old
    version in the last parameter if the package has already been installed and removed
    (but not purged, the configuration files having been retained).


    +   3. The new package files are then unpacked. If a file already exists, it is
    replaced, by a backup copy is made and temporarily stored.


    +   4. For an update, dpkg executes old-postrm upgrade new-version.


    +   5. dpkg updates all of the internal data (file list, configuration scripts,
    etc.) and removes the backups of the replaced files. This is the point of no return:
    dpkg no longer has access to all of the elements necessary to return to the previous
    state.


    +   6. dpkg updates the configuration files, prompting you to decide if it is
    unable to automatically manage this task. The details of this procedure are discussed
    in section 8.4.3, "Checks, Confiles" [page 214].


    +   7. Finally, dpkg configures the package by executing new-postinst configure
    last-version-configured.'
  merge: -1
