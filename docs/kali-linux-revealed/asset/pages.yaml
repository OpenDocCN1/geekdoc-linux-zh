  md: 'To join the discussions on IRC, you have to use an IRC client such as hexchat
    (in graphical mode) or irssi (in console mode). There is also a web-based client
    available on webchat.freencode.net.


    While it is really easy to join the conversation, you should be aware that IRC
    channels have their own rules and that there are operators (their nickname is
    prefixed with @) who can enforce the rules: they can kick you out of the channel
    (or even if you continue to disobey the rules). The #kali-linux channel is no
    exception. The rules have been documented here:


    ```

    http://docs.kali.org/community/kali-linux-irc-channel

    ```


    To summarize the rules: you have to be tolerant, lenient, and reasonable. Avoid
    off-topic discussions. In particular, discussions about illegal activities, wreaks/cracks/pirated
    software, and religions are forbidden. Keep in mind that your IP address will
    be available to others.


    If you want to ask for help, follow the recommendations listed in "How to Avoid
    RTFM Answers" [page 124]: do your research and share the results. When you are
    asked for supplementary information, please provide it accurately (if you provide
    some verbose output, don''t paste it in the channel directly, instead use a service
    like Pastebin and post only the Pastebin URL).


    Do not expect an immediate answer. Even though IRC is a real-time communication
    platform, participants log in from all over the world, so time zones and work
    schedules vary. It may take a few minutes or hours for someone to respond to your
    question. However, when others include your nickname in a reply, your will be
    highlighted and most IRC clients will notify you, so leave your client connected
    and patient.


    # 6.3. Filing a Good Report


    If all of your efforts to resolve a problem fail, it is possible that the problem
    is due to a bug in the program. You can search for bug reports to find a solution
    to your bug report but let''s take a look at the procedure of reporting a bug
    to Kali, Debian, or to the upstream developers so you understand the process you
    should need to submit your report.


    The goal of a bug report is to provide enough information so that the developers
    or maintainers of the (supposedly) faulty can reproduce the problem, debug its
    behavior, and develop a fix. This means that your bug report must contain appropriate
    information and must be directed to the correct person or project team. The report
    must also be well-written and thorough, ensuring a faster response.


    The exact procedure for the bug report will vary depending on where you will submit
    the report (Kali, Debian, upstream developers) but there are generic recommendations
    that apply to all cases. In this chapter we will discuss these recommendations.


