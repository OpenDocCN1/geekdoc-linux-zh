    Figure 4.4 Choice of Keyboard


    # Detecting Hardware


    In the vast majority of cases, the hardware detection step is completely automatic.
    The installer detects your hardware and tries to identify the boot device used
    in order to access its content. It loads the modules corresponding to the various
    hardware components detected and mounts the boot device in order to read it. The
    previous steps were completely contained in the boot image included in the boot
    device, a file of limited size and loaded into memory by the bootloader booting
    from the boot device.


    # Loading Components


    With the contents of the boot device now available, the installer loads all the
    files necessary to continue with its work. This includes additional drivers for
    the remaining hardware (especially the network card), as well as all the components
    of the installation program.'
