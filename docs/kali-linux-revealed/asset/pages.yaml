  md: "So far, we have seen that Kali is an extremely capable and secure Debian derivative\
    \ providing-strength security and encryption features, advanced package management,\
    \ multi-platform capability, and (what it is most-known for) an arsenal of world-class\
    \ tools for the security professional. What might not be obvious is how Kali scales\
    \ beyond the desktop to medium or large scale deployments beyond the desktop,\
    \ providing centralized management and enterprise-level control over multiple\
    \ Kali installations. In this chapter, we will show you how Kali can scale beyond\
    \ the enterprise. In short, reading this chapter you will be able to quickly deploy\
    \ secure Kali systems preconfigured for your needs and keep them synchronized\
    \ thanks to Kali’s (semi-automatic) installation of package updates.\n\nThis level\
    \ of scale requires several steps, including initiating a PXE network boot, use\
    \ of an advanced configuration management tool (SaltStack), the ability to fork\
    \ and customize packages, and the deployment of a package repository. We will\
    \ cover each step in detail, show you how to get the “heavy lifting” out of the\
    \ way, and deploy, manage, and maintain multitudes of custom Kali Linux installations\
    \ with relative ease. As if that were not enough, we will throw in a crowd of\
    \ minions to assist in running your empire.\n\n# 10.1. Installing Kali Linux Over\
    \ the Network (PXE Boot)\n\nAs we have seen in previous chapters, the basic Kali\
    \ Linux installation process is straightforward once you know your way around.\
    \ But if you need to install Kali on multiple machines, the standard setup can\
    \ be quite tedious. Frankly, you can start the Kali installation procedure by\
    \ booting a computer over the network. This allows you to install Kali quickly\
    \ and easily on many machines at a time.\n\nFirst, you will need to boot your\
    \ target machine from the network. This is facilitated by the Pre Execution Environment\
    \ (PXE), a client/server interface designed to boot any networked machine from\
    \ the network even if it does not have an operating system installed. Setting\
    \ up PXE network boot requires that you configure at least a trivial file transfer\
    \ protocol (TFTP) server and a DHCP/BOOT server. You will also need a web server\
    \ if you want to host a “deb” file that will be automatically used in the installation\
    \ process.\n\nFortunatelyately, dnsmasq handles both DHCP and TFTP so that you\
    \ can run on a single service to set up everything you need. And the Apache server\
    \ is installed (not enabled) by default on Kali systems.\n\n| Separate DHCP and\
    \ TFTP daemons | For complex setups, dnsmasq’s feature set might be too limited\
    \ or you might want to enable PXE booting on your main network that already runs\
    \ a DHCP daemon. In both cases, you will then need to configure separate DHCP\
    \ and TFTP daemons. \n The Debian installation manual covers the setup of isc-dhcp-server\
    \ and tftpd-hpa for PXE booting. |\n\n+   * https://www.debian.org/releases/stable/amd64/ch04s5.html"
