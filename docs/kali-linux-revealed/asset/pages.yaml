  md: 'Kali Linux³ is an enterprise-ready security auditing Linux distribution based
    on Debian GNU/Linux. Kali is aimed at security professionals and IT administrators,
    enabling them to conduct advanced penetration testing, forensic analysis, and
    security auditing.


    # What is a Linux Distribution?


    Although it is commonly used as a name for the kernel, a piece of software that
    handles interactions between the hardware and end-user applications.


    The expression Linux distribution, on the other hand, refers to a complete operating
    system built on top of the Linux kernel, usually including an installation program
    and many applications, which are either pre-installed or installed in an easily
    stable way.


    Debian GNU² is a leading generic Linux distribution, known for its quality and
    stability. Kali builds on the work of the Debian project and adds over 300 specialpurpose
    packages of it, all related to information security, particularly the field of
    penetration testing.


    Debian is a free software project providing multiple versions of its operating
    system and we often use the term distribution to refer to a specific version of
    it, for example the Debian Stable or Debian Testing distributions. The same also
    applies to Kali Linux—with the Kali Rolling distribution, for example.


    ![](img/f888cd88b4fb3dd45062e14ce223cc4f_27_0.png)


    # 1.1. A Bit of History


    The Kali project began quietly in 2012, when Offensive Security decided that they
    wanted to replace their venerable BackTrack Linux project, which was manually
    maintained, with something that could become a genuine Debian derivative³, complete
    with all of the required infrastructure and improved packaging techniques. The
    decision was made to build Kali on top of the Debian distribution because it is
    well known for its quality, stability, and wide selection of available software.
    That is why I (Raphaël) got involved in this project, as a Debian consultant.


    The first release (version 1.0) happened one year later, in March 2013, and was
    based on Debian “Wheeezy”, Debian’s stable distribution at the time. In that first
    year of development, we packed hundreds of pen-testing-related applications and
    built the infrastructure. Even though the number of applications is significant,
    the application list has been meticulously curated, dropping applications that
    no longer worked or duplicated features already available in better programs.


    During the two years following version 1.0, Kali released many incremental updates,
    expanding the range of available applications and improving hardware support,
    thanks to newer kernel releases. With sustained investment in continuous improvement...


    +   ¹ https://www.kali.org

    ² https://www.debian.org

    ³ https://wiki.debian.org/Derivatives/Census'
