  md: '# Foreword


    The sixteen high-end laptops ordered for your pentesting team just arrived, and
    you have been tasked to set them up—tomorrow''s offsite engagement. You install
    Kali and boot up one of the laptops only to find that it is barely usable. Despite
    Kali''s cutting-edge kernel, the network cards and mouse aren''t working, the
    hề NVIDIA graphics card and GPU are staring at you blankly, because they lack
    properly installed drivers.


    In Kali Live mode, you quickly type lspci into a convolve, then you scroll through
    the hardware listing: PCI bridge, USB controller, SATA controller. Ahal Ethernet
    and Network controllers. A quick Google search for their respective model numbers,
    cross referenced with the Kali kernel version, reveals that these cutting-edge
    drivers haven''t reached the mainline kernel yet.


    But all is not lost. A plan is slowly formulating in your head, and you thank
    the heavens for the Kali Revealed book that you picked up a couple of weeks ago.
    You could use the Kali LiveBuild to create a custom Kali ISO, which would have
    the needed drivers baked into the installation media. In addition, you could include
    the NVIDIA graphics drivers as well as the CUDA libraries needed to get that beat
    of a GPU to talk nicely to hashcat, and have it purr while cracking passwords
    at blistering speeds. Heck, you could even throw in a custom wallpaper with a
    Microsoft Logo on it, to haunt your team at work.


    Since the hardware profiles for your instances are identical, you also a preseeded
    boot option to the ISO, so that your team can boot off a USB stick and Kali installed
    with no user interaction—the installation takes care of itself, full disk encryption.


    Perfect! You can generate an updated version of Kali on demand, specifically designed
    and optimized for your hardware. You saved the day. Mission complete!


    With the deluge of hardware hitting the market, this scenario is becoming more
    common for those of us who venture away from mainstream operating systems, in
    search of something leaner, meaner, or more suitable to our work and style.


    This is especially applicable to those attracted to the security field, whether
    it be an alluring hobby, fascination, or line of work. As newcomers, they often
    find themselves stumped by the environment or the operating system. For many newcomers
    Kali is their first introduction to Linux.


    We recognized this shift in our user base a couple of years ago, and figured that
    we could help our community by creating a structured, introductory book that would
    guide users into the world'
