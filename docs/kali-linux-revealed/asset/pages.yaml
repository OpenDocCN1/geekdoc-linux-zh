  md: '# 6.1.4. Websites


    In many cases, you can find websites that are used to distribute free software
    programs and bring together the community of its developers and users. These sites
    are loaded with relevant information in various forms such as official documentation,
    frequently asked questions (FAQ), and mailing list archives. In most cases, the
    FAQ or mailing list address problems that you have encountered. One quick tip:
    try restricting a search to a specific domain, like the dedicated to the program
    that is giving you trouble. If the search returns too many pages or if the results
    do not match what you seek, you can add the keyword `kali` or `debi``an` to limit
    results and target relevant information.


    | From the Error to a Solution | If the search returns a very specific error message,
    enter it into a search engine (between double quotes, ", in order to search for
    the complete path, rather than the individual keys). In most cases, the first
    lists returned will contain the answer that you need. |

    | In other cases, you will get very general errors, such as "Permission denied".
    In case, it is best to check the permissions of the elements involved (user, ID,
    groups, etc.). In short, don''t get in the habit of always using a search engine
    to find a solution to your problem. You will find it much easy to use common sense.
    |


    If you do not know the address of the software''s website, there are various means
    of locating it. First, look for a Homepage field in the package''s meta-information
    (apt show package). Alternatively, the package description may contain a link
    to the program''s official website. If no URL is indicated, the package maintainer
    may have included a URL in the /usr/share/doc/package/copyright file. Finally,
    you may be able to use a search engine (such as Google, DuckDuckGo, Yahoo, etc.)
    to find the describing software''s.


    # 6.1.5. Kali documentation at docs.kali


    The Kali project maintains a collection of useful documentation at http://docs.kali.org.
    While this book covers a large part of what you should know about Kali Linux,
    the documentation there might still be useful as it contains step-by-step instructions
    (much like how-tos) on many topics.


    ```

    http://docs.kali.org/

    ```


    Let''s review the various topics covered here:


    +   - Getting started: a series of instructions, including download instructions,
    for those new to Kali

    - Kali Live: documentation describing how to use Kali Linux as a live system

    - Installing Kali Linux: various documents describing Kali installation, including
    how to install it side-by-side with other operating systems'
