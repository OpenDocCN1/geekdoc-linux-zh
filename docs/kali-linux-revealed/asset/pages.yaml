  md: '# Adding a Nuke Password for Extra Safety


    Kali has modified cryptsetup to implement a new feature: you can set a nuke password
    word—when used—which will destroy all keys used to manage the encrypted partition.


    This can be useful when you travel a lot and need a quick way to ensure your data
    cannot be recovered. When booting, just type the nuke password instead of the
    one and it will then be impossible for anyone (including you) to access your data.


    Before using that feature, it is wise to make a backup copy of your encryption
    keys and keep them at some secure place.


    Following the example in this section, you could add a nuke password with this
    command:


    ```

    ### cryptsetup luksAddNuke /dev/sdb4

    Enter any existing passphrase:

    ter new passphrase for key slot:

    Verify passphrase:

    ```


    More information about this feature can be found in the following tutorial:


    +   - https://www.kali.org/tutorials/nuke-kali-linux-luks/


    # 9.5. Summary


    In this chapter, we learned about modifying Kali source packages, which are the
    basic building blocks of all applications shipped in Kali. We also discovered
    how to customize and install the Kali kernel. Then we discussed the live-build
    environment and discussed how to build a customized Kali Linux ISO. We also demonstrated
    how to create both encrypted and unencrypted Kali USB installs.


    # 9.5.1. Summary Tips for Modifying Kali Packages


    Modifying Kali packages is usually a task for Kali contributors and developers,
    but you might have specific needs not fulfilled by the official packages and knowing
    how to build a modified package can be very valuable, especially if you want to
    share your changes, deploy them internally, or cleanly roll the software back
    to a previous state.


    When you need to modify a piece of software, it might be tempting to download
    the source, make the changes, and use the modified software. However, if your
    application requires a system-wide setup (e.g. with a make step), then it will
    pollute your file system with files unknown to dpkg and will soon create problems
    that cannot be caught by package dependencies. In addition, this type of software
    modification is more tedious to share.'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'When creating a modified package, the general process is always the same: grab
    the source package, make your changes, and then build the package. For each step,
    there are often multiple tools that can handle each task.


    To rebuild a Kali package, first download the source package, which is composed
    of a *.dsc (Debian Source Control) file and additional files referenced from that
    control file.


    Source packages are stored on HTTP-accessible mirrors. The most efficient way
    to obtain them with apt source `source-package`-name, which you add a deb-src
    line to the /etc/apt/sources.list file and update the index with apt update.


    Additionally, you can use dget (from the descripts package) to download a .dsc
    file directly with accompanying files. For Kali-specific packages whose sources
    are hosted in a Git repository at git.kali.org¹⁰you can retrieve the sources with
    git clone git://git.kali.org/packages/source-package (if you don''t see anything
    in your repository, try switching to the kali/master branch with git checkout
    master).


    After downloading sources, install the packages listed in the source package''s
    build dependencies with sudo apt build-dev /. This command must be run from the
    package''s source directory.


    Updates to a source package consist of a combination of some of the following
    steps:


    +   - The first step is changing the version number to distinguish your package
    from the original with dch --local version-identifier, or modify other package
    details with dch.

    - Applying a patch with patch -p1 < patch-file or modifying quilt''s patch series.

    - Tweaking build options, usually found in the package''s debian/rules file, or
    other files in the debian/directory.


    After modifying a source package, you can build the binary package with dpkg-buildpackage
    -us -uc from the source directory, which will generate an unsigned binary package.
    The package can be installed with dpkg -i package-name_version_arch.deb.


    # 9.5.2. Summary Tips for Recompiling the Linux Kernel


    As an advanced user, you may wish to recompile the Kali kernel. You may want to
    slim down the standard Kali kernel, which is loaded with many features and drivers,
    add non-standard drivers or features, or apply kernel patches. Beware though:
    a misconfigured kernel can destabilize your system and you must be prepared to
    accept that Kali cannot ensure security updates for your custom kernel.


    For most kernel modifications, you will need to install a few packages with apt
    install build-essential libncurses-dev fakeroot.


    > ¹⁰http://git.kali.org'
