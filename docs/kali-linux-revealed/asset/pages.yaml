  md: '# 5.4. Managing Services


    Kali uses systemd as its init system, which is not only responsible for the boot
    sequence, but also permanently acts as a fully featured service manager, starting
    and monitoring services.


    systemd can be queried and controlled with systemctl. Without any argument, it
    runs the systemctl list-units command, which outputs a list of the active units.
    If you run systemctl status, the output shows a hierarchical overview of the running
    services. Comparing outputs, you immediately see that there are multiple kinds
    of units and that services are only one among them.


    Each service is represented by a service unit, which is described by a service
    file usually shipped in /lib/systemd/system/, or /run/systemd/system/, or /etc/systemd/system/;
    they are listed by increasing order of importance, and the last one). Each is
    possibly modified by service-name.*service files in the set of directories. These
    units are plain text files whose format is inspired by the well-known "*.ini"
    files of Windows, with value pairs grouped between [section] headers. Here we
    see a sample service file for /lib/system/ssh.service:


    ```

    [Unit]

    Description=Secure Shell server

    After=network.target audit.service

    ConditionPathExists=!/etc/ssh/sshd_not_to_be_run

    [Service]

    EnvironmentFile=/etc/default/sshd

    ExecStart=/usr/sbin/sshd -D $SSHD_OPTS

    ExecReload=/bin/kill -HUP $MAINPID

    KillMode=process

    Restart=on-failure

    RestartPreventExitStatus=255

    Type=notify

    ```


    ```

    [Install]

    WantedBy=multi-user.target

    Alias=sshd.service

    ```


    Target units are another part of systemd''s design. They represent a desired state
    that you want to attain in terms of activated units (which means a running service
    in the case of service units). They exist mainly as a way to group dependencies
    on other units. When the system starts, it enables the units required to reach
    the default.target (which is a symlink to graphical), which in turn depends on
    multi-user.target. So all the dependencies of those targets get activated during
    boot.


    Such dependencies are expressed with the Wants on the target. But you don''t have
    to edit the target unit to add new dependencies, you can also create a symlink
    pointing to the'
  merge: -1
  pgno: 142
- img_proc: true
  md: "dependent unit in the /etc/systemd/system/target-name.target.wants/ directory.\
    \ And this is exactly systemctl foo.service does. When you enable a service, you\
    \ tell systemd add a dependency on the targets listed in the WantedBy entry of\
    \ the [Install] section of the service unit file. Conversely, systemctl disable\
    \ foo.service drops the symlink and throws the dependency.\n\nThe enable and disable\
    \ commands change nothing regarding the current status of the services. They only\
