  md: 'debconf preseeing, a function that allows you to provide unattended answers
    to installation questions.


    # 4.3.1. Preceding Answers


    There are multiple ways to preseed answers to the installer. Each method has its
    own advantages and disadvantages. Depending on when the preseeing happens, the
    questions that can be preseeded vary.


    # With Boot Parameters


    You can preseed any installer with boot parameters that end in the kernel commandline,
    accessible through /proc/cmdline. Some bootloaders let you edit these parameters
    interactively (which is practical for testing purposes), but if you want to make
    the changes persistent, you will have to modify the bootloader configuration.


    You can directly use the full identifier of the debconf questions (such as debian-installer/language=en)
    or you can use abbreviations for the most common questions (like language=en or
    hostname=duke). You can use the full list¹ of aliases in the Debian installation
    manual.


    There is no restriction on which questions you can preseed since boot parameters
    are available from the start of the installation process and they are processed
    very early. However, the number of boot parameters is limited to 32 and a number
    of those are already used by default. It is also important to realize that changing
    the boot loader configuration can be non-trivial at times.


    In section 9.3, "Building Kali Live ISO Images" [page 236] you will also learn
    how to modify the Isolinux configuration when you generate your own Kali ISO image.


    # With a Preseed File in the Initrd


    You can add a file named preseed.cfg at the root of the installer’s initrd (this
    is the initrd which is used to start the installer). Usually, this requires rebuilding
    the debian-installer source package to generate new versions of the initrd. However,
    Live-build offers a convenient way to do this, which is detailed in section 9.3,
    "Building Kali Live ISO Images" [page 236].


    This method also does not have any restrictions on the questions that you can
    preseed as the preseed file is available immediately after boot. In Kali, we already
    make use of this feature to customize the behavior of the official Debian installer.


    > https://www.debian.org/releases/stable/amd64/apbs02#preseed-aliases'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# With a Preseed File in the Boot Media


    You can add a preseed file on the boot media (CD or USB key); preseeding then
    happens as soon as the media is mounted, which means right after the questions
    about language and keyboard layout. The preseed/file boot parameter can be used
    to indicate the location of the preeding file (for instance, /cdrom/preseed.cfg
    when installing from a CD-ROM, or /hd-media/preseed.cfg when installing from a
    USB-key).


    You may not preseed answers to language and country options as the preseeding
    file is loaded later in the process, unless the hardware drivers have been loaded.
    On the positive side, live-build makes it easy to put a supplementary file in
    the generated ISO images (see section 9.3, "Building Custom Kali ISO Images" [page
    236]).


    # With a Preseed File Loaded from the Network


    You can make a preseed file available on the network through a web server and
    tell the installer to download that preseed file by adding the boot parameter
    preseed/url=http://server/preseed.cfg (or by using the url alias).


    However, when using this method, remember that the network must first be configured.
    (in particular hostname and domain name) and all the preseeding questions (like
    language and country) cannot be preseeded with this method. This method is most
    often used in combination with boot parameters preseeding those specific questions.


    This preseeding method is the most flexible one you can change the installation
    configuration without changing the installation method.


    | Delaying the Language, Country, Keyboard Questions | To overcome the limitation
    of not being able to pre the language, country, and keyboard questions, you can
    add the boot parameter auto-install/enable=true (or auto=true). With this option
    the questions will be asked in the process, after the network has been configured
    and thus after download of the preseed file.

    The downside is that the first steps (notably network configuration) will always
    happen in English and if there are errors the user will have to work through English
    screens (with a keyboard configured in QWERTY).


    # 4.3.2. Creating a Preseed File


    A preseed file is a plain text file in which each line contains the answer to
    one Debconf question. A line is split across four fields separated by white space
    (spaces or tabs). For instance, d-i mirror/suite string kali-rolling:'
