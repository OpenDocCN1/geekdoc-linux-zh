  md: '# The dpkg Database


    You can traverse the dpkg database on the filesystem at /var/lib/dpkg/. This directory
    contains a running record of all the packages that have been installed on the
    system. All of the configuration scripts for installed packages are stored in
    /var/lib/dpkg/info/ directory, in the form of a file prefixed with the package''s
    name:


    ```

    $ ls /var/lib/dpkg/info/zsh.*

    /var/lib/dpkg/info/zsh.list

    /var/lib/dpkg/info/zsh.md5sums

    /var/lib/dpkg/info/zsh.postinst

    /var/lib/dpkg/info/zsh.postrm

    /var/lib/dpkg/info/zsh.preinst

    /var/lib/dpkg/info/zsh.prerm

    ```


    This directory also includes a file with the .list extension for each package,
    containing the list of files that belong to that package:


    ```

    $ head /var/lib/dpkg/info/zsh.list

    /

    /bin

    /bin/zsh

    /bin/zsh5

    /usr

