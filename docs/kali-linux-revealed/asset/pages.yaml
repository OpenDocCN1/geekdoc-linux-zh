  md: "# What is a Makefile file?\n\nYou may have noticed the message concerning the\
    \ missing Makefile at the end of the dh_make output and the mention of its similarity\
    \ to the rules file. A Makefile is a script file used by the program, it describes\
    \ rules for how to build a set of files from each other in a tree of dependencies.\
    \ For instance, a program can be built from a set of source files. The Makefile\
    \ file describes these rules in the following format:\n\n```\ntarget: source2\
    \ ...\n    command1\n    command2\n```\n\nThe interpretation of such a rule is\
    \ as: if one of the source* files are more than the target file, then the target\
    \ needs to be generated, using command1 and command2.\n\nNote that the command\
    \ lines must start with a tab character; also note that when a command line starts\
    \ with a dash (-), failure of the command does not interrupt the whole process.\n\
    \nAlthough this file is the heart of the process, it only contains the bare minimum\
    \ for running a standard set of commands provided by the debhelper tool. This\
    \ is the case for files generated by dh_make. To install all of your files, we\
    \ recommend configuring the behavior of the dh_install command by creating the\
    \ following debian/offsec-defaults.install file:\n\n```\napt/offsec.list etc/apt/sources.list.d/\n\
    apt/offsec.gpg etc/apt/trusted.gpg/\nsalt/offsec.conf etc/salt/minion.d/\nimages/background.png\
    \ usr/share/images/offsec/\n```\n\nYou could also use this to get settings override\
    \ file by debhelper provides a dedicated tool for this (dh installsettings) so\
    \ you can rely on it. First, put your settings in debian/offsec-defaults.settings-override:\n\
    \n```\n[org.gnome.desktop.background]\npicture-options='zoom'\npicture-uri='file:///usr/share/images/offsec/background.png'\n\
    ```\n\nNext, override the dh_installsettings call in debian/rules to increase\
    \ the priority to the level expected for an organization override (which is 90\
    \ according to the manual page):\n\n```\n#!/usr/bin/make -f\n\n%:\n    override\
    \ dh_installsettings:\n        dh_installsettings --priority=90\n```"
