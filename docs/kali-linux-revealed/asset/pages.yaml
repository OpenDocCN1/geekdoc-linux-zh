- img_proc: true
  md: '# Negating Conditions


    Prefixing a condition with an exclamation mark negates the condition. For example,
    negating a condition on the -p option matches "any packet with a different protocol
    than the one specified." This negation can be applied to all other conditions
    as well.


    The -s address or -s network/mask condition matches the source address of the
    packet. Corresponding, -d address or -d network/mask matches the destination address.


    The -i interface condition selects packets coming from the network interface.
    -o interface selects packets going out on a specific interface.


    The --state state condition matches the state of a packet in a connection (this
    requires the ipt_rack kernel module, for connection tracking). The NEW state describes
    a packet starting a new connection, ESTABLISHED matches packets belonging to an
    already existing connection, and RELATED matches packets initiating a new relation
    to an existing one (which is useful for the ftp-data connections in the "active"
    mode of the FTP protocol).


    There are many available options for iptables and ip6tables and mastering them
    all requires a great deal of study and experience. However, one of the options
    you will use often is the one to block malicious traffic from a host or range
    of hosts. For silently block incoming traffic from the IP address 10.0.1.5 and
    the 31.13.74.0/24 class C subnet:


    +   # iptables -A INPUT -s 10.0.1.5 -j DROP

    # iptables -A INPUT -s 31.13.74.0/24 -j DROP

    # iptables -n -L INPUT


    ```

    Chain INPUT (policy ACCEPT)

    target prot opt source

    DROP all 10.0.1.5

    DROP all 31.13.74.0/24

    ```


    Another commonly-used iptables command is to prevent network traffic for a specific
    service or port. To allow users to connect to SSH, HTTP, IMAP, you could run the
    following commands:


    +   # iptables -A INPUT -m state --state NEW -p tcp --dport 22 -j ACCEPT

    # iptables -A INPUT -m state --state NEW -p tcp --dport 80 -j ACCEPT

    # iptables -A INPUT -m state --state NEW -p tcp --dport 143 -j ACCEPT

    # iptables -n -L INPUT


    ```

    Chain INPUT (policy ACCEPT)

    target prot opt source

    DROP all 10.0.1.5 0.0.0.0/0

    DROP all 31.13.74.0/24 0.0.0.0/0

    ACCEPT tcp 0.0.0.0/0 state NEW tcp dpt:22

    ACCEPT tcp 0.0.0.0/0 state NEW tcp dpt:80

    ACCEPT tcp 0.0.0.0/0 state NEW tcp dpt:143

    ```


    It is considered to be good hygiene to clean up old and unnecessary rules. The
    easiest way to delete iptables rules is to reference the rules by line number,
    which you can retrieve with'
