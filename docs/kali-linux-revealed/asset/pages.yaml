  md: 'After the basics of Linux, it is time to learn the package management system
    of a Debian-based distribution. In such distributions, including Kali, the Debian
    package is the canonical way to make software available to end-users. Understanding
    the package management system will give you a great deal of insight into how Kali
    is structured, enabling you to more effectively troubleshoot issues, and help
    you quickly locate help and documentation for the wide array of tools and utilities
    included in Kali Linux.


    In this chapter, we will introduce the Debian package management system and introduce
    dpkg and the APT suite of tools. One of the primary strengths of Kali Linux lies
    in the flexibility of its package management system, which leverages these tools
    to provide near-seamless installation, upgrades, removal, and manipulation of
    application software, and of the base operating system itself. It is critical
    that you understand how this system works to get the most out of Kali and streamline
    your efforts. The days of painful compilations, disastrous upgrades, debugging
    gcc, and configure problems are long gone, but the number of available applications
    has exploded and you need to understand the tools designed to take advantage of
    them. This is also a critical skill because there are security tools that, due
    to licensing or other issues, cannot be included in Kali but have Debian packages
    available for download. It is important that you know how to process and install
    these packages and how they impact the system, especially when things do not as
    expected.


    We will begin with some basic overviews of APT, describe the structure and contents
    of binary and source packages, take a look at some basic tools and scenarios,
    and then dig deeper to help you wring every ounce of utility from this spectacular
    package system and suite of tools.


    # 8.1. Introduction to APT


    Let''s begin with some basic definitions, an overview, and some history about
    Debian packages, starting with dpkg and APT.


    # 8.1.1. Relationship between APT and dpkg


    A Debian package is a compressed archive of a software application. (a .deb file)
    contains files that can be directly used (such as programs or documentation),
    while a source package contains the source code for the software and the instructions
    required for building a binary package. A Debian package contains the application''s
    files as well as other metadata including the names of the dependencies the application
    needs, as well as scripts that enable the execution of commands at different stages
    in the package''s lifecycle (installation, removal, and upgrades).


    The dpkg tool was designed to process and install .deb packages, but if it encountered
    an unsatisfied dependency (like a missing library) that would prevent the package
    from installing, dpkg would simply list the missing dependency, because it had
    no awareness or built-in logic to find or process the packages that might satisfy
    those dependencies. The Advanced Package Tool (APT),'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'including apt and apt-get, were designed to address these shorthcomings and
    automatically resolve these issues. We will talk about both dpkg and the APT tools
    in this chapter.


    The base command for handling Debian packages on the system is dpkg, which performs
    installation or analysis of .deb packages and their contents. However, dpkg has
    only a partial view of the Debian universe: it knows what is installed on the
    system and whatever you provide on the command line, but knows nothing of the
    other available packages. As such, it will fail if a dependency is not met. APT
    addresses the limitations.


    APT is a set of tools that help manage Debian packages, or applications on your
    Debian system. You can use APT to install and remove applications, update packages,
    and upgrade your entire system. The magic of APT lies in the fact that it is a
    complete package management system that will not only install or remove a package,
    but will consider the requirements and dependencies of the packaged (and even
    their requirements and dependencies) and attempt to satisfy them automatically.
    APT relies on dpkg but APT differs from dpkg, as the former installs the latest
    package from an online source and works to resolve dependencies when dpkg installs
    a package on your local system and does not automatically resolve dependencies.


    If you have been around enough to remember compiling programs with gcc (you likely
    remember that it was a painful process, especially if the application had several
    dependencies). By deciphering the various warnings and error messages, you may
    be able to determine which part of the code was failing and most often that failure
    was due to a missing library or other dependency. You would then track down that
    missing library or dependency, correct it, and try again. If you were lucky, the
    compile would be complete, but the build would fail again, complaining about another
    broken dependency.


    APT was designed to help alleviate that problem, collate program requirements
    and dependencies, and resolve them. This functionality works out-of-the-box on
    Kali Linux, but it isn''t foolproof. It is important that you understand Debian
    and Kali''s packaging system works because you need to install packages, update
    software, or troubleshoot problems with packages. You will use APT in your day-to-day
    work with Kali Linux and in this chapter, we will introduce you to APT and show
    how to install, remove, upgrade, and manage packages, and even show how to move
    packages between different Linux distributions. We will also talk about graphical
    tools that leverage APT, how you validate the authenticity of packages, and delve
    into the concept of a rolling distribution, a technique that brings daily updates
    to your Kali system.


    Before we dig in and show you how to use dpkg and APT to install and manage packages,
    it is important that we delve into some of the inner workings of APT and discuss
    some terminology surrounding it.


    | Package Source and Source Package | The word source can be ambiguous. A source
    package—package containing the source code of a program—should not be confused
    with a source package—repository (website, FTP server, CD-ROM, local directory,
    etc.) that contains packages. |'
