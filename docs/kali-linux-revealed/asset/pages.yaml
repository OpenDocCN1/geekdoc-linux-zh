    # **Partitioning** Selecting Manual at the main "Partition disks" screen (Figure
    4.8, "Choice of Partitioning Mode" [page 74]) permits greater flexibility, allowing
    you to choose more advanced configurations and specifically dictate the purpose
    and size of each partition. For example, this mode allows you to install Kali
    alongside other operating systems, enable a software-based redundant array of
    independent disks (RAID) to protect data from hard failures, and safely resize
    existing partitions without losing data, among other things.


    **Shrinking a Windows Partition** To install Kali Linux alongside an operating
    system (Windows or other), you will need available, unused hard drive space for
    the partitions dedicated to Kali. In most cases, this means shrinking an existing
    partition and reusing the free space. If you are using the manual partitioning
    mode, the installer can shrink a Windows partition quite easily. You only need
    to choose the Windows partition and enter its new size (this works the same with
    both FAT and NTFS partitions).


    Chapter 4 — Installing Kali Linux 77'
