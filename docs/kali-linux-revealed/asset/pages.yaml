- img_proc: true
  md: "let salt know that the (ASCII armored) GPG key required to verify the repository's\
    \ signature can be fetched from /srv/salt/offsec-apt-key.asc the salt master.\
    \ The require_in attribute ensures that this state is processed before the offsec-defaults,\
    \ since the latter needs the repository correctly configured to install the package.\n\
    \nThe offsec-defaults state installs the package of the same name. This shows\
    \ that the name of the key is an important value for states, although it can always\
