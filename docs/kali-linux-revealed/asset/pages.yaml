- img_proc: true
  md: '# 8.2.1. Initializing APT


    APT is a vast project and tool set, whose original plans included a graphical
    interface. From a client perspective, it is centered around the command-line tool
    apt-get as well as apt, which was later developed to operate graphical alternatives
    by third parties, including synaptic and aptitude,


    which we will discuss later. We tend to prefer apt, which we use in the examples
    that follow. We will, however, detail some of the major syntax differences between
    tools, as they arise.


    When working with APT, you should first download the list of currently available
    packages with apt update. Depending on the speed of your connection, this can
    take some time because various packages'' list, sources'' list and translation
    files have grown in size alongside Debian development. Of course, CD/DVD installation
    sets install much more quickly, because they are local to your machine.


    # 8.2.2. Installing Packages


    Thanks to the thoughtful design of the Debian package system, you can install
    packages, with or without your dependencies, fairly easily. Let''s take a look
    at package installation with dpkg and apt.


    Installing Packages with dpkg


    dpkg is the core tool that you will use (either or indirectly through APT) when
    you need to install a package. It is also a go-to if you are operating offline,
    since it doesn''t require an Internet connection. Remember, dpkg will not install
    any dependencies that the package might require. To install a package with dpkg,
    simply provide the -i or --install option and the path to the .deb. This implies
    that you have previously downloaded (or in some other way) the .deb file of the
    package to install.


    ```

    dpkg -i man-db_2.7.0.2-5_amd64.deb

    (Reading database ... 86425 files and directories currently installed.)

    Preparing to unpack man-db_2.7.0.2-5_amd64.deb ...

    Unpacking man-db (2.7.0.2-5) over (2.7.0.2-4) ...

    Setting up man-db (2.7.0.2-5) ...

    Updating database of manual pages ...

    Processing triggers for mime-support (3.58) ...

    ```


    We can see the different steps performed by dpkg and see at what point any error
    may have occurred. The -i or --install option performs two steps automatically:
    it unpacks the package and runs the configuration scripts. You can perform these
    two steps independently (as apt does behind the scenes) with the --unpack and
    --configure options, respectively:'
  merge: -1
  pgno: 201
- img_proc: true
  md: '```

    # dpkg --unpack man-db-2.7.0.2-amd64.deb

    (Reading database ... 86425 files and directories installed.)

    Preparing to unpack man-db-2.7.0.2-amd64.deb ...

    Unpacking man-db (2.7.0-2) over (2.7.0-2) ...

    Processing triggers for mime-support (3.58)

    # dpkg --configure man-db

    Setting up man-db (2.7.0-2) ...

    Updating database of manual pages ...

    ```


    Note that the "Processing triggers" line refer to code that is automatically executed
    whenever a package adds, removes or modifies files in monitored directories. For
    instance, the mimesupport package monitors /usr/lib/mime/packages and executes
    the update-mime command whenever something changes in that directory (/usr/lib/mime/packages/man-db
    in the specific case of man-db).


    Sometimes dpkg will fail to install a package and return an error. However, you
    can order dpkg ignore this and only issue a warning with various --force- options.
    Using the dpkg --force command will help you display a list of these options.
    For example, you can use dpkg to forcibly install zsh:


    ```

    # dpkg -i --overwrite zsh_5.2-5+b1_amd64.deb

    ```


    A frequent error, which you are bound to encounter sooner or later, a file collision.
    When a package contains a file that is already installed by another package, dpkg
    will refuse to install it. The following types of messages will then appear:


    +   - Unpacking libgdm from ...libgdm_3.8.3-2_amd64.deb ...

    dpkg: error processing /var/cache/apt/archives/libgdm_3.8.3-2_amd64.deb (--unpack):

    - trying to overwrite /usr/bin/gdmlexiserver, which is also in package gdm3

    - 3.4.1-9


    In this case, if you replacing this file is not a significant risk to the stability
    of your system (which is usually the case), you can use --force-overwrite to overwrite
    the file.


    While there are many options, only --force-* options, --force-overwrite is likely
    to be used regularly. These options exist for exceptional situations, and it is
    better to leave them alone as much as possible in order to respect the rules imposed
    by the packaging mechanism. Do not forget, these rules ensure the consistency
    and stability of your system.


