    # 9.3. Building Custom Kali Linux ISO Images


    Kali Linux has a ton of functionality and flexibility right out of the box. Once
    Kali is installed, you can perform all sorts of amazing feats with a little guidance,
    creativity, patience, and practice. However, you can also customize a Kali build
    so that it contains specific files or packages (to scale up or down performance
    and features) and can perform certain functions automatically. For example, the
    Kali ISO of Doom⁷ the Kali Evil Wireless Access Point⁶ are both excellent projects
    that rely on a custom-built implementation of Kali Linux. Let’s take a look at
    the process of rolling a custom Kali Linux ISO image.


    Official Kali ISO images are built with live-build⁷ which is a set of scripts
    that allows for complete automation and customization of all facets of ISO image
    creation. The live-build suite uses an entire directory structure as input for
    its configuration. We store this configuration and some associated helper scripts
    in a live-build-config Git repository. We will use this repository as a basis
    for building customized images.


    Before going further, you must know that the commands shown in this section are
    meant to be run on an up-to-date Kali Linux system. They are very likely to fail
    if run on a non-Kali system or if the system is out of date.


    # 9.3.1. Installing Pre-Requisites


    The first step is to install the packages needed and to retrieve the Git repository
    with the Kali live-build configuration:


    ```

    # apt install curl git live-build

    [...

    # git clone git://git.kali.org/live-build-config

    [...

    # cd live-build-config

    # ls

    auto build_all.sh build.sh kali-config README

    ```


    At this point, you can already create an update (but unmodified) Kali ISO image
    by running ./build.sh --verbose. This build will take a long time to complete
    as it will download all the packages to include. When finished, you will find
    the new ISO image in the images directory.


    > ⁵https://www.offensive-security.com/kali-linux/kali-linux-iso-of-doom

    ⁶https://www.offensive-security.com/kali-linux/kali-linux-evil-wireless-access-point/

    ⁷https://debian-live.alioth.debian.org/live-build/'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# 9.3.2. Building Live Images with Different Desktop Environments


    The build.sh live-build wrapper that we provide is responsible for setting up
    the directory that live-build expects to find. It can put in place different live
    configurations depending on its --variant option.


    The wrapper creates the config directory by combining files from kali-config/common
    and kali-config/variant-x, where X is the name of a variant given with the --variant
    parameter. When the option is not explicitly given, it uses default as the name
    of the variant.


    The kali -config directory contains directories for the most common desktop environments:


    +   * e17 for Enlightenment

    * gnome for GNOME

    * i3wm for the corresponding window manager

    * kde for KDE

    * lxde for LXDE

    * mate for the Mate Desktop Environment

    * xfce for XFCE


    The light variant is a bit special; it is based on XFCE and is used to generate
    the official “light” ISO images that contain a reduced set of applications.


    You can easily create a Kali live image using KDE as desktop environment with
    this single command:


    ```

    # ./build.sh --variant kde --verbose

    ```


    This concept variant allows some high-level pre-defined customizations but if
    you take the time to read through the Debian Live System Manual, you will discover
    many other ways to customize the images, by changing the content of the appropriate
    sub-directory of kali-config. The following sections will provide some examples.


    # 9.3.3. Changing the Set of Installed Packages


    Once launched, live-build installs all the packages listed in package-lists/*.list.chroot
    files. The default configuration that we provide includes package-lists/kali.list.chroot
    file, which lists kali-linux-full (the main meta-package pulling all the Kali
    packages to include). You can comment out this package and put another meta-package
    of your choice or include a precise set of packages. You can combine both by starting
    with a meta-package and adding supplementary packages of your choice.


    > https://www.xfce.org/

    http://debian-live.alioth.org/live-manual/unstable/manual/html/live-manual.en.html'
  merge: -1
