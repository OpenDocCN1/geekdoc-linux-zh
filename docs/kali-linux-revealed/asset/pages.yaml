  md: 'designate a directory hosting a full (alternate) file system tree. This is
    the case with live-build, where the chroot directory is the directory where the
    live system is being prepared. Since applications started in a chroot cannot be
    outside of that directory, the same goes with the chroot hooks: you can only use
    and modify anything available in that chroot environment. We rely on those hooks
    to perform Kali customizations like kali-config/common/hooks/live/kali-hacks.chroot.


    Binary hooks (hooks/*.binary) are executed in the context of the build process
    (not chrooted anywhere) at the end of the process. You can modify the content
    of the ISO image built but not the live file system at now, it has already been
    generated. We use this feature in Kali to make some changes to the default isolinux
    configuration generated by live-build. For example, see kali-config/common/hooks/live/persistence.binary
    where we add the boot entries enabling persistence.


    # 9.3.5. Adding Files in the ISO Image or in the Live Filesystem


    Another very common customization is to add files in the live file system or in
    the ISO image.


    You can add files to the live file system by putting them at their expected location
    below the includes.chroot/usr/lib/live/config/0031-root-password, which we provide
    kali-config/common/includes.chroot/usr/lib/live/config/0031-root-password, which
    ends as /usr/lib/live/config/0031-root-password in the live file system.


    | Live-Boot Hooks |

    | --- |

    | Scripts installed as /lib/config/XXXX-name are executed by the init script of
    the live-boot package. They reconfigure many aspects of the system to be suited
    for a live system. You can add scripts of yours to customize your live system
    at run-time: it''s not needed to implement a custom boot parameter for example.


    You can add files to the ISO image by putting them at their expected location
    below the includes. binary config directory. For example, we provide kali-config/common/includes.binary/isolinux/splash.png
    to override the background image used by the Isolinux bootloader (which is stored
    in /isolinux/splash.png in the filesystem of the ISO image).


    # 9.4. Adding Persistence to the Live ISO with a USB Key


    # 9.4.1. The Persistence Feature: Explanations


    Next, we will discuss the steps required to add persistence to a Kali USB key.
    The nature of a live system is to be ephemeral. All data stored on the live system
    and all the changes made are lost when you reboot. To remedy this, you can use
    a feature of live-boot called persistence, which is enabled when the boot parameters
    include the persistence keyword.'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'Since modifying the boot menu is a non-trivial task, Kali includes two menu
    entries by default that enable persistence: Live USB Persistence and Live USB
    Encrypted Persistence, as shown in Figure 9.1, “Persistence Menu Entries” [page
    240].


    ![](img/f888cd88b4fb3dd45062e14ce223cc4f_265_0.png)


    Figure 9.1 Persistence Menu Entries


    When this feature is enabled, live-boot will scan all partitions for file systems
    labeled persistence (which can be overridden with the persistence-label=value
    boot parameter) and the installer will set up persistence of the directories which
    are listed in the persistence.conf file found in that partition (one directory
    per line). The special value “/ union” enables full persistence of all directories
    with a union mount, an overlay that stores only the changes when compared to the
    underlying file system. The data of the persisted directories are stored in the
    file system that contains the corresponding persistence.conf file.'
