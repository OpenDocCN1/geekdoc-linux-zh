    # Applying a Patch


    In one of our cases, we have downloaded the pyrit source package and we want to
    apply a patch that we found in the upstream git repository. This is a common operation
    and it should always be simple. Unfortunately, patches can be handled in different
    ways depending on the source package format and on the Git packaging workflow
    in use (when Git is used to maintain the package).


    With an Unpacked Source Package You run apt source pyrit and you have a pyrit-0.4.0
    directory. You can apply your patch directly with patch -p1 < patch-file:


    ```

    $ apt source pyrit

