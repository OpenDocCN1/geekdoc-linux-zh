    or logical partition.

    (Things to know: You can have four primary partitions but many more logical partitions.
    The partition containing /boot, and thus the kernel, must be a primary one, logical
    partitions reside in an extended partition, which consumes one of the four primary
    partitions.) Then you should see the generic partition configuration screen:


    ![](img/f888cd88b4fb3dd45062e14ce223cc4f_104_0.png)


    Figure 4.13 Partition Configuration Screen


    To summarize this step of manual partitioning, let''s take a look at what you
    can do with the new partition. You can::


    +   - Format it and include it in the file tree by choosing a mount point. The
    mount point is the directory that will house the contents of the file system on
    the selected partition. Thus, a partition mounted at /home/ is traditionally intended
    to contain user data, while “root” is known as the root of the file tree, and
    therefore the root of the partition that will actually host the Kali system.


    +   - Use it as a swap partition. When the Linux kernel lacks sufficient free
    memory, it will store inactive parts of RAM in a special swap partition on the
    hard disk. The virtual memory system makes this transparent to applications. To
    simulate the additional memory, Windows uses a swap (paging) file that is directly
    contained in a file system. Conversely, Linux uses a partition dedicated to this
    purpose, hence the term swap partition.'
