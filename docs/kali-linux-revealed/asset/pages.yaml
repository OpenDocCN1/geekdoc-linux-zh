    or /etc/logcheck/violations.d/myfile-extension file.


    A event is always signaled unless a rule in one of the /etc/logcheck/ignore.d
    {paranoid, server, workstation}/ states the event should be ignored. Of course,
    the only directories taken into account are those corresponding to verbosity levels
    equal or greater than the selected operation mode.


    # 7.5.2. Monitoring Activity in Real Time


    top is an interactive tool that displays a list of currently running processes.
    The default sorting is based on the current amount of processor user and can be
    obtained with the P key. Other sort orders include by occupied memory (M key),
    by total processor time (T key), and by process identifier (N key). The k keys
    allow a process by entering its process identifier. The r key changes the priority
    of a process.


    When the system seems to be overloaded, top is a great tool to see which processes
    competing for processor time or consuming too much memory. In particular, it is
    often interesting to check if the processes consuming resources match the real
    services that the machine is known to host. An unknown process running as the
    "www-data" user should really stand out and be investigated since it''s probably
    an instance of software installed and executed on the system through a vulnerability
    in a web application.


    top is very flexible tool and its manual page gives details on how to customize
    its display and adapt it to your personal needs and habits.


    The gnome-system-monitor graphical tool is similar to top and it provides roughly
    the same features.


    # 7.5.3. Detecting Changes


    Once a system is installed and configured, most system files should stay relatively
    static until the system is upgraded. Therefore, it is a good idea to monitor changes
    in system files since any unexpected change could cause for alarm and be investigated.
    This section presents a few of the most common tools used to monitor system files,
    detect changes, and optionally notify you as the administrator of the system.


