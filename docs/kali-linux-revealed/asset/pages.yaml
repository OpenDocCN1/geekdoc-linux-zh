  md: '# 6.3.1. Generic Recommendations


    Let''s discuss some general recommendations and guidelines that will help you
    submit a bug report that is clear, comprehensive, and improves the chances that
    the bug will be addressed by the developers in a timely fashion.


    # How to Communicate


    **Write Your Report in English** The Free Software community is international
    and unless know your interlocutor, you should be using plain English. Use simple
    sentences and avoid constructions that might be hard to understand for people
    with limited English skills. Even though most developers are highly intelligent,
    not all of them have strong English language skills. It is better never to assume.


    **Be Respectful of the Developers'' Work** Remember that most Free Software developers
    (including those Kali Linux) are benevolent and are spending their limited free
    time to work on the software that you are freely using. are doing this out of
    altruism. Thus, when you file a bug report, be respectful (even if the bug looks
    like an obvious mistake by the developer) and don''t assume that they owe you
    a fix. Thank them for their contribution instead.


    If you know how to modify and recommend the software, offer to assist the developers
    in testing any patches that you submit to you. This will show them that you are
    willing to invest your time as well.


    **Be Reactive and Ready to Provide More Information** In some cases, the developer
    will come back to you with requests for more information or requests for you to
    try to re-create the problem perhaps by using different options or an updated
    package. You should try to respond to those queries as quickly as possible. The
    quicker you submit your response, the higher the chance that they will be able
    to solve it while the initial analysis is still fresh in their mind.


    While you should respond quickly, you should also not go too fast: the data submitted
    must be correct and it must contain everything that the developers requested.
    They will be annoyed if they have to request something a second time.


    # What to Put in the Bug Report


    **Instructions to Reprodu the Problem** To be able to reproduce the issue, the
    developers need to know what you are using, and how you installed it.


    You should provide precise, step-by-step instructions describing how to reproduce
