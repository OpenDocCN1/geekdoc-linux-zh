    # 8.6. Validating Package Authenticity


    System upgrades are sensitive operations and you really want to ensure that you
    only install official packages from the Kali repositories. If the Kali mirror
    you are using has been compromised, a computer cracker could try to add malicious
    code to an otherwise legitimate package. Such a package, if installed, could do
