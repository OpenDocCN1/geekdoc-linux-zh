  md: 'PDF readers or web-based video programs were highly targeted, forcing them
    to mature. However, there are still a wide number of desktop applications that
    are a wealth of vulnerabilities when properly reviewed.


    +   - Mobile applications: As devices become more popular, mobile applications
    will become much more of a standard attack surface in many assessments. This is
    a fast moving target and methodologies are still maturing in this area, leading
    to new developments practically every week. Tools related to the analysis of mobile
    applications can be found in the Reverse Engineering menu category.


    Application assessments can be conducted in a variety of ways. As a simple example,
    application-specific automated tool can be run against the application in an attempt
    to identify potential issues. These tools will use application-specific logic
    in an attempt to identify unknown issues rather than just depending on a set of
    known signatures. These tools must have a built-in understanding of the application''s
    behavior. A common example of this would be a web vulnerability scanner such as
    Burp Suite25, directed against an application that first identifies input fields
    and sends SQL injection attacks to these fields while monitoring the application''s
    response for indications of a successful attack.


    In a more complex scenario, an application assessment can be conducted interactively
    in either a black box or white box manager.


    +   - Black Box Assessment: The tool (or assessor) interacts with the application
    with no special knowledge or access beyond that of a standard user. For instance,
    in the case of a web application, the assessor may only have access to the functions
    and features that are available to a user who has not logged into the system.
    Any user account used can self-register the account. This would prevent the attacker
    from being able to review any functionality that is only available to users that
    need to be created by an administrator.


    +   - White Box Assessment: The tool (or assessor) will often have full access
    to the source code, administrative access to the platform running the application,
    and so on. This ensures that a full and comprehensive review of all application
    functionality is completed, regardless of where that functionality lives in the
    application. The trade-off with this is that the assessment is in no way a simulation
    of actual malicious activity.


    There are obviously shades of grey in between. Typically, the deciding factor
    is the goal of the assessment. If the goal is to identify what would happen in
    the event that the application came under a focused external attack, a black box
    assessment would likely be best. If the goal is to identify and eliminate as many
    security issues as possible in a relatively short time period, a white box approach
    may be more efficient.


    > 25https://portswigger.net/burp/'
