  md: 'There was some speculation in the industry. Some thought that BackTrack was
    getting “bought out”, selling its soul to a faceless evil overlord for a massive
    payout. Offensive Security growing into one of the most respected training companies
    and a thought leader in our industry, and Cubie speculated that success had gobbled
    and sidelined the key BackTrack developers. However, nothing could be farther
    from the truth.


    In 2013, Kali Linux 1.0 was released. From the release: "After a year of silent
    development, Offensive Security is proud to announce the release and public availability
    of Kali Linux the most advanced, robust, and penetration-testing distribution
    to date. Kali is a more mature, secure, and enterprise-ready version of BackTrack."


    Kali Linux was not a mere rebranding of BackTrack. Sporting more than 600 completely
    repacked tools, it was clearly an almost, but there was more to it than Kali.
    Kali had been built, from ground, on a Debian core. To the uninformed, this might
    not seem like a big deal. But the effects were staggering. Thanks to a massive
    repackaging effort, Kali users could download the source for every single tool;
    they could modify and rebuild a tool as needed, with only a few keystrokes. Unlike
    other operating systems of the day, Kali Linux synchronized with the Debian repositories
    four times a day, which meant Kali users could get wildly current package updates
    and security fixes. Kali developers themselves into the fray, packaging and maintaining
    upstream versions of many tools so that users were constantly kept on the bleeding
    edge. To its Debian, Kali’s users could bootstrap an installation or ISO directly
    from the repositories, which opened the door for completely customized installations
    with prefilled files. With the customization trafik, Kali Users could modify the
    environment, alter menus, change icons, and even replace window environments.
    A massive ARM development push opened the door for the installation of Kali Linux
    on a wide range of hardware platforms including access points, single-board computers
    (Raspberry Pi, ODROID, Beaglebone, and Cubieboard), for ARM-based Chromebook computers.
    And but certainly not least, Kali Linux sported minor and major upgrades, which
    meant devotees would never have to re-install Kali Linux setups.


    The community notice. In the first five days, 90,000 of us downloaded Kali 1.0.


    This was the beginning. In 2015, Kali 2.0 was released, followed by the 2016 rolling
    releases. In summary, "If Kali 1.0 was focused on building a solid infrastructure,
    then Kali 2.0 is focused on overhauling the user experience and maintaining updated
    packages and tool repositories."


    The current version of Kali Linux is a rolling distribution, which marks the end
    of discrete versions. Now, users are up to date continuously and receive updates
    and patches as they are created. Core tools are updated more frequently than to
    an upstream version tagging system, groundbreaking accessibility improvements
    for the visually impaired have been implemented, and the Kali kernels are updated
    and patched to continue wireless 802.11 injection support. Software-Defined Radio
    (SDR) and Near-Field Communication (NFC) tools add support for new fields of security
    testing. Full Linux encrypted disk installation and emergency self-destruct options
    are available,'
