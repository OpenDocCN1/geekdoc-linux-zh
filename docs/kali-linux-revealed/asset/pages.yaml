  md: '• To modify a configuration file. You have multiple, better options using configuration
    management to automatically install a modified configuration file or installing
    a configuration package that will put a file in a configuration directory (when
    available) or that will divert the original configuration file.


    • To update to a newer upstream version. Again, it is better to work with developers
    to update the package directly in Debian or Kali. With the rolling release model,
    updates are rather quick to reach end users.


    Among all the available packages, there are some that are building blocks of Kali
    Linux and that could be interesting to fork in some situations:


    +   • kali-meta: this source package builds all the kali-linux-* packages and
    notably kali-linux-full, which defines what packages are installed in the default
    Kali Linux ISO image.


    +   • desktop-base: this source package contains various miscellaneous files that
    are used by default installations. Consider forking this package if you would
    like to show your organization''s brand in the default background or change the
    theme of the desktop.


    +   • kali-menu: this package defines the structure of the Kali menu and provides
    .desktop files for all applications that should be listed in the Kali menu.


    # 10.3.2. Creating Configuration Packages


    Now we have touched on PXE booting and discussed configuration management with
    SaltStack as well as package forking, it is time to wrap these processes into
    a practical example and extend the scenario by creating a custom configuration
    package to deploy a custom configuration to multiple machines semi-automatically.


    In this example, you will create a custom package that sets up and utilizes your
    own package repositories and GPG signing key, distributes a SaltStack configuration,
    pushes a custom background, and provides default desktop settings in a unified
    way to all your Kali installations.


    This may seem like a daunting task (especially if you glance through the Debian
    New Maintainer Guide*) but fortunately for us, a configuration package is mainly
    a sophisticated file archive and turning it into a package is rather easy.


    | Looking into a Sample Package | If you want to look into a real package that
    is basically a configuration package, consider the kali-defaults package. It is
    not as simple as the package in this section but it has all the relevant characteristics
    and even uses some advanced techniques (dpkg-divert) to replace files already
    provided by other packages. |


    > https://www.debian.org/doc/manuals/maint-guide/'
