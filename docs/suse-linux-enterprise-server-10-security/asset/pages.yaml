- pgno: 163
  md: '# Create a CRL with YaST


    As with the command line, there are two steps to create a certificate revocation
    list (CRL):


    +   - Revoke the certificate.

    - Create the CRL.


    To revoke a certificate, do the following:


    +   1. Enter the CA

    2. Select Certificates

    3. Select the certificate you want to revoke

    4. Select Revoke

    5. Choose a reason for the revocation and select OK.


    You are returned to the Certificates Overview and the certificate is now marked
    as revoked.


    To create or update the CRL, do the following:


    +   1. Select the CRL tab and then Generate CRL.

    2. A pop-up asks you to enter the validity of the CRL. After selecting OK, the
    CRL is generated

    3. Export the CRL to a file using the Export dialog.'
  merge: -1
