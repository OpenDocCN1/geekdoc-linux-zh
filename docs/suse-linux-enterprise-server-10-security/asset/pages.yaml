- pgno: 350
  md: '| Parameter | Significance |

    | --- | --- |

    | leftrsasigkey rightrsasigkey | Specifies the public key. If set to %cert the
    key is extracted from the certificate. |

    | leftid rightid | The identity of the host. A text string needs to be preceded
    by an @ sign. |

    | auto | add loads the specification but does not try to establish a connection.<br>start
    loads the specification and tries to establish a connection. |


    If not specified, you can add/start connections on the command line with ipsec
    auto -add connection_name ipsec auto -start connection_name

    See man ipsec_auto for more command line options.


    The use of certificates keeps you from having to add the public keys of the involved
    computers to the connection specifications. The exchange of certificates is done
    as part of the key exchange to establish a security association. To verify the
    certificates, openswan needs the root CA certificate and the certificates of any
    subCA. openswan expects them in /etc/ipsec.d/cacerts.


    # Copy Certificates and Private Keys


    Certificates are used to authenticate the computers. Certificates contain information
    about the computer, such as its name, and the public key in a certain data structure,
    which is then signed by the CA.


    Basically, the certificate certifies that information in the certificate belongs
    to the owner of the corresponding private key. Therefore, the respective computer
    needs to have access to the private key.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# SUSE Linux Enterprise Serve 10: Security


    If the certificate was created with the YaST CA Management module and exported,
    the certificate and the private key are in the same file. The following is an
    example:


    ```

    ----BEGIN CERTIFICATE-----

    MIIFezCCBGG0AwIBIGATARANBgkqqhkIG9w0BAQUFQADCBOTELMAKGA1UEBhMCREUX

    OdWWHemM24atcjpcdfmRV0VTSPd1bjKVSwp0QkRito7c2qw2PIK/ebZtoa8TTnr

    S5BuwwmVwfNap+tRF2H

    ----END CERTIFICATE----

    ```


    ```

    ----BEGIN RSA PRIVATE KEY-----

    Proc-Type: 4, ENCRYPTED

    DEK-Info: DES-EDE3-CBC, 3DEAD229DBAF0516

    ```


    ```

    fuNThtJ+7FMnWx4u5kmn5jc02YnYxTPtIn1wFuMt2Bma/15NJJ1/lf11LT13CVk

    z8v2NpMtJmF3/MzvbS2ZB3Z3cSYsVgqJ3c4JvJl3Q5QA3RpktmbqYresr4qQSATud1

    ----END RSA PRIVATE KEY----

    ```


    In this case, copy the private section to a separate file in /etc/ipsec.private/
    and the certificate section to a separate file in /etc/ipsec.certs/. The file
    containing the private key should only be readable for the root user.


    If you use openssl commands on the command line, the certificate and the private
    key are in separate files already. Just copy the files with the certificate and
    the private key to their respective directories.


    # Configure /etc/ipsec.secrets


    When certificates are used, the file /etc/ipsec.secrets holds the private and
    public RSA keys. When certificates are used, the passphrase to unlock the private
    key is stored in this file:


    ```

    /etc/ipsec.secrets

    rsa /etc/ipsec.d/private/myPrivateKey.pem very_secret

    ```


    This file may only be readable for the root user and no one else.


