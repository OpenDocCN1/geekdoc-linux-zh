- pgno: 261
  md: '# Objective 1


    # Application-Level Gateway Basics


    To understand application-level gateways, you need to know the following:


    +   - The Purpose of Application-Level Gateways

    - How Application-Level Gateways Work


    # The Purpose of Application-Level Gateway


    The term application-level gateway describes gateways where the connection from
    one side to the other is taken care of on layer 7, the application layer, of the
    ISO/OSI network model. This is different from a router, where the connections
    are taken care of in layer 3, the network layer (or layer 4 if it is a filtering
    router considering protocols like TCP and UDP as well)


    Application-level gateways are used to connect applications over the network that
    cannot or should not talk to each other directly.


    The following lists some possible reasons for this:


    +   - The applications are in different networks and, for security reasons, no
    direct connections are allowed; for example, a browser in the internal network
    and a web server outside in the Internet.


    +   - The applications use different protocols and a gateway is needed to connect
    them; for example, a company uses a proprietary email system and wants to integrate
    clients that use the IMAP protocol.

    - The performance of the connection should be improved; for example, web requests
    are cached by a gateway.

    - The connection should only be available for authorized users; for example, access
    to the Internet is only allowed for certain employees of a company.


    Sometimes the term proxy server is used instead of application-level gateway.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# How Application-Level Gateways Work


    As the term application-level indicates, application-level gateways work at the
    top level of the ISO/OSI reference model. Unlike routers, which only move network
    packets from one network to another, application-level gateways view the content
    within the network packets. This enables them to control and influence the data
    flow much more accurately than routers.


    The following two diagrams show the difference between a router and an application-level
    gateway, using the example of a web browser accessing a web server:


    Figure 8-1


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_262_0.png)


    Figure 8-2


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_262_1.png)'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'In both cases a user uses a web browser to access an external web site from
    an internal company network.


    In the first example, the web browser sends a direct HTTP request to the web server
    through the router. The router might rewrite the source address of the network
    packets to its own (masquerading), or filter the network packets based on IP addresses
    or ports, but the content of the packets or the user name are not considered.


    In the second example, the web browser sends the HTTP request to the application-level
    gateway, in this case an HTTP (web) proxy server. Now the application-level gateway
    sends its own request to the web server and delivers the data received back to
    the web browser. As you can see, there is no direct network connection between
    the web browser and the web server.


    While processing requests from a web browser and corresponding responses from
    a web server, the application-level gateway can inspect the content of the transferred
    HTTP data. In this way certain content, like JavaScript elements, can be blocked
    or the content could be cached to satisfy requests from other clients.


    The example in Figure 8-2 refers to an application-level gateway for the HTTP
    protocol (web proxy). Application-level gateways are available for many more common
    internet protocols such as POP3, IMAP, SMTP, or FTP.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Objective 2


    # Configure and Use Squid


    Squid is the most widely used proxy server for the HTTP protocol. Squid is open
    source software developed by the Squid project.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_264_0.png)


    For more information on the Squid project, see http://www.squid-cache.org.


    In this objective you will learn the following:


    +   - Understand the Basics of HTTP

    - Understand How Squid Works

    - Install Squid on SUSE Linux Enterprise Server

    - Understand the Squid Configuration File

    - Control Access to Squid

    - Configure Web Browsers to Use Squid

    - Understand How Squid Handles SSL Connections

    - Configure Proxy Authentication

    - Configure URL Filtering

    - Analyze Squid Log Files


    # Understand the Basics of HTTP


    HTTP is one of the most frequently used Internet transfer protocols. The major
    field of application is the transfer of web pages and their related data (HTML,
    images, and JavaScript files).


    The HTTP communication is based on requests and responses: The client (web browser)
    sends a request and the server (web server) answers this request with a response.
    Each request contains a command and several additional header fields. The most
    common command is GET, which requests a file from a server.


    CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'When a web page is transferred, the client needs to make a request for each
    component of the page. A component could be an HTML file, a graphic file, and
    maybe a Flash or JavaScript file.


    When clients are configured to use a proxy server, they send their requests to
    the proxy server instead of the actual target web server. The proxy makes a request
    to the actual server on behalf of the client and forwards the data to the client.


    In most cases, the proxy saves the requested data and uses this data when another
    client has the same request. This is called *caching*. Not all content that is
    transferred over HTTP is suitable for caching. Pages that are generated by a script
    or that are personalized for the user viewing the page are usually cached.


    Therefore, a web server response usually contains the header fields Pragma and
    Cache-Control, which determine if a page can be cached. HTTP requests from clients
    can contain header fields that tell a proxy not to deliver data from its cache
    to fetch the data from the target web server.


    With its clients, Squid speaks only HTTP. However, it is possible to encapsulate
    other protocols such as FTP or GOPHER into HTTP requests. Squid can handle these
    requests and connect to the target servers in their native protocol. Because of
    this feature, Squid is sometimes also called an FTP proxy. This is incorrect,
    because all FTP requests need to be encapsulated into HTTP by the browser. If
    you need a real FTP proxy, you should look at Frox (http://frox.sourceforge.net).'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Understand How Squid Works


    Squid can be used in the following ways:


    +   **Standard proxy server.** As a standard proxy server, Squid is used as a
    gateway to connect an internal network to the Internet.

    nOn one side Squid works as a firewall, separating the internal and the external
    network. On the other side, Squid caches the transferred data and reduces the
    load on the Internet connection.


    Figure 8-3


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_266_0.png)


    +   **Intercepting proxy server.** An intercepting (or transparent) proxy server
    is very similar to a standard proxy server. Squid separates the involved networks
    and stores content in its cache. Unlike a standard proxy server (web browser)
    no specific client configuration is required to use the proxy.


    Figure 8-4


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_266_1.png)'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'SUSE Linux Enterprise Server 10: Security


    Intercepting proxying does not work for HTTPS connections.


    +   - HTTP accelerator. As an HTTP accelerator, Squid works on the other side
    of the data flow. Instead of providing clients access to the Internet, Squid takes
    the load from a web server by caching its content.


    Figure 8-5


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_267_0.png)


    This section discusses the use of Squid as standard proxy and as intercepting
    proxy.


    # Install Squid on SUSE Linux Enterprise Server 10


    Squid is shipped as an RPM package with SUSE Linux Enterprise Server 10. To install
    it, you need to select the package squid in the YaST Package Manager. You can
    also install the SquidGuard package, which contains additional content and access
    control filters for Squid. You will learn more about SquidGuard later in this
    section.


    After you have installed and configured Squid, you can start it by entering


    ```

    rescid squid

    ```


