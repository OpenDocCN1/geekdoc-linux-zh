- pgno: 46
  md: '# Application-Level Gateway


    Application-level gateways (sometimes referred to as application-level firewalls)
    are computers on which proxy servers run and log and check the data traffic running
    through them. Because proxy servers involve programs that run on the gateway,
    these are ideally suited for logging and access protection mechanisms.


    Application-level gateways with their proxy servers have an essential advantage
    over packet filters: they do not use IP routing between the networks they connect.
    The IP datas are received by the proxy servers at the application level and the
    application data will be processed. At this stage all headers of the underlying
    protocol levels have already been removed.


    The determination of the target is on the basis of the address data inside the
    application data (e.g., for email on the basis of the email address, or for HTTP
    on the basis of the URL).


    Before transmitting the data to the actual target host, the application data will
    be passed through the protocol layers “downward,” while each protocol layer builds
    a new header of its own around the useful data, until the packet leaves the physical
    level of the Application-Level Gateway.


    This means that no header data can travel unchanged from one side of the gateway
    to the other beneath the application level, because they are created each time
    by the proxy servers before sent.


    Therefore, in the majority of cases malicious headers will be disposed of automatically
    during the passage through the application-level Gateway.'
  merge: -1
  img_proc: true
