- pgno: 231
  md: "# Objective 1\n\n# Understand Packet Filters\n\nPacket filters control what\
    \ data flows into and out of a network. To understand packet filter techniques,\
    \ you need a sound basic knowledge of the TCP/IP protocol family.\n\nThis objective\
    \ covers the following:\n\n+   - TCP/IP Basics\n- Routing\n- Static Packet Filters\n\
    - Dynamic (Stateful) Packet Filters\n\n# TCP/IP Basics\n\nA TCP/IP connection\
    \ between two computers is characterized by IP addresses, ports, and the protocol\
    \ used. In the case of someone connecting to a web server, the connection could\
    \ look like this:\n\n+   - Client computer:\n  - IP address: 217.83.16.7\n  -\
    \ Port: 1054\n  - Protocol: TCP\n\n+   - Web server:\n  - IP address: 130.57.4.27\n\
    \  - Port: 80\n  - Protocol: TCP\n\nTo view a web page, the browser opens a socket\
    \ (the combination of IP address and port) on the client and sends a request to\
    \ the IP address of the web server and its port 80, using the TCP protocol.\n\n\
    As part of the TCP protocol, the connection is established first using a specific\
    \ sequence of IP packets (the TCP handshake). Once that is done, the web server\
    \ sends data to the client."
  merge: -1
  img_proc: true
- pgno: 232
  md: 'The information is not transferred between the computers on a dedicated line.
    It is transferred in chunks of a certain size, called packets. These do not necessarily
    need to take the same route from source to destination. Each packet contains the
    IP addresses and ports of the computers involved and is independent of any other
    packet.


    To control the flow of the packets to, from, and through (if two network cards
    are present) the computer, filtering rules can be set up that allow packets to
    continue to their destination or to be discarded, according to various criteria.
    Filtering can be used to prevent computer A from being contacted by other computers
    while still allowing computer A to contact others, or to only allow certain traffic
    across a gateway while denying everything else.


    Such a mechanism is called a packet filter. The capability to filter packets,
    the netfilter framework, is part of the kernel. With Kernel 2.4.x and 2.6.x, this
    functionality is controlled by the iptables program.


    # Routing


    Even if a computer has two Network Interface Cards (NIC), packets coming in on
    one interface cannot leave the computer on the other interface. The default configuration
    does not allow the routing of packets.


    To turn routing on the Linux kernel, the value in /proc/sys/net/ipv4/ip_forward
    has be changed from 0 to 1.


    On the command line, this can be done as follows:


    ```

    dal0:~ # echo 1 > /proc/sys/net/ipv4/ip_forward

    ```'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'This change is lost with the next reboot. To ensure routing is turned on when
    the computer boots, you have to change the entry IP_FORWARD to yes in the file
    /etc/sysconfig/sysctl:


    ```

    ...

    ## Type: yesno

    ## Default: no

    #n# Runtime-configurable parameter: forward IP packets.

    # Is this host a router? (yes/no)

    #nIP_FORWARD="yes"

    ...

    ```


    # Static Packet Filters


    A static packet filter does not use any information from previous packets or any
    application data within the packet to decide what to do with a packet. As far
    as the filter is concerned, every packet is completely independent of any other
    packet.


    Let''s have a look at an FTP connection to illustrate this.


    When transferring files using FTP there are always two connections:


    +   - One is the control connection from the client to port 21 on the server.

    - The second connection is from port 20 to the server to a high port on the client
    (active FTP) or from a high port on the client to a high port on the server (passive
    FTP).


    The information on the ports is exchanged within the connection.


    If you want to allow FTP transfers through your packet filter, you need to allow


    +   - A connection originating from a high port of the client to port 21 of the
    server.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'or


    A connection originating from any port above 1024 on the client to any port above
    1024 on the server (for passive FTP).


    However, the filter rules do not care whether the connection from port 20 of the
    server is a legitimate FTP data transfer in answer to a request on port 21 or
    not. Therefore, with these rules anyone can open connections to the high ports
    of clients, as long as they originate at port 20. This leaves the high ports of
    the clients unprotected if you want to allow active FTP.


    With passive FTP, the problem is the same on the server side. To allow passive
    FTP, a packet filter that should protect the server has to allow all connections
    from the high ports of clients to the high ports on the server.


    When filtering TCP connections, static packet filters allow some control on the
    direction of the connection. You can allow packets with only the syn-flag in one
    direction (from the inside) while rejecting them when they come from the outside.
    (The first packet of the TCP handshake has only this flag.)


    The packets following the first one in either direction have to be allowed as
    well for a successful connection.


    Rejecting packets with only the syn flag set from the outside prevents the TCP
    handshake and thus the TCP connection.


    This is not possible with UDP, because there is no handshake and no flags are
    set. This makes it virtually impossible to effectively filter UDP connections
    with static packet filters, short of blocking them completely.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Dynamic (Stateful) Packet Filters


    Aful packet filter uses information about previous packets and, to some extent,
    application data within the packets to decide what should happen with a packet.


    Let''s have a look again at an FTP connection to illustrate this.


    In the beginning, only a connection from the client to port 21 of the server is
    allowed by a filter rule. Everything else is forbidden—an answer from the server
    to the client as well as any connections from port 20 of the server to the client.


    The first packet from the client to the server changes the filter rules to allow
    packets in answer to this first packet and any subsequent packets. To be allowed,
    they must correspond exactly to the first packet.


    After the three-way handshake, the port to be used for the data transfer is transmitted
    within the control connection. The Stateful engine reads this information from
    the data section within the packets of the control connection and configures the
    filter to allow exactly that data connection. Unlike static packet filtering,
    this rule is not port 20 of any server to any high port of the client, but only
    port 20 of this particular server to exactly port x on the client.


    After a specific time without traffic elapses, the additional rules allowing these
    connections are removed from the filter. Only initial connections from the client
    to port 21 remain allowed.


    The advantage of this is that, in general, no connections from port 20 to the
    high ports of clients are allowed. This blocks any traffic originating from port
    20 without a corresponding connection to port 21 on the same server. The same
    holds true for passive FTP. Only the single data connection corresponding to the
    control connection is allowed for a certain amount of time.'
  merge: -1
  img_proc: true
- pgno: 236
  md: This mechanism can also be used to control UDP traffic. Rules can be set that
    allow packets from the outside only after a packet from the inside starts the
    connection. Therefore, stateful packet filtering allows you to control UDP connections
    much better than static filtering.
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Objective 2


    # Understand iptables Basics


    iptables is the program used to control the packet filtering capabilities of the
    netfilter framework in the Linux kernel.


    You use the iptables program to set or delete the packet filter rules. Because
    of the many ways packets can be handled, the syntax of iptables is rather complex.


    To understand iptables, you need to understand


    +   - Chains

    - Policies

    - Basic Syntax


    # Chains


    Rules are organized in a chain. Within a chain, the rules are checked after the
    other until a rule matches. If no rule matches, a default action is taken. This
    default action is referred to as the policy of the chain.


    There are several chains. The main built-in chains are


    +   - INPUT

    - OUTPUT

    - FORWARD'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'The following figure and explanation are from http://www.netfilter.org/documentation/HOWTO/packet-filtering-HOWTO-6.html.


    # Figure 7-1


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_238_0.png)


    The following describes the process:


    +   1. When a packet comes in (for example through the Ethernet card), the kernel
    first looks at the destination of the packet: This is called routing.

    2. If the packet is destined for this computer, the packet passes downwards in
    the diagram, to the INPUT chain.


    If it passes this, any processes waiting for that packet will receive it.

    3. Otherwise, if the kernel does not have forwarding enabled, or it doesn''t know
    how to forward the packet, the packet is dropped.


    If forwarding is enabled, and the packet is destined for another network interface
    (if you have another one), then the packet goes rightwards on our diagram to the
    FORWARD chain.

    \If it is ACCEPTed, it will be sent out.

    4. Finally, a program running on the computer can send network packets.


    These packets pass through the OUTPUT chain immediately: If it says ACCEPT, then
    the packet continues out to whatever interface is destined for.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Policies


    The policy decides what happens to a packet that did not match a rule in the chain.
    The policy could either be to accept the packet or drop it.


    Two approaches are possible:


    +   - Everything is forbidden, except if explicitly allowed.

    - Everything is allowed, except if explicitly forbidden.


    From a security viewpoint, only the first approach is valid.


    To set the policy, use the -P option:


    ```

    iptables -P FORWARD DROP

    ```


    # Basic Syntax


    iptables is called with various options to specify a rule. If a rule matches,
    the target of the rule is executed, usually accepting, rejecting, or dropping
    the packet.


    After a match, the subsequent rules are usually not checked. Therefore, the sequence
    of the rules in the chain is of critical importance.


    iptables options let you:


    +   - Add and delete rules.

    The following commands are possible:

    - -A. Add a rule to the end of the chain.

    - -D. Delete a rule.

    - -R. Replace a rule.

    - -I. Insert a rule.


    For instance, to insert a rule at position 3 of the chain, enter


    ```

    iptables -I INPUT 3 ...

    ```'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Manipulate whole chains.


    The following commands are possible:


    +   -F. Delete (flush) all rules from a chain.


    +   -Z. Zero the byte counter of a chain.


    +   -L. List the rules of a chain (add -v for more information).


    +   -N. Create a user-defined (new) chain.


    +   -E. Rename a user-defined chain.


    +   -X. Delete an empty user-defined chain.


    # Define matching rules.


    Matches can be based on, for instance, interfaces, ports, or IP addresses.


    Not every possible option has to be specified. If an option, for example the destination
    port, is not specified, it is not taken into consideration.


    +   Specify the interface: -i for input, -o for output: -i eth0 -o cannot be used
    in the INPUT chain, -i is not possible in the OUTPUT chain.


    +   Specify the protocol: -p TCP, -p UDP

    The protocol can be specified with its abbreviation or the number of the protocol
    from /etc/protocols. Both lower and upper case are acceptable.


    +   Specify source and/or destination IP: -s 1.2.3.4, -d 192.168.0.0/24


    +   Specify source and/or destination port: --sport 1024:65535, --dport 80


    You can specify a single port or port ranges (start:end). The port you put in
    the rules depends on the service you want to access. /etc/services lists the ports
    and the service that can usually be found on that port.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# SUSE Linux Enterprise Server 10: Security


    While UDP and TCP usually have the same service on the same port, this is not
    necessarily so. Some of the more frequently used ports include


    +   -20. FTP data

    -21. FTP

    -22. SSH

    -23. telnet

    -25. SMTP

    -53. domain (dns)

    -80. WWW

    -110. POP3

    -111. sun-rpc

    -113. ident

    -137–139. NetBIOS ports

    -143. IMAP

    -443. HTTPS


    Additional matches may be used with the option -m. Some of the more common ones
    are covered in the next objective,

    “Understand Advanced Features” on page 7-17.


    +   - Set the target.


    The target specifies what happens to a packet that matches a rule.

    After a match, subsequent rules (with the exception of LOG) are not checked. The
    target is given after the option -j (jump). Possible targets are


    +   - ACCEPT on the chain, the packet is forwarded, delivered to a local process,
    or sent out via a network interface.

    - REJECT


    The packet is discarded and, depending on the type of packet, a message (default:
    ICMP port unreachable) is sent to the source of the packet.


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    Copying all part of this manual, or distributing copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


    7-12 Version 1'
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   - DROP


    The packet is silently discarded.


    +   - LOG


    Unlike with other rules, the packet continues down the chain after it matches
    a logging rule. So, if you want to log packets that are rejected or dropped, put
    a logging rule right before the rule dropping the packet.


    Logging packets, especially rejected ones, is useful. When writing your rules,
    a log can be used to debug your script, and when your rules are in force, a log
    can give you an idea of what packets hit your packet filter.


    Packets are usually logged in /var/log/firewall. But you can configure syslog
    to log them into a file of their own.


    +   - A user-defined chain.


    User-defined chains are covered in the next objective, “Understand iptables Advanced
    Features” on page 7-17


    The following are some examples of iptables rules:


    +   - To block all packets on eth1 with a source IP of 10.x.x.x, enter


    ```

    iptables -A INPUT -i eth1 -s 10.0.0.0/8 -j DROP

    ```


    The rule is added at the end of the chain (-A).


    +   - To reject all incoming TCP packets on eth1 with a source IP of 10.x.x.x,
    enter


    ```

    iptables -A INPUT -i eth1 -p tcp -s 10.0.0.0/255.0.0.0 -j REJECT

    ```


    The default for REJECT is to send an ICMP Port Unreachable message, if applicable.
    (For example, no ICMP messages are sent in response to certain ICMP messages.)


    To specify the ICMP message (or a TCP reset) to be sent, enter


    -j REJECT --reject-with-type


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# SUSE Linux Enterprise Server 10: Security


    Replace type with the ICMP message you want sent

    (icmp-proto-unreachable, icmp-host-unreachable, or tcp-reset,

    (for example).


    +   - To accept all incoming ICMP packets on eth1, enter


    ```

    iptables -A INPUT -i eth1 -p icmp -j ACCEPT

    ```


    You should not indiscriminately block all ICMP packets on your

    firewall. If you consider blocking them at all, you should only block

    certain types of packets; otherwise, network performance could suffer.

    Candidates for blocking are timestamp request and, information

    request reply, address mask request and, redirect.

    In any event you should allow fragmentation-needed messages.

    Put a rate limit on the others if you want, or accept them.

    You can get a list of types by using iptables -p ICMP --help.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_243_0.png)


    +   - To accept all outgoing TCP packets to port 80, enter


    ```

    iptables -A OUTPUT -p tcp --dport 80 -j ACCEPT

    ```


    Usually a second rule is needed to take care of the packets received in

    answer.


    +   - To accept all incoming TCP packets from port 80 (if the syn-bit

    alone is not set; ! is used to negate an option), enter


    ```

    iptables -A INPUT -p tcp ! --syn --port 80 -j ACCEPT

    ```


    +   - To log a packet, use the LOG target. To make the log entries

    more informative, a string should be entered in the rule that

    appears in the log file:


    ```

    iptables -A INPUT -p tcp --syn --dport 25 \

    -j LOG --log-prefix "SMTP traffic: "

    ```


    # CNI USE ONLY-1 HARDCOPY PERMITTED


