- pgno: 368
  md: '# SECTION 10 Intrusion Detection and Incident Response


    There is something even worse than having your computer hacked and abused for
    some malicious purpose: Getting hacked and never finding out about it.


    There is no absolute protection against an illegal intrusion. Someone might figure
    out a new vulnerability and exploit it on your servers before it is publicly known
    that this vulnerability exists. This could happen even if you have applied all
    current security patches. If the vulnerability is not generally known, there is
    no patch to install it.


    But in general, an intruder leaves some traces behind. Making it hard for the
    intruder to obscure his trail and interpreting any traces you find is what intrusion
    detection is about.


    # Objectives


    +   1. Log Files and Their Evaluation

    2. Host-Based Intrusion Detection

    3. Network-Based Intrusion Detection

    4. Incident Response'
  merge: -1
  img_proc: true
- pgno: 369
  md: '# Objective 1 Log Files and Their Evaluation


    Log files are a valuable tool for detecting intrusions. However, once someone
    has taken over a computer and become root, she can manipulate the log files to
    obscure any traces of her activity.


    Manipulating log files can consist of deleting entries or trying to hide the relevant
    information by filling the log files with huge amounts of irrelevant entries.


    One way to prevent the manipulation of log files by deletion of entries is not
    only log on the host itself, but to send the log information across the network
    to another host.


    The intruder could stop the sending of logging information to the log host, but
    the lack of entries would alert you, as would any suspicious ones.


    Depending on the security needs, the log host can even write the logs onto a worm
    (write once, read many) medium, making it impossible to change them even if the
    log host is compromised.


    Another approach is to have a log without any network connection. Log messages
    in this case would be transferred using a serial connection. This setup would
    make it impossible for an intruder to access the log host via the network.


    But even if the incident is logged, you still have to become aware of the relevant
    log entries. There are tools that help to filter relevant log entries and bring
    them to your attention.


    This objective explains how to


    +   - Log to a Remote Host


    +   - Evaluate Log Files and Run Checks'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# Log to a Remote Host


    The syslog-ng used to log system messages on SUSE Linux Enterprise Server 10 can
    send messages to and receive messages from other computers. The receiving computer
    is sometimes referred to as tohost.


    Configuration changes are necessary on both sides:


    +   - Client Side Configuration of Syslog-ng

    - Server Side Configuration of Syslog-ng


    # Client Side Configuration of Syslog-ng


    Logging to other computers is configured in /etc/syslog-ng/syslog-ng.conf.in,
    as in the following example:


    ```

    destination tologhost { udp(10.0.0.254 port(514)); }

    log { source(src); destination(tolohost); };

    ```


    The first line defines a destination tologhost, with protocol, IP address (you
    could also use the host name), and the second line config logging to this destination.
    Because no filter is included, all messages from the source src get to the destination
    tologhost.


    After editing the file /etc/syslog-ng/syslog-ng.conf.in, run Useconfig --module
    syslog-ng to transfer the changes to /etc/syslog-ng/syslog-ng.conf, which is the
    actual configuration file used by syslog-ng.


    # Server Side Configuration of Syslog-ng


    To receive messages, syslog-ng has to listen on a port, usually port 514. Unlike
    syslogd, which only supports UDP connections, syslog-ng also supports TCP.'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'To bind to a port, you have to add a line within a source section. You can
    either add it to the existing source src section, or create a new one, as in the
    following:


    ```

    source network {

    dp(ip("10.0.0.254") port(514));

    };

    ```


    Using 0.0.0.0 as the IP address causes syslog-ng to bind to all available interfaces.


    Then a destination and a log entry are required:


    ```

    destination digiair { file("/var/log/$HOST"); };

    log { source(network); destination(digiair); };

    ```


    The first line defines the destination digiair; each host''s log entries written
    to a file with the hostname as name. The log entry directs messages from the source
    network to the destination digiair.'
  merge: -1
  img_proc: true
