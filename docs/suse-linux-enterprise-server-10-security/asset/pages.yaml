- pgno: 45
  md: 'SUSE Linux Enterprise Server 10: Security


    The data stream can be regretted on the IP protocol level and the respective transport
    protocols that are built upon it.


    The following figure shows the ISO/OSI layers involved in routing. While information
    in layer 4 is used by a packet filter to decide on the fate of a packet, information
    contained in layer 5 and above is hardly, if ever, taken into consideration by
    a packet filter.


    # Figure 1-2


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_45_0.png)


    # Screening Router


    A packet filtering router placed as the first point of entry to a complex firewall
    setup is sometimes referred to as a screening router.


