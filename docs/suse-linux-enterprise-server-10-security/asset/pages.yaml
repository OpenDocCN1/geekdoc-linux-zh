- pgno: 108
  md: '+   **Glob w/Ext.** Selecting Glob w/Ext once replaces the filename with an
    *, retains the file name extension: text.txt becomes *.txt. Selecting Glob w/Ext
    twice replaces the file and the directory it resides in by **, retaining the file
