- pgno: 167
  md: '# SUSE Linux Enterprise Server 10: Security


    Like a password, the passphrase should contain upper- and lower-case characters,
    and numbers. Special characters can be used, but may be problematic to enter on
    keyboards with a layout for a different language.


    GPG creates the key pair, which can take some time.


    ```

    gpg: /home/geeko/.gnupg/trustdb.gpg: trustdb

    gpg: key 15B847F3 marked as ultimately trusted

    public and secret key created and signed.


    gpg: checking the trustdb

    gpg: 3 marginal(s) needed, 1 complete(s) needed, PGP trust model

    gpg: depth: 0 valid: 1 signed: 0 trust: 0-, 0q, 0n, 0m, 0f,

    lu

    pub 1024D/15B847F3 2006-04-19

    Key fingerprint = 3762 FF45 8BF9 3224 49EF 4257 171A 5A58

    15B8 F73

    uid Gecko (Chameleon) <geeko@digitalairlines.com>

    sub 2048/g/3C480751 2006-04-19

    ```


    The private key is written to ~/.gnupg/secring.gpg, the public key to ~/.gnupg/pubring.gpg.


    To send you an encrypted message, the sender needs your public

    key And similarly, if you want to send an encrypted message to

    some, you need his public key.


