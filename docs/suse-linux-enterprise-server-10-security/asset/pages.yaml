- pgno: 170
  md: '# gpg -r tux -r geeko -e message.txt


    Then delete the cleartext file using a utility like shred that overwrites the
    file before it deletes it. (Note that shred and other utilities have limitations
    on journaling file systems; see man shred for details.)


    You have to confirm using the key because there is no CA certifying that this
    key belongs to the ID tux (in the above example). You have to certify that yourself
    or rely on other users to do so.


    Each key has a so-called key fingerprint. You can view the fingerprint using the
    option --fingerprint username:


    ```

    dal0:~ # gpg --fingerprint geeko

    pub Key fingerprint = 3762 FF45 8BF9 3224 49EF 4257 171A 5A58 15B8 47F3 1024D/15B847F3
    2006-04-19 Gecko (Chameleon) <geeko@digitalairlines.com>\uid 2048G/3C4B0751 2006-04-19

    sub

    ```


    To ensure that a key belongs to a certain person, you can view the fingerprint
    of the key you have in your possession with the command shown above, and find
    out from the person if that matches the fingerprint of the key in their possession.
    Some users print the fingerprint on their business card or publish it on their
    website. You could also contact the person personally or by phone to find out.
    What is acceptable to you as a proof depends on your personal security needs and
    policies.'
  merge: -1
  img_proc: true
