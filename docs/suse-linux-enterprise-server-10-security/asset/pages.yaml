- pgno: 340
  md: '# SECTION 9 Virtual Private Networks


    In the past, dedicated phone lines to connect branch offices or dial-in connections
    for remote workers were widely used. Since they were, however, rather expensive,
    especially if used over a long distance, alternatives were needed.


    These costs were remarkably reduced using the Internet. But with the use of the
    Internet new problems arose, namely unauthorized access to the internal networks
    or unauthorized access to the data exchanged over the Internet.


    To solve these problems, cryptography is used, both to ensure that only authorized
    users access the internal network and to protect the data traveling through the
    Internet from being viewed by unauthorized people.


    Technologies that use one network infrastructure to carry the packets of another
    network are usually summarized under the heading VPN (Virtual Private Network).


    # Objectives


    +   1. VPN and IPSec Basics

    2. Configure and Establish an IPSec Connection

    3. Understand Packet Filtering of VPN Traffic'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Objective 1


    # VPN and IPSec Basics


    A VPN uses the infrastructure of another network, for instance the Internet, for
    its traffic. By definition, a VPN does not necessarily have to encrypt the traffic,
    but in practice this is done in the majority of cases.


    Various technologies are used to implement VPNs, including IPSec, OpenVPN, L2TP,
    HTTPS, SSH and others. In this course we cover IPSec.


    Figure 9-1


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_341_0.png)


    IPSec uses cryptography to authenticate users and to protect the transmitted data
    from eavesdropping.


    IPSec consists of four different components:


    +   **Security protocols.** They form the basis of IPSec.

    Security protocols used are Authentication Header (AH, protocol 51) and Encapsulating
    Security Payload (ESP, protocol 50).


    +   **Security associations.** Security associations underlie connections in IPSec.


    Each security protocol needs its own security association. It has a limited validity
    and has to be renewed after its expiration.


    +   **Key management.** Different keys are used for authentication and encryption.


    Usually the exchange of keys is performed with the Internet Key Exchange (IKE)
    Protocol.


    CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Encryption algorithms. IPSec can use various algorithms.


    When establishing an IPSec connection, the first step is the exchange of the keys
    and the establishment of the needed security associations. This is done using
    ISAKMP (Internet Security Association and Key Management Protocol) via UDP port
    500.


    After that the encrypted data is exchanged in a secure tunnel using protocol 50
    (ESP). It is also possible to tunnel the data authenticated but unencrypted using
    protocol 51 (AH).


    Three different methods are available to authenticate the endpoints of connections:


    +   - Preshared keys


    +   - Plain RSA keys


    +   - Certificates


    We do not recommend that you use preshared keys because the same key is used for
    all connections. It is easy to administer IPSec with plain RSA keys if there are
    few parties involved. If many computers require require keys, certificates are
    probably the best choice.


    In this section on IPSec we will use certificates.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Objective 2


    # Configure and Establish an IPSec Connection


    Kernel 2.4.x uses the FreeSWAN kernel modules to implement IPSec. In kernel 2.6.x
    this functionality is part of the mainline kernel.


    There are two different toolsets that come with SLES 10 to control IPSec connections:
    The packages openswan and ipsec-tools.


    OpenSWAN, which is covered in this section, continues the FreeSWAN project that
    was discontinued a few years ago. It contains the tools that were used with kernel
    2.4.x, ported to support the IPSec modules contained in kernel 2.6.x. The package
    ipsec-tools includes the programs setkey and racoon to control IPSec connections.
    These are not covered in this course.


    How you configure an IPSec connection depends on what you want to do:


    +   - Connect Two Sites with IPSec (Site-to-Site)


    +   - Connect a Single Computer with a Site (End-to-Site)


    +   - Connect Two Single Computers (End-to-End)


    In each case, the configuration is slightly different.


    Once you are done with the configuration, you need to


    +   - Establish the Connection


    +   - Test the Connection


    The following scenarios use certificates, which are created as described in “Create
    a Certification Authority (CA) and Issue Certificates with CLI Tools” on page
    4-13 and “Create a Certification Authority (CA) and Issue Certificates with YaST”
    on page 4-24.'
  merge: -1
  img_proc: true
