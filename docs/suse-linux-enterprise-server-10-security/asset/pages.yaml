- pgno: 268
  md: 'To start Squid automatically at boot time, you can add it to the init process
    by entering


    # insserv squid


    # Understand the Squid Configuration File


    The configuration file for Squid (/etc/squid.conf) is fully documented with extensive
    comments directly in the file.


    Only a few entries in this file need to be adjusted to configure basic proxy server
    functionality; most parameters can be left with the default values. The default
    values will also be used if no other value is given or if the entry is prefaced
    with a comment sign.


    A configuration option in the squid.conf file is also called a tag. The following
    is a list of the most important tags:


    +   * Network Tags

    * Cache Size Tags

    * Log Files and Cache Directories Tags

    * Fine-Tuning Tags

    * Time-Out Tags

    * Administrative Tags

    * Error Tags'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Network Tags


    You can set the following tags:


    +   - http_port. The port on which Squid waits for requests is set to 3128 by
    default. Often another port, such as 8080, is set.


    If you run Squid on a gateway with an external and an internal network interface,
    you can also specify an IP address in the form ip_address:port on which Squid
    should listen. In this way you can make sure that your proxy can only be accessed
    from the internal network.


    # Cache Size Tags


    You can set the following tags:


    +   - cache_mem. This parameter determines how much physical RAM Squid uses to
    cache data (most poplular replies). Besides the RAM cache, Squid also uses the
    hard disk for caching purposes.


    Squid''s actual memory usage depends on the cache size on the disk. As a rule
    of thumb, Squid uses approximately 10 MB of RAM per GB of the total disk cache
    space, plus the amount specified in cache_mem, plus another 10-20 MB. It is recommended
    that the Squid server have at least twice this amount of physical RAM available.


    +   - cache_swap_low, cache_swap_high. This refers to the disk space reserved
    for caching files (see the cache_dir tag).


    These two values define perfect values. When the space occupied by the files on
    the disk surpasses the lower value (cache_swap_low), Squid starts to delete files
    from the disk and when the second value (cache_swap_high) is reached despite this,
    files are deleted more aggressively. The default values 90/95 should be suitable
    for most purposes.


    +   - maximum_object_size. Objects (files) that are larger than this are not cached
    on the hard disk. The default value is 4096 (4 MB).'
  merge: -1
  img_proc: true
- pgno: 270
  md: '+   **minimum_object_size.** Objects (files) that are smaller than this value
    are not cached at all. The default value is 0 (0 KB).


    +   **maximum_object_size_in_memory.** Objects (files) that are larger than this
    value are not cached in the RAM cache. This value should be kept large enough
    that frequently requested objects can be stored in the RAM cache.


    +   **ipcache_size, ipcache_low, ipcache_high.** Squid caches the name resolution.
    These parameters determine how many IP addresses are cached (ipcache_size), when
    Squid starts to remove IP addresses from the cache (ipcache_low), and when this
    is done more aggressively (ipcache_high). The latter two are percentages with
    default values of 90 and 95, respectively.


    # # Log Files and Cache Directories Tags


    You can set the following tags:


    +   **cache_dir.** This tag determines where and how Squid caches data on the
    hard disk.


    This tag uses the following format


    ```

    cache_dir storage_format dir size L1-dirs L2-options

    ```


    +   **storage_format.** Determines which method Squid uses to store data on the
    hard disk. The default is ufs, which is the traditional Squid storage method.
    Other possible methods, such as aufs, are documented directly in the Squid configuration
    file.


    +   **dir.** Determines the directory where Squid stores its cache files. In the
    default configuration, Squid uses /var/cache/squid.


    +   **size.** The size parameter sets a limit on how much disk space can be used
    for caching—by default this is 100 MB.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# SUSE Linux Enterprise Server 10: Security


    +   - **L1-dir.** Squid spreads the cached data over several directories and subdirectories.
    This has the advantage of searching for data is much quicker because directories
    with fewer file entries can be searched faster than directories which contain
    many files. L1-dir specifies the number of directories Squid can create on the
    first level of caching directory.


    +   - **L2-dir.** The number of directories that Squid can create under each of
    the L1 directories.


    The default values for these parameters are 16 L1 directories and 256 L2 directories.


    +   - **options.** The options parameter can be used to pass options to Squid
    that are specific for the storage method used. The storage methods itself, these
    options are documented directly in the Squid configuration file.


    A default configuration for `cache_dir` looks like


    ```

    cache_dir ufs /var/cache/squid 100 16 256

    ```


    +   - **cache_access_log.** Determines where Squid stores the access log file.
    All client requests are logged in this file. The default location is `/var/log/squid/access.log`.
    Use the value **none** to disable logging.


    +   - **cache_log.** Specifies where Squid stores the cache log file. This file
    is used to log nonclient-specific information about the Squid cache. The default
    location is `/var/log/squid/cache.log`. Use the value **none** to disable logging.


    +   - **cache_store_log.** Defines the file where activity is logged. This file
    contains information on which files were deleted from the cache, and for how long
    they were stored. Because there is no program available to analyze this log, it
    can be deactivated with the entry **none.**


