- pgno: 331
  md: '# SUSE Linux Enterprise Server 10: Security


    The following is an example session of using the ftp command with

    socksify:


    ```

    geeko@da10:-> socksify ftp ftp.suse.com

    geeko@10.0.0.1:1080 sockpassword:

    Connected to ftp.suse.com.

    220 "Welcome to the SUSE ftp server: Please login as user ''ftp''

    Name (ftp.suse.com:geeko):

    ```


    As you can see, the ftp command is called with the help of the

    socksify script. In the example, the sockd server has been

    configured with user authentication; therefore, a prompt for the

    password is displayed.


    By default, the current user ID is used to log to the proxy.

    can adjust this by setting the environment variables

    OCKS_USERNAME AND SOCKS_PASSWORD:


    ```

    geeko@da10:-> export SOCKS_USERNAME = "tux"

    geeko@da10:-> socksify ftp ftp.suse.com

    tux@149.44.174.220:1080 sockpassword:

    Connected to ftp.suse.com.

    220 "Welcome to the SUSE ftp server: Please login as user ''ftp''

    Name (ftp.suse.com:geeko):

    ```


    You can also use socksify with KDE applications by enabling

    OCKS support in the Konqueror configuration dialog under

    Proxy. Although you configure it in Konqueror, SOCKS support is

    available for almost all KDE applications.


    On the SOCKS tab, you can enable the SOCKS support by selecting

    the option Enable SOCKS Support. This way it is not necessary to

    start a KDE application with the socksify script. The SOCKS

    network code is used automatically and can also be configured in

    /etc/socks.conf.


    After you have adjusted the settings in Konqueror, you should

    restart KDE to make sure that all applications and background

    processes are running with the correct settings. (At the time of this

    writing, there was no authentication support for SOCKS in KDE

    (version 3.5.1)).


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
