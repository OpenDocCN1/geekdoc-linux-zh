- pgno: 213
  md: '# Objective 4 Secure Clients


    Today it is not enough to secure the servers in a corporate network. The clients
    are no longer just a target of viruses. Despite a firewall worms can be brought
    into the network via notebooks while infected while directly connecting to the
    Internet. Hacked web sites can be used to install malware on the clients using
    vulnerabilities of web browsers. Wireless access cards can open ways into the
    corporate network bypassing the firewall.


    Currently most of the attacks target clients running Microsoft Windows. Such attacks
    are facilitated by the fact that under Windows, far too many users use an account
    with administrative privileges for their day-to-day work.


    However, attacks that are based on vulnerabilities of browsers could well on clients
    running Linux. This is another reason to use the root account when really needed
    for administrative work. The limited privileges of a normal user prevent major
    damage to the operating system installation on the computer.


    Some actions to take are


    +   - Educating users not to open attachments without thinking about possible
    consequences.

    - Updating virus scanners on the client computers.

    - Patching security vulnerabilities of web browsers as soon as possible.'
  merge: -1
  img_proc: true
