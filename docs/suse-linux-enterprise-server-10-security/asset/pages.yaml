    \ the IP address 0.0.0.0/0 to allow any request.\n\nThis is possible at this stage\
    \ because unwanted connections have already been blocked by the previous client\
    \ rule.\n\n+   3. In the socks-rule, the log command is used to log connections\
    \ and errors.\n\nTo add user authentication to the server config, you have to\
    \ use the method keyword in a client-rule or socks-rule.\n\nThe following enables\
    \ PAM authentication in a socks-rule:\n\n```\npass {\n  from: 0.0.0.0/0 to: 0.0.0.0/0\n\
    \  method: pam\n  protocol: tcp udp\n}\n```\n\nAny authentication method used\
    \ in a rule must also be enabled in the general server configuration.\n\n# CNI\
    \ ONLY-1 HARDCOPY PERMITTED\n\n8-66\nCopying all or part of this manual, or distributing\
    \ such copies, is strictly prohibited.\nTo report suspected copying, please call\
    \ 1-800-PIRATES.\nVersion 1"
