- pgno: 382
  md: "# AIDE\n\nAIDE (Advanced Intrusion Detection Environment) works in two\nstages:\n\
    \n+   - First, AIDE builds a database of checksums (MD5 and others)\nand other\
    \ information on files in the file system.\n\n+   - At a later date, the database\
    \ is compared with the file system\n and any differences are noted.\n\nBefore\
    \ building the database, you need to determine which files to\nmonitor and you\
    \ need to modify the configuration file\n/etc/aide.conf accordingly.\n\nThe configuration\
    \ file lists which directories, files, and properties\nto be monitored.\n\nThe\
    \ upper part of the file defines some general variables:\n\n```\n### Configuration\
    \ parameters\nndatabase=file:/var/lib/aide/aide.db\ndatabase_out=file:/var/lib/aide/aide.db.new\n\
    verse=1\nreport_url=stdout\nwarn_dead_symlinks=yes\n```\n\nThe custom rules define\
    \ what properties are monitored.\n\nThe significances of the letters (such as\
    \ p, i, and n) are explained in\nthe man page for aide.conf."
  merge: -1
  img_proc: true
- pgno: 383
  md: 'After that, the files and directories to be monitored or to be

    excluded from monitoring are listed:


    ```

    # Custom rules

    #

    Binlib          = p+i+n+u+g+s+b+m+c+md5+shal

    ConfigFiles     = p+i+n+u+g+s+b+m+c+md5+shal

    Logs           = p+i+n+u+g+S

    Devices        = p+i+n+u+g+s+b+c+md5+shal

    Databases      = p+i+n+u+g

    StaticDir      = p+i+n+u+g

    ManPages       = p+i+n+u+g+s+b+m+c+md5+shal


    #

    # Directories and files

    #

    # Kernel, system map, etc.

    /boot                                         Binlib


    # watch config files, but exclude, what changes at boot time, ...

    !/etc/mtab

    !/etc/lvm*

    /etc                           ConfFiles


    # Binaries

    /bin                          Binlib

    /sbin                         Binlib


    # Libraries

    /lib                          Binlib


    # Complete /usr and /opt

    /usr                          Binlib

    /opt                          Binlib


    # Log files

    /var/log$                     StaticDir

    #/var/log/aide/aide.log.([0-9])?(.gz)?  Dat

    #/var/log/aide/error.log.([0-9])?(.gz)? Databases

    #/var/log/setuid.changes.([0-9])?(.gz)? Databases

    /var/log                      Logs

    ...

    ```'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'After completing the final software installation and configuration, but before
    connecting to the outside network, you have the program build the initial database:


    ```

    da10:~ # aide --init

    ```


    To avoid manipulation of the database /var/lib/aide/aide.db new by an intruder,
    you should store it elsewhere, not on the computer itself. You can burn it on
    a CD-ROM, together with the version of the AIDE binary from the installation media.


    This database has to be updated after each software installation or software update
    to reflect the current state of the installation. If, at a later date, the files
    are checked, the program is run and the current files are compared with that database
    which is copied to /var/lib/aide/aide.db.


    Any changes to programs and deleted or added files in the monitored directories
    are shown. The amount of information displayed on the value of verbose in the
    configuration file.


    ```

    da10:~ # aide --check

    AIDE found differences between database and filesystem!!

    Summary:

    Total number of files=16141,added files=1,removed files=0,changed files=0

    ```


    The above shows the output with verbose=1. Increasing this value causes AIDE to
    give much more detailed information.


    Another well known program for host-based intrusion detection is Tripwire. AIDE
    offers more or less the same functionality and the configuration is similar to
    the Tripwire configuration.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# rpm


    Using rpm (RPM Package Manager), you can check the integrity of files installed
    from rpm packages.


    Verifying the integrity is done by entering


    ```

    rpm -V

    ```


    This check relies on the MD5 hash of the files, file size, permission, file type,
    owner, group, and modification time. These values are compared with the values
    in the rpm database.


    RPM is no replacement for AIDE, as AIDE monitors properties, uses several hash
    algorithms, and is not limited to files contained in rpm packages.'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# Objective 3 Network-Based Intrusion Detection


    Network-Based Intrusion Detection

    nven available patches are sometimes not applied—not necessarily

    due to neglect, but because of interoperability, support, or legal

    issues of other software.


    That can put you in a tight spot: Not installing the patch might make

    your system vulnerable, but installing the patch might mean losing

    support.


    One approach is to put such computers into separate subnets

    protected by firewalls. Another approach is to install an intrusion

    detection system (IDS) that ideally detects an attack and alerts you

    before it can cause actual harm.


    Intrusion detection involves monitoring the network traffic in

    various ways. It ranges from detecting new network cards in the

    network to monitoring the traffic running across the wire.


    Each method has its strengths and weaknesses and none can

    guarantee to detect every attack.


    The following topics are described:


    +   - snort

    - arpwatch

    - Argus

    - scanlogd

    - Honeypots'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# snort


    snort is an intrusion detection system (IDS) based on attack signatures. It is
    the most sophisticated open source IDS available. It scans the network traffic
    for any pattern of a known attack via the network.


    You need to connect the computer running snort to the network in a way that it
    can “see” the network traffic, like to the monitor port of a switch. An advantage
    of snort is that you can monitor an entire network with one host.


    Depending on where you place the computer (outside or inside the firewall), you
    will get more or fewer alerts.


    Known attacks can be detected and the ability to detect unknown attacks is limited.


    Similar to a virus scanner that needs up-to-date signatures, it is necessary to
    use up-to-date snort rule sets. Snort.org offers a paid subscription to obtain
    rules as soon as they are developed. Registered users can obtain these five days
    later for free.


    Providing you have the necessary know-how, you can also write rules yourself.


    Basic configuration is done in /etc/sysconfig/snort and /etc/snort/snort.conf.
    The rules are also kept in /etc/snort/


    Snort is started as a daemon with the start script in /etc/init.d/snort.


    snort -? lists available options.


    Depending on the configuration, snort writes to syslog, a separate log file, or
    sends winpopup messages to certain hosts.


    For further information, visit the Snort web site at http://www.snort.org.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_387_0.png)'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# arpwatch


    arpwatch monitors the ARP (Address Resolution Protocol) traffic and detects new
    MAC addresses in the network as well as IP address changes. These are reported
    by email and in the syslog.


    When started, arpwatch builds up a database of MAC addresses and the IP addresses
    associated with them. Later changes are detected using this database.


    arpwatch is useful for detecting new hardware, as a rogue notebook connected to
    the network in violation of the company’s security policy.


    However, if DHCP is used in the network, arpwatch produces a lot of alerts that
    probably have no significance.


    # Argus


    Argus (Audit Record Generation and Utilization System) is designed to track and
    report on the status and performance of all network transactions seen in a data
    network traffic stream.


    It does not monitor the content of connections, but it does monitor the connections
    that exist between various hosts.


    While its purpose is comprehensive IP network traffic auditing in general, it
    can also be used to find out about connections that violate security policy.


    To see all network traffic, the computer running argus has to be connected to
    the monitoring port of a switch or to a hub at a suitable place in the network


    Argus runs as a daemon and collects its information in a file that can become
    rather big, depending on the amount of network traffic. In extreme cases it could
    fill up the local hard disk if not rotated and copied to another location.'
  merge: -1
  img_proc: true
- pgno: 389
  md: "# SUSE Linux Enterprise Server 10: Security\n\nTherefore, we recommend that\
    \ you have a dedicated host running Argus, to avoid any interference from other\
    \ services running on the same computer.\n\nArgus is started and stopped by rcargus\
    \ start and rcargus stop, respectively.\n\nThe information collected by argus\
    \ is written in a binary format. The tool ra is used to generate human-readable\
    \ reports from this file.\n\n```\nda10:~ # ra -r /var/log/argus.log\nStart_Time\
    \      Duration  Flgs  Type    SrcAddr      Sport\nDir             DstAddr   Dport\
    \  SrcPkt Dstpkt DstBytes State\n06-04-20 16:40:42.460324        4.538683 tcp\
    \            10.0.0.10.56117\n->              10.0.0.34.22     33    26    4200\
    \            3883  FIN\n06-04-20 16:40:42.577498                .000666      udp\
    \    10.0.0.34.32771\n<->             10.0.0.24.53      1     85            171\
    \  ACC\n```\n\nFilter expressions can be passed to ra, limiting the output to\
    \ the connections of interest.\n\nLet's assume your database server 10.0.0.100\
    \ is only supposed to be accessed by web server 10.0.0.200. The following command\
    \ would list all forbidden connections to and from 10.0.0.100 from other hosts:\n\
    \n```\nda10:~ # ra -r /var/log/argus.log -nn host 10.0.0.100 \\\n      and not\
    \ host 10.0.0.200\n```\n\nFor more information on Argus, visit http://www.qosient.com/argus/.\n\
    \n![](img/ebd0b66532100449f2a48e48fa2ec8ce_389_0.png)\n\n# CNI USE ONLY-1 HARDCOPY\
