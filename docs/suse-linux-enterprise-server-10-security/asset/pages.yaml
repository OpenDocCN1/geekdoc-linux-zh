- pgno: 22
  md: '# Exercises


    The exercises in this course consist of a description of the exercise, and step-by-step
    instructions on how to solve the task.


    You should first try to solve the task described on your own, based on what is
    covered in the manual in the respective section. Resort to the step-by-step instruction
    only if you feel unable to solve the task or to find out if what you did was correct.


    # Exercise Conventions


    When working through an exercise, you will see conventions that indicate information
    you need to enter that is specific to your server.


    The following describes the most common conventions:


    +   - italicized/bolded text. This is a reference to your unique situation, such
    as the host name of your server.


    For example, if the host name of your server is da10, and you see the following:


    **hostname.digitalairlines.com**


    you would enter


    **da10.digitalairlines.com**


    +   - **10.0.xx**. This is the IP address that is assigned to your SLES 10 server.


    For example, if your IP address is 10.0.0.10, and you see the following:


    **10.0.0.xx**


    you would enter


    **10.0.0.10**


    +   - **Select.** The word *select* is used in exercise steps to indicate a variety
    of actions including clicking a button on the interface or selecting a menu item.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '+   * **Enter and Type.** The words *enter* and *type* have distinct meanings.


    The word *enter* means to type text in a field or at a command line and press
    the Enter key when necessary. The word *type* means to type text without pressing
    the Enter key.


    If you are directed to type a value, make sure you do not press the Enter key
    or you might activate a process that you are not ready to start.'
  merge: -1
