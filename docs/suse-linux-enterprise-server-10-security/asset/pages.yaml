- pgno: 178
  md: '# SECTION 5 Network Security


    When a certain service is being offered to users on the Internet or in the local
    network, the servers have to be accessible to fulfill their purpose. However,
    they then are also accessible to people who plan to abuse the service for other
    purposes, like sending spam, launching distributed denial of service attacks,
    or gaining access to confidential information.


    Your task is to prevent abuses while at the same time offering legitimate users
    all necessary features.


    This section covers general security aspects of different technologies and protocols.
    It also discusses general procedures used to secure network services, such as
    controlling access or using cryptographic means.


    # Objectives


    +   1. Understand Services and Protocols

    2. Secure Access with TCP Wrapper

    3. Use SSL to Secure a Service

    4. Secure Clients'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Understand Services and Protocols


    Within a network, several different protocols are used to offer all kinds of services.
    They all have their own security strengths and weaknesses, which are covered briefly
    in this objective:


    +   - Infrastructure

    - Remote Access

    - RPC-Based Services

    - Email

    - The World Wide Web

    - File Transfer

    - Wireless Networks


    # Infrastructure


    Infrastructure refers to services closely associated with running and managing
    the network itself.


    These are


    +   - DNS

    - DHCP

    - SNMP

    - NTP'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# DNS


    DNS (Domain Name System) holds the mapping from names to IP addresses and vice
    versa. Because of this information, a DNS server is a worthwhile target for a
    potential attacker, who can create detailed network plans from DNS information.


    If someone manages to manipulate address and name allocation in DNS for an attack,
    an attacker can slip into the role of a friendly system (DNS spoofing) and then
    possibly be able to use certain services through a firewall (this assumes the
    firewall relies on name resolution when checking connections). Through DNS spoofing,
    queries to a web or mail server can be diverted to other servers. This is why
    DNS must be carefully managed.


    Care should always be taken that the only information that gets outside is information
    that is supposed to be. A DNS server that administers internal zone information
    and at the same time provides the external zone information is not a good idea—internal
    DNS and external DNS should remain separate from one another. If you do not want
    to use two computers, two instances of B9 can be started on one computer.


    If the Internet connection provides a DMZ for servers that offer services to the
    outside, the external DNS is positioned inside the DMZ.


    DNS servers provide their service on port 53 UDP and TCP. In general, queries
    from clients are initially made to UDP and UDP port 53. The server then answers
    from UDP port 53 to an unprivileged UDP port (1024 and higher) of the client making
    the request.


    When using a static packet filter, this means all UDP packets with source port
    53 addressed to ports 1024 and above have to be allowed.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'You can mitigate this by using a stateful packet filter that allows inbound
    UDP packets only after observing a suitable outbound packet. If you use your own
    name server as forwarder to the ISP''s nameserver, you can create even stricter
    rules that allow DNS traffic only between your local and its nameserver. Clients
    within your network would use your nameserver for name resolution.


    If the UDP communication is faulty or down, the DNS protocol makes provisions
    for an automatic fallback to TCP. While DNS should still function when the high
    UDP ports are blocked by packet filters, the performance will suffer considerably.


    As a remedy to fix the problems of spoofed DNS records, DNSsec was developed.
    It relies on digitally signed DNS entries and transfers. Due to various unresolved
    practical aspects, like signing the records of a huge zone like .com, DNSsec is
    hardly used.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_181_0.png)


    > Configuration of DNS is covered in detail in 3074 SUSE Linux Enterprise Server
    10: Networking Services.


    # DHCP


    DHCP (Dynamic Host Configuration Protocol) ought to be used by every administrator
    who looks after a network or the computers in a network. It allows you to store,
    administer, and distribute the network settings (such as IP address, router, and
    name server) for all clients centrally. Installing a new client means setting
    the default setting for the network interface and everything else will be care
    of automatically each time the machine is rebooted.


    DHCP servers should only be reachable from the intranet, because an attacker who
    accesses the information contained in the DHCP configuration can draw up a very
    detailed network plan. A DHCP daemon offers its service on UDP port 67 and the
    client uses ports 68; both must be blocked by firewalls to the Internet.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Within ISC (Internet Systems Consortium, http://www.isc.org/) DHCP daemon configuration
    it is possible to assign host-specific IP addresses based on the MAC address of
    the network card. Furthermore, it is possible to specify the host name instead
    of the IP address for a specific host.


    This is convenient because, when IP addresses are changed, it is sufficient to
    maintain the DNS database. The DHCP server will get the corresponding IP addresses
    for the host name from the DNS server when the DHCP daemon is started. The next
    time the client requests an IP address, he is assigned the new address.


    One danger frequently mentioned in connection with DHCP is the possibility that
    an intruder could occupy all dynamic addresses of an IP address pool, preventing
    the clients for which these IP addresses are reserved from reaching the network.


    This is a classical denial of service attack. However, it does not work if the
    clients are assigned their IP addresses depending on their MAC address. Admitted,
    MAC address spoofing is also possible, but as an attack it is much less effective—the
    attacker would have to try too many addresses for his hit to have any effect.


    In another scenario, a laptop is connected by a stranger to a data socket in the
    company and immediately integrated into the network without the stranger needing
    to know anything about the network. In this context, it is important to mention
    that no stranger anywhere in the company should be unaccompanied and able to find
    a patched data socket to which he could connect a notebook.


    If you have a switched network, it is worth thinking about activating port security
    on the switches so each switch will only accept the same MAC address on the same
    port.


    Configuration of DHCP is covered in detail in couse 3074 SUSE Linux Enterprise
    Server 10: Networking Services.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# SNMP


    SNMP (Simple Network Management Protocol)—ports 161 and 162) controls various
    network components—computers, routers, switches, etc. SNMP collects status information,
    such as configuration or network traffic information, from these devices. It can
    also be used to change the configuration of these devices, making network management
    much easier.


    The main issue with SNMP is that the widely used version 1 uses no encryption
    and no authentication. Access depends on the knowledge of the so-called community
    string, which for read access in many cases is the string “public.” Depending
    on the circumstances, the leaked information might be sensitive. Write access
    is usually secured with a different community string, but this string is transmitted
    in cleartext in version 1. Version 3 is much more secure, but not yet in wide-spread
    use.


    Due to these properties of SNMP, it must be blocked at the firewall and can only
    be used within local networks secured.


    # NTP


    NTP (Network Time Protocol) ensures that all computers have the correct time,
    which is received from an authoritative time source, such as an atomic clock,
    GPS, or a time server on the Internet.


    Various services require synchronized time between computers to function properly.
    Some depend on it for proper function, like Novell eDirectory, or remote authentication
    using time-based tokens. Others needs to enforce rules, like allowed logon hours.
    Having the same time on all machines is also necessary to be able to match events
    in log files on different computers.


    If any of these services are critical for you, then NTP is critical, too. To prevent
    bogus time sources from changing time settings in your network, ntpd servers can
    be authenticated using keys.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'Configuration of NTP daemon is covered in detail in course 3073 SUSE Linux
    Enterprise Server 10 Advanced Administration.


    # Remote Access


    In remote access, several techniques are used to access one computer from another,
    either to log in or to run single commands.


    The most common are


    +   - Telnet

    - r-Tools

    - SSH


    # Telnet


    Telnet provides terminal access to a machine. The user is prompted for a user
    name and password which are both transmitted in cleartext. The same holds true
    for the ensuing communication between client and server.


    Because cleartext passwords should be avoided as much as possible, disable Telnet
    on all machines.


    If you have to offer telnet for some reason, consider implementing one-time passwords.
    However, this does not protect the session itself.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# r-Tools


    The r-tools provide a functionality similar to telnet plus the execution of single
    commands without a terminal on the remote machine and the copying of files. Under
    certain circumstances (appropriate entries in the file /etc/hosts.equiv or in
    a user''s ~/.hosts file), it is not even required to enter a password. All transmissions
    are unencrypted.


    Due to the lack of any security mechanism worth mentioning, the r-tools should
    not be used.


    # SSH


    SSH (Secure Shell) can and should replace telnet and the r-tools in any network.
    It allows you to log in to other hosts and execute commands (ssh), as well as
    the secure copying of files (scp). An interface similar to a command line ftp
    client is also available (sftp).


    ssh has many features and options, including


    +   - Authentication using user name and password or public/private keys

    - X11 forwarding

    - Port forwarding


    ssh is a very powerful tool. You should be aware that it can be used to tunnel
    practically anything through your firewall. It requires a computer in the Internet
    where you have ssh access. If your corporate security policy forbids accessing
    certain web sites, a user with access to ssh could enter a command like the following:


    ```

    geeko@dalo1:~$ ssh -L 8080:blocked-site.example.com:80

    athome.example.net

    ```'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'If she enters in the address field of the browser

    http://localhost:8080/

    it will bring up the web pages of blocked-site.example.com. With

    the option -D port, ssh works as a socks proxy.


    ```

    geeko@da1:-> ssh -D 8080 athome.example.net

    ```


    Configuring the browser to use localhost port as socks proxy

    access to any website that can be accessed from the computer

    ssh tunnel ends on, no matter what the local firewall rules state. In

    case port 22 is blocked on the firewall, this works through an

    HTTPS proxy as well, as explained in “Use Squid to Tunnel

    Connections” on page 8-34.


    In short, ssh can be used by internal users to overcome most of the

    restrictions a firewall puts on them. As long as you allow HTTPS

    and ssh is available, you usually cannot absolutely enforce your

    limits, short of completely crippling your Internet access.


    If your security policy allows internal users to access only a limited

    number of services on the Internet, you will have to educate your

    users on the consequences of violating the security policy (including

    the possible consequences for their employment if there are any);

    beyond that, you will have to trust them.


    The configuration of the ssh daemon and the ssh client is covered in detail

    course 3072 SUSE Linux Enterprise Server 10 Administration.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_186_0.png)'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# RPC-Based Services


    Sun’s RPC (Remote Procedure Calls) protocol underlies various services, like -


    +   - NIS


    +   - NFS


    The portmapper daemon plays a central role for RPC services. When an RPC-based
    server starts, it binds to a port and registers its service and port with the
    portmapper. A client that wants to connect to a server first connects to the portmapper
    (port 111) to find out the port of the server. In a second step, it connects to
    the server itself.


    Except for NFS, which usually runs on port 2049, the ports used by RPC-based services
    are more or less random.


    Any host can query the services offered by a server using the command rpcinfo.
    To hide this information from a potential attacker as well as to protect the RPC-based
    services and their weaknesses, the portmapper, NIS, NFS, and other RPC-based services
    should never be offered to the Internet and their ports should be blocked on the
    firewall.


    Access to the portmapper can be controlled by TCP wrapper and the files /etc/hosts.allow
    and /etc/hosts.deny.


    # NIS


    NIS (Network Information Service) is used to distribute various databases over
    the network to the clients. Among these are files like /etc/hosts and /etc/services,
    but also the files /etc/passwd and /etc/shadow. This allows central user administration,
    but the password hashes are transmitted over the network. ypcat passwd allows
    you to view the hashes and a password cracker like John (http://www.openwall.com/john/)
    allows dictionary attacks on them.


    If you use NIS at all, block it on the firewall. It is best to replace NIS with
    an LDAP server secured by SSL.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# NFS


    NFS (Network File System) is very common in Linux/UNIX environments. It is possible
    to limit on the server which clients can access the file system exported by NFS
    based on the IP of the client, but beyond that there is no authentication.


    NFS uses port 2049, but other components of NFS (like lockmgr and mount) use random
    ports. You should limit access to these ports to internal hosts with the firewall
    blocking any NFS-related traffic.


    On the NFS client side, we recommend that you do not trust an NFS server blindly;
    instead, take the following precautionary measures.


    +   - NFS mounts should always be mounted with the nosuid option.


    SUID programs installed on network drives are then much less threatening. nosuid
    is especially important if the NFS server is administered by another administrator
    who does not have root permissions on your own systems. They could obtain root
    privileges on the client via an SUID program installed on the server as root and
    run as a normal user on the client.


    +   - NFS clients are made even more secure if the remote file systems are mounted
    with the option noexec, because then no programs can be started from the network
    drive.


    However, this might not always be practical, for example, when the directories
    /opt or /usr are mounted via the network. In these cases you will have to mount
    them without noexec.


    The essential factor on the NFS server side is the decision whether root on the
    NFS client is trusted.


    +   - Because no normally maintained system, whether it is a Linux or non-Linux
    one, keep normal users away from root privileges with absolute certainty, assume
    that a user can obtain root privileges without the knowledge of the administrator,
    root on clients is therefore fundamentally not trusted and, with NFS accesses
    to NFS servers, is degraded to the user nobody by means of the option root_squash
    in the file /etc/exports on the server.


    # CN USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'A user who has illegally become root cannot be prevented from assuming every
    available user ID on the client by using the command su username. In certain cases
    (for example, on installation servers), it makes sense to convert all users to
    nobody by means of the option all_squash.


    # Email


    Email is one of the most complex services to administer. Several components have
    to work together to ensure email is delivered properly, errors are cared for,
    and no mail is lost.


    Several protocols and programs are involved:


    +   - SMTP

    - POP3 and IMAP

    - GPG/PGP


    # SMTP


    SMTP (Simple Mail Transfer Protocol) is used to get email from the mail client
    to the mail server and from one mail server to the next until the mail server
    in charge of the recipient''s mail is reached. SMTP is a cleartext protocol that
    does not, at least in its simple form, include authentication. There is no check
    of the sender’s identity—anyone can impersonate anyone.


    In the early days of the Internet this was adequate; it provided some protection
    from breakdowns. If one mail server was down, another could take the load. Due
    to these characteristics, this service is easily abused by spammers. In the past
    they mainly used open relays, mail servers that accept mail from anyone to anyone,
    to send their unsavory email.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'To solve the obvious problems, several measures were taken. ISPs developed
    SMTP after POP, allowing customers to send mail after fetching their mail with
    a user name and password. Furthermore the SMTP protocol was extended to allow
    authentication with a user name and password. This has now widely replaced the
    SMTP-after-POP mechanism. Open relays are usually put on black lists and their
    administrators are urged to administer their machines properly.


    These various actions took care of the open relays, but the spammers found other
    ways to fill the mailboxes with junk. Today probably most of the spam is from
    home computers infected by worms and under the control of someone else other than
    the owner.


    Thousands of computers form a botnet with a combined bandwidth that is impressive.
    While these botnets are mostly composed of home computers, this does not mean
    that the administrator of a corporate network can relax.


    Desktop computers can become infected, by a virus that comes via email or some
    infected notebook that is connected to the internal corporate network. Spam sent
    from a corporate network can be embarrassing and even cause legal problems.


    While you might not be able to guarantee such an infection is never going to happen
    in the network you are in charge of, you can at least prevent the propagation
    of such viruses or worms. You can


    +   - Block packets with destination port 25 from the internal network to the
    Internet .


    Because some ISPs blocking traffic to port 25 (with the exception of the ISPs
    mailserver), your external staff might not be able to access the corporate mail
    server to send mail while they are travelling. Due to this, you should consider
    offering SMTP services for them on the submission port (587) and/or SMTPS port
    (465).


    +   - Use authentication even on your internal mail servers.


    +   - Use TLS and authentication for the email servers accessible from the Internet.


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '+   - Use antivirus software on the mail server and the desktops.


    +   - Educate your end users not to open attachments indiscriminately.


    # # POP3 and IMAP


    POP3 (Post Office Protocol version 3) (port 110) and IMAP (Interactive Mail Access
    Protocol) (port 143) are used by the recipient to access mail that has been delivered
    to the destination mail server.


    While POP just copies the mail to the client machine (usually deletes it on the
    server), mail usually stays on the mail server when the protocol IMAP is being
    used.


    The main issue with both protocols is that the user name and password are transmitted
    in cleartext. This gives an eavesdropper the opportunity to sniff both. The connection
    can be secured with TLS (POP3S port 995, IMAPS port 993). Adding TLS (Transport
    Layer Security) encryption to POP3 is covered later in this section, in the objective
    “Use SSL to Secure a Service” on page 5-30. IMAP can be secured in the same way.


    # # GPG/PGP


    Even if you secure the transmission of the email between server and client, this
    has no effect on the mail message itself. The communication between mail servers
    in the Internet is unencrypted, as is the mail while it is waiting on the mail
    server to be picked up. The solution to this is end-to-end encryption, using GPG
    or PGP. GPG was covered in the previous section, “GNU Privacy Guard (GPG)” on
    page 4-36.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# The World Wide Web


    For many people, World Wide Web and Internet are synonymous. The popularity of
    the Internet can largely be attributed to the World Wide Web.


    From a security standpoint, you must look at both sides:


    +   - WWW Server

    - WWW Client


    # WWW Server


    Web servers are a very popular target for several reasons:


    +   - Defacing the main page of a company brings fame to the hacker and embarrassment
    to the affected company.

    - Installing content on web servers, like manipulated graphic files, that exploit
    vulnerabilities of client browsers allows criminals to get control of the client
    computers of those visiting the web site.

    - E-commerce sites are built on databases that contain personal information on
    their customers, often including credit card details. These are very valuable
    targets for criminals.

    - The information gathered can then be used to abuse the credit card details or
    to impersonate the customers by using their identity information. In 2005, hundreds
    of thousands of credit card numbers were stolen. To make things worse, the companies
    involved often choose to not inform the affected customers to avoid the loss of
    confidence in their business practices and IT security.


    Web servers have shown various vulnerabilities in the past. All commonly used
    servers (Apache, IIS, and others) were affected at one time or another to some
    degree. Sometimes it''s not the web server itself that is at fault, but extensions
    like CGI scripts or extensions or modules like PHP.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# WWW Client


    Clients are a valuable target, too, for various reasons:


    +   - Most home computers are not administered professionally and an intrusion
    might remain undetected for a longer period of time.


    +   - Personal information (such as financial information and passcodes) that
    can be abused could be stored on such workstations.


    +   - By controlling thousands of home computers with DSL connectivity, an enormous
    bandwidth can be harnessed for dubious means, like spamming, or distributed denial
    of service attacks.


    There are vulnerabilities in browsers that allow a program to be installed on
    a computer without the user doing more than just visiting a web site. Microsoft''s
    Internet Explorer has gained some notoriety in this respect, but other browsers
    like Mozilla, Firefox, and Opera have not been immune either.


    The programs installed can be anything the criminal behind the attack deems useful.
    It could be a key logger to gain access to passwords, a backdoor combined with
    an SMTP engine to send spam, or whatever he dreams up.


    Features, ActiveX, Java, and JavaScript, can also pose a threat. ActiveX controls
    are basically programs like any other that run with the privileges of the user
    running the browser. On Microsoft Windows systems, the user is frequently logged
    in as administrator, which means that an ActiveX program is not restricted at
    all. Java and JavaScript have more restrictions regarding what they are allowed
    to do on a computer, but there were instances in the past of security issues as
    well.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'There is a rather new attack that falls more in the category of social engineering,
    combining email and the web: Mail allegedly from a bank, eBay, Paypal, etc., is
    sent to users, asking them to enter confidential information into some form. However,
    the form is a fake page that looks like the real one, but resides on some other
    server. With the information gathered, the criminal tries to loot the account
    of the user.


    Keeping the software on the client computers up to date and educating the users
    has to be part of the security concept.


    # File Transfer


    Files can be transferred by many different methods. The popular methods are


    +   - FTP

    - Peer-to-Peer Networking


    Other methods include, but are not limited to, TFTP (Trivial File Transfer Protocol)
    and SMB (Server Message Blocks).


    # FTP


    FTP (File Transfer Protocol) differs from many protocols, because it uses two
    connections: The control connection from a high port of the client to 21 of the
    server and from port 20 of the server back to a high port of the client (active
    FTP) or from a high port of the client to a high port of the server (passive FTP).


    Active FTP makes the task of protecting the client much more difficult. When a
    rule on the firewall blocks all incoming connection requests, active FTP is not
    feasible. To allow it, the firewall would have to permit connections from port
    20 to high ports of the clients, making all upper ports accessible from port 20.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'To solve that issue, passive FTP was developed. With passive FTP the FTP administrator
    now has a similar problem, as he has to allow connections from any high port to
    any high port. However, protecting the clients is easier with passive FTP. Browsers
    “speak” the FTP protocol and use passive FTP.


    FTP is widely used for all file transfers over the Internet. When a company offers
    drivers, software, or other large files, it is usually done by FTP. FTP checks
    the user name and password, and both are transmitted in cleartext. FTP with SSL
    support is rarely used; however, ssh offers an FTP-like interface to transfer
    files securely.


    To transfer files without an account, anonymous FTP is used. In this case the
    user name is ftp or anonymous and the password is the email address, which is
    usually not verified. From a security perspective it is important not to allow
    anonymous uploads and downloads of the same files. Servers soon get abused to
    exchange all kinds of illegal files, from music, videos, and pornography to illegal
    software copies. By the same token it is mandatory to keep the server and its
    FTP (and other) software up to date, as a hacked server can be abused for the
    same purpose.


    # Peer-to-Peer Networking


    Peer-to-peer networking has become very popular over the past years. It is controversial
    because most of the files transferred are, according to the music and film industry,
    illegal copies of music and videos.


    On the other hand, there are valuable uses of peer-to-peer networking, like the
    distribution of ISO images via BitTorrent for the Open Source community.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'To keep out of any legal battles, it is advisable for most companies to block
    peer-to-peer networking on the firewall. Because peer-to-peer networking can also
    use up bandwidth, and it is also economical to block it. Another negative aspect
    of peer-to-peer networking involves letting unknown peers access files on your
    computer, which might also violate the security policy. Viruses and worms have
    spread in the past via peer-to-peer networks as well.


    # Wireless Networks


    WLANs do not really fit in the category of protocols and services because they
    concern the link layer. However, as their use becomes more and more widespread,
    their security implications have to be looked at.


    The original standard, IEEE 802.11b, included Wired Equivalent Privacy (WEP) to
    secure the communication. Due to major flaws in the implementation it is possible
    to defeat the encryption if you capture enough WLAN packets. Depending on the
    traffic, this number can be reached within a few hours. Due to improvements in
    the tools to regain the key, this has been reduced to minutes under certain circumstances.


    > A tool used for this purpose is AirSnort, http://airsnort.shmo.com/


    Despite the fact that WEP is no longer secure, several devices still available
    on the market support only WEP. If you have to use a wireless LAN where only WEP
    is available, always use additional encryption, like IPSec for all connections,
    or SSL to protect specific ones.


    The IEEE extended the original standard, now called Wi-Fi Protected Access (WPA,
    and WPA2). It is considered secure, with the only currently known attack being
    a brute force attack on the key.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Objective 2 Secure Access with TCP Wrapper


    The first and foremost measure to secure a service against unintended use is to
    keep the software up to date, as was was covered in “Apply Security Updates” on
    page 2-17.


    There are other general measures that make it harder for a potential attacker
    to gain control over the machine:


    +   - Minimal software installation.

    - No user logins on computers such as web and mail servers users do not need to
    access.

    - Hard-to-guess root password that includes upper case and lower case letters,
    numbers, and special characters, with a minimum length of eight characters.

    - Intelligent partitioning of the hard disks and restrictive file permissions.


    These were covered in Section 2, “Host Security” on page 2-1, and are part of
    general system administration. Beyond those general measures, you can limit access
    to a service to limit the number of potential attackers. While the public web
    site of a company usually should be accessible from everywhere, it might be possible
    to limit the hosts from which access to other services is allowed.


    Access to individual network services can be restricted with the help of the TCP
    wrapper. For standalone services, TCP wrapper support must be compiled into the
    daemon, service, or application. For services started via xinetd, TCP wrapper
    support is part of xinetd.


    To configure TCP wrapper, you need to understand the following:


    +   - The Role of the TCP Daemon

    - Configure Access Controls

    - Check the TCP Wrapper

    - Moles and Trappers'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# The Role of the TCP Daemon


    The TCP wrapper (/usr/sbin/tcpd) in the case of inetd, or the library libwrap.so.0
    in the case of xinetd and programs compiled with TCP wrapper support) acts as
    a filter and is placed between xinetd and the respective daemons.


    The wrapper checks if the connection is allowed. If it is, the actual service
    is started. If not, the wrapper writes the name and address of the host requesting
    the connection to a log file, usually /var/log/messages and, in the case of xinetd,
    also to /var/log/xinetd.log.


    The command ldd can be used to find out if a program is linked against libwrap,
    as in the following is an example:


    ```

    da10:- # ldd /usr/sbin/xinetd

    linux-gate.so.0 => (0xfffffe000)

    libwrap.so.0 => /lib/libwrap.so.1 (0xb7e33000)

    libns1.so.1 => /lib/libns1.so.1 (0xb7ece000)

    libm.so.6 => /lib/libm.so.6 (0xb7ea9000)

    libcrypt.so.1 => /lib/libcrypt.so.1 (0xb7e76000)

    libc.so.6 => /lib/libc.so.6 (0xb7d56000)

    lib/ld-linux.so.2 (0xb7f00000)

    ```


    When the connection between the client and the server program is established,
    the wrapper is deleted from memory and does not create any additional load for
    the current connection.


    However, after an authorized server has started, in some cases it can accept additional
    connections on its own without consulting the wrapper about whether additional
    connections should take place. For example, some UDP services remain in memory
    for a short time after the connection has already been closed in order to receive
    additional connection requests. These services usually can be recognized by having
    wait = yes as part of their xinetd configuration.


    The configuration of xinetd is covered in course 3073 SUSE Linux Enterprise Server
    10 Advanced Administration.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Configure Access Controls


    You can configure access controls for the TCP wrapper by editing /etc/hosts.allow
    (for permitted requests) and /etc/hosts.deny for denied requests.


    When receiving a request, tcppd first reads /etc/hosts.allow. If no matching pattern
    is found, tcppd reads /etc/hosts.deny.


    If you allow access in /etc/hosts.allow, it cannot be restricted again in /etc/hosts.deny.


    If tcppd does not find a pattern that matches the request in either of the configuration
    files, the connection is permitted. The same is if one or both configuration files
    are empty or do not exist.


    The syntax of both configuration files is the same and consists of the following
    three fields:


    ```

    daemon: host [: option : option ...]

    ```


    +   - daemon. The executable of the daemon without its path, like sshd, in.telnetd,
    vsftpd.

    - Note: Because vsftpd is not linked against libwrap, /etc/hosts.allow and /etc/hosts.deny
    have no effect on ftp connection requests when vsftpd runs as a standalone daemon
    (without inetd).

    - host. A list of host names, IP addresses, subnets, or domains, separated by
    commas.

    - option. A list of options.


    In addition, tcppd recognizes the keywords ALL and EXCEPT for both the host and
    option fields, and LOCAL, KNOWN, UNKNOWN, and PARANOID for the host field.'
  merge: -1
  img_proc: true
- pgno: 200
  md: "The following table provides a description of these keywords:\n\n| Keyword\
    \ | Description |\n| --- | --- |\n| ALL | All services and all hosts; exceptions\
    \ can be defined by EXCEPT. |\n| LOCAL | All host names that do not have a dot\
    \ in the name—usually all the host names defined in /etc/hosts. |\n| UNKNOWN |\
    \ All hosts whose names tcpd cannot verify. |\n| KNOWN | All hosts in which the\
    \ host name matches the given IP address and vice versa. |\n| PARANOID | All hosts\
    \ in which the host name does not match the given IP address and vice versa. |\n\
    \nThe following examples show configurations for hosts.allow and hosts.deny that\
    \ permit the use of all network services in the local network but deny external\
    \ computers access to telnet, finger, and ftp:\n\n+   - /etc/hosts.allow:\n  ALL:\
    \ LOCAL\n\n+   - /etc/hosts.deny:\n  in.telnetd, in.fingerd, vsftpd: ALL\n\nThe\
    \ following is an example of a more complex configuration:\n\n+   - /etc/hosts.allow:\n\
    \  ALL: da10.digitalairlines.com\n  ALL EXCEPT vsftpd: da20.digitalairlines.com\n\
    \  vsftpd: da30.digitalairlines.com\n\n+   - /etc/hosts.deny:\n  ALL: ALL"
  merge: -1
  img_proc: true
- pgno: 201
  md: '# SUSE Linux Enterprise Server 10: Security


    The first line in /etc/hosts.allow ensures that all network services can be accessed
    from da10.digitalairlines.com. In the second line, all network services other
    than ftp are made available for da20.digitalairlines.com. The third line ensures
    that only ftp transfers are possible from the host da30.digitalairlines.com.


    In /etc/hosts.deny, all other hosts are denied. ALL also includes services that
    are not started by xinetd but run independent services, and whose access control
    is also implemented by the files /etc/hosts.allow and /etc/hosts.deny. Because
    this applies, for instance, to the portmapper, NFS and NIS would also be affected
    by the above configuration—a possibly unexpected and unintended effect, if, you
    do not consider it, could lead to a long search for the cause of errors. Another
    example is sshd, which is also linked against libwrap.


    If you require more specific control functions, the following table lists some
    of the more commonly used keywords for monitoring


    # Table 5-2


    | Keyword | Description |

    | --- | --- |

    | ALLOW or DENY | You can use these keywords to summarize all the access rules
    in the file /etc/hosts.allow. These options allow or refuse access, respectively.
    |

    | spawn | Runs the given shell script after the placeholders shown in Table 5-3
    are replaced. |

    | twist | The given command is started instead of the daemon specified in the
    first field. Existing placeholders are replaced first. |

    | rfc931 [timeout] | Identifies users attempting to establish a connection. For
    this, a client-side RFC931-compatible daemon is required. If the daemon is not
    present, it can lead to delays in setting up the connection. If no value is given
    for timeout, the default value (10 sec.) is used.


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    5-24 Copying all or part of this manual, or distributing copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES. Version 1'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Table 5-2 (continued)


    | Keyword | Description |

    | --- | --- |

    | banners /directory | Searches in /directory for a file whose name matches the
    daemon to be started. If such a file is found, its contents will be sent to the
    client after the placeholders have been expanded. |

    | nice [number] | The server process is started with the corresponding nice value.
    This can be useful to make more resources available to other server processes.
    |

    | setenv name value | Defines environment variables for the server process. Here,
    too, a placeholder expansion is executed. |


    The following example in /etc/hosts.allow allows telnet access from anywhere:


    ```

    in.telnetd: ALL: banners /etc/tcpd: ALLOW

    ```


    If a file in telnetd is located in the /etc/tcpd/ directory, its contents will
    be sent to the client before the telnet service is started.


    In the following example, finger is only allowed in the local network:


    ```

    in.fingerd: ALL EXCEPT LOCAL: banners /etc/tcpd:

    spawn echo "finger request from %h" | mail -s

    "finger!! root ) : DENY

    ```


    Clients not listed in /etc/hosts with their name (only dots in the hostname) cannot
    access the finger daemon; they are given the information contained in the /etc/tcpd/in.fingerd
    file instead. An email to root is generated that contains the name or IP address
    of the computer making this request.


    The following example starts the ftp daemons with a nice value of 15:


    ```

    vsftpd: ALL: nice 15

    ```


    This enables you to influence the load on a server, for instance, by allocating
    more resources to other services.


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# SUSE Linux Enterprise Server 10: Security


    In the following example, the command echo **“No one logged in”** is started instead
    of the finger daemon:


    ```

    in.fingerd: ALL: twist ( echo "No one logged in" )

    ```


    The client is informed that no one is logged in.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_203_0.png)


    For more information on these and other options, enter **man hosts_access** and
    **man hosts_options.**


    # Check the TCP Wrapper


    Because a command''s flexibility can easily lead to configuration errors, you
    cannot just hope that your network services are secure without testing the configuration
    first.


    The TCP wrapper package offers some tools for troubleshooting as well as for error
    analysis. However, these only work together with /etc/inetd.conf. xinetd is not
    supported.


    You can review the configuration of tcpd using the **tcpdchk** command. This program
    reports a multitude of possible problems; these might be network services listed
    in /etc/inetd.conf that do not really exist, syntax errors in the configuration
    files, or unknown hostnames.


    However, there are some configurations in which tcpdchk does not find any errors
    but where tcpd still does not act as expected. In such cases, you can use **tcpdmatch**
    to provide information about how tcpd would handle various types of access attempts.


    With xinetd, you have to test your configuration by actually establishing various
    connections to see if they are accepted or denied as expected.


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    5-26 Copying all or part of this manual, or distributing such copies, is strictly
    prohibited. To report suspected copying, please call 1-800-PIRATES. Version 1'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Moles and Trappers


    You can enter shell commands in the configuration files, which will be executed
    when the request matches one of the patterns defined in the daemon and host fields.


    Because tcpd recognizes the following placeholders that can be used in shell scripts,
    attempts at accessing certain services can be monitored.


    # Table 5-3


    | Placeholder | Description |

    | --- | --- |

    | %a | IP address of the host making the request. |

    | %c | Information about the host making the request (such as user@host and user@address),
    depending on the information available. |

    | %d | Name of the daemon. |

    | %h | Name of the host making the request or the IP address, if the name cannot
    be determined. |

    | %n | Name of the host making the request, unknown, or paranoid. |

    | %p | The process ID of the daemon. |

    | %s | Information about the server (such as daemon@host and daemon@address),
    depending on the information available. |

    | %u | User name on the host making the request if the remote host does not possess
    a user ID as recognized by RFC 931. |


    The following example shows a script in the configuration file /etc/hosts.allow
    that records all successful access attempts to all services in a log file:


    ```

    ALL: ALL: spawn echo "Access of %u@%h to %d" >> \

    /var/log/net.log

    ```'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'A finger client (/usr/bin/safe_finger) is also included in the TCP wrapper
    to provide better protection against defense measures that other computers might
    have in store when their finger daemons are queried. The idea behind safe_finger
    is to entrap (using simple methods) potential intruders by uncovering their identities
    with a fingerd query, such as the following:


    ```

    ALL EXCEPT in,fingerd : ALL EXCEPT LOCAL : \

    twist /usr/bin/safe_finger -l @% >> \ \

    /var/log/unknown.net.log

    ```


    Excluding itself from this screening process is a measure of caution. If a trap
    including finger were set up remotely as well, an endless loop could result, where
    the finger query of one computer would be followed by a finger query of the other
    in an endless cycle. The workability of this approach is limited, as few computers
    have a finger server running these days; the finger server is needed to get an
    entry in the log file.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Exercise 5-1 Configure the TCP Wrapper


    In this exercise you configure the TCP wrapper and work with a partner to test
    each other’s configuration.


    You will find this exercise in the workbook.


    (End of Exercise)'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Objective 3


    # Use SSL to Secure a Service


    SSL (Secure Sockets Layer) and its successor, TLS (Transport Layer Security),
    can be used to provide encryption for cleartext protocols. Most frequently, SSL
    is used to secure HTTP traffic as HTTPS. But any other protocol that uses a single
    communication channel, like POP3, SMTP, or IMAP, can be protected as well.


    While many server daemons support encryption natively (like Postfix or OpenLDAP),
    others can be secured using stunnel.


    > Do not use stunnel to secure SMTP. Use the STARTTLS functionality available
    within Postfix instead.


    The example used here is the protocol POP3 and the POP server from the package
    qpopper. But the same procedure can be applied when securing IMAP or other services
    that use a single connection for their communication.


    POP3 uses cleartext passwords for authentication. The SSL tunnel protects the
    password as well as the data traffic from being read by eavesdroppers. There is
    no need to change the POP3 server. The package stunnel provides all that is needed
    to secure POP3 with SSL.


    SSL needs a certificate for the server that contains the public key and the name
    of the server. It is used by the client to authenticate the server. While it is
    possible to authenticate the client with a certificate, it is usually not done.
    But you could, as an example, limit HTTPS access to a web server to clients that
    have a certificate and corresponding private key issued by your CA.


    The creation of a RootCA and of certificates is covered in “Create a Certification
    Authority (CA) and Issue Certificates with CLI Tools” on page 4-13 and “Create
    a Certification Authority (CA) and Issue Certificates with YaST” on page 4-24,
    respectively.'
  merge: -1
  img_proc: true
- pgno: 208
  md: "On the server side you need the private key and the certificate containing\
    \ the public key. Depending on the application, the private key can be encrypted\
    \ (for instance, when using it Apache) or it can be unencrypted (for instance,\
    \ when using it with stunnel).\n\nIf you used the OpenSSL command line interface,\
    \ you specified the files for the keys on the command line. To create an unencrypted\
