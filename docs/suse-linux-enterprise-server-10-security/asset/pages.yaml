- pgno: 316
  md: '# Objective 3


    # Configure and Use Dante


    Dante is an open source implementation of the SOCKS proxy protocol. To configure
    and use Dante, you need to do the following:


    +   - Understand SOCKS

    - Install and Configure Dante

    - Configure Clients to Use a SOCKS Server


    # Understand SOCKS


    Application-level OSI gateways provide a secure way to allow internal clients
    to access Internet services. The problem is that the more services need to be
    accessed, the more different application-level gateways need to be installed,
    configured, and maintained; and one application-level gateway is not available
    for every protocol.


    A solution for this problem is provided by the proxy protocol SOCKS defines how
    applications can request a TCP or UDP connection to an outside host from a SOCKS
    server. The SOCKS server then uses a set of rules to decide whether a request
    can be allowed.


    The advantage of SOCKS is that it basically works with every application protocol,
    not just with a specific one. Therefore, SOCKS is not a real application-level
    gateway. It is more like an additional layer between the transport and application
    layers of the ISO/OSI reference model, which allows better access control. SOCKS
    version 5 also implements user authentication, which allows rules based on user
    name and password.


    A SOCKS server does not influence the application data. After a request has been
    allowed, the server passes the data back and forth between the client and the
    destination system. A SOCKS server cannot perform tasks like content filtering
    or caching.


    Also, SOCKS is not transparent to the clients and requires the clients to have
    SOCKS support and to be configured accordingly.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Install and Configure Dante


    Dante is an open source implementation of the SOCKS protocol. It consists of two
    parts:


    +   - SOCKS server (sockd). A server implementing the SOCKS protocol.


    +   - SOCKS client (socksify). A set of system libraries and a script that helps
    to implement SOCKS with clients that do not offer native SOCKS support.


    These components come in separate RPM packages. You need to install the package
    dante-server for the server, and the package dante for the client.


    After installation and configuration, start the server by entering


    ```

    rcsockd start

    ```


    After changing the configuration file, restart the server by entering


    ```

    rcsockd restart

    ```


    To start the server automatically at boot time, enter


    ```

    insserv sockd

    ```


    The configuration for the server is located in the file


    ```

    /etc/sockd.conf

    ```


    The configuration file contains two sections:


    +   - Server settings. This controls the general behavior of the server.


    +   - Rules. This defines the rules that are used to determine whether a request
    is allowed.


    The server settings consist of several variables. A colon (::) is used to separate
    a variable from its value. You can use the # sign to write comments in the file.'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'The following is a list of the most important server settings:


    # Table 8-3


    | Variable | Meaning and Possible Values |

    |---|---|

    | logoutput | This controls where the server sends the logging information.

    This can be

    - syslog

    - stdout

    - stderr

    - A filename

    You can combine two or more options.

    Example: logout: syslog |

    | internal | This option sets the IP address or interface and the port number
    on which the server accepts connections from clients.

    Example: internal: 10.0.0.1 port = 1080 |

    | external | This sets the interface that is used by the server for all outgoing
    connections.

    Usually this is the interface that is connected to the Internet.

    Example: external: 10.10.0.1 |'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Table 8-3


    | Variable | Meaning and Possible Values |

    | --- | --- |

    | method | This option determines the method that is used to authenticate users
    for socks-rules.


    Possible values are

    - **none**. The server does not require any user authentication.

    - **username**. The client needs to provide a user name and a password for authentication.

    In this case, Dante uses the system password file as the user database.

    - **pam**. The same as user name, but Dante uses pam instead of accessing the
    password file directly.

    - **rfc931**. The identity of the user is determined by an ident request as specified
    in RFC 931.


    You can use more than one value in order of preference.


    Example: method: username |

    | clientmethod | Determines the methods of authentication for client rules.


    You can use the same values as for the method variable.

    The terms *socks-rules* and *client-rules* are described later in this section.

    | user.privileged | This determines which user sock should use for privileged
    operations reading the password file.


    Example: user.privileged: root |

    | user.notprivileged | This determines the user ID that sock uses for all other
    nonprivileged operations.


    Example: user.notprivileged: nobody


    The access rules are defined in the second part of the configuration file. There
    are two kind of rules that work at different


