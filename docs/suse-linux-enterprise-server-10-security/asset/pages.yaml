    \ Server | Web Server | Mail Server |\n|---|---|---||\n| Workstation Office |\
    \ 8080 | | |\n| Workstation Web Designer | 8080 | ssh | |\n| Workstation Sysadmin\
    \ | 8080 | ssh | ssh |\n| Mail Server Intranet | | | smtp |\n\nIt is often useful\
    \ to have two columns for individual protocols, matching the two transport directions\
    \ (IN or OUT).\n\n# Analyze the Protection Requirements\n\nAfter you have determined\
    \ the communication demands, you need to analyze the protection requirements for\
    \ the data.\n\nThe expenses for securing individual resources are determined by\
    \ the amount of potential damage that could be caused by an attack, a faulty operation,\
    \ or a natural catastrophe. You should also estimate how often possible damage\
    \ might occur.\n\nTo determine your protection needs, ask yourself the following\
    \ questions:\n\n+   **Which groups of people can access which information?**\n\
    \  Is some information reserved for management, while other information is available\
    \ to all employees?\n\n+   **Where is protected data located?**\n  The degree\
    \ of data protection needed determines the degree of protection for each individual\
    \ computer in the corresponding network."
