- pgno: 86
  md: '# Objective 8


    # Use Logging and Accounting


    While you might consider it the worst case when a computer gets hacked despite
    all your efforts to prevent that, there is one thing even worse: Getting hacked
    and never finding out about it.


    To reduce this risk, use the wide range of logging and accounting facilities of
    SUSE Linux Enterprise Server 10.


    The system administrator must look at these logs regularly or use tools that can
    automate the process. For example, some tools mail a digest of the relevant parts
    of log files to the administrator.


    The main topics in this objective are


    +   - Logging

    - Process Accounting

    - Tools to Automate Checking of Log Files and Other Information


    # Logging


    Following the installation of the system, well-known log files like **/var/log/messages,
    /var/log/mail, and /var/log/wtmp** are available. However, Linux and SUSE Linux
    Enterprise Server 10 offer other less well-known logging and accounting options,
    some of which need to be explicitly installed and activated.


    From the aspect of security, these options can be used to detect unusual system
    activities (such as unusual system load or increased network traffic), or determine
    when certain activities took place.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# System Activity


    SUSE Linux Enterprise Server 10 comes with various tools which help you to monitor
    the system activity. The following is an overview of the most important ones:


    | Tool | Purpose |

    | --- | --- |

    | sysstat | The sysstat package contains tools for documenting system activity.
    Two cron jobs are defined in the file /etc/cron.d/sysstat (created by rcsstat
    start) make sure that the scripts sa1 and sa2 in /usr/lib/sa/ are executed at
    regular intervals. These, in turn, the programs sacd and sar in the same directory
    with suitable options |

    | sacd | sacd (the System Activity Data Collector) is run every 10 minutes by
    the sysstat cron job. The system activity is appended to the file /var/log/sa.currentDate
    in a binary format. This directory contains a file for every day the computer
    was run |

    | sar | Every 6 hours, the activity recorded up to the designated time on the
    designated is converted to a human-readable format by the sar (System Activity
    Report) utility.\nThe result is saved in the file sar.currentDate in the same
    directory in ASCII format. This file contains a number of values for every 10
    minutes, including the processes per second, the CPU load, the amount of data
    transmitted per second, information on the memory and swap usage, and so on.\nThe
    sar utility can also be started from the command line. In this case, it shows
    the CPU load on the designated. The output can be modified by means of various
    options. For example, -A displays all available information. The man pages (man
    sar) describe the other options. |'
  merge: -1
  img_proc: true
- pgno: 88
  md: '| Table 2-2 (continued) | Tool | Purpose |


    | isag | The graphical output of the isag utility is even more informative. The
    format of the file names in the directory /var/log/sa/ is specified with -m sa..
    The desired system activity parameter can be selected under the menu Item Chart.
    |


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_88_0.png)


    | mpstat | On SMP systems, mpstat shows the processor load for the respective
    processor. For example, the load of the first processor can be displayed with
    mpstat -P 0. mpstat is also included in the sysstat package. |


    | iostat | iostat delivers CPU usage and I/O statistics. This tool is very useful
    in monitoring hard disk activity. iostat is also included in the sysstat package.
    |


    | vmstat | vmstat also delivers various CPU memory and swap space usage statistics.
    This utility is included in the ps package. |'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Process Accounting


    Process accounting is another aspect of system monitoring. It focuses on process
    and user activity. The following tools are available on SUSE Linux Enterprise
    Server 10.


    | Table 2-3 | Tool | Purpose |

    |---|---|---|

    | last | By default, every Linux system logs user logins and logouts in /var/log/wtmp
    displays the content of /var/log/wtmp in human-readable form. |

    | package acct | The detailed logging of all processes started on a machine is
    rather uncommon, mainly because the information is usually not needed and because
    of the substantial amounts of data that are generated by such an action. However,
    special requirements might dictate the documentation of every single started process.
    The acct package contains the needed tools. |

    | ac | The ac utility enables an interpretation of the file /var/log/wtmp in terms
    of login times. For more information, see the man page of ac. |

    | accton | The process accounting is activated by starting accton and specifying
    the file to which the accounting information is to be written (normally /var/account/pacct).
    It is stopped by executing accton without any parameters. The script /etc/init.d/acct
    executes the above-mentioned accton commands without starting any daemons. By
    entering isserv acct, accton is started automatically at boot time. |'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Table 2-3 (continued)


    | Tool | Purpose |

    |---|---|

    | lastcomm | The lastcomm utility interprets the file /var/account/pacct, which
    is not human-readable.<br><br>If executed without any parameters, it displays
    all previously entered commands listed in the file.<br><br>If a user name or a
    command is specified, only the lines containing the user name or the command are
    displayed. | sa | sa (summarizes accounting) provides a summary of the accounting
    information. (sa has nothing to do with the above-mentioned utilities sar and
    sadc.)<br><br>If you do not use any options, sa delivers summarized information
    on virtually executed commands.<br><br>The option -u lists the users who executed
    the programs, and -m returns the sum of various values per user. |


    # Tools to Automate Checking of Log Files and Other Information


    The sheer volume of the log files can make it virtually impossible to actually
    see security-relevant entries. You need tools to sift through the relevant information.


    You can write your own scripts or use specialized tools like the following:


    +   - seccheck

    - logcheck

    - logsurfer


    Only seccheck is included with SLES 10. If you want to test the other two tools,
    you have to get them from the sources mentioned in the text. Detailed instruction
    on it is not part of this course.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# seccheckck


    The package seccheckck consists of a number of scripts that perform various checks
    daily, weekly, and monthly. You are informed by mail of bound sockets, SUID programs,
    loaded modules, devices, and many other aspects that have a security connotation.


    It is advisable to install the package.


    # logcheck


    logcheck (http://logcheck.org/) parses system logs and generates email reports
    based on anomalies.


    In the beginning logcheck produces long reports. You have to modify the configuration
    of logcheck so that harmless entries do not turn up in the report anymore.


    After initial phase, the reports mailed by logcheck should contain only relevant
    information on security violations and unusual activities.


    logcheck should be called regularly via cron to parse log files. logcheck remembers
    the point to which a log file was scanned previously, so that only the new section
    is scanned on the next call.


    # logsurfer


    The simple parsing of log files line by line has the disadvantage that each line
    is independent of all other lines. However, you might want additional information
    when a certain entry is found in the log file.


    logsurfer (http://www.cert.dfn.de/eng/logsurfer/) offers this functionality with
    contexts. Several lines matching a pattern can be stored in memory as a context.


    For example, depending on other patterns in the log file, a context could be mailed
    to you inspection or a program could be started.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
