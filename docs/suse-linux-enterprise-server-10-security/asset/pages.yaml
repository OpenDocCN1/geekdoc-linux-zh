- pgno: 165
  md: '# Objective 4 GNU Privacy Guard (GPG)


    Even if you secure the transmission of the email between server and client, this
    has no effect on the mail message itself. The communication between mail servers
    in the Internet is unencrypted, as is the email message while it is waiting on
    the mail server to be picked up.


    The only protection from government organizations, nosy administrators, or criminal
    hackers is to encrypt the email message itself. This is not an imaginary threat.
    In the past there were actual instances where mail got into the wrong hands with
    serious impact on a business, like losing a potential contract because the competitor
    was then able to make a better offer.


    PGP (Pretty Good Privacy) is probably the best-known program to encrypt email.
    SUSE Linux Enterprise 10 comes with the compatible open source alternative GNU
    Privacy Guard. Kmail has built-in GPG support. Support for GPG can be added to
    Thunderbird, the email client created by the Mozilla project, using the Enigma
    plug-in.


    To use GPG, you have to know how to do the following:


    +   - Create a Key Pair

    - Export and Import Public Keys

    - Encrypt and Decrypt Files

    - Use GPG Within Kmail


    # Create a Key Pair


    GPG uses the cryptographic principles outlined in Objective 1, “Cryptography Basics”
    on page 4-2. The public key of a/public/private key pair is used to encrypt a
    symmetric session key that is then used to encrypt the message. The encrypted
    message is sent to the recipient together with the encrypted session key.'
  merge: -1
  img_proc: true
