- pgno: 356
  md: '# Configure /etc/ipsec.secrets


    This file holds the passphrase to unlock the private key and has the same syntax
    as described in “Configure /etc/ipsec.secrets” on page 9-12 for the site-to-site
    configuration.


    # Connect Two Single Computers (End-to-End)


    Connecting two single computers with no subnet behind them is basically the same
    as establishing a site-to-site connection. The only difference is that in this
    case the parameters leftsubnet and rightsubnet remain empty.


    Unlike site-to-site connections, the traffic between the two computers is now
    encrypted. In site-to-site connections, this traffic is cleartext; only the traffic
    between the subnets is encrypted in the tunnel.


    # Establish the Connection


    To establish the connection, IPSec has to be started on both gateways.


    The parameter auto=add in /etc/ipsec.conf means that the connection description
    is loaded, but no attempt is being made to actually establish the connection.


    auto=start causes the connection to be established as soon as IPSec starts.


    When two LANs are connected via IPSec, both sides should use auto=start to make
    sure that after a reboot of the computer or a restart of IPSec on either side,
    a connection is renegotiated immediately.'
  merge: -1
  img_proc: true
