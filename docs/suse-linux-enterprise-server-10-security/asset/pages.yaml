- pgno: 329
  md: '# Table 8-6


    The keyword protocol determines which protocols can be used. The keyword method
    configures the authentication method.


    The following is a list of all possible configuration keywords. (This information
    is taken from the socks.conf man page.)


    | Keyword | Meaning and Possible Values |

    |---|---|

    | debug | Setting this field to 1 on debugging. |

    | logout | This value controls where the Socks client library sends output. It
    can be syslog, stdout, stderr, a filename, or a combination. |

    | resolveprotocol | The protocol used to resolve host names. Valid values are
    udp (default), tcp, and fake. |

    | ROUTES | The routes are specified with a route keyword. Inside a pair of parentheses
    ({}), a set of keywords control the behavior of the route. Each route can contain
    three address specifications: from, to, and via. A route is selected for a connection
    based on the values within the route block. The next keywords are used in a route
    block. |

    | ADDRESSES | Each address field can consist of an IP address (where meaningful,
    a netmask, separated from the IP address by a /), a hostname, or a domain name
    (designated by a leading period). Each address can be followed by an optional
    port specifier. |

    | from | The route is used only by requests coming from the address as the value.
    |

    | to | The route is used only by requests going to the address as the value. |


    CNI USE ONLY-1 HARDCOPY PERMITTED'
