- pgno: 42
  md: '# Objective 2 Understand Frequently Used Terms


    The following terms are commonly used in the context of IT security:


    +   - Firewall

    - Secure Network

    - Insecure Network

    - Demilitarized Zone (DMZ)

    - Packet Filters

    - Application-Level Gateway

    - Virtual Private Network

    - Remote Access Service (RAS)


    They are explained here in more detail.


    # Firewall


    The concept of a firewall is taken from architecture: A firewall is a building
    structure intended to stop a fire from spreading from one part of a building to
    another one.


    In data networks, firewalls link secure networks together with insecure ones.
    Firewalls consist of different elements, including packet filters and application-level
    gateways.


    A firewall is not so much a piece of hard- and software but the overall concept
    used to separate one network securely from another, usually comprising several
    hard- and software elements.


    # Secure Network


    Secure networks are networks that are considered secure because the users are
    known and trusted. Usually, local company networks are considered secure.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'However, even within local company networks, certain subnets, such as those
    assigned to the research and development department, or Human Resources, could
    have higher security requirements compared to the rest of the company network.


    # Insecure Network


    Similarly, insecure networks are insecure because the users are not known and
    thus are considered untrustworthy. As examples of insecure networks, practically
    all public networks can be mentioned, of which the Internet itself is the most
    well-known.


    # Demilitarized Zone (DMZ)


    Buffer zones between insecure networks and secure ones are referred to demilitarized
    zones (DMZ). Data traffic between public networks and the DMZ is controlled and
    regulated through packet filters and application-level gateways exactly as data
    traffic between a DMZ and a secure network is.


    Servers operating in a DMZ typically provide services toward public (insecure)
    networks (such as WWW servers and FTP servers) and are therefore quite visible
    to potential attackers.


    Servers in the DMZ require an increased administration effort compared with systems
    in a secure network, because they are used by unknown users.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'The following figure shows a typical DMZ setup:


