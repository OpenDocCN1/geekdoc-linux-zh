- pgno: 216
  md: '# General Firewall Design


    There is no single correct way to implement a firewall. The setup differs from
    site to site, depending on the needs of the company.


    However, there are common principles that should be considered when designing
    and implementing firewalls. In this section, you learn about general firewall
    design.


    # Objectives


    +   1. Understand Firewall Concepts and Purpose

    2. Describe Components of Firewalls

    3. Understand Advantages and Disadvantages of Different Setups'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Understand Firewall Concepts and Purpose


    A firewall is not a single machine, but a concept of how different components
    are combined to achieve the desired purpose. Firewalls are supposed to monitor
    and control the traffic between two networks. What traffic is allowed across the
    firewall and what traffic is blocked is the subject of the security concept.


    The difference between the two networks involved is the level of trust granted
    to the users in each network. Usually there is an internal network with known
    and trusted users and an external network where the users are not trusted and
    often not even known, like in the Internet. However, the same differentiation
    could apply between two networks within a company, if part of the network is separated
    from the rest of the network.


    There are two basic approaches to firewalls:


    +   - Everything that is not allowed is forbidden.

    - Everything that is not forbidden is allowed.


    From a security viewpoint, only the first approach is reasonable.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Objective 2


    # Describe Components of Firewalls


    Firewalls comprise one or (usually) more of the following elements:


    +   - Packet Filter

    - Application-Level Gateway (ALG)

    - Demilitarized Zone (DMZ)


    # Packet Filter


    Packet filters decide, by means of rules based on the data in IP, ICMP, TCP, and
    UDP headers (source address, target address, source port, target port, and flags),
    what to do with IP datagrams running through them.


    The data stream can be regimented on the IP protocol level and the respective
    transport protocols that are built upon it. Packet filters do not offer detailed
    filtering based on the content of the IP packets.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Figure 6-1


    The following figure shows the ISO/OSI layers involved in routing.

    While information in layer 4 is used by a packet filter to decide on the fate
    of a packet, information contained in layer 5 and above is hardly, if ever, taken
    into consideration by a packet filter.


    | End system | Packet filter | End system |

    |---|---|---|

    | 7 | | 7 |

    | 6 | | 6 |

    | 5 | | 5 |

    | 4 | | 4 |

    | 3 | 3 | 3 |

    | 2 | 2 | 2 |

    | 1 | 1 | 1 |


    Cable

    Path of a data packet Cable


    Packet filters are usually divided into two categories:


    +   - Static packet filters

    - Dynamic (also called stateful) packet filters


    A static packet filter has a set of rules that do not change once they are set.
    This has certain disadvantages, because access to high ports usually has to be
    allowed, at least for certain packets, to allow answers to requests. This can
    be used by a potential attacker to gain information about the internal network
    using scanners like nmap.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'If protocols that open an additional connection like FTP are allowed, access
    to a whole range of ports has to be allowed. Control of UDP traffic with static
    packet filters is not very effective, unlike TCP, does not have connection state
    as part of the protocol that can be checked by rules.


    Depending on the connections being made, a dynamic packet filter can change the
    filtering rules. If, for instance, a web page is requested by a browser, the filter
    allows all returns packets belonging to that connection and no others. All ports
    belonging to that connection remain closed, unless an first packet initiated the
    connection.


    With dynamic packet filters, UDP traffic can be much more effectively, allowing
    incoming UDP packets only when they are an answer to an outgoing packet.


    If a protocol is using a second connection, the ports for exactly that connection
    can be opened dynamically,while the rest remain closed. In this case, data within
    higher ISO/OSI layers is evaluated by the packet filter (for example, the port
    command within the ftp communication). This kind of connection tracking requires
    appropriate kernel modules to be loaded.


    Dynamic packet filtering makes the task of a potential attacker much more difficult.


    Packet Filters are covered in detail in Section 7, Packet Filters.


    # Application-level Gateway (ALG)


    Application-level gateways (sometimes referred to as application-level firewalls)
    are computers on which protocol-specific or generic proxy servers run that log
    and check the data traffic running through them. Because proxy servers involve
    programs that run on the gateway, these are ideally suited for logging and access
    protection mechanisms.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Application-level gateways with their proxy servers have an essential advantage
    over packet filters: They manage traffic without IP routing between the networks
    they connect.


    The IP datagrams are received by the proxy servers on the application level and
    the application data is processed. At this stage all headers of the underlying
    protocol levels have already been removed. The determination of the target is
    done on the basis of the address data inside the application data (for example,
    for email on the basis of the email address or for HTTP on the basis of the URL).


    The following figure shows the relationship of the ISO/OSI layers and application-level
    gateways:


    Figure 6-2


    | End system | ALG | End system |

    |---|---|---|

    | 7 | --- | 7 |

    | 6 | 6 | 6 |

    | 5 | 5 | 5 |

    | 4 | 4 | 4 |

    | 3 | 3 | 3 |

    | 2 | 2 | 2 |

    | 1 | 1 | 1 |


    Cable


    Path of a data packet'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Before transmitting the data to the actual target host, the application data
    is passed through the protocol layer downwards. Each protocol layer builds a new
    header of its own around the useful data, until the packet finally leaves the
    physical layer of the ALG. This means that no header data can travel unchanged
    from one side of the gateway to the other beneath the application layer, because
    they are created again by the proxy servers before being sent. Therefore, malicious
    headers will, in most cases, be disposed of automatically during the passage through
    the ALGs.


    With ALGs that are aware of the protocol they relay, rules can be set that filter
    according to content, client software, user, and other criteria. An example for
    such an ALG is the HTTP-proxy squid.


    A dedicated proxy software does not exist for every protocol. Generic proxy servers,
    sometimes called circuit level proxy servers, can relay proxy protocols for which
    there is no dedicated proxy. They do not, however, allow the detailed control
    as dedicated proxy servers do. In practice they offer more or less the same functionality
    and level of security as packet filters. Examples of generic proxy servers are
    socks and rinetid.


    Application-level gateways are covered in detail in Section 8, Application-Level
    Gateways.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Demilitarized Zone (DMZ)


    Buffer zones between secure and insecure networks are referred to as demilitarized
    zones (DMZ). Data traffic between public networks and the DMZ is controlled and
    regulated through packet filters and application-level gateways exactly as data
    traffic is controlled between a DMZ and a secure network.


    Figure 6-3


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_223_0.png)'
  merge: -1
  img_proc: true
