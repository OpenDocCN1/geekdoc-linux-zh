- pgno: 328
  md: "Firefox (Version 1.5.0.4) does not support socks authentication at the time\
    \ of this writing.\n\nInstead of configuring the proxy manually, you can also\
    \ use the mechanisms for Proxy-Auto-Configuration as described in “Configure the\
    \ Web Browsers Automatically with a PAC Script” on page 8-25.\n\n# Use socksify\
    \ to Enable SOCKS in Clients\n\nSocksify is a shell script that belongs to the\
    \ Dante package. When client programs are invoked with the help of this script,\
    \ they can access a SOCKS server although they do not provide native SOCKS support.\n\
    \nThis is done by a mechanism called library preloading. This basically loads\
    \ the SOCKS network code into memory before the actual client is started. When\
    \ the client opens a network connection, the SOCKS network code is used and a\
    \ connection to the SOCKS server is established.\n\nThe file /etc/socks.conf determines\
    \ which SOCKS server should be used. The syntax of the configuration file is very\
    \ similar to the syntax of the /etc/sockd.conf file.\n\nIn the configuration file\
    \ you define routes, which determine if a network connection should go through\
    \ a SOCKS server or not. The following example defines a basic route that sends\
    \ everything to a SOCKS server:\n\n```\nroute {\n  from: 0.0.0.0/0 to: 0.0.0.0/0\
    \ via: 10.0.0.1 port = 1080\n  protocol: tcp udp\n  method: username\n}\n```\n\
    \nThe from and to keywords match the requests based on the source and destination\
    \ IP address. The via keyword determines to which SOCKS server and to which port\
    \ requests should be sent that match the given conditions.\n\nCNI Version 1\n\
    Copying all or part of this manual, or distributing such copies, is strictly prohibited.\
    \ To report suspected copying, please call 1-800-PIRATES."
  merge: -1
