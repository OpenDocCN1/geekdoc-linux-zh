- pgno: 302
  md: '# Configure Digest Authentication with digest_pw_auth


    To configure digest authentication, you have to adjust the

    auth_param lines.


    The acl and http_access setup is the same as described in

    "Configure Basic User Authentication with PAM" on page 8-39.


    The following is an example digest configuration:


    ```

    auth_param digest program /usr/sbin/digest_pw_auth \

    /etc/squid/proxy_passwd 5

    auth_param digest realm Squid proxy-caching web server

    auth_param digest nonce_garbage_interval 5 minutes

    auth_param digest nonce_max_duration 30 minutes

    auth_param digest nonce_max_count 50

    ```


    The most obvious difference to the basic authentication setup is the

    keyword digest that is used instead of basic in every line.

    The authentication process is called digest_pw_auth in /usr/sbin/ on

    SUSE Linux Enterprise Server 10. The program takes a password

    file as a parameter. The password file contains user names and clear

    text passwords. The user name and password are separated by a

    colon.


    The following is an example password file:


    ```

    EiJ0shae

    meicks:Ci6eyoh

    blotz:Ooh0k

    mgunreen:Ahb3emae

    fsailer:idoonN7am

    esilver:lau5aQua

    stiegemann:Daik9ilu

    ```


    You can name the password word file in any way and place it in

    directory wherever Squid has access. You just have to pass the

    correct full path name of the file to the authentication program.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'In the current version of digest_pw_auth, the password file needs to contain
    the passwords in clear text. You therefore have to make sure that the password
    file cannot be read by anyone but the Squid user.


    All other auth_param parameters starting with nonce_ affect some details about
    the digest authentication. The standard settings are fine for most purposes.'
  merge: -1
