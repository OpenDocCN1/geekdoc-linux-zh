- pgno: 169
  md: "# Encrypt and Decrypt Files\n\nNow that you have public keys, you can encrypt\
    \ files. The option to use is -e:\n\n```\ngeeko@da10:~> gpg -e message.txt\nYou\
    \ did not specify a user ID. (you may use \"-r\")\n```\n\nCurrent recipients:\n\
    \nEnter the user ID. End with an empty line: tux\ngpg: F3971E52: There is no assurance\
    \ this key belongs to the named user\n\n```\npub 2048/F3971E52 2006-04-19 Tux\
    \ P (The Penguin)\n<tux@digitalairlines.com>\n  Primary key fingerprint: 53CE\
    \ 1FF9 5568 EA63 3CE 57F8 A283 907F EE82 0B88\n  Subkey fingerprint: 297D 148D\
    \ 9C61 9D61 7E74 EC1B 4480 8828 2397 1E52\n```\n\nIt is NOT certain that the key\
    \ belongs to the person named in the user ID. If you *really* know what you are\
    \ doing, you may answer the next question with yes.\n\nUse this key anyway? (y/N)\n\
    \nCurrent recipients:\n2048/F3971E52 2006-04-19 *Tux P (The Penguin) <tux@digitalairlines.com>\n\
    \nEnd with an empty line:\n\nYou could specify the recipients on the command line\
    \ using the option -r: gpg -r tux -e message.txt.\n\nThe encrypted file in this\
    \ example is message.txt.gpg. If you use the option -a, it would be an ASCII text\
    \ file and the extension would be .asc instead of .gpg.\n\nBecause you do not\
    \ have the private key corresponding to the recipients public key, you are not\
    \ able to decrypt the file you encrypted. If you want to prevent an attacker from\
    \ reading the clear text file on your hard disk while still being able to read\
    \ it yourself, you would have to encrypt it to yourself as:\n\n# CNI USE ONLY-\
    \ HARDCOPY PERMITTED"
  merge: -1
