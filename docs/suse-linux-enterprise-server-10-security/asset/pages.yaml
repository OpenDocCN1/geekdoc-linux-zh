- pgno: 146
  md: 'Now you can create the root-CA certificate. The following command creates a
    self-signed certificate (valid for 10 years) in X509 format, and the corresponding
    (2048-bit RSA) private key. PEM (Privacy-Enhanced Electronic Mail) denotes the
    format used for the certificate:


    ```

    da10~/da10-CA # openssl req -newkey rsa:2048 -x509 -days 3650 \ -keyout private/da10-cakey.pem
    -out da10-cacert.pem

    Generating a 2048 bit RSA private key

    ...

    ++++

    writing new private key to ''private/da10-cakey.pem''

    Enterter PEM pass phrase:

    Verifying - Enter PEM pass phrase:

    ```


    You are about to be asked to enter information that will be incorporated into
    your certificate request.

    What you are about to enter is what is called a Distinguished Name or a DN.

    There are quite a few fields but you can leave some blank

    For fields there will be a default value,

    If you enter ''.'', the field will be left blank.


    Country Name (2 letter code) [de]:nState or Province (full name) [Bavaria]:nLocality
    Name (eg, city) [Munich]:nOrganization Name (eg, company) [Digitalailirl]:nOrganizational
    Unit (eg, section) [Training]:nCommon Name (eg, YOUR name) []:RootCA on da10

    Email Address [:ca-admin@digitalailines.com

    da10~/da10-CA #


    The private key is encrypted using 3DES. The passphrase is of paramount importance.
    If someone gets your private key and can find out your passphrase, he can create
    certificates for your CA. Of course, that would completely defeat its purpose.


    If you want to use a different encryption algorithm for your private key, you
    have to first generate a public/private key pair

    openssl genrsa -aes256 -out private/da10-cakey.pem 2048

    and then create the certificate

    openssl req -new -x509 -days 3650 -keypair private/da10-cakey.pem \ -out da10-cacert.pem
    -set_serial 1


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_146_0.png)'
  merge: -1
  img_proc: true
- pgno: 147
  md: "# SUSE Linux Enterprise 10: Security\n\nYou can view the certificate using:\n\
    \n```\ndal0:~/dal0-CA # openssl x509 -in dal0-cacert.pem -text\nCertificate:\n\
    Data:\n  Version: 3 (0x2)\n  Serial Number:\n  ba:45:1c:b0:81:el1:20:0c\n  Signature\
    \ Algorithm: shaWithRSAEncryption\n  Issuer: Cde, ST-Bavaria, L=Munich,\n  O=Digitalairlines,\
    \ OU=Training, CN=Root CA on\n  dal0/emailAddress=ca-admin@digitalairlines.com\n\
    \  Validity\n  Not Before: Apr 19 04:44:09 2006 GMT\n```\n\nFor more information\
    \ on the openssl options available when creating certificates, see man x509.\n\
    \n# Create a Certificate Signed by the Root CA\n\nUsing your root CA, you can\
    \ now create certificates to authenticate your web servers, mail servers, VPN\
    \ gateway, or notebooks.\n\nOpenSSL keeps track of the issued certificates in\
