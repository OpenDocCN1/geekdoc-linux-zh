- pgno: 390
  md: '# scanlog


    Port scans are quite common and are basically harmless. However, they can also
    be the first step in an attack.


    If multiple packets to different ports originating from a single source are detected
    within a certain time (7 privileged or 21 unprivileged within 3 seconds), an entry
    is made by scanlog to /var/log/messages via syslog.


    No other action is taken.


    ```

    Apr 21 10:16:06 da10: 149.44.87.33 to 149.44.87.34 ports 80, 554, 1723, 113, 3389,
    25, 443, 636, ... fSrpauxy, TOS 00, TTL 64 @10:16:06

    ```


    To alert you to a scan, you need to use other tools, like logsurfer, that watch
    the log file.


    scanlog is started and stopped by scanlogd start and scanlogd stop, respectively.


    The use of scanlog is limited, because a real attacker will avoid creating a lot
    of “noise.” He will stretch his port scan over several days, if not weeks, to
    gain the information he wants, without alerting anyone.


    # Honeypots


    The idea of a honeypot is somewhat opposed to what has been discussed in this
    course so far. Instead of locking up a computer to prevent hackers from compromising
    it, you use a dedicated computer to detect an effort to compromise the system,
    to observe the hackers while they try and succeed, and to learn how they operate.'
  merge: -1
  img_proc: true
- pgno: 391
  md: 'A honeypot is a computer or virtual machine whose value lies in being probed,
    attacked, and compromised. By analyzing what happens on such a computer, you can
    get an insight into the motives and tactics of actual attackers without putting
    your production environment at risk.


    Ways to realize such a honeypot are


    +   - Computers specifically dedicated to this purpose

    - Virtual machines or daemons on a computer


    With many virtual machines or a daemon answering IP addresses unused in your network,
    it is possible to create a complete virtual network of computers or, in other
    words, a honeypot.


    A honeynet can also be used to make it more difficult for an attacker to find
    the machines that interest him. Even if only some computers are actually productive,
    the network seems to have a computer on every IP address.


    An open source solution to deploy honeypots and honeynets is the Honeyd Virtual
    Honeypot, http://www.honeyd.org/.


    > For more information on honeypots and honeynets, visit the honeynet homepage
    at http://www.honeynet.org/ and have a look at the Know Your Enemy series at http://www.honeynet.org/papers/kye.html.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_391_0.png)'
  merge: -1
  img_proc: true
- pgno: 392
  md: (End of Exercise)
  merge: -1
  img_proc: true
- pgno: 393
  md: '# Objective 4


    # Incident Response


    Any system administrator would be upset to find out one of his servers has been
    subject to a successful attack.


    There are several steps you can take in response to an attack. These steps should
    also be outlined in the security guidelines:


    +   - Immediate Reaction

    - Information

    - Documentation and Investigation

    - New Installation

    - Re-Evaluate Your Security Policy


    # Immediate Reaction


    With the wrong action you could make things even worse by inadvertently obscuring
    any clues the intruder left behind. The main tip here is to stay cool and calmly
    consider the technical options you have:


    +   - Do nothing but observe the activities of the intruder.


    If the intruder is still online, you could find out what she is to. On the other
    hand, she might find out that she is being observed and try to obscure her trails.


    +   - Disconnect the network connection.


    This will definitely alert the intruder if he is still online, and he might try
    to obscure his trail on other computers. But he cannot directly change things
    on the computer anymore. He might have installed a mechanism that changes things
    after a certain time, or upon loss of network connectivity, though.


    The advantage is that you can find out what processes are running, you can copy
    the content of the RAM to another computer for later investigation, etc.'
  merge: -1
  img_proc: true
- pgno: 394
  md: 'You should be aware that any program called from the compromised system might
    be compromised, like a ps not showing processes, or an ls not showing all files.

    Use statistically linked programs from clean media, if possible.


    +   - Shut down the computer.

    This might also trigger certain programs installed by the intruder to remove any
    available traces. Any information in the RAM is lost.

    - Shut off the power supply.

    This prevents malicious programs from doing their thing, but you will lose the
    information available in the RAM and it might give you an inconsistent file system.


    # Documentation


    There are also nontechnical steps to take.


    Certain people need to be informed (those are listed in the security guidelines).


    With the significance IT has today, such an incident is definitely of interest
    for management and the appropriate corporate managers should be informed.


    # Documentation and Investigation


    No matter what you decide to do immediately, you should document what you observe
    and every single step you take.


    This is also true for any further action on the computer itself, its hard disks,
    or on images of those hard disks.


    If you decide to do some investigation while the computer is still running, you
    could


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 395
  md: "+   - Copy the content of RAM via the network to another computer using netcat.\n\
    \n+   - Document the network configuration and connections using\n  - ifconfig\n\
    \  - ip\n  - route\n  - netstat\n\n+   - Document mounts and open files using\n\
    \  - lsof\n\n+   - Document the kernel modules loaded using lmod.\n\nOnce again,\
    \ the results might not be correct, as root kits or modified programs could hide\
    \ certain things.\n\nIdeally any further investigation of the storage media is\
    \ not done directly on the storage media themselves, but on images that were taken\
    \ from the media in a read-only configuration.\n\nIn this way, nothing is changed\
    \ on the media, which might be relevant for later legal action.\n\nThen on a separate\
    \ computer with a clean system, you can mount the images and investigate.\n\n\
    Various tools are available for this purpose:\n\n+   - Standard Linux tools: find,\
    \ ls, file, etc.\n\n+   - AIDE (if you set it up before the intrusion)\n\n+  \
    \ - The Coroners Toolkit (TCT)\n\n> For more information on TCT, visit\nhttp://www.porcupine.org/forensics/tct.html\n\
    \n+   - The Sleuth Kit (TSK)"
  merge: -1
  img_proc: true
- pgno: 396
  md: 'For more information on TSK, visit

    http://www.sleuthkit.org/sleuthkit/index.php


    A thorough investigation requires a large amount of resources in

    terms of hardware, time, and know-how.


    Even if you do not go into a full-scale investigation to go to court,

    the very least you should find out is the vulnerability used to

    compromise the system and when exactly the system was

    compromised.


    That time is necessary to decide what backup you will use to restore

    the system.


    # New Installation


    If you take security seriously, there is no way around installing the

    system from scratch and making sure the vulnerability used for the

    intrusion is fixed.


    The intruder might have installed a back door, a root kit, or another

    modification—unless you install the computer again from clean

    media, you cannot be sure that all modifications have been found

    removed.


    This applies to a certain extent to the backup as well. You have to

    decide which backup to use. If you use one that was made after the

    intrusion, you might inadvertently reinstall some of the

    modifications the intruder made.


    # Re-Evaluate Your Security Policy


    If your system was compromised despite your security measures,

    you should look at your policies and procedures.


    They might be inadequate and need some changes to prevent a

    similar occurrence in the future.


    CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'For more information on the recovery after a system compromise, see:

    “Steps for Recovering from a UNIX or NT System Compromise,”

    http://www.cert.org/tech_tips/win-UNIX-system_compromise.html.'
  merge: -1
