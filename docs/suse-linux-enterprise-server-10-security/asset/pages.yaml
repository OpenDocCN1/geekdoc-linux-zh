- pgno: 284
  md: 'In the lower part of the dialog you can configure exceptions when you want
    Firefox to connect to a web server directly instead of using the proxy server.


    # Configure the Web Browsers Automatically with a PAC Script


    In large environments with a lot of users, configuring the proxy settings manually
    can be a very time-consuming task. Therefore, it is helpful to automate this.
    Most of the browsers today can interpret a proxy configuration file, also called
    a PAC (Proxy Auto Configuration) script.


    To use this feature, you have to take three steps:


    +   * Create a PAC Script

    * Publish the PAC File

    * Announce the PAC Script in the Network


    # Create a PAC Script


    A PAC script is basically a plain text file that defines the JavaScript function
    FindProxyForURL(). A browser that is configured with PAC calls this function every
    time it needs to access a web element. The URL of the element is passed to the
    function and the function returns one of the following strings:


    +   * DIRECT. This means the browser should not use a proxy for the given address.

    * PROXY. Followed by the address or name of a proxy server. The browser will use
    the given proxy server to access the URL.

    * SOCKS. Followed by the address or name of a SOCKS server. The browser will use
    the given SOCKS server. SOCKS is covered later in this section.'
  merge: -1
  img_proc: true
- pgno: 285
  md: "# SUSE Linux Enterprise Server 10: Security\n\nThe following is an example\
    \ of a very simple PAC file:\n\n```\nfunction FindProxyForURL(url,host)\n{\n \
    \ return \"PROXY proxy.digitalairlines.com:8080\";\n}\n```\n\nAs described above,\
    \ the PAC script defines the function FindProxyForURL(). This function is called\
    \ by the browser with two parameters:\n\n+   - **url**. The full URL of the requested\
    \ web element.\n- **host**. Just the host part of the full URL.\n\n> This example\
    \ called the parameters url and host, but when you define your own FindProxyForURL,\
    \ you can choose your own names.\n\nThis example does not use these two parameters.\
    \ The only thing this PAC file does return the proxy name proxy.digitalairlines.com\
    \ and the port 8080 on which the proxy accepts connections. This means that the\
    \ browser always uses a proxy server, no matter what URL it requests.\n\nThe next\
    \ example uses the host parameter, which is passed to the function:\n\n```\nfunction\
    \ FindProxyForURL(url,host)\n{\n  if (host == \"intranet.digitalairlines.com\"\
    ) {\n    return \"DIRECT\";\n  } else{\n    return \"PROXY proxy.digitalairlines.com:8080\"\
    ;\n  }\n}\n```\n\n# CNI USE ONLY-1 HARDCOPY PERMITTED\n\n8-26 Copying all or part\
    \ of this manual, or distributing such copies, is strictly prohibited. To report\
    \ suspected copying, please call 1-800-PIRATES. Version 1"
  merge: -1
  img_proc: true
- pgno: 286
  md: 'In this example the script checks whether the requested host is intranet.digitalairlines.com.
    In this case the string DIRECT is returned and the browser connects directly to
    the Internet server. In all other cases the name of the proxy server is returned
    as in the previous example.


    Because a PAC script contains JavaScript code, you can use any feature JavaScript
    offers to process the URL and host parameter. This means you can build very powerful
    PAC scripts that use different Proxy servers for different hosts on different
    times of the day, etc.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_286_0.png)


    A good introduction to PAC files, along with many examples, can be found at http://wp.netscape.com/eng/mozilla/2.0/relnotes/demo/proxy-live.html.


    # Publish the PAC File


    The PAC file can be placed anywhere it is reachable by the web browsers on the
    client machines. The most common way is to put the script code in a file that
    ends in .pac and put this file on an internal web server. You can also place the
    file in a shared network drive because many web browsers can load PAC files from
    the file system.


    When you have published the PAC script, you need to configure the web browsers
    to use the PAC file. In Firefox you have to select Automatic proxy configuration
    URL in the Connections Settings dialog. Then you can either specify an HTTP URL
    or browse the file system for a PAC file.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_286_1.png)


    When you place a PAC file on a web or file server, you have to make sure that
    the system is reliable. Most browsers do not have a good error handling routines
    if a configured PAC file is not available.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Announce the PAC Script in the Network


    The previously described method to configure web browsers to use a PAC script
    still requires manual configuration. Although you can change the proxy configuration
    at a central point, this cannot be true without autoconfiguration.


    The solution to this problem is the Web Proxy Auto-Discovery Protocol (WPAD).
    WPAD is not really a network protocol; it''s more the title for the following
    autodiscovery methods:


    +   - DNS-based. For DNS-based autodiscovery, the browser looks for a web server
    that has the hostname


    wpad,full_domain_name_of_client


    For example, this means that a browser on the host da102.provo.digitalairirlines.com
    would look for a server named wpad.provo.digitalairirlines.com subdomain. If this
    server cannot be found, the browser would remove a subdomain and try wpad.digitalairirlines.com
    as the next server.


    When the browser can connect to one of the hosts, it tries to download a file
    called wpad.dat, which contains the proxy configuration script. To use the DNS-based
    autoconfiguration, you have to do the following:


    +   - Create a DNS entry for one of the server names which a browser would look
    for.


    +   - Set up web server (can be a virtual host) that listens to the host name
    configured in DNS.


    +   - Make sure the web server publishes the configuration script as wpad.dat
    in its document directory.


    +   - Make the server publishes the file with the MIME type application/x-ns-proxy-autoconfig


    In Apache, this can be done by adding the AddType application/x-ns-proxy-autoconfig
    .dat in the server or virtual host configuration file.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 288
  md: '+   DHCP based. Another method to announce a PAC script uses a DHCP server.
    When using this method, the URL of the PAC script is granted as DHCP option 252
    to the host. The browser then accesses the URL from the current DHCP lease.


    You can find more information about proxy autoconfiguration in general and about
    the WPAD protocol at http://homepage.tesco.net/~J.deBoynePoland/FGA/web-browser-auto-proxy-configuration.html
    The section “Security considerations” is especially worth reading because it points
    out that the use of PAC is inherently insecure, mainly because code that is downloaded
    from somewhere else is automatically executed on the client.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_288_0.png)'
  merge: -1
  img_proc: true
