- pgno: 148
  md: "# The following is an example of creating the key pair and the certificate\
    \ signing request:\n\n```\nda10:~/da10-CA # openssl req -new -keyout private/server_prv_key.pem\
    \ \\\n      -out certs/server_req.pem -days 365\n      Generating a 1024 bit RSA\
    \ private key\n      +++++\n+++++\n      writing new private key to 'private/server_prv_key.pem'\n\
    \      ..\n```\n\nYou are again asked for the information such as country and\
    \ company. (You do not need to provide anything for the last two questions that\
    \ ask for a challenge password and an optional company name.)\n\nIf the certificate\
    \ is used for a server, the common name has to be the DNS domain name you use\
    \ to contact it, like www.digitalairlines.com. If you use something else, the\
    \ users get error messages that the certificate does not match the server contacted.\n\
    \nThe certificate in this case is valid for one year.\n\n![](img/ebd0b66532100449f2a48e48fa2ec8ce_148_0.png)\n\
    \nFor more information on other openssl options available when creating certificate\
    \ signing requests, see man req."
