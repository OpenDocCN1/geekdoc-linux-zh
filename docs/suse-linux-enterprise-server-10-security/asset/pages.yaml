- pgno: 279
  md: '# SUSE Linux Enterprise Server 10: Security


    | ACL Type | Description |

    | --- | --- |

    | url_regex | This tag matches a given regular expression with the whole URL of
    a request.

    > Usage: acl acl_name url_regex pattern

    > Example: acl sels url_regex sles

    > This would match any URL containing *sles*. By default, the expressions are
    case sensitive. You can change this by specifying the -i option after the url_regex
    acl type.

    > Example: acl http url_regex ^http

    > This would match any URL starting with http. |

    | urlpath_regex | urlpath_regex is similar to url_regex; however, it matches only
    the path within a URL, not the complete URL (including the protocol identifier
    and the host name).

    > Example: acl gif urlpath_regex \gif$

    > This would match any URL that contains a path ending in .gif. |

