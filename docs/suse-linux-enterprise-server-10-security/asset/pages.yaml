  md: '# Export and Import Public Keys


    To export the public key just created, use the option --export. If you want to
    publish the key on a web page, use the ASCII format with the option -a.


    ```

    geeko@da10:> gpg --export -a geeko

    -----BEGIN PGP PUBLIC KEY-----

    Version: Gnu v1.4.2 (GNU/Linux)

    mQG1BERF+nRBACCH7EKguuu7nH8CftGr+gZEA88A/m2KJKFvScop6quqRuDy6u3d

    d5Q0DksZo8yzyrw9HpTWBN05177wGkiKnQwbEEr4ML8baoR6TnGb6H1Nmf+eJMY

    REXD7DIBAAKCRAXJlYPFBHh81TAKYO9uk2c2FG0kDScu2F51rwf45WcmulE

    TorJFJpnRo/7GDGBJjJnqM=

    -sHTG

    -----END PGP PUBLIC KEY BLOCK-----

    ```


    The key is written to stdout. Redirect the output to a file if needed.

    To import keys from others, use the option --import:


    ```

