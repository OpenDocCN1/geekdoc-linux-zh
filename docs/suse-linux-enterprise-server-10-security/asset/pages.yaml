- pgno: 149
  md: "# SUSE Linux Enterprise 10: Security\n\nThis certificate signing request is\
    \ signed by the CA. The option\n**-policy policy_anything** refers to the respective\
    \ section in\n/etc/ssl/openssl.cnf and defines which parts of the distinguished\n\
    name to be the same as those of the CA and which may differ\n(see man for more\
    \ details). The command to enter looks like:\n\n```\nda10:/da0-CA # openssl ca\
    \ -policy policy_anything -notext \\\n  -out certs/servercert.pem -infiles certs/server_req.pem\n\
    Using configuration from /etc/ssl/openssl.cnf\nEnter pass phrase for /root/da10-CA/private/da10-cakey.pem:\n\
    Check that the request matches the signature\nSignature ok\nCertificate Details:\n\
    \  Serial Number: 1 (0x1)\n  Validity\n  Not Before: Apr 19 05:00:05 2006 GMT\n\
    \  ...\nkeyid:15:90:C7:E1:F6:1D:51:27:EE:12:8C:1A:68:B1:FF:70:55:BE:74\n```\n\n\
    Certificate is to be certified until Apr 19 05:00:05 2007 GMT (365 days)\nSign\
    \ the certificate? [y/n]:y\n\n1 out 1 certificate requests certified, commit?\
    \ [y/n]y\nWrite out database with 1 new entries\nData Base Updated\nda10:/da10-CA\
    \ #\n\n![](img/ebd0b66532100449f2a48e48fa2ec8ce_149_0.png)\n\nFor more information\
    \ on other openssl available when signing\ncificates, see **man ca**.\n\nIn addition\
    \ to the certificate in the directory certs, a copy of\nthe certificate is in\
    \ newcerts. The number in the file **serial** has\nincreased by one and the file\
    \ **index.txt** contains some information\nabout the certificate (validity, timestamp,\
    \ serial number, DN).\n\n```\nda10:/da0-CA # cat index.txt\nV 070419000500Z 01\
    \ unknown\n/C=de/ST=Baria/L=Munich/O=Digitalairlines/OU=CN=da10.digitalai\nlines.com/emailAddress=ca-admin@digitalairlines.com\n\
    ```\n\n# CNI USE ONLY-1 HARDCOPY PERMITTED\n\nCopying all or part of this manual,\
    \ or distributing copies, is strictly prohibited.\n report suspected copying,\
    \ please call 1-800-PIRATES.\n\n4-20\n\nVersion 1"
  merge: -1
