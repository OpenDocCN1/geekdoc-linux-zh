- pgno: 327
  md: '# Configure Clients with Native SOCKS Support


    Many newer network clients come with native SOCKS support. Configuring this feature
    is similar to setting up an HTTP proxy.


    In the Firefox web browser, you can find the SOCKS setup with other proxy-related
    settings under Edit > Preferences > General > Connection Settings:


    # Figure 8-9


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_327_0.png)


    Select Manual proxy configuration. Enter the IP address or the DNS name of your
    SOCKS server in the SOCKS Host field and enter the port on which your SOCKS server
    is listening in the Port field. Leave all other proxy fields blank if you want
    Firefox to use a proxy for one of the protocols.


    You can also choose the SOCKS protocol version. Unless your SOCKS server does
    not support it, you should select SOCKS v5. Dante socks supports v5.


