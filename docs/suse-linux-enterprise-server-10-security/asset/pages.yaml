- pgno: 296
  md: '# Configure Proxy Authentication


    So far you have only limited the access to a Squid proxy server based on IP and
    network addresses, the date/time, and the access protocol. In some environments
    this is not sufficient and you need a better and more user-oriented access control.
    Squid offers the option to authenticate users before they are allowed to use the
    proxy. This procedure is called proxy authentication.


    To configure Proxy Authentication with Squid, you need to do the following:


    +   - Understand How Proxy Authentication Works

    - Configure an Authentication Backend

    - Configure Proxy Authentication in squid.conf


    # Understand How Proxy Authentication Works


    Proxy authentication is a feature that is integrated into the HTTP protocol. It
    needs to be supported on both sides, by the web browser and the proxy server.


    When a web browser accesses a proxy server that requires authentication, the proxy
    returns the HTTP message 407 (Proxy Authentication Required). Then the browser
    opens a dialog and prompts the user to enter a username and password. The entered
    credentials are then passed to the proxy server with every subsequent request
    to the proxy. Some browsers offer to enter the proxy authentication credentials
    in their configuration dialog, so the user does not need to enter the credentials
    in every new browser session.


    The user credentials can be passed from the web browser to the proxy in several
    ways. These methods are called authentication schemes.


    Squid supports the following schemes:


    +   - basic. This is the oldest and most insecure scheme.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'User name and password are transferred in clear text and can be read by anyone
    who can access the transferred data. You need to be aware of this and decide if
    this is acceptable in your environment.


    +   - digest. This a better, more secure authentication scheme.


    Instead of passing the password in clear text, this scheme uses a hash based on
    the password and several other parameters.


    +   - NTLM. NTLM is a protocol that is used in several Microsoft network implementations
    to enable single sign-on across cross different services.


    Squid supports NTLM for proxy authentication, although it is not an official HTTP
    extension.


    Usually digest is the best choice, because it is a standardized and rather secure
    authentication scheme. However, the current Squid versions (2.5,x) require the
    passwords to be available in clear text on the system running the proxy in order
    to create the digest hash. This makes it difficult to integrate Squid into an
    existing authentication environment where passwords are usually stored as a hash
    of the actual password. Future versions of the Squid package (starting with version
    3.0) will most likely support encrypted passwords for the digest authentication
    scheme.


    # Configure an Authentication Backend


    Every authentication process needs some kind of database where the user information
    is stored. Squid can be used with many different types of user databases, because
    the actual validation of the user credentials is done by an external program.


    Squid feeds the user name and password into these authentication programs and
    the programs return whether these are valid or not. Each of these programs is
    designed to connect to a different type of user database. The authentication programs
    are located in the directory /usr/sbin.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Configure Proxy Authentication in squid.conf


    In the following, you will configure Squid user authentication with different
    authentication methods and user databases.


    This includes the following:


    +   - Configure Basic User Authentication with PAM

    - Configure Digest Authentication with digest_pw_auth


    # Configure Basic User Authentication with PAM


    One option for a user database is to use PAM on the system where the proxy is
    running. All users that can be validated by PAM on the system where the proxy
    is running can be authenticated by Squid.


    Three tags are used to configure user authentication in squid.conf:


    +   - auth_param. This is used to determine the authentication scheme and the
    authentication program.

    - acl. This is used to define an acl that holds user names.

    - http_access. This is used last to give users access based on the defined acls.


    The following is the auth_param section for PAM authentication:


    ```

    auth_param basic program /usr/sbin/pam_auth

    auth_param basic children 5

    auth_param basic realm Squid proxy-caching web server

    auth_param basic credentialstl 2 hours

    ```


    The lines above have the following meaning:


    +   - The first line:


    ```

    auth_param basic program /usr/sbin/pam_auth

    ```


    This line defines the program that should be used for user authentication. The
    program must be given with the full path name.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'The second line determines how many authentication processes are started in
    the background:


    ```

    auth_param basic children 5

    ```


    The value 5 should be fine in most cases. When the authentication of a user takes
    a longer time, you should set this to a higher value to avoid making other requests.


    The third line defines the realm:


    ```

    auth_param basic realm Squid proxy-caching web server

    ```


    The realm can be understood as the name of the resource that requires user authentication.
    The default realm is Squid proxy-caching web server.


    The fourth line determines how long a user/password pair is considered valid after
    it has been successfully validated:


    ```

    auth_param basic credentialttl 2 hours

    ```


    This way the authentication program does not have to be called each time a user
    makes a request.


    The default value is 2 hours.


    When the authorization program is configured, you have to create an acl line that
    looks like the following:


    ```

    acl allowed_users proxy_auth fsailer blot

    ```


    This defines an acl of the type proxy_auth for the users fsailer and blot. If
    you want an acl that matches all users and can be validated by the authentication
    program, you can use the keyword REQUIRED, as in the following example:


    ```

    acl allowed_users proxy_auth REQUIRED

    ```


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'Finally you need to add an http_access line to grant access for authenticated
    users:


    ```

    http_access allow allowed_users

    ```


    When you configure user authentication, you have to keep in mind that once an
    http_access line matches, none of the later http_access lines are processed. The
    sequence of entries is very important.


    Let''s say your goal is to grant access to the users fsailier and blot as long
    as they use a machine in the internal network and no one else is to have access.


    The following example does **not** produce the desired result:


    ```

    acl all src 0.0.0.0/0.0.0.0

    acacl_network src 10.0.0.0/24

    acl allowed_users proxy_auth fsailier blot


    http_access allow internal_network

    http_access allow allowed_users

    http_access deny all

    ```


    Because the allow internal_network line comes before **allowed_users**, all requests
    from the internal network are allowed without authentication.


    The following solution is somewhat better:


    ```

    acl all src 0.0.0.0/0.0.0.0

    acl internal_network src 10.0.0.0/24

    acl allowed_users proxy_auth fsailier blot


    http_access allow allowed_users

    http_access allow internal_network

    http_access deny all

    ```


    This time the first http_access line allows the authenticated users fsailier and
    blot to access the proxy.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# SUSE Linux Enterprise Server 10: Security


    For other users, there are two scenarios:


    +   - The user exists on the system and enters the correct password.

    The line http_access allow allowed_users does not match and the next line is checked.
    Access is granted for anyone or incorrect from the internal network.


    +   - The user does not exist on the system at all or an incorrect password is
    given for an existing user. In this case, the browser offers the authentication
    dialog again or shows the error page 407 if the user decides to abort the authentication.


    This is not exactly what you wanted to do.


    The following configuration finally produces the desired result:


    ```

    acl src 0.0.0.0/0.0.0.0

    acl internal_network src 10.0.0.0/24

    acl allowed_users proxy_auth fsailer blot


    http_access deny !internal_network

    http_access allow allowed_users

    http_access deny all

    ```


    The first http_access line denies access for every request that does not come
    from the internal network. The second http_access line allows access only for
    the users fsailer and blot. The last line denies access for everyone else from
    everywhere.


    Another possible solution is the following:


    ```

    acl src 0.0.0.0/0.0.0.0

    acl internal_network src 10.0.0.0/24

    acl allowed_users proxy_auth fsailer blot


    http_access allow allowed_users internal_network

    http_access deny all

    ```


    Only users who meet the criteria for allowed_users and internal_network match
    the first http_access line. The next line denies all others.


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
