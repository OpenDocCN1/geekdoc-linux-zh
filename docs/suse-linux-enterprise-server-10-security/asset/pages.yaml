- pgno: 333
  md: '# Objective 4


    # Configure and Use rinetd


    rinetd is a simple generic TCP proxy that can handle almost all protocols that
    work with known TCP ports (such as HTTP: port 80, HTTPS: port 443, and SMTP: port
    25) and a single TCP connection. Like all generic proxies, rinetd cannot analyze
    and organize the connections of the data that runs through it.


    The functionality offered by rinetd is ideal for use on lean application-level
    gateways. It can forward connections to a TCP port of the gateway on which it
    runs to a TCP port of any other IP address and record information in a log file.
    In addition, access protection on an IP address level is possible.


    Unlike sockd, rinetd is generally not used to give internal clients access to
    external services; it is more frequently used to pass packages from an external
    source to an internal service.


    Use rinetd on SUSE Linux Enterprise Server 10, you have to install the package
    rinetd. As with most services, rinetd can be started with the command


    # rcinetd start


    To start rinetd automatically at boot time, you can insert it into the init process
    with the command


    # insnerify rinetd


    The configuration of rinetd is located in the file /etc/rinetd.conf. You can find
    an example configuration file in the directory usr/share/doc/packages/rinetd/,
    which you can use as a template for your setup.


    The configuration file contains rules which define how rinetd forwards incoming
    TCP connections. Changes in the configuration file are activated either by restarting
    rinetd or after a hang-up signal has been sent with killall -HUP rinetd, which
    causes the configuration file to be reread.'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'With a restart, existing connections are interrupted. The hang-up signal does
    not interrupt existing connections.


    To configure rinetd, you have to do the following:


    +   - Configure Forwarding Rules

    - Configure Allow and Deny Rules

    - Configure Logging


    #  Configure Forwarding Rules


    These forwarding rules define the main functionality of rinetd—forwarding TCP
    connections to other addresses. The format is very simple:


    local_Address local_port destination_address destination_port


    For example:


    ```

    194.46.73.33 80 192.168.1.3 80

    ```


    This rule will forward all connection requests to TCP port 80 on the network interface
    with the IP address 194.46.73.33 to the TCP port 80 of the web server with the
    IP address 192.168.1.3 in the DMZ without having to activate routing on the gateway
    which rinetd is running.


    Instead of port numbers, service names from /etc/services can be used. The example
    for port 80 then appears as follows:


    ```

    194.46.73.33 www 192.168.1.3 www

    ```


    In addition, host names can be used instead of IP addresses, assumes, however,
    that there is a working DNS or corresponding entries in /etc/hosts.'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'SUSE Linux Enterprise Server 10: Security


    > It is better at this point to work with IP addresses to avoid DNS spoofing.
    The IP address 0.0.0.0 stands for all available interfaces of the gateway on which
    rinetd is running.


    #  Configure Allow and Deny Rules


    Using allow and deny rules, you can implement effective access control on specific
    forwarding rules.


    Allow and deny rules that are defined before the first forwarding rule are valid
    globally for all forwarding rules. If a rule matches the address of a new connection
    or no allow rule matches this address, the connection is refused.


    Allow and deny rules that are defined after a specific forwarding rule are only
    valid for this one forwarding rule.


    Addresses in allow and deny rules can also be written as address patterns. An
    address can consist of the digits 1 to 9, ''.'', "dot", "?", and "*". The "?"
    stands for any character. The "*" stands for any number of characters.


    For example:


    ```

    deny 141.73.21.*

    ```


    This rule matches all addresses from the class C network 141.73.21.0/24 and voids
    any forwarding rules for computers with addresses from this network.


    rinetd does not allow host names instead of IP addresses in allow and deny rules,
    because name resolution would cause significant drops in performance.


    CNI USE ONLY-1 HARDCOPY PERMITTED


    8-76 Copying all or part of this manual, or distributing such copies, is strictly
    prohibited. To report suspected copying, please call 1-800-PIRATES. Version 1'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'rinetd is a single process server—one single process has all connections under
    its control. Name resolution causes all other connections to be halted. The exclusive
    use of IP addresses is not a disadvantage at this point because, for security,
    only IP addresses should be used here to prevent DNS spoofing.


    # Configure Logging


    rinetd can write log messages using syslog. The configuration option to activate
    this logging is syslog. Optional parameters are facility and priority:


    ```

    syslog local0 info

    ```


    If facility and priority are not specified, the defaults daemon and info are used.


    Entries in /var/log/messages look like the following:


    ```

    May 2 06:05:57 da10 rinetd[5688]: 10.0.0.43 10.0.0.34:80 10.0.0.33:80

    in:0 out:0 not-allowed

    May 2 06:54:15 da10 rinetd[5735]: 10.0.0.33 10.0.0.34:80 10.0.0.33:80

    in:0 out:0 started

    May 2 06:54:41 da10 rinetd[5735]: 10.0.0.33 10.0.0.34:80 10.0.0.33:80

    in:1994 out:3088 done-local-closed

    ```


    The manual page of rinetd describes how to configure logging to a separate file;
    however, this does not seem to be implemented in the version of rinetd included
    in SLES 10.'
  merge: -1
  img_proc: true
