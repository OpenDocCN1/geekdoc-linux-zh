- pgno: 33
  md: '# SUSE Linux Enterprise Server 10: Security


    Also, a security concept for a computer used by multiple users at different times
    is different from a security concept for an environment in which many different
    users use multiple computers at the same time.


    +   - Which zones exist and what security needs do they have?


    You should create corresponding security zones for computers belonging to the
    same protection class.


    +   - What might happen to security zones if security barriers are breached?


    This question is not difficult to answer if the security zones have previously
    been clearly defined.


    +   - Who are potential attackers?


    You also need to estimate the financial and technical means of the potential attackers.


    +   - What information is of special interest to others?


    This question helps you group zones with different security needs.


    +   - What are the remaining risks when the security concept is implemented?


    This question can only be asked at the end of the analysis. Consider all questions
    asked, the relevant answers, and the technical and organizational implementation
    of the security concept.


    # Analyze the Current Situation and Necessary Enhancements


    A company-wide security policy should guarantee the confidentiality, data integrity,
    availability, and transparency of a company''s business processes and prevent
    damage.


    CNI USE ONLY-1 HARDCOPY PERMITTED


    1-10 Copying all or part of this manual, or distributing such copies, is strictly
    prohibited. To report suspected copying, please call 1-800-PIRATES. Version 1'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The security policy determines what security demands are required for specific
    data and resources. The security policy should include the analysis of the remaining
    risk. Risks that cannot be removed or can only partially be removed by taking
    appropriate protective measures should be highlighted.


    The security policy always also includes a description of the current state of
    security. For this, information is needed on who is required to do what to achieve
    the desired security level.


    The following tables show some examples of what topics need to be covered in the
    security policy and how you could keep track of the various tasks involved in
    getting from the current state to the target state. The scenario behind the following
    tables is an imaginary company with subsidiaries in several countries.


    This table covers aspects of the physical access to the IT infrastructure:


    # Table 1-2


    | Security of Network Components | How the components and their physical storage
    areas are secured against unauthorized access |

    |---||

    | Current state | The network cabinets are freely accessible so that each member
    of staff can patch his network connections. |

    | Target state | Technical rooms are locked, so only system administrators have
    access. |

    | Task | The locks must be checked and keys assigned to system administrators.
    |

    | Date | 2006-02-02 |

    | Responsible person | Jenny Doe, head of the System Administration department.
    |

    | Estimated expense | Approximately 5 days and $3000. |

    | Done/checked | 2006-03-01 Henry Boardman, assistant to the board. |'
  merge: -1
