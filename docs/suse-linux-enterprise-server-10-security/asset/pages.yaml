- pgno: 130
  md: '# Cryptography: Basics and Practical Application


    Until 30 years ago, cryptographic techniques were not in broad public use, but
    were limited to government agencies like the military. This has remarkably changed
    with the publication of public key cryptography and other cryptographic techniques
    that were developed in the mid-1970s.


    Today, e-commerce and many other applications rely heavily on cryptography. Indeed
    many applications would not work without it. The fact that strong cryptography
    is readily available for every citizen has various social and political implications.


    This section covers cryptography in general as well as practical aspects.


    # Objectives


    +   1. Cryptography Basics

    2. Create a Certification Authority (CA) and Issue Certificates with CLI Tools

    3. Create a Certification Authority (CA) and Issue Certificates with YaST

    4. GNU Privacy Guard (GPG)'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Objective 1


    # Cryptography Basics


    Cryptography is the mathematical science that deals with the development of cryptographic
    algorithms and their analysis.


    In its practical application, cryptography is used to prevent unauthorized individuals
    from viewing confidential information, to electronically sign documents, and to
    authenticate individuals or various devices.


    Among other things, cryptography deals with


    +   - Encryption and Decryption

    - Cryptographic Hash Algorithms and Digital Signatures


    # Encryption and Decryption


    The information required to encrypt and decrypt data is referred to as the key.
    The original message is referred to as cleartext, whereas the encrypted version
    is called ciphertext. The mathematical method to transfer cleartext into ciphertext
    using the key is referred to as cryptographic algorithm.


    There are two classes of encryption procedures:


    +   - Symmetric Encryption

    - Asymmetric Encryption'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Symmetric Encryption


    In symmetric encryption, the same key is used for encryption and decryption. The
    following figure shows encryption:


    Figure 4-1


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_132_0.png)


    This key needs to be kept secret. If this key is known, all data encrypted with
    that key can be decrypted, as shown in the following figure:


    Figure 4-2


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_132_1.png)'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# SUSE Linux Enterprise Server 10: Security


    The encryption algorithm should be known and published, so that competent cryptographers
    are able to review it. As a rule, you should never use a procedure where the manufacturer
    claims that the security of the procedure depends on the algorithm being kept
    secret. In other words, the secrecy of your message should only depend on the
    key being kept secret. If it depends on the algorithm being kept secret, your
    message is most likely not secured at all.


    An important characteristic of an encryption procedure is the length of the key.
    A symmetric key with a length of 40 bits can be broken by brute-force methods
    (trying every possible key) in a very short time: 40 bits correspond to “only”
    1,099,511,627,776 possibilities. Key lengths of 128 bits or more are currently
    considered secure.


    Common symmetric procedures are


    +   - DES (Data Encryption Standard)

    - Triple DES

    - IDEA (International Data Encryption Algorithm)

    - Blowfish

    - AES (Advanced Encryption Standard)


    # DES (Data Encryption Standard)


    DES was standardized in 1977 and is the foundation of many encryption procedures
    (such as UNIX/Linux passwords). The key length is 56 bits.


    However, in January 1999 the EFF (Electronic Frontier Foundation) decrypted a
    text encrypted with DES in 22 hours using brute force (trying one possible key
    after the other). Therefore, a key with a length of 56 bits is no longer secure,
    because messages protected with such a key can be decrypted in a short time.


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


    4-4


    Version 1'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Triple DES


    Triple DES is an extension of DES, using DES three times. Depending on the variant
    used, the effective key length offered is 112 or 168 bits.


    # IDEA (International Data Encryption Algorithm)


    IDEA is an algorithm with a key length of 128 bits. This algorithm has been patented
    in the USA and Europe (its noncommercial use is free).


    # Blowfish


    This algorithm has a variable key length of up to 448 bits. It was developed by
    Bruce Schneider; it is unpatented and license-free. It can be freely used by anyone.


    # AES (Advanced Encryption Standard)


    AES is the successor to DES. In 1993 the National Institute of Standards and Technology
    (NIST) decided that DES no longer met today''s security requirements and organized
    a competition for a new standard encryption algorithm. The winner of this competition
    was the Rijndael algorithm, which supports key lengths of 128, 192, or 256 bits.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Asymmetric Encryption


    The main problem with symmetric algorithms is how to securely transmit the secret
    key to your communication partner. Some governments use couriers for this purpose.
    Another approach is to use asymmetric encryption procedures.


    To use asymmetric encryption you need to know some theory and understand asymmetric
    encryption''s strengths and weaknesses.


    +   - Theory of Asymmetric Encryption

    - Caveats of Asymmetric Encryption


    # Theory of Asymmetric Encryption


    In an asymmetric encryption, also often called public key cryptography, there
    are two keys: a private key and a public key.


    Figure 4-3


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_135_0.png)'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'It is not possible to derive the private key from the public key. Data that
    was encrypted with the public key can only be decrypted with the private key.


    Figure 4-4


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_136_0.png)


    Figure 4-5


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_136_1.png)


    In the same way, data encrypted with the private key can only be decrypted with
    the public key.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# SUSE Linux Enterprise Server 10: Security


    The private key has to be kept secret. However, the public key can be distributed
    freely to everyone. Unlike symmetric encryption, there is no need to keep the
    key that was used to encrypt a message


    The key lengths used with asymmetric encryption are typically much longer than
    those used with symmetric encryption. The key length currently considered secure
    for an RSA key is 2048 bit.


    Some important asymmetric encryption procedures are


    +   - RSA

    - DSA

    - Diffie-Hellman


    # RSA


    The name RSA is derived from the surnames of its developers, Rivest, Shamir, and
    Adleman. Its security is mainly based on the fact that it is easy to multiply
    two large prime numbers, but it is difficult to regain the factors from this product.


    # DSA


    The DSA (Digital Signature Algorithm) is based on a cryptographic procedure developed
    by ElGamal. It is a US Federal Government standard for digital signatures.


    # Diffie-Hellman


    The Diffie-Hellman key exchange describes a method to establish cryptographic
    keys securely without having to send the keys across insecure channels. Such a
    key can then be used as a secret key in symmetric encryption.


    CNI USE ONLY-1 HARDCOPY PERMITTED


    4-8 Copying all or part of this manual, or distributing such copies, is strictly
    prohibited. To report suspected copying, please call 1-800-PIRATES. Version 1'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Caveats of Asymmetric Encryption


    Since anyone can create a private/public key pair and distribute it as the key
    of John Doe, the main problem with asymmetric encryption is how to determine the
    public key actually belongs to the person with whom you want to exchange encrypted
    communication.


    The best solution is to personally exchange the keys. When personal exchange of
    keys is not feasible, the answer is to use a certificate by a trusted third party
    that guarantees that a public key belongs to a certain person or legal entity.
    This topic is covered later in this section.


    Another problem of asymmetric procedures is their low speed. Symmetric procedures
    are much faster. Therefore, symmetric and asymmetric procedures are often combined:
    A key for symmetric encryption is transmitted through a channel encrypted asymmetrically.
    The information is then encrypted using a symmetric procedure and the key that
    was just transmitted. This is how the secure shell, SSL., and other protocols
    work.


    # Cryptographic Hash Algorithms and Digital Signatures


    This topic contains the following:


    +   - Hash Algorithms


    +   - Digital Signatures


    +   - Use of the Private Key to Encrypt Messages


    # Hash Algorithms


    A cryptographic hash algorithm is a mathematical procedure that takes data (a
    file of any length containing a message or binary data) as input and creates as
    output a string (the cryptographic hash) of a fixed length that is different for
    different input.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'SUSE Linux Enterprise Server 10: Security


    Ideally, no two messages ever have the same hash. In practice, such a collision
    is not absolutely impossible, but with hash algorithms currently in use the probability
    of such a collision is considered negligible for practical purposes.


    Various cryptographic algorithms are used to produce hashes from messages. They
    differ in the algorithm and the length of the hash. Common ones are MD5 (Message
    Digest Algorithm 5, developed by Ron Rivest, 128-bit hash), SHA1 (Secure Hash
    Algorithm, developed by the National Institute of Standards and Technology in
    collaboration with the National Security Agency, 160-bit hash), or Ripe160 (developed
    within an EU project, RACE Integrity Primitives Evaluation, 160-bit hash).


    Cryptographic hash algorithms are used when messages are digitally signed.


    # Digital Signatures


    Sometimes it is not really important to keep a message secret, it might be crucially
    to be sure that a message actually comes from a certain person and has not been
    altered, for example, during transmission.


    When a document is digitally signed, not the actual document is signed, but a
    hash derived from that document using a cryptographic algorithm is signed.


    # Use of the Private Key to Encrypt Messages


    When using asymmetric encryption to keep a message secret, the public key is used
    to encrypt the message. The private key is used to decrypt the message.


    CNI USE ONLY-1 HARDCOPY PERMITTED


    4-10


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


    Version 1'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'When digitally signing data, the private key is used to encrypt a cryptographic
    hash of the message.


    # Figure 4-6


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_140_0.png)


    The original message and encrypted hash are then sent together to the recipient.'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'The corresponding public key is used to decrypt the hash. The decrypted hash
    is then compared to a hash of the message generated by the same procedure by the
    recipient. If the two hashes—the newly calculated one and the decrypted one—are
    the same, it is assumed that the owner of the corresponding private key signed
    the message and that it has not been altered.


    # Figure 4-7


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_141_0.png)


    For example, this principle is applied when signing email with GPG.


    It is also used to create a certificate. In this case, a data structure containing
    a public key and some identity, an email address or a name, is signed with the
    private key of a certification authority, thus stating that the public key and
    name belong together.


    Another application is the signature created with the SUSE build key, which is
    contained in RPM packages from SUSE. The integrity of these RPM packages can be
    verified using the key in /root/.gnupg/suse_build_key.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Objective 2 Create a Certification Authority (CA) and Issue Certificates
    with CLI Tools


    Certification authorities (CA) and certificates are a solution to the problem
    of determining if a certain public key actually belongs to a certain person.


    As long as keys are only exchanged between a few people within an office or a
    town, a CA is not needed. As soon as the number of people involved increases or
    the distance gets too large, a CA markedly facilitates key exchange and management.


    The CA acts as a trusted third party that checks the identity of an entity (person
    or company) and issues a certificate that basically states: The public key in
    this certificate belongs to the identity given in here. It implies that identity
    owns the corresponding private key.


    Certificates are either issued by a commercial CA offering this service, or by
    a CA you set up on your own. Whether a commercial CA or one created within the
    company is used depends to a large degree on the use of the certificates and the
    security standards set by the security policy.


    When an e-commerce web site is offering worldwide services, a certificate issued
    by companies like VerSign or eTrust is must. If your security policy has requirements
    that go beyond a purely software-based public key infrastructure (PKI), you will
    most likely turn to an outside company to take care of your certificates.


    However, if you do not have such requirements, you do not need an external company
    to take care of your certificates. You can create your own CA. You can use OpenSSL
    on the command line for this purpose, and SUSE Linux Enterprise Server 10 comes
    with a YaST module to create and manage a CA and certificates.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Using your own CA has advantages if, for instance, the whole purpose is to
    authenticate the staff members of the company when they are remotely accessing
    the internal network via the Internet. Compared to getting a certificate for each
    employee from an outside company, it is more flexible and less costly.


    To issue a certificate, you have to


    +   - Create a Root CA

    - Create a Certificate Signed by the Root CA

    - To revoke a certificate, it is necessary to

    - Create a Certificate Revocation List (CRL)


    # Create a Root CA


    CAs can form a hierarchy. The topmost CA is called the root CA. As there is no
    agency above it to sign its certificate, the root CA can sign it itself. The root
    CA issues certificates for lower CAs or certificates for end users, depending
    on its policy.


    A CA below the root CA would have a certificate validated by the root CA. It could
    issue certificates to even lower CAs or end users.


    The package OpenSSL includes all you need to create a CA and issue certificates.
    OpenSSL keeps certificates and keys in separate directories, that have to be created
    before you start creating certificates.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Let''s say you want to keep the certificates in root''s home directory in the
    directory da10-CA. The following commands create the necessary structure:


    ```

    da10:~ # mkdir da10-CA

    da10:~ # cd da10-CA/

    da10:~/da10-CA # chmod 700 certs private crl

    da10:~/da10-CA # ls -l

    total 1

    drwxr-xr-x 6 root 144 Apr 26 16:50 .

    drwx------------ 20 root 1024 Apr 26 16:49 -

    drwxr-xr-x 2 root 48 Apr 26 16:50 crl

    drwxr-xr-x 2 root 48 Apr 26 16:50 certs

    drwxr-xr-x 2 root 48 Apr 26 16:50 newcerts

    drwx------ 2 root 48 Apr 26 16:50 private

    da10:~/da10-CA #

    ```


    **certs** and **newcerts** will hold certificates, while the corresponding private
    keys are stored in **private, crl** stands for certificate revocation list, which
    will be explained in more detail later.'
  merge: -1
  img_proc: true
- pgno: 145
  md: "# SUSE Linux Enterprise Server 10: Security\n\nThat would already be enough\
    \ to start creating the root certificate.\nHowever, by editing /etc/ssl/openssl.cnf\
    \ to fit your needs before\ncreating the first certificate, you can spare yourself\
    \ a lot of typing.\nYou should edit HOME and dir and some other variables in this\n\
    file as the default values suggested during the certificate\ncreation. The following\
    \ shows some of the entries you might want\nto change to italics:\n\n```\n# This\
    \ definition stops the following lines choking if HOME isn't\n# defined.\nHOME\n\
    \    = /root/da10-CA\ndir = /root/da10-CA # Where everything is kept\ncerts =\
    \ $dir/certs # Where the issued certs are kept\ncrl_dir = $dir/crl # Where the\
    \ issued crl are kept\ndatabase = $dir/index.txt # database index file.\nunique_subject\
    \ = yes # Set to 'no' to allow creation of several certificates with same\nnew_certs_dir\
    \ = $dir/newcerts # default place for new certs.\ncificate = $dir/da10-cacert.pem\
    \ # The CA certificate\nserial = $dir/serial # The current serial number\n#crnumber\
    \ = $dir/crnumber # the current crl number\n# # must be commented out to leave\
    \ a V1 CRL\ncrl = $dir/da10-crl.pem # The current CRL\nprivate_key = $dir/private/da10-cakey.pem\
    \ # The private key\nRANDFILE = $dir/private/rand.. # private random number file\n\
    \n[ req_distinguished_name ]\ncountryName = Country Name (2 letter code)\ncountryName_default\
    \ = de\ncountryName_min = 2\ncountryName_max = 2\n\nstateOrProvinceName = State\
    \ or Province Name (full name)\nstateOrProvinceName_default = Bavaria\n\nlocalityName\
    \ = Locality Name (eg, city)\nlocalityName_default = Munich\n```\n\n# CNI USE\
    \ ONLY-1 HARDCOPY PERMITTED\n\nCopying all or part of this material\n\n4-16\n\n\
    Version 1"
