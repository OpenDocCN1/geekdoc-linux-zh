- pgno: 80
  md: '# nmap


    nmap (http://www.insecure.org/) is a sophisticated port scanner with many options.


    You can use it to determine which ports are open, which services are actually
    running on those ports, and which operating system is being used by the host you
    are scanning.


    Calling nmap without options shows the main options:


    ```

    daldo0~ # nmap\Nmap 4.00 ( http://www.insecure.org/nmap/ )

    Usage: nmap [Scan Type(s)] [Options] (target specification)

    TARGET SPECIFICATION:

    Can pass hosts, IP addresses, networks, etc.

    -Ex: scan.nmap.org, microsoft.com/24, 192.168.0.1; 10.0-255.1-254

    -i <filename>: Input from list of hosts/networks

    -IR <num hosts>: Choose random targets

    --exclude [host1],[host3],...: Exclude hosts/networks

    --excludefile <exclude_file>: Exclude list from file

    HOST DISCOVERY:

    -SL List Scan - simply list targets to scan

    -SP Ping Scan - go no further determining if host is online

    -PT Treat all hosts as online - skip host discovery

    -PA/PU [portlist]: TCP SYN/ACK or UDP discovery to given ports

    -PP/PM ICMP echo, timestamp, and netmask request probes

    -N/-R: Never DNS resolution/Always resolve [default: sometimes]

    --dns-servers <server1,server2,...>: Specify custom DNS servers

    --system-dns: Use OS''s DNS resolver

    SCAN TECHNIQUES:

    -ss/T/sa/sw/s: TCP SYN(Connect)/ACK/Windows/Maimon scans

    -sn/sF: TCP Null, FIN, and Xmas scans

    --scanflags <flags>=: Customize TCP scan flags

    -SI <zombie host[::probeport]> Idlescan

    -SO: IP protocol scan

    -b <ftp relay host>: FTP bounce scan

    ...

    ```


    You only need to use the basic options to verify your installation.


    Usually you want to find out which ports are open, offering services, and if this
    matches the output of netstat and the list of services you want to offer on this
    computer.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# A TCP connect and an UDP scan should suffice.


    ```

    da20:~ # nmap -sU -sT da20.digitalairlines.com


    Starting Nmap 4.00 ( http://www.insecure.org/nmap/ ) at 2006-07-05 12:50

    CEST

    Interesting ports open on da20.digitalairlines.com (10.0.0.20):

    (The 3144 ports scanned but not shown below are in state: closed)

    PORT      STATE      SERVICE

    22/tcp    open       ssh

    111/tcp   open       rpcbind

    111/udp   open filtered rpcbind

    123/udp   open filtered ntp

    137/udp   open filtered netbios-ns

    138/udp   open filtered netbios-dgm

    139/udp   open       netbios-ssn

    445/tcp   open       microsoft-ds

    631/tcp   open       ipp

    32768/udp open filtered omad

    MAC Address: 00:11:11:C2:35:F4 (Intel)

    ```


    Nmap scan report finished: 1 IP address (1 host) scanned in 1471.62 seconds


    The scan of UDP ports takes some time. If you scan all ports (-1-65535), expect
    the scan to be quite time-consuming.


    nmap allows you to scan other hosts with spoofed IP addresses interspersed, different
    settings of TCP flags (like none set - null or all set - xmas). Options you use
    depend on what you want to find out.


    You can use nmap to find hosts on a particular network and the services they are
    offering, or to get information about hosts behind a firewall.


    You can also run an idle scan which scans a host without sending any packets to
    that directly. It uses another machine (the zombie) for this purpose. Idle scans
    are described in http://www.insecure.org/nmap/idlescan.html. This web page explains
    how to defend against such a scan.


    The site lists popular security tools at http://www.insecure.org/tools.html.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'As a general note of caution: While a port scan is basically nothing to really
    worry about, some administrators consider it as a kind of attack in itself, or
    as a first stage of an attack. Also, some ISPs have rules forbidding port scans
    and reserve the right to terminate service for those violating that. Before you
    start scanning a machine, get permission to do so.


    # # nessus


    **nessus (http://www.nessus.org/) is a vulnerability scanner. Its main purpose
    is to give you an overview of the vulnerabilities existing in your network.**


    When you are in charge of many different computers, it is hard to keep track of
    the vulnerabilities and which computer has been patched against what. nessus can
    help you with this task.


    The scanning itself is done by the nessus daemon, while the nessus client controls
    and launches the scans. Nessus scales well to larger networks, because it is possible
    to have nessus running in subnets, avoiding the need to scan across routers, and
    to control the daemons from one client.


    To prevent random users from using nessus to scan hosts, the client has to authenticate
    with the server. Certificates are used for this purpose.


    Several steps are needed to launch a scan:


    +   1. As root, issue the following command and answer any dialogs with appropriate
    information:


    ```

    nessus-mkcert

    nessus-adduser

    nessusd start

    nessus

    ```


    +   2. In the graphical user interface, use the login you created with the nessus-adduser
    script, and the the corresponding password.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '3. Choose the target, wait a few minutes, and view the result.


    Everything is explained with comprehensive descriptions and recommendations, so
    that you can decide what to do about it. For documentation purposes, the report
    can be saved as HTML, XML, or Latex.


    Because new flaws are being discovered and published every day, new nessus plug-ins
    are written every day both by the nessus vendor Tenable Network Security and the
    user community.


    You can use the command nessus-update-plugins to download the latest nessus plug-ins
    to your system. Plug-ins are immediately available for direct feed customers and
    seven days later to registered feed users. See http://www.nessus.org/plugins/
    for details.


    > A nessus can crash services or entire hosts under certain conditions. Don’t
    scan without permission and coordinate with system administrators to avoid server
    downtimes and upsets.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_83_0.png)'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Documentation


    After installation and testing, you should document what has been

    d. There is no hardbound rule how this is to be done. We suggest

