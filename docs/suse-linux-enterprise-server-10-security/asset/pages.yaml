- pgno: 52
  md: '# SECTION 2 Host Security


    Host security is achieved by general system administration with security in mind.
    It starts when the machine is being set up and continues with routine system administration
    and keeping the security patches installed.


    This section covers the various aspects involved with host security. Some topics
    are covered only briefly here, as they have been covered already extensively in
    the SUSE Enterprise Server Administration courses (3071, 3072, and 3073).


    # Objectives


    +   1. Limit Physical Access to Server Systems

    2. Partitioning and File System Security

    3. Limit the Installed Software Packages

    4. Configure Security Settings with YaST

    5. Stay Informed about Security Issues

    6. Apply Security Updates

    7. Test and Document the Configuration

    8. Use Logging and Accounting'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Objective 1


    # Limit Physical Access to Server Systems


    If a server is not protected from unauthorized physical access, the best software
    configuration cannot prevent someone from misusing it.


    By rebooting a system from a floppy or CD, or by passing boot parameters to the
    Linux kernel, someone can access the server without knowing the root password.


    To prevent unauthorized users from physically accessing the server, do the following:


    +   - Place the Server in a Separate, Locked Room


    +   - Secure the BIOS with a Password


    +   - Secure the GRUB Boot Loader with a Password


    # Place the Server in a Separate, Locked Room


    The best way to prevent physical access to a server is to lock the server in a
    dedicated server room. We highly recommend that you do this for every production
    system.


    The server room should be locked with a solid door, and only system administrators
    should have access. The room should be protected against fire and equipped with
    an automatic fire extinguishing system.


    What can be done depends on the size of the company and the available financial
    resources. We recommend a separate, locked room for all servers at the very least.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Secure the BIOS with a Password


    For test systems or workstations that are not placed in a secure room, there are
    some things you can do to make it more difficult to access a system without an
    account.


    One of these is to set a password for the BIOS setup.


    The BIOS represents the lowest level of software and lies underneath the operating
    system. Modern BIOS versions give you the option of protecting the boot process
    with a password.


    You can also protect the BIOS settings and prevent the system from booting from
    media like floppy disks or CDs.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_54_0.png)


    The exact procedure for protecting the BIOS depends on the BIOS vendor and version.
    For more details on this, please consult your vendor documentation.


    By preventing the system from booting from a different medium, only the installed
    system can be started. This system is password protected and cannot be accessed
    without other effort.


    For example, a BIOS password can be reset by removing the CMOS battery for some
    time or temporarily setting some jumpers on the motherboard. Some older BIOSes
    even have master passwords which render a BIOS password completely useless.


    Due to the above, BIOS passwords give only minor improvements of security. BIOS
    passwords are never a replacement for a dedicated server room.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Secure the GRUB Boot Loader with a Password


    Another way to misuse physical access to a Linux system is to reboot and pass
    additional parameters (such as init=/bin/bash) to the kernel. This makes it possible
    to start and access the system as root without entering a password.


    The GRUB boot loader can be configured to prompt for a password before any parameters
    can be entered. To do this, you need to enter an encrypted password with the following
    command:


    ```

    grub-md5-crypt

    ```


    This command asks for a password that needs to be confirmed once and outputs a
    hashed string. This string looks like the:


    ```

    $SEVCU0$$7WQL05kHiK4VKDstfI0

    ```


    The password hash needs to be added to the GRUB configuration file /boot/grub/menu.lst.


    You will find the global section at the beginning of the configuration file. The
    password needs to be placed in that section as shown in the following example:


    ```

    color whits/blue black/light-gray

    default 0

    timeout 8

    gfxmenu (hd0,5)/boot/message

    password --md5 1$SEVCU0$$7WQL05kHiK4VKDstfI0

    ```


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_55_0.png)


    GRUB is covered in depth in course 3072, SUSE Linux Enterprise Server 10 Administration.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Objective 2


    # Partitioning and File System Security


    After a user has logged in to the system, what she can or cannot do is mainly
    determined by the partitioning, the way the file systems are mounted, and the
    security settings of the file system.


    In UNIX systems like Linux, file system security is especially important because
    every resource available on the system is represented as a file.


    For example, when a user tries to access the sound card to play audio data, the
    access permissions of the sound card are determined by the permission settings
    of the corresponding device file in the /dev directory.


    To ensure basic file system security, you need to know the following:


    +   * Hard Disk Partitioning

    * The Basic Rule for User Write Access

    * The Basic Rule for User Read Access

    * How Special File Permissions Affect System Security


    # Hard Disk Partitioning


    The standard installation provides for a swap partition and one partition for
    the entire "/ directory. This is quite comfortable because the entire space is
    available for all directories, and you do not worry about partitioning.


    However, this approach has some disadvantages.


    For example, the hard /var/ directory might be full with log files and occupy
    the entire hard disk space, leaving no room for users to store files in their
    home directories. Or a user consume all of the hard disk space with files in his
    home directory or in /tmp/, preventing other users from working with this machine
    (Denial of Service).'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'You can prevent some of these problems by distributing parts of the file system
    to separate partitions.


    Also, using LVM (Logical Volume Manager) results in more flexibility than using
    a single partition for the entire file system. LVM allocates the available hard
    disk space to a logical volume group, which in turn is split into several volumes.


    Similar to hard disk partitions without LVM, each of these logical volumes can
    hold parts of the file system. However, logical volumes are much easier to resize
    than native hard disk partitions.


    Depending on the purpose of the respective machine, you may want to place some
    of the following directories in separate partitions:


    +   - /var/ (or individual subdirectories of this directory)

    - /tmp/

    - /usr/

    - /opt/

    - /srv/ (or individual subdirectories of this directory)

    - /home/


    The size of the individual partitions also depends on the purpose: on a mail server,
    the partition containing /var/spool/mail/ needs most of the space; on a web server,
    the partition containing /srv/www/ needs most of the space.


    If the file system is distributed to partitions in this way, log files could still
    fill the respective partition but not the other partitions.


    Certain properties of individual partitions can also be modified using mount options
    in the file /etc/fstab.


    Depending on the server''s purpose, you may want to mount /home/ and /tmp/ with
    the options noexec, nosuid, and nodev.


    The option ro could be useful for /usr/ and /opt/.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'SUSE Linux Enterprise Server 10 also offers the option to encrypt entire partitions.
    This is especially useful on notebooks to minimize the risk of data getting into
    the wrong hands when a notebook is lost or stolen. The minimum length of the passphrase
    required by YaST is 8 characters, but to have a passphrase equivalent in strength
    to the 128-bit encryption key used to encrypt the partition, you should use 20
    random characters.


    Partitions, LVM, and file systems, as well as their administration are covered
    in detail in course 3072, SUSE Linux Enterprise Server 10 Administration.


    # The Basic Rule for User Write Access


    The file systems used in Linux are structurally UNIX file systems.


    They support the typical file access permissions (such as read, execute, sticky
    bit, SUID, and SGID).


    Apart from additional standard functionalities, such as various time stamps, the
    access permissions can be administered separately for file owners, user groups,
    and the rest of the world (user, group, and other).


    > The administration of file ownership and permissions is covered in course 3071,
    SUSE Linux Enterprise Server 10 Fundamentals.


    As a general rule, a normal user should only have write access in the following
    directories:


    +   - The home directory of the user

    - The /tmp directory to store temporary files


    Depending on the purpose of a computer, other directories can be writable for
    users.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'For example, if you install a Samba file server, a writable share directory
    that is also writable for the Linux user the connection is mapped to.


    Some device files (like those for sound cards) might also be writable for users
    since applications need to send data to the corresponding devices.


    # The Basic Rule for User Read Access


    Some files in the system should be protected from user read access. This is important
    for files that store passwords. No normal user account should be able to read
    the content of such files. Even when the passwords in a file are encrypted, the
    files must be protected from any unauthorized access.


    The following lists are some files containing passwords on a Linux system:


    +   /etc/shadow. This file contains user passwords in an encrypted form. Even
    when LDAP is used for user authentication, this file contains at least the root
    password.


    +   /etc/samba/smbpasswd. This file contains the passwords for Samba users.


    +   Files with Apache passwords. The location of these files depends on your configuration.


    They contain passwords for the authorized access to the server.


    +   /etc/ldap/slapd.conf. This file contains the root password for the openLDAP
    server.


    +   /boot/grub/menu.lst. This file can contain the password for the GRUB boot
    loader.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_59_0.png)


    This list is not complete. There can be more password files on your system, depending
    on your system configuration and your software selection.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Some password files can be readable for a non-root account. This is normally
    the account (user ID) under which the service daemon needs to access the file
    is running. For example, the Apache server runs under the user ID wwwwun. For
    this reason, the password files must be readable for the user wwwwun. In this
    case you have to make sure that only this daemon account and no other user can
    read the file.


    # How Special File Permissions Affect System Security


    Three file system permissions influence the security in a special way:


    +   - The SUID bit. If the SUID bit is set for an executable, the program starts
    under the user ID of the owner.


    In most cases, the SUID bit is set to allow normal users to run applications with
    the permissions of the root users. This bit should only be set for applications
    that are well tested and if there is no other way to grant access to a specific
    task.


    An attacker could get access to the root account by exploiting an application
    that runs under the UID of root.


    +   - The GID bit. If this bit is set, it lets a program run under the GID of
    the group the executable file belongs to.


    It should be used carefully as the SUID bit.


    +   - The sticky bit. The sticky bit can influence the security of a system in
    a positive way. In a globally writable directory, it prevents users from deleting
    others users'' files that are stored in this directory.


    Typical application areas for the sticky bit include directories for temporary
    storage (such as /tmp and /var/tmp). Such a directory must be writable by all
    users of a system.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'However, the write permissions for a directory do not only include the permission
    to create files and subdirectories, but also the permission to delete these, regardless
    of whether the users have access to the content of these files and subdirectories.


    If the sticky bit is set for such a writable directory, deleting or renaming files
    in this directory is only possible if one of the following conditions is fulfilled:


    +   - The effective UID of the deleting or renaming process is that of the file
    owner.


    +   - The effective UID of the deleting or renaming process is that of the owner
    of the writable directory marked with the sticky bit.


    +   - The effective UID of the deleting or renaming process is that of the system
    administrator root.


    In SUSE Linux Enterprise Server 10, the /etc/permissions.* are used to set or
    remove these bits on executables and directories.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_61_0.png)


    You can use POSIX ACLs (Access Control Lists) to control access to files in more
    detail. These are covered in SUSE Linux Enterprise Server 10 Administration (Course
    3072).'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Objective 3


    # Limit the Installed Software Packages


    Every software package that is installed on a system but is not needed by that
    system, should be removed from a production server.


    The more software is installed, the more possible security problems can occur.
    For example, it does not make sense to install an X Server and graphical applications
    on a system that is exclusively used as a web server.


    To set up a production system, you can use the minimal system as a base for the
    software selection during the installation. Then you can manually add just those
    software packages that are needed.


    This rule is especially true for network daemons. A server should never offer
    any network services that are not needed. For example, if a server is a dedicated
    file server, it is not necessary to run a Postfix mail server on the same system.


    You can use the following command to check which services are configured to start
    in which runlevel:


    ```

    chkconfig -l

    ```


    The command displays a line for every service installed on the system. The following
    line shows the configuration of the Samba server:


    ```

    smb 0:off 1:off 2:off 3:on 4:off 5:on 6:off

    ```


    After the service name, the configuration for all seven runlevels is displayed.
    On means the service is configured to be started in the corresponding runlevel;
    off means the service will not be started.


    You can use the following command to prevent a service from being started in any
    runlevel:


    ```

    inserv -r service_name

    ```'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Removing a service from the runlevel configuration does not stop an already
    running daemon. A daemon that is already running needs to be stopped manually
    or the system needs to be rebooted to start with the new runlevel configuration.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_63_0.png)'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Objective 4 Configure Security Settings with YaST


    YaST offers a module to configure certain system settings that affect the local
    security. You can access the module from the YaST Control Center by selecting
    Security and Users > Local Security.


    With the module you can easily change the following settings of the system configuration:


    +   - The password settings

    - The boot behavior of the system

    - The login behavior

    - The user ID limitations

    - General file system security


    Because this YaST module is already covered in detail in course 3072, SUSE Linux
    Enterprise Server 10 Administration, we decided not to cover it again, despite
    the fact that its subject matter is relevant for this course as well.


    In view of the fact that this module covers various security settings, you might
    want to review the respective section of the 3072 course.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Objective 5


    # Stay Informed about Security Issues


    One of the most important security tasks for an administrator is to stay informed
    about current security issues. Damage can be prevented only when security patches
    are installed as quickly as possible.


    Once you registered SUSE Linux Enterprise 10 to become part of the Maintenance
    Program you are informed by email once security patches are available.


    Additionally, you can use the following resources to gather information about
    SUSE-related security issues:


    +   - http://www.novell.com/linux/security/securitysupport.html


