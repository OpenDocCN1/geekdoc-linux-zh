- pgno: 73
  md: '# Objective 7 Test and Document the Configuration


    Before the installed system goes into production, the configuration should be
    tested. While it is useful if a trusted third party audits the configuration,
    this is not always feasible, you can test the configuration to find errors that
    might otherwise go by undetected. The results of such scans should become part
    of the documentation.


    The most common open source tools for testing the security configuration are


    +   - netstat

    - ethereal

    - nmap

    - nessus


    # netstat


    netstat is a tool which can be used to check which network sockets are currently
    used by a system. Additionally you can determine the status of a socket. The command
    can be invoked with various parameters. The parameters have the following meaning:


    | Parameter | Meaning |

    | -p | Show the PID and the name of the program which owns the socket |

    | -a | Show both listening and non-listening sockets |

    | -t | Show TCP sockets |

    | -u | Show UPD sockets |

    | -n | Do not resolve IP addresses to host names |

    | -e | Display more detailed information |'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'A very useful parameter combination is netstat -patune. It lists UDP and TCP
    connections, shows the processes involved, and not resolve names.


    The following is an example output of such a netstat call:


    | Proto Recv-Q Send-Q Local Address Foreign Address State User Inode |

    | PID/Program name | | | | | | |

    | tcp 2916/cupsd | 0 0 | 0.0.0.0:631 | 0.0.0.0:* | LISTEN 0 | 4526 |

    | tcp 2425/sshd | 0 0 | ::22 | ::* | LISTEN 0 | 3306 |


    From left to right, netstat outputs the following information:


    +   - Proto. The used transfer protocol. This can be tcp, udp, or raw.

    - **Recv-Q.** The count of bytes not copied by the user program connected to this
    socket. This value should usually be 0.

    - **Send-Q.** The count of bytes not acknowledged by the remote host. This value
    should usually be 0.

    - **Local Address.** The IP address and port number of the local end of the socket.
    If you don''t use the -n option, the addresses are resolved into DNS host names.
    If the socket is in LISTEN state, the IP address 0.0.0.0 or ::: stands for any
    IP address.

    - **Foreign Address.** The IP address and port number of the remote end of the
    socket. If you don''t use the -n option, the addresses are resolved into DNS host
    names. If the socket is in LISTEN state, the IP address 0.0.0.0 or ::: stands
    for any remote address.

    - **State.** The state of the socket. Since there are no states in UDP and raw
    mode, this column may be left blank.


    The following is an overview of the possible states:


    +   - ESTABLISHED: The socket has an established connection.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   - SYN_SENT: The socket is actively attempting to establish a connection.


    +   - SYN_RECV: A connection request has been received from the network.


    +   - FIN_WAIT1: The socket is closed, and the connection is shutting down.


    +   - FIN_WAIT2: The connection is closed, and the socket is waiting for a shutdown
    from the remote end.


    +   - TIME_WAIT: The socket is waiting after close to handle packets still in
    the network.


    +   - CLOSED: The socket is not being used.


    +   - CLOSE_WAIT: The remote end has shut down; waiting for the socket to close.


    +   - LAST_ACK: The remote end has shut down, and the socket is closed. Waiting
    for acknowledgement.


    +   - LISTEN: The socket is listening for incoming connections. Such sockets are
    not included in the output unless you specify --listening (-l) or --all (-a) option.


    +   - CLOSING: Both sockets are shut down, but some of the data has not been sent.


    +   - UNKNOWN: The state of the socket is unknown.


    +   **User.** The username or the user ID (UID) of the owner of the socket.


    +   **Inode.** The inode of the socket.


    +   **PID / Program name:** The PID and the Program name of the process that owns
    the socket. You need to run netstat at root to see this information for all sockets.
    For sockets which are owned by kernel processes, this column is blank.'
  merge: -1
  img_proc: true
