  md: '# SECTION 11 LiveFire Exercise


    In this section, you get the opportunity to apply the information covered in this
    course in a comprehensive scenario.


    It is also intended as part of your preparation for the Novell CLE 10 (Certified
    Linux Engineer 10) Practicum exam.


    You will work with other students in these scenarios to do the following:


    +   - Set Up the Application-Level Gateway

    - Set Up the Screening Router

    - Set Up a Web Server in the DMZ

    - Set Up the Mail Server in the LAN

    - Set Up the VPN Gateway


    Remember that skills from all three Novell CLP 10 courses as well as SUSE Linux
    Enterprise Server 10: Networking Services (Course 3074) might be necessary to
    fulfill the required tasks.


    To complete these exercises, you will need several patch cables and switches or
    hubs, some of the computers need two NICs.'
