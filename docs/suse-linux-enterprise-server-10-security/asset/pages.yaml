    \ are defined between two brackets:\n- **With domainlist** you point to a file\
    \ that lists domains are, in this example, unwanted.\n- **With urllist** you configure\
    \ a file with unwanted URL components.\n\nThe definitions are combined with a\
    \ logical **OR**. In this example, the condition blacklist matches when the requested\
    \ URL matches either the domainlist or the urllist.\n\nsquidGuard looks for the\
