- pgno: 349
  md: '# SUSE Linux Enterprise Serve 10: Security


    The configuration is nearly the same on the other side; the only difference is
    that rightcert is specified instead of leftcert:


    ```

    # Connection between sites

    conn da10-da20


    # Left subnet gateway, subnet behind it, next hop toward right.

    left-subnet=172.16.0/24

    left=10.0.0.10

    leftid="C=DE, ST=Bavaria, L=Munich, OU=Digitalairlines, OU=Training

    connda20.digitalairlines.com/emailaddress=root@da10.digitalairlines.com

    #leftrasagkey=%cert # already part of defaults

    # Right security gateway, subnet behind it,

    # next hop toward left.

    right=10.0.0.20

    rightid="C=DE, ST=Bavaria, L=Munich, OU=Digitalairlines, OU=Training

    cnda20.digitalairlines.com/emailaddress=root@da20.digitalairlines.com

    rightcert=%etc/ipsec/certs/da20.cert.pem

    #rightrasagkey=%cert # already part of defaults

    rightsubnet=192.168.0.0/24

    # To authorize this connection, but not actually start,

    # at startup, uncomment this.

    auto=start

    ```


    The following table lists common parameters. Other parameters are explained in
    the main page for ipsec.config.


    | Parameter | Significance |

    | left right | The IP of the interface. If %defaultroute is specified, IPSec uses
    the current values of the interface with the default route. |

    | leftsubnet subnet | The network to be reached behind the gateway. If there is
    no network, such as in the case of a notebook, it is empty. |

    | leftnexthop rightnexthop | If left/right is not specified as %defaultroute,
    this parameter is used to tell IPSec of the next router. If there is no route
    between the two gateways, you can specify %direct. |

    | leftcert rightcert | Specifies the location of the certificate. |


