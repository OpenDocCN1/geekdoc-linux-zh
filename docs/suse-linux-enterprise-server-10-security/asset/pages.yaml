- pgno: 24
  md: '# SECTION 1 General Considerations and Definition of Terms


    Given the number of press reports about attacks on computers, it is not surprising
    that computer security is being taken more and more seriously. An entire branch
    of the IT industry is concerned with security. Many security products have been
    created in recent years.


    Firewall solutions and antivirus software have become best-sellers, and yet an
    important component of every security concept—perhaps even the most important
    component—is being neglected know-how. Without the appropriate knowledge you cannot
    recognize and understand security-critical issues in complex IT infrastructures.


    IT security is by no means an entirely technical matter. Without proper planning
    and coordination, there is no solution that can be called.


    In this section we will cover preliminary steps to take before implementing technical
    solutions. It also defines common IT Security terms as they are used in this course.


    # Objectives


    +   1. Create a Security Concept

    2. Understand Frequently Used Terms'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Objective 1


    # Create a Security Concept


    Technical solutions will not achieve their purpose if they are not part of an
    overall plan stating what level of security is the goal and how it will be achieved.


    To create a security concept, you must:


    +   - Understand the Basics of a Security Concept

    - Perform a Communication Analysis

    - Analyze the Protection Requirements

    - Analyze the Current Situation and Necessary Enhancements


    # Understand the Basics of a Security Concept


    > “It is easy to run a computer system. You merely have to disconnect all dial-up
    connections and permit only direct wired terminals, put the machine and its terminals
    in a shielded room and post a guard at the door.” F.T. Grampp and R.H. Morris
    (cited in “Firewalls and Internet Security: Repelling The Wily Hacker” by William
    R. Cheswick and Steven M. Bellovin, Addison Wesley, 1994)


    It might be possible to operate a computer system in this secure manner, but it’s
    not practical. To deal with network problems in the real world, a different security
    concept is required.


    What kind of security measures make sense and are reasonable?


    In his book Beyond Fear, the expert Bruce Schneider recommends a five-stage evaluation
    process prior to every security-relevant decision:


    +   - What assets are you trying to protect?

    - What are the risks to these assets?

    - How well does the security system mitigate these risks?

    - What new risks does the security system cause?


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   - What costs and trade-offs does the security solution impose?


    Moreover, you need to consider whether the expected security gain justifies the
    needed effort and costs.


    Actually, security-relevant decisions are made every day. For example, a person
    may decide to lock or to not lock the door when leaving the house, to install
    or to not install a certain lock or alarm system, and so forth.


    Since there is no single correct answer to the question the security gain justifies
    the effort and the costs, the answer differs from person to person. The answer
    depends on the individual evaluation of the risk, on the desired security level,
    and on how the measures will cost.


    In the private sphere, these questions can usually be answered easily. The answer
    is not so easy for IT managers who need to take numerous factors into consideration.


    When we talk about security strategy, we mean both the security policy and the
    security concept. The security policy defines the basic goals to be achieved in
    the field of security. The security concept comprises the individual steps for
    achieving the goals defined in the security policy.


    Because information technology has penetrated virtually all business processes
    and the security policy concerns all employees of a company, the practical implementation
    can be complex. Therefore, a systematic approach is needed.


    As a first step, there are some questions that need to be answered:


    +   - What Assets Do We Want to Protect?


    +   - What Are the Risks to These Assets?


    +   - What Needs to Be Done?


    When that is done, you will most likely need further information:


    +   - Information Resources'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# What Assets Do We Want to Protect?


    In the field of IT, we need to protect the following:


    +   - Confidentiality

    - Availability

    - Integrity


    The issue of confidentiality includes corporate production, research, development,
    sales, and marketing secrets. Moreover, personal data, such as the payroll details
    of the HR department or the patient data of a hospital, are included in this category.
    Access information like passwords must also be kept confidential.


    The issue of availability concerns the question whether the services are available
    whenever they are needed and if what extent downtimes can be tolerated.


    The issue of integrity comprises questions such as: Have the data been manipulated?
    Is the system still in the desired state, or has someone gained unauthorized access
    and manipulated it?


    # What Are the Risks to These Assets?


    In this context, many people spontaneously think of hackers, viruses, and worms.
    However, the assets that need to be protected may be endangered by threats of
    an entirely different nature. To determine the risk you have to look at the threat,
    the possible damage, and the likelihood of its occurrence.


    Here is a list of some potential risks:


    +   - Natural disasters

    - Fires, floods

    - Burglary, theft, vandalism

    - Fake information (e.g., manipulation of web pages)


    CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   Denial of service, services cannot be reached due to active attacks or
    overload (e.g., viruses)


    +   Data theft (internal, external)


    +   Misuse (e.g., spam transmission to third parties, taking control of a computer,
    attacks on third parties)


    +   User errors (e.g., unintentional deletion of files)


    Some of the listed risks require reliable physical measures (e.g., a fire extinguishing
    system) and cannot be addressed on operating system level. The overall security
    chain is affected by many factors and is only as good as its weakest link.


    Another important and related element of IT security is the data backup concept
    as discussed in SUSE Linux Enterprise Server Advanced Administration (Course 3073).


    Following the analysis of the risks, a suitable concept must be developed and
    implemented to protect the assets in the best way possible against observed or
    anticipated risks.


    # What Needs to Be Done?


    To answer the last three questions outlined by Bruce Schneider, the goal must
    be defined precisely. The company management must determine the security policy
    and formulate concrete goals. The result could be a general rule like “everything
    that is not explicitly permitted is prohibited” and the determination of the services
    available at the workplace.


    Instead of going into technical details, the goals must be expressed as clearly
    as possible to prevent liberal interpretations. Therefore, a security policy like
    “our network should be secure” would make no sense.


    The next step is a comprehensive assessment of the current situation and the preparation
    of a security concept that leads from the current state to the target state.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Such a security concept should also include a discussion about any new problems
    the security concept could trigger, the costs involved with the implementation,
    and any remaining risks.


    Moreover, the security concept should define processes that ensure future deviations
    from the target state are identified and eliminated. Therefore, it is not sufficient
    to roll out the security concept once and for all; rather, ongoing monitoring
    is necessary. Thus, the security concept turns into a continuous security process.


    The following sections show how such a project could be handled. Based on an imaginary
    company, projects and subprojects as well as concrete tasks are defined. However,
    these are not intended as sample solutions that merely need to be adapted to your
    own situation.


    Instead, they show how solutions evolve. The formal procedure presented in this
    manual has been applied successfully in practice. It helps to identify errors
    and risks that are not easily discernible, and it provides a good documentation
    of the overall system.


    # Information Resources


    A very useful and comprehensive information resource which goes far beyond the
    scope of this training manual is the IT-Grundschutz Manual (baseline protection
    manual) published by the German Federal Office for Information Technology Security
    http://www.bsi.bund.de/english/gshb/manual/index.htm.


    # Perform a Communication Analysis


    Creating a security concept begins with a communication analysis. This includes
    analyzing the security situation and evaluating the dangers.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Resources differentiated according to what a user needs and how access to these
    resources are controlled. If users should not have access to certain resources,
    you can assign different access permissions to individual users.


    For example, you can determine which user groups can use a resource or if the
    user groups can only access the resource during a certain time period.


    By answering the following questions, you can get valuable information to use
    in developing a structured overall picture of your security needs.


    +   * What information will be exchanged across which barriers and in which direction?


    A barrier can be the virtual barrier between directories of two users in a UNIX
    system or a firewall between two networks.


    +   * Which data packets will be transported with which protocols to which hosts
    in the network?


    The fewer protocols you use, the better security you will have, simply because
    there are fewer sources of error.


    +   * What resources are available to individual users and with access permissions?


    Consider the resources users will need: printers, files on storage media, the
    storage media themselves (such as CD-ROMs), sound cards, modems, fax cards, ISDN
    cards, USB ports, network services (such as FTP or HTTP), and the computing capacity
    of CPUs.


    +   * Which resources must be available in each work area?


    Even in small companies, different departments require different resources.


    +   * Which data users have access to data and in which way?


    It does not make sense to organize access to data for each specific user individually.
    It is better to structure access permissions for user groups.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - Which external users have external access to company resources, what
    resources do they use, and how is access controlled?


    Pay special attention to authenticating external users.


    +   - Which external resources does the company provide?


    Usually a company uses web and mail servers and other Internet services.


    +   - Should users be charged for resources?


    Many organizations charge users or departments for expensive resources (such as
    Internet bandwidth).


    +   - Which tasks must external service providers be involved?


    Determine if it is necessary to exchange any security-relevant data with the external
    service provider.


    +   - How do security restrictions affect users, and how open are we users to
    these restrictions?


    Users are more willing to live with restrictions if they understand why the restrictions
    are needed.


    +   - Will you filter transmitted or stored information on gateways between networks
    or on computers?


    This applies to virus control, which should take place where the viruses can be
    reliably detected, on workstations and file servers. Scanning email on the mail
    server is common, but has certain limitations; it is, for instance, not possible
    to find viruses in encrypted mail.


    +   - How do individual resources need to be?


    Not every file server in the company needs to have a high availability setup.
    This is why it is important to calculate exactly what costs are incurred if a
    resource fails.


    Important parts of the communication analysis can be represented in tables, also
    known as access matrices.'
  merge: -1
  img_proc: true
- pgno: 32
  md: "The following table shows a simple access matrix that lists the accessible\
