- pgno: 359
  md: '# Test the Connection


    When connecting two sites, only the connections to and from hosts in the networks
    behind the gateways are encrypted between the gateways.


    It is possible to connect from one gateway to the other (for instance ping), but
    this connection does not go through the tunnel.


    Connections from one gateway to hosts behind the other gateway are not possible
    either. If the packet can be routed at all the Internet, which is not the case
    if private address ranges are used in the local networks, the packet to the network
    on the other side does not go through the tunnel, while the packet in the tunnel
    is discarded by the IPSec stack because it doesn''t belong to any IPSec connection.


    To test the connection, you need to establish connections from a host behind the
    gateway to a host behind the other gateway. If this next step is to make sure
    the packets between the gateways are actually encrypted.


    With a 2.4.x kernel this is rather easy because there is an ipsec interface when
    ipsec is started. tcpdump on ipsec cleartext packets, whereas tcpdump on the network
    interface (eth0, eth1, etc.) shows encrypted (ESP).


    A 2.6.x kernel does not create an ipsec interface. tcpdump on the network interface
    shows encrypted well as unencrypted packets.


    To be absolutely sure that there are no unwanted clearest packets on the wire,
    you have no choice but to connect another computer with a hub to that interface
    and run a tcpdump on that computer to see what kind of packets actually leave
    the network card.'
  merge: -1
  img_proc: true
