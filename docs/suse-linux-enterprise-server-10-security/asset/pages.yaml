- pgno: 345
  md: '# Configure /etc/ipsec.conf


    The file /etc/ipsec.conf has several parts. The first section defines basic configuration
    parameters that are independent of specific connections:


    ```

    # /etc/ipsec.conf - Openswan IPsec configuration file

    # RCSID $Id: ipsec.conf.in,v.15.2.2 2005/01/14 20:10:27 paul Exp X $

    # This file: /usr/share/doc/packages/openswan/ipsec.conf-sample

    # Manual: ipsec.conf.5

    version 2.0 # conforms to second version of ipsec.conf specification


    # basic configuration

    config setup

    # plutodebug = "all", "none" or a combation from below:

    # raw crypt parsing emitting control klips pfkey natt x509 private

    # eg:

    # plutodebug="control parsing"

    #

    # Only enable klipsebug=all if you are a developer

    #

    # NAT-TRAVERSAL support, see README.NAT-Traversal

    # nat_traversal=yes

    # virtual_private=%v4:10.0.0/8,%v4:192.168.0.0/16,%v4:172.16.0/12


    # Certificate Revocation List:

    #crcheckinterval=600

    #strictcrlpolicy=yes

    #

    # Change rp_filter_setting? (default is 0, disabled)

    # See also setting in the /etc/sysctl.conf file!

    #rp_filter=unchanged

    #

    # Workaround to setup all tunnels immediately, since the new default

    # of "plutowait=no" causes "Resource temporarily unavailable" errors

    # for the first connect attempt over each tunnel, that is delayed to

    # be established later / on demand.

    #

    plutowait=yes

    ```'
  merge: -1
  img_proc: true
- pgno: 346
  md: "The following table explains the configuration parameters shown in the config\
    \ section of /etc/ipsec.conf. Other parameters are explained in the man page for\
    \ ipsec.conf.\n\n# Table9-1\n\n| Parameter | Significance |\n| --- | --- |\n|\
    \ klipsdebug, plutodebug | Determine the amount of information written to the\
    \ log file. |\n| crlinterval strictcrlpolicy | Determine how often the certificate\
    \ revocation list is checked for changes and if an-to-date CRL is strictly required\
    \ or not. |\n| rp_filter | Determines whether the value in /proc/sys/net/ipv4/conf/interface/rp_filter\
    \ should be changed. |\n| nattraversal | Activates the additional functionality\
    \ to tunnel IPSec over UDP packets to traverse NAT gateways. |\n\nThe section\
    \ conn %default covers parameters that are common to all connections. This avoids\
    \ having to repeat these parameters in each connection specification.\n\nThese\
    \ parameters can, however, be overwritten within specific connection specifications:\n\
    \n```\n# default settings for connections\nconn %default:\n  # keyintries default\
    \ to %forever\n  #keyintries=3\n  # Sig keys (default: %dnsdemand)\n  leftrasasigkey=%cert\n\
    \  rightrasasigkey=%cert\n  # Lifetimes, defaults are 1h/8hrs\n  #ikelifetime=20m\n\
    \  #keylife=1h\n  #rekeymargin=8m\n```"
  merge: -1
  img_proc: true
- pgno: 347
  md: '# SUSE Linux Enterprise Serve 10: Security


    The next section concerns a feature called opportunistic encryption.

    This feature is usually turned off and is not covered in this course.


    ```

    #Disable Opportunistic Encryption

    include /etc/ipsec.d/examples/no_oe.conf

    ```


    After that, each connection is described in a block starting with conn and an
    arbitrary name. All lines belonging to that block have to be indented, including
    comment signs within that block. A line starting in the first column ends the
    block.


    The following sample section is included in the default configuration file and
    gives the relevant parameters needed for a connection:


    ```

    # Add connections here

    # sample VPN connection

    #conn sample

    # Left security gateway, subnet behind, nexthop toward right.

    left=10.0.0.1

    leftsubnet=172.16.0/24

    nexthop=10.22.33.44

    # Right security gateway, subnet behind, nexthop toward right.

    right=10.12.12.1

    rightsubnet=192.168.0/24

    nexthop=10.101.102.103

    # To authorize this connection, but not actually start this.

    # at startup, uncomment this.

    #auto=start

    ```


    You are free in your choice of left and right. The man page for ipsec.conf suggests
    using left for the local and right for the remote side of the tunnel.


