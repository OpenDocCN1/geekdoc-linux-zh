- pgno: 280
  md: '# Define http_access Tags


    The http_access entries in the configuration file are processed from top to bottom.
    As soon as one line matches the request, the allow or deny rule is applied to
    the request and the remaining http_access lines are skipped.


    You can combine multiple acls in one http_access line. The acls are combined with
    a logical AND. The following example combines src and a time acl.


    ```

    acl dahosts src 10.0.0.0/24

    acl lunch time MTWHF12:00-13:00

    http_access allow dahosts lunch

    ```


    This setup allows access to the proxy for all hosts in the network 10.0.0.0/24
    from Monday to Friday from 12:00 noon to 1:00 p.m.


    If you want to combine several time periods in one acl, you have to use more than
    one line for the acl, as in the following example:


    ```

    acl dahosts src 10.0.0.0/24

    acl breaks time MTWHF 08:00-09:00

    acl breaks time MTWHF 12:00-13:00

    acl breaks time MTWHF 18:00-19:00

    http_access allow dahosts breaks

    ```


    This setup allows access to the proxy for all hosts in the network 10.0.0.0/24
    from Monday to Friday from 8:00 a.m. to 9:00 a.m., from 12:00 noon to 1:00 p.m.,
    and from 6:00 p.m. to 7:00 p.m.


    You can use ! before the name of an acl to negate the meaning of the http_access
    line:


    ```

    no_internet src 10.0.2.0/24

    http_access allow !no_internet

    ```


    This allows access to the proxy for every request not coming from the network
    defined in the no_internet acl line.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'When no http_access line matches a request, the default access rule is the
    opposite of the last found http_access line. Any allow turns into a deny and a
    deny turns into an allow.


    To avoid confusion, you should always have an http_access line at the end of your
    configuration that matches every request. This line sets the default (allow/deny)
    when no other acl matches.


    In the default configuration shipped with Squid on SUSE Linux Enterprise 10, this
    is done with the following acl http_access configuration:


    ```

    acl all src 0.0.0.0/0.0.0.0

    [...]

    http_access deny all

    ```


    The default configuration also contains some reasonable default settings that
    can be used as a base for your setup. Like options in the config file, the acl
    setup is well commented.


    The configuration file is the authoritative source of documentation.


    The debug level can be changed on a per-section basis; the sections are listed
    in /usr/share/doc/packages/squid/debug-sections.txt. For instance, Section 28:
    Access Control, Section 33: Client-side Routines. Debug level 1 produces little,
    level 9 produces debug messages.


    If your access rules do not produce the expected result and the reason is not
    obvious to you, you can temporarily increase Squid''s debug level. debug_options
    ALL,1 33,2 in squid.conf and view the entries in /var/log/squid/cache.log tail
    -f /var/log/squid/cache.log. The information in file shows why a certain request
    was allowed or denied.


    More information can be logged with debug_options ALL,1 33,2 28,9. Be sure to
    turn the log level back to ALL,1 later; otherwise, the log files will become very
    large.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Configure Web Browsers to Use Squid


    When you implement Squid to give users secure access to web, they need to configure
    their web browsers to use the proxy server.


    Later in this section you will learn how to set up Squid as an intercepting (sometimes
    called transparent) proxy, which is does not require any configuration changes
    on the client side. However, it is more complex and not the best solution in all
    cases.


    You have two different options to configure the web browsers:


    +   - Configure the Web Browser Manually

    - Configure the Web Browsers Automatically with a PAC Script


    # Configure the Web Browser Manually


    The process for configuring a browser depends on the browser type. The following
    shows how to set up a proxy in Firefox, which is the default web browser for SUSE
    Linux Enterprise Server 10.


    If you want to configure a different web browser, the values that you enter are
    the same, but the dialogs and steps are different.


    Open the proxy configuration in Firefox and select Edit > Preferences. In the
    Preferences dialog, make sure the General tab is selected, then click on Connection
    Settings.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# SUSE Linux Enterprise Server 10: Security


    The following dialog appears:


    # Figure 8-6


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_283_0.png)


    To configure the proxy manually, select Manual Proxy Configuration. You can enter
    the names or IP addresses of the proxy servers for HTTP, HTTPS, and FTP. The Port
    settings must be adjusted according to the proxy configuration.


    > So far only the configuration of Squid as HTTP has been covered. Other protocols
    will be covered later in this section.


    When you leave the settings blank for one protocol, Firefox will not use a proxy
    for this protocol.


    By selecting Use this proxy server for all protocols, Firefox will use the same
    proxy server for all protocols.


