- pgno: 153
  md: '# Objective 3 Create a Certification Authority (CA) and Issue Certificates
    with YaST


    As you learned in the previous objective, openssl is all you need to run your
    own CA. However, due to the numerous parameters and switches, the commands are
    somewhat cumbersome.


    If you are looking for an alternative, you might want to try the YaST CA management
    module. It acts as a frontend to openssl and keeps track of your certificates.


    The basic steps to create a certificate are the same as with the command line
    interface. You have to


    +   - Create a Root CA with YaST

    - Create a Certificate Signed by the CA with YaST


    To revoke a certificate it is necessary to


    +   - Create a CRL with YaST


    # Create a Root CA with YaST


    Creating a Root CA with YaST is easy. First, you launch YaST and select the section
    Security and Users.'
