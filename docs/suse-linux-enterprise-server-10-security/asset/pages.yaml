- pgno: 352
  md: '> Only the traffic between the subnets behind the gateways is encrypted. Traffic
    from gateway to gateway is not!


    # Connect a Single Computer with a Site (End-to-Site)


    This type of configuration is needed to allow users access to the corporate network
    when they are off site. In the openswan documentation, the single computer is
    usually referred to as a road warrior.


    There are three aspects to the configuration:


    +   - Configure /etc/ipsec.conf

    - Copy Certificates and Private Keys

    - Configure /etc/ipsec.secrets


    # Configure /etc/ipsec.conf


    The main difference in the configuration on the gateway side is that there is
    no known IP address for the road warrior. The user uses any available ISP and
    has its IP address dynamically assigned.


    To make connections possible from behind NAT devices, you can activate the NAT
    traversal patch. Basically, NAT and IPSec just don''t fit together: IPSec packets
    become invalid when the IP address in the packet is changed. However, that is
    exactly what NAT does—it changes the packet''s IP address.'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'The solution is to encapsulate the IPSec packets in UDP packets and send those
    packets across the NAT device to the gateway on the other end of the tunnel, where
    they are decapsulated and handed to the ipsec stack. The port used for this purpose
    is usually 4500.


    ```

    # /etc/ipsec.conf on the gateway

    ...

    # basic configuration

    config setup


    # Switch on NAT-Traversal (if patch is installed)

    nat_traversal=yes

    ```


    When there are many road warriors, it is useful to maintain a PKI and to use certificates
    because it greatly simplifies /etc/ipsec.conf. Without certificates, you need
    a separate connection specification for each notebook.


    With certificates, the entry rightrsasigkey=%cert takes care of all of them, providing
    they have a valid certificate. No access is granted for notebooks without certificates
    or with expired or revoked certificates.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# Because the IP address is not known, right gets assigned the value

    %any:


