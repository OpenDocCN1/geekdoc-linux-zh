- pgno: 312
  md: '# Configure an Intercepting Proxy Server


    Every proxy setup discussed so far requires the clients (web browsers) are configured
    to use the proxy server. You can modify your proxy setup so that this is not necessary.
    In this case the proxy is also called an intercepting proxy or a transparent http
    proxy.


    A transparent proxy works in the following way: When a TCP packet with the destination
    port 80 gets to a router, the router redirects the packet to Squid. Squid checks
    whether the requested object is in its cache. If the object is not in the cache,
    Squid fetches the object from the Internet.


    When configuring a transparent proxy, you have to set up a rule in your router
    that redirects HTTP traffic (port 80) to Squid, and you have to modify the Squid
    configuration.


    In /etc/squid/squid.conf, the following tags have to be set:


    ```

    httpd_accel_host virtual

    httpd_accel_port 80

    httpd_accel_wlth_proxy on

    httpd_accel_uses_host_header on

    ```


    The following figure illustrates how to set up a transparent proxy when Squid
    runs on the same server as the Internet gateway:


    Figure 8-8


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_312_0.png)'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# SUSE Linux Enterprise Server 10: Security


    To set up the port redirection on the router, you can use the following iptables
    command (on one line):


    ```

    iptables -t nat -A PREROUTING -p TCP --dport 80 -j REDIRECT --to-port port_of_squid

    ```


    Although a transparent proxy has a lot of advantages, it also has some drawbacks:


    +   - A transparent proxy only works with HTTP.

    - Other protocols like HTTPS, FTP, and GOPHER do not work over a transparent proxy
    because web browsers need to be aware of a proxy server in order to use these
    protocols over a proxy.

    - The connection might not be as stable as compared direct network connection
    or a connection over a proxy that is configured in the clients.


    # Analyze Squid Log Files


    Programs to analyze squid log files can provide you with information on sites
    visited, traffic, and other topics.


    One such is a Perl script called calamaris that analyzes the Squid /var/log/squid/access.log
    file. This script produces a statistical analysis of the requests and requests.
    The analysis can be produced in ASCII or in HTML format. calamaris is available
    on SUSE Linux Enterprise Server 10. The package name is calamaris.


    calamaris has a wide range of options affecting the content of the analysis. Following
    are the most important options:


    | Table 8-2 |

    | Option | Meaning |

    | -a | Performs all available analyses--corresponds to a combination of the most
    important options. For example, not all contacted DNS domains in the list are
    displayed, only the first 20. |


