- pgno: 230
  md: '# SECTION 7 Packet Filters


    The Linux kernel allows filtering of IP packets according to various rules. Packets
    can be accepted, dropped, or otherwise handled depending on various criteria.
    This makes it possible to include Linux computers as components of firewalls.


    # Objectives


    +   1. Understand Packet Filters

    2. Understand iptables Basics

    3. Understand iptables Advanced Features

    4. Understand Network Address Translation'
