- pgno: 398
  md: '# Summary


    # Objective


    # Summary


    +   1. Log Files and Their Evaluation


    Logging to a log host prevents manipulation of log files after an intrusion.


    The information in log files is only useful if someone sees it and acts accordingly.


    Several programs, like logcheck, logsurfer, or custom scripts exist to help find
    relevant log entries.


    +   2. Host-Based Intrusion Detection


    AIDE is designed to find alterations to files or the file system.


    Alterations are detected by comparing the current state of the computer with a
    database created earlier.


    rpm also has some capability to detect alterations of files.


    +   3. Network-Based Intrusion Detection


    Snort is an IDS that detects attacks based on signatures.


    Other programs that can detect unusual activity within the network


    +   - arpwatch


    +   - Argus


    +   - scanlogd


    +   - Honeypots'
  merge: -1
  img_proc: true
- pgno: 399
  md: '| Objective | Summary |

    | --- | --- |

    | 4. Incident Response | When a host has been compromised

    - Stay calm.

    - Decide on your immediate action.

    - Inform others as outlined in the security policy.

    - Investigate and find the vulnerability used to compromise the computer.

    - Reinstall the computer.

    - Fix the vulnerability before connecting to the network again. |'
  merge: -1
