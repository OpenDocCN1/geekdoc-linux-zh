- pgno: 246
  md: '# Objective 3


    # Understand iptables Advanced Features


    The syntax covered in Objective 2 is sufficient to define a simple static packet
    filter. However, the netfilter framework has many more features with further options:


    +   - Matches and Targets

    - User-Defined Chains


    # Matches and Targets


    Matches and targets extend the functionality of iptables.


    The following topics are discussed:


    +   - State Match

    - Multipart Match

    - Limit Match

    - Recent Match

    - Mark Match and MARK Target


    # State Match


    The state match turns the Linux computer into a stateful packet filter. The match
    understands the following parameters:


    +   - **NEW**. This is the first packet of a connection that doesn''t exist so
    far. With TCP it is usually the packet with the syn flag, but this is not necessarily
    so. NEW just refers to the first packet seen by the connection-tracking module.

    - **ESTABLISHED**. This keyword refers to the second and all subsequent packets
    of a connection.

    - **RELATED**. Related connections covered by this parameter be the data connection
    to an FTP connection control or ICMP messages that relate to an existing connection.'
  merge: -1
  img_proc: true
- pgno: 247
  md: "# SUSE Linux Enterprise Server 10: Security\n\n+   - INVALID. This is used\
    \ to describe packets that are not associated with a known connection.\n\nThis\
    \ module not only allows stateful filtering; it also simplifies\\scripts to set\
    \ rules.\n\nFirst, you should define a rather general rule for second and\nsubsequent\
    \ packets belonging to all connections you allow, using\nthe parameter ESTABLISHED.\
    \ Related connections should be\nallowed as well. Then you should define what\
    \ connections are\nallowed by formulating rules for the first packet, using the\n\
    parameter NEW.\n\nThe following example allows ssh traffic coming on eth0 to go\n\
    through the router and on eth1:\n\n```\n# Drop everything that is invalid for\
    \ some reason\niptables -A FORWARD -m state --state INVALID -j DROP\n# Accept\
    \ second and following packets of any connection in FORWARD chain\niptables -A\
    \ FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT\n# Accept the first ssh\
    \ packet -i eth0 -o eth1 that comes in eth0\niptables -A FORWARD -i eth0 -o eth1\
    \ -p tcp --syn --dport 22 \\\n    -m state --state NEW -j ACCEPT\n```\n\nThe state\
    \ match NEW considers every first packet that does\nbelong to an existing connection\
    \ as new, the first packet of, for\ninstance portscan with various flags set or\
    \ no flags set would also\nmatch. To make sure that only the first packet of the\
    \ TCP handshake\nmatches NEW and is accepted, the last line combines --syn and\n\
    state NEW.\n\n# Multiport Match\n\nUsing -p tcp or -p udp, you can define rules\
    \ for single ports (-dport\n22) or port ranges (-dport 1024:65535). However, if\
    \ you have\nsimilar rules for ports 25, 80, and 110, you have to define a separate\n\
    rule for each port.\n\nThe multiport allows you to specify up to 15 ports within\
    \ one\nrule. The option is --ports or --sports (the s at the end).\n\n# CNI USE-ONLY\
    \ HARDCOPY PERMITTED\n\nCopying all or part of this manual, or distributing copies,\
    \ is strictly prohibited.\nto report suspected copying, please call 1-800-PIRATES.\n\
    \n7-18\n\nVersion 1"
  merge: -1
  img_proc: true
- pgno: 248
  md: 'So, instead of writing three rules for 3 ports, you can write just one:


    ```

    iptables -A FORWARD -i eth0 -o ethl -p tcp -m multiport --dports 25,80,110

    -j ACCEPT

    ```


    # Limit Match


    Another useful match is the limit match. Rules that contain that match are taken
    out of the chain when a certain threshold of matching packets is reached.


    The limit match can be used to limit certain traffic or to reduce the number of
    log entries. For example, suppose you have continuous Internet traffic on ports
    135 to 137 hitting your firewall that you usually reject. Logging each of these
    packets would bloat your log files without providing much relevant information.


    You could do the following to limit these entries:


    ```

    iptables -A INPUT --dport 135:137 \

    -m limit --limit 10/hour -j LOG --log-prefix "DROP-TCP "

    iptables -A INPUT -p TCP --dport 135:137 -j REJECT --reject-with tcp-reset

    ```


    This would limit the number of packets logged to a few hours.


    The first iptables command logs a packet. After a certain number of packets, this
    rule no longer matches and packets hit the next rule without creating a log entry.
    After some time with matching packets, the rule is put back in front and produce
    log entries again.


    > See http://www.faqs.org/docs/iptables/matches.html for a detailed explanation
    on how the limit works.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_248_0.png)'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Recent Match


    The recent match can be used to dynamically create a list of IP addresses and
    create rules regarding those IP addresses.


    There are, for instance, automated attacks that try to guess accounts and passwords
    via ssh. Using the recent match, you can temporarily block traffic from the machine
    that originates this attack.


    The information is kept in /proc/net/ipt_recent/DEFAULT, unless you specify a
    different name with the option --name. Specifying a name is useful if you want
    to keep track of different IP addresses in various rules.


    The following is an example for ssh:


    ```

    # Drop 2 hits or more within the last 60 seconds

    iptables -A INPUT -p tcp --dport 22 -i eth0 -m state --state NEW -m recent

    --update --seconds 60 --hitcount 2 -j DROP

    # Add the source address to the list

    iptables -A INPUT -p tcp --dport 22 -i eth0 -m state --state NEW -m recent

    --set

    ```


    For the first ssh connection, the first rule does not match. The second rule creates
    a new entry in the recent list DEFAULT; there is no target defined with -j, the
    packet travels the chain and gets checked by subsequent rules.


    For the second ssh connection the hitcount is one, so the first rule still does
    not match. The second rule updates the entry in the DEFAULT list, and the hitcount
    is 2.


    When the third packet arrives within a minute after the second packet, the first
    rule matches and the packet is dropped.


    A legitimate user who mistyped his password would have to wait 60 seconds to another
    try after two failures.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Mark Match and MARK Target


    In addition to the filter table which is used for the INPUT,

    OUTPUT, and FORWARD chains, there are other tables for special

    pur. Unlike the filter table, which is the default, they are

    spec using the option -t. The table to manipulate packets in\various ways is the
    mangle table.


    The MARK target is used in the mangle table to put an internal

    number within the kernel space on a packet. This number can then

    be used to write rules matching packets with that number.


    This is useful for creating rules for traffic within an IPSec tunnel.

    First, the IPSec packet is marked and, as the decrypted packets

    inherit its mark, rules can be formulated the traffic from\within the tunnel by
    using this mark.


    To view rules in the mangle table, enter iptables -t mangle -n -v,

    and to flush all rules from the mangle table enter iptables -t mangle

    -F


    The MARK target is covered in more detail in Section 9 in "Understand

    Packet Filtering of VPN Traffic" on page 9-22.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_250_0.png)'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# User-Defined Chains


    User-defined chains can reduce the number of rules packets have to go through
    before they hit a match. User-defined chains can also help to make scripts to
    set rules easy to understand and maintain.


    The sequence is as follows:


    +   1. Create a user-defined chain.


    +   2. Create rules within that chain.


    +   3. Create rules within the default chains that have the user-defined chain
    as their target (instead of DROP, REJECT, or ACCEPT).


    The user-defined chain has to exist before it can be used as a target.


    +   4. If no rule matches in the user-defined chain, the packet returns to the
    chain it came from and continues down the rules in that chain.


    The following figure illustrates the path the packet takes:


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_251_0.png)


    You could have a user-defined chain for each protocol or one for certain categories
    of traffic, such as external in, external out, internal in, and internal out.'
  merge: -1
  img_proc: true
- pgno: 252
  md: "The following example defines a chain that takes care of packets that should\
    \ be logged and then dropped. The chain is first created using the option -N;\
    \ rules are added to the chain using the option -A. The new chain can only be\
    \ a target in other rules after it has been created. Therefore, within a script,\
    \ these rules above use that chain as a target.\n\n```\niptables -N log_drop\n\
    iptables -A log_drop -p TCP --syn -j LOG --log-prefix \"DROP-TCP-SYN \" \\\niptables\
    \ -A log_drop -p TCP --syn -m limit --limit 5/s \\ \\\n    -j REJECT --reject-with\
    \ tcp-reset\niptables -A log_drop -p TCP --syn -j DROP\niptables -A log_drop -p\
    \ TCP -j LOG --log-prefix \"DROP-TCP \" \\\niptables -A log_drop -p TCP -m limit\
    \ --limit 5/s \\ \\\n    -j REJECT --reject-with tcp-reset\niptables -A log_drop\
    \ -p UDP -j LOG --log-prefix \"DROP-UDP \" \\\niptables -A log_drop -p UDP -m\
    \ limit --limit 5/s \\ \\\n    -j REJECT --reject-with icmp-proto-unreachable\n\
    iptables -A log_drop -p UDP -j DROP\niptables -A log_drop -p ICMP -j LOG --log-prefix\
    \ \"DROP-ICMP \" \\\niptables -A log_drop -p ICMP -j DROP\niptables -A log_drop\
    \ -p ICMP -j LOG --log-prefix \"DROP-PROTO-ETC \" \\\niptables -A log_drop -p\
    \ ICMP -m limit --limit 5/s \\ \\\n    -j REJECT --reject-with icmp-proto-unreachable\n\
    iptables -A log_drop -j DROP\n```\n\nThe above example rejects packets up to a\
    \ certain rate; if too many packets hit the reject rules, packets are dropped.\
    \ The reasoning behind this is that rejecting RFC-compliant but produces additional\
    \ traffic. So, if the number of packets gets high within a certain time span,\
    \ packets are dropped silently.\n\nDifferent kinds of packets have different prefixes\
    \ to make it easier to see in the log file what was rejected.\n\nBecause the last\
    \ rule above matches any packet, no packet returns to the chain it come from.\
    \ Any packet that gets to the end of the user-defined chain gets dropped."
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Assuming you only want to allow ssh connections to eth0, your rules following
    the above might look like the following:


    ```

    # Incoming traffic, second and subsequent packets

    iptables -A INPUT -i eth0 -m state --state ESTABLISHED,RELATED -j ACCEPT

    # Outgoing traffic, second and subsequent packets

    iptables -A OUTPUT -o eth0 -m state --state ESTABLISHED,RELATED -j ACCEPT

    # ssh incoming on eth0, first packet

    iptables -A INPUT -i eth0 -p TCP --syn --dport 22 -m state --state NEW \

    -j ACCEPT


    # Everything else goes into the user-defined chain log_drop

    iptables -A INPUT -j log_drop

    ```


    To delete a user-defined chain, you first have to delete the rules in the chain
    before you can delete the chain itself.


    ```

    # Flush the user-defined chain log_drop

    iptables -F log_drop

    # Delete the user-defined chain log_drop

    iptables -X log_drop

    ```'
  merge: -1
  img_proc: true
