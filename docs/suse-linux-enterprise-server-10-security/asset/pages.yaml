- pgno: 255
  md: '# Objective 4


    # Understand Network Address Translation


    Network address translation (NAT) is most commonly used to connect computers with
    private IP addresses (like 10.0.0.0/8) to the Internet. It is also used to implement
    transparent (also called or forced) intercepting HTTP proxy servers.


    To understand NAT, you have to understand


    +   - PREROUTING and POSTROUTING Chains


    +   - Types of NAT


    # PREROUTING and POSTROUTING Chains


    In addition to the INPUT, OUTPUT, and FORWARD filter table, three other built-in
    chains are implemented via the nat table.


    As the name implies, packets hit the PREROUTING chain before the routing decision
    is made, and the POSTROUTING chain after any routing decision, just before the
    packets leave the computer through the proper interface. There is also an OUTPUT
    chain available in the nat table.


    To specify rules for these chains, the table nat has to be specified:


    ```

    iptables -A PREROUTING -t nat ...

    ```


    ```

    iptables -A POSTROUTING -t nat ...

    ```'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Types of NAT


    NAT is a general term that embraces the translation of the source

    address, the destination address, or ports.


    The following is described:


    +   - Source NAT

    - Masquerading

    - Destination NAT


    # Source NAT


    Source NAT means that the source address within the IP header of

    t packet is changed. This is used, for instance, to connect

    networks with private IP addresses to the Internet.


    The way this is done is as follows:


    ```

    iptables -t nat -A POSTROUTING -o eth0 -j SNAT --to-source

    110.111.112.113

    ```


    # Masquerading


    Masquerading is a special case of Source NAT. It is used in dial-up

    connections, where the source IP address to be used changes with

    new each dial-in.


    ```

    iptables -t nat -A POSTROUTING -o ds0 -j MASQUERADE

    ```


    Because the packet goes through the POSTROUTING chain just

    before leaving the computer, it can never be used with -i for an input

    device.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Destination NAT


    Destination NAT can be used to change the destination address of packets to that
    of another computer or another port.


    You could change the address to another computer, if, your web server has its
    official IP address that of the gateway, is in fact located in the DMZ with an
    IP from a private network. Destination NAT could be used to change the address
    of any packet addressed to port 80 to the gateway to port 80 of the DMZ.


    ```

    iptables -t nat -A PRERUTING -p tcp -i eth1 --dport 80 \

    -j DNAT --to-destination 172.16.0.1

    ```


    Destination NAT can also be used for intercepting HTTP proxying. If your company
    policy requires the use of a proxy, you could redirect all traffic destined for
    port 80 to the web proxy.


    ```

    iptables -t nat -A PRERUTING -p tcp -i eth0 --dport 80 \

    -j DNAT --to-destination 10.0.0.254:3128

    ```


    In this scenario the destination IP is that of the input interface. You could
    also use the target REDIRECT, which would achieve the same result:


    ```

    iptables -t nat -A PRERUTING -p tcp -i eth0 --dport 80 \

    -j REDIRECT --to-ports 3128

    ```


    For more information on iptables and firewalls, see the following:


    The Netfilter homepage at http://www.netfilter.org/


    A very good iptables-tutorial at http://iptables-tutorial.frozentux.net/iptables-tutorial.html


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_257_0.png)


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
