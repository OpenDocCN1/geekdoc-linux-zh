- pgno: 403
  md: '# Objective 1 Set Up the Application-Level Gateway


    The following tasks and requirements need to be performed on the application-level
    gateway:


    +   - Set up the network configuration according to the network plan (this will
    require a switch or hub to connect to the DMZ and the screening router).

    - Configure Squid to allow the clients in the local network to access the World
    Wide Web using HTTP and HTTPS.

    - Configure a forwarding-only DNS server.

    - Configure a SOCKS server, and configure the clients accordingly.

    - Configure Postfix to accept mail for digitalairlines.com and to forward all
    mail for that domain to the internal mail server running on 172.16.0.250. From
    the internal network, mail is only accepted from the internal mail server and
    relayed to the mail server of the ISP.

    - Write a script to set iptables rules that allow you to access only the above
    services (Squid, SOCKS, mail, DNS) and SSH on the application-level gateway.

    - Test your configuration.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# Objective 2 Set Up the Screening Router


    The following tasks and requirements need to be performed on the screening router:


    +   - Install a minimal installation of SUSE Linux Enterprise Server 10.


    +   - Set up the network configuration according to the network plan (this will
    require a switch or hub to connect to the application-level gateway and the DMZ).


    +   - Write a script that sets iptables rules to allow traffic through the router
    that originates from legitimate servers running on the application-level gateway
    or the DMZ computers.


    +   - The only service on the screening router itself that may be accessible is
    sshd (from the application-level gateway only). Add this to the iptables script.


    +   - Configure sshd to allow only public key authentication, no root login.


    +   - Test your configuration.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# Objective 3 Set Up a Web Server in the DMZ


    The following tasks and requirements need to be performed on the web server:


    +   - Set up the network configuration according to the network plan (this will
    require a switch or hub to connect to the application-level gateway and the screening
    router).

    - Install a web server offering a test page visible from the Internet as well
    as the Intranet.

    - Make this page accessible via SSL as well (coordinate with the other students
    on who creates the certificate).

    - Test your configuration.'
  merge: -1
  img_proc: true
- pgno: 406
  md: '+   - Set up the network configuration according to the network plan.

    The mail server has IP address 172.16.0.250.

    - Install Postfix as the mail server for the domain digitalairirlines.com. It
    receives mail from the application-level gateway for the users, and the users
    use it as their mail server to send mail to others.

    - Install qpopper or cyrus-imap for the users to pick up their mail.

    - After the above works, change the configuration to secure SMTP and POP3/IMAP
    with SSL. This includes setting up a PKI with a RootCA and server certificates
    (coordinate with the other students on who creates the certificate).

    - Add password authentication to Postfix.

    - Modify Postfix so that it only accepts mail from users who have a valid certificate.

    - Test your configuration.'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# Set Up the VPN Gateway


    The following tasks and requirements need to be performed on the VPN gateway:


    +   - Set up the network configuration according to the network plan.

    - Create the necessary certificates for the gateway and a road warrior (or coordinate
    with the other students on who creates the certificates).

    - Set up the VPN gateway so that road warrior notebooks can access the corporate
    LAN no matter what IP address they are assigned from their provider.

    - Set up a script to set iptables rules that allow IPSec connections and traffic
    within the tunnel but no unencrypted traffic on the interface connected to the
    Internet.

    - Test your configuration.'
  merge: -1
