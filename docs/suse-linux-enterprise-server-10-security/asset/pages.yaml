- pgno: 272
  md: "# Fine-Tuning Tags\n\nYou can select the following tags:\n\n+   - request_header_max_size.\
    \ Determines the maximum HTTP header size that Squid accepts from a client. Usually\
    \ HTTP headers are relatively small, so the default is set to 10 KB.\n- request_body_max_size.\
    \ Limits the amount of data that can be sent in the body of an HTTP request. This\
    \ data is usually data that comes from an HTTP file upload. If you don't want\
    \ to limit this size, you can set the value to 0 (no limit). This is also the\
    \ default configuration.\n- quick_abort_min, quick_abort_max, quick_abort_pct.\
    \ Squid can be configured to continue download the requested data, even when a\
    \ data transfer is aborted by a client. The limits of such a transfer being continued\
    \ are set by these variables:\n  - quick_abort_min. (in KB) If less than the given\
    \ value is missing, the transfer is continued. The default value is 16 KB.\n \
    \ - quick_abort_max. (in KB) If more than the given value is missing, the transfer\
    \ is aborted. The default value is 16 KB.\n  - quick_abort_pct. (as a percentage)\
    \ If more than the specified percentage has already been transferred, the transfer\
    \ is continued. The default value is 95 percent.\n- negative_ttl. When Squid tries\
    \ to fetch data for a client request, but it gets a negative response as 404 Not\
    \ Found, this (that there was a negative response) is cached for the amount of\
    \ time specified with this option. You need to specify a value and a time unit\
    \ like seconds, minutes, or hours. The default is 5 minutes.\n- positive_dns_ttl.\
    \ Squid also caches DNS responses. This tag specifies how long successful DNS\
    \ requests are stored. The default value is 6 hours.\n- negative_dns_ttl. This\
    \ option specifies for how long negative (unsuccessful) DNS requests are cached.\
    \ The default value is 1 minute."
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Time-Out Tags


    You can set the following tags:


    +   - connect_timeout. The time after which Squid quits on an attempt to connect
    to a computer without success. The default value is 120 seconds.


    +   - request_timeout. The amount of time Squid waits for an HTTP request after
    the network connection has been established by a client. The default value is
    5 minutes.


    +   - shutdown_lifetime. When the cache receives a SIGTERM or SIGHUP signal, it
    is put in Shutdown Pending mode until all connections have been terminated. Any
    connections remaining active after this time receive a time-out message. The default
    value is 30 seconds.


    # Administrative Tags


    You can set the following tags:


    +   - cache_mgr. Sets the email address of the cache administrator. If Squid breaks
    down, the administrator receives an email. If the cache cannot answer a requested
    URL or if the access permissions are insufficient, a message containing this email
    address is displayed in the client''s browser. The default value is webmaster.


    +   - cache_effective_user, cache_effective_group. If Squid is started by root,
    the effective user ID and group ID are changed to these values. The default values
    on SUSE Linux Enterprise Server 10 are squid and nogroup. If Squid is not started
    by root, the user ID and group ID remain unchanged.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Error Tags


    You can set the following tags:


    +   - err_html_text. Defines text that should be included in error messages presented
    to the clients. You can use HTML to format the text. To make sure that this text
    is displayed, you must include the variable %L in the error files in /usr/share/squid/errors
    where you want this text to appear.

    - error_directory. Directory for error pages. The default value is /usr/share/squid/errors.
    The templates can be found in the respective directories in /usr/share/doc/packages/squid/


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_274_0.png)


    The authoritative Squid documentation is the configuration file /etc/squid/squid.conf.
    Additional documentation can be found at http://wiki.squid-cache.org/. At http://wiki.visolve.com
    you will find documentation for the outdated version 2.4, and for the next major
    release Squid 3.0, which is, at the time of writing (2006), in an early beta stage.


    The Squid version included in SLES 10 is 2.5.


    # Control Access to Squid


    In the simplest possible setup, the Squid proxy can be used to access web sites
    by anyone who can reach the network interface where the proxy is listening. However,
    Squid can also be used to control access to web sites.


    Squid offers very powerful access management, which lets you allow or deny access
    to the proxy as well as control which sites are visited and by whom, based on
    parameters such as


    +   - IP/Network Addresses of Clients or Web Servers

    - Week Day and Time

    - Content Type

    - Transfer Protocol


    CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'The access management of Squid is based on two different tag types in the squid.conf
    file:


    +   - acl (Access Control List). Defines a condition that is matched against the
    incoming HTTP requests.

    - http_access. Determines whether access is allowed or denied when a given acl
    condition matches.


    Let''s assume you have the following lines in your squid.conf file:


    ```

    acl src 0.0.0.0/0.0.0.0

    acl allowed_clients src 10.0.0.0/0


    http_access allow allowed_clients

    http_access deny all

    ```


    Two acls are defined. Each acl line consists of the following components:


    # acl acl_name acl_type acl_string [acl_string ...]


    +   - acl_name. Works as an identifier when the condition is later used in an
    http_access statement. You can choose any name, but it cannot use spaces or special
    characters.

    - acl_type. One of the acl types that Squid supports. The type src in example
    refers to the IP or network address of the client that makes a request to Squid.

    - acl_string. Defines the condition that is matched against the requests. If more
    than one string is given, the ACL matches one of the string matches (OR). (Note:
    Not all ACL types can have more than one string.)


    Instead of one or several strings, a filename can be given. Instead of listing
    the strings in one line in /etc/squid/squid.conf, the file would list the strings
    line by line:


    acl offlimits dstdomain "etc/squid/forbidden-sites.list"


    In the example, the two acl lines have the following meaning:


    ```

    acl all src 0.0.0.0/0.0.0.0

    ```


    CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'This acl line matches the IP address of the requesting client. The acl string
    0.0.0.0/0.0.0.0 matches any IP address.


    ```

    acl allowed_clients src 10.0.0.0/24

    ```


    This acl line with the name allowed_clients matches all requests coming from the
    network with the network address 10.0.0.0/24.


    The last two lines of our example are http_access tags. They have the following
    basic structure:


    # http_access allow/deny acl_name


    Following the http_access tag, you have either an allow or deny statement, depending
    on what you want to do with the line. After the allow/deny statement, the acl
    name which should be used to allow or deny access to the proxy is listed. If two
    acl names are given, the line matches when acl_name entries match (AND).


    In the example, this means the following:


    +   Two acl lines are defined, one that matches every request and one that only
    matches requests from the 10.0.0.0/24 network.


    +   The first http_access line allows access to the proxy for every request that
    matches the allowed_clients acl. This means it allows every request from the 10.0.0.0/24
    network.


    +   The second http_access line denies access to every request that matches the
    all acl. This means that access is denied to every request.


    The http_access lines are processed from top to bottom. Once a line and its acl
    matches, the given access rule (allow or deny) is applied and any subsequent http_access
    tags are not taken into consideration.


    Assume that a client from the 10.0.0.0/24 network tries to access the proxy server
    in the example. The first http_access line matches and is allowed; the second
    http_access line is not processed at all.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'When someone outside the 10.0.0.0/24 network tries to access the proxy, the
    first http_access line does not match and the second line is processed. This line
    denies access to every request with the result that this request is not allowed.


    As you can see, access control management in Squid is based on two tasks:


    +   - Define acl Tags

    - Define http_access Tags


    # Define acl Tags


    The acl has many different acl_types that can be used to control access.


    The following lists the most important acl_types:


    | ACL Type | Description |

    | --- | --- |

    | src (source) | This type will match the client''s IP or network address. <br>Usage:
    acl_name src ip-address/network_mask<br>Example: acl internal_net src 10.0.0.0/24<br>For
    a single IP address, you have to choose network mask /32. You can also specify
    a range of IP addresses, such as 172.16.1.25–172.16.1.35/32 |

    | dst (destination) | This tag is similar to the src tag, but it matches the IP
    or network address of the destination web server. <br>Usage: acl_name dst ip-address/network_mask<br>Example:
    acl novelli dst 130.57.4.27/32 |'
  merge: -1
  img_proc: true
- pgno: 278
  md: '| Table 8-1 | ACL Type | Description |

    |---|---|---|

    | | srcdomain (source domain) | Instead of src, you can use srcdomain to specify
    the matching request by a domain name.

    Usage: acl_name srcdomain domain

    Example: da srcdomain .digitalairirlines.com

    You need to specify the leading period in the domain name, and name resolution
    need to be set up for the Squid system. |

    | | dstdomain (destination domain) | This tag is like srcdomain but matches the
    domain of the target web server.

    Usage: acl_name dstdomain domain

    Example: acl novell dstdomain .novell |

    | | time | This tag matches the date and time when a request happens.

    Usage: acl_name time w_day start_time_end_time

    Example: acl monday time M 10:00-14:00

    The week days can be specified as follows:

    * S-Sunday

    * M-Monday

    * T-Tuesday

    * W-Wednesday

    * H-Thursday

    * F-Friday

    * A-Saturday

    The start time must always be less than the end time. If you want to specify a
    period that goes over the end of the day, you have to create two acls. |'
  merge: -1
