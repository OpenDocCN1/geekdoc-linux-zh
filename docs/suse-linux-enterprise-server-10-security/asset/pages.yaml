- pgno: 226
  md: '# Objective 3 Understand Advantages and Disadvantages of Different Setups


    The solution you deploy has to meet your security needs, provide the desired functionality,
    and stay within your budget. The various technologies described have advantages
    and disadvantages that make them more or less suitable for certain tasks.


    This objective considers advantages and disadvantages of the following:


    +   - Packet Filters

    - Application-Level Gateways


    And, finally, a word of Caution


    # Packet Filters


    Packet filters


    +   - Allow control of the traffic based on IP address, ports, protocol, TCP flags,
    and state of the connection.

    - Do not require modifications of clients or cooperation on the part of the user.

    - Do not put a heavy burden on the network in terms of speed and bandwidth.

    - Have limited ways of monitoring the content of the connection.

    - Have no way to control the traffic based on the user.

    - Cannot effectively control some protocols, such as UDP (with static filters),
    or RPC-based protocols.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Application-Level Gateways


    Application-level gateways


    +   - Allow detailed monitoring and control of the traffic.

    - Do not require routing to be enabled.

    - Often need modified clients (e.g., web browser configuration).

    - Have dedicated proxy servers for only a few protocols.

    - Depending on your bandwidth needs, might need powerful hardware.


    # Caution


    It cannot be overstated that a firewall is just a component of an overall concept.


    The classical concept—Internet bad and evil versus Intranet good and nice—is no
    longer valid (if it ever was). What used to be the rogue modems in the past are
    now wireless cards that allow access to notebooks when they are plugged into the
    corporate LAN.


    Notebooks can become infected while accessing the Internet in a hotel or at home.
    Infected notebooks access corporate resources via VPN, allowing someone who uses
    a backdoor installed on the notebook to access corporate resources.


    But not only notebooks are to blame. Local workstations can get infected via email
    or by just visiting a site that installs malware without user interaction by exploiting
    a browser vulnerability.


    And there are other classes of attacks that are not even covered in this course,
    like SQL injection. These attacks use legitimate paths through the firewall, like
    access to the web server, but target other areas, for the database behind the
    web server.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'Errors in the programming of the web frontend could lead to unauthorized database
    access if, for instance, the input in HTML forms is not processed correctly.


    A firewall is not a panacea that cures all. You have to know its uses and its
    limitations.'
  merge: -1
  img_proc: true
