- pgno: 320
  md: "+   - Client-rules. Determine if a client is allowed to connect to the server\
    \ at all. This is done on basis of the IP address (range) or network address of\
    \ the client.\n\nAll client-rules in the configuration file are prefixed with\
    \ client. The client-rules are checked before the socks-rules.\n\n+   - Socks-rules.\
    \ These rules determine what a client is allowed to do after it has connected\
    \ to the server.\n\nSocks-rules do not have a prefix.\n\nThe following is a simple\
    \ example configuration file without user authentication:\n\n```\n###Server Configuration\n\
    logout: /var/log/sockd.log\ninternal: 10.0.0.1 port = 1080\nexternal: 137.65.81.40\n\
    method: none\nclientmethod: none\nuser.privileged: root\nuser.notprivileged: nobody\n\
    \n#Client Rules\nclient pass {\n  from: 10.0.0.0/24 port 1-65535 to: 0.0.0.0\n\
    \  log: connect error\n}\n\n#Socks Rules\npass {\n  from: 0.0.0.0/0 to: 0.0.0.0\n\
    \  protocol: tcp udp\n}\n\nblock {\n  from: 0.0.0.0/0 to: 0.0.0.0\n  log: connect\
    \ error\n}\n```\n\nThe beginning of the file contains the general server configuration\
    \ as described before. Then the client-rules and the socks-rules are defined.\n\
    \n# CNI USE ONLY-1 HARDCOPY PERMITTED"
  merge: -1
  img_proc: true
- pgno: 321
  md: 'The client-rules are processed first and then the socks-rules. A request has
    to pass one client-rule *and* one socks-rule to use the server.


    Each rule starts with either **pass** or **block**, depending on whether the rules
    allow or deny access to the server. The client-rules have the additional keyword
    client before pass or block.


    The rule itself is defined in parentheses {}. Each rule uses the keywords to and
    from to match the IP addresses of a request. The IP address 0.0.0.0/0 matches
    any address.


    There are other keywords that can be used in the rules. The keywords can be either
    conditions that are used to match different parameters of a request or actions
    that are performed if the related keyword matches.


    The following are valid conditions:


    +   * from

    * to

    * command

    * method

    * protocol

    * proxyprotocol

    * user


    The following are valid actions:


    +   * bandwidth

    * libwrap

    * log

    * redirect


    Some of the keywords can be used for client-rules and socks-rules; others can
    only be used for one rule type.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'The following is an overview of keywords and their meaning they are used in
    client-rules. (This information is taken from the sockd.conf man page.)


    # Table 8-4 Meaning and Possible Values


    | Keyword | Meaning |

    | --- | --- |

    | from | The rule applies to requests coming from the address given as the value.
    |

    | to | The rule applies to the IP address of the SOCKS server that receives a
    request. |

    | port | Parameter to from, to, and via. Accepts the keywords eq/=; neq/=; ge/=;
    le/=; gt/; lt/ followed by a number. A port range can also be given as "port <start
    #>- <end #>" which will match all ports within the range <start #> and <end #>.
    |

    | libwrap | The server will pass the line to libwrap for execution. |

    | log | Controls logging. Accepted keywords are connect, disconnect, data, error,
    and ioperation. |

    | user | The server will only accept connections users matching one of the names
    given as the value. If no user value is given, everyone in the password file will
    be matched. The rule also allow user name-based methods. |

    | method | Requires that the connection is authenticated using one of the given
    methods. |

    | pam.servicename | Specifies which service name to use when involving PAM user
    authentication. The default is sockd. This only applies when you use PAM as the
    authentication method. |'
  merge: -1
  img_proc: true
