- pgno: 290
  md: '# Understand How Squid Handles SSL Connections


    Secure Sockets Layer (SSL) is a technology that is used to encrypt data that is
    transferred over HTTP. Because of the design of SSL, encrypted HTTP requests cannot
    be handled like cleartext HTTP requests.


    Understanding how Squid handles SSL connections includes the following:


    +   - The CONNECT Method

    - The SSL Configuration Tags

    - Use Squid to Tunnel Connections


    # The CONNECT Method


    The following explains the process of SSL encryption between a browser and a web
    server:


    +   1. The browser recognizes a web address starting with https://. This means
    that the connection to this server should be encrypted. The default port for SSL
    connections is 443 instead of port 80 (used for normal unencrypted HTTP connections).

    2. The web browser asks the server for its RSA key.

    3. The web server sends the public key to the web browser.

    4. The web browser verifies the key of the server with the public key of the CA
    that signed the key.

    5. If the key is valid, the web browser and web server establish a secure connection.


    One important to understand about SSL is that it always needs a direct connection
    between the web browser and the target web server. Therefore, SSL-encrypted HTTP
    requests cannot be handled by proxy servers in the same way as unencrypted HTTP
    requests.'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'The CONNECT method is a way to tunnel SSL-encrypted HTTP requests through a
    proxy server. The term *tunneling* means that the proxy server simply passes the
    encrypted data from the browser to the web server and back. Due to the encryption
    the transferred files can neither be inspected nor cached.


    The following illustrates SSL tunneling:


    # Figure 8-7


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_291_0.png)


    For SSL connections to go via the proxy, the SSL proxy settings of the web browser
    need to be adjusted to the right proxy server and port. If there is no SSL proxy
    specified, the browser will try to connect directly to the target web server without
    using proxy.


    Although encrypted data cannot be cached or inspected, you still have benefits
    when you use a proxy for SSL connections. You can limit access to the web based
    on IP address and time, and you can use proxy authentication to authenticate users
    using the web. (Proxy authentication is described later in this section.)


    > The CONNECT method can be used to tunnel any protocol through Squid. Someone
    could use SSH to connect to a system outside the internal network. If this is
    not acceptable, you have to disable the CONNECT method in squid.conf; however,
    this will also block all SSL connections to the outside.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# The SSL Configuration Tags


    SSL tunneling is configured with acl and http_access tags in the Squid configuration
    file. The following are the tags and their description as they appear in the default
    configuration shipped with SUSE Linux Enterprise Server 10.


    ```

    acl SSL_ports port 443 563

    ```


    This line defines an acl entry named SSL_ports which holds the port numbers 443
    and 563.


    ```

    acl CONNECT method CONNECT

    ```


    This line defines an acl entry named CONNECT with the value CONNECT. CONNECT is
    the method used for SSL tunnels.


    ```

    http_access deny CONNECT !SSL_ports

    ```


    This http_access line denies requests for the CONNECT method on ports other than
    the ones defined in SSL_ports (443, 563).


    When you look through the default configuration, you will see some tags that deal
    with SSL (such as https_port or ssl_uncleanan_shutdown). These tags are used when
    Squid is configured as an HTTP accelerator and the requests from the clients to
    the accelerator will be encrypted. In this case Squid does the encryption work
    for the actual web server.


    > Because the HTTP_accelerator role of Squid is not covered in this section, these
    tags are not covered in detail.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_292_0.png)'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Use Squid to Tunnel Connections


    While the CONNECT method is usually used to connect to web servers using HTTPS,
    it can be used to tunnel other protocols through Squid as. What is needed is a
    program that adds the connect request to the protocol. There are various solutions
    for this.


    One is the package transconnect

    http://transconnect.sourceforge.net/) that comes with the SUSE Linux distributions.
    An RPM package that can be installed on SUSE Linux Enterprise Server 10 can be
    found at http://download.opensense.org/distribution/SL-10.1/inst-source/i586/transconnect-1.2-274.i586.rpm.


    Another is the Perl script https-tunnel by Mark Suter, which can be found under
    http://zwitterion.org/software/ssh-https-tunnel/


    Both are found on the Student DVD.


    After installing transconnect with rpm, all you have to do is copy the configuration
    template


    ```

    geeko@da10->: mkdir .tconn

    geeko@da10->: cp /usr/share/doc/packages/transconnect/tconn.conf \

    /.tconn/tconn.conf

    ```


    Then edit it to change your network parameters. The comments in the file explain
    what you need to change.


    When you start the application whose traffic you want to tunnel, preload the tconn
    library:


    ```

    geeko@da10->: LD_PRELOAD=/usr/lib/tconn.so ssh athome.example.com

    ```


    This does not work in the default configuration of Squid, because port 22 is not
    considered safe and therefore blocked.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'If you cannot or do not want to change the Squid configuration, have to change
    the configuration of sshd on the computer you want to connect. Have sshd also
    listen on port 443. If HTTPS is not restricted on the proxy in question, you can
    ssh out of the network behind the proxy.


    With the Port Forwarding feature of SSH, you can connect to your web site, or
    any other service that uses single connections:


    ```

    geeko@da10:~ > LD_PRELOAD=/usr/lib/tconn.so ssh -p 443 \

    -L 8080:blocked-site.example.com:80 athome.example.com

    ```


    As a security administrator you should be aware that closing port 22 or disabling
    routing does not prevent connections to the outside via SSH if Squid is running
    and allowing the connect method to certain ports. Users using this technique should
    be aware that you are most likely violating some security policy.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_294_0.png)


    To prevent serious trouble, get permission before you tunnel connections that
    way.'
  merge: -1
  img_proc: true
