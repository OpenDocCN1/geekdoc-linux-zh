- pgno: 305
  md: '# Configure URL Filtering


    One of the advantages of an application-level gateway is that access

    can be granted not only on the basis of network parameters (IP and

    network address) or user authentication, but also on

    protocol-specific parameters.


    In the case of Squid this means that you can control the access to

    web sites based on the URL of a site. This feature is also called

    URL_filtering or blocking.


    Basically you can configure two different types of URL filtering:


    +   - Configure URL Filtering with url_regex

    - Configure URL Filtering with squidGuard


    # Configure URL Filtering with url_regex


    A commonly used method to filter out unwanted content is to block

    URLs which contain certain patterns. Squid offers two acl types that

    can be used for this purpose:


    +   - url_regex. This acl matches the whole URL, including the

    protocol and the hostname.

    - urpath_regex. This acl matches only the path of a URL

    without the protocol or the hostname.


    The following example defines an acl that matches all URLs

    containing example.com:


    ```

    acl blocked_url_regex example.com

    [...

    http_access deny blocked

    ```


    First, you create a url_regex with the name blocked that matches

    all URLs containing example.com; then you deny access to such

    URLs with an http_access line.'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'By adding the -i option after the url_regex statement, you can make

    ac acl insensitive:


    ```

    acl blocked url_regex -i example.com

    ```


    Now the acl matches all URLs that contain example.com, no matter

    if they are uppercase or lowercase.


    In most cases you want to block more than just a single URL.

    Instead of creating an acl for every URL, you can also list all URL

    patterns in a file and use the path to the file as a parameter in your

    ac statement.


    The following acl reads the patterns from the file

    /etc/squid/black_list:


    ```

    acl blocked url_regex -i "/etc/squid/black_list"

    ```


    The filename and paths are just examples and can be changed.


    Such a file with patterns is usually called blacklist. However,

    url_regex acl can also be used to allow access to URLs that match

    given pattern, which is called whitelist.


    The format of the file is very simple. You just list all patterns in the

    file, one pattern per line.


    The following is an example listing three patterns:


    ```

    example.com

    example2.com

    example3.com

    ```


    You can also download preconfigured blacklists. This way you can

    block many sites that are not appropriate for being viewed in a work

    environment.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'SUSE Linux Enterprise Server 10: Security


    The following are two resources where you can download blacklists:


    +   - http://www.squid-cache.org/Doc/FAQ/FAQ-10.html several URLs that provide
    blacklists.

    - http://www.squidguard.org/blacklist/


    Please be aware that the best blacklist will not contain all pages that might
    need to be blocked. Furthermore, long blacklists can decrease the performance
    of Squid. You should always test a blacklist before you use it in a production
    environment.


    # Configure URL Filtering with squidGuard


    Besides the built-in url_regex acl type, you can also use an external filter plug-ins
    for Squid.


    One of these filter plug-ins is **squidGuard**. SquidGuard is part of SUSE Linux
    Enterprise Server 10. To use it, you need to install the package **squidGuard**
    in addition to Squid.


    squidGuard is implemented as a URL redirector. Squid passes every requested URL
    to the configured redirect program. Then the redirect program processes the URL
    and returns either a different URL or a blank line, which means that the URL does
    not need to be changed.


    If the returned URL is different, Squid will fetch this URL instead of the original.
    Instead of a different URL, the redirect program might also return an error code,
    which indicates that the URL should not be accessed.


    The URL redirector is configured in the redirect_program tag of **squid.conf**.


    ```

    redirect_program /usr/sbin/squidGuard

    ```


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.


    8-48


    Version 1'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'squidGuard uses the redirect method to filter out URLs which should not be
    accessed.


    squidGuard''s configuration file is located in /etc/squidguard.conf. At the beginning
    of the configuration file, two paths are configured:


    ```

    logdir /var/log/squidGuard

    dbhome /var/lib/squidGuard/db

    ```


    The first entry configures the directory where squidGuard stores its log files.
    The second entry sets the directory where the pattern databases are stored.


    squidGuard uses these databases to determine whether a request is allowed. The
    concept of the SquidGuard configuration file is similar to the Squid configuration
    file. First, you need to define conditions which are matched against a URL. Then
    these conditions are used to grant or deny a request.


    Besides URL matching, squidGuard can also handle conditions based on the source
    IP address, time of day, or the user accessing through the proxy. The following
    is an overview of the keywords used to define conditions in squidguard.conf:


    +   - time. Defines conditions which match the time of a request.

    - src. Defines conditions which match the src of a request.

    - dest. Defines conditions which match the destination of a request.


    However, as these conditions can be sufficiently handled by Squid'' internal mechanisms,
    we will concentrate on the URL-matching functionality of squidGuard.


    The following example defines a condition that matches destination URLs:


    ```

    dest blacklist {

    domainlist blacklist/domains

    urllist blacklist/urls

    }

    ```


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 309
