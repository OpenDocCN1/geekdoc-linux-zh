- pgno: 373
  md: '# Evaluate Log Files and Run Checks


    Depending on the activity on the computer, log files can grow by several MB each
    day. The problem you are faced with is how to find any suspicious entries within
    this huge amount of data. Without specific tools, it becomes very difficult to
    find out unusual activity or security violations.


    There are several tools that help to extract relevant entries from log files and
    other sources. There are tools to


    +   - Extract Information from Log Files

    - Run Security Checks


    You can also write scripts of your own that alert you when certain entries appear
    in a log file.


    # Extract Information from Log Files


    The following introduces two tools used to extract relevant information from log
    files:


    +   - logcheck

    - logsurfer


    # logcheck


    logcheck parses system logs and generates email reports based on anomalies.


    In the beginning, logcheck produces long reports. You have to modify the configuration
    of logcheck so that entries that are harmless not turn up in the report anymore.
    After that initial phase, the reports mailed by logcheck should contain only relevant
    information on security violations and unusual activities.


    logcheck should be called regularly via cron to parse log files. Because logcheck
    remembers the point up to which a log file was scanned previously, only the new
    section is scanned on the next call.'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'Logcheck is not included with SUSE Linux Enterprise Server 10. You can get
    it at http://logcheck.org/.


    # logsurfer


    The disadvantage of parsing log files line by line is that each line is independent
    of all other lines. However, you might want additional information when a certain
    entry is found in the log file.


    logsurfer offers this functionality with contexts: Several lines matching a pattern
    can be stored in memory as a context. Depending on further patterns in the log
    file, a context could be mailed to you for your inspection, or some other action,
    such as starting a program, could be triggered. The context could be deleted again
    if this pattern is not found within a certain time or number of lines. It is also
    possible to dynamically create or delete matching rules, depending on entries
    in the log file.


    Because logsurfer can be configured in great detail, the configuration is not
    trivial. However, the advantage is that you can configure precisely what should
    happen under what circumstances.


    Logsurfer is not included with SUSE Linux Enterprise Server 10. It can be found
    under http://www.cert.dfn/eng/logsurfer/


    # Run Security Checks


    In addition to checking configuration files, you can run other checks to find
    out about system configurations that could constitute a security danger. Automated
    checks usually consist of scripts that are called in regular intervals and inform
    you, for instance, by email, of what was found.


    While such scripts can also detect a system compromise under certain circumstances,
    you should be aware that a successful intruder can modify such scripts to avoid
    detection.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'The following are described:


    +   * seccheck

    * Custom Scripts

    * Monitor Login Activity from the Command Line


    # seccheck


    The package seccheck offers a series of scripts that check the computer regularly
    (daily, weekly, and monthly) and send reports to you. Items checked by the scripts
    are


    +   * Kernel modules loaded

    * SUID files

    * SGID files

    * Bound sockets

    * Users with accounts who never logged in

    * Weak passwords


    An email is sent to root detailing what was found.


    # Custom Scripts


    There is no limit to what you can check or have sent to you using shell or Perl
    scripts.


    Some possibilities are


    +   * Output of last

    * Output of df

    * Output of netstat

    * Output of ps

    * /etc/passwd to check if an account other than root has UID 0'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# Monitor Login Activity from the Command Line


    Monitoring tasks include evaluating login activity for signs of a security breach,
    such as multiple failed logins.


    To monitor login activity, you can use the following commands:


    +   - **who.** This command shows who is currently logged in to the system and
    information such as the time of the last login.


    You can use options as **-H** (display column headings), **-r** (current runlevel),
    and **-a** (display information provided by most options).


    For example, entering who -H returns information similar to the following:


    ```

    ```

    dalo10: # who -H

    NAME      LINE  TIME           Command

    root      Aug 23 05:41  (console)

    geeko     pts/2 Aug 24 02:32  (10.0.0.50)

    dalo10:~ ~ #

    ```

    ```


    +   - **w.** This command displays information about the users currently on the
    computer and the processes they are running.


    The first line includes information such as the current time, how long the system
    has been running, how many users are currently logged on, and the system load
    averages for the past 1, 5, and 15 minutes.


    Below the first line is an entry for each user that displays the login name, the
    tty name, the remote host, login time, idle time, JCPU, PCPU, and the command
    line of the user''s process.


    The JCPU time is the time used by all processes attached to the tty. It does not
    include past background jobs but does include currently running background jobs.


    The PCPU time, specified in the What field, is the time used by the current process.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# SUSE Linux Enterprise Server 10: Security


    You can use options such as **-h** (don''t display the header), **-s** (don''t
    display the login time, JCPU, and PCPU), and **-V** (display version information).


    For example, entering w returns information similar to the following:


    ```

    dal10:- # w               IDLE  JCPU PCPU  WHAT

    USER      TTY     LOGIN#

    root      0       ?xdm   1:48  0.02s -0

    geeko     pts/2   02:32  0.00s 0.10s 0.02s ssh: geeko [priv

    dal10:- #

    ```


    You could also use w within scripts.


    +   **finger**. This command displays information about local and remote users.
    By default, the following information is displayed about each user currently logged
    in to the local host:


    +   - Login name

    - User''s full name

    - Associated terminal name

    - Idle time

    - Login time and location


    You can use options such as **-l** (long format) and **-s** (short format).


    For example, entering finger -s returns information similar to the following:


    ```

    dal10:- # finger -s

    Login     Name            Tty      Idle    Login Time      Where

    geeko     The SUSE Chameleon pts/2             Tue 02:32  10.0.0.50

    root      root                    54d     Mon 05:41 console

    dal10:- #

    ```


    +   **last**. This command displays a list of the logged-in users.

    Last searches through the file /var/log/wtmp (or the file designated by the option
    -f) and displays a list of all users logged in (and out) since the file was created.


    # CNI USE ONLY-1 HARDCOPY PERMITTED


