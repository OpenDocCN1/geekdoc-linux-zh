- pgno: 361
  md: '# Understand Packet Filtering of VPN Traffic


    Kernel 2.4.x creates an additional interface (ipsec0, ipsec1, etc.) when IPSec
    is started. All traffic to and from the tunnel is going through that interface.
    It can be addressed within iptables commands with the options -o and -i, just
    as any other interface.


    The interface eth0 (eth1, etc.) is used in iptables commands to control the traffic
    on the physical interface. To control the traffic within the tunnel, you use the
    interface ipsec0 (ipsec1, etc.).


    Kernel 2.6.x does not create an interface ipsec0. means that it is not possible
    to distinguish traffic to and from the tunnel simply based on the interface it
    is coming from or destined to. A different approach is needed to specifically
    address the traffic within the tunnel with iptables commands.


    To filter traffic within the IPSec tunnel, you have to consider the following:


    +   - Filter the IPSec Packets

    - Connections Initiated from Road Warriors to Hosts Behind the Gateway

    - Connections Initiated from Hosts Behind the Gateway to Road Warriors


    # Filter the IPSec Packet


    An IPSec connection consists of the following types of packets:


    +   - UDP port 500 for key management

    - Protocol 50 (ESP) for encryption

    - UDP port 4500 if NAT traversal is used'
  merge: -1
  img_proc: true
- pgno: 362
  md: "# The packet filter has to allow these packets; otherwise, no IPSec connection\
    \ can be established.\n\n```\n# Protocol 50, ESP\niptables -A INPUT -i $EXT_IF\
    \ -p 50 -m state --state NEW -j ACCEPT\n# Key management, UDP port 500\niptables\
    \ -A INPUT -i $EXT_IF -p UDP -m state --state NEW \\\n  --port 500 --sport 500\
    \ -j ACCEPT\n# plus in case of NAT-Traversal:\niptables -A INPUT -i $EXT_IF -p\
    \ UDP -m state --state NEW\n  --port 4500 --sport 4500 -j ACCEPT\n```\n\nThe above\
    \ rules allow new incoming connections.\n\nIf the computer initiates IPSec connections\
    \ to other computers, as in the case of a road warrior, these rules need to appear\
    \ in the OUTPUT chain:\n\n```\n# Protocol 50, ESP\niptables -A OUTPUT -o $EXT_IF\
    \ -p 50 -m state --state NEW -j ACCEPT\n# Key management, UDP port 500\niptables\
    \ -A OUTPUT -o $EXT_IF -p UDP -m state --state NEW \\\n  --port 500 --sport 500\
    \ -j ACCEPT\n# plus in case of NAT-Traversal:\niptables -A OUTPUT -o $EXT_IF -p\
    \ UDP -m state --state NEW\n  --port 4500 --sport 4500 -j ACCEPT\n```\n\nIf the\
    \ computer initiates, as well as receives, new connections, you need rules for\
    \ both INPUT and for the OUTPUT chain,\n\nSubsequent packets and answer packets\
    \ have to be allowed, too:\n\n```\niptables -A OUTPUT -m state --state ESTABLISHED,\
    \ RELATED -j ACCEPT\niptables -A INPUT -m state --state ESTABLISHED, RELATED -j\
    \ ACCEPT\n```\n\nThese packets are destined for the computer itself, these rules\
    \ are defined in the INPUT and OUTPUT chains, not in the FORWARD chain.\n\n# CNI\
    \ USE ONLY-1 HARDCOPY PERMITTED"
  merge: -1
  img_proc: true
- pgno: 363
  md: "SUSE Linux Enterprise Serve 10: Security\n\n# Connections Initiated from Road\
    \ Warriors to Hosts\nBehind the Gateway\n\nIt is simple to control this kind of\
    \ traffic on the gateway using the\nconnection-tracking capabilities of the netfilter\
    \ framework and the\nmangle table.\n\nESP packets arriving at the gateway are\
    \ part of the traffic from road\nwarriors. Traffic control within the tunnel can\
    \ be achieved by\nfollows:\n\n+   1. ESP packets from the outside are marked with\
    \ an arbitrary\nnumber using the mangle table. This number does not change the\n\
    packet; it exists only within the kernel space.\n\n+   2. When the ESP packet\
    \ is decrypted and the original packet\nrestored, it inherits the mark that was\
    \ put on the ESP packet.\n\nUsing this mark, cleartext packets from the tunnel\
    \ can be\ndistinguished from cleartext packets that came in from\nother computers\
    \ outside the tunnel.\n\nRules can be set up for the marked packets independently\
    \ from\nrules for packets without this mark.\n\n+   3. Packets coming from the\
    \ other direction that are part of\nconnections from road warriors through the\
    \ tunnel are handled\nby the connection-tracking module.\n\nThe iptables rules\
    \ that achieve the above could look like the\nfollowing:\n\n```\n# Mark ESP packets\n\
    iptables -t mangle -A PREROUTING -p 50 -j MARK --set-mark 10\n# Accept ESP packets\n\
    iptables -A INPUT -p 50 -j ACCEPT\n# Define rule based on the mark\niptables -A\
    \ FORWARD -o $INT_IF -p TCP --dport 80 -m mark --mark \\\n    -j ACCEPT\n# Take\
    \ care of the traffic in the other direction\niptables -A FORWARD -i $INT_IF -m\
    \ state --state ESTABLISHED, RELATED \\\n    -j ACCEPT\n```\n\n# CNI USE ONLY-1\
    \ HARDCOPY PERMITTED\n\nCopying all or part of this manual, or distributing such\
    \ copies, is strictly prohibited.\nto report suspected copying, please call 1-800-PIRATES.\n\
    \n9-24\n\nVersion 1"
  merge: -1
  img_proc: true
- pgno: 364
  md: "The rules for the traffic within the tunnel will usually be specified in the\
    \ FORWARD chain.\n\nAn exception packets that are destined to the gateway itself—for\
    \ instance, when two computers are connected without a network behind them on\
    \ either side.\n\n# Connections Initiated from Hosts Behind the Gateway to Road\
    \ Warriors\n\nIf the road warrior had a static IP address, connections would not\
    \ pose any problem. Rules could be defined based on the IP address of the road\
    \ warrior.\n\nRoad warriors, like any host in the Internet, however, can have\
    \ any IP address.\n\nIt is therefore not possible to implement rules on the gateway\
    \ to refer to traffic destined for the tunnel based on the destination IP address\
    \ of the packet.\n\nThe output interface is not suitable as distinguishing criterion\
    \ either, because encrypted as well as unencrypted packets leave the computer\
    \ via eth0 (or eth1, etc.).\n\nThe policy match allows you to filter traffic according\
    \ to certain markers by the ipsec stack of the kernel. This works as well for\
    \ connections started by the road warrior as for connections addressed to the\
    \ road warrior.\n\nThe following rules achieve the same as the rules above using\
    \ a mark: The road warrior is allowed to connect to web servers within the network\
    \ behind the gateway.\n\n```\n# Accept ESP packets\niptables -A INPUT -p 50 -j\
    \ ACCEPT\n# Define a rule using the policy match\niptables -A FORWARD -i $EXT_IF\
    \ -m policy --dir in --pol ipsec \\\n  --mode tunnel --proto esp -p tcp --dport\
    \ 80 -j ACCEPT\n```\n\n# CNI USE ONLY-HARDCOPY PERMITTED"
  merge: -1
  img_proc: true
- pgno: 365
  md: "The advantage of the approach using the policy match becomes apparent when\
    \ you want to regulate traffic from the internal network or the gateway to the\
    \ road warriors.\n\nThe following rule allows you to use ssh from the network\
    \ behind the road warriors. This rule does not affect the traffic from the network\
    \ behind the gateway to hosts that are not part of the VPN.\n\n```\n# Accept ESP\
    \ packets\niptables -A OUTPUT -p 50 -j ACCEPT\nDefine a rule using the policy\
    \ match\niptables -A FORWARD -o $EXT_IF -m policy --dir out --pol ipsec \\\n \
    \ --mode tunnel --proto esp -p tcp --dport 22 -j ACCEPT\n```\n\nDocumentation\
    \ on the policy match is rather scarce. You can get a few hints using\n\n# iptables\
    \ -m policy -h\n\n```\nda10~ # iptables -m policy --help\n...\npolicy v1.3.5 options:\n\
    \  --dir out             match policy applied during decapsulation/\n        \
    \              policy to be applied during encapsulation\n  --pol none|ipsec \
    \     match policy\n  --strict              match entire policy instead of\nelement\
    \               at any position\n! --reqid reqid      match reqid\n! --spi spi\
    \           match SPI\n! --proto proto       match protocol (ah/esp/ipcomp)\n\
    ! --mode mode         match mode (transport/tunnel)\n! --tunnel-src addr/mask\
    \  match tunnel source\n! --tunnel-dst addr/mask match tunnel destination\n  --next\
    \                begin next element in policy\n```"
  merge: -1
