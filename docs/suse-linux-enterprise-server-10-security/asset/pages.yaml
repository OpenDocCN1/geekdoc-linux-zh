- pgno: 12
  md: '# Introduction


    SUSE Linux Enterprise Server 10: Security (Course 3075) focuses on various security-related
    aspects in the system administration of SUSE Linux Enterprise Server 10 (SLES
    10).


    This course takes a look at system administration from a security perspective
    and covers host and network security, cryptography, firewalls, and VPNs.


    These skills, along with those taught in SUSE Linux Enterprise Server 10: Networking
    Services (Course 3074), prepare you to take the Novell Certified Linux Engineer
    10 (Novell CLE 10) certification exam.


    Your student kit includes the following:


    +   * SUSE Linux Enterprise Server 10: Security Manual

    * SUSE Linux Enterprise Server 10: Security Workbook

    * SUSE Linux Enterprise Server 10: Security Course DVD

    * SUSE Linux Enterprise Server 10 Product DVD

    * SUSE Linux Enterprise Desktop 10 Product DVD


    The SUSE Linux Enterprise Server 10: Security Course DVD contains an image of
    a SUSE Linux Enterprise Server 10 installation that you can use with the SUSE
    Linux Enterprise Server 10: Security Workbook outside the classroom to practice
    the skills you need to take the Novell CLE 10 Practical exam.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_12_0.png)


    Instructions for setting up a self-study environment is in the setup directory
    on the SUSE Linux Enterprise Server 10: Security Course DVD.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Course Objectives


    This course teaches theory as well as practical application with hands-on labs
    of the following SUSE Linux Enterprise Server 10 Security topics on SUSE Linux
    Enterprise Server 10:


    +   1. General Considerations and Definition of Terms

    2. Host Security

    3. Novell AppArmor

    4. Cryptography: Basics and Practical Application

    5. Network Security

    6. Firewalls

    7. Packet Filters

    8. Application-Level Gateways

    9. Virtual Private Networks

    10. Intrusion Detection and Incident Response


    These are topics an experienced SUSE Linux Enterprise Server 10 administrator
    who is responsible for security and firewalls in an enterprise environment routinely
    has to deal with.


    # Audience


    The primary audience for this course are Novell Certified Linux Professionals
    (Novell CLP 10) who also completed SUSE Linux Enterprise Server 10: Networking
    Services (Course 3074).'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Certification and Prerequisites


    This course helps to prepare for the Novell Certified Linux Engineer 10 (CLE 10)
    practicum exam, called the Practicum. The Novell CLE 10 is a higher-level certification
    for people who passed the Novell CLP 10 Practicum.


    As with all Novell certifications, course work is recommended. To achieve the
    certification, you are required to pass the Novell CLE 10 Practicum (050-698).


