- pgno: 150
  md: 'There is an alternate command to sign the certificate request, but it does
    not update the database in index.txt;

    openssl x509 -req certs/server_req.pem -out certs/servercert.pem \

    -CA da10-cacert.pem -CAkey private/da10-cakey.pem \

    -CAerial serial


    The certificate request, certs/server_req.pem in our example, can be deleted because
    it is no longer needed.


    # Create a Certificate Revocation List (CRL)


    Sometimes it is necessary to revoke a certificate. This would be the case if the
    passphrase for the secret key has been compromised. You would also, want to revoke
    the certificate used to authenticate a notebook at the VPN gateway if the notebook
    is lost or stolen.


    A certificate revocation list is a database that lists the certificates that are
    no longer valid despite the fact that their expiration date has not been reached.


    Two steps are necessary to revoke a certificate:


    +   - Revoke the certificate:


    ```

    da10::da10-CA # openssl ca -revoke certs/servercert.pem

    Using configuration from /etc/ssl/openssl.cnf

    ter pass phrase for /root/da10-CA/private/da10-cakey.pem:

    Revoking Certificate 01.

    Data Base Updated

    ```


    +   - Create the certificate revocation list (crl/da10-crl.pem in the following
    example):


    ```

    da10::da10-CA # openssl ca -gencrl -out crl/da10-crl.pem

    Using configuration from /etc/ssl/openssl.cnf

    ter pass phrase for /root/da10-CA/private/da10-cakey.pem:

    da10::da10-CA #

    ```


    CNI USE ONLY-1 HARDCOPY PERMITTED


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.

    To reported copying, please call 1-800-PIRATES.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# SUSE Linux Enterprise Server 10: Security


    If you get one or both of the following error messages:

    /root/da10-CA/crlnumber: No such file or directory

    error while loading CRL number

    it means that you did not put a comment symbol in front of the line

    crlnumber = $dir/crlnumber

    in /etc/ssl/openssl.conf (see page 4-15).

    You have two choices: Either put the comment symbol there, or create thenmmissing
    file using

    echo 0 > /root/da10-CA/crlnumber

    in the latter case, create CRL in Version 2 format, which some

    applications might not be able to use.


    This changes the entry in the file index.txt for that certificate. Note

    t change from V (valid) to R (revoked) and the additional time

    stamping the certificate was revoked:


    ```

    da10:~/da10-CA # cat index.txt

    R 070419050005Z 060419051137Z 01 unknown

    /C=de/ST=Bavaria/L=Munich/O=Digitalairlines/OU-Training/CN=da10.digitalai

    lines.com/emailAddress-ca-admin@digitalairlines.com

    ```


    The CRL needs to be published for others to check the validity of

    cificates. How this is done depends on the security policy of the

    CA. In some cases, it might be enough to just copy the file to an

    application directory: in other cases, it will be published on a web

    site in a directory service like LDAP.


    Cryptography, public key infrastructures, CAs, and certificates are a broad

    subject. There are many publications on the subject. A search for

    cryptography in any online bookstore will result in a long list of books.


    The OpenSSL web site is at http://www.openssl.org.


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_151_0.png)


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    ** Copying all or part of this manual, or distributing such copies, is strictly
    prohibited.

    To report suspected copying, please call 1-800-PIRATES.


    4-22


    Version 1'
  merge: -1
