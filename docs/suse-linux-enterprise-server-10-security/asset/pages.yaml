- pgno: 77
  md: '# SUSE Linux Enterprise Server 10: Security


    To start capturing packets, select Capture > Options to select the interface:


    # Figure 2-6


    ![](img/ebd0b66532100449f2a48e48fa2ec8ce_77_0.png)


    The most important options are


    +   - **Interface.** This determines which network interface should use to capture
    packets. By **selecting any**, packets from all interfaces are captured.


    +   - **Capture packets in promiscuous mode.** By enabling this option, all packets
    on the physical layer are captured, rather than just those which are addressed
    for the machine ethereal is running.


