- pgno: 260
  md: '# SECTION 8 Application-Level Gateways


    Application-level gateways can be used to make services available across network
    boundaries in a secure way. Unlike pure packet filters that do not take the content
    of the packets into consideration, application-level gateways offer more control
    over the transferred content.


    In this section you will learn the basics about application-level gateways. You
    will also learn how to configure the following packages shipped with SUSE Linux
    Enterprise Server 10:


    +   - Squid. A very popular application-level gateway for HTTP requests.


    +   - Dante. A software package implementing the generic SOCKS proxy protocol.


    +   - rinetd. A port redirector.


    # Objectives


    +   1. Application-Level Gateway Basics


    +   2. Configure and Use Squid


    +   3. Configure and Use Dante


    +   4. Configure and Use rinetd'
  merge: -1
