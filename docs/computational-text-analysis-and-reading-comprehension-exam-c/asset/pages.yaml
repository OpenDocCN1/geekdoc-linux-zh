    # 3.4 The KPG National Survey for the English Language Exams


    In order to collect valuable information on KPG test-takers’ profile and reading
    preferences as well as their perceptions of text and task difficulty, a paper-and-pencil
    survey was conducted by the KPG English team at the RCeL on a national scale in
    the form of questionnaires administered to all KPG test-takers sitting for'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'the B2 and C1 English language exams in the May and November 2006 and 2007
    and May 2008 examination periods. This type of research was considered appropriate,
    since self-completion questionnaire surveys have been used in the second language
    teaching and learning research as a useful method of obtaining information, especially
    when exploring learning preferences, effects of motivation and personality traits
    towards language learning or attitudes towards learning etc. (Bell, 2005: 10;
    Blaxter et al., 2006: 77; Brown & Rogers, 2002: 117; Nachmias & Nachmias, 2007:
    201; Nunan, 1992: 140; Strange et al., 2003: 337; Wiersma, 2008: 165: 198). As
    pointed out by many researchers, surveys are particularly useful in describing
    the characteristics, attitudes, views and opinions of students teachers alike
    (Cohen et al., 2007: 142; Cromwell, 2009: 77; Dörnyei, 2007: 101; Oppenheim, 2001:
    175). In fact, according to Brown and Rogers (2002: 147), “language surveys can
    be used to answer any research questions that require exploration, description
    or explanation of people’s characteristics, attitudes, views and opinions.” As
    a result, a survey can help us understand how things are really operating in any
    educational setting, in order to describe the attitudes, performances and other
    characteristics of the learners (Fowler, 2009: 2; Wiersma, 2008: 16).


    The KPK team''s decision to carry out a survey was also made after considering
    the characteristics of the target population, i.e. all KPK test-takers taking
    part in a general English language exam. Due to time and resource constraints
    and the extensive geographical distribution of the target population, it would
    have been impossible to personally get in contact and interview potential test-takers,
    whereas a survey proved to be a more efficient way of gathering data on a one-shot
    basis, while at the same time representing the wider target population (Marshall,
    1997: 48). Moreover, this research method made it possible to gather large scale
    standardized information that could be used in order to explore patterns of response
    among the sample units and examination periods, since the same instrument was
    repeatedly used (Bryman, 2008: 61; Cohen et al., 2007: 171; Cress, 2009: 82).
    After all, Cohen et al. (2007: 171–2) artificially pointed out “the attractions
    of a survey lie in its appeal to generalizability within given parameters [and]
    its ability to make statements that are supported by large data banks...typically
    collected through questionnaires, test scores etc.


    Most importantly, taking consideration test-takers'' perceptions and in a way
    treating them as “judges” of reading texts formed a crucial part of the present
    survey, since they were the actual readers who had to interact with the texts
    in order to perform a set of tasks and demonstrate a successful performance in
    the specific exams. So, their feelings and opinions about the texts were believed
    to be of great importance, since they could give us in-depth'
