  md: '# 3.3.11 Psycholinguistic Processes Indices


    Using LIWC2007, the proportion of word units that describe or refer to cognitive
    processes (e.g. *know, think, believe*) and nonobable intellectual processes such
    as affective acts expressing positive or negative emotions (e.g. *hope, love,
    hate*) and perceptual acts corresponding to the activation of the senses (e.g.
    *feel, touch, hear*) (Hinkel, 2003: 284) was estimated. Apart from exploring private
    acts as an indicator of intimacy of the writer, their presence in a text can also
    be treated as an indicator of informal register, such features are nearly six
    times more frequent in informal conversations than academic prose (Piber, 1991:
    74–5; Biber et al., 2002: 107–8). Moreover, cognitive complexity, which according
    to Tauscik and Pennebaker (2010: 35) relates to the extent to which someone differentiates
    between multiple competing solutions, is captured by two LIWC categories, i.e.
    exclusive and inclusive words. Exclusive words (e.g. *but, without, exclude*)
    are helpful in making distinctions and can, thus, prove useful in clarification,
    whereas inclusive ones (*and, with*) can increase information loading during the
    reading comprehension process. Prepositions and words longer than four letters
    are also indicative of more complex language (Tauscik & Pennebaker, 2010: 35).
    The use of causal lexical items (e.g. *because, effect*) and insight ones (e.g.
    *think, know, consider*), two categories of cognitive mechanisms, in describing
    an event on behalf of the writer with which the reader might not be able to identify.
    In addition, words showing certainty (e.g. *always, never, certainly*), inhibition
    (e.g. *block, stop, constrain*), discrepancy (e.g. *should, could, ought to*)
    or assent (e.g. *agree, yes, OK*) along with articles enhance text comprehension
    through meaning elucidation, whereas tentative constructions (e.g. *maybe, possibly,
    perhaps*) that imply an element of uncertainty may cause confusion to prospective
    readers (Abe, 2011: 214). A final set of discourse metrics that was derived from
    LIWC2007 relates to ways writers express their opinions and communicate with the
    readers in a direct way, through the use of first person pronouns in singular
    and plural form second person pronouns, or in indirect ways when there is some
    degree of reference outside the texts marked by questions and sentence adverbials
    (e.g. *obviously, fortunately, frankly*) (Fountain & Nation, 1976: 3, 6; Nagabhand
    et al., 1993: 900–901).


