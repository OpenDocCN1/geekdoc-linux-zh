    similar sentences and lexical items showing agreement or relativity concerning
    space, time and motion relations. The fact that two predictor variables from the
    L.A.S.T. index, namely the Lexical Density and the Syntactic Structure similarities,
    were also found to correlate, although, with objective reading performance, could
    be an indicator of their contribution to overall reading comprehension difficulty.


    On the other hand, it is worth noting out that, despite the fact that the above
    mentioned analysis is statistically acceptable, its practical usefulness for a
