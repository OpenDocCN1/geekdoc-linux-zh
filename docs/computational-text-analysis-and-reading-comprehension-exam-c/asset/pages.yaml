  pgno: 67
- img_proc: true
  md: 'Over the years, Kintsch and van Dijk''s assumptions that propositions are the
    basic units of ideas that affect the understanding and remembering of texts have
    triggered a long line of research in a variety of contexts language learning to
    clinical cases of speech pathology and forensics (Britton & Gülgöz, 1991: 330;
    Covington et al., 2007: 341; Oller et al., 1995: 167; Patel et al., 1986: 3).
    With specific reference to text complexity, propositional analysis and its measurement
    of propositional density, i.e. number of propositions present in the abstract
    text underlying it, has been used to investigate readability (c.f. Graesser et
    al., 1997: 163; Kintsch & Keenan, 1973: 272–4; Kintsch & Vipond, 1979: 329–30;
    Long & Baynes 2002: 228) and the decline across across the life span (c.f. Bayes
    et al., 2005: 111; Kemper et al., 2001a: 601–2; Kemper et al., 2001b: 229, Kemper
    & Summer, 2001: 313).


    According to Kintsch, propositional density is different from word length and
    seems to have a direct effect on comprehensibility in the sense that the more
    propositions present in the text base, the more time and effort is needed to process
    them, in order to build appropriate mental representations for later recall and
    comprehension. Kintsch established this early in his research, when he compared
    the reading speed of two passages of equal length with different numbers of propositions
    and found that the more propositionally dense passage took longer to process than
    its counterpart (Kintsch & Keenan, 1973: 272). This was confirmed by several subsequent
    studies (Embreton & Wetzel, 1987: 188–9; Kintsch, 1994: 294; Miller & Kintsch,
    1980: 335; van Dick & Kintsch, 1983: 113–116). In other words, if the number of
    words is constant, texts with relatively more propositions may cause increased
    processing on the part of the reader, since they cause higher demand on working
    memory (White, 2011: 85).


    Along with providing an index of the quantity of information contained in expos
    independent of its word length, propositional density is also known to increase
    processing difficulty and reduce memory performance in terms of proportional recall
    (c.f. Bovair & Kieras, 1985: 316; Gorin & Embreton, 2006: 397; Kintsch et al.,
    1975: 212; Stine & Wingfield, 1990: 294). In a much quoted study, Kintsch et al.
    (1975: 212) demonstrated that texts that have comparable readability scores have
    differences in the ease in which they are comprehended due to the number of different
    propositions in their abstract text base. More specifically, the authors constructed
    texts that were equal in length and in their total number of propositions but
    differed that in some paragraphs the same concepts were repeated as propositional
    arguments, whereas in others, new concepts were continuously introduced. The researchers
    found that concept recall increased as a function of the number of repetitions
    of that concept in the text base: (201).'
