    as a result of this research, it is difficult to make a definitive statement concerning
    the impact of background knowledge on language proficiency test scores, since
    many of the effects are highly dependent on the research methodologies used, and
    the results of some studies seem to contradict others, mainly due to the difficulties
    inherent in operationalizing the construct of background knowledge.


    No matter the various methodologies and problems researchers face when trying
    to explicitly define background knowledge, its effects on reading comprehension
    cannot be ignored, since they can be sources of test bias and lead to contaminated
    results (Johnston, 1984: 220). The issue is, thus, how language testers can deal
    with this problem. One possibility is to construct standardized achievement tests,
    which are somehow less dependent on prior knowledge. However, since prior knowledge
    is an integral part of the reading comprehension process, it seems impossible
    to construct a test, in which performance will be unaffected by prior knowledge,
    because whatever such a test would measure, it would not be reading comprehension.
    If it is, as claimed, impossible to construct an unbiased test of reading comprehension,
    an alternative might be to concede that the test is inevitably biased and obtain
    a measure of the extent of bias. Such information could be used both in the interpretation
    of test scores and in the construction of future exam papers (Johnston, 1984:
    221). Following this suggestion, one of the goals of the present research has
    been to identify those topics that are rated as more familiar or more interesting
    by B2 and C1 test-takers of the KPG language exams in English as a first step
    towards eliminating bias during the test selection process.


