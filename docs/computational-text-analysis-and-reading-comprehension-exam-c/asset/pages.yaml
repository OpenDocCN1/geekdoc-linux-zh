    (Mean: 56%, Min: 44%, Max: 63%). Regarding the number of years of learning English,
    B2 test-takers on the average stated that they had been learning English for approximately
    6 to 7 years (Mean: 6.6, Min: 6.3, Max: 7.0) before sitting for the exam, and
    also, that they have been specially prepared for it (Mean: 70%, Min: 67%, Max:
    73%), which could mean that they were at least partially familiar with the format
