    # 5.1.1 Reading Performance & Test Features: An Across-Levels Analysis


    In order to determine the contribution of the 135 test indices to reading performance
    per text but across the B2/C1 levels of competence, Pearson correlation coefficients
    were estimated. Data analysis showed that, when reading comprehension scores were
    grouped together, the mean reading performance per text of the total number of
    188,556 KPG test-takers correlated with five specific test variables, that is,
    Lexical Density (r=-266, p<0.05), syntactic similarity across all sentences (r=.236,
    p<0.05), and words expressing agreement (r=.246, p<0.05) or relativity (r=.276,
    p<0.05). Although we, these correlations might indicate that, regardless of their
    language competence, B2 and C1 test-takers as who scored lower in texts that were
