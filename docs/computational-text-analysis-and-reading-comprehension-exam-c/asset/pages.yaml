    knows, but also on psycholinguistic models of word knowledge and lexical networks.
    Psycholinguistic word information relates to the linguistic properties of words
    that affect word processing and learnability, such as word concreteness, polysemy
    and hypernymy (Crossley et al., 2011: 53). For example, polysemous words can be
    a burden to EFL users, who are often puzzled with words that they think they know,
