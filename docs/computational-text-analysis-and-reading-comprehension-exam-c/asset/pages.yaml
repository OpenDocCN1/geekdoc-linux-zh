  md: 'cohesion, since it provides a link with a preceding portion of the text (Halliday
    & Hasan, 1976: 51). Cataphoric refers to any reference that “points forward” to
    information that will be presented later in the text, whereas esophoric refers
    to any reference within the same nominal group or phrase that follows the proposed
    item (Eiggins, 1994: 97). For cohesion purposes, anaphoric referencing is the
    most relevant as it “provides a link with a preceding portion of the text” (Halliday
    & Hasan, 1976: 51), with its basic form being personal reference that keeps track
    of function through using personal pronouns (ibid: 37–39).


    In a nutshell, cohesion lies in the assumption of continuity of reference on the
    part of the reader, which is the base for the interpretation of referential terms.
    In simple cases of reference we might suppose that the load imposed on the reader
    is not substantial (Freebody & Anderson, 1983: 279). However, when reference becomes
    complicated or ambiguous, we would expect additional effort to be required and
    the interpretation of reference to be significant (Duffy et al., 2006: 1254; Freebody
    & Anderson, 1983: 279; Kirschner et al., 1992: 546; Nation, 1982: 73). In general,
    when the cohesion level is high, it is assumed that the reader can easily retrieve
    the relevant information and integrate it into the new proposition. The instruction
    to do this may be a referential, substitutive or elliptic device, but the operation
    is essentially the same. In fact, Abrahen and Shelton (1989: 569) demonstrated
    improved comprehension of texts that were partially modified, so that full noun
    phrases were substituted in place of referential expressions. Echoing Halliday
    and Hasan''s views on cohesion, this may suggest that texts with many referential
    expressions may be more difficult to comprehend than those with few referential
    expressions.


    Another characteristic of texts is related to cohesion, according to Halliday
    and Hasan, the use of conjunctive elements, “which are cohesive not in themselves
    but indirectly, by virtue of their meanings that presuppose the presence of other
    elements in the discourse” (ibid: 226). Conjunction can be realized through single-word
    connectives, such as and, or so, etc., and at once, whichever way it is. In general,
    conjunctive relations specify the way in which following elements are to be integrated
