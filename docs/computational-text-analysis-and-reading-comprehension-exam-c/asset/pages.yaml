  md: 'size is rather prohibiting (Czaja & Blair, 2004: 5; Gall et al.*, 2007: 213;
    Krosnik, 1999a: 540; Nachchias & Nachmias, 2007: 294). That is, they limit their
    investigation to a small percentage of subjects, who which they wish to generalize
    their research findings (Alreck & Settle, 2004: 55; Bell, 2005: 11; Denzin, 2009:
    85, 169; Gall et al.*, 2007: 213; Marshall, 1997: 57; O’Leary, 2004: 102). The
    method of selecting a sample is critical to the whole research process (Onwueuezer
    & Leech, 2007: 105; Stephens, 2001: 25), since as Gall et al.*, (2007: 215) stressed
    out “if research findings are not generalizable to some degree beyond the sample
    used in the study, then research cannot provide with new knowledge, cannot advance
    education as a science and is largely waste of time”. The sample size is, thus,
    a key criterion for demonstrating the value of a research and the extent to which
    the results can be generalized to the wider target population.


    Although there is no clearcut answer to the question of how large the sample for
    a research should be, the appropriate sample size depends on the purposes of the
    study, the nature of the target population, the number of variables set out to
    control in their analysis and the type of statistical tests they wish to carry
    out (Cohen et al., 2007: 93; Dörnyei, 2007: 96; Nunan, 1992: 142; O’Leary, 2004:
    104), there seems to be a consensus survey researchers that “a range of one per
    cent to ten per cent of the population is the magic” sampling fraction, with a
    minimum of 100 participants per survey” (Dörnyei, 2007: 99). In the present research,
    for the survey sample to be appropriate for detailed statistical analysis and
    as representative as possible of the target population, a decision was made for
    its size to be at least 10% of the number of test-sakers sitting in each exam,
    with a minimum of 500 participants per examination period. To 7,250 KPG English
    Candidate questionnaires from five examination have been collected, processed
    and analyzed, of which 4,750 relate to the B2 level and 2,500 to the C1 level
    exams.


    To be more specific, in the KPG English Survey effort was paid to select a sample
    of adequate size in order to produce research data that reliably approximated
    what would have been obtained, if the entire population were studied (Bryman,
    2008: 507; Gall et al.*, 2007: 216; Marshall, 1997: 61). Being in mind O’Leary
    (2004: 104) remark “the larger the sample the more likely it is representative
    and therefore generalizable”, as Mann and Denver’s words of caution (2004: 15)
    “the more varied the target population, the larger the sample needed, if you are
    to be confident about extrapolating from the sample to the population”, the sample
    size in all trend exceeded 10% (reaching 47.43% in November 2007 examination period
    of the C1 level). Our decision to obtain the largest possible sample size was
