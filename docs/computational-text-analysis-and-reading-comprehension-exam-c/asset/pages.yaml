    # 1.3 Usefulness of the study


    As discussed in detail Chapter 6, the present research asp to add useful insights
    into the reading comprehension proficiency of Greek EFL test-akers by shedding
    light on the following three aspects of the KPG exams, which have not been investigated
    before: (a) the linguistic profile of English test texts per level of competence
    (B2/C1) based on the detailed description of their lexicogrammatical features,
    (b) the specific effect text and reader variables have on KPG candidates'' mean
    reading comprehension performance, and (c) the extent to which these variables
    interfere with perceived source difficulty. Most importantly, the creation of
    a text difficulty formula, namely the L.A.S.T. Difficulty Index, which ''assigns''
    levels to texts through a theoretically sound, time-saving method of estimating
    readability, could be particularly useful to test developers and other stakeholders
    interested in automatic text classification. Moreover, the basis of leveling texts
    is a process leading ultimately to the description of their linguistic and textual
    features. The leveled texts, i.e. texts calibrated to specific levels of language
    competence, can be fed into an electronic bank, from which test writers of pen-paper
    or e-tests can valid source texts on the basis of specific text attributes.


