  md: Last but not least, it is worth mentioning at this point that the majority of
    reported research has been based on case studies or small scale surveys with EFL
    users taking part in experiments that aimed at examining a limited number of variables
    and had in many cases produced rather contradictory results. In fact, the extensive
    literature review has revealed a void of empirical research in investigating the
    influence of important reader and text factors under real high-stakes exam conditions,
    which reflects the need for further research in this area. The present study has,
    thus, been designed to fill this void and add to our state of knowledge on EFL
    text difficulty by examining the effect a number of complex linguistic features
    might have on actual test-takers’ performance and further explore text difficulty
    from their point of view.
