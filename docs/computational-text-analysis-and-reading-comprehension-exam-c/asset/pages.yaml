  md: '# 3.4.2.7 Questionnaire layout


    According to Gendall (1998: 9), questionnaires should be designed to make the
    task of following instructions, reading questions and recording answers as easy
    as possible for respondents to perform. In agreement with Gendall, Stern et al.
    (2007: 122) and Redline et al. (2005: 32) empirically demonstrated that, in addition
    to verbal language effects, the visual features of self-administered questionnaires
    can also influence people''s survey questions and, thus, need to be carefully
    considered when designing the instrument. These additional features include numeric
    language, i.e. size, spacing and location of information on the page, and symbolic
    language, i. size. answer boxes (Stern et al., 2007: 122; 67). Bearing in mind
    that formatting and graphic design are particularly important for self-completion
    questionnaires (Christian. & Dillman, 2004: 57; Dörnyei, 2007: 110), a compromise
    to be made for the KPG English Candidate questionnaire to be easy to read and
    pleasant to the eye of the respondents, at the same time containing a comprehensive
    list of questions. Effective ways of achieving this trade-off involving the page
    margins, using a space-economical font such as Arial Narrow 11, and utilizing
    the whole width of the page by printing the response options next to choose rather
    than below.


    To further increase its legibility, the KPG English Survey questionnaire was broken
    down into sub-sections with separate section headings, while questions dealing
    with a specific topic were grouped together and sub-lettered (i.e. Q1a, b, c).
    In addition, response categories were vertically aligned and a straightforward
    numbering system was applied throughout the instrument (Brown & Rodgers, 2002:
    143; Cohen et al., 2007: 259; Dörnyei, 2007: 111; Gendall, 1998: 9). Questions
    across two pages were avoided, whereas headings and instructions at the top of
    each section were emboldened to catch respondents'' attention, Moreover, instead
    of numbers, descriptive captions such as “agree” or “disagree” were provided above
    each answer for it easy to choose the option closer to their perceptions (Cohen
    et al., 2007: 258; Dörnyei, 2007: 109; Fuchs, 2005: 719; Gall et al., 2007: 431;
    Stern et al., 2008: 121; Verma & Mallick, 1999: 121). Finally, a brief note was
    added at the very end of the questionnaire to thank respondents for their participation
    and co-operation (Cohen et al., 2007: 259; Dörnyei, 2007: 110). All in all, the
    KPG English Survey questionnaire was structured in such a way so not only to be
    reader friendly and make sense to the respondents, also as avoiding leaving to
    them the choice of the order in which questions got answered, which could increase
    the risk of forgetting or omitting some of the questions (Stern et al., 2008:
    121).'
