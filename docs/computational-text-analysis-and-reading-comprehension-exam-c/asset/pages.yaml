    # 3.4.2.4 The rating system


    Along with the type of questions to be included in the KPG English Survey questionnaire,
    the rating system for measuring attitudinal and behavioral questions had to be
    determined. Based on our literature review and research findings of various studies,
    a five-point scale was employed, since such a scaling can provide a range of responses
    with a degree of sensitivity from “very much” to “not at all” while still generating
    numerical values (Bell, 2007: 465; Bogers & Hox, 2001: 330; Cohen et al., 2007;
    Cools et al., 2006: 223; Denzin, 2009: 100; Dörneyi, 2007: 103; Nachmias & Nachmias,
    2007: 209). More specifically, the rating scale is according to many researchers
    the most appropriate and widely used system of exploring respondents'' views about
    almost any aspect of language learning by simply asking them to put a tick in
    a rating scale response box (Brown & Rodgers, 2002: 120; Denzin, 2009: 109; Dörneyi,
    2007: 104; Munn & Drever, 2004: 26; Nachmias & Nachmias, 2007: 215; Oppenheim,
    2001: 189). Given the fact that rating scales render data more sensitive to respondents,
    they are particularly useful for tapping individual attitudes, perceptions and
    opinions, which was exactly one of the aims of the present study (Cohen et al.,
    2007: 255).'
