  md: 'This book delineates a range of linguistic features that characterise the reading
    texts used at the B2 (Independent User) and C1 (Proficient User) levels of the
    Greek State Certificate of English Language Proficiency exams in order to help
    define text difficulty per level of competence. In addition, it examines whether
    specific reader variables influence takers'' perceptions of reading comprehension
    difficulty. The end product is a Text Classification Profile per level of competence
    and a formula for automatically estimating text difficulty and assigning levels
    to texts consistently and reliably in accordance with the purposes of the exam
    and its candidature-specific characteristics.


    Trisevgeni Liontou holds a Ph.D. in English Linguistics with specialization in
    Testing from the Faculty of English Studies at the National and Kapodistrian University
    of Athens (Greece). She holds a B.A. in English Language & Literature and an M.A.
    in Lexicography: Theory and Applications, both from the same faculty. She also
    holds a M.Sc. in Information Technology in Education from Reading University (UK).
    Her current research interests include theoretical and practical issues of reading
    comprehension performance, computational linguistics, online teaching practices
    and classroom-based assessment.


    www.peterlang.com'
