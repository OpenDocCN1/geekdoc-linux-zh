  md: 'In order to explore whether linguistic features could have triggered the activation
    of particular strategies, correlational statistics were carried out between C1
    test-takers’ average self-reports on employed strategies and the textual characteristics
    of pertinent texts (10 C1 tests-135 test indices) and a number of significant
    relationships was revealed. More specifically, C1 test-takers on the average reported
    usage of “guessing the meaning of unknown words” in lexically diverse texts (r=.953,
    p<0.05) that also contained a higher percentage of words from Coxhead’s Academic
    Word List (r=.932, p<0.05) and verbs with fewer hypernym values (r=.960, p<.05).
    These results could be taken to suggest that for advanced EFL users unfamiliar
    vocabulary was mainly related to abstract words as well as technical vocabulary
    and word families above the 2,000 most frequent ones of the BNC corpus.


    Text rereading could be an additional indicator of test complexity given that
    readers are more likely to repeat processing of those parts they find difficult
    to comprehend. In fact, data analysis showed that C1 test-takers on the average
    resorted to “rereading” texts that contained less frequent words, as those falling
    inside the fifth frequency band of the BNC corpus, and a higher proportion of
    causal relations (r=.655, p<0.05), including both positive (r=.642, p<0.05) and
    negative (r=.746, p<.05). This finding suggest that events or actions connected
    with cause and effect were more demanding for C1 test-takers to process, since
    they need to clarify existing interactions in order to effectively interpret the
    presented message. Words describing perceptual processes and motion were also
    found to correlate with rereading textual information (r=.769, p<0.05 and r=.672,
    p<0.05 respectively), which could be an indication of the extra loading which
    word units cause C1 test-takers’ working memory. This could be due to the inherent
    abstractness of these lexical items, or to the fact that readers might have needed
    to confirm their understanding of writers’ emotions and attitudes by looking for
    surrounding textual evidence.


