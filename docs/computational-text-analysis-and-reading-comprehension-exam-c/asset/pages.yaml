    # 3.4.4 Administering the KPG English Survey Questionnaire


    The questionnaire was sent by the Greek Ministry of Education, through its Vertical
    Blanking Interval (V.B.I.) system, on a group basis, along with the test papers,
    to all KPG exam centers around Greece and asked to duplicate and hand them out
    to candidates wishing to take part in the Survey, right after completing the written
    part of the exam. Thus, feedback was received in close sequence to the process
    itself. In applied linguistic research, a collective administration method is
    considered the most useful way of having a large number of questionnaires completed
    within a relatively short period of time (Dörneyi, 2007: 113; Kumar, 2005: 113;
    Oppenheim, 2001: 103). Moreover, this administration ensured a very high response
    rate (reaching at 92%), as very few test-takers refused to participate in the
    survey. Most importantly, context bias were this way better controlled, since
    the conditions of administration were similar for all respondents (Bowling, 2005:
    281; Gall et al., 2007: 418). Without doubt, test-akers’ willingness to participate
    in the Survey is accounted for the fact that it was a survey conducted by a Research
    Centre of the University of Athens and administered through the Ministry of Education,
    which is also the authority issuing the certificates of proficiency. It is also
    possible that candidates were convinced that the survey was conducted for a worthy
    cause, since the importance of test-testers’ opinion for improving the KPG exams
    was emphasized in the opening section of the questionnaire.


    # 3.4.5 Processing the KPG English Survey Data


