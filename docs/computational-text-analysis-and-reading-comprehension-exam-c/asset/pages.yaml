    Along with lexical diversity, higher occurrence of technical vocabulary as List
    was also found to correlate with average self-reports on increased difficulty
    (r=.553, p<0.05), which strengthens the view that not only the range but the frequency
    of words present in immaculate texts could have an impact on test-takers'' reading
    comprehension performance, with less frequent and more lexical items being more
    difficult to interpret than highly frequent ones.


    Three more word-based indices, i.e. average number of characters (r=.700) and
    syllables (p<0.05) per word along with average number of syllables per 100 words
