    # 2.4.7 Phrasal Verbs


    With idioms, phrasal verbs, that is, any verb particle that function as a single
    lexical and grammatical unit (Celce-Murcia & Larsen-Freeman, 1999: 265; Crutchley,
    2007: 204; Dempsey et al., 2007: 217; Dixon, 1982: 1; Kilby, 1984: 99; Kopkowski,
    2005: 323; Palmer, 1968: Quirk et al., 1985: 1150) can pose additional difficulties
    to L2 learners, given that such phrases look nearly the same and the meaning of
    each one is not always apparent from its parts but also to be learned by (Darwin
    & Gray, 1999: 65; Kovcecs & Szabó, 1996: 326; Liu, 2003: 678; Quirk et al., 1985:
    1152; Rodriguez-Puente, 2012; Side, 1990: 144). In fact, many researchers believe
    mastering phrasal verbs is a different task for most EFL users (Celce-Murcia &
    Larsen-Freeman, 1999: 425; Darwin & Gray, 1999: 66; Gardner & Davies, 2007: 340;
    Kao, 2001: 196; Liao & Fukuya, 2004: 193), and using them correctly in speech
    a true test of fluency (Coady, 1997: 282; Cornell, 1985: 269; Gardner & Davies,
    2007: 339; Nassaji & Tian, 2010: 402). As Dagut and Laufer (1985: 78) showed in
    their study with Hebrew-speaking intermediate learners later Laufer and Eliasson
    (1993: 44) with advanced Swedish learners of English, phrasal verbs often cause
    learners to misinterpret received messages and to avoid such constructions by
    using single-word verbs instead. However, such avoidance only compounds the problem,
    since it prevents learning and unnatural speech.


    Continuing the work of Dagut and Laufer Hulstijn and Marchena (1989: 241) showed
    that Dutch learners of English also had the tendency to misunderstand or avoid
    English phrasal verbs, especially figurative ones, even though similar constructions
    did exist in their native language. In fact, the 75 EFL users who took part in
    their experiment exhibited a tendency to adopt a play-it-safe strategy, preferring
    one-word verbs'
  merge: -1
  pgno: 76
