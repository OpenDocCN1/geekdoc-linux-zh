    # ##2.5 Reader Variables


    Over the last twenty years there has been an increasing interest in exploring
    and better defining the interaction between the reader and the text, rather than
    text features alone, acknowledging, as already stated in the sections above, reading
    is a multifaceted phenomenon, reflecting properties of both the texts and the
    readers and the interaction between them (Bachman, 2002: 464, 469); Bailin & Grafstein,
    2001: 292; Fitzgerald, 1995: 45; Parker et al., 2001: 308). In fact, most recent
    research in foreign language reading has highlighted the significant effect of
    reader factors on comprehension and further supported the view that a satisfactory
    of the reading process depends not only on an accurate identification of the various
    text elements and the connections among them, but also as that of readers'' prior
    knowledge and interest in the topic, as well as the strategies used to actively
    construct meaning (Anderson, 2000: 33); Allen et al., 1988: 65; Bailin & Grafstein,
    2001: 292; Drucker, 2003: 25; Farhady, 1982: 55–6; Freebody and Anderson, 1983:
    278; Keshavarz et al., 2007: 20; Lehner, 1993: 552; Parker et al., 2001: 308;
    Rupp et al., 2006: 445; Yin, 1985: 576). Especially in language testing, Sullivan
    Stressed (2000: 373–4) the importance of better defining these reader variables
    that may affect overall test performance, in order to be able to detect and eliminate
    any test features that can be sources of measurement error and, thus, distort
    testers'' attempts to achieve an accurate assessment of test-takers'' language
    proficiency.


    # ##2.5.1 Content schema & reading comprehension


    By now, several studies have been carried out showing the effect of background
    knowledge or schemata on foreign language reading comprehension (c.f. Brantmeier,
    2005: 37; Bügel & Bunk, 1996: 15; Carrellb, 1983: 190–3; Carrellb, 1987: 461;
    Fitzgerald, 1995; Floyd & Carrell, 1987: 103; Freebody & Anderson, 1983: 287;
