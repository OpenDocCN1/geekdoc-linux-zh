    the sample in terms of place of residence was further supported by a consistent
    finding in the literature that response rates vary considerably considering respondents''
    place of residence (Abraham et al., 2006: 692; Groves, 2004: 664; Pickery & Carton,
    2008: 83) and ignoring the regional variation could lead to an over-representation
    of specific groups in the final sample.


    In the KPG English Survey the size of each sub-group was determined by the researcher
    (Cohen et al., 2007: 101; Denizin, 2009: 83; Munn & Drever, 2004: 19) following
    a proportional allocation system, that is each stratum contributed to the sample
    that was proportional to its size in the general population (Creswell, 2009: 148;
    Wiersma, 2008: 253). Proportional allocation has, according to Wiersma (2008:
    254), an advantage over equal allocation and simple random sampling in researchers
    can control part of the variability in the dependent variable, which in turn can
    render statistical analyses more sensitive to differences.


    In summary, there is no doubt that random sampling is a consuming strategy, but
    it can lead to a sample, which is a more accurate representation of the target
    population (Alreck & Settle, 2004: 71; Gall et al., 2007: 224; Kish, 1995: 75;
    Searle, 1999: 60) since it is a “useful blend of randomization and categorization”
    (Cohen et al., 2007: 101). Our decision to adopt a stratified random sampling
    strategy was thus, driven primarily by the need to ensure that no sub-population
    would be omitted from the sample and key groups of the target population would
