    In order to explore the existence of any additional differences between B2 and
    C1 texts, a final set of variables that have been reported in reading literature
    to have an impact on test difficulty were submitted to statistical analysis. The
    variables included in this data set referred to the percentage of idioms, phrasal
    verbs and Greek cognates as that of main and auxiliary verbs, adverbs and'
