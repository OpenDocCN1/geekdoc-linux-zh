  md: 'Following Nachmias & Nachmias (2007: 221) and other researchers’ suggestion
    that initial questions need to be relatively easy and neutral so as to make respondents
    feel at ease and encourage participation, the KPG questionnaire commenced with
    non-threatening, factual questions designed to elicit personal information such
    as their age, years of learning English and residence (Cohen et al., 2007: 257;
    Converse & Presser, 99; Dörnyei, 2007: 111; Drummond et al., 2008: 182). In the
    subsequent section, positive attitude statements as “I liked the topic of Text
    A” or “I was familiar with the topic of Text A” were included, whereas more topic-specific
    questions regarding lexical complexity and employing reading strategies were placed
    in the middle of the questionnaire. Finally, the last section contained more questions
    regarding overall test paper difficulty in order to ensure all respondents finish
    completing the questionnaire (Cohen et al., 2007: 257; Converse & Presser, 1994:
    123; Dörnyei, 2007: 256; Gendall, 1998: 9; Munn & Drever, 2004: 27). To avoid
    intimidating respondents, who had just taken an English language exam and might
    not feel comfortable talking about their performance or were likely to give more
    desirable answers to avoid embarrassment and project a positive self-image (Gerty
    et al., 2005: 233), some questions were deliberately loaded with overstatements
    of easness as a method of eliciting information about difficulty in a direct way
    (Dörnyei, 2007: 256).


    To overcome the problem of respondents following a response set, i.e. answering
    all questions in a specific direction regardless of their content, the order of
    questions and options was randomized (Borgers & Hox, 2001: 329; Dörnyei, 2007:
    111; Krosnick, 1999b: 43; Nachmias & Nachmias, 2007: 221; Sudman et al., 1995:
    131). The response set was further controlled by varying the response options
    in each question, by not offering the “no opinion” response option and by asking
    respondents to rate both positive and negative statements (Hofmans et al., 2004:
    43; Nachmias & Nachmias, 2007: 222). This, respondents were required to evaluate
    each question separately rather than uniformly agree or disagree with the list
    of statements.


    To sum up, for questions to follow a logical sequence, a funnel approach was adopted
    with general and non-threatening questions placed first, followed by more specific
    ones. Moving from objective facts to subjective attitudes and opinions was considered
    an appropriate approach, as it gradually led respondents into the more complex
    themes of the survey, while maintaining their interest and gradually stimulating
    them to answer more specific questions (Oppenheim, 2001: 110). The final sequence
    of questions was also seriously determined by the results of the pilot work (see
    3.4.3).'
