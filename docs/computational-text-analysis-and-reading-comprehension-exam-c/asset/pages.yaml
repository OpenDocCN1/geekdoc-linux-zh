  md: '# 6. Discussion & Conclusions


    Through its investigation of the significant relationships among a range of text
    and reader variables, the present research contributes to the understanding of
    the reading comprehension process of Greek EFL test-t and from a theoretical perspective
    provides evidence regarding the strength of lexical indices in predicting text
    difficulty. In addition, by analyzing source texts and EFL users’ perceptions
    while taking part in a high-stakes exam, administered under standard operational
    conditions, the study sheds light on the specific text and reader variables have
    on exam performance and perceived text difficulty. Last but not least, the current
    study breaks new ground in text research and makes a methodological contribution
    in that, instead of examining a limited number of text variables independently,
    it makes extensive use of advanced text analysis software applications and investigates
    the impact of 135 text variables on readability. This way it is believed that
    their interaction has been better defined and predicted within the context of
    the KPG language examples in English.


    # 6.1 Usefulness of the study


    One of the most important outcomes of the within and across levels analysis of
    the lexicographical features present in KPG test source texts has been the detailed
    description of their linguistic characteristics that have ultimately led to the
    creation of a Text Classification Profile per level of competence (B2/C1). The
    newly created profile (Table 6.1) could be of practical use in KPG’s systematic
    attempt to quantify the communicative descriptors included in the exam specifications
    with the interrelated linguistically articulated features pertaining to two different
    levels of language proficiency and, thus, describe the linguistic qualities of
    the texts that candidates at each of these two levels must be able to handle for
    a successful exam performance. At the same time, the proposed Text Classification
    Profile could increase the construct validity of the specific exams and serve
    as a yardstick for item writers to select future reading texts by taking into
    account the average linguistic profile of source texts used so in real KPG language
    exams in English. For the sake of simplicity, the profile presented includes basic
    qualitative information regarding the discoursal and lexicographical characteristics
    of pertinent texts. Nevertheless, interested parties could also refer to Chapter
    4 and Appendices 8 and 9 for the complete list of quantifiable text features.'
