    # 3.4.2 The KPG English Survey: Design & Application


    # 3.4.2.1 Why a questionnaire?


    In the KPG English Survey information was gathered by means of self-completion
    questionnaires administered to all KPG test-takers sitting for the specific exam
    in five consecutive examination periods. The questionnaire is'
