  md: '# Text Classification Profile


    # B2 Level


    **Purpose:** Texts at this level of language competence are mainly narrative (newspaper
    articles, travel narratives, blog entries, etc.) and their main purpose is to
    convey factual information.


    **Vocabulary:** Although B2 texts contain a mix of abstract (e.g. benefit, program)
    and concrete (e.g. mother, house) vocabulary, their lexicon is primarily composed
    of rather straightforward, frequently-used words, while less frequent (not rare)
    ones are introduced gradually. There is some redundancy, with similar words repeated
    throughout the text. There is also some-specific vocabulary, but it is not essential
    to understanding the overall meaning of the text. In general, the readability
    of B2 texts is expected to be at 60 in terms of the Flesch Reading ease, 9.5 in
    the Flesch-Kincaid Grade Level, 10.5 in the Gunning-Fog Index and 9.5 in the Dale-Chall
    Grade Level Index. B2 texts consist of a high percent of function words, such
    as articles and presentations and a limited number of idioms and phrase verbs.


    **Structure:** The sentences are multi-propositional, while carefully constructed,
    conveying a clear beginning, middle and end. Because of the nature of the discourse,
    the sentences cannot be rearranged without losing their overall meaning. The majority
    of sentences are written in the present tense, but references to past and future
    events are also possible. An average degree of semantic similarity between adjacent
    sentences is expected on the basis of argument, stem and content word overlap.
    The texts could also be characterized by their high frequency of modifiers, such
    as adjectives that describe the properties of a head noun in relevant phrases.
    Phrase sentences, negations, conditions, noun and verb hypernym are limited. There
    is a high presence of connectives and clear anaphor reference between sentences,
    with a low ratio of pronouns to noun phrases. The majority of connectives are
    expected to be positive additive ones (e.g. as well as, moreover, again), positive
    causal ones (e.g. because, therefore, consequently) and positive logical ones
    (e.g. due to, in fact, for example).


    **Author’s stance:** The author’s position or underlying attitude towards individuals,
    situations or events could be expressed on the basis, inter alia, of word units
    referring to affective processes expressing positive or negative emotions (e.g.
    feel, hope, worry, hate). In addition, an increased number of running words could
    refer to cognitive processes (e.g. believe, think, know). The majority of these
    words are expected to be inclusive (e.g. and, with, include), insight (e.g. think,
    know, consider) and tentative ones (e.g. perhaps, maybe, guess), but a limited
    number of exclusive (e.g. but, without, exclude), certainty (e.g. always, never,
    sure) or causal lexical items (e.g. hence, because, effect) could also be present.'
