  md: 'not affect text complexity, but rather that the contribution or “loading” of
    the former to increased difficulty is sufficient for the model to reach its maximum
    predictive power, while eliminating the number of independent variables needed
    to this end.


    Furthermore, given that readability formulas were found to come in agreement with
    KPG test designers'' perceptions of text difficulty, they might be of some practical
    usefulness to them during the preliminary text selection process as a means to
    roughly estimate the appropriateness of a large number of collected texts. In
    order of priority, the formulas that seem to better match KPG designers'' text
    ratings are the Gunning-Fog Index followed by the Dale-Chall and Fry ones, whereas
    the Flesch Reading Ease Index and the Flesch-Kincaid Level reflect a lower ability
    to distinguish between B2 and C1 KPG reading texts. Without doubt, although such
    measures may serve to highlight problems regarding text complexity, final decisions
    on the suitability of test material will inevitably need to weigh the impact of
    more complex text features and take into serious account a wider range of syntactic,
    semantic and cognitive aspects pertinent to the purposes of the specific exam.


    In addition, more in-depth linguistic features that could help test designers
    take more consistent and informed decisions, when distinguishing between intermediate
    and advanced reading texts, could include estimates of lexical density and lexical
    richness, as the percentage of content words, tokens and types per word family
    and proportion of legomena, with B2 level texts being characterized by a lower
    density score (30%–40%) and increased repetition of types and tokens. Recognizing
    syntactic complexity, the occurrence of four specific linguistic features, i.e.
    proportion of past and present tenses, passive sentences and temporal connectives,
    demonstrated significant differences between the two levels and could be used
    to obtain a numerical cut-off point between them, with passive sentences expected
    to cover approximately 18–20% of the total number of words in C1 texts as opposed
    to 10–12% in B2 texts and temporal connectives to account for 9%–10% of running
    words in advanced texts and 6–7% in lower ones. Moreover, a higher incidence of
    past tenses in advanced texts (4%) could be an indicator of text complexity, while
    present tenses are expected to be more frequently used in B2 texts (6%).


