    # 2.3.2 Halliday & Hasan''s Model of Text Cohesion


    Halliday and Hasan (1976) developed a taxonomy of the linguistic features that
    contribute to the unity of a text, to which cohesion occurs in text when the interpretation
    of some element in the discourse is dependent on that of another, i.e. the two
    elements, the presupping and the presupposed, are there, at least potentially,
    integrated into a text. In other words, Halliday and Hasan (1976: 8), a text coherent
    is a result of "the semantic relation between an element in the text and some
    other element that is crucial to its interpretation". Therefore, the presence
    of grammatical structures, such as clauses or sentences, fails to define a text
    as such. Rather, the essence of a text resides within the meaning relations that
    emerge from cohesive ties that are created by various linguistic devices.


    For Halliday and Hasan, linguistic factors are responsible for carrying meaning
    across sentence boundaries and defining one aspect of a text''s unity (Mesenthal
    & Tierney, 1984: 240). By text, they define any sample of discourse, whose meaning
    and function form a unified whole and is readily apparent, independent of other
    discourse (Halliday & Hasan, 1976: 1). They further claim that the concept of
    a sentence is intuitively powerful, but also different from it in kind, since
    it is not characterized by formal structural properties as the sentence is the
