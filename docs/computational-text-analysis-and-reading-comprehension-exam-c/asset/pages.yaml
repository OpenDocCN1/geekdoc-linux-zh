    Along with the Text Classification Profile, the present research has attained
    one goal it set out to achieve: that is, to develop a text difficulty formula,
    namely the L.A.S.T. Text Difficulty Index (Table 6.2), which should be viewed
    as a springboard for more theoretically sound and practically useful text readability
    tools to be developed.


    # Table 6.2: The L-A.S.T. Text Difficulty Index


    | Level = 23.097 + (0.202*LexicalDensity) + (0.814*AcademicWordList) + (-97.184*SyntacticSimilarityAll)
    + (-60.381*Tokens/Family) |


    The proposed formula assigns ''assigns levels to texts through a theoretically
    sound, time-saving method of estimating readability based on four in-depth linguistic
    features, i.e. lexical density, syntactic similarity, tokens per word family and
    technical vocabulary, might prove useful to text developers and other stakeholders
    interested in automatic text classification. The leveled texts, i.e. texts calibrated
    to specific levels of language competence can be fed into an electronic bank,
    from which test writers of pen-and-paper or e-tests can more consistently choose
    test tasks on the basis of specific text attributes. Undoubtedly, it is worth
    pointing out that the proposed formula should by means be treated as an absolute
    indicator of text difficulty that could replace human judges. On the contrary,
    the new index is intended to complement and increase the validity and reliability
    of human decisions and provide a practical and time-saving tool during the text
    selection process. (Un)fortunately, despite the great advances in the field of
    Computational Linguistics and Machine Learning, no intelligent system has yet
    been developed to replicate human reasoning and, in the context of foreign language
    testing, deciding on the appropriateness of a topic or judge how interesting and
    appealing it could be for prospective test-takers. It is also necessary to highlight
    that the inclusion of four specific variables in the created formula should not
    be taken to suggest that additional text features do'
