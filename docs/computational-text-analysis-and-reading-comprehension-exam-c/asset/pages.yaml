    # 3.3.7 Text Abstractness Indices


    Coh-Metrix 2.1 contains a number of indices on text abstractness, based on the
    Medical Research Council (MRC) Psycholinguistic Database (Graesser et al., 2004:
    4); The MRC database (Coltheart, 1981) contains 150,837 words and provides information
    on various linguistic properties of these words based on experiments conducted
    by different researchers, who used human subjects to large counts of words for
    their psychological properties (c.f. Gilhooly & Logie, 1980: 395–6; Paivo, 1965:
    33–34; Paivo et al., 1968:3). However, unlike other dictionaries, the MRC psycholinguistic
    database does not provide any semantic information about the words it contains.
    Nevertheless, its indices are considered important for L lexical networks, because
    they measure the extent to which words associate with each other (Crossley & McNamara
    2009: 125). Coh-Metrix estimates the *concreteness* of content words that is the
    mean concreteness value of all content words in a text that matches a word in
    the MRC database, and the *minimum concreteness* of content words that is the
    mean of low-concreteness words across sentences. Indices measure how concrete
    a word is on a scale from 100 to 700 with high numbers showing increased concreteness
    and low numbers indicating text abstractness (Crossley et al., 2011: 565, 569).


    Hypernym levels are also indicative of text abstractness, a word with more hypernym
    levels invokes word associations and is, thus, more concrete and easier for EFL
    users to acquire, a word with fewer hypernym levels is more abstract and thus,
    expected to be more difficult to decode (Crossley et al., 2009: 310; Crossley
    et al., 2010: 582; Crossley et al., 2011: 564; Ellis & Beaton, 1993: 565–6; Gee
    et al., 1999: 495; Salsbury et al., 2011: 346; Schmitt & Meara, 1997: 27; Zarev,
    2007: 126). Implementing WordNet, an online lexicon that has been used in a variety
    of studies on word sense disambiguation and conceptual density (c.f. Crossley
    et al., 2007b: 208; Crossley & McNamara, 2008: 414; Leacock & Chodorow, 1998:
    265) and whose design is inspired by current psycholinguistic theories of human
    lexical representations (Felbaum, 1998: 7–10);'
