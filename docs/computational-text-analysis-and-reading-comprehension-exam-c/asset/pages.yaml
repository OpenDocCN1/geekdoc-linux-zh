    # 3.4.1 The sampling frame


    As already mentioned in the previous section, a survey is a method through which
    new information is collected from a sample drawn from the target population, with
    the purpose of making inferences about the population in an objective possible
    (Bell, 2005: 12), provided a well-thought sampling procedure has been followed
    to ensure proper coverage of the major characteristics of the target population
    (Oppenheim, 2001: 38). However, most surveys rarely provide sufficient information
    on the sampling criteria for the validity and reliability of their findings to
    be assessed in various ways (Oppenheim, 2001: 38; Wiersma, 2008: 170). Echoing
    Oppenheim, Cohen et al. (2007: 92) stated that “the quality of a piece of research
    not only stands or falls by the appropriateness of methodology and instrumentation
    but also by the suitability of the sampling strategy that has been adopted”. Bearing
    in mind these remarks, the following subsections contain a detailed description
    of the sampling criteria followed in the KPG National survey and the decisions
    that had to be made in relation to the size and representativeness of its sample.


    # 3.4.1.1 The sample size


    Most research projects select a sample of the population they are interested in
    and do not analyze data collected from an entire population, especially when it'
