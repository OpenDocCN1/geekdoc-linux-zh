    # 3.4.1 Sample representativeness


    The first step in sampling was to define the target population, that is, all English
    language learners sitting for the B2 and C1 KPG exams in English around Greece.
    From such a broad description it became that the target population represented
    a large group scattered over a wide geographical area, which would have been impossible
    to reach, if it were not for the help of the Greek Ministry of Education. Thus,
    in cooperation with the specific Ministry, which is responsible for the overall
    administration of the KPG Language Exams, the questionnaire was administered'
