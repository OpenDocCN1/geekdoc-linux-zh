    recall, as had suggested by Myers et al. Contrary to these findings, Harrison
    (1986: 62–3) cites research showing that the connective contributions make to
    readability less important for highly skilled readers. Without doubt, the many
    and often contradictory views among researchers, a more in-depth investigation
    is warrant unto what kind of connectives have a facilitative effect on comprehension,
    especially in the context of foreign language research.


    The final type of cohesive device delineated by Halliday and Hasan is lexical
    cohesion. Cohesion refers to the "cohesive effect achieved by the selection of
    vocabulary" and is mainly signaled by the use of synonyms, superordinates, or
    subordinates (ibid: 274). In other words, this type of cohesion is signaled by
    vocabulary selection, rather than by structural devices. The two basic categories
    of lexical cohesion are reiteration and collocation. Reiteration pertains to the
    repetition of a lexical item, either directly or through the use of a synonym,
    a superordinate or a generally related word (ibid: 278). Collocation pertains
    to lexical items that are likely to be found together within the same text (ibid:
    284). The closer lexical items are to each other between sentences, the stronger
    the cohesive effect (ibid: 286). While lexical cohesion is the most difficult
    to specify, due to the innumerable word meanings can be related to one another
    and can co-occur, it is clearly an important source of cohesion in text. According
    to Moshenthal and Tierney (1984: 241), it is the variable most strongly related
    to Halliday and Hasan’s notion of the underlying thematic nature of cohesion and
    text, since it plays a major role in helping readers present text with earlier
    one and thus, establish its semantic unity.


    At this point, it should be made clear that although in the present research framework
    for our analysis of text cohesion and its relation to text difficulty is based
    on Halliday and theory of Hasan’s model, Halliday and Hasan themselves did not
    mean to propose a theory of textual cohesion that could predict comprehension.
    However, the possibility to use such a model, while investigating text'
