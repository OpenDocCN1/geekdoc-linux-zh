  md: 'since moderate correlations at one level could have partialed from nonexisting
    or even negative correlations at another level of language competence. Bearing
    these limitations in mind, in the following two sub-sections, the contribution
    of text indices to mean reading performance per text but per level of competence
    is discussed, in order to gain a more complete understanding of the specific text
    features might either mediate or advanced EFL language users.


    # 5.1.2 B2 Reading Performance & Text Features


    In order to determine the contribution of text indices to mean reading performance
    per text and per level of competence, Pearson correlation coefficients were estimated.
    Normality of distribution per variable was assessed using the One-Sample Kolmogorov-Smirnov
    Test (p>.05). Data analysis showed a negative correlation between individual B2-takers''
    mean scores in each set of multiple-choice reading comprehension questions and
    two text variables, i.e. proportion of past tenses (r=-347, p<0.05) and frequency
    of words occurring in the fifth band of the BNC corpus (r=-374, p<0.05). Although
    we, this effect reflect B2 text-takers'' difficulty in processing less frequent
    words compared to the first and second thousand frequent ones of the BNC corpus,
    while it further supports that vocabulary knowledge in general and word frequency
    in particular could affect reading comprehension (Anderson & Freeway, 1981: 77;
    Crosley et al., 2011: 563; Fukkink et al., 2005: 75; Laufer, 1998: 256; Nation,
    2001c: 169; Zhang & Ansari, 2008: 51), since less frequent words might not form
    part of B2 EFL users'' repertoire at this stage of their language process. The
    negative impact of past tests on exam performance could also be treated as an
    indication of increased difficulty from the part of the readers, who might struggle
    to disentangle relationships between present and past events or follow a series
    of past actions (Nagaband et al., 1993: 900).


    On the other hand, the higher proportion of verbs in future tenses (r=.380, p<0.05)
    and words expressing agreement (r=.417, p<0.05) was found to correlate with mean
    performance scores in significantly positive way, i.e. the higher the percentage
    of such features in B2 readings, the higher the percentage of correct responses
    to pertinent questions. This finding could be taken to suggest that both features
    facilitate text processing as they better define time relations and further clarify
    the intended meaning on behalf of the writer (by using expressions such as agree,
    always, never, or course). These variables appear to be related to text complexity
    in a more subtle way, through their positive contribution to the elucidation of
    apparently confusing messages.'
