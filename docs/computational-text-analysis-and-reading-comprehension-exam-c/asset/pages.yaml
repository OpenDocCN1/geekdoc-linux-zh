  md: 'As White (2011: 87) explained less familiar words are longer words because
    they tend to be affixed, context-specific and content-bearing, but their influence
    on comprehension may be reduced given the context surrounding them (Cohen & Steinberg,
    1983: 100; White et al., 1989: 301). Sentence length is similarly related with
    more difficult texts, i.e the longer the sentences, the more difficult the text
    (Bailin & Grastein, 2001: 290; Carrell, 1987a: 23; Chall & Dale, 1995: 5; Harrison,
    1999: 42; Linacre, 1999; McCarthy et al., 2006: 192; Ulij & Strother, 1990: 48).
    According to White (2011: 85), sentences with more than twenty words are difficult
    to comprehend, because they are likely to contain more clauses and corresponding
    propositions and, thus, require individuals to retain more information in their
    short-term memory.


    To date, although least 15 different readability formulas are widely used in English
    as a first language are the Dale-Call, the Flesch Reading Ease Formula, the Fry
    and the Gunning-Fog Index, all of which rely on measures of word and sentence
    length (Lehner, 1993: 552; Parker et al., 2001: 307; Spive, 1987: 177). Some of
    these have been modified for analysis of texts in languages other than English,
    such as Spanish text (Parker et al., 2001: 307). According to Carroll (1987: 24),
    in English as first native language readability formulas work to a certain extent,
    since they achieve high correlations with other measures of readability, such
    as reading test scores and experts'' judgments. More recently, McNamara et al.
    (2010: 294) acknowledged that, although word and sentence length alone can explain
    only part of the text comprehension process, readability formulas seem to have
    little validity as indexes of difficulty. In fact, although research has provided
    little support for their grounding in a theoretical framework, readability formulas
    continue to be used around the world in teacher and even test decision-making
    processes (Parker et al., 2001: 307).


    References to readability formulas can be found in many areas and in many languages
    of the professional literature including education, psychology, journalism and
    market industry, to name a few. Drawing on existing literature, there is a great
    amount of studies on L1 readability in various scientific areas, which is beyond
    the scope of the present review to present in detail. However, a few examples
