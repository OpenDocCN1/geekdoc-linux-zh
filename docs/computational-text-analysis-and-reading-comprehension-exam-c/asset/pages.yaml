    conventional readability measures, because it succeeds in examining deeper linguistic
    text features, such as semantic relatedness and word sense associations, and eventually
    matches this textual information to the background knowledge of the reader (Crossley
    et al., 2008a: 480; McNamara et al., 2011: 380). As Crossley (2007: 197; 2008:
    476) repeatedly argued, Co-Met is well-suited to address many of the criticisms
    of traditional readability formulas, because the language metrics it reports on
    text-based processes and cohesion features that are integral to cognitive processes,
    such as syntactic parsing and meaning construction (Perfetti, 1992: 146; Rayner
    et al., 2011: 116).


