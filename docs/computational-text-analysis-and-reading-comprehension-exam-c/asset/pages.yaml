    # 4.4.4 Propositional Idea Density


    Although a number of theories on text comprehension, in which different parts
    of the reading process are described, Kintch and Dijk''s (1978: 365–70) theory
    for the representation of meaning in knowledge and memory has been amongst the
    most influential ones in discourse processing. In 1988, Kintch extended the theory
    with the construction-integration model (Kintch, 1988: 165–8), which he followed
    up by an updated version ten years later (Kintch, 1999: 49). According to this
    theory, text comprehension is the active process of constructing mental representations
    of the text information mainly by building between two different levels of representation,
    making the abstract base and the situation model (Kintch, 1998: 49–52; Kintch
    & Dijk, 1978: 365).


    The text base, which forms the surface structure of a discourse, is interpreted
    as a set of propositions, i.e ideas or concepts that can stand alone as assertions
    (ibid: 367). Propositions are, thus, the building blocks of text processed by
    the reader in order to create a meaningful representation of the information (Kintch,
    1998: 54). A reader is not, however, ensured a deeper understanding of the text
    by simply knowing its information at the level of the text base. Generally, the
    reader must establish links from his or her own knowledge and experience to make
    the text structure coherent and interpret it in a meaningful way (ibid: 51). This
    inferential activity in Kintch''s second level of representation, namely the situation
    model that incorporates personal knowledge about the language, the world and the
    specific communication situation (ibid: 365). Such sources of information may
    all be needed to complement the textual information and transform what by itself
    is only an isolated memory structure into something that relates to and is integrated
    with the reader''s personal store of knowledge and experience (Kintch, 1998: 167–8).'
