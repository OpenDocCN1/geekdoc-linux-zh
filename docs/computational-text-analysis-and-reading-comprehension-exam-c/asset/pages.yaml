    # ### 3.4.3 Piloting the KPG English Survey Questionnaire


    Once the KPG English Candidate questionnaire was designed, a thorough piloting
    was carried out, in order to refine questions that respondents might have difficulty
    in understanding or could interpret differently than intended and ensure that
    all questions could yield answers relevant to the purposes of the survey (Bell,
    2005; 11; Cohen et al., 2007: 173; Denzin, 2009: 112; Dörney, 2007: 75; Gall et
    al., 2007: 435; Krosnick, 1999a: 541; Munn & Driver, 2004: 22; Wiersma, 2008:
    171). Pretesting of questions is especially important, when researching populations
    that relatively little is known or who are likely to be sensitive to failings
    of questionnaire design (Bell, 2007: 461; Burgers et al., 2000: 71). KPG test-takers
    fell into these categories, because no other survey had been previously issued
    to this target population and thus, no information was available about how the
    question-answer model would apply to them.


    Most importantly, when a closed and structured questionnaire is used, "it needs
    to be piloted and refined for its final version to contain a full range of responses
    as can be reasonably foreseen (Cohen et al., 2007: 248). Moreover, since a rating
    scale system was employed, piloting was particularly useful in refining questions
    and deciding on the data classification system (Cohen et al., 2007: 255; Wiersma,
    2008: 177). In general, the piloting procedure consisted an important stage of
    the KPG English survey and is believed to have increased the content validity,
    reliability, and practicality of the instrument since, amongst other things, it
    gave us the opportunity to clear the clarity of the questionnaire and eliminate
    ambiguities or difficulties in wording, to test questions for their interestingness
    to respondents and reduce redundant ones, to gain back on the ordering and numbering
    of response categories and get an estimate of the time needed to actually complete
    the questionnaire, so to take measures against prospective respondents experiencing
    fatigue and refusing to fill in the questionnaire (verse & Presser, 1994: 137;
    Drummond et al., 2008: 181; Locke et al., 2004: 119; Munn & Driver, 2004: 22;
    Velez & Ashworth, 2007: 73; Verma & Mallick, 1999: 120). After all, as Oppenheim
    (2001: 254) artfully pointed out "since there is no way to check what the respondents
    are telling the truth... a straightforward way to circumvent this issue is to
    run a pilot",


    With specific reference to the KPG English Survey, the nature of its design required
    the questionnaire to be issued twice a year to enable the comparative'
