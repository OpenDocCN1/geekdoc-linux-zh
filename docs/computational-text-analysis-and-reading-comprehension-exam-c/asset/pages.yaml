    between the two levels, the independent samples t-test showed that B2 contained
    a significantly higher percentage of question marks (t=2.303, df=46.905 r=0.32,
    p=0.026) and second person personal pronouns (t=2.513, df=48.641, r=0.34, p=0.002),
    which strengthens the view that lower level tests appeared to be more informal,
    and thus, more than advanced ones.


    An additional indicator of informal reader could reflect intimacy from the part
    of the writer is related to the presence of words that describe affective processes
    such as positive and negative emotions. In the present research, the percentage
    of emotions in KPG reading tests was estimated through three indices, i.e. total
    percent of affective processes and percent of negative emotions. Across the levels
    comparison revealed significant differences for two of these measures, with B2
    texts containing a significantly higher proportion of words related to affective
    processes as a whole (t=2.200, df=55.983 r=0.33, p=0.032) and to positive emotions
    in particular (t=2.462, df=48.601 r=0.33, p=0.016). To sum up, this part of analysis
    focused on more cognitively-based indices brought to our attention four more variables,
    i.e. words expressing certainty, inclusive processes and positive emotions, that
    need to be carefully considered during the text selection process given their
    impact on distinguishing B2 from C1 reading comprehension texts.


