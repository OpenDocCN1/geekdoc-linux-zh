    # 4.1.8 Psycholinguistic Processes Analysis


    The relationship between text difficulty and word units that refer to significant
    cognitive processes was investigated through six word categories quantitatively
    assessed using LIWC2007. The categories included words that express intent (e.g.,
    think, know, believe), causation (e.g. because, effect), certainty (e.g. certainly,
    always, never), inhibition (e.g. block, stop, constrain), inclusion (e.g. and,
    with, include) and exclusion (e.g. but, without, exclude). The analysis showed
    a similar proportion of perception words across all levels, but a higher proportion
    of causation (Mean=1.95, SD=1.35) and certainty (Mean=1.29, SD=0.64) in B2 texts
    were found to reflect writers'' tendency to clarify events. The other hand, C1
    texts were found to contain more inclusive (Mean=4.76, SD=1.05) and exclusive
    (Mean=1.77, SD=1.02) words, which could be an indication of writers'' intention
    to include more information while at the same time helping readers in making the
    necessary distinctions during their comprehension process. The results of the
    independent samples t-tests confirmed the statistical importance of some of these
    contrasts, since significant differences were found for the two of measures, certainty
    (t=2.988, df=61, r=0.36 p=0.004) and inclusive (t=-2.983, df=61, r=0.36 p=0.002)
    words. The presence of a significantly higher number of certainty words in B2
    texts could be interpreted as an indicator of reduced text difficulty, such word
    units could have helped readers avoid misunderstandings and properly decode relevant
    information, whereas the significantly higher proportion of inclusive words in
    C1 texts could have raised their complexity by increasing their density of information.


