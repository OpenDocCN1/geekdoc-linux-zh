    # 3.3.2 Text genre specification


    There is no doubt that apart from their robustness, shallow readability metrics
    also fail to recognize that different genres present different problems to groups
    of readers (McCarthy et al., 2006c: 191; van den Brink et al., 2002: 131). For
    example, research has shown that science texts are generally more difficult to
    process, due to their complex rhetorical organization, whereas narrative texts
    that usually present a series of events in chronological order are less demanding
    in short-term memory (Graesser et al., 1980: 148–9; Graesser et al., 2002: 244–5;
    Kozminsky, 1977: 487; Thorndike, 1977: 88). More recently, Best et al. (2008:
    152–3) du Coh-Met to compare sixty-third-graders'' comprehension of narrative
    and expository texts and that children with low levels of knowledge were more
    inclined to have more comprehension problems with expository than narrative texts.
    Most importantly, although it is widely accepted that each genre is composed of
    an underlying and diverse set of characteristics, McCarthy et al. (2009: 49) demonstrated
    that any given text is about 83% homogeneous in terms of genre, a finding that
    made possible the mathematical evaluation of the degree to which a text belongs
    to a specific genre, i.e. presents a higher number of predefined text characteristics,
    and further led to the creation of the Genre Purity Assessment Tool (GPAT) (https://umdrive.memphis.edu/n)
    to automatically assess genre features and categorize text into one of two major
    categories, expository or narrative one (McCarthy, 2010: 242).


    In simple terms, expository texts cover scientific material that is factual or
    informational, as in the case of a textbook or encyclopedia article, and are likely
    to feature more complex sentences and low-frequency words. On the other hand,
    narrative texts are mainly likely to describe fictional or actual events, as in
    the case of a story or a news article, and are more likely to contain temporal
    and space particles (Durán et al., 2007: 221; Graesser et al., 2004: 195–6; McCarthy,
    2010: 242). There is no doubt that there are many different categories of genre
