  md: '# # 2. Literature Review


    # ## 2.1 Introduction


    This chapter provides a review of pertinent research literature in the field of
    foreign language reading comprehension and testing from a critical perspective
    discusses the strengths and limitations of reported studies on text and reader
    variables. To begin with, in the past, attempts to solve the problem of defining
    text difficulty involved the classification of passages on the basis of measures
    of readability (Meyer & Rice, 1984: 319–20). Klare (1980 cited in Leong et al.,
    2002) proposed a basic model of the significant variables that influence overall
    reading performance, according to which both the readability level and content
    of the material are important factors that should not be ignored during the text
    selection process.


    According to Leong et al. (2002: 126), based on Klare''s model, a distinction
    can be drawn between comprehensibility and readability. Comprehensibility is reader-centered
    and includes reader characteristics like reader competence and reader motivation,
    whereas readability is text-centered and deals with the text is written and presented
    to the reader (ibid: 126). The term readable, as defined by Klare (1984), “may
    refer to any of three characteristics of reading: a) legibility of either the
    handwriting or the typography, b) ease of reading, owing to the interest value
    of writing and c) ease of understanding, owing to the style of writing...although
    usage now clearly favors the third meaning, especially in the field of reading”
    (ibid: 681). In simple terms, readability is mainly used nowadays to refer to
    the ease of reading, “which may be attributable to the quality of the document
    in structure of the words and sentences and also the legibility of the content”
    (Leong et al., 2002: 126). Thus, text comprehensibility considers the influence
    of reader attributes, whereas readability describes the influences of text attributes
    on the comprehension process. So, in order to improve text comprehensibility,
    either the activities of the reader have to be adapted to the text, or the attributes
    of the text be better matched to the reader (Lehner, 1993: 552).


    In the present research, the focus on readability will be related to measuring
    the level of text difficulty, using the term to refer to both the syntactic and
    semantic features of texts, whereas the comprehensibility will be employed when
    investigating reader variables like topic preference or familiarity. Echoing Klare,
    Chall and Dale (1995: 80) proposed a comprehensive definition of readability as
    “the sum total-including the interactions- of all elements within'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'a given piece of printed material that affect the success of a group of readers
    with it. The success is the extent to which they understand it, read it at an
    optimal speed, and find it interesting”. As Debeaugrande and Dressler (1981: 213)
    explained, “readability must therefore not be defined as the expenditure of the
    least effort, but as the appropriate proportion between required effort and resulting
    insights”. The concept basic readability research has, thus, been the quest for
    greater understanding and greater accuracy and efficiency in the measurement of
    text difficulty, by studying the relationship between text features, such as words
    or sentences, and text difficulty demonstrated through comprehension performance,
    reading rate or experts’ judgment of difficulty.


    # 2.2 Readability Formulas


    Readability or difficulty has been and continues to be an area of concern for
    all who need to establish the appropriacy of a given text for any pedagogical
    purpose (Brahman & Villaume, 2002: 439; Fry, 2002: 286; Fulcher, 1997: 498; Hatcher,
    2000: 6). However, historically, these concerns have been practically than theoretically
    addressed. At the most basic level, teachers have long recognized that giving
    their students reading material that is too difficult can be both motivating and
    damaging to the learning process. Similarly, providing readers with texts that
    are too difficult or too easy to process can affect their performance and contaminate
    results. The accumulated evidence now clearly supports the notion that improved
    readability can increase readers’ overall comprehension and retention, along with
    their reading speed (Guillemette, 1989: 149). Likewise, the impact of textbook
    readability on students’ performance has been repeatedly emphasized and differences
    in readability are often a key variable cited by educators in the text selection
    process (Chimbombo, 1989: 255; Flory et al., 1992: 152; Leong et al., 2002: 130;
    Mesmer, 2005: 2; Oakland & Lane, 2004: 9; Read, 2001). In addition, a range of
    reader factors that affect the reading process have also been recognized, such
    as motivation, background knowledge and previous reading experience, but, as these
    variables are essentially beyond the control of the researchers, it is facets
    of the text that have received the most attention.


    More specifically, over the last sixty years, many researchers have been concerned
    with the features that make a text easier or more difficult to comprehend in order
    to adjust text difficulty to the intended readership (Chall et al., 1996: 8–9;
    Fulcher, 1997: 498; Lin et al., 2002: 187; Meade & Smith, 1991: 157). To this
    end, readability formulas, i.e. statistical tools that can be used as predictive
    measures of text complexity to a particular group of readers, have been developed'
  merge: -1
  pgno: 35
