  md: '(ibid: 293). In other words, texture "expresses the fact that it [the text]
    relates as a whole to the environment in which it is placed" (ibid: 293). This
    textual unity is realized by the cohesive relations in the text. Thus, cohesion
    accounts for how different linguistic elements operate in tandem to construct
    a meaningful interpretation of discourse (ibid: 4). Cohesion, then, allows readers
    to sense a unity of purpose from structurally independent propositions. Cohesion
    does not account for what a text means, but rather how the text is constructed
    as a semantic edifice (ibid: 26).


    Halliday and Hasan''s model of text cohesion consists of a description of various
    types of relations or ties, which are central in creating semantic relations between
    two or more clauses or within independent elements in the text (Ben-Anath, 2005:
    2; Mosthenthal & Tierney, 1984: 241). To be more specific, each specific tie in
    a text is an instance of cohesion. What all ties have in common, in other words
    what makes them, is the property of signaling that the interpretation of cohesion
    in any given instance depends on something else. In other words, the actualization
    of cohesion is not merely on the presence of one specific linguistic element but
    also on the presence of some other element that resolves the presupposition set
    up by the former (Halliday & Hasan, 1976: 13). Halliday and Hasan proposed five
    types of ties that not only account for the essential semantic relations in a
    text, but also provide a practical means for describing and analyzing texts: (a)
    reference, in which an element needs for its interpretation to be related to another,
    class of things, place or time; (b) substitution, where an item is replaced by
    another term; (c) ellipsis, in which an item is omitted but understood in context;
    (d) conjunction, and (e) lexical cohesion, in which an item is linked together
    based on their semantic relations, and which it is either repeated or replaced
    by a synonym or a superordinate (ibid: 13).


    A major form of cohesion is referential: that is, a word is used which cannot
    be interpreted semantically in its own right, but must be evaluated by making
    reference to an element elsewhere in the text or in the context of communication
    (Eggins, 1994: 95; Halliday & Hasan, 1976: 31). Functionally speaking, there are
    three general types of referencing: homophoric referencing, which refers to shared
    information through the context of culture, exophoric referencing, which refers
    to information from the immediate context of situation outside the text, and endophoric
    referencing, which refers to information that can be retrieved from within the
    text (Eggins, 1994: 96; Halliday & Hasan, 1976: 33). It is this endophoric referencing,
    which is the focus of cohesion theory. Endophoric referencing can be divided into
    three areas: anaphoric, cataphoric, and esophoric. Anaphoric refers to any reference
    that "points backwards" to previously mentioned information in text and that is
    the type of reference that is most relevant to'
