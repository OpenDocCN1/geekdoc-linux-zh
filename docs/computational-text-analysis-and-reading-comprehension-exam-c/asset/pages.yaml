    urbanization (Groves, 2004: 664; Pickery & Carton, 2008: 83), 50% of the participants
    were randomly drawn from the five most densely populated cities in Greece, which
    according to the most recent official records of the Greek National Statistics
    Service were Athens, Thessaloniki, Patras, Larisa and Herakion, 25% from rural
    areas and the remaining 25% from the Greek islands. To be more specific, once
    the selection parameter was set, the population was divided into three homogeneous
    groups, with each group containing subjects with similar characteristics in terms
    of place of residence, and then a random selection of subjects within each group
    was made (Bryman, 2008: 508; Marshall, 1997: 58;'
