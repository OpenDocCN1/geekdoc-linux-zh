  md: '# 3. Research Methodology


    # 3.1 Introduction


    This chapter includes a description of the research methodology, materials and
    procedures employed for the collection of necessary data in the present study.
    Such a description is imperative in order not only to demonstrate and justify
    their appropriateness in terms of validity and reliability, but also to facilitate
    replication of the study with another sample or in another context, providing
    prospective readers with sufficient information about the method used and the
    analysis undertaken, in accordance with the aims and research questions of the
    study at hand. Thus, in the following sections the steps followed for the design
    or employment of various data collection instruments, namely the automated text
    processing tools and test-takers'' questionnaires, are presented, while their
    validity of usage is justified by making reference to pertinent research.


    # 3.2 The KPG English Reading Corpus


    The text variables for thorough investigation in the present research were chosen
    for both practical and theoretical reasons. First, from the practical standpoint
    of comparability, it was important to establish whether particular features, whose
    presence in the KPG English language texts might introduce constructive relevance
    to test scores. If this turned out to be the case, then steps could be taken to
    incorporate such factors into subsequent revisions of the text selection guidelines.
    At the same time, from a theoretical perspective, the study presented an opportunity
    to investigate some of the hypotheses that have been advanced in the research
    literature concerning a range of variables that affect second language reading
    comprehension, and further explore their impact on actual exam performance. Most
    importantly, given the inherent complexity of the reading process and the fact
    that the ultimate purpose of the present study has been the creation of a mathematical
    model capable of automatically estimating text difficulty and assigning levels
    to texts in a consistent and reliable way, in accord with the purposes of the
    KPG language exams in English, it was imperative to include a comprehensive list
    of text features, in order to minimize the risk of omitting variables that have
    contributed to the predictive capacity of the final model. Given that previous
    research failed to produce a definite set of quantifiable text variables, no decision
    was a priori made in terms of their expected significance.'
