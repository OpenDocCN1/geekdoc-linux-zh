    examination periods. The piloting procedure consisted of three phases. In the
    first phase four experts in the field of testing and assessment were kindly asked
    to evaluate various aspects of the KPG English Survey questionnaire, such as the
    comprehensibility of its questions along with their wording. Based on their feedback,
    a revised version of the questionnaire was then prepared. As Bell (2007:467) explains,
    the application of several minds to the problem of questionnaire design can be
    invaluable, as it is impossible for one researcher to think through every possible
    interpretation a respondent might apply to a question or predict any difficulties
    they might have when completing a questionnaire. Thus, bringing together a group
    of people with a combination of questionnaire-design and subject-specific expertise
    was useful for increasing the overall validity and reliability of the instrument.


