    Descriptive statistics showed that on the average B2 test-takers'' age in all
    five exam periods ranged from 12 to 62 years. Although age values were scattered,
    indicating lack of normal distribution, most values fell within the range of 15–20
    years, with 15 being the most frequent age for test-takers sitting for the B2
