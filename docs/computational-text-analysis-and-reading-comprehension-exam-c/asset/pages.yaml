    in any computer program that includes basic mathematical tools, such as Microsoft
    Excel 2007, for interested users to insert appropriate values and automatically
    obtain a text difficulty score.


    # 4.3 Model Validation Procedure


    No matter the various r-squared statistics and additional tests used to check
    model variance, no regression model can be considered statistically reliable and
    practically useful, it proves itself successful in predicting similar features
    of a different sample from the one used to create it. In other words, for a model
    to be generalized, it should be capable of accurately predicting the same variable
    from the same set of predictors in a different group. Thus, if our model manages
    to classify a new set of texts into intermediate (B2) or advanced (C1) ones based
    on their text complexity features, we would be in a better position to argue that
    the newly created L.A.S.T. Difficulty Index is rather likely to successfully assign
    levels to a wider range of texts, besides the ones used in the'
