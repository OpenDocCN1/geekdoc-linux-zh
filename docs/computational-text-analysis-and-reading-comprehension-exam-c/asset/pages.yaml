    (Block, 1986: 465; Phakati, 2003b: 29; Williams & Morgan, 1989: 218). Cognitive
    strategies include making predictions, translating, summarizing, using prior knowledge
    or experience, applying grammar rules and trying to guess the meaning from a given
    context (Phakati, 2003a: 651). On the other hand, metacognitive strategies refer
    to learners'' actions of previewing tasks to develop directions of what needs
    to be done, as well as actions undertaken to check, monitor and evaluate their
    thinking and reading performance (Phakati, 2003a: 651). Metacognitive strategies
    are, thus, conceived as higher deliberate mental processes that provide a cognitive
    management function in language use and other cognitive activities. As Phakati
    (2003a: 651) explained, "the basic concept of metacognition is the notion of thinking
    about thinking". Such a perspective is beneficial for research purposes in that
    not only metacognitive thinking can be perceived as potentially controllable by
    the test-takers, but it can also be conceived as potentially reportable, thereby
    accessible to the researcher (Phakati, 2003b: 29–30).


    In recent years, discussion of the role of consciousness in foreign language learning
    has led researchers to further suggest that, if learners cannot identify any strategy
    associated with a specific task as has become unconscious, then the behaviour
    would be referred to as a common process or skill, not a strategy (Cohen, 1998:
    92; Williams & Morgan, 1989: 223). Ellis (1994: 77) further argued that, if strategies
    become automatic that learners are no longer conscious of employing them and they
    cannot be accessible for description, they lose their significance as strategies.
    On the other hand, Purpura (1999: 23–4) pointed out that a lack of observable
    behavior in the eye of the researcher does not necessarily entail a lack of mental
    processing. In fact, even within individuals, consciousness about perceived strategy
    may exist ever differently, some strategies may have become processes for some
    individuals but remained strategies for others.


    In addition, a variety of factors have been found to affect the selection of test-taking
    strategies used by various respondents, such as the level of linguistic difficulty
    of the test, its subject matter, the linguistic level and content of the questions,
    as well as the location and nature of the correct answers and that of the distractors
