    assist language testers to accommodate individual test-takers'' needs, given that
    males and females deserve an equal chance of success when sitting for a specific
    exam.


    Despite the importance of detecting sex-based bias in foreign language reading
    performance, the relevant literature is rather limited and its findings from consistent.
    For example, while Wen and Johnson (1997: 27) reported that females outperformed
