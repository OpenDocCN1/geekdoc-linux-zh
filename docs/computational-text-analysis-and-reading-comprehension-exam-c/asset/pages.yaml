    on test difficulty higher than expected. This result is concomitant with research
    frequency on which longer words are less frequently used and thus, more difficult
    to process shorter ones, which cover an extensive part of everyday speech due
    to their simpler composition (Harrison, 1999: 429; Horning, 1993: 27; White, 2011:
    87). In addition, two indices related to text abstractness, i.e. minimum concreteness
    of content words (r=.638, p<0.05) and mean hypernym value of nouns (r=.564, p<0.05),
