    # 3.3.8 Syntactic Complexity Indices


    Syntactic complexity involves a number of metrics that assess the syntactic position
    of sentences. Sentences with difficult syntactic composition are structurally
    dense, potentially ambiguous and have many constituents (Crossley et al., 2007a:
    21; Graesser et al., 2004: 198; Louwerse & Mitchell, 2003: 233; McNamara et al.,
    2010: 293; Perfetti et al., 2005: 227–8). Based on the Charniak syntactic parser,
    syntactic complexity is measured by Coh-Metrix through a number of metrics that
    assess both syntactic composition and the frequency of syntactic classes or constituents
    in a text. For the purposes of the present research, noun-phrase density, which
    consists of the mean number of modifiers per noun-phrase, was automatically estimated.
    Modifiers are optional elements describing the properties of the head of a phrase,
    such as adjectives that modify heads of noun-phrases, and adverbs that modify
    heads of verb-phrases (Graesser et al., 2004: 198). A second metric employed was
    the mean number of high-level constituents, namely verb-phrases per word. Higher
    level constituents are sentences and embedded sentence constituents and their
    measurement is an indicator of syntactic complexity, since structurally dense
    sentences tend to have more high-level constituents per word (Graesser et al.,
    2004: 198). In addition, Coh-Metrix was used to compute the incidence of nounphrase
    constituents and negations per 1000 words as well as the mean number of words
    that appear before the main verb, since sentences characterized by a higher number
    of words before the main verb are expected to be more demanding on working memory
    (Graesser et al., 2004: 197–8).


    Another measure of syntactic complexity consists of the incidence of word classes
    that signal logical or analytical difficulty such as connectives and conditionals
    (Graesser et al., 2004: 197–8). Connectives are connected on two dimensions in
    Coh-Metrix 2.1. On one dimension, the extension of the situation described by
    the text is determined by the incidence of positive connectives, whereas on the
    other dimension the presence of negative connectives, synonymous with adversative
    relations as defined in Halliday and Hasan (1976: 246–250; Louwerse, 2002: 294;
    Sanders & Noordman, 2000: 44). Coh-Metrix provides incidence scores for the set
    of connectives and logical operators'
