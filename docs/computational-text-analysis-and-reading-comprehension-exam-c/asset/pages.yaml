    # 2.4.1 Lexical Density


    According to Halliday (2002: 242; 2004: 654), a characteristic of written language,
    which makes it more abstract and as complex than spoken one is its being lexically
    dense, that is, information expressed through a large number of lexical items
    is packed into fewer clauses in the spoken language. As Halliday defines it "lexical
    density is a measure of the density of information in any passage of text, according
    to how tightly content words such as nouns, adjectives, main verbs and adverbs
    have been packed into the grammatical structure" (1985: 64). Content words are
    those items, which operate in an open system and function in lexical sets as the
    main carriers of information and not in'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'grammatical systems (Halliday 1985: 63; Halliday & Hasan, 1976: 274). In simpler
    terms, content words are those representing the ideational content of the text
    such as things, happenings, participants, places, states, feelings, etc., whereas
    grammatical items (function words) act in clause systems in the language and are
    part of a finite set of terms like determiners, pronouns, prepositions, conjunctions
    and auxiliary verbs (Eggins, 1994: 60–61). Thus, by investigating lexical density,
    we could have a better notion of information packaging, as texts with a high proportion
    of content words are expected to contain more information than texts with a high
    proportion of function words. According to Halliday (1985:64), lexical density
    corresponds to "the number of lexical items, as since lexical density adds to
    complexity, it can be hypothesized that a text with higher lexical density will
    be more difficult to comprehend and recall than one with less packed information
    (Harrison & Bakker, 1998: 128).


    In fact, such a hypothesis was confirmed not in Shokprour''s study but in a small-scale
    pilot study carried out by Harrison and Bakker (1998: 121). More specifically,
    the two researchers examined if there is any relationship between lexical density,
    conventional readability scores and perceived text difficulty; by comparing native
    speakers'' perceptions of the difficulty of pairs of English texts with text estimates
    provided by calculating lexical density and by applying three readability formulas,
    namely the Flesch Reading Grade, the Flesch-Kincaid and the Gunning-Fog Index
    (ibid: 126–7). Based on readers'', regression analysis revealed that the lexical
    density of a text was a better indicator of its scores assigned by many of the
    more common readability formulas (ibid: 131). Harrison and Bakker (1998: 131–2)
    concluded by pointing out the need for a much more comprehensive research in order
    to determine whether lexical density could reliably and consistently predict reading
    difficulty not only for native speakers but also for foreign language learners
    of English.


    # 2.4.2 Grammatical Intricacy


    Apart from lexical density, another lexicogrammatical feature that according to
    systemic functional grammar can contribute to the complexity of texts is grammatical
    intricacy, that is, the number of clauses linked to one by some kind of logic-semantic
    relation (Eggins, 1994: 61; Halliday, 2004: 373). It is supposed that any structure
    consisting of one clause, without relation with other clauses, is less intricate
    and therefore easier to handle than those with more than one clause related together
    by dependency (Shokprour,'
  merge: -1
  pgno: 63
- img_proc: true
  md: '1996: 86). As Halliday (2004: 365) explained, "semantically, the effect of
    combining clauses into a clause complex is one of tighter integration in meaning".


    In fact, along with lexis, the effect of syntax on language processing has been
    intensively studied in a number of L2 studies that have reached the conclusion
    that texts with complex sentence structure tend to be more difficult for readers
    to process (Alderson, 2000: 68, Berman, 1984: 140; Perfetti, 1997: 339). For example,
    Brauntmeier (2005: 46) reported a significant effect of simplified syntax on reading
    comprehension scores measured via multiple choice and open-ended questions for
    two groups of EFL users. For both measures, readers of the simplified version
    outperformed their counterparts, while the addition of sentences hindered the
    comprehension of details more than the overall textual gist (ibid: 46). More recently,
    by using structural equation modelling, Shiotsu and Weir (2007: 121) also observed
    that syntactic knowledge played a greater role than lexical knowledge in accounting
    for variance in L2 English tests.


    Another feature, which contributes to the compactness of information and therefore
    the structure of nominal groups, a term used to describe an experiential structure
    that has the function of specifying a class of things and any category of membership
    within that class (Halliday, 2004: 312). According to Halliday, the embedding
    structure of nominal groups, pre-modifier and post-modifier that turn consists
    of embedded clauses and phrases, makes the packaging of information possible,
    while carrying the main burden of lexical content of the discourse (ibid: 312).
    Since the nominal group structure can contribute much to the complexity of written
    language, for the purposes of the present research the complexity of nominal groups
    present in KPG reading texts was estimated as the mean number of modifiers per
    non-phrase, automatically computed Coh-Metrix 2.1.


    To sum, despite the attentions mentioned above in exploring the effect of syntactic
    variables in text comprehension, it is far from straightforward which structures
    learners will find challenging in test sources, syntactic complexity has not been
    operationally defined (Rimmer, 2006: 498). The Common European Framework of Reference
    for Languages (CEFR) has described rather than defined theoretical model or an
    elaboration of how a complex sentence can be identified (Council of Europe, 2001:
    113). There is no doubt that, since the CEFR as a reference work has not been
    exclusively for English but is addressed to all European member countries, it
    would not have been possible to include detailed descriptions for individual languages.
    However, the problem for testers remains, since they do not have available a robust
    theory-driven'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'construct of grammar that could be operationalized in concrete testing environments
    (Rimmer, 2006: 506).


    Given this lack, most researchers resort to crude indices of syntactic complexity,
    such as the number of T-units contained in a text or the average number of words
    per sentence (Alderson, 2000: 71). In fact, synthesizing the data from 25 students
    rating the syntactic complexity of written work of advanced level EFL users, Ortega
    (2003: 504) reached the conclusion that, although none of the employed measures,
    i.e. mean length of T-unit, mean length of clause, mean number of T-units per
    sentence, mean number of clauses per T-unit and mean number of dependent clauses
    per clause, were more valid than the others, a specific index, that is, mean length
    of T-unit, did yield statistically significant differences across groups and could
    prove useful in detecting differences in syntactic complexity and even obtain
    a numerical cutoff between proficiency levels.


    Although the attractiveness of Ortega''s finding is obvious, since it favours
    a relatively simple technique of counting words per clauses, it is, nonetheless,
    a crude technique that does not take into account data below or above the clausal
    level. Moreover, by emphasizing sentence length, such an approach accounts for
    the fact that shorter sentences may be grammatically denser, in the sense that
    functional words are omitted in order to pack a lot of information into a limited
    amount of space (Alderson, 2000: 72; Rimmer, 2006: 506). Thus, in the present
    research the grammatical intricacy of KPG reading passages has been measured based
    on both surface, i.e. T-units, words per sentence, etc., and deeper feature features,
    such as content word overlap as well as syntactic and semantic similarity across
    sentences and paragraphs.


    # 2.4.3 Lexical Diversity


    Lexical diversity, roughly defined by Durán et al. (2004: 220), refers to the
    range of vocabulary displayed in the discourses and has been repeatedly mentioned
    in literature as a predictor of learners'' general language proficiency (c.f.
    Conrad, 1996: 315; McCarthy & Jarvis, 2007: 459; Read, 2000: 200–205; Singh, 2001:
    252; Zareva et al., 2005: 583–4) and an essential indicator of the quality of
    their writing (c.f. Carrell & Monroe, 1993: 160; Laufer & Nation, 1995: 316–7)
    and speaking production (c.f. Jarvis, 2002: 74–5; Malvern & Richards, 2002: 94–5;
    O''Loughlin, 1995: 217), but has not yet been extensively employed to assess the
    readability of written texts. Apart from lexical diversity, various similar terms
    such as lexical richness (Daller et al., 2003: 197; Tweedie & Baayen, 1998: 323;
    Singh, 2001: 251), lexical density (Backman, 1978: 1; O'' Loughlin, 1995: 217),
    lexical sophistication'
