    # 5.2.2 KPG test-takers’ personal characteristics & perceived reading difficulty


    Statistical analysis revealed a number of significant correlations between test-takers’
    average self-reports on text and difficulty and their personal characteristics,
    i. age, sex, place of residence, years of learning English and KPG exam preparation.
    To begin with, Pearson correlation coefficients showed that, at a 0.05 level of
    significance, the older B2 test-takers were, the higher the possibility to find
    the Reading Comprehension and Language Awareness test paper difficult (r=.527,
    p<.05) and the items more complex to respond than expected (r=.531, p<.05). At
    the same time, older B2 test-takers on the average appeared to be less prepared
    for the specific exam (r=.998, p<.05). This result could partially explain their
    feelings of increased difficulty; while it may reflect older test-takers’ need
    to certify their general English language knowledge, without attending an exam
    preparation course beforehand.


    A similar pattern of reactions was observed in relation to C1 test-takers, whose
    mean perception of overall test paper (r=.753, p<.05) and item (r=.690, p<.05)
    difficulty also increased in accordance with their age. However, since older test-takers
    on the average were also found to be prepared for the C1 exam (r=.871, p<.05),
    it is this lack of familiarity could have contributed to their higher levels of
    perceived difficulty. Without doubt, this high correlation lends credence to our
    original assumption that familiarization with the format and content of the specific
    exam could not alleviate test-takers’ feelings of anxiety, but also increase their
    ability to cope with exam requirements in the best possible way.


    Data analysis further showed that, as years of learning English increased, so
    did B2 test-takers’ positive responses on the average they liked the topics of
    the reading texts much (r=.594, p<.05) and found the test language less complex
    to comprehend (r=.699, p<.05) and the tasks easier to respond to (r=.715, p<.05).
    Similar correlations were found for C1 test-takers, with those learning English
