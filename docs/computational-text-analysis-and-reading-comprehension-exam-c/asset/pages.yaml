  md: 'Finally, in order to explore whether any significant relationships did between
    KPG test-t’ average self-reports on text complexity and the mean frequency values
    of perceived strategy, Pearson correlations were calculated. The statistical analysis
    revealed that B2 test-takers on the average reported using different strategies
    given their perceptions of text and task difficulty, and appeared to have processed
    texts in the following way. The less difficult a text was, the less B2 participants
    resorted to “translating” (r=.995, p<0.05), “rereading” (r=.716, p<0.05) or “guessing
    the meaning of unknown words” (r=.976, p<0.05). However, when the text seemed
    more difficult than expected, B2 test-takers on the average reported making use
    of context-specific strategies such as “guessing the meaning of unknown words”
    (r=.979, p<0.05) or “translating in L1 to understand meaning” (r=.950, p<0.05),
    “combining information from different parts of the text” or “reading the text
