    from the verb itself. Moreover, the determiners (a, an, and the) are not considered
    separate propositions, and modal verbs are not counted as propositions, unless
    they are negative (Covington, 2008: 202). The copula is counted as a separate
    proposition, when it introduces a noun phrase but not an adjective phrase; that
    is, the copula does not add a proposition to the one already signified by the
    adjective (Brown et al., 2008: 543–4). Infinitive forms of a verb are counted
    separately from the main verb, if they have direct objects, these are included
    in the same proposition (Covington, 2008: 202). For ditransitive verbs that require
    two objects (typically referred to as direct and indirect one), the indirect object,
    which is the recipient of an action, is counted separately and, whenever possible,
    is rephrased as a prepositional phrase. In sum, propositional idea is deproximated
    by the number of verbs, adjectives, propositions and conjunctions divided by the
    total number of words in a text (Brown et al., 2008: 540; Snowdon et al., 1996:
    529). In the present research, looking comprehension from the level of propositional
    density is expected to serve as a complementary measure of text complexity, as
    propositional density remains largely independent of surface factors and can provide
    an indication of how loaded in a text is.


