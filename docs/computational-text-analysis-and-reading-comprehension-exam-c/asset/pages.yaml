    All in all, although it should be admitted that reader variables as those mentioned
    are essentially beyond the control of test designers, efforts should be made to
    alleviate their effects and improve test-takers'' chances for a successful performance,
    by not only acknowledging their existence but also by paying careful attention
    to the selection of tests, especially when using authentic materials (Saito et
    al., 1999: 216; Ungerlieder, 2003: 122).


    # 2.6 Concluding remarks


    As the reviewed literature has indicated, a variety of reader and text variables
    can have an impact on the reading process and need to be carefully considered
    during the test design and validation process. In relation to text complexity,
    although readability formulas have been extensively applied in the field of foreign
    language teaching and testing, numerous researchers have pointed to their serious
    limitations and repeatedly stressed the need for a more in-depth linguistic analysis
    in order to match individual EFL learners with readable texts and better define
    what sort of text a learner of a given level of language ability should be expected
    to be able to process, when sitting for a specific exam. Nevertheless, in spite
    of this concern, within the file of L2 reading, little attention has been given
    to the empirical validation of readability formulas and even less to developing
    computational measures of text difficulty that would at the same time to be more
    in line with our current knowledge about psycholinguistic models of language acquisition.'
