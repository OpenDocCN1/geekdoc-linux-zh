  md: '# 5. KPG Test-Takers’ Performance & Perceptions: Findings


    The present chapter consists of two main parts that are related in a broader sense,
    i.e. they both refer to KPG test-takers, but are not interrelated in terms of
    analyzed data and reported findings. More specifically, in section 5.1 the impact
    of test variables on the mean reading performance per source of a total number
    of 152,039 B2 and 36,517 C1 test-takers that had taken part in real KPG language
    exams in English over a period of 10 years (2003–2012) is discussed for test constructors
    to become aware of potential bias during the test design and scores interpretation.
    On the other hand, section 5.2 reports on the findings from the RCel National
    Survey and contains information regarding KPG test-takers’ personal characteristics
    such as age, place of residence and time spent in an L2 learning environment,
    as well as their opinions about the lexical complexity of the tasks, the difficulty
    of the tasks, their familiarity with or preference for specific topics and the
    kind of reading strategies they perceived using, while processing a text in the
    context of the specific examination. This section ends by discussing significant
    relationships between a specific set of reader variables and perceived text difficulty.


    # 5.1 KPG Reading Performance & Text Features


    An important part of the present doctoral research involved the investigation
    of relationships between mean reading comprehension scores per text (mean scores
    of the ten reading comprehension multiple-choice questions pertinent to each text
    based on the performance of a specific number of individual KPG test-takers who
    had taken part in each examination period) and textual features present in B2
    and C1 KPG reading texts. To this end, the responses to each set of reading comprehension
    questions per text of a total number of 152,039 B2 test-takers and 36,517 C1 test-takers
    that had taken part in real KPG language exams in English over a period of 10
    years (2003–2012) were analyzed. Due to item-type differences, few B2 texts (i.e.
    “Longleaf Safari Park” were used in May 2006 exam,


    The data regarding KPG test-takers’ exam scores were provided by the Ministry
    of Education to the Director of the KPG Research Team, Prof. Bessie Dendrinos.
    Upon official request, the data were made available to the coordinator of the
    present research, under the specific condition that they are used cordially and
    for the purpose of this research project alone.'
