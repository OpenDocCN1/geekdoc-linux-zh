    The ultimate purpose of my research has not only been to describe, based on empirical
    evidence, the way and extent to which specific variables contribute to English
    texts being perceived as easier or more difficult to comprehend EFL test-takers,
    but also to create a mathematical model for automatically estimating text difficulty
    and assigning levels to texts in a consistent and reliable way, in accord with
    the purposes of the exam and the KPG candidature special characteristics. To this
    extent, Bachman''s (1990: 118) model of language ability (later revised in Bachman
    & Palmer, 1996) has been the main source of inspiration. Specifically, by including
    "method facets" as as "trait facets" in his discussion of language ability, Bachman
    draws our attention to a range of factors that affect test performance and, therefore,
    jeopardize test quality. To Bachman, method facets can be divided into the following
    categories: 1) the nature of the input received by the test-taker, 4) the nature
    of the expected response to that input and 5) the relationship between input and
    response. The present study has focused on the third and fifth of these facets,
    namely the nature of the input and the interaction between input, i.e. the reading
    text, and response, i.e. exam scores to reading comprehension tasks, because both
    of these facets have been repeatedly found to play a significant role in reading
    comprehension tasks.


    KPG is a relatively new multi-level multilingual suite of national language examinations
    developed by teams of experts from the foreign language departments of the National
    and Kapodistrian University of Athens and the Aristotle University of Thessaloniki.
    The exams are administered by the Greek Ministry of Education, making use of the
    infrastructure available for the Panhellenic university entrance exams. Despite
    in its infancy, KPG is rapidly gaining acceptance as a high-stakes exam in Greece
    and because of its official recognition by the state, it can influence its future
    prospects for employment and education. Exams for the "big" KPG languages are
    administered twice a year and, since November 2003, more than 200,000 test-takers
