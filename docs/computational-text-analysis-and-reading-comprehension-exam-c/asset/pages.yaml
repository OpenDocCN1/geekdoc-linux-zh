    # 5.1.4 Construct-validity of the KPG language exams in English


    From the list of 135 tests analyzed in the present research, B2 text characteristics,
    i.e. proportion of past tense (r=-.37, p<0.05), frequency of words occurring in
    the fifth band of the BNC corpus (r=.374, p<0.05), proportion of verbs in future
    tense (r=.380, and words expressing agreement (r=.417, p<0.05), and C1 test features,
    i.e. syntactic similarity across sentences (r=.414, p<0.05), percentage of word
    units describing affective processes (r=.432, p<0.05), relativity correlating
    space, time and motion as a whole (r=.475, p<0.05) and space as a specific subcategory
    (r=.434, p<0.05), were found to significantly correlate with mean reading performance
    scores.

    Although these results are suggestive of the well attested association between
    test complexity and reading performance, they also provide strong evidence in
    favor of the construct validity of the KPG language exams in English, since, in
    general terms, the assessment of reading competence was not affected by superficial
    test features, but rather based on a more holistic approach of the reading process,
    during which a range of competencies had to be activated for successful performance
    in the reading comprehension test paper. Moreover, the lack of correlations between
    mean reading comprehension scores and test features confirms the interference
    of additional factors, such as item variables, the exact contribution of which
    warrants further investigation. Most importantly, such a lack demonstrates the
    absence of significant test bias attributed to the nature of the input given that
    no features were found to contaminate reading comprehension results to a significantly
    high extent. Finally, it is notable that, for both levels, discrimination of reading
    competence among Low, Average and High performers was achieved by assessing their
    ability to cope with in-depth lexical, semantic and syntactic features, which
    should be treated as an additional sign of construct validity, both within the
    two specific levels of the KPG language exams in English.'
