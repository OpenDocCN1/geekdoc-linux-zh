  md: 'In sum, propositional density has been recognized as an important source of
    reading comprehension difficulty; yet efforts to assess deeper levels of comprehensibility
    rather than superficial features of text readability have been hampered by computational
    challenges, and until recently, its measurement relied almost exclusively on manual
    readers, whose analysis was susceptible to subjectivity (Horning, 1987: 59–60).
    However, more recently, reproducible automatic measurement has made the application
    of propositional density in a broader range of research areas. Taking advantage
