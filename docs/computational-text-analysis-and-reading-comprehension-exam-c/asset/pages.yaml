  md: '# 4. Computational Text Analysis: Findings


    The present chapter reports on the text analysis results and proposes a mathematical
    formula for automatically estimating text difficulty, based on a specific of lexicographical
    features. To facilitate its processing, the chapter has been divided into two
    parts. The first part delineates text complexity by reporting on the differences
    between B2 and C1 KPG English reading comprehension texts with regard to specific
    linguistic features (see Appendix 10 & 11 for the complete list of text analysis
    results). Following that, the newly created formula that can be used to distinguish
    intermediate from advanced level reading is presented concisely comprehensively
    enough for interested parties to use. To facilitate flow of reading, all tables
    containing statistical information are included in designated appendices at the
    end of the thesis.


    Regarding the statistical processes employed in the present research, it is worth
    mentioning that, in order to avoid contamination of results due to text length
    variation, the frequency counts of all linguistic features are normalized to a
    text length of 100 words. Since machine-generated lexical diversity and richness
    are known to be sensitive to text length, passages with a fixed number of 250
    words were also analyzed to examine differential functioning of the lexical indices
    in these specific texts. No significant functioning of these lexical indices was
    noted as a result of controlled text length. Moreover, due to their disproportionately
    high length, two texts, namely “Bridget Jones’ Diary” that was used in April 2005
    B2 exam and contained a total of 705 words and “Sonia Gandhi’s biography” that
    was used in April 2005 C1 exam and contained a total of 1.032 words, were traced
    as outliers and excluded from further analysis. Thus, the main text analysis was
    based on B3 and B2 and C1 reading comprehension texts used in pat KPG English
    languages. In addition, all percentages are reported as valid percentages with
    missing data excluded. Basic descriptive information is provided through the mean,
    median and standard deviation estimates, which indicate average values and variability
    for each data set. Finally, IBM SPSS 20.0 statistical package data was used to
