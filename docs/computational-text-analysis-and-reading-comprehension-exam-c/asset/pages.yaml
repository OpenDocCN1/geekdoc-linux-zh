    444; Parker et al., 2001: 308; Rumelhart, 1977: 266–8).


    Schemata have also been called “the building blocks of cognition” in the sense
    that we comprehend something only when we can relate the new experience to our
    pre-existing knowledge structure (Rumelhart, 1980: 34). A distinction can be drawn
    between content schemata, i.e. background knowledge of the content of a text,
    and formal schemata, including background knowledge of the language and the linguistic
    conventions, including the rhetorical structures of different types of texts (Carrell,
    1983a: 81; Erten & Razi, 2009: 61). Content schemata can be divided into two types,
    that is, background knowledge and subject matter knowledge, with the former referring
    to the knowledge that may or not be relevant to the content of a particular text,
    the latter being directly related to the text topic (Alderson, 2000: 43–4). Carrell
    (1983a: 89) added that a reader’s background knowledge includes not only content
    and formal schemata, but also sociocultural and general world knowledge.


    A fundamental assumption of the schema-rhetorical view of language comprehension
    is that the process of comprehending a text is an interactive one between the
    reader’s background knowledge of content and the structure itself (Carrell, 1983a:
    82; Carrell, 1985: 727). So, according to this approach, the text does not carry
    meaning but rather guidance for readers as how they should construct the intended
    meaning from their own previously acquired knowledge (Carrell & Eisenhorst, 1983:
    556–7). Since comprehension involves not only the information contained in a text,
    but also the knowledge readers already possess, efficient comprehension requires
    the ability to relate the mental representation to one’s own knowledge (Widowson,
    1984: 225). Comprehending words, sentences and discourse, involves much more than
    just relying on one’s linguistic competence (Allen et al., 1988: 165; Chihara
    et al., 1989: 143; Freebody & Anderson, 1983: 287; Parker et al., 2001: 308; Salager-Meyer,
    2001: 657–8).


