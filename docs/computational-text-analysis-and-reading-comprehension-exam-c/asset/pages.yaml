    Especially in relation to language testing, a number of studies have thought aloud
    protocols (c.f. Anderson et al., 1991: 46–7; Cohen & Upton, 2007: 218–9; Nikolov,
    2006; Storey, 1997: 219) or questionnaires (c.f. Brand-Gruwel et al., 1998: 69;
    Nevo, 1989: 203; Pakhtiti: 2003b: 35; Polizer & McGroarty, 1985: 103; Purpura,
    1997: 293), while trying to provide evidence for the construct validity of the
    examination and get a more in-depth understanding of the difficulties the later
    experience, when coping with a specific task, test designers'' assumptions concerning
    what they are testing often coincide with the actual respondents when taking a
    test (Anderson et al., 1991: 42; Cohen & Upton, 2007: 243; Nevo, 1989: 199; Pakhtiti,
    2003b: 28; Purpura, 1997: 290).


    In general, strategies have been broadly divided into two categories, learning
    strategies and using strategies. Learning strategies are these strategies purposefully
    employed to enhance their language acquisition, whereas strategies purposefully
    employed to enhance performance, such as to complete a language task, to communicate
    with others in the target language or to take a test, are test-taking ones (Phakiti,
    2003b: 28). In other words, test-taking strategies involve learners select to
    apply when solving tasks and can be viewed simply as learner strategies applied
    to the area of assessment (Cohen, 1998: 92). Test-taking strategies, similarly
    to learning ones, are not inherently effective or ineffective, as their successful
    usage depends on whether they are appropriate for a particular task (Nikolov,
    2006: 4). Thus, test-taking strategies are not different from language use, but
    rather belong to a common set of strategies activated at the hand (Cohen & Upton,
    2007: 211; Cohen, 1998: 92; Nikolov, 2006: 5). At times, test-taking strategies
    may constitute short-cuts to arriving at answers, as such not reading the text
    as instructed but looking immediately for the answers to the given comprehension
    questions (Cohen & Upton, 2007: 211). In such cases, the respondents may be using
    test-wiseness to circumvent the need to tap their actual language knowledge or
    lack of it and this way not proceed via the text but rather out (Allan, 1992:
    102; Cohen, 1998: 92; Cohen & Upton, 2007: 211–212). In the majority of testing
    situations, test-taking strategies do not lead to opting out or to using short
    cuts (Cohen & Upton, 2007: 212).


    An additional distinction has been drawn between cognitive and metacognitive strategies,
    with the first being related to test-takers'' ongoing mental activities to use
    their language ability and world knowledge to solve a task and the latter being
    defined as test-takers deliberate behaviors to'
