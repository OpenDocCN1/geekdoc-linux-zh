  md: '# 3.4.2.8 The opening section


    Special attention was paid to the opening section of the KPG English Survey questionnaire,
    since there is increasing evidence that a thoughtfully written introduction can
    be very important in making participants feel at ease with the research and get
    more motivated to complete the questionnaire (Borgers & Hox, 2001: 329; Gall et
    al., 2007: 431; Nachmias & Nachmias, 2007: 182). To this end, the present questionnaire
    opened by introducing the institution organizing the research and briefly its
    importance and benefits for the continuous improvement of the KPG language exams
    was expected to increase respondents'' willingness to take part in the survey
    (Cohen et al., 2007: 124). In fact, a number of studies have shown that response
    rate is positively associated with individuals'' perceptions of the relevance
    of the survey topic to their own lives or their judgment of the general importance
    of the topic under investigation (Clarkberg et al., 2008: 6; 670; Groves et al.,
    2006: 734; Porter & Whitcomb, 2003: 579). The introduction also included a clear
    statement that participation in the KPG English Candidate Survey was voluntary
    and that respondents would remain anonymous and not possible to trace afterwards.
    Providing assurances of anonymity, confidentiality and non-traceability was considered
    necessary for respondents to freely express their opinions on exam difficulty
    and not answer questions in a way they felt would satisfy the researchers (Dörnyi,
    2007: 183; Gall et al., 2007: 431; Krosnick, 1999b: 47; Wiersma, 2008: 179).


    # 3.4.2.9 Questionnaire length & language


    Bearing in mind that questionnaire length can also have an effect on response
    rate, we tried to keep the KPG English Candidate questionnaire as short as possible
    for participants not to leave it unfinished (Cohen et al., 2007: 258; Denscombe,
    2007: 161; Dörnyei, 2007: 110; Gall et al., 2007: 432; Mallen et al., 2008: 1296;
    Munn & Drever, 2004: 29). More specifically it consisted of 20 questions and needed
    7–10 minutes to complete. Moreover, the questionnaire was issued to respondents''
    native language, i.e. Greek. The rationale behind this decision was to facilitate
    understanding and make respondents feel comfortable when answering the questions
    and thus minimize reliability and validity problems caused by the language factor
    (Geisinger, 1994: 305; Wiersma, 2008: 174).


