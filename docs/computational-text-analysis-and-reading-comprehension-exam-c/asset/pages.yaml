    # 2.4.5 Word Frequency


    Word frequency is an important measure of difficulty because highfrequency words
    are normally read more quickly and are more easily understood than infrequent
    ones (Brown, 1993: 277; Just & Carpenter, 1990: 339; Kibby, 1997: 12; Laufer,
    1997: 266; McNamara et al., 2010: 306; Nation, 1993: 120). In fact, extensive
    research has shown that general knowledge of the vocabulary in a text is one of
    the most important factors that affect reading, since efficient word encoding
    is necessary for higher level of meaning construction (c.f. Adams, 2004: 1219;
    Balaghadeh & Golbin, 2010: 41; Beck et al., 1987: 148; Chall, 1987: 7; Cobb, 2007:
    38; Curtis, 1987: 37; Day & Bamford, 1998: 17–8; False, 2006: 273; Gass & Sinker,
    2008: 173; Hazenberg & Hulstijn, 1999: 152; Hirsh & Nation, 1992: 689; Landi,
    2001: 712; Laufer & Hulstijn, 2001: Lesgold & Perfetti, 1978: 323; Nation, 2001:
    58; Schmitt & Meara, 1997: 18). The difference between skilled and less skilled
    readers is universally attributed to slower and infrequent lexical access and
    semantic processing by the latter (Grabe & Stoller, 2002: 183; Najjai, 2003: 270);
    whereas consistent correlations between vocabulary and comprehension have been
    found in a number of factorial analytic studies (Drum et al., 1981: 486; McDonald
    & Sheehan, 2001: 296; Mezynski, 1983: 257; Stahl, 2003: 246). To show the importance
    of vocabulary knowledge in language acquisition, Anderson and Freebody (1983:
    367) asserted that “people who do not know the meaning of many words are most
    probably readers”, while for Sternberg (1987: 90) “one’s level of vocabulary is
    highly predictive, if not deterministic, one’s level of reading comprehension”.'
