    effect of text cohesion on comprehensibility, as well as the lack of research
    on the usability of such a model in estimating foreign language reading comprehension
    difficulty, it falls within the scope of the present research to attempt to operationalize
    and explore its applicability in profiling and calibrating KPG test sources in
    terms of its level of difficulty.


    # 2.4 Lexicographical complexity


    In systemic grammar, it has been suggested that the complexity of a text could
    be related to additional lexicicographical features, the variations of which cause
    variations in complexity. Building on earlier work by Shokrpour (1996: 91–92;
    2004: 5), who made an attempt to estimate text difficulty by using the systemic
    model of language as a basis for the linguistic analysis of English texts used
    in an exam situation, in the present study specify text aspects such as lexical
    density and complex noun group structure that are hypothesized to cause differences
    in text complexity have been analyzed, in order to determine the difficulty level
    of reading texts used in the KPG language exams in English.


    To be more specific, in a rather innovative study, Shokrpour (2004: 5) explored
    the usability and practicality of the two lexicographical criteria mentioned above
    in estimating the difficulty two English texts of different modes, i.e. one spoken
    and one written, presented to 98 EFL university students in Iran (ibid: 13). The
    two texts were matched for the number and frequency of words'
