    101; Fowler, 2009: 3; Hofmans et al., 2007: 97; Mallen et al., 2008: 1296; Wiersma,
    2008: 173). Questionnaires are the most common data collection instruments in
    applied linguistics and survey research in general (Blaxter et al., 2006: 77;
    Descombe, 2007: 169–170; Denzin, 2009: 174; Dörnyei, 2007: 95; Gall et al., 2007:
    418) not only are considered to be a cost effective method of collecting data
    from a large number of people (Converse & Springer, 1994: 99; Kumar, 2005: 114–115;
    Nachmias & Nachmias, 2007: 180; Strange et al., 2003: 337), but also due to the
    fact that, when carrying out a survey, you need to obtain information in a relatively
    standardized way and the only way to achieve that is by administering the same
    instrument to all students in the sample (Gall et al., 2007: 417).


    In situations, as in the case of the KPG questionnaires considered appropriate
    for another reason. As there was no face-to-face interaction between respondents
    and researcher, this method provided greater anonymity, which in our case could
    have made it easier for KPG test-testers to express their views demean easily,
    without feeling intimidated or anxious to choose the response that would satisfy
    the researcher (Bell, 2005: 11; Kumar, 2005: 114–115; Nachmias & Nachmias, 2007:
    180; Strange et al., 2003: 337). Another advantage of the questionnaire that positively
    affected the KPG team’s decision to use it as a measurement instrument is that
    it reduces biasing errors that might arise in a personal interview situation (Kumar,
    2005: 115; Nachmias & Nachmias, 2007: 180). Without doubt, as Dörnyei (2007: 115)
    explained “the main attraction of questionnaires is their efficiency in terms
    of researcher time and financial resources, by administering a questionnaire to
    a group of people, one can collect a huge amount of information less than an hour”.
    They are also very appropriate when the population under investigation is geographically
    dispersed (Nachmias & Nachmias, 2007: 180), as in the present survey, which KPG
    test-testers were scattered over all the country.


