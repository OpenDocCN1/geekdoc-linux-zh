  md: '# # 1. Introduction


    The main aim of the present study was to empirically investigate the effect specific
    text and reader variables have on the nature and product of the reading comprehension
    process, in the context of language testing, with specific reference to the Greek
    national exams in English for the State Certificate of Language Proficiency (known
    with their Greek acronym as KPG exams). The research project was stimulated by
    the urgent need for empirical evidence to supplement the intuitive selection of
    reading texts by expert items and developers. More specifically, it involved systematic
    investigation to determine, on the basis of empirical data, what makes a test
    easy or difficult for test-takers of different levels of English language proficiency.
    As explained in detail in the following section and in the Literature Review chapter,
    research in this area is lacking. Therefore, item writers select reading texts
    intuitively and test development teams of the most well-known international testing
    systems use human judges for validating their text selection processes. Nevertheless,
    in recent years, advances in the field of computational linguistics have made
    possible the analysis of a wide range of in-depth text characteristics which,
    once submitted to complex statistical analysis, can provide a principled means
    for test providers to assign difficulty levels to test source texts based on a
    set of research validated criteria.


    Although the issue of test readability is long-standing and has a venerable research
    tradition, its impact on foreign language assessment has increased attention over
    the last decade. The number of studies on exam validity and reliability has also
    increased. Yet, most well-established international exam systems have failed to
    provide sound evidence of their text selection processesBachman et al., 1998:
    128; Chalhoub-Deville & Turner, 2000: 528; Fulcher, 2000: 487). In fact, while
    reviewing the main characteristics of three respected international tests, namely
    the International English Language Testing System (IELTS), the Test of English
    as a Foreign Language (TOEFL), Chalhoub-Deville and Turner (2000: 528–30) stressed
    the lack of adequate documentation how the level of difficulty is determined,
    and which processes for test selection are applied, with a view to establishing
    internal consistency of their tests and equivalence across parallel test forms.


    According to Chalhoub-Deville and Turner (ibid: 528–9) making such information
    available to the public is mandatory, in order to help all interested parties
    make informed evaluations of the quality of the tests and their ensuing scores.
    In addition, it is important for exam systems not only to provide information
    about'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'the psychometric properties of their exams, but also to report, on a regular
    basis, descriptive information about their test-takers personal -attributes such
    as language background, country of residence, academic level, age, sex, etc.,
    since such information can be used to complement cut-off scores considered for
    admission or employment purposes (ibid: 529). Chalhoub-Deville and Turner concluded
    by pointing to the fact that nowadays, that language abilities are used to make
    critical decisions that can affect test-takers'' lives, developers of large-scale
    tests have the responsibility not to construct instruments that meet professional
    standards, but also to investigate the properties of their instruments over the
    years and make test manuals, user guides and research documents available to the
    public to ensure appropriate interpretation of test scores (ibid: 528–9); Khalifa
    & Weir, 2009: 17).


    # 1.1 Rationale of the study


    The current study is closely linked to earlier findings of research on reading
    assessment, according to which many variables such as text structure and text
    language, background knowledge and task type, have an impact on either the reading
    process or product and need to be taken into account during test and validation
    (Oakland & Lane, 2004: 247). As pointed out by Alderson (2000: 81) “If the reading
    process or product varies according to such influences, and if influences affect
    the test or assessment procedures, then this is a risk to the validity of test
    scores, to the generalizability of results or to the interpretation of performances”.
    In fact, a lot of research has been conducted in the field of second language
    acquisition with specific reference to ways of reading and text processing strategies,
    Alderson (2000: 104) stressed language testers’ lack of success “to clearly define
    what sort of test a learner of a given level of language ability might be expected
    to be read or define text difficulty in terms of level of language ability a reader
    must have in order to understand a particular text”. Such information would be
    particularly useful in providing empirical justification for the kinds of reading
    tests-takers sitting for various language exams are expected to process, which
    have been given intuitively by various exam systems (Alderson, 2000: 104; Allen
    et al., 1988: Fulcher, 1997: 497; Lee & Musumeci, 1988: 173; Oakland & Lane, 2004:
    243).


    Fulcher (1997: 497) is another testing scholar who drew on the importance of text
    difficulty or text accessibility as a crucial but much neglected area in language
    testing. For him, defining text difficulty is critical for test developers to
    become aware of the range of factors that make texts more or less accessible,
    in order to select reading texts at appropriate levels for inclusion in the reading
    test'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'papers of their examinations (ibid: 497). He further stressed that research
    in this area is particularly pertinent as text difficulty is re-emerging as an
    area of great concern not only in language teaching and materials writing but
    also in the testing community (ibid: 497). Echoing Fulcher, Fredle and Kostin
    (1999: 3) postulated that, ideally, a language comprehension test ''should'' assess
    the difficulty of the text itself, the item should only be an incidental device
    for assessing difficulty. Much earlier, Carrell (1987a: 21) emphasized for EFL
    readers and materials developers to establish reliable ways of matching the difficulty
    of reading materials to foreign language readers, if materials are too easy, students
    are unchallenged and bored, and no learning occurs. On the other hand, if materials
    are too difficult, students become frustrated and drawn, and again no learning
    occurs (ibid: 21). By extending Carrell''s view, one might assert that not only
    optimal learning but also exam performance occurs, when the difficulty of level
    testing materials is appropriately matched to readers'' capabilities. However,
    the problem still lies in how to achieve this ideal.


    Especially in relation to texts, it has been shown that text variables have a
    significant effect on both test difficulty and test scores, regardless of the
    employed method, since the reading process involves two entities: the text and
    the reader (c.f. Alderson, 2000: 61; Carr, 2006: 271; Frazier, 1988: 194; Fredle
    and Kostin, 1999: 5; Davies & Irvine, 1996: 173; Challe & Dale, 2005: 5; Kemper,
    1988: 141; Kozminsky and Kozminsky, 2001: 187; Leong et al., 2002: 126; Pakhiti,
    2003a: 649–650). This means that testers should choose to texts of an appropriate
    level for the intended audience. The effect of text, structure and vocabulary
    is such that “test designers should be aware that a variation in texts might be
    expected to lead to different test results [...] Tests of reading and good assessment
    procedures in general will ensure that readers have been assessed on their ability
    to understand a variety of texts in a range of different topics” (Alderson, 2000:
    83). Brindley and Slatyer (2002: 382) further highlighted that the rather simplistic
    notion of difficulty statistics is of limited usefulness in understanding what
    happens when an individual test-taker interacts with an individual item. If, as
    Buck (1994: 164) suggested “performance on each test item by each test-taker is
    a unique cognitive event”, then test design will require not only a much more
    detailed specification of text characteristics and conditions, but it will also
    need to be based on a much better understanding of the interaction between the
    text, task and reader variables (Brindley and Slatyer, 2002: 388).


    Much earlier, Johnston (1984: 223) emphasized that the assumption that an item
    is independent of its text context is unreasonable. The context clearly influences
    the difficulty of items based on the same text. More recently, Bachman once again'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'stressed (posting to L-TEST, 19 February 2000) that “when we design a test,
    we specify the test characteristics and even try to describe the characteristics
    of the test-takers, but getting at the interaction is the difficult part”. To
    this end, a good deal of work will need to be devoted to building models of test
    performance that incorporate a wide range of overlapping difficulty components
    and exploring their effects on test scores (Brindley & Slayter, 2002: 391).


    In fact, although research literature is full of evidence that test difficulty
    is one of the most important factors in reading comprehension, many researchers
    are still struggling with readability formulas or their own experience for assigning
    reading levels to tests (Oakland & Lane, 2004: 244; Shokpour, 2004: 5). However,
    as explained in detail in the following chapter, readability formulas have been
    widely criticized by both L1 and L2 language researchers for limiting their scope
    of research on basic test features, such as sentence and length, and failing to
    take into account a number of additional factors that contribute to test difficulty,
    such as syntactic complexity and density of information (Anderson, 1983: 287;
    Bailin & Grafstein, 2001: 292; Carr, 2006: 282; Carver, 1976: 662; Crosley et
    al., 2008: 476; Farr et al., 1990: Freebody & Fulcher, 1997: 501; Lee & Musumeci,
    1988: 173; Meyer & Rice, 1984: 320; Prins & Ulinj, 1990: 140-1; Spadorcia, 2005:
    37; Wallace, 1992: 77).


    Apart from test variables, recent research in reading comprehension processes,
    when dealing with a foreign language from a psycholinguistic perspective, has
    highlighted the significant effect of reader factors on comprehension and further
    supported the view that a satisfactory understanding of the reading process, which
    operates at a number of different levels of processing, i.e. lexical, semantic,
    and discoursal, depends not only on an accurate identification of the various
    elements and the connections among them, but also on of readers’ prior knowledge
    of interest in the topic as well as the strategies used to actively reconstruct
    text meaning (Bachman, 2000: 11; Bailin & Grafstein, 2001: 292; Brantmeister,
    2005: 37; Crosley et al., 2008: 477; Drucker, 2003: 25; Freebody & Anderson, 1983:
    278; Keharvar et al., 2007: 20; Khalifa & Weir, 2009: 19–20; Kerelek, 2006: 121;
    Kozminski & Kozminski, 2001: 187; Langer, 1984: 49; Parker et al., 2001: 308;
    Phakiti, 2003a: 651; Rayner et al., 2012: 246–7; Rupp et al., 2006: 445).


    Recently, a limited number of researchers in the field of language testing have
    been concerned with the identification of learners’ individual characteristics
    that may influence performance on language tests (Phakiti, 2003b: 26; Sunderland,
    1993: 47; Wightman, 1998: 255). Thus, from the differences across individuals
    in their language ability, processing strategies and schema activation, test-takers’
    personal characteristics such as age, years and'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'instruction in a foreign language, as well as psychological factors such as
    feelings of anxiety under testing conditions, have received increased attention
    (Pomplun & Omar, 2001: 171; Sullivan, 2000: 373; Stricker et al., 2005).


    Despite the considerable advances that have been made in exploring and understanding
    the various aspects of foreign language acquisition and reading performance, the
    available research has, nevertheless, rather unsuccessful in clearly defining,
    most importantly, in prioritizing those text features that the text selection
    have a direct impact on text complexity and need to be accounted for during the
    text selection and item design process. As stated above, although readability
    formulas have been extensively applied in the field of foreign language teaching
    and testing, numerous researchers have pointed to their serious limitations and
    repeated the stress for a need for more in-depth analysis of text features, in
    order to better define what sort of text a learner of a given level of language
    ability should be expected to be able to process when sitting for a specific exam.


    Weir (2005: 292) further acknowledged that, although the Common European Framework
    of Languages (CEFR) attempted to describe language proficiency through a group
    of scales composed of ascending descriptors, it failed to provide specific guidance
    as to the topics to be more or less suitable at any level of language ability,
    or define difficulty in terms of text length, content, lexical and syntactic complexity.
    In fact, according to Weir, the argument that the CEFR is intended to be applicable
    to a wide range of languages "offers little comfort to the test writer, who has
    to select texts or activities uncertain as the lexical breadth of knowledge required
    at a particular level within the CEFR" (ibid: 293). Alderson et al. (2004: 11)
    also stressed that many of the terms in the CEFR remain undefined and argued that
    difficulties arise in interpreting it "it does not contain any guidance, at a
    general level, of what might be simple in structures, lexical or any other linguistic
    level". Therefore, according to Alderson et al., the CEFR would need to be supplemented
    with lists of grammatical and specific lexical items for each language for item
    writers or item bank compilers to make more use of it. Furthermore, with reference
    to text complexity, Shukpror (2004: 15–16) emphasized that systematic functional
    grammar criterion should be included in more studies concerned with the difficulty
    of the test, in order to add to our knowledge about the factors contributing to
