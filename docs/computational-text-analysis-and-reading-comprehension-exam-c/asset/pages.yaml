  md: '# ### 3.4 Readability Indices


    As discussed in detail in the Literature Review chapter, the traditional method
    of assessing text difficulty is based on readability formulas. Although readability
    formulas have come under numerous criticisms, the research literature is replete
    with evidence that such measures are still extensively applied in educational
    settings, since the general consensus is that they can be helpful in providing
    approximations of text difficulty (Allen et al., 1988: 164; Crosby et al., 2007a:
    18; Chall & Dale, 1995: Leon et al., 2002: 127; Spadacia, 2005: 37). More than
    40 readability formulas have been developed over the years, the five most widely
    used to date are the Dale-Chall, the Flesh Reading Ease and the Flesh-Kincaid
    Grade Level, the Gunning-Fog and the Fry Index, all of which have been employed
    in the present research.


    To begin with, Coh-Metrix was used to calculate the readability level of all texts
    in our corpus based on the Flesh Reading Ease and the Flesh-Kincaid Grade Level.
    The output of the Flesh Reading Ease is a number from 0 to 100, with high scores
    indicating that material is easy to read and low scores indicating more appropriate
    for readers with a higher level of education. Formula 1 below how this score is
    computed:


    > Flesh Reading Ease = 206.835 – (1.015 × ASL) – (84.6 × ASW)


    where ASL refers to the average sentence length, as the ratio of the number of
    words in the text divided by the number of sentences, and ASW refers to the average
    number of syllables per word, as the ratio of the number of syllables divided
    by the number of words. The Flesh–Kincaid Grade Level formula, a successor of
    the Flesh Reading Ease index, converts the Reading Ease score to a U.S. grade
    school level with levels ranging from 0 to 12. Thus, the higher the level, the
    harder it is believed that the specific text will be to read. Formula 2 shows
    this score is computed:


    > Flesh–Kincaid Grade Level = (0.39 × ASL) + (11.8 × ASW) –15.59


    In general, a text should have more than 200 words, the Flesh Reading Ease and
    Flesh–Kincaid Grade Level metrics can be applied (*Graesser et al.*, 2004: 6–7).


    The Gunning-Fog Index is another readability formula that provides a rough numerical
    estimate of the age someone ought to be in order to understand the content of
    a text. The formula was designed by Robert Gunning on the assumption that short
    sentences written in plain English are easier to process than longer ones. In
