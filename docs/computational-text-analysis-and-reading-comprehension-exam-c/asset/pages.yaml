    # 1.4 Book Structure


    The book is divided into six chapters. Chapter 2 provides a review of pertinent
    research literature in the field of FL reading comprehension and testing, from
    a critical perspective, discusses the strengths and limitations of reported studies
    on test and reader variables, in order to help the readers understand the context
    of the current investigation. It concludes by highlighting the lack of a model
    for assessing test difficulty based on a sound theory of language and explains
    the contribution of the present study towards this end.


    Chapter 3 reports on the research methodology, tools and procedures employed for
    the collection of necessary data in the present study. The employed methodology
    is presented concisely but comprehensively enough to justify its use and facilitate
    its replication in relation to analyzing KPG reading texts and obtaining valuable
    information from KPG test-takers'' questionnaires.


    Chapter 4 presents the test analysis findings. By investigating the linguistic
    differences between B2 and C1 English source texts used in past KPG exams, the
    chapter ends by proposing a mathematical formula for automatically estimating
    test difficulty based on Systemic Functional grammar and additional lexicographical
    features.


    Chapter 5 focuses on the effective test variables had on actual reading exam performance,
    in order for test constructors to become aware of potential bias during the test
    design and score interpretation process. In addition based on data from the RCeL
    national survey, this chapter reports on specific information regarding KPG test-takers''
