    universe. Moreover, reliability of rating scales tends to be rather good, and
    because of the greater range of responses offered to participants, it is often
    higher than that of other scales (Oppenheim, 2001: 200). In, practice, despite
    their limitations, rating scales tend to perform well when it comes to a reliable,
    rough grouping of people with regard to a particular attitude (Munn & Drever,
