    # 3.3.10 Referential & Semantic Indices


    Referential cohesion, which has been broadly defined as the case of a noun, pronoun,
    or noun-phrase referring to any constituent in the text (Halliday & Hasan, 1976:
    33), has been extensively investigated in the fields of text linguistics and discourse
    processes (Crosley et al., 2008: 82; Crosley & McNamara, 2009: 124; McNamara et
    al., 2010: 305). The most general form of reference is the anaphoric one that
    refers to any reference backwards to previously mentioned information in a text
    and, as already explained in detail in the Literature Review chapter (p. 64),
    it is the type of reference that is most relevant to cohesion, it provides a link
    with a preceding notion of the text (Halliday & Hasan, 1976: 51). In the present
    research, with Coh-Metrix 2.1, anaphoric reference was estimated in two ways:
    the proportion of anaphoric references that refer back to a constituent up five
    sentences earlier, and adjacent anaphoric reference that corresponds to the proportion
    of anaphoric references between adjacent sentences.


    Another characteristic that is related to cohesion is the repetition of a lexical
    item, either directly or through the use of a synonym, a superordinate or a generally
    related word argument overlap (Halliday & Hasan, 1976: 286). One of formal cohesion
    occurs according to Kintsch & Van Dijk when a noun, pronoun or noun-phrase in
    one sentence is a co-refer of a similar constituent in another sentence. The word
    argument is used in a special sense in this text, denoting a contrast between
    arguments and predicates in propositional representations (Kintsch & Van Dijk,
    1978: 367). Following Kintsch and Van Dijk''s model of text representation, two
    sentences were originally regarded as being linked by lexical co-referentiality
    (anaphora or cataphora), if they shared a common argument. However, more recently
    their theory'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'has been expanded to allow referential overlap between a noun, pronoun or noun-phrase
    and a referential proposition that contains a similar morphological stem. Thus,
    using Coh-Metrix 2.1, three forms of lexical reiteration as indices of similarity
    between sentences were computed, namely content word overlap, which is the proportion
    of content words that overlap between adjacent sentences with no deviation in
    their morphological forms, argument overlap, which is the proportion of all sentence
    pairs in a paragraph that share one or more arguments (in singular or plural form)
    and is generally considered to be an indicator of the degree to which sentences
    cover the same topic, and stem overlap, which is the proportion of all sentence
    pairs in a paragraph that share one or more word stems (any core morphological
    element, be it a noun, verb, adjective or adverb) (Crosley & McNamara, 2009: 124).
    Low scores on these measures indicate that each sentence does relate to the sentences
    before or after it in a specific text (Duffy et al., 2006: 1253). The proportion
    of adjacent sentences that share one or more arguments, i.e. adjacent argument
    overlap, or one or more word stems, was also calculated. All these indices are
    important indicators of text difficulty, since research has shown that the overlap
    of word units in a text can aid text comprehension and reading speed, by enhancing
    text coherence and facilitating the construction of units meaning (Crosley & McNamara,
    2009: 124; Douglas, 1981: 101; Field, 2004: 121; Horning, 1987: 58; Rashotte &
    Torgensen, 1985: 86; Rayner et al., 2004: 50).


    An additional form of referential cohesion, identified by Halliday and Hasan (1976:
    37) as personal reference, was explored through Coh-Metrix 2.1 by calculating
    the incidence score of personal pronouns per 1000 words as well as the ratio of
    all types of pronouns to nouns phrases in a text. The incidence of personal pronouns
    was computed first, followed by a proportion score, i.e. pronoun ratio, which
    varied from 0 to 1, with values approaching 1 indicating that nearly all of the
    noun-phrases present in a text were captured by pronouns. In sum, both metrics
    have provided useful information regarding readability, a high density of pronouns
    can create referential problems, if the reader does not know what the pronouns
    refer to. This is due to the fact that, texts increase in sophistication, a higher
    ratio of pronouns to noun phrases is expected, because the writer assumes greater
    ability on the part of their audience to understand referential chains (Duffy
    et al., 2006: 1253–1254; Graesser et al., 2004: 197).


    In addition to referential indices and lexical overlap, Coh-Metrix 2.1 uses another
    method of computing semantic or conceptual similarity between sentences or paragraphs
    through Latent Semantic Analysis (LSA) indices. LSA is a statistical technique
    for representing world knowledge, based on a large corpus'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'of texts. More specifically, using singular value decomposition, which is a
    general form of principal component analysis, LSA condenses a large corpus of
    texts to 100–500 functional dimensions, which represent how often a word occurs
    within a document (defined at the sentence level, the paragraph level or in larger
    sections of texts). This way word, sentence or text ends up being a weighted vector,
    according to which the conceptual similarity between any two texts is evaluated
    (Deerwester et al., 1990: 397–8; Landauer, 1999: 307–9; Landauer, 2011: 6–8; Landauer
    & Dumais, 1997: 222–6; Landauer et al., 1998: 263–6). As Crossley and McNamara
    (2009: 124), unlike lexical markers of co-referentiality, LSA provides for the
    tracking of words that are semantically similar, but may not be related morphologically.
    For instance, the word mouse has a higher LSA score when compared to cat than
    either dog or horse. In simple terms, LSA is a mathematical model of measuring
    the proportion of similar information each sentence provides or its goodness according
    to Halliday (1967: 38), with high values indicating that information can be recoverable
    from the preceding discourse and is, thus, less cognitively demanding to readers,
    while low scores suggest that the various segments of the text are dissimilar
    to one another and there is no clear thematic throughout a text (Crossley & McNamara,
    2009: 124; Duffy et al., 2006: 1253; McCarthy et al., 2006c: 192–3).


    In Coh-Metrix 2.1, the sentences, paragraphs and entire texts are represented
    by LSA vectors based on a specific set of dimensions and the cosine angle between
    texts is used to measure the similarity between excerpts, with text cohesion assumed
    to increase as a function of higher cosine scores between constituents. Coh-Metrix
    2.1 reports mean LSA values ranging from -1 to 1 for all sentence combinations
    in a text, by measuring how conceptually similar each sentence is to every other
    sentence in the text, as well as mean LSA cosines for paragraph-to-paragraph units,
    by estimating how conceptually similar paragraph is to all the other paragraphs
    in a text, and mean LSA cosines for adjacent, sentence-to-sentence units which
    refers to how conceptually similar each sentence is to the next (Graeser et al.,
    2004: 200; McNamara et al., 2010: 293). Several studies have used LSA to measure
    differences in text cohesion and essay grading as well the development of lexical
    networks in L2 learners (Crossley et al., 2007a: 20; Crossley et al., 2008c: 1907–8;
    Crossley & McNamara, 2009: 124; Duffy et al., 2006: 1253; Foltz et al., 1998:
    286–7; McNamara et al., 2010: 305; McNamara et al., 2011: 396–398), but its usefulness
    in the context of foreign language testing remains greatly unexplored. Thus, the
    present research is regarded to enjoy a sense of novelty by exploring the contribution
    of LSA to the grading of KPG English reading texts within across two levels of
    language competence.'
