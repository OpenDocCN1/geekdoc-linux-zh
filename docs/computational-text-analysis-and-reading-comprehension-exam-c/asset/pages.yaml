    and space and time relations. More specifically, the negative impact of past tense
    on B2 exam performance that was revealed through the correlational analysis, could
    be an indication of the difficulty such presents to intermediate EFL users, who
    might struggle to disentangle relationships between present and past events and
    could benefit from extra practice on this grammatical features. Additional parts
    of the lexicon that appeared to present difficulties to B2 testers and worth some
    extra practice are phrasal verbs, negations, embedded questions and logical operators.
    On the other hand, advanced EFL users might need greater exposure to training
    on better defining space and time relations and processing syntactically complex
    sentences, since these two specific language aspects were found to negatively
    correlate with exam performance.


    Finally, it should once again be mentioned that both B2 and C1 testers seemed
    to be more familiar with a limited number of strategies, which they repeatedly
    reported using dealing with more linguistically complex texts, whereas more cognitively
    demanding strategies were reported at a much lower percentage. Based on these
    findings, it might be useful to draw EFL teachers'' attention to the fact that
    more effort should be made guide and train students into using a wider range of
    strategies, especially when processing texts that appear more difficult than expected.
    In addition, it might be useful to make EFL users more aware of some test-taking
    strategies, which as reading all instructions attentively and rechecking questions
    before submitting their test papers. This way they may achieve the best of their
    performance and even feel less anxious when taking an exam.


    # 6.2 Research limitations


    As with all studies, the implementation of the present one presented a number
    of challenges and limitations that I hope to overcome in future research. To begin
    with, due to the fact that the KPG English language exam battery is'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'still in infancy, the number of available test source texts used for training
    our model was inevitably constrained to a total of sixty-three texts from the
    two levels of competence. Although this did not prevent the predictive power of
    the model from reaching 95% of accuracy in a new set of texts, it is strongly
    believed that a greater number of texts could result in even higher prediction
    scores. Moreover, the number of texts used during the model validation procedure
    could increase for the generalizability of present results to be further strengthened.
    Once again, it needs to be highlighted that the newly created text difficulty
    formula is not intended to replace human judgement, but rather provide a consistent
    means of validating and improving existing test selection processes. Furthermore,
    the combination of the specific four variables in defining text difficulty should
    not be regarded as the only one possible, but rather as the best available to
    the time being, since if a significantly higher number of exam texts is added
    to the KPG reading corpus, loading values of both the constant and predictor variables
    could inevitably change. Without doubt, these limitations do not detract from
    the value of the L.A.S.T. Test Difficulty accurately distinguishing between intermediate
    and advanced level reading texts, but rather reflect the ever-present possibilities
    for its continuous refinement and improvement.


    Furthermore, the KPG Candidate Survey has provided useful insights into English
    users'' perceptions of test and task difficulty. Until recently, these aspects
    remained unexplored in the context of the KPG language exams in English. However,
    since KPG test-takers made their own interpretations to question items and reported
    strategy to use by their conscious knowledge, we must be wary of the limitations
    of candidate-opinion data. As other studies, at best, these data indicated trends
    in perceived strategy use. It should also be noted that other strategies were
    not included in the questionnaire might have been employed, or even that the reported
    ones might have been used more or less than test-takers indicated. On the other
    hand, the fact that a large number of responses were collected, following a standardized
    set of procedures over an extensive period of time, could add to the validity
    of the present findings. In other words, given the high internal reliability of
    the research instrument that was further attested through its Cronbach''s Alpha
    coefficient estimates, the collected data could be considered reflective of the
    general kind of difficulties KPG test-takers experienced when processing source
    texts and responding to pertinent multiple-choice reading comprehension questions
    at the B2 or C1 level of the English language exams.


    Finally, although the relationship between specific text features and task scores
    in pertinent reading comprehension questions was examined, it did not'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'fall within the scope of the present research to include a more detailed analysis
    of individual task characteristics and their possible effect on actual performance.
    In other words, the correlation between lexicographical complexity and average
    reading comprehension per test was investigated, but a more detailed task and
    item analysis should form part of future research.


    # 6.3 Suggestions for future research & for the use of the findings


    The findings of the present research suggest a number of areas within the context
    of foreign language testing and assessment that warrant further investigation.
    First of all, it would be useful to extend the analysis of text variables to prospective
    source texts at both lower and higher levels of the KPG language exams in English.
    This way the L.A.S.T Difficulty could be updated to automatically assign levels
    to a broader range of reading comprehension tests. Furthermore, the formula could
    be incorporated into a specially designed software tool, that through advanced
    programming, make possible the classification of inserted texts at the click of
    a button. Such an application would need to automatically estimate the lexical
    density, syntactic structure similarity, tokens per word family and technical
    vocabulary of pertinent tests, based on a range of preloaded dictionaries compiled
    for such an in-depth analysis. Moreover, the methodology followed in this study
    could be of practical usefulness to other exam batteries and the KPG exams that
    are currently administered in other languages, such as French, German, Italian,
    Spanish and Turkish, since it can provide them with a general framework of assigning
    levels to test texts that can be further adjusted to the special characteristics
    of each language.


    It might also be interesting to compare and extend the applicability of current
    findings to test-akers’ assessment of lexical competence when performing a writing
    task. More specifically, the detailed list of quantifiable text variables and
    advanced computer tools described in detail in the Methodology chapter could prove
    effectively in assessing the quality of text produced by KPG candidates and designing
    a model for automatically scoring students’ essays, by determining the loadings
    of appropriately identified text variables. Another dimension that could be explored
    by future research involves the comparative evaluation of reading texts in various
    EFL textbooks currently available in the Greek market. By looking more closely
    at the reading material potential KPG test-akers are exposed to during their FL
    instruction, valuable information could be gained regarding the agreement or mismatch
    between test-akers’'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'acquired language knowledge and the level of language ability they are expected
    to have for successful performance on the KPG exams in English. A similar approach
    could also be followed with regard to specially-designed KPG exam-preparation
    textbooks, for their readability level to be validated and, if necessary, further
    calibrated to the requirements of the specific exam.


    Undoubtedly, reading comprehension is no easy task. On the contrary, it is a very
    complicated involving essentially the text, the reader, the purpose of the reading
    action and the context in which the reading occurs. For example, reading to answer
    test questions in an exam situation - the one investigated in this thesis-is very
    different from a situation where reading is done for pleasure, or where reading
    and understanding what a text says be a matter of life or death the moment that
    the action is occurring. However, even within the same context, such as in a testing
    situation, what readers are asked to largely determines what they will do with
    the text, how they will do and how difficult the text will be for them. Actual
    tests, for example, require a very different kind of reading processes than inferential
    questions. That is to say, such as ‘What does the word say and so mean in line
    25 of the?’ involves readers in different processes and places different cognitive
    demands on them questions as ‘What is the author’s position on the problem described
    in the text?; So how easy or difficult a text is simply depend on the question
    asked. Being fully aware of this, it is suggested that future research KPG source
    difficulty should also systematically investigate the impact of individual test
    task and item variables. The findings of the present research should be of considerable
    help in this endeavour.


    Yet, the findings, which are a result of this research project, are of value in
    their own right, especially since text readability is not at all easy to determine.
    Determining the level of difficulty of a text means first of all, deciding on
    which of its qualities contribute to this convolutionthe text variables investigated
    in this thesis. Many times, particularly in pedagogy and teaching situations,
    it is important to make informed and evidence-based decisions onregardless of
    task- whether X or Y is appropriate for the proficiency level of the readers for
    whom it is intended. And this has been the main focus of the present thesis. Of
    course, there has been concern and full awareness that, in order to ascertain
    the difficulty of a text, one must have in mind the reader, for, undoubtedly,
    texts are not hard or easy on their own; they are demanding or taxing for specific
    readers and What is challenging for one person, or downright hard, may be a cinch
    for someone else. This is why in this research it was considered imperative to
    investigate reader variables in connection with text variables.'
