- img_proc: true
  md: 'KPG language exams in English. In fact, most readability studies have been
    statistically flawed in this aspect, since the majority of them have based their
    findings on the results of a single training set. Although performance on a single
    training set allows conclusions regarding well variables predict the difficulty
    of the texts in that set, those conclusions may not be extendable to an independent
    test set.


    To end, in the present research, 40 texts were selected to form the independent
    set upon which the validity of the created model was checked. To begin with, the
    model was used to build a new corpus of texts from a variety of sources, i.e.
    on-line and printed magazines, newspapers, and past exam papers from various examination
    batteries and EFL coursebooks, which represent a range of text genres and registers,
    such as articles, short stories, reports, biographies and film reviews (see Appendix
    4 for the complete list of texts). At the preliminary test phase, the number of
    collected texts reached 120, of which 40 were considered appropriate according
    to the predictive scores of the model (Ratio: 1/3). Each passage was a self-contained
    selection with a minimum of 450 and a maximum of 500 words. Word limit was set
    in order to avoid any effects on judges'' ratings due to text lengths, as longer
    texts could be considered more difficult than shorter ones. Once the texts were
    selected, two expert judges were kindly requested to assess their level of difficulty
    and classify each one of them into one of the available categories, i.e. B2 or
    C1. To avoid contamination of human ratings due to text sources no information
    was provided regarding the origin of the texts. The employment of expert judges
    at this stage of the research was considered the only methodologically acceptable
    way for the practical usefulness and generalizability of the model to be adequately
    supported (Chapelle *et al.*, 2003: 420; Durán *et al.*, 2007: 214–6; Green *et
    al.*, 2010: 200).


    Both judges were considered highly-qualified for the task. Specifically, the first
    judge was an English language professor with a Ph.D. in Linguistics and years
    of experience in text analysis, whereas the second one was a Ph.D. student in
    Linguistics with years of experience in EFL teaching and testing. Both judges
    had taken part in various KPG research projects and were familiar with its specifications,
    but also with those of other examination systems. Importantly, they were both
    acquainted with the Common European Framework of Reference (CEFR) and the distinction
    between intermediate and advanced levels of language competence. During an introductory
    session, judges were informed about the aims of the research and the importance
    of their contribution to the overall validity of the study. They were also provided
    with a specially designed leaflet that included text selection guidelines and
    samples of'
