    present in a specific discourse, although there seems to be a difference between
    lexical diversity and lexical richness, with the former being only one part of
    the multidimensional nature of the latter.


    As with the nomenclature confessions, measuring lexical diversity has been a complex
    task that has troubled researchers across several disciplines and has triggered
    the development of different formulas, amongst which the most widely used has
    been the type-token ratio (TTR), i.e. the ratio of different words used to the
    total number of words present in a text. However, the traditional TTR has been
    considered sensitive to text length and according to certain researchers find
    themselves incapable of assessing lexical diversity in a satisfactory way, if
    the sample sizes vary a great deal (Hess et al., 1989: 538; Johansson, 2008: 61;
    Malvern & Richards, 2002: 87; Richards, 1987: 202–3; Richards & Malvern, 2007:80–1;
    Tweedie & Bacon, 1998: 325; Vermeer, 2000: 70).


    In order to satisfy the need for a more reliable measurement of lexical diversity,
    an algebraic analysis of the traditional TTR was developed by Malvern and Richards
    (1997: 59). According to its designers, the new formula presents methodological-advantages
    over existing measures, since it is independent of sample size and makes it possible
    to perform valid comparisons between quantities of linguistic data (Malvern &
    Richards, 2002: 90–91; McKee et al., 2000: 327). It is also more representative,
    because it uses numerous random samples from the whole set of a text, taking into
    account both long and short-distance repetition, and so no data remain unused
    (Malvern et al., 2004: 63–75).


    Inspired by Richard and Malvern’s work, McCarthy and Jarvis (2010: 384) presented
    another index of lexical diversity called the Measure of Textual Diversity (MTLD),
    which is calculated as the mean length of words that maintain a criterion level
    of lexical variation in a text. McCarthy and Jarvis concluded by advising researchers
    to consider not one but three specific indices, i.e. MTLD, vocd-D (or its hypergeometric
    distribution HD-D) and Maas (log-corrected lexical diversity index), when investigating
    lexical diversity, since each index captures unique lexical information as the
