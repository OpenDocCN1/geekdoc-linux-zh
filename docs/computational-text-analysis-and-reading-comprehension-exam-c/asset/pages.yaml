    2003: 297–8; Liu, 2003: 674; Saberian & Fotatnia, 2011: 1233; Yoro, 1986: 68).


    Nevertheless, idioms are so frequently encountered in both oral and written discourse
    that their acquisition is extremely important for achieving competence of authentic
    language and, thus, learners need to build a large repertoire of figurative expressions
    for use (Boers et al., 2004: 376; Cieslicka, 2006: 134; Cooper, 1999: 258; Connell,
