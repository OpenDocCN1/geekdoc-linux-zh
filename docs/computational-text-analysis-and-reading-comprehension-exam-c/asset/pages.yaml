    could have affected text processing towards a positive or negative direction.
    Without doubt, more reading texts were added to the KPG Reading corpus, which
    might become more prevalent in a statistically significant way.


    # 4.2 Automatic Text Classification Model


    The ultimate purpose of the present research has the creation of a mathematical
    formula that could make possible the automatic classification of English texts
    to two levels of language competence, that is, intermediate or advanced, according
    to their readability level. Although the practical usefulness of such a formula
    for test designers and materials developers is discussed in Chapter 6, it is worth
    mentioning at this point the obvious advantages of determining in a consistent
    and systematic way the difficulty of reading texts for second language users and,
    thus, better defining what sort of text a reader of a prospective level of language
    ability should be able to process under real exam conditions.


    Without doubt, the problem of test readability is an old one with a venerable
    research tradition and a number of formulas based on surface-level linguistic
    features have been developed for its solution. However, as explained in the Literature
    Review chapter, the robustness and apparent simplicity of such formulas have leveled
    numerous criticisms regarding the validity and reliability of their measurements.
    More recently, advances in the field of Computational Linguistics and Machine
    Learning have made possible the analysis of a wide range'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'of more in-depth text characteristics, while complex statistical techniques
    have been developed for modeling and analyzing the simultaneous impact of several
    independent variables on the dependent one. Taking advantage of these recent developments,
    the present research, through its exhaustive list of 135 text variables, explored
    all possible patterns of textual differences between B2 and C1 reading tests and
    succeeded in creating a new model of predicting text difficulty, based on in-depth
    lexical, syntactic and semantic language features.


    In order to create our model, regression analysis, a statistical procedure that
    is commonly employed for predictive purposes was used. The training set consisted
    of 63 KPG reading tests, 34 of which had already been used in past B2 level exams
    and 29 in C1 level exams. These tests had originally been chosen as appropriate
    for each level of competence based on the judgement of experienced KPG test designers
    and a series of piloting sessions. Most importantly, these tests had already been
    used in real KPG language exams in English so, at least in principle, they could
    be taken to represent the best available evidence of tests classified according
    to their level of difficulty. Albeit empirical and subjective, such a classification
    was nevertheless, practically useful, as it provided us with a set of rated tests
    to build our model. As a result, these levelled tests were taken to constitute
    the empirically gold standards for analysis in the linear regression.


    Due to the high number of independent text variables and the two levels of text
    classification Binary Regression was carried out using the Forward and Wald criterion
    in IBM SPSS 20.0. Following this method the program entered in the analysis one
    variable at a time, depending on whether it met a predefined set of statistical
    criteria (p<0.05), and removed those that contributed to the predictive power
    of the model. To avoid over-fitting our model, a minimum of 15 cases of each predictor
    variable was considered acceptable, with the final model containing 4 predictor
    variables. Thus, with a ratio of 15.75, the model followed the necessary statistical
    restrictions and distanced itself from over-fitting problems (Foster, 2001: 212;
    Hatchison & Lazarato, 1991: 480–1).


    +   4 Forward selection looks at each explanatory variable individually and selects
    the single explanatory variable that fits the data best on its own as the first
    variable included in the model. Given the first variable, other variables are
    examined to see if they will add significantly to the overall fit of the model.
    Among the remaining variables, the one that adds most is included. This latter
    step (examining remaining variables in light of those already in the model and
    adding those that add significantly to the overall fit) is repeated until the
    remaining variables would add significantly or there are no remaining variables
    (Cook et al., 2000: 19).'
