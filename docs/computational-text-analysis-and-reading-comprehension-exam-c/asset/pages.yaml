    in order to better define the theoretical framework and practical advantages of
    employed procedures, within the context of the present study. More specifically,
    once the KPG questionnaires were collected and the sample selected, data had to
    be tabulated and synthesized for statistical analyses to follow. The primary task
    of data reduction, as the process of coding data was called, was to assign a code
    number to each question by devising a specific coding system (for example “strongly'
