    # ## 3.3 Automated Text Analysis Tools


    As explained in detail in the Literature Review chapter, for many years, for reasons
    of practicality, the need to determine levels of text difficulty in the field
    of language testing has been generally catered for by robust readability formulas,
    or the expert -albeit intuitive- judgment of individual item writers, who usually
    signed levels to reading texts through a Holistic interpretation of text specifications.
    However, recent landmark advances in Computational Linguistics and Machine Learning
    systems have made it possible to go beyond surface text components and adopt more
    theoretically sound approaches to text readability, focusing on a wider range
    of deep text features that take into account semantic interpretation and the construction
    of mental models and can, thus, alike to assess this aspect of test construct
    validity (Graesser et al., 2004: 193). In the present study, a range of available
    computer programs, such as Co-HMet 2.1, Linguistic Inquiry and'
