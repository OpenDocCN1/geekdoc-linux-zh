    # 3.4.26 Question sequencing


    Once the format of questions was determined, the order in which the former were
    placed in the KPG English Candidate questionnaire was considered, since the ordering
    of questions has repeatedly been found to affect the interest and willingness
    of respondents to participate in a study (Bradburn, 2000: 2; Borgers & Hox, 2001:
    329; Dörnyei: 2007: 119; Nachmias & Nachmias, 2007: 220; Scherpenzel & Saris,
    1997: 341; Velez & Overton, 2007: 73). The order of questions in a questionnaire
    is related to many factors such as the function of the target sample, i.e. how
    respondents might react to certain questions, the purposes of the questionnaire,
    i.e. to gather facts or opinions, the cognitive load of question, i.e. where to
    place more cognitively demanding questions in relation to less complex ones and
    how many need to be carefully considered and, whenever possible, controlled before
    the actual administration. After all, as Oppenheim remarked (2001: 121) “one overt
    purpose of each question is to ensure that the respondent will continue to co-operate”.'
