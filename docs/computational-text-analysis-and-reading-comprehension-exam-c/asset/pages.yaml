    (Beck et al., 1991: 253; Klare, 1984: 684; Meade & Smith, 1991: 154; Parker et\
    \ al.,n2001: 307). Readability formulas, which have been applied more widely in\
    \ first\nnative language students than second or foreign languages and especially\
    \ in\nthe United States of America, are concerned with ways of measuring the ease\
    \ of\nunderstanding text to its specific language (Carrell, 1987a: 21; Meade &\n\
