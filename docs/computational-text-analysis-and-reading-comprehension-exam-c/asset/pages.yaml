  md: 'with general, multi-purpose meanings over phrasal verbs with specific and sometimes
    idiomatic meanings (ibid: 246). As the researchers explained such a strategy may
    have played a causal role in the avoidance behavior of the Hebrew learners observed
    earlier by Dagut and Laufer (ibid: 251).


    More recently, Liao and Fukuya investigated the avoidance of English phrasal verbs
    by 85 Chinese learners of intermediate and advanced level, similarly to Hulstjin
    and Marchena, found that both advanced and intermediate EFL users tended to avoid
    using phrasal verbs, with intermediate learners showing even higher preference
    for one-word equivalents (2002: 91). It should be noted that all four studies
    mentioned above have reached similar conclusions with regard to the semantic nature
    of phrasal verbs had on learners'' overall avoidance, since all participants tended
    to use literal phrasal verbs significantly more than figurative ones in a variety
    of recognition and production tasks, as they proceeded in their language development
    this avoidance tendency diminished and their usage of phrasal verbs approached
    that of native speakers.


    The problems foreign language learners have with phrasal verbs, whether syntactic,
    semantic, or a combination, are increased by the highly productive nature of phrasal
    verbs in English (Quirk & Greenbaum, 1990: 337). Although they were once thought
    to be common in speech and informal writing, it is now accepted that phrasal verbs
    are found in all registers, from comic books and street slang to the most academic
    forms of the language (Chen, 2007: 348; Cornell 1985: 270; Gardner & Davies, 2007:
    339). To further complicate the problem, native speakers of English have an understanding,
    albeit unconscious, of the meaning and use of particles that allows them to create,
    almost at will, new phrasal verbs, an understanding that L2 learners cannot be
    expected to have (Darwin & Gray, 1999: 65; Side, 1990: 146). Given the inherent
    difficulty of phrasal verbs and the impact their occurrence in reading texts can
    have on overall comprehension, defining their occurrence in KPG B2 and C1 English
    tests falls within the scope of the present research, in order to explore their
    relationship with both perceived difficulty and actual exam performance.


    # 2.4.8 Additional text variables


    While not specifically focusing on predicting reading difficulty, many other studies
    on language processing have explored a variety of variables expected to contribute
    to the difficulty of reading texts. However, most of these additional variables
    were investigated in isolation using dependent measures, such as recall of passages
    or decision time in order to define their impact on'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'comprehension. For example, Gorin (2005: 351) and Kaup (2001: 960) found that
    sentence negations typically increase comprehension decision time in with no negations.
    Active constructions have also been found to be easier for students to process
    passive ones (Carrow, 1988: 83; Kirschner et al., 1992: 546; Silver et al., 1989:
    170), although there is some evidence that their frequency could be important
    for beginning readers (Ulijn & Strother, 1990: 38). In his early study, DeVito
    (1969: 406) reached the conclusion that it does not only take longer to process
    a passive sentence, but also that the absence of an explicit agent may constitute
    an impediment to reader''s comprehension, who may not be able to understand who
    does to whom.


    In addition, to Kemper (1987: 323), embedded clauses that interrupt the main clause
    can lead to comprehension problems, especially for older adults. Relative clauses
    can also contribute to difficulty, because they interrupt the flow of the main
    sentence, causing the reader to do more mental work, especially when multiple
    embedded relative clauses with no markers of subordination are present in a text
    (Abedi, 2006: 2283; Akmajian et al., 1995: 79; Crain & Shankweiler, 1988: 176–8;
    Nation, 1982: 74). Furthermore, a large quantity of numbers, especially such as
    prices, symbols and percentages, can increase the density of information in a
    text, and also additional processing demands on readers (White, 2011: 91). Moreover,
    time-related accounts that are usually marked by past tense and past-time markers
    can capture readers'' interest and stimulate their curiosity, but they tend to
    make texts more difficult to understand or may even distract readers from the
    semantic content, especially when the latter is profoundly embedded in related
    accounts or when such are predominant over the semantic content (Nagabhand et
    al., 1993: 900). Conditionals also seem to be a source of confusion for L2 learners
    (Kirschner et al., 1992: 546; Dufty et al., 2006: 1254; DeCarrico, 1986: 668).


