    # 4.1.4 Propositional Idea Density & Lexical Richness Scores


    Using CPIDR 3.0, propositional idea density scores, that are, the number of propositions
    divided by the number of words, were obtained for each of the 63 texts in our
    corpus. To eliminate any bias due to length variations across the two levels,
    scores were again normalized before being subjected to further analysis. Although
    the mean incidence of ideas contained in B2 texts was much lower (Mean=189.08,
    SD=47.21) than that of ideas contained in C1 texts (Mean=277.51, SD=57.14), the
    independent samples t-test revealed no significant differences between B2 and
    C1 level regarding their overall propositional density. This surprising needs
    to be interpreted with caution, contrary to existing research that propositional
    density has a direct effect on readability (Graesser et al., 1997; 163; Kintsch
    et al., 1975; 212; Kintsch & Vipond, 1979: 329; Long & Baynes, 2002: 228; White,
    2011: 85); more advanced KPG texts did not appear to contain have added to their
    complexity by increasing the amount of information needed to be processed by short-term
    memory. Apart from sounding a cautionary note towards direction, it is worth pointing
    out that, despite the fact that propositional density values were scattered lack
    of normal distribution within each level of competence, 161 ideas per text were
    the most frequent for B2 level texts and 214 for the C1 ones, which could reflect
    a tendency for C1 texts to be more loaded in ideas, as a result of their increased
    length.


