  md: '# 5.2 KPG Test-Takers'' Perceptions: RCeL Survey Results


    As already explained in the Methodology chapter, in order to gain a better understanding
    of the interaction between the text, task and reader variables, the KPG English
    Survey was carried out by the KPG research team in the form of questionnaires
    administered during five examination periods, i.e. May and November 2006, May
    and November 2007 and to all B2 and C1 KPG test-takers. Taking into consideration
    test-takers'' impressions and by treating them as "judges" was a crucial part
    of the present study, since they were the actual readers who had to interact with
    the texts in order to perform a successful performance in the specific exams.
    So, their feelings and opinions about the complexity of KPG reading texts are
    believed to be of great importance, since they can give us more in-depth information
    regarding text difficulty from the reader''s point of view. To date, 7,250 questionnaires
    have been analyzed, of which 4,750 referred to the B2 level and 2,500 to the C1
    level exams (Table 5.1). The analysis on the reliability of the survey instrument
    per period demonstrated higher Cronbach''s A coefficients for pertinent reading
    comprehension items, which adds to the overall validity of the obtained data.
    Moreover, the total number of authentic KPG reading texts that were used between
    2006 and 2008 examination periods were, thus, available for analysis twenty-two,
    with twelve belonging to the B2 and the remaining ten to the C1 level exams. Using
    these specific texts as the unit of analysis, their text features (135 variables)
    were compared with the average self-reports of participants in the RCeL Survey.
    For data to be appropriate for statistical analysis, the average score over each
    level of the rating scale (i.e. not difficult – slightly difficult – fairly difficult
    – very difficult – extremely difficult, yes/no, more/less difficult than expected)
    questionnaire item was first estimated with regard to each examination period.
    Due to the length limitations of the present thesis and the amount of findings
    over each level of the rating scale, a decision was inevitably made for the following
    sub-sections to include a selection of research findings, focusing on the extreme
    ends of the scale, that is, not or slightly difficult compared to extremely or
    very difficult.


    In addition, for the KPG English Survey sample to be appropriate for statistical
    analysis and as representative as possible of the target population, a decision
    was made for its size to be at least 10% of the total number of test-takers taking
    exam, with a minimum of 500 participants per examination period. In order to ensure
    a balanced geographical distribution and avoid any variation in response rates
    due to urbanization, 50% of the participants were randomly drawn from the five
    most densely populated cities in Greece, namely Athens,'
