    Interestingly, in the foreign language, there was greater use of strategies that
    did not lead to the selection of a correct response than in the first language.
    In fact, the principal difference between strategies employed in the first language
    and those used in the target language was with regard to the strategy designated
    "guessing based on any particular rationale", which was rarely used in the first
    language but more frequently reported in foreign language reading (ibid: 206).
    As Nevo spoke, “it is possible that subjects'' relative lack of command of the
    language could have led to lack of confidence, inadequate linguistic basis and
    incomplete understanding, which in turn caused them to guess without any particular
    rationale” (ibid: 206). All in all, Nevo''s research showed that there was a transfer
    of strategies from first to foreign language, in particular of contributory ones,
    a finding that further supports the strong relationship between first and second-language
    reading performance (ibid: 206, 212).


    In an older study, Block (1986: 463) used think-aloud protocols to examine the
    comprehension strategies used by college-level students, both native and non-native
    speakers of English, as they read two passages from a language textbook. Each
    passage was a self-contained selection that was rated at approximately the ninth-grade
    readability level by the Fry readability formula (ibid: 467). Strategies were
    categorized by Block into two types: general de comprehension ones which included
    comprehension-gathering as anticipating content, recognizing text structure and
    making inferences, and local linguistic strategies, which dealt with attempts
    to understand specific linguistic units through paraphrasing, rereading parts
    of the text or solving vocabulary problems by using context, a synonym or other
    word-solving behavior (ibid: 467). Interestingly, the analysis showed that there
    did not seem to be a different pattern of strategy between native and non-native
    readers, which, according to the researcher, suggested that strategy use was a
    stable phenomenon across learners, i.e. second language readers bring with them
    knowledge of language in general and then apply this knowledge to learning the
    specific features of another language (ibid: 487).


    These results were confirmed in a subsequent study by Block (1992: 319), in which
