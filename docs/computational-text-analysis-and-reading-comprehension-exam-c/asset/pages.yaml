    \ (1984: 702) summarized evaluation from ten students conducted\nin the 1970s\
    \ indicating that untrained teachers and librarians cannot\nbe relied upon as\
    \ judges of text readability, since their ratings can often vary by\nseveral grade\
    \ levels. On the other hand, readability formulas can be used to help\ngide more\
