    # 2.5.4 Background knowledge & test bias


    There is no doubt that schema theory has much to offer understanding of the intricacies
    and subtleties of foreign language reading comprehension (Floyd & Carrell, 1987:
    90; Yin, 1985: 375). The clear message of empirical research is that the processing
    of a text in a second language is greatly enhanced by the availability of background
    knowledge (c.f. Aron, 1986: 140; Carrell, 1987b: 476–7; Nelson & Schmid, 1989:
    542). On occasions, this can mean activating existing schemata, which it can also
    entail readers to the cultural background of a text (c.f. Johnson, 1982: 511;
    Steffensen et al., 1979: 19). As Anderson et al. (1977: 368) pointed out the use
    of a relevant schema can assist at the point of comprehension by clarifying ambiguous
    elements in a text and providing the ideological scaffolding for assimil textual
    information (Anderson et al., 1978: 434). Prior knowledge of the topic can also
    allow readers to fill in gaps or resolve inconsistencies, when difficult or unknown
    vocabulary is encountered, since, when the topic is unfamiliar, unknown words
    would be expected to have a greater likelihood of leading to inaccuracies and
    uncertainties (Freebody & Anderson, 1983: 287).


    Especially in relation to foreign language testing, a number of studies have examined
    the effects of prior knowledge on a variety of measures of reading comprehension
    performance. As described in detail in the sections above, the basic design of
    these tests had been to define the prior knowledge of'
