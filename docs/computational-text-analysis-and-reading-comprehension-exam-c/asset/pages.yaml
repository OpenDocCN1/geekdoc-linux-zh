  md: 'Coh-Matrix 2.1 was used to assess four main aspects of text unity, i.e causal,
    intentional, temporal and spatial cohesion, the presence of which can contribute
    to the creation of the situation model, namely the mental content or microworld
    of what a text is about (Graesser et al., 1997: 64; Kintsch, 1998: 49–52; van
    Dijk & Kintsch, 1983: 10–12; Zwaan & Radansky, 1998: 162–3). Causal cohesion reflects
    the text to which sentences are related by causal relations and is pertinent to
    refer to events and actions as in the case of science texts and stories. By calculating
    the number of main verbs that are categorized as causal in WordNet and refer to
    changes of state, actions or events, as well as the incidence of additional causal
    particles such as conjunctions, transitional adverbs and connectives that signal
    a causal relationship between clauses, Coh-Matrix provides an index of causal
    cohesion that corresponds to the ratio of causal particles to causal verbs and
    an additional index of causal content, which the incidence score of causal verbs
    and particles per 1000 words (McNamara et al., 2010: 305). The higher the value
    of these two metrics, the more cohesive in terms of causal- the text appears to
    be, whereas low values imply that cohesion suffers due to the lack of a sufficient
    number of causal verbs and particles to provide a clear signaling of the causal
    networks contained in a text (Crossley & McNamara, 2009: 125; Graesser et al.,
    2004: 200).


    Intentional cohesion reflects the extent to which sentences are related by intentional
    relations, i.e. animate protagonists who perform actions in pursuit of goals as
    in the case of simple stories and other forms of narrative (Singer & Haldorson,
    1996: 4; van den Broek & Trabasso, 1986: 2–3). In Coh-Matrix 2.1, the incidence
    of intentional actions and events is estimated by counting the number of intentional
    main verbs and subject nouns identified through WordNet. Thus, intentional cohesion
    is the ratio of intentional particles (e.g. in order to, so that, for the purpose
    of) to intentional verbs, whereas intentional content is the incidence of intentional
    actions, events and particles per 1000 words. The higher the incidence of intentional
    actions in a text, the more the text is assumed to convey goal-driven content.
    Temporal cohesion relations are present in texts that refer to events or actions
    and can be articulated by the usage of verbs in different tenses (past, present,
    future) and different aspects (progress vs. completed). Temporal cohesion is measured
    in Coh-Matrix 2.1 as the mean of tense and aspect repetition score, when analyzing
    the sequence of all verbs present in a text, with high values indicating a clear
    time connection between events.


    Finally, spatial cohesion refers to the presence of motion verbs, location and
    prepositions in a text and is calculated by Coh-Matrix 2.1 as the mean of location
    and motion ratio scores based on the WordNet classification system.'
