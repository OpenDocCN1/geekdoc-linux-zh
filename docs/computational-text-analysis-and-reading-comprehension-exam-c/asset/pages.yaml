    get feedback from the subjects themselves concerning the strategies used when
    completing each test (ibid: 199, 205). Although mentalistic procedures in the
    form of introspective and retrospective verbal reports were employed in a number
    of previous studies, the innovation of Nevo''s study lies in the fact that she
    introduced a test format, which enabled respondents to report on their strategies
