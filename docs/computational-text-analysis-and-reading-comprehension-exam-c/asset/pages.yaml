    # 3.3.9 Cohesion & Coherence Indices


    Unlike traditional readability formulas, which are based on shallow and more local
    levels of cognition, the assessment of cohesive devices in a text may provide
    a more comprehensive analysis of readability, since cohesive devices are based
    on deeper and more global levels of cognition (Crossley et al., 2007a: 18; Graesser
    et al., 2004: 199–200). According to Graesser et al. (2004: 193–4), cohesion is
    an objective property of the text, which consists of explicit characteristics
    that can help the reader understand and interpret the presented information, whereas
    coherence refers to those representations constructed in the mind of the reader
    depending on the skills and knowledge they bring to the situation. In other words,
    cohesion is a textual construct, whereas coherence is the product of psychological
    representations and processes on the part of the reader. To put it simply, a reader
    perceives text to be coherent to the extent that the ideas conveyed in it hang
    together in a meaningful and organized manner (Graesser et al., 2003: 82; Palmer,
    1999: 65–6).'
  merge: -1
  pgno: 119
