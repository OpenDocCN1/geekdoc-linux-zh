  md: 'In order to better define the relationship between indices on the text level
    and mean reading performance scores on each, an additional set of analyses was
    carried out with specific reference to two groups of performance, i.e the Low
    performance group that included mean reading performance scores below 60% (N=15),
    and the High performance one that denoted mean reading performance scores above
    60% (N=15), in each individual set of multiple-choice reading comprehension questions.
    This set of independent sample t-tests revealed statistically significant differences
    in mean reading performance between the two groups based on the contribution of
    five text features, i.e words in the frequency band of the BNC corpus (K5 words),
    negative causal connectives, stem overlap and density of pronouns, especially
    personal ones, in B2 reading tests. To be precise, significantly lower mean reading
    performance was noted when relevant texts contained a higher percentage of low-frequency
    words (t=2.383, df=28, r=0.40, p=0.024), pronouns to noun phrases (t=2.656, df=28,
    r=0.45, p=0.013) and personal pronouns (t=2.463, df=28, r=0.42, p=0.020), whereas
    a significantly higher proportion of sentences that shared one or more word stems
    (t=2.218, df=28, r=0.39, p=0.035) or more negative causal connectives (t=2.440,
    df=28, r=0.42, p=0.021) was evident in those texts that test-takers received higher
    scores.


    These results could help us draw a comparative profile of B2 test-takers, given
    their levels of mean reading performance in actual exams. In other words, regarding
    their competence in processing information and answering relevant multiple-choice
    questions, B2 low-performers appeared to face difficulties, when exposed to less
    frequent words or when the number of pronouns in a text reference a more cognitively
    demanding process to process them. On the other hand, high performers seemed to
    take advantage of word stem repetition and even try to guess the meaning of unfamiliar
    words by making use of derivational rules and contextual information. They also
    appeared to better understand specific causal relations signaled by opposite conjunctions.


    Due to the high variation in B2 mean reading performance scores across the 17
    examination periods, with mean values ranging from 36% to 78% (Mean=60.05, SD=8.96,
    R=41.58), an additional classification of test-takers into three groups was performed.
    The Low Performance group included reading performance scores of up to 55% (N=11),
    the group of Average Performance referred to mean reading performance scores of
    up to 65% (N=6), whereas the High Performance one comprised all mean reading performance
    scores above 65% (N=13). To account for variances across the three groups, a One-Way
    ANOVA was carried out and significant differences in their mean reading performance
    were revealed with relation to six in-depth textual features,


