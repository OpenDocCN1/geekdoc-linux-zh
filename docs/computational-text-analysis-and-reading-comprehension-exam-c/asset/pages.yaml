- img_proc: true
  md: 'rated texts followed by a short description of their textual characteristics.
    Judges confirmed their lack of familiarity with the selected texts, and working
    independently, rated them at their own premises. To avoid contamination of results,
    no personal communication was possible between the two judges. Once the text classification
    process was completed, individual ratings were compared and analysis of inter-rater
    reliability showed that consensus between the two judges reached 80% with 32 out
    of the 40 texts being assigned to similar levels by both raters. To solve the
    rating discrepancy in the remaining 8 texts, a third judge with a Ph.D. in English
    Language and years of experience as an EFL teacher and KPG researcher was kindly
    requested to assess their complexity and provide her rating. This way, ratings
    for all 40 texts were collected and each text was classified as B2 or C1 based
    on inter-rater agreement.


    The final and most important step of the validation process investigated the percentage
    of agreement between human ratings and the newly created text classification formula.
    The comparison showed a 95% agreement between subjective judgement and objective
    automatic measurement. In simple terms, 38 of the new texts were accurately classified
    by the model (see Appendix 5 for the complete list of results). It is worth highlighting
    at this point that the two texts for which the model failed to reach agreement
    with human ratings were drawn from commercially available EFL textbooks (“Clicking
    On to Culture” was classified as an advanced text by Hillside Press, “The Story
    of Dogs” was included in the FCE Practice Exam Papers of Express Publishing),
    and the level predicted by our formula was in fact accordance with the one assigned
    to them by their publishers.


    To sum up, the above mentioned results are considered highly promising not only
    because of the predictive accuracy of the new formula, but also because of the
    more-in-depth lexical, semantic and syntactic variables included in. Thus, the
    new formula seems to consist an improvement over traditional readability formulas
    and could be viewed as a springboard for assessing text difficulty based on a
    more sound theory of language. Moreover, the significant reduction of the number
    of text predictor variables to four and the exclusive use of computer applications
    for their measurement makes the formula a practical, timesaving, user-friendly
    tool that could prove useful to EFL researchers, publishers and test designers
    alike in making more accurate, consistent and evidence-based selections of their
    reading comprehension texts.'
