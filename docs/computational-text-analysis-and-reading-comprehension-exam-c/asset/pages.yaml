    suggested that a more valid measure of lexical richness might be to estimate the
    difficulty of words on the units of their frequency in corpora, similar to the
    Lexical Frequency Profile (LFP) proposed by Laufer and Nation (1995: 311–2). However,
    Meara showed that LFP might not be sensitive enough to pick up modest changes
    in vocabulary size, despite his'
