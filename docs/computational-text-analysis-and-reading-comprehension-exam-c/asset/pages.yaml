    # 2.2 Text structural complexity


    There is no doubt that difficulty has been and continues to be one of the most
    important factors in reading comprehension (Shokrpour, 2004: 5). In most studies,
    researchers have used a readability formula or at least their experience for determining
    the difficulty of a text. However, as explained in the previous section, most
    readability features have limited the scope of their research on basic text features,
    such as word and sentence length, failing to take into account a number of additional
    factors that contribute to the difficulty of text. In fact, what readability focus
    on is the general readability level of a text as a product (Shokrpour, 2004: 6),
    while an in-depth analysis of a text should provide a more complete view of its
    difficulty as a multifaceted phenomenon, reflecting properties of both the text
    and the reader and the interaction between the two (Bailin & Grafstein, 2001:
    292; Carr, 2006: 282; Carver, 1976: 662; Farr et al., 1990: 210; Freebody & Anderson,
    1983: 287; Fulbright, 1997: 501; Lee & Musumeci, 1988: 173; Meyer & Rice, 1984:
    320; Prins & Ulijn, 1998: 140–1; Wallace, 1992: 77). There is no doubt that readability
    cannot be estimated by a simple scale, we do not intend to imply that the factors
    that contribute to making a text more or less readable for certain readers in
    contexts cannot be assessed. Research in this area is believed not only to be
    viable, but also particularly in helping us assess the difficulty at least particular
    text aspects present for certain readers, in the case of KPG testers taking present
    in the English language exams.


    # 2.3.1 Text organisation


