    # 3.4.2.3 Types of questions


    The types of questions included in a research instrument are very important as
    they can have a significant effect on the type and quality of the obtained information
    (Cohen et al., 2007: 248; Fowler, 2009: 5). Given the fact that the KPG questionnaire
    was to be issued to a larger number of people, i.e all test-takers sitting for
    the B2 and C1 English language exams in various examination periods, a decision
    was made to include structured, closed questions, which test-takers could answer
    by ticking a box or choosing the option that most closely corresponded to their
    views. This type of questions are very useful in large-scale surveys, since they
    enable collection of data amenable to statistical analysis and allow comparisons
    to be made across across groups, facilitating the observation of patterns occurring
    in the same sample (Cohen et al., 2007: 247; Denscombe, 2007: 162; Dörnyei, 2007;
    Gall et al., 2007: 428; Krosnick, 1999: 543; Nachmias & Nachmias, 2007: 210; Oppenheim,
    2001: 115). They also require little time to answer, are straightforward to code
    and do not discriminate on the basis of how the respondents are (Nunan, 1992:
    143; Oppenheim, 2001: 112). According to Bradburn (2000: 11–12) and Wiersma (2008:
    176) closed rather than open-ended questions should be preferred whenever possible,
    since they enhance consistency of responses across respondents. Especially when
    exploring attitudes and behaviors, closed questions are considered better than
    general ones, since the more general the question, the wider range of interpretations
    it may be given (Converse & Presser, 1994: 113).


