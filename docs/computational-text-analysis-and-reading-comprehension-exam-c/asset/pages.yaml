    resulting in low cohesion text that discussed topics briefly, contrasted with
    high cohesion texts that discussed topics in depth, a factor that might have contributed
    to overall text difficulty (ibid: 243).


    Freebody and Anderson (1983: 277) also tested the hypothesis that certain types
    of cohesive ties are more difficult to process than others because of their distance
