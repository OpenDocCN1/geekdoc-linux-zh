    # 3.5 Reading Comprehension Task Score Analysis


    Alderson and Clapham (1992: 164) convincingly argued “any information on test-takers
    language proficiency derived from an analysis of test results could contribute
    to a better understanding of the features involved in language knowledge and use”.
    In the present research present a thorough investigation of relationships within
    and across B2/C1 levels between exam performance and textual features present
    in pertinent KPG reading texts was carried out by estimating the mean task scores
    per test and examination period of a total number of 152,039 B2 and 36,517 C test-takers
    who had participated in real KPG language exams in English over a period of 8
    years (2003–2011). These means related to the specific multiple-choice reading
    comprehension included in each set of analyzed texts and provided useful information
    regarding internal consistency of the exam and item difficulty, that is, the proportion
    of test-takers getting an item correct, whereas correlational analyses revealed
    significant relationships between mean performance and specific text variables.


