  md: '# 4.1.3 Readability Formulas


    In the present research, five metrics of readability were calculated, the Flesh
    Reading Index, the Flech-Kincaid Grade Level (0-difficult, 100-easy), the Dale-Chall
    Grade Level, the Gunning-Fog Index (6-easy, 20-hard) and the Fry Readability Graph.
    It is notable that, despite the severe limitations of readability formulas, data
    analysis revealed a significant difference between B2 and C1 tests in relation
    to the employed indices, all of which rated B2 tests as less difficult than those
    used at the C1 level. This finding could be an indication that, despite their
    apparent similarity, readability formulas do seem to come in agreement with KPG
    test designers'' perception of test difficulty and may be of some practical useful-ness
    during the test selection and validation process.


    To be more specific, the B2 tests were found to have a mean score of 57.88 (SD=9.8,
    Min=38.77, Max=73.89) in the Flech Reading Ease Index, a 10.54 (SD=2.24, Min=6.9,
    Max=15.20) in the Gunning-Fog Index and a Flesh-Kincaid Grade Level of 9.54 (SD=1.88,
    Min=5.59, Max=12.00), a Dale-Chall Grade Level of 9.57 (SD=1.90, Min=5.50, Max=14.00)
    and a Fry Level of 9.47 (SD=2.00, Min=6.00, Max=14.00). In comparison, C1 tests
    were generally of an advanced level with a mean score of 50.80 (SD=10.74, Min=33.29,
    Max=73.49) in the Flech Reading Ease Index and were assigned higher grade levels
    by all relevant formulas with a Flesh-Kincaid Grade Level of 10.77 (SD=1.71, Min=6.33,
    Max=12.00), a Dale-Chall Grade Level of 11.29 (SD=2.69, Min=5.50, Max=16.00),
    a Gunning Level of 12.8 (SD=2.87, Min=8.00, Max=20.51) and a Fry Level of 11.01
    (SD=2.24, Min=7.00, Max=15.00).


    A series of independent samples t-tests showed that all of these differences were
    statistically significant (i.e. Flesh Reading Ease Index: t=2.819, df=61, p=0.006;
    Flesh-Kincaid Grade Level: t=-2.679, df=61, p=0.009; Dale-Chall Grade Level: t=-2.957,
    df=61, p=0.004; Gunning-Fog Index: t=-3.467, df=61, p=0.001; Fry Readability Graph:
    t=-2.899, df=61, p=0.005), but within each group source received different and
    at times contradictory ratings regarding their level of complexity. For example,
    the text entitled “Protecting the environment in Greece” that was used in May
    2006 B2 examination was rated as the most difficult (15.2) of all B2 tests by
    the Gunning-Fog Index, while Dale-Chall categorized it as easily (7.5).


    Such discrepancy of readability ratings within and across levels raises the question
    of, if any, specific formula should be given priority, not only in interpreting
    present results but most importantly in classifying and new texts. This question
    can be partly answered by considering the magnitude of the effect of each variable,
    which appears to be higher for the Gunning-Fog'
