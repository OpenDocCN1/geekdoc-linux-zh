    # 2.4.6 Idioms


    As Gibbs (1980: 149) and Bulut (2004: 105) artfully claimed, idioms are the most
    vital parts of every human language, because speakers can express their feelings
    and experiences through figurative expressions. They are used to give life and
    richness to the language, by taking the existing words, combining them in a new
    sense, and creating new meanings, just like a work of art (Bulut, 2004: 105; Doroodi
    & Hashemian, 2011: 712; Simpson & Mendis, 2003: 419). A unified definition of
    idioms has always been a disputable issue, Fernando (1996: 38) defined them as
    “conventionalized multilingual often, but not always, nonliteral”, whereas Sprunger
    et al. (2006: 161–2) expressed the belief that, if there is any relationship between
    an idiom and its constituent words, it will generally be indirect. Another definition
    by Simpson and Mendis (2003: 423) described idioms as “a group of words that occur
    in a more or less fixed phrase, whose overall meaning cannot be predicted by analyzing
    the meaning of its constituent parts”.


    Moreover, the distinction between idioms and metaphors is not always precise because
    many idioms are “dead” or “frozen” metaphors, i.e. figurative expressions which
    have acquired conventionalized meanings (Irujo, 1986b:288). Idioms should also
    be distinguished from other kinds of conventionalized language such as routine
    formulas that is, fixed expressions that are commonly used in particular situations,
    but are not necessarily idiomatic since their meanings can be determined from
    the meanings of the words that comprise them (Yorio, 1980: 434). Adopting a more
    general perspective, Tabossi and Zardon (1993: 145) contended that idioms are
    multifaceted objects, who study various viewpoints and different methodological
    approaches. There is no doubt that idioms form a highly heterogeneous community
    that stretches on a continuum of compositionality. At one end of the spectrum
    the transparent idioms, i.e. figurative expressions means effortlessly deduced
    due to the clear connection between the literal meanings of individual words and
    their idiomatic interpretations (Boers & Demeleheer, 2001: 255), whereas the other
    end nestles the opaque idioms, in which the constituent words do not make a significant
    contribution towards the idiomatic meaning (Abel, 2003: 329; Cacciari & Glucksberg,
    1995: 286; Liontas, 2003: 291). Transparent idioms'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'are easier to comprehend, which does bear comparison with the comprehension
    of opaque idioms (Boers & Demecheleer, 2001: 255; Doroodi & Hashemian, 2001: 711;
    Ellis, 2003: 64; Irujo, 1986b: 28; Laufer, 2000: 194). More pragmatically oriented
    students have used the terms "true idioms" (Wood, 1986: 2 in Abel, 2003: 329)
    or "pure idioms" (Howarth, 1998: 28) to refer to fixed idiomatic nature and allow
    for other non-literal phrases to be idiomatic but not-fixed at the same time.


    No matter the various definitions and theoretical approaches, idioms are traditionally
    understood as multiword expressions with a figurative meaning that cannot always
    be inferred by adding up the meanings of their constituent parts (Abel, 2003:
    329–30; Kovcecs & Szabó, 1996: 326; Moor, 1998: 120; White, 2011: 87; Zyk, 2011:
    413–4). Although this is an overly simplified definition, it serves as a point
    of departure and suggests that idioms could pose a special kind of challenge for
    FL learners. In fact, Celce-Murcia and Freeman (1999: 39) describe idioms as "notoriously
    difficult" for FL learners, and many foreign language teachers would agree that
    the most advanced learners appear to be afraid of getting idioms right and to
    avoid using them (Irujo, 1986a: 237). In fact, research has repeatedly shown that,
    due to unpredictable nature and production (Bullen, 2004: 106; Cieslicka, 2006:
