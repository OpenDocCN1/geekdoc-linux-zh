    ```

    ```bash

    /etc/httpd/conf/httpd.conf

    ```

    ```


    Change ServerAdmin you@example.com as you need.


    The folder of the WEB Pages by default is ServerRoot "/etc/httpd". Directory must
    be set to the same folder, so change the line


    ```

    ```html

    <Directory "/etc/httpd">

    ```

    ```


    This folder must have read and execution access, so


    ```

    ```bash

    chmod o+x /etc/httpd

    ```

    ```


    Change AllowOverride from none (default) to All so .htaccess will works.


    Now you need the ~/public_html folder for each user. (to get the root page of
    each user as http://localhost/~yourusername/ Unremark this line:


