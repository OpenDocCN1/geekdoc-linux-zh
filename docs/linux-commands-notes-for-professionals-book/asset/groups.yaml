    ## 第 19 章：更改根目录 (chroot)\n\n更改根目录 (chroot) 是一种更改当前运行进程及其子进程的表面根目录的操作。在这样修改后的环境中运行的程序无法访问该环境目录树之外的文件和命令。\n\
    \n### 第 19.1 节：要求\n\n- root 权限\n- 另一个可用的 Linux 环境，例如 Live CD 引导或现有的发行版\n- `chroot`\
    \ 源和目标环境架构匹配（使用 `uname -m` 检查当前环境架构）\n- 在 `chroot` 环境中可能需要加载的内核模块必须已加载（例如，使用 `modprobe`）\n\
    \n### 第 19.2 节：在目录中手动更改根目录\n\n1. 确保您满足了所有要求，参见“要求”部分\n\n2. 挂载临时 API 文件系统：\n\n\
    \   ```bash\n   cd /location/of/new/root\n   mount -t proc proc proc/\n   mount\
    \ --rbind /sys sys/\n   mount --rbind /dev dev/\n   mount --rbind /run run/ (可选)\n\
    \   ```\n\n3. 如果您需要在 chroot 环境中使用互联网连接，请复制 DNS 详细信息：\n\n   ```bash\n   cp /etc/resolv.conf\
    \ etc/resolv.conf\n   ```\n\n4. 更改根目录到 /location/of/new/root，指定 shell（在此示例中为 /bin/bash）：\n\
    \n   ```bash\n   chroot /location/of/new/root /bin/bash\n   ```\n\n5. 在 chroot\
    \ 之后，可能需要加载本地 bash 配置：\n\n   ```bash\n   source /etc/profile\n   source ~/.bashrc\n\
    \   ```\n\n6. 可选地，创建一个独特的提示符以能够区分您的 chroot 环境：\n\n   ```bash\n   export PS1=\"\
    (chroot) $PS1\"\n   ```\n\n7. 完成 chroot 操作后，您可以通过以下方式退出：\n\n   ```bash\n   exit\n\
    \   ```\n\n8. 卸载临时文件系统：\n\n   ```bash\n   cd /\n   umount --recursive /location/of/new/root\n\
    \   ```\n\n### 第 19.3 节：使用 chroot 的原因\n\n更改根目录通常用于在无法引导和/或登录的系统上进行系统维护。\n\n常见示例包括：\n\
    \n- 重新安装引导加载程序\n- 重建 initramfs 镜像\n- 升级或降级软件包\n- 重置被遗忘的密码\n- 在干净的根环境中构建软件\n\n\
    ## 第 20 章：包管理器\n\n### 第 20.1 节：如何使用 apt 包管理器更新软件包\n\n高级包工具，俗称 'apt' 包管理器，可以处理\
    \ Debian、Slackware 和其他 Linux 发行版上软件的安装和移除。以下是一些简单的使用示例：\n\n**update**\n\n此选项获取并扫描\
    \ Packages.gz 文件，以便获取新包和更新包的信息。为此，输入以下命令：\n\n```bash\nsudo apt-get update\n```\n\
    \n**upgrade**\n\n此选项用于安装系统当前安装的所有软件包的最新版本。获取并升级有新版本可用的当前安装软件包；在任何情况下，当前安装的软件包都不会被移除，或者未安装的软件包不会被获取并安装。要升级，输入以下命令：\n\
    \n```bash\nsudo apt-get upgrade\n```\n\n**dist-upgrade**\n\n除了执行升级功能外，dist-upgrade\
    \ 还会智能地处理新版本软件包的依赖关系变化。如果有必要，它会尝试升级最重要的软件包，而牺牲不那么重要的软件包。为此，输入以下命令：\n\n```bash\n\
    sudo apt-get dist-upgrade\n```\n\n### 第 20.2 节：如何使用 pacman 包管理器安装软件包\n\n要在数据库中搜索软件包，同时搜索软件包的名称和描述：\n\
    \n```bash\npacman -Ss string1 string2 …\n```\n\n要安装单个软件包或软件包列表（包括依赖项），发出以下命令：\n\
    \n```bash\nsudo pacman -S package_name1 package_name2 …\n```\n\n*source*\n\n###\
    \ 第 20.3 节：如何使用 pacman 包管理器更新软件包\n\n要更新特定程序：\n\n```bash\nsudo pacman -S <programName>\n\
    ```\n\n要更新整个系统：\n\n```bash\nsudo pacman -Sy\n```\n\n### 第 20.4 节：如何使用 yum 更新软件包\n\
    \nYellowdog Updater, Modified，Yellow Dog Linux 最后留下的遗迹之一，是 Red Hat、Fedora 和 CentOS\
    \ 系统及其衍生版本使用的包管理器。它可以处理这些 Linux 发行版中打包为 rpms 的软件的安装和移除。以下是一些简单的使用示例：\n\n#### search\n\
    \n此命令将尝试在配置的软件库中查找符合给定搜索标准的软件包，并显示找到的匹配项的名称/版本/库位置。要使用它，输入以下命令：\n\n```bash\nyum\
    \ search <queryString>\n```\n\n#### install\n\n此命令将尝试从配置的软件库中查找并安装指定的软件，递归地查找并安装所需的任何先决条件软件。要使用它，输入以下命令：\n\
    \n```bash\nsudo yum install <packageName>\n```\n\n#### update\n\n此选项用于安装系统当前安装的所有软件包的最新版本。获取并升级有新版本可用的当前安装软件包；必要时也会获取并安装新的先决条件，并移除被替换或过时的软件包。要升级，输入以下命令：\n\
    \n```bash\nsudo yum update\n```\n\n与 apt 不同，大多数 yum 命令如果最近没有进行库元数据检查（或如果强制进行），也会自动检查库元数据的更新，并获取和扫描更新后的元数据，以便在请求操作执行之前，关于新软件和更新软件的信息可用。\n\
    \n## 第 21 章：编译 Linux 内核\n\n### 第 21.1 节：在 Ubuntu 上编译 Linux 内核\n\n> **警告：** 请确保您至少有\
    \ 15 GB 的可用磁盘空间。\n\n在 Ubuntu >=13.04 上编译\n\n选项 A) 使用 Git\n\n如果您希望保持与最新 Ubuntu\
    \ 内核源代码同步，请使用 git。详细指令可以在内核 Git 指南中找到。git 仓库不包含必要的控制文件，因此您必须通过以下命令构建它们：\n\n```bash\n\
    fakeroot debian/rules clean\n```\n\n选项 B) 下载源代码存档\n\n下载源代码存档 - 这是适用于希望使用额外补丁重新构建标准\
    \ Ubuntu 软件包的用户。使用以下命令安装构建依赖项并提取源代码（到当前目录）：\n\n1. 安装以下软件包：\n\n```bash\nsudo apt-get\
    \ build-dep linux-image-$(uname -r)\n```\n\n选项 C) 下载源代码包并构建\n\n这是适用于希望修改或尝试 Ubuntu\
    \ 打补丁的内核源代码的用户。\n\n1. 从 kernel.org 获取最新的内核源代码。\n\n2. 将存档解压到目录并 cd 进入该目录：\n\n \
    \  ```bash\n   tar xf linux-*.tar.xz\n   cd linux-*\n   ```\n\n3. 构建 ncurses 配置界面：\n\
    \n   ```bash\n   make menuconfig\n   ```\n\n4. 要接受默认配置，按 `→` 高亮显示 `< Exit >`，然后按\
    \ `Return`。\n\n5. 再次按 `Return` 保存配置。\n\n6. 使用 make 构建内核：\n\n   ```bash\n   make\n\
    \   ```\n\n请注意，您可以使用 -j 标志并行编译文件并利用多核优势。\n\n压缩的内核镜像可以在 arch/[arch]/boot/bzImage\
    \ 中找到，其中 [arch] 等于 `uname -a`。\n"
