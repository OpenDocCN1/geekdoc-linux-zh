    \   ```\n\n### Section 19.3: Reasons to use chroot\n\nChanging root is commonly\
    \ done for performing system maintenance on systems where booting and/or logging\
    \ in is no longer possible.\n\nCommon examples are:\n\n- reinstalling the bootloader\n\
    - rebuilding the initramfs image\n- upgrading or downgrading packages\n- resetting\
    \ a forgotten password\n- building software in a clean root environment\n\n##\
    \ Chapter 20: Package Managers\n\n### Section 20.1: How to update packages with\
    \ the apt package manager\n\nThe Advanced Package Tool, aptly named the 'apt'\
    \ package manager can handle the installation and removal of software on the Debian,\
    \ Slackware, and other Linux Distributions. Below are some simple examples of\
    \ use:\n\n**update**\n\nThis option retrieves and scans the Packages.gz files,\
    \ so that information about new and updated packages is available. To do so, enter\
    \ the following command:\n\n```bash\nsudo apt-get update\n```\n\n**upgrade**\n\
    \nThis option is used to install the newest versions of all packages currently\
    \ installed on the system. Packages currently installed with new versions available\
    \ are retrieved and upgraded; under no circumstances are currently installed packages\
    \ removed, or packages not already installed retrieved and installed. To upgrade,\
    \ enter the following command:\n\n```bash\nsudo apt-get upgrade\n```\n\n**dist-upgrade**\n\
    \nIn addition to performing the function of upgrade, dist-upgrade also intelligently\
    \ handles changing dependencies with new versions of packages. It will attempt\
    \ to upgrade the most important packages at the expense of less important ones\
    \ if necessary. To do so, enter the following command:\n\n```bash\nsudo apt-get\
    \ dist-upgrade\n```\n\n### Section 20.2: How to install a package with the pacman\
    \ package manager\n\nIn order to search for packages in the database, searching\
    \ both in packages’ names and descriptions:\n\n```bash\npacman -Ss string1 string2\
    \ …\n```\n\nTo install a single package or list of packages (including dependencies),\
    \ issue the following command:\n\n```bash\nsudo pacman -S package_name1 package_name2\
    \ …\n```\n\n*source*\n\n### Section 20.3: How to update packages with the pacman\
    \ package manager\n\nTo update a specific program:\n\n```bash\nsudo pacman -S\
    \ <programName>\n```\n\nTo update entire the system:\n\n```bash\nsudo pacman -Sy\n\
    ```\n\n### Section 20.4: How to update packages with yum\n\nYellowdog Updater,\
    \ Modified, one of the last remaining vestiges of Yellow Dog Linux, is the package\
    \ manager used by Red Hat, Fedora, and CentOS systems and their derivatives. It\
    \ can handle the installation and removal of software packaged as rpms for these\
    \ Linux distributions. Below are some simple examples of use:\n\n#### search\n\
    \nThis command will attempt to locate software packages in the configured software\
    \ repositories that match the given search criteria, and display the name / version\
    \ / repository location of the matches it finds. To use it, enter the following\
    \ command:\n\n```bash\nyum search <queryString>\n```\n\n#### install\n\nThis command\
    \ will attempt to locate and install the named software from the configured software\
    \ repositories, recursively locating and installing any needed prerequisite software\
    \ as well. To use it, enter the following command:\n\n```bash\nsudo yum install\
    \ <packageName>\n```\n\n#### update\n\nThis option is used to install the newest\
    \ versions of all packages currently installed on the system. Packages currently\
    \ installed with new versions available are retrieved and upgraded; new prerequisites\
    \ are also retrieved and installed as necessary, and replaced or obsoleted packages\
    \ are removed. To upgrade, enter the following command:\n\n```bash\nsudo yum update\n\
    ```\n\nUnlike apt, most yum commands will also automatically check for updates\
    \ to repository metadata if a check has not been done recently (or if forced to\
    \ do so) and will retrieve and scan updated metadata so that information about\
    \ new and updated packages is available before the requested operation is performed.\n\
    \n## Chapter 21: Compiling the Linux kernel\n\n### Section 21.1: Compilation of\
    \ Linux Kernel on Ubuntu\n\n> **Warning:** be sure you have at least 15 GB of\
    \ free disk space.\n\nCompilation in Ubuntu >=13.04\n\nOption A) Use Git\n\nUse\
    \ git if you want to stay in sync with the latest Ubuntu kernel source. Detailed\
    \ instructions can be found in the Kernel Git Guide. The git repository does not\
    \ include necessary control files, so you must build them by:\n\n```bash\nfakeroot\
    \ debian/rules clean\n```\n\nOption B) Download the source archive\n\nDownload\
    \ the source archive - This is for users who want to rebuild the standard Ubuntu\
    \ packages with additional patches. Use a follow command to install the build\
    \ dependencies and extract the source (to the current directory):\n\n1. Install\
    \ the following packages:\n\n```bash\nsudo apt-get build-dep linux-image-$(uname\
    \ -r)\n```\n\nOption C) Download the source package and build\n\nThis is for users\
    \ who want to modify, or play around with, the Ubuntu-patched kernel source.\n\
    \n1. Retrieve the latest kernel source from kernel.org.\n\n2. Extract the archive\
    \ to a directory and cd into it:\n\n   ```bash\n   tar xf linux-*.tar.xz\n   cd\
    \ linux-*\n   ```\n\n3. Build the ncurses configuration interface:\n\n   ```bash\n\
    \   make menuconfig\n   ```\n\n4. To accept the default configuration, press `→`\
    \ to highlight `< Exit >` and then `Return`.\n\n5. Press `Return` again to save\
    \ the configuration.\n\n6. Use make to build the kernel:\n\n   ```bash\n   make\n\
    \   ```\n\nNote that you can use the -j flag to compile files in parallel and\
    \ take advantage of multiple cores.\n\nThe compressed kernel image can be found\
    \ at arch/[arch]/boot/bzImage, where [arch] is equal to `uname -a`.\n"
  mdcn: "\n## 使用 `ifconfig` 工具进行静态配置（临时更改）\n\n可以按照以下方式使用 `ifconfig` 工具向接口添加静态 IP 地址：\n\
