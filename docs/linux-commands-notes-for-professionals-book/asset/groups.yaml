    \n查看当前工作目录中的文件：\n\n```bash\nls\n```\n\n创建一个名为 `myFirstDirectory` 的空目录：\n\n```bash\n\
    mkdir myFirstDirectory\n```\n\n创建多级路径目录：（创建两个目录，src 和 myFirstDirectory）\n\n```bash\n\
    mkdir -p src/myFirstDirectory\n```\n\n将文件移动到目录中：\n\n```bash\nmv myFirstFile myFirstDirectory/\n\
    ```\n\n你也可以重命名文件：\n\n```bash\nuser@linux-computer:~$ mv myFirstFile secondFileName\n\
    ```\n\n将当前工作目录更改为 `myFirstDirectory`：\n\n```bash\ncd myFirstDirectory\n```\n\n\
    删除文件：\n\n```bash\nrm myFirstFile\n```\n\n进入父目录（表示为 `..`）：\n\n```bash\ncd ..\n\
    ```\n\n删除空目录：\n\n```bash\nrmdir myFirstDirectory\n```\n\n删除非空目录（即包含文件和/或其他目录）：\n\
    \n```bash\nrm -rf myFirstDirectory\n```\n\n> *请注意，删除目录时，你删除的是 `.` / 而不是 `/`，后者会清空你的整个文件系统。*\n\
    \n## 第 1.7 节：文件/目录详细信息\n\n`ls` 命令有几个可以组合使用的选项，用于显示更多信息。\n\n### 详细信息/权限\n\n`l`\
    \ 选项显示文件权限、大小和最后修改日期。例如，如果根目录包含一个名为 `test` 的目录和一个文件 `someFile`，命令：\n\n```bash\n\
    user@linux-computer:~$ ls -l\n```\n\n将输出类似以下内容：\n\n```bash\n-rw-r--r-- 1 user\
    \ users     70 Jul 22 13:36 someFile.txt\ndrwxrwxrwx 2 user users  4096 Jul 21\
    \ 07:18 test\n```\n\n权限格式为 drwxrwxrwx。第一个字符代表文件类型，如果是目录则为 d，否则不是。接下来的三个 rwx 是用户对文件的权限，再接下来的三个是组对文件的权限，最后三个是其他所有人对文件的权限。\n\
    \nrwx 中的 r 代表是否可以读取文件，w 代表是否可以修改文件，x 代表是否可以执行文件。如果未授予任何权限，则 r、w 或 x 的位置将是 -。\n\
    \n因此，从上例中可以看出，用户可以读取和修改 someFile.txt，但组只有只读权限。\n\n如果你有 sudo 权限，可以使用 `chmod ###\
    \ fileName` 命令来更改权限。r 由值 4 表示，w 由 2 表示，x 由 1 表示。因此，如果你只想能够修改 test 目录的内容\n\n```bash\n\
    Owner rwx = 4+2+1 = 7\nGroup r-x = 4+0+1 = 5\nOther r-x = 4+0+1 = 5\n```\n\n因此，整个命令是\n\
    \n```bash\nchmod 755 test\n```\n\n现在执行 `ls -l` 将显示类似以下内容：\n\n```bash\ndrwxr-xr-x\
    \ 2 user users  4096 Jul 21 07:20 test\n```\n\n### 可读大小\n\n与 l 选项一起使用的 h 选项显示人类可读的文件大小。运行\n\
    \n```bash\nuser@linux-computer:~$ ls -lh\n```\n\n将输出：\n\n```bash\ntotal 4166\n\
    -rw-r--r-- 1 user users     70 Jul 22 13:36 someFile.txt\ndrwxrwxrwx 2 user users\
