    \n- `top` 按当前系统资源使用情况排序列出所有进程。显示进程的持续更新视图（默认每 3 秒一次）。使用 q 键退出 top。\n- `ps` 列出当前\
    \ shell 会话中正在运行的进程\n- `ps -u root` 列出 root 正在运行的所有进程和命令\n- `ps aux` 列出当前系统上所有用户的所有进程\n\
    \n## 第 1.5 节：按名称/内容模式搜索文件\n\n使用 Linux 命令行（shell）的人常见的任务之一是搜索具有特定名称或包含特定文本的文件/目录。为了完成此任务，你应该熟悉以下\
    \ 2 个命令：\n\n### 按名称查找文件\n\n```bash\nfind /var/www -name '*.css'\n```\n\n这将打印出\
    \ `/var/www` 下所有以 `.css` 结尾的文件的完整路径/文件名。示例输出：\n\n```bash\n/var/www/html/text-cursor.css\n\
    /var/www/html/style.css\n```\n\n更多信息：\n\n```bash\nman find\n```\n\n### 查找包含文本的文件\n\
