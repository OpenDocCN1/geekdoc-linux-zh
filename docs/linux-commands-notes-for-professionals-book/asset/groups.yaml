    \ directory is a life saving action to find out what application/service or user\
    \ is consuming your disk space wildly. For example, in case of a ridiculously\
    \ low level of disk space availability for a web and mail server, the reason could\
    \ be a spam attack to your mail service and you can diagnose it just by using\
    \ du command.\n\nInvestigate root directory for disk usage:\n\n```\n```bash\n\
    sudo du -sch .[!.] / *\n```\n```\n\nExample output:\n\n```\n```\n16K \t/.VolumeIcon.icns\n\
    24K \t/.VolumeIcon.png\n13M \t/bin\n57M \t/boot\n4,0K \t/cdrom\n620K \t/dev\n\
    13M \t/etc\n779M \t/home\n0 \t\t/initrd.img\n406M \t/lib\n3,9M \t/lib32\n4,0K\
    \ \t/lib64\n16K \t/lost+found\n4,0K \t/media\n4,0K \t/mnt\n367M \t/opt\ndu: cannot\
    \ access '/proc/18221/task/18221/fd/4': No such file or directory\ndu: cannot\
    \ access '/proc/18221/task/18221/fdinfo/4': No such file or directory\ndu: cannot\
    \ access '/proc/18221/fd/4': No such file or directory\n```\n```"
  md: "\n# Chapter 4: Shell\n\nThe shell executes a program in response to its prompt.\
    \ When you give a command, the shell searches for the program, and then executes\
    \ it. For example, when you give the command ls, the shell searches for the utility/program\
    \ named ls, and then runs it in the shell. The arguments and the options that\
    \ you provide with the utilities can impact the result that you get. The shell\
    \ is also known as a CLI, or command line interface.\n\n## Section 4.1: Changing\
    \ default shell\n\nMost modern distributions will come with BASH (**Bourne Again\
    \ Shell**) pre-installed and configured as a default shell.\n\nThe command (actually\
    \ an executable binary, an ELF) that is responsible for changing shells in Linux\
    \ is `chsh` (**change shell**).\n\nWe can first check which shells are already\
    \ installed and configured on our machine by using the `chsh -l` command, which\
    \ will output a result similar to this:\n\n```bash\n[user@localhost ~]$ chsh -l\n\
    /bin/sh\n/bin/bash\n/sbin/nologin\n/usr/bin/sh\n/usr/bin/bash\n/usr/sbin/nologin\n\
    /usr/bin/fish\n```\n\nIn some Linux distributions, `chsh -l` is invalid. In this\
    \ case, the list of all available shells can be found at `/etc/shells` file. You\
    \ can show the file contents with `cat`:\n\n```bash\n[user@localhost ~]$ cat /etc/shells\n\
    # /etc/shells: valid login shells\n/bin/sh\n/bin/bash\n/sbin/nologin\n/usr/bin/sh\n\
    /usr/bin/bash\n/usr/sbin/nologin\n/usr/bin/fish\n```\n\nNow we can choose our\
    \ new default shell, e.g. fish, and configure it by using `chsh -s`,\n\n```bash\n\
    [user@localhost ~]$ chsh -s /usr/bin/fish\nChanging shell for user.\nPassword:\n\
    Shell changed.\n```\n\nNow all that is left to do is perform a logoff-logon cycle,\
    \ and enjoy our new default shell.\n\nIf you wish to change the default shell\
    \ for a different user, and you have administrative privileges on the machine,\
    \ you'll be able to accomplish this by using `chsh` as root. So assuming we want\
    \ to change `user_2`'s default shell to fish, we will use the same command as\
    \ before, but with the addition of the other user's username, `chsh -s /usr/bin/fish\
    \ user_2`.\n\nIn order to check what the current default shell is, we can view\
    \ the `$SHELL` environment variable, which points to the path to our default shell,\
    \ so after our change, we would expect to get a result similar to this,\n\n```bash\n\
    ~ $ echo $SHELL\n/usr/bin/fish\n```\n\n**chsh options**:\n\n- `-s shell`\n  -\
    \ Sets shell as the login shell.\n- `-l, --list-shells`\n  - Print the list of\
    \ shells listed in /etc/shells and exit.\n- `-h, --help`\n  - Print a usage message\
    \ and exit.\n- `-v, --version`\n  - Print version information and exit.\n\n##\
    \ Section 4.2: Basic Shell Utilities\n\n### Customizing the Shell prompt\n\nDefault\
    \ command prompt can be changed to look different and short. In case the current\
    \ directory is long default command prompt becomes too large. Using PS1 becomes\
    \ useful in these cases. A short and customized command prompt is pretty and elegant.\
    \ In the table below PS1 has been used with a number of arguments to show different\
    \ forms of shell prompts. Default command prompt looks something like this: user@host:\
    \ ~ $ in my case it looks like this: bruce@gotham ~ $. It can be changed as per\
    \ the table below:\n\n| Command | Utility |\n| :--- | :--- |\n| `PS1='\\w $ '`\
    \ | ~ $ shell prompt as directory name. In this case root directory is Root. |\n\
    | `PS1='\\h $ '` | gotham $ shell prompt as hostname |\n| `PS1='\\u $ '` | bruce\
    \ $ shell prompt as username |\n| `PS1='\\t $ '` | 22:37:31 $ shell prompt in\
    \ 24 hour format |\n| `PS1='\\@ $ '` | 10:37 PM shell prompt in 12 hour time format\
    \ |\n| `PS1='\\! $ '` | 732 will show the history number of command in place of\
    \ shell prompt |\n| `PS1='dude $ '` | dude $ will show the shell prompt the way\
    \ you like |\n\n### Some basic shell commands\n\n| Command | Utility |\n| :---\
    \ | :--- |\n| Ctrl-k | cut/kill |\n| Ctrl-y | yank/paste |\n| Ctrl-a | will take\
    \ cursor to the start of the line |\n| Ctrl-e | will take cursor to the end of\
    \ the line |\n| Ctrl-d | will delete the character after/at the cursor |\n| Ctrl-l\
    \ | will clear the screen/terminal |\n| Ctrl-u | will clear everything between\
    \ prompt and the cursor |\n| Ctrl-_ | will undo the last thing typed on the command\
    \ line |\n| Ctrl-c | will interrupt/stop the job/process running in the foreground\
    \ |\n| Ctrl-r | reverse search in history |\n| `~/.bash_history` | stores last\
    \ 500 commands/events used on the shell |\n| `history` | will show the command\
    \ history |\n| `history \\| grep <key-word>` | will show all the commands in history\
    \ having keyword `<key-word>` (useful in cases when you remember part of the command\
    \ used in the past) |\n\n## Section 4.3: Create Your Own Command Alias\n\nIf you\
    \ are tired of using long commands in bash you can create your own command alias.\n\
    \nThe best way to do this is to modify (or create if it does not exist) a file\
    \ called `.bash_aliases` in your home folder. The general syntax is:\n\n```bash\n\
    alias command_alias='actual_command'\n```\n\nwhere `actual_command` is the command\
    \ you are renaming and `command_alias` is the new name you have given it. For\
    \ example\n\n```bash\nalias install='sudo apt-get -y install'\n```\n\nmaps the\
    \ new command alias `install` to the actual command `sudo apt-get -y install`.\
    \ This means that when you use **install** in a terminal this is interpreted by\
    \ bash as **sudo apt-get -y install**.\n\n## Section 4.4: Locate a file on your\
    \ system\n\nUsing bash you can easily locate a file with the `locate` command.\
    \ For example say you are looking for the file `mykey.pem`:\n\n```bash\nlocate\
    \ mykey.pem\n```\n\nSometimes files have strange names for example you might have\
    \ a file like `random7897_mykey_0f1dw.pem`. Let's say you're looking for this\
    \ file but you only remember the mykey and pem parts. You could combine the `locate`\
    \ command with `grep` using a pipe like this:\n\n```bash\nlocate pem | grep mykey\n\
    ```\n\nWhich would bring up all results which contain both of these pieces.\n\n\
    Note that not all systems have the `locate` utility installed, and many that do\
    \ have not enabled it. `locate` is fast and efficient because it periodically\
    \ scans your system and caches the names and locations for every file on it, but\
    \ if that data collection is not enabled then it cannot tell you anything. You\
    \ can use `updatedb` to manually initiate the filesystem scan in order to update\
    \ the cached info about files on your filesystem.\n\nShould you not have a working\
    \ `locate`, you can fall back on the `find` utility:\n\n```bash\nfind / -name\
    \ mykey.pem -print\n```\n\nis roughly equivalent to `locate mykey.pem` but has\
    \ to scan your filesystem(s) each time you run it for the file in question, rather\
    \ than using cached data. This is obviously slower and less efficient, but more\
    \ real-time. The `find` utility can do much more than find files, but a full description\
    \ of its capabilities is beyond the scope of this example.\n\n# Chapter 5: Check\
    \ Disk Space\n\n## Section 5.1: Investigate Directories For Disk Usage\n\nSometimes\
    \ it may be required to find out which directory is consuming how much disk space\
    \ especially when you are used df -h and realized your available disk space is\
    \ low.\n\n**du:**\n\n`du` command summarizes disk usage of the set of FILEs, recursively\
    \ for directories.\n\nIt’s often used with -sh option:\n\n```bash\n-S, --summarize\n\
    display only a total for each argument\n-h, --human-readable\nprint sizes in human\
    \ readable format (e.g., 1K 234M 2G)\n```\n\nFor summarizing disk usages of the\
    \ files in the current directory we use:\n\n```bash\ndu -sh *\n```\n\nExample\
    \ output:\n\n```text\n572K\tDocuments\n208M\tDownloads\n4,0K\tMusic\n724K\tPictures\n\
    4,0K\tPublic\n4,0K\tTemplates\n4,0K\tVideos\n```\n\nWe can also include hidden\
    \ files with using:\n\n```bash\ndu -sh .[!.]* *\n```\n\nExample output:\n\n```text\n\
    6,3M\t.atom\n4,0K\t.bash_history\n4,0K\t.bash_logout\n8,0K\t.bashrc\n350M\t.cache\n\
    195M\t.config\n12K\t.dbus\n4,0K\t.dmr c\n44K\t.gconf\n60K\t.gem\n520K\t.gimp-2.8\n\
    28K\t.gnome\n4,0K\t.ICEauthority\n8,3M\t.local\n8,0K\t.nano\n404K\t.nv\n36K\t\
    .pki\n4,0K \t.profile\n8,0K \t.ssh\n0 \t\t_sudo_as_admin_successful\n4,0K \t.Xauthority\n\
    4,0K \t.xsession-errors\n4,0K \t.xsession-errors.old\n572K \tDocuments\n208M \t\
    Downloads\n4,0K \tMusic\n724K \tPictures\n4,0K \tPublic\n4,0K \tTemplates\n4,0K\
    \ \tVideos\n```\n\nThirdly, you can add total to the output by adding `du -sch\
    \ .[!.]* *` option:\n\n```bash\ndu -sch .[!.]* *\n```\n\nResult:\n\n```text\n\
    .\n.\n.\n4,0K \tTemplates\n4,0K \tVideos\n769M \ttotal\n```\n\n**Most importantly**\
    \ using du command properly on the root directory is a life saving action to find\
    \ out what application/service or user is consuming your disk space wildly. For\
    \ example, in case of a ridiculously low level of disk space availability for\
    \ a web and mail server, the reason could be a spam attack to your mail service\
    \ and you can diagnose it just by using du command.\n\nInvestigate root directory\
    \ for disk usage:\n\n```bash\nsudo du -sch .[!.]* / *\n```\n\nExample output:\n\
    \n```text\n16K \t/.VolumeIcon.icns\n24K \t/.VolumeIcon.png\n13M \t/bin\n57M \t\
    /boot\n4,0K \t/cdrom\n620K \t/dev\n13M \t/etc\n779M \t/home\n0 \t\t/initrd.img\n\
    406M \t/lib\n3,9M \t/lib32\n4,0K \t/lib64\n16K \t/lost+found\n4,0K \t/media\n\
    4,0K \t/mnt\n367M \t/opt\ndu: cannot access '/proc/18221/task/18221/fd/4': No\
    \ such file or directory\ndu: cannot access '/proc/18221/task/18221/fdinfo/4':\
    \ No such file or directory\ndu: cannot access '/proc/18221/fd/4': No such file\
    \ or directory\n```\n"
  mdcn: "\n\n# 第 4 章：Shell（外壳）\n\nShell 会根据其提示符执行程序。当您输入命令时，Shell 会搜索该程序，然后执行它。例如，当您输入命令\
    \ `ls` 时，Shell 会搜索名为 `ls` 的工具/程序，然后在 Shell 中运行它。您为工具提供的参数和选项可能会影响您得到的结果。Shell\
    \ 也被称为 CLI，即命令行界面。\n\n## 4.1 节：更改默认 Shell\n\n大多数现代 Linux 发行版都会预装并配置 BASH（**Bourne\
    \ Again Shell**）作为默认 Shell。\n\n负责在 Linux 中更改 Shell 的命令（实际上是一个可执行二进制文件，即 ELF）是\
    \ `chsh`（**change shell**）。\n\n我们可以首先使用 `chsh -l` 命令检查我们的机器上已经安装并配置了哪些 Shell，该命令的输出结果类似于以下内容：\n\
    \n```bash\n[user@localhost ~]$ chsh -l\n/bin/sh\n/bin/bash\n/sbin/nologin\n/usr/bin/sh\n\
    /usr/bin/bash\n/usr/sbin/nologin\n/usr/bin/fish\n```\n\n在某些 Linux 发行版中，`chsh -l`\
    \ 是无效的。在这种情况下，可以在 `/etc/shells` 文件中找到所有可用 Shell 的列表。你可以使用 `cat` 命令显示文件内容：\n\n\
    ```bash\n[user@localhost ~]$ cat /etc/shells\n# /etc/shells: valid login shells\n\
    /bin/sh\n/bin/bash\n/sbin/nologin\n/usr/bin/sh\n/usr/bin/bash\n/usr/sbin/nologin\n\
    /usr/bin/fish\n```\n\n现在我们可以选择我们的新默认 Shell，例如 fish，并使用 `chsh -s` 进行配置：\n\n```bash\n\
    [user@localhost ~]$ chsh -s /usr/bin/fish\nChanging shell for user.\nPassword:\n\
    Shell changed.\n```\n\n现在剩下的工作就是执行一次注销-登录循环，然后就可以享受我们的新默认 Shell 了。\n\n如果您希望为其他用户更改默认\
    \ Shell，并且您在机器上拥有管理员权限，那么您可以使用 `chsh` 以 root 身份来完成任务。因此，假设我们要将 `user_2` 的默认 Shell\
    \ 更改为 fish，我们将使用与之前相同的命令，但加上另一个用户的用户名，即 `chsh -s /usr/bin/fish user_2`。\n\n为了检查当前的默认\
    \ Shell 是什么，我们可以查看 `$SHELL` 环境变量，它指向我们默认 Shell 的路径。因此，在更改之后，我们预计会得到类似这样的结果：\n\n\
    ```bash\n~ $ echo $SHELL\n/usr/bin/fish\n```\n\n**chsh 选项**：\n\n- `-s shell`\n\
    \  - 将 shell 设置为登录 Shell。\n- `-l, --list-shells`\n  - 打印 /etc/shells 中列出的 Shell\
    \ 列表并退出。\n- `-h, --help`\n  - 打印用法消息并退出。\n- `-v, --version`\n  - 打印版本信息并退出。\n\n\
    ## 4.2 节：基础 Shell 工具\n\n### 自定义 Shell 提示符\n\n默认的命令提示符可以被更改，使其外观不同且更简短。如果当前目录路径很长，默认的命令提示符就会变得太大。在这种情况下，使用\
    \ PS1 会很有用。一个简短且自定义的命令提示符既美观又优雅。在下表中，PS1 配合多个参数使用，以显示不同形式的 Shell 提示符。默认的命令提示符看起来像这样：user@host:\
    \ ~ $。在我的情况下，它看起来像这样：bruce@gotham ~ $。可以按照下表进行更改：\n\n| 命令 | 用途 |\n| :--- | :---\
    \ |\n| `PS1='\\w $ '` | ~ $ 以目录名作为 Shell 提示符。在这种情况下，根目录是 Root。 |\n| `PS1='\\h\
    \ $ '` | gotham $ 以主机名作为 Shell 提示符 |\n| `PS1='\\u $ '` | bruce $ 以用户名作为 Shell\
    \ 提示符 |\n| `PS1='\\t $ '` | 22:37:31 $ 以 24 小时制时间格式作为 Shell 提示符 |\n| `PS1='\\\
    @ $ '` | 10:37 PM 以 12 小时制时间格式作为 Shell 提示符 |\n| `PS1='\\! $ '` | 732 将显示命令的历史编号，代替\
    \ Shell 提示符 |\n| `PS1='dude $ '` | dude $ 将以你喜欢的方式显示 Shell 提示符 |\n\n### 一些基本的\
    \ Shell 命令\n\n| 命令 | 用途 |\n| :--- | :--- |\n| Ctrl-k | 剪切/杀死 |\n| Ctrl-y | 复制/粘贴\
    \ |\n| Ctrl-a | 将光标移至行首 |\n| Ctrl-e | 将光标移至行尾 |\n| Ctrl-d | 删除光标处/后的字符 |\n| Ctrl-l\
    \ | 清屏/清除终端 |\n| Ctrl-u | 清除提示符和光标之间的所有内容 |\n| Ctrl-_ | 撤销在命令行上输入的最后操作 |\n| Ctrl-c\
    \ | 中断/停止在前台运行的作业/进程 |\n| Ctrl-r | 在历史记录中反向搜索 |\n| `~/.bash_history` | 存储 Shell\
    \ 上使用的最后 500 条命令/事件 |\n| `history` | 显示命令历史 |\n| `history \\| grep <key-word>`\
    \ | 显示历史记录中包含关键字 `<key-word>` 的所有命令（当您记得过去使用的部分命令时很有用） |\n\n## 4.3 节：创建自己的命令别名\n\
    \n如果您厌倦了在 bash 中使用长长的命令，您可以创建自己的命令别名。\n\n最佳做法是修改（或如果不存在则创建）主目录中一个名为 `.bash_aliases`\
    \ 的文件。通用语法是：\n\n```bash\nalias command_alias='actual_command'\n```\n\n其中 `actual_command`\
    \ 是您重命名的命令，而 `command_alias` 是您给它的新名字。例如：\n\n```bash\nalias install='sudo apt-get\
    \ -y install'\n```\n\n将新的命令别名 `install` 映射到实际命令 `sudo apt-get -y install`。这意味着当你在终端中使用\
    \ **install** 时，bash 会将其解释为 **sudo apt-get -y install**。\n\n## 4.4 节：定位系统中的文件\n\
    \n使用 bash，你可以很容易地通过 `locate` 命令定位文件。例如，假设你要寻找文件 `mykey.pem`：\n\n```bash\nlocate\
    \ mykey.pem\n```\n\n有时文件名很奇特，例如你可能有一个名为 `random7897_mykey_0f1dw.pem` 的文件。假设你在寻找这个文件，但只记得\
    \ mykey 和 pem 部分。你可以像这样通过管道结合使用 `locate` 命令和 `grep`：\n\n```bash\nlocate pem |\
    \ grep mykey\n```\n\n这将列出包含这两个部分的所有结果。\n\n请注意，并非所有系统都安装了 `locate` 工具，而且许多已安装的系统未启用它。`locate`\
    \ 快速高效，因为它定期扫描你的系统并缓存其中每个文件的名称和位置，但如果未启用该数据收集，则无法提供信息。你可以使用 `updatedb` 手动启动文件系统扫描，以更新有关文件系统中文件的缓存信息。\n\
    \n如果你没有可用的 `locate`，可以退而使用 `find` 工具：\n\n```bash\nfind / -name mykey.pem -print\n\
    ```\n\n它大致等同于 `locate mykey.pem`，但每次运行查找目标文件时都需要扫描你的文件系统，而不是使用缓存数据。这显然更慢、效率更低，但更实时。`find`\
    \ 工具的功能远不止查找文件，但其完整功能说明超出了本示例的范围。\n\n# 第 5 章：检查磁盘空间\n\n## 5.1 节：调查目录的磁盘使用情况\n\n\
    有时可能需要找出哪个目录消耗了多少磁盘空间，尤其是当你使用 `df -h` 并意识到可用磁盘空间较低时。\n\n**du 命令：**\n\n`du` 命令总结一组文件的磁盘使用情况，对于目录则递归计算。\n\
    \n它常与 `-sh` 选项一起使用：\n\n```bash\n-S, --summarize\n仅显示每个参数的总计\n-h, --human-readable\n\
    以人类可读格式打印大小（例如，1K 234M 2G）\n```\n\n要总结当前目录中文件的磁盘使用情况，我们使用：\n\n```bash\ndu -sh\
    \ *\n```\n\n示例输出：\n\n```text\n572K\tDocuments\n208M\tDownloads\n4,0K\tMusic\n\
    724K\tPictures\n4,0K\tPublic\n4,0K\tTemplates\n4,0K\tVideos\n```\n\n使用以下命令还可以包含隐藏文件：\n\
    \n```bash\ndu -sh .[!.]* *\n```\n\n示例输出：\n\n```text\n6,3M\t.atom\n4,0K\t.bash_history\n\
    4,0K\t.bash_logout\n8,0K\t.bashrc\n350M\t.cache\n195M\t.config\n12K\t.dbus\n4,0K\t\
    .dmr c\n44K\t.gconf\n60K\t.gem\n520K\t.gimp-2.8\n28K\t.gnome\n4,0K\t.ICEauthority\n\
    8,3M\t.local\n8,0K\t.nano\n404K\t.nv\n36K\t.pki\n4,0K \t.profile\n8,0K \t.ssh\n\
    0 \t\t_sudo_as_admin_successful\n4,0K \t.Xauthority\n4,0K \t.xsession-errors\n\
    4,0K \t.xsession-errors.old\n572K \tDocuments\n208M \tDownloads\n4,0K \tMusic\n\
    724K \tPictures\n4,0K \tPublic\n4,0K \tTemplates\n4,0K \tVideos\n```\n\n第三，通过添加\
    \ `du -sch .[!.]* *` 选项，你可以在输出中增加总计：\n\n```bash\ndu -sch .[!.]* *\n```\n\n结果：\n\
    \n```text\n.\n.\n.\n4,0K \tTemplates\n4,0K \tVideos\n769M \ttotal\n```\n\n**最重要的是**，正确地在根目录上使用\
