    # Section 1.5: Searching for files by patterns in name/contents


    A common and task of someone using the Linux Command Line (shell) is to search
    for files/directories with a certain name or containing certain text. There are
    2 commands you should familiarise yourself with in order to accomplish this:


    # Find files by name


    ```

    `find /var/www -name ''*.css''`

    ```


    This will print out the full path/filename to all files under `/var/www` that
    end in `.css`. Example output:


    ```

    `/var/www/html/text-cursor.css

    /var/www/html/style.css`

    ```


    For more info:


    ```

    `man find`

    ```


    # Find files containing text


    ```

    `grep font /var/www/html/style.css`

    ```


    This will print all lines containing the pattern font in the specified file. Example
    output:


    ```

    `font-weight: bold;

    font-family: monospace;`

    ```


    Another example:


    ```

    `grep font /var/www/html/`

    ```'
