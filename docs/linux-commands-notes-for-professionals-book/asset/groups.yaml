    # Chapter 2: Detecting Linux distribution name and version


    ## Section 2.1: Detect what debian-based distribution you are working in


    Just execute `lsb_release` `--a`.


    On Debian:


    ```

    $ lsb_release --a

    No LSB modules are available.

    Distributor ID: Debian

    Description:    Debian GNU/Linux testing (stretch)

    Release:        testing

    Codename:       stretch

    ```


    On Ubuntu:


    ```

    $ lsb_release --a

    No LSB modules are available.

    Distributor ID: Ubuntu

    Description:    Ubuntu 14.04.4 LTS

    Release:        14.04

    Codename:       trusty

    ```


    In case when you don''t have `lsb_release` installed you may want to try some
    guessing, for example, there is a file `/etc/issue` that often contains distribution
    name. For example, on ubuntu:


    ```

    $ cat /etc/issue

    Ubuntu 12.04.5 LTS \n \l

    ```


    Don''t use file `/etc/debian_version` because its contents do not match distribution
    name!


    *Note that this will also work on non-Debian-family distributions like Fedora,
    RHEL, or openSUSE — but that `lsb_release` may not be installed.*


    ## Section 2.2: Detect what systemd-based distribution you are using


    This method will work on modern versions of Arch, CentOS, CoreOS, Debian, Fedora,
    Mageia, openSUSE, Red Hat Enterprise Linux, SUSE Linux Enterprise Server, Ubuntu,
    and others. This wide applicability makes it an ideal as a first approach, with
    fallback to other methods if you need to also identify older systems.


    Look at `/etc/os-release`. In specific, look at variables NAME, VERSION, ID, VERSION_ID,
    and PRETTY_NAME.


    On Fedora, this file might look like:


    ```

    NAME=Fedora

    VERSION="24 (Workstation Edition)"

    ID=fedora

    VERSION_ID=24

    PRETTY_NAME="Fedora 24 (Workstation Edition)"

    ANSI_COLOR="0;34"

    CPE_NAME="cpe:/o:fedoraproject:fedora:24"

    HOME_URL="https://fedoraproject.org/"

    BUG_REPORT_URL="https://bugzilla.redhat.com/"

    REDHAT_BUGZILLA_PRODUCT="Fedora"

    REDHAT_BUGZILLA_PRODUCT_VERSION=24

    REDHAT_SUPPORT_PRODUCT="Fedora"

    REDHAT_SUPPORT_PRODUCT_VERSION=24

    PRIVACY_POLICY_URL=https://fedoraproject.org/wiki/Legal:PrivacyPolicy

    VARIANT="Workstation Edition"

    VARIANT_ID=workstation

    ```


    On CentOS, this file might look like this:


    ```

    NAME="CentOS Linux"

    VERSION="7 (Core)"

    ID="centos"

    ID_LIKE="rhel fedora"

    VERSION_ID="7"

    PRETTY_NAME="CentOS Linux 7 (Core)"

    ANSI_COLOR="0;31"

    CPE_NAME="cpe:/o:centos:centos:7"

    HOME_URL="https://www.centos.org/"

    BUG_REPORT_URL="https://bugs.centos.org/"


    CENTOS_MANTISBT_PROJECT="CentOS-7"

    CENTOS_MANTISBT_PROJECT_VERSION="7"

    REDHAT_SUPPORT_PRODUCT="centos"

    REDHAT_SUPPORT_PRODUCT_VERSION="7"

    ```


    This file is documented on the freedesktop web site; in principle, it is not systemd
    specific — but it will exist on all systemd-based distributions.


    From the bash shell, one can source the /etc/os-release file and then use the
    various variables directly, like this:


    ```

    $ ( source /etc/os-release && echo "$PRETTY_NAME" )

    Fedora 24 (Workstation Edition)

    ```


    ## Section 2.3: Detect what RHEL / CentOS / Fedora distribution you are working
    in


    Look at the contents of /etc/redhat-release


    ```

    cat /etc/redhat-release

    ```


    Here is the output from a Fedora 24 machine: Fedora release 24 (Twenty Four)


    As mentioned in the debian-based response, you can also use the lsb_release -a
