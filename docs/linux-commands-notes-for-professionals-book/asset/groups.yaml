    \        431G  145G  264G  36% /var\ndevtmpfs                7.8G  204K  7.8G\
    \   1% /dev\ntmpfs                   7.8G  4.0K  7.8G   1% /dev/shm\n/dev/fmd1\
    \               495M  126M  344M  27% /boot\nku.example.com:9421     2.5T  487G\
    \  2.0T  20% /mnt/test\ntmpfs                   500M   86M  415M  18% /var/nginx_pagspeed_cache\n\
    ```\n\n在这个示例中，我们有一个 95% 已满的 `/` 分区，以及一个仅 36% 已满的额外 `/var` 分区。它还有一个挂载在 `/mnt/test`\
    \ 上的 2T 外部网络挂载，以及一个挂载在 `/var/ngx_pagespeed_cache` 上的 500M 内存盘/tmpfs 挂载。\n\n##\
    \ 第 6 章：获取系统信息\n\n获取系统相关信息的命令集合。\n\n### 6.1 节：关于 CPU、内存、网络和磁盘（I/O 操作）的统计数据\n\n\
    要获取 Linux 系统主要组件的一般统计数据，`stat` 系列命令极其有用\n\n#### CPU\n\n要获取与处理器相关的统计数据，您可以使用 mpstat\
    \ 命令，但配合某些选项可以获得更好的可视性：\n\n```\n$ mpstat 2 10\n```\n\n#### 内存\n\n我们都知道命令 `free`\
    \ 用于显示（剩余）RAM 的数量，但要查看包括 I/O 操作在内的所有统计信息：\n\n```\n$ vmstat 2 10\n```\n\n#### 磁盘\n\
    \n要实时获取有关磁盘操作的一般信息，您可以利用 iostat。\n\n```\n$ iostat -kx 2\n```\n\n#### 网络\n\n为了能够查看网络服务正在发生什么，您可以使用\
    \ `netstat`\n\n```\n$ `netstat` -ntl # 打开的 TCP 套接字\n$ `netstat` -nul # 打开的 UDP\
    \ 套接字\n$ `netstat` -nxl # 打开的 Unix 套接字\n```\n\n但您可以找到有用的监控工具来实时查看网络流量：\n\n```\n\
    $ `sudo` iftop\n```\n\n#### 可选\n\n要实时生成与所有组件 I/O 操作相关的统计数据，您可以使用 dstat。该工具是 `vmstat`、iostat\
    \ 和 ifstat 的多功能替代方案\n\n### 6.2 节：使用 lscpu 和 lshw 等工具\n\n通过使用 lscpu 等工具，因为 lscpu\
    \ 是获取 CPU 信息的简单方式。\n\n```\n$ `lscpu`\n架构:        x86_64\nCPU 操作模式:      32位, 64位\n\
    字节顺序:          小端序\nCPU(s): 4\n在线 CPU 列表: 0-3\n每核线程数: 1\n每插座核心数: 4\n插座数: 1\nNUMA\
    \ 节点数: 1\n供应商 ID: GenuineIntel\nCPU 家族: 6\n型号: 23\n步进: 10\nCPU MHz: 1998.000\n\
    BogoMIPS: 5303.14\n虚拟化: VT-x\nL1d 缓存: 32K\nL1i 缓存: 32K\nL2 缓存: 2048K\nNUMA 节点0\
    \ CPU(s): 0-3\n```\n\n通过使用 lshw 工具\n\n```\n$ lshw | grep cpu\n\ndf1-ws-5084\n\
    \ description: Computer\n width: 64 bits\n capabilities: vsyscall32\n*-core\n\
    \ description: Motherboard\n physical id: 0\n*-memory\n description: System memory\n\
    \ physical id: 0\n size: 5881MiB\n*-cpu\n product: Intel(R) Pentium(R) CPU G3220\
    \ @ 3.00GHz\n vendor: Intel Corp.\n physical id: 1\n bus info: cpu@0\n size: 3GHz\n\
    \ capacity: 3GHz\n width: 64 bits\n```\n\n### 6.3 节：列出硬件\n\n**Ubuntu：**\n\n**lshw**\
    \ 是一个提取机器硬件配置详细信息的小型工具。它可以报告确切的内存配置、固件版本、主板配置、CPU 版本和速度、缓存配置、总线速度等。\n\n```\n$\
    \ sudo lshw | less (或 more)\n$ sudo lshw -html > myhardware.html\n$ sudo lshw\
    \ -xml > myhardware.xml\n```\n\n显示 PCI 信息\n\n```\n$ lspci -tv\n```\n\n查看 USB 信息\n\
    \n```\n$ lsusb -tv\n```\n\n显示 BIOS 信息\n\n```\n$ dmidecode -q | less\n```\n\n要查看磁盘（示例中为\
    \ disk sda）的具体信息，您可以使用：\n\n```\n$ hdparm -i /dev/sda\n```\n\n一些额外的实用程序/命令将有助于收集一些额外的信息：\n\
    \n```\n$ smartctl -A /dev/sda | grep Power_On_Hours # 此磁盘（系统）总共已通电多长时间\n$ hdparm\
    \ -tT /dev/sda # 对磁盘 sda 进行读取速度测试\n$ badblocks -s /dev/sda # 测试磁盘 sda 上的不可读块\n\
    ```\n\n### 6.4 节：查找 CPU 型号/速度信息\n\n**Ubuntu：**\n\n```\n$ cat /proc/cpuinfo\n```\n\
    \n示例输出：\n\n```\nprocessor       : 0\nvendor_id       : GenuineIntel\ncpu family\
    \      : 6\nmodel           : 15\nmodel name      : Intel(R) Core(TM)2 Quad CPU\
    \    Q6600  @ 2.40GHz\nstepping        : 11\ncpu MHz         : 1596.000\ncache\
    \ size      : 4096 KB\nphysical id     : 0\nsiblings        : 4\ncore id     \
    \    : 0\ncpu cores       : 4\napicid          : 0\ninitial apicid  : 0\nfpu \
    \            : yes\nfpu_exception   : yes\ncpu level       : 10\nwp          \
    \    : yes\nflags           : fpu vme de pse tsc msr pae mce cx8 apic sep mtrr\
    \ pge mcm ccmov pat pse36 clfns dt\n acpi mmx fxsr sse sse2 ss ht tm pbe syscall\
    \ nx lm constant_tsc arch_perfmon pebs bts rep_good pni\ndtes64 monitor ds_cpl\
    \ vmx est tm2 ssse3 cx16 xtpr pdcm lahf_lm tpr_shadow vnmi flexpriority\nbogomips\
    \        : 4800.18\nclflush size    : 64\ncache alignment : 64\naddress sizes\
    \   : 36 bits physical, 48 bits virtual\npower management:\n\nmodel          :\
    \ 15\nmodel name     : Intel(R) Core(TM)2 Quad CPU  Q6600 @ 2.40GHz\nstepping\
    \       : 11\ncpu MHz        : 1596.000\ncache size     : 4096 KB\nphysical id\
    \    : 0\nsiblings       : 4\ncore id        : 3\ncpu cores      : 4\napicid \
    \        : 3\ninitial apicid : 3\nfpu            : yes\nfpu exception  : yes\n\
    cpuid level    : 10\nwp             : yes\nflags          : fpu vme de pse tsc\
    \ msr pae mce cx8 apic sep mtrr pge mca cmov pat pse36 clflush dts\nacpi mmx fxsr\
    \ sse sse2 ss ht tm pbe syscall nx lm constant_tsc arch_perfmon pni pebs bts rep_good\
    \ pni\ndtes64 monitor ds_cpl vmx est tm2 ssse3 cx16 xtpr pdcm lahf_lm tpr_shadow\
    \ vnmi flexpriority\nbogomips       : 4800.30\ncflush size    : 64\ncache_alignment\
    \ : 64\naddress sizes  : 36 bits physical, 48 bits virtual\npower management:\n\
    ```\n\n**统计处理器（包括核心）：**\n\n```\n$ grep -c processor /proc/cpuinfo\n```\n\n###\
    \ 6.5 节：进程监控和信息收集\n\n总体而言，在 linux 主机上监控进程有两种方式\n\n**静态监控**\n\n最常用的命令是 *ps*（即，进程状态），该命令用于提供有关当前运行进程的信息，包括它们的进程标识符（PIDs）。\n\
    \n这里有一些用于收集特定信息的有用选项。\n\n以层级结构列出进程\n\n```\n$ ps -e -o pid,args --forest\n```\n\
    \n按 % CPU 使用率排序列出进程\n\n```\n$ ps -e -o pcpu,cpu,nice,state,cputime,args --sort\
    \ pcpu | sed '/^ 0.0 /d'\n```\n\n按内存 (KB) 使用率排序列出进程。\n\n```\n$ ps -e -orss=,args=\
    \ | sort -b -k1,1n | pr -T$COLUMNS\n```\n\n列出特定进程的所有线程（例如“firefox-bin”进程）\n\n\
    ```\n$ ps -C firefox-bin -L -o pid,tid,pcpu,state\n```\n\n找到特定进程后，您可以使用 *lsof*\
    \ 收集与该进程相关的信息，以列出该进程 ID 打开的路径\n\n"
