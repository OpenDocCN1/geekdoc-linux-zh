    ## Chapter 13: tee command


    | Options | Description |

    | --- | --- |

    | -a, --append | Append to the given FILES. Do not overwrite. |

    | -i, --ignore-interrupts | Ignore interrupt signals. |

    | --help | Display a help message, and exit. |

    | --version | Display version information, and exit. |


    **tee** - read from standard input and write to standard output and files.


    The **tee** command is named after the T-splitter in plumbing, which splits water
    into two directions and is shaped like an uppercase T.


    **tee** copies data from standard input to each FILE, and also to standard output.
    In effect, **tee** duplicates its input, routing it to multiple outputs at once.


    ### Section 13.1: Write output to stdout, and also to a file


    The following command displays output only on the screen (stdout).


    ```bash

    $ ls

    ```


    The following command writes the output only to the file and not to the screen.


    ```bash

    $ ls > file

    ```


    The following command (with the help of **tee** command) writes the output both
    to the screen (stdout) and to the file.


    ```bash

    $ ls | tee file

    ```


    ### Section 13.2: Write output from the middle of a pipe chain to a file and pass
    it back to the pipe


    You can also use **tee** command to store the output of a command in a file and
    redirect the same output to another command.


    The following command will write current crontab entries to a file crontab-backup.txt
    and pass the crontab entries to **sed** command, which will do the substitution.
    After the substitution, it will be added as a new cron job.


    ```bash

    $ crontab -l | tee crontab-backup.txt | sed ''s/old/new/'' | crontab -

    ```


    ### Section 13.3: write the output to multiple files


    You can pipe your output to multiple files (including your terminal) by using
    **tee** like this:


    ```bash

    $ ls | tee file1 file2 file3

    ```


    ### Section 13.4: Instruct tee command to append to the file


    By default **tee** command overwrites the file. You can instruct **tee** to append
    to the file using the -a option as shown below.


    ```bash

    $ ls | tee -a file

    ```


    ## Chapter 14: Secure Shell (SSH)


    A secure shell is used to remotely access a server from a client over an encrypted
    connection. OpenSSH is used as an alternative to Telnet connections that achieve
    remote shell access but are unencrypted. The OpenSSH Client is installed on most
    GNU/Linux distributions by default and is used to connect to a server. These examples
    show how to use the SSH suite to accept SSH connections and connecting to another
    host.


    ### Section 14.1: Connecting to a remote server


    To connect to a server we must use SSH on the client as follows,


    ```bash

    # ssh -p port user@server-address

    ```


    - **port** - The listening ssh port of the server (default port 22).

    - **user** - Must be an existing user on the server with SSH privileges.

    - **server address** - The IP/Domain of the server.


    For a real world example lets pretend that you''re making a website. The company
    you chose to host your site tells you that the server is located at **web-servers.com**
    on a custom port of **2020** and your account name **usr1** has been chosen to
    create a user on the server with SSH privileges. In this case the SSH command
    used would be as such


    ```bash

    # ssh -p 2020 usr1@web-servers.com

    ```


    If account name on the remote system is the same as the one on the local client
    you may leave the user name off. So if you are usr1 on both systems then you may
    simply use web-servers.com instead of usr1@web-servers.com.


    When a server you want to connect to is not directly accessible to you, you can
    try using ProxyJump switch to connect to it through another server which is accessible
    to you and can connect to the desired server.


    ```bash

    # ssh -J usr1@10.0.0.1:2020 usr2@10.0.0.2 -p 2222

    ```


    This will let you connect to the server 10.0.0.2 (running ssh on port 2222) through
    server at 10.0.0.1 (running ssh on port 2020). You will need to have accounts
    on both servers of course. Also note that the -J switch is introduced in OpenSSH
    version 7.3.


    ### Section 14.2: Installing OpenSSH suite


    Both connecting to a remote SSH server and accepting SSH connections require installation
    of openssh


    Debian:


    ```bash

    # apt-get install openssh

    ```


    Arch Linux:


    ```bash

    # pacman -S openssh

    ```


    Yum:


    ```bash

    # yum install openssh

    ```


    ### Section 14.3: Configuring an SSH server to accept connections


    First we must edit the SSH daemon config file. Though under different Linux distributions
    this may be located in different directories, usually it is stored under `/etc/ssh/ssh_config`


    Use your text editor to change the values set in this file, all lines starting
    with # are commented out and must have this character removed to take any effect.
    A list of recommendations follow as such.


    ```text

    Port (chose a number between 0 - 65535, normally greater than four digits)

    PasswordAuthentication yes

    AllowUsers user1 user2 ...etc

    ```


    Note that it is preferable to disable password logins all together and use SSH
    Keys for improved security as explained in this document.


    ### Section 14.4: Passwordless connection (using a key pair)


    First of all you''ll need to have a key pair. If you don''t have one yet, take
    a look at the ''Generate public and private key topic''.


    Your key pair is composed by a private key (id_rsa) and a public key (id_rsa.pub).
    All you need to do is to copy the public key to the remote host and add its contents
    to the ~/.ssh/authorized_keys file.


    One simple way to do that is:


    ```bash

    ssh <user>@<ssh-server> ''cat >> ~/.ssh/authorized_keys'' < id_rsa.pub

    ```


    Once the public key is properly placed in your user''s home directory, you just
    need to login using the respective private key:


    ```bash

    ssh <user>@<ssh-server> -i id_rsa

    ```


    ### Section 14.5: Generate public and private key


    To generate keys for SSH client:


    ```bash

    ssh-keygen [-t rsa | rsa1 | dsa ] [-C <comment>] [-b bits]

    ```


    For example:


    ```bash

    ssh-keygen -t rsa -b 4096 -C myemail@email.com

    ```


    Default location is ~/.ssh/id_rsa for private and ~/.ssh/id_rsa.pub for public
    key.


    For more info, please visit man.openbsd.org


    ### Section 14.6: Disable ssh service


    This will disable the SSH server side service, as if needed this will ensure that
    clients cannot connect via ssh


    Ubuntu


    ```bash

    sudo service ssh stop

    sudo systemctl disable sshd.service

    ```


    Debian


    ```bash

    sudo /etc/init.d/ssh stop

    sudo systemctl disable sshd.service

    ```


    Arch Linux


    ```bash

    sudo killall sshd

    sudo systemctl disable sshd.service

    ```


    ## Chapter 15: SCP


    ### Section 15.1: Secure Copy


    **scp** command is used to securely copy a file to or from a remote destination.
    If the file is in current working directory only filename is sufficient else full
    path is required which included the remote hostname e.g. remote_user@some_server.org/path/to/file


    # Copy local file in your CWD to new directory


    ```bash

    scp localfile.txt /home/friend/share/

    ```


    # Copy remote file to your current working directory


    ```bash

    scp rocky@arena51.net:/home/rocky/game/data.txt ./

    ```


    # Copy file from one remote location to another remote location


    ```bash

    scp mars@universe.org:/beacon/light/bitmap.conf jupiter@universe.org:/beacon/night/

    ```


    # To copy directory and sub-directories use "-r" recursive option to scp


    ```bash

    scp -r user@192.168.0.4:~/project/* ./workspace/

    ```


    ### Section 15.2: Basic Usage


    ```bash

    # Copy remote file to local dir

    scp user@remotehost.com:/remote/path/to/foobar.md /local/dest


    # Copy local file to remote dir

    scp foobar.md user@remotehost.com:/remote/dest


    # Key files can be used (just like ssh)

    scp -i my_key.pem foobar.md user@remotehost.com:/remote/dest

