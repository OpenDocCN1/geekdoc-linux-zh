    ### 10.1 节：诊断服务问题


    在使用 systemd 的系统上，例如 Fedora >= 15、Ubuntu（服务器版和桌面版）>= 15.04，以及 RHEL/CentOS >= 7：


    ```bash

    systemctl status [servicename]

    ```


    ...其中 `[servicename]` 是指定服务；例如，`systemctl status sshd`。


    这将显示基本状态信息以及最近记录的错误。


    你可以使用 `journalctl` 查看更详细的错误。例如，`journalctl -xe` 会将最近 1000 条日志加载到分页器（如 `less`）中，并跳转到末尾。你还可以使用
    `journalctl -f`，它会跟随新进入的日志消息。


    要查看特定服务的日志，请使用 `-t` 标志，如下所示：


    ```bash

    journalctl -f -t sshd

    ```


    其他实用选项包括用于优先级的 `-p`（`-p warnings` 用于仅查看警告及以上级别）、用于“自上次启动以来”的 `-b`，以及用于“自……以来”的
    `-S` —— 将这些组合起来，我们可以执行


    ```bash

    journalctl -p err -S yesterday

    ```


    以查看自昨天以来记录的所有错误项。


    如果 `journalctl` 不可用，或者你正在跟踪不使用系统日志的应用程序错误日志，可以使用 `tail` 命令来显示文件的最后几行。`tail` 的一个有用标志是
    `-f`（代表“跟随”），它会在数据追加到文件时继续显示数据。要查看系统上大多数服务的消息：


    ```bash

    tail -f /var/log/messages

    ```


    或者，如果该服务是特权服务，可能会记录敏感数据：


    ```bash

    tail -f /var/log/secure

    ```


    某些服务拥有自己的日志文件，一个好例子是 `auditd`，即 Linux 审计守护进程，其日志存储在 `/var/log/audit/` 中。如果你没有在
    `/var/log/messages` 中看到来自你服务的输出，请尝试在 `/var/log/` 中寻找特定的服务日志。


