    ## Chapter 12: LAMP Stack


    LAMP (Linux Apache MySQL PHP) consists of the Linux operating system as development
    environment, the Apache HTTP Server as web server, the MySQL relational database
    management system (RDBMS) as DB (Data Base) system, and the PHP programming language
    as Server side (Back End) programming language.


    LAMP is used as a Open Source stack of technologies solution to web development
    area. Windows version of this stack is called WAMP (Windows Apache MySQL PHP).


    ### Section 12.1: Installing LAMP on Arch Linux


    With this line we will install all the necessary packages in one step, and the
    last update:


    ```bash

    pacman -Syu apache php php-apache mariadb

    ```


    #### HTTP


    Edit `/etc/httpd/conf/httpd.conf`.


    Change `ServerAdmin you@example.com` as you need.


    The folder of the WEB Pages by default is `ServerRoot "/etc/httpd"`. Directory
    must be set to the same folder, so change the line


    ```html

    <Directory "/etc/httpd">

    ```


    This folder must have read and execution access, so


    ```bash

    chmod o+x /etc/httpd

    ```


    Change `AllowOverride` from `none` (default) to `All` so `.htaccess` will work.


    Now you need the `~/public_html` folder for each user. (to get the root page of
    each user as `http://localhost/~yourusername/`) Uncomment this line:


    ```apache

    Include conf/extra/httpd-userdir.conf

    ```


    Now as root you need to create the `~/public_html` for each user and change the
    access to (755) of each one.


    ```bash

    chmod 755 /home

    chmod 755 /home/username

    chmod 755 /home/username/public_html

    ```


    You can comment out this line if you want to use SSL:


    ```apache

    LoadModule ssl_module modules/mod_ssl.so

    ```


    If you need to use virtual domains, uncomment the line:


    ```apache

    Include conf/extra/httpd-vhosts.conf

    ```


    And in `/etc/httpd/conf/extra/httpd-vhosts.conf` you must to add all the virtual
    domains. (plus into `/etc/hosts` if you want to test those virtuals domains)


    Edit `/etc/httpd/conf/extra/httpd-default.conf` and change **ServerSignature**
    to `Off` and **ServerToken** to `Prod` for hiding critical data.


    #### PHP


    Edit `/etc/httpd/conf/httpd.conf`.


    Comment out: `LoadModule mpm_event_module modules/mod_mpm_event.so`


    Uncomment: `LoadModule mpm_prefork_module modules/mod_mpm_prefork.so`


    As last item in the `LoadModule` list, add `LoadModule php7_module modules/libphp7.so`


    As last item in the `Include` list, add `Include conf/extra/php7_module.conf`


    Edit `/etc/php/php.ini`.


    Uncomment `extension=mysqli.so` and `extension=pdo_mysql.so`


    Change the timezone as you need, for example:


    ```ini

    date.timezone = America/Argentina/Buenos_Aires, date.default_latitude = 0.0, date.default_longitude
    = 0.0

    ```


    #### MySQL


    Run as root:


    ```bash

    mysql_install_db --user=mysql --basedir=/usr --datadir=/var/lib/mysql

    ```


    Now you have the root of the MySQL Server.


    Start MySQL daemon:


    ```bash

    systemctl enable mysqld

    systemctl start mysqld

    ```


    At last, run:


    ```bash

    sh /usr/bin/mysql_secure_installation

    ```


    That all to get a web server ready to be customized as you need.


