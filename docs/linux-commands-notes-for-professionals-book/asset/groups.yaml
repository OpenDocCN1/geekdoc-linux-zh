    \ |\n| `whoami` | 在终端登录的用户名。 |\n| `who` | 列出当前作为用户登录的所有用户。 |\n| `w` | 显示当前系统状态、时间、持续时间、当前在系统上登录的用户列表及其他用户信息。\
