    - `-J --xz --lzma` Filter the archive through xz.\n- `-z --gzip` Filter the archive\
    \ through gzip.\n\n### Section 8.1: Compress a folder\n\nThis creates a simple\
    \ archive of a folder :\n\n```bash\ntar -cf ./my-archive.tar ./my-folder/\n```\n\
    \nVerbose output shows which files and directories are added to the archive, use\
    \ the -v option:\n\n```bash\ntar -cvf ./my-archive.tar ./my-folder/\n```\n\nFor\
    \ archiving a folder compressed 'gzip', you have to use the -z option :\n\n```bash\n\
    tar -czf ./my-archive.tar.gz ./my-folder/\n```\n\nYou can instead compress the\
    \ archive with 'bzip2', by using the -j option:\n\n```bash\ntar -cjf ./my-archive.tar.bz2\
    \ ./my-folder/\n```\n\nOr compress with 'xz', by using the -J option:\n\n```bash\n\
    tar -cJf ./my-archive.tar.xz ./my-folder/\n```\n\n### Section 8.2: Extract a folder\
    \ from an archive\n\nThere is an example for extract a folder from an archive\
    \ in the current location :\n\n```bash\ntar -xf archive-name.tar\n```\n\nIf you\
    \ want to extract a folder from an archive to a specific destination :\n\n```bash\n\
    tar -xf archive-name.tar -C ./directory/destination\n```\n\n### Section 8.3: List\
    \ contents of an archive\n\nList the contents of an archive file without extracting\
    \ it:\n\n```bash\ntar -tf archive.tar.gz\nFolder-In-Archive/\nFolder-In-Archive/file1\n\
    Folder-In-Archive/Another-Folder/\nFolder-In-Archive/Another-Folder/file2\n```\n\
    \n### Section 8.4: List archive content\n\nThere is an example of listing content\
    \ :\n\n```bash\ntar -tvf archive.tar\n```\n\nThe option -t is used for the listing.\
    \ For listing the content of a tar.gz archive, you have to use the -z option anymore\
    \ :\n\n```bash\ntar -tzvf archive.tar.gz\n```\n\n### Section 8.5: Compress and\
    \ exclude one or multiple folder\n\nIf you want to extract a folder, but you want\
    \ to exclude one or several folders during the extraction, you can use the --exclude\
    \ option.\n\n```bash\ntar -cf archive.tar ./my-folder/ --exclude=\"my-folder/sub1\"\
    \ --exclude=\"my-folder/sub3\"\n```\n\nWith this folder tree :\n\n```text\nmy-folder/\n\
    \  sub1/\n  sub2/\n  sub3/\n```\n\nThe result will be :\n\n```text\n./archive.tar\n\
    my-folder/\n  sub2/\n```\n\n### Section 8.6: Strip leading components\n\nTo strip\
    \ any number of leading components, use the --strip-components option:\n\n```text\n\
    --strip-components=NUMBER\nstrip NUMBER leading components from file names on\
    \ extraction\n```\n\nFor example to strip the leading folder, use:\n\n```bash\n\
    tar -xf --strip-components=1 archive-name.tar\n```\n\n## Chapter 9: Services\n\
    \n### Section 9.1: List running service on Ubuntu\n\nTo get a list of the service\
    \ on your system, you may run:\n\n```bash\nservice --status-all\n```\n\nThe output\
    \ of `service --status-all` lists the state of services controlled by System V.\n\
    \nThe + indicates the service is running, - indicates a stopped service. You can\
    \ see this by running service SERVICENAME status for a + and - service.\n\nSome\
    \ services are managed by **Upstart**. You can check the status of all Upstart\
    \ services with sudo initch 1 list. Any service managed by Upstart will also show\
    \ in the list provided by service --status-all but will be marked with a ?.\n\n\
    ref: [https://askubuntu.com/questions/407075/how-to-read-service-status-all-results](https://askubuntu.com/questions/407075/how-to-read-service-status-all-results)\n\
    \n### Section 9.2: Systemd service management\n\n#### Listing services\n\n- `systemctl`\
    \ To list running services\n- `systemctl --failed` To list failed services\n\n\
    #### Managing Targets (Similar to Runlevels in SysV)\n\n- `systemctl get-default`\
    \ To find the default target for your system\n- `systemctl set-default <target-name>`\
    \ To set the default target for your system\n\n#### Managing services at runtime\n\
    \n- `systemctl start [service-name]` To start a service\n- `systemctl stop [service-name]`\
    \ To stop a service\n- `systemctl restart [service-name]` To restart a service\n\
    - `systemctl reload [service-name]` To request service to reload its configuration\n\
    - `systemctl status [service-name]` To show current status of a service\n\n####\
    \ Managing autostart of services\n\n- `systemctl is-enabled [service-name]` To\
    \ show whether a service is enabled on system boot\n- `systemctl is-active [service-name]`\
    \ To show whether a service is currently active(running)\n- `systemctl enable\
    \ [service-name]` To enable a service on system boot\n- `systemctl disable [service-name]`\
    \ To disable a service on system boot\n\n#### Masking services\n\n- `systemctl\
    \ mask [service-name]` To mask a service (Makes it hard to start a service by\
    \ mistake)\n- `systemctl unmask [service-name]` To unmask a service\n\n#### Restarting\
    \ systemd\n\n```bash\nsystemctl daemon-reload\n```\n"
