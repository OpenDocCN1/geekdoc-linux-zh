    `$ ip link show`\n```\n\nRename interface eth0 to wan\n\n```\n`$ ip link set dev\
    \ eth0 name wan`\n```\n\nBring interface eth0 up (or down)\n\n```\n`$ ip link\
    \ set dev eth0 up`\n```\n\nList addresses for interfaces\n\n```\n`$ ip addr show`\n\
    ```\n\nAdd (or del) ip and mask (255.255.255.0)\n\n```\n`$ ip addr add 1.2.3.4/24\
    \ brd + dev eth0`\n```\n\n# ## Section 17.6: Adding IP to an interface\n\nAn IP\
    \ address to an interface could be obtained via DHCP or Static assignment\n\n\
    **DHCP** If you are connected to a network with a DHCP server running, `dhclient`\
    \ command can get an IP address for your interface\n\n```\n`$ dhclient <interface>`\n\
    ```\n\nor alternatively, you could make a change to the `/etc/network/interfaces`\
    \ file for the interface to be brought up on boot and obtain DHCP IP\n\n```\n\
    ```text\nauto eth0\niface eth0 inet dhcp\n```\n```\n\n**Static configuration(Permanent\
    \ Change) using /etc/network/interfaces file**\n\nIf you want to statically configure\
    \ the interface settings(permanent change), you could do so in the `/etc/network/interfaces`\
    \ file.\n\nExample:\n\n```\n```text\nauto eth0 # Bring up the interface on boot\n\
    iface eth0 inet static\n    address 10.10.70.10\n    netmask 255.255.0.0\n   \
    \ gateway 10.10.1.1\n    dns-nameservers 10.10.1.20\n    dns-nameservers 10.10.1.30\n\
    ```\n```\n\nThese changes persist even after system reboot."
  md: "\n## Chapter 16: GnuPG (GPG)\n\nGnuPG is a sophisticated key management system\
    \ which allows for secure signing or encrypting data. GPG is a command-line tool\
    \ used to create and manipulate GnuPG keys.\n\nGnuPG is most widely used for having\
    \ SSH (Secure Shell) connections without password or any means of interactive\
    \ authentication, which improves security level significantly.\n\nFollowing sections\
    \ describe ways to create, use, and maintain security of GnuPG keys.\n\n### Section\
    \ 16.1: Exporting your public key\n\nIn order for your public-private keypair\
    \ to be of use, you must make your public key freely available to others. Be sure\
    \ that you are working with your public key here since you should *never* share\
    \ your private key. You can export your public key with the following command:\n\
    \n```bash\ngpg --armor --export EMAIL_ADDRESS > public_key.asc\n```\n\nwhere EMAIL_ADDRESS\
    \ is the email address associated with the key.\n\nAlternately, you can upload\
    \ your public key to a public key server such as keys.gnupg.net so that others\
    \ can use it. To do so, enter the following in a terminal:\n\n```bash\ngpg --list-keys\n\
    ```\n\nThen, search for the 8-digit string (the primary ID) associated with the\
    \ key you want to export. Then, issue the command:\n\n```bash\ngpg --send-keys\
    \ PRIMARY_ID\n```\n\nwhere PRIMARY_ID is the actual ID of that key.\n\nNow, the\
    \ public key has been uploaded to the key server and is publicly available.\n\n\
    ### Section 16.2: Create and use a GnuPG key quickly\n\nInstall haveged (example\
    \ `sudo apt-get install haveged`) to speed up the random byte process. Then:\n\
    \n```bash\ngpg --gen-key\ngpg --list-keys\n```\n\noutputs:\n\n```text\npub   \
    \ 2048R/NNNNNNNN  2016-01-01\nuid                 Name  <name@example.com>\nsub\
    \    2048R/xxxxxxxx  2016-01-01\n```\n\nThen publish:\n\n```bash\ngpg --keyserver\
    \ pgp.mit.edu --send-keys NNNNNNNN\n```\n\nThen plan to revoke: [https://www.hackdiary.com/2004-01-18/revoking-a-gpg-key/](https://www.hackdiary.com/2004-01-18/revoking-a-gpg-key/)\n\
    \n## Chapter 17: Network Configuration\n\nThis document covers TCP/IP networking,\
    \ network administration and system configuration basics. Linux can support multiple\
