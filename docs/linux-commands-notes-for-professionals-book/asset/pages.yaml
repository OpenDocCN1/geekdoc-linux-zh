  md: '# Chapter 7: ls command


    # Section 7.1: Options for ls command


    Full list of options:


    +   - `ls` -a list all files including hidden file starting with `.`

    +   - `ls` --color colored list [ =always/never/auto]

    +   - `ls` -d list directories - with `*/`

    +   - `ls` -F add one char of `*/>=@|` to entries

    +   - `ls` -i list file''s inode index number

    +   - `ls` -l list with long format - show permissions

    +   - `ls` -la list long format including hidden files

    +   - `ls` -lh list long format with readable file size

    +   - `ls` -ls list with long format with file size

    +   - `ls` -r list in reverse order

    +   - `ls` -R list recursively directory tree

    +   - `ls` -s list file size

    +   - `ls` -S sort by file size

    +   - `ls` -t sort by time & date

    +   - `ls` -X sort by extension name


    # Section 7.2: ls command with most used options


    ls shows files and directories in present working directory. (if no arguments
    are passed.) (It doesn''t show hidden files which starts with . by default.)


    ```

    ```

    user@ubuntu14:~/usr$ ls

    bin    games    include    lib    lib32    local    sbin    share    src

    ```

    ```


    To see all files (hidden files/folders also). Use `ls` -a OR `ls` -all


    ```

    ```

    user@ubuntu14:~/usr$ ls -a

    .    ..    bin    games    include    lib    lib32    local    sbin    share    src

    ```

    ```


    To differentiate between files and folders and symbolic links and other, use `ls`
    -F OR `ls` -classify


    ```

    ```

    user@ubuntu14:~$ ls -F

    bash_profile_course    chat_apps/    Desktop/    Downloads/    foxitsoftware/

    Public/    test/    bin/    CllonProjects/    Documents/    IDE/    Music/

    Pictures/    Templates/    Videos/

    ```

    ```'
  merge: -1
