  md: '# Chapter 15: SCP


    # Section 15.1: Secure Copy


    scp command is used to securely copy a file to or from a remote destination. If
    the file is in current working directly only filename is sufficient else full
    path is required which included the remote hostname e.g. remote_user@some_server.org/path/to/file


    # Copy local file in your CWD to new directory


    ```

    scp localfile.txt /home/friend/share/

    ```


    # Copy remote file to you current working directory


    ```

    scp rocky@arena51.net:/home/rocky/game/data.txt ./

    ```


    # Copy file from one remote location to another remote location


    ```

    scp mars@universe.org:/beacon/light/bitmap.conf jupiter@universe.org:/beacon/night/

    ```


    # To copy directory and sub-directories use "-r" recursive option to scp


    ```

    scp -r user@192.168.0.4:~/project/* ./workspace/

    ```


    # Section 15.2: Basic Usage


    ```

    # Copy remote file to local dir

    scp user@remotehost.com:/remote/path/to/foobar.md /local/dest


    # Copy local file to remote dir

    scp foobar.md user@remotehost.com:/remote/dest


    # Key files can be used (just like ssh)

    scp -i my_key.pem foobar.md user@remotehost.com:/remote/dest

    ```'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# # Chapter 16: GnuPG (GPG)


    GnuPG is a sophisticated key management system which allows for secure signing
    or encrypting data. GPG is a command-line tool used to create and manipulate GnuPG
    keys.


    GnuPG is most widely used for having SSH (Secure Shell) connections without password
    or any means of interactive authentication, which improves security level significantly.


    Following sections describe ways to create, use, and maintain security of GnuPG
    keys.


    # ## Section 16.1: Exporting your public key


    In order for your public-private keypair to be of use, you must make your public
    key freely available to others. Be sure that you are working with your public
    key here since you should *never* share your private key. You can export your
    public key with the following command:


    ```

    gpg  --armor  --export  EMAIL_ADDRESS  >  public_key.asc

    ```


    where EMAIL_ADDRESS is the email address associated with the key


    Alternately, you can upload your public key to a public key server such as keys.gnupg.net
    so that others can use it. To do so, enter the following in a terminal:


    ```

    gpg  --list-keys

    ```


    Then, search for the 8-digit string (the primary ID) associated with the key you
    want to export. Then, issue the command:


    ```

    gpg  --send-keys  PRIMARY_ID

    ```


    where PRIMARY_ID is the actual ID of that key.


    Now, the public key has been uploaded to the key server and is publicly available.


    # ## Section 16.2: Create and use a GnuPG key quickly


    Install haveged (example `sudo apt-get install haveged`) to speed up the random
    byte process. Then:


    ```

    gpg  --gen-key

    gpg  --list-keys

    ```


    outputs:


    ```

    pub    2048R/NNNNNNNN  2016-01-01

    uid                 Name  <name@example.com>

    sub    2048R/xxxxxxxx  2016-01-01

    ```


    Then publish:


    ```

    gpg  --keyserver  pgp.mit.edu  --send-keys  NNNNNNNN

    ```


    Then plan to revoke: [https://www.hackdiary.com/2004/01/18/revoking-a-gpg-key/](https://www.hackdiary.com/2004/01/18/revoking-a-gpg-key/)'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Chapter 17: Network Configuration


    This document covers TCP/IP networking, network administration and system configuration
    basics. Linux can support multiple network devices. The device names are numbered
    and begin at zero and count upwards. For example, a computer with two NICs will
    have two devices labeled eth0 and eth1.


    # Section 17.1: Local DNS resolution


    File: */etc/hosts* contains a list of hosts that are to be resolved locally(not
    by DNS)


    Sample contents of the file:


    ```

    127.0.0.1       your-node-name.your-domain.com  localhost.localdomain  localhost

    XXX.XXX.XXX.XXX node-name

    ```


    The file format for the hosts file is specified by RFC 952


    # Section 17.2: Configure DNS servers for domain name resolution


    File: */etc/resolv.conf* contains a list of DNS servers for domain name resolution


    Sample contents of the file:


    ```

    nameserver 8.8.8.8 # IP address of the primary name server

    nameserver 8.8.4.4 # IP address of the secondary name server

    ```


    In case internal DNS server you can validate if this server resolve DNS names
    properly using `dig` command:


    ```

    $ dig google.com @your.dns.server.com +short

    ```


    # Section 17.3: See and manipulate routes


    Manipulate the IP routing table using `route`


    # Display routing table


    ```

    $ route # Displays list or routes and also resolves host names

    $ route -n # Displays list of routes without resolving host names for faster results

    ```


    # Add/Delete route


    | Option | Description |

    |:--- |:--- |

    | add or del | Add or delete a route |

    | -host x.x.x.x | Add route to a single host identified by the IP address |

    | -net x.x.x.x | Add route to a network identified by the network address |

    | gw x.x.x.x | Specify the network gateway |

    | netmask x.x.x.x | Specify the network netmask |

    | default | Add a default route |


    Examples:'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   - add route to a host $ route add -host x.x.x.x eth1

    +   - add route to a network $ route add -net 2.2.2.0 netmask 255.255.255.0 eth0

    +   - Alternatively, you could also use cidr format to add a route to network
    route add -net 2.2.2.0/24 eth0

    +   - add default gateway $ route add default gw 2.2.2.1 eth0

    +   - delete a route $ route del -net 2.2.2.0/24


    # Manipulate the IP routing table using ip


    # Display routing table


    ```

    $ ip route show # List routing table

    ```


    # Add/Delete route


    | Option | Description |

    | --- | --- |

    | add or del or change or append or replace | Change a route |

    | show or flush | the command displays the contents of the routing tables or remove
    it |

    | restore | restore routing table information from stdin |

    | get | this command gets a single route to a destination and prints its contents
    exactly as the kernel sees it |


    Examples:


    +   - Set default gateway to 1.2.3.254 $ ip route add default via 1.2.3.254

    +   - Adds a default route (for all addresses) via the local gateway 192.168.1.1
    that can be reached on device eth0

    +   $ ip route add default via 192.168.1.1 dev eth0


    # Section 17.4: Configure a hostname for some other system on your network


    You can configure your Linux (or macOS) system in order to tie in an identifier
    <hostname> to some other system''s IP address in your network. You can configure
    it:


    +   - Systemwide. You should modify the /etc/hosts file. You just have to add
    to that file a new line containing:

    +     1. the remote system''s IP address <ip_rem>,

    +     2. one or more blank spaces, and

    +     3. the identifier <hostname>.

    +   - For a single user. You should modify the ~/.hosts file --- you-d have to
    create it. It is not as simple as for systemwide. Here you can see an explanation.


    For instance, you could add this line using the cat Unix tool. Suppose that you
    want to make a ping to a PC in your local network whose IP address is 192.168.1.44
    and you want to refer to that IP address just by remote_pc. Then you must write
    on your shell:


    ```

    $ sudo cat 192.168.1.44 remote_pc

    ```


    Then you can make that ping just by:


    ```

    $ ping remote_pc

    ```'
  merge: -1
