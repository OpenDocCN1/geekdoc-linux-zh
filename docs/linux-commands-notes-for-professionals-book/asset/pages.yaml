    \ modules are available.\nDistributor ID: Debian\nDescription:\tDebian GNU/Linux\
    \ testing (stretch)\nRelease:\t\ttesting\nCodename:\t\tstretch\n```\n\nOn Ubuntu:\n\
    \n```\n$ `lsb_release` `--a`\nNo LSB modules are available.\nDistributor ID: Ubuntu\n\
    Description:\tUbuntu 14.04.4 LTS\nRelease:\t\t14.04\nCodename:\t\ttrusty\n```\n\
    \nIn case when you don't have **`lsb_release`** installed you may want to try\
    \ some guessing, for example, there is a file `/etc/issue` that often contains\
    \ distribution name. For example, on ubuntu:\n\n```\n$ **cat** `/etc/issue`\n\
    Ubuntu 12.04.5 LTS `\\n \\l`\n```\n\nDon't use file `/etc/debian_version` because\
    \ its contents do not match distribution name!\n\n*Note that this will also work\
    \ on non-Debian-family distributions like Fedora, RHEL, or openSUSE — but that\
