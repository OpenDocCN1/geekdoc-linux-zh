    \ `-f --file=ARCHIVE` Use archive file or dir ARCHIVE.\n+   - `-v --verbose` Verbosely\
    \ list files processed.\n\n# Compression Options\n\n+   - `-a --auto-compress`\
    \ Use archive suffix to determine the compression program.\n+   - `-j --bzip2`\
    \ Filter the archive through bzip2.\n+   - `-J --xz --lzma` Filter the archive\
    \ through xz.\n+   - `-z --gzip` Filter the archive through gzip.\n\n# ## Section\
    \ 8.1: Compress a folder\n\nThis creates a simple archive of a folder :\n\n```\n\
    ```\n tar -cf ./my-archive.tar ./my-folder/\n```\n```\n\nVerbose output shows\
    \ which files and directories are added to the archive, use the -v option:\n\n\
    ```\n```\n tar -cvf ./my-archive.tar ./my-folder/\n```\n```\n\nFor archiving a\
    \ folder compressed 'gzip', you have to use the -z option :\n\n```\n```\n tar\
    \ -czf ./my-archive.tar.gz ./my-folder/\n```\n```\n\nYou can instead compress\
    \ the archive with 'bzip2', by using the -j option:\n\n```\n```\n tar -cjf ./my-archive.tar.bz2\
    \ ./my-folder/\n```\n```\n\nOr compress with 'xz', by using the -J option:\n\n\
    ```\n```\n tar -cJf ./my-archive.tar.xz ./my-folder/\n```\n```\n\n# ## Section\
    \ 8.2: Extract a folder from an archive\n\nThere is an example for extract a folder\
    \ from an archive in the current location :\n\n```\n```\n tar -xf archive-name.tar\n\
    ```\n```\n\nIf you want to extract a folder from an archive to a specific destination\
    \ :\n\n```\n```\n tar -xf archive-name.tar -C ./directory/destination\n```\n```\n\
    \n# ## Section 8.3: List contents of an archive\n\nList the contents of an archive\
    \ file without extracting it:"
