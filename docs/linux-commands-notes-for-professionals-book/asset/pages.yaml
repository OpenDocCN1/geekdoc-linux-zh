  md: "# Chapter 5: Check Disk Space\n\n# Section 5.1: Investigate Directories For\
    \ Disk Usage\n\nSometimes it may be required to find out which directory consuming\
    \ how much disk space especially when you are used df -h and realized your available\
    \ disk space is low.\n\ndu:\n\ndu command summarizes disk usage of the set of\
    \ FILEs, recursively for directories.\n\nIt’s often uses with -sh option:\n\n\
    ```\n-S, --summarize\ndisplay only a total for each argument\n-h, --human-readable\n\
    print sizes in human readable format (e.g., 1K 234M 2G)\n```\n\nFor summarizing\
    \ disk usages of the files in the current directory we use:\n\n```\ndu -sh *\n\
    ```\n\nExample output:\n\n```\n572K\tDocuments\n208M\tDownloads\n4,0K\tMusic\n\
    724K\tPictures\n4,0K\tPublic\n4,0K\tTemplates\n4,0K\tVideos\n```\n\nWe can also\
    \ include hidden files with using:\n\n```\ndu -sh .[!.] * *\n```\n\nExample output:\n\
    \n```\n6,3M\t.atom\n4,0K\t.bash_history\n4,0K\t.bash_logout\n8,0K\t.bashrc\n350M\t\
