- pgno: 59
  md: '# Chapter 20: Package Managers


    # Section 20.1: How to update packages with the apt package manager


    The Advanced Package Tool, aptly named the ''apt'' package manager can handle
    the installation and removal of software on the Debian, Slackware, and other Linux
    Distributions. Below are some simple examples of use:


    **update**


    This option retrieves and scans the Packages.gz files, so that information about
    new and updated packages is available. To do so, enter the following command:


    ```

    `sudo apt-get update`

    ```


    **upgrade**


    This option is used to install the newest versions of all packages currently installed
    on the system. Packages currently installed with new versions available are retrieved
    and upgraded; under no circumstances are currently installed packages removed,
    or packages not already installed retrieved and installed. To upgrade, enter the
    following command:


    ```

    `sudo apt-get upgrade`

    ```


    **dist-upgrade**


    In addition to performing the function of upgrade, dist-upgrade also intelligently
    handles changing dependencies with new versions of packages. It will attempt to
    upgrade the most important packages at the expense of less important ones if necessary.
    To do so, enter the following command:


    ```

    `sudo apt-get dist-upgrade`

    ```


    # Section 20.2: How to install a package with the pacman package manager


    In order to search for packages in the database, searching both in packages’ names
    and descriptions:


    ```

    ```pacman -Ss string1 string2 …```

    ```


    To install a single package or list of packages (including dependencies), issue
    the following command:


    ```

    `sudo pacman -S package_name1 package_name2 …`

    ```


    *source*


    # Section 20.3: How to update packages with the pacman package manager


    To update a specific program:


    ```

    `sudo pacman -S <programName>`

    ```


    To update entire the system:


    ```

    `sudo pacman -Sy`

    ```'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# ## Section 20.4: How to update packages with yum


    Yellowdog Updater, Modified, one of the last remaining vestiges of Yellow Dog
    Linux, is the package manager used by Red Hat, Fedora, and CentOS systems and
    their derivatives. It can handle the installation and removal of software packaged
    as rpms for these Linux distributions. Below are some simple examples of use:


    # ### search


    This command will attemptr to locate software packages in the configured software
    repositories that match the given search criteria, and display the name / version
    / repository location of the matches it finds. To use it, enter the following
    command:


    ```

    ```

    yum search <queryString>

    ```

    ```


    # ### install


    This command will attempt to locate and install the named software from the configured
    software repositories, recursively locating and installing any needed prerequisite
    software as well. To use it, enter the following command:


    ```

    ```

    sudo yum install <packageName>

    ```

    ```


    # ### update


    This option is used to install the newest versions of all packages currently installed
    on the system. Packages currently installed with new versions available are retrieved
    and upgraded; new prerequisites are also retrieved and installed as necessary,
    and replaced or obsoleted packages are removed. To upgrade, enter the following
    command:


    ```

    ```

    sudo yum update

    ```

    ```


    Unlike apt, most yum commands will also automatically check for updates to repository
    metadata if a check has not been done recently (or if forced to do so) and will
    retrieve and scan updated metadata so that information about new and updated packages
    is available before the requested operation is performed.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Chapter 21: Compiling the Linux kernel


    # Section 21.1: Compilation of Linux Kernel on Ubuntu


    > **Warning:** be sure you have at least 15 GB of free disk space.


    Compilation in Ubuntu >=13.04


    Option A) Use Git


    Use git if you want to stay in sync with the latest Ubuntu kernel source. Detailed
    instructions can be found in the Kernel Git Guide. The git repository does not
    include necessary control files, so you must build them by:


    ```

    `fakeroot  debian/rules clean`

    ```


    Option B) Download the source archive


    Download the source archive - This is for users who want to rebuild the standard
    Ubuntu packages with additional patches. Use a follow command to install the build
    dependencies and extract the source (to the current directory):


    +   1. Install the following packages:


    ```

    `sudo apt-get build-dep linux-image-`uname -r``

    ```


    Option C) Download the source package and build


    This is for users who want to modify, or play around with, the Ubuntu-patched
    kernel source.


    +   1. Retrieve the latest kernel source from kernel.org.


    +   2. Extract the archive to a directory and cd into it:


    ```

    ```

    tar xf linux-*.tar.xz

    cd linux-*

    ```

    ```


    +   3. Build the ncurses configuration interface:


    ```

    `make menuconfig`

    ```


    +   4. To accept the default configuration, press `→` to highlight `< Exit >`
    and then `Return`.


    +   5. Press `Return` again to save the configuration.


    +   6. Use make to build the kernel:


    ```

    `make`

    ```


    Note that you can use the -jem> flag to compile files in parallel and take advantage
    of multiple cores.


    The compressed kernel image can be found at arch/[arch]/boot/bzImage, where [arch]
    is equal to `uname -a`.'
  merge: -1
  img_proc: true
