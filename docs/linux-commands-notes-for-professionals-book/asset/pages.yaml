  md: '# Chapter 12: LAMP Stack


    LAMP (Linux Apache MySQL PHP) consists of the Linux operating system as development
    environment, the Apache HTTP Server as web server, the MySQL relational database
    management system (RDBMS) as DB (Data Base) system, and the PHP programming language
    as Server side (Back End) programming language.


    LAMP is used as a Open Source stack of technologies solution to web development
    area. Windows version of this stack is called WAMP (Windows Apache MySQL PHP)


    # Section 12.1: Installing LAMP on Arch Linux


    With this line we will install all the necessary packages in one step, and the
    last update:


    ```

    ```bash

    pacman -Syu apache php php-apache mariadb

    ```

    ```


    # HTTP


    Edit


    ```

    ```bash

    /etc/httpd/conf/httpd.conf

    ```

    ```


    Change ServerAdmin you@example.com as you need.


    The folder of the WEB Pages by default is ServerRoot "/etc/httpd". Directory must
    be set to the same folder, so change the line


    ```

    ```html

    <Directory "/etc/httpd">

    ```

    ```


    This folder must have read and execution access, so


    ```

    ```bash

    chmod o+x /etc/httpd

    ```

    ```


    Change AllowOverride from none (default) to All so .htaccess will works.


    Now you need the ~/public_html folder for each user. (to get the root page of
    each user as http://localhost/~yourusername/ Unremark this line:


    ```

    ```bash

    Include conf/extra/httpd-userdir.conf

    ```

    ```


    Now as root you need to create the ~/public_html for each user and change the
    access to (755) of each one.


    ```

    ```bash

    chmod 755 /home

    chmod 755 /home/username

    chmod 755 /home/username/public_html

    ```

    ```


    You can comment out this line if you want to use SSL:


    ```

    ```apache

    LoadModule ssl_module modules/mod_ssl.so

    ```

    ```


    If you need to use virtual domains, uncomment the line:


    ```

    ```apache

    Include conf/extra/httpd-vhosts.conf

    ```

