    # Interactive monitoring


    Most commonly known tool for dynamic monitoring is:


    ```

    $ top

    ```


    That mostly default command that have huge amount options to filter and represent
    information in real time (in comparison to ps command.


    Still there are more advance options that can be considered and installed as **top**
