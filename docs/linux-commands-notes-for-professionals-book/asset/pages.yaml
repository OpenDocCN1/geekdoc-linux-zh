  md: "# # Chapter 19: Change root (chroot)\n\nChange root (chroot) is an operation\
    \ that changes the apparent root directory for the current running process and\
    \ their children. A program that is run in such a modified environment cannot\
    \ access files and commands outside that environmental directory tree.\n\n# ##\
    \ Section 19.1: Requirements\n\n+   - root privileges\n+   - another working Linux\
    \ environment, such as Live CD boot or an existing distribution\n+   - matching\
    \ environment architectures of `chroot` source and destination (check current\
    \ environment architecture with `uname` -m)\n+   - kernel modules which you may\
    \ need in `chroot` environment must be loaded (for example, with `modprobe`)\n\
    \n# ## Section 19.2: Manually changing root in a directory\n\n+   1.  Ensure you\
    \ met all requirements, as per Requirements\n\n+   2.  Mount the temporary API\
    \ filesystems:\n+   \n+       ```\n+       cd /location/of/new/root\n+       mount\
    \ -t proc proc proc/\n+       mount --rbind /sys sys/\n+       mount --rbind /dev\
    \ dev/\n+       mount --rbind /run run/ (optionally)\n+       ```\n\n+   3.  If\
    \ you need to use an internet connection in the chroot environment, copy over\
    \ the DNS details:\n+   \n+       ```\n+       cp /etc/resolv.conf etc/resolv.conf\n\
    +       ```\n\n+   4.  Change root into /location/of/new/root, specifying the\
    \ shell (/bin/bash in this example):\n+   \n+       ```\n+       chroot /location/of/new/root\
    \ /bin/bash\n+       ```\n\n+   5.  After chrooting it may be necessary to load\
    \ the local bash configuration:\n+   \n+       ```\n+       source /etc/profile\n\
    +       source ~/.bashrc\n+       ```\n\n+   6.  Optionally, create a unique prompt\
    \ to be able to differentiate your chroot environment:\n+   \n+       ```\n+ \
    \      export PS1=\"(chroot) $PS1\"\n+       ```\n\n+   7.  When finished with\
    \ the chroot, you can exit it via:\n+   \n+       ```\n+       exit\n+       ```\n\
    \n+   8.  Unmount the temporary file systems:\n+   \n+       ```\n+       cd /\n\
    +       umount --recursive /location/of/new/root\n+       ```"
  merge: -1
