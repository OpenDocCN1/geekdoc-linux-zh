  md: '# # Trouble On The Network


    # ## Network Troubleshooting


    If your network is not operating properly, first check the settings and operations
    to try to identify the cause. If the connections don''t seem to be functioning
    properly, use the ping command to check the connections. If a single service isn''t
    operating properly; restart the service.


    If these actions don''t resolve the problem, review the log, a file that saves
    a record of daemon and kernel operations.


    # ## Hardware Troubleshooting


    The ping command determines whether communication using IP is possible. Executing
    ping to another machine is called pinging a machine. Before pinging a machine,
    try to determine whether it''s a client or the server that is exhibiting problems.


    # ### Client (Windows, Macintosh)


    +   - A specific PC can exchange no data with other Windows and Macintosh systems
    (cannot recognize network PCs).


    # ### Server (Linux)


    +   - None of the PCs can receive any services from Linux (e.g. cannot send email,
    cannot share files, cannot log in to Linux using Tera Term Pro or NCSA Telnet).


    +   - Windows and Macintosh systems can see each other (can see network PCs).


    # ### Windows ping


    Although the ping command is provided in Linux, here we will ping Linux from the
    MS-DOS prompt of Windows. The MS-DOS prompt is located in StartPrograms.'
