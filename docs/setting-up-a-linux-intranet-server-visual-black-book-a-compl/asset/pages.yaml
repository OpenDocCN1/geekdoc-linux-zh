  md: '# How To Configure Linux As A Macintosh File Server


    The Role Of netatalk


    A Macintosh system can share files and folders when the system is connected through
    a network and configured for file sharing. Data exchanges between Linux and Macintosh
    systems, however, are not enabled.


    By using software to emulate the Macintosh sharing environment in Linux, Macintosh
    users can access Linux files, which permits file exchanges between the two systems.
    To the user, it appears as if Macintosh applications are seamlessly connected.


    # Macintosh And Linux Systems Cannot Exchange Data Without Assistance


    Macintosh and Linux systems are not equipped to exchange data directly. Consequently,
    software must be added either to Macintosh systems to allow them to interface
    with Linux systems or to Linux systems to allow them to interface with Macintosh
    systems.


    Software must be installed on each Macintosh system to provide the interface.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_137_0.png)


    The software is installed on entity one Linux system to provide the interface,
    reducing installation complications


    This book introduces netatalk, a service that enables Linux to use AppleTalk as
    a way to deal with the interface problem from the perspective of Linux. (Priority
    is placed on avoiding hassles for the general user.)'
  merge: -1
