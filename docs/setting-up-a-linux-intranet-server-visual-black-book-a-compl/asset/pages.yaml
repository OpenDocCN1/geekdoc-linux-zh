  md: '# Precautions When Using IDE Hard Disks Larger Than 8GB


    Linux can handle IDE hard disks with a capacity over 8.4GB, but if the PCs is
    an older version, you can use only 8.4GB of the disk. In this situation, access
    the Web site of the hard disk manufacturer and try to find information related
    to BIOS updates. Depending on the manufacturer, the BIOS update information may
    be publicly available on the Web. Updating the BIOS should allow you to work with
    hard disks larger than 8.4GB.


    There is a chance that if the BIOS update fails, the PC may not boot. Be sure
    to read the documentation from the manufacturer carefully and follow the instructions
    provided.'
