    \ and group.\n\nTwo or more computers in relatively close proximity to each other\
    \ (same building), connected in such a way that they can share information.\n\
    See also Ethernet.\n\nIDE (Integrated Drive Electronics)\nA standard for connecting\
    \ peripheral devices such as hard disks and CD-ROMs to PCs.\nSee also SCSI.\n\n\
    Library\nA file consisting of various collected program parts.\n\nLILO (Linux\
    \ Loader)\nSee also boot manager.\n\nIndex file\nA file displayed when specifying\
    \ a directory in a URL on the Web. Many of these files include .html, index.htm\
    \ or default.htm. These file names can be freely set on a Web server.\nSee also\
    \ Apache and Web.\n\nLink\nSee symbolic link.\n\nLinux\nA Unix-based OS. This\
    \ book describes how to set up a server using Linux. Linux is actually the name\
    \ of the kernel that forms the core of the OS. In many cases, Linux is used to\
    \ refer to systems that use the Linux kernel.\nSee also kernel.\n\nInternet\n\
    A worldwide network of networks. A network connects computers and devices, and\
    \ the Internet connects networks. The communication protocol used on the Internet\
    \ is TCP/IP.\n\nLocalTalk\nName of a port in a Macintosh system connects printers\
    \ and other peripherals.\nSee also AppleTalk.\n\nIP address\n address for detecting\
    \ computers in a network. Uses numbers from 0 to 255 organized in four groups,\
    \ separated by a period (.), which is called dotted notation. In this book, the\
    \ IP address 192.168.1.1 was set to the Linux server.\nSee also amass and broadcast\
    \ address.\n\nLog\nThe log is a record of daemon and kernel operations.\nSee also\
    \ daemon and kernel.\n\nLog in\nRefers to a situation when the user begins in.\
    \ Windows, logging in is called logging on.\nSee also log out.\n\nISA (Industry\
    \ Standard Architecture)\nA standard for connecting peripheral devices such as\
    \ network cards and SCSI cards to a PC.\nSee also PCI and PCMCIA.\n\nLog out\n\
