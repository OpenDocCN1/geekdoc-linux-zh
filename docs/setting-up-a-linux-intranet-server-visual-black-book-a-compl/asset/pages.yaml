    \ for matches only of type.\n\n+   * Note When specifying a number (n), [n+] indicates\
    \ a value greater than n, [n] indicates a value equal to n, and [-n] indicates\
    \ a value less than n. For size, appending [c] after the character displays in\
    \ bytes, [h] in kilobytes, and [b] (or nothing at all) will display the result\
    \ in blocks of 512 bytes. After -type, appending [d] displays directories, [f]\
    \ displays normal files, and [l] displays symbolic links.\n\n# fsck\n\nChecks\
    \ and repairs file systems.\n\n+   * Syntax\n  fsck [device name]\n* Commonly\
    \ used option\n  -y Answers to all questions.\n\n+   * Related commands: mount,\
    \ umount\n\n+   * Note When boots, the fsck executes automatically if the drive\
    \ has been mounted more than 20 times since the last check. Additionally, fsck\
    \ executes automatically if the shutdown did not execute properly or if a file\
    \ system error occurs.\n\n# fuser\n\nDisplays the processes that are using files\
