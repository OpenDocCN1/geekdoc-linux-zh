  md: '# Understanding How Email Works


    sendmail And qpopper


    The sendmail program enables Linux to provide email services. The sendmail program
    sends and stores email addressed to each user in Linux. The email stored in Linux
    must be retrieved from Linux before it can be read on Windows or Macintosh system.


    The qpopper program provides this retrieval service. Both sendmail and qpopper
    are used to set up the mail server in this book. You can download qpopper from
    ftp.coriolis.com in the linux_server_vbb folder and the latest version of sendmail
    from www.sendmail.org.


    # How Email Is Exchanged


    With email, the sender specifies a recipient and sends the email. The email is
    then sent and stored by Linux. When the recipient reads the email, they receive
    stored email from the mail server. The sending and storing functions, as well
    as the reading function, are supplied by the mail server.


    # Role Of The Mail Server


    +   * Receives email.

    * Saves email.

    * Delivers email.


    Receives Email


    The mail server receives email addressed to the recipient.


    Saves Email


    Email received by the mail server is stored until the recipient checks their email.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_175_0.png)


    Sender


    Delivers Email


    Any stored email is delivered to the recipient when they access the mail server.


    Recipient


    A mail server is required to exchange email.'
