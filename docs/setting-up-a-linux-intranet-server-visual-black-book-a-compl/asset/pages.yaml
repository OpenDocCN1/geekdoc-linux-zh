  md: '# # Installing Mail Server Software


    ## Installing sendmail


    The sendmail program enables Linux to provide email services. sendmail often comes
    with Red Hat Linux, but it''s preferable that you get the latest version and install
    it. This section explains how to compile and install sendmail. The sendmail home
    page, [www.sendmail.org](http://www.sendmail.org), has the latest version information.
    If you download it, put the package into the directory /usr/local/src/


    Usually, the **make** command is used to compile a program; here, however, the
    **build** command is used to compile sendmail independently. This allows sendmail
    to be created to accommodate a variety of environments.


