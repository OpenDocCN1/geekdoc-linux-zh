  md: '# 11.2 Using Your Hard Drive Efficiently


    The largest directory is displayed last. In large directories, determine which
    files you need that you do not, and then delete unnecessary files. If you cannot
    make a determination, it''s safer not to delete a file.


    # Move To A Less-Used File System


    If the disk is still over-capacity even after files are deleted, move the directory
    to a different file system and create a symbolic link. Although this is a makeshift
    solution, it''s effective if you are unable to add a new hard disk.


    Example 1: When Printer And Email Usage Exceed The Capacity Of /var/spool


    +   1. Stop services that use /var/spool.


    ```

    Stop to prevent data from entering the printer spool.


    [root@server /root]# cd /etc/rc.d/init.

    [root@server init.d#] ./lpd stop

    Shutting down lpd: lpd

    [root@server init.d#] ./sendmail stop

    Shutting down sendmail: sendmail

