  md: '# 7.2 How to Handle Linux Files From Macintosh Part 1


    # The Linux Archiving Tool: tar


    Most programs for Linux are distributed as source code and made publicly available
    text files by the authors. The source code may consist of many files, so it is
    standard practice to collect the files together and release them in a compressed
    format. Using software to collect files is called archiving.


    Generally, Macintosh uses hxx and Windows uses zip or lzh archives for archiving.
    All these programs have a compression function. In contrast, Linux handles file
    collection and file compression separately. In nearly all cases, the tar command
    is used to collect files, and a general-purpose file-compression program (gzip)
    is used to compress files.


    To compress a file with gzip, append an option to the tar command. Whether you
    collect the files using the tar command and then compress the file or use the
    tar command with an option. The result is exactly the same. Likewise, using the
    tar command with an option to open the files while extracting the compressed file
    is the same as extracting the compressed file with gzip and then opening the files
    with the tar command.


    # The tar Command Sequence


    ![](img/d549b948a29b14d0d8313a8ed09b5698_140_0.png)


    # tar Command Options


    +   - l Display the content list of an archive file.

    - c Create a new archive file.

    - x Open an archive file.

    - f Specify a file name.

    - z Execute compression (executes extraction when opening).

    - v Display progress.'
