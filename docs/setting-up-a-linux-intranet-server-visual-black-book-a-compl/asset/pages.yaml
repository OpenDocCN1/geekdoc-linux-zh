  md: '# 1.1 What Is Linux?


    # # The Best OS For Servers


    Windows and Mac OS are designed to execute operations on the particular PC on
    which they are installed. This type of operating system is called a client OS.
    A server OS like Linux, however, provides seamlessly link clients through a network
    and provides functions and resources that are available to all clients.


    # Server Function


    # Stability


    Linux enables the user to edit and restart specific application problems without
    restarting them concurrently


    # Security


    Operating systems with proper permissions can use Linux. A permission in the file
    system allows a user to access and modify the environment which prevents unauthorized
    access by guest users.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_24_0.png)


    Linux is an OS that can be used by multiple users from multiple clients on a network.
    In addition to network functions, stability and security (essential for a server)
    are highly effective features of Linux. Linux is best used, therefore, as a server
    for integrating clients. This book explains the procedures to install Linux as
    a server OS and to construct a server.


    # Client OS


    # Server OS


    ![](img/d549b948a29b14d0d8313a8ed09b5698_24_1.png)


    Windows and Mac OS are user-friendly OSs for which numerous applications are available
    commercially. As such, they are best suited for business, hobby, or home use on
    an individual PC.


    Linux provides complete network functions, as well as stability and security.
    As such, it is best suited for use as a file server or other network server.'
