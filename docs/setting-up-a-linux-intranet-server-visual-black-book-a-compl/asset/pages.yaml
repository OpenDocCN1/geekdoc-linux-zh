  md: '# Patches


    A patch is a text file written to make changes in the source code. The patch contains
    command information such as which file, what line number, change/add/delete the
    following line, and so forth. If you change and compile the source code in accordance
    with the patch file, a revised program is the result.


    Using a patch to change a file is called *applying a patch*. The options of the
    patch command differ depending on how the patch file is created.


    # Operating Problems


    If you did not select development environment components in Chapter 2, you cannot
    compile programs. A C language compiler is needed to compile programs. A patch
    must be applied to compile netatalk, so the patch command is also necessary.


    # Programs Needed To Compile netatalk


    | gcc | C compiler. |

    | make | Program that executes a compiling procedure. |

    | patch | Program that applies a source file patch. |


    # How To Verify Programs Are Installed


    ```

    [root@server ~]# make -v

    [root@server ~]# gcc -v

    [root@server ~]# patch -v

    ```


    # How To Add A Program


    ```

    [root@server ~]# rpm -i /mnt/cdrom/RedHat/RPMS/make-3.76.1-5.1386.rpm

    [root@server ~]# rpm -i /mnt/cdrom/RedHat/RPMS/gcc-2.7.2.3-14.1386.rpm

    [root@server ~]# rpm -i /mnt/cdrom/RedHat/RPMS/patch-2.5-5.1386.rpm

    ```'
