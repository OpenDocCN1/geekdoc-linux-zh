  md: '# Using Linux More Efficiently


    # Linux Hints


    This section introduces techniques to manage Linux more efficiently. The shell
    (bash) used to enter commands in Linux has a function called an alias. Using an
    alias allows you to enter often-used commands with even greater ease.


    By making the most of keyboard functions, you can switch between multiple screens
    and terminate running commands.


    # Command Line Alias


    The standard shell used to enter commands in Linux (called bash) has a function
    called an alias. An alias defines a different name for a command, which lets you
    more easily enter frequently-used commands. For example, because the ls command
    is an often used command, entering the following instructions to create an alias
    that executes ls by just typing.


    ```

    [root@server /root# alias l=''ls''

    [root@server /root#] l

    data mbox

    [root@server /root#]#

    ```


    If an alias were simply a different name for a command, it would not be very useful.
    An alias, however, can include options, as follows:


    ```

    [root@server /root#] alias l=''ls'' -F

    [root@server /root#] l

    data/mbox

    [root@server /root#]#

    ```


    Use unalias l to remove this alias.


    # Settings At Login


    Because an alias must be set each time you login, it can be a little troublesome.
    To ensure that the alias is valid, edit the bashrc file, located in the home directory.
    If you add the line l=''ls -F'' to the end of the bashrc file, the alias will
    be valid the next time (and every time) you log in.


    ```

    alias mv=''mv -i''

    alias l=''ls -F''

    ```'
