  md: '# # About The Authors


    Hidenori Tsuji


    The Linux and Unix operating systems are Hidenori''s life: not only in his everyday
    research, but also in his part-time jobs. Presently pursuing architecture, he
    is a Ph.D. at Tokyo University researching various next-generation high-performance-
    microprocessor workstations, he supports himself with part-time work, including
    aging Unix workstations, configuring networks, programming and writing books.
    He has written books including Setting Up a Linux Intranet Server (Impress) and
    A Practical guide to Dial-Up Routers (Softbank Press).


    Hidenori Tsuji E-mail: hide@hide.net


    Acrobyte


    Acrobyte''s focus is on PC-related books and magazines, but is also involved in
    various projects, from software development and production of multimedia content
    right through to installing Unix systems and assembling servers for clients. Acrobyte
    is based in Akihabara in Tokyo. They supervised the translation of Windows 98
    Bible, Windows 98 Professional. Windows 98 Secrets, Windows 98 Registry Blackbook,
    and the Dekiru Windows 98 (all by Impress).


    URL: www.acrobyte.jp/


    Takashi Watanabe


    Takashi Watanabe started in the computer world by spending half of his time at
    elementary school writing frustratingly dysfunctional sample programs in FamilyBasic.
    After toying with N88BASIC and MS-DOS, in 1996 he made the move to Linux. At present,
    he is a graduate student at Waseda University and uses Linux at home and Solaris
    and FreeBSD at school. His favorite programming function is getopt_long. His main
    pastime is playing with the search engine Verno.


    Verno: http://verno.ueda.info.waseda.ac.jp/


    E-mail: watanabe@hide.net'
