    # Passwords: Important Keys


    Passwords are the only keys safeguarding each user''s information. If someone
    else discovers your password, they can log in to Linux using your username. Even
    though you are working on a secure network, it''s impossible to know what they
    are doing. For this reason, even on an intranet, passwords should be managed carefully.
    Also, it is a mistake to think that you will be the only one affected. If someone
    harms the system while using an assumed username, you will not be able to find
    any evidence of this, so not others, will be inconvenienced.


    # Forgetting Passwords


    If a user forgets his or her password, log in as root and set a new, simple password.
    Specify the username and execute the passwd command to set a password. Allow the
    user to log in and set a new password.


