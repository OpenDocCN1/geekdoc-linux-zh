- img_proc: true
  md: '# # How To Configure Linux As A Windows File Server


    # The Role Of Samba


    You can share files and folders between Windows systems connected to a network
    by configuring Windows for file sharing. However, data cannot be seamlessly exchanged
    between Linux and Windows systems.


    Therefore, a software program that emulates the Windows sharing environment in
    Linux has been introduced, permitting files to be exchanged between the systems.
    To the user, it appears as if Windows applications are seamlessly connected to
    one another.


    # ## The Windows And Linux Systems Cannot Seamlessly Exchange Data


    The Linux and Windows systems are not equipped to exchange data directly; Consequently,
    you must add software to Windows systems to allow them to interface with Linux
    systems, or add software to Linux systems to allow them to interface with Windows
    systems.


    You need to install the software on each Windows system to provide the interface.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_121_0.png)


    You only have to install the software on one Linux system to provide the interface,
    which reduces instalment hassles.


    This chapter introduces methods for dealing with the interface problem from the
    Linux perspective, using Samba with priority placed on avoiding trouble for the
    general user.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# The Role Of Samba


    +   - Makes Linux emulate Windows (Windows NT)


    Samba uses a unique interface to match the Windows user interface to make Linux
    appear as a Windows NT server.


    From a Windows system, a Linux system running Samba looks like a Windows NT server
    (or vice versa).


    # Samba


    Mike: 502:xxxxxxxxxx


    Samba uses the same username as Linux.


    # Linux


    Bob: xxxxxxxxxx

    Doug: xxxxxxxxxx

    Mike: xxxxxxxxxx


    ![](img/d549b948a29b14d0d8313a8ed09b5698_122_0.png)


    # Samba And Linux Use Different User Management Systems


    +   - Usernames are the same to allow Samba to use Linux directories and files.

    - Passwords are different to allow Samba to use settings appropriate for Windows.


    | Samba | Linux |

    | Usernames are the same, but passwords are managed independently. |


    Bob: 501:xxxxxxxxxx

    Doug: 501:xxxxxxxxxx

    Mike: 502:xxxxxxxxxx


    Bob: xxxxxxxxxx

    Doug: xxxxxxxxxx

    Mike: xxxxxxxxxx


    # Installation Preparations


    +   - Set the Samba settings.

    - Register the Linux users with Samba

    - Set the user passwords.

    - Set the shared folder settings.

    - Set the sharing settings on the client systems (Windows).


    > Note: Please use the DHCP server introduced in Chapter 5 to connect other PCs
    to the network. They will not connect correctly unless set up in advance.'
  merge: -1
