  md: '# The Role of inerd.conf


    A number of services run in Linux. In a TCP/IP network, IP addresses are used
    to identify computers connected to the network. Ports are used to distinguish
    between the numerous services provided on a single computer.


    | IP address | sendmail [port] | An IP address and a port must be specified to
    receive services provided by Linux |

    |---|---||

    | | qpopper [port] | |

    | | Samba [port] | |

    | | natatalk [port] | |

    | | Apache [port] | |


    The sendmail and Apache services are daemons that run continuously and monitor
    access to their ports. Because qpopper does not run continuously, the daemon inerd
    is used to monitor POP3 access and start qpopper. inet monitors services written
    in /etc/inetd.conf. When accessed, inerd starts the service in accordance with
    inerd.conf. This section explains how to edit inerd.conf so that popper starts
    when POP3 is accessed.


    ```

    pop-3 stream tcp nowait root /usr/sbin/tcpd popper -s

    Service name (port specification) Program name of qpopper

    ```'
