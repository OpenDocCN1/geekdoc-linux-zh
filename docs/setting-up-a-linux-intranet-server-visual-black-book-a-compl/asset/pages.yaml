  md: '# Expanding The File Sharing Hard Disk


    fstab


    In this section, the entire expanded hard disk is assigned to /home.

    To use the hard disk, you must ensure that the partitions are correct, and format
    them for Linux. Use the fdisk command to set up partitions and the mke2fs command
    to format the partitions.


    Move the current data in /home to the new hard disk, and mount the disk. The settings
    used to mount the hard disk during the boot are in file /etc/fstab.


    # Positioning The Hard Disk


    There are restrictions on how to partition a hard disk. A disk can be divided
    into a maximum of four primary partitions. One of these four is an extended partition,
    which can be divided into logical partitions (logical partitions can only exist
    in an extended partition). Linux can use a maximum of 63 partitions for each IDE
    hard disk and 15 partitions for each SCSI hard disk.


    Within these restrictions, you can divide the partitions as you like, although
    you must format (create a file system) and mount each region before you can use
    it.


    In Linux, a number that represents regions on the hard disk is appended to the
    end of hard disk device names. The primary partitions are numbered from 1 to 4,
    and logical partitions start at 5. If a number isn''t appended, it represents
    the entire hard disk.


    # Hard Disk Device Names


    | IDE Hard Disk | SCSI Hard Disk |

    | --- | --- |

    | /dev/hda Primary master | /dev/sda 1st SCSI hard disk |

    | /dev/hdb Primary slave | /dev/sdb 2nd SCSI hard disk |

    | /dev/hdc Secondary master | /dev/sdc 3rd SCSI hard disk |

    | /dev/hdd Secondary slave | : |


    (The numbers are in lowest SCSI ID order.)'
  merge: -1
  pgno: 205
