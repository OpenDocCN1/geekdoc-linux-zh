  md: '# Understanding Permissions


    # Permissions


    All files and directories in Linux have user owners and group owners to whom permissions
    are granted. Permissions specify whether a particular user can access a file or
    directory.


    Permissions are used in Linux to maintain control over files and directories.
    The -l option of the ls command is used to display permissions.


    # Permissions Show Access Privileges To Files And Directories


    Information about the user owner, group owner, and permissions is included in
    all files and directories. When a user attempts to access a file or directory,
    the permission indicates whether they are authorized to do so. When directory
    contents are displayed using the command with the -l option appended, a row of
    nine characters consists of r, w, x, and - is displayed. These characters indicate
    permissions. From the left, three groups of the rwx character string are displayed
    in each letter represents a different permission type while a hyphen (-) indicates
    there is no permission. From the left, these three groups indicate user owner
    access privileges, group access privileges, and other user access privileges,
    respectively.


    ```

    drwxr-xr-x 12 root               1024 Feb 12 1999 local

    drwxr-xr-x  12 root               root

    ```


    ![](img/d549b948a29b14d0d8313a8ed09b5698_75_0.png)


    Directory.


    User owner access privilege.


    Other user access privilege.


    User owner.


    Group owner.


    Group owner access privilege.


    | File | Directory |

    |---|---|

    | r | Read access | File and directory contents can be viewed only. |

    | w | Write access | File and directory contents can be modified or updated. |

    | x | Execute access | File and directory contents can be accessed.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# 3.6 Understanding Permissions


    rwxr-xr-x for a directory (user owner is root. group owner is root).


    # drwx-xr-x 12 root root


    +   - When the user is root, the user can view, modify, and access internal files
    or directories.

    - When the user belongs to the root group, the user can view and access internal
    files or directories.

    - When the user is neither of the above, the user can view and access internal
    files or directories.


    rwxr-xr-x for a file (user owner is root, group owner is root).


    # -rwxr-xr-x 1 root root


    +   - When the user is root, the user can read, write, and execute the file.

    - When the user belongs to the root group, the user can read and execute the file.

    - When the user is neither of the above, the user can read and execute the file.


    # How To Set Permissions


    With permissions, a single number can represent the rwx string, with the total
    permission consisting of three numbers. Here, r is equal to 4, w is equal to 2,
    and x is equal to 1: the sum of the numbers represents the permission. For example,
    the number 7 represents rwx.


    | 4 2 1 |

    |---|---|---|

    | r w x | 4+2+1=7 |

    | r - x | 4+0+1=5 |

    | w - - | 4+2+0=6 |

    | r - - | 4+0+0=4 |


    Because rwx is 7 and r-x is 5, the permission of rwxr-xr-x is represented by the
    number 755.


    | r w x | r - x | r - x |

    |---|---|---|

    | 4+2+1 | 4+0+1 | 4+0+1 |

    | 7 | 5 | 5 |


    The permission number is used when changing file and directory permissions when
    specifying permissions.'
