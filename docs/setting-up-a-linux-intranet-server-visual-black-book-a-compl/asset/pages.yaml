  md: '# Creating Folders For Specific Users Only


    Settings Access Privileges


    Folders for use by specific users only can also be created. To do so, set the
    shared folder to be inaccessible to users other than those specified in Samba.
    This setting is made in smb.conf. Additionally, a shared directory in Linux must
    be created for use by those users specified in smb.conf.


    Although the Samba settings can be as complicated as you, managing Linux users
    and groups together will make these settings easier to work with.


    +   1. Create a shared directory.


    Enter a new directory for file sharing: Enter the command.


    ```

    [root@server /root]# mkdir /usr/local/young

    [root@server /root]# _

    ```


    +   2. Change the directory permissions.


    Enter these two commands:


    ```

    [root@server /root]# mkdir /usr/local/young

    [root@server /root]# chgrp young /usr/local/young

    [root@server /root]# chmod 0770 /usr/local/young

    ```


    > See page 66 for a detailed account of permissions.


    +   3. Edit the settings file.


    Enter the command:


    ```

    [root@server /root]# vi /etc/smb.conf

    ```


    Add the following lines:


    ```

    [young]

    comment = Young Directory

    browable = yes

    create mode = 0770

    directory mode = 0770

    path = /usr/local/young

    valid users = @young

    read only = no

    ```


    After editing smb.conf, use the testparam utility to check for any input mistakes.'
