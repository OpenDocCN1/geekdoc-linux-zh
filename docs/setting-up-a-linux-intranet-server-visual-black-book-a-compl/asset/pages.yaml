  md: '# Compiling: Changing Source Code Into Executable Files


    All programs are created by writing source code. The operation to convert source
    code into an executable file is called _iling_. The programs we have installed
    so far (such as DHCP and Samba) do not need to be compiled because they are supplied
    in rpm file format, which compiles the program from the source code and installs
    it directly.


    # The Role Of make


    The procedure to compile and create a program is written in the Makefile with
    the source code. The **make** command executes the procedure written in the Makefile.


    The compiled program is placed in the same directory as the source code. After
    compiling, execute the **make install** command to execute the procedure that
    installs the created program.


    # How To Distinguish Between The Compiling Method And The Installation Method


    The source usually contains text files named INSTALL and README in which the compiling
    method and the installation method are written. Reading these files the most reliable
    way to distinguish between the two methods.


    If there is an executable file named configure, perform the following steps.


    ```

    [root@server /root]# /configure      Set the environment and create Makefile.

    [root@server /root]# make               Compile.

    [root@server /root]# make install        Install.

    ```


    If there is a file named Makefile, perform the following steps.


    ```

    [root@server /root]# makemf -a      Set the environment and create Makefile.

    [root@server /root]# make               Compile.

    [root@server /root]# make install        Install.

    ```'
