    \ how to use Samba as a logon server, file server, and print server in an NT domain.\n\
    \nAll of the Samba settings are set in a file named smb.conf.\n\n![](img/d549b948a29b14d0d8313a8ed09b5698_123_0.png)\n\
    \n+   1. Move the settings file.\n   - Save the existing file-sharing settings\
    \ file with a different name as a backup.\n   - Enter the command.\n   - `root@server]#\
