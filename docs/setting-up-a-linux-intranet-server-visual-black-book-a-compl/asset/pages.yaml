  md: '# Managing Users And Passwords


    Information about Linux users is stored in the file /etc/passwd. The useradd command
    introduced in this chapter automatically edits the /etc/passwd file. Each line
    contains the information about one user.


    | Username | User ID | Home directory |

    | --- | --- | --- |

    | Bob: Azt30AzZQ4AM | 500:100: | /home/Bob: /bin/bash |


    # Managing Passwords


    Passwords of Linux users are also stored in the /etc/passwd file. Because this
    file can be viewed, passwords are saved in encrypted format. The encryption itself
    is not difficult, but decryption is extremely difficult. This is not to say that
    a password cannot be decrypted, but a great amount of time would be required to
    carry out the calculations involved.


    During password verification at login, the password entered is encrypted and verified
    against the stored password.


