  md: '# 3.7 Basic File Operations

    Input Support Function: Making File And Directory Names Easier To Enter


    The program that displays the command prompt and accepts command input is called
    a shell in Linux. The shell has a function called the input support function for
    file names that automatically supplies the remaining characters of a file name
    after you enter the character.


    If you enter the first character of a file name and press Tab, the input support
    function automatically enters the remaining characters and displays the file name
    if there is only one that begins with that character within the directory path.
    If there are other file names beginning with the same character press Tab twice
    to view a list of possible names. Learning to use this command will enable you
    to avoid repeatedly entering long file names and using the Is command over and
    over.


    Example: Enter a directory name /usr/i386-redhat-linux.


    +   - Type `cd /u` and then press Tab.

    ```

    root@server test]# cd /u

    [root@server test]# cd /usr/

    usr/ is entered automatically.

    ```


    +   - Type `i` and then press Tab.

    ```

    root@server test]# cd /usr/i

    Wrong: there are more than one match, try to be more specific.

    ```


    +   - Press Tab again.

    ```

    root@server test]# cd /usr/i

    1386-redhat-linux 1486-linux-libc5 include info

    [root@server test]# cd /usr/i

    ```


    +   - Type `3` and then press Tab.

    ```

    root@server test]# cd /usr/i

    1386-redhat-linux 1486-linux-libc5 include info

    [root@server test]# cd /usr/i3 Tab

    ```


    ```

    ```

