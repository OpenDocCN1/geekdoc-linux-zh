    ![](img/d549b948a29b14d0d8313a8ed09b5698_105_0.png)


    # DHCP Explained


    DHCP is a service that assigns IP addresses automatically within a previously
    specified range. When DHCP is used with a PC network, it assigns an available
    IP address automatically to a PC as soon as the PC is turned on. Using DHCP is
    convenient because the person using the Windows or Macintosh PC does not need
    to know the IP address.


    # Contents Of dhcpd.conf


    Both network information and the range of IP addresses automatically assigned
    by DHCP are set in the file dhcpd.conf. The network used in this book has an address
    range of 256 addresses, starting from 192.168.1.0. The network address is 192.168.1.0.
    The netmask address is 255.255.255.0.


    The largest IP address in this range (192.168.1.255) is the broadcast address.
    From within this address range, DHCP assigns 63 IP addresses (192.168.1.64 through
    192.168.1.126) that do not overlap with other machines, including Linux.'
