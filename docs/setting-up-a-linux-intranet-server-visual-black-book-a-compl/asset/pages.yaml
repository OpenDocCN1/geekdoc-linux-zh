- img_proc: true
  md: '# Partition


    # make


    The make command executes a procedure to write to a file named "Makefile". The
    make command is often used to compile programs many people say "make" when referring
    to the compiling of a program environment.


    See also compile and development environment.


    # Mode


    The word "mode" has many meanings. For example, the "mode of a file" indicates
    permissions. A "vi mode" indicates the state of the editor (input mode / edit
    mode).


    See also vi and permissions.


    # Mount


    Linking a file system to a specified device. In Linux, one large directory structure
    is used. When a hard drive or CD-ROM is initially used, you will link to one partition
    of this large structure.


    See also file system.


    # N


    # NE2000


    An NE2000 compatible is a network card that can be used by Linux. NE2000 compatibility
    is defined as having functions compatible with the standards of a network card
    NE2000.


    See also Ethernet and network card.


    # netatalk


    The name of a server that provides services with a Macintosh system.


    URL:www.umich.edu/~rsug/netatalk See also AppleTalk.


    # NetBIOS


    A protocol to allow Windows to communicate in a TCP/IP network. A name used by
    NetBIOS to distinguish gucs and peripherals is a "NetBIOS name."


    See also TCP/IP!


    # Netmask


    A figure dividing addresses of an entire network and addresses within a network.


    See also network address, broadcast address, and IP address.


    # Network


    A network connects computers and allows communication.


    # Network address


    An address that indicates the entire network. See also network address, broadcast
    address, and IP address.


    # Network card


    An expansion card for connecting a network. Also called an Ethernet card, LAN
    card and a NIC (network interface-card).


    See also Ethernet and LAN.


    # nobody


    A system defined user name. Although this user doesn''t exist as such, it''s not
    generally possible to log on with the user name "nobody". The name is used in
    Linux when it''s necessary to have a user with the lowest possible access rights.


    See also user.


    # NT domain (Windows NT Domain)


    Range in which users login to a network in Windows are managed. See also login.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_246_0.png)


    # Open source


    URL:www.opensource.org


    See source.


    # Option


    See command.


    # OS (Operating System)


    Fundamental software program for using a computer. An OS allocates resources to
    computer users and processes.


    # Owner


    A user that corresponds to a file to manage permissions of files and directories.
    Usually, the user who creates the file becomes the owner of the file. The owner
    of a file can be changed using the "chown" command.


    See also user and permissions.


    # P


    # Package


    In Linux, a package is a format that allows software to be quickly and easily
    installed.


    See directory.


    # Parent directory


    A region on a hard drive. On PC/AT compatible machines the following restrictions
    exist when creating partitions due to limitations of MS-DOS. There can be a maximum
    of four primary partitions. When setting more than four primary partitions, from
    among the primary partitions, one partition will be set to an extended partition,
    and the extended partition will be divided into several logical partitions.


    # Partition


    # 237'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Password


    # Primary group


    A key to access a computer. During log in Linux, the user name and password typed
    verify the user.

    See also user and log in.


    See group.


    # Primary partition


    See partition.


    # Path


    A route followed to a file. Directories in a path are separated by (/). The path
    that starts from the root directory (/) is an absolute path, and paths that start
    from current directories other than the root directory are called relative paths.

    See also directory.


    # Printer sharing


    See share /sharing.


    # Private address


    An address that cannot be used on the Internet. It is recommended to use private
    addresses on an internal network. The range of private addresses can be: 100.0.0–10.255.255.255
    (a network that has 16,277,216 addresses), 172.16.0.0–172.31.255.255 (65,536 X),
    and 192.168.0.0–192.168.255.256 (256 X). The instructions introduced in this book
    on how to set up a network used addresses of 192.168.1.0–192.168.1.255.

    See also IP address, and internet.


    # Patch


    A revision for text files. Often used to revise source files. Moreover, "patch"
    is also the name of a program to apply a patch.

    See also text file.


    # PCI (Peripheral Component Interconnect)


    A standard for connecting peripheral devices such as network cards and SCSI cards
    to a PC.

    See also ISA and PCI.


    # Process


    An executed program running on an OS. Each process is managed by an integer value.
    When a program is executed, a process is created and a process ID is assigned.
    At this time, processes that have identical IDs cannot exist simultaneously. When
    the execution completes, the process is deleted.

    See also program.


    # PCMCIA


    A standard for connecting peripheral devices such as network cards and SCSI cards
    to a PC. Used mainly for notebook PCs. Originally, the name of an organization
    (Personal Computer Memory Card Association) that managed standards but now, it
    concerns the use of slots or cards.

    See also ISA and PCI.


    # Program


    Computer code that can be executed (run) on a computer. Almost all are saved in
    files.

    See also process.


    # Permissions


    Access rights to files and directories. In Linux, you can set whether or not to
    allow reading, writing, and for three types of users: owners, groups, and others.
    Also called files and methods.

    See also user and group.


    # Prompt


    A character string displayed on screen, such as a command line for editing input.
    In addition to the command line displayed by the shell, there is a login prompt
    and a LILO prompt during the boot sequence.

    See also command.


    # POP (Post Office Protocol)


    Communication method for sending your email to a mail server to another address
    in TCP/IP network.

    See also qpop and SMTP.


    # Pseudo ty (virtual terminal)


    A port of a hub is an inlet for connecting cables. Moreover, in TCP/IP, another
    location is specified by an IP address, and a service is specified by a port number.

    See also hub, IP address, and server / service.


    # Port


    A virtual terminal allows identical operations from another networked PC if you
    were using a PC with Linux directly installed on it. A screen emulated by an application
    as telnet is called a virtual terminal (pseudo ty).


    # PostScript


    # Q


    # qpopper


    Name of a programming language for printing a printer. Printers that correspond
    to the PostScript language


    Name of a POP server introduced in this book.

    URL: www.eudora.com/freeware

    See POP.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# R


    Red Hat


    Company that produces a Linux distribution is also the name of the distribution.
    Red Hat Linux CD-ROM is available for purchase.


    URL: www.redhat.com.


    See also Linux and distribution.


    # Relative path


    See path.


    # root


    User who administrates a Linux system, also called a super user. Root is a user
    who is not restricted by Linux security. For example, permissions attached to
    files and directories are not valid for root. The root user can read and write
    all files and directories.


    See also user.


    # Root directory


    See directory.


    # rpm (Red Hat Package Manager)


    Name and file of a Red Hat Linux package (a software format that allows quick
    installations). Also the command for operating rpm files.


    See also Red Hat.


    # S


    # Samba


    Name of a server that provides sharing services with a Windows system in Linux.


    URL: www.samba.org.


    See also share / sharing.


    # SCSI


    Small Computer System Interface. A standard for connecting peripheral devices
    such as hard drives and CD-ROMs to a PC. Pronounced "scuzzy".


    See also IDE.


    # sendmail


    Name of an e-delivery mail server introduced in this book.


    URL: www.sendmail.org


    See also SMTP and server / service.


    # Server / service


    A service provides some type of useful utility or service to other computers,
    and a server is a program that provides these services. In this book a dhcpd service
    provides a Samba server that provides sharing services with Windows were introduced.


    See also daemon and network.


    # Share / sharing


    Sharing refers to the ability to access files and directories from separate computers
    on a network. In this book, software called Samba and netalk are used to share
    files and printers located on a Linux server from Windows and Macintosh systems.


    See also Samba and netatall.


    # Short cut


    See symbolic link.


    # shutdown


    Stopping the system. When exiting Linux, rebooting or turning OFF the power a
    correct shutdown must be executed. Because there is a chance that data may be
    lost before writing to the disk if the power is suddenly turned OFF:


    # SMTP


    Simple Mail Transfer Protocol. Set of communication for delivering email using
    TCP/IP.


    See also email and sendmail.


    # Source


    A text written by a person when creating a program. The execution procedure of
    a program is written in source. Compiling a source produces an executable file.
    It was often the case that source was the property of developers. Due to the success
    of Linux and (to a greater degree) GNU/FSF, however, great interest developed
    in the idea of making source publicly available and allowing all interested people
    to develop programs (source).


    See also Linux and Apache.


    # Source file


    See source.


    # Source list


    See source.


    # Spool


    A location where data is temporarily stored when sending data to another device
    or program. In Linux, the data is often placed in the /var/spool directories.
    The spool is used to store mail not yet received and data sent to a printer.


    # Straight cable


    A cable connecting a PC and by Ethernet. See also cross cable and Ethernet.


    239'
