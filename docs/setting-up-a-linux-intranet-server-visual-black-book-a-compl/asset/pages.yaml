  md: '# Glossary


    Number

    10Base-T

    100Base-TX

    See Ethernet.


    Argument

    See command.


    B

    Back up

    Saving and storage of data at a separate location to prevent catastrophic data
    loss due to software and/or hard-failure.


    A

    Absolute path

    See path.


    Boot disk

    A floppy disk used when loading a PC OS.


    Access rights

    See permissions.


    Boot manager

    A program that allows you to select a bootable OS during a system boot.


    Address

    Number or name for specifying another device location. On the Internet, an address
    is a number used to specify a computer or device. An email address is a character
    string that specifies a destination for email.

    See email and IP address.


    Broadcast address

    An IP address is used for communication between all devices in a network.

    See IP address, and network address.


    Administrator, admin

    See root and user.


    Bug

    An error in a program.


    Alias

    Refers to defining another name for a command in Linux. On a Macintosh system,
    a symbolic link to a file is called an alias.

    See symbolic link and command.


    C

    Cascade

    See hub.


    CF

    Program to create a settings file (sendmail.cf)

    See sendmail.


    Apache

    Name of the most widely used Web server in the world.

    URL: www.apache.org

    See Web.


    Command

    Called a line in Linux, the command line forms the interface where character strings
    (commands) are input and returned. Using spaces after the command line allows
    character arguments to be passed to commands among arguments, an option is the
    device that defines the way a command operates. When using many options for a
    command, specify the options by continuing one character after a double hyphen
    (-) or however, an exception is the ps command (a (-) is not prepended) and the
    tar command (a (-) need not be prepended.


    AppleTalk

    Set of information exchange rules when a Macintosh system communicates via, for
    example, Ethernet or LocalTalk.

    See netalk.


    Archive / archiver

    Archive refers to a program that collects numerous files and places them in one
    file and a file created by an archive is called an archive. The arch most used
    in Linux is tar. Archives used in Windows are WinZip and Stuff. In Linux archive
    and compression software are considered to be separate programs and in many cases
    an archive file is compressed separately.

    See compress.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Compile/compiler


    Compile / compiler


    Compiling is the operation to convert source code into an executable file. A compiler
    is a program that translates source code into an executable file. In Linux the
    compiler command is make.


    See also source, make, GNU.


    # Compress


    Referring to reducing the size of data. Returning the data to its original state
    is called extraction. In Linux, the compression program mainly used is gzip.


    # Cross cable


    A cable for directly connecting two PCs. See also straight and ethernet.


    # Current directory


    Refer to the present location within the file hierarchy. The current directory
    is indicated by a dollar and slash ($/). The directory after logging in is the
    home directory. The home directory is the directory from which user operations
    start initially.


    See also directory and path.


    # D


    # Daemon


    A program executed during the boot of Linux and continues to run/process services.


    See also server / service.


    # Default


    A fixed value is assumed if nothing is specified. The default value can also be
    changed.


    # Development environment


    A set of files and programs needed to create programs. It will be necessary to
    compile programs from source to install software. The development environment
    used in Linux is GNU.


    See also compiler, source, and GNU.


    # Device


    A piece of peripheral equipment. Hard drives, keyboards and mice are attached
    to each device. In Linux, files exist that correspond to devices, and access to
    the devices is made through these files. The file name of the file that corresponds
    to a device is the device name, and these files are always placed in the /dev
    directory.


    # Device name


    See device.


    # DHCP (Dynamic Host Configuration Protocol)


    Method to automatically handle the network settings of an operating PC (such as
    IP address or netmask). See also IP address and network.


    # Directory


    A location where files are placed, equivalent to a folder in Macintosh and Windows
    systems. In Linux, there is one large directory and the root of that structure
    is called the root directory and is represented by a slash (/). Files and other
    directories are placed within a directory. To represent that directory is contained
    within Directory, B is called a subdirectory of A, or conversely, A is the parent
    of B. A parent directory is represented by two periods and a slash (..).


    See also user, current directory, and path.


    # Distribution


    See kernel and Linux.


    # Driver


    A driver is a piece of software necessary to use hardware (device).


    # Domain name


    See host name.


    # Dual speed hub


    See hub.


    # E


    # Email


    A method to transfer messages across a network. See also sendmail, ppopper, and
    POP.


    # Ethernet


    Communications protocol and hardware that enable two or more computers to share
    information. Divided into two types: 10Base with a maximum data transfer speed
    of 10Mbits/sec and 100Base with a maximum data transfer speed of 100Mbits/sec.
    There are many cables and connections used, which utilize modular Base-T and 100Base-TX
    are mainly used. See also LAN.


    # Extended partition


    See partition.


    # F


    # fdisk


    Name of a program to set disk partitions.


    See partition.


    # File server


    A server that manages files. See also share / sharing.


    234'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# File sharing


    See share / sharing.


    # File system


    A structure that defines access to files. Linux uses many different systems, ext2
    is mainly used for Linux, iso9660 is used for CD-ROMs, and vfat is for Windows.
    When mounting a disk using the mount command, append -a option to specify a system
    or specify a file system using the fstab command.


    See also fstab.


    # Folder


    See directory.


    # FSF (Free Software Foundation)


    See GNU.


    # fstab


    Settings file which information is written about file systems to be loaded automatically
    during the boot procedure.


    See mount file system.


    # FTP (File Transfer Protocol)


    Communication used when transferring files in a TCP/IP network.


    See also HTTP.


    # G


    GNU a freely and changeable software development project. GNU (short for GNU''s
    Unix) software is distributed by the FSF (Free Software Foundation). All distributions
    of Linux use many GNU software packages such as compilers, basic commands and
    editors. A GPL (General Public License) is a software license that defines the
    GNU software, protects the freedom to redistribute and change. The Linux kernel
    is also distributed by GPL.


    URL: http://www.gnu.org


    # GPL (General Public License)


    See GNU and source.


    # Group


    A unit which contains and managing rights of users. There are groups for directories
    and access rights of users belonging to these groups can be set. Moreover, users
    must belong to one or more groups, and the grouping to which they initially belong
    is called the primary group. All users are set to belong to the primary group.


    See permissions.


    # Group owners


    Used to manage permissions of files and directories of group owners. Group owner
    file permissions are set in the file group belonging to the primary user group.
    The group owner settings of a file can be changed using the chgrp command.


    See also group and permissions.


    # H


    # Hidden files


    A file name begins with a period (.). Hidden files are placed in the home directory
    as settings of individual users. Hidden files will not be displayed if -a is not
    appended to the ls command. Because these files are not displayed by the ls, they
    will be a nuisance.


    # Home directory


    See current directory.


    # Host name


    A character string represents a name of a computer. A host is expressed using
    a combination of alphanumeric characters and hyphens (-). A domain name is a string
    that represents the system to which the address belongs. Alphanumeric characters
    and hyphens are used for domain names and separated by dots.). Ever names can
    be made by adding characters to the end of a string. You can also express domain
    and host names by adding a dot.


    See also IP address.


    # HTTP (Hypertext Transfer Protocol)


    Communication used when transferring Web pages in a TCP/IP network.


    See also FTP and Web.


    # Hub


    A device connecting PCs by Ethernet. There are different types of hubs, including
    hubs; that transmit only a given speed in a network, dual speed hubs respond to
    100BaseTX, and switching hubs regulate the transmission of information increase.
    A special port is sometimes attached to a hub, allowing the network to be expanded
    by connecting this port to another hub. This is known cascading.


    See also Ethernet.'
  merge: -1
  pgno: 244
- img_proc: true
  md: "# ID (identifier)\n\n# LAN (Local Area Network)\n\nID (identifier)\nUsed to\
