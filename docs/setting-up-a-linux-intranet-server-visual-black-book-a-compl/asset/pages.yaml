  md: '# Network Essentials


    # Networking Devices


    Two Ethernet products for constructing a LAN are commonly available: a 10Base
    Ethernet with a maximum data transfer rate of 10Mbps and a 100Base Ethernet with
    a maximum data transfer rate of 100Mbps. Either product can be connected by several
    methods, but the main


    connections in use are 10Base-T (the most common alternative cable is coaxial,
    which is 10Base-2), and 100Base-TX, which use cables with jacks similar to the
    modu''ar telephone jack (known as the RJ-45 connector). Be aware that these connections
    require different accessories.


    # Network Cards


    There are many network cards produced by different manufacturers, with great differences
    in price and performance. To use a network with Linux, make sure that you purchase
    a network card that is compatible with NE2000; that is, the performance of the
    network card should be equivalent to the specifications of the NE2000 product.
    Check that "NE2000-compatible" is printed on the package or have the sales clerk
    confirm this for you. Also, made for either ISA slots or PCI slots; be sure to
    choose the latter (provided that your computer supports PCI).


    ![](img/d549b948a29b14d0d8313a8ed09b5698_31_0.png)


    +   * NE2000-compatible card.

    * Card made for PCI slot.


    There is the possibility that some NE2000-compatible cards may not function well
    with Linux. We recommend reading the how-tos and the FAQs (www.linuxdoc.org) or
    choosing three or four commonly available brands and asking Red Hat (provided
    you purchased and registered the CD-ROM) which any of these cards have been proven
    to work. In this, you''ll quickly find one suitable for the Windows PC used as
    the client.


    # Hubs


    +   * Select a hub with sufficient ports for the number of devices to be connected.
    A hub with eight ports should suffice. A hub is a device used to connect multiple
    personal computers and devices. Many models are available, from four ports to
    hubs with dozens of ports.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# 1.5 Network Essentials


    A hub with only a few ports will soon prove to be insufficient, and we recommend
    a relatively inexpensive eight-port hub. If more ports are required with the expansion
    of the LAN, purchase a hub with greater capacity or use several eight-port hubs
    in series. As a basic rule, a 10Base-T hub can only be used with a 10Base-T connection,
    and a 100Base-TX hub can only be used with a 100Base-TX connection. A dual-speed
    hub is required if a dual 10Base and 100Base LAN is constructed, but this kind
    of setup is not recommended.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_32_0.png)


    # Using A Switching Hub To Expand A LAN


    A switching hub is a hub that controls the flow of data in a network. This traffic
    control alleviates network congestion. It''s time to purchase a switching hub
    when the network has definitely slowed down and the cause proven to be an excessive
    number of connected PCs. Almost all 100Base-TX switching hubs are equipped with
    the dual-speed hub function and can be connected to 100Base-T or 100Base-TX LANs.


    # Cables


    +   - Use twisted-pair cables (although with any 10Base hubs, you may be able
    to use straight-coaxial-cable that uses a BNC connector).

    10Base-2 cable cannot carry a 100Mbs signal, so this option isn''t available with
    100Base products.

    - Match the cable length to the distance between the hub and the personal computers.
    Short distances do not matter, but long ones may cause timing problems.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_32_1.png)


    Many types of cables are available. Almost all cables on the market support both
    10Base-T and 100Base-TX connections, so acquisition is not a problem. Be sure,
    however, to purchase twisted-pair cables.'
  merge: -1
