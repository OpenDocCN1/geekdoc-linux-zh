- img_proc: true
  md: '# The Little-Used Shutdown Command


    Linux, when a setting is changed, only the portion related to that change needs
    to be restarted (unlike Windows and Macintosh, where the entire operating system
    must be restarted); therefore, the need to restart Linux itself is rare. If a
    problem develops in the system, finding the source of the problem and taking steps
    to resolve it, rather than restarting the system, allows Linux to continue operations
    without hindrance.


    Even when you stop working and log out, you should not shut Linux down because
    the server functions will continue to operate. This is why the shutdown command
    is infrequently used.


    # How To Use The Shutdown Command


    The options for the shutdown command are shown below:


    ```

    shutdown -option time [message].

    ```


    Be sure to specify a time to stop the system when using the shutdown command.
    If you specify "now", operations begin to stop just after the shutdown command
    is executed. If you specify "+30", operations begin to stop 30 minutes later.
    If you specify "6:00 a.m.",, operations begin to stop at that clock time.


    A message used to notify all users logged in Linux of the system shutdown can
    be attached to the shutdown command.


    # MESSAGE


    The following message will display on all computers connected to Linux via a telnet
    connection:


    ```

    shutdown +5 because of a power cut

    ```


    The following message will display on all computers connected to Linux via a telnet
    connection:


    ```

    Broadcast message from root (ttyp0) Tue Jan 26 15:07:08 1999... because of a power
    cut The system is going DOWN to maintenance mode in 5 minutes !!

    ```


    # MESSAGE


    # Shutdown Command Options


    +   - shutdown -h Quit Linux.

    - shutdown -r Restart Linux after quitting.

    - shutdown -c Specify a time and cancel an already executing shutdown.'
