  md: '# Why Are Passwords In Samba Set Separately?


    The user passwords to access Linux are managed in /etc/passwd; passwords to access
    Samba are managed separately in /etc/smbpasswd. Why is it necessary to separate
    the password management files?


    Simply, user passwords are saved in an encrypted state. The encryption method
    is discussed in Chapter 4. The encryption itself is not difficult, but returning
    to the original file from an encrypted state is difficult. Additionally, Windows
    and Macintosh use different encryption methods.


    Password security has been enhanced with Windows 98. A password entered while
    sharing is sent through the network in an encrypted state. Samba running on Linux
    receives the encrypted password, but because the encryption method is different,
    cannot verify against passwords stored in the Linux file /etc/passwd. Although
    restoring the encrypted data is not possible, it is extremely difficult. This
    makes it impossible to verify the password by restoring the encrypted password
    and then encrypting it again using Linux''s method. Consequently, you must first
    save passwords encrypted by Windows 98.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_135_0.png)'
