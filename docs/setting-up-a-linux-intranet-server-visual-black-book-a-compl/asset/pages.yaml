  md: '# Linux Is A Type Of Unix


    Although Linux is an OS (like Windows or Mac OS), it is an independently developed
    Unix-like OS that you can use for diverse applications ranging from operating
    personal computers to running specialized computers, such as workstations, minicomputers,
    and even supercomputers. Since its origin in 1971 at AT&T Bell Laboratories, Unix
    has undergone a variety of complex derivations and combinations; that is, the
    modern Unix is the result of a global development effort. Linux, as a Unix work-alike,
    falls under this umbrella.


    Various functions included in modern operating systems such as Windows are based
    on technology developed for Unix. The Internet was originally a network of Unix-operated
    computers. Unix is currently used for Internet servers and in research laboratories
    and universities.


    # Open Source


    Some Unix applications are open source software (OSS), but most are proprietary.
    Most Linux applications, however, are OSS, and the source code is publicly disclosed.
    There are many licensing regulations for OSS, as explained in the Open Source
    Definition (OSD).


    OSS programs are publicly available, and permission is granted to anyone to modify
    these programs. The software itself is usually no-cost, and the acquired programs
    can be improved and distributed in accordance with the licensing regulations,
    making it possible for people anywhere to participate and build upon programs
    that move ever higher in terms of quality.


    # What Is Linux?


    Linux is a Unix-like OS for personal computers created through the global cooperative
    efforts of people working through the Internet, led by Linux B. Torvalds of Finland.
    The first version of Linux was released on October 5th, 1991, and daily evolution
    has continued ever since.


    Almost all of the tools required to use Linux and the applications that run on
    Linux are OSS applications in accordance with the licensing regulations stipulated
    by the General Public License (GPL) of the Free Software Foundation (FSF).'
  merge: -1
