  md: '# Understanding Directories


    # Creating Linux Directories


    All Linux files are kept in directories, which are equivalent to folders in Windows
    and Macintosh. Directories can be placed within directories in a structure called
    nesting. At the base of this nesting structure is the root directory. The positional
    relationship of


    directories and files is known as a path. This path is essential to command line
    operations, so make sure that you understand what this term means.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_67_0.png)


    # Linux Directories: The Same As Windows Folders


    Linux directories are equivalent to folders in Windows and Macintosh, and just
    like folders, directories can be placed within directories. If directory B is
    within directory A, then A is called a parent directory, while B is called a subdirectory
    of A. In Linux, all directories and files are located within the root directory,
    so moving up through parent directories will eventually lead to the root directory.


    # Directory Hierarchy Of Linux


    From the root directory, all other directories form a hierarchy. Frequently used
    directory names are predetermined. Identical directory names can appear at various
    directory levels, but the directories'' contents differ depending on their location.


    | (Root directory) | Directories placed near the root directory in the hierarchy
    are either important or frequently used. |

    | --- | --- |

    | bin | |

    | dev | |

    | etc | |

    | mnt | |

    | sbin | |

    | tmp | |

    | usr | Everything except the most basic files is placed here. |

    | bin | |

    | lib | |

    | local | Files added after initial installation are placed here. |

    | bin | |

    | sbin | |'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# 3.2 Understanding Directories


    # General Directory Names


    | bin | Commands |

    | sbin | Commands for the system administrator |

    | dev | Files for accessing devices |

    | etc | Configuration files

    | lib | Libraries (program segments and data)

    | mnt | Temporary mount location

    | tmp | Temporary storage location |


    The root directory is represented by a slash (/) in Linux. If there is a directory
    within the root directory, it is represented as /A. Further, if there is a subdirectory
    within directory A, a slash symbol is used to separate the two directory names,
    and it is represented as /A/B. This method of using a slash symbol and the directory
    names to represent a location is known as a path. In Linux, all directories and
    files can be designated using a path starting at the slash symbol. The path starting
    at / (root directory), as in /A/B, is called an absolute path.


    > The path on the right represents directories forming this kind of hierarchy.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_68_0.png)


    # Current Directory: Base Of Operations


    Rather than designating an absolute path every time, you can use the double-dot
    symbol to indicate the parent directory of the directory you are currently in.


    # cd ..


    ![](img/d549b948a29b14d0d8313a8ed09b5698_68_1.png)


    cd .. changes your location from the /A/B directory to the /A directory.


    The directory where you are currently working is the current directory. When a
    slash symbol is not appended to the beginning of the path, the location is represented
    relative to the current directory and is therefore called a relative path.


    # Uppercase And Lowercase


    File and directory names in Linux are case sensitive. For example, /usr and /USR
    are treated as different items, so pay attention to case when entering commands.'
