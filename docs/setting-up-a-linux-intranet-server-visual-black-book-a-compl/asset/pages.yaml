  md: '# Mastering Commands


    # Commands


    The command line interface--in which commands are entered and a response results--central
    to all operations in Linux. Commands are character strings entered at the command
    prompt to execute an operation.


    To specify what type of action the command should perform, arguments are entered
    after the command with character strings separated by spaces. You can modify the
    action of a standard command by specifying an option as an argument.


    # Understanding Command And Argument Relationships


    All operations in Linux are executed by entering a command at the command prompt
    and pressing [Enter]. A command is a character string that designates an operation.
    After the command is executed, the results are displayed on screen. The command
    prompt is then ready to accept the next command.


    Many commands accept arguments, which are used to specify what type of action
    the command should perform. Arguments are entered after the command, with the
    character strings separated by spaces. To specify that a space is included within
    an argument, surround it by single quotation marks ('').


    > Insert a space between a command and an argument (more than one space can be
    inserted).


    ```

    [root@server/root]# argument argument...

    ```


    > When placing a space within an argument, surround it by single quotation marks
    ('').


    # How To Use Options


    An option is one type of argument. When you want to modify the function of a standard
    command, specify an option. The method used to specify an option differs depending
    on the command, although most options are entered with a hyphen (-) followed by
    a character string.'
  merge: -1
  pgno: 69
