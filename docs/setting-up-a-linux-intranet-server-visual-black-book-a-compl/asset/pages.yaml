    # IP Addresses


    An IP address is a number used to identify each PC and peripheral device connected
    to the network. It consists of a combination of four numbers, each ranging from
    0 to 255. Because the numbers are used to identify individual computers or devices,
    problems will occur if the same number is repeated within one network.


    If PCs Have The Same (P Address)


