  md: '# # Shutting Down Linux Safely


    # ## Checking For Users


    Abruptly disconnecting the power when turning off an expanded hard disk, SCSI
    card, or other device may cause damage to the file system. When shutting down
    Linux, you must stop the system safely.


    Linux users must be notified in advance of the shutdown. Use the **mbstatus**
    command to determine which users are currently using Samba. Netatalk doesn''t
    have a command like **mbstatus**, but the following section covers how to determine
    which users are using netatalk.


    # ## Checking Each Service For Linux Users


    # Samba


    Use the **mbstatus** command supplied with Samba to view information about users
    who are currently logged in.


    ```

    [root@server /root]# mbstatus@

    ```


    | Samba version 1.9.18p10 | |

    | Service | uid | gid | pid | machine |

    | --- | --- | --- | --- | --- |

    | Mike | Mike users | 1702 | pc-Mike (192.168.1.1) | Fri Feb 12 20:37:02 1999
    |


    No locked files


    Share mode memory usage (bytes):

    102232(99%) free + 112(0%) used + 56(0%) overhead = 102400(100%) total


    ```

    [root@server /root]#

    ```


    # netatalk


    To determine which users are currently using netatalk, view the operating status
    of afpd, a program related to netatalk.'
