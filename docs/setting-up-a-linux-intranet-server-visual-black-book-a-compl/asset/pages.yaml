  md: '# Explaining IP Addresses


    In building a TCP/IP network, the range of IP addresses for the network must be
    determined. For this, determine the maximum number of IP addresses that will be
    used, then specify the range required to secure this number of addresses. In earlier
    versions, the maximum number was set as 256 addresses. 65,536 addresses, 1,677,216
    addresses (IPv6, which is already supported by Linux, extends this substantially
    and will probably be in common usage within the next one to two years). IP addresses
    for use with an intranet are private addresses for which assigned addresses are
    limited by class.


    | 10.0.0.0 to 10.255.255 | Range for using 1,677,216 addresses (Class A) |

    | 172.16.0.0 to 172.31.255 | Range for using 65,536 addresses (Class B) |

    | 192.168.0.0 to 192.168.1.255 | Range for using 256 addresses (Class C) |


    This book explains the construction of a simple intranet in which a Linux server
    and multiple personal computers, printers, and other devices are connected by
    a LAN. The Class C range of 256 addresses from 192.168.1.0 to 192.168.1.255 was
    selected.


    # Use Of IP Addresses


    In this book, the IP address 192.168.1.1 is assigned to the Linux server. This
    is the first number that can be used within the range of IP addresses from 192.168.1.0
    to 192.168.1.255.


    # Range Of IP Addresses Used In This Book


    +   192.168.1.0 - Network address

    (This is the first address for the network and is not assigned to personal computers
    or devices.)


    +   192.168.1.1 - Actual usable range (254 addresses)


    +   192.168.1.255 - Broadcast address

    (This number is the address used to communicate with the entire network and is
    not assigned to personal computers or devices.)


    A network address and a broadcast address are used to specify the range of addresses
    used by a network: The broadcast address is the last address of the specified
    range and is used to communicate a notice to the entire network. Neither the network
    address nor the broadcast address can be assigned to specific personal computers
    or devices. For the range of addresses from 192.168.1.0 to 192.168.1.255 as used
    in this book, 192.168.1.0 is the network address and 192.168.1.255 is the broadcast
    address.'
  merge: -1
