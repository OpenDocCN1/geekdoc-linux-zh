    The netatalk settings files allow registered Linux users to view their home directory
    from their Macintosh system. Download the Applevolumes.default, Applevolumes.system,
    and rc.atalk files from the


    Booting netatalk usually requires about 20 to 30 seconds, depending on the environment.
    During this time, netatalk examines the network and obtains AppleTalk information.
    In this section, you will set netatalk to boot automatically when Linux boots.


    ```

    ftp.corialis/linux/net_server.vbb

    ```


    +   Change directory.


    To the directory containing the downloaded netatalk settings file.


    Enter the command.


    ```

    [root@server netatalk-1.4b2]# cd /usr/local/src/netatalk-1.4b2/config

    [root@server config#]# -

    ```


    +   Copy the settings file.


    > TIP!

    The Meaning Of An Asterisk (*)

    An asterisk (*) placed somewhere in a file name is a wild card, to substitute
    for any character.


    Enter the three commands.


    ```

    [root@server netatalk-1.4b2]# cd /usr/local/src/netatalk-1.4b2

    [root@server config#]# cp AppleVolumes.* /usr/local/atalk/etc

    [root@server config#]# cd /usr/local/atalk/etc

    [root@server etc#]# cp rc.atalk /etc/rc.d/init.d

    ```


    +   Set netatalk to boot when Linux boots.


    Enter the command.


    ```

    [root@server etc#]# cp rc.atalk /etc/rc.d/init.d

    [root@server etc#]# ln -s /etc/rc.d/init.d/rc.atalk /etc/rc.d/rc3.S99atalk

    [root@server etc#]#

    ```


    > TIP!

    The Role Of The In Command

    Linux uses in to create a symbolic link, which is equivalent to a Macintosh alias
    or Windows shortcut.


