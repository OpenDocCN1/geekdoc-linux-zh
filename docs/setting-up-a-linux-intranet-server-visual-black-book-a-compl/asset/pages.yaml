    \ the smb.conf file from coriolis.com/linux_service folder. We recommend using\
    \ an FTP (file transfer protocol) such as WS-FTP for Windows or Fetch for Macintosh.\n\
    \n+   3. Register Linux user data with Samba.\n   - The data is converted to enable\
    \ Linux users to share files.\n   - Enter the command.\n   - `root@server /root]#\
    \ mksmbpasswd.sh < /passwd > /etc/smbpasswd ...`\n\n> Note: This operation involves\
    \ inputting the etc/passwd file into the mksmb-passwd.sh command and outputting\
    \ that result in the /etc/smbpasswd file."
