  md: '# # What You Can Do With Linux


    # ## Server Functions


    Setting up a server by installing Linux on a PC means that you can conveniently
    connect and use multiple computers, previously used as standalone PCs, on a *local
    area network (LAN)*


    Linux also enables you to connect to the Internet to post information and to communicate
    by email. As a first step in constructing a server, this book explains how to
    set up a Linux server for an intranet.


    # ## Linux Is Best Suited For An Intranet


    A small network formed by computers connected by a LAN is called an intranet.
    You can do the following by using Linux as the intranet server:


    +   * Share data among computers.

    * Connect only one printer for use by multiple computers.

    * Construct a Web server for transmitting information within the intranet.

    * Exchange email within the intranet.


    Use Linux for an intranet:


    +   * Connect the PCs and a printer by a network.

    * Use Linux as the server.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_25_0.png)'
