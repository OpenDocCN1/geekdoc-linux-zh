  md: '# # Displaying Directory Contents


    # ## list command (ls)


    The ls (list) command is used to display information about the files and directories
    located within a directory. Execute this command without an argument to display
    information about the current directory. You can also specify a directory to display.


    The ls command can display various types of information by passing options to
    the command as arguments. More than one option can be specified. The ls command
    is probably the most frequently used command in Linux.


    # ## Using The ls Command To Display Directory Contents


    Files in Linux are the same as files in Windows and Macintosh: consisting of many
    applications, and text and data files. A directory can contain numerous files
    and subdirectories. Appending the -l option to the ls command results in the display
    of detailed information about the files and directories. Further, appending the
