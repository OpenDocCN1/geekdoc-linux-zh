  md: '# Chapter 3. Mastering The Basics Of Linux Operation


    # Using The rm Command To Delete Files


    The rm (remove) command deletes the path specified in the first argument. Deleted
    files cannot be recovered in Linux, so exercise care when using this command.

    Example: Delete a file in the test/ directory.


    +   - Change the directory.


    ```

    [root@server /tmp|] cd test

    [root@server test|] ls

    mdt

    [root@server test]#

    ```


    +   - Enter the cd test or (using absolute path names) cd tmp/test command.


    +   - Enter the command.


    ```

    [root@server /tmp|] cd test

    [root@server test|] ls

    mdt

    [root@server test|] rm motd

    rm: remove motd? y

    [root@server test]#

    ```


    +   - Confirmation message is displayed. Type ''y'' and press Enter.


    The result of the command execution is not displayed on screen.


    ```

    [root@server /tmp|] cd test

    [root@server test|] ls

