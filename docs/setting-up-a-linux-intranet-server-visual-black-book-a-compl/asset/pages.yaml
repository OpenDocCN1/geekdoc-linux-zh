  md: '# Using Linux From A PC


    # Using Telnet


    Even when you are not working from a Linux PC directly, you can use the Linux
    working environment from a client PC through a network. Using telnet software,
    a client personal PC can execute operations directly on the Linux system. In this
    manner, Windows and


    Macintosh networks must be set up. First, prepare the Dynamic Host Configuration
    Protocol (DHCP) server in Linux to assign IP addresses automatically. Second,
    set up the Windows and Macintosh networks. Finally, install telnet software to
    connect to Linux directly.


    # Operating Linux From A Client PC


    When Linux is connected to a network, accessing it from Windows or Macintosh is
    the same as using it directly on the Linux PC. The software used to achieve this
    is telnet. Telnet software duplicates the Linux screen (terminal) inside a window.
    This is called a virtual terminal. Linux can support multiple virtual terminals,
    allowing many individuals to use Linux simultaneously via telnet.


