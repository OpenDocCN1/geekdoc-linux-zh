  md: '# Sharing Printers On A Macintosh That Doesn''t Have A Printer Port


    Macintosh systems such as the iMac, G3, and G4, which are equipped with an Ethernet
    port but not a printer port (serial port), cannot use printers equipped solely
    with a Macintosh printer port. If you want to use this type of printer, connect
    it to a Macintosh that has a printer port and share it using the network. You''ll
    need to contact your printer''s manufacturer to determine whether your printer
    will support adding a serial-to-USB converter.


    Without the converter, if another Macintosh is not available, you may not be able
    to use Linux to share the printer using a network. Even if the printer is connected
    to Linux and if it is not a PostScript printer, it cannot be shared. In this case,
    you must either provide a PostScript printer and connect it to Linux or purchase
    a printer (or if possible, a converter) that can be connected to an iMac.


    Although an iMac is not equipped with a printer port, it does have a USB port
    which allows you to use a low-cost inkjet printer to do high quality color color
    printing


    When using a network to connect Windows PCs and iMacs, sharing a high-performance
    PostScript printer through Linux is more convenient than connecting a printer
    to the iMacs.'
