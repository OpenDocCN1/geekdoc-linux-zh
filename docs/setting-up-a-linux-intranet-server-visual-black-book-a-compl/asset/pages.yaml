  md: '# Using Your Hard Drive Efficiently


    # Disk Capacity


    The capacity of your hard disk decreases as you use it. The df command to check
    hard disk capacity. If your remaining hard disk capacity is insufficient, consider
    the following actions (in the order listed):


    +   - Delete unnecessary files.

    - Move directories to different locations.

    - Expand your hard disk capacity.


    # Checking Disk Capacity


    Use the df command to check the remaining hard disk capacity of mounted systems.


    ```

    [root@server /root]# df

    Filesystem 1024-blocks Used Available Capacity Mounted on

    /dev/hdb2 66365 28664 34274 46% /

    /dev/hdb3 243607 246907 197559 11% /usr

    ```


    | Device name. | Disk capacity. | Capacity in use. | Available capacity. | Usage
    rate. | Mount point. |

    | --- | --- | --- | --- | --- | --- |


    Adjust hard disk capacity if the following condition occurs while using Linux:


    ```

    [root@server /root]# df

    Filesystem 1024-blocks Used Available Capacity Mounted on

    /dev/hdb2 66365 66365 0 100% /

    /dev/hdb3 243607 246907 197559 11% /usr

    ```


    Over-capacity.


    # Cleaning Up Unwanted Files


    Use the du command to check the disk usage by each directory.


    +   - Start directory (indicates a file system that is over-capacity).

    - Displays directories in numeric order (large directories are displayed last).


    ```

    [root@server /root]# du -xS | sort -n

    1 /

    13476 /home/Bob

    20789 /home/Mike

    [root@server /root|#

    ```'
