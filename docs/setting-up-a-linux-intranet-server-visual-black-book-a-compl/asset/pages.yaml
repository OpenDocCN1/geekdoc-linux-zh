    # Linux Users


    Although Linux allows many people to use it simultaneously through a network,
    it cannot be accessed by just anyone. Access is limited to previously registered
    individuals called users. When Linux is installed, the only user initially set
    up is the *root user*. The root user is the administrator of Linux and is referred
    to as a *super user* to distinguish them from normal users. Chapter 4 explains
    how to register users.'
