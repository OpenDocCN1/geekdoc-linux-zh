  md: '# 6.2 To Handle A Linux File In Windows


    # How To Verify smb.conf Settings


    Samba features numerous settings categories, and each has a default setup. If
    the settings do not contain the expected parameters, Samba will not operate as
    expected. Samba is supplied with a tool that monitors all of the settings within
    the smb.conf file that are automatically set by the program. This tool is the
    testpar command. Running testpar displays all the settings.


    ```

    [root@server /root]# testpar

    Load smb config files from /etc/smb.conf

    Processing section "home"

    Processing section "printers"

    No path in service printers - using /tmp

    Unable to open printcap file /etc/printcap for read!

    Loaded services files OK

    Press enter to see a dump of your service definitions

    ```


    Press Enter to display the values for all the settings. To display a manual describing
    the available settings options and explanations of their use in the smb.conf file,
    execute the smb.conf command.


    ```

    [root@server /root]# man smb.conf

    ```


    # Linux And Samba Usernames Are The Same


    Both Linux and Samba usernames are treated as the same for managing and organizing
    usernames. Files created by a user accessing through the Samba interface can be
    handled in the same manner as files created by a user with the same name accessing
    through Linux.


    # How To Add Users


    To add users, first create a username with the useradd command in Linux then use
    the smpasswd -a command to create a Samba password for the same username.


    ```

    [root@server /root]# useradd -g users -p username

    [root@server /root]# passwd username

    New UNIX password:

    Retype new UNIX password:

    passwd: all authentication tokens updates successfully.

    [root@server /root]# smpasswd -a username

    New SMB password:

    ```


    The user specified username is added to Samba


    Retype new SMB password:


