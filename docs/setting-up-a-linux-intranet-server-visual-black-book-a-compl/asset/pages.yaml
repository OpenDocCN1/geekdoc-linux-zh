  md: '# Why Compile?


    The Windows operating system (OS) can only be used on PC/AT-compatible computers,
    so programs to be used under Windows are distributed in executable format. Macintosh
    is similar with its operating system. In Unix, however, each version of the Unix
    OS has a different format for executable files, so distributing programs in executable
    format is not possible. Programs for a Unix OS are often distributed as source
    code or pre-compiled for different platforms. You compile the source code in your
    environment and create an executable yourself.


    Nearly all programs used in Linux are distributed as source code, in case you
    have a platform for which a binary is unavailable, if you are security conscious,
    or if you just want to play with the source code. In Red Hat Linux, however, rpm
    packages are distributed in a compiled and executable format. Why then are we
    compiling software in this book?


    # Providing A More Recent Version Than The rpm


    The packages are source code compiled and created by someone else. The packages
    may not always be distributed with updated original source code. Because this
    book discusses setting up an intranet, you need not be too concerned with security,
    although you should take adequate precautions when using Linux as an Internet
    server. Occasionally updating to newer and more stable source code and compiling
    it can be good practice for you.


    # rpm May Not Always Be Supplied


    The packages you may not always be included with the Red Hat Linux distribution.
    If this is the case, you can try to find a package at another location, but obtaining
    the source code and compiling it yourself is easier. One warning, however; compiling
    from source is tricky and is usually recommended only for the experienced.'
