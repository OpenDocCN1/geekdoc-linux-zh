  md: '# Basic File Operations


    Copy (cp), Move (mv), Delete Remove (rm), And Make Directory (mkdir) Commands


    Copy, move, and delete are basic tools used to work with files and directories.
    Copy (cp) creates a duplicate of a selected file or directory. Move (mv) transfers
    a selected file to a different location. When using the copy or move tools, the
    affected files can be saved by saving the same as a different file name. Delete
    (rm) eliminates a file from the Linux system altogether.


    Use this tool carefully because, once deleted, you cannot recover these files.
    The make directory (mkdir) command is used to create a new directory.


    +   - cp Files or directories

    - rm Delete files or directories

    - mv Move files

    - mkdir Make directory


    # Using The cp Command To Copy Files


    The cp command copies a file specified in the first argument to a path specified
    in the second argument (as in cp optional_pathname_from_this_filename optional_pathname_to_this_filename).
    If you change a file name when you copy:


