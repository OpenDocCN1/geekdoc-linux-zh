  md: '# User Roles


    Because Linux allows multiple individuals to access the system through a network,
    users are identified by their usernames. The following list shows the process
    employed to identify users:


    +   - Divide work areas into home directories. (A home directory is created in
    /home automatically when the user is registered.)

    - Identify file access privileges.

    - Identify user services. (Email addresses is one of these services.)


    # Verifying New Users


    Use the id command to verify whether a user was registered correctly. Specify
    the username you want to verify, and execute the id command. If the user is registered,
    their username and the groups to which they belong are displayed.


    ```

    [root@server #] id Bob\uid=500(Bob) gid=100(users)

    [root@server /root#]

    ```


    | Username. | Group name. |


    # Deleting Users


    Use the userdel command to delete registered users. Even if you delete a user,
    his or her home directory and any contents remain on the hard disk.


    ```

    [root@server /root#] userdel Bob

    [root@server /root#]

    ```


    # Principle Of Not Directly Logging In As Root


    After registering users, do not directly log in as root. If you log in as root,
    someone else will be able to carry out operations as root without your knowledge.
    For this reason, log in first as a user, and then change to root using the su
    command. The su command is not an abbreviation for super user, but means substitute
    user or switch user.


    The command changes users. If executed without arguments, this command changes
    the user to root.'
