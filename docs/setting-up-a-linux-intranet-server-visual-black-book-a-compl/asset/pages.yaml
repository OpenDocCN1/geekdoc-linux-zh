  md: '# STEP UP


    Linux is not limited to desktop PCs. It can also be installed on laptop computers
    for use as a server, because Linux requires neither much CPU performance nor much
    memory. In some cases, a laptop computer makes a convenient server because it
    does not need much space, is portable, and is immune to power interruptions (batteries
    provide a backup power source).


    # Laptops As Servers


    # Transportable To Individual Work Places


    A Linux server does not have to be used as a fixed server. For example, you can
    install Linux on a laptop and use it as a server for your own network. You can
    then carry that laptop with you and utilize your own operating environment when
    using the remote location computer. In other words, you can take your own operating
    environment with you.


    # Installing Linux On A Laptop Computer


    The key to installing Linux on a laptop computer is for the computer to have either
    an internal CD-ROM drive or a CD-ROM drive that can be connected to it easily.
    If a CD-ROM can be used, Linux can be installed in the same manner as for a desktop
    computer. If a CD-ROM drive cannot be connected, however, you must use a CDROM
    connected by a PCMCIA card or some other method of installation. In other words,
    be sure to first check whether a CD-ROM drive can be used before starting the
    installation.'
