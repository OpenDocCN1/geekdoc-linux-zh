  md: '# 3.1 Running Linux


    # Starting Linux Operations From Login


    A user must log in before they can begin to use Linux. The login procedure verifies
    whether the user is registered and identifies which users are using Linux. All
    users have a username and password, which are entered for verification during
    login. When this process is complete, the user can begin using Linux. When you
    finish your work in Linux, make sure that you log out by typing "exit" or "logout"
    at the command prompt. If you fail to do so, someone else can use your account
    without permission.


