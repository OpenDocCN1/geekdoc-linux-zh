  md: '# Understanding A Network


    # TCP/IP


    Usually, in a network of PC clients and a server, data is transmitted over the
    network in accordance with the TCP/IP protocol (the most common method). Numbers
    called IP addresses identify computers and peripheral devices


    connected to a TCP/IP network. In constructing a TCP/IP network, a range of IP
    addresses is set, specifying the maximum number of IP addresses to be used therein.


    # Connecting Personal Computers


    ![](img/d549b948a29b14d0d8313a8ed09b5698_29_0.png)


    Windows PC

