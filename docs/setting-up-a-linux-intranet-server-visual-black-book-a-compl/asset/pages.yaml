  md: '# # Preface


    Recently. Linux has been in the spotlight. The reasons for Linux''s popularity
    include dissatisfaction with personal computer environments such as Windows, a
    desire to explore the concept of open-source software, and the attraction of using
    a cost-free and easy-to-use operating system.


    It is possible, however, to lose your way when attempting to use Linux for the
    first time. This is one reason why this Unix-like OS has, like the rest of the
    Unix family, a reputation for being difficult to use. It is true that Linux can
    be more intimidating than the more familiar Windows or Macintosh OSs, but this
    is often due to a lack of familiarity with Linux. You don''t need to be intimidated
    by Linux if you have some knowledge and proper training. With Linux, a profound
    world—far different from that of Windows and Macintosh—will open up to you.


    When using Linux, it''s important to get know the OS. However, the best shortcut
    to mastering Linux is to use it with a specific goal in mind. Your overall objective
    will be to set up an easy-to-use intranet server that will serve both Windows
    and Macintosh workstations. Your goal, then, is twofold: to understand Linux and
    to set up a practical intranet server. This book gives you the best of both worlds:
    true hands-on training with Linux, all in an easy-to-use, visual format, that
    results in an inexpensive intranet server.


    When you finish this book, you''ll have a more concrete view of Linux. Because
    the first step in Linux is intranets, the focus of this book is restricted to
    this area. This book will use intranets to guide your first steps into the world
    of Linux.


    In conclusion, I would like to thank my friends, who advised me in their capacity
    as Unix users, and Mr. Kazuhiro Fukuura and staff members in the Impress editorial
    department.


    The Authors, February 1999'
  merge: -1
