  md: '# Web Server And Apache


    Currently, there are a variety of Web servers available, including Microsoft''s
    IIS, Netscape''s Enterprise Server, Rapidsite, NCSA httpd, and others. When Red
    Hat Linux is installed, however, the Apache Web server is automatically installed.


    The name Apache is derived from the Apache FAQ, “Why The Name Apache?” (basically,
    a cute name that stuck: Apache is "A PAChy ErServer". It was based on some existing
    code and a series of "patch files"). Apache is based on the National Center for
    Supercomputing Applications (NCSA) httpd 1.3 Web server, the most widely used
    server in 1995. Although Apache was created using code from a number of different
    programs, it is currently being developed independently. Apache software is freely
    distributed at no cost.


    It offers powerful functions and is a stable Web server. Apache is easy to operate,
    making it possible to build a Web server without the use of a high-performance
    computer. Expanded functions to cope with bugs are being developed one after another.


    The freely distributed high-performance Apache is the most widely used Web server
    in the world today. As of January 1999, Apache''s share of Web servers was 54.22%
    of all Web servers in use on the Internet. The results of this survey, “The Netcraft
    Web Server Survey,” conducted by Netcraft, can be viewed as a graph at www.netcraft.com/Survey.'
