  md: '# How To Use The Command Notation In This Book


    # Command Notation


    Command line operations are described here.


    | A history of your previous choices is indicated in gray. Use this history to
    confirm the operation prior to executing it. | Commands that you must enter are
    indicated by bold characters. If $ is displayed next to a command, press the Enter
    key after typing the command. |


    ```

    [root@server ~]$ cd /usr/local

    [root@server local]$ cd /$

    [root@server ~]$ ls

    ```


    Shows a description of the location from the command prompt. Use this to confirm
    the current directory and user.


    # About Red Hat Linux


    Red Hat Linux 6.0 from Red Hat Software is available in two ways: either on CD-ROM
    or download from the Internet. For all exercises in this book, we used the CD
    version of Red Hat Linux 6. If you purchase the CD-ROM, you will also receive
    additional open source and commercial software packages for Red Hat Linux. The
    Linux configuration files are also included on the disk. These files will be necessary
    as you read through the book. If you want to download the Red Hat Linux distribution
    from the Internet, you should go to the Red Hat Software home page at www.redhat.com.
    This web page also contains a large amount of documentation and many links to
    other Linux related web pages. Even if you don''t intend to download the distribution,
    it is recommended that you visit this page on a regular basis.


    An alternative download site is MetaLab (which used to be called Sunsite and is
    still frequently referred to by that name). The MetaLab home page is http://metalab.unc.edu.
    The Red Hat distribution is available from the MetaLab ftp server at ftp://metalab.unc.edu/pub/Linux/distributions/redhat/redhat-6.0.
    In this directory, you will find additional directories specific to the different
    platforms for which Red Hat Linux is available. Choose your platform (i386 for
    the most common Intel 386–486– and Pentium-based computers), and then the welcome
    message will be displayed, which tells you how to download the distribution. The
    MetaLab Web site is a huge repository of Linux software and is the home of the
    Linux Documentation Project. Start from the home page (http://metalab.unc.edu)
    and browse the site.'
  merge: -1
