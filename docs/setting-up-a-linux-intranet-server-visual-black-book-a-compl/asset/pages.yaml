  md: '# # Shutting Down Linux


    Shutdown


    Even if you log out, Linux continues its functions as a server. The **shutdown**
    command is used to quit all server operations and stop restart Linux.


    In most cases, Linux does not require the OS to be restarted after settings are
    changed; only user logout is required. Because of this, the **shutdown** command
    is used only when the power of the PC where Linux is installed must be turned
    off.


    +   1. Log in as root.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_83_0.png)


    Red Hat Linux release 6.0 (Hedwig)

    Kernel 2.2.x on an 1386


    ```

    server login: root

    Password:

    Last login: Fri Feb 12 15:32:51 on tty1

    [root@server /root]# shutdown -h now

    ```


    +   2. Execute the shutdown command.


    Red Hat Linux release 6.0 (Hedwig)

    Kernel 2.2.x on an 1386


    ```

    server login: root

    Password:

    Last login: Fri Feb 12 15:32:51 on tty1

    [root@server /root]# shutdown -h now

    ```


    ![](img/d549b948a29b14d0d8313a8ed09b5698_83_1.png)


    The system is halted

    System halted


    When this message is displayed, the power can be turned off.'
