  md: '# Directories That Should Not Be Moved


    Never move the directories /bin, /sbin, /root, /lib, /dev, /etc and /boot. These
    directories contain the minimum required files to boot the system before other
    file systems are mounted.


    # Expanding Hard Disk Capacity


    If your total remaining hard disk capacity is limited, you cannot resolve the
    problem by moving directories. You need to purchase a new hard disk. You''ll need
    to make many preparations before using the new hard disk.


    # Adding A SCSI Card


    If you purchase and install a new SCSI card, drivers must also be included. The
    drivers are installed when the installer detects the SCSI card and performs an
    update installation.


    # Adding A Hard Disk


    Not limited to SCSI cards and IDE drives, follow these procedures to add a hard
    disk:


    +   * Set the partitions of the expanded hard disk (fdisk).

    * Create a file system (mke2fs).

    * Mount the disk (mount).

    * Set up the system to mount the disk during the boot sequence (/etc/fstab) automatically.


    For details, see page 196.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# # Back Up Data


    # Back Up Methods


    If Linux stops operating and your environment settings are backed up, you can
    use the same settings files to recover the environment after you re-install Linux.


    The settings files should fit on one floppy disk. If you also back up shared data,
    consider using a different type of storage media.


    # Backing Up Settings Files And Shared Files


    After installing Linux, the following files are required to recover the environment
    that has been set up to this point. If you have back ups of these files, you can
    recover the current environment simply by copying the settings files.


    +   - /etc/passwd

    - /etc/group

    - /etc/printcap

    - /etc/sendmail.cf

    - /etc/hosts

    - /etc/inetd.conf

    - /etc/dhcpd.conf

    - /etc/smb.conf

    - /etc/smbpassword

    - /etc/httpd/conf/access.conf

    - /etc/httpd.conf

    - /etc/srm.conf

    - /usr/local/atak/etc/AppleVolumes.default

    - /usr/local/atak/etc/AppleVolumes.system

    - /usr/local/atak/etc/papd.conf

    - /usr/local/src/CF-3.7Wp12/sendmail.def


    +   - User information

    - Group information

    - Printer settings

    - sendmail settings

    - Chart of host names and correspond IP addresses

    - inetd settings (such as qpopper)

    - DHCP settings

    - Samba settings

    - Samba password settings

    - Apache settings

    - Apache settings

    - Apache settings

    - netatalk settings

    - netatalk settings

    - sendmail settings


    In addition, back up /home and other shared folders.'
  merge: -1
