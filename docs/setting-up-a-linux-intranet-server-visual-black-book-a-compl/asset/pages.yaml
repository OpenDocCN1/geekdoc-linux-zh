  md: '# Daemon: A Program That Provides A Service


    Special programs called daemon provide all server functions in Linux, including
    DHCP. The daemon programs are executed when Linux boots and maintains continuous
    operation. Along with DHCP, the programs appearing in this book (in other words.
    Samba, netatalk, sendmail, and Apache) are all daemons.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_106_0.png)


    A daemon is a program that provides server functions in Linux.


    This daemon is named dhcpd because it provides DHCP functions. The function it
    provides is called a service.


    This sequence of operations is a service.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_106_1.png)


    Nearly all of the programs providing server functions in Linux are provided in
    this service format. For anything you may want to do in Linux, a daemon can be
    added to provide that service. All service functions introduced in this book are
    descriptions of these services (daemons).'
