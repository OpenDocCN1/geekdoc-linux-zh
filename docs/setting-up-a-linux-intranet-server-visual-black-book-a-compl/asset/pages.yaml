  md: '# # Automatic Assignment Of IP Addresses


    # Setting Up A DHCP Server


    DHCP is a service that assigns an IP address automatically to a computer that
    is connected to the network. After specifying the DHCP settings for Windows and
    Macintosh, IP addresses are assigned automatically in accordance with the settings
    of the DHCP server running in Linux. When changing network settings, it isn''t
    necessary to change the settings of every PC.


    Only the DHCP server settings are changed, making it much easier to manage PC
    IP addresses. You can download this file, named dhcpconf, from ftp.coriolis.com/linux_server.vbb.
    Download dhcpconf.file to an Internet equipped PC, copy the file to a floppy mount
    the floppy in the Linux machine and copy it to the /etc directory.


    # Mount the CD-ROM.


    +   - Insert the CD-ROM.

    - Enter the command.


    ```

    [root@server /root]# mount -t iso96660 /dev/cdrom /mnt/cdrom

    mount: block device /dev/cdrom is write-protected, mounting read-only

    ISO96660 Extensions: Microsoft Joilet Level 3

    [root@server /root]#

    ```


    > Work as root for operations related to Linux settings.


    # Install the DHCP server.


    ```

    [root@server /root]# rpm -i /mnt/cdrom/RedHat/RPMS/dhcp-2.0b1p16-6.i386.rpm

    [root@server /root]#

    ```


    If an error message does not appear, the server was installed correctly.


    # TIP! What is rpm?


    An rpm is an archive format that groups programs, source files, and so on. The
    rpm format can store such operations as installation procedures, which can then
    be executed by issuing the rpm command, thus simplifying operations.


    # TIP! Simplifying The Input Of Filenames


    Specifying filenames by absolute paths and long filenames when entering commands
    is cumbersome. Pressing the Tab key to activate the input support function helps
    to shorten the process.'
