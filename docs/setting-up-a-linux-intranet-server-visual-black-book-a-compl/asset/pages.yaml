  md: 'Before deciding to download the distribution from the Internet, it is worth
    considering depending on the speed of your Internet connection, you may require
    12 or more hours of actual downloading time. If you are subject to long-distance,
    time, and/or download charges or limits, you may find it substantially cheaper
    to purchase the CD-ROM. Another point to consider is that if you make a mistake
    during the installation, you may have to start again... from scratch. Do this
    two or three times, and you''ll soon have purchased the CD-ROM.


    Some of the Linux distributions are discussed briefly in Chapter 1. The Red Hat
    Linux distribution has become popular because of its case of use and the availability
    of high-quality commercial support (included when you purchase the CD-ROM package).
    Because of this and its high availability, this is the distribution we have chosen
