- img_proc: true
  md: '# About This Book


    This book describes how to build a small-scale LAN (local area network) using
    Linux (Red Hat Linux 6.0) as a server. Linux requires many initial settings before
    you can use it as a server, and the sequence of the settings you choose is very
    important. Please check the sections on basic settings and, in particular, be
    sure to read the the following chapters:


    +   * Chapter 1 Linux Basics

    This chapter introduces the components you will need when you build a server.
    If you are new to networks, you should read this chapter thoroughly.


    +   * Chapter 2 Installing Linux

    This chapter describes how to install Linux. It deals with the basics, so look
    it over carefully.


    +   * Chapter 3 Mastering The Basic Operations Of Linux

    This chapter explains the basic operations of the Linux OS. Newcomers to Linux
    should first grasp the basic operations outlined in this chapter.


    +   * Chapter 4 Registering Linux Users

    This chapter describes the first step in using Linux: registering users.


    +   * Chapter 5 Using Linux From Windows And Macintosh

    This chapter gives details on connecting to a network. If you want to set up a
    network, read this chapter.


    The remaining chapters are broken down into specific topics, such as connecting
    Windows and Macintosh and Web and mail settings. To avoid making incorrect settings
    when you are setting up the Linux intranet server, read all the chapters, in order,
    from Chapter 1.'
  merge: -1
