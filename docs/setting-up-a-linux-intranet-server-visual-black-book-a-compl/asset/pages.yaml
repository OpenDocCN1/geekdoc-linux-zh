  md: '# STEP UP


    # Telnet And Virtual Terminals


    Linux is a multiuser operating system (OS) that allows multiple users to work
    simultaneously. Logging in from the PC where Linux is operating is not the only
    way to access Linux. You can also log in using a virtual terminal from another
    computer that has telnet. Using these virtual terminals, multiple users can log
    in to Linux simultaneously and work independently. A single user can log in and
    open any number of virtual terminals.


    # Simultaneously Editing Identical Files At Two Locations


    A user can work concurrently on multiple virtual terminals. For ordinary users,
    one username is used by only one person; therefore, no problems should arise.
    When working as root, however, problems may occur.


    Depending on the working environment, there may be more than one individual who
    root to work as the administrator. In this case, assume that user A and user B
    start the vi editor to edit the same file. User A saves the file first. As a result,
    the file edited by user B is not the original edited file. Depending on the changes
    made by user A, the original work done by user B could very likely be invalidated.


    Exercise caution when multiple users are working as root at the same time.'
  merge: -1
