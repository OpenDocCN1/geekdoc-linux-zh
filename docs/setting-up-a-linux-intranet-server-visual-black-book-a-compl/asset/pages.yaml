    \ the core of an OS. As introduced in this book, Linux is the name of a kernel.\
    \ Additionally, it is also used with systems that utilize a Linux kernel. When\
    \ installing Linux, you install what is known as distribution. Here, \"distribution\"\
    \ is a system comprising a set of kernel, basic commands, and applications. In\
    \ this book, a method is introduced to set up a server using a distribution called\
    \ Red Linux.\nSee also Linux.\n\n# M\n\n# Mail address\n\nA character that represents\
    \ the sender and recipient of a mail. If a mail address is broken down, the right\
    \ side of the system at symbol (@) represents the address of the system to which\
    \ the address belongs and the left side of the (@) represents the address within\
    \ the system (name of user that corresponds to the mail address).\nSee also address.\n\
    \n236"
