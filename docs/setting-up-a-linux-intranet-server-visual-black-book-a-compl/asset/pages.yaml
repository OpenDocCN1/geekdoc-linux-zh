  md: '# The Road To The Internet


    The server set up in this book is for use as an intranet or local area network
    (LAN). As such, it cannot be used as an Internet server. Do not connect the intranet
    as is to another network.


    This does not mean, of course, that the explanations provided in this book are
    useless when connecting to the Internet. You can read the basic sections of this
    book as is, while making the necessary changes to file settings based on an understanding
    of the Internet.


    # Physically Connecting To The Internet


    To use the Internet, you need a physical connection. If you only want access to
    the Internet, a telephone line and a modem will do. To use Linux as a server,
    however, you need a leased line.


    # Obtaining An IP Address


    The addresses used in this book are specifically for an intranet. You must have
    an IP address assigned to Linux to use it as an Internet server.


    # Obtaining A Domain Name


    The names used in this book were freely chosen. On the Internet, however, domain
    names are strictly controlled. If you use Linux as an Internet server, you must
    apply for and obtain your own domain name.


    # Necessary Considerations For Security


    There exists a real danger of attacks from external sources when connected to
    the Internet. If you experience such an attack, will you not only suffer damage,
    but other servers connected to the Internet will also experience problems.'
