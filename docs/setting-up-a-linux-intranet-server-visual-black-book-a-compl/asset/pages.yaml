  md: 'su (substitute user / switch user)


    su (substitute user / switch user)

    Command to change user IDs. The default reverts to

    root.

    Also user and root.


    Subdirectory

    See directory.


    Super user

    See root and uscr.


    Symbolic link

    A file that indicates a file located at another separate location. When a symbolic
    link is created, the file indicated by the symbolic link will be accessed. In
    Macintosh and Windows these same types of links are called an "alias" and a "shortcut",
    respectively.


    Swap

    A file or partition used by the operating system to give the impression of having
    more memory than is physically present. A hard drive partition is often used as
    swap space.

    Also partition.


    Switching hub

    See hub.


    # T


    TCP/IP (Transmission Control Protocol / Internet Protocol)

    A communication method widely used on the Internet.

    Also Internet and intranet.


    Text file

    The simplest document format in which only character information is written. Text
    files do not depend on specific applications and have many uses, such as settings
    files and program source. Text files in Linux are handled in the same manner as
    Windows and Macintosh, although the Return/Enter key codes are different.

    Also source.


    # U


    Uncompress (extract)

    See compress.


    Unix family OS


    Unix was initially developed in the Bell laboratories of AT&T in 1971. Since then,
    it has developed into various forms and presents many varieties of Unix-based
    systems are being developed. These systems are part of the Unix family OS. The
    Linux program was written from scratch, but was modeled after the Unix family
    OS.


    User\An individual registered to use Linux. A user is the basic unit in Linux
    when managing permissions.

    See root, permissions, and group.


    # V


    vi

    See file system.


    Name of a screen editor. Used to edit text files.

    See text file.


    # W


    Web

    Refers to the World Wide Web, also called WWW. It is called a Web because pages
    located in the Internet are joined by links like a spider web. The Web is the
    name used to refer to the Internet as a whole and remotely provide 70% of the
    data flowing through the Internet is said to be related to the Web.


    Name of a network OS produced by Microsoft.

    See Samba.


    Windows NT

    A unit that manages a computer in a network in Windows.

    See NT domain.


    WWW (World Wide Web)

    See Web.

    See IP address and network address.'
