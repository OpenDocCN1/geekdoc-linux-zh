  md: '# Access Privileges To netatalk Shared Folders


    Access privileges to folders and files in netatalk correspond to the file permissions
    in Linux. To restrict user access, set the permissions in the shared Linux directories.
    For example, to create a shared folder with read and write access for all users,
    set the permissions of the shared directory so that anyone is allowed to read
    or write.


    ```

    chmod 777 shared directory.

    ```


    In this case, guests are granted read and write access. Owners of files created
    by guests become “nobody” in Linux.


    To grant specific individuals read and write access, create a Linux group, and
    then allow access only to users belonging to that group.


    ```

    chgrp users shared directory.

    chmod 770 shared directory.

    ```


    Permissions of files and folders created in a shared folder are essentially the
    same as the shared directory. The owner is the user currently logged in.'
