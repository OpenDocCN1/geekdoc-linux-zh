  md: '# Sharing Printers


    printcap And papd.conf


    Printers are registered in Linux by recording the information about printers connected
    to Linux and TCP/IP printers in the printcap file. When printcap is configured,
    Samba uses this information to allow sharing printer from Windows. The type of
    printer used makes little difference when sharing. If a PostScript printer is
    being used, however, by configuring the papd.conf file and allowing the registered
    information in printcap to be reflected, a Macintosh system can share the printer
    as well. You can find and download printcap and papd.conf online at ftp.coriolis.com
    in the linux_server_vbb folder. Place these files in the /etc directory.


    # To Set Up Different Kinds Of Printers


    Windows Compatible Printers (Includes PostScript Printers)


    Read the following required configuration steps in the order in which they appear:


    +   (1) Copy printcap.

    2) Edit printcap configuring a printer connected to Linux.


    Windows Compatible TCP/IP Printer (Includes PostScript Printers)


    Read the following required configuration steps in the order in which they appear:


    +   (1) Copy printcap.

    (3) Edit printcap. TCP/IP printer configuration.


    PostScript Printers Shared By Both Windows And Macintosh Systems


    +   (1) Copy printcap.

    (2) Edit printcap. configure a printer connected to Linux.

    (4) Configure a shared Linux PostScript printer from a Macintosh.


    TCP/IP Compatible PostScript Printers Shared By Both Windows Macintosh Systems


    Read the following required configuration steps in the order in which they appear:


    +   (1) Copy printcap.

    (3) Edit printcap. (TCP/IP printer configuration).

    (4) Configure a shared Linux PostScript printer from a Macintosh.'
