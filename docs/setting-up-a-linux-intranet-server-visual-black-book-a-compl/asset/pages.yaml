  md: '# # Installing Linux Part 2


    # ## Usage Of fdisk


    The fdisk tool is used to divide the entire hard disk into separate partitions
    for different functions. For use as a server, Linux must be the default operation;
    therefore, in this installation step, all hard disk partitions are released and
    allocated to Linux. The hard disk is formatted for use with Linux, and all existing
    data is erased.


    The fdisk tool is complicated to use, but no alterations will be written to the
    hard disk until the w command is issued. Don''t be concerned with using the tool
    up to this point.


    # ## Changing The Hard Disk Partitions For Linux Usage


    The hard disk of a Windows PC is divided into one partition or several partitions,
    depending on the manufacturer. Because we are installing Linux as a server OS,
    you can delete all partitions used by Windows. If you want to save data or programs
    used by Windows, be sure to back them up on separate storage media.


    Hard Disk Used By Windows


    ![](img/d549b948a29b14d0d8313a8ed09b5698_47_0.png)


    Hard Disk Used By Linux


    Hard disk is partitioned for Linux into swap area, system area, and data and program
    area.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_47_1.png)


    > Note: This explanation is for the partitioning scheme used in this book.'
  merge: -1
