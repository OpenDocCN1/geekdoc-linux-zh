    # Commands That Do Not Display Their Result


    Command operations include the result of an input; a response resulting from the
    input command. Some commands do not display a response, even when the command
    is issued and the operation is executed. In Linux, if you make a mistake while
    entering a command or if the operation is not executed properly, you will always
    receive an error message. If nothing is displayed, the operation executed correctly.'
