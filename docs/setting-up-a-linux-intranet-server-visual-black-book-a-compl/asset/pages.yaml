  md: '# Trouble With Booting After Installation


    Linux uses LILO to boot up. If LILO is operating correctly, the character string
    "LILO:” is displayed before Linux boots. Enter "linux", then press Enter and Linux
    will start. Alternatively, Linux will start after five seconds if nothing is entered.
    Failure of Linux to start after installation is almost always tied to LILO.


    # The Installer Starts (LILO Does Not Display)


    This happens when LILO is being booted up from the floppy disk or CD-ROM. Remove
    the medium, then press Ctrl + Alt + Delete to restart Linux.


    # LILO Does Not Display And “No Boot Device” Displays (Message Differs From Computer
    To Computer)


    In almost all cases, this occurs because a boot flag was not attached when partitioning
    the hard disk. Start the installer, and attach a boot flag to the region assigned
    to / (in the example in this book, ./dev/hda2), using a command of fdisk in the
    steps outlined on page 45. Then press Ctrl + Alt + Delete to restart.


    # LILO Is Only Displayed Briefly During Boot Up And Then Numbers Are Shown Frozen


    In almost all cases, this occurs because LILO cannot correctly recognize the information
    on the boot disk. There is no definitive way to solve this problem, but there
    has been some success in checking the Use Linear Mode option during the installation
    of LILO as explained on page 51.


    # Linux Does Not Boot Up At All


    Linux might not boot up successfully if you create and use the boot disk that
    was not created in Step (21) on page 50. In this case, insert the created boot
    disk into the floppy disk drive and turn the power on. LILO: should display. Enter
    “Linux” and wait ten seconds and Linux will start to boot. Remove the floppy disk
    after the logon screen appears. If this method does not work, try installing Linux
    again from the beginning. If that does not work, determine whether your PC can
    use'
  merge: -1
