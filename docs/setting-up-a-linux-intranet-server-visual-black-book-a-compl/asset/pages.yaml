  md: '# 1.7 Checking PC Specs


    # # Familiarization Through Installation And Use


    Red Hat Linux can be installed on any PC/AT-compatible computer (although a Pentium-based
    machine is a reasonable starter). The quickest way to discover Linux is and what
    it can do to install and start using Linux.


    # ## Follow The Procedures In This Book To Become Familiar With Linux


    Installing Linux does not require much time, and procedures to set up the server
    as described in this book are quite simple. However, if you are unfamiliar with
    Linux, mistakes can occur as you perform your first installation-specifically,
    the use of a command line and the feeling for setting up a Linux server will be
    unfamiliar. Even so, you can complete the operations explained in this book in
    approximately a day. You should be able to set up the server and gain an better
    understanding of how to use Linux by thoroughly reading this book.


    # ## Repeated Use Helps To Master Linux


    Procedures that are difficult to understand the first time will become clearer
    as you repeat the installation process, giving you a greater sense of how to set
    up a customized server. Repeating the Linux installation process is great training
    if you really want to set up a server that meets your needs.


    # ## Merits Of Repeated Installations


    +   - You can become familiar with the operations of Linux.

    - You can learn how Linux works quickly.

    - Various problems become evident.


    # ## To Use Linux As The Core Server Of A Network


    Hard disk capacity of the computer you plan to use as the Linux server can be
    a problem. You can either acquire a computer with the requisite hard disk capacity
    or expand the hard disk capacity of an existing computer. For example, because
    the Linux system requires from 300MB to 400MB, and assuming that each user will
    require 100MB, for 10 users you will need at least a 2GB hard disk to allow for
    some reserve space.


    Because Linux does not require much CPU performance, however, you can install
    it on an older PCs if the hard disk capacity can be adequately expanded.


    It is recommended that you install Linux as described in this book to get a sense
    of how to set up a server, then perform an installation taking into consideration
    hard disk capacity.'
