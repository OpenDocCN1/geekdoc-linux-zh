  md: '# Setting Up The CD-ROM Drive


    The concept of drives as they are known in Windows and Macintosh does not exist
    in Linux. When using a CD-ROM in Linux, the CD-ROM must be grafted on to the directory
    structure before it can be accessed.


    This grafting process is called mounting. Mounting is executed with the mount
    command; unmounting is executed with the umount command, usually available only
    to the Super-user. Floppy disks must also be mounted.


    # Mounting And Using The CD-ROM And Other Drives


    In Linux, all disks form one part of the directory hierarchy with /. The Linux
    directory structure is a large tree with disks branched off as directories. When
    a disk and a drive are linked together in the mount operation, the disk can then
    be accessed as part of that directory:


    # Types Of Mounted Disks


    There are many types of disks. Specify the type of disk to mount using the -t
    option appended to the mount command. For example, specify iso9660 to mount CD-ROMs.
    For Windows formatted floppy disks use the mount -t ext2 /dev/fd0 /mnt command.


    | Using CD-ROMs With Linux |


    +   Insert the CD-ROM.


    +   Insert the Red Hat Linux CD-ROM into the CD-ROM drive.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_81_0.png)


    Check the directory where the CD-ROM drive is to be mounted.


    ```

    [root@server /root]# ls -lF /mnt/cdrom@

    total 0

    [root@server /root]#

    ```


    +   Enter the command.


    Note: Merely inserting the CD-ROM does not mount it.'
