  md: '# # Changing Current Directories


    change directory command (cd)


    Using the absolute path in Linux to execute an operation can be cumbersome, using
    the relative path from the current directory, however, is quite easy. The current
    directory can be changed readily using the cd (change directory) command. When
    changing to a new


    directory, either an absolute path or a relative path from the current directory
    can be specified. With efficient changes in the current directory, specifying
    an absolute path when entering commands is easier.


