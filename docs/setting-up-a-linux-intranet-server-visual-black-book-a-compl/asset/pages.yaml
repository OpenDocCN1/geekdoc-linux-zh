  md: '# # Installing Linux Part 3


    # ## Installing Red Hat Linux


    When partitioning is complete, the next step is to allocate the partitions to
    be used with Linux and the installation components.


    The network card is the only important peripheral for the use of Linux as a server.
    Mouse and video card settings are not critical, and you don''t need to be concerned
    about detailed setups.


