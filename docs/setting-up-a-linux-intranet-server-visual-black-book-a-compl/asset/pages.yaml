    [root@server test]#

    ```


    +   - Enter the ls (to be absolutely certain, the ls -a) command.


    The file motd is deleted. Nothing is displayed on screen.


    # Using The mv Command To Change File Names


    In Linux, the mv command can be used both to move files and to change file names.
    You can change a file name by moving the file to the same directory and assigning
    it a different name. When using the mv command to change a name, avoid the common
    mistake of specifying a directory that does not exist.


    # cp, mv, rm Command Options


    | cp (mv, rm) | -i | Receive confirmation, then copy (move, delete). |

    | cp (mv, rm) | -f | Force copy without confirmation (move, delete). |

    | cp (mv, rm) | -r | Copy all contents of directory (move, delete). |'
