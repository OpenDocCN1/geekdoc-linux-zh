- img_proc: true
  md: '# Add New Alias


    # Forcibly Terminating Running Commands


    If you execute the ls command in a directory containing a large number of files,
    or if you execute a command that seems to be taking a long time to complete, you
    can press Ctrl + C to forcibly terminate the running command.


    ```

    root@server:/root#$ ls -l /usr/doc/

    :

    ```


    The command is terminated, and the prompt is displayed.


    # Useful Operations In Linux


    When you log in to Linux from a Windows or Macintosh system, and if you log in
    from multiple workstations running windows, multiple operations can be executed
    simultaneously in Linux. Although it may appear that only one operation can be
    executed from the Linux screen, press Alt + the appropriate function key(s) to
    switch to a different window.


    When you are logged in from a Windows or Macintosh system, you can scroll to view
    previous screens by pressing Shift + Page Up to scroll up or Shift + Page Down
    to scroll down. You cannot use the Alt + function keys to switch and scroll through
    multiple windows.


    # When Commands Cannot Be Entered


    If the screen is scrolling too quickly to view the contents, press Ctrl + S to
    stop the display. Press Ctrl + Q to restart the display.


    If you make a mistake and press Ctrl + S, you must press Ctrl + Q to recover.
    Pressing other keys generates no response. The actions of keys pressed during
    the no-response pause are reflected on screen the instant you press Ctrl + Q.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# If The Linux Screen Goes Blank


    If the keyboard isn''t touched for a fixed period in Linux, the screen darkens
    and goes blank. This is Linux''s screen saver; it doesn''t mean that Linux has
    stopped operating. Press Shift or Ctrl to return to the original screen.


    # Displaying File Contents


    The less command is useful when you want to view a file''s contents. Execute the
    following command to display a file:


    ```

    [server /root]# less "file name"

    ```


    Using key operations, the less command can search, move up and down, and perform
    other functions. The key operations of the less command imitate the vi editor
    but are specifically intended for viewing files.


    # The Main Key Functions Of The less Command


    +   f Move forward one screen [spacebar]

    b Move backward one screen.

    m Move forward half a screen.

    u Move backward half a screen.

    j Move forward one line (↓)

    k Move backward one line (↑).

    / Search forward.

    ? Search backward.

    -i Search is/not case sensitive (toggle).

    n Search forward again.

    N Search backward again.

    F Read from the end of the file. (If added to a file, the file is quickly displayed.
    Press Ctrl+C to return.

    v Start the vi editor to edit a file.

    :n View the next file when specifying multiple files.

    :p View the previous file when specifying multiple files.

    :q Exit less.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Combining Commands


    When a command is executed, because of the large amount of data being displayed
    on screen, you probably will not see the result of the execution. To view the
    data, use the less command in addition to scrolling backward. The tool used to
    combine commands is called a pipe. A pipe interprets the command following it
    as input and displays the results on the current screen. For example, entering
    the commands as follows will allow you to view the results of ls using the less
    command.


    ```

    [root@server /root]# ls -aF | less

    ```


    Because the ls command itself determines whether something is displayed on the
    screen, entering the commands as follows will display one file per line.


    ```

    [root@server /root]# ls | less

    ```


    # Sending Displayed Command Results To A File


    Some programs are not files, so they cannot be handled with an editor like vi,
    as in the following example:


    ```

    [root@server /root]# ls -aF | vi

    ```


    ![](img/d549b948a29b14d0d8313a8ed09b5698_214_0.png)


    If you want to edit the results of ls by using vi, you must write to a file and
    then edit it.


    A pipe enters the display into other commands. Use redirection to write the display
    to a file. Redirection uses [], [>>], and [&], as shown in this section.


    Write the display to a file:


    ```

    [root@server /root]# ls -aF > ls1aF

    ```


    Add the display to the end of a file:


    ```

    [root@server /root]# ls -aF >> ls1aF

    ```


    Read from file and use as input:


    ```

    [root@server /root]# ls < ls1aF

    ```'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# STEP UP


    # In Case Of Emergency


    Generally, special attention isnt needed, but you should be aware of the following
    things when managing your system.


    # If You Forget The Root Password


    When an ordinary user forgets their password, the administrator can become root
    and change the password. If you, as administrator, forget the root password, however,
    it cannot be changed. In this case, restart and boot Linux in a different mode.
    If you cannot enter the shutdown command, press the Ctrl + Alt + Delete on the
    keyboard of the PC where Linux is installed to forcibly restart Linux.


    When the PC restarts and the LILO: prompt appears on the screen, type [single]
    and press Enter. The command prompt will appear. From here, change the root password
    using the password command. In this state, Linux operates differently than in
    normal mode. Restart Linux to return to the normal mode.


    # Endlessly Increasing Logs


    In Red Hat Linux, each type of log is sorted periodically. Processing is set to
    occur at approximately 4:00A.M. each day; consequently, if you turn off the power
    at night, the logs will gradually accumulate and increase in size.


    The periodic processing time is set in /etc/crontab. To change the time for the
    log adjustments, change the line numbers located in cron.daily.


    For example: to change from 4:02A.M. to 12:50PM. (afternoon), take these steps:


    +   - 2 . . root run-parts /etc/cron.daily

    - 50 . . root run-parts /etc/cron.daily'
