  md: '# Using A CD-R (mkisofs)


    Use the mkisofs* command to create an image file for a CD-R. This command creates
    a file system in accordance with names. Because it creates a file system used
    by the CD-ROM, if you specify this for the image file and *burn* (record data
    on) the CD-R, you will be able to view the CD-R from Windows and Macintosh (and
    Linux) like you would from a standard CD-ROM.


    ```

    [root@server /tmp#] rpm -i /cdrom/RedHat/RPMS/mkisofs-1.12b5-2.i386.rpm[root@server
    /tmp#] mkisofs -addNRIV "home" -o backup.img /home

    ```


    # Options


    +   - Include all files.

    - Do not append ": to the end of file names that do not have a "

    - Do not use deep directory relocation.

    - Do not append version numbers to file names.

    - Create SUSP and PR records.

    - Create TRANS.TBL.

    - Set volume ID.

    - Specify the file name of the image file.


    Because the CD-R image file can be mounted before burning the CD-R, you can verify
    the contents before actually burning the CD-R.


    ```

    [root@server /tmp#] mount -t iso9660 -o loop backup.img /mnt/tmp

    ```


    ![](img/d549b948a29b14d0d8313a8ed09b5698_202_0.png)


    A CD-R can be connected to Linux and then burned, but because many types of corresponding
    devices exist, it''s better to create the image file in Linux and then use writing
    software in a Windows or Macintosh system.'
  merge: -1
  pgno: 202
