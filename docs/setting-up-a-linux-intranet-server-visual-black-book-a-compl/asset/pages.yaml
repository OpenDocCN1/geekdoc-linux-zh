  md: '# Customizing Your Web Server


    Changing Settings files


    The Apache settings files are located in the directory /etc/httpd/conf. They are
    divided into three files: access.conf, httpd.conf, and srm.conf. Apache settings
    can be changed by editing these files.


    This section examines the basic settings of Apache, how they can be changed, and
    how to verify this operation. Apache must be restarted each time the settings
    are changed.


    # Changing Document Roots


    +   1 Create the directory.


    Enter the command.


    ```

    [root@server /root]# mkdir /usr/local/www

    [root@server /root]# -

    ```


    +   2 Edit srm.conf.


    Enter the command.


    ```

    [root@server /root]# mkdir /usr/local/www

    [root@server /root]# vi /etc/httpd/conf/srm.conf

    ```


    # DocumentRoot: The directory out of which you will serve your

    # documents. By default, all requests are taken from this directory, but

    # symbolic links and aliases may be used to point to other locations.


