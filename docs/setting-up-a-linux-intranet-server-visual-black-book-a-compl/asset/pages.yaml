    \ncd\nChanges the current directory.\n* Syntax\n  cd [directory name]\n* Commonly\
    \ used option\n  - (hyphen) Change to previous directory.\n* Related commands:\
    \ ls, pwd\n\ncp\nCopies files.\n* Commonly used options\n  -i Maintains original\
