  md: '# Notes On Using An Ethernet


    # Increasing Hubs To Increasing Clients


    More hubs will have to be installed if your number of potential client machines
    exceeds the number of available hub ports. This does not mean, that you must discard
    your existing hubs and purchase new hubs with more ports. Hubs can be interconnected
    to increase the number of ports using a procedure known as *cascading*, in which
    one hub is connected to the special cascading port of another. A *stackable hub*,
    in which the number of ports can be increased without cascading by using a special
    port called a *stack port*, is also available.


    # Cascading Hub Restrictions


    If you''ve decided to use cascading hubs, be aware of the restrictions on the
    number of interconnected hubs. For example, in the following diagram there is
    one hub between computer A and computer B, but there are two hubs between computer
    A and computer C, which is connected to a cascaded hub. An Ethernet is restricted
    to four interconnected hubs. A 100Base-TX, even more restrictive, allows only
    two interconnected hubs.


    ![](img/d549b948a29b14d0d8313a8ed09b5698_34_0.png)


    > A and C are linked by two interconnected hubs.


    # Effective Use Of Switching Hubs


    In addition to its data traffic control function, a switching hub can be inserted
    into a cascaded hub configuration to interrupt the counting of contiguous hubs;
    that is, counting the number of interconnected hubs starts from one PC to the
    switching hub only, then counting restarts at one from the switching hub to the
    other computer. Insert a switching hub if you want to exceed the specification
    in configuring cascading hubs. Because access will be concentrated on the Linux
    server, in using both switching hubs and other hubs, be sure to connect Linux
    to the port of a switching hub.'
  merge: -1
