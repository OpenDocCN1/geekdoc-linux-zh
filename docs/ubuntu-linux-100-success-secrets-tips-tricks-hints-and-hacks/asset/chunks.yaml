  trans: '


    Dapper Drake 是 Canonical Limited 公司发布的第 4 个 Ubuntu 版本。这也是所有 Ubuntu 版本中第一个 LTS（长期支持）发行版本。作为
    LTS 计划的一部分，对 Dapper Drake 的支持预计将于 2009 年 6 月左右结束（针对桌面版），而服务器版将获得更长两年的支持，其支持将于
    2011 年 6 月结束。


    Dapper Drake 的亮点之一是将现场运行光盘（Live CD）和安装 CD 合并到单张紧凑的光盘中。


    # 通过 UbuntuForums 获取一些新闻和更新


    你是否曾好奇，信息技术领域的专家和 Ubuntu 大师们是如何获得他们所拥有的知识的？除了书籍和研讨会，你认为他们是从哪里获取他们所知道的所有信息的？


    嗯，你可能会惊讶地发现，这些 Ubuntu 专家之间有一个共同点——那就是他们在互联网上活跃且热烈地使用论坛网站。是的，论坛网站对于这些专家的智力发展具有至关重要的工具作用。


    论坛网站是专门设计的网站，试图探索所提出的每一个讨论点的细节。通常聚集在论坛网站的所有人都都有一个共同的兴趣。这种兴趣以非常详细的方式被探索，以至于即使是讨论主题中最微小的细节也会被剖和研究。论坛中的这种讨论方式让每个参与者都能充分掌握并理解正在辩论和讨论的话题细节。


    大多数论坛网站的讨论通常包含了影响 Ubuntu 软件的最新动态事件。通常，这些论坛网站让每个参与者能够充分意识到不仅围绕 Ubuntu 软件，而且对 Ubuntu
    产生间接影响的整个 IT 行业的进展。


    许多 Ubuntu 用户非常依赖论坛网站，因为他们知道这些论坛网站是以非常实用的方式学习新事物的正确途径。


    # 关于如何升级你的 Ubuntu 软件的热门提示


    Ubuntu 制作者（Canonical Limited 公司）发布的最新版本于 2008 年 10 月 30 日发布。最新版本代码 `Ubuntu 8.10`
    让许多 Ubuntu 用户考虑将他们当前的 Ubuntu 软件升级到最新版本。然而，在执行升级到最新版本之前，请仔细阅读以下提示和提醒：


    a. 这里的做法是，如果你有 `Ubuntu 8.04 LTS` 版本，系统不会提示也不会自动提供升级到 `Ubuntu 8.10` 的选项。背后的原因是
    `Ubuntu 8.10` 属于普通发行版，而 `8.04 LTS` 具有长期支持。


    b. 如果你想升级到 `8.10` 版本，那么你需要通过 Ubuntu 网站手动进行。从那里，你将遇到一个对话框，它为你提供将当前版本升级到最新版本的选项。


    c. 如果你有 `8.04 LTS` 版本，请确保在升级到最新版本之前已应用所有更新。这将允许在升级过程中对任何类似的更新（`8.04` 和 `8.10`
    之间的更新）进行调和。


    d. 既然 `Ubuntu 8.10` 是一个新发布的版本，预计在使用操作系统期间可能会出现一些问题。建议在进行升级过程之前，认真阅读与 `Ubuntu 8.10`
    更新一同发布的发布说明。


    这些关于升级 Ubuntu 软件的提示和提醒将很好地引导任何 Ubuntu 用户采取正确的方向并做出正确的决策，甚至是在你实际上失败并后悔整个升级主意之前。


    # 对 Ubuntu 组织结构的全面探索


    Ubuntu 系统是许多软件开发者使用的许多动态结构和架构的巨大组合。Ubuntu 系统使用的每个平台都构成了系统整体结构的一部分。


    许多软件专家和新手对 Ubuntu 组织的构建方式产生了极大的兴趣。对 Ubuntu 的框架和结构进行了各种探索，这些探索显著地产生了以下结果：


    a. Ubuntu 系统的主引擎由动态库链接组成，这在已开发的许多其他操作系统中也能找到。与许多其他操作系统不同，Ubuntu 系统的主引擎可以被任何爱好者修改。


    b. Ubuntu 结构的所有部分都是开源代码的一部分，并对任何可能的修改和更改开放。虽然可以复制这些部分，但由于代码的许多限制，这种操作方法几乎是不可能的。正是
    Ubuntu 的这种组织方式使其与其他操作系统相比非常独特。


    c. 在任何引擎部分都允许使用现代代码脚本。Ubuntu 的结构化和组织方式让任何用户都能轻松地进入修改和增强代码的领域。


    系统的组织在软件开发中起着重要作用。系统组织决定了任何开发者对对其执行修改和更改的难易程度。


    # Ubuntu 服务器版的 4 大核心优势


    Ubuntu for Server 是 Canonical Limited 在过去几年中开发和增强 Ubuntu 系统期间所产出的伟大里程碑之一。Ubuntu
    for Server 的构建方式使其框架更加简单且不那么复杂。Ubuntu 制作者的这种尝试在降低系统维护成本方面非常成功。


    除了减少通过 Ubuntu for Servers 维护软件的费用外，以下优势也显现出来：


    a. 有了改进且简便的方法来安装和设置系统。启动文件和安装文件都被放在同一个目录位置，使得执行安装过程更加容易。


    b. 设计用于执行功能的特征得到了显著显现。通过 Ubuntu Server 版，你基本上看到的正是你所得到的。你看到的所有业务功能都可以按照设计运行和使用。


    c. 在需要时，有一种简便的方法进行升级。软件中最困难（如果说不是最困难）的事情就是升级方法。通过 Ubuntu for Servers，升级方法变得简单且容易得多。


    d. 获取任何可能更新的简单性。在新的 Ubuntu for Servers 中，更新会在你连接互联网时到来。与其他系统不同，你需要定期连接以获取任何更新。


    随着 Ubuntu for Servers 在社区的持续开发和增强，这些优势将不断增长和进步。


    # 以简单直接的方法安装 Ubuntu


    对于许多 Ubuntu 系统的初次用户来说，他们通常认为安装 Ubuntu 系统是非常痛苦且费力的。然而，与这种观点相反的是，安装过程非常简单、毫不费力且不复杂。


    安装 Ubuntu 的指南详细说明如下：


    a. 在最终安装 Ubuntu 软件之前，请确保在互联网上查看任何关于如何轻松有效地安装软件的实用提示。这些提示非常实用且有用。


    b. 请记住，每个 Ubuntu 版本的安装过程可能不同。这意味着取决于你拥有的 Ubuntu 版本，你有效安装软件的路径可能会变化。


    c. 永远不要忘记在你的 PC 上下载并安装特定的文件之前，


    '
