  trans: '


    Ubuntu 新手如果遇到问题，可以简单地访问 `help.ubuntu.com`，这是关于 Ubuntu 的官方文档。该网站还包含了许多用户可能感兴趣的常见问题。


    另一个非常有用的页面是 Ubuntu 社区文档维基。该网站有一个搜索框，可以在其中搜索关于 Ubuntu 的任何信息。另一个实用的 Ubuntu 帮助是 Ubuntu
    Web 论坛。在这里，人们提出一个问题，许多成员会尝试解决它。获取 Ubuntu 帮助的另一种方法是通过官方的 Ubuntu 用户邮件邮件列表。这是一份定期的电子邮件通讯，用于解答
    Ubuntu 用户的各种关注。IRC 聊天也是获取 Ubuntu 帮助的一种有效方式。然而，`#Ubuntu` 在白天可能会变得非常忙碌。但只要一点耐心，一定能在
    IRC 聊天中收获甜蜜的果实。


    除了官方 Ubuntu 帮助支持外，用户还可以从其他网站获得帮助。Ubuntu Guide 就是其中之一，它为 Ubuntu 初学者提供了指南。该网站在每次
    Ubuntu 更新时也会随之更新。


    用户还可以使用 Ubuntu 文档存储设施。这是几乎所有在论坛、博客和其他公共来源中产生的关于 Ubuntu 信息的中央存储库。其他有用的网站包括 Ubuntu
    Blogs、Ubuntu Tutorials、Ubuntu Geek、Simple Ubuntu Tutorial、Ubuntu Tips、Ubuntu Video
    Clips 以及 Ubuntu Tips and Helps。


    ### 1. Ubuntu 移动互联网设备版：无妥协的全方位上网


    Ubuntu 不仅作为桌面操作系统可用。较小的设备，如 PDA 手机，尤其是移动互联网设备，现在可以通过 Ubuntu Mobile（正式名称为 Ubuntu
    Mobile Internet Device Edition）享受 Ubuntu 的精美界面。


    为了让所有这些精彩功能成为可能，Ubuntu Mobile 使用了 `WiFi 2.0`，并提供了自定义 `AdobeFlash`、`Java` 和其他程序的选项。Ubuntu
    还具有高性能的媒体播放器，使用户可以用卓越的质量和便捷的导航查看照片、听音乐和看电影。Ubuntu Mobile 了一组对每个人的移动网络需求非常有用的应用程序。


    使用 Ubuntu Mobile 可以完成的操作包括 Web 浏览、图像捕捉、电子邮件、即时消息、媒体、越网络协议、博客、数字电视、GPS、日历、联系人、游戏、软件更新等。


    此外，Ubuntu Mobile 对触摸屏非常友好。用户不需要任何手写笔即可操作 Ubuntu。


    Ubuntu Mobile 在移动互联网设备的通用属性和功能方面也非常灵活。这些设备尺寸可以更小，拥有 4 到 7 英寸的触摸屏、虚拟键盘、`Bluetooth`、`WiFi`、`3G`、`WiMAX`、`GPS`、`OpenGL
    3D`、耳机接口、麦克风、扬声器、`USB`、摄像头和闪存存储。Ubuntu Mobile 支持这些以及更多常见的移动互联网设备功能。


    此外，用户可以通过 Ubuntu 的定制能力满足个人需求。由于其用户友好界面，在移动设备上使用 Ubuntu 非常容易。


    ### 2. 一些最佳 Ubuntu 程序


    阻碍大多数人使用像 Ubuntu 这样的免费操作系统的，是它可以使用的程序限制。但大多数人并不知道，还有很多应用程序可以在 Ubuntu 上使用。好消息是，其中大部分（如果不是全部）都是免费的。


    `Firefox` 是这些 Ubuntu 程序中应用最广泛的之一。它是操作系统的默认浏览器，也可以用于其他操作系统。`Automatix` 是 Ubuntu
    用户的另一个必备工具。它将帮助他们准备系统，以安装如 `Picasa` 和 `Google Earth` 等不同的实用程序。如果有人在寻找文件索引器或搜索器，他们仍然可以通过名为
    `Beagle` 的应用程序享受 Ubuntu。它让用户能够快速搜索文件。


    只要安装了 `VLC`，在 Ubuntu 上播放不同格式的多媒体也不是什么问题。通过 `Gnome Deskbar Applet` 也可以在不同的应用程序之间切换。另一个有用且灵活的
    Ubuntu 多媒体播放器是 `amaroK`。它不仅与 `Wikipedia` 和 `MusicBrainz` 集成，`Amarok` 还可以与 `iPods`
    同步。


    尽管 Google 没有支持 Linux，但通过 Ubuntu 的 `CheckGmail` 仍然可以使用 `Gmail`。此外，配合 Ubuntu 使用另一个操作系统并管理其中的所有数据，通过
    Ubuntu 对 `Add NTFS Read/Write` 的支持可以变得简单。


    `Adobe Photos` 可能非常贵，但 Ubuntu 用户仍然可以通过 `GNU Image Manipulation Program`（即 `GIMP`）享受类似于拥有强大的
    `Photoshop` 的图像编辑。与 `GIMP` 类似的应用程序是 `Unidentified Flying Raw`。这是一个用于直接从数码相机读取和处理图像的工具。


    ### 3. Ubuntu 终极版自带优秀预装程序


    获取所需内容或许是 Ubuntu 设计背后的理念。通过另一个版本 `Ubuntu Ultimate`，用户绝对可以体验使用这个免费 Linux 操作系统的全新喜。。


    `Ubuntu Ultimate Edition` 实际上基于广泛使用的 Ubuntu 圣诞版。它由 `TheeMahn` 在 2006 年发布，作为给 Ubuntu
    用户的一份精美圣诞礼物。从那时起，同一作者每年都会发布一个新的 Ubuntu “圣诞版”，现在被称为 `Ultimate Edition`。


    与普通 Ubuntu 相比，`Ubuntu Ultimate Edition` 拥有更多适用于许多人的应用程序。它有更新的主题、更好的壁纸和更漂亮的启动界面。它还针对
    `VCD Gear`、无线网络连接、`Bluetooth` 连接和 `PPP` 集成采用了 `Debian` 风格。这个特殊的 Ubuntu 版本还包含了网络工具。它有更多的字体、更多的主题、更多的声音主题以及全面的支持。


    `iPod` 用户也会更喜欢 `Ubuntu Ultimate Edition`，因为它对 `iPod` 的支持。该版本包含的一些应用程序有 `Beagle`、`Gramps`、`Legends`、`Kapote`、`Men
    coder`、`VLC`、`Amarok`、`Songbird`、`DeVeDE`、`Xsnow`、`Samba`、`GDesk`、`Inkscape`、`Gambas`
    和 `Screem`。


    除了 `Firefox` 作为其浏览器外，`Ubuntu Ultimate Edition` 还提供了 Web 服务器 `Lamp`。它的 HTML 编辑器
    `Bluefish` 也非常实用。


    多媒体爱好者可以通过 Ubuntu Ultimate 享受 `Audicity`、`Kino`、`Dvdrip`、`Listen Media Manager`、`Aria`、`Graveman`
    以及其他多媒体工具。


