  trans: '

    Ubuntu 目前的发布理念是每六个月发布一次新版本的虚拟设备。当然，考虑到程序本身的性质及其功能，这是一件很难做的事情。


    此外还有测试和交付阶段，但 Ubuntu 的良好之处在于，当他们承诺某件事时，他们通常能够完成。这在公众面前留下了良好的印象，并在声誉方面提升了 Ubuntu
    的地位，这在销售业务中是必须的。


    那么，Ubuntu 是如何做到每 6 个月发布一个版本的呢？这是一个很多人问的问题，即在面对种种挑战的情况下，他们仍然完成了任务。


    诀窍在于用户向 Ubuntu 团队提供了大量反馈，这些反馈是非常受重视的。事实上，Ubuntu 版本的发布很大程度上是基于反馈建议的。


    除了每 6 个月发布一次 Ubuntu 之外，Ubuntu 还承诺每 12 到 24 个月发布一次企业版（Enterprise Release）。这种企业版发布使
    Ubuntu 显得与众，因为总会有内容可以升级。


    当然，Ubuntu 用户不需要在每个新版本发布时都升级 Ubuntu。


    如果他们愿意，可以继续使用旧版本的 Ubuntu，并仍能定期收到安全更新和应用程序，这可以持续 18 个月。这使其成为一个高度可靠的虚拟设备，基本上可以在开发人员提供最少支持的情况下独立运行。


