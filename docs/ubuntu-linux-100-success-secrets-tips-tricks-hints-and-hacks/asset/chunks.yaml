    If the user does not want any of the freely available games, he can instead create
    one game. There are many free and open source 2D or 3D game makers for Ubuntu.
    The list includes `Allegro`, `BYOND`, `Game Editor`, `ClanLib`, `Alpha Z313`,
    `Crystal Space 3D`, `pygame`, `Mokoi`, `phpMMORPG`, and `Blender`.


    Meanwhile, there are also some games for Ubuntu that are commercially available.
    Some of these are the `Enemy Territory: Quake Wars`, `Unreal Tournament`, `Doom
    3`, `Penumbra: Overture`, `Uplink`, `Penumbra: BlackPlague`, `Darwinia`, `Defcon`,
    `Fashion Cents Deluxe`, and `Dirk Dashing: Secret Agent`.


    # Ubuntu 8.04 LTS is Ubuntu Heron


    Ubuntu''s different functionalities and edges against other operating systems
    made it as one of the most trusted in the field of open-source platform. One of
    its greatest releases is the `Ubuntu 8.04 LTS` or the `Hardy Heron`.


    `Hardy Heron` was the code used while the `Ubuntu 8.04 LTS` was under construction.
    The developers disclose the real name behind `Hardy Heron` when it was released
    on April 24, 2008. It was `JonoBacon` who announced the availability of this Ubuntu
    version. `Ubuntu Heron` or `Ubuntu 8.04 LTS` comes with free updates for three
    years. In fact, the `LTS` in this operating system''s name means `Long-Term Support`.


    Included to the different releases of the `Ubuntu Heron` are the `HardyHeron/Aphal`,
    `HardyHeronjAlpha2`, `Hardy Heron/Alpha3`, `HardyHeron/Alpha4`, `Hardy Heron/Alphas`,
    `HardyHeron/Alpha6`, `HardyHeron/Beta`, and `HardyHeron/RC`.


    With `Ubuntu Heron`, the user is allowed to use different web-based mail applications
    like `Gmail` and `Yahoo`. This platform also comes with `Pidgin`, a Free/Libre
    Open-Source Software. This application allows the user to connect all his contacts
    from the different instant messaging programs like `Yahoo Messenger`, `GTalk`,
    `WLM`, `IM`, `MySpace`, `AIM`, `Jabber`, and `ICQ`.


    Moreover, the `Ubuntu Heron` comes with its own web browser, the `Mozilla Firefox
    3`, while its office suite comes from the `OpenOffice.org`. This suite is using
    the `Open Document Format`, which is an ISO standard. This means that the user
    can create files in the `Ubuntu Heron` and open these office files using any office
    applications.


    Meanwhile, users can customize `Ubuntu Heron` especially those who have already
    experienced using `Microsoft Vista`. Many critics also said that `Ubuntu` is similar
    to `Microsoft Vista`s interface. The only difference is that `Ubuntu Heron` can
    be easily acquired for free.


    # Getting Free Applications for Ubuntu OS


    Most computer users usually have two options when it comes to operating systems.
    He can be a `Microsoft` or a `Mac OS` user. But with the release of open-source
    and free operating systems, these commercial operating systems have now their
    tough competition. One of the most useful, open-source, and free operating systems
    today is the `Ubuntu OS`. Anyone can have this for free and update the operating
    system for free-forever.


    One can get his free `Ubuntu OS` by downloading from many available sites like
    the `Linux''s`. The user can also request for an installation CD that he can receive
    through mail. What''s best about `Ubuntu OS` is that it does not immediately install
    applications in the computer. It allows the user to choose among the many free
    applications for download and installation.


    Meanwhile, there are still some programs that are immediately installed along
    with the `Ubuntu OS`. These are the `Firefox`, its default web browser; `Pigeon`,
    its instant messaging application; and `OpenOffice`, its office suite that includes
    a spreadsheet, word processor, slides how, and others.


    `GIMP`, `Evolution`, `Rhythm Box`, `Movie Player`, and `Blue Tooth` are other
    programs that users can get free along with `Ubuntu OS`. `GIMP` is an image-editing
    application comparable to `Adobe Photoshop`. `Evolution` is an appointment scheduler,
    mail client, calendar, and a CD/DVD burner similar to `Nero`. `Blue Tooth` is
    an application support for different wireless devices. `Movie Player` is a multimedia
    player and `Rhythm Box` is a music player.


    Aside from the immediately installed free applications, the user can also choose
    additional programs like `Audacity`, a free music editor; `VLC`, a media, CD/DVD
    player; and `Blender`, animation and graphic modeling program.


    # Knowing and Adding Ubuntu Repositories


    One of the best things about `Ubuntu` is that it does not install programs immediately.
    Users have the option to add programs later or just install the support programs
    that he needs. In fact, there are thousands of applications that can be installed
    on the Ubuntu computer. These applications are stored in archive, called `repositories`,
    so they can be available whenever needed.


    Moreover, all the applications stored in `Ubuntu repositories` were thoroughly
    tested and made for Ubuntu operating system. Users who are interested to install
    applications from these repositories can choose among the four Ubuntu repository
    components: `Main`, `Restricted`, `Universe`, and `Multiverse`.


    The `Main Repository` contains all the officially supported applications for `Ubuntu`.
    Meanwhile, the `Restricted Repository` has all the `Ubuntu`-supported programs
    that are not available under a totally free license. `Universe Repository`, on
    the other hand, is storing community-maintained applications that are not officially-supported
    by `Ubuntu`. Lastly, the `Multiverse Repository` stores applications for `Ubuntu`
    that are not free.


    `Ubuntu Repositories` can be found in the installation CDs for `Ubuntu` or they
    can be downloaded from different supporting websites.


    Meanwhile, applications from `Ubuntu Repositories` can be easily installed with
    the friendly interface of `Ubuntu`. Special applications, though, need special
    commands and instructions on how they can be installed. Anyway, there are many
    online instructions readily available for access.


    To enable added applications from `Ubuntu Repositories`, the user should know
    more about the software tabs, third-party tabs, and update tabs of `Ubuntu`. Applications
    from repositories can be more useful and be installed more effectively if other
    supports for Ubuntu repositories are installed. Some of these are Canonical Partner
    repositories and editing repositories.


    # Making Asus EEE PC Ubuntu


    `Asus EEE PC` could be "easy to learn, easy to work, and easy to play." But with
    `Ubuntu` as its operating system, it can be easier to learn, work, and play with.


    `Asus EEE PC` is a netbook computer noted for its lightness, high performance,
    low cost, and Linux-based. Since it is Linux-based, users can always have the
    option to have `Ubuntu` as its operating system.


    Making a bootable `USB Pendrive` for `Ubuntu` is helpful before taking any installation
    actions. Having this will help insisting on the Ubuntu installation process. The
    user is also allowed to create changes, save changes, and have a backup of his
    needed files in the `USB Pendrive`.


    An Ethernet connection while installing `Ubuntu` on `Asus EEE PC` is also needed
    for proper and smooth flow of the installation process. The Ethernet as well as
    WiFi connection should be established so that the computer will have an active
    Internet connection.


    Next, the user has to boot into the `Ubuntu Live Persistent mode`. This can be
    done through hitting the `Escape` button during the start up of the computer.
    Doing this will display a dialogue box asking the user which drive he wants to
    boot his computer from. The user will then choose the `USB Pendrive` and strike
    the `Enter` key. Then, the user''s machine will boot up to `Ubuntu Live`. The
    user needs to choose the `Persistent mode` and hit the `Return` key. And then,
    the `Ubuntu` will begin to unpack.


    For easier installation of `Ubuntu` to `Asus EEE PC`, the user can tweak the computer
    to make the windows capable of being dragged.


    #### Useful Sites When in Need of Ubuntu Help


    Ubuntu operating system is not very common. This is the reason why many users
    still need some Ubuntu help to get through using and familiarizing the operating
    system.

