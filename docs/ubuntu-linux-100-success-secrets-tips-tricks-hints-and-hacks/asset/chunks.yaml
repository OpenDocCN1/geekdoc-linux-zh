    many platforms to evolve. As part of the Canonical Limited in positively responding
    to this evolving need. One of the prominent developments in the computing industry
    is the progressive revolution of the XGL platform-this is an X server structure
    that were systematically developed and designed in order to capture the use of
    the evolving graphic and video cards by effectively utilizing the OpenGL environment.


    The community that develops the Ubuntu software is fully aware of the importance
    of taking advantage in this OpenGL thing because it can create a massive support
    in effectively providing acceleration in the hardware of all OpenGL and X server
    applications. The Canonical Limited has been aggressive in taking advantage of
    this and has immediately developed the Ubuntu-Linux XGL version.


    The Linux/Ubuntu XGL open source system has been ac tively taking advantage on
    the this type of a technology by ensur ing that it captures the perfect pitch
    for animation combined with the best and effective hardware acceleration. Part
    of clearly establishing the separation of the hardware and the software platforms,
    the Linux/Ubuntu XGL has a clear separation on the hardware and software problems
    and issues. Some of the fea tures that highlight the graphics enhancements on
    the Ubuntu XGL platform are: 3d or three dimensional desktop environ ment providing
    more space for the effective use of your desktop; the effective tiling of the
    application which allows the user to have a clearer picture on all opened application
    taking up the processes.


    81


    Firefox Ubuntu Bundle: Safer Internet


    Browsing in Ubuntu


    Ubuntu comes in a complete package. When people install Ubuntu in their PC they
    get everything they need every day. For work, people get the OpenOffice suite.
    This means that one gets a word processor, a spreadsheet and even software for
    presenta tions.


    Ubuntu also comes with a web browser. This is when Fire fox becomes useful to
    Ubuntu users. They are provided with a secure browser. What''s even better is
    that security updates are also provided by Firefox so security is always taken
    care of. Firefox updates can be received through the Ubuntu repository. Ubuntu
    users can also get the updates directly from the Mozilla website.


    And there''s even more for Ubuntu users. They can actually try to tweak Ubuntu
    to speed up Firefox. Many people remove Firefox extensions since they can cause
    a lag in the system at times. Some extensions also have some security leaks. More
    tweaks can be done on the configuration of Firefox in Ubuntu. The Internet is
    surely full of tutorials on how to enhance Firefox in Ubuntu.


    Since many people use Firefox anyway, migrating to Ub untu would not be entirely
    new to them when it comes to brows ing the Internet. Less computer savvy people
    will be less hesitant to use Ubuntu in their PCs. Getting the open source operating
    system would be a more beneficial option for more and more people.


    82


    This only goes to show that open source and free software can actually be great
    as well. Firefox, for example, being bundled with Ubuntu makes it safer for people
    to use this operating system.


    83


    Ubuntu Feisty Fawn for an Easier and a


    More Convenient Computing Experience


    Ubuntu has been created as an open source operating sys tem. This means that anyone
    can use the free operating system and users are provided support both officially
    by Ubuntu and the open source community. When Ubuntu is installed Firefox web
    browser, OpenOffice and other essential applications are also included to complete
    the requirements of every computer user.


    While its first Ubuntu release was way back in 2004, the Ubuntu Feisty Fawn was
    released in 2007. Ubuntu Feisty Fawn typically is known for having network improvements.
    The Ub untu Feisty Fawn also allowed data migration. When people migrated from
    Windows to Ubuntu Feisty Fawn, they were able to transfer data quite easily and
    conveniently. It also provides a better multimedia support to its users. Most
    of all, Ubuntu became more user-friendly than its predecessors.


    Because of the network manager provided in Ubuntu Fei sty Fawn, finding and connecting
    to wired and wireless networks became easier. In just one click, one can already
    see all the available networks. Each of the network''s strength can even be seen.


    Ubuntu Feisty also featured new desktop background im ages. This meant that existing
    Ubuntu users got fresh images when they updated. New Ubuntu users got the improved
    version of Ubuntu too.


    Adding new applications has also been made easier in Ub untu Feisty. The fun part
    of using Ubuntu Feisty is the new games it offers. Chess and Sudoku, for example,
    are now in-84


    eluded in Ubuntu Feisty. And then users would really appreciate the improved Help
    Center. It now has a more convenient and easy to use interface. It even has a
    more stylish look.


    85


    New Features That Attract Users to Ubuntu


    Gutsy


    With every Ubuntu update, there are always new features for its users. Surely,
    improvements and enhancements are made in each as well. Being an open source operating
    system, commu nities are there to work on resolving bugs and improving its features
    always.


    Ubuntu Gutsy, for example, brings a new look to the desk top. With Compiz Fusion,
    3D desktop effects are made possible. This is, of course, possible as long as
    the hardware permits such capability. For those who have older computers, there''s
    also nothing to worry since Ubuntu Gutsy can automatically tell whether the system
    has the capacity to run the effects or not. If the computer is not equipped sufficiently,
    the 3D effects are not activated. Of course, if users don''t want them such feature
    can easily be disabled. And in the same manner, other desktop effects can also
    be activated.'
