    bilities; animations; and motion effects. These effects will cer


    tainly make the desktop more dynamic and animated.


    However, users of computers with particular graphics cards may experience difficulty
    on the performance of desktop effects on their computer. One thing it can possibly
    cause is the slowing of computer operation once the effects are turned on. So,
    it is necessary and would be very much helpful to look for guides that present
    the right way to tweak it. By doing so, any possible problems on the performance
    of the desktop can be avoided. More importantly, users may pattern the performance
    of their desktop according to their want.


    The following discussion will provide a preview on the in


    stallation and configuration of Compiz:


    Because the central Compiz packages are already installed by default, users can
    begin using some of their desktop settings right away even without doing anything.
    However, to seize the functionality of Advanced Desktop Effects Settings, users
    need to add CCSM application. This is obtainable in the Add/Remove program applications.


    Afterwards, users can go to the System then to the Prefer ences to reach the Advanced
    Desktop Effects Settings applica tion. This way, users can customize their desktop
    performance.


    132


    There are actually numerous effects that can be activated or deactivated. So,
    for those users who want to fully customize their desktop may spend hours of exploration
    to these tweaks and effects.


    133


    #### Ubuntu Release: Now on Its Ninth Ver


    sions


    Ubuntu is now regarded as one of the most well-known Linux distributions all throughout
    the world. This computer operating system is continually progressing as it always
    comes with new versions time after time. In fact, the latest Ubuntu release was
    done last October. Mark Shuttleworth, founder of Ubuntu, together with his team
    released finally the Ubuntu 8.10 also known as Intrepid Ibex.


    Normally, Ubuntu slackly follow their six-month phase of release. And during the
    phase of development, an Ubuntu release is vitally identified by its code name.


    So, what can people expect from Intrepid Ibex?


    Essentially, the Intrepid Ibex feature enhancements to desktop scalability and
    mobile computing including an improved flexibility for Internet connectivity.
    Shuttleworth explained that the desktop offering of this version serves as the
    central point once again as they reengineered its interface. Shuttleworth also
    added that they aimed to make the recent model as prolific as possible during
    the process of its making by attaining new levels of performance.


    Additionally, Shuttleworth mentioned that the particular focus on Intrepid Ibex
    is an all-encompassing Internet access the capability to connect into bandwidth
    regardless of a user''s location.


    Shuttleworth also noted that the 8.10 release was their ninth Ubuntu release and
    joined the fourth anniversary celebra-134


    tion of the first Ubuntu release. Shuttleworth recognized the event as a mark
    of their profound success.


    Now, Shuttleworth and his team will release again the next version of Ubuntu this
    coming April, which is identified as Ubuntu 8.04 also known as Hardy Heron. He
    gave an an nouncement to the public, which is particularly addressed to people
    in corporate world, about their openness and eagerness to have their contribution
    to attain the success of their upcoming project.


    135


    Ways to Set-Up Ubuntu Synaptic


    The synaptic package manager is basically an advanced application of package management
    that is capable to install and uninstall every package presented in one''s system.
    Its interface is graphical such as Add/Remove applications. However, users can
    expect to have a lot more information. Meaning, synaptic pro vides users with
    absolute control over the whole package man agement of their system.


    Users need to note though that operating Synaptic needs administrative privileges.
    Now, to officially launch Synaptic, users should select the following in the system
    of their desktop menu: System>Administration>Synaptic Package Manager.


    The Synaptic screen will appear to be divided into four parts. The two sections
    at the left pane present the package categories while the other two sections at
    the right pane present the packages. To set up packages, users simply need to
    select the category, locate the package name in the file, then right click on
    the name and select "Mark this package for installation."


    When users are already satisfied with his selections he can already click Apply
    on the button bar at the top. Automatically, Synaptic will download and set up
    the needed packages directly from the online repositories or from Ubuntu installation
    CD.


    Another way to download Synaptic is to click the Search button, enter the name
    of the package or a brief search term in the field of search text and then click
    the Search button. After doing this, Synaptic will instantly present a briefer
    list wherein users can select the applications they want to install. This way
    is more convenient as compared to the first since there is no need to look for
    a very long list of applications.


    136


