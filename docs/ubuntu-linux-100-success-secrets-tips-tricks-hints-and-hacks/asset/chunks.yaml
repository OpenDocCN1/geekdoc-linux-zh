    例如，Ubuntu Hardy 引入了 `Xorg 7.3`。有了这样的应用程序，用户可以享受屏幕分辨率自动配置的便利。它还允许用户轻松配置另一个显示器的旋转。当人们使用连接投影仪的笔记本电脑时，这确实有用。


    说到网络浏览器，现在使用了更安全的 `Firefox 3` 替代了 `Firefox 2`。这允许图标和随后的颜色匹配。它还允许了更好的系统配置。


    默认情况下，Ubuntu Hardy 还会安装 `Brasero`。它是该版本的 CD/DVD 刻录应用程序，取代了 `Serpentine` 音频程序。此外，用户还会获得一个世界时小部件。这允许显示多个位置的日历和时间。它允许显示任意地点的天气。


    # Ubuntu 软件仓库：Ubuntu 程序的软件存档


    Ubuntu 是一个开源操作系统。它专注于易用性，通过这一点，Ubuntu 让人们在电脑 上使用 Ubuntu 变得简单又方便。Ubuntu 还提供了无障碍支持。那些没有预装该系统的用户可以通过
    Live CD 访问操作系统。还有一个备选的 `CD`。


    为了让 Ubuntu 变得实用，它与基础的程序和应用程序一起安装。例如，软件包中包含了 `Firefox` 和 `OpenOffice`。Ubuntu 还有其他程序可用。有些程序是随操作系统一起的。其他的也可以手动安装到
    Ubuntu。


    Ubuntu 仓库包含了所有为 Ubuntu 开发的程序。这些程序在互联网上可用，因此人们根据需要添加新程序实际上非常简单。拥有 Ubuntu 仓库让人们安装程序变得很安全。这是因为
    Ubuntu 仓库中的程序经过了测试，以确保它们与 Ubuntu 操作系统兼容。用户可以确保它们确实会在 Ubuntu 环境中无缝运行。


    在 Ubuntu 仓库中，程序被进一步分为四类。“主（Main）”程序是免费的并受 Ubuntu 官方支持。“宇宙（Universe）”程序也是免费的。然而，这些程序仅由社区支持。


    非免费程序通常不受 Ubuntu 官方支持，被称为“多宇宙（Multiverse）”。“受限（Restricted）”程序是一个例外，因为它们受 Ubuntu
    支持。然而，与“主”程序相比，对“受限”程序的支持是有限。


    # 使用 Ubuntu 的预期


    许多电脑现在都预装了 Ubuntu。所以，即使对于那些不精通电脑的人来说，使用 Ubuntu 也是一个选择。事实上，在某种程度上拥有 Ubuntu 可能是一个优势，因为
    Ubuntu 几乎已经安装了所有所需的服务。


    新的 Ubuntu 用户必须习惯简单的棕色桌面。虽然大部分最初只是一个空白的棕色界面，用户也可以在那里放置一些图标和快捷方式。就像 `Windows` 桌面一样，可以在底部查看活动应用程序的状态。应用程序通过顶部面板激活。


    在 Ubuntu 中，菜单可以自定义为不同的子菜单。用户还可以移除若干服务。这是通过内置的菜单编辑器实现的。正因如此，编辑和自定义菜单真的非常简单。


    通过桌面顶部的“位置（Places）”按钮查找文件和文件夹也极其方便。“主目录（Home Folder）”将包含用户使用的所有个人文件。“桌面（Desktop）”也在“位置”中，它包含了桌面上的所有图标。


    当然，“位置”还包含“计算机（Computer）”，它包含了计算机中的所有驱动器。在“位置”中，Ubuntu 用户还可以访问服务器并连接到可用的服务器。


    用户还可以期望在“位置”中方便地找到他们最近使用的文档。因此，不需要在获取所需文件之前遍历各种菜单，一切都在“位置”中。位于“位置”旁“系统（Systems）”也不应该被忽视。这是因为当人们想要配置和自定义自己的电脑时，这是遵循的路径。


    # Ubuntu.com 存档：让 Ubuntu 更易用、易访问


    Ubuntu 的主要重点是操作系统的易用性。这意味着在安装中也包含了日常使用所需的所有应用程序。例如，安装 Ubuntu 包含了 `OpenOffice`，以便人们可以在电脑上进行工作。它还包含了用于娱乐的视频和音乐播放器。`Firefox`
    也默认包含在 Ubuntu 的安装中。


    再次，这样做是为了方便在电脑上使用 Ubuntu 的便利性。Ubuntu 还有许多游戏和更多应用程序供选择。所有这些应用程序和程序都在 Ubuntu 存档中。这使得软件可以通过互联网获取。为了增强每位
    Ubuntu 用户的计算体验，这些程序被设为可获取。通过这样，Ubuntu 用户可以轻松地找到他们所需的服务所需的应用程序。


    主程序当然是包含在安装 `CD` 中的那些。其他程序主要通过 Ubuntu 网站访问。这仍然是 Ubuntu 存档的用途。它是存储应用程序的地方。因此，当人们为自己的
    Ubuntu PC 需要额外软件时，这里就是查找的地方。


    有了 Ubuntu 存档供所有 Ubuntu 用户随时使用，Ubuntu 确实变得更加易访问。当用户能够找到他们他们特定用途的正确程序时，Ubuntu 变得更加易用。人们能够欣赏使用
    Ubuntu。因此，Ubuntu 为其用户提供了更多价值。


    # Ubuntu Gutsy 评：它有多友好？


    如果说 Ubuntu 有什么广为人知的特点，那就是 Ubuntu 非常容易配置。因此，它也很用。对于许多在桌面和笔记本电脑上使用 Ubuntu 的人来说，Ubuntu
    足够简单方便，足以与 `Windows` 竞争。Ubuntu Gutsy 的发布进一步加强了这一信念。


    Ubuntu Gutsy 的一个优点是它是通过一个现场 `CD` 交付的。所以，想先尝试的人可以在不实际将其安装到电脑上的情况下这样做。如果他们喜欢这种体验，那就是他们安装它的时候。它还可以与
    `windows` 进行双引导。如果有人想这样做，他必须导入所有的设置和文件。安装并导入一切只需要不到 20 分钟。


    安装并重启后，电脑的 Wi-fi 卡将立即开始工作，Ubuntu Gutsy 会立即将其连接到现有的本地网络。它默认开启受保护访问加密（Protected
    Access Encryption），因此用户无需进行设置或配置即可得到保护。


    在 Ubuntu Gutsy 中，音乐管理非常棒。导入文件和上传到 `iPods` 没有发现任何问题。然而，Ubuntu Gutsy 领先 `Windows`
    的地方在于添加和删除应用程序和程序。虽然有很多 Ubuntu 游戏，但也有许多游戏感到对他们熟悉的流行游戏缺乏支持。对某些 DVD 格式也缺乏支持。但 Ubuntu
    Gutsy 通过为默认媒体播放器（`Totem`）寻找所需的解码器来补偿这一点。


    # Ubuntu 视频：观看与编辑


    ## 使用 Ubuntu 实现视频


    Ubuntu 拥有人们在开始使用电脑时可能需要的一切。这是因为人们需要的几乎所有的应用程序和程序都包含在 Ubuntu 中。

