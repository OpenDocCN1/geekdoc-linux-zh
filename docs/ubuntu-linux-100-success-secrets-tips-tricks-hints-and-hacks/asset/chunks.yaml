- fmt: '

    Most people do almost everything in their computers nowadays. People do their
    work or school papers. People read the news and people do their shopping through
    their computers as well. For entertainment, many people play computer games. Others
    listen to music too. And then they also watch TV and play videos.


    That is why it is but important that Ubuntu include avid video player as well.
    Well, movies and video clips are generally played through `Totem` movie player.
    It''s really quite easy to watch a movie in Ubuntu. One simply has to click on
    "Applications." He has to go to "Sound and Video" and then "Movie Player."


    At times, Ubuntu cannot play some video formats. When this happens, all one typically
    has to do is install additional application software. It could be another movie
    player. Some times one only needs a plug-in to play the said video format.


    Watching video podcasts is also possible with Ubuntu. Ubuntu offers optional video
    applications for the Internet too. Ubuntu users have the choice between `PenguinTV
    Media Aggregator`, `Kitty` and `Democracy TV`.


    If Ubuntu users need to edit their video clips, they can do so. Again there are
    several choices when it comes to software for this purpose. A simple Ubuntu video
    editor would be the `Pitivi Video Editor`. Ubuntu users can also create DVDs through
    `DeVeDe`. Among the more advanced Ubuntu video editors are `Thoggen DVD Ripper`,
    `Kino`, `Stopmotion` and `Subtitle Editor`.


    # Breezy Ubuntu: Boast of Efficient Hardware Detection


    If `Ubuntu Breezy Badger` can boast of one characteristic common to all Ubuntu
    releases, it is the usability of `Ubuntu Breezy Badger` that makes it as ahead
    as the previous releases. `Ubuntu Breezy Badger` is very consistent with the Ubuntu
    easy to configure and easy to use reputation. That''s because `Ubuntu Breezy Badger`
    installation is very easy to do. While it may pause in some instances, these are
    only temporary. Installation is still relatively problem free.


    A certain strength that the `Ubuntu Breezy Badger` has compared to the previous
    release though is its ability to recognize most of the hardware in the computers.
    It will even configure the computer''s wireless card.


    What `Ubuntu Breezy Badger` can''t do is install proprietary drivers. Nevertheless,
    it would be easy for users to configure such services for gaming and better viewing.
    One thing new Ubuntu users and less computer savvy users will appreciate is the
    minimal user interference in `Ubuntu Breezy Badger` installation.


    Since Ubuntu can detect all hardware, one would not need to indicate what type
    of hardware he has in the computer. `Ubuntu Breezy Badger` will virtually do everything
    for the user. One new cool thing it did during its release is putting the laptop
    on sleep as soon as the lid is closed.


    `Ubuntu Breezy Badger` also features the language selector. This is only also
    consistent with the aim of Ubuntu for internationalization. People can select
    their own language for the system to use. They will get support in the form of
    translations for the menus and the interfaces. There would also be dictionaries
    and other tools pertaining to language.


    # Ubuntu C++ Programming: For a Speed and Efficiency


    Ubuntu installation for desktop usage has been boasted to be quite easy and quite
    useful for many people. That''s perhaps because of the fact that Ubuntu installation
    already includes a productivity suite, `OpenOffice`, `Firefox` as its default
    web browser, multimedia players and other programs essential for every ordinary
    user of today.


    Ubuntu, being an open source operating system, is known to be community developed.
    While Ubuntu provides support as well, the community is quite popular for being
    proactive in providing answers to queries and tips for first time Ubuntu users.
    This is even more appreciated by the more advanced Ubuntu users.


    Yes, Ubuntu also provides programming tools. In fact, Ubuntu is a very useful
    development platform for programmers. Many programmers find it quite easy to use
    Ubuntu. They can do programming in Ubuntu using most programming languages including
    `C++`.


    The core of Ubuntu operating system is actually written in `C`. So being an extension
    of `C`, using `C++` is actually a good choice for many programmers too. Using
    this language provides speed and efficiency.


    To be able to use `C++`, one should take note that the `build-essential` package
    needs to be installed. After which, the rest would be up to the user to take the
    most advantage of Ubuntu.


    When it comes to having the tools for programming, Ubuntu certainly provides.
    Graphical applications can be designed using the graphical toolkit provided by
    Ubuntu. Popular development platforms like `GTK/GNOME` and `Qt/KDE` can be used
    when using Ubuntu. And Ubuntu will supply the necessary tools needed.


    # Easy-to-Use Graphical Tool with Ubuntu


    Just like the commercially available operating systems, the Ubuntu also offers
    many useful applications for its users. One of these is the `EasyUbuntu`, a graphical
    tool. Some call it `Easy Ubuntu`, but the name is really `EasyUbuntu`.


    With `EasyUbuntu`, the user can have a graphical tool that is easy to use even
    if he is not used to having a Linux operating system. This is great for installing
    proprietary packages, plugins, or codecs.


    `EasyUbuntu` allows users to add more repositories that are helpful when installing
    more added applications. This program also permits installing multimedia codecs
    so that DVDs, music, and videos can be read. Activating the "audio preview" featured
    in `Nautilus` is also allowable with `EasyUbuntu`.


    Moreover, installing the needed `Firefox` plugins like `Flash`, `Real`, `Java`,
    `Windows Media`, and `QuickTime` can be done with `EasyUbuntu`. Even adding Microsoft
    fonts, `Firefox` icons and buttons is permitted as long as `EasyUbuntu` is installed
    in the computer.


    Some applications that can be installed with `EasyUbuntu` are: P2P software like
    `Azureus` and `aMule`, `Skype`, archiving support for `ACE` and `RAR`, and `ATI`
    and `NVIDIA` driver to support 3D hardware acceleration. Activating the num lock
    during the startup is also possible with `EasyUbuntu` as well as replacing the
    fool logo of `GNOME` with the logo of Ubuntu.


    Generally, `Easy Ubuntu` is very helpful since Ubuntu is not a commercial operating
    system. There are a lot of common and needed applications that cannot be easily
    installed on Ubuntu because of compatibility issues. However, with Easy Ubuntu,
    all generally needed applications and supports can be installed easily without
    undergoing compatibility problems.


    # Free Downloadable Games for Ubuntu


    Ubuntu is not just about free application and free office suite. Users can also
    get entertained with Ubuntu not just of its multimedia players but of free games
    for Ubuntu.


    Most Ubuntu users have the following free games: `Beyblade Project`, `Beyond the
    Red Line`, `America''s Army 2.5`, `Flight gear`, `Dark Horizons: Lore Invasion`,
    `Flying Guns`, `Slam Soccer 2006`, `Frozen Bubble`, `Spring`, `Wolfenstein`, `Gundam
    Animation`, `Wormux`, and `World of Padman`. Other games for Ubuntu downloadable
    for free are the `Action Cube`, `Battle for Wesnoth`, `AssaultCube`, `Freecol`,
    `FooBillard`, `Eat the Whistle`, `Globulation`, `OpenArena`, `Nexuiz`, `Racer`,
    `PlaneFlight`, `Savage`, `Stepmania`, `Tile Racer`, `Thunder&Lightning`, `Urban
    Terror`, `Vega Strike`, `Yoda Soccer`, and `Vdrift`.


    Users can directly install some free Ubuntu games. How ever, there are games that
    need aid from a game installer like `Ultramatix` or `Ubuntu Game Installer (UGI)`.

