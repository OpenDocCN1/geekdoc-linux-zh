- fmt: '

    For instance, Ubuntu Hardy brings in `Xorg 7.3`. With such application, users
    have the luxury of having screen resolution auto-configured. It also allows users
    to easily configure the rotation of another monitor. It is indeed very useful
    when people are using laptops connected to a projector.


    When it comes to web browser, the more secure `Firefox 3` is now used instead
    of `Firefox 2`. This allows icon and then color matching. And it also permits
    a better system configuration.


    By default, `Brasero` is also installed with the Ubuntu Hardy. It is the CD/DVD
    burning application for this version which replaces `Serpentine` audio. In addition
    to that one also gets a world clock applet. This allows the display of the calendar
    and time of multiple locations. It allows the display of the weather in as many
    locations.


    # Ubuntu Repository: Software Archive for Ubuntu Programs


    Ubuntu is an open source operating system. It focuses on usability and by that,
    Ubuntu has made it easy and convenient for people to use Ubuntu in their PCs.
    Ubuntu offers accessibility as well. People who don''t have it pre-installed can
    access the operating system through the Live CD. There''s also the alternate `CD`.


    In the aim to make Ubuntu useful, it is installed together with essential programs
    and applications. For instance, `Firefox` and `OpenOffice` are included in the
    package. Other programs are also available for Ubuntu. Some are packaged with
    the operating system. Others can be installed manually to Ubuntu as well.


    The Ubuntu repository contains all the programs made for Ubuntu. Such programs
    are available in the internet so it''s actually easy to add new programs as people
    need them. Having the Ubuntu repository makes it safe for people to install the
    programs. This is because programs in the Ubuntu repository undergo testing to
    make sure that they are compatible with the Ubuntu operating system. Users are
    assured that they will indeed run seamlessly within the Ubuntu environment.


    Within the Ubuntu repository, programs are further classified into four categories.
    "Main" programs are free and officially supported by Ubuntu. "Universe" programs
    are also free. However, such programs are community supported only.


    Non-free programs are typically not officially supported by Ubuntu and called
    "Multiverse." "Restricted" programs are exception to this though as they are supported
    by Ubuntu. However, the support given to "Restricted" programs are limited compared
    to "Main" programs.


    # What to Expect from Using Ubuntu


    Many computers are now pre-installed with Ubuntu. So using Ubuntu is really an
    option even to those who are not that computer savvy. Well, to some extent having
    Ubuntu could be an advantage since Ubuntu has almost all the services needed installed
    with it.


    New Ubuntu users have to get used to the simple brown desktop. While a large part
    of it is first just the blank brown interface, users can also place some icons
    and shortcuts there. Like the `Windows` desktop, status of active applications
    can be seen at the bottom. Applications are activated through the top panel.


    In Ubuntu, menus can be customized to different sub menus. Users may also take
    out several services. And this is made possible through the built-in menu editor.
    Because of this, it is really quite easy to edit and customize the menus.


    Finding files and folders is also very convenient through the "Places" button
    located at the top of the desktop. The "Home Folder" would contain all the personal
    files that the user is using. "Desktop", which is also in "Places," contains all
    the icons contained in the desktop.


    Of course, "Places" also contain "Computer" which contains all the drives in the
    computer. And right on "Places" Ubuntu users can also access servers and connect
    to available servers.


    Users can also expect to conveniently find their recently used documents in "Places."
    So instead of going through various menus before getting to the file they need
    everything is really in "Places." "Systems," which is next to "Places," should
    not be ignored. That''s because it is the path to follow when one wants to configure
    and customize his computer.


    # Archive Ubuntu.com: Makes Ubuntu More Usable and Accessible


    Ubuntu''s primarily emphasis is on the usability of the operating system. This
    means also including all the applications that are needed for the everyday use
    in the installation. For example, installing Ubuntu includes `OpenOffice` so people
    can do their work on their PCs. It also includes video and music media players
    for entertainment. `Firefox` is also by default included in the installation of
    Ubuntu.


    Again, this is done to facilitate ease and convenience in the use of Ubuntu in
    computers. There are also games and many more applications for Ubuntu to choose
    from. All of these applications and programs are in the Ubuntu archive. This makes
    the software accessible through the Internet. In order to enhance the computing
    experience of every Ubuntu user, these programs are made accessible. This way,
    Ubuntu users can easily find the applications they need for the services they
    need.


    Main programs are, of course, those included in the install `CD`. Some other programs
    are primary accessed through the Ubuntu website. This is again the purpose of
    the Ubuntu archive. It is where the applications are stocked. It is therefore
    the place to look into when one needs additionally software for his Ubuntu PC
    use.


    With the Ubuntu archive just at the disposal of all Ubuntu users, Ubuntu indeed
    becomes more accessible. When users are able to find the right programs for their
    individual specific use, Ubuntu becomes more usable. People are able to appreciate
    the use of Ubuntu. Ubuntu, therefore, serves more purpose to its users.


    # The Ubuntu Gutsy Review: How User Friendly Is It?


    If there are things Ubuntu are known for is that Ubuntu is quite easy to configure.
    And therefore, it is also easy to use. For many people who use Ubuntu in their
    desktops and laptops Ubuntu certainly is easy and convenient enough to compete
    with `Windows`. This belief is even further strengthened by the release of Ubuntu
    Gutsy.


    One good thing about Ubuntu Gutsy is that it is delivered through a live `CD`.
    So people who want to try it first may do so without actually installing it to
    their PCs. If they like their experience with then that''s the time they can install
    it. It''s also possible to dual boot with `windows`. If one wants to do this he
    would have to import all his settings and files. And it only takes less than 20
    minutes to install and to import everything.


    After installation and rebooting, the computer''s Wi-fi card will immediately
    work and Ubuntu Gutsy will immediately connect it to the existing local network.
    It is set on default on Protected Access Encryption so the computer is protected
    without the user having to do the setting or configuration.


    Music management is great with Ubuntu Gutsy. There are no problems seen for importing
    files and uploading to `iPods`. Where Ubuntu Gutsy is ahead from `Windows` though
    is on adding and removing applications and programs. While there a lot of Ubuntu
    games, there are also many gamers who feel the lack of support for popular games
    they are used to. There''s also a lack of support for some DVD formats. But Ubuntu
    Gutsy compensates this by offering to look for the needed codecs for the default
    media player which is `Totem`.


    # Ubuntu Video: Watching and Editing


    ## Video Possible with Ubuntu


    Ubuntu has everything one could ever need when he starts using his computer. That''s
    because almost all the applications and programs one needs are there bundled with
    Ubuntu.

