    # 在 Ubuntu 上使用 sudo 有什么优势？


    默认禁用 root 登录有许多益处。首先，Ubuntu 安装程序需要问的问题更少。用户不需要记住 root 密码，而这个密码在过程中很可能会被忘记。


    此外，在进行重大更改时，系统会要求用户输入密码。这会让管理员在进行任何操作之前仔细考虑。Ubuntu 上的 `sudo` 还会为命令添加日志条目。如果管理员犯了某些错误，他可以回溯查看运行了哪些命令。这在审计中也非常有用。


    如果有人试图进入系统，他必须知道名为 `root` 的账户。由于他并不知道其他用户的用户名，且 root 账户密码被锁定的，因此他无法进入。


    除了允许短时间或长时间方便地转移管理员权限之外，这些仅仅是在 Ubuntu 上使用 `sudo` 的几个益处之一。


    # 如何将 Ubuntu Feisty 升级到 Gutsy？


    Ubuntu Gutsy 是该 Linux 发行版最新的主要版本之一。与任何其他 Linux 发行版一样，即使你的 Ubuntu Feisty 处于测试阶段，你也可以轻松将其升级到
    Gutsy。


    Ubuntu Gutsy 具有以下功能，这些可能会促使你升级 Ubuntu Feisty。它内置了对酷图形效果的支持，并带有支持多显示器的显示配置实用。它还内置了桌面搜索、通过
    PDF 打印机提供了更好的打印支持。它具有类似于 Windows 的快速用户切换功能。


    ## 升级过程


    1. 首先，使用组合键 `Alt+F2` 调出运行应用程序对话框。然后输入以下命令：

    ```

    gksu "update-manager -c"

    ```


    2. 之后，如果你看到“可用新的发行版版本 ''7.10''”和一个“升级”按钮，说明你操作是正确的。点击“升级”按钮。


    3. 你将看到许多不同的对话框要求你确认是否真的想要安装以及是否接受发行说明。你只需要点击所有的它们，直到最后看到升级对话框。


    4. 系统将询问你是否开始升级。随后将开始下载并安装所有更新，但很快就会发现这将花费很长时间。


    5. 接下来，系统会要求你删除所有过时的包，并给出一个待删除的包列表。如果你愿意，可以删除所有项目，也可以直接跳过此步骤稍后进行清理。


    6. 最后一步是重启电脑。重启后，你可以在管理工具部分打开“系统监器”，并看到 Release 7.10 或 Ubuntu Gutsy。如果你看到了这些，说明你已成功升级了
    Ubuntu。


    # Ubuntu Edgy Eft：桌面版和服务器版本的增强


    Ubuntu Edgy Eft 或 Ubuntu 6.10 是 Linux 的第五个发布版本，于 2006 年 10 月 26 日发布。如果你是 Ubuntu
    的粉丝，你可以在桌面版和服务器版本上获得此版本。


    ## 为什么选择 Ubuntu Edgy Eft？


    据说这个版本提供了更简洁、更锐利的设计。它还拥有全新的、增强的桌面应用程序以及安全领域的进展。此外，它还具有显著更短的启动时间和领先的自由软件程序。


    ## Ubuntu Edgy Eft 下的桌面增强


    该版本的桌面版有一系列增强功能，使其更加灵活且易于使用。这些增强包括一个易于使用的笔记工具和一个由单色引擎驱动的照片管理程序。后者允许用户进行标签标记、照片编辑以及自动上传到如
    `Flickr` 之类的在线照片网站。它还包含了 `GNOME 2.16`。这意味着它有通改进和新功能，例如增强的电源管理。


    桌面版还更换了启动管理器，它提供了更简洁的设计、更引人目的的效果和更快的启动时间。它具有主动安全功能，可以防止常见安全漏洞的发生。


    ## Ubuntu 服务器版增强


    据说 Ubuntu 服务器版可以将 Ubuntu 部署在常见的 Linux 服务器角色中，如 Web 服务器或文件服务器。它还包含了即将到来的 Linux
    终端服务器项目的预发布版，与传统的办公桌面部署相比，该项目提供了总成本更低、安装更简单且更易维护的瘦客户客户端。由于所有数据都存储在服务器上，管理员降低了更新单个工作站的成本。


    # 你应该买《Ubuntu Unleashed》这本书吗？


    网上有很多关于 Ubuntu 主题的书籍。然而，由 Andrew 和 Paul Hudson 编写的《Ubuntu Unleashed》被认为拥有最详尽的技术内容。


    ## 这本书关于什么？


    据说这本书包含了你关于 Ubuntu 的所需知识。它甚至包含了将 Ubuntu 用作桌面、服务器、网络主机、编程工具等的信息。


    该书共有 35 章节和一个在线资源附录，这确保了读者知道这是一本研究充分的书。它对于初学者来说并不是易读的，也不能在短时间内读完。你需要时间和精力才能吸收其中的内容。


    该书涵盖了几个广泛的主题，包括安装与配置、系统管理、作为服务器的 Ubuntu、Linux 编程以及 Ubuntu 维护。每个主题都包含各种桌面和服务器任务的详细指令。


    ## 读者的评论


    人们对《Ubuntu Unleashed》有各种反应。有些人喜欢这本书，是因为其中有些章节对他们的工作非常有帮助，例如备备份和恢复机器、使用 `Apache`
    托管网站等。关于这本书的正面评价之一是，它充实了易于获取的知识。此外，查找话题非常容易，因为索引良好且组织清晰。


    另一方面，一些用户认为《Ubuntu Unleashed》对他们的口味来说太技术化了。他们说写作风格要求很高，会让新手感到枯燥。这些用户希望它能以更口语化的方式编写。


    对于精通 Ubuntu 的人来说，《Ubuntu Unleashed》无疑是必备的。


    # Ubuntu Feisty：特性与安装


    Ubuntu 7.04 或 Feisty Fawn 被认为是 Linux 历史上的一个成功。据说这个版本专注于与终端用户交互的功能。然而，它在开发者中也受欢迎。


    ## Ubuntu Feisty Fawn 有哪些特性？


    这个版本的 Ubuntu 有许多新功能，如 Windows 迁移工具和更简单的多媒体。它还带有 Linux `2.6.2.0` 内核和 `Gnome 2.18`。


    ## 系统安装要求


    运行 Ubuntu Feisty Fawn 需要硬件规格。然而，你可能可以使用较低的配置运行，但性能可能会变差。有一个最低要求可以让无图形服务器运行良好。但如果你想运行图形化安装，应该使用推荐的最低要求。


    如果你安装的是桌面系统，这通常用于个人计算任务并具有图形用户界面。最低要求如下：300 MHz x86 处理器、64 MB 内存（RAM）、至少 2GB 磁盘空间、CD-ROM
    驱动器和支持 640x480 分辨率的 VGA 显卡。


    同时，推荐的最低要求为：500 MHz x86 处理器、192 MB 内存、8 GB 磁盘空间、支持 1024x768 分辨率的显卡、声卡和网络连接。


    另一个建议是使用 64 位安装。


