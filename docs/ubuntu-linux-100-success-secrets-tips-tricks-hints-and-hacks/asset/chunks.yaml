  raw: 'The current concept of release in Ubuntu is to be able to release new versions
    of the virtual appliance every six months. Of course, this is something that''s
    hard to do considering the nature of the programs itself and its functions.


    There''s also the testing and the delivery stages, but the good thing about Ubuntu
    is that when they say something, they generally get it done. This reflects well
    towards the public and places Ubuntu on better light in terms of reputation, and
    in the business of sales, this is needed.


    So how can Ubuntu even release a single version every 6 months? This is question
    that many people ask about, that on top of everything else, they still make it
    through.


    The trick is that there are a lot of feedbacks coming from the users to the Ubuntu
    people, and this is something that''s really valued. In fact, there have been
    Ubuntu versions released on the basis of mostly what the feedbacks had stated.


    Aside from the Ubuntu release every 6 months, Ubuntu also promises to release
    out an Enterprise Release every 12 to 24 months. This enterprise release is something
    that makes Ubuntu exceptional as there will always be something to upgrade with.


    Of course, Ubuntu users don''t have to upgrade their Ub


    untu per new release.


    They can, if they want, stay with their old Ubuntu versions and still receive
    security updates and applications on a regular basis and this is good for 18 months.
    This makes it a highly 170


    reliable virtual appliance that''s basically good enough to stand on its own with
    as little support as possible from the developers.


