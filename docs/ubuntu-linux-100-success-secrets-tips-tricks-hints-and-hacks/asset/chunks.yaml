    如今，大多数人都在电脑上完成几乎所有的事情。人们通过电脑工作或写学校论文。人们还通过电脑阅读新闻和购物。为了娱乐，许多人玩电脑游戏。还有人听音乐。此外他们还会看电视和播放视频。


    这就是为什么 Ubuntu 包含一个优秀的视频播放器非常重要原因。通常，电影和视频片段通过 `Totem` 电影播放器播放。在 Ubuntu 中看电影非常简单。用户只需点击“应用程序”，然后进入“声音和视频”，最后选择“电影播放器”。


    有时，Ubuntu 无法播放某些视频格式。当这种情况发生时，用户通常需要做的就是安装额外的应用程序。这可能是另一个电影播放器。有时，用户只需要一个插件来播放上述视频格式。


    使用 Ubuntu 还可以观看视频播客。Ubuntu 还为互联网提供了可选的视频应用程序。Ubuntu 用户可以在 `PenguinTV Media Aggregator`、`Kitty`
    和 `Democracy TV` 之间进行选择。


    如果 Ubuntu 用户需要剪辑视频片段，他们可以做到。同样，在此目的软件方面有多种选择。一个简单的 Ubuntu 视频编辑器是 `Pitivi Video
    Editor`。Ubuntu 用户还可以通过 `DeVeDe` 创建 DVD。在更高级的 Ubuntu 视频编辑器中包括 `Thoggen DVD Ripper`、`Kino`、`Stopmotion`
    和 `Subtitle Editor`。


    # 清爽的 Ubuntu：高效检测高效自豪


    如果说 `Ubuntu Breezy Badger` 有一个所有 Ubuntu 版本共有的特征，那就是 `Ubuntu Breezy Badger` 的易用性使其领先于之前的版本。`Ubuntu
    Breezy Badger` 与 Ubuntu 易于配置和易用的口碑非常一致。这是因为 `Ubuntu Breezy Badger` 的安装非常简单。虽然在某些情况下可能会暂停，但这些只是暂时的。安装仍然相对顺利。


    不过，`Ubuntu Breezy Badger` 与之前的版本相比，一个特定的优势在于它识别电脑中大多数硬件的能力。它甚至可以配置电脑的网卡。


    `Ubuntu Breezy Badger` 无法做到的是安装专有驱动。尽管如此，用户可以轻松配置此类服务用于游戏和更好的观看。新 Ubuntu 用户和不精通电脑的用户会喜欢的一点是
    `Ubuntu Breezy Badger` 安装过程中极少的用户干预。


    由于 Ubuntu 可以检测所有硬件，用户不需要指示其电脑中有什么种类型的硬件。`Ubuntu Breezy Badger` 几乎会为用户完成一切。它在发布期间完成的一个新酷功能是在合上盖子时立即让笔记本电脑进入睡眠。


    `Ubuntu Breezy Badger` 还具有语言选择器功能。这与 Ubuntu 国际化的目标保持一致。人们可以为系统选择他们自己的语言。他们将获得菜单和界面的翻译形式的支持。还会有字典和其他与语言相关的工具。


    # Ubuntu C++ 编程：为了速度与效率


    用于桌面使用的 Ubuntu 安装程序被誉为非常简单且对许多人非常有用。这可能是因为 Ubuntu 安装已经包含了一套生产力套件 `OpenOffice`、作为默认浏览器的
    `Firefox`、多媒体播放器以及当今每个普通用户必不可少的其他程序。


    Ubuntu 作为一个开源操作系统，以社区开发而闻名。虽然 Ubuntu 也提供支持，但社区在积极为首次使用 Ubuntu 的提供查询解答和提示方面非常受欢迎。这甚至受到更高级
    Ubuntu 用户的青赏。


    是的，Ubuntu 也提供编程工具。事实上，Ubuntu 对程序员来说是一个非常实用的开发平台。许多程序员发现使用 Ubuntu 非常方便。他们可以在 Ubuntu
    中使用大多数编程语言（包括 `C++`）进行编程。


    Ubuntu 操作系统的核心实际上是用 `C` 编写的。因此，作为 `C` 的扩展，使用 `C++` 对许多程序员来说也是一个很好的选择。使用这种语言提供了速度和效率。


    为了使用 `C++`，用户应该注意需要安装 `build-essential` 软件包。之后，剩下的取决于用户如何充分利用 Ubuntu。


    在提供编程工具方面，Ubuntu 确实提供了。可以使用 Ubuntu 提供的图形化工具包设计图形化应用程序。在使用 Ubuntu 时，可以使用如 `GTK/GNOME`
    和 `Qt/KDE` 这样的流行开发平台。Ubuntu 将提供所需的工具。


    # Ubuntu 易用的图形化工具


    与商用操作系统一样，Ubuntu 也为其用户提供了许多实用的应用程序。之一就是 `EasyUbuntu`，这是一个图形化工具。有些人称它为 `Easy Ubuntu`，但名称实际上是
    `EasyUbuntu`。


    通过 `EasyUbuntu`，即使用户不习惯 Linux 操作系统，可以使用易用的图形化工具。这对于安装专有包、插件或解码器非常有帮助。


    `EasyUbuntu` 允许用户添加更多存储库，这在安装更多应用程序时很有帮助。该程序还允许安装多媒体解码器，以便读取 DVD、音乐和视频。通过 `EasyUbuntu`
    还可以激活 `Nautilus` 中的“音频预览”功能。


    此外，可以通过 `EasyUbuntu` 安装所需的 `Firefox` 插件，如 `Flash`、`Real`、`Java`、`Windows Media`
    和 `QuickTime`。只要电脑上安装了 `EasyUbuntu`，即使添加微软字体、`Firefox` 图标和按钮也是允许的。


    可以使用 `EasyUbuntu` 安装的一些应用程序有：如 `Azureus` 和 `aMule` 等 P2P 软件、`Skype`、`ACE` 和 `RAR`
    的归档支持，以及支持 3D 硬件加速的 `ATI` 和 `NVIDIA` 驱动。在启动时激活大写锁定也是可能的，并将 `GNOME` 的错误标志替换为 Ubuntu
    标志。


    通常，`Easy Ubuntu` 非常帮助，因为 Ubuntu 不是商用操作系统。有很多常用且需要的应用程序因为兼容性问题无法在 Ubuntu 上轻松安装。然而，通过
    Easy Ubuntu，可以轻松安装所有常用的应用程序和支持，而无需经历兼容性问题。


    # Ubuntu 免费下载游戏


    Ubuntu 不仅仅关于免费应用程序和免费办公套件。用户还可以通过 Ubuntu 娱乐，不仅是因为它的多媒体播放器，还因为 Ubuntu 的免费游戏。


    大多数 Ubuntu 用户拥有以下免费游戏：`Beyblade Project`、`Beyond the Red Line`、`America''s Army
    2.5`、`Flight gear`、`Dark Horizons: Lore Invasion`、`Flying Guns`、`Slam Soccer 2006`、`Frozen
    Bubble`、`Spring`、`Wolfenstein`、`Gundam Animation`、`Wormux` 和 `World of Padman`。其他免费下载的
    Ubuntu 游戏还有 `Action Cube`、`Battle for Wesnoth`、`AssaultCube`、`Freecol`、`FooBillard`、`Eat
    the Whistle`、`Globulation`、`OpenArena`、`Nexuiz`、`Racer`、`PlaneFlight`、`Savage`、`Stepmania`、`Tile
    Racer`、`Thunder&Lightning`、`Urban Terror`、`Vega Strike`、`Yoda Soccer` 和 `Vdrift`。


    用户可以直接安装一些免费的 Ubuntu 游戏。然而，某些游戏需要游戏安装程序（如 `Ultramatix` 或 `Ubuntu Game Installer
    (UGI)`）的帮助。


