    # Ubuntu 及其兼容的计算机系统


    与其他许多软件一样，有特定的计算机来运行和执行为其量身设计的系统。这种做法可能被误认为是“排他性的：某些其他计算机系统和软件也是如此”，但这种做法已被证明在实践中是有效的。


    最近，Ubuntu 的母公司 `Canonical Limited` 已与一家领先的计算机系统制造商之一建立了成功的合作，以继续开发一种运行在特定计算机设计下的强大且专用的软件。这次合作实现了两种不同技术的成功融合，这注定将在软件和硬件行业带来主导地位。


    尽管 Ubuntu 在与一些领先的计算机制造商建立成功合作方面非常激进，但 Ubuntu 的使用并不局限于特定的计算机系统。这意味着 Ubuntu 能够在便携式系统、作为工作站或服务器的台式电脑上运行和使用，而无需担心
    Ubuntu 在不同平台下的可靠性和可用性。Ubuntu 系统这种在不同计算机设计上安装和执行的能力，使其成为许多计算机用户的基本选选。


    计算工业和互联网技术的最新发展，使得许多用户能够对 Ubuntu 以及修改和增强它的社区抱有更高的期望。这是因为自最初发布以来，Ubuntu 软件在过去几年中发生了巨大的变化。


    ## 使用 DVD 介质安装 Ubuntu 是否可行？


    `Canonical Limited` 在以 DVD 形式交付和发送 Ubuntu 软件方面并不十分积极。通常发送给潜在用户的介质是以 CD 格式交付的。由于我们不清楚的原因，这对于大多数软件开发人员来说一直是常态。


    然而，随着近期软件开发领域的最新进展和新技术的快速兴起，人们正寻求以简单的方式解决问题。在技术似乎非常昂贵且难以获取的偏远地区，通过其他方式获取东西可能正在被考虑。


    使用任何互联网连接下载和安装系统在窄带模式下进行时通常需要时间。由于宽带连接的费用高昂，人们别无选择，忍受长时间等待和频繁断开的负担。这就是为什么大多数用户经常请求寄送介质，而不是从网站获取软件的原因。


    `Canonical Limited Company` 对这一呼声做出了积极响应。随着发布的 Ubuntu 软件版本，它具备使用 DVD 介质安装 Ubuntu
    系统的能力。通过 DVD 介质，所有设置文件和 exe 文件都合并在一个单一的安装设置中。


    随着 Ubuntu 社区正在发生的最新发展，预计所有 CD 安装程序将很快被淘汰，DVD 介质中的安装程序将成为主流技术。


    # Google：搜索 Ubuntu 事实的最佳引擎


    当你需要在互联网上搜索信息时，你通常使用哪种搜索引擎？你倾向于使用广为人知的 `Google`，还是你对使用任何种搜索引擎搜索信息都不敏感？


    对于许多信息寻求者来说，使用有效的搜索引擎起着至关重要的作用。**使用有效的搜索引擎可以在探索过程中获得更多成功”这种说法是大多数信息寻求者所坚持的。


    在尝试搜索 Ubuntu 事实和信息时，许多 Ubuntu 用户倾向于使用 `Google` 搜索引擎而不是其他引擎。他们认为 `Google` 搜索引擎的以下特征使其更有效且更受广泛欢迎：


    a. 不仅是因为 `Google` 搜索引擎被广泛使用使其受到许多 Ubuntu 信息寻求者的青睐，而且很大程度上是因为通过使用简单的关键词，`Google`
    就能产生大量的选择。


    b. `Google` 被认为是 Ubuntu 制造者——`Canonical Limited Company` 的盟友，这两家巨头公司最近建立了合作。使用正确的搜索引擎可以更好地探索
    Ubuntu，而正确的搜索引擎就是 `Google`。


    c. `Google` 在在使用关键词时使用的机制较不严格。这意味着通过在搜索引擎中使用正确的关键词，会有更好的结果。


    这是许多 Ubuntu 用户认为在互联网上寻求正确信息时搜索引擎必要且重要的某些原因。


    # Ubuntu：基于 Linux 的操作系统


    许多不完全了解 Ubuntu 软件主要结构和架构的人将 Ubuntu 视为独立于 Linux 的操作系统。虽然在某些方面他们是正确的，但如果你仔细审视 Ubuntu
    软件的整个架构，你会发现它的大部分功能主要源自 Linux 和 `Debian GNU` 平台。


    Ubuntu 软件是一个社区开发的操作系统，非常兼容便携设备，甚至为服务器和工作站设计。Ubuntu 系统是一个软件包，适用于任何计算机平台，因为运行和使用计算机系统所需的所有应用程序都在其中——电子邮件应用程序、文字处理器、电子表格、演示软件等。


    由于 Ubuntu 是由“社区”开发的系统——这意味着任何人都有权开发和增强其功能——因此作为基于 Linux 的操作系统使用 Ubuntu 是免费的。整个安装文件可以从互联网任何地方下载，无需付费。

