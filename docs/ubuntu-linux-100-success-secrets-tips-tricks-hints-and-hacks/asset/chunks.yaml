    b. 如果你非常担心必须获取所有更新，那么你应该选择通过互联网安装 Ubuntu。当你从网站下载文件时，你可以随时随地立即获取所有必要的更新。


    这些简单快速的小贴士本质上是许多 Ubuntu 初次用户在考虑的终极指南。许多用户证实，通过遵循这些简单的小技巧，他们在安装和使用 Ubuntu 系统时没有出错。


    # 了解适用于桌面版 PC 的 Ubuntu 系统本质


    `Ubuntu` 桌面式 PC 版可能是 Ubuntu 社区发布的众多版本中受讨论最多的一个版本。这个版本将访问网页、阅读和查阅电子邮件、使用文字处理器和电子表格功能、修改和处理图像等功能全部整合在一个应用程序中——即
    Ubuntu 系统的桌面版。


    凭借最新的 `Ubuntu` 桌面式 PC 版，用户将可以在单张桌面版 CD 上享受到快速且简单的图形化安装程序。这个桌面版更棒的一点在于，当在你的 PC
    上首次启动操作系统时，你将面对一个非常清晰、整洁的桌面，上面没有任何额外的图标（这在任何操作系统安装中都是非常罕见的），并且主题是可自定义的。


    由于 `Ubuntu` 是一个开源系统，安装在 `Ubuntu` 桌面版上的完整办公软件包很可能也来自开源。然而，无论办公软件包取自何处，如文字处理器、电子表格和演示文稿在内的完整办公套件都存在于此
    `Ubuntu` 桌面版版本中。


    让 `Ubuntu` 桌面式 PC 版受到更多讨论的原因是，它包含了巨大的免费软件包库和存储器。你所做的只需点击并下载你想要在 PC 上使用的软件包即可。


    # XGL 平台上的 Ubuntu 系统


    工业领域软件和计算的快速发展为许多平台的演进铺平了道路。作为 `Canonical Limited` 积极响应这一不断变化的需求的一部分，计算行业突出的进展之一是
    `XGL` 平台的渐进式革命——这是一种系统化开发和设计的 `X server` 结构，旨在有效利用 `OpenGL` 环境来捕捉不断演变的显卡和视频卡的使用。


    开发 `Ubuntu` 软件的社区充分意识到利用 `OpenGL` 东西的重要性，因为它可以有效地为所有 `OpenGL` 和 `X server` 应用程序提供硬件加速支持，从而产生巨大的支持。`Canonical
    Limited` 一直积极利用这一点，并立即开发了 `Ubuntu-Linux XGL` 版本。


    `Linux/Ubuntu XGL` 开源系统一直积极利用这种技术，确保它能够捕捉动画的完美节奏，并结合最佳且有效的硬件加速。作为明确建立硬件与软件平台之间分离的一部分，`Linux/Ubuntu
    XGL` 在硬件和软件问题及争议上有明确的分离。突出 `Ubuntu XGL` 平台图形增强的一些特性包括：`3d` 或三维桌面环境为有效使用你的桌面提供了更多空间；应用程序的有效平铺允许用户更清晰地看到所有运行中的应用程序。


    # Firefox Ubuntu 捆绑：更安全的互联网


    ## 在 Ubuntu 中浏览


    `Ubuntu` 是完整的包提供的。当人们在 PC 上安装 `Ubuntu` 时，他们获得了每天需要的一切东西。对于工作，人们获得了 `OpenOffice`
    套件。这意味着人们获得了一个文字处理器、一个电子表格，甚至用于演示的软件。


    `Ubuntu` 还带有一个网络浏览器。这就是 `Firefox` 对 `Ubuntu` 用户有用之处。他们获得了一个安全的浏览器。更棒的是，`Firefox`
    还提供安全更新，因此安全性总能保障。`Firefox` 更新可以通过 `Ubuntu` 仓库接收。`Ubuntu` 用户也可以直接从 `Mozilla` 网站获取更新。


    对于 `Ubuntu` 用户来说还有更多。他们实际上可以尝试调整 `Ubuntu` 来加速 `Firefox`。许多人删除了 `Firefox` 扩展，因为它们有时会导致系统卡顿。某些扩展还存在安全漏洞。在
    `Ubuntu` 中对 `Firefox` 的配置可以进行更多微调。互联网上确实充满了关于如何在 `Ubuntu` 中增强 `Firefox` 的教程。


    既然许多人反正都会使用 `Firefox`，那么在浏览互联网方面，迁移到 `Ubuntu` 对他们来说并不完全陌生。计算机技术不太精通的人在他们的 PC 上使用
    `Ubuntu` 时会少一些犹豫。获取开源操作系统对于越来越多的人来说将是一个更有益的选择。


    这仅仅说明了开源和免费软件实际上也可以非常棒。例如，`Firefox` 与 `Ubuntu` 捆绑使得人们使用该操作系统变得更加安全。


    # Ubuntu Feisty Fawn 带来更简单、更便利的计算体验


    `Ubuntu` 是作为一个开源操作系统创建的。这意味着任何人都可以使用这个免费操作系统，用户可以获得来自 `Ubuntu` 官方和开源社区的支持。当安装
    `Ubuntu` 时，`Firefox` 网页浏览器、`OpenOffice` 和其他基本应用程序也被包含在内，以满足每个计算机用户的需求。


    虽然它的第一个 `Ubuntu` 版本早在 2004 年，但 `Ubuntu Feisty Fawn` 是 2007 年发布的。`Ubuntu Feisty
    Fawn` 通常以具有网络改进而闻。`Ubuntu Feisty Fawn` 还允许数据迁移。当人们从 `Windows` 迁移到 `Ubuntu Feisty
    Fawn` 时，他们能够非常简单方便地传输数据。它还为用户提供了更好的多媒体支持。最重要的是，`Ubuntu` 比之前的版本更加用户友好。


    由于 `Feisty Fawn` 提供了网络管理器，查找和连接有线及无线网络变得更加简单。只需点击一下，就可以看到所有可用网络。每个网络的强度甚至可以被看到。


    `Ubuntu Feisty` 还以桌面背景图像为特色。这意味着现有的 `Ubuntu` 用户在更新时获得了新的图像。新的 `Ubuntu` 用户也得到了改进版的
    `Ubuntu`。


    在 `Ubuntu Feisty` 中添加新应用程序也变得更加简单。使用 `Ubuntu Feisty` 的趣味部分是它提供的新游戏。例如，`Chess`（国际象棋）和
    `Sudoku`（数独）现在被包含在内。此外用户会非常感谢改进后的 `Help Center`（帮助中心）。它现在有一个更方便、易用的界面。它甚至有一个更时尚的外观。


    # 吸引用户使用 Ubuntu Gutsy 的新功能


    随着每次 `Ubuntu` 的更新，用户总会有新功能。无疑，每个版本都进行了改进和增强。作为一个开源操作系统，社区一直致力于修复漏洞并不断改进其功能。


    例如，`Ubuntu Gutsy` 为桌面带来了新的面貌。通过 `Compiz Fusion`，`3D` 桌面效果成为可能。当然，只要硬件允许这种能力，这就是可能的。对于那些拥有旧电脑的人来说，也不必担心，因为
    `Ubuntu Gutsy` 可以自动判断系统是否有能力运行这些效果。如果计算机配置不足，`3D` 效果就不会激活。


