- fmt: '

    Desktop search is also made easier in Ubuntu Gutsy. With the deskbar applet, accessing
    the most commonly used data is very easy and convenient. Documents can easily
    be searched and found. Even bookmarks are easily accessed.


    For computers that have more than one user, user switching has also become easier.
    People don''t have to keep on input ID and passwords every time they have to switch.
    This saves time for people who are in a hurry.


    There''s also a plugin finder in Ubuntu Gutsy so searching for `Firefox` plugins
    can easily done and they can be installed to `86` the browser. This enhances the
    computing experience for Internet users.


    What''s more is that printers are automatically setup with Ubuntu Gutsy. Using
    this operating system is really gaining convenience on the part of the users.


    # Ubuntu Performance: Improved and Enhanced Always!


    Ubuntu is generally packed with everything anyone would need for everyday computer
    use or even network and server use. Once one installs Ubuntu or he gets a computer
    with pre installed Ubuntu, he naturally has everything there. He would have a
    web browser through `Firefox`. He would have a word processor and other office
    needs through the `OpenOffice` suite packaged with the Ubuntu operating system.


    What''s good about using Ubuntu is that it regularly re leases updates. This means
    that Ubuntu performance is always improved every so often. Being an open source
    operating system, many problems are usually solved by the next release.


    On the user''s part, one can also tweak Ubuntu to enhance its performance. For
    example, one could manually free up his PC''s `RAM` to make it faster. By disabling
    several elements that are not useful to him, a user can actually free up space
    and speed up his PC. He has to make sure that he is only turning off things that
    are not essential in running his PC though.


    For this purpose, there are several tutorials in the Internet. A newbie can actually
    search for them to be guided accord ing. Lists of the services that are safe to
    turn off are even provided too.


    Even a simple adjustment of the cursor speed can enhance the performance of Ubuntu
    for individual users. Enhancements can really be simple to more complicated ones.
    The good thing about Ubuntu is that it is customizable so users can do what they
    think will enhance their computing experience using Ubuntu.


    # Great Possibilities with Ubuntu TV in Mythbuntu


    The use of computers today is not just for work or school stuff. For most people,
    using their computers has become a way of life. They get everything through the
    internet while they do everything else on the same computer.


    This means that computers have become the source of in formation and entertainment.
    Multimedia use in computers is certainly the trend in this generation. It''s not
    a wonder that Ubuntu would have a derivative such as the `Mythbuntu` to cater
    to this need.


    The emphasis of this operating system is really on multi media. With `Ubuntu TV`,
    users can turn their computers into home theaters. People can actually get all
    the information, news and entertainment without leaving their computers. They
    will no longer need a TV because their computers now become their TV.


    In fact, with `Ubuntu TV` computers are more than just a TV. For instance, their
    computers become capable of completely skipping commercials automatically. Computers
    are now capable of grabbing information such as TV show programming. Ubuntu users
    can record TV shows in their PCs. And what''s more is they can actually record
    multiple shows at one time since Ubuntu TV can support multiple tuner cards.


    Aside from that one can schedule the recording of TV shows. The operating system
    also provides the image viewer application. And like `CD/DVD` burner software,
    audio ripping and recording is also possible.


    Installing `Mythbuntu` would surely be a treat for people who would love to have
    such capabilities. Viewing TV shows and listening to music have not only been
    made a possibility but recording them and making backups can be done as well.
    And only one machine will be doing this, the computer.


    # Ubuntu Eee: Easy, Convenient and More!


    `Ubuntu Eee` is the operating system used in the `Asus Eee PC`. Well, the `Eee
    PC` was first designed to be an innovative laptop. This makes the `Ubuntu Eee`
    a perfect complement to that. `Ubuntu Eee` brings to the `Eee PC` a unique interface
    and a new look.


    What `Ubuntu Eee` does is it gives `Eee PC` users an easy cess to everything they
    need. When users need an application, he can easily click on the icon and he''ll
    be ready to start computing away. This means users won''t have to go search for
    their applic tions in menus.


    What''s even good about `Ubuntu Eee` is that it includes `Firefox`. Users immediately
    get a web browser that''s safer than others. To even enhance web experience further,
    users are able to download free add-ons and extensions.


    `Ubuntu Eee` even includes the `OpenOffice` suite. This means that `Ubuntu Eee`
    users will be able to work always wher ever they are. As long as they have their
    `Eee PC`, working is always possible. Users benefit in using `OpenOffice` too
    since it is compatible with most of the other software.


    Using `Ubuntu Eee` in `Eee PC` also allows users to customize the look of their
    laptop. That''s because various themes are installed with `Ubuntu Eee`. Functionalities
    can be customized as well. For instance, cursors can be slowed down. If preferred,
    effects can even be activated too.


    Just like using `Windows`, it''s easy to remove the programs that users don''t
    need. Users may cleanup the menus as well.


    # Ubuntu Games: Also Available and Fun for All!


    Yes, Ubuntu also allows PC games. People need not worry about not being able to
    play games in their computers. In fact, there are so many games available for
    Ubuntu. Users will not be left behind when it comes to having entertainment on
    the go.


    Many of the games are packaged and installed together with Ubuntu. That''s why
    many are able to take advantage of them. Other Ubuntu games can also be installed
    independently. Ubuntu users can go into races, wars and even battle word games
    and puzzles anytime they want. If they are into ghost games, they will not be
    disappointed either. Even people who have children can benefit from using Ubuntu.


    Ubuntu really provides to almost every whim of the users. Since people have been
    used to games, Ubuntu has made it a point to provide it. And aside from that,
    many games have been developed for Ubuntu. Users can actually search for more
    games all over the Internet if they feel they want more games other the native
    Ubuntu games.


    With Ubuntu pre-installed in computer brands like `Dell` having games is really
    very essential. Ubuntu really has been able to provide what people need. Ubuntu
    does not only give tionality in every computer. It also provides entertainment
    and even excitement.


    People playing racing games, for example, would enjoy the thrill that such games
    give them. Puzzle and board games would provide the challenge to many people who
    love it. And again, educational games would definitely benefit the children who
    are using Ubuntu PCs.


    # What Comes with Ubuntu Hardy Release


    Ubuntu aims to have a usable and accessible operating system in the market. It
    even emphasizes on internationalization in order to have more people use Ubuntu.
    In its aim to have a better operating system for its users, Ubuntu releases updates
    from time to time.


    New versions of the operating system are generally released every six months.
    Such versions would receive eighteen months of support. Long Term Support or LTS
    releases are released every two years though. It then receives support for three
    years and five years on desktop and servers respectively.


    The Ubuntu Hardy release is one of the Long Term Sup port releases of Ubuntu.
    As expected, with the Ubuntu Hardy release comes many new applications and several
    system im provements.

