    `Firefox` 版本类似。


    # 新 Ubuntu 中的更新


    新 Ubuntu 已发布 Canonical 的最新版本 `8.10`，被称为 Linux 发行版中的“Intrepid Ibex”。它于 2008 年 10
    月 30 日发布，维护到 2010 年。令人兴奋的新功能和最新的增强提供了移动数字生活的需求。它有两个不同的版本适用于你的需求。


    `服务器版` 合并了对虚拟化的支持，并完全支持 `Java` 栈，以及针对每个用户的目录加密支持。而在`桌面版`中，标准安装中包含了无线 `3G` 支持，以及一个允许用户在不影响安全的情况下共享计算机的访客账户。`服务器版`和`桌面版`每六个月发布一次，并提供长达
    18 个月的支持。


    `Ubuntu 8.10` 要求最小 `256 MB` 内存。你只需要一张空白 `CD` 加上兼容 `AMD` 的计算机。下载开始时，你将收到有关如何创建和使用你的
    `Ubuntu CD` 的说明。在安装 `Live CD` 模式时，不会显示硬盘。如果你低于最小内存要求，安装过程将耗长时间。这可能导致系统运行性能不足。


    你也可以通过在线购买获取 `Ubuntu 8.10` 的 `CD` 和 `DVD`，或者通过 `Shipit` 申请（免费的）。此外，对于在 `Ubuntu
    8.10` 上运行的安全邮件，主存储现在已用于病毒过滤和垃圾邮件检测。你可以确保在你的计算机上安装它是安全的，并且你可以享受最升级版本的 Ubuntu。


    # 使用 Ubuntu AMD64 的优势


    Ubuntu `AMD64` 与任何 Ubuntu 发行版并没有真正不同。主要在于 Ubuntu 的 `AMD64` 是为 64 位处理器设计的。无论你使用的是
    `Intel` 还是 `AMD` 处理器，如果你运行的是 64 位处理器，你就必须选择 `AMD64 Ubuntu`。


    优化操作系统速度是从使用 Ubuntu `AMD64` 中获得的主要优势。通常，64 位处理器的 `RAM` 容量为 `4 GB` 或更高。如果你想让这种
    `RAM` 性能最大化，那么你需要在你的系统中安装 `Ubuntu AMD64`。


    如果你的计算机 `RAM` 较小且你拥有 64 位处理器，使用 Ubuntu `AMD64` 不会为你的系统带来任何速度或性能提升。因此，最好是升级你的 `RAM`
    以充分利用 `Ubuntu AMD64` 的性能。


    如果你不想增加 `RAM` 容量，可以使用适用于 32 位处理器的 Ubuntu，系统性能将是一样的。


    在使用 `AMD64` 时你可能会遇到一些问题。由于该发行版专门为 64 位处理器设计，某些仅兼容 32 位应用程序可能无法在你的系统上运行。有一些方法可以解决这个问题，但你必须先配置系统才能解决兼容性问题。


    # 获取 Ubuntu 中文字体包支持


    ## 中文显示的支持


    Ubuntu 操作系统能够支持中文显示。这对于想在 Ubuntu 办公软件中编写中文字符的人来说非常有用。Ubuntu 支持多种国际语言，因此也可以在其上添加其他语言。


    如果你想浏览网页并希望页面显示中文，Ubuntu 中文字体包也非常方便。当你在 Ubuntu 上安装中文字体包时，有时可能会遇到一些显示问题，例如字体模糊。你可以做的是禁用
    16 像素以下中文的抗锯齿。


    ## 优化与安装


    为了优化 Ubuntu 的中文显示，你应该在系统中安装专有的中文字体包。台湾的开发者通常发布带有 `zh-tw` 后缀的繁体中文字体。如果你想要简体中文字体，你需要寻找后缀为
    `zh-cn` 的语言包。


    有关支持和其他配置细节，你可以访问 `Ubuntu Forum` 页面并查找有关语言配置的线程讨论。你也可以在 `Ubuntu Forum` 上发布你的提问或问题，开发者一定会为你提供帮助。你也可以访问
    `Ubuntu Chinese Wiki` 页面获取关于在 Ubuntu 系统上安装中文字体的详细说明和额外资源。


