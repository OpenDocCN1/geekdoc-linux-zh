- fmt: '

    b. If you are very concerned on having to get all the updates, then you should
    opt at having to install Ubuntu via the Internet. When you download the file from
    the website, you instantly acquire all the necessary updates from time to time.


    These easy and quick tips are essentially the ultimate guide that a lot of first
    time users of Ubuntu are taking into consideration. Many users affirm that by
    following these easy tips, they have not gone wrong in installing and using the
    Ubuntu system.


    # Understanding the Nature of the Ubuntu System for Desktop PC


    The `Ubuntu` for Desktop PC Edition is probably one of the most talked about revisions
    from among the many revisions made in the Ubuntu community. This revision has
    combined the ability to surf the web, read and browse your e-mail, utilize the
    word processor and spreadsheet features, modify and perform change on the image
    all rolled into one application - the Desktop Edition of the Ubuntu system.


    With the latest `Ubuntu` for Desktop PC Edition, the user will enjoy a quick and
    simple graphical installer files found on a single desktop edition CD. What is
    even good about this Desktop edition, during the fresh start of the operating
    system on your PC, you will be faced with a very clear and clean desktop with
    no add-on icons on it (which is very unusual in any OS installation) and a theme
    that is customizable.


    Since the `Ubuntu` is an open source system, it is likely that the complete office
    software package that is installed on the `Ubuntu` Desktop Edition comes from
    an open source, too. However, no matter where the office package has been taken,
    the complete package of Office such as Word Processors, Spread sheets, and Presentation
    are all present in this `Ubuntu` Desktop Edition version.


    The thing that made `Ubuntu` for Desktop PC Edition a lot more talked about is
    the fact that it contained a huge library and storage of software packages that
    are for free. All you need to do is to simply click and download the software
    package that you want to have on your PC.


    # The Ubuntu System in an XGL Platform


    The rapid development of the software and computing in industry paved the way
    for many platforms to evolve. As part of the `Canonical Limited` in positively
    responding to this evolving need. One of the prominent developments in the computing
    industry is the progressive revolution of the `XGL` platform-this is an `X server`
    structure that were systematically developed and designed in order to capture
    the use of the evolving graphic and video cards by effectively utilizing the `OpenGL`
    environment.


    The community that develops the `Ubuntu` software is fully aware of the importance
    of taking advantage in this `OpenGL` thing because it can create a massive support
    in effectively providing acceleration in the hardware of all `OpenGL` and `X server`
    applications. The `Canonical Limited` has been aggressive in taking advantage
    of this and has immediately developed the `Ubuntu-Linux XGL` version.


    The `Linux/Ubuntu XGL` open source system has been actively taking advantage on
    the this type of a technology by ensuring that it captures the perfect pitch for
    animation combined with the best and effective hardware acceleration. Part of
    clearly establishing the separation of the hardware and the software platforms,
    the `Linux/Ubuntu XGL` has a clear separation on the hardware and software problems
    and issues. Some of the features that highlight the graphics enhancements on the
    `Ubuntu XGL` platform are: `3d` or three dimensional desktop environment providing
    more space for the effective use of your desktop; the effective tiling of the
    application which allows the user to have a clearer picture on all opened application
    taking up the processes.


    # Firefox Ubuntu Bundle: Safer Internet


    ## Browsing in Ubuntu


    `Ubuntu` comes in a complete package. When people install `Ubuntu` in their PC
    they get everything they need every day. For work, people get the `OpenOffice`
    suite. This means that one gets a word processor, a spreadsheet and even software
    for presentations.


    `Ubuntu` also comes with a web browser. This is when `Firefox` becomes useful
    to `Ubuntu` users. They are provided with a secure browser. What''s even better
    is that security updates are also provided by `Firefox` so security is always
    taken care of. `Firefox` updates can be received through the `Ubuntu` repository.
    `Ubuntu` users can also get the updates directly from the `Mozilla` website.


    And there''s even more for `Ubuntu` users. They can actually try to tweak `Ubuntu`
    to speed up `Firefox`. Many people remove `Firefox` extensions since they can
    cause a lag in the system at times. Some extensions also have some security leaks.
    More tweaks can be done on the configuration of `Firefox` in `Ubuntu`. The Internet
    is surely full of tutorials on how to enhance `Firefox` in `Ubuntu`.


    Since many people use `Firefox` anyway, migrating to `Ubuntu` would not be entirely
    new to them when it comes to browsing the Internet. Less computer savvy people
    will be less hesitant to use `Ubuntu` in their PCs. Getting the open source operating
    system would be a more beneficial option for more and more people.


    This only goes to show that open source and free software can actually be great
    as well. `Firefox`, for example, being bundled with `Ubuntu` makes it safer for
    people to use this operating system.


    # Ubuntu Feisty Fawn for an Easier and a More Convenient Computing Experience


    `Ubuntu` has been created as an open source operating system. This means that
    anyone can use the free operating system and users are provided support both officially
    by `Ubuntu` and the open source community. When `Ubuntu` is installed `Firefox`
    web browser, `OpenOffice` and other essential applications are also included to
    complete the requirements of every computer user.


    While its first `Ubuntu` release was way back in 2004, the `Ubuntu Feisty Fawn`
    was released in 2007. `Ubuntu Feisty Fawn` typically is known for having network
    improvements. The `Ubuntu Feisty Fawn` also allowed data migration. When people
    migrated from `Windows` to `Ubuntu Feisty Fawn`, they were able to transfer data
    quite easily and conveniently. It also provides a better multimedia support to
    its users. Most of all, `Ubuntu` became more user-friendly than its predecessors.


    Because of the network manager provided in `Ubuntu Feisty Fawn`, finding and connecting
    to wired and wireless networks became easier. In just one click, one can already
    see all the available networks. Each of the network''s strength can even be seen.


    `Ubuntu Feisty` also featured desktop background images. This meant that existing
    `Ubuntu` users got fresh images when they updated. New `Ubuntu` users got the
    improved version of `Ubuntu` too.


    Adding new applications has also been made easier in `Ubuntu Feisty`. The fun
    part of using `Ubuntu Feisty` is the new games it offers. `Chess` and `Sudoku`,
    for example, are now included. And then users would really appreciate the improved
    `Help Center`. It now has a more convenient and easy to use interface. It even
    has a more stylish look.


    # New Features That Attract Users to Ubuntu Gutsy


    With every `Ubuntu` update, there are always new features for its users. Surely,
    improvements and enhancements are made in each as well. Being an open source operating
    system, communities are there to work on resolving bugs and improving its features
    always.


    `Ubuntu Gutsy`, for example, brings a new look to the desktop. With `Compiz Fusion`,
    `3D` desktop effects are made possible. This is, of course, possible as long as
    the hardware permits such capability. For those who have older computers, there''s
    also nothing to worry since `Ubuntu Gutsy` can automatically tell whether the
    system has the capacity to run the effects or not. If the computer is not equipped
    sufficiently, the `3D` effects are not activated. Of course, if users don''t want
    them such feature can easily be disabled. And in the same manner, other desktop
    effects can also be activated.

