    # What are the advantages of using sudo on Ubuntu?


    There are various benefits in leaving root logins disabled by default. First,
    the Ubuntu installer has fewer questions to ask. The users don''t have to remember
    the root password, which can likely be forgotten along the way.


    Moreover, the user will be asked for a password in cases of major changes. This
    will make the administrator think twice before making anything. `sudo` on Ubuntu
    also adds a log entry of the commands. If an administrator has done some mistakes,
    he will be able to go back and see what commands have run. This is also very useful
    in auditing.


    If someone were trying to enter into the box, he would have to know the account
    named `root`. Since he doesn''t know the usernames of the other users and the
    root account password is locked, he cannot enter.


    These are just a few of the benefits of using `sudo` on Ubuntu aside from the
    fact that it allows easy transfer for admin rights for a short or long time.


    # How to Upgrade Ubuntu Feisty to Gutsy?


    Ubuntu Gutsy is one of the latest major releases of the Linux distro. Like any
    other Linux distributions, you can easily upgrade your Ubuntu Fiesty to Gutsy
    even if it is released in beta.


    Ubuntu Gutsy has the following features, which might push you to upgrade your
    Ubuntu Fiesty. It has built-in support for cool graphics effects and has display
    configuration utility that supports multiple monitors. It also has built-in desktop
    search, better printing support with a PDF printer. It has fast user switching
    that is similar to Windows.


    ## Process of Upgrading


    1. First, use the combined keys `Alt+F2` key to be able to bring up the Run Application
    dialog. Then, you enter the following command:

    ```

    gksu "update-manager -c"

    ```


    2. After this, you will know that you are on the right track if you see "New distribution
    release ''7.10'' is available" and an Upgrade button. Click on the Upgrade button.


    3. You will be able to see many different dialogs asking you to confirm that you
    really want to install and if you accept the release notes. All you have to do
    is click through all of them until you finally see the upgrading dialog.


    4. You will be asked if you want to start to upgrade. Downloading and installing
    all the updates will then start but you will soon discover that this would take
    a long time.


    5. Next, you will be asked to remove all obsolete packages and shall be given
    a list of packages to delete. If you prefer, you can remove all the items or you
    can just skip the step and clean them later.


    6. The last step is to reboot your computer. Upon restarting, you can open the
    Systems Monitor in the administration tools section and see Release 7.10 or Ubuntu
    Gutsy. If you see this, then you know that you have successfully upgraded your
    Ubuntu.


    # Ubuntu Edgy Eft: Enhancements for Desktop and Server Versions


    Ubuntu Edgy Eft or Ubuntu 6.10 is the fifth release by Linux and was released
    on October 26, 2006. If you are one of the fans of Ubuntu, you can avail of this
    release on both desktop and server versions.


    ## Why Choose Ubuntu Edgy Eft?


    It is said that this release provides a cleaner and sharper design. It also has
    new and enhanced desktop applications and advances in security. Moreover, it has
    significantly faster boot-up times and leading edge free software programs.


    ## Desktop Enhancements under Ubuntu Edgy Eft


    The desktop version under this release has a list of enhancements which makes
    it flexible and more user-friendly. The enhancements include an easy-to-use note-taking
    tool and a mono-powered photo management program. The latter would enable users
    for tagging, photo editing and automatic uploading to online photo sites such
    as `Flickr`. It also has `GNOME 2.16`. This means that there are general improvements
    and new features such as enhanced power management.


    The desktop version has also a replacement startup manager that provides a cleaner
    design, more eye-catching effects and faster booting time. It has proactive security
    features, which prevents the occurrence of common security vulnerabilities.


    ## Ubuntu Server Edition Enhancements


    The Ubuntu server edition is said to make the deployment of Ubuntu in common Linux
    server roles as a web or file server. It also includes a pre-release of the upcoming
    Linux Terminal Server Project, which offers thin clients with lower total cost
    of ownership, simple installation and easier maintenance as compared to traditional
    office desktop deployments. Since all the data are stored on the server, administrators
    decrease the cost of updating individual workstations.


    # Should You Buy the Book "Ubuntu Unleashed"?


    There are many books available online on the subject of Ubuntu. However, `Ubuntu
    Unleashed` written by Andrew and Paul Hudson is considered to have the most detailed
    technical coverage.


    ## What is it all about?


    It is said that this book has everything you need to know about Ubuntu. It even
    includes information on using Ubuntu as a desktop, server, web host, programming
    tool and others.


    The book has 35 chapters and an appendix of online resources, which assures the
    reader that it is a well-researched book. It is not an easy read for beginners
    nor can it be read for a short period of time. You need time and concentration
    to be able to absorb what is inside.


    The book has several broad topics covering Installation and Configuration, System
    Administration, Ubuntu As A Server, Programming Linux and Ubuntu Housekeeping.
    Each topic contains detailed instructions for various desktops and server tasks.


    ## Reviews from Readers


    There are various reactions to `Ubuntu Unleashed`. There are those who like the
    book because there are sections that are widely useful for their work such as
    backing up and restoring machines, using `Apache` to host a website and others.
    One of the positive comments about this book is that it is full of knowledge that
    is easily accessible. Further, looking for topics are easy because it is well
    indexed and organized.


    On the opposite side, some users find `Ubuntu Unleashed` too technical for their
    taste. They said that it has a very demanding writing style, which can become
    boring for newbies. These users would have preferred it be written in a more conversational
    manner.


    `Ubuntu Unleashed` is definitely a must-have for people who are technically proficient
    with Ubuntu.


    # Ubuntu Feisty: Features and Installation


    Ubuntu 7.04 or Feisty Fawn was considered to be a success in the Linux history.
    It was said that this version is focused on the features that interact with the
    end-user. However, it is also popular among developers.


    ## What are the Features under Ubuntu Feisty Fawn?


    This version of Ubuntu has a number of new features such as Windows migration
    tool and easier multimedia. It also has plug and play network sharing ad the Linux
    `2.6.2.0` kernel and `Gnome 2.18`.


    ## System Installation Requirements


    There are hardware specifications to run Ubuntu Feisty Fawn. However, you might
    be able to run it with lower specifications but performance can become poor. There
    are minimum requirements, which can allow a non-graphical server to run well.
    But if you want to run a graphical installation, then the recommended minimum
    requirements should be used.


    If you are installing a desktop system, this shall typically be used for personal
    computing tasks and has a graphical user interface. The minimum requirements would
    be the following: 300 MHz x86 processor, 64 MB of system memory (RAM), at least
    2GB of disk space, CD-ROM drive and VGA graphics card capable of 640x480 resolution.


    Meanwhile the recommended minimum requirements are the following: 500 MHz x86
    processor, 192 MB of system memory (RAM), 8 GB of disk space, graphics card capable
    of 1024x768 resolution, sound card and a network of Internet connection.


    Another suggestion would be to use the 64-bit installation.

