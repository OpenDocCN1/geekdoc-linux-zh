  trans: '

    在 Ubuntu 中，将文档打印为 PDF 格式是一件简单的事情。你可以采取许多步骤，而且所有这些步骤中最好的一点是它们通用的——这意味着它们可以在任何版本的
    Ubuntu 系统中被遵循。提醒一下，虽然为了执行此操作不需要符合任何特定的系统要求，但你仍然需要满足安装 Ubuntu 系统的最低要求，当然，还包括打印机的要求。


    # 在世界万维网 (WWW) 上探索 Ubuntu 的独特特性


    万维网众周知是可以搜索和定位关于几乎任何事物和一切事情的海量且相关信息的地方。Ubuntu 作为一个广为人知并使用的操作系统，它有自己深奥且保存完好的的秘密，等待着通过万维网（通常称为互联网）进行探索。


    Ubuntu 系统的许多秘密（几乎所有的版本和修订）都可以在网上进行探索和发现。在使用万维网（`www`）作为探索未知的手段时，有几点基本内容需要记住：


    - 首先，你需要确保你理解了如何在网络上搜索信息时使用关键词。这些关键词是核心搜索文本，当搜索引擎开始定位你正在搜索的内容时，它们将帮助你缩小搜索结果。

    - 其次，你需要知道在搜索信息时如何使用特定的关键词。正确的关键词可以帮助你消除所有不必要的搜索结果，避免在阅读和浏览所有页面结果上浪费时间。

    - 最后，当你对正在搜索的内容感到迷茫时，你需要知道如何混合和匹配术语。术语的混合和匹配允许你发现更多选项，本质上给了你发现更多、更好的机会。


    这些基本指南确实可以帮助任何用户在探索 WWW 所能提供的内容时击中目标。


    # 安装 Ubuntu 的完美技巧


    如果你是 Ubuntu 的新用户并习惯了使用 Windows 环境，你可能会发现在 PC 上安装 Ubuntu 软件的过程相当反常且困难。尽管如此，Ubuntu
    涉及的安装过程并没有看起来那么困难。事实上，当你决定安装 Ubuntu 软件时，只有几点需要记住。以下是其中一些：


    a. 考虑你是否真的想将 Ubuntu 作为你的操作系统，或者你只想在它上开启一段小旅程。通过决定是否要在你的系统中使用它，那么删除和移除你 PC 上现有的操作系统将会变得容易。

    b. 检查可以下载和安装完整版 Ubuntu 系统的网站。在点击下载和安装之前，确保你已经仔细分析了 Ubuntu 操作系统的系统要求。确保你的系统符合最低要求。

    c. 你可以选择通过网站或 Live CD 安装 Ubuntu 软件。无论你选择从 Live CD 还是网站安装操作系统，你仍然需要考虑所有的预防措施，例如是否接受定期更新。


    如果你最终决定在你的系统中安装和使用 Ubuntu 软件，这些小小的提醒可以帮助你节省大量的资源和时间。


    # Ubuntu 系统的强大特性


    Ubuntu 是一个广为人知的免费开源软件。作为一种开源软件，资助其生存的 Canonical Limited 公司完全意识到 Ubuntu 结构、语义和架构可能发生的持续演变和修改。这正是为什么
    Ubuntu 作为一个操作系统的通用特性一直是备受期待的原因。


    Ubuntu 无论其快速变化变得多么动态，在对其核心特性的标准化和通用化方面仍然保持开放。幸运的是，许多专家已经同意以下特性在每个 Ubuntu 平台上都是可见接受的：


    a. **易用性 (Usability)**。Ubuntu 软件的核心特征之一是它对所有类型的用户都可用。这种易用性可以从安装方式到所使用的命令语法被明显地感受到和看到。

    b. **通用性 (Universality)**。这一特性看起来可能与开源试图推行的内容有些讽刺，但话虽如此，即使 Ubuntu 可以被自由修改、研究和更改，它的核心本质仍然保持完整，因为对其进行的任何修改都应该符合
    Canonical 委员会设定的通用指南。

    c. **可访问性 (Accessibility)**。Ubuntu 免费且开源，这使其用户能够轻松并可能访问它。这是 Ubuntu 的核心实质之一，至今未被触动。


    所有这些被每个 Ubuntu 平台核心的特性清楚地表明，无论开源的程度如何，都总有一种方法创建一个标准化的特性。


    # 请求 Ubuntu CD 的快速步骤


    Ubuntu 提供免费申请服务。作为用户，你可以索要一张预装了 Live Updates 的 CD，且显然不需要任何其他费用。最好的是，Ubuntu 的制作人员了一个专门为请求
    CD 设计的网站。通过访问主页 `www.shipit.ubuntu.com` 即可进入该网站。


    如果你已经准备好请求一个 Ubuntu CD 供你使用，以下快速步骤可以帮助你完成：


    a. 最初，你需要做的是基本上评估你对操作系统的需求。你是否需要一个在图形增强和硬件加速方面非常有用的操作系统？或者你是否需要一个可以尝试和使用的普通操作系统？在评估了你的需求后，你就可以进入下一个阶段。

    b. 下一阶段是进入主站 `www.shipit.ubuntu.com`。从该网站，你将被立即引导至可以在此处请求最新版本 Ubuntu 的页面，无论是桌面版还是服务器版。

    c. 确保你在必填字段中提供所有信息。你在必填字段中填写的信息将作为你的验证。所有信息将存入 Ubuntu 数据库并供制作人员参考。


    但请记住，如果你急切需要 Ubuntu CD，你将需要另一种方式（意味着从网站下载），因为 CD 的交付通常需要 2-3 个月。


    # Dapper Drake 又称 Ubuntu 6.06 LTS


    每年，Ubuntu 监管委员会（Canonical Limited）都会确保发布两个升级版本的 Ubuntu 系统。像许多其他软件开发者一样，Canonical
    Limited 使用有一套特定的系统来命名其最新的修订版本。


    通常，最新的修订版本使用发布时的月份和年份命名，并对应版本号。然而，当一个 Ubuntu 系统延迟发布时，会进行相应的更改。命名的一部分是为在市场上发布的每个最新版本给出一个代号，使其与其他版本独特地隔离开。一个经典的例子就是
    Dapper Drake —— 即 Ubuntu `6.06`。


    '
- fmt: '

    Dapper Drake is the 4th Ubuntu release of the Canonical Limited. This is also
    the first LTS or the Long Term Support release among all the Ubuntu versions.
    Part of the LTS program, the support given to Dapper Drake is set to end sometime
    in June 2009 (for the desktop) while two years longer is given to servers which
    support terminates on June 2011.


    One of the highlighted features of the Dapper Drake is the merging of the Live
    and the Installation CD in one single compact disc.


    # Get some News and Updates via the UbuntuForums


    Have you been wondering how experts in Information Technology and Ubuntu wizards
    were able to acquire the knowledge that they have? Apart from books and seminars,
    where do you think are they getting all the information that they know?


    Well, you may be surprised to know that there is one common denominator that these
    experts in Ubuntu have - and that is their active and vigorous use of the forum
    sites in the Internet. Yes, forum sites are very instrumental in the intellectual
    development of these experts.


    Forum sites are specially designed websites that attempt to explore the details
    of every point of discussion that is brought up. All people who usually cluster
    in the forum site share one common interest. That sort of interest is being explored
    in detail in such a way that even the smallest detail about the topic being discussed
    is dissected and studied. This manner of discussion in the forum site allows every
    participant to fully grasp and understand the details of the topic being debated
    and discussed.


    Majority of the forum sites usually contain as part of the discussion the latest
    and current events that impact the Ubuntu software. Usually, these forum sites
    enable every participant to be fully aware of the latest developments that circulate
    around not only the Ubuntu software but also the whole IT industry that brings
    indirect impact to Ubuntu.


    Many Ubuntu users rely greatly on forum sites because they know that these forum
    sites are the right and proper avenue to learn new things at a very practical
    way.


    # Hot Tips on how to upgrade your Ubuntu Software


    The latest release that was made by the Ubuntu makers (Canonical Limited Company)
    was held on October 30, 2008. The latest release code `Ubuntu 8.10` made many
    Ubuntu users think about upgrading their current Ubuntu software into the latest.
    However, before enacting on upgrading to the latest version, read through the
    following tips and reminders:


    a. It is standard that if you have the `Ubuntu 8.04 LTS` version, you will not
    be prompted neither be offered automatically to upgrade to `Ubuntu 8.10`. The
    reason behind this lies on the fact that `Ubuntu 8.10` belongs to the regular
    release while the `8.04 LTS` has a long term support.


    b. Should you wish to upgrade to the `8.10` version, then you will need to do
    it manually by going to the Ubuntu website. From there, you will be encountering
    a box where it gives you the option to upgrade your current version into the latest
    one.


    c. If you have the `8.04 LTS` version, make sure that all updates have been applied
    prior to upgrading into the latest version. This will allow any similar updates
    (between the `8.04` and `8.10`) to be reconciled during the upgrade process.


    d. Since `Ubuntu 8.10` is a newly released version, it is expected that some issues
    may arise during the use of the OS. It is best suggested that prior to engaging
    in the upgrade process, you seriously read the release notes that were released
    together with the `Ubuntu 8.10` updates.


    These tips and reminders in upgrading your Ubuntu software will best guide any
    Ubuntu user in taking the right direction and making the right decisions even
    before you actually fail and regret the whole idea of upgrading.


    # Comprehensive Exploration of the Ubuntu Org


    The Ubuntu system is a huge combination of many dynamic structures and architectures
    used by many software developers. Every platform used by the Ubuntu system forms
    part of the whole organization of the system.


    Many software experts and novices have been extremely intrigued by the way the
    organization of Ubuntu was made. Various explorations on the framework and structure
    of the Ubuntu were made and significantly the following have resulted to these
    explorations:


    a. The main engine of the Ubuntu system is composed of dynamic library links similarly
    found in many other operating systems that were developed. Unlike many other operating
    systems, the main engine of the Ubuntu system is capable of being modified by
    any enthusiast.


    b. All parts of the Ubuntu structure are part of the open source code and are
    open to any possible modifications and changes. Although the duplication of these
    parts is capable of being made, the way to do it is almost impossible due to the
    many restrictions on codes. This is the organization of Ubuntu that made it very
    distinct compared to other operating systems.


    c. The use of modern code scripting is also allowed in any of the engine parts.
    The way the Ubuntu was structured and organized made it easy for any user to easily
    get into the picture of modifying and enhancing the code.


    The organization of the system plays an important role in the development of the
    software. The system organization dictates how easy or difficult it will be for
    any developer to perform modification and changes on it.


    # The 4 Great benefits of the Ubuntu for Servers


    The Ubuntu for Servers is one of the great milestones that the Canonical Limited
    has ever produced over the last few years of developing and enhancing the Ubuntu
    system. The Ubuntu for Server was constructed in such a way that its framework
    is made easier and lesser complicated. This attempt of the Ubuntu makers has been
    very successful in cutting the maintenance cost of the system.


    More than cutting the expenses being spent in maintaining the software via the
    Ubuntu for Servers, the following benefits have been manifested:


    a. There is an improved and easy way to install and set up the system. The startup
    files and installation files have all been placed together in a single directory
    location making it easier to perform the installation process.


    b. Features that were designed to perform a function are considerably manifested.
    With the Ubuntu Server Edition, what you basically see on it is what you get.
    All the business features that you see are capable of being run and used as designed.


    c. There is an easy way to upgrade should the need arises. One of the hardest
    if not the most difficult thing about software is the method of upgrading it.
    With the Ubuntu for Servers, the method to upgrade is made a lot simpler and easier.


    d. Simplicity to obtain any possible update. With the new Ubuntu for Servers,
    updates come when you connect to the Internet. Unlike with the other systems,
    you will need to get connected from time to time in order to acquire any updates.


    These benefits continue to grow and progress as the Ubuntu for Servers keep on
    being developed and enhanced by the community.


    # Installing Ubuntu the Painless and Straightforward Way


    For many first timer users of the Ubuntu system, they usually have this notion
    that installing the Ubuntu system is very painful and involves a lot of effort.
    However, contrary to this belief is that the installation process is very simple,
    effortless and less complicated.


    The guide to install the Ubuntu is clearly specified below:


    a. Prior to finally installing the Ubuntu software, make sure that check on the
    Internet for any useful tips that you can get on how you can easily and effectively
    install the software. These tips are very practical and useful.


    b. Remember that every Ubuntu revision may differ in installation process. This
    means that depending on the Ubuntu version that you have, your road to effectively
    install the software can vary.


    c. Never forget that there are specific files that you will need to download and
    install on your PC before you get to suc

