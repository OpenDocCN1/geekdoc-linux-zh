    如果你想在 Ubuntu 操作系统上安装企业级软件，那么寻找这些软件的最佳途径是通过 Ubuntu 软件产品目录。


    Ubuntu 支持的软件列在 Ubuntu 网站上。你可以在列表中找到应用程序，如果你决定在系统上使用它们，它们可以提供商业级支持。


    如果你想安装 Ubuntu 支持的软件，可以通过你操作系统的 `Add I Remove`（添加或删除程序）工具来执行此操作。建议 Ubuntu 的中级和基础用户使用
    `Add I Remove`（添加或删除程序）工具。


    如果你熟悉 Ubuntu 的高级命令系统，则可以使用 `apt-get` 命令。只有当你是 Ubuntu 的专家用户时，才应该执行此命令行操作。


    Ubuntu 支持许多应用程序。其中有数据保护应用程序，它们非常适合企业级数据安全。你还可以在 Ubuntu 上使用身份管理系统，例如 `Centrify
    DirectControl` 应用程序。


    对于你的数据库需求，可以使用 IBM 的 `DB2 Universal Database` 或用于企业级应用的 `MySQL` 产品。这些数据库管理系统在
    Ubuntu 上都完全支持。你也可以从这些应用程序的供应商处获得其部署的技术支持。


    `Firefox` 和 `Opera` 浏览器也受到 Ubuntu 的完全支持。你可以选择这些浏览器作为你的默认互联网应用程序。你还可以在 Ubuntu 上使用许多开源邮件客户端来满足企业通信需求。


    # 一种智能 Ubuntu 应用程序


    为你基于 Linux 的电脑寻找要安装的 Ubuntu 应用程序可能是一件趣事。Ubuntu 有很多非常棒的应用程序，而且其中大多数都很容易安装。例如，非常流行的
    `Ubuntu mobile` 是该软件的小版本，正迅速成为许多移动互联网设备的主流。


    这是一个针对非常令人兴奋的微型电脑平台的小型 Ubuntu 版本。它同样基于全球最流行的 Linux 发行版，这得益于许多 ODM 和 OEM 的移动互联网设备和硬件，一切几乎已准备好运行，并从根本上重新定义移动计算的面貌。


    `Mobile Ubuntu` 应用程序最重要的一点是它能够让用户完全访问全球信息网。除此之外，还有其他非常出色的功能证明了它与众不同。例如，它为用户提供了全
    Web 2.0 支持，以及带有 `Java` 和 `Adobe Flash` 自定义选项的 AJAX 保真度。


    还有令人印象深刻的媒体播放功能，能够让人充分享受最高质量的视频、音乐和其他媒体形式。当然，这些媒体与多种应用程序完全兼容，允许每一个人在所有设备上无缝工作。


    # 从备用 Ubuntu 下载站点获取新 Ubuntu 版本


    除了 Ubuntu 官方页面外，还有许多可以获取软件的 Ubuntu 下载站点。Ubuntu 操作系统的普及在多年来急剧增长，因此你有很多选择来获取它。


    如果你打算在官方网站下载 Ubuntu 软件包，你需要一个 CD 或 DVD 刻录机。这是因为 `Ubuntu Live CD` 软件包是一个 CD 镜像。你需要从
    CD-ROM 运行它以启动安装过程。


    一旦你在硬盘硬盘上保存了 `Ubuntu Live CD` 的 CD 镜像，你就必须将其刻录到另一张空白 CD 上。现在你可以在任何机器上使用这 安装光盘了。


    有时你也会遇到下载最新版本 Ubuntu 的问题。因为许多用户都会从 Ubuntu 下载任何新版本，有时会出现 Ubuntu 服务器无法满足需求的情况。


    这就是为什么在电脑上安装一个 torrent（比特流）客户端以在镜像 torrent 站点进行 Ubuntu 下载也很重要。这是一种更快的替代方案，而且对你来说也更方便。


    从 torrent 站点下载时，请确保在下载程序之前阅读了提供的文档。这样，你就能确保下载的是正确的 Ubuntu 版本。


    你也可以从 torrent 站点下载不同版本的 Ubuntu。这些文件可以在存档部分找到，并供你随时使用。


    # 在 Ubuntu 中倍似如家


    如果你想运行笔记本电脑并获得更快的启动速度，最好买一台带有 Ubuntu 软件的电脑。很快，你就会觉得在这个易于导航的操作系统里如如家一样。有些人实际上非常好奇，想了解更多关于
    Ubuntu 的信息。基本上，它是基于 `Linux` 和 `Debian Gnu` 的计算机操作系统，后者是一个非常流行的 Linux 发行版。这个名字源于祖鲁语，意为“人性”——这正描述了
    Ubuntu 的整个哲学。


    基本上，这种哲学是：你之所以成为你，是因为你周围的人——这些这些人代表了整个社区的积极方面。Ubuntu 成为一种非常流行的软件并让每个使用它的人都感到如自在的原因之一，是因为它的目标也符合人的预期。Ubuntu
    的目标还包括为普通用户提供一个更及时、更稳定的操作系统。


    此外，它在程序的易用性和易于安装的设置方面也有很强的侧重点。Ubuntu 操作系统一直被评为一种许多桌面系统使用的非常流行的 Linux 发行版。正因如此，它还占据了
    2007 年桌面 Linux 安装系列中约百分三十的份额。


    # 如何获取最新的 Ubuntu 新闻


    要获取最新的 Ubuntu 新闻，你可以订阅 Ubuntu 网站提供的馈送（feeds）。该网站有一个特定页面，你可以在那里找到新闻、信息以及 Ubuntu
    发行版的更新。


    只需点击 Ubuntu 新闻页面上的 `RSS Feed` 链接即可获取网站的更新。这对于获取 Ubuntu 开发者定期发布的补丁非常重要。

