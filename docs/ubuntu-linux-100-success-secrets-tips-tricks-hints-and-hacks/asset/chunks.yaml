    pertaining to how you will be registered and con tacted for any updates.


    Should you want to unsubscribe from the Ubuntu FR noN, there is an easy way to
    get out. All you need to do is visit the site once more and look for the option
    where you can unsub scribe from it. Again, the subscription is not mandatory so
    as the un-subscription process.


