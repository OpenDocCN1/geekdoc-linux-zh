    # Ubuntu 上安装 Firefox 3 的简单步骤


    `Firefox 3` 的 Ubuntu 安装程序更加简单直观。你只需要在 Ubuntu 主目录下输入一条终端命令，就可以准备好安装新的 `Firefox
    3` 了。


    终端命令行可以从任何 `Firefox 3` 测试版支持页面复制。这些页面提供了代码。复制提供的代码并将其输入到你的 Ubuntu 主目录中。


    在计算机上运行 `Firefox 3` 代码之前，强烈建议你备份之前的 `Firefox` 配置文件。你可以为之前的 `Firefox` 安装创建一个备份文件夹。这是为了保护你现有
