    经历过 UbuntuEee 演进和进步的用户对这款伟大的微型机器提供的功能感到非常满意。无论如何，谁不会拥有一个完全实用且高效的、能够处理大多数标准计算任务的“微型笔记本”呢？这些功能确实非常有吸引力。


    ### Petersen 在一书中讨论了 Ubuntu 8


    `Ubuntu 8` 或 `Handy Heron` 以其更强的健壮性、可靠性和稳定性而闻名。但对于那些想要获取更多关于 `Ubuntu 8` 信息的人，可以参考
    Richard Petersen 的书籍《Ubuntu 8 服务器管理与参考》（Ubuntu 8 Server Administration and Reference）。


    Petersen 的这本书主要设计作为 Ubuntu 服务器参考，涵盖了 Ubuntu 服务器及其支持的应用程序。书中还讨论了底层系统实现和配置文件的服务器工具。该书的重点在于管理员执行管理任务和关键服务器支持时必须掌握的内容。


    特别是，书中讨论的题题包括网络时间协议、软件管理、`Upstart` 服务管理、`AppArmor` 安全以及 `runlevels`。还检查了网络以及 `FrP`、`Key
    服务器`、`Samba Windows 共享`、`域名系统（DNS）`和`CPU 打印`。该书还仔细组织成五个部分：入门；可用服务；可访问的共享资源；开放网络支持和
    Shell。这样，读者吸收知识将变得更容易更快捷。


    本质上，书的第一部分集中在基础任务上，包括几个软件的安装，以及命令行界面和桌面的基本程序。第二部分允许读者分析互联网服务器，包括通过 `runlevels`
    使用 `Upstart` 运行服务的方式。


    同时，第三部分涵盖了在互联网或本地网络提供共享资源的服务器。第四部分讨论了提供网络支持的服务器，如 `DHCP` 服务器和 `Squid` 代理服务器。最后，最后部分对
    `shell commands` 进行了回顾，包括用于管理文件的命令。


    ### Ubuntu 带来的宏大体验


    #### 桌面上的 Compiz


    `Ubuntu Compiz` 为桌面管理器 `GNOME` 视觉效果。这些桌面效果默认已经是激活的。然而，用户仍然需要手动开启它们。`Ubuntu Compiz`
    展示的一些特殊桌面效果包括：半透明窗口；阴影效果；3D 桌面能力；动画和动态效果。这些效果无疑会让桌面更加动态和生动。


    然而，使用特定显卡的电脑用户可能会在桌面效果性能上遇到困难。可能导致的问题之一是一旦开启效果，电脑运行就会变慢。因此，寻找提供正确调优方法的指南是很有必要且非常有帮助的。通过这样做，可以避免桌面性能上任何可能的问题。更重要的是，用户可以根据自己的喜好定制桌面性能。


    接下来的讨论将提供 `Compiz` 安装和配置的预览：


    由于核心 `Compiz` 软件包已按默认安装，用户无需进行任何操作即可立即开始使用某些桌面设置。然而，为了充分利用“高级桌面效果设置”（Advanced
    Desktop Effects Settings）的功能，用户需要添加 `CCSM` 应用程序。这可以在 `Add/Remove` 应用程序中获取。


    随后，用户可以进入 `System`（系统），然后进入 `Preferences`（偏好），到达高级桌面效果设置应用程序。通过这种方式，用户可以自定义他们的桌面性能。


    实际上有很多可以激活或禁用的效果。因此，那些想要完全自定义桌面的用户可能会花费几个小时来探索这些调优和效果。


    #### Ubuntu 发布：已进入第九版本


    `Ubuntu` 现在被认为是全球最知名的 Linux 发行版之一。这个计算机操作系统在不断进步，因为它总是一个接一个地推出新版本。事实上，最新的 `Ubuntu`
    版本是在去年 10 月完成的。`Ubuntu` 创始人 Mark Shuttleworth 与他的团队最终发布了 `Ubuntu 8.10`，称为 `Intrepid
    Ibex`。


    通常，`Ubuntu` 遵循其六个月的发布周期。在开发阶段，一个 `Ubuntu` 版本通过其代号来识别标识。


    那么，人们对 `Intrepid Ibex` 有什么期待？


    本质上，`Intrepid Ibex` 增强了桌面扩展性和移动计算的功能，包括改进了互联网连接的灵活性。Shuttleworth 解释说，该版本的桌面提供在重新设计界面后再次作为中心点。Shuttleworth
    还补充说，他们的目标是通过获得新的性能水平，在制作过程中让最近的模型尽可能高效。


    此外，Shuttleworth 提到对 `Intrepid Ibex` 的特别关注是全方位的访问能力，无论用户位于何处都能连接到带宽。


    Shuttleworth 还指出，`8.10` 版本是他们的第九个 `Ubuntu` 版本，并加入了第一个 `Ubuntu` 版本发布的四周年庆典。Shuttleworth
    认为这一事件是他们巨大成功的标志。


    现在，Shuttleworth 和他的团队将在今年四月再次发布下一个版本的 `Ubuntu`，其标识为 `Ubuntu 8.04`，也称为 `Hardy Heron`。他向公众发布了公告，特别针对企业界的人士，关于他们的开放性以及为即将项目的成功做出贡献的渴望。


    ### 设置 Ubuntu Synaptic 的方法


    `synaptic` 软件包管理器基本上是包管理的高级应用，能够安装和卸载系统中的每一个包。它的界面是图形化的，类似于 `Add/Remove` 应用程序。然而，用户可以获得更多信息。这意味着
    `synaptic` 为用户提供了对系统整个包管理的绝对控制。


    但用户需要注意，操作 `Synaptic` 需要管理员权限。现在，要正式启动 `Synaptic`，用户应该在桌面菜单系统中选择以下路径：`System>Administration>Synaptic
    Package Manager`。


    `Synaptic` 屏幕将分为四个部分。左面板的两个部分显示软件包类别，而右面板的两个部分显示软件包。要设置软件包，用户只需选择类别，在文件中找到包名，然后右键点击名称并选择
    `Mark this package for installation`（标记此包以供安装）。


    当用户对自己的选择满意时，可以点击顶部按钮栏上的 `Apply`（应用）。`Synaptic` 将直接从在线仓库或 `Ubuntu` 安装 CD 下载并设置所需的包。


    下载 `Synaptic` 的另一种方法是点击 `Search`（搜索）按钮，在搜索文本字段输入包名或简短搜索词，然后点击 `Search` 按钮。这样做之后，`Synaptic`
    会立即呈现出一个简短的列表，用户可以在其中选择想要安装的应用程序。这种方法比第一种更方便，因为不需要寻找很长的应用程序列表。


