    # The Easiest Way to Installing Google Earth on Ubuntu


    Many Internet users would definitely want to use Google Earth on their Ubuntu.
    Google Earth on Ubuntu shows photo realistic buildings in more cities faster than
    ever. If you like navigating with Google Earth on Ubuntu, you can swoop from outer
    space to streets in just a few seconds. Google Earth on Ubuntu is one of the coolest
    creations on Internet if you like traveling and seeing various places online.


    ## Installing Google Earth on Ubuntu


    Installing Google Earth on Ubuntu cannot be done using a regular installer. A
    double click will definitely not work. There is no need to worry though. There
    are a few steps that you can follow to have Google Earth on your Ubuntu at no
    time.


    Initially, you must download Google Earth to your desk top and then go to `Applications
    > Accessories > Terminal`. Second, type in `sh GoogleEarthLinux.bin` and follow
    the on screen prompts to be able to finish your installation.


    After this, you will be able to see the Google Earth icon on your desktop and
    will give you the choice to launch it for the first time after installation.


    Lastly, Google Earth on Ubuntu should have been installed in the default location
    `"/usr/local/Google/Google-earth"`.


    Google Earth on Ubuntu is just one way of saying that Google is fully supporting
    Linux. It is easy to install by just following the above steps. These steps are
    the same with other installation of software on Ubuntu. Just use the `*.bin` extension
    and you will be able to install others properly too.


    # Ubuntu 3D: The Linux Way of Enticing More Users


    There are many users who are now being converted into using Ubuntu because of
    the newest upgrades in terms of user interface and form factor. One of these form
    factor is a consumer electronics product that fits the 3D user interface perfectly
    vis-a vis the traditional desktop experience. Unlike other systems, Linux is said
    to have no preconceived notions as to the functions a desktop should serve. Due
    to this clean slate, there is a possibility that Ubuntu 3D user interface shall
    be developed on other devices as well. The future is bright for the future upgrades
    of Ubuntu.


    ## How to Use the 3D Features in Ubuntu 7.10


    For the meantime, the cool 3D features can be used in Ubuntu 7.10. Before this
    version was released, it was difficult for a beginner to setup advanced 3D desktop
    effects because he has to do a lot of things first. He has to add new repositories
    to sources list, the `xorg.conf` file has to be edited manually and programs have
    to be manually set to start at login. A beginner would be turned off with so many
    things to do.


    With the release of Ubuntu 7.10, it has become easier. All he has to do is see
    if his video card can handle compositing. Then, he can click through the following:
    `System > Preferences > Appearance`. After that, he will be presented with a window
    where he will click "Visual Effects" and then click the radio button labeled "Extra".


    If you see that your windows become wobbly when moved around, that means that
    you have began to enable the Ubuntu 3D features.


    # How To Upgrade To Ubuntu Intrepid Ibex?


    The Ubuntu Intrepid Ibex released under the Linux operating system is one of the
    newest Ubuntu releases. It offers various improvements such as 3G wireless support,
    "guest" sessions, fully supported Java stack, an integral virtual machine builder
    and others. It is also claimed that Ubuntu Intrepid Ibex has security patches
    through 2011 for the desktop and 2013 for servers.


    A user who is interested to use this version is recommended to read the full release
    notes. He must also follow the proper procedures. Otherwise, he can download an
    installable live CD image.


    ## How to Upgrade to Ubuntu Intrepid Ibex


    1. Since `8-04 LTS` version is a long-term support release, it will not offer
    an upgrade to `8.10` by default. However, upgrades from `8.04 LTS` to Ubuntu Intrepid
    are fully supported and easy to enable.

    2. If a user has an Ubuntu version that is released before `8.04`, it is suggested
    that he see the upgrade notes online for more information.

    3. To start upgrading, a user must start `System/Administration/Software Sources`.
    Then, he can click on the "Updates" tab and change "Show new distribution release"
    to "Normal release".

    4. Then, he can start `System/Administration/Update Manager`. He must click the
    `Check` button to be able to check for new updates.

    5. If there are new updates, he can use the `Install Updates` button for installment
    and then use `Check` again when complete.


    A message will then appear on the screen saying that the new release is available.
    He can then click `Upgrade` and then follow the on-screen instructions.


    # The New Features Under Ubuntu 8.04 Release


    Ubuntu developers are always thinking of giving you the newest and stable software
    in the open sources and communities. After the success of `7.10 Gutsy Gibbon`,
    `Ubuntu 8.04 Hardy Heron` is the latest candidate that shows new features that
    you might want to look into.


    ## What are the new features under Ubuntu 8.04?


    1. Under `Gnome 2.22`, it shows full list of improvements such as `GVFS Back-end
    Nautilus`.

    2. `Pulse Audio` provides cutting edge sound technology on Ubuntu `8.04`.

    3. Ubuntu `Hardy Heron` also provides a collection of the latest and most tested
    features. However, this is still in beta at this moment.

    4. Just like any other Windows application, you can easily install `Hardy Heron`
    on Windows using `.exe`. You can use Wubi for this.

    5. It features the `World Clock Applet`, which is a graphic scheme that is an
    all around positive for the desktop providing temperature display, location profiles
    and more.

    6. It has auto-configuration enhancements, which the users will find useful because
    of minimal configuration file.


    Aside from these new features, you shall be able to enjoy faster boot-time and
    common application launching because files to be read are in order and are automatically
    optimized on the hard disk.


    `Inkscape` is also a new addition to the Ubuntu `8.04 Hardy Heron` application
    selection. It is a drawing program that has the same features with `Illustrator`,
    `Freehand`, and `Corel Draw`. This shall be useful for those who want to work
    on graphic designs on Ubuntu Linux.


    # Understanding the Advantages of Using Ubuntu Sudo


    In Linux, there exist a superuser named `root` or in Windows this is known as
    the `Administrator`. The superuser is very powerful because he can do anything
    and everything. With so much power at his disposal, he can type a command incorrectly
    and accidentally destroy the system. The ideal set-up, however, would be giving
    the user the needed privileges for the task at hand.


    By default, the `root` account password is locked in Ubuntu, which doesn''t allow
    direct login. However, he can use the `sudo` command to become the root user,
    which allows authorized users to run some programs as root without knowing the
    root password.

