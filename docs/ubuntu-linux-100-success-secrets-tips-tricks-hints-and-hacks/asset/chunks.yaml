- fmt: '

    If you want to install enterprise grade software on your Ubuntu operating system,
    then the best place to find them is through the Ubuntu software products catalog.


    The supported software for Ubuntu is listed on the Ubuntu website. The applications
    that you can find on its list can provide commercial support if ever you decide
    to use them on your system.


    If you want to install supported software for Ubuntu, then you can perform this
    operation through the `Add I Remove` utility of your operating system. Using the
    `Add I Remove` utility is recommended for intermediate and basic users of Ubuntu.


    If you know the advanced command systems of Ubuntu, then you can use the `apt-get`
    command. You should only perform this command line operation if you are an expert
    user of Ubuntu.


    There are lots of applications that are supported by Ubuntu. There are data protection
    applications which are ideal for enterprise-level data security. You can also
    use an identity management system on Ubuntu such as the `Centrify DirectControl`
    application.


