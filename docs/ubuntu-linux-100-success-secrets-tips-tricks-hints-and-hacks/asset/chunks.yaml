    # 在 Ubuntu 上安装 Google Earth 的简单方法


    许多互联网用户绝对想在他们的 Ubuntu 上使用 Google Earth。Ubuntu 版 Google Earth 能比以往任何时候都更快地显示更多城市的照片写实建筑。如果你喜欢在
    Ubuntu 上使用 Google Earth 导航，你可以在几秒钟内从外层空间俯冲街道。如果你喜欢在线旅行查看各种地方，Ubuntu 版 Google Earth
    是互联网上最酷的创作之一。


    ## 在 Ubuntu 上安装 Google Earth


    在 Ubuntu 上安装 Google Earth 无法通过常规安装程序完成。双击绝对不起作用。不过，无需担心。你可以遵循以下几个步骤，以便随时在你的 Ubuntu
    上拥有 Google Earth。


    最初，你必须将 Google Earth 下载到桌面，然后进入 `Applications > Accessories > Terminal`。其次，输入
    `sh GoogleEarthLinux.bin` 并按照屏幕上的提示即可完成安装。


    此后，你将能够在桌面上看到 Google Earth 图标，并在安装后为你提供首次启动它的选项。


    最后，Ubuntu 版 Google Earth 应该安装在默认位置 `"/usr/local/Google/Google-earth"`。


    Ubuntu 版 Google Earth 只是说明 Google 完全支持 Linux 的方式之一。只需按照上述步骤即可轻松安装。这些步骤与 Ubuntu
    上安装其他软件的方法相同。只需使用 `*.bin` 扩展名，你也能正确地安装其他软件。


    # Ubuntu 3D：Linux 吸引更多用户的方式


    由于用户界面和外形式方面的最新升级，现在有许多用户转而使用 Ubuntu。这些形式之一是一种消费电子产品，它与传统的桌面体验相比，完美契合 3D 用户界面。与其他系统不同，Linux
    被认为对桌面应该服务的功能没有预设的观念。由于这种洁净的空白，Ubuntu 3D 用户界面也可能在其他设备上开发。Ubuntu 未的升级前景是光明的。


    ## 如何在 Ubuntu 7.10 中使用 3D 功能


    目前，Ubuntu 7.10 可以使用酷炫的 3D 功能。在这个版本发布之前，初学者设置高级的 3D 桌面效果是很的，因为他必须先做很多事情。他必须向源列表添加新的存储库，手动编辑
    `xorg.conf` 文件，并手动设置程序在登录时启动。这么多要做的事情会让新手望而却。


    随着 Ubuntu 7.10 的发布，这变得简单了。他只需要查看显卡是否能处理合成。然后，他可以点击：`System > Preferences > Appearance`。之后，会出现一个窗口，点击“Visual
    Effects”（视觉效果），然后点击标记为“Extra”（额外）的单选按钮。


    如果你看到窗口在移动时变得摇晃（wobbly），这意味着你已经开始启用 Ubuntu 3D 功能。


    # 如何升级到 Ubuntu Intrepid Ibex？


    在 Linux 操作系统下发布的 Ubuntu Intrepid Ibex 是最新的 Ubuntu 版本之一。它提供了各种改进，例如 3G 无线支持、“guest”会话、完全支持的
    Java 栈、内置的虚拟机构建器等。据称 Ubuntu Intrepid Ibex 为桌面提供了直到 2011 年、服务器直到 2013 年的安全补丁。


    建议感兴趣使用此版本的用户阅读完整的发布说明。他还必须遵循正确的程序。否则，可以下载一个可安装的 live CD 镜像。


    ## 如何升级到 Ubuntu Intrepid Ibex


    1. 由于 `8-04 LTS` 版本是长期支持版本，它默认不会提供到 `8.10` 的升级。然而，从 `8.04 LTS` 到 Ubuntu Intrepid
    的升级是完全支持且于于开启。

    2. 如果用户拥有 `8.04` 之前的 Ubuntu 版本，建议他查看在线升级说明获取更多信息。

    3. 要开始升级，用户必须启动 `System/Administration/Software Sources`。然后，他可以点击“Updates”（更新）选项卡，并将“Show
    new distribution release”（显示新发行版）更改为“Normal release”（普通发布）。

    4. 然后，他可以启动 `System/Administration/Update Manager`。他必须点击 `Check`检查）按钮才能检查新更新。

    5. 如果有新更新，可以使用 `Install Updates`安装更新）按钮进行安装，然后在完成后再次使用 `Check`。


    屏幕上随后会出现一条消息，说明有新版本可用。他可以点击 `Upgrade`升级）并遵循屏幕指令。


    # Ubuntu 8.04 发布下的新功能


    Ubuntu 开发者总是想着为你提供开源领域和社区中最新、最稳定的软件。在 `7.10 Gutsy Gibbon` 成功之后，`Ubuntu 8.04 Hardy
    Heron` 是最新的候选，展示了你可能感兴趣的新功能。


    ## Ubuntu 8.04 有哪些新功能？


    1. 在 `Gnome 2.22` 下，显示了改进列表，如 `GVFS Back-end`。

    2. `Pulse Audio` 为 Ubuntu `8.04` 提供了尖端的音频技术。

    3. Ubuntu `Hardy Heron` 还提供了最新功能的集合。不过，目前仍处于测试阶段。

    4. 就像任何其他 Windows 应用程序一样，你可以使用 `.exe` 在 Windows 上轻松安装 `Hardy Heron`。你可以使用 Wubi
    实现此。

    5. 它具有 `World Clock Applet`，这是一个对桌面全方位的正面方案，提供温度显示、位置配置文件等。

    6. 它具有自动配置增强，用户会因为最小的配置文件而觉得有用。


    除了这些新功能外，你将享受更快的启动时间和常用程序的启动。


    `Inkscape` 也是 Ubuntu `8.04 Hardy Heron` 应用选择中的新成员。它是一个绘画程序，具有与 `Illustrator`、`Freehand`
    和 `Corel Draw`相同的功能。这对于想在 Ubuntu Linux 上进行图形设计的人来说非常有用。


    # 理解使用 Ubuntu Sudo 的优势


    在 Linux 中，存在一个名为 `root` 的超级用户，在 Windows 中这被称为 `Administrator`。超级用户非常强大，因为他可以做任何事情。拥有如此巨大的权力，他可能会错误输入命令并无意中破坏系统。然而，理想的设置是给予用户执行任务所需的权限。


    默认情况下，Ubuntu 中的 `root` 账户密码是锁定的，这不允许直接登录。然而，他可以使用 `sudo` 命令成为 root 用户，这允许授权用户在不知道
    root 密码的情况下以 root 身份运行某些程序。


