    Understanding the System Requirements of the Ubuntu System for Desktop


    The Ubuntu Desktop is rich in features which are by na ture very diverse and dynamic.
    If any user who seems confused about which operating system is to be used for
    the system, it would help very much if the structure and framework of the OS is
    well discussed and delivered to the user.


    One of the structures that a Ubuntu user should first un derstand is the system
    requirements. Primarily, the Ubuntu is required to be run on a 64 bit PC system.
    As for the memory requirement, it specifically needs 256 MB for alternate installa
    tion whereas the standard installation is requiring 384 mega bytes of memory.
    And lastly, for the hard disk space, the complete installation of the Ubuntu for
    Desktop requires at least


    3 GB of hard disk space.


    It is also equally important for a user to understand that apart from complying
    with the system requirements, he or she also needs a better understanding on how
    and where to down load the whole system. Ensuring that your system initially satisfies
    the system requirements will help you to have a success ful and working Ubuntu
    system.


    Some people may wonder why Ubuntu for Desktop has a rigid and high system requirement.
    Large parts of the resources are being distributed by the Ubuntu OS in the different
    features that are included on the system such as the integrated calendar and e-mail
    applications, note-taking capability using the Tomboy application, a known Desktop
    note-taking feature, and the new tabbed browsing of the web feature usually provided
