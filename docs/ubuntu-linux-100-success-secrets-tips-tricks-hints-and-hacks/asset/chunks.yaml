    option and you will be able to see the Appearance menu.


    Second, simply select the Appearance utility and a new window will appear. You
    will then see a Themes tab. Simply click on this to open a new window where you
    can start customiz ing the color schemes of your desktop.


    Third, after clicking the Themes tab, you will see a Cus tomize button on the
    window. Just click on this and the Custom ize Theme window will appear. You can
    now locate the Color option and start your own funky tweaks on the color combina
    tions of your desktop and applications.


    The level of appearance customization on Ubuntu is im mense. However, there are
    some themes that are locked so you will not be able to tweak their colors. The
    default Ubuntu theme cannot be customized that is why the color configuration
    option for this would be grayed-out.


    49


    What you can do is to simply select another theme from the Themes selection and
    go back to the Customize option. If the Color option is enabled, this means you
    can change the look and feel of this particular Ubuntu desktop theme.


    50


    Is Ubuntu the Best Buy Option among the


    #### OS


    Technically, there is no such thing as buying the Ubuntu software for a fee because
    the Ubuntu software is an open source program thus free of any charge when downloaded
    and installed. However, just for the sake of discussion and debate, should you
    opt to buy Ubuntu over the other Operating System? Is it the best buy option in
    the market? Are there any drawbacks that you can think that will withdraw your
    interest to buy it?


    If a comparison is to be made among the different operat ing systems that we have
    in the market, the Ubuntu software places a fair fight. However, by stressing
    the points that made Ubuntu the best buy option, the following rationale may help:
    a. Ubuntu is very flexible in terms of hardware and softa ware platforms. There
    are operating systems that were designed specifically to run on a designated piece
    of a hardware just like the MAC OS. Ubuntu, although a community-built software
    is able to capture the idea of flexibility.


    b. Ubuntu is very accessible and reliable. These two sali


    ent characteristics of Ubuntu set it apart from the rest of the other operating
    systems. The accessibility of Ubuntu is one major factor that makes it well-loved
    in the market. From anywhere and anytime, you can just bring along with you a
    copy of this OS and use it using any hardware platforms.


    Considering most of what "for a fee" OS has in possession is also manifested in
    the Ubuntu, then, there is no reason why Ubuntu will not fair in the market.


    51


    The Ubuntu ver 7.10 Pre-installed on the


    M1330 System


    Many hardware manufacturers these days are opting to have a factory installed
    operating system on their products. The logical reason behind this lies on the
    fact that OEM-based (origi nal equipment manufactured) operating systems are properly
    and effectively tested to work on the actual system where it came pre-installed.


    One of the most promising hardware manufacturers that support the OEM-based installation
    of the Operating System is Dell. With the Dell systems, there are specifically
    designed systems that are bound to work under a specific OS platform. An example
    of this is the XPS M1330 of Dell which has a pre installed Ubuntu 7.10 in it.
    The Ubuntu version 7.10 was de signed specifically to work on the M1330 platform.
    The OS registry and command-line features of the Ubuntu 7.10 were specifically
    based on the architecture of the Dell XPS M1330 system.


    Although many computer experts do not agree on this kind of a practice, OEM practice
    makes it a lot easier for both OS and hardware manufacturers to easily capture
    any compatibility issues that may arise between the hardware and software. This
    reasoning allowed the pre-installation of the OS on the hardware equipment a legal
    and permissible action.


    The XPS M1330 of Dell which came pre-installed with an operating system (the Ubuntu
    7.10), has been one of the classic innovations that prompted many other OS manufacturers
    like Microsoft to start engaging in an OEM activity. This has been 52


    commercially accepted by many experts in the IT field and has been welcomed positively
    by many users.


    53


    Learning new things with the Ubuntu Offi


    ### cial Book


    As the old adage claims "learning new things is best ac quired by reading books..."
    This has been proven effective to most Ubuntu enthusiasts. For most Ubuntu users
    both profes sionals and neophytes, they still cling towards using books in order
    to enhance and upgrade what they know. These people usually resort to using the
    official Ubuntu book.


    The Ubuntu Official book has been the bible of many Ub untu experts and enthusiasts.
    With the use of the official Ubuntu book, the following things may be acquired
    to be learned:


    a. It encompasses the detailed discussion about the latest versions of the Ubuntu
    systems and the considered LTS or the long term support systems. This section
    of the book gives a user a detailed overview of the Ubuntu versions that possess
    LTS and those which do not.


    b. The Ubuntu Official book also makes an attempt to ex


    plore a detailed and thoroughly discussed opinions and concepts about the various
    applications that are compatible to work with the different Ubuntu versions under
    specific type of systems.


    c. The Ubuntu book offers a wide array of troubleshooting


    steps and techniques that any expert and neophyte user can use in his quest to
    unleash the potentials of the Ubuntu software. A detailed and well-explained step-by-step
    process to understand


    the various features of the Ubuntu system is included on the official book.


    The official book of Ubuntu promises the reader a com prehensive and carefully
    written down concepts and ideas to fit in his needs and wants. The abovementioned
    things to expect 54'
