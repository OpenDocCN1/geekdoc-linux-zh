    ## Working with the Best Ubuntu Software


    If you are a technology and cyberspace enthusiast, you might have already stumbled
    upon the term or the product called `Ubuntu` software. You probably have a lot
    of friends who are really loyal converts to this new product. But what about it
    should make you feel that it is indeed worth the shift for the better?


    Simply speaking, working with a `Linux`-run operating system translates to working
    with the best efforts ever produced by open source programs. This is the best
    offering of the company, especially for those `Windows` users who are also hesitant
    to make the conversion for fear of not being able to adapt to the system quite
    easily.


    This `Ubuntu` software is actually quite popular in the net book range, and has
    been touted as a remix which is designed for supply to many computer manufacturers.
    In fact, the reason why you are able to purchase your beloved netbook at a price
    that cannot be beaten is because the free nature of this `Linux` operating software
    is able to play a big part in the price reduction. To be very clear, this `Linux`
    is not a new kind of operating system.


    This is where the notebook remix term comes into play, because it is able to make
    the best use possible of the smaller netbook screen as well as being able to introduce
    these new users to some of the main differences that are apparent between `Linux`
    and its competitor the expensive `Microsoft Windows` system. This `Linux `Ubuntu`
    operating system is also bantering their reputation that when such a program works,
    it really does work like it is supposed to.


    ## How to Get Ubuntu Operating System CD


    The `Ubuntu` operating system is a free open source application. That is why there
    are so many channels where you can get `Ubuntu`. There are no restrictions on
    its distribution so even your friend who has the software can give it to you.


    To simplify your search however, you can go to the main `Ubuntu` website. You
    will see a specific section there called `Get Ubuntu`. From that page, you will
    be able to download or request the `Ubuntu` operating system.


    So here are some simple ways you can follow to get the `Ubuntu` operating system:


    1. First, if you want to own a CD copy of the `Ubuntu` operating system, then
    you can request for it from `Canonical Ltd`. `Canonical` is the company that provides
    support for `Ubuntu` operating system.

    2. `Canonical Ltd` will send you a free CD copy of `Ubuntu`. This process however
    may take too long because the CD will be sent using regular postal mail. If you
    are willing to wait, then simply request a CD from `Canonical Ltd`.

    3. Another way to get `Ubuntu` is to directly download the CD image of the software
    from `Ubuntu` website. You can also get `Ubuntu` from some file sharing and free
    download sites.


    It is best however if you can download the software directly from `Ubuntu`. This
    way, you are assured that the application is not tainted or corrupt.


    Simply save the downloaded file on your computer. You can now burn the `Ubuntu`
    CD image on a blank CD. Run this CD to any machine that you want Ubuntu installed.


    ## Understanding Ubuntu 6 Release


    The `Ubuntu 6.06` version was the fourth product release made by `Canonical`.
    This is also the first version that enjoys long term support (`LTS`) from `Canonical`.


    Each `Ubuntu` version released by `Canonical` has specific codename. The `Ubuntu
    6` release was codenamed Dapper Drake. The long term support for the `Ubuntu 6.06`
    release will expire on June 2009 for those installed as desktop operating system.
    For `Ubuntu 6` servers, the long term support will end on June 2011.


    `Ubuntu 6.06` significantly upgraded the previous `Ubuntu 5.10` version which
    was popularly known as Breezy Badger. The most significant upgrade was the provision
    of long term support.


    Aside from `LTS`, the `Ubuntu 6.06` can now be acquired from a single CD containing
    a Live CD installer and a specific Install CD. There are also improvements on
    user interface on start up and shutdown procedures.


    The `Ubuntu 6.06` release also included an intuitive network manager application.
    This upgrade allows you to easily switch from multiple wired to wireless network.
    There are also new themes included in the release to improve the appearance of
    your Ubuntu applications.


    Following the `Ubuntu 6.06` release is the `Ubuntu 6.10` which was codenamed Edgy
    Eft. This is not a long term support release. In fact, support for the `Edgy Eft`
    was terminated on April 25, 2008.


    The `Ubuntu 6.10` release provided big upgrades specifically on the themes of
    the `6.06`. This Ubuntu version also in-14

