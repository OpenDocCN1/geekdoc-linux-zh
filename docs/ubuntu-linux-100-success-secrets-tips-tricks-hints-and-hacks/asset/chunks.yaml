- fmt: '

    Users who are new to Ubuntu and encountered a problem can simply visit `help.ubuntu.com`,
    the official documentation about Ubuntu. The site also features the common issues
    that many users may want to know about.


    Another helpful page is the Ubuntu community documentation wiki. There is a search
    box in this website where any information about Ubuntu can be searched. Another
    useful Ubuntu help are the Ubuntu Web Forums. Here, people raise one issue and
    many members try to solve the issue. Another way to get Ubuntu help is through
    the official Ubuntu User Email list. This is a regular email newsletter that answers
    different concerns from Ubuntu users. IRC chat is also a useful way to get Ubuntu
    help. However, `#Ubuntu` can become very busy during the day. But a little patience
    will surely bear a sweet fruit from IRC chats.


    Aside from the official Ubuntu help supports, users can so get aid from other
    websites. Ubuntu Guide is one of them and it has guides for beginners of Ubuntu.
    This site is also updated every time Ubuntu is updated.


    Users can also use the Ubuntu Document Storage Facility. This is the central storage
    of almost all information about Ubuntu that were produced in forums, blogs, and
    other public sources. Other helpful websites are the Ubuntu Blogs, Ubuntu Tutorials,
    Ubuntu Geek, Simple Ubuntu Tutorial, Ubuntu Tips, Ubuntu Video Clips, and Ubuntu
    Tips and Helps.


    ### 1. Ubuntu Mobile Internet Device Edition: Full Internet with No Compromise


    Ubuntu is not only available as a desktop operating system. Smaller devices like
    PDA phones, especially mobile Internet devices can now enjoy the nice interface
    from Ubuntu through the Ubuntu Mobile, or formally known as the Ubuntu Mobile
    Internet Device Edition.


    To make all its nice features possible, the Ubuntu Mobile is using `WiFi 2.0`
    with options to customize `AdobeFlash`, `Java`, and other programs. Ubuntu also
    features a high performing media player so users can view photos, listen to music,
    and watch movies with superior quality and easy navigation. Included to the Ubuntu
    Mobile is a group of applications that are very useful for everyone''s mobile
    Internet needs.


    Some of the things that can be done with Ubuntu Mobile are Web browsing, image
    capturing, email, instant messaging, media, voice over Internet protocol, blogging,
    digital TV, GPS, calendar, contacts, games, software updates and many more.


    Moreover, Ubuntu Mobile is friendly for touch screens. The user does not need
    any stylus to be able to operate Ubuntu.


    Ubuntu Mobile is also flexible with the common attributes and features of mobile
    Internet devices. These devices can be smaller in size, have 4 to 7 inches touch
    screen, virtual key boards, `Bluetooth`, `WiFi`, `3G`, `WiMAX`, `GPS`, `OpenGL
    3D`, head phone jack, microphone, speakers, `USB`, camera, and flash disk storage.
    All these and more common mobile Internet device features are supported by the
    Ubuntu Mobile.


    Also, users can make his mobile device more useful for his personal needs by Ubuntu''s
    customizing capabilities. Using Ubuntu on mobile devices is also very easy with
    its user-friendly interface.


    ### 2. Some of the Best Ubuntu Programs


    What hinders most people from using free operating systems like Ubuntu is the
    limitation of programs that they can use with it. But what most of these people
    do not know is that there are also many applications that can be used with Ubuntu.
    And the good news is, most, if not all, of these are free.


    `Firefox` is among the most widely-used of these Ubuntu programs. This is the
    default web browser of the operating system which can also be used with other
    operating systems. `Automatix` is another must-have for Ubuntu users. This will
    help them ready the system in installing different useful applications like `Picasa`
    and `Google Earth`. If one is looking for a file indexer or searcher, they can
    still enjoy Ubuntu with the application called `Beagle`. It lets the user to quickly
    search for his files.


    Playing multimedia of different format is also not a problem with Ubuntu as long
    as the `VLC` is installed. Sorting between different applications is also possible
    with `Gnome Deskbar Applet`. Another useful and flexible Ubuntu multimedia player
    is the `amaroK`. This does not only integrate with `Wikipedia` and `MusicBrainz`.
    `Amarok` is easily sync-able with `iPods`.


    Using `Gmail` even though Google has not support for Linux is still achievable
    with Ubuntu''s `CheckGmail`. Also, using another operating system with Ubuntu
    and managing all the data inside it can be easy with Ubuntu''s support for `Add
    NTFS Read/Write`.


    `Adobe Photos` can be very expensive but Ubuntu users can still enjoy editing
    images similar to having the powerful `Photoshop` with `GNU Image Manipulation
    Program` or `GIMP`. Similar to `GIMP` application is the `Unidentified Flying
    Raw`. This is a utility used to read as well as manipulate images right from the
    user''s digital camera.


    ### 3. Great Pre-Added Applications with Ubuntu Ultimate Edition


    Getting what are necessary is perhaps the idea behind Ubuntu. And with another
    version, the `Ubuntu Ultimate`, users can surely experience a twist of using this
    free Linux operating system.


    The `Ubuntu Ultimate Edition` is actually based on the widely-used Ubuntu Christmas
    Edition. This was released by `TheeMahn` in 2006 as a nice Christmas present for
    Ubuntu users. Since then, the same author releases a new Ubuntu "Christmas Edition,"
    now called `Ultimate Edition`, every year.


    Compared with the common Ubuntu, the `Ubuntu Ultimate Edition` has more application
    useful for many kinds of people. It has newer themes, better wallpapers, and nicer
    splash screens. It also features `Debian` style for the `VCD Gear`, wireless Internet
    connection, `Bluetooth` connectivity, and `PPP integration`. There are also networking
    tools included in this special Ubuntu version. It has more fonts, more themes,
    more sound themes, and over-all better support.


    `iPod` users will also enjoy the `Ubuntu Ultimate Edition` more because of its
    `iPod` support. Some applications included in this special edition are `Beagle`,
    `Gramps`, `Legends`, `Kapote`, `Men coder`, `VLC`, `Amarok`, `Songbird`, `DeVeDE`,
    `Xsnow`, `Samba`, `GDesk lets`, `Inkscape`, `Gambas`, and `Screem`.


    Aside from the `Firefox` as its Web browser, `Ubuntu Ultimate Edition` also features
    its Web server `Lamp`. Its HTML editor, `Bluefish`, is also very useful for Internet
    use. It also has a special P2P application `Bit Tornado`.


    Lovers of multimedia can surely enjoy Ubuntu Ultimate with `Audicity`, `Kino`,
    `Dvdrip`, `Listen Media Manager`, `Aria`, `Graveman`, and other multimedia tools.


    Aside from all of these pre-added applications, users can still add more programs
    to his Ubuntu Ultimate computer among the hundred free programs available as his
    option.


    ### 4. The Evident Progression of EeePC Ubuntu


    The `EeePC` is a fun miniature machine. At first look, the built in `Xandros Linux`
    will appear as underpowered to the person who bought it. But once the user enters
    Ubuntu on the `EeePC`, he can impossibly resist in giving out an impression of
    amazement. Because by doing so, the user can clearly recognize the evolution of
    `Ubuntu EeePC`.


    Entering Ubuntu on the `EeePC` will eventually morph and evolve the miniature
    machine, which can please the user to his purchase. Essentially, installing the
