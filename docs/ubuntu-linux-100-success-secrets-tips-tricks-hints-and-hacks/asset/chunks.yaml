    ## 使用最佳的 Ubuntu 软件


    如果你是一个技术和网络空间爱好者，你可能已经偶然遇到过名为 `Ubuntu` 软件的术语或产品。你可能已经有很多朋友是这个新产品的忠实追随者。但关于它，什么特性让你觉得确实值得为了更好而转型呢？


    简单来说，使用运行 `Linux` 的操作系统，意味着使用开源程序所产出的最高水平的成果。这是该公司提供的最佳产品，特别是对于那些担心无法轻松适应系统而犹豫于转换的
    `Windows` 用户来说。


    这款 `Ubuntu` 软件在上网电脑（net book）范围内非常流行，并被誉为一种旨在向许多计算机制造商供应的重混合版（remix）。事实上，你能够以不可比拟的价格购买到你喜爱的上网电脑，是因为这个
    `Linux` 操作系统系统的免费属性在降低价格方面发挥了巨大作用。非常明确地说，这个 `Linux` 并不是一种全新的操作系统。


    这就是“笔记本重混合版”一词大显身场的地方，因为它尽可能地利用较小的上网电脑屏幕，并能让这些新用户了解 `Linux` 与它的竞争对手昂贵的 `Microsoft
    Windows` 系统之间明显的差异。这套 `Linux Ubuntu` 操作系统也印证了它们的声誉：当这样的程序正常工作时，它的表现确实如预期的一样。


    ## 如何获取 Ubuntu 操作系统 CD


    `Ubuntu` 操作系统是一个免费的开源应用程序。这就是为什么有这么多渠道可以获取 `Ubuntu`。它的分发没有任何限制，所以即使是你拥有该软件的朋友也可以把它给你。


    为了简化你的搜索，你可以访问 `Ubuntu` 主网站。你会在那里看到一个名为 `Get Ubuntu` 的特定区域。从该页面，你可以下载或请求 `Ubuntu`
    操作系统。


    以下是你可以遵循的获取 `Ubuntu` 操作系统的的一些简单方法：


    1. 首先，如果你想拥有 `Ubuntu` 操作系统的 CD 拷贝，你可以向 `Canonical Ltd` 申请。`Canonical` 是为 `Ubuntu`
    操作系统提供支持的公司。

    2. `Canonical Ltd` 会给你寄一份免费的 `Ubuntu` CD 拷贝。但这个过程可能需要很，因为 CD 将通过普通邮寄发送。如果你愿意等待，只需向
    `Canonical Ltd` 请求 CD 即可。

    3. 获取 `Ubuntu` 的另一种方法直接从 `Ubuntu` 网站下载软件的 CD 镜像。你也可以从一些文件共享和免费下载网站获取 `Ubuntu`。


    最好的方法是你直接从 `Ubuntu` 下载软件。这样，你可以确保应用程序没有被污染或损坏。


    只需将下载的文件保存到你的电脑上。你现在可以将 `Ubuntu` CD 镜像刻录到空白 CD 上。将此 CD 运行到任何你想要安装 Ubuntu 的机器上。


    ## 理解 Ubuntu 6 发布


    `Ubuntu 6.06` 版本是 `Canonical` 推出的第四个产品。这也是第一个获得 `Canonical` 长期支持（`LTS`）的版本。


    `Canonical` 发布的每个 `Ubuntu` 版本都有特定的代号。`Ubuntu 6` 版本的代号为 Dapper Drake。对于安装为桌面操作系统的用户，`Ubuntu
    6.06` 版本的长期支持将于 2009 年 6 月到期。对于 `Ubuntu 6` 服务器，长期支持将在 2011 年 6 月结束。


    `Ubuntu 6.06` 显著升级了之前的 `Ubuntu 5.10` 版本，该版本被广称为 Breezy Badger。最大的升级是提供了长期支持。


    除了 `LTS` 之外，`Ubuntu 6.06` 现在可以从一个包含 Live CD 安装器和特定安装 CD 的单张 CD 获取。在启动和关机程序的用户界面上也有改进。


    `Ubuntu 6.06` 版本还包含了一个直观的网络管理器。这一升级允许你轻松地从多个有线网络切换到无线网络。该发布版还包含了一些新主题，以改善你 Ubuntu
    应用程序的外观。


    跟随 `Ubuntu 6.06` 发布的是 `Ubuntu 6.10`，代号为 Edgy Eft。这不是一个长期支持版本。事实上，对 `Edgy Eft`
    的支持于 2008 年 4 月 25 日终止。


