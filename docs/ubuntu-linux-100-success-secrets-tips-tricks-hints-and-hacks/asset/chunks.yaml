    ## Some Information on the Visual Effects


    ### Under Ubuntu

    Ubuntu has special visual effects, which can make your desktop more fun and easier
    to use. Ubuntu visual effects include translucent windows, 3D desktop facilities,
    shadow effects and motion effects and animation.


    #### How are Ubuntu visual effects enabled?

    Visual effects under Ubuntu are enabled by default but if you prefer you don''t
    have to turn them on. There are users that might find some visual graphics that
    won''t work so well on their computers. Worse, these visual graphics might slow
    the operation of the computer, which is why it''s better to turn them off.


    #### Tips in Dealing with Common Problems

    1. If you are encountering problems with Ubuntu visual effects, it is recommended
    that you disable them by opening `System` ? `Preferences` ? `Appearance` ? `Visual
    Effects` and selecting `No effects`.

    2. An error message that says "Visual effects could not be enabled" means that
    your graphics driver does not presently support visual effects. In this situation,
    you would not be able to use Ubuntu visual effects with your default graphics
    driver but instead you may use restricted driver.

    3. If the computer suddenly runs slowly when you enabled Ubuntu visual effects,
    it is better to disable it again to improve performance. It is a fact that visual
    effects need more system resources. If your computer is older or less powerful,
    it may not be able to cope with the additional load.


    164


    ## How to Enable the Extra Effects

    There are extra effects aside from those that are available by default. To enable
    them, just install the `compizconfig settings-manager` package. Next, press `System`
    ? `Preferences` ? `Advanced Desktop Effects Settings`. You can then check the
    box next to an effect to enable it and then click on an effect to change its settings.


    165


    ## Ubuntu 5.10: Download the Version

    The notion that size is the measure of power is something that can''t always be
    true. In a sense, in a battle of speed between the Operating System and the Ubuntu,
    the latter would always win.


    And what are the usual apprehensions of people over OS? If it is not speed, then
    it would always be the memory and on how much could it hold. Rather than buy an
    OS with no memory reserve to boast off, Ubuntu 5.10 is the best recourse for those
    memory-hungry buyers.


    It is fast, and it has a large memory reserve. Not only that, Ubuntu 5.10 is the
    baby of Ubuntu so the current focus on making and improving it even after having
    been purchase is something that never eases.


    Every 18 months, Ubuntu releases newer security applications so the threat of
    an outbreak of viruses, so to speak, is nil. There''s even a customer care for
    technical support, while Ubuntu 5.10 has been designed to make installing and
    using it a child''s play when compared to other OS.


    Something that''s new doesn''t necessary have to be bulky to hold so much applications
    together. Ubuntu 5.10 proves this as a correct assumption, and it is now high
    time for OS users to see it for themselves.


    It is easy, and there are even free packages of Ubuntu 5.10 being handed out to
    the lucky ones. It is even available Online so getting Ubuntu 5.10 can now be
    done through download.


    166


    ## Ubuntu JeOs: Juice up!

    The best program for virtual appliance in the system has always been Ubuntu itself
    and while there are now others in the business, Ubuntu is Ubuntu. In this regard,
    Ubuntu versions have been released virtually making old versions of the old Ubuntu
    seemingly obsolete when compared with the new releases. This is something people
    in the programming business, or engaging in it in their daily functions, shouldn''t
    miss.


    Of course, not all Operating Systems can be linked up with Ubuntu, especially
    with Ubuntu JeOs. JeOs is pronounced as ''juice'', and why they came up with such
    name would probably be along the lines of abbreviating long names. Now backing
    up a little, before shifting towards Ubuntu JeOs, check up with the local computer
    programming people and ask them if it is compatible with computer of choice.


    What''s sure is that, the chances of it being compatible, increases with how new
    the computer is. The newer version the computer is, the more would the chance
    of compatibility increase, and this is not the same with the old computer versions.


    Really, there''s no need to make that ''juice'' unusable, right?


    And here''s another trivia about Ubuntu JeOs, the word ''JeOs'' stands for just
    enough operating system. Of course Ubuntu is not an operating system; rather it
    is a concept of how an operating system should appear to be along the lines of
    a virtual appliance. The good thing about Ubuntu JeOs is that it is small and
    agile so compared to the general OS today; it is not bulky so it is fast and can
    easily be secured.


    167


    ## Ubuntu Upgrade: Ubuntu is Going Agile

    Are you dreaming of the ultimate virtual appliance? When the need for better virtual
    appliance increases, the only thing necessary to do is to circle the wagons and
    go Ubuntu.


    And Ubuntu is no tribe of the African continent, as it is a name of one of the
    most revolutionary virtual appliance.


    It is so revolutionary that it seeks to overtake the bulkier and therefore slower
    ''normal'' operating systems that exist today. In terms of usage, only a limited
    number of people are using Ubuntu, while the rest of the world is still held captive
    by the ''normal'' OS.


    Of course, many people would think the upgrading to Ubuntu is time-pressing, and
    it is not, or that it is an unnecessary expense.


    If the computer or laptop is being used for purposes that require secure yet agile
    functioning whenever it is called upon, then go Ubuntu. One of reasons why Ubuntu
    is so agile is that it has dumped out, so to speak, the unnecessary applications.
    The ''normal'' OS operates in the fashion of one application supporting another,
    until a whole network is established. Of course, this network results to a web
    of applications that only look pretty in paper. It eats up memory space and being
    so huge it is easy to penetrate. So don''t wonder when viruses are found to be
    hiding or information is stolen from the OS. With the Ubuntu, it is different
    as it turns off unused applications, making it faster, and virtually, smaller
    by just a mere motion of the appliance.


    168


    ## Ubuntu Guide: Never a Rarity

    Changing from one system to another is something that makes people budge up and
    wary about. The name itself of Ubuntu makes it appear as if it is harder to understand.
    There''s no reason for this and this is just perception prevalent on most people,
    who naturally sees change as a difficult process.


    In many ways, Ubuntu is none of these. The best thing that could be said about
    Ubuntu is that is supported by its developers, even after it has been released
    and followed up by another newer version. In this regard, the needs of the users
    are answered in every version release to make it as user-friendly as possible.


    As for guides, Ubuntu is currently the next-best appliance to have today, and
    this makes finding articles about it really easy. Search Engines are highly competent
    in this area and they could help any person in understanding Ubuntu from the viewpoint
    of a reader and not as a listener.


    There''s also a better reason to use Ubuntu, other than the much-publicized speed
    and security capability, and that is, the Ubuntu is an evolving system put on
    a revolutionary course. This, along with everything else, gives the users the
    assurance that there would be no such thing as an Ubuntu version left all alone
    by the developers. It is something that will not happen, especially in this age
    of Internet connectivity. For this reason alone, Ubuntu guides will never be a
    rarity for the users and future programmers.


