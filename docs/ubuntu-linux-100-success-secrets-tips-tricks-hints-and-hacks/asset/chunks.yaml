    Users who have experienced the evolution and progress of UbuntuEee are very pleased
    on the function given by their great miniature machine. Anyway, who would not
    enjoy to have a fully practical and efficient "micro laptop" that is capable to
    handle most of the standard computing tasks. Such are truly appealing.


    ### Petersen Discussed Ubuntu 8 in a Book


    `Ubuntu 8` or `Handy Heron` is known for having more robustness, more reliability,
    and more stability. But for those people who would want to obtain more information
    about `Ubuntu 8` may refer to Richard Petersen''s book, the "Ubuntu 8 Server Administration
    and Reference."


    The book of Petersen''s is primarily designed to serve as an Ubuntu server reference,
    which tackles the Ubuntu servers including their support applications. Server
    tools are also discussed inside the underlying system implementations and configuration
    files. The main emphasis of this book lies in the things that administrators must
    know to perform management tasks and key serve support.


    Particularly, the topics discussed inside include Network Time Protocol, software
    management, `Upstart` service management, `AppArmor` security, and `runlevels`.
    Webs are examined as well as `FrP`, `Key servers`, `Samba Windows shares`, `Domain
    Name System`, and `CPUS printing`. The book is also carefully organized into five
    sections: getting started; available services; accessible shared resources; open
    network support; and shells. This way, the absorption of knowledge by its readers
    will be easier and quicker.


    Essentially, the first part of the book centers on fundamental tasks such as installation
    of several software including the basic procedure for the command line interface
    and desktops. The second part allows the readers to analyze Internet servers including
    the way services are operated by `Upstart` through the use of `runlevels`.


    Meanwhile, the third part covers servers to supply shared resources on the Internet
    or local network. The fourth part discusses servers to provide network support
    such as `DHCP` servers and `Squid` proxy server. And lastly, the final part presents
    the review of `shell commands` that include the commands used for managing files.


    ### The Magnificence Brought by Ubuntu


    #### Compiz on One''s Desktop


    The `Ubuntu Compiz` presents visual effects to the desktop manager, `GNOME`. These
    desktop effects are already activated by default. However, users are still required
    to turn them on. Some of the special desktop effects presented by `Ubuntu Compiz`
    are: translucent windows; shadows effects; 3D desktop capabilities; animations;
    and motion effects. These effects will certainly make the desktop more dynamic
    and animated.


    However, users of computers with particular graphics cards may experience difficulty
    on the performance of desktop effects on their computer. One thing it can possibly
    cause is the slowing of computer operation once the effects are turned on. So,
    it is necessary and would be very much helpful to look for guides that present
    the right way to tweak it. By doing so, any possible problems on the performance
    of the desktop can be avoided. More importantly, users may pattern the performance
    of their desktop according to their want.


    The following discussion will provide a preview on the installation and configuration
    of `Compiz`:


    Because the central `Compiz` packages are already installed by default, users
    can begin using some of their desktop settings right away even without doing anything.
    However, to seize the functionality of Advanced Desktop Effects Settings, users
    need to add `CCSM` application. This is obtainable in the `Add/Remove` program
    applications.


    Afterwards, users can go to the `System` then to the `Preferences` to reach the
    Advanced Desktop Effects Settings application. This way, users can customize their
    desktop performance.


    There are actually numerous effects that can be activated or deactivated. So,
    for those users who want to fully customize their desktop may spend hours of exploration
    to these tweaks and effects.


    #### Ubuntu Release: Now on Its Ninth Versions


    `Ubuntu` is now regarded as one of the most well-known Linux distributions all
    throughout the world. This computer operating system is continually progressing
    as it always comes with new versions time after time. In fact, the latest `Ubuntu`
    release was done last October. Mark Shuttleworth, founder of `Ubuntu`, together
    with his team released finally the `Ubuntu 8.10` also known as `Intrepid Ibex`.


    Normally, `Ubuntu` slackly follow their six-month phase of release. And during
    the phase of development, an `Ubuntu` release is vitally identified by its code
    name.


    So, what can people expect from `Intrepid Ibex`?


    Essentially, the `Intrepid Ibex` feature enhancements to desktop scalability and
    mobile computing including an improved flexibility for Internet connectivity.
    Shuttleworth explained that the desktop offering of this version serves as the
    central point once again as they reengineered its interface. Shuttleworth also
    added that they aimed to make the recent model as prolific as possible during
    the process of its making by attaining new levels of performance.


    Additionally, Shuttleworth mentioned that the particular focus on `Intrepid Ibex`
    is an all-encompassing Internet access the capability to connect into bandwidth
    regardless of a user''s location.


    Shuttleworth also noted that the `8.10` release was their ninth `Ubuntu` release
    and joined the fourth anniversary celebration of the first `Ubuntu` release. Shuttleworth
    recognized the event as a mark of their profound success.


    Now, Shuttleworth and his team will release again the next version of `Ubuntu`
    this coming April, which is identified as `Ubuntu 8.04` also known as `Hardy Heron`.
    He gave an announcement to the public, which is particularly addressed to people
    in corporate world, about their openness and eagerness to have their contribution
    to attain the success of their upcoming project.


    ### Ways to Set-Up Ubuntu Synaptic


    The `synaptic` package manager is basically an advanced application of package
    management that is capable to install and uninstall every package presented in
    one''s system. Its interface is graphical such as `Add/Remove` applications. However,
    users can expect to have a lot more information. Meaning, `synaptic` provides
    users with absolute control over the whole package management of their system.


    Users need to note though that operating `Synaptic` needs administrative privileges.
    Now, to officially launch `Synaptic`, users should select the following in the
    system of their desktop menu: `System>Administration>Synaptic Package Manager`.


    The `Synaptic` screen will appear to be divided into four parts. The two sections
    at the left pane present the package categories while the other two sections at
    the right pane present the packages. To set up packages, users simply need to
    select the category, locate the package name in the file, then right click on
    the name and select `Mark this package for installation`.


    When users are already satisfied with his selections he can already click `Apply`
    on the button bar at the top., `Synaptic` will download and set up the needed
    packages directly from the online repositories or from `Ubuntu` installation CD.


    Another way to download `Synaptic` is to click the `Search` button, enter the
    name of the package or a brief search term in the field of search text and then
    click the `Search` button. After doing this, `Synaptic` will instantly present
    a briefer list wherein users can select the applications they want to install.
    This way is more convenient as compared to the first since there is no need to
    look for a very long list of applications.


    The Exploration of Ubuntu 7 Features

