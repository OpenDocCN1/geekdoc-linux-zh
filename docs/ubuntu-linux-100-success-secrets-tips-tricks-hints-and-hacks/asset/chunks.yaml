    像其他操作系统一样，Ubuntu 为其用户提供了预装游戏。预装的 Ubuntu 游戏包包含标准益智游戏以及单人或多人型游戏。


    如果你想为 Ubuntu 获取大量游戏，可以解压其预装的 `GnomeGames` 软件包。这些都是免费游戏，专门设计为在 Ubuntu 上运行。


    你还可以获得一个可以独立安装的完整游戏包。这些是 `KDE` 游戏。该游戏包也是免费的，并提供了数百种不同的电脑游戏种类。你可以选择一或两款游戏进行安装，也可以解压整个集合并将所有内容都安装到你的电脑上。


    你还可以使用 Ubuntu 的 `Add/ Remove`（添加/移除）实用程序来选择系统中可用的完整免费原生游戏集合。使用此选项可以方便地安装任何 Ubuntu
    游戏。


    用户发现 Ubuntu 的原生游戏具有很高的教育意义。这对于儿童游戏类型尤为如此，可以培养儿童的计算和数学能力。当然，也有极具娱乐性的游戏，例如 `Bubbles`、`Flight
    Gear` 和 `Globulation 2`。


    这些是儿童和成人都可以的模拟和策略游戏。只需从列表中选择此类游戏，它就会安装到你的系统中。


    你还可以为 Ubuntu 下载其他兼容 Linux 的游戏。`America''s Army` 是一款免费的大型 RTG 策略游戏，可以下载并安装在 Ubuntu
    上。其他游戏开发者也在发布兼容 Ubuntu 操作系统的版本。


    ## 如何享受 Ubuntu 的节奏


    ### 音乐播放器

    如果你安装了 Ubuntu 操作系统，它将自带一个音乐播放器。Ubuntu 音乐播放器是一个名为 `Rhythmbox Music Player` 的免费应用程序。这款音频播放器与
    `iTunes` 有相似之处。


    要访问 `Rhythmbox`，只需从应用程序菜单中提取它。指向声音和视频选项并选择 `Rhythmbox`。你现在可以播放存储电脑上的音频，也可以从互联网刻取轨道。


    Ubuntu 音乐播放器无法播放标准的 `MP3` 格式。`MP3` 是一种专有应用程序，其使用受到许可限制。然而，你可以打开 `Ogg Vorbis` 音频文件，它产生的质量与
    `MP3` 音频相同。


    如果你想播放 `MP3` 格式的音频文件，你需要在系统中安装它。你可以在 Ubuntu 网站上找到 `MP3` 安装的文档。你还可以安装其他基于 Windows
    的音频格式，如 `WAV` 和 `WMA`。在尝试在 Ubuntu 上安装受许可的音频软件之前，确保阅读 Ubuntu wiki 页面。


    你还可以轻松地在运行 Ubuntu 的电脑上集成你的 iPod 音乐播放器。只需连接 iPod 电脑上安装 `gtkpod` 软件包。你现在可以打开 `Rhythmbox`
    应用与 iPod 集成文件。


    你还可以将音乐文件从 iPod 传输到电脑，反亦然。如果你经常从互联网下载音频文件，这非常有用。你可以通过将音频文件传输到 iPod 来随身携带这些文件。


    ## 在哪里找到最好的 Ubuntu 评测

    在众多的 Linux 发行版中，Ubuntu 被认为是最流行的。据估计，Ubuntu 操作系统目前拥有最大的用户群。


    这就是为什么你可以很容易找到可以作为指南的 Ubuntu 评测。如果你想迁移到 Ubuntu 操作系统，Ubuntu 评测非常有用。


    获取准确 Ubuntu 评测的最佳地点之一是在线开发者论坛。有很多在线论坛致力于对 Ubuntu 发行版的讨论。你可以在此类论坛上找到优化技术，以及针对 Ubuntu
    的错误修复。


    开发者博客也是评测的最佳来源。只需搜索提供 Linux 发行版信息的博客即可。此类博客上有关于 Ubuntu 的讨论以及一些对 Ubuntu 的全面评测。


    软件下载网站也提供 Ubuntu 的评测。你可以在他们的页面上找到用户评论，以及对 Ubuntu 操作系统的相应评分。然而，这些评测可能非常主观，并且仅基于特定的用户体验。一些用户的评测也非常短，没有提供关于
    Ubuntu 的详细讨论。


    你需要寻找的是由该网站编辑编写的 Ubuntu 评测。网站编辑的评测更全面、更详细，通常更准确。你可以信任这些评测，因为它们是第三方下载网站。它们可以为 Ubuntu
    操作系统提供客观直观的评测。


    ## Ubuntu：你的独一二软件

    选择 Ubuntu 运行在你的平台上实际上可能是你做过的最明智的决定之一。这是因为 Ubuntu 不仅仅是一种趋势——它是一种简单、经典且强大到足以受时间考验的操作系统。得益于大众的喜爱，Ubuntu
    在许多人中保持着稳定的受欢迎度，并不断获得更好的客户群。这都要归于 Ubuntu 所实现的目标。


    它的目标包括为用户提供一个稳定的操作系统，同时与时俱进，且简单到让普通日常用户理解和利用。它非常强调 Ubuntu 的实用能力以及安装的便利性。事实上，人们可能会惊讶地发现，在全球范围内，Ubuntu
    在软件选择上始终优于其他产品。


    这是一项了不起的成就，特别是对于作为开源类别一部分软件来说。因为是开源的，如果 Ubuntu 用户想要复制并将此软件分发给其他人，他们完全是正确的。事实上，`GNU
    GPL` 许可证还规定人们甚至有权更改甚至改进软件使其更好。由于 Ubuntu 是一种免费软件且是的，人们可以轻松地贡献自己对程序的知识，使其变得更好，从而建立自己的科技遗产。


    ### 免费 Ubuntu 最新版本

    免费 Ubuntu（也称为开源软件）被许可允许用户在没有限制的情况下，未使用一个或多个计算机程序。他们也可以更改和改进他们选择的设计。`Debian Free
    Software` 是唯一符合 Ubuntu 许可要求的软件。你可以免费选择并下载最新的 Ubuntu 桌面版或 Ubuntu 服务器版！


