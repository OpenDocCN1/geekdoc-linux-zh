- fmt: '

    Ubuntu is fast becoming a widely appreciated operating system all over the world,
    and this is hardly surprising especially since there is so much to love about
    it. One very important-and highly popular, of course - aspect or characteristic
    of this Ubuntu operating system is the screenlet. A screenlet is a type or a set
    of widget applications that have been independently developed and utilizes the
    widget engine in order to make it run. This particular engine runs mainly on the
    `Xn`-type of compositing window managers, the most notable of which include `Compiz`
    and `Linux`.


    Up until the version `0.0.14`, these screenlets were also said to be exclusively
    scripted solely in `Python` as well as carefully drawn via the `SVG` platform.
    After this whole thing, the support that comes with it ended making the web widgets
    a lot easier to run and manage. The widgets that are used in Ubuntu screenlets
    are, of course, fully composed in `HTML`, `CSS` and `JavaScript` - which is quite
    similar to the widgets that were used of the Dash board program of Apple laptops.
    Such an engine is also responsible for supporting `Google Gadgets`.


    Fortunately, there is a very easy way for you to make these screenlets up and
    running on your computer. All you have to do is open up the Screenlets manager
    (by pressing on `System` and then `Preferences` and finally move on to the `Screenlets`
    tab). After this, you can then press the `Install` option that is found on the
    right. When you see the screenlet there, you are pretty much set.


    # Ubuntu Tips for Changing Desktop Appearance


    You can easily customize the look and appearance of your default Ubuntu desktop.
    By making small tweaks in the configuration of Ubuntu desktop, you can change
    the themes, colors, and appearance of your applications.


    Here are some Ubuntu tips that will allow you to customize the appearance of your
    desktop and applications.


    First, you need to go to the `Appearance` utility of Ubuntu. This can be accessed
    through the system menu. Once you''re in the main system menu, access the `Preference`
    option and you will be able to see the `Appearance` menu.


    Second, simply select the `Appearance` utility and a new window will appear. You
    will then see a `Themes` tab. Simply click on this to open a new window where
    you can start customizing the color schemes of your desktop.


    Third, after clicking the `Themes` tab, you will see a `Customize` button on the
    window. Just click on this and the `Customize Theme` window will appear. You can
    now locate the `Color` option and start your own funky tweaks on the color combinations
    of your desktop and applications.


    The level of appearance customization on Ubuntu is immense. However, there are
    some themes that are locked so you will not be able to tweak their colors. The
    default Ubuntu theme cannot be customized that is why the color configuration
    option for this would be grayed-out.


    What you can do is to simply select another theme from the `Themes` selection
    and go back to the `Customize` option. If the `Color` option is enabled, this
    means you can change the look and feel of this particular Ubuntu desktop theme.


    # Is Ubuntu the Best Buy Option among the OS


    Technically, there is no such thing as buying the Ubuntu software for a fee because
    the Ubuntu software is an open source program thus free of any charge when downloaded
    and installed. However, just for the sake of discussion and debate, should you
    opt to buy Ubuntu over the other Operating System? Is it the best buy option in
    the market? Are there any drawbacks that you can think that will withdraw your
    interest to buy it?


    If a comparison is to be made among the different operating systems that we have
    in the market, the Ubuntu software places a fair fight. However, by stressing
    the points that made Ubuntu the best buy option, the following rationale may help:


    a. Ubuntu is very flexible in terms of hardware and software platforms. There
    are operating systems that were designed specifically to run on a designated piece
    of hardware just like the `MAC OS`. Ubuntu, although a community-built software
    is able to capture the idea of flexibility.


    b. Ubuntu is very accessible and reliable. These two salient characteristics of
    Ubuntu set it apart from the rest of the other operating systems. The accessibility
    of Ubuntu is one major factor that makes it well-loved in the market. From anywhere
    and anytime, you can just bring along with you a copy of this OS and use it using
    any hardware platforms.


    Considering most of what "for a fee" OS has in possession is also manifested in
    the Ubuntu, then, there is no reason why Ubuntu will not fair in the market.


    # The version 7.10 Pre-installed on the M1330 System


    Many hardware manufacturers these days are opting to have a factory installed
    operating system on their products. The logical reason behind this lies on the
    fact that `OEM`-based (original equipment manufactured) operating systems are
    properly and effectively tested to work on the actual system where it came pre-installed.


    One of the most promising hardware manufacturers that support the `OEM`-based
    installation of the Operating System is `Dell`. With the `Dell` systems, there
    are specifically designed systems that are bound to work under a specific OS platform.
    An example of this is the `XPS M1330` of `Dell` which has a pre installed `Ubuntu
    7.10` in it. The Ubuntu version `7.10` was designed specifically to work on the
    `M1330` platform. The OS registry and command-line features of the `Ubuntu 7.10`
    were specifically based on the architecture of the `Dell XPS M1330` system.


    Although many computer experts do not agree on this kind of practice, `OEM` practice
    makes it a lot easier for both OS and hardware manufacturers to easily capture
    any compatibility issues that may arise between the hardware and software. This
    reasoning allowed the pre-installation of the OS on the hardware equipment a legal
    and permissible action.


    The `XPS M1330` of `Dell` which came pre-installed with an operating system (the
    `Ubuntu 7.10`), has been one of the classic innovations that prompted many other
    OS manufacturers like `Microsoft` to start engaging in an `OEM` activity.


    # Learning new things with the Ubuntu Official Book


    As the old adage claims "learning new things is best acquired by reading books..."
    For most effective For most Ubuntu users both professionals and neophytes, they
    still cling towards using books in order to enhance and upgrade what they know.
    These people usually resort to using the official Ubuntu book.


    The Ubuntu Official book has been the bible of many Ubuntu experts and enthusiasts.
    With the use of the official book, the following things may be acquired to be
    learned:


    a. It encompasses the detailed discussion about the latest versions of the Ubuntu
    systems and the considered `LTS` or the long term support systems. This section
    of the book gives a user a detailed overview of the Ubuntu versions that possess
    `LTS` and those which do not.


    b. The Ubuntu Official book also makes an attempt to explore a detailed and thoroughly
    discussed opinions and concepts about the various applications that are compatible
    to work with the different Ubuntu versions under specific type of systems.


    c. The Ubuntu book offers a wide array of troubleshooting steps and techniques
    that any expert and neophyte user can use in his quest to unleash the potentials
    of the Ubuntu software. A detailed and well-explained step-by-step process to
    understand the various features of the Ubuntu system is included on the official
    book.


    The official book of Ubuntu promises the reader a comprehensive and carefully
    written down concepts and ideas to fit in his needs and wants.

