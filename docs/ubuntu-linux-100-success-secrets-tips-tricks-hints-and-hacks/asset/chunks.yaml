  trans: '

    在 Ubuntu Gutsy 中，桌面搜索也变得更加简单。通过桌面栏小组件，访问最常用的数据变得非常简单方便。可以轻松搜索并找到文档。甚至书签也可以轻松访问。


    对于拥有多个用户的计算机，用户切换也变得更加简单。人们不需要每次切换时都不断输入 ID 和密码。这为忙碌的人节省了时间。


    Ubuntu Gutsy 还有一个插件查找器，因此可以轻松地搜索 `Firefox` 插件，并可以将它们安装到 `86` 浏览器中。这增强了互联网用户的计算体验。


    更重要的是，Ubuntu Gutsy 会自动设置打印机。使用这个操作系统确实在用户方面获得了了极大的便利。


    # Ubuntu 性能：不断改进和增强！


    Ubuntu 通常包含了任何人日常电脑使用、甚至是网络和服务器使用所需的所有内容。一旦有人安装了 Ubuntu 或获得了一台预装了 Ubuntu 的电脑，他自然就拥有了所有这些。他将通过
    `Firefox` 拥有网络浏览器。他将通过 Ubuntu 操作系统带的 `OpenOffice` 软件套拥有文字处理器和其他办公需求。


    使用 Ubuntu 的优点是它定期发布更新。这意味着 Ubuntu 的性能经常会得到改进。作为一个开源操作系统，许多问题通常会在下一个版本中得到解决。


    在用户方面，人们也可以调整 Ubuntu 以增强其性能。例如，人们可以手动释放电脑的 `RAM` 来让它运行得更快。通过禁用几个对他们无用的元素，用户实际上可以释放空间并加快电脑速度。不过，他们必须确保自己只关闭那些对运行电脑并非必不可的内容。


    为了这个目的，互联网上有许多教程。新手实际上可以搜索这些教程并根据指导进行操作。甚至还提供了可以安全关闭的服务列表。


    即使只是对光标速度进行简单的调整，也可以增强个人用户的 Ubuntu 性能。增强措施可以从非常简单到复杂的复杂。Ubuntu 的好之处在于它是可定制的，因此用户可以根据他们认为能增强使用
    Ubuntu 计算体验的方式来操作。


    # Mythbuntu 中 Ubuntu TV 的巨大可能性


    如今计算机的使用不仅仅是为了工作或学校事务。对于大多数人来说，使用电脑已经成为了一种生活方式。他们通过互联网获取一切，同时在同一台电脑上完成所有其他事情。


    这意味着计算机已经成为信息和娱乐的来源。计算机中的多媒体使用无疑是这一代人的趋势。Ubuntu 产生一个名为 `Mythbuntu` 的衍生版本来满足这种需求也并不奇怪。


    这个操作系统的重点确实放在多媒体上。通过 `Ubuntu TV`，用户可以将电脑变成家庭影院。人们实际上可以在不离开电脑的情况下获取所有的信息、新闻和娱乐。他们不再需要电视了，因为他们的电脑现在成了他们的电视。


    事实上，有了 `Ubuntu TV`，电脑不仅仅是一台电视。例如，他们的电脑能够完全地自动跳过广告。电脑现在能够获取电视节目节目表等信息。Ubuntu 用户可以在电脑中录制电视节目。此外，他们实际上可以同时录制多个节目，因为
    Ubuntu TV 支持多个调谐器卡。


    此外，人们可以计划录制电视节目。该操作系统还提供了图像查看器应用程序。就像 `CD/DVD` 刻录软件一样，音频抓取和录制也是可能的。


    安装 `Mythbuntu` 对于那些想要拥有此类功能的人来说无疑将是一种享受。观看电视节目和听音乐不仅变得可能，录制它们并进行备份也可以完成。而且只有一台机器在做这些事情，那就是电脑。


    # Ubuntu Eee：简单、方便、更多！


    `Ubuntu Eee` 是 `Asus Eee PC` 中使用的操作系统。嗯，`Eee PC` 最初被设计为一种创新的笔记本电脑。这使得 `Ubuntu
    Eee` 成为该产品的完美补充。`Ubuntu Eee` 为 `Eee PC` 带来了独特的界面和全新的外观。


    `Ubuntu Eee` 的作用是它为 `Eee PC` 用户提供了他们所需的一切便捷访问。当用户需要某个应用程序时，他可以轻松地点击图标并准备开始计算。这意味着用户不需要在菜单中寻找他们的应用程序了。


    `Ubuntu Eee` 另一个好的点是它包含了 `Firefox`。用户立即获得了一个比其他浏览器更安全的网络浏览器。为了进一步增强网络体验，用户下载免费的插件和扩展。


    `Ubuntu Eee` 甚至包含了 `OpenOffice` 软件套。这意味着 `Ubuntu Eee` 用户将能够随时随地地进行工作。只要他们有自己的
    `Eee PC`，工作始终是可能的。用户在使用 `OpenOffice` 时也受益，因为它与大多数其他软件兼容。


    在 `Eee PC` 上使用 `Ubuntu Eee` 还允许用户自定义他们笔记本电脑的外观。这是因为 `Ubuntu Eee` 安装了各种主题。功能也可以进行自定义。例如，可以减慢光标速度。如果需要，甚至可以激活特效。


    就像使用 `Windows` 一样，删除用户不需要的程序非常简单。用户还可以清理菜单。


    # Ubuntu 游戏：人人可用且充满乐趣！


    是的，Ubuntu 也允许 PC 游戏。人们不需要担心无法在电脑上玩游戏。事实上，Ubuntu 有许多游戏可供。在随身携带娱乐方面，用户将不会被抛下。


    许多游戏是与 Ubuntu 一起打包并安装的。这就是为什么许多能够利用它们。其他的 Ubuntu 游戏也可以独立安装。Ubuntu 用户可以随时参加赛车、战争甚至是战斗文字游戏和谜题。如果他们喜欢鬼游戏，也不会失望的。即使是带孩子的人也能从使用
    Ubuntu 中受益。


    Ubuntu 真的满足了用户的几乎每一个需求。由于人们已经习惯了游戏，Ubuntu 将其作为一个重点。此外，很多游戏也是为 Ubuntu 开发的。如果用户觉得想要比原生
    Ubuntu 游戏更多的游戏，他们实际上可以在整个网上搜索更多游戏。


    在 `Dell` 等品牌电脑预装 Ubuntu 的情况下，拥有游戏确实是非常重要的。Ubuntu 真的能够提供人们所需的一切。Ubuntu 不仅为每台电脑提供了功能性，还提供了娱乐甚至兴奋。


    例如，玩赛车游戏的人将享受此类游戏带给他们的刺激。谜题和棋盘游戏将为许多喜欢它的人提供挑战。再次，教育类游戏将明确有利于使用 Ubuntu 电脑的孩子。


    # Ubuntu Hardy Release 包含什么


    Ubuntu 的目标是在市场上提供一种易用且易于访问的操作系统。它甚至强调国际化，以便让更多人使用 Ubuntu。为了给用户提供更好的操作系统，Ubuntu
    定期发布更新。


    操作系统的新版本通常每六个月发布一次。此类版本将获得 18 个月的支持。然而，长期支持（LTS）版本每两年发布一次。它在桌面端获得三年支持，服务器端获得五年支持。


    Ubuntu Hardy 是 Ubuntu 的长期支持版本之一。正如预期的那样，Ubuntu Hardy Release 带来了许多新应用程序和若干系统改进。

