    ## Enriched Ubuntu Art


    Ubuntu art aims to help the artist and designers to produce artwork for the community
    side of Ubuntu. Many communities organize an exhibition ranging from Fine Arts,
    films, documentaries, storytelling and dancing to discussions. There are helpful
    tools you can use available in Linux operating system of Ubuntu such as the 3D
    software, Video & Animation, Raster Graphics, Desktop Publishing, Photography,
    Vector Graphics, and Web Design.


    This art tools can enhance you and lets you explore your knowledge in designing.
    Artwork for Ubuntu is available on line where in you can register for free and
    start uploading or posting your own design wallpapers, icons, themes, logos and
    color scheme. From there, others can freely comment or rate your art. They can
    either suggest or criticize your work depending on the design of your art.


    You can also join a team of different organizations that will also teach you enhance
    your skills by designing high quality, original and beautiful artwork. You can
    search all these organizations online. You just have to choose the one that best
    fit your taste, style and culture. Every country has its own Ubuntu launch pad
    page in their local community. When someone asks help, the launch pad will look
    for solved questions to find a near answer.


    Ubuntu mail list provides a repository for your community''s knowledge and builds
    biologically as people ask and answer question. In the same way, when support
    contacts always encounter frequently asked question in Ubuntu mail list, they
    can choose the best answer from there and make it available as a template for
    future use.


    16


    ## 3 Commonly Used Ubuntu Email Clients


    There are more than a dozen email clients that you can use with Ubuntu. These
    email clients are free and will work on different platforms. So you will never
    run out of choices on what desktop email client to use for Ubuntu operating system.


    The default Ubuntu email client is `Evolution`. Currently this is the official
    email client used on `GNOME` desktop. This email client has personal message manager,
    calendar, task list, and address book. It can also be used for workgroup email.


    If you do not want to install additional email client on Ubuntu, then the `Evolution`
    client can serve all your electronic mail and management needs. Simply configure
    `Evolution` from your Ubuntu distribution.


    Another Ubuntu email client that you can use is `Mozilla Thunderbird`. This email
    client was created by the `Mozilla Foundation`. This is also a free application
    and can work on any platform.


    You can use `Mozilla Thunderbird` as a personal email management system as well
    as a news group reader.


    A very simple email client that you can use for Ubuntu is `PINE`. `PINE` stands
    for `Program for Internet News and Email`. This program was developed by the `University
    of Washington`. This Ubuntu email client was originally designed for first time
    email users who do not have much knowledge on email client configuration and operation.


    17


    To use `PINE` on Ubuntu, you need to download the `Debian` package. You have to
    install this package on your system before you can install `PINE` client on your
    desktop.


    18


    ## How to Get Ubuntu Media Players


    It is possible to transform your computer running on Ubuntu into an integrated
    media center. There are lots of Ubuntu media players and applications you can
    use to accomplish this.


    The Ubuntu media players are also free and open source. So you can easily download
    them on your machine and use them according to the `GNU` license agreement.


    You have the option to download an Ubuntu Media Center application. This free
    software will allow you to playback audio, video, and photos from `CD` or any
    other source.


    There are two ways to install the Ubuntu Media Center. You can choose this application
    from the `Live CD` installer provided by Ubuntu and run the application the moment
    you installed the operating system.


    You can also download a standalone Ubuntu Media Center and proceed with the installation
    instructions provided on it. You can now run the Ubuntu Media Center just like
    other applications in your system.


    You can also install other media players on Ubuntu. A small media player you can
    use is the `Beep MP`. This is a very compact audio player and has a very straightforward
    user interface. You can download a version of `Beep Media Player` for Ubuntu and
    simply install it on your applications directory. Once installed, you can access
    `Beep` on your applications menus and select the player icon to start it.


    19


    Documentation for the `Beep Media Player` is readily available at the `Beep Project`
    homepage. However, `Beep` is a very simple media application so you will not encounter
    any difficulty using this player.


    20


    ## Understanding the Ubuntu Requirements for Smooth Installation


    There are three levels of Ubuntu requirements you need to know before you can
    successfully install this distribution on your system.


    The Ubuntu system requirements are general guidelines only so it is still possible
    to install Ubuntu even if your computer systems do not meet the requirements.
    However, you can encounter performance issues if your hardware specifications
    are below the recommended requirements for Ubuntu installation.


    For desktop installation, the following are the general Ubuntu requirements:


    First, there is the bare minimum requirement. You need to have a `300-mhz` processor
    with `64 MB` of `RAM`. Aside from these, you should have an available hard disk
    space of `4 GB`. Your computer should also have a `VGA` graphics card for `640x480`
    screen resolution. Of course you need to have a `CD ROM` to run the installer.


    If you are attempting to install Ubuntu with bare minimum requirements, you should
    use the `Alternate Install CD` of Ubuntu.


    If your computer hardware is within the recommended minimum requirements for Ubuntu,
    then installation would be trouble free.


    You need to have `700-mhz` processor and `384 MB` of `RAM`. You should also have
    at least `8 GB` of free hard disk space and a graphics card for `1024x768` resolutions.
    Included in the minimum requirements are sound card, network card, and `CD ROM`.


    Lastly, for full Visual Effects installation, your computer should be more powerful.
    Specifically, you need to have `1.2 GHz-x86` processor with `RAM` power of `384
    MB`. You should also have the supported graphic cards installed on your system.


    22


    ## Ubuntu: Ending the Search for the Perfect OS


    Searching for the best Ubuntu version might be a tad difficult if you do not know
    which options are available for you. In this article, you will learn all about
    the two new versions heavily touted as the main versions of these Linux-based
    operating systems which are also very much in demand with the notebook category.
    These two main versions of the popular Linux system are called `SuSE Linux` and
    `Linux Xandros`.


    If you want to install these popular versions, you can easily go on the internet
    and find a website which will assist you when it comes to the installation of
    these operating systems on your notebook. And of course, the great thing about
    this is that these are open source software so you will not have to shell out
    even a single dime for it. For one thing, transferring to the very easy and simply
    graphical user interface of Linux from the very complicated and roundabout method
    of Windows platform is a bit confusing at first. But with a little help and some
    time to allow yourself to make the change for the better and become an adequate
    user of this really ingenious software, you will see that it is indeed worth the
    shift.


