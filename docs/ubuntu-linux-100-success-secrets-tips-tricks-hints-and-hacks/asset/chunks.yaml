    Ubuntu 正在迅速成为全球广受好评的操作系统，这并不意外，尤其是因为它有许多令人喜爱的地方。这个 Ubuntu 操作系统的一个非常重要——当然也是非常受欢迎的——方面或特征就是小组件（screenlet）。小组件是一种类型或一组小部件应用程序（widget），它们是经过独立开发的，并利用小部件引擎来运行。这种特定的引擎主要运行在
    `Xn` 类型的合成窗口管理器上，其中最著名的包括 `Compiz` 和 `Linux`。


    在 `0.0.14` 版本之前，这些小组件据说完全仅使用 `Python` 进行脚本编写，并通过 `SVG` 平台进行精心绘制。在经历完这一系列变革后，随之而来的支持使得
    Web 小组件的运行和管理变得简单得多。在 Ubuntu 小组件中使用的组件无疑完全由 `HTML`、`CSS` 和 `JavaScript` 编写的——这与
    Apple 笔记本电脑 Dash 程序使用的组件非常相似。这种引擎还负责支持 `Google Gadgets`。


    幸运的是，你有一个非常简单的方法让这些小组件在你的电脑上建立并运行。你只需要打开小组件管理器（点击 `System`，然后点击 `Preferences`，最后切换到
    `Screenlets` 标签页）。之后，你可以点击右侧的 `Install` 选项。当你看到那个小组件时，你就大成了。


    # 更改桌面外观的 Ubuntu 技巧


    你可以轻松自定义默认 Ubuntu 桌面的外观和样式。通过对 Ubuntu 桌面配置进行细微调整，你可以更改主题、颜色和应用程序的外观。


    这里是一些可以让你自定义桌面和应用程序外观的 Ubuntu 技巧。


    首先，你需要进入 Ubuntu 的 `Appearance` 实用程序。可以通过系统菜单访问它。一旦进入主系统菜单，访问 `Preference` 选项，你就能看到
    `Appearance` 菜单。


    其次，只需选择 `Appearance` 实用程序就会弹出一个新窗口。你将看到一个 `Themes` 标签。只需点击即可打开新窗口，你可以在那里开始自定义桌面的颜色方案。


    第三，在点击 `Themes` 标签后，你会在窗口上看到一个 `Customize` 按钮。只需点击它就会出现 `Customize Theme` 窗口。你现在可以找到
    `Color` 选项，并对桌面和应用程序的颜色组合进行你自己的微调。


    Ubuntu 这种外观自定义的程度是巨大的。然而，某些主题是被锁定的，因此你无法调整它们的颜色。默认 Ubuntu 主题是无法自定义的，这就是为什么该的颜色配置选项是灰色的。


    你可以做的是只需从 `Themes` 选择中选择另一个主题，然后返回 `Customize` 选项。如果 `Color` 选项已启用，这意味着你可以更改这一特定
    Ubuntu 桌面主题的外观感受。


    # Ubuntu 是操作系统中最佳购买选择吗


    从技术上来说，并不存在所谓的付费购买 Ubuntu 软件这种说法，因为 Ubuntu 软件是一个开源程序，因此下载和安装时是免费的。然而，仅仅为了讨论和辩论，你是否应该选择购买
    Ubuntu 而不是其他操作系统？它是市场上的最佳购买选择吗？是否存在任何你认为会让你丧失购买意愿的缺点？


    如果对市场上的不同操作系统进行比较，Ubuntu 软件处于公平的竞争地位。然而，通过强调使 Ubuntu 成为最佳选择的观点，以下理由可能有所帮助：


    a. Ubuntu 在硬件和软件平台方面非常灵活。有些操作系统是专门为运行在特定硬件上设计的，就像 `MAC OS`。Ubuntu 虽然是一个社区构建的软件，但它能够捕捉到灵活性的理念。


    b. Ubuntu 非常易于获取且可靠。Ubuntu 的这两个显著特征使其与其它操作系统区分开来。Ubuntu 的易用性是使其在市场上广受喜爱的主要因素之一。随时随地，你都可以随身携带该操作系统的副本并在任何硬件平台上使用它。


    考虑到大多数“付费”操作系统所拥有的特性也体现在 Ubuntu 中，那么，没有理由认为 Ubuntu 在市场中不公平。


    # 预装在 M1330 系统上的 7.10 版本


    如今许多硬件制造商都选择在他们的产品上预装操作系统。这背后的逻辑原因在于，基于 `OEM`（原始设备制造商）的操作系统已经在其预装的实际系统上运行经过了恰当且有效的测试。


    支持基于 `OEM` 安装操作系统的硬件中最具前景的硬件制造商之一是 `Dell`。对于 `Dell` 系统，有专门设计的系统旨在能够在特定的操作系统平台下运行。一个例子是
    `Dell` 的 `XPS M1330`，它预装了 `Ubuntu 7.10`。Ubuntu `7.10` 版本是专为在 `M1330` 平台上运行而设计的。`Ubuntu
    7.10` 的操作系统注册表和命令行功能是专门基于 `Dell XPS M1330` 系统的架构的。


    尽管许多计算机专家并不同意这种做法，但 `OEM` 做法让操作系统和硬件制造商都更容易捕获到硬件和软件之间可能出现的任何兼容性问题。这一推理使得在硬件设备上预装操作系统成为一种合法且允许的行为。


    `Dell` 的 `XPS M1330` 预装了操作系统（`Ubuntu 7.10`），这是经典创新之一，促使包括 `Microsoft` 在内的其他操作系统制造商开始参与
    `OEM` 活动。


    # 通过官方书籍学习新知识


    正如俗语所说，“学习新知识最好通过阅读书籍来……”对于大多数 Ubuntu 用户来说，无论是专业人士还是新手，他们仍然倾向于使用书籍来增强和提升他们所掌握的知识。这些人通常会使用官方书籍。

