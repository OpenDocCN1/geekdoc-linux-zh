    # The Latest Ubuntu YouTube


    Ubuntu focuses in usability and accessibility of the system. In this manner, Ubuntu
    Developer channel has been launched on YouTube. The channel highlights the development
    of Ubuntu. They feature several videos including the current Ubuntu Developer
    Summit. The `UDS` or `Ubuntu Developer Summit` is where the Ubuntu developers
    and contributors meet to discuss the next version of Ubuntu to be in development.
    There are several videos you can find on YouTube and the video channels have already
    received thousands of Ubuntu subscription.


    There are several ways to look and watch YouTube videos with the use of the media
    player of Ubuntu - the `Totem` media player. First, you have to go to Application
    menu choose `Sound & Video` then `Movie Player`. You have to select `Edit` then
    `Plugins`. You can put a check mark in the box that has a label, `YouTube browser`
    and then finally click the close button. You can look for YouTube on the box located
    on the upper right side of the media player and then search the YouTube for keywords
    or phrase. From there you can already watch your desired video! This is a user
    friendly steps that will surely help you enjoy viewing your favorite videos.


    On the other hand, you can have the h264 advanced feature on YouTube videos by
    downloading it online. There are versions of Ubuntu that you can also download,
    free of charge like the `6.10` with `XGL & Kiba-Dock`, `Ubuntu 7.10`, the `8.04`
    and the latest version called as the `Linux 8.10` version. Whatever your choice
    is, the important thing is the flash content will work effectively and efficiently
    in your computer.


    # Simple Steps to Firefox 3 Ubuntu Installation


    The `Firefox 3` Ubuntu installation procedure is simpler and straightforward.
    You just have to input a single terminal command on your Ubuntu home directory
    and you are ready to install the new `Firefox 3`.


    The terminal command line can be copied from any `Firefox 3` beta support pages.
    These pages provide the code. Copy the code provided and input it in your Ubuntu
    home directory.


    It is highly recommended that you back up your previous `Firefox` profile before
    you run the `Firefox 3` code on your computer. You can create a back folder for
    the previous `Firefox` installation. This is a safety measure in order to protect
    your existing `Firefox` profile.


    You also have to close any active `Firefox` window before you run the new `Firefox
    3` code. Once you input the `Firefox 3` code on your home directory, your system
    will automatically create a new folder for it and proceed to download the new
    version of `Firefox`.


    After the download, Ubuntu will automatically install `Firefox 3` and in just
    a few minutes the new version will be up and running. You can now access the new
    `Firefox 3` version from the main menu of your system under `Internet`.


    Simply click on the `Firefox` icon in order to open the browser. You can now customize
    the `Firefox 3` release according to your preference. You can also easily install
    any plugin or extension from the `Firefox` browser. Installation of these plugins
    or extensions is similar to previous versions of `Firefox`.


    # Updates in the New Ubuntu


    New Ubuntu has hit its latest Canonical version `8.10` called as "Intrepid Ibex"
    of Linux distribution. It was released on October 30, 2008 and is maintained until
    2010. The exciting new features and latest enhancements deliver the need for mobile
    digital life. It has two different editions that will suit your needs.


    The `Server Edition` merges its support for virtualization and fully supported
    by `Java` stack and peruser support for directory encryption. While in `Desktop
    Edition`, it includes wireless `3G` support in standard installation and a guest
    account which allows users to share computers without excluding the security.
    The `Server` and `Desktop Edition` come out every six months and are available
    with up to 18 months of support.


    The `Ubuntu 8.10` requires the minimum memory of `256 MB`. You will just need
    a blank `CD` to burn plus `AMD` compatible computer. When download begins you
    will be given instructions on how to create and use your `Ubuntu CD`. The hard
    disk will not be potentially shown when installing the `Live CD` mode. The installation
    process will take longer if you have below the minimum memory requirement. This
    may also cause the system to perform adequately.


    You can also avail the `Ubuntu 8.10` `CDs` and `DVDs` by purchasing it online
    or you can request it through `Shipit` which is free of charge. In addition, for
    security mails running on `Ubuntu 8.10`, the main repositories are now available
    for virus filtering and spam detection. You can be sure that installing it in
    your computer is safe and that you would enjoy the most upgraded version of Ubuntu.


    # The Advantages of Using Ubuntu AMD64


    Ubuntu `AMD64` is not really different from any Ubuntu distribution. The main
    difference is the `AMD64` for Ubuntu is designed for 64 bit processors. Whether
    you have `Intel` or `AMD` processor, you have to choose the `AMD64 Ubuntu` if
    you are running a 64 bit processor.


    Optimizing the operating system speed is the main advantage you can get from using
    Ubuntu `AMD64`. Usually, 64 bit processors have `RAM` capacity of `4 GB` or higher.
    If you want to maximize this kind of `RAM` power, then you need the `Ubuntu AMD64`
    installed on your system.


    If your computer has less `RAM` and you are have a 64 bit processor, using Ubuntu
    `AMD64` will not make any speed or performance upgrade on your system. So it would
    be best if you can upgrade your `RAM` to get the most out of the Ubuntu `AMD64`.


    If you do not want to increase your `RAM` capacity, you can use Ubuntu for 32
    bit processor and the performance of your system will just be the same.


    You can experience some problems when using Ubuntu `AMD64`. Because this distribution
    is specifically designed for 64 bit processors, some applications that are compatible
    only on 32 bit may not run on your system. There are tweaks to overcome this issue
    but you need to know how to configure your system before you can solve incompatibility
    problems.


    # Getting Support for Ubuntu Chinese Font Pack Optimization


    ## Support for Chinese Character Display


    The Ubuntu operating system is capable of supporting Chinese character display.
    This is very useful if you want to write in Chinese characters from the open office
    application of Ubuntu. Ubuntu supports several international languages so it would
    be possible to add other languages on it as well.


    The Ubuntu Chinese font pack will be very handy also if you want to browse the
    web and you want the pages to display Chinese characters. When you install a Chinese
    font pack on Ubuntu, some times you may encounter a little display problem such
    as blurred font. What you can do is to disable anti-alias for Chinese characters
    under `16 pixels`.


    If this step will not work, you can simply type the characters starting from `16
    point` font size. However, this would not be a good option for all situations.


    ## Optimization and Installation


    In order to optimize the display of Ubuntu Chinese characters, you should install
    proprietary Chinese font packs on your system. Developers in Taiwan normally release
    traditional Chinese font packs with `zh-tw` suffixes. If you want a simplified
    Chinese font pack, you need to find a language pack with the suffix `zh-cn`.


    For support and other configuration details, you can go to the `Ubuntu Forum`
    pages and look for thread discussions about language configurations. You can also
    post your inquiries or problems on the `Ubuntu Forum` and a developer will surely
    provide some help. You can also go to the `Ubuntu Chinese Wiki` pages to get detailed
    instructions and additional resources on installing Chinese fonts on your Ubuntu
    system.

