  这就是为什么 Ubuntu 包含一个优秀的视频播放器非常重要原因。通常，电影和视频片段通过 `Totem` 电影播放器播放。在 Ubuntu 中看电影非常简单。用户只需点击“应用程序”，然后进入“声音和视频”，最后选择“电影播放器”。


