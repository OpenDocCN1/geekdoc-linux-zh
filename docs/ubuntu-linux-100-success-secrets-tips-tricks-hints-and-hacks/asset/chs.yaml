  和 `Democracy TV` 之间进行选择。


  如果 Ubuntu 用户需要剪辑视频片段，他们可以做到。同样，在此目的软件方面有多种选择。一个简单的 Ubuntu 视频编辑器是 `Pitivi Video Editor`。Ubuntu
  用户还可以通过 `DeVeDe` 创建 DVD。在更高级的 Ubuntu 视频编辑器中包括 `Thoggen DVD Ripper`、`Kino`、`Stopmotion`
  和 `Subtitle Editor`。


