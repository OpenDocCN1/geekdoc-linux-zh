  `Firefox` 配置文件的一项安全措施。


  在运行新的 `Firefox 3` 代码之前，你必须关闭任何正在运行的 `Firefox` 窗口。一旦你在主目录下输入了 `Firefox 3` 代码，系统将自动为它创建一个新文件夹并开始下载新版本的
  `Firefox`。


  下载完成后，Ubuntu 将自动安装 `Firefox 3`，只需几分钟，新版本就会启动运行。你现在可以从系统主菜单的`互联网`下访问新的 `Firefox 3`
  版本。


