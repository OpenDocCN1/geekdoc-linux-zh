  阻碍大多数人使用像 Ubuntu 这样的免费操作系统的，是它可以使用的程序限制。但大多数人并不知道，还有很多应用程序可以在 Ubuntu 上使用。好消息是，其中大部分（如果不是全部）都是免费的。


  `Firefox` 是这些 Ubuntu 程序中应用最广泛的之一。它是操作系统的默认浏览器，也可以用于其他操作系统。`Automatix` 是 Ubuntu 用户的另一个必备工具。它将帮助他们准备系统，以安装如
