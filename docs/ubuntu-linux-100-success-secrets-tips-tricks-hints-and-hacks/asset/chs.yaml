  ## 理解 Ubuntu 桌面系统的系统要求


  Ubuntu 桌面版功能丰富，这些功能从本质上是非常多样化且动态的。如果任何用户对系统应该使用哪种操作系统感到困惑，对操作系统的结构和框架进行良好的讨论并传递给用户，将非常有帮助。


  Ubuntu 用户应该首先理解的结构之一是系统要求。首先，要求 Ubuntu 在 `64 bit PC` 系统上。对于内存要求，替代安装特别需要 `256 MB`，而标准安装需要
  `384 mega bytes` 内存。最后，对于硬盘空间，Ubuntu 桌面版的完整安装至少需要 `3 GB` 的硬盘空间。


  对于用户来说，除了符合系统要求外，他们还需要更好地了解如何以及在何处下载整个系统。确保你的系统从初满足系统要求将帮助你拥有一个成功且运行良好的 Ubuntu 系统。


  有些人可能会奇怪，为什么 Ubuntu 桌面版有如此严格且高的系统要求。大部分资源由 Ubuntu OS 分配到系统包含的各种功能中，例如集成日历和电子邮件应用程序、使用
  `Tomboy` 应用程序笔记功能（一种著名的桌面笔记功能），以及通常由 `Firefox` 浏览器提供的新标签页浏览功能。


  ## 什么是 Ubuntu FRN？


