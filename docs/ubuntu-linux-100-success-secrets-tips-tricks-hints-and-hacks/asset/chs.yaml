  ## 如何获取最新的 Ubuntu 新闻


  要获取最新的 Ubuntu 新闻，你可以订阅 Ubuntu 网站提供的馈送（feeds）。该网站有一个特定页面，你可以在那里找到新闻、信息以及 Ubuntu 发行版的更新。


  只需点击 Ubuntu 新闻页面上的 `RSS Feed` 链接即可获取网站的更新。这对于获取 Ubuntu 开发者定期发布的补丁非常重要。




  Ubuntu 正在迅速成为全球广受好评的操作系统，这并不意外，尤其是因为它有许多令人喜爱的地方。这个 Ubuntu 操作系统的一个非常重要——当然也是非常受欢迎的——方面或特征就是小组件（screenlet）。小组件是一种类型或一组小部件应用程序（widget），它们是经过独立开发的，并利用小部件引擎来运行。这种特定的引擎主要运行在
  `Xn` 类型的合成窗口管理器上，其中最著名的包括 `Compiz` 和 `Linux`。


  在 `0.0.14` 版本之前，这些小组件据说完全仅使用 `Python` 进行脚本编写，并通过 `SVG` 平台进行精心绘制。在经历完这一系列变革后，随之而来的支持使得
  Web 小组件的运行和管理变得简单得多。在 Ubuntu 小组件中使用的组件无疑完全由 `HTML`、`CSS` 和 `JavaScript` 编写的——这与
  Apple 笔记本电脑 Dash 程序使用的组件非常相似。这种引擎还负责支持 `Google Gadgets`。


  幸运的是，你有一个非常简单的方法让这些小组件在你的电脑上建立并运行。你只需要打开小组件管理器（点击 `System`，然后点击 `Preferences`，最后切换到
  `Screenlets` 标签页）。之后，你可以点击右侧的 `Install` 选项。当你看到那个小组件时，你就大成了。


  ## 更改桌面外观的 Ubuntu 技巧


  你可以轻松自定义默认 Ubuntu 桌面的外观和样式。通过对 Ubuntu 桌面配置进行细微调整，你可以更改主题、颜色和应用程序的外观。


  这里是一些可以让你自定义桌面和应用程序外观的 Ubuntu 技巧。


  首先，你需要进入 Ubuntu 的 `Appearance` 实用程序。可以通过系统菜单访问它。一旦进入主系统菜单，访问 `Preference` 选项，你就能看到
  `Appearance` 菜单。


  其次，只需选择 `Appearance` 实用程序就会弹出一个新窗口。你将看到一个 `Themes` 标签。只需点击即可打开新窗口，你可以在那里开始自定义桌面的颜色方案。


  第三，在点击 `Themes` 标签后，你会在窗口上看到一个 `Customize` 按钮。只需点击它就会出现 `Customize Theme` 窗口。你现在可以找到
  `Color` 选项，并对桌面和应用程序的颜色组合进行你自己的微调。


  Ubuntu 这种外观自定义的程度是巨大的。然而，某些主题是被锁定的，因此你无法调整它们的颜色。默认 Ubuntu 主题是无法自定义的，这就是为什么该的颜色配置选项是灰色的。


  你可以做的是只需从 `Themes` 选择中选择另一个主题，然后返回 `Customize` 选项。如果 `Color` 选项已启用，这意味着你可以更改这一特定
  Ubuntu 桌面主题的外观感受。


  ## Ubuntu 是操作系统中最佳购买选择吗


  从技术上来说，并不存在所谓的付费购买 Ubuntu 软件这种说法，因为 Ubuntu 软件是一个开源程序，因此下载和安装时是免费的。然而，仅仅为了讨论和辩论，你是否应该选择购买
  Ubuntu 而不是其他操作系统？它是市场上的最佳购买选择吗？是否存在任何你认为会让你丧失购买意愿的缺点？


  如果对市场上的不同操作系统进行比较，Ubuntu 软件处于公平的竞争地位。然而，通过强调使 Ubuntu 成为最佳选择的观点，以下理由可能有所帮助：


  a. Ubuntu 在硬件和软件平台方面非常灵活。有些操作系统是专门为运行在特定硬件上设计的，就像 `MAC OS`。Ubuntu 虽然是一个社区构建的软件，但它能够捕捉到灵活性的理念。


  b. Ubuntu 非常易于获取且可靠。Ubuntu 的这两个显著特征使其与其它操作系统区分开来。Ubuntu 的易用性是使其在市场上广受喜爱的主要因素之一。随时随地，你都可以随身携带该操作系统的副本并在任何硬件平台上使用它。


  考虑到大多数“付费”操作系统所拥有的特性也体现在 Ubuntu 中，那么，没有理由认为 Ubuntu 在市场中不公平。


  ## 预装在 M1330 系统上的 7.10 版本


  如今许多硬件制造商都选择在他们的产品上预装操作系统。这背后的逻辑原因在于，基于 `OEM`（原始设备制造商）的操作系统已经在其预装的实际系统上运行经过了恰当且有效的测试。


  支持基于 `OEM` 安装操作系统的硬件中最具前景的硬件制造商之一是 `Dell`。对于 `Dell` 系统，有专门设计的系统旨在能够在特定的操作系统平台下运行。一个例子是
  `Dell` 的 `XPS M1330`，它预装了 `Ubuntu 7.10`。Ubuntu `7.10` 版本是专为在 `M1330` 平台上运行而设计的。`Ubuntu
  7.10` 的操作系统注册表和命令行功能是专门基于 `Dell XPS M1330` 系统的架构的。


  尽管许多计算机专家并不同意这种做法，但 `OEM` 做法让操作系统和硬件制造商都更容易捕获到硬件和软件之间可能出现的任何兼容性问题。这一推理使得在硬件设备上预装操作系统成为一种合法且允许的行为。


  `Dell` 的 `XPS M1330` 预装了操作系统（`Ubuntu 7.10`），这是经典创新之一，促使包括 `Microsoft` 在内的其他操作系统制造商开始参与
  `OEM` 活动。


  ## 通过官方书籍学习新知识


  正如俗语所说，“学习新知识最好通过阅读书籍来……”对于大多数 Ubuntu 用户来说，无论是专业人士还是新手，他们仍然倾向于使用书籍来增强和提升他们所掌握的知识。这些人通常会使用官方书籍。




  书中的内容仅仅冰山一角，如果对书籍进行更深入的探索，会有更多收获。


  ## Ubuntu 及其兼容的计算机系统


  与其他许多软件一样，有特定的计算机来运行和执行为其量身设计的系统。这种做法可能被误认为是“排他性的：某些其他计算机系统和软件也是如此”，但这种做法已被证明在实践中是有效的。


  最近，Ubuntu 的母公司 `Canonical Limited` 已与一家领先的计算机系统制造商之一建立了成功的合作，以继续开发一种运行在特定计算机设计下的强大且专用的软件。这次合作实现了两种不同技术的成功融合，这注定将在软件和硬件行业带来主导地位。


  尽管 Ubuntu 在与一些领先的计算机制造商建立成功合作方面非常激进，但 Ubuntu 的使用并不局限于特定的计算机系统。这意味着 Ubuntu 能够在便携式系统、作为工作站或服务器的台式电脑上运行和使用，而无需担心
  Ubuntu 在不同平台下的可靠性和可用性。Ubuntu 系统这种在不同计算机设计上安装和执行的能力，使其成为许多计算机用户的基本选选。


  计算工业和互联网技术的最新发展，使得许多用户能够对 Ubuntu 以及修改和增强它的社区抱有更高的期望。这是因为自最初发布以来，Ubuntu 软件在过去几年中发生了巨大的变化。


  ## 使用 DVD 介质安装 Ubuntu 是否可行？


  `Canonical Limited` 在以 DVD 形式交付和发送 Ubuntu 软件方面并不十分积极。通常发送给潜在用户的介质是以 CD 格式交付的。由于我们不清楚的原因，这对于大多数软件开发人员来说一直是常态。


  然而，随着近期软件开发领域的最新进展和新技术的快速兴起，人们正寻求以简单的方式解决问题。在技术似乎非常昂贵且难以获取的偏远地区，通过其他方式获取东西可能正在被考虑。


  使用任何互联网连接下载和安装系统在窄带模式下进行时通常需要时间。由于宽带连接的费用高昂，人们别无选择，忍受长时间等待和频繁断开的负担。这就是为什么大多数用户经常请求寄送介质，而不是从网站获取软件的原因。


  `Canonical Limited Company` 对这一呼声做出了积极响应。随着发布的 Ubuntu 软件版本，它具备使用 DVD 介质安装 Ubuntu
  系统的能力。通过 DVD 介质，所有设置文件和 exe 文件都合并在一个单一的安装设置中。


  随着 Ubuntu 社区正在发生的最新发展，预计所有 CD 安装程序将很快被淘汰，DVD 介质中的安装程序将成为主流技术。


  # Google：搜索 Ubuntu 事实的最佳引擎


  当你需要在互联网上搜索信息时，你通常使用哪种搜索引擎？你倾向于使用广为人知的 `Google`，还是你对使用任何种搜索引擎搜索信息都不敏感？


  对于许多信息寻求者来说，使用有效的搜索引擎起着至关重要的作用。**使用有效的搜索引擎可以在探索过程中获得更多成功”这种说法是大多数信息寻求者所坚持的。


  在尝试搜索 Ubuntu 事实和信息时，许多 Ubuntu 用户倾向于使用 `Google` 搜索引擎而不是其他引擎。他们认为 `Google` 搜索引擎的以下特征使其更有效且更受广泛欢迎：


  a. 不仅是因为 `Google` 搜索引擎被广泛使用使其受到许多 Ubuntu 信息寻求者的青睐，而且很大程度上是因为通过使用简单的关键词，`Google`
  就能产生大量的选择。


  b. `Google` 被认为是 Ubuntu 制造者——`Canonical Limited Company` 的盟友，这两家巨头公司最近建立了合作。使用正确的搜索引擎可以更好地探索
  Ubuntu，而正确的搜索引擎就是 `Google`。


  c. `Google` 在在使用关键词时使用的机制较不严格。这意味着通过在搜索引擎中使用正确的关键词，会有更好的结果。


  这是许多 Ubuntu 用户认为在互联网上寻求正确信息时搜索引擎必要且重要的某些原因。


  ## Ubuntu：基于 Linux 的操作系统


  许多不完全了解 Ubuntu 软件主要结构和架构的人将 Ubuntu 视为独立于 Linux 的操作系统。虽然在某些方面他们是正确的，但如果你仔细审视 Ubuntu
  软件的整个架构，你会发现它的大部分功能主要源自 Linux 和 `Debian GNU` 平台。


  Ubuntu 软件是一个社区开发的操作系统，非常兼容便携设备，甚至为服务器和工作站设计。Ubuntu 系统是一个软件包，适用于任何计算机平台，因为运行和使用计算机系统所需的所有应用程序都在其中——电子邮件应用程序、文字处理器、电子表格、演示软件等。


  由于 Ubuntu 是由“社区”开发的系统——这意味着任何人都有权开发和增强其功能——因此作为基于 Linux 的操作系统使用 Ubuntu 是免费的。整个安装文件可以从互联网任何地方下载，无需付费。




  在 Ubuntu 中，将文档打印为 PDF 格式是一件简单的事情。你可以采取许多步骤，而且所有这些步骤中最好的一点是它们通用的——这意味着它们可以在任何版本的
  Ubuntu 系统中被遵循。提醒一下，虽然为了执行此操作不需要符合任何特定的系统要求，但你仍然需要满足安装 Ubuntu 系统的最低要求，当然，还包括打印机的要求。


  ## 在世界万维网 (WWW) 上探索 Ubuntu 的独特特性


  万维网众周知是可以搜索和定位关于几乎任何事物和一切事情的海量且相关信息的地方。Ubuntu 作为一个广为人知并使用的操作系统，它有自己深奥且保存完好的的秘密，等待着通过万维网（通常称为互联网）进行探索。


  Ubuntu 系统的许多秘密（几乎所有的版本和修订）都可以在网上进行探索和发现。在使用万维网（`www`）作为探索未知的手段时，有几点基本内容需要记住：


  - 首先，你需要确保你理解了如何在网络上搜索信息时使用关键词。这些关键词是核心搜索文本，当搜索引擎开始定位你正在搜索的内容时，它们将帮助你缩小搜索结果。

  - 其次，你需要知道在搜索信息时如何使用特定的关键词。正确的关键词可以帮助你消除所有不必要的搜索结果，避免在阅读和浏览所有页面结果上浪费时间。

  - 最后，当你对正在搜索的内容感到迷茫时，你需要知道如何混合和匹配术语。术语的混合和匹配允许你发现更多选项，本质上给了你发现更多、更好的机会。


  这些基本指南确实可以帮助任何用户在探索 WWW 所能提供的内容时击中目标。


  ## 安装 Ubuntu 的完美技巧


  如果你是 Ubuntu 的新用户并习惯了使用 Windows 环境，你可能会发现在 PC 上安装 Ubuntu 软件的过程相当反常且困难。尽管如此，Ubuntu
  涉及的安装过程并没有看起来那么困难。事实上，当你决定安装 Ubuntu 软件时，只有几点需要记住。以下是其中一些：


  a. 考虑你是否真的想将 Ubuntu 作为你的操作系统，或者你只想在它上开启一段小旅程。通过决定是否要在你的系统中使用它，那么删除和移除你 PC 上现有的操作系统将会变得容易。

  b. 检查可以下载和安装完整版 Ubuntu 系统的网站。在点击下载和安装之前，确保你已经仔细分析了 Ubuntu 操作系统的系统要求。确保你的系统符合最低要求。

  c. 你可以选择通过网站或 Live CD 安装 Ubuntu 软件。无论你选择从 Live CD 还是网站安装操作系统，你仍然需要考虑所有的预防措施，例如是否接受定期更新。


  如果你最终决定在你的系统中安装和使用 Ubuntu 软件，这些小小的提醒可以帮助你节省大量的资源和时间。


  ## Ubuntu 系统的强大特性


  Ubuntu 是一个广为人知的免费开源软件。作为一种开源软件，资助其生存的 Canonical Limited 公司完全意识到 Ubuntu 结构、语义和架构可能发生的持续演变和修改。这正是为什么
  Ubuntu 作为一个操作系统的通用特性一直是备受期待的原因。


  Ubuntu 无论其快速变化变得多么动态，在对其核心特性的标准化和通用化方面仍然保持开放。幸运的是，许多专家已经同意以下特性在每个 Ubuntu 平台上都是可见接受的：


  a. **易用性 (Usability)**。Ubuntu 软件的核心特征之一是它对所有类型的用户都可用。这种易用性可以从安装方式到所使用的命令语法被明显地感受到和看到。

  b. **通用性 (Universality)**。这一特性看起来可能与开源试图推行的内容有些讽刺，但话虽如此，即使 Ubuntu 可以被自由修改、研究和更改，它的核心本质仍然保持完整，因为对其进行的任何修改都应该符合
  Canonical 委员会设定的通用指南。

  c. **可访问性 (Accessibility)**。Ubuntu 免费且开源，这使其用户能够轻松并可能访问它。这是 Ubuntu 的核心实质之一，至今未被触动。


  所有这些被每个 Ubuntu 平台核心的特性清楚地表明，无论开源的程度如何，都总有一种方法创建一个标准化的特性。


  ## 请求 Ubuntu CD 的快速步骤


  Ubuntu 提供免费申请服务。作为用户，你可以索要一张预装了 Live Updates 的 CD，且显然不需要任何其他费用。最好的是，Ubuntu 的制作人员了一个专门为请求
  CD 设计的网站。通过访问主页 `www.shipit.ubuntu.com` 即可进入该网站。


  如果你已经准备好请求一个 Ubuntu CD 供你使用，以下快速步骤可以帮助你完成：


  a. 最初，你需要做的是基本上评估你对操作系统的需求。你是否需要一个在图形增强和硬件加速方面非常有用的操作系统？或者你是否需要一个可以尝试和使用的普通操作系统？在评估了你的需求后，你就可以进入下一个阶段。

  b. 下一阶段是进入主站 `www.shipit.ubuntu.com`。从该网站，你将被立即引导至可以在此处请求最新版本 Ubuntu 的页面，无论是桌面版还是服务器版。

  c. 确保你在必填字段中提供所有信息。你在必填字段中填写的信息将作为你的验证。所有信息将存入 Ubuntu 数据库并供制作人员参考。


  但请记住，如果你急切需要 Ubuntu CD，你将需要另一种方式（意味着从网站下载），因为 CD 的交付通常需要 2-3 个月。


  ## Dapper Drake 又称 Ubuntu 6.06 LTS


  每年，Ubuntu 监管委员会（Canonical Limited）都会确保发布两个升级版本的 Ubuntu 系统。像许多其他软件开发者一样，Canonical
  Limited 使用有一套特定的系统来命名其最新的修订版本。


  通常，最新的修订版本使用发布时的月份和年份命名，并对应版本号。然而，当一个 Ubuntu 系统延迟发布时，会进行相应的更改。命名的一部分是为在市场上发布的每个最新版本给出一个代号，使其与其他版本独特地隔离开。一个经典的例子就是
  Dapper Drake —— 即 Ubuntu `6.06`。






  Dapper Drake 是 Canonical Limited 公司发布的第 4 个 Ubuntu 版本。这也是所有 Ubuntu 版本中第一个 LTS（长期支持）发行版本。作为
  LTS 计划的一部分，对 Dapper Drake 的支持预计将于 2009 年 6 月左右结束（针对桌面版），而服务器版将获得更长两年的支持，其支持将于 2011
  年 6 月结束。


  Dapper Drake 的亮点之一是将现场运行光盘（Live CD）和安装 CD 合并到单张紧凑的光盘中。


