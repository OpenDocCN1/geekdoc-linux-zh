  ## Ubuntu 6.06 的主要特性


  Ubuntu 6.06 LTS（长期支持版），又为人知的 Dapper Drake，是 Ubuntu 的最新版本之一。尽管人们一直期待 Ubuntu `6.06`
  的发布，但它的出现并不非常早，也不那么容易预料。尽管尽管如此，仍然有一些事情让 Ubuntu `6.06` 的见证变得有些过于令人兴奋——这就是它的主要特性。以下是
  Ubuntu `6.06` 中包含的一些功能和有趣的逸闻：


  a. 由于它是第一个具有长期支持 true 的版本，预计其服务器版将获得 5 年的安全更新支持，而桌面版将提供 3 年支持。此外，该版本将提供来自世界各地的专业现场和邮件技术支持。


  b. Ubuntu `6.06` LTS 桌面版需要 `3 GB` 的硬盘空间，而服务器版需要 `500 MB`。相应的，为了最大化 Ubuntu `6.06`
  的效用，桌面版需要 `256MB` 内存，服务器版需要 `64 MB`。


  c. Ubuntu `6.06` 版本支持 4 种动态系统架构，这些是 `Intel 86` 系列；`AMD` 系列；`UltraSPARC tl` 以及最后的
  `Power PC` 架构。


  Ubuntu 系统的这些显著特性或功能将帮助用户清楚地理解为什么 LTS 版本会发生特定的行为。


