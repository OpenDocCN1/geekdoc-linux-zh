  ## 丰富的 Ubuntu 艺术


  Ubuntu 艺术旨在帮助艺术家和设计师为 Ubuntu 社区创作艺术作品。许多社区会举办涵盖从美术、电影、纪录片、故事讲述、舞蹈到讨论的展览。在 Ubuntu
  的 Linux 操作系统中，你可以使用许多工具，例如 3D 软件、视频与动画、位图图形、桌面出版、摄影、矢量图形和网页设计。


  这些艺术工具可以增强你的能力，并让你探索设计方面的知识。Ubuntu 的艺术作品可以在网上获取，你可以在那里免费注册并开始上传或发布你自己的设计壁纸、图标、主题、标志和配色方案。从那里，其他人可以自由地对你的艺术进行评论或评分。他们可以根据你的艺术设计对作品提出建议或批评。


  你还可以加入由不同组织组成的团队，他们也将通过教导你如何设计高质量、原创且美丽的艺术作品来提升你的技能。你可以在网上搜索所有这些组织。只需选择最符合你品味、风格和文化的一个即可。每个国家在当地社区都有自己的
  Ubuntu 启动垫板页面（launch pad）。当有人寻求帮助时，启动垫板会寻找已解决的问题以找到接近的答案。


  Ubuntu 邮件列表为你的社区知识提供了一个仓库，并随着人们提问和回答问题而生物性地增长。同样，当支持人员经常在 Ubuntu 邮件列表中遇到常见问题时，可以从那里选择最佳答案，并将其作为模板供未来使用。


  16


  ## 3 种常用的 Ubuntu 邮件客户端


  你有十多个邮件客户端可以在 Ubuntu 上使用。这些 Ubuntu 邮件客户端都是免费的，并且可以在不同的平台上运行。因此，对于为 Ubuntu 操作系统选择何种桌面邮件客户端，你永远不必担心没有选择。


  Ubuntu 的默认邮件客户端是 `Evolution`。目前，这是 `GNOME` 桌面上使用的官方邮件客户端。该邮件客户端拥有个人消息管理器、日历、任务列表和地址簿。它还可以用于工作组邮件。


  如果你不想在 Ubuntu 上安装额外的邮件客户端，那么 `Evolution` 客户端就可以满足你所有的电子邮件和管理需求。只需从你的 Ubuntu 发行版中配置
  `Evolution` 即可。


  另一个你可以使用的 Ubuntu 邮件客户端是 `Mozilla Thunderbird`。该邮件客户端由 `Mozilla Foundation` 创建。这同样一个免费应用程序，并且可以在任何平台上运行。


  你可以将 `Mozilla Thunderbird` 作为个人邮件管理系统以及新闻组阅读器。


  一个你可以用于 Ubuntu 的非常简单的邮件客户端是 `PINE`。`PINE` 代表“互联网新闻和电子邮件程序（Program for Internet News
  and Email）”。该程序由 `华盛顿大学` 开发。这个 Ubuntu 邮件客户端最初是为没有多少邮件客户端配置和操作知识的首次用户设计的。


  17


  要在 Ubuntu 上使用 `PINE`，你需要下载 `Debian` 包。在桌面上安装 `PINE` 客户端之前，你必须先在系统中安装此包。


  18


  ## 如何获取 Ubuntu 多媒体播放器


  你可以将运行 Ubuntu 的计算机转换为集成式多媒体中心。有很多 Ubuntu 媒体播放器和应用程序可以帮助你这一点。


  Ubuntu 媒体播放器也是免费开源的。因此，你可以轻松地在你的机器上下载它们，并根据 `GNU` 协议使用它们。


  你有选择下载 Ubuntu 媒体中心（Ubuntu Media Center）应用程序。这款免费软件将允许你播放来自 `CD` 或或其他的音频、视频和照片。


  安装 Ubuntu 媒体中心有两种方法。你可以从 Ubuntu 提供的 `Live CD` 安装程序中选择此应用程序，并在安装操作系统后立即运行该程序。


  你也可以下载一个独立的 Ubuntu 媒体中心，并按照其提供的安装说明进行操作。现在你可以像运行系统中的其他应用程序一样运行 Ubuntu 媒体中心了。


  你可以在 Ubuntu 上安装其他媒体播放器。你可以使用的一个小型媒体播放器是 `Beep MP`。这是一个非常紧凑的音频播放器，具有非常直观的用户界面。你可以下载
  Ubuntu 版本的 `Beep Media Player` 并只需将其安装到你的应用程序目录。安装完成后，你可以在应用程序菜单中访问 `Beep` 并选择播放器图标启动它。


  19


  `Beep Media Player` 的文档可以在 `Beep Project` 主页轻松获得。然而，`Beep` 是一个非常简单的媒体应用，因此你在使用此播放器时不会遇到任何困难。


  20


  ## 理解为了顺利安装的 Ubuntu 要求


  在系统上成功安装此发行版之前，你需要了解三个层级的 Ubuntu 要求。


  Ubuntu 系统要求仅供通用指南，因此即使你的计算机系统不符合这些要求，仍然可能安装 Ubuntu。但是，如果你的硬件规格低于 Ubuntu 安装的推荐要求，你可能会遇到性能问题。


  对于桌面安装，以下是 Ubuntu 的通用要求：


  首先，是最低要求。你需要一个 `300-mhz` 的处理器和 `64 MB` 的 `RAM`。除了这些之外，你还应该有 `4 GB` 的可用磁盘空间。你的计算机还应该有一块支持
  `640x480` 屏幕分辨率的显卡。当然，你需要一个 `CD ROM` 来运行安装程序。


  如果你正尝试使用最低要求安装 Ubuntu，你应该使用 Ubuntu 的备用安装 CD（Alternate Install CD）。


  如果你的计算机硬件符合 Ubuntu 的推荐最低要求，那么安装将顺畅进行。


  你需要 `700-mhz` 的处理器和 `384 MB` 的 `RAM`。你还应该至少有 `8 GB` 的空硬盘空间和一张支持 `1024x768` 分辨率的显卡。最低要求包括声卡、网卡和
  `CD ROM`。


  最后，对于全视觉效果安装，你的计算机应该更强大。具体来说，你需要一个 `1.2 GHz-x86` 处理器和 `384 MB` 的 `RAM`。你还应该在系统中安装支持的显卡。


  22


  ## Ubuntu：结束对完美操作系统的寻找


  如果你不知道有哪些可用选项，寻找最佳 Ubuntu 版本可能会有点困难。在本文中，你将了解关于两个被推崇为基于 Linux 的主要版本且在笔记本领域非常受欢迎的新版本。这两个流行的
  Linux 系统的主要版本被称为 `SuSE Linux` 和 `Linux Xandros`。


  如果你想安装这些流行的版本，你可以轻松地在网上找到一个可以帮助你在笔记本上安装这些操作系统的网站。当然，这很棒的一点是它们是开源软件，因此你不需要花费一分钱。一方面，从
  Windows 平台复杂绕回的方法转移到 Linux 非常简单直接的图形化用户界面，起初可能会令人困惑。但只要稍微帮助并花一些时间让自己改进并成为这种非常精妙软件的合格用户，你会发现这种转变是值得的。


  23





  # 最新的 Ubuntu YouTube


  Ubuntu 关注系统的易用性和可访问性。因此，在 YouTube 上启动了 Ubuntu 开发者频道。该频道重点介绍 Ubuntu 的开发情况。他们展示了多个视频，包括当前的
  Ubuntu 开发者峰会。`UDS` 或 `Ubuntu Developer Summit` 是 Ubuntu 开发者和贡献者聚会并讨论正在开发的下一个 Ubuntu
  版本的地方。可以在 YouTube 上找到多个视频，这些视频频道已经获得了数千次 Ubuntu 订阅。


  使用 Ubuntu 的媒体播放器 - `Totem` 媒体播放器查看和观看 YouTube 视频有多种方法。首先，你需要进入应用程序菜单，选择`声音与视频`，然后选择`电影播放器`。你需要选择`编辑`然后`插件`。你可以勾选标记为
  `YouTube 浏览器` 的方框，最后点击关闭按钮。你可以在媒体播放器右上角的框中查找 YouTube，然后通过关键词或短语搜索 YouTube。从那里你就可以开始观看想要的视频了！这是一个用户友好的步骤，一定能帮助你尽情观看喜欢的视频。


  另一方面，你可以通过在线下载 YouTube 视频来获得 h264 高级功能。你也可以下载免费的 Ubuntu 版本，例如带有 `XGL & Kiba-Dock`
  的 `6.10`、`Ubuntu 7.10`、`8.04` 以及名为 `Linux 8.10` 的最新版本。无论你的选择是什么，重要的是 Flash 内容将在你的计算机上有效高效地运行。


