  Ubuntu 版本似乎已经过时了。对于编程行业的人或在日常工作中从事编程的人来说不应该错过这一点。


  当然，并不是所有的操作系统都能与 Ubuntu 关联，特别是 Ubuntu JeOs。JeOs 的发音是“juice”（果汁），他们想出这个名字可能是为了对长名称进行缩写。现在稍微退一步，在转向
  Ubuntu JeOs 之前，咨询当地的电脑编程人员，询问它是否与你选择的电脑兼容。


  可以肯定的是，兼容的机会会随着电脑的新旧程度而增加。电脑版本越新，兼容的概率就越高，这与旧版本的电脑是不一样的。


  真的，没必要让那种“果汁”变得不可用，对吧？


  这里有关于 Ubuntu JeOs 的另一个冷知识，“JeOs”一词代表“足够的操作系统”（just enough operating system）。当然，Ubuntu
  不是一个操作系统；相反，它是关于操作系统应该如何那样的概念，类似于虚拟设备。Ubuntu JeOs 的优点是它小巧而敏捷，与当今的通用操作系统相比；它不笨重，因此速度快且可以安全安全。


  167


  ## Ubuntu 升级：Ubuntu 变得敏捷

  你正在梦想一个终极虚拟设备吗？当对更好虚拟设备的需求增加时，唯一需要做的就是集结并选择 Ubuntu。


  而 Ubuntu 并不是非洲大陆的一个部落，因为它是最具革命性的虚拟设备之一的名字。


  它是如此具有革命性，以寻求超越今天存在的更笨重且因此更慢的“正常”操作系统。在用法方面，只有少数的人在使用 Ubuntu，而世界其他部分仍被“正常”操作系统所圈禁。


  当然，许多人会认为升级到 Ubuntu 是紧迫的，事实并不是，或者这是一项不必要的支出。


  如果电脑或笔记本电脑用于在任何需要需要安全且敏捷运行的目的，那就用 Ubuntu。Ubuntu 如此如此敏捷的原因之一是它丢弃了从意义上说不必要的应用程序。“正常”操作系统以一个应用程序支持另一个的方式运行，直到建立整个网络。当然，这种网络导致了一个只看起来好看的应用程序网络。它占用内存空间，由于体积庞大很容易被渗透。所以，当发现病毒隐藏或信息从系统中窃取时，不要奇怪。有了
  Ubuntu，情况就不同，因为它关闭了未使用的应用程序，使其速度更快，并且虚拟上变得更小。


  168


  ## Ubuntu 指南：绝罕见

  从一个系统切换到另一个系统是让人们犹豫和谨慎的事情。Ubuntu 这个名字本身让它看起来更难理解。这并没有理由，这只是大多数人的认知，他们自然地认为变化是一个困难的过程。


  在许多方面，Ubuntu 并不是这样。关于 Ubuntu 最好的评价是它被开发者支持，即使在它发布并被后续版本更新之后也是。在这方面，用户的需求在每个版本发布中都得到解答，使其尽可能友好。


  至于指南，搜索引擎在这个领域非常专业，它们可以帮助任何人从读者的而不是听者的角度理解 Ubuntu。


  使用 Ubuntu 还有一个更好的理由，除了广为人知的速度和安全能力之外，那就是 Ubuntu 是一个放在革命性道路上的演进系统。这一点以及其他所有点，让用户确信不会有
  Ubuntu 版本被开发者遗弃。这种情况不会发生，特别是在互联网连接的时代。仅仅由于这个原因，Ubuntu 指南对用户和未来的程序员来说绝不会罕见。


  169


  Ubuntu 发布：由翻译者发布

  月份





  Ubuntu 目前的发布理念是每六个月发布一次新版本的虚拟设备。当然，考虑到程序本身的性质及其功能，这是一件很难做的事情。


  此外还有测试和交付阶段，但 Ubuntu 的良好之处在于，当他们承诺某件事时，他们通常能够完成。这在公众面前留下了良好的印象，并在声誉方面提升了 Ubuntu
  的地位，这在销售业务中是必须的。


  那么，Ubuntu 是如何做到每 6 个月发布一个版本的呢？这是一个很多人问的问题，即在面对种种挑战的情况下，他们仍然完成了任务。


  诀窍在于用户向 Ubuntu 团队提供了大量反馈，这些反馈是非常受重视的。事实上，Ubuntu 版本的发布很大程度上是基于反馈建议的。


  除了每 6 个月发布一次 Ubuntu 之外，Ubuntu 还承诺每 12 到 24 个月发布一次企业版（Enterprise Release）。这种企业版发布使
  Ubuntu 显得与众，因为总会有内容可以升级。


  当然，Ubuntu 用户不需要在每个新版本发布时都升级 Ubuntu。


  如果他们愿意，可以继续使用旧版本的 Ubuntu，并仍能定期收到安全更新和应用程序，这可以持续 18 个月。这使其成为一个高度可靠的虚拟设备，基本上可以在开发人员提供最少支持的情况下独立运行。


