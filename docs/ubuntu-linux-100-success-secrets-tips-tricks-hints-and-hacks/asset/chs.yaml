  ## Ubuntu 8.04 LTS 是 Ubuntu Heron


  Ubuntu 成为操作系统成为最信赖的开源平台之一。它最伟的版本之一是 `Ubuntu 8.04 LTS` 或 `Hardy Heron`。


  `Hardy Heron` 是 `Ubuntu 8.04 LTS` 构建期间使用的代号。开发者在 2008 年 4 月 24 日发布时公布了 `Hardy Heron`
  的真实名称。是 `JonoBacon` 宣布了这个 Ubuntu 版本的可用。`Ubuntu Heron` 或 `Ubuntu 8.04 LTS` 带有三年的免费更新。事实上，该操作系统名称中的
  `LTS` 意味着 `Long-Term Support`（长期支持）。


  `Ubuntu Heron` 的版本包括 `HardyHeron/Aphal`、`HardyHeronjAlpha2`、`Hardy Heron/Alpha3`、`HardyHeron/Alpha4`、`Hardy
  Heron/Alphas`、`HardyHeron/Alpha6`、`HardyHeron/Beta` 以及 `HardyHeron/RC`。


  通过 `Ubuntu Heron`，用户可以使用 `Gmail` 和 `Yahoo` 等不同的基于 Web 的邮件应用程序。该平台还带有 `Pidgin`，这是一个自由/开源软件。该应用程序允许用户连接其来自不同即时通讯程序（如
  `Yahoo Messenger`、`GTalk`、`WLM`、`IM`、`MySpace`、`AIM`、`Jabber` 和 `ICQ`）的所有联系人。


  此外，`Ubuntu Heron` 自带了 Web 浏览器 `Mozilla Firefox 3`，而其办公套件来自 `OpenOffice.org`。该套件使用
  ISO 标准的 `Open Document Format`（开放文档格式）。这意味着用户可以在 `Ubuntu Heron` 中创建文件，并使用任何办公软件打开这些办公文件。


  同时，用户可以自定义 `Ubuntu Heron`，特别是那些已经体验过使用 `Microsoft Vista` 的用户。许多批评者也说 `Ubuntu` 的界面与
  `Microsoft Vista` 的界面相似。唯一的区别是 `Ubuntu Heron` 可以轻松免费获取。


  ## 为 Ubuntu 操作系统获取免费应用程序


  在涉及到操作系统时，大多数电脑用户通常有两个选择。他可以是 `Microsoft` 或 `Mac OS` 用户。但随着开源免费操作系统的发布，这些商业操作系统现在面临着激烈的的竞争。当今最实用的、开源且免费的操作系统之一是
  `Ubuntu OS`。任何人都可以免费获得它，并永久免费更新操作系统。


  人们可以通过像 `Linux''s` 等许多可用网站下载免费的 `Ubuntu OS`。用户还可以请求通过邮件接收安装光盘。`Ubuntu OS` 最棒的一点是它不会立即在电脑中安装应用程序。它允许用户在许多免费应用程序中选择下载和安装。


  同时，仍然有一些程序会随着 `Ubuntu OS` 一起立即安装。这些是默认 Web 浏览器 `Firefox`；其即时通讯应用 `Pigeon`；以及包含电子表格、文字处理程序、幻灯片制作工具等在办公套件
  `OpenOffice`。


  `GIMP`、`Evolution`、`Rhythm Box`、`Movie Player` 和 `Blue Tooth` 是用户可以随 `Ubuntu OS`
  免费获得的其他程序。`GIMP` 是一个类似于 `Adobe Photoshop` 的图像编辑应用程序。`Evolution` 是预约调度程序、邮件客户端、日历以及类似于
  `Nero` 的 CD/DVD 刻录机。`Blue Tooth` 支持不同无线设备的应用程序。`Movie Player` 是多媒体播放器，`Rhythm Box`
  是音乐播放器。


  除了立即安装的免费应用程序外，用户还可以选择额外的程序，如免费音乐编辑器 `Audacity`；媒体 CD/DVD 播放器 `VLC` 以及动画和图形建模程序
  `Blender`。


  ## 了解并添加 Ubuntu 存储库


  `Ubuntu` 的优点之一是它不会立即安装程序。用户可以选择以后再添加程序，或者只安装他需要的支持程序。事实上，Ubuntu 电脑可以安装成千上万的应用程序。这些应用程序存储在称为
  `repositories`（存储库）的存档中，因此可以随时可用。


  此外，所有存储在 `Ubuntu repositories` 中的应用程序都经过了彻底的测试，并为 Ubuntu 操作系统制作。感兴趣从这些存储库安装应用程序的用户可以在四个
  Ubuntu 存储库组件中选择：`Main`、`Restricted`、`Universe` 和 `Multiverse`。


  `Main Repository` 包含所有 `Ubuntu` 官方支持的应用程序。同时，`Restricted Repository` 拥有所有在完全免费许可下不可用的
  `Ubuntu` 支持程序。另一方面，`Universe Repository` 存储了由社区维护的非 `Ubuntu` 官方支持的应用程序。最后，`Multiverse
  Repository` 存储了非免费的 `Ubuntu` 应用程序。






  Ubuntu 新手如果遇到问题，可以简单地访问 `help.ubuntu.com`，这是关于 Ubuntu 的官方文档。该网站还包含了许多用户可能感兴趣的常见问题。


  另一个非常有用的页面是 Ubuntu 社区文档维基。该网站有一个搜索框，可以在其中搜索关于 Ubuntu 的任何信息。另一个实用的 Ubuntu 帮助是 Ubuntu
  Web 论坛。在这里，人们提出一个问题，许多成员会尝试解决它。获取 Ubuntu 帮助的另一种方法是通过官方的 Ubuntu 用户邮件邮件列表。这是一份定期的电子邮件通讯，用于解答
  Ubuntu 用户的各种关注。IRC 聊天也是获取 Ubuntu 帮助的一种有效方式。然而，`#Ubuntu` 在白天可能会变得非常忙碌。但只要一点耐心，一定能在
  IRC 聊天中收获甜蜜的果实。


  除了官方 Ubuntu 帮助支持外，用户还可以从其他网站获得帮助。Ubuntu Guide 就是其中之一，它为 Ubuntu 初学者提供了指南。该网站在每次 Ubuntu
  更新时也会随之更新。


  用户还可以使用 Ubuntu 文档存储设施。这是几乎所有在论坛、博客和其他公共来源中产生的关于 Ubuntu 信息的中央存储库。其他有用的网站包括 Ubuntu
  Blogs、Ubuntu Tutorials、Ubuntu Geek、Simple Ubuntu Tutorial、Ubuntu Tips、Ubuntu Video
  Clips 以及 Ubuntu Tips and Helps。


  ### 1. Ubuntu 移动互联网设备版：无妥协的全方位上网


  Ubuntu 不仅作为桌面操作系统可用。较小的设备，如 PDA 手机，尤其是移动互联网设备，现在可以通过 Ubuntu Mobile（正式名称为 Ubuntu
  Mobile Internet Device Edition）享受 Ubuntu 的精美界面。


  为了让所有这些精彩功能成为可能，Ubuntu Mobile 使用了 `WiFi 2.0`，并提供了自定义 `AdobeFlash`、`Java` 和其他程序的选项。Ubuntu
  还具有高性能的媒体播放器，使用户可以用卓越的质量和便捷的导航查看照片、听音乐和看电影。Ubuntu Mobile 了一组对每个人的移动网络需求非常有用的应用程序。


  使用 Ubuntu Mobile 可以完成的操作包括 Web 浏览、图像捕捉、电子邮件、即时消息、媒体、越网络协议、博客、数字电视、GPS、日历、联系人、游戏、软件更新等。


  此外，Ubuntu Mobile 对触摸屏非常友好。用户不需要任何手写笔即可操作 Ubuntu。


  Ubuntu Mobile 在移动互联网设备的通用属性和功能方面也非常灵活。这些设备尺寸可以更小，拥有 4 到 7 英寸的触摸屏、虚拟键盘、`Bluetooth`、`WiFi`、`3G`、`WiMAX`、`GPS`、`OpenGL
  3D`、耳机接口、麦克风、扬声器、`USB`、摄像头和闪存存储。Ubuntu Mobile 支持这些以及更多常见的移动互联网设备功能。


  此外，用户可以通过 Ubuntu 的定制能力满足个人需求。由于其用户友好界面，在移动设备上使用 Ubuntu 非常容易。


