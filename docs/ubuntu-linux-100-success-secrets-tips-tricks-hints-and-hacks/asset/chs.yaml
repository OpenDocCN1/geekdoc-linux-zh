  ## 关于如何升级你的 Ubuntu 软件的热门提示


  Ubuntu 制作者（Canonical Limited 公司）发布的最新版本于 2008 年 10 月 30 日发布。最新版本代码 `Ubuntu 8.10`
  让许多 Ubuntu 用户考虑将他们当前的 Ubuntu 软件升级到最新版本。然而，在执行升级到最新版本之前，请仔细阅读以下提示和提醒：


  a. 这里的做法是，如果你有 `Ubuntu 8.04 LTS` 版本，系统不会提示也不会自动提供升级到 `Ubuntu 8.10` 的选项。背后的原因是 `Ubuntu
  8.10` 属于普通发行版，而 `8.04 LTS` 具有长期支持。


  b. 如果你想升级到 `8.10` 版本，那么你需要通过 Ubuntu 网站手动进行。从那里，你将遇到一个对话框，它为你提供将当前版本升级到最新版本的选项。


  c. 如果你有 `8.04 LTS` 版本，请确保在升级到最新版本之前已应用所有更新。这将允许在升级过程中对任何类似的更新（`8.04` 和 `8.10` 之间的更新）进行调和。


  d. 既然 `Ubuntu 8.10` 是一个新发布的版本，预计在使用操作系统期间可能会出现一些问题。建议在进行升级过程之前，认真阅读与 `Ubuntu 8.10`
  更新一同发布的发布说明。


  这些关于升级 Ubuntu 软件的提示和提醒将很好地引导任何 Ubuntu 用户采取正确的方向并做出正确的决策，甚至是在你实际上失败并后悔整个升级主意之前。


  ## 对 Ubuntu 组织结构的全面探索


  Ubuntu 系统是许多软件开发者使用的许多动态结构和架构的巨大组合。Ubuntu 系统使用的每个平台都构成了系统整体结构的一部分。


  许多软件专家和新手对 Ubuntu 组织的构建方式产生了极大的兴趣。对 Ubuntu 的框架和结构进行了各种探索，这些探索显著地产生了以下结果：


  a. Ubuntu 系统的主引擎由动态库链接组成，这在已开发的许多其他操作系统中也能找到。与许多其他操作系统不同，Ubuntu 系统的主引擎可以被任何爱好者修改。


  b. Ubuntu 结构的所有部分都是开源代码的一部分，并对任何可能的修改和更改开放。虽然可以复制这些部分，但由于代码的许多限制，这种操作方法几乎是不可能的。正是
  Ubuntu 的这种组织方式使其与其他操作系统相比非常独特。


  c. 在任何引擎部分都允许使用现代代码脚本。Ubuntu 的结构化和组织方式让任何用户都能轻松地进入修改和增强代码的领域。


