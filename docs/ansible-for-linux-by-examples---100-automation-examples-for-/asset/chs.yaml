  \ Ansible 模块\n\n在 Suse 类系统中管理某些特定配置。\n\nDebian 类系统上的 Apache 虚拟主机\n\n![img](img/ansible_service_httpd_vhost_debian.png)\n\
  \n针对 Suse 类系统的 Ansible Playbook 代码\n\n如何在 Suse 类系统中用 Ansible 安装软件包？\n\n让我们聊聊 `zypper`\
  \ 模块。\n\n它的全名是 `community.general.zypper`，这意味着它是 `Community General Collection`\
  \ 的一部分，由 Ansible 社区贡献者维护。\n\n它在 SUSE 和 openSUSE 上通过 `zypper` 软件包管理器管理软件包。\n\n它的功能类似于用于\
  \ RedHat 类操作系统的 `yum` 或 `DNF` 模块，类似于用于 Debian 类操作系统的 `apt` 模块。\n\n### 参数\n\n- `name`\
  \ 字符串 - 名称或特定软件包\n- `state` 字符串 - 存在/不存在/最新\n- `type` 字符串 - 包/补丁/模式/产品/源码/应用程序\n\
  - `update_cache` 布尔 - 否/是\n\n参数列表相当长，但这四个是重要的选项。\n\n在 `name` 参数中，你将指定要安装的软件包名称或特定版本。\n\
  \n`state` 指定要执行的操作。在我们的用例中，安装对应“present”。\n\n`type` 要操作的软件包类型：包/补丁/模式/产品/源码/应用程序。`update_cache`\
  \ 在安装前强制更新存储库元数据。这对于确保存储库是最新的非常有用。等同于命令行命令 `zypper refresh`。\n\n### 演示\n\n让我们进入一个真实的\
  \ Playbook，在 Suse 类系统中使用 Ansible 安装软件包。\n\n#### 代码\n\n*   zypper.yml\n\n```yaml\n\
  ---\n- name: zypper module demo\n  hosts: all\n  become: true\n  tasks:\n    - name:\
  \ install package\n      community.general.zypper:\n        name: dos2unix\n   \
  \     state: present\n```\n\n#### 执行结果\n\n输出\n\n\n\n\n\n```\n 1 $ ansible-playbook\
  \ -i suse/inventory install\\ a\\ package\\\\\n 2  in\\ Suse-like\\ systems/zypper.yml\n\
  \ 3 PLAY [zypper module demo] *******************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 [WARNING]: Platform linux on host suse.example.com is usi\\\n 8  ng the discovered\
  \ Python interpreter at\n 9 /usr/bin/python, but future installation of another\
  \ Pytho\\\n10 n interpreter could change the meaning of\n11 that path. See https://docs.ansible.com/ansible-\n\
  12 core/2.11/reference_appendices/interpreter_discovery.html\\\n13  for more information.\n\
  14 ok: [suse.example.com]\n15 TASK [install package] **********************************\\\
  \n 16 ******************************************\n17 changed: [suse.example.com]\n\
  18 PLAY RECAP **********************************************\\\n19 ******************************************\n\
  20 suse.example.com           : ok=2    changed=1    unreach\\\n21 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n```\n\n#### 验证\n\n```\n 1 $ ssh devops@suse.example.com\n\
