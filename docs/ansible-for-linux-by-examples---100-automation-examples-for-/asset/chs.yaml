  \ 上的 Docker 安装\n\n#### 教程：在 Debian 类系统（如 Ubuntu/Debian）上使用 Ansible 部署 Docker\n\n\
  #### 准备工作\n\n#### 已经：在 Debian 类系统上安装了 Ansible\n\n#### 简介\n\n本教程将介绍如何使用 Ansible 自动化地在\
  \ Debian 兼容的发行版（如 Ubuntu 或 Debian）上安装 Docker。\n\n#### 核心概念\n\n我们将使用 `apt` 软件包管理器和相关的\
  \ Ansible 模块来完成任务。\n\n在 Debian 类系统上安装 Docker。\n\n### 步骤\n\n在 Debian 类系统上安装 Docker，通常需要执行以下三个步骤：\n\
  \n1.  **安装必要的软件包**：使用 `ansible.builtin.apt` 模块安装 `apt-transport-https`、`ca-certificates`、`lsb-release`\
  \ 和 `gnupg`。\n2.  **添加签名密钥**：使用 `ansible.builtin.apt_key` 模块下载并添加 Docker 仓库的 GPG\
  \ 签名密钥。\n3.  **添加仓库**：使用 `ansible.builtin.apt_repository` 模块将 Docker 官方仓库添加到系统的源列表中。\n\
  4.  **安装 Docker**：最后，使用 `ansible.builtin.apt` 模块安装 Docker 软件包。\n\n#### Ansible Playbook\
  \ 示例\n\n以下是一个完整的 Ansible Playbook 示例：\n\n```yaml\n---\n- name: 安装 Docker\n  hosts:\
  \ all\n  become: true\n  tasks:\n    - name: 安装 apt-transport-https\n      ansible.builtin.apt:\n\
  \        name:\n          - apt-transport-https\n          - ca-certificates\n \
  \         - lsb-release\n          - gnupg\n        state: latest\n        update_cache:\
  \ true\n\n    - name: 添加签名密钥\n      ansible.builtin.apt_key:\n        url: \"https://download.docker.com/linux/{{\
  \ ansible_distribution | lower }}/gpg\"\n        state: present\n\n    - name: 将仓库添加到源列表\n\
  \      ansible.builtin.apt_repository:\n        repo: \"deb [arch={{ ansible_architecture\
  \ }}] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release\
  \ }} stable\"\n        state: present\n        filename: docker\n\n    - name: 安装\
  \ Docker\n      ansible.builtin.apt:\n        name:\n          - docker\n      \
  \    - docker.io\n          - docker-compose\n          - docker-registry\n    \
  \    state: latest\n```\n\n#### 预期输出\n\n运行此 Playbook 后，你应该将看到类似下面的输出（具体输出取决于你的系统状态）：\n\
  \n```text\nPLAY [安装 Docker] *****************************************\n******************************************\n\
  TASK [Gathering Facts] *************************************\n******************************************\n\
  ok: [demo.example.com]\n\nTASK [安装 apt-transport-https] *******************************\n\
  ******************************************\nchanged: [demo.example.com]\n...\n```\n\
  \n\n\n\n\n```\n 1 ---\n 2 - name: install Docker\n 3   hosts: all\n 4   become:\
  \ true\n 5   tasks:\n 6     - name: Install apt-transport-https\n 7       ansible.builtin.apt:\n\
  \ 8         name:\n 9           - apt-transport-https\n10           - ca-certificates\n\
  11           - lsb-release\n12           - gnupg\n13         state: latest\n14 \
  \        update_cache: true\n15 \n16     - name: Add signing key\n 17       ansible.builtin.apt_key:\n\
  \ 18         url: \"https://download.docker.com/linux/{{ ansibl\\\n19 e_distribution\
  \ | lower }}/gpg\"\n20         state: present\n21 \n22     - name: Add repository\
  \ into sources list\n 23       ansible.builtin.apt_repository:\n 24         repo:\
  \ \"deb [arch={{ ansible_architecture }}] http\\\n25 s://download.docker.com/linux/{{\
  \ ansible_distribution | l\\\n26 ower }} {{ ansible_distribution_release }} stable\"\
  \n27         state: present\n 28         filename: docker\n29 \n30     - name: Install\
  \ Docker\n 31       ansible.builtin.apt:\n 32         name:\n 33           - docker-ce\n\
  \ 34           - docker-ce-cli\n 35           - containerd.io\n36         state:\
  \ latest\n37         update_cache: true\n```\n\n#### 执行\n\n```\n 1 ansible-pilot\
  \ $ ansible-playbook -i virtualmachines/ubunt\\\n 2 u/inventory install\\ Docker/debian.yml\n\
  \ 3 PLAY [install Docker] ***********************************\\\n 4 ******************************************\n\
