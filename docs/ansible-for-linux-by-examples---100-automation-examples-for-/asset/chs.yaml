- "# Linux 的 Ansible 示例 - 面向 Linux 系统管理员和 DevOps 的 100+ 自动化示例\n\n\n\n![](img/title_page.png)\n\
  \n![基于示例的 Linux Ansible 实](img/title_page.png)\n\n\n\n\n本书可在 [`leanpub.com/ansibleforlinuxbyexamples`](http://leanpub.com/ansibleforlinuxbyexamples)\
  \ 购买。\n\n\n![出版商标志](img/leanpub-logo.png)\n\n* * * * * *\n\n这是一本来自 [Leanpub](https://leanpub.com)\
  \ 的书。Leanpub 通过精捷出版（Lean Publishing）流程，为作者和出版商提供支持。[精捷出版](https://leanpub.com/manifesto)\
  \ 是使用轻量级工具和多次迭代来发布进行中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在获得支持后建立影响力。\n\n* * * * * *\n\n\
  \n\n\n\n\n\n# 引言\n\n本书将介绍 `Ansible` 语言。\n\n`Ansible` 是一种流行的开源 IT 自动化技术，用于在各个领域进行应用程序脚本编写。它是免费、可移植、强大的，而且用起来非常简单且有趣。\n\
  \n本书是一本通过一些实战示例来学习 `Ansible` 自动化技术的工具。无论你是自动化领域的新手，还是一名专业的自动化工程师，本书的目标都是为了带你快速掌握核心\
  \ `Ansible` 语言的基础基础知识。\n\n如今，任何一个成功的 IT 部门都需要为裸机服务器、虚拟机、云提供商、容器和边缘计算实现自动化。使用 `Ansible`\
  \ 自动化技术让你的 IT 之旅自动化。\n\n我将通过一个一个的示例教你如何完成最常见的系统管理员任务。\n\n你将开始在红帽企业 Linux（Red Hat\
  \ Enterprise Linux）、Ubuntu 和 macOS 上安装 `Ansible`，使用最常用的软件包管理器和归档工具。\n\n 100 多节课程中的每一节都总结了一个模块：从最重要的参数到某些代码现场演示和实际用法。每段代码都已经在现实生活中经过了实战。每个视频都包含了控制台交互和验证。像创建文本文件、提取和归档、使用\
  \ `HTTPS` 或 `SSH` 连接获取仓库等单调活动，都可以几行代码实现自动化，而这些只是课程中包含的长列表中的一角。\n\n有些 `Ansible` 代码适用于所有\
  \ Linux 系统，有些则专门针对红帽类、Debian 类和 Windows 系统。\n\n20+ 节 `Ansible` 故障排除课程将教你如何阅读错误信息、如何复现问题，以及故障排除和解决的过程。\n\
  \n你准备好用 `Ansible` 自动化你的日常了吗？\n\n## 谁是 Luca Berton\n\n我是 Luca Berton，我们将一起度过许多愉快时光。首先，让我介绍一下。\n\
  \n我曾是位于捷克的红帽（Red Hat）`Ansible` 技术支持工程师，尽管我是意大利人。我有超过 15 年的系统管理经验，在基础设施方面工作，无论是本地还是在主要的云提供商。\n\
  \n我是开源支持的热爱好者，通过在不同的公共活动中分享我的知识来支持社区。我还是家乡 `Linux 用户小组`的联合创始人，自由软件运动创始人 Richard\
  \ Stallman 曾访问过那里。我认为自己是一个懒人，所以我总是尝试用新方法来使工作中重复性任务的自动化。\n\n在经历了多年的 `Perl`、`Bash`\
  \ 和 `python` 脚本编写后，我进入了 `Ansible` 技术。我通过了认证，并与 `Ansible Engineer` 团队工作了一多一年。\n\n\
  我认为 `Ansible` 是目前最好的基础设施自动化技术，它是人类可读的，学习曲线易于接受，并且非常受市场招聘人员的青睐。\n\n本终极指南包含了所有使用 `Ansible`\
  \ 自动化显而易见和不那么易见的解决方案。在课程的每一节中，我将与你分享一个特定的用例、可能的解决方案、代码、执行以及目标系统的验证。所有这些解决方案都经过了实战测试，并被我用于日常自动化。你可以轻松地在课程之间跳转，并在需要时随时复习。\n\
