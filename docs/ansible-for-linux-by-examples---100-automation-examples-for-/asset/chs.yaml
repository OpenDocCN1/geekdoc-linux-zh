  \ 共享。该 Ansible Playbook 代码的作用是检查所需的包、创建挂载点，并在 Linux 机器上使用 NFS4 协议设置 共享文件夹。适用于 RedHat\
  \ 类和 Debian 类系统。\n\n### Ansible 在 Linux 中挂载 NFS 共享\n\n今天我们来介绍 Ansible 的 `mount`\
  \ 模块。它的全称是 `ansible.posix.mount`，这意味着它是 `ansible.posix` 集合的一部分，用于与 POSIX 平台交互。该模块的目的是控制活动和已配置的挂载点。对于\
  \ Windows，请使用 `community.windows.win_mapped_drive` 模块。\n\n### 参数\n\n* `path` 字符串：挂载点（例如\
  \ `/mnt`）\n* `state` 字符串：已挂载 / 未挂载 / 存在 / 重新挂载\n* `src` 字符串：设备或网络卷\n* `fstype` 字符串：ext4,\
  \ xfs, iso9660, nfs, cifs, 等。\n* `opts` 字符串：挂载选项\n\n该模块有许多参数可以执行任何任务。仅必需的参数是 `path`\
  \ 和 `state`。\n\n`path` 参数指定挂载点的路径（例如 `/mnt/`）。`state` 参数允许我们验证挂载点的特定状态。`mounted`、`unmounted`\
  \ 和 `remounted` 会更改设备状态。`present` 和 `absent` 仅会更改 `/etc/fstab` 文件。\n\n`src` 参数指定用于\
  \ NFS 或 SMB/CIFS 的设备或网络卷。\n\n`fstype` 参数指定文件系统类型。例如 `ext4`、`XFS`、`iso9660`、`NFS`、`CIFS`\
  \ 等。\n\n`opts` 参数允许我们指定某些挂载选项，这些选项随文件系统类型而异。\n\n### 示例\n\n让我们进入真实的 Ansible Playbook，在\
  \ RedHat 类和 Debian 类 Linux 上挂载 NFS 共享。\n\n#### 代码\n\n* `mount_nfs.yml`\n\n```yaml\n\
  ---\n- name: mount module demo\n  hosts: all\n  become: true\n  vars:\n    mynfs:\
  \ \"192.168.0.200:/nfs/share\"\n    mountpoint: \"/share\"\n    permission: '0777'\n\
  \    myopts: 'rw,sync'\n  tasks:\n    - name: utility present redhat-like\n    \
  \  ansible.builtin.yum:\n        name:\n          - nfs-utils\n          - nfs4-acl-tools\n\
  \        state: present\n      when: ansible_os_family == 'RedHat'\n\n    - name:\
  \ utility present debian-like\n      ansible.builtin.apt:\n        name:\n     \
  \     - nfs-common\n          - nfs4-acl-tools\n        state: present\n      when:\
  \ ansible_os_family == 'Debian'\n\n    - name: check mountpoint exist\n      ansible.builtin.file:\n\
  \        path: \"{{ mountpoint }}\"\n        state: directory\n        mode: \"\
  {{ permission }}\"\n        owner: root\n        group: root\n\n    - name: mount\
  \ network share\n      ansible.posix.mount:\n        src: \"{{ mynfs }}\"\n    \
  \    path: \"{{ mountpoint }}\"\n        fstype: nfs\n        opts: \"{{ myopts\
  \ }}\"\n        state: mounted\n```\n\n#### 执行\n\n\n\n\n\n```\n 1 $ ansible-playbook\
  \ -i virtualmachines/demo/inventory mount/drive/nfs.yml\n 2 PLAY [mount module demo]\
