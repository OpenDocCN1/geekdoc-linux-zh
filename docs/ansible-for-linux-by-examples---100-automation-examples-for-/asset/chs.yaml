  - 将模板文件渲染到目标主机\n- `ansible_managed`, `template_host`, `template_uid`, `template_path`,\
  \ `template_fullpath`, `template_destpath`, 和 `template_run_date`\n\n今天我们讨论 Ansible\
  \ 模块 `template`。\n\n它的全名是 `ansible.builtin.template`，它是 `ansible-core` 的一部分，并包含在所有的\
  \ Ansible 安装中。\n\n它将模板文件渲染到目标主机。模板由 Jinja2 模板语言进行处理。\n\n此外，你可以在模板中使用一些特殊变量：`ansible_managed`,\
  \ `template_host`, `template_uid`, `template_path`, `template_fullpath`, `template_destpath`\
  \ 和 `template_run_date`。\n\n它支持多种操作系统。\n\n对于基础文本格式化，请使用 `ansible.builtin.copy` 模块，或者对于空文件使用\
  \ `ansible.builtin.file` 模块。\n\n对于 Windows，请使用 `ansible.windows.win_template` 模块。\n\
  \n### 参数\n\n- `src` 路径 - 模板（`templates/` 目录）\n- `dest` 路径 - 目标位置\n- `validate` 字符串\
  \ - 之前的验证命令（`%s`）\n- `backup` 布尔值 - no/yes\n- `mode`/`owner`/`group` - 权限\n- `setype`/seuser`/selevel`\
  \ - SELinux\n\n让我强调一下最有用的参数。\n\n必填参数是 `src` 和 `dest`。\n\n`src` 参数指定模板文件名。模板通常存储在\
  \ `templates` 目录下并以 `.j2` 扩展结尾。\n\n`dest` 参数指定在远程机器上渲染模板的路径。\n\n`validate` 参数允许你在复制之前指定验证命令。这对于服务配置文件非常有用。\n\
  \n请注意特殊转义序列 `%s` 将由 Ansible 展开为目标路径。\n\n如果启用了 `backup` 参数，Ansible 在拷贝到目标位置之前创建一个包含时间信息的备份文件。\n\
  \n### 演示\n\n使用 Ansible Playbook 应用文件模板\n\n#### 代码\n\n*   `template.yml`\n\n```yaml\n\
  \ 1 ---\n 2 - name: 模板模块演示\n 3   hosts: all\n 4   become: true\n 5   vars:\n 6 \
  \    page_title: \"占位符\"\n 7     page_description: |\n 8       这是我的占位符页面示例。\n 9\
  \       支持多行 ;-)\n 10   tasks:\n 11     - name: 安装 Nginx\n 12       ansible.builtin.apt:\n\
  \ 13         name: nginx\n 14         state: latest\n 15     - name: 应用页面模板\n 16\
  \       ansible.builtin.template:\n 17         src: templates/placeholder.html.j2\n\
  \ 18         dest: /var/www/html/index.html\n```\n\n\n\n\n\n- `templates/placeholder.html.j2`\n\
  \n```\n1 <html>\n2 <head>\n3   <title>{{ page_title }}</title>\n4 </head>\n5 <body>\n\
  6   <h1>{{ page_title }}</h1>\n7   <p>{{ page_description }}</p>\n8 </body>\n9 </html>\n\
  ```\n\n#### 执行过程\n\n```\n 1 $ ansible-playbook -i virtualmachines/ubuntu/inventory\
  \ ap\\\n 2 ply\\ template/template.yml\n 3 \n 4 PLAY [template module demo] *****************************\\\
  \n 5 ******************************************\n 6 \n 7 TASK [Gathering Facts]\
  \ **********************************\\\n 8 ******************************************\n\
  \ 9 ok: [ubuntu.example.com]\n10 \n 11 TASK [install Nginx] ************************************\\\
  \n 12 ******************************************\n 13 changed: [ubuntu.example.com]\n\
  \ 14 \n 15 TASK [apply page template] ******************************\\\n 16 ******************************************\n\
  \ 17 changed: [ubuntu.example.com]\n 18 \n 19 PLAY RECAP *********************************************\\\
  \n 20 ******************************************\n 21 ubuntu.example.com       \
  \  : ok=3    changed=2    unreach\\\n 22 able=0    failed=0    skipped=0    ignored=0\n\
  ```\n\n#### 执行前\n\n```\n 1 $ ssh devops@ubuntu.example.com\n 2 devops@ubuntu:~ $\
  \ sudo\n 3 root@ubuntu:/home/devops# lsb_release -a\n 4 No LSB modules are available.\n\
