  \ PowerShell 与 sudo become 插件不兼容\n\n如何复现、排查并解决 PowerShell shell family 与 sudo become\
  \ plugin 不兼容的 Ansible 运行时错误。\n\n### demo\n\n以下代码复现了实际上的“the PowerShell shell family\
  \ is incompatible with the sudo become plugin”错误以及其解决方法！\n\n#### 错误代码\n\n* `incompatiblesudo_error.yml`\n\
  \n```yaml\n---\n- name: win_reboot module demo\n  hosts: all\n  become: true\n \
  \ tasks:\n    - name: reboot host(s)\n      ansible.windows.win_reboot:\n```\n\n\
  #### 错误执行\n\n```\n1 $ ansible-playbook -i win/inventory troubleshooting/incompatiblesudo_error.yml\n\
  PLAY [win_reboot module demo] ***************************\n**********************************\n\
  TASK [Gathering Facts] *********************************\n**********************************\n\
  fatal: [WindowsServer]: FAILED! => {\"msg\": \"The powershell shell family is incompatible\
  \ with the sudo become plugin\"}\nPLAY RECAP **********************************************\n\
  **********************************\nWindowsServer              : ok=0    changed=0\
  \    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n```\n\n####\
  \ 修复代码\n\n* `incompatiblesudo_fix.yml`\n\n```yaml\n--- \n- name: win_reboot module\
  \ demo\n  hosts: all\n  become: false\n  tasks:\n    - name: reboot host(s)\n  \
  \    ansible.windows.win_reboot:\n```\n\n#### 修复执行\n\n```\n1 $ ansible-playbook\
  \ -i win/inventory troubleshooting/incompatiblesudo_fix.yml\nPLAY [win_reboot module\
  \ demo] ***************************\n**********************************\nTASK [Gathering\
  \ Facts] *********************************\n**********************************\n\
  ok: [WindowsServer]\nTASK [reboot host(s)] *********************************\n**********************************\n\
  changed: [WindowsServer]\nPLAY RECAP **********************************************\n\
  **********************************\nWindowsServer              : ok=2    changed=1\
  \    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n```\n\n#\
  \ 无密码账户\n\n如何复现“usermod: unlocking the user’s password would result in a passwordless\
  \ account.”错误以及其解决方法！\n\n### demo\n\n讨论 Ansible 故障排查的最佳方式是进入现场演示，向你实际展示 `usermod:\
  \ unlocking the user's password would result in a passwordless account.` 错误及其解决方法！\n\
  \n#### 错误代码\n\n* `passwordless_error.yml`\n\n```yaml\n---\n- name: user module demo\n\
  \  hosts: all\n  become: true\n  vars:\n    myuser: \"example\"\n  tasks:\n    -\
  \ name: create a disabled user\n      ansible.builtin.user:\n        name: \"{{\
  \ myuser }}\"\n        state: present\n        password_lock: true\n    - name:\
  \ enable user\n      ansible.builtin.user:\n        name: \"{{ myuser }}\"\n   \
  \     state: present\n        password_lock: false\n```\n\n#### 错误验证\n\n在目标系统中验证不存在名为\
  \ example 用户：\n\n```\n1 $ ssh devops@demo.example.com\nLast login: Tue Oct  5 09:35:24\
  \ 2021 from 192.168.0.100\n[devops@demo ~]$ sudo su -\nLast login: Tue Oct  5 09:34:55\
  \ UTC 2021 on pts/0\n[root@demo ~]# getent passwd | grep example\n[root@demo ~]#\
  \ exit\nlogout\n[devops@demo ~]$ exit\nlogout\n```\n\n#### 错误执行\n\n输出\n\n```\n1\
  \ $ ansible-playbook -i demo/inventory troubleshooting/passwordless_error.yml\n\
  PLAY [user module demo] *********************************\n**********************************\n\
  TASK [Gathering Facts] *********************************\n**********************************\n\
  ok: [demo.example.com]\nTASK [create a disabled user] ***************************\n\
  **********************************\nchanged: [demo.example.com]\nTASK [enable user]\
  \ *************************************\n**********************************\nfatal:\
  \ [demo.example.com]: FAILED! => {\"changed\": false,\n \"msg\": \"usermod: unlocking\
  \ the user's password would result in a passwordless account.\\nYou should set a\
  \ password with usermod -p to unlock this user's password.\\n\", \"name\": \"example\"\
  , \"rc\": 1}\nPLAY RECAP **********************************************\n**********************************\n\
  demo.example.com           : ok=2    changed=1    unreachable=0    failed=1    skipped=0\
  \    rescued=0    ignored=\n```\n\n#### 修复代码\n\n* `passwordless_fix.yml`\n\n```yaml\n\
  ---\n- name: user module demo\n  hosts: all\n  become: true\n  vars:\n    myuser:\
  \ \"example\"\n    mypassword: \"password\"\n  tasks:\n    - name: create a disabled\
  \ user\n      ansible.builtin.user:\n        name: \"{{ myuser }}\"\n        state:\
  \ present\n        password_lock: true\n    - name: enable user\n      ansible.builtin.user:\n\
  \        name: \"{{ myuser }}\"\n        password: \"{{ mypassword | password_hash('sha512')\
  \ }}\"\n        state: present\n        password_lock: false\n```\n\n#### 修复执行\n\
  \n输出\n\n```\n1 $ ansible-playbook -i demo/inventory troubleshooting/passwordless_fix.yml\n\
  PLAY [user module demo] *********************************\n**********************************\n\
  TASK [Gathering Facts] *********************************\n**********************************\n\
  ok: [demo.example.com]\nTASK [create a disabled user] ***************************\n\
  **********************************\nok: [demo.example.com]\nTASK [enable user] *************************************\n\
  **********************************\nchanged: [demo.example.com]\nPLAY RECAP **********************************************\n\
  **********************************\ndemo.example.com           : ok=3    changed=1\
  \    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n```\n\n####\
  \ 修复验证\n\n```\n1 $ ssh devops@demo.example.com\nLast login: Tue Oct  5 09:37:07\
  \ 2021 from 192.168.0.100\n[devops@demo ~]$ sudo su -\nLast login: Tue Oct  5 09:35:42\
  \ UTC 2021 on pts/0\n[root@demo ~]# getent passwd | grep example\nexample:x:1002:1002::/home/example:/bin/bash\n\
  [root@demo ~]# passwd -S example\nexample PS 2021-10-05 0 99999 7 -1 (Password set,\
  \ SHA512.)\n[root@demo ~]# grep example /etc/shadow\nexample:$6$kg63VBL5Hw3AwjQt$GSn.Z7h3/ipgaY2p0ypSrymLN/2.lhZnMeONjkiaYc5o7R6TkfHtPJyXmKqoW3IQxw6Udxb2khiJ8NCVo4KM1:18905:0:99999:7:::\n\
  ```\n\n\n\n\n讨论 Ansible 故障排除的最佳方法是进入实战演示，向你实际展示用户模块的 bug 筛查以及可能的解决方案！\n\n### 错误代码\n\
  \n* `userbug_error.yml`\n\n```\n 1 ---\n 2 - name: user module demo\n 3   hosts:\
  \ all\n 4   become: true\n 5   vars:\n 6     myuser: \"example\"\n 7   tasks:\n\
  \ 8     - name: password expiration\n 9       ansible.builtin.user:\n10        \
  \ name: \"{{ myuser }}\"\n11         password_expire_min: 7\n12         password_expire_max:\
  \ 90\n```\n\n### 错误执行\n\n```\n 1 $ ansible-playbook -i demo/inventory troubleshooting/user\\\
  \n 2 bug_error.yml.yml\n 3 PLAY [user module demo] *********************************\\\
  \n 4 *************************************************\n 5 TASK [Gathering Facts]\
  \ **********************************\\\n 6 *************************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [password expiration] ******************************\\\
  \n 9 *************************************************\n10 changed: [demo.example.com]\n\
  11 PLAY RECAP **********************************************\\\n12 *************************************************\n\
  13 demo.example.com           : ok=2    changed=1    unreach\\\n14 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n15 ansible-pilot $ ansible-playbook -i\
  \ demo/inventory user\\ \\\n16 expiration/user.yml\n17 PLAY [user module demo] *********************************\\\
  \n18 *************************************************\n19 TASK [Gathering Facts]\
  \ **********************************\\\n20 *************************************************\n\
  21 ok: [demo.example.com]\n22 TASK [password expiration] ******************************\\\
  \n23 *************************************************\n24 ok: [demo.example.com]\n\
  25 PLAY RECAP **********************************************\\\n26 *************************************************\n\
  27 demo.example.com           : ok=2    changed=0    unreach\\\n28 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n29 ansible-pilot $ ssh devops@demo.example.com\n\
  30 Last login: Mon Nov  8 17:09:16 2021 from 192.168.43.5\n31 [devops@demo ~]$ sudo\
  \ su\n32 [root@demo devops]# chage -l example\n33 Last password change     : Nov\
  \ 08, 2021\n34 Password expires     : Feb 06, 2022\n35 Password inactive     : never\n\
  36 Account expires      : never\n37 Minimum number of days between password change\
  \  : 0\n38 Maximum number of days between password change  : 90\n39 Number of days\
  \ of warning before password expires : 7\n```\n\n我们期望 `Minimum number of days between\
  \ password change`（密码更改之间的最小天数）的值为 `7`，但我们得到了 `0`。\n\n### 故障排除\n\n* [用户报告 - 用户模块无法正确处理密码过期参数\
  \ #75017](https://github.com/ansible/ansible/issues/75017)\n* [拉取请求 - 用户模块密码过期修复\
  \ #75390](https://github.com/ansible/ansible/pull/75390)\n\n### 解决方案\n\n* `userbug_workaround.yml`\n\
  \n```\n 1 ---\n 2 - name: user module demo\n 3   hosts: all\n 4   become: true\n\
  \ 5   vars:\n 6     myuser: \"example\"\n 7   tasks:\n 8     - name: password min\
  \ expiration\n 9       ansible.builtin.user:\n10         name: \"{{ myuser }}\"\n\
  11         password_expire_min: 7\n12 - name: password max expiration\n13      \
  \ ansible.builtin.user:\n14         name: \"{{ myuser }}\"\n15         password_expire_max:\
  \ 90\n```\n\n### 解决方案执行\n\n```\n 1 $ ansible-playbook -i demo/inventory troubleshooting/user\\\
  \n 2 bug_workaround.yml\n 3 PLAY [user module demo] *********************************\\\
  \n 4 *************************************************\n 5 TASK [Gathering Facts]\
  \ **********************************\\\n 6 *************************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [password min expiration] **************************\\\
  \n 9 *************************************************\n10 changed: [demo.example.com]\n\
  11 TASK [password max expiration] **************************\\\n12 *************************************************\n\
  13 ok: [demo.example.com]\n14 PLAY RECAP **********************************************\\\
  \n15 *************************************************\n16 demo.example.com    \
  \       : ok=3    changed=1    unreach\\\n17 able=0    failed=0    skipped=0   \
  \ rescued=0    ignored=0\n18 ansible-pilot $ ssh devops@demo.example.com\n19 Last\
  \ login: Wed Nov 10 10:38:59 2021 from 192.168.43.5\n20 [devops@demo ~]$ sudo su\n\
  21 [root@demo devops]# chage -l example\n22 Last password change     : Nov 08, 2021\n\
  23 Password expires     : Feb 06, 2022\n24 Password inactive     : never\n25 Account\
  \ expires      : never\n26 Minimum number of days between password change  : 7\n\
  27 Maximum number of days between password change  : 90\n28 Number of days of warning\
  \ before password expires : 7\n```\n\n## Ansible 故障排除 - urlopen 错误\n\n如何在 Ansible\
  \ 中复现 urlopen 错误、进行故障排除并修复，以便在你的 playbook 中成功打开 URL。\n\n错误或拼写错误的 URL 会导致 `urlopen\
  \ error`。\n\n另请：\n* 向 REST API 端点发送 GET 请求 - 与 Web 服务交互 - Ansible module uri\n*\
  \ REST API 中基于令牌的身份验证 - 与 Web 服务交互 - Ansible module uri - 使用 REST API 令牌进行请求\n\n\
  ### 演示\n\n讨论 Ansible 故障排除的最佳方法是进入实战演示，向你实际展示 `urlopen error` 以及如何解决它！\n\n### 错误代码\n\
  \n* `urlopen_error.yml`\n\n```\n 1 ---\n 2 - name: uri module demo\n 3   hosts:\
  \ all\n 4   become: false\n 5   vars:\n 6     server: \"https://reqres.it\"\n 7\
  \     endpoint: \"/api/users?page=2\"\n 8   tasks:\n 9     - name: list users\n\
  10       ansible.builtin.uri:\n11         url: \"{{ server }}{{ endpoint }}\"\n\
  12         method: GET\n13         status_code: 200\n14         timeout: 30\n15\
  \       register: result\n16 \n17     - name: debug\n18       ansible.builtin.debug:\n\
  19         var: result.json.data\n```\n\n### 错误执行\n\n```\n 1 $ ansible-playbook\
  \ -i virtualmachines/demo/inventory trou\\\n 2 bleshooting/urlopen_error.yml\n 3\
  \ PLAY [uri module demo] **********************************\\\n 4 ***********************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ***********************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [list users] ***************************************\\\
  \n 9 ***********************\n10 fatal: [demo.example.com]: FAILED! => {\"changed\"\
  : false, \\\n11 \"elapsed\": 15, \"msg\": \"Status code was -1 and not [200]: \\\
  \n12 Request failed: <urlopen error [Errno -2] Name or service\\\n13  not known>\"\
  , \"redirected\": false, \"status\": -1, \"url\": \"\\\n14 https://reqres.it/api/users?page=2\"\
  }\n15 PLAY RECAP **********************************************\\\n 16 ***********************\n\
  17 demo.example.com           : ok=1    changed=0    unreach\\\n18 able=0    failed=1\
  \    skipped=0    rescued=0    ignored=0\n```\n\n### 修复代码\n\n* `urlopen_fix.yml`\n\
  \n```\n 1 ---\n 2 - name: uri module demo\n 3   hosts: all\n 4   become: false\n\
  \ 5   vars:\n 6     server: \"https://reqres.in\"\n 7     endpoint: \"/api/users?page=2\"\
  \n 8   tasks:\n 9     - name: list users\n10       ansible.builtin.uri:\n11    \
  \     url: \"{{ server }}{{ endpoint }}\"\n12         method: GET\n13         status_code:\
  \ 200\n14         timeout: 30\n15       register: result\n16 \n17     - name: debug\n\
  18       ansible.builtin.debug:\n19         var: result.json.data\n```\n\n\n\n\n\
  ## Ansible 故障排除 - 目标不存在 (destination does not exist)\n\n如何在 Ansible 中重现“目标不存在”错误、进行故障排除以及修复，以便能够通过\
  \ Ansible Playbook 成功地从 URL 下载文件到主目录。\n\n在 `dest` 参数中使用本地路径会导致 `destination does\
  \ not exist` 错误。\n\n另请：下载文件 - Ansible module get_url。\n\n### 演示\n\n讨论 Ansible 故障排除的最佳方法是进入现场演示，向你实际展示\
  \ `destination does not exist error` 以及如何解决它！\n\n#### 错误代码\n\n* `destinationdoesnotexist_error.yml`\n\
