  \ devops]#\n```\n\n# 在 Linux 中加载和卸载内核模块 - Ansible 模块 modprobe\n\n如何使用 Ansible 在示例机器上自动实现带有参数的“dummy”内核模块加载。\n\
  \n## 使用 Ansible 在 Linux 中加载和卸载内核模块\n\n* `community.general.modprobe`\n* 加载或卸载内核模块\n\
  \n今天我们来介绍 Ansible 模块 `modprobe`。\n\n它的全称是 `community.general.modprobe`，这意味着它是 Ansible\
  \ 社区维护的“community.general”模块集合中的一部分。\n\n该模块的目的是加载或卸载内核模块。\n\n### 参数\n\n* `name`\
  \ string - 内核模块名称\n* `params` string - 模块参数\n* `state` string - present（存在）/absent（不存在）-\
  \ 加载 / 卸载\n\n模块 [`modprobe`](https://docs.ansible.com/ansible/latest/collections/community/general/modprobe_module.html)\
  \ 的参数。\n\n唯一必需参数是 `name`，即完整的 Linux 内核模块名称。\n\n`params` 参数允许您指定某些模块参数。默认为空字符串。\n\
  \n`state` 参数指定 Linux 内核模块的状态。选项 `present` 意味着模块必须加载。选项 `absent` 意味着模块必须被卸载。\n\n\
  ### demo\n\n使用 Ansible Playbook 在 Linux 中加载和卸载内核模块。\n\n#### code\n\n```yaml\n 1\
  \ ---\n 2 - name: modprobe module demo\n 3   hosts: all\n 4   become: true\n 5 \
  \  vars:\n 6     module_name: \"dummy\"\n 7     module_params: \"numdummies=2\"\n\
  \ 8   tasks:\n 9     - name: load the module\n10       community.general.modprobe:\n\
  11         name: \"{{ module_name }}\"\n12         state: present\n13         params:\
  \ \"{{ module_params }}\"\n```\n\n### execution\n\n```bash\n 1 $ ansible-playbook\
  \ -i virtualmachines/demo/inventory modp\\\n 2 robe/modprobe.yml\n 3 PLAY [modprobe\
  \ module demo] *****************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [Add the dummy module] *****************************\\\
