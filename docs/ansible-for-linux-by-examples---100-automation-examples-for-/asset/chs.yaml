  \         =ok\n****************************************************************************************************\n\
  \nok: ************************************************************************************************\n\
  \nRECAP *************************************************************************************\n\
  localhost                  : ok=5    changed=0    reachable=1\n```\n\n\n\n\n\n```\n\
