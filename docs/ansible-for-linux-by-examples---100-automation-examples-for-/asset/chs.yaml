  \ Ansible 错误、如何排错以及修复。\n\n## Ansible 故障排除 - 连接失败\n\n连接失败错误是 Ansible 最常见的问题之一。\n\n\
  这类问题的根源直接取决于网络。因此，请切换到 `ssh` 命令行并像排查 `ssh` 连接错误一样进行调试。\n\n在接下来的示例中，`Operation timed\
  \ out`（操作超时）是因为虚拟机没有启用网卡。\n\n### 链接\n\n- [网络调试与故障排除指南](https://docs.ansible.com/ansible/latest/network/user_guide/network_debug_troubleshooting.html)\n\
  \n### 演示\n\n讨论 Ansible 故障排除的最佳方法是进入现场演示，向你实际展示连接失败错误以及如何解决它！\n\n#### 错误\n\nAnsible\
  \ 依赖于与目标机器的 `SSH` 连接。让我们尝试手动操作：\n\n```\n1 $ ssh username@hostname\n2 Failed to connect\
  \ to the host via ssh: ssh: connecto to h\\\n3 ost hostname port 22: Operation timed\
  \ out\n```\n\n你需要验证源机器和目标机器之间的网络连接。\n\n#### 修复\n\n一旦修复了网络连接，你就可以成功连接到目标机器。\n\n```\n\
  1 $ ssh username@hostname\n2 username@hostname:~$ \n```\n\n## Ansible 故障排除 - macOS\
  \ fork 错误\n\n如何排查自 macOS 10.13 High Sierra 以来可能 macOS fork 错误。\n\n### 演示\n\n讨论 Ansible\
  \ 故障排除的最佳方法是进入现场演示，向你实际展示 macOS fork 错误以及如何解决它！\n\n#### 错误\n\n```\n1 objc[22868]:\
  \ +[__NSCFConstantString initialize] may have \\\n2 been in progress in another\
  \ thread when fork() was called\\\n3 .\n4 objc[22868]: +[__NSCFConstantString initialize]\
  \ may have \\\n5 been in progress in another thread when fork() was called\\\n6\
  \ . We cannot safely call it or ignore it in the fork() chi\\\n7 process. Crashing\
  \ instead. Set a breakpoint on objc_in\\\n8 itializeAfterForkError to debug.\n```\n\
  \n#### 修复当前会话\n\n- fix - 仅限当前会话\n\n```\n1 export \"OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES\"\
  \n```\n\n#### 修复所有未来的会话\n\n- fix - 针对所有未来的会话\n\n```\n1 echo \"OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES\"\
  \ >> .bash_p\\\n2 profile\n```\n\n你可以通过以下命令验证终端的环境：\n\n```\n1 $ env\n2 [...]\n3\
  \ OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES\n```\n\n## Ansible 故障排除 - 缩进错误\n\n缩进错误是\
  \ Ansible 最常见的问题之一。在现场演示中，我们将从错误消息开始进行故障排除。我们将调查该问题的根源并将其修复。\n\n### 演示\n\n``````\n\
  \ 1 ---\n2 - name: blockinfile module demo\n3   hosts: all\n4   become: true\n5\
  \   tasks:\n6 - name: Generate /etc/hosts file\n7   ansible.builtin.blockinfile:\n\
  8     state: present\n9     dest: /etc/hosts\n10     content: |\n11       192.168.0.200\
  \ demo demo.example.com\n```\n\n#### 修复\n\n```\n 1 ---\n2 - name: blockinfile module\
  \ demo\n3   hosts: all\n4   become: true\n5   tasks:\n6   - name: Generate /etc/hosts\
  \ file\n7       ansible.builtin.blockinfile:\n8         state: present\n9      \
  \   dest: /etc/hosts\n10         content: |\n11           192.168.0.200 demo demo.example.com\n\
  ```\n\n## Ansible 故障排除 - 语法错误\n\n让我们一起排查 Ansible 致命错误“Syntax Error while loading\
  \ YAML”，以找到 Playbook 代码中的问题行、根源、修复缺失的引号，并验证修复是否有效。\n\n### 演示\n\n#### 错误代码\n\n- `report.txt`\n\
  \n```\n1 test report.txt\n```\n\n- `syntax_error.yml`\n\n```\n 1 ---\n2 - name:\
  \ win_copy module demo\n3   hosts: all\n4   become: false\n5   gather_facts: false\n\
  6   vars:\n7     source: \"report.txt\"\n8     destination: \"Desktop/report.txt\"\
  \n9   tasks:\n10     - name: copy report.txt\n11       ansible.windows.win_copy:\n\
  12         src: \"{{ source }}\"\n13         dest: \"{{ destination }}\n```\n\n\
  #### 错误执行\n\n```\n 1 $ ansible-playbook -i win/inventory troubleshooting/synta\\\
  \n2 x_error.yml\n3 ERROR! We were unable to read either as JSON nor YAML, th\\\n\
  4 these are the errors we got from each:\n5 JSON: Expecting value: line 1 column\
  \ 1 (char 0)\n6 \n7 Syntax Error while loading YAML.\n8 found unexpected end of\
  \ stream\n9 \n10 The error appears to be in 'ansible-pilot/troubleshooting\\\n11\
  \ /syntax_error.yml': line 14, column 1, but may\n12 be elsewhere in the file depending\
  \ on the exact syntax pr\\\n13 oblem.\n14 \n15 The offending line appears to be:\n\
  16 \n17 src: \"{{ source }}\"\n18 dest: \"{{ destination }}\"\n19 ^ here\n20 We\
  \ could be wrong, but this one looks like it might be an\\\n21 issue with missing\
  \ quotes. Always quote template expression brackets\\\n22 when they start a value.\
  \ For instance:\n23 \n24 with_items:\n25 - {{ foo }}\n26 \n27 Should be written\
  \ as:\n28 \n29 with_items:\n30 - \"{{ foo }}\"\n```\n\n#### 修复代码\n\n- `syntax_fix.yml`\n\
  \n```\n 1 ---\n2 - name: win_copy module demo\n3   hosts: all\n4   become: false\n\
  5   gather_facts: false\n6   vars:\n7     source: \"report.txt\"\n8     destination:\
  \ \"Desktop/report.txt\"\n9   tasks:\n10     - name: copy report.txt\n11       ansible.windows.win_copy:\n\
  12         src: \"{{ source }}\"\n13         dest: \"{{ destination }}\"\n```\n\n\
  \n\n\n\n```\n 1 $ ansible-playbook -i win/inventory troubleshooting/syntax_fix.yml\n\
  \ 3 \n 4 PLAY [win_copy module demo] *****************************\n 5 ******************************************\n\
  \ 6 \n 7 TASK [copy report.txt] *********************************\n 8 ******************************************\n\
  \ 9 ok: [WindowsServer]\n10 \n11 PLAY RECAP **********************************************\n\
  12 ******************************************\n13 WindowsServer              : ok=1\
  \    changed=0    unreachable\n14 able=0    failed=0    skipped=0    rescued=0 \
  \   ignored=0\n```\n\n# Ansible 故障排除 - 未定义变量\n\n如何在 Ansible 中重现未定义变量错误、进行故障排除并修复，以便能够成功在屏幕上打印变量的值。\n\
  \n### 演示\n\n讨论 Ansible 故障排除最好的方法进入现场演示，向你直观展示未定义变量错误以及如何解决它！\n\n### 错误代码\n\n* `underfinedvariable_error.yml`\n\
  \n```yaml\n1 ---\n2 - name: debug module demo\n3   hosts: all\n4   tasks:\n5   \
  \  - name: debug message\n6       ansible.builtin.debug:\n7         msg: \"{{ fruit\
  \ }}\"\n```\n\n### 错误执行\n\n```bash\n 1 $ ansible-playbook troubleshooting/undefinedvariable_error.yml\n\
  \ 3 \n 4 PLAY [file module demo] *********************************\n 5 ******************************************\n\
  \ 6 \n 7 TASK [Gathering Facts] *********************************\n 8 ******************************************\n\
  \ 9 ok: [demo.example.com]\n10 \n11 TASK [debug message] ************************************\n\
  12 ******************************************\n13 fatal: [demo.example.com]: FAILED!\
  \ => {\"msg\": \"The task includes an option with an undefined variable. The error\
  \ was as: 'fruit' is undefined\\n\\nThe error appears to be in '/Users/lberton/prj/github/ansible-pilot/troubleshooting/undefinedvariable_error.yml':\
  \ line 5, column 7, but may be elsewhere in the file depending on the exact syntax\
  \ problem.\\n\\nThe offending line appears to be:\\n\\n  tasks:\\n  - name: debug\
  \ message\\n      ^ here\\n\"}\n21 \n22 PLAY RECAP **********************************************\n\
  23 ******************************************\n24 demo.example.com           : ok=1\
  \    changed=0    unreachable\n25 able=0    failed=1    skipped=0    rescued=0 \
  \   ignored=0\n```\n\n### 修复代码\n\n* `underfinedvariable_fix.yml`\n\n```yaml\n1 ---\n\
  2 - name: debug module demo\n3   hosts: all\n4   vars:\n5     fruit: \"apple\"\n\
  6   tasks:\n7     - name: debug message\n8       ansible.builtin.debug:\n9     \
  \    msg: \"{{ fruit }}\"\n```\n\n### 修复执行\n\n```bash\n 1 $ ansible-playbook troubleshooting/undefinedvariable_fix.yml\n\
  \ 3 \n 4 PLAY [debug module demo] ********************************\n 5 ******************************************\n\
  \ 6 \n 7 TASK [Gathering Facts] *********************************\n 8 ******************************************\n\
  \ 9 ok: [demo.example.com]\n10 \n11 TASK [debug message] ************************************\n\
