  \ 系统上安装 flatpak\n\n使用 Ansible `community.general.flatpak` 模块在类 Debian 系统上自动化安装 `flatpak`。该模块由\
  \ `community.general` 维护。\n\n## 模块概述\n\n`community.general.flatpak` 模块用于管理 flatpak\
  \ 软件包。\n\n### 参数说明\n\n- `name`: flatpak 软件包名称。\n- `state`: 软件包状态，可选 `present` 或\
  \ `absent`。\n- `method`: 安装范围，可选 `system`（默认）或 `user`（用户级）。\n- `remote`: 远程仓库地址，默认为\
  \ `flathub`。\n- `no_dependencies`: 是否忽略依赖项，默认为 `no`。\n- `executable`: flatpak 可执行文件的路径。\n\
  \n## 使用示例\n\n以下是一个通过 Ansible Playbook 安装 `Zoom` 软件的示例。\n\n### 代码块\n\n```yaml\n---\n\
  - name: flatpak demo\n  hosts: all\n  become: true\n  gather_facts: false\n  tasks:\n\
  \    - name: flatpak present\n      ansible.builtin.apt:\n        name: flatpak\n\
  \        state: present\n\n    - name: flathub flatpak repo\n      community.general.flatpak_remote:\n\
  \        name: flathub\n        state: present\n        flatrepo_url: https://dl.flathub.org/repo/flatpak.flatpakrepo\n\
  \        method: system\n\n    - name: install Zoom via flatpak\n      community.general.flatpak:\n\
  \        name: us.zoom\n        state: present\n        method: system\n```\n\n\
