  \ 29 <p>这是我的占位符示例。\n 30 支持多行 ;-)\n 31 </p>\n 32 </body>\n```\n\n## 在文件模板中使用循环 -\
  \ Ansible 模块 - 生成主机\n\n如何在文件模板中使用循环并到目标主机？这对于配置文件、网页等许多场景非常有用。\n\n我将通过一些简单的代码向你展示现场演示。欢迎收看今天的\
  \ Ansible 节目。\n\n### 文件模板中的 Ansible 循环\n\n`ansible.builtin.template`\n\n- 将文件模板化到目标主机\n\
  - `ansible_managed`, `template_host`, `template_uid`, `template_path`, `template_fullpath`,\
  \ `template_destpath`, 和 `template_run_date`\n\n今天我们讨论的是 `template` 模块。它的全名是 `ansible.builtin.template`，它是\
  \ `ansible-core` 的一部分，包含在所有的 Ansible 安装中。它使用 Jinja2 语言将文件模板化到目标主机。你还可以在模板中使用特殊变量：`ansible_managed`、`template_host`、`template_uid`、`template_path`、`template_fullpath`、`template_destpath`\
  \ 以及 `template_run_date`。\n\n它支持多种操作系统。对于基本的文本格式，请使用 `ansible.builtin.copy` 模块，或者对于空文件使用\
  \ `ansible.builtin.file` 模块。对于 Windows，请使用 `ansible.windows.win_template` 模块。\n\n\
  ### 参数\n\n- `src`: 路径 (`templates/`)\n- `dest`: 位置\n- `validate`: 字符串（%s` 之前的验证命令）\n\
  - `backup`: 布尔值（no/yes）\n- `mode`/`owner`/`group`: 权限\n- `setype`/`seuser`/`selevel`:\
  \ SELinux\n\n对于 `template` 模块，唯一的必需参数是 `src` 和 `dest`。`src` 参数指定模板文件名。模板通常存储在 `templates`\
  \ 目录下并带有 `.j2` 扩展名。`dest` 参数指定远程机器上渲染模板的路径。`validate` 参数允许你指定在拷贝之前运行的验证命令。这对于服务的配置文件非常有用。请注意，特殊转义序列\
  \ `%s` 将由 Ansible 替换为目标路径。如果启用了 `backup` 参数，Ansible 会拷贝之前创建一个包含时间信息的备份文件。此外我强调，我们还可以指定权限和\
  \ SELinux 属性。\n\n### 演示\n\n使用 Ansible Playbook 在文件模板中使用循环。你可以在这里找到更多关于魔法变量的信息：https://docs.ansible.com/ansible/latest/reference_appendices/special_variables.html\n\
  \n\n\n\n```\n1 $ ssh devops@demo.example.com\n2 Last login: Tue Nov 23 17:10:30\
  \ 2021 from 192.168.0.101\n3 [devops@demo ~]$ sudo su\n4 [root@demo devops]# ls\
  \ -al /etc/myhosts\n5 ls: cannot access '/etc/myhosts': No such file or directo\\\
  \n6 ry\n7 [root@demo devops]# \n```\n\n#### 执行后\n\n```\n 1 $ ssh devops@demo.example.com\n\
