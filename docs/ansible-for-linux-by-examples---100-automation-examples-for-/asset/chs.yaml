  \ 系统中安装软件包 - Ansible 模块 yum\n\n\n\n\n\n在类 RedHat 系统中安装软件包以及特定版本的软件包：RedHat Enterprise\
  \ Linux, CentOS, CentOS Stream, Fedora, ClearOS, Oracle Linux, EuroLinux, Fermi\
  \ Linux, EulerOS, ROSA Linux, Springdale Linux, Asianux。\n\n### 使用 Ansible 在类 RedHat\
  \ 系统中安装软件包\n\n让我们聊聊 Ansible 模块 `YUM` 和 `DNF`。\n\n它们的全称为为 `ansible.builtin.yum` 和\
  \ `ansible.builtin.dnf`，这意味着它们是 ansible 内置（builtin）模块集合的一部分并随 ansible 一起发布。\n\n\
  这些模块非常稳定，已经发布了多年。\n\n它们运行在类 RedHat 操作系统上，并使用 `yum`/`DNF` 软件包管理器管理软件包。\n\n出于兼容性考虑，你可能使用\
  \ `yum` 模块多于 `DNF` 模块，因为后者是为现代操作系统设计的。\n\n### 主要参数\n\n* `name` 字符串\n* `state` 字符串\n\
  * `update_cache` 布尔值\n* `allow_downgrade` 布尔值\n\n参数列表很广泛，但这四个是最重要的选项。\n\n在 `name`\
  \ 参数中，你将指定要安装的软件包名称或特定版本。\n\n`state` 指定了我们想要执行的操作。在我们的案例中，安装的操作是“present or installed”（存在或已安装）。\n\
  \n我想提到一些可能对你有用的额外参数。\n\n例如，`update_cache` 强制在安装之前更新存储库元数据。这对于确保存储库是最新的可能很有用。\n\n\
  `allow_downgrade` 是一个有趣的选项，允许你安装当前已安装软件包的旧版本（降级过程），默认禁用。\n\n### 演示\n\n如何使用 Ansible\
  \ 在类 RedHat 系统中安装软件包。\n\n#### 单个软件包\n\n* 软件包安装\n\n```\n1 ---\n2 - name: yum module\
  \ demo\n3   hosts: all\n4   become: true\n5   tasks:\n6     - name: install package\n\
  7       yum:\n8         name: wget\n9         state: present\n```\n\n#### 特定软件包版本\n\
  \n* 特定软件包版本\n\n```\n 1 ---\n 2 - name: yum module demo\n3   hosts: all\n4   become:\
  \ true\n5   tasks:\n6     - name: install package\n7       yum:\n8         name:\
  \ wget11.19.5-7.el8\n9         state: present\n10         allow_downgrade: true\n\
  ```\n\n## 类 RedHat 系统的滚动更新 - Ansible 模块 yum\n\n保持机器群的一致状态是系统管理员最耗费时间的任务之一。\n\n我将向你展示如何在类\
  \ RedHat 系统中使用 Ansible 执行滚动更新。\n\n### 使用 Ansible 在类 RedHat 系统中滚动更新软件包\n\n让我们聊聊如何使用\
  \ Ansible 模块 `yum` 和 `DNF` 在类 RedHat 系统中执行滚动更新。\n\n我们已经讨论过这些用于安装软件包的模块，但我们想考虑另一个用用例。\n\
  \n它们都使用 `yum`/`DNF` 软件包管理器管理软件包。\n\n### 参数\n\n* `name` 字符串\n* `state` 字符串\n* `update_cache`\
  \ 布尔值\n* `bugfix` 布尔值\n* `security` 布尔值\n\n参数列表很广泛，但今天我们关注用用例中的这四个选项。\n\n`name`\
  \ 可以是一个软件包，或者我们可以使用 `*`（星号）选择系统所有的软件包。\n\n这种情况下 `state` 需要为“latest”（最新），以便我们针对每个软件包的最新版本。\n\
  \n`update_cache` 有助于在安装之前强制更新存储库元数据，默认为 no。\n\n其他非常有趣的选项是 `bugfix` 和 `security`，它们允许你只更新标记为错误修复或安全相关的软件包。\n\
  \n### 演示\n\n如何使用 Ansible Playbook 自动执行类 RedHat 系统的滚动更新。\n\n* `yum.yml`\n\n```\n\
  \ 1 ---\n2 - name: rolling update demo\n3   hosts: all\n4   become: true\n5   tasks:\n\
  6     - name: ensure pkg updated\n7       yum:\n8         name: nginx\n9       \
  \  state: latest\n10         update_cache: true\n```\n\n* `yum-system.yml`\n\n```\n\
  \ 1 ---\n2 - name: rolling update demo\n3   hosts: all\n4   become: true\n5   tasks:\n\
  6     - name: ensure system updated\n7       yum:\n8         name: \"*\"\n9    \
  \     state: latest\n10         update_cache: true\n```\n\n## 在类 RedHat 系统中开放防火墙端口\
  \ - Ansible 模块 firewalld\n\n如何使用 firewalld 和 Ansible 在类 RedHat 系统中开放 HTTP 和 HTTPS\
  \ 防火墙端口。\n\n### 使用 Ansible 在类 RedHat 系统中开放防火墙端口\n\n今天我们讨论 Ansible 模块 `firewalld`。\n\
  \n全称为 `ansible.posix.firewalld`，这意味着它是针对 POSIX 平台集合的一部分。该模块需要 Ansible 2.9+。\n\n\
  它在带有 firewalld >= `0.2.11` 和 python `firewalld` 绑定的类 RedHat 系统上工作。\n\n它通过 `firewalld`\
  \ 管理任意端口/服务。\n\n### 参数\n\n* `state` 字符串 - enabled / present / absent / disabled\n\
  * `service` 字符串 - `firewall-cmd - get-services`\n* `port` 字符串 - `PORT/PROTOCOL`\
  \ 或 `PORT-PORT/PROTOCOL`\n* `permanent` 布尔值 - no/yes\n* `immediate` 布尔值 - no /yes\n\
  \n参数列表很广泛，但这些是我们最重要的选项。\n\n`state` 参数用于 enabled, present, absent 或 disabled。\n\n\
  `service` 参数使用 `firewall-cmd - get-services`。\n\n`port` 参数遵循 `PORT/PROTOCOL` 或 `PORT-PORT/PROTOCOL`。\n\
  \n`permanent` 参数为 no 或 yes。\n\n`immediate` 参数为 no 或 yes。\n\n`permanent` 参数定义配置是否在重启后持久化。注意，如果\
  \ `permanent` 为 no，则假设为 immediate。\n\n`immediate` 参数将立即应用到系统。\n\n### 演示\n\n让我们进入一个真实演示，介绍如何使用\
  \ Ansible Playbook 在类 RedHat 系统中开放防火墙端口。\n\n* `verify-firewall.sh`\n\n```\n1 # firewall-cmd\
  \ --state\n2 # systemctl statuswalld\n3 # firewall-cmd --list-all\n4 # firewall-cmd\
  \ --list-services\n5 # dnf info nginx\n```\n\n* `firewalld.yml`\n\n```\n 1 ---\n\
  2 - name: firewalld demo\n3   hosts: all\n4   become: true\n5   tasks:\n6     -\
  \ name: nginx installed\n7       ansible.builtin.yum:\n8         name: nginx\n9\
  \         state: present\n10 - name: firewalld rules\n11       ansible.posix.firewalld:\n\
  12         service: \"{{ item }}\"\n13         state: enabled\n14         permanent:\
  \ true\n15         immediate: true\n16       with_items:\n17         - http\n18\
  \         - https\n```\n\n## 在类 RedHat 系统中安装 Google Chrome - Ansible 模块 rpm_key,\
  \ yum_repos\n\n如何在类 RedHat 工作站（RedHat Enterprise Linux, CentOS, CentOS Stream, Fedora\
  \ 等）上安装最新的 Google Chrome 稳定版，使用公共 GPG 密钥验证软件并设置 Google 存储库。代码已在 RHEL 8.4 上测试。\n\n\
  ### 使用 Ansible 在类 RedHat 系统中安装 Google Chrome\n\n* 添加 Google Chrome 密钥 ⇒ `ansible.builtin.rpm_key`\n\
  * 添加 Google Chrome 存储库 ⇒ `ansible.builtin.yum_repository`\n* 更新 yum 缓存并安装 Google\
  \ Chrome ⇒ `ansible.builtin.yum`\n\n要在类 RedHat 系统上安装 Google Chrome，我们需要执行三个不同的步骤。\n\
  \n第一步是下载存储库的 GPG 签名密钥。你将使用 `ansible.builtin.rpm_key` Ansible 模块。\n\n此加密密钥用于验证软件包和存储库的真实性，并确保软件与\
  \ Google 发布的版本相同。\n\n第二步是将 Google Chrome 存储库添加到发行版中。这是一个额外的网站，是你的发行版软件包管理器 `yum/dnf`\
  \ 查找软件的地方。\n\n你将使用 `ansible.builtin.yum_repository` Ansible 模块。\n\n第三步是更新可用软件包的\
  \ yum 缓存，并使用 `ansible.builtin.yum` Ansible 模块安装 Google Chrome。\n\n\n\n\n\n### 参数概述\n\
  \n* `rpm_key` state `string` — 存在/不存在\n* `yum_repository` name `string` — 仓库\n*\
  \ `yum_repository` baseurl `string` — URL\n* `yum_repository` gpgcheck `boolean`\
  \ — 启用 GPG 检查\n* `yum_repository` gpgkey `string` — GPG 检查密钥 URL\n* `yum` name `string`\
  \ — 名称或特定包\n* `yum` state `string` — 最新/存在/不存在\n* `yum` update_cache `boolean` —\
  \ 否/是\n\n对于 `ansible.builtin.rpm_key` Ansible 模块，我将使用两个参数：“key”和“state”。\n\n“key”参数指定仓库\
  \ GPG 签名密钥的 URL 或密钥 ID，而“state”用于验证执行后该密钥是否存在于我们的系统中。\n\n对于 `ansible.builtin.yum_repository`\
  \ Ansible 模块，我将使用四个参数：“name”、“baseurl”、“gpgcheck”和“gpgkey”。\n\n“name”参数指定仓库参数以及其“baseurl”\
  \ URL。\n\n“gpgcheck”参数通过“gpgkey”参数指定的 URL 启用 GPG 验证。\n\n对于 `ansible.builtin.yum`\
  \ Ansible 模块，我将使用三个参数：“name”、“state”和“update_cache”。\n\n“name”参数指定包名（在我们用例中为 Google\
  \ Chrome），“state”用于验证执行后该包是否存在于我们的系统中。\n\n在安装包之前，“update_cache”会执行 yum 缓存更新，以确保下载包的最新版本。\n\
  \n### 演示\n\n使用 Ansible Playbook 在类 RedHat 系统中安装 Google Chrome。\n\n#### 代码\n\n* `install_chrome_redhat.yml`\n\
  \n```\n 1 ---\n 2 - name: install Google Chrome\n 3   hosts: all\n 4   become: true\n\
  \ 5   tasks:\n 6     - name: Add Yum signing key\n 7       rpm_key:\n 8        \
  \ key: https://dl.google.com/linux/linux_signing_ke\\\n 9 y.pub\n10         state:\
  \ present\n11 - name: Add repository into repo.d list\n12       yum_repository:\n\
  13         name: google-chrome\n14         description: google-chrome repository\n\
  15         baseurl: http://dl.google.com/linux/chrome/rpm/st\\\n16 able/x86_64\n\
  17         enabled: true\n18         gpgcheck: true\n19         gpgkey: https://dl.google.com/linux/linux_signing\\\
  \n20 _key.pub\n21 - name: Install google-chrome-stable\n22       yum:\n23      \
  \   name: \"google-chrome-stable\"\n24         state: latest \n25         update_cache:\
  \ true\n```\n\n#### 执行\n\n输出\n\n```\n 1 $ ansible-playbook -i demo/inventory install\\\
  \ chrome/redh\\\n 2 at.yml\n 3 PLAY [install Google Chrome] ****************************\\\
  \n 4 ******************************************\n 5 TASK [Gathering Facts] **********************************\\\
  \n 6 ******************************************\n 7 ok: [demo.example.com]\n 8 TASK\
  \ [Add Yum signing key] ******************************\\\n 9 ******************************************\n\
  10 changed: [demo.example.com]\n11 TASK [Add repository into repo.d list] ******************\\\
  \n 12 ******************************************\n13 changed: [demo.example.com]\n\
  14 TASK [Install google-chrome-stable] *********************\\\n 15 ******************************************\n\
  16 changed: [demo.example.com]\n17 PLAY RECAP **********************************************\\\
  \n 18 ******************************************\n19 demo.example.com          \
  \ : ok=4    changed=3    unreach\\\n20 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n```\n\n#### 验证\n\n```\n 1 $ ssh devops@demo.example.com\n 2 $ sudo\
  \ su -\n 3 # ls -l /etc/yum.repos.d/\n 4 total 420\n 5 -rw-r--r--. 1 root root \
  \  1485 Sep  4 17:28 epel-modular.\\\n 6 repo\n 7 -rw-r--r--. 1 root root   1304\
  \ Sep  1 00:13 epel-playgrou\\\n 8 nd.repo\n 9 -rw-r--r--. 1 root root   1564 Sep\
  \  4 17:28 epel-playgrou\\\n10 nd.repo.rpmnew\n11 -rw-r--r--. 1 root root   1111\
  \ Sep  1 00:13 epel.repo\n12 -rw-r--r--. 1 root root   1422 Sep  4 17:28 epel.repo.rpm\\\
  \n13 new\n14 -rw-r--r--. 1 root root   1584 Sep  4 17:28 epel-testing-\\\n15 modular.repo\n\
  16 -rw-r--r--. 1 root root   1258 Sep  1 00:13 epel-testing.\\\n17 repo\n 18 -rw-r--r--.\
  \ 1 root root   1521 Sep  4 17:28 epel-testing.\\\n19 repo.rpmnew\n20 -rw-r--r--.\
  \ 1 root root    205 Oct 12 14:50 google-chrome\\\n21 .repo\n22 -rw-r--r--. 1 root\
  \ root 391942 Oct  8 10:54 redhat.repo\n23 # cat /etc/yum.repos.d/google-chrome.repo\
  \ \n24 [google-chrome]\n25 async = 1\n26 baseurl = http://dl.google.com/linux/chrome/rpm/stable/x8\\\
  \n27 6_64\n28 enabled = 1\n29 gpgcheck = 1\n30 gpgkey = https://dl.google.com/linux/linux_signing_key.pub\n\
  31 name = google-chrome repository\n32 # rpm -qa | grep google-chrome-stable\n33\
  \ google-chrome-stable-94.0.4606.81-1.x86_64\n34 [root@demo ~]# yum list installed\
  \ google-chrome-stable\n35 Updating Subscription Management repositories.\n36 Installed\
  \ Packages\n37 google-chrome-stable.x86_64                      94.0.46\\\n38 6.81-1\
  \                      @google-chrome\n```\n\n## 在类 RedHat 系统中安装 Microsoft Edge\
  \ - Ansible 模块 rpm_key, yum_repository 和 yum\n\n如何在类 RedHat 工作站上使用公共 GPG 密钥验证软件并安装最新版本的\
  \ Microsoft Edge 稳定版，并设置 Microsoft 仓库。包含在 Fedora 34 中测试过的代码。\n\n### Linux 版 Microsoft\
  \ Edge\n\nMicrosoft Edge 可通过以下通道：\n\n* 稳定版通道 (Stable Channel)\n* 测试版通道 (Beta Channel)\
  \ - 每 4 周大更新\n* 开发版通道 (Dev Channel) - 每周更新\n* 金丝雀版通道 (Canary Channel) - 每日更新\n\n\
  更多信息 https://www.microsoftedgeinsider.com/en-us/download/`\n\n### 使用 Ansible 在类\
  \ RedHat 系统中安装 Microsoft Edge\n\n* 添加 Microsoft Edge 密钥 ⇒ `ansible.builtin.rpm_key`\n\
  * 添加 Microsoft Edge 仓库 ⇒ `ansible.builtin.yum_repository`\n* 更新 yum 缓存并安装 Microsoft\
  \ Edge ⇒ `ansible.builtin.yum`\n\n为了在类 RedHat 系统上安装 Microsoft Edge，我们需要执行三个不同的步骤。\n\
  \n第一步是下载仓库的 GPG 签名密钥。我将使用 `ansible.builtin.rpm_key` Ansible 模块。\n\n该加密密钥用于验证包和仓库的真实性，确保软件与\
  \ Microsoft 发布的版本一致。\n\n第二步是将 Microsoft 仓库添加到发行版中。它是你的发行版包管理器 `yum/dnf` 查找软件的额外网站。\n\
  \n我将使用 `ansible.builtin.yum_repository` Ansible 模块。\n\n第三步是使用 `ansible.builtin.yum`\
  \ 模块更新可用包的缓存并安装 Microsoft Edge。\n\n\n\n\n\n```yaml\n 1 ---\n 2 - name: 安装 Microsoft\
  \ Edge\n 3   hosts: all\n 4   become: true\n 5   tasks:\n 6     - name: 添加 Yum 签名密钥\n\
  \ 7       ansible.builtin.rpm_key:\n 8         key: \"https://packages.microsoft.com/keys/microso\\\
  \n 9 ft.asc\"\n10         state: present\n11 - name: 将仓库添加到 repo.d 列表\n 12     \
  \  ansible.builtin.yum_repository:\n13         name: microsoft-edge\n14        \
  \ description: microsoft-edge\n15         baseurl: \"https://packages.microsoft.com/yumrepos\\\
  \n16 /edge/\"\n17         enabled: true\n18         gpgcheck: true\n19         gpgkey:\
  \ \"https://packages.microsoft.com/keys/micr\\\n20 osoft.asc\"\n21 - name: 安装 microsoft-edge-stable\n\
  22       ansible.builtin.yum:\n23         name: \"microsoft-edge-stable\"\n24  \
  \       state: latest\n25         update_cache: true\n```\n\n### execution\n\n```\n\
  \ 1 $ ansible-playbook -i fedora/inventory install\\ edge/redh\\\n 2 at.yml\n 3\
  \ \n 4 PLAY [安装 Microsoft Edge] ***************************\\\n 5 ******************************************\n\
