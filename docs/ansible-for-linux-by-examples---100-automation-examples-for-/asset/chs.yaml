  \ s\\\n```\n\n## 在远程主机上停止并在启动时禁用服务\n\n`service` 模块用于管理各种初始化系统上的服务。它支持 `systemd`、`init.d`、`SysVinit`、`OpenRC`、`SMF`、`Solaris`、`upstart`\
  \ 和 `rc`。\n\n全称为为 `ansible.builtin.service`，这意味着该模块是 Ansible `builtin` 集合的一部分，并随\
  \ Ansible 一起发布。该模块非常稳定，已发布多年，其目的是管理远程主机上的服务。对于 Windows 目标主机，请改用 `ansible.windows.win_service`\
  \ 模块。\n\n### 参数\n\n*   `name` 路径 - 服务名称\n*   `state` 字符串 - `started`/`stopped`/`reloaded`\n\
  *   `enabled` 布尔值 - `no`/`yes`\n*   `arguments/args` 字符串 - 额外参数\n\n参数列表是全局的，但我将总结最实用的部分：\n\
  \n唯一的强制参数是 `name`，它指定服务。\n\n至少需要 `state` 或 `enabled` 参数中的一个。`state` 参数定义了我们要执行的操作。它有四种可选：`started`\
  \ 和 `stopped` 允许运行或停止服务；`restarted` 是停止和启动的组合——你也可以使用 `sleep` 参数自定义秒数。`reloaded`\
  \ 选项适用于服务需要重新加载配置文件的情况。`enabled` 参数允许你决定服务是否在启动时运行。`arguments 或 args` 参数允许你指定命令行提供的某些额外参数。\n\
  \n### 示例\n\n以下 Ansible Playbook 显示了如何在远程主机上控制服务\n\n```yaml\n---\n- name: service\
  \ demo\n  hosts: all\n  become: true\n  tasks:\n    - name: sshd\n      ansible.builtin.service:\n\
  \        name: sshd\n        state: restarted\n        enabled: true\n```\n\n##\
  \ 在远程主机上并在启动时启用服务\n\n`service_facts` 模块用于收集目标主机上的服务信息。首先，你需要获取目标主机上的服务信息。此任务由 `service_facts`\
  \ 模块完成。你无法启用一个不存在的服务，对吧？\n\n\n\n\n\n```yaml\n 1 ---\n 2 - name: 服务模块演示\n 3   hosts:\
  \ all\n 4   become: true\n 5   vars:\n 6     disable_services:\n 7       - \"chronyd.service\"\
  \n 8   tasks:\n 9     - name: 填充服务事实\n10       ansible.builtin.service_facts:\n\
  11 \n12     - name: 禁用服务\n13       ansible.builtin.service:\n14         name: \"\
  {{ item }}\"\n15         enabled: false\n16         state: stopped\n17       when:\
  \ \"item in services\"\n18       with_items: '{{ disable_services }}'\n```\n\n###\
