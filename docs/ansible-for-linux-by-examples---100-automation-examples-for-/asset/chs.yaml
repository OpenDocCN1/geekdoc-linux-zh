  \n让我也强调一下，我们还可以指定权限和 SELinux 属性。\n\n### demo\n\n如何使用 Ansible template 模块和 YAML 按特定顺序合并多个文件。\n\
  \n#### code\n\n*   `a.txt`\n\n```\n1 A content\n```\n\n*   `b.txt`\n\n```\n1 B content\n\
  ```\n\n*   `includes.yaml`\n\n```\n1 input-files:\n2   - concatenate/b.txt\n3  \
  \ - concatenate/a.txt\n```\n\n*   `concatenate.yml`\n\n```\n 1 ---\n 2 - name: concatenate\
  \ demo\n 3   hosts: \"{{ HOSTS }}\"\n 4   become: false\n 5   gather_facts: true\n\
  \ 6   vars:\n 7     myinput: \"concatenate/includes.yaml\"\n 8     myoutput: \"\
  concatenate/output.txt\"\n 9   tasks:\n10     - name: include file list\n11    \
  \   include_vars:\n12         file: \"{{ myinput }}\"\n13         name: files\n\
  14 \n15     - name: concatenate\n16       ansible.builtin.template:\n17        \
  \ src: templates/concatenate.j2\n18         dest: \"{{ myoutput }}\"\n```\n\n* \
  \  `concatenate.j2`\n\n```\n1 {% for i in files[\"input-files\"] %}\n2 {{ lookup('file',\
  \ i) }}\n3 {% endfor %}\n```\n\n### execution\n\n```\n 1 ansible-pilot $ ansible-playbook\
