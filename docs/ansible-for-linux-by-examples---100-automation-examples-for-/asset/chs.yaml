  \ libglib2.0-0 (>= 2.39.4), l\n22 ibgtk-3-0 (>= 3.9.10) | libgtk-4-1, libnspr4 (>=\
  \ 2:4.9-2\n23 ), libnss3 (>= 2:3.22), libpango-1.0-0 (>= 1.14.0), libx1\n24 1-6\
  \ (>= 2:1.4.99.1), libxcb1 (>= 1.9.2), libxcomposite1 (\n25 >= 1:0.4.4-1), libxdamage1\
  \ (>= 1:1.1), libxext6, libxfixe\n26 s3, libxkbcommon0 (>= 0.4.1), libxrandr2, libxshmfence1,\
  \ \n27 wget, xdg-utils (>= 1.0.2)\n28 Recommends:\n```\n\n\n\n\n\n对于 `ansible.builtin.apt_repository`\
  \ Ansible 模块，我将使用两个参数：`repo` 和 `state`。\n\n`repo` 参数指定仓库参数，`state` 用于验证执行后该仓库是否存在于系统中。\n\
  \n对于 `ansible.builtin.apt` Ansible 模块，我将使用三个参数：`name`、`state` 和 `update_cache`。\n\
  \n`name` 参数指定软件包名称（在我们用例中为 Google Chrome），`state` 用于验证执行后该软件包是否存在于系统中。\n\n在安装软件包之前，`update_cache`\
  \ 会对 `apt-cache` 执行更新，确保下载最新版本的软件包。\n\n### 演示\n\n使用 Ansible Playbook 在 Debian 类系统中安装\
  \ Google Chrome。\n\n#### 代码\n\n*`install_chrome_debian.yml`*\n\n```\n 1 ---\n 2\
  \ - name: install Google Chrome\n 3   hosts: all\n 4   become: true\n 5   tasks:\n\
