  \ 7 Loaded policy name:             targeted\n 8 Current mode:                 \
  \  enforcing\n 9 Mode from config file:          enforcing\n10 Policy MLS status:\
  \              enabled\n11 Policy deny_unknown status:     allowed\n12 Memory protection\
  \ checking:     actual (secure)\n13 Max kernel policy version:      33\n14 [root@demo\
  \ devops]# getsebool httpd_use_nfs\n15 httpd_use_nfs --> off\n16 [root@demo devops]#\n\
  ```\n#### after execution\n```bash\n 1 $ ssh devops@demo.example.com\n 2 [devops@demo\
  \ ~]$ sudo su\n 3 [root@demo devops]# getsebool httpd_use_nfs\n 4 httpd_use_nfs\
  \ --> on\n 5 [root@demo devops]# reboot\n 6 Connection to demo.example.com closed\
