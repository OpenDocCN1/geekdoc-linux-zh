  17 example-backup/\n18 `-- examples\n19     |-- report2.txt\n20     `-- report.txt\n\
  21 1 directory, 2 files\n22 [devops@demo ~]$\n```\n\n\n\n\n\n其他重要的参数是 `group` 和\
  \ `groups`。第一个（不带“s”后缀）表示用户的主组，第二个（带“s”后缀）用于设置其他组组成员。因此，请务必注意“s”的后缀，它可能会导致完全不同的配置。\n\
  \n通常情况下，我们希望创建一个用户主目录，因此 `create_home` 参数默认设置为 `yes`，但如果我们不需要主目录，也可以对其进行覆盖。\n\n\
  让我同时也强调一下，我们还可以使用许多选项来生成 SSH 密钥。指纹和公钥可以在返回值的长列表中找到。\n\n#### code\n\n如何使用 Ansible\
  \ Playbook 在 Linux 中创建用户。\n\n`user.yml`\n\n```\n 1 ---\n 2 - name: user module demo\n\
  \ 3   hosts: all\n 4   become: true\n 5   tasks:\n 6     - name: user example present\n\
  \ 7       ansible.builtin.user:\n 8         name: example\n 9         password:\
  \ \"{{ 'password' | password_hash('sha512'\\\n10 , 'mysecretsalt') }}\"\n11    \
  \     groups:\n12           - wheel\n13           - adm\n14         state: \"present\"\
  \n15         shell: \"/bin/bash\"\n16         system: false\n17         create_home:\
  \ true\n18         home: \"/home/example\"\n19         comment: \"Ansible example\"\
  \n20         generate_ssh_key: true\n```\n\n## Ansible 删除用户账户\n\n今天我们来讨论 Ansible\
  \ 模块 `user`。\n\n全名是 `ansible.builtin.user`，这意味着它是 Ansible 内置（builtin）模块集合的一部分，并随\
  \ Ansible 一起发布。\n\n这是一个非常稳定且已发布多年的模块，用于管理用户账户。\n\n它支持多种 Linux 发行版、SunOS、macOS 以及\
  \ FreeBSD。\n\n该模块在 Linux 发行版使用 `userdel` 进行删除；在 FreeBSD 上，该模块使用 `pw userdel`；在 macOS\
  \ 上，它使用 `dscl`。\n\n对于 Windows，请使用 `ansible.windows.win_user` 模块。\n\n### Parameters\n\
  \n- `name` 字符串 - 用户名\n- `state` 字符串 - 存在(present)/不存在(absent)\n- `remove` 布尔值 -\
  \ `no` / yes\n\n唯一要求的参数是 `name`，即用户名。`state` 允许我们创建或删除用户，在用例中，我们需要指定 `absent` 来删除用户。\n\
  \n如果我们想尝试删除与用户相关的目录，需要设置参数 `remove`。\n\n其行为与 `userdel --remove` 相同。\n\n用户主目录中的文件将与主目录本身以及用户的邮件池一起被删除。\n\
  \n文件系统中其他部分的文件将必须手动搜索并删除。\n\n#### code\n\n让我们进入一个真实的 Ansible Playbook 来删除用户。\n\n\
  `delete_user.yml`\n\n```\n 1 ---\n 2 - name: user module demo\n 3   hosts: all\n\
  \ 4   become: true\n 5   tasks:\n 6     - name: user example not present\n 7   \
  \    ansible.builtin.user:\n 8         name: example\n 9         state: \"absent\"\
  \n10         remove: true\n```\n\n## Ansible 修改用户密码\n\n今天我们来讨论 Ansible 模块 `user`。\n\
  \n全名是 `ansible.builtin.user`，这意味着它是 Ansible 内置（builtin）模块集合的一部分，并随 Ansible 一起发布。\n\
  \n这是一个非常稳定且已发布多年的模块，用于管理用户账户。\n\n它支持多种 Linux 发行版、SunOS、macOS 以及 FreeBSD。\n\n对于 Windows，请使用\
  \ `ansible.windows.win_user` 模块。\n\n### Parameters\n\n- `name` 字符串 - 用户名\n- `state`\
  \ 字符串 - 存在(present)/不存在(absent)\n- `password` 字符串 - Linux 加密，macOS 明文\n\n唯一要求的参数是\
  \ `name`，即用户名。\n\n在参数 `state` 中我们需要指定 `present` 选项，显然，我们无法更改一个不存在账户的密码。\n\n最重要的参数是\
  \ `password`，它允许你指定新密码。\n\n对于 macOS 目标，密码是明文的。\n\n对于 Linux 目标，`password` 必须预先加密。我们可以使用\
  \ `password_hash` 过滤器来生成密码。请注意，你还可以指定加密算法以及盐（salt）以使你的密码更健壮。\n\n### demo\n\n如何使用\
  \ Ansible 在 Linux 中更改用户账户密码。\n\n`change_password.yml`\n\n```\n 1 ---\n 2 - name:\
  \ user module demo\n 3   hosts: all\n 4   become: true\n 5   vars:\n 6     myuser:\
  \ \"example\"\n 7     mypassword: \"password\"\n 8   tasks:\n 9     - name: change\
  \ password\n10       ansible.builtin.user:\n11         name: \"{{ myuser }}\"\n\
  12         state: present\n13         password: \"{{ mypassword | password_hash('sha512'\\\
  \n14 ) }}\"\n```\n\n### execution\n\n```\n 1 $ ansible-playbook -i demo/inventory\
  \ change\\ user\\ passwo\\\n 2 rd/user.yaml\n 3 PLAY [user module demo] *********************************\\\
  \n 4 ******************************************\n 5 TASK [Gathering Facts] **********************************\\\
  \n 6 ******************************************\n 7 ok: [demo.example.com]\n 8 TASK\
  \ [change password] **********************************\\\n 9 ******************************************\n\
  10 changed: [demo.example.com]\n11 PLAY RECAP **********************************************\\\
  \n12 ******************************************\n13 demo.example.com           :\
  \ ok=2    changed=1    unreach\\\n14 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n```\n\n#### verification\n\n```\n1 $ sshpass -p 'password' example@demo.example.com\n\
  ```\n\n请注意：系统上必须安装 `sshpass`。\n\n## Ansible 禁用用户账户\n\n如何使用 Ansible 模块 `user` 通过\
  \ Ansible 禁用用户账户。\n\n### Parameters\n\n- `name` 字符串 - 用户名\n- `state` 字符串 - 存在(present)/不存在(absent)\n\
  - `password_lock` 布尔值 - no/yes\n- `shell` 字符串 - \"/sbin/nologin\"\n\n唯一要求的是 `name`，即用户名。\n\
  \n`state` 参数允许我们创建或删除用户。\n\n`password_lock` 参数指定锁定密码。\n\n该参数在 Linux 系统上使用 `passwd`\
  \ 工具通过将密码更改为匹配任何可能的加密值来禁用密码（它会在密码开头添加一个 `!`）。\n\n此参数不会禁用用户，仅锁定密码。此参数并不意味着用户无法通过其他方法登录。\n\
  \n`shell` 参数指定用户 shell。一个非常特殊的是 `nologin`。当使用该 shell 的用户登录时，他们将收到一条显示“此账户目前不可用”的提示消息。此消息可以通过\
  \ `/etc/nologin.txt` 文件自定义。\n\n### demo\n\n让我们进入一个真实的 Ansible Playbook 来禁用用户。\n\n\
  #### code\n\n`user_disable.yml`\n\n```\n 1 ---\n 2 - name: user module demo\n 3\
  \   hosts: all\n 4   become: true\n 5   vars:\n 6     myuser: \"example\"\n 7  \
  \ tasks:\n 8     - name: disable user\n 9       ansible.builtin.user:\n10      \
  \   name: \"{{ myuser }}\"\n11         state: present\n12         password_lock:\
  \ true\n13         shell: \"/sbin/nologin\"\n```\n\n### execution\n\n```\n 1 $ ansible-playbook\
  \ -i demo/inventory disable\\ user\\ accou\\\n 2 nt/user.yml\n 3 \n 4 PLAY [user\
  \ module demo] *********************************\\\n 5 ******************************************\n\
  \ 6 \n 7 TASK [Gathering Facts] **********************************\\\n 8 ******************************************\n\
  \ 9 ok: [demo.example.com]\n 10 \n11 TASK [disable user] *************************************\n\
  12 ******************************************\n13 changed: [demo.example.com]\n\
  14 \n15 PLAY RECAP **********************************************\\\n16 ******************************************\n\
  17 demo.example.com           : ok=2    changed=1    unreach\\\n18 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n```\n\n#### verification\n\n```\n1 $ sshpass\
  \ -p 'password' example@demo.example.com\n2 $ ssh devops@demo.example.com\n3 $ sudo\
  \ su -\n4 [root@demo ~]# getent passwd\n5 example:x:1002:1002::/home/example:/sbin/nologin\n\
  6 [root@demo ~]# passwd -S example\n7 example LK 2021-09-30 0 99999 7 -1 (Password\
  \ locked.)\n8 [root@demo ~]# grep example /etc/shadow\n9 example:!!:18900:0:99999:7:::\n\
  ```\n\n\n\n\n\n*   `name` 字符串 - 用户名\n*   `state` 字符串 - 存在/不存在\n*   `password_lock`\
  \ 布尔 -否/是\n*   `shell` 字符串 - `/bin/bash`\n\n唯一的必填参数是 `name`，即用户名。\n\n`state` 参数允许我们创建或删除用户。\n\
  \n`password_lock` 参数指定在密码被锁定时是否解锁用户密码。\n\n此参数使用 `passwd` 工具通过将密码更改为不匹配任何可能的加密值的值来更改密码（它会在密码开头添加一个\
  \ `! `）。为了让我们的用户正常使用，我们需要禁用此参数。\n\n`shell` 参数指定用户的 shell。两个非常特殊的 shell 是 `nologin`\
  \ 和 `false`。应用 `/bin/bash` 的值将恢复用户的访问权限。\n\n### demo（演示）\n\n如何使用 Ansible 在 Linux\
  \ 中启用一个没有密码锁定且具有适当 shell 的用户。\n\n#### code\n\n*   `user_enable.yml`\n\n```\n 1 ---\n\
  \ 2 - name: user module demo\n 3   hosts: all\n 4   become: true\n 5   vars:\n 6\
  \     myuser: \"example\"\n 7   tasks:\n 8     - name: enable user\n 9       ansible.builtin.user:\n\
  10         name: \"{{ myuser }}\"\n11         state: present\n12         password_lock:\
  \ false\n13         shell: \"/bin/bash\"\n```\n\n#### output（输出）\n\n```\n 1 $ ansible-playbook\
  \ -i demo/inventory enable\\ user\\ accoun\\\n 2 t/user.yml\n 3 PLAY [user module\
  \ demo] *********************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [enable user] **************************************\\\
  \n 9 ******************************************\n10 changed: [demo.example.com]\n\
  11 PLAY RECAP **********************************************\\\n12 ******************************************\n\
  13 demo.example.com           : ok=2    changed=1    unreach\\\n14 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n```\n\n#### verification（验证）\n\n```\n\
  \ 1 # getent passwd | grep example\n 2 example:x:1002:1002:Ansible example:/home/example:/bin/ba\\\
  \n 3 sh\n 4 # passwd -S example\n 5 example PS 2021-10-04 0 99999 7 -1 (Password\
  \ set, SHA512 \\\n 6 crypt.)\n 7 # grep example /etc/shadow\n 8 example:$6$mysecretsalt$MIJffjeQyfrKKrGkprGrDL/g2mCJa53ko\\\
  \n 9 LmYQuuLmY9y37pDvGKPXU1Ov3RbMi.tpQ9cWvxAzUVtBLe7KrZoU.:189\\\n10 04:0:99999:7:::\n\
  ```\n\n## Ansible 用户密码过期\n\n如何使用 Ansible 的 `user` 模块在 Linux 上设置用户密码过期时间。\n\n###\
  \ Linux 密码老化策略\n\n![img](img/linux_password_expiration.png)\n\nLinux 密码老化策略\n\n\
  此图表示了 Linux 密码老化策略。\n\n需要强调的是，Ansible 原生模块 `user` 能够设置最小天数 `-m` 和最大天数 `-M` 参数。\n\
  \n最大天数设置了请求更新密码的策略，例如每隔 90 天需要更换一次。\n\n最小天数设置了在再次更改密码前需要等待的最少天数，例如自上次更改 7 天后。\n\n\
  要禁用密码老化，请指定值为 `99999`。\n\n对于其他参数，你需要依赖 `chage` 命令行工具或通过 Ansible 的 `shell` 模块。\n\n\
  ### Parameters（参数）\n\n*   `name` 字符串 - 用户名\n*   `password_expire_min` 整数 - Linux\
  \ 最小有效天数 (-m)\n*   `password_expire_max` 整数 - Linux 最大有效天数 (-M)\n\n该模块有很多参数可以执行任何任务。\n\
  \n唯一的必填参数是 `name`，即用户名。\n\n在 `password_expire_min` 参数中，你指定最小有效天数的值。\n\n在 `password_expire_max`\
  \ 参数中，你指定最大有效天数的值。\n\n请注意，这些参数`仅限 Linux`。\n\n### demo（演示）\n\n使用 Ansible Playbook\
  \ 设置用户密码过期时间。\n\n#### code\n\n*   `user_password_expiration.yml`\n\n```\n 1 ---\n\
  \ 2 - name: user module demo\n 3   hosts: all\n 4   become: true\n 5   vars:\n 6\
  \     myuser: \"example\"\n 7   tasks:\n 8     - name: password expiration\n 9 \
  \      ansible.builtin.user:\n10         name: \"{{ myuser }}\"\n11         password_expire_min:\
  \ 7\n12         password_expire_max: 90\n```\n\n#### execution（执行）\n\n```\n 1 $\
  \ ansible-playbook -i demo/inventory user\\ expiration/use\\\n 2 r.yml\n 3 \n 4\
  \ PLAY [user module demo] *********************************\\\n 5 *************************************************\n\
  \ 6 \n 7 TASK [Gathering Facts] **********************************\\\n 8 *************************************************\n\
  \ 9 ok: [demo.example.com]\n 10 \n 11 TASK [password expiration] *********************************\\\
  \n 12 *************************************************\n13 changed: [demo.example.com]\n\
  \ 14 \n 15 PLAY RECAP **********************************************\\\n16 ******************************************\n\
  ```\n\n#### before execution（执行前）\n\n```\n 1 $ ssh devops@demo.com\n 2 Last login:\
  \ Mon Nov  8 17:07:10 2021 from 192.168.43.5\n 3 [devops@demo ~]$ sudo su\n 4 [root@demo\
  \ devops]# chage --help\n 5 Usage: chage [options]\n 6  -d, --lastday set last date\n\
  \ 8 -E, --expiredate set expiration date\n 9 -h, --help display this help message\n\
  10 -I, --inactive set inactive after\n11 -l, --list show account aging\n12 -m, --mindays\
  \ set minimum days\n13 -M, --maxdays set maximum days\n14 -R, --root set directory\
  \ into\n15 -W, --warningdays set warning days\n16 \n 17 Options for: chage\n18 \
  \ -d, --lastday set last date\n19  -E, --expiredate set expiration date\n20  -h,\
  \ --help display this help message\n21  -I, --inactive set inactive after\n22  -l,\
  \ --list show account aging\n23  -m, --mindays set minimum days\n24  -M, --maxdays\
  \ set maximum days\n25  -R, --root set directory into\n26  -W, --warningdays set\
  \ warning days\n27 \n28 [root@demo devops]# chage -l example\n29 Last password change:\
  \ Nov 08, 2021\n30 Password expires: never\n31 Password inactive: never\n32 Account\
  \ expires: never\n33 Minimum days between change: 0\n34 Maximum days between change:\
  \ 99999\n35 Warning days before expires: 7\n```\n\n#### after execution（执行后）\n\n\
  ```\n 1 $ ssh devops@demo.com\n 2 Last login: Mon Nov  8 17:09:16 2021 from 192.168.43.5\n\
  \ 3 [devops@demo ~]$ sudo su\n 4 [root@demo devops]# chage -l example\n 5 Last password\
  \ change: Nov 08, 2021\n 6 Password expires: Feb 06, 2022\n 7 Password inactive:\
  \ never\n 8 Account expires: never\n 9 Minimum days between change: 0\n10 Maximum\
  \ days between change: 90\n11 Warning days before expires: 7\n12 [root@demo devops]#\
  \ passwd example\n13 Changing password for user example.\n14 Current password:\n\
  15 New password:\n16 BAD PASSWORD: The password is shorter than 8\n17 Retype new\
  \ password:\n18 passwd: Authentication token error\n19 [root@demo devops]# passwd\
  \ example\n20 Changing password for user example.\n21 New password:\n22 BAD PASSWORD:\
  \ The password is shorter than 8\n23 Retype new password:\n24 passwd: all authentication\
  \ updated successfully.\n25 [root@demo devops]# su - example\n26 [example@demo ~]$\
  \ passwd\n27 Changing password for user example.\n28 Current password:\n29 New password:\n\
  30 BAD PASSWORD: The password is shorter than 8\n31 passwd: Authentication token\
  \ error\n```\n\n\n\n\n\n*   `system` 布尔值 - 是/否\n*   `gid` 整数 - 要设置的组 GID\n*   `local`\
  \ 字符串 - “local” 命令的备选方案\n\n此模块包含一些用于执行任务的参数。\n\n必需参数是 `name`，即组名。\n\n`state` 参数允许我们创建或删除组，在我们的用例中，默认已设置为“present”（存在）以创建组。\n\
  \n`system` 参数允许创建系统组，默认不是。\n\n你可以通过使用 `gid` 参数来指定 GID（组标识符）。\n\n如果你有中央认证系统，在实现了该功能的平台上，`local`\
  \ 参数允许使用 `local` 命令的备选方案。\n\n### 演示\n\n如何使用 Ansible 创建 Linux 组。\n\n#### 代码\n\n*\
  \ `create_group.yml`\n\n```yaml\n 1 --- \n 2 - name: group module demo\n 3   hosts:\
  \ all\n 4   become: true\n 5   vars:\n 6     mygroup: \"example\"\n 7   tasks:\n\
  \ 8     - name: create group\n 9       ansible.builtin.group:\n10         name:\
  \ \"{{ mygroup }}\"\n11         state: present\n```\n\n#### 执行\n\n```bash\n 1 $\
  \ ansible-playbook -i demo/inventory group/create.yml\n 2 PLAY [group module demo]\
  \ ********************************\\\n 3 ******************************************\n\
  \ 4 TASK [Gathering Facts] **********************************\\\n 5 ******************************************\n\
  \ 6 ok: [demo.example.com]\n 7 TASK [create group] *************************************\\\
  \n 8 ******************************************\n 9 changed: [demo.example.com]\n\
  10 PLAY RECAP **********************************************\\\n 11 ******************************************\n\
  \ 12 demo.example.com           : ok=2    changed=1    unreach\\\n 13 able=0   \
  \ failed=0    skipped=0    rescued=0    ignored=0\n```\n\n#### 验证\n\n```bash\n1\
  \ $ ssh devops@demo.example.com\n2 $ sudo su\n3 # getent group | grep example\n\
  4 \n5 example:x:1001:\n```\n\n## Ansible 删除组账户\n\n如何使用 Ansible 的 group 模块在 Linux\
  \ 中删除组。\n\n### 参数\n\n*   `name` 字符串 - 组名\n*   `state` 字符串 - present/absent\n*  \
  \ `local` 字符串 - “local” 命令的备选方案\n\n必需参数是 `name`，即组名。\n\n`state` 参数允许我们创建或删除组，在我们的用例中将其设置为“absent”（不存在）以删除组。\n\
  \n如果你有中央认证系统，在实现了该功能的平台上，`local` 参数允许使用 `local` 命令的备选方案。\n\n### 演示\n\n如何使用 Ansible\
  \ 在 Linux 中删除组。\n\n#### 代码\n\n* `group_delete.yml`\n\n```yaml\n 1 ---\n 2 - name:\
  \ group module demo\n 3   hosts: all\n 4   become: true\n 5   vars:\n 6     mygroup:\
  \ \"example\"\n 7   tasks:\n 8     - name: delete group\n 9       ansible.builtin.group:\n\
  10         name: \"{{ mygroup }}\"\n11         state: absent\n```\n\n#### 执行\n\n\
  ```bash\n 1 $ ansible-playbook -i demo/inventory group/delete.yml\n 2 PLAY [group\
  \ module demo] ********************************\\\n 3 ******************************************\n\
  \ 4 TASK [Gathering Facts] **********************************\\\n 5 ******************************************\n\
  \ 6 ok: [demo.example.com]\n 7 TASK [delete group] *************************************\\\
  \n 8 ******************************************\n 9 changed: [demo.example.com]\n\
  10 PLAY RECAP **********************************************\\\n 11 ******************************************\n\
  \ 12 demo.example.com           : ok=2    changed=1    unreach\\\n 13 able=0   \
  \ failed=0    skipped=0    rescued=0    ignored=0\n```\n\n#### 验证\n\n```bash\n 1\
  \ $ ssh devops@demo.example.com\n2 [devops@demo ~]$ sudo su\n3 [root@demo devops]#\
  \ getent group | grep example\n4 [root@demo devops]# getent group\n5 root:x:0:\n\
  6 bin:x:1:\n7 daemon:x:2:\n8 sys:x:3:\n9 adm:x:4:\n10 tty:x:5:\n11 disk:x:6:\n12\
  \ lp:x:7:\n13 mem:x:8:\n14 kmem:x:9:\n15 wheel:x:10:\n16 cdrom:x:11:\n17 mail:x:12:\n\
  18 man:x:15:\n19 dialout:x:18:\n20 floppy:x:19:\n21 games:x:20:\n22 tape:x:33:\n\
  23 video:x:39:\n24 ftp:x:50:\n25 lock:x:54:\n26 audio:x:63:\n27 users:x:100:devops\n\
  28 nobody:x:65534:\n29 dbus:x:81:\n30 utmp:x:22:\n31 utempter:x:35:\n32 input:x:999:\n\
  33 kvm:x:36:\n34 render:x:998:\n35 systemd-journal:x:190:\n36 systemd-coredump:x:997:\n\
  37 systemd-resolve:x:193:\n38 tss:x:59:\n39 polkitd:x:996:\n40 ssh_keys:x:995:\n\
  41 unbound:x:994:\n42 sssd:x:993:\n43 chrony:x:992:\n44 sshd:x:74:\n45 vagrant:x:1000:\n\
  46 vboxsf:x:991:\n47 slocate:x:21:\n```\n\n## Ansible 修改 Linux 上的主组\n\n如何使用 Ansible\
  \ `user` 模块修改 Linux 上的主组。\n\n### 参数\n\n*   `name` 字符串 - 用户\n*   `group` 字符串 - 用户的主组（仅一个）\n\
  *   `groups` 列表 - 用户将被添加的组\n*   `append` 布尔值 - 是/否。如果是，则将用户添加到组中；如果否，则替换组。\n\n必需参数是\
  \ `name`，即用户名。`group` 参数指定主组。\n\n### 演示 \n\n使用 Ansible 修改 Linux 上的主组。\n\n#### 代码\n\
  \n* `user_group.yml`\n\n```yaml\n 1 --- \n 2 - name: user module demo\n 3   hosts:\
  \ all\n 4   become: true\n 5   vars:\n 6     myuser: \"example\"\n 7     mygroup:\
  \ \"users\"\n 8   tasks:\n 9     - name: change primary group\n10       ansible.builtin.user:\n\
  11         name: \"{{ myuser }}\"\n12         group: \"{{ mygroup }}\"\n```\n\n\
  #### 执行\n\n```bash\n 1 $ ansible-playbook -i inventory user_group.yml\n 2 PLAY [user\
  \ module demo] ********************************\\\n 3 ******************************************\n\
  \ 4 TASK [Gathering Facts] **********************************\\\n 5 ******************************************\n\
  \ 6 ok: [demo.example.com]\n 7 TASK [change primary group] *****************************\\\
  \n 8 ******************************************\n 9 changed: [demo.example.com]\n\
  10 PLAY RECAP **********************************************\\\n 11 ******************************************\n\
  \ 12 demo.example.com           : ok=2    changed=1    unreach\\\n 13 able=0   \
  \ failed=0    skipped=0    rescued=0    ignored=0\n```\n\n### 验证 \n\n```bash\n1\
  \ $ ssh devops@demo.example.com\n2 $ sudo su\n3 # id example\n4 uid=1002(example)\
  \ gid=100(users) groups=100(users),10(wheel)\n5 # getent group | grep example\n\
  6 example:x:1002:\n```\n\n#### 执行前\n\n```bash\n# 在执行前的检查组状态\n$ id example\nuid=1002(example)\
  \ gid=100(users) groups=100(users),10(wheel)\n```\n\n\n\n\n\n```bash\n 1 $ ssh devops@demo.example.com\n\
  \ 2 [devops@demo ~]$ sudo su\n 3 [root@demo devops]# getent passwd | grep example\n\
  \ 4 example:x:1002:100:Ansible example:/home/example:/bin/bash\n 5 [root@demo devops]#\
  \ id example\n 6 uid=1002(example) gid=100(users) groups=100(users),10(whe\\\n 7\
  \ el)\n 8 [root@demo devops]# groups example\n 9 example : users wheel\n10 [root@demo\
  \ devops]#\n```\n\n## Ansible 将用户添加到辅助组（组）\n\n如何使用 Ansible 的 `user` 模块在 Linux 上将用户添加到第二个组。\n\
  \n另参见 Ansible 故障排除 - chgrp failed。\n\n### 参数\n\n* `name` 字符串 - 用户名\n* `group` -\
  \ 用户的主组（仅限一个）\n* `groups` 列表 /元素=字符串 - 用户将被添加的组列表\n* `append` 布尔值 - no/yes - 如果为\
  \ yes，将用户添加到 `groups` 中指定的组。如果为 no，则替换。\n\n该模块有许多参数，让我重点介绍适用于我们用例的用法。\n\n唯一必需参数是\
  \ `name`，即用户名。\n\n主组在 `group` 参数中指定，每个用户只需要属于一个组。\n\n`groups` 参数指定了用户将被添加的额外组列表。这种组有时也称为“辅助”（secondary）、“额外”（additional）或“补充”（supplementary）。\n\
  \n`append` 参数非常重要。使用 `yes` 选项，用户将被添加到指定的组。\n\n使用 `no` 选项，所有组成员都将被指定的组覆盖。\n\n总结一下，如果你指定了\
  \ `no` 选项，你将丢失所有之前的组关联，请务必小心！\n\n### 演示\n\n如何使用 Ansible Playbook 在 Linux 中将用户添加到第二个组。\n\
  \n### 核心\n\n* `user_group_addsecondary.yml`\n\n```yaml\n 1 ---\n 2 - name: user\
  \ module demo\n 3   hosts: all\n 4   become: true\n 5   vars:\n 6     myuser: \"\
  example\"\n 7     mygroups:\n 8       - adm\n 9       - sys\n10   tasks:\n 11  \
  \   - name: adding secondary group(s)\n 12       ansible.builtin.user:\n 13    \
  \     name: \"{{ myuser }}\"\n 14         groups: \"{{ mygroups }}\"\n 15      \
  \   append: true\n```\n\n#### 执行\n\n```bash\n 1 $ ansible-playbook -i virtualmachines/demo/inventory\
  \ user\\\n 2 s_and_groups/user_group_addsecondary.yml\n 3 PLAY [user module demo]\
  \ *********************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [adding secondary groups] **************************\\\
  \n 9 ******************************************\n10 changed: [demo.example.com]\n\
  11 PLAY RECAP **********************************************\\\n12 ******************************************\n\
  13 demo.example.com           : ok=2    changed=1    unreach\\\n14 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n```\n\n#### 执行前\n\n```bash\n 1 $ ssh devops@demo.example.com\n\
