  \n 5 es:/Users/lberton/.ansible/roles:/usr/share/ansible/rol\\\n 6 es:/etc/ansible/roles:/Users/lberton/prj/github/ansible-p\\\
  \n 7 ilot/galaxy\n 8 \n 9 The error appears to be in '/Users/lberton/prj/github/ans\\\
