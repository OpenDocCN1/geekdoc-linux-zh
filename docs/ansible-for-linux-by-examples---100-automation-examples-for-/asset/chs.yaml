  \ 模块 yum, copy, service firewalld\n\n如何使用 Ansible 模块 `yum`、`copy`、`service`、`firewalld`\
  \ 在 RedHat 类系统上自动化部署带有自定义网页的 `httpd` Web 服务器，并处理下载、安装、启动并设置机自启，以及开放相关的防火墙端口。支持 RedHat\
  \ Enterprise Linux,CentOS, CentOS Stream,Fedora,ClearOS, Oracle Linux,EuroLinux,Fermi\
  \ Linux, EulerOS, ROSA Linux,Springdale Linux,Asianux。\n\n### 在 RedHat 类系统上部署 apache\
  \ httpd Web 服务器\n\n*   安装软件包 ⇒ `ansible.builtin.yum`\n*   自定义 index.html ⇒ `ansible.builtin.copy`\n\
  *   启动服务 ⇒ `ansible.builtin.service`\n*   开放防火墙 ⇒ `ansible.posix.firewalld`\n\n\
  让我们讨论一下如何在 RedHat 类 Linux 系统上部署 `httpd` Web 服务器。\n\n整个过程需要四个步骤，你可以通过不同的 Ansible\
  \ 模块来实现自动化。\n\n1. 来说，你需要使用 `ansible.builtin.yum` Ansible 模块安装 `httpd` 软件包及其依赖项。\n\
  2. 其次，你需要使用 `ansible.builtin.copy` Ansible 模块创建自定义的 `index.html`。你可以使用 `template`\
  \ 模块升级此步骤。\n3. 接着，你需要启动 `httpd` 服务并设置为机自启，使用 `ansible.builtin.service` 模块完成所有操作。\n\
  4. 最后，你需要使用 `ansible.posix.firewalld` 模块开放相关的防火墙端口。\n\n### demo\n\n使用 Ansible Playbook\
  \ 在 RedHat 类系统上部署 `httpd` Web 服务器。\n\n#### code\n\n```yaml\n---\n- name: setup webserver\n\
  \  hosts: all\n  become: true\n  tasks:\n    - name: httpd installed\n      ansible.builtin.yum:\n\
  \        name: httpd\n        state: latest\n    - name: custom index.html\n   \
  \   ansible.builtin.copy:\n        dest: /var/www/html/index.html\n        content:\
  \ |\n          Custom Web Page\n    - name: httpd service\n      ansible.builtin.service:\n\
  \        name: httpd\n        enabled: true\n        state: started\n    - name:\
  \ open firewall\n      ansible.posix.firewalld:\n        service: http\n       \
  \ permanent: yes\n        state: enabled\n```\n\n### execution\n\n```bash\n1 $ ansible-playbook\
  \ -i inventory playbook.yml\n\nPLAY [setup webserver] ***********************************************************\n\
  ****************************************************************************************************\n\
  localhost: [localhost]                                                         \
  \         =ok\n****************************************************************************************************\n\
  \nchanged: [localhost] => (changed=1, msg=\"changed: yum\") \nchanged: [localhost]\
  \ => (changed=1, msg=\"changed: copy\") \nchanged: [localhost] => (changed=1, msg=\"\
  changed: service\") \nchanged: [localhost] => (changed=1, msg=\"changed: firewall\"\
  ) \n\nPLAY RECAP *************************************************************************************\n\
  localhost                  : ok=5    changed=4    reachable=1    unreachable=0 \
  \   failed=0\n```\n\n#### idempotency\n\n```bash\n1 $ ansible-playbook -i inventory\
  \ playbook.yml\n\nPLAY [setup webserver] ***************************************************************************\n\
  ****************************************************************************************************\n\
