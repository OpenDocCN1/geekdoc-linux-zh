  \n当变量没有拼写错误，但使用 `ansible_hostname` 内部变量和 `gather_facts` 布尔值未定义时的根本原因分析。\n\n大多数情况下，原因是变量拼写错误或确实未定义。此用例的特殊之处在于内部变量\
  \ `ansible_hostname`。\n\n### 演示\n\n讨论 Ansible 故障排除的最佳方法是进入现场演示，直观地展示“变量未定义！”以及如何解决它！\n\
  \n#### 错误代码\n\n```yaml\n---\n- name: hostname demo\n  hosts: all\n  gather_facts:\
  \ false\n  tasks:\n    - name: print hostname\n      ansible.builtin.debug:\n  \
  \      var: ansible_hostname\n```\n\n#### 错误执行\n\n```bash\nansible-pilot $ ansible-playbook\
  \ -i virtualmachines/demo/\\\ninventory troubleshooting/variablenotdefined_error.yml\n\
  PLAY [hostname demo] ************************************\n******************************************\n\
  TASK [print hostname] *******************\n******************************************\n\
  ok: [demo.example.com] => {\n  \"ansible_hostname\": \"VARIABLE IS NOT DEFINED!\"\
  \n}\nPLAY RECAP **********************************************\n******************************************\n\
  demo.example.com           : ok=1    changed=0    unreachable=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\nansible-pilot $\n```\n\n#### 修复代码\n\n```yaml\n---\n\
  - name: hostname demo\n  hosts: all\n  gather_facts: true\n  tasks:\n    - name:\
  \ print hostname\n      ansible.builtin.debug:\n        var: ansible_hostname\n\
  ```\n\n#### 修复执行\n\n```bash\nansible-pilot $ ansible-playbook -i virtualmachines/demo/\\\
  \ninventory troubleshooting/variablenotdefined_fix.yml\nPLAY [hostname demo] ************************************\n\
  ******************************************\nTASK [Gathering Facts] *********************************\n\
  ******************************************\nok: [demo.example.com]\nTASK [print\
  \ hostname] *********************************\n******************************************\n\
  ok: [demo.example.com] => {\n    \"ansible_hostname\": \"demo\"\n}\nPLAY RECAP **********************************************\n\
  ******************************************\ndemo.example.com           : ok=2  \
  \  changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n\
  ansible-pilot $\n```\n\n## Ansible 故障排除 - 此命令必须在 root 用户下运行\n\n权限错误信息是令人讨厌的 Ansible\
  \ 问题。在现场演示中，我们将从错误消息开始故障排除。我们将调查问题的根本原因并使用包模块进行修复。\n\n这种致命错误消息发生在我们在模块执行期间尝试执行更高权限的模块时。\n\
  \n这些情况通常与 Ansible Playbook 或 Ansible 配置有关。\n\n### 演示\n\n讨论 Ansible 故障排除的最佳方法是进入现场演示，直观地展示“此命令必须在\
  \ root 用户下运行”以及如何解决它！\n\n此演示将尝试在目标系统上安装“rsync”包。\n\n#### 错误代码\n\n```yaml\n---\n\
  - name: troubleshooting under the root user\n  hosts: all\n  become: false\n  tasks:\n\
  \    - name: rsync installed\n      ansible.builtin.package:\n        name: rsync\n\
  \        state: present\n```\n\n#### 错误执行\n\n```bash\nansible-pilot $ ansible-playbook\
  \ -i virtualmachines/demo/\\\ninventory troubleshooting/under_root_user_error.yml\n\
  PLAY [troubleshooting under the root user] ***************\n******************************************\n\
  TASK [Gathering Facts] *********************************\n******************************************\n\
  ok: [demo.example.com]\nTASK [rsync installed] *********************************\n\
  ******************************************\nfatal: [demo.example.com]: FAILED! =>\
  \ {\"changed\": false,\n \"msg\": \"This command has to be run under the root user.\"\
  ,\n \"results\": []}\nPLAY RECAP **********************************************\n\
  ******************************************\ndemo.example.com           : ok=1  \
  \  changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n\
  ansible-pilot $\n```\n\n#### 修复代码\n\n```yaml\n---\n- name: troubleshooting under\
  \ the root user\n  hosts: all\n  become: true\n  tasks:\n    - name: rsync installed\n\
  \      ansible.builtin.package:\n        name: rsync\n        state: present\n```\n\
  \n\n\n\n\n```\nansible-pilot $ ansible-playbook -i virtualmachines/demo/\\\ninventory\
  \ troubleshooting/under_root_user_fix.yml\nPLAY [troubleshooting under the root\
  \ user] **************\n******************************************\nTASK [Gathering\
  \ Facts] ***********************************\n******************************************\n\
  ok: [demo.example.com]\nTASK [rsync installed] ***********************************\n\
  ******************************************\nok: [demo.example.com]\nPLAY RECAP **********************************************\n\
  ******************************************\ndemo.example.com           : ok=2  \
  \  changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n\
  ansible-pilot $\n```\n\n# 感谢\n\n提醒你一下，Ansible 是红帽（Red Hat）不断演进的产品。\n\n在书中，我们涵盖了最常用的操作系统中最实日常代码和活动。\n\
