  ```\n\n# SELinux Policy and Modes\nSELinux (Security-Enhanced Linux) 是一种提供强制访问控制（mandatory\
  \ access control）的机制。\n\n# SELinux 策略\nSELinux (Security-Enhanced Linux) 是一种安全机制，提供强制访问控制（mandatory\
  \ access control）。\n\n## Overview\n通过以下命令 `ssh` 到服务器并检查 `dummy` 状态：\n\n```bash\n\
  $ ssh devops@demo.example.com\nLast login: Wed Jan 12 07:35:19 2022 from 192.168.0.101\n\
  [devops@demo ~]$ sudo su\n[root@demo devops]# lsmod | grep dummy\ndummy        \
  \          16384  0\n```\n\n## 查看系统日志了解 SELinux 状态：\n```bash\n[root@demo devops]#\
  \ less /var/log/messages \n[root@demo devops]# tail /var/log/messages\n```\n\n输出示例：\n\
