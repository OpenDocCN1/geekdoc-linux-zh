  \   \"wusr\": true,\n57             \"xgrp\": true,\n58             \"xoth\": true,\n\
  59             \"xusr\": true\n60         }\n61     }\n62 }\n63 TASK [复制文件] **********************************\\\
  \n64 ****************************************************\n65 ok: [demo.example.com]\n\
  66 TASK [重命名文件] *********************************\\\n67 ****************************************************\n\
  68 ok: [demo.example.com]\n```\n\n## 如何重命名文件或目录\n\n上面的示例演示了如何使用 Ansible 来重命名文件或目录。\n\
  \n- `ansible-playbook` 是运行 Ansible Playbook 的命令。\n- `-i demo/inventory` 指定清单文件路径。\n\
  - `rename/file.yml` 是包含重命名逻辑的 Playbook 文件。\n\n在这个任务中，我们使用了 `file` 模块来检查文件状态、打印调试信息并执行重命名操作。\n\
  \n\n\n\n\n```\n 1 ansible-pilot $ ansible-playbook -i virtualmachines/demo/\\\n\
  \ 2 inventory file_management/file_permission.yml\n 3 PLAY [file module demo] *********************************\\\
  \n 4 **********************************************************\n 5 TASK [Gathering\
  \ Facts] **********************************\\\n 6 **********************************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [set execution permission] *************************\\\
  \n 9 **********************************************************\n10 ok: [demo.example.com]\n\
  11 PLAY RECAP **********************************************\\\n12 **********************************************************\n\
  13 demo.example.com           : ok=2    changed=0    unreach\\\n14 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n15 ansible-pilot $\n```\n\n#### 执行前\n\n\
  ```\n1 ansible-pilot $ ssh devops@demo.example.com\n2 Last login: Wed Mar 30 13:38:46\
  \ 2022 from 192.168.0.59\n3 [devops@demo ~]$ cat example.sh \n4 #!/bin/bash\n5 echo\
  \ \"Hello World\"\n6 [devops@demo ~]$[devops@demo ~]$ ls -al example.sh \n7 -rw-r--r--.\
  \ 1 devops wheel 31 Mar 30 13:39 example.sh\n8 [devops@demo ~]$\n```\n\n#### 执行后\n\
  \n```\n1 ansible-pilot $ ssh devops@demo.example.com\n2 Last login: Wed Mar 30 13:40:36\
  \ 2022 from 192.168.0.59\n3 [devops@demo ~]$ ls -al example.sh \n4 -rwxr-xr-x. 1\
  \ devops wheel 31 Mar 30 13:39 example.sh\n5 [devops@demo ~]$ ./example.sh \n6 Hello\
  \ World\n7 [devops@demo ~]$ cat example.sh \n8 #!/bin/bash\n9 echo \"Hello World\"\
  \n```\n\n## 删除文件或目录 - Ansible 模块 file\n\n一个关于如何使用 Ansible 删除“deleteme”文件或“deleteme”目录的真实示例。\n\
  \n让我们来聊聊 Ansible 模块 `file`。\n\n它的全名是 `ansible.builtin.file`，这意味着它是 Ansible 内置（builtin）模块合集的一部分，并随\
  \ Ansible 一起发布。\n\n这是一个非常稳定的模块，已经发布了多年。\n\n它可以在不同的操作系统上运行。\n\n它管理文件和文件属性。\n\n对于\
  \ Windows 目标，请使用 `ansible.windows.win_file` 模块。\n\n### 主要参数\n\n* `path` 字符串 (dest,\
  \ name) - 文件路径\n* `owner` 字符串 - 用户\n* `group` 字符串 - 组\n* `mode` raw - 例：‘0644’ 或‘u=rw,g=r,o=r’\n\
  * `state` 字符串 - 文件/不存在/目录/硬链接/链接/touch\n* `setype/seuser/selevel` - SELinux\n\n\
  唯一要求的参数是“path”，你可以在此处指定要编辑的文件文件系统路径。\n\n参数“owner”设置应该拥有该文件/目录的用户。\n\n参数“group”设置应该拥有该文件/目录的组。\n\
  \n参数“mode”以 UNIX 方式设置文件/目录的权限。\n\nstate 定义了我们正在修改的对象类型，默认是“file”，但我们也可以处理目录、硬链接、符号链接，或者使用“touch”选项仅更新访问时间。\n\
  \n对于我们的用例，我们将使用“absent”选项。\n\n让我也强调一下，我们还可以指定 SELinux 属性。\n\n### 演示\n\n如何使用 Ansible\
  \ 删除“deleteme”文件或“deleteme”目录。\n\n* `file.yml`\n\n```\n 1 ---\n 2 - name: file module\
  \ demo\n 3   hosts: all\n 4   vars:\n 5     mypath: \"/home/devops/deleteme\"\n\
  \ 6   become: false\n 7   tasks:\n 8     - name: \"{{ mypath }}\" 不复存在\n 9     \
  \  ansible.builtin.file:\n10         path: \"{{ mypath }}\"\n11         state: \"\
  absent\"\n```\n\n## 下载文件 - Ansible 模块 get_url\n\n如何从 URL 下载 tar 包、验证校验和并使用 Ansible\
  \ 分配权限。\n\n让我们来聊聊 Ansible 模块 `get_url`。\n\n它的全名是 `ansible.builtin.get_url`，这意味着它是\
  \ Ansible 内置（builtin）模块合集的一部分，并随 Ansible 一起发布，属于 `ansible-core` 的。\n\n这是一个非常稳定的模块，已经发布了多年。\n\
  \n它可以在不同的操作系统上运行。\n\n它从 HTTP、HTTPS 或 FTP 下载文件到节点。\n\n对于 Windows 目标，请使用 `ansible.windows.win_get_url`\
  \ 模块。\n\n### 参数\n\n* `url` 字符串 - URL\n* `dest` 字符串 - 路径\n* `force` 字符串 - no/yes\n\
  * `checksum` 字符串 - `<algorithm>:<checksum|url>`\n* `force_basic_auth/url_username/url_password/use_gssapi`\
  \ - HTTP 基础认证/GSSAPI-Kerberos\n* `headers` 字典 - 自定义 HTTP 头部\n* `http_agent` 字符串\
  \ - 自定义 HTTP 头部\n\n* `url` `dest` `force` `checksum` `force_basic_auth/url_username/url_password/use_gssapi`\
  \ `headers` `http_agent` `owner` `group` `mode` `setype/seuser/selevel`\n\n两个必需参数是\
  \ `url` 和 `dest`。\n\n`url` 指定 URL。\n`dest` 指定路径。\n`force` 参数处理 no/yes。\n`checksum`\
  \ 指定 `<algorithm>:<checksum|url>`。\n`force_basic_auth/url_username/url_password/use_gssapi`\
  \ 处理 HTTP 基础认证/GSSAPI-Kerberos。\n`headers` 字典允许自定义 HTTP 头部。\n`http_agent` 用于自定义\
  \ HTTP 头部。\n\n`owner`, `group`, `mode` 用于权限。\n`setype/seuser/selevel` 用于 SELinux。\n\
  \n`url` 指定 URL。\n`dest` 指定路径。\n`force` 参数是 no/yes。\n`checksum` 是 `<algorithm>:<checksum|url>`。\n\
  `force_basic_auth/url_username/url_password/use_gssapi` 用于 HTTP 基础认证/GSSAPI-Kerberos。\n\
  `headers` 用于自定义 HTTP 头部。\n`http_agent` 用于自定义 HTTP 头部。\n\n`owner`, `group`, `mode`\
  \ 用于权限。\n`setype/seuser/selevel` 用于 SELinux。\n\n`url` 指定 URL。\n`dest` 指定路径。\n`force`\
  \ 参数是 no/yes。\n`checksum` 是 `<algorithm>:<checksum|url>`。\n`force_basic_auth/url_username/url_password/use_gssapi`\
  \ 用于 HTTP 基础认证/GSSAPI-Kerberos。\n`headers` 用于自定义 HTTP 头部。\n`http_agent` 用于自定义 HTTP\
  \ 头部。\n`owner`, `group`, `mode` 用于权限。\n`setype/seuser/selevel` 用于 SELinux。\n\n`url`\
  \ 指定 URL。\n`dest` 指定路径。\n`force` 参数是 no/yes。\n`checksum` 是 `<algorithm>:<checksum|url>`。\n\
  `force_basic_auth/url_username/url_password/use_gssapi` 用于 HTTP 基础认证/GSSAPI-Kerberos。\n\
  `headers` 用于自定义 HTTP 头部。\n`http_agent` 用于自定义 HTTP 头部。\n`owner`, `group`, `mode`\
  \ 用于权限。\n`setype/seuser/selevel` 用于 SELinux。\n\n`url` 指定 URL。\n`dest` 指定路径。\n`force`\
  \ 参数是 no/yes。\n`checksum` 是 `<algorithm>:<checksum|url>`。\n`force_basic_auth/url_username/url_password/use_gssapi`\
  \ 用于 HTTP 基础认证/GSSAPI-Kerberos。\n`headers` 用于自定义 HTTP 头部。\n`http_agent` 用于自定义 HTTP\
  \ 头部。\n`owner`, `group`, `mode` 用于权限。\n`setype/seuser/selevel` 用于 SELinux。\n\n###\
  \ 演示\n\n如何从 URL 下载 tar 包、验证校验和并使用 Ansible 分配权限。\n\n* `get_url.yml`\n\n```\n 1 ---\n\
  \ 2 - name: get_url demo\n 3   hosts: all\n 4   become: false\n 5   vars:\n 6  \
  \   myurl: \"https://example.com/file.tar.gz\"\n 7     mycrc: \"sha256:hashvalue\"\
  \n 8     mydest: \"/home/devops\"\n 9   tasks:\n 10     - name: download file\n\
  \ 11       ansible.builtin.get_url:\n 12         url: \"{{ myurl }}\"\n 13     \
  \    dest: \"{{ mydest }}\"\n 14         checksum: \"{{ mycrc }}\"\n 15        \
  \ mode: \"0644\"\n 16         owner: devops\n 17         group: wheel\n```\n\n##\
  \ 解压包 - Ansible 模块 unarchive\n\n下载 zip 文件并解压到用户目录。剧本还会处理必要的依赖项。\n\n让我们来聊聊 Ansible\
  \ 模块 `unarchive`。\n\n它的全名是 `ansible.builtin.unarchive`，这意味着它是 Ansible 内置（builtin）模块合集的一部分，并随\
  \ Ansible 一起发布。\n\n这是一个非常稳定的模块，已经发布了多年。\n\n它可以在不同的操作系统上运行。\n\n它在从本地机器复制后解压压缩包。\n\
  \n它可以处理目标主机。\n\n请注意，对于 Unix 文件格式，它需要 tar 包（`.tar` 存档）。\n\n对于 Windows 目标，请使用 Ansible\
  \ `community.windows.win_unzip` 模块。\n\n### 参数\n\n* `src` 字符串 - 路径\n* `dest` 字符串\
  \ - 路径\n* `remote_src` 布值 - no/yes\n* `validate_certs` 布值 - no/yes（仅限 https）\n*\
  \ `include/exclude` 列表 - 目录和文件项\n* `extra_opts` 字符串 - 命令行选项\n* `keep_newer` 布值 -\
  \ no/yes\n* `mode/owner/group` - 权限\n* `setype/seuser/selevel` - SELinux\n\n强制参数是\
  \ `src` 和 `dest`，它们是源和目标路径。`src` 非常特殊，因为它应该是 Ansible 控制器上的本地路径。\n\n我们可以通过启用“remote_src”属性来切换到远程路径。\n\
  \n在 `src` 参数中，我们也可以输入 URL，因此压缩包将在解压之前被下载。\n\n\n\n\n\n其他有用的参数是 `include` 和 `exclude`，它们允许我们指定要提取的归包子，具体为包含或排除的文件或目录列表。\n\
  \n以防万一我们需要额外的命令行选项，我们可以在 `extra_opts` 参数中指定它们。\n\n如果文件已经存在于目标机器上，默认行为是不替换比归包文件中新的文件，你可以通过启用\
  \ `keep_newer` 参数来覆盖此行为。\n\n让我也强调一下，我们还可以指定一些权限或 SELinux 属性。\n\n### demo\n\n如何使用\
  \ Ansible Playbook 在 Ansible 中提取归包。\n\n*   `unarchive.yml`\n\n```\n 1 ---\n 2 -\
  \ name: unarchive module demo\n 3   hosts: all\n 4   become: false\n 5   vars:\n\
  \ 6     myurl: \"https://github.com/lucab85/ansible-pilot/arch\\\n7 ive/refs/heads/master.zip\"\
  \n 8   tasks:\n 9     - name: extractor presents\n10       ansible.builtin.yum:\n\
  11         name:\n12           - unzip\n13           - tar\n14         state: present\n\
  15       become: true\n16 - name: extract archive\n17       ansible.builtin.unarchive:\n\
  18         src: \"{{ myurl }}\"\n19         dest: \"/home/devops/\"\n20        \
  \ remote_src: true\n21         validate_certs: true\n```\n\n## 在 Linux 中创建符号链接（也称为\
  \ symlink 或软链接 - Ansible 模块文件\n\n如何使用 Ansible 在 Linux 文件系统中创建一个指向 `/proc/cpuinfo`\
  \ 的“example”符号/软链接。\n\n### Ansible 创建符号链接\n\n*   `ansible.builtin.file`\n*   管理文件和文件属性\n\
  \n让我们聊聊 Ansible 模块 `file`。\n\n全名为 `ansible.builtin.file`，这意味着它是内置置模块集合的一部分，并随 Ansible\
  \ 一起发布。\n\n这是一个非常稳定的模块，已经发布了多年。\n\n它可以在不同的操作系统上运行。\n\n它管理文件和文件属性。\n\n对于 Windows\
  \ 目标，请使用 `ansible.windows.win_file` 模块。\n\n### Parameters\n\n*   `src` string -\
  \ 符号链接路径\n*   `dest` string - 目标文件路径\n*   `state` string - 文件/不存在/符号链接/硬链接/链接/touch\n\
  *   `mode/owner/group` - 权限\n*   `setype/seuser/selevel` - SELinux\n\n该模块具有执行任何任务的参数。\n\
  \n两个必填字段是“src”和“dest”，它们指定链接和目标文件的文件系统路径。\n\n`state` 定义了我们要修改的对象类型，默认是“file”，但对于我们的用例，我们需要“link”选项。\n\
  \n让我也强调一下权限和 SELinux 参数。\n\n### demo\n\n如何使用 Ansible 在 Linux 文件系统中创建一个指向 `/proc/cpuinfo`\
  \ 的“example”符号/软链接。\n\n#### code\n\n*   `create_symlink.yml`\n\n```\n 1 ---\n 2\
