  \ \n\n适用于 RedHat 类系统的 Docker 容器中的 Apache Web 服务器\n\n# Ansible Linux 安全\n\n在本章中，你将发现如何执行最常见的\
  \ Linux 安全任务。\n\n## 设置 sys 内内核参数 - Ansible 模块 sysctl\n\n如何使用 Ansible 自动化设置或验证 Linux\
  \ 内核参数 `vm.swappiness` 为 `5`。\n\n### Ansible sysctl\n\n今天我们讨论的是 `ansible.posix.sysctl`\
  \ 模块。全名是 `ansible.posix.sysctl`，这意味着它是 `ansible.posix` 集合的一部分，用于与 POSIX 平台交互。该模块的作用是管理\
  \ `sysctl.conf` 文件中的项。\n\n### 参数\n\n* `name` (key) - 参数名\n* `value` - 参数值\n* `reload`\
  \ - yes/no\n* `state` - present/absent（存在/不存在）\n* `sysctl_file` - `/etc/sysctl.conf`\n\
  * `sysctl_set` - no/yes - `sysctl`\n* `ignoreerrors` - no/yes\n\n让我总结一下 `sysctl`\
  \ 模块的参数。唯一要求的参数是 `name`，你在此指定要访问或编辑的参数。`value` 设置 `sysctl` 参数的值。`reload` 默认为 `yes`，如果发生任何更改则重新加载配置文件。`state`\
  \ 设置参数在 `sysctl` 文件中存在或不存在。`sysctl_file` 允许指定 `sysctl` 的配置文件，默认为 `/etc/sysctl.conf`。`sysctl_set`\
  \ 允许你永久配置参数，重启后依然有效。`ignoreerrors` 允许忽略未知键的错误，默认为 `no`。\n\n### 链接\n\n[sysctl 模块](https://docs.ansible.com/ansible/latest/collections/ansible/posix/sysctl_module)\n\
  \n### 演示\n\n如何使用 Ansible 在 Linux 中设置 sysctl 内核参数。\n\n#### 代码\n```yaml\n---\n- name:\
  \ sysctl demo\n  hosts: all\n  become: true\n  vars:\n    sysctl_name: \"vm.swappiness\"\
  \n    sysctl_value: \"5\"\n  tasks:\n    - name: set sysctl\n      ansible.posix.sysctl:\n\
  \        name: \"{{ sysctl_name }}\"\n        value: \"{{ sysctl_value }}\"\n  \
  \      state: present\n        sysctl_set: true\n        reload: true\n```\n\n####\
  \ 执行\n```bash\n$ ansible-playbook -i virtualmachines/demo/inventory sysctl.yml\n\
  PLAY [sysctl module demo]\nTASK [Gathering Facts]\nok: [demo.example.com]\nTASK\
  \ [ansible.posix.sysctl]\nchanged: [demo.example.com]\nPLAY RECAP\ndemo.example.com:\
  \ ok=2    changed=1 unreachable=0    failed=0    skipped=0    rescued=0ignored=0\n\
  ```\n\n#### 等等性\n```bash\n$ ansible-playbook -i virtualmachines/demo/inventory sysctl.yml\n\
  PLAY [sysctl module demo]\nTASK [Gathering Facts]\nok: [demo.example.com]\nTASK\
  \ [ansible.posix.sysctl]\nok: [demo.example.com]\nPLAY RECAP\ndemo.example.com:\
  \ ok=2    changed=0 unreachable=0    failed=0    skipped=0    rescued=0ignored=0\n\
  ```\n\n#### 执行前\n```bash\n$ ssh devops@demo.example.com\nLast login: Fri Jan  7\
  \ 07:26:29 2022 from 192.168.0.102\n[devops@demo ~]$ sudo su\n[root@demo devops]#\
  \ sysctl -a | less\n[root@demo devops]# sysctl vm.swappiness\nvm.swappiness = 30\n\
  [root@demo devops]# cat /etc/sysctl.conf \n# sysctl settings are defined through\
  \ files in\n# /usr/lib/sysctl.d/, /run/sysctl.d/, and /etc/sysctl.d/.\n#\n# Vendors\
  \ settings live in /usr/lib/sysctl.d/.\n# 要覆盖整个文件，请在 /etc/sysctl.d/ 中创建一个同名文件\n\
