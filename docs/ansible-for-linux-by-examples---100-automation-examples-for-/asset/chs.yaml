  \ Ansible lookup env\n\n如何自动化读取 `HOME` 环境变量并在 `lookup env` 插件中使用于你的 Ansible Playbook\
  \ 代码中。\n\n### Ansible 读取环境变量\n\n* `ansible.builtin.env`\n* 读取环境变量的值\n\n让我们深入研究 Ansible\
  \ `env` 查找插件。\n\n插件是扩展 Ansible 功能的一种方式。特别是通过 `lookup` 插件，你可以从外部源加载变量或模板。\n\n它的全称为\
  \ `ansible.builtin.env`，是 `ansible-core` 的一部分，并包含在所有 Ansible 安装中。\n\n`env` 查找插件的目的是读取环境变量的值。\n\
  \n### 参数与返回值\n\n### 参数\n\n* `_terms` 字符串 - 环境变量\n\n### 返回值\n\n* `_raw` 列表 - 来自环境变量的值\n\
  \n`env` 插件的参数。\n\n唯一必需的参数是默认的 `_terms`，要读取的环境变量名称。通常用法是将查找插件赋值给变量名，但你也可以直接在 Ansible\
  \ 任务中使用它。\n\n### 示例 (demo)\n\n使用 Ansible Playbook 读取环境变量。\n\n#### 代码\n\n```\n---\n\
  - name: environment demo\n  hosts: all\n  tasks:\n     - name: display HOME\n  \
  \     ansible.builtin.debug:\n         msg: \"{{ lookup('env', 'HOME') }}\"\n```\n\
  \n#### 执行\n\n```\n 1 ansible-pilot $ printenv | grep HOME\n 2 HOME=/Users/lberton\n\
  \ 3 ansible-pilot $ ansible-playbook -i virtualmachines/demo/\\\n 4 inventory ansible\\\
  \ statements/environment.yml\n 5 PLAY [environment demo] *********************************\\\
  \n 6 ******************************************\n 7 TASK [Gathering Facts] **********************************\\\
  \n 8 ******************************************\n 9 ok: [demo.example.com]\n 10\
  \ TASK [display HOME] *************************************\\\n 11 ******************************************\n\
  \ 12 ok: [demo.example.com] => {\n 13     \"msg\": \"/Users/lberton\"\n 14 }\n 15\
  \ PLAY RECAP **********************************************\\\n 16 ******************************************\n\
  \ 17 demo.example.com           : ok=2    changed=0    unreach\\\n18 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n19 ansible-pilot $\n```\n\n\n\n\n\n```\n\
  \ 1 ansible-pilot $ printenv | grep HOME\n 2 HOME=/Users/lberton\n 3 ansible-pilot\
  \ $ ansible-playbook -i virtualmachines/demo/\\\n 4 inventory ansible\\ statements/environment.yml\n\
  \ 5 PLAY [environment demo] *********************************\\\n 6 ******************************************\n\
