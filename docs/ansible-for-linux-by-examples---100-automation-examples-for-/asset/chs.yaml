  \ Ansible Playbook 传递变量？\n\n*   `--extra-vars \"fruit=apple\"`\n*   `--extra-vars\
  \ '{\"fruit\":\"apple\"}'`\n*   `--extra-vars \"@file.json\"`\n*   `--extra-vars\
  \ \"@file.yml\"`\n\n今天我们讨论 Ansible 变量。在命令行中向 Playbook 传递变量简单的方法是使用 `ansible-playbook`\
  \ 命令的 `extra-vars` 参数。这对于将你的 Ansible Playbook 与某些现有的自动化脚本结合非常有用。另一种变量的方法是命令行参数 `--extra-vars\
  \ \"variable=value\"` 允许你从终端传递某些值。你也可以指定 JSON 格式的参数或包含 JSON 或 YAML 文件。\n\n### demo\n\
  \n在命令行中传递额外变量。\n\n#### code\n```yaml\n---\n- name: extra variable demo\n  hosts:\
  \ all\n  vars:\n    fruit: \"banana\"\n  task:\n    - name: print message\n    \
  \  ansible.builtin.debug:\n        msg: \"fruit is {{ fruit }}\"\n```\n\n#### 无额外变量执行\n\
  ```bash\n$ ansible-playbook --extra-vars=\"fruit=apple\" -i virtualmachines/demo/inventory\
  \ extra-variable/example.yml\nPLAY [extra variable demo] ******************************\n\
  ******************\nTASK [Gathering Facts] *********************************\n******************\n\
  ok: [demo.example.com]\nTASK [message] *************************************\n*************************\n\
  ok: [demo.example.com] => {\n    \"msg\": \"fruit is apple\"\n}\nPLAY RECAP **********************************************\n\
  *************************\ndemo.example.com           : ok=2    changed=0    unreachable=0\
  \    failed=0    skipped=0    rescued=0    ignored=0\nansible-pilot $\n```\n\n####\
  \ 使用普通额外变量执行\n```bash\n$ ansible-playbook -i virtualmachines/demo/inventory --extra-vars=\"\
  fruit=apple\" extra-variable/example.yml\nPLAY [extra variable demo] ******************************\n\
  ******************\nTASK [Gathering Facts] *********************************\n******************\n\
  ok: [demo.example.com]\nTASK [message] *************************************\n*************************\n\
  ok: [demo.example.com] => {\n    \"msg\": \"fruit is apple\"\n}\nPLAY RECAP **********************************************\n\
  *************************\ndemo.example.com           : ok=2    changed=0    unreachable=0\
  \    failed=0    skipped=0    rescued=0    ignored=0\n```\n\n#### 使用 JSON 额外变量执行\n\
  ```bash\n$ ansible-playbook -i virtualmachines/demo/inventory --extra-vars='{\"\
  fruit\":\"raspberry\"}' extra-variable/example.yml\nPLAY [extra variable demo] ******************************\n\
  ******************\nTASK [Gathering Facts] *********************************\n******************\n\
  ok: [demo.example.com]\nTASK [message] *************************************\n*************************\n\
  ok: [demo.example.com] => {\n    \"msg\": \"fruit is raspberry\"\n}\nPLAY RECAP\
  \ **********************************************\n*************************\ndemo.example.com\
  \           : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n```\n\n## 跨行拆分字符串 - Ansible 字面量和折叠块标量运算符\n\n如何在 Ansible 中将字符串跨行拆分？在通用的\
  \ YAML 语言中也是如此。\n\n基本上，有两个不同的运算符：\n\n*   `|` - 字面块标量 (Literal Block Scalar)\n* \
  \  `>` - 折叠块标量 (Folded Block Scalar)\n\n我很容易通过示例向你展示其行为。\n\n### 示例\n\n#### variable1\
  \ code\n```yaml\nvariable_name: |\n  line one\n  line two\n  line three\n```\n\n\
  ```yaml\nvariable_name: >\n  line one\n  line two\n  line three\n```\n\n\n\n\n```\n\
  1 variable1: |\n2  exactly as you see\n3  will appear these three\n4  lines of poetry\n\
  ```\n\n#### variable1 output\n\n```\n1  exactly as you see\n2  will appear these\
  \ three\n3  lines of poetry\\n\n```\n\n#### variable2 code\n\n```\n1 variable2:\
  \ >\n2  this is really a\n3  single line of text\n4  despite appearances\n```\n\n\
  #### variable2 output\n\n```\n1 variable2: this is really a single line of text\
  \ despite a\\\n2 pearances\\n\n```\n\n欢迎来到示例章节。\n\n让我们假设我们有两个多行变量 `variable1` 和\
  \ `variable2`。\n\n它们都是多行变量，但 `variable1` 使用了 `|` 字面块量（Literal Block Scalar）运算符，而\
  \ `variable2` 使用了 `>` 折叠块量（Folded Block Scalar）运算符。\n\n结果是，`variable1` 保持多行格式，而\
  \ `variable2` 则被折叠成单行，并将换行符替换为空格。\n\n请注意，两个变量在字符串末尾都有一个换行符。\n\n你想移除字符串末尾的换行符吗？只需在\
  \ `|` 或 `>` 运算符后添加一个 `-`（减号）即可！\n\n### demo\n\n通过示例演示如何在 Ansible 中跨行编写字符串。\n\n####\
  \ code1\n\n```\n 1 ---\n 2 - name: debug module demo\n 3   hosts: all\n 4   vars:\n\
  \ 5     variable1: |\n 6       exactly as you see\n 7       will appear these three\n\
  \ 8       lines of poetry\n 9     variable2: >\n10       this is really a\n11  \
  \     single line of text\n12       despite appearances\n13   tasks:\n14     - name:\
  \ print variable1\n15       ansible.builtin.debug:\n16         var: variable1\n\
  17 - name: print variable2\n18       ansible.builtin.debug:\n19         var: variable2\n\
  ```\n\n#### execution1\n\n```\n 1 $ ansible-playbook -i virtualmachines/demo/inventory\
  \ prin\\\n 2 t\\ text\\ variable\\ during\\ execution/multi-line.yml\n 3 PLAY [debug\
  \ module demo] ********************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [print variable1] **********************************\\\
  \n 9 ******************************************\n10 ok: [demo.example.com] => {\n\
  11     \"variable1\": \"exactly as you see\\nwill appear these t\\\n12 hree\\nlines\
  \ of poetry\\n\"\n13 }\n14 TASK [print variable2] **********************************\\\
  \n15 ******************************************\n16 ok: [demo.example.com] => {\n\
  17     \"variable2\": \"this is really a single line of text de\\\n18 spite appearances\\\
  n\"\n19 }\n20 PLAY RECAP **********************************************\\\n21 ******************************************\n\
  22 demo.example.com           : ok=3    changed=0    unreach\\\n23 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n24 ansible-pilot $\n```\n\n#### code2\n\
  \n```\n 1 ---\n 2 - name: debug module demo\n 3   hosts: all\n 4   vars:\n 5   \
  \  variable1: |-\n 6       exactly as you see\n 7       will appear these three\n\
  \ 8       lines of poetry\n 9     variable2: >-\n10       this is really a\n11 \
  \      single line of text\n12       despite appearances\n13   tasks:\n14     -\
  \ name: print variable1\n15       ansible.builtin.debug:\n16         var: variable1\n\
  17 -- name: print variable2\n18       ansible.builtin.debug:\n19         var: variable2\n\
  ```\n\n#### execution2\n\n```\n 1 $ ansible-playbook -i virtualmachines/demo/inventory\
  \ prin\\\n 2 t\\ text\\ variable\\ during\\ execution/multi-line.yml\n 3 PLAY [debug\
  \ module demo] ********************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [print variable1] **********************************\\\
  \n 9 ******************************************\n10 ok: [demo.example.com] => {\n\
  11     \"variable1\": \"exactly as you see\\nwill appear these t\\\n12 hree\\nlines\
  \ of poetry\"\n13 }\n14 TASK [print variable2] **********************************\\\
  \n15 ******************************************\n16 ok: [demo.example.com] => {\n\
  17     \"variable2\": \"this is really a single line of text de\\\n18 spite appearances\"\
  \n19 }\n20 PLAY RECAP **********************************************\\\n21 ******************************************\n\
  22 demo.example.com           : ok=3    changed=0    unreach\\\n23 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n24 ansible-pilot $\n```\n\n#### code3\n\
  \n```\n 1 ---\n 2 - name: debug module demo\n 3   hosts: all\n 4   vars:\n 5   \
  \  variable1: |-\n 6       exactly as you see\n 7       will appear these three\n\
  \ 8       lines of poetry\n 9     variable2: >-\n10       this is really a\n11 \
