  \ echo $EXAMPLE\n```\n\n---\n\n## 在 Linux 上永久设置系统级环境变量 - /etc/environment - Ansible\
  \ lineinfile 模块\n\n使用 Ansible 模块 `lineinfile` 编辑 `/etc/environment` 文件，自动化实现 Linux\
  \ 系统级环境变量的自定义。\n\n### 在远程 Linux 上永久设置系统级环境变量\n\n*   `/etc/environment`\n\n*   `/etc/profile.d`\
  \ 目录\n\n在 Linux 上配置系统级环境变量主要有两种方式：\n\n*   `/etc/environment` 是一个系统级配置文件，意味着它被所有用户使用。它属于\
  \ root，因此你需要管理员权限或 sudo 才能进行修改。具体而言，该文件存储了系统级的 locale 和路径（path）设置。\n\n*   `/etc/profile`\
  \ 和 `/etc/profile.d/*.sh` 是全局初始化脚本。当通过控制台、终端、ssh 或图形界面进入 bash login shell 时，这些文件会被执行。不过，全局脚本会在用户脚本之前执行，`/etc/profile`\
  \ 在退出之前会执行 `/etc/profile.d/` 中所有的 `*.sh` 脚本。\n\n每个用户都可以自定义自己的 `~/.profile`，这是用户个人的\
  \ shell 初始化脚本。每个用户都有一个文件，并且可以编辑而不影响他人。这等同于每个用户的 `/etc/profile`。\n\n\n\n\n\n```\n\
  \ 1 ---\n 2 - name: set environment demo\n 3   hosts: all\n 4   gather_facts: false\n\
  \ 5   become: true\n 6   vars:\n 7     os_environment:\n 8       - key: EDITOR\n\
  \ 9         value: vi\n10       - key: MY_ENV_VARIABLE\n11         value: ansiblepilot\n\
  12   tasks:\n13     - name: customize /etc/environment\n14       ansible.builtin.lineinfile:\n\
  15         dest: \"/etc/environment\"\n16         state: present\n17         regexp:\
  \ \"^{{ item.key }}=\"\n18         line: \"{{ item.key }}={{ item.value }}\"\n19\
  \       with_items: \"{{ os_environment }}\"\n```\n\n## 执行结果\n\n```\n 1 ansible-pilot\
  \ $ ansible-playbook -i virtualmachines/demo/\\\n 2 inventory ansible\\ statements/set-environment.yml\n\
  \ 3 PLAY [set environment demo] *****************************\\\n 4 ******************************************\n\
  \ 5 TASK [customize /etc/environment] ***********************\\\n 6 ******************************************\n\
  \ 7 changed: [demo.example.com] => (item={'key': 'EDITOR', 'v\\\n 8 alue': 'vi'})\n\
  \ 9 changed: [demo.example.com] => (item={'key': 'MY_ENV_VARI\\\n10 ABLE', 'value':\
  \ 'ansiblepilot'})\n11 PLAY RECAP **********************************************\\\
  \n12 ******************************************\n13 demo.example.com           :\
  \ ok=1    changed=1    unreach\\\n14 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n15 ansible-pilot $\n```\n\n## 等等性检查\n\n```\n 1 ansible-pilot $ ansible-playbook\
  \ -i virtualmachines/demo/\\\n 2 inventory ansible\\ statements/set-environment.yml\n\
  \ 3 PLAY [set environment demo] *****************************\\\n 4 ******************************************\n\
  \ 5 TASK [customize /etc/environment] ***********************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com] => (item={'key': 'EDITOR', 'value'\\\n 8 : 'vi'})\n 9\
  \ ok: [demo.example.com] => (item={'key': 'MY_ENV_VARIABLE'\\\n10 , 'value': 'ansiblepilot'})\n\
  11 PLAY RECAP **********************************************\\\n12 ******************************************\n\
  13 demo.example.com           : ok=1    changed=0    unreach\\\n14 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n15 ansible-pilot $\n```\n\n#### 执行前\n\n\
  ```\n1 ansible-pilot $ ssh devops@demo.example.com\n2 Last login: Tue Feb 22 18:45:12\
  \ 2022 from 192.168.131.111\n3 [devops@demo ~]$ sudo su\n4 [root@demo devops]# printenv\
  \ | grep EDITOR\n5 [root@demo devops]# printenv | grep MY_ENV_VARIABLE\n6 [root@demo\
  \ devops]# cat /etc/environment \n7 [root@demo devops]#\n```\n\n#### 执行后\n\n```\n\
  \ 1-pilot $ ssh devops@demo.example.com\n 2 Last login: Tue Feb 22 18:48:46 2022\
  \ from 192.168.131.111\n 3 [devops@demo ~]$ sudo su\n 4 [root@demo devops]# printenv\
  \ | grep EDITOR\n 5 EDITOR=vi\n 6 [root@demo devops]# printenv | grep MY_ENV_VARIABLE\n\
  \ 7 MY_ENV_VARIABLE=ansiblepilot\n 8 [root@demo devops]# cat /etc/environment \n\
  \ 9 EDITOR=vi\n10 MY_ENV_VARIABLE=ansiblepilot\n11 [root@demo devops]#\n```\n\n\
  # Ansible 代码复用：使用 Ansible Galaxy Roles 和 Collections\n\n在本章中，你将发现如何从 Ansible Galaxy\
  \ 远程目录下载并使用 Ansible Roles 和 Collections（集合）。\n\n## 下载并使用 Ansible Galaxy Role - ansible-galaxy\
  \ 和 requirements.yml\n\n如何下载并使用 Ansible Role `lucab85.ansible_role_log4shell` 来扫描我们的\
  \ Linux 机器，是否存在 Log4Shell 远程代码执行 Log4j (`CVE-2021–44228`) 漏洞，复用 Ansible Galaxy 目录发布的\
  \ Ansible 制品（任务、变量、默认值、处理器、模块和插件）。\n\n### 什么是 Ansible Role？\n\n*   可复用的 Ansible\
  \ 产物\n*   一个角色 包含了任务、变量、默认值、处理器、模块或其他插件\n*   易于通过 Ansible Galaxy 下载和共享\n\nAnsible\
  \ `Role` 是一组可复用的 Ansible 产物。\n\n它解决特定的问题并包含所有相关的任务、变量、默认值、处理器、模块或其他插件。\n\n对于用户来说，Ansible\
  \ Role 易于通过 Ansible Galaxy 下载和共享。\n\n对于开发者来说，Ansible Role 易于通过 Ansible Galaxy 上传和共享。此外，Ansible\
  \ role 有标准的目录结构和格式。\n\n### 什么是 Ansible Galaxy？\n\n*   [Ansible Galaxy](https://galaxy.ansible.com/)\n\
  *   [lucab85/ansible_role_log4shell](https://galaxy.ansible.com/lucab85/ansible_role_log4shell)\n\
  \n该网站的地址为 `https://galaxy.ansible.com/`。\n\n搜索引擎、标签（Tags）和平台让你能够轻松找到内部的任何内容。\n\n\
  建议你仔细评估内容的质量。\n\n质量指标通常是代码质量、支持的操作系统、文档、发布版本、下载次数以及作者。请注意该网站包含 Ansible Roles 和 Collections。今天我们关注的是\
  \ Role。\n\n### 链接\n\n*   `https://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse.html`\n\
  *   `https://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse.html#using-roles`\n\
  *   `https://galaxy.ansible.com/`\n*   `https://galaxy.ansible.com/lucab85/ansible_role_log4shell`\n\
  \n### 演示\n\n让我们进入实际场景，学习如何下载并使用 Ansible Role `lucab85.ansible_role_log4shell`。\n\
  \n#### 代码\n\n*   `role.yml`:\n```yaml\n---\n- name: role\n  hosts: all\n  become:\
  \ true\n  roles:\n    - role: lucab85.ansible_role_log4shell\n      detector_path:\
  \ \"/var/www\"\n```\n\n*   `requirements.yml`:\n```yaml\n---\nroles:\n  - name:\
  \ lucab85.ansible_role_log4shell\n```\n\n#### 下载前的执行\n\n```\n 1 ansible-pilot $\
