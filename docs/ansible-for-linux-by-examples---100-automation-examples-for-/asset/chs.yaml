  \ `community.general.ufw` Ansible 模块打开相关的防火墙服务端口。\n\n#### Demo\n\n如何使用 Ansible Playbook\
  \ 自动化在类 Debian 系统上部署 Web 服务器的 apache httpd 虚拟主机。\n\n### Code\n\n* `httpd_debian_vhost.yml`\n\
  \n```yaml\n 1 ---\n 2 - name: setup webserver vhost\n 3   hosts: all\n 4   become:\
  \ true\n 5   vars:\n 6     app_user: \"www-data\"\n 7     http_host: \"example.com\"\
  \n 8     http_conf: \"example.com.conf\"\n 9     http_port: \"80\"\n10     disable_default:\
  \ true\n11   tasks:\n12     - name: apache installed\n13       ansible.builtin.apt:\n\
  14         name: apache2\n15         update_cache: true\n16         state: latest\n\
  17 \n18     - name: document root exist\n19       ansible.builtin.file:\n20    \
  \     path: \"/var/www/{{ http_host }}\"\n21         state: directory\n22      \
  \   owner: \"{{ app_user }}\"\n23         mode: '0755'\n24 \n25     - name: custom\
  \ index.html\n26       ansible.builtin.copy:\n27         dest: \"/var/www/{{ http_host\
  \ }}/index.html\"\n28         content: |\n29           Custom Web Page\n30 \n31\
  \     - name: set up Apache virtualhost\n32       ansible.builtin.template:\n33\
  \         src: \"templates/apache.conf.j2\"\n34         dest: \"/etc/apache2/sites-available/{{\
  \ http_conf \\\n35 }}\"\n36 \n37     - name: enable new site\n38       ansible.builtin.command:\
  \ \"/usr/sbin/a2ensite {{ htt\\\n39 p_conf }}\"\n40       notify: reload Apache\n\
  41 \n42     - name: disable default Apache site\n43       ansible.builtin.command:\
  \ \"/usr/sbin/a2dissite 000-d\\\n44 efault.conf\"\n45       when: disable_default\n\
  46       notify: reload Apache\n47 \n48     - name: open firewall\n49       community.general.ufw:\n\
  50         rule: allow\n51         port: \"{{ http_port }}\"\n52         proto:\
  \ tcp\n53 \n54   handlers:\n55     - name: reload Apache\n56       ansible.builtin.service:\n\
  57         name: apache2\n58         state: reloaded\n```\n\n* `apache.conf.j2`\n\
  \n```apache\n1 <VirtualHost *:{{ http_port }}>\n2   ServerAdmin webmaster@localhost\n\
