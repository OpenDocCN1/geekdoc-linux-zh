  \ Windows 共享。Ansible Playbook 代码将检查所需的软件包，创建挂载点并通过 SMB/CIFS 协议在目标机器上设置共享文件夹。\n\n\
  ### Ansible 挂载 SMB/CIFS 文件系统\n\n`ansible.posix.mount` 控制已激活和配置的挂载点。今天我们讨论 Ansible\
  \ `mount` 模块。全名为 `ansible.posix.mount`，这意味着它是 `ansible.posix` 集合的一部分，用于与 POSIX 平台交互。该模块的目的是控制已激活和配置的挂载点。对于\
  \ Windows，请使用 `community.windows.win_mapped_drive` 模块。\n\n### 参数\n\n- `path` (string)：挂载点（例如\
  \ `/mnt`）\n- `state` (string)：已挂载 (mounted) / 未挂载 (unmounted) / 存在 (present) / 重新挂载\
  \ (remounted)\n- `src` (string)：设备或网络卷\n- `fstype` (string)：ext4, xfs, iso9660,\
  \ nfs, cifs 等\n- `opts` (string)：挂载选项\n\n该模块有很多参数可以执行任何任务。必需参数是 `path` 和 `state`。`path`\
  \ 参数指定挂载点的路径（例如 `/mnt/`）。`state` 参数允许我们验证挂载点的特定状态。mounted、unmounted 和 `remounted`\
  \ 更改设备状态。`present` 和 `absent` 仅更改 `/etc/fstab` 文件。\n\n`src` 参数指定 NFS 或 SMB/CIFS\
  \ 的设备或网络卷。`fstype` 参数指定文件系统类型。例如：ext4, xfs, iso9660, nfs, cifs 等。`opts` 参数允许我们指定某些随文件系统类型不同的挂载选项。\n\
  \n### 示例\n\n让我们进入一个真实的 Ansible Playbook 来挂载 SMB/CIFS 文件系统。\n\n\n\n\n\n```\n 1 $\
  \ ssh devops@demo.example.com\n 2 [devops@demo ~]$ sudo su \n 3 [root@demo devops]#\
  \ mount \n 4 sysfs on /sys type sysfs (rw,nosuid,nodev,noexec,relatime\\\n 5 ,seclabel)\n\
  \ 6 proc on /proc type proc (rw,nosuid,nodev,noexec,relatime)\n 7 devtmpfs on /dev\
  \ type devtmpfs (rw,nosuid,seclabel,size=3\\\n 8 95492k,nr_inodes=98873,mode=755)\n\
  \ 9 securityfs on /sys/kernel/security type securityfs (rw,no\\\n10 suid,nodev,noexec,relatime)\n\
  11 tmpfs on /dev/shm type tmpfs (rw,nosuid,nodev,seclabel)\n12 devpts on /dev/pts\
  \ type devpts (rw,nosuid,noexec,relatime\\\n13 ,seclabel,gid=5,mode=620,ptmxmode=000)\n\
