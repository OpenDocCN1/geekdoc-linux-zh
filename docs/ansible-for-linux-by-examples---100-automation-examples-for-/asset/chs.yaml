  \ root@debian:/home/devops#\n```\n\n# Ansible 用于 Linux\n\n在本章中，你将发现最常用的 Ansible\
  \ ，用于自动化 Linux 系统管理员任务。\n\n## Ansible 术语 - `ansible_hostname` 与 `inventory_hostname`\
  \ 与 `ansible_fqdn`\n\n在 Ansible Playbook 的实际示例中，`ansible_hostname` 与 `inventory_hostname`\
  \ 以及 `ansible_fqdn` 之间的区别是什么？\n\n这两个 Ansible 内部变量有时会让人混淆，但它们在根本上是不同的。\n\n### `ansible_hostname`\
  \ vs `inventory_hostname` vs `ansible_fqdn`\n\n#### `ansible_hostname` 和 `ansible_fqdn`\n\
  \n从目标机器的事实（facts）中读取主机名：\n\n* `ansible_hostname` 从 `gather_facts` 期间收集的事实中读取主机名\n\
  * 等同于 `uname -n` 或 `hostname` 命令\n* 需要启用 `gather_facts`，否则 `ansible_facts` 变量将无法在\
  \ playbook 中使用\n* 等于目标主机的主机名\n* 由于这是基于 `gather_facts` 步骤的，`ansible_hostname` 在临时命令中不可用\n\
  \n#### `inventory_hostname`\n\n从 Ansible 清单或主机文件读取：\n\n* `inventory_hostname` 从清单配置或\
  \ hosts 文件中读取主机名。它可能与远程系统的主机名配置不同。它可能只是控制机上的一个名称\n* `inventory_hostname` 在你的 playbook\
  \ 中始终可用\n* 可能与目标主机的主机名不同\n* 适用于 playbook 和临时命令\n\n### 演示\n\n让我向你展示简单的 Ansible Playbook\
  \ 中，`ansible_hostname` 与 `inventory_hostname` 以及 `ansible_fqdn` 内部变量之间的区别。\n\n####\
  \ 代码\n\n* hostnames.yml\n\n```\n 1 ---\n 2 - name: hostnames demo\n 3   hosts: all\n\
  \ 4   gather_facts: true\n 5   tasks:\n 6     - name: print inventory_hostname\n\
  \ 7       ansible.builtin.debug:\n 8         var: inventory_hostname\n 9     - name:\
  \ print ansible_hostname\n10       ansible.builtin.debug:\n11         var: ansible_hostname\n\
  12     - name: print ansible_fqdn\n13       ansible.builtin.debug:\n14         var:\
  \ ansible_fqdn\n```\n\n* inventory\n\n```\n1 foo.example.com ansible_host=192.168.0.190\n\
  2 [all:vars]\n3 ansible_connection=ssh\n4 ansible_user=devops\n5 ansible_ssh_private_key_file=~/.ssh/id_rsa\n\
  ```\n\n#### 执行\n\n```\n 1 ansible-pilot $ ansible-playbook -i ansible\\ statements/i\\\
  \n 2 nventory ansible\\ statements/hostnames.yml\n 3 PLAY [hostnames demo] ***********************************\\\
  \n 4 ******************************************\n 5 TASK [Gathering Facts] **********************************\\\
  \n 6 ******************************************\n 7 ok: [foo.example.com]\n 8 TASK\
  \ [print inventory_hostname] *************************\\\n 9 ******************************************\n\
  10 ok: [foo.example.com] => {\n11     \"inventory_hostname\": \"foo.example.com\"\
  \n12 }\n13 TASK [print ansible_hostname] ***************************\\\n14 ******************************************\n\
  15 ok: [foo.example.com] => {\n16     \"ansible_hostname\": \"demo\"\n17 }\n18 TASK\
  \ [print ansible_fqdn] *******************************\\\n 19 ******************************************\n\
  20 ok: [foo.example.com] => {\n21     \"ansible_fqdn\": \"demo.example.com\"\n22\
  \ }\n23 PLAY RECAP **********************************************\\\n 24 ******************************************\n\
  25 foo.example.com            : ok=4    changed=0    unreach\\\n26 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n27 ansible-pilot $\n```\n\n#### 等等性\n\n\
  ```\n 1 ansible-pilot $ ansible-playbook -i ansible\\ statements/i\\\n 2 nventory\
  \ ansible\\ statements/hostnames.yml\n 3 PLAY [hostnames demo] ***********************************\\\
  \n 4 ******************************************\n 5 TASK [Gathering Facts] **********************************\\\
  \n 6 ******************************************\n 7 ok: [foo.example.com]\n 8 TASK\
  \ [print inventory_hostname] *************************\\\n 9 ******************************************\n\
  10 ok: [foo.example.com] => {\n11     \"inventory_hostname\": \"foo.example.com\"\
  \n12 }\n13 TASK [print ansible_hostname] ***************************\\\n14 ******************************************\n\
  15 ok: [foo.example.com] => {\n16     \"ansible_hostname\": \"demo\"\n17 }\n18 TASK\
  \ [print ansible_fqdn] *******************************\\\n 19 ******************************************\n\
  20 ok: [foo.example.com] => {\n21     \"ansible_fqdn\": \"demo.example.com\"\n22\
  \ }\n23 PLAY RECAP **********************************************\\\n 24 ******************************************\n\
  25 foo.example.com            : ok=4    changed=0    unreach\\\n26 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n27 ansible-pilot $\n```\n\n### 总结\n\n\
  现在你对 Ansible 内部变量 `ansible_hostname`、`inventory_hostname` 以及 `ansible_fqdn` 有了更多了解。你知道如何根据你的\
  \ playbook 或模板的需求使用它们。\n\n## 三种安全限制 playbook 执行到单台机器的方法\n\n将潜在有害的 Ansible playbook\
  \ 执行到单个主机的三种方法。\n\n### 将 playbook 限制到单个主机\n\n* 在运行时使用 `--limit`\n* `hosts: HOSTNAME`\
  \ Ansible playbook\n* `hosts: \"{{ HOSTS }}\"` Ansible playbook\n\n让我们深入研究将 playbook\
  \ 限制到单个主机的用例。我将展示实现此结果的三种方法：在运行时使用 `--limit` 参数、在 playbook 代码中限制主机名，以及更高级的方法是在 playbook\
  \ 中定义一个按需填充的变量。\n\n让我们讨论每种方案的优缺点。\n\n### 演示\n\n在以下演示场景中，我想针对 demo.example.com 主机执行我有害的\
  \ Ansible playbook。\n\n这是我的演示清单文件：\n\n```\n1 [linux]\n2 demo.example.com\n3 demo2.example.com\n\
  4 \n5 [all:vars]\n6 ansible_connection=ssh\n7 ansible_user=devops\n8 ansible_ssh_private_key_file=~/.ssh/id_rsa\n\
  ```\n\n### Ansible 命令限制选项\n\n* `ansible-playbook - limit HOSTNAME PLAYBOOK`\n\n\
  使用 `ansible-playbook` 命令的 `--limit` 参数是限制代码执行到单个主机的最简单的方法。\n\n\n\n\n优点是，在仅针对单个主机执行之前，你不需要修改\
  \ Ansible Playbook 代码。\n\n缺点是，你必须每次执行命令时都记住这一点，而人类有时并不那么可靠。\n\n#### code\n\n*  \
  \ `playbook.yml`\n\n```\n1 ---\n2 - name: harmful playbook\n3   hosts: all\n4  \
  \ tasks:\n5     - name: harmful task\n6       ansible.builtin.debug:\n7        \
  \ msg: \"harmful task\"\n```\n\n### execution\n\n```\n 1 ansible-pilot $ ansible-playbook\
  \ --limit demo.example.com\\\n 2  -i limit/inventory limit/playbook.yml\n 3 PLAY\
  \ [harmful playbook] *********************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [harmful task] *************************************\\\
  \n 9 ******************************************\n10 ok: [demo.example.com] => {\n\
  11     \"msg\": \"harmful task\"\n12 }\n13 PLAY RECAP **********************************************\\\
  \n14 ******************************************\n15 demo.example.com           :\
  \ ok=2    changed=0    unreach\\\n16 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n17 ansible-pilot $\n```\n\n## wrong execution\n\n如果我们忘记了 `--limit`\
  \ 选项，结果可能会非常有害。\n\n```\n 1 ansible-pilot $ ansible-playbook -i limit/inventory limit\\\
  \n 2 /playbook.yml\n 3 PLAY [harmful playbook] *********************************\\\
  \n 4 ******************************************\n 5 TASK [Gathering Facts] **********************************\\\
  \n 6 ******************************************\n 7 ok: [demo.example.com]\n 8 ok:\
  \ [demo2.example.com]\n 9 TASK [harmful task] *************************************\\\
  \n10 ******************************************\n11 ok: [demo.example.com] => {\n\
  12     \"msg\": \"harmful task\"\n13 }\n14 ok: [demo2.example.com] => {\n15    \
  \ \"msg\": \"harmful task\"\n16 }\n17 PLAY RECAP **********************************************\\\
  \n18 ******************************************\n19 demo.example.com           :\
  \ ok=2    changed=0    unreach\\\n20 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\\\n21    \n22 demo2.example.com          : ok=2    changed=0    unreach\\\
  \n23 able=0    failed=0    skipped=0    rescued=0    ignored=0\n24 ansible-pilot\
  \ $\n```\n\n## Ansible Playbook hosts\n\n*   `hosts: HOSTNAME`\n*   `ansible-playbook\
  \ PLAYBOOK`\n\n在 Ansible Playbook 中使用 `hosts` 语句允许你为执行指定一个主机或主机组。\n\n优点是，比起从命令行使用\
  \ `--limit` 参数手动指定主机名，这种方式更可靠。\n\n缺点是，你每次都需要记得修改 Ansible Playbook 代码。如果你忘记这样做，你将在指定的主机上执行代码，这仍然是一个潜在的人为问题。\n\
  \n#### code\n\n*   `playbook2.yml`\n\n```\n1 ---\n2 - name: harmful playbook\n3\
  \   hosts: demo.example.com\n4   tasks:\n5     - name: harmful task\n6       ansible.builtin.debug:\n\
  7         msg: \"harmful task\"\n```\n\n### execution\n\n```\n 1 ansible-pilot $\
  \ ansible-playbook -i limit/inventory limit\\\n 2 /playbook2.yml\n 3 PLAY [harmful\
  \ playbook] *********************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [harmful task] *************************************\\\
  \n 9 ******************************************\n10 ok: [demo.example.com] => {\n\
  11     \"msg\": \"harmful task\"\n12 }\n13 PLAY RECAP **********************************************\\\
  \n14 ******************************************\n15 demo.example.com           :\
  \ ok=2    changed=0    unreach\\\n16 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n17 ansible-pilot $\n```\n\n## Ansible Playbook hosts advanced\n\n\
  *   `hosts: \"{{ HOSTS }}\"`\n*   `ansible-playbook -e \"HOSTS=demo.example.com\"\
  \ PLAYBOOK`\n\n在 Ansible Playbook 中使用 `hosts` 语句允许你指定一个变量，你可以通过该变量来填充用于执行的主机或主机组。\n\
  \n基本上，如果你在命令行上盲目地执行 Ansible Playbook 代码，它是什么都没做什么的。唯一的处理方法是通过命令行通过额外变量来填充主机变量。\n\
  \n优点是，比起从命令行使用 `--limit` 参数手动指定主机名，这种方式更可靠。\n\n这个选项结合了之前选项的优点也是我最喜欢的。\n\n#### code\n\
  \n*   `playbook3.yml`\n\n```\n1 ---\n2 - name: harmful playbook\n3   hosts: \"{{\
  \ HOSTS }}\"\n4   tasks:\n5     - name: harmful task\n6       ansible.builtin.debug:\n\
  7         msg: \"harmful task\"\n```\n\n### execution\n\n```\n 1 ansible-pilot $\
  \ ansible-playbook -i limit/inventory limit\\\n 2 /playbook3.yml -e HOSTS=demo.example.com\n\
  \ 3 PLAY [harmful playbook] *********************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [harmful task] *************************************\\\
  \n 9 ******************************************\n10 ok: [demo.example.com] => {\n\
  11     \"msg\": \"harmful task\"\n12 }\n13 PLAY RECAP **********************************************\\\
  \n14 ******************************************\n15 demo.example.com           :\
  \ ok=2    changed=0    unreach\\\n16 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n17 ansible-pilot $\n```\n\n## wrong execution\n\n```\n 1 ansible-pilot\
  \ $ ansible-playbook -i limit/inventory\\\n 2 /playbook3.yml\n 3 [WARNING]: Could\
  \ not match supplied host pattern, ignorin\\\n 4 g: HOSTS\n 5 PLAY [harmful playbook]\
  \ *********************************\\\n 6 ******************************************\n\
  \ 7 skipping: no hosts\n 8 PLAY RECAP **********************************************\\\
  \n 9 ******************************************\n10 ansible-pilot $\n```\n\n###\
  \ Links\n\n*   [Patterns: targeting hosts and groups](https://docs.ansible.com/latest/user_guide/intro_patterns.html)\n\
  \n## Ansible modules - command vs shell\n\n当确实需要在 Linux 上执行命令时，对 `command` 和 `shell`\
  \ 模块进行对比。\n\n这两个模块经常混淆，但它们有本质区别。\n\n### command vs shell\n\ncommand\n\n*   针对目标\
  \ Unix 类主机执行命令\n*   它绕过了 shell\n*   始终将状态设置为 true\n\nshell\n\n*   针对目标 Unix 类主机执行\
  \ shell 命令\n*   重定向和 shell 内功能\n*   始终将状态设置为 true\n\n`command` 和 `shell` Ansible\
  \ 模块在目标节点上执行命令。\n\n通常情况下，使用专门的 Ansible 模块执行任务总是更好的。然而，有时唯一的方法是通过通过 `command` 或 `shell`\
  \ 模块执行 Linux `command`。\n\n让我再次强调，尽可能避免使用 command/shell 而替用更好的模块。\n\n这两个模块均在目标节点上执行命令，但执行方式有显著不同。\n\
  \n\n\n`command` 模块是 Ansible 即时（Ad-hoc）模式下的默认模块。`command` 模块能够执行远程主机上的二进制文件。`command`\
  \ 模块不受本地 shell 变量的影响，因为它绕过了 shell。同时，它可能无法运行“shell”内置功能和重定向。\n\n## shell 模块\n\n\
  * 在目标上执行 shell 命令\n\n`shell` Ansible 模块可能比 `command` 模块更具危险性，只有在你确实需要 shell 功能时才应该使用它。因此，如果你不需要将两个命令连接在一起（使用管道甚至仅使用\
  \ `&&` 或 `;`），你就不真的需要 `shell` 模块。同样，扩展 shell 变量或文件通配符需要 `shell` 模块。如果你不使用这些功能，请不要使用\
  \ `shell` 模块。我知道，有时这是唯一的办法。\n\n### 链接\n\n* [ansible.builtin.shell](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/shell_module.html)\n\
  * [ansible.builtin.command](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/command_module.html)\n\
  \n### demo\n\nAnsible Playbook 中的 command 与 shell Ansible 模块对比。\n\n让我向你展示 Ansible\
  \ Playbook 中 command 与 shell Ansible 模块之间的区别。\n\n### command 代码\n\n```\n 1 ---\n\
  \ 2 - name: command module demo\n 3   hosts: all\n 4   tasks:\n 5     - name: check\
  \ uptime\n 6       ansible.builtin.command: uptime\n 7       register: command_output\n\
  \ 8     - name: command output\n 9       ansible.builtin.debug:\n10         var:\
  \ command_output.stdout_lines\n11 command execution\n12 ansible-pilot $ ansible-playbook\
  \ -i virtualmachines/demo/\\\n13 inventory commmand_shell/uptime.yml\n14 PLAY [command\
  \ module demo] ******************************\\\n15 ******************************************\n\
  16 TASK [Gathering Facts] **********************************\\\n17 ******************************************\n\
  18 ok: [demo.example.com]\n19 TASK [check uptime] *************************************\\\
  \n20 ******************************************\n21 changed: [demo.example.com]\n\
  22 TASK [command output] ***********************************\\\n23 ******************************************\n\
  24 ok: [demo.example.com] => {\n25     \"command_output.stdout_lines\": [\n26  \
  \       \" 12:51:34 up 8 min,  1 user,  load average: 0.00\\\n27 , 0.05, 0.06\"\n\
  28     ]\n29 }\n30 PLAY RECAP **********************************************\\\n\
  31 ******************************************\n32 demo.example.com           : ok=3\
  \    changed=1    unreach\\\n33 able=0    failed=0    skipped=0    rescued=0   \
  \ ignored=0\n34 ansible-pilot $\n35 shell code\n36 ---\n37 - name: shell module\
  \ demo\n38   hosts: all\n39   tasks:\n40     - name: list file(s) and folder(s)\n\
  41       ansible.builtin.shell: 'ls -l *'\n42       register: command_output\n43\
  \     - name: command output\n44       ansible.builtin.debug:\n45         var: command_output.stdout_lines\n\
  ```\n\n### shell 执行\n\n```\n 1 ansible-pilot $ ansible-playbook -i virtualmachines/demo/\\\
  \n 2 inventory commmand_shell/list_files.yml\n 3 PLAY [shell module demo] ********************************\\\
  \n 4 ******************************************\n 5 TASK [Gathering Facts] **********************************\\\
  \n 6 ******************************************\n 7 ok: [demo.example.com]\n 8 TASK\
  \ [list file(s) and folder(s)] ***********************\\\n 9 ******************************************\n\
  10 changed: [demo.example.com]\n11 TASK [command output] ***********************************\\\
  \n12 ******************************************\n13 ok: [demo.example.com] => {\n\
  14     \"command_output.stdout_lines\": [\n15         \"-rwxr-xr-x. 1 devops wheel\
  \ 31 Mar 30 13:39 examp\\\n16 le.sh\"\n17     ]\n18 }\n19 PLAY RECAP **********************************************\\\
  \n20 ******************************************\n21 demo.example.com           :\
  \ ok=3    changed=1    unreach\\\n22 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n23 ansible-pilot $\n```\n\n### 错误的模块代码\n\n```\n 1 ---\n 2 - name:\
  \ shell module demo\n 3   hosts: all\n 4   tasks:\n 5     - name: list file(s) and\
  \ folder(s)\n 6       ansible.builtin.command: 'ls -l *'\n 7       register: command_output\n\
  \ 8    - name: command output\n 9       ansible.builtin.debug:\n10         var:\
  \ command_output.stdout_lines\n```\n\n### 错误的模块执行\n\n```\n 1 ansible-pilot $ ansible-playbook\
  \ -i virtualmachines/demo/\\\n 2 inventory commmand_shell/list_files_command.yaml\n\
  \ 3 PLAY [shell module demo] ********************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [list file(s) and folder(s)] ***********************\\\
  \n 9 ******************************************\n10 changed: [demo.example.com]\n\
  11 TASK [command output] ***********************************\\\n12 ******************************************\n\
  13 ok: [demo.example.com] => {\n14     \"command_output.stdout_lines\": [\n15  \
  \       \"-rwxr-xr-x. 1 devops wheel 31 Mar 30 13:39 examp\\\n16 le.sh\"\n17   \
  \  ]\n18 }\n19 PLAY RECAP **********************************************\\\n20 ******************************************\n\
  21 demo.example.com           : ok=3    changed=1    unreach\n```\n\n\n\n\n```\n\
  \ 1 ---\n 2 - name: debug module demo\n 3   hosts: all\n 4   vars:\n 5     fruit:\
  \ \"apple\"\n 6   tasks:\n 7     - name: debug message\n 8       ansible.builtin.debug:\n\
  \ 9         msg: \"our fruit is {{ fruit }}\"\n10         verbosity: 2\n```\n\n\
  ## 编辑单行文本 - Ansible module lineinfile\n\n让我们聊聊 Ansible 模块 `lineinfile`。\n\n全称为 `ansible.builtin.lineinfile`，这意味着它是\
  \ `builtin` 模块集合的一部分，并随 ansible 一起发布。\n\n这是一个非常稳定的模块，已经发布多年，并支持多种操作系统。\n\n你可以在文件中插入、更新和删除单行文本。\n\
  \n### 参数\n\n- `path` 字符串 - 文件路径\n- `line` 字符串 - 文本\n- `insertafter/insertbefore`\
  \ 字符串 - 末尾(EOF)/正则表达式\n- `validate` 字符串 - 验证命令\n- `create` 布尔值 - 如果不存在则创建\n- `state`\
  \ 字符串 - 存在(present)/不存在(absent)\n- `owner/group/mode` - 权限\n- `setype/seuser/selevel`\
  \ - SELinux\n\n唯一要求的参数是 `path`，你可以在这里指定要编辑的文件系统路径。`line` 是我们想要插入文件中的文本行，简单！\n\n\
  默认情况下，文本将插入到文件末尾，但我们可以通过 `insertafter` 或 `insertbefore` 在特定位置进行个性化设置。\n\n如果有可以验证文件的工具，我们可以在\
  \ `validate` 参数中指定它，这对于配置文件非常有用。\n\n如果文件不存在，我们还可以 `create` 创建它！\n\n通常情况下，我们想要插入一行文本，但也可以结合\
  \ `state` 参数的 `absent` 来删除。\n\n让我同时也强调一下，我们还可以指定某些权限或 SELinux 属性。\n\n### 演示\n\n\
  如何使用 `lineinfile` 模块和 Ansible Playbook 更改 Linux 中 `/etc/ssh/sshd_config` OpenSSH\
  \ 配置文件的单行参数。\n\n`lineinfile.yml`\n\n```\n 1 ---\n 2 - name: lineinfile module demo\n\
  \ 3   hosts: all\n 4   become: true\n 5   tasks:\n 6     - name: allow password\
  \ authentication\n 7       ansible.builtin.lineinfile:\n 8         state: present\n\
  \ 9         dest: /etc/ssh/sshd_config\n10         regexp: \"^PasswordAuthentication\"\
  \n11         line: \"PasswordAuthentication yes\"\n12         validate: 'sshd -t\
  \ -f %s'\n```\n\n## 编辑多行文本 - Ansible module blockinfile\n\n让我们聊聊 Ansible 模块 `blockinfile`。\n\
  \n全称为 `ansible.builtin.blockinfile`，这意味着它是 `builtin` 模块集合的一部分，并随 ansible 一起发布。\n\
  \n这是一个非常稳定的模块，已经发布多年，并支持多种操作系统。\n\n你可以在文件中插入、更新和删除一个块的多行文本。此块将由自定义的标记行包围，以便识别该编辑是由\
  \ Ansible 执行的。\n\n另请 Ansible 排除 - 缩进错误。\n\n### 主要参数\n\n- `path` 字符串\n- `block` 字符串\n\
  - `insertafter/insertbefore` 字符串\n- `validate` 字符串\n- `create` 布尔值\n- `state` 字符串\n\
  - `marker_begin/marker_end` 字符串\n- `mode/owner/group`\n- `setype/seuser/selevel`\n\
  \n唯一要求的参数是 `path`，你可以在这里指定要编辑的文件系统路径。\n\n`block` 参数是我们想要插入文件中的文本，简单！\n\n默认情况下，文本将插入到文件末尾，但我们可以通过\
  \ `insertafter` / `insertbefore` 参数在特定位置进行个性化设置。\n\n如果有可以验证文件的工具，我们可以在 `validate`\
  \ 参数中指定，这对于配置文件非常有用。\n\n如果文件不存在，我们可以创建它！\n\n通常情况下，我们想要插入一个文本块，但也可以结合 `state` 参数的\
  \ `absent` 来删除。\n\n我们的将被某些标记和注释包围，显示我们使用 Ansible 完成了这次编辑。我们也可以自定义文本。\n\n让我同时也强调一下，我们还可以指定某些权限或\
  \ SELinux 属性。\n\n### 演示\n\n如何使用 Ansible Playbook 在 Linux 中创建一个多行文本文件。\n\n```\n 1\
  \ ---\n 2 - name: blockinfile module demo\n 3   hosts: all\n 4   become: true\n\
  \ 5   tasks:\n 6 - name: Generate /etc/hosts file\n 7     ansible.builtin.blockinfile:\n\
  \ 8       state: present\n 9       dest: /etc/hosts\n10       content: |\n11   \
  \      192.168.0.200 demo demo.example.com\n```\n\n## 暂停执行 - Ansible module pause\n\
  \n让我们聊聊 Ansible 模块 `pause`。\n\n该模块也支持 Windows 目标。\n\n全称为 `ansible.builtin.pause`，这意味着它是\
  \ `builtin` 模块集合的一部分，并随 Ansible 一起发布。\n\n默认行为是带有提示的暂停。\n\n它会暂停 Ansible playbook\
  \ 的执行一段时间，或者直到提示被确认。\n\n### 参数\n\n- `minutes` 字符串 - 正数分钟\n- `seconds` 字符串 - 正数秒\n\
  - `prompt` 字符串 - “文本消息”\n- `echo` 布尔值 - 是/否\n\n默认行为是带有提示的暂停。\n\n你可以使用 `minutes`\
  \ 和 `seconds` 指定时间。从 2 版本开始，如果你指定 0 或负数分钟，它将无限等待。\n\n### 演示\n\n如何暂停 Ansible Playbook\
  \ 的执行。\n\n#### 代码\n\n`pause.yml`\n\n```\n 1 ---\n 2 - name: pause module demo\n\
  \ 3   hosts: all\n 4   vars:\n 5     wait_seconds: 10\n 6   tasks:\n 7     - name:\
  \ pause for {{ wait_seconds | int }} (s)\n 8       ansible.builtin.pause:\n 9  \
  \       seconds: \"{{ wait_seconds | int }}\"\n```\n\n#### 输出\n\n```\n 1 $ ansible-playbook\
  \ -i demo/inventory pause.yml\n 2 PLAY [pause module demo] ********************************\n\
  \ 3 ******************************************\n 4 TASK [Gathering Facts] ******************\\\
  \n 5 ******************************************\n 6 ok: [demo.example.com]\n 7 TASK\
  \ [pause for 10 (s)] ***************************\n 8 ******************************************\n\
  \ 9 Pausing for 10 seconds\n10 (ctrl+C then 'C' = continue early, ctrl+C then 'A'\
  \ = abor\\\n11 t) Press 'C' to continue the play or 'A' to abort \n12 ok: [demo.example.com]\n\
  \ 13 TASK [message] *****************************************\n 14 ******************************************\n\
  \ 15 ok: [demo.example.com] => {\n16     \"msg\": \"The end\"\n17 }\n 18 PLAY RECAP\
  \ **********************************************\n 19 ******************************************\n\
  20 demo.example.com           : ok=3    changed=0    unreach\\\n21 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n```\n\n\n\n\n\n```\n 1 $ ansible-playbook\
  \ -i demo/inventory pause/pause.yml\n 2 PLAY [pause module demo] ********************************\\\
  \n 3 **********************************************************\n 4 TASK [Gathering\
  \ Facts] **********************************\\\n 5 **********************************************************\n\
  \ 6 ok: [demo.example.com]\n 7 TASK [pause for 10 second(s)] ***************************\\\
  \n 8 **********************************************************\n 9 Pausing for\
  \ 10 seconds\n10 (ctrl+C then 'C' = continue early, ctrl+C then 'A' = abor\\\n11\
  \ t)\n12 Press 'C' to continue the play or 'A' to abort \n13 fatal: [demo.example.com]:\
  \ FAILED! => {\"msg\": \"user reque\\\n14 sted abort!\"}\n15 NO MORE HOSTS LEFT\
  \ **************************************\\\n16 **********************************************************\n\
  17 PLAY RECAP **********************************************\\\n18 **********************************************************\n\
  19 demo.example.com           : ok=1    changed=0    unreach\\\n20 able=0    failed=1\
  \    skipped=0    rescued=0    ignored=0\n```\n\n# 在 Ansible 主机上执行命令 - Ansible localhost\n\
  \n介绍如何使用连接插件 `local` 和正确的 Ansible 内部变量，在 localhost 上执行 Ansible 命令或任务。\n\n当 Ansible\
  \ 成为你日常工作流的一部分时，你自然希望也能自动化本地机器上的任务。\n\n## 在 Ansible 主机上执行命令的选项\n\n* `connection\
  \ plugin`（连接插件）\n* `delegate_to: localhost`\n* `local_action`\n\n在 Ansible 控制器主机上执行模块和命令有方法。\n\
  \n第一种也是我最喜欢的方法，是使用连接插件 `local` 并将其应用于 Playbook 的 Play 级别。棘手之处在于需要调整关于 Python 解释器的某些\
  \ ansible 变量。我认为这是目前最好的方法。\n\n第二种方法是在任务级别（Task level）使用 `delegate_to`。它的优点是仅只将一个任务委托给\
  \ localhost，但仍然只需要隐式的 localhost 方案。\n\n第三种方法是使用 `local_action` 语句。我个人并不喜欢它，但它是任务层面的另一种替代方案，与前一种相同。\n\
  \n### 链接\n\n* [控制任务运行位置：委托与本地操作](https://docs.ansible.com/ansible/latest/user_guide/playbooks_delegation.html)\n\
  * [隐式 ‘localhost’](https://docs.ansible.com/ansible/latest/inventory/implicit_localhost.html)\n\
  \n### 演示\n\n如何使用连接方法：`local` 在 Ansible 主机上执行命令。\n\n#### 代码\n\n```\n 1 ---\n 2 -\
  \ name: localhost demo\n 3   hosts: localhost\n 4   vars:\n 5     ansible_connection:\
  \ local\n 6     ansible_python_interpreter: \"{{ ansible_playbook_pyth\\\n 7 on\
  \ }}\"\n 8   tasks:\n 9     - name: print hostname\n10       ansible.builtin.debug:\n\
  11         msg: \"{{ inventory_hostname }}\"\n```\n\n#### 执行\n\n```\n 1 ansible-pilot\
  \ $ ansible-playbook ansible\\ statements/loca\\\n 2 lhost.yml\n 3 [WARNING]: No\
  \ inventory was parsed, only implicit localho\\\n 4 st is available\n 5 [WARNING]:\
  \ provided hosts list is empty, only localhost i\\\n 6 s available. Note that the\
  \ implicit\n 7 localhost does not match 'all'\n 8 PLAY [localhost demo] ***********************************\\\
  \n 9 **********************************************************\n10 TASK [Gathering\
  \ Facts] **********************************\\\n11 **********************************************************\n\
  12 ok: [localhost]\n13 TASK [print hostname] ***********************************\\\
  \n14 **********************************************************\n15 ok: [localhost]\
  \ => {\n16     \"msg\": \"localhost\"\n17 }\n18 PLAY RECAP **********************************************\\\
  \n19 **********************************************************\n20 localhost  \
  \                : ok=2    changed=0    unreach\\\n21 able=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\n22 ansible-pilot $\n```\n\n#### 等幂性\n\n```\n 1 ansible-pilot\
  \ $ ansible-playbook ansible\\ statements/loca\\\n 2 lhost.yml\n 3 [WARNING]: No\
  \ inventory was parsed, only implicit localho\\\n 4 st is available\n 5 [WARNING]:\
  \ provided hosts list is empty, only localhost i\\\n 6 s available. Note that the\
  \ implicit\n 7 localhost does not match 'all'\n 8 PLAY [localhost demo] ***********************************\\\
  \n 9 **********************************************************\n10 TASK [Gathering\
  \ Facts] **********************************\\\n11 **********************************************************\n\
  12 ok: [localhost]\n13 TASK [print hostname] ***********************************\\\
  \n14 **********************************************************\n15 ok: [localhost]\
  \ => {\n16     \"msg\": \"localhost\"\n17 }\n18 PLAY RECAP **********************************************\\\
  \n19 **********************************************************\n20 localhost  \
  \                : ok=2    changed=0    unreach\\\n21 able=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\n22 ansible-pilot $\n```\n\n# 将文件读取到主机的变量中 - Ansible\
  \ lookup 插件文件\n\n介绍如何自动化在 Ansible 主机上读取 `example.txt` 文件，将其赋值给变量并在 Ansible Playbook\
  \ 代码中使用。\n\n## Ansible 将文件读取到变量\n\n* `ansible.builtin.file`\n* 读取内容\n\n深入了解 Ansible\
  \ lookup 插件。插件是扩展 Ansible 功能的方式。通过 lookup 插件，你可以从外部源加载变量或模板。全名为 `ansible.builtin.file`，意味着它是“builtin”模块集合的一部分，并随\
  \ ansible 一起发布。`file` lookup 插件的作用是读取文件内容。必填参数是 `terms`，即路径。正常用法是将 lookup 插件赋值给可以在\
  \ playbook 中使用的变量。\n\n### 演示\n\n通过 Ansible Playbook 将文件读取到主机变量。\n\n#### 代码\n\n```\n\
  1 ---\n2 - name: read file on host\n3   hosts: all\n4   vars:\n5    contents: \"\
  {{ lookup('file','example.txt') }}\"\n6   tasks:\n7    - name: print file\n8   \
  \   ansible.builtin.debug:\n9       msg: \"the content of file is {{ contents }}\"\
  \n```\n\n#### 执行\n\n```\n1 PLAY [read file] ********************************\\\n\
  2 **********************************************************\n3 TASK [Gathering\
  \ Facts] **********************************\\\n4 **********************************************************\n\
  5 ok: [demo.example.com]\n6 TASK [print file] ***********************************\\\
  \n7 **********************************************************\n8 ok: [demo.example.com]\
  \ => {\n9     \"msg\": \"the content of file is example contents\"\n10 }\n11 PLAY\
  \ RECAP **********************************************\\\n12 **********************************************************\n\
  13 demo.example.com           : ok=2    changed=0    unreach\\\n14 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n```\n\n#### 等幂性\n\n```\n1 PLAY [read file]\
  \ ********************************\\\n2 **********************************************************\n\
  3 TASK [Gathering Facts] **********************************\\\n4 **********************************************************\n\
  5 ok: [demo.example.com]\n6 TASK [print file] ***********************************\\\
  \n7 **********************************************************\n8 ok: [demo.example.com]\
  \ => {\n9     \"msg\": \"the content of file is example contents\"\n10 }\n11 PLAY\
  \ RECAP **********************************************\\\n12 **********************************************************\n\
  13 demo.example.com           : ok=2    changed=0    unreach\\\n14 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n```\n\n# 重启远程主机 - Ansible 模块 reboot\n\n\
  让我们聊聊 Ansible `reboot` 模块。\n\n全名为 `ansible.builtin.reboot`，意味着它是“builtin”模块集合的一部分，并随\
  \ `ansible-core` 一起发布。\n\n\n\n\n\n此模块非常稳定，已发布多年，并支持多种操作系统。\n\n其目的是重启远程机器，等待其关机、重新启动并响应命令。\n\
  \n对于 Windows 目标机器，请使用 `ansible.windows.win_reboot` 模块。\n\n### 参数\n\n* `reboot_timeout`\
  \ 整数 - 600\n* `msg` 字符串 - “由 Ansible 发起的重启”\n* `reboot_command` 字符串 - “[特定于操作系统]”\
  \ \n* `pre_reboot_delay` 整数 - 0\n* `post_reboot_delay` 整数 - 0\n* `test_command`\
  \ 字符串 - “whoami”\n* `boot_time_command` 字符串 - “cat /proc/sys/kernel/random/boot_id”\n\
  \n该模块没有必性参数，但某些参数可能有所帮助。\n\n让我总结一下最实用的参数。\n\n`reboot_timeout` 定义了在机器恢复运行状态之前预期等待多长时间。由于重启过程和测试命令执行的影响，实际的超时时间是双倍。\n\
  \n重启过程的第一步是向所有登录用户打印消息。你可以保留默认的“由 Ansible 发起的重启”，或使用 `msg` 参数进行自定义。\n\n其次是执行特定操作系统的重启命令。如果你需要特定的命令，请自定义\
  \ `reboot_command` 参数。\n\n你还可以使用 `pre_reboot_delay` 或 `post_reboot_delay` 整数定义一些额外的延迟时间。两者的默认值均为\
  \ 0。\n\n一旦重启完成，Ansible 将使用测试命令完全验证工作站是否正常工作。默认命令是 `whoami`，但你可以使用 `test_command`\
  \ 参数进行自定义。\n\n该模块还可以返回通过内核读取引导过程过程的实际耗时，具体为 `/proc/sys/kernel/random/boot_id`。\n\
  \n### 示例\n\n让我们来看一个真实的 Playbook，介绍如何使用 Ansible Playbook 重启远程主机。\n\n* `reboot.yml`\n\
  \n```\n 1 ---\n 2 - name: reboot module demo\n 3   hosts: all\n 4   become: true\n\
  \ 5   tasks:\n 6     - name: reboot host(s)\n 7       ansible.builtin.reboot:\n\
  \ 8         msg: \"reboot by Ansible\"\n 9         pre_reboot_delay: 5\n110    \
  \     post_reboot_delay: 10\n 11         test_command: \"whoami\"\n```\n\n## 通过\
  \ HTTPS 检出 git 仓库 - Ansible git module\n\n让我们来讨论 Ansible 模块 `git`。\n\n它的全名为 `ansible.builtin.git`，这意味着它是\
  \ Ansible 自带的“builtin”模块集合的一部分，并随 Ansible 一起发布。\n\n该模块非常稳定，已发布多年。\n\n其目的是在受管理的主机上从\
  \ git 检出（checkouts）部署软件（或文件）。\n\n如果你想通过 SSH 获取，请参考：通过 SSH 检出 git 仓库 - Ansible git\
  \ module\n\n### 参数与返回值\n\n参数列表非常广泛，但我将总结一下最实用的。\n\n* `repo` 路径\n* `dest` 字符串\n*\
  \ `update` 布尔值\n\n唯一的必性参数是 `repo` 和 `dest`。\n\n`repo` 指定源仓库 URL。\n\n`dest` 指定目标路径。\n\
  \n`update` 从已同步的源仓库获取新版本。\n\n* `after` 字符串\n\n最感兴趣的返回值是 `after`，它包含了更新过程后的最后提交。\n\
  \n### 示例\n\n让我们来看一个真实的 Playbook，使用 Ansible 检出 git 仓库。\n\n```\n 1 ---\n 2 - name:\
  \ git module demo\n 3   hosts: all\n 4   become: true\n 5   tasks:\n 6     - name:\
  \ ensure git pkg installed\n 7       ansible.builtin.yum:\n 8         name: git\n\
  \ 9         state: present\n10 \n11     - name: checkout git repo\n12       ansible.builtin.git:\n\
  13         repo: https://github.com/lucab85/ansible-pilot.git\n14         dest:\
  \ /home/devops/ansible-pilot\n```\n\n## 通过 SSH 检出 git 仓库 - Ansible git module\n\n\
  让我们来讨论 Ansible 模块 `git`。 \n\n它的全名为 `ansible.builtin.git`，这意味着它是 Ansible 自带的“builtin”模块集合的一部分，并随\
  \ Ansible 一起发布。\n\n该模块非常稳定，已发布多年。\n\n其目的是在受管理的主机上从 git 检出（checkouts）部署软件（或文件）。\n\
  \n如果你想通过 SSH 获取，请参考：通过 HTTPS 检出 git 仓库 - Ansible git module\n\n### 参数与返回值\n\n参数列表非常广泛，但我将总结一下最实用的。\n\
  \n* `repo` 路径\n* `dest` 字符串\n* `update` 布尔值\n* `key_file` 路径 - SSH 私钥\n\n参数列表非常广泛，但我将总结一下最实用的。\n\
  \n唯一的必性参数是 `repo` 和 `dest`。\n\n`repo` 指定源仓库 URL。\n\n`dest` 指定目标路径。\n\n`update` 从已同步的源仓库获取新版本。\n\
  \n`key_file` 是 SSH 私钥。\n\n请注意 `key_file` 是目标主机上的路径。\n\n请注意，它需要 SSH 私钥。\n\n* `after`\n\
  \n最感兴趣的返回值是 `after`，它包含了更新过程后的最后提交。\n\n### 示例\n\n让我们来看一个真实的 Playbook，使用 Ansible\
  \ 检出 git 仓库。\n\n* `git.yml`\n\n```\n 1 ---\n 2 - name: reboot module demo\n 3  \
  \ hosts: all\n 4   become: true\n 5   tasks:\n 6     - name: reboot host(s)\n 7\
  \       ansible.builtin.reboot:\n 8         msg: \"reboot by Ansible\"\n 9     \
  \    pre_reboot_delay: 5\n110         post_reboot_delay: 10\n 11         test_command:\
  \ \"whoami\"\n```\n\n## 文件到远程主机 - 本地到远程 - Ansible copy module\n\n让我们讨论 Ansible 模块\
  \ `copy`。\n\n全名为 `ansible.builtin.copy`，这意味着它是 Ansible 自带的“builtin”模块集合的一部分，并随 Ansible\
  \ 一起发布。\n\n该模块非常稳定，已发布多年。\n\n其目的是将文件复制到远程位置。\n\n请注意，相反的操作是由 Ansible fetch module\
  \ 完成的。\n\n### 参数\n\n* `dest` 路径 - 远程路径\n* `src` 字符串 - 本地路径\n* `backup` 布尔值 - 否是\n\
  * `validate` 字符串 - 验证命令\n* `checksum` 字符串 2.5+\n* `mode/owner/group`\n* `setype/seuser/selevel`\n\
  \n唯一的必性参数是 `dest`，它指定远程路径。\n\n`src` 指定控制端上的源文件。可以是相对路径或绝对路径。我绝对使用。\n\n`backup` 布尔值允许在覆盖任何文件时创建一个备份。\n\
  \n如果有任何工具可以验证文件，我们可以在 `validate` 参数中指定它，这对配置文件非常有用。\n\n我还要强调，我们可以指定权限和 SELinux 属性。\n\
  \n### 示例\n\n使用 Ansible 的 `copy` 模块在 Linux 上将文件复制到远程主机。\n\n#### 代码\n\n* `copy.yml`\n\
  \n```\n 1 ---\n 2 - name: copy module demo\n 3   hosts: all\n 4   become: false\n\
  \ 5   tasks:\n 6     - name: copy report.txt\n 7       ansible.builtin.copy:\n 8\
  \         src: report.txt\n 9         dest: /home/devops/report.txt\n10        \
  \ owner: devops\n11         mode: '0644'\n```\n\n* `report.txt`\n\n```\n1 test report.txt\n\
  ```\n\n## 从远程主机复制文件 - 远程到本地 - Ansible fetch module\n\n让我们讨论 Ansible 模块 `fetch`。\n\
  \n全名为 `ansible.builtin.fetch`，这意味着它是 Ansible 自带的“builtin”模块集合的一部分，并随 Ansible 一起发布。\n\
  \n该模块非常稳定，已发布多年。\n\n其目的是从远程位置复制文件。\n\n### 参数\n\n* `dest` 路径\n* `src` 字符串\n* `fail_on_missing`\
  \ 布尔值\n* `validate_checksum` 布尔值\n* `flat` 布尔值\n\n参数列表非常广泛，但我将总结一下最实用的。\n\n\n\n\n\
  唯一要求的参数是 `dest`，它指定保存文件的目录，而 `src` 指定远程主机上的源文件。它必须是一个文件，而不是目录。\n\n`fail_on_missing`\
  \ 布尔值被设置为 `true`，因此如果文件不存在，任务将失败。\n\n文件将被传输并在源端和目的端通过校验和进行验证。如果我们不想要这种行为，可以使用 `validate_checksum`\
  \ 选项进行覆盖。\n\n`flat` 允许你覆盖在目标路径后附加 `hostname/path/to/file` 的默认行为。\n\n### 示例\n\n让我们进入一个真实的\
  \ Ansible Playbook，从远程主机复制文件：\n`fetch.yml`\n\n```\n 1 ---\n 2 - name: fetch module\
  \ demo\n 3   hosts: all\n 4   become: true\n 5   vars:\n 6     log_file: \"/var/log/messages\"\
  \n 7     dump_dir: \"logs\"\n 8   tasks:\n 9     - name: fetch log\n10       ansible.builtin.fetch:\n\
  11         src: \"{{ log_file }}\"\n12         dest: \"{{ dump_dir }}\"\n```\n\n\
  ## 在 Linux 远程主机上启动机自启服务 - Ansible 模块 service_facts, service\n\n如何使用 Ansible 在远程主机上设置服务机自启。\n\
  \n- `ansible.builtin.service_facts`\n- 将服务状态信息作为事实（fact）返回\n- `ansible.builtin.service`\n\
  - 管理服务\n\n让我们聊聊 Ansible 模块 `service_facts` 和 `service`。\n\n首先，你需要获取目标机器上的服务信息。\n\
  \n此任务由 Ansible 模块 `service_facts` 执行。你无法启用一个并不存在的服务，对吧？\n\n有效操作由 Ansible 模块 `service`\
  \ 执行。\n\n它的全名是 `ansible.builtin.service`，这意味着这两个模块都是 Ansible 内置 `builtin` 集合的一部分，并随\
  \ Ansible 一起分发。\n\n该模块非常稳定且已发布多年，其目的是管理远程主机上的服务。\n\n对于 Windows 目标，请改用 `ansible.windows.win_service`\
  \ 模块。\n\n### 参数\n\n- `name` 路径 - 服务名称\n- `state` 字符串 - started / stopped / restarted\
  \ / reloaded\n- `enabled` 布尔值 - no/yes\n- `arguments/args` 字符串 - 额外参数\n\n参数列表很广泛，但我将总结最有用的部分。\n\
  \n唯一要求的参数是 `name`，它指定服务的名称。\n\n在 `state` 和 `enabled` 参数之间至少有一个是强制性的。\n\n`state`\
  \ 参数定义了我们将采取的操作。\n\n它有四种可选选项：\n\n- `started` 和 `stopped` 选项允许你运行或停止服务。\n- `restarted`\
  \ 是停止和启动的组合 - 你还可以通过使用 `sleep` 参数自定义它们之间的秒数。\n- `reloaded` 选项在服务需要重新加载配置文件时有用。\n\
  \n`enabled` 参数允许你决定服务是否应该在开机时启动。\n\n`arguments` 或 `args` 参数允许你指定命令行提供的某些额外参数。\n\n\
  ### 演示\n\n如何使用 Ansible Playbook 在远程主机上设置服务机自启并启动。\n\n这里包含了在 RedHat Enterprise Linux\
  \ 8 上使用 `chronyd.service` NTP 服务器的代码和演示。\n\n#### 代码\n\n`service_enable_on_boot.yml`\n\
  \n```\n 1 ---\n 2 - name: service module demo\n 3   hosts: all\n 4   become: true\n\
  \ 5   vars:\n 6     services_on_boot:\n 7       - \"chronyd.service\"\n 8   tasks:\n\
  \ 9     - name: populate service facts\n10       ansible.builtin.service_facts:\n\
  11     - name: enable services on boot\n12       ansible.builtin.service:\n13  \
  \       name: \"{{ item }}\"\n14         enabled: true\n15         state: started\n\
  16       when: \"item in services\"\n17       with_items: '{{ services_on_boot }}'\n\
  ```\n\n#### 执行\n\n```\n 1 $ ansible-playbook -i virtualmachines/demo/inventory enab\\\
  \n 2 le\\ services\\ on\\ boot/service.yml\n 3 PLAY [service module demo] ******************************\\\
  \n 4 ******************************************\n 5 TASK [Gathering Facts] **********************************\\\
  \n 6 ******************************************\n 7 ok: [demo.example.com]\n 8 TASK\
  \ [populate service facts] ***************************\\\n 9 ******************************************\n\
  10 ok: [demo.example.com]\n11 TASK [enable services on boot] **************************\\\
  \n12 **********************************************\n13 changed: [demo.example.com]\
  \ => (item=chronyd.service)\n14 PLAY RECAP **********************************************\\\
  \n 15 ******************************************\n16 demo.example.com          \
  \ : ok=3    changed=1    unreach\\\n17 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n```\n\n#### 执行前\n\n```\n 1 $ ssh devops@demo.example.com\n 2 [devops@demo\
  \ ~]$ sudo su\n 3 [root@demo devops]# cat /etc/redhat-release \n 4 Red Hat Enterprise\
  \ Linux release 8.4 (Ootpa)\n 5 [root@demo devops]# rpm -qa | grep chrony\n 6 chrony-3.5-2.el8.x86_64\n\
  \ 7 [root@demo devops]# systemctl status chronyd.service\n 8 ● chronyd.service -\
