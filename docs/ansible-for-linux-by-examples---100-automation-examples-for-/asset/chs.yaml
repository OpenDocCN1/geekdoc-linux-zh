  \ 2022 年 1 月 12 日\n\n#### 2021\n\n* [Ansible 牛报 #41 - 开发者社区通讯](https://mailchi.mp/redhat/the-bullhorn-41)\
  \ 2022 年 1 月 7 日\n* [Ansible 牛报 #34 - 开发者社区通讯](https://us19.campaign-archive.com/?u=56d874e027110e35dea0c&id=5f02182)\
  \ \n\n本课程将根据 Ansible 的演进跟踪更多内容。\n\n* * *\n\n你准备好享受乐趣了吗？\n\n# 入门指南及示例\n\n在本章中，你将发现\
  \ `Ansible` 的基础、架构和术语。\n\n## 什么是 Ansible\n\n在本章中，我将向你解释 `Ansible` 是什么以及为什么对你的 IT\
  \ 部门如此强大。\n\n### Ansible\n\n* 基础设施自动化工具\n* 开源基础设施代码\n\n首先，让我们开始探索这项名为 `Ansible`\
  \ 技术。它被归类为基础设施自动化工具，因此你可以轻松地自动化系统管理员任务。基础设施即代码是通过机器可读的定义文件管理和配置数据中心，而不是通过物理硬件或交互式配置工具。`Ansible`\
  \ 遵循 DevOps 原则。通过 `Ansible` 你可以在本地和主要的云提供商上部署基础设施即代码。\n\n### Ansible 三大用例\n\n* 配置\n\
  * 配置管理\n* 应用部署\n\n`Ansible` 的三个主要用例是配置、配置以及应用部署。但在接触技术后，我相信你还可以发明更多使用方法！\n\n####\
  \ 配置\n\n* 设置 IT 基础设施的过程\n\n让我们开始谈论配置：所有的系统管理员都知道管理统一集群的重要性。有些人仍然依靠软件创建工作站镜像。但有一个缺点，使用镜像技术只是对机器的时间快照。因此，每当你因为现代密钥激活系统需要重新安装软件，或手动更新到最新的安全补丁时，`Ansible`\
  \ 在自动化这一过程方面非常强大，能够创建一个更顺畅的过程。\n\n#### 配置管理\n\n* 使系统和软件处于预期且一致状态的过程\n\n第二个关键用例是“配置管理”：以一致的方式保持你整个集群的最新，协调滚动更新并调度停机。通过\
  \ `Ansible` 你可以验证受托管主机的状态，并对其中一小部分主机采取操作。大量的模块适用于最常见的用例。更不用说检查你的集群对某些国际标准的合规性并执行解决方案的常见用例。\n\
  \n#### 应用部署\n\n* 在测试、阶段和生产环境之间发布你的软件的过程\n\n\n\n\n\nAnsible 有用的第三个关键用例是应用部署。例如，它可以自动化你\
  \ Web 应用程序的持续集成/持续交付（CI/CD）工作流流水。你的 DevOps 团队会非常开心的！\n\n## DevOps 中的 Ansible\n\n\
  Ansible 用于在全球范围内应用 DevOps 原则。让我快速总结一下。\n\nDevOps 是一种结合了软件开发（Dev）和 IT 运维（Ops）的实践。由于\
  \ DevOps 旨在成为一种跨部门的工作模式，实践该方法的人员使用不同的工具集，称为“工具链”（toolchains），而不是单一工具。这些工具链预计符合以下一个或多个类别，反映了开发和交付过程的关键方面。这七个类别分别是：\n\
  \n- **Code**：代码开发与评审、源代码管理工具、代码合并。\n- **Build**：持续集成工具、构建状态。\n- **Test**：持续测试工具，可对业务风险提供快速且及时的反馈。\n\
  - **Release**：制品仓库、应用部署前的分阶段环境。\n- **Deploy**：变更管理、发布审批、发布自动化。\n- **Operate**：基础设施配置与管理、基础设施即代码工具。\n\
  - **Monitor**：应用性能监控、终端用户体验。\n\n## Ansible 的四个核心原则\n\n1. **声明式（Declarative）**：你声明你想要什么，而不是如何实现。\n\
  2. **无代理（Agentless）**：你不需要安装代理。它利用了 `OpenSSH`。\n3. **幂等性（Idempotent）**：操作可以运行多次而不会产生初始操作之外的更改。\n\
  4. **社区驱动（Community driven）**：以集合（collections）和角色（roles）的形式发布在 `Ansible Galaxy`\
  \ 中。\n\nAnsible 的四个核心原则是：声明式、无代理、幂等性和社区驱动。“声明式”意味着你可以以非常类似于编程语言的方式，在代码流中应用顺序、选择和迭代。“无代理”意味着你不需要在目标机器上安装和更新任何代理，它使用\
  \ SSH 连接和 `python` 解释器。该语言本身是“幂等”的，这意味着代码将检查被管理机器上的精确状态。这意味着，例如，你的代码第一次运行时会更改某些内容，随后的运行仅会验证没有发生变化并继续执行。最后一个原则是“社区驱动”，意味着存在一个名为“Ansible\
  \ Galaxy”的公共存档，你可以在那里下载其他开源贡献者编写的代码。这些代码组织为角色（roles）和集合（collections），我们将在将来看到。\n\
  \n## Ansible 的六大价值\n\n- **简单（Simple）**：人类可读的 YAML 。\n- **强大（Powerful）**：配置管理、工作流编排、应用部署。\n\
  - **跨平台（Cross-platform）**：对所有主流操作系统、物理机、虚拟机、云和网络提供无代理支持。\n- **与现有工具协作**：统一现有环境。\n\
  - **“内置电池”（batteries included）**：自带了 750 多个模块。\n- **社区驱动**：每月下载量 25 万次，平均 3500 名贡献者，IRC\
  \ 上有 1200 多用户。\n\n现在让我们谈谈 Ansible 的六大价值。第一个是“简单”：代码是用 `YAML` 语言编写的，这是一种人类可读的数据序列化语言。它广为人知且易于学习，通常用于配置文件以及存储或传输数据的应用程序。Ansible\
  \ 是强大的，它在配置管理、工作流编排、应用部署方面经过了实战检验。第三个价值是天生的“跨平台”，对所有主流操作系统、物理机、虚拟机、云和网络供应商提供无代理支持。Ansible\
  \ 的另一个价值是它可以与现有工具协作，轻松地统一现有环境。“内置电池”意味着 Ansible 包含了 750 多个模块，以自动化最常见的任务。最后一个价值是\
  \ Ansible 是“社区驱动”的，每月有超过 250,000 次下载，平均有 3500 名贡献者，IRC 上有 1200 多用户。\n\n## Ansible\
  \ 历史\n\n- **2012**：由 Michael DeHaan 开发\n- **2015**：被红帽（Red Hat）收购\n- **2016**：AnsibleFest\
  \ 活动\n- **2020**：红帽 Ansible 平台 1.0\n- **2021**：红帽 Ansible 平台 2.1\n\nAnsible 历史上的主要事件如下。\n\
  \nAnsible 的第一个版本于 2012 年 2 月 20 日公发布。Ansible 工具由 Michael DeHaan 开发。`Ansible Inc.`（原名\
  \ `AnsibleWorks Inc.`）是为了商业化支持和赞助该项目而成立的公司。\n\n2015 年 10 月 16 日，红帽收购了 `Ansible Inc.`，并将\
  \ Ansible 评估为“强大的 IT 自动化解决方案”，旨在帮助企业向无缝的 IT 迈进。\n\n`AnsibleFest` 是自 2016 年以来在伦敦和美国举办的\
  \ Ansible 用户及贡献者年度会议。\n\n## Ansible & Ansible Tower & Ansible 自动化平台（Automation Platform）\n\
  \n- **Ansible**：社区驱动的项目，创新快速，开源，但仅提供命令行工具。\n- **Red Hat Ansible Tower / Ansible\
  \ Automation Platform**：这是一个由红帽设计的框架。它提供了一个 Web 界面来管理你的基础设施。\n\nAnsible 是一个社区驱动的项目，创新快速，开源，但仅提供命令行工具。\n\
  \n企业需要更多的服务和一些稳定的版本。例如，它们需要支持方面的 SLA。红帽为公司提供这种服务，即在 Ansible Tower 伞下，现在已更名为 Ansible\
  \ Automation Platform（Ansible 自动化平台）。\n\n`Ansible Tower` 是一个 REST API、Web 服务和基于\
  \ Web 的控制台，旨在让具有不同技术水平和技能组合的 IT 团队更方便地使用 Ansible。它是自动化任务的枢纽。该塔是由红帽支持的商业产品，但源自 2017\
  \ 年开源的 `AWX` 项目。\n\n红帽还维护 `Ansible Engine`。通过 `Ansible Engine`，企业可以以加固的安全方式访问底层\
  \ Ansible 的工具和创新。`Ansible Engine` 由红帽开发，明确意图是作为企业平台使用。\n\n## 入门\n\n在本章中，我将向你解释如何开启\
  \ Ansible 技术的第一步。如何连接托管主机以及如何使用命令行执行一些简单任务。\n\n### Ansible 架构\n\n让我们开始谈论 Ansible\
  \ 架构。安装 Ansible 的节点被称为“控制节点”（control node），它管理你所有的节点。另一方面，受控节点被称为“托管节点”（managed\
  \ node）。目标节点可以是 Linux、Mac、Windows 以及各种网络设备。每个目标都有某些特殊性，例如不同的 Linux 发行版和模块用法。我们将在后续章节讨论这些特殊性。\n\
  \n### 运行你的第一个 Ansible 命令\n\n\n\n\n\n```\n1 $ ansible all -m ping\n2 host1.example.org\
  \ | SUCCESS => {\n3     \"ansible_facts\": {\n4         \"discovered_interpreter_python\"\
  : \"/usr/bin/python\"\n5     },\n6     \"changed\": false,\n7     \"ping\": \"pong\"\
  \n8 }\n```\n\n* `ping` 模块在 `all` 主机上执行\n* `host1.example.com` 了成功状态码\n\n现在我们准备好运行你的第一个\
  \ Ansible 命令了。在 Ansible 术语中，命令被称为 `module`。第一行代码在 `all` 主机上执行了 Ansible `ping` 模块。响应是\
  \ `pong`。请注意，这意味着 Ansible 能够通过 SSH 用户名连接，使用公钥进行身份验证并执行本地 python 执行器。因此，它与网络中的任何\
  \ `ping` 完全不同。\n\n## 在 Ansible 上运行即时命令\n\n```\n1 $ ansible all -a \"/bin/echo hello\"\
  \n2 host1.example.org | CHANGED | rc=0 >>\n3 hello\n```\n\n* `/bin/echo hello` 命令在\
  \ `all` 主机上执行\n* `host1.example.com` 返回了变更状态码并在标准输出上打印了 `hello`\n\nAnsible 可以在目标主机上执行某些命令，并在控制节点（`control\
  \ node`）的控制报告状态。在示例中，`/bin/echo hello` 命令在 `all` 主机上执行。`host1.example.com` 返回了变更状态码并在标准输出上打印了\
  \ `hello`。请注意，每你在远程机器上运行命令时，都会收到一个 `changed` 状态。\n\n## 在 Ansible 上运行带权限管理的即时命令\n\
  \n```\n1 $ ansible all -m ping -u devops --become\n2 host1.example.org | SUCCESS\
  \ => {\n3     \"ansible_facts\": {\n4         \"discovered_interpreter_python\"\
  : \"/usr/bin/python\"\n5     },\n6     \"changed\": false\n7     \"ping\": \"pong\"\
  \n8 }\n```\n\n* 以用户 `devops` 登录后，作为用户 `root` 在所有 `all` 主机上执行 `ping` 模块\n* `host1.example.com`\
  \ 返回了变更状态码并在标准输出上打印了 `hello`\n\n在示例中，我以用户 `devops` 登录后，作为用户 `root` 对 `all` 主机运行了\
  \ `ping` 模块。`host1.example.com` 返回了变更状态码并在标准输出上打印了 `hello`。\n\n### 总结\n\n在本模块中我们学习了\
  \ Ansible 架构的基本概念、如何编写托管主机列表以及如何对它们执行一些简单命令。\n\n## 清单 (Inventory)\n\n在本章中，我将向你解释什么是\
  \ Ansible 清单、为什么需要它、它的不同类型以及如何在日常工作中编辑和使用它。\n\n```\n1 清单是 Ansible 可以工作的主机集合。\n2.\
  \ 它们可以被分类为组/模式（groups/patterns）。\n```\n\n由 Ansible 管理的多主机列表被称为 `inventory`。它从根本上说是你基础设施中节点或主机的列表，使用名为清单的列表或列表。你可以通过\
  \ `groups`（组）或 `patterns`（模式）组织你的清单，以选择你想让 Ansible 运行的主机或组。\n\n### `all` 关键字\n\n\
  ```\n1 关键字 all 包含清单中的所有主机，除了\n2 pt localhost\n```\n\n特殊关键字 `all` 包含所用清单的所有主机。它在接下来的课程中非常有用。唯一的例外是需要指定的\
  \ `localhost`。\n\n### 简单的 INI 清单\n\n* `./ini_simple_inventory`\n\n```\n1 one.example.com\n\
  2 \n3 [webservers]\n4 two.example.com\n5 three.example.com\n```\n\n* 文件名：`ini_simple_inventory`\n\
  * `one.example.com` 未分组\n* `two.example.com` 和 `three.example.com` 被组为 `webserver`\n\
  \n根据文件类型，简单的清单类型是 INI 清单。默认位置是 `/etc/ansible/hosts`，但你可以使用 `-i` 参数使用自定义清单。在示例中，主机\
  \ `one.example.com` 未分组，`two.example.com` 和 `three.example.com` 被组为 `webserver`。\n\
  \n### 简单的 YAML 清单\n\n* `./simple_yaml_inventory.yml`\n\n```\n1 ---\n2 all:\n3  \
  \ hosts:\n4     one.example.com:\n5   children:\n6     webservers:\n7       hosts:\n\
  8         two.example.com:\n9         three.example.com:\n```\n\n* 文件名：`inventory.yml`\n\
  * `one.example.com` 未分组\n* `two.example.com` 和 `three.example.com` 被组为 `webserver`\n\
  \n你可以使用 YAML 语法表示相同的清单。在示例中，主机 `one.example.com` 未分组，`two.example.com` 和 `three.example.com`\
  \ 被组为 `webserver`。\n\n### 添加主机范围\n\n* `./ini_range_inventory`\n\n```\n1 [webservers]\n\
  2 www[01:99].example.com\n3 \n4 [databases]\n5 db-[a-f].example.com\n```\n\n* `webservers`\
  \ 组包含从 `www01.example.com` 到 `www99.example.com` 的所有主机\n* `Databases` 组包含从 `db-a.example.com`\
  \ 到 `db-f.example.com` 的所有主机\n\n`webservers` 组包含从 `www01.example.com` 到 `www99.example.com`\
  \ 的所有主机。\n`Databases` 组包含从 `db-a.example.com` 到 `db-f.example.com` 的所有主机。\n\n###\
  \ 多个组中的主机\n\n*   `./ini_groups`\n\n```\n1 [webservers]\n2 one.example.com\n3 two.example.com\n\
  4 \n5 [prod]\n6 two.example.com\n7 three.example.com\n```\n\n* `two.example.com`\
  \ 和 `three.example.com` 被组为 `webserver`。\n\nAnsible 可以在目标主机上执行某些命令，并在控制节点（`control\
  \ node`）的控制报告状态。在示例中，`/bin/echo hello` 命令在 `all` 主机上执行。`host1.example.com` 返回了变更状态码并在标准输出上打印了\
  \ `hello`。\n\n### 主机变量\n\n*   `./ini_host`\n\n```\n1 [webservers]\n2 one.example.com\n\
  3 two.example.com\n4 \n5 [prod]\n6 two.example.com\n7 three.example.com\n```\n\n\
  * `two.example.com` 和 `three.example.com` 被组为 `webserver`。\n\n### 组变量\n\n*   `./ini_groups`\n\
  \n```\n1 [webservers]\n2 one.example.com\n3 two.example.com\n4 \n5 [prod]\n6 two.example.com\n\
  7 three.example.com\n```\n\n* `two.example.com` 和 `three.example.com` 被组为 `webserver`。\n\
  \n### 继承变量值\n\n*   `./ini_variableinheriting_inventory`\n\n```\n1 [asia]\n2 host1.example.com\n\
  3 \n4 [europe]\n5 host2.example.com\n6 \n7 [webserver:children]\n8 asia\n9 europe\n\
  10 \n11 [webservers:vars]\n12 ntp_server=europe.pool.org\n```\n\n*   `./variableinheriting_inventory.yml`\n\
  \n```\n1 ---\n2 children:\n3   webservers:\n4     children:\n5       asia:\n6  \
  \       hosts:\n7           host1.example.com:\n8       europe:\n9         hosts:\n\
  10           host2.example.com:\n11     vars:\n12       ntp_server: europe.pool.org\n\
  ```\n\n\n\n\n\n# 对 `production` 和 `development` 环境执行名为 `playbook.yml` 的 ansible\
  \ playbook\n\n每次执行可以使用多个清单文件（inventory）。在本例中，将针对 `production` 和 `development` 清单执行名为\
  \ `playbook.yml` 的 ansible playbook。\n\n## localhost 清单文件\n\n* `./ini_local_inventory`\n\
  \n```\n1 localhost ansible_connection=\"local\"\n```\n\n* 文件名：`inventory`\n\n* 默认路径：`/etc/ansible/hosts`\n\
  \n清单中的一个特殊情况是 `localhost`。你需要将连接类型指定为 `local`，否则 Ansible 将假定为使用默认的 SSH 连接。\n\n###\
  \ 总结\n\n现在你对 Ansible INI 和 YAML 清单文件、主机变量和组变量有了更深入的了解。\n\n## Playbook\n\n在本章，我将向你解释什么是\
  \ Ansible Playbook 以及你为什么需要它。我们将介绍如何开始从一个简单的 playbook 开始，从基础语法到如何添加更多任务。\n\n```\n\
  1 一个 playbook 是一组针对清单执行的剧本\\\n2 （play）。\n```\n\n### YAML 语法\n\n```\n 1 # 这是一个 YAML\
  \ 注释\n 2 some data # 这也是一个 YAML 注释\n 3 \n 4 这是一个字符串\n 5 '这是另一个字符串'\n 6 \"这是三个字符串\"\
  \n 7 \n 8 with_newlines: |\n 9 Example Company\n10 123 Main Street\n11 New York,\
  \ NY 10001\n12 \n13 without_newlines: >\n14 这是一个长字符串\n15 的示例，\n16 不会换行，\n17 它将变成\n\
  18 单独的句子。\n19 \n20 yaml_dictionary: {name1: value1, name2: value2}\n21 \n22 yaml_list1:\n\
  23 - value1\n24 - value2\n25 yaml_list2: [value1, value2]\n```\n\n每个 playbook 都基于\
  \ YAML 语法，因此文件易于阅读且符合人类习惯。YAML 是一种文本格式，你可以通过开头的三个横号和结尾的三个点来轻松识别它。三个点并不是强制性的，因此许多人直接省略它们。这种文件类型对元素之间的空格非常敏感。与某些编程语言不同，相同层级的元素必须保持相同的缩进，这非常重要。你可以使用符号\
  \ `#` 进行注释，即使是在带有之前代码的行中。字符串非常重要，你可以直接指定，也可以使用单引号或双引号。我建议通上使用双引号。通过管道符和块定义语句，你可以定义多行字符串。其他有用的数据结构是字典和列表，你可以在灰色区域看到它们的用法。\n\
  \n### helloworld.yml\n\n* `helloworld.yml`\n\n```\n1 ---\n2 - name: Hello World\
  \ sample\n3   hosts: all\n4   tasks:\n5     - name: Hello message\n6       ansible.builtin.debug:\n\
  7         msg: \"Hello World!\"\n8 ...\n```\n\n```\n1 文件名：helloworld.yml\n2 Playbook\
  \ 的名称\n3 执行的主机列表\n4 任务列表\n5 一个名为“Hello message”的任务\n6 使用了模块 ansible.builtin.debug\n\
  7 debug 模块的参数“msg”\n```\n\n这是执行 `helloworld.yml` 后的输出。我希望你注意使用的命令是 `ansible-playbook`。第一个参数是清单文件，第二个是\
  \ playbook。\n\n在本次执行中，剧本针对 `host1.example.com` 节点执行。输出清晰地展示了执行步骤。当命令执行成功时，输出显示为绿色。警告将以橙色显示，错误显示为红色。细心的人可能注意到执行了一个额外任务名为\
  \ `Gathering Facts`（收集因子），这是 Ansible 用于获取被管理节点的一些信息。我们将在下一节中更多地讨论因子收集。尝试自己执行这段代码，对这个输出摘要建立信心。它非常有用。当前有两个任务正在执行。\n\
  \n### 提示 1：ansible-playbook –check 选项\n\n```\n 1 $ ansible-playbook -i inventory\
  \  --check  helloworld.yml\n 2 PLAY [Hello World sample] *******************************\\\
  \n 3 *********************************************************\\\n 4 ***********\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 *********************************************************\\\
  \n 7 ********\n 8 ok: [host1.example.com]\n 9 TASK [Hello message] ************************************\\\
  \n10 *********************************************************\\\n11 ******\n12\
  \ ok: [host1.example.com] => {\n13     \"msg\": \"Hello World!\"\n14 }\n15 PLAY\
  \ RECAP **********************************************\\\n16 *****************************************************\n\
  17 host1.example.com       : ok=2    changed=0    unreachabl\\\n18 e=0    failed=0\
  \    skipped=1    rescued=0    ignored=0\n```\n\n`ansible-playbook` 命令有一个非常有实用的选项\
  \ `--check`。该选项用于对 playbook 执行进行干运行。这会导致 Ansible 报告如果执行 playbook 将发生哪些更改，但不会对被管理主机进行任何实际更改。\n\
  \n### 提示 2：debug 日常用法\n\n* `helloworld_debug.yml`\n\n```\n1 ---\n2 - name: Hello\
  \ World sample\n3   hosts: all\n4   tasks:\n5     - name: Hello message\n6     \
  \  debug:\n7         msg: \"Hello World!\"\n8 ...\n```\n\n等待，基于提示 2 的：\n```\n1 ---\n\
  2 - name: Hello World sample\n3   hosts: all\n4   tasks:\n5     - name: Hello message\n\
  6       debug:\n7         msg: \"Hello World!\"\n8 ...\n```\n```\n1 文件名：helloworld_debug.yml\n\
  2 Playbook 的名称\n3 执行的主机列表\n4 任务列表\n5 一个名为“Hello message”的任务\n6 使用了模块 debug\n7 debug\
  \ 模块的参数“msg”\n8 详细程度“2”\n```\n\n此提示允许你在 playbook 中保留调试代码，仅在需要时启用调试。例如，只有在调用 Ansible\
  \ 时才会打印。\n\n### helloworld_debug.yml - 执行部分 1\n\n```\n 1 ansible-playbook -i inventory\
  \ helloworld.yml\n 2 PLAY [Hello World sample] *******************************\\\
  \n 3 *********************************************************\\\n 4 ***********\n\
  \ 5 \n 6 TASK [Gathering Facts] **********************************\\\n 7 *********************************************************\\\
  \n 8 ********\n 9 ok: [host1.example.com]\n 10 \n11 TASK [Hello message] ************************************\\\
  \n12 *********************************************************\\\n13 ******\n14\
  \ skipping: [host1.example.com]\n15 \n16 PLAY RECAP **********************************************\\\
  \n17 *****************************************************\n18 host1.example.com\
  \       : ok=1    changed=0    unreachabl\\\n19 e=0    failed=0    skipped=1   \
  \ rescued=0    ignored=0\n```\n\n这是 `helloworld_debug.yml` 在正常执行时的输出，意味着未处于调试模式。你可以注意到\
  \ hello message 被跳过了。\n\n### helloworld_debug.yml - 执行部分 2\n\n```\n 1 $ ansible-playbook\
  \ -i inventory -vv helloworld_debug.yml\n 2 PLAY [Hello World sample] *******************************\\\
  \n 3 *********************************************************\\\n 4 ***********\n\
  \ 5 \n 6 TASK [Gathering Facts] **********************************\\\n 7 *********************************************************\\\
  \n 8 ********\n 9 ok: [host1.example.com]\n 10 \n11 TASK [Hello message] ************************************\\\
  \n12 *********************************************************\\\n13 ******\n14\
  \ ok: [host1.example.com] => {\n15     \"msg\": \"Hello World!\"\n16 }\n17 PLAY\
  \ RECAP **********************************************\\\n18 *****************************************************\n\
  19 host1.example.com       : ok=2    changed=0    unreachabl\\\n20 e=0    failed=0\
  \    skipped=1    rescued=0    ignored=0\n```\n\n这是 `helloworld_debug.yml` 在调试级别二模式下执行时的输出，请注意命令行中的两个\
  \ `V`。你可以注意到 hello message 被打印了。\n\n#### 等幂性 (Idempotency)\n\n```\n1 等幂性\n2 模块检查目标最终状态是否已经实\\\
  \n3 实现，否则应用\n```\n\n\n\n\n\nAnsible 模块的一个重要特性是“幂等性”。这意味着在对目标节点上执行任何操作之前，模块将检查实际状态。如果实际状态与预期状态匹配，则将不会执行任何操作。如果当前状态偏离了预期状态，则会执行操作。请注意，如果你再次执行该\
  \ playbook，将发现状态符合预期，因此不再执行后续操作。这种属性被称为“幂等性”，你应该充分利用它。\n\n### multipleplays.yml\n\
  \n```\n 1 ---\n 2 - name: first play\n 3   hosts: web.example.com\n 4   tasks:\n\
  \ 5     - name: first task\n 6       ansible.builtin.yum:\n 7         name: httpd\n\
  \ 8         status: present\n 9     - name: second task\n10       ansible.builtin.service:\n\
  11         name: httpd\n12         enabled: true\n13 - name: second play\n14   hosts:\
  \ database.example.com\n15   tasks:\n16     - name: first task\n17       ansible.builtin.service:\n\
  18         name: mariadb\n19         enabled: true\n```\n\n*   文件名：`multipleplays.yml`\n\
  \n内部包含两个针对 `web.example.com` 和 `database.example.com` 执行的 play。\n\n`multipleplays.yml`\
  \ playbook 包含两个 play。第一个 play 在 `web.example.com` 主机上执行，安装 apache Web 服务器并设置开机自启。第二个\
  \ play 将 `database.example.com` 上执行，并将 `mariadb` 数据库管理系统设置为开机自启。如你所见，使用多个 play 在不同的主机上执行不同的任务是非常强大的。现在\
  \ playbook 的定义变得更有意义了。\n\n### privilege_escalation.yml\n\n```\n 1 ---\n 2 - name:\
  \ install httpd\n 3   hosts: web.example.com\n 4   become: true\n 5   become_method:\
  \ sudo\n 6   become_user: root\n 7   tasks:\n 8     - name: install httpd\n 9  \
  \     ansible.builtin.yum:\n10         name: httpd\n11         status: present\n\
  ```\n\n*   `privilege_escalation.yml`\n\n`become` 指定需要进行权限提升。\n\n`become_method`\
  \ 指定提升方法。\n\n`become_user` 指定目标用户（默认认为 `root`）。\n\n某些操作需要具有管理权限的用户来执行。在 Linux 中，通常是\
  \ `root` 用户。某些发行版允许使用 `sudo` 命令通过 `wheel` 组进行权限提升。在这个示例中，我要安装一个软件，因此需要权限提升。`yum`\
  \ 模块需要在受管节点上执行某些操作。在 playbook 中，如果没有必要，你可以禁用它。\n\n### 最常用的 Ansible 模块\n\n*   文件模块\n\
  \    *   `copy`：将本地文件复制到受管主机\n    *   `fetch`：从远程节点将文件复制到本地\n    *   `file`：设置文件的权限和其他属性\n\
  \    *   `lineinfile`：确保文件中包含或不包含某行特定内容\n    *   `synchronize`：使用 `rsync` 同步内容\n\
  *   软件包模块\n    *   `package`：使用自动检测的操作系统原生包管理器管理软件包\n    *   `yum`：使用 YUM 包管理器管理软件包\n\
  \    *   `apt`：使用 APT 包管理器管理软件包\n    *   `dnf`：使用 DNF 包管理器管理软件包\n    *   `gem`：管理\
  \ Ruby gems\n    *   `pip`：从 PyPI 管理 Python 软件包\n*   系统模块\n    *   `firewalld`：使用\
  \ `firewalld` 管理任意端口和服务\n    *   `reboot`：重启机器\n    *   `service`：管理服务\n    *  \
  \ `user`：添加、删除和管理用户账户\n*   网络工具工具模块\n    *   `get_url`：通过 HTTP、HTTPS 和 FTP 下载文件\n\
  \    *   `nmcli`：管理网络\n    *   `uri`：与 Web 服务交互\n\n### 总结\n\n在本模块中，我们为后续的 Ansible\
  \ Playbook 操作奠定了基础。继续下去，很快你就能自动化所有的系统管理员任务。\n\n## 变量\n\n在本章中，我将向你解释什么是 Ansible 变量、你为什么需要它们、不同类型以及在日常工作中如何编辑和使用它们。\n\
  \n```\n1 变量为给定环境存储动态值。\n```\n\n在 Playbook 中，使用变量来存储你需要的所有动态值是一个良好的实践。通过编辑变量，你可以在未来根据业务需求通过相应的参数化来复用代码。\n\
  \n### 不允许的变量名\n\n*   不能包含空格 `my var`\n*   不能包含点 `my.var`\n*   不能以数字开头 `1stvar`\n\
  *   不能包含特殊字符 `myvar$1`\n\nAnsible 允许在变量名中使用字母和数字的任意组合。如果你计划使用数字，请注意不能放在开头，但这是信息技术世界的通用规则。\n\
  \n变量名的四个主要限制是：不允许空格、不允许包含点、不能以数字开头、不能包含特殊字符。在右侧你可以看到一些无效变量名的示例。\n\n### variableprint.yml\n\
  \n*   `./variableprint.yml`\n\n```\n1 ---\n2 - name: Variable print sample\n3  \
  \ hosts: all\n4   vars:\n5     fruit: \"apple\"\n6   tasks:\n7     - name: Print\
  \ variable\n8       ansible.builtin.debug:\n9         msg: \"Print the value of\
  \ variable {{ fruit }}\"\n```\n\n```\n1 文件名：variableprint.yml\n```\n\n`variableprint.yml`\
  \ playbook 与 `helloworld.yml` 类似。除了变量外，其语法和元素结构相似。变量存储字符串、数字以及更复杂的结构（如列表、字典）等信息。在这种情况下，变量名为\
  \ `fruit`，值为 `apple`。此时 `debug` 模块会将文本与该值拼接。\n\n### variableprint.yml - 执行\n\n```\n\
  1 $ ansible-playbook -i inventory variableprint.yml\n2 PLAY [Variable print sample]\
  \ ****************************\n3 ***********************\n4 \n5 TASK [Gathering\
  \ Facts] *********************************\n6 ***********************\n7 ok: [host1.example.com]\n\
  8 \n9 TASK [Print variable] ***********************************\n10 ***********************\n\
  11 ok: [host1.example.com] => {\n12     \"msg\": \"Print the value of variable apple\"\
  \n13 }\n14 \n15 PLAY RECAP **********************************************\n16 ***********************\n\
  17 host1.example.com\t: ok=2    changed=0    unreachable=0   \n18  failed=0    skipped=0\
  \    rescued=0    ignored=0\n```\n\n这是执行 `variableprint.yml` 的输出。该执行是成功的，如你在 play\
  \ 总结区域和绿色所示。有两个任务正在执行。\n\n### variableprint.yml - 额外变量\n\n```\n1 $ ansible-playbook\
  \ -i inventory -e fruit=banana variabl\n2 eprint.yml\n3 PLAY [Variable print sample]\
  \ ****************************\n4 ***********************\n5 \n6 TASK [Gathering\
  \ Facts] *********************************\n7 ***********************\n8 ok: [host1.example.com]\n\
  9 \n10 TASK [Print variable] ***********************************\n11 ***********************\n\
  12 ok: [host1.example.com] => {\n13     \"msg\": \"Print the value of variable banana\"\
  \n14 }\n15 \n16 PLAY RECAP **********************************************\n17 ***********************\n\
  18 host1.example.com\t: ok=2    changed=0    unreachable=0   \n19  failed=0    skipped=0\
  \    rescued=0    ignored=0\n```\n\n你可以从命令行指定值来覆盖 playbook 变量。在命令行设置的变量被称为额外变量。\n\
  \n\n\n\n\n`variableprint.yml` 的执行输出与之前的一个非常相似。请注意，通过将字符串与变量值结合，获得了消息“Print the value\
  \ of variable banana”的打印。从命令行传递的值将覆盖剧本中的任何值。\n\n### 主机变量与组变量\n\n* `inventory_host_variables`\n\
  \n```\n1 [servers]\n2 host1.example.com ansible_user=devops\n```\n\n* `inventory_group_variables`\n\
  \n```\n1 [servers]\n2 host1.example.com\n3 host2.example.com\n4 \n5 [servers:vars]\n\
  6 user=alice\n```\n\n主机变量和组变量可以在你的清单文件中定义。在左列中，你可以看到一个主机变量的示例。变量 `ansible_user`\
  \ 被赋值为值 `devops`。该主机变量适用于 `host1.example.com`。在右列中，你看到一个组变量的示例。变量 `user` 被赋值为 `alice`。该组变量将以相同的值适用于\
  \ `host1.example.com` 和 `host2.example.com`。\n\n* `inventory_host_dir`\n\n```\n\
  1 [servers]\n2 host1.example.com\n```\n\n* `host_vars/demo1.example.com`\n\n```\n\
  1 ansible_user=devops\n```\n\n* `inventory_group_dir`\n\n```\n1 [servers]\n2 host1.example.com\n\
  3 host2.example.com\n```\n\n* `group_vars/servers`\n\n```\n1 user=alice\n```\n\n\
  你也可以使用目录来填充主机和组变量以达到相同的结果。正如你所看到的，结果与之前的幻灯片相同，但使用了更多的文件。在左列中，你可以看到一个主机变量的示例。变量 `ansible_user`\
  \ 被赋值为值 `devops`。该主机变量适用于 `host1.example.com`。在右列中，你看到一个组变量的示例。变量 `user` 被赋值为 `alice`。该组变量将以相同的值适用于\
  \ `host1.example.com` 和 `host2.example.com`。\n\n### 数组变量\n\n* `array.yml`\n\n```\n\
  \ 1 ---\n 2 - name: Array sample\n 3   hosts: all\n 4   vars:\n 5     users:\n 6\
  \       alice:\n 7         firstname: Alice\n 8         homedir: /users/alice\n\
  \ 9       bob:\n10         firstname: Bob\n11         homedir: /users/bob\n```\n\
  \n```\n1 file name: array.yml\n2 用户被组织在层级数据结构中。\n3 \n4 Returns 'Alice'\n5 users.alice.firstname\n\
  6 Returns 'Alice'\n7 users['alice']['firstname']\n```\n\n数组是一种非常有用的数据结构。你可以在层级数据结构中组织信息。在示例中，用户列表\
  \ alice 和 bob 易于读的：每个元素都有一些属性：`firstname` 和 `homedir`。你可以使用点符号或方括号来访问数据。\n\n###\
  \ array.yml - 执行\n\n```\n 1 $ ansible-playbook -i inventory array.yml\n 2 PLAY [Array\
  \ sample] *********************************\n 3 *************************************************\n\
  \ 4 *****\n 5 TASK [Gathering Facts] *********************************\n 6 *************************************************\n\
  \ 7 *****\n 8 ok: [host1.example.com]\n 9 TASK [Print the value of variable banana]\
  \ ************\n10 *************************************************\n 11 ok: [host1.example.com]\
  \ => {\n12     \"msg\": \"Print the value of variable banana: Alice\"\n13 }\n14\
  \ PLAY RECAP *********************************************\n15 *************************************************\n\
  16 host1.example.com          : ok=2    changed=0    unreachable\n17 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n```\n`array.yml` 的执行输出与之前的一个非常相似。请注意，通过将字符串与变量值结合，获得了消息“Print\
  \ the value of variable banana”的打印。\n\n### 注册变量\n\n* `registered.yml`\n\n```\n1\
  \ ---\n2 - name: Installs a package and prints result\n3   hosts: all\n4   become:\
  \ true\n5   tasks:\n6     - name: Install the package\n7       ansible.builtin.yum:\n\
  8         name: wget\n9         state: installed\n10      register: install_result\n\
  11 \n12     - name: debug\n13       ansible.builtin.debug:\n14         var: install_result\n\
  ```\n\n```\n1 file name: registered.yml\n2 \n3 将标准输出存储在变量 install_result 中\n4 也可以被打印\n\
  ```\n\n另一个非常有用的数据结构是注册变量。你可以将任何命令的输出保存到注册变量中。在本示例中，将被打印出来。\n\n### registered.yml\
  \ - 执行\n\n```\n 1 $ ansible-playbook -i inventory registered.yml\n 2 PLAY [Installs\
  \ a package and prints result] **********\n 3 *************************************************\n\
  \ 4 *****\n 5 TASK [Gathering Facts] *********************************\n 6 *************************************************\n\
  \ 7 *****\n 8 ok: [host1.example.com]\n 9 TASK [Install the package] *****************************\n\
  10 *************************************************\n 11 ok: [host1.example.com]\n\
  \ 12 TASK [debug] *********************************\n 13 *************************************************\n\
  \ 14 ok: [host1.example.com] => {\n 15     \"install_result\": {\n 16         \"\
  changed\": false,\n 17         \"failed\": false,\n 18         \"msg\": \"Nothing\
  \ to do\",\n 19         \"rc\": 0,\n 20         \"results\": []\n 21     }\n 22\
  \ }\n 23 PLAY RECAP *********************************************\n24 *************************************************\n\
  25 host1.example.com          : ok=3    changed=0    unreachable\n26 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0\n```\n`registered.yml` 的执行输出符合预期。首先， yum\
  \ 模块检查软件包是否存在，如果缺失则继续安装。设置过程的输出存储在注册变量中并打印在屏幕上。\n\n### 总结\n\n在本模块中，我们探索了 Ansible\
  \ Playbook 内部变量的使用。你现在了解了用户定义、主机、组和注册变量等工具的使用。\n\n## Facts 和魔法变量\n\n在本章中，我将向你解释什么是\
  \ Ansible Facts（事实）和魔法变量，你为什么需要它们、不同的类型以及如何在你的日常工作中编辑和使用它们。\n\n### Ansible Facts\n\
  \n```\n1 facts 是与远程主机相关的变量。\n```\n\n#### 列出所有机器的所有 facts (ad-hoc)\n\n\n\n\n\n```\n\
  \ 1 $ ansible -m setup hostname\n 2     \"ansible_all_ipv4_addresses\": [\n 3  \
  \       \"REDACTED IP ADDRESS\"\n 4     ],\n 5     \"ansible_all_ipv6_addresses\"\
  : [\n 6         \"REDACTED IPV6 ADDRESS\"\n 7     ],\n 8     \"ansible_apparmor\"\
  : {\n 9         \"status\": \"disabled\"\n10     },\n 11     \"ansible_architecture\"\
  : \"x86_64\",\n 12     \"ansible_bios_date\": \"11/28/2013\",\n 13     \"ansible_bios_version\"\
  : \"4.1.5\",\n 14     \"ansible_cmdline\": {\n 15         \"BOOT_IMAGE\": \"/boot/vmlinuz-3.10.0-862.14.4.el7.\\\
  \n16 x86_64\",\n 17         \"console\": \"ttyS0,115200\",\n 18         \"no_timer_check\"\
  : true,\n 19         \"nofb\": true,\n 20         \"nomodeset\": true,\n 21    \
  \     \"ro\": true,\n 22         \"root\": \"LABEL=cloudimg-rootfs\",\n 23     \
  \    \"vga\": \"normal\"\n 24     \"ansible_date_time\": {\n 25         \"date\"\
  : \"2018-10-25\",\n 26         \"day\": \"25\",\n 27         \"epoch\": \"1540469324\"\
  ,\n 28         \"hour\": \"12\",\n 29         \"iso8601\": \"2018-10-25T12:08:44Z\"\
  ,\n 30         \"iso8601_basic\": \"20181025T120844109754\",\n 31         \"iso8601_basic_short\"\
  : \"20181025T120844\",\n 32         \"iso8601_micro\": \"2018-10-25T12:08:44.109968Z\"\
  ,\n 33         \"minute\": \"08\",\n 34         \"month\": \"10\",\n 35        \
  \ \"second\": \"44\",\n 36         \"time\": \"12:08:44\",\n 37         \"tz\":\
  \ \"UTC\",\n 38         \"tz_offset\": \"+0000\",\n 39         \"weekday\": \"Thursday\"\
  ,\n 40         \"weekday_number\": \"4\",\n 41         \"”weeknumber\": \"43\",\n\
  \ 42         \"year\": \"2018\"\n 43     },\n 44     \"ansible_default_ipv4\": {\n\
  \ 45         \"address\": \"REDACTED\",\n 46         \"alias\": \"eth0\",\n 47 \
  \    [...]\n```\n\n理解 Ansible 事实（facts）的最佳方法是使用这个简单的即时命令（ad-hoc command）自行列出它们。你将从主机获取的信息量之大让你感到惊讶。例如，当前的硬件配置：架构、处理器、内存、可用内存、存储配置等。还有关于软件配置的更多信息：操作系统、所使用的发行版、IP\
  \ 地址、网络配置、存储配置等。\n\n### 列出机器 playbook 中的所有事实\n\n`facts_printall.yml`\n\n```\n1 ---\n\
  2 - name: facts_printall\n3   hosts: all\n4   tasks:\n5   - name: Print all facts\n\
  6     ansible.builtin.debug:\n7       var: ansible_facts\n```\n\n你也可以从 Ansible playbook\
  \ 获取相同数量的数据。在这个简单的示例中，你将列出清单文件中所有主机的 Ansible 事实。预期结果将与之前的即时执行结果相同。\n\n### facts_printall.yml\
  \ - 执行\n\n```\n 1 ansible-playbook -i inventory facts_printall.yml\n 2 PLAY [facts_printall]\
  \ ***********************************\\\n 3 *********************************************************\\\
  \n 4 *******\n 5 TASK [Gathering Facts] **********************************\\\n 6\
  \ *********************************************************\\\n 7 ********\n 8 ok:\
  \ [host1.example.com]\n 9 TASK [Print all facts] **********************************\\\
  \n10 *********************************************************\\\n 11 ********\n\
  \ 12 ok: [host1.example.com] => {\n 13     \"ansible_facts\": {\n 14         \"\
  architecture\": \"x86_64\",\n 15         \"bios_date\": \"10/12/2020\",\n 16   \
  \      \"bios_version\": \"N22ET66W (1.43 )\",\n 17         \"br_4332d8483447\"\
  : {\n 18             \"active\": false,\n 19             \"device\": \"br-4332d8483447\"\
  ,\n 20             \"features\": {\n 21                 \"esp_hw_offload\": \"off\
  \ [fixed]\",\n 22                 \"esp_tx_csum_hw_offload\": \"off [fixed]\",\n\
  \ 23                 \"fcoe_mtu\": \"off [fixed]\",\n```\n\n这是执行 `facts_printall.yml`\
  \ 的输出。在此执行过程中，该 play 针对 `host1.example.com` 节点运行。输出非常长，包含。\n\n\n\n\n\n要加密一个已存在的文件，请使用\
  \ `ansible-vault encrypt filename` 命令。`--output` 选项可以将加密后的文件保存为新名称。如果省略此选项，原始文件将被加密后的文件覆盖。\n\
  \n### 解密现有文件\n\n```\n1 $ ansible-vault decrypt vault1.yml --output=decrypted.yml\n\
  2 Vault password: password\n3 Decryption successful\n```\n\n可以使用 `ansible-vault\
  \ decrypt filename` 命令对现有的加密文件进行永久解密。在解密单个文件时，可以使用 `--output` 选项将解密后的文件保存为不同的名称。\n\
  \n### 修改加密文件的密码\n\n```\n1 $ ansible-vault rekey secret.yml\n2 Vault password: password1\n\
  3 New Vault password: password\n4 Confirm New Vault password: password\n5 Rekey\
  \ successful\n```\n\n你可以使用 `ansible-vault rekey filename` 命令更改加密文件的密码。该命令可以一次性更改多个数据文件的密钥。它会提示输入原始密码，然后是新密码。\n\
  \n### Playbooks 和 Ansible Vault\n\n```\n 1 $ ansible-playbook playbook.yml\n 2 TASK\
  \ [include_vars] *************************************\\\n 3 *********************************fatal:\
  \ [localhost]: FAIL\\\n 4 ED! => {\"ansible_facts\": {}, \"ansible_included_var_files\"\
  \\\n 5 : [], \"changed\": false, \"message\": \"Attempting to decrypt\\\n 6  but\
  \ no vault secrets found\"}\n 7 \n 8 $ ansible-playbook --vault-id @prompt playbook.yml\n\
  \ 9 Vault password (default): password\n10 \n11 $ ansible-playbook --vault-password-file=vault-password.t\\\
  \n12 xt playbook.yml\n```\n\n要运行访问使用 Ansible Vault 加密文件的 playbook，你需要为 `ansible-playbook`\
  \ 命令提供加密密码。如果不提供密码，playbook 将返回错误。要为 playbook 提供 vault 密码，请使用 `--vault-id` 选项。例如，要以交互方式提供\
  \ vault 密码，请如所示使用 `--vault-id @prompt`。或者，你也可以使用密码文件。\n\n### 总结\n\n在本模块中，我们探索了 Ansible\
  \ Vault 安全存储，用于在 Ansible 内部保存密钥和机密信息。正如我们所看到的，这些工具是强大的，并且完全集成在 Ansible 技术之中。\n\n\
  ## 条件判断\n\n在本模块中，我将向你解释什么是 Ansible 条件操作，以及你如何每天在你的 Ansible Playbook 中使用它们。\n\n```\n\
  1 条件语句检查一个条件并据此改变程序的\\\n2 behavior（行为）\n```\n\n让我们开始吧！为了编写实用的代码，我们几乎需要检查条件并相应改变程序行为的能力。条件语句赋予了我们这种能力。Ansible\
  \ 的形式是“when”语句。Ansible 在条件判断中使用 Jinja2 测试（tests）和过滤器（filters）。Ansible 支持所有的标准测试和过滤器，并添加了一些。\n\
  \n### 使用“when”的基本条件\n\n`conditional_basic_false.yml`\n\n```\n 1 ---\n 2 - name:\
  \ conditional_basic\n 3   hosts: all\n 4   vars:\n 5     configure_nginx: false\n\
  \ 6   tasks:\n 7     - name: reload nginx\n 8       ansible.builtin.service:\n 9\
  \         name: nginx\n10         state: reloaded\n11       when: configure_nginx\n\
  ```\n\n这是在 Ansible playbook 中使用“when”语句的基本用法示例。任务“reload nginx”只有在 `configure_nginx`\
  \ 布尔变量被设置为“true”时才会执行。在这个示例中，它并非如此，因此我们预计该任务将被跳过。让我们看看执行代码的输出。\n\n执行：\n\n```\n 1\
  \ $ ansible-playbook -i inventory conditional_basic_false.y\\\n 2 ml\n 3 PLAY [conditional_basic]\
  \ ********************************\\\n 4 *********************************************************\\\
  \n 5 **********\n 6 TASK [Gathering Facts] **********************************\\\n\
  \ 7 *********************************************************\\\n 8 ********\n 9\
  \ ok: [host1.example.com]\n10 TASK [reload nginx] *************************************\\\
  \n11 *********************************************************\\\n12 *****\n13 skipping:\
  \ [host1.example.com]\n14 PLAY RECAP **********************************************\\\
  \n15 *****************************************************\n16 host1.example.com\
  \       : ok=1    changed=0    unreachabl\\\n17 e=0    failed=0    skipped=1   \
  \ rescued=0    ignored=0 \n```\n\n这是执行 `conditional_basic_false.yml` 的输出。在此执行中，play\
  \ 针对“host1.example.com”节点执行。输出用绿色和蓝色高亮。如你所见，“reload nginx”任务被 Ansible 读取，但根据我们的条件语句被跳过了。\n\
  \n`conditional_basic_true.yml`\n\n```\n 1 ---\n 2 - name: conditional_basic\n 3\
  \   hosts: all\n 4   vars:\n 5     configure_nginx: true\n 6   tasks:\n 7     -\
  \ name: reload nginx\n 8       ansible.builtin.service:\n 9         name: nginx\n\
  10         state: reloaded\n11       when: configure_nginx\n```\n\n这是在你的 Ansible\
  \ playbook 中使用“when”语句的相同基本示例，但我们将变量值从“false”更改为了“true”。现在“reload nginx”任务将执行执行，因为\
  \ `configure_nginx` 布尔变量被设置为“true”。让我们看看这段代码的输出。\n\n执行：\n\n```\n 1 $ ansible-playbook\
  \ --vault-id @prompt playbook.yml\n 2 PLAY [conditional_basic] *********************************\\\
  \n 3 *********************************************************\\\n 4 **********\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 *********************************************************\\\
  \n 7 ********\n 8 ok: [host1.example.com]\n 9 TASK [reload nginx] *************************************\\\
  \n10 *********************************************************\\\n11 *****\n12 ok:\
  \ [host1.example.com]\n13 PLAY RECAP **********************************************\\\
  \n14 *****************************************************\n15 host1.example.com\
  \       : ok=2    changed=0    unreachable\\\n16 e=0    failed=0    skipped=0  \
  \  rescued=0 \n```\n\n这是执行 `conditional_basic_true.yml` 的输出。在此执行中，play 针对“host1.example.com”节点执行。输出用绿色高亮。如你所见，“reload\
  \ nginx”任务被 Ansible 读取并在我们的条件语句中成功执行。\n\n### 基于 ansible_facts 的条件判断\n\n`conditional_facts.yml`\n\
  \n```\n1 ---\n2 - name: conditional_facts\n3   hosts: all\n4   tasks:\n5   - name:\
  \ Shut down Debian-like systems\n6     ansible.builtin.command: /sbin/shutdown -t\
  \ now\n7     when: ansible_facts['os_family'] == \"Debian\"\n```\n\n将条件判断和事实结合非常有用。因此你可以根据单个主机的条件、IP\
  \ 地址、操作系统、文件系统状态等来调整你代码的执行。在这个示例中，如果目标系统是 Debian 系（即 Debian 和 Ubuntu 管理的主机），我们将执行关机。\n\
  \n执行：\n\n```\n 1 $ ansible-playbook -i inventory conditional_facts.yml\n 2 PLAY\
  \ [conditional_facts] ********************************\\\n 3 *********************************************************\\\
  \n 4 **********\n 5 TASK [Gathering Facts] **********************************\\\n\
  \ 6 *********************************************************\\\n 7 ********\n 8\
  \ ok: [host1.example.com]\n 9 TASK [Shut down Debian-like systems] ********************\\\
  \n10 *********************************************************\\\n11 **********************\n\
  12 skipping: [host1.example.com]\n13 PLAY RECAP **********************************************\\\
  \n14 *****************************************************\n15 host1.example.com\
  \                  : ok=1    changed=0   \\\n16 unreachable=0    failed=0    skipped=1\
  \    rescued=0    i\\\n17 gnored=0 \n```\n\n\n\n\n\n这是执行 `conditional_facts.yml`\
  \ 的输出。在本次执行中，剧本（play）针对 `host1.example.com` 节点执行。目标主机不是 Debian 类系统，因为你可以注意到名为 `Shut\
  \ down Debian-like systems` 的任务状态为 `skipped`（跳过）。\n\n### 总结\n\n条件语句非常重要，因为它们允许我们创建响应某些事件、条件或\
  \ Ansible Facts 的 Ansible Playbook。这些语句是智能 Ansible Playbook 的基础。\n\n## 循环 (Loop)\n\
  \n在本章中，我将为你解释什么是 Ansible 循环操作，以及你如何在 Ansible Playbook 中每天使用它们。\n\n```\n1 使用 Loop\
  \ 自动化重复任务\n```\n\n计算机在自动化重复任务方面非常出色。在不产生错误的情况下重复相同或相似的任务是计算机擅长而人类不擅长的事情。\n\n重复执行一组语句被称为迭代。Ansible\
  \ 有几条用于迭代的语句——`loop` 语句和 `with_items` 语句。`with` 语句依赖于插件。\n\n* `loop_simple.yml`\n\
  \n```\n 1 ---\n 2 - name: Check services\n 3   hosts: all\n 4   tasks:\n 5   - name:\
  \ httpd and mariadb are running\n 6     ansible.builtin.service:\n 7       name:\
  \ \"{{ item }}\"\n 8       state: started\n 9     loop:\n10       - httpd\n11  \
  \     - mariadb\n```\n\n简单的循环对列表中的每个项进行任务迭代。`loop` 语句被添加到任务中，并以任务应迭代的项列表作为值。循环变量\
  \ `item` 在每次迭代期间迭代迭代当前值。\n\n* `loop_hash_or_dict.yml`\n\n```\n 1 ---\n 2 - name:\
  \ Users exist and are in the correct groups\n 3   hosts: all\n 4   tasks:\n 5  \
  \ - name: Users exist and are in the correct groups\n 6     ansible.builtin.user:\n\
  \ 7       name: \"{{ item.name }}\"\n 8       state: present\n 9       groups: \"\
  {{ item.group }}\"\n10     loop:\n11       - name: alice\n12         group: wheel\n\
  13       - name: bob\n14         group: root\n```\n\n循环列表不需要是简单值的列表。在下面的示例中，列表中的每个项实际上是一个哈希（hash）或字典。示例中的每个哈希或字典都有两个键，`name`\
  \ 和 `groups`，当前项循环变量中每个键的值可以通过 `item.name` 和 `item.group` 变量分别检索。\n\n### with_*\
  \ 语句\n\n* `with_items`\n类似于用于简单列表的 `loop`，适用于字符串列表或哈希/字典列表。如果提供了列表的列表，则将其扁平化为列表。\n\
  \n* `with_file`\n此关键字需要一组控制节点的文件名。循环变量 `item` 持有文件的内容。\n\n* `with_sequence`\n需要参数根据数值序列生成值列表。\n\
  \n### loop_with_items.yml\n\n```\n 1 ---\n 2 - name: Example with_items\n 3   hosts:\
  \ all\n 4   vars:\n 5     data:\n 6       - alice\n 7       - bob\n 8   tasks:\n\
  9   - name: Print values of data\n10     ansible.builtin.debug:\n11       msg: \"\
  {{ item }}\"\n12     with_items: \"{{ data }}\"\n```\n\n在 `loop_with_items.yml`\
  \ 剧本中，变量 `data` 是一个字符串列表。任务 `Print values of data` 使用 `with_items` 逐项迭代并打印到屏幕。\n\
  \n### 总结\n\n循环语句对于自动化重复任务非常有用。循环是成功的 Ansible Playbook 的基础。\n\n## 处理器 (Handler)\n\
  \n在本章中，我将为你解释什么是 Ansible Handler 语句，以及你如何在 Ansible Playbook 中每天使用它们。\n\n```\n1 Handler\
  \ 在更改时运行操作\n```\n\nHandler 对于幂等性（idempotency）非常重要。它们允许仅在需要时执行某些步骤，并在不需要执行时节省计算机周期。\n\
  \n### rollingupdate.yml\n\n```\n 1 ---\n 2 - name: Rolling update\n 3   hosts: all\n\
  \ 4   become: true\n 5   tasks:\n 6     - name: latest apache httpd package is installed\n\
  \ 7       ansible.builtin.yum:\n 8         name: httpd\n 9         state: latest\n\
  10       notify: restart apache\n 11 \n12   handlers:\n13     - name: restart apache\n\
  14       ansible.builtin.service:\n15         name: httpd\n16         state: restarted\n\
  ```\n\n`rollingupdate.yml` 由一个任务和一个 handler 组成。handler 代码仅在需要时执行。请注意，`notify` 语句提到了要运行的\
  \ handler 名称。此剧本检查所有主机上的 apache http Web 服务器版本，如果有可用更新，`yum` 模块将提供升级过程并在最后重启守护进程。如果不需要升级，则不需要\
  \ handler 代码。\n\n一个更复杂的剧本可以有多个 handler，你可以通过名称进行引用。\n\n## 角色 (Role)\n\n在本章中，我将为你解释\
  \ Ansible role 是关于代码复用的什么，以及你如何在你的 Ansible Playbook 中每天使用它们。\n\n```\n1 Role 启用 Ansible\
  \ 的代码复用\n```\n\nRoles 就像传统编程世界中的函数。使用 Ansible roles 可以更快速地开发 playbooks 并复用代码。\n\n\
  ### Role 目录结构\n\n```\n 1 tree\n 2 user.example/\n 3 ├── defaults\n 4 ├── files\n\
  \ 5 ├── handlers\n 6 ├── meta\n 7 ├── README.md\n 8 ├── tasks\n 9 ├── templates\n\
  10 └── tests\n11 └── vars\n```\n\n目录描述：\n\n* `defaults`: `main.yml` 包含角色的默认变量值，在使用角色时可以被覆盖。\n\
  * `files`: 此目录包含由任务引用的静态文件。\n* `handlers`: `main.yml` 包含角色的 handler 定义。\n* `meta`:\
  \ `main.yml` 文件包含关于角色的信息，如作者、许可证、平台和可选依赖项。\n* `tasks`: `main.yml` 文件包含角色的任务定义（这是角色定义其主要执行逻辑的地方）。\n\
  * `templates`: 此目录包含 Jinja2 模板。\n* `tests`: 此目录可以包含用于测试角色的清单和 `test.yml` 剧本。\n*\
  \ `vars`: `main.yml` 文件定义角色的变量。通常用于角色内部。这些变量优先级较高，不建议在剧本中更改。\n\n并不是每个角色都会拥有所有这些目录。\n\
  \n### 在剧本中使用 Ansible roles\n\n* `role_simple.yml`\n```\n1 ---\n2 - name: role example\n\
  3   hosts: all\n4   roles:\n5     - role1\n6     - role2\n```\n```\n1 文件名: role_simple.yml\n\
  2 将 `role1` 和 `role2` 应用到 `all` 主\n```\n\n* `role_vars.yml`\n```\n1 ---\n2 - name:\
  \ role example\n3   hosts: all\n4   roles:\n5   - role: role1\n6   - role: role2\n\
  7     var1: value\n8     var2: value\n```\n```\n1 文件名: role_vars.yml\n2 将 `role1`\
  \ 和 `role2` 应用到 `all` 主\n3\n4 `Role2` 有两个变量参数\n```\n\n### 执行顺序\n\n* `role_vars.yml`\n\
  ```\n 1 ---\n 2 - name: order of execution example\n 3   hosts: all\n 4   pre_tasks:\n\
  \ 5     - debug:\n 6         msg: 'pre-task'\n 7       notify: my handler\n 8  \
  \ roles:\n 9     - role1\n10   tasks:\n11     - debug:\n12         msg: 'first task'\n\
  13       notify: my handler\n14   post_tasks:\n15     - debug:\n16         msg:\
  \ 'post-task'\n17       notify: my handler\n18   handlers:\n19     - name: my handler\n\
  20       debug:\n21         msg: Running my handler\n```\n\n对于剧本中的每个 play，任务按照任务列表中的顺序执行。在所有任务执行完毕后，任何被通知的\
  \ handler 都会被执行。\n\n当将 role 添加到 play 时，role 任务会被添加到任务列表的开头。如果在 play 中包含了第二个 role，其任务列表将添加到第一个角色之后。\n\
  \n\n\n\n\n角色处理器（handlers）添加到 play（plays）的方式与角色任务（role tasks）添加到 play 的方式相同。每个 play\
  \ 都定义了一个 handlers 列表。角色处理器首先添加到 handlers 列表，随后是 play 中 `handlers` 部分定义的任何处理器。在某些场景下，可能必要在执行角色之前执行某些\
  \ play 任务。为了支持此类场景，可以为 play 配置一个 `pre_tasks` 部分。此部分列出的任何任务都会在任何角色执行之前执行。如果这些任务中的任何一个任务通知了处理器，则这些处理器任务将在角色或普通任务之前执行。\n\
  \nplay 同时也支持 `post_tasks` 关键字。这些任务在 play 的普通任务之后执行，并且它们通知的任何处理器都将运行。\n\n## Ansible\
  \ Galaxy\n\n* [`galaxy.ansible.com/`](https://galaxy.ansible.com/)\n\n### 手动从 Ansible\
  \ Galaxy 安装角色\n\n```\n1 $ ansible-galaxy install geerlingguy.redis -p roles/\n```\n\
  \n### 通过 Ansible Galaxy requirements.yml 从 Ansible Galaxy 安装角色\n\n* `./requirements.yml`\n\
  \n```\n1 - src: geerlingguy.redis\n2   version: \"1.5.0\"\n```\n\n```\n1 $ ansible-galaxy\
  \ install -r roles/requirements.yml -p ro\\\n2 les\n```\n\n## Ansible 最佳实践\n\n遵循\
  \ Ansible 最佳实践可以让你你的代码成功执行，简化故障排除过程，并对你的自动化之旅产生积极影响。\n\n### 使用空格\n\n在你的 YAML 代码中使用空格而不是制表符（tabs）。在每个块或任务之前添加新行可以让\
  \ playbook 变得易于阅读。\n\n例如：\n\n* 错误\n\n```\n1 ---\n2 - hosts: all\n3   tasks:\n4 \
  \  - ansible.builtin.yum:\n5       name: httpd\n6       state: latest\n7   - name:\
  \ end message\n8     ansible.builtin.debug:\n9       msg: \"httpd succesfully installed\"\
  \n```\n\n* 正确\n\n```\n 1 ---\n 2 - hosts: all\n 3   tasks:\n 4   - ansible.builtin.yum:\n\
  \ 5       name: httpd\n 6       state: latest\n 7 \n 8   - name: end message\n 9\
  \     ansible.builtin.debug:\n10       msg: \"httpd succesfully installed\"\n```\n\
  \n### 为每个步骤分配“name”\n\n始终为你的代码中的每个 Ansible 语句（Ansible Plays、Tasks、Blocks）设置 `name`\
  \ 参数。\n\n例如：\n\n* 错误\n\n```\n1 ---\n2 - hosts: all\n3   tasks:\n4   - ansible.builtin.yum:\n\
  5       name: httpd\n6       state: latest\n```\n\n* 正确\n\n```\n1 ---\n2 - name:\
  \ install apache\n3   hosts: all\n4   tasks:\n5     - name: install apache packages\n\
  6       ansible.builtin.yum:\n7         name: httpd\n8         state: latest\n```\n\
  \n### 为变量使用人类可读且有意义的名称\n\n变量对于存储参数或保存上一个任务的结果非常重要。\n\n使用人类可读且有意义的名称可以增加你代码的复用性以及团队之间的可读性。\n\
  \n使用 `ansible-playbook` 命令的 `–extra-vars` 额外变量参数来在执行时覆盖变量也是很容易的。\n\n例如：\n\n* 错误\n\
  \n```\n1 httpkeepalive: 25\n2 webpo: 80\n3 aaaa: 8080\n```\n\n* 正确\n\n```\n1 apache_max_keepalive:\
  \ 25\n2 apache_port: 80\n3 tomcat_port: 8080\n```\n\n### 使用原生 YAML\n\n使用原生 YAML\
  \ 提高了代码的可读性，并允许你更快、更容易地发现错误。它还允许使用一些 YAML 检查器和解析器进行验证。\n\n例如：\n\n* 错误\n\n```\n1\
  \ - name: install apache\n2   ansible.builtin.yum:\n3     name: apache-{{ apache_version\
  \ }} state=present updat\\\n4 e_cache=yes disable_gpg_check=yes enablerepo=apache\n\
  5   notify: restart apache\n```\n\n* 正确\n\n```\n1 - name: install apache\n2   ansible.builtin.yum:\
  \ apache-{{ apache_version }}\n3     state: present\n4     update_cache: yes\n5\
  \     disable_gpg_check: yes\n6     enablerepo: apache\n7   notify: restart apache\n\
  ```\n\n### 使用原生模块代替运行命令\n\n始终优先使用原生模块代替命令模块。\n\n原生模块为幂等性而构建，并在执行前内部有业务逻辑验证参数。\n\n\
  命令模块（`command`、`shell`、`raw` 和 `script`）很好，但应作为最后手段。\n\n例如：\n\n* 错误\n\n```\n 1 -\
  \ name: Add repository into repo.d list\n 2   become: true\n 3   ansible.builtin.shell:\
  \ 'echo -e \"[google-chrome]\\nname=\\\n 4 google-chrome\\nbaseurl=http://dl.google.com/linux/chrome/\\\
  \n 5 rpm/stable/x86_64\\nenabled=1\\ngpgcheck=1\\ngpgkey=https://\n 6 dl.google.com/linux/linux_signing_key.pub\"\
  \ > /etc/yum.rep\\\n 7 os.d/google-chrome.repo'\n 8   args:\n 9     creates: /etc/yum.repos.d/google-chrome.repo\n\
  10   when: ansible_os_family == 'family'\n```\n\n* 正确\n\n```\n 1 - name: Add repository\
  \ into repo.d list\n 2   become: true\n 3   ansible.builtin.shell: 'echo -e \"[google-chrome]\\\
  nname=\\\n 4 google-chrome\\nbaseurl=http://dl.google.com/linux/chrome/\\\n 5 rpm/stable/x86_64\\\
  nenabled=1\\ngpgcheck=1\\ngpgkey=https://\n 6 dl.google.com/linux/linux_signing_key.pub\"\
  \ > /etc/yum.rep\\\n 7 os.d/google-chrome.repo'\n 8   args:\n 9     creates: /etc/yum.repos.d/google-chrome.repo\n\
  ```\n\n### 配置调试消息\n\n在开发时，依赖 `debug` 来显示变量的内容非常有用的。\n\n然而，这可能会很烦。设置 `verbosity`\
  \ 参数为 `2` 允许你只在需要时看到消息。\n\n例如：\n\n* 错误\n\n```\n1 - name: message output\n2   ansible.builtin.debug:\n\
  3     msg: \"This text displays\"\n```\n\n* 正确\n\n```\n1 - name: message output\n\
  2   ansible.builtin.debug:\n3     msg: \"This text displays\"\n4     verbosity 2\n\
  ```\n\n### 以较低权限执行你的任务\n\n这是一条关于以较低权限执行任务的通用建议。\n\n在 Ansible 中，你可以在任务级别实现 `become:\
  \ true`，而不是对所有任务都使用 root 用户。\n\n例如：\n\n* 错误\n\n```\n1 ---\n2 - hosts: all\n3   tasks:\n\
  4   - ansible.builtin.yum:\n5       name: httpd\n6       state: latest\n7   become:\
  \ true\n```\n\n* 正确\n\n```\n1 ---\n2 - name: install apache\n3   hosts: all\n4 \
  \  tasks:\n5     - name: install apache packages\n6       ansible.builtin.yum:\n\
  7         name: httpd\n8         state: latest\n9       become: true\n```\n\n###\
  \ 使用版本控制\n\n使用源码管理（SCM）来跟踪代码库（如 GitHub、GitLab、BitBucket）的修改，如果你是一个团队，这是必须的，并且允许同事之间共享代码，并确保你的执行节点是最新的。\n\
  \n### 使用注释\n\n添加注释（以 `#` 开头的行），帮助他人（以及可能的未来的你）理解一个语句 play 或任务（或变量设置）做了什么、是如何做的以及为什么这样做。\n\
  \n# 安装 Ansible\n\n在本章中，你将发现如何在目前常见的操作系统上安装 Ansible。\n\n## Ansible 术语 - ansible vs\
  \ ansible-core 包\n\n什么是 ansible-core？什么是 ansible community 包？Ansible 项目在 2.9 版本之后发生了什么变化？目前\
  \ ansible community 和 ansible-core 包及其用例的概述。\n\n### 什么是 ansible-core？什么是 ansible\
  \ community 包？\n\nAnsible 项目在 2.9 版本之后发生了什么变化？\n\n今天我们将讨论自 2021 年以来发布的 ansible community\
  \ 和 ansible-core 包。\n\n\n\n\n从 2.10 版本开始，Ansible 提供了两种交付物：一个名为 `ansible` 的社区包，以及一个名为\
  \ `ansible-core` 的极简语言和运行时（在 2.10 版本中称为 `ansible-base`）。请根据您的需求选择合适的 Ansible 风格和版本。\n\
  \n`ansible` 包包含了 Ansible 语言、运行时，以及一系列社区策划的集合（Collections）。它重现并扩展了 Ansible 2.9 中包含的功能。\n\
  \n您可以选择以下任何方式来安装 Ansible 社区包：\n\n* 使用您的操作系统的包管理器安装最新发布版本（适用于 Red Hat Enterprise\
  \ Linux、CentOS、Fedora、Debian 或 Ubuntu）。\n* 使用 `pip`（Python 包管理器）安装。\n\n# Ansible\
  \ 社区包发布周期\n\nAnsible 社区团队通常每年发布两个版本的社区包，采用滞后于 `ansible-core` 发布的灵活周期。该周期可以延长，以便在发布新版本之前对重大的更改进行适当的实现和测试。请查看\
  \ Ansible 路线图（Road map）获取即将发布的发布详情。在主版本之间，Ansible 团队每三周发布一个新的 Ansible 社区包次要版本。次要版本包含新的向后兼容特性、模块和插件，以及错误修复。\n\
  \n从 2.10 版本开始，Ansible 社区团队保证同时维护一个主社区包发布版本。例如，当 Ansible 5.0.0 发布时，团队将停止发布新的 4.x\
  \ 版本。社区成员可以根据需要维护旧版本。\n\n## ansible community\n\n* 使用新版本命名（2.10，然后是 3.0.0）\n* 遵循语义化版本规则\n\
  * 不使用语义化版本\n* 同时仅维护一个版本\n* 包含语言、运行时和选定的 Collections\n* 在 Collection 仓库中开发和维护\n\n\
  ## ansible-core (曾为 ansible-base 2.10)\n\n* 继续“经典 Ansible”版本命名（2.11，然后是 2.12）\n\
  * 不使用语义化版本\n* 维护最新版本加上之前的两个旧版本\n* 包含语言、运行时和内置插件\n* 在 `ansible/ansible` 仓库中开发和维护\n\
  \n## ansible-core\n\n`ansible-core` 包主要用于只想安装所需集合的开发者和用户。\n\n### 什么是 ansible-core\
  \ 包？\n\nAnsible Core 是一个命令行工具，主要用于只想安装所需集合的开发者和用户。\n\n它包含极少量的模块和插件，并允许安装其他 Collections。它类似于\
  \ Ansible 2.9，但不再包含之后已移动到 Collection 中的内容。\n\nAnsible core 或 `ansible-core` 是 Ansible\
  \ 的主要构建模块和架构，包括：\n\n* CLI 工具，如 `ansible-playbook`、`ansible-doc.` 等，用于驱动和与自动化进行交互。\n\
  * Ansible 语言使用 YAML 创建一套用于开发 Ansible Playbooks 的规则，并包括条件判断、块、包含、循环和其他 Ansible 指令等函数。\n\
  * 一个允许通过 Ansible collections 进行扩展的架构框架。\n\n`ansible-core` 大约每年发布一次新的主版本。\n\n## ansible\
  \ community\n\nAnsible 社区包提供了 Ansible 2.9 的功能，包含 85+ 个集合，其中有数千个模块和插件。\n\n### 什么是\
  \ Ansible 社区包？\n\nAnsible 社区包的每个主版本都会接受每个包含的 Collection 的最新版本以及 `ansible-core` 的最新版本。\n\
  \nAnsible 社区包的主版本可能包含包含的 Collections 中模块和其他插件以及/或核心功能的破坏性更改。\n\nAnsible 包依赖于 `ansible-base`（很快变为\
  \ `ansible-core`）。因此当您执行 `pip install ansible` 时，`pip` 会自动安装 `ansible-core`。\n\n\
  Ansible 3.0.0 以后包含更多的 Collections，这得益于广泛的 Ansible 社区根据社区清单对 Collections 进行审核。\n\n\
  Ansible 社区团队通常每年发布两个版本的社区包，采用滞后于 `ansible-core` 发布的灵活周期。\n\n### 链接\n\n* [Ansible\
  \ 3.0.0 问答](https://www.ansible.com/blog/ansible-3.0.0-qa)\n* [发布与维护](https://docs.ansible.com/ansible/devel/reference_appendices/release_and_maintenance.html)\n\
  * [安装 Ansible](https://docs.ansible.com/ansible/latest/installation_guide/intro_installation.html)\n\
