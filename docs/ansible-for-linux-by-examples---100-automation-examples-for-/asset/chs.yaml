  18 changed: [demo.example.com]\n19 PLAY RECAP **********************************************\n\
  20 ******************************************\n21 demo.example.com           : ok=4\
  \    changed=3    reachable=0    failed=0    skipped=1    rescued=0    ignored=0\n\
  ```\n\n#### 执行前\n\n```\n 1 $ ssh devops@demo.example.com\n  2 [devops@demo ~]$ sudo\
