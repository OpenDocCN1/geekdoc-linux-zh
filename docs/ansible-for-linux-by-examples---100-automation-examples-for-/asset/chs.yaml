  \ OpenShift 4 集群（启动、停止、重启和状态查看）。\n\n 创建 Kubernetes K8s 或 OpenShift OCP 命名空间项目 -\
  \ Ansible 模块 k8s\n\n\n\n\n\n如何使用 Ansible 模块 `k8s` 自动化用于 Kubernetes K8s 或 OpenShift\
  \ OCP 的“myapp”命名空间项目。\n\n## Ansible 创建 Kubernetes 或 OpenShift 命名空间项目\n\n* `kubernetes.core.k8s`\n\
  * 管理 Kubernetes (K8s) 对象\n\n让我们聊 Ansible 模块 `k8s`。\n\n它的全称为 `kubernetes.core.k8s`，这意味着它是\
  \ Ansible 用于与 Kubernetes 和 Red Hat OpenShift 集群交互的模块集合的一部分。\n\n它管理 Kubernetes (K8s)\
  \ 对象。\n\n### 参数\n\n* `name` string / `namespace` string - 对象名称 / 命名空间\n* `api_version`\
  \ string - “v1”\n* `kind` string - 对象模型\n* `state` string - 存在(present)/不存在(absent)/补丁(patched)\n\
  * `definition` string - YAML 定义\n* `src` path - YAML 定义的路径\n* `template` raw - YAML\
  \ 模板定义\n* `validate` dictionary - 验证资源定义\n\n`k8s` 模块有一个很长的参数列表。让我总结一下最常用的。\n\n大多数参数都非常通用，允许你将它们组合用于许多用例。\n\
  \n`name` 和 `namespace` 指定对象名称和/或对象命名空间。它们用于在不提供完整资源定义的情况下创建、删除或发现对象。\n\n`api_version`\
  \ 参数指定 Kubernetes API 版本，版本 1 的默认值为 “v1”。\n\n`kind` 参数指定对象模型。\n\n`state` 参数与其他模块一样，决定是否应该创建对象\
  \ - `present` 选项、补丁 - `patched` 选项，或删除 - `absent` 选项。\n\n`definition` 参数允许你在创建或更新时时为对象提供一个有效的\
  \ YAML 定义（字符串、列表或字典）。\n\n如果你倾向于指定一个文件作为 YAML 定义，`src` 参数提供了指向文件的路径，该文件包含要创建或更新的对象或对象的有效\
  \ YAML 定义。\n\n你还可以使用 `template` 参数指定 YAML 定义模板。\n\n你可能还会发现 `validate` 参数很有用，可以用于定义如何根据\
  \ Kubernetes schema 验证资源定义。请注意，这需要 `kubernetes-validate` Python 模块。\n\n### 链接\n\n\
  * [kubernetes.core.k8s - Manage Kubernetes (K8s) objects - Ansible Documentation](https://docs.ansible.com/ansible/latest/collections/kubernetes/core/k8s_module.html)\n\
  \n### demo\n\n如何使用 Ansible Playbook 创建 Kubernetes 命名空间项目。\n\n此演示使用了 Red Hat CodeReady\
