  \n23 *********************************************************\\\n24 *************************\n\
  25 demo.example.com           : ok=1    changed=0    unreach\\\n26 able=0    failed=1\
  \    skipped=0    rescued=0    ignored=0\n```\n\n### 修复代码\n\n*   `template_error_string_fix.yml`\n\
  \n```yaml\n 1 ---\n 2 - name: file module demo\n 3   hosts: all\n 4   vars:\n 5\
