  ```\n\n 在类 Suse 系统中安装 Google Chrome - Ansible 模块 rpm_key, zypper_repo\n\n如何在类 Suse\
  \ 的工作站（SUSE Linux Enterprise Server 和 openSUSE）上安装最新的 Google Chrome 稳定版，使用公共 GPG\
  \ 密钥验证软件并设置 Google 仓库。\n\n### 使用 Ansible 在类 Suse 系统中安装 Google Chrome\n\n为了在类 Suse\
  \ 系统上安装 Google Chrome，我们需要执行三个不同的步骤。\n\n第一步是下载用于该仓库的 GPG 签名密钥。你将使用 `ansible.builtin.rpm_key`\
  \ Ansible 模块。此加密密钥可以验证软件包和仓库的真实性，并确保软件与 Google 发布的版本一致。\n\n第二步是向发行版中添加 Google Chrome\
  \ 仓库。这是 `zypper`（你的发行版包管理器）查找软件的额外网站。你将使用 `community.general.zypper_repository`\
  \ Ansible 模块。\n\n第三步是刷新 zypper 缓存以获取软件包，并使用 `community.general.zypper` Ansible 模块安装\
  \ Google Chrome。\n\n### 参数\n\n*   `rpm_key` 键字符串 - URL\n*   `rpm_key` 状态字符串 - present/absent\n\
  \n对于 `ansible.builtin.rpm_key` 模块，我将使用两个参数：`key` 和 `state`。`key` 参数指定仓库 GPG 签名密钥的\
  \ URL 或密钥 ID，`state` 验证执行后其是否存在于我们的系统中。\n\n*   `zypper_repository` 名称字符串\n*   `zypper_repository`\
  \ 描述字符串 - 仓库\n*   `zypper_repository` repo 字符串 - URL\n*   `zypper_repository` auto_import_keys\
  \ 布尔值 - GPG 签名\n\n对于 `community.general.zypper_repository` 模块，我将使用四个参数：`name`/`description`、`repo`\
  \ 和 `auto_import_keys`。`name` 和 `description` 参数指定 Suse 系统中的仓库名称及其 `repo` URL。`auto_import_keys`\
  \ 参数启用 GPG 验证并导入相应的密钥。\n\n*   `zypper` 名称字符串 - 名称或特定于包\n*   `zypper` 状态字符串 - latest/present/absent\n\
  *   `zypper` update_cache 布尔值 - no/yes\n\n对于 `community.general.zypper` 模块，我将使用三个参数：`name`、`state`\
  \ 和 `update_cache`。`name` 参数指定包名（在我们用例中为 Google Chrome），`state` 验证执行后其是否存在于我们的系统中。在安装包之前，`update_cache`\
  \ 会刷新 zypper 缓存，以确保下载最新版本的软件包。\n\n### 演示\n\n让我们进入真实的 Ansible Playbook，在类 Suse 系统中安装\
  \ Google Chrome。\n\n#### 代码\n\n`install_chrome_suse.yml`\n\n```\n 1 ---\n 2 - name:\
  \ install Google Chrome\n 3   hosts: all\n 4   become: true\n 5   tasks:\n 6   \
  \  - name: Add rpm signing key\n 7       ansible.builtin.rpm_key:\n 8         key:\
  \ https://dl.google.com/linux/linux_signing_ke\\\n 9  y.pub\n10         state: present\n\
  11 - name: Add repository into repo list\n12       community.general.zypper_repository:\n\
  13         name: google-chrome\n14         description: google-chrome repository\n\
  15         repo: http://dl.google.com/linux/chrome/rpm/stabl\\\n16         e/x86_64\n\
  17         auto_import_keys: true\n18         state: present\n19         runrefresh:\
  \ true\n20         enable: true\n21 - name: Install google-chrome-stable\n22   \
  \    community.general.zypper:\n23         name: \"google-chrome-stable\"\n24  \
  \       state: latest\n25         update_cache: true\n```\n\n#### 执行\n\n```\n 1\
