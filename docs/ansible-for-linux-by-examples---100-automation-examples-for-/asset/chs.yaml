  \ amd64\n38 docker-ce/focal:19.03.2-3-0~focal amd64\n39 docker-ce/focal:19.03.1-3-0~focal\
  \ amd64\n```\n\n\n\n\n\n对于 `ansible.builtin.rpm_key` Ansible 模块，我将使用两个参数：`key` 和\
  \ `state`。\n\n`key` 参数指定仓库 GPG 签名密钥的 URL 或密钥 ID，而 `state` 用于验证执行后该密钥是否存在于我们的系统中。\n\
  \n对于 `ansible.builtin.yum_repository` Ansible 模块，我将使用四个参数：`name`、`baseurl`、`gpgcheck`\
  \ 和 `gpgkey`。\n\n`name` 参数指定仓库参数以及其 `baseurl` URL。\n\n`gpgcheck` 参数根据 `gpgkey` 参数中指定的\
  \ URL 启用 GPG 验证。\n\n对于 `ansible.builtin.yum` Ansible 模块，我将使用三个参数：`name`、`state`\
  \ 和 `update_cache`。\n\n`name` 参数指定包名（在我们的用例中为 Docker），`state` 用于验证执行后该包是否存在于我们的系统中。\n\
  \n在安装包之前，`update_cache` 会执行 yum 缓存更新，以确保下载软件包的最新版本。\n\n### 链接\n\n- [`docs.docker.com/engine/install/`](https://docs.docker.com/engine/install/)\n\
  - [`github.com/docker/docker.github.io/issues/13463`](https://github.com/docker/docker.github.io/issues/13463)\n\
  \n### 演示\n\n使用 Ansible Playbook 在类 RedHat 系统中安装 Docker。\n\n#### 代码\n\n```\n 1 ---\n\
  \ 2 - name: install Docker\n 3   hosts: all\n 4   become: true\n 5   tasks:\n 6\
  \     - name: set mydistribution\n 7       ansible.builtin.set_fact:\n 8       \
  \  mydistribution: \"{{ 'rhel' if (ansible_distributi\\\n 9 on == 'Red Hat Enterprise\
  \ Linux') else (ansible_distribut\\\n10 ion | lower) }}\"\n11 \n12     - name: Add\
  \ signing key\n 13       ansible.builtin.rpm_key:\n 14         key: \"https://download.docker.com/linux/{{\
  \ mydist\\\n15 ribution }}/gpg\"\n 16         state: present\n 17 \n 18     - name:\
  \ Add repository into repo.d list\n 19       ansible.builtin.yum_repository:\n 20\
  \         name: docker\n 21         description: docker repository\n 22        \
  \ baseurl: \"https://download.docker.com/linux/{{ my\\\n23 distribution }}/$releasever/$basearch/stable\"\
  \n 24         enabled: true\n 25         gpgcheck: true\n 26         gpgkey: \"\
  https://download.docker.com/linux/{{ myd\\\n27 istribution }}/gpg\"\n 28 \n 29 \
  \    - name: Install Docker\n 30       ansible.builtin.yum:\n 31         name:\n\
  \ 32           - docker-ce\n 33           - docker-ce-cli\n 34           - containerd.io\n\
  \ 35         state: latest\n 36         update_cache: true\n 37 \n 38     - name:\
  \ Start Docker\n 39       ansible.builtin.service:\n 40         name: \"docker\"\
  \n 41         enabled: true\n 42         state: started\n```\n\n#### 执行\n\n```\n\
