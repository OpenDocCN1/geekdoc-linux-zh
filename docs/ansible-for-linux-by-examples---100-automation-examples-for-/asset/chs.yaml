  \ — Ansible log4j-cve-2021–44228\n\n使用 Ansible Playbook 自动化 Red Hat 提供的 RHSB-2021–009\
  \ Log4Shell 远程代码执行 log4j (CVE-2021–44228) 漏洞扫描器/检测器。包含依赖项安装、GPG 密钥验证、漏洞扫描器/检测器运行以及在目标\
  \ Linux 机器上的结果显示。\n\n### Log4Shell 远程代码执行 Log4j (CVE-2021–44228)\n\n还记得 2014 年吗？Heartbleed\
  \ 是 `OpenSSL` 中的一个漏洞，它是加密网站和软件时用于传输层安全 (TLS) 和安全套接层 (SSL) 协议的最流行的开源代码库。当时该漏洞允许读取机密信息，使黑客能够欺骗带有加密密钥的漏洞\
  \ Web 服务器。\n\n回到现在！\n\nLog4j - 被 Log4Shell 漏洞入侵的 Java 程序 - 是一个广泛使用的多平台开源 Java 日志框架库，由志愿者性质的\
  \ Apache 软件基金开发和维护。Log4j 广泛应用于服务器上，用于记录用户活动，以供安全或开发团队后续进行分析。\n\n黑客可以利用 Log4Shell\
  \ 漏洞访问各种设备上的敏感信息、植勒索软件攻击并接管机器来挖掘加密货币。该漏洞几乎是偶然发现的，当时微软宣布其在拥有的热门视频游戏《我的世界：Java 版》中发现了可疑活动。\n\
  \n该漏洞于 11 月 24 日由阿里巴巴云安全团队的赵兆磊正式发现。\n\n该漏洞几乎是偶然发现的，当时微软宣布其在拥有的热门视频游戏《我的世界：Java 版》中发现了可疑活动。\n\
  \n该漏洞于 11 月 24 日由阿里巴巴云安全团队的赵兆磊正式发现。\n\n该漏洞几乎是偶然发现的，当时微软宣布其在拥有的热门视频游戏《我的世界：Java 版》中发现了可疑活动。\n\
