  \ - Ansible 模块 docker_image 和 docker_container\n\n如何为类 Debian 系统自动化设置在 Docker 容器中运行\
  \ tag:latest 的分离式 Apache httpd Web 服务器，并将端口 8080 映射到 80，并自定义 web 根目录。\n\n### 在类\
  \ Debian 系统的 Docker 容器中部署 Apache Web 服务器\n\n*   安装软件包 ⇒ `ansible.builtin.apt`\n\
  *   docker py 模块 ⇒ `ansible.builtin.pip`\n*   拉取镜像 ⇒ `community.docker.docker_image`\n\
  *   文档根目录 ⇒ `ansible.builtin.file`\n*   自定义 index.html ⇒ `ansible.builtin.copy`\n\
  *   运行容器 ⇒ `community.docker.docker_container`\n\n让我们来讨论如何为类 Debian Linux 系统在 Docker\
  \ 容器中部署 apache httpd Web 服务器。\n\n整个过程需要六个步骤，你可以使用不同的 Ansible 模块来实现自动化。\n\n首先，你需要使用\
  \ `ansible.builtin.apt` Ansible 模块安装一些 Python 软件包和依赖项。\n\n其次，你需要使用 `ansible.builtin.pip`\
  \ Ansible 模块安装 Python 的 Docker 模块。\n\n第三，你需要使用 `community.docker.docker_image` Ansible\
  \ 模块拉取 docker hub 仓库的镜像。\n\n第四，你需要使用 `ansible.builtin.file` 模块创建具有正确权限的文档根目录。\n\n\
  第五，你需要使用 `ansible.builtin.copy` Ansible 模块创建自定义的 index.html。你可以使用 `template` 模块升级这一步。\n\
  \n最后，你可以使用 `community.docker.docker_container` Ansible 模块通过设置正确的端口和卷设置来运行 `webserver`\
  \ 容器。\n\n### 链接\n\n*   [docker hub 上的 httpd 镜像](https://hub.docker.com/_/httpd)\n\
  *   [community.docker.docker_image](https://docs.ansible.com/ansible/latest/collections/community/docker/docker_image_module.html)\n\
  *   [community.docker.docker_container](https://docs.ansible.com/ansible/latest/collections/community/docker/docker_container_module.html)\n\
  \n### 演示\n\n如何使用 Ansible Playbook 在类 Debian 系统的 Docker 容器中设置 Apache Web 服务器。\n\n\
  #### 代码\n\n```\n---\n- name: deploy httpd on container\n  hosts: all\n  become:\
  \ true\n  gather_facts: false\n  vars:\n    webroot: \"/webroot/\"\n  tasks:\n \
  \   - name: system packages present\n      ansible.builtin.apt:\n        name:\n\
  \          - python3-pip\n          - virtualenv\n          - python3-setuptools\n\
  \        state: latest\n        update_cache: true\n    - name: Docker Module for\
  \ Python\n      ansible.builtin.pip:\n        name: docker\n    - name: pull image\n\
  \      community.docker.docker_image:\n        name: httpd\n        source: pull\n\
  \        tag: latest\n    - name: webroot present\n      ansible.builtin.file:\n\
  \        path: \"{{ webroot }}\"\n        state: directory\n    - name: custom index.html\n\
  \      ansible.builtin.copy:\n        dest: \"{{ webroot}}index.html\"\n       \
  \ content: |\n          Custom Web Page\n    - name: run httpd container\n     \
  \ community.docker.docker_container:\n        name: webserver\n        image: httpd\n\
  \        state: started\n        detach: true\n        exposed_ports:\n        \
  \  - 80\n        ports:\n          - 8080:80\n        volumes: \"{{ webroot }}:/usr/local/apache2/htdocs/\"\
  \n```\n\n#### 执行\n\n```\nansible-pilot $ ansible-playbook -i virtualmachines/ubuntu/inventory\
  \ container/docker_httpd_debian.yml\nPLAY [deploy httpd on container] ************************\n\
  ******************************************\nTASK [system packages present] *************************\n\
  *****************************************\nchanged: [ubuntu.example.com]\nTASK [Docker\
  \ Module for Python] **************************\n*****************************************\n\
  changed: [ubuntu.example.com]\nTASK [pull image] *********************************\n\
  *****************************************\nchanged: [ubuntu.example.com]\nTASK [webroot\
  \ present] *********************************\n*****************************************\n\
  changed: [ubuntu.example.com]\nTASK [custom index.html] ****************************\n\
  *****************************************\nchanged: [ubuntu.example.com]\nTASK [run\
  \ httpd container] ****************************\n*****************************************\n\
  changed: [ubuntu.example.com]\nPLAY RECAP *************************************************\n\
  *****************************************\nubuntu.example.com : ok=6    changed=5\
  \    unreachable=0    failed=0    skipped=0    ignored=0\n```\n\n\n\n\n整个过程需要四个步骤，你可以通过不同的\
  \ Ansible 模块来实现这些自动化。\n\n首先，你需要使用 `ansible.builtin.yum` Ansible 模块验证目标系统是否成功安装了\
  \ `podman` 及其依赖项。\n\n其次，你需要使用 `ansible.builtin.copy` Ansible 模块创建自定义的 `index.html`。你可以使用\
  \ `template` 模块来升级此步骤。\n\n第三，你需要使用 `containers.podman.podman_image` Ansible 模块从容器枢纽拉取镜像。\n\
  \n最后，你可以使用 `containers.podman.podman_container` Ansible 模块设置正确的端口和配置，运行 `webserver`\
  \ 容器。\n\n### 链接\n\n- [containers.podman.podman_image](https://docs.ansible.com/ansible/latest/collections/containers/podman/podman_image_module.html)\n\
