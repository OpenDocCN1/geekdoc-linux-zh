  \n### 总结\n\n现在你已经了如何使用 Ansible 在类 RedHat 系统上部署 Apache `httpd` Web 服务器。\n\n## 在类\
  \ RedHat 系统上部署 squid 代理服务器 - Ansible 模块 yum, template, service 和 firewalld\n\n如何在类\
  \ RedHat 目标 Linux 系统上自动化配置 squid 代理服务器，包括安装软件包、设置配置文件、立即启动并开机启动服务，以及开放相关的防火墙端口。支持\
  \ RedHat Enterprise Linux, CentOS, CentOS Stream, Fedora, ClearOS, Oracle Linux,\
  \ EuroLinux, Fermi Linux, EulerOS, ROSA Linux, Springdale Linux, Asianux。\n\n###\
  \ 在类 RedHat 上部署 squid 代理\n\n* 安装软件包 ⇒ `ansible.builtin.yum`\n* 配置 ⇒ `ansible.builtin.template`\n\
  * 启动服务 ⇒ `ansible.builtin.service`\n* 防火墙 ⇒ `ansible.posix.firewalld`\n\n如何在类 RedHat\
  \ Linux 系统上部署 squid 代理？\n\n整个过程需要四个步骤，你可以通过不同的 Ansible 模块来实现自动化。\n\n首先，你需要使用 `ansible.builtin.yum`\
  \ 模块安装 `squid` 软件包及其依赖项。\n\n其次，你需要使用 `ansible.builtin.template` 模块创建自定义配置。\n\n然后，你需要使用\
  \ `ansible.builtin.service` 模块启动 `squid` 服务并设置开机自启以及所有依赖。\n\n最后，你需要使用 `ansible.posix.firewalld`\
  \ 模块开放相关的防火墙服务相关端口。\n\n### 示例\n\n使用 Ansible Playbook 在类 RedHat 上部署 squid 代理服务器。\n\
  \n#### 代码\n\n*   `proxy_redhat.yml`\n\n```\n 1 ---\n 2 - name: setup proxy\n 3 \
  \  hosts: all\n 4   become: true\n 5   vars:\n 6     squid_port: 3128\n 7     localnet:\
  \ \"192.168.0.0/24\"\n 8   tasks:\n 9     - name: squid installed\n10       ansible.builtin.yum:\n\
  11         name: squid\n12         state: latest\n13     - name: squid configuration\n\
  14       ansible.builtin.template:\n15         src: \"templates/squid.conf.j2\"\n\
  16         dest: \"/etc/squid/squid.conf\"\n17     - name: squid service enabled\n\
  18       ansible.builtin.service:\n19         name: squid\n20         enabled: true\n\
  21         state: started\n22     - name: open firewall\n23       ansible.posix.firewalld:\n\
  24         port: \"{{ squid_port }}\"\n25         state: enabled\n26         permanent:\
  \ true\n27 ```\n```\n\n*   `templates/squid.conf.j2`\n\n```\n 1 ---\n 2 - name:\
