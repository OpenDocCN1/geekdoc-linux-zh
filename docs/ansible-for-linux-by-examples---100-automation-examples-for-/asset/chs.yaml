  \ CentOS Stream, Fedora - 使用 Ansible 模块 yum, file, lineinfile, command, firewalld,\
  \ service\n\n如何使用 Ansible 通过六个任务自动完成 NFS 服务器的配置：在类 RedHat 的 Linux 目标系统中安装软件包、创建\
  \ NFS 共享目录、在配置中添加共享、导出共享、重启 NFS 服务并设置开机自启，以及开启防火墙服务端口。\n\n### 在类 RedHat 系统中导出 NFS\
  \ 共享\n\n*   安装软件包 ⇒ `ansible.builtin.yum`\n*   创建目录 ⇒ `ansible.builtin.file`\n*\
  \   在配置中共享 ⇒ `ansible.builtin.lineinfile`\n*   导出共享 ⇒ `ansible.builtin.command`\n\
  *   重启服务 ⇒ `ansible.builtin.service`\n*   开放防火墙 ⇒ `ansible.posix.firewalld`\n\n\
  我们来讨论如何在类 RedHat 的 Linux 系统中导出 NFS 共享。\n\n整个过程需要六个步骤，你可以使用六不同的 Ansible 模块来实现自动化。\n\
  \n首先，你需要使用 `ansible.builtin.yum` Ansible 模块安装 `nfs-utils` 软件包及其依赖项。\n\n其次，你需要使用\
  \ `ansible.builtin.file` Ansible 模块创建共享目录并分配权限。\n\n第三，你需要使用 `ansible.builtin.lineinfile`\
  \ Ansible 模块在 `/etc/exports` 文件中添加共享，该模块用于在文件中添加文本行。\n\n第四，你需要通过 `ansible.builtin.command`\
  \ Ansible 模块执行 `exportfs` 命令行工具来导出共享，遗憾的是目前还没有专门的模块。\n\n第五，你需要使用 `ansible.builtin.service`\
  \ Ansible 模块重启 `nfs-server` 服务及其所有依赖项。\n\n第六，你需要使用 `ansible.posix.firewalld` Ansible\
  \ 模块开放相关的防火墙服务端口。\n\n### 示例\n\n使用 Ansible Playbook 在类 RedHat 系统中导出 NFS 共享。\n\n####\
  \ 代码\n\n*   `nfs_server_redhat.yml`\n\n```yaml\n 1 ---\n 2 - name: nfs 服务演示\n 3\
  \   hosts: all\n 4   become: true\n 5   vars:\n 6     share: \"/nfs/share\"\n 7\
  \     options: \"192.168.0.0/24(rw,sync,root_squash)\"\n 8     permission: '0777'\n\
  \ 9   tasks:\n10     - name: NFS 服务器已安装\n11       ansible.builtin.yum:\n12     \
