  \ *********************************\\\n 4 *********************************************************\\\
  \n 5 *********************************************************\\\n 6 *************************\n\
  \ 7 TASK [Gathering Facts] **********************************\\\n 8 *********************************************************\\\
  \n 9 *********************************************************\\\n10 *************************\n\
  11 ok: [demo.example.com]\n12 TASK [Creating an empty file] ***************************\\\
  \n 13 *********************************************************\\\n14 *********************************************************\\\
  \n15 *************************\n16 fatal: [demo.example.com]: FAILED! => {\"msg\"\
  : \"An unhandl\\\n17 ed exception occurred while templating '{{ ~/example.txt \\\
