  \ 模块\n\n如何自动化 `httpd_use_nfs` SELinux 布值的启用并在重启后依然有效。\n\n### Ansible 在 Linux 上启用或禁用\
  \ SELinux\n\n*   `ansible.posix.seboolean`\n* 切换 SELinux 布值\n\n今天我们讨论 `seboolean`\
  \ 模块。它的全名是 `ansible.posix.seboolean`，这意味着它是与 POSIX 系统交互的模块集合的一部分。这是一个非常稳定且发布多年的模块，用于切换\
  \ SELinux 布值。它支持大量的 Linux 发行版和 POSIX 系统。它要求目标系统安装了 `python3-libsemanage` 或 `libsemanage-python`\
  \ 软件包。\n\n### 参数\n\n*   `name` 字符串：布值名称\n*   `state` 布尔值：no/yes\n*   `persistent`\
  \ 布尔值：no/yes\n*   `ignore_selinux_state` 布尔值：no/yes\n\n让我们 `seboolean` Ansible 模块的参数。强制参数是\
  \ `name` 和 `state`。`name` 参数指定我们要修改的 SELinux 布值的名称。`state` 参数允许在运行的系统中立即启用或禁用 SELinux\
  \ 布值。`persistent` 参数允许你指定状态更改是否应用到下次启动。特殊参数 `ignore_selinux_state` 对于无法获取当前 SELinux\
  \ 状态的场景（如 chroot 环境）有用。\n\n### 链接\n\n*   [apache_selinux 手页](https://linux.die.net/man/8/apache_selinux)\n\
  *   [CentOS SELlinux 布值](https://wiki.centos.org/TipsAndTricks/SelinuxBooleans)\n\
  *   [Gentoo SELlinux 布值](https://wiki.gentoo.org/wiki/SELinux/Tutorials/Using_SELinux_booleans)\n\
  \n\n\n\n\n- [RHEL8 - 使用 SELinux 布值调整共享 NFS 和 CIFS 卷的策略](https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html-single/using_selinux/index#adjusting-the-policy-for-sharing-nfs-and-cifs-volumes-using-selinux-booleans_configuring-selinux-for-applications-and-services-with-non-standard-configurations)\n\
  \n### demo\n\n如何使用 Ansible Playbook 在 Linux 上启用或禁用 SELinux 布尔值。\n\n#### code\n```yaml\n\
  \ 1 ---\n 2 - name: seboolean module demo\n 3   hosts: all\n 4   become: true\n\
  \ 5   vars:\n 6     selinux_boolean: \"httpd_use_nfs\"\n 7     selinux_value: true\n\
  \ 8   tasks:\n 9     - name: package present\n110       ansible.builtin.package:\n\
  \ 11         name: \"python3-libsemanage\"\n 12         state: present\n 13    -\
  \ name: set SELinux boolean\n 14       ansible.posix.seboolean:\n 15         name:\
  \ \"{{ selinux_boolean }}\"\n 16         state: \"{{ selinux_value }}\"\n 17   \
  \      persistent: true\n```\n\n### execution\n```bash\n 1 $ ansible-playbook -i\
  \ virtualmachines/demo/inventory seli\\\n 2 nux/selinux_boolean.yml\n 3 PLAY [seboolean\
  \ module demo] ****************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [package present] **********************************\\\
  \n 9 ******************************************\n10 changed: [demo.example.com]\n\
  11 TASK [set SELinux boolean] ******************************\\\n 12 ******************************************\n\
  13 changed: [demo.example.com]\n14 PLAY RECAP **********************************************\\\
  \n 15 ******************************************\n16 demo.example.com          \
  \ : ok=3    changed=2    unreach\\\n17 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n18 ansible-pilot $\n```\n\n#### idempotency\n```bash\n 1 $ ansible-playbook\
  \ -i virtualmachines/demo/inventory seli\\\n 2 nux/selinux_boolean.yml\n 3 PLAY\
  \ [seboolean module demo] ****************************\\\n 4 ******************************************\n\
  \ 5 TASK [Gathering Facts] **********************************\\\n 6 ******************************************\n\
  \ 7 ok: [demo.example.com]\n 8 TASK [package present] **********************************\\\
  \n 9 ******************************************\n10 ok: [demo.example.com]\n11 TASK\
  \ [set SELinux boolean] ******************************\\\n 12 ******************************************\n\
  13 ok: [demo.example.com]\n14 PLAY RECAP **********************************************\\\
  \n 15 ******************************************\n\n16 demo.example.com        \
  \   : ok=3    changed=0    unreach\\\n17 able=0    failed=0    skipped=0    rescued=0\
  \    ignored=0\n18 ansible-pilot $\n```\n\n#### before execution\n```bash\n 1 $\
  \ ssh devops@demo.example.com\n 2 [devops@demo ~]$ sudo su\n 3 [root@demo devops]#\
  \ sestatus\n 4 SELinux status:                 enabled\n 5 SELinuxfs mount:    \
