- pgno: 72
  md: 'After you have finished defining your partitions, you can quit fdisk and save
    the changes to the partition table by using the *w* command. If you decide you
    don''t want to make these changes, use the *q* command to quit fdisk without saving
    your changes.


    # Step 4: Assign Filesystem Names


    Next, you must associate the appropriate Linux filesystem names with each of the
    partitions you are going to use. This is done through the installation program
    for your specific distribution. Remember, you can install Linux with only the
    / and swap partitions.


    # The Linux Filesystem


    The Linux filesystem organizes files and directories into a hierarchical structure.
    A filesystem provides a way to store files that can be randomly accessed, including
    hard disk partitions, floppy disks, and CD-ROMS. Because tape drives are accessed
    sequentially, they do not contain a true filesystem. Some of the common filesystems,
    not all of which are Linux filesystems, are


    +   - Extended Filesystem—ext (Linux, has been replaced by ext2)

    +   - Fast Filesystem—ifs (Amiga)

    +   - HPFS Filesystem—hpfs (used with the OS/2 operating system; supported in
    real-mode only)

    +   - ISO9660 Filesystem—iso9660 (CD-ROM)

    +   - Linux Swap Filesystem—swap

    +   - Minix Filesystem—minix (Minix; this was the first filesystem used for Linux)

    +   - MS-DOS Filesystem—FAT16 msdos (DOS)

    +   - Network File System—nfs (Data is stored on any machine on a network and
    access is granted via the network)

    +   - Novell Filesystem—NCPFS (Novell servers)

    +   - NT Filesystem—NTFS (Windows NT)

    +   - proc Filesystem—proc (Virtual filesystem used by the Linux kernel to provide
    information to the user about processes)

    +   - Second Extended Filesystem—ext2 (Linux standard filesystem)

    +   - System V Filesystem—sysv (System V variants; commercial UNIX systems for
    PCs)

    +   - Uniform Filesystem—ufs (Used by BSD, SunOS, and NeXTstep; is supported in
    read-only mode)'
  merge: -1
  img_proc: true
- pgno: 73
  md: "+   ■ UMSDOS Filesystem—umsdos (UNIX on MS-DOS; applied on top of a FAT16 filesystem\
    \ to provide Linux functionality by creating special files; is slow)\n\n+   ■\
    \ Virtual FAT Filesystem—VFAT (an extension of the FAT filesystem to support long\
    \ filenames)\n\n+   ■ Xenix Filesystem—xenix\n\n+   ■ Xía Filesystem—xiás (An\
    \ old filesystem; hardly used anymore)\n\nWithin the Linux filesystem, the partition\
    \ or hard drive you are accessing is invisible. Instead, each partition or hard\
    \ drive is shown relative to the root of the filesystem. The root is represented\
    \ as /.\n\nIf you have the following partitions\n\n```\nhda1        /\n hda2 \
    \       swap\n hda3        /var\n hda4        /home\n```\n\nand issue an ls /\
    \ command, the directory listing will appear and the /var and /home filesystems\
    \ will show up as subdirectories residing with the / directory, even though they\
    \ are located on different partitions.\n\n# Formatting\n\nNow that you have created\
    \ your partitions, you must create a filesystem on each one before you can install\
    \ Linux. Creating a filesystem on your hard disk is similar to formatting a floppy.\
    \ You create a filesystem by using the mkfs command. Its syntax is\n\n```\nmkfs\
    \ -t fs-type device blocks\n```\n\nmkfs actually calls another command based on\
    \ the type of filesystem you specify with the -t fs-type option. The various mkfs\
    \ commands associated with specific filesystem types are shown in Table 3.3.\n\
    \n| **Table 3.3** | Commands Associated with Specific Filesystem Types Called\
    \ by the `mkfs` Utility |\n|:---|:---|\n| **Command** | **Filesystem Type** |\n\
    | `mkfs.ext2` | Create an ext2 filesystem; same as `mke2fs` |\n| `mkfs.msdos`\
    \ | Create an MS-DOS filesystem |\n| `mkfs.minix` | Create a Minix filesystem\
    \ |"
  merge: -1
  img_proc: true
- pgno: 74
  md: 'You can use any of these commands instead of using the mkfs utility as a front
    end.


    To create an ext2 filesystem on the first partition from the earlier example,
    you would issue the following command:


    ```

    mkfs -t ext2 /dev/hda1 3686759

    ```


    The notes you took while doing the partitioning are used here because you must
    provide the mkfs utility with the number of blocks on the partition you are formatting.
    If you did not note those numbers, you can rerun the fdisk command and display
    your partition table to find them.


    When creating a filesystem, be very careful to ensure the device and block arguments
    are correct. If you designate the wrong device, you can destroy data on another
    partition. If you pass the wrong number of blocks, you might actually format part
    of another partition and destroy any data that is there.


    The options you can use with the mkfs utility are listed in Table 3.4.


    # Table 3.4 Options to Use with the mkfs Command


    | Option | Action |

    | --- | --- |

    | -t fs-type | Defines the type of filesystem to create |

    | -v | Displays all commands used to create the filesystem |

    | -c | Checks for bad blocks before creating the filesystem |

    | -1 filename | Uses the named file as a list of known bad blocks |


    You also can use the mkfs command to create a filesystem on a floppy drive; however,
    the fdformat command is a better choice. It performs a low-level format to create
    the sector and track information on the floppy. The syntax for the fdformat command
    is as follows:


    ```

    fdformat [option] device

    ```


    You can use the -n option to prevent verification of the format. Floppy devices
    are usually /dev/fd0 or /dev/fd1.


    # Key Concept


    > Before installing Linux, the disk must be prepared. You do this by creating
    your partitions, activating your swap partition, and designating the filesystem
    for each partition. After the partitions have been created, they must have a filesystem
    created by using the format command.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# # Filesystem Organization


    Linux is organized in a hiearchical manner. It considers every file, directory,
    device, and link as a file that is placed on this structure. The most common organization
    for the directory structure is shown in Figure 3.2.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_75_0.png)


    **Figure 3.2**

    This figure shows a graphical representation of the organization of the Linux
    filesystem. This is independent of the actual partitions.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Each of the directories on the Linux filesystem conventionally contains certain
    types of files. Table 3.5 shows some of the more common directories and their
    contents.


    Table 3.5 Linux Directories and Their Contents


    | Directory | Contents |

    |---|---|

    | / | The beginning or root of the directory tree |

    | /bin | Command binaries |

    | /dev | Peripheral device files |

    | /etc | Configuration files for the system |

    | /home | Users’ home directories |

    | /lib | Shared libraries |

    | /mnt | Temporary partitions used for mounting |

    | /proc | Virtual filesystem containing information about kernels and processes
    |

    | /tmp | Application temporary files |

    | /usr | Several subdirectories containing user commands, documentation, and other
    system information that does not change |

    | /var | Log files and other files that change while the system is running |


    # Inodes


    The Linux operating system stores a lot of information about each file, including
    the following:


    +   ▪ Pointers to the file’s physical location on the disk

    +   ▪ The file’s name

    +   ▪ The file’s owner and group IDs

    +   ▪ Rules governing access to the file

    +   ▪ The file’s size

    +   ▪ The date and time the file was last accessed

    +   ▪ The date and time the file was last modified

    +   ▪ The date and time the inode was last modified

    +   ▪ The number of links to the file


    A data structure called an inode is used to store the above information pertaining
    to each file with the exception of the file’s name. The file’s name is stored
    in its directory with an associated inode.


    Each and every file has an inode associated with it. Even though every file can
    have more than one name through the use of links, each file has only one inode.
    (See Chapter 6, “Filesystem Organization”.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '"Maintaining the Filesystem," for information on links.) Use `ls -1` to determine
    the number of the inode for any file. For example, issuing the command `ls -1
    MyFile` returns the following:


    ```

    4144 MyFile

    ```


    This means that the information about the file MyFile has an inode number of 4144.
    If an inode becomes corrupted, the file will no longer be accessible. Another
    way to see the inode number for a file is to use the stat command. Its syntax
    is


    ```

    stat filename

    ```


    Its output should look similar to the following:


    ```

    File: ''mywhich''

    Size: 101     Filetype: Regular File

    Mode: (0775/-rwxrwxr-x)  Uid: ( 503/ hadden) Gid: ( 500/ hadden)

    Device: 3,0   Inode: 147474  Links: 1

    Access: Tue Oct 19 16:10:58 1999 (00019.19:52:38)

    Modify: Fri May 28 09:02:47 1999 (00014.03:06:55)

    Change: Fri Sep  3 17:20:37 1999 (00065.18:40:59)

    ```


    The stat command reads the inode structure associated with the specified filename.


    # Key Concept


    Each file has an associated inode that contains the file''s physical location
    and all its attributes except for its filename. Use either the `ls -1` or stat
    command to determine a file''s inode.


    # File Types


    Linux supports several file types and uses the first character in the permission
    block to name the file type. Linux does not differentiate between files and directories
    in the inode table. The operating system knows whether the file is a regular file
    or a directory by the file type character. The most common file type characters
    used by Linux are listed in Table 3.6.


    Table 3.6 The First Character of the Permission Block Identifies the File Type


    | Character | Type of File |

    |-----------|--------------|

    | -         | Ordinary file|

    | b         | Block device |

    | c         | Character device |

    | d         | Directory |

    | l         | Link |'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Most files on the Linux system are ordinary files, including text files and
    applications. Any file a user creates is an ordinary file.


    To Linux, directories are just empty files. They are organized in an hierarchial
    manner to provide holding places for other file types.


    Block and character mode devices are composed of the instructions necessary for
    Linux to communicate with peripherals. These files are usually located in `/dev`.


    Links are identified in the file type character as an 1. See Chapter 6 for more
    information on links.


    # # Keeping Your Disks Healthy


    After your partitions are created and formatted and you have installed Linux,
    you will want to make sure they stay healthy. You can use several different utilities
    to determine the state of your filesystem or fix problems with it.


    # ## *fsck*


    The most important utility for maintaining your filesystem is the **fsck** command.
    Like the **mkfs** command, **fsck** is a front end to the **check_disk** command
    for the specified filesystem type. It is used to verify the filesystem’s structure
    and repair any inconsistencies. Problems most frequently occur as a result of
    a system crash.


    When a system crashes, the kernel is unable to sync the cache with the hard disk’s
    contents. This can result in blocks being marked as in use when they are really
    empty. Other errors can occur from directly writing to a device to an area containing
    existing data.


    The syntax for the **fsck** command is


    ```

    fsck -t fs-type device

    ```


    For example, to check the first partition created as an ext2 filesystem in our
    earlier example, you would type the following:


    ```

    fsck -t ext2 /dev/hda1

    ```


    The previous command calls the **e2fsck** command to check the ext2 filesystem
    on the first partition of the first IDE hard disk. Because this is the root partition,
    you will receive a message that the filesystem is mounted and be asked whether
    to continue. If you answer yes, **fsck** checks the following:


    +   - inodes

    +   - blocks

    +   - file sizes

    +   - directory structure

    +   - links'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Any partition other than root can be unmounted while your system is running.
    To run the **fsck** command, you must first unmount that filesystem. See Chapter
    6 for more information on mounting and unmounting file systems. To run **fsck**
    on your root partition, you can


    +   Start in read-only, single-user mode.


    +   Boot with a floppy and then scan the root partition.


    +   Run **fsck** during system boot.


    When running **fsck** during system boot, the root filesystem is mounted in read-only
    mode, **fsck** runs, and then the root filesystem is mounted as read-write. All
    other filesystems are checked before they are mounted. Refer to Chapter 2, “Booting
    Linux,” for details on booting and passing parameters to your boot loader.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_79_0.png)


    # Key Concept


    > The **fsck** command is used to verify the integrity of your filesystem. Unmount
    your filesystem before running it.


    Options that are filesystem-specific for the **fsck** command are listed in Table
    3.7.


    | Option | Action | |---|---| | -a | Causes **fsck** to run non-interactively
    | | -c | Checks for bad blocks | | -v | Reports on **fsck**''s progress |


    The filesystem keeps information about the filesystem as a whole in the *superblock*.
    If the superblock becomes corrupted, the filesystem cannot be mounted; however,
    backup copies of it are spaced at regular intervals across the filesystem. By
    default, these copies are saved every 8,192 blocks. Because the first block is
    number 1 and not number 0, copies would be stored at block 8193, 16385, 24577,
    and so on. To verify that this is the block group size on your system, you can
    issue the following command:


    ```

    dump2fs `device`

    ```'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'The previous command produces a wealth of information about the filesystem;
    just look for the following line:


    ```

    Blocks per group: 8192

    ```


    If a different number is given, use this number to locate the copies of the superblock.
    You can then tell the e2fsck command to use a copy of the superblock to check
    a partition you can''t mount because of a corrupted superblock. So, if you can''t
    mount a /dev/hda1 that has an ext2 filesystem because of a corrupted superblock,
    issue the following:


    ```

    e2fsck -f -b 16385 /dev/hda1

    ```


    In the previous command, the -f option is used to force the check. If you do not
    use the -f option, e2fsck will look at the copy of the superblock and might think
    that the filesystem is clean. The -b option identifies the copy of the superblock
    that is to be used.


    # Disk Usage


    As files are created and saved to your system and log files are written to, your
    free disk space shrinks. It is important to monitor how much space is used on
    each disk. Linux runs best when there is adequate free space available.


    To get optimal performance from your operating system, the amount of free space
    available should be 5~30 percent of each filesystem. In addition, if there is
    no free space, you will not be able to write to that filesystem.


    Not only do you need to monitor the amount of free space, but you also will want
    to monitor what files are occupying the most space. By seeing what files are growing
    the fastest, or who is using the most space, you will be able to take steps to
    prevent your filesystem from becoming too full.


    # du


    The du command reports on the amount of space occupied by a single file or a directory
    and all its files and subdirectories. The syntax for the du command is as follows:


    ```

    du [options] [filename]

    ```


    In the previous syntax, filename can also be the name of a directory. If du is
    called without a filename, it will report on the working directory and its contents.
    Table 3.8 lists the options you can use with du.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '| Option | Action |

    | :----- | :----- |

    | -a     | Displays file usage |

    | -b     | Displays usage in bytes |

    | -c     | Prints grand total |

    | -h     | Appends a letter to identify the measurement being used for the report,
    such as M for megabytes |

    | -k     | Displays usage in kilobytes, the default |

    | -m     | Displays usage in megabytes |

    | -1     | Counts links |

    | -s     | Prints only the grand total |


    Unless you use the -a option, du displays only the directories, even though the
    space occupied by all the files is counted. If you do not have permission to a
    file, du will display an error message and not count that file when displaying
    disk usage.


    # df


    Both the du and df commands report on object size. Whereas du reports on the size
    of objects such as files, df reports on the size of devices such as partitions.
    The syntax for the df command is


    ```

    df [options] [filename]

    ```


    The df command returns the following information values:


    +   - Size of the device

    +   - Number of free blocks on the device

    +   - Number of occupied blocks on the device

    +   - Percent of total blocks that are free

    +   - Name of the device


    If you pass an ordinary file''s name to df, it will report on the device containing
    that file. If you do not name a file, df reports on all mounted filesystems. The
    options used with the df command are listed in Table 3.9.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Table 3.9 Options Used with the df Command


    | Option | Action |

    | :----- | :----- |

    | -a | Displays information on all filesystems; default action |

    | -h | Appends a letter to identify the measurement being used for the report,
    such as M for megabytes |

    | -i | Lists inode usage |

    | -k | Displays usage in kilobytes |

    | -m | Displays usage in megabytes |

    | --sync | Calls the sync command before gathering information |

    | -t fs-type | Displays only filesystems of fs-type |

    | -T | Displays the filesystem type for each entry |

    | -x fs-type | Excludes filesystems of fs-type


    For example, if you type


    df


    your output might look like the following:


    Filesystem 1024-Blocks Used Available Capacity Mounted on

    /dev/hda1 1018298 93796 871931 10% /

    /dev/hda9 2055450 26494 2396823 1% /home

    /dev/hda7 102185 31 126528 0% /tmp

    /dev/hda5 2058806 466860 1467722 24% /usr

    /dev/hda6 256592 9435 233905 4% /var


    # Key Concept


    Use the df and du commands to determine how much free space is available.


    What do you do if a filesystem is becoming too full? You will want to identify
    any large files that are being created but are no longer necessary. Log, mail,
    and news files are often big offenders. Other large files that might be deleted
    are core dumps.


    Check whether the tmp directories are not being cleaned out. In fact, this should
    be a regular part of your system maintenance.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Are there files that are not being used? Try compressing them and perhaps relocating
    them to another device. Directories also should not get too large because very
    large directories can affect system performance. Move files to several smaller
    directories.


    One of the problems with directories is that they grow but do not shrink. So,
    if you move or delete a large number of files from a directory, you will not recover
    all the free space.


    The only way to shrink the size of a directory is by deleting it. Therefore, copy
    the files you want to keep to another directory and then delete the original directory.
    After you''ve done this, you can re-create the directory with the same name and
    move the needed files to the new directory.


    If you are outgrowing a partition, you have a couple choices for fixing the problem.


    One possibility is to move some files to another partition and then place links
    to them on the original partition. See Chapter 6 for information on how to use
    links.


    A better way would be to actually increase the size of the partition. However,
    this is also a more complex process. The first thing you must do is to make sure
    you have an up-to-date backup of the information on that partition. See Chapter
    11, “Backup and Restore,” for information on performing backups.


    Next, you must decide where the extra space will come from. You can use any free
    space that exists on the same hard disk or free space from another hard drive,
    or you can add another hard disk.


    You must delete the old partition and then create a new partition to take its
    place. Partitions can''t be dynamically expanded under Linux; they must be deleted
    and re-created with a larger size. After you have created a larger partition,
    you will need to restore the original information. The restore operation is also
    covered in Chapter 11.


    # ## Summary


    In this chapter, we have covered the types of partitions you will create. A primary
    partition is necessary for an operating system to boot. An extended partition
    is a container for logical drives that are then used to store data. Linux also
    has a special type of partition called a swap partition, which are used as virtual
    memory.


    The fdisk utility is used to create these partitions. When creating a new partition,
    you must designate the beginning and ending cylinders. After the partitions are
    created, you must create a filesystem by using the format command.


    The fsck command is used to examine the filesystem for errors and can be used
    to repair any errors found. Other utilities you can use to monitor your disk''s
    health are the df and du commands, which are used to determine partition size
    and usage.'
  merge: -1
  img_proc: true
