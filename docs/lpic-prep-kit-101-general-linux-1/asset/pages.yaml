    # Managing at Jobs


    Running at jobs uses system resources. If many users run long, complex jobs at
    the same time, this can adversely affect your system''s performance.


    There are two files that control a user''s ability to run at jobs—the /etc/at.allow
    and /etc/at.deny files. When a user attempts to run at, it first checks to see
    if the /etc/at.allow file exists and that the user''s name is contained within
    it. If the user''s name is there, he can use at to schedule a job.


    If the /etc/at.allow file does not exist, /etc/at.deny is checked. To prevent
    a user from being able to schedule any jobs, add the user''s name to the /etc/at.deny
    file. Any user who is not mentioned in the /etc/at.deny file is then allowed to
    use the at command.


    If both files exist, at first checks the /etc/at.allow file. If the user who is
    requesting to schedule an at job is listed, he will be successful. at will not
    check the /etc/at.deny file if its check of the /etc/at.allow file is successful.


    If you want to prevent all users from being able to run any at jobs, simply delete
    the /etc/at.deny file. If the /etc/at.deny file exists but is empty, all users
    can run at jobs. If neither file exists, only the superuser or root is allowed
    to use the at command. Figure 10.1 shows the process that at goes through when
    a user attempts to schedule at jobs.'
