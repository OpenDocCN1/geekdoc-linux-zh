    just a method for addressing your computer''s memory. If you type ls -1 /proc/kcore
    you will see the amount of memory in your system as bytes. Only root can access
    the proc directory. A sample output from ls -1 /proc is


    ```

    dr-xr-x-x  3 root    root        0 Nov 10 16:24 1

    dr-xr-x-x  3 root    root        0 Nov 10 16:24 2

