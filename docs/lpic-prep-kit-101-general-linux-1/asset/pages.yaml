    USER=hadden

    BASH_ENV=/home/hadden/.bashrc

    OSTYPE=Linux

    ```


    This is a list of environment variables and their values in the form `name=value`.
    Think of a variable as a storage area that contains a value. You also can see
    all the possible environment variables by using the `set` command without any
    parameters. Table 5.3 lists some of the more common environment variables and
    what they contain.


