- pgno: 18
  md: 'The Linux Professional Institute (LPI) is a group of volunteers who have come
    together with a belief in the need for a certification in Linux that will be accepted
    worldwide. The other Linux certifications available are distribution-specific.
    The goal of LPI is to demonstrate the candidate''s abilities to administer any
    Linux system.


    As you review the objectives for each exam, you will see how LPI has implemented
    their goal. Each objective covers essential information applicable to any Linux
    installation. As a result, the LPI certification will become the Linux certification
    of choice for those who want to demonstrate their Linux abilities instead of their
    abilities to manage one particular distribution of Linux.


    The first level of certification covers the skills needed by a junior Linux system
    administrator. This certification will cover basic abilities in the following
    areas:


    +   - Documentation

    +   - GNU and UNIX commands

    +   - Boot, initialization, shutdown, and runlevels

    +   - Devices, Linux filesystem

    +   - Administrative tasks


    This certification consists of two exams. Each of these two exams covers general
    Linux topics. Originally, LPI intended to offer a third exam as part of the first
    level of certification. This third exam was to be distribution-specific, with
    the candidate choosing among several different offerings.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Based on the psychometric evaluation of the available topics that were to be
    included in these distribution exams, it was decided that there was not enough
    material to justify the third exam. Some distribution-specific material was then
    rolled over into the objectives for the second test (102).


    This book is intended to help you prepare for the first exam (101) offered by
    the Linux Professional Institute on your road to becoming Linux certified.


    The 101 exam covers material common to all distributions. Areas covered on the
    exam include documentation, GNU/UNIX commands, filesystems, booting, runlevels,
    and administrative tasks. This test is required for all candidates for LPIC Level
    1 certification.


    # # How This Book Is Organized


    The chapters in this book have been written based on the objectives published
    by LPI for the 101 exam. You can review the objectives at http://www.lpi.org.


    The objectives are thoroughly covered in this book, although not in the order
    listed on the LPI Web site. Rather, they are organized in a logical way so that
    each chapter builds on the preceding chapter. For a complete list of exam objectives
    and where they are discussed, refer to Appendix G, “Objectives Index.”


    Chapter 1, “Finding and Creating Documentation,” covers the use and maintenance
    of system and application documentation installed on your system.


    Chapter 2, “Booting Linux,” takes you through the steps of booting Linux, managing
    runlevels, and shutting down your system.


    Chapter 3, “Linux Filesystem,” covers partitioning as well as disk utilities used
    to maintain the filesystem.


    Chapter 4, “File Management,” discusses the directory hierarchy and file management.
    It also discusses utilities used for text searches.


    Chapter 5, “GNU and UNIX Commands,” covers typing at the command line and history.
    In addition, it discusses processes and priorities.


    Chapter 6, “Maintaining the Filesystem,” explains disk quotas and disk management.


    Chapter 7, “Users and Groups,” examines how to organize and manage your users
    and groups.


    Chapter 8, “Text Streams,” covers the most common text filters.


    Chapter 9, “Permissions,” discusses how to control the resources on your system.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Chapter 10, “Administrative Tasks,” provides an introduction to basic system
    administration.


    Chapter 11, “Backup and Restore,” outlines how to plan for disaster recovery and
    discusses the more common utilities.


    +   - Appendix A, “Glossary,” provides definitions of terms presented in this
    book.

    +   - Appendix B, “Certification Process,” discusses the road to LPI certification.

    +   - Appendix C, “Testing Tips,” presents some hints to help you be successful
    on your exams.

    +   - Appendix D, “Alternate Resources,” lists other places to go for information.

    +   - Appendix E, “Using the CD-ROM,” explains how to use the CD-ROM that comes
    with this book.

    +   - Appendix F, “Lab Exercises,” is a comprehensive test for you to use to gauge
    your readiness for this exam.

    +   - Appendix G, “Objectives Index,” includes a list of LPIC Test 101 objectives
    and a discussion of each objective.


    Even if you feel comfortable with the material covered in a specific chapter,
    please be sure to review that chapter before proceeding to the next one. Because
    each chapter builds on the preceding ones, you''ll want to have a firm grasp of
    the foundation chapter before moving on.


    A bonus that you received when you purchased this book is the tear-out booklet.
    This booklet contains a brief synopsis of each chapter covering the most important
    points. Use it in conjunction with the prerequisites at the beginning of each
    chapter to ensure you understand the foundation chapters before proceeding.


    You also can use the tear-out booklet for your review before taking the final
    test at the end of the book. In addition, you can take the tear-out booklet with
    you the day of your exam to review in the parking lot right before your test.


    Each chapter begins with a series of “While You Read” questions that test your
    preconceptions of how chapter topics are put to task in an administrative environment.
    To gauge your own learning curve, write down your answers before moving on to
    the rest of the chapter. While you read the chapter, refer to your answers and
    revise them as necessary. The answers are provided at the end of the chapter.


    A collection of Practice Test questions also appears at the end of each chapter.
    Both the correct and incorrect answers are explained in an effort to optimize
    the benefits you get'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'from this practice test. After completing the end-of-chapter test, review the
    answers to see how well you did. Not doing this is only cheating yourself.


    If you find that you have missed several of the end-of-chapter questions, go back
    and review that chapter before proceeding to the next chapter. If you still are
    unclear about a concept, try another resource such as the Linux Documentation
    Project or any of the other resources listed in Appendix D.


    # ## Preparing to Test


    This exam is intended for the individual who has experience with Linux. You need
    to have a Linux system available that you can use. Practice each of the concepts
    covered in this book until you are comfortable with them.


    To get the most from this book, you should start with Chapter 1 and complete each
    chapter in the order in which they are presented. When starting a chapter, the
    first thing you should do is to read the prerequisites. If you don''t feel you
    have a good grasp of these principles, go back and review before proceeding.


    Next, read the “While You Read” questions and write down your answers. You also
    might want to make note of any other questions that come to mind. After you have
    finished reading the chapter, look over the answers. Make sure you understand
    why the answers are correct.


    The next thing you will want to do is any associated lab exercise. These are designed
    to reinforce the didactic material you have read. The hands-on experience will
    be invaluable when you are sitting there taking the exam.


    The last thing you should do is answer the end-of-chapter questions. Write down
    your answer to each question before checking it. If you miss any, review the rationale
    for each possible answer. You also should review the appropriate section in the
    chapter. If you still are unclear, consult Appendix D for other places that will
    provide additional explanations. While you are studying for your first exam, take
    the tear-out booklet with you wherever you go. It is designed to be portable.
    You can use it to review whenever you have a few minutes, such as when standing
    in line, waiting at the auto repair shop, and any other time you are stuck with
    a few minutes to fill.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'After you have completed the book and the end-of-book test, you will want to
    use the practice test engine provided on the CD-ROM that accompanies this book.
    Enough questions are provided for four completely different tests, although by
    using the randomizing feature, you''ll get a "new" test every time you sit down.
    This is excellent experience to get you ready for the real thing. See Appendix
    E for information on how to use the test engine.


    The test will contain questions that require you to evaluate and diagnose the
    situation. The answer you choose will be the result of this evaluation. It is
    in this situation that the hands-on experience you get from the exercises in Appendix
    F and your own experience will be invaluable.


    Study well and best of luck on your certification endeavor!'
  merge: -1
  img_proc: true
