- pgno: 45
  md: 'You can start your Linux system just by turning on the power, using a program
    that is a boot loader, or booting from a floppy disk. When you power up your computer,
    certain tasks are performed during the power up phase. This period is referred
    to as POST: power on self test. After this has happened, the operating system
    can be loaded. A boot loader is a program such as LILO that manages the loading
    of your kernel. LILO is covered later in this chapter.


    The method of starting Linux is dependent on how you have configured your system.
    No matter how you start your system, the steps you take to get the operating system
    up and running are basically the same.


    > **Key Concept**

    > Understanding the process of booting Linux is necessary in order to troubleshoot
    any problems you might have during the boot process. These concepts will be covered
    on the exam.


    The kernel is located either on your boot floppy or on the hard drive in the `/boot`
    directory. The compressed kernel is usually called `vmlinuz-version-number`. However,
    the name and location are not important—only that the kernel can be located upon
    booting is.


    First, the kernel is loaded into memory. Usually, your kernel is compressed; however,
    the code necessary to uncompress it is not compressed. You can use the `gunzip`
    utility to uncompress your kernel. See Chapter 11, “Backup and Restore,” for information
    on this utility. Several parameters are included in the kernel image that you
    are loading, including where the root filesystem is located.


    While loading, the kernel prints messages to the display and saves them to the
    `/var/log/messages` file. You can review these messages by looking at the log
    or by using the `dmesg` command. `dmesg` takes no arguments and prints out the
    last messages in the kernel message buffer. These messages include


    +   * The console type and font

    +   * Detection of PCI bus and any PCI cards present

    +   * An estimate of the processor speed

    +   * Amount of available system memory

    +   * CPU type

    +   * The version number of the kernel'
  merge: -1
  img_proc: true
- pgno: 46
  md: '+   - Any device drivers that are loaded

    +   - The amount of swap space

    +   - Network adapters and settings


    See Chapter 10, “Administrative Tasks,” for more information on this log file
    and using the dmesg command.


    After the kernel has started, it mounts your root filesystem, usually located
    on your hard disk. After mounting the root, the control is handed over to the
    hard disk with the kernel remaining in memory.


    # The init Daemon


    The last thing the kernel does is invoke the init daemon, which stays active until
    you shut down your system. It is responsible for creating processes that the rest
    of the system will use, such as login shells. The init daemon will also restart
    certain processes when they exit. For example, when you log out, init restarts
    the console so you can log in again.


    The init daemon’s actions are controlled by its configuration file, /etc/inittab.


    # The /etc/inittab File


    Each line of the /etc/inittab file contains four fields separated by a colon:


    ```

    ID:runlevel:action:process

    ```


    Table 2.1 shows what each field contains.


    Table 2.1 Fields and the Purpose of the Lines in the /etc/inittab File

    | Field | Contents and Purpose |

    | --- | --- |

    | ID | One or two characters identifying the entry, usually the device name |

    | runlevel | Indicates to which runlevels this line will apply; multiple runlevels
    can be listed; if blank, will apply to all runlevels |

    | action | How to handle the entry; see Table 2.2 for valid entries |

    | process | Command to execute |


    The action field indicates how to handle the command, such as whether to restart
    the command if it stops. Table 2.2 shows the valid entries for this field.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# **Table 2.2 Valid Entries for the action Field in the /etc/initab File**


    | boot | Runs when /etc/initab is first read |

    | bootwait | Runs when /etc/initab is first read after the boot entries |

    | initdefault | Sets initial runlevel; stops the process if it is running; starts
    process only once after |

    | ondemand | Keeps process running; restarts if it stops |

    | powerfail | Executed upon receipt of a power failure signal |

    | sysinit | Execute before executing console |

    | respawn | Keeps process running; restarts the process if it stops |

    | wait | Starts process once |


    The **init** process is used to start the kernel and any processes it needs to
    get your system up and running. If you want an application to start every time
    your system boots, enter that command in one of the rc scripts, which are discussed
    in the next section, “Runlevels.”


    # **Runlevels**


    A *runlevel* defines a set of processes to start as part of booting the system.
    This can range from a minimal amount of processes such as those used for system
    administration to a configuration supporting all configured devices.


    The numbers associated with various runlevels differ depending on the distribution
    you''re using and are listed in the /etc/initab file. For example, the listing
    might look like


    ```

    ```

    # Default runlevel. The runlevels used by RHS are:

    # 0 - halt (Do NOT set initdefault to this)

    # 1 - Single user mode

    # 2 - Multiuser, without NFS (The same as 3, if you do not have networking)

    # 3 - Full multiuser mode

    # 4 - unused

    # 5 - X11

    # 6 - reboot (Do not set initdefault to this)

    ```

    ```


    The runlevels **0** and **6** are reserved only for **halt** and **reboot**, respectively.
    The runlevels can vary from distribution to distribution. No matter what distribution
    you have installed, the init daemon processes only those lines associated with
    the current runlevel.


    The single-user mode is a little different from all the rest of the available
    runlevels. This runlevel is often used for system administration tasks such as
    recovering a corrupt filesystem. No other users can log in while the system is
    in this runlevel. However, you can still'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'run multiple applications at the same time. This is the only time that init
    does not read the /etc/inittab file. Rather, the default action is to run the
    /bin/su command and you are logged in as the superuser or root.


    When starting at a runlevel higher than the single-user mode, the system starts
    up in multiuser mode. In this mode, init executes those lines with an action of
    sysinit, boot, or bootwait. Frequently, these lines mount the filesystems.


    Next, the init daemon will execute all the other lines that are listed with the
    present run-level in the runlevel field.


    Your initial runlevel is defined by the line


    ```

    id:3:initdefault:

    ```


    Notice that this line does not define any processes to start, but rather defines
    the runlevel with which to start. You can change the runlevel by using the command
    init. Its syntax is


    ```

    init [runlevel]

    ```


    The init command takes a runlevel as an argument. You can specify how long to
    wait before changing the runlevel by using the telinit command with the -t seconds
    option. The default delay is 5 seconds. The telinit command is a link to the init
    command. Be sure that you notify any logged on users before changing the runlevel.


    For example, the command


    ```

    init 5

    ```


    will change the runlevel to level five. init first sends a signal to stop any
    processes running that are not defined for the new runlevel. After the specified
    delay, telinit then sends a kill signal to these processes. It then starts any
    processes defined for the new run-level that are not already running.


    You also can change to single-user mode by passing either s or S to the init or
    telinit commands.


    The next section in the /etc/inittab file defines the startup scripts to run,
    as in


    ```

    si::sysinit:/etc/rc.d/rc.sysinit

    ```


    The ID si at the beginning of the line is used internally by the init daemon.
    This line starts the script rc.sysinit, which handles tasks such as activating
    the swap partition, running fsck, and mounting your filesystems. The fsck command
    checks the filesystem for corrupt entries and is discussed in more detail in Chapter
    6, “Maintaining the Filesystem.” This script can vary depending on your distribution.
    Read the one located on your system to get the details of what it accomplishes.'
  merge: -1
  img_proc: true
- pgno: 49
  md: "The next section in the `/etc/inittab` file runs scripts appropriate to your\
    \ runlevel, which are located in the `/etc/rc.d` directories:\n\n```\n1:1:wait:/etc/rc.d/rc\
    \ 1  \n12:2:wait:/etc/rc.d/rc 2  \n13:3:wait:/etc/rc.d/rc 3  \n14:4:wait:/etc/rc.d/rc\
    \ 4  \n15:5:wait:/etc/rc.d/rc 5  \n16:6:wait:/etc/rc.d/rc 6\n```\n\nThis is accomplished\
    \ by calling the `rc` script with an argument identifying the runlevel. The `rc`\
    \ script then runs the scripts located in the `rcn.d` directory, in which `n`\
    \ represents the runlevel. Your system can execute other startup scripts, such\
    \ as `/etc/rc.local`, depending on your distribution.\n\nYour `rc` scripts also\
    \ can call *modules*. These are pieces of kernel code that can be loaded and unloaded\
    \ while your system is running. These modules are most frequently device drivers\
    \ for devices you can't use all the time.\n\nYou can use the `/etc/conf.modules`\
    \ file to pass parameters to each module at the time it is loaded. These parameters\
    \ are frequently `I/O` addresses and interrupts. A sample `conf.modules` file\
    \ is\n\n```\nalias eth0 3c59x  \nalias sound 0s1370\n```\n\nThis loads the modules\
    \ necessary for the Ethernet card and sound card.\n\nNext are the processes that\
    \ should be run at every runlevel. These usually include starting a `getty` process,\
    \ which creates each of the virtual terminals.\n\nYour `inittab` file also can\
    \ contain instructions as to what to do if a power failure occurs and what to\
    \ do if the power comes back up. An example is\n\n```\n# When our UPS tells us\
    \ power has failed, assume we have a few minutes  \nof power left. Schedule a\
    \ shutdown for 2 minutes from now.  \n# This does, of course, assume you have\
    \ powered installed and your  \n# UPS connected and working correctly.  \n  \n\
    pf::powerfail:/sbin/shutdown -f -h +2 'Power Failure; System Shutting Down'  \n\
    \  \n# If power was restored before the shutdown kicked in, cancel it.  \npr:12345:powerokwait:/sbin/shutdown\
    \ -c 'Power Restored; Shutdown Cancelled'  \n# Run gettys in standard runlevels\
    \  \n1:2345:respawn:/sbin/mingetty tty1  \n2:2345:respawn:/sbin/mingetty tty2\
    \  \n3:2345:respawn:/sbin/mingetty tty3\n```"
  merge: -1
  img_proc: true
- pgno: 50
  md: '4:2345:respawn:/sbin/mingetty tty4

    5:2345:respawn:/sbin/mingetty tty5

    6:2345:respawn:/sbin/mingetty tty6


    The **shutdown** command is discussed later in this chapter.


    The init daemon stays active after reading the */etc/inittab* file. It monitors
    the system for instructions to change the runlevel or when one of the processes
    it started stops. If one of init''s child processes does stop, it does two things:


    +   ■ First, it rereads the */etc/inittab*. If the action is to restart the process,
    then it does.

    +   ■ Second, it logs in the */etc/wtmp* and */etc/utmp* files the fact that the
    process terminated and why. These files are discussed in Chapter 10, “Administrative
    Tasks.”


    The init daemon will also reread the */etc/inittab* file if it is instructed to
    change the runlevel or if it is notified of a power failure.


    If you want to make changes to the */etc/inittab* file, you can use any text editor
    to alter the file while the system is running. These changes, however, will not
    be implemented until the init daemon rereads the file. This occurs when


    +   ■ The runlevel is changed

    +   ■ A power failure occurs

    +   ■ You issue the command **init q**


    The **init q** command causes init to reread the */etc/inittab* file.


    Exercise great care when editing the */etc/inittab* file because errors can prevent
    you from logging in to your system. Make a copy of the original, correct file,
    and a boot floppy in case you make a mistake. You might be able to recover by
    starting in single-user mode, but that''s not always possible. Occasionally, you
    might make a typo when editing */etc/inittab* that could cause your system to
    enter a loop by starting and stopping a process repeatedly. To prevent this from
    happening, the init daemon tracks how frequently it has to restart a process.
    If a process is restarted more than 10 times in 2 minutes, the init daemon sends
    an error message and waits for 5 minutes before it will restart that process.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# # LILO


    LILO (LI

    ux LOader) is a boot loader that can reside on your hard disk or your boot floppy.
    It is executed when the system boots. Features of LILO include the following:


    +   - Will work with DOS, UNIX, OS/2, Windows 95/98, and Windows NT

    +   - Replaces the master boot record on your hard drive

    +   - Can use up to 16 different boot images on different partitions, each of
    which can be password protected

    +   - Allows the boot sector file, map file, and boot images to reside on different
    partitions


    LILO has the capability to act as a boot loader for other operating systems. It
    will allow you to select the operating system you wish to boot.


    **Key Concept**


    LILO provides an efficient method for booting Linux as well as other operating
    systems. LILO can handle up to 16 different boot images on a single hard disk.
    When you install LILO, you can select to overwrite the Master Boot Record or not.


    If no selection is made, the default operating system is usually booted. You can
    bypass this action by either pressing a key (the Alt, Shift, or Ctrl key) or requesting
    a prompt in the `/etc/lilo.conf` file. Either of these actions will cause LILO
    to show a boot prompt:


    **BOOT:**


    At this point, you can type the name of the operating system to boot. If you press
    Tab or type `?` at the LILO boot prompt, a list of configured operating systems
    will be displayed. If you do not make a selection, LILO will boot the first operating
    system it finds.


    When typing a selection at the boot prompt, you can pass options to the kernel.
    This is often used to start your system in single-user mode by typing


    ```

    kernelName single

    ```


    at the boot prompt. Other options that can be passed include `root=device`, `ro`
    for read-only, and `rw` for read-write.


    How LILO behaves is controlled by its default configuration file, `/etc/lilo.conf`.
    The LILO command has several different uses; its syntax is


    ```

    lilo [options]

    ```'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'To install LILO, simply call it without any options. The options that can be
    used with LILO are listed in Table 2.3.


    | Option | Action |

    | :--- | :--- |

    | -b bootdev | Specifies boot device |

    | -C filename | Use specified configuration file |

    | -c | Speeds boot by merging reads from adjacent sectors |

    | -D label | Use kernel with given label as default |

    | -d *deciseconds* | Indicates how long to wait for selection |

    | -f filename | Specifies disk parameter file; default is */etc*/disktab |

    | -I | Asks for path to kernel |

    | -i filename | Identifies file to be used as boot sector; default is */boot*/boot.
    |

    | -l | Generates linear sector addresses |

    | -m filename | Uses specified map file instead of default |

    | -P \[fix\|ignore\] | Fixes or ignores corrupted partition tables |

    | -q | Lists the names and locations of kernel(s) to boot from the */boot*/map
    file |

    | -R command | Sets default for next reboot |

    | -r directory | Changes root before anything else; used for troubleshooting |

    | -S filename | Overwrites existing file |

    | -s filename | Specifies where to store old boot sector; if used with *-u* specifies
    boot sector to restore |

    | -t | Tests your configuration without installing |

    | -u or -U | Uninstalls LILO |

    | -v | Causes LILO to display information; multiple *-v*s can be used to increase
    the amount of information displayed |


    *Table 2.3 Options That Can Be Used with LILO*


    The majority of the time you will use a configuration file when calling LILO instead
    of using the command line. When creating the configuration file, you use keywords
    instead of the options shown in Table 2.3. The available keywords are listed in
    Table 2.4.'
  merge: -1
  img_proc: true
- pgno: 53
  md: "**Table 2.4** Keywords and Their Corresponding Options to Use in the Configuration\
    \ File for LILO\n\n| Keyword | Option |\n| :--- | :--- |\n| -b bootdev | boot=bootdev\
    \ |\n| -c | compact |\n| -d deciseconds | delay=dsec |\n| -D label | default=label\
    \ |\n| -i filename | install=bootsector |\n| -f filename | disktab=file |\n| -l\
    \ | linear |\n| -m filename | map=mapfile |\n| -P fix | fix-table |\n| -P ignore\
    \ | ignore-table |\n| -s filename | backup=file |\n| -S filename | force-backup-file\
    \ |\n| -v | verbose=level |\n\nThe default configuration file for LILO is */etc/lilo.conf*.\
    \ A sample lilo.conf file is\n\n```\nboot=/dev/hda          the partition that\
    \ you will boot from\nmap=/boot/map          the mapping file to use\ninstall=/boot/boot.b\
    \   the boot sector file\nprompt                 display a prompt\ntimeout=50\
    \             how long to wait before staring the default\nimage=/boot/vmlinuz-2.0.36-0.7\
    \  The name of the kernel to start\n    label=linux         the label or name\
    \ you assigned\n    root=/dev/hda1      the partition to mount as root\n```\n\n\
    You can pass configuration parameters to the kernel, such as append, ramdisk,\
    \ read-only, read-write, root, and vga, in the options section for each operating\
    \ system listed. So, if you have an operating system that you boot to troubleshoot,\
    \ you could create a ramdisk and load everything there. You also could make a\
    \ filesystem read-only when booting.\n\nIf you modify your configuration file,\
    \ you will need to write it to the boot sector of the hard disk. After you have\
    \ completed your changes, issue the command\n\n/sbin/lilo"
