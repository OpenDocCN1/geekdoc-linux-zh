    You are able to alter bash''s environment in several different ways. When the
    shell starts it scans its own environment, marking each parameter to be exported
    to any child processes it might spawn.


    To see the present value of any one variable, execute the following command:


    ```

    echo $VARIABLE_NAME

    ```


    The echo command causes its argument to be printed to the screen. The value of
    a variable can be accessed by placing a $ sign before the variable''s name. In
    this way the value is printed and not the variable''s name. If you leave off the
    $, the variable''s name will be printed instead.


    Environment variable names are in all caps, so echo $path would fail while echo
    $PATH would not. The export built-in command enables you to change any environment
    variable and then make it available for any child processes. Built-in commands
    are part of the shell and do not cause a new child process to be started.


    If an environmental variable is modified, it replaces the old value. Executed
    commands inherit the environment that consists of the shell''s initial environment
    along with any changes that might have been made.


    # PATH


    One of the most important environment variables is PATH. This tells your operating
    system where to look for files and commands. To add another directory to your
    path you can issue the command


    ```

    PATH=$PATH:/sbin ; export PATH

    ```


    Here you are adding the new directory, /sbin, to the present path. Then the export
    command is used to make this new path available to the shell and any future child
    processes.'
