    *wc*


    The *wc* utility will tell you the number of words, lines, or characters in a
    file. Its syntax is


    ```

    wc [options] {filename(s)}

    ```


    If you specify multiple files, the number of words, lines, and characters will
    be displayed for each file followed by the sum total of words, lines, and characters.


    You can use the -o option to display only the number of characters -w to display
    the number of words, and -1 to display the number of lines.


    So, if you called *wc* with days and my*which* listed as filenames, the output
