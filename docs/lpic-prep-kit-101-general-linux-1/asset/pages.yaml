- pgno: 371
  md: '# General Linux I EXAM 101


    # LEARN—TUTORIAL


    +   * Text is designed for self-study with testing tips and memory boosters.

    +   * Chapter-opening, informal questionnaires gauge your knowledge before and
    after reading.

    +   * Chapter-ending study questions give you a feel for how the topic will be
    addressed on the test and reinforce what you’ve just learned.

    +   * An Objectives index shows you where each Linux objective is covered in the
    book.

    +   * Appendix contains a glossary, information on the certification process,
    and testing tips.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_371_0.png)


    # REVIEW—FLASH NOTES


    +   * BONUS tear-out booklet reviews the important concepts and terms from the
    book.

    +   * A map of prerequisites begins each chapter to keep you focused on how far
    you’ve come and what is needed to move on.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_371_1.png)


    # PRACTICE—LAB EXERCISES


    Software-integrated lab exercises provide hands-on training and troubleshooting
    practice


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_371_2.png)


    # PASS—TEST ENGINE


    +   * Random-access test engine is written in binary code for use on a Linux platform.
    Over 250 questions and answers provided for a “new” test every session.

    +   * The engine grades your test to show areas for improvement and provides both
    a short answer explanation and a link to where it was discussed in the book.


    About the author: **Theresa Hadden Martinez, MCSE, MCIT, and S AIR Linux Certified,
    teaches Microsoft® server products, Linux, and security courses. She presents
    both Microsoft Official Curriculum and custom prepared courses to prepare students
    for certification exams, as well as post-exam reviews. In addition, she teaches
    Linux Intro and System Administration courses for Compaq® and has been active
    in LPI’s Linux community in the mailing list and other venues providing input
    and suggestions for the objectives and questions on the test.**


    **Craig and Coleta Withe spoon**, authors of about 20 books (including four books
    on the Linux operating system) and technical editors for about two dozen other
    books, have been involved in the LPIC 101 General Linux 1 test since its beta-test
    stage.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_371_3.png)


