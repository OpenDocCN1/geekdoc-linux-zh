    | usr/src | Contains source files for most software installed on the system with
    a separate subdirectory for each package. |

    | usr/src/linux | Linux source directory. |

    | usr/X11R6 | Usually a link to another directory containing X Windows files.
    The organization of this directory might be different depending on the window
