- pgno: 203
  md: '# Finding Your Files


    Before you can begin editing a file, you need to know where it is. Two utilities
    that can help you locate the file you are looking for are `find` and `locate`,
    which were covered in Chapter 6, “Maintaining the Filesystem.” To help you further,
    you can use special characters to represent other characters. These are called
    *wildcards* or *metacharacters*.


    # Wildcards


    Three types of wildcards or metacharacters can be used with the `find` and `locate`
    utilities to make it easier to find what you are looking for.


    | Character | Function |

    | :--- | :--- |

    | ? | Used to match a single character |

    | * | Used to return zero or more characters at the beginning or end of an expression
    |

    | \[\] | Used to return one of the characters defined within the brackets |


    See Chapter 4 for more information on using metacharacters and searching the content
    of files.


    # Text Filters


    One of the most important tasks that you will be involved in is creating and modifying
    text files, such as configuration files. There are many utilities that you can
    use to automate repetitive tasks when editing text files. You can expect to see
    these on the exam, so you need to be comfortable with using them. Text filters
    perform a single job well and are extremely useful in this regard. The tasks that
    you might want to perform on a text include pagination, search and replace operations,
    and formatting.


    You can use many utilities, or text filters, to automate repetitive tasks when
    editing text files. The ones that you need to be comfortable with for the exam
    are `sed`, `sort`, `cut`, `expand`, `fmt`, `head`, `join`, `nl`, `od`, `paste`,
    `pr`, `split`, `tac`, `tail`, `tr`, and `wc`.


    # sed


    `sed` is a non-interactive text editor. You pass a series of commands to `sed`
    and it processes your file one line at a time. Remember, however, that `sed` does
    not change the original file. Rather, it copies the original file, changes the
    copy, and sends it to either standard output or to a file that you designate.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# The syntax for `sed` is


    ```

    ```

    sed [-n] [-e command] [-f command_file] fileName [>newfile]

    ```

    ```


    We will look at each of the options in this section.


    Chapter 4 discussed using `sed` to search for text in a file; however, it can
    do much more than that. `sed` commands can be entered at the command line, as
    in the following:


    ```

    ```

    sed s/term1/term2/ FileName

    ```

    ```


    More commonly, however, you will use a file containing the commands in conjunction
    with `sed`, as in the following:


    ```

    ```

    sed -f ConFile FileName

    ```

    ```


    where `ConFile` contains the command


    ```

    ```

    s/term1/term2

    ```

    ```


    One of the simplest `sed` commands is substitution. In the previous example, `sed`
    replaces the first occurrence of the first term in each line with the second term.
    If `term1` occurs more than once in a line, only the first occurrence is replaced.
    To replace every occurrence of `term1` with `term2`, you would use `g` at the
    end, as in


    ```

    ```

    s/term1/term2/g

    ```

    ```


    The `g` tells `sed` to perform a global search and replace. You can limit the
    replacement to a specific occurrence by specifying which occurrence you want to
    act upon, as in the following:


    ```

    ```

    s3/term1/term2/

    ```

    ```


    This would replace only the third occurrence of `term1` with `term2`. You also
    can designate specific lines to process by referring to the line by number:


    ```

    ```

    1s/term1/term2/

    1,3s/term1/term2/

    ```

    ```


    The first example will process only line 1, whereas the second processes lines
    1–3. Be sure to note the placement of the numbers. If the number is first, it
    denotes line number, but if it is after the `s` (command) then it denotes the
    number of its occurrence. The following is an example of this:


    ```

    ```

    s2/term1/term2/

    ```

    ```


    This would replace the second occurrence of `term1` with `term2`.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'You also can use the $ instead of a line number to specify the last line. If
    you do not know the line number, you can use patterns instead to locate the line.
    The command `/StartWord/d /StopWord/s/term1/term2/`


    processes the file starting with the first line containing StartWord and ending
    with the first line containing StopWord. After StopWord has been found, sed looks
    for another occurrence of StartWord. If it is found, sed will process all commands
    on all lines until StopWord is found again. This process continues until the end
    of the file is reached.


    If you want to process all lines except those specified, follow the address with
    !. You also can use a \n to specify a newline character within the pattern. However,
    it will not match a newline at the end of a pattern.


    By default, sed prints the each line of the file after it has finished processing
    the line. However, if you want to see only the lines that have been changed, use
    a p. This causes sed to print only each line that has been changed. Of course,
    sed will print the same line for each change it made. So if it makes three changes
    to one line, it will print the same line three times (once after making each change).


    ```

    s/term1/term2/gp

    ```


    If you want to do the same thing from the command line, use the -n option with
    sed, as in


    ```

    sed -n s/term1/term2/gp FileName

    ```


    Both of the previous two examples would change every instance of term1 to term2
    and print the changed line(s) to standard output. If you want to use both -n and
    -f, be sure that -n precedes the -f. You also could use -nf or -fn.


    If you want to redirect the changed lines to a file, you can use the w option
    (if you are saving your commands to a script file). The following is an example
    of this:


    ```

    s/term1/term2/w OutFile

    ```


    When typing the commands on the command line you can redirect the output to a
    file by using a pipe, such as >.


    In addition, you can use sed to add, delete, or change lines of a text file. Table
    8.1 shows the commands you can use when you want to work on an entire line.'
