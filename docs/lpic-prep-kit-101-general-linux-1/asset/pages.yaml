- pgno: 105
  md: 'Depending on how you are using regular expressions, you might need a special
    character or delimiter to mark the beginning and end of your pattern. The most
    common delimiter is /, but vi and some other text editors allow the use of other
    characters as a delimiter. Most utilities use common delimiters, but grep does
    not. (grep is discussed later in this chapter.) Details on using regular expressions
    will be discussed throughout this book in conjunction with specific utilities.


    The most basic usage is /file/, which requires an exact match to the string file.
    This results in matches to file, file1, MyFile, and file.old. However, it will
    not match myFile because searches are case-sensitive.


    The use of sets overcomes this limitation. Therefore, using /[^f]ile/ will find
    all the files in the prior example as well as MyFile. [^f]ile means either File
    or file.


    Sets can explicitly list the acceptable characters in the preceding example or
    define a range of characters. So if you wanted to find a string that begins with
    any digit, you could use either /[@123456789]/ or /[-9]*/.


    Another way to designate a pattern is through the use of the pipe (|) character.
    You use the | character to separate possible choices, just like saying “or”. So,
    looking at the earlier example, using /file | File/ would find either file or
    File.


    Use the caret (^) to find a pattern at the beginning of a line. Using /^@[0-9]/,
    would result in finding any line starting with a digit. The dollar sign ($) can
    be used to find lines ending with a pattern. For example, /$[0-9]/ would find
    all lines ending with a digit.


    As each utility is discussed, the use of regular expressions will be presented.
    The first one we will cover is the use of grep for searching the contents of files.


    # ## Searching File Content


    Numerous utilities give you the ability to find specific patterns in a file with
    or without opening the file. Some of these utilities display only what was found,
    while others will make changes to the file’s contents. Two of these utilities
    discussed here are grep and sed.


    # ### grep


    The global regular expression print (grep) command searches a file for a pattern
    or simple string. It does not change the file but rather displays each line that
    contains the desired string. The syntax for grep is


    ```

    grep [options] pattern [file list]

    ```'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'There are three related commands—grep, egrep, and fgrep—that can be used for
    searching files line by line. The differences among them are minor. grep uses
    regular expressions. egrep, which uses extended expressions, has a slightly different
    syntax; and fgrep uses simple strings rather than regular expressions.


    The utilities egrep and fgrep are not used as frequently as grep; therefore, grep
    will be covered here and on the exam. The most basic use of the grep command is
    to search a single text file for a regular expression, such as


    ```

    grep cat MyFile

    ```


    This would return each line in the file MyFile containing the string cat, whether
    it stands alone or as part of another word, such as “category”.


    Three major options can be used to define how grep handles the search pattern.
    Only one of these options can be used at a time. If none of them are used, the
    default, -G, is assumed. Table 4.7 lists these options and how they affect grep’s
    behavior. Be sure you understand the differences and when to use which one.


    | Option | Action |

    |---|---|

    | -G | Interprets as regular expression; default action |

    | -E | Interprets as extended regular expression; such as egrep |

    | -F | Interprets as a simple string; same as fgrep |


    To search for special characters, such as spaces or tabs, you need to enclose
    the pattern in quotes to prevent the shell from interpreting any special characters
    such as the space. For example


    ```

    grep ''my files'' MyFile

    ```


    Without the quotes, this command would search for the pattern my in two files
    called files and MyFile. You cannot go wrong using quotes to enclose the pattern
    you are searching for, so get in the habit of using them. Although most of the
    time double quotes will work, using single quotes will always work.


    # Key Concept


    The grep command searches a file for a pattern. It outputs the line containing
    the match to the display. Regular expressions can be used within the search pattern,
    but you should enclose them in single quotes ('''').'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'You can use the `-n` option to show the line numbers of each line containing
    the search string. This option works with `grep`, `egrep`, and `fgrep`. If you
    only want to know the number of lines that contain the pattern, use the `-c` option.
    The output will not show each line but rather a count of the lines containing
    the pattern. If several files are searched, a total number of occurrences for
    each file will be displayed.


    Occasionally you might need to see lines that do not contain a certain word or
    phrase. This also can be accomplished using `grep` and the `-v` option. Each line
    that does not contain the quoted pattern will be displayed. You can modify this
    further by adding the `-c` option. Then you will see the number of lines that
    do not contain the pattern.


    You also might use a file containing the names of the files to be searched by
    using the `-f` option and the name of the file containing the list. When using
    a file list, `grep`''s default action is to list the name of each file as a header
    before listing the results. This behavior can be suppressed by using the `-n`
    option.


    `grep` performs case-sensitive searches, so if you search for lines containing
    `money` you will not get the lines containing `Money` or `MONEY`. To find the
    pattern irrespective of case, use the `-i` option, which causes `grep` to ignore
    case.


    When `grep` is searching for a pattern, it does not care if the pattern is found
    as a whole word or part of a word. If you want to find only occurrences where
    the pattern is a word unto itself, use the `-w` option. For example, say you are
    looking for the letter you wrote about the upcoming New Year''s Eve party but
    you do not remember what you named it. Instead of having `grep` return the line
    containing "New Year''s Eve party", you can use the `-i` option so that only the
    name of the file containing the pattern is returned rather than the line itself.


    `grep` will display errors if it encounters files that it cannot read, such as
    directories or device files. You can suppress these messages by using the `-s`
    option.


    # sed


    The `sed` (stream editor) is a non-interactive line editor. Although it is useful
    for processing large amounts of text, it is somewhat daunting for the beginner.
    You pass all your commands to `sed` at one time, and then `sed` processes a file
    or files one line at a time. Commands are usually entered via a program or file
    you write, but it also will accept input from the command line.


    `sed` does not change the original file but instead copies it, edits it, and either
    sends it to standard output (your display) or saves it to another file.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'The syntax for **sed** is


    ```

    ```

    sed [-n] [-e commands] [-f scriptname] textfile [>file]

    ```

    ```


    The `-n` option prevents `sed` from sending the changed file to the standard output,
    except as instructed by the `p` (print) flag if it is present.


    The `-e` option alerts `sed` that commands are immediately following.


    The `-f` option names the file containing the `sed` commands.


    The `textfile` is the file to be processed, and `>file` tells `sed` to write the
    output to the file specified.


    A `sed` script consists of


    ```

    ```

    [address[,address]] instruction [argument-list]

    ```

    ```


    Addresses are optional and can be either the line number or a pattern. They specify
    the lines to which the instruction is applied. If no addresses are specified,
    `sed` processes all lines of the input file. If only one address is specified,
    all lines that correspond to that address are processed. Two addresses define
    a range where processing occurs, starting at the first address and ending at the
    second.


    `sed` reads one line at a time. If the line satisfies the specified address or
    no address is given, `sed` reads the first command from the script or command
    line and processes it accordingly. `sed` then reads the next command and applies
    that. This process continues until all commands have been processed. Then the
    next line is read and the process continues.


    `sed` can be used to search a file for a pattern and print the lines containing
    the pattern to standard output by typing


    ```

    ```

    sed /term/ p file

    ```

    ```


    Because `sed` displays all the lines of the input file by default, every line
    of the file will be printed to the display. In addition, the `p` argument will
    print any line containing the search term so those lines will appear twice.


    > > **Key Concept**

    > > `sed` is a line editor, but its changes are not applied to the original file.
    Instead the output is sent to the standard output. By default, each line is printed
    whether or not a change is made. `sed` also can take regular expressions as part
    of its search pattern.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Chapter 6 • File Management


    If you want to see only the lines containing the search pattern, use the `-n`
    option:


    ```

    sed -n ''/term/p'' file

    ```


    This will print only the lines that contain the pattern. If you do not use the
    `-n` instruction, every line will be displayed and the lines containing the pattern
    will be displayed twice.


    You also can display a portion of the file based on line number:


    ```

    sed ''2 q'' file

    ```


    This will display the first two lines of the file. The `q` then causes `sed` to
    quit processing the file. Although the quotes are not necessary here, they are
    in the next example. If you want to see a portion of the file, you can specify
    a range of lines to display:


    ```

    sed -n ''3,7 p'' file

    ```


    This will print lines 3–7 and then quit.


    `sed` is an extremely powerful text processor that can do much more complex options
    than are discussed here. See Chapter 8 for a more detailed discussion of `sed`.


    # Compressing and Uncompressing Files


    Several utilities are available to compress and uncompress files. The most commonly
    used include `tar`, `gzip`, `gunzip`, and sometimes `compress`. The `zcat` utility
    enables you to view the contents of a compressed file. You need to know how these
    work and how to use them because you will see them on the exam.


    # **tar**


    The `tar` (tape archive) utility is used to combine multiple files into one large
    archive while retaining the original directory structure. Although originally
    intended to create archives on a tape, `tar` files can be saved to any media.
    `tar` also has the capability to compress this file at the same time it creates
    it.


    When creating a `tar` file, you should use only relative paths. That is, construct
    the path to the files you want to archive relative to you where you are in the
    file system hierarchy. If your location is `/home/hadden` and you want to archive
    all the files in the `/home/hadden/test` directory, you should enter the path
    as `test/*`.


    If you try to use absolute pathnames with `tar`, the leading slash will be stripped
    off. This prevents overwriting existing files when a `tar` file is unarchived.
    To override this behavior, use the `-P` option.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# **Key Concept**


    The tar utility does not compress files, but instead can be used to create a single
    archive containing many files and their directory structure. This can be helpful
    when creating backups.


    The tarfiles end in a .tar, and the syntax is


    ```

    ```bash

    tar [options] [tarfile] [files]

    ```

    ```


    The command to create a tarfile containing all the files in the *pwd* would be
    something like the following:


    ```

    ```bash

    tar -cf myarchive.tar .

    ```

    ```


    This command will cause the contents of the *pwd* to be tarred into the file *myarchive.tar*.
    The `-c` option creates the tarfile and the `-f` option gives the name for this
    new archive. The trailing dot is used to specify the current working directory.


    You can view the contents of your tarfile using


    ```

    ```bash

    tar -tf myarchive.tar

    ```

    ```


    The `-t` option causes tar to print the names of the files contained in the archive.


    tar not only enables you to create an archive, it also enables you to restore
    the contents of an archive. To extract your tarfile, type


    ```

    ```bash

    tar -xvf myarchive.tar

    ```

    ```


    Here the `-x` option tells tar to extract the contents of the tarfile called *myarchive.tar*.
    The `-v`, or verbose, option causes tar to print what files are being extracted
    to the standard output. The `-f` option names the tarfile to be extracted.


    There are two different ways to restore a single file. First you can choose which
    file to extract from a list of the contents of the tarfile by typing


    ```

    ```bash

    tar -xwvf myarchive.tar

    ```

    ```


    The `-w` option places tar in interactive mode. You then are asked on a file-by-file
    basis whether to extract each file. If the tarfile contains a large number of
    files, this can take a long time.


    Remember that tar has the capability to list the filenames of the tarfile. If
    you know the name of the file you want to extract, you can pass it directly to
    tar:


    ```

    ```bash

    tar -xf myarchive.tar myfile

    ```

    ```'
