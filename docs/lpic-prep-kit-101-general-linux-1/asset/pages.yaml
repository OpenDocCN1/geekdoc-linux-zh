- pgno: 193
  md: "When you create a new user, the defaults located in the /etc/profile file are\
    \ read and executed to create the user’s environment. Next, the shell looks for\
    \ the files .bash_profile, .bash_login, and .profile in the user’s home directory.\n\
    \nIf one or more of these files is found, they are read and executed in the order\
    \ listed. If the same environment variable is set in all these files, the variable\
    \ is set to the last value read. So, if you want to change your path to something\
    \ different from the system path as defined in the /etc/profile file, you can\
    \ make that change in the .profile file in your home directory. Because this file\
    \ is the last one read, whatever value it sets will be the value applied to that\
    \ user’s environment. Chapter 5 discusses environmental variables in more depth.\
    \ When exiting an interactive login shell, bash will read and execute the commands\
    \ in /home/<username>/.bash_logout if it exists.\n\nWhen a bash shell starts an\
    \ interactive shell that is not a login shell, such as when you type bash <enter>\
    \ at a command prompt, it reads and executes the commands in the file /etc/bashrc.\
    \ This file also can be called from within the profile file. An example of a bashrc\
    \ file is\n\n```\n# /etc/bashrc\n\n# System wide functions and aliases\n# Environment\
    \ stuff goes in /etc/profile\n\n# For some unknown reason bash refuses to inherit\n\
    # PS1 in some circumstances that I can't figure out.\n# Putting PS1 here ensures\
    \ that it gets loaded every time.\nPS1=\"${USER}|${PWD}> \nalias lsa=\"ls -aF\
    \ --color | more\"\nalias lsl=\"ls -aF --color | more\"\nalias rm=\"rm -i\"\n\
    alias cp=\"cp -i\"\nalias mv=\"mv -i\"\nalias cl=\"clear\"\nalias dira=\"dir --color\
    \ | more\"\nalias dira=\"dir -aF --color | more\"\n```\n\nWhen starting bash as\
    \ an interactive non-login shell, you can inhibit this behavior by using the --norc\
    \ option. You also can specify another file to read instead of bashrc by using\
    \ the --rcfile <filename> option, which will cause bash to execute the commands\
    \ from the specified file instead."
  merge: -1
  img_proc: true
- pgno: 194
  md: 'When bash is called as a non-interactive shell, such as when running a shell
    script, it looks for the environment variable BASH_ENV. This variable can contain
    the name of a file other than the bashrc file to execute. The entire path as well
    as the file''s name is required when setting this variable.


    Bash can be invoked using the name sh instead of bash. When invoking bash in this
    manner, bash examines the value of the ENV variable to identify what file to execute.
    No other startup files are processed when calling bash in this manner.


    An easy way to make sure your new users receive copies of these files in their
    home directories is to create the appropriate files and save them to /etc/skel.
    Whenever you create a new user with the useradd command, these files are copied
    to the new user''s directory and the permissions are appropriately set.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_194_0.png)


    > If you choose to create startup files and manually copy them to the user''s
    home directory, be sure you make the user the owner of these files and set the
    group ownership appropriately. Failure to do this can result in the user being
    unable to log on or environment variables being inappropriately set.


    # ## Summary


    Managing users and groups is a significant part of any administrator''s job. All
    user accounts are contained in the /etc/passwd file. Each user is defined in a
    single line and the fields are


    +   - Username

    +   - Password

    +   - User ID

    +   - Group ID

    +   - Comment

    +   - Home directory

    +   - Login command


    Each of these fields, which can be blank, is required.


    You can create users by editing the /etc/passwd file or using the useradd command.
    Other commands used to manage users are usermod and userdel.'
  merge: -1
  img_proc: true
- pgno: 195
  md: "The `su` command is used when you want to impersonate another user. If you\
    \ are root when you issue the `su` command to impersonate a user, you do not need\
    \ to provide a password. If you are a user, however, you will need to supply the\
    \ correct password for the command to complete successfully.\n\nGroups are defined\
    \ in the `/etc/groups` file. Each group is listed in a separate line. Groups can\
    \ be managed by editing the `/etc/group` file or using the `groupadd`, `groupmod`,\
    \ `groupdel`, or `gpasswd` commands.\n\nSeveral different configuration files\
    \ are read by the system in different circumstances. The default files for an\
    \ interactive, login shell are `/etc/bash_profile`, `/etc/bash_login`, and `/etc/profile`.\
    \ These files can be copied to the user’s home directory to make changes that\
    \ will apply to that user only.\n\nOther configuration files are `.bash_logout`\
    \ and `/etc/bashrc`. Two environment variables that affect the behavior of your\
    \ shell are `BASH_ENV` and `ENV`.\n\n+   • Group name  \n+   • Password  \n+ \
    \  • Group ID  \n+   • Members\n\nAdditional security can be implemented by using\
    \ shadow passwords for users and groups."
