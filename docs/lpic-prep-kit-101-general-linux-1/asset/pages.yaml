    | peanut | tty1 | | Wed May 19 10:33:53 1999 |

    | eddie | tty3 | | Sat Aug 21 19:11:05 1999 |

    | ronnart | tty2 | | Sun May 16 16:10:07 1999 |

    | mary | | | **Never logged in** |


    # Rotating Logs


    Because logs can get very large, you will want to monitor them. Periodically you
    will want to clear the log. When you do this, you will need to decide whether
    you want to save the old information. This is referred to as rotating the logs.


    One way to handle this is to periodically copy or move each log that you want
    to save to another location. Next, you would either need to recreate the log file
    (if you moved the original) or empty the original log (if you copied it).


    This enables you to save older logs while also improving system performance. As
    the number of old logs increases, you will need to decide whether you want to
    archive them or just delete the older logs. This will depend on what the role
    of your computer is and your organization''s policies. If it is a standalone computer,
    chances are you will not want to keep older logs.


    To simplify this process, you can use the logrotate command. The logrotate command
    gives you the ability to automatically rotate your logs, compress or remove old
    logs, and even mail the log files. This activity can be based on time (such as
    daily) or on log size. The syntax for logrotate is


    ```

    logrotate [options] config_file

    ```


    By default, logrotate saves its status information to /var/lib/logrotate.status,
    but this behavior can be overridden by using the -s option and the name of another
    file.


    More than one config file can be passed to the logrotate command; however, instructions
    contained in the last one named can override instructions in an earlier named
    file. Table 10.7 lists the commands that can be used in the config files.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Table 10.7 Commands Used in Config Files to Be Used with the logrotate Command


    | Command | Action |

    | :--- | :--- |

    | compress | Uses gzip to compress old logs |

    | copytruncate | Copies log then truncates old log |

    | create | Applies named permissions to new log; if no permissions are specified,
    permissions of old log are used |

    | daily | Rotates logs daily |

    | delaycompress | Compresses on next rotation |

    | errors mailto | Mails errors to specified address |

    | ifempty | Rotates empty log |

    | include filename | Reads filename into config file |

    | mail mailto | Mails logs to specified address when deleting |

    | monthly | Rotates logs monthly |

    | nocompress | Does not compress |

    | nocopytruncate | Does not copy and truncate |

    | nocreate | Does not use permissions specified by create |

    | nodelaycompress | Compresses now |

    | noolddir | Does not move to another directory |

    | notifempty | Does not compress empty log |

    | olddir directory | Moves old logs to specified directory |

    | postrotate | Runs script after log is rotated |

    | prerotate | Runs script before log is rotated |

    | rotate n | Specifies number of old logs to retain |

    | size n | Rotates when log reaches n bytes; adds k to specify kilobytes or M
    to specify megabytes |


    A configuration file can have both global and local options. Global options are
    applied to all log files, whereas local options are applied only to a specific
    file. Any local options will override global ones. The following is a sample configuration
    file:


    ```

    # rotate log files weekly

    weekly

    ```


    ```

    # keep 4 weeks worth of backlogs

    rotate 4

    ```'
