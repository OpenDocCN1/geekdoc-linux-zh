- pgno: 137
  md: '# Key Concept


    The **ps** command is used to list the current processes on your system. To get
    more detailed information, use the **-1** option. The **-ef** option will format
    the output of **ps** as a tree showing the relationships of parent and child processes.


    The **top** utility dynamically displays processes, unlike **ps**, which shows
    a static view. **top** can be used to stop processes or reprioritize them.


    # nice


    The **nice** command can be used to lower the priority of a running process. The
    superuser also can use **nice** to raise the priority of a process. The syntax
    is


    ```

    nice [option] command-line

    ```


    The **command-line** argument refers to the command you want to execute. This
    command can be a single command or a complex one including arguments and redirection.


    If no option is given, **nice** uses an adjustment of 10. To use a different value,
    use the **-n value** option. The range of acceptable values is -20 (highest priority)
    to 19 (the lowest priority). A positive value decreases priority, whereas a negative
    one increases priority.


    Only the superuser can use negative values. Running a process at an increased
    priority can have significant impact on the system and any other processes, including
    the operating system itself.


    # Background and Foreground Processes


    When you issue a command, the shell creates a child process and the parent process
    (the shell) goes to sleep until process completes. The exception is when using
    built-in commands, which do not create a child process.


    By default, every time you issue a command it runs in the foreground. You can
    make it run in the background by using the &. For example,


    ```

    pine &

    ```


    will cause a process (**pine**) to run in the background.


    Under the bash shell, Ctrl+z will suspend a running program and put it in the
    background. Use **fg** to bring the program to the foreground where you can use
    Ctrl+c to kill the process if necessary.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# ## Jobs


    A *job* is a series of one or more commands. Whenever you give Linux a command,
    even when it consists of multiple commands connected by one or more pipes, you
    are creating a new job. The shell provides the capability to control jobs and
    assigns a number to each job.


    *Job control* refers to the capability to suspend a process and to resume its
    execution at a later point. This capability is controlled by the shell—bash supports
    job control.


    You can run only one job in the foreground, but you can run multiple jobs in the
    background. To get a list of commands running in the background as well as stopped
    and suspended programs, use the *jobs* command.


    If a job has been suspended, it can be brought to the foreground using `fg %n`,
    `fg`, or `fg %`. If more than one job has been suspended or is running in the
    background, it can be brought to the foreground using `fg %n` (where n is the
    job number) or `fg %name` (where name is the name of the process).


    For example, if an editing session with `vi` has been suspended, `fg %vi` would
    bring it back to the foreground.


    The shell keeps a list of currently running jobs. When bash starts a job asynchronously
    (in the background), it prints a line that looks like


    ```

    ```text

    [2] 4356

    ```

    ```


    which shows that this is job number 2 and that the PID of the last process in
    the pipeline is *4356*. A *pipeline* is a command line that can contain one or
    more pipes, such as


    ```

    ```text

    cat MyFile | sort | lpt

    ```

    ```


    All the processes in a single pipeline are members of the same job.


    After a program is suspended, it can be restarted in the background by using the
    `bg` command. If only one process is suspended then `bg`, `bg %name`, or `bg %n`
    will restart the process in the background. If more than one process is suspended
    then either `bg %n` or `bg %name` is required to restart the process in the background.


    If you attempt to exit bash while jobs are stopped, the shell warns you that there
    are stopped jobs. You can then use the *jobs* command to see what jobs are stopped.
    If, however, you again attempt to exit without entering a new command, bash allows
    you to exit without a warning and the stopped jobs are terminated.


    The syntax for the *jobs* command is


    ```

    ```text

    jobs [options] [jobspec]

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Issuing the `jobs` command without any options will show a list of all running,
    stopped, and suspended jobs.


    To also see the PIDs, use the `-1` or `-p` option to list only the PIDs of the
    job’s group leader. You can restrict the display to running jobs by using the
    `-r` option, or you can show only stopped jobs by using the `-s` option.


    # Key Concept


    Processes can run in the foreground or background. Type `command &` or use `bg`
    to place a process in the background; `fg` will place a process in the foreground.


    A job is one or more processes started from a single command line. Use the `jobs`
    command to see what jobs are running.


    # Signals


    A *signal* is a communication sent to a process. It can be an interrupt, an illegal
    instruction, or other condition. You can use the `kill` command to send a signal
    to a process. These signals are usually used to stop a process.


    The `kill` command by default sends a signal to terminate the specified process
    or job. Only root or a process’s owner can `kill` it. The syntax for `kill` is


    ```

    `kill [options] ID`

    ```


    The ID can be the PID, %n (which is the current job), %n (where n is the job number),
    or %name (which can be the initial string or a matching string).


    If a process refuses to die, use the signal 9, as in


    ```

    `kill -9 PID`

    ```


    You also can `kill` a process by name using the `killall` command. Its syntax
    is


    ```

    `killall [options] process_name`

    ```


    Use the `-v` option to have `killall` notify you when the process has been successfully
    killed. The `-i` option will cause `killall` to ask for confirmation before killing
    the process.


    # Summary


    This chapter has covered a great deal of information about the `bash` shell and
    how it works. We have introduced how the shell and operating system interact to
    process what you type on the command line.'
  merge: -1
  img_proc: true
