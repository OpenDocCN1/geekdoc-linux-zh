- pgno: 256
  md: '# Managing cron Jobs


    If you have many users running cron jobs, your system could get overloaded. Therefore,
    you need to decide if and when you will allow users to schedule jobs. You can
    control which users are allowed to run cron jobs through the use of the /etc/cron.allow
    and /etc/cron.deny files.


    If the /etc/cron.allow file exists, only the users listed in this file are allowed
    to run cron jobs. If cron finds the user’s name in the /etc/cron.allow file, it
    does not examine the /etc/cron.deny file.


    If the /etc/cron.allow file does not exist but the /etc/cron.deny file does, any
    user not listed in the /etc/cron.deny file will be allowed to run cron jobs. If
    neither of these files exists, any user can run cron jobs. Figure 10.2 shows how
    the crontab uses the /etc/cron.allow and /etc/cron.deny files to determine whether
    a user can schedule cron jobs.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_256_0.png)


    # Figure 10.2


    How crontab evaluates a user’s ability to schedule a cron job.


    Any user can view or edit her own cron jobs by using crontab -e. Users can delete
    their own jobs by using the crontab -r command.


    As root, you can list any user’s cron jobs by using the crontab command with the
    -u username option. You also can delete any user’s cron jobs by using crontab
    with the -r option.


    # System Logs


    System information is stored in a variety of logs. These logs might be specific
    to an application or messages from several sources might be written to a single
    log file. It is also possible to log messages based on their importance as well
    as their source.


    syslogd is the daemon that is responsible for logging system activity. It is usually
    started as part of one of the rc files when the system boots. See Chapter 2 for
    more information on rc files and the boot process.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'Upon startup, the `syslogd` daemon reads the `/etc/syslog.conf` file that specifies
    the options to be used when logging system information.


    Another configuration file can be specified instead of the `/etc/syslog.conf`
    file by using the `-f` option. The options that can be used with `syslogd` are
    listed in Table 10.4.


    **Table 10.4 Options to Use with `syslogd`**


    | Option | Action |

    | :--- | :--- |

    | `-f` *filename* | Specifies a configuration file other than `/etc/syslog.conf`
    |

    | `-h` | Causes `syslogd` to forward messages received from remote hosts |

    | `-1` *hostnames* | Causes *hostname* to be logged with simple hostname and not
    fully qualified domain name; separate multiple names with a colon (:) |

    | `-m` *interval* | Time between two marked lines; default is 20 minutes |

    | `-r` | Allows receipt of network messages |


    # Key Concept


    How and when system messages are written to a log file are controlled by the `syslogd`
    daemon. The configuration information usually is stored in the `/etc/syslog.conf`
    file, although another file containing configuration information can be used.


    You can manage `syslogd` through the use of signals, too. A signal is a message
    that is sent to a process. Most often, this is used to tell a process to terminate.
    See Chapter 5 for additional information on processes and sending signals.


    The use of signals enables you to stop and start `syslogd`, as well as update
    the `/etc/syslog.conf` file and have those changes processed by `syslogd`. The
    syntax for sending signals to `syslogd` is


    ```

    kill -SIGNAL `cat /var/run/syslogd.pid`

    ```


    The file `/var/run/syslogd.pid` contains the PID of the `syslogd` process. By
    enclosing the `cat` command in back quotes (\`), the actual contents of the file
    `syslogd.pid`-the PID of `syslogd`—is passed to the `kill` command. The signals
    that can be sent to `syslogd` are shown in Table 10.5.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'Table 10.5 Signals That Can Be Sent to syslogd


    | Signal | Action |

    | --- | --- |

    | SIGHUP | Rerinalizes syslogd by stopping the daemon, reading the /etc/syslog.conf
    file, and starting syslogd |

    | SIGTERM, SIGQUIT, SIGINT | Stops syslogd |

    | SIGUSR1 | Toggles debugging if started with the -d switch |

    | SIGALRM | Logs the mark line |


    After you kill syslogd, you can restart it using the options listed in Table 10.4.
    The best way is for you to specify a configuration file containing the instructions
    to be sent to syslogd.


    # Key Concept


    You can manage the syslogd daemon through the use of signals. This enables you
    to make changes to the configuration file and then have them take effect.


    # Configuring syslogd


    The /etc/syslog.conf file controls where information is written. Any line that
    begins with a # contains comments and is ignored by syslogd. Also, any blank lines
    are ignored. A typical /etc/syslog.conf file might look like the following:


    ```

    # Log all kernel messages to the console.

    kern.*            /dev/console


    # Log anything (except mail) of level info or higher.

    # Don''t log private authentication messages!

    *.info;mail.none;authpriv.none        /var/log/messages


    # The authpriv file has restricted access.

    authpriv.*        /var/log/secure


    # Log all the mail messages in one place.

    mail.*            /var/log/maillog

    ```'
  merge: -1
  img_proc: true
- pgno: 259
  md: '```

    # Everybody gets emergency messages, plus logs them on another

    # machine.

    *.emerg

    *

    ```


    ```

    # Save mail and news errors of level err and higher in a

    # special file.

    uucp,news.crit/var/log/spooler

    ```


    Each line consists of three items:


    +   Message source

    +   Message type

    +   Log file location and name


    Multiple sources can be named on one line by separating them with a comma.


    When examining the previous file, notice the use of the asterisk (*). This specifies
    that all messages for the specified facility will be logged to the named destination.
    For example, in the sample `syslog.conf` file, all messages created by mail are
    logged to the same location.


    The asterisk also can be used to specify all messages of a certain type, such
    as in the line starting with `*.emerg`. This line defines that any messages of
    type *emerg* are sent to all users (also indicated by an asterisk).


    The equal sign (=) can be used to explicitly log the named class. For example,
    if you entered the line


    ```

    *.crit/var/log/critical

    ```


    in your `syslog.conf` file, all messages of the type *crit* from all sources would
    be written to the `/var/log/critical` log. Other messages of different types would
    be logged based on how you configured them.


    Perhaps you want to send all kernel messages to a log file named *klog*. If you
    also had a line to send *crit* messages to another log, any kernel messages that
    were *critical* would be sent to this log instead of the *klog*.


    The bang (!) is used to negate or exclude logging of the specified type. So, if
    you did not want to see messages of type *info* from mail, you could enter the
    following line:


    ```

    mail.*;mail.!=info /var/log/maillog

    ```


    This line logs all messages from mail except those of type *info* to the `/var/log/maillog`.
    Using `mail.!*` or `mail.none` prevents logging any messages from mail.'
