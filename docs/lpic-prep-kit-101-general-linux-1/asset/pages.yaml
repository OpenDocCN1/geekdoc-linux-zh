- pgno: 245
  md: '+   6. The permission block on **MyDir** is drw-r-r-xr-- and you issue the
    command chmod 0+x MyDir. What would be another way to do this?

    +       a. chmod 777 MyDir

    +       b. chmod 754 MyDir

    +       c. chmod +x MyDir

    +       d. chmod 661 MyDir


    Answer a is incorrect; this would change the permissions to drwxrwxrwx. Answer
    b is correct; the 7 gives the owner read, write, and execute permissions; the
    5 gives the group read and execute and others read; and the 4 gives all others
    read. Answer c is incorrect; this grants the execute permission to all (owner,
    group, and others). Answer d is incorrect; this gives the owner and group read
    and write and others execute.


    +   7. You have a file with a permission block of -rw-rw-r-- and issue the command
    chmod go= file. What would be the new permission block?

    +       a. -rw-rw-rw-

    +       b. -rwXrw-r--

    +       c. -rw-------

    +       d. -rw-rw-r--


    Answer a is incorrect; to have this result, you would need to issue the command
    chmod 0+w file or chmod 666 file. Answer b is incorrect; this permission block
    would result from either chmod 0+x file or chmod 764 file. Answer c is correct;
    the command uses the = symbol to explicitly remove all permissions from the group
    and others. Answer d is incorrect; this shows no changes in permissions.


    +   8. You inadvertently change the permission block on /usr/bin/passwd command
    to -r-xr-xr-x. What would be the effect of this change?

    +       a. Users could no longer change their passwords because they do not have
    write permissions to /etc/passwd.

    +       b. No changes in how the command runs would occur.

    +       c. Users'' passwords would not expire.

    +       d. Shadow passwords would quit working.


    Answer a is correct; by removing the SUID on the command, users would run the
    command in their own context and attempts to write to the /etc/passwd file would
    fail. Answer b is incorrect; users would not be able to change their passwords,
    although you might not realize this immediately. Answer c is incorrect; this would
    not affect any policy you might have established on password age. Answer d is
    incorrect; this would not disable shadow passwords.'
  merge: -1
  img_proc: true
