  md: '7.  You want to use cpio to create an archive of the users’ home directories.
    Which of the following commands is correct?


    +   a.  cpio -o homebackup.cpio /home/*

    +   b.  find /home | cpio -o homebackup.cpio

    +   c.  find /home | cpio -o > homebackup.cpio

    +   d.  cpio -o > homebackup.cpio


    Answer a is incorrect; cpio requires a list of all the files to be added to the
    archive. Answer b is incorrect; cpio outputs the archive to standard output unless
    it is redirected. Answer c is correct; here you use the find command to get a
    list of files to add to the archive and then instruct cpio to save its output
    to the file homebackup.cpio. Answer d is incorrect; although this command redirects
    the output, it does not supply a list of files to add to the archive.


    8.  You have created a full backup of your system called myfsl10913.tar and plan
    on storing it on a CD-ROM. First you want to compress the archive as much as possible.
    Which of the following commands is correct?


    +   a.  gzip -d myfsl10913.tar

    +   b.  gzip myfsl10913.tar

    +   c.  gzip -v myfsl10913.tar

    +   d.  gzip -9 myfsl10913.tar


    Answer a is incorrect; the -d option is used to list the contents of a compressed
    file. Answer b is incorrect; this would compress the file, balancing speed and
    amount of compression. Answer c is incorrect; the -v option would display the
    name and percent compressed of the file. Answer d is correct; the -9 tells gzip
    to use the maximum amount of compression at the cost of speed.


    9.  When reviewing some backup scripts written by another system administrator,
    you see the following line:


    ```

    tar cf fullbackup.tar.Z / | compress

    What does this mean?

    ```


    +   a.  A tar file is created of the entire system called fullbackup.tar.Z and
    then compressed. This is optimal.

    +   b.  A tar file is created of the entire system called fullbackup.tar.Z and
    then compressed. Using tar czf fullbackup.tar.gz would result in greater compression.

    +   c.  A tar file is created of the entire system called fullbackup.tar.Z and
    then compressed. A better command would be tar cf fullbackup.tar.gz | gzip.

    +   d.  A tar file is created of the entire system called fullbackup.tar.Z and
    then saved to the compress directory.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Answer a is incorrect; the compress utility is an older compression utility
    that does not have the most optimum compression algorithm. Answer b is correct;
    this command would use gzip instead of compress to perform the compression, resulting
    in a smaller file. Answer c is incorrect; although this command line would achieve
    the same results as b, it is less efficient. Answer d is incorrect; the command
    pipes the tar file to the compress utility; it does not save it to the compress
    directory.


    +   10. You used the command `gzip memo.bill` to compress the file memo.bill.
    You now want to review some figures that were included in this file. How could
    you do this?

    +   a. `zcat memo.bill.gz`

    +   b. `gunzip memo.bill.gz; less memo.bill`

    +   c. `cat memo.bill.gz`

    +   d. `less memo.bill.gz`


    Answer a is correct; the zcat utility enables you to examine the contents of a
    compressed file without compressing it. Answer b is incorrect; this would uncompressed
    the file and then display it using the less command, but you would then have to
    recompress it. Answer c is incorrect; the cat command cannot display compressed
    files. Answer d is incorrect; the less command cannot display a compressed file.'
