- pgno: 86
  md: 'Answer a is incorrect; the starting cylinder must be the next one after the
    ending cylinder of the prior partition. Answer b is incorrect; fdisk takes only
    the name of the partition to divide as an argument. Answer c is correct; you must
    enter the starting cylinder, which has to be the next one after the ending cylinder
    of the last partition. You can then enter either the ending cylinder or the desired
    partition size, such as +80M, to create an 80MB partition. Answer d is incorrect;
    you must first specify the starting cylinder before the size of the partition.


    3. You have three partitions on your hard disk and 2GB of free space. You need
    to install an application that needs two partitions, a 50MB and a 300MB partition.
    What should you do?


    +   a. Create two new partitions in the free space.

    +       b. Create a new primary partition of 350MB and then use mfs to divide
    it.

    +       c. Create a new extended partition of 2GB in size and then create two
    logical drives, one 50MB and one 350MB in size.

    +       d. Back up one of your partitions, delete it, and then re-create it, making
    it 350MB bigger.


    Answer a is incorrect; you can have only a total of four partitions. Answer b
    is incorrect; the mks command is used to create a filesystem on the new partition.
    Answer c is correct; because you can have only a total of four partitions, you
    must create an extended partition that can be divided into logical drives. Answer
    d is incorrect; although you could do this, it would not create the separate partitions
    you need.


    4. After creating your swap partition, what do you need to do to make it available
    to use for swapping by the operating system?


    +   a. Format the partition with the mkfs command.

    +       b. Change the type of partition to type 82 using the fdisk command.

    +       c. Format the partition with the mkfs.swap command.

    +       d. Pass the name of the partition to the kernel at boot.


    Answer a is incorrect; the swap partition does not need to be formatted. Answer
    b is correct; the swap partition needs to be designated as such by changing its
    type. Answer c is incorrect; there is no mkfs.swap command. Answer d is incorrect;
    you must change the type of a partition to make it a swap partition, not designate
    it as such on boot.


    5. Which of the following pieces of information is not necessary to pass to the
    mkfs command?


    +   a. Filesystem type

    +       b. Size of partition in bytes

    +       c. Partition name

    +       d. Size of partition in blocks'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Answer a is incorrect; you must tell mkfs the type of the filesystem to apply
    to the partition. Answer b is correct; the mkfs command does not need to know
    the number of bytes on the partition. Answer c is incorrect; you must tell mkfs
    which partition to format. Answer d is incorrect; you must tell mkfs how many
    blocks are present on the partition you are formatting.


    +   6. The inode structure contains all of the following, except

    +      a. Filename

    +      b. Access permissions

    +      c. The file''s owner

    +      d. Date and time the file was last accessed


    Answer a is correct; the filename is stored in the directory, not the inode structure.
    Answer b is incorrect; the permission block is stored in the inode. Answer c is
    incorrect; both the owner and group names are stored in the inode. Answer d is
    incorrect; the times the file was last accessed and last modified are stored in
    the inode.


    +   7. You want to run fsck on your root partition. Which of the following will
    not enable you to do this?

    +      a. Boot with a floppy and then run fsck on root.

    +      b. Start in single-user mode and then run fsck.

    +      c. Use fsck with the -f option to force the check.

    +      d. Configure fsck to run at boot.


    Answer a is incorrect; if you boot from a floppy, you will be able to run fsck.
    Answer b is incorrect; booting into read-only, single-user mode will enable you
    to run fsck on root. Answer c is correct; there is no -f option to force fsck
    to run on a mounted filesystem. Answer d is incorrect; the most common time to
    run fsck on root is during boot.


    +   8. You need to prepare a report for your supervisor with the total space used
    by each user. What command would help you prepare this report?

    +      a. du

    +      b. df

    +      c. ls -1

    +      d. wc


    Answer a is correct; the du command displays the amount of disk space being used.
    Answer b is incorrect; the df command shows the amount of space used on an entire
    partition. Answer c is incorrect; this displays a list of all the files and their
    attributes. Answer d is incorrect; the wc command counts the words, characters,
    and lines in a file.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '9. You need to prepare a report that will be the basis of planning for needed
