  img_proc: true
- pgno: 209
  md: 'You can prevent fmt from joining lines by using the -s option. If you want
    to have only one space between words and two spaces between sentences, use the
    -u option. If you want to format only specific lines, use the -p <prefix> option.
    This will cause fmt to format only those lines beginning with prefix.


    Blank lines, indentations, and spacing are preserved. You can redirect the output
    to a file just like other commands.


    # head


    The head command lets you look at the beginning of one or more files. Use the
    -n option to designate how many lines to display. If the number of lines to display
    is not specified, head displays the first 10 lines. Its syntax is


    ```

    head [option] filename(s)

    ```


    You also can use c, b, or l after the number to designate characters, blocks,
    or lines. If nothing is designated after the number, 1 is assumed. To see the
    first 25 characters of a file you would type


    ```

    head -25c FileName

    ```


    In addition, you can use the -c option to print the designated beginning bytes.
    This can be in 512-byte blocks (b), 1KB blocks (k), or 1MB blocks (m).


    If you pass a list of files to head to display, it will precede the display with
    the name of the file. To prevent this behavior use the -q option. If you always
    want to see the name of the file, even when displaying only one file, use the
    -v option.


    # join


    The join utility displays one line for each pair of input lines. The output is
    the join field followed by the remaining fields from file1 and then the remaining
    fields from file2. Its syntax is


    ```

    join [options] file1 file2

    ```


    Each of the two files to be joined should first be sorted alphabetically unless
    the -t option is used. By default, the join field is the first field in each line.


    Table 8.3 lists the options that are used with the join command.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'Table 8.3 Options Used with the join Command

    | Option | Action |

    | --- | --- |

    | -a | Also prints a line for each unpairable line |

    | -e string | Replaces missing fields with string |

    | -1, -j1 field | Joins on field of file1 |

    | -2, -j2 field | Joins on field of file2 |

    | -t character | Uses character as field separator |

    | --help | Prints help and exits |

    | --version | Prints version and exits |


    # nl


    The nl utility adds line numbers to a file and displays it to standard output.
    Its syntax is


    ```

    nl [options] filename

    ```


    nl divides its input into logical pages, each of which consists of a header, body,
    and footer. Any one of these sections can be empty and each can be numbered differently.
    Line numbering is reset to 1 at the beginning of each logical page. You can override
    this behavior by using the -p option or using the -v option to designate what
    number to start with on each page.


    If multiple files are sent to nl, it sends its output as a single file to standard
    output, unless you specify otherwise. Line numbering is not reset at the beginning
    of each file.


    The input page must contain a delimiter on a separate line to indicate the beginning
    of each logical page. The customary delimiters are


    ```

    '':''       start of header

    ''=''       start of body

    ''\''''      start of footer

    ```


    You can change the delimiters by using the -i option. The line containing a section
    delimiter is displayed as a blank line.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# od


    The od utility is used to dump the contents of a file and is useful for viewing
    files with non-printing characters such as binaries. By default, its output is
    in 2-byte octal numbers. Its syntax is


    od [options] file


    The output from a file might look like the following:


    ```

    0000000 066101 064160 043141 066151 066145 071551 065164 064506

    0000020 025254 064554 072163 061412 072141 027064 074164 005164

    0000040 066054 031171 062012 074541 005163 064544 072143 063012

    0000060 066151 071545 066412 073571 064550 064143 071412 063157

    0000100 062164 074541 000012

    0000105

    ```


    In this example, the first column is the offset of each line and then each two
    bytes are represented by a three-digit, octal number.


    # paste


    The paste utility joins the corresponding lines from the named files and sends
    the output to the display. The output separates the joined lines with a tab. Its
    syntax is


    paste [options] filename


    Use the -d option to have the joined lines separated by another character, rather
    than separating them with a tab.


    You also can use the -s option. This causes paste to output one file followed
    by a newline character and then output the next file. With this option, the lines
    are not joined together but the files are pasted one after the other.


    The paste utility often is used in conjunction with cut to rearrange columns.
    First, you would use cut to get each column in a separate file, and then use paste
    to join them in the order you want.


    # pr


    The pr utility is used to break files into pages. Its syntax is


    pr [options] file


    The pr utility is most frequently used to send a file to a printer. The standard
    page length is 66 lines but can be changed with the -l option. You can use the
    -f option to generate a form feed at the end of each page, instead of filling
    the page with newline characters.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'You also can have the output formatted in columns by using the -columns option
    to specify the number of columns to use. Use the -m option to print the listed
    files in parallel—each in a separate column.


    The file name is printed as the header unless you use the -h headertext option.
    This will cause the headertext to be printed centered at the top of the page.


    To prevent pr from changing the layout of your file, use the -t option. This will
    suppress printing of headers and footers. The -T option does the same as -t, but
    it also removes any form feeds contained in the file.


    # split


    The split utility is used to divide files into equally sized pieces. Its syntax
    is


    ```

    split [options] [input_file] [output_file]

    ```


    The default size of each output file is 1,000 lines. You can change this by using
    the -l option to define how many lines to put in each output file.


    output_file gives the syntax for prefixing each piece of the original file. If
    none is given then split uses x. This is added to the filenames, which are aa,
    ab, ac, and so on, as in


    ```

    split FileName dog

    ```


    If FileName is 3,780 lines long, split would divide the file into four files,
    which would be called aadoq, abdoq, acdoq, and addoq. If no output file is given,
    the files would be aax, abx, acx, and adx.


    Files also can be divided by the number of bytes in each output file by using
    the option -b. split multiplies the number by 512KB. You can use -k, which multiplies
    by 1,024 or use -m, which multiplies by 1,048,576. For example


    ```

    split -b 2 FileName

    ```


    would divide FileName into 1024-byte blocks.


    # tac


    tac displays a file line-by-line, starting with the last line and ending with
    the first one. Think of tac as being a reverse cat—just like its spelling. Its
    syntax is


    ```

    tac filename

    ```


    If multiple files are passed to tac, each one is separated by a newline. You can
    specify the separator to use by using the -s option. By default, the separator
    appears after the file. Use the -b option to place the separator before the file.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# *tail*


    *tail* displays the last lines of a file and is especially helpful in reading
    long log files in which the newest messages are at the end. Its syntax is


    ```

    tail [options] file

    ```


    You can designate how many lines to display by using the -n option. If the number
    of lines is not specified, *tail* defaults to 10. *tail* also enables you to designate
    where to start displaying the file by using the +n option, which starts displaying
    a file at line number *n* and then displays to the end of the file.


    You can tell *tail* which item to count instead of which lines. Use b for blocks
    and c for characters. To show the last 30 characters of a file, you would type


    ```

    tail -30c filename

    ```


    You can display by blocks, too. Use b for 512-byte blocks, k for 1KB blocks, and
    m for 1MB blocks.


    The -f option keeps a file open and displays each new line that is added. This
    is helpful when you are troubleshooting and want to watch the error logs. Press
    Ctrl+C to end the display.


    When you pass multiple files to *tail*, it heads each display with the filename.
    To suppress this, use the -q option.


    # *tr*


    The *tr* utility can be used to replace one string with another or to delete a
    string in a file. *tr* send its output to standard display. Its syntax is


    ```

    tr [options] string1 [string2]

    ```


    The most common use of *tr* is to perform a search and replace operation in which
    you specify the string to search for and the string to use as a replacement—for
    example, changing lowercase to uppercase. To change the word *monday* to *Monday*
    in the file *FileName*, type the following:


    ```

    cat FileName | tr monday Monday

    ```


    If you specify only one string and use the -d option, *tr* deletes the specified
    string. You can use the -s option with only one string and *tr* will replace multiple
    occurrences with only one. For example, if you type'
  merge: -1
  img_proc: true
