    # Key Concept


    The shell does not know what you type on the command line until you press the
    Enter key. Instead, the operating system monitors what you type. You can enter
    multiple commands on a single line by separating them with semicolons \.\).


    If your command line becomes too long for the display, you can type /<enter> and
    it will wrap to the beginning of the next line. When the operating system sends
    the command line to the shell, the newline character is dropped and the shell
    treats the commands as if they were typed on one continuous line.


    The shell does not have any knowledge of whether or not the options or parameters
    being passed to the command are acceptable. Instead, any options that are entered
    are passed on to the command. Any error messages you receive are generated by
    the command itself and not by the shell.


    If an executable is found with the same name as the command, the shell starts
    a new process for execution of the program. While the program is running the shell
    goes to sleep. After the program is complete, the shell wakes up and is ready
    to run another command.


    # The Readline Library


    When you type at the command line, the editor you use is the Readline Library,
    which was developed by the Free Software Foundation. By default, the emacs mode
    is used and you use the same key strokes as when editing with emacs.


    You can use the arrow keys to move back and forth through the characters you have
    typed. You also can use the keys as shown in Table 5.2.


    Table 5.2 **Keys to Be Used for Command-Line Editing**


    | **Key** | **Action** |

    | :--- | :--- |

    | Ctrl+B | Move backward one character |

    | Ctrl+F | Move forward one character |

    | Esc+b | Move cursor to beginning of word to the left |

    | Esc+f | Move cursor to beginning of word to the right |

    | Ctrl+A | Move to beginning of line |'
