  md: '# Practice Test


    8. How would you find every occurrence of the word **dog** in a file called *pets*?


    +   * a. `grep -w dog pets`

    +   * b. `grep -iw dog pets`

    +   * c. `grep -i dog pets`

    +   * d. `grep -c dog pets`


    Answer **a** is incorrect: although it will find only lines containing **dog**
    as a complete word it will not find *Dog*. Answer **b** is correct; the *-i* causes
    *grep* to ignore case, thereby finding all occurrences—even those that are capitalized.
    Answer c is incorrect; it would ignore case but would return lines containing
    the string *dog* contained in other words as well. Answer d is incorrect; this
    would return the number of lines containing the pattern *dog*.


    9. As part of your backup strategy, you want to back up the `/home` directories
    to `/backups` on another partition. You would


    +   * a. `tar -cf /backups/HomeBackUp.tar home/*`

    +   * b. `cp /home/* /backups/`

    +   * c. `cp -P /home /backups`

    +   * d. `tar -xf /backups/HomeBackUp.tar home/*`


    Answer **a** is correct; the *-c* option creates the tar file and *-f* gives it
    a name. Answer b is incorrect; this would copy the first level of directories
    only. Answer c is incorrect; although this would make a copy of the files it is
    not the best way. Answer d is incorrect; this would restore the files in the `/backups/HomeBackUp.tar`
    to their original location.


