- pgno: 44
  md: '# CHAPTER


    2


    # CHAPTER PREREQUISITE


    Before beginning this chapter you should have a solid understanding of using documentation
    as covered in Chapter 1, “Finding and Creating Documentation.” In addition, you
    need to have a working system that successfully boots into Linux.


    # Booting Linux


    # WHILE YOU READ


    +   1. How can you boot multiple operating systems on your Linux computer?


    +   2. What is the purpose of the file \varlinux-2.0.36-0.7?


    +   3. How should you approach doing some system maintenance work?


    +   4. What is the purpose of the file /etc/inittab?


    +   5. You install a UPS on your computer. What else should you do?


    +   6. When booting your machine, you get LIL and then your system hangs. What
    could the problem be?


