    # expand


    The expand utility is used to change tabs to a specified number of spaces. The
    syntax for expand is


    ```

    expand [options] file

    ```


    By default, each tab is considered to be eight spaces. Use the `-t` to designate
    another value or provide a list of integers to define where each tab is to be
    placed. You can use the `-i` option to convert only tabs at the beginning of the
    line.


    # fmt


    The fmt utility is used to perform simple text editing. fmt’s main purpose it
    to try to make all the lines the same length by joining or splitting lines. Its
    syntax is


    ```

    fmt [option] filename

    ```


    fmt does not change the original file, but instead sends its results to the standard
    output. If you want to format a file so that each line is 70 characters long,
    issue the following command:


    ```

    fmt -70 MyFile

    ```


    This prints the file to the screen with each line approximately 70 characters
    long. If a line length is not specified, fmt defaults to 75 characters.


    fmt attempts to split lines at the end of a sentence if possible. Also, it will
    not break lines after the first word or before the last word of a sentence.'
