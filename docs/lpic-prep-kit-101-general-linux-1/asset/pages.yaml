- pgno: 132
  md: 'The size of the HISTFILE is determined by the HISTFILESIZE variable, which
    defines the number of lines to be contained in the HISTFILE.


    When you exit an interactive shell, the number of lines defined by the HISTSIZE
    variable is copied from the history list to HISTFILE. If the histappend shell
    option is set, the lines are appended to the history file; otherwise, the history
    file is overwritten.


    If HISTFILE is unset, or if the history file is unwritable, the history is not
    saved. The file is truncated to contain no more than the number of lines defined
    by HISTFILESIZE unless HISTFILESIZE is not set, in which case no truncation is
    performed. The number of saved events and whether they are carried over to the
    next login session is configurable. Table 5.5 shows the three variables that configure
    your history and what each variable does.


    | Variable | Defines |

    |---|---|

    | HISTSIZE | The number of events to preserve during a session |

    | HISTFILE | Filename in which to save your history list; used to initialize the
    history list at next login |

    | HISTFILESIZE | Number of events to save for the next login session |


    **Table 5.5** **Environment Variables that Define Your History**


    You can review your history list by typing


    ```

    history

    ```


    which displays all the events in your history, or


    ```

    history 10

    ```


    which would display the last 10 events.


    When displaying your history, which can be quite long, pipe it through a pager
    such as less, or, if you are using the bash shell, use the Shift+PgUp and Shift+PgDn
    keys to scroll through it. You also can use the up and down cursor (arrow) keys
    to review the most recent events, edit the command, and reexecute it by pressing
    the Enter key.


    You can control which commands are saved in your history list with the HISTCONTROL
    and HISTIGNORE variables.


    # Key Concept


    A record or history of what commands you type is kept by the shell. Three environment
    variables that define how much of this history is kept and where it is kept are
    HISTSIZE, HISTFILE, and HISTFILESIZE.'
