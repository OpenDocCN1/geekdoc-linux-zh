  md: '# **fc**


    Use the *fc* built-in command to display your history file. It also can be used
    to edit and rerun commands. Use the `-1` option to display a portion of your history
    list. To display the last 16 events you would type


    ```

    ```

    fc -1

    ```

    ```


    or to display the events numbered 100–103 you would type


    ```

    ```

    fc -1 100 103

    ```

    ```


    You also can define patterns to use to search your history. To display a range
    of events starting with the first event that begins with *cat* until the first
    event starting with *man*, type


    ```

    ```

    fc -1 cat man

    ```

    ```


    You also can search for and display events by specifying the event number. To
    see event number 111, type


    ```

    ```

    fc 111

    ```

    ```


    The *fc* command can be used to edit commands in your history list by using the
    `-e` option. *fc* uses *vi* as its editor. You can change that by assigning a
    new value to the `FCEDIT` environment variable:


    ```

    ```

    export FCEDIT=/usr/bin/joe

    ```

    ```


    *fc* also enables you to reexecute a command by using the `-s` option. To reexecute
    the previous command, type


    ```

    ```

    fc -s

    ```

    ```


    or to reexecute a specific command, type


    ```

    ```

    fc -s 111

    ```

    ```


    # ## Command Substitution


    *Command substitution* refers to replacing a command with its output. Typing `pwd`
    will result in the shell displaying your working directory. You can get the same
    results using command substitution. Two examples are


    ```

    ```

    echo $(pwd)

    /home /hadden


    echo `pwd`

    /home /hadden

    ```

    ```'
