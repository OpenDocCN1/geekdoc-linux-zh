    # PRACTICE TEST


    +   1. On a system with 8MB of RAM, what is the minimum and maximum recommended
    sizes of the swap partition?

    +   a. 8MB minimum, 16MB maximum

    +   b. 8MB minimum, 128MB maximum

    +   c. 16MB minimum, 16MB maximum

    +   d. 16MB minimum, 128MB maximum

    +   Answer a is incorrect; the swap partition should be equal to twice the amount
