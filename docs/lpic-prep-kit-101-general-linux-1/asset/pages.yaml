    # Input and Output


    Almost every command can get information passed to it by way of standard input
    (*stdin*). This usually is via the terminal, such as when you type a command.
    However, input can also come from a file.


    In addition, each command has two types of output: standard output (*stdout*)
    and standard error (*stderr*). *stdout* is the results of the command, whereas
    *stderr* is where any error messages are sent. By default, both of these are directed
    to the display, but either or both of these streams can be redirected to a file.


    The shell manages how standard input and standard output are handled. By default,
    your shell directs standard output and standard error from the command to the
    device file, which is associated with your terminal and causes it to appear on
    your display. In the same manner, the shell directs standard input from your terminal,
    or keyboard, to the command.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'Consider the command cat. If you type only cat <enter>, the standard input
    comes from the keyboard and the standard output goes to the display. In other
    words, what you type appears on your display.


    After you press Ctrl-d, you signal to the cat command that the input is finished.
    cat then returns control to the shell and your prompt returns. If, however, you
    type cat MyFile, the input is the file MyFile and the output again goes to your
    display.


    # ## Redirection and Pipes


    *Redirection* is the method of altering the source for standard input or where
    to send out- put. The > can be used to define where to send standard output and
    < can be used to redirect standard input.


    What if you type cat file1 > file2? This is an example of using redirection. The
    input comes from file1, the output goes to file2, and nothing appears on your
    display.


    This affects only standard output. If any errors had occurred, those messages
    would have been sent to your display and not to file2. To redirect both the stdout
    and stderr, use the greater than sign (>) followed by the ampersand (&), as in
    the following:


    ```

    cat file1 file2 >& error-msg

    ```


    This example will send both the standard output and any error messages to the
    file called error-msg. If you are using the bash shell, you also can use


    ```

    cat file1 file2 &> error-msg

    ```


    to do the same thing.


    The shell assigns the number 0 to the standard input, the number 1 to the standard
    out- put, and the number 2 to the standard error output. You can use these numbers
    when using redirection. To save the error messages and discard the regular output,
    type


    ```

    cat file1 file2 2> error-msg

    ```


    If you wanted to redirect both standard output and standard error, you could type


    ```

    cat file1 file2 1> MyFile 2> error-msg

    ```


    When redirecting output to a file, any existing file with the same name will be
    overwrit- ten. If you do not want to overwrite the existing file, use >> to append
    the new informa- tion to the existing file.


    Sometimes you might not want to save the output of a command, whether it be standard
    output or standard error. This can be accomplished by redirecting the output to
    the /dev/null device. The output then disappears without a trace, as in the following:


    ```

    cat file1 file2 >& /dev/null

    ```'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Another use of /dev/null is to zero out an existing file. In other words, you
    could type


    ```

    cat /dev/null > MyFile

    ```


    This replaces the contents of *MyFile* with a null string but keeps the file''s
    permissions intact.


    Another useful device is the pipe (|). The shell uses the pipe to send the standard
    output of one command as standard input to another command. Using a pipe enables
    you to be more efficient by eliminating intermediate steps.


    Say you want to create an alphabetized listing (that is not case sensitive) of
    all the files in your directory. You could first create a file containing a list
    of all your files by typing


    ```

    ls -A * > filelist

    ```


    Then, use the sort command to alphabetize it:


    ```

    sort -i filelist > AlphaFilelist

    ```


    And finally, delete the file *filelist*. A quicker, more efficient method would
    be to use a pipe, thus eliminating the need for a temporary file altogether.


    ```

    ls -A * | sort -i > AlphaFilelist

    ```


    Here you perform a directory listing of all files except . and .. and send that
    output as input to the sort command. The sort command ignores case and alphabetizes
    the list. Finally, the sort command sends its output to the file called *AlphaFilelist*.


    What if you wanted to print the file list instead of saving it to a file? You
    could use a filter instead of the pipe used previously. A filter takes the output
    from one command and sends it to another command. The command


    ```

    ls -A * | sort -i | lpr

    ```


    uses *sort* as a filter by processing the output of the first command, *ls*, and
    then sending its output as input to the second command, *lpr*.


    # Key Concept


    *stdin*, *stdout*, and *stderr* can be redirected by using the < and > pipes.
    The pipe (|) is used to define a filter by taking the *stdout* from one command
    and sending it as *stdin* to another.


    # tee Utility


    Another way to redirect output is by using the *tee* utility. *tee* simultaneously
    sends the output of a command to a file and to standard output, which can be either
    the display or a pipe to another command. The syntax for *tee* is'
  merge: -1
  img_proc: true
- pgno: 217
  md: '```

    tee [options] files

    ```


    So, if you wanted to view the output as well as save it to a file you could type


    ```

    ls -A * | sort -i | tee AlphaFileList

    ```


    This command would display the sorted file list as well as save it to AlphaFileList.
    If you want multiple copies of the file, tee will accept multiple filenames as
    arguments. You also can append the output to an existing file instead of replacing
    that file by using the -a option with tee.


    # xargs


    The xargs command passes arguments from one command to another command. It enables
    the receiving command to handle more arguments than it normally could process.
    Most frequently, the arguments are numerous, such as a list of filenames generated
    by ls.


    You can cause xargs to run interactively by using the -p option. This causes xargs
    to ask for confirmation before executing each command.


    Pipes are very powerful, and you will see them used throughout the exam. They
    can be either simple or complex as shown in the following example:


    ```

    find *.doc | xargs cat | tr '''' ''\n'' | sort | uniq | tee dict | less

    ```


    This command finds all the files in your directory that end with .doc and pipes
    those names to xargs. xargs then passes the filenames to cat, whose output is
    sent to tr. tr then changes each space to a carriage return. Next, the output
    is sorted (sort) and duplicates discarded (uniq). tee saves the stream to a file
    called dict, which is displayed using the less pager.


    # Summary


    This chapter has covered an important group of tools referred to as text filters.
    Each of these is important to you when studying for the exam. sed is especially
    useful when writing scripts, so know it well. cut and paste are useful for rearranging
    text files by columns. Both head and tail are useful in obtaining a quick look
    at files.


    For formatting text, be familiar with the pr, fmt, nl, and expand commands. You
    also can be sure you will see a question or two involving the sort command.


    The use of redirection and pipes enables you to build complex commands to increase
    your efficiency. Be sure you understand the use of the tee and xargs commands.'
  merge: -1
  img_proc: true
