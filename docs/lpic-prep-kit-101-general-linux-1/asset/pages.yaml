  md: '| Option | Action |

    | :--- | :--- |

    | a | Adds after the specified line |

    | b | Adds before the specified line |

    | d | Deletes the specified line |

    | c | Replaces the specified line with the following |


    The d and c options enable you to specify a range of lines. The c option replaces
    lines by first inserting the text before the lines and then deleting the lines.
    Because these commands are used to manipulate larger sections of text, they are
