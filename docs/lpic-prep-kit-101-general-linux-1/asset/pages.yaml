    # ### Command-Line Completion


    Another helpful feature of the `bash` shell is command-line completion. You can
    use the Tab key to complete words you are entering on the command line.


    If you are typing the first word on the command line when you press the Tab key,
    `bash` looks for a command that starts with what you have typed so far. If one
    is found, it completes the word. If more than one is found, it beeps. Press Tab
    again to see a list of available commands.'
