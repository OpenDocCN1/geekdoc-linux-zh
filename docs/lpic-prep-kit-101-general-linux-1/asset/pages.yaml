- pgno: 54
  md: 'Be sure to run this command every time you make any changes to the configuration
    file. If you do not run `/sbin/lilo` then the changes you made will not be read.
    You also will need to run it if you change the configuration of your system, including
    changing any partitions of your hard disk.


    # **Key Concept**


    Any changes made to LILO do not take effect until you reinstall LILO by executing
    the `/sbin/lilo` command.


    # # Troubleshooting LILO


    As LILO is loaded, it displays the word LILO one character at a time, which serves
    as a way to identify errors with LILO. By noting how many characters get displayed,
    you will have a good starting point to determine what went wrong. Table 2.5 shows
    the possible problems that can prevent LILO from fully loading.


    Table 2.5 Using the Characters Displayed for Troubleshooting LILO


    | Characters | Meaning |

    | :--- | :--- |

    | nothing | LILO was not loaded; could not be installed or partition is not active
    |

    | L *errorcode* | Usually a media failure |

    | LI | First stage completed but second stage was not executed; can be caused
    by geometry mismatch or inability to find `/boot/boot.b` |

    | LIL | Both the first and second stage loaders started but cannot load the map
    file; usually a media failure |

    | LIL? | Second stage loader loaded at incorrect address; geometry mismatch or
    inability to locate `boot.b` file |

    | LIL- | Corrupt descriptor table; geometry mismatch or inability to locate the
    map file |

    | LILO | LILO successfully loaded |



    Occasionally you might see hexadecimal digits after the first L. These are randomly
    generated and usually indicate a temporary disk problem. If LILO loads, this is
    not a severe problem but you should take note of it and run fsck as soon as possible.'
  merge: -1
  img_proc: true
- pgno: 55
  md: "# ## Shutting Down Linux\n\nYou should never just turn off your Linux system.\
    \ If the kernel is not allowed to write memory buffers to the disk, you could\
    \ end up with a corrupted filesystem.\n\nLinux maintains the most recent changes\
    \ to inode tables and the hard disk in RAM due to its faster speed. If you power\
    \ off before this information is written to disk then you will lose this data.\n\
    \nIf you power off during a write process, this can result in lost files or incorrect\
    \ information on the status of disk space. The same thing can happen if active\
    \ processes are writing to disk and are not stopped cleanly, resulting in corrupted\
    \ data and possible disk crashes.\n\n> **Key Concept**\n> \n> Do not ever just\
    \ turn off your computer. You could end up with a computer that will not boot\
    \ depending on what the operating system is doing at the time you power down.\n\
    \nTo shut down your system, you should use the `shutdown` command. Its syntax\
    \ is\n\n```\nshutdown [options] when [message]\n```\n\nThe `shutdown` command\
    \ terminates all processes by sending them a SIGTERM signal. Next, `/etc/init`\
    \ is called to change the runlevel and unmount the filesystems.\n\nThe `shutdown`\
    \ command requires time to commence shutting down the system. This can be in the\
    \ format hh:mm, an amount of time to wait such as +15, or the word `now` to shut\
    \ down immediately.\n\nThe message is sent to all logged on users periodically\
    \ until the shutdown process begins. If a message is not specified, a default\
    \ message is sent.\n\nThere are several options that can be used with the `shutdown`\
    \ command. They are listed in Table 2.6.\n\n**Table 2.6 Options That Can Be Used\
    \ with the shutdown Command**\n\n| Option | Action |--------------------------------|\n\
    \n+   - -c Cancel a shutdown process that is in progress\n+   - -f Do not run\
    \ fsck on reboot\n+   - -F Force fsck on reboot"
  merge: -1
  img_proc: true
- pgno: 56
  md: '| Option | Action |

    | :--- | :--- |

    | -h | Halt the system after shutdown is finished |

    | -k | Send a warning message but do not shut down the system |

    | -n | Shut down without calling init |

    | -r | Reboot after shutdown is complete |

    | -t seconds | Indicates period of time to delay after killing processes before
    calling init |


    Only root can run the shutdown command unless the /etc/shutdown.allow file exists.
    Any user listed in this file can shut down the system.


    Do not turn off the power until the shutdown process has completed and you see
    the message


    The system is halted


    > **Key Concept**

    > You can control who has the ability to shut down your system by using the /etc/shutdown.allow
    file. By default, no one except root can shut down your system. This file gives
    you the ability to allow others to shut it down.


    There are two other commands that you can use to bring down your system. They
    are the halt and reboot commands. The options that can be used with these commands
    are listed in Table 2.7.


    **Table 2.7 Options That Are Used with the halt and reboot Commands**


    | Option | Action |

    | :--- | :--- |

    | -d | Do not write to the /etc/log/wtmp file; implied with -n |

    | -f | Do not call shutdown but force a halt or reboot |

    | -i | Shut down the network interfaces before shutting down |

    | -n | Do not run sync before reboot or halt |

    | -p | Do a power off after the shutdown |

    | -w | Do not bring the system down, just write to the /var/log/wtmp file |


    When you call either the halt or reboot command, it first checks the runlevel.
    If the system is in runlevel 0 or 6, the command runs. If the system is in any
    other runlevel, the command calls shutdown -nr. Neither halt nor reboot sends
    a message to logged on users or delays before executing.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Because Linux runs on PCs, pressing the `Ctrl-Alt-Del` key combination is the
    same as pressing the power button, leading to an unstable system. This can be
    prevented by trapping this key combination and calling the `shutdown` command.
    The lines


    ```

    # Trap CTRL-ALT-DELETE

    ca::ctrlaltdel:/sbin/shutdown -t3 -r now

    ```


    in the `initab` file does just that. Be sure to verify that this capability is
    included in your version of Linux before using it.


    # ## Summary


    This chapter has covered some important information. You will need to understand
    the boot process for the test. The steps are


    +   - Uncompress the kernel

    +   - Load the kernel into RAM

    +   - Write boot messages to the system log

    +   - Call init

    +   - Process any `rc` scripts


    LILO is a boot loader that many people use to control the booting process for
    Linux. You configure it with the file `/etc/lilo.conf`. If you are using modules,
    these are defined in either `/etc/modules.conf` or `/etc/conf.modules`, depending
    on your distribution.


    You need to understand the format of the `/etc/inittab` file. Its fields are `ID`,
    `runlevel`, `action`, and `process`. In order to make changes, first edit your
    configuration file, stop the `syslogd` daemon, and then restart it. You can specify
    a configuration file other than the default if you want.


    Runlevels are a set of processes necessary for your system to run in a certain
    mode. The default runlevel is defined in `syslogd`''s configuration file and can
    be changed using either the `init` or `telinit` command.


    When shutting down your system, do not just power off. Use the `shutdown`, `reboot`,
    or `halt` command instead. Because incorrectly shutting down your system can lead
    to a corrupted filesystem, you will probably see at least one question covering
    this issue.


    You have several files that are used for saving system messages. The most important
    one is `/var/log/messages`. You can use the file when troubleshooting the boot
    process.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# QUESTIONS AND ANSWERS


    +   1. How can you boot multiple operating systems on your Linux computer?

    +   A. You can have different operating systems installed on different partitions.
    You will then need some method of selecting which operating system to start. One
    of the most common is LILO.


    +   2. What is the purpose of the file vm1inux-2.0.36-0.7?

    +   A. This is the compressed kernel. The numbers refer to the version and patch
    level.


    +   3. How should you approach doing some system maintenance work?

    +   A. You want to change the runlevel to single-user mode. So, you need to send
    a message to all logged on users telling them to log off, and then you can use
    either the init or telinit command to change the runlevel.


    +   4. What is the purpose of the file /etc/inittab?

    +   A. The /etc/inittab file is the configuration file for init. It provides the
    information init needs to boot the system.


    +   5. You install a UPS on your computer. What else should you do?

    +   A. After installing the UPS and any needed software, you will need to tell
    init what to do when it receives a power failure signal. Do this by adding the
    appropriate lines to the /etc/inittab file.


    +   6. When booting your machine, you get LIL and then your system hangs. What
    could the problem be?

    +   A. The LIL indicates the progress that LILO has made in loading. The three
    letters indicate that there is a corrupt descriptor table preventing LILO from
    locating the map file or there is a geometry mismatch.


    +   7. Can you use Ctrl-Alt-Del to reboot your computer?

    +   A. Yes and no. The ability to use the Ctrl-Alt-Del key sequence exists if
    this key combination is trapped by init.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_58_0.png)


    ...continues'
