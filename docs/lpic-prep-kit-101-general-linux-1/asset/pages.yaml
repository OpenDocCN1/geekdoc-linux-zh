    +   - which sort

    +   - whatis sort

    +   - apropos sort


    # ## Lab 2: Booting


    Understanding the boot process is important, especially when troubleshooting.
    You should know what happens and how to customize this process.


    # #### Boot Messages


    You can examine the system messages by using the dmesg command. Type dmesg at
    a command prompt immediately after booting your system. Look at the display to
    see whether you have any error messages. Also look to see what devices were loaded
    at boot.


    # #### inittab


    Look at the /etc/inittab file. What are the defined runlevels for your system?
    What is your default runlevel? Which line defines it? This file is fairly straightforward.
    If you have problems answering these questions, review Chapter 2, “Booting Linux.”


    Type init S at a command prompt. This changes the runlevel to single-user mode.
    Now use the init command to return to your default runlevel.


    What are the default scripts that are run at boot? How did you identify them?
    Look at the rc scripts to identify which are run when you boot.


    Edit the /etc/inittab file to change your runlevel. Be sure to make a copy of
    the original before making any changes. Now issue the init q command to force
    init to reread the configuration file.


    Be sure to change back to your original runlevel unless you want the default runlevel
    to stay changed.'
