    and make the appropriate changes.


    Sometimes you try to run a command and get the error message command not found.
    When you enter a command, the shell searches the directories defined in the PATH
    environment variable. If the command you typed is not found, you get the error
    message.


    There are two ways to run a command that is not located on your path. The first
    is to give either a relative or absolute path to the command, such as


    ```

    /home/hadden/bin/MyCommand

    ```


    If the command is in your working directory, you can type


    ```

    ./MyCommand

    ```


    or, if the command is in your home directory, you can use


    ```

    ~/MyCommand

    ```


    The tilde (~) is interpreted by the shell and expanded to be the absolute path
    to your home directory.


    If you have a command that you frequently run, you can either move the command
    to a directory that is on your path or add the path to the directory to your PATH
    variable.


    When adding directories to your path, you need to consider the ramifications.
    You could add your home directory by adding . at the end of your path. However,
    this is a potential security problem. Someone could place a script in a world
    writable directory that you might inadvertently run while logged in as root. This
    script could run without you ever knowing and perhaps give someone root privileges
    without you ever being aware that it happened.


