- pgno: 196
  md: '# QUESTIONS AND ANSWERS


    1. When checking out the various files on your system, you look at the contents
    of the file /etc/passwd. What does each line mean?


    A. Each line of the /etc/passwd file contains information on one user account.
    The fields contained in this line (in order) are username, password, UID, GID,
    comment, home directory, and login command.


    2. How can you change the password for multiple users at one time?


    A. You can change the passwords of multiple users by giving the chpasswd a file-name
    as an argument. This file contains one username/password combination per line.
    The username and password must be separated by a colon.


    3. You are creating new users by editing the /etc/passwd file but do not have
    each user''s full name. What should you do?


    A. Normally, you would place the user''s full name in the comment field. If you
    do not know the name for one of the new accounts you are creating, you can leave
    it blank. However, be sure that the colon is there as a placeholder for that field.


    4. Your boss tells you to implement shadow passwords on the system you are administering.
    How do you do it?


    A. All you will need to do is issue the command pwconv. This will read the /etc/passwd
    file, change all the password fields to x, and create a /etc/shadow file containing
    the newly encrypted passwords. Make sure that this file is readable only by root.


    5. You are planning on using the useradd command to create new accounts, but first
    you want to know what the default actions will be. How can you find this out?


    A. To see what system defaults the useradd command will use, simply type useradd
    -D at a command prompt. It will then display the values that have been set as
    system defaults.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '+   6. You need to limit access to the payroll records to only three people.
    What is the best way to do this?

    +       A. The first thing you will want to do is to create a new group and make
    these three people members. Next, set the appropriate access rights on the payroll
    records so that only the members of this group have rights to access them.

    +   7. You want each new user to have his own `.profile` file. What is the best
    way to make sure this happens?

    +       A. You could copy the file to each new user''s home directory and then
    set the appropriate permissions. However, an easier way is to let the `useradd`
    command copy the file and set the permissions. Just copy the `.profile` file to
    `/etc/skel` and use the `-m` option when using the `useradd` command to create
    the new user account.

    +   8. You have installed a new application in its own directory and want to make
    it available for all your users. What should you do?

    +       A. First, grant the appropriate permissions. However, users keep calling
    you and complaining that when they try to run the application, they get an error
    message that the command could not be found. Edit the `/etc/profile` file and
    change the path to include the directory of the new application. Now when your
    users attempt to run the application, the system will be able to find it.


