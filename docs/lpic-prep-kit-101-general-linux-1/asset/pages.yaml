  img_proc: true
- pgno: 261
  md: 'The lastlog command is used to display the contents of /var/log/lastlog. If
    no options are used, lastlog displays the lastlog entries ordered by the UID.
    Using the -t option will cause lastlog to display all logins during the last specified
    number of days. You also can use the -u option to display the specified user''s
