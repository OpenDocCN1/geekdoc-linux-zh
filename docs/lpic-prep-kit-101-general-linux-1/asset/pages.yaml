  md: '# LILO


    If your computer is using LILO as your boot loader, look at your configuration
    file. The default is `/etc/lilo.conf`. Do you have any other operating systems
    installed? If so, do you use LILO to start them?


    Edit your `/etc/lilo.conf` file to change the label on your default operating
    system and reboot your computer. When the `BOOT:` prompt appears, press the Tab
    key to see your choices. Type the new label to start your system.


    # Shutting Down Your System


    Issue the `shutdown -k` command. What happened? You should see a warning that
    the system is being shut down, but it will stay up.


    Is your computer configured to trap the Ctrl+Alt+Del key combination? Where did
    you look to find this out? If your computer is configured to trap this combination,
    you should see it in the `/etc/inittab` file.


    # Lab 3: Disk Space


    This exercise is designed to make you comfortable with your partitioning scheme.
    In addition, you will learn how to monitor your disk space use.


    Use the `fdisk` command to see how your disk is partitioned. Type `fdisk` at a
    command prompt. When you get the `fdisk` prompt, type `p` to get a listing of
    your partitions. Do you understand the partition naming scheme? If not, review
    Chapter 3, “Linux Filesystem.”


    If you have available free space, create a new partition in this space using the
    `fdisk` command. Be very careful that you do not destroy any existing data.


    Format a floppy disk by using the `fdformat /dev/fd0` command. Save a file to
    it and then read the file. You might need to be logged in as root depending on
    how your system is configured.


    Perform a listing of the `/proc` directory. What do you see? Remember that this
    is a virtual directory and is a method for you to access the information in memory.
    You should be able to identify the amount of RAM in your system from this listing.


    Type `du` at a command prompt. What information is displayed? Also try using the
    `df` command. What is the difference between the two? The `du` command shows occupied
    space, and the `df` command shows size and usage by partition.'
