    \ logrotate command automates the process of saving and removing the contents\
    \ of your log files. One or more configuration files can be used to define how\
    \ logrotate handles each log.\n\n# Archiving Logs\n\nNow that you have configured\
    \ logrotate to handle logs the way you want, you need to decide how long you will\
    \ keep old logs. In some instances, you might want to keep some logs for a year\
    \ or so.\n\nIn the earlier configuration file, logrotate was configured to keep\
    \ logs for four weeks. After you have four weeks worth of logs, the oldest log\
    \ is discarded and log.3 becomes log.4, log.2 becomes log.3, log.1 becomes log.2,\
    \ and the current log is log. You now have four old logs (log.1, log.2, log.3,\
    \ and log.4) as well as the current log."
  merge: -1
  img_proc: true
- pgno: 264
  md: "At any one time, you have the current log and the prior four weeks’ logs. What\
    \ if you want to keep information for six months?\n\nWhen running a Web server,\
    \ you might want to retain your logs for six months to document attempts to breach\
    \ your system. Your organization might want to keep records of when users log\
    \ in and log out for several years. How many logs and how long you keep them will\
    \ be different based on your organization’s policies.\n\nOne way to keep logs\
    \ for a long time would be to increase the number of logs that are kept. However,\
    \ this could soon fill up your disk, especially if you want to keep logs for several\
    \ months or years.\n\nA better plan would be to move the older logs to another\
    \ location. You might even want to move them offline to a tape or other media.\
    \ Chapter 11, “Backup and Restore,” covers managing backups in more detail.\n\n\
    You can use the **prerotate** command in your configuration file to run a script\
    \ that will move the oldest log before rotating the logs. In this manner, you\
    \ can keep logs for as long as you want and have the space to store them.\n\n\
    > **Key Concept**\n> \n> The **logrotate** command can be configured to keep as\
    \ many logs for as long as you want. However, in order to save space, consider\
    \ moving older logs to another location. The **prerotate** command can be used\
    \ to move older logs before rotating. This saves space while still saving logs\
    \ for an extended period of time.\n\n# # Using Logs to Troubleshoot\n\nOne of\
    \ the most frequent uses for log files is troubleshooting your system. To diagnose\
    \ problems when booting your system, you can use the **dmesg** command to display\
    \ system messages from the kernel ring buffer. The syntax for **dmesg** is\n\n\
    ```\n```\ndmesg [options]\n```\n```\n\nIf you want to review a specific level\
    \ of message, you can use the `-n level` option. If you want to see only panic\
    \ messages, then use the following command:\n\n```\n```\ndmesg -n 1\n```\n```\n\
    \nAlthough other messages will not be displayed, they will still be recorded and\
    \ **syslogd** will continue to save them to the appropriate logs. Each level of\
    \ message is defined in the **kernel.h** file. Check the one on your system to\
    \ identify what the values are for your system."
  merge: -1
  img_proc: true
- pgno: 265
  md: 'Use the `-o` option to clear the buffer after displaying its contents. If you
    use both the `-n` and `-c` options, the first one will be ignored no matter what
    order you specify them in.


    You also can use log files when you suspect an intruder has invaded your system.
    The log files `/var/log/wtmp`, `/var/log/utmp`, and `/var/log/lastlog` all contain
    information on users who have logged on to your system. These logs can be read
    directly or through the use of commands such as the `lastlog` command.


    # ## Summary


    This chapter has covered how to schedule a job to run once or automate repetitive
    tasks through the use of the `at` and `crontab` commands. `at` runs a job only
    once. If called as `batch`, it waits for the system load to fall before running.


    The `crontab` command is used to run the same job on a regularly scheduled basis
    based on time. The fields are minute, hour, day of month, month, and day of week
    followed by the command to be run. Be sure you know the fields and their order
    for creating cron jobs.


    The `syslogd` daemon is responsible for writing messages to the specified log
    files. This information is contained in the `/etc/syslog.conf` file. When changing
    the configuration, `syslogd` must be stopped and restarted so that it will read
    the new configuration information. You can send a signal to `syslogd` to stop
    and then restart it.


    Information on your users'' logins is contained in the `/var/log/wtmp`, `/var/log/utmp`,
    and `/var/log/lastlog` files. Access these logs either directly or through the
    use of the `last`, `who`, `w`, `finger`, and `lastlog` commands.


    How many logs you keep and for how long is a function of your organization''s
    policies. Plan for how to configure them and where to store them to prevent running
    out of disk space.'
  merge: -1
  img_proc: true
