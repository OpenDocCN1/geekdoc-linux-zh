- pgno: 286
  md: 'The w option places tar in interactive mode. You then are asked on a file-by-file
    basis whether to extract each file. If the tar file contains a large number of
    files, this can take a long time.


    Remember that tar has the capability to accept a list of filenames as arguments.
    The second way to restore a file requires that you know its name. If you know
    the name of the file you want to extract, you can pass it directly to tar:


    ```

    tar xf myarchive.tar myfile

    ```


    Be careful when using this option. Although the tar command will not overwrite
    directories, it will overwrite any existing file with the same name. In order
    to prevent this behavior, use the k option, which will leave any existing files
    intact.


    Many people use tar to manage their backups. Two options that make this so functional
    are the u and r options. The u option causes tar to update or append the specified
    file to an existing tar file. The r option appends a new file to an existing tar
    file. Both of these options require you to specify the existing tar file’s name
    as well as the file you want to update or append.


    # cpio


    The copy in and out (cpio) command also can be used to manage archives. It has
    three modes of operation:


    +   • Create an archive containing multiple files

    +   • Restore files from an archive

    +   • Copy a directory hierarchy to a new location


    The basic syntax for the cpio command is


    ```

    cpio [options]

    ```


    Table 11.3 shows the major options that can be used with the cpio command. You
    must use one and only one of these.


    **Table 11.3 Major Options to Be Used With the cpio Command**


    | Option | Action |

    | :--- | :--- |

    | -o | Creates a new archive |

    | -i | Extracts from an existing archive |

    | -p | Copies a directory structure |'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'Additional options available with cpio are listed in Table 11.4. Not all of
    these will work with each of the major options.


    **Table 11.4 Additional Options to Use with cpio**


    | **Option** | **Action** |

    | :--- | :--- |

    | -a | Resets access times of files after copying them |

    | -d | Creates directories as needed; used with -i or -p |

    | -e filename | Specifies a file containing a pattern; used with -i |

    | -F archivename | Names of archive to extract; used with i |

    | -m | Preserves modification times of files; used with -i |

    | -r | Prompts you for new name for file before copying the file; if no name is
    given, file is not copied |

    | -t | Lists contents of archive; used with -i |

    | -u | Overwrites existing files |

    | -v | Lists all files as processed; used with all three modes |


    To create a new archive, you must pass the names of the files to cpio. To create
    an archive of all the files in the /home directory, type


    ```

    find /home | cpio -o > home.cpio

    ```


    This command uses the output of the find command to provide a list of filenames
    to be included in the archive. To verify the contents of the archive, you could
    then type


    ```

    cpio -itf home.cpio

    ```


    The -i option places cpio in extract mode, and the -t option causes cpio to display
    the names of the files but not to extract them. The -f is used to specify the
    name of the archive to examine.


    To extract a specific file from the archive, you need to supply a pattern or filename
    to match. For example, to extract the file memo.acct from the home.cpio archive,
    type the following:


    ```

    cpio -if home.cpio memo.acct

    ```


    # # Compressing and Uncompressing Files


    Many utilities are available to compress and uncompress files. The most commonly
    used include gzip, gunzip, tar, and sometimes compress. You need to know how these
    work and how they are used because you will see them on the exam.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# gzip


    Files frequently are compressed to save storage space or transmission time when
    copying or moving from one computer to another. In addition, backups are compressed
    to reduce the amount of media that will be needed.


    In the DOS/Windows world, this is accomplished by using the pkzip/pkunzip utilities.
    In the Linux world, the preferred format is gzip/gunzip, which creates a file
    with the .gz extension. Some differences exist between gzip/gunzip and pkzip/pkunzip,
    however:


    +   - gzip does not compress more than one file

    +   - gzip and gunzip automatically delete the original file


    After using the tar command to create an archive, you might want to compress your
    file. You can use tar and gzip to create a compact backup, leaving you with the
    original directory structure and files intact inside a tarred and gzipped file.


    The syntax for gzip is


    ```

    gzip [options] [file-to-zip]

    ```


    Table 11.5 lists options that are used with the gzip and gunzip commands.


    | **Option** | **Action** |

    | :--- | :--- |

    | -c | Displays file contents without deleting compressed file; used with -d or
    gunzip |

    | -d | Uncompresses file; same as gunzip |

    | -n | Does not save original date and timestamp |

    | -N | Saves original name and timestamp; default action |

    | -q | Suppresses warnings |

    | -r | Recursively compresses files in specified directory; if used with -d or
    gunzip will recursively uncompress files |

    | -t | Tests integrity of compressed file; used with -d or gunzip |

    | -v | Prints name and percent compressed of each file; also can be used with
    gunzip |


    You can specify the amount of compression gzip will apply by using gzip -n. The
    accepted range is 1-9, with 1 being the fastest but with the least amount of compression.
    Using 9 causes the operation to take the most time but also results in the most
    compression.


    You can use gzip to compress the tar file myarchive.tar by typing


    ```

    gzip myarchive.tar

    ```'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'You also can combine these on the same command line using the pipe (|) character:


    ```

    tar -cf myarchive.tar . | gzip myarchive.tar

    ```


    This command first creates the *tar file* myarchive, which contains all the files
    in the *pwd*. Then, gzip compresses myarchive.tar, creating a new compressed file
    called myarchive.tar.gz. Lastly, gzip deletes the original file, myarchive.tar.


    Because both the original and compressed versions of the file are present at the
    same time, you must have enough room for both the compressed file and the non-compressed
    file to exist at the same time or the compression operation will fail.


    You can use another feature of the *tar* utility to gzip on-the-fly by using the
    *-z* option. The following example does the same thing, but requires fewer characters.


    ```

    tar -cvzf myarchive.tar.gz

    ```


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_289_0.png)


    > **Key Concept**

    > Remember, you will *tar* first, and then *gzip* to create an archive. *gzip*
    deletes the original file—in this case, myarchive.tar. The name of the file can
    end with .tar.gz or .tgz.


    # compress


    The compress utility is one of the oldest compression utilities. The compressed
    file must end in .Z and its syntax is


    ```

    compress filename

    ```


    This utility is not used much anymore because its compression is not as good as
    newer utilities such as gzip. To uncompress the file, type the following:


    ```

    uncompress filename.Z

    ```


    # gunzip


    Okay, you have all these compressed files. What do you do if you need to extract
    files? First, you must uncompress the *tar* file using *gunzip*.


    The syntax for *gunzip* is


    ```

    gunzip filename

    ```


    See Table 11.5 for options that can be used with *gunzip*. After *gunzip* has
    executed, you will have the original, uncompressed file. However, the compressed
    file is gone because'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'gunzip deletes the compressed file after uncompressing it. In addition, you
    can use the gzip command to uncompress the file by using the -d option.


    You can use tar to uncompress a compressed tar archive. Do this by using the z
    option. So, if you type


    ```

    tar xvzf MyArchive.tar.gz

    ```


    all the files contained in MyArchive.tar.gz will be restored, and the compressed
    file will still be there because tar does not erase the original file.


    # zcat


    The zcat utility works like cat, except it enables you to see the contents of
    a compressed file. It works with files compressed using gzip (.gz extension) or
    compress (.Z extension). Its syntax is


    ```

    zcat filename

    ```


    After zcat is finished displaying the file''s contents, the original file is not
    changed. It is still on your disk and it is still compressed.


    # Summary


    Planning and maintaining up-to-date backups is an important part of your job.
    You should take the time to plan and implement a backup strategy that is appropriate
    for your organization and that takes into account the cost of the backup strategy
    versus the cost of data loss.


    For the exam, you will need to know how to use tar to create archives and restore
    files contained in these archives. When creating a tar file, the original files
    are still left in place. Use the c option to create a new tar file and x to restore
    the tar file. Also, t can be used to display the contents of the tar file without
    extracting any of its files. It is important that you are aware of possible problems
    related to how path names are saved to a tar file.


    Another command that can be used to make backups is the cpio command. It can be
    used to back up or restore files, as well as to copy an entire directory hierarchy.
    You also will need to know how to use the compression utilities gzip, gunzip,
    and compress and how to use tar to compress your archives. Remember that gzip
    and gunzip delete the original file, whereas compress does not. Tar has the capability
    to compress while creating the new tar file.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# QUESTIONS AND ANSWERS


    1. Your server must be available to your users 24 hours a day, 7 days a week,
    but you need to add more hard disk space. What can you do?


    A. To install another hard disk, you will have to take your server offline. However,
    your users still need to access the server. In this situation, you should consider
    having a backup server. This would enable you to work on the original server while
    still providing access to your users.


    2. You have been given the job of planning the backup strategy for your Web server.
    What files should you back up and how often should you back them up?


    A. You should perform a full backup including system files on a regular basis—
    as often as once a week. On the other days, back up only the information that
    changes, such as the Web pages.


    3. You need to back up the employee database and keep the backups for five years.
    What would be the best way to do this?


