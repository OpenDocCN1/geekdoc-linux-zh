- pgno: 254
  md: 'You can specify ranges instead of specific days and times by using a hyphen
    (-). To specify non-inclusive values, use commas (,) to separate each value. If
    you wanted to run the script called myscript every Tuesday and Thursday at 1 a.m.,
    you would enter the following in your file:


    ```

    00 1 * \* 2,4 myscript

    ```


    After creating the file, you would need to install it by using the *crontab* command.
    After a job has been scheduled, it is referred to as a *cron job*. The syntax
    for the *crontab* command is


    ```

    crontab [options] [filename]

    ```


    The options that can be used with the *crontab* command are listed in Table 10.3.


    # **Table 10.3 Options to Be Used with the crontab Command**


    | Option | Action |

    | :--- | :--- |

    | -e | Creates or edits user''s *crontab* file |

    | -l | Displays user''s *crontab* file |

    | -r | Deletes user''s *crontab* file |

    | -u *username* | Specifies which user''s *crontab* file to act on; can be used
    only by root |


    The *crontab* command will create and install the cron file and save a copy of
    the original under the user''s name in /usr/lib/crontab.


    If you want to modify your cron configuration, edit this copy of the original
    file, and then install it using the *crontab* command as before. If you want to
    remove the file, use *crontab -r*.


    # Key Concept


    > Scheduling a job to run periodically entails first creating a file containing
    the commands and then scheduling it with the *crontab* command. Use *crontab -e*
    to edit the cron job or *crontab -r* to delete it.


    The *crond* daemon checks several files to see whether there are jobs to be run.
    The first of these files is the /etc/crontab file, which looks like the following:


    ```

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=root

    ```'
