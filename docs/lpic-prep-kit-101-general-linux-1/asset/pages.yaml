    +   What should you do?

    +   A. The most common problem is that the superblock is corrupted. First, you
    will need to boot your system from a floppy. Then, use the e2fsck command and
    one of the copies of the superblock to repair the damaged superblock.

    +   8. How can you determine whether or not the system you administer has an adequate
