  md: '# run-parts


    ```

    01 * * * * root run-parts /etc/cron.hourly

    02 4 * * * root run-parts /etc/cron.daily

    22 4 * * * 0 root run-parts /etc/cron.weekly

    ```


    These are directories containing jobs to be run on a regular basis. run-parts
    is a script that executes each script in the designated directory. Some of these
    are


    ```

    # ls -l /etc/cron.daily

    -rwxr-xr-x  1 root root  51 Jun 29  1998 logrotate

    -rwxr-xr-x  1 root root 102 Oct 11  1998 tetex.cron

    -rwxr-xr-x  1 root root  54 Sep 10  1998 tmpwatch

    -rwxr-xr-x  1 root root 557 Jul 29  1998 updatedb.cron

    ```


    Each of these files is a script that performs periodic routine tasks such as updating
    the locatedb file used by the locate command (refer to Chapter 6, “Maintaining
    the Filesystem”) and rotating system logs (see the section “Rotating Logs” later
    in this chapter).


    Another cron job that runs is the one that specifies when atrun is executed. This
    is necessary for at jobs to run. By default, atrun is executed every five minutes.
    You can change this to run more or less frequently or not at all.


    Next, crond looks for schedules for usernames in the /var/spool/cron directory.


    The crond daemon is responsible for running system and user cron jobs. It starts
    when Linux boots and wakes up every minute to see whether any jobs need to be
    run.


    When constructing your cron jobs, you can include comments by starting a line
    with a pound sign (#). Comments can’t be on the same line as a command. A sample
    comment might look like


    # mail any output to ‘hadden’


    Users can edit only their own cron jobs. Root can edit any user’s cron jobs by
    using the -u option.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_255_0.png)


    # **Key Concept**


    The crond daemon checks every minute to see whether there are any jobs that need
