- pgno: 99
  md: 'Both utilities enable you to search a file while viewing it. These two utilities
    are used most frequently to display the man (manual) pages. Additional information
    on using the manual pages and these two pagers is presented in Chapter 1.


    # ## wc


    Using cat, more, or less enables you to see the contents of a file. The `wc` command
    gives you additional information about the file but does not display its contents.
    `wc` will tell you the number of words, lines, or characters in a file. Its syntax
    is


    ```

    wc [options] [filename(s)]

    ```


    If you specify multiple filenames on the command line, the number of words, lines,
    and characters will be displayed for each file followed by the total number of
    words, lines, and characters for the group.


    If you are interested in only one value, you can use one of the options in Table
    4.4.


    | Option | Output |

    | :--- | :--- |

    | -c | Number of characters only |

    | -w | Number of words only |

    | -1 | Number of lines only |


    **Table 4.4 Options to Define Output of `wc`**


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_99_0.png)


    # **Key Concept**


    The `wc` command does not change or display a file. Instead, its purpose is to
    count characters, words, and lines.


    The output appears as the number of lines, number of words, number of characters,
    and filename:


    ```

    wc dog

    4     22    132    dog

    ```


    If you do not want the name of the file to be displayed, use the -n option.


    # ### head and tail


    Like their names imply, these two commands let you look at either the beginning
    or end of one or more files. Use the -n option to designate how many lines to
    display; the default is 10. You also can use the -v or --verbose option to print
    filename headers.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'head is helpful for identifying the beginning lines of multiple files. Type


    ```

    `head -5 /home/hadden/let*`

    ```


    to display the first five lines of all files starting with `1et` in the directory
    `/home/hadden`.


    tail is especially helpful in reading log files where messages are appended. The
    command


    ```

    `tail -9 /var/log/messages`

    ```


    will display the last nine lines of the file `/var/log/messages`. You also can
    use `+n` option with `tail`:


    ```

    `tail +25 /var/log/messages`

    ```


    This starts at line 25 and displays each line to the end of the file. If you use
    the `-f` option with `tail`, you can watch as new messages are added to a log
    file. Type


    ```

    `tail -f /var/log/messages`

    ```


    to show each new message as it is written to the log. Type `CTRL-C` to end the
    display.


    # touch


    touch is used to change the date and time of the last access or modification.
    The syntax is


    ```

    `touch [options] [date] filename`

    ```


    If the file does not exist, `touch` will create a new file of 0 length. If no
    date or time is specified, the current system time is used. To change the file''s
    timestamp, use one of the options in Table 4.5.


    **Table 4.5 Options to Use with `touch` to Modify the Access or Modification Information**


    | Option | Action |

    | :--- | :--- |

    | -a | Modify the access time. |

    | -time=atime | Modify the access time. |

    | -time=access | Modify the access time. |

    | -time=use | Modify the access time. |

    | -m | Change the modification time. |

    | -time=mtime | Change the modification time. |

    | -time=modify | Change the modification time. |

    | -t time | Use specified time rather than system time. Must be in format MMDDhhmm[[CC]YY][ss].
    |

    | -C | Do not create files that don''t exist. |

    | -no-create | Do not create files that don''t exist. |

    | -d time | Update modification. Time can be in one of many formats including
    month names, time zones, and a.m./p.m. |'
