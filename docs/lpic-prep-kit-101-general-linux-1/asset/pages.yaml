    # User Variables and Environment Variables


    There are two types of variables, environment and user variables. A *user variable*
    is one that you can name and then assign a value to. An *environment variable*
    is already named but you can change its value.


    # User Variables


    User variables are most often used in scripts. They provide a lot of power. One
    type of user variable that you are apt to use on a regular basis is an alias.
    Aliases are discussed later in this section.


    Variable names can consist of letters, digits, and underscores. The first character
    of a variable name can''t be a digit. Variables are created by naming them and
    assigning a value in a single statement, such as


    ```

    `variable_name=value`

    ```


    A variable exists as long as the shell in which it was created exists. You can
    remove the value of the variable by making it null, as in


    ```

    `variable_name=`

    ```


    The variable itself continues to exist and have memory assigned to it, as long
    as its parent shell exists.


    *Scope* refers to the availability of a variable to other processes. The default
    is that a variable is seen only by the process where the variable was defined.
    So, if you define a variable in a script, it is visible to the child process that
    was spawned when the script was run. It is not'
