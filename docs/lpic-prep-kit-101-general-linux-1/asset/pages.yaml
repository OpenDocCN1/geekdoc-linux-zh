- pgno: 225
  md: "# ## Owners and Groups\n\nThe management of permissions is a complex subject\
    \ that is a large part of any system administrator's job. You can count on seeing\
    \ questions that address access issues both from a straightforward approach as\
    \ to how to set permissions and from a troubleshooting approach. The question\
    \ might not specifically state it is about permissions, but when you analyze the\
    \ problem, you will see that setting appropriate permissions is the answer.\n\n\
    Every file has both an owner and a group whether it is a text file, directory,\
    \ or device. To see the owner and group associated with a specific file, use the\
    \ `ls -l` command, which produces an output like the following:\n\n```\ndrw-rw-r--\
    \  1 hadden    hadden          17249 Sep  7 10:08 dict\n-rw-rw-r--  1 hadden \
    \   hadden             69 Sep  7 10:25 files\n```\n\nUsually, the owner is the\
    \ individual who created the file and the group is whatever group was the owner's\
    \ default group when the file was created. Both the group and owner can be changed.\n\
    \n![](img/8dd1e68596303df43cb8ccf3197e8e53_225_0.png)\n\n> **Key Concept**\n>\
    \ \n> Every file, whether it is a directory, device, binary, or text file, has\
    \ an owner and a group associated with it. A user is anyone who is not the owner\
    \ or a group member.\n\n# ## Changing the Owner\n\nTo change the owner of a file,\
    \ use the `chown` command along with the name of the new owner. If you know the\
    \ user's ID, you can use that instead of the name. Only root can change the ownership\
    \ of a file. The syntax for `chown` is\n\n```\nchown [options] newowner file(s)\n\
    ```\n\nSo, to change the ownership of all the files that begin with *memo* to\
    \ *martinez*, while logged on as root, you would type\n\n```\nchown martinez memo*\n\
    ```\n\nChanging the owner does not change the owner's permissions. Instead, it\
    \ changes only who can exercise those permissions defined for the owner.\n\nWhen\
    \ you run the `chown` command, it first checks to verify that you have provided\
    \ a valid username by searching the `/etc/passwd` file. If this check succeeds,\
    \ the ownership of the file is changed. Table 9.1 shows the options that can be\
    \ used with the `chown` command."
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Table 9.1 | Options That Can Be Used with the chown Command

    Option | Action

    -- | --

    -c | Displays information on all changed files

    -V | Displays information on all files whether or not the ownership change was
    successful

    -f | Does not display error messages

    -R | Applies changes recursively down the directory tree


    # Changing the Group


    Groups are merely a way to organize users. Because every file has a group associated
    with it and permissions can be applied to groups, groups are an excellent tool
    for managing access to files and directories. Groups and group management are
    covered in Chapter 7, “Users and Groups.”


    You can change the group for a file using either the chown or chgrp command. You
    must be the owner or root to change a file’s group.


    As the owner of a file, if you want to change a file from one group to another,
    you must be a member of the new group. Root, however, can change the group to
    any group, regardless of whether root is a member of that group.


    Performing an ls -l on the file MyFile shows you the current owner and group,
    as in


    ```

    -rw-rw-r-- 1 hadden user 370 Sep 5 14:42 MyFile

    ```


    To use the chown command to change the owner and group, you must separate the
    owner and group names by a colon, as in the following:


    ```

    chown martinez:wp MyFile

    ```


    This will change the owner of the file MyFile to martinez, as well as change its
    group from user to wp. Now, when you perform an ls -l on MyFile you see


    ```

    -rw-rw-r-- 1 martinez wp 370 Sep 5 14:42 MyFile

    ```


    You could have changed only the group on MyFile by issuing the following command:


    ```

    chown :wp MyFile

    ```


    This would have changed the group to wp without changing the owner of the file.
    An ls -l command would now show


    ```

    -rw-rw-r-- 1 hadden wp 370 Sep 5 14:42 MyFile

    ```'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'Notice that the group''s name must be prefaced with a colon (: ) when using
    the `chown` command to change only the group.


    The other command you can use to change the group is the `chgrp` command. The
    syntax of the `chgrp` command is


    ```

    chgrp newgroup file

    ```


    To use the `chgrp` command to change the group ownership on the files beginning
    with `memo`, you would type


    ```

    chgrp wp memo*

    ```


    # Key Concept


    > Remember, only the owner of a file or root can change the file''s group. If
    the owner attempts to change the group, she must also be a member of the new group.


    When changing a group, the `chgrp` command verifies that you have entered a valid
    group by searching the `/etc/group` file. `chgrp` has the same options as `chown`.
    Refer to Table 9.1.


    You can use the `chown` and `chgrp` commands to change the group on multiple files
    by using wildcards:


    ```

    chown : wp memo*

    ```


    However, it will fail on any files that you do not own unless this command is
    executed by root.


    # Accessing Files and Directories


    Permissions to files are managed using the permission block, which is displayed
    when displaying a long listing by using the `ls -l` command. You will need to
    be able to interpret the permission block to answer questions pertaining to permissions.
    The permission block is the first 10 characters that are displayed:


    ```

    -rw-rw-r--  1 hadden  hadden    39 Oct 19 18:30 ABill

    -rw-rw-r--  1 hadden  hadden    35 Sep  6 19:47 AlphaFileList

    -rw-rw-r--  1 hadden  hadden    69 Sep  7 10:25 FileList

    -rw-rw-r--  1 hadden  hadden    39 Oct 19 18:28 phone

    -rw-rw-r--  1 hadden  hadden  10240 Sep  6 12:46 catalog

    -rw-rw-r--  1 hadden  hadden  17249 Sep  7 10:08 dict

    -rw-rw-r--  1 hadden  hadden    69 Sep  7 10:25 files

    -rw-rw-r--  1 hadden  hadden   169 Oct 19 20:58 filex

    ```'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'drwxrwxr-x      2 hadded    hadded        1024 Oct 20 10:55 letters

    -rw-rw-r--      1 hadded    hadded          69 Oct 19 18:28 myfile

    -rwxrwxr-x      1 hadded    hadded         101 Sep  6 12:46 mywhich

    lrwxrwxrwx      1 hadded    hadded            4 Sep  6 16:44 softday -> days

    -rw-rw-r--      1 hadded    hadded        4354 Sep  7 13:48 file


    The first character represents the file type. As discussed in Chapter 3, there
    are several dif-ferent types (see Table 9.2).


    Table 9.2. Linux File Types


    | Character | File Type |

    | :--- | :--- |

    | . | Ordinary file |

    | b | Block device |

    | c | Character device |

    | d | Directory |

    | l | Link |


    Permissions are interpreted differently depending on the file type, which is why
    this char-acter is important when interpreting what permissions will be applied.


    The next nine characters of the permission block define the actual permissions
    being applied. The characters are interpreted in three groups of three. Each group
    consists of read, write, and execute permissions, which are either granted or
    denied. The three groups are the permissions for owner, group, and all others
    or users.


    Three basic permissions can be assigned to any file or directory, each of which
    is repre-sented by a single letter:


    +   • r (read)

    +   • w (write)

    +   • x (execute)


    Access to files of all types is determined by assigning one or more of these permissions
    to that file.


    Nine permissions are listed for each file immediately following the file’s type.
    Figure 9.1 shows the permission block and its associated user(s).


    The first block represents the three permissions of the owner of that file. The
    second block of permissions contains the permissions of the group that owns the
    file and anyone who is a member of that group. The third set of permissions refers
    to anyone who is not the owner or a member of the specified group.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '![](img/8dd1e68596303df43cb8ccf3197e8e53_229_0.png)


    # Figure 9.1


    The permission block and its associated user(s).


    The people who are referred to by the last set of permissions (All Others) are
    called user, world, or other. Figure 9.2 shows how access permissions are determined.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_229_1.png)


    # Figure 9.2


    The operating system evaluates who is requesting access to determine what access
    permissions will be granted.


    It is important to remember that by restricting the access permissions of the
    user, you are not limiting access to anyone with a valid account but instead to
    anyone who manages to get into your system. This means that if someone should
    hack into your system, her access to any file is defined by the third set of permissions
    contained in the permission block.


    Your system does not evaluate the permissions granted to others by looking at
    the valid accounts. Instead, the individual’s permissions are evaluated relative
    to ownership and group membership. If this evaluation fails, the individual requesting
    access is considered a user and is granted those permissions. So, if a file has
    a permission block of


    ```

    rw-rw-r--

    ```'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'then both the owner of the file and the members of the specified group have
    the permission to read and write to the file. Everyone else has only the permission
    to read the file.


    # File Access


    The r (read) permission means you can see the contents of that file, including
    opening the file with an application such as vi if it is a text file.


    If you do not have the w (write) permission to a file when opening it in vi, the
    file will be opened as read-only. If you make changes to it, you will have to
    save the file using a new name.


    The write permission means that you can modify the file by changing its contents.
    However, the write permission does not give you the permission to delete that
    file.


    If you have write permission to a file but do not also have read permission, you
    will not be able to open that file with a text editor such as vi. Instead, you
    will get an access denied error message.


    The x (execute) permission means you can run that file by typing its name at a
    command prompt, providing it is a binary file or script. If you try to execute
    a text file, you will get an error message.


    Your effective access permissions to a file are determined by summing the individual
    permissions that have been granted to you. These are represented by the three
    positions that are always in the order read, write, and execute. If you do not
    have a particular permission, it will be represented by a hyphen (-). If the permission
    has been granted, the appropriate letter will appear in its correct position,
    as in the following:


    ```

    ```text

    -rw-rw-r--    1 hadden    hadden    39 Oct 19 18:30 Abill

    -rw-rw-r--    1 hadden    hadden    35 Sep  6 19:47 AlphaFilelist

    ```

    ```


    The permission block r-- means you can read that file but you cannot change or
    delete it. Nor will you be allowed to execute it if it is a binary or script.
    The hyphens in the second and third positions indicate that the write permission
    (second position) and the execute permission (third position) are not granted.


    The permission block -w- gives you the permission to change the file, but you
    can''t read the file. For example, if you had only the permission to write to
    a file called File1, you would not be able to open the file in an editor; however,
    you could change its attributes by using the touch command. You also could overwrite
    the file, as in


    ```

    ```text

    cat file2 > File1

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'The permission block -x gives you the permission to execute a file if it is
    an executable or script file but not to examine its contents or change it.


    Access to a file is the result of summing all the granted permissions. So, the
    r-x permission block means that you can read that file and execute it but you
    cannot make changes to it.


    # Key Concept


    When evaluating permissions applied to a file, you need the r (read) permission
    to examine the file''s contents; the w (write) permission to change the file;
    and x (execute) permission to run the file if it is a script or binary file.


    # Directory Access


    The permissions to access a directory are applied a little differently from the
    permissions to access a file. The read permission to a directory means that you
    can list its contents. However, this does not give you the ability to make this
    directory your working directory.


    The write permission gives you the permission to create files and directories
    within that directory. It also means that you can delete files contained in that
    directory even if you do not have any permissions to that file.


    ```

    [eddie@scotty permDir]$ ls -l fill

    -rw-rw-r-- 1 hadden hadden 0 Oct 27 09:46 fill

    [eddie@scotty permDir]$ rm fill

    rm: remove `fill'', overriding mode 0664?

    ```


    In this listing, the user eddie has only the read permission on the file. The
    directory permissions are rw for others. Before deleting the file, the rm command
    prompts the user to confirm that he wants to override the read-only permission;
    however, the delete operation succeeds after he responds yes.


    The execute permission (-x) gives you the permission to make that directory your
    working directory. So, you can use the cd command to change to that directory.
    However, if you don''t also have the read permission, you will not be able to
    obtain a listing of the directory''s contents.


    Therefore, if you have r-x permissions to a directory, you can list the contents
    of that directory and make that directory your working directory.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'When determining access to a directory, permissions are a little different.
    If the permission block on a directory is


    ```

    rwxr--x-r-x

    ```


    then the owner of the directory can read the contents of this directory, create
    new files and directories in this directory, and make this directory his working
    directory.


    The group members and everyone else can read the directory''s contents and make
    the directory their working directory. However, these people cannot create new
    files or directories within this directory. Their ability to change an existing
    file are determined by the permissions defined on that file.


    # Key Concept


    When evaluating permissions applied to a directory, you need the read permission
    to list the contents of the directory, the write permission to create or delete
    files in that directory, and the execute permission to make that directory your
    working directory.


    # Changing Permissions


    To change permissions on a file or directory, use the **chmod** command. Only
    the owner or superuser (root) can change the permissions on a file or directory.
    Two ways to use this command are by symbols and by numbers. You will see questions
    that cover changing permissions using both methods, so be familiar with them.


    # Changing Permissions with Symbols


    The syntax to use symbols is


    ```

    chmod <who> <change> <right> [files]

    ```


    The **who** refers to whether you want to change the permissions for the owner,
    the group, or everyone. These are represented by the letters *u* (owner), *g*
    (group), *o* (others), and *a* (all). More than one *who* can be specified. If
    the *who* is omitted, *a* (all) is assumed and the changes are applied to the
    owner, the group, and everyone else.


    The *change* refers to whether you want to grant or deny a permission—use **+**
    to grant it or **-** to deny it. The permissions are *r* (read), *w* (write),
    and *x* (execute). You also must specify the file or directory that will get the
    new permissions.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Any permissions that already might have been granted will not be changed. If
    you are granting the group the write permission, as in


    ```

    chmod g+w filename

    ```


    and they already have the read permission, the group’s permission block would
    be rw-, not just -w-.


    You also can explicitly set permissions by using the = operator, which will replace
    any existing permissions. So, look again at the last example where the group has
    read permis- sion but you want them to have write permission. If you type


    ```

    chmod g=w filename

    ```


    the new permission block would be -w-, and not rw-. When using the = change operator,
    all old permissions are gone and only those you specify will be granted.


    The who, change, and permission arguments must not have any spaces between them.
    Also, multiple selections can be used in a single command. For example


    ```

    chmod ug+x MyFile

    ```


    would add the execute permission for the owner and the group. If the permission
    block on MyFile was rwxrw-r--; before the change, after the change it would be
    rwxrwxr--.


    However, if you typed


    ```

    chmod ug-x MyFile

    ```


    the new permissions would be --x-xrx--. Notice that any who that is not specified
    is not changed. In this example, others had the read permission before and after
    the change because others were not mentioned when using the chmod command.


    If you do not follow the = with a permission, all permissions for the who are
    removed. For example, if you have a file with a permission block of -rwxrwxrwx
    and enter


    ```

    chmod go- filename

    ```


    the new permission block would be -rwx……. Notice that the permissions for both
    group and others have been removed.


    Because using the - operator revokes any previous permissions, it is important
    to be care- ful when using - to set permissions. On the other hand, setting explicit
    permissions gives you more power to ensure that permissions are set exactly like
    you want them to be.


    For example, say you type the following:


    ```

    chmod go-x MyFile

    ```'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'This removes the execute permission from both the group and others. If the
    group and others did not have the execute permission to begin with, no changes
    would be made. However, if the permission to execute `MyFile` had been previously
    granted to one or the other, it would be removed but the status of the read or
    write permission would be unchanged.


    # **Key Concept**


    > When using symbols to change permissions, only those specified permissions and
    those specified for the *who* are changed unless you use the equal sign (=).


    You also can use wildcards when referencing files, such as


    ```

    chmod go+rW letter*

    ```


    This command grants read and write permissions to the owner and group to any file
    beginning with `letter`. If you want to grant full access to a file, type the
    following:


    ```

    chmod +rwx memo*

    ```


    This command gives read, write, and execute permissions to the owner, group, and
    others to any file beginning with `memo`. This will not work, however, if there
    are any files beginning with `memo` that you do not own. You will get an error
    message from `chmod`:


    ```

    chmod: file3: Operation not permitted

    ```


    This identifies the file in which the permissions were not changed.


    A shortcut to granting permissions is to grant them based on another set of permissions.
    If you had a file with a permission block of `-rwxr-xr--` and you wanted anyone
    to be able to execute the file, you could issue the command


    ```

    chmod o=g MyFile

    ```


    which would set the others'' permissions to the same as the group or `-rwrx-r-x`.
    Remember, if you use this method you are setting the permissions explicitly. In
    other words, the existing permissions for others are erased and then set to mirror
    the permissions set for group.


    You can use any of the three *whos* to set equal permissions by using *u* for
    owner, *g* for group, and *o* for all others.


    If you want to change the permissions for all files and subdirectories, use `chmod`
    with the `-R` option. This will force `chmod` to recursive down through the directory
    structure and change all the permissions. Other options to use with the `chmod`
    command are listed in Table 9.3.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '**Table 9.3 Options to Use with chmod**


    | Option | Action |

    | :----- | :----- |

    | -c     | Displays the names of those files whose permissions are changed |

    | -f     | Does not display any error messages |

    | -v     | Displays a list of each file that is changed and any error messages
    |


    # Changing Permissions with Numbers


    You can change permissions by passing a three-digit octal number to the `chmod`
    command. This octal number represents the bit pattern for the new permissions.
    Each digit of this number represents the permissions for one of the entities—owner,
    group, and others, in that order. See Figure 9.3.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_235_0.png)


    # Figure 9.3


    Setting permissions using an octal number with the `chmod` command.


    The value of each permission is shown in Table 9.4.


    **Table 9.4 Numbers Used to Grant Permissions**


    | Number | Permission |

    | :----- | :----- |

    | 4      | Read (r) |

    | 2      | Write (w) |

    | 1      | Execute (x) |


    You sum the permissions you want to grant and pass that number to `chmod`. If
    you enter the command


    ```

    `chmod 764 MyFile`

    ```


    you would be granting read, write, and execute to the owner, which is 4 (read)
    + 2 (write) + 1 (execute) = 7. The group is granted read and write, or 4 (read)
    + 2 (write) = 6. And all others would get read only, or 4.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'When you use chmod with numbers you are setting explicit permissions. Any existing
    permissions on the file or directory are erased and the newly defined permissions
    are applied\u2014so be careful.


    # ## Special Permissions


    Now that you know how to change permissions, you need to know how to use them
    in some special circumstances. You should give careful consideration to your decision
    to use these special permissions.


    These permissions can be set either by using symbols or by adding a fourth digit
    when using numbers. This digit goes before the three digits used to set permissions.
    You can expect to see questions covering these permissions just like setting the
    read, write, and execute permissions.


    # ## SUID and GUID


    The first permission is set user ID (SUID) or set group ID (SGID). This permission
    changes the user\u2019s ID to that of the who parameter when setting the permission
    during file execution. This permission is represented as s, which appears instead
    of x.


    If you have a file called *MyFile* with a permission block of \u00b7rwxr\u00b7xr\u00b7x
    and you issue the command


    ```

    chmod o+s MyScript

    ```


    then whenever anyone executes the file *MyScript* they will have the same privileges
    as if they were the owner running that file. Now, if you examined the permission
    block for *MyScript*, you would see \u00b7rwsr\u00b7xr\u00b7x. You could accomplish
    the same thing by using numbers with the `chmod` command:


    ```

    chmod 4755

    ```


    Table 9.5 shows the numbers that can be used before the three digits used to set
    permissions and their effects.


    Table 9.5 Interpreting the First Digit When Using a Four\u2011Digit Octal Number
    to Set Permissions


    | Digit | Meaning |

    | :--- | :--- |

    | 4 | Sets user ID when executing program |

    | 2 | Sets group ID when executing program |

    | 1 | Sticky bit |'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'You also can have anyone running the script inherit the privileges of the group
    instead of the owner by issuing the command


    ```

    chmod g+s MyScript

    ```


    or


    ```

    chmod 2755 MyScript

    ```


    The permission block, after making this change, would be -rwxr-sr-x.


    An example of using this permission is when a user changes her password. For a
    password change to become effective, the new password must be written to the `/etc/passwd`
    file. However, the permissions on the `/etc/passwd` file are


    ```

    -rW-r--r-- 1 root root 876 Oct 20 11:32 passwd

    ```


    Only the owner, root, has the permission to write to this file. Neither the group
    nor others have been granted the write permission to this file.


    Users can change their passwords because the SUID bit has been set on the `/usr/bin/passwd`
    command as


    ```

    -r-sr-xr-x 1 root bin 15613 Apr 27 1998 /usr/bin/passwd

    ```


    Notice the s where the bit is set for execute by owner. This means that when the
    file is executed, the user gets the same privileges as root—the capability to
    write to the `/etc/passwd` file. This is considered a significant security risk
    and should be used only if absolutely necessary.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_237_0.png)


    # Key Concept


    Setting SUID and GUID enables a user to run a command or application with the
    permissions of another. Therefore, the use of these two special permissions can
    be a significant security risk.


    # Sticky Bit


    The sticky bit enables you to manage shared directories more efficiently. The
    most common use of the sticky bit is on world writable directories where you want
    only the owner to be able to delete a file.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'If the permission block on a directory called `MyDir` is set to `drwxrwxrwx`,
    anyone can create new files, list the contents of the directory, make the directory
    their working directory, or delete any files contained in that directory.


    This type of permission block might be necessary when a directory is shared by
    many people. The drawback of this is that anyone can delete anyone else''s files.
    This is prevented by setting the sticky bit on the directory itself.


    Only root can set the sticky bit. To set it on `MyDir`, you would issue the command


    ```

    chmod +t MyDir

    ```


    or


    ```

    chmod 1777 MyDir

    ```


    Both of these would change the permission block on `MyDir` to `drwxrwxrwt`.


    You also can set a sticky bit on an executable. This would cause the program to
    stay in the swap area, which in turn results in faster program loading.


    # ## Default Permissions


    During the exam, you can expect to see questions on default permissions for newly
    created files. You need to be familiar with the use of the `umask` command.


    When you create a new file, the permissions that are applied to that new file
    are set by the system based on that individual''s file creation mask. This creation
    mask is called `umask` (user''s creation mask) and is defined either by the user''s
    startup files or the system''s default settings.


    To see the value of your `umask`, type `umask` at a command line. The value is
    returned by the system:


    ```

    $ umask

    002

    ```


    The `umask` is represented as a three-digit octal number with each digit corresponding
    to one of the three-character blocks in the permissions block.


    So, the first digit defines the default permissions for the owner, the second
    digit for the group, and the third digit for the world. Some systems return a
    four-digit number in which the first one is always a zero. The meaning of these
    numbers appear in Table 9.6.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'Table 9.6 **Permissions for umask**

    | Value | Permission |

    | :--- | :--- |

    | **0** | read, write for files; read, write, execute for directory |

    | **1** | read, write for files and directories |

    | **2** | read for files; read, execute for directories |

    | **3** | read for files and directories |

    | **4** | write for files; write, execute for directories |

    | **5** | write for files and directories |

    | **6** | execute for files and directories |

    | **7** | no permissions |


    Notice that the numbers used for setting permissions and the numbers used for
    defining a umask do not have the same meaning.


    So, if the umask is **002**, the permissions on all the new files would be owner,
    with group having read and write permissions (**00**) and everyone else having
    read (**2**). If you performed an `ls -l` command to examine the permission block
    on the newly created file, it would be `rw-rw-r--`.


    For new directories, the permissions would be owner and group read, write, and
    execute (**00**), with all others read and execute (**2**). The permission block
    on a newly created directory would be `rwxrwxr-x`.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_239_0.png)


    # **Key Concept**


    You can see that the numbers used for setting permissions using the chmod command
    and for setting permissions using umask are not the same. A umask of **002** is
    the same as using chmod **662** for a file or chmod **775** for a directory.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'If you want to change your `umask` value, issue the `umask` command followed
    by the permission level you want to define. So, if you want the permissions to
    be `rw-r----` on files and `rwxr-x---` on directories, enter the following:


    ```

    ```bash

    umask 027

    ```

    ```


    This will temporarily change your mask. After you log off and log on again, the
    prior setting will return. To make this change permanent, add the previous command
    to your startup file. Only root can change the system `umask` value. See Chapter
    7 for more information on using your startup files to manage your environment.


    # ## Summary


    Permissions are an essential part of managing your system. They enable you to
    control who gets to access what. The possible permissions are read, write, and
    execute. For the exam, you need to understand what each permission allows the
    user to do whether applied to a file or a directory.


    The permission block is the first 10 characters that are displayed when issuing
    the `ls -1` command. The first character designates the file type; the next three
    are the permissions for the owner; the next three after that are the permissions
    for the group; and the last three are the permissions for user. These permissions
    are then applied to one of three entities: owner, group, or user. You can change
    these permissions through the use of the `chmod` command. Permissions can be changed
    using either symbols or numbers.


    To change the owner of a file or directory, use the `chown` command. Use either
    `chown` or `chgrp` to change the group associated with a file. The set UID (SUID)
    and set GID (SGID) are two special permissions that also can be applied. SUID
    allows an executable to be executed with another user''s permissions instead of
    those of the user running the executable. The SGID works the same way, except
    it allows the permissions of another group rather than another user.


    Another special permission is the sticky bit. This assists in the management of
    world-write directories. It also can be used to improve application execution.
    In addition, you need to understand what the `umask` is and how to correctly set
    it. Default permissions for all newly created files are defined by the system
    `umask` value. A user-specific `umask` also can be defined.'
  merge: -1
  img_proc: true
- pgno: 241
  md: "# ## QUESTIONS AND ANSWERS\n\n+   1. How can a file owner change ownership\
    \ of files?\n+   \n+       A. A user cannot change the ownership of her files.\
    \ Only root can do this. Using chown while logged in as root, you will need to\
    \ change the ownership of the files.\n\n+   2. You have a directory of files containing\
    \ payroll information that you want to share with other employees in the payroll\
    \ department. As the system administrator, what would be the best way to do this?\n\
    +   \n+       A. Use the chgrp command and change the group for all the files\
    \ in the directory to the payroll group. If there are subdirectories, you should\
    \ use the -R option to recursively change the group on all the files. Then, set\
    \ the permissions for the payroll group appropriately using the chmod command.\n\
    \n+   3. You have a new employee, Mary, who replaced Bill. How can you give Bill’s\
    \ files and directories in the /data/bill directory to Mary?\n+   \n+       A.\
    \ You will need to change the ownership of the files and directories using the\
    \ chown command with the -R option. Then, make sure that Mary is a member of the\
    \ appropriate groups.\n\n+   4. One of the accounting department’s directories\
    \ contains information that should be changed only by the head accountant but\
    \ should be readable by all accounting employees. How do you set the permissions?\n\
    +   \n+       A. You will want to make the head accountant the owner of the directory\
    \ and its files. Put all the accounting employees in an accounting group. Set\
    \ the permissions on the directory for the owner read, write, and execute; the\
    \ group read and execute; and all others no permissions (rwxr-x---). Then, set\
    \ the permissions on the files for the owner read and write; the group read; and\
    \ all others no permissions (rw-r-- -)."
  merge: -1
  img_proc: true
- pgno: 242
  md: '5. How do you set the permission block on the employee evaluation files so
    that only the HR director can read or change them?


    A. Put all the employee evaluation files in a single directory. Make the director
    of the Human Resources Department the owner of the directory and its files. Then,
    set the permissions so that the director has read, write, and execute on the directory
    and read and write on the files. Deny all access to everyone else, including the
    group.


    6. All the salespeople save their quotes to a directory called /sales/quotes.
    Some of them have complained to you that files are being lost. How could you address
    this problem?


    A. Set the permissions on the /sales/quotes directory so that the owner and the
    sales group have read, write, and execute permissions. The permissions on the
    files for the owner and sales group should be read and write. Deny any access
    to everyone else. This will keep the files accessible to only the sales group;
    however, anyone will be able to delete any file. You also should set the sticky
    bit so that only the owner of a file can delete it.


    7. You have a user who tells you that every time he creates a new file it has
    its permissions set as -rw-rw-r--. He wants the new permissions to be -rw-r--r--.
    How can you configure his settings to make this happen?


    A. The user''s umask is 002, which sets the permissions on all newly created files
    for owner and group to have read and write and all others to read. You will need
    to change his umask to 022, which will give the owner read and write, and group
    and others read-only permissions on newly created files. To make this change permanent,
    this setting will have to be added to the user''s startup files.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# PRACTICE TEST


    +   1. The directory `/home/bill1/letters` has a permission block of `drwxrw-r--`,
    the owner is Bill, and the group is wp. Mary is a member of the accounting and
    payroll groups. What would Mary be able to do in this directory?


    +   a. Make the `/home/bill1/letters` directory her working directory.

    +   b. List the contents of the `/home/bill1/letters` directory.

    +   c. Save a file to the `/home/bill1/letters` directory.

    +   d. Delete files contained in the `/home/bill1/letters` directory.


    Answer a is incorrect; Mary would need the execute permission to make `/home/bill1/letters`
    her working directory. Answer b is correct; the read permission gives Mary permission
    to list the contents of the `/home/bill1/letters` directory. Answer c is incorrect;
    Mary would need the write permission to save a file to this directory. Answer
    d is incorrect; to delete files in the `/home/bill1/letters` directory, Mary would
    need the write permission.


    +   2. To give Mary permission to save a file to the `/home/bill1/letters` directory,
    you would need to


    +   a. Make Mary the owner of the directory.

    +   b. Make Mary a member of the wp group.

    +   c. Change the permissions on the directory to `drwxrw-rw`.

    +   d. Explicitly give Mary read and write permission to the `/home/bill1/letters`
    directory.


    Answer a is incorrect; although this would allow Mary to save a file to the `/home/bill1/letters`
    directory, it would take away Bill''s permissions as owner. Answer b is correct;
    by making Mary a member of the wp group, she would be granted the permissions
    defined for the group—which are read and write, allowing her to save a file to
    the directory. Answer c is incorrect; this would give Mary the needed permissions
    but would also grant these permissions to everyone else. Answer d is incorrect;
    you cannot explicitly give permissions to a single individual, only to the owner,
    the group, or others.


    +   3. Bill has retired and has been replaced by Arthur. How can you transfer
    Bill''s files to Arthur?


    +   a. `chgrp -R arthur /home/bill1`

    +   b. `chmod o+rwX /home/bill1`

    +   c. `chown arthur /home/bill1`

    +   d. `chown -R arthur /home/bill1`'
  merge: -1
  img_proc: true
