- pgno: 249
  md: '# Scheduling Jobs


    A large part of a system administrator''s job entails performing repetitive tasks.
    The ability to schedule these tasks becomes a great timesaver.


    You might want to schedule an event to remind you of something or to run a program
    unattended. You might have events that occur only once and others that repeat
    at a regular interval. Linux has the capability to do both automatically.


    # at


    When you have a job that you want to run only once at a specific time, you can
    use the at command. The syntax for the at command is


    ```

    at [options] time

    ```


    The options that can be used with the at command are listed in Table 10.1.


    **Table 10.1 Options That Can Be Used with the at Command**


    | **Option** | **Action** |

    | :--- | :--- |

    | -b | Schedules job when system load is low; see the section on batch later in
    this chapter |

    | -d | Deletes at job; same as at rm |

    | -f *filename* | Reads job from specified file |

    | -l | Lists all jobs for that user; same as atq |

    | -m | Mails user when job completes |


    Using the at command is very simple and consists of three simple steps:


    +   1. Type at with any options and the time of execution.

    +   2. Enter the command you want to run.

    +   3. Press Ctrl-D to save the job.


