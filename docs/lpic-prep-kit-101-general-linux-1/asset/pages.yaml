    Enter.


    Both the `-k` and `-K` options will cause the man command to search the description.
    If you use the `-a` option, it will display each page that matches that command.
    Type `man -a write`. Each page that covers `write` will be displayed sequentially.


    # ## Other Documentation


    A method of documentation that is easier to understand is the `info` command.
