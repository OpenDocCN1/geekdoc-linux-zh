- pgno: 162
  md: '# ## Finding Lost Files


    As you can see from Table 6.9, there might be several places where a certain file
    is stored, so you could spend considerable time searching multiple directories
    for a specific file. To prevent this waste of time, some utilities are available
    on your system to assist you in locating that long-lost command.


    For the exam you will need to be comfortable using these commands. You might be
    asked a question where you will need to select which command would be the most
    appropriate to use in a given situation.


    # ### find


    This utility can be used to find files starting at the specified directory and
    searching all its subdirectories to find filenames that match the specified pattern.
    The syntax for **find** is


    ```

    find [path] [condition]

    ```


    If no modifying condition is passed to the **find** command, it will produce a
    listing of all files and directories starting with the specified directory recursively
    through the entire directory tree. If no directory is specified, **find** searches
    the present working directory and all its subdirectories. Table 6.10 lists the
    possible conditions that can be used with the **find** command to narrow the results.


    # **Table 6.10** Conditions That Can Be Used to Modify the Results from Running
    the **find** Command


    | Condition | Action |

    | :--- | :--- |

    | -atime *n* | Find files based on number of days since last accessed |

    | -ctime *n* | Find files based on number of days since directory entry last changed
    |

    | -group *groupname* | Find files belonging to *groupname*; can be name of GID
    |

    | -inum *n* | Find files with inode *n* |

    | -links *n* | Find files with *n* links |

    | -mount | Find files only on same filesystem |

    | -mtime *n* | Find files based on number of days since last modified |

    | -name *pattern* | Find files matching specified pattern |

    | -perm *nnn* | Find files with specified permission block |

    | -print | Display matching files and their full paths; default action |

    | -size *n*[c] | Find files *n* blocks in size or *n* characters |

    | -type *c* | Find files of type *c*, which can be *b* for block, *c* for character
    device, *d* for directory, *l* for link, or *f* for plain file |

    | -user *username* | Find files belonging to *username*; can be name of UID |'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'The expression most commonly used with `find` is `-name`, which specifies the
    filename it is to find. This filename can contain wildcards, as listed in Table
    6.10, or parentheses. However, they must be enclosed in quotes to prevent the
    shell from interpreting them. So, if you would like to find a file named `mydogma`
    but do not know where you saved it or exactly what you named it, but you are sure
    the name contains the letters `dog`, you could search for it by typing


    ```

    ```bash

    find /home/hadden -name ''*dog*'' -print

    ```

    ```


    The `-print` expression causes `find` to print all files that meet the criteria.
    It is the default action and therefore can be omitted. If, however, you had typed


    ```

    ```bash

    find -print /home/hadden -name ''*dog*''

    ```

    ```


    `find` would have printed all the files contained in the directory `/home/hadden`
    and all its subdirectories whether or not they met the criteria. `find` sees the
    `-print` expression and assumes that there is no criteria. If you use the `-print`
    expression, make sure it is the last one on your command line.


    `find` also can be used to find a file based on when it was accessed last.


    ```

    ```bash

    find /home/hadden -atime zn [-print]

    ```

    ```


    where `n` is the number of days relative to today. When you use this, `find` changes
    the access time of every directory it searches. In addition, you can use `find`
    to locate a file based on when it was last modified.


    ```

    ```bash

    find /home/hadden -mtime zn [-print]

    ```

    ```


    When using multiple criteria, a space is considered to mean `and`. The `-a` can
    be used instead of a space. Use either `-or` or `!` to mean `or`. Use the `!`
    in front of an expression to designate not. The following examples search the
    `pwd`.


    ```

    ```bash

    find . -name ''*dog*'' -a ''*cat*''

    ```

    ```


    The previous code finds all files that contain both “`dog`” *and* “`cat`” in their
    names.


    ```

    ```bash

    find . -name ''*dog*'' -o ''*cat*''

    ```

    ```


    The preceding code finds all files that contain either “`dog`” *or* “`cat`” in
    their names.


    ```

    ```bash

    find . -name !''*dog*''

    ```

    ```


    The previous code finds all files that do *not* contain “`dog`” in their names.'
  merge: -1
  img_proc: true
- pgno: 164
  md: "# **locate**\n\nInstead of searching the directory tree as find does, the locate\
    \ command searches a database called locate.db, which is located in the /var/lib\
    \ directory. The syntax for locate is\n\n```\n``` \nlocate [filename]\n```\nTyping\n\
    ```\n\n```\n``` \nlocate *.ps\n```\nwould cause locate to search the locate.db\
    \ database and return all files that end in .ps.\n```\n\nlocate.db contains a\
    \ listing of all the files on the filesystem. To keep this database up to date,\
    \ rebuild the database with the command updatedb.\n\nThe syntax for the updatedb\
    \ command is\n\n```\n``` \nupdatedb [options]\n```\nYou can tell updatedb what\
    \ paths to use or exclude and the name of the database to use for the results.\
    \ By default, the updatedb command saves its results to locate.db. Table 6.11\
    \ lists the options for updatedb.\n```\n\nTable 6.11 Options to Modify the updatedb\
    \ Command\n- **--localpaths**    Local directories to be included\n- **--netpaths**\
    \      Network directories to be included\n- **--prunepaths**    Directories to\
    \ exclude\n- **--output**        Name of new database\n\nMany distributions create\
    \ a cron job upon installation that keeps your locate.db up to date. You can edit\
    \ this file to change which directories are indexed or which are excluded. In\
    \ addition, you can change how frequently this script is run. If you want, you\
    \ also can use an updatedb.conf file to configure which directories you want to\
    \ index.\n\n# **which**\n\nUse the which command to find what version of a command\
    \ is being executed. It searches your path until a match is found. If a match\
    \ is not found, which displays an error message.\n\n```\n``` \nwhich command\n\
    ```\nThe which command does not have any options and returns the full path to\
    \ the command that would be executed if that command were typed at the command\
    \ line. Multiple commands can be passed on the same command line.\n```"
