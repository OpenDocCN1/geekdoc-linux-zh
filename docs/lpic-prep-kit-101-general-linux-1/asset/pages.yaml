- pgno: 24
  md: '# CHAPTER PREREQUISITE


    Before beginning this chapter you should have access to a computer running Linux
    that you can use to practice these concepts and skills. You should be able to
    log on to your system and understand the basics of typing at the command line.


    # Finding and Creating Documentation


    # WHILE YOU READ


    +   1.  You ask a co-worker how to locate a file on your Linux system and he tells
    you to check the man pages for find and locate. What does he mean by the term
    man?

    +   2.  You are looking at the man page about using tar to find the option to
    compress the tar file. How can you find it without having to read the entire page?

    +   3.  Why does using man command not find the correct manual page?

    +   4.  How can you configure your computer to make Spanish the default language
    for manual pages?

    +   5.  Where can you find information on setting up your new zip drive?

    +   6.  What is the Linux Documentation Project?

    +   7.  You find a file in /usr/bin but do not know what it does. How can you
    find this out?

    +   8.  How do you find the exact name of the command to change your password?'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# ## Getting Help


    Usually there is no hard copy manual supplied with Linux unless you purchase a
    distribution that includes a manual. However, there is an almost unlimited amount
    of information available from many sources. These may be categorized as


    +   * Local documentation

    +   * Online via the Internet

    +   * Newsgroups

    +   * Mailing lists

    +   * Books


    The ability to find and use this documentation will be tested on the exam.


    # ### Local Documentation


    There are several types of locally installed documentation. Table 1.1 shows the
    types and their locations.


    **Table 1.1** Installed Documentation and Their Locations


    | Documentation | Location |

    | :--- | :--- |

    | manual pages | /usr/man |

    | info | /usr/info |

    | HOWTOs | /usr/doc/HOWTO |

    | Frequently Asked Questions (FAQ) | /usr/doc/FAQ |

    | program documentation | /usr/doc/<program name> |


    Each one of these has its advantages and disadvantages. Usually information on
    the same topic can be found in more than one source. However, one source may be
    easier for you to understand than the other.


    # #### man Pages


    There is extensive local online help available on almost every utility, system
    call, or command on your system called the *manual pages*. The manual pages are
    not user-friendly and are more helpful for looking up syntax than using as a tutorial.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'They are frequently referred to as man pages and are invoked using the man
    utility. man searches for a man page on a specified topic and sends the output
    through a pager. The pager then prints the man page to your display. How you navigate
    through the man page is dependent on which pager is being used.


    The syntax for man is


    ```

    man [options] [section] [topic]

    ```


    You invoke a man page by passing the topic to the man command. If you type man
    man the manual page describing how the manual pages work is displayed. If you
    are looking for information on the command who, you could get it by typing man
    who. The displayed man page will present a summary of what the who command does
    and its syntax.


    Each man page is divided into sections, although not all sections appear in every
    page. Table 1.2 lists the sections and what they might contain.


    # Table 1.2  Sections of man Pages


    | Section | Description |

    |---------|-------------|

    | NAME | The name and a brief description of the command |

    | SYNOPSIS | How to use the command and its command-line options |

    | DESCRIPTION | Explanation of the program and its options |

    | OPTIONS | All options with a brief description of each |

    | SEE ALSO | Related man pages |

    | DIAGNOSTICS | Description of error messages |

    | FILES | List of files used by the command and their locations |

    | BUGS | Known problems |

    | HISTORY | Milestones of program''s development |

    | AUTHOR | Program''s author and contributors |


    Not only are the individual manual pages internally organized into sections, the
    pages themselves are arranged in a specific directory structure. Table 1.3 lists
    the names of these directories and what type of man pages each contains. This
    is information you may need to know for the exam.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '| Directory | Contents |

    |---|---|

    | /usr/man/man1 | Commands you can run from within a shell |

    | /usr/man/man2 | Documentation on system calls |

    | /usr/man/man3 | Manual pages for libc functions |

    | /usr/man/man4 | Information about files in the /dev directory |

    | /usr/man/man5 | Details of formats for special files such as /etc/passwd |

    | /usr/man/man6 | Games |

    | /usr/man/man7 | Descriptions of Linux file system, man pages, and so on |

    | /usr/man/man8 | Pages for root operator utilities |

    | /usr/man/man9 | Documentation on Linux kernel source routines |


    After a man page is displayed, there are specific commands for navigating around
    the document. And these commands vary depending on the pager used to display the
    man pages.


    The two pagers that are usually used to display man pages are more and less. For
    both pagers, all you need to do is press the spacebar to display the next screen
    or b to back up one screen. less also allows you to use the <PgUp> and <PgDn>
    keys to scroll up or down.


    The Enter key will advance the display one line at a time. When you are finished,
    type q to quit in either less or more.


    Because man pages can be quite long and you cannot easily scroll up and down,
    a method of search is extremely valuable.


    In order to search for a string inside the man page, type


    ```

    /<string>

    ```


    which will appear on the last line of the screen. The cursor will advance to the
    first occurrence of the search string after you press the Enter key. To continue
    searching for the next occurrence of the search string, type n. If no match was
    found or the last instance has been found, then the pager will notify you by placing
    a message on the last line of the screen.


    When searching for a man page on a specific topic, the first page found will be
    displayed. The sections (directories) are not searched in numerical order, but
    rather in the following order:


    +   1, 8, 2, 3, 4, 5, 6, 7, 9'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Each section has its own introduction man page that presents what is in that
    section. For example, if you want to find out information on what the game section
    has, you would type `man intro`; however, you would be presented with the intro
    page from Section 1. man quits searching as soon as it finds a match. This might
    not be the page you were looking for as the search ends as soon as one page is
    found that satisfies your criteria. Typing `man intro` would never get you to
    the games section, Section 6. You can override this behavior by specifying which
    section to search. Typing


    ```

    ```

    man 6 intro

    ```

    ```


    would display the intro page for the games section. But say you need information
    on using `write` in an application you are writing. When you type `man write`
    you get information on the write utility.


    You know that there are additional man pages on `write` but do not know which
    section they are in. You can search all man pages for the string `write` by typing


    ```

    ```

    man -k write

    ```

    ```


    Each man page that discusses `write` will be listed with a short description.
    Two lines of the output would be


    ```

    ```

    write (1)         - send a message to another user

    write (2)         - write to a file descriptor

    ```

    ```


    You can use the `-k` option if the term you are searching for is not contained
    in the name section. For example, say you want information on how to change your
    password. If you type `man password` you get the error


    ```

    ```

    No manual entry for password

    ```

    ```


    However, if you type `man -k password`, man searches the short description and
    displays a listing of all man pages that contain the string `password` in its
    short description, as in the following results:


    ```

    ```

    chage (1)       - change user password expiry information

    chpasswd (8)    - update password file in batch

    conflict (8)    - search for alias/password conflicts

    crypt (3)       - password and data encryption

    fgetpwent (3)   - get password file entry

    getpass (3)     - get a password

    getpw (3)       - Re-construct password line entry

    ```

    ```


    Because none of the descriptions actually give you the syntax for what you do
    to change your password you can try `man -k password`. This causes man to search
    each man page for'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'the term password and display the title of the page with a query asking if
    you want to view that page.


    ```

    /usr/man/man1/entry.n? [ynq] n

    /usr/man/man1/TclX.n? [ynq] n

    /usr/man/man1/interp.n? [ynq] n

    /usr/man/man8/snppasswd.8? [ynq] n

    /usr/man/man8/sbmount.8? [ynq] n

    /usr/man/man8/uucico.8? [ynq] n

    /usr/man/man8/vsfp.8? [ynq] n

    ```


    If you respond with a y, then that page is displayed. When you quit viewing that
    page, man continues its search and presents the next match until you tell it to
    quit. Although this produces the most complete results, it can take a long time
    to finish.


    Another useful option to use with man is -a. This option causes man to search
    the entire page and display each one it locates, one after another. When you quit
    one man page, then the next page that satisfies your criteria is displayed.


    # Key Concept


    When searching for information, be sure you understand the -k, -K, and -a options.
    -K searches the whatis database; -k searches the entire contents of the man pages;
    and -a finds all matching entries.


    The man pages are usually stored in compressed, unformatted form. Before displaying,
    each page needs to be uncompressed and formatted. The man.conf file contains configuration
    data for man, including how to construct the search path for man; the path for
    various programs used by man such as less, more, or nroff; and a list of uncompressors.


    A different configuration file can be used by typing


    ```

    man -C MyMan.conf command

    ```


    Which pager the man command uses is contained in the PAGER environmental variable.
    To define a different one that you want to use, edit your .profile file and add
    the line


    ```

    export PAGER=/bin/less

    ```


    The man command needs to know where the manual pages are located. This information
    is contained in the MANPATH environmental variable—the value of which comes from
    the man.conf file. You can redefine this variable by adding to your .profile file
    the following


    ```

    export MANPATH=<path to manual pages>

    ```'
  merge: -1
  img_proc: true
- pgno: 30
  md: "# Key Concept\n\nThe man pages provide information on commands, utilities,\
    \ and system calls.\nThe output is displayed via a pager. The MANPATH or pager\
    \ can be changed by\nediting either the man.config or .profile files.\n\n# info\n\
    \ninfo, which is a reader for the GNU hypertext documentation, is easier to use\
    \ than man\npages. info can be called either from emacs, a text editor, or as\
    \ a standalone program.\n\nAlthough the information provided by info is often\
    \ much easier to understand, naviga-\ntion can be difficult. It uses key combinations\
    \ like those used in emacs.\n\nIf you start info by typing info you are presented\
    \ with the screen shown in Figure 1.1,\nwhich presents a directory of available\
    \ documentation.\n\n![](img/8dd1e68596303df43cb8ccf3197e8e53_30_0.png)\n\nMenu\
    \ \nitem \nText \nyou \ntype\n\n# Figure 1.1\n\nThe introductory screen is displayed\
    \ when starting info."
  merge: -1
  img_proc: true
- pgno: 31
  md: 'The top part of the screen lists some helpful keys followed by the menu. Each
    menu item begins with an asterisk (*), followed by the description of the menu
    item, and ending with a colon (:). After the colon is the text of the menu item
    in parentheses, as shown in Figure 1.1. It is this text that you type to go to
    that menu item.


    You use the spacebar to scroll through the list of available menu items. Typing
    the letter m places your cursor at the bottom of the screen where you can enter
    the menu item. After typing <enter>, you are taken to that menu item.


    For example, if you want to get information on finding a file, you can go to it
    by typing mfind while in info or invoke info with the word find as an argument,
    such as


    ```

    info find

    ```


    Either method will bring you to the screen shown in Figure 1.2.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_31_0.png)


    **Figure 1.2** The info screen on the topic find lists the sections available
    in the find documentation.


    As you can see, there is no menu text on this screen that you can type to go to
    one of the menu items. However, you can use the Tab key to highlight the topic
    of interest and then press Enter to go to it.


    info also has a tutorial that is well worth your time if you want to get the full
    value of info. From the main screen, type h to start the tutorial.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Navigating through the information is fairly straightforward. The spacebar
    scrolls down one screen and the Delete key scrolls back one screen. You can jump
    forward to the next topic by typing n and jump back by typing p. Typing l will
    return you to your last location.


    # Key Concept


    The info utility provides much the same information as the man pages; however,
    it is usually easier to understand. The spacebar scrolls up and the Delete key
    scrolls down. Type n for the next topic and p for the previous one. Typing q will
    quit.


    # HOWTOs


    Linux HOWTOs are detailed documents that describe the methods of performing tasks
    in Linux. For example, you may need to find out how to configure a piece of hardware
    or how to complete a simple task such as printing a document.


    A HOWTO document usually covers a complex subject and as such tends to be rather
    long. Less complex subjects such as LILO and printing are covered in mini HOWTOs.


    Versions (usually compressed) of HOWTOs are usually installed in the /usr/doc/HOWTO
    directories. Check online to find the latest version(s).


    You can download the latest version of a HOWTO via ftp (from ftp://sunsite.unc.edu/pub/Linux/docs/HOWTO
    or one of its mirrors). They also can be browsed via HTML from several sites,
    including http://sunsite.unc.edu/LDP/HOWTO/ or http://www.linuxdoc.org/HOWTO/.


    Mirror sites can be located by consulting http://sunsite.unc.edu/LDP/mirrors.htm.
    These documents are also available in several different languages.


    # Key Concept


    HOWTOs are written by users to describe how they solved a problem. They are easier
    to use than man pages and info and cover different topics. Because HOWTOs are
    frequently updated and new ones published, you should periodically verify that
    you have the latest versions.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'HOWTOs are easier to understand than using man pages or info and frequently
    address issues that are not discussed in other locations. They include topics
    that other users have researched and published that would be useful to other users.


    For example, are you trying to run the game Quake on Linux? Checking the man pages
    and info does not help. However, there is a HOWTO that tells you how to do it.


    # FAQ


    FAQs (Frequently Asked Questions) is a collection of documents that are intended
    to be read in conjunction with the HOWTO documents. They are written in a question-and-answer
    format, addressing those questions that users ask most often.


    FAQs are available in HTML, PostScript, and text formats. Copies of the FAQs in
    all three formats are usually installed in the /usr/doc/FAQ directory by almost
    all distributions. Check online to find the latest version(s) at http://linuxdoc.org/FAQ/.


    # Program Documentation


    Text files that provide more information about specific programs can be found
    in /usr/doc in subdirectories named for the program and version number. These
    provide information on installation, configuration, and use of the application.
    You can usually read them with either less or more.


    In addition, applications usually install a manual page that discusses how to
    use the program. These are found by using the man command discussed earlier in
    this chapter.


    # Internet Resources


    As you know, all the source code for Linux is available on the Internet for download.
    Linux documentation is also online in many locations. The primary source of information
    related to Linux is the Linux Documentation Project at http://metalab.unc.edu/LDP/.
    Here you’ll find all the HOWTOs, mini-HOWTOs, and FAQs. This site also provides
    the ability to search all of the material from one place.


    The Linux Documentation Project also has made available several guides that cover
    specific topics ranging from the kernel to network administration. They are available
    from http://sunsite.unc.edu/LDP. Available guides include


    +   •   The Linux Documentation Project Manifesto, by Matt Welsh

    +   •   Installation and Getting Started Guide, by Matt Welsh

    +   •   The Linux Kernel, by David Rusling

    +   •   The Linux Kernel Hackers’ Guide, by Michael K. Johnson'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The Linux Kernel Module Programming Guide, version 1.1.0 by Ori Pomerantz

    The Network Administrator''s Guide, by Olaf Kirch

    The Linux System Administrators'' Guide, by Lars Wirzenius

    The Linux Users'' Guide, by Larry Greenfield

    The Linux Programmer''s Guide, by Sven Goldt, Sven van der Meer, Scott Burgett,
    and Matt Welsh


    A more recent project to make Linux documentation more user-friendly is under
    way by Linuxnewbie.org (http://www.linuxnewbie.org/). Their goal is to create
    user-friendly documents out of existing HOWTOs, FAQs, and other resources.


    # Newsgroups


    A wealth of information is available via many Usenet newsgroups. The *comp.os.linux.announce*
    newsgroup is a moderated group that contains up-to-date information about software
    updates, new ports, user group meetings, and commercial products. Submissions
    to this group should be emailed to linux-announce@news.ornl.gov.


    *comp.os.linux.answers* contains all the FAQs, HOWTOs, and other important documentation.
    HOWTOs are posted near the beginning of the month. You then can use the NestoHOWTO
    program available from `http://sunsite.munc.edu/pub/Linux/system/news/misc/` to
    assemble the posts.


    Other groups worth reading are in the *comp.os.linux.\** hierarchy. Often, you
    can have a problem that is not in a HOWTO or FAQ but is answered in one of the
    following newsgroups:


    +   - comp.os.linux.setup

    +   - comp.os.linux.hardware

    +   - comp.os.linux.networking

    +   - comp.os.linux.x

    +   - comp.os.linux.development.apps

    +   - comp.os.linux.development.system

    +   - comp.os.linux.advocacy

    +   - comp.os.linux.misc


    Most newsgroups are archived at `http://www.deja.com` and `http://www.altavista.com`
    where you can search postings relevant to a specific topic or forum.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Mailing Lists


    Several mailing lists are available on the subject of Linux. Some of these are
    generic while others apply to a specific distribution.


    You can join a mailing list mirror of `comp.os_linux.announce` by sending email
    to `Linux-Announce-Request@NEWS-DIGESTS.MIT.EDU` with the word `subscribe` in
    the body of the message. Sending an empty message to the same address will get
    you help on using the mailing list (including instructions on how to leave).


    There are several Linux mailing lists hosted at `majordomo@vger.rutgers.edu`.
    Send a message with the word `lists` in the body to find out what lists are available.
    Sending a message with the word `help` will get you instructions for subscribing
    and unsubscribing to the lists. Most of these lists are technical and are not
    intended for new users'' questions.


    Be sure to follow the rules of Net etiquette. Don''t pose a question to a newsgroup
    or mailing list until after you have researched it. Often your question has already
    been posed and answered. Check the documentation (HOWTOs, FAQs, and man pages)
    first, then check the archives at `http://www.deja.com/` before you post.


    If you do post, include as much relevant information about your system and your
    problem as possible, such as general information on the version(s) of your software
    and a brief summary of your hardware configuration. Learn to appreciate the value
    of hacking your system, and how to fix problems yourself.


    # Searching for Information


    There are many other ways to find information about commands when you need help.
    Some of the most frequently used commands are `whereis`, `whatis`, `which`, and
    `apropos`.


    # whereis


    The `whereis` command is used to find files but also will show you the location
    of the file''s binary, source files, and any associated manual pages. One limitation
    of `whereis` is that the search is limited to known directories that are coded
    into the program. Its syntax is


    ```

    whereis [options] filename

    ```


    If you wanted to see where to find `passwd` or its related man pages, you would
    type


    ```

    whereis  passwd


    passwd: /usr/bin/passwd /etc/passwd /etc/passwd.OLD /usr/man/man1/passwd.l

    /usr/man/man5/passwd.5

    ```'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'If the file is not found then only the searched for filename is displayed.


    ```

    whereis foo

    foo:

    ```



    To find only the binary, use the `-b` option; to find only the man pages use `-m`;
    or to find only the source files use `-s`.


    # **which**


    Use the `which` command to find where a command is located. It searches your path
    until a match is found. If a match is not found, `which` displays an error message.


    ```

    ```

    which command

    ```


    ```


    Multiple commands can be passed on the same command line. The `which` command
    is helpful when a command is not responding as you expect. Occasionally, there
    might be more than one command with the same name in different locations. Using
    `which` verifies that you are running the command you thought you were. After
    a match is found, it quits the search and displays the full path to it.


    # **whatis and apropos**


    Both `whatis` and `apropos` derive their information from the man pages.


    # **whatis**


    The `whatis` command displays a summary line about a program that is derived from
    the program’s manual page.


    ```

    ```

    whatis whereis


    whereis (1) - locate the binary, source and manual page files for a command

    ```


    ```


    This information is stored in a database called `whatis` located in the `/usr/man/man1`
    directory and is created/updated by using the command `makewhatis`.


    # **apropos**


    This command helps out when you cannot remember how to do something. You can search
    for almost anything. Say you can’t remember how to change a user’s password; you
    could type `apropos password` to find out how to change it.


    The difference between `apropos` and `whatis` has to do with how they perform
    the search. `apropos` searches for the argument string anywhere on the line---similar
    to `man -k`.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'On the other hand, *whatis* (equivalent to man *-t*) tries to match a complete
    command name only on the part before the hyphen. Consequently, *whatis* *cc* will
    report if there is a cc manual and remain quiet for gcc, while *apropos* would
    successfully find both.


    # **Key Concept**


    Be sure to know the usage of *whereis*, *which*, *whatis*, and *apropos* as listed
    in Table 1.4. You will see all four on the exam.


    Table 1.4 The Usage of *whereis*, *which*, *whatis*, and *apropos*


    | whereis | Returns the path to the command |

    | which | Tells you which command is being executed |

    | whatis | Gives a short description of what a command does |

    | apropos | Searches short descriptions from man pages |


    # ### Writing Documentation


    One of the softer skills that you will be tested on is your ability to document
    your system. This is the one task that most people like the least; however, it
    is one of the most important tasks that administrators do. You can expect to see
    one or two questions on the exam covering the importance of system documentation.


    The first step in creating system documentation is to create and maintain a system
    log. For each computer you should record type of hard drive controller, number
    and size of disks, partitioning scheme, hostname, IP address, attached peripherals,
    and special keystrokes or commands for the machine such as how to configure the
    BIOS.


    Whenever a problem occurs, you should document the details of the problem, what
    you tried, and what finally worked. For example, if you have a *cronjob* that
    fails, you should record the symptoms of the failure and what you did to correct
    it. That way when the same problem occurs at a later date, you will be able to
    solve it in a minimum amount of time.


    As changes are made to each computer, record what they are and why they were made.
    This should include new hard disks, new partitions, applications you install,
    changes to configuration files, and so on. In other words, record everything you
    do. This documentation should be complete enough that the system can be rebuilt
    in a minimum amount of time.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'You also will need to write documentation on how to use the systems at your
    site—both from an administrator''s point of view as well as from a user''s. You
    might want to write a document telling users how to log on or how to run a specific
    application. You should also have documentation on how your system is constructed
    that another administrator could use to rebuild or troubleshoot your system.


    The next question is what format to use for this documentation. There are two
    formats, either electronically or on paper. Table 1.5 compares the pros and cons
    of each format.


    Table 1.5  Comparisons of Paper Versus Electronic Documentation

    | Type | For | Against |

    |---|---|---|

    | Electronic | Easy to update and search. | No access if computer is down. Hard
    to carry around. |

    | | Easy to include command output and screen shots. | |

    | Paper | Available if system is down. | Hard to update or search. |

    | | Can include screen shots and command output. | Can be messy and hard to read.
    |


    If you chose to keep electronic documentation, be sure to plan its format so that
    you can find the information. If you elect to use the paper format, organize it
    as well. Documentation is not helpful if you cannot find the right entry.


    # User Support


    Providing user support can be one of the most challenging tasks you ever have
    to perform. This task requires not just technical proficiency but also good interpersonal
    and communication skills. You must be able to present information to the user
    in such a way that he understands what you are saying. But you must also not make
    the user feel as though you are talking down to him.


    Because providing user support is time-consuming, you need to be efficient without
    giving the impression that the request for help is a waste of your time. One of
    the best ways to be efficient as well as helpful is by having an organized approach
    to every problem.


    You may receive requests for technical support in one of several ways. Perhaps
    you have a method of submitting trouble tickets or the user calls you on the phone.
    No matter how you are approached, your ultimate goal is to make the user more
    productive.


    You also should respond to all requests for assistance in a timely manner. Be
    sure to determine how urgent the problem is and take that into account. You also
    should notify the user if you cannot address her problem immediately and give
    her an estimate of when you will be available.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'First, you must be able to clearly identify the parameters of the problem.
    Determine when and how the problem came about. You always will want to ask when
    the problem first appeared. It is possible that you might get a trouble call that
    is actually a request for new functionality.


    This is where that documentation can come in handy. After you have identified
    the problem, you will want to check your documentation to see if this problem
    has been addressed before. If you are lucky, you will have the solution right
    before you.


    If your contact is via the phone, you can ask questions to better define the problem.
    When a problem is submitted in writing, important information might be missing.
    An exchange of emails might be necessary in order to define the problem appropriately.


    When communicating with a user, be sure to be courteous. Avoid the use of jargon;
    instead, use language the user will understand without talking down to him. If
    written instructions are available, be sure and share them as is appropriate.


    Remember, the trouble ticket is not closed until the user says the problem is
    solved. Even though you think you have answered the user''s questions and that
    the problem is solved, the user might not feel that way. If you need to research
    the problem further, or ask another administrator for help, tell the user what
    you are going to do and when you will get back with her. Making the user feel
    as though she is part of the solution and not just the problem will go a long
    way in making your job easier.


    # Summary


    By now you are comfortable with using the various forms of locally installed documentation.
    When preparing for the exam, be sure to understand the difference between `man
    -k` and `man -K`. The `man -k` command searches the entire contents of the man
    page while `man -K` searches only the description section of the man page.


    Searching within a man page is accomplished using `/;` and continued with `n`.


    You should know when to use `info` versus the HOWTOs and FAQs and how to keep
    the last two up-to-date. Understand the usefulness of newsgroups and mailing lists
    while abiding by the appropriate rules of Net etiquette.


    You should also understand the differences between `whatis`, `which`, `whereis`,
    and `apropos`. The `whatis` command searches the whatis database and displays
    a short description of what the command or utility does. The `which` command lets
    you know what version of a command you are running and its location. The `whereis`
    command gives the location of the command, its source, and its manual pages. The
    `apropos` command displays the name of the man page that has your term in the
    description. You can also expect to see questions on maintaining the various types
    of documentation and dealing with users.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# QUESTIONS AND ANSWERS


    1. You ask a co-worker how to locate a file on your Linux system and he tells
    you to check the man pages for find and locate. What does he mean by the term
    man?


    A: When he mentioned the man pages he was referring to the installed manual pages
    that document every command, utility, and application installed on your system.


    2. You are looking at the man page on using tar to find the option to compress
    the tar file. How can you find it without having to read the entire page?


    A: You can search for a term on the page by typing /compress and pressing the
    Enter key, which will take you to the correct option.


    3. Why does using man command not find the correct manual page?


    A: There are two different man pages on the command. Because man displays the
    first page it finds, that page might not be the page you are looking for.


    4. You have a user who wants to use manual pages in Spanish. How can you configure
    his computer to make this the default?


    A: First, install the Spanish version of the man pages on either a server or the
    user’s computer. Next, edit the user’s .profile file to set the MANPATH variable
    to this new location.


    5. Where can you find information on setting up your new Zip drive?


    A: Searching the man pages does not result in any information. You should check
    the HOWTOs—those installed on either your system or the Internet.


    6. What is the Linux Documentation Project?


    A: The Linux Documentation Project oversees all Linux documentation, including
    manual pages, HOWTOs, FAQs, and tutorials, in an effort to maintain its reliability
    and accuracy.


    7. You find a file in /usr/bin but do not know what it does. How can you find
    this out?


    A: Use the whatis command, which provides a one-line summary of the command’s
    function.


    8. How do you find the exact name of the command to change your password?


    A: Use the apropos command to search the man pages for the password command. apropos
    will then list the man pages that contain it in the headers. If your result is
    not successful, use man -K password to search the entire contents of each man
    page.'
  merge: -1
  img_proc: true
