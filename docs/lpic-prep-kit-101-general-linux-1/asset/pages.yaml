    10. The partition containing users’ home directories is full. Which of the following
    solutions would not work?


    +   a. Create a new partition and move some users’ home directories to the new
    partition.

    +   b. Back up the data, delete and re-create the partition with a bigger size,
    and then restore the data.

    +   c. Delete or move unused files.

    +   d. Instruct users to save files in another partition.


    Answer a is incorrect; by creating a new partition and moving some users’ home
    directories you will solve your space problem. Answer b is incorrect; this is
