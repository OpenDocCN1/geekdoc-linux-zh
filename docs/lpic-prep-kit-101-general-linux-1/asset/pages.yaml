- pgno: 101
  md: "# cp\n\nThe cp command copies both files and directories. The copy operation\
    \ will overwrite any existing file with the same name, so be careful. To prevent\
    \ this, you can use the -b (backup target file) or the -i (interactive) option.\n\
    You also can use the -v option to have the cp command display what files were\
    \ copied and the location to which they were copied. The -r option can be used\
    \ to force the copy operation.\n\n> **Key Concept**\n> \n> The cp command has\
    \ the capability to copy files and directories. It also has the potential to create\
    \ havoc on your system. Use the -f option carefully. The use of either the -i\
    \ or -v option is great insurance against disaster.\n\nTo recursively copy one\
    \ directory’s contents to another, use either the -r or -R option. This also will\
    \ recursively copy the directory structure.\n\nTo preserve file attributes, including\
    \ permissions, owner, group, and timestamps, use the -p option. The -P option\
    \ will copy the directory hierarchy as well as the file(s). For example\n\n```\n\
    cp -P home/user/filename newdir/\n```\n\nwill copy the file home/user/filename\
    \ to newdir/home/user/filename and create any nonexistent directories in the new\
    \ path.\n\nYou also can use metacharacters with the cp command; however, be careful\
    \ because you might get surprising results. To ensure that the results are not\
    \ devastating, consider using the -i or -b options. This is especially helpful\
    \ if you also are using the -R or -P options.\n\nIn addition, the cp command can\
    \ be used to create links rather than copies of the files. The -s option makes\
    \ symbolic links, whereas the -i option makes hard links. You cannot use cp -i\
    \ to create links to directories. See Chapter 6, \"Maintaining the Filesystem,\"\
    \ for more details on links.\n\n# dd\n\nThe dd (device to device copy) is a special\
    \ kind of copy utility. Its primary use is to copy files to other devices such\
    \ as tape drives or floppies. It is often successful copying from one operating\
    \ system to another when other methods fail. The syntax for dd is\n\n```\ndd [arguments]\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 102
  md: "Several arguments are available. One of the features of `dd` is the capability\
    \ to specify block size as part of the `cp` command, giving you considerable control\
    \ over the copy operation.\n\nSome of the more common arguments are\n\n+   `if=filename`\
    \  Specifies the source file\n+   `of=filename`  Specifies the output file\n+\
    \   `bs=block size`  Specifies how many bytes to read/write at one time\n\nAn\
    \ example of making a backup of a floppy disk is\n\n```\ndd if=/dev/fd0 bs=512\
    \ of=MyFloppy\n```\n\nThis command makes a copy of the floppy disk saved to a\
    \ file named MyFloppy.\n\n# **mv**\n\nThe `mv` command is used to rename or move\
    \ files to another location on the directory tree. Exercise caution: If you use\
    \ the `mv` command to move a file to a location that contains an existing file\
    \ of the same name, the existing file will be overwritten *without warning*. When\
    \ evaluating questions on using either the `mv` or `cp` command, be sure to keep\
    \ this in mind.\n\nThe syntax for `mv` is\n\n```\nmv [option] [source file] [target\
    \ file]\n```\n\nOne way to prevent the loss of a file is to use the `-b` option,\
    \ which creates a backup of the file that is overwritten. For example\n\n```\n\
    mv -b test1 test2\nls test*\ntest1 test2~ test2\n```\n\nAnother helpful option\
    \ to prevent inadvertent loss of files is the `-i` option, which forces `mv` to\
    \ ask before overwriting an existing file. You will be prompted to reply `y` or\
    \ `n` for each file that is replaced. This prevents you from inadvertently overwriting\
    \ a critical file.\n\n> **Key Concept**\n> \n> The `mv` command has the capability\
    \ to relocate files and directories. Be careful using it. Be sure you understand\
    \ the effect of using the `-f` option. Consider using the `-i` option, especially\
    \ when moving executable files."
