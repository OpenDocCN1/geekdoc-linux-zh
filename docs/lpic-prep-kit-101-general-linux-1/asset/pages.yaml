- pgno: 320
  md: '# # Using the CD-ROM


    The CD-ROM accompanying this book contains 250 questions that comprise the practice
    tests covering the material you have studied. These questions should be used when
    you have finished the book and think you are ready to take the exam.


    All the questions presented here are multiple choice or short answers. When typing
    in your answers, use lowercase unless a command requires uppercase. These are
    the same types of questions you will see on the exam.


    # ## Equipment Requirements


    To use the Self-Tests, you must have an Intel-based computer running the Linux
    operating system. The distribution does not matter. The test is designed to run
    under the command-line interface; therefore, it is not guaranteed to run correctly
    in a terminal window under X.


    # ## Installing the Self-Test Software


    Installation consists of creating a directory and copying the appropriate files
    from the CD-ROM to this directory. The steps to do this are as follows:


    +   1.  Create a directory to contain the testing files. Usually, this should
    be a subdirectory of your home directory.


    +   2.  Copy the following files into this directory:

    +       1pic

    +       test'
  merge: -1
  img_proc: true
- pgno: 321
  md: '+   3. While this directory is your working directory, first use the su command
    to become root and then change the ownership of these files by issuing the following
    command:

    +   ```

    +   chown <your name> *

    +   ```

    +   4. Type exit to quit being root. Change the a.out file to be executable by
    issuing the following command:

    +   ```

    +   chmod a+x 1pic

    +   ```

    +   5. Verify that you have the permission to read the test file by using the
    ls -l command. If you need to change it then issue this command:

    +   ```

    +   chmod a+r test

    +   ```


    # Running the Self-Test Software


    To run the Self-Test Software, make the directory containing the files your working
    directory and then type

    ```

    ./1pic

    ```


    When you start the test, you will be presented with a screen in which you can
    select which test you want to take. Tests 1-5 each randomly present 50 questions
    from a static pool of questions. After you finish all five tests, you will have
    seen all the questions. Test 6 presents you with 50 questions randomly selected
    from all the questions. This will be very similar to taking the real exam.


    Make sure your Caps Lock key is not on while taking this test. All answers are
    case sensitive, so your answer might be scored as incorrect if you use capital
    letters.


    During the test, you can quit at any time by typing the letter q and pressing
    Enter. You then will be given the chance to score your test or quit.


    To answer a question, type your answer and then press Enter to proceed to the
    next question. If you want to come back to this question later, type the letter
    w and press Enter. (Notice that it must be a capital w.)


    # Scoring Your Test


    When you finish a test, you will be presented with your overall score. In addition,
    your score will be broken down according to objectives. You should use this information
    as a guide to further study.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'For any questions you answered incorrectly, you will be presented with the
    question as well as an explanation of the correct answer. The appropriate place
    in the book discussing this material also will be listed. If you miss a question,
    take the time to determine why you got the answer wrong.


    # Technical Support


    Like any application, surprises ocasionaly can occur. Every effort has been made
    to ensure that this application will run on any distribution of Linux. If any
    problems should occur, please email a detailed description of what happened to
    ronnart@ibm.net. You also can use this method if you have any technical questions
    about this application.


    We hope that this exam will be a satisfying experience and wish you the best of
    luck in your certification quest.'
  merge: -1
  img_proc: true
