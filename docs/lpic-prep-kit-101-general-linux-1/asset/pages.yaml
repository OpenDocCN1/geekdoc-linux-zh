    \ If you delete it, you will not be able to restore the old MBR.\n\n> **Key concept**\n\
    > \n> You can use the fips utility to dynamically divide an existing FAT partition\
    \ to create space for installing Linux.\n\n# fdisk\n\nBe sure to keep good notes\
    \ while partitioning your drive. You will want to note starting and ending cylinders,\
    \ partition size in blocks, and any error messages you might get.\n\n*Cylinder*\
    \ refers to the total of the tracks that have the same location on each disk’s\
    \ surface. *Tracks* are the concentric circles on a disk.\n\nWhen using fdisk,\
    \ you must enter starting and ending cylinders for each partition. To create a\
    \ partition, follow these steps:\n\n+   1. Size the partition.\n+   2. Designate\
    \ its type.\n+   3. Write it to the partition table.\n\nUsing fdisk and each of\
    \ the previous steps are covered in the following sections.\n\nfdisk takes the\
    \ name of the disk you want to partition as an argument or value.\n\nFor example,\
    \ to create partitions on the second SCSI drive in your system, you would type\n\
    \n```\nfdisk /dev/sdb\n```"
  merge: -1
  img_proc: true
- pgno: 68
  md: 'If you use fdisk without an argument, it assumes you want to partition `/dev/hda`.
    Some operating systems require that they be installed on the first partition of
    the first disk. Because Linux does not care what disks you use, you might want
    to create partitions on different hard disks. Just run fdisk for each hard disk
    you need to partition.


    When using fdisk, you can get a menu of available options by typing m, as in the
    following example:


    Command (m for help): m

    Command action

    a toggle a bootable flag

    d delete a partition

    l list known partition types

    m print this menu

    n add a new partition

    p print the partition table

    q quit without saving changes

    t change a partition''s system id

    u change display/entry units

    v verify the partition table

    w write table to disk and exit

    x extrafunctionality


    Command (m for help):


    If you create logical drives, you must reboot your system and go through the same
    options as before. However, when fdisk asks if you want to partition your drive
    the second time, say no.


    You should use the Linux version of fdisk only to create or delete partitions
    for the Linux operating system. If you try to create or delete partitions for
    other operating systems with this version of fdisk, the other operating system
    will not recognize the partition.


    After creating your partitions, you need to activate your swap partition(s), select
    the partition to be used as root, and format your partitions.


    # Key Concept


    The fdisk utility can be used to create or delete partitions. It also can be used
    to view your partition table.


    Let''s walk through creating a couple partitions. If you have any existing partitions
    you will not be using, you can use the d command to delete them.'
  merge: -1
  img_proc: true
- pgno: 69
  md: "# **Step 1: Create a Primary Partition**\n\nFirst, type n to create a new partition.\
