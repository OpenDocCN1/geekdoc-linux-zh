  md: '```

    rWX------

    rw------

    rw-rw-r-

    rWX-----

    rw-rw-r-

    rw-r-xp-x

    ```


    You can use the `-d` option to define which character should be used as a delimiter
    when counting fields and the `-f` option to let cut know which fields to return.
    If you had a comma-delimited file and want to see all the names listed in the
