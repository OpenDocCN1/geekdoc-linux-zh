- pgno: 6
  md: '# ## Acknowledgments


    I want to take this opportunity to thank my acquisitions editor, Tracy Williams,
    and my development editors, Jill Hayden and Valerie Perry, who worked so diligently
    to make this the best book possible. In addition, I want to thank everyone else
    at Macmillan who worked together to present you, the reader, with the material
    you need to pass your certification exam in a format that helps, rather than hinders,
    your learning experience.


    Theresa


    # ## About the Author


    **Theresa Hadden**, MCSE, MCT, and SAIR Linux certified, teaches Microsoft server
    products, Linux, and security courses. She presents both Microsoft official curriculum
    and custom prepared courses to prepare students for certification exams, as well
    as post-exam reviews. In addition, she teaches Linux Intro and system administration
    courses for Compaq and has been active in LPI’s Linux community in the mailing
    list and other venues, providing input and suggestions for the objectives and
    questions on the test. Theresa has more than 15 years system administration experience
    using Novell, UNIX, and Windows NT. She works with small- to medium-sized businesses
    needing LAN/WAN capabilities or Internet access using both Linux and Microsoft
    products. Theresa also provides installation, administration, and educational
    services to her clients.


    # ## About the Technical Editors


    **Craig and Coleta Wtherspoon** have been working with and writing about computers
    since the 1970s. They began their careers writing training and promotional materials
    for multinational corporations. They are the authors of about 20 books (including
    four books on the Linux operating system) and technical editors for about two
    dozen other books, and have been involved in the LPIC 101 General Linux I test
    since its beta-test stage.'
  merge: -1
  img_proc: true
