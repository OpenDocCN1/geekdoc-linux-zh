- pgno: 369
  md: '# # Linux and UNIX Installation Instructions


    These installation instructions assume that you have a passing familiarity with
    UNIX commands and the basic setup of your machine. Because UNIX has many flavors,
    only generic commands are used. If you have any problems with the commands, please
    consult the appropriate man page or your system administrator.


    +   1. Insert CD-ROM in CD drive.


    +   2. If you have a volume manager, mounting of the CD-ROM will be automatic.
    If you don''t have a volume manager, you can mount the CD-ROM by typing


    ```

    Mount -tiso9660 /dev/cdrom /mnt/cdrom

    ```


    NOTE: /mnt/cdrom is just a mount point, but it must exist when you issue the mount
    command. You may also use any empty directory for a mount point if you don''t
    want to use /mnt/cdrom.'
  merge: -1
  img_proc: true
