    \ \n```\n```\n\nThis command deletes the child directory only. If there are more\
    \ subdirectories in the parent directory, they will not be deleted. However, if\
    \ you type\n\n```\n``` \nrmdir -p testing/parent/* \n```\n```\n\nall empty subdirectories\
    \ of the directory parent will be deleted.\n\n# Regular Expressions\n\nRegular\
    \ expressions are patterns with specific syntax that are used to match strings.\
    \ They define a set of one or more characters. Regular expressions are used by\
    \ many utilities, such as editors, when searching through files. In addition,\
    \ each shell uses regular expressions in somewhat different ways when searching\
    \ for files.\n\nPattern characters that you should be familiar with are listed\
    \ in Table 4.6.\n\nTable 4.6 Regular Expression Patterns\n| Pattern | Function\
    \ |\n| :--- | :--- |\n| * | Matches zero or any character(s) |\n| ? or . | Matches\
    \ any single character |\n| [XXX] or [X-x] | Matches a character in a set or range\
    \ of characters |\n| [^XXX] | Matches any character except in the set |\n| \\\
    \ | Matches special characters |\n| ^pattern | Matches pattern to the beginning\
    \ of a line |\n| pattern$ | Matches pattern to the end of a line |\n| x{n,m} |\
    \ Matches a range of instances |\n| + | Matches one or more characters |"
