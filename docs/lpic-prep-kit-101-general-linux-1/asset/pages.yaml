- pgno: 91
  md: '# ## Basic File Management Commands


    This chapter discusses the basic commands used to manage your files and directories.
    These commands are the foundation necessary for you to perform the day-to-day
    tasks associated with the job of system administration. Table 4.1 lists these
    commands along with a short description of each command''s purpose.


    | **Table 4.1** Commands Covered in This Chapter and Their Purpose | | |

    | --- | --- | --- |

    | **Command** | **Purpose** | |

    | cd | Sets location in fileSystem | |

    | ls | Displays contents of directory | |

    | file | Determines file''s type | |

    | cat | Displays file''s contents | |

    | more | Displays file''s contents one screen at a time | |

    | less | Displays file''s contents one screen at a time | |

    | wc | Shows character, word, and line counts | |

    | head | Displays first few lines of a file | |

    | tail | Displays last few lines of a file | |

    | touch | Changes file''s timestamp; create an empty file | |

    | cp | Copies a file | |

    | dd | Copies a file from one device to another | |

    | mv | Changes a file''s name or location in the fileSystem | |

    | rm | Deletes a file | |

    | mkdir | Creates a directory | |

    | rmdir | Deletes a directory | |


    Many commands are used in performing file management, and you will need to be
    familiar with them for the exam. Rather than being asked what a command does,
    you will be asked about its functionality, or you will be given an example containing
    a command and have to predict the results of running that command. You also might
    see these commands used to solve a scenario question, so you need to be sure you
    understand each one.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# cd


    When you first log on to your computer, you are placed in your home directory.
    To change to other directories, you use the command **cd** (change directory)
    followed by the name of the new directory. The new directory then becomes your
    working directory. The syntax for cd is


    ```

    ```

    cd [dir]

    ```


    ```


    When designating a new directory, you can use either a *relative or absolute*
    path. The absolute path begins at the root or top of the filesystem and defines
    the complete route to your destination. For example


    ```

    ```

    cd /home/hadden/letters

    ```


    ```


    would locate the destination by starting at the root (/), then the home directory,
    then the hadden directory, and finally the letters directory. A relative path
    starts looking at the working directory and traverses down the path. So if your
    working directory is /home/hadden you could type


    ```

    ```

    cd letters

    or

    cd letters/Aug

    ```


    ```


    which would change to the letters subdirectory of /home/hadden. However, if the
    working directory is /home/hadden/memos you would receive an error message that
    the directory letters does not exist.


    If you use a relative path with cd and the command fails, check to see that you
    are really where you think you are. To do this, use the command pwd (present working
    directory), which does not take any arguments. The pwd command outputs the absolute
    path to the working directory to your screen.


    If you want to return to your home directory, you have several options. You can
    use the cd command followed by the absolute path to your home directory. A better
    way, however, is to use the cd command without any arguments. For example


    ```

    ```

    $ pwd

    /home/hadden/letters/Aug

    $ cd

    $ pwd

    /home/hadden

    ```


    ```'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Key Concept


    As the structure of your home directory becomes more complex, the use of the cd
    command to return to your home directory and the pwd command to determine where
    you are will prevent you from forgetting where you are or saving a file to the
    wrong directory.


    # ls


    File listings can be obtained using several different commands; the most often
    used command is ls. It has many options that alter its behavior.


    If you are using bash (the Bourne Again Shell), you can get a file listing of
    the present working directory (pwd) unless it is otherwise specified with either
    the ls or dir command. The syntax for these two commands is


    ```

    ls [options] [name]

    dir [options] [name]

    ```


    You should be familiar with the following options that work with either ls or
    dir.


    +   *   -a    Lists all files, including hidden files

    +   *   -A    Lists all files, except the current and parent directory

    +   *   -c    Sorts files by time or chronologically (oldest first)

    +   *   -d    Lists only the name of a directory, not its contents

    +   *   -l    Lists in long format (showing permissions and other details)

    +   *   -r    Lists in reverse order

    +   *   -t    Sorts files by time (newest first)

    +   *   -x    Lists all files across the page in columns

    +   *   -m    Lists files in a single line separated by commas

    +   *   -F    Appends a / after each directory and a * after binaries

    +   *   -R    Lists all files recursively down the tree

    +   *   --color={never, always, auto}    Lists colors based on file type

    +   *   --help    Displays a synopsis of options'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'When specifying names, you can use wildcards, which are discussed later in
    this chapter and also in Chapter 8, “Text Streams.” A *wildcard*, also called
    a *metacharacter*, is a character that represents zero or more characters.


    One of the most commonly used wildcards is the `?`, which results in a match to
    any single character, including the `?`. The second most commonly used character
    is the asterisk (`*`). It matches to any number of any characters; in other words,
    it matches to anything and everything.


    Some other things you need to know about the resulting file listings using the
    `ls` command are


    +   - The default order is to list files beginning with numeric characters first
    and then all upper- and lowercase filenames last. Directory names are treated
    as filenames.


    +   - Using either `ls` or `dir` without any options will display the listing
    in sorted, vertical columns.


    +   - Hidden files, those starting with a `.` , will not be listed unless you
    use the `-a` or `-A` option. These are usually configuration files.


    +   - Colors are assigned by the file `/etc/DIR_COLORS`. Copy this file to your
    home directory as `.dir_color` to customize your colors.


    A listing that results from issuing `ls -1` could look like this:


    ```

    # ls -1

    ..

    drwxr-xr-x 23 root root  2048 May  4 10:13 ./

    drwxr-xr-x 17 root root  1024 Apr 29 01:26 ../

    1rwxwxwx 1 root root     11 Dec 31 17:07 rmt ->

    2m../sbin/rmt*

    -rw-r-r--  1 root root 434898 Jul 31 1998  yp.conf

    ```


    This produces a lot of information. The current directory is represented by a
    single dot (.) and the parent directory is represented by two dots (..). Reading
    from left to right, the columns are as follows:


    ```

    1rwxwxwx 1 root root     11 Dec 31 17:07 rmt ->2m../sbin/rmt*

    ```


    Using the previous line as an example


    +   - File type (first character of first column) is 1 for link


    +   - Permissions (next nine characters of first column) is `rwxwxwx`


    +   - Number of links (column 2) is 1


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_94_0.png)'
  merge: -1
  img_proc: true
- pgno: 95
  md: '+   * Owner (column 3) is root

    +   * Group (column 4) is root

    +   * File size (in bytes) (column 5) is 11

    +   * Date and time last modified (columns 6-8) is **11 Dec 31 17:07**

    +   * Filename (column 9) is *rmt*

    +   * Linked file (column 10) is *->2m../sbin/rmt*


    You can display the contents of other directories or further limit what files
    are listed by providing a name or names. You can use wildcards or metacharacters
    when specifying what to list. Some examples are listed and explained in Table
    4.2.


    Table 4.2 Some Examples of Using the 1s Command

    Command Output

    1s /usr/sbin Lists all the files in the /usr/sbin directory

    1s -m *.txtc Lists all files in the pwd with an extension of txt in a single line
    separated by commas

    1s -t memo? Lists all files whose name begins with memo plus any single character
    in reverse chronological order

    1s -R / Lists all files starting at root (/) and recursing through all subdirectories

    1s -Rd /*/*/* Lists only directories starting at root (/) and recursing through
    three levels of directories


    You also can use these options with the dir command. Another file listing command
    you might see is vdir, which is the same as ls -1.


    Notice the use of * and ? to represent characters. The * matches zero or any number
    of characters, while the ? represents any single character.


    A wildcard or metacharacter is any character that represents zero or more characters.
    A wildcard has a special meaning to a command, utility, or program, and this meaning
    can be different depending on the command being used. The two most common uses
    of metacharacters are for ambiguous file references by the shell or as part of
    regular expressions, which are introduced later in this chapter.


    Throughout this book you will see different wildcards or metacharacters used.
    Their usage is dependent on the command, utility, or shell interpreting the command.
    Examples of how to use metacharacters will be given as each command interpreter
    is discussed.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# file


    Previously when you looked at the output of the `ls -l` command, I mentioned that
    the character in column one designates the type of file. A file can be thought
    of as a collection of information referred to by a name. Linux views peripheral
    devices as files, enabling you to read and write to them the same as you do with
    any other type of file. Types of files include


    +   - Ordinary files, such as text or binary

    +   - Directories

    +   - Printers

    +   - Hard disk

    +   - Floppy disk

    +   - CD-ROM


    The `file` utility enables you to get information about the contents of a file
    without having to examine the file directly. The output classifies the file by
    type. Although `file` presents information on any file, this information is not
    always correct. The syntax for `file` is


    ```

    file [options] filename

    ```


    By default, the output of the `file` command displays the name of the file followed
    by a brief classification. To prevent listing the filename, use the `-b` option.
    A list of files to be examined can be passed to the file command by using the
    `-f` file list option.


    `file` will attempt to examine compressed files if you use the `-z` option. A
    discussion of compressed files is presented later in this chapter.


    The following is sample output from the `file` command


    ```

    $ file letters dog shout

    letters: directory

    dog: ascii text

    shout: executable

    ```


    # cat


    The `cat` (concatenate file) command can be used to create new files; however,
    it is primarily used to send the contents of one or more files to your display
    or other output device. `cat`''s functionality can be increased by using either
    `>` or `>>`.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'The > is called a pipe or redirector. It is used to direct output to a location
    other than the standard output device, such as the display. The > can be used
    to write the output of a command to a file or other device, such as a printer.


    The use of >> also redirects the output, but it appends to the existing file rather
    than overwrites it. See Chapter 8 for more details on using pipes.


    The syntax for cat is


    ```

    cat [OPTION] [FILE]...

    ```


    To create a new file, type


    ```

    cat > newfilename

    file_contents

    Ctrl-D

    ```


    Ctrl-D is the end of file (EOF) character and will close the file. To display
    the contents of one or more files to the standard output, type


    ```

    cat file1 file2

    ```


    This displays the contents of `file1` followed by the contents of `file2`. You
    also can do this by typing


    ```

    cat file?

    ```


    This lists the contents of all files whose name is `file` plus one additional
    character. If the only files present that satisfy this reference are `file1` and
    `file2`, the output will be the same as in the first example.


    To combine multiple files into one, type


    ```

    cat file1 file2 file3 > file4

    ```


    This command creates a new file called `file4`, which contains the contents of
    `file1`, `file2`, and `file3`. If, however, you want to add the contents of `file1`
    to the end of `file2`, type


    ```

    cat file1 >> file2

    ```


    You also can use cat to overwrite an existing file.


    ```

    cat > existing_filename

    This is the new contents

    <ctrl>D

    ```


    The end result is to remove the old contents and insert the new contents into
    the existing file. Table 4.3 shows the options used with cat. You need to be familiar
    with these for the exam.'
  merge: -1
