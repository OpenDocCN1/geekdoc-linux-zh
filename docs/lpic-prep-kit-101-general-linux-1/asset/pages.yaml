- pgno: 173
  md: "# # Manage Users and Groups\n\nWhen Linux is installed, root is the only user\
    \ account that is created. Because access to a Linux system requires a user account,\
    \ the administrator will have to create accounts for all other users.\n\n# ##\
    \ root\n\nThe root account is known also as the superuser because this account\
    \ can do anything it wants, including accessing any file or device. The root account\
    \ also can delete anything on the system, possibly resulting in a corrupted system.\
    \ For this reason, you should be very careful when doing anything while logged\
    \ on as root.\n\nThe root account should be used only when necessary, such as\
    \ for system maintenance. To further protect your system, assign to the root account\
    \ a strong password that is not easily guessed. The password should be changed\
    \ frequently. Selecting passwords is discussed later in this chapter.\n\nThe root\
    \ account is the account that has an ID number of zero and is defined in the file\
    \ /etc/passwd. There is no rule that the root account cannot be known by any other\
    \ name because the system identifies all users by UID and not username. Although\
    \ the superuser account is given the name \"root\" during installation, you can\
    \ change it after the system is installed—as long as the UID remains zero (0).\n\
    \n> **Key Concept**\n> \n> The superuser account is known as root by default.\
    \ However, you can change its name to anything else you want. The only requirement\
    \ is that the UID must be zero (0).\n\nAnother way to protect your system is by\
    \ creating special login accounts to be used when performing certain system tasks\
    \ that do not need extensive privileges. By creating logins that have been granted\
    \ limited administrative privileges, you protect your system from inadvertent\
    \ mistakes as well as malicious mischief.\n\n# ## The *su* Command\n\nThe *su*\
    \ command provides you with the capability to perform a task with credentials\
    \ different from those of your present logged-in identity. It is used in two different\
    \ contexts:\n\n+   - When you are logged in as a user and need to do something\
    \ as root\n+   - When you are logged in as root and want to impersonate another\
    \ user"
  merge: -1
  img_proc: true
- pgno: 174
  md: 'You should not perform day-to-day tasks while logged in as root because it
    puts your system at risk. If you need to perform an administrative task, you could
    log out and then log in as root. While logged in as root, you can perform the
    task and then log out and log back in as a user.


    This is time-consuming, and using the `su` command provides a shortcut. If you
    type `su` at a command prompt, you will be prompted for root''s password. If you
    enter the correct password, you will be logged in as root and your working directory
    will be the same as before you executed the command.


    If you want to log in as another user, issue the command


    ```

    su username

    ```


    This will prompt you for that user''s name. If you supply the correct password,
    you will be logged in as that user. If you run this command while logged in as
    root, you will not be prompted for a password.


    By default, the `HOME` and `SHELL` variables are reset to that of the user. If
    you also want configuration files to be read, you can use the `-` option. What
    this means is, if you type


    ```

    su Mary

    ```


    and supply Mary''s correct password, your working directory will remain the same;
    however, you will be logged in as Mary. If you also want to have Mary''s home
    directory as your working directory, type


    ```

    su - Mary

    ```


    Now you are logged in as Mary and her home directory is your working directory.


    If no username is provided when using the `su` command, root is assumed. Any user
    can use the `su` command to log in as root or any other user, as long as she knows
    the correct password. However, root can log in as any other user without needing
    to know the password.


    # Creating User Accounts


    Even if you are the only user on your system, the first task you should address
    after installing Linux is to create a user account for yourself. You also will
    need to create user accounts for everyone else who might need to access your system.


    By having every user use his own account, you increase the security of your system.
    You can define how much access any user has to any resource. This includes setting
    permissions on any file or directory on a user-by-user basis. (See Chapter 9,
    “Permissions,” for more information on managing permissions.) In addition, this
    will enable you to track a user''s activity.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# The /etc/passwd File


    All information about user accounts is included in the file `/etc/passwd` in a
    specific format. For the exam, you need to know what each field is used for and
    how other programs use this information. This file contains the user''s login
    name, user ID, password, full name, and other information as shown in Table 7.1.


    Table 7.1 Fields Contained in the /etc/passwd File


    Chapter 9 discusses how the permissions are set on the /etc/passwd file. This
    file is owned by root with root having rw- permissions. Everyone else, including
    the group, can only read this file.


    A sample /etc/passwd file might look like this:


    ```

    root:Mr cx.kSGtY Q0:0:0:root:/root:/bin/bash

    hadden:h4cSU0W27LGjs:503:500:Theressa Hadden,Home Office,555-5555,222-2222:/home/hadden:/bin/bash

    bin::1::1::bin:

    daemon:*::2::2:daemon:/sbin:

    adm:*::3::4:adm:/var/adm:

    lp: : 7:1:lp:/var/spool/lpd:

    Sync: : 0:0:sync:/sbin:/bin/sync

    shutdown: : 0:0:shutdown:/sbin:/sbin/shutdown

    halt: : 7:0:halt:/sbin:/sbin/halt

    mail: *::8:12:mail:/var/spool/mail:

    news: *:: 9:13:news:/var/spool/news:

    uucp: *::10:14:uucp:/var/spool/uucp:

    operator: *::11:0:operator:/root:

    games: *::12:100:games:/usr/games:

    gopher: *::13:30:gopher:/usr/lib/gopher-data:

    ftp: : 14:50:FTP User:/home/ftp:

    nobody:*::99:99:Nobody:/

    ```'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Even if a field is blank, it still needs to be defined by a colon (:). For
    example, the record for the user account mail ends in a colon because no login
    command is defined for this user. This same format is used on almost all UNIX
    systems.


    > **Key Concept**

    > Each line in the /etc/passwd file must contain seven fields. Although some of
    these fields might be blank, they still need to be defined by colons.


    # Username Field


    The first field is the username. It must be unique to the system. It is usually
    eight characters or less and can contain letters, numbers, underscores, periods,
    and some special characters. However, the use of non-alphanumeric characters can
    lead to problems with some applications. In addition, usernames are case sensitive,
    so the usernames thadden and Thadden are two different users.


    Because usernames are used for many purposes including mail and must be unique
    to your system, you need to consider how you are going to assign usernames. If
    you have only a few users on your system, it is not as important to be consistent
    with usernames. However, when a system is larger, it becomes too difficult to
    figure out just who a user is if there is not a logical method of assigning usernames.


    One method of naming users is by using a combination of the first initial and
    part or all of the last name. So, a user by the name of Theresa Hadden would be
    given a username of thadden. Another combination could be first name and last
    initial, such as theresh. Be consistent in whatever method you decide to use.


    # Password Field


    The next field in each record of the /etc/passwd file is the password. These passwords
    are stored in an encrypted fashion by the operating system. If this field becomes
    damaged in any way, that user will not be able to log in to the system until the
    administrator assigns a new password to this account.


    You can use this field to prevent a user from logging in to the system by placing
    an asterisk (*) in this field. Although the user will be unable to log in, she
    might still gain access remotely and run commands, so don’t depend on this method
    as your only line of defense.'
  merge: -1
  img_proc: true
- pgno: 177
  md: "If you need to temporarily restrict a user’s access, place an asterisk at the\
    \ beginning of the password field for her account. Be careful not to make any\
    \ other changes to this field. Although this is not 100 percent foolproof, it\
    \ is usually adequate. You can use this method for users who are on vacation or\
    \ away for an extended period of time.\n\nIf this field is left empty, only the\
    \ username is required to log in. The user will not be prompted for a password.\
    \ Although this is sometimes helpful, if you want to have a guest account, it\
    \ is also a significant security risk. Make sure that if you have an account with\
    \ a blank password, you lock the account’s access down as much as possible.\n\n\
    # User ID Field\n\nThe third field in each record is the user ID (UID). The system\
    \ tracks users by UID rather than by name. For example, when a user starts a process,\
    \ his UID is associated with that process and is displayed when using the ps command.\n\
    \nGenerally, ranges of UIDs are used to define the type of account. UIDs less\
    \ than 100 are usually reserved for system accounts, root always has a UID of\
    \ 0, and users are given UIDs greater than 100. The starting number for user IDs\
    \ varies with different distributions but the principle is the same. The beginning\
    \ user ID is defined in the `/etc/login.defs` file, an example of which might\
    \ look like the following:\n\n```\n# *REQUIRED*\n#   Directory where mailboxes\
    \ reside, _or_ name of file, relative to the\n#   home directory.  If you _do_\
    \ define both, MAIL_DIR takes precedence.\n#   QMAIL_DIR is for Qmail\n\n#MAIL_DIR\
    \       Maildir\nMAIL_DIR        /var/spool/mail\n#MAIL_FILE        .mail\n\n\
    # Password aging controls:\n#\n#\tPSS_MAX_DAYS\t\tMaximum number of days a password\
    \ may be used.\n#\tPSS_MIN_DAYS\t\tMinimum number of days allowed between password\
    \ changes.\n#\tPSS_MIN_LEN\t\tMinimum acceptable password length.\n#\tPSS_WARN_AGE\t\
    \tNumber of days warning given before a password expires.\n#\nPASS_MAX_DAYS  \
    \     99999\nPASS_MIN_DAYS       0\nPASS_MIN_LEN        5\nPASS_WARN_AGE     \
    \  7\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: "```\n```\n#\nUID_MIN\t\t500\nUID_MAX\t\t60000\n\n# Min/max values for automatic\
    \ gid selection in groupadd\n# GID_MIN\t\t500\nGID_MAX\t\t60000\n\n# Require password\
    \ before chfn/chsh can make any changes.\n# CHFN_AUTH\t\tyes\n\n# Don't allow\
    \ users to change their \"real name\" using chfn.\n# CHFN_RESTRICT\tyes\n\n# If\
    \ defined, this command is run when removing a user.\n# the user to be removed\
    \ (passed as the first argument).\n# #USERDEL_CMD\t/usr/sbin/userdel_local\n\n\
    # If useradd should create home directories for users by default\n# This option\
    \ is Overrid with the -m flag on useradd command line.\n#\tCREATE_HOME\tyes\n\
    ```\n```\n\n# **Group ID Field**\n\nThe group ID (GID) is used to define what\
    \ group the user is a member of when she logs in. This is referred to as the user’s\
    \ default login group. Groups are used to organize users. The GID is used by the\
    \ operating system to track file permissions and is defined in the /etc/group\
    \ file, which is discussed later in this chapter.\n\nSystem groups are usually\
    \ numbered 0–49, and the numbering of user groups starts at 50 or more depending\
    \ on the distribution. The beginning user group ID is defined in the /etc/login.defs\
    \ file.\n\nOn many systems, a default group called group or users gets the first\
    \ GID available for use by a user group. All users are then made members of this\
    \ group."
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Comments Field


    This is not a required field but can be used to provide useful information. If
    the field is left blank, be sure to include the colon to designate that it is
    blank.


    Most commonly, this field includes the user''s full name, but it also can include
    phone numbers, departments, and other information. The finger command uses this
    field when returning user information. Email systems also can use this field to
    show who is sending mail.


    # Home Directory Field


    When a user logs on to the system, the login process uses this field to determine
    where to locate the user in the directory structure after a successful login.
    For users, this field usually contains the path to the user''s home directory.
    If this field contains an invalid directory name, the user''s login attempt will
    fail.


    # Login Command Field


    This field defines what command to execute when the login process terminates.
    Most of the time this will be a command that will start a shell program. This
    command can be used to restrict what a user can perform, such as to run a single
    application. If this field is left blank, the default shell is usually run.


    This entry can be changed by the user by using the command csh. The command csh
    consults the /etc/shells file to determine whether the user''s entry is valid.


    # The passwd Command


    Passwords are changed using the passwd command. Any user can change his own password,
    and root can change any user''s password. The syntax for passwd is


    ```

    passwd [user]

    ```


    When a user changes his password, he does not need to specify his username; however,
    he will be prompted for his old password before entering the new one. When root
    changes a user''s password, it specifies the username but does not have to know
    the user''s present password.


    The passwd command requires that the new password be entered twice before it is
    changed. This helps prevent users locking themselves out by making a typographical
    mistake.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Key Concept


    The passwd command is used to change passwords. Users can change only their own
    passwords, but root can change anyone''s password.


    Many passwords also can be changed at once as a batch by using the chpasswd command
    by root. Its syntax is

    chpasswd [option]


    The chpasswd command reads a file containing the username and password combinations
    in the format username:password with one user''s entry per line.


    By default, the chpasswd command encrypts the password before storing it. However,
    you can provide the passwords in an encrypted format and use the -e option, which
    will prevent chpasswd from performing any encryption.


    Password characteristics are defined in the /etc/login.defs file. Use this file
    to define how long a password must be, when the password expires, and how long
    before expiration the user will be prompted to change her password. It also defines
    the directory where mailboxes are.


    Passwords are your first line of defense in protecting your system. You should
    periodically educate your users about the need to not share their passwords, to
    change their passwords on a regular basis, and to choose a good password.


    Passwords should be at least six characters in length. Using a dictionary word,
    username, pet or spouse name, or other easily guessed password should be discouraged.
    The use of mixed case, numbers, and symbols strengthens your passwords. Because
    the strongest passwords are also those that are the hardest to remember, they
    are often written down and stored on the monitor, under the keyboard, or in a
    desk drawer.


    One way to prevent this behavior is to encourage your users to use two easily
    remembered words joined by a symbol, such as dog$cat. This password can be further
    strengthened by either adding numbers and/or uppercase characters, such as 14gg$CaT.
    If users construct their passwords in this manner, they create stronger passwords
    that they can remember easily.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# ### Shadow Passwords


    If the *passwd* field in your `/etc/passwd` file is x, your system is using a
    shadow password file. This file contains the username and the user''s encrypted
    password. It also can contain the password aging information, such as when a password
    expires. The available fields in the `/etc/shadow` file are


    +   - The username

    +   - The encrypted password

    +   - The number of days that have elapsed between Jan. 1, 1970, and the date
    when the password was last changed

    +   - The minimum password age or how long a user must wait before changing his
    password again

    +   - The maximum password age or how many days a user can go without changing
    his password

    +   - How much warning a user gets before his password expires (in days)

    +   - How many days to wait after a password expires before an account is disabled

    +   - Expiration date for the account in number of days since Jan. 1, 1970


    When using shadow passwords, the password field cannot be blank. To prevent a
    user from changing his password, make the minimum password age greater than the
    maximum password age. Implementing shadow passwords for users and groups is covered
    later in this chapter.


    # ## Creating Users


    To log on to a Linux system a user must have at a minimum a username and a home
    directory. Everything else is created for other reasons, such as using a password
    to enhance the security of the system.


    Several different ways exist to add user accounts to your system. Each method
    has its own advantages and disadvantages. In addition, each distribution provides
    its own tools that can be used to accomplish this task. For exam, you need to
    understand two methods: manually editing the `/etc/passwd` file and using the
    useradd command.


    # ### Editing the /etc/passwd File


    One way to add users to your system is by directly editing the `/etc/passwd` file.
    This can be done only when you are logged in as root. Before making any changes,
    be sure to make a copy of the original file. If you corrupt the file, you will
    not be able to log in, even as root.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'To add a user, simply add a new line at the end of the file that contains the
    appropriate information for each field. Be sure to use an editor that saves the
    information in ASCII, such as vi. Do not enter anything in the password field
    because it needs to be encrypted. You will need to enter a unique UID for each
    new user you add to the file. Keep a record of assigned UIDs and assign new ones
    sequentially. To create a new account for me, you might add the following line
    to your `/etc/passwd` file:


    ```

    `hadden::523:100:Theresa Hadden:/home/hadden:/bin/bash`

    ```


    After entering the user information and saving the file, you will need to use
    the passwd command to assign a password to the new account.


    Next, you will need to create the user''s home directory and manually copy the
    appropriate configuration files. These configuration files are discussed later
    in this chapter.


    If a new group is also needed for this user, you will need to edit the `/etc/group`
    file to define the group before the user can log in. Groups are discussed later
    in this chapter.


    If you manually create a user''s home directory, you will need to change both
    the owner and group assigned to that directory or the user will be unable to log
    in. Use the chown command to change both the user and associated group. See Chapter
    9 for more information on using this command.


    # Key Concept


    New user accounts can be created by editing the `/etc/passwd` file and then using
    the `passwd` command to assign a password to the account. You also will need to
    create the user''s home directory and assign the appropriate permissions to this
    directory before the user will be able to log in.


    # Using the `useradd` Command


    Another, more convenient way to add user accounts to your system is by using the
    useradd command. By default, useradd uses the next available UID and assigns the
    default shell as the login command for that account. To display the system''s
    default values, type useradd -D without a username. Its output might look like
    the following:


    ```

    ```

    GROUP=100

    HOME=/home

    INACTIVE=-1

    EXPIRE=

    SHELL=/bin/bash

    SKELE=/etc/skel

    ```

    ```


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_182_0.png)'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'If you issue the command

    `useradd mary`

    and then examine the `/etc/passwd` file, the last line might look like the following:

    `mary:!!::505:506::/home/mary:/bin/bash`

    The `!!` in the password field is entered by the system to indicate that a password
    has not been assigned. You would need to use the `passwd` command before Mary
    could log in.


    In the previous example, the `useradd` command assigns a UID of `505` to the account.
    This is the next available UID and makes the group with a GID of `100` Mary’s
    default login group. You can specify a UID by using the `-u n` option. To specify
    a GID to assign to this account, use `-g n`. Be sure that you use a valid UID
    and GID.


    If the ID you specify is not unique (user or group), the command will fail and
    the account will not be created. Use the `-o` option if you want to use an ID
    that is not unique.


    Mary’s home directory is named, but it is not created by default. Using the `-m`
    option causes `useradd` to also create the user’s home directory when creating
    the account. The default directory is `/home/<username>`.


    To explicitly specify a home directory use `-d <path>/<directory>` . If you do
    not have the `useradd` command, you will need to create the home directory and
    change its ownership and associated group before the user will be able to log
    in.


    You also can have specific files copied to the new home directory by using `-k
    <skeleton directory>` in conjunction with the `-m` option. If no directory is
    specified, the files located in `/etc/skel` will be copied to the newly created
    home directory.


    If directories are present in either the skeleton directory or `/etc/skel` , those
    directories will be created as well. In addition, the `useradd` command will set
    the appropriate permissions to these files and directories.


    Use this when you have files or directories you want to be available for most
    of your users. You must create the files and directory structure in either the
    `/etc/skel` directory or another directory of your choosing. Next, create the
    user account using the `useradd -m` command and the files will be copied to the
    new user’s home directory.


    The comment field is left blank unless you specify its contents by using `-c “information”`
    . You must enclose in double quotes the information you want in the comment field.


    The system’s default shell was assigned to Mary as her login command. You can
    use the `-s` option to specify a different shell. However, the designated shell
    must be defined in the `/etc/shell` file or the user’s login attempt will fail.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'In addition, you can specify when you want a user''s account to expire by using
    the `-e date` option. The date must be in the format MM/DD/YY. After this date,
    the user will no longer be able to log in to the system.


    You can specify to have an account disabled after the password has expired by
    using the `-f days` option. If you enter a value of 0, the account will be disabled
    as soon as the password expires. A value of -1 prevents the account from being
    disabled when the password expires. This is the default action.


    # Key Concept


    You can use the useradd command to create a new user account. The system defaults
    for the home directory and login command will be used unless you specify otherwise.
    Use the `-o` option to specify the home directory and `-s` to change the login
    command. Use `-m` to have useradd create the home directory and copy the default
    skeloton files. The `-k` option enables you to specify the location of the skeloton
    files. Use `-c` to assign a value to the comment field and `-e` to specify an
    expiration date.


    # Using the usermod Command


    After you create a user account you can modify any of the fields in the `/etc/passwd`
    file by using the usermod command. Table 7.2 shows the options used to modify
    each of these fields.


    **Table 7.2 Options Used with usermod to Modify Fields in the /etc/passwd File**

    | Option | Field Modified |

    |:--- |:--- |

    | `-l <username>` | Username |

    | `-u n` | UID; use `-o` if not unique |

    | `-g n` | Login group |

    | `-c "information"` | Comment |

    | `-d <path/dir>` | Home directory; use `-m` to copy files from the old to the
    new home directory |

    | `-s <path/shell>` | Login shell |


    You can''t change the username if the user is logged in. In addition, you should
    change the name of the user''s home directory to match her new username. Changing
    the name of the directory is not required as long as the home directory that is
    defined for that user exists.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'When changing a user''s ID, it must be unique unless you use the -o option.
    Be sure that the user is not logged in and verify that there are no processes
    running with that user''s old ID.


    Any files located in the user''s home directory will have the UID associated with
    them changed; however, any files belonging to the user that are located elsewhere
    will have to be changed manually. Any *crontab* or at jobs also will need to be
    changed.


    If you use the -m option when using the -d option to designate a new home directory,
    the files contained in the present home directory will be copied to the new location
    with the permissions intact.


    # ### Deleting Users


    When a user no longer requires access to your system, you should remove his account,
    files, and any *crontab* or at jobs he might have running. To manually remove
    a user, follow these steps:


    +   1. Remove that user''s line from the `/etc/passwd` file.

    +   2. Delete the user''s home directory.

    +   3. Search for and delete files owned by that user located outside his home
    directory.

    +   4. Delete the user''s mail and any mail aliases.

    +   5. Delete any jobs he might have scheduled.


    An easier way to perform this same task is to use the *userdel* command. Its syntax
    is


    ```

    ```

    userdel [ option ] username

    ```

    ```


    Using the *userdel* command without an option will delete the user from the `/etc/passwd`
    and other system files but will not delete his home directory. Use the -r option
    to also have his home directory deleted. You will still need to delete any files
    he owns that are located outside his home directory.


    If you want to disable a user''s account rather than delete it, add an asterisk
    at the beginning of the password field in `/etc/passwd`. Do not change the encrypted
    password itself—this will prevent the user from logging in. When you want to reactivate
    the account, merely remove the asterisk and the user can log in.


    # ### Special User Accounts


    If you look at your `/etc/passwd` file or the example at the beginning of this
    chapter, you will see several user accounts that are system accounts. Each of
    these has a special purpose, some of which are listed in Table 7.3.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Table 7.3 System Accounts and Their Uses


    | Username | Purpose |

    | --- | --- |

    | root | Supervisor of the system |

    | daemon | Owns and sets permissions on system processes |

    | bin | Owns executables |

    | sys | Owns executables |

    | adm | Owns log files |

    | uucp | Used for UUCP access |


    Other system accounts control processes such as mail, ftp, gopher, news, and so
    on. Their purpose is usually obvious from their name. Never change the entries
    for these accounts because this can cause your system to fail. You also will notice
    that these system accounts have an asterisk in the password field to prevent anyone
    from logging in and impersonating one of these accounts.


    # Groups


    Groups are used to organize your users and grant permissions to files. You might
    want to create groups based on the need to access certain files such as accounting
    information. Or, you might create groups to manage access to devices such as modems
    or printers. Groups can help you simplify your job.


    # The /etc/group File


    The /etc/group file defines each group and its members. The /etc/group file has
    a format similar to that of the /etc/passwd file, such as in


    ```

    ```

    root::0:root

    bin::1:root,bin,daemon

    daemon:2:root,bin,daemon

    sys:3:root,bin,adm

    adm:4:root,adm,daemon

    tty::5:

    disk::6:root

    lp:7:daemon,lp

    mem::8:

    kmem::9:

    wheel:10:root

    mail:12:mail

    news:13:news

    uucp:14:uucp

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Each line in the /etc/group file has four fields, each separated by a colon.
    If a field is blank, the colon is still required. Table 7.4 lists the fields and
    their contents.


    **Table 7.4 The Fields Contained in Each Record in the /etc/group File and Their
    Contents**


    | Field | Contents |

    | :---- | :------- |

    | Groupname | The group name must be unique and can be up to eight characters
    in length |

    | Password | A password can be entered but usually it is either an asterisk or
    left blank |

    | Group ID | The GID is used by the system and must be unique |

    | Members | List of users who are members of a group separated by commas |



    When a user attempts to access a file, the operating system first checks to see
    whether that user is the owner of the file. If she is not the owner, the OS checks
    to see whether the user is a member of the associated group.


    If the user belongs to the appropriate group, she gets the access defined for
    the group. If she is not a member of this group, she gets whatever permissions
    have been assigned to all others. Access to resources is discussed in more detail
    in Chapter 9.


    # # Identifying Your Group


    Every user on your system must belong to at least one group. If only one group
    exists, make all your users members of that group. Users can belong to many groups;
    however, only one GID can be associated with a user at any point in time. The
    default group for each user is defined in the /etc/passwd file.


    To find out what your present default group is, use the id command. It returns
    your UID, the GID, and the name of your default group. In addition, it lists all
    your group memberships. Its output might look like the following:


    ```

    uid=503(hadden) gid=500(hadden) groups=500(hadden),520(wp)

    ```


    You also can determine to which groups you belong by using the groups command.
    It outputs the groups to which you belong but does not indicate your present default
    group.


    When a user creates a new file, his present group is associated with that file.
    You can change which group your default group is by using the command newgrp and
    specifying the desired group. For example, typing


    ```

    newgrp wp

    ```


    will make your present group the wp group. Now when you type id, you will see


    ```

    uid=503(hadden) gid=520(wp) groups=500(hadden),520(wp)

    ```'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'If you are a member of the new group as defined in the /etc/group file, your
    default group is changed and any files you create while that group is your default
    group will be associated with that group. You also can use the newgrp command
    without any arguments to change to your default login group as defined in the
    /etc/passwd file.


    # ## Working with Groups


    You create new groups either by editing the /etc/group file directly or by using
    a utility that will create the new entry for you. When editing the /etc/group
    file, add one line for each new group. Be sure to follow the syntax exactly. If
    you added the line


    ```

    wp::520:mary,john,theresa

    ```


    to the /etc/group file, you would create a new group called wp with a GID of 520.
    This group would have Mary, John, and Theresa as members.


    You also can use the utility groupadd to create new groups. Its syntax is


    ```

    groupadd [options] groupname

    ```


    To add a new group called acctng, you would issue the following command:


    ```

    groupadd acctng

    ```


    This would add a line to the /etc/group file defining the group and then assign
    it the next available user GID. You can specify a GID by using the -g gid, but
    it must be unique. If you want to use a GID that''s not unique, you must use the
    -o option. If you want to create a system group instead, use the -r option. System
    groups are discussed later in this chapter.


    The groupadd command creates the group but does not add any users to that group.
    You still will need to populate your group with the appropriate users. You can
    do this either by editing the /etc/group file or by using the gpasswd command
    with the -a option. The syntax for the gpasswd command is


    ```

    gpasswd [options] <user> group

    ```


    To add Joe to the wp group, you would type


    ```

    gpasswd -a Joe wp

    ```


    The gpasswd command also is used to change the password on a group by passing
    the group''s name as an argument. If a password is set on a group, nonmembers
    can join the group with the appropriate password. Use the -r option to remove
    a password from a group. Table 7.5 lists options that can be used with the gpasswd
    command.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Table 7.5 Options to Be Used with the gpasswd Command and Their Actions

    | Option | Action |

    | :--- | :--- |

    | -R | Prevents the use of `newgrp` to join the group |

    | -a username | Adds named user to the group |

    | -d username | Removes named user from the group |

    | -A username | Makes named user an administrator for that group |

    | -r | Removes password from the group |


    # Modifying and Deleting Groups


    You can change the name of a group or its GID either by editing the /etc/group
    file or by using the `groupmod` command. The syntax for the `groupmod` command
    is


    ```

    groupmod [options] groupname

    ```


    Use the -n name option to change the group''s name or -g GID to change the GID.
    If you are changing to a GID that''s not unique, you must use the -o command.
    If you change a group''s GID, be sure to check the /etc/passwd file to see whether
    any user has that group listed as her login group. If so, be sure to change the
    GID here as well.


    To delete a group, you can either remove its line from the /etc/group or use the
    `groupdel` command. If you delete the group by editing the /etc/group file, you
    will need to do a couple of other things.


    +   1. Check the /etc/passwd file and verify that none of the users have the deleted
    group as their login group. If they do and you do not change it, they will not
    be able to log in.

    +   2. Look for any files and directories that have this group as its owner. If
    you do not correct this, it can make the files inaccessible.


    The syntax for the `groupdel` command is


    ```

    groupdel groupname

    ```


    This will delete the group''s line from the /etc/group file. If you try to use
    this command on a group that is designated as any user''s login group, it will
    fail.


    You will need to review the /etc/passwd file to make sure that no user has this
    group designated as her login group. If any users are using this group as their
    default login group, you will need to change this before you can delete the group.
    You also will still need to check the filesystem for resources owned by this group.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Key Concept


    Groups are defined in the `/etc/groups` file. Commands that can be used to manage
    groups are `groupadd`, `groupdel`, `groupmod`, and `gpasswd`.


    # System Groups


    The system creates a number of groups such as `bin`, `mail`, `sys`, `adm`, and
    so on. Do not add users to any of these groups because this would give them wide-ranging
    rights on your system. System groups should have only system accounts as members.
    Some of the system groups and their functions are listed in Table 7.6. You should
    be familiar with these groups and their functions for the exam.


    Table 7.6 System Groups and Their Functions

    | Group | Function |

    | root | Owns most system files |

    | daemon | Owns mail, printer, and other system software and directories |

    | kmem | Manages direct access to kernel memory |

    | sys | Owns some system files, swap files, and memory images; can work the same
    as the kmem group |

    | nobody | Owns software that does not need special permissions |

    | tty | Owns device files that control terminals |


    # Implementing Shadow Passwords


    As you remember, the passwords stored in the `/etc/passwd` file are encrypted
    by the system. An additional level of security can be invoked by using shadow
    passwords. When using shadow passwords, the password field in the `/etc/passwd`
    file is replaced by an `x` and passwords are actually stored in the `/etc/shadow`
    file.


    The `/etc/shadow` file should be readable only by root in an effort to keep outsiders
    from trying to crack your passwords. See Chapter 9 for more information on restricting
    access to files. You can provide this same level of security for the passwords
    assigned to groups.


    Group shadow passwords are stored in the `/etc/gpasswd` file, and the password
    in the `/etc/group` file is replaced with an `x`. This file should be restricted
    to root-only access. No one else should even be able to read it.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'You should never directly edit the `/etc/shadow` or `/etc/gshadow` files. When
    you need to change a user''s or group''s password, use a utility such as `useradd`,
    `passwd`, `usermod`, or `gpasswd` to make changes to it.


    To begin using shadow passwords, use the `pwconv` command, which takes no arguments.
    When you run this command, it creates a `/etc/shadow` file from your `/etc/passwd`
    file. You always can convert back by using the `pwunconv` command. Using the `pwunconv`
    command will update your `/etc/passwd` file and then delete the `/etc/shadow`
    file.


    To use shadow passwords for groups, use the `grpconv` command. This will create
    a `/etc/gshadow` file and change all the passwords in the `/etc/group` file to
    x. To revert to saving group passwords in the `/etc/group` file, run the command
    `grpunconv`.


    If you must edit the `/etc/passwd` and `/etc/group` files by hand, you can update
    your shadow passwords by rerunning the appropriate commands—`pwconv` for `/etc/passwd`
    and `grpconv` for `/etc/group`. A better way is to first use `pwunconv` and `grpunconv`
    to stop using shadow passwords, make your changes, and then convert back to using
    shadow passwords.


    # Key Concept


    > Shadow passwords increase the security of your system. Use `pwconv` to implement
    shadow passwords for your users and `grpconv` to use shadow passwords for your
    groups.


    # User Startup Files


    The look and function of your shell results from the use of environment variables.
    These parameters are saved in various configuration files located either in `/etc`
    or `/home/username~`. The default environment variables for bash when started
    as an interactive login shell are located in the `/etc/profile` file. The following
    is an example of a profile file:


    ```

    # /etc/profile

    # System wide environment and startup programs

    # Functions and aliases go in /etc/bashrc


    PATH="$PATH:/usr/X11R6/bin"

    PATH="$PATH:/usr/local/bin/blender"

    PS1=''\u@\h \W]\$

    BLENDERDIR=/usr/local/bin/blender

    export BLENDERDIR

    ```'
