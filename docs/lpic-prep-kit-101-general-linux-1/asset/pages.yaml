- pgno: 308
  md: '# B


    # Certification Process


    # Test Development


    The Linux Professional Institute (LPI) started out as a group of volunteers who
    had a common goal of developing a certification for Linux that would be a valid
    indicator of the candidate''s abilities. This certification then could be used
    by employers as a way to determine a prospective employee''s competence.


    LPI has worked for over a year to develop a distribution-independent certification
    program for Linux. The debate over the need for a certification has been quite
    heated. (See the archives at http://www.lpi.org for further information.)


    As one of the first steps in creating the certifications, LPI performed a job
    analysis. The purpose of this job analysis was to determine which tasks are common
    to all Linux system administrators.


    Both the frequency and importance of each task was evaluated. See http://www.lpi.org/p-jasreport.html
    for the results of this survey. These results then were used to determine the
    various certification levels.


    As a result of these efforts, LPI has defined three levels of certifications.
    They are


    +   - LPIC Level 1

    +   - LPIC Level 2

    +   - LPIC Level 3'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'Each of these certifications builds on the one before. In other words, achieving
    LPIC-2 certification will require that LPIC-1 certification is first successfully
    completed.


    The individual who has achieved certification as LPIC-1 will be expected to be
    able to install and manage a Linux workstation, while the LPIC-2 certified individual
    will be able to manage a network. The LPIC-3 certified individual will possess
    specialized knowledge and be able to function as administrator of a large, complex
    network.


    The LPIC Level 1 is intended to certify that an individual can


    +   - Install and configure a workstation, including connecting it to a LAN or
    configuring a modem to connect to the Internet

    +   - Work at the UNIX command line

    +   - Shut down and reboot the computer

    +   - Perform helpdesk duties

    +   - Manage user accounts

    +   - Perform backups and restorations of files


    In order to achieve LPIC Level 1 certification, the candidate must pass two separate
    exams, which are


    +   - Exam 101, General Linux I

    +   - Exam 102, General Linux II


    To review the objectives for a specific exam, visit the LPI Web site at [http://www.lpi.org](http://www.lpi.org).


    # ## Registering for an Exam


    After you have studied and are ready to take Exam 101, General Linux I, you must
    register for it with VUE. To register, go to [http://www.vue.com/Linux](http://www.vue.com/Linux).


    When you register for your first LPI exam, you will need to call VUE. This is
    necessary to link your LPI testing information to your VUE information. This process
    is required for only the first time you register to take one of the LPI exams.
    The appropriate telephone number can be obtained at [http://www.vue.com/student-services/vphone.html](http://www.vue.com/student-services/vphone.html).


    After your LPI and VUE information is linked, you can register online at [http://www.vue.com](http://www.vue.com),
    by calling VUE’s main office directly, or by calling the VUE testing center where
    you want to take your exam.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Registering for an Exam


    You also can register by mail. The necessary form and mailing address are available
    at http://www.vue.com/testing/mailorder.html.


    To register online, you will need a username and password. If you have not taken
    an exam through VUE before, you can obtain your username and password online.
    After receiving your username and password, you can log in and register.


    The registration process consists first of selecting a testing center. Based on
    your location, you will be presented with a list of testing centers in your area.
    Next, you can specify a range of dates and times in order to find an available
    slot to select.


    The exam is presently being offered only in English and costs $100. When registering
    online or by phone, you will need a credit card to pay for your exam. If you want
    to pay by check, you will need to send your registration by mail. An appointment
    slot cannot be reserved until VUE has received your payment.


    After you have scheduled an exam, you can use the VUE Web site for other functions.
    For example, you can reschedule or cancel your exam after first logging into the
    Web site. In addition, after completing your exam, you can view your results online.


    When you go to take your exam, you first must sign in at the testing center. This
    process will require that you provide two types of identification, one of which
    must be a picture ID. Types of identification that are acceptable include the
    following:


    +   - Driver’s license

    +   - Passport

    +   - Credit card

    +   - School ID

    +   - Birth certificate

    +   - Baptismal certificate

    +   - Any other government issued identification


    You should arrive a few minutes before your scheduled appointment time so that
    you will have enough time to complete this process.


    You will be allotted one and one-half hours (90 minutes) to take the exam, so
    be sure that you arrive early. See Appendix C, "Testing Tips," for some suggestions
    on how to improve your testing experience.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Certification Results


    When you finish an exam, you will be given a printout of your test results, regardless
    of whether or not you pass. Be sure to put this document in a safe place because
    it cannot be replaced. If any question should arise at a later date as to whether
    or not you passed, this will be your proof.


    After you have passed any of the LPI exams, your certification status can be verified
    to any current or prospective employer at your request. LPI will verify only which
    exams you passed, the level of the exam, and the date you passed. They will not
    provide information on any exams you failed or give out your exam scores. After
    you have passed the two exams necessary for LPIC Level 1 certification, you will
    receive a certificate from LPI acknowledging your accomplishment.


    # Examination Revision


    LPI plans to review each examination and its objectives every two years. This
    review will include any new material as well as the security and validity of each
    exam.


    If an exam is revised, LPI will not require certificate holders to recertify.
    However, they will provide information to the public as to any changes in the
    content or objectives of their exams. Also, if the certificate holder requests
    verification of his or her certification status, the information on the present
    version of the exam also will be provided.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Testing Tips


    Taking a certification exam is different from taking a test in school. In the
    first place, chances are you do not have an instructor to lead you through the
    material you need to know for the certification exam, as you did in school.


    Certification exams are technically oriented. They are written with certain objectives
    in mind, and the questions are devised to determine whether you know how to perform
    certain tasks as well as whether you understand specific concepts.


    In school, you are tested as a step to the next level of your education.


    Certification exams, however, are written with the aim that only those who really
    understand the concepts being tested will pass.


    After you have studied and feel you know the material, you should register for
    the exam. Presently, the LP1 exam is being given by the VUE. You can register
    through their Web site or by phone. See Appendix B, “Certification Process,” for
    details on the registration process.


    # Scheduling the Exam


    Know your own personal circadian rhythms. If you are a morning person, try to
    schedule your exam during morning hours. However, if you are the type of person
    who does not wake up until noon, you should schedule your exam for the afternoon.


    You will be allotted an hour and a half to take the test. You want this time to
    coincide with the time of day that you are at your best.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'Next, you must decide where you want to take your examination. There might
    be more than one testing center in your city. You can call the center you want
    to use and ask them for their ID code. Then, when you register for the exam, you
    will use this code to ensure you''ll be registered at the correct location.


    When you register, you will be given an ID number, which you''ll use for every
    test you take. You''ll also use it if you ever need to contact VUE to get copies
    of your transcript.


    Be sure to obtain and write down the following information during the registration
    process:


    +   - Date and time of the exam

    +   - Number and title of the exam

    +   - Address and phone number of the testing center

    +   - Confirmation number

    +   - Deadline by which to cancel or reschedule your exam


    LPI will use its own method to identify you. This number will be used to provide
    information to prospective employers to verify your certification status.


    # ## The Day of the Exam


    On the day of the exam, you should verify the time and location of the test you''ll
    be taking. Call the testing center the morning of your test make sure you are
    registered to take the correct exam at the time you expect. Each center downloads
    the day''s schedule first thing in the morning, so you can call anytime after
    the center opens to verify whether you''re on that day''s schedule.


    If you are scheduled to take your examination when the testing center first opens,
    you will not have this option. The testing centers do not get their schedules
    until that day.


    This might seem like overkill, but many prospective candidates have arrived at
    the testing center to learn they are not on the list or that their appointment
    time is different from what they expected. This has happened to individuals taking
    certification tests sponsored by various vendors. Be sure you confirm three important
    pieces of information:


    +   - Where the testing center is located

    +   - Exactly what time your exam begins

    +   - How far in advance of the start time you should arrive'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'Get enough rest the night before the exam. On the day of your exam, be sure
    to schedule enough time so you aren''t rushed. Don''t forget to eat—your brain
    functions much better when it is well nourished. And you don''t want to be distracted
    by your stomach growling at you because it is empty.


    You also should wear comfortable clothes. There is nothing as distracting as trying
    to sit in jeans that are too tight. No dress code exists for sitting the test,
    so wear what you are most comfortable in.


    In addition, you should be sure you leave in plenty of time to get to the testing
    center with 15 to 30 minutes to spare. Don''t start off your test by being rushed.
    That feeling will carry over to the test and possibly affect your performance.


    Take some time in the parking lot to review your notes. Use this time to verify
    that you know the facts you memorized. This is not the time to cram but rather
    the time to review what you already know one last time. Having time to verify
    that you know the material will help place you in the correct frame of mind to
    do well.


    When you go in to take the test, you will be required to provide two forms of
    identification. At least one of these must have your picture on it.


    After you have presented your identification and signed in, you will be taken
    to the cubicle or room in which you will take your test. You also will be given
    writing materials, which might be a pen and paper or a marker and dry erase board.
    Be sure that the pen or marker writes; get a spare to be on the safe side. (I
    will cover how to use these writing materials later in this appendix.)


    All examinations are taken on a computer. Before the proctor leaves the room,
    verify that everything on your computer is in working order. Does the mouse work!
    Is the display easy to read? Does the lighting cause excessive glare? If there
    is a problem, speak up. You have the right to an environment suitable for a comfortable
    testing experience.


    The time allotted to take the test does not start when you enter the testing room.
    Rather, the time starts when you actually begin the test itself.


    After you have verified that everything is in working order, you will have 10
    to 15 minutes to get oriented to the testing environment. A sample test is available
    for you to take just to get used to the experience of computer testing. This sample
    test is optional.


    Remember those writing materials you were given? Now is the time to put them to
    use. Although you cannot take any notes into the exam with you, use the materials
    provided to jot down the facts you memorized and reviewed in the parking lot.
    You can use the time allotted for the sample exam to write down any notes or charts
    you feel might help you when taking the test.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_314_0.png)'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'Two reasons exist to write these things down: First, you can refer to these
    notes when answering questions. Second, and most important, the act of writing
    down this information has great psychological importance.


    The fact that you can recall the information increases your self-confidence. If
    you can remember the facts to write them down then you know the material—so you
    can expect to do well on the exam.


    The time you spend writing out your notes also helps calm those pretest jitters
    so that you will be able to perform better. Many test-takers become so nervous
    about the idea of taking a test that their performance suffers. Do everything
    you can to help yourself remain calm.


    # Taking the Test


    At the time of this book’s writing, the questions on the exams are all multiple-choice
    and short answer. For the multiple-choice questions, the question itself might
    be scenario-based, but you will have four or five answers from which to select.
    The short answer questions cover various commands, sometimes including necessary
    options.


    The exams have a total of 60 questions, and you are given 90 minutes to finish
    them. At the end of each exam, a short survey is included. This survey is optional
    and the time spent completing it is not included in the 90 minutes.


    When planning your strategy for the exam, you should determine whether the exam
    will be conventional or adaptive. The LPI exam is currently conventional, although
    there is talk of possibly making it adaptive in the future.


    With an adaptive exam, you are given a question, with the next question being
    dependent on whether or not you got the first one right. If you are correct, the
    next question is more difficult. If you are incorrect, an easier question is presented.
    After you answer a question, you can’t go back and change your answer.


    With a conventional exam, you can go back and review your answers. The order in
    which you answer questions is not important. You should use a strategy of reading
    each question and choosing an answer. Do not take too much time deciding on an
    answer. If you are unsure of the correct answer, choose your best guess and mark
    the question for review.


    # Types of Questions to Expect


    Each question on a technical exam usually falls into one of three general categories:
    enumeration of facts, understanding the concept, and applying the concept.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Enumeration of Facts


    The easiest questions to answer are those that fall into the enumeration of facts
    category. These questions simply test your memorization. In this type of question,
    you might be asked to supply a specific term or define a term. You might be asked
    a question such as

    “What are the types of partitions?”


    Extraneous material might even be supplied in the question itself. However, if
    you read each question and identify what information is wanted, it should be obvious
    what the correct answer is. For example, you might have a question that gives
    you a list of all the hardware on a computer as well as what is on the hard drive,
    but the question actually wants to know if another primary partition can be created.


    # Understanding the Concept


    A more difficult type of question for most individuals to answer is the one that
    asks for a concept instead of discrete facts. Let’s use our previous example of
    partitioning. A question testing the concept of partitioning might be looking
    for evidence that you understand the concept of the types of partitions that can
    be created on any single hard disk.


    So, you might have a question that gives extensive information on the hardware
    configuration of your computer but is actually attempting to ascertain whether
    you understand the limitations on the number and types of partitions you can have
    on a single hard disk.


    # Applying the Concept


    The third, and hardest, type of question tries to determine whether you can take
    a concept and apply it in real life. Instead of asking you what types of partitions
    you can create, the question might present a scenario in which you must identify
    that the problem relates to partition creation and then decide how to correct
    it.


    Using the same example, your question might be that you have free space you want
    to use for a new database application, but the operation fails. Your answer would
    be based on identifying why you can’t create the partition and how to correct
    it.


    When reading each question, you will want to identify the type of question it
    is. This will go a long way toward being able to select the correct response.


    You also should try to identify the objective that is being tested. If the question
    is intended to gauge your abilities in using text filters, the answer will not
    be one that has to do with the directory structure.


    If the question is scenario-based, you will be presented with a situation and
    have to select the answer that best solves the problem. Some candidates become
    overwhelmed when faced with scenarios, but scenarios really are not that hard.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_316_0.png)'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'Once again, you want to use that writing material. As you read the scenario,
    take notes on the facts presented; you can expect to be given more information
    than is necessary to answer the question. Writing down each item makes it easier
    to pick out the salient points and ignore the rest.


    Still having trouble with the scenario? Try approaching it from the other direction.
    Forget the answers given. Instead, think about what you would do in a similar
    situation. Oftentimes if you use this method, you will find that the question
    is really not that hard.


    # ### Reviewing Marked Questions


    After you have read all the questions and answered them, go back and review those
    questions you have marked. When you go through the question for the second time,
    you can take more time. Analyze the question and pick out the most important points.
    What is the objective of the question? What information is provided that is not
    relevant to answering it?


    When reading the questions, remember not to read anything into them. Rather, take
    each question at face value. Don''t assume anything that is not explicitly mentioned
    in the question itself.


    Remember, the people who write the questions are not trying to trick you; they''re
    just trying to provide an objective measurement of your skills in relation to
    the exam''s stated objectives.'
  merge: -1
  img_proc: true
