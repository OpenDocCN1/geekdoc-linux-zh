- pgno: 142
  md: '# 2. What would the following command do?


    ```

    `cat MyFile | sort | tee | lpr`

    ```


    +   a. Print the contents of MyFile in alphabetical order.

    +   b. Print the contents of MyFile in alphabetical order and display the contents
    of MyFile.

    +   c. It would not work because it contains too many pipes.

    +   d. Print the contents of MyFile in alphabetical order and display the contents
    of MyFile in sorted order.


    Answer a is incorrect; although the output of sort would be sent to the printer,
    that is not the complete explanation. Answer b is incorrect; the contents of MyFile
    would be displayed in alphabetical order, not the way they are contained in the
    file. Answer c is incorrect; there is no such limit on the number of pipes that
    can be contained on a command line. **Answer d is correct; the sorted contents
    of MyFile would be sent to both the printer and the display.**


    # 3. Which of the following commands would discontinue a nonresponsive process
    that has a PID of 343?


    +   a. `kill -9 343`

    +   b. `stop -n 343`

    +   c. `top 343`

    +   d. `fork 343`


    **Answer a is correct; you use the kill command to terminate a process; the -9
    terminates it no matter what.** Answer b is incorrect; there is no stop command.
    Answer c is incorrect; the top command can be used to terminate a process; however,
    it does not take the PID as an argument. Answer d is incorrect; fork would begin
    a child process.


    # 4. The command `cat MyFile | sort | lpr &` would start


    +   a. One job and one process.

    +   b. Three jobs and three processes.

    +   c. One job and three processes.

    +   d. Three jobs and one process.


    Answer a is incorrect; each command in the pipeline would start another process.
    Answer b is incorrect; all commands entered as a single pipeline create a single
    job. **Answer c is correct; all commands entered on one command line are considered
    as one job but each command contained therein would start a separate process.**
    Answer d is incorrect; this pipeline would start only one job.'
