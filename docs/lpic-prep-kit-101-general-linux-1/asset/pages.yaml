  md: "# QUESTIONS AND ANSWERS\n\n+   1.  You have an important meeting with your\
    \ boss this afternoon and do not want to forget it. What should you do?\n+   \n\
    +       A. You could try putting Post-it notes on your monitor; however, a better\
    \ solution is to use the `at` command to display a reminder of the meeting a short\
    \ time before it begins.\n\n+   2.  You need to reindex your database but want\
    \ to do it when the system’s load is low to prevent adversely affecting your users.\
    \ What should you do?\n+   \n+       A. You can use the `batch` command to run\
    \ the indexing job. That way it will not start until the system load is low.\n\
    \n+   3.  You have a user who every morning schedules a job to run at 8 a.m. that\
    \ slows down your system. What can you do to prevent him from scheduling a job\
    \ using `at`?\n+   \n+       A. You can add that user’s name to the `/etc/at.deny`\
    \ file to prevent him from running any more `at` jobs. If he really needs to run\
    \ this, educate him about the `batch` command.\n\n+   4.  Your database administrator\
    \ needs to run a script every day for system maintenance. You do not allow users\
    \ to run `cron` jobs. How could you make her job easier?\n+   \n+       A. You\
    \ could schedule the job to run yourself. However, mail messages from `crond`\
    \ about this job would be delivered to you rather than the database administrator,\
    \ who should get them. You could either construct the job to mail the messages\
    \ to her or add her name to the `/etc/cron.allow` file, which would allow her\
    \ to schedule the job herself.\n\n+   5.  You want to save all the messages from\
    \ mail to the `/var/log/maillog` file. What should you do to make this happen?\n\
    +   \n+       A. You can edit the `/etc/syslog.conf` file by adding the following\
    \ line:\n+       `mail.* /var/log/maillog`\n+       This directs any messages\
    \ from mail to the `/var/log/maillog` file."
  merge: -1
  img_proc: true
- pgno: 267
  md: "6. You made the changes as to where the messages from mail are to be saved.\
    \ When you look at the maillog file, it is empty. What happened?\n    A. syslogd\
    \ reads the /etc/syslog.conf file when the system boots. You could reboot your\
    \ system to make the changes take effect. A better solution would be to stop and\
    \ restart the syslogd daemon.\n\n7. You want to find out when each of your users\
    \ last logged in. How can you find this information?\n    A. This information\
    \ is recorded in the /var/log/lastlog file. You could read the file directly,\
    \ but a better solution is to issue the lastlog command, which displays this information\
    \ sorted by UID.\n\n8. You want to start a new mail log once a month and keep\
    \ the last four months worth of logs. What should you do?\n    A. You can use\
    \ the logrotate command and set local options to rotate the mail log only once\
    \ a month and to keep four logs.\n\n# PRACTICE TEST\n\n1. You have written a new\
    \ backup script and want to test it out. What would be the best way to do this?\n\
    \    a. Run the script now and check for errors.\n    b. Use the at command to\
    \ schedule the script to run tonight and check on it in the morning.\n    c. Use\
    \ the at -b command to run the script now.\n    d. Use the crontab command to\
    \ schedule it to run every night.\n\nAnswer a is incorrect; although this would\
    \ let you know whether it works or not, it is possible that it would adversely\
    \ affect your users because it would be running during production hours. Answer\
    \ b is incorrect; this delays your efforts to test the script and can even interfere\
    \ with your regularly scheduled backups. **Answer c is correct; the -b option\
    \ tells at to wait until the system load is low. Although you will not get your\
    \ results immediately, you should not have to wait long and you do not need to\
    \ worry about overloading your server.** Answer d is incorrect; because you do\
    \ not know for sure that the new script works correctly, you should not schedule\
    \ it to run on a regular basis."
  merge: -1
  img_proc: true
- pgno: 268
  md: '2. What would be the results of running the following command?


    ```

    at +15 minutes 1s > myfiles

    ```


    +   a. After waiting 15 minutes, the at command would save a listing of the files
    in the pwd to a file called myfiles.

    +   b. The at command would save a listing of the files in the pwd to a file called
    myfiles every 15 minutes.

    +   c. The at command would save a listing of the files in the pwd to a file called
    myfiles at 15 minutes after the hour.

    +   d. Nothing, because the at command needs an exact time as to when it is to
    run.


    Answer a is correct; this command will cause the at command to run the 1s > myfiles
    command 15 minutes after entering it. Answer b is incorrect; the +15 minutes does
    not mean every 15 minutes. Answer c is incorrect; the +15 minutes is relative
    to now, not relative to the hour. Answer d is incorrect; you can give at a relative
    as well as absolute time.


    3. You notice an increased load on your server and suspect it is from users scheduling
    jobs. What two commands could you use to confirm your suspicion?


    +   a. at -b and crontab -u

    +   b. at -1 and crontab -1

    +   c. at -b and crontab -1

    +   d. at -1 and crontab -u


    Answer a is incorrect; the at -b command runs an at job when the system is low
    and crontab -u is used by root to list a specific user’s cron jobs. Answer b is
    correct; the at -1 command is the same as atq, which shows a list of all pending
    at jobs, and the crontab -1 command lists pending cron jobs. Answer c is incorrect;
    although the crontab -1 command will list cron jobs, the at -b will run an at
    job in batch mode. Answer d is incorrect; although the at -1 command will list
    pending at jobs, the crontab -u command is used to look at a user’s cron jobs.


    4. You want to use a different configuration file called sysconf for syslogd.
    Which of the following commands would be appropriate?


    +   a. kill SIGHUP ''cat /var/run/syslogd.pid''

    +      syslogd -f sysconf

    +   b. syslogd -f sysconf

    +   c. kill SIGTERM ''cat /var/run/syslogd.pid''

    +      syslogd -f sysconf

    +   d. syslogd -r'
  merge: -1
  img_proc: true
- pgno: 269
  md: "Answer a is incorrect; the signal SIGHUP reinitializes syslogd by stopping\
    \ the daemon, reading the /etc/syslog.conf and then starting syslogd. Answer b\
    \ is incorrect; first you must stop the syslogd daemon before it can read the\
    \ new configuration file. Answer c is correct; the SIGTERM signal stops the syslogd\
    \ daemon using its PID and then syslogd is restarted with the new configuration\
    \ file. Answer d is incorrect; the -r option would cause syslogd to receive network\
    \ messages.\n\n+   5. Which of the following lines would log all messages from\
    \ news to the file\n+   /var/log/newslog?\n+   \n+   a. news.\\*</var/log/newslog\n\
    +   b. news.\\*;news.\\*=info/var/log/newslog\n+   c. \\*news /var/log/newslog\n\
    +   d. news.\\*/var/log/newslog\n\nAnswer a is incorrect; this would prevent logging\
    \ any messages from news. Answer b is incorrect; this would log all messages except\
    \ those of type info. Answer c is incorrect; the source of the messages must come\
    \ first. Answer d is correct; this would log all messages from news.\n\n+   6.\
    \ You want to know how long each user's session was the last time they logged\
    \ on. Which of the following log files contains this information?\n+   \n+   a.\
    \ /var/log/wtmp\n+   b. /var/log/utmp\n+   c. /var/log/usrlog\n+   d. /var/log/lastlog\n\
    \nAnswer a is correct; the wtmp log contains the login times and duration for\
    \ each user. Answer b is incorrect; the utmp log has information on currently\
    \ logged on users. Answer c is incorrect; there is no usrlog. Answer d is incorrect;\
    \ the lastlog file contains the last login times for users but not the duration\
    \ of their sessions.\n\n+   7. Which of the following pieces of information is\
    \ not included in the syslog.conf file?\n+   \n+   a. The source of the message\n\
    +   b. The type of message\n+   c. The name of the file and its location\n+  \
    \ d. The length of time to keep the message\n\nAnswer a is incorrect; the message\
    \ source is always listed. Answer b is incorrect; the type of message is always\
    \ listed. Answer c is incorrect; the name and the location of the log file to\
    \ write to is required. Answer d is correct; you cannot specify the amount of\
    \ time to keep a message in the syslog.conf file."
  merge: -1
  img_proc: true
- pgno: 270
  md: '+   8. Which of the following cannot be accomplished using logrotate?

    +   a. Mail logs to root.

    +   b. Compress old logs.

    +   c. Log messages on another computer.

    +   d. Move old logs to another directory.


    Answer a is incorrect; logrotate can mail logs to any user. Answer b is incorrect;
    logrotate can compress the old logs. **Answer c is correct; the syslog daemon
    is responsible for where messages are written.** Answer d is incorrect; logrotate
    can save old logs to any specified directory.


    +   9. When configuring logrotate, which of the following is possible?

    +   a. Specifying where to write messages

    +   b. Keeping three logs locally and three older logs to another directory

    +   c. Specifying how frequently to rotate the mail log

    +   d. Specifying what time of day to rotate the logs


    Answer a is incorrect; the location of where to write messages is handled by syslogd.
    Answer b is incorrect; you can send all old logs to another directory but not
    just some. **Answer c is correct; you specify the frequency of rotating the logs
    in the configuration file used with logrotate.** Answer d is incorrect; you use
    cron to specify the time of day to perform the rotation.


    +   10. You caught a glance of a lot of messages when your system booted. Which
    of the following would allow you to look at these messages?

    +   a. dmesg

    +   b. lastlog

    +   c. cat /var/log/syslog

    +   d. syslogd -c


    **Answer a is correct; the dmesg command displays the messages in the kernel’s
    buffer; if you run this after booting, the messages will be those written during
    boot.** Answer b is incorrect; the lastlog command displays the last time users
    logged in. Answer c is incorrect; unless you configured syslogd to write to a
    log file called /var/log/syslog there is no such file. Answer d is incorrect;
    the syslogd daemon is not used to display system messages.'
