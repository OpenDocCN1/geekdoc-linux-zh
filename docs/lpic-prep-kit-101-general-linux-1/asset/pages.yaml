    \ a is incorrect; if each artist changes his group, then the other artists will\
    \ not be able to access the new files. Answer b is incorrect; this will only allow\
    \ the users to exceed the soft limit for a greater period of time, but because\
    \ the hard limit is the same the total amount of disk space available does not\
    \ change. Answer c is incorrect; this will affect only the user’s individual quota\
    \ and not the group’s quota. Answer d is correct; this will allow the group to\
