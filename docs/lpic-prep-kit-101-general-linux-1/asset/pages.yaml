- pgno: 154
  md: "You can set quotas based on the number of files and directories and the total\
    \ disk space that the user can fill up. You can set either or both of these limits.\n\
    \nBoth the number of files and the amount of space are modified by three parameters:\n\
    \n+   ■ Soft limit—The user or group for whom the quota is defined can exceed\
    \ this amount for a limited amount of time.\n+   ■ Hard limit—After a hard limit\
    \ is reached, no more files can be created. There is no grace period.\n+   ■ Grace\
    \ period—How long the user or group can exceed the soft limit. It is expressed\
    \ as days:hours:minutes:seconds and defaults to seven days.\n\nTo continue with\
    \ our example, if you want to limit hadden to 3~5MB of disk space and between\
    \ 500 and 1,000 files, use the edquota command to change the parameters to read\n\
    \n```\nQuotas for user edwina:\n/dev/hda5: blocks in use: 52, limits (soft = 3000,\
    \ hard = 5000)\n inodes in use: 32, limits (soft = 500, hard = 1000)\n```\n\n\
    Each limit can have one of three values:\n\n+   ■ 0, which means no limit.\n+\
    \   ■ -1, which means use the default values.\n+   ■ Any integer greater than\
    \ zero. This represents kilobytes.\n\nThe default limits for your system are defined\
    \ in quota.n. After saving the file, you will next want to set a grace period\
    \ so that the user is notified when she has filled the amount allocated. This\
    \ is accomplished by using the edquota command with the -t option.\n\n```\nTime\
    \ units may be: days, hours, minutes, or seconds\nGrace period before enforcing\
    \ soft limits for users:\n/dev/hda5: block grace period: 1 days, file grace period:\
    \ 1 days\n```\n\nNow you can use the quota command to verify that your quotas\
    \ have been set. The syntax for the quota command is\n\n```\nquota [option] [who]\n\
    ```\n\nOnly root can look at quotas for other users and groups. Users can use\
    \ the quota command to examine their own quotas. Users also can use the -g option\
    \ to see the quotas for groups of which they are members.\n\nThe who can be a\
    \ username or groupname. Use the -u option to specify a user. If you also use\
    \ the -g option, the quotas for any groups of which the user is a member will\
    \ be displayed as well."
  merge: -1
  img_proc: true
- pgno: 155
  md: 'By default, quota reports on all filesystems listed in the `/etc/fstab`. If
    you use the `-q` option, quota will return information only on filesystems where
    the quotas have been exceeded.


    One record per partition provides the base defaults. Often this will be the only
    record modified with all users inheriting these values.


    You can use the `repquota` command to check the status of quotas on your system.
    Its syntax is


    ```

    repquota [options] [filesystem]

    ```


    The `repquota` command displays a summary of the amount of disk usage and quotas
    for the specified filesystems. It displays the number of files and disk space
    used, as well as any defined quotas for each user in kilobytes. The options used
    with `repquota` are shown in Table 6.7.


    | **Table 6.7 Options Used with the repquota Command** |

    |---|

    | Option | Action |

    | -a | Check the /etc/fstab file for filesystems with quotas and reports on them;
    does not take a filesystem as an argument. |

    | -v | Report on all quotas even if the user is not using any space on that partition.
    |

    | -g | Report quotas for named group. |

    | -u | Report quotas for named user; default action. Only root can see others.
    |




    Only root can see quotas for other users. Users can see quotas for themselves
    and for any group for which they are a member.


    The `quotacheck` command goes through the partition and updates the quota status,
    which is how much space is being used by each user or group that has a quota defined.
    It normally runs after an `fsck` at boot time. Its syntax is


    ```

    quotacheck [options] [filesystem]

    ```


    The `quotacheck` command outputs a `quota.user` file if a user scan is performed
    and outputs a `quota.group` file if a group scan is performed. Table 6.8 shows
    the options used with `quotacheck`.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Table 6.9 Options Used with the quotacheck Command

    Option | Action

    -v | Display information on its progress

    -d | Debug the program

    -u | Perform user scan; take UID as argument

    -g | Perform group scan; take GID as argument

    -a | Check quotas on all filesystems in /etc/fstab that have quotas set

    -R | Use with -a to check quotas on all filesystems except root


    Only root should run the quotacheck command.


    The quotastats command calculates the amount of used space and number of files
    for every user and group. The results are stored in the quota.user and quota.group
    files located in the root of each filesystem. The quotastats command takes no
    arguments.


    # Links


    The use of links is an important concept for the exam. The process of creating
    and deleting them will be covered. You also can expect to see questions that are
    scenario-based in which you have to assess how to provide the appropriate access.
    Often, this will be through the use of links.


    You can use a link to give another user access to one of your files. First, you
    would give the other user access rights to your file. You also might need to change
    the permissions on the directory containing the file to allow the other user to
    change or execute the file.


    You will want to consider the ramifications of changing the permissions on the
    directory before doing this. Review Chapter 9 for more information on allowing
    others access to your files and directories.


    After the permissions have been appropriately set, the other user can create a
    link to your file but locate the link in her home directory. This simplifies sharing
    information.


    Linking can be used to avoid creating multiple copies of a file. This saves both
    disk space and the administrative headaches associated with trying to keep multiple
    copies up to date.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'In addition, links can be helpful in managing large directory hierarchies.
    You could save all your memos in a directory called `memo`. You could then create
    links to individual memos under the `business` and `personal` directories, making
    it easier to locate a specific file.


    When you create a link, you are creating a new entry in the directory. If you
    create a link in the same directory as the original file, you must give it a different
    name. If the link is created in a different directory, they can both have the
    same name.


    # Key Concept


    A link is not the same as a copy of a file. Instead, the link is another name
    for that file that points to the original file. Changes made to that file are
    saved whether you access the file via its original name or via one of its links.


    When you change a file, those changes are seen whether the file is accessed directly
    or through one of its links. Linux supports two types of links: hard and symbolic
    (also called soft). The syntax is


    ```

    In [option] existing_file new_link

    ```


    One difference between a soft and hard link is their inode numbers. As discussed
    in Chapter 3, an `inode` is a data structure containing information on a file.
    The directory structure provides a way to associate the file''s name with its
    inode. The inode contains information on file attributes as well as the physical
    location where the file contents are located.


    # Hard Links


    Whenever you create a file you are actually creating a link. If you use the `rm`
    command to delete that file, you are removing the link.


    A *hard link* creates a new pointer to a file and not a new copy of the file.
    Hard links can be created only to an existing file. All the attributes of the
    link are identical to those of the original file: permissions, owner, and modification
    time. Just the filename and its place on the directory tree are different.


    Any changes made to any link are reflected in the contents of all the links. For
    example, say you create a hard link called `NewLink` to a document called `MyFile`
    and make changes to `NewLink`. When you open `MyFile`, you will see those changes.


    Another characteristic of a hard link is that you can delete any link and the
    file will still be there. So, in the preceding example, if you delete `MyFile`,
    `NewLink` is still there with all'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'its contents. The same applies if you delete NewLink; MyFile will still be
    there. However, if you also delete NewLink, the file is gone for good. If you
    use the ls command with the -i option, you will see that both files have the same
    inode number:


    ```

    ```

    ls -i MyFile Newlink

    3798 MyFile 3798 Newlink

    ```

    ```


    You can see the number of links a file has by using ls with the -1 option:


    ```

    ```

    ls -l MyFile Newlink

    -rw-r--r-- 2 hadden hadden 23 Aug 13 11:35 MyFile

    -rw-r--r-- 2 hadden hadden 23 Aug 13 11:35 Newlink

    ```

    ```


    Remember, as far as the operating system is concerned, these two pointers are
    equal, and it does not care which one was created first.


    Although the existing file and new link can be in the same directory, links are
    usually created in a different directory. To create a hard link, type


    ```

    ```

    ln MyFile /NewDirectory/Newlink

    ```

    ```


    If only the new directory location is specified then the new link will have the
    same name as the original file.


    Some limitations of hard links are that users can''t make hard links to directories
    and the links must be on the same filesystem. root, however, can create a hard
    link to a directory by using either the -d or -F option.


    # ## Symbolic Links


    A symbolic or *soft link* is an indirect pointer to the file. It is a new directory
    entry that contains the path to the existing file. Symbolic links were created
    to overcome the limitations of hard links. They can be created to a


    +   - Directory by a user

    +   - Nonexistent file

    +   - File on another filesystem


    Symbolic links are created using the ln command with the -s option:


    ```

    ```

    ln -s MyFile /NewDirectory/SymLink

    ```

    ```


    When using the ls -l command to look at a symbolic link, you will notice a few
    differences. The type of file is listed as 1 (the first character), the path to
    the original file is'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'listed, and the file attributes are different. For example, if both the original
    file and the symbolic link is located in the pwd, the ls -l command would display
    the following:


    ```

    ```

    ls -l MyFile Symlink

    -rw-r--r-- 1 hadden haddsn 23 Aug 13 11:35 MyFile

    lrw-rw-rw-- 1 hadden haddsn 4 Aug 13 12:13 Symlink -> MyFile

    ```

    ```


    You can delete the original file without removing any symbolic links; however,
    any symbolic links will no longer work. Because a symbolic link contains only
    the path to the original file, when the original file is deleted the link is pointing
    to a nonexistent file.


    To create a link to a directory, use the -P option. However, symbolic links to
    directories can’t work exactly like you expect when using the cd command. Different
    shells will act differently.


    You can use a symbolic link to a directory as the argument to the cd command.
    Under the bash shell, if you then issued the pwd command, it would return the
    symbolic name of the directory. However, if you issue the command cd .. to move
    up one level in the directory structure, you are placed in the directory containing
    the symbolic link, rather than the parent directory of the directory referenced
    by the symbolic link.


    In other shells, issuing the pwd command returns the name of the original directory
    rather than the symbolic link. When you issue the cd .. command, you are placed
    in the parent directory of the link itself.


    # ### Key Concept


    A link provides access to a file from different locations. Remember that all hard
    links to a file have the same inode number as the original file. This means that
    each link (filename) is associated with the same physical location on the disk.
    A soft link, however, contains only the path to the original file.


    Any one of the hard links can be deleted without preventing access via other hard
    links to that file. If the original file is deleted then all soft links to that
    file will no longer work.


    # ## Managing System Files


    In Chapter 3 we discussed the hierarchical nature of the Linux filesystem. How
    this directory hierarchy is organized is important in maintaining your system,
    installing software, and managing users. You will need to understand it for the
    exam.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'Each distribution has some differences in where files are stored and how the
    directory structure should be organized. Over time, these differences have resulted
    in problems with software installation or going from one distribution to another,
    especially regarding where configuration files are stored.


    As a result, an effort toward standardization has been undertaken. It is defined
    by the Filesystem Hierarchy Standard, which can be viewed at http://linuxpowerred.com/html/tutorials/fhs/fhs-toc.html.
    Although this standard was first defined to cover the Linux filesystem, it has
    been expanded to apply to other UNIX systems.


    For the exam, you will need to know the standard locations for files. On the distribution-specific
    exam, you will need to know the locations specific to that distribution.


    # Hierarchy


    There are some directories that always should be present and that contain specific
    types of files. A good place to start is root, which is represented by * / . This
    is the top or beginning of your directory structure.


    The / is the container for various other directories. Think of it as the glue
    that holds your system together. As a rule, this directory should not contain
    other files. Table 6.9 shows the major directories, what they contain, and their
    purposes. These are the directories that you should be familiar with for the exam.


    **Table 6.9 The Contents of the Root Directory and the Purpose of Each**


    | Directory | Contents and Use |

    | :--- | :--- |

    | bin | Contains binaries that are required for system startup. |

    | boot | Contains the kernel and any configuration files necessary for the boot
    loader. |

    | dev | Contains files necessary for accessing all types of peripheral devices,
    not just those present on your system. |

    | etc | Contains the system configuration files and scripts such as shell startup
    scripts. |

    | etc/skel | Contains skeleton user files to be placed in user''s home directory
    when his account is created. See Chapter 7 for more information on this directory.
    |

    | etc/X11 | Contains X Window configuration files. |

    | etc/rc.d | Contains startup scripts and the rc directories. See Chapter 2, "Booting
    Linux," for more information on the use and structure of this directory. |

    | home | Contains subdirectories for each user except root to be used as home
    directories; every regular user needs a home directory to be able to log in. Additional
    subdirectories can be used to further classify users. |...continues'
  merge: -1
  img_proc: true
- pgno: 161
