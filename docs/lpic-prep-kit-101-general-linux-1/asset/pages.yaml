  md: '# # Lab 4: Navigating Directories and Files


    It is important to understand how to move around the directory structure. You
    also need to know how to examine the contents of files.


    # ## Navigation


    Use the `cd` command to change to the `/usr/bin` directory. While here use the
    `ls` command to ascertain what type of files are contained in this directory.
    These are executable files that are available for any user to use.


    Use the `ls -1`, `ls -a`, and `ls -R` commands. Notice the difference between
    each listing. The `ls -1` command shows the file attributes; `ls -a` shows all
    files, including hidden ones; and `ls -R` recursively lists the contents of all
    the subdirectories.


    Next, type `ls -1 new*`. What is displayed this time? This shows only the files
    that begin with the letters `new`. The asterisk (*) represents any other characters
    that might follow these letters.


    Now, type just `cd` and `enter`. Where are you now? This command returns you to
    your home directory. You also can use the tilde (`~`) to return to your home directory
    by typing `cd ~`.


    # ## Examining File Contents


    Now type `cat > myfile`. What happened to your prompt? You are now using the `cat`
    command to create a new file. Type your address and press Enter after each line.
    Then type `Ctrl-D` to close the file.


    Type `cat myfile` to display the contents of this new file. Next, type the following:


    ```

    ```

    cat > myfile

    Ctrl-D

    cat myfile

    ```

    ```


    Now the previous contents of the file are gone because you overwrote the file.
    Re-create the file containing your address, and then type the following:


    ```

    ```

    cat >> myfile

    My new address file

    Ctrl-D

    cat myfile

    ```

    ```'
