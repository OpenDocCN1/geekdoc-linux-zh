    # Lab 10: System Administrative Tasks


    You will perform many tasks as a system administrator. Many of these will involve
    repetitive tasks. These exercises will cover automating these tasks.


    # Scheduling Tasks


    Use the `at` command to run a job. Type `at time` at a command prompt. Use a time
    that is about 30 minutes from now. After pressing the Enter key, you will be at
    the at prompt, where you should type a command. Try `is -1 > MyList`.


