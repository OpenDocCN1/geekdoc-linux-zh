    ```


    This will result in the commands being executed sequentially as though you had
    typed them on the command line separated by a semi-colon (;). If you want to have
    this job available to run at other times, save it to a file and then use the `-f`
    option to schedule it.


    ```

    at 17:00 -f gohome

    ```


    You can set the time for at to run in one of three ways:


    +   - By time, in the format HH:MM

    +   - The day of the week by number or name

    +   - By using words such as midnight, noon, teatime (4 p.m.), today, tomorrow,
    and now


    When specifying a time of day, at assumes you are using a 24-hour clock, so 4
    p.m. should be entered as 16:00. You also can schedule the event to occur relative
    to the present time, such as the number of minutes, hours, days, weeks, or years
    from now. Using *now* as the time will also require a date or increment. The increment
    must be followed by minute(s), hour(s), day(s), or week(s). Some examples of ways
    to enter times are


    ```

    at 23:15 -f mybackup

    at +3 hours -f gohome

    at now sat reboot

    ```


    The jobs submitted to at are actually run by the *crond* daemon using *atrun*.
    Periodically, the *crond* daemon runs *atrun* to check whether any at jobs are
    to be run. This usually occurs every five minutes. See the section "crontab" later
    in this chapter for details on how to change this configuration.


    To see what jobs have been scheduled, use the `atq` command, which is the same
    as `at -l`:


    ```

    $ atq

    12  1999-05-11 12:25 a

    13  1999-05-11 12:35 a

    ```


    This will list any pending jobs owned by the user running the `atq` command. The
    root user will see everyone’s jobs or can specify to see only those jobs scheduled
