  md: 'You can try out different prompts temporarily using the `export` command. To
    show date and time, use


    ```

    PS1=''Date: \d Time: \t:> '' ; export PS1

    ```


    To show the shell and current directory, type


    ```

    PS1=''\s:\w'' ; export PS1

    ```


    To make the change in your prompt permanent, edit your `.bash_profile` or `.profile`
    file and add the line `PS1=<value>`. To change the prompt for all users, change
