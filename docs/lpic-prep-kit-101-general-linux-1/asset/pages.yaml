  md: '# Table 4.3 An Explanation of cat Options


    | Option | Function |

    | :--- | :--- |

    | -A | Shows all nonprinting characters, prints \$ at the end of each line, and
    shows tabs as ^I (equivalent to -VET) |

    | -b | Numbers all nonblank output lines starting with 1 |

    | -e | Shows all nonprinting characters and prints \$ at the end of each line;
    equivalent to -VE |

    | -E | Displays \$ at the end of each line |

    | -n | Numbers all output lines, including blank ones |

    | -t | Shows all nonprinting characters, prints \$ at the end of each line, and
    shows tabs as ^I; equivalent to -VT |

    | -T | Displays Tab characters as ^I |

    | --help | Displays help and exit |

    | -v | Shows nonprinting characters |

    | --version | Outputs version information and exits |


    # Key Concept


    cat has three uses: creating a new file; displaying a file; and appending to an
    existing file. cat is one of the few commands that lets you review the contents
    of a file or make changes to it.


    # more and less


    *Pagers* are utilities that are used to display files in such a way that you can
    scroll back and forth one screen at a time through their contents. They also enable
    you to search the file for specific information.


    The two most common pagers are more and less. Both enable you to scroll forward
    using the spacebar and scroll backward using the b key. less, however, has more
    features than more. Additional features of less include


    +   - The capability to use cursor (arrow) keys to scroll forward and backward

    +   - The capability to navigate with bookmarks, line numbers, or percentage of
    file

    +   - less does not exit at the end of the file, although more does

    +   - lesskey is used to customize the navigation keys used with less'
