- pgno: 165
  md: 'The **which** command is helpful when a command is not responding the way you
    expect. For example, if you want to see which **ls** and which **cat** is being
    executed, you could use the **which** command, as in


    ```

    $ which ls cat

    /bin/ls

    /bin/cat

    ```


    Occasionally, there can be more that one command with the same name in different
    locations. Using the **which** command verifies that you are running the command
    you thought you were. After a match is found, it quits the search and displays
    the full path to it.


    # **Key Concept**


    > The **find** command searches the specified directory tree. The **locate** command
    searches the *locatedb* database. The **which** command identifies the command
    that is being run. This is helpful if there are multiple commands with the same
    name.


    # ## Summary


    Before you can access any files on your system, they must be made available to
    you. This is accomplished by mounting the volume containing the files you want
    to see. When mounting a filesystem, you can make it available as read-only, as
    well as for read and write access.


    Understanding the `/etc/fstab` and `/etc/mtab` files and how the **mount** and
    **umount** commands use them will definitely be on the exam. Issuing the **mount**
    command without any arguments will display which filesystems are presently mounted
    by examining the `/etc/mtab` file. The `/proc` directory is actually a way to
    look at what is present in RAM. It contains subdirectories for various running
    processes. As part of maintaining your filesystems, you might want to enforce
    quotas. The exam will cover the implementation of quotas as well as the various
    parameters you can define. Quotas can be set as a number of files or amount of
    space that is used.


    Links provide a way to make a file available under different names or from separate
    locations without wasting disk space with multiple copies of it. There are two
    types of links: hard and symbolic. Changes made to a file will be seen whether
    it is accessed via a hard or symbolic link. Hard links have the same inode number,
    but symbolic links do not. You can delete any hard link and the other links will
    still work. However, if you delete the referenced file, symbolic links will no
    longer work. Users can create symbolic links to directories but not hard links.
    Be sure you understand the purpose of the *user.quota* file as well as how to
    set both soft and hard limits.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'You should be familiar with the Linux hierarchy and understand the appropriate
    placement of files. Executable files are generally contained in a bin directory.
    There is both a /bin and a /usr/bin directory. Files are placed according to who
    will need to use them. The ability to find files is important to users as well
    as administrators. You can expect to see the find, locate, and which commands
    on the exam. Maintaining the locate file to locate new files is also important,
    as is using the find, locate, and which commands.


    # QUESTIONS AND ANSWERS


    +   1.  You have just received a CD containing a new application you want to install;
    however, when you insert the CD in your computer, you cannot access it. Why is
    this?

    +       A.  To access removable media, you will need to use the mount command
    to place it on the Linux hierarchy. If the CD-ROM filesystem is defined in the
    /etc/fstab file, you can mount it by referencing the mount point. Otherwise, you
    will need to specify the device, mount point, and filesystem.


    +   2.  Several of your users have come to you asking why they cannot save a file
    to a floppy disk. What is causing this and how can you allow your users to use
    the floppy?

    +       A.  Just like a CD-ROM, floppies must be mounted. If your users know how
    to use the mount command but are still getting errors, you have not given them
    the right to mount it. Edit the /etc/fstab file and add the user option to the
    line defining the floppy filesystem.


    +   3.  When you look at the contents of the /proc directory you see several directories
    with names that are numbers. What are these?

    +       A.  The /proc directory is actually a virtual directory that provides
    access to the contents of your system''s memory. These numbered directories are
    the various processes currently running on your computer.


    +   4.  You want to limit the amount of disk space each of your users can use.
    What should you do?

    +       A.  You can implement quotas for each of your users. You can set these
    for the number of files and directories they can have and the amount of disk space
    they can use.


    ...continues'
