- pgno: 273
  md: '# Planning Your Backup


    So what and why do you back up? Backing up your system is one of the most important
    jobs of any system administrator. It also is one of the least favorite jobs of
    most system administrators.


    You create backups for only one reason—to be able to recover from a disaster when
    it hits. Notice, the operative word is *when* not *if* it happens.


    Having an up-to-date backup means the difference between spending days or weeks
    recreating your server and having the system up and running in an hour or two.
    (It probably also means you get to keep your job.)


    The subject of disaster recovery can and does *fill entire books*. Designing an
    appropriate disaster plan and periodically testing it is an important part of
    your job.


    A wide variety of strategies can be utilized when creating your disaster recovery
    plan. When evaluating which one is best for you, you should consider some basic
    concepts.


    # Cost of Downtime


    Even when running Linux, there will be times when the system will be unavailable
    for users to log in. Recompiling the kernel, upgrading software packages, installing
    new hardware, and performing system maintenance are just a few reasons why your
    server might be unavailable.


    If the system is not available for users, the users'' downtime will need to be
    taken into account when calculating the cost of server downtime. Because this
    can become quite expensive, you will need to weigh this cost against the cost
    of implementing your plan.


    # Cost of Backup Strategy Implementation


    You will find a wide selection of disaster recovery strategies from which to choose.
    A solution costing a few dollars, such as copying important files to floppy disks,
    might be the solution you choose to implement. However, if your system provides
    critical services 24 hours a day, 7 days a week, your backup strategy might include
    a clustering and cost thousands of dollars to implement and maintain. Your choice
    of solution will be affected by the cost of server downtime, which directly relates
    to how critical your server is to your organization.


    # Workload of System


    The role of the system is a determining factor of what level of availability is
    required. If you are running a Web server for an e-commerce site, you need 24-hour
    availability every day. If, on the other hand, your system is used for file storage
    in an office, its needed'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'availability might be only during working hours. The increased cost for a more
    complex solution for disaster recovery is often justified when a server fills
    a critical role or requires a high level of availability.


    # ### Types of Backup Strategies


    You can choose from several types of strategies when deciding which is right for
    you. Some of your options include


    +   * Clustering

    +   * Standby server

    +   * Duplicate or backup server

    +   * Backup and restoration


    # ### Clustering


    Clustering consists of two or more computers that share access to a central data
    repository, such as a RAID array. Each of these servers can run different applications.
    If one member of the cluster goes down, another member will take over the downed
    server’s job. This change is invisible to users. If you require 24-hour availability,
    this solution will provide it. However, it is expensive both as far as initial
    setup costs and the expense of ongoing management.


    # ### Standby or Failover Server


    With this solution, a server that is identical to the online server is configured
    but is not available for users. It is live and listens to the main server to ensure
    it is available. When the main server goes offline, the standby server steps forward
    to handle the workload. It presents itself to the users with the same IP address
    and name, so the users never know which server is handling the workload. This
    is less expensive than clustering, but still is primarily used for systems that
    need 24-hour availability.


    # ### Duplicate or Backup Server


    The duplicate or backup server is installed with the same applications as the
    main server but is left offline until the original server goes down. The change
    over is not instantaneous as it is in the two previous solutions. You will have
    to bring up the new server and connect it to any volatile data, perhaps by moving
    hard disks from one computer to another or connecting it to a RAID array. This
    solution is less expensive but does result in some downtime if the main server
    dies.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_274_0.png)'
  merge: -1
  img_proc: true
- pgno: 275
  md: "# Backup and Restoration\n\nThe most common basis for disaster recovery is\
    \ periodic copying of files to another location, which can then be used to re-create\
    \ your system. Even with the more sophisticated solutions previously discussed,\
    \ backing up files is the backbone of any disaster recovery plan.\n\nWhether or\
    \ not you elect to implement one of the other plans, you still will need to maintain\
    \ a strategy of backing up your files. You also could elect to make this your\
    \ only disaster recovery strategy.\n\n# Key Concept\n\nBackup strategies can be\
    \ as simple as copying a file to a floppy disk or as complex as clustering. Other\
    \ middle-of-the-road solutions are backup and standby servers.\n\n# Backups\n\n\
    No matter how complex your disaster recovery plan is, you will need to maintain\
    \ up-to-date backups of all your data as well as your system and application files.\n\
    \n# Planning\n\nThe first step to planning your backup strategy is to answer four\
    \ simple questions:\n\n+   □ What are you going to back up? \n+   □ How often\
    \ will you back it up? \n+   □ How much time do you have to run your backup? \n\
    +   □ What media will you use for your backups?\n\nLet’s address each of these\
    \ separately.\n\n# What Are You Going to Back Up?\n\nWhen deciding what to back\
    \ up, consider the amount of time it will take to re-create the file versus the\
    \ amount of time it will take to back it up. If it would take longer to re-create\
    \ then back it up.\n\nFirst, classify your files into those that change and those\
    \ that don’t. As a rule, system and application files change only when you upgrade\
    \ an application or your operating system. Therefore, it is a waste of resources\
    \ to back these up on a daily basis.\n\n![](img/8dd1e68596303df43cb8ccf3197e8e53_275_0.png)"
  merge: -1
  img_proc: true
- pgno: 276
  md: 'However, it is a good idea to periodically back up system and application files.
    Having a recent backup will enable you to bring your system back up with all the
    latest patches already applied in a shorter period of time.


    For data files, you can have databases or other files that seldom change but can
    be used to retrieve information on a regular basis. In addition, some files change
    on an almost daily basis.


    If you organize your files based on the frequency with which they change, it will
    be much easier to plan your backup strategy. See Chapter 6, “Maintaining the Filesystem,”
    for more information on the Linux filesystem hierarchy and organizing your files.


    Putting volatile data on separate partitions is another way to simplify your disaster
    recovery plans. If all your users’ home directories are on a separate partition,
    you easily can back up this partition on a daily basis.


    # Backup Frequency


    After you have decided on what files you want to back up—and chances are you decided
    on backing up everything—you will need to decide how frequently to back them up.
    You do not need to back up every file every day, although you could.


    If files do not change, such as system and application files, why should you go
    to the expense of backing them up every day? Instead, you can elect to back them
    up weekly or monthly. Of course, you will want to back them up whenever you upgrade
    or make configuration changes. You also will want to perform a periodic backup
    of these files to ensure that you have a valid backup that can be used if you
    ever have to restore your system.


    For files that change frequently, ask yourself the following question. What is
    the cost to my organization if that data is lost before a backup is performed?
    In most situations, daily backups of changing files is adequate. However, if you
    have mission-critical information that changes hourly, you might want to back
    up these files more frequently.


    # How Much Time Do You Have to Run Your Backup?


    When planning what to back up, you will need to consider the amount of time you
    have for running the backup and how long it will take to back up the selected
    files.


    For high availability systems, you might have a narrow window when certain files
    are available for backing up. Plan your backups appropriately. Even if you have
    to back up a few files at a time, you still should back up as frequently as you
    can.


    # Media Selection


    Next, you will need to consider where to save your backups. Traditionally, this
    has been a tape drive. The advantages of using a tape drive include that they
    are relatively inexpensive—both the tape unit itself and the tapes. In addition,
    it is a technology that is well-known and very reliable.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'The disadvantages of using tape drives primarily have to do with speed. The
    speed of writing to a tape is slower than writing to other media such as hard
    disks. A tape does not have a filesystem like what you have on random access media
    such as your hard disk. In addition, because tape drives are read sequentially,
    it takes longer to retrieve information that has been stored to a tape. Other
    media, such as hard disks, enable random access, which speeds the retrieval process.


    To use a tape for backing up files, you frequently use some utility or application
    that accesses the tape, creates a table of contents, and saves the data to the
    tape. This same utility or application is then used to examine the table of contents
    and read the tape sequentially from the beginning of the data until the desired
    file is located.


    Today, with the advent of cheaper hard drives and other media such as writable
    CD-ROMs and optical drives, you have several other choices. For the fastest access
    to your backups, you should keep the material online. This can be accomplished
    by saving the backup to another hard disk. However, this is a more expensive option.


    The price of writable CD-ROMS has fallen to the point that they are a viable alternative.
    They provide fast and easy access when you need to retrieve data — if you clearly
    label them and maintain a log of what is stored where. They also have a long shelf
    life, making them a good choice when you have data that needs to be kept for an
    extended period of time.


    If you need reusable storage media, you can consider one of the magneto-optical
    disks. These come in very large sizes, provide random access, and have a longer
    shelf life than tapes.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_277_0.png)


    # Key Concept


    > When planning your backup strategy, consider what files to back up, how often
    to back them up, how much time you have for your backup, and what media you will
    use to store your backups.


    # Types of Backups


    There are four different types of backups:


    +   - Copy

    +   - Full backup

    +   - Partial backup

    +   - Incremental or differential backup'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'They are differentiated by what is backed up and how you go about restoring
    your files.


    # Copy


    The easiest and most common method of backing up a file is to make a copy of that
    file. Although this method is frequently used, most of the time it is not considered
    a true backup.


    When you copy a file to another location, you are then able to restore it if the
    original becomes corrupted or deleted by mistake. The media you copy it to is
    usually a floppy disk, but can be any of the other random access media available.


    You should use this method when changing important system and configuration files.
    If you make a mistake, you only need to restore the original file by copying it
    back from its backup location to have your system back to its original state.


    # Full Backup


    A *full* backup is exactly what its name implies. Every single file is backed
    up to your selected media. By having an up-to-date backup of your system, application,
    and data files, you can back up your system with a minimum of effort and in the
    shortest possible time.


    The disadvantage of doing a full backup is that it can take a long time and will
    require more media to hold the backup. If your total system takes up a couple
    of gigabytes of disk space, you will need that much storage space. This might
    require that the media be changed, thereby preventing you from making this a completely
    automated process.


    # Partial Backup


    When you keep files that change regularly on their own partition or at least in
    a separate area of the directory structure, you can do a full backup of just that
    partition or directory structure.


    This is faster than backing up your entire system, but still ensures that the
    back ups you have are as up to date as possible. In addition, it requires less
    space on the storage media. If you do not need to change the backup media during
    the backup process, you can automate the backup. If you have critical data that
    changes frequently, you might want to perform a partial backup more frequently
    than daily.


    # Incremental or Differential Backup


    When you perform *incremental* or *differential* backup, you only back up those
    files that have changed since your last full backup. This is different from a
    partial backup in that the entire system is examined and only changed files are
    backed up. A partial backup'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'is the same as a full backup, except only part of the filesystem is backed
    up instead of the entire system.


    The advantage of doing a differential backup is that it is faster than doing a
    full backup. Also, because the total size of the files you are backing up is smaller,
    the backup is more likely to not require you to change the media.


    The disadvantage of performing differential backups comes into play when you have
    to perform a restore. It will take you longer to restore when you use differential
    backups than if you use only full backups.


    If you are restoring your entire system, you will need to restore the last full
    backup followed by any differential backups that have been performed since that
    time. These must be applied in the same order that they were made. Also, if you
    are restoring a file for a user, you might have to look through several differential
    backups before you find the desired file.


    > > **Key Concept**

    > > Four different types of backups exist. They are *copy*, *full*, *partial*,
    and *differential* or *incremental*.


    # How Long Should You Keep Backups?


    Often you will be requested to restore a file that was deleted by mistake. Because
    these types of errors are not usually discovered immediately, the backup containing
    the file could be a week or more old.


    When planning your backup strategy, you should consider how vital your information
    is and how frequently it is accessed. Use this information to decide how frequently
    you should recycle the reusable media you are using for backups.


    For example, you might want to save your backups for a minimum of eight weeks.
    That means you should have enough media to hold eight weeks of backups. After
    eight weeks, you can recycle the oldest tape or disk. In addition, you might want
    to archive a full backup once a month and keep it for a year or more. Your organization''s
    business model and the type of information you are backing up are integral to
    making this decision. One possible backup strategy might be


    +   1.  Full backup every Friday; reuse this tape in nine weeks

    +   2.  Differential backup every Monday through Thursday; reuse these tapes in
    nine weeks

    +   3.  Archive the first full backup of every month by placing it in the vault
    and keep it for one year'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'No matter what strategy you use, be sure to use and label your media appropriately.
    This is especially important when using tapes that are rotated. For example, you
    might have tapes that you rotate labeled *Monday, #1, Monday, #2, Monday, #3,*
    and so on.


    Figure 11.1 shows one backup strategy in which a full backup is made every Friday
    and differential backups are created on Monday through Thursday. Each week you
    would use another set of backup tapes. So, the first week you would use a set
    labeled *number 1*, the next week you would use set *number 2*, and so on.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_280_0.png)


    **Figure 11.1**

    Although a backup is made daily, a full backup is made only on Friday. A differential
    backup is made Monday through Thursday nights.


    # Choosing a Storage Location


    One other item you need to consider is the storage location of your backups. Remember,
    these backups contain the data from your system. Anyone who gets their hands on
    them can access your data. Do not leave backup media lying around where anyone
    can take it. To ensure the security of your data, lock up your backups.


    # Protecting Your Backups


    Another consideration when storing your backups is the possibility of a fire.
    You can use fire-proof safes to store your media. However, these safes frequently
    reach internal temperatures high enough to destroy the media you have stored inside
    them. Consider storing your backups off-site to guarantee that you will be able
    to recreate your data no matter what the disaster.


    # Keeping a Log


    In addition, you should keep a log recording what was backed up, when the backup
    was made, and where the backup media is stored. Update this log every time a backup
    is performed. This log should record such pieces of information as


    +   * Date the backup was made

    +   * Name of the backup tape'
  merge: -1
  img_proc: true
- pgno: 281
  md: '+   □ Type of backup made

    +   □ What filesystem was backed up

    +   □ Where the backup media is stored


    This log will assist you when you need to restore a file. Where you keep the log
    is up to you. You can keep the log with the media itself or next to the server.
    To further improve your ability to recover from a disaster, consider keeping a
    copy of your log in both locations.


    # ### Restoring Files from Backup


    Even though you have a backup plan implemented, you still are not done. The backups
    you make are worthless unless you can retrieve that information. Don’t wait until
    you have a system crash or a user comes to you needing a file restored to find
    out whether your restore works.


    If you perform a full backup every day, restoring your system will consist of
    restoring the last backup you made. If you are using the backup plan shown in
    Figure 11.1, your restoration plan will be more complex than if you did a full
    backup every day.


    If you have a file called MyFile, it will be backed up every Friday. As shown
    in Figure 11.2, the file MyFile was changed on Monday and Wednesday, so it also
    was backed up on those days.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_281_0.png)


    # **Figure 11.2**


    > When doing differential backups, only files that were changed are backed up.
    When using differential backups to restore, you must restore the backups in the
    order that they were made.


    If your system crashes on Thursday, to restore it you would first need to restore
    the full backup from the previous Friday. Then, you would need to apply each differential
    backup that had been made since then in the order they were made. So, you would
    need to restore Monday’s tape, then Tuesday’s tape, and finally Wednesday’s tape.
    This would ensure that the latest version of all files would be restored.


    A lot of things can go awry with your backups without you knowing about it. For
    example, your media might go bad. When you reuse your media, it suffers wear and
    tear.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'Outside conditions also can adversely affect your media, such as rodents who
    like to eat tapes. With time, you can expect that parts of your media will become
    unusable. You should routinely check your backups to ensure that you can restore
    these files. This includes verifying that you can restore your entire system.


    Depending on what you use for backups, the method you use to restore them will
    vary. If you use tapes, you will want to use the same utility when restoring that
    you used to create the backup. If you use read-only media such as CD-ROMS or reusable
    media such as magneto-optical disks, your indexing process will directly affect
    how difficult the restoration will be. This is where your logs will save you time.


    Next, we will discuss the most common utilities that are used with Linux to create
    backups. These are also the utilities that will be covered in the exam.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_282_0.png)


    # Key Concept


    Backups are perishable. How long they last is dependent on the media used and
    the way they are stored. Keeping track of where they are stored is also important.
    To restore files, you must be able to find the correct backup—so keep good logs.


    # Backup Utilities


    Many utilities and applications are available for you to use to perform your backups.
    Some of these are quite elaborate and simplify configuring your backup plan. Others
    are basic to all Linux systems. Choose the one that makes the most sense for your
    situation.


    # tar


    The tar (tape archive) utility is used to combine multiple files into one large
    archive file while retaining the original directory structure. Although originally
    intended to create archives on a tape, tar files can be saved to any media. tar
    also has the capability to compress a file at the same time it creates it. Compression
    is covered in the section “Compressing and Uncompressing Files” later in this
    chapter.


    # Using tar to Create Backups


    When creating a tar file, you should use only relative paths. In other words,
    construct the path to the files you want to archive relative to where you are
    in the filesystem hierarchy. If your location is /home/hadden and you want to
    archive all the files in the /home/hadden/test directory, you should enter the
    path as test/\*.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'If you try to use absolute pathnames with tar, the leading slash is stripped
    off. This prevents overwriting existing files when a tar file is unarchived. To
    override this behavior, use the -P option. The tar files end in .tar, and the
    syntax for tar is


    ```

    tar [options] [tarfile] [files]

    ```


    Options used with tar can be classified as either switches or modifiers. You can
    use only one switch at a time, but you can use multiple modifiers. Whichever switch
    you use must come before any modifier. Table 11.1 lists the switches that can
    be used with tar. Table 11.2 lists the modifiers used with tar.


    Table 11.1 Switches to Be Used with tar (Only One Switch Can Be Used at a Time)


    | Switch | Action |

    | :----- | :----- |

    | A | Appends tarfile2 to end of tar file |

    | c | Creates a new tar file |

    | d | Compares tar file''s contents with other files and reports differences |

    | r | Adds to the end of existing tar file |

    | t | Displays name of files in tar file |

    | u | Adds new or modified files to tar file |

    | x | Extracts files from tar file |


    Table 11.2 Modifiers to Be Used with tar


    | Modifier | Action |

    | :------- | :----- |

    | b | Specifies block size |

    | e | Prevents splitting files across volumes |

    | f | Tar file''s name with path or device |

    | F | Filename containing tar arguments |

    | L | Length of tape; n times 1024 bytes |

    | M | Archive spans multiple volumes |

    | m | Does not restore modification times |

    | n | Device is not a tape |

    | p | Keeps original permissions when extracting |

    | v | Displays a list of files added |

    | W | Verifies files after adding to tar file |

    | w | Makes tar interactive |

    | z | Uses gzip to compress archive |'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'The command to create a tar file containing all the files in the `pwd` is


    ```

    tar cf myarchive.tar .

    ```


    This command causes the contents of the `pwd`, including any subdirectories, to
    be tarred into the file `myarchive.tar`. The `c` switch creates the `tar` file,
    and the `t` modifier provides the name for this new archive. The trailing dot
    (.) is used to specify the current working directory.


    In addition, you can use the `f` option to specify the device name, as in


    ```

    tar cf /dev/tape /

    ```


    This command creates an archive of the entire root filesystem to the tape device.
    This overwrites any existing contents on the tape with the new archive, so be
    sure there is not anything on the tape you need to keep.


    When creating an archive on a tape device, you usually have to specify the blocking
    factor by using the `b` modifier, as in the following example:


    ```

    tar cvfb /dev/tape 20 /

    ```


    The blocking factor times 512 bytes instructs `tar` as to how much data can be
    written at a time. A blocking factor of 20 can be used with most tape devices.
    When reading tapes, you do not need to specify the block size.


    # Key Concept


    > When a modifier requires an argument, the argument is listed after all modifiers
    are specified. These arguments must be in the same order as the modifiers are
    listed.


    If your backup will span multiple tapes or disks, you will need to specify the
    media''s length, as well as indicate that this will be a multi-volume archive.
    This can be a problem when backing up a large amount of data, especially if you
    are also are compressing the backup.


    When backing up to floppy disks, your backup probably will span multiple floppies.
    You will need to specify the size of the floppy and tell `tar` that the backup
    will span multiple disks, as in the following:


    ```

    tar cnfM /dev/fd0 1200 /home/*

    ```


    This command tells `tar` to create a `tar` file on the floppy device (`/dev/fd0`),
    which is 1200 bytes in size and contains all the files in the `/home` directory.
    The `M` tells `tar` that this archive will span multiple volumes. When the first
    one is full, you will have to manually change the backup media.'
  merge: -1
  img_proc: true
- pgno: 285
  md: "You can view the contents of your tar file using the following command:\n\n\
    ```\ntar -tf myarchive.tar\n```\n\nThe *t* option causes *tar* to print the names\
    \ of the files contained in the archive named *myarchive.tar*.\n\n# Restoring\
    \ Files with *tar*\n\nNot only will *tar* enable you to create an archive, it\
    \ also enables you to restore the contents of an archive. To extract your *tar*\
    \ file, type\n\n```\ntar -xvf myarchive.tar\n```\n\nHere, the *x* option tells\
    \ *tar* to extract the contents of the *tar* file called *myarchive.tar*. The\
    \ *v*, or verbose, option causes *tar* to print which files are being extracted\
    \ to the standard output. The *f* option names the *tar* file to be extracted.\n\
    \nIt is important to examine your *tar* file before extracting it. You need to\
    \ know how the *tar* file was built to ensure that files will be extracted to\
    \ the correct location.\n\nFor example, if you created a backup of your users'\
    \ home directories by typing\n\n```\ntar -cf home.tar /home/*\n```\n\nthe directory\
    \ name */home* is added to the beginning of each file added to the new archive.\
    \ To extract this correctly, you must be in the */* directory.\n\nHowever, if\
    \ you first made the *home* directory your *pwd* and then typed\n\n```\ntar -cf\
    \ home.tar .\n```\n\nthe *home* directory would not be appended to the files'\
    \ names. So, before extracting any files from this archive, you would want to\
    \ make the *home* directory your *pwd*.\n\n> **Key Concept**\n> \n> How you create\
    \ a *tar* file makes a big difference in how files are stored. Using the command\
    \ `tar -tvf tarfile` will enable you to see the contents of the *tar* file and\
    \ verify what directory names are stored in it. Always verify whether directory\
    \ names are stored in a *tar* file before extracting any of its contents.\n\n\
    There are two different ways to restore a single file. First, you can choose which\
    \ file to extract from a list of the contents of the *tar* file by typing\n\n\
    ```\ntar -xwrf myarchive.tar\n```"
  merge: -1
