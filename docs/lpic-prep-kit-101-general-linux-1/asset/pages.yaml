- pgno: 111
  md: 'Be careful when using this option. Although the `tar` command will not overwrite
    directories, it will overwrite any existing file with the same name. To prevent
    this behavior, use the `-k` option, which will leave any existing files intact.


    Many people use `tar` to manage their backups. Two options that make this so functional
    are the `-u` and `-r` options. The `-u` option causes `tar` to update or append
    the specified file to an existing tarfile. The `-r` option appends a new file
    to an existing tarfile. Both of these options require you to specify the existing
    tarfile name as well as the file you want to update or append.


    # **gzip**


    Files are frequently compressed to save storage space or transmission time when
    copying or moving from one computer to another. In the DOS/Windows world, this
    is done using `pkzip`/`pkunzip` utilities. In the Linux world, the preferred format
    is `gzip`/`gunzip`, which creates a file with the `.gz` extension. There are some
    differences between `gzip`/`gunzip` and `pkzip`/`pkunzip`, however:


    +   *   `gzip` does not compress more than one file.

    +   *   `gzip` and `gunzip` automatically delete the original file.


    After using the `tar` command to create an archive, it might be desirable to compress
    your file. You can use `tar` and `gzip` to create a compact backup, leaving you
    with the original directory structure and files intact inside a tarred and gzipped
    file.


    The syntax for `gzip` is


    ```

    gzip [options] [file-to-zip]

    ```


    You can use `gzip` to compress the tarfile `myarchive.tar` by typing


    ```

    gzip myarchive.tar

    ```


    You also can combine these on the same command line using the pipe (|) character:


    ```

    tar -cf myarchive.tar . | gzip myarchive.tar

    ```


    This command first creates the tarfile `myarchive` containing all files in the
    `pwd`. Then `gzip` compresses `myarchive.tar`, creating a new compressed file
    called `myarchive.tar.gz`. Lastly, `gzip` deletes the original file, `myarchive.tar`.
    For this reason, you must have enough room for both the compressed file and the
    uncompressed file or the compression operation will fail.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'You also can use another feature of the tar utility to gzip on-the-fly by utilizing
    the -z option. The following example does the same thing, but you type fewer characters:


    ```

    tar -cvzf myarchive.tar.gz

    ```


    # Key Concept


    Remember: You will tar first, and then gzip to create a compressed archive. gzip
    deletes the original file, in this case, myarchive.tar. The name of the file can
    end with .tar.gz or .tgz.


    # compress


    The compress utility is one of the oldest compression utilities. The compressed
    file must end in .Z and the syntax is


    ```

    compress filename

    ```


    This is a utility that is not used much anymore because its compression is not
    as good as newer utilities such as gzip. To uncompress the file, type


    ```

    uncompress filename.Z

    ```


    # gunzip


    Okay, you have all these compressed files sitting there. What do you do if you
    need to extract files? First, you must uncompress the tarfile using gunzip.


    The syntax for gunzip is


    ```

    gunzip filename

    ```


    After gunzip has done its thing, you will have the original, uncompressed file.
    However, the compressed file is gone because gunzip deletes the compressed file
    after uncompressing it. You also can use the gzip command to uncompress the file
    by using the -d option.


    Use tar to uncompress a compressed tar archive. Do this by using the -z option.
    So, if you type


    ```

    tar -xvzf MyArchive.tar.gz

    ```


    All the files contained in MyArchive.tar.gz will be restored, and the compressed
    file will still be there because tar does not erase the original file.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# **zcat**


    The zcat utility works like cat, except it enables you to see the contents of
    a compressed file. It works with files compressed using gzip (.gz extension) or
    compress (.z extension). Its syntax is


    ```

    zcat filename

    ```


    After zcat is through displaying the file''s contents, the original file is not
    changed. It is still there on your disk and still compressed.


