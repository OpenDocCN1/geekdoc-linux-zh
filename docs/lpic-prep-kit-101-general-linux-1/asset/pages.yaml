- pgno: 151
  md: '# The /etc/mtab File


    The mount table, `/etc/mtab`, is a listing of presently mounted filesystems. This
    file is displayed when the `mount` command is issued without any arguments.


    It is created at the time the system boots. Using either the `mount` or `umount`
    command keeps the `/etc/mtab` file updated. This behavior can be overridden by
    using the `-n` option with either `mount` or `umount`. The `umount` command is
    discussed in the next section.


    # umount


    If you no longer want to have access to a particular filesystem, unmount it using
    the `umount` command. Its syntax is


    ```

    umount [options] [device]

    ```


    The `umount` command is generally used to unmount removable devices prior to ejecting
    them from the system, such as floppy disks and CD-ROMs. Always unmount all removable
    devices before removing them from the system. Failure to do so can result in the
    loss of data.


    The options that are used with the `umount` command are listed in Table 6.3.


    | Option | Action |

    |---|---|

    | -a | Unmount all filesystems listed in the `/etc/mtab` |

    | -n | Unmount the specified filesystem but do not change the `/etc/mtab` file
    |

    | -t *fs-type* | Unmount the *fs-type* filesystems |


    You can specify either the device or the mount point as an argument to the `umount`
    command. After the command has been issued, all pending read/writes are completed,
    and then the filesystem is unmounted.


    # Disk Quotas


    Setting disk quotas that limit the amount of hard disk space that can be used
    by each user or group will help you better manage your system.


    For the exam, you will need to know how to set disk quotas, including setting
    soft and hard limits. You also will be tested on how to monitor these quotas.


    Disk quotas are set on a partition-by-partition basis. You can elect to set quotas
    on only one partition or to have different quota values on each partition.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Quotas can be managed on a per-user basis or on a group basis. These quotas
    are independent from each other; that is, the total of the disk quotas for the
    group’s members is unrelated to the group’s quota. So, if there are 10 users who
    are members of the wp group and each user has an individual quota of 3MB, you
    could still set the group’s quota to 10MB.


    Whenever a user creates a file, it is owned by that user and his group. See Chapter
    9, “Permissions,” for further details on file ownership. If quotas are in place,
    the records for both the user quotas and the group quotas are updated.


    If a user attempts to create a file and his group’s quota has been exceeded, the
    attempt to create the file will fail even if he has available space based on his
    individual quota. To create a file, he must then change his group. See Chapter
    7, “Users and Groups,” for more information on changing groups.


    # **Key Concept**


    When creating a new file, the creator’s group’s quota is checked first. If a quota
    for that group exists, the size of the new file is counted toward that group’s
    quota. If no quota exists for the group, the owner’s quota is checked before the
    file is created.


    By default, the ability to set quotas is turned off. To enable the ability to
    set quotas, you must first edit the fstab file and add the usrquota option to
    the line defining the filesystem where you want quotas to be applied:


    ```

    /dev/hda1 / ext2 defaults,usrquota 1 1

    ```


    As root, you would next need to create an empty file called quota.user in the
    root of the partition where you are defining the quotas. You will need to set
    its permissions to read and write by root only (see Chapter 9), so you could type


    ```

    touch /quota.user

    chmod 600 /quota.user

    ```


    You now will have to reboot your system to make these changes and turn on the
    quotas using the quotaon command. If you should ever decide that you do not want
    to enforce quotas on a particular partition, you can turn off the quotas by using
    the quotaoff command. Both of these take the filesystem’s name as an argument.
    Table 6.4 shows the options that apply to the quotaon command and Table 6.5 shows
    the options for the quotaoff command.'
  merge: -1
  img_proc: true
- pgno: 153
