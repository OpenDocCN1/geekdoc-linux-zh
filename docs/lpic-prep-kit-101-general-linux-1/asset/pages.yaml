    # **HOME**


    The **HOME** variable contains the location of the logged on user''s home directory.
    This information is determined by the entry in the `passwd` file for your account.
    See Chapter 7, for more information on the `passwd` file.


    When you log in, your home directory as defined by the **HOME** variable is set
    as your `pwd`. If you issue a `cd` command without an argument, the shell consults
    the **HOME** variable and changes to that directory.


    This variable also is used by the shell to expand pathnames if the tilde (~) is
    included. The following two examples would both result in making the `/home/hadden/test`
    directory the `pwd`:


    ```

    cd /home/hadden/test

    cd ~/test

    ```


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_131_0.png)


    > **Key Concept**

    > Many environment variables can be set. `PATH` defines where the shell searches
    for commands. `PROMPT` defines how the prompt is displayed. `HOME` contains the
    path to your home directory. Use `set`, `printenv`, or `env` to see your environment
    variables.


    # History List


    The bash shell maintains a list of the most recently used commands called `events`.
    You may reuse, edit, or review them to see why something went wrong. Each event
    is given a number by the shell.


    When the shell starts up, the history is initialized from the file named by the
    **HISTFILE** environment variable, which by default is the `.bash_history` file
    in your home directory.'
