  md: '# **CHAPTER PREREQUISITE**


    Before beginning this chapter you should be comfortable with the commands and
    tasks discussed in Chapters 5, “GNU and UNIX Commands,” and Chapter 10, “Administrative
    tasks,” respectively. You also should have a good understanding of the Linux filesystem
    hierarchy, as discussed in Chapter 3, “Linux Filesystem,” in order to be able
    to develop an appropriate backup strategy.


    # Backup and Restore


    # WHILE YOU READ


    +   1. Your server must be available to your users 24 hours a day, 7 days a week,
    but you need to add more hard disk space. What can you do?

    +   2. You have been given the job of planning the backup strategy for your Web
    server. What files should you back up, and how often should you back them up?

    +   3. You need to back up the employee database and keep the backups for five
    years. What would be the best way to do this?

    +   4. Your backup plan consists of doing a full backup every Monday and a differential
    backup nightly Tuesday through Friday. Your server’s hard disk fails on Thursday
    morning. What do you do to get the server back up as soon as possible?

    +   5. You want to back up your users’ home directories. You decide to use the
    tar utility and archive them to tape. What command should you use?

    +   6. You need to restore a file from the backup of the home directories. How
    can you do this?

    +   7. You need to compress your archive to save space on your tape. How would
    you modify the command you created for question 5?

    +   8. You have created tar files of the employee database and want to store the
    last six months on a CD-ROM but there is not enough space. How might you make
    them fit?'
