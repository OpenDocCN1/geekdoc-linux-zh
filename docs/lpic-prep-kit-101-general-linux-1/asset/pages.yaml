- pgno: 63
  md: '# ## Partitions


    *Partitions* are used to divide hard drives into sections. A hard drive must have
    at least one partition and can have up to four. After creating your partitions,
    you need to format them, which creates the filesystem your operating system uses
    to store files. These steps are covered in more detail later in this chapter in
    the section “fdisk.”


    There are two types of partitions that can be used to store data, primary and
    extended. A *primary partition* is formatted and then used to store files. In
    addition, a computer can be booted only from a primary partition.


    > **Key Concept**

    > There are two types of partitions: primary and extended. An extended partition
    is divided into one or more logical drives that are used to store data.


    An *extended partition*, on the other hand, cannot be used to store data directly.
    It is only a container for another structure called a *logical drive*. An extended
    partition is divided into one or more logical drives. Each logical drive is then
    formatted and used for data storage. Logical drives can exist only on extended
    partitions. You cannot directly use an extended partition. Rather, you use the
    logical drives contained in the extended partition.


    A hard disk can have up to four primary partitions. Or, it can be divided into
    up to three primary partitions plus one extended partition. Figure 3.1 shows two
    different partitioning schemes.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_63_0.png)


    **Figure 3.1**

    On the left is a hard drive scheme divided into four primary partitions. The right
    side shows a hard drive scheme divided into two primary partitions and one extended
    partition. The extended partition has been divided into logical drives.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Key Concept


    There can be a total of no more than four partitions on each disk. These can be
    all primary or you can have up to three primary and one extended partition.


    One more issue must be addressed before you finalize your partition plan. As mentioned
    in Chapter 2, “Booting Linux,” when LILO is used to boot Linux, it does not recognize
    beyond the 1023rd cylinder of your hard drive. Therefore, if you are using LILO
    to boot your system, the partition where LIL0 resides must exist entirely within
    the first 504MB.


    # Interpreting Partition Names


    Partitions are named according to the type of disk controller the hard disk contains,
    the partition, and which partition it is on that disk. Under DOS, the first partition
    of the first drive would be disk(0) partition(1). Linux refers to the same partition
    as hdat if it is IDE and sdal if it’s SCSI.


    When interpreting partition names, the first letter identifies the type of controller
    (SCSI or IDE). The d stands for disk; the third letter numbers the disks (the
    first disk is a, the second is b, and so on); and the last character is the partition
    number. Table 3.1 shows some partitions.


    Table 3.1 Naming Partitions Under Linux

    | Name | Controller | Disk | Partition |

    | hda1 | IDE controller | first disk | first partition |

    | sda1 | SCSI controller | first disk | first partition |

    | hdc3 | IDE controller | third disk | third partition |

    | sdb4 | SCSI controller | second disk | fourth partition |


    # Key Concept


    Partition names are based on the type of controller and partition number. Partitions
    on SCSI drives are referred to as sdan and partitions on IDE drives are named
    hdan.


    # How Many and What Size?


    Linux will run just fine with only two partitions, root (/) and swap (swap). All
    files, applications, and so on, are installed on the root partition. The swap
    partition is used as virtual memory.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Virtual memory refers to a combination of the amount of physical RAM on your
    computer added to the amount of swap space you have configured. The operating
    system uses the swap space so it can function more efficiently.


    If your system has 8MB of physical memory, a swap partition can give the operating
    system more memory, which results in a faster system. If you create a swap partition
    of 16MB, your system will have a total of 24MB of memory to use.


    The type of partition you create is specified when using the fdisk utility as
    discussed later in this chapter. The advantages of using multiple partitions are
    as follows:


    +   □ If one partition is damaged, the other partitions remain isolated from the
    damage.

    +   □ If you have to reformat a partition, data on the other partitions are unaffected.

    +   □ Files that grow rapidly, such as log and mail files, can be kept on separate
    partitions to prevent them from taking all available space.

    +   □ Upgrades are easier to perform because the system and data files are isolated
    from each other.

    +   □ Backups are easier if system files and data files are located on separate
    partitions.

    +   □ The time required for filesystem checks at boot can be reduced.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_65_0.png)


    # **Key Concept**


    > The minimum number of partitions used to install Linux is two: one primary partition
    as the root (/) and a swap partition.


    Your swap partition should be twice the amount of physical RAM installed on your
    system. The maximum size of a swap partition is 128MB, but you can have up to
    16 separate swap partitions. The recommended minimum size is 16MB for the operating
    system to function at its best.


    If space is tight, you can make the size of your swap partition equal to the amount
    of physical RAM, as long as it is at least 16MB.


    ![](img/8dd1e68596303df43cb8ccf3197e8e53_65_1.png)


    # **Key Concept**


    > A swap partition should be at least 16MB in size. Its maximum allowable size
    is 128MB. You can have up to 16 separate swap partitions on a single system.


    Although a swap partition is more efficient, you can use a *swap file* if you
    do not have enough room to create a separate swap partition.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'How all this is accomplished is relatively simple. Linux moves unused pages
    of memory out to the swap partition, allowing more applications to run simultaneously
    on your system. However, swapping is slower than using physical RAM. If you have
    4MB of RAM or less, you will need to have a swap partition or the installation
    will fail.


    One possible partitioning plan is shown in Table 3.2.


    | Partition | Contents |

    | :--- | :--- |

    | / | Contains applications and configuration files |

    | /var | Contains log files |

    | /usr | Contains system software |

    | /tmp | Contains temp files |

    | /home | Contains users'' home directories |

    | swap | Acts as virtual memory |



    One disadvantage of multiple partitions is that you cannot enlarge a partition
    dynamically if it should get full. Rather, you would have to delete the partition
    and then re-create it with a larger size. With the larger hard drives available
    now, many system administrators use fewer partitions.


    Plan your partitioning scheme out on paper. Although you can always blow away
    your partitions and start all over, having a well thought-out plan before starting
    the partitioning process will keep you from having to reinstall because of space
    constraints.


    # Key Concept


    An advantage of multiple partitions is that you can better control the amount
    of space dynamic files such as log files can consume. On the other hand, a partition
    cannot be dynamically enlarged if it becomes full.


    # Tips


    If you are installing Linux on a computer running another operating system and
    there is no free space to create a new partition, you can use `fips.exe` to non-destructively
    divide a single FAT16 partition in two.


    This program does not work with any filesystem except FAT16. Although fips usually
    works without losing any existing data, be sure to make a complete backup of your
    system before using it.'
  merge: -1
  img_proc: true
- pgno: 67
  md: "fips.exe can be downloaded at http://Sunsite.unc.edu/pub/Linux/system/install.\
    \ Whenever you use a program such as fips, you should always make a full backup\
    \ and read the documentation before starting.\n\nCopy fips.exe and restartbx.exe\
    \ to a floppy. A copy of your old Master Boot Record (MBR) will be copied to this\
    \ floppy during the installation program. This backup copy of your MBR can be\
