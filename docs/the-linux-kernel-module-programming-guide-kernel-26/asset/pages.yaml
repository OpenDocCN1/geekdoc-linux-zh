    \ *buffer,\n               char **buffer_location,\n               off_t offset,\
    \ int buffer_length, int *eof, void *data)\n{\n\n\tint ret;\n\n\t(KERN_INFO, \"\
    procfile_read (/proc/%s) called\\n\", PROFS_NAME);\n```\n\nChapter 5. The /proc\
