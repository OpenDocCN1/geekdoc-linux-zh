  md: '# The Linux Kernel Module Programming Guide


    The Linux versions are divided between the stable versions (n.$<number>$) and
    the development versions (n.$<number>$). The development versions include all
    the new ideas, including those which will be considered a mature, or reintroduced,
    in the next version. As a result, you can''t trust the interface to remain the
    same in those versions (which is why I don''t to support them in this book, it''s
    too much work and it would become too quickly). In the stable versions, on the
    other hand, we can expect the interface to remain the same regardless of the bug
    fix version (the m number).


    There are differences between kernel versions, and if you want to support multiple
    kernel versions, you''ll find yourself having to code conditional compilation
    directives. The way to do this is to compare the macro LINUX_VERSION_CODE to the
    macro KERNEL_VERSION. In version a.b.c of the kernel, the value of this macro
    would be $2*[16]+a*[8]+b.


    Previous versions of this guide showed how you can write backward compatible code
    with such constructs in great detail, we decided to break with this tradition
    for the better. People interested in doing such might now use a LKMPG with a version
    matching to their kernel. We decided to version the LKMPG like the one so LKMPG
    version 2.4.x for kernels 2.4.x, use LKMPG version 2.6.x for kernels 2.6.x and
    so on. Also make sure that you always use current, up to date versions of both,
    kernel and guide.


    Update: What we''ve said about was true for kernels up to and including 2.6.10.
    You might have already noticed that recent kernels look different. In case you
    haven''t they they look like 2.6.x.y now. The meaning of the first three items
    stays the same, but a subpatchlevel has been added and will indicate security
    fixes till the next stable patchlevel stays. So people can choose between a stable
    version with security updates and use the latest kernel as developer tree. Search
    the kernel mailing list archives if you''re interested in the full story.'
