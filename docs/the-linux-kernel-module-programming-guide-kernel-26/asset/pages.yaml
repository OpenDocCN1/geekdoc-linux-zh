  md: "# The Linux Kernel Module Programming Guide\n\n# ## 2.1.1. Introducing printk()\n\
    \nDespite what you might think, printk() was not meant to communicate information\
    \ to the user, though we used it for exactly this purpose in hello! It happens\
    \ to be a logging mechanism for the kernel, and is used to log information or\
    \ warnings. Therefore, printk() statement comes with a priority, which is the\
    \ <1> and KERN_ALERT you see. There are 8 priorities and the kernel has many for\
    \ them, you don't have to use cryptic numbers, and you can view them in linux/kernel.h.\
    \ If you don't use a priority level, the default priority, DEFAULT_MESSAGE_LOGLEVEL,\
    \ will be used.\n\nTake time to read through the priority macros. The header file\
    \ also describes what each priority means. In practise, always use the number,\
    \ like <4>, like KERN_WARNING.\n\nIf the priority is less than const console_loglevel,\
    \ the message is printed to your current terminal. Through both syslog and klog,\
    \ the message will also get appended to /var/log/messages, whether it gets printed\
    \ to the console or not. We use a high priority, KERN_ALERT, to make sure the\
    \ printk() messages get printed to your console not just logged to your log. When\
    \ you write your modules, you'll want to use priorities that are meaningful for\
    \ the situation at hand.\n\n# ## 2.2. Compiling Kernel Modules\n\nKernel modules\
    \ need to be compiled differently from regular users apps. Former kernel versions\
    \ require us to make these settings, which are mostly stored in Makefiles. Although\
    \ hierarchically organized, many redundant assignments accumulated in sublevel\
    \ Makefiles make them large and difficult to maintain. Unfortunately, there is\
    \ a new way of doing these things, kbuild, and the build process for external\
    \ loadable modules is now fully integrated into the standard kernel build mechanism.\
    \ Learn more on how to compile modules which are not part of the official kernel\
    \ (as all the examples you'll find in this guide), see linux/Documentation/kbuild/modules.txt.\n\
    \nSo, let's look at a Makefile for compiling a module named hello-1.c:\n\n###\
    \ Example 2–2. Makefile for a basic kernel module\n\n```\nobj-m += hello-l.o\n\
    \nall:\n    make -C /lib/modules/$(shell uname -r)/build M=$(PWD) modules\n\n\
    clean:\n    make -C /lib/modules/$(shell uname -r)/build M=$(PWD) clean\n```\n\
    \nFrom a technical point of view the first line is really necessary, the \"all\"\
    \ and \"clean\" targets are added for pure convenience.\n\nNow you can compile\
    \ the module by issuing the command make . You should obtain an output which resembles\
    \ the following:\n\n```\nhostname:~/lkmp-examples/02-HelloWorld# make\nmake -C\
    \ /lib/modules/2.6.11/build M=/root/lkmp-examples/02-HelloWorld\n[1]: Entering\
    \ directory /usr/src/linux-2.6.11\nCC [M] /root/lkmp-examples/02-HelloWorld/hello-1.o\n\
    Building modules, stage 2.\nMODPOST\n```\n\nChapter 2. Hello World"
  merge: -1
