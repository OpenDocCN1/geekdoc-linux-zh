  md: '# The Linux Kernel Module Programming Guide


    ```

    CC /root/kmpkg-examples/02-HelloWorld/hello-1.mod.o

    LD [M] /root/kmpkg-examples/02-HelloWorld/hello-1.ko

    make[1]: Leaving directory ''/usr/src/linux-2.6.11''

    hostname:/root/kmpkg-examples/02-HelloWorld#

    ```


    Note that kernel 2 introduces a new naming convention: kernel modules have a .ko
    extension (in place of the .o extension) which distinguishes them from conventional
    object files. The reason for this is that they can contain an additional .modinfo
    section where additional information about the module is wrote. We''ll keep on
    to what additional information is good for.


    Use modinfo-* to see what kind of information it is.


    ```

    hostname:/kmpkg-examples/02-HelloWorld# modinfo hello-1.ko

    filename: hello-1.ko

    vermagic: 2.6.11 preempt PENTIUMII 4STACKS gcc-3.3

    depends:

    ```


    Nothing spectacular, so that. Changes we''re using modinfo on one of our later
    examples, hello-5.ko.


    ```

    hostname:/kmpkg-examples/02-HelloWorld# modinfo hello-5.ko

    filename: hello-5.ko

    license: GPL

    author: Peter Jay Salomon

    vermagic: 2.6.11 preempt PENTIUMII 4STACKS gcc-3.3

    depends:

    parm: myArray:A character string (array of int)

    parm: mystring:A character (char)

    parm: mylong:A long integer (long)

    parm: myint:An integer (int)

    parm: myshort:A short (short)

    hostname:/kmpkg-examples/02-HelloWorld#

    ```


    Lot''s useful information for kernel to see. An author here for bugreports, license
    information, even a short description of the parameters it accepts.


    Additional details for Makefiles for kernel modules are available in linux/Documentation/kbuild/makefiles.txt.
    Be sure to read that and the related files starting to make Makefiles. You''ll
    probably see lots of work.


    Now it is time to insert your freshly-compiled module into the kernel with insmod
    /hello-1.ko (ignore anything you see about we tainted kernels; we''ll cover that
    shortly).


    All modules loaded into the kernel are in /proc/modules. Go ahead and check to
    see that your module is really part of the kernel. Congratulations, you are now
    the author of kernel code! When the novelty wears, remove your module from the
    kernel using rmmod hello-1. Take a look at /var/log/messages to see that it got
    logged to your system log.


    Here''s another exercise for the reader. See what about the return statement in
    init_module()? Change the value to something negative, recompile and load the
    module again. What happens?


    # 2.3. Hello World (part 2)


    As of Linux 2.4, you can rename the init and cleanup functions of your module;
    they no longer have to be called init_module() and cleanup_module() respectively.
    This is done with the module_init()


    Chapter 2. Hello World'
