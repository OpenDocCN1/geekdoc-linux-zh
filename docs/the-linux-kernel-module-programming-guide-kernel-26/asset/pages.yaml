    \ to functions that are used to implement read, write, open, ... syscalls are\
    \ commonly known as fops.\n\n# 4.1.2. The file structure\n\nEach device is represented\
    \ in the kernel by a file structure, which is defined in linux/fs.h. Be aware\
    \ that a file is a kernel level structure and never appears in a user space program.\
    \ It's not the same as a FILE, which is defined by glibc and also, its name is\
    \ a bit misleading; it represents an open 'file', not a file on a disk, which\
    \ is represented by a structure named inode.\n\nAn instance of struct file is\
