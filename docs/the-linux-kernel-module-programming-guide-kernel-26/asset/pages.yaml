  md: "# Chapter 4. Character Device Files\n\n# 4.1. Character Device Drivers\n\n\
    # 4.1.1. The file_operations Structure\n\nThe file_operations structure is defined\
    \ in linux/fs.h, and holds pointers to functions defined by the driver that performs\
    \ various operations on the device. Each field of the structure corresponds to\
    \ the address of some function defined by the driver to handle a requested operation.\n\
    \nFor example, every character driver needs to define a function that reads from\
    \ the device. The file_operations structure holds the address of the module's\
    \ function that performs that operation. Here is what the definition looks like\
    \ for kernel 26.5:\n\n```\nstruct file_operations {\n    struct module *owner;\n\
    \    loff_t(*llseek) (struct file *, loff_t, int);\n    ssize_t(*read) (struct\
    \ file *, char __user *, size_t, loff_t);\n    ssize_t(*write) (struct file *,\
    \ struct kiochack *, char __user *, size_t, loff_t);\n    ssize_t(*aio_write)\
    \ (struct file *, const char __user *, size_t, loff_t);\n    ssize_t(*aio_read)\
    \ (struct file *, const char __user *, size_t, loff_t);\n    int (*add_seekseek)\
    \ (struct file *, void *, filldir_t);\n    unsigned int (*poll) (struct file *,\
    \ struct poll_table_struct *);n    int (*ioctl) (struct inode *, struct file *,\
    \ unsigned int);\n    int (*mmap) (struct file *, struct vm_area_struct *);\n\
    \    int (*open) (struct inode *, struct file *);\n    int (*flush) (struct file\
    \ *);\n    int (*release) (struct inode *, struct file *);\n    int (*fsync) (struct\
    \ file *, struct destroy *, int datasync);\n    int (*aio_fsync) (struct kiochack\
    \ *, int datasync);\n    int (*fasync) (struct file *, int, struct file_lock *);\n\
    \    int (*lock) (struct file *, const struct file_lock *);\n    ssize_t(*readv)\
    \ (struct file *, const struct iovec *, unsigned long, loff_t);\n    ssize_t(*writev)\
    \ (struct file *, struct iovec *, unsigned long, loff_t);\n    ssize_t(*sendfile)\
    \ (struct file *, loff_t, size_t, read_actor_t, __user *);n    ssize_t(*sendpage)\
    \ (struct file *, struct page *, int_t, loff_t, int);\n    unsigned long (*get_unmapped_area)\
    \ (struct file *, unsigned long, unsigned long, unsigned long);\n};\n```\n\nSome\
    \ operations are not implemented by a driver. For example, a driver that handles\
    \ a video card won't need to read from a directory structure. The corresponding\
    \ entries in the file_operations structure should be set to NULL.\n\nThere is\
    \ a gcc extension that makes adding to this structure more convenient. You'll\
    \ see in modern drivers, what might catch you by surprise. This is what the way\
