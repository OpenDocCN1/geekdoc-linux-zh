    # 3.1.3. User Space and Kernel Space


    A kernel is all access to resources, whether the resource in question happens
    to be a video card, a hard drive or even memory. Programs often compete for the
    same resource. As I just saved this, updatedb updating the locate database. My
    vision and updatedb are both using the hard drive connectivity. The kernel needs
    to keep things orderly, and not give users access to whatever they feel like.
    This, CPU can run in different modes. Each mode has a different level of freedom
    to what you want on the system. The Intel i086 architecture has 4 of these modes,
    which are called rings. Unix uses two rings; the highest (ring 0, also known as
    ''supervisor mode'' where everything is allowed to happen) and the lowest, which
    is called ''user mode''.


    Recall the discussion about library functions vs system calls. Typically, you
    use a library function in user mode. The library function calls one or more system
    calls, and these system calls execute on the library function''s behavior, but
    do so in supervisor mode since they are part of the kernel itself. Once the system
    call completes its task, return and execution gets transferred back to user mode.


    # 3.1.4. Name Space


    When you write a small C program, you use variables which are convenient and make
    sense to the reader. On the other hand, your writing routines will be part of
    a bigger problem, global variables you have part of other people'' global variables;
    some of the variable names clash. When program has lots of global variables not
    meaningful enough to be distinguished, you get namespace pollution. In large projects,
    effort must be made to remember reserved names, and to find ways to develop a
    scheme for unique variable names and symbols.


    When writing kernel code, the smallest module will be linked to the entire kernel,
    so this is definitely an issue. The The best way to deal with this is to declare
    your variables as static and use a well-defined prefix for them. By convention,
    all prefixes are lowercase. If you don''t want to declare everything as static,
    another option is to declare a symbol table and register it with a kernel. We''ll
    get to this later.


    The file /proc/kallsyms holds all the symbols that the kernel knows about and
    are therefore accessible to your modules since they share the kernel''s codespace.'
