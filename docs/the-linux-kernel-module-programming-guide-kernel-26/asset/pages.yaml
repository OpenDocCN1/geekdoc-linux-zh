    # 2.8. Building modules for a precompiled kernel


    Obviously, we strongly suggest you to recompile your kernel, so that you can enable
    a number of useful debugging features, such as force unloading (MODULE_FORCE_UNLOAD):
    when this option is enabled, you can force the kernel to unload a module when
    it believes it is unsafe, via **rmmod -f module**. This option can save you a
    lot of time and many reboots in the development of a module.


    Nevertheless, there are a number of cases in which you might want to load your
    module into a precompiled running kernel, as the ones shipped with common Linux
    distributions, or a kernel you have compiled in the past. In certain circumstances
    you could compile and insert a module into a running kernel which you are not
    allowed to recompile, or on a machine that you need to reboot. If you can''t think
    of a case that will force you to use modules for a precompiled kernel you might
    want to skip this and treat the rest of this thing as a big bother.


    Now, if you install a kernel source tree, use it to compile your kernel module
    and you try to insert your module into the kernel, in most cases you would obtain
    an error as:


    ```

    insmod: error inserting ''poet_atkm.ko'': -1 Invalid module format

    ```


    Less exceptional is equal to /var/log/messages:


    ```

    Jun 22:07:54 localhost kernel: poet_atkm: version magic ''2.6.5-1.358custom 686

    REGPARM 4KSTACK gcc-3'' should be ''2.6.5-1.358 686 REGPARM 4KSTACK gcc-3''

    ```


    In other words, your kernel refuses to load because your module version strings
    (more precisely, version strings) do not match. Starting with **vermagic**: Version
    data is inserted into your module object in the form of a static string, when
    linked against the **init/vermagic.c** file. To inspect version magic and other
    strings in a given module, issue the **modinfo module.ko** command:


    ```

    [root@cmmons]# modinfo hello-ko

    license:

    GPL

    author:\Peter Jay Salzman <p@dirac.org>

    description:

    A sample driver

    vermagic:

    2.6.5-1.358 686 REGPARM 4KSTACK

    depends:

    ```


    To overcome this problem we could use the **--vermagic** option, which is potentially
    unsafe, and unquestionably unacceptable in production modules. Consequently, we
    want to compile our module in an environment which was identical to the one in
    which your precompiled kernel was built. How to do this, is the remainder of this
    chapter.


    First of all, make sure a kernel source tree is available, having exactly the
    version as your current kernel. Then, find the configuration file which was used
    to compile your precompiled kernel. Usually, this is available in your current
    **/boot** directory, make a link like **config-2.6.x**. You might just want to
    copy it to your kernel source tree: **cp /boot/config-uname -r /usr/src/-uname
    -rf/.


    Focus your attention on this error message: a closer look at the version strings
    suggests that, even with two configuration files which are the same, a slight
    difference in the version could be possible, and it is sufficient to prevent insertion
    of the module into the kernel. That difference, namely the **custom** string which
    appears in the module''s version magic and not in the kernel''s, is due to


