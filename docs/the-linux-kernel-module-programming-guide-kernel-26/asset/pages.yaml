  md: "# # Chapter 3. Preliminaries\n\n# ## 3.1. Modules vs Programs\n\n# ### 3.1.1.\
    \ How modules begin and end\n\nA program usually begins with a main() function,\
    \ executes a bunch of instructions and terminates upon completion of these instructions.\
    \ Kernel modules work a bit differently. A module always begins with either the\
    \ init_module function or the function you specify with module_init call. This\
    \ is the entry function for modules; it tells the kernel functionality the module\
    \ provides and sets up the kernel to run the module's functions when they're needed.\
    \ If it does this, entry function returns and the module does nothing until the\
    \ kernel wants to do something with the code that the module provides.\n\nAll\
    \ modules end by calling cleanup_module or the function you specify with the module_exit\
    \ call. This is the exit function for modules; it undoes whatever entry function\
    \ did. It unregisters the functionality that the entry registered.\n\nEvery module\
    \ must have an entry function and an exit function. There is more than one way\
    \ to specify entry and exit functions, I'll try my best to use the 'entry function'\
    \ and 'exit function', but if I slip and simply refer to them as init_module and\
    \ cleanup_module, I think you'll know what I mean.\n\n# ## 3.1.2. Functions available\
    \ to modules\n\nProgrammers use functions they don't define all them. A prime\
    \ example is printf(). You use these library functions which are provided by the\
    \ standard C library, libc. The definitions for these functions don't actually\
    \ enter your program until the linking stage, which ensures that the code (for\
    \ printf()) is available), and fixes the call instruction to point to that.\n\n\
    Kernel modules are here too. In the hello world example, you might have noticed\
    \ that we used a function, print() but didn't include a standard I/O library.\
    \ Because modules are object files whose symbols get resolved insmoding. The definition\
    \ for the symbols comes from the kernel itself; the only functions you can use\
    \ are the ones provided by the kernel. If you're curious about what symbols are\
    \ exported by your kernel, take a look at /proc/kallsyms.\n\nOne to keep in mind\
    \ is the difference between library functions and system calls. Library functions\
    \ are higher level, run in user space and provide a more convenient interface\
    \ for the programmer to the functions that do the real work—system calls Calls\
    \ run in kernel mode on the user's behalf and are provided by the kernel itself.\
    \ The library function printf() may look like a very general printing function,\
    \ but it really formats the data into strings and writes the string data using\
    \ the low-level system call write(), which then sends the data to standard output.\n\
    \nWould you like to see what system calls are by printf()? It's easy! Compile\
    \ the following program:\n\n```\n#include <stdio.h>\nint main(void) {\n    printf(\"\
    hello\"); return 0;\n}\n```\n\nwith gcc -Wall -o hello hello.c Run the executable\
    \ with strace /hello. Are you impressed? Every line corresponds to a system call.\
    \ trace[4] is a handy program that gives you details about what system calls a"
