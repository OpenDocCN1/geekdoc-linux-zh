  md: "# Chapter 9. Blocking Processes\n\n# 9.1. Blocking Processes\n\nWhat do you\
    \ do when somebody asks you for something you can't do right? If you're a human\
    \ being and you're bothered by a human being, the only thing you can say: \"Not\
    \ right now, I'm busy. Go away\". If you're a kernel module and you're bothered\
    \ by a process, you have another possibility. You can put the process to sleep\
    \ until you can service it. After all, processes are put to sleep and the woken\
    \ up until all the time (that's when multiple processes appear to run on the same\
    \ time on a CPU).\n\nThis module is an example of this. The file (/proc/sleep)\
    \ can be only opened by a single process at a time. If the file is already open,\
    \ the kernel calls wait_event_interruptible[2]. This function changes the status\
    \ of the task (a task is the kernel data structure which holds information about\
    \ a process and the system calls it, if any) to TASK_INTERRUPTIBLE, which means\
    \ the task will not run until it is woken up, and adds to WaitQueue, the queue\
    \ of tasks waiting to access the file. Then, the function calls the scheduler\
    \ to context switch to a different process, which has some use for the CPU.\n\n\
    When a process is done with the file, it closes it, and module_close fails (there's\
    \ no mechanism to wake up one of them). It returns the process which just closed\
    \ the file can continue to run. The scheduler decides that the process had no\
    \ advantage and gives control of the CPU to another. Eventually, one of the processes\
    \ that was in the queue will be given control of the CPU by the scheduler. It\
    \ starts at the point right after the call to module_interruptible_sleep[3]. It\
    \ can then proceed to set a global variable to tell all the other processes that\
    \ the file is still open and go on with it. When the other processes get a piece\
    \ of the CPU, they'll see that global variable and go back to sleep.\n\nSo we'll\
    \ use tail to keep the file in the background, while you want to access it with\
    \ another process (in the background, so that we do not switch to a different\
    \ v). As soon as the first background process is killed with %1, the second is\
    \ woken up, is able to access the file and finally terminates.\n\nTo make life\
    \ more interesting, module_close doesn't have a monopoly on waking the processes\
    \ which want to access the file. A signal such as Ctrl+c (SIGINT) can also wake\
    \ up a process. [14] In this case, we want to return -EINTR immediately. This\
    \ is important so users can, if they kill the process before it receives it.\n\
    \nThere is one more point to remember. Sometimes processes don't want to sleep,\
    \ they want either get what they want immediately, or to be told it cannot. Such\
    \ processes use the O_NONBLOCK flag when opening the file. The kernel is supposed\
    \ to respond with the error code -EAGAIN. The program cat_nonblock, available\
    \ in the source directory for this file, can be used to open a file with O_NONBLOCK.\n\
    \n```\nhostname:~/kmpg-examples/09-BlockingProcesses# insmod sleep.ko\nhostname:~/kmpg-examples/09-BlockingProcesses#\
    \ cat_nonblock /proc/sleep\nLast input:\nhostname:~/kmpg-examples/09-BlockingProcesses#\
    \ tail -f /proc/sleep & \nLast input:\nhostname:~/kmpg-examples/09-BlockingProcesses#\
    \ \nLast input:\nhostname:~/kmpg-examples/09-BlockingProcesses# \nLast input:\n\
    hostname:~/kmpg-examples/09-BlockingProcesses# \nLast input:\n```\n\nChapter 9.\
    \ Blocking Processes\n\n95"
