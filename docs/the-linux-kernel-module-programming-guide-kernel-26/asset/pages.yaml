  md: "# The Linux Kernel Module Programming Guide\n\nThe only memory segment accessible\
    \ to process is its own, when writing regular programs to run as processes, there's\
    \ no need to worry about segments. When you write a kernel module, normally you\
    \ want to access the memory segment, which is handled automatically by the system.\
    \ However, when the content of a memory buffer needs to be passed between the\
    \ currently running process and the kernel, the put_user and get_user allow you\
    \ to access the memory buffer. These functions handle only one character, with\
    \ copy_to_user and copy_from_user. As the buffer (in read or write) is in kernel\
    \ space, for write function you need to import data because it comes from user\
    \ space, but not for the read function because data is already in kernel space.\n\
    \n# Example 5-2. procfs2.c\n\n```\n/*\n* procfs2.c - create a \"file\" in /proc\n\
    \ */\n\n#include <linux/module.h>\n#include <kernel.h>\n#include <linux/proc.h>\n\
    #include <asm/uaccess.h>\n/* Specifically, a module /\n * We're doing kernel work\
    \ */\n * Necessary because we use the proc fs */\n * for copy_from_user */\n\n\
    #define PROFS_MAX_SIZE      1024\n#define PROFS_NAME          \"bufferlk\"\n\n\
    /**\n* This structure holds information about the /proc file\n */\nstatic struct\
