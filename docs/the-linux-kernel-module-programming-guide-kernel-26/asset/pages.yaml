  md: "# The Linux Kernel Module Programming Guide\n\n```\n* This function is called\
    \ when the module is unloaded\n*\nvoid cleanup_module() {\n    remove_proc_entry(PROCS_NAME,\
    \ &proc_root);\n    printk(KERN_INFO, \"/proc/%s removed\\n\", PROCS_NAME);\n\
    }\n```\n\nWe have seen to read and write a /proc file with the /proc interface.\
    \ But it's also possible to manage /proc file with inodes. The main interest is\
    \ to use advanced function, like permissions.\n\nIn Linux, there is a standard\
    \ mechanism for file system registration. Since every file system has its own\
    \ functions to handle inode and file operations, there is a special structure\
    \ to hold pointers to all functions, struct inode_operations, which includes a\
    \ pointer to struct file_operations. In /proc, whenever we register a new file,\
    \ we're allowed to specify which struct inode_operations will be used to access\
    \ it. This is the mechanism we use, a struct inode_operations which includes pointers\
    \ to our procfs_read and procfs_write functions.\n\nAnother interesting point\
    \ is the module_permission function. This is called whenever a process tries whether\
    \ to access or not. Right now it is only by operation and the uid of the user\
    \ (as available in current, a pointer to a structure which includes information\
    \ (the currently running process)), but it could be based on anything like, as\
    \ other processes dealing with the same file, the time of day, or the last input\
    \ received.\n\nIt's important to note that the order of read and write are reversed\
    \ in the kernel. Read functions are used for output, whereas write functions are\
    \ used for input. The reason for that is that read and write refer to the user's\
    \ point of view —— if a process reads from the kernel, the kernel needs to output\
    \ it, and if a process writes to the kernel, the kernel receives it as input.\n\
    \n# 5–3. procfs3c\n\n```\n/* procfs3c - create a \"file\" in /proc, use the file_operation\
    \ way\n to manage the file.\n*/\n#include <linux/kernel.h>\n#include <linux/module.h>\n\
    #include <linux/proc_fs.h>\n#include <asm/uaccess.h>\n/* We're doing kernel work\
    \ *\n/* Specifically, a module */\n/* Necessary because we use proc fs */\n/*\
    \ for copy_user * */\n\n#define PROC_ENTRY_FILENAME  *buffer2k*\n#define PROCS_MAX_SIZE\
    \        2048\n/**\n/* The buffer (2k) for this module */\n/*\nstatic char procfs_buffer[PROCS_MAX_SIZE];\n\
    ```\n\n# 5. The /proc File System"
