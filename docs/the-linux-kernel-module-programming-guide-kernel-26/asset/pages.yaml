    \ (true, non zero)\n* BTW: this param has been removed in Kernels: 2.6.9\n* The\
    \ (2nd) 3rd parameter is a pointer to a string.\n* The (3rd) 4th parameter is\
    \ the length of the string.\n* As you see below, sometimes it's necessary to use\n\
    * preprocessor stuff to create code that works for different\n* kernel versions.\
    \ The (naive) approach we've taken here\n* does not scale well. The right way\
    \ to deal with this\n* is described in section of 2\n* linux/Documentation/SubmittingPatches\n\
    \n```\n(my_tty-driver)->write(my_tty), /* itself *\n#if ( LINUX_VERSION_CODE <=\
    \ KERNEL_VERSION(2,6,9) )\nreturn 0, /* Don't take the string\n    from user space\n\
    */\n#endif\nstr, /* String\nstrlen(str); /* Length */\n```\n\n+   * ttys were\
    \ originally hardware devices, which (usually)\n* strictly followed the ASCII\
    \ standard. In ASCII, to move\n* a new line needs two characters, a carriage return\
    \ and a\n* line feed. On Unix, the ASCII line feed is used for both\n* purposes\
    \ so we can just \\n, it wouldn't have\n* a carriage return and the next line\
    \ will start at the\n* column right after the line feed.\n* This is why text files\
    \ are different between Unix and\n* MS Windows. In CF/M and derivatives, like\
    \ MS-DOS and\n* MS Windows, the ASCII standard was strictly adhered to,\n* and\
    \ therefore a newline requires both a LF and a CR.\n\n```\n#if ( LINUX_VERSION_CODE\
    \ < KERNEL_VERSION(2,6,9) )\n    (my_tty-driver)->write(my_tty, \"\\015\\012\"\
    , 2);\nelse\n    (my_tty-driver)->write(my_tty, \"\\015\\012\", 2);\n#endif\n\
