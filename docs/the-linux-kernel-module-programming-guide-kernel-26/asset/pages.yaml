    \ we have \"housekeeping\" tasks which have to be done at a certain time, or so\
    \ often. If the task is to be done by a process, we do it by putting it in the\
    \ crontab file. If the task is to be done by a kernel module, we have two possibilities.\
    \ The first is to put a process in the crontab file which will wake up the module\
    \ by a system call when necessary, for example by opening a file. This is terribly\
    \ inefficient, however--- we run a new process of crontab, read a new executable\
    \ to memory, and all this to wake up a kernel module which is in memory away.\n\
    \nInstead of doing that, we can create a function that will be called once for\
    \ every timer interrupt. The way we do this is to create a task, held in a queue_struct,\
    \ which will hold a pointer to the function. Then, we use queue_delayed_work to\
    \ put that task on a list called my_workqueue, which is the list of tasks to be\
    \ executed on the next timer interrupt. Because we want the function to keep being\
    \ executed, we need to put it back on my_workqueue when called, for the next timer\
    \ interrupt.\n\nThere's one more we need to remember here. When a module is removed\
    \ by rmmod, its first reference count is checked. If it is zero, module_cleanup\
    \ is called. Then, the module is removed from memory with all its functions. Things\
    \ need to be shut down properly, or bad things will happen. See the code below\
    \ how this can be in a safe way.\n\nExample 11-1. sched.c\n\n```\n* sched.c -\
