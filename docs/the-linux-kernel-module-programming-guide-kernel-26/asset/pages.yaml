  md: '# # Chapter 1. Introduction


    # ## 1.1. What Is A Kernel Module?


    So, you want to write a kernel module. You know C, you''ve written a few programs
    to run as processes, and now you want to get where the real action is, where a
    single wild pointer can wipe out your file system and a core dump needs to be
    loaded.


    What exactly is a kernel module? Modules are pieces of code that can be loaded
    and unloaded into the kernel upon demand. They extend the functionality of the
    kernel without the need to reboot the system. For example, one type of module
    is the device driver, which allows the kernel to access hardware connected to
    the system. Without modules, we would have build monolithic kernels and add any
    new functionality directly into the kernel image. Being larger kernels, this has
    the disadvantage of requiring us to rebuild and reboot the kernel every time we
    want new functionality.


    # ## 1.2. How Do Modules Get Into The Kernel?


    You can see what modules are already loaded into the kernel by running `lsmod`,
    which gets its information by reading the file `/proc/modules.


    How these modules find their way into the kernel? When the kernel needs a feature
    that is not resident in the kernel, the kernel daemon kmod[1] executes modprobe
    to load the module. modprobe is passed in one of two forms:


    +   * A module name softdog or ppp.

    * A more generic identifier like char-major-10-30.


    If modprobe is handed a generic identifier, it first looks for strings in the
    file `/etc/modprobe.conf[2] If it finds an alias line like:


    ```

    alias char-major-10-30 softdog

    ```


    it knows the generic identifier refers to the module softdog.ko.


    Next, modprobe looks through the file `/lib/modules/version/modules.dep`, to see
    if other modules must be loaded before the requested module is loaded. This file
    is created by depmod -a and contains module dependencies. For example, mdsos requires
    the fat.ko to be already loaded into the kernel. The module has a dependency on
    another module if the other module defines symbols (variables or functions) that
    the requested module uses.


    Lastly, modprobe uses insmod to load any prerequisite modules into the kernel,
    and then the requested module. insmod directs to `/lib/modules/version/[3], the
    standard directory for modules. insmod is intended to be fairly dumb about the
    location of modules, whereas modprobe is aware of the location of modules, how
    to figure out the dependencies and load the modules in the right order. So for
    example, if you wanted to load the mdsos module, you would have to run:


    ```

    insmod /lib/modules/2.6.11/kernel/fs/fat.ko

    insmod /lib/modules/2.6.11/kernel/fs/mdsos.ko

    ```'
  merge: -1
