  md: "# The Linux Kernel Module Programming Guide\n\n# 5.4. Manage /proc file with\
    \ seq_file\n\nAs we have seen, writing a /proc file may be quite \"complex\".\
    \ So to help people writing /proc file, there is an API named seq_file that helps\
    \ formatting /proc file for output. Based on sequence, which is composed of 3\
    \ functions: start(), next(), and stop(). The seq_file API starts a sequence when\
    \ we read the /proc file.\n\nA sequence begins with the call of the function start().\
    \ If the return is a NULL value, the function next() is called. This function\
    \ is an iterator, the goal is to go that all the data. Each time next() is called,\
    \ the function show() is called. It writes data values in the buffer by the reader.\
    \ The function next() is called until it returns NULL. The sequence ends when\
    \ next returns NULL, then the function stop() is called.\n\nBE CAREFUL: when a\
    \ sequence is finished, another starts. Means that at the end of function stop(),\
    \ the function start() is called again. This loop finishes when the function start()\
    \ returns NULL. You can see a scheme of this in the figure \"How seq_file works\"\
    .\n\nFigure 5–1. How seq_file works\n\nSeq_file provides basic functions for /file_operations,\
    \ as seq_read, seq_lseek, and some. But nothing to write in the /proc file. Of\
    \ course, you can still use the same way as in the previous example.\n\n# Figure\
    \ 5–4. procfs4.c\n\n```\n/**\n* procfs4.c - create a \"file\" in /proc\n* This\
    \ program uses the seq_file library to manage the /proc file.\n */\n\n#include\
    \ <linux/kernel.h>\n#include <linux/module.h>\n#include <linux/proc_fs.h>\n#include\
    \ <linux/seq_file.h>\n\n/* We're doing kernel work */\n/* Specifically\n```\n\n\
    Chapter 5. The /proc File System"
