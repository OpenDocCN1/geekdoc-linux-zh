  md: "# The Linux Kernel Module Programming Guide\n\nThere is also __initdata which\
    \ works similarly to __init for init variables rather than functions.\n\nThe __exit\
    \ macro causes the omission of the function when the module is built into the\
    \ kernel, and like __exit, has no effect for loadable modules. Again, if you consider\
    \ the cleanup function runs, this makes complete sense: built-in drivers do not\
    \ need a cleanup function, while loadable modules.\n\nThese macros are defined\
    \ in linux/init.h and serve to free up kernel memory. When you boot your kernel\
    \ and see something like Freeing unused kernel memory: 236k freed, this is precisely\
    \ what is freeing.\n\n# Example 2-5. hello-3c\n\n```\n/*\n* hello-3.c - Illustrating\
    \ the __init, __initdata and __exit macros.\n */\n#include <linux/module.h>  \
    \  /* Needed by all modules */\n#include <linux/kernel.h>   /* Needed for KERN_INFO\
    \ */\n#include <linux/init.h>      /* Needed for the macros */\n\nstatic int hello_3_data\
    \ __initdata = 3;\nstatic int __init hello_3_init(void)\n{\n    printk(KERN_INFO,\
    \ \"Hello, world %%d\\n\", hello_3_data);\n    return 0;\n}\n\nstatic void __exit\
    \ hello_3_exit(void)\n{\n    printk(KERN_INFO, \"Goodbye, world 3\\n\");\n}\n\
    ```\n\n# 2.5. Hello World (part 4): Licensing and Module Documentation\n\nIf you're\
    \ running kernel 2.4 or later, you might have noticed something like this when\
    \ you loaded proprietary modules:\n\n```\n# insmod xxxxx.o\nWarning: loading xxxxx.ko\
    \ will taint the kernel: no license\nSee http://www.tux.org/linux/lml/#export-tainted\
    \ for information about tainted modules\nModule xxxxx loaded, with warnings\n\
    ```\n\nIn kernel 2.4 and later, a mechanism was devised to identify code for the\
    \ GPL (and friends) so people can be warned that the code is not open-source.\
    \ This is accomplished by the MODULE_LICENSE () macro which is demonstrated in\
    \ the next piece of code. By setting the license to GPL, you can keep the warning\
    \ from being printed. This license mechanism is defined and documented in linux/module.h:\n\
    \n+   * The following license idents are currently accepted as indicating free\n\
    \nChapter 2. Hello World"
  merge: -1
