  md: "# Chapter 2. Hello World\n\n# 2.1. Hello, World (part 1): The Simplest Module\n\
    \nWhen the first caveman chiseled the first program on the walls of the first\
    \ cave computer, it began with a program to paint the string 'Hello, world' in\
    \ Antelope pictures. Roman programming textbooks began with the 'Salut, Mundi'\
    \ program. I don't know what people who break with this tradition, but I think\
    \ it's safer not to find out. We'll start with a series of hello world programs\
    \ that demonstrate the different aspects of the basics of writing a kernel module.\n\
    \nHere's the simplest possible. Don't compile it yet; we'll cover module compilation\
    \ in the next section.\n\nExample 2–1. hello-1c\n\n```\n/*\n * hello-l.c - The\
    \ simplest kernel module.\n */\n#include <linux/module.h>    /* Needed by all\
    \ modules */\n#include <linux/kernel.h>    /* Needed for KERN_INFO */\n\nint init_module(void)\n\
    {\n    printk(KERN_INFO \"Hello world 1.\\n\");\n    /*\n     * A non 0 return\
    \ means init_module failed; module can't be loaded.\n     */\n    return 0;\n\
    }\n\nvoid cleanup_module(void)\n{\n    printk(KERN_INFO \"Goodbye world 1.\\n\"\
    );\n}\n```\n\nKernel modules must have at least two functions: a \"start\" (initialization)\
    \ function called init_module() and an \"end\" (cleanup) function called cleanup_module()\
    \ which is called when the module is inserted into the kernel, and just before\
    \ it is removed. Actually, things have changed starting with kernel 2.3.1. You\
    \ can now use whatever name like for the start and end functions of a module,\
    \ and you'll learn how to do it using Section 2.3, and cleanup_module() for their\
    \ start and end functions.\n\nTypically, init_module() either registers a handler\
    \ for something with the kernel, or it replaces one of the kernel functions with\
    \ its own code (usually to do something and then call the original function).\
    \ The cleanup_module() is supposed to undo whatever init_module() did, so the\
    \ module can be unloaded safely.\n\nLastly, every kernel module needs to include\
    \ linux/module.h. We needed to include linux/kernel.h only for the macro expansion\
    \ for the printk() log level, KERN_ALERT, which you'll learn about in Section\
    \ 2.1.1."
  merge: -1
