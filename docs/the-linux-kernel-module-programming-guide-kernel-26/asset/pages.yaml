    \ Resist the temptation.\n\nGo ahead and look at the definition of file. Most\
    \ of the entries you see, like struct entry aren't used by drivers, and you can\
    \ ignore them. This is because drivers don't fill file directly; they only use\
    \ structures in file which are created elsewhere.\n\n# 4.1.3. Registering A Device\n\
    \nAs discussed earlier, devices are accessed through device files, usually located\
    \ in /dev/[7]. The major number tells you which driver handles which file. The\
    \ minor number is used only by the driver itself to differentiate which device\
