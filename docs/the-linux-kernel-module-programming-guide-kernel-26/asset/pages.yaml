  md: "# The Linux Kernel Module Programming Guide\n\nThe init_module function replaces\
    \ the location in sys_call_table and keeps the original pointer in a variable.\
    \ The cleanup_module function uses variable to restore everything back to normal.\
    \ This is necessary because of the possibility of two kernel modules changing\
    \ the same system call. Imagine we have two kernel modules, A and B. A's system\
    \ call will be A_open and B's will be B_open. When A is inserted into the kernel,\
    \ the system call is replaced with A_open, which will be the original sys_open\
    \ when it's. Next, B is inserted into the kernel, which replaces the system call\
    \ with B_open, which will be the original system call, A_open, when it's done.\n\
    \nNow, if B is removed, everything will be well——it simply restore the system\
    \ call to A_open, which calls the original. However, if A is removed and B is\
    \ removed, the system will crash. A removal will restore the system call to the\
    \ original, sys_open, cutting B out of the loop. Then, when B is removed, it will\
    \ restore the system call to it A_open, which is no longer in memory. At first\
    \ glance, it could solve this particular problem by checking if the system call\
    \ is equal to our function and if not changing it (so B won't change the system\
    \ call when it's removed), but that will cause even worse problem. When A is removed,\
    \ it sees that the system call changed to B_open so that there is no longer pointing\
    \ to A_open, so it won't restore to sys_open before it is removed from memory.\n\
    \nUnfortunately, B will still try to call A_open which is no longer exported,\
    \ so that without removing B the system would crash.\n\nNote that all the related\
    \ make syscall sys_call_table infeasible for production use. In order to keep\
    \ from doing potential harmful effects sys_call is no longer exported. This means,\
    \ if you want to do more than a dry run of this experiment, you will have to patch\
    \ your current kernel in order to have it. The example directory you will find\
    \ README and the path. As you can imagine, such modifications not to be taken\
    \ lightly. Do not try this on valuable systems (systems that you do not own –\
    \ cannot restore easily). You'll need to get the complete sourcecode of this guide\
    \ as a tarball in order to get the path and the README. Depending on your kernel\
    \ version, you might even need to hand apply the path. Still here? Well, so is\
    \ this chapter. If Wyle E. Coyote is a kernel hacker, this would be the first\
    \ thing you'd try ;\n\n# 8–1. syscall.c\n\n```\n/\n* syscall.c\n *\nSystem call\
    \ \"stealing\" sample.\n/\n```\n\n```\n/\n* Copyright (C) 2001 by Peter Jay Salzman\n\
    */\n```\n\n```\n/\n* The necessary header files\n*/\n```\n\n```\n/\n* Standard\
    \ in kernel modules\n#include <linux/kernel.h>      / * We're doing kernel */\n\
    #include <linux/module.h>      / * Specifically, a module, +\n#include <linux/moduleparam.h>\
    \ / * which will have params *\n#include <linux/unistd.h>      / * The list of\
    \ system calls */\n/\n```\n\n# Chapter 8. System Calls\n\n91"
