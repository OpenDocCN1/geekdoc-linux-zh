    # The Linux Kernel Programming Guide


    where unsigned int is the major number you want to register, const char *name
    is the name of the device as it''ll appear in /proc/devices and struct file_operations
    *fops is a pointer to the file_operations table for a driver. A return value negative
    means the registration failed. Note that we didn''t pass the number to register_chrdev.
    That''s because the kernel doesn''t care about the minor number; our drivers use
    it.


    The question is, how do you get a major number without hitting one that''s already
    in use? The easiest way would be to look through Documentation/devices.txt and
    pick an unused one. That bad way of doing things because you''ll never be sure
    if the number you picked will be assigned. The answer is that you can ask the
    kernel to assign you a dynamic number.


    If you pass a major of 0 to register_chrdev, the return value will be the dynamically
    allocated major number. The downside is that you can''t make a device file in
    advance, since you don''t know what the major number will be. There are a couple
    of ways to do this. First, the driver can print the assigned number and we can
    make the device file for. Second, the newly registered device will have an entry
    in /proc/devices, and we either make the device file by hand or write a script
    to read the file and make the device file. The third method is to have our driver
    make the device file using the mkmod system call after a successful registration
    and rm during the call to cleanup_module.


    # 4.1.4. Unregistering A Device


    We can''t allow the kernel module to be rmmoded whenever root feels like it. If
    the device file is opened by a process and then we remove the kernel module, using
    would cause a call to the memory location where the appropriate function (read/write)
    used to be. If we''re lucky, no code was loaded there, and we''ll get an error
    message. If we''re unlucky, another kernel module was loaded into the same location,
    which means a jump into the middle of another function within the kernel. This
    would be impossible to predict, but we can''t easily vary it.


    Normally, when you don''t want anything to do it. With cleanup_module that is
    impossible because it''s a void function. However, there''s a counter which keeps
    track of how many processes are using your module. You can see what it values
    by looking at the 3rd field of /proc/modules. If this number is zero, rmmod will
    fail. Note that you don''t have to check the counter from cleanup_module because
    the check will be performed for you by the system sys_delete_module, defined in
    linux/module.c. You shouldn''t use this counter directly, but there are functions
    defined in linux/module.h which let you increase and display this counter:


    +   - try_module_get (THIS_MODULE): Increment the use count.

    * module_put (THIS_MODULE): Decrement the use count.


    It''s important to keep the counter acute; if you ever lose track of the correct
    usage count, you''ll never be able to unload the module; it''s now reboot time,
    boys and girls. This is bound to happen you sooner or later during a module''s
    development.


