    ''stacking modules''). But this will have to wait for a future chapter. We''ve
    got to cover more before addressing this high-level issue.


    # 1.2.1. Before We Begin


    Before we induce code, there are a few issues we need to cover. Everyone''s system
    is different and everyone has their own groove. Getting your first "hello world"
    program to compile and load correctly can sometimes be tricky. Rest assured, after
    you get the initial hurdle of doing it for the first time, it will be smooth thereafter.


    # 1.2.1.1. Modversion


    A module compiled for one kernel won''t load if you boot a different kernel unless
    you enable CONFIG_MODVERS in the kernel. You won''t go into module versioning
    until this guide. Until we cover modversions, the examples in the guide may not
    work if you''re running a kernel with modversion turned on. However, most Linux
    distro kernels come with it turned on. If you''re having trouble loading the because
    of versioning errors, compile a kernel with modversion turning off.


    # 1.2.1.2. Using X


    It is highly recommended that you type, compile and load all the examples this
    guide discusses. It''s also highly recommended to do this from a console. You
    should not be working on this stuff in X.


    Modules can''t print to the screen using printf(), but they can log information
    and warnings, which ends being printed on your screen, but only on a console.
    If you insmod from an xterm, the information and warnings will be logged, but
    only to your log files. You won''t see it unless you look through your log files.
    To have immediate access to this information, do all your work from the console.


    # 1.2.1.3. Compiling Issues and Kernel Version


    Often, Linux distros will distribute source that has been patched in various non–standard
    ways, which may cause trouble.


    A more common problem is that some Linux distro distribute incomplete kernel headers.
    You''ll need to compile your code using various header files from the Linux kernel.
    Murphy''s law states that the headers that are missing are exactly the ones you''ll
    need for your module work.


    Chapter 1. Introduction


