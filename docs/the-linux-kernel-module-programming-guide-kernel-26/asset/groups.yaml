    {\n    printk(KERN_ALERT, \"Sorry, this operation isn't supported.\\n\");\n  \
    \  return -EINVAL;\n}\n\n# Chapter 4. Character Device Files\n\n## 4.1. Writing\
    \ Modules for Multiple Versions\n\nThe system calls, which are the major interface\
    \ to processes, generally stay the same. A new version may be added, but usually\
    \ the old ones will behave like they used to. This is necessary for backward compatibility\
    \ — a new version is not supported to break regular processes. In many cases,\
    \ the device files will also remain the same. On the other hand, internal interfaces\
    \ within the kernel can change between versions.\n\nThe Linux versions are divided\
    \ between stable versions (n.x) and development versions (n.y). The development\
    \ versions include all the new ideas, which will be considered mature or reintroduced\
    \ in the next stable version. As a result, you can't trust the interface to remain\
    \ the same in those versions (which is why I don't support them in this book,\
    \ it's too much work and would become too quickly).\n\nThere are differences between\
    \ kernel versions, and if you want to support multiple versions, you'll find yourself\
