  - "[PAGE 43]\n\n# # Chapter 7. Talking To Device Files\n\n# ## 7.1. Talking to Device\
    \ Files (writes and IOCTLs)\n\nDevice files are supposed to represent physical\
    \ devices. Most physical devices are used for output as well as input, so there\
    \ has to some mechanism for device drivers in the kernel to get the output to\
    \ send to the device from processes. This is done by opening the device file for\
    \ output and writing to it, just like writing to a file. In the following example,\
    \ this is implemented by `device_write`.\n\nThis is not enough. Imagine you had\
    \ a serial port connected to a modem (even if you have an internal modem, it is\
    \ still implemented from the CPU's perspective as a serial port connected to a\
    \ modem, so you don't have to tax your imagination too). The natural thing to\
    \ do would be to use the device file to write things to the modem (either commands\
    \ or data to be sent through the phone line) and read them from the modem (either\
    \ responses for commands or the data received through the phone line). However,\
    \ this leaves open the question of what to do when you need to talk to the serial\
    \ port, for example to send the rate at which data is sent and received.\n\nThe\
    \ answer in Unix is to use a special function `ioctl` (short for Input Output\
    \ Control). Every device has its own `ioctl` commands, which can be read `ioctl`\
    \ (to send information from a process to the kernel), write `ioctl` (to return\
    \ information to a process), [10] both or neither. The ioctl function is called\
    \ with three parameters: the file descriptor of the appropriate device file, the\
    \ ioctl number, and a parameter, which is of long so you can use a case to pass\
    \ anything. [11]\n\nThe ioctl number encodes the device number, the type of the\
    \ ioctl, the command, and the type of. This number is usually created by a macro\
    \ call `_IO__IOR__OW` (depending on the type) in a header file. This header should\
    \ then be included by the programs which will use `ioctl` (so they can generate\
    \ the appropriate `ioctl`) and by the kernel module (so it can understand it).\
    \ In the example, the file header is `chardev.h` and the program which uses it\
    \ is `ioctl.c`.\n\nIf you want to use `ioctl` in your own kernel modules, it is\
