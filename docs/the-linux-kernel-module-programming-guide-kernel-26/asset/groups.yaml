    # 前言


    # 1. 作者


    《Linux内核模块编程指南》（The Linux Kernel Module Programming Guide）最初由 Ori Pomerantz 为
    2.2 内核编写。最终，Ori 不再有时间维护该文档。毕竟，Linux 内核是一个快速变化的目标。Peter Jay Salzman 接手了维护工作并针对
    2.4 内核进行了更新。最后，Peter 也没有时间跟进 2.6 内核的发展，因此 Michael Burian 成为共同维护者，为 2.6 内核更新文档。


    # 2. 版本与注意事项


    Linux 内核是一个不断变化的目标。一直存在一个问题：LKMPG 是否应该移除过时信息，还是为了历史原因保留它们？Michael Burian 和我决定为每个新的稳定内核版本创建一个
    LKMPG 的新分支。因此，LKMPG 2.4.x 版本将针对 Linux 内核 2.4，LKMPG 2.6.x 将针对 Linux 内核 2.6。我们不会尝试存档历史信息；需要这些信息的人应该阅读对应版本的
    LKMPG。


    源代码和讨论适用于大多数架构，但我无法保证任何事情。例外是第 12 章“中断处理程序”，它在 x86 之外的任何架构上无法工作。


    # 3. 致谢


    以下人员提供了修正或良好的建议：Ignacio Martin, David Porter, Daniele Paolo Scarpazza, Dimo Velev,
    Francois Audeon 和 Horst Schirmeier。


    ## 第1章 引言


    ### 1.1. 什么是内核模块？


    你想写一个内核模块。你熟悉 C 语言，写过几个作为进程运行的程序，现在你想进入真正的领域——在那里，一个野指针就可以抹除你的文件系统，并且需要加载核心转储（core
    dump）。


    内核模块究竟是什么？模块是可以根据需要加载和卸载到内核的代码段。它们可以在不需要重启系统的情况下扩展内核功能。例如，模块的一种类型是设备驱动程序，它允许内核访问连接到系统的硬件。如果没有模块，我们将不得不构建单体内核，并将任何新功能直接添加到内核镜像中。由于内核变大，它的缺点是每当我们想要新功能时，都需要重新编译并重启内核。


    ### 1.2. 模块是如何进入内核的？


    你可以通过运行 `lsmod` 查看哪些模块已经加载到内核中，该命令通过读取 `/proc/modules` 文件获取信息。


    这些模块是如何进入内核的？当内核需要一个内核中未驻的功能时，内核守护进程 kmod[1] 会执行 `modprobe` 来加载模块。`modprobe` 以两种形式之一传入参数：


    - * 模块名称，如 softdog 或 ppp。

    - 更通用的标识符，如 char-major-10-30。


    如果传递给 `modprobe` 一个通用标识符，它首先查找 `/etc/modprobe.conf[2]` 文件中的字符串。如果它找到类似下面的别名行：


    ```

    alias char-major-10-30 softdog

    ```


    它就知道通用标识符指的是模块 `softdog.ko`。


    接下来，`modprobe` 会遍历 `/lib/modules/version/modules.dep` 文件，查看在加载请求模块之前是否必须加载其他模块。该文件由
    `depmod -a` 创建，包含模块依赖关系。例如，mdsos 要求 `fat.ko` 已经加载到内核中。如果另一个模块定义了请求模块使用的符号（变量或函数），则该模块对另一个模块有依赖关系。


    最后，`modprobe` 使用 `insmod` 将任何先决模块加载到内核，然后加载请求的模块。`insmod` 指向 `/lib/modules/version/[3]`，这是模块的标准目录。`insmod`
    设计初衷是对模块的位置相当“迟钝的”，而 `modprobe` 则感知模块的位置、如何确定依赖关系并按正确的顺序加载模块。例如，如果你想加载 mdsos 模块，必须运行：


    ```

    insmod /lib/modules/2.6.11/kernel/fs/fat.ko

    insmod /lib/modules/2.6.11/kernel/fs/mdsos.ko

    ```


    或者：


    ```

    modprobe msdos

    ```


    我们在这里看到：**insmod** 要求你传递完整路径并按正确的顺序插入模块，而 **modprobe** 只接受名称（不带扩展名），并通过解析 `/lib/modules/version/modules.dep`
    来获取它需要的所有信息。


    Linux 发行版通过一个名为 `module–init-tools` 的包提供了 `modprobe`、`insmod` 和 `depmod`。在之前的版本中，该包被称为
    `modules`。某些发行版还设置了封装器，允许这两个包并行安装并执行正确的操作，以便处理 2.4 和 2.6 内核。用户不需要关心这些细节，因为他们运行的是这些工具最新版本。


    现在你知道模块是如何进入内核的。如果你想编写依赖于其他模块的模块（这被称为“堆栈模块”），故事还有更多。但这将留到以后的章节。在讨论这个层级问题之前，我们必须涵盖更多内容。


    ### 1.2.1. 在开始之前


    在我们引入代码之前，有几个问题需要我们涵盖。每个人的系统都是不同的，每个人都有自己的节奏。（注：原文此处存在大量重复性文本，已按要求进行逻辑处理）。


    '
