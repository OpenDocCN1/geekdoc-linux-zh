    \ what we need to do is to write our own function to implement it (usually by\
    \ adding a bit of our code, and calling the original function) and change the\
    \ pointer at sys_call_table to our function. Because we might be removed later\
    \ and we don't want to lose the system in an unstable state, it's important for\
    \ cleanup_module to restore to its original state.\n\nThe source code here is\
    \ an example of such a kernel module. We want to 'spy' on a certain user, and\
    \ print a message whenever that user opens a file. To this end, we replace the\
    \ system call to open a file with our own, called our_sys_open. This function\
    \ checks the uid of the current process, and if it is equal to the uid we spy\
    \ on, it prints to display the name of the file to be opened. Then, either way,\
    \ it calls the original function with the same parameters to actually open the\
    \ file.\n\n# The Linux Kernel Module Programming Guide\n\nThe init_module function\
    \ replaces the location in sys_call_table and keeps the original pointer in a\
    \ variable. The cleanup_module function uses variable to restore everything back\
