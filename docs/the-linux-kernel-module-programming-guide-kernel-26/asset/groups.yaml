  - "[PAGE 10]\n\n# The Linux Kernel Module Programming Guide\n\nand __module_exit()\
    \ macros. These macros are defined in linux/init.h. The only caveat is that init\
    \ and cleanup functions must be defined before calling the macros, otherwise you'll\
    \ get compilation errors.\nHere's an example of this technique:\n\n# Example 2-3.\
    \ hello-2.c\n\n```\n/*\n* hello-2.c Demonstrating the module_init() and module_exit()\
    \ macros.\n* This is preferred over using init_module() and cleanup_module().\n\
    \ */\n#include <linux/module.h>    /* Needed by all modules */\n#include <linux/kernel.h>\
    \    /* Needed for KERN_INFO */\n#include <linux/init.h>       /* Needed for the\
    \ macros */\nstatic int __init_hello_2_init(void)\n{\n    printk(KERN_INFO \"\
    Hello, world 2\\n\");\n    return 0;\n}\nstatic void __exit_hello_2_exit(void)\n\
    {\n    printk(KERN_INFO \"Goodbye, world 2\\n\");\n}\n```\n\nmodule_init(hello_2_init);\n\
    module_exit(hello_2_exit);\nSo now we have two kernel modules under our belt.\
    \ Adding another module is as simple as this:\n\n# Example 2-4. Makefile for our\
    \ modules\n\n```\nobj-m += hello-1.0\nobj-m += hello-2.0\n```\n\n```\nall:\n\t\
    -make -C /lib/modules/$(shell uname -r)/build M=$(PWD) clean\n\nclean:\n\t-make\
    \ -C /lib/modules/$(shell uname -r)/build M=$(PWD) clean\n```\n\nNow have a look\
    \ at linux/drivers/char/Makefile for a real world example. As you can see, some\
    \ things get hardened into the kernel (obj-y) but there are also obj-m modules.\
    \ Those with familiar scripts will easily be able to spot them. For the not, obj-CONFIG_FOO\
    \ shows you everywhere expand to obj-y or obj-m, depending on whether CONFIG_FOO\
    \ variable has been set to y or m. When we are at it, these exactly the kind of\
    \ variables that you have set in the linux/.config file, the last time you use\
