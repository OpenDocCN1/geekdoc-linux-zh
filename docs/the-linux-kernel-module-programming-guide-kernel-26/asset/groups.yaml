- md: "\n# The Linux Kernel Module Programming Guide\n\nWhile you have seen lots of\
    \ stuff that can be used to aid debugging here, there are some things to be aware\
    \ of. Debugging is almost always intrusive. Adding debug code can change the situation\
    \ enough to make the bug seem to disappear. Thus you should try to keep debug\
    \ code to a minimum and make sure it does not show up in production code.\n\n\
    ## Chapter 11. Scheduling Tasks\n\n### 11.1. Scheduling Tasks\n\nVery often, we\
    \ have \"housekeeping\" tasks which have to be done at a certain time, or so often.\
    \ If the task is to be done by a process, we do it by putting it in the crontab\
    \ file. If the task is to be done by a kernel module, we have two possibilities.\
    \ The first is to put a process in the crontab file which will wake up the module\
    \ by a system call when necessary, for example by opening a file. This is terribly\
    \ inefficient, however—we run a new process of crontab, read a new executable\
    \ to memory, and all this to wake up a kernel module which is in memory away.\n\
    \nInstead of doing that, we can create a function that will be called once for\
    \ every timer interrupt. The way we do this is to create a task, held in a queue_struct,\
    \ which will hold a pointer to the function. Then, we use queue_delayed_work to\
    \ put that task on a list called my_workqueue, which is the list of tasks to be\
    \ executed on the next timer interrupt. Because we want the function to keep being\
    \ executed, we need to put it back on my_workqueue when called, for the next timer\
    \ interrupt.\n\nThere's one more we need to remember here. When a module is removed\
    \ by rmmod, its first reference count is checked. If it is zero, module_cleanup\
    \ is called. Then, the module is removed from memory with all its functions. Things\
    \ need to be shut down properly, or bad things will happen. See the code below\
    \ how this can be in a safe way.\n\nExample 11-1. sched.c\n\n```c\n* sched.c -\
    \ schedule a function to be called on every timer interrupt.\n* Copyright (2001)\
    \ by Peter Jay Salzman\n*/\n* The necessary header files\n*/\n\n* Standard in\
    \ kernel modules\n#include <linux/kernel.h>\n#include <linux/module.h>\n#include\
    \ <linux/proc_fs.h>\n#include <linux/workqueue.h>\n#include <linux/sched.h>\n\
    #include <linux/init.h>\n#include <linux/interrupt.h>\n/* We're doing kernel work\
    \ */\n/* Specifically, a module */\n/* Necessary because we use the proc fs */\n\
    /* We schedule tasks here */\n/* We need to put ourselves to sleep\n wake up later\
    \ */\n/* For init and -exit */\n/* For irqreturn_ */\n\nstruct proc_dir_entry\
    \ *Our_Proc_File;\n#define PROC_FILENAME \"sched\"\n#define MY_WORK_QUEUE_NAME\
    \ \"Wqsched.c\"\n\n/* The number of times the timer interrupt has been called\
    \ so far\n*/\nstatic int TimerIntrpt = 0;\n```\n\n```c\nstatic void intrpt_routine(void\
    \ *);\nstatic int die = 0;              /* set to 1 for shutdown */\n/*\n* The\
    \ workqueue structure for this task, from workqueue.h\n */\nstatic struct workqueue_struct\
    \ *my_workqueue;\nstatic struct work_struct Task;\nstatic DECLARE_WORK(Task, intrpt_routine,\
    \ NULL);\n\n/*\n* This function will be called on every interrupt. Notice the\
    \ void *\n* task functions can be used for more than one purpose, each time\n\
    * getting a different parameter.\n */\nstatic void intrpt_routine(void *irrelevant)\n\
    {\n    /*\n    Increment the counter\n    */\n    TimerIntrpt++;\n\n    /*\n \
    \   If cleanup wants us to die\n    */\n    if (die == 0)\n        queue_delayed_work(my_workqueue,\
    \ &Task, 100);\n}\n/*\n* Put data into the proc fs file.\n */\nssize_t\nprocfile_read(char\
    \ *buffer,\n               char **buffer,\n               off_t offset, int buffer_length,\
    \ int *eof, void *data)\n{\n    int len;                      /* The number of\
    \ bytes actually used */\n    /*\n    * It's static so it will still be in memory\n\
    \    * when we leave this function\n    */\n    static char my_buffer[80];\n\n\
    \    /*\n    * give all of our information in one go, so if anybody asks us\n\
    \    * if we have more information the answer should always be no.\n    */\n \
    \   if (offset > 0)\n        return 0;\n\n    /*\n    * Fill the buffer and get\
    \ its length\n    */\n    len = sprintf(my_buffer, \"Timer called %d times so\
    \ far\\n\", TimerIntrpt);\n\n    /*\n    * Tell the function which uses where\
    \ the buffer is\n    */\n```\n\n```c\n/*\n*buffer_location = my_buffer;\n\n/*\n\
    * Return the length\n */\nreturn len;\n}\n```\n\n```c\n/*\n* Initialize the module\
    \ - register the proc file\n */\nint __init_module_()\n```\n\n```c\n/*\n* Create\
    \ /proc file\n */\nOur_Proc_File = create_proc_entry(PROC_FILENAME);\n\nif (Our_Proc_File\
    \ == NULL) {\n    return -ENOMEM;\n}\n\nmy_workqueue = create_delayed_workqueue(MY_WORK_QUEUE_NAME);\n\
    queue_delayed_work(my_workqueue, &Task, 100);\n\nreturn 0;\n}\n```\n\n```c\n/*\n\
    * Cleanup the module\n */\nvoid __exit_module_()\n{\n    remove_proc_entry(Our_Proc_File);\n\
    \    cancel_delayed_work(my_workqueue, &Task);\n    destroy_workqueue(my_workqueue);\n\
    }\n```\n\n# The Linux Kernel Module Programming Guide\n\n## 12. Interrupts\n\n\
    ### 12.1. Handlers\n\nWhen the CPU receives an interrupt, it stops whatever it's\
    \ doing (unless a more important interrupt occurs, in which case it will deal\
    \ with this later), saves certain parameters on the stack and calls the interrupt\
    \ handler. This means that certain things are not allowed in the interrupt handler,\
    \ because the system is in an unknown state. The solution is for the interrupt\
    \ handler to do what needs to be done immediately, usually reading from the hardware\
    \ or sending something to the hardware, and\n\nprintk(KERN_ALERT, \"Error: Could\
    \ not create proc entry\\n\");\n    return -ENOMEM;\n}\n```\n\n```c\n/*\n* The\
    \ number of times the timer interrupt has been called so far\n*/\nstatic int TimerIntrpt\
    \ = 0;\n```\n\n```c\n/*\n* The workqueue structure for this task, from workqueue.h\n\
    \ */\nstatic struct workqueue_struct *my_workqueue;\nstatic struct work_struct\
    \ Task;\nstatic DECLARE_WORK(Task, intrpt_routine, NULL);\n```\n\n```c\n/*\n*\
    \ This function will be called on every interrupt. Notice the void *\n* task functions\
    \ can be used for more than one purpose, each time\n* getting a different parameter.\n\
    \ */\nstatic void intrpt_routine(void *irrelevant)\n{\n    /*\n    Increment the\
    \ counter\n    */\n    TimerIntrpt++;\n```\n\n```c\n/*\n* Put data into the proc\
    \ fs file.\n```c\nssize_t\nprocfile_read(char *buffer,\n               char **buffer,\n\
    \               off_t offset, int buffer_length, int *eof, void *data)\n{\n  \
    \  int len;                      /* The number of bytes actually used */\n   \
    \ /*\n    * It's static so it will still be in memory\n    * when we leave this\
    \ function\n    */\n    static char my_buffer[80];\n\n    /*\n    * give all of\
    \ our information in one go, so if anybody asks us\n    * if we have more information\
    \ the answer should always be no.\n    */\n    if (offset > 0)\n        return\
    \ 0;\n\n    /*\n    * Fill the buffer and get its length\n    */\n    len = sprintf(my_buffer,\
    \ \"Timer called %d times so far\\n\", TimerIntrpt);\n\n    /*\n    * Tell the\
    \ function which uses where the buffer is\n    */\n```c\n/*\n*buffer_location\
    \ = my_buffer;\n\n/*\n* Return the length\n */\nreturn len;\n}\n```\n\n```c\n\
    /*\n* Initialize the module - register the proc file\n */\nint __init_module_()\n\
    ```\n\n```c\n/*\n* Create /proc file\n */\nOur_Proc_File = create_proc_entry(PROC_FILENAME);\n\
    \nif (Our_Proc_File == NULL)\nif (Our_Proc_File == NULL) {\n    return -ENOMEM;\n\
    }\n\nmy_workqueue = create_delayed_workqueue(MY_WORK_QUEUE_NAME);\nqueue_delayed_work(my_workqueue,\
    \ &Task, 100);\n\nreturn 0;\n}\n```\n\n```c\n/*\n* Cleanup the module\n */\nvoid\
    \ __exit_module_()\n{\n    remove_proc_entry(Our_Proc_File);\n    cancel_delayed_work(my_workqueue,\
    \ &Task);\n    destroy_workqueue(my_workqueue);\n}\n```\n\nUnder Linux, interrupts\
    \ are called IRQ (Interrupt Requests). There are two types, short and long. A\
    \ short IRQ is one which is expected to take a short period of time, during which\
    \ the rest of the machine will be blocked and no other interrupts handled. A long\
    \ IRQ is one which can take longer, during which other interrupts may occur (but\
    \ not from the same device). If it is possible, it's better to declare an interrupt\
    \ handler.\n\nThe way to implement this is to call `request_irq()` to get your\
    \ interrupt handler when the relevant IRQ is received. This function returns the\
    \ IRQ number, the name of the function, flags for `/proc/interrupts` and a parameter\
    \ to pass to the interrupt handler. There is a certain number of IRQs available.\
    \ How many IRQs are hardware-dependent? The flags can indicate whether sharing\
    \ with other interrupt handlers (usually because a number of hardware devices\
    \ sit on the same IRQ) and `SA_INTERRUPT` to indicate whether this is a fast interrupt.\n\
    \nThen, from within the interrupt handler, we communicate with the hardware and\
    \ then use `queue_work(mark_BH_IMMEDIATE)` to schedule the bottom half. The kernel\
    \ is guaranteed to call the bottom half as soon as possible — and when it does,\
    \ everything allowed in kernel modules will be allowed.\n\n### 12.1.2. Keyboards\
    \ on the Intel Architecture\n\nThe rest of this is completely Intel specific.\
    \ If you're not running on an Intel platform, it will not work. Don't try to compile\
    \ the code.\n"
  mdcn: "\n\n# Linux 内核模块编程指南\n\n虽然你在这里看到了很多可以辅助调试的工具，但有些事情需要注意。调试几乎总是具有侵入性的。添加调试代码可能会改变现状，导致\
    \ bug 看起来像是消失了一样。因此，你应该尽量将调试代码减少到最少，并确保它们不会出现在生产代码中。\n\n## 第 11 章 任务调度\n\n###\
    \ 11.1. 任务调度\n\n通常，我们有一些必须在特定时间或特定频率执行的“家务”任务（housekeeping）。如果任务由进程执行，我们通过将其放入\
    \ `crontab` 文件来完成。如果任务由内核模块执行，我们有两种可能。第一种是在 `crontab` 文件中放入一个进程，该进程在需要时通过系统调用（例如打开一个文件）来唤醒模块。然而，这种方法极其低效——我们必须运行一个新的\
    \ `crontab` 进程，将一个新的可执行文件读入内存，而这一切仅仅是为了唤醒一个远留在内存中的内核模块。\n\n与其这样做，我们可以创建一个函数，该函数会在每次定时器中断时被调用一次。我们的方法是创建一个在\
    \ `queue_struct` 中的任务，它持有指向该函数的指针。然后，我们使用 `queue_delayed_work` 将该任务放入名为 `my_workqueue`\
    \ 的列表中，该列表是将在下一次定时器中断时执行的任务列表。由于我们希望该函数持续执行，因此在调用时我们需要将其重新放回 `my_workqueue`，以便下一次定时器中断使用。\n\
    \n这里我们还需要记住一点点。当模块被 `rmmod` 移除时，会检查它的第一个引用计数。如果为零，则调用 `module_cleanup`。然后，模块将连同所有函数一起从内存中移除。事物需要正确关闭，否则会发生糟糕的事情。看下面的代码如何安全地实现这一点。\n\
    \n示例 11-1. sched.c\n\n```c\n* sched.c - 调度一个每次定时器中断时调用的函数。\n* 版权所有 (2001) Peter\
    \ Jay Salzman\n*/\n* 必要的头文件\n*/\n\n* 内核模块标准包含\n#include <linux/kernel.h>\n#include\
    \ <linux/module.h>\n#include <linux/proc_fs.h>\n#include <linux/workqueue.h>\n\
    #include <linux/sched.h>\n#include <linux/init.h>\n#include <linux/interrupt.h>\n\
    /* 我们正在进行内核工作 */\n/* 具体地，一个模块 */\n/* 因为我们使用了 proc fs，所以必要的 */\n/* 我们在这里调度任务 */\n\
    /* 我们需要让自己睡眠\n 稍后唤醒 */\n/* 用于 init 和 -exit */\n/* 用于 irqreturn_ */\n\nstruct proc_dir_entry\
    \ *Our_Proc_File;\n#define PROC_FILENAME \"sched\"\n#define MY_WORK_QUEUE_NAME\
    \ \"Wqsched.c\"\n\n/* 到目前定时器中断被调用的次数\n*/\nstatic int TimerIntrpt = 0;\n```\n\n\
    ```c\nstatic void intrpt_routine(void *);\nstatic int die = 0;              /*\
    \ 设置为 1 表示关闭 */\n/*\n* 此任务的 work队列结构，来自 workqueue.h\n */\nstatic struct workqueue_struct\
    \ *my_workqueue;\nstatic struct work_struct Task;\nstatic DECLARE_WORK(Task, intrpt_routine,\
    \ NULL);\n\n/*\n* 此函数会在每次中断时被调用。注意 void *\n* 任务函数可以用于多个目的，每次\n* 获得一个不同的参数。\n */\n\
    static void intrpt_routine(void *irrelevant)\n{\n    /*\n    增加计数器\n    */\n \
    \   TimerIntrpt++;\n\n    /*\n    如果清理程序想要我们死\n    */\n    if (die == 0)\n   \
    \     queue_delayed_work(my_workqueue, &Task, 100);\n}\n/*\n* 将数据放入 proc fs 文件。\n\
    \ */\nssize_t\nprocfile_read(char *buffer,\n               char **buffer,\n  \
    \             off_t offset, int buffer_length, int *eof, void *data)\n{\n    int\
    \ len;                      /* 实际使用的字节数 */\n    /*\n    * 它是静态的，所以当我们离开此函数时\n\
    \    * 它仍然留在内存中\n    */\n    static char my_buffer[80];\n\n    /*\n    * 一次给出我们所有的信息，所以如果有人问我们\n\
    \    * 是否有更多信息，答案应该总是否。\n    */\n    if (offset > 0)\n        return 0;\n\n  \
    \  /*\n    * 填充缓冲区并获取其长度\n    */\n    len = sprintf(my_buffer, \"Timer called\
    \ %d times so far\\n\", TimerIntrpt);\n\n    /*\n    * 告诉函数缓冲区在哪里\n    */\n```\n\
    \n```c\n/*\n*buffer_location = my_buffer;\n\n/*\n* 返回长度\n */\nreturn len;\n}\n\
    ```\n\n```c\n/*\n* 初始化模块 - 注册 proc 文件\n */\nint __init_module_()\n```\n\n```c\n\
    /*\n* 创建 /proc 文件\n */\nOur_Proc_File = create_proc_entry(PROC_FILENAME);\n\n\
    if (Our_Proc_File == NULL) {\n    return -ENOMEM;\n}\n\nmy_workqueue = create_delayed_workqueue(MY_WORK_QUEUE_NAME);\n\
