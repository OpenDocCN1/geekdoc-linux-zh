    \n```c\nstruct file_operations fops = {\n  .read = device_read,\n  .write = device_write,\n\
    \  .open = device_open,\n  .release = device_release\n};\n```\n\nHowever, there's\
    \ also a C99 way of assigning elements to a structure, this is definitely preferred\
    \ over the GNU extension. The version of gcc we used when writing this, 2.95,\
    \ is the new C99 syntax. You should use this syntax in case someone wants to port\
    \ your driver. It will help with compatibility:\n\n```c\nstruct file_operations\
    \ fops = {\n  .read = device_read,\n  .write = device_write,\n  .open = device_open,\n\
    \  .release = device_release\n};\n```\n\nThe meaning is, and you should be aware\
    \ that any member of the structure which you don't explicitly assign will be initialized\
    \ to NULL by gcc.\n\nAn instance of struct file_operations containing pointers\
    \ to functions that are used to implement read, write, open, ... syscalls are\
    \ commonly known as fops.\n\n### 4.1.2. The file structure\n\nEach device is represented\
