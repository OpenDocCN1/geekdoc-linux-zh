    \ struct destroy *, int datasync);\n    int (*aio_fsync) (struct ki_ack *, int\
    \ datasync);\n    int (*fasync) (struct file *, int, struct file_lock *);\n  \
    \  int (*lock) (struct file *, const struct file_lock *);\n    ssize_t(*readv)\
    \ (struct file *, const struct iovec *, unsigned long, loff_t);\n    ssize_t(*writev)\
    \ (struct file *, struct iovec *, unsigned long, loff_t);\n    ssize_t(*sendfile)\
    \ (struct file *, loff_t, size_t, read_actor_t, __user *);\n    ssize_t(*sendpage)\
    \ (struct file *, struct page *, int_t, loff_t, int);\n    unsigned long (*get_unmapped_area)\
    \ (struct file *, unsigned long, unsigned long, unsigned long);\n};\n```\n\nSome\
    \ operations are not implemented by a driver. For example, a driver that handles\
