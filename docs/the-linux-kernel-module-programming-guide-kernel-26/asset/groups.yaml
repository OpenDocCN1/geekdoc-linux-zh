    # The Linux Kernel Module Programming Guide


    program making, which call is made, what arguments are what it returns. It''s
    an invaluable tool for figuring out things like files a program is trying to access.
    Towards the end, you''ll see a line that looks like write(1, "hello", 5). There
    is the face before the printf(). You may not be familiar with it, since most people
    use library functions for free (like open, fopen, fclose). It is that''s the case,
    making at least 2 writes. The 2nd section is devoted to system calls (like kill()
    and read()). The 3rd section is devoted to library calls, which you would probably
    be more familiar with (like cosh() and random()).


    You can write modules to replace the kernel''s system calls, which we will shortly.
    Crackers make use of this for backdoors or trojans, but you can write your own
    modules to do more benign things, like the kernel tee, that ticks every time someone
    tries to delete a file on your system.


    ## 3.1.3. User Space and Kernel Space


    A kernel has all access to resources, whether the resource in question happens
    to be a video card, a hard drive or even memory. Programs often compete for the
    same resource. As I just saw this, updatedb updating the locate database. My vision
    and updatedb are both using the hard drive connectivity. The kernel needs to keep
    things orderly, and not give users access to whatever they feel like. For this,
    CPU can run in different modes. Each mode has a different level of freedom to
    what you want on the system. The Intel x86 architecture has 4 of these modes,
    which are called rings. Unix uses two rings; the highest (ring 0, also known as
    ''supervisor mode'' where everything is allowed to happen) and the lowest, which
    is called ''user mode''.


    Recall the discussion about library functions vs system calls. Typically, you
    use a library function in user mode. The library function calls one or more system
    calls, and these system calls execute on the library function''s behavior, but
    do so in supervisor mode since they are part of the kernel itself. Once the system
    call completes its task, return execution gets transferred back to user mode.


    ## 3.1.4. Name Space


    When you write a small C program, you use variables which are convenient and make
    sense to the reader. On the other hand, your writing routines will be part of
    a bigger problem, global variables you have part of other people'' global variables;
    some of the variable names clash. When program has lots of global variables not
    meaningful enough to be distinguished, you get namespace pollution. In large projects,
    effort must be made to remember reserved names, and to find ways to develop a
    scheme for unique variable names and symbols.


    When writing kernel code, the smallest module will be linked to the entire kernel,
    so this is definitely an issue. The best way to deal with this is to declare your
    variables as static and use a well-defined prefix for them. By convention, all
    prefixes are lowercase. If you don''t want to declare everything as static, another
    option is to declare a symbol table and register it with the kernel. We''ll get
    to this later.


    The file /proc/kallsyms holds all the symbols that the kernel knows about and
    are therefore accessible to your modules since they share the kernel''s codespace.


    ## 3.1.5. Code space


    Memory management is a very complicated subject—the majority of O''Reilly''s Understanding
    The Linux Kernel is just on memory management! We''re not setting out to be experts
    on memory management, but we need to know a couple of factors to even begin worrying
    about writing modules.


    If you have thought about what a segfault really means, you might be surprised
    by how pointers actually point to memory locations. Not real ones, anyway. When
    a process is created, the kernel sets aside portion of physical memory and hands
    it to the process for its executing code, variables, stack, heap and other things
    a computer scientist would know about [5]. This memory begins with 0x0000000 and
    extends up to whatever it needs to be. 0xffff978 would be accessing a different
    location in real physical memory! The processes would be accessing an index named
    0xffff978 which points to some kind of offset into the region of memory set aside
    that particular process. For the most part, a process like our Hello, World program
    can access the space of another process, although there are ways we''ll talk about
    later.


    The kernel has its own space of memory. Since a module can be dynamically inserted
    and removed from the kernel (as a autonomous object), the kernel''s codespace
    differs from its own. Therefore, if you modify the kernel data because of an off-by-one
    error, the kernel faults. This is even worse than it sounds, so best is to be
    careful. I would like to point out that the above is true for any operating system
    which uses a monolithic kernel. There are microkernels which get their own codebase.
    Hurd and QNX Neutrino are two examples of microkernel.


    ## 3.1.6. Device Drivers


    One class of module is the device driver, which provides functionality for hardware
    like a card or serial port. On Unix, each piece of hardware is represented by
    a file located in /dev which provides the means to communicate with the hardware.
    The device driver may connect the /dev/sound device file to a user program like
    mpblaster can use it without knowing what kind of sound card is installed.


    ## 3.1.6.1. Major and Minor Numbers


    Let''s look at some device files. Here are device files which represent the partitions
    of the primary hard drive:


    ```

    ls -l /dev/hda*

    br-rw---- 1 root disk 3, 1 Jul 5 2000 /dev/hda1

    br-rw---- 1 root disk 3, 2 Jul 5 2000 /dev/hda2

    br-rw---- 1 root disk 3, 3 Jul 5 2000 /dev/hda3

    ```


    Notice the column of numbers separated by comma? The first number is called the
    major number. The second number is the minor number. The major number tells you
    which driver is used to access the hardware. Each driver is assigned a unique
    major number; all device files with the same major number are controlled by the
    same driver. The minor number is used to distinguish between various hardware.
    Returning to the example above, although all three devices are handled by same
    driver they have unique minor numbers because the driver sees them as different
    pieces of hardware.


    Devices are divided into two types: character devices and block devices. The difference
    is that block devices have a buffer for requests, so they can choose the order
    in which to respond to requests. This is important in the case of storage devices,
    where it''s faster to read or write sectors which are close to each other, than
    those further apart. Another difference is that block devices can only accept
    and return output in blocks (whose size varies according to the device), whereas
    character devices are allowed to use as many or few bytes as they like. Most devices
    in the world are character, because they don''t need this buffering and don''t
    operate with a fixed block size. You can tell whether a device file is a block
    device or a character device by looking at the first character in the output of
    -l. If it''s ''b'' then it''s a block device and ''c'' then a character device.
    Here are some character devices (the serial ports):


    ```

    crw-rw---- 1 root dial 64 Feb 18 23:34 /dev/tty0

    crw-r--r-- 1 root dial 65 Nov 17 10:26 /dev/tty1

    crw-rw---- 1 root dial 66 Jul  5 2000 /dev/tty2

    crw-rw---- 1 root dial 67 Jul  5 2000 /dev/tty3

    ```


    If you want to see which minor numbers have been assigned, you can look at `/usr/src/linux/documentation/devices.txt`.


    When the system is installed, all of those device files were created by the mknod
    command. To create a new device name with minor number 1 and 2, do mknod /dev/c
    12 2. You do not have to put your device files into /dev/, but by convention.
    Linux puts its device files in /dev, but it''s done by you. When creating a device
    file for testing purposes, it''s probably OK to place it in your working directory
    where you compile the kernel module. Just should be put in the right place when
    you''re writing the device driver.


    I would like to make a few points which are implicit from the above discussion,
    but I''d like to make them explicit in case. When a device file is accessed, the
    kernel uses the major number of the file to determine which driver should be used
    to handle the access. This means that the kernel doesn''t really need to use or
    know about the minor number. The driver itself is the only one that cares about
    the major number. It uses the minor number to distinguish between different pieces
    of hardware. By the way, I say ''hardware'', I mean a bit more than just a PCI
    card that you can hold in your hand. Look at these two examples:


    ```

    $ ls -l /dev/fd0 /dev/fd01680

    brw-rw---- 1 root floppy 2, 0 Jul 2000 /dev/fd0

    brw-rw---- 1 root floppy 2, 44 Jul 2000 /dev/fd01680

    ```


    Now you can look at these two device files and know that they are block devices
    and are handled by same driver (block major 2).

