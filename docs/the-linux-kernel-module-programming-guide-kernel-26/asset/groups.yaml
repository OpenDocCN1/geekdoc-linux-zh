  - "[PAGE 11]\n\n# The Linux Kernel Module Programming Guide\n\nThere is also __initdata\
    \ which works similarly to __init for init variables rather than functions.\n\n\
    The __exit macro causes the omission of the function when the module is built\
    \ into the kernel, and like __exit, has no effect for loadable modules. Again,\
    \ if you consider the cleanup function runs, this makes complete sense: built-in\
    \ drivers do not need a cleanup function, while loadable modules.\n\nThese macros\
    \ are defined in linux/init.h and serve to free up kernel memory. When you boot\
    \ your kernel and see something like Freeing unused kernel memory: 236k freed,\
    \ this is precisely what is freeing.\n\n# Example 2-5. hello-3c\n\n```\n/*\n*\
    \ hello-3.c - Illustrating the __init, __initdata and __exit macros.\n */\n#include\
    \ <linux/module.h>    /* Needed by all modules */\n#include <linux/kernel.h> \
    \  /* Needed for KERN_INFO */\n#include <linux/init.h>      /* Needed for the\
    \ macros */\n\nstatic int hello_3_data __initdata = 3;\nstatic int __init hello_3_init(void)\n\
    {\n    printk(KERN_INFO, \"Hello, world %%d\\n\", hello_3_data);\n    return 0;\n\
    }\n\nstatic void __exit hello_3_exit(void)\n{\n    printk(KERN_INFO, \"Goodbye,\
    \ world 3\\n\");\n}\n```\n\n# 2.5. Hello World (part 4): Licensing and Module\
    \ Documentation\n\nIf you're running kernel 2.4 or later, you might have noticed\
    \ something like this when you loaded proprietary modules:\n\n```\n# insmod xxxxx.o\n\
    Warning: loading xxxxx.ko will taint the kernel: no license\nSee http://www.tux.org/linux/lml/#export-tainted\
    \ for information about tainted modules\nModule xxxxx loaded, with warnings\n\
    ```\n\nIn kernel 2.4 and later, a mechanism was devised to identify code for the\
    \ GPL (and friends) so people can be warned that the code is not open-source.\
    \ This is accomplished by the MODULE_LICENSE () macro which is demonstrated in\
    \ the next piece of code. By setting the license to GPL, you can keep the warning\
    \ from being printed. This license mechanism is defined and documented in linux/module.h:\n\
    \n+   * The following license idents are currently accepted as indicating free\n\
    \nChapter 2. Hello World"
- md: "\n# The Linux Kernel Module Programming Guide\n\n- software modules\n- \"GPL\"\
    \ [GNU Public License v2 or later]\n- \"GPL v2\" [GNU Public License v2]\n- \"\
    GPL and additional rights\" [GNU Public License v2 rights and more]\n- \"Dual\
    \ BSD/GPL\" [GNU Public License v2 or BSD License choice]\n- \"Dual MIT/GPL\"\
    \ [GNU Public License v2 or MIT license choice]\n- \"Dual MPL/GPL\" [GNU Public\
    \ License v2 or Mozilla License choice]\n\n- The following other identifies are\
    \ available\n    - \"Proprietary\" [Non free products]\n- There are dual licensed\
    \ components, but when running with Linux it is the GPL that is relevant so this\
    \ is a non issue. Similarly LGPL linked with GPL is a GPL combined work.\n\n-\
    \ This exists for several reasons\n    - 1. So modinfo can show license info for\
    \ users wanting to verify their setup free\n    - 2. So community can ignore bug\
    \ reports including proprietary modules\n    - 3. So vendors may likewise behave\
    \ on their own policies\n\nSimilarly, MODULE_DESCRIPTION() is used to describe\
    \ what the module does, MODULE_AUTHOR() declares the module's author, and MODULE_SUPPORTED_DEVICE()\
    \ declares what types of devices the module supports.\n\nThese macros are all\
    \ defined in linux/module.h and are by the kernel itself. They're simple for documentation\
    \ and can be viewed by a tool like admire. As an exercise, to read reader, try\
    \ and see how these macros use linux/drivers to document their modules.\n\nI'd\
    \ recommend to use grep -in MODULE_AUTHOR * in /usr/src/linux-2.6.x/. People unfamiliar\
    \ with command line tools will probably like some web base solution, search for\
    \ sites that kernel trees got indexed with LXR (or set it up on your local machine).\n\
    \nUsers of traditional editors, like emacs or vi will also find tag files useful.\
    \ They can be generated by make tags or tags in /usr/src/linux-2.6.x/. Once you've\
    \ got a tagfile in your kerneltree you can put the cursor on function call and\
    \ use some key combination to directly jump to the definition function.\n\n# Example\
    \ 2-6. hello-4.c\n\n```c\n/*\n* hello-4.c - Demonstrates module documentation.\n\
    \ */\n#include <linux/module.h> /* Needed for all modules *\n#include <linux/kernel.h>\
    \ /* Needed for KERN_INFO *\n#include <linux/init.h> /* Needed for the macros\
    \ *\n#define DRIVER_AUTHOR \"Peter Jayman <p@dirac.org>\"\n#define DRIVER_DESC\
    \ \"A sample driver\"\n\nstatic int __init init_hello_4(void)\n{\n    printk(KERN_INFO\
    \ \"Hello, world 4\\n\");\n    return 0;\n}\nstatic void __exit cleanup_hello_4(void)\n\
    {\n    printk(KERN_INFO \"Goodbye, world 4\\n\");\n}\nmodule_init(init_hello_4);\n\
    module_exit(cleanup_hello_4);\n```\n\n```c\n/*\n * You can use strings, like this:\n\
    \ * Get rid of taint message by declaring code as GPL\n */\nMODULE_LICENSE(\"\
    GPL\");\n\n/*\n * Or definitions, like this:\n */\nMODULE_AUTHOR(DRIVER_AUTHOR);\
    \ /* Who wrote this module? */\nMODULE_DESCRIPTION(DRIVER_DESC); /* What does\
    \ this module do? */\n\n/*\n * This module uses /dev/testdevice. The MODULE_SUPPORTED_DEVICE\
    \ might\n * be used in the future to help automatic configuration of modules,\
    \ but is\n * currently unused other than for documentation purposes.\n */\nMODULE_SUPPORT_DEVICE(\"\
    testdevice\");\n```\n\n# 2.6. Passing Command Line Arguments to a Module\n\nModules\
    \ can take command line arguments, but not with the argc/argv you might be used\
    \ to.\n\nTo allow arguments to be passed to your module, declare the variables\
    \ that will take the values of the command line arguments as global and use the\
    \ module_param() macro (defined in linux/moduleparam.h) to set the mechanism.\
    \ At runtime, insmod will fill the variables with any command line arguments that\
    \ are given, like /insmod mymodule.ko variable=5. The declarations and macros\
    \ should be placed at the beginning of the module for clarity. The example code\
    \ should clear up my somewhat loose explanation.\n\nThe module_param() macro takes\
    \ 3 arguments: the name of the variable, its type and permissions for the corresponding\
    \ file in sysfs. Integer types can be signaled as signed or unsigned. If you'd\
    \ like to use arrays of integers or strings use module_param_array() and module_param_string().\n\
    \n```c\nint myint = 3;\nmodule_param(myint, int, 0);\n```\n\nArrays are supported,\
    \ but things are a bit different now than they were in the 2.4 days. To keep track\
    \ of the number of parameters you need to pass a pointer to a count variable as\
    \ third parameter. At your option, you could also ignore the count and pass NULL\
    \ instead. We show both possibilities here:\n\n```c\nint myintarray[2];\nmodule_param_array(myintarray,\
    \ int, NULL, 0); /* not interested in count */\nint myshortarray[4];\nint count;\n\
    module_param_array(myshortarray, short, &count, 0); /* put count into \"count\"\
    \ variable */\n```\n\nA good use for this is to have the module's default values\
    \ set, like a port or IO address. If the module's default values are set, the\
    \ module_param() macro is used to document the variable. Otherwise, keep the value\
    \ clear. Lastly, the module_param() macro is used to document the variable. The\
    \ module_param() macro is used to document the variable.\n\n# Example 2-7. hello-5.c\n\
    \n```c\n/*\n * hello-5.c - Demonstrates command line argument passing\n */\n#include\
    \ <linux/module.h>\n#include <linux/moduleparam.h>\n#include <linux/kernel.h>\n\
    #include <linux/init.h>\n#include <linux/fs.h>\n\nMODULE_LICENSE(\"GPL\")\nMODULE_AUTHOR(\"\
    Peter Jayman <p@dirac.org>\")\nMODULE_DESCRIPTION(\"A sample driver\")\n\nint\
    \ myint = 3;\nmodule_param(myint, int, 0);\n\nint myintarray[2];\nmodule_param_array(myintarray,\
    \ int, NULL, 0);\nint myshortarray[4];\nint count;\nmodule_param_array(myshortarray,\
    \ short, &count, 0);\n\nstatic int __init init_hello_5(void)\n{\n    int i;\n\
    \    printk(KERN_INFO \"myint = %d\\n\", myint);\n    printk(KERN_INFO \"myintarray[0]\
    \ = %d\\n\", myintarray[0]);\n    printk(KERN_INFO \"myintarray[1] = %d\\n\",\
    \ myintarray[1]);\n    printk(KERN_INFO \"myshortarray[0] = %d\\n\", myshortarray[0]);\n\
    \    printk(KERN_INFO \"myshortarray[1] = %d\\n\", myshortarray[1]);\n    printk(KERN_INFO\
    \ \"myshortarray[2] = %d\\n\", myshortarray[2]);\n    printk(KERN_INFO \"myshortarray[3]\
    \ = %d\\n\", myshortarray[3]);\n    printk(KERN_INFO \"count = %d\\n\", count);\n\
    \    return 0;\n}\nstatic void __exit cleanup_hello_5(void)\n{\n    printk(KERN_INFO\
    \ \"Goodbye, world 5\\n\");\n}\n\nmodule_init(init_hello_5);\nmodule_exit(cleanup_hello_5);\n\
    ```\n\nI would recommend playing around this code:\n\n```bash\nsatan# insmod hello-5.ko\
    \ myint=10\nmyint = 10\n\nsatan# insmod hello-5.ko myintarray=10,20\nmyintarray[0]\
    \ = 10\nmyintarray[1] = 20\n\nsatan# insmod hello-5.ko myshortarray=1,2,3,4\n\
    myshortarray[0] = 1\nmyshortarray[1] = 2\nmyshortarray[2] = 3\nmyshortarray[3]\
    \ = 4\ncount = 4\n```\n\n# 2.7 Modules Spanning Multiple Files\n\nSometimes it\
    \ makes sense to divide a kernel module between several source files.\n"
  mdcn: "\n\n# Linux 内核模块编程指南\n\n- 软件模块\n- \"GPL\" [GNU 公共许可证 v2 或更高版本]\n- \"GPL v2\"\
    \ [GNU 公共许可证 v2]\n- \"GPL 及额外权利\" [GNU 公共许可证 v2 权利及更多]\n- \"双 BSD/GPL\" [GNU 公共许可证\
    \ v2 或 BSD 许可证可选]\n- \"双 MIT/GPL\" [GNU 公共许可证 v2 或 MIT 许可证可选]\n- \"双 MPL/GPL\"\
    \ [GNU 公共许可证 v2 或 Mozilla 许可证可选]\n\n- 还有其他标识可用\n    - \"专有\" [非自由产品]\n- 存在双重许可组件，但在\
    \ Linux 上运行时，相关的是 GPL，因此这不是一个问题。同样，与 GPL 关联的 LGPL 是一个 GPL 组合工作。\n\n- 这种存在有几个原因：\n\
    \    - 1. 让 modinfo 可以为想要免费验证其设置的用户显示许可证信息\n    - 2. 让社区可以忽略包含私有模块在内的错误报告\n  \
    \  - 3. 让厂商可以同样根据自己的策略行事\n\n同样，`MODULE_DESCRIPTION()` 用于描述模块的功能，`MODULE_AUTHOR()`\
    \ 声明模块作者，而 `MODULE_SUPPORTED_DEVICE()` 声明模块支持的设备类型。\n\n这些宏都定义在 `linux/module.h`\
    \ 中，并由内核本身定义。它们对于文档来说非常简单，可以通过像 `admire` 这样的工具查看。作为一个练习，读者们，请尝试查看这些宏如何使用 `linux/drivers`\
    \ 来记录它们的模块。\n\n我建议在 `/usr/src/linux-2.6.x/` 中使用 `grep -in MODULE_AUTHOR *`。不熟悉命令行工具的用户可能更喜欢基于\
    \ Web 的解决方案，搜索内核树已被 LXR 索引的站点（或在你的本地机器上设置它）。\n\n使用 emacs 或 vi 等传统编辑器的用户也会发现标签文件（tag\
    \ files）有用。它们可以通过 `make tags` 或 `/usr/src/linux-2.6.x/` 中的 `tags` 生成。一旦你在内核树中获得了标签文件，就可以将光标放在函数调用上，并使用某些组合键直接跳转到定义函数。\n\
    \n# 示例 2-6. hello-4.c\n\n```c\n/*\n* hello-4.c - 模块文档。\n */\n#include <linux/module.h>\
    \ /* 所有模块都需要 *\n#include <linux/kernel.h> /* KERN_INFO 需要 *\n#include <linux/init.h>\
    \ /* 宏需要 *\n#define DRIVER_AUTHOR \"Peter Jayman <p@dirac.org>\"\n#define DRIVER_DESC\
    \ \"A 示例驱动程序\"\n\nstatic int __init init_hello_4(void)\n{\n    printk(KERN_INFO\
    \ \"Hello, world 4\\n\");\n    return 0;\n}\nstatic void __exit cleanup_hello_4(void)\n\
    {\n    printk(KERN_INFO \"Goodbye, world 4\\n\");\n}\nmodule_init(init_hello_4);\n\
    module_exit(cleanup_hello_4);\n```\n\n```c\n/*\n * 你可以使用字符串，如下所示：\n * 通过将代码声明为\
    \ GPL 来消除污染信息\n */\nMODULE_LICENSE(\"GPL\");\n\n/*\n * 或者使用定义，如下所示：\n */\nMODULE_AUTHOR(DRIVER_AUTHOR);\
    \ /* 谁写了这个模块？ */\nMODULE_DESCRIPTION(DRIVER_DESC); /* 这个模块是做什么的？ */\n\n/*\n *\
    \ 此模块使用 /dev/testdevice。MODULE_SUPPORTED_DEVICE 未来\n * 可能被用于帮助模块的自动配置，但目前除了文档目的\n\
    \ * 之外未使用。\n */\nMODULE_SUPPORT_DEVICE(\"testdevice\");\n```\n\n# 2.6. 向模块传递命令行参数\n\
    \n模块可以接受命令行参数，但不是你可能熟悉的 `argc/argv` 方式。\n\n要允许参数传递给你的模块，请将接收命令行参数值的变量声明为全局，并使用\
    \ `module_param()` 宏（定义在 `linux/moduleparam.h` 中）来设置机制。在运行时，`insmod` 将用给定的命令行参数填充变量，例如\
    \ `/insmod mymodule.ko variable=5`。为了清晰起见，声明和宏应该放在模块的开头。示例代码应该消除我有些松散的解释。\n\n\
    `module_param()` 宏接受 3 个参数：变量名、其类型以及在 sysfs 中对应文件的权限。整数类型可以标记为有符号或无符号。如果你想使用整数或字符串数组，请使用\
    \ `module_param_array()` 和 `module_param_string()`。\n\n```c\nint myint = 3;\n\
    module_param(myint, int, 0);\n```\n\n支持数组，但现在的情况与 2.4 时代有所不同。为了跟踪需要传递的参数数量，你需要将计数变量的指针作为第三参数传递。根据你的选择，你也可以忽略计数并传递\
    \ `NULL`。我们在这里展示了这两种可能性：\n\n```c\nint myintarray[2];\nmodule_param_array(myintarray,\
    \ int, NULL, 0); /* 不关心计数 */\nint myshortarray[4];\nint count;\nmodule_param_array(myshortarray,\
    \ short, &count, 0); /* 将计数放入 \"count\" 变量中 */\n```\n\n这有一个很好的用法是设置模块的默认值，例如端口或\
    \ IO 地址。如果设置了模块的默认值，则使用 `module_param()` 宏来记录变量。否则，保持值清晰。最后，`module_param()` 宏用于记录变量。`module_param()`\
    \ 宏用于记录变量。\n\n# 示例 2-7. hello-5.c\n\n```c\n/*\n * hello-5.c - 演示命令行传递\n */\n#include\
    \ <linux/module.h>\n#include <linux/moduleparam.h>\n#include <linux/kernel.h>\n\
    #include <linux/init.h>\n#include <linux/fs.h>\n\nMODULE_LICENSE(\"GPL\")\nMODULE_AUTHOR(\"\
    Peter Jayman <p@dirac.org>\")\nMODULE_DESCRIPTION(\"A 示例驱动程序\")\n\nint myint =\
    \ 3;\nmodule_param(myint, int, 0);\n\nint myintarray[2];\nmodule_param_array(myintarray,\
    \ int, NULL, 0);\nint myshortarray[4];\nint count;\nmodule_param_array(myshortarray,\
    \ short, &count, 0);\n\nstatic int __init init_hello_5(void)\n{\n    int i;\n\
    \    printk(KERN_INFO \"myint = %d\\n\", myint);\n    printk(KERN_INFO \"myintarray[0]\
    \ = %d\\n\", myintarray[0]);\n    printk(KERN_INFO \"myintarray[1] = %d\\n\",\
    \ myintarray[1]);\n    printk(KERN_INFO \"myshortarray[0] = %d\\n\", myshortarray[0]);\n\
    \    printk(KERN_INFO \"myshortarray[1] = %d\\n\", myshortarray[1]);\n    printk(KERN_INFO\
    \ \"myshortarray[2] = %d\\n\", myshortarray[2]);\n    printk(KERN_INFO \"myshortarray[3]\
    \ = %d\\n\", myshortarray[3]);\n    printk(KERN_INFO \"count = %d\\n\", count);\n\
    \    return 0;\n}\nstatic void __exit cleanup_hello_5(void)\n{\n    printk(KERN_INFO\
    \ \"Goodbye, world 5\\n\");\n}\n\nmodule_init(init_hello_5);\nmodule_exit(cleanup_hello_5);\n\
    ```\n\n我建议尝试一下这段代码：\n\n```bash\nsatan# insmod hello-5.ko myint=10\nmyint = 10\n\
    \nsatan# insmod hello-5.ko myintarray=10,20\nmyintarray[0] = 10\nmyintarray[1]\
    \ = 20\n\nsatan# insmod hello-5.ko myshortarray=1,2,3,4\nmyshortarray[0] = 1\n\
    myshortarray[1] = 2\nmyshortarray[2] = 3\nmyshortarray[3] = 4\ncount = 4\n```\n\
    \n# 2.7 跨越多个文件的模块\n\n有时将一个内核模块划分到多个源文件中是有意义的。\n\n"
