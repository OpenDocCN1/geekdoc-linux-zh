    However, there's also a C99 way of assigning elements to a structure, this is\
    \ definitely preferred over the GNU extension. The version of gcc we used when\
    \ writing this, 2.95, is the new C99 syntax. You should use this syntax in case\
    \ someone wants to port your driver. It will help with compatibility:\n\n```\n\
    struct file_operations fops = {\n  .read = device_read,\n  .write = device_write,\n\
    \  .open = device_open,\n  .release = device_release\n};\n```\n\nThe meaning is,\
    \ and you should be aware that any member of the structure which you don't explicitly\
    \ assign will be initialized to NULL by gcc.\n\nAn instance of struct file_operations\
    \ containing pointers to functions that are used to implement read, write, open,\
    \ ... syscalls are commonly known as fops.\n\n# 4.1.2. The file structure\n\n\
    Each device is represented in the kernel by a file structure, which is defined\
    \ in linux/fs.h. Be aware that a file is a kernel level structure and never appears\
    \ in a user space program. It's not the same as a FILE, which is defined by glibc\
    \ and also, its name is a bit misleading; it represents an open 'file', not a\
    \ file on a disk, which is represented by a structure named inode.\n\nAn instance\
    \ of struct file is commonly known as filp. You'll also see it referred to as\
    \ struct file file. Resist the temptation.\n\nGo ahead and look at the definition\
    \ of file. Most of the entries you see, like struct entry aren't used by drivers,\
    \ and you can ignore them. This is because drivers don't fill file directly; they\
    \ only use structures in file which are created elsewhere.\n\n# 4.1.3. Registering\
    \ A Device\n\nAs discussed earlier, devices are accessed through device files,\
    \ usually located in /dev/[7]. The major number tells you which driver handles\
    \ which file. The minor number is used only by the driver itself to differentiate\
    \ which device it's operating on, just in case driver handles more than one device.\n\
    \nAdding a driver to your system means registering it with the kernel. This is\
    \ synonymous with assigning it a major number during the module's initialization.\
    \ You can do this by using the register_chdev function, defined by linux/fs.h.\n\
    \n```\nint register_chdev(unsigned int major, const char *name, struct file_operations\
    \ *fops);\n```\n\nChapter 4. Character Device Files"
