  mdcn: "\n\n这里目前只是一个占位符。最后，我希望在这里看到一个关于 sysfs 的章节（尚未编写）。如果你熟悉 sysfs 并且想参与该章节的编写，请随时联系我们（LKMPG\
    \ 维护者）以获取更多细节。\n\n## 第 7 章 与设备文件通信\n\n### 7.1. 与设备文件通信（写和 IOCTL）\n\n设备文件本应该代表物理设备。大多数物理设备既用于输出也用于输入，因此内核中的设备驱动程序需要某种机制从进程中获取输出并发送到设备。这是通过打开设备文件进行输出并对其写入来实现的，就像写入文件一样。在接下来的示例中，这通过\
    \ `device_write` 实现。\n\n这还不够的。想象你有一个连接到调制解调器的串口（即使你有内置调制解调器，从 CPU 的角度来看，它仍然被实现为连接到解调器的串口，所以你不需要太费想象力）。自然的做法是使用设备文件向解调器写入内容（命令或要通过电话线发送的数据），并从解调器读取内容（命令的响应或通过电话线接收的数据）。然而，当你需要与串口通信时（例如发送发送和接收数据的速率），这就留下了一个问题。\n\
    \nUnix 的答案是使用一个特有的函数 `ioctl`（Input Output Control，输入输出控制的缩写）。每个设备都有自己的 `ioctl`\
    \ 命令，这些命令可以是读 `ioctl`（从进程向内核发送信息）、写 `ioctl`（向进程返回信息）、两者兼具或二者都不具备。调用 `ioctl` 函数时带有三个参数：适当设备文件的文件描述符、ioctl\
    \ 编号以及一个参数（该参数为 `long` 类型，因此你可以使用 `case` 来传递任何内容）。\n\n`ioctl` 编号编码了设备号、ioctl 类型、命令以及其类型。这个数字通常在头文件中通过宏调用\
    \ `_IO__IOR__OW`（取决于类型）创建。该头文件随后应该被使用 `ioctl` 的程序包含（以便它们可以生成相应的 `ioctl`）以及内核模块包含（以便它能理解它）。在示例中，文件头文件是\
    \ `chardev.h`，使用它的程序是 `ioctl.c`。\n\n如果你想在自己的内核模块中使用 `ioctl`，最好获得一个官方的 `ioctl`\
    \ 分配，否则如果你不小心拿了别人的 `ioctl`，或者他们拿了你的，你就知道出问题了。更多信息请检查内核源码树中的 `Documentation/ioctl-number.txt`。\n\
    \n### 示例 7-1. chardev.c\n\n```c\n/*\n * chardev.c - 创建一个输入/输出字符设备\n */\n\n#include\
