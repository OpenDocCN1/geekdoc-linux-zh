    # Chapter 12. Interrupt Handlers


    # 12.1. Interrupt Handlers


    # 12.1.1. Interrupt Handlers


    Except for the last part, everything we did in the kernel so far we''ve done as
    a response to a process asking for it, either by dealing with a special file,
    sending an `ioctl()`, or issuing a system call. But the job of the kernel isn''t
    just to respond to process requests. Another job, which is very as important,
    is to speak to the hardware connected to the machine.


    There are two types of interaction between the CPU and the rest of the computer''s
    hardware. The first type is when the CPU gives orders to the hardware, or when
    the hardware needs to tell the CPU something. The second, interrupts, is much
    harder to implement because it is both difficult and convenient for the hardware,
    not the CPU. Hardware devices have a very small amount of RAM, and if you don''t
    read their information when available, it is lost.


    Under Linux, hardware interrupts are called IRQ (InterruptReqs). There are two
    types of IRQs, short and long. A short IRQ is one which is expected to take a
    very short period of time, during which the rest of the machine will be blocked
    and no other interrupts be handled. A long IRQ is one which can take longer, and
    during which other interrupts may occur (but not from the same device). If it
    is possible, it''s better to declare an interrupt handler to be.


    When the CPU receives an interrupt, it stops whatever it''s doing (unless a more
    important interrupt, in which case it will deal with this only when the more important
    one is done), saves certain parameters on the stack and calls the interrupt handler.
    This means that certain things are not allowed in the interrupt handler itself,
    because the system is in an unknown state. The solution is for the interrupt handler
    to do what needs to be done immediately, usually reading from the hardware or
    send something to the hardware, and then schedule the handling of the new information
    at a later time (this is called the "bottom half") and return. The kernel is guaranteed
    to call the bottom half as soon as possible — and when it does, everything allowed
    in kernel modules will be allowed.


    The way to implement this is to call `request_irq()` to get your interrupt handler
    when the relevant IRQ is received. This function returns the IRQ number, the name
    of the function, flags for `/proc/interrupts` and a parameter to pass to the interrupt
    handler. There is a certain number of IRQs available. How many IRQs are hardware-dependent?
    The flags can indicate whether sharing with other interrupt handlers (usually
    because a number of hardware devices sit on the same IRQ) and `SA_INTERRUPT` to
    indicate whether this is a fast interrupt. This function will succeed if there
    isn''t a handler on this IRQ, or if you''re willing to share.


    Then, from within the interrupt handler, we communicate with the hardware and
    then use `queue_work(mark_BH_IMMEDIATE)` to schedule the bottom half.


    # 12.1.2. Keyboards on the Intel Architecture


    The rest of this is completely Intel specific. If you''re not running on an Intel
    platform, it will not work. Don''t try to compile the code.'
- md: "\n# The Linux Kernel Module Programming Guide\n\nI had a problem with writing\
    \ the sample code for this chapter. On one hand, for an example to be useful it\
    \ needs to run on everyone's computer with meaningful results. On the other hand,\
    \ the kernel already includes drivers for all the common devices, and those devices\
    \ won't coexist with what I'm going to do. The solution I found was to write something\
    \ for the keyboard interrupt, and disable the regular keyboard interrupt handler.\
    \ Since it is defined as a static symbol in the kernel source files (specifically,\
    \ drivers/char/keyboard.c), there is no way to restore it. Before insmoding this\
    \ code, do on another terminal sleep 120; reboot if you use the file system.\n\
    \nThis code binds itself to IRQ 1, which is the IRQ of the keyboard controlled\
    \ under Intel architectures. When it receives a keyboard interrupt, it reads the\
    \ keyboard's status (the purpose of inb (0x64)) and the scan code, which is the\
    \ value returned by the keyboard. Then, as soon as the kernel thinks it's feasible,\
    \ it runs got_char which gives the code of the key (the first seven bits of the\
    \ scan code) and whether it has pressed (if the 8th bit is zero) or released (if\
    \ it's not).\n\n## Example 12-1. intprtc.c\n\n/**\n * intprtc.c - An interrupt\
    \ handler\n * Copyright (C) 2001 by Peter Jay Salzman\n */\n\n/**\n * The necessary\
    \ header files\n */\n\n```c\n/* Standard in kernel modules\n*/\n#include <linux/kernel.h>\n\
    #include <linux/module.h>\n#include <linux/sched.h>\n#include <linux/workqueue.h>\n\
    #include <linux/interrupt.h>\n#include <linux/io.h>\n\n/* We're doing kernel work\
    \ */\n/* Specifically, a module */\n\n/* We want an interrupt */\n\n#define MY_WORK_QUEUE_NAME\
    \ \"WQsched.c\"\nstatic struct workqueue_struct *my_workqueue;\n```\n\n/**\n *\
    \ This will get called by the kernel as soon as it's safe\n * to do everything\
    \ normally allowed by kernel modules.\n */\n\n```c\nstatic void got_char(void\
    \ *scscode)\n{\n    printk(KERN_INFO \"Scan Code %x %s.\\n\",\n           (int)((char*)scscode)\
    \ & 0x7F,\n           *((char*)scscode) & 0x80 ? \"Released\" : \"Pressed\");\n\
    }\n```\n\n/**\n * This function services keyboard interrupts. It reads the relevant\n\
    \ * information from the keyboard and then puts the non time critical\n * part\
    \ into the work queue. This will be run when the kernel considers it safe.\n */\n\
    \n```c\nirqreturn_t irq_handler(int irq, void *dev_id, struct pt_regs *regs)\n\
    {\n  /*\n   * This variables are static because they need to be\n   * accessible\
    \ (through pointers) to the bottom half routine.\n   */\n  static int initialised\
    \ = 0;\n  static unsigned char scancode;\n  static struct work_struct task;\n\
    \  unsigned char status;\n\n  /*\n   * Read keyboard status\n   */\n  status =\
    \ inb(0x64);\n  scancode = inb(0x60);\n\n  if (initialised == 0) {\n    INIT_WORK(&task,\
    \ got_char, &scancode);\n    initialised = 1;\n  } else {\n    PREPARE_WORK(&task,\
    \ got_char, &scancode);\n  }\n\n  queue_work(my_workqueue, &task);\n\n  return\
    \ IRQ_HANDLED;\n}\n\n/* Initialize the module - register the IRQ handler\n\nint\
    \ init_module() {\n  my_workqueue = create_workqueue(MY_WORK_QUEUE_NAME);\n\n\
    \  /*\n   * Since the keyboard handler won't co-exist with another handler,\n\
    \   * us, we have to disable it (free IRQ) before we do\n   * anything. Since\
    \ we don't know where it is, there's no way to\n   * reinstate it later - so the\
    \ computer will have to be rebooted\n   * when we're done.\n   */\n  free_irq(1,\
    \ NULL);\n\n  /*\n   * Request IRQ 1, the keyboard IRQ, to go to our irq_handler.\n\
    \   * SA_SHIRQ we're meaning to have handlers on this IRQ.\n   * SA_INTERRUPT\
    \ can be used to make the handler into a fast interrupt.\n   */\n  return request_irq(1,\
    \ /* The number of the keyboard IRQ on PCs */\n      irq_handler, /* our handler\
    \ */\n      SA_SHIRQ, \"test_keyboard_irq_handler\",\n      (void *) (irq_handler));\n\
    }\n\n/* Cleanup\nvoid cleanup_module() {\n  /*\n   * This is only for completeness.\
    \ It's totally irrelevant,\n   */\n  /*\n   * we don't have a way to restore the\
    \ normal keyboard interrupt so the\n   * computer is completely useless and has\
    \ to be rebooted.\n   */\n  free_irq(1, NULL);\n}\n/*\n * some work_queue related\
    \ functions are just available to GPL licensed Modules\n */\nMODULE_LICENSE(\"\
    GPL\");\n```\n\n# Chapter 13. Symmetric Multi Processing\n\n## 13.1. Symmetrical\
    \ Multi–Processing\n\nOne of the easiest and cheapest ways to improve hardware\
    \ performance is to put more than one CPU on the board. This can be done either\
    \ making the different CPUs take on different jobs (asymmetrical multi-processing)\
    \ or by making them all in parallel, doing the same job (symmetrical multi-processing,\
    \ a.k.a. SMP). Doing symmetrical multi–processing effectively requires specialized\
    \ knowledge about the tasks the computer should do, which is unavailable in a\
    \ general purpose operating system such as Linux. On the other hand, symmetrical\
    \ multi–processing is relatively easy to implement.\n\nBy relatively easy, I mean\
    \ exactly that: not it's really easy. In a symmetrical multi-processing environment,\
    \ the CPU's share the same memory, and as a result running in one CPU can affect\
    \ the memory used by another. You can no longer be certain that variable you've\
    \ set to a certain value in the previous line still has that value; the other\
    \ CPU might have played with it while you weren't looking. Obviously, it's impossible\
    \ to program like this. (Wait, it's impossible to program like this is an exaggeration,\
    \ but it requires great care).\n\nActually, the main problem with SMP is that\
    \ multiple CPUs can access the same data structures simultaneously. This leads\
    \ to race conditions and other synchronization issues.\n\nConsider the case of\
    \ an interrupt. If an interrupt occurs, it can be caught by any CPU. If two CPUs\
    \ are handling the same interrupt, they might both try to access the same data\
    \ structure, which can lead to corruption. Therefore, we must ensure that only\
    \ one CPU can access the data structure at a time.\n\nThere are several ways to\
    \ achieve synchronization in Linux, including locks, semaphores, and spinlocks.\
    \ A lock is a primitive that allows only one thread to access a resource at a\
    \ time. A semaphore is similar to a lock but it allows a limited number of threads\
    \ to access the resource. A spinlock is a type of lock where the CPU \"spins\"\
    \ until the lock becomes available. This is useful when the lock is held for a\
    \ very short time.\n\nIn this chapter, we will discuss how to use these synchronization\
    \ primitives in an SMP environment. We will also look at some common pitfalls\
    \ and how to avoid them.\n"
  mdcn: "\n\n# Linux 内核模块编程指南\n\n我在编写本章的示例代码时遇到了一个问题。一方面，为了让一个示例有用，它必须在每个人的计算机上运行并产生意义的结果。另一方面，内核已经包含了所有常见设备的驱动程序，而这些设备将无法与我要的操作共存。我找到的解决方案是为键盘中断编写一些代码，并禁用常规键盘中断处理程序。由于它在内核源文件中被定义为静态符号（具体为\
    \ `drivers/char/keyboard.c`），因此无法恢复它。在 `insmod` 这段代码之前，请在另一个终端执行 `sleep 120`；如果你使用了文件系统，请事后重启。\n\
    \n这段代码将自己绑定到 IRQ 1，这是 Intel 架构下键盘受控制的 IRQ。当它接收到键盘中断时，它会读取键盘状态（`inb (0x64)` 的目的）和扫描码（键盘返回的值）。然后，一旦内核认为可行，它就会运行\
    \ `got_char`，该函数会给出按键代码（扫描码的前七位）以及按键是被按下（如果第 8 位为 0）还是释放（如果不是）。\n\n## 示例 12-1.\
    \ intprtc.c\n\n```c\n/**\n * intprtc.c - 一个中断处理程序\n * 版权所有 (C) 2001 Peter Jay\
    \ Salzman\n */\n\n/**\n * 必要的头文件\n */\n\n```c\n/* 内核模块的标准头文件\n*/\n#include <linux/kernel.h>\n\
    #include <linux/module.h>\n#include <linux/sched.h>\n#include <linux/workqueue.h>\n\
    #include <linux/interrupt.h>\n#include <linux/io.h>\n\n/* 我们正在进行内核工作 */\n/* 具体来说，是一个模块\
    \ */\n\n/* 我们想要一个中断 */\n\n#define MY_WORK_QUEUE_NAME \"WQsched.c\"\nstatic struct\
    \ workqueue_struct *my_workqueue;\n```\n\n/**\n * 只要内核认为可以执行内核模块允许的所有正常操作，\n 就会调用此函数。\n\
    \ */\n\n```c\nstatic void got_char(void *scscode)\n{\n    printk(KERN_INFO \"\
    Scan Code %x %s.\\n\",\n           (int)((char*)scscode) & 0x7F,\n           *((char*)scscode)\
    \ & 0x80 ? \"Released\" : \"Pressed\");\n}\n```\n\n/**\n * 此函数处理键盘中断。它从键盘读取相关\n\
    \ * 信息，并将非时间关键部分\n * 放入工作队列。这部分将在内核认为安全时运行。\n */\n\n```c\nirqreturn_t irq_handler(int\
    \ irq, void *dev_id, struct pt_regs *regs)\n{\n  /*\n   * 这些变量是静态的，因为它们需要被\n \
    \  * （通过指针）供底半部分程序访问。\n   */\n  static int initialised = 0;\n  static unsigned\
    \ char scancode;\n  static struct work_struct task;\n  unsigned char status;\n\
    \n  /*\n   * 读取键盘状态\n   */\n  status = inb(0x64);\n  scancode = inb(0x60);\n\n\
    \  if (initialised == 0) {\n    INIT_WORK(&task, got_char, &scancode);\n    initialised\
    \ = 1;\n  } else {\n    PREPARE_WORK(&task, got_char, &scancode);\n  }\n\n  queue_work(my_workqueue,\
    \ &task);\n\n  return IRQ_HANDLED;\n}\n\n/* 初始化模块 - 注册 IRQ 处理程序\n\nint init_module()\
    \ {\n  my_workqueue = create_workqueue(MY_WORK_QUEUE_NAME);\n\n  /*\n   * 因为键盘处理程序不会与另一个处理程序共存，\n\
    \   * 我们必须在执行任何操作之前禁用它\n   *（释放 IRQ）。由于我们不知道它在哪里，因此无法\n   * 以后恢复它 - 所以在我们完成后必须重启计算机。\n\
    \   */\n  free_irq(1, NULL);\n\n  /*\n   * 请求 IRQ 1（键盘 IRQ）跳转到我们的 irq_handler。\n\
    \   * SA_SHIRQ 表示我们希望在该 IRQ 上有处理程序。\n   * SA_INTERRUPT 可用于将处理程序变为快速中断。\n   */\n\
    \  return request_irq(1, /* PC 上的键盘 IRQ  */\n      irq_handler, /* 我们的处理程序 */\n\
    \      SA_SHIRQ, \"test_keyboard_irq_handler\",\n      (void *) (irq_handler));\n\
    }\n\n/* 清理\nvoid cleanup_module() {\n  /*\n   * 这只是为了完整性。它完全无关，\n   */\n  /*\n\
    \   * 我们没有办法恢复正常的键盘中断，所以\n   * 计算机完全无法使用，且必须重启。\n   */\n  free_irq(1, NULL);\n\
    }\n/*\n * 某些与工作队列相关的函数仅对 GPL 许可的模块可用\n */\nMODULE_LICENSE(\"GPL\");\n```\n\n#\
    \ 第 13 章 对称多处理\n\n## 13.1. 对称多处理\n\n提高硬件性能最简单且廉廉的方法之一是在板上放置多个 CPU。这可以通过让不同的 CPU\
    \ 承担不同的任务（非对称多处理）或通过让它们全部并行执行相同任务（对称多处理，也称为 SMP）来实现。有效执行对称多处理需要对计算机执行的任务有专业知识，而这在\
    \ Linux 这样的通用操作系统中是不可提供的。另一方面，对称多处理的实现相对容易。\n\n我所说的相对容易，正是指这个意思：并不是真的非常简单。在对称多处理环境中，CPU\
    \ 共享相同的内存，因此在在一个 CPU 上运行可能会影响另一个 CPU 使用的内存。你无法再确定你在上一行中设置为特定值的变量是否仍然具有该值；另一个 CPU\
    \ 可能在你没看的时候对它进行了操作。显然，像这样编程是不可能的。（等一下，“像这样编程是不可能的”是夸张，但它需要非常小心）。\n\n实际上，SMP 的主要问题是多个\
    \ CPU 可以同时访问相同的数据结构。这会导致竞态条件和其他同步问题。\n\n考虑中断的情况。如果发生中断，它可以被任何 CPU 捕获。如果两个 CPU\
    \ 正在处理同一个中断，它们可能都尝试访问同一个数据结构，这可能会导致损坏。因此，我们必须确保只有一个 CPU 可以访问该数据结构。\n\nLinux 中有几种实现同步的方法，包括锁（lock）、信号量（semaphore）和自旋锁（spinlock）。锁是一种允许一次时间只有一个线程访问资源的原语。信号量类似于锁，但它允许有限数量的线程访问资源。自旋锁是一种锁，CPU\
    \ 会不断“旋转”直到锁可用。这在锁的持有时间非常短时非常有用。\n\n在本章中，我们将讨论如何在 SMP 环境中使用这些同步原语。我们还将查看一些常见的陷阱以及避免它们的方法。\n\
    \n"
