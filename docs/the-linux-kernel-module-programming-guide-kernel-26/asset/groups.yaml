    \ */\nint bytes_read = 0;\n\n#ifdef DEBUG\nprintk(KERN_INFO \"device_read(%p,%p,%d)\\\
    n\", file, buffer, length);\n#endif\n\n/*\n * 如果我们在消息的末尾，返回 0\n *（表示文件结束）\n */\n\
