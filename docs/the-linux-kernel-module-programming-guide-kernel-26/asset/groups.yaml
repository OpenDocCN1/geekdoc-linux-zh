    \   printk(KERN_INFO \"procfs-read: END\\n\");\n        finished = 0;\n      \
    \  return 0;\n    }\n```\n\n```c\n    finished = 1;\n    /*\n     * 我们使用 put_to_user\
    \ 将字符串从内核\n     * 内存段拷贝到调用我们的进程的内存段。\n     * 顺便说，get_from_user 用于\n     * 反向操作。\n\
    \     */\n    if (copy_to_user(buffer, procfs_buffer, procfs_buffer_size)) {\n\
    \        return -EFAULT;\n    }\n```\n\n```c\nprintk(KERN_INFO \"procfs-read:\
    \ %lu bytes\\n\", procfs_buffer_size);\n\n    return procfs_buffer_size; /* 返回已读取的字节数\
    \ */\n```\n\n```c\n/**\n * 当 /proc 文件被写入时，会调用此函数\n */\nstatic size_t\nprocfs_write(struct\
    \ file *file, const char *buffer, size_t len, loff_t *off) {\n    if (len > PROCS_MAX_SIZE)\
    \ {\n        procfs_buffer_size = PROCS_MAX_SIZE;\n    }\n    else {\n       \
    \ procfs_buffer_size = len;\n    }\n```\n\n第 5 章. /proc 文件系统\n\n# Linux 内核模块编程指南\n\
    \n```c\nif (copy_from_user(procfs_buffer, buffer, procfs_buffer_size)) {\n   \
    \ return -EFAULT;\n}\n\nprintk(KERN_INFO, \"procfs_write: write %lu bytes\\n\"\
    , procfs_buffer_size);\n\nreturn procfs_buffer_size;\n```\n\n```c\n/*\n* 此函数决定是否允许执行操作\n\
    *（返回零允许）或不允许（返回非零，\n* 以表示为什么不被允许）。\n* 操作可以是以下值之一：\n* 0 - 执行/运行“文件” - 在我们的用例中没有意义\n\
    * 2 - 写入（到内核模块的输入）\n* 4 - 读取（从内核模块的输出）\n\n* 这是一个检查文件权限的\n* 真实函数。ls -l 返回的权限\n\
    * 仅供参考，且\n```\n\n```c\nstatic int module_permission(struct inode *inode, int op,\
    \ struct nameidata *foo) {\n    /*\n     * 我们允许所有人读取我们的模块，\n     * 只有 root (uid\
    \ 0) 可以向其写入\n     */\n    if (op == 4 || op == 2 && current->uid == 0) {\n   \
    \     return 0;\n    }\n\n    /*\n     * 如果是其他任何情况，则拒绝访问\n     */\n    return\
    \ -EACCES;\n}\n```\n\n```c\n/*\n* 文件被打开 - 我们并不真正关心\n* 那，但它意味着我们需要增加\n* 模块的引用计数。\n\
    */\nint procfs_open(struct inode *inode, struct file *file) {\n    try_module_get(THIS_MODULE);\n\
    \    return 0;\n}\n```\n\n```c\n/*\n* 文件被关闭 - 同样，仅是因为\n* 引用计数。\n*/\nint procfs_close(struct\
    \ inode *inode, struct file *file) {\n    module_put(THIS_MODULE);\n    return\
    \ 0;\n}\n```\n\n第 5 章. /proc 文件系统\n\n# Linux 内核模块编程指南\n\n```c\nstatic struct file_operations\
    \ File_Ops_File = {\n  .read = procfs_read,\n  .write = procfs_write,\n  .open\
    \ = procfs_open,\n  .release = procfs_close,\n};\n```\n\n* 我们的 proc 文件的 Inode\
    \ 操作。我们需要它，\n* 这样我们就有地方来指定想要使用的\n* 文件操作结构体，以及我们用于权限\n* 的函数。也可以指定为\n* 其他可以执行的操作调用的函数\n\
    *（尽管我们没有去理会，只需放在那里即可）\n\n```c\nstatic struct inode_operations Inode_Ops_File =\
    \ {\n  .permission = module_permission, /* 检查权限 */\n};\n```\n\n* 模块初始化与清理\n\n\
    ```c\nOur_Proc_File->owner = THIS_MODULE;\nOur_Proc_File->proc_ops = &Inode_Ops_File;\n\
    Our_Proc_File->fops = &File_Ops_File;\nOur_Proc_File->mode = S_IFREG | S_IWUSR;\n\
    Our_Proc_File->uid = 0;\nOur_Proc_File->gid = 0;\nOur_Proc_File->size = 0;\n```\n\
    \n```c\nprintk(KERN_INFO \"/proc/%s created\\n\", PROC_NAME);\n\n  return 0;\n\
    }\n```\n\n还对 proc 感到饥饿吗？首先请记住，它有很多其他方法，可以考虑使用 sysfs。如果你不贪婪，在 linux/Documentation/\
    \ 下方有一个非常推荐的层。\n\n# 5.4. 使用 seq_file 管理 /proc 文件\n\n正如我们所见，编写 /proc 文件可能相当“复杂”。因此，为了帮助人们编写\
    \ /proc 文件，有一个名为 seq_file 的 API，它可以帮助格式化 /proc文件的输出。它基于序列（sequence），由三个函数组成：start()、next()\
    \ 和 stop()。当我们读取 /proc 文件时，seq_file API 会启动一个序列。\n\n序列开始于调用 `start()` 函数。如果返回值为\
    \ NULL，则调用 `next()` 函数。此函数是一个迭代器，目标是获取所有数据。每次调用 `next()` 时，都会调用 `show()` 函数。它由读取者向缓冲区写入数据值。持续调用\
    \ `next()` 直到它返回 NULL。当 next 返回 NULL 时，序列结束，然后调用 `stop()` 函数。\n\n注意：当一个序列完成时，另一个会开始。这意味着在\
    \ stop() 函数结束时，会再次调用 start() 函数。此循环在 start 函数返回 NULL 时结束。你可以在图“How seq_file works”中看到这种方案。\n\
    \nSeq_file 为 file_operations 提供了基本函数，如 seq_read、seq_lseek 等，且在 /proc 文件中无需编写内容。当然，你仍然可以使用上一个示例中的相同方法。\n\
    \n# 图 5–4. procfs4.c\n\n```c\n/**\n* procfs4.c - 在 /proc 中创建一个“文件”\n* 此程序使用 seq_file\
    \ 库来管理 /proc 文件\n */\n#include <linux/kernel.h>\n#include <linux/module.h>\n#include\
    \ <linux/proc_fs.h>\n#include <linux/seq_file.h>\n\n/* 计数器 */\nstatic int counter\
    \ = 0;\n#define PROC_NAME \"procfs4\"\n\nstatic void *my_start(struct seq_file\
    \ *s, struct inode *inode, loff_t *off) {\n    /*  */\n    if (*off == 0) {\n\
    \        return &counter;\n    }\n    return NULL;\n}\n\nstatic void *my_next(struct\
    \ seq_file *s, void *v) {\n    /*  */\n    if (*v < 10) {\n        return v++;\n\
    \    }\n    return NULL;\n}\n\nstatic void my_stop(struct seq_file *s, void *v)\
    \ {\n    /*  */\n}\n\nstatic int my_show(struct seq_file *s, void *v) {\n    /*\
    \  */\n    loff_t *spos = (loff_t *)v;\n    fprintf(s, \"%d\\n\", *spos);\n  \
    \  return 0;\n}\n\nstatic int my_open(struct inode *inode, struct file *file)\n\
    {\n    return seq_open(file, &my_seq_ops);\n}\n\n/**\n * 用于管理序列的结构体\n */\nstatic\
    \ struct seq_operations my_seq_ops = {\n    .start = my_start,\n    .next = my_next,\n\
    \    .stop = my_stop,\n    .show = my_show\n};\n\n/**\n * 用于管理 /proc 文件的结构体\n\
    \ */\nstatic struct file_operations my_file_ops = {\n    .owner = THIS_MODULE,\n\
    \    .open = my_open,\n    .read = seq_read,\n    .llseek = seq_lseek,\n    .release\
    \ = seq_release\n};\n\n/**\n * 当模块加载时调用此函数\n */\nint init_module(void) {\n   \
    \ struct proc_dir_entry *entry;\n\n    entry = create_proc_entry(PROC_NAME, 0,\
    \ NULL);\n    if (entry) {\n        entry->proc_fops = &my_file_ops;\n    }\n\
    \    return 0;\n}\n\n/**\n * 当模块卸载时调用此函数\n */\nvoid cleanup_module(void) {\n \
    \   remove_proc_entry(PROC_NAME, NULL);\n}\n```\n\n"
