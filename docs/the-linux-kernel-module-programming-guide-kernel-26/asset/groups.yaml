    # # Chapter 8. System Calls


    # ## 8.1. System Calls


    So far, the only thing we''ve done was to use well defined kernel mechanisms to
    register /proc files and device handlers. This is fine if you want to do something
    the kernel programmers thought you''d want, such as write a device driver. But
    what if you want to do something unusual, to change the behavior of the system
    in some way? Then, you''re on your own.


    This is where kernel programming gets dangerous. While writing the example, I
    killed the open () system call. This meant I couldn''t open any files, I couldn''t
    run any programs, and I couldn''t shutdown the computer. I had to pull the power
    switch. Luckily, no files died. To ensure you don''t lose any files either, please
    run sync before you insmod and rmmod.


    About /proc files, forget device files. They''re just minor details. The real
    process to kernel communication mechanism, the one used by processes, is system
    calls. When a process requests a service from the kernel (such as opening a file,
    forking to a new process, or requesting more memory), this is the mechanism. If
    you want to change the behaviour of the kernel in interesting ways, this is the
    place to do it. By the way, if you want to see which system calls your programs,
    run trace <arguments>.


    In general, a process is not supposed to access the kernel. It can''t access kernel
    memory and it can''t call kernel functions. The hardware of the CPU enforces this
    (that''s the reason why it''s ''protected mode'').


    System calls are an exception to this rule. What happens if the process registers
    the kernel with the appropriate values and calls a special instruction which jumps
    to a predefined location in the kernel (of course, that location is readable by
    user processes, it is not writable by them). Under Intel CPUs, this is done by
    means of interrupt 0x80. The hardware ensures that once you jump to this location,
    you are no longer in restricted mode, but by operating the system kernel — and
    therefore you''re allowed to do whatever you want.


    The location in which a process can jump is called system_call. The procedure
    at that location the system number, tells the kernel what process was requested.
    Then it looks at the table of system calls (sys_call_table) to see the address
    of the kernel function to call. Then it calls the function, and returns, it does
    a system check and returns to the process (or to a different process, if the process
    times out). If you want to read this code, it''s at the source file arch/$architecture$/kernel/entry.S
    at the line ENTRY(system_call).


    So, if we want to change a certain system call works, what we need to do is to
    write our own function to implement it (usually by adding a bit of our code, and
    calling the original function) and change the pointer at sys_call_table to point
    to our function. Because we might be removed later and we don''t want to lose
    the system in an unstable state, it''s important for cleanup_module to restore
    to its original state.


    The source code here is an example of such a kernel module. We want to ''spy''
    on a certain user, and to print() a message whenever that user opens a file. To
    this end, we replace the system call to open a file with our own, called our_sys_open.
    This function checks the uid (id) of the current process, and if it is equal to
    the uid we spy on, it print() to display the name of the file to be opened. Then,
    either way, it calls the original () function with the same parameters, to actually
    open the file.'
