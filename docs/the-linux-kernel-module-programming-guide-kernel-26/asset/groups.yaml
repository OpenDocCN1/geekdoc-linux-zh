    \ System Calls\n\n## 8.1. System Calls\n\nSo far, the only thing we've done was\
    \ to use well defined kernel mechanisms to register /proc files and device handlers.\
    \ This is fine if you want to do something the kernel programmers thought you'd\
    \ want, such as write a device driver. But what if you want to do something unusual,\
    \ to change the behaviour of the kernel in some way? Then you're on your own.\n\
    \nThis is where kernel programming gets dangerous. While writing the example,\
    \ I killed the open () system call. This meant I couldn't open any files, I couldn't\
    \ run any programs, and I couldn't shutdown the computer. Luckily, to ensure you\
    \ don't lose any files, please run insmod and rmmod.\n\nAbout /proc files, device\
    \ files. They're just minor details. The real process communication, the one used\
    \ by processes, is system calls. When a process requests a service from the kernel\
    \ (such as opening a file, forking to a new process), this is the mechanism. In\
    \ general, a process is not supposed to access the kernel. It can't access kernel\
    \ memory and it can't call kernel functions. The hardware enforces this (that's\
    \ protected mode).\n\nSystem calls are an exception to this rule. What happens\
    \ if the process registers the kernel with appropriate values and calls a special\
    \ instruction which jumps to a predefined location in the kernel (of course, that\
    \ location is readable by user, it is not writable by them)? Under Intel CPUs,\
    \ this is done by interrupt 0x80. The hardware ensures that once you jump to this\
    \ location, you are no longer in restricted mode, but therefore you're allowed\
    \ to do whatever you want.\n\nIf you want to read this code, it's at source arch/kernel/entry.S\
