    # The Linux Kernel Module Programming Guide


    To avoid these two problems, I highly recommend that you download, compile and
    boot into a fresh, stock Linux kernel which can be downloaded from any of the
    Linux kernel mirror sites. See the Linux Kernel HOWTO for more details.


    Ironically, this can also cause a problem. By default, gcc on your system may
    look for the kernel headers in their default location rather than where you installed
    the new copy of the kernel (usually in `/usr/src/`. This can be fixed by using
    gcc''s -I switch.'
  - "[PAGE 7]\n\n# Chapter 2. Hello World\n\n# 2.1. Hello, World (part 1): The Simplest\
    \ Module\n\nWhen the first caveman chiseled the first program on the walls of\
    \ the first cave computer, it began with a program to paint the string 'Hello,\
    \ world' in Antelope pictures. Roman programming textbooks began with the 'Salut,\
    \ Mundi' program. I don't know what people who break with this tradition, but\
    \ I think it's safer not to find out. We'll start with a series of hello world\
    \ programs that demonstrate the different aspects of the basics of writing a kernel\
    \ module.\n\nHere's the simplest possible. Don't compile it yet; we'll cover module\
    \ compilation in the next section.\n\nExample 2–1. hello-1c\n\n```\n/*\n * hello-l.c\
    \ - The simplest kernel module.\n */\n#include <linux/module.h>    /* Needed by\
    \ all modules */\n#include <linux/kernel.h>    /* Needed for KERN_INFO */\n\n\
    int init_module(void)\n{\n    printk(KERN_INFO \"Hello world 1.\\n\");\n    /*\n\
    \     * A non 0 return means init_module failed; module can't be loaded.\n   \
    \  */\n    return 0;\n}\n\nvoid cleanup_module(void)\n{\n    printk(KERN_INFO\
    \ \"Goodbye world 1.\\n\");\n}\n```\n\nKernel modules must have at least two functions:\
    \ a \"start\" (initialization) function called init_module() and an \"end\" (cleanup)\
    \ function called cleanup_module() which is called when the module is inserted\
    \ into the kernel, and just before it is removed. Actually, things have changed\
    \ starting with kernel 2.3.1. You can now use whatever name like for the start\
    \ and end functions of a module, and you'll learn how to do it using Section 2.3,\
    \ and cleanup_module() for their start and end functions.\n\nTypically, init_module()\
    \ either registers a handler for something with the kernel, or it replaces one\
    \ of the kernel functions with its own code (usually to do something and then\
    \ call the original function). The cleanup_module() is supposed to undo whatever\
    \ init_module() did, so the module can be unloaded safely.\n\nLastly, every kernel\
    \ module needs to include linux/module.h. We needed to include linux/kernel.h\
    \ only for the macro expansion for the printk() log level, KERN_ALERT, which you'll\
    \ learn about in Section 2.1.1."
- md: "\n# The Linux Kernel Module Programming Guide\n\n## 2.1.1. Introducing printk()\n\
    \nDespite what you might think, printk() was not meant to communicate information\
    \ to the user, though we used it for exactly this purpose in hello! It happens\
    \ to be a logging mechanism for the kernel, and is used to log information or\
    \ warnings. Therefore, printk() statement comes with a priority, which is the\
    \ <1> and KERN_ALERT you see. There are 8 priorities and the kernel has many for\
    \ them, you don't have to use cryptic numbers, and you can view them in linux/kernel.h.\
    \ If you don't use a priority level, the default priority, DEFAULT_MESSAGE_LOGLEVEL,\
    \ will be used.\n\nTake time to read through the priority macros. The header file\
    \ also describes what each priority means. In practise, always use the number,\
    \ like <4>, like KERN_WARNING.\n\nIf the priority is less than const console_loglevel,\
    \ the message is printed to your current terminal. Through both syslog and klog,\
    \ the message will also get appended to /var/log/messages, whether it gets printed\
    \ to the console or not. We use a high priority, KERN_ALERT, to make sure the\
    \ printk() messages get printed to your console not just logged to your log. When\
    \ you write your modules, you'll want to use priorities that are meaningful for\
    \ the situation at hand.\n\n## 2.2. Compiling Kernel Modules\n\nKernel modules\
    \ need to be compiled differently from regular users apps. Former kernel versions\
    \ require us to make these settings, which are mostly stored in Makefiles. Although\
    \ hierarchically organized, many redundant assignments accumulated in sublevel\
    \ Makefiles make them large and difficult to maintain. Unfortunately, there is\
    \ a new way of doing these things, kbuild, and the build process for external\
    \ loadable modules is now fully integrated into the standard kernel build mechanism.\
    \ Learn more on how to compile modules which are not part of the official kernel\
    \ (as all the examples you'll find in this guide), see linux/Documentation/kbuild/modules.txt.\n\
    \nSo, let's look at a Makefile for compiling a module named hello-1.c:\n\n###\
    \ Example 2–2. Makefile for a basic kernel module\n\n```\nobj-m += hello-1.o\n\
    \nall:\n    make -C /lib/modules/$(shell uname -r)/build M=$(PWD) modules\n\n\
    clean:\n    make -C /lib/modules/$(shell uname -r)/build M=$(PWD) clean\n```\n\
    \nFrom a technical point of view the first line is really necessary, the \"all\"\
    \ and \"clean\" targets are added for pure convenience.\n\nNow you can compile\
    \ the module by issuing the command make .. You should obtain an output which\
    \ resembles the following:\n\n```\nhostname:~/lkmp-examples/02-HelloWorld# make\n\
    make -C /lib/modules/2.6.11/build M=/root/lkmp-examples/02-HelloWorld\n[1]: Entering\
    \ directory /usr/src/linux-2.6.11\nCC [M] /root/lkmp-examples/02-HelloWorld/hello-1.o\n\
    Building modules, stage 2.\nMODPOST\n```\nCC /root/kmpkg-examples/02-HelloWorld/hello-1.mod.o\n\
    LD [M] /root/kmpkg-examples/02-HelloWorld/hello-1.ko\nmake[1]: Leaving directory\
    \ '/usr/src/linux-2.6.11'\nhostname:/root/kmpkg-examples/02-HelloWorld#\n```\n\
    \nNote that kernel 2 introduces a new naming convention: kernel modules have a\
    \ .ko extension (in place of the .o extension) which distinguishes them from conventional\
    \ object files. The reason for this is that they can contain an additional .modinfo\
    \ section where additional information about the module is wrote. We'll keep on\
    \ to what additional information is good for.\n\nUse modinfo-* to see what kind\
    \ of information it is.\n\n```\nhostname:/kmpkg-examples/02-HelloWorld# modinfo\
    \ hello-1.ko\nfilename: hello-1.ko\nvermagic: 2.6.11 preempt PENTIUMII 4STACKS\
    \ gcc-3.3\ndepends:\n```\n\nNothing spectacular, so that. Changes we're using\
    \ modinfo on one of our later examples, hello-5.ko.\n\n```\nhostname:/kmpkg-examples/02-HelloWorld#\
    \ modinfo hello-5.ko\nfilename: hello-5.ko\nlicense: GPL\nauthor: Peter Jay Salomon\n\
    vermagic: 2.6.11 preempt PENTIUMII 4STACKS gcc-3.3\ndepends:\nparm: myArray:A\
    \ character string (array of int)\nparm: mystring:A character (char)\nparm: mylong:A\
    \ long integer (long)\nparm: myint:An integer (int)\nparm: myshort:A short (short)\n\
    hostname:/kmpkg-examples/02-HelloWorld#\n```\n\nLot's useful information for kernel\
    \ to see. An author here for bugreports, license information, even a short description\
    \ of the parameters it accepts.\n\nAdditional details for Makefiles for kernel\
    \ modules are available in linux/Documentation/kbuild/makefiles.txt. Be sure to\
    \ read that and the related files starting to make Makefiles. You'll probably\
    \ see lots of work.\n\nNow it is time to insert your freshly-compiled module into\
    \ the kernel with insmod /hello-1.ko (ignore anything you see about we tainted\
    \ kernels; we'll cover that shortly).\n\nAll modules loaded into the kernel are\
    \ in /proc/modules. Go ahead and check to see that your module is really of the\
    \ kernel. Congratulations, you are now the author of kernel code! When the novelty\
    \ wears, remove your module from the kernel using rmmod hello-1. Take a look at\
    \ /var/log/messages to see that it logged to your system. Here's another exercise\
    \ for the reader. See what about the return statement in init_module()? Change\
    \ the value to something negative, recompile and load the module again. What happens?\n\
    \n## 2.3. Hello World (part 2)\n\nAs of Linux 2.4, you can rename the init and\
    \ cleanup functions of your module; they no longer have to be called init_module()\
    \ and cleanup_module() respectively. This is done with module_init() and __module_exit()\
    \ macros. These macros are defined in linux/init.h. The only caveat is that init\
    \ and cleanup functions must be defined before calling the macros, otherwise you'll\
    \ get compilation errors. Here's an example of this technique:\n\n### Example\
    \ 2-3. hello-2.c\n\n```\n/*\n* hello-2.c Demonstrating the module_init() and module_exit()\
    \ macros.\n* This is preferred over init_module() and cleanup_module().\n */\n\
    #include <linux/module.h>    /* Needed by all modules */\n#include <linux/kernel.h>\
    \    /* Needed for KERN_INFO */\n#include <linux/init.h>      /* Needed for the\
    \ macros */\nstatic int __init hello_2_init(void)\n{\n    printk(KERN_INFO, \"\
    Hello, world 2\");\n    return 0;\n}\nstatic void __exit hello_2_exit(void)\n\
    {\n    printk(KERN_INFO, \"Goodbye, world 2\");\n}\nmodule_init(hello_2_init);\n\
    module_exit(hello_2_exit);\n```\n\nSo now we have two kernel modules under our\
    \ belt. Adding another module is simple as this:\n\n### Example 2-4. Makefile\
    \ for our modules\n\n```\nobj-m += hello-1.o\nobj-m += hello-2.o\n\nall:\n\tmake\
    \ -C /lib/modules/$(shell uname -r)/build M=$(PWD)\n\nclean:\n\tmake -C /lib/modules/$(shell\
    \ uname -r)/build M=$(PWD) clean\n```\n\nNow have a look at linux/drivers/char/Makefile\
    \ for a real world. As you can see, some things get hardened into the kernel (obj-y)\
    \ but there are also obj-m modules. Those with familiar scripts will easily be\
    \ able to spot them. For the not, obj-CONFIG_FOO shows you everywhere expand to\
    \ obj-y or obj-m, depending on whether CONFIG_FOO variable has been set to y or\
    \ m. When we are at it, these exactly the kind of variables that you have set\
    \ in the linux/.config file, the last time you use menuconfig or something like\
    \ that.\n\n## 2.4 Hello World (part 3): __init and __exit Macros\n\nThis demonstrates\
    \ a feature of kernel 2.2 and later. Notice the change in the definitions of the\
    \ init and cleanup functions. The __init macro allows the function to be discarded\
    \ and its memory freed once the init function finishes for built-in drivers, but\
    \ not loadable modules. If you think about when the init function is invoked,\
    \ this makes sense. There is also __initdata which works similarly to __init for\
    \ init variables rather than functions.\n\nThe __exit macro causes the omission\
    \ of the function when the module is built into the kernel, and like __exit, has\
    \ no effect for loadable modules. Again, if you consider the cleanup function\
    \ runs, this makes complete sense: built-in drivers do not need a cleanup function,\
    \ while loadable modules.\n\nThese macros are defined in linux/init.h and serve\
    \ to free up kernel memory. When you boot your kernel and see something like Freeing\
    \ unused kernel memory: 236k freed, this is precisely what is freeing.\n\n###\
    \ Example 2-5. hello-3.c\n\n```\n/*\n* hello-3.c - Illustrating the __init, __initdata\
    \ and __exit macros.\n */\n#include <linux/module.h>    /* Needed by all modules\
    \ */\n#include <linux/kernel.h>   /* Needed for KERN_INFO */\n#include <linux/init.h>\
    \      /* Needed for the macros */\n\nstatic int hello_3_data __initdata = 3;\n\
    static int __init hello_3_init(void)\n{\n    printk(KERN_INFO, \"Hello, world\
    \ %d\\n\", hello_3_data);\n    return 0;\n}\n\nstatic void __exit hello_3_exit(void)\n\
    {\n    printk(KERN_INFO, \"Goodbye, world 3\\n\");\n}\n```\n\n## 2.5. Hello World\
    \ (part 4): Licensing and Module Documentation\n\nIf you're running kernel 2.4\
    \ or later, you might have noticed something like this when you loaded proprietary\
    \ modules:\n\n```\n# insmod xxxxx.o\nWarning: loading xxxxx.ko will taint the\
    \ kernel: no license\nSee http://www.tux.org/linux/lml/#export-tainted for information\
    \ about tainted modules\nModule xxxxx loaded, with warnings\n```\n\nIn kernel\
    \ 2.4 and later, a mechanism was devised to identify code for the GPL (and friends)\
    \ so people can be warned that the code is not open-source. This is accomplished\
    \ by the MODULE_LICENSE () macro which is demonstrated in the next piece of code.\
    \ By setting the license to GPL, you can keep the warning from being printed.\
    \ This license mechanism is defined and documented in linux/module.h:\n\n+   *\
    \ The following license idents are currently accepted as indicating free\n"
  mdcn: "\n\n# Linux 内核模块编程指南\n\n## 2.1.1. 介绍 printk()\n\n尽管你可能认为并非如此，printk() 并不是为了向用户传递信息，尽管我们在\
    \ hello! 示例中正是为此目的使用它。它恰好是内核的日志机制，用于记录信息或警告。因此，printk() 语句带有优先级，即你看到的 `<1>` 和\
    \ `KERN_ALERT`。共有 8 种优先级，内核为它们提供了许多定义，你不需要使用晦懂的数字，可以在 `linux/kernel.h` 中查看它们。如果你不使用优先级级别，将使用默认优先级\
    \ `DEFAULT_MESSAGE_LOGLEVEL`。\n\n花点时间阅读这些优先级宏。头文件也描述了每个优先级的含义。在实践中，请始终使用数字，例如\
    \ `<4>`，如 `KERN_WARNING`。\n\n如果优先级小于 `const console_loglevel`，消息将打印到你当前的终端。通过\
    \ `syslog` 和 `klog`，消息也会追加到 `/var/log/messages`，无论它是否打印到控制台。我们使用高优先级 `KERN_ALERT`\
    \ 来确保 printk() 消息打印到你的控制台，而不仅仅是记录到日志中。当你编写模块时，你会使用对当前情况有意义的优先级。\n\n## 2.2. 编译内核模块\n\
    \n内核模块的编译与普通用户应用程序不同。旧版本的内核要求我们进行这些设置，这些设置大多存储在 Makefile 中。尽管按层级结构组织，但子级 Makefile\
    \ 中累积了许多冗余赋值，导致它们变得巨大且难以维护。遗憾的是，现在有一种处理这些事务的新方法 `kbuild`，并且外部可加载模块的构建过程现在已完全集成到标准的内核构建机制中。有关如何编译不属于官方内核的模块（如本指南中找到的所有示例），请参见\
    \ `linux/Documentation/kbuild/modules.txt`。\n\n现在，让我们来看编译名为 `hello-1.c` 模块的 Makefile：\n\
    \n### 示例 2–2. 基础内核模块的 Makefile\n\n```\nobj-m += hello-1.o\n\nall:\n    make -C\
    \ /lib/modules/$(shell uname -r)/build M=$(PWD) modules\n\nclean:\n    make -C\
    \ /lib/modules/$(shell uname -r)/build M=$(PWD) clean\n```\n\n从技术角度来看，第一行是绝对必要的，`all`\
    \ 和 `clean` 目标是为了方便而添加的。\n\n现在你可以通过执行命令 `make ..` 来编译模块。你会得到类似下面的输出：\n\n```\n\
    hostname:~/lkmp-examples/02-HelloWorld# make\nmake -C /lib/modules/2.6.11/build\
    \ M=/root/lkmp-examples/02-HelloWorld\n[1]: Entering directory /usr/src/linux-2.6.11\n\
    CC [M] /root/lkmp-examples/02-HelloWorld/hello-1.o\nBuilding modules, stage 2.\n\
    MODPOST\n```\nCC /root/kmpkg-examples/02-HelloWorld/hello-1.mod.o\nLD [M] /root/kmpkg-examples/02-HelloWorld/hello-1.ko\n\
    make[1]: Leaving directory '/usr/src/linux-2.6.11'\nhostname:/root/kmpkg-examples/02-HelloWorld#\n\
    ```\n\n注意，内核 2.0 引入了新的命名规范：内核模块具有 `.ko` 扩展（代替 `.o` 扩展），以将其与传统的对象文件区分开。其原因是它们可以包含一个额外的\
    \ `.modinfo` 段，其中写入了关于模块的额外信息。我们将继续这些额外信息的用途。\n\n使用 `modinfo-*` 查看它是什么类型的信息。\n\
    \n```\nhostname:/kmpkg-examples/02-HelloWorld# modinfo hello-1.ko\nfilename: hello-1.ko\n\
    vermagic: 2.6.11 SMP PREEMPT_64 gcc-3.3\ndepends:\n```\n\n没什么特别的，这样我们在稍后的一个示例\
    \ `hello-5.ko` 中使用了 `modinfo`。\n\n```\nhostname:/kmpkg-examples/02-HelloWorld#\
    \ modinfo hello-5.ko\nfilename: hello-5.ko\nlicense: GPL\nauthor: Peter Salomon\n\
    vermagic: 2.6.11 SMP PREEMPT_64 gcc-3.3\ndepends:\nparm: myArray: character string\
    \ (array of int)\nparm: mystring: character (char)\nparm: mylong: long integer\
    \ (long)\nparm: myint: integer (int)\nparm: myshort: short (short)\n```\n\n关于内核这里有很多有用信息：作者、许可证信息，甚至还有它接受的参数的简短描述。内核模块\
    \ Makefile 的更多细节可以在 `linux/Documentation/kbuild/makefiles.txt` 中找到。确保阅读该文件并开始编写\
    \ Makefile。\n\n现在是时候用 `insmod hello-1.ko` 将你新编译的模块插入内核了（忽略任何关于内核污染的提示；稍后我们会介绍）。所有加载到内核的模块都在\
    \ `/proc/modules` 中。去检查你的模块是否真的加载到了内核。恭喜，你现在是内核代码作者了！使用 `rmmod hello-1` 从内核中移除模块。查看\
    \ `/var/log/messages` 查看它被记录到了你的系统中。这是给读者的另一个练习：关于 `init_module()` 返回语句，将其值改为负数，重新编译并加载模块。发生了什么？\n\
    \n## 2.3. Hello World（部分 2）\n\n从 Linux 2.4 开始，你可以重命名模块的 init 和清理函数；它们不再需要分别调用\
    \ `init_module()` 和 `cleanup_module()`。这是通过 `module_init()` 和 `module_exit()`\
    \ 宏实现的。这些宏定义在 `linux/init.h` 中。唯一的注意事项是在必须调用宏之前定义 init 和清理函数，否则你会得到编译错误。这是一个这种技术的示例：\n\
    \n### 示例 2-3. hello-2.c\n\n```\n/*\n* hello-2.c 展示了 module_init() 和 module_exit()\
    \ 宏。\n* 这比 init_module() 和 cleanup_module() 更好。\n */\n#include <linux/module.h>\
    \    /* 所有模块需要 */\n#include <linux/kernel.h>    /* KERN_INFO 需要 */\n#include <linux/init.h>\
    \      /* 宏需要 */\nstatic int __init hello_2_init(void)\n{\n    printk(KERN_INFO,\
    \ \"Hello, world 2\");\n    return 0;\n}\nstatic void __exit hello_2_exit(void)\n\
    {\n    printk(KERN_INFO, \"Goodbye, world 2\");\n}\nmodule_init(hello_2_init);\n\
    module_exit(hello_2_exit);\n```\n\n现在我们已经掌握了两个内核模块。添加另一个模块简单如下：\n\n### 示例 2-4.\
    \ 模块的 Makefile\n\n```\nobj-m += hello-1.o\nobj-m += hello-2.o\n\nall:\n\tmake\
    \ -C /lib/modules/$(shell uname -r)/build M=$(PWD)\n\nclean:\n\tmake -C /lib/modules/$(shell\
    \ uname -r)/build M=$(PWD) clean\n```\n\n现在看看真实世界的 `linux/drivers/char/Makefile`。如你所示，某些内容被硬化进内核（obj-y），但也有\
    \ `obj-m` 模块。熟悉脚本的人可以很容易识别它们。不熟悉的人，`obj-CONFIG_FOO` 显示随随处展开为 `obj-y` 或 `obj-m`，取决于\
    \ `CONFIG_FOO` 变量是否被设置为 `y` 或 `m`。说起来，这些正是你上一次使用 `menuconfig` 或类似工具时在 `linux/.config`\
    \ 文件中设置的变量。\n\n## 2.4 Hello World（部分 3）：__init 和 __exit 宏\n\n这演示了内核 2.2 及更高版本的一个特性。注意\
    \ init 和清理函数定义中的变化。`__init` 宏允许函数在内置驱动程序的 init 函数完成后被丢弃并释放其内存，但对于可加载模块则不然。如果你考虑\
    \ init 函数被调用的时，这是很有意义的。还有 `__initdata`，它的工作方式类似于 `__init`，但针对初始化变量而不是函数。\n\n`__exit`\
    \ 宏导致在模块构建进内核时省略该函数，且与 `__exit` 一样，对可加载模块没有影响。再次，如果你考虑清理函数的运行，这完全合理：内置驱动程序不需要清理函数，而可加载模块需要。\n\
    \n这些宏定义在 `linux/init.h` 中，用于释放内核内存。当你启动内核并看到类似 `Freeing unused kernel memory:\
    \ 236k freed` 时，这正是正在释放的内容。\n\n### 示例 2-5. hello-3.c\n\n```c\n/*\n* hello-3.c\
    \ - 阐释 __init, __initdata 和 __exit 宏。\n */\n#include <linux/module.h>    /* 所有模块需要\
