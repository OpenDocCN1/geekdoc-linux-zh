- md: "\nThis is just a placeholder for now. Finally I'd like to see a (yet to be\
    \ written) chapter about sysfs instead here. If you are familiar with sysfs and\
    \ would like to take part in writing this chapter, feel free to contact us (the\
    \ LKMPG maintainers) for further details.\n\n## Chapter 7. Talking To Device Files\n\
    \n### 7.1. Talking to Device Files (writes and IOCTLs)\n\nDevice files are supposed\
    \ to represent physical devices. Most physical devices are used for output as\
    \ well as input, so there has to some mechanism for device drivers in the kernel\
    \ to get the output to send to the device from processes. This is done by opening\
    \ the device file for output and writing to it, just like writing to a file. In\
    \ the following example, this is implemented by `device_write`.\n\nThis is not\
    \ enough. Imagine you had a serial port connected to a modem (even if you have\
    \ an internal modem, it is still implemented from the CPU's perspective as a serial\
    \ port connected to a modem, so you don't have to tax your imagination too). The\
    \ natural thing to do would be to use the device file to write things to the modem\
    \ (either commands or data to be sent through the phone line) and read them from\
    \ the modem (either responses for commands or the data received through the phone\
    \ line). However, this leaves open the question of what to do when you need to\
    \ talk to the serial port, for example to send the rate at which data is sent\
    \ and received.\n\nThe answer in Unix is to use a special function `ioctl` (short\
    \ for Input Output Control). Every device has its own `ioctl` commands, which\
    \ can be read `ioctl` (to send information from a process to the kernel), write\
    \ `ioctl` (to return information to a process), both or neither. The ioctl function\
    \ is called with three parameters: the file descriptor of the appropriate device\
    \ file, the ioctl number, and a parameter, which is of long so you can use a case\
    \ to pass anything.\n\nThe ioctl number encodes the device number, the type of\
    \ the ioctl, the command, and the type of. This number is usually created by a\
    \ macro call `_IO__IOR__OW` (depending on the type) in a header file. This header\
    \ should then be included by the programs which will use `ioctl` (so they can\
    \ generate the appropriate `ioctl`) and by the kernel module (so it can understand\
    \ it). In the example, the file header is `chardev.h` and the program which uses\
    \ it is `ioctl.c`.\n\nIf you want to use `ioctl` in your own kernel modules, it\
    \ is best to receive an official ioctl assignment, or if you accidentally get\
    \ someone else's `ioctl`, or if they get yours, you'll know something is wrong.\
    \ For more information, check the kernel source tree at `Documentation/ioctl-number.txt`.\n\
    \n### Example 7-1. chardev.c\n\n```c\n/*\n * chardev.c - Create an input/output\
    \ character device\n */\n\n#include <linux/kernel.h>\n/* * We're doing kernel\
    \ work */\n#include <linux/module.h>\n/* * Specifically, a module */\n#include\
    \ <linux/fs.h>\n#include <asm/uaccess.h>\n\n/* * for get_user and put_ptr */\n\
    \n#include <chardev.h>\n#define SUCCESS 0\n#define DEVICE_NAME \"chardev\"\n#define\
    \ BUF_LEN 80\n```\n\n- Is the device open right now? Used to prevent concurrent\
    \ access into the same device\n```c\nstatic int Device_Open = 0;\n```\n\n```c\n\
    /*\n* The message the device will give when asked\n */\nstatic char Message[BUF_LEN];\n\
    ```\n\n```c\n/*\n* How far did the process reading the message get?\n* Useful\
    \ if the message is larger than the size of the\n* buffer we get to fill in device_read.\n\
    \ */\nstatic char *Message_Ptr;\n```\n\n```c\n/*\n* This is called whenever a\
    \ process attempts to open the device file\n */\nstatic int device_open(struct\
    \ inode *inode, struct file *file)\n{\n#ifdef DEBUG\n    printk(KERN_INFO \"device_open(%p)\\\
    n\", file);\n#endif\n\n  /*\n* We don't want to talk to two processes at the same\
    \ time\n */\n if (Device_Open)\n    return -EBUSY;\n\n  Device_Open++;\n\n  /*\n\
    * Initialize the message\n */\n  Message_Ptr = Message;\n  try_module_get(THIS_MODULE);\n\
    \  return SUCCESS;\n}\n```\n\n```c\nstatic int device_release(struct inode *inode,\
    \ struct file *file)\n#ifdef DEBUG\n    printk(KERN_INFO \"device_release(%p,%p)\\\
    n\", inode, file);\n#endif\n\n  /*\n* We're ready now for our next caller\n */\n\
    \  Device_Open--;\n\n  module_put(THIS_MODULE);\n  return SUCCESS;\n}\n```\n\n\
    ```c\n/*\n* This function is called whenever a process has already opened the\n\
    * device file attempts to read from it.\n */\nstatic ssize_t device_read(struct\
