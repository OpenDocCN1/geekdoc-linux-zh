    # Chapter 5. The /proc File System


    # 5.1. The /proc File System


    In Linux, there is an additional mechanism for the kernel and proc modules to
    send information to processes — the /proc file. Originally designed to allow easy
    access to information about processes (hence the name), it is now used by every
    bit of the kernel which has something interesting to report, such as /proc/modules
    which provides the list of modules and /proc/meminfo which stores memory statistics.


    The method to use the proc file system is similar to the one with device drivers
    — a structure is created with all the information needed for the /proc file, including
    pointers to any handler functions (in case there is only one, the one called when
    somebody attempts to read from the /proc file). init_module registers the structure
    with the kernel and the cleanup_module unregisters.


    The reason we use proc_register_dynamic[8] is because we not want to determine
    the inode number used for our file in address, but to allow the kernel to determine
    to prevent clashes. Normal file systems are located on a disk, rather than in
    memory (where /proc is), and in that case the inode number is a pointer to a disk
    location where the file''s index-node (short for inode) is located. The inode
    contains information about the file, for its permissions, together with a pointer
    to the disk location or locations where the file''s data can be found.


    Because we dont called when the file is opened or closed, there''s nowhere for
    us to put try_module_get and try_module_put in this module, and if the file is
    opened and then the module is removed, there is no way to avoid the concerns.


    Here a simple example showing how to use a /proc file. This is the HelloWorld
    for the /proc system. There are three parts: create the file /proc/helloworld
    in the function init_module, return a value (and a buffer) when the file /proc/helloworld
    is read in the callback function procfs_read, and delete the file /proc/helloworld
    in the function cleanup_module.


    Each time, every the file /proc/helloworld is read, the function procfs_read is
    called. Two parameters of this function are very important: the buffer (the first
    parameter) and the offset (the third one). The content of the buffer will be returned
    to the application which read it (for example the cat command). The offset is
    the current position in the file. If the return value of the function isn''t null,
    then this function is called again. Be careful with this function, if it never
    returns zero, the read function is called endlessly.


    ```

    # cat /proc/helloworld

    HelloWorld!

    ```


