    \ */\n#include <linux/fs.h>\n#include <asm/uaccess.h>\n\n/* * 用于 get_user 和 put_ptr\
    \ */\n\n#include <chardev.h>\n#define SUCCESS 0\n#define DEVICE_NAME \"chardev\"\
    \n#define BUF_LEN 80\n```\n\n- 设备现在打开着吗？用于防止并发访问同一个设备\n```c\nstatic int Device_Open\
    \ = 0;\n```\n\n```c\n/*\n* 当被询问时设备将给消息\n */\nstatic char Message[BUF_LEN];\n```\n\
    \n```c\n/*\n* 读取消息的进程到了哪里？\n* 如果消息大于我们在\n* device_read 中填充的\n* 缓冲区大小，则很有用。\n */\n\
    static char *Message_Ptr;\n```\n\n```c\n/*\n* 当进程尝试打开设备文件时，就会调用此函数\n */\nstatic\
