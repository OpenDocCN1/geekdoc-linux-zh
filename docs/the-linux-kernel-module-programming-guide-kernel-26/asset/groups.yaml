  - "[PAGE 21]\n\n# The Linux Kernel Module Programming Guide\n\n# 3.1.5. Code space\n\
    \nMemory management is a very complicated subject—the majority of O'Reilly's Understanding\
    \ The Linux Kernel is just on memory management! We're not setting out to be experts\
    \ on memory management, but we need to know a couple of factors to even begin\
    \ worrying about writing modules.\n\nIf you have thought about what a segfault\
    \ really means, you might be surprised by how pointers actually point to memory\
    \ locations. Not real ones, anyway. When a process is created, the kernel sets\
    \ aside portion of physical memory and hands it to the process for its executing\
    \ code, variables, stack, heap and other things a computer scientist would know\
    \ about[5]. This memory begins with 0x0000000 and extends up to whatever it needs\
    \ to be. 0xffff978 would be accessing a different location in real physical memory!\
    \ The processes would be accessing an index named 0xffff978 which points to some\
    \ kind of offset into the region of memory set aside that particular process.\
    \ For the most part, a process like our Hello, World program can access the space\
    \ of another process, although there are ways we'll talk about later.\n\nThe kernel\
    \ has its own space of memory. Since a module can be dynamically inserted and\
    \ removed from the kernel (as a semi-autonomous object), the kernel's codespace\
    \ differs from having its own. Therefore, if you modify yourself, the kernel faults.\
    \ And if you start writing data because of an off-by-one error, you're trampling\
    \ on kernel data (or code). This is even worse than it sounds, so your best try\
    \ is to be careful.\n\nI would like to point out that the above is true for any\
    \ operating system which uses a monolithic kernel[6]. There are things microkernels\
    \ which have modules which get their own codebase. The GNU Hurd and QNX Neutrino\
    \ are two examples of a microkernel.\n\n# 3.1.6. Device Drivers\n\nOne class of\
    \ module is the device driver, which provides functionality for hardware like\
    \ a TV card or a serial port. On Unix, each piece of hardware is represented by\
    \ a file located in /dev named device file which provides the means to communicate\
    \ with the hardware. The device driver provides the communication on behalf of\
    \ a user process. The esl37.0 sound device driver may connect the /dev/sound device\
    \ file to the Ensoniq IS1370 sound card. A users program like mp3blaster can use\
    \ /dev/sound without knowing what kind of sound card is installed.\n\n# 3.1.6.1.\
    \ Major and Minor Numbers\n\nLet's look at some device files. Here are device\
    \ files which represent the first partitions of the primary hard drive:\n\n```\n\
    # ls -1 /dev/hda[1-3]\nbr-rw---- 1 root disk 3, 1 Jul 5 2000 /dev/hda1\br-rw----\
    \ 1 root disk 3, 2 Jul 5 2000 /dev/hda2\br-rw---- 1 root disk 3, 3 Jul 5 2000\
    \ /dev/hda3\n```\n\nNotice the column of numbers separated by a comma? The first\
    \ number is called the major number. The second number is the minor number. The\
    \ major number tells you which driver is used to access the hardware. Each driver\
    \ is assigned a unique major number; all device files with the same major number\
    \ are controlled by the same driver. All the above major numbers are 3, because\
    \ they're all controlled by the same driver.\n\nChapter 3. Preliminaries"
  - '[PAGE 22]


    # The Linux Kernel Module Programming Guide


    The minor number is used to distinguish between the various hardware controls.
    Returning to the example above, although all three devices are handled by the
    same driver they have unique minor numbers because the driver sees them as different
    pieces of hardware.


    Devices are divided into two types: character devices and block devices. The difference
    is that block devices have a buffer for requests, so they can choose the order
    in which to respond to the requests. This is important in the case of storage
    devices, where it''s faster to read or write sectors which are close to each other,
    rather than those further apart. Another difference is that block devices can
    only accept input and return output in blocks (whose size varies according to
    the device), whereas character devices are allowed to use as many or few bytes
    as they like. Most devices in the world are character, because they don''t need
    this buffering, and don''t operate with a fixed block size. You can tell whether
    a device file is a block device or a character device by looking at the first
    character in the output of -l. If it''s ''b'' then it''s a block device and ''c''
    then a character device. Here are some character devices (the serial ports):


    ```

    crw-rw---- 1 root dial,    64 Feb 18 23:34 /dev/tty0

    crw-r--r-- 1 root dial,    65 Nov 17 10:26 /dev/tty1

    crw-rw---- 1 root dial,    66 Jul  5 2000 /dev/tty2

    crw-rw---- 1 root dial,    67 Jul  5 2000 /dev/tty3

    ```


    If you want to see which minor numbers have been assigned, you can look at

    `/usr/src/linux/documentation/devices.txt`


    When the system is installed, all of those device files were created by the mknod
    command. To create a new device name with minor number 1 and 2, do mknod /dev/c
    12 2. You do not have to put your device files into /dev/, but by convention.
    Linux puts its device files in /dev, but it''s done by you. When creating a device
    file for testing purposes, it''s probably OK to place it in your working directory
    where you compile the kernel module. Just should be put in the right place when
    you''re writing the device driver.


    I would like to make a few points which are implicit from the above discussion,
    but I''d like to make them explicit in case. When a device file is accessed, the
    kernel uses the major number of the file to determine which driver should be used
    to handle the access. This means that the kernel doesn''t really need to use or
    know about the minor number. The driver itself is the only one that cares about
    the major number. It uses the minor number to distinguish between different pieces
    of hardware.


    By the way, I say ''hardware'', I mean a bit more than just a PCI card that you
    can hold in your hand. Look at these two examples:


    ```

    $ ls -l /dev/fd0 /dev/fd01680

    brw-rw---- 1 root floppy      2, 0 Jul 2000 /dev/fd0

    brw-rw---- 1 root floppy      2, 44 Jul 2000 /dev/fd01680

    ```


    Now you can look at these two device files and know that they are block devices
    and are handled by same driver (block major 2). You might even be aware that these
    represent both your floppy drive, even if you only have one floppy drive. Why
    two files? One represents the floppy drive with 1.68 MB of storage, and corresponds
    to what some people call a ''superformatted'' disk. One that holds more data than
    a standard floatted floppy. So here''s a case where two device files with different
    minor number actually represent the same piece of physical hardware. So just be
    aware that the word ''hardware'' in our discussion can mean something very abstract.


