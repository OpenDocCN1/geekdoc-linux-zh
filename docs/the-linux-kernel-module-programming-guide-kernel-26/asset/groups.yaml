- md: "\n# The Linux Kernel Module Programming Guide\n\nHere's an example of such\
    \ a kernel module.\n\n# Example 2–8. start.c\n\n```\n/*\n * start.c - Illustration\
    \ of multi-file modules\n */\n\n#include <linux/kernel.h>    /* We're doing kernel\
    \ work */\n#include <linux/module.h>     /* Specifically, a module */\n\nint init_module(void)\n\
    {\n    printk(KERN_INFO \"Hello, world - this is the kernel speaking\\n\");\n\
    \    return 0;\n}\n\n```\n\nThe next file:\n\n# Example 2–9. stop.c\n\n```\n/*\n\
    \ * stop.c - Illustration of multi-file modules\n */\n\n#include <linux/kernel.h>\
    \    /* We're doing kernel work */\n#include <linux/module.h>     /* Specifically,\
    \ a module */\n\nvoid cleanup_module()\n{\n    printk(KERN_INFO \"Short is the\
    \ life of a kernel module\\n\");\n}\n\n```\n\nAnd finally, the make:\n\n# Example\
    \ 2–10. Makefile\n\n```makefile\nobj-m += hello-1.0\nobj-m += hello-2.0\nobj-m\
    \ += hello-3.0\nobj-m += hello-4.0\nobj-m += hello-5.0\nobj-m += startstop.o\n\
    startstop-objs := start.o stop.o\n\nall:\n\tmake -C /lib/modules/$(shell uname\
    \ -r)/build M=$(PWD) modules\n\nclean:\n\tmake -C /lib/modules/$(shell uname -r)/build\
    \ M=$(PWD) clean\n```\n\nThis is the complete Makefile for all the examples we've\
    \ seen so far. The first lines are nothing special, but for the last example we\
    \ will need two lines. First we invent an object name for our combined module,\
    \ second we tell make what object files are part of that.\n\n# Chapter 2. Hello\
    \ World\n\n# The Linux Kernel Module Programming Guide\n\n## 2.8. Building modules\
    \ for a precompiled kernel\n\nObviously, we strongly suggest you to recompile\
    \ your kernel, so that you can enable a number of useful debugging features, such\
    \ as force unloading (MODULE_FORCE_UNLOAD): when this option is enabled, you can\
    \ force the kernel to unload a module when it believes it is unsafe, via **rmmod\
    \ -f module**. This option can save you a lot of time and many reboots in the\
    \ development of a module.\n\nNevertheless, there are a number of cases in which\
    \ you might want to load your module into a precompiled running kernel, as the\
    \ ones shipped with common Linux distributions, or a kernel you have compiled\
    \ in the past. In certain circumstances you could compile and insert a module\
    \ into a running kernel which you are not allowed to recompile, or on a machine\
    \ that you need to reboot. If you can't think of a case that will force you to\
    \ use modules for a precompiled kernel you might want to skip this and treat the\
    \ rest of this thing as a big bother.\n\nNow, if you install a kernel source tree,\
    \ use it to compile your kernel module and you try to insert your module into\
    \ the kernel, in most cases you would obtain an error as:\n\n```\ninsmod: error\
    \ inserting 'poet_atkm.ko': -1 Invalid module format\n```\n\nLess exceptional\
    \ is equal to /var/log/messages:\n\n```\nJun 22:07:54 localhost kernel: poet_atkm:\
    \ version magic '2.6.5-1.358custom 686 REGPARM 4KSTACK gcc-3' should be '2.6.5-1.358\
    \ 686 REGPARM 4KSTACK gcc-3'\n```\n\nIn other words, your kernel refuses to load\
    \ because your module version strings (more precisely, version strings) do not\
    \ match. Starting with **vermagic**: Version data is inserted into your module\
    \ object in the form of a static string, when linked against the **init/vermagic.c**\
    \ file. To inspect version magic and other strings in a given module, issue the\
    \ **modinfo module.ko** command:\n\n```bash\n[root@cmmons]# modinfo hello-ko\n\
    license:\nGPL\nauthor:Peter Jay Salzman <p@dirac.org>\ndescription:\nA sample\
    \ driver\nvermagic:\n2.6.5-1.358 686 REGPARM 4KSTACK\ndepends:\n```\n\nTo overcome\
    \ this problem we could use the **--vermagic** option, which is potentially unsafe,\
    \ and unquestionably unacceptable in production modules. Consequently, we want\
    \ to compile our module in an environment which was identical to the one in which\
    \ your precompiled kernel was built. How to do this, is the remainder of this\
    \ chapter.\n\nFirst of all, make sure a kernel source tree is available, having\
    \ exactly the version as your current kernel. Then, find the configuration file\
    \ which was used to compile your precompiled kernel. Usually, this is available\
    \ in your current **/boot** directory, make a link like **config-2.6.x**. You\
    \ might just want to copy it to your kernel source tree: **cp /boot/config-uname\
    \ -r /usr/src/-uname -rf/.\n\nFocus your attention on this error message: a closer\
    \ look at the version strings suggests that, even with two configuration files\
    \ which are the same, a slight difference in the version could be possible, and\
    \ it is sufficient to prevent insertion of the module into the kernel. That difference,\
    \ namely the **custom** string which appears in the module's version magic and\
    \ not in the kernel's, is due to\n\n# Chapter 2. Hello World\n\n# The Linux Kernel\
    \ Module Programming Guide\n\nmodification with respect to the original, in the\
    \ makefile that some distribution include. Then, examine your /usr/src/linux/Makefile,\
    \ and make sure that the specified version information matches exactly the one\
    \ used for your current kernel. For example, makefile could start as follows:\n\
    \n```makefile\nVERSION = 2\nPATCHLEVEL = 6\nSUBLEVEL = 5\nEXTRAVERSION = -1.358custom\n\
    ```\n\nIn this case, you need to restore the value of symbol EXTRAVERSION to -1.358.\
    \ We suggest to keep a backup copy of the makefile used to compile your kernel\
    \ available in /lib/modules/2.6.5-1.358/build. A simple cp /lib/modules/~uname\
    \ -r /build/Makefile /usr/src/linux-uname -r should suffice. Additionally, if\
    \ you already started a kernel with the previous (wrong) Makefile, you should\
    \ also run `make`, or directly modify symbol UTS_RELEASE in file /usr/src/linux-2.6.x/include/linux/version.h\
    \ according to contents of file /lib/modules/2.6.x/build/include/linux/version.h.\n\
    \n# The Linux Kernel Module Programming Guide\n\n# Chapter 3. Preliminaries\n\n\
    ## 3.1. Modules vs Programs\n\n### 3.1.1. How modules begin\n\nA program usually\
    \ begins with main(), executes a bunch of instructions and terminates. Kernel\
    \ modules work a bit differently. A module always begins with either init_module\
    \ or cleanup_module. I'll try my best to use the 'entry function' and 'exit function',\
    \ but if I slip and simply refer to them as init_module and cleanup_module, I\
    \ think you'll know what I mean. Every module must have an entry function and\
    \ an exit function.\n\n### 3.1.2. Functions available to modules\n\nProgrammers\
    \ use functions they don't define all them. A prime example is printf(). You use\
    \ these library functions which are provided by the standard library, libc. The\
    \ definitions for these functions don't actually enter your program until the\
    \ linking stage, which ensures that the code (for printf()) is available.\n\n\
    Kernel modules are here too. In the hello world example, you might have noticed\
    \ that we used a function, print() but didn't include a standard I/O library.\
    \ Because modules are object files whose symbols get resolved. The definition\
    \ for the symbols comes from the kernel itself; the only functions you can use\
    \ are the ones provided by the kernel. If you're curious about what symbols are\
    \ exported by your kernel, take a look at /proc/kallsyms.\n\nOne to keep in mind\
    \ is the difference between library functions and system calls. Library functions\
    \ are higher level, run in user space and provide a more convenient interface\
    \ for the programmer to the functions that do the real work—system calls Calls\
    \ run in kernel mode on the user's behalf and are provided by the kernel itself.\
    \ The library function printf() may look like a very general printing function,\
    \ but it really formats the data into strings and writes the string data using\
    \ the low-level system call write(), which then sends the data to standard output.\n\
    \nWould you like to see what system calls are by printf()? It's easy! Compile\
    \ the following program:\n\n```c\n#include <stdio.h>\nint main(void) {\n    printf(\"\
    hello\"); return 0;\n}\n```\n\nwith gcc -Wall -o hello hello.c Run the executable\
    \ with strace /hello. Are you impressed? Every line corresponds to a system call.\
    \ trace[4] is a handy program that gives you details about what system calls a\n"
