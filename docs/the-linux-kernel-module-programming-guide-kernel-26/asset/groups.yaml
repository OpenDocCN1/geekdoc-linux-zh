- md: "\n# Foreword\n\n# 1. Authorship\n\nThe Linux Kernel Module Programming Guide\
    \ was originally written for the 2.2 kernels by Ori Pomerantz. Eventually, Ori\
    \ no longer had time to maintain the document. After all, the Linux kernel is\
    \ a fast moving target. Peter Jay Salzman took over maintenance and updated it\
    \ for the 2.4 kernels. Eventually, Peter no longer had time to follow developments\
    \ with the 2.6 kernel, so Michael Burian became a co-maintainer to update the\
    \ document for the 2.6 kernels.\n\n# 2. Versioning and Notes\n\nThe Linux kernel\
    \ is a moving target. There has always been a question whether the LKMPG should\
    \ remove deprecated information or keep it around for historical sake. Michael\
    \ Burian and I decided to create a new branch of the LKMPG for each new stable\
    \ kernel version. So version LKMPG 2.4.x will address Linux kernel 2.4 and LKMPG\
    \ 2.6.x will address Linux kernel 2.6. No attempt will be made to archive historical\
    \ information; a person wishing this information should read the appropriately\
    \ versioned LKMPG.\n\nThe source code and discussions should apply to most architectures,\
    \ but I can't promise anything. One exception is Chapter 12, Interrupt Handlers,\
    \ which should not work on any architecture except for x86.\n\n# 3. Acknowledgements\n\
    \nThe following people have contributed corrections or good suggestions: Ignacio\
    \ Martin, David Porter, Daniele Paolo Scarpazza, Dimo Velev, Francois Audeon and\
    \ Horst Schirmeier.\n\n## Chapter 1. Introduction\n\n### 1.1. What Is A Kernel\
    \ Module?\n\nSo, you want to write a kernel module. You know C, you've written\
    \ a few programs to run as processes, and now you want to get where the real action\
    \ is, where a single wild pointer can wipe out your file system and a core dump\
    \ needs to be loaded.\n\nWhat exactly is a kernel module? Modules are pieces of\
    \ code that can be loaded and unloaded into the kernel upon demand. They extend\
    \ the functionality of the kernel without the need to reboot the system. For example,\
    \ one type of module is the device driver, which allows the kernel to access hardware\
    \ connected to the system. Without modules, we would have build monolithic kernels\
    \ and add any new functionality directly into the kernel image. Being larger kernels,\
    \ this has the disadvantage of requiring us to rebuild and reboot the kernel every\
    \ time we want new functionality.\n\n### 1.2. How Do Modules Get Into The Kernel?\n\
    \nYou can see what modules are already loaded into the kernel by running `lsmod`,\
    \ which gets its information by reading the file `/proc/modules`.\n\nHow these\
    \ modules find their way into the kernel? When the kernel needs a feature that\
    \ is not resident in the kernel, the kernel daemon kmod[1] executes modprobe to\
    \ load the module. modprobe is passed in one of two forms:\n\n- * A module name\
    \ softdog or ppp.\n- A more generic identifier like char-major-10-30.\n\nIf modprobe\
    \ is handed a generic identifier, it first looks for strings in the file `/etc/modprobe.conf[2]`\
    \ If it finds an alias line like:\n\n```\nalias char-major-10-30 softdog\n```\n\
    \nit knows the generic identifier refers to the module softdog.ko.\n\nNext, modprobe\
    \ looks through the file `/lib/modules/version/modules.dep`, to see if other modules\
    \ must be loaded before the requested module is loaded. This file is created by\
    \ depmod -a and contains module dependencies. For example, mdsos requires the\
    \ fat.ko to be already loaded into the kernel. The module has a dependency on\
    \ another module if the other module defines symbols (variables or functions)\
    \ that the requested module uses.\n\nLastly, modprobe uses insmod to load any\
    \ prerequisite modules into the kernel, and then the requested module. insmod\
    \ directs to `/lib/modules/version/[3], the standard directory for modules. insmod\
    \ is intended to be fairly dumb about the location of modules, whereas modprobe\
    \ is aware of the location of modules, how to figure out the dependencies and\
    \ load the modules in the right order. So for example, if you wanted to load the\
    \ mdsos module, you would have to run:\n\n```\ninsmod /lib/modules/2.6.11/kernel/fs/fat.ko\n\
    insmod /lib/modules/2.6.11/kernel/fs/mdsos.ko\n```\n\n# The Linux Kernel Module\
    \ Programming Guide\n\nor:\n\n```\nmodprobe msdos\n```\n\nWhat we've seen here:\
    \ **insmod** requires you to pass the full pathname and to insert the modules\
    \ in the right order, while **modprobe** just takes the name, without any extension,\
    \ and figures out all it needs to know by parsing /lib/modules/version/modules.dep.\n\
    \nLinux distros provide modprobe, insmod and depmod as a package called module–init-tools.\
    \ In previous versions that package was called modules. Some distro also set up\
    \ wrappers that allow both packages to be installed in parallel and do the right\
    \ thing in order to be able deal with 2.4 and 2.6 kernels. Users should not need\
    \ care about the details, as they're running recent versions of those those.\n\
    \nNow you know how modules get into the kernel. There's a bit more to the story\
    \ if you want to write your own modules which depend on other modules (calling\
    \ this 'stacking modules'). But this will have to wait for a future chapter. We've\
    \ got to cover more before addressing this high-level issue.\n\n### 1.2.1. Before\
    \ We Begin\n\nBefore we induce code, there are a few issues we need to cover.\
    \ Everyone's system is different and everyone has their own groove. Getting your\
