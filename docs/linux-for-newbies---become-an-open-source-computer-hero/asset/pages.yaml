  md: '# Linux for Newbies


    What''s great about Linux is that it runs on so many different platforms. It runs
    not only on PCs, but also on Macs and mobile devices (the most popular Linux on
    mobile devices in Android from Google).


    Unlike Bill Gates, Linus is not a billionaire, despite Linux running on millions
    of computers worldwide, but according to research done by Rever by Computer, he
    is the most famous computer programmer on the planet.


    The process of installing Linux became much simpler at the beginning of this century
    and nowadays everyone can easily install it without any extra computer knowledge
    as you are going to find out soon. Most Linux distributions nowadays come in Live
    CD format so you can run it straight from a cd without installing it, without
    making any changes to your system. This is another thing that neither Windows
    nor Mac offer.


    Linux is also the most popular operating system on Supercomputers. As of 2011,
    more than 90% of the supercomputers run Linux.'
