    ![](img/92b26efba41763db114a1030df1a2d60_157_1.png)


    156'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Linux for Newbies


    11 When done scanning, Digikam opens with your library. Here''s an overview of
    Digikam:


    ![](img/92b26efba41763db114a1030df1a2d60_158_0.png)


    Menu at the top of the application:


    ![](img/92b26efba41763db114a1030df1a2d60_158_1.png)


    Photo albums on the left:


    ![](img/92b26efba41763db114a1030df1a2d60_158_2.png)


