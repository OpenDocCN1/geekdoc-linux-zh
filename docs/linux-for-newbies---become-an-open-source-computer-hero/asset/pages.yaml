  md: '# Linux Directories Guide


    If you are a new user that moved to Linux from Windows, you need to be aware of
    some differences between the operating systems.


    Here are some things to have in mind:


    +   - Linux is a case-sensitive operating system, Windows is not, i.e. Linux will
    treat "image.txt" and "IMAGE.txt" as seperate files


    +   - Linux doesn''t use letters for drives like Windows, i.e. on Windows the
    primary hard drive is C., CD/DVD drive is D: or E etc


    +   - Linux was created as a multi-user network operating system, unlike Windows
    which evolved from DOS as a single-user operating system for home users


    +   - Linux users cannot change system settings, only a super user (root) can,
    you''ll be prompted for a password to change system settings. Windows users can
    easily change system settings without any passwords.


    +   - Linux uses a different file system from Windows: Linux – ext3, Windows –
    FAT32 or NTFS.


    NOTE: The differences in file systems do not mean that you cannot copy the files
    between Windows and Linux (using a USB memory as an example). Linux understands
    FAT32 and NTFS formatted USB devices.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Linux for Newbies


    Lack of drive letters in Linux (and Mac OS) is one of the big differences between
    Windows and Linux/Mac OS. There is a hierarchy in Linux – a tree directory – beginning
    with the root directory indicated by a slash (/).


    Here’s the directory tree in the File Manager:


    ![](img/92b26efba41763db114a1030df1a2d60_90_0.png)


    And here''s a quick overview of the directories:


    +   - bin - this directory contains executable programs. It contains the important
    programs that the system needs to operate


    +   - boot - this is the directory that contains the heart of the Linux operating
    system – the Linux kernel. Linux kernel is typically called ‘vmlinuz’


    +   - etc - this directory contains system configuration files, i.e. user passwords,
    screen resolution settings, etc'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# Linux for Newbies


    +   **lib** - this directory contains library files that are used by the executable
    programs, lib they are equivalent to Windows'' DLL libraries


    +   **home** - this directory contains a subdirectory for each user for personal
    data files, i.e. /home/marer or /home/jon. Other users can''t save files here


    +   **mnt** - a directory for temporarily mounted devices, i.e. cd/dvd drives
    or on some dual-boot systems Windows partition


    +   **usr** - a directory storing programs, it''s an equivalent of Program Files
    directory on Windows


    # Compress and Extract Files


    Compressing and extracting files in Linux is very easy. And the good news is that
    compressing files has been a part of Linux for many years unlike in other operating
    systems. You don''t need to install any software to start compressing files or
    folders!


    There are three main compressing formats:


    zip, rar, and tar.


    **Tar** is a very popular in Linux, it is often used for transferring files.


    Compressing files/folders is really easy.'
  merge: -1
