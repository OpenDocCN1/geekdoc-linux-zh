    ![](img/92b26efba41763db114a1030df1a2d60_97_0.png)


    It is very simple and easy to use as well as lightweight.


    First you need to install it, so go to the KpackageKit and type Docky in the search
    box. Accept it, install it and start using it in a matter of minutes. Once it''s
    installed, launch it and it should appear on the bottom of your screen.


    # Customise the dock


    To customise Docky, click on the Docky icon on the left edge of the dock:


    ![](img/92b26efba41763db114a1030df1a2d60_97_1.png)


    This will open the Docky Settings dialogue box:


