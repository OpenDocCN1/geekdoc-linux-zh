  md: '# 10 Linux equivalents of Windows software


    One of the challenges many Windows users have when moving to Linux is finding
    the applications that will be the Linux equivalents to the applications they use
    on Windows.


    I know this frustration when you move to another operating system and you want
    to find the applications you want to use and some of them don''t exist on another
    operating system.


    Fortunately, many applications (primarily open-source applications) run on many
    operating systems, so you will find the names of some of the applications on both
    ''sides'' - both operating systems (or in many cases on Windows, Linux, and Mac
    OS as well).


    That''s why this chapter is deicated to doing just that – giving you the Linux
    equivalents of Windows applications:


    ![](img/92b26efba41763db114a1030df1a2d60_200_0.png)'
  merge: -1
