- img_proc: true
  md: '# Linux for Newbies


    There are many office suites out there and many business (as well as personal
    users) benefited from the development of so many open-source office suites. Many
    businesses benefit from not having to pay licensing fees using the office suites
    when they move away from Microsoft Office and start using OpenOffice or LibreOffice.
    Many office suites are available on Linux, we''re going to focus on LibreOffice
    as it comes bundled with Ubuntu and many other Linux distributions.


    Something I''d like you to understand about LibreOffice and OpenOffice is that
    they are not 100% compatible with Microsoft Office and that''s because of the
    proprietary file formats used by Microsoft Office suite. However, LibreOffice
    and OpenOffice are highly compatible with Microsoft Office documents and they
    can easily open .doc and .xls files as well as save them.


    Here are some file formats supported by LibreOffice:


    +   .doc, .docx, .ppt, .pptx, .xls, .xlsx, .rtf,


    as well as Export to PDF and SWF (Adobe Flash).


    You may have been wondering what the term ''office suite'' means so let me explain.
    We talk about an ''office suite'' when we deal with a suite of two or more application
    that are used for creating documents, text documents, spreadsheets, presentations,
    databases etc. Some office suites may include an email client as well.


    For the majority of users, LibreOffice will meet most of your needs. You can easily
    create documents and spreadsheets in the same way you do it in Microsoft Office
    and you can save them as .doc and .xls files. The hurdles you may experience may
    happen when trying to import and/or open files that were created with Microsoft
    Office ( I haven''t had any problems so far ).'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'LibreOffice''s user interface closely resembles the one of Microsoft Office
    so you will find switching to LibreOffice very easy. This similarity helps users
    in switching and they very quickly get used to the new office suite.


    Of course, the reason why we''re talking about LibreOffice here is not its similarity
    to Microsoft Office. Benefits of switching to LibreOffice are:


    +   - it''s FREE,


    +   - it supports a huge number of file formats, and


    +   - it can export to many different file formats.


    LibreOffice consists of many productivity applications used to create documents,
    spreadsheets, databases, and presentations, and as more as shown below:


    ![](img/92b26efba41763db114a1030df1a2d60_112_0.png)'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'Here are the components of LibreOffice suite:


    ![](img/92b26efba41763db114a1030df1a2d60_113_0.png)


    Word Processor


    **LibreOffice Writer** – a word processing program used to create and format text
    documents (equivalent to Microsoft Word).


    ![](img/92b26efba41763db114a1030df1a2d60_113_1.png)


    Spreadsheet


    **LibreOffice Calc** – a spreadsheet program used to create and format spreadsheets
    (equivalent to Microsoft Excel).


    ![](img/92b26efba41763db114a1030df1a2d60_113_2.png)


    Presentation


    **LibreOffice Impress** – a presentation program used to create and customise
    slideshows (equivalent to Microsoft PowerPoint).


    ![](img/92b26efba41763db114a1030df1a2d60_113_3.png)


    Formula Editor


    **LibreOffice Math** – a math formula editor used to write mathematical formulas,
    includes a number of symbols and math fonts that are not easily included in word
    processors.


    **LibreOffice Base** – a database program used to create databases (equivalent
    to Microsoft Access).'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'LibreOffice Draw – a graphics program used to create graphics to be used in
    the documents created with LibreOffice.


    You can access LibreOffice suite by choosing Start > Applications > Office as
    shown below:


    ![](img/92b26efba41763db114a1030df1a2d60_114_0.png)'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'Let me give you a brief history of LibreOffice:


    LibreOffice has been created by a group called “The Document Foundation” - a group
    consisting of members of the OpenOffice.org project.


    The reason why LibreOffice was formed at the beginning of 2011 was because Oracle
    Corporation purchased Sun Microsystems ( company behind OpenOffice ) and there
    were concerns that Oracle would discontinue OpenOffice.org or place restrictions
    on the development of OpenOffice as an open-source suite as it had done in the
    past with Sun’s OpenSollaris.


    In April 2011, Oracle announced terminating the commercial development of OpenOffice.org.


    LibreOffice became very popular, since its initial release at the beginning of
    2011 it has already been downloaded almost 8 million times (as of end of September
    2011).'
  merge: -1
  pgno: 115
