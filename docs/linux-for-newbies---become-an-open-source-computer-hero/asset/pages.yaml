  md: '# 1 Why Linux and a Brief history of Linux


    Welcome to Linux – an amazing free open-source operating system with a number
    of free applications.


    Let''s start with some history to give you some background about Linux and how
    it all started.


    The history of Linux begins back in 1991, when Linus Torvalds, a student at the
    University of Helsinki at that time, came up with an idea for a new operating
    system that would suit him better than Windows. He wanted to create a new operating
    system that would be based on UNIX. Unix is a powerful operating system that was
    developed back in the 70s, but it had one disadvantage – it was expensive (nowadays
    it is not just Linux that is based on Unix, but also Mac OS). So Linux decided
    to create his own operating system based on Unix and that how Linux was born!


    ![](img/92b26efba41763db114a1030df1a2d60_16_0.png)


    The Linux logo you can see here on the right is a penguin Tux - created by Alan
    Cox and refined by Linux Torvalds.


    The first official version of Linux appeared in 1994 (Linux 1.0). One of the fantastic
    features of Linux back then (and still nowadays) was that it ran smoothly on the
    less powerful computers, it didn''t have (and still doesn''t) such high demands
    to run it like other operating systems. It could easily run on a 386 processor
    with less than 2MB of RAM.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Linux for Newbies


    One of the fantastic decisions Linux made was to release Linux as a free operating
    system, so anyone could install it for free and distribute it or even change it.
    With time brought a number of different Linux distributions. Nowadays there are
    hundreds of various Linux distributions. Linux made it clear at the beginning
    that Linux has to be free, not proprietary. He made it Open Source. This is something
    amazing about Linux. Everyone can change it, create their own Linux distributions
    and distribute them.


    Because Linux became an Open Source software, not proprietary, this started a
    quiet revolution. People started contributing to Linux and it lead to improvements
    and innovations. That''s how Linux became popular.


    Let me give you one example of the improvements in Linux and one of my favourite
    features. When using Linux, you can work with a number of virtual desktops, so
    you could separate your work – you can work in a web browser on one desktop, work
    with Libre Office on another desktop, and so on. Basically, you can work on many
    desktops without all the clutter you got on other operating systems like Windows
    or Mac OS. And to make it more interesting, Linux has had this feature for many
    years! I still haven''t seen anything like it on Windows.


    Because Linux is Open Source, it is open to changes and improvements unlike proprietary
    operating systems like Windows or Mac OS. With the proprietary operating systems,
    only a selected group of people knows the insides of the system and only they
    can make any changes, improvements to it. Proprietary systems are a bit like closed,
    sealed box.


    At the time when Linux was born, there were two major operating systems, two major
    competitors – Windows and Mac. On PCs it was actually just Windows as Macs were
    very expensive (they still are). At that time, consumers couldn''t afford Macs
    so Windows sneaked into every corner of the world. But this starting slowly to
    change at the beginning of the 90s with the release of Linux.


    In August 1991, Linus posted a famous post about the birth of Linux, that became
    famous over the internet. Here is just a part of it, the most famous one perhaps:'
