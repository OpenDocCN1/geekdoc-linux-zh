  md: '# Watching Videos


    Linux recognises many video formats. You may have heard about codecs – encoders
    and decoders of video. Most of them are proprietary, but there are some free codecs
    as well.


    The most popular video formats are:


    +   - .avi – Microsoft format

    - .wmv – another Microsoft format

    - .mov – QuickTime format (Apple)

    - .mpeg – MPEG format


    and recently a very popular:


    +   - .mkv – Matroska, an open-source, open-standard multimedia container becoming
    very popular for videos as it supports HD video


    Due to licensing restrictions Linux doesn''t support natively any proprietary
    video codecs. However, if you installed third-party software during Linux installation,
    you will be able to play many video formats. Also, when you install one of the
    video players, like Mplayer, you will be able to easily play many video file formats.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# MPlayer is a very interesting video player that I have used for a number
    of years.


    It supports a wide selection of file formats.


    Here''s the information from MPlayer''s website:


    It plays most MPEG/VOB, AVI, Ogg/OGM, VIVO, ASF/ASF, WMV, QT/MOV/MP4, RealMedia,
    Matroska, NUT, NuppelVideo, FLI, YUV4MPEG, FILM, RoQ, PVA files, supported by
    many native, XAnim, XAnim, and Win32 DLL codecs.

    You can watch VideoCD, SVCD, DVD, 3ivx, DivX 3/4/5, WMV and even H.264 movies.


    So MPlayer will easily play all sorts of video files.


    Here''s a screenshot of MPlayer playing an .mov video from a digital SLR camera:


