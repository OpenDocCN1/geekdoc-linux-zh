  md: '# Get started with an Email Client – Thunderbird


    There are a number of email clients out there and you may have used some Windows-based
    email clients in the past. Some of them are cross-platform so they work on both
    Windows and Linux (even Mac OS) and one of them is Mozilla Thunderbird – an email
    client developed by the same Mozilla Foundation organisation that developed Firefox.


    Thunderbird is not installed with Kubuntu by default, so you''ll need to install
    it yourself if it''s a very straightforward process.


    To install Thunderbird go to Start > Applications > System > Software Management.
    When KPackageKit opens, type Thunderbird in the search box at the top and press
    Enter:


