- img_proc: true
  md: '# Linux for Newbies


    Images within an album on the right:


    ![](img/92b26efba41763db114a1030df1a2d60_159_0.png)


    Digikam allows downloading images from digital cameras. To do that, choose **Import
    > Cameras**. If Digikam recognises your camera, like in here it recognised my
    Canon camera, choose the name that appears on the list:


    ![](img/92b26efba41763db114a1030df1a2d60_159_1.png)


    This will open the **Import** dialogue box where you can preview the images before
    you import them:'
  merge: -1
  pgno: 159
- img_proc: true
  md: '![](img/92b26efba41763db114a1030df1a2d60_160_0.png)


    If you look at the bottom of the import dialogue box, you will notice something
    amazing about Digikam – it displays available space on the memory card(!) and
    available space in your Library(!).


    Select the images you want to download by clicking on them and click Download
    Selected.


    Select Album dialogue box will appear. Choose where you want images to be downloaded
    and click OK.


    The download will start, you will see a progress bar at the bottom of the dialogue
    box and when it’s done, it will read Ready in the bottom left corner.


    Now when you navigate to Digikam you will see the new images! As simple as that!


    Congratulations! You have downloaded images from the camera into Digikam. Well
    done.'
