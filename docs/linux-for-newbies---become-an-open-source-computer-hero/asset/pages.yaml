  md: '# Linux for Newbies


    Choose the theme from the drop-down menu (choose the one that suits you).


    Next, you''ve got the Dock Configuration section within the same dialogue.


    That''s where you can configure hiding behaviour, i.e. you can set dock to hide
    automatically and reappear when the cursor moves close to the edge.


    Here''s the drop-down menu:


    ![](img/92b26efba41763db114a1030df1a2d60_99_0.png)


    98'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'And here''s what the options do:


    **None** – the dock will always be visible


    **Autohide** – the dock will always hide unless unless you move your cursor over
    the area where the dock resides (bottom of the screen)


    **Intellihide** - will hide the dock when an application is opened and the dock
    is obstructing the application. When an application is closed or resized the dock
    will reappear.


    **Window Dodge** – the dock will hide if it obstructs any window


    I like Intellihide and that''s the setting I use. If you want the dock to appear
    all the time, set Hiding to None.


    In the next section below the Hiding drop-down menu, you can set the zoom (how
    big do you want the icons to become when you place your cursor over them) and
    you may want to check 3D Background (very nice feature, it looks very impressive).


    When done, click **Close**.


    # Add an application to the dock


    Here''s how you can add an application to the dock.


    With the dock running, go to the **Start** menu and find an application you want
    to add.


    Once you find it, click on it and holding the mouse button down drag it onto the
    dock.'
