- img_proc: true
  md: '![](img/92b26efba41763db114a1030df1a2d60_30_0.png)


    Here are some of the options as shown on the screenshot:


    +   - **Start Kubuntu** – this option allows you to start Kubuntu from the disc
    without making any changes to your operating system (one of the amazing features
    of Linux that cannot be found on other operating systems, you start it from the
    disc,, see if you like it and then decide whether you want to install it, pretty
    impressive).


    +   - **Install Kubuntu in text mode** – this mode allows you to install Kubuntu
    and perform certain specialist installations.


    +   - **Check disc for defects** – you can check the disc for any problems/defects
    before you start installing Linux. If it detects any errors on the disc, you may
    want to decide to download the fresh Linux installation from the vendors website.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Linux for Newbies


    - Test Memory – you can run a check on the memory to see if any RAM memory chip
    is faulty so you could replace it.


    - Boot from first hard disk – you can use this option if you left the CD in the
    drive unintentionally and you want to start your currently installed operating
    system.


    The option you''re going to use here is to start Linux (the first option), so
    just select this option and press Enter on your keyboard.


    Linux will now start by loading all the components from the CD into your computer’s
    memory (RAM) and in just a moment you will be presented with the KDE desktop environment.


    You can now decide whether you want to try it first or install it as shown on
    the screenshot below:


    ![](img/92b26efba41763db114a1030df1a2d60_31_0.png)'
  merge: -1
