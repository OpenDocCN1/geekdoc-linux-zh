  md: '# Introduction


    Welcome to this book. This book will guide you through the world of Linux and
    I am going to show you how to install one of the most popular distributions of
    Linux – Kubuntu. This book will cover Kubuntu version 11.04.


    I will try to challenge you here, because you''re going to discover some new things
    here, you will discover how the open-source software opens new possibilities and
    how it is developed. First of all, you need to change the way you look at the
    software, Linux opens new possibilities as a free operating system, free to download,
    free to install, and you feel free to sell it if you want.


    ![](img/92b26efba41763db114a1030df1a2d60_10_0.png)


    I know it''s hard to understand at the beginning especially as you probably have
    been using proprietary (not free) operating systems for some time (you probably
    are a Windows or Mac user). What most people don''t know is when you purchase
    a proprietary software, you are not really the owner of the software, you are
    given a license to use it. That''s it. Linux also has a license, but it''s different
    from proprietary software. Linux is distributed under the GNU General Public license
    (GPL), which basically means that the software is open to use and modify by anyone,
    and I mean really anyone.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Linux for Newbies


    There are a number of different Linux distributions. Let me give you a quick overview
    of the most popular ones:


    # Ubuntu/Kubuntu


    Quite a new, but at the same time powerful distribution. It quickly became one
    of the most popular Linux distributions (according to many sources it is the most
    popular Linux distribution at the moment - as of December 2011). The release cycle
    is six months for distribution updates and a number of applications that can be
    installed from their repositories is impressive.


    ![](img/92b26efba41763db114a1030df1a2d60_11_0.png)


    # Open SUSE


    Another distribution which have received very positive feedback from the community.
    It has easy to use configuration tools, YAST, with many packages available. I
    have used Open SuSe in the past and I was very happy with it. Like most other
    Linux distributions it includes both Gnome and KDE desktop environments. Open
    Suise is being developed in Germany.


    ![](img/92b26efba41763db114a1030df1a2d60_11_1.png)


    # Mandriva


    Mandriva, formerly known as Mandrake, is being developed in France. It became
    very popular as an easy Linux distribution near the end of the twentieth century.
    It is based on Red Hat distribution. It is known for its simplicity of use and
    for an easy to use installer.


    ![](img/92b26efba41763db114a1030df1a2d60_11_2.png)'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Linux for Newbies


    Now, a few words about Kubuntu.


    Kubuntu has a brother Ubuntu. They are both developed by the same vendor. The
    major difference between Ubuntu and Kubuntu is that they come with different graphical
    environments: Ubuntu with Gnome and Kubuntu with KDE. Both distributions are being
    released at the same time, so if you decide that you want Ubuntu with Gnome, you
    can also download and install version 11.04.


    Kubuntu/Ubuntu come from one of the best and oldest Linux distributions – Debian.
    If you have never heard about Kubuntu or Debian, that''s ok. Most people haven''t.
    Debian is perceived as one of the most secure and stable Linux distributions.
    Because Kubuntu comes from Debian, all Debian software will run on it, so you
    can choose from thousands of free applications! Some reasons why I use Kubuntu
    ( I have used many different distributions in the past ) are because it is easy
    to install and use, easy to install additional software and it is a powerful operating
    system. If you haven''t used Linux before, do not worry. You will find Linux easy
    to get used to. Just have a look at a screenshot of my desktop.


    ![](img/92b26efba41763db114a1030df1a2d60_12_0.png)'
  merge: -1
