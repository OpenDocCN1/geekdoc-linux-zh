  md: '# # 5 Get up to speed with Linux


    Get started with a Web Browser - Firefox


    Everyone is connected to the internet nowadays and the web browser is one of the
    most used applications. There are many web browsers out there and one of the most
    popular ones is Mozilla Firefox. Firefox is also installed with Kubuntu, so you
    can start using it straight away.


    ![](img/92b26efba41763db114a1030df1a2d60_66_0.png)


    Firefox is a great alternative to Internet Explorer for Windows users and since
    its beginning in 2004 it reached a very big market share (at the moment of writing
    – Dec 2011 – it is the second most popular web browser with around 42% market
    share worldwide. One of the many reasons behind the huge popularity of Firefox
    is a wealth of extensions and plug-ins, as well as many multimedia codecs.


    To access Firefox go to **Start menu > Applications > Internet > Firefox**. As
    you start it for the first time, you''ll be prompted to go through the quick start
    up process and in just a moment you can start enjoy surfing the web.'
