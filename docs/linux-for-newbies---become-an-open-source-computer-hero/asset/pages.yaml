  md: '# 3 Linux Installation using Kubuntu 11.04


    During the installation process Kubuntu will install a loader called GRUB on your
    hard drive so that you could choose which operation system you want to start when
    starting the computer (if you have one operating system installed already and
    you want to keep it). But first, you''re going to start your computer from a CD.


    Most computers can be started from a CD. You could do it by setting your BIOS
    to boot from CD, but most computers will give you a quick access to Boot Menu
    as the computer starts (you will usually see the computer manufacturer''s logo
    when you start the computer and there should be a keyboard shortcut on the screen,
    i.e. on Dell laptops it''s in the corner of the screen and it''s the F12 keyboard
    shortcut to access Boot Menu).


    The screenshot on the next page show the example on my laptop:'
  merge: -1
  pgno: 28
- img_proc: true
