  md: '# LINUX FOR NEWBIES


    become an Open-Source computer hero


    Marek Mularczyk


    Warning! This is not a typical book about Linux. It contains no in-depth details
    that would give you a headache, instead it contains hassle-free information on
    how to get Linux up and running quickly and with easily, with no or little technical
    knowledge.


    This book will show you the secrets to move to virus-free, secure, and stable
    Linux world. Linux will also save you lots of money.


    In this book, you''re going to experience how easy and quick is installing and
    running Linux on any computer.


    # About the Author


    Marek Mularczyk is an Adobe Certified Instructor and a huge Linux fan running
    his at www.SaiTraining.co.uk in United Kingdom. He has been working with many
    Linux distributions over the years and Linux and Open-Source software have been
    his life-long passion.


