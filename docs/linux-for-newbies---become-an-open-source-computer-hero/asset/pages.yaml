- img_proc: true
  md: '# Linux for Newbies


    If you are testing Linux first, remember that Linux loads from the disk into your
    computer''s memory so performance won''t be the same as if you had Linux already
    installed. It is designed to just give you a taste of what Linux is like and so
    that you could test your hardware, check if all your hardware works (this is something
    people who never used Linux are afraid of). If something doesn''t work (it may
    happen), don''t panic and maybe you do some research online to see how to fix
    it. Someone may have had the same issue before and they may have fixed it.


    NOTE: If you are having issues with anything, one of the great places to go is
    the Ubuntu Forums (if you are going to use Ubuntu or Kubuntu).


    You can find it at: http://ubuntuforums.org. You will find me on Ubuntu Forums
    quite often as well, so if you come say Hello. You''ll find me as marer13.


    Once you''ve decided to start installing Linux, click on Install Kubuntu to start
    the process.


    After a few seconds you will be prompted to select the language (you can choose
    among different languages, even including Welsh! ;-) ).


    If you then click Forward, you''ll be prompted to check a few things before you
    start installation process:


    +   - You will need at least 7.5GB of available space


    +   - You should be plugged in to a power source


    +   - You should be connected to the Internet (with a cable, your wireless won''t
    work yet)'
  merge: -1
