  md: '# Call over Internet with Ekiga


    Ekiga is an Internet videoconoconferencing application that you can use to call
    using the Internet connection. It provides voice and picture transmission so you
    can chat to your friends using a webcam or you can call phone numbers (landline
    and mobile).


    To install Ekiga, go to Start > Applications > System > Software Management. When
    KPackageKit opens, type Ekiga in the search box at the top and install it following
    the same step as in the previous chapters.


    Once Ekiga is installed, you will find under:

    Start > Applications > Internet > IP Telephony, VoIP and Video Conferencing:


    ![](img/92b26efba41763db114a1030df1a2d60_78_0.png)'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Linux for Newbies


    When you start it for the first time, the configuration wizard will launch to
    guide you through the setup. Just follow the steps and start using Ekiga in a
    matter of minutes!


    If you want to use Ekiga to make phone calls over the internet (I use it to call
    family), here''s what to do:


    +   1 Register with one of the VoIP providers

    2 Start Ekiga and go to Edit > Accounts.

    3 Click Accounts > Add a SIP Account.

