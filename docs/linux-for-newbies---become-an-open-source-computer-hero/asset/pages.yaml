  md: '# 6 Get productive with Linux


    # A dock with Docky


    # Installation


    Docky is a great dock application for Linux. It is widely known as the most user
    friendly dock application available in Linux. It gives you quick access to the
    most often used applications installed on your computer. Here''s what it looks
    like on the desktop:


