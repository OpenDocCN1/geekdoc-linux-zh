  md: '# Install a Printer


    Every computer user has different needs when it comes to using a computer. However,
    more often than not you are going to want to print something, so you will need
    to install a printer. Installing a printer on Linux may be a different experience
    from other operating systems.


    Let me tell you this first: installing a printer may be a straightforward process,
    in many cases you won''t even need to install any drivers (unlike on other operating
    systems). However, some printers are not that easily supported. Support for printers
    on Linux varies and it is not a Linux fault, it''s just that manufacturers'' do
    not create drivers for Linux, they usually only support Windows and Mac.


    So, if you know you are going to use Linux most of the time and you are buying
    a new printer, do some research online and see which ones work best.


    NOTE: From my own experience with the printers I have used in the past, HP and
    Samsung worked great for me. On the other hand, from what I have heard, Lexmark
    printers have really bad reputation when it comes to installing them on Linux.


    Here''s a great website that may help. You can check here if your printer will
    work on Linux:


    OpenPrinting.org – Printer database.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# Linux for Newbies


    Here''s how you install a printer on Linux:


    +   1 Turn the printer on and connect it to the computer.


    +   2 Open System Settings: Start menu > Applications > Settings > System Settings


    +   3 In the System Settings dialogue box click on Printer Configuration under
    Hardware.


    +   4 This will open Printer Configuration dialogue box, on the left click on
    New Printer.


    +   5 On the right click on New Printer button:


    ![](img/92b26efba41763db114a1030df1a2d60_75_0.png)


    Because you have connected the printer to your computer, Linux will now now try
    to detect it and point you to the right device driver.'
  merge: -1
