- img_proc: true
  md: '# 7 Working with graphics


    It is very common between Linux users to say that there is a lack of a professional
    image editor like Photoshop. Adobe Photoshop became an industry standard when
    it comes to editing graphics. And I can tell you that there is a reason for that.
    I am not saying that as an Adobe Certified Expert and Instructor in Photoshop,
    which I am, but as a user and a photographer. I have used both applications and
    I can tell you that Photoshop is a real professional graphics editor and I don''t
    think Gimp comes close to what Photoshop can do.


    However, some functionality can be achieved with Gimp. If you only open, adjust,
    save, export images, then you''ll be fine with Gimp. Gimp is the most popular
    free graphics editor on Linux and other platforms, so I''m going to focus on Gimp
    and show you what it can do.


    A few words of introduction. Gimp – GNU Image Manipulation Program – definitely
    the most popular graphics editor. It is also one of the oldest, if not the oldest.
    Gimp is not supposed to be a Photoshop imitator, it is different. It is primarily
    a tool for editing images that will go online or will be printed by a photo lab.


    ![](img/92b26efba41763db114a1030df1a2d60_122_0.png)'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# GIMP


    # Installing GIMP


    **Gimp** may not be installed with Kubuntu, when you install it, so if you can''t
    find it in the **Graphics** applications :


    ![](img/92b26efba41763db114a1030df1a2d60_123_0.png)


    you will need to install it. Just follow the usual steps to install it with a
    package manager.'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'Once you have installed Gimp, launch it.


    NOTE: If you plan to use it quite a lot, add Gimp launch icon to the dock.


    Gimp (like other open-source applications) get updates very often (more often
    that most proprietary applications), so by the time you''re reading this you may
    be using a newer version of Gimp with some new features.


    NOTE: At the time of writing I''m using the unstable version of Gimp - Gimp 2.7.3.
    By the time you read this, the final stable version of Gimp 2.7.3 may be released.
    If it is not, you want to use the same version of Gimp, you can download it from
    Gimp website.


    ![](img/92b26efba41763db114a1030df1a2d60_124_0.png)'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Linux for Newbies


    Gimp 2.7.3 is the first version of Gimp working in Single-Window Mode (like most
    graphics editors). What does it mean? Let me show you.


    This is the old Gimp mode with floating panels:


    ![](img/92b26efba41763db114a1030df1a2d60_125_0.png)


    And this is the new Gimp Single-Window Mode:


    ![](img/92b26efba41763db114a1030df1a2d60_125_1.png)'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'You can see that the new Single-Window Mode in Gimp gives much clearer interface
    to work with. All the panels are within the application frame instead of being
    scattered across the entire desktop.


    Single-Window Mode in Gimp is not set by default. To activate it, choose:

    Windows > Single-Window Mode.


    # Basics of Image editing


    To begin with, Gimp looks a bit different from other image editors and some users
    find it a bit confusing to find which menus do what. That''s what I''m going to
    explain to you here. I will be using the Single-Window Mode as that''s what I
    use on daily basis.


    Also, Gimp can open many different file formats, including JPEG, PNG, GIF, and
    PSD, and many more.


    On the top of the application frame you will find menu as on any other application.
    Let''s start by opening an image. Choose File > Open from the menu as shown below:


    ![](img/92b26efba41763db114a1030df1a2d60_126_0.png)'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Linux for Newbies


    When Open Image dialogue box appears, navigate to the file that you want to open
    (notice the buttons at the top of the window that you can use to navigate to the
    folders on your computer) and click Open:


    ![](img/92b26efba41763db114a1030df1a2d60_127_0.png)


    Tool Options panel on the right will display the pixel dimensions of your document
    so you don''t have to look for them (my image is 2592px x 1944px) - screenshot
    on the next page:


    126'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Linux for Newbies


    ![](img/92b26efba41763db114a1030df1a2d60_128_0.png)


    NOTE: If you don''t see the Tool Options panel, choose:


    Windows > Dockable Dialogues > Tool Options) as shown below:


    ![](img/92b26efba41763db114a1030df1a2d60_128_1.png)


    127'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# Adjusting the Brightness and Contrast of the image


    To adjust the Brightness and Contrast of the image you have a few options. You
    can use these adjustments:


    +   - Brightness-Contrast


    +   - Levels or


    +   - Curves.


    Let''s have a look at Brightness-Contrast as the easiest.


    You will find all these adjustments under the same menu, under Colours. So, with
    your image open choose Colours > Brightness-Contrast. This opens this dialogue
    box:


    ![](img/92b26efba41763db114a1030df1a2d60_129_0.png)'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'Now, you just start dragging the sliders to adjust the image.


    Start with the **Brightness** slider to make the image brighter or darker.


    Then move the **Contrast** slider to make the image more or less contrasty.


    When happy with the result, click **OK.**


    NOTE: If you don''t see any changes as you move the sliders, make sure that the
    **Preview** checkbox is checked in the bottom left corner of the dialogue box.
    You can also keep clicking on **Preview** checkbox to see before/after effect
    to compare.


    # Adjusting the Colours


    Let''s say you want to adjust the colours in the image. Maybe you want to make
    colours more saturated or less saturated. A perfect adjustment for adjusting the
    colours would be either:


    +   - Colour Balance or

    - Hue-Saturation


    We''ll look at both.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# Linux for Newbies


    Let''s start with Colour Balance to adjust the colours within an image.


    Open an image that you want to work with and choose Colours > Colour Balance:


    ![](img/92b26efba41763db114a1030df1a2d60_131_0.png)


    Start moving the sliders under Adjust Colour Levels, i.e. if the image is slightly
    too green, move the Magenta – Green slider to the left to remove the green tint.


    When happy with the effect, click OK to exit the dialogue box.


    Now, you''re going to adjust the saturation of the colours in the image with the
    Hue-Saturation adjustment.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Linux for Newbies


    With the image opened, choose Colours > Hue-Saturation.


    Here are two examples with the Saturation moved to right to increase the saturation:


    ![](img/92b26efba41763db114a1030df1a2d60_132_0.png)


    and the Saturation slider moved to the left to decrease the saturation (almost
    black & white):


    ![](img/92b26efba41763db114a1030df1a2d60_132_1.png)'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'When you''re ready to save the image, in Gimp you''ll need to export it to
    save it it as either a JPEG, or PNG, or GIF.


    # Saving Files


    To save the file choose File > Export:


    ![](img/92b26efba41763db114a1030df1a2d60_133_0.png)


    In the Export dialogue box give the file a name as shown on the screenshot on
    the next page.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Linux for Newbies


    ![](img/92b26efba41763db114a1030df1a2d60_134_0.png)


    To choose the file format, click on **Select File Type (By Extension)** at the
    bottom of the screen to reveal the drop-down menu with all the supported file
    formats. If you don''t choose anything here, Gimp will save the file with the
    same file format as the original, so in most cases you don''t need to choose anything
    here.


    Click Export.


    If you''re saving an image as a JPEG, you will now see the **Export image as JPEG**
    dialogue box like the one below:


    ![](img/92b26efba41763db114a1030df1a2d60_134_1.png)


    133'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'Because JPEG is a highly-compressed file format, you use the Quality slider
    to define the compression (the lower the Quality setting smaller the file size,
    but also the lower the quality). If you''re not concerned about the file size,
    set the Quality to anything between 90 and 100 (if you''re going to print the
    image, set the Quality to 100).


    Click Export. Done.


    # Convert an Image to Black and White


    Let''s now convert an image to black and white. There is no Black and White adjustment
    in Gimp, if you looked under Colours menu already. The adjustment you are going
    to use is Colours > Desaturate.


    With image opened, choose Colours > Desaturate. This opens a dialogue box shown
    here:


    ![](img/92b26efba41763db114a1030df1a2d60_135_0.png)'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'What I suggest here is for you to try clicking on the options under Choose
    shade of grey based on: and see which effect looks best for you. They all create
    different black and white effects. Just experiment. Have fun!


    When done, click OK. Your image is now black and white. Well done!


    Save it using File > Export.


    # Working with Layers in Gimp


    Gimp, like other graphics editors, supports layers. If you haven’t used layers
    before, they’re like transparent sheets stacked one on top of another. Different
    images or elements can be placed on different layers, which makes them easier
    to edit. There is no limit to the number of layers you can have in Gimp, the only
    limit is the amount of memory as each layer uses your memory.


    Let''s start by looking at the effect you''re going to create:


    ![](img/92b26efba41763db114a1030df1a2d60_136_0.png)'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'Notice that there are six layers in the Layers panel in the bottom right corner
    of the Gimp interface:


    ![](img/92b26efba41763db114a1030df1a2d60_137_0.png)


    Here''s the breakdown of the design and layers structure:


    +   - the bottom layer is the image

    - two layers above are the rectangle that appears behind the text (Layer layer)
    and the drop shadow for the rectangle (Drop Shadow layer)

    - above there is a layer with the text (North Albanian Alps layer)

    - finally, at the top, there are two layers: copyright layer and shadow layer
    below (shadow for the copyright symbol)'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Linux for Newbies


    So, let''s get to work.


    Start by opening an image that you want to use. That''s what your Layers panel
    should look like, just one layer so far:


    ![](img/92b26efba41763db114a1030df1a2d60_138_0.png)


    Next, you''re going to add a rectangle that will appear behind the main text.'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'Create a new layer in the Layers panel by clicking on the New Layer icon (the
    icon in the bottom left corner):


    ![](img/92b26efba41763db114a1030df1a2d60_139_0.png)


    Give it a name, call it Rectangle as an example, and leave Layer Fill Type set
    to: Transparency. Click OK.


    ![](img/92b26efba41763db114a1030df1a2d60_139_1.png)


    138'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# Linux for Newbies


    You have created a new blank layer.


    Now go to the Tools panel and select the Rectangle Select Tool:


    ![](img/92b26efba41763db114a1030df1a2d60_140_0.png)


    With the Rectangle Select Tool selected click and drag on the image to create
    a rectangle.


    Next, choose Edit > Fill with BG Colour:


    ![](img/92b26efba41763db114a1030df1a2d60_140_1.png)


    139'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'NOTE: BG stands for Background. Your background colour should be white.

    If it''s not, click on the colour swatch at the bottom of the Tools panel

    (the one in the background – that''s your background colour)


    When you click on it, it opens Change Background Colour dialogue box

    in which you can change the background colour by clicking inside

    the box on the left in the white area and then clicking OK.


    Once you''ve chosen Fill with BG Colour, the rectangle should have white

    ill like the one below:


    ![](img/92b26efba41763db114a1030df1a2d60_141_0.png)


    Now it''s time for a shadow. When adding a drop shadow in Gimp, you don''t need
    to create a

    new layer, Gimp will create it for you.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Linux for Newbies


    Just choose Filters > Light and Shadow > Drop Shadow...


    ![](img/92b26efba41763db114a1030df1a2d60_142_0.png)


    In the Drop Shadow dialogue box accept all the defaults and just click OK.


    Congratulations! You have a white rectangle with a drop shadow behind it! Well
    done!


    Now, you''re going to make the rectangle semi-transparent, so it shows through
    the background behind. You''re going to do it by reducing the opacity of the layer.
    The Opacity of the layer defines how opaque or how transparent the layer is.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'The Opacity slider appears near the top of the Layers panel:


    ![](img/92b26efba41763db114a1030df1a2d60_143_0.png)


    With the Rectangle layer selected, click and drag in the Opacity area to drop
    the opacity to around **50%** so that the rectangle is semi-transparent and you
    can see the background behind it.


    Click on the top layer (**Drop Shadow layer**) to select it. You''re going to
    add some text now.


    When adding text, Gimp creates a new layer for you so you don''t have to.'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'With the top layer selected, select the Text Tool in the Tools panel:


    ![](img/92b26efba41763db114a1030df1a2d60_144_0.png)


    Next, in the **Tool Options** panel set the options for your text:

    - Font Family, Font Size, Colour etc.


    When done, click inside the rectangle on the image and start typing:


    ![](img/92b26efba41763db114a1030df1a2d60_144_1.png)'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Linux for Newbies


    If you need to change the colour or size of the text, highlight it and the options
    box will appear next to it as shown here:


    ![](img/92b26efba41763db114a1030df1a2d60_145_0.png)


    Make changes and then to see how the text updates click on Move Tool to deselect
    the text.


    If you have selected the Move Tool, you can now move the text to centre inside
    the rectangle. Before you click and drag to move the text, check the Tool Options
    panel. It should be set to: Move the active layer:


    ![](img/92b26efba41763db114a1030df1a2d60_145_1.png)


    Now you can click and drag to move the text layer.


    Next step will be to add a copyright symbol as a watermark to protect your image
    if you’re going to upload it online.'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'First, find the copyright symbol anywhere and copy it into the clipboard. You
    can use any document that has a copyright symbol.


    Then, in Gimp select the Text Tool and click once once on a page.


    Next, paste the copyright symbol by choosing Edit > Paste or by pressing Ctrl+V.


    Make it big and white in colour ( I used 400px Georgia ):


    ![](img/92b26efba41763db114a1030df1a2d60_146_0.png)'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'Now simply lower the opacity of the layer to around 25-35% depending on the
    image. It shouldn''t be too distracting.


    ![](img/92b26efba41763db114a1030df1a2d60_147_0.png)


    NOTE: If you want to delete a layer, select it and drag it onto a bin icon in
    the bottom right corner of the layers panel.


    Congratulations! You have successfully created a multi-layer document in Gimp.
    Remember, if you want to email it to someone, export it as a Jpg or Png file using
    File > Export.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Making Selections


    Selections are created so that you could work with some areas of the image. Usually
    we create a selection to move a part of the image onto a new layer or to remove
    it from the image or blur it as an example.


    There are two ways of accessing Selection Tools in Gimp:


    from the menu:


    ![](img/92b26efba41763db114a1030df1a2d60_148_0.png)


    or in the Tools panel:


    ![](img/92b26efba41763db114a1030df1a2d60_148_1.png)'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'Here''s a quick overview of how these tools work:


    +   Rectangle Select Tool: Select a rectangular region R


    Rectangle Select Tool – it selects rectangular regions of the active layer. It
    is a very basic tool, but quite often used.


    +   Ellipse Select Tool: Select an elliptical region E


    Ellipse Select Tool – it selects elliptical and circular regions of the active
    layer. Also a basic tool and quite often used.


    +   Free Select Tool: Select a hand-drawn region with free and polygonal segments
    F


    Free Select Tool – a lasso – it creates freehand selections. The selected area
    closes when you release the mouse button. Good tool if you have a very steady
    hand, it gives you control over your selection.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '![](img/92b26efba41763db114a1030df1a2d60_150_0.png)


    **Fuzzy Select Tool** – magic wand – it selects the areas of similar colour. When
    you click on the image with the Fuzzy Select Tool it samples the colour under
    your cursor and selects all pixels with similar colour within the image.


    NOTE: **Fuzzy Select Tool** only selects areas that are adjacent (contiguous regions)
    unlike the next tool.


    ![](img/92b26efba41763db114a1030df1a2d60_150_1.png)


    **Select by Colour Tool** – similar to Fuzzy Select Tool, but it selects all areas
    of similar colour, even if they''re not adjacent (regardless of where they are
    located).'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Linux for Newbies


    ![](img/92b26efba41763db114a1030df1a2d60_151_0.png)


    Scissors Select Tool: Select shapes using intelligent edge-fitting I


    **Scissors Select Tool** – it is very similar to Magic Wand Tool in Photoshop
    – it creates anchor points as you click and it tries to detect contrasty edges.


    ![](img/92b26efba41763db114a1030df1a2d60_151_1.png)


    Foreground Select Tool: Select a region containing foreground objects


    **Foreground Select Tool** – it lets you extract the foreground from the layer.


    And finally:


    ![](img/92b26efba41763db114a1030df1a2d60_151_2.png)


    Paths Tool: Create and edit paths B


    **Paths Tool** – it is used to create complex selections using Bezier Curves.
    Anchor points created with the Paths Tool can be edited. Curves created with this
    tool can be saved or even exported.


    Here you go. This is the overview of the selection tools in Gimp.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Managing Photos with Digikam


    **Digikam** is an image organiser and image editor on KDE platform.

    It supports all major image file formats.


    Among its many fantastic features here are just a few:


    +   - adding captions and ratings

    - searching through images and saving searches

    - GPS locator

    - face detection

    - exporting images to Flickr, Facebook, Google Earth’s KML files, SmugMug etc

    - burning images on CD

    - creating Web Galleries

    - downloading images from cameras/memory cards


    ![](img/92b26efba41763db114a1030df1a2d60_152_0.png)'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'The latest version of Digikam at the time of writing (December 2011) is Digikam
    1.9.0:


    ![](img/92b26efba41763db114a1030df1a2d60_153_0.png)


    Digikam doesn''t come pre-installed with Kubuntu, so you will need to install
    it.


    +   1 Open KpackageKit and search for Digikam:


    ![](img/92b26efba41763db114a1030df1a2d60_153_1.png)'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Linux for Newbies


    2 Click on Install button and Apply. Once Digikam is installed, launch it.


    3 When you start Digikam for the first time, you need to configure it (as most
    other applications). Just click Next:


    ![](img/92b26efba41763db114a1030df1a2d60_154_0.png)


    4 In the next dialogue box you will need to point Digikam to a folder where you
    want to store the images (be default it will use your Pictures folder and that''s
    what I use):


    ![](img/92b26efba41763db114a1030df1a2d60_154_1.png)'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'You will also be informed that Digikam stores all the information and metadata
    about images in a database file which will also be stored in your Pictures folder
    by default, however you can change that if you want.


    NOTE: I would advise to keep images and Digikam database file in the same folder
    so they''re easier to find


    # 5 Next, decide how you want to open raw images (if you shoot raw):


    ![](img/92b26efba41763db114a1030df1a2d60_155_0.png)


    NOTE: Raw is a raw file format, equivalent to a digital negative. Many cameras
    can save files in raw format - all D-SLR cameras and a few compacts, other cameras
    and mobile devices save files in Ebay format, which is a lossy file format. Raw
    is lossless, which means if you shoot raw, you don''t loose any data, any quality
    in your images.


    After deciding on how you want to work with raw, click Next.


    # 6 Now, you will need to decide if you want to store the information about the
    files in the files'' metadata:'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Linux for Newbies


    - if you''re going to use the images on other photo management applications, click

    Add information to files;


    - otherwise, if you''re only going to use Digikam for all photo management, click

    Do nothing:


    ![](img/92b26efba41763db114a1030df1a2d60_156_0.png)


    Click Next.


    7 Now, decide whether you want to display images in preview mode in reduced version
    or in

    full version (if you have a slow computer – choose Load reduced version of image,
    on a

    fast computer – choose Load image):


    ![](img/92b26efba41763db114a1030df1a2d60_156_1.png)'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Linux for Newbies


    Click Next.


    In the next step, choose what you want to happen when you right-click on the image.
    You can leave it on a default:


    ![](img/92b26efba41763db114a1030df1a2d60_157_0.png)


    Click Next to go to the next screen about Contextual Tooltips. Choose whether
