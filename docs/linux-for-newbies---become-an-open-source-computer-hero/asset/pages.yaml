  md: '# 4 Exploring your Linux desktop


    Now that you have installed Linux successfully it is time for some post-installation
    configuration and getting acquainted with Linux desktop environment. If you are
    moving to Linux from Windows or Mac OS, one of the challenges for many users is
    to find comparable software on Linux, so I''m going to give you Linux equivalents
    to Windows applications in a chapter near the end of the book.


    # Linux taskbar and Start menu


    Looking at your new desktop environment, notice the familiar taskbar with the
    start menu at the bottom of the screen.


    In this chapter you''re going to customise your new operating system. In this
    chapter you''re going to get quickly up to speed with Linux so that by the end
    of the chapter you''ll feel comfortable enough.'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'A few words about the taskbar, or “panel” it’s often called in KDE “slang”.
    It appears across the bottom of your screen by default and it can easily be repositioned.
    I will show you how to move it to the top and then install the dock at the bottom
    of the screen as I always do.


    The start button in the taskbar appears in the left corner of the taskbar (like
    on Windows) and it has a KDE logo:


    ![](img/92b26efba41763db114a1030df1a2d60_43_0.png)


    Next to the Start button there is a:


    +   - Quick Launch section and

    - Virtual Desktops (by default two, I changed it to four).


    To customise the taskbar, right-click on it and choose Panel Options > Panel Settings.


    ![](img/92b26efba41763db114a1030df1a2d60_43_1.png)


    Now, if you want to move the taskbar to the top of the screen as I did, click
    on Screen Edge, hold the mouse button down and drag it to the top of the screen.
    Then release the mouse button and Voila! Done! Your taskbar should now appear
    on the top of the screen.'
