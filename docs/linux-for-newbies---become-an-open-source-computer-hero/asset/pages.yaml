    In the bottom part of the dialogue box there is a section for **Shortcuts.**


    ![](img/92b26efba41763db114a1030df1a2d60_50_0.png)


    Under **Action Desktop Switching > Switch to Desktop 1** etc.


    Notice the keyboard shortcuts. From now on, you can enjoy using the keyboard shortcuts!
