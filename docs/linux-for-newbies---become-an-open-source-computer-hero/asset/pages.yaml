  md: '# 8 Multimedia


    It''s the twenty first century and more and more people embrace new technologies.
    With so many people listening to music and watching videos, you may have gathered
    hundreds of megabytes or more of music and video. You will be happy to hear that
    the support for playing multimedia on Linux is improving all the time.


    Kubuntu/Ubuntu supports many sound cards so yours should be supported and may
    have been properly detected during installation ( I never had any problems with
    sound cards on the laptops I owned in the past ).


    To give you a quick overview, there are two main sound card driver models on the
    market:


    **OSS – Open Sound System** – with free and commercial drivers;


    **ALSA – Advanced Linux Sound Architecture** – entirely open-source.


    Kubuntu uses ALSA and ALSA supports lots of sound cards. If your sound card is
    not supported, it may be supported in the commercial OSS version.


    ![](img/92b26efba41763db114a1030df1a2d60_166_0.png)'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'Linux has a variety of multimedia players for sound and video. We''ll focus
    on the most popular and the easiest to use players.


    # Sound Volume


    For adjusting volume, Linux offers a handy volume slider in the taskbar:


    ![](img/92b26efba41763db114a1030df1a2d60_167_0.png)


    To change the volume, just click on the speaker icon and drag the slider up or
    down:


    ![](img/92b26efba41763db114a1030df1a2d60_167_1.png)


    NOTE: On some laptops you can also use the volume buttons on the keyboard, it
    worked on all Dell laptops I have had so far.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Playing Music


    Linux has a variety of music players, but the default is Amarok.\ Amarok is a
    powerful music player and music management application. It makes playing music
    so much more enjoyable than other music players... and you can see the lyrics
    as you are listening to your favourite tracks! (internet connection required).


    You can use Amarok to buy and download music and podcasts as well as listen to
    internet radio stations and music from USB devices.


    When you start Amarok for the first time ( you''ll find it under Start > Applications
    > Multimedia ), it will scan your home directory for any supported music files
    and after a moment it will launch.


    Here''s the Amarok interface:


    ![](img/92b26efba41763db114a1030df1a2d60_168_0.png)'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'To play music in Amarok:


    - choose Amarok > Play Media... or


    - use the File Manager to find files you want to play, then select them, right-click
    and choose Actions > Amarok > Append & Play :


    ![](img/92b26efba41763db114a1030df1a2d60_169_0.png)


    As simple as that. When connected to the Internet, Amarok will display information
    about the track you are listening to as well as it will display the cd cover and
    information about the author/album from Wikipedia. Very impressive.


    If you''re an "old school" music lover that has a collection of CDs (most people
    nowadays buy music online), then you''ll need to install RhythmBox - an application
    that works well with audio CDs. You can install it straight from KpackageKit.'
  merge: -1
