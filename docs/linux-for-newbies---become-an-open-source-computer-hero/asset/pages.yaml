  md: '# Linux for Newbies


    In the Settings and Profile tab set the options to the same options as on the
    screenshot above (you can change them later on).


    Basically, what you want to do here is:


    +   - use the maximum power from your computer when it runs from the mains (Performance
    – When AC Adaptor is plugged in), and

    - save the battery life when it runs on battery so that you can run it longer
    (Powersave – When AC Adaptor is unplugged).


    When the battery reaches low level and When battery is at warning level, you''ll
    use Aggressive powersave to use the laptop on battery for as long as you can.


