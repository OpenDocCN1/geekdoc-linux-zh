  md: '# 2 Preparations before installing Linux


    In most cases when you purchase a new computer, it has Microsoft Windows installed
    (or Mac OS X if it is a Mac). Most major manufacturers provide computers with
    an operating system installed. Some of them even install one of the Linux distributions
    on their machines, but it''s still quite rare (or at least in Europe). So in this
    chapter we''ll go through preparing your computer for Linux installation.


    If you are like most users, you have a computer that runs Windows or Mac OS already.
    Now you have two choices:


    +   - you can install Linux on the entire disk and remove your existing operating
    system


    +   - you can install Linux along the other operating system and have both running


    If you decide to install Linux along the other operating system, you will be able
    to log into them one at a time. If you decide to log into Linux and you are inside
    Windows, you will need to restart your machine (which shouldn''t take long). That''s
    what most people do, they want to keep their other operating system either just
    in case or maybe because they run some proprietary software on this operating
    system.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Linux for Newbies


    If you run other operation system currently on your computer (I will assume Windows),
    you will need to create a partition for Linux. One partition for Windows and one
    for Linux. A partition is just a portion of a disk bit like a slice on a cake.
    Before you start installing any operating system, make sure you are prepared.
    Kubuntu runs on a variety of hardware, but it is worth to check how it is going
    to run on your computer. That''s why I am thrilled to let you know that you can
    check Linux out before you install it! You simply run it from a cd. As simple
    as that! And if everything is working and you are happy with what you see, you
    can start installation! We''ll get to that in just a few moments.


    Back to partitioning, you will need to create a partition for Linux. If you currently
    run Windows 7 it''s really easy. So what we are going to create here is a configuration
    often called a “dual-boot”. When you start your computer you will be able to choose
    which operating system you want to run. So let''s get to work!


    # Creating a partition for Linux on Windows


    I''m only going to show you how to create a new partition on Windows 7. For any
    other operating system, do a bit of search online and you''ll find how to do it.
    It''s really easy.


    +   1 First you need to shrink the partition from the free space to create new
    unallocated space on the disk to use it to create a new partition. You will use
    Disk Management for that.


    +   2 Go to Start menu > Control Panel.


    +   3 In the Control Panel click on view drop-down menu and set it to Large Icons
    (on the right hand side), then choose Administrative Tools and Computer Management.'
  merge: -1
  pgno: 23
