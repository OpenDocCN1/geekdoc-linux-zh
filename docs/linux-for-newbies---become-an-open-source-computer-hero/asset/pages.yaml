  md: '# Using Terminal (Konsole)


    If you have been around ''Linux folks'' long enough, you may have heard them talk
    about ''command line'' and ''terminal'', which sounds a bit like black magic.
    You would have thought ''Why would I need to use command line? Isn''t it a bit
    too outdated when we live in twenty first century and graphical interfaces do
    everything for us?'' Not really. The command line is one of the most powerful
    tools in Linux.


    ![](img/92b26efba41763db114a1030df1a2d60_187_0.png)


    Let me tell you something about Linux. At the very heart of Linux operating system
    is ''kernel'' - in simple terms, a programme to communicate with the computer
    components. A ''shell programme'' is a facility that allows Linux users to communicate
    with the kernel.


    Various Linux distributions include several shell programmes. The one you''re
    going to use here will be Konsole.


    You can open it from the Start menu: **Start > Applications > System > Terminal.**'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'NOTE: If you cannot find an application, i.e. Konsole, go to Start menu and
    type konsole in the search box:


    ![](img/92b26efba41763db114a1030df1a2d60_188_0.png)


    When the application appears, just click on the name to open it.


    When Terminal opens, you''ll see your username and a blinking cursor:


    ![](img/92b26efba41763db114a1030df1a2d60_188_1.png)'
