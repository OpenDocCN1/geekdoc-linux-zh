  md: '# Memory Checks


    In this section, I''m going to show you how you can perform memory checks on your
    system using Terminal (Konsole).


    # Examine disks and memory available:


    Your entire Linux system may work on multiple hard drives and many disk partitions.
    When you installed Linux, it created some partitions for you automatically. Each
    partition is represented by a file in the /dev folder, i.e. you can have partitions:


    /dev/hda1


    /dev/sda1


    etc.


    To check all the partitions in your Linux system, use df command:


    ![](img/92b26efba41763db114a1030df1a2d60_193_0.png)'
  merge: -1
  pgno: 193
- img_proc: true
  md: "# Linux for Newbies\n\nI have one mean hard drive partition - /dev/sda6 mounted\
    \ as / (root) with ca.141GB memory and ca.67GB used (51%).\n\nThe way the information\
    \ is presented may put you off and I understand. Let's make it more \n\"user-friendly\"\
    :\n\ntype df -h:\n\n![](img/92b26efba41763db114a1030df1a2d60_194_0.png)\n\n-h\
    \ option makes the output easier to understand, notice that memory is now displayed\
    \ in \nGigabytes instead of bytes.\n\nNow you can see that the actual size of\
    \ the partition in Gigabytes is 135GB, not 141 as I \nthought based on bytes values\
    \ (you may know that 1MB is actually not 1000KB but 1024KB, \n's why the difference).\n\
    \nIf you want to know what file systems are used on different partitions, add\
    \ T option like that:\n\ndf -hT:\n\n![](img/92b26efba41763db114a1030df1a2d60_194_1.png)"
  merge: -1
