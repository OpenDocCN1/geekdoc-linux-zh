  md: '# Virtual Desktops


    This is one of the great features in Linux, and one of my favourites, that is
    not found in Windows. It is the ability to run multiple “virtual” desktops to
    separate work.

    Let me give you an example :


    +   - on desktop 1 you run your email client,

    - on desktop 2 you run a web browser, and

    - on desktop 3 you edit images or videos.


    By default when you install Kubuntu you get two virtual desktops represented by
    two buttons next to the Start button. To add more virtual desktops, right-click
    on one of the virtual desktops and choose Add Virtual Desktop as shown below:


    ![](img/92b26efba41763db114a1030df1a2d60_47_0.png)'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'If you do twice, you''ll have four desktop as I have here. The active desktop
    is highlighted (on my screen it''s desktop 4). Clicking on the desktop icon will
    slide to another desktop.


    By default, there is no transition between the desktops, you just see the content
    on another desktop. Let me show you how to activate the cube animation, very cool
    effect!


    Right-click on one of the desktops and choose Pager Settings. This will open the
    Pager Settings dialogue box as shown below:


    ![](img/92b26efba41763db114a1030df1a2d60_48_0.png)


    Click on the Virtual Desktops category on the left to see the options as displayed
    on the screenshot on the next page:'
  merge: -1
