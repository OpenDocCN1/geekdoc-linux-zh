  md: '# 9 Beyond Basics


    # Downloading and Installing applications


    Installing software in Kubuntu became easy, and many applications are already
    installed on your computer when you install Kubuntu (this also applies to many
    other Linux distributions nowadays).


    However, sometimes you may want to install an application that cannot be installed
    from within Kubuntu (or other Linux distribution).


    In this case, you would search for it online (like you do when you''re looking
    for an application for Windows), then download it and install it.


    Depending on the application, the authors may only provide downloads for the most
    popular Linux distributions (usually Ubuntu/Kubuntu, openSuSe, SuSSe, Fedora,
    Mandriva).


