- img_proc: true
  md: '![](img/92b26efba41763db114a1030df1a2d60_49_0.png)


    In here you can decide on how many virtual desktops you want to have (another
    way of adding new virtual desktops) and you can give them names if you want.


    Switch to Switching tab on the top to change how to move between the virtual desktops:


    ![](img/92b26efba41763db114a1030df1a2d60_49_1.png)'
  merge: -1
