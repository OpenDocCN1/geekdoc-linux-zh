  md: '# Creating Screenshots with Knapshot


    There are several ways to take screenshots in Linux. We all use our favourite
    ways of doing it. If you are a Windows user, you probably used the Print Screen
    button on your keyboard and then used one of the graphics editors to paste it.
    In Linux we use applications to take screenshots.


    Because we''re using Kubuntu Linux in this book and it comes with KDE environment,
    we''re going to use Knapshot – an application that is part of KDE. Knapshot is
    one of the best screen capture applications on Linux and it is very easy to use
    as well.


    Start by launching Knapshot, you''ll find it under Start > Applications > Graphics:


    ![](img/92b26efba41763db114a1030df1a2d60_162_0.png)'
  merge: -1
