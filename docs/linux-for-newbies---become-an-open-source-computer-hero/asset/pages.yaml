  md: '# Burning CDs and DVDs (BluRay)


    In just a moment you are going to find out how easy it is to burn CDs/DVDs/BluRay
    with Linux! It has never been easier, I find it so much easier on Linux than on
    some other operating systems.


    If you have looked through some books on Linux, you may have found it frustrating
    that many books talk about burning discs using command line. What''s funny about
    that?


    It is usually easier to use one of the graphical programmes to burn discs, so
    that''s what I''m going to focus on here. Most computer users don''t want to jump
    into command line (most of you probably don''t even know what I''m talking about.
    Command line...? What''s that?). I will talk a bit about command line in Linux
    near the end of the book. For now, let''s just focus on graphical applications.


    My favourite, and one that comes with KDE, is K3b. I have used K3b for a number
    of years and still amazes me what it can do.


    If you are a Windows user, you usually need to spend around £50-60 on a software
    that does what K3b does for FREE! How great is that?


    ![](img/92b26efba41763db114a1030df1a2d60_173_0.png)'
  merge: -1
