- img_proc: true
  md: 'Source and destination IP addresses or networks can be specified to iptables
    with the -s IP and -d IP notations, respectively, and both CIDR and dotted-quad
    network notations are also supported. Source and destination port numbers can
    be given with the --sport port and --dport options, and with Snort, port ranges
    are specified with the colon (:). The protocol can be given with --protocol.


    For example, to build an iptables rule that applies to TCP traffic, you would
    use the -p tcp to the iptables command. To restrict the destination port 53, you
    would use --dport 53. To apply the rule of any IP address in the 192.168.10.0/24
    subnet, you would use -d 192.168.10.0/24.


    # Snort Actions and Alerting


    Snort provides several excellent options for generating alerts and logging packet
    data; fortunately, iptables (together with additional user code to interpret iptables
    log messages) can emulate a significant fraction of these capabilities. As mentioned
    in Chapters 2 and 3, log messages generated by the iptables log contain nearly
    all of the interesting fields in the network and transport layer headers. In Chapter
    4 we saw that iptables can search application layer data for suspicious activity
    with the string match extension. With fsnort, we combine these to emulate the
    following Snort actions:


    +   alert This is the main Snort rule action, and within fsnort it is equated
    with the usage of the iptables log prefix and packet header information in the
    msg fields within the remainder of the log. Within iptables, we don''t have the
    ability to log application layer data (unless the ULOG target is used along with
    the ulog PCAP writer³), but at least the attacks are logged via the msg field.


    +   log Within fsnort, this action is equated with the iptables ULOG target, where
    the ulog PCAP writer is used for more comprehensive packet logging.


    +   pass This action is used in Snort rules to ignore packets, and is equated
    with the usage of the iptables ACCEPT target by fsnort. The ACCEPT target allows
    matching traffic to pass without any modifications or further action by iptables.


    The activate and dynamic actions are not supported by fsnort, because this is
    not a limitation of iptables; would significantly complicate both the iptables
    policy and the script required to build it, because a separate chain would have
    to be constructed for each dynamic rule.


    # Translating Snort Rule Options: iptables Packet Logging


    > ³ The ULOG target is an infrastructure built on top of netlink sockets that
    allows all packets to be sent to a users daemon process, where packets can be
    logged in various formats from PCAP, or even to a MySQL database. See http://www.netlifyfilter.org/projects/ulog/index.html
    for more information.'
