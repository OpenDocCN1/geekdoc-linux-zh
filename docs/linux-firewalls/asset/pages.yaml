  md: "from any source because we need to allow external addresses to interact with\
    \ the internal web- and DNS servers (after NATed; see the following section, \"\
    Network Address Translation\").\n\n# Network Address Translation\n\nThe final\
    \ step in the construction of our iptables ipv4 internal addresses is to enable\
    \ the translation of the non-routable 192.168.10.0/24 internal addresses into\
    \ the routable external 71.157.X.X address. This applies to inbound connections\
