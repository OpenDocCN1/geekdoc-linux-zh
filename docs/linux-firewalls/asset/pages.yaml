    MAC=00:13:d3:38:b6:e4:00:30:48:0e:47:38:00 SRC=142.202.X.X DST=71.157.X.X

    LEN=40 TOS=00 PREC=000 TTL=44 ID=51322 PROTO=TCP SPT=62068 DPI=6006

    WINDOW=4096 RES=000 ACK URG=0

    ```'
