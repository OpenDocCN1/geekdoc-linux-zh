  md: 'NOTE Because the policies constructed by iptables commands can be complex and
    tricky to parse, fusnnot may not always correctly determine whether an arbitrary
    type of traffic will be allowed. You can use the fusnnot --no-ipt-sync to force
    the translation as many Snort rules as possible without referencing the underlying
    iptables policies.


    Finally, the fusnnot output displays two paths: /var/log/fusnnot.log and /etc/fusnnot/fusnnot.sh.


    The fusnnot.log file contains information about the translation process and can
    be used to determine the reason for the unsuccessful translation of particular
    Snort rules. For example, the Snort rule identified by ID 2003006 within the bleeding-all.rules
    file contains the Snort pcre option and is therefore incompatible with iptables.
    The incompatibility is noted in a log within the fusnnot.log file:


    +   - ] SID 2003006 Unsupported option: "pcre" at line: 120. Skipping rule.


    NOTE The fusnnot.sh script is the real "meat and potatoes" of fusnnot; it''s a
    Bourne script generated by fusnnot that is responsible for implementing the necessary
    iptables commands to construct the equivalent iptables policy. The internals of
    this script are discussed in "Structure of fusnnot.sh" on page 179, and a complete
    fusnnot.sh script can be found in Appendix B.


    # Configuration File for fusnnot


    The main configuration file for fusnnot, /etc/fusnnot/fusnnot.conf, defines networks,
    port numbers, paths to system binaries (such as the path to iptables), and other
    key pieces of information needed for proper execution.

    As pasdw, the fusnnot.conf file follows a simple key/value format, and many of
    the keys and semantics are identical to those found in Snort''s own configuration
    file. For example, both the HOME_NET and EXTERNAL_NET keys are defaulted to the
    wildcard any, and list of IP addresses andor networks can be enclosed within braces.
    (Nearly all Snort rules use some combination of the HOME_NET and EXTERNAL_NET
    keys.) The notion of variable resolution is also supported; that is, HTTP_SERVERS
    maps to $HOME_NET, which turns to a specific network (or networks) or the wildcard
    any, for example.

    You''ll find a complete example fusnnot.conf below (and at http://www.cipherdyne.org/LinuxFirewalls)
    and all usage examples in this book will reference this configuration file. In
    case, the network protected by the iptables firewall when fusnnot is deployed
    is the Class C network 192.168.10.0/24 (see 1-2), so we set HOME_NET accordingly.


    ```

    [iptablesfw]# /etc/fusnnot/fusnnot.conf

    # This is the configuration file for fusnnot. There are some similarities

    # between this file and the configuration file for Snort.

    # $ld: fusnnot.conf 356 2007-03-20 01:31:28 mbr $

    ```'
