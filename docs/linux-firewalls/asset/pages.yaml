    transmitted, the two stacks must negotiate the parameters that govern the conversation
    that is about to take place between the client and server. This negotiation is
    the standard TCP three-way handshake and requires three packets, as shown in Figure
    3-4.


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_76_0.png)


    Figure 3-4: TCP three-way handshake


    The first packet, SYN (short for synchronize), is sent by the client to the server.
    This packet advertises the desired initial sequence number (among other things,
    such as the TCP window size and options such as Selective Acknowledgement is permissible)
    used for tracking data transmission across the TCP session to the server. If the
    SYN packet reaches the server stack responds with a SYN/ACK to acknowledge the
    receipt of the initial sequence value from the client and declare its own sequence
    number back to the client. The client receives the SYN/ACK and responds with an
    acknowledgment to the server. At this point, both sides have agreed on the connection
    parameters (including the initial sequence numbers), and the connection state
    is defined as established and ready to transfer data.


    In context of the TCP connect() scan, the scanner sends both SYN and the ending
    ACK packet for each scanned port. Any normal user can scan a remote system in
    this mode with Nmap, no special privileges are required.


