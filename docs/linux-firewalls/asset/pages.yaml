  md: '# Port Sweeps


    A port sweep is a reconnaissance method similar to a port scan. However, instead
    of enumerating accessible services on a single host, a port sweep checks for the
    availability of a single service on multiple hosts. From a security perspective,
    port sweeps can give cause greater concern than port scans since they frequently
    imply that a system has been compromised by a worm and is looking for other targets
    to infect. If a network is running a lot of Windows systems (which are usually
    a primary target of worm activity), detecting port sweeps is more important than
    detecting port scans. However, even detection may not mean much in the face of
    worms such as the Slammer worm that infected thousands of systems worldwide minutes;
    by the time the worm is detected, it is most likely too late to do anything about
    it. When a fast spreading worm like Slammer is initially unleashed, the time required
    to write a new Snort signature and distribute it is far longer than the worm takes
    to infect nearly every system. Intrusion prevention systems may be able to block
    it, but the best way to limit a worm is to patch the vulnerability that it exploits.
    Still, detecting port sweeps from your internal network can be a good way to identify
    infected systems (and, fortunately, not worms spread as rapidly as the Slammer
    worm).


    Nmap can use all of its scanning abilities to sweep entire networks for particular
    services. For example, if an attacker has an exploit for an SSH daemon, Nmap can
    find all accessible instances of the service in the entire 10.0.0.0/8 subnet follows:


    ```

    [ext_scanner] # nmap -Po -p 22 -sS 10.0.0.0/8

    ```


    # TCP Sequence Prediction Attacks


    TCP does not build in a layer of strong authentication or encryption; this task
    is left to the application layer. As a result, TCP sessions are vulnerable to
    a variety of attacks designed to inject data into a TCP stream, hijack a session,
    or force a session to close.


    In order to inject data into an established TCP connection, the attacker must
    know (or guess) the current sequence number used to track data delivery, which
    depends on the initial sequence number that before data was transmitted. Significant
    work has been done in some TCP stacks to ensure that initial sequence numbers
    are randomly chosen (the OpenBSD TCP stack is a great example of this), and the
    size of the sequence number in the TCP header (32 bits) also provides some resistance
    to guessing when a TCP connection cannot be sniffed by an attacker. However, a
    rather famous example of guessing TCP sequence numbers in the context of tearing
    down BGP peering sessions in Cisco routers with RST packets was reported by Paul
    A. Watson in "Slipping in the Window: TCP Reset Attacks" (see http://osdb.org/reference/SlippingInTheWindow_v1.0.doc
    for more information).'
