  md: '# ENABLE_MD5_PERSISTENCE


    One of the most important features of the SPA protocol is the ability to detect
    and ignore replay attacks. The ENABLE_MD5_PERSISTENCE variable controls whether
    or not the fknop daemon writes the MD5 of all successfully decrypted SPA packets
    to disk. This allows fknop to detect replay attacks across restarts of fknop and
    even across system reboots. This feature is enabled by default, but can be disabled
    if you wish to verify detection functions correctly (requires sending a duplicate
    SPA packet over the network to the SPA server).


    ```

