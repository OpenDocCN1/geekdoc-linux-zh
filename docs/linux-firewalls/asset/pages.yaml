  md: '# psad Features


    In its current incarnation, psad can detect various types of suspicious traffic,
    such as poor scans generated by tools like Nmap (see http://www.insecure.org),
    probes for various backdoor programs, Distributed Denial of Service (DDoS) tools,
    and efforts to abuse networking protocols. When combined with fswn (see Chapters
    9, 10, and 11), psad can detect and generate alerts for 60 percent of all Snort-2.3.3
    rules, including those that require the inspection of application layer data.


    Among psad''s most interesting features is its ability to passively fingerprint
    the remote operating system when a scan or other malicious traffic operates. For
    example, if someone launches a TCP connect() scan from a Windows machine, or NT
    machine; psad can (usually) tell whether the scan came from a Windows XP, or even
    detect the Service pack of the remote system. The fingerprints psad uses are from
    pof. (See Chapter 7 for a discussion of pof and passive OS printing.) Furthermore,
    psad also offers verbose email and syslog alerts, the ability to automatically
    block an IP based on a danger level threshold (the feature is disabled by default),
    integrated with whois, DShield reporting (see http://www.dshield.org), and more.


    We will cover all of these features in the next two chapters, but for now, we''ll
    concentrate on the installation and configuration of psad.


    # psad Installation


    Before installing psad, you need to download the latest version from http://www.cipherdyne.org/psad/download.
