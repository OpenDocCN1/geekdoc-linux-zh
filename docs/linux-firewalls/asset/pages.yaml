  md: '# Snort Signatures


    One of the best ways to understand application layer attacks is to browse through
    the Snort signature set.³ Although recent Snort signatures are no longer distributed
    with the Snort source code, the Bleeding Snort project generates signatures for
    recent attacks in Snort format (see http://www.bleedsort.com).


    We will discuss Snort signatures in detail in Chapter 9, but here we introduce
    the application layer inspection capability provided by Snort. Linking iptables
    rules to Snort signatures is the key to getting true intrusion detection capabilities
    from iptables.


    Considering the following Snort signature:


    ```

    alert tcp $EXTERNAL_NET -> $HTTP_SERVERS $HTTP_PORTS (msg:WEB-ATTACKS / /etc/shadow";
    content:"etc/shadow"; flow:to_server,established; nocase; clasype:w e-application-activity;
    sid:1372; rev:5);

    ```


    This signature detects when the /etc/shadow (in bold above) is transferred from
    a web client to a webserver. The webserver (and any CGI scripts that it executes)
    most likely runs as a user without permissions to read the /etc/shadow file, but
    an adversary necessarily knows this before trying to request the file. Snort is
    looking for the *attempt* to read the file.


    In order to make iptables a log message when the /etc/shadow string is seen over
    an established TCP connection on port 80 in the firewall chain, use the following
    rule:


    ```

    [iptablesfw# iptables -I FORWARD 1 -p tcp --dport 80 -m state --state ESTABLISHED
    -m string --string "/etc/shadow" --algo bm -j LOG --log-prefix "ETC_SHADOW "

    ```


    # Buffer Overflow Exploits


    A *buffer overflow* is an attack that leverages a programming error in an application''s
    source code where the size of a buffer is insufficient to accommodate the amount
    of data copied into it; the term overflow is used when adjacent memory locations
    are overwritten. For stack-based buffers, a successful exploit overwrites the
    return address (which is on the stack) so that it points into code provided by
    the attacker. This, in turn, allows the attacker to control the execution of the
    process the-thenforeath.


    Another class of buffer overflow attacks are commonly introduced in C or C++ applications
    through improper use of certain library functions that do not automatically implement
    bounds checking. Examples of such functions include strcpy(), sprintf(), gets(),
    and scanf(), and


