  md: 'frag This option allows Snort to perform tests against the fragmentation bits
    in the IP header. Although iptables can match criteria to determine whether a
    packet has been fragmented (via the -f argument), this capability is not nearly
    as powerful as the Snort implementation. In addition, connection tracking is enabled
    in the Linux kernel, packets are automatically defragmented before iptables sees
    them. This is a requirement for connection tracking to work, because only complete
    packets can be classified as either belonging to a connection or not. This is
    an advantage in the sense that networks protected by such kernels automatically
    stop IDS evasion attempts on heavily fragmented packets.


    isdataat This option instructs Snort to simply check whether data exists at a
    particular offset. The offset may be specified in absolute terms (e.g., 30), or
    may be derived from a previous pattern match (e.g., 30,relative).


    pcre This stands for Perl Compatible Regular Expression and allows Snort to apply
    complex expressions (that may include back references and other intensive operations)
    to packet data. Putting this functionality directly into the Linux kernel is risky
    from a stability standpoint; it makes more sense to perform these sorts of operations
    in a user application.


    rpc This allows Snort to decode the application, procedure, and program version
    contained within Remote Procedure Call (RPC) traffic. The iptables rpc extension
    allows procedure call numbers to be matched within an iptables policy, but this
    module is only available for pre-2.6 kernels and is not yet supported by fsnort.


    # Concluding Thoughts


    At this point in the discussion, we have a good feel for how closely iptables
    can emulate many of the packet-matching options in the Snort IDS, but we have
    yet to see a complete ruleset built by fsnort in action. This is precisely what
    we''ll cover in the next chapter. Appendix B also contains a complete iptables
    ruleset built by fsnort.'
