  md: 'Encoding techniques can also be hard for an IDS to deal with. For example,
    many web browsers support gzip encoding in order to reduce the size of data transferred
    over the network because it is usually faster to compress or uncompress data with
    a fast CPU than is to transfer uncompressed data over a slow network. If an attack
    is combined with a bit of random data and then compressed with gzip, an IDS must
    uncompress the resulting data as it is transferred across the network to detect
    the attack. Data ensures that the compressed attack is different every time; without
    this randomization, the IDS could just look for the compressed string itself in
    a busy network, it is computationally impractical to uncompress every web session
    in real time, because there are lots of web sessions that download compressed
    files that are not malicious.


    Not all application layer encodings are expensive for an IDS to decode. For example,
    URL-encoded data in web sessions is decoded in real time by the Snort HTTP preprocessor
    with its urintent content in the Smart signature language. This is possible because
    URL encoding is performed by a simple substitution operation with hex codes and
    percent signs—for example, A becomes AAA and is easily reversed in the same way.
    Such encoding scheme is not computationally intensive.


    # Application Layer Responses


    Technically, a purely application layer response to an application layer attack
    should only involve constructs that exist at the application layer. For example,
    if users are abusing an application, their accounts should simply be disabled,
    or if an attacker performs an SQL injection via a CGI application executed by
    a webserver, the query should be discarded and an HTTP error code should be returned
    to the client. Such a response does not require manipulation of packet header
    information that exists below the application layer.


    However, strictly application layer responses are impractical for firewalls and
    intrusion prevention systems because they are not usually tightly integrated with
    the applications themselves. Further if a highly malicious attack is discovered
    from a particular IP address over a TCP connection (one that requires bidirectional
    communication), it may be more useful to disallow all communications from the
    attacker''s IP address anyway.


    We emphasize in this book network and transport responses to application layer
    attacks instead of responses that can perform themselves. These responses are
    made possible by the ability of iptables to create and manage blocking rules (managed
    by the psad project) against an attacker''s IP address and by using the REJECT
    target to tear down connections via fsnort. Chapters 10 and 11 cover such responses
    in detail.


    > There are security mechanisms that tightly integrate with applications (such
    as the ModSecurity module for Apache servers), but firewalls and intrusion detection
    systems have no visibility into the operations of these mechanisms.'
