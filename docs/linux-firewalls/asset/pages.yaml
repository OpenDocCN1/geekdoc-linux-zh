  md: '# Setting Up Whitelists and Blacklists


    Any software that can block network communications based on application layer
    data should also be able to exclude certain networks or IP addresses from any
    blocking actions based on a whitelist. At the same time, it should be able to
    force all packets to from certain networks or IP addresses to be dropped across
    a blacklist.


    Whitelists and blacklists are supported by fswnort with WHITELIST and BLACKLIST
    variables in the /etc/fswnort/fswnort.conf. For example, to ensure fswnort never
    takes action against communications that originate from or are destined for the
    webserver (IP address 192.168.10.3 in Figure 1-2), and to DROP all packets to
    from the IP address 192.168.10.200 include the following lines in fswnort.conf:


    | WHITELIST | 192.168.10.3 |

    | BLACKLIST | 192.168.10.200 |


    When you use fswnort to build the fswnort.sh script, two new sections are added:


    ```

    ########## Add/network WHITELIST rules ##########

    $IPTABLES -A FSWNORT_FORWARD -s 192.168.10.3 -j RETURN

    $IPTABLES -A FSWNORT_FORWARD -d 192.168.10.3 -j RETURN

    $IPTABLES -A FSWNORT_INPUT -s 192.168.10.3 -j RETURN

    $IPTABLES -A FSWNORT_OUTPUT -d 192.168.10.3 -j RETURN





    n########## Add/network BLACKLIST rules ##########

    $IPTABLES -A FSWNORT_FORWARD -s 192.168.10.200 -j DROP

    $IPTABLES -A FSWNORT_FORWARD -d 192.168.10.200 -j DROP

    $IPTABLES -A FSWNORT_INPUT -s 192.168.10.200 -j DROP

    $IPTABLES -A FSWNORT_OUTPUT -d 192.168.10.200 -j DROP

    ```


    The use of the RETURN target from each of the fswnort chains in the whitelist
    short-circuits the signature comparison as early as possible in order to minimize
    CPU resources that are devoted to heavyweight packet inspection; these rules are
    added. Similarly, the DROP target for the blacklist rules matches packets on the
    floor before any additional processing is performed.


    A summary of packet flow through the built-in FORWARD chain and fswnort appears
    in Figure 10-1.


    > This IP address is on the internal network, but sometimes certain systems function
    as dedicated resources for internal networks and should never communicate with
    networks outside. In this case, blacklist rules can enforce zero communications
    with external networks. Another scenario where blacklist rules would make sense
    if the internal system has been compromised and its communications must therefore
    be severely curtailed until it can be.


    Deploying fswnort 191'
