  md: '# Network Layer Responses


    Agreeing on definitions for network layer responses is as useful as agreeing on
    definitions for network layer attacks. Because such responses should not involve
    information that resides at the transport layer or above, we are limited to the
    manipulation of network layer headers in one of ways:


    +   - Filtering operation conducted by a device such as a firewall or router to
    block the source IP address of an attacker

    - Reconfiguration of a routing protocol to deny the ability of an attacker to
    route packets to an intended target by means of route blackholing—packets are
    sent into the void and are never heard again

    - Applying thresholding logic to the amount of traffic that is allowed to pass
    through a firewall or router based on utilized bandwidth


    A response that is purely at the network layer can be used to combat an attack
    that is detected at the application layer, but such a response should not involve
    things like generating a TCP RST packet for example—would be a transport layer
    response, as we will see in Chapter 3.


    # Network Layer Filtering Response


    After an attack is detected from a particular IP address, you can use the following
    iptables rules as a network layer response that falls into the filtering category.
    These rules are added to the INPUT, OUTPUT, and FORWARD chains; block all communications
    (regardless of protocol or ports) or from the IP address 144.202.X.X


    ```

    [iptablesfw]# -I INPUT 1 -s 144.202.X.X -j DROP

    [iptablesfw]# -I OUTPUT 1 -d 144.202.X.X -j DROP

    [iptablesfw]# -I FORWARD 1 -s 144.202.X.X -j DROP

    [iptablesfw]# -I FORWARD 1 -d 144.202.X.X -j DROP

    ```


    There are two rules in the FORWARD chain to block packets that originate from
    144.202.X.X (-s 144.202.X.X) as well as responses from internal systems that are
    destined for 144.202.X.X (-d 144.202.X.X). If you use iptables for network sent,
    then the above rules provide an effective network choke point against the 144.202.X.X
    address.


    # Network Layer Thresholding Response


    Applying thresholding logic to iptables rules is accomplished with the limit extension.
    For example, the limit extension can be used within an ACCEPT rule to limit the
    number of packets accepted from a specific source address within a window of time.
    The following iptables restrict the policy to only accept 10 packets per second
    or from the 144.202.X.X IP address.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '```

    iptablesfw# iptables -I INPUT 1 -m limit 10/sec -s 144.202.X.X -j ACCEPT

    iptablesfw# iptables -I INPUT 2 -s 144.202.X.X -j DROP

    iptablesfw# iptables -I OUTPUT 1 -m limit 10/sec -d 144.202.X.X -j ACCEPT

    iptablesfw# iptables -I OUTPUT 2 -d 144.202.X.X -j DROP

    iptablesfw# iptables -I FORWARD 1 -m limit 10/sec -s 144.202.X.X -j ACCEPT

    iptablesfw# iptables -I FORWARD 2 -s 144.202.X.X -j DROP

    iptablesfw# iptables -I FORWARD 1 -m limit 10/sec -d 144.202.X.X -j ACCEPT

    iptablesfw# iptables -I FORWARD 2 -d 144.202.X.X -j DROP

    ```


    For each ACCEPT rule above that uses the limit match, there is also a corresponding
    DROP rule. This accounts for packets that exceed the 10-percent maximum permitted
    by the limit match; once the packet levels are higher than this, they no longer
    match the ACCEPT rule and are then compared against the remaining rules in the
    iptables policy. It is frequently better to refuse to communicate with an attacker
    gather-than to even allow throttled rates of packets through.


    You can also use the limit match to place thresholds on iptables messages that
    are generated by default logging rules. However, unless disk space is a concern,
    applying a limit to a LOG rule is not usually necessary, because the kernel uses
    a ring buffer internally within the LOG target so that log messages are overwritten
    when packets hit a LOG rule faster than they can be written out syslog.


    # Combining Responses Across Layers


    Responses can be combined across layers, just as attacks can be. For example,
    a firewall rule could be instantiated against an attacker at the same time a TCP
    RST is sent using a combination of tools like fsnort and snard (see Chapter 11).

    One way to knock down a malicious TCP connection would be to use the IPTJECT target
    and then instantiate a persistent blocking rule against the source address of
    the attack. The persistent blocking rule is the network layer response, which
    prevents any further communication from the attacker''s current IP address with
    the target of the initial attack.

    Although this may sound effective, note that a blocking rule in a firewall can
    frequently be circumvented by an attacker routing over the The Onion Router (Tor)
    network.¹ By sending an attack over Tor, the source address of the attack is not
    predictable by the target.


    > ¹¹⁰Tor anonymizes network communications by sending packets through a cloud
    of nodes called onion routers in an encrypted and randomized fashion. Tor only
    supports TCP, so it cannot be used to anonymize attacks over other protocols such
    as UDP.'
