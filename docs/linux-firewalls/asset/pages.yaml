  md: 'In addition, many programmers do not consider the implications of using certain
    language constructs that can expose an application to attack in non-obvious ways.
    Finally, many applications have complex configurations, and security can be reduced
    by inexperienced users who deploy applications with risky options.


    Application layer attacks fall into one of three categories:


    # Exploits for programming bugs Application development is a complex endeavor,
    and inevitably programming errors are made. In some cases, these bugs cause serious
    vulnerabilities that are remotely accessible over the network. Good examples include
    a buffer overflow vulnerability derived from the usage of an unsafe C library
    function, web-centric vulnerabilities such as a webserver that passes unsanitized
    queries to a back-database (which can result in SQL injection attack), and those
    that postfilter content derived from users (which can result in Cross-Site Scripting
    or XSS attacks).


    # Exploits for trust relationships Some attacks exploit trust instead of attacking
    programming bugs. Such attacks look completely legitimate as far as the interaction
    with the application is concerned, but they target the trust people place on the
    usage of the application. Phishing attacks are a good example; the target is not
    a web application or mail server—it is the person interpreting a phishing email
    message.


    # Resource exhaustion Like network or transport layer DoS attacks, applications
    can sometimes suffer under mountains of data input. Such attacks render applications
    unusable for everyone.


    # Abusing the Application Layer


    Ever-increasing complexity within networked applications makes it easier to exploit
    application layer vulnerabilities. We saw some creative ways to abuse the network
    and transport layers in Chapters 2 and 3, but these techniques are almost prosaic
    when compared to some of the techniques levied against applications today.


    While the implementations of common network and transport protocols generally
    conform to guidelines defined by the RFCs, there is no standard that controls
    how a particular CGI application handles user input via a webserver, or whether
    an application is written in a programming language (like C) that does not have
    automatic bounds checking or memory management. Completely new attack techniques
    are discovered and released to the security community—a good example is the concept
    of HTTP Cross-Site Scripting involving mishandling of web cookies across domains
    (see https://en.wikipedia.org/wiki/Cross-site_coding).


    The following sections illustrate some common application layer attacks. Certain
    attacks can be detected with the iptables string match, and an iptables rule for
    a specific attack is included with each example. (This is by no means a complete
    list of all techniques for exploiting applications.)'
