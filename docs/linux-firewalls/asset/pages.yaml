- img_proc: true
  md: 'Although we are confident that iptables will not allow individual SSL sessions
    with the metasploit.com webserver to succeed, we would still like persistent iptables
    blocking rules to be created when a session is shut down. To do this, we use psad''s
    auto-blocking functionality by setting the following configuration variables in
    /etc/psad/psad.conf like so:


    ```

    ENABLE_AUTO_IDS      Y;

    AUTO_IDS_DANGER_LEVEL 4;

    AUTO_BLOCK_TIMEOUT    3600;

    ENABLE_AUTO_IDS_REGEX  Y;

    AUTO_BLOCK_REGEX      ESTAB;

    ```


    Next, we make psad aware of the new metasploit.rules file. To do so, we add an
    entry to the /etc/psad/snort_rule.dl file to map the Snort rule ID 900001 to a
    danger level of 4 (so that the AUTO_IDS_DANGER_LEVEL threshold will be tripped
    by the Metasploit update process):


    ```

    [iptablesfw]# cp /etc/fwsnort/snort_rules/metasploit.rules /etc/psad/

    snort_rules

    [iptablesfw]# echo "900001 4;" >> /etc/psad/snort_rule_dl

    [iptablesfw]# /etc/init.d/psad start

    * Starting...

    ```


    Now, our attempt to update the Metasploit exploit database from the int_scanner
    client systems follows:


    ```

    [int_scanner]$ cd framework-3.0

