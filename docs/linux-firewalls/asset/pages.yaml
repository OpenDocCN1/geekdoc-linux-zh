  md: 'In this case, Nmap receives zero packets from the targeted TCP stack, and it
    has to accept this as evidence that the port is either open (an open port does
    not respond with any packet upon receiving an orphaned FIN packet, as discussed
    in Chapter 3) or filtered (because a firewall or similar mechanism prevented the
    stack from responding). iptables indeed this blind FIN packet and, in the process,
    psad adds blocking rules against the attacker.


    # Maliciously Spoofing a Scan


    At this point, the attacker is well aware of the fact that an active response
    mechanism is being used to protect the target network. In addition, there is no
    elicit placed the attacker not to abuse IP in an effort to make it appear as though
    a scan originates from, say, an IP address addressed as Yahoo!''s network. As
    long as the target network and/or the local ISP has not any anti-spoofing measure
    (such as egress filtering against nonlocal IP addresses on appropriately positioned
    border routers and/or firewalls), then it is exceedingly easy for the attacker
    to pound arbitrary bits into the source address field in the IP header:


    ```

    [ext_scanner]# nmap -sS PO -S 68.142.X.X -e eth -n 71.257.X.X

    ```


    Starting 4.01 (http://www.inasecure.org/nmap/) at 2007-03-05 21:34 EST All 1672
    scanned ports on 71.257.X.X are filtered


    Nmap finished: 1 IP address (host up) scanned in 32.023 seconds


    The Nmap process running on the scanning system never sees any packets (either
    SYN/ACK packets for open or RST/ACK packets for closed ports) return from the
    target for two reasons: first, iptables is intercepting most of them, and second,
    any packets that are generated by the target are to the (spoofed) 68.142.X.X instead
    of back to the scanner. Although this results in Nmap listing all of the ports
    as being filtered, the attacker does not have to care about this; the goal is
    just to trigger the blocking response on the target. psad sees the scan from 68.142.X.X,
    and blocks it accordingly once it reaches DANGER_LEVEL3:


    ```

    Mar 21:34:46 psad: added iptables auto-block against 68.142.X.X for 3600 seconds

    Mar 21:34:52 iptablespsad: scan detected: 68.142.X.X -> 71.257.X.X tcp=[2-32787]
    SYN tcp=237 udp=0 icmp=0 dangerlevel: 3

    ```


    The blocking rules are triggered by explicitly ignoring any IP address that has
    a danger level of zero within the /etc/psad/auto_dl file, but it is impossible
    to list all of the important IP addresses in this manner. The TCP Idle scan also
    (see Chapter 3 for a detailed explanation) reveals that the source address of
    a scan is spoofed, so not only can spoofed source addresses be used just to trigger
    the active response machinery on the target, but can also be used to accomplish
    real scans, as well.'
