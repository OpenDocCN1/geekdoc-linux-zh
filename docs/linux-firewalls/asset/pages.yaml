    # Loadable Kernel Modules vs. Built-in Compilation and Security


    Most of the Netfilter subsystems enabled in the previous section may be compiled
    as a Loadable Kernel Module (LKM), which can be dynamically loaded or unloaded
    into out of the kernel at run time, or compiled directly into the kernel, in which
    case they cannot be loaded or unloaded at run time. In the configuration above,
    we have chosen to compile most Netfilter subsystems as LKMs.


    There is a security trade-off between compiling functionality as an LKM and compiling
    directly into the kernel. On one hand, any feature that is compiled as an LKM
    can be removed from a running kernel with the rmmod command. This can provide
    an advantage if a security vulnerability is discovered within the module, because
    in some cases the vulnerability can be mitigated by unloading the module. Too,
    if the vulnerability has been patched in the kernel sources, the module can be
    recompiled and redeployed without ever taking the system down completely; fixing
    the vulnerability would involve'
