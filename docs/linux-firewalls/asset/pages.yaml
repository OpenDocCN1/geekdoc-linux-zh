  md: '# All Metasploit updates take place over SSL by default with a self-signed
    SSL certificate. Figure 11-1 shows a Metasploit client launching an update through
    iptables firewall running fswport and psad


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_226_0.png)


    Figure 11-1: Metasploit update through fswport and psad


    As you can see here, the client uses the Metasploit update feature, but before
    the updates are returned by the Metasploit server, a valid SSL session must be
    instantiated. Therefore, during the SSL handshake, the Metasploit server returns
    its SSL certificate to the client.


    The Metasploit update process differs depending on the version of the Metasploit
    framework. Beginning with the 3.0 release, Metasploit is written in Ruby and uses
    the Subversion source control system⁴ to not only the exploit database but the
    source code files as. Because Subversion can communicate over SSL, to a remote
    repository, Metasploit does not have to build this capacity into it. In contrast,
    the Metasploit 2.x series performs the update with the Perl script msfupdate from
    the command line.


    # Metasploit 3.0 Updates


    To download and update the Metasploit 3.0 framework, a user could execute the
    commands below. (Some output has been removed for the sake of brevity, and we
    assume that the Subversion control command svn is installed.) Because we want
    to see how the Metasploit update process communicates with the update server,
    we take a trace on the iptables fswport system with tcpdump and then over the
    int_scanner system to perform the update. (The -s 0 commandline argument to tcpdump
    ensures the full length of each packet is recorded.)


    ```

    [iptablesfsw] tcpdump -i eth -s 0 -1 -nn port 443 -w metasploit_update.pcap

    [int_scanner] http://framework-markers.metasploit.com/msf/downloader/framework-3.0.tar.gz

    [int_scanner] tar xf framework-3.0.tar.gz

    [int_scanner] cd framework-3.0

    [int_scanner] svn update

    ```


    > ⁴Subversion (http://subversion.org) is a fantastic mechanism for tracking changes
    in source code (and even in binary files). All of the projects at http://www.cipherdyne.org
    are tracked within a Subversion repository, and even files used to write this
    book were tracked within Subversion the writing process.


    Combining psad and fswport'
