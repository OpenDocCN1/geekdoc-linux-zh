  md: '# Top 20 Scanned Ports


    At begins the top 20 scanned TCP and UDP ports. You can display more than the
    top 20 by increasing the STATUS_PORTS_THRESHOLD variable in psad.conf. If there
    is a worm on the loose for a particular service, the top 20 scanned ports might
    help to illustrate increased work activity against service. If you have systems
    in your network that are vulnerable to the attack exploited by a worm, this output
    can focus your efforts on removing the vulnerability from your infrastructure.


    # Logging Prefixes


    Records the logging prefixes that are being tracked by psad. If you run fswort
    (discussed in Chapters 9, 10, and 11), this section can contain a lot of information,
    because each fswort rule corresponds to a different Snort signature. This section
    gives you an overview of the logging prefixes that are most commonly triggered
    in your iptables policy—the logging prefixes are displayed in order, starting
    with the prefix that is triggered the most.


    # DShield Statistics


    At is the number of email alerts that have been sent to the DShield IDS. Also
    displayed are the total number of packets collected by psad and sent to DShield
    for additional analysis.


    # Automatically Blocked IP Addresses


    Shows addresses that have been blocked by psad. This requires ENABLE_AUTO_IDS
    to be set to Y. The auto-response information is always displayed in the status
    output, even ENABLE_AUTO_IDS is set to Y because psad could have blocked a set
    of IP addresses in a previous execution where the auto-response feature was enabled
    (even if it isn''t currently enabled in the running psad instance).


    # Scanning IP Address Detail


    At begins a list of all source IP addresses that psad is currently tracking and
    has assigned DANGER_LEVEL1 as a severity measure of the suspicious traffic monitored
    from each address. Each included in IP address line are the iptables chain and
    input interface that logged the suspicious packets, a breakdown of the number
    of TCP, UDP, and ICMP packets from the source IP address, the current danger level,
    and finally, a guess of the operating system that generated the suspicious traffic
    (see “Passive OS Fingerprinting on page 121).


    > Even though psad is about writing scan information to disk within the /var/log/psad
    directory, there is another way to get information on how the running psad daemon
    is performing. By executing the command -U (as root), the running psad instance
    will receive a USRI signal that instructs it to use the Data::Dumper Perl to dump
