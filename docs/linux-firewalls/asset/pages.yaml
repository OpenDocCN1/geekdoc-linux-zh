    # Encryption and Application Encodings


    Two factors make it difficult to detect application layer attacks: encryption
    and application encoding schemes. Encryption is particularly problematic because
    it is designed to make decryption computationally infeasible in the absence of
    the encryption keys, and normally IDS, IPS, and firewall devices do not have access
    to these keys.


    However, some application layer exploits do not have to be encrypted to be successful.
    For example, there are Snort signatures (which necessarily operate "in the clear")
    for certain attacks against SSH servers. When these signatures are used, Snort
    is looking at payload without access to the SSH encryption. The existence of these
    signatures tells us that encryption alone is not a panacea, and attackers can
    exploit vulnerabilities in applications where layers of encryption normally make
    no difference. That is, vulnerabilities can exist within functions that are accessible
    via non-encrypted methods.


    > 6, Someone could manufacture the "RemoteNC Control Password:" string from an
    arbitrary TCP server without necessarily trying to authenticate to the Fsniffer
    backdoor, but by this way, the activity is suspicious.


    > 7 There are IDS products that offer SSL key escrow services so that encrypted
    webserver communications can be inspected after unraveling the encrypted data.'
