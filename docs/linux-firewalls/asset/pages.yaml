    # Detecting and Reacting to the Dumodor Trojan


    In recent years, malware authors have elevated the stakes in computer

    security. With a rich target environment provided primarily by unpatched

    Windows systems with broadband connectivity to the Internet, the damaging

    effects of malware designed specifically to gain financial and other personal

    data can be numerous.


    The Dumodor trojan is malware that contains both a keylogger

    (for collecting and transmitting sensitive information typed on a keyboard

    back to an attacker), and a backdoor server that listens on ports 9125 and

    64972. The Bleeding Snorset includes a signature designed to detect

    when the Dumodor trojan attempts to send information back to an attacker

    via a web session, as shown here:


    ```

