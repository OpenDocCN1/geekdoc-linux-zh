  md: '# The NF_DROP Macro


    A look at the source code confirms that the iptables REJECT target drops matching
    packets. Specifically, if you look at the file linux/net/ipv4/netfilter/ipt_REJECT.c
    in the kernel sources, you will see the following return state at three places
    in the reject() function (and there are no other return statements):


    ```

    return NF_DROP;

    ```


    Thus, the macro NF_DROP is the only possible return value for the reject() function,
    and it instructs iptables to drop any matching packet on the floor. A matching
    packet is prevented from continuing up the stack or being forwarded to its intended
    destination. Therefore, in our attack example, even if the attacker filters the
    incoming RST, the webserver will never sees the incoming/Setup.php attack.


    # Metasploit Updates


    The Metasploit Project (http://www.metasploit.com) is one of today''s most important
    open source security projects. Its continued development has reaching implications
    for computer security, and it is consistently rated among the top security tools
    by security researchers in Fedora''s Top 100 Network Security Tools list (http://www.sectools.org).
    Metasploit is a pluggable framework for automating development and use of attacks
    for software vulnerabilities, and the community that has built around Metasploit
    has contributed greatly to the state of vulnerability research and automation.
    With many security technologies, Metasploit''s exploit capabilities can be abused
    by those who endeavor to break into systems, the net effect of Metasploit on the
    security landscape is a positive one—more security vendors will pay greater attention
    to security.


    # Metasploit Update Feature


    If people are using your corporate network as a launching point for Metasploit
    attacks, they are almost certainly violating your local security policy (unless
    this is an officially sanctioned activity as a professional penetration test).
    One good way to detect such activity is to look for traffic associated with the
    Metasploit update process.


    The Metasploit developers regularly release exploits for new vulnerabilities,
    and Metasploit provides an update feature for its exploit database so that users
    can take advantage of these new exploits without waiting for the next Metasploit
    release. From a security perspective, it is not interesting when a user casually
    browses to the http://www.metasploit.com website. It is much more interesting
    when a user is actually using the software, and the Metasploit update process
    is a good indicator of such activity. The goal of this section is to show how
    snort and psad can work together to stop Metasploit updates once a Snort rule
    is developed.'
