  md: '# COMBINING PSAD AND FWSNORT


    So far we have covered operational and theoretical aspects of both fsnort and
    psad individually, but we have yet to put the two programs together. Although
    psad provides detection, alerting, and auto-response capabilities, the effectiveness
    of its detection engine is fundamentally limited by the characteristics of the
    iptables logging format. Better attack detection is offered by fsnort, including
    detection for application layer attacks. And because iptables is always inline
    to network traffic, fsnort can (optionally) prevent malicious packets from reaching
    their intended targets.


    However, because an iptables policy derived from fsnort runs entirely within the
    Linux kernel, it cannot perform various alerting functions that are typically
    possible with a userland application. We need a mechanism for tying the signature
    detection process of fsnort together with psad''s ability to issue whose lookups,
    reverse DNS queries, send email alerts, associate danger levels with malicious
    IP addresses, and communicate attack information to DShield.


    > ¹ This assumes that the system running is not receiving packet data from a span
    port on switch or via a similar mechanism. This is normally a good assumption
    iptables are designed to enforce a security policy against live packet data that
    is destined for real systems; enforcing policy against passively collected packets
    is of little use.'
