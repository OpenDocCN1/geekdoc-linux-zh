    # Detecting Trin00 DDoS Tool


    Trin00 is a classic tool for mounting a Distributed Denial of Service (DDoS) attack
    by sending large quantities of UDP packets against a target from multiple attack
    nodes. Trin00 implements its methods for coordinating the efforts of the nodes,
    and the signature devotes various signatures to detecting Trin00 administrative
    communications. For example, Snort ID 237 looks for the string aaads1 contained
    within a UDP packet for port 2744 on the home network. This string is the default
    password that a Trin00 control node uses to authenticate an endpoint node in order
    to perform particular operations, and is included within Snort rule ID 237:


