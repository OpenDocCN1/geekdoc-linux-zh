  md: '# ATTACK SPOOFING


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_300_0.png)


    If there is one constant among intrusion detection systems, it is that they generate
    false positives—alerts are sometimes sent for traffic that is clearly not malicious.
    An IDS is a requirement for reducing the false positive load, but even the most
    finely tuned IDS can mistake normal traffic for something malicious. Networks
    are complex beasts, and intrusion detection systems generate false positives when
    monitoring isolated internal networks that are not subject to any attack or malicious
    activity. This creates a window of opportunity for an attacker. If an attacker
    can deliberately manufacture network traffic that looks malicious to an IDS, it
    may also be possible to hide real attacks from the IDS (or the people watching
    the alerts from the IDS). After all, an IDS is only as good as the people who
    are watching the alerts—if there are a huge number of alerts that are all equally
    plausible, then a real attack can sometimes easily be buried within this mountain
    of data.'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'Furthermore, an attacker can frame an innocent third party by spoofing attacks
    against an IDS from an IP address owned by that third party; it can be difficult
    for an IDS administrator to distinguish between the spoofs and real attacks. The
    snortspoof.pl script that appears later in this appendix shows how to create bogus
    traffic targeted against the Snort IDS; in our discussion of the script, we''ll
    also cover the countermeasures Snort employs to mitigate this sort of attack.


    # Connection Tracking


    As mentioned in Chapter 9, the stream4 preprocessor was added to Snort to combat
    spoofed TCP attacks; it tracks the state of TCP sessions and ignores attacks that
    are not sent over established sessions. From the perspective of an attacker, the
    best way to generate malicious-looking traffic is to parse the signature that
    an IDS uses and craft packets with fake source IP addresses that match those signatures.


    This is exactly what the following Perl script (snortspoof.pl) does for the Snort
    IDS rules. (This script is distributed with the fsnow project and can also be
    downloaded from http://cipherdyne.org/LinuxFirewalls). The snortspoof.pl script
    is designed to illustrate how easy it is to use Perl to build IPs that would identify
    as malicious, without the stream preprocessor. However, this script is not meant
    to be a comprehensive program for generating traffic that matches all Snort rules.
    Some Snort rules contain complex descriptions of application layer data (in some
    cases regular expressions are specified with the pcre keyword, for example), and
    snortspoof.pl does not handle such complexities.


    ```

    [spoofer] cat snortspoof.pl

    !/usr/bin/perl -w

    ```


