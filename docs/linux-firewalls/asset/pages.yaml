    # psad syslog alerting


    In addition to email alerting, syslog is an important reporting mechanism for
    psad. During the course of normal operations, psad generates three categories
    of syslog alerts.


    # Informational Messages


    Periodically, psad generates informational syslog messages that are designed to
    inform you about administrative activities performed by psad, as importing configuration
    files and scan information from a previous psad execution.'
