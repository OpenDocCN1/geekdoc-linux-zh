  md: 'GPG_DECRYPT_ID specifies a unique identifier for the fwknop server''s GnuPG
    public key, which is used by an fwknop client to encrypt the SPA packet. This
    unique identifier can be obtained from the output of the gpg --list-keys command
    and is normally a string of eight hex characters.


    GPG_DECRYPT_ID: ABCD1234;


    # GPG_DECRYPT_PW


    The GPG_DECRYPT_PW variable holds the decryption password for the fwknop server''s
    GnuPG public key, which is used by an fwknop client for encryption. Because this
    password is contained within a plaintext file, you should generate a new GnuPG
