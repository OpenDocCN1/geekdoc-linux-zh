    In 2001, I split off the Bastille-NIDS project into its own project so that it
    could run on its own without necessarily having Bastille installed, and I named
    it the Port Scan Detector. The development cycle for psad is quite acute, with
    a new release appearing three or four months, on average.


    # Why Analyze Firewall Logs?


    Good network security begins with a properly configured firewall that is only
    permissive as absolutely necessary in order to allow basic network connectivity
    and services. Firewalls are inline devices and are well positioned to apply filtering
    logic to network traffic. In the context of computer networking, an *inline device*
    is any piece of hardware that lies in the path of packets as they are routed through
    a network. If a hardware or software failure develops within an inline device
    and affects its ability to forward network traffic, network communications cease
    to function. Example inline devices include routers, switches, bridges, firewalls,
    and network intrusion prevention systems (IPS).^2


    As firewalls become more featured and complex, they are gradually offering capabilities
    (such as application layer inspection) that have traditionally been the the purview
    of intrusion detection systems. By combining these features with the ability to
    filter traffic, firewalls can provide valuable intrusion detection data that can
    offer an effective mechanism to protect services from outright compromise and
    sophisticated reconnaissance attacks, and limit the potential damage from worm
    traffic. Firewalls like iptables that offer extensive logging and filtering capabilities
    can provide valuable security data that should not be ignored.


    A dedicated intrusion detection system as Snort offers a large feature set and
    a comprehensive rules language to describe network attacks, iptables is always
    inline to network traffic and offers detailed packet header logs (which may be
    combined with application layer tests, we will see in Chapter 9). The defense-in-depth
    principle applies and therefore it is a good idea to listen to the story that
    iptables has to.


    > ^1 See http://www.cypherline.org/psad/faq.html#diff_portentry for more information
    on why PortSentry is incompatible with restrictive firewall policy.


    > ^2 Although a network intrusion detection system (IDS) is fed network traffic
    by a device that is inline (such as a switch), if the IDS is down, network communications
    are unaffected. Because the IDS is only given a copy of each packet for examination,
    and it is not required to forward packets to its intended destinations.'
