- img_proc: true
  md: '# Port Scan Detection with psad


    Although many attacks have moved into the application layer, a significant number
    of suspicious activities will manifest themselves at the transport layer and below.


    Any complete implementation of the TCP/IP suite is a large and complicated batch
    of code, and this complexity makes it an attractive target for everything from
    reconnaissance efforts to Denial of Service attacks. This section will illustrate
    several attacks and probes against the iptables Linux system and will reference
    the network diagram in Figure 1-2 (duplicated as Figure 6-1). In this time, psad
    is also deployed on the iptables system along with the default policy built by
    the iptables.sh script described in Chapter 1, which is available at http://cipherherdyne.org/LinuxFirewalls).
    All attacks discussed in this section are sent against the iptablesw system with
    the iptables policy in the kernel. The default log scan of policy is all that
    psad requires in order to detect suspicious activity; no additional features (such
    as string matching) are required.


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_121_0.png)


    Figure 6-1: Default network diagram


    Port scans are an important technique for interrogating remote targets, and psad
    was developed primarily with the goal of providing advanced port scan detection
    for Linux systems. The first order of business is to illustrate various types
    of port scans and how they appear in your iptables logs.


    As in Chapter 3, we use Nmap to map scan a system. This, however, the scan target
    is running psad so that the iptables logs can be analyzed. We will use Nmap to
    generate the following types of port scans, and then we will see how psad can
    detect:


    +   * TCP connect() scan

    * TCP FIN, XMAS, and NULL scans

    * TCP SYN or half-open scan

    * UDP scan


    NOTE See Chapter 3 for technical descriptions of these scanning techniques.'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'Each scan is launched from the ext_scanner system as shown in Figure 6-1 against
    the external 71.157.X.IP address of the iptables firewall. Before sending the
    first scan, we make sure that psad is running on iptables firewall with the default
    DANGER_level(n) settings in the /etc/psad/psad.conf file:


    # # NMAP AND ROUND TRIP TIMES


    For most of the scan examples in this section, the Nmap timing options (such as
    -T and max-rtt-timeout) can affect how fast Nmap is to scan the target. Because
    iptables severely restricts the responses the local stack can send to each scan
    probe, you can limit the amount of time Nmap waits for responses that will come.
    For example, when Nmap sends a SYN packet to port 5000, iptables drops it, and
    so the SYN/ACK or RST expected by Nmap is never sent by the targeted stack. By
    shortening the time Nmap waits for this response (with the --max-rtt-timeout option),
    we can reduce the overall time to scan the system.( One way to determine a good
    upper bound on the --max-rtt-timeout value is to use the ping utility to measure
    the round-trip time to the target before starting a scan.


    # ## TCP connect() Scan


    The Nmap TCP connect() (-sT) is introduced in Chapter 3, and can be used by non-privileged
    users on Unix-style operating systems. We illustrate this first scan against the
    target IP address 71.157.X:


    ```

    ``` [ext_scanner]$ nmap -sT 71.157.X.X --max-rtt-timeout 500 ```

    ```


    Starting Nmap 4.01 ( http://www.insecure.org/nmap/ ) at 2007-07-08 23:22 EST

    Interesting ports on 71.157.X.X:


    +   - 1671 ports scanned but not shown below are: (filtered)

    - PORT STATE SERVICE

    - 80/tcp open http


    Nmap finished: 1 IP address (host) scanned in 22.551 seconds


    A total of 1671 TCP ports were scanned (①), and nearly are all filtered (②) because
    iptables is dropping the majority of the connection attempts. The HTTP port is
    open (③). Once the scan is finished, we examine the /var/log/messages file to
    see if psad has detected the scan. The following syslog message appears here:


    ```

    Jul 8 23:22:29 iptablesfw psad scan detected: 144.202.X.X -> 71.157.X.X:

    [1-65301] SYN ports detected: ⑤1532 DL: 4

    ```


    The psad syslog message shows the source and destination IP addresses, the range
    of TCP ports that were scanned (1-65301), the flags that were sent (SYN in this
    case), the total number of packets sent, and the danger level that psad has assigned
    to the scanner (DL: 4).


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_122_0.png)'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'In this case, the number of packets monitored by psad is 1532 (see above) and
    exceeds the 1,500 packets required to reach danger level 4 (as defined the DANGER_LEVEL4
    in /etc/psad.conf). Email alerts are also generated by psad, and they contain
    more information than can be packed into a single-line syslog message. (See "psad
    Email Alerts" on page 108 for a complete example of a psad email alert.)


    To see the iptables logs that psad uses to detect the scan, check the /var/log/psad/fwdata
    file. (Recall that psad is running, kmsguard is receiving iptables logs via syslog
    and writing them to /var/log/psad/fwdata file; more information about kmsguard
    can be found in Chapter 5.) There are here logs from the fwdata file:


    ```

    JUL 8 22:04:04 iptables kernel: DROP IN=eth0 OUT= MAC=00:13:d3:38:b6

    04:38:40:42:37:08 SRC=144.202.X.X DST=71.157.X.X LEN=60 TOS=00

    PREC=000 TTL=64 PROTO=TCP SPT=55103 DPT=53 WINDOW=5840 RES=00

    URG=0 (020405b402080a31AC39280000001030306)

    JUL 8 22:04:04 iptables kernel: DROP IN=eth0 OUT= MAC=00:13:d3:38:b6

    03:48:40:42:37:08 SRC=144.202.X.X DST=71.157.X.X LEN=60 TOS=00

    PREC=000 TTL=64 PROTO=TCP SPT=35631 DPT=53 WINDOW=5840 RES=00

    URG=0 (020405b402080a31AC39280000001030306)

    JUL 8 22:04:23 iptables kernel: DROP IN=eth0 OUT= MAC=00:13:d3:38:b6

    03:40:48:42:37:08 SRC=144.202.X.X DST=71.157.X.X LEN=60 TOS=00

    PREC=000 TTL=64 PROTO=TCP SPT=60134 DPT=53 WINDOW=3189 RES=00

    URG=0 (020405b402080a31AC39280000001030306)

    ```


    Notice that several fields in the logs appear in bold. The field at ① above, shows
    that either the packet that generated the log message is blank, the string OUT
    tells us that either the packet that generated the log message hits a LOG rule
    within the iptables INPUT chain, or it hits a LOG rule in a chain before the routing
    calculation is made within the kernel (e.g., the PREROUTING chain in the raw data)


    Because iptables logging format does not explicitly include the iptables chains
    that contain the LOG rule, we can''t tell from the log message above whether the
    packet is logged from the INPUT chain or the PREROUTING chain. However, because
    it''s likely that iptables policies default rules within the INPUT, FORWARD, or
    OUTPUT chains than the PREROUTING or POSTROUTING chains, psad assumes the following
    rules apply to all iptables logs:


    +   - Messages that don''t contain an output interface are logged within the INPUT
    chain.

    - Messages that don''t contain an input interface are logged within the OUTPUT
    chain.

    - Messages that contain an input and output interface are logged within the FORWARD
    chain.


    Hence, for the TCP connect() scan above, psad assumes that the scan is logged
    via the INPUT chain, which is correct given the iptables policy built by the iptables.sh
    script. Because the IP address 144.202.X.X is included within the log messages
    at ② psad knows where the scan originated.'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'Remember scans are sometimes deliberately spoofed, so this IP address cannot
    be completely trusted as the real source of the scan. When executed as root, Nmap
    can sended scans with the decoy option (-D), and the Idle scan can use IP spoofing
    as an integral component.


    The next three strings in the iptables log message above indicate the protocol
    and port scanned, as well as the flags used. In this example, the scanner is interested
    in TCP ports, and the scan packets have only the SYN flag set.


    Recall that a total of 1,671 ports were scanned by Nmap in the connect() scan
    above, but only 1,532 iptables log messages were written to the /var/log/psadfifo
    file. The difference stems from two factors: the iptables to quickly generate
    log messages, and SYN packet retransmissions from Nmap. Nmap buffers iptables
    internally to a ring buffer within the kernel, if the traffic rate is enough to
    overflow the ring buffer with new messages before the old ones can be written
    to the /var/lib/psadfifo named pipe, then messages are simply lost. The trade-off
    is that your machine stays and continues at a decent level at the expense of losing
    a few logging messages (which seems like a good trade-off). Because Nmap typically
    sends one retry per nonresident port, Nmap really sent over 3,300 packets for
    this particular scan (the kernel ring buffer was not able to keep up with this
    packet rate, so about half of the packets were not logged).


    # TCP SYN or Half-Open Scan


    Now turn to Nmap''s SYN (half-open) scan method. The SYN scan is Nmap''s default
    scan type when executed by a privileged user. (Indeed, and all other interesting
    Nmap scans require access to raw sockets and must be executed by a privileged
    user.)


    Because the iptables firewall on the target system has been configured to drop
    all SYN packets not delivered for TCP port 80, the SYN scan looks nearly to a
    regular connect() scan when viewed on the wire, there are very few SYN/ACK packets
    for the scanners'' TCP stack to respond to. We see SYN packets from the same source
    address and nothing else.


    This reasoning is generally sound in theory, but in practice we see several significant
    differences between the SYN and connect() scans even when the initial SYN packets
    are dropped by iptables in both cases. These differences show up in the specific
    packet header fields for the SYN packets that are sent by Nmap in the SYN scan
    versus those that are by the TCP stack itself via the connect() scan. As discussed
    in Chapter 3, many more TCP options are sent by the connect() scan than by the
    SYN scan, but there are other differences as well. The remainder of this section
    illustrates the specific differences between the SYN packets in each scan, and
    how you can see these differences in the iptables log messages on the iptablesfw
    system.'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'The command starts below a SYN scan against the target IP address 71.157.X.X


    ```

    [ext_scanner]# nmap -n 71.157.X.X --rtt-timeout 500

    ```


    Starting Nmap 4.03 ( http://www.insecure.org/nmap/ ) at 2007-07-13 13:58 EDT

    Interesting ports on 71.157.X.X:

    (The 1672 ports scanned but not shown below are in state: filtered)

    PORT STATE

    80/tcp open http


    Nmap finished: 1 IP address (1 host) scanned in 22.611 seconds


    A quick examination of the /var/log/message files shows that phas had the scan:


    Jul 13 15:38:10 iptables fw scan detected: 142.202.X.X -> 71.157.X.X tcp [1-65301]
    flags: SYN tcp pkts: 54 DL: 4


    The scanner has reached danger level 4 because over 1,500 packets have been sent,
    and this exceeds the DANGER_LEVELA variable in the psad.conf file. On the target
    system, iptables has logged each SYN packet from the scan:


    Jul 13 15:38:10 iptables kernel: DROP IN=eth0 OUT= MAC=00:13:d3:38:b6:64:00:38:40:42:37:00
    SRC=142.202.X.X DST=71.157.X.X LEN=44 TOS=0x00 PRE=0x00 TTL=53 ID=27267 PROTO=TCP
    SPT=62316 DST=7200 WINDOW=2048 RES=0x00 SYN URG=0 OPT (020405b4)


    Jul 13 15:38:10 iptables kernel: DROP IN=eth0 OUT= MAC=00:13:d3:38:b6:64:00:38:40:42:37:00
    SRC=142.202.X.X DST=71.157.X.X LEN=44 TOS=0x00 PRE=0x00 TTL=55 ID=29812 PROTO=TCP
    SPT=62316 DST=5001 WINDOW=4096 RES=0x00 SYN URG=0 OPT (020505b4)


    This time we highlighted features of the log messages that are different from
    the TCP connect() scan in the previous sections. We show the fields, with the
    reason each different than in the connect() scan

    \LEN length in the IP header is 14 bytes for the SYN scan because the real TCP
    stack has more options in the SYN packets that it sends via the connect().

    \TTL The Time-to-Live (TTL) value in the IP header is all initialized to the same
    value by the real IP stack on a client system using the TCP connect(). However,
    because Nmap is crafting the SYN packet in the SYN scan, it can set the TTL value
    to whatever it wants, and it randomly selects TTL values between 37 and 60.

    \WINDOW The TCP window size is by either 1024, 2048, 3072, or 4096 during the
    SYN scan. In contrast, the real TCP stack always initiates TCP connections with
    a window size of 5840.


    Chapter 6'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'OPT The options portion of the TCP header is substantially shorter in the Nmap
    SYN scan. In this case, it uses a single option, the Maximum Segment Size, and
    sets it to 1460.¹ Most TCP stacks send multiple options, such as the Timestamp,
    No Operation (NOP), and whether Selective Acknowledgement is OK (SACK), in addition
    to the Maximum Segment Size. (You''ll find more information about decoding the
    OPT string in iptables messages ("Emulating p0f with psad" on page 122.)


    # FIN, XMAS, and NULL Scans


    The Nmap FIN, XMAS, and NULL scans appear quite similar when represented by iptables
    log messages. Indeed, the only significant difference between these scans type
    is the combination of TCP flags used—a difference that shows up in the TCP flags
    portion of the iptables logging format for packets. In addition, because the FIN,
    XMAS, and NULL scans are each represented by a specific Snort rule that does not
    application layer inspection, psad can detect these scans via individual packets
    rather than relying on packet counts and ranges.


    # FIN PACKETS AND NETFILTER CONNECTION TRACKING


    > It is normal to find a TCP packet with the FIN flag in legitimate TCP communications;
    it is used to indicate that one of a TCP connection has no data to send and is
    closing the connection. Therefore, in order to effectively differentiate a FIN
    scan and a legitimate FIN packet, it is important to use Netfilter''s connection
    tracking mechanism to accept all packets that match the ESTABLISHED state and
    to drop the rest. Unexpected FIN packets match the INVALID state are not part
    of any established TCP connection and are logged and dropped very early in the
    iptables policy built by the iptables.sh script in Chapter 1.


    You can initiate the FIN, XMAS, and NULL scans with the respective -sF,-sN and
    -sX command-line arguments to Nmap. For the sake of brevity, we just list the
    scanner:


    ```

    [ext_scanner]# nmap -sF -fn 71.157.X --max-rtt-timeout 5

    ```


    Starting Nmap 4.03 ( http://www.insecure.org/nmap/ ) on 2007-07-13 14:39 EDT 1674
    scanned ports on 71.157.X are: open|filtered


    Nmap finished: 1 IP address (1 host up) scanned in 36.223 seconds


    ¹Versions of Nmap prior to 4.02 did not send any TCP options at all SYN packets,
    and this is a useful fact to know when looking for Nmap scans in network traffic
    because it gives you more information about your potential adversary.'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'As you can see, the FIN scan did not detect psad''s watchful eye:


    ```

    Jul 13:39:10 iptablesfw: scan detected: 142.202.X.X - 71.157.X.X

    tcp: [1-65295] flags: FIN tcp pkts: 1511 DL: 4

    ```


    We see many messages logging in the /var/log/psad/fwdeta file that resemble the
    following message. The FIN flag is listed at @ that shows the INVALID prefix at
    @ logging rule matched the patterns:


