  md: '# iptables sh Script Preamble


    To begin the iptables.sh script, it is useful to define three variables, IPTABLES
    and MODPROBE (for the paths to the iptables and modprobe binaries) and INT_NET
    (for the internal subnet address mask), that will be used throughout the script
    (see ① below). At any existing iptables rules are removed from the running kernel,
    and the filtering policy is set to DROP on the INPUT, OUTPUT, and FORWARD chains.
    Also, the connection-tracking modules are loaded with the modprobe command.


    ```

    [iptablesfw]# cat iptables.sh

    !/bin/sh

    ① IPTABLES=/sbin/iptables

    MODPROBE=/sbin/modprobe

    INT_NET=192.168.10.0/24


    ### flush flushing rules and set chain policy setting to DROP

    echo "+] Flushing iptables rules..."

    ② IPTABLES -F

    $IPTABLES -F t nat

    $IPTABLES -X

    $IPTABLES -P INPUT DROP

    $IPTABLES -P OUTPUT DROP

    $IPTABLES -P FORWARD DROP

    # load connection-tracking modules

    $MODPROBE ip_conntrack

    $MODPROBE ipt_nat

    $MODPROBE ip_conntrack_ftp

    $MODPROBE ip_nat_ftp

    ```


    # The Input Chain


    The Input chain is the iptables construct, that governs packets that are destined
    for the local system (that is, after the result of a routing calculation made
    by the kernel IP stack designates the packet is destined for a local IP address)
    may talk to a local socket. The first rule in the INPUT chain instructs iptables
    to drop all packets (or if the policy of the INPUT chain is set to DROP), then
    efforts to communicate directly with the system over IP communications (such as
    TCP, UDP, or ICMP) will fail. The Address Resolution Protocol (ARP) is also an
    important class of traffic that is ubiquitous on Ethernet networks. However, ARP
    requests work at the data link layer of the network layer, iptables cannot filter
    such traffic, since it only filters traffic and overlapping protocols.


    Hence, ARP requests and replies are sent and received with arptables, but discussion
    of this topic is beyond the scope of this book, since we generally concentrate
    on the network layer and above).


    iptables can filter IP packets based on data link layer MAC addresses, but only
    if the kernel is compiled with the MAC address extension enabled. In the 2.4 kernel
    series, the MAC address extension must be manually enabled, and the 2.6 kernel
    series enables it by default.'
