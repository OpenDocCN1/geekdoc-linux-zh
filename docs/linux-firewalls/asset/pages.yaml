  md: '# TRANSLATING SNORT RULES

    TO IPTABLES RULES


    In this chapter we''ll introduce fsnort or Firewall Snort¹ (see [http://www.cipherdyne.u004org/fsort](http://www.cipherdyne.u004org/fsnort)).
    This software is written in Perl and translates Snort rules into equivalent iptables
    rules. The fsnort project utilizes the filtering and inspection capabilities of
    iptables—including heavy use of the iptables string match extension—in order to
    match Snort rules as closely as possible within an iptables ruleset.


    Although it is not always possible to cleanly translate many Snort rules, due
    to the complexity of the Snort language, fsnort is nonetheless able to translate
    about 60 percent of all rules contained in Snort version 2.3.3.²


    ¹The first versions of fsnort were based originally on the shell script snort2iptables
    written by William Stearns (see [http://www.starns.org/snort2iptables](http://www.starns.org/snort2iptables)).


    ²Both the Snort-2.3.3 ruleset and the Bleeding Snort rules (see [http://www.bleedingsnort.com](http://www.bleedingsnort.com))
    are freely distributed with the fsnort sources, and are not subject to the licensing
    terms of the VRT signatures distributed by Sourcefire.'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'Although fswort is not able to translate the complete Snort signature set into
    iptables rules, fswort is always deployed inline to network traffic. Snort is
    typically deployed in a passive stance and monitor a network for suspicious activity—it
    is not deployed inline, although it does offer this capability. Any policy built
    by fswort is not constrained to passive inspection—an fswort policy can be configured
    to drop malicious packets via the iptables target.


    Chapters 10 and 11 will demonstrate how to use fswort in full reactive mode to
    respond to a few example attacks, but we first need some background on the process
    fswort uses to translate Snort rules into iptables rules. We''ll begin with an
    explanation of why you might want to deploy Snort on your Linux, and we will examine
    sample Snort rules that fswort has translated into iptables rules.


    The flexibility and completeness of the Snort rules allow Snort to search for
    highly descriptive representations of network-based attacks and responses to those
    attacks as they travel across the network. This is one feature that has firmly
    solidified Snort''s place as one of the best tools for intrusion detection and
    prevention.


    A good intrusion prevention system (IPS) will never be a complete replacement
    for an effective firewall, however. Firewalls and intrusion prevention systems
    generally approach security enforcement from opposite viewpoints; points define
    the set of permissible traffic based upon a security policy and block (and frequently
    log) traffic that does not conform to the policy. In contrast, intrusion prevention
    systems define a set of impermissible network traffic and block (or otherwise
    respond to) only those activities.


    At the same time, the boundaries between firewall and IPS implementations are
    blurring to begin to converge. Firewalls are engineered to have more application
    layer processing capability (a long-time strength of intrusion detection systems),
    and intrusion prevention systems are engineered to offer basic filtering capabilities
    that don''t depend on application layer processing. Examples of this in the world
    of software, respectively, are the Application Intelligence feature in Check Point''s
    NG firewall and the Dynamic Firewall feature in the IPS mode of the Enterasys
    IDS/IPS.


    # Why fswort?


    The fswort project is focused on enhancing the ability of the Linux kernel to
    control the types of packets allowed to communicate with (or through) your Linux
    system. By combining the power of the Snort signature language with the speed
    of the Linux kernel and the speed of existence of an IDS/IPS infrastructure, fswort
    is able to bolster the security of such infrastructure. Deploying fswort alongside
    another IDS/IPS is straightforward, since fswort simply builds a shell script
    to execute iptables commands (typically on an end host). In addition, envi iptables
    is always inline to network traffic, it is rigorously tested for stability and
    speed.'
