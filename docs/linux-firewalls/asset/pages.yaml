  md: '# Concluding Thoughts


    This chapter provides an introduction to operational aspects of psad as it detects
    and reports port scans that are levied against the iptablesfw system with Nmap.
    Email reports are the primary psad alerting mechanism, but syslog alerts are also
    provided by psad. In the next chapter we will explore more advanced psad topics,
    such as the detection of traffic that matches Snort rules via iptables log messages.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# ADVANCED PSAD TOPICS: FROM SIGNATURE MATCHING TO OS FINGERPRINTING


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_134_0.png)


    So far we''ve seen that psad analyzes iptables log messages in order to detect
    port scans. In this chapter we will extend the theme of attack detection much
    further; certain attacks that match the Snort signature set can be detected, and
    remote operating systems can be fingerprinted in some cases. We will also show
    how to extract verbose status information from psad, and we''ll introduce the
    DShield reporting capability.


    # Attack Detection with Snort Rules


    Because the iptables logging format is so complete, psad can detect traffic that
    matches Snort rules that lack application layer match criteria. For example, consider
    the following Snort rule, which looks for TCP packets with a source port of 10101,
    an acknowledgment value of zero, the SYN flag set, and a TTL value in the IP header
    greater than 220.'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'alert tcp $EXTERNAL_NET 10101 -> $HOME_NET (msg:"SCAN myscan"; flow:stateless;
    ack:0; flags:S; ttl:220; reference:arachnids,439; classype:attempted-recon; sid:613;
    rev:6);


    There are no tests in this Snort rule that examine application data, and there
    are about 150 rules in the Snort rules. Modified versions of all of these rules
    are imported by psad from the /etc/psad/signatures file. If you look at a random
    signature in the /etc/psad/signatures file, such as the BAD-TRAFFIC data in TCP
    SYN packet signature (below), you can see that psad has extended the Snort rules
    syntax with some additional keywords at ➀, ➁, and ➂:


    alert tcp $EXTERNAL_NET any -> $HOME_NET (msg:"BAD-TRAFFIC data in TCP SYN packet";
    _psad_size:20; flags:S; reference:url://www.cert.org/incident_notes/IN-09-07.html;
    classype:misc-activity; sid:207; _psad_id:100000; _psad_dl:;


    These keyword additions specific information to the signature that makes the signature
    compatible with psad. Here are the definitions of all psad keyword additions to
    Snort rules:


    psad_id This keyword defines a unique ID number that can be tracked and new signatures
    can be added to psad. The psad_id values are six digits long, they begin at 10000
    in order to distinguish them from Snort sid values. This method of defining custom
    ID values is similar to the Bleeding Snort project (http://www.bleedingsnort.com/)
    where signature ID values are seven digits and generally begin with the year your
    signature is created.


    psad_dl This keyword specifies the danger level that psad should assign to an
    IP address that triggers the signature. The psad_dl accepts a value between 1
    and 5.


    psad_size This keyword specifies match criteria for the size of a packet payload
    by subtracting the length from the value of the iptables LEN field. This is analogous
    to the Snort size keyword, but because the LEN field of iptables messages is the
    total length of the logged packet, including the IP header, psad must subtract
    the header length. The psad size keyword supports matches of the form nm, cn,
    and >n. For example, to test whether the payload size is greater than 1000 bytes,
    you could add psad_size:>1000 to a signature.


    psad_derived_sids This keyword allows psad to track original sid values from which
    a psad signature is derived. Some psad signatures are built up from several Snort
    rules, and this keyword tracks which ones.


    ¹The ability to test the application layer is, of course, very important when
    attempting to detect the majority of today''s attacks, and psad offers this capability
    when combined with fwsnort (snort uses the Netfilter string match extension).
    For more detail, see Chapter 11.'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'psad_ip_len keyword specifies match criteria for the LEN field of iptables
    log message (this is similar to the psad_size keyword, but does not subtract the
    length of the network and transport layer headers). Like the psad_size keyword,
    the psad_ip_len keyword also supports range matches of the form nm, cn, and sn.
    For example, to test whether the LEN is greater than 100 bytes but less than 200
    bytes, you could add psad_ip_len: 100:200 to a signature.


    Next, we highlight a selection of specific Snort rules to show how psad can detect
    the traffic represented by these rules. Taking automated response measures against
    IP addresses that trigger Snort rules is covered in Chapter 11.


    # Detecting the ipeye Scanner


    The ipeye scanner (http://ntsecurity.org/toolbox/ipeye) is a piece of software
    that allows the user to scan a remote host. In this sense, ipeye is similar to
    Nmap (although not as feature-rich), and it runs on Windows systems. Snort rule
    ID 622 detects when the ipeye scanner is being used over a network:


    ```

    alert tcp $EXTERNAL_NET any $HOME_NET (msg:"SCAN ipeye SYN scan"

    flags:S; seq:1958810375; reference:arachnids,236; classype:attempted-recon;

    sid:622; psad_id:100197; psad_dl:2);

    ```


    The above Snort rule does not require the use of any application layer tests;
    instead, it detects whether the SYN flag and a specific TCP sequence number 1958810375
    are set in the TCP header (these tests are shown above)


    To detect instances of the ipeye scanner with psad, the --log-tcp-sequence option
    must be enabled on the iptables command line to have iptables include sequence
    numbers in logs when a packet hits a LOG rule. Every iptables log message that
    contains the SYN flag and the sequence number 1958810375 (shown in bold below)
    will trigger the match in psad:


    ```

    Jul 11 20:28:21 iptablesfw: DROP IN=eth0 OUT= MAC=00:13:46:3a:41:4b

    00:0a:cc:28:54:08:00 SRC=192.168.10.3 DST=192.168.10.1 LEN=60 TOS=0x10

    PREC=0x00 TTL=64 ID=3970 PROTO=TCP SPT=45664 DPT=15324

    Seq=1958810375 ACK=0 WINDOW=5840 RES=0x00 SYN URG=0

    ```


    With psad, the following syslog message with the words match appears in /var/log/messages
    indicating that psad has detected the ipeye scanner:


    ```

    Jul 11 20:28:25 iptablesfw src: 192.168.10.3 signature match: "SCAN

    ipeye SYN scan" (sid: 622) tcp port: 15324

    ```'
