- img_proc: true
  md: 'Any open source implementation of port knocking or SPA is an analog to someone
    providing all of the details to the inner workings of a safe—everything, from
    the encryption algorithms to how each piece of software interfaces with the packet
    filter, is open for all to see. The only thing hidden as encrypted SPA packets
    or port-knocking sequences traverse the encryption keys themselves, and strong
    cryptosystems do not suffer from obscurity just because the encryption keys are
    not advertised to the world.


    Now, consider a security system that is weaker than port knocking or SPA. Suppose
    that a vulnerability is found within a particular function in the OpenSSH server
    daemon, and I create a hypothetical path to OpenSSH that requires all access this
    function from a remote SSH client to provide a bit of encrypted data. This data
    would be encrypted with a well-known and scrutinized cipher used by Rijndael or
    the Elgalam cipher by GnuPG.


    One could argue, and I do, in this hypothetical example, the possibility of a
    compromise leveraging this vulnerability is marginalized to the extent that the
    encryption algorithm is secure, and that, this does not rely on security through
    obscurity.


    Port knocking (at least in encrypted forms) and SPA offer even better security
    properties than this contrived example, because a malicious client cannot even
    establish a TCP session with the TCP stack across the SSH server, let alone talk
    to the SSH daemon, without providing a similarly encrypted bit of data. So, in
    both port knocking and SPA, we essentially have a mechanism for generalizing the
    contrived example that all functions in the OpenSSH daemon are inaccessible without
    first providing this bit of encrypted data. Therefore, neither port knocking nor
    SPA should be thought of as merely a security-through-obscurity technology.


    # Concluding Thoughts


    Some people write scripts to detect when an attacker is trying to brute force
    a password via SSH by watching for repeated Authentication failure for root messages
    reported in /var/log/auth.log (the specific file depends on the configuration
    of your syslog daemon). This will be of little use, if a new buffer vulnerability
    is discovered within OpenSSH (or another SSH implementation) in a function that
    is accessible without having to go through the username/password verification
    process. There are also Snort rules to perform cleartext IDS across an SSH connection
    in order to detect an attempt to exploit the CRC32 vulnerability reported in Buhtraq
    number 2347 (see Snort rule IDs 1324, 1326, and 1327). Armed with such an exploit,
    an attacker has no need to try to brute a password and doesn''t need to enter
    into the encryption/decryption contract that SSH normally requires. A better strategy
    is to let arbitrary IP addresses connect to your SSH daemon in the first place.
    This is where SPA is—in Chapter 13, I''ll show you how to deploy fwkn to gain
    maximum benefit from layering SPA with iptables on top of your SSH daemon. All
    zero-day exploits and brute force password-cracking attempts against SSH are useless
    without a setup.


    Chapter 12'
