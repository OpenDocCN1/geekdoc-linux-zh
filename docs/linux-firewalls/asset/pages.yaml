  md: 'MTU is too small to accommodate the packet. It is the responsibility of any
    router that connects two data link layers with different MTU sizes to ensure that
    IP packets transmitted from one data link to another never exceed the MTU. The
    IP stack of the destination reassembles the IP fragments in order to create the
    original packet, at which point an encapsulated protocol within is handed up the
    stack to the next layer.


    IP fragmentation can be used by an attacker as an IDS evasion mechanism by constructing
    an attack and deliberately splitting it into multiple fragments. Any fully implemented
    IP stack can to reassemble fragmented traffic, but in order to detect the attack,
    an IDS also has to reassemble the traffic with the same algorithm used by the
    targeted IP stack. Because IP stacks reassemble traffic slightly differently (e.g.,
    for duplicate fragments, Cisco IOS stacks reassemble traffic according to a last
    fragment policy), whereas Windows XP stacks reassemble according to a first fragment
    policy), this creates a challenge for an IDS. The gold standard for generating
    fragmented traffic is Dug Song''s fragile tool (see http://www.monkey.org).


    # Low TTL Values


    Any router is to decrement the TTL value in the header every time an IP packet
    is forwarded to another system. If packets appear within your local subnet with
    a TTL value of one, then someone is most likely using the traceroute program (or
    a variant such traceroute) against an IP address that either exists in the local
    subnet or is in a subnet that is routed through your local. This is simply troubleshooting
    a network connectivity problem, but it can also be an instance of someone performing
    reconnaissance against your network in order to map out hosts to a potential target.


    Packets destined for multicast addresses (all addresses within the range 224.0.0.0
    through 239.255.255.255, as defined by RFC 1112) commonly have TTL values set
    to one. If the destination address is a multicast address, it is likely that traffic
    is not associated with network mapping efforts with traceroute and is just legitimate
    traffic.


    A UDP packet produced by traceroute is logged by iptables (note the TTL in bold):


    ```

    Jul 24 01:10:55 iptables kernel: DROP IN=eth0 OUT=

    MAC=00:13:d3:38:b6:e4:00:13:46:c2:60:44:08:00 SRC=144.202.X.X DST=157.X.X

    LEN=40 TOS=0x00 PREQ=0 ID=44081 PROTO=UDP SPT=54522 DST=33438 LEN=20

    ```


    > Taking a hot-centric view of intrusion detection is known as target-intrusion
    detection, which allows an IDS to focus in implementation details of target systems;
    more in this Chapter 8.


    > It is possible for a router to decrement the TTL value by two or more if the
    number of seconds that a router holds before the packet forwarding is greater
    than one second. RFC 791 states that a router must decrement the TTL by at least
    one.'
