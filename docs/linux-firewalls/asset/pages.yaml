    # Outbound Connections from Compromised Systems


    Honeynets are put on the open Internet with the hope that they will be compromised.
    Analyzing successful attacks and the steps that lead to real compromises is the
    best way to learn how to protect your systems and gain valuable intelligence on
    potentially new exploits. In addition to the port scans, port sweeps, and worm
    activity we have already discussed, we can also use iptables data to determine
    whether any honeynet systems make outbound connections to external IP addresses.'
