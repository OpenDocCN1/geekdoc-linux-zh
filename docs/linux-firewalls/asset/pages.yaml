  md: 'It''s a good idea to run Nmap against the firewall to rigorously test the iptables
    policy. Nmap offers many different scanning types that assist in making sure that
    the connection-tracking and filtering capabilities offered by iptables are doing
    their jobs. For example, sending a surprise FIN packet (with Nmap''s -sF scanning
    mode) against a closed port should not elicit a RST/ACK packet if iptables is
    working. Generating ACK packets that are not part of any established session (Nmap''s
    -sa mode) should similarly be met with utter silence, because the connection-tracking
    subsystem is able to discern which packets are not part of any legitimate TCP
    session.


    # Testing the Policy: UDP


    Next, we''ll test iptables'' ability to filter UDP ports. Servers that run over
    UDP sockets exist in a different world than those that run TCP sockets. UDP is
    a connectionless protocol, and there is no analogue to a TCP handshake or even
    a scheme to acknowledge data in UDP traffic. Simple constructs such as reliable
    data delivery can be built in applications that run over UDP, but this requires
    application-level modifications, whereas TCP has these features built in for.
    UDP simply throws packets out on the network and they reach the intended destination.


    We want to show that iptables is working properly for UDP, we send packets to
    UDP port 5500 again from both internal and external systems, as we did for TCP.
    However, if our UDP packet is not filtered, we should receive an ICMP Port unreachable
    message back to our client. This time, we use the hping utility (http://www.hping.org).
    In both cases of the external and internal hosts trying to talk to the UDP stack
    running on the firewall, iptables intercepts the packets. We first test from the
    external host:


    Similarly, we have the same result for the internal network:


    ```

    [scanner_]# hping -p 5500 172.15.X.X

    HHPING 172.15.X.X (eth0 172.15.X.X): udp mode, set, 28 headers + 0 data bytes

    [iptablesfw]# tail /var/log/messages | grep 5500

    Apr 14 17:00:24 iptables kernel: DROP IN=eth1 OUT=

