    \n# OS Fingerprinting\n\nThere are several techniques for remotely fingerprinting\
    \ operating systems\nvia network traffic. They can be divided broadly into two\
    \ categories: active\nand passive.\n\nThe term operating system fingerprinting\
    \ is a bit of a misnomer, as the term\nreally to network stack fingerprinting.\
    \ Because network stacks vary from\nOS to OS, the corresponding operating systems\
    \ can be inferred by fingerprinting the\nnetwork stack.\n\n# Active OS Fingerprinting\
    \ with Nmap\n\nWith its user-contributed database of over 1,600 OS fingerprints,\
    \ Nmap's -0\noption is the best-known active OS fingerprinting implementation.\n\
    Nmap primarily utilizes the vagaries of TCP to guess the identity of remote\n\
    operating systems, especially these:\n\n+   - The way target stack constructs\
    \ the options portion of the TCP header\nin response to SYN packets sent by Nmap.\n\
    \n+   - The nature of ICMP Port Unreachable messages elicited from a targeted\n\
    system sending a UDP packet to a closed port. While operating sys-\n are supposed\
    \ to return a portion of the original UDP packet sent\nto closed UDP port within\
    \ an ICMP Port Unreachable message, many\nst out do not perform this flawlessly;\
    \ things as checksums,\nIP values, and the IP total length field can be garbled.\
    \ The extent\\and manner in which these values become garbled is as a measure\n\
    to assist in fingerprinting the remote stack.\n\nXprobe is another interesting\
    \ active OS fingerprint (http://www.sys-security.com)\nthat makes use of ICMP\
    \ to assist in fingerprinting. In some cases Xprobe sends\nfewer packets than\
    \ Nmap to fingerprint an OS; Nmap can sometimes generate\nas many as 1,400 packets\
    \ in the course of generating a fingerprint for a single remote host.\nInformation\
    \ on active fingerprinting techniques can be found in the papers\n\"Remote OS\
    \ Detection with TCP/IP Stack Fingerprinting\" (http://www.insecure.org)\nand\
    \ \"The Present and Future of Xprobe2—The Next Generation of Active Operating\n\
    System Fingerprinting\" (http://www.sys-security.com)."
