    ```


    # Scan and Signature Match Messages


    The most important class of syslog messages informs you about scans and

    other suspicious traffic. These messages contain everything from source IP

    adresses to ports, protocols, and Snort rule matches, and the following syslog

    displays a set of psad scan alerts. Note the inclusion of TCP flag

    information so you can identify the type that is detected by:


    ```

    Jul 13 14:51:48 iptablesfw psad: scan detected: 144.202.X.X -> 71.157.X.X tcp:

    [15018-15095] flags: FIN tcp pkts: 10 DL

