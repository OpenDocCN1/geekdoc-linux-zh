  md: 'NOTE Except where otherwise noted, this chapter is written from the perspective
    of the 2.6-series kernel because it represents the latest and greatest progeny
    of the Linux kernel developers. In general, the same strategies also apply to
    the 2.4-series.


    ```

    $ /usr/src

    $ wget http://www.kernel.org/pub/linux/kernel/v2.6/linux-2.6.20.1.tar.bz2

    $ tar xjf linux-2.6.20.1.tar.bz2

    $ ls -ld linux-2.6.20

    dwxr-xr-x 18 mr users 600 Jun 16 20:48 linux-2.6.20

    ```


    Although I have chosen specific kernel versions in the commands above, the analogous
    commands apply for new kernel versions. For example, say, the 2.6.20.2 is released,
    you only need to substitute 2.6.20.1 with the above commands.


    NOTE One to keep in mind is that the load on the kernel.org webserver is steadily
    increasing over the years, and a random glance at the bandwidth graphs at http://www.kernel.org
    shows the current utilization at over 300 Mbps. To help reduce the load, the kernel
    can be downloaded from one of the mirrors listed at: http://www.kernel.org/mirrors.
    Once you have a particular version of the kernel sources on your system, you can
    download and apply a kernel patch file to upgrade to the next version. (The patch
    files are much smaller than the kernel itself.)


    # # Kernel Configuration


    Before you begin compiling, you must construct a kernel configuration file. Fortunately,
    the process of building this file has been automated by kernel developers, and
    it can be initiated with a single command (within the /usr/src/linux-2.6.20.1
    directory):


    ```

    $ make menuconfig

    ```


    The make menuconfig command launches the Ncurses interface in which you can select
    various compile options. (You can call the Windows or terminal interface with
    the commands xconfig and make config, respectively.) I''ve chosen the Ncurses
    interface because it provides a nice balance between the spanish terminal interface
    and the relatively expensive Windows interface. The Ncurses interface easily lends
    itself to the configuration of a remote Linux kernel across an SSH session without
    having to forward an X Windows connection.


    After executing make menuconfig, we are presented with several configuration sections
    ranging from Code Maturity Level to Library Runtimes. Most Netfilter compilation
    options for the 2.6-series kernel are located within a section called Network
    Packet Filtering Framework (Netfilter) under Networking Networking Options.'
  merge: -1
