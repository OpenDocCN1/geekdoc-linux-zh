  md: '# Unsupported Snort Options


    So far we have made the case that iptables is well suited to emulate a decent
    percentage of the Snort language entirely within the kernel. However, there are
    many options in Snort for there is no good iptables equivalent, and we will conclude
    this chapter with a discussion of these options.


    Some options discussed below, such as, fragbits, and some_test and byte_jump functionality,
    can be emulated with the iptables u32 extension (mentioned earlier in this chapter).
    In addition, options that have previously been discussed, such as id, seq, icmp_id,
    and icmp_seq can also be emulated with the u32 extension; they allow full matching
    and filtering support instead of iptables being able to log these header fields.
    Once the u32 extension is ported to the 2.6 kernel, it will be supported in an
    upcoming release of vsnort.


    Unsupported options include the following:


    +   - **asn** The asn keyword allows Snort to link signatures to decoded Abstract
    Syntax Notation (ASN.1) (commonly used in SMB protocols). There is no good way
    to emulate the complex processing associated with this Snort keyword in iptables.

    - **byte_jump** The byte_jump option allows packet data to determine how many
    bytes of data will skip over before applying the next pattern match or byte_test.
    This means that offsets do not have to be known priori, and therefore the protocol
    can dictate where the subsequent test is performed. This is especially useful
    for protocols that use fields that vary in length (such as DNS). Just for the
    byte_test key word, using the u32 match is the best way to emulate the byte_jump
    test with iptables, but we''ll have to wait until the u32 match is available in
    the 2.6 kernel.

    - **byte_test** This option gives Snort the ability to apply numeric tests to
    particular offsets in packet data. While the pcre option can be used to emulate
    some of the functionality provided by byte_test (for example, the regular expression
    "..\d4" will match any four-digit number greater than 9999 at the twenty-first
    byte), this should normally be avoided, because byte_test will generally outperform
    pcre for operations. The u32 match can also be used to emulate this to some degree,
    but it is not yet available for the 2.6 kernel.

    - **flowbits** This option is used by Snort to communicate state information between
    rules. For example, an initial Snort rule might detect whether the login stage
    of a cleartext protocol has completed, and set a tag loggedIn via the flowbits
    option. Then a completely different Snort rule could also use the flowbits option
    to test whether the loggedIn tag has been set before performing an additional
    signature test on the packet data. This type of operation can be emulated to a
    limited extent by combining the CONNMARK with string matching in iptables, but
    this is not yet supported by vsnort. The L7-filter packet classifier project could
    also be used to emulate this to some degree (see http://l7-filter.sourceforge.net).'
