  md: '# Chapter Summaries


    As you make your way through Linux Firewalls, you''ll cover a lot of ground. This
    section gives you a brief overview of each chapter so you''ll know what to expect.


    # Chapter 1: Care and Feeding of iptables


    This chapter provides an introduction to packet filtering with iptables, including
    kernel build specifics and iptables administration. A default policy and network
    diagram is provided in this chapter and is referenced throughout the book. The
    Linux machine that runs the default policy, the firewall for a local area network
    (LAN), and attacks against this system are illustrated in later chapters.


    # Chapter 2: Network Layer Attacks and Defense


    This chapter shows the types of attacks that exist in the network layer and what
    you can do about them. I will introduce you to the iptables logging format and
    emphasize the network layer information that you can glean from iptables logs.


    # Chapter 3: Transport Layer Attacks and Defense


    The transport layer is the realm of sever reconnaissance with port scans and sweeps,
    and this chapter examines the inner workings of these methods. The iptables logging
    format is well suited to representing transport layer header information, and
    this is useful for detecting sorts of mischief.


    # Chapter 4: Application Layer Attacks and Defense


    The majority of today''s attacks take advantage of the increasing complexity of
    applications that ride on top of the TCP/IP suite. This chapter illustrates classes
    of application layer iptables that can be made to detect, and introduces you to
    the iptables string match extension.


    # Chapter 5: Introducing psad: The Port Scan Attack Detector


    This chapter discusses installation and configuration of psad, and shows why it
    is important to listen to the stories that iptables logs have to tell.


    # Chapter 6: psad Operations: Detecting Suspicious Traffic


    There are many features offered by psad, and these features are designed to maximize
    your use of iptables log messages. From port scans to probes for backdoors, psad
    detects and reports suspicious activity with verbose email and syslog alerts.


    # Chapter 7: Advanced psad Topics: From Signature Matching to OS Fingerprinting


    This chapter introduces you to advanced psad functionality, including integrated
    passive OS fingerprinting, Snort signature detection via packet headers, and DShield
    reporting. This chapter is all about showing far iptables log information can
    go toward providing security data.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# ## Chapter 8: Active Response psad


    No treatment of intrusion detection would be complete without a discussion of
    options for automatically responding to attacks. The response capabilities offered
    by psad are built on top of a clean interface that makes it easy to integrate
    with third-party software, and an example of integrating with the Swatch project
    is included.


    # ## Chapter 9: Translating Snort Rules into iptables


    The Snort IDS has shown the community the way to detect networkbased attacks,
    and it is so logical to leverage the Snort signature language in iptables. Because
    iptables offers a rich logging format and the ability to inspect application layer
    data, a significant percentage of Snort signatures can be translated into iptables.


    # ## Chapter 10: Deploying fswnort


    The tedious task of translating Snort signatures into iptables rules has been
    automated by the fswnort project, and this chapter shows how it is done. Deploying
    fswnort endows your iptables policies with true intrusion detection.


    # ## Chapter 11: Combining psad and fswnort


    Log messages that are generated by fswnort are picked up and analyzed by psad
    for better reporting via email (integrated whose and reverse DNS lookups as well
    as OS fingerprinting are illustrated). This chapter represents the culmination
    of the attack detection and mitigation strategies that are possible with iptables.


    # ## Chapter 12: Port Knocking vs. Single Packet Authorization


    Passive authorization is becoming increasingly important for keeping networked
    services secure. The damage scope of zero-day vulnerabilities can be severely
    limited by using such technology, but not all passive authorization paradigms
    are robust for critical deployments. This chapter compares and contrasts two passive
    authorization mechanisms: port knocking and Single Packet Authorization (SPA).


    # ## Chapter 13: Introducing fknop


    There are only few SPA implementations available today, and fknop is one of the
    most actively developed and supported. This chapter shows how to install and make
    use of fknop together with iptables to maintain a default-drop stance against
    all unauthenticated and unauthorized attempts to connect to your SSH daemon.


    # ## Chapter 14: Visualizing iptables Logs


    The last chapter in the book wraps up with graphical representations of iptables
    log data. A picture can quickly illustrate trends in network communications that
    may indicate a system compromise, and by combining psad with the AfterGlow project
    you can see what iptables has to show you.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Appendix A: Attack Spoofing


    It''s exceedingly easy to parse the Snort signature ruleset, craft matching packet
    data, and blast it on the wire from spoofed source addresses. Appendix A discusses
    a sample Perl script (bundled with fwsnort) that does just this.


    # Appendix B: A Complete fwsnort Script


    The fwsnort project creates a shell script that automates the execution of the
    iptables commands necessary to create an iptables policy that is capable of detecting
    application layer attacks. Appendix B contains a complete example of an fwsnort.sh
    script generated by fwsnort.


    This book takes a highly applied approach. Concepts are better understood with
    real examples, and getting down into the guts of the source code or carefully
    examining packet traces are always excellent ways to understand what a computer
    is doing. It is my hope after reading this book you will be armed with a strong
    working knowledge of how network attacks are detected and dealt with via iptables.
    Once again, I strongly encourage you to ask questions, and you can always reach
    me at mbr@cipherdyne.org.'
