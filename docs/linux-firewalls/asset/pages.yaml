    # ## Detecting and Reacting to a DNS Cache-Poisoning Attack


    In February 2005, it was discovered that the default configuration of Windows
    4 and 2000 DNS servers and some Samsung Gateway products left them open to a DNS
    cache-poisoning attack. This vulnerability was exposed on the Internet by an attack
    in which a set of rogue DNS servers was used to exploit false DNS records to vulnerable
    downstream DNS servers so that legitimate user requests for some domains could
    be directed to IP addresses of the attacker''s choosing.


    To make an arbitrary DNS server "downstream" from one of the rogue DNS servers,
    the attacker needed to get the target server to issue a DNS request to the rogue
    server. This could be accomplished in a variety of ways, such as sending an email
    to a bogus user, eliciting a non-delivery report (NDR) to the source domain—this
    requires a mail server to be running on the targeted network, or by issuing a
    request to the malicious server from a previously installed piece of spyware.


    In the bleeding-all.rules file provided by http://www.bleedings.com, Snort ID
    2001842 detects when a system that is part of the internal network issues a DNS
    request for one of the many domains that take part in the DNS cache-poisoning
    attack, 7sir7.com. We can fsnort alert us to this by translating into an iptables
    policy and executing the result-fsnort.script


    ```

    ```iptablesfw# fsnort --snort-sids 2001842

    [+] Parsing Snort rules files...

    [+] Found: 2001842 in bleeding-all.rules

    Successful translation.

    [iptablesfw# /etc/fsnort/fsnort.sh

    [+] Adding bleeding-all rules.

    Rules added: 2

    ```

    ```


    > > See http://isc.sans.org/presentations/dnspoisoning.php for a comprehensive
    write-up of the DNS cache-poisoning attack and the strategy used by the attackers.'
