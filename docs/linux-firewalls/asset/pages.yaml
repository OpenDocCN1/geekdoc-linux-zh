  md: '# EMAIL_ADDRESSES


    The EMAIL_ADDRESSES variable defines the email address(es) to which psad sends
    alerts, informational messages, and other notices. Multiple email addresses are
    supported as a comma-separated list:


    | EMAIL_ADDRESSES | root@localhost, you@domain.com; |

    |---|---|


    # DANGER_LEVEL{n}


    All malicious activity is associated with a danger level by psad so that alerts
    can be prioritized. Danger levels range from one to five (with five being the
    worst) and are assigned to each IP address from which an attack or scan is detected.
    The danger level values are assigned based on three factors: characteristics of
    a scan (number of packets, port range, time interval), whether a specific packet
    is associated with a signature defined in the /etc/psad/signatures file, and whether
    the packet originates from an IP or network listed in the /etc/psad/auto_dl file.


    For port scans and corresponding packet counts, the DANGER_LEVEL{n} variables
    in the psad.conf file specify the number of packets required to reach each successive
    danger level:


    | DANGER_LEVEL1 | 5; |

    | DANGER_LEVEL2 | 15; |

    | DANGER_LEVEL3 | 150; |

    | DANGER_LEVEL4 | 1500; |

    | DANGER_LEVEL5 | 10000; |


    # HOME_NET


    Because psad uses Snort rules to detect suspicious network traffic (as we''ll
    see in Chapter 7), the variables psad uses in psad.conf file are similar to the
    ones Snort uses. The HOME_NET variable defines the local network where the system
    running psad is deployed. There is one difference, between how psad treats the
    HOME_NET variable and how it handles—psad treats any packet logged in the INPUT
    chain as the home network, regardless of its source address, such a packet is
    directed at the iptables firewall itself. You can override this behavior by setting
    the ENABLE_INT_LOCAL_NET variable to N. In this case, you can define a list of
    home networks like so:


    | HOME_NET | 71.157.X.X/24, 192.168.10.0/24; |

    |---|---|


    # EXTERNAL_NET


    The EXTERNAL_NET variable defines the set of external networks. The default is
    any, but it can be set to an arbitrary list of networks, similar to the HOME_NET
    variable. For most setups, the default is probably best:


    | EXTERNAL_NET | any; |

    |---|---|'
