    # # Default iptables Policy


    We have a functioning Linux system with iptables installed. The remainder of this
    chapter will concentrate on various administrative and run-time aspects of iptables
    firewalls.


    We''ll begin by constructing a Bourne shell script (iptables.sh) to implement
    an iptables filtering policy tailored for a modest network with a permanent Internet
    connection. This policy will be used throughout the rest of the book and serves
    as a common ground—we will refer to this policy in several subsequent chapters.
    You can also download the iptables.sh script from http://www.cipherdyne.org/LinuxFirewalls.
    But first, here is background information on iptables.


    # ## Policy Requirements


    Let''s define the requirements for an effective firewall configuration for a network
    consisting of several client machines and two servers. The servers (a webserver
    and a DNS server) must be accessible from the external network. Systems on the
    internal network should be allowed to initiate the following types of traffic
    through the firewall to external servers:


    +   * Domain Name System (DNS) queries

    * File Transfer Protocol (FTP) transfers

    * Network Time Protocol (NTP) queries

    * Secure SHell (SSH) sessions

    * Simple Mail Transfer Protocol (SMTP) sessions

    * Web sessions over HTTP/HTTPS

    * whois queries


    Except for access to the services listed above, all other traffic should be blocked.
    Sessions initiated from the internal network or directly from the firewall should
    be statefully tracked by iptables (with packets that do not conform to a valid
    state logged and dropped as early as possible), and NAT services should also be
    provided.


    In addition, the firewall should implement controls against spoofed packets from
    the internal network being forwarded to any external IP address:


    +   * The firewall itself must be accessible via SSH from the internal network,
    but from nowhere else it is running fwknop for authentication'
