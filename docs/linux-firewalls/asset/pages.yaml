  md: 'and later). The following example constructs iptables rule that drops all TCP
    packets destined for port 80 that contain the string "/etc/passwd" in the packet
    payload anywhere after the hundredth byte:?


    ```

    iptablesfw]# iptables -A INPUT -p tcp --dport 80 -m string "/etc/

    passwd" --from 100 --algo bm -j DROP

    ```


    # depth


    The Snort option requires that all attempts to match content within packet payload
    data not exceed a specified number of bytes beyond the beginning of the payload.
    Like the offset option above, using the depth criteria within Snort rule applies
    globally to all content matches. To search for patterns that cannot be more than
    a given number of bytes apart, one would use the within Snort rule. For kernel
    versions 2.6.4 and later, the --to command-line argument to the string match extension
    is used to emulate the depth option within iptables.


    The following example demonstrates the usage of the --command-\line argument to
    have iptables drop all TCP packets destined for port 80 that contain the string
    "/etc/passwd" in the packet payload anywhere before the thousandth byte:


    ```

    iptablesfw]# iptables -A INPUT -p tcp --dport 80 -m string "/etc/

    passwd" --to 1000 --algo bm -j DROP

    ```


    # distance


    The distance option is used by Snort to specify the number of bytes to skip between
    pattern matches. There is no direct way to tell the string match extension how
    many bytes to skip from a previous pattern match, but fsnort uses an approximation
    based on the length of the previous pattern and any offset modifier. To disable
    the translation of Snort rules that contain the distance keyword, you can use
    the --strict option on the fsnort com-mand line.


    # within


    The within option instructs Snort to require that a subsequent pattern match after
    an initial match take place within a specified number of bytes. This is similar
    to the distance option and is supported in fsnort by making an approximation based
    on the length of the previous pattern (--strict on the fsnort command line disables
    this behavior).


    # flags


    The flags Snort option applies a search criteria to the control bits in the TCP
    header. The control bits vary depending on the state of a TCP connection, and
    iptables can match specific combinations via the --tcp-flags argument.


    > Technically, the iptables --from and --to arguments to the string match apply
    at the beginning of the data link layer MAC fields on Ethernet networks.'
