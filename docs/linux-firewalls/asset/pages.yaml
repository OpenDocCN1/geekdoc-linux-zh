    perspective, we can try our scan again. This time, not even port 80 can be reached:


    ```

    [ext_scanner]# nmap -sS -PO -n 71.157.X.X

    ```


    Starting Nmap 4.01 ( http://www.insecure.org/nmap/ ) at 2007-03-05 15:47 EST All
    1672 scanned ports on 71.157.X.X are filtered


    Nmap finished: 1 IP address (1 host up) scanned in 35.906 seconds


    # UDP Scan Response


    After waiting over an hour, we see syslog that psad has removed the blocking rules
    against the 144.202.X.X address:


    > Mar 5 16:33:56 iptablesfw: removed iptables auto-block 144.202.X.X


    Now we will attempt a UDP scan against the iptables target. Because psad tracks
    the attacker''s source address (144.202.X.X) has already achieved a level of 3,
    it will renew the blocking rules as soon as the first UDP packet is logged. If
    the attacker just nicely with the firewall and doesn''t initiate any traffic that
    would cause iptables to generate a log message, the attacker will regain connectivity
    to the web-DNS servers for a period of hour. In the Nmap output below, the ports
    are marked as open|filtered. This is because Nmap cannot assume the remote UDP
    sockets necessarily respond with any data, and since iptables is preventing any
    ICMP port unreachable messages from being generated (the UDP stack never even
    sees the packets they have intercepted them by iptables at a lower level within
    the kernel), it can''t deduce that the ports are closed.


    ```

    [ext_scanner]# nmap -sU -PO -n 71.157.X.X

    ```


    Starting Nmap 4.01 ( http://www.insecure.org/nmap/ ) at 2007-03-05 18:55 EST All
    1482 scanned ports on 71.157.X.X are: open|filtered


    Nmap finished: 1 IP address (1 host up) scanned in 32.023 seconds'
