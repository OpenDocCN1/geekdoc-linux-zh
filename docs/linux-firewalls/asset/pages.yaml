    # ## Nachi Worm


    The Nachi worm attacks Microsoft Windows 2000 and XP systems that are not patched
    against the MS03-026 vulnerability (string refers to the Microsoft vulnerability
    tracking number). A key feature of this worm is that before it attempts to compromise
    a system, it first pings the target with a 92-ICMP Echo Request packet. This initial
    ICMP packet with the specific length of 92 bytes makes the Nachi worm easy to
    detect. To graph Nachi worm traffic from the Scan34 iptables data set, you can
    use the psad ip:len:92 criterion for the --CSV-fields argument restrict the inspection
    to ICMP packets that do not originate from the 11.11.0.0/16 subnet


    ```

    # psad -m iptables.data --CSV-fields --gnuplot "timestamp ip_len:92,counter"

    # --gnuplot-graph lines --gnuplot-xrange 1140687844:1143867180 --CSV-regex

    # "PROTO=ICMP" --CSV-neg-regex "SRC=11.11" --gnuplot-file-prefix fig14-11

    $ $ gnuplot fig14-11.png

    ```


    Sure enough, there is a spike of Nachi worm activity on March 19, easily discernible
    in the Gnuplot graph shown in Figure 14-11.'
