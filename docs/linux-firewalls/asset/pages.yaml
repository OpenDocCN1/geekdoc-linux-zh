- img_proc: true
  md: '(covered in Chapter 13); SSH should be the only server process running on the
    firewall.


    +   - The firewall should accept ICMP Echo Requests from both the internal and
    external networks, but unsolicited ICMP packets that are not Echo Requests should
    be dropped from any IP address.


    +   - Lastly, the firewall should be configured with a default log and drop stance
    so that any stray packets, port scans, or other connection attempts that are not
    explicitly allowed will be logged and dropped.


    NOTE We will assume the external IP address on the firewall is statically assigned
    by the ISP, but a dynamically assigned IP address would also work because we restrict
    packets on the external network by interface name on the firewall instead of by
    IP address.


    To simplify the task of building the iptables policy, assume there is a single
    network with a non-routable network of 192.168.10.0 and a Class C subnet mask
    255.255.255.0 (or /24 in CIDR notation).


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_42_0.png)


