    # Activating the fwsnort Chains with Jump Rules


    The final section in fswsnort.sh makes the rules active within the

    kernel by directing iptables to send traffic through these rules. All of the

    iptables commands executed by fswsnort up until this simply load

    fwsnort policy to the running kernel.


    Because there are not yet jump rules to send packets from the built-in

    iptables chains in the fwsnort chains, we have utilized only kernel memory

    so far; none of the rules can interact with packets as they flow within the

    kernel. With the final commands, which first delete any

    existing fwsnort jump rule and then make the very first rule in each of the

    INPUT, OUTPUT, and FORWARD chains jump all packets to the respective fws

    chain. The jumps are the only rules allowed by fwsnort to any of the

    bbuilt-in chains.


    ```

    $IPTABLES -D FORWARD -i 1 -j FWSNORT_FORWARD 2 >/dev/null

    $IPTABLES -I FORWARD 1 -i 1 -j FWSNORT_FORWARD

    $IPTABLES -D INPUT -i 1 -j FWSNORT_INPUT 2 >/dev/null

    $IPTABLES -I INPUT 1 -i 1 -j FWSNORT_INPUT

    $IPTABLES -D OUTPUT -o 1 -j FWSNORT_OUTPUT 2 >/dev/null

    $IPTABLES -I OUTPUT 1 -o 1 -j FWSNORT_OUTPUT

    ```


    See Appendix B for an example fwsnort.sh script that translates the web-attacks
    Snort

    rules into an equivalent iptables policy.


    # Command-Line Options for fwsnort


    There are many command-line options for fwsnort that you can use to

    influence its execution, and we''ll cover some of the most commonly used

    shere. (You''ll find an exhaustive treatment of all command-line argu-\ments in
    fwsnort(8) main page.)


    --ipt-drop option instructs fwsnort to drop packets before they

    are forwarded to their intended target, in addition to logging them.

    (By default, fwsnort only logs malicious packets). This grants fwsnort

    the authority to respond to network attacks.


    > 5 This is possible to execute the fwsnort.sh script multiple times and maintain
    a clean

    interface with an existing iptables policy since only one fwsnort jump rule can
    exist for each

    built-in chain. Versions of fwsnort prior to 1 had a bug where additional jump
    rules were

    added if the fwsnort.sh script was executed multiple times.'
