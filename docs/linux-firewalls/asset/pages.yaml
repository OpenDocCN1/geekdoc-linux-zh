    # # SYN Floods


    A SYN flood creates massive numbers of TCP SYN packets from spoofed source addresses
    and directs them toward a particular TCP server. The goal is to overwhelm the
    server by foring the targeted TCP stack to commit all of its resources to sending
    out SYN/ACK packets and wait for ack that never come. A SYN flood is purely a
    Denial of Service attack. Protection from SYN floods is offered by iptables with
    the limit:


    ```

    [iptablesfw]# iptables -I FORWARD 1 -p tcp --syn -m --limit 1/s -j ACCEPT

    ```


    # # Transport Layer Responses


    Under certain conditions, the transport layer can issue responses to traffic.
    Firewalls or other filtering devices can implement filtering operations based
    on transport layer headers (see the iptables.sh script presented in Chapter 1),
    manufacture TCP RST or RST/ACK packets to tear down connections, or throttle rates
    of incoming packets (such as the number of TCP SYN packets in a given period of
    time).


    > We will see more active response measures in Chapters 10 and 11, where we will
    show how iptables is used to respond at both the network and transport layers
    upon detecting application layer attacks.


    However, the application layer is where most of the interest is these days in
    terms of breaking into systems. The transport layer communications involved in
    delivering an application layer are benign by themselves (an attacker wants the
    transport layer to work, after all). Responding to transport layer activities
    such as port scans and port sweeps is risky because of the ease with which port
    scans and port sweeps are sent from spoofed source IP addresses.


    # # TCP Responses


    In the context of TCP, the transport layer has a built-in response mechanism for
    terminating a connection. This ability is implemented in the form of a TCP RST
    (Reset) or RST/ACK (Reset/Acknowledgment) packet. This packet'
