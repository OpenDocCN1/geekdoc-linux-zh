    # Tying fwsnort Detection to psad Operations


    As discussed in Chapter 10, when it detects an attack, fwsnort generates an iptables
    log message. This message contains a log prefix that informs the user about the
    specific Snort rule ID that triggered the log message, the rule number within
    the fwsnort chain, and whether the corresponding packet is part of an established
    TCP session.


    Let''s look at how fwsnort and psad would deal with an attack against the MediaWiki
    software.


    # WEB-PHP Setup.php access Attack


