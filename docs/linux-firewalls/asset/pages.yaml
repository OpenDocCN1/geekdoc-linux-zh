  md: 'NOTE This brings up an interesting observation about security: In these tests,
    any privileged user could have used Netcat to listen on TCP or UDP port 5500,
    but we would have been completely unable to access the server from any IP address
    is not explicitly allowed through the iptables policy. This means that any server
    started on the system cannot adversely affect the overall security of the system
    (at least from remote attacks) without modifying the iptables policy. This is
    a powerful concept that helps to make the case that a firewall should be deployed
    on every system; the additional work that is created by having to manage the firewall
    policy is well worth the effort in the face of risking potential compromise.


    # Testing the Policy: ICMP


    Finally, we''ll test the iptables policy over ICMP. The iptables commands used
    in the construction of the policy used the --icmp-type to restrict accept ICMP
    packets to just Echo Request packets (the connection-tracking code allows the
    responding Echo Reply packets to be so explicit an ACCEPT rule does not have to
    be added to such replies). Therefore, iptables should be allowing all Echo Request
    packets, but other ICMP packets should be met with stark silence. We test this
    by generating ICMP Echo Reply packets without sending any corresponding ICMP Echo
    Request packets, which should cause iptables to match the packets on the INVALID
    state at the beginning of the INPUT chain. Again, we turn to ping from both the
    internal and external networks. The first test is to generate an unsolicited ICMP
    Echo Reply packet from the external network, and we expect that iptables will
    drop the packet in the INPUT chain. By checking iptables, we see that this is
    indeed the case (the DROP INVALID policy is in bold):


