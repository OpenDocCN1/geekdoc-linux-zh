  md: 'Finally is the default LOG rule. Recall from the script preamble packets that
    are not accepted by some rule within the INPUT chain will be dropped by the DROP
    policy assigned to this chain; this also applies to the OUTPUT and FORWARD chains.
    As you can see, the configuration of the INPUT chain is exceedingly easy, since
    we only need to accept incoming connection requests to the SSH daemon from the
    internal network, enable state tracking for locally generated network traffic,
    and finally log drop unwanted packets (including spoofed packets from the internal
    network). Similar configurations apply to OUTPUT and FORWARD chains, as you''ll
    see.


    # The Output Chain


    The Output chain allows iptables to apply kernel-level controls to network packets
    generated by the local system. For example, if an SSH session is initiated to
    an external system by a local user, the OUTPUT chain could be used to permit or
    deny the output SYN packet.


    The commands in the iptables.sh script that build the OUTPUT chain rules appear
    below:


    ```

    ###### OUTPUT chain ######

    echo "[+\] setting up OUTPUT chain..."

    ### state tracking rules

    $IPTABLES -A OUTPUT -m state INVALID -j LOG --log-prefix "DROP \\INVALID" --log-ip-options
    --log-tcp-options

    $IPTABLES -A OUTPUT -m state INVALID -j DROP

    $IPTABLES -A OUTPUT -m state ESTABLISHED,RELATED -j ACCEPT

    ```


    ```

    ### ACCEPT rules for allowing connections out

    $IPTABLES -A OUTPUT -p tcp --dport 21 --syn -m state NEW -j ACCEPT

    $IPTABLES -A OUTPUT -p tcp --dport 22 --syn -m state NEW -j ACCEPT

    $IPTABLES -A OUTPUT -p tcp --dport 25 --syn -m state NEW -j ACCEPT

    $IPTABLES -A OUTPUT -p tcp --dport 43 --syn -m state NEW -j ACCEPT

    $IPTABLES -A OUTPUT -p tcp --dport 80 --syn -m state NEW -j ACCEPT

    $IPTABLES -A OUTPUT -p tcp --dport 443 --syn -m state NEW -j ACCEPT

    $IPTABLES -A OUTPUT -p tcp --dport 4321 --syn -m state NEW -j ACCEPT

    $IPTABLES -A OUTPUT -p udp --dport 53 -m state NEW -j ACCEPT

    $IPTABLES -A OUTPUT -p udp --dport 53 -m state NEW -j ACCEPT

    $IPTABLES -A OUTPUT -p icmp --icmp-type echo-request -j ACCEPT

    ```


    ```

    ### default OUTPUT LOG rule

    $IPTABLES -A OUTPUT -o lo -j LOG --log-prefix "DROP " --log-ip-options

    --log-tcp-options

    ```


    In accordance with our policy requirements, at connections initiated from the
    firewall will be to download patches or software over FTP, HTTP, or HTTPS; to
    initiate outbound SSH and SMTP connections; or to issue DNS or queries against
    other systems.


    One thing to note the iptables.sh script is that all of the LOG rules are built
    with --log-ip-options and --log-tcp-options command-line arguments. This allows
    letting syslog messages to include the IP and TCP options of the IP and TCP headers.
    This functionality is important for both detection and passive OS fingerprinting
    operations performed by psat (see Chapter 7).


    Chapter I'
