  md: 'Again, the iptables blocking rules are added against the 144.202.X.X IP address,
    but this time, 66 UDP packets are monitored in this scan interval before the rules
    are added. (Remember that by default, psad checks for new ipt log messages every
    five seconds.)


    ```

    $ 18:55:55 iptables fw psad: added iptables auto-block against 144.202.X.X

    for 3600 seconds

    $ 18:56:00 iptables fw psad: scan detected: 144.202.X.X -> 71.157.X.X

    tcp=0 udp=66 icmp=0 dangerlevel: 4

    ```


    # Nmap Version Scan


    After waiting for an additional hour, the attacker is back once again with an
    Nmap scan against TCP port 80. The attacker remembers from the SYN scan that there
    is a server listening on this port, and therefore know more information about
    this server.


    ```

    [scanner]# nmap -sV -P0 -80 -n 71.157.X.X

    ```


    Starting Nmap 4.01 ( http://www.insecure.org/nmap/ ) at 2007-03-05 20:40 EST

    Interesting ports on 71.157.X.X:

    PORT STATE SERVICE

    80/tcp open Apache httpd


    Nmap finished: 1 IP address (1 host up) scanned in 6.957 seconds


    The webserver is bound to TCP port 80. The act of establishing a TCP connection
    with the target port in 80 and in of itself does not indicate any suspicious activity.
    From the transport layer and below, the connection appears benign, and iptables
    does not log anything. However, blind FIN packets, as we will see in the next
    example, are a different story.


    # FIN Scan Response


    The attacker, confident that the target is running an accessible TCP server, may
    still wish to test how rigorous the active response software is in terms of TCP.
    For example, the software may not possess a method for tracking the state of TCP
    connections, and so may let a blind FIN packet through to the server. This is
    not the case for iptables; the rules that log and drop packets that match the
    INVALID state at the beginning of the FORWARD chain ("Default iptables Policy"
    on page 20) do not allow the blind FIN packet through to the internal webserver:


    ```

    [scanner]# nmap -sF -P0 -80 -n 71.157.X.X

    ```


    Starting Nmap 4.01 ( http://www.insecure.org/nmap/ ) at 2007-03-05 20:50 EST

    Interesting ports on 71.157.X.X:

    PORT STATE SERVICE

    80/tcp open|filtered http


    Nmap finished: 1 IP address (1 host up) scanned in 0.812 seconds'
