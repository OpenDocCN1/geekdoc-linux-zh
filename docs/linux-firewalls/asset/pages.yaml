    \ the interface on they should be transmitted. Packets that are processed in this\
    \ chain have not been compared against the INPUT or FORWARD chains in the filter\
    \ table.\n\nThe POSTUTING chain is responsible for processing packets after they\
    \ gone through the routing algorithm in the kernel and are just about to be transmitted\
    \ on the calculated physical interface. Packets processed by this chain have passed\
    \ the requirements of the OUTPUT or FORWARD chains in the filter table which may\
    \ be registered, such as the mangle table).\n\n> For a complete explanation of\
    \ how iptables does NAT, see http://www.netfilter.org/documentation/HOWTO/NAT-HOWTO.html.\n\
    \n```\n###### NAT rules #####\necho \"[+1] setting up NAT rules...\"\n$IPTABLES\
    \ -t nat -A PRERUTING -p tcp --dport 80 -i eth0 -j DNAT\n  --to 192.168.10.3:80\n\
    $IPTABLES -t nat -A PRERUTING -p tcp --dport 443 -i eth0 -j DNAT\n  --to 192.168.10.3:443\n\
    $IPTABLES -t nat -A PRERUTING -p tcp --dport 53 -i eth0 -j DNAT\n  --to 192.168.10.4:53\n\
    $IPTABLES -t nat -A POSTUTING -s $INT_NET -o eth0 -j MASQUERADE\n```\n\nReferring\
    \ to the network diagram in Figure 1-2, the IP addresses of the web- and DNS servers\
    \ are 192.168.10.3 and 192.168.10.4 in the internal network. The iptables commands\
    \ required to provide NAT functionality are displayed above (note the restriction\
    \ of the commands to the nat table through the use of the - option). The three\
    \ PRERUTING rules ② allows web services and requests from the external network\
    \ to be sent to the appropriate internal servers. The final POSTUTING rule ③ allows\
    \ connections originating from the internal non-routable network and destined\
    \ for the external Internet to look as though they came from the IP address 71.157.X.X."
