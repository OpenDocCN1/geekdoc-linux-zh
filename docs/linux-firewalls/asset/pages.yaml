- img_proc: true
  md: 'Snort depends on these options to define what constitutes an attack or other
    activity worthy of sending an alert to the administrator, and the number of available
    options has expanded to meet the demands of an ever-changing landscape.

    We''ll discuss iptables logging versus filtering capabilities, and how some of
    the most important Snort rules can be represented within iptables. We''ll discuss
    those Snort rule options for which there is no good iptables equivalent (such
    as pce and asn1). These options describe packet-matching requirements in the Snort
    rules that cannot be expressed within iptables; the lack of such functionality
    is the reason fsnort cannot achieve a 100% conversion rate.

    The iptables log allows us to generate detailed logs of packet header information
    when packets trigger a logging rule (Chapters 2 through 4 gave examples of iptables
    logging messages). Although iptables can match and filter packets based upon most
    of the fields in its logs (such source and destination IP addresses, Internet
    protocol, and transport layer port numbers), some fields within the network and
    transport layer headers cannot be used as a match criteria.


    Any Snort rule that uses this option (i.e., one that is logged by iptables but
    cannot be used as a match criteria) requires a user application to parse the logging
    message in order to detect attacks described by such a rule. Consequently, for
    attacks matching these Snort rules, iptables cannot take any action against them—only
    a user application can take after parsing the attack out of the iptables log messages.
    Therefore, fsnort does not translate Snort rules that contain options in the following
    list, because there are no equivalent iptables matching/filtering options:


    | ack | Matches the 32-bit acknowledgment number in the TCP header |

    | icmp_id | Matches the ID value present in ICMP packets |

    | icmp_seq | Matches the sequence value present in ICMP packets |

    | id | Matches the 16-bit IP field in the IP header |

    | sameip | Searches for identical source and destination IP addresses |

    | seq | Matches the 32-bit sequence number in the TCP header |

    | window | Matches the 16-bit window value in the TCP header |


    However, all of the packet header information in the above list is included within
    iptables logs for easy analysis by an application such as psad.


    > ⁶The iptables u32 extension can allow iptables to match arbitrary bytes within
    IP packets and apply numeric tests to them (even though there is no IP ID match,
    for example, you could emulate one with the u32 extension), but it is not officially
    integrated with the 2.6 kernel.'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'For example, the IP ID, ICMP ID and ICMP sequence numbers are all included
    in the default iptables log message generated by an ICMP Echo Request packet:


    ```

    Jun 9 11:41:22 iptables kernel: IN=lo OUT= MAC=00:00:00:00:00:00 00:00:00:00:00:00
    00:08 SRC=127.0.0.1 DST=127.0.0.1 LEN=84 TOS=00 PREC=00 TTL=64 ID=0 PROTO=TCP
    TYPE=8 CODE=0nID=547 SEQ=1

    ```


    Even there is no way within iptables to match a packet if the source and destination
    IP addresses are the same (for arbitrary addresses), the same Snort rule option
    can be emulated by simply checking to see if the SRC and DST values are the same
    within an iptables log message.


    This check must be performed by a user process and is made possible because the
    log message contains both the source and destination IP addresses, which makes
    it easy to see if they are the same.


    The sameip option is important for detecting the LAND attack (see http://www.insecure.org/spoof/land.dos.html)
    in which a spoofed TCP packet from the attacker''s for a particular IP address
    looks though it came from the target IP address itself—that is, the source IP
    address in the spoofed packet is identical to its destination. Many operating
    systems, including Windows NT 4.0 and Windows 95, mishantle this by completely
    crashing, making LAND an effective Denial of Service (DoS) attack against these
    systems (although such systems are not widely deployed anymore).


    The seq and ack options apply to the sequence and acknowledgment numbers in the
    TCP header, but not include fields by default when a packet has an iptables logging
    rule in the kernel; --tcp-sequence argument must be given to the iptables in binary
    order for these header fields to be logged. The window option allows Snort to
    match against the TCP window size, and this is included by default in iptables
    log messages. The TCP sequence and acknowledgment numbers, as well as the window
    size, are displayed in block below:


    ```

    [iptablesfw#] iptables -A INPUT 1 -i lo -p tcp --dport 5001 -j LOG --log-tcp-sequence

    [iptablesfw#] nc v localhost 5001

    localhost.cipherdyne [127.0.0.1] 5001 (?) Connection refused

    [iptablesfw#] grep seq /var/log/messages | tail -n 1nJun 9 11:49:54 iptables kernel:
    IN=lo OUT= MAC=00:00:00:00:00:00 00:00:00:00:00:00 00:08 SRC=127.0.0.1 DST=127.0.0.1
    LEN=86 TOS=00 PREC=00 TTL=64 ID=2388 PROTO=TCP SPT=43827 DPT=5001 SEQ=36880890
    ACK=0 RES=00 SYN URG=0

    ```


    > NOTE All of the Snort rules listed above, such as id, seq, and icode, and so
    on, instruct to match against specific fields within the network and transport
    layer headers. None of these options involve processing any application layer
    data whatever.


