  md: 'informs the receiving TCP stack that no more data can be sent and that the
    connection is to be terminated, regardless of its current state. The RST flag
    is one of the elements in the 6-bit control fields in the TCP header. It is used
    whenever an untenable condition is encountered by either a TCP client or server,
    and either side of the connection may issue a RST.


    # RST vs. RST/ACK


    Many firewalls and intrusion detection systems can send TCP packets to knock down
    malicious connections, but the implementation details for sending such packets
    vary greatly. One detail often overlooked is whether a firewall or IDS sends a
    plain RST packet or a RST/ACK packet.


    According to RFC 793, there are only three circumstances in which a TCP stack
    should generate a RST/ACK: the packet sent without the ACK bit set. Furthermore,
    there is an inverse relationship between the ACK flag in the last packet seen
    in the TCP session and a RST packet used to tear the connection. That is, if the
    last packet contained the ACK flag, a RST should not contain the flag. Conversely,
    if the last packet did not contain the ACK flag, a RST should.


    For example, if a TCP SYN packet is sent to a port where no server is listening
    (i.e., the port is in CLOSED state), a RST/ACK is sent back to the client. But
    if a SYN/ACK packet is sent to a CLOSED port, then a RST with no ACK bit is sent
    back to the client. These two scenarios are illustrated by the following:


