- img_proc: true
  md: 'To reduce the complexity of the code running in the kernel, do not compile
    features that you don''t need. Removing unnecessary code from a running kernel
    helps to minimize the risks as yet undiscovered vulnerabilities lurking in the
    code.


    For example, if you have need for logging support, simply do not enable the Log
    Target Support option in the menuconfig interface. If you have need for the stateful
    tracking of FTP connections, leave the FTP Protocol support option disabled. If
    you do not need to be able to filter rules against MAC addresses in Ethernet headers,
    disable the MAC Address Match option.


    Only compile in the features that are absolutely necessary to meet the networking
    and security needs of the local network and/or host.


    # Kernel Compilation and Installation


    Now that our kernel is configured, we''ll move on to the compilation and installation.
    As previously mentioned, we assume that all necessary kernel options (such as
    processor architecture) have been selected for the proper support of the hardware
    on which the new kernel will run.


    To compile and install the new 2.6.20.1 kernel within the /boot partition, execute
    the following commands:


    ```

    $ make

    $ su

    Password:

    $ mount /boot

    $ cd /usr/src/linux-2.6.20.1

    $ make install && make modules_install

    ```


    The successful conclusion of the above commands heralds the need to configure
    the bootloader and finally boot into the new 2.6.20.1 kernel. Assuming you''re
    using the GRUB bootloader and that the mount point for the root partition is /dev/hda2,
    add the following lines to the /boot/gr/grub.conf file using your editor:


    ```

    title linux-2.6.20.1

    root (hdo0)

    kernel /boot/vmlinuz-2.6.20.1 root=/dev/hda2

    ```


    Now, reboot!


    ```

    $ shutdown -r now

    ```'
