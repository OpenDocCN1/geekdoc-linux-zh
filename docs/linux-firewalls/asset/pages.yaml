  md: '# Detecting the LAND Attack


    The LAND attack is an old classic. It is a Denial of Service attack targeted against
    Windows systems, and it involves crafting a SYN packet that has the same source
    IP address as its destination IP address. In the Snort signature set, the key
    to detecting the LAND attack is the same packet header text. A modified version
    of Snort rule 527 (originally in the bad-traffic rules file) allows psad to detect
    this attack in iptlogs (the same shown in bold):


    ```

    alert ip any -> any (msg:"BAD-TRAFFIC same SRC/DST"; sameip;

    reference:bugtrack,2666; reference:cve,1999-0016; reference:url://www.cert.com/advisories/CA-1997-28.html;
    classype:bad-unknown; sid:527; psad_id:100103;

    psad_d1:2);

    ```


    psad incorporates the same test by checking to see if the SRC and DST traffic
    is logged in iptables logs. However, in order to reduce false positives, the loop
    interface is excluded from this check.

    Because the SRC and DST fields are always included within iptlogs, no special
    command-line arguments are required when building the LOG rule in psad to detect
    traffic associated with the LAND attack. The following lines represent an iptables
    log generated by the LAND attack (the source and destination IP addresses are
    the same) followed by a corresponding psad syslog alert:


    ```

    Jul 11 20:31:33 iptables kernel: DROP In=eth0 OUT= MAC=00:13:d3:b6:e4:00:13:c:62:40:08
    SRC=192.168.10.30 DST=192.168.10.10 LEN=60 TOS=0x10

    PREC=0x00 TTL=63 ID=43679 PROTO=TCP SPT=52728 DPT=15001 WINDOW=5840

    RES=0x00 SYN URG=

    Jul 11 20:31:38 iptables psad src: 192.168.10.31 signature match: "BAD-TRAFFIC
    same SRC/DST" (sid: 527) ip

    ```


    # Detecting TCP Port O


    Although legitimate TCP connections do not travel over port 0, nothing prevents
    from putting a TCP packet on the wire that is destined for port 0. Indeed, Nmap
    gained the ability to scan port 0 in the 3.50 release.

    The original Snort rule ID 524 (notice the port value in bold) detects packets
    that are sent to destination port 0, and there is a similar rule for UDP port
    0:


    ```

    alert tcp $EXTERNAL_net <> $HOME_net (msg:"BAD-TRAFFIC tcp port 0 traffic"; classype:misc-activity;
    sid:524; psad_id:100101; psad_d1:2);

    ```


    An iptables log message that contains the value in the DPT field will trigger
    this signature in psad, containing DPT=0, as shown in bold:


    ```

    Jul 11 22:02:07 iptables kernel: DROP In=eth0 OUT= MAC=00:13:d3:b6:e4:00:13:c:62:40:08
    SRC=192.168.10.30 DST=192.168.10.11 LEN=44 TOS=0x00

    PREC=0x00 TTL=41 ID=43679 PROTO=TCP SPT=29211 DPT=0 WINDOW=3072 RES=0x00

    SYN URG=

    Jul 11 22:01:22 iptables psad src: 192.168.10.31 signature match: "BAD-TRAFFIC
    tcp port 0 traffic" (sid: 524) tcp port: 0

    ```


    116 Chapter 7'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Detecting Zero TTL Traffic


    As with TCP and UDP port 0, it is possible to put a packet on the wire with a
    zero TTL value. Although such packet should not be forwarded by a device that
    routes IP packets, a system can send such packets against any other system that
    is connected by means of a layer device (such as a switch or bridge).


    Snort rule ID 1321 detects IP packets that have the TTL value set to zero (in
    bold), and a corresponding iptables message appears below, as shown here:


    ```

    alert $EXTERNAL_NET any -> $HOME_NET any msg="BAD-TRAFFIC 0 ttl"; ttl:0;

    reference:url,support.microsoft.com/default.aspx?scid=kb-EN-US;q13268;

    reference:url,www.isi.edu/in-notes/rfc1122.txt; classype:masc-activity;

    id:13221; psad_id:100104; psad_dl:2;

    ```


