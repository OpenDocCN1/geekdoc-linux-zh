  md: '# Adding Blocking Rules


    You can use the --block-ip command-line argument to manually add block-rules for
    the specific IP address or network to the custom psad chains. For example:


    ```

    [iptablesfw]# psad --fw-block-ip 144.202.X.X

    [+] 144.202.X.X to socket, psad will add the IP address within 5 seconds.

    ```


    Once the CHECK_INTERVAL timer expires in the running psad daemon, the IP address
    is added to the blocking chains, with the duration set by the variable AUTO_BLOCK_TIMEOUT:


    Mar 06 01:34:51 iptablesfw psad: added iptables auto-block against 144.202.X.X
    for 360 seconds


    # Removing Blocking Rules


    To remove all blocking rules for a specific IP address or network, you can use
    the --fw-rm-block-ip command-line argument:


    ```

    [iptablesfw]# psad --fw-rm-block-ip 144.202.X.X

    [+] 144.202.X.X to socket, psad will remove the IP address within 5 seconds.

    ```


    Indeed, the running psad daemon expires the blocking rules:


    Mar 06 01:34:51 iptablesfw psad: removed iptables auto-block against 144.202.X.X


    # Flushing All Rules


    Sometimes achieving basic network connectivity can be problematic, and in some
    circumstances, these connectivity issues can be exacerbated by an active response
    mechanism. In addition to the ability to whitelist IP addresses and networks,
    an active response mechanism should also make it easy to remove its influence
    over the network. In case of psad, with dynamically generated iptables rules,
    this implies there should be a way to easily remove all rules within the custom
    psad chains. The psad --Flush command:


    ```

    [iptablesfw]# psad --Flush

    [+] psad chains via running psad daemon within 5 seconds.

    ```


    Once the CHECK_INTERVAL timer expires, the running psad daemon generates the following
    syslog messages:


    Mar 06 01:35:37 iptablesfw psad: flushing existing psad Netfilter auto-response
    chains

    Mar 06 01:35:37 iptablesfw psad: flushed: PSAD_BLOCK_INPUT

    Mar 06 01:35:37 iptablesfw psad: flushed: PSAD_BLOCK_OUTPUT

    Mar 06 01:35:37 iptablesfw psad: flushed: PSAD_BLOCK_FORWARD'
  merge: -1
