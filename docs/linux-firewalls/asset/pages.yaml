  md: '# USE IPTABLES TO DETECT AND PREVENT NETWORK-BASED ATTACKS


    System administrators need to stay ahead of new security vulnerabilities that
    leave their networks exposed every day. A firewall and an intrusion detection
    system (IDS) are two important weapons in fight, enabling you to proactively deny
    access and monitor network traffic for signs of an attack.


    Linux Firewalls discusses the technical details of the iptables firewall and the
    Netfilter framework that are built into the Linux kernel, and it explains how
    they provide strong filtering, Network Address Translation (NAT), state tracking,
    and application layer inspection capabilities that rival many commercial tools.
    You''ll learn how to deploy iptables as IDS with psad and fwnort to build a strong,
    authentication-layer intrusion with fknop.


    +   * Tools for visualizing iptables logs

    * Passive OS fingerprinting with iptables

    * Perl and C code snippets offer practical examples that will help you to maximize
    your deployment of Linux frameworks.


    If you''re responsible for keeping a network secure, you''ll find Linux Firewalls
    invaluable in your attempt to understand attacks and use iptables—along with psad
    and fwnort—to detect and even prevent compromises.


    # ABOUT THE AUTHOR


    Concrete examples illustrate concepts such as firewall log analysis and policies,
    passive network authentication and authorization, exploit packet traces, Snort
    rules emulation, and with more coverage of:


    Michael Rash is a security architect with Enterasys Networks, Inc., where he develops
    the intrusion detection and prevention system. He is a frequent contributor to
    open source projects and the creator of psad, fwnop, and fwnort. Rash is an expert
    on firewalls, intrusion detection systems, OS fingerprinting, and the Snort rules
    language. He is co-author of Snort 2 Intrusion Detection (Syngress, 2004) and
    author of Intrusion Prevention and Active Response (Syngress, 2005), and has written
    security articles for Linux Journal, Sys Admin magazine, and login:


    +   * Application layer attack detection with the iptables string match extension
    and fwnort


    +   * Building an iptables ruleset emulates a Snort rules


    +   * Port knocking vs. Single Packet Authorization (SPA)


