- img_proc: true
  md: 'This example provides a strong motivation against configuring psad to respond
    to port scans, and for instead configuring it to respond only to malicious traffic
    that must travel over established TCP connections.


    # # Integratingad Active Response with Third-Party Tools


    Many software vendors build APIs to facilitate the ability of third-party-software
    to manage or otherwise interact with their applications. This can increase the
    user and installation base of an application because it provides a degree of flexibility,
    plugability, and scriptability that is otherwise unattainable. An example from
    the world of commercial security products is the OPSEC API from Check Point, which
    allows third-party applications to manage Check Point firewalls from remote systems
    (see http://www.opsec.com). Given that commercial products sometimes open APIs
    to allow other applications to easily integrate, it follows that open source projects
    would adhere to this to an even greater degree, and psad is no exception to this
    rule.


    # ## Command-Line Interface


    psad offers more than just the ability to blocking IP addresses with dynamically
    added (and deleted) iptables rules. The active response features can also be easily
    integrated with third-party tools through a command-line interface (which makes
    the response features easily scriptable) or, more directly, by communicating with
    the running psad daemon over a unix domain socket. The following are some of the
    advantages of using psad to manage the iptables ruleset instead of building this
    functionality directly into a third-party application:


    +   - The ability to expire rules based on a timer is built in psad, and therefor
    would not have to be independently developed.


    +   - psad manages the insertion and deletion of dynamically generated rules within
    its own custom chains. This guarantees the separation of psad rules from any existing
    iptables policy.


    +   - psad does not add duplicate rules against an IP address or network if blocking
    rules already exist in the psad chains.


    +   - psad consults the /etc/psad/auto_dl to make sure that it doesn''t block
    whitelisted IP addresses or networks.


    +   - Status information on currently blocked IP addresses can be easily viewed
    with the psad --status command.


    +   - A listing of the custom psad chains can be viewed with the psad --fw-list1
    command. This makes it easy to distinguish iptables rules that are created by
    psad from other rules within a complex filtering policy.


    NOTE All active response capabilities available via a command-line invocation
    of psad require that an instance of psad is running on the system as a daemon.
    If one is not, an error is generated to inform you that psad is not currently
    running.'
  merge: -1
