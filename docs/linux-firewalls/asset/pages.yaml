- img_proc: true
  md: 'The ability to dynamically reconfigure the local iptables policy implies that
    the response takes place at the network layer; for example, an attacker''s IP
    address is blocked from talking up through the IP stack. If an attacker has an
    established TCP session with any server in the local network when a blocking rule
    is instantiated, (because there is no TCP reset generated along with the blocking
    rule) all TCP packets will be dropped, and the endpoint TCP stacks will attempt
    to retransmit data until they timeout.^1


    # Features


    The following active response features are supported by psad:


    +   - Configurable minimum danger level an attacker must reach before an iptables
    blocking rule is added

    - The ability to make blocking rules either permanent or temporary, based on a
    configurable time-out

    - The use of separate iptables chains for all blocking rules so as not to interfere
    with any existing iptables policy on the local system

    - The preservation of blocking rules across restarts of psad or even system reboots
    (this feature is configurable, the default flushes any existing blocking rules
    at psad start time)

    - The inclusion of status output for all currently blocked IP addresses, along
    with the remaining number of seconds before the associated iptables rules are
    removed

    - The ability to have an external process instruct psad to add or remove a blocking
    rule against a specific IP address using the --fw-block-ip and --rm-block-ip command-line
    arguments

    - The ability to differentiate between port scans and attacks that trigger a signature
    match, and the addition of a blocking rule in iptables that can be tied to one

    - Email notifications when an IP address is added or deleted from the psad blocking
    chains


    # Configuration Variables


    The most important variable that controls whether or not psad enters into active
    response is ENABLE_AUTO_TIDS, which can be set to Y or N within the /etc/psad/psad.conf
    file. When this feature is enabled, several other variables (discussed below)
    control various operational aspects of psad as it endeavors to automatically block
    attackers.


    > ^1 As discussed in Chapter 3, iptables can send a reset packet in order to knock
    down a TCP connection through the REJECT target, but psad does not support this
    in conjunction with instantiating a general DROP rule against an attacker.'
