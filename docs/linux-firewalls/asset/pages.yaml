- img_proc: true
  md: '# Essential Netfilter Compilation Options


    Some of the more important options to enable within the kernel configuration file
    include Netfilter connection tracking, logging, and packet filtering. (Recall
    that iptables builds a policy by using the in-kernel framework provided by Netfilter.)


    There are two additional configuration sections in the Network Packet Filtering
    Framework (Netfilter)—Core Netfilter Configuration and IP: Netfilter Configuration.


    # Core Netfilter Configuration


    The Core Netfilter Configuration section contains several important options that
    should be enabled:


    +   - Comment match support

    - FTP support

    - Length match support

    - Limit match support

    - MAC address match support

    - MARK target support

    - Netfilter connection tracking over NFNETLINK interface

    - Netfilter netlink interface

    - Netfilter Xtables support

