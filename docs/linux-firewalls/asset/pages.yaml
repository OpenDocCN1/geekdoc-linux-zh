    Notice at ① above the --algo command-line argument to iptables.

    string match extension is built on top of a text-searching infrastructure in the

    Linux kernel (located within the linux/lib directory in the kernel sources).

    It supports several algorithms, including the Boyer-Moore string

    search algorithm (the bm above), and the Knuth-Morris-Pratt string-searching

    alalgorithm (kmp).¹


    — m state --ESTABLISHED command-line arguments ② restrict

    string match operation to packets that are established of TCP connection

