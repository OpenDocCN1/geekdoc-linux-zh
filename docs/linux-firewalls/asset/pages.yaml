  md: 'The very last step in building the iptables policy is to enable IP forwarding
    in the Linux kernel:


    # Activating the Policy


    One of the really nice things about iptables is that instantiating a policy within
    the kernel is trivially easy through the execution of iptables commands—there
    are no heavyweight user interfaces, binary file formats, or bloated management
    protocols (like the ones developed by some proprietary vendors of other security
    products). Now that we have a script that captures the iptables commands (once
    again, you can download the complete script from http://cipherduty.org/LinuxFirewalls),
    let''s execute it:


    ```

    [iptablesfw#] ./iptables

    +] Flushing iptables rules...

    +] Setting up INPUT chain...

    +] Setting up OUTPUT chain...

    +] Setting up FORWARD chain...

    +] Setting up NAT rules...

    +] Enabling IP forwarding...

    ```


    # iptables-save and iptables-restore


    All of the previous iptables commands in the iptables script are executed one
    at a time to initialize new rules, set the default policy on a chain, or delete
    old rules. Each command requires a separate execution of the iptables binary to
    create the policy into existence quickly at system boot, particularly when the
    number of iptables rules grows into the hundreds (which can happen with a policy
    built by fswat,). A much faster mechanism is provided by the commands iptables-save
    and iptables-restore, which are installed within the same directory (/sbin in
    our case) as the iptables program. The iptables-save command builds a file that
    contains all iptables rules in a running policy in human-readable format. This
    format can be interpreted by the iptables-restore program, which takes each of
    the rules listed in the ipt.save file and instantiates it within a running kernel.
    A single execution of the iptables-restore program recreates an iptables policy
    in the kernel; multiple executions of the iptables program are not necessary.
    This makes the iptables-save and iptables-restore commands ideal for rapid deployment
    of iptables rules, and I illustrate this process with the following two commands:


    ```

    [iptablesfw#] iptables-save > /root/ipt.save

    [iptablesfw#] cat /root/ipt.save | iptables-restore

    ```'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'The contents of the ipt.save file are organized by iptables, and within each
    section devoted to an individual table, ipt.save is further organized by iptables
    chains. A line that begins with an asterisk (*) by a name (such as filter) denotes
    the beginning of a section in the ipt.save file that describes a particular table.
    Following this are lines that track packet and byte counts for each chain associated
    with the table.


    Lastly, the word COMMIT on a line itself concludes the section of the ipt.save
    file that characterizes the iptables table. This line constitutes the marker for
    all information associated with the table. Below is a complete example of what
    the filter table section looks like once we have executed all of the iptables
    commands up to this point in the chapter:


    ```

    # Generated by iptables-save v1.3.7 on Sat 14 17:35:22 2007

    *filter

    :INPUT DROP [0:0]

    :FORWARD DROP [0:0]

    :OUTPUT DROP [2:112]

    - INPUT -m -state INVALID -j LOG --log-prefix DROP INVALID

    --tcp-options --log-options

    - INPUT -m -state INVALID -j DROP

    - INPUT -m -state RELATED,ESTABLISHED -j ACCEPT

