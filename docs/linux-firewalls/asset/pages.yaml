    Digging into the source code, at the script uses the Net::RawIP module, which
    must be installed on your system. (You can download it from http://www.cpan.org.)
    At the Snort rules file on the command line is opened, and the script iterates
    over all of the rules in the file. At the snortpoof.pl extracts TCP and UDP signatures
    that detect attacks against the HOME_NET; we want to send attacks against a Remote
    snort sensor will be coming into the HOME_NET.


    The most complex portion of the code begins at-the interpretation of the application
    layer content trying to match within traffic. If the original content field contains
    headers enclosed between pipe () characters, snortpoof.pl converts these characters
    into bytes they actually represent before the attack is put on the wire.

    at, snortpoof.pl uses the Net::RawIP Perl module to build either a TCP or UDP
    packet with the source and destination IP addresses that specified on the command
    line, the source and destination port numbers, and the application layer data
    is derived from the Snort rule.


    Finally, the packet is sent on its way towards the target IP.

    it is time to use snortpoof.pl to target an IP address with packets that match
    the signatures contained within the exploit.rules file, faking the source IP address.


    # Spoofing exploit.rules Traffic


    You can execute snortpoof.pl from the command line as follows to spoof the attack
    packets in the Snort rules file (crafting them as they appear to come from the
    IP address 11.11.22.22) and send them to the target IP address 44.44.55.55.


    ```

    [spoofer]# /../snortpoof.pl /etc/fwsnort/snort_rules/exploit.rules 11.11.22.22
    44.44.55.55

    +] /etc/fwsnort/snort_rules/exploit.rules, 53 attacks sent.

    ```


    Using tcpdump, we can confirm that snortpoof functions as claimed and generates
    attack packets against the target IP address. The following example shows that
    Snort rule ID 315 EXPLOIT x86 Linux overflow is over UDP port 63


    ```

    alert udp $EXTERNAL_NET any -> $HOME_NET 635 (msg:"EXPLOIT x86 Linux mount overflow";content:"*|B
    02 09 06 FE C8 09|F|04 06 09|F";reference:bugtra,121; reference:cve,1999-0002;
    clasype:attempted-admin; sid:315; rev:6);

    ```


