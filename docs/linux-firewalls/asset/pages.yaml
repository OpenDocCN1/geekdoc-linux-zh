    # TCP Port Scan Techniques


    Port scans of TCP ports can be accomplished with a surprising number of techniques.
    Each of these techniques looks slightly different on the wire as traverse a network,
    and we dedicate the next few sections (beginning with "TCP Idle Scans" and ending
    with "TCP Idle Scans" on page 59) to illustrating the major scanning techniques.
    Fortunately, the unequal Nmap scanner (see http://www.incsecure.org) has automated
    each of these techniques for us, and we use Nmap for all scans in this chapter.
    We launch scans using the iptablesfw with the default iptables policy (see Figure
    3-2), and we will discuss the Nmap port-scanning techniques listed below:


    +   - TCP connect() scan—(Nmap -sT)

    - TCP SYN or half-open scan—(Nmap -sS)

    - TCP FIN, XMAS, and NULL scans—(Nmap -sf,-sX, -sN)

    - TCP ACK scan—(Nmap -sA)

    - TCP idle scan—(Nmap -s1)

    - UDP scan—(Nmap -sU)


    In each of the following, the Nmap -p0 command line option is used to force Nmap
    to skip determining whether the iptables system is up (i.e., host discovery is
    omitted) before sending a scan. From Nmap''s perspective, each scanned port can
    be in one of three states:


    | open | There is a server bound to the port, and it is accessible.

    | closed | There is no server bound to the port.

    | filtered | There may be a server bound to the port, but attempts to communicate
    with it are blocked, and Nmap cannot determine if the port is open or closed.|


