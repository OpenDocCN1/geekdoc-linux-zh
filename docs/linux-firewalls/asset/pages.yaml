  md: '# Concluding Thoughts


    Armed with signatures from the Snort community that point the way toward effective
    attack detection, fwsnort and psad can turn your iptables firewall into a system
    that can detect and respond to application layer attacks. Essentially, this turns
    iptables into a basic intrusion prevention system with the power to stop a host
    of attacks from interacting with processes bound for sockets on the local system,
    or with remote clients or servers whose traffic is forwarded through the system.
    In Chapters 12 and 13 we''ll see that stopping attacks against servers can be
    made more robust with a default-drop packet filter and Single Packet Authorization.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# 12


    # PORT KNOCKING VS. SINGLE PACKET AUTHORIZATION


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_234_0.png)


    So far in this book, I have endeaved to discuss the use of various iptables facilities
    along with psad and fwsnort to detect and thwart network-based attacks. This chapter
    represents a marked departure from the traditional network access and security
    model, where packet filters are configured to allow access to network services
    and application security is left to the applications themselves, with (limited)
    help from signature-based intrusion detection systems. By employing iptables in
    a default-drop stance for set of protected services, and simultaneously granting
    access to only clients that are able to prove their identity to iptables via passively
    collected information, we can add an additional layer of security to arbitrary
    network services.


    # Reducing the Attack Surface


    This book about using the facilities in Netfilter and iptables to detect and respond
    to network-based attacks, so at first glance, it might appear that this chapter
    and the next (which covers the fwknop implementation of SPA) are'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'out of place. However, any service that is protected by a default-drop packet
    filter is fundamentally inaccessible from arbitrary-de-unless the packet filter
    is reconfigured to allow access. This implies that the only sessions that can
    exist with such services are those that have been authorized; in turn, this also
    implies that the attack rate and the false positive rate these services are reduced.
    This is particularly true for TCP-based services, since most intrusion detection
    systems today maintain a notion of TCP session state in order filter bogus attacks
    that are spoofed over the network without an established TCP session.


    A spoofed attack monitored by an IDS will not generate a positive, and an attempt
    to deliver a real attack on an established TCP session will fail because a session
    cannot be established due to the default-drop packet filter. Here, knocking and
    SPA result in a reduction of the means to perpetrate attacks against network services.
    With the functionality by iptables can make it easy to implement effective portknocking
    and SPA systems. Adding this extra layer of security to services like SSHD can
    mean the difference between being compromised and remaining secure.


    # Zero-Day Attack Problem


    With all the effort put into software over the past few years—particularly with
    open source projects like OpenBSD and OpenSSH—it would seem that the newly discovered
    vulnerabilities would be the decline. However, new vulnerabilities are found in
    all sorts of software at an increasing pace, with no reprieve in sight.


    > The Bugtrag, Full-disclosure, and Vuln-dev mailing lists are quite active and
    provide excellent technical information and discussion on some of the latest exploits
    and attack techniques. Whole companies (like IDense—see http://www.iddefense.com)
    have sprung up with models based on vulnerability tracking, providing services
    that act as vulnerability early-warning systems for users. IDense even pays vulnerability
    researchers for new exploits in the right to publish them.


    Most pieces of software created in the commercial world are developed for customers
    in an effort to maximize profits, not security. However, with the advent of high-profile
    classes of security problems such as phishing, spyware, identity theft, and particularly
    damaging worms (such as Code Red and the SQL Slammer worm) that target Microsoft
    systems, companies are beginning to put more emphasis on security.


    Incidents like the theft of personal data from large financial institutions have
    already elevated the issue of computer and physical security in the eyes of lawmakers.
    Legislation has been passed in California that requires companies to notify consumers
    if sensitive information is acquired by a third party (see http://www.privacyrights.org/ar/LawsCA.htm
    for more information).


    +   SecurityFocus maintains a searchable database of security vulnerabilities
    that is freely accessible at http://www.securityfocus.com/bid. Approximately 50
    new vulnerabilities are added to this database every day.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'NOTE I refrain from commenting on the almost religious debate whether or not
    Microsoft operating systems and applications are inherently less secure than other
    operating systems and software. Regardless, one thing is clear: A combination
    of Microsoft software and the ease with which it is attacked contributes to a
    worldwide infrastructure that has significant security shortcomings. This results
    in a target-rich environment for malware.


    But is it about computers and software that seems to render them brittle in the
    face of determined attackers? Why are buffer overflow vulnerabilities still widespread,
    even though the technique was demonstrated decades ago? Shouldn''t we squashed
    that class of bug long time ago?


    Rather than offer lengthy answers to these questions and we ask far into technologies
    stack hardening and kernel mode protections, I''ll make a few observations.


    First, software always relies on an implementation, and there is no mechanism
    to rigorously verify that piece of software secure. Bugs in any implementation
    may expose a theoretically sound software design to security problems.


    Second, consider the OpenSSH project (see http://www.openssh.org). OpenSSH is
    written by some of the world''s most astute and security-minded developers, and
    yet even OpenSSH has been known to have vulnerabilities. This tells us that writing
    bug-free software is really hard, and even the best developers make mistakes.


    # Zero-Day Attack Discovery


    A zero-day attack is created when someone finds a previously undiscovered security
    vulnerability in a piece of software and writes an exploit for it. For a time,
    this person is the only one who knows about the vulnerability, and he or she has
    a choice: to refrain from using the exploit and notify the software vendor so
