    Scanned ports: [1-61440: 1522 packets]

    tcp flags: [SYN: 1522 packets, nmap: -sT or -sS]

    iables chains: INPUT (prefix "DROP"), 398 packets


    # Source and Destination IP Addresses


    The source IP address of the scan is next, along with reverse DNS information.
    By default, psad performs a reverse DNS lookup on offending IP address unless
    the --no-rdns option is specified on the psad command line. Also included is a
    passive OS fingerprint that derived from the SYN packet (on this topic in the
    next chapter), followed by the destination IP address and name.


    ```

    Source: 192.168.10.200

    DNS: int_scanner

    OS guess: Linux:2.5::Linux 2.5 (sometimes 2.4)

    Destination: 192.168.10.1

    DNS: iptables-fw

    ```


    # syslog Hostname, Time Interval, and Summary Information


    The syslog hostname is included next, and this is mostly useful if the log message
    originates from a remote syslog server. You can configure syslog to accept messages
    from multiple systems that are running iptables, and keeping track of the hostname
    helps differentiate psad alerts from multiple systems. Timestamp information is
    also included so that you know when the psad alert was generated.

    Next, IF PERSISTENCE is set to Y, the scan information will not time out or be
    removed from memory as psad runs. The summary information provides the time the
    source IP address first behaving suspiciously, the total number of email alerts
    that psad has sent for the same source IP address, the complete port range that
    has been scanned since the source IP address attracted attention to itself, and
    all iptables chains and packet counts associated with the source IP address.


    ```

    Syslog hostname: iptables

    Current interval: Tue Jul 10 12:06:23 2007 (start)

    n Tue Jul 10 12:06:27 2007 (end)

    Overall scan start: Tue Jul 10 12:01:23 2007

    Total email alerts: 1

    Complete tcp range: [1-65301]

    chain: interface: tcp: udp: icmp:

    INPUT eth1 0 0

    ```


    # whois Database Information


    The last block of information in a psad email alert is the result of a whos query
    against the source IP address of the scan. The excellent whos client written by
    Marco d''Itri (see http://www.linux.it/-md/software) is bundled with the psad
    sources and used by psad for all queries. (You)'
