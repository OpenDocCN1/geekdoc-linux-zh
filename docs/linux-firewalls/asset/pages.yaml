  md: 'When psad is started via the init script, three daemons are also started:

    the psad daemon, kmsgsd, and psadwatch. The purpose of kmsgsd is

    to read all iptables log messages out of the /var/lib/psad/psad named

    pipe and write them to a separate file, /var/log/psad/fwdata, for on-the-

    analysis by psad. In this way, psad is supplied with a pure data stream that

    exclusively captures iptables log messages.


    At install time, psad reconfigures the syslog daemon to write all kernel messages

    that have a priority of info (or kern.info messages, in syslog parlance) to the
    /var/lib/

    psad/psadfifo named pipe.


    The psadwatch daemon simply makes sure that both the psad and

    kmsgsd daemons are running and restarts if they are not. If psadwatch

    m restart either of the other two daemons, it sends a warning email to the

    address listed within the /etc/psad/psad.conf file.


    # Daemon Process Uniqueness


    When psad is started, each of the three daemons writes its own process ID

    (PID) to files within /var/run/psad. If any daemon is started manually from

    the command line, it first checks to see if another instance is running; if so,
    the

    new instance exists immediately. This ensuring any psad process is left

    disturbed.


    # iptables Policy Configuration


    Fundamentally, psad is a log analyzer. It assumes that the iptables policy on

    system where psad is deployed is configured in a log-and-drop stance. This

    ensures that iptables only accepts packets that are strictly necessary for

    the network to function; all other packets are logged and dropped. Port scans,

    probes for backdoor programs, subversive application commands (we will see

    in Chapter 9 that iptables can filter on application layer data), and other

    felarious miscellany lie outside the list of acceptable network traffic, so

    iptables logs derived from such a policy can provide a valuable

    supplement to a dedicated intrusion detection system.


    An automated mechanism for verifying the local iptables policy is

    configured with default LOG and DROP rules in both the INPUT and FORWARD

    chains provided by psad. This mechanism is a dedicated script located

    at /usr/bin/fwcheck_psad, which is executed by psad at start time (unless

    t--no-fwcheck command-switch is given or psad is running on a se-

    erate syslog server). The fwcheck_psad script uses the IPTables::Parse Perl

    module to acquire a representation of the local iptables policy, which it

    interprets to see if it contains the LOG and DROP rules. If not, psad will send

    a configuration alert email to inform you that the iptables policy is not

    configured.'
