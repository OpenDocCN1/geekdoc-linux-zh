  md: '# Detecting Source Routing Attempts


    Source routing is a technique supported by the IPv4 protocol by which an adversary
    can attempt to route packets through networks that would otherwise be inaccessible.
    Source routing options are included within the options of the IP header, and Snort
    rule ID 500 detects loose source routing attempts with the IP header tester (shown
    below):


    ```

    alert ip $EXTERNAL net -> $HOME any msg:"MISC source route lssr"; ipsr: reference:achninds,a18;
    reference:bugtraq,646; reference:cue; 1999-0909; classtype:bad-unknown; sid:500;
    psad_id:100199; psad_dl:2;

    ```


    Because it is possible to issue loose source routing directives using IP options,
    one can only detect this type of traffic if the LOG rule is built within the --log-ip-options
    command-argument. In iptables logs an IP packet that contains IP options, the
    log message includes options as an argument to the OPT string like (83078C0A8A30).
    According to RFC 791, the loose source routing option is defined as option number
    131 (hex 83) and has a variable length. The following iptables log message contains
    an OPT string generated by an IP packet that contains the loose source routing
    option (shown below):


    ```

    13 19:39:53 iptablesfw kernel: In=eth OUT SRC=192.168.10.3 DST=192.168.10.1 LEN=68
    TOS=0x00 TTL=64 ID=10096 OPT=(83078C0A8A30) PROTO=TCP SPT=507 DPT=80 WINDOW=512
    RES=0x00 URG=0

    ```


    psad notice the source routing


    ```

    13 19:39:56 iptablesfw psad: src:192.168.10.3 signature match:"MISC source route
    lssr" (sid: 500) ip

    ```


    # Detecting Messenger Pop-up Spam


    Spam is a pervasive problem on the Internet, and we are all feeling the effects
    of this scourge. One way that spammers try to have their spam viewed by more people
    is by sending it directly through the Windows Messenger service. Although it is
    pretty useless to detect this traffic when it is coming from external networks
    (because each spam message can be spoofed and only a single UDP packet is required
    to transmit it when the message is large), it can be important to detect it when
    it''s coming from your internal network. Any system that is generating such traffic
    on your intranet may be compromised and used to send spam by someone controlling
    the system from afar.


    Because psad treats packets that are logged in the INPUT chain as being directed
    at the home network (regardless of where they come from internal addresses), the
    following signature detects Windows pop-up spam attempts when they are directed
    at the header ② the UDP with a destination port range from 1026 to 1029 and an
    application layer data size greater than 100 bytes with the psad dsize test ③).'
