  md: '# REGULAR EXPRESSIONS and IPTABLES


    Adding some limited regular expression support to iptables (with features such
    as back references and repetition operations removed) has been proposed before
    to the iptables project maintainers. However, implementing a generalized regular
    expression engine in the kernel such as a nondeterministic automaton or NFA (similar
    to what is used in various languages, utilities, and editors such as Perl, Python,
    GNU Emacs, and grep) is a risky proposition. Sometimes it is possible to construct
    some pathological data for which the run of a regular expression against the data
    can be in the thousands of years. We don''t want to make it easy to crash the
    entire kernel by a maliciously constructed packet past the system interfaces.


    +   * The iptables-filter packet classifier project at: http://iptables-filter.sourceforge.net.


    can take any form that it wishes the constraints of the encoding scheme, and the
    result is that an attack can exhibit a degree of variability on the wire that
    can be difficult to decode without a way to normalize the data. For example, the
    string "bin/sh" and its URL-encoded version "%22bin%69%6e%2f%73%68" are absolutely
    identical in the eyes of a webserver after the decoding process, and yet raw byte
    sequences look completely different on the wire. Strictly speaking, there is no
    direct translation for the urcontent Snort option within iptables, because the
    string match extension cannot decode URL-encoded data.


    While the encoded string "%22bin%69%6e%2f%73%68" can be included by fsnort without
    a separate rule, an attacker can sidestep this by mixing the encoding—for example,
    the attacker could send "bin%2f%73%68". The number of possible encodings for a
    string n characters quickly gets large as n increases.


    However, at the same time, there is no requirement on the part of an attacker
    to URL-encode at all, and seeing "bin/sh" in the HTTP request is suspicious—whether
    it is encoded or not. In addition, certain attacks may not include the ability
    to change the encoding of a portion of an exploit sent against a webserver, a
    single string is all that is needed to detect the attack. Thus, fsnort decodes
    the content and urcontent Snort options, although this comes at the expense of
    potentially missing URL-encoded attacks.


    # offset


    The offset Snort option inserts Snort to begin content matching operations at
    a specified number of bytes past the beginning of the payload data within a packet.
    This is an absolute number that applies to all content matches in the Snort rule,
    and is not subject to the relative number of bytes between multiple content matches
    (the distance Snort option is used for this). The offset option is supported in
    iptables using the --from command-line argument to the string match extension
    when looking for a pattern in payload data (this is only supported in kernel versions
    2.6.14)


    Translating Snort rules into iptables 161'
