    in determining the success of the idle scan is the utilization of available services
    on the zombie. A popular webserver is not suitable as a zombie. In this case,
    every TCP connection increments the IP ID value, the value is incremented by the
    scanner''s control for the most part. This makes it impractical to map changes
    in the IP ID value to scanned ports.


    Systems that are target of idle scans have no way to know the real source of the
    scanner because all they see are spoofed SYN packets from the zombie host. The
    iptables logs on the target look just like a normal scan (see "TCP SYN or Half-Open
    Scans" on page 56).


    NOTE If a default-drop firewall is running on the zombie host, the only way for
    it to work is to hard-code the source to an open TCP port on the zombie. The reason
    is that a filtered SYN/ACK would not be seen by the zombie TCP stack, so it would
    never send a RST and the IP ID would therefore not increment. In some cases, the
    lightly utilized service might be the only available port if a firewall is deployed.


    # UDP Scans


    Since UDP does not implement control messages for establishing connection, scans
    for UDP services are simplistic and accomplished in one way by sending data to
    a UDP port and then seeing if anything comes back within a reasonable amount of
    time. Because a UDP packet to an unported port no server is listening will elicit
    an ICMP Port Unreachable message, it is easy for a scanner to determine whether
    a UDP port is closed.


    In contrast, a UDP packet to an open port may meet complete silence even if the
    packet is not filtered. This is because a UDP server is not obligated to respond
    with a packet; whether it responds is entirely at the discretion of the particular
    server application that is bound to the port.


    If a firewall blocks a UDP packet to a particular port from a scanner, the scanner''s
    receiving nothing like the scanner like a UDP application to the port had nothing
    to say. (This is why ports that are filtered are reported as open|filtered by
    Nmap.) For example, below is an Nmap UDP scan of the iptables swift and a few
    lines of iptables logs entry. all scanned UDP ports are in the open|filtered state
    (shown in bold), and a sample UDP port log follows the scanner output:


