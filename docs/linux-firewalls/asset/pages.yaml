  md: '# The FORWARD Chain


    So far the rules we have added to the iptables filtering policy strictly govern
    the ability of packets to interact directly with the firewall system. Such packets
    are either destined or emanate from the firewall system and include packets such
    connection requests to the SSH daemon from systems or locally initiated connections
    to external sites to download security patches.


    Now let''s look at the iptables rules that pertain to packets that do not have
    a source or destination address associated with the firewall, but nevertheless
    attempt to route through the firewall system. The iptables FORWARD chain in the
    filter table provides ability to wrap access controls around packets that are
    forwarded across the firewall interfaces:


    ```

    ###### FORWARD chain ######

    echo "+] Setting up FORWARD chain..."

    ### state tracking rules

    $IPTABLES -A FORWARD -m --state INVALID -j LOG --log-prefix "DROP INVALID --"
    --log-opt-options --log-tcp-options

    $IPTABLES -A FORWARD -m --state INVALID -j DROP

    $IPTABLES -A FORWARD -m --state ESTABLISHED,RELATED -j ACCEPT

    ```


    ```

    ### ACCEPT anti-spoofing rules

    $IPTABLES -A FORWARD -p tcp -i eth1 -s $INT_NET -j LOG --log-prefix "SPOOFED PACKET"

    $IPTABLES -A FORWARD -i eth1 -s ! $INT_NET -j DROP

    $IPTABLES -A FORWARD -p tcp -i eth1 -s $INT_NET --dport 21 --syn -m state --NEW
    -j ACCEPT

    $IPTABLES -A FORWARD -p tcp -i eth1 -s $INT_NET --dport 22 --syn -m state --NEW
    -j ACCEPT

    $IPTABLES -A FORWARD -p tcp -i eth1 -s $INT_NET --dport 25 --syn -m state --NEW
    -j ACCEPT

    $IPTABLES -A FORWARD -p tcp -i eth1 -s $INT_NET --dport 43 --syn -m state --NEW
    -j ACCEPT

    $IPTABLES -A FORWARD -p tcp --dport 80 --syn -m state --NEW -j ACCEPT

    $IPTABLES -A FORWARD -p tcp --dport 443 --syn -m state --NEW -j ACCEPT

    $IPTABLES -A FORWARD -p tcp -i eth1 -s $INT_NET --dport 4321 --syn -m state --NEW
    -j ACCEPT

    $IPTABLES -A FORWARD -p udp --dport 53 -m state --state NEW -j ACCEPT

    $IPTABLES -A FORWARD -p tcp --dport 53 -m state --state NEW -j ACCEPT

    $IPTABLES -A FORWARD -p icmp --icmp-type echo-request -j ACCEPT

