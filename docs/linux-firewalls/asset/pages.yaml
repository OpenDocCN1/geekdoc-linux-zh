  md: '# Signature Translation Examples


    Before jumping into theoretical aspects of translating Snort rules into iptables
    rules with fswort, we will look at a few Snort rules that have already been translated.


    # Nmap command attempt Signature


    The Nmap command attempt signature in the Snort file web-attacks.rules detects
    attempts to execute the Nmap scanner via a webserver.


    This signature is useful for detecting attempts of an attacker to use a webserver
    to scan other systems that may be more easily accessed by the webserver—local
    firewall rules may be more forgiving to webserver communications than the attacker''s
    IP address (which is directly connected to an internal network). An attacker would
    typically use a CGI application that does not properly filter user input in order
    to perpetrate such a scan attack.


    The signature is triggered when the string "nmap%20" is transferred across an
    established TCP connection (as shown in below):


    ```

    alert tcp $EXTERNAL_NET any -> $HTTP_SERVERS $HTTP_PORTS (msg:"WEB-ATTACKS nmap
    command attempt; flow:to_server,established; content:"nmap%20"; nocase; clasype:web-application-attack;
    sid:1361; rev:5);

    ```


    The Nmap execution is elegant; it detects a suspicious activity in a generic way.
    Snort does not interpret whether a CGI application is vulnerable to the Nmap attempt—the
    itself is suspicious.


    Recasting this signature into an iptables policy with fswort results in the rule
    shown below. We''ll discuss the specifics of the iptables rule in Chapter 10,
    but note, that this is an iptables LOG rule that for match to mimic the Snort
    rule is looking for network traffic. The iptables comment is also about to be
    used in the rule in the kernel with the original Snort field:


    ```

    $IPTABLES -A FSWORT_FORWARD -p tcp --dport 80 -m string --string "nmap%20" --algo
    bm -m comment --comment "sid:1361; msg: WEB-ATTACKS nmap command attempt; clasype:web-application-attack;
    rev:5; FW:0; -j LOG --log-ip-options --log-tcp-prefix "[20] ESTABLISHED "

    ```


    Another way to write a signature to detect inappropriate Nmap executions via a
    webserver is to look for Nmap output that is returned from a webserver to a web
    client. This is more effective for detecting successful Nmap executions instead
    of detecting attempts to abuse a CGI application because a (nonicious) server
    does not have the freedom to obfuscate the data it returns to try and evade intrusion
    detection systems—attackers have this freedom'
