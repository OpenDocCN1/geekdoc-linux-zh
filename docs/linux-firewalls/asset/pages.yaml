    \ from the Snort website (http://www.snort.org). Many security applications (including\
    \ fwsort) took advantage of the rules by providing an automatic update feature\
    \ to synchronize with the latest Snort rules. While automatically updating in\
    \ this way is no longer possible, as of writing this the latest Snort rulesets\
    \ distributed by the Bleeding Snort project are still available for (free) download.\n\
    \n fsnort installer places the Net::IPvAddr and IPTables::Parse Perl modules in\
    \ the directory /usr/lib/fsnort so not to clutter the system Perl library tree.\
    \ (This is similar to the installation strategy implemented by psad, as discussed\
    \ in Chapter 5.)\n\nIn order to use iptables, you will need to use the iptables\
    \ string-matching capability. If you are running kernel version 2.6.14 or later,\
    \ string matching may be already compiled into your kernel.\n\nAn easy way to\
    \ check if the kernel supports the string-matching extension is to attempt to\
    \ create a string-matching iptables rule against nonexistent IP address (so that\
    \ any real network communications are not disrupted), so:\n\n```\n[iptablesfw]#\
    \ -INPUT INPUT 1 -i lo -d 127.0.0.2 -m string \"testing\" -algo bm -ACCEPT\n```\n\
    \nIf the error iptables: no chain/target/match by name is returned, the extension\
    \ is not available in the running kernel. This can be fixed by enabling the CONFIG_NETFILTER_X_MATCH_STRING\
    \ configuration file, recompiling, and booting into the new kernel (\"Kernel Configuration\"\
    \ on page 14 for recommended iptables kernel compilation options). If the command\
    \ succeeds, then iptables string matching is compatible with your kernel, and\
