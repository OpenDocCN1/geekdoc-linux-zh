- img_proc: true
  md: '# Defense in Depth


    Intrusion detection systems themselves can be targeted with attacks ranging from
    efforts to subvert the IDS alerting mechanism by forcing false positives to be
    generated, to attempts to gain outside execution by exploiting a vulnerability
    within the IDS. For example, both real and fake attacks can be sent over the Tor
    network in order to make the attacks appear to originate from IP addresses that
    are not associated with the attacker''s network. In addition, remotely exploitable
    vulnerabilities occasionally crop up with intrusion detection systems (such as
    the Snort DCE/RPC preprocessor vulnerability); see http://www.snort.org/docs/advisor-2007-02-19.html.


    The defense-in-depth principle applies not only to conventional computer systems
    (servers and desktops), but also to security infrastructure such as firewalls
    and intrusion detection systems. Hence, there is room to supplement existing intrusion
    detection/prevention systems with additional mechanisms.


    # Target-Based Intrusion Detection and Network Layer Defragmentation


    Building features into an IDS that allows to augment detection operations with
    characteristics of end hosts is known as target-based intrusion detection. For
    example, the IDS offers network layer defragmentation via the frag3 preprocessor,
    which can apply various packet fragmentation algorithms (including those in the
    Linux, BSD, Windows, and Solaris IP stacks) to fragmented network traffic. This
    is useful because it allows Snort to apply the same defragmentation algorithm
    that a targeted host uses: If a fragmented attack is sent against a Windows system
    but Snort defragments the attack with the algorithm used by the Linux IP stack,
    the attack may be missed or incorrectly reported.


    The frag3 preprocessor does not automatically map defragmentation to hosts; instead,
    you must manually tell Snort which algorithm to run for each monitored host or
    network, and therein lies the possibility of configuration errors. For example,
    suppose that the IT group at an IP address that is typically reserved for Windows
    hosts. For all IP addresses in this range, the Snort frag3 preprocessor is configured
    to defragment all traffic using the Windows algorithm. In this case, unless the
    IT group lets up a new Linux server, there is a disconnect between the frag3 configuration
    and the operating systems that are actually deployed. Fragmented attacks against
    the Linux system will be defragmented by Snort with the algorithm used by Windows
    IP stacks.


    In the case of fsnort (particularly deployed locally on the same system targeted
    by an attacker), we don''t need to worry about defragmentation issues because
    the defragmentation algorithm applied is the actual victim IP stack. With fsnort,
    network defragmentation is performed using the Netfilter connection-tracking subsystem
    (which must defragment traffic in order to classify packets into the correct connection)
    together with an fsnort policy. The application layer inspection performed by
    fsnort takes place after the Linux IP stack has already defragmented the traffic.'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'NOTE With fswort and iptables, fragmented attacks are less of concern, the
    benefits of target-based intrusion detection are not limited to network fragmentation
    issues, and this is an area of active research and development in the IDS community.
    For example, an IDS could use OS and application information to weed out potential
    false positives or severity of reported attacks. For example, an attack that exploits
    a buffer overflow in the Microsoft IIS webserver is directed at an Apache webserver,
    the attack has no possibility of compromising the target. In this case, if the
    attack is detected by the IDS, the severity of the event should be a bit less
    than if the attack were directed at a real IIS.


    # Lightweight Footprint


    Heavily used systems lack available resources to deploy an all-user process for
    intrusion detection (such as Snort). In the case of fswort, packet inspection
    takes place directly within the Linux kernel, and so usually takes a lightweight
    footprint on system resources—there is no need to copy data from kernel memory
    into a user process (as is the case for a major IPS). On systems where it is inappropriate
    to deploy a dedicated IDS/IPS because of resource constraints, fswort may provide
    aable alternative.


    # Inline Responses


    Because the iptables signature policy by fswort is always inline to network traffic,
    it is an ideal candidate for taking action against certain attacks that are particularly
    malicious. For example, a new vulnerability is discovered within Linux server
    software (such as BIND) that is deployed in your infrastructure. If the Snort
    community develops a signature to detect attacks against this vulnerability, fswort
    can be configured to drop packets (via the iptables DROP target) that appear to
    match the attack, and standard protocol responses can be issued by fswort via
    the REJECT target (more on this topic in Chapter 11)


    If the server uptime tied to a Service Level Agreement (SLA), then there may be
    a waiting period before it can be taken down and patched, and this ensures the
    availability of a patch to fix the vulnerability (which is not always the case).
    If the server software must remain globally available before an outage window
    can be scheduled to apply a patch, an inline prevention mechanism can provide
    valuable protection against exploits for the vulnerability. (In addition, because
    fswort policies are lightweight, they can usually be deployed alongside other
    mechanisms such as Snort running in inline mode.)


    NOTE Because fswort just builds a shell script to execute iptables commands, it
    is rarely deployed on many systems with something like Zenoss (http://www.zenoss.org/),
    which can execute commands via SSH over many remote systems in one swoop. This
    makes it easy to leverage fswort across all Linux systems in your infrastructure.


    5 Emphasize IPS here, in the case of IDS, Snort can use the shared memory method
    of grabbing packet data from the kernel (which requires CONFIG_PACKET_MMAP support
    in the kernel), and this has less of an impact on performance than getting packet
