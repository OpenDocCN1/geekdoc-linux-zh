- img_proc: true
  md: '--ipt-reject This option instructs fsnort to build an iptables policy that
    utilizes the REJECT target to respond against malicious TCP connections with TCP
    Reset packets, and to respond against malicious UDP traffic with an ICMP Port
    Unreachable message.


    --snort-conf path This option instructs fsnort to read variables such as HOME_NET,
    EXTERNAL_NET, HTTP_SERVERS, and so directly from an existing Snort configuration
    file (usually located at /etc/snort.conf). There is nothing preventing Snort and
    fsnort from running on the same system. This remains true even when fsnort is
    running in inline mode, because fsnort rules are sectioned off within their own
    chains; packets can be jumped to these chains before hitting a QUEUE rule within
    the iptables policy.


    --snort-sid sids This option allows traffic of fsnort to be restricted to a specific
    Snort ID or a list of Snort IDs. This is most useful when a new vulnerability
    is announced in a piece of software that is protected by an iptables firewall
    and a new signature is released by the Snort community to detect an attack that
    exploits this vulnerability. By using fsnort with the --snort-sid option, we can
    quickly deploy a policy to log and drop malicious packets that are associated
    with this attack.


    --include-type type This instructs fsnort to translate only Snort rules that are
    contained within a single rules file. For example, translate the rules from the
    backdoor.rules file, one would use --include-type backdoor on the fsnort command
    line. A comma-separated list of types is also supported, such as --include-type
    ftp,mysql.


    --ipt-list list This option displays all active rules in the various fsnort chains.
    This includes FSNORT_INPUT, FSNORT_INPUT_ESTAB, FSNORT_OUTPUT, FSNORT_OUTPUT_ESTAB,
    FSNORT_FORWARD, and FSNORT_FORWARD_ESTAB.


    --ipt-flush This option clears all rules in the fsnort chains. This is useful
    for quickly removing fsnort rules without removing other iptables rules associated
    with an existing policy.


    --no-addresses This option forces fsnort to not reference IP addresses associated
    with its interfaces on the firewall. This option is most useful if fsnort is deployed
    on a bridging firewall that has no IP addresses assigned to its interfaces.


    --no-ipt-sync This option instructs fsnort to disable all compatibility checks
    that are normally run against the local iptables policy. The resulting policy
    will not skip any rules that detect traffic that the firewall is configured to
    not accept in the first place.


    --restrict-intf int This option restricts fsnort to the specified interface (or
    interfaces). By default, fsnort does not inspect traffic over the loopback interface
    but inspects traffic on all other interfaces. To have fsnort inspect traffic over,
    say, the eth0 and eth1 interfaces only, you would use --restrict-intf eth0,eth1.'
