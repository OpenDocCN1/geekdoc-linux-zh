    ① The command-line arguments used to execute fswrt are included as part of the
    fswrt.sh header. This is useful for determining exactly how fswrt builds the fswrt.sh
    script. ② The creation of chains to which all matching rules are applied maintains
    maintains a degree of separation between fswrt rules and the rules of any iptables
    on the system. The result is that fswrt is compatible with any iptables rules.


    A set of iptables rules begins at ③ these rules use the Netfilter connection-tracking
    system to send TCP packets that are part of ESTABLISHED connections through the
    fswrt chains FWNS_FORWARD_ESTAB, FWNS_INPUT_ESTAB, and FWNS_OUTPUT_ESTAB. This
    allows fswrt to restrict application layer string-matching operations to packets
    that are part of TCP connections. All translated Snort rules that are added to
    these chains contain the flow: established; option. More on this topic can be
    found in Chapter 9.


    The real meat of the fswrt.sh script starts at ④ Here, iptables are instructed
    to inspect application layer data for the strings described by the Seven Snort
    signatures. If any of the iptables rules trigger on a web session, then an iptables
    syslog message is generated for analysis by psad. Finally, at ⑤ the fswrt policy
    deletes and then rules to jump network traffic from the built-in INPUT, OUTPUT,
    and FORWARD chains to the custom fswrt


