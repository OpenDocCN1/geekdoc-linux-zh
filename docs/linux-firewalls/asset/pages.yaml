    # SPA as Asymmetric Encryption


    The problem of key exchange is a central one in the field of cryptography and
    the novel solution provided by public cryptosystems distinguishes itself. In contrast
    to symmetric ciphers where the key must be shared between two parties in the clear
    over an insecure channel, asymmetric ciphers rely on a system whereby people actively
    publish the public portion of a public/private pair. For example, person A encrypts
    data with person B''s public key, person B, and only person B, can decrypt the
    ciphertext by combining the public and private key via an operation that breaks
    the lock on the data. This is built from a mathematical puzzle that is computationally
    expensive to solve without access to the public and private keys.


    # GnuPG Key Exchange for fknop


    In order to use GnuPG keys within fknop, you must create and import the server''s
    public key into the client''s key ring, and vice versa. Because the decryption
    password for the client''s key is never stored in a file, it is safe to use any
    GnuPG key with the fknop client. However, for this discussion, I''ll generate
    new client and server keys and import them as (some of the output has been removed
    for brevity).


    > Transmitting keys over an insecure medium is an abstract notion that includes
    things like the shared key down a piece of paper and mailing it between the parties.


    > The puzzle is usually derived from a classic computational problem such as integer
    factorization of products of two large prime numbers, or computing discrete logarithms
    over a cyclic group. The latter method is used by the ElGamal cryptystem in GnuPG;
    see http://en.wikipedia.org/ElGamal_encryption for a brief overview.


