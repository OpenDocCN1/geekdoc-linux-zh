    log at /var/log/psad/install.log. When psad runs, its main operational directory
    (where it keeps track of IP addresses associated with suspicious network traffic)
    is /var/log/psad.


    The directories where psad installs itself are not randomly selected—they are
    placed within standard directories that are defined within a document called the
    Filesystem Hierarchy Standard (FHS). This document codifies the purpose that each
    directory within a Unix filesystem structure is supposed to have. Any application
    that uses this document makes predictable the use of a Linux directory structure,
    helping to maintain some semblance of order in a forest of directories and files.
    The FHS can be found at http://www.pathname.com/fhs.


    # psad Administration


    Once you''ve installed psad, it''s time to fire it up. This section gives an overview
    of basic psad administration and shows how psad acquires data from iptables. Run-time
    activities such as attack detection and passive OS fingerprinting are discussed
    in the next two chapters.


    # Starting psad


    Initialization scripts bundled with psad are suitable for Red Hat, Fedora, Slackware,
    Debian, and Gentoo Linux systems. With many system daemons (such as syslog and
    Apache), psad should normally be started and stopped via the init script:


    ```

    # /etc/init.d/psad start

    * Starting psad ... [ ok ]

    * /etc/init.d/psad stop

    * Stopping psadwatchd ... [ ok ]

    * Stopping kmsgsd ... [ ok ]

    * Stopping psad ... [ ok ]

    ```


    A named pipe is a special class of file that allows two processes to communicate.
    The mechanism is similar to connecting the STDOUT of one process to the STDIN
    of another process with a pipe (|) character (e.g., cat /etc/hosts|grep localhost),
    but a named pipe exists persistently within the filesystem.


    Introducing psad: The Port Scan Attacker 85'
