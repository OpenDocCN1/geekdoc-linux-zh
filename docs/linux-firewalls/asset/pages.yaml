  md: '# TCP SYN or Half-Open Scans


    A SYN or half-open scan is similar to a connect() scan in that the scanner sends
    a SYN packet to each TCP port in effort to elicit a SYN/ACK or RST/ACK response
    that will show if the targeted port is open or closed. However, the scanning system
    never completes the three-way handshake because fails to return the ACK packet
    to any open port that responds with a SYN/ACK. Therefore, a SYN scan is also known
    as a half-open scan because three-way handshakes are never given a chance to gracefully
    complete, as depicted in Figure 3-5.


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_77_0.png)


    Figure 3-5: Half-open scan


    A SYN scan cannot be accomplished with the connect() system call because that
    invokes the vanilla TCP stack code, which will respond with an ACK for each SYN/ACK
    received from the target. However, every SYN packet in a SYN scan must be crafted
    by a mechanism that bypasses the TCP stack altogether. This is commonly accomplished
    by using a raw socket to build a data structure that mimics a SYN packet when
    placed on the wire by the OS kernel.


    # RAW SOCKETS AND UNSOLICITED SYN/ACKS


    Using a raw socket to craft a TCP SYN packet toward a remote system instead of
    using the connect() system call brings up an interesting issue. If the remote
    responds with a SYN/ACK, then the local TCP stack on the scanning system receives
    the SYN/ACK, the outbound SYN packet did not come from the local stack (because
    we manually crafted it the raw socket), so the SYN/ACK is not part of a legitimate
    TCP handshake as far as the scanner knows. However, the scanner''s local stack
    sends a RST back to the target system, because the SYN/ACK appears to be unsolicited.
    You can stop this behavior on the scanning system by adding the following iptables
    to the OUTPUT chain before starting a scan with the command:


    ```

    [ext_scanner] # iptables -I OUTPUT 1 -d target -p tcp --flags RST RST -DROP

    ```


    Nmap uses a raw socket to manually build the TCP SYN packets used within its SYN
    scan mode (-S), the default scan mode for privileged users. The characteristics
    of these packets are determined by Nmap directly (without the use of the local
    TCP stack), they differ significantly from TCP SYN packets that would normally
    have generated. For example, if we initiate a web session to http://www.google.com
    with a web browser and tcpdump to display the SYN packet from our local Linux
    TCP stack, we see the following.'
