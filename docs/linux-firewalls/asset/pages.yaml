- img_proc: true
  md: 'Netfilter subsystems in the kernel are not immune to the occasional vulnerability.
    For example, a vulnerability was discovered in the code that handles TCP options
    in the Netfilter logging system (see http://www.netfilter.org/security/2004-06-30-2.6-tcpoption.html).
    If the logging subsystem was compiled as a module, the kernel can be protected
    by sacrificing the ability of iptables to create log messages by unloading the
    module, which seems like a good trade-off.


    On the other hand, if a vulnerability is discovered within the code that implements
    a feature and the code is compiled directly into the kernel, the only way to fix
    the vulnerability is to apply a patch, and then reboot the entire system into
    the new (fixed) kernel. For mission-critical systems (such as a corporate DNS
    server), this may not be feasible until an outage window is scheduled, and in
    the meantime the system may be vulnerable to a kernel-level compromise.


    # ROOTKIT COMPILING


    The story does not end here, however. A kernel with loadable module support opens
    a sinister possibility. If an attacker compromises the system, having module support
    in the kernel makes it easier for the attacker to install a kernel-level rootkit.
    Once the kernel is compromised, all sorts of mischief can be levied against the
    system.


    Compromising the kernel itself represents the crown jewel of all compromises;
    filesystem integrity checkers such as Tripwire can be fooled, processes can be
    hidden, and network connections can be shielded from the view of tools like netstat
    and from packet sniffers (executed location). Simply compiling the kernel without
    module support is not a foolproof solution, however, since not all kernel-level
    rootkits require the host to offer module support. For example, the SucKit rootkit
    can load into a running kernel by directly manipulating kernel memory through
    a /dev/mem device. The SucKit rootkit was introduced to the security community
    in the Phrack magazine article "Linux-on-the-fly patching with LKM" (see http://).


    > Character device is an interface to the kernel that can be accessed as a stream
    of bytes instead of just by discrete block sizes, in the case of a block device.
    Examples of character devices use /dev/console and the serial port device files,
    such as /dev/ttyS.


    The power of module loading and unloading provides a degree of flexibility that
    is attractive, so this is the strategy I chose here. When making your choice,
    be sure to consider the trade-offs.


    # Security and Minimal Compilation


    Regardless of the strategy you choose for compiling Netfilter subsystems—whether
    as LKM’s or directly into the kernel—an ordering fact in fact that complexity
    breeds insecurity; more complex systems are harder to secure. Fortunately, iptables
    is highly configurable both in terms of the run-time rules used to describe how
    to process and filter network traffic and also in terms of the categories of supported
    features controlled the kernel compilation options.'
