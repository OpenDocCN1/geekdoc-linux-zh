  md: "Continuing with the development of the iptables shell script, after the preamble,\
    \ we use the following commands to set up the INPUT chain.\n\n###### INPUT chain\
    \ ######\necho \"[+\\] Setting up INPUT chain...\"\n###### state tracking rules\n\
    \n+   - IPTABLES -A INPUT -m --state INVALID -j LOG --log-prefix \"DROP INVALID\
    \ \" \n--log-options -p --log-tcp\n- IPTABLES -A INPUT -m --state INVALID -j DROP\n\
    - IPTABLES -A INPUT -m --state ESTABLISHED,RELATED -j ACCEPT\n\n# ### anti-spoofing\
    \ rules\n\n+   - IPTABLES -A INPUT -i eth -s $INT_NET -j LOG --log-prefix \"SPOOFED\
    \ PKT \" \n- IPTABLES -A INPUT -i eth -s $INT_NET -j DROP\n\n# ### ACCEPT rules\n\
    \n+   - IPTABLES -A INPUT -i eth -p tcp -s $INT_NET --dport 22 --syn -m state\n\
    -state NEW -j ACCEPT\n- IPTABLES -A INPUT -i icmp --icmp-type echo-request -j\
    \ ACCEPT\n\n# ### default INPUT LOG rule\n\n+   - IPTABLES -A INPUT -i lo -j LOG\
    \ --log-prefix \"DROP \" \n--log-tcp-options\n\nRecall that our policy requirements\
    \ mandate that iptables fully tracks connections: packets that do not match a\
    \ valid state should be logged and dropped early. This is accomplished by the\
    \ three iptables commands beginning at above; you will see a set of three commands\
    \ for the OUTPUT and FORWARD chains as well. The state match is used by each of\
    \ these rules, using the criteria of INVALID, ESTABLISHED, or RELATED. INVALID\
    \ applies to packets that cannot be identified as belonging to any existing connection—for\
    \ example, a TCP FIN packet that arrives out of blue (i.e., it is not part of\
    \ any TCP session) would match the INVALID state. The ESTABLISHED state triggers\
    \ on packets only after the Netfilter tracking subsystem has seen packets in both\
    \ directions (as acknowledged packets in a TCP connection through which data is\
    \ being exchanged). The RELATED state describes packets that are starting a new\
    \ \"connection\" in the Netfilter connection-tracking subsystem, but this is associated\
    \ with an existing one—for example, an ICMP Port unreachable message that is returned\
    \ after a packet is sent to a UDP socket where no server is bound. Anti-spoofing\
    \ rules are added at so that packets that originate from the internal network\
    \ must have a source within the 192.168.10.0/24 subnet. At are two ACCEPT rules\
    \ for SSH connections from the internal network, and ICMP Echo Requests are accepted\
    \ from any source. The rule that accepts SSH connections uses the state match\
    \ with a state of NEW together with the iptables --syn command-argument. This\
    \ only matches on TCP packets with FIN, RST, and ACK flags zeroed-out and the\
    \ SYN flag set, and then if the NEW state is matched (which means that the packet\
    \ is starting a new connection, as far as the connection-tracking subsystem is\
    \ concerned).\n\n> Here connection is the tracking mechanism that Netfilter uses\
    \ to categorize packets.\n\nCare and Feeding of iptables\\ 23"
