    not conform to the local security policy and may be malicious. For the UDP scan
    above, once the number of UDP packets sent by the scanner exceeds the DANGER_LEVEL1
    value and the scanned ports exceeds the PORT_RANGE_SCAN_THRESHOLD value, psad
