  md: '# TCP FIN, XMAS, and NULL scans


    The FIN, XMAS, NULL scans operate on the principle that TCP (that adheres to the
    RFC) should respond in a particular way if a surprise TCP packet does not set
    the SYN, ACK, or RST bits is received on a port. If the port is closed, then TCP
    responds with RST/ACK, but if the port is open, TCP does not respond with any
    packet at.


    The following example shows a FIN scan of the iptablesfw system, and note at that
    all ports are reported as open|filtered by Nmap. A surprise FIN packet is not
    part of any legitimate TCP connection, all of the FIN packets (even those to open
    ports) are matched against the INVALID state in the rules policy and subsequently
    logged and dropped. (See the DROP INVALID log ② and the FIN flag set at ③.)


    ```

    ### [scanner]# nmap -PO -so 71.157.X.X

    Starting Nmap 4.01 (http://www.insecure.org/nmap/ ) on 2007-07-03 00:33 EDT

    1672 scans on 71.157.X.X are: filtered

    Nmap finished: 1 IP address (1 host) scanned in 36.199 seconds


    iptablesfw# grep /var/log/messages | tail -n 1

    Jul 03 00:34:17 iptablesfw kernel: DROP INVALID IN=eth OUT=

    MAC=00:13:d3:38:b6:e4:00:30:48:0e:47:38:00 SRC=142.202.X.X DST=71.157.X.X

    LEN=40 TOS=00 PREC=000 TTL=54 ID=51322 PROTO=TCP SPT=60097 DPI=1437

    WINDOW=3072 RES=000 FIN URG=0

    ```


    # TCP ACK scans


    The TCP ACK scan (Nmap -sa) sends a TCP ACK packet to each scanned port and looks
    for RST packets (no RST/ACK packets, in both open and closed ports). If no RST
    packet is returned by a target port, then Nmap infers the port is filtered, as
    shown in the example ACK scan against the iptablesfw system below ①


    The goal of the ACK scan is not to determine whether a port is open or closed,
    but whether a port is filtered by a stateful firewall. Because the iptables firewall
    uses the Netfilter connection tracking subsystem (the state machine), no surprise
    ACK packets make it into the TCP stack on the iptablesfw system. Therefore, as
    here, no RST packets are returned to the scanner (note the ACK flag set at ②)


    ```

    ### [scanner]# nmap -PO -so 71.157.X.X

    Starting Nmap 4.01 (http://www.insecure.org/nmap/ ) on 2007-07-03 00:36 EDT

    1672 scans on 71.157.X.X are: filtered

    Nmap finished: 1 IP address (1 host) scanned in 36.191 seconds

