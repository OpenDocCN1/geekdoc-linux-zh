    # # Layer Attack Definitions


    We describe an application layer attack as an effort to soviet an application,
    an user, or data managed by an application for purposes other than sanctioned
    by the application owner or administrator. Application layer attacks do not usually
    depending on leveraging techniques at lower layers (such as IP spoofing or TCP
    splicing) are sometimes used to change the way application layer attacks are delivered
    to the target.


    Application layer attacks are often made possible because programmers are under
    pressure to release code under strict deadlines, and not enough time is left for
    rooting out bugs that result in security vulnerabilities.


    > *Technically we don''t need to spawn a UDP server here without establishing
