  md: '# Integrating with Swatch


    The Swatch utility (http://swatch.sourceforge.net), written by Todd Atkins, allows
    Perl expressions to be applied to arbitrary logfiles. Swatch can be monitor all
    sorts of log messages that are reported via syslog. Probably one of the most common
    applications of Swatch is to look for authentication failures reported by an SSH
    daemon via syslog, as shown here:


    ```

    Mar 01:20:20 iptablesfw sshd[31403]: error: PAM: Authentication failure for root
    from 192.168.10.3

    ```


    Now, we configure Swatch to execute psad with the appropriate command line arguments
    to block your IP address that commits the authentication failure. This implies
    that we need a regular expression that uses a back reference to pull the IP address
    out of such a syslog message and use the contents of the back reference in the
    psad command. The two boldface lines in the Swatch configuration file accomplish
    this:


    ```

    #

    # Swatch -> psad active response for SSH bad logins

    watchfor /sshd\*Authentication\*failure.*([0-2]?\d{1,2})\.[0-2]?\d{1,2}\\)/ echo
    mode-read

    exec "/usr/sbin/psad --block-ip $1"

    ```


    With Swatch configured for your liking, we''ll fire it up from the command line.
    The following code list shows how it reacts to the authentication failure message:


    ```

    [iptablesfw]# .swatch --config-file swatchrc.sshuat --tail-file /var/log/auth.log

    ```


    ```

    *** swatch version 3.1.1 (pid:3543) started at Tue Mar 6 01:34:00 EST 2007

    ```


    ```

    Mar 01:55:20 iptablesfw sshd[31403]: error: PAM: Authentication failure for root
    from 192.168.10.3

    Can''t ignore CHLD, forcing to default.

    [+] Writing 192.168.10.3 to socket. psad will add the IP address within 5 seconds.

    ```


    The running psad daemon dutifully writes the following syslog message:


    ```

    Mar 01:55:25 sshdhost psad: added iptables auto-block against 192.168.10.3 for
    300 seconds

    ```


    This example illustrates how the response features in psad can be used to block
    an IP address based on authentication failures against OpenSSH. These failures
    are most likely not detectable with an IDS that is not privy the'
