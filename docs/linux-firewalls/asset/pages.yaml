    # SQL Injection Attacks


    SQL injection attacks exploit a condition in an application where input is not
    validated or filtered correctly before it is included within a database query.
    A clever attacker can use the nesting of the SQL language to build a new query
    and potentially modify or extract information from the database. Common targets
    of SQL injection attacks are CGI applications that are executed via a webserver
    and interface to a backend database.


    For example, suppose that a CGI application performs a username and password check
    against data in a database using a username and password supplied by a web client
    via the CGI script. If the username and password are not properly filtered, the
    query used to perform the verification could be vulnerable to an injection attack.
    This attack could change the query so it would not only check for equality, but
    also modify data with a new query. The attacker could use this in way to set a
    password for an arbitrary user; perhaps even an administrator-level password.


    It is difficult to detect a generic SQL injection, but some Snort rules come fairly
    for certain attacks. For example, here a Bleeding signature detects when an attacker
    attempts to truncate of an SQL query by supplying a single quote at ① with two
    characters at ② (along with NULL bytes following each). The comment out the remainder
    of the SQL query, and this can be used to remove restrictions that may have been
    placed on the query through additional joins over other fields.


    ```

    alert tcp $EXTERNAL_NET any -> $SQL_SERVERS 1433 (msg:"BLEEDING-EDGE

    EXPLOIT MS-SQL SQL injection string plus line comment"; flow:

