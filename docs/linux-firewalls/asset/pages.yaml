    # Concluding Thoughts


    The Snort community has lit the path toward an effective language for detecting
    network attacks, and so it is logical for fwsnort to use the Snort signature set
    as its source of attack descriptions. But, iptables is a firewall, and firewalls
    are all about control. Consider the scenario where a vulnerability is found within
    a piece of mission-critical server software that you are running on a Linux system.
    Until an outage window can be scheduled for this to be patched, the system is
    vulnerable to attack. By leveraging the power of the Snort community, once a signature
    is developed and released, fwsnort can tell your Linux kernel how to discard packets
    that appear to exploit the vulnerability before they can do any harm.


    Although fwsnort can build iptables rulesets to discard packets, such a response
    does not dynamically implement persistent blocking rules against malicious IP
    addresses—a userland process is needed for this. We’ll see in Chapter 11 that
    fwsnort combined with psad can build time-out-based blocking rules for application
    layer attacks.'
