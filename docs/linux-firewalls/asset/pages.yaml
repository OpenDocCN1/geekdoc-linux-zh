  md: '# DDoS Attacks


    A DDoS attack at the network layer utilizes many systems (potentially thousands)
    to simultaneously flood packets at target IP addresses. The goal of such an attack
    is to chew as much bandwidth on the target network as possible with garbage data
    in order to edge out legitimate communications. DDoS attacks are among the most
    dangerous network layer attacks to combat because so many systems are connected
    via broadband to the Internet. If an attacker secures several systems with fast
    Internet connections, it is possible to mount a damaging DDoS attack against most
    sites.


    Because the individual packets created by a DDoS attack can be spoofed, it is
    generally futile to assign any value to the source IP address of such packets
    by the time the packet reaches the victim.


    For example, comparing to the signature rules (discussed in later chapters), the
    Stacheldraid DDoS agent see (http://staff.washington.edu/dittrich) spoof ICMP
    packets from the IP address 3.3.3.3. If you see packets the source IP address
    set to 3.3.3.3 and the destination IP to an external address, you know that a
    system on your local network has become a Stacheldraid zombie. A packet sent from
    Stacheldraid would look similar to the following when logged by iptables. The
    source IP 3.3.3.3 and the ICMP type of 8, and the ICMP ID of 66 coming from Snort
    rule ID 224:


    ```

    Jul 24 01:44:04 iptables kernel: SPOOFED PKT IN=eth0 OUT=

    MAC=00:13:d8:b3:86:e4:0:46:c2:60:44:08:00 SRC=3.3.3.3 DST=71.157.-X.X

    LEN=80 TYPE=0 PREQ=0 TLL=63 Id=0 DF PROTO=ICMP

    TYPE=0 CODE=0 ID=66 Seq=1

    ```


    In general, it is more effective to detect the control communications associated
    with DDoS agents than themselves. For example, detecting commands from control
    nodes to zombies over obscure points is a good strategy (several signatures in
    the Snort ruleset for communications of this type—see the dos.rules in the Snort
    signature set). This can also yield results when removing DDoS agents from a network,
    because control communications can help point the way to the infected systems.


    # Linux Kernel IGMP Attack


    A good example of an attack against the code responsible for processing network
    layer communications is an exploit for a specific vulnerability in the Internet
    Group Management Protocol (IGMP) handling code in the Linux kernel. Kernel versions
    from 2.4.2–2.48, and 2.6.29 are vulnerable and can be exploited both remotely
    and by local users (some security vulnerabilities are only locally exploitable,
    so this is a nasty bug). A successful exploit over the network from a remote source
    could result in a kernel crash, as discussed in more detail at http://isec.pl/vulnerabilities/isec-0018-igmp.txt.
    Kernel code sometimes contains security bugs, and these bugs can exist all the
    way down to the network layer processing code or within device drivers.'
  merge: -1
