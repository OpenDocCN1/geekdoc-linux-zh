  md: 'For example, the Snort rule to detect an Nmap OS fingerprint attempts uses
    the flags option to search for the Syn, Fin, Push, and Urg flags in the TCP-header.
    The equivalent arguments to the iptables binary are -p tcp --tcp-flags SYN,FIN,PSH,URG
    SYN. The --tcp-flags command-line requires two arguments: a list of the flags
    that should be inspected, followed by a list of those flags that must be set.
    This allows the first argument to act as a mask for the set flags that must be
    examined.


    No special kernel configuration option is required to make use of the --tcp-flags
    option, because it is built into the core TCP-handling code within iptables. The
    following example illustrates an iptables rule that detects when a TCP packet
    has both the SYN and FIN flags:


    ```

    [iptablesfw]# iptables -A INPUT -p tcp --tcp-flags ALL SYN,FIN -j LOG

    --prefix "SCAN SYN FIN "

    ```


    # itype and code


    Both the itype and code options match specified numeric values within the 8-bit
