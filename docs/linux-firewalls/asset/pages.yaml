    # NOTE


    Because Gplot works best with integer data, psad maps all IP addresses to unique
    positive integers (starting from 0) as it parses an iptables log. Thus, IP address
    192.168.3.2 get mapped to a number like 502, and 11.71.92 get mapped to 10210,
    depending on the number of unique addresses in the logfile. Each line in the Gplot
    data file, IP addresses are always included at the end of the line as a trailing
    comma. This enables you to see which integer address maps to.


    The fig 14-3.dat file produced by psad contains the following three data points
    at the top of the file:


    ```

