    be combined. After all, fsnort is great at detecting and stopping a specific attack
    contained within a TCP session, but without psad to manage a persistent blocking
    rule, the attacker is free to try any exploit against the same target. The act
    of detecting the first attempt might be regarded as fairly lucky; a subsequent
    attempt may not necessarily be detected at all, so a persistent blocking rule
    could be important. This is especially true if the attacker possesses an additional
    exploit for a vulnerability that is unrelated to the first attack and for which
