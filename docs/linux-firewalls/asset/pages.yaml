    # Encrypted Port-Knocking Sequences


    Port-knocking sequences can be encrypted with a symmetric cipher, such as the
    Rijndael cipher chosen for the US Advanced Encryption Standard by the National
    Institutes of Standards and Technology (NIST). This introduces a strong cryptographic
    layer to port-knocking sequences at the slight expense of the obligatory associated
    management.


    It is advantageous to encode as much information as possible into an encrypted
    port-knocking sequence in order to shield it from trying eyes. At a minimum, the
    source IP address that should be allowed access through the packet filter, with
    the protocol and port number, all should be encoded within the encrypted payload,
    and should note the following:


    +   - An IP address is a 32-bit unsigned integer, with four 8-bit values—for example,
    187.23.1.4.

    - An IP number is a single 8-bit value—for example, 1 (ICMP), 6 (TCP), or 17 (UDP).

    - A port is a 16-bit unsigned short integer, which can be represented as two 8-bit
    values—for example, 6000 = (0x17 << 8) | 0


    To represent the IP address, protocol, and port number in order, we need seven
    bytes of information. If we want the port-knocking server to grant access to TCP
    port 22 for the IP address 207.44.10.34, we need to encrypt the bytes 6, 22, 27,
    44, 10, and 34, or 0x06, 0x16, 0x1b, 0x2c, 0x0a, and 0x22.


    Because the Rijndael cipher has a minimum block size of 16 bytes, we have to fill
    the remaining nine bytes. Let''s use eight bytes for a username and one by a kind
    of minimal checksum value. For the username, I will use my mbr username, or its
    equivalent in hex bytes: 0x6d, 0x62, 0x72 (padded with five zeros for our needs).


    Finally, we calculate the checksum as the sum of all values 256:


    ```

    (0x06 + 0x16 + 0xcf + 0x2c + 0x22 + 0x6d + 0x62 + 0x72) % 256 = 096

    ```'
