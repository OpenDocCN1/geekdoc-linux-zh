  md: '# Installing the iptables Userland Binaries


    Having installed and booted into a kernel that has Netfilter hooks compiled in,
    we will now install the latest version of the iptables userland program. To do
    so, first download and unpack the latest iptables sources in the /usr/local/src
    directory, and then check the MD5 sum² against the published value at http://www.netfilter.org:


    ```

    $ cd /usr/local/src/

    $ wget http://www.netfilter.org/projects/iptables/files/iptables-1.3.7.tar.bz2

    $ md5sum 1.3.7.tar.bz2

    d965bdacbb8c2ea649829fddda67 iptables-1.3.7.tar.bz2

    $ tar xjf iptables-1.3.7.tar.bz2

    $ cd iptables-1.3.7

    ```


    For the compilation and installation steps of the iptables binary, recall that
    we compiled the kernel within the directory /usr/src/linux-2.6.20.1; compiling
    iptables requires access to the kernel source code because it compiles against
    C header files in directories such as /linux/netfilter-ipv4 in the kernel source
    tree. We''ll use the /usr/src/linux-2.6.20.1 directory to define the KERNEL_DIR
    variable on the command line, and the BINDIR and LIBDIR variables allow us to
    control the paths where the iptables binary and libraries are installed. You can
    compile and install iptables as follows:


    ```

    $ KERNEL_DIR=/usr/src/linux-2.6.20.1 BINDIR=/sbin LIBDIR=/lib

    $ -

    Password:

    $ cd /usr/local/src/iptables-1.3.7

    $ make install KERNEL_DIR=/usr/src/linux-2.6.20.1 BINDIR=/sbin LIBDIR=/lib

    ```


    For the final proof that we have installed iptables and that it can interact with
    the running 2.6.20.1 kernel, we will issue commands to display the iptables version
    number and the INPUT, OUTPUT, FORWARD chains (which at this point contain no active
    rules):


    ```

    # iptables

    /sbin/iptables

    # iptables -V

    iptables v1.3.7

    # iptables -nL

    Chain INPUT (policy ACCEPT)

    target     prot source

    ```


    ```

    Chain FORWARD (policy ACCEPT)

