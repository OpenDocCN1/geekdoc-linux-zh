    Many people have old syslog files that contain iptables log data lying around
    their systems. By using psad in forensics mode, these old logfiles can be used
    to inform you of suspicious traffic that took place in the past against your system.
    This information can be particularly helpful if you are trying to track down a
    real intrusion and see what IP addresses have been your system around the time
    of a compromise. To run in forensics mode, use the -A command-line switch as shown
    in bold in Listing 7-2 (some output has abbreviated):


    ```

    [iptablesfw]# psad -A

    [+] Entering analysis mode. Parsing /var/log/messages

