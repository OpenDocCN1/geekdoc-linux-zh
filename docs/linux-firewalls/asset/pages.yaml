    # CHECK_INTERVAL


    Most of psad''s time is spent sleeping; it only wakes up to see if new iptables
    log messages have appeared in the /var/log/psad/fwdata. The interval between successive
    checks is defined in the CHECK_INTERVAL variable; the default is five seconds.
    This interval can be set as low as second, but it is not usually necessary to
    do so unless you want alerts generated as quickly as possible.


    # SCAN_TIMEOUT


    By default, the SCAN_TIMEOUT variable is set to 3,600 seconds (one hour), and
    psad uses this as the time interval over which a scan is tracked. That is, if
    malicious traffic from a particular IP address does not reach a danger level of
    one within this period, psad will not generate an alert. The SCAN_TIMEOUT variable
    is effectively enabled by setting ENABLE_PERSISTENCE to Y (see below).


    # ENABLE_PERSISTENCE


    Port scan detection software generally sets two thresholds in order to catch a
    scan: the number of ports probed and the time interval. An attacker can attempt
    to slip beneath these by reducing the number of scanned ports or slowing down
    the scan. The ENABLE_PERSISTENCE variable instructs psad not to use the SCAN_TIMEOUT
    variable as a factor in detection. This is useful to thwart attacks by a scanner
    to slip beneath the timeout by slowly scanning a target system over days or weeks.
    As a scan involves at least the number of packets defined by the DANGER_LEVEL1
    (regardless of how long the scan takes to send this number of packets), an alert
    is sent by psad.


