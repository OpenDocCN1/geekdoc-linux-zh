  md: '# Alerts and Reporting with psad


    Once psad determines that a suspicious event or series of events has taken place
    against iptables, it alerts the administrator. Its goal is to provide as much
    information as possible so that he or she can determine the proper response. By
    default, psad generates both email and syslog alerts, as you''ll see in the examples
    in this section.


    # psad Email Alerts


    Email is psad''s primary alerting mechanism, because an email message can include
    more information than a syslog alert, and because email is ubiquitous and well-integrated
    with cell phones and other handheld devices. There is nearly always an easy way
    to check email.


    The following is an example of a typical psad email alert. This particular alert
    is sent after psad detects a TCP connect() scan from the int_scanner system in
    Figure 6-1. (We''ll walk through the entire alert in the next sections because
    this is the first example in the book.) The complete psad alert discussed in the
    next sections can be downloaded from http://www.cipherduty.org/LinuxFirewalls.


    # Scan Danger Level, Ports, and Flags


    The first bits of information included in a psad alert are the danger level assigned
    to the source address, the scanned ports, and the flags set (for TCP scans). In
    the snippet of the psad alert below, the danger level is set to 4 because the
    number of packets and range of ports involved in the scan exceeds the default
    values of 1,500 and 1 required by the DANGER_LEVEL4 and PORT_RANGE_THRESHOLD variables,
    respectively, in the /etc/psad.conf file. In addition, if the source IP address
    is not included within the /etc/psad/_auto file, psad does not automatically assign
    a danger level to the source IP address. The scan does not trigger any signatures
    that have a danger level higher than 4, and we are left with a danger level that
    is determined only on the packet count and range of scanned ports.


    Next, see that the minimum TCP port number is 1, and the maximum is 61,440. Not
    every port within this range is scanned because that would require at least 61,440
    SYN packets without retransmissions (which would happen in this case because we
    are using a connect() scan). By default, if Nmap is not explicitly given a range
    of ports to scan, it scans for set of interesting ports that are derived from
    the nmap-services file with the Nmap sources, and we see that only the SYN flag
    is set in this scan. From the perspective of iptables, the flags imply that either
    the -sT or -s5 command-line arguments were given by Nmap. Finally, logging prefixes
    are displayed, and in this example, each of the packets from the scan is logged
    by iptables with a prefix of DROP.


    > This does not necessarily mean any kind of automated response. As the administrator
    of a system that is being scanned and probed, you might want to manually pick
    up the telephone and talk to the upstream provider of the offending IP address.'
  merge: -1
