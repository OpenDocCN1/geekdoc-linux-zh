    # /etc/fwknop/fwknop.conf


    The fwknop conf defines critical configuration variables such as the authentication
    mode, the firewall type, the interface to sniff packets, whether packets should
    be sniffed promiscuously (i.e., whether or not fwknop processes Ethernet frames
    that are not destined for the MAC address of the local interface), and the email
    address(es) to which alerts are sent.


    # AUTH_MODE


    The AUTH_MODE variable tells the fwknop daemon how to collect packet data. Several
    methods are supported, including sniffing packets from a live interface via the
    Net::cap Perl module, reading PCAP-formatted packets from a file in the filesystem
    that is written by ulogd (see http://www.netfilter.org), using a separate Ethernet
    sniffer as tcpdump, or parsing iptables logs from the file /var/log/fwknop/fwdata.
    Possible values for the AUTH_MODE are PCAP, FILE_PCAP, ULOG, PCAP, and KNOCK;


    | AUTH_MODE | PCAP; |


