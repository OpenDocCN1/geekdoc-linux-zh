    ```


    # MAX_SPA_PACKET_AGE


    The MAX_SPA_PACKET_AGE variable defines the maximum age, in seconds, for which
    the fknop server will allow an SPA packet to be accepted. The default is two minutes.
    This variable is only used if ENABLE_SPA_PACKET_AGING is enabled.


    ```

    MAX_SPA_PACKET_AGE 120;

