  md: '# CONCEALING AN ATTACK WITH FRAGMENTS AND TARGETED TTL


    Routing path information is useful for concealing network attacks with fragment
    reassembly tricks. For example, suppose that an attacker sees a router exists
    in front of a host (as determined with traceroute), and the attacker suspects
    an IDS is watching the subnet. If this is the case, the host can be targeted with
    an attack that is fragmented over three packets (let''s call them F1, F2, and
    F3), but in a way that the attack is not detected by the IDS. The attacker can
    accomplish this by manipulating the TTL of the second fragment (F2), replacing
    its payload with dummy data, and reducing its TTL to an initial value that is
    large enough to get the packet to the router with a TTL of one. Let''s call this
    packet F2''. Next, the attacker sends the first fragment (F1) followed by another
    F2'', followed by F3, and finally the original F2. The IDS (which is in front
    of the router) sees all fragments, but F3 completes the set of fragments and the
    IDS reassembles them as F1 + F2'' + F3. F2'' contains dummy data and these fragments
    do not look like an attack on the IDS. Meanwhile, the TTL is reduced to zero before
    it is forwarded, so the IP address never sees F2''. The IDS has seen fragments
    F1 and F3, but it can''t reassemble anything without the original F2, so it waits
    for it.


    When F2 finally arrives (the attacker sends it), the target host is hit with the
    real attack after the host finally reassembles all three fragments. This technique
    was first proposed in "Bro: A System for Detecting Intruders in Real-Time" by
    Vernon Paxson (see http://www.icir.org/papers/bro-cn99.html); it provides a clever
    way to utilize the network layer to hide attacks from intrusion detection systems.


    Another suspicious TTL value for any packet on the local subnet is a TTL of zero.
    Such a packet can only exist if there is either a buggy router that forwards the
    packet into the subnet or the packet originated from a system on the same subnet.


    # The Smurf Attack


    The Smurf attack is an old but elegant technique whereby an attacker spoofs ICMP
    Echo Requests to a broadcast address. The spoofed address is the intended target,
    and the goal is to flood the target with as many ICMP Echo Responses as possible
    from systems that respond to the Echo Requests over the broadcast address. If
    the network is functioning without controls in place these ICMP Echo Requests
    to broadcast addresses (such as the no ip directed-broadcast command on Cisco
    routers), then all hosts that receive the Echo Requests will respond to the spoofed
    source address. By using the broadcast address of a large network, the attacker
    hopes to magnify the number of packets that are generated against the target.


    The Smurf attack is outdated when compared to tools that perform DDoS attacks
    (discussed below) with dedicated control channels and for which there is no easy
    router configuration countermeasure. It is worth mentioning, that the Smurf attack
    is so easy to perform and the original source code is readily available (see http://www.phreak.org/archives/exploits/denial/smurf.c).'
  merge: -1
