    # replace


    The replace Snort option is only applicable when Snort is in inline mode and deployed
    inline to the packet path. In this mode, Snort becomes a true intrusion prevention
    system with the ability to forward packets in and out of a protected network only
    after they have been inspected by Snort''s detection engine. The replace option
    operates on application layer data and allows a sequence of bytes that have been
    detected by the content option to be replaced with a different sequence of length.


    The requirement that the strings are of equal length stems from the fact that
    sequence and acknowledgment numbers must continue to match in the context of the
    existing TCP session. If a longer string were to be substituted, the receiving
    side would receive more data than actually sent by the sender, and would break
    TCP.


    Within a Snort rule with inline running, in order to fix the string "/usr/local/bin/bash"
    replaced with "LengthString", we would use two options: content:"/usr/local/bin/bash"
    replaced; replace:LengthString!!. This type of operation is only supported by
    iptables if the --replace-string patch provided by the fswnt project has been
    applied to the string extension. This patch is only compatible with 2.4 kernels
    and takes liberties with the notion of iptables "match," since matches are not
    supposed to modify packet data; a future version of this patch will implement
    a new iptables target that will allow packet data to be modified. In the meantime,
    on your old 2.4 kernel, the following command allows iptables to replace the string
    "/bin/sh" with "/abc/de" (which would never correspond to an actual path to a
    real system) in all TCP traffic over port: 80:


    ```

    [iptablesfw]# iptables -A INPUT -p tcp --dport 80 -m string --string "/bin/sh"

    --replace-string "/abc/de" -j ACCEPT

    ```'
