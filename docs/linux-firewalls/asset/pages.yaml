    # psad Configuration


    All psad daemons reference the file psad.conf within /etc/psad, and this file
    follows a simple convention where comment lines begin with a (#) mark, and configuration
    parameters are specified in a key-value format. For example, the HOSTNAME variable
    in psad.conf defines the hostname of the system where psad is deployed:


    ```

    ### System hostname

    psad.cipherdyne.org;

    ```


    Each value for a configuration variable must be terminated with a semicolon to
    denote the end of the value string. This allows comments to be included on the
    same line after the semicolon to aid in documentation, in this example:


    ```

    WHOIS_TIMEOUT 60; ### seconds

    ```


    Finally, psad variable values may contain subvariables that are expanded as psad
    parses its configuration. For example, the main logging directory used by psad
    is defined by the PSAD_DIR variable and is set to /var/log/psad by default. Other
    configuration variables can reference the PSAD_DIR variable like so:


    ```

    STATUS_OUTPUT_FILE $PSAD_DIR/status.out;

    ```


    # /etc/psad/psad.conf


    The psad.conf file is psad''s main configuration file. It contains over 100 configuration
    variables to control various aspects of psad''s operations. In this section we
    will discuss a few of the most important configuration variables and the reasons
    they are significant.


    +   NOTE The minor configuration variables are not covered here, but comprehensive
    documentation is available at http://www.cipherdyne.org/psad/docs/index.html.'
