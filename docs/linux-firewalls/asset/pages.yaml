    # ENABLE_SPA_PACKET_AGING


    By default, the fknop daemon requires that an SPA packet sent from the fknop client
    is less than 120 seconds (two minutes), as defined by the MAX_SPA_PACKET_AGE variable
    described above. The fknop client includes a timestamp with each SPA packet (see
    "SPA Packet Format" on page 241), which the fknop server uses to determine the
    age of all SPA packets. This feature requires loose synchronization between the
    fknop client and the robust Network Time Protocol (NTP) attacker inline with an
    SPA packet to make this easy.

    If ENABLE_SPA_PACKET_AGING is disabled, an attacker could stop the packet from
    being forwarded, preventing the fknop server from seeing it and calculating its
