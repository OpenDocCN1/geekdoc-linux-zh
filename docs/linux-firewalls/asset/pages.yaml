    #  Gray Matter Hacking


    Some of the most problematic attacks on the Internet today are those that target
    people directly via the applications they use. These attacks circumvent the best
    encryption algorithms and authentication schemes by exploiting people''s tendency
    to trust certain pieces of information. For example, if an attacker gets a person
    to trust the source of certain malicious software, or bogus passwords or encryption
    keys, the attacker can bypass even the most sophisticated security mechanisms.
    It can sometimes be easier to exploit people than to find a hole in a hardened
    system, application, or encryption scheme.


    # Phishing


    Phishing is an attack where a user is tricked into providing authentication credentials
    for an online account, such as for a bank, to an unwanted source. Typically this
    is accomplished by sending an official-looking email to users requesting they
    access their online account and perform some "urgent" task in the interest of
    security, such as changing their password. (The irony here would be humorous were
    it not for the damaging effects of a successful phishing attack against a user.)
    A web link is provided that appears legitimate but is subtly crafted to point
    the user to a website controlled by the attacker that mimics the authentic website.
    Once phased users visit the site and enter their credentials, the attacker siphons
    off their credentials.


