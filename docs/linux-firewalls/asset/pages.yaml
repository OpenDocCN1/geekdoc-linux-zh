  md: '# Snort Rule Header


    For example, a Snort rule header instructs Snort to match all TCP traffic from
    any source address to port 53 on any IP address within the 192.168.10.0/24 subnet
    looks like:


    ```

    alert tcp any any -> 192.168.10.0/24 53

    ```


    From a signature perspective, this header is roughly equivalent to the following
    iptables:


    ```

    [iptablesfw] # iptables -A FORWARD -p tcp -d 192.168.10.0/24 --dport 53 -j LOG

    ```


    First, Snort supports IP, ARP, UDP, ICMP, and TCP within the rule header directly
    (behind-the-scenes support for additional protocols). Next, the address portion
    of the Snort rule header allows Snort rules to apply to specific networks or individual
    IP addresses. Networks can be specified by CIDR notation (e.g., 192.168.10.0/24)
    or in standard dotted-quad notation (e.g., 192.168.10.0/255).


    Lastly, transport layer source and destination ports are defined. A range of ports
    can be specified with the colon (:) character (e.g., 21:23) would apply to ports
    21 through 23, and port numbers can also be negated with the exclamation point
    (!) character (e.g., !80 would apply to all ports except 80).


    # SNORT HEADER WILCARDS AND VARIABLE RESOLUTION


    Any of the match criteria in the Snort rule header (with the exception of the
    protocol) can be set to the wildcard value so that Snort will not restrict its
    inspection to a particular IP address or port number. Snort also supports the
    definition of a variable whose associated value (such as a list of IP addresses
    or port numbers) is specified in the snort.conf configuration file.


    For example, many web-based rules in Snort contain the header:


    ```

    alert tcp EXTERNAL_NET -> $HTTP_SERVERS $HTTP_PORTS

    ```


    The actual definition of the $HTTP_SERVERS variable might be the list [192.168.10.5,192.168.10.6]
    in the snort.conf file.


    # Rule Actions and iptables Emulation


    Rule actions can be alert, log, pass, activate, or dynamic, though Snort rules
    generally default to alert. The alert action is important—it tells Snort to generate
    an alert and log the packet that caused the alert. The remaining actions provide
    additional functionality, such as passing the packet without taking any action
    (pass), logging the packet (log), or setting certain rules so that they remain
    dormant until a particular rule is matched, at which point they become active
    and log traffic (activate and dynamic).


    So far, everything but the activate and dynamic actions in the Snort rule header
    is supported by analogous functionality in iptables and fswort.'
