  md: '# SOURCE


    Authorization of multiple users from arbitrary IP addresses is supported by fknop;
    each user may use different encryption keys (and encryption algorithms). SOURCE
    is the main partitioning variable that allows fknop to determine the access level
    of a valid SPA packet, and each group of configuration variables within the access.conf
    file defines a complete SOURCE access definition. The access.conf file supports
    multiple SOURCE definitions. The default value for the SOURCE variable instructs
    fknop to validate a SPA packet from any source IP address as shown below, but
    individual IP addresses and CIDR networks are also supported.


    SOURCE: ANY;


    # OPEN_PORTS


    The OPEN_PORTS variable instructs fknop to grant access to the specified ports
    by reconfiguring the local iptables policy. Unless the PERMIT_CLIENT_PORTS variable
    (see below) is set to Y, the client cannot gain access to services other than
    those listed by OPEN_PORTS. The following definition allows a valid SPA packet
    to reconfigure iptables to allow access to TCP port 22 (SSHD).


    OPEN_PORTS: tcp/22;


    # PERMIT_CLIENT_PORTS


    When set to Y, this allows the fknop client to dictate to the fknop server the
    set of traffic (i.e., ports and protocols) that will be allowed through the iptables
    policy, instead of the fknop server only reconfiguring iptables to allow the traffic
    defined by the OPEN_PORTS variable. An SPA packet may contain several ports that
    the client wishes to access (see "fknop SPA Packet Format" on page 241 for more
    information).


    PERMIT_CLIENT_PORTS: Y;


    # ENABLE_CMD_EXEC


    When enabled, this variable allows authorized SPA clients to have the fknop server
    execute a command on their behalf. This feature is controversial because fknop
    (of the 1.0 release) executes these commands as root, although the ability to
    run commands as less privileged users is in development. The ENABLE_CMD_EXEC feature
    must be explicitly and deliberately enabled if you want to use it.


    ENABLE_CMD_EXEC: Y;


    # CMD_REGEX


    The CMD_REGEX variable allows you to provide a regular expression that must match
    a command supplied by a fknop client before the fknop server will'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'execute it. It only makes sense to use this variable in the context of setting
    ENABLE_CMD_EXEC to Y. For example, to limit the commands the fwknop server will
    execute on behalf of an fwknop client to the mail command, you could use the:


    ```

    CMD_REGEX: ^mail\s+-\s+\/\w+\|\s+\w+\@\w+\.com;

    ```


    # DATA_COLLECT_MODE


    The DATA_COLLECT_MODE variable accepts the same packet collection modes as the
    AUTH_MODE variable in the fwknop.conf file. This allows each SOURCE access definition
    in the access.conf file to be independently enabled or disabled, depending on
    the value of the AUTH_MODE variable. Only those SOURCE access definitions with
    a DATA_COLLECT_MODE value that matches the AUTH_MODE variable are enabled. However,
    the DATA_COLLECT_MODE variable is optional, and if it is left out of the access.conf
    file, fwknop daemon assumes that it is set to PCAP, the most common setting.


    DATA_COLLECT_MODE: PCAP;


    # REQUIRE_USERNAME


    The REQUIRE_USERNAME variable refers to the username of the user on a remote system
    that executes the fwknop client to generate a SPA packet. This username is included
    within all SPA packets (see "fwknop SPA Packet Format" on page 241 for more information).
    The remote username allows fwknop to apply authorization rules to incoming SPA
    packets. The REQUIRE_USERNAME variable supports multiple usernames, which can
    be useful if there is a site or system-wide encryption key for multiple users
    on the client side.


    REQUIRE_USERNAME: mbr,mrash;


    # FW_ACCESS_TIMEOUT


    The FW_ACCESS_TIMEOUT variable tells the fwknop server the number of seconds for
    which any ACCEPT rules should be instantiated within the FWKNOP_INPUT chain, allowing
    access to the services requested by a valid SPA packet.


    FW_ACCESS_TIMEOUT: 30;


    # KEY


    The KEY variable defines the encryption key used for decrypting SPA packets that
    have been encrypted with the Rijndael block cipher. It requires an argument that
    is at least eight characters long.


    KEY: youencryptkey;'
