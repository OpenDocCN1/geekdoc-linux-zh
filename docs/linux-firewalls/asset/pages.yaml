    # Concluding Thoughts


    Visual representations of security data quickly convey important information

    that might otherwise require more time-consuming analysis, and they can be

    boon for those of us who need to sift through mountains of data produced

    by intrusion detection systems and firewalls. It is often possible to arrive at

    interesting connections by extracting fields from security data and graphing

    those fields with simple criteria such as destination ports over time or outbound
    connections from local networks. For iptables psad provides

    t means to extract the data fields from iptables logs, and the Gnuplot and

    AfterGlow projects bring the data to life in graphical form.


    > 8 Many administrators have raw packet data in PCAP files collected from various
    points within a network. Even though psad does not yet interpret PCAP files, you
    can use a tool like tcpreplay (see http://tcppreplay.synfin.net) to send this
    packet data against an iptables firewall so that iptables can log the packet data
    for rendering by psad, Gnuplot, and AfterGlow. This idea was suggested to me in
    email correspondence with Richard Bejohn.'
