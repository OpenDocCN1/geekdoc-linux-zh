  md: 'that time. PortSentry (see http://sourceforge.net/projects/sentrytools) had
    some architectural design issues that made it unsuitable for use in conjunction
    with a firewall that had been configured in a default-drop stance.^1


    While we could have developed a more configuration tool for Snort (see http://www.snort.org),
    Jay Beale, Peter Watkins, and I decided to develop something entirely new that
    was tightly coupled with the firewall code in the Linux kernel. The result was
    the creation of a parser for Bastille called Bastille-NIDS that would analyze
