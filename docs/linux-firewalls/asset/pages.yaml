  md: '# ENABLE_AUTO_IDS


    If set to Y, this variable transforms psad from a passively monitoring daemon
    into a program that actively responds to attacks by dynamically reconfiguring
    the local iptables to block an offending IP address from interacting with the
    local system (via the INPUT and OUTPUT chains) and all systems that may be protected
    by the local system (via the FORWARD chain). Chapter 8 discusses the implications
    of this feature, as well as how to use it effectively. Several autoresponse variables
    are not discussed here but can be found in Chapter 8.


    # IMPORT_OLD_SCANS


    The information that psad collects about port scans and other suspicious activities
    is written to the /var/log/psad directory. For every IP address that reaches a
    danger level of one, a new directory /var/log/psad/ is created. Various files
    stored within this directory include the latest alert email, output, signature
    matches, danger level, and packet counters. At start, psad normally removes any
    /var/log/psad/ directories, but you can import all data from these old directories
    by setting IMPORT_OLD_SCANS to Y. This feature allows you to restart psad or reboot
    the entire system without losing data from the previous psad instance.


    # ENABLE_DSHIELD_ALERTS


    Set this variable to Y to allow psad to send scan data to the DShield intrusion
    detection system. You should be aware when you pass your scan data to DShield,
    it is no longer in your control and is passed into a relatively open database.
    DShield allows people to gain a better understanding of things such as the most
    commonly attacked services and even which IP address is currently attacking the
    most systems (that IP address is a good candidate for fairy draconian firewall
    rules). I highly recommend enabling this feature in psad, unless there is a strict
    requirement (which may be derived from a site security policy, for instance) not
    to communicate scan information specifically to DShield; the more people who enable
    this feature, the safer the Internet becomes for everyone.


    # IGNORE_PORTS


    A key feature of many intrusion detection systems is the ability to filter out
    certain pieces of data that the administrator wants the IDS to completely ignore.
    The IGNORE_PORTS variable instructs psad to ignore iptables messages based on
    the destination port and associated protocol (TCP or UDP). Port ranges and multiple
    port and protocol combinations are like so:


    ```

    IGNORE_PORTS      udp/53, udp/5000, tcp/51000-63536;

    ```


    Rather than using the IGNORE_PORTS variable, you could tune your iptables policy
    so that packets you want to ignore are matched by a rule before they hit the LOG
    rule.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# IGNORE_PROTOCOLS


    With the IGNORE_PROTOCOLS variable, psad can be instructed to ignore entire protocols.
    It is usually better to tune your iptables policy to not log protocols you wish
    to ignore in the first place, but if you wish to have psad ignore all ICMP packets,
    for example you can set IGNORE_PROTOCOLS like so:


    ```

    IGNORE_PROTOCOLS      icmp;

    ```


    # IGNORE_LOG_PREFIXES


    You''ll find that iptables policies can be quite complex and include many different
    logging rules—each potentially with its logging prefix. If you want psad to ignore
    a logging prefix (e.g., DROP:INPUT:eth1), you can set IGNORE_LOG_PREFIXES like
    this:


    ```

    IGNORE_LOG_PREFIXES      DROP:INPUT:eth1;

    ```


    # EMAIL_LIMIT


    In some circumstances an iptables policy is configured to log traffic that is
    not malicious, and this traffic may repeat over and again on a network (for example,
    DNS requests to a specific DNS server). If psad interprets such traffic as a scan,
    psad may send a lot of email alerts for the traffic because it repeats itself.
    You can force psad to impose a limit on the number of email alerts that are sent
    for scanning IP address by using the EMAIL_LIMIT variable. The default is zero,
    which means no limit is imposed, but if you set it to 50, then psad will send
    no more than 50 email alerts for a given IP address:


    ```

    EMAIL_LIMIT              50;

    ```


    # ALERTING_METHODS


    Most administrators use the email and syslog reporting modes offered by psad,
    the ALERTING_METHODS variable gives you control over whether psad generates email
    or syslog alerts. The ALERTING_METHODS variable accepts three values: noemail,
    syslog, and ALL. The noemail and syslog values instruct psad to send no email
    or no syslog alerts; these values can be combined to disable all alerting. The
    default is to generate both email and syslog alerts:


    ```

    ALERTING_METHODS         ALL;

    ```


    # FW_MSG_SEARCH


    The FW_MSG_SEARCH variable defines how psad searches iptables log messages. To
    restrict psad to analyze only those log messages that contain a specific log prefix
    (defined in an iptables rule with the --log-prefix argument to iptables), define
    the prefix with the FW_MSG_SEARCH variable. This allows it to be configured to
    assign other log prefixes to packets without having psad analyze them.'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'For example, to psad analyze only iptables log messages that contain the string
    DROP, configure the FW_MSG_SEARCH variable like so:


    ```

    FW_MSG_SEARCH               DROP;

    ```


    # /etc/psad/auto_dl


    As with any IDS, there is always a high probability of false positives. Hence,
    every IDS should be equipped with a whitelisting capability by which certain systems,
    networks, ports, or protocols can be excluded from any detection mechanism and
    (most importantly) any automated response features. Because certain IP addresses
    or networks may be known bad actors, there should also be a provision to blacklist
    them.


    These requirements are met in psad''s auto_dl file, which follows this syntax:


    | ip/network | danger level | optional protocol/optional ports |


    If the danger level is set to zero, psad will completely ignore the IP address
    or network. However, the danger level can be as high as if a particular IP address
    or network is known to be extremely malicious. For the first of the following
    two lines ensures that psad will ignore all traffic from the IP address 192.168.10.3;
    the second line immediately escalates all TCP port 22 (SSH) traffic to a danger
    level of five from the 10.10.0/24 network:


    ```

    192.168.10.3    0;

    10.10.0/24      5 tcp/22;

    ```


    # /etc/psad/signatures


    The etc/psad/signatures file contains a set of about 200 slightly modified Snort
    rules. These rules represent attacks that psad is able to detect directly from
    iptables log messages. None of these rules require application layer tests against
    network traffic—fsnort application layer tests (Chapters 9 and 10). An example
    of such file is the:


    ```

    alert udp $EXTERNAL_NET -> $HOME_NET 1026:1029 (msg:MISC Windows popup spam attempt;
    classype:misc-activity; reference:url,www.linklogger.com/UDP1026.html; psad_size:100;
    psad_id:100196; psad_dl:2);

    ```


    The fields in below are custom fields added to the Snort rules by psad. In this
    case, the psad_size field requires the data portion of the UDP packet to be larger
    than 100 bytes, the psad_id field defines a unique ID for this, the psad_dl field
    tells psad to assign a danger level of two to any IP address that triggers this
    signature. A complete discussion of the modifications psad makes to the Snort
    rules language is provided in Chapter 7.'
