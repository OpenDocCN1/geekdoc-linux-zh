  md: 'This is not to say nothing useful can be done; several signatures in the Snort
    ruleset are designed to generically detect attempts to use a system in suspicious
    ways allow elevated privileges have been attained by an attacker. This can sometimes
    allow Snort to detect the effects of a zero-day attack (i.e., when an attacker
    actually tries to use the compromised system without necessarily detecting the
    attack). For example, the rules in the shellcode rules file look for commonalities
    in shell code that are shared among many publicly available exploits. An attacker
    may use one of these code snippets (which can do things create a reverse shell)
    in conjunction with a new attack. Code reuse is just as in the computer underground
    as it is in other areas of software development. Other examples for detecting
    suspicious activity are Rule IDS 1341 and 1342, which look for attempts to execute
    the gcc comp over an HTTP session. If Snort generates an alert for any of these
    rules, it doesn''t matter if a webserver has been compromised by a zero-day attack
    or not; the alert signals the detection of a potential effect of a successful
    exploit as the target system is used in a suspicious way.


    The zero-day vulnerability problem has helped to create a new class of security
    vendors that develop Network Anomaly Detection Systems, products designed to detect
    anomalous behavior in a computer network. The goal of these products is to detect
    the ways an attacker uses systems within a network after a successful compromise.
    A word of caution, though: as I have to see a vendor define what constitutes an
    anomaly in a way specific enough to be useful.


    The problem is that networks exhibit such incredible heterogeneity that it is
    hard to differentiate between usual and unusual behavior. There is a significant
    amount of research in this area, however, for both networks and individual hosts,
    and some excellent papers have been written². Although both the commercial sector
    and the academic community are actively working on a solution to the problem of
    how to mitigate the effects of attacks against unknown vulnerabilities, no general
    solution exists.


    # Defense in Depth


    We know quite a bit about the dangers of latent vulnerabilities in network-services,
    we can use the principle of defense in depth in our efforts to maintain system
    security. Defense in depth, mentioned in previous chapters in the context of bolstering
    IDS infrastructure with iptables, dictates that the security of a system is enhanced
    by layering multiple defensive mechanisms. We will see that the two technologies
    discussed in this chapter, port knocking and SPA, fairly nicely within this rubric.


