    LEN=84 TOS=x00 PRE=x00 TLE=64 ID=0 PROTO=ICMP

    TYPE=8 CODE=0 ID=44836 SEQ=1

    ```


    # Network Layer Attack Definitions


    Define a network layer attack as a packet or series of packets that abuses the
    fields of the network layer header in order to exploit a vulnerability in the
    network stack implementation of an end host, consume network layer resources,
    or conceal the delivery of exploits against higher layers.


    > Contrary to the tendency some have of dumping ICMP into the bucket for transport
    layer protocols such as TCP and UDP, ICMP is considered a network layer protocol.
    See Richard Stevens’ TCP/IP Illustrated, Volume 1, page 69 (Addison-Wesley,1994).

    An examination of the switch statement, beginning at line 24 of the LOG target
    code in the Linux kernel (see the file /net/ipv4/netfilter/ipt_log.c), sheds light
    on this.'
