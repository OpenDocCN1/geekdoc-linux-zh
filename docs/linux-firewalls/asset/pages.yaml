    # Matching Non-Printable Application Layer Data


    When running a server, Netcat can interact with UDP servers as easily

    as it can with those that on TCP sockets. Combined with a little

    Perl, Netcat can send arbitrary bytes across the wire, unlike ones that cannot


    > ¹The Boyer-Moore string algorithm generally outperforms the Knuth-Morris-Pratt

