  md: 'The stream preprocessor is only applicable to TCP traffic (although stream5
    has time-out-based support for UDP and ICMP as well).


    Before the stream preprocessor and its flow keyword interface in Snort rules,
    it was possible to spoof malicious-looking TCP packets from arbitrary source IP
    addresses and cause Snort to generate alerts even though there was no legitimate
    TCP session. Snort''s ability to check the flags of the TCP header to see if acknowledgement
    bit was set was easily circumvented by simply setting the ACK bit in the spoofed
    packets. The tools Stick and Snow were among the first programs to create "stateless"
    attacks against Snort. A similar Perl implementation snortspoof, available from
    the fswnort project, uses the hping utility (see http://www.hping.com). An attacker
    could use Snort content across the wire (see Appendix A). An attacker could use
    a fake IP address is sending a highly dedicated attack across the network. Such
    an attack serves to divert the administrator''s attention from any seemingly innocuous
    and puny attack originating from the attacker''s real IP address.


    By tracking TCP connections and their corresponding states, the stream preprocessor
    provides an effective mechanism for thwarting such stateless attacks. For a connection
    to reach the established state, the three-way TCP handshake must be completed,
    and in turn implies packets must be sent in order. A spoofed TCP ACK packet can
    never qualify as part of a legitimate connection unless the spoofed packet has
    the same source and destination ports, an existing connection between the target
    and the spoofed IP address. This is exceedingly unlikely the attacker is already
    in a position to be able to monitor TCP connections coming into or of your network,
    and people with level of access are most likely not going to be interested in
    spoofing packets into an established session anyway; they will go after more fruitful
    targets, such as the direct compromise of additional systems.¹¹⁰ Currently, near
    90 percent of all Snort rules utilize the flow option to apply checks against
    TCP connections that are in the established state.


    Through the use of connection-tracking features, iptables is a stateful firewall
    and provides connection-tracking mechanism for not only TCP connections but connectionless
    protocols such as UDP and ICMP (through the use of a timeout). Although iptables
    does not provide a way to restrict match directions of traffic within a TCP connection
    independent of the network layer source and destination IP addresses (i.e., to
    server or to client in Snort parlance), it allows to match against established
    TCP connections. This is for the most important capability in terms of intrusion
    detection, because with the stream preprocessor, attackers cannot trick iptables
    into taking action against malicious-looking spoofed TCP ACK packets. To instruct
    iptables to match against established TCP connections, we can use the following
    command-line


    > ¹⁰TCP connection hijacking can sometimes be used to compromise systems as well,
    but this type of attack is esoteric and generally foiled by the use of application
    layer encryption.


    Translating Snort Rules into iptables Rules 167'
