  md: '# CARE AND FEEDING

    OF IPTABLES


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_30_0.png)


    In this chapter we''ll explore essential aspects of properly installing, maintaining,
    and interacting with the iptables firewall on Linux systems. We''ll cover iptables
    administration from the perspectives of both kernel and userland, as well as how
    to build and maintain an iptables firewall. A default policy will be constructed
    that will serve as a guide throughout several chapters in the book; a script that
    implements it and a network diagram are included for reference in this chapter.
    Many of the example attacks throughout this will be launched from hosts shown
    in this network diagram. Finally, we''ll cover testing the default iptables policy
    to ensure that it is functioning as designed.


    # iptables


    The iptables firewall is developed by the Netfilter Project (http://www

    .netfilter.org) and has been available to the masses as part of Linux since the
    release of the Linux 2.4 kernel in January 2001.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'Over the years, iptables has matured into a formidable firewall with most of
    the functionality typically found in proprietary commercial firewalls. For example,
    iptables offers comprehensive protocol state tracking, application layer inspection,
    rate limiting, and a powerful mechanism to specify a filtering policy. All major
    Linux distributions include iptables, and may prompt the user to deploy an iptables
    policy right from the installer.


    The differences between the terms iptables and Netfilter have been a source of
    confusion in the Linux community. The official project name for all the packet
    filtering and managing facilities provided by Linux is Netfilter, but this term
    refers to a framework within the Linux kernel that can be used to hook functions
    into the networking stack at various stages. On the other hand, iptables uses
    the Netfilter framework to hook functions designed to perform operations on packets
    (such as filtering) into the networking stack. You can think of Netfilter as providing
    the framework on which iptables builds firewall functionality.


    The term iptables also refers to the user tool that parses the command line and
    communicates a firewall policy to the kernel. Terms such as tables, chains, matches,
    and targets (defined later in this chapter) make sense in the context of iptables.


    Netfilter does not filter traffic itself—it allows functions that can filter traffic
    to be hooked into the right spot within the kernel. (I will not repeat this point;
    much of the material in this book centers around iptables and how it can take
    action against packets that match certain criteria). The Netfilter Project also
    provides pieces of infrastructure in the kernel, such as connection tracking and
    logging; any iptables policy can use these facilities to perform specialized packet
    processing.


    > In this book I will refer to log messages generated by the Netfilter logging
    subsystem as iptables log messages; after all, packets are only logged upon matching
    a rule that is constructed by iptables in the first place. So as not to confuse
    things I will use the term iptables by default unless there is a compelling reason
    to use Netfilter (such when discussing kernel compilation options or connection-tracking
    capabilities). Most people associate Linux firewalls with iptables, anyway.


    # Packet Filtering with iptables


    The iptables firewall allows the user to instrument a high degree of control over
    IP packets that interact with a Linux system; control is implemented within the
    Linux kernel. A policy can be constructed with iptables that acts as a vigorous
    cop—packets that are not permitted to fall into oblivion and are never heard from
    again, whereas packets that pass muster are sent on their merry way or altered
    so that they conform to local network requirements.


    An iptables policy is built from an ordered set of rules, which describe the kernel
    actions that should be taken against certain classes of packets. Each iptables
    rule is applied to a chain within a table. An iptables chain is a'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'collection of rules that are compared, in order, against packets that share
    a common characteristic (such as being routed to the Linux system, as opposed
    away from it).


    # Tables


    A table is an iptables construct that delineates broad categories of functionality,
    as packet filtering or Network Address Translation (NAT). There are four tables:
    filter, nat, mangle, and raw. Filtering rules are applied to the filter table,
    NAT rules are applied to the nat table, specialized rules that alter packet data
    are applied to the mangle table, and rules that function independently of the
    Netfilter connection-tracking subsystem are applied to the raw table.


    # Chains


    Each table has its own set of built-in chains, user-defined chains can also be
    created that the user can build a set of rules that are related by a common tag
    as INPUT_ESTABLISHED or DMZ_NETWORK. The most important built-in chains for our
    purposes are the INPUT, OUTPUT, and FORWARD chains in the filter table:


    +   - The INPUT chain is traversed by packets that are destined for the local
    system after a routing calculation is made within the kernel (i.e., packets destined
    for a local socket).

    - The OUTPUT chain is reserved for packets that are generated by the Linux system
    itself.

    - The FORWARD chain governs packets that are routed through the Linux system (i.e.,
    when the iptables firewall is used to connect one network to another and packets
    between the two networks flow through the firewall).


    Two additional chains that are important for various scenarios are the PRERUTING
    and POSTROUTING chains in the nat table, which are used to modify packet headers
    before and after an IP routing is made within the kernel. Sample iptables commands
    illustrate the usage of the PRERUTING and POSTROUTING chains later in this chapter,
    but in the meantime, Figure 1-1 shows how packets flow through the nat and filter
    tables


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_32_0.png)


    Figure 1-1: iptables packet flow


    Care and feeding of iptables 11'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Matches


    Every iptables rule has a set of matches along with a target that tells iptables
    what to do with a packet that conforms to the rule. An iptables match is a condition
    that must be met by a packet in order for iptables to process the packet according
    to the action specified by the rule target. For example, to apply a rule to TCP
    packets, you can use the --protocol match.


    Each match is specified in the iptables command line. The most important iptables
    matches for this book are listed below. (You''ll see more about matches in "Default
    iptables Policy" on page 20 when we discuss the iptables policy used throughout
    this book.)


    ```

    --source (-s) Match on a source IP address or network

    --destination (-d) Match on a destination IP address or network

    --protocol (-p) Match on an IP value

    --in-interface (-i) Input interface (e.g., eth0)

    --out-interface (-o) Output interface

    --state Match on a set of connection states

    --string Match on a sequence of application layer bytes up to 256 bytes of comment
    data with a rule within kernel memory

    ```


    # Targets


    Finally, iptables supports a set of targets that trigger an action when a packet
    matches a rule. The most important targets used in this book are as follows:


    +   ACCEPT Allows a packet to continue on its way.

    DROP Drops a packet. No further processing is performed, and as far the receiving
    stack is concerned, it is as though the packet was never sent.

    LOG Logs a packet to syslog.

    REJECT Drops a packet and simultaneously sends an appropriate response packet
    (e.g., a TCP Reset packet for a TCP connection or an ICMP Port Unreachable message
    for UDP packet).

    RETURN Continues processing a packet within the chain chain.


    We''ll build iptables rules that use several of the matches and targets discussed
    in "Default iptables Policy" on page 20.


    # Installing iptables


    Because iptables is split into two fundamental components (kernel modules and
    the userland administration program), installing iptables involves compiling and
    installing both the Linux kernel and the userland binary.


    > Note that matching is used to mean that a packet conforms to all of the match
    criteria contained within an iptables rule.'
  merge: -1
  pgno: 33
