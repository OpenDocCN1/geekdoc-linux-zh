    Listing 7-2: psad forensics output


    The output in Listing 7-2 includes information to inform you of the total number
    of iptables log messages psad parsed from the logfile. The output also lists the
    total number of IP addresses for each of the five danger levels. The remainder
    of the forensics output (not displayed here, for brevity) is similar to the --status
    output from the previous section. This includes verbose information about the
    top scanned ports, top attackers, signature matches, and more.


    By default, in forensics mode, psad parses iptables log messages out of /var/log/messages
    file. You can change this path with the -m command-line argument like:


    ```

    [iptablesfw]# psad -m /some/file/path

