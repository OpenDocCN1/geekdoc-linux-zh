  md: '# Port Knocking


    In 2003, a brilliant concept port knocking³ was introduced to the security community
    by Martin Krzewinski in an article in SysAdmin magazine. Port knocking is the
    communication of authentication data across closed ports which allows a service
    (such as SSHD) to be protected by a packet filter configured in a default-drop
    state. Any-body client that wants to make a connection to a protected service
    through the default-drop packet filter must first possess of a valid port-knock
    sequence. If a client produces a correct knock sequence (e.g., by connecting each
    port of the sequence in the proper order), the packet filter is reconfigured to
    allow the IP address that sent the sequence to a protected service for a short
    period of time.


    Typically, port-knocking schemes either monitor firewall logs or use raw packet
    capture mechanism (such as libcap) to order collect sequences from port-knocking
    clients. We will see later that iptables messages are well suited to supply the
    necessary sequence data. We will also see that port knocking is an important technology
    with a compelling innovation (i.e., the protection of a service behind a default-drop
    packet filter), a related technology SPA provides the same benefits as port knocking
    but eliminates many of its limitations. But first, we need some background on
    port knocking.


    Port knocking quickly became a success and nearly 30 known implementations of
    port-knocking schemes sprung around the security landscape, each of these implementations
    offering a slightly different twist on the concept of port knocking. For example,
    cd00r and port TCP SYN packets to communicate port-knock sequences, while Tumbler
    use packet payloads to send hashed authentication data. (For more examples of
    port-knocking schemes, see http://www.portknocking.org.) We''ll see later that
    prohibits the use of packet payloads (instead of just packet) to send authentication
    data—concealing a service behind a default-drop packet filter can be accomplished
    in such implementations.


    A port-knock sequence may be either shared, non-encrypted set of ports or a set
    of ports that is encrypted with a symmetric cipher such as Rijndael⁴ (details
    of these schemes can be found in "Shared Port-Knocking Sequences" on page 218
    and "Encrypted Port-Knocking Sequences" on page 221).


    Figure 12-1 illustrates a network diagram in which a port-knocking client is used
    to generate a port-knocking sequence against a Linux system that is running an
    iptables firewall and a port-knocking server. Because portknocking never requires
    bidirectional communication (such as the three-way handshake to set up a TCP connection),
    port-knocking sequences can be spoofed from a fake IP address. This allows port-knocking
    sequences to


    > Martin Krzewinski, "Port Knocking: Network Authentication Across Closed Ports,"
    SysAdmin 12 (2003): 12–17.


    > ⁴A set of encrypted ports means that the port sequence defines a set of byte
    values and this series is used as input to the encryption algorithm. The result
    is a new set of byte values which correspond to new port numbers. This will become
