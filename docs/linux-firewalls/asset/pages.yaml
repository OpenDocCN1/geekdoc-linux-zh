    With the Core Netfilter Configuration section completed, we''ll move on to the
    IP: Netfilter Configuration section. The options that should be enabled within
    this section are as follows:


    +   - ECN target support

    - Full NAT

    - IP address match support

    - IP tables support (required for filtering/masq/NAT)

    - IPv4 connection tracking support (required for NAT)

    - LOG target support

    - MASQUERADE target support

    - Owner match support

    - Packet filtering

    - Packet mangling'
