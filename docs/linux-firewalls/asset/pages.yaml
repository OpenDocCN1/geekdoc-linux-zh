    # Single Packet Authorization


    Port knocking has shown us how to maximize the use of a packet filter tonenforce
    a default-drop stance against all attempts to communicate with a

    protected service. However, as shown earlier in this chapter, port knocking

    is not a pancreas, and it has architectural limitations. In this section,

    we''ll explore an alternative to port knocking that retains its benefits while

    avoids its shortcomings.


    Single Packet Authorization (SPA) combines a default-drop packet filter with

    a passively monitoring packet sniffer in a manner similar to port-knocking

