  md: '# 8


    # # ACTIVE RESPONSE WITH PSAD


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_152_0.png)


    One feature that is commonly sought after intrusion detection systems is the ability
    to automatically respond to an attack. Such responses for network traffic can
    take many forms against an attacker''s perceived IP address, including the instantiation
    of firewall blocking rules, modification of routing tables, generation of ICMP
    port/host unreachable packets for UDP attacks, and use of TCP resets for attacks
    that take place over TCP connections. In this chapter, we''ll explore the features,
    configuration, and implementation of the active response capabilities offered
    by psad.


    # ## Intrusion Prevention vs. Active Response


    In today''s varied world of computer security products, techniques, and solutions,
    the term *intrusion prevention* has received widespread attention. Much of this
    attention probably stems from the perhaps overly powerful implications of the
    term, but this is not to say that the concept of proactively preventing security
    compromises is without merit. Intrusion protection techniques range from host
    level stack-hardening mechanisms (see the PaX project at ...'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'http://pax.grssecurity.net) to inline network devices with software that can
    prevent malicious packets from ever reaching their intended targets, while simultaneously
    allowing all other traffic through unimpeded.


    In contrast, active response refers to the set of mechanisms that can be employed
    against an attacker (once an attack is detected) that does not thwart the attack.
    That active response isn''t always able to prevent the initial attack is an important
    distinction, and it solidly delineates the difference between intrusion prevention
    and active response. The best ways to do this is with a motivating example.


    The Witty worm of 2004 (http://www.lurhq.com/witty.html) exploited a vulnerability
    in the PAM ICQ module in several products developed by Internet Security Systems
    (http://www.iss.net, not part of IBM), including BlackICE and RealSecure. The
    worm was transmitted to system via a single UDP packet with a source port of 4000
    and an arbitrary destination port. When a vulnerable system monitored a packet,
    the contents of the packet payload would be executed, instead of just inspected.
    In the specific case of the Witty worm, the packet payload contained code that
    would write 65K of data (derived from the DLL that caused the vulnerability) to
    random points within the local disk drive, thus slowly filesystem corruption.
    While this would not immediately destroy a system upon initial infection (say,
    by completely formatting the disk), it could create a break in the system subtle
    over time.


    For anyone still running a vulnerable version of BlackICE or RealSecure, the first
    priority would be to download and install a patch from http://www.iss.net/download.
    Another option is to configure a packet filter to not forward any UDP packets
    with a source port of 4000 into the internal network; however, this would be at
    the expense of potentially breaking ICQ services that span the firewall. Obviously,
    this is not an optimal solution, so what is really needed is the ability to detect
    packets that are specifically associated with the Witty worm, and then stop them
    from entering the local network. The detection requirement is easily met (Snort
    rules were written after the initial discovery of the Witty worm), but any response
    mechanism (such as sending ICMP Port Unreachable messages or dynamically reconfiguring
    a firewall rules) is completely ineffective against the worm. The entire attack
    is encapsulated within a single packet, the attacker is able to take advantage
    of two important factors:


    +   - Sending an ICMP Port Unreachable message back to the source IP address is
    worthless because the attack has already made it through the target. The source
    IP address does not have to care whether or the targeted UDP service appears to
    be unreachable.

    - The attack packet can be spoofed. From the perspective of the target, the attack
    might appear to originate from Yahoo!, an external DNS server, or an upstream
    router. Sending any kind of response packet or instantiating a firewall-blocking
    rule could thereby interfere with basic network connectivity.


    132 Chapter 8'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'The only way to really stop the Scotty worm is with an inline device that can
    make fine-grained decisions about the contents of packets that should or not be
    forwarded. Both Snort running in inline mode and iptables running a translated
    Snort rule can provide this functionality. Because it is useless to respond to
    a single packet attack after such an attack is forwarded to a target system, this
    class of attacks highlights the differences between active response and intrusion
    prevention mechanisms.


    # # Active Response Trade-offs


    Automatically responding to an attack by generating session-bursting traffic or
    modifying a firewall policy is not without consequences. An attacker may quickly
    notice that TCP connections with the target system are being torn down or that
    all connectivity with the target has been severed. The most logical conclusion
    to draw would be that an active response mechanism of some type has been deployed
    to protect the target. If the active response system has been configured to respond
    to relatively inactive traffic such as port scans or port sweeps, it becomes exceedingly
    easy for an attacker to bypass the mechanism and turn it against the target. This
    also applies to malicious traffic that can be delivered in a way that it does
    not require bidirectional communication with the target (which enables the attack
    to be spoofed). The Scotty worm is a perfect example of this.


    # # Classes of Attacks


    Many pieces of software that offer active response capabilities (including psad)
    offer the ability to whitelist specific hosts or networks so that even if an attacker
    was to spoof port scans or other malicious traffic from these networks, the response
    mechanism would take no action. However, the administrator of such software is
    unlikely to include every important system in this list, and the attacker is limited
    only by personal creativity. The TCP Idle scan (Chapter 3) requires the scan to
    be spoofed in order to function properly.


    A better strategy for responding to attacks is to enable the response mechanism
    to respond only to attacks that require bidirectional communication between the
    attacker and the target. Generally, this implies that the attacker has established
    a TCP connection and is using it to deliver an attack (such as an SQL injection
    attack against a web application or an attempt to force the target to execute
    code via a buffer overflow exploit in an application that listens on a TCP port).


    Detecting attacks in an established TCP connection requires that the detection
    system maintain a table of established connections and look for attacks within
    these connections. TCP packets with realistic-sequence and acknowledgment numbers
    can be spoofed after all, but such packets are not part of any truly established
    connection, and it is up to the detection mechanism to determine this.'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'NOTE We will see in Chapter 11 that it is possible to use Netfilter''s connection
    tracking capabilities to configure psad to respond only to attacks that are sent
    over established TCP sessions.


    # False Positives


    All intrusion detection systems have some propensity for generating false positives—alerts
    that misidentify activity as malicious. False negatives, or the failure to generate
    an event when real malicious traffic exits, are also commonplace.


    psad is no exception to this rule, and as you run psad you will encounter instances
    where events are generated for traffic that is benign. False positives can be
    minimized through careful tuning, but there will be a chance they will occur;
    automatically responding to traffic that is incorrectly judged as malicious is
    not good for maintaining general network connectivity.


    Still, many system administrators make the judgment that some types of events,
    even if generated from misidentified activities, are potentially damaging enough
    to warrant a draconian response. For example, some outbreaks can be devastating
    for networks and their constituent systems, and therefore, if there is any chance
    of being infected by such worm, active response can be used in an attempt to mitigate
    the outbreak.


    # Responding to Attacks with psad


    Now that we have tempered our discussion with an acknowledgment of the trade-offs
    present in a system that is configured to automatically respond to attacks, let
    us turn to the active response features offered by psad. The main method psad
    employs to respond to an attack is the dynamic reconfiguration of the local filtering
    policy so it blocks all access from an attacker''s source IP address for a configurable
    amount of time.


    # A NOTE ON TCPWRAPPERS


    psad also supports the reconfiguration of the /etc/hosts file to instruct tcpwraprppers
    to deny access from an attacker''s source IP address, but this mechanism is inferior
    to using iptables for several reasons. First, tcpwraprppers can only block access
    to daemons that are configured to use tcpwraprppers; in contrast, a general blocking
    rule in iptables means that an attacker cannot even talk through the IP stack
    on the targeted system. Second, tcpwraprppers is only effective for protecting
    daemons running on the local system, whereas psad may detect or scan other malicious
    traffic in the FORWARD chain. Lastly, an attacker is able to interact with many
    functions on the target system when a daemon is protected by tcpwraprppers; fewer
    functions are available for interaction with iptables, and any one of these functions
    (both within the kernel and within userspace) has a nonzero probability of containing
    a security vulnerability. The remainder of the chapter will concentrate on the
    usage of iptables for active response in psad.


    134 Chapter 8'
