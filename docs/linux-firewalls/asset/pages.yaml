    53/udp closed domain

    nmap finished: 1 IP address (1 host up) scanned in 23.721 seconds


    As you can see from the output in bold in the scan output, the only port that
    is not in the open or filtered state is UDP port 53. Nmap infers that it receives
    an ICMP Port Unreachable message from the target system when UDP port 53 is scanned,
    and this indicates that there is no server bound to this port. All other probes
    for the remaining ports are met with complete silence because they are dropped,
    so Nmap has no way of knowing they are open or filtered. A UDP server is not required
    to respond to any arbitrary packet, and because the UDP stack does not manufacture
    additional packets (like TCP with acknowledgment and connection messages), Nmap
    cannot tell whether there is really a server associated with each of these ports.


