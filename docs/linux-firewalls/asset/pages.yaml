    The ping program can generate packets without application layer data using the
    -s command-line argument to set zero size on the payload, but by default the ping
    program includes a few bytes of payload data.


    While not including application layer data in an ICMP packet is not in and of
    itself an abuse of the network layer, if you see such packets in conjunction with
    packets that indicate activities such as port scans or sweeps (Chapter 3), it
    is good to bet that someone is performing reconnaissance against your network


    # IP Spoofing


    Few terms in computer security rise to more confusion andbole than spoofing, specifically
    IP spoofing. A spoof is a hoax or prank, and IP spoofing means to deliberately
    construct an IP packet with a falsified source address.


    We carve out an exception for Network Address Translation (NAT) operations on
    IP packets which alter source addresses (such as commonly provided by firewalls
    to shield internal networks behind a single external address). Not to be confused
    with IP-ofing, NAT is a legitimate networking function, whereas concealing an
    attack with a falsied source address.


    When it comes to communications over IP, there is no built-in restriction on the
    source address of a packet. Using a raw socket (low-level programming API) to
    craft packets according to certain criteria), an IP packet can be sent with an
    arbitrary source address. If the source address is nonsensical (for example, the
    source is on Verizon''s network but the packet is really being sent from Comcast''s
    network), the packet is said to be spoofed. Administrators can take steps to configure
    routers and firewalls to not forward packets with source addresses outside of
    internal network ranges (so spoofed packets would never make it), but many networks
    have no such controls. The default iptables policy discussed in Chapter 1 has
    some-anti spoofing rules built in.


    From a security perspective, the most important thing to know about spoofed packets
    (and IP packets in general) is that it is impossible to trust the source address.
    In fact, sometimes an attack can be delivered in a single spoofed packet (see
    the Witty worm discussion in Chapter 8).'
