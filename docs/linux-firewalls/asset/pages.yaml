    # Logging ICMP


    The IPT target has code dedicated to logging ICMP, and since ICMP exists on the
    network layer, we''ll cover it next. ICMP (defined by RFC 792) has a simple header
    that is 32 bits wide. Figure 2-2 displays the ICMP header. This header consists
    of three fields: type (8 bits), code (8 bits), and a checksum (16 bits); the remaining
    fields are part of the ICMP packet.


    The specific fields within the data portion depend on the ICMP type and code values.
    For example, fields associated with an ICMP Request (type 8, code 0) include an
    ID and a sequence value.


    | Type(Type+) | Code(Code+) | Checksum |

    |---|---|---|

    | DATA ::: (depends on Type and Code is variable length—logged to some extent)
    |


    Figure 2-2: The ICMP header and corresponding iptables log message fields


    Like the IP header, the LOG target allows the ICMP type and code fields, and never
    loses the ICMP checksum field. There are no command-line arguments in iptables
    to influence how the LOG target represents fields within the data portion of ICMP
    packets.The ICMP fields in the first Echo Request packet in this chapter starting
