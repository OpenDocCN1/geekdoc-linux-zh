  md: '# 13


    # # INTRODUCING FWKNOP


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_252_0.png)


    The FireWall KNock OPerator (fwknop, see http://www.cipherdyne.org/fwknop) was
    released as an open source project under the GNU Public License (GPL) in June
    2004. It was the first port-knocking implementation to combine encrypted port
    knocking with passive OS fingerprinting, making it possible to allow only Linux
    systems to connect to your SSH daemon. (The TCP stack of the port-knocking client
    system acts as an additional authentication parameter.) fwknop''s port-knocking
    component is based on iptables log messages, and it uses iptables as the default-drop
    packet filter.


    In May 2005, I released the Single Packet Authorization mode for fwknop. As of
    this writing, fwknop-1.0 is the latest release, and the SPA method of authentication
    is the default, even though fwknop continues to support the old port-knocking
    method. MadHat coined the term *Single Packet Authorization* at Black Hat Briefings
    in July 2005. I submitted a similar proposal for presentation at the same conference,
    but *Single Packet Authorization* rolls off the tongue easier than my title, which
    was Netfilter and Encrypted, Non-replayable, Spofable,


    *'
