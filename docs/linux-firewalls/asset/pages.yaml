    In this chapter we''ll concentrate on the

    analysis of iptables logs that are generated

    without the use of the iptables string match

    We''ll focus our energies on the detection

    of malicious network traffic by examining network and

    transport layer headers instead of looking at the application layer. In Chap-

    ter 11, we''ll make heavy use of the string match extension to move us into the

    realm of detecting application layer attacks, but for now we will showcase—by

    parsing iptables log messages—how psad can detect port scans, probes for

    backdoors, and other suspicious traffic.


    This chapter is designed to introduce you to operational aspects of psad,

    including attack detection and alerting. More advanced topics, such as sig-

    nature detection, operating system fingerprinting, and DShield reporting

