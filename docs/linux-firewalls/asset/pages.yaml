    # Concluding Thoughts


    This chapter has focused on the installation and configuration of psad on a Linux
    system running iptables. Some of the more important configuration variables from
    the psad.conf file were presented, and now we are ready to delve into operational
    aspects of psad in the next chapter. For reference, you will find complete examples
    of the default psad configuration files online at http://www.cipherdyne.org/LinuxFirewalls.
    There is also a substantial amount of psad documentation available online at http://www.cipherdyne.org.'
