  md: 'that the paths make sense before building fwsort.sh. However, the fwsort.sh
    script does not necessarily have to be executed on the same system where fwsort
    is installed. In fact, from a security perspective, it is better not to have Perl
    or any other highly capable interpreter or compiler installed on a dedicated firewall
    that is not strictly necessary for any operations perspective²


    The configuration section allows the paths to be tweaked easily for the event
    system on which fwsort is deployed:


    ```

    ECHO=/bin/echo

    IPTABLES=/sbin/iptables

    ```


    The third section in fwsort.sh is responsible for building dedicated iptables
    rules. With the exception of the jump rules discussed below, all fwsort rules,
    are added to these custom chains to maintain strict separation from any existing
    iptables policy.


    The names given to fwsort chains broadly describe the type of traffic inspection
    that is performed within each chain. For example, the FWSORT_INPUT chain is for
    inspection of traffic that is directed at the local system and is therefore governed
    by the iptables INPUT chain. Similarly, the FWSORT_OUTPUT chain applies to packets
    that originate from the firewall system itself (via the OUTPUT chain), and the
    FWSORT_FORWARD chain governs packets that are destined to be forwarded through
    the local system (via the FORWARD chain).


    # TCP Connection States and fwsort Chains


    Because of the relative importance of using Snort rules to established TCP sessions
    through the use of the Snort flow established option, fwsort creates special chains
    for such rules. The names for these chains simply append the string_ESTAB to the
    fwsort chains mentioned previously. All of the following chains have been created,
    jump rules are added that the iptables state to send TCP packets that are part
    of established sessions to the appropriate_ESTAB chain. For example, packets in
    the FWSORT_INPUT chain are jumped to the FWSORT_INPUT_ESTAB chain, as shown here:


    ```

    ########### Create fwsort iptables chains. ###########

    $IPTABLES -N FWSORT_INPUT 2>/dev/null

    $IPTABLES -F FWSORT_INPUT

    $IPTABLES -N FWSORT_INPUT_ESTAB 2>/dev/null

    $IPTABLES -F FWSORT_INPUT_ESTAB

    $IPTABLES -N FWSORT_OUTPUT 2>/dev/null

    $IPTABLES -F FWSORT_OUTPUT

    $IPTABLES -N FWSORT_OUTPUT_ESTAB 2>/dev/null

    $IPTABLES -F FWSORT_OUTPUT_ESTAB

    $IPTABLES -N FWSORT_FORWARD 2>/dev/null

    $IPTABLES -F FWSORT_FORWARD

    $IPTABLES -N FWSORT_FORWARD_ESTAB 2>/dev/null

    $IPTABLES -F FWSORT_FORWARD_ESTAB

    ########### Inspect ESTABLISHED tcp connections. ###########

    ```


    > ²For more information on host security issues and hardening strategies, Bastille
    Linux (http://www.bastille-linux.org) provides lots of great educational information,
    along with the ability to automatically harden Linux distributions.


    Chapter 10'
