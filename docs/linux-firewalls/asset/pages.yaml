    # psad Signature Updates


    Each psad release includes an updated signature set bundled within the psad tar
    archive or RPM file as the "signatures" file. Signature development is an ongoing
    process, however, and in some cases a new signature is developed for psad before
    the next release is.


    In order for people to use the signature as quickly as possible, the latest signature
    is published at http://www.cipherdyne.org/psad/signatures. With the psad --sig-update
    command-line argument, psad downloads and places this file in the filesystem at
