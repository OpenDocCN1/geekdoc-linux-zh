  md: 'default-drop rule, a connection can remain open even though the initial rule
    that allowed the session to be established has been removed.


    Using a connection-tracking mechanism to keep TCP connections provides an elegant
    solution for long-running TCP sessions, but what about short-lived connections
    such as those transfer HTTP data over the Web or SMTP data over mailvers? It be
    inconvenient to generate a new SPA packet for every link a user wishes to view;
    this problem is compounded by the fact that every link is transferred over a separate
    TCP connection. In general, SPA is not well suited to protect such services.


    One solution to this problem is to simply extend the client IP addresses so that
    it doesn''t require a new SPA packet for, say, one hour. While this extension
    reduces the effectiveness of SPA to some extent, it might make sense to do so
    if your webserver is running a critical application and security is the most important
    consideration. It might also be possible to generate a SPA packet by caching an
    encryption password within the local filesystem. In general, however, it not a
    good idea to put encryption passwords (which can weaken the security of GnuPG
    keys) within the filesystem. One step that is useful, is to strongly integrate
    the SPA with many client programs as possible. For an example of this with OpenSSH,
    see “f OpenSSH Integration” page 252.


    # Security Through Obscurity?


    Do port knocking or SPA fall into the category of security through obscurity?
    This has been a hotly debated topic since port knocking was first announced to
    the security community, and people have strong feelings on both sides. No doubt
    the controversy will not be settled here; my hope is to provide some food for
    thought.


    When a new security technology is proposed, researchers around the globe One of
    the common tests of security technology is whether or not it suffers from security
    obscurity; if it does, people try to fix the architecture. It is therefore important
    to determine whether SPA suffers from security through obscurity. Bruce Schneider
    states the following in the preface of Applied Cryptography.


    > If we take a letter, lock it in a safe, hide the safe somewhere in New York,
    then you tell you the letter, that''s not security. That''s obscurity. On the
    other hand, if I take a letter and lock it in a safe, and then give you the safe
    along the design specifications of the safe and hundreds of identical safes with
    their combinations so that you and the world''s best crackers can study the locking
    mechanism—and you still can''t open and read the letter—that''s security.


    Many of these ideas were first suggested by Sebastien Jeanquier in his master''s
    thesis, “Analysis of Port Knocking and Single Packet Authorization,” at the Information
    Security Group of the Royal Holloway College at the University of London (see
    http://www.asg.rlol.ac.uk).'
