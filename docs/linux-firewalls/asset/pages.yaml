    # dsize


    The dsize option places a requirement on the size of packet payload data. It accepts
    a positive integer together with an optional < or > operator to denote the number
    of bytes that must exist within the application portion of a packet in order for
    a rule to match. For example, to require that a packet contain at least 500 bytes
    of payload data, we could use dsize:>500; within a Snort rule. The dsize option
    also supports a lower and upper bound on the range with the < > operator; like
    dsize:<500. Unfortunately, there are no direct iptables mechanism for specifying
    payload length by itself.


    However, iptables length allows a decent approximation by allowing the combined
    lengths of the network header, transport header, and the application payload.
    The facts that IP headers are always 20 bytes long (IP options are usually included),
    properly constructed UDP headers and ICMP Echo Request and Replies are always
    8 bytes long, and (on average) a good approximation for the length of a TCP header
    is about 30 bytes (20 bytes for static fields and about 10 bytes for options),
    we use a heuristic for mapping the Snort dsize option into iptables rules.


    For example, if a Snort route against TCP contains the dsize: 200; then for the
    iptables length we would specify a length of 20 + 200 = 250 bytes. The iptables
    interface to the length match is -m length --length bytes, and in a similar manner
    to Snort, the iptables length also supports bytes ranges: -m length --length.
    The length match requires CONFIG_IP_NF_MATCH to be enabled in the kernel configuration
    file. However, if the length is unavailable, the IP header is included in iptables
    logs, and an external application such as pscan can apply the same logic to logged
    packets in order to make judgments about packet length. Of course, in a log analysis
    scenario, packet cannot be used as a filter.


