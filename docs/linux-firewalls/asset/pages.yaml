  md: '# Logging UDP Header


    The UDP Header is defined in RFC 768. It is only eight bytes and has no variable
    length fields (see Figure 3-3).


    Since there are no special command-line arguments to influence how a UDP header
    is represented by the LOG target, iptables always logs UDP headers in the same
    way.


    | Source Port [SPT] | Destination Port [DPT] |

    | Length [LEN=] | Checksum |


    **Figure 3-3:** UDP header and iptables log message fields


    Even though the default LOG rules in the iptables policy discussed in Chapter
    1 use the --log-tcp-options argument, if a UDP packet hits one of these rules,
    iptables does the right thing and only logs what is actually in the packet; it
    won''t attempt to log the options portion of a TCP header that does not exist.
    The UDP checksum is never logged, but the remaining fields (SPT, DPT, and LEN)
    are all included:


    ```

    [ext_scanner]#$ echo "aaaa" | nc -u 71.157.X 5001

    [iptablesfw]# tail /var/log/messages | grep 5001

    Jul 12 16:27:08 iptablesfw kernel: DROP IN=eth0 OUT=

    MAC=00:13:38:b6:e4:00 dport=38:8:40:ae:37:08:00 SRC=144.202.X DST=71.157.X

    LEN=33 TOS=0 PREC=0 TTL=64 ID=38817 DF PROTO=UDP

    SPT=44595 DPT=5001 LEN=12

    ```


    > The UDP length in the iptables log message above includes the length of the
    UDP header plus the length of the application layer data. In this case, the application
    layer data consists of the four bytes "aaaa", so adding this to the length of
    the UDP header (eight bytes) yields a total of 12 bytes. The -n command-line argument
    to the echo command instructs not to add a trailing newline character. Had this
    argument not used, the value of the LEN field would have been 13 to accommodate
    the additional byte.


    # Transport Layer Attack Definitions


    By the definition of a network layer attack (given in Chapter 2), we define a
    transport layer attack as a packet or series of packets that abuses the fields
    of the transport layer header in order to exploit a vulnerability or error condition
    in the transport stack implementation of an end host.


    Transport layer attacks fall into one of the following categories:

    Connection resource exhaustion Packets that are designed to saturate all available
    resources for serving new connections on a targeted host or set of hosts. A DDoS
    attack in the form of a SYN flood.'
