    # Abusing the Transport Layer


    Because the transport layer is, in a sense, the gateway before communicating the
    stack with a networked application, it''s a juicy target for an attacker. Much
    of the suspicious activity involves transport layer information falls into the
    category of reconnaissance efforts instead of outright attacks.


    # Port Scans


    A port scan is a technique used to interrogate a host in order to see what TCP
    or UDP services are accessible from a particular IP address. Scanning a system
    can be an important step toward a successful compromise, because it gives information
    to an attacker about services that may be accessed and attacked.


    That said, a port scan can also be an important step to see what services are
    available to talk to; there is nothing malicious about a port scan by itself.
    You can link a port scan to a person knocking on the doors of a house. For any
    given door, if someone says, "Hello, nice to meet you," and then walks away, no
    harm is done. While the repeated knocking may be suspicious, a crime has not been
    committed unless the person attempts to enter the house. Still, if someone were
    to knock on all the doors of my house, I would want to know about it, because
    it may be a sign of someone collecting information about the best way to break
    in. Similarly, it''s a good idea to detect port scans (subject to a tuning exercise
    to reduce false positives), and most intrusion detection systems offer the ability
    to send alerts when systems are hit with a scan.


    # Matching Port Scans to Vulnerable Services


    A port scan does not involve an exhaustive test for every possible port on a target
    system.³ If an attacker is compromised, say OpenSSH 3.3 and BIND 4.9 servers,
    then it is of little use to find out the remaining


