  md: '# Busting Metasploit updates with fsnort and psad


    Armed with our new Snort rule, we can use fsnort and psad to identify and stop
    the SSL sessions initiated by the svn update or msfdate commands.


    Our rule will not stop other methods of updating Metasploit such as rsync over
    SSH against an external machine with a previously updated database, of course.
    In addition, we do not deploy fsnort or psad responses that could interfere with
    basic DNS lookups or web requests to metasploit.com unless an SSL session is found.


    As mentioned earlier, the first step in getting fsnort to stop the Metasploit
    update process is to translate our new Snort rule into equivalent iptables rules.
    To do so, we copy the metasploit.rules file into the /etc/fsnort/snort_rules directory
    and run fsnort. Because we are focusing on stopping Metasploit updates, we use
    the --ipt-reject command-argument to


    ```

    iptablesfw# cp metasploit.rules /etc/fsnort/snort_rules

    iptablesfw --fsnort --sid 900001 --ipt-reject

    # Parsing Snort rules files...

    # Found: 900001 in metasploit.rules

    Successful translation

    # logfile: /var/log/fsnort.log

    iptables script: /etc/fsnort/fsnort.sh

    iptablesfw# grep -i metasploit /etc/fsnort/fsnort.sh

    ################metasploit.################

    ECHO "[+] Adding iptables rules"

    # alert tcp any 443 -> $HOME_NET msg:"Metasploit exploit DB update"; flow:established;
    content:

    ```


    Let''s execute the fsnort.sh script shown above on the firewall and run iptables
    into a detection and blocking mechanism for Metasploit updates:


    ```

    iptablesfw# /etc/fsnort/fsnort.sh

    [+] Adding metasploit rules

    Rules added:4

    ```'
