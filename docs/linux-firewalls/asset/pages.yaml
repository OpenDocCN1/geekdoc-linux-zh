    # Architectural Limitations of Port Knocking


    Although port knocking can provide an additional layer of protection for

    network services that may contain undiscovered security bugs, some of the

    characteristics of the port-knocking architecture might make it brittle and

    not scalable to enterprise-class deployments. These limitations stem from the

    usage of packet headers as the data transmission mechanism, as opposed to

    using application layer payloads. As we shall soon see, SPA (discussed in "Single

    Packet Authorization" on page 226) addresses many of the limitations of tradi-

    tional port-knocking implementations.


    # The Sequence Relay Problem


    In today''s world of security threats, we should assume that all traffic is

    monitored by an unknown third party as it travels across a network. Dogedly

    adhering to this viewpoint provides ample motivation to make sure that

    sensitive information (such as credit card numbers) is only transferred over

    the network in encrypted format.


    In the case of port knocking, no packet has application layer data

    associated with it, so there would appear to be little reason to intercept

    a port-knocking sequence.


    However, the goal of port knocking is to transmit enough informa-

    tover the recipient to deduce that a packet filter

    be temporarily reconfigured, granting access to an IP address that

    proven its identity via the knock sequence. If an attacker can intercept

    a port-knocking sequence as it is transmitted over the network, then it is

    easy for the attacker to send an identical knock sequence to the same target

    at a later time. This is called a replay attack, because the attacker is replaying

    tock sequence against the target in an attempt to gain the same access

    as the legitimate port-knocking client. Because port knocking just uses packet

    headers, it is difficult to build enough'
