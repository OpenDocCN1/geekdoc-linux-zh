  md: '# SPA over Tor


    The Onion Router (Tor), is an anonymizing network composed of a globally dispersed
    set of nodes called onion routers (see http://tor.eff.org). The Tor network is
    designed to harden TCP-based services against a type of Internet surveillance
    called traffic analysis. Traffic analysis is used to determine who is talking
    over the Internet, and it is easily deployed by any organization—particularly
    ISPs—with access to Internet traffic. Even encrypted traffic is subject to traffic
    analysis because IP addresses are transmitted in the clear.


    I am not considering IPSEC or other VPN protocols here, but even these protocols
    can reveal information through traffic analysis as well.


    The information that can be gleaned simply by watching two parties communicate
    is often underestimated, and this has implications for everyone from keeping passwords
    secure to revealing the identities of supposedly anonymous remainders.


    Tor works by setting up a virtual circuit through the router cloud for each connection.
    A virtual circuit is established between an entry router and a randomly selected
    exit router. Every circuit is unique, and each hop within the circuit only knows
    the hop from which traffic originates and the hop to which traffic must be sent.
    Traffic is encrypted when it is within the router cloud.


    The result is that a client may communicate with a server over the open Internet
    via this virtual circuit, and any third party that can monitor the traffic going
    in or out of the router will see IP addresses talking to each other that seem
    totally unrelated.


    Is there a benefit to sending SPA packets over the Tor network? Decidedly so,
    as it extends the service-cloaking nature of knop, making it more difficult to
    determine that an SPA is being used at server locations.


    But there is one catch: Tor uses TCP for transport, which is incompatible with
    SPA, because SPA packets are transferred over UDP by default. Even when knfnow
    supports sending SPA packets over blind TCP ACK packets, this alone is not enough
    to get an SPA packet to traverse the Tor network. A virtual circuit is created
    with the entry router only after the TCP connection has been fully established,
    implying bidirectional communication is required.


    knfnow solves this problem by breaking the single packet of SPA and sending SPA
    packets over fully established TCP connections with the knfnow-serv daemon. This
    daemon spawns a minimal TCP server that runs as user nobody, does a bind() and
    listen() on TCP port 62201, and then loops over successive calls to accept().
    With each accept(), a single rec() is made


    > 7 There have been some attacks against Tor in order to reduce the strength of
    its resistance to traffic analysis, see http://www.cl.cam.ac.uk/users/jim217/papers/oakland05torta.pdf.

    8 A blind TCP ACK (or other TCP packet with other flags set) is not part of an
    established TCP connection.


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_275_0.png)


    254 Chapter 13'
  merge: -1
  pgno: 275
- img_proc: true
  md: 'that only single TCP segment may be sent by a client before the session is
    shut down. This allows a client to send the SPA payload, but nothing else, across
    the established TCP connection. Then, by using the socat program, which functions
    as the socks5 proxy Tor requires, together with --socat argument on the fwknop
    command line, the SPA packet can be sent over the Tor network.


    NOTE For more information on socat, see http://www.dest-unreach.org/socat.


    # Concluding Thoughts


    This chapter and Chapter 12 have illustrated powerful techniques in computer security,
    showing how a server can be protected by a default-drop packet filter, through
    which access is granted only to clients to prove their identities to a passively
    monitoring device. Port knocking was the first technology to implement this idea,
    but due to serious limitations in the port-knocking architecture (including the
    difficulty of adequately addressing the replay problem and the inability to transmit
    more than a few tens of bytes), SPA has proved itself a more robust technology.
    The notion of authorizing Ethernet sniffer combined with a default-drop packet
    filter is a relatively new one in the computer security field, but it seems that
    new implementations are springing up every day.


    Based on iptables, fwknop is an open source implementation of SPA that provides
    a flexible mechanism for managing multiple users within the SPA paradigm.


    > There is even a project to put HMAC-based SPA directly into iptables; see http://svn.berlios.de/svnroot/portknocking,
    and a discussion thread in the Netfilter development list archives, http://lists.netfilter.org/pipermail/netfilter-dev/2006-October/thread.html.'
