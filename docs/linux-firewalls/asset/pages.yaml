  md: 'The target in the iptables rule above is set to ACCEPT, and so the packet permitted
    to continue on to its destination even after modification takes place within the
    kernel. The webserver at the destination can then decide what to do with the funny-looking
    "/abc/de" path it receives; an error code will most likely be generated and returned
    to the client.


    Replacing application layer data route requires transport layer checksums to be
    recalculated; this is mandatory for TCP and for UDP, depending on whether the
    original packet had the UDP checksum calculated first. Inline data replacement
    offers the potential to silently break certain exploits, and this is a stealthier
    method of responding to attacks generating session-bursting traffic firewall blocking
    rules—which are not easily missed by an attacker.


    # resp


    The resp option provided by the flexreponse and flexresponse2 plug-ins allows
    Snort to respond to network traffic that has triggered a signature match. Available
    responses include sending RST/ACK packets into a session to tear it down (recall
    that the flexresponse and flexresponse2 plug-ins always send RST/ACK packets instead
    of RST packets; see the discussion "RST vs. ACK" on page 63), and generating ICMP
    Net, Host, or Port Unreachable packets in response to UDP. The REJECT target supports
    these functions with the arguments -j REJECT --reject-reset for TCP connections,
    and -j REJECT --reject-with icmp-*unreachable (where * can be net, host, or port)
    for UDP packets.


    One difference in the REJECT target versus the Snort response capability is that
    TCP RST packets can only be sent to one side of a connection. That is, if a packet
    matches an iptables REJECT rule, a TCP RST packet will only be sent against the
    source IP address that is contained within the matching packet, and this IP address
    may be either the client or the server side of the connection. If the TCP stack
    never receives the incoming RST packet because of a local kernel-level filtering
    mechanism (or because an intermediate hop drops), then the session will not be
    properly closed. Fortunately, the REJECT target also drops the matching packet,
    so the TCP session will not proceed further.


    A future version (or a patch provided by the fansort project) of the REJECT extension
    will support sending TCP RST packets to both sides of a TCP connection. If one
    side haves and filters the incoming RST because it is trying to continue a TCP
    connection regardless of whether the other side tries to close it, the RST will
    still force the connection to close (presumably only one side is being unruly).


    The following iptables command combines the use of string extension to RST any
    web sessions that contain the string "/etc/passwd":


    ```

    [iptablesfw]# iptables -A INPUT -p tcp --dport 80 -m string --string "/etc/passwd"
    --algo bm -j REJECT --reject-with-tcp-reset

    ```


    Translating Snort Rules into iptables Rules 169'
