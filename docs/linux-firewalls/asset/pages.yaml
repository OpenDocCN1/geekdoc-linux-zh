  md: "The AUTO_IDS_DANGER_LEVEL variable sets a threshold from 1 to 5 for the minimum\
    \ danger level that an IP address must reach before a blocking rule is instantiated.\
    \ By tuning the port scan thresholds, individual danger levels (see /etc/psad/auto_dl),\
    \ and automatic danger level assignments (see /etc/psad/auto_dl), psad can be\
    \ made to perform granular decisions whether or not to automatically block an\
    \ IP address. For example, if a particular IP address or network (192.168.1.0/24,\
    \ for the sake of example) is a known bad actor because of a history of scans\
    \ or intrusion attempts, then you may want to keep communications on this address\
    \ a tight leash by adding the following line to the /etc/psad/auto_dl file:\n\n\
    ```\n192.168.1.0/24    5;\n```\n\nThen, if IP address within the 192.168.1.0/24\
    \ class C network gets out of line with respect to the filtering policy, a blocking\
    \ rule will be developed against this IP address, regardless of how high AUTO_IDS_DANGER_LEVEL\
    \ is set.\n\n\t\nUnder normal circumstances, iptables is configured not to log\
    \ legitimate traffic to crucial services (such as web sessions or DNS traffic),\
    \ so any IP address within the 192.168.1.0/24 network can access such services\
    \ without interruption, as long as it does not cause iptables to log a packet.\n\
    \n> NOTE Legitimate traffic is somewhat of an amorphous concept, and in Chapters\
    \ 9 and 10, we will see that legitimate does not mean establishing a syntactically\
    \ valid transport layer connection; iptables can also inspect layer data for attacks.\n\
    \nThe AUTO_BLOCK_TIMEOUT variable defines the length of time (in seconds) that\
    \ an blocking rule remains in effect. The default value is 3,600 seconds, or one\
    \ hour. By setting AUTO_BLOCK_TIMEOUT to zero, all blocking rules are made permanent\
    \ and are only removed if psad is restarted or the system is rebooted, using FLUSH_IPT_AT_INT\
    \ initialized.\n\nThe IPTABLES_BLOCK_METHOD and TCWRAPPERS_BLOCK_METHOD variables\
    \ control whether psad uses iptables or tcpwrappers to block offending IP addresses.\
    \ If psad is configured to respond to attacks, the recommended setting is to enable\
    \ blocking iptables.\n\nThe ENABLE_AUTO_IDS_REGEX and AUTO_BLOCK_REGEX variables\
    \ allow the adding of a blocking rule against an IP address to test whether or\
    \ not a logging profile matches a particular expression. This is most useful for\
    \ blocking IP addresses, but only after monitoring an attack that requires bidirectional\
    \ communication through an established TCP session. Because port scans are easily\
    \ spoofed, this feature provides a powerful mechanism to restrict blocking rules\
    \ to IP addresses that are not simply spoofed by an attacker.\n\nFinally, the\
    \ remaining important configuration variables for automatically blocking attackers\
