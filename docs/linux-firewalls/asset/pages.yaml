    # UDP Scan


    Scans for UDP services do not exhibit the same risk as scans for TCP because UDP
    is much simpler than TCP and has no parallel notion of a "connection" as does
    TCP. Fortunately, iptables still lets track packets that are related to UDP communications,
    such as the reply from an external DNS server to a DNS query issued by an internal
    system behind the firewall. This important feature can help us distinguish legitimate
    UDP replies from packets that compose a UDP scan.


