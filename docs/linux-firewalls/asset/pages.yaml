    # Signature Inspection and Log Generation


    The fourth section of fsnort.sh is where the heavyweight packet inspection takes
    place. All of the rules within this section are added to one of the fsnort chains
    mentioned above. Each rule contains elements from the Snort rule header and rule
    options as source and destination IP addresses and port numbers, content strings,
    length, ttl, or to matches, and so on.


    By default, every Snort rule translated by fsnort is an iptables command that
    uses the LOG target along with a logging prefix that is designed to communicate
    specifics to users. The logging prefixes built by fsnort contain the rule number
    within the fsnort chain and Snort ID value, and they indicate whether the signature
    is logged from an established TCP connection.


    For example, the first rule in the FWSNORT_FORWARD_ESTAB chain contains a logging
    prefix that is built up from the Volume Serial Snort signature (SID 1292) and
    looks like this: [1] SID1292_ESTAB


    By default each iptables rule makes use of the comment to annotate the rule with
    the Snort id, msg, classtype, ref, and reference fields, and the fsnort version
    number. For example, for Snort rule 1292, the associated comment is:


    ```

    sid:1292; msg:ATTACK-RESPONSES directory; classtype:bad-unknown; rev: 9;

    FWS:1.0

    ```


    Below is the signature section of the fsnort.sh script. (Note that the iptables
    rules are organized by the corresponding fsnort rules.)


    ```

    ########## attack-rules ##########

    ```


    ```

    #ECHO "[] Adding attack-rules.rules"

    # # all tcp $HOME_net -s $EXTERNAL_net (msg:"ATTACK-RESPONSES

    directory"; established;content:"Volume Serial Number";

    classtype:bad-unknown;sid:1292; rev:9)

    $IPTABLES -A FWSNORT_FORWARD -s 192.168.1.0/24 -p tcp -m state --string

    "Volume Serial Number" --algo bm --comment:"sid:1292;

    directory; classtype:bad-unknown; rev: 9; FWS:1.0"

    -j LOG --log-ip-options --log-tcp-options --log-prefix "[1] SID1292_ESTAB"

    $IPTABLES -A FWSNORT_OUTPUT -p tcp -m state --string "Volume Serial

    Number" --algo bm --comment:"sid:1292; msg:ATTACK-RESPONSES

    directory; classtype:bad-unknown; rev: 9; FWS:1.0";-j LOG

    --log-ip-options --log-tcp-options --log-prefix "[1] SID1292 ESTAB"

    # # all tcp $HTTP_SERVERS $HTTP_PORTS -> $EXTERNAL_net (msg:"ATTACK-

    RESPES command completed"; established;content:"Command completed";

    nocase;reference:bugtrap,1806; classtype:bad-unknown; sid:494; rev:10)

    ```'
