    # iptables Attack Honeypot Visualizations


    The Honeypot Project''s Scan34 iptables data set contains evidence of many events
    that are interesting from a security perspective. Port scans, sweeps, worm traffic,
    and the outright commitment of a particular honeynet system are all represented.

    According to the Scan34 write-up on the Honeynet Project website, all IP addresses
    of the honeynet systems are sanitized and are mapped into the 11.11.0.0/16 Class
    B network (along with a few other systems sanitized as the 22.22.2.0/24, 23.23.23.0/24,
    and 10.22.0.0/16 networks). Many of the graphs in the following sections illustrate
    traffic that originates from real IP addresses outside of the 11.11.0.0/16 network.
    In many cases, the full source address of a scan or attack is mentioned below
    because these addresses are already contained within the public honeynet iptables
    data, but this does not necessarily imply there is still a malicious actor associated
    with these addresses.'
