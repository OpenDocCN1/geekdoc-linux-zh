  md: '# # 14


    # ## VISUALIZING IPTABLES LOGS


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_278_0.png)


    Visualizing security data is becoming increasingly important in today’s threat
    environment on the open Internet. Security devices—from intrusion detection systems
    to firewalls—generate huge amounts of event data as they deal with attacks from
    all corners of the globe. Making sense of this vast amount of data is a tremendous
    challenge. Graphical representations of security data allow administrators to
    quickly see emerging trends and unusual activity that would be difficult to detect
    without dedicated code. That is, a graph is effective at conveying context and
    change because the human eye can quickly discern relationships that are otherwise
    hard to see.


    This chapter explores the usage of psad (http://www.gnuplot.info) and AfterGlow
    (http://afterglow.sourceforge.net/) projects for the production of graphical representations
    of iptables log data. Our primary data source will be iptables logs from the Honeynet
    Project (see http://www.honeynet.org).'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'The Honeynet Project is an invaluable resource for the security community;
    it publicly releases raw security data as Snort alerts and iptables logs from
    live honeynet systems that are under attack. A primary goal of the Honeynet Project
    is to make this security data available for analysis in a series of "sec challenges,"
    and the results of these challenges are posted on the Honeynet Project website.
    In this chapter, we will visualize data from the Scan34 Honeynet challenge (see
    http://www.honeynet.org/scans/scan34). You can download all graphs and Gnuplot
    files referred to in this chapter from http://www.cipherdyne.org/LinuxFirewalls.


    All examples in this chapter assume the Scan34 iptables data file is called iptables.data
    in the current directory.


    # Seeing the Unusual


    Consider the following set of numbers:


    +   5, 4, 2, 1, 3, 4, 55, 58, 70, 85, 120, 9, 2, 3, 1, 5, 4


    This data set represents the number of TCP or UDP ports that a particular IP address
    has connected to every minute; information that can be acquired by parsing iptables
    log data. Notice the spike in the data set where the number of ports quickly increases
    from 4 to 120 and then back to the steady state between 1 and 5.


    When this data is represented graphically with Gnuplot (as shown in Figure 14-1),
    the spike is immediately apparent.


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_279_0.png)


    Figure 14-1: Number of packets to ports per minute'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'A port scan is one possible explanation for this spike. Other explanations
    could be an iptables policy that is improperly configured to log benign traffic,
    or one that incorrectly logs TCP ACK packets that are part of established connections.
    The actual explanation for the spike is not important here—what is important is
    that the spike is unusual. Graphs can easily and quickly show a radical change
    in the status quo, and they allow you to focus your efforts on this problem area.


    In the preceding example, it was relatively easy to see a pattern in such a small
    data set. Now, suppose you are faced with a similar data set consisting of 1,000
    or 100,000 numbers. Extracting trends with the naked eye from so much data is
    daunting daunting unless unless data is graphed.


    Figure 14-2 is a graph of over 800 points that record the number of TCP SYN packets
    logged by an iptables policy over the course of about five weeks at the rate of
    one data point per hour. The data source is the iptables logfile from the Scan34
    Honeynet challenge, and please is used to parse the data for


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_280_0.png)


    Figure 14-2: Number of SYN packets to ports per hour


    > 1 This can happen because of timing issues surrounding the shutdown of TCP connections.
    In particular, the Netfilter connection-tracking subsystem sets a 60-second timer
    on a TCP connection that is in the CLOS_WAIT state; the timeout is variable in
    the linux/net/ipv4/netfilter/ip_conrack_proto.tcp file in the kernel source, but
    sometimes unexpected TCP ACK packets (to finish off the connection via the CLOSING
    and LAST-ACK states) can still be sent after the timer expires. This results in
    the TCP ACK packets not being recognized as part of an existing connection, and
    so delete iptables LOG and DROP rules may then apply.'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'As you can see, it is easy to pick out areas of interest from the graph. The
    x-axis is divided into individual hours and labeled in week-long increments; the
    y-axis shows the number of packets to ports and is labeled in increments of 500.
    The large spike on March 27 quickly points you to a time interval that deserves
    closer scrutiny.


    # # Gnuplot


    The Gnuplot project can generate many types of graphs, from histograms to colorized
    three-dimensional surface plots. It excels at graphing large data sets, such as
    points derived from hundreds of thousands of lines of iptables data.


    For visualizations of iptables log data in this chapter, we use Gnuplot to generate
    both two- and three-dimensional point and line graphs. Gnuplot requires formatted
    data as input, and itself does not have the machinery necessary to parse iptables
    log messages. Ideal input for Gnuplot is a file that contains integer values in
    columns—one for each axis in either two- or three-dimensional graph. This is where
    ps comes in with --gnuplot mode. In this mode, ps parses iptables log data and
    writes the results to a file that can be processed by Gnuplot.


    In order to duplicate the graphs in this chapter on your Linux system (or generate
    new graphs of your own iptables data), you will need to have both ps and Gnuplot
    installed.


    # # Gnuplot Graph Directives


    Gnuplot follows a series of configuration directives when graphing data. These
    directives describe rendering specifics such as graph type, coordinate ranges,
    output mode (e.g., to a graphic file or to the terminal), axis labels, and the
    graph title. Each directive can be set via the Gnuplot interactive shell at a
    command prompt, or via a file that is loaded by Gnuplot. For example, the ports-per-hour
    data in Figure 14-2 are graphed


    ```

    $ fig14-2.gnu

    reset

    ```


    +   - set title "ps iptables log visualization: timestamp dp:counterhour"

    - set terminal transparent nocrop enhanced

    - set output "fig14-2.png"

    - set xdata time

    - set timefmt "%s"

    - set format "%m/%d"

    - set xlabel "time"

    - set xrange ["1140887484":"1143867180"]

    - set ylabel "dp:counterhour"

    - set yrange [0:3000]

    - plot "fig14-2.dat" using 1:2 with lines'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'The most important directives in the fig14-2.gnu file above are the following:


    **set title** The graph title at ①, which is set by psad in this case, we''ll
    see in the next section.


    **set terminal** The terminal settings and output file at ②, which can be omitted
    if you use Gnuplot to launch an interactive window in which you can move a cursor
    over the graph. (This can be helpful when viewing-complicated data sets.)


    **set xdata time** The time setting at ③, along with the time input and output
    formats in the next lines, which tell Gnuplot the x-coordinate of each point is
    a time value.


    **set xrange** The x-axis range at ④ in which the set is to starting and ending
    values of the Scan34 data. (The time values are the number of seconds since the
    Unix epoch, 00:00 UTC on January 1, 1970.)


    **plot** The plot at ⑤ is the most important Gnuplot directive because it tells
    Gnuplot where the data is and how to draw it. In this case, a two-dimensional
    line graph is made of the data within the fig14-2.dat file. Other plot styles
    we will see in this chapter are points graphs in two and three dimensions (the
    plot directive puts Gnuplot in three-dimensional mode). The using 1:2 string specifies
    the column numbers to graph in the fig14-2.dat file; in three-dimensional mode,
    using 1:2:3 tells Gnuplot to plot columns 1, 2, and 3 as the x-, y-, and z-axes.


    # Combining psad and Gnu


    As seen in Chapters 6 and 7, a core piece of functionality offered by psad is
    the ability to parse and interpret iptables log messages. Through the use of a
    series of command-line switches, the parsing ability of psad can be combined with
    the capabilities of Gnuplot.


    The most important of these switches is --command arguments add a degree of configurability
    to the way psad parses iptables logging data and builds the Gnuplot data input
    file, and options are the following:


    ```

    --CSV-fields Sets the fields to extract from the iptables log. Fields that commonly
    used are src, dst, dp, and proto (which are mapped to SRC, DST, DPT, and PRTO
    fields within iptables log messages). Of the --CSV-fields accepts an additional
    match criteria to allow specific values to be excluded or included. For example,
    to include data points only if the source IP address is within the 192.168.50.0/24
    subnet, the destination IP address is within the 10.100.10.0/24 subnet, and the
    destination port is 80, you can use --CSV-fields "src:192.168.50.0/24 dst:10.100.10.0/24
    dp:80". In addition, counting fields over time scales (days, hours, or minutes)
    is supported with the string counthour, countmin.

    ```'
  merge: -1
  pgno: 282
- img_proc: true
  md: '```

    --CSV-regex Performs a regular expression match against the raw iptables log string
    and only includes fields from the message if the regular expression matches. For
    example, to create an nsort logging prefix of Sidnn (see Chapter 10) where nnn
    is set of three digits, you can use --CSV-regex "SID[d]"; Negated regular expressions
    are also supported with the --CSV-neg-regex command-line argument.

    --gnuplot-graph Sets the Gnuplot graph style. Possible values include dots, knots,
    and linepoints.

    --gnuplot-file-prefix Sets a file prefix name that psad uses to create the two
    files prefix.dat and prefix.gnu as iptables data is parsed. The prefix.gnu file
    contains the Gnuplot directives for graphing the data in the prefix.dat file.

    ```


    # AfterGlow


    AfterGlow specializes in visualizing data as link graphs and nodes (in the latest
    release) as tree maps. A link graph is a representation of nodes and edges that
    conveys relationships between the nodes. Such a graph is well-suited to displaying
    data as IP addresses and port numbers. AfterGlow is developed by Rafael Marty,
    founder of the security visualization website http://www.secviz.org, which contains
    example visualizations of everything from SSH connections to iptables policies;
    several AfterGlow users contribute visualizations to the site.


    The psad interface to AfterGlow is similar to the interface with Gnuplot. For
    AfterGlow, the --CSV-fields command-line argument is once again important in order
    to extract the fields from the iptables logfile, and the --CSV-regex and --CSV-neg-regex
    arguments also apply so that data can be filtered with regular expressions.


    For example, have AfterGlow build a graph of outbound SYN packets sent from the
    11.11.0.0/16 network to systems outside the 11.11.0.0/16 network, you can execute
    the following:


    ```

    #ad iptables.data -CSV --CSV-fields "src:11.11.0.0/16 dst:not11.11.0.0/

    16 dp" --CSV-regex "SYN URGP?" | perl afterglow.pl -c color.nf | neato -Tpng

