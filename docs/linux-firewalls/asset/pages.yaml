  md: "Now we use snortproof.pl script to send the attacks described by the exploit.rules\
    \ file (the content field from Snort rule 315 is shown in):\n\n```\n[spoofer]#\
    \ tcpdump -i eth1 -nn -s 0 -X -c 1 635\ntcpdump: verbose output suppressed, use\
    \ -v or -vv for full protocolnlistening on eth, link-type EN10MB (Ethernet), capture\
    \ size 65535 bytes\n23:32:08.56368 IP 11.11.22.22.10000 > 44.44.55.55: UDP, length\
    \ 14\n  0x0000:  c0a8 002a 0000 4000 4011 62f2 0016  E..@/./.\n  0x0010:  c0a8\
    \ 00a8 2710 027b 009c 5e60 0289  ........\n  0x0020:  06fe 68a3 4006 8946    \
    \          ......F...\n1 packets captured\n2 packets received by filter\n0 packets\
    \ dropped\n```\n\nThis appendix discusses how an attacker might force Snort to\
    \ generate false positive events by leveraging the rules as a guide for creating\
    \ malicious-looking traffic. The snortproof.pl script automates this by parsing\
    \ the Snort rules and using sockets to block traffic against a target IP address.\
    \ Although snortproof.pl applies only to the Snort IDS, a similar strategy can\
    \ be employed against any IDS that uses signatures to detect suspicious traffic;\
    \ all you need is copy of the signature set and a slightly modified version of\
    \ snortproof.pl.\n\n# Spoofed UDP Attacks\n\nA countermeasure employed by intrusion\
    \ detection systems is to track the state of TCP connections and only send alerts\
    \ for attacks that are delivered over established sessions. This is not effective\
    \ against attacks that are sent over UDP unless a time-based mechanism is employed\
    \ to track packets sent by clients as well as the corresponding server responses.\
    \ Tracking UDP communications in this way can allow to send alerts for spoofed\
    \ attacks that emulate malicious server responses, but it does not address spoofed\
    \ attacks from UDP clients, because bidirectional communication is not required\
    \ for this traffic. Snort-2.6.1 includes an enhanced stream preprocessor with\
    \ support for UDP, so spoofing UDP server responses has become less effective\
    \ against Snort. In general, parsing the signature set of an IDS and spoofing\
    \ it across the wire is a good way to test any connectiontracking capabilities\
    \ an IDS might offer.\n\nAttack Spoofing 283"
