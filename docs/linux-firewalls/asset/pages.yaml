  md: 'I am aware of someone (let''s call him Bob) who was asked to resign his position
    with his employer because port scans were prohibited by the company policy. In
    an effort to enhance his security, Bob repeatedly scanned his system to make sure
    services were not accessible, the local IDS caught the activity. The IDS alert
    would have sounded if Bob had been using a port-knocking system. Of course, this
    is an extreme example, but it underscores the point that there is no reason to
    call unnecessary attention to oneself.


    # Knock Sequence Busting with Spoofed Packets


    Because port knocking encodes information only within packet headers (as opposed
    to relying on encrypted application layer data), it is easy for an attacker to
    forge packets to look like they are part of a legitimate knock sequence. If an
    attacker spoofs a duplicate packet into a port-knocking sequence as it is en route
    a network, the knock server cannot tell that this additional packet is not part
    of a real sequence from a port-knocking client; the result is that the client
    does not appear to know a valid sequence. This is a Denial of Service (DoS) attack
    against the knock sequence, because an attacker can force the server to not get
    access to legitimate knocking clients. DoS attacks can be complex affairs (such
    as the coordinated flooding of traffic to a single IP address from a network of
    zombie machines), but they can also be exceedingly simple to perpetrate; the DoS
    a port-knocking server with a single packet is trivially easy to perform—it can
    be spoofed from anywhere!


    To illustrate this attack, suppose that the following port-knock sequence has
    been agreed upon by the port-knocking client and server to open TCP port 22 for
    30 seconds (all packets are TCP SYN packets):1001, 2004, 5005, 1001, 1000.1.2.3.
    Now, suppose that the IP address 123.4.3.2 begins the knock sequence to the knock
    server running at IP address 231.1.2.3, with a half-second delay between each
    packet. If an attacker can monitor this sequence as it is being sent over the
    network, the following usage of the hping command will make it appear as the-knocking
    client actually sends the sequence "1001, 2004, 5005, **5005**, 1000" (note the
    duplicate packet to port 5005):


    ```

    [root@attacker ~]# hping -S 5005 -c 1 -a 123.4.3.2 231.1.2.3

    hPING 231.1.2.3) (eth0 231.1.2.3): set 50, 40 headers + 0 data bytes

    ```


    ```

    231.1.2.3 hping statistic

    1 packets transmitted, 0 packets received, 100% packet loss

    round-trip min/avg/max = 0.0/0.0/0.0 ms

    ```


    Hence, the port-knocking server has no choice but to discard the knock sequence
    as invalid, because it appears to originate from the real client''s IP address.
    Therefore SSH access is not granted, and this is illustrated in Figure 2-2.'
