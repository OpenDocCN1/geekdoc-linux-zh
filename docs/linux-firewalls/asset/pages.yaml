    Jul 13 17:12:32 iptablesfw psad: scan detected: 144.202.X.X -> 71.157.X.X tcp:

    [15018-15095] flags: NULL tcp pkts: 45 DL-2

    ```


    # Auto-Response Messages


    We can respond to suspicious traffic using psad by instantiating iptables

    blocking rules against the IP address of the traffic. This feature is

    disable by default, but there are a few syslog messages showing a blocking

    rule being created and destroyed:


    ```

    Jul 12 00:06:37 iptablesfw psad: added iptables auto-block against 144.202.X.X

    for 3600 seconds

    Jul 12 01:06:42 iptablesfw psad: removed iptables auto-block against

    144.202.X.X

    Jul 12 02:14:06 iptablesfw psad: added iptables auto-block against 22.1.X.X

    for 3600 seconds

    Jul 12 03:14:11 iptablesfw psad: removed iptables auto-block against 22.1.X.X

    ```


    These syslog messages show the number of seconds the source IP address

    (144.202.X.X) is added to the iptables policy with a set of DROP rules in the

    INPUT, OUTPUT, and FORWARD chains. Also displayed the syslog alerts that show

    the DROP rules being deleted from the running iptables.


    NOTE For an extensive discussion of the response feature, Chapters 8 and 11.'
