    # Slammer Worm


    The Slammer (or Sapphire) worm was one of the fastest-spreading worms in history.
    It exploited a stack overflow vulnerability in Microsoft SQL Server 2000 and was
    delivered in a single 404-byte UDP packet (including the IP header) to port 1434.


    The Slammer worm can easily be identified in your iptables log data as a packet
    to UDP port 1434 and an IP LEN field of 404. The psad signature set includes the
    PSAD-CUSTOM Slammer communication attempt signature to alert you when the worm
    hits one of your systems. Let''s see if the Slammer was active against the honeynet
    from external sources:


    ```

    # psad -m iptables.data --gnuplot --CSV-fields "timestamp dp:1434,conthour"

    --gnuplot-graph lines --gnuplot-xrange 1140887484:1143867180 --CSV-regex

    LEN=404.\*PROTO=UDP --CSV-regex "SRC=11.11." --gnuplot-file-prefix fig14-9

    $ gnuplot fig14-9.gnu

    ```'
  merge: -1
