  md: '# SYN Cookies


    An interesting method for enabling a TCP stack to perform well under a SYN flood
    is to enable SYN cookies. While a passive IDS cannot implement SYN cookies as
    a response to an attack, SYN cookies are easily enabled on Linux systems via the
    /proc filesystem if the kernel is compiled with CONFIG_SYN_COOKIES support, by
    executing the following command:


    ```

    echo 1 > /proc/sys/ipv4/tcp_synccookies

    ```


    The SYN cookie concept was created by Daniel Bernstein (see http://cr.yp.to/cookies.html)
    and provides a way to reuse the server number during the TCP handshake so that
    it can be reconstruct initial sequence numbers of legitimate clients after they
    return the final ACK. This allows the server to reuse kernel resources that would
    otherwise be reserved in order to create a connection after receiving a SYN packet
    from a client. Because the server does not know if the client will respond with
    an ACK after the server sends the SYN/ACK (and indeed a SYN flood the majority
    of SYN packets will never be accompanied by the final ACK to complete a connection),
    using SYN cookies can provide an effective defense against SYN flood attacks (although
    some have critiqued the SYN cookie technology).


    # UDP Responses


    The lack of structure in UDP makes data transfers fast because UDP lacks the overhead
    of a data acknowledgment scheme like the one in TCP. But the lack of structure
    also means that UDP has no built-in mechanism for convincing a system to stop
    sending UDP packets.


    UDP stacks do, however, use ICMP as a rudimentary response mechanism: If a UDP
    packet is sent to a port where no UDP server is listening (the packet is not intercepted
    by a firewall first), then ICMP Port Unreachable message is usually sent in. For
    example, if we allow UDP packets to port 5001 through the iptables firewall but
    do not a UDP server to it, we see the ICMP Port Unreachable returned to the UDP
    client, as shown below:


    ```

    iptables -I INPUT 1 -p udp --dport 5001 -j ACCEPT

    [ext_scanner]# echo -n "aaaa" | nc -v u 71.157.X.X 5001

    [iptables]# tcpdump -i eth0 -n any port 5001

    tcpdump: verbose output suppressed, -v or vv for full protocol decode

    listening on eth0, link-type EN10MB (Ethernet), capture size 96 bytes

    15:12:30.119336 IP 142.242.X.X.40503 > 71.157.X.X.5001, length 4

    15:12:30.119360 IP 71.157.X.X > 142.242.X.X, ICMP 71.157.X.X unreachable, length
    40

    ```


    > ⁶ Deploying SYN cookies requires that either the local stack supports SYN cookies
    or a separate inline device can proxy TCP connections through a stack that supports
    them.'
  merge: -1
