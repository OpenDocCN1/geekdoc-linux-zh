    # Alerting with psad


    The attack has been detected by fswort, but has only generated a log message from
    iptables; it has not performed any lookups or sent email alerts, because these
    are beyond the scope of its functionality.


    However, because fswort generates an iptables log message, psad can analyze it
    and apply its alerting and reporting machinery to the event. After first, psad
    needs to properly handle fswort log messages. After all, these messages are generated
    by the inspection of application layer data, but the data itself is not included
    in the log messages.


    The key to interpreting the log messages is the SNORT_SID_STR variable in the
    /etc/psad/psad.conf file. This variable describes the portion of the log prefix
    that psad must see in order to infer that the log message is generated by fswort.
    By default, SNORT_SID_STR is as follows:


    | SNORT_SID_STR | SID |


    Any iptables log message that contains a logging prefix with the SID substring
    is a message generated by fswort, and these are nearly always for application
    layer attacks.


