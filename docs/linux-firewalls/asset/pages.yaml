  md: 'The same is true for attacks where the source IP address is spoofed by the
    attacker. Spoofed attacks do not require bidirectional communication, so it is
    risky to respond to them; doing essentially gives control to the attacker over
    who gets blocked in your firewall! It is unlikely that all important IP addresses
    (such as DNS servers, upstream routers, remote VPN tunnel terminations, and so
    on) are whitelisted in your firewall policy, and so giving this control to an
    attacker is risky. Some of the suspicious traffic examples earlier in this chapter,
    as spoofed UDP strings, packets with low TTL values, and Nmap ICMP Echo Requests,
    are perfect examples of traffic that it is not a good idea to actively respond
    to.


    As we will see in later chapters, there are only a few classes of traffic that
    are best met with automated responses.'
