    At this point we have a functional iptables policy that maintains a high level
    of control over the packets that traverse the firewall interfaces, and we have
    a convenient way to rapidly reinstate this policy by executing the iptables-restore
    command against the ipt.save file. This has obvious applications for accelerating
    the system boot cycle, but it is also useful for testing new policies, since it
    makes it easy to revert to a known-good state. There is one thing, however: Altering
    the iptables policy is most easily accomplished by editing a script instead of
    editing the ipt.save file directly (which has a strict syntax requirement that
    is not widely known as, say, a Bourne shell script).


    # Testing the Policy: TCP


    Once an iptables policy has been created within the Linux kernel and connectivity
    with the firewall has been verified, it is a good idea to make sure there are
    no chinks in the virtual armor. It is most important to test the iptables policy
    from a host that is external to the local network, because this is the source
    of the majority of attacks (assuming a huge number of users are not on the system
    network). Effective testing is also important from the internal network, however,
    since one of the internal hosts could be compromised and then used to attack other
    internal hosts (including the firewall), even iptables is protecting the entire
    network.'
