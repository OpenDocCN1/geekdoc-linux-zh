    # Addressing Limitations of Port Knocking


    A brief summary of the problems posed by port-knocking protocols is as follows:


    +   - It is difficult to stop replay attacks from attackers who can monitor port-knocking
    sequences.

    - The lack of effective data transmission limits the types of information and
    the cryptystems that may be used to encrypt sequence data.

    - Any intermediate IDS may set alarm bells when a port-knock sequence is being
    sent over the network.

    - Sequence-busting attacks are trivial to perform, because packet headers are
    not hard to duplicate and spoof.


    By using data in SPA, we can overcome each of these deficiencies:


    +   - SPA solves the replay problem by including random data within every SPA
    packet. Each SPA packet is built according to a well-defined cleartext packet
    format (the specific format used by fwkn is discussed in Chapter 13). This format
    includes space for the random data, and once the packet is constructed, it is
    encrypted. Including random data ensures that no two SPA packets are identical—even
    those that make the same access request to the server. By storing the MD5 sum
    of each successfully decrypted packet on the server side, we can repeatedly send
    the same access request, knowing that no two SPA packets have the same MD5 sum.
    Replay attacks are thus thwarted by comparing the MD5 sum of any new SPA packets
    with those of the previously monitored packets.

    - SPA solves the transmission problem by using the payload portion of IP packets,
    similarly to the way in which TCP encapsulates application data. Using packet
    payloads facilitates the use of asymmetric ciphers for encryption because larger
    amounts of data can be transferred by packet payloads than any port-knocking implementation
    (which just uses packet headers). We can even build a command channel (i.e., the
    communication of complete commands within the encrypted SPA'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'payload) over SPA. We will see in Chapter 13 that fwkn supports both access
    requests and a full command-channel implementation.


    +   - ensures that its network communications do not appear as port scans it uses
    only a single packet to transmit the authentication information. This way, an
    IDS doesn''t see a series of probes to a range of ports. Because the SPA payload
    is encrypted, an IDS can''t decode the content of SPA measures either; anyone
    sniffing will see the SPA packet as an unintelligible blob of payload data.


    +   - Using SPA thwarts spoofing attacks because an attacker cannot trivially
    break the SPA protocol simply by spoofing packets to the SPA server from a client
    system. (Of course, any system that examines packet data over a network is susceptible
    to a DoS if it is flooded with garbage packet data, but this is not a weakness
    in the SPA protocol itself.)


    # Architectural Limitations of SPA


    Despite the security benefits SPA offers for reducing the exposure of a service
    to potential attackers, it also has its limitations. We''ll explore these so that
    you will be able to make informed decisions about how to deploy SPA. Port knocking
    shares these limitations.


    # Access Piggy-Backing via NAT Addresses


    Packet filters are generally good at filtering traffic from the transport layer
    and below, but they are not as good at interpreting the application layer. As
    a result, the filtering criteria an SPA daemon applies to an incoming connection
    (after it receives a valid SPA packet) can only realistically consider the source
    IP address, requested Internet protocol, and the port number. That is, when an
    SPA packet instructs the SPA server to "open TCP port 22 for some source IP address
    for 30 seconds," the server configures the packet filter to accept packets from
    anyone that can connect from the source IP address to TCP port 22 during that
    30-second time window. If the IP address within the SPA client is the external
    NAT address (which is necessary if the SPA client is a NAT device), then anyone
    on the same internal network will have the same access over the allowed time window.7


    # HTTP and Short-lived Sessions


    When an SPA daemon adds a temporary rule in a packet filter rules to allow the
    establishment of a TCP connection, a legitimate client usually has ample time
    for the TCP three-way handshake to complete. However, an SSH session usually lasts
    a lot longer than just the time required to push a TCP connection into the established
    state.


    What happens when the rule is deleted from the ruleset? By using a connection-tracking
    mechanism (such as by Netfilter) to catch packets that are part of established
    connections before they are caught by the


    > The piggybacking problem having a NAT address can be mitigated through the use
    of the MapAddress functionality available in the Tor network, but that introduces
    other disadvantages, as we will discuss in "SPA over Tor" on page 254.'
