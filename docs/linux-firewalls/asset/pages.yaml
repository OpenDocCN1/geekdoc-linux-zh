  md: '# Application Layer String Matching with iptables


    One of the most important features for any IDS the ability to search application
    layer data for telltale sequences of malformed bytes. However, because the structure
    of applications is generally much less strictly defined than that of network or
    transport layer protocols, intrusion detection systems must be flexible when it
    comes to inspecting application layer data.


    For example, when inspecting application layer communications, if an IDS assumes
    certain sequences of bytes are invalid (and may therefore be ignored), then changes
    in the application layer protocol might invalidate this assumption and cause the
    IDS to miss attacks that are delivered in unexpected ways. A vulnerability in
    a particular implementation of such an application layer protocol might be exploitable
    by manipulating the sections within the protocol that the IDS skips.


    We therefore need a flexible mechanism for inspecting application layer data.
    The ability to perform string matching against the entire application payload
    in network traffic is a good first step and is provided by the iptables string
    extension.


    This is the reason why I emphasized enabling string match in “Kernel Configuration"
    on page 14. String matching will also be leveraged heavily in Chapters 9, 10,
    and when we discuss snort.


    The iptables string match extension allows packet data to be searched for matching
    strings using the fast Boyer-Moore string algorithm (see http://www.cutexas.edu/users/best/string-searching/).
    This algorithm is also used by intrusion detection systems, including the champion
    open source IDS Snort (http://www.snort.org), because of its ability to quickly
    match strings within payload data.


    String matching has been available in iptables since the 2.4 kernels, but an architectural
    change with respect to how packet data structures were stored within memory (sk_buff
    structures were allowed to span non-contiguous memory) broke the string matching
    feature in kernels 2.6.0 through 2.6.13.5. The string match extension was rewritten
    for the 2.6.14 kernel, and it has been included within the kernel ever since.


    # Observing the String Match Extension in Action


    In order to test the iptables string matching feature, we construct a simple iptables
    rule that uses the string match extension to verify that it functions as advertised.
    The following rule uses iptables LOG target to generate a syslog when the string
    "tester" is sent to a Netcat server that is listening on TCP port 5001.(We need
    the ACCEPT rule so that the default iptables policy from Chapter 1 will allow
    the establishment of the TCP connection from an external source.)'
