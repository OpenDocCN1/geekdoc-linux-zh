    # psad vs. fsnort


    Although psad can instantiate persistent time-out-based iptables rules against
    an attacker when an attack is detected, it cannot itself tear connections or stop
    the initial packet that matches an application layer signature from being forwarded.
    In the case of fsnort, on the other hand, the DROP or REJECT targets can be used
    to thwart individual malicious packets and sessions, but fsnort cannot construct
    a new iptables rule that blocks an attacker for an extended period of time.


