    U2FsdGVKx18013n8BF5pgMgWCaf8C4cCg5lS1F2TIQTNnwXca93IPNS9Wn9S5Jzzr83uz2YYyXOfMuFDZgYAJUOUXreEwYhjd13YmpcEPXFDqX5Pu30D8ADwaY2Z3rcCNPSiUC9


    Every SPA packet is encrypted and decrypted with either a symmetric-key or an
    asymmetric cipher. A symmetric-key cipher is an algorithm that encrypts and decrypts
    data using the same symmetric designation. The Rijndael cipher, which has been
    selected as the Advanced Encryption Standard (AES), or an asymmetric cipher, on
    the other hand, is an algorithm that encrypts and decrypts data with a pair of
    keys: the public key, which is published publicly, and the private key, which
    is kept secret. The two keys are related via a mathematical conundrum, they are
    not identical (hence the asymmetric designation).


