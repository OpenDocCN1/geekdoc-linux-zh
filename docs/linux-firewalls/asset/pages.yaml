  md: 'Intrusion detection systems and firewalls can also generate ICMP Port Unreachable
    messages in response to UDP traffic. The iptables REJECT target supports this
    with the --reject-with icmp-port-unreachable-command-argument. For example, the
    following sends an ICMP Port Unreachable message after receiving a UDP packet
    at port 5001, and (with all packets generated by iptables) the ICMP Port Unreachable
    message is manufactured from the kernel before the UDP stack even has a chance
    to see it. With this rule in place on the firewall, it does not matter whether
    a UDP server is bound to port 5001 or not. To demonstrate this, we start a UDP
    server listening on port 5001 on the firewall before sending the UDP packet from
    the client, and we''ll show that an ICMP message is sent to the other server which
    is bound:


    ```

    [iptablesfw]# iptables -I INPUT 1 -p udp --dport 5001 -j REJECT --reject-with

    icmp-port-unreachable

    [iptablesfw]# nc -echo "aaaa" | nc -u -p 5001 &

    [1201]

    [ext_scanner]# tcpdump -i eth0 -nn port 5001

    tcpdump: verbose output suppressed, use -v or -vv for full protocol code

    lis on eth0, link-type EN10M (Ethernet), capture 96 bytes verbose output suppressed,
    use -v or -vv for full protocol code

    lis on eth0, link-type EN10M (Ethernet), capture 96 bytes

    15:28:55.949157 144.202.X.X.31726 > 71.157.X.X.5001: UDP, length 4

    15:28:55.949264 71.157.X.X > 144.202.X.X: ICMP 71.157.X.X udp port 5001 unreachable,
    length 40

    ```


    # Firewall Rules and Router ACLs


    Transport responses like tearing down a suspicious TCP connection with a RST or
    sending ICMP Unreachable messages after detecting an attack in UDP traffic can
    be useful in some circumstances. However, these responses only apply to individual
    TCP connections or UDP packets; there is no persistent blocking mechanism that
    can prevent an attacker from trying a new attack.


    Fortunately, sending TCP RST or ICMP Port Unreachable messages can be combined
    with dynamically creating blocking rules in a firewall policy or router ACL for
    an attacker''s IP address and the service that is under attack (hence using both
    network layer and transport layer criteria as part of the blocking rule). For
    example, if an attack is detected from a webserver with the IP address 144.202.X.X,
    the following iptables rules would restrict the ability of this IP address to
    communicate with a webserver for the FORWARD chain:


    ```

    [iptablesfw]# iptables -I FORWARD 1 -s 144.202.X.X -p tcp --dport 80 -j DROP

    ```


    However, once a blocking rule is instantiated against an attacker, the rule should
    be managed by a separate piece of code that can remove it after a configurable
    amount of time. Chapters 10 and 11 discuss iptables response options and configurations
    in more detail.'
