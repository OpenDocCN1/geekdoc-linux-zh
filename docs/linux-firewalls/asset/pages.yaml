  md: 'Network attacks fall into one of three categories:


    **Header abuses** Packets that contain maliciously constructed, broken, or falsified
    network layer headers. Examples include IP packets with spoofed source addresses
    and packets that contain unrealistic fragment offset values.


    **Network stack exploits** Packets that contain specially constructed components
    to exploit a vulnerability in the network stack implementation of an end host.
    That is, the code dedicated to the processing of network layer information is
    the target. A Internet Group Management Protocol (IGMP) Denial of Service (DoS)
    vulnerability discovered in the Linux kernel (versions 2.6.9 and earlier). ⁶


    **Bandwidth saturation** Packets that are designed to saturate all available bandwidth
    on a targeted network. A Distributed Denial of Service (DDoS) attack over ICMP
    is a good example.


    Although this chapter focuses on techniques for abusing the network layer, it
    is important that many of these techniques can be combined with attacks at other
    layers. For example, an application layer attack (say, one that exploits a buffer
    overflow vulnerability) can be sent over fragmented IP packets in an effort to
    evade intrusion detection systems. In this case, the real attack attacks an application
    layer vulnerability but is delivered using a network layer technique called fragmentation
    that makes the application layer attack more difficult to detect.


    # Abusing the Network Layer


    The network layer''s ability to route packets to destinations around the world
    provides the ability to attack targets worldwide as. Because IPv4 has no notion
    of authentication (this job is left to the IPSec protocol or to mechanisms at
    higher layers), it is easy for an attacker to craft IP packets with manipulated
    headers or data and spat them out onto the network. While packets may be filtered
    by an inline filtering device such as a firewall or router with an Access Control
    List (ACL) before reaching their intended target, they frequently not.


    # Nmap ICMP Ping


    When Nmap is used to scan systems that are not on the same subnet, host discovery
    is performed by sending an ICMP Echo Request and a TCP ACK to port 80. (Host discovery
    can be disabled with the Nmap -Pn command-line argument, but it is enabled by
    default.) ICMP Echo Requests generated by Nmap differ from the Echo Requests generated
    by the ping program in Nmap Echo Requests do not include any data beyond


    > The Linux kernel IGMP vulnerability is assigned the designation CAN-204-1137
    in the Common Vulnerabilities and Exposures (CVE) database, which is one of the
    best tracking mechanisms for vulnerabilities available today. See http://cve.mitre.org/cve
    for more information.'
  merge: -1
