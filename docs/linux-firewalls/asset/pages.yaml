  md: 'Client-side vulnerabilities, as the Microsoft JPEG vulnerability, 6 make this
    a realistic possibility if there unpatched systems on the internal network.


    To begin testing the policy, we first test access to TCP ports that should not
    be accessible from either the internal or external networks. Recall RFC 793 requires
    a properly implemented TCP stack to generate a RST/ACK^77 packet when a SYN packet
    is received on closed port. This provides us with an easy way to verify that iptables
    is actually blocking packets, since the absence of a RST/ACK packet in response
    to a connection would indicate that iptables has intercepted the SYN packet within
    the kernel and has not allowed the TCP stack to generate the RST/ACK back to the
    client. We randomly select TCP port 5500 to test from both internal and external
    hosts. The following example illustrates this test and shows that the iptables
    INPUT chain is functioning correctly, since not only are the packets dropped,
    but the appropriate log messages are also generated. We first test from the ext_scanner
    system using Netcat to attempt to connect to TCP port 5500. For the firewall,
    as expected, a message is indicating that iptables intercepted and dropped a TCP
    SYN packet to port 5500:


    ```

    ```bash

    sc -v 71.157.X.X 5500

    iptables#$ tail /var/log/messages | grep 5500

    Apr 16 06:52:43 iptables: Kernel: DROP In=eth0 OUT=

    MAC=00:13:a6:b8:e4:00:06:00:30:b8:48:30:47:00:SRC=144.202.X.X DST=71.157.X.X

    LEN=60 TOS=0x00 PREQ=0x00 TLL=64 ID=45883 PROTO=TCP SYN=5964

    WINDOW=5840 RES=00 SYN=0 URG=OPT (020405B404202080A1FE92416000000103035)

    ```

    ```


    **NOTE** The above iptables log is the first in the book, and you may have making
    sense of it. I will cover iptables log messages in detail (and with an eye towards
    recognizing suspicious traffic) in Chapters 2 and 3.


    Similarly, with the test


    ```

