  md: 'Some port-knocking implementations use successive iterations of a hashing function
    (similar to S/Key authentication, defined in RFC 1760) to stop replay attacks,
    but these methods require that both client and server store some state information.
    Alternatively, we could simply change the shared port-knocking sequence once access
    has been granted, but this is tedious and certainly does not scale well for lots
    of users. (We''ll see in "Single Packet Authorization" on page 226 that there
    is a more elegant way to thwart replay attacks).


    # Minimal Data Transmission Rate


    Because the port fields in the TCP and UDP headers are 16 bits wide, we assume
    that a port-knocking implementation uses only the destination port of each packet
    in the knock sequence, only two bytes of information can be transferred per packet.
    In addition, there is no guaranteed in-order delivery and packet retransmission
    mechanism for port knocking as TCP (port knocking is strictly unidirectional),
    we can''t blast a complete port-knocking sequence onto the network without adding
    a successive packet. We need the time delay to maintain the correct ordering of
    the port-knocking sequence because packets arrive along different routing paths—some
    of which may be slower than others.


    Although there is no optimal time delay that works for all networks (and, if a
    member of the port-knocking sequence is lost, the entire sequence is retransmitted),
    a half-second delay is a good starting point.


    Hence, for a port-knocking sequence that is encrypted with a symmetric cipher
    that has a 128-bit block size (the minimum block size for the Rijndael cipher
    as mentioned earlier in this chapter), we get a minimum length of eight packets
    (128 bits ÷ 16 bits per packet = 8 packets). Adding a half-second delay between
    each packet implies that it would take four seconds to transmit the sequence,
    and if more data needs to be sent, a full second is added for every packet. It
    is lengthy transmission that makes it impractical to construct port-knocking sequences
    that send more than a few bytes.


    > NOTE Because data transmission capabilities of port knocking are so limited,
    it is not feasible to use asymmetric encryption algorithms to encrypt port-knocking
    sequences. Even simply encrypting 10 bytes of information with GnuPG and the 2048-bit
    key would result in several hundred bytes of encrypted information.


    # Knock Sequences and Port Scans


    As discussed in Chapter 3, a port scan involves series of connections to multiple
    ports on a target system within a short period of time. When examined on the wire,
    a port-knocking sequence clearly fits this definition, though the goals of a port
    scan versus a knock sequence are quite different. The trouble is that any intrusion
    detection system that is watching for port scans cannot differentiate between
    the two types of activities, and it generates an alarm for both. These alarms
    may bring unwelcome attention to the person using port knocking to authenticate
    to a remote service.'
