  md: '# INTRODUCTION


    The offense seems to be getting the upper hand. Rarely a day goes by without news
    of a new exploit for a software vulnerability, a more effective method of distributing
    spam (my inbox can attest to this), or a high-profile theft of sensitive personal
    data from a corporation or government agency. Achieving secure computing is a
    perpetual challenge. There is no shortage of technologies designed to foil crafty
    black hats, and yet they continue to compromise systems and networks.


    For every class of security problem, there is almost certainly an open source
    or proprietary solution designed to combat it. This is particularly true in the
    areas of network intrusion detection systems and network access control devices—firewalls,
    filtering routers, and the like. The trend in firewall technology is to combine
    application layer techniques from the intrusion detection world with the ability
    to filter network traffic, something firewalls have been doing for a long time.
    The goal of this book is to show that the iptables firewall on Linux systems is
    well positioned to take advantage of this trend, especially when it is combined
    with some additional software designed to leverage iptables from an intrusion
    detection standpoint.


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_22_0.png)'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'It is my hope that this book is unique in the existing landscape of published
    works. There are several excellent books out there discuss various aspects of
    Linux firewalls, but none to my knowledge specifically on attacks that can be
    detected (and in some cases thwarted) by iptables and the data it provides. There
    are also many books on the topic of intrusion detection, but none focuses on firewalling
    technology to truly supplement the intrusion detection process. This book is about
    the convergence of these two technologies.


    I will devote significant coverage to three open source projects that are designed
    to maximize the effectiveness of iptables for attack detection and prevention.
    These are the projects:


    +   - psad

    An iptables log analyzer and active response tool

    - fswnort

    A script that translates Snort rules into equivalent iptables rules

    - fwknop

    An implementation of Single Packet Authorization (SPA) for iptables


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_23_0.png)


    All of these projects are released as open source software under the GNU Public
    License (GPL) and can be downloaded from http://www.cipherhydydne.org.


    # Why Detect Attacks with iptables?


    > ROSENCRANTZ: I mean, what exactly do you do


    PLAYER: We keep to our usual stuff, more or less, only inside out. We do on stage
    the things that are supposed to happen off. Which is a kind of integrity, if you
    look on every exit being an entrance somewhere else.


    —Tomard, Rosencrantz & Guildstern Are Dead


    If you run the Linux system, you have likely encountered the iptables firewalls.
    This is good for reason, as iptables provides an effective means to control who
    talks to your Linux system over a network connection and how they do it. In the
    vast uncontrolled network that is the Internet, attacks can herald from just any
    corner of the globe—even though the perpetrator might be physically located in
    the next state (or the next room). If you run a networked Linux machine, your
    system is at risk of being attacked and potentially compromised every second of
    day.


    Deploying a script filtering policy is a good first step toward maintaining a
    strong security stance. Even if your Linux system is connected to a network that
    is protected upstream by another firewall or filtering device, there is always
    a chance that this upstream device may be unable to provide adequate protection.
    Such a device might be configured improperly, it suffer suffer a bug or other
    failure, or it might not possess the ability to protect your Linux system from
    certain classes of attack. It is important to achieve a decent level of redundancy
    wherever possible, and the security benefits of running iptables on every Linux
    system (both servers and desktops) can outweigh'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'the additional management overhead. Put another way, the risks of a compromise
    and the value of the data that could be lost will likely outweigh the cost of
    deploying and maintaining iptables throughout your Linux infrastructure.


    The primary goal of this book is to show you how to maximize iptables from the
    standpoints of detecting and responding to network attacks. A restrictive iptables
    policy that limits who can talk to services on a Linux system is a good first
    step, but you will see that you can do things further.


    # What About Dedicated Network Intrusion Detection Systems?


    The job of detecting intrusions is usually left to special systems that are designed
    for this purpose and have a broad view of the local network. This book does not
    advocate this strategy. There is no substitute for having a dedicated network
    intrusion detection system (IDS) as a part of the security infrastructure charged
    with protecting the network. In addition, the raw packet data that an IDS can
    collect is an invaluable source of data. When every security analyst is tasked
    with figuring out what happened during an attack or a system compromise, having
    the raw packet data is absolutely critical to piercing things together, and an
    event from an IDS can point the way. Without an IDS to call attention to suspicious
    activity, an analyst might never suspect that a system is under attack.


    What this book does using iptables to supplement existing intrusion detection
    infrastructures. The main focus of iptables is applying policy restrictions to
    network traffic, not detecting network attacks. However, iptables offers powerful
    features that traditionally lie within the purview of intrusion detection systems.
    For example, the iptables logging format provides detailed data on nearly every
    field of the network and transport layer headers (including IP and TCP options),
    and the iptables string matching capability matches against application layer.
    Such abilities are critical for the ability to detect attempted intrusions.


    Intrusion detection systems are usually passive devices that are not configured
    to automatically take any punitive action against network traffic that appears
    to be malicious. In general, this is for good reason because the risk of misidentifying
    benign traffic as something sinister (Known as a false positive). However, some
    IDS can be deployed to inline traffic, and when deployed in this manner a system
    is typically referred as a network intrusion prevention system (IPS). iptables
    is always inline to network traffic, which allows many attacks to be filtered
    out before they cause significant damage. Many organizations have been hesitant
    to deploy an inline IPS in their network infrastructure because of connectivity
    and performance concerns. However, in some circumstances having the ability to
    filter traffic based on application layer inspection criteria is quite useful,
    and on Linux systems, iptables can provide basic IPS functionality by recasting
    IDS signatures into iptables policies to thwart network attacks.


    > Despite the folks-sounding name and the endless vendor marketing hype, a network
    intrusion prevention system would be nothing without a way to detect attacks—and
    the detection mechanisms from the IDS world. A network IPS usually just has some
    extra to handle inline traffic and respond to attacks in this context.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Defense in Depth


    Defense in depth is a principle that is borrowed from military circles and is
    commonly applied to the field of computer security. It stipulates that attacks
    must be expected at various levels within an arbitrary system, it may be anything
    from a computer network to a physical military installation. Nothing can ever
    ensure that attacks will never take place. Furthermore, some attacks may be successful
    and compromise or destroy certain components of a system. Therefore, it is important
    to employ multiple levels of defensive mechanisms at various levels within a system;
    where attack compromises one device, another may succeed in limiting additional
    damage.


    In the network security space, Snort is the champion of the open source intrusion
    detection world, and many commercial vendors have produced excellent firewalls
    and other filtering devices. However, if you are running Linux within your infrastructure,
    the real question is whether it is prudent to rely solely on these security mechanisms
    to protect your critical assets. The defense-in-depth principle indicates that
    iptables can serve as an important supplement to securing security infrastructures.


    # Prerequisites


    This book assumes familiarity with TCP/IP networking concepts and Linux system
    administration. Knowledge of the Open System Interconnection (OSI) Reference Model
    and the main network and transport layer protocols (IPv4, ICMP, TCP, and UDP),
    as well as knowledge of the DNS and HTTP application protocols would be most helpful.
    Although frequent references are made to the various layers of the OSI Reference
    Model, the network, transport, and application layers (3, 4, and 7, respectively)
    receive the vast majority of the discussion. The session and presentation layers
    are not covered, and the physical and data link layers are briefly touched upon
    (comprehensive information on layer 2 filtering can be found at http://ebtables.sourceforge.org).
    The coverage of the network, transport, and application layers emphasizes attacks
    that are possible at each of these layers—knowledge of the structure and functionality
    of each of these layers is largely assumed. Even though wireless protocols and
    IPv6 are not specifically discussed, many of the examples in the book apply to
    these protocols as well.


    A working knowledge of basic programming concepts (especially with the Perl and
    C programming languages) would also be useful, but code examples are generally
    broken down and explained. A few places in the book show raw packet data displayed
    via the tcpdump sniffer, so some experience with an Ethernet sniffer such as tcpdump
    or Wireshark would be helpful. With the exception of the material described above,
    no prior knowledge of computer security, network intrusion detection, or firewall
    concepts are assumed.


    Finally, this book concentrates on network attacks—detecting them and responding
    to them. As such, this book generally does not discuss host-level security issues
    such as the need to harden the system running iptables by removing compilers,
    severely curtail user accounts, applying'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'the latest security patches, and so on. The Bastille Linux project (see http://
    www.bastille-linux.org/) provides excellent information on host security issues,
    for the truly hard-core, the NSA SELinux distribution (see http:// www.nsa.gov/selinux)
    is a stunning effort to increase system security starting with the component that
    counts the most—the kernel itself.


    # # Technical References


    The following titles are excellent supporting references for the more technical
    aspects of this book:


    +   * Building Internet Firewalls, 2nd Edition; Elizabeth D. Zwicky, Simon Cooper,
    and D. Brent Chapman (O''Reilly, 2000)


    +   * Computer Networks, 4th Edition; Andrew S. Tannenbaum (Prentice Hall PTR,
    2002)


    +   * Firewalls and Internet Security: Repelling the Wild Hacker, 2nd Edition;
    William R. Chebyshev, Steven M. Bellovin, and Aviel D. Rubin (Addison-Wesley Professional,
    2003)


    +   * Linux System Security, 2nd Edition; Scott Mann and Aviel L. Mitchell (Pearson-Education,
    2002)


    +   * Programming Perl, 3rd Edition; Larry Wall, Tom Christiansen, and Jon Orvant
    (O''Reilly, 2000)


    +   * The Tao of Network Security Monitoring: Beyond Intrusion Detection; Richard
    Bejlich (Addison-Wesley Professional, 2004)


    +   * The TCP/IP Guide; Charles M. Kozierok (No Roach Press, 2005)


    +   * TCP/IP Illustrated, Volume 1: The Protocols; W. Richard Stevens (Addison-Wesley,
    1994)


    # # About the Website


    Contained within this book are several example scripts, iptables policies and
    commands, and instances of network attacks and associated packets. All of these
    materials can also be downloaded from the book''s companion website, which is
    available at http://cipherdyne.org/LinuxFirewalls. Having an electronic copy is
    the best way to tinker and experiment with the concepts and code yourself. Also
    available on the website are examples of the psad, fsnort, and fwmap project along
    with documentation and the Trace project (trac.edgewall.com), which enables you
    to view the source code for each project. The source code for each project is
    carefully archived within a Subversion repository (http://subversion.tigris.org)
    so that it is easy to visualize how the code changes from one version to the next.
    Finally, some interesting graphical representations of iptables log data can also
    be found on the website.


    If you have questions going through this book, you may also find answers on the
    book''s website. Please do not hesitate to ask me any questions you may have regarding
    any of the material covered. You can reach me via email at mbr@cipherdyne.org.'
  merge: -1
