  md: '# More-Nonsense Books from


    # NO STARCH PRESS


    # HACKING, 2ND EDITION


    The Art of Exploitation


    by JON ERICSON


    While security books merely show how to run existing exploits, Hacking: The Art
    of Exploitation was the first book to explain how exploits actually work—and how
    readers can develop and implement their own. In this all-new second edition, Jon
    Erickson uses practical examples to illustrate the fundamentals of serious hacking.
    You''ll learn about key concepts underlying common exploits, such as programming
    errors, assembly language, networking, shellcode, cryptography, and more. The
    bundled Linux CD provides an easy-to-use, hands-on learning environment. This
    edition has been extensively updated and expanded, including a new introduction
    to low-level workings of computers.


    OCTOBER 2007, 480 PP. W/D, $49.95 ($39.95 CDN)

    ISBN 978-1-59327-144-2


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_331_0.png)


    # PRACTICAL PACKET ANALYSIS


    Using Wireshark to Solve Real-World Network Problems


    by CHRIS SANDERS


    Wireshark (formerly called Ethereal) is the world''s most powerful "packet sniffer,"
    allowing users to uncover valuable information about computer networks (whether
    theirs or others). Rather than simply take packets through Wireshark''s tools,
    Practical Packet Analysis shows how to use the software to monitor your own networks.
    The book is aimed at network engineers and system administrators, but it is clear
    enough for Wireshark newbies. The author begins by discussing understanding of
    how networks communicate and builds from to give readers a solid understanding
    of how packets travel along the wire. The second half of the book contains real-world
    examples and case scenarios that help readers apply the knowledge they''ve learned
