  md: '# Snort Options and iptables Packet Filtering


    So far, we have discussed those Snort rule options for which there is only logging
    support in iptables. Now we''ll look at Snort rule options for which iptables
    also provides both explicit matching and filtering support. Snort rules that use
    these options can be translated into equivalent iptables rules (subject to certain
    constraints discussed later in this section), and any of the standard iptables
    targets (DROP, LOG, REJECT, and so) can be applied to a matching packet. Snort
    options that fall into this category include:


    +   - content

    - uricont

    - offset

    - depth

    - distance

    - within

    - dsize

    - itype

    - ip_proto

    - flow

    - ttl

    - tos

    - ipopts


    The content option in the Snort rules language requires an argument in the form
    of a sequence of bytes, say /bin/sh, and Snort uses the Boyer-Moore string search
    algorithm to search application data for these bytes. The iptables string match
    extension uses an also in-kernel implementation of the same algorithm (selected
    by the user) to search for sequences of bytes within the application payload of
    packets as they enter into the networking stack.


    Given the string "bin/sh" in a content option within a Snort rule, the equivalent
    iptables arguments are -m string --string --algo bm "bin/sh". For example, the
    following Snort rule detects the string "bin/sh" is directed at a DNS server over
    UDP port 53:


    ```

    alert udp any -> any 53 (msg: /bin/sh attempt; content: "bin/sh";nsid: 100001

    ```


    This Snort rule can be translated into an equivalent iptables rule by executing:


    ```

    [iptablesfw] iptables -A FORWARD -p udp --dport 53 -m string --string "/bin/sh"
    --algo bm -j LOG --log-prefix "SID100001"

    ```


    uricont


    The uricont option enables Snort to handle URL-encoded data that is transferred
    over HTTP. This option is integrated directly with the Snort rules language (as
    opposed to only being implemented in a preprocessor) because of the rise in importance
    of web-application communications and the subsequent need to detect attacks that
    target these applications. An attack against a webserver that supports URL-encoded
    data'
