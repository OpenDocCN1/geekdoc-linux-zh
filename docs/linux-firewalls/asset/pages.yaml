  md: '# Passive OS Fingerprinting with p0f


    Given psad''s propensity for passive detection versus actively generating network
    traffic, OS fingerprinting is not used. We will continue the discussion from the
    perspective of what is possible with strictly passive means.


    One of the most well-known and successful passive operating system implementations
    is p0f, developed by Michal Zalewski (http://lcamt.coredup.com). As it turns out,
    if you can possibly intercept TCP packet data, because you have access to a network
    segment over which packets are flowing or because packets are directed at or originate
    from a system that you control, you can glean a lot of interesting information
    that is useful for OS fingerprinting. TCP SYN and SYN/ACK packets contain the
    most information, because they define the parameters under which TCP connections
    are supposed to behave and negotiate these parameters with some distinction.


    In the p0f incarnation of OS fingerprinting, a remote operating system is identified
    by examining several fields within the IP and TCP headers of TCP SYN or SYN/ACK
    packets that originate from the system. These fields include


    +   * Fragmentation bit

    * Initial TTL value

    * Maximum Segment Size (MSS)

    * Overall SYN packet size

    * TCP option values and order

    * TCP window size


    p0f uses a custom signature format to store the specific parameters mentioned
    above for each OS. For example, here''s a fingerprint for a Linux system running
    the 2.5 kernel (the signature needs to be updated because it really refers to
    the stable 2.6 kernel instead of the 2.5 development kernel, and an allowance
    is made within the fingerprint for the 2.4 kernel as well):


    ```

    53:64:1:60M*,S,T,N,W1::Linux:2.5 (sometimes 2.4) (1)

    ```


    The p0f signature format has several fields separated by colon (:):


    +   * Reading from left to right, the first field, 53, refers to the TCP window
    size. This field instructs p0f to look for TCP SYN packets with a window size
    that is a multiple of three times the value of the Maximum Segment Size (MSS).


    +   * The second field, 64, refers to the TTL in the IP header; in this case a
    TTL of 64. Because TTL values are decremented as packets traverse the Internet,
    this field refers to the initial TTL value, and p0f allows the actual TTL value
    in the packet to be significantly less.


    +   * The third field, 1, refers to the Don Fragment (DF) bit in the IP header.
    Because the signature has the value 1 in this field, it is looking for the DF
    bit to be set.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '+   The fourth field, 60, is the overall packet size. In this example, the
    signature requires the size to be 60 bytes.


    +   The fifth field, S,T,N,W, describes the options portion of the TCP header.
    In this example, the signature is looking for any MSS, followed by the Selective
    Acknowledgement (S), Timestamp (T), and Window Scaling Factor (W).


    A comprehensive treatment of passive OS fingerprinting (and other passively collected
    information) can be found in Michal Zalewski''s Silence on the Wire (No Starch
    Press, 2005).


    # Emulating pof with psid


    In order to run its fingerprinting algorithm over packet headers, pof uses libcap
    to sniff packets off the wire. By contrast, psid contains code that implements
    OS fingerprinting based on port signatures but only iptables messages as the data
    input. This is possible because every header value examined by pof (TCP window
    size, TTL value, options, and so on) is also available in iptables messages as
    long as the --tcp-options argument is used to decode the LOG rule. Here''s an
    example log message in which the options portion of the TCP header is shown:


    ```

    Jul 14 22:03:42 iptables kernel: DROP IN=eth0 OUT= MAC=00:13:a6:32:31:4b:00:00:28:42:5a:08:00
    SRC=192.168.1.10 DST=192.168.1.10 LEN=60 TOS=0x10 PRE=0000 TTL=64 ID=37356 PROTO=TCP
    SPT=54422 DST=23 WINDOW=5840 RES=0x00 SYN URG=0 OPT=(020405840402080A008CE7900000001030302)

    ```


    # Decoding TCP options from iptables


    The only trick to implementing pof fingerprinting with log messages like the one
    shown above is the long OPT hex dump has to be decoded in order to match against
    a of signature. The OPT string represents a decoded dump of the TCP options portion
    of the TCP header, and by examining the string one by one and matching it against
    the set of possible values in the TCP header (http://www.iana.org/assignments/tcp-parameters),
    the options used in a SYN packet become clear. Except for the End of List and
    No Operation (NOP) options which are each one byte wide, every option is designated
    by a type, is followed by the length, and ends with the value. This is called
    Type-Length-Value (TLV) encoding.


    For example, the beginning of the hex above, 02040584, decodes as 02 = Maximum
    Segment Size, 04 = Length (including the type byte), 05B4 = 1460 (decimal value).
    Continuing this analysis similarly for the entire hex dump yields the following:


    +   - Maximum Segment Size is 1460


    +   - NOP


    +   - Selective Acknowledgement is OK


    +   - Timestamp is 188383790


    +   - Window Scaling Factor is 2'
