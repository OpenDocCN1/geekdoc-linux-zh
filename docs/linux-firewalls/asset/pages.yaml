  md: '# FOREWORD


    When hearing the term firewall, most people think of a product that inspects network
    traffic at the network and transport layers of the OSI Reference Model and makes
    pass or filter decisions. In terms of products, dozens of firewall types exist.
    They are differentiated by the data source they inspect (e.g., network traffic,
    host processes, or system calls) and the depth to which they inspect those sources.
    Almost any device that inspects communication and decides whether to pass or filter
    could be considered a firewall product.


    Marcus Ranum, inventor of the proxy firewall and the implementer of the first
    commercial firewall product, offered a definition of the term firewall in the
    mid-1990s when he said, "A firewall is the implementation of your Internet security
    policy.\¹ This is an excellent definition because it is product-neutral, timeless,
    and realistic. It applies equally well to the original firewall book, Firewalls
    and Internet Security by William R. Cheswick and Steven M. Bellovin (Addison-Wesley
    Professional, 1994), and as it does to the book you''re reading now.


    ¹ Computer Security Journal, Vol. XI, No. 1, Spring 1995 (http://www.spirit.com/CSI/Papers/hownot.htm)'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'In the spirit of Ranum''s definition, a firewall could also be considered a
    policy enforcement system. Devices that inspect and pass or filter traffic could
    called network policy enforcement systems. Devices that inspect and pass or filter
    host-centric activities could be host policy enforcement systems. In either case,
    emphasis on policy enforcement focuses attention on the proper role of the firewall
    as a device that implements policy instead of just that "stops bad stuff."


    With respect to "bad stuff," it''s reasonable to ask if firewalls even matter
    in today''s era. Properly configured traditional firewall basically deny all allowed
    Internet protocols, IP addresses, TCP/UDP ports, and ICMP types and codes. In
    the modern attack environment, this sort of defense is entirely insufficient.
    Restricting the ingress and egress paths to a target, but network and transport
    layer filtering has been a completely inadequate measure for at least a decade.


    In 2007, the most effective way to compromise a client is to entice the user to
    activate a malicious executable, use the link that hosts malicious content, or
    attack any client-side component of the user''s computing experience. In many
    cases, exploitation doesn''t rely on a vulnerability that could be patched or
    a configuration that could be tightened. Rather attackers exploit weaknesses in
    rich-media platforms like JavaScript and Flash, which are increasingly reliable
    for browsing the Web today.


    In 2007, the most effective way to compromise a client is to avoid the operating
    system and exploit the application. Web applications dominate the server landscape,
    and they are more likely to suffer from architectural and design flaws from vulnerabilities
    that can be patched. In the late 1990s, it was fashionable to change the prices
    for the items in one''s shopping cart by later the shopping cart is running on
    the client and users are changing prices—and worse.


    All of this makes the picture seem fairly bleak for firewall products. Many have
    adapted by incorporating deep packet inspection or at or beyond the application
    layer of the OSI Reference Model. Others use intrusion prevention systems, using
    a clever marketing term to differentiate themselves in a seemingly commoditized
    market. Is there a role for firewalls, especially open source products, in the
    age of client-side attacks and web exploitation?


    The answer is yes—and you are reading one right now. Michael Rash is a pioneer
    in the creative use of network technologies for defensive purposes. The security
    research and development world tends to be dominated by offensive tools and techniques,
    at a quick glance at the speakers list for a certain Las Vegas hacker convention
    will demonstrate. Michael continues to invent and improve methods for protecting
    assets from attack. After getting a look at the dark side at an offensive course,
    almost all of us return to the seemingly mundane task of protecting our enterprises.
    Thanks to this book, we have an additional suite of programs and methods to make
    our jobs easier.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'While reading a draft of this book, I identified a few themes. First, host-centric
    defense is increasingly important as devices become self-reliant and exposed to
    the Internet. An extreme example of this evolution is the introduction of IPv6,
    which deployed as intended by its progenitors restores the "end-to-end" nature
    of the original Internet. Of course, end-to-end can be translated into attacker-to-victim,
    so additional ways for hosts to protect themselves are appreciated. Linux Firewalls
    will teach you how hosts can protect themselves using host-based firewalls and
    tools.


    Second, despite the fact that hosts must increasingly defend themselves, host-centric
    measures alone are inadequate. If one host has been compromised, it is no longer
    responsible for its own defenses. Upon breaching a system, intruders routinely
    disable firewalls, antivirus software, and other protective devices. Therefore,
    network-centric filtering devices are required wherever possible. An endpoint
    controlled by a victim can only use the communication channels allowed by the
    network firewall, at least limiting the freedom to maneuver by the intruder. Linux
    Firewalls will teach you how network devices protect hosts.


    Third, we must look at creative ways to defend our assets and understand the attack
    landscape. Single Packet Authorization is a giant step beyond knocking if one
    wants to limit access to sensitive services. Visualization helps render logs and
    in a way that enables analysts to detect subtle events of interest. After reading
    this book, you may find additional ways to leverage your defensive infrastructure
    not anticipated by others, including the author.


    I''d like to conclude these by speaking as a book reviewer and author. Between
    2000 and 2007, I''ve read and reviewed nearly 250 technical books. I''ve also
    written several books, so I believe I recognize a great book when I see it. Linux
    Firewalls is a great book. I''m a FreeBSD user, so Linux Firewalls is enough to
    make me consider using Linux in certain circumstances! Mike''s book is exceptionally
    clear, organized, concise, and actionable. You should be able to read it and implement
    everything you find by following his examples. You will not only familiarize yourself
    with tools and learn to use techniques, but you will be able to appreciate the
    author''s keen defensive insights.


    The majority of the world''s global security professionals focus on defense, leaving
    offense to the bad guys, police, and military. I welcome books like Linux Firewalls
    that bring real defensive tools and techniques to the masses in a form that can
    be digested and deployed for minimum cost and effort.

    Good luck—we all need it.


    Richard Bechtlich

    Director of Incident Response, General Electric

    Manassas Park, VA'
