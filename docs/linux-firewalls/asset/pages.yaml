  md: '# TCP Idle Scans


    The TCP idle scan is an advanced scanning mode that requires three systems: a
    system to launch the scan, a scan target, and a zombie host running a TCP server
    that is not heavily utilized (hence the “idle” part of the scan’s name). The idle
    scan is illustrated in Figure 3-6.


    ![](img/84e6ec42d170b9df6cf29b40151f3d15_80_0.png)


    Figure 3-6: TCP idle scan


    The idle scan exploits the fact that IP increments the ID value by one for every
    packet that is sent through the IP stack. The scans combine with the requirement
    that a TCP stack send a SYN/ACK in response to a SYN packet to an open port, or
    a RST/ACK packet in response to a SYN packet to a closed port. In addition, all
    TCP stacks are required to ignore unsolicited RST/ACK packets. Together, these
    facts allow the scanner to watch how the zombie host increments the IP values
    during a TCP session that is maintained from scanner to the zombie host, while
    the scanner spoofs SYN packets with the zombie host’s IP address at the target
    system. the scanner is able to monitor IP ID values in the IP header of packets
    coming from the zombie system, and from this information it is able to extrapolate
    whether ports are open or closed on the target.


    When a SYN packet is sent from the scanner to an open port on the target (see
    Figure 3-6) with the source IP address spoofed as the zombie, the target responds
    with a SYN/ACK (to the zombie). Because the packet that the zombie receives is
    actually unsolicited (it was spoofed from the scanner), it responds with a RST
    to the target system, incrementing the IP counter by one. If a SYN packet is sent
    from the scanner to a closed port on the target (again with the source IP address
    spoofed), the target responds to the zombie with a RST/ACK, and the zombie ignores
    this unsolicited packet. In this case no packet is sent from the zombie, the IP
    value is not incremented.


    By monitoring how the IP values are increased (by one for ports on the target,
    and not at all closed ports), the scanner can infer


    > The RST packet from the zombie does not contain the ACK bit in this case the
    SYN/ACK from the target does not have the ACK bit. More material on the circumstances
    under which an ACK bit is set on a RST packet is included in ‘RST vs. RST/ACK’
    on page 63.'
  merge: -1
  pgno: 80
