    # 引言


    Linux 已经很久了。它最初只是一个非常聪明的学生的学术项目，而现在代表了全球许多企业服务器的主要解决方案。此外，Linux 操作系统作为终端用户桌面的解决方案正在赢得越来越多的追随者。凭借专门为
    Linux 构建的视觉界面（`KDE`、`GNOME`），该系统的操作变得像 `Windows` 或 `MacOS` 一样简单，并且越来越不再被认为仅仅是供学术界或程序员使用的操作系统。


    此外，如果你为数字电视使用 `set-topbox`，或者你家里有智能报警器，这些设备可能也使用了 Linux 操作系统。这是因为 Linux 操作系统已被移植到各种类型的处理器或设备，变成了我们现在所说的“嵌入式
    Linux”。


    尽管市场份额很小，但目前已经有使用 `Ubuntu` Linux 版本的手机。Linux 未来是否会在手机市场占据重要份额还有待待观察。但已经有手机在使用该操作系统的这一事实证明了
    Linux 解决方案如今已变得多么多功能且灵活。


    Linux 的第一个程序编写于 `1991` 年。这已经是 25 年前的事了，对于软件市场以及整个 IT 市场来说，这是一个相当漫长的年代。在过去的 25
    年里，我们看到了许多经历过辉煌时期后被其他产品取代的软件。我们还看到曾经声誉巨大的公司现在处于辉煌的黄昏或已经倒闭。但这种情况没有发生在 Linux 身上。随着时间的推移，Linux
    变得越来越强大。它“永葆青春”的秘密似乎在于使用了 `GNU GPL` 许可证，这种许可证允许任何人免费使用该操作系统。此外，这种许可证的使用在“免费”的含义上具有更广泛的范围。这是运行、复制、分发、研究、修改和改进软件的自由。这种“自由”的方面吸引了世界各地大量的爱好者和程序员，他们热衷于为
    Linux 的开发贡献力量。这最终创造了一种难以复制的协同效应，而对于一个代码对普通公众不可见、且仅由一家或一组公司开发和维护的软件系统来说，这是很难做到的。


    如果你还不知道这一点，这里需要注意：Linux 并不是 `UNIX`。但存在一个互换使用这些术语的趋势。这是因为 Linux 和 `UNIX` 在用法方面有许多共同点。


