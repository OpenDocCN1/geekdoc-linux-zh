    ## Handling signals


    Linux signals are asynchronous notification sent from one process to one or more
    processes in order to inform that a particular event has occurred.


    The receiving processes may handle or ignore the incoming signal. All signals
    can de ignored except one (`SIGKILL`). `SIGKILL` is the signal that Linux uses
    to forcefully close programs that misbehave, or when Linux needs to free up some
    memory or forcefully close running applications during shutdown operation.


    Below is a list of all the Linux signals and a short description for each of them:


    | Sig # | Sig name | Note |

    | :--- | :--- | :--- |

    | 1 | SIGHUP | If a process is being run from terminal and that terminal is closed
    then the process receives this signal. |

    | 2 | SIGINT | The process was "interrupted". This happens when Control+C is pressed..
    |

    | 3 | SIGQUIT | |

    | 4 | SIGILL | Illegal instruction. The program contained some machine code the
    CPU cannot execute. |

    | 5 | SIGTRAP | This signal is used mainly from within debuggers and program tracers.
    `gdb` is using this signal under the hood to implement breakpoints or step-by-step.
    |

    | 6 | SIGABRT | The program called `abort()` function. This is an emergency stop
    than the normal termination of the program. |

    | 7 | SIGBUS | This is caused by an attempt was made to access memory incorrectly.
    |

    | 8 | SIGFPE | This is caused by a floating point exception that happened in the
    program. |

    | 9 | SIGKILL | The process was explicitly killed by somebody intending to stop
    the program. |

    | 10 | SIGUSR1 | Available for the programmers to use it for custom purposes.
    |

    | 11 | SIGSEGV | This is caused by an attempt to access memory not allocated to
    the process. |

    | 12 | SIGUSR2 | Available for the programmers to use it for custom purposes.
    |

    | 13 | SIGPIPE | If a process is producing output that is being fed into another
    process via a pipe ("producer") and the consumer dies then the producer is sent
    this signal. |

    | 14 | SIGALRM | A process can request a "wake up" from the operating system at
    some time in the future by calling `alarm()` function. |

    | 15 | SIGTERM | The process was explicitly killed by a user or a process intending
    to kill program. |

    | 16 | | |

    | 17 | SIGCHLD | The process had previously created one or more child processes
    with `fork()`. One or more of these processes has since died. |

    | 18 | SIGCONT | If a process has been paused by sending it `SIGSTOP` then sending
    `SIGCONT` to the process wakes it up ("continues" it) |

    | 19 | SIGSTOP | A process that receives `SIGSTOP` signal is paused by the operating
    system. All its state is preserved for it be restarted (by `SIGCONT`). |

    | 20 | SIGTSTP | Pretty much the same as `SIGSTOP`. This is the signal sent when
    the user hits Control+Z on the terminal. |

    | 21 | SIGTTIN | The operating system sends this signal to a backgrounded process
    when it tries to read input from its terminal. |

    | 22 | SIGTTOU | The operating system sends this signal to a background process
    when it tries to write output to its terminal. |

    | 23 | SIGURG | The operating system sends this signal to a process using a network
    connection when "urgent" out of band data is sent to it. |

    | 24 | SIGXCPU | The operating system sends this signal to a process that has
    exceeded its CPU limit. |

    | 25 | SIGXFSZ | The operating system sends this signal to a process that has
    tried to create a file above the file size limit. |

    | 26 | SIGVTALRM | This is very similar to `SIGALRM`, but while `SIGALRM` is sent
    after a certain amount of real time has passed, `SIGVTALRM` is sent after a certain
    amount of time has been running the process. |

    | 27 | SIGPROF | This is also very similar to `SIGALRM` and `SIGVTALRM`, but while
    `SIGALRM` is sent after a certain amount of real time has passed, `SIGPROF` is
    sent after a certain amount of time has been running the process and running system
    code on behalf of the process. |

    | 28 | SIGWINCH | A process used to be sent this signal when one of its windows
    was resized. |

    | 29 | SIGIO | A process can receive this signal when there is some input ready
    for it to process or an output channel has become ready for writing. |

    | 30 | SIGPWR | A signal sent to processes by a power management service to indicate
    that power has switched to a short term emergency supply. |

    | 31 | SIGSYS | Unused |


    `gdb` is capable of detecting the occurrence of any signal during a debug session.
    Upon receiving a signal `gdb` can do any of the following actions depending upon
    your debugging strategy:


    - **Stop**: interrupt the execution of the program and present the `gdb` prompt

    - **Print**: display information about the occurrence on the signal on the standard
    output

    - **Pass to program**: relay the signal to the debugged program thus allowing
    the program to handle the signal as it would do it in normal circumstances.


    In order to see what actions `gdb` is configured to do for each of signals the
    `info signals` `gdb` command can be used:


    ```

    (gdb) info signals

    Signal Stop Print Pass to program Description

    SIGHUP Yes Yes Yes Hangup

    SIGINT Yes Yes No Interrupt

    SIGQUIT Yes Yes Yes Quit

    SIGILL Yes Yes Yes Illegal instruction

    SIGTRAP Yes Yes No Trace/breakpoint trap

    SIGABRT Yes Yes Yes Aborted

    SIGEMT Yes Yes Yes Emulation trap

    SIGFPE Yes Yes Yes Arithmetic exception

    SIGKILL Yes Yes Yes Killed

    ...

    ```


    If I want to see information only about a single signal then I would simply need
    to add the signal name at the end of the `info signals` `gdb` command as in the
    following example:


    ```

    (gdb) info signals SIGTERM

    Signal Stop Print Pass to program Description

    SIGTERM Yes Yes Yes Terminated

    ```


    `gdb` allows controlling the handling of signals by using `handle` command. Here
    is for example how I can disable all the three actions for the `SIGTERM` above:


    ```

    (gdb) handle SIGTERM nostop noprint ignore

    Signal Stop Print Pass to program Description

    SIGTERM No No No Terminated


    (gdb) info signals SIGTERM

    Signal Stop Print Pass to program Description

    SIGTERM No No No Terminated

    ```


    To undo the last command and revert back to the default `SIGTERM` handling I can
    do the following:


    ```

    (gdb) handle SIGTERM stop print noignore

    Signal Stop Print Pass to program Description

    SIGTERM Yes Yes Yes Terminated

    ```

