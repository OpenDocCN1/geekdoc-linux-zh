    # Introduction


    Linux has been around for a while. What started as an academic project of a very
    bright student represents now the main solution for many enterprise servers around
    the world. Also Linux operating system is winning over more and more followers
    as a solution for end user desktops. With the visual interfaces (KDE , GNOME)
    that were built specifically for Linux this operating system has become as easy
    to operate as Windows or MacOS and it is increasingly perceived less as a operating
    system for academic or programmers only.


    Also if you use a setopbox for digital television or if you have an intelligent
    alarm at home, these devices are likely to use Linux OS as well. That''s because
    Linux operating system has been ported to various types of processors or devices,
    becoming what we now call "embedded Linux".


    Although with a very small market share, there are currently variants of mobile
    phones that use a version of Ubuntu Linux. Whether or not Linux will have a significant
    market share in the mobile phone market in the future, this remains to be seen.
    But the fact that there are mobile phones already using this operating system
    proves how versatile and flexible solution Linux has become these days.


    The first program in Linux was written back in 1991\. This is nearly 25 years
    ago, which is a considerable age for the software market and and for the IT market
    in general. In the last 25 years we have seen many software products that had
    glory days and then replaced by other products. We have also seen once renowned
    companies that are now in the twilight of glory or out of business. Not the same
    thing happens with Linux. As time passes Linux becomes increasingly stronger.
    The secret of its “eternal youth” appears to be in using the GNU GPL license,
    a license that allows anyone to use this operating system for free. Moreover the
    use of this license has a much wider scope in what “free” means. This is the freedom
    to run, copy, distribute, study, change and improve the software. This aspect
    of “freedom” is attracting a large number of enthusiasts programmers from all
    over the world eager to contribute to the development of Linux. This ultimately
    creates a synergy hard to replicate for a software system whose code is not visible
    to the general public and that is developed and maintained only by a company or
    a group of companies.


    One thing should be noted here if you do not know this already: Linux is not UNIX.
    But there is an obvious trend to use these terms interchangeably. And that is
    because there are many common aspects between Linux and UNIX, both in terms of
    usage as well as in term of programming.


    Notable would also be the fact that there are many similarities between Android
    and Linux. Or between Mac OS and Linux. Although there are no compatibilities
    at the binary level (the Linux programs can not be executed on Mac OS or Android,
    and vice versa) there are however major similarities in terms of operating and
    programming using these operating systems. And this is understandable considering
    that the development of Android kernel started from an older version of Linux
    kernel, and various Linux kernel updates happening nowadays are regularly considered
    to be imported back into the Android kernel. Also Mac OS started from a variant
    of UNIX called BSD (Berkeley Software Distribution) that has many similarities
    with the Linux operating system. Therefore learning Linux opens up larger perspective
    for the Linux market itself as well as for other technologies present on the market
    at the moment.


    Considering that Linux is gaining more and more ground, programming in Linux is
    no longer seen as being a niche job anymore. Increasingly more jobs are becoming
    available and are required for Linux programmers nowadays.


    The Linux kernel was initially developed by using the C programming language.
    Since then, all the development and maintenance has been done using C. Similarly
    the majority of libraries and utility programs from a distribution of Linux are
    also written in C. At the application level, although it is possible to use other
    programming languages (Python , Java , Ruby ...), C and C++ still remain the preferred
    languages for many Linux programmers. The examples from this book are written
    in C/C++ therefore a basic understanding of the C language would help the reader
    to better understand the various topics presented in this book.


    The book is based around the following topics:


    · building a program, general consideration about compilation and linking.


    · overview of GNU C/C++ compiler.


    · how to build a program from multiple modules.


    · static and dynamic libraries in Linux.


    · debugging programs.


    · detecting memory leaks.


    The book is particularly useful for those who have programmed in other environments
    and operating systems before (Windows, for example) and now want to understand
    how to develop programs in Linux.


    However by explaining the topics from this book in simple terms and by using a
    lot of examples I am hoping that this book will be a good starting point for anyone
    who wants to learn the basics for how to develop programs in Linux.


    There are certainly many aspects which are not covered in this book. That''s because
    the topics presented in this book are quite extensive and probably a book alone
    can be written for each section. But what I am trying achieve with this book is
    to provide a sufficient amount of information to allow the reader to understand
    the fundamental principles of creating programs in Linux and feel comfortable
    in trying something practical use cases based on knowledge gained from this book.
          


