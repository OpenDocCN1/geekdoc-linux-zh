  trans: "\n\n```makefile\nLNK_OPTS=-L. -lhello\n\nifeq ($(DEBUG),true)\n  CCFLAGS=-Wall\
    \ -g\nelse\n  CCFLAGS=-Wall\nendif\n\nhello: main.o libhello.a\n\t${CC} main.o\
    \ -o $@ ${LNK_OPTS}\n\nlibhello.a: ${LIB_OBJECT_FILES}\n\t${AR} r $@ ${LIB_OBJECT_FILES}\n\
    \n%.o: %.c\n\t${CC} ${CCFLAGS} -c $^*\n\nclean:\n\trm -rf hello libhello.a *.o\n\
    ```\n\n以下是使用上述 Makefile 运行 make 的示例：\n\n```bash\nmake\ngcc -Wall -c main.c\ngcc\
    \ -Wall -c module1.c\ngcc -Wall -c module2.c\ngcc -Wall -c module3.c\nar r libhello.a\
    \ module1.o module2.o module3.o\nar: creating libhello.a\ngcc main.o -o hello\
    \ -L. –lhello\n```\n\n使用静态库的缺点是，当静态库更新时，所有使用该库的程序都需要重新链接，以获取库的最新更改。\n\n# 共享库\n\
    \n尽管静态库的使用非常简单，但它们有一个明显的缺点：从库中使用的代码段会被复制到每个可执行文件中，因此当这些程序执行时，系统在磁盘和内存中都会存在相同二进制数据的多个副本。\n\
    \n例如，如果我们有两个链接到同一个静态库的可执行文件 `hello1` 和 `hello2`，那么可执行文件的二进制布局大致如下：\n\n![](img/00004.jpeg)\n\
    \n共享库通过为所有可执行文件仅使用一个版本的公共代码来解决这一缺陷。其实现方式如图所示：\n\n![](img/00005.jpeg)\n\n其工作原理如下：\n\
    \n1. 第一个需要共享库的程序在启动的同时将库加载到内存中。\n2. 第二个、第三个等需要相同库的程序将重用已经加载到内存中的库。系统会维护使用该库的程序引用计数。\n\
    3. 当程序结束时，引用计数递减。\n4. 当引用计数达到零时，意味着没有活跃的程序在使用该库，该库将从内存中卸载。\n\n为了实现上述功能，链接过程的责任现在由程序加载器共同承担。在构建可执行文件时，链接器仅会插入从共享库中使用的部分的符号。程序加载器实际上会在运行时为已加载到内存的库解析这些符号的精确地址。这一步被称为“符号重位”（symbol\
    \ relocation）或“运行时链接”，负责此任务的程序加载器部分称为 `动态链接器”（dynamic linker）。事实上，动态链接器本身是一个 Linux\
    \ 共享库（/lib/ld-linux*.so）。\n\n由于符号重位，加载使用共享对象的程序会比使用静态库的类似程序慢。\n\n共享库可以加载到 Linux\
    \ 虚拟内存的任何位置。可以加载到内存任何位置的代码被称为“位置无关代码”（position-independent code）。因此，在生成共享对象时，需要指示编译器生成位置无关代码。`gcc`\
    \ 的 `-fPIC` 选项用于生成此类输出。参见示例：\n\n```bash\ngcc -c -fPIC module1.c module2.c module3.c\n\
    ```\n\n链接共享对象需要使用 `-shared` 选项：\n\n```bash\ngcc -shared -o libhello.so module1.o\
    \ module2.o module3.o\n```\n\n执行上述命令后，当前目录下会创建一个 `libhello.so` 文件。使用 `libhello.so`\
    \ 共享库构建 hello 可执行文件的 Makefile 如下所示：\n\n```makefile\nLIB_SOURCE_FILES = $(wildcard\
    \ *.c)\nLIB_OBJECT_FILES = $(LIB_SOURCE_FILES:.c=.o)\nCC=gcc\nLNK_OPTS=libhello.so\n\
    SOLNKFLAGS=-shared -o\n\nifeq ($(DEBUG),true)\n  CCFLAGS=-Wall -g\n  SOCCFLAGS=-Wall\
    \ -g -fPIC\nelse\n  CCFLAGS=-Wall\n  SOCCFLAGS=-Wall -fPIC\nendif\n\nhello: main.o\
    \ libhello.so\n\t${CC} main.o -o $@ ${LNK_OPTS}\n\nlibhello.so: ${LIB_OBJECT_FILES}\n\
    \t${CC} ${SOLNKFLAGS} $@ ${LIB_OBJECT_FILES}\n\n%.o: %.c\n\t${CC} ${CCFLAGS} -c\
    \ $^*\n\nclean:\n\trm -rf hello libhello.so *.o\n```\n\n如果我尝试执行由上述 Makefile 生成的\
    \ hello 可执行文件，将得到以下输出：\n\n```bash\n./hello\n./hello: error while loading shared\
    \ libraries: libhello.so: cannot open object file: No such file or directory\n\
    ```\n\n这里哪里错了或缺少了什么？失败发生在动态链接器尝试将 `libhello.so` 加载到内存但未找到它的。这是因为动态链接器在某些预定义的路径（例如：`/lib`、`/usr/lib`、`/usr/local/lib`）查找共享库，而我的共享库位于当前目录，该目录并不是动态加载器路径的一部分。我有几个选项可以修复：\n\
    \n- **选项 1**：将共享对象拷贝到动态加载器搜索路径包含的目录。\n- **选项 2**：使用 `LD_LIBRARY_PATH` 为动态加载器搜索路径添加额外目录。例如：\n\
    ```bash\nLD_LIBRARY_PATH=. ./hello\n```\n- **选项 3**：使用 `ldconfig` 为动态加载器搜索路径添加额外目录。例如，编辑\
    \ `/etc/ld.so.conf`：\n```bash\nsudo ldconfig\n./hello\n```\n\n请注意，需要超级用户权限编辑 `/etc/ld.so.conf`\
    \ 并允许执行 `ldconfig`。可以使用 `ldconfig -v` 查看动态链接器正在搜索哪些共享库以及发现了哪些库。`man ldconfig`\
    \ 将提供有关如何使用该工具详细信息。\n\n可以使用工具 `ldd`（列出动态依赖”）查找特定程序的所有动态依赖。对 hello 可执行文件运行此工具将产生以下输出：\n\
    \n```bash\nldd hello\nlinux-vdso.so.1 => (0x00007ffff7000)\nlibhello.so => /home/samples_book/dynamic_lib/libhello.so\
    \ (0x00007fb06a752000)\nlibc.so.6 => /lib64/libc.so.6 (0x00007fb8a7c0000)\n/lib64/ld-linux-x86-64.so.2\
    \ (0x00007fb8a780000)\n```从输出可以看出，除了依赖我的共享库外，hello 程序还需要 C 库（`libc.so`）、Linux\
    \ 动态加载器（`ld-linux*.so`）以及一个用于进入内核空间的的库（`linux-vdso.so`）。这三个最新的库包含在几乎任何使用共享库的 Linux\
    \ 可执行文件中。\n\n使用共享库消除了库更改或更新时重新链接可执行文件的需要。例如，我应该可以将 `libhello.so` 更新到新版本（`libhello.so.2`），而所有依赖该共享库的程序都可以最新版本，而无需重新构建或链接任何可执行文件。\n\
    \n然而，从输出可以看出，hello 可执行文件严格依赖名为 `libhello.so` 的二进制文件。因此，重命名共享库会破坏可执行文件吗？答案是肯！那么\
    \ Linux 如何解决这个问题呢？\n\n解决方案是使用“封装库”（soname）而不是共享库的实际名称。`Sonames` 代表了一种间接层，允许可执行文件使用共享库的不同版本而不是链接时使用的版本。这允许在不需要重新链接可执行文件的情况下更新库，因为可执行文件将继续引用\
    \ soname 库。\n\n我可以这样修改命令行以使用 soname：\n\n```bash\ngcc -shared -Wl,-soname,libhellowrapper.o\
    \ -o libhello.so module1.o module2.o module3.o\n```\n\n"
- fmt: "\nIf I list the content of the folder I see that only `libhello.so` has been\
    \ generated. However the major difference in this case is that the new shared\
    \ libraries also contains the `soname` library internally.\n\n```bash\nstrings\
    \ libhello.so | grep libhellowrapper.so\n```\n\n`libhellowrapper.so`\n\nLinking\
    \ using the shared object with `soname` is basically the same as using any shared\
    \ object:\n\n```bash\ngcc -g -Wall -o hello main.c libhello.so\n```\n\nThe difference\
    \ however is that the linker will recognize the `soname` embedded in the shared\
    \ library and will use this one instead.\n\n![](images/00006.jpeg)\n\nBy using\
    \ `ldd` I can see now that `hello` binary is referencing the `soname` wrapper\
    \ library instead of the shared library itself:\n\n```bash\nldd hello\nlinux-vdso.so.1\
    \ => (0x00007fffaffff000)\nlibhellowrapper.so => not found\nlibc.so.6 => /lib64/libc.so.6\
    \ (0x0000003c87c0000)\n/lib64/ld-linux-x86-64.so.2 (0x0000003c87800000)\n```\n\
    \nOn disk `soname` must be a softlink pointing to the library itself. Therefore\
    \ the last step in order to use the `soname` is to create this softlink:\n\n```bash\n\
    ln -s libhello.so libhellowrapper.so\nls -lrt libhellowrapper.so\n```\n\n```lrwxrwxrwx.\
    \ 1 ssosiade ssosiade 11 Aug 5 06:50 libhellowrapper.so -> libhello.so\n```\n\n\
    With all of these in place I can now try to run the executable and I am expect\
    \ to see the same output as first time I executed the `hello` executable because\
    \ nothing was changed in the source code, just the way the code built:\n\n```bash\n\
    ./hello\n./hello: error while loading shared libraries: libhellowrapper.so: cannot\
    \ open shared object file: No such file or directory\nLD_LIBRARY_PATH=. ./hello\n\
    Hello from module 1\nHello from module 2\nHello from module 3\n```\n\nHowever\
    \ now if I want to change the shared library I will only need to change the softlink\
