    \ to colloquially call “build” as “compilation” in reality building an executable\
    \ is performed in two distinct steps:\n\n1 – **compilation**\n\n2 – **linking**\n\
    \n**Compilation.** As concept, this is what I described in the previous chapter.\
    \ Compiling C/C++ source code in Linux represents the process of translating the\
    \ source code from the programming language and creating the “**object file**”\
    \ which is the representation in machine language of the original source code.\n\
    \nFor C/C++ language the compilation is typically done in two passes:\n\n **Step\
    \ 1 – preprocessing**: this step involves pre-processing of the original source\
    \ file by doing the following:\n\n a.– including the source code coming from #include\
    \ directives\n\n b.– expanding the macros and substitution for #define directive\n\
    \n c.– selecting parts of the original source code based on #if, #ifdef and #ifndef\
    \ directives\n\n![](images/00001.jpeg)\n\n **Step 2 – compilation itself**: this\
    \ step represents the parsing of the plain code generated after pre-processing\
    \ and creation of the object files.\n\nI just mentioned that the output of the\
    \ compilation is in format of machine language for. Then why we cannot execute\
    \ directly the output of the compilation and we still need the linking stage?\n\
    \nThere are two main reasons for this:\n\n- an executable can be crested from\
    \ multiple source code files (modules). Each source code file is individually\
    \ translated into an equivalent object file. However only one file contains the\
    \ definition of the main method, representing the main entry point for the executable.\
    \ Thus we cannot execute a module which does not contain a main entry point. \n\
    \n- the source code may contain references to functions defined in other modules\
    \ or functions implemented in external libraries. The compilation itself does\
    \ not deal with resolving these type of dependencies.\n\n**Linking.** This is\
    \ the process where all the object files are assembled together into what represents\
    \ the final executable. Dependencies of external symbols are also resolved at\
    \ this stage.\n\nIf a referenced function is defined in an external static library\
    \ then the whole implementation of that function will be also added into the final\
    \ executable.\n\n![](images/00002.jpeg)\n\nI briefly highlighted the role of the\
    \ external libraries in building the final executable. An advantage of building\
    \ an executables in two steps starts shaping up: the building process provides\
    \ the ability to reuse various pre-compiled parts of code (libraries) across multiple\
    \ programs and products. Another advantage is that the code can be structured\
    \ in such a way so that parts of the code do not get recompiled every time the\
    \ program is built. But more on libraries in a separate chapter.\n\n# GNU C/C++\
    \ Compiler - GCC\n\nThere are several options for choosing a compiler for C/C++\
    \ programming languages, as you can see in the table below.\n\n|  \n\n**Compiler**\n\
    \n |  \n\n**Licence**\n\n |\n\n|  \n\nCh\n\n |  \n\nFreeware\n\n |\n\n|  \n\n\
    [CodeWarrior](http://en.wikipedia.org/wiki/CodeWarrior)\n\n |  \n\nProprietary\n\
    \n |\n\n|  \n\n[GCC](http://en.wikipedia.org/wiki/GNU_Compiler_Collection)\n\n\
    \ |  \n\nGPL\n\n |\n\n|  \n\n[Digital Mars](http://en.wikipedia.org/wiki/Digital_Mars)\n\
    \n |  \n\nProprietary\n\n |\n\n|  \n\n[LabWindows/CVI](http://en.wikipedia.org/wiki/LabWindows/CVI)\n\
    \n |  \n\nProprietary\n\n |\n\n|  \n\n[Lattice C](http://en.wikipedia.org/wiki/Lattice_C)\n\
    \n |  \n\nProprietary\n\n |\n\n|  \n\n[lcc](http://en.wikipedia.org/wiki/LCC_(compiler))\n\
    \n |  \n\nFreeware\n\n |\n\n|  \n\n[Open Watcom](http://en.wikipedia.org/wiki/Open_Watcom)\n\
    \n |  \n\nProprietary\n\n |\n\n|  \n\n[Portable C Compiler](http://en.wikipedia.org/wiki/Portable_C_Compiler)\n\
    \n |  \n\nBSD\n\n |\n\n|  \n\n[Smaller C](https://github.com/alexfru/SmallerC)\n\
    \n |  \n\nBSD\n\n |\n\n|  \n\n[Wind River (Diab) Compiler](http://en.wikipedia.org/wiki/Wind_River_Systems#Wind_River_.28Diab.29_Compiler)\n\
    \n |  \n\nProprietary\n\n |\n\n|  \n\n[XL C](http://en.wikipedia.org/wiki/IBM_XL_C%2B%2B)\n\
    \n |  \n\nProprietary\n\n |\n\n|  \n\n[HP aC++](http://en.wikipedia.org/wiki/HP_aC%2B%2B)\n\
    \n |  \n\nProprietary\n\n |\n\n|  \n\n[Intel C++ Compiler](http://en.wikipedia.org/wiki/Intel_C%2B%2B_Compiler)\n\
    \n |  \n\nProprietary\n\n |\n\n|  \n\n[VisualAge C++](http://en.wikipedia.org/wiki/IBM_VisualAge)\n\
    \n |  \n\nProprietary\n\n |\n\nFor Linux however GCC (GNU Compiler Collection)\
    \ represents by far the most popular option for building programs written in C/C++.\
    \ Just think about the fact that GCC is the compiler used for compiling the Linux\
    \ kernel itself. This speaks for itself about the robustness and reliability of\
    \ this toolchain. And what makes it even better: it’s free!"
