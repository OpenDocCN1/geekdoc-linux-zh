- fmt: "\n`gdb` also has the ability to send a signal to the debugged program. This\
    \ can be done by either using `signal` or `queue-signal` commands. There is a\
    \ very slight difference between these two commands:\n\n- `signal *signal*`: resumes\
    \ the program and the signal is delivered immediately.\n- `queue-signal *signal*`:\
    \ delivers the signal as soon as the program is resumed.\n\n## Changing execution\
    \ threads\n\nNon-trivial Linux programs typically consist of multiple execution\
    \ threads. Therefore a powerful debugging tool for Linux must be able to handle\
    \ multithreaded programs as well. And `gdb` ticks this box.\n\nTo understand the\
    \ multithreading capabilities for `gdb` lets consider a multithreaded version\
    \ of the `fibonnaci.c` program that does the calculation of three Fibonacci series\
    \ in parallel. See the program in the listing below. Please note the error handling\
    \ has not been provided in order to keep this example small:\n\n```c\n1: #include\
    \ <stdio.h>\n2: #include <pthread.h>\n3:\n4: #define NUM_THREADS 3\n5: void* fibonacci(void\
    \ *arg)\n6: {\n7: int n, first = 0, second = 1, next, i;\n8:\n9: n = (int)arg;\n\
    10:\n11: for ( i = 0 ; i < n ; i++ )\n12: {\n13: if ( i <= 1 )\n14: next = i;\n\
    15: else\n16: {\n17: next = first + second;\n18: first = second;\n19: second =\
    \ next;\n20: }\n21: sleep(5);\n22: }\n23:\n24: printf(\"Fib(%d)=%d\\n\", n, next);\n\
    25: return NULL;\n26: }\n27:\n28: int main()\n29: {\n30: pthread_t tid[NUM_THREADS];\n\
    31: int n[NUM_THREADS];\n32: int i;\n33:\n34: /* read input data */\n35: for (\
    \ i = 0; i < NUM_THREADS; i++ )\n36: {\n37: printf(\"Thread %d: Number of terms:\
    \ \\n\", i);\n38: scanf(\"%d\",&n[i]);\n39: }\n40:\n41: /* start computation threads\
    \ */\n42: for ( i = 0; i < NUM_THREADS; i++ )\n43: {\n44: pthread_create(&(tid[i]),\
    \ NULL, &fibonacci, (void*)n[i]);\n45: }\n46:\n47: /* wait for threads to finish\
    \ */\n48: for ( i = 0; i < NUM_THREADS; i++ )\n49: {\n50: pthread_join(tid[i],\
    \ NULL);\n51: }\n52: printf(\"Game over!\\n\");\n53: }\n```\n\nThe program can\
    \ be built from the command line with the following command:\n\n```bash\n$ gcc\
    \ -g fibonacci_threads.c -lpthread -o fibonacci_threads\n```\n\nThe output of\
    \ the command above is an executable called: `fibonacci_threads`. Lets see how\
    \ this program executes before exploring it with the debugger:\n\n```bash\n$fibonacci_threads\n\
    Thread 0: Number of terms:\n6\nThread 1: Number of terms:\n4\nThread 2: Number\
    \ of terms:\n2\nFib(2)=1\nFib(4)=2\nFib(6)=5\nGame over!\n```\n\nNow it's time\
    \ to see an example how to run this program under `gdb`. Every command I presented\
    \ so far in this book applies to multithreaded programs as well. Therefore starting\
    \ the program under debugger and setting a breakpoint at line 48 must be something\
    \ that you should be familiar with by now:\n\n```bash\n$ gdb fibonacci_threads\n\
    GNU gdb (GDB) Red Hat Linux 7.6-1.el7\nCopyright (C) 2013 Free Software Foundation,\
    \ Inc.\nLicense GPL3+: GNU version 3 or later <http://gnu.org/licenses/gpl.html>\n\
    Reading symbols from /home/books/fibonacci_threads...done.\n(gdb) b 48\nBreakpoint\
    \ 1 at 0x4008bc: file fibonacci_threads.c, line 48.\n```\n\nI can now execute\
    \ the program until the breakpoint is hit:\n\n```bash\n(gdb) r\nStarting program:\
    \ /home/books/fibonacci_threads [Thread debugging using libthread_db]\nUsing host\
    \ libthread_db \"/lib64/libthread_db.1\".\nThread 0: Number of terms:\n4\nThread\
    \ 1: Number of terms:\n5\nThread 2: Number of terms:\n8\n[New Thread 0x7ffff77fe00\
    \ (LWP 3325)]\n[New Thread 0x7ffff6ffd00 (LWP 3326)]\n[New Thread 0x7ffff6fc700\
    \ (LWP 3327)]\nBreakpoint 1, main () at fibonacci_threads.c:49\n49 for ( i = 0;\
    \ i < NUM_THREADS; i++ )\n```\n\nWe can see from the output above that gdb is\
    \ somehow aware of the extra three threads created (New Thread 0x7fff...). Because\
    \ we knew the program already we could safely assume that those threads are the\
    \ worker threads by the program. But how to check that those threads are indeed\
    \ the threads we think they are?\n\nFirst command useful in this context is `info\
    \ threads`. This command is used to inspect how many threads were created by the\
    \ program by the time the breakpoint was hit:\n\n```bash\n(gdb) info threads\n\
    Id Target Id Frame\n  4 Thread 0x7ffff6fc700 (LWP 3194) \"fibonacci_threa\" 0x00007ffff78f53a1\
    \ in clone () from /lib64/libc.so.6\n  3 Thread 0x7ffff6ffd00 (LWP 3193) \"fibonacci_threa\"\
    \ 0x00007ffff78bcad in nanosleep () from /lib64/libc.so.6\n  2 Thread 0x7ffff77fe00\
    \ (LWP 3192) \"fibonacci_threa\" 0x00007ffff78bcad in nanosleep () from /lib64/libc.so.6\n\
    * 1 Thread 0x7ffff7fdf740 (LWP 3188) \"fibonacci_threa\" main () at fibonacci_threads.c:49\n\
    ```\n\nFrom the output of the `info threads` I can see that the `fibonacci_thread`\
    \ contains four threads. This is the number of threads I expect to see being created\
    \ at line 48. One thread (id 1) is the main thread of the application. The other\
    \ three threads (id 2,3 and 4) are the three worker threads created at line 44.\
    \ There is also a `*` marker for thread id 1. This means that the thread id 1\
    \ has the focus. All `gdb` commands are executed against the thread that has the\
    \ focus.\n\n```bash\n(gdb) bt\n#0 main () at fibonacci_threads.c:49\n(gdb) info\
    \ local\ntid = {140737345742592, 140737337349888, 140737328957184}\nn = {4, 5,\
    \ 8}\ni = 3\n```\n\nNote that once a breakpoint is hit for a multithreaded program\
    \ the execution of all the threads stops and not only for the thread that hit\
    \ the breakpoint. This allows for the examination of other threads.\n\nThe `t`\
    \ command allows changing the focus to a thread that is stopped. Below is example\
    \ how to switch the focus to that thread:\n\n```bash\n(gdb) t 3\n(gdb) bt\n#0\
    \ 0x00007ffff7bcad in nanosleep () from /lib64/libc.so.6\n#1 0x00007ffff78c4 in\
    \ sleep () from /lib64/libc.so.6\n#2 0x00007ffff78fe in fibonacci (arg=0x5) at\
    \ fibonacci_threads.c:22\n#3 0x00007ffff7df3 in start_thread () from /lib64/libpthread.so\n\
    #4 0x00007ffff78f53dd in clone () from /lib64/libc.so.6\n```\n\nBut what happens\
    \ if I set a breakpoint to a line that will be executed only by a worker thread.\
    \ Like line 11 Will this breakpoint be hit or not? Lets try this scenario:\n\n\
    ```bash\n(gdb) b 11\nBreakpoint 2 at 0x4007c1: fibonacci_threads.c, line 11.\n\
    (gdb) r\nStarting program: /home/books/fibonacci_threads [Thread debugging using\
    \ libthread_db]\nUsing host libthread_db \"/lib64/libthread_db.1\".\nThread 0:\
    \ Number of terms:\n4\nThread 1: Number of terms:\n5\nThread 2: Number of terms:\n\
    8\n[New Thread 0x7ffff77fe00 (LWP 3325)]\n[New Thread 0x7ffff6ffd00 (LWP 3326)]\n\
    [New Thread 0x7ffff6fc700 (LWP 3327)]\nBreakpoint 1, main () at fibonacci_threads.c:49\n\
    49 for ( i = 0; i < NUM_THREADS; i++ )\nBreakpoint 2, fibonacci (arg=0x4) at fibonacci_threads.c:11\n\
    11 if ( i <= 1 )\n```\n"
