    \ 0x00007ffff78f53a1 in clone () from /lib64/libc.so.6*\n\nThe conclusions that\
    \ we can draw from here are:\n\n· the breakpoint is hit only by one thread\n\n\
    · the thread that first hits the breakpoint gets the focus"
