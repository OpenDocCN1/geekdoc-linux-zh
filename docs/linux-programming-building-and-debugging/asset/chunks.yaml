    \nThis is the listing of this program:\n\n```bash\ncat fibonacci.c\n#include<stdio.h>\n\
    int main() {\n    int n, first = 0, second = 1, next, i;\n    printf(\"Number\
    \ of terms: \\n\");\n    scanf(\"%d\",&n);\n    for ( i = 0 ; i < n ; i++ ) {\n\
    \        if ( i <= 1 )\n            next = i;\n        else {\n            next\
    \ = first + second;\n            first = second;\n            second = next;\n\
    \        }\n    }\n    printf(\"%d\\n\",next);\n    return 0;\n}\n```\n\nAnd here\
