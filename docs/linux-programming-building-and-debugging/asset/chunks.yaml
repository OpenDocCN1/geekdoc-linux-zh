- fmt: "\nIf you bought this book, you probably have some interest and maybe an idea\
    \ of how to develop computer programs. If I had told you that computer programming\
    \ means writing endless sequences of 0s and 1s you would have likely abandoned\
    \ any idea of exploring this topic any further! But this was the reality in the\
    \ early days of computers when there was no distinction between \"software\" and\
    \ \"hardware\" and the programs need to be written directly using the \"machine\
    \ language\" – the low level instructions executed by the CPU.\n\nThe programmers\
    \ from those days had to produce a number of punched cards containing the sequences\
    \ of instructions that the microprocessor ultimately executed. In those conditions\
    \ even writing trivial program required a considerable effort. Writing programs\
    \ that allow automatic piloting of aircrafts would not have been possible without\
    \ simplifying and making the programming of computers more effective.\n\nThere\
    \ were two approaches to simplify the programming work: `interpreting` and `compiling`.\
    \ Both approaches have in common writing programs using a more complex sequence\
    \ of instructions than the CPU instructions set. With programming becoming more\
    \ efficient, more functionality can be written with lesser lines of codes and\
    \ writing more complex program became possible.\n\n### Interpretation\neach line\
    \ of code is interpreted and converted into an equivalent sequence of instructions\
    \ executable by the CPU. These instructions are then executed. Then next line\
    \ of code is interpreted and similarly executed. And program execution continues\
    \ in this way until the last last line of the program is executed. Running a program\
    \ in this way requires the use of an \"interpreter\" that allows the successive\
    \ interpretation and execution of each line of the program.\n\nOld programmers\
    \ probably still remember `BASIC`, a programming language that is largely based\
    \ on interpretation. The program interpretation however is present and very popular\
    \ concept even today, especially for what programmers call \"scripting programming”\
    \ (shell scripting, perl, python, java script, etc ...)\n\n### Compiling\nthe\
    \ program is first translated into another lower level intermediary language.\
    \ The translated program can then either be executed directly or interpreted.\
    \ The translation of high-level language into a lower-level language is called\
    \ `compilation`. For this, programmers need to use a \"compiler\" for that particular\
    \ language. The `C` or `C++` languages are examples of programming languages that\
    \ use compilation.\n\n`Java` is a programming language that uses of both of these\
    \ concepts presented. A `Java` program is first \"compiled\" into `Java byte code`.\
    \ This process is conducted by the `Java compiler`. Next, when a byte code program\
    \ is executed every statement from the byte code program is subsequently \"interpreted\"\
    . The interpretation process is conducted by the `Java virtual machine` (`JVM`)\
    \ that plays the interpreter role for byte code execution on different host machines.\n\
    \nIn general, a compiled program is faster than an interpreted program. Therefore\
    \ if the execution speed is critical then it is preferable to use a compiled language.\
    \ On the other hand, the interpreted languages have the reputation to be simpler\
    \ and easier to use, thus providing improved productivity.\n\n# Building an executable.\
    \ Compilation and Linking\n\nBuilding (an executable) represents the process of\
    \ going from source code to the actual executable. Although some programmers tend\
    \ to colloquially call “build” as “compilation” in reality building an executable\
    \ is performed in two distinct steps:\n\n1. `compilation`\n2. `linking`\n\n###\
    \ Compilation\nAs concept, this is what I described in the previous chapter. Compiling\
    \ `C/C++` source code in `Linux` represents the process of translating the source\
    \ code from the programming language and creating the “object file” which is the\
    \ representation in machine language of the original source code.\n\nFor `C/C++`\
    \ language the compilation is typically done in two passes:\n\n**Step 1 – preprocessing**:\
    \ this step involves pre-processing of the original source file by doing the following:\n\
    a.– including the source code coming from `#include` directives.\nb.– expanding\
    \ the macros and substitution for `#define` directive.\nc.– selecting parts of\
    \ the original source code based on `#if`, `#ifdef` and `#ifndef` directives.\n\
    \n![](images/00001.jpeg)\n\n**Step 2 – compilation itself**: this step represents\
    \ the parsing of the plain code generated after pre-processing and creation of\
    \ the object files.\n\nI just mentioned that the output of the compilation is\
    \ in format of machine language for. Then why we cannot execute directly the output\
    \ of the compilation and we still need the linking stage?\n\nThere are two main\
    \ reasons for this:\n- an executable can be crested from multiple source code\
    \ files (modules). Each source code file is individually translated into an equivalent\
    \ object file. However only one file contains the definition of the `main method`,\
    \ representing the main entry point for the executable. Thus we cannot execute\
    \ a module which does not contain a main entry point. \n- the source code may\
    \ contain references to functions defined in other modules or functions implemented\
    \ in external libraries. The compilation itself does not deal with resolving these\
    \ type of dependencies.\n\n### Linking\nThis is the process where all the object\
    \ files are assembled together into what represents the final executable. Dependencies\
    \ of external symbols are also resolved at this stage.\n\nIf a referenced function\
    \ is defined in an external static library then the whole implementation of that\
    \ function will be also added into the final executable.\n\n![](images/00002.jpeg)\n\
    \nI briefly highlighted the role of the external libraries in building the final\
    \ executable. An advantage of building the executables in two steps starts shaping\
    \ up: the building process provides the ability to reuse various pre-compiled\
    \ parts of code (libraries) across multiple programs and products. Another advantage\
    \ is that the code can be structured in such a way so that parts of the code do\
    \ not get recompiled every time the program is built. But more on libraries in\
    \ a separate chapter.\n\n# GNU C/C++ Compiler - GCC\n\nThere are several options\
    \ for choosing a compiler for `C/C++` programming languages, as you can see in\
    \ the table below.\n\n| Compiler | Licence |\n| :--- | :--- |\n| Ch | Freeware\
    \ |\n| [CodeWarrior](http://en.wikipedia.org/wiki/CodeWarrior) | Proprietary |\n\
    | [GCC](http://en.wikipedia.org/wiki/GNU_Compiler_Collection) | GPL |\n| [Digital\
    \ Mars](http://en.wikipedia.org/wiki/Digital_Mars) | Proprietary |\n| [LabWindows/CVI](http://en.wikipedia.org/wiki/LabWindows/CVI)\
    \ | Proprietary |\n| [Lattice C](http://en.wikipedia.org/wiki/Lattice_C) | Proprietary\
    \ |\n| [lcc](http://en.wikipedia.org/wiki/LCC_(compiler)) | Freeware |\n| [Open\
    \ Watcom](http://en.wikipedia.org/wiki/Open_Watcom) | Proprietary |\n| [Portable\
    \ C Compiler](http://en.wikipedia.org/wiki/Portable_C_Compiler) | BSD |\n| [Smaller\
    \ C](https://github.com/alexfru/SmallerC) | BSD |\n| [Wind River (Diab) Compiler](http://en.wikipedia.org/wiki/Wind_River_Systems#Wind_River_.28Diab.29_Compiler)\
    \ | Proprietary |\n| [XL C](http://en.wikipedia.org/wiki/IBM_XL_C%2B%2B) | Proprietary\
    \ |\n| [HP aC++](http://en.wikipedia.org/wiki/HP_aC%2B%2B) | Proprietary |\n|\
    \ [Intel C++ Compiler](http://en.wikipedia.org/wiki/Intel_C%2B%2B_Compiler) |\
    \ Proprietary |\n| [VisualAge C++](http://en.wikipedia.org/wiki/IBM_VisualAge)\
    \ | Proprietary |\n\nFor Linux however `GCC` (GNU Compiler Collection) represents\
    \ by far the most popular option for building programs written in `C/C++`. Just\
    \ think about the fact that `GCC` is the compiler used for compiling the Linux\
    \ kernel itself. This speaks for itself about the robustness and reliability of\
    \ this toolchain. And what makes it even better: it’s free!\n"
