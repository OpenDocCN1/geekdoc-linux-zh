    \n从 C/C++ 源代码构建 Linux 程序涉及处理几种类型的文件：\n\n-   **源文件 (`*.cpp` 或 `*.c`)** – 包含主函数实现以及程序使用的其他函数或类实现的文本文件。\n\
    -   **头文件 (`*.h`)** – 包含函数或类原型以及其他处理器语句的文本文件。本章稍后将展示源文件头文件的示例。\n-   **对象文件 (`*.o`)**\
    \ – 编译器的输出。\n-   **二进制文件** – 可执行文件、静态库 (`*.a`) 或动态库 (`*.so`)。目前我们可以将库视为对象文件的预构建仓库。\n\
    \n从 C/C++ 源代码构建 Linux 程序涉及处理几种类型的文件：\n\n-   **源文件 (`*.cpp` 或 `*.c`)** – 包含主函数实现以及程序使用的其他函数或类实现的文本文件。\n\
    -   **头文件 (`*.h`)** – 包含函数或类原型以及其他处理器语句的文本文件。本章稍后将展示源文件头文件的示例。\n-   **对象文件 (`*.o`)**\
    \ – 编译器的输出。\n-   **二进制文件** – 可执行文件、静态库 (`*.a`) 或动态库 (`*.so`)。目前我们可以将库视为对象文件的预构建仓库。\n\
    \n从 C/C++ 源代码构建 Linux 程序涉及处理几种类型的文件：\n\n-   **源文件 (`*.cpp` 或 `*.c`)** – 包含主函数实现以及程序使用的其他函数或类实现的文本文件。\n\
    -   **头文件 (`*.h`)** – 包含函数或类原型以及其他处理器语句的文本文件。本章稍后将展示源文件头文件的示例。\n-   **对象文件 (`*.o`)**\
    \ – 编译器的输出。\n-   **二进制文件** – 可执行文件、静态库 (`*.a`) 或动态库 (`*.so`)。目前我们可以将库视为对象文件的预构建仓库。\n\
    \n# Make 和 Makefile\n\n我们刚刚从上一章学习了如何从多个源文件构建程序。这看起来简单直接。但如果不是三个模块，而是要处理成百个源文件（这对于大型项目很常见）呢？构建这么多文件的\
    \ `gcc` 命令行显然不是选择。我们该怎么办？\n\n首先想到的创建一个程序或脚本来尝试自动化构建过程，并使过程变得简单可重复。好消息是你不需要编写任何内容，因为这样的程序已经存在了。这是一个名为\
    \ `make` 的 GNU 工具。`make` 程序理解并执行在名为 `Makefile` 的输入文件中指定的规则。因此，虽然 `make` 工具是通用的，但\
    \ `Makefile` 包含了构建特定程序的规则。\n\n展示一个 Makefile 示例，其功能等同于上一章用于构建 hello 可执行文件的 shell\
    \ 命令。此示例的目标是对 Makefile 的语法和用法进行简要概述。\n\n开始，假设我的当前工作目录中有以下文件：\n\n```bash\nls\n\
    main.c Makefile module1.c module1.h module2.c module2.h module3.c module3.h\n\
    ```\n\n头文件和源文件与上一个示例使用的文件相同。makefile 文件的内容如下：\n\n```bash\ncat Makefile\n```\n\n\
    ```makefile\nmodule1.o: module1.c module1.h\n\tgcc -c module1.c\n\nmodule2.o:\
    \ module2.c module2.h\n\tgcc -c module2.c\n\nmodule3.o: module3.c module3.h\n\t\
    gcc -c module3.c\n\nmain.o: main.c\n\tgcc -c main.c\n\nhello: module1.o module2.o\
    \ module3.o main.o\n\tgcc module1.o module2.o module3.o main.o -o hello\n```\n\
    \n"
- fmt: "\n`hello: main.o module1.o module2.o module3.o`\n\n`gcc module1.o module2.o\
    \ module3.o main.o -o hello`\n\nBefore explaining the makefile syntax let me show\
    \ you how I build the `hello` executable first:\n\n```bash\n$ make hello\ngcc\
    \ -c main.c\ngcc -c module1.c\ngcc -c module2.c\ngcc -c module3.c\ngcc module1.o\
    \ module2.o module3.o main.o -o hello\n```\n\nJust by exploring the output of\
    \ this command we can start getting some understanding about what `make` tool\
    \ does. It compiles the source code first and then link the object files into\
    \ the final executable.\n\nIf I list the content of the same directory once again\
    \ I can see now the object files and executable being created.\n\n```bash\n$ ls\n\
    ```\n`hello` `main.c` `main.o` `Makefile` `module1.c` `module1.h` `module1.o`\
    \ `module2.c` `module2.h` `module2.o` `module3.c` `module3.h` `module3.o`\n\n\
    If I run the executable I will get the same output as in my previous example when\
    \ I built the executable from the command line:\n\n```bash\n$ ./hello\nHello from\
    \ module 1\nHello from module 2\nHello from module 3\n```\n\nBut what happens\
    \ if I try to execute the `make` command once again?\n\n```bash\n$ make hello\n\
    make: `hello' is up to date.\n```\n\nIt appears that `make` knows somehow that\
    \ nothing has changed the since last build. So it does not recompile and link\
    \ anything. `make` detects this by checking the timestamps of the various files\
    \ it uses or generates. If the binary artifacts are older that the source code\
    \ then it does the compilation. Otherwise not.\n\nTo prove this, I am going to\
    \ change the timestamp of `module2.c`\n\n```bash\n$ ls -l module2\n-rw-rw-r--.\
    \ 1 ssosiade ssosiade 103 Jul 30 07:29 module2.c\n-rw-rw-r--. 1 ssosiade ssosiade\
    \ 70 Jul 29 07:56 module2.h\n-rw-rw-r--. 1 ssosiade ssosiade 1512 Jul 30 07:30\
    \ module2.o\n```\n\n```bash\n$ touch module2.c\n$ ls -l module2\n-rw-rw-r--. 1\
    \ ssosiade ssosiade 103 Jul 30 07:32 module2.c\n-rw-rw-r--. 1 ssosiade ssosiade\
    \ 70 Jul 29 07:56 module2.h\n-rw-rw-r--. 1 ssosiade ssosiade 1512 Jul 30 07:30\
    \ module2.o\n```\n\nNow `module2.c` appears to be newer that `module2.o`. If I\
    \ run the `make hello` again then `module2.c` only will be recompiled again and\
    \ the executable will be recreated.\n\n```bash\n$ make hello\ngcc -c module2.c\n\
    gcc module1.o module2.o module3.o main.o -o hello\n```\n\nThis feature reduces\
    \ the total time of the build by building only parts of the system which are affected\
    \ by the latest code changes since the last build. This feature really makes a\
    \ significant difference especially for large systems where a build from scratch\
    \ (clean builds) could take hours .\n\nLets go back now to the makefile and explain\
    \ how `make` utility understands from the content of the makefile what to do and\
    \ what to build.\n\n### Makefile Rule Structure\n\nThe key element in a makefile\
    \ is represented by a `rule`. A `make` rule starts with a `target` and has the\
    \ following format:\n\n`target: dependencies`\n\n`<TAB> command1`\n\n`<TAB> command2`\n\
    \n`<TAB> commandN`\n\nPlease note that `<TAB>` must be the TAB character and it\
    \ cannot be replaced by a sequence of blanks in order to achieve the same level\
    \ of indentation. This is one of the most common errors in makefiles. A message\
    \ like:\n\n`“Makefile:11: *** missing separator (did you mean TAB instead of 8\
    \ spaces?). Stop.”`\n\nwould indicate for example that a `TAB` is missing on line\
    \ 11.\n\nWhen a target is invoked `make` will process the dependencies first followed\
    \ by the sequential execution of all the commands specified in the target body\
    \ (`“command1”`, `“command2”...“commandN”`).\n\nA target can be invoked in one\
    \ of the following ways:\n\n1. From the command line by using `make <target>`\n\
    2. As part of the processing of another target\n\nTo understand this better lets\
    \ analyze some of the rules presented in the makefile from my example:\n\n`module3.o:\
    \ module3.c module3.h`\n\n`  gcc -c module3.c`\n\nFor the above rule the `target`\
    \ (`module3.o`) depends on `module3.c` and `module3.h`. When this target is invoked\
    \ the `make` tool will try to determine if `module3.o` exists and whether its\
    \ timestamp is newer that `module3.c` and `module3.h` respectively. If any of\
    \ these is not true then `make` will invoke the command `gcc -c module3.c`\n\n\
    Target `module3.o` can be independently invoked from the command line as follows:\n\
    \n```bash\n$ make module3.o\ngcc -c module3.c\n```\n\nLets explore this rule:\n\
    \n`hello: main.o module1.o module2.o module3.o`\n\n`  gcc module1.o module2.o\
    \ module3.o main.o -o hello`\n\n`hello: main.o module1.o module2.o module3.o`\n\
    `  gcc module1.o module2.o module3.o main.o -o hello`\n\nIn this rule, the `hello`\
    \ target depends on `main.o`, `module1.o`, `module2.o`, and `module3.o`.\n\n###\
    \ Builtin and Default Rules\n\nThe `make` tool contains what is called `builtin\
    \ rules` (or `default rules`). What do you think will happen if I remove the target\
    \ `module1.o` from my makefile and try to invoke `make module1.o` from the command\
    \ line? You would probably be tempted to say that this command will fail. Well,\
    \ this is not quite the case:\n\n```bash\n$ make module1.o\ncc -c -o module1.o\
    \ module..\n```\n\nWhy is this? First let’s not forget that `make` was written\
    \ particularly for controlling and automating the build process. To make the work\
    \ easy some default rules for a number of popular languages (C, C++, Fortran,\
    \ Modula-2, and on…) have been integrated into `make`. These rules act like fallback\
    \ rules if no matching rules are found in the makefile. Therefore based on the\
    \ `.o` suffix the `make` tool is able to determine that the target is referring\
    \ to a C (or C++) object file so it must look for a `module1.c` (or `module1.cpp`)\
    \ file in the current folder.\n\nI am personally not convinced how useful these\
    \ builtin rules are. Builtin rules may cause subtle issues sometimes and very\
    \ hard to detect. For instance the builtin rules for C use the standard C compiler\
    \ `cc` whereas the makefile uses GNU C compiler `gcc`.\n\n### Pattern Rules\n\n\
    The `make` tool understands by `pattern based rules`. Here is how the previous\
    \ makefile will look like by using a single rule that specifies the all the object\
    \ files (`*.o`) should be created from a corresponding `.c` file and by using\
    \ `gcc` compiler.\n\n```bash\n$ cat Makefile\n%.o: %.c\n\tgcc -c $^\n\nhello:\
    \ main.o module1.o module2.o module3.o\n\tgcc main1.o module2.o module3.o main.o\
    \ -o hello\n\nclean:\n\trm -rf hello *.o\n```\n\nOne could easily notice that\
    \ the use of pattern based rules makes the makefiles look tidier and more compact.\n"
