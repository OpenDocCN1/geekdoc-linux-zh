  trans: "\n\n`gdb` 也具有向被调试程序发送信号的能力。这可以通过使用 `signal` 或 `queue-signal` 命令来实现。这两个命令之间存在非常微小的区别：\n\
    \n- `signal *signal*`：恢复程序并立即递送信号。\n- `queue-signal *signal*`：在程序恢复后递送信号。\n\n\
    ## 修改执行线程\n\n复杂的 Linux 程序通常由多个执行线程组成。因此，一个强大的 Linux 调试工具必须能够处理多线程程序。`gdb` 正好满足这一要求。\n\
    \n为了理解 `gdb` 的多线程能力，让我们考虑 `fibonnaci.c` 程序的一个多线程版本，它并行计算三个斐波那契数列。请参下方的程序列表。请注意，为了保持示例简洁，没有提供错误处理：\n\
    \n```c\n1: #include <stdio.h>\n2: #include <pthread.h>\n3:\n4: #define NUM_THREADS\
    \ 3\n5: void* fibonacci(void *arg)\n6: {\n7: int n, first = 0, second = 1, next,\
    \ i;\n8:\n9: n = (int)arg;\n10:\n11: for ( i = 0 ; i < n ; i++ )\n12: {\n13: if\
    \ ( i <= 1 )\n14: next = i;\n15: else\n16: {\n17: next = first + second;\n18:\
    \ first = second;\n19: second = next;\n20: }\n21: sleep(5);\n22: }\n23:\n24: printf(\"\
    Fib(%d)=%d\\n\", n, next);\n25: return NULL;\n26: }\n27:\n28: int main()\n29:\
    \ {\n30: pthread_t tid[NUM_THREADS];\n31: int n[NUM_THREADS];\n32: int i;\n33:\n\
    34: /* read input data */\n35: for ( i = 0; i < NUM_THREADS; i++ )\n36: {\n37:\
    \ printf(\"Thread %d: Number of terms: \\n\", i);\n38: scanf(\"%d\",&n[i]);\n\
    39: }\n40:\n41: /* start computation threads */\n42: for ( i = 0; i < NUM_THREADS;\
    \ i++ )\n43: {\n44: pthread_create(&(tid[i]), NULL, &fibonacci, (void*)n[i]);\n\
    45: }\n46:\n47: /* wait for threads to finish */\n48: for ( i = 0; i < NUM_THREADS;\
    \ i++ )\n49: {\n50: pthread_join(tid[i], NULL);\n51: }\n52: printf(\"Game over!\\\
    n\");\n53: }\n```\n\n可以使用以下命令从命令行构建该程序：\n\n```bash\n$ gcc -g fibonacci_threads.c\
    \ -lpthread -o fibonacci_threads\n```\n\n上述命令的输出是一个名为 `fibonacci_threads` 的可执行文件。在用调试器探索之前，让我们看看程序是如何执行的：\n\
    \n```bash\n$fibonacci_threads\nThread 0: Number of terms:\n6\nThread 1: Number\
    \ of terms:\n4\nThread 2: Number of terms:\n2\nFib(2)=1\nFib(4)=2\nFib(6)=5\n\
    Game over!\n```\n\n现在是时候看一个如何在 `gdb` 下运行此程序的示例了。我在书中到为止介绍的每个命令也适用于多线程程序。因此，在调试器下启动程序并在第\
    \ 48 行设置断点应该是你已经熟悉的：\n\n```bash\n$ gdb fibonacci_threads\nGNU gdb (GDB) Red Hat\
    \ Linux 7.6-1\nCopyright (C) 2013 Free Software Foundation, Inc.\nLicense GPL3\
    \ version 3 or later <http://gnu.org/licenses/gpl.html>\nReading symbols from\
    \ /home/books/fibonacci_threads...done.\n(gdb) b 48\nBreakpoint 1 at 0x4008bc:\
    \ file fibonacci_threads.c, line 48.\n```\n\n我可以运行程序直到遇到断点：\n\n```bash\n(gdb)\
    \ r\nStarting program: /home/books/fibonacci_threads [Thread debugging using libthread_db]\n\
    Using host libthread_db \"/lib64/libthread_db.1\".\nThread 0: Number of terms:\n\
    4\nThread 1: Number of terms:\n5\nThread 2: Number of terms:\n8\n[New Thread 0x7ffff7fe00\
    \ (LWP 3325)]\n[New Thread 0x7ffff6ffd00 (LWP 3326)]\n[New Thread 0x7ffff6fc00\
    \ (LWP 3327)]\nBreakpoint 1, main () at fibonacci_threads.c:49\n49 for ( i = 0;\
    \ i < NUM_THREADS; i++ )\n```\n\n从上面的输出可以看出，`gdb` 已经发现了额外的线程（New Thread 0x7fff...）。我们已经安全地假设这些线程是程序的工作线程。但如何检查这些线程确实是我们要找的呢？这种情况下第一个命令是\
    \ `info threads`：\n\n```bash\n(gdb) info threads\nId   Target                \
    \                Frame \n4    0x7ffff6fc00 (LWP 3194) \"fibonacci_threa\"  0x00007ffff78f5a1\
    \ in clone () from /lib64/libc.6\n3    0x7ffff6ffd00 (LWP 3193) \"fibonacci_threa\"\
    \  0x00007ffff8bcad in nanosleep () from /lib64/libc.6\n2    0x7ffff7fe00 (LWP\
    \ 3192) \"fibonacci_threa\"  0x00007ffff8bcad in nanosleep () from /lib64/libc.6\n\
    *1    0x7ffff7fdf40 (LWP 3188) \"fibonacci_threa\"  main () at fibonacci_threads.c:49\n\
    ```\n\n从 `info threads` 的输出可以看到 `fibonacci_thread` 包含四个线程。这是我在第 48 行预期创建的线程数量。一个线程（id\
    \ 1）是应用程序的主线程。其他三个线程（id 2,3 和 4）是在第 44 行创建的工作线程。线程 id 1 处有一个 `*` 标记，这意味着线程 id\
    \ 1 是当前焦点。所有的 `gdb` 命令都针对具有焦点的线程执行。\n\n```bash\n(gdb) bt\n#0 main () at fibonacci_threads.c:49\n\
    (gdb) info local\ntid = {140737345742592, 140737337349888, 140737328957184}\n\
    n = {4, 5, 8}\ni = 3\n```\n\n注意，一旦多线程遇到断点，所有线程的执行都会停止，而不只是触发断点的线程。这允许对其他线程进行检查。\n\
    \n`t` 命令允许将焦点切换到一个停止的线程。以下是切换到该线程的示例：\n\n```bash\n(gdb) t 3\n(gdb) bt\n#0 0x00007ffff7bcad\
    \ in nanosleep () from /lib64/libc.6\n#1 0x00007ffff78c4 in sleep () from /lib64/libc.6\n\
    #2 0x00007ffff78fe in fibonacci (arg=0x5) at fibonacci_threads.c:22\n#3 0x00007ffff7df3\
    \ in start_thread () from /lib64/libpthread.so\n#4 0x00007ffff78f53dd in clone\
    \ () from /lib64/libc.6\n```\n\n但如果我将断点设置在一个只由工作线程执行的行会怎样？比如第 11 行。这个断点会被命中吗？让我们尝试这种场景：\n\
    \n```bash\n(gdb) b 11\nBreakpoint 2 at 0x4007c1: fibonacci_threads.c, line 11.\n\
    (gdb) r\nStarting program: /home/books/fibonacci_threads [Thread debugging using\
    \ libthread_db]\nUsing host libthread_db \"/lib64/libthread_db.1\".\nThread 0:\
    \ Number of terms:\n4\nThread 1: Number of terms:\n5\nThread 2: Number of terms:\n\
    8\n[New Thread 0x7ffff7fe00 (LWP 3325)]\n[New Thread 0x7ffff6ffd00 (LWP 3326)]\n\
    [New Thread 0x7ffff6fc00 (LWP 3327)]\nBreakpoint 1, main () at fibonacci_threads.c:49\n\
    49 for ( i = 0; i < NUM_THREADS; i++ )\n```\n\n"
- fmt: "\nEven if line 11 is common across all the three worker threads, one of them\
    \ will be hitting this breakpoint first. In my example thread 2 hits the breakpoint\
    \ first, which is somehow expected as this was the first worker thread created\
    \ by the program. However accurately predicting which thread is reaching that\
    \ line first is difficult as this depends entirely on multiple other factors (kernel\
    \ scheduling policy, total number of threads in the system, other thread priorities,\
    \ etc...). \n\nIf I continue the execution of the program from where the breakpoint\
    \ was hit, I can see that the breakpoint will be hit second time by the second\
    \ worker thread (thread id 3). And this thread also gets the focus:\n\n```gdb\n\
    (gdb) c\nContinuing.\n[Switching to Thread 0x7ffff6ffd700 (LWP 3340)]\nBreakpoint\
    \ 1, fibonacci (arg=0x5) at fibonacci_threads.c:12\n12      for ( i = 0 ; i <\
    \ n ; i++ )\n(gdb) info threads\n[New Thread 0x7ffff67fc700 (LWP 3418)]\n Id Target\
    \ Id Frame\n4 Thread 0x7ffff67fc700 (LWP 3418) \"fibonacci_threa\" 0x00007ffff78f53a1\
    \ in clone () from /lib64/libc.so.6\n 3 Thread 0x7ffff6ffd700 (LWP 3340) \"fibonacci_threa\"\
    \ fibonacci (arg=0x5) at fibonacci_threads.c:12\n2 Thread 0x7ffff77fe700 (LWP\
    \ 3339) \"fibonacci_threa\" 0x00007ffff78bc8ad in nanosleep () from /lib64/libc.so.6\n\
    1 Thread 0x7ffff7fdf740 (LWP 3335) \"fibonacci_threa\" 0x00007ffff78f53a1 in clone\
    \ () from /lib64/libc.so.6\n```\n\nThese are in a nutshell the fundamentals of\
    \ dealing with multithreaded Linux programs under `gdb`: detecting what threads\
    \ are part of the program and switching the context among them in order to explore\
    \ the internal state of each thread.\n\n## Dealing with crashes\n\nOne of the\
    \ most powerful feature of `gdb` is investigating what traditionally has been\
    \ a difficult issue to deal with: program crashes. A crash that happens randomly\
    \ without any apparent reason is notoriously difficult to investigate without\
    \ having a way to get some context about what led to the program crash. And this\
    \ is where `gdb` can assist with, to provide the backtrace to where the crash\
    \ happened and give information about the context of each call frame leading to\
    \ the crash.\n\nBelow is a program that was written in such a way that will deliberately\
    \ crash during the execution.\n\n```c\n#include<stdio.h>\n\nvoid functionC() {\n\
    \    int *p = NULL;\n    p = 25;\n}\n\nvoid functionB() {\n    functionC();\n\
    }\n\nvoid functionA() {\n    functionB();\n}\n\nint main() {\n    printf(\"Program\
    \ started\\n\");\n    functionA();\n    printf(\"Program finished\\n\");\n   \
    \ return 0;\n}\n```\n\nAssuming that the source code above is located in a file\
    \ called `crashy.c` I can build this program with the following command:\n\n```bash\n\
    $ gcc -g crashy.c -o crashy\n```\n\nNext I am going to pretend that I don’t know\
    \ what is causing this program to crash and I will be using `gdb` to assist me\
    \ in pinpointing the root cause for the crash.\n\nTo be able to investigate program\
    \ crashes I need to instruct the operating system to save the crash data. I can\
    \ do this by issuing the following command:\n\n```bash\n$ ulimit -c unlimited\n\
    ```\n\nThe crash data is stored in a particular Linux file called: `core file`.\
    \ A core file is essentially a snapshot of the system, including memory and CPU\
    \ registers just at the point when the crash occurred. The command above will\
    \ enable the core file of unlimited size. By default the core size is zero, meaning\
    \ that no core file is produced. The core files can be be set to a particular\
    \ maximum size but the risk here that the produced core file may not contain enough\
    \ information to assist with the debugging. Therefore it is recommended that the\
    \ core file size to be set to `unlimited` assuming there are no strict restrictions\
    \ with regards to storage space.\n\nLets run the `crashy` program providing the\
    \ core files generation is now enabled. This will produce the following output:\n\
    \n```bash\n$ ./crashy\nProgram started\nSegmentation fault (core dumped)\n```\n\
    \nI can see in the output some indication that a core file was generated. And\
    \ if I list the content of the folder then I can see that the core file has been\
    \ generated indeed:\n\n```bash\n$ ls -lrt\n-rw-rw-r--. 1 ssosiade ssosiade 256\
    \ Feb 23 12:07 crashy.c\n-rwxrwxr-x. 1 ssosiade ssosiade 9830 Feb 23 12:08 crashy\n\
    -rw-------. 1 ssosiade ssosiade 253952 Feb 23 12:20 core.4890\n```\n\n```bash\n\
    $ file core.4890\ncore.4890: ELF 64-bit LSB core x86-64, version 1 (SYSV), from\
    \ './crashy'\n```\n\nNote that by default the naming convention for core file\
    \ is `core_<pid>` where `pid` is process id of the process that caused the crash.\
    \ I can run `gdb` against the crash file using the following command:\n\n```bash\n\
    $ gdb crashy core.4890\nGNU gdb (GDB) Red Hat Linux 7.6-80el\nCopyright (C) 2013\
    \ Free Foundation, Inc.\nLicense GPLv3-2 or later <http://gnu.org/licenses/gpl.html>\n\
    This is free software: you are free to change and redistribute it. There is NO\
    \ WARRANTY, to the extent permitted by law. Type \"show warranty\" for details.\n\
    GDB was configured as \"x86_64-linux-gnu\".\nFor bug reporting, please see:<http://www.gnu.org/software/gdb/>\n\
    Reading symbols from /home/ssosiade/book/crashy...\n[New LWP 4890]\nCore generated\
    \ by `./crashy'.\nProgram terminated with signal 11, Segmentation fault.\nProgram\
    \ reason attempt to dereference a null pointer at line 5: p=25\nI can further\
    \ explore the calling sequence that led my program to execute that instruction\
    \ by `bt` (`backtrace`) `gdb` command:\n\n```gdb\n(gdb) bt\n#0 0x000000000400540\
    \ in functionC () at crashy.c:5\n#1 0x000000000400556 in functionB () at crashy.c:9\n\
    #2 0x000000000400566 in functionA () at crashy.c:13\n#3 0x000000000400580 in main\
    \ () at crashy.c:19\n```\n\nI can continue investigating the context of the program\
    \ and look at the state of execution for all the threads, local and public variables,\
    \ CPU registers, memory in use during execution or source files:\n\n```gdb\n(gdb)\
    \ info local\np = 0x0\n(gdb) info threads\n Id Target Id Frame\n1 LWP 4890 0x000000000400540\
    \ in functionC () at crashy.c:5\n(gdb) info registers\nrax            0x0\nrbx\
    \            0x0\nrcx            0x7fcd7397a30 140520385509936\nrdx          \
    \  0x7fcd73d6ca10 140520388479504\nrsi            0x7fcd3f90000 140520390721536\n\
    rdi            1\nrbp            0x7ffd0eda1c0 0x7ffd0eda1c0\nrsp            0x7ffd0eda1c0\
    \ 0x7ffd0eda1c0\nr8             0xffffffff 2294967295\nr9             0x0\nr10\
    \            0x2234\nr11            0x246582\nr12            0x400440 4195392\n\
    r13            0x7ffd0eda2d0 140724852269776\nr14            0x0\nr15        \
    \    0x0\nrip            0x400540 0x400540 <functionC+16>\neflags         0x10246\
    \ [ PF ZF IF RF ]\ncs             0x3351\nss             0x2b43\nds          \
    \   0x0\nes             0x0\nfs             0x0\ngs             0x0\n```\n\n```gdb\n\
    (gdb) info files\nSymbols from \"/home/ssosiade/book/crashy\".\nLocal core dump\
    \ file:\n`/home/ssosiade/book/core.4890`, file type elf64-x86-64\n0x0000000000400000\
    \ - 0x000000000041000 is load1\n0x0000000000600000 - 0x0000000000601000 is load2\n\
    0x0000000000601000 - 0x0000000000602000 is load3\n0x00007fcd739b0000 - 0x00007fcd739b1000\
    \ is load4a\n… omitted for brevity>\n```\n\n```gdb\n(gdb) info sources\nSource\
    \ files for which symbols have been read in:\n/home/ssosiade/book/crashy.c\n\n\
    Source files for which symbols will be read in on demand:\n```\n\n```gdb\n(gdb)\
    \ info source\nCurrent source file is crashy.c\n```\n"
