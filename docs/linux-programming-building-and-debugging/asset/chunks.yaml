- fmt: '

    - `b module:line` - sets a breakpoint at a specific line in a specific module

    - `b symbol` - sets a breakpoint at a specific symbol

    - `b line` – sets a breakpoint at a particular line in the current module

    - `b +lines` – sets a breakpoint a number of lines after the current execution
    point

    - `b -lines` – sets a breakpoint a number of lines before the current execution
    point

    - `b module:function` – sets a breakpoint for a particular function in a different
    module

    - `b` – sets a breakpoint at the next line

    - `b address` – sets the breakpoint at a particular address


    Here is an example on how to set a breakpoint at line number 10 in `fibonacci.c`
    file:


    ```

    (gdb) b fibonacci.c:10

    Breakpoint 1 at 0x4005ad: file fibonacci.c, line 10.

    ```


    And here is an example on how to set a breakpoint when the first call to “printf”
    is made:


    ```

    (gdb) b printf

    Breakpoint 2 at 0x400450

    ```


    The following command can be used to see all the breakpoints in use:


    ```

    (gdb) info break

    Num Type Disp Enb Address What

    1 breakpoint keep y 0x00000000004005ad in main at fibonacci.c:10

    2 breakpoint keep y 0x0000000000400450 <printf@plt>

    ```


    Breakpoints can be deleted or disabled. A disabled breakpoint behaves similarly
    as a deleted breakpoint. The only difference is that a disabled breakpoint can
    be reused (reenabled) at some later point in time if needed.


    The gdb commands `enable` and `disable` can be used in order to enable or disable
    a breakpoint:


    ```

    (gdb) disable 1

    (gdb) info break

    Num Type    Disp Enb Address What

    1 breakpoint keep n 0x00000000004005ad in main at fibonacci.c:10

    2 breakpoint keep y 0x0000000000400450 <printf@plt>


    (gdb) enable 1

    (gdb) info break

    Num Type    Disp Enb Address     What

    1 breakpoint keep y 0x00000000004005ad in main at fibonacci.c:10

    2 breakpoint keep y 0x0000000000400450 <printf@plt>

    ```


    Similarly to delete a break point `delete` gdb command can be used. Here is for
    example how to delete the second breakpoint from the list above:


    ```

    (gdb) delete 2

    (gdb) info break

    Num Type Disp Enb Address What

    1 breakpoint keep y 0x00000000004005ad in main at fibonacci.c:10

    ```


    Once I have the breakpoints set I can start executing the program. The execution
    of the program will stop as soon as the first breakpoint is hit:


    ```

    (gdb) r

    Starting program: /books/gdb/fibonacci

    Number of terms:

    5

    Breakpoint 1, main () at fibonacci.c:10

    10 for ( i = 0 ; i < n ; i++ )

    ```


    ## Stepping through code


    Once execution of the program is stopped I can choose to continue executing the
    program “step-by-step”. Step by step execution is particularly useful for the
    following cases:


    - to see if the program follows the flow that it was intended by design

    - to follow the values of variables for each instruction of the program.


    The commands for step by step debugging are `s` (`step`) and `n` (`next`). The
    difference between them is the following: `step` continues the execution until
    the next line of program from the same module is hit. This means that if execution
    of the current line requires calling functions from different modules these calls
    will be fully executed and the debugger will not be stepping into these calls.


    When stepping into the nested calls is required then `next` command can be be
    used. This command will make the debugger to stop at the next line of code in
    the program regardless of whether this is in the current module or not.


    Below is an example about how I can step through the code starting from the line
    10 of the program:


    ```

    (gdb) b 10

    Breakpoint 1 at 0x400626: file fibonacci.c, line 10.

    (gdb) r

    Starting program: /books/linux_building/fibonacci

    Number of terms:

    4

    Breakpoint 1, main () at fibonacci.c:10

    10 for ( i = 0 ; i < n ; i++ )

    (gdb) n

    12 if ( i <= 1 )

    (gdb) s

    13 next = i;

    (gdb) n

    20 printf("%d\n",next);

    (gdb) s

    0

    10 for ( i = 0 ; i < n ; i++ )

    (gdb) s

    12 if ( i <= 1 )

    (gdb) s

    13 next = i;

    ```


    ## Setting watchpoints


    Watchpoints are similar to breakpoints to some extent. The main difference is
    that watchpoints are set on variables instead of location of code. Therefore of
    instructing the debugger “to stop at line 10 in foo.c” by using a watchpoint we
    can instruct the debugger to stop “when value of y has changed” or “when value
    of variable x is equal to 5”.


    Before seeing an example with watchpoints I must tell you that the compiler can
    sometimes do optimizations regarding how to handle automatic variables. The compiler
    may decide for instance to store variables in CPU registers instead of memory.
    This will make the access to those variables significantly faster, but the trade-off
    here is that we cannot use watchpoints because there are no symbols generated
    for these variables when CPU registers are used.


    Typical gdb message for this case is: `No symbol "foo" in current context.`


    A way to avoid using registers for holding variables is to force the compiler
    to perform no optimization (using `-O0`) as in the following example:


    ```

    gcc -O0 -g fibonacci.c -o fibonacci

    ```


    Now I can be sure that each variable has a corresponding symbol and I can use
    any variable for setting watchpoints. Below is an example on how I can set a watchpoint
    to stop the execution of the program every time the variable `next` is modified.


    ```

    (gdb) watch next

    Hardware watchpoint 2: next

    ```


    All the watchpoints can be listed alongside with the breakpoints:


    ```

    (gdb) info break

    Num Type Disp Enb Address What

    2 hw watchpoint keep y next

    ```


    Also watchpoints can be enabled, disabled or deleted in the similar way as I did
    with the breakpoints using gdb commands `enable`, `disable` and `delete` respectively.
    If I run the program using the above watchpoint the debugger execution will be
    as follows:


    ```

    (gdb) c

    Continuing.

    Number of terms:

    4

    0

    Hardware watchpoint 2: next

    Old value = 0

    New value = 1

    0x0000000000405c2 in main () at fibonacci.c:13

    13 next = i;

    ```


    We can see from the output above that the program has stopped at line 13 in the
    program while executing the following statement: `next = i;`.


    What if for example I want to stop the program only when the value of the counter
    `i` becomes 5? Here is how I can do this:


    ```

    (gdb) watch i=5

    Hardware watchpoint 2: i=5

    (gdb) c

    Continuing.

    Number of terms:

    10

    Hardware watchpoint 2: i=5

    Old value = <unreadable>

    New value = 5

    0x0000000000405b4 in main () at fibonacci.c:10

    10 for ( i = 0 ; i < n ; i++ )

    ```


    ## Examining the content of variables


    How could I check for the previous example that the program actually stops when
    it should be? How can we inspect the content of the variable `i` and ensure that
    has the value of 5 when the execution of the program stops?


    The content of the variables can be inspected by using `print` command.


    ```

    (gdb) print i

    $1 = 5

    ```


    So I can see that indeed the watchpoint was triggered as expected and the variable
    `i` has the value of 5 when the program execution stopped. I can continue to poke
    around to see the values of the other variables:


    ```

    (gdb) print first

    $5 = 0

    (gdb) print second

    $6 = 1

    (gdb) print n

    $7 = 10

    ```


    `print` allows specifying several output formats:


    - `x`: print as integer in hexadecimal.

    - `d`: print as integer in signed decimal.

    - `u`: print as integer in unsigned decimal.

    - `o`: print as integer in octal.

    - `t`: print as integer in binary.

    - `a`: print as an address

    - `c`: print as a character constant.

    - `f`: print using typical floating point syntax.


    Here are some example for displaying the variable `n` using each of the above
    formats:


    ```

    (gdb) print/x n

    $8 = 0xa

    (gdb) print/d n

    $9 = 10

    (gdb) print/u n

    $10 = 10

    (gdb) print/o n

    $11 = 12

    (gdb) print/t n

    $12 = 1010

    ```

