    \nThe output of the command above is a Linux executable called “hello_c” that\
    \ I can try to execute:\n\n*$ ./hello_c*\n\n*Hello world!*\n\nThe gcc command\
    \ above oerforms the both steps building, compiling and linking, in one go.\n\n\
    If I want to build from source code and generate the object file file only, then\
    \ I can use the following command:\n\n*$ gcc -c hello.c*\n\nThe “-c” option stands\
    \ for “compile” and instructs gcc to run only the pre-processor and compiler.\
    \ The output of this command will be a “hello.o” object file located in the same\
    \ folder. This object file can subsequently be linked using the following command:\n\
    \n*$ gcc hello.o -o hello_c*\n\nHere gcc is smart enough to detect that an object\
    \ file was passed in and execute only the linker. The generated output will be\
    \ the same “hello_c” executable created in the first example but this time built\
    \ by running the compilation and linker as two separate steps.\n\nWhen required\
    \ gcc can be run for pre-processesing only by using “-E” option:\n\n*$ gcc -E\
    \ hello.c*\n\nAfter running the command above you will notice that the tiny hello.c\
    \ program will increase significantly in size. This is because of #include <stdio.h>\
    \ directive which will direct the pre-processor to include the entire content\
    \ of theheader file alongside with all the other dependencies into the output\
    \ of the pre processed C file..\n\nIt is also possible to stop the compiling after\
    \ preprocessing and inspect the generated output.\n\nLets see how to build a C++\
    \ version of the “Hello World” example. And I will start from a hello.cpp file\
    \ having the following content:\n\n*#include \"iostream\"*\n\n*int main(void)*\n\
    \n*{*\n\n *std::cout << \"Hello world from C++.\\n\";*\n\n *return 0;*\n\n*}*\n\
    \nI can build this with the following command line:\n\n*$ g++ -g -Wall hello.cpp\
    \ -o hello_cpp*\n\nWhere g++ is the GNU C++ compiler and “-g” and “-o” have the\
    \ same meaning as in the gcc command line presented before.\n\nOnce the command\
    \ above is successfully completed I can try to execute the generated executable:\n\
    \n*$ ./hello_cpp*\n\n*Hello world from C++.*\n\nThis chapter was intended to give\
    \ you a feeling of how to install and use GNU C/C++ compiler from command line.\
    \ I can move to slightly more complex examples in the next sections of this book.\n\
    \n# Building a program from multiple source modules\n\nThere are very rare the\
    \ cases when the content of a program is entirely located in a single source file.\
    \ Good software development practices require using multiple source files for\
    \ implementing various parts of the product.\n\nBuilding a Linux program from\
    \ C/C++ source code deals with several type of files:\n\n- **Source files (*.cpp\
    \ or *.c)** – text files that contain the main function implementation and the\
    \ implementation for other functions or classes used by the program.\n\n- **Header\
    \ files (*.h)** – text files that contain functions or classes prototypes alongside\
    \ with other processor statements. An example will be shown shortly in this chapter\
    \ for source and header files.\n\n- **Object files (*.o)** – the output of the\
    \ compiler.\n\n- **Binary files** – the executable, static libraries (*.a) or\
    \ dynamic libraries (*.so). For now we can treat the libraries as being a prebuilt\
    \ repository of object files which can be used in building other programs. I have\
    \ two dedicated chapters later on in this book for building static and dynamic\
    \ libraries.\n\nLets start with an example of a program that is created from three\
    \ modules: **module1**, **module2** and **module3** respectively. The source code\
    \ resides in the following files:\n\n**main.c**\n\n*#include \"module1.h\"*\n\n\
    *#include \"module2.h\"*\n\n*#include \"module3.h\"*\n\n*int main() {*\n\n *HelloModule1();*\n\
    \n *HelloModule2();*\n\n *HelloModule3();*\n\n *return 0;*\n\n*}*\n\n**module1.h**\n\
    \n*#ifndef MODULE1_H_*\n\n*#define MODULE1_H_*\n\n*void HelloModule1();*\n\n*#endif*\n\
    \n**module1.c**\n\n*#include <stdio.h>*\n\n*#include \"module1.h\"*\n\n*void HelloModule1()\
    \ {*\n\n *printf(\"Hello from module 1\\n\");*\n\n*}*\n\n**module2.h**\n\n*#ifndef\
    \ MODULE2_H_*\n\n*#define MODULE2_H_*\n\n*void HelloModule2();*\n\n*#endif*\n\n\
    **module2.c**\n\n*#include <stdio.h>*\n\n*#include \"module2.h\"*\n\n*void HelloModule2()\
    \ {*\n\n *printf(\"Hello from module 2\\n\");*\n\n*}*\n\n**module3.h**\n\n*#ifndef\
    \ MODULE3_H_*\n\n*#define MODULE3_H_*\n\n*void HelloModule3();*\n\n*#endif*\n\n\
    **module3.c**\n\n*#include <stdio.h>*\n\n*#include \"module3.h\"*\n\n*void HelloModule3()\
    \ {*\n\n *printf(\"Hello from module 3\\n\");*\n\n*}*\n\nBuilding a program from\
    \ multiple sources typically involves the following steps:\n\n- The source code\
    \ files are “compiled” and object files are produced.\n\n*$ gcc -c module1.c module2.c\
    \ module3.c main.c*\n\n*$ ls *.o*\n\n*main.o module1.o module2.o module3.o*\n\n\
    - The object files are “linked” (or “archived”) producing the executable (or libraries\
    \ respectively)\n\n*$ gcc module1.o module2.o module3.o main.o -o hello*\n\n*$\
    \ ./hello*\n\n*Hello from module 1*\n\n*Hello from module 2*\n\n*Hello from module\
    \ 3*\n\n# Make and Makefile\n\nWe have just learnt from the previous chapter how\
    \ to build a program from multiple source files. It seems easy and straight forward.\
    \ But what if instead of three modules we have to deal with hundreds of source\
    \ files (quite normal for large projects)?. Building a command line for gcc with\
    \ so many files is obviously not an option. What do we do then?\n\nThe first thing\
    \ that may spring to mind is to create a program or script that will attempt to\
    \ automate the process of building the code and make this process easy and repeatable.\
    \ The good news is that you do not have to write anything because such a program\
    \ already exists. This is another GNU tool called “make”. The make program understands\
    \ and executes different rules specified in an input file called “Makefile”. So\
    \ while the make tool remains generic, the makefile contains the rules governing\
    \ how a particular program has to be build.\n\nI will start by presenting an example\
    \ for a makefile that is functionally equivalent to the shell commands that I\
    \ used to build the hello executable in the previous chapter. The goal of this\
    \ example is to give a brief overview of the makefile syntax and usage.\n\nTo\
    \ begin, lets assume I have the following files in my current working directory.\n\
    \n*$ ls*\n\n*main.c Makefile module1.c module1.h module2.c module2.h module3.c\
    \ module3.h*\n\nThe header and source files are the same files I used in the previous\
    \ example. The content of the makefile file is the following:\n\n*$ cat Makefile*\n\
    \n*module1.o: module1.c module1.h*\n\n *gcc -c module1.c*\n\n*module2.o: module2.c\
    \ module2.h*\n\n *gcc -c module2.c*\n\n*module3.o: module3.c module3.h*\n\n *gcc\
    \ -c module3.c*\n\n*main.o: main.c*\n\n *gcc -c main.c*"
