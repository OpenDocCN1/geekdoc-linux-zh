- fmt: "\nTherefore GCC compiler will be used for building all the examples presented\
    \ in this book.\n\nIf you are a Fedora, Red Hat or CentOS user then you can use\
    \ the following command to install the GNU C/C++ compiler on your Linux machine:\n\
    \n```bash\nsudo yum groupinstall 'Development Tools'\n```\n\nAlternatively if\
    \ you are Debian or Ubuntu user then you can use the following `agt-get` command\
    \ for installation:\n\n```bash\nsudo apt-get install build-essential manpages-dev\n\
    ```\n\nAssuming that the installation was successful then the following command\
    \ should display the version of the newly installed compiler:\n\n```bash\ngcc\
    \ --version\n```\n\n```text\ngcc (GCC) 4.4.7 20120313 (Red Hat 4.4.7-11)\nCopyright\
    \ (C) 2010 Free Software Foundation, Inc.\n```\n\nLets use this compiler to compile\
    \ the already famous “Hello World” program, presented by the parents of C language,\
    \ Dennis Ritchie and Brian Kernighan.\n\nLets suppose that the following C program\
    \ resides in a file named `hello.c`\n\n```c\n#include <stdio.h>\nvoid main()\n\
    {\n    printf(\"Hello world!\\n\");\n}\n```\n\nI can compile this C program by\
    \ issuing the following command:\n\n```bash\ngcc -g hello.c -o hello_c\n```\n\n\
    In the `gcc` command above I used `-o` option to specify the name of the generated\
    \ executable (`hello_c`) and `-g` option to instruct the compiler to include debugging\
    \ information in the output. It is a god practice to compile with debugging information\
    \ during development so more functionality of the debugger can be used in order\
    \ to fix possible issues.\n\nThe output of the command above is a Linux executable\
    \ called `hello_c` that I can try to execute:\n\n```bash\n./hello_c\nHello world!\n\
    ```\n\nThe `gcc` command above oerforms the both steps building, compiling and\
    \ linking, in one go.\n\nIf I want to build from source code and generate the\
    \ object file file only, then I can use the following command:\n\n```bash\ngcc\
    \ -c hello.c\n```\n\nThe `-c` option stands for “compile” and instructs `gcc`\
    \ to run only the pre-processor and compiler. The output of this command will\
    \ be a `hello.o` object file located in the same folder. This object file can\
    \ subsequently be linked using the following command:\n\n```bash\ngcc hello.o\
    \ -o hello_c\n```\n\nHere `gcc` is smart enough to detect that an object file\
    \ was passed in and execute only the linker. The generated output will be the\
    \ same `hello_c` executable created in the first example but this time built by\
    \ running the compilation and linker as two separate steps.\n\nWhen required `gcc`\
    \ can be run for pre-processesing only by using `-E` option:\n\n```bash\ngcc -E\
    \ hello.c\n```\n\nAfter running the command above you will notice that the tiny\
    \ `hello.c` program will increase significantly in size. This is because of `#include\
    \ <stdio.h>` directive which will direct the pre-processor to include the entire\
    \ content of theheader file alongside with all the other dependencies into the\
    \ output of the pre processed C file..\n\nIt is also possible to stop the compiling\
    \ after preprocessing and inspect the generated output.\n\nLets see how to build\
    \ a C++ version of the “Hello World” example. And I will start from a `hello.cpp`\
    \ file having the following content:\n\n```cpp\n#include \"iostream\"\nint main(void)\n\
    {\n    std::cout << \"Hello world from C++.\\n\";\n    return 0;\n}\n```\n\nI\
    \ can build this with the following command line:\n\n```bash\ng++ -g -Wall hello.cpp\
    \ -o hello_cpp\n```\n\nWhere `g++` is the GNU C++ compiler and `-g` and `-o` have\
    \ the same meaning as in the `gcc` command line presented before.\n\nOnce the\
    \ command above is successfully completed I can try to execute the generated executable:\n\
    \n```bash\n./hello_cpp\nHello world from C++.\n```\n\nThis chapter was intended\
    \ to give you a feeling of how to install and use GNU C/C++ compiler from command\
    \ line. I can move to slightly more complex examples in the next sections of this\
    \ book.\n\n# Building a program from multiple source modules\n\nThere are very\
    \ rare the cases when the content of a program is entirely located in a single\
    \ source file. Good software development practices require using multiple source\
    \ files for implementing various parts of the product.\n\nBuilding a Linux program\
    \ from C/C++ source code deals with several type of files:\n\n- **Source files\
    \ (`*.cpp` or `*.c`)** – text files that contain the main function implementation\
    \ and the implementation for other functions or classes used by the program.\n\
    - **Header files (`*.h`)** – text files that contain functions or classes prototypes\
    \ alongside with other processor statements. An example will be shown shortly\
    \ in this chapter for source and header files.\n- **Object files (`*.o`)** – the\
    \ output of the compiler.\n- **Binary files** – the executable, static libraries\
    \ (`*.a`) or dynamic libraries (`*.so`). For now we can treat the libraries as\
    \ being a prebuilt repository of object files which can be used in building other\
    \ programs. I have two dedicated chapters later on in this book for building static\
    \ and dynamic libraries.\n\nLets start with an example of a program that is created\
    \ from three modules: `module1`, `module2` and `module3` respectively. The source\
    \ code resides in the following files:\n\n**main.c**\n\n```c\n#include \"module1.h\"\
    \n#include \"module2.h\"\n#include \"module3.h\"\nint main() {\n    HelloModule1();\n\
    \    HelloModule2();\n    HelloModule3();\n    return 0;\n}\n```\n\n**module1.h**\n\
    \n```c\n#ifndef MODULE1_H\n#define MODULE1_H\nvoid HelloModule1();\n#endif\n```\n\
    \n**module1.c**\n\n```c\n#include <stdio.h>\n#include \"module1.h\"\nvoid HelloModule1()\
    \ {\n    printf(\"Hello from 1\\n\");\n}\n```\n\n**module2.h**\n\n```c\n#ifndef\
    \ MODULE2_H\n#define MODULE2_H\nvoid HelloModule2();\n#endif\n```\n\n**module2.c**\n\
    \n```c\n#include <stdio.h>\n#include \"module2.h\"\nvoid HelloModule2() {\n  \
    \  printf(\"Hello from 2\\n\");\n}\n```\n\n**module3.h**\n\n```c\n#ifndef MODULE3_H\n\
    #define MODULE3_H\nvoid HelloModule3();\n#endif\n```\n\n**module3.c**\n\n```c\n\
    #include <stdio.h>\n#include \"module3.h\"\nvoid HelloModule3() {\n    printf(\"\
    Hello from 3\\n\");\n}\n```\n\nBuilding a program from multiple sources typically\
    \ involves the following steps:\n\n- The source files are “compiled” and object\
    \ files are produced.\n```bash\ngcc -c module1.c module2.c module3.c main.c\n\
    ```\n```bash\nls *.o\nmain.o module1.o module2.o module3.o\n```\n- The object\
    \ files are “linked” (or “archived”) producing the executable (or libraries respectively)\n\
    ```bash\ngcc module1.o module2.o module3.o main.o -o hello\n```\n```bash\n./hello\n\
    Hello from 1\nHello from 2\nHello from 3\n```\n\n# Make and Makefile\n\nWe have\
    \ just learnt from the previous chapter how to build a program from multiple source\
    \ files. It seems easy and straight forward. But what if instead of three modules\
    \ we have to deal with hundreds of source files (quite normal for large projects)?\
    \ Building a command line for `gcc` with so many files is obviously not an option.\
    \ What do we do then?\n\nThe first thing that may spring to mind is to create\
    \ a program or script that will attempt to automate the process of building the\
    \ code and make this process easy and repeatable. The good news is that you do\
    \ not have to write anything because such a program already exists. This is another\
    \ GNU tool called `make`. The `make` program understands and executes different\
    \ rules specified in an input file called `Makefile`. So while the `make` tool\
    \ remains generic, the `Makefile` contains the rules governing how a particular\
    \ program has to be build.\n\nI will start by presenting an example for a makefile\
    \ that is functionally equivalent to the shell commands that I used to build the\
    \ hello executable in the previous chapter. The goal of this example is to give\
    \ a brief overview of the makefile syntax and usage.\n\nTo begin, lets assume\
    \ I have the following files in my current working directory.\n\n```bash\nls\n\
    main.c Makefile module1.c module1.h module2.c module2.h module3.c module3.h\n\
    ```\n\nThe header and source files are the same files I used in the previous example.\
    \ The content of the makefile file is the following:\n\n```bash\ncat Makefile\n\
    ```\n\n```makefile\nmodule1.o: module1.c module1.h\n\tgcc -c module1.c\n\nmodule2.o:\
    \ module2.c module2.h\n\tgcc -c module2.c\n\nmodule3.o: module3.c module3.h\n\t\
    gcc -c module3.c\n\nmain.o: main.c\n\tgcc -c main.c\n\nhello: module1.o module2.o\
    \ module3.o main.o\n\tgcc module1.o module2.o module3.o main.o -o hello\n```\n"
