  trans: "\n\n即使第 11 行在三个工作线程中都是通用的，其中一个线程也会先命中此断点。在我的示例中，线程 2 首先命中了断点，这在某种程度上是意之中的，因为这是程序创建的第一个工作线程。然而，准确预测哪个线程会先到达该行是困难的，因为这完全取决于多个其他因素（内核调度策略、系统中的线程总数、其他线程的优先级等）。\n\
    \n如果我从命中断点的地方继续执行程序，可以看到断点将由第二个工作线程（线程 ID 3）第二次命中。而且该线程也获得了焦点：\n\n```gdb\n(gdb)\
    \ c\nContinuing.\n[Switching to Thread 0x7ffff6ffd700 (LWP 3340)]\nBreakpoint\
    \ 1, fibonacci (arg=0x5) at fibonacci_threads.c:12\n12      for ( i = 0 ; i <\
    \ n ; i++ )\n(gdb) info threads\n[New Thread 0x7ffff67fc700 (LWP 3418)]\n Id Target\
    \ Id Frame\n4 Thread 0x7ffff67fc700 (LWP 3418) \"fibonacci_threa\" 0x00007ffff78f53a1\
    \ in clone () from /lib64/libc.so.6\n 3 Thread 0x7ffff6ffd700 (LWP 3340) \"fibonacci_threa\"\
    \ fibonacci (arg=0x5) at fibonacci_threads.c:12\n2 Thread 0x7ffff77fe700 (LWP\
    \ 3339) \"fibonacci_threa\" 0x00007ffff78bc8ad in nanosleep () from /lib64/libc.so.6\n\
    1 Thread 0x7ffff7fdf740 (LWP 3335) \"fibonacci_threa\" 0x00007ffff78f53a1 in clone\
    \ () from /lib64/libc.so.6\n```\n\n简而言之，这些是在 `gdb` 下处理多线程 Linux 程序的基础：检测哪些线程是程序的一部分，并在它们之间切换上下文，以便探索每个线程的内部状态。\n\
    \n## 处理崩溃\n\n`gdb` 最强大的功能之一是调查传统上难以处理的问题：程序崩溃。一个在没有任何明显原因的情况下随机发生的崩溃，如果没有一种方法获取导致程序崩溃的上下文信息，调查起来将是极其困难的。这正是\
    \ `gdb` 可以派上用场的地方，它可以提供崩溃发生处的回溯轨迹（backtrace），并提供导致崩溃的每个调用栈帧的上下文信息。\n\n下面是一个程序，其编写方式故意会在执行期间发生崩溃。\n\
    \n```c\n#include<stdio.h>\n\nvoid functionC() {\n    int *p = NULL;\n    p = 25;\n\
    }\n\nvoid functionB() {\n    functionC();\n}\n\nvoid functionA() {\n    functionB();\n\
    }\n\nint main() {\n    printf(\"Program started\\n\");\n    functionA();\n   \
    \ printf(\"Program finished\\n\");\n    return 0;\n}\n```\n\n假设上述源代码位于名为 `crashy.c`\
    \ 的文件中，可以使用以下命令编译此程序：\n\n```bash\n$ gcc -g crashy.c -o crashy\n```\n\n接下来，我将假装不知道是什么导致了程序崩溃，并将使用\
    \ `gdb` 来帮助我确定位崩溃的根源。\n\n为了能够调查程序崩溃，我需要指示操作系统保存崩溃数据。可以通过执行以下命令来实现：\n\n```bash\n\
    $ ulimit -c unlimited\n```\n\n崩溃数据存储在特定的 Linux 文件中：`core file`（核心转储文件）。core 文件本质上是系统的一个快照，包括崩溃发生瞬间的内存和\
    \ CPU 寄存器。上面的命令将启用无限制大小的 core 文件。默认情况下 core 大为零，这意味着不会产生 core 文件。core 文件可以设置为特定的最大大小，但这里的风险是生成的\
    \ core 文件可能不包含足够的信息来辅助调试。因此，在假设没有存储空间严格限制的情况下，建议将 core 文件大小设置为 `unlimited`。\n\n\
    让我们运行 `crashy` 程序，现在已经启用了 core 文件的生成。这将产生以下输出：\n\n```bash\n$ ./crashy\nProgram\
    \ started\nSegmentation fault (core dumped)\n```\n\n我可以在输出中看到生成 core 文件的迹象。如果我列出文件夹的内容，就可以看到\
    \ core 文件确实已生成：\n\n```bash\n$ ls -lrt\n-rw-rw-r--. 1 ssosiade ssosiade 256 Feb\
    \ 23 12:07 crashy.c\n-rwxrwxr-x. 1 ssosiade ssosiade 9830 Feb 23 12:08 crashy\n\
    -rw-------. 1 ssosiade ssosiade 253952 Feb 23 12:20 core.4890\n```\n\n```bash\n\
    $ file core.4890\ncore.4890: ELF 64-bit LSB core x86-64, version 1 (SYSV), from\
    \ './crashy'\n```\n\n注意，core 文件的命名约定是 `core.<pid>`，我们可以使用 `gdb` 打开该文件来调查崩溃：\n\n\
    ```bash\n$ gdb crashy core.4890\n```\n\n"
- fmt: "\nCompilation directory is `/home/ssosiade/book`\n\nLocated in `/home/ssosiade/book/crashy.c`\n\
    \nContains 22 lines.\n\nSource language is `c`.\n\nCompiled with `DWARF 2` debugging\
    \ format.\n\nDoes not include preprocessor macro info.\n\nAll of the above are\
    \ invaluable when trying to diagnose the root cause for a random crash. The `gdb`\
    \ capability to decode core dumps and provide information about the context of\
    \ a crash is a powerful feature. Just try to imagine how difficult investigating\
    \ crashes could be without the crash information provided by `gdb`.\n\n## Running\
    \ gdb with text user interface\n\n“TUI” stands for “Text User Interface” and represents\
    \ a feature of `gdb` that allows debugging by using multiple windows in text mode.\n\
    \nThe following windows are available in TUI mode:\n\n- `Command` - represents\
    \ the `gdb` command window where `gdb` commands can be issued. This window is\
    \ always visible.\n- `Source` - shows the source file of the program.\n- `Assembly`\
    \ - shows the program assembly language.\n- `Register` - displays the processor\
    \ registers and their content.\n\nTo launch `gdb` in text user interface mode\
    \ use the following command:\n\n```\ngdb fibonacci –tui\n```\n\nBy default the\
    \ command window and the source window are displayed, as shown in the picture\
    \ below:\n\n![](images/00010.jpeg)\n\nThe source and assembly windows show the\
    \ program line being executed by using the `>` marker.\n\nIf breakpoints are set\
    \ then these are displayed for each line of the program by using the following\
    \ naming convention: `<breakpoint_type><breakpoint_status>`.\n\nWhere `<breakpoint_type>`\
    \ can have one of the following representation and meaning:\n\n- B - breakpoint\
    \ hit at least once.\n- B - breakpoint not hit so far.\n- H - hardware breakpoint\
    \ hit at least once.\n- h - hardware breakpoint not hit so far.\n\nThe `<breakpoint_status>`\
    \ indicates whether the breakpoint is enabled or not and has one of the following\
    \ values:\n\n- + breakpoint is enabled.\n- - breakpoint is disabled.\n\nTo see\
    \ what windows are currently in use type the following command in the command\
    \ window:\n\n```bash\n(gdb) info win\n```\n\n`SRC (29 lines) <has focus>`\n`CMD\
    \ (14 lines)`\n\nTo display a particular window use one of the following “layout”\
    \ command:\n\n```bash\n(gdb) layout asm\n(gdb) layout src\n(gdb) layout reg\n\
    ```\n\nAmong multiple windows that can be displayed at a time, only one can have\
    \ the focus. A windows that has the focus can be scrolled up and down. The “focus”\
    \ command can be used in order to set the focus to a particular window:\n\n```bash\n\
    (gdb) focus src\nFocus set to SRC window.\n(gdb) focus reg\nFocus set to REGS\
    \ window.\n(gdb) focus cmd\nFocus set to CMD window.\n(gdb) focus asm\nFocus set\
    \ to ASM window.\n```\n\nAnd finally, use “refresh” command in order to refresh\
    \ all the windows currently in use.\n\n```bash\n(gdb) refresh\n```\n\nDuring a\
    \ debugging session several `gdb` commands can be issued in the command window.\
    \ These commands can alter the internal state of the program without necessarily\
    \ having all the internal changes reflected on windows enabled on the screen.\
    \ Therefore I recommend using “refresh” command before making any decision based\
    \ on the data present in the text windows.\n\n## Debugging memory access problems.\
    \ `Valgrind`\n\nAlthough it is not of the GNU toolchain, `valgrind` is probably\
    \ the most common tool in Linux for detecting memory related issues. For this\
    \ reason I decided to dedicate a small chapter on this tool. Some Linux distributions\
    \ usually include or allow the user to include this package when installing the\
    \ operating system. In order to check whether `valgrind` is installed or not on\
    \ your machine you do:\n\n```bash\nwhich valgrind\n```\n\nIf you do not have it\
    \ you can simply install it:\n\n```bash\nsudo yum install -y valgrind\n```\n\n\
    Lets see this tool in action. I am going to present an example on how to use this\
    \ tool in order to detect memory leaks. Here is a program that allocates some\
    \ memory at line 8 but forgets to free it.\n\n```c\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\n#define BUFFER_SIZE 12\n\nint main() { \n    char *buffer;\n \
    \   buffer = malloc(BUFFER_SIZE);\n    if (buffer == NULL) {\n        printf(\"\
    Failed to allocate memory\\n\");\n        return 1;\n    }\n    printf(\"Memory\
    \ allocated successfully\\n\");\n    return 0;\n}\n```\n\nThe program compiles\
    \ and runs successfully:\n\n```bash\ngcc leaky.c -o leaky\n./leaky\n```\n\nThe\
    \ following report will be produced when running this program against `valgrind`:\n\
    \n```bash\nvalgrind ./leaky\n```\n\n```\n==19445== Memcheck, a error detector\n\
    ==19445== (C) 2002-2012, and GNU'd, by Julian Seward et al.\n==19445== Using Valgrind-3.8.1\
    \ and LibVEX; rerun with -h for copyright info\n==19445== Command: ./leaky\n==19445==\
    \ \nMemory allocated successfully\n==19445== HEAP SUMMARY:\n==19445== in use at\
    \ exit: 12 bytes in 1 blocks\n==19445== total heap usage: 1 allocs, 0 frees, 12\
    \ bytes allocated\n==19445== \nLEAK SUMMARY:\n==19445== definitely lost: 12 bytes\
    \ in 1 blocks\n==19445== indirectly lost: 0 bytes in 0 blocks\n==19445== possibly\
    \ lost: 0 bytes in 0 blocks\n==19445== still reachable: 0 bytes in 0 blocks\n\
    ==19445== suppressed: 0 bytes in 0 blocks\n==19445== Rerun with --leak-check=full\
    \ to see details of leaked memory\n==19445== For counts of detected and suppressed\
    \ errors, rerun with: -v\n==19445== ERROR SUMMARY: 0 errors from 0 contexts (suppressed:\
    \ 6 from 6)\n```\n\nThe output says that there is a mismatch between the number\
    \ of “allocs” and “frees” and that I am leaking 12 bytes of heap memory – exactly\
    \ how many bytes I dynamically allocated on line 9. I can run `valgrind` with\
    \ extra parameters to get more information about the origin of the problem:\n\n\
    ```bash\nvalgrind --tool=memcheck --leak-check=full ./leaky\n```\n\n```\n==20039==\
    \ Memcheck, a memory error detector\n==20039== (C) 2002-2012, and GNU'd, by Julian\
    \ Seward et al.\n==20039== Using Valgrind-3.8.1 and LibVEX; rerun with -h for\
    \ copyright info\n==20039== Command: ./leaky\n==20039== \nMemory allocated successfully\n\
    ==20039== HEAP SUMMARY:\n==20039== in use at exit: 12 bytes in 1 blocks\n==20039==\
    \ total heap usage: 1 allocs, 0 frees, 12 bytes allocated\n==20039== \n==20039==\
    \ 12 bytes in 1 blocks are definitely lost in loss record 1 of 1\n==20039== at\
    \ 0x4A06A2E: malloc (vg_replace_malloc.c:270)\n==20039== by 0x400515: main (in\
    \ /home/ssosiade/books/valgrind/leaky)\n==20039== \nLEAK SUMMARY:\n==20039== definitely\
    \ lost: 12 bytes in 1 blocks\n==20039== indirectly lost: 0 bytes in 0 blocks\n\
    ==20039== possibly lost: 0 bytes in 0 blocks\n==20039== still reachable: 0 bytes\
    \ in 0 blocks\n==20039== suppressed: 0 bytes in 0 blocks\n```\n\nAs we can see\
    \ in the output above the calling sequence that causes the leak is displayed so\
    \ all I have to do is to trace back to the `malloc` that is the cause for the\
    \ leak and add the corresponding `free` for it. I can fix this program now by\
    \ adding a free just before the program finishes:\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n\n#define BUFFER_SIZE 12\n\nint main() { \n    char *buffer;\n\
    \    buffer = malloc(BUFFER_SIZE);\n    if (buffer == NULL) {\n        printf(\"\
    Failed to allocate memory\\n\");\n        return 1;\n    }\n    printf(\"Memory\
    \ allocated successfully\\n\");\n    free(buffer);\n    return 0;\n}\n```\n\n\
    If I run the program again under `valgrind` tool I will see no errors this time:\n"
