    to add the signal name at the end of the “info signals” gdb command as in the
    following example:


    *(gdb) info signals SIGTERM*


    *Signal Stop Print Pass to program Description*


    *SIGTERM Yes Yes Yes Terminated*


    gdb allows controlling the handling of signals by using “**handle**” command.
    Here is for example how I can disable all the three actions for the SIGTERM above:


    *(gdb) handle SIGTERM nostop noprint ignore*


    *Signal Stop Print Pass to program Description*


    *SIGTERM No No No Terminated*


    *(gdb) info signals SIGTERM*


    *Signal     Stop Print Pass to program Description*


    ***SIGTERM No No No Terminated***


    To undo the last command and revert back to the default SIGTERM handling I can
    do the following:


    *(gdb) handle SIGTERM stop print noignore*


    *Signal       Stop Print Pass to program Description*


    ***SIGTERM Yes Yes Yes Terminated***'
