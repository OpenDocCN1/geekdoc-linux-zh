  trans: "\n\n`hello: main.o module1.o module2.o module3.o`\n\n`gcc module1.o module2.o\
    \ module3.o main.o -o hello`\n\n在解释 Makefile 语法之前，让我先向你们展示我是如何构建 `hello` 可执行文件的：\n\
    \n```bash\n$ make hello\ngcc -c main.c\ngcc -c module1.c\ngcc -c module2.c\ngcc\
    \ -c module3.c\ngcc module1.o module2.o module3.o main.o -o hello\n```\n\n仅通过探索此命令的输出，我们就可以对\
    \ `make` 工具的作用产生一些理解。它首先编译源代码，然后将对象文件链接成最终的可执行文件。\n\n如果我再次列出相同目录的内容，现在就能看到生成的对象文件和可执行文件。\n\
    \n```bash\n$ ls\n```\n`hello` `main.c` `main.o` `Makefile` `module1.c` `module1.h`\
    \ `module1.o` `module2.c` `module2.h` `module2.o` `module3.c` `module3.h` `module3.o`\n\
    \n如果运行该可执行文件，我将得到与我之前从命令行构建可执行文件时相同的输出：\n\n```bash\n$ ./hello\nHello from module\
    \ 1\nHello from module 2\nHello from module 3\n```\n\n但如果我尝试再次执行 `make` 命令会发生什么？\n\
    \n```bash\n$ make hello\nmake: `hello' is up to date.\n```\n\n看来 `make` 以某种方式知道自上次构建以来没有发生变化。因此，它不会重新编译和链接任何内容。`make`\
    \ 通过检查它所使用或生成的各种文件的时间戳来检测这一点。如果二进制产物比源代码旧，那么它就会执行编译；否则不执行。\n\n为了证明这一点，我将修改 `module2.c`\
    \ 的时间戳：\n\n```bash\n$ ls -l module2\n-rw-rw-r--. 1 ssosiade ssosiade 103 Jul 30\
    \ 07:29 module2.c\n-rw-rw-r--. 1 ssosiade ssosiade 70 Jul 29 07:56 module2.h\n\
    -rw-rw-r--. 1 ssosiade ssosiade 1512 Jul 30 07:30 module2.o\n```\n\n```bash\n\
    $ touch module2.c\n$ ls -l module2\n-rw-rw-r--. 1 ssosiade ssosiade 103 Jul 30\
    \ 07:32 module2.c\n-rw-rw-r--. 1 ssosiade ssosiade 70 Jul 29 07:56 module2.h\n\
    -rw-rw-r--. 1 ssosiade ssosiade 1512 Jul 30 07:30 module2.o\n```\n\n现在 `module2.c`\
    \ 看起来比 `module2.o` 新。如果我再次运行 `make hello`，那么只有 `module2.c` 将被重新编译，可执行文件将被重新创建。\n\
    \n```bash\n$ make hello\ngcc -c module2.c\ngcc module1.o module2.o module3.o main.o\
    \ -o hello\n```\n\n这一特性通过只构建自上次构建以来受最新代码更改影响的系统部分，缩短了总构建时间。这一特性确实带来了显著差异，特别是对于大型系统，从零开始的构建（清洁构建）可能需要几个小时。\n\
    \n现在让我们回到 Makefile，解释 `make` 工具是如何根据 Makefile 的内容理解要执行什么以及构建什么的的。\n\n### Makefile\
    \ 规则结构\n\nMakefile 中的关键元素由 `rule`（规则）表示。`make` 规则以 `target`（目标）开始，并如下格式：\n\n`target:\
    \ dependencies`\n\n`<TAB> command1`\n\n`<TAB> command2`\n\n`<TAB> commandN`\n\n\
    请注意，`<TAB>` 必须是 TAB 字符，不能用一系列空格来替换以达到相同的缩进级别。这是 Makefile 中最常见的错误之一。类似下面的信息：\n\n\
    `“Makefile:11: *** missing separator (did you mean TAB instead of 8 spaces?).\
    \ Stop.”`\n\n将指示第 11 行缺少一个 `TAB`。\n\n当调用一个目标时，`make` 将先处理依赖项，然后按顺序执行目标体中指定的所有命令（`“command1”`、`“command2”`……`“commandN”`）。\n\
    \n目标可以通过以下方式之一调用：\n\n1. 从命令行使用 `make <target>`\n2. 作为另一个目标处理过程的一部分\n\n为了更好地理解这一点，让我们分析我的示例中\
    \ Makefile 给出的一些规则：\n\n`module3.o: module3.c module3.h`\n\n`  gcc -c module3.c`\n\
    \n对于上面的规则，`module3.o` 依赖于 `module3.c` 和 `module3.h`。当调用时，`make` 工具将检查 `module3.o`\
    \ 是否存在以及其时间戳是否比 `module3.c` 和 `module3.h` 新。如果任何一个不满足，它就会执行 `gcc -c`。\n\n目标 `module3.o`\
    \ 可以如下所示从命令行独立调用：\n\n```bash\n$ make module3.o\ngcc -c module3.c\n```\n\n让我们探索这条规则：\n\
    \n`hello: main.o module1.o module2.o module3.o`\n\n`  gcc module1.o module2.o\
    \ module3.o main.o -o hello`\n\n在这个规则中，`hello` 依赖于 `main.o`、`module1.o`、`module2.o`\
    \ 和 `module3.o`。\n\n### 内置规则与默认规则\n\n`make` 工具包含了所谓的 `builtin rules`（内置规则）或 `default\
    \ rules`（默认规则）。如果我从 Makefile 中删除目标 `module1.o` 并尝试从命令行调用 `make module1.o`，你认为会发生什么？你可能会倾向于认为该命令会失败。事实并非如此：\n\
    \n```bash\n$ make module1.o\ncc -c -o module1.o\n```\n\n为什么？首先不要忘记 `make` 特别是为了控制和自动化构建过程而编写的。为了方便，许多流行语言（C、C++、Fortran、Modula-2\
    \ 等）的默认规则已集成到 `make` 中。如果没有找到匹配规则，根据 `.o` 后缀，`make` 工具能够确定目标指向 C（或 C++）对象文件，因此会在当前文件夹中查找\
    \ `module1.c`（或 `module1.cpp`）文件。\n\n我个人并不确定这些内置规则有多用。内置规则有时会引起微妙的问题，并且很难检测。例如，用于\
    \ C 的内置规则使用标准 C 编译器 `cc`，而 Makefile 使用 GNU C 编译器 `gcc`。\n\n### 模式规则\n\n`make`\
    \ 工具通过 `pattern based rules`（模式规则）来理解。以下是之前的 Makefile 在使用单个规则指定所有对象文件（`*.o`）都应从相应的\
    \ `.c` 文件创建，并使用 `gcc` 编译器的样子：\n\n```bash\n$ cat Makefile\n%.o: %.c\n\tgcc -c $^\n\
    \nhello: main.o module1.o module2.o module3.o\n\tgcc main1.o module2.o module3.o\
    \ main.o -o hello\n\nclean:\n\trm -rf hello *.o\n```\n\n人们很容易发现，使用模式规则使 Makefile\
    \ 看起来更整洁、更紧凑。\n\n"
- fmt: "\nBefore going any further I need to provide you a quick explanation regarding\
    \ the pattern based rule written above. `“%.o: %.c\"` says that for any given\
    \ `<file name>.o` the `make` tool must search for a `<file name.c>` file in the\
    \ current folder. To some extent this is similar to using `\"*\"` wildcard in\
    \ Linux but with one constrain: it must be an exact match for the file name for\
    \ both object and source file.\n\nWhat does `“$^\"` from the last makefile mean?\
    \ This refers to an internal variable which expands to the name of the prerequisite\
    \ `<file name.c>`. Similarly `\"$@\"` contains the name of the target `<file name.o>`.\n\
    \nI just mentioned that `$^` refers to a `variable`. Yes, we can use variables\
    \ when writing makefiles.\n\nI will give you a quick example to understand how\
    \ variables can be useful in makefiles. Let's assume that I want to change the\
    \ compiler, so instead of using `gcc` complier I want to use a different compiler.\
    \ In all the makefiles that I presented so far if I want to change GNU compiler\
    \ then I need to change the makefiles in several places where `\"gcc\"` string\
    \ is present. What if I use a variable .lets name it `CC`, to store the name of\
    \ the compiler and have this variable used in the rest of the makefile instead\
    \ of hardcoding the name of the compiler? Now I will only to change the `\"value\"\
    ` of this variable and this change will be propagated everywhere in the makefile.\
    \ See the following makefile for example:\n\n```make\ncat Makefile\nCC=gcc\n%.o:\
    \ %.c\n\t${CC} -c $^\nhello: main.o module1.o module2.o module3.o\n\t${CC} module1.o\
    \ module2.o module3.o main.o -o hello\nclean:\n\trm -rf hello *.o\n```\n\nSimilarly,\
    \ the compiler parameters represents something that may need to be changed quite\
    \ often during the development of a program or even after. This represents another\
    \ good example where makefile variables could be useful:\n\n```make\ncat Makefile\n\
    CC=gcc\nCCFLAGS=-Wall -g\n%.o: %.c\n\t${CC} ${CCFLAGS} -c $^\nhello: main.o module1.o\
    \ module2.o module3.o\n\t${CC} module1.o module2.o module3.o main.o -o hello\n\
    clean:\n\trm -rf hello *.o\n```\n\nMakefile also supports conditional statements\
    \ (if-then-else). I am going to refer to another common use case in order to introduce\
    \ the conditional statements for makefile. I would like to expand the makefile\
    \ from my previous example so that I can invoke it as `make DEBUG=true` from the\
    \ command line when I want to build the program with debugging information (-g).\n\
    \nHere is how this can be implemented by using makefile conditional statements:\n\
    \n```make\ncat Makefile\nCC=gcc\nifeq ($(DEBUG),true)\n\tCCFLAGS=-Wall -g\nelse\n\
    \tCCFLAGS=-Wall\nendif\nhello: main.o module1.o module2.o module3.o\n\t${CC} module1.o\
    \ module2.o module3.o main.o -o hello\n%.o: %.c\n\t${CC} ${CCFLAGS} -c $^\nclean:\n\
    \trm -rf hello *.o\n```\n\nThe last topic regarding makefile syntax that I would\
    \ to discuss are functions. A function call in terms of makefile syntax resembles\
    \ to some extent a variable reference.\n\n```\n$(function arguments)\n```\n\n\
    You may or may not have a variable on the left hand side storing the return value\
    \ of the function:\n\n```\nvar := $(function arguments)\n```\n\nBelow is an example\
    \ of a function call that stores the names of all the files with extension `txt`\
    \ in the variable `ALL_TEXT_FILES`. This is done by invoking the `shell` function\
    \ and passing `\"ls *.txt\"` as input argument.\n\n```make\nALL_TEXT_FILES:=$(shell\
    \ ls *.txt)\n```\n\nMake has a sizable number of functions that can be usefull\
    \ in different situations. The list is far too long to be covered in this book.\
    \ But I strongly recommend bookmark and to check the official make documentation\
    \ ([https://www.gnu.org/software/make/manual](https://www.gnu.org/software/make/manual))\
    \ to learn about various functions being available. Using functions allows achieving\
    \ greater flexibility therefore functions are extensively used in almost any makefile\
    \ used in building slightly more complex software products.\n\nIt's probably the\
    \ time to see an example of using functions in the makefile that I have been gradually\
    \ refining in this chapter. One limitation of the last makefile I presented is\
    \ that every time when I will be adding a new C module I will also need to manually\
    \ update the dependency list for the `hello` target. I would like automate this\
    \ somehow and be able just to drop a C source file in that folder and have the\
    \ makefile capable of figuring out which object files are required to build the\
    \ executable.\n\nThis is where functions can help. See in the makefile below how\
    \ to implement this:\n\n```make\nSOURCE_FILES = $(wildcard *.c)\nOBJECT_FILES\
    \ = $(SOURCE_FILES:.c=.o)\nCC=gcc\nALL_TEXT_FILES:=$(shell ls *.txt)\nifeq ($(DEBUG),true)\n\
    \tCCFLAGS=-Wall -g\nelse\n\tCCFLAGS=-Wall\nendif\nhello: ${OBJECT_FILES}\n\t${CC}\
    \ ${OBJECT_FILES} -o $@\n%.o: %.c\n\t${CC} ${CCFLAGS} -c $^\nclean:\n\trm -rf\
    \ hello *.o\n```\n\nThis concludes the brief presentation of makefile syntax.\n"
  raw: "Before going any further I need to provide you a quick explanation regarding\
    \ the pattern based rule written above. “%.o: %.c” says that for any given <file\
    \ name>.o the make tool must search for a <file name.c> file in the current folder.\
    \ To some extent this is similar to using “*” wildcard in Linux but with one constrain:\
    \ it must be an exact match for the file name for both object and source file.\n\
    \nWhat does “$^” from the last makefile mean? This refers to an internal variable\
    \ which expands to the name of the prerequisite (<file name.c>. Similarly “$@”\
    \ contains the name of the target (<file name.o>).\n\nI just mentioned that “$^”\
    \ refers to a “**variable**”. Yes, we can use variables when writing makefiles.\n\
    \nI will give you a quick example to understand how variables can be useful in\
    \ makefiles. Let's assume that I want to change the compiler, so instead of using\
    \ gcc complier I want to use a different compiler. In all the makefiles that I\
    \ presented so far if I want to change GNU compiler then I need to change the\
    \ makefiles in several places where “gcc” string is present. What if I use a variable\
    \ .lets name it CC, to store the name of the compiler and have this variable used\
    \ in the rest of the makefile instead of hardcoding the name of the compiler?\
    \ Now I will only to change the “value” of this variable and this change will\
    \ be propagated everywhere in the makefile. See the following makefile for example:\n\
    \n*$ cat Makefile*\n\n*CC=gcc*\n\n*%.o: %.c*\n\n *${CC} -c $^*\n\n*hello: main.o\
    \ module1.o module2.o module3.o*\n\n *${CC} module1.o module2.o module3.o main.o\
    \ -o hello*\n\n*clean:*\n\n *rm -rf hello *.o*\n\nSimilarly, the compiler parameters\
    \ represents something that may need to be changed quite often during the development\
    \ of a program or even after. This represents another good example where makefile\
    \ variables could be useful:\n\n*$ cat Makefile*\n\n*CC=gcc*\n\n*CCFLAGS=-Wall\
    \ -g*\n\n*%.o: %.c*\n\n *${CC} ${CCFLAGS} -c $^*\n\n*hello: main.o module1.o module2.o\
    \ module3.o*\n\n *${CC} module1.o module2.o module3.o main.o -o hello*\n\n*clean:*\n\
    \n *rm -rf hello *.o*\n\nMakefile also supports conditional statements (if-then-else).\
    \ I am going to refer to another common use case in order to introduce the conditional\
    \ statements for makefile. I would like to expand the makefile from my previous\
    \ example so that I can invoke it as “make DEBUG=true” from the command line when\
    \ I want to build the program with debugging information (-g).\n\nHere is how\
    \ this can be implemented by using makefile conditional statements:\n\n*$ cat\
    \ Makefile*\n\n*CC=gcc*\n\n*ifeq ($(DEBUG),true)*\n\n*CCFLAGS=-Wall -g*\n\n*else*\n\
    \n*CCFLAGS=-Wall*\n\n*endif*\n\n*hello: main.o module1.o module2.o module3.o*\n\
    \n *${CC} module1.o module2.o module3.o main.o -o hello*\n\n*%.o: %.c*\n\n *${CC}\
    \ ${CCFLAGS} -c $^*\n\n*clean:*\n\n *rm -rf hello *.o*\n\nThe last topic regarding\
    \ makefile syntax that I would to discuss are **functions**. A function call in\
    \ terms of makefile syntax resembles to some extent a variable reference.\n\n\
    *$(function arguments)*\n\nYou may or may not have a variable on the left hand\
    \ side storing the return value of the function:\n\n*var := $(function arguments)*\n\
    \nBelow is an example of a function call that stores the names of all the files\
    \ with extension txt in the variable ALL_TEXT_FILES. This is done by invoking\
    \ the “shell” function and passing “ls *.tst” as input argument.\n\n*ALL_TEXT_FILES:=$(shell\
    \ ls *.txt)*\n\nMake has a sizable number of functions that can be usefull in\
    \ different situations. The list is far too long to be covered in this book. But\
    \ I strongly recommend bookmark and to check the official make documentation ([https://www.gnu.org/software/make/manual](https://www.gnu.org/software/make/manual))\
    \ to learn about various functions being available. Using functions allows achieving\
    \ greater flexibility therefore functions are extensively used in almost any makefile\
    \ used in building slightly more complex software products.\n\nIt's probably the\
    \ time to see an example of using functions in the makefile that I have been gradually\
    \ refining in this chapter. One limitation of the last makefile I presented is\
    \ that every time when I will be adding a new C module I will also need to manually\
    \ update the dependency list for the hello target. I would like automate this\
    \ somehow and be able just to drop a C source file in that folder and have the\
    \ makefile capable of figuring out which object files are required to build the\
    \ executable.\n\nThis is where functions can help. See in the makefile below how\
    \ to implement this:\n\n*SOURCE_FILES = $(wildcard *.c)*\n\n*OBJECT_FILES = $(SOURCE_FILES:.c=.o)*\n\
    \n*CC=gcc*\n\n*ALL_TEXT_FILES:=$(shell ls *.txt)*\n\n*ifeq ($(DEBUG),true)*\n\n\
    *CCFLAGS=-Wall -g*\n\n*else*\n\n*CCFLAGS=-Wall*\n\n*endif*\n\n*hello: ${OBJECT_FILES}*\n\
    \n *${CC} ${OBJECT_FILES} -o $@*\n\n*%.o: %.c*\n\n *${CC} ${CCFLAGS} -c $^*\n\n\
    *clean:*\n\n *echo ${ALL_TEXT_FILES}*\n\n *rm -rf hello *.o*\n\nThis concludes\
    \ the brief presentation of the make tool and makefile syntax. The purpose of\
    \ this chapter is to give you a good starting point in working with makefiles\
    \ in order to build your Linux programs.\n\nWhen you will need to explore the\
    \ build system for a large system you will likely see an entire collection of\
    \ makefiles and that build system may look a bit overwhelming and hard to understand.\
    \ But you should not worry, reading complex makefiles represents a challenge even\
    \ for seasoned Linux programmers. However all the complexity is built on top of\
    \ the simple concepts that I presented in this book and with a little time and\
    \ patience you will be able to understand what the build system does and gradually\
    \ be able to maintain and update it. \n\n# Static Libraries\n\nIn numerous cases\
    \ exactly the same functions are used by several programs. Therefore it will make\
    \ sense to “package” these functions as Linux libraries and use them for different\
    \ programs as required. \n\nLinux has two types of libraries:\n\n- **Static libraries**\
    \ (the scope of this chapter)\n\n- **Shared libraries** (presented in the next\
    \ chapter)\n\nStatic libraries are files containing a collection of multiple object\
    \ files. Static libraries in Linux are also known as “archive” and this is the\
    \ reason because static library files have the extension *.a.\n\nThe tool used\
    \ for creating and updating library files is called “ar” and has the following\
    \ syntax:\n\n*ar options archive-file object-file…*\n\nThe most common options\
    \ for the ar tool are:\n\n-d - delete file(s) from the archive\n\n-m - move file(s)\
    \ in the archive\n\n-p - print file(s) found in the archive\n\n-q - quick append\
    \ files(s) to the archive\n\n-r - replace exiting or insert new file(s) into the\
    \ archive\n\n-t - display content of archive\n\n-x -extract file(s) from archive\n\
    \nFor example here is how I can create a Linux static library (libhello.a) using\
    \ the objects files module1.o, module2.o and module3.o respectively.\n\n*$ ar\
    \ r libhello.a module1.o module2.o module3.o*\n\n*ar: creating libhello.a*\n\n\
    *$ ls*\n\n*libhello.a main.o module1.o module2.o module3.o*\n\n*$ file libhello.a*\n\
    \n*libhello.a: current ar archive*\n\nNow I can use this library instead of using\
    \ the object files to link it with main module and create the hello executable:\n\
    \n*$ gcc -g -o hello main.o libhello.a*\n\n*$ ls*\n\n*hello libhello.a main.o\
    \ module1.o module2.o module3.o*\n\n*$ ./hello*\n\n*Hello from module 1*\n\n*Hello\
    \ from module 2*\n\n*Hello from module 3*\n\nAnother way to build the same executable\
    \ using this library is to place the library in a location used by the linker\
    \ (e.g /usr/lib) and use –l gcc switch:\n\n*$ gcc -g -o hello main.o –lhello*\n\
    \nIf I want to use the library from the current directory (.) or from another\
    \ directory then I can simply extend the linker search path by using –L gcc switch\
    \ as follows:\n\n*$ gcc -g -o hello main.o -L. –lhello*\n\nOr:\n\n*$ gcc -g -o\
    \ hello main.o -L`pwd` -lhello*\n\nBelow is the makefile the last example, updated\
    \ to build the static library and link the main executable against it.\n\n*$ cat\
    \ Makefile*\n\n*LIB_SOURCE_FILES = $(wildcard module*.c)*\n\n*LIB_OBJECT_FILES\
    \ = $(LIB_SOURCE_FILES:.c=.o)*\n\n*CC=gcc*\n\n*AR=ar*"
