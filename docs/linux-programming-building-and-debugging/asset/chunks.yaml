    \ -g\nelse\n  CCFLAGS=-Wall\nendif\n\nhello: main.o libhello.a\n\t${CC} main.o\
    \ -o $@ ${LNK_OPTS}\n\nlibhello.a: ${LIB_OBJECT_FILES}\n\t${AR} r $@ ${LIB_OBJECT_FILES}\n\
    \n%.o: %.c\n\t${CC} ${CCFLAGS} -c $^*\n\nclean:\n\trm -rf hello libhello.a *.o\n\
    ```\n\nAnd this is the example of to invoke make using the above makefile:\n\n\
    ```bash\nmake\ngcc -Wall -c main.c\ngcc -Wall -c module1.c\ngcc -Wall -c module2.c\n\
    gcc -Wall -c module3.c\nar r libhello.a module1.o module2.o module3.o\nar: creating\
    \ libhello.a\ngcc main.o -o hello -L. –lhello\n```\n\nOne drawback with using\
    \ static libraries is that when a static library is updated then all the programs\
    \ using it needs to be relinked in order to get the latest changes from the library.\n\
    \n# Shared Libraries\n\nAlthough simple enough to use, static libraries have a\
    \ distinctive disadvantage: sections of code used from libraries is replicated\
    \ into each of the executables and therefore the system will have multiple copies\
    \ of the same binary data on disk as well as in memory when those programs are\
    \ executed.\n\nFor instance if we had two executables `hello1` and `hello2` linked\
    \ against same static library then the executable will have approximately the\
    \ following binary layout:\n\n![](images/00004.jpeg)\n\nShared libraries address\
    \ this shortcoming by using only one version of the common code for all the executables.\
    \ The way this is achieved is depicted in the following figure:\n\n![](images/00005.jpeg)\n\
    \nAnd here is how this works:\n\n1. The first program that needs the shared library\
    \ loads the library into memory at the same time with the program.\n2. The second,\
    \ third,.. etc program that need the same library will reuse the library already\
    \ loaded into memory. A reference count for the number of programs using that\
    \ library is maintained.\n3. When a program finishes the reference count is decreed.\n\
    4. When the reference count reaches zero, this means that no active programs are\
    \ using that library and the library is unloaded from memory.\n\nIn order to achieve\
    \ the above functionality, the linking process responsibilities is now shared\
    \ with the program loader. When building the executable the linker will only insert\
    \ the symbols for the what is used from the shared libraries. The program loader\
    \ will actually resolve at run time the exact addresses for those symbols for\
    \ the library loaded in memory. This step is called “symbol relocation” or “runtime\
    \ linking” and the part of the program loader responsible for this task is called\
    \ `dynamic linker`. As a matter of fact the dynamic linker itself is a Linux shared\
    \ library (`/lib/ld-linux*.so`).\n\nBecause of symbol relocation, loading a program\
    \ that uses shared objects will take longer than a similar program using static\
    \ libraries.\n\nA shared library can be loaded anywhere in the Linux virtual memory.\
    \ A code that can be loaded anywhere in memory is called `position-independent\
    \ code`. Therefore when generating shared objects the compiler needs be instructed\
    \ to generate position-independent code. `-fPIC` option for `gcc` to generate\
    \ such output. See this in the example:\n\n```bash\ngcc -c -fPIC module1.c module2.c\
    \ module3.c\n```\n\nLinking the shared-object requires using `-shared` option:\n\
    \n```bash\ngcc -shared -o libhello.so module1.o module2.o module3.o\n```\n\nA\
    \ `libhello.so` file is created in the current directory after the above command.\
    \ The makefile used to build the hello executable using `libhello.so` shared library\
    \ is presented below:\n\n```makefile\nLIB_SOURCE_FILES = $(wildcard *.c)\nLIB_OBJECT_FILES\
    \ = $(LIB_SOURCE_FILES:.c=.o)\nCC=gcc\nLNK_OPTS=libhello.so\nSOLNKFLAGS=-shared\
    \ -o\n\nifeq ($(DEBUG),true)\n  CCFLAGS=-Wall -g\n  SOCCFLAGS=-Wall -g -fPIC\n\
    else\n  CCFLAGS=-Wall\n  SOCCFLAGS=-Wall -fPIC\nendif\n\nhello: main.o libhello.so\n\
    \t${CC} main.o -o $@ ${LNK_OPTS}\n\nlibhello.so: ${LIB_OBJECT_FILES}\n\t${CC}\
    \ ${SOLNKFLAGS} $@ ${LIB_OBJECT_FILES}\n\n%.o: %.c\n\t${CC} ${CCFLAGS} -c $^*\n\
    \nclean:\n\trm -rf hello libhello.so *.o\n```\n\nIf I try to execute the hello\
    \ executable generated by the above makefile I get the following output:\n\n```bash\n\
    ./hello\n./hello: error while loading shared libraries: libhello.so: cannot open\
    \ object file: No such file or directory\n```\n\nWhat is wrong or missing here?\
    \ The failure is at the point where the dynamic linker is trying to load `libhello.so`\
    \ into memory but fails to find it. The is happening because the dynamic linker\
    \ is looking for shared libraries in some predefined paths (for example: `/lib`,\
    \ `/usr/lib`, `/usr/local/lib`) and my shared library is located in the current\
    \ directory which is not part of dynamic loader path. I have few options to fix\
    \ this:\n\n- **Option 1**: To copy the shared object into a directory which is\
    \ included in the dynamic loader search path.\n- **Option 2**: To use the `LD_LIBRARY_PATH`\
    \ to append extra directories to the dynamic loader search path. Example:\n```bash\n\
    LD_LIBRARY_PATH=. ./hello\n```\n- **Option 3**: To use `ldconfig` to append extra\
    \ directories to the dynamic loader search path. Example: edit `/etc/ld.so.conf`\
    \ to include the additional path(s) I need (current working directory is required\
    \ for this example):\n```bash\nsudo ldconfig\n./hello\n```\n\nPlease note that\
    \ super user permissions are required in order to be able to edit `/etc/ld.so.conf`\
    \ as well as be allowed to execute `ldconfig`. One can use `ldconfig -v` in order\
    \ to see where the dynamic linker is searching for shared libraries and what libraries\
    \ are found. `man ldconfig` will provide detailed information on how to use this\
    \ tool and other options available for this tool.\n\nThere is a way to find all\
    \ the dynamic dependencies of a particular program by using a tool called `ldd`\
    \ (“list dynamic dependencies”). Running this tool against my hello executable\
    \ will produce the following output:\n\n```bash\nldd hello\nlinux-vdso.so.1 =>\
    \ (0x00007ffff7000)\nlibhello.so => /home/samples_book/dynamic_lib/libhello.so\
    \ (0x00007fb06a752000)\nlibc.so.6 => /lib64/libc.so.6 (0x00007fb8a7c0000)\n/lib64/ld-linux-x86-64.so.2\
    \ (0x00007fb8a7800000)\n```\n\nI can see from this output that apart from depending\
    \ on my shared library (`libhello.so`) the hello program also requires the C library\
    \ (`libc.so`), the Linux dynamic loader (`ld-linux*.so`) and a library used to\
    \ make system calls into kernel space (`linux-vdso.so`). These latest three libraries\
    \ are included in almost any Linux executable that is build to use shared libraries.\n\
    \nUsing shared libraries removes the need of relinking the executables when the\
    \ library is changed or updated. For example I should be able to update `libhello.so`\
    \ to a newer version (`libhello.so.2`) and all the programs depending on this\
    \ shared library can use the latest version without the need to rebuild or relink\
    \ any executables.\n\nHowever, as we can see from the output of `ldd`, `hello`\
    \ executable depends strictly on a binary called `libhello.so`. Therefore could\
    \ the renaming the shared library break the executable? And the answer here is\
    \ yes! Then how does Linux solve this problem?\n\nThe solution is to use a “wrapper\
    \ library” (`soname`) instead of the actual name of the shared library. `Sonames`\
    \ represents a level of indirection that permits an executable to use a different\
    \ version of a shared library instead of the one that was used during linking.\
    \ This allows updating the library without the need to relink the executable,\
    \ because the executable will continue to reference the soname library.\n\nThis\
    \ is how I can modify the command line in order to use the soname:\n\n```bash\n\
    gcc -shared -Wl,-soname,libhellowrapper.o -o libhello.so module1.o module2.o module3.o\n\
    ```\n"
