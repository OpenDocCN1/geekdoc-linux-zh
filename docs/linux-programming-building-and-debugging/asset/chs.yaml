- "# Linux 编程：构建与调试指南\n\n\n\n![](img/00011.jpeg)\n\n\n\n\n\n\n\n# 引言\n\nLinux 已经很久了。它最初只是一个非常聪明的学生的学术项目，而现在代表了全球许多企业服务器的主要解决方案。此外，Linux\
  \ 操作系统作为终端用户桌面的解决方案正在赢得越来越多的追随者。凭借专门为 Linux 构建的视觉界面（`KDE`、`GNOME`），该系统的操作变得像 `Windows`\
  \ 或 `MacOS` 一样简单，并且越来越不再被认为仅仅是供学术界或程序员使用的操作系统。\n\n此外，如果你为数字电视使用 `set-topbox`，或者你家里有智能报警器，这些设备可能也使用了\
  \ Linux 操作系统。这是因为 Linux 操作系统已被移植到各种类型的处理器或设备，变成了我们现在所说的“嵌入式 Linux”。\n\n尽管市场份额很小，但目前已经有使用\
  \ `Ubuntu` Linux 版本的手机。Linux 未来是否会在手机市场占据重要份额还有待待观察。但已经有手机在使用该操作系统的这一事实证明了 Linux\
  \ 解决方案如今已变得多么多功能且灵活。\n\nLinux 的第一个程序编写于 `1991` 年。这已经是 25 年前的事了，对于软件市场以及整个 IT 市场来说，这是一个相当漫长的年代。在过去的\
  \ 25 年里，我们看到了许多经历过辉煌时期后被其他产品取代的软件。我们还看到曾经声誉巨大的公司现在处于辉煌的黄昏或已经倒闭。但这种情况没有发生在 Linux\
  \ 身上。随着时间的推移，Linux 变得越来越强大。它“永葆青春”的秘密似乎在于使用了 `GNU GPL` 许可证，这种许可证允许任何人免费使用该操作系统。此外，这种许可证的使用在“免费”的含义上具有更广泛的范围。这是运行、复制、分发、研究、修改和改进软件的自由。这种“自由”的方面吸引了世界各地大量的爱好者和程序员，他们热衷于为\
  \ Linux 的开发贡献力量。这最终创造了一种难以复制的协同效应，而对于一个代码对普通公众不可见、且仅由一家或一组公司开发和维护的软件系统来说，这是很难做到的。\n\
  \n如果你还不知道这一点，这里需要注意：Linux 并不是 `UNIX`。但存在一个互换使用这些术语的趋势。这是因为 Linux 和 `UNIX` 在用法方面有许多共同点。\n\
  \n# 编译 vs 解释执行\n\n\n\n\n\n如果你买了这本书，你可能对开发计算机程序感兴趣，或许对如何开发程序已经有一些想法。如果我告诉你，计算机编程意味着编写无尽的\
  \ 0 和 1 序列，你可能就会放弃进一步探索这个话题的主意了！但在计算机早期，现实情况确实如此，那时“软件”和“硬件”之间没有区别，程序需要直接使用“机器语言”来编写——即由\
  \ CPU 执行的低级指令。\n\n那个时代的程序员必须制作出大量的打孔卡，其中包含了微处理器最终执行的指令序列。在那种条件下，即使是编写一个微不足道的程序，也也需要付出巨大的努力。如果不进行简化并让计算机编程更加高效，编写能够允许飞机自动飞行的程序将是不可能的。\n\
  \n简化编程工作有两种方法：`解释` (interpreting) 和 `编译` (compiling)。这两种方法的共同点是都使用比 CPU 指令集更复杂的指令序列来编写程序。随着编程效率的提高，可以用更少的代码编写更多的功能，编写更复杂的程序也变得可能。\n\
  \n## 解释 (Interpretation)\n每一行代码都会被解释并转换为 CPU 可执行的等效指令序列。这些指令随后会被执行。然后，下一行代码被解释并以同样的方式执行。程序的执行就一直持续，直到程序的最后一行被执行。以这种方式运行程序需要使用“解释器”，它允许对程序的每一行进行连续的解释和执行。\n\
  \n老牌程序员可能还记得 `BASIC`，这是一种很大程度上基于解释的编程语言。然而，程序解释即使在今天仍然存在且非常流行的概念，特别是对于程序员所谓的“脚本型编程”（shell\
  \ 脚本、perl、python、javascript 等等）……。\n\n## 编译 (Compiling)\n程序首先被翻译成另一种低级的中间语言。翻译后的程序既可以可以直接执行，也可以被解释。将高级语言翻译成更低级的语言的过程被称为`编译`。为此，程序员需要使用该特定语言的“编译器”。`C`\
  \ 或 `C++` 语言就是使用编译的编程语言示例。\n\n`Java` 是一种同时使用上述这两个概念的编程语言。一个 `Java` 程序首先被“编译”成 `Java\
  \ 字节码`。这个过程由 `Java 编译器` 完成。接下来，当执行字节码程序时，字节码程序中的每条语句随后都会被“解释”。解释过程由 `Java 虚拟机` (`JVM`)\
  \ 执行，它在不同的主机机器上为字节码执行充当解释器的角色。\n\n通常情况下，编译后的程序比解释型程序快。因此，如果执行速度至关重要，那么最好使用编译型语言。另一方面，解释型语言具有更简单、易用的声誉，从而提供了更高的生产力。\n\
  \n# 构建可执行文件。编译与链接\n\n构建（可执行文件）代表了从源代码到实际可执行文件的过程。虽然某些程序员倾向于口语化将“构建”称为“编译”，但实际上构建可执行文件是通过两个不同的步骤完成的：\n\
  \n1. `编译` (compilation)\n2. `链接` (linking)\n\n## 编译 (Compilation)\n从概念上说，这就是我在上一章描述的内容。在\
  \ `Linux` 中编译 `C/C++` 源代码代表了从编程语言翻译源代码并创建“目标文件”的过程，目标文件是源代码的机器语言表示。对于 `C/C++` 语言，编译通常分两个阶段完成：\n\
  \n**步骤 1 – 预处理 (preprocessing)**：这一步涉及通过以下操作对原始源文件进行预处理：\na.– 包含来自 `#include` 指令的源代码。\n\
  b.– 展开宏并对 `#define` 指令进行替换。\nc.– 根据 `#if`、`#ifdef` 和 `#ifndef` 指令选择原始源代码的部分。\n\n\
  ![](img/00001.jpeg)\n\n**步骤 2 – 编译本身 (compilation itself)**：这一步代表对预处理后生成的纯代码进行解析以及目标文件的创建。\n\
  \n我刚刚提到编译的输出是机器语言格式。那么，为什么我们不能直接执行编译的输出，而还需要链接阶段呢？\n\n这里有两个主要原因：\n- 一个可执行文件可以从多个源代码文件（模块）创建。每个源代码文件被单独翻译成等效的目标文件。然而，只有一个文件包含\
  \ `main 方法` 的定义，它代表了可执行文件的主入口。因此，我们无法执行不包含主入口的模块。\n- 源代码可能包含对其他模块中定义的函数或在外部库中实现的函数的引用。编译本身并不处理这些类型的依赖关系。\n\
  \n## 链接 (Linking)\n这是将所有目标文件汇成代表最终可执行文件的过程。外部符号的依赖关系在这个阶段得到解决。\n\n如果引用的函数定义在外部静态库中，那么该函数的完整实现也将被添加到最终的可执行文件中。\n\
  \n![](img/00002.jpeg)\n\n我简要强调了外部库在构建最终可执行文件的作用。分两步构建可执行文件的优势开始显现：构建过程提供了在多个程序和产品之间复用各种预编译代码部分（库）的能力。另一个优势是代码可以构造成特定的结构，使得代码部分在每次构建程序时不需要重新编译。但关于库的更多内容将在单独的章节中。\n\
  \n# GNU C/C++ 编译器 - GCC\n\n为 `C/C++` 编程语言选择编译器有多种选项，如下表所示。\n\n| 编译器 | 许可证 |\n| :---\
  \ | :--- |\n| Ch | 免费软件 |\n| [CodeWarrior](http://en.wikipedia.org/wiki/CodeWarrior)\
  \ | 专有 |\n| [GCC](http://en.wikipedia.org/wiki/GNU_Compiler_Collection) | GPL |\n\
  | [Digital Mars](http://en.wikipedia.org/wiki/Digital_Mars) | 专有 |\n| [LabWindows/CVI](http://en.wikipedia.org/wiki/LabWindows/CVI)\
  \ | 专有 |\n| [Lattice C](http://en.wikipedia.org/wiki/Lattice_C) | 专有 |\n| [lcc](http://en.wikipedia.org/wiki/LCC_(compiler))\
  \ | 免费软件 |\n| [Open Watcom](http://en.wikipedia.org/wiki/Open_Watcom) | 专有 |\n|\
  \ [Portable C Compiler](http://en.wikipedia.org/wiki/Portable_C_Compiler) | BSD\
  \ |\n| [Smaller C](https://github.com/alexfru/SmallerC) | BSD |\n| [Wind River (Diab)\
  \ Compiler](http://en.wikipedia.org/wiki/Wind_River_Systems#Wind_River_.28Diab.29_Compiler)\
  \ | 专有 |\n| [XL C](http://en.wikipedia.org/wiki/IBM_XL_C%2B%2B) | 专有 |\n| [HP aC++](http://en.wikipedia.org/wiki/HP_aC%2B%2B)\
  \ | 专有 |\n| [Intel C++ Compiler](http://en.wikipedia.org/wiki/Intel_C%2B%2B_Compiler)\
  \ | 专有 |\n| [VisualAge C++](http://en.wikipedia.org/wiki/IBM_VisualAge) | 专有 |\n\
  \n对于 Linux 而言，`GCC`（GNU 编译器集合）代表了构建 `C/C++` 编写程序最流行的选项。只要想想 `GCC` 是用于编译 Linux 内核本身的编译器这一事实，足以说明该工具链的稳健性和可靠性。而且更棒的一点是：它是免费的！\n\
  \n\n\n\n因此，将使用 GCC 编译器来构建本书中介绍的所有示例。\n\n如果你是 Fedora、Red Hat 或 CentOS 用户，可以使用以下命令在你的\
  \ Linux 机器上安装 GNU C/C++ 编译器：\n\n```bash\nsudo yum groupinstall 'Development Tools'\n\
  ```\n\n或者，如果你是 Debian 或 Ubuntu 用户，可以使用以下 `apt-get` 命令进行安装：\n\n```bash\nsudo apt-get\
  \ install build-essential manpages-dev\n```\n\n假设安装成功，运行以下命令将显示新安装编译器的版本：\n\n```bash\n\
  gcc --version\n```\n\n```text\ngcc (GCC) 4.4.7 20120313 (Red Hat 4.4.7-11)\nCopyright\
  \ (C) 2010 Free Software Foundation, Inc.\n```\n\n让我们使用这个编译器来编译早已著名的“Hello World”程序，该程序是由\
  \ C 语言的父辈丹尼斯·里奇（Dennis Ritchie）和布莱恩·柯尼根（Brian Kernighan）提出的。\n\n假设以下 C 程序存在于名为 `hello.c`\
  \ 的文件中：\n\n```c\n#include <stdio.h>\nvoid main()\n{\n    printf(\"Hello world!\\\
  n\");\n}\n```\n\n我可以通过执行以下命令编译这个 C 程序：\n\n```bash\ngcc -g hello.c -o hello_c\n```\n\
  \n在上面的 `gcc` 命令中，我使用了 `-o` 选项来指定生成的可执行文件的名称 (`hello_c`)，并使用 `-g` 选项指示编译器在输出中包含调试信息。在开发期间带有调试信息进行编译是一个良好的习惯，这样可以使用调试器的更多功能来修复可能的问题。\n\
  \n上述命令的输出是一个名为 `hello_c` 的 Linux 可执行文件，我可以尝试执行它：\n\n```bash\n./hello_c\nHello world!\n\
  ```\n\n上面的 `gcc` 命令一次性完成了构建、编译和链接这三个步骤。\n\n如果我想从源代码构建并仅生成对象文件，我可以使用以下命令：\n\n```bash\n\
  gcc -c hello.c\n```\n\n`-c` 选项代表“编译（compile）”，并指示 `gcc` 只运行预处理器和编译器。该命令的输出将是一个位于相同文件夹下的\
  \ `hello.o` 对象文件。该对象文件随后可以使用以下命令进行链接：\n\n```bash\ngcc hello.o -o hello_c\n```\n\n\
  这里 `gcc` 足够智能可以检测到传入了对象文件并仅执行链接器。生成的输出与第一个示例创建的 `hello_c` 可执行文件相同，但这次是通过运行编译和链接器两个独立步骤构建的。\n\
  \n当需要时，可以使用 `-E` 选项仅运行 `gcc` 进行预处理：\n\n```bash\ngcc -E hello.c\n```\n\n运行上述命令后，你会发现微小的\
  \ `hello.c` 程序的体积会显著增加。这是由于 `#include <stdio.h>` 指令，它会引导预处理器将头文件的全部以及所有其他依赖项包含在预处理后的\
  \ C 文件输出中。\n\n也可以在预处理后停止编译并检查生成的输出。\n\n让我们看看如何构建“Hello World”示例的 C++ 版本。我将从包含以下内容的\
  \ `hello.cpp` 文件开始：\n\n```cpp\n#include \"iostream\"\nint main(void)\n{\n    std::cout\
  \ << \"Hello world from C++.\\n\";\n    return 0;\n}\n```\n\n我可以使用以下命令行构建它：\n\n\
  ```bash\ng++ -g -Wall hello.cpp -o hello_cpp\n```\n\n其中 `g++` 是 GNU C++ 编译器，`-g`\
  \ 和 `-o` 的含义与之前提供的 `gcc` 命令行相同。\n\n一旦上述命令成功完成，我可以尝试执行生成的可执行文件：\n\n```bash\n./hello_cpp\n\
  Hello world from C++.\n```\n\n本章旨在让你对如何从命令行安装和使用 GNU C/C++ 编译器有一个初步感受。我可以在本书的后续章节中转向稍微复杂一点示例。\n\
  \n# 从多个源模块构建程序\n\n程序内容完全位于单个源文件的情况是非常罕见的。良好的软件开发实践要求使用多个源文件来实现产品的各个部分。\n\n从 C/C++\
  \ 源代码构建 Linux 程序涉及处理几种类型的文件：\n\n-   **源文件 (`*.cpp` 或 `*.c`)** – 包含主函数实现以及程序使用的其他函数或类实现的的文本文件。\n\
  -   **头文件 (`*.h`)** – 包含函数或类原型以及其他处理器语句的文本文件。本章稍后将展示源文件头文件的示例。\n-   **对象文件 (`*.o`)**\
  \ – 编译器的输出。\n-   **二进制文件** – 可执行文件、静态库 (`*.a`) 或动态库 (`*.so`)。目前我们可以将库视为对象文件的预构建仓库。\n\
  \n从 C/C++ 源代码构建 Linux 程序涉及处理几种类型的文件：\n\n-   **源文件 (`*.cpp` 或 `*.c`)** – 包含主函数实现以及程序使用的其他函数或类实现的文本文件。\n\
  -   **头文件 (`*.h`)** – 包含函数或类原型以及其他处理器语句的文本文件。本章稍后将展示源文件头文件的示例。\n-   **对象文件 (`*.o`)**\
  \ – 编译器的输出。\n-   **二进制文件** – 可执行文件、静态库 (`*.a`) 或动态库 (`*.so`)。目前我们可以将库视为对象文件的预构建仓库。\n\
