  \ – 编译器的输出。\n-   **二进制文件** – 可执行文件、静态库 (`*.a`) 或动态库 (`*.so`)。目前我们可以将库视为对象文件的预构建仓库。\n\
  \n# Make 和 Makefile\n\n我们刚刚从上一章学习了如何从多个源文件构建程序。这看起来简单直接。但如果不是三个模块，而是要处理成百个源文件（这对于大型项目很常见）呢？构建这么多文件的\
  \ `gcc` 命令行显然不是选择。我们该怎么办？\n\n首先想到的创建一个程序或脚本来尝试自动化构建过程，并使过程变得简单可重复。好消息是你不需要编写任何内容，因为这样的程序已经存在了。这是一个名为\
  \ `make` 的 GNU 工具。`make` 程序理解并执行在名为 `Makefile` 的输入文件中指定的规则。因此，虽然 `make` 工具是通用的，但\
  \ `Makefile` 包含了构建特定程序的规则。\n\n展示一个 Makefile 示例，其功能等同于上一章用于构建 hello 可执行文件的 shell\
  \ 命令。此示例的目标是对 Makefile 的语法和用法进行简要概述。\n\n开始，假设我的当前工作目录中有以下文件：\n\n```bash\nls\nmain.c\
  \ Makefile module1.c module1.h module2.c module2.h module3.c module3.h\n```\n\n\
  头文件和源文件与上一个示例使用的文件相同。makefile 文件的内容如下：\n\n```bash\ncat Makefile\n```\n\n```makefile\n\
  module1.o: module1.c module1.h\n\tgcc -c module1.c\n\nmodule2.o: module2.c module2.h\n\
  \tgcc -c module2.c\n\nmodule3.o: module3.c module3.h\n\tgcc -c module3.c\n\nmain.o:\
  \ main.c\n\tgcc -c main.c\n\nhello: module1.o module2.o module3.o main.o\n\tgcc\
  \ module1.o module2.o module3.o main.o -o hello\n```\n\n\n\n\n\n`hello: main.o module1.o\
  \ module2.o module3.o`\n\n`gcc module1.o module2.o module3.o main.o -o hello`\n\n\
  在解释 Makefile 语法之前，让我先向你们展示我是如何构建 `hello` 可执行文件的：\n\n```bash\n$ make hello\ngcc -c\
  \ main.c\ngcc -c module1.c\ngcc -c module2.c\ngcc -c module3.c\ngcc module1.o module2.o\
  \ module3.o main.o -o hello\n```\n\n仅通过探索此命令的输出，我们就可以对 `make` 工具的作用产生一些理解。它首先编译源代码，然后将对象文件链接成最终的可执行文件。\n\
  \n如果我再次列出相同目录的内容，现在就能看到生成的对象文件和可执行文件。\n\n```bash\n$ ls\n```\n`hello` `main.c` `main.o`\
  \ `Makefile` `module1.c` `module1.h` `module1.o` `module2.c` `module2.h` `module2.o`\
  \ `module3.c` `module3.h` `module3.o`\n\n如果运行该可执行文件，我将得到与我之前从命令行构建可执行文件时相同的输出：\n\
  \n```bash\n$ ./hello\nHello from module 1\nHello from module 2\nHello from module\
  \ 3\n```\n\n但如果我尝试再次执行 `make` 命令会发生什么？\n\n```bash\n$ make hello\nmake: `hello' is\
  \ up to date.\n```\n\n看来 `make` 以某种方式知道自上次构建以来没有发生变化。因此，它不会重新编译和链接任何内容。`make` 通过检查它所使用或生成的各种文件的时间戳来检测这一点。如果二进制产物比源代码旧，那么它就会执行编译；否则不执行。\n\
  \n为了证明这一点，我将修改 `module2.c` 的时间戳：\n\n```bash\n$ ls -l module2\n-rw-rw-r--. 1 ssosiade\
  \ ssosiade 103 Jul 30 07:29 module2.c\n-rw-rw-r--. 1 ssosiade ssosiade 70 Jul 29\
  \ 07:56 module2.h\n-rw-rw-r--. 1 ssosiade ssosiade 1512 Jul 30 07:30 module2.o\n\
  ```\n\n```bash\n$ touch module2.c\n$ ls -l module2\n-rw-rw-r--. 1 ssosiade ssosiade\
  \ 103 Jul 30 07:32 module2.c\n-rw-rw-r--. 1 ssosiade ssosiade 70 Jul 29 07:56 module2.h\n\
  -rw-rw-r--. 1 ssosiade ssosiade 1512 Jul 30 07:30 module2.o\n```\n\n现在 `module2.c`\
  \ 看起来比 `module2.o` 新。如果我再次运行 `make hello`，那么只有 `module2.c` 将被重新编译，可执行文件将被重新创建。\n\
  \n```bash\n$ make hello\ngcc -c module2.c\ngcc module1.o module2.o module3.o main.o\
  \ -o hello\n```\n\n这一特性通过只构建自上次构建以来受最新代码更改影响的系统部分，缩短了总构建时间。这一特性确实带来了显著差异，特别是对于大型系统，从零开始的构建（清洁构建）可能需要几个小时。\n\
  \n现在让我们回到 Makefile，解释 `make` 工具是如何根据 Makefile 的内容理解要执行什么以及构建什么的的。\n\n## Makefile\
  \ 规则结构\n\nMakefile 中的关键元素由 `rule`（规则）表示。`make` 规则以 `target`（目标）开始，并如下格式：\n\n`target:\
  \ dependencies`\n\n`<TAB> command1`\n\n`<TAB> command2`\n\n`<TAB> commandN`\n\n\
  请注意，`<TAB>` 必须是 TAB 字符，不能用一系列空格来替换以达到相同的缩进级别。这是 Makefile 中最常见的错误之一。类似下面的信息：\n\n\
  `“Makefile:11: *** missing separator (did you mean TAB instead of 8 spaces?). Stop.”`\n\
  \n将指示第 11 行缺少一个 `TAB`。\n\n当调用一个目标时，`make` 将先处理依赖项，然后按顺序执行目标体中指定的所有命令（`“command1”`、`“command2”`……`“commandN”`）。\n\
  \n目标可以通过以下方式之一调用：\n\n1. 从命令行使用 `make <target>`\n2. 作为另一个目标处理过程的一部分\n\n为了更好地理解这一点，让我们分析我的示例中\
  \ Makefile 给出的一些规则：\n\n`module3.o: module3.c module3.h`\n\n`  gcc -c module3.c`\n\
  \n对于上面的规则，`module3.o` 依赖于 `module3.c` 和 `module3.h`。当调用时，`make` 工具将检查 `module3.o`\
  \ 是否存在以及其时间戳是否比 `module3.c` 和 `module3.h` 新。如果任何一个不满足，它就会执行 `gcc -c`。\n\n目标 `module3.o`\
  \ 可以如下所示从命令行独立调用：\n\n```bash\n$ make module3.o\ngcc -c module3.c\n```\n\n让我们探索这条规则：\n\
  \n`hello: main.o module1.o module2.o module3.o`\n\n`  gcc module1.o module2.o module3.o\
  \ main.o -o hello`\n\n在这个规则中，`hello` 依赖于 `main.o`、`module1.o`、`module2.o` 和 `module3.o`。\n\
  \n## 内置规则与默认规则\n\n`make` 工具包含了所谓的 `builtin rules`（内置规则）或 `default rules`（默认规则）。如果我从\
  \ Makefile 中删除目标 `module1.o` 并尝试从命令行调用 `make module1.o`，你认为会发生什么？你可能会倾向于认为该命令会失败。事实并非如此：\n\
  \n```bash\n$ make module1.o\ncc -c -o module1.o\n```\n\n为什么？首先不要忘记 `make` 特别是为了控制和自动化构建过程而编写的。为了方便，许多流行语言（C、C++、Fortran、Modula-2\
  \ 等）的默认规则已集成到 `make` 中。如果没有找到匹配规则，根据 `.o` 后缀，`make` 工具能够确定目标指向 C（或 C++）对象文件，因此会在当前文件夹中查找\
  \ `module1.c`（或 `module1.cpp`）文件。\n\n我个人并不确定这些内置规则有多用。内置规则有时会引起微妙的问题，并且很难检测。例如，用于\
  \ C 的内置规则使用标准 C 编译器 `cc`，而 Makefile 使用 GNU C 编译器 `gcc`。\n\n## 模式规则\n\n`make` 工具通过\
  \ `pattern based rules`（模式规则）来理解。以下是之前的 Makefile 在使用单个规则指定所有对象文件（`*.o`）都应从相应的 `.c`\
  \ 文件创建，并使用 `gcc` 编译器的样子：\n\n```bash\n$ cat Makefile\n%.o: %.c\n\tgcc -c $^\n\nhello:\
  \ main.o module1.o module2.o module3.o\n\tgcc main1.o module2.o module3.o main.o\
  \ -o hello\n\nclean:\n\trm -rf hello *.o\n```\n\n人们很容易发现，使用模式规则使 Makefile 看起来更整洁、更紧凑。\n\
  \n\n\n\n在继续下去之前，我需要对上面写的基于模式的规则进行快速解释。`“%.o: %.c\"` 表示，对于任何给定的 `<file name>.o`，`make`\
  \ 工具必须在当前文件夹中寻找 `<file name.c>` 文件。在某种程度上，这与在 Linux 中使用 `\"*\"` 通配符相似，但有一个限制：对象文件和源文件的文件名必须完全匹配。\n\
  \n上一个 Makefile 中的 `“$^\"` 是什么意思？它指的是一个内部变量，展开为依赖项 `<file name.c>` 的名称。同样，`\"$@\"\
  ` 包含目标文件 `<file name.o>` 的名称。\n\n我刚刚提到 `$^` 指的是一个`变量`。是的，我们在编写 Makefile 时可以使用变量。\n\
  \n我将给你一个快速的示例，让你理解变量在 Makefile 中为什么很有用。假设我想更改编译器，因此不再使用 `gcc` 编译器，而是想使用另一个编译器。在我目前介绍的所有\
  \ Makefile 中，如果我想更改 GNU 编译器，我需要修改多处出现 `\"gcc\"` 字符串的 Makefile。如果我使用一个变量（我们称之为 `CC`）来存储编译器的名称，并在\
  \ Makefile 的其余部分使用该变量而不是硬编码编译器名称呢？现在，我只需要更改此变量的 `\"value\"`，这个更改将传播到 Makefile 中的所有地方。请下面的示例\
  \ Makefile：\n\n```make\ncat Makefile\nCC=gcc\n%.o: %.c\n\t${CC} -c $^\nhello: main.o\
  \ module1.o module2.o module3.o\n\t${CC} module1.o module2.o module3.o main.o -o\
  \ hello\nclean:\n\trm -rf hello *.o\n```\n\n同样，编译器参数代表了程序开发过程中甚至之后可能需要经常更改的内容。这是\
  \ Makefile 变量有用的另一个很好的例子：\n\n```make\ncat Makefile\nCC=gcc\nCCFLAGS=-Wall -g\n%.o:\
  \ %.c\n\t${CC} ${CCFLAGS} -c $^\nhello: main.o module1.o module2.o module3.o\n\t\
  ${CC} module1.o module2.o module3.o main.o -o hello\nclean:\n\trm -rf hello *.o\n\
  ```\n\nMakefile 还支持条件语句（if-then-else）。我将引用另一个常见用例来引入 Makefile 的条件语句。我想扩展我之前示例中的\
  \ Makefile，以便当我想要构建带有调试信息 (-g) 的程序时，可以从命令行通过 `make DEBUG=true` 来调用它。\n\n以下是使用 Makefile\
  \ 条件语句实现此方法：\n\n```make\ncat Makefile\nCC=gcc\nifeq ($(DEBUG),true)\n\tCCFLAGS=-Wall\
  \ -g\nelse\n\tCCFLAGS=-Wall\nendif\nhello: main.o module1.o module2.o module3.o\n\
  \t${CC} module1.o module2.o module3.o main.o -o hello\n%.o: %.c\n\t${CC} ${CCFLAGS}\
  \ -c $^\nclean:\n\trm -rf hello *.o\n```\n\n关于 Makefile 语法我想要讨论的最后一个主题是函数。在 Makefile\
  \ 语法中，函数调用在某种程度上类似于变量引用。\n\n```\n$(function arguments)\n```\n\n你可能在左侧有一个或没有变量来存储函数的返回值：\n\
  \n```\nvar := $(function arguments)\n```\n\n下面是一个函数调用的示例，它将所有扩展名为为 `txt` 的文件名存储在变量\
  \ `ALL_TEXT_FILES` 中。这是通过调用 `shell` 函数并传入 `\"ls *.txt\"` 作为输入参数实现的。\n\n```make\n\
  ALL_TEXT_FILES:=$(shell ls *.txt)\n```\n\nMake 拥有大量的函数，可以在不同的情况下有用。列表太长了，本书无法涵盖。但我强烈建议收藏并查看官方的\
  \ make 文档 ([`www.gnu.org/software/make/manual`](https://www.gnu.org/software/make/manual))\
  \ 来了解各种可用函数。使用函数可以实现更大的灵活性，因此函数在几乎任何构建稍微复杂的软件产品的 Makefile 中都会被广泛使用。\n\n也许是时候一个我在在本章中逐渐完善的\
  \ Makefile 使用函数的示例了。我之前介绍的最后一个 Makefile 的局限性是，每当我添加一个新的 C 模块时，我都需要手动更新 `hello` 目标的依赖列表。我想某种方式实现自动化，并能够只需在该文件夹中放入一个\
  \ C 源文件，让 Makefile 能够识别构建可执行文件需要哪些对象文件。\n\n这就是函数可以大作用的地方。看下面的 Makefile 如何实现这一点：\n\
  \n```make\nSOURCE_FILES = $(wildcard *.c)\nOBJECT_FILES = $(SOURCE_FILES:.c=.o)\n\
  CC=gcc\nALL_TEXT_FILES:=$(shell ls *.txt)\nifeq ($(DEBUG),true)\n\tCCFLAGS=-Wall\
  \ -g\nelse\n\tCCFLAGS=-Wall\nendif\nhello: ${OBJECT_FILES}\n\t${CC} ${OBJECT_FILES}\
  \ -o $@\n%.o: %.c\n\t${CC} ${CCFLAGS} -c $^\nclean:\n\trm -rf hello *.o\n```\n\n\
  以上就是对 Makefile 语法的简要介绍。\n\n\n\n\n\n```makefile\nLNK_OPTS=-L. -lhello\n\nifeq ($(DEBUG),true)\n\
  \  CCFLAGS=-Wall -g\nelse\n  CCFLAGS=-Wall\nendif\n\nhello: main.o libhello.a\n\t\
  ${CC} main.o -o $@ ${LNK_OPTS}\n\nlibhello.a: ${LIB_OBJECT_FILES}\n\t${AR} r $@\
  \ ${LIB_OBJECT_FILES}\n\n%.o: %.c\n\t${CC} ${CCFLAGS} -c $^*\n\nclean:\n\trm -rf\
  \ hello libhello.a *.o\n```\n\n以下是使用上述 Makefile 运行 make 的示例：\n\n```bash\nmake\n\
  gcc -Wall -c main.c\ngcc -Wall -c module1.c\ngcc -Wall -c module2.c\ngcc -Wall -c\
  \ module3.c\nar r libhello.a module1.o module2.o module3.o\nar: creating libhello.a\n\
  gcc main.o -o hello -L. –lhello\n```\n\n使用静态库的缺点是，当静态库更新时，所有使用该库的程序都需要重新链接，以获取库的最新更改。\n\
  \n# 共享库\n\n尽管静态库的使用非常简单，但它们有一个明显的缺点：从库中使用的代码段会被复制到每个可执行文件中，因此当这些程序执行时，系统在磁盘和内存中都会存在相同二进制数据的多个副本。\n\
  \n例如，如果我们有两个链接到同一个静态库的可执行文件 `hello1` 和 `hello2`，那么可执行文件的二进制布局大致如下：\n\n![](img/00004.jpeg)\n\
  \n共享库通过为所有可执行文件仅使用一个版本的公共代码来解决这一缺陷。其实现方式如图所示：\n\n![](img/00005.jpeg)\n\n其工作原理如下：\n\
  \n1. 第一个需要共享库的程序在启动的同时将库加载到内存中。\n2. 第二个、第三个等需要相同库的程序将重用已经加载到内存中的库。系统会维护使用该库的程序引用计数。\n\
  3. 当程序结束时，引用计数递减。\n4. 当引用计数达到零时，意味着没有活跃的程序在使用该库，该库将从内存中卸载。\n\n为了实现上述功能，链接过程的责任现在由程序加载器共同承担。在构建可执行文件时，链接器仅会插入从共享库中使用的部分的符号。程序加载器实际上会在运行时为已加载到内存的库解析这些符号的精确地址。这一步被称为“符号重位”（symbol\
  \ relocation）或“运行时链接”，负责此任务的程序加载器部分称为 `动态链接器”（dynamic linker）。事实上，动态链接器本身是一个 Linux\
  \ 共享库（/lib/ld-linux*.so）。\n\n由于符号重位，加载使用共享对象的程序会比使用静态库的类似程序慢。\n\n共享库可以加载到 Linux\
  \ 虚拟内存的任何位置。可以加载到内存任何位置的代码被称为“位置无关代码”（position-independent code）。因此，在生成共享对象时，需要指示编译器生成位置无关代码。`gcc`\
  \ 的 `-fPIC` 选项用于生成此类输出。参见示例：\n\n```bash\ngcc -c -fPIC module1.c module2.c module3.c\n\
  ```\n\n链接共享对象需要使用 `-shared` 选项：\n\n```bash\ngcc -shared -o libhello.so module1.o\
  \ module2.o module3.o\n```\n\n执行上述命令后，当前目录下会创建一个 `libhello.so` 文件。使用 `libhello.so`\
  \ 共享库构建 hello 可执行文件的 Makefile 如下所示：\n\n```makefile\nLIB_SOURCE_FILES = $(wildcard\
  \ *.c)\nLIB_OBJECT_FILES = $(LIB_SOURCE_FILES:.c=.o)\nCC=gcc\nLNK_OPTS=libhello.so\n\
  SOLNKFLAGS=-shared -o\n\nifeq ($(DEBUG),true)\n  CCFLAGS=-Wall -g\n  SOCCFLAGS=-Wall\
  \ -g -fPIC\nelse\n  CCFLAGS=-Wall\n  SOCCFLAGS=-Wall -fPIC\nendif\n\nhello: main.o\
  \ libhello.so\n\t${CC} main.o -o $@ ${LNK_OPTS}\n\nlibhello.so: ${LIB_OBJECT_FILES}\n\
  \t${CC} ${SOLNKFLAGS} $@ ${LIB_OBJECT_FILES}\n\n%.o: %.c\n\t${CC} ${CCFLAGS} -c\
  \ $^*\n\nclean:\n\trm -rf hello libhello.so *.o\n```\n\n如果我尝试执行由上述 Makefile 生成的\
  \ hello 可执行文件，将得到以下输出：\n\n```bash\n./hello\n./hello: error while loading shared\
  \ libraries: libhello.so: cannot open object file: No such file or directory\n```\n\
  \n这里哪里错了或缺少了什么？失败发生在动态链接器尝试将 `libhello.so` 加载到内存但未找到它的。这是因为动态链接器在某些预定义的路径（例如：`/lib`、`/usr/lib`、`/usr/local/lib`）查找共享库，而我的共享库位于当前目录，该目录并不是动态加载器路径的一部分。我有几个选项可以修复：\n\
  \n- **选项 1**：将共享对象拷贝到动态加载器搜索路径包含的目录。\n- **选项 2**：使用 `LD_LIBRARY_PATH` 为动态加载器搜索路径添加额外目录。例如：\n\
  ```bash\nLD_LIBRARY_PATH=. ./hello\n```\n- **选项 3**：使用 `ldconfig` 为动态加载器搜索路径添加额外目录。例如，编辑\
  \ `/etc/ld.so.conf`：\n```bash\nsudo ldconfig\n./hello\n```\n\n请注意，需要超级用户权限编辑 `/etc/ld.so.conf`\
  \ 并允许执行 `ldconfig`。可以使用 `ldconfig -v` 查看动态链接器正在搜索哪些共享库以及发现了哪些库。`man ldconfig` 将提供有关如何使用该工具详细信息。\n\
  \n可以使用工具 `ldd`（列出动态依赖”）查找特定程序的所有动态依赖。对 hello 可执行文件运行此工具将产生以下输出：\n\n```bash\nldd\
  \ hello\nlinux-vdso.so.1 => (0x00007ffff7000)\nlibhello.so => /home/samples_book/dynamic_lib/libhello.so\
  \ (0x00007fb06a752000)\nlibc.so.6 => /lib64/libc.so.6 (0x00007fb8a7c0000)\n/lib64/ld-linux-x86-64.so.2\
  \ (0x00007fb8a780000)\n```从输出可以看出，除了依赖我的共享库外，hello 程序还需要 C 库（`libc.so`）、Linux 动态加载器（`ld-linux*.so`）以及一个用于进入内核空间的的库（`linux-vdso.so`）。这三个最新的库包含在几乎任何使用共享库的\
  \ Linux 可执行文件中。\n\n使用共享库消除了库更改或更新时重新链接可执行文件的需要。例如，我应该可以将 `libhello.so` 更新到新版本（`libhello.so.2`），而所有依赖该共享库的程序都可以最新版本，而无需重新构建或链接任何可执行文件。\n\
  \n然而，从输出可以看出，hello 可执行文件严格依赖名为 `libhello.so` 的二进制文件。因此，重命名共享库会破坏可执行文件吗？答案是肯！那么 Linux\
  \ 如何解决这个问题呢？\n\n解决方案是使用“封装库”（soname）而不是共享库的实际名称。`Sonames` 代表了一种间接层，允许可执行文件使用共享库的不同版本而不是链接时使用的版本。这允许在不需要重新链接可执行文件的情况下更新库，因为可执行文件将继续引用\
  \ soname 库。\n\n我可以这样修改命令行以使用 soname：\n\n```bash\ngcc -shared -Wl,-soname,libhellowrapper.o\
  \ -o libhello.so module1.o module2.o module3.o\n```\n\n\n\n\n如果我列出文件夹的内容，看到只有 `libhello.so`\
  \ 被生成了。然而，在这种情况下的主要区别是新的共享库内部也包含了 `soname` 库。\n\n```bash\nstrings libhello.so |\
  \ grep libhellowrapper.so\n```\n\n`libhellowrapper.so`\n\n使用带有 `soname` 的共享对象进行链接基本上与使用任何共享对象都是样的：\n\
  \n```bash\ngcc -g -Wall -o hello main.c libhello.so\n```\n\n然而，区别在于链接器会识别嵌入在共享库中的\
  \ `soname` 并使用这一个。\n\n![](img/00006.jpeg)\n\n通过使用 `ldd`，我现在可以看到 `hello` 二进制文件引用的是\
  \ `soname` 包装库，而不是共享库本身：\n\n```bash\nldd hello\nlinux-vdso.so.1 => (0x00007fffaffff000)\n\
  libhellowrapper.so => not found\nlibc.so.6 => /lib64/libc.so.6 (0x0000003c87c0000)\n\
  /lib64/ld-linux-x86-64.so.2 (0x0000003c87800000)\n```\n\n在磁盘上，`soname` 必须是一个指向库本身的软链接。因此，使用\
  \ `soname` 的最后一步是创建这个软链接：\n\n```bash\nln -s libhello.so libhellowrapper.so\nls -lrt\
  \ libhellowrapper.so\n```\n\n```lrwxrwxrwx. 1 ssosiade ssosiade 11 Aug 5 06:50 libhellowrapper.so\
  \ -> libhello.so\n```\n\n在所有工作都就绪后，我现在可以尝试运行可执行文件，我预计看到与第一次执行 `hello` 可执行文件相同的输出，因为源代码没有改变，改变的代码构建的方式：\n\
  \n```bash\n./hello\n./hello: error while loading shared libraries: libhellowrapper.so:\
  \ cannot open shared object file: No such file or directory\nLD_LIBRARY_PATH=. ./hello\n\
  Hello from module 1\nHello from module 2\nHello from module 3\n```\n\n然而，现在如果我想更改共享库，我只需要更改软链接以指向新的二进制文件即可。不需要重新构建或重新链接。\n\
  \n例如，如果可用较新版本的 `libhello.so.2`，我只需通过以下操作将旧的替换为新的：\n\n```bash\nln -s libhello.so.2\
  \ libhellowrapper.so\n```\n\n现在 `hello` 将使用新库进行执行。\n\n# 调试 Linux 程序\n\nGNU 工具链中附带的最有用工具之一是\
  \ `gdb` (GNU 调试器)。在尝试理解程序为何崩溃或程序为何没有按照设计意工作时，这个工具可以提供极具价值的帮助。\n\n为了解释 `gdb` 工具的主要功能，我需要一个比“hello\
  \ world”稍微复杂的 C 程序。因此，我将使用一个非递归版本的程序，该程序显示给定项数的斐波那契数列。\n\n这是该程序的列出：\n\n```bash\n\
  cat fibonacci.c\n#include<stdio.h>\nint main() {\n    int n, first = 0, second =\
  \ 1, next, i;\n    printf(\"Number of terms: \\n\");\n    scanf(\"%d\",&n);\n  \
  \  for ( i = 0 ; i < n ; i++ ) {\n        if ( i <= 1 )\n            next = i;\n\
  \        else {\n            next = first + second;\n            first = second;\n\
  \            second = next;\n        }\n    }\n    printf(\"%d\\n\",next);\n   \
  \ return 0;\n}\n```\n\n这里关于如何使用 `gcc` 构建此程序的快速提示：\n\n```bash\ngcc -g fibonacci.c\
  \ -o fibonacci\n./fibonacci\nNumber of terms: 6\n```\n\n**注意**：使用 `-g`（带有调试符号）对于充分利用\
  \ `gdb` 工具的能力至关重要。让我们看看如何使用这个程序来探索 GNU 调试器的以下功能：\n\n- 在调试器下运行程序\n- 设置断点\n- 单步执行\n\
  - 设置观察点\n- 检查变量内容\n- 设置变量和调用函数\n- 回溯和切换堆栈帧\n- 处理信号\n- 切换线程\n- 处理崩溃\n- 使用文本界面运行 `gdb`\n\
  \n如果你以前用过任何调试工具，可能已经在 `gdb` 中看到许多可用功能。如果是第一次使用调试器，请担心。\n\n## 在调试器下运行\n\n为了调试程序，该程序必须在调试器环境中执行。有几种方法可以实现：\n\
  \n### 方法 1：将程序作为参数运行 `gdb`：\n\n```bash\ngdb ./fibonacci\ngdb (GDB) Red Hat Linux\
  \ (7.2-64.el62)\nCopyright (C) 2010 Free Software Foundation, Inc.\nLicense GPL3+:\
  \ GNU 3 or later <http://gnu.org/licenses/gpl.html>\nThis is free software: you\
  \ are free to change and redistribute it.\nThere is NO WARRANTY, to the extent permitted\
  \ by law. Type \"show copying\" and \"show warranty\" for details.\nThis GDB was\
  \ configured as \"x86_64-redhat-gnu\".\nFor bug reporting instructions, please see:\
  \ http://www.gnu.org/software/gdb/...\nReading symbols\n```\n\n一旦程序加载，我可以使用命令 `r`（或\
  \ `run`）运行可执行文件：\n\n```bash\n(gdb) run\nStarting program: /home/ssosiade/tmp_books/gdb/fibonacci\n\
  Number of terms: 2...\n```\n\n### 方法 2：先运行 `gdb` 然后从调试器命令行加载并执行程序：\n\n```bash\n\
  gdb\ngdb ( Red Hat Linux (7.2-64.el62)\nCopyright (C) 2010 Free Software Foundation,\
  \ Inc.\nLicense GPL3+: GNU 3 or later <http://gnu.org/licenses/gpl.html>\nThis is\
  \ free software: you are free to change and redistribute it.\nThere is NO WARRANTY,\
  \ to the extent permitted by law. Type \"show copying\" and \"show warranty\" for\
  \ details.\nThis GDB was configured as \"x86_64-redhat-gnu\".\nFor bug reporting\
  \ instructions, please see: http://www.gnu.org/software/gdb/.\n(gdb) exec-file ./fibonacci\n\
  (gdb) r\nStarting program: /books/gdb/fibonacci\nNumber of terms:\n```\n\n### 方法\
  \ 3：附加调试器到运行程序\n\n为了将 `gdb` 附加到正在运行的程序，必须先知道该程序的 `PID`。我可以使用以下 Linux 命令找到我的 `fibonacci`\
  \ 程序的 `PID`：\n\n```bash\nps -a | grep fibonacci\n38532 pts/0 00:00:00 fibonacci\n\
  ```\n\n现在有了此进程的 `PID` (`38532`)，我可以向此进程附加调试器：\n\n```bash\ngdb attach 38532\ngdb\
  \ (GDB) Red Hat Linux (7.2-64.el62)\nCopyright (C) 2010 Free Software Foundation,\
  \ Inc.\nLicense GPL3+: GNU 3 or later <http://gnu.org/licenses/gpl.html>\nThis is\
  \ free software: you are free to change and redistribute it.\nThere is NO WARRANTY,\
  \ to the extent permitted by law. Type \"show copying\" and \"show warranty\" for\
  \ details.\nThis GDB was configured as \"x86_64-redhat-gnu\".\nFor bug reporting\
  \ instructions, please see: http://www.gnu.org/software/gdb/bugs/...\nattach: No\
  \ such file or directory.\nAttaching to process 38532\nReading symbols from /books/fibonacci...done.\n\
  Reading symbols from /lib64/libc.6...(no debugging symbols)...done.\nLoaded symbols\
  \ for /lib64/libc.6\nReading symbols from /lib64/ld-linux-x86-64.so.2...(no debugging\
  \ symbols)...done.\nLoaded symbols for /lib64/ld-linux-x86-64.so.2\n0x0000003c87cdb520\
  \ in __write_nocancel () from /lib64/libc.6\n```\n\n```bash\n(gdb) list\n1 #include<stdio.h>\n\
  2 int main() {\n    int n, first = 0, second = 1, next, i;\n    printf(\"Number\
  \ of terms: \\n\");\n    scanf(\"%d\",&n);\n    for ( i = 0 ; i < n ; i++ ) {\n\
  \        if ( i <= 1 )\n            next = i;\n        else {\n            next\
  \ = first + second;\n            first = second;\n            second = next;\n \
  \       }\n    }\n    printf(\"%d\\n\",next);\n    return 0;\n}\n```\n\n我可以随时使用“**q**”（**quit**）命令退出调试会话：\n\
  \n```bash\n(gdb) q\nA debugging session is active.\nInferior 1 [process 38532] will\
  \ be detached.\nQuit anyway? (y or n) y\nDetaching from program: /books/gdb/fibonacci,\
  \ process 38532\n```\n\n## 设置断点\n\n断点用于在程序的特定位置停止程序的执行。设置断点的 gdb 命令是 **“b” (“break”)**，并且它有多种语法：\n\
  \n\n\n\n\n- `b module:line` - 在特定模块的特定行设置断点\n- `b symbol` - 在特定符号处设置断点\n- `b line`\
  \ – 在当前模块的特定行设置断点\n- `b +lines` – 在当前执行点之后若干行处设置断点\n- `b -lines` – 在当前执行点之前若干行处设置断点\n\
  - `b module:function` – 为不同模块中的特定函数设置断点\n- `b` – 在下一行设置断点\n- `b address` – 在特定地址设置断点\n\
  \n以下是在 `fibonacci.c` 文件中第 10 行设置断点的示例：\n\n```\n(gdb) b fibonacci.c:10\nBreakpoint\
  \ 1 at 0x4005ad: file fibonacci.c, line 10.\n```\n\n以下是在第一次调用“printf”时设置断点的示例：\n\
  \n```\n(gdb) b printf\nBreakpoint 2 at 0x400450\n```\n\n可以使用以下命令查看所有正在使用的断点：\n\n\
  ```\n(gdb) info break\nNum Type Disp Enb Address What\n1 breakpoint keep y 0x00000000004005ad\
  \ in main at fibonacci.c:10\n2 breakpoint keep y 0x0000000000400450 <printf@plt>\n\
  ```\n\n断点可以被删除或禁用。禁用的断点的行为与删除的断点类似。唯一的区别是，如果需要，禁用的断点可以在以后的时间点重新使用（重新启用）。\n\n可以使用\
  \ gdb 命令 `enable` 和 `disable` 来启用或禁用断点：\n\n```\n(gdb) disable 1\n(gdb) info break\n\
  Num Type    Disp Enb Address What\n1 breakpoint keep n 0x00000000004005ad in main\
  \ at fibonacci.c:10\n2 breakpoint keep y 0x0000000000400450 <printf@plt>\n\n(gdb)\
  \ enable 1\n(gdb) info break\nNum Type    Disp Enb Address     What\n1 breakpoint\
  \ keep y 0x00000000004005ad in main at fibonacci.c:10\n2 breakpoint keep y 0x0000000000400450\
  \ <printf@plt>\n```\n\n同样，可以使用 `delete` gdb 命令来删除断点。以下是例如从上述列表中删除第二个断点的示例：\n\n```\n\
  (gdb) delete 2\n(gdb) info break\nNum Type Disp Enb Address What\n1 breakpoint keep\
  \ y 0x00000000004005ad in main at fibonacci.c:10\n```\n\n一旦设置了断点，我就可以开始执行程序。程序一旦遇到第一个断点，执行就会停止：\n\
  \n```\n(gdb) r\nStarting program: /books/gdb/fibonacci\nNumber of terms:\n5\nBreakpoint\
  \ 1, main () at fibonacci.c:10\n10 for ( i = 0 ; i < n ; i++ )\n```\n\n## 单步执行代码\n\
  \n一旦程序执行停止，我可以选择“单步执行”继续执行程序。单步执行对于以下情况特别有用：\n\n- 查看程序是否遵循了其设计意图\n- 跟踪程序每条指令中变量的值。\n\
  \n单步调试的命令是 `s` (`step`) 和 `n` (`next`)。它们之间的区别如下：`step` 继续执行，直到遇到同一模块的程序下一行。这意味着如果当前行需要调用不同模块的函数，这些调用将会被完全执行。\n\
  \n当需要进入嵌套调用时，可以使用 `next` 命令。该命令将使调试器停止在程序的下一行，无论该行是否在当前模块中。以下是从程序第 10 行开始单步执行代码的示例：\n\
  \n```\n(gdb) b 10\nBreakpoint 1 at 0x400626: file fibonacci.c, line 10.\n(gdb) r\n\
  Starting program: /books/linux/fibonacci\nNumber of terms:\n4\nBreakpoint 1, main\
  \ () at fibonacci.c:10\n10 for ( i = 0 ; i < n ; i++ )\n(gdb) n\n12 if ( i <= 1\
  \ )\n(gdb) s\n13 next = i;\n(gdb) n\n20 printf(\"%d\\n\",next);\n(gdb) s\n10 for\
  \ ( i = 0 ; i < n ; i++ )\n(gdb) s\n12 if ( i <= 1 )\n(gdb) s\n13 next = i;\n```\n\
  \n## 设置观察点 (Watchpoints)\n\n观察点在某些方面类似于断点。主要区别在于观察点设置在变量上而不是代码位置。因此，通过使用观察点，可以指示调试器在“变量发生变化时”或“变量\
  \ x 值等于 5 时”停止。\n\n在查看观察点的示例之前，必须告诉你编译器有时会对处理变量的方式进行优化。编译器可能会将变量存储在 CPU 寄存器而不是内存中。这将显著加快对这些变量的访问，但代价是当使用寄存器时无法使用观察点。典型的\
  \ gdb 消息是：`No symbol \"foo\" in current context.`\n\n避免使用寄存器持有变量的方法是强制编译器不进行优化（使用\
  \ `-O0`），如下所示：\n\n```\ngcc -O0 -g fibonacci.c -o fibonacci\n```\n\n现在我可以确保每个变量都有相应的符号，并可以使用任何变量设置观察点。以下是设置观察点在每次变量\
  \ `next` 被修改时停止程序执行的示例：\n\n```\n(gdb) watch next\nHardware watchpoint 2: next\n\
  ```\n\n所有的观察点都可以与断点一起列出：\n\n```\n(gdb) info break\nNum Type Disp Enb Address What\n\
  2 hw watchpoint y next\n```\n\n还可以以类似于操作断点的方式通过 gdb 命令 `enable`、`disable` 和 `delete`\
  \ 操作观察点。如果使用上述观察点运行程序，调试器的执行如下：\n\n```\n(gdb) c\nContinuing.\nNumber of terms:\n\
  4\n0\nHardware watchpoint 2: next\nOld value = 0\nNew value = 1\n0x0000000000405c2\
  \ in main () at fibonacci.c:13\n13 next = i;\n```\n\n从上面的输出可以看到，程序在执行语句 `next =\
  \ i;` 时停止在第 13 行。\n\n如果我只想在计数器 `i` 的值变为 5 时停止程序呢？这是我这样做：\n\n```\n(gdb) watch i=5\n\
  Hardware watchpoint 2: i=5\n(gdb) c\nContinuing.\nNumber of terms:\n10\nHardware\
  \ watchpoint 2: i=5\nOld value = <unreadable>\nNew value = 5\n0x0000000000405b4\
  \ in main () at fibonacci.c:10\n10 for ( i = 0 ; i < n ; i++ )\n```\n\n## 检查变量的内容\n\
  \n我如何检查上一个示例中的程序是否在应该停止时停止？我们如何检查变量 `i` 的内容并确保在程序执行停止时它的值为 5？\n\n可以使用 `print` 命令检查变量的内容。\n\
  \n```\n(gdb) print i\n$1 = 5\n```\n\n所以我可以看到观察点确实触发了，且程序执行停止时变量 `i` 的值为 5。我可以继续查看其他变量的值：\n\
  \n```\n(gdb) print first\n$5 = 0\n(gdb) print second\n$6 = 1\n(gdb) print n\n$7\
  \ = 10\n```\n\n`print` 允许指定几种输出格式：\n\n- `x`: 以十六进制整数打印。\n- `d`: 以有符号十进制整数打印。\n-\
  \ `u`: 以无符号十进制整数打印。\n- `o`: 以八进制整数打印。\n- `t`: 以二进制整数打印。\n- `a`: 打印地址。\n- `c`: 打印字符常量。\n\
  - `f`: 使用典型的浮点数语法打印。\n\n以下是使用上述每格式显示变量 `n` 的示例：\n\n```\n(gdb) print/x n\n$8 = 0xa\n\
  (gdb) print/d n\n$9 = 10\n(gdb) print/u n\n$10 = 10\n(gdb) print/o n\n$11 = 12\n\
  (gdb) print/t n\n$12 = 1010\n```\n\n\n\n\n\n```\n*$12 = 0xa*\n*(gdb) print/d n*\n\
  *$13 = 10*\n*(gdb) print/u n*\n*$14 = 10*\n*(gdb) print/o n*\n*$15 = 012*\n*(gdb)\
  \ print/t n*\n*$16 = 1010*\n*(gdb) print/a n*\n*$17 = 0xa*\n*(gdb) print/c n*\n\
  *$18 = 10 '\\n'*\n*(gdb) print/f n*\n*$19 = 1.40129846e-44*\n```\n\n在调试会话中的任何时刻，如果我不确定变量的类型，可以使用\
  \ `whatis` 命令来实现此目的：\n\n```gdb\n(gdb) whatis i\ntype = int\n```\n\n```gdb\n(gdb)\
  \ whatis next\ntype = int\n```\n\n### 使用 `display` 监控变量\n\n如果我需要持续监控某些变量，可以使用 `display`\
  \ 命令，它会在每个后续 gdb 命令执行时自动打印变量。以下示例展示了如何在程序的每一步中检查后续程序变量 `i`、`first`、`second` 和 `next`\
  \ 的内容：\n\n```gdb\n(gdb) display n\n1: n = 0\n(gdb) display first\n2: first = -7568\n\
  (gdb) display second\n3: second = 32767\n(gdb) display i\n4: i = 0\n```\n\n```gdb\n\
  (gdb) watch i\nHardware watchpoint 2: i\n(gdb) c\nContinuing.\nNumber of terms:\n\
  4\n0\nHardware watchpoint 2: i\nOld value = 0\nNew value = 1\n0x00000000004005f7\
  \ in main () at fibonacci.c:10\n10 for ( i = 0 ; i < n ; i++ )\n4: i = 1\n3: second\
  \ = 1\n2: first = 0\n1: n = 4\n(gdb) c\nContinuing.\n1\nHardware watchpoint 2: i\n\
  Old value = 1\nNew value = 2\n0x00000000004005f7 in main () at fibonacci.c:10\n\
  10 for ( i = 0 ; i < n ; i++ )\n4: i = 2\n3: second = 1\n2: first = 0\n1: n = 4\n\
  (gdb) c\nContinuing.\n1\nHardware watchpoint 2: i\nOld value = 2\nNew value = 3\n\
  0x00000000004005f7 in main () at fibonacci.c:10\n10 for ( i = 0 ; i < n ; i++ )\n\
  4: i = 3\n3: second = 1\n2: first = 1\n1: n = 4\n(gdb) c\nContinuing.\n2\nHardware\
  \ watchpoint 2: i\nOld value = 3\nNew value = 4\n0x00000000004005f7 in main () at\
  \ fibonacci.c:10\n10 for ( i = 0 ; i < n ; i++ )\n4: i = 4\n3: second = 2\n2: first\
  \ = 1\n1: n = 4\n(gdb) c\nContinuing.\n```\n\n我可以使用 `undisplay` 命令关闭对变量的监控。\n\n\
  ## 设置变量和调用函数\n\n有时，在调试会话期间，我们可能需要更改程序的执行流或数据。这意味着在运行时“动态”更改变量的值，或者强制程序执行并非预定执行的指令。\n\
  \n我们该如何强制调试器修改变量的值？可以通过下方示例中的调试器 `set` 命令来实现：\n\n```gdb\n(gdb) print i\n$1 = 0\n\
  (gdb) set var i=5\n(gdb) print i\n$2 = 5\n```\n\n为了在 gdb 中演示调用函数，我需要对现有示例进行微调，添加一个新函数（foo），并在调试会话期间调用它。查看修改后的程序：\n\
  \n```c\n#include <stdio.h>\n\nvoid foo() {\n    printf(\"foo called!\\n\");\n}\n\
  \nint main() {\n    int n, first = 0, second = 1, next;\n    printf(\"Number of\
  \ terms: \\n\");\n    scanf(\"%d\",&n);\n    for ( i = 0 ; i < n ; i++ ) {\n   \
  \     if ( i <= 1 )\n            next = i;\n        else {\n            next = first\
  \ + second;\n            second = next;\n        }\n        printf(\"%d\\n\",next);\n\
  \    }\n    return 0;\n}\n```\n\n请观察程序上下文中的函数 `foo`。该函数在任何地方都没有调用。正常情况下它不会被执行。以下是在执行第\
  \ 9 行之前如何强制调用该函数的示例：\n\n```gdb\n(gdb) b 9\nBreakpoint 1 at 0x40058c: file fibonacci.c,\
  \ line 9.\n(gdb) r\nStarting program: /books/gdb/fibonacci\nBreakpoint 1, main ()\
  \ at fibonacci.c:9\nint n, first = 0, second = 1, next, i;\n(gdb) call foo()\nfoo\
  \ called!\n(gdb) n\nprintf(\"Number of terms: \\n\");\n```\n\n另一个常见的用例是更改程序的执行流，强制函数在执行剩余函数体之前返回。可以使用\
  \ `return` 命令来实现此目的。`return` gdb 命令的语法取决于函数是否被设计为返回值：\n\n## 回溯与栈帧切换\n\n许多程序的嵌套调用深度可能很深。这意味着函数\
  \ A 是因为被 B 调用而执行的，函数 B 是因为被 C 调用而执行的……每次进行新的函数调用，函数都会堆叠在一起。一个新的函数调用由一个新的 `frame`（或\
  \ `stack frame`）表示。该帧通常包含返回地址、函数变量以及函数参数。\n\n可以使用调试器检查当前的栈帧：\n\n```gdb\n(gdb) info\
  \ frame\n```\n\n对于执行中的每个程序，都有一个可以使用调试器检查的调用帧栈。该栈从程序的入口点（`main()`）开始，在进行新调用时添加新帧，在函数执行完成后移除帧。\n\
  \n```rip = 0x400540 in functionC (crashy.c:5);\nsource language c.\nArgs at 0x7ffd0a1c,\
  \ args:\nLocals at 0x7ffd0a1c, Previous frame's sp is 0x7ffd0a1d\nSaved registers:\n\
  rbp at 0x7ffd0a1c, rip at 0x7ffd0a18\n```\n\n我另一个简单的程序来为 gdb 提供的栈检查和导航功能提供有意义的示例。在下面的程序中\
  \ `functionA()` 调用 `functionB()`，然后 `functionB()` 调用 `functionC()`，最后 `functionC()`\
  \ 调用 `functionD()`。\n\n```c\n#include <stdio.h>\n\nvoid functionA();\nvoid functionB();\n\
  void functionC();\nvoid functionD();\n\nvoid functionA() {\n    int a;\n    a =\
  \ 1;\n    printf(\"functionA called!\\n\");\n    functionB();\n}\n\nvoid functionB()\
  \ {\n    int b;\n    b = 2;\n    printf(\"functionB called!\\n\");\n    functionC();\n\
  }\n\nvoid functionC() {\n    int c;\n    c = 3;\n    printf(\"functionC called!\\\
  n\");\n    functionD();\n}\n\nvoid functionD() {\n    int d;\n    d = 4;\n    printf(\"\
  functionD called!\\n\");\n}\n\nint main() {\n    functionA();\n    return 0;\n}\n\
  ```\n\n让我们先不使用调试器构建并执行上述程序：\n\n```bash\n$ gcc -O0 -g backtrace_demo.c -o backtrace_demo\n\
  $ ./backtrace_demo\nfunctionA called!\nfunctionB called!\nfunctionC called!\nfunctionD\
  \ called!\n```\n\n我现在将运行相同的程序，并在执行第 36 行 `printf(\"functionD called!\\n\");` 时设置一个断点。我们已经知道如何设置断点了：\n\
  \n```bash\n$ gdb ./backtrace_demo\nGNU gdb (GDB) Red Hat Enterprise Linux (7.2-64.el6_5.2)\n\
  Copyright (C) 2010 Free Software Foundation, Inc.\nLicense GPLv3+: GNU GPL version\
  \ 3 or later <http://gnu.org/licenses/gpl.html>.\nReading symbols from /books/gdb/backtrace_demo...done.\n\
  (gdb) b backtrace_demo.c:36\nBreakpoint 1 at 0x400542: file backtrace_demo.c, line\
  \ 36.\n(gdb) r\nStarting program: /books/gdb/backtrace_demo\nfunctionA called!\n\
  functionB called!\nfunctionC called!\nBreakpoint 1, functionD () at backtrace_demo.c:36\n\
  36 printf(\"functionD called!\\n\");\n```\n\n我从输出中可以看到程序分别调用了函数 A、B 和 C。但如果程序没有输出，我该如何知道这些？gdb\
  \ 提供了 `backtrace` 命令来实现此目的：\n\n```gdb\n(gdb) backtrace\n#0 functionD () at backtrace_demo.c:36\n\
  #1 0x0000000000400531 in functionC () at backtrace_demo.c:29\n#2 0x000000000040050c\
  \ in functionB () at backtrace_demo.c:21\n#3 0x00000000004004e7 in functionA ()\
  \ at backtrace_demo.c:13\n#4 0x000000000040055c in main () at backtrace_demo.c:42\n\
  ```\n\n\n\n\n帧 `#0` 包含了调用栈的顶端，我看到 `gdb` 正准备执行 `backtrace_demo.c` 模块中 `functionD`\
  \ 函数的第 36 行。但这并不意外，因为这正是我设置断点的地方。\n\n在上一个帧（last frame）的上下文中，如果存在任何局部变量，我可以检查它们的内容。`functionD`\
  \ 有一个变量 `d`，让我们检查一下它的值：\n\n```\n(gdb) print d\n$1 = 4\n```\n\n我可以使用 `info local`\
  \ 命令来“一次性”检查所有局部变量的值：\n\n```\n(gdb) info local\nd = 4\n```\n\n那么来自 `functionC` 的局部变量\
  \ `c` 呢？\n\n```\n(gdb) print c\nNo symbol \"c\" in current context.\n```\n\n运气不好吗？完全不是！我仍然可以通过以下方式通过限定名限定名来访问该变量：\n\
  \n```bash\n(gdb) print functionC::c\n$2 = 3\n```\n\n我还可以使用 `up` 和 `down` `gdb` 命令切换当前帧并在帧之间导航：\n\
  \n```\n(gdb) up\n#2 0x000000000040050c in functionB () at backtrace_demo.c:21\n\
  21 functionC();\n\n(gdb) info local\nb = 2\n\n(gdb) down\n#1 0x0000000000400531\
  \ in functionC () at backtrace_demo.c:29\n29 functionD();\n\n(gdb) info local\n\
  c = 3\n```\n\n以下是 `functionB()` 和 `functionC()` 返回后的调用栈：\n\n![](img/00009.jpeg)\n\
  \n```\n(gdb) backtrace\n#0 functionA () at backtrace_demo.c:14\n#1 0x000000000040055c\
  \ in main () at backtrace_demo.c:42\n```\n\n检查任何调用帧以及在调用栈中导航的能力，对于调试处理程序执行流的某些类问题是非常强大的调试功能。\n\
  \n## 处理信号\n\nLinux 信号是发送一个进程到一个或多个进程的异步通知，用于告知特定事件的发生。\n\n接收到的进程可以处理或忽略传入的信号。所有信号都可以被忽略，除了其中一个（`SIGKILL`）。`SIGKILL`\
  \ 是 Linux 用于强制关闭行为异常程序的信号，或者当 Linux 在关闭操作期间需要释放内存或强制关闭正在运行的应用程序时。\n\n以下是所有 Linux\
  \ 信号列表以及每个信号的简短描述：\n\n| Sig # | Sig name | 备注 |\n| :--- | :--- | :--- |\n| 1 | SIGHUP\
  \ | 如果进程从终端运行且该终端关闭，则进程将接收此信号。 |\n| 2 | SIGINT | 进程被“中断”。这发生在按下 Control+C 时。 |\n\
  | 3 | SIGQUIT | |\n| 4 | SIGILL | 非法指令。程序包含了 CPU 无法执行的某些机器码。 |\n| 5 | SIGTRAP |\
  \ 此信号主要用于调试器和程序跟踪器内部。`gdb` 在底层使用此信号来实现断点或单步执行。 |\n| 6 | SIGABRT | 程序调用了 `abort()`\
  \ 函数。这是一种比程序正常终止更紧急停止。 |\n| 7 | SIGBUS | 这是由尝试错误访问内存引起的。 |\n| 8 | SIGFPE | 这是由程序中发生的浮点异常引起的。\
  \ |\n| 9 | SIGKILL | 进程被某个意图停止程序的人显式杀死。 |\n| 10 | SIGUSR1 | 可供程序员使用。 |\n| 11 | SIGSEGV\
  \ | 这是由尝试访问无效内存引起的。 |\n| 12 | SIGUSR2 | 可供程序员使用。 |\n| 13 | SIGPIPE | 由向关闭的管道写入引起。\
  \ |\n| 14 | SIGALRM | 由程序中发生的定时器超时引起。 |\n| 15 | SIGTERM | 终止信号，用于请求程序正常退出。 |\n|\
  \ 16 | SIG | |\n| 17 | SIGCHLD | 当子进程创建、停止或终止时触发。 |\n| 18 | SIGCONT | 用于恢复停止的进程。\
  \ |\n| 19 | SIGSTOP | 强制停止进程。 |\n| 20 | SIGTSTP | 用户按下 Control+Z 时触发的停止信号。 |\n|\
  \ 21 | SIGIN | 当终端有输入就绪时。 |\n| 22 | SIGTOU | 当终端有输出就绪时。 |\n| 23 | SIGURG | 紧急数据可用。\
  \ |\n| 24 | SIGXCPU | CPU 资源限制超出。 |\n| 25 | SIGXFS | 文件大小超出限制。 |\n| 26 | SIGVTALRM\
  \ | 虚拟定时器超时。 |\n| 27 | SIGPROF | 用于性能分析的信号。 |\n| 28 | SIGWINCH | 窗口大小发生变化时。 |\n\
  | 29 | SIGIO | I/O 操作就绪时。 |\n| 30 | SIGPWR | 电源切换。 |\n| 31 | SIGSYS | 系统调用异常。 |\n\
  \n\n\n\n\n`gdb` 也具有向被调试程序发送信号的能力。这可以通过使用 `signal` 或 `queue-signal` 命令来实现。这两个命令之间存在非常微小的区别：\n\
  \n- `signal *signal*`：恢复程序并立即递送信号。\n- `queue-signal *signal*`：在程序恢复后递送信号。\n\n##\
  \ 修改执行线程\n\n复杂的 Linux 程序通常由多个执行线程组成。因此，一个强大的 Linux 调试工具必须能够处理多线程程序。`gdb` 正好满足这一要求。\n\
  \n为了理解 `gdb` 的多线程能力，让我们考虑 `fibonnaci.c` 程序的一个多线程版本，它并行计算三个斐波那契数列。请参下方的程序列表。请注意，为了保持示例简洁，没有提供错误处理：\n\
  \n```c\n1: #include <stdio.h>\n2: #include <pthread.h>\n3:\n4: #define NUM_THREADS\
  \ 3\n5: void* fibonacci(void *arg)\n6: {\n7: int n, first = 0, second = 1, next,\
  \ i;\n8:\n9: n = (int)arg;\n10:\n11: for ( i = 0 ; i < n ; i++ )\n12: {\n13: if\
  \ ( i <= 1 )\n14: next = i;\n15: else\n16: {\n17: next = first + second;\n18: first\
  \ = second;\n19: second = next;\n20: }\n21: sleep(5);\n22: }\n23:\n24: printf(\"\
  Fib(%d)=%d\\n\", n, next);\n25: return NULL;\n26: }\n27:\n28: int main()\n29: {\n\
  30: pthread_t tid[NUM_THREADS];\n31: int n[NUM_THREADS];\n32: int i;\n33:\n34: /*\
  \ read input data */\n35: for ( i = 0; i < NUM_THREADS; i++ )\n36: {\n37: printf(\"\
  Thread %d: Number of terms: \\n\", i);\n38: scanf(\"%d\",&n[i]);\n39: }\n40:\n41:\
  \ /* start computation threads */\n42: for ( i = 0; i < NUM_THREADS; i++ )\n43:\
  \ {\n44: pthread_create(&(tid[i]), NULL, &fibonacci, (void*)n[i]);\n45: }\n46:\n\
  47: /* wait for threads to finish */\n48: for ( i = 0; i < NUM_THREADS; i++ )\n\
  49: {\n50: pthread_join(tid[i], NULL);\n51: }\n52: printf(\"Game over!\\n\");\n\
  53: }\n```\n\n可以使用以下命令从命令行构建该程序：\n\n```bash\n$ gcc -g fibonacci_threads.c -lpthread\
  \ -o fibonacci_threads\n```\n\n上述命令的输出是一个名为 `fibonacci_threads` 的可执行文件。在用调试器探索之前，让我们看看程序是如何执行的：\n\
  \n```bash\n$fibonacci_threads\nThread 0: Number of terms:\n6\nThread 1: Number of\
  \ terms:\n4\nThread 2: Number of terms:\n2\nFib(2)=1\nFib(4)=2\nFib(6)=5\nGame over!\n\
  ```\n\n现在是时候看一个如何在 `gdb` 下运行此程序的示例了。我在书中到为止介绍的每个命令也适用于多线程程序。因此，在调试器下启动程序并在第 48 行设置断点应该是你已经熟悉的：\n\
  \n```bash\n$ gdb fibonacci_threads\nGNU gdb (GDB) Red Hat Linux 7.6-1\nCopyright\
  \ (C) 2013 Free Software Foundation, Inc.\nLicense GPL3 version 3 or later <http://gnu.org/licenses/gpl.html>\n\
  Reading symbols from /home/books/fibonacci_threads...done.\n(gdb) b 48\nBreakpoint\
  \ 1 at 0x4008bc: file fibonacci_threads.c, line 48.\n```\n\n我可以运行程序直到遇到断点：\n\n```bash\n\
  (gdb) r\nStarting program: /home/books/fibonacci_threads [Thread debugging using\
  \ libthread_db]\nUsing host libthread_db \"/lib64/libthread_db.1\".\nThread 0: Number\
  \ of terms:\n4\nThread 1: Number of terms:\n5\nThread 2: Number of terms:\n8\n[New\
  \ Thread 0x7ffff7fe00 (LWP 3325)]\n[New Thread 0x7ffff6ffd00 (LWP 3326)]\n[New Thread\
  \ 0x7ffff6fc00 (LWP 3327)]\nBreakpoint 1, main () at fibonacci_threads.c:49\n49\
  \ for ( i = 0; i < NUM_THREADS; i++ )\n```\n\n从上面的输出可以看出，`gdb` 已经发现了额外的线程（New Thread\
  \ 0x7fff...）。我们已经安全地假设这些线程是程序的工作线程。但如何检查这些线程确实是我们要找的呢？这种情况下第一个命令是 `info threads`：\n\
  \n```bash\n(gdb) info threads\nId   Target                                Frame\
  \ \n4    0x7ffff6fc00 (LWP 3194) \"fibonacci_threa\"  0x00007ffff78f5a1 in clone\
  \ () from /lib64/libc.6\n3    0x7ffff6ffd00 (LWP 3193) \"fibonacci_threa\"  0x00007ffff8bcad\
  \ in nanosleep () from /lib64/libc.6\n2    0x7ffff7fe00 (LWP 3192) \"fibonacci_threa\"\
  \  0x00007ffff8bcad in nanosleep () from /lib64/libc.6\n*1    0x7ffff7fdf40 (LWP\
  \ 3188) \"fibonacci_threa\"  main () at fibonacci_threads.c:49\n```\n\n从 `info threads`\
  \ 的输出可以看到 `fibonacci_thread` 包含四个线程。这是我在第 48 行预期创建的线程数量。一个线程（id 1）是应用程序的主线程。其他三个线程（id\
  \ 2,3 和 4）是在第 44 行创建的工作线程。线程 id 1 处有一个 `*` 标记，这意味着线程 id 1 是当前焦点。所有的 `gdb` 命令都针对具有焦点的线程执行。\n\
  \n```bash\n(gdb) bt\n#0 main () at fibonacci_threads.c:49\n(gdb) info local\ntid\
  \ = {140737345742592, 140737337349888, 140737328957184}\nn = {4, 5, 8}\ni = 3\n\
  ```\n\n注意，一旦多线程遇到断点，所有线程的执行都会停止，而不只是触发断点的线程。这允许对其他线程进行检查。\n\n`t` 命令允许将焦点切换到一个停止的线程。以下是切换到该线程的示例：\n\
  \n```bash\n(gdb) t 3\n(gdb) bt\n#0 0x00007ffff7bcad in nanosleep () from /lib64/libc.6\n\
  #1 0x00007ffff78c4 in sleep () from /lib64/libc.6\n#2 0x00007ffff78fe in fibonacci\
  \ (arg=0x5) at fibonacci_threads.c:22\n#3 0x00007ffff7df3 in start_thread () from\
  \ /lib64/libpthread.so\n#4 0x00007ffff78f53dd in clone () from /lib64/libc.6\n```\n\
  \n但如果我将断点设置在一个只由工作线程执行的行会怎样？比如第 11 行。这个断点会被命中吗？让我们尝试这种场景：\n\n```bash\n(gdb) b 11\n\
  Breakpoint 2 at 0x4007c1: fibonacci_threads.c, line 11.\n(gdb) r\nStarting program:\
  \ /home/books/fibonacci_threads [Thread debugging using libthread_db]\nUsing host\
  \ libthread_db \"/lib64/libthread_db.1\".\nThread 0: Number of terms:\n4\nThread\
  \ 1: Number of terms:\n5\nThread 2: Number of terms:\n8\n[New Thread 0x7ffff7fe00\
  \ (LWP 3325)]\n[New Thread 0x7ffff6ffd00 (LWP 3326)]\n[New Thread 0x7ffff6fc00 (LWP\
  \ 3327)]\nBreakpoint 1, main () at fibonacci_threads.c:49\n49 for ( i = 0; i < NUM_THREADS;\
  \ i++ )\n```\n\n\n\n\n\n即使第 11 行在三个工作线程中都是通用的，其中一个线程也会先命中此断点。在我的示例中，线程 2 首先命中了断点，这在某种程度上是意之中的，因为这是程序创建的第一个工作线程。然而，准确预测哪个线程会先到达该行是困难的，因为这完全取决于多个其他因素（内核调度策略、系统中的线程总数、其他线程的优先级等）。\n\
  \n如果我从命中断点的地方继续执行程序，可以看到断点将由第二个工作线程（线程 ID 3）第二次命中。而且该线程也获得了焦点：\n\n```gdb\n(gdb)\
  \ c\nContinuing.\n[Switching to Thread 0x7ffff6ffd700 (LWP 3340)]\nBreakpoint 1,\
  \ fibonacci (arg=0x5) at fibonacci_threads.c:12\n12      for ( i = 0 ; i < n ; i++\
  \ )\n(gdb) info threads\n[New Thread 0x7ffff67fc700 (LWP 3418)]\n Id Target Id Frame\n\
  4 Thread 0x7ffff67fc700 (LWP 3418) \"fibonacci_threa\" 0x00007ffff78f53a1 in clone\
  \ () from /lib64/libc.so.6\n 3 Thread 0x7ffff6ffd700 (LWP 3340) \"fibonacci_threa\"\
  \ fibonacci (arg=0x5) at fibonacci_threads.c:12\n2 Thread 0x7ffff77fe700 (LWP 3339)\
  \ \"fibonacci_threa\" 0x00007ffff78bc8ad in nanosleep () from /lib64/libc.so.6\n\
  1 Thread 0x7ffff7fdf740 (LWP 3335) \"fibonacci_threa\" 0x00007ffff78f53a1 in clone\
  \ () from /lib64/libc.so.6\n```\n\n简而言之，这些是在 `gdb` 下处理多线程 Linux 程序的基础：检测哪些线程是程序的一部分，并在它们之间切换上下文，以便探索每个线程的内部状态。\n\
  \n## 处理崩溃\n\n`gdb` 最强大的功能之一是调查传统上难以处理的问题：程序崩溃。一个在没有任何明显原因的情况下随机发生的崩溃，如果没有一种方法获取导致程序崩溃的上下文信息，调查起来将是极其困难的。这正是\
  \ `gdb` 可以派上用场的地方，它可以提供崩溃发生处的回溯轨迹（backtrace），并提供导致崩溃的每个调用栈帧的上下文信息。\n\n下面是一个程序，其编写方式故意会在执行期间发生崩溃。\n\
  \n```c\n#include<stdio.h>\n\nvoid functionC() {\n    int *p = NULL;\n    p = 25;\n\
  }\n\nvoid functionB() {\n    functionC();\n}\n\nvoid functionA() {\n    functionB();\n\
  }\n\nint main() {\n    printf(\"Program started\\n\");\n    functionA();\n    printf(\"\
  Program finished\\n\");\n    return 0;\n}\n```\n\n假设上述源代码位于名为 `crashy.c` 的文件中，可以使用以下命令编译此程序：\n\
  \n```bash\n$ gcc -g crashy.c -o crashy\n```\n\n接下来，我将假装不知道是什么导致了程序崩溃，并将使用 `gdb`\
  \ 来帮助我确定位崩溃的根源。\n\n为了能够调查程序崩溃，我需要指示操作系统保存崩溃数据。可以通过执行以下命令来实现：\n\n```bash\n$ ulimit\
  \ -c unlimited\n```\n\n崩溃数据存储在特定的 Linux 文件中：`core file`（核心转储文件）。core 文件本质上是系统的一个快照，包括崩溃发生瞬间的内存和\
  \ CPU 寄存器。上面的命令将启用无限制大小的 core 文件。默认情况下 core 大为零，这意味着不会产生 core 文件。core 文件可以设置为特定的最大大小，但这里的风险是生成的\
  \ core 文件可能不包含足够的信息来辅助调试。因此，在假设没有存储空间严格限制的情况下，建议将 core 文件大小设置为 `unlimited`。\n\n\
  让我们运行 `crashy` 程序，现在已经启用了 core 文件的生成。这将产生以下输出：\n\n```bash\n$ ./crashy\nProgram started\n\
  Segmentation fault (core dumped)\n```\n\n我可以在输出中看到生成 core 文件的迹象。如果我列出文件夹的内容，就可以看到\
  \ core 文件确实已生成：\n\n```bash\n$ ls -lrt\n-rw-rw-r--. 1 ssosiade ssosiade 256 Feb 23\
  \ 12:07 crashy.c\n-rwxrwxr-x. 1 ssosiade ssosiade 9830 Feb 23 12:08 crashy\n-rw-------.\
  \ 1 ssosiade ssosiade 253952 Feb 23 12:20 core.4890\n```\n\n```bash\n$ file core.4890\n\
  core.4890: ELF 64-bit LSB core x86-64, version 1 (SYSV), from './crashy'\n```\n\n\
  注意，core 文件的命名约定是 `core.<pid>`，我们可以使用 `gdb` 打开该文件来调查崩溃：\n\n```bash\n$ gdb crashy\
  \ core.4890\n```\n\n\n\n\n编译目录为 `/home/ssosiade/book`\n\n位于 `/home/ssosiade/book/crashy.c`\n\
  \n包含 22 行。\n\n源语言为 `c`。\n\n使用 `DWARF 2` 调试格式编译。\n\n不包含预处理器宏信息。\n\n在尝试诊断随机崩溃的根源时，以上所有内容都是无与伦比的价值。`gdb`\
  \ 解码核心转储（core dumps）并提供崩溃上下文信息的能力是一项强大的功能。试想一下，如果没有 `gdb` 提供的崩溃信息，调查崩溃将有多么困难。\n\n\
  ## 使用文本用户界面运行 gdb\n\n“TUI” 代表“Text User Interface”（文本用户界面），它代表了 `gdb` 的一项功能，允许在文本模式下使用多个窗口进行调试。\n\
  \n在 TUI 模式下，可以使用以下窗口：\n\n- `Command` - 代表 `gdb` 命令窗口，可以在其中发布 `gdb` 命令。此窗口始终可见。\n\
  - `Source` - 显示程序的源文件。\n- `Assembly` - 显示程序的汇编语言。\n- `Register` - 显示处理器寄存器及其内容。\n\
  \n要用文本用户界面模式启动 `gdb`，请使用以下命令：\n\n```\ngdb fibonacci –tui\n```\n\n默认情况下显示命令窗口和源窗口，如下所示：\n\
  \n![](img/00010.jpeg)\n\n源窗口和汇编窗口通过 `>` 标记显示正在执行的程序行。\n\n如果设置了断点，则会按照以下命名约定在程序的每行上显示这些断点：`<breakpoint_type><breakpoint_status>`。\n\
  \n其中 `<breakpoint_type>` 可以有以下表示之一及其含义：\n\n- B - 断点至少命中过一次。\n- B - 断点到为止未被命中。\n\
  - H - 硬件断点至少命中过一次。\n- h - 硬件断点到为止未被命中。\n\n`<breakpoint_status>` 表示断点是否启用，其值有以下内容之一：\n\
  \n- + - 断点已启用。\n- - - 断点已禁用。\n\n要查看当前正在使用哪些窗口，请在命令窗口中输入以下命令：\n\n```bash\n(gdb) info\
  \ win\n```\n\n`SRC (29 lines) <has focus>`\n`CMD (14 lines)`\n\n要显示特定的窗口，请使用以下“layout”命令之一：\n\
  \n```bash\n(gdb) layout asm\n(gdb) layout src\n(gdb) layout reg\n```\n\n在可以同时显示的多个窗口中，只有一个窗口可以拥有焦点（focus）。拥有焦点的窗口可以上下滚动。可以使用“focus”命令将焦点设置到特定窗口：\n\
  \n```bash\n(gdb) focus src\nFocus set to SRC window.\n(gdb) focus reg\nFocus set\
  \ to REGS window.\n(gdb) focus cmd\nFocus set to CMD window.\n(gdb) focus asm\n\
  Focus set to ASM window.\n```\n\n最后，使用“refresh”命令来刷新所有当前正在使用的窗口。\n\n```bash\n(gdb)\
  \ refresh\n```\n\n在调试会期间，可以在命令窗口中发布多个 `gdb` 命令。这些命令可以改变程序的内部状态，而不一定会将所有的内部变化都反映在屏幕上启用的窗口中。因此，我建议在根据文本窗口中的数据做出任何决策之前，使用“refresh”命令。\n\
  \n## 调试内存访问问题。`Valgrind`\n\n尽管它不属于 GNU 工具链，但 `valgrind` 可能是 Linux 中检测内存相关问题常用的工具。出于这个原因，我决定为这个工具专门一个小章节。某些\
  \ Linux 发行版通常在安装操作系统时包含或允许用户包含此包。为了检查你的机器上是否安装了 `valgrind`，请执行：\n\n```bash\nwhich\
  \ valgrind\n```\n\n如果你没有它，可以简单地安装它：\n\n```bash\nsudo apt install valgrind\n```\n\
  \n\n\n\n```\nvalgrind --tool=memcheck --leak-check=full ./leaky\n```\n\n==20156==\
  \ Memcheck, a memory error detector\n==20156== Copyright (C) 2002-2012, and GNU\
  \ GPL'd, by Julian Seward et al.\n==20156== Using Valgrind-3.8.1 and LibVEX; rerun\
  \ with -h for copyright info\n==20156== Command: ./leaky\n==20156==\n\nMemory allocated\
  \ succesfuly\n==20156==\n\n==20156== HEAP SUMMARY:\n==20156== in use at exit: 0\
  \ bytes in 0 blocks\n==20156== total heap usage: 1 allocs, 1 frees, 12 bytes allocated\n\
  ==20156==\n\n==20156== All heap blocks were freed -- no leaks are possible\n==20156==\n\
  \n==20156== For counts of detected and suppressed errors, rerun with: -v\n==20156==\
  \ ERROR SUMMARY: 0 errors from 0 contexts (suppressed: 6 from 6)\n```\n\n内存泄漏并不是\
  \ `valgrind` 能够检测的唯一问题类型。该工具在检测以下其他内存访问问题方面非常强大：\n\n- 访问并非属于程序的内存（例如溢出堆块、在栈顶之外写入内存或在内存释放后访问该内存）。\n\
  - 使用未初始化的值。\n- 多次释放动态内存，或者在 `malloc` 与 `free` 或 `new` 与 `Delete` 的使用上不匹配。\n- 在字符串或内存操作函数中使用重叠的“源”指针和“目标”指针。\n"
