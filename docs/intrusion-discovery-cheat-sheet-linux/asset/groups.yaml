    # Purpose


    System Administrators are often on the first lines of computer security. This
    guide aims to support System Administrators in finding indications of a system
    problem.


    # What to use this sheet


    On a periodic basis (daily, weekly, or each time you logon to a system you), run
    these quick steps to look for anomalous behavior that might be caused by a computer
    intrusion. Each of these commands runs locally on a system.


    This sheet is split into these sections:


    - Unusual Processes

    - Unusual Files

    - Unusual Network Usage

    - Unusual Scheduled Tasks

    - Unusual Accounts

    - Unusual Log Entries

    - Additional Supporting Tools


    If you spot anomalous behavior: DO NOT PANIC!

    Your system may not have come under attack. Please contact the Incident Handling
    team to report the activities and get further assistance:

    [Chief Handler''s Name]

    [Contact Phone Number]

    [Contact Pager Number]

    [Relevant Internal Web]


    # Unusual Processes


    Look for running processes:

    # ps -aux


    Get familiar with "normal" processes for the machine.


    Look for unusual processes. Focus on processes with root (UID 0) privileges.


    If you spot a process that is unfamiliar, investigate unusual processes, getting
    more detail using:

    # lsof -p [pid]


    This command shows all files and ports used by the running process.


    # Unusual Files


    Look for unusual SUID root files:

    # find -uid 0 -perm -4000 -print

    Requires knowledge of normal SUID files


    Look for unusual large files (greater than 10 MegaBytes):

    # find -size 10000k -print

    Requires knowledge of normal large files


    Look for files named with colons and spaces:

    "* . . . " and ""

    # find -name "*.**"

    # find -name "*..*"

    # find -name "* .*"


    # Unusual Files Continued


    On a Linux machine installed with RPM (RedHat, Mandrake, etc.), run the RPM tool
    to verify cases


    ```

    # rpm -Va

    ```


    Checks size, MD5 sum, permissions, type, owner, and group of each file with information
    from RPM database


    Output includes:


    | Flag | Description |

    | :--- | :--- |

    | S | Size differs |

    | M | Mode differs (permissions) |

    | M | MD5 sum differs |

    | D | Device number mismatch |

    | L | readLink path mismatch |

    | U | user ownership differs |

    | G | group ownership differs |

    | T | modification time differs |


    Pay special attention to changes associated with items in /sbin, /bin, /usr/sbin,
    and /usr/bin


    Look for promiscuous mode, which might indicate a sniffer:


    ```

    # ip link | grep PROMISC

    ```


    Note that ifconfig doesn''t work reliably for detecting promiscuous mode on Linux
    kernel 2.4


    # Unusual Network Usage Continued


    Look for unusual port listeners:

    # lsof -i

    # netstat -nap


    Need to know TCP and UDP ports are normally listening on your system and look
    for deviations from the norm


    Look for ARP entries, mapping IP address to MAC addresses that aren''t correct
    for the LAN:


    ```

    # arp -a

    ```


    Requires detailed knowledge of what is supposed to be on the LAN


    # Unusual Scheduled Tasks


    Look for cron jobs scheduled by root and any other UID 0 accounts:


    ```

    # crontab -u root -

    ```


    Look for unusual system-wide cron jobs:


    ```

    # cat /etc/crontab

    # ls /etc/cron.*

    ```


