    # Unusual Accounts


    Look in /etc/passwd for new accounts, especially with UID 0 or GID 0


    ```

    ### less /etc/passwd

    # grep :0 /etc/passwd

    ```


    Normal accounts will be there, but look for new, unexpected accounts


    # Unusual Log Entries


    Look through your system log files for suspicious events, including:


    - Promiscuous mode: "entered promiscuous mode"

    - Large number of authentication or login failures from either local or remote
    access tools (e.g., telnet, sshd, etc.).

    - Remote Procedure Call (rpc) programs with a log entry that includes a large
    number (> 20) strange characters (-^PM-^PM-^PM-^PM-^PM-^^PM-)

    - For web servers: Large number of Apache logs saying "error"


    # Additional Supporting Tools


    The following tools are often not built into the Linux operating system, but can
    be used to analyze its status in detail. Each is available for free download at
    the listed web site.


    - Chrootkit looks for anomalies on systems introduced by user-mode and kernel-mode
    Rootkits: www.chkrootkit.org - free

    - Tripwire looks for changes to critical system files: www.tripwire.org - free
    for Linux for commercial use

    - AIDE looks for changes to critical system files: http://www.cs.tut.fi/~rammer/aide.html


