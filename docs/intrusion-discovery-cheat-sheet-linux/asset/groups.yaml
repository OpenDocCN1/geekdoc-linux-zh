    # 异常账户


    检查 `/etc/passwd` 以查找新账户，特别是具有 UID 0 或 GID 0 的账户。


    ```

    ### less /etc/passwd

    # grep :0 /etc/passwd

    ```


    正常账户会出现在那里，但请寻找新的、异常的账户。


    # 异常日志条目


    检查系统日志文件以查找可疑事件，包括：


    - 混杂模式："entered promiscuous mode"

    - 来自本地或远程访问工具（例如 telnet、sshd 等）的大量身份验证或登录失败。

    - 远程过程调用 (rpc) 程序的日志条目包含大量（> 20 个）奇怪字符 (-^PM-^PM-^PM-^PM-^PM-^^PM-)

    - 对于 Web 服务器：大量显示为 "error" 的 Apache 日志


    # 额外的辅助工具


    以下工具通常未内置于 Linux 操作系统，但可以用于详细分析系统状态。每个工具都可以在列出的网站免费下载。


    - Chrootkit：查找由用户态和内核态 Rootkits 引入的系统异常：www.chkrootkit.org - 免费

    - Tripwire：查找关键系统文件的更改：www.tripwire.org - Linux 商业用免费

    - AIDE：查找关键系统文件的更改：http://www.cs.tut.fi/~rammer/aide.html


