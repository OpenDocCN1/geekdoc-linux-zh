  md: 'In either case, click the **Finish** button and you''re all done!


    Unless you''re updating the kernel itself, the updates you''ve applied are immediately
    available the next time you use the application that was updated. If you''ve updated
    the kernel, you''ll need to reboot your machine and select the new kernel from
    the boot menu screen as shown in **Figure 35**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_110_0.png)


    Figure 35. After you update your kernel, you will see multiple options in the
    boot menu.


    If you have any servers running, you''ll need to restart them by clicking **Main
    Menu | System Settings | Server Settings | Services**. Or if you can''t bear the
    thought of going days and weeks without a reboot, rebooting your machine will
    work too.


    The preceding discussion is all based on the various options that occur when you
    right-click the **Red Hat Network Alert Notification** Tool icon and then select
    one of the menu options. If you simply click the icon, you''ll see a pair of dialogs,
    one overlaid on the other, as shown in **Figure 36**.


    The **Red Hat Network Registration** dialog on top is a funny little beast—a throwback
    to commercial versions of Red Hat Linux. If you click the **"Register with RHN"**
    button, you''ll be prompted for the root password, as in Figure 19, and then you''ll
    see the **"Welcome to Red Hat Update Agent"** screen, as shown in Figure 20.


    If, on the other hand, you click **Cancel**, the **Available Updates** tab of
    the **Red Hat Network Alert Notification** Tool will appear, as shown in **Figure
    37**.'
