    in more detail later on. By the way, it’s important to mention again that these
    applets are simply graphical interfaces to programs that provide the ability to
    configure and customize the system. Every function you perform via an applet in
    the menu can also be done via commands. In fact, in many instances, the commands
    offer additional options that haven’t yet migrated to the graphical applets.


    # Customize the desktop


    Once you’re familiar with getting around the basic interface, you’re more than
    likely to want to change things. In some cases the procedure for making changes
    will be obvious, but in others the process can be obscure.


    # Desktop


    I personally prefer to keep my desktop clear of icons. As you saw in Figures 1
    and 2, I keep nothing on the desktop beyond what comes with a standard installation.
    Other people, however, prefer to keep all sorts of goodies on their desktops.


    There are several ways to add a shortcut to an application that’s found on a menu.
    The easiest way is to open the menu (but not the application), and drag the menu
    item from the menu to the desktop. (You’ll want the desktop to be visible when
    the menu is open; dragging into a document window will cause weird things to happen,
    but the level of weirdness depends on what type of window is open.)


    You can also drag an application’s icons from the panel onto the desktop; the
    original icon in the panel will stay there, and a copy will be placed on the desktop.
    A third way, although'
