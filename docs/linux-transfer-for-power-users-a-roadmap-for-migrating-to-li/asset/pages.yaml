- pgno: 60
  md: '# Package Installation Defaults


    The selection of one of the four Installation Types in step 10 earlier (see Figure
    25) drives the assembly of a list of packages that will be installed. At this
    step, you have the chance to modify the list of packages.


    **Step 20.** If you want to accept the default set of packages, keep the “Install
    default software packages” choice selected. If you want to be able to modify the
    list of packages, select the “Customize software packages to be installed” option
    button.


    In both cases, click Next. If you selected “Install default,” continue reading
    with step 22. Otherwise, continue with the next step, Package Group Selection.
    If you’re customizing the list, you’ll see the Package Group Selection screen,
    as shown in **Figure 35**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_60_0.png)


    *Figure 35. The Package Group Selection screen displays the selected packages
    for the Installation Type you selected in Figure 25.*


    # Package Group Selection


    The Package Group Selection screen displays the packages that are selected by
    default based on the Installation Type you selected in step 10 and shown in Figure
    25.


    The packages you select at this point are purely a matter of personal choice and
    personality. Some people like to install everything under the sun, finding it
    handy to have anything they might need at arm’s length. Others want to keep things
    to a minimum, figuring that the less software that’s installed means fewer potential
    security holes, and makes using the system less confusing, due to fewer choices
    to deal with. It’s up to you which way you want to go. A full installation will
    run about 5 GB, while a minimal installation will be closer to 1 GB. You can even
    have the installer select a minimal configuration or install everything (including
    some items not listed in the separate package groups), as shown in **Figure 36**.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_61_0.png)


    # Figure 36. Use the Minimal or Everything check boxes at the bottom of the Package
    Group Selection screen to quickly make "all or nothing" choices.


    That said, I would suggest that you consider including the following items:


    +   - KDE Desktop Environment—all packages. There are a number of nifty little
    widgets that come along with KDE.

    +   - Office/Productivity Packages—GnuCash is similar to Quicken. GPDF and XPDF
    allow you to view PDF files. (OpenOffice.org should already be selected.)

    +   - Sound and Video—all packages.

    +   - Administration Tools—all packages.

    +   - System Tools—samba client. This enables you to communicate with other computers
    on your network.


    > *If you find that you''ve installed too much (or too little), you can add and
    remove packages through the System Settings | Add/Remove Packages option later
    in the installation process, as well as at any time while you''re using the system
    via System Settings | Add/Remove Applications.*


    **Step 21.** Once you''ve selected the packages you want, click **Next** to move
    to the About to Install screen, as shown in **Figure 37**.'
