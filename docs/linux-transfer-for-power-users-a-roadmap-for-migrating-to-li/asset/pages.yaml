  md: '# # Chapter 1

    # Why Linux?

    # Why Not Linux?

    # Which Linux?


    You’re reading this book to get started with Linux, and you’re coming from the
    perspective of a Windows power user. The rise of Linux in the popular culture
    has also given rise to a large number of half-truths, myths, and outright lies.
    These can serve to cause people to set unrealistic expectations, and thus be disappointed
    by their first exposure to Linux. In order to help you develop realistic expectations,
    this chapter will provide the expectations for Linux usage that I started out
    with. Once you create your own set, you can then evaluate your progress in meeting
    those expectations. In addition, I’ll discuss some common misconceptions about
    Linux; offer some thoughts about choosing a distribution; and explain why this
    book covers Fedora Core in print, and other distributions through electronic downloads.


    I’ve been building custom software applications on Microsoft platforms since the
    mid-1980s. I was a Microsoft Most Valuable Professional (MVP) from the mid ’90s
    until last year, a Microsoft Certified Professional (MCP) during the late ’90s
    and received the first Microsoft Visual FoxPro Lifetime Achievement Award in October
    of 2002. In the summer of 2002, I started investigating Linux, and have had a
    Linux-based computer as my primary desktop since that fall. By any account, that
    was a radical change, and not one that was made lightly.


    While making the decision to switch to a Linux-based operating system, I had to
    evaluate what I was expecting from Linux, write down my expectations, and later
    go back and reevaluate, based on the progress I had made.


    I also had to look at some of the hearsay that surrounds Linux. Many of my friends
    in the Microsoft world looked askance at my decision---some to the point of severing
    ties with me because I was “a traitor,” that I had succumbed to the “lies of open
    source,” and that I had a “secret agenda” and was using Linux to “further my own
    means.” You can imagine the conversations we’ve had there.


    And then there was the decision of which distribution. According to the Web site
    [www.distrowatch.com](http://www.distrowatch.com), there are 225 active Linux
    distributions. That raises the question: “Which one?” Fortunately, I was able
    to narrow the field down because many of them are specialized or otherwise inapplicable
    for general-purpose desktop use. Still, a half dozen distributions have mindshare
    significant enough to warrant some consideration.


    Now, about you. This book is actually about you---helping you transfer your Windows
    skills to Linux. I’m assuming that you’re part of that elite crowd of people who
    are often referred to as “power users.” You’re often an early adopter of technology,
    but you’re not a programmer or a general-purpose geek. You use personal computers
    to get something done, not just for the sheer joy of using a computer, but you
    do enjoy making the machine bend to your will. Depending on when you started with
    computers, you were the first in your crowd to get a PC, or to use Lotus 1-2-3,
    or pick up a modem to get online. You were the first in your'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'department to discover the Internet or use a digital camera, and now you''re
    the first in your crowd to get into Linux.


    You''re comfortable with Microsoft Windows and think nothing of having a half
    dozen windows open as you multi-task between e-mail, Web browsing, document creation,
    and a daily planner. You''ve heard that Linux is ready for the desktop, and you
    want to find out more. This book will act as your personal coach: a paperback
    version of a more experienced friend who is sitting down with you at your computer,
    showing you the ropes, and explaining how to get started quickly with Linux on
    your desktop computer.


    Welcome.


    # ## Why Linux?


    I started looking at Linux when the restrictions and problems I ran into on the
    Microsoft Windows platform gained critical mass for my personal taste. For me,
    open-source software, of which Linux is often held up as the poster child, embodies
    four important ideals: freedom, choice, security, and opportunity. Microsoft Windows
    kept throwing barriers in my way in each of these areas, while Linux provided
    solutions.


    Let''s examine each of those in a bit more detail.


    # ### Freedom


    Open-source software like Linux represents freedom.


    With proprietary software, such as (but not limited to) Microsoft Windows, your
    freedoms are severely curtailed, and are becoming more and more limited each day.
    You''re allowed to use the software only in ways that the manufacturer designates,
    on platforms that the manufacturer designs acceptable, and for time spans or by
    numbers of users expressly allowed by the manufacturer. You are not allowed to
    make changes to it so that it works better for your own situation—indeed, you
    are not even allowed to look at how the software is put together in order to determine
    how to best make use of it.


    If there are problems with the software, you are prohibited from fixing or otherwise
    resolving those problems in ways other than those permitted by the manufacturer.
    This includes fixing bugs or making other changes even after they stop supporting
    the software. You are at the mercy of the manufacturer or their designees for
    resolution of problems—in effect, they have a monopoly in terms of providing (or
    not providing) service and support. If you disobey any of those restrictions,
    you are subject to fines and jail terms.


    Some licenses of proprietary software even restrict you from publishing benchmarks
    or other performance-related information—so you are unable to fairly evaluate
    one manufacturer''s product against another.


    Open-source software, on the other hand, allows and encourages the use and modification
    of software so that it is as useful as possible to the user. The only restriction
    is that modifications to open-source software that are made available to others
    must carry the same freedoms. Hardly a restriction!


    Some argue that most people won''t ever take advantage of these freedoms—that
    the average Joe user won''t recompile his kernel or that most companies won''t
    hire someone to fix a bug. Fine. That''s not the point. The point is that they
    have the freedom to do so, should the need arise.


    I like the freedom that open-source software represents.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# **Choice**


    Open-source software like Linux offers choices—choices that proprietary vendors
    do not want you to have. Proprietary vendors endeavor to lock you in to their
    platform; indeed, they have been doing that since the railroad robber barons of
    the mid-1800s tried to restrict usage of their tracks via the implementation of
    different gauges of tracks.


    It is in the interest of a proprietary manufacturer to keep you tied to their
    platform, and thus restrict your choices to just those that they will allow. The
    end result is that you will end up paying higher prices than you would in a free
    market where there were many choices.


    “Open source,” on the other hand, is all about choice. Don’t like a particular
    browser, office suite, or e-mail client? You’ve got many alternatives to choose
    from. And because there is competition between the providers of these choices,
    they need to compete on both features and quality.


    A monopoly doesn’t have to concern itself with features or quality, because there’s
    no reason to.


    Every time I upgraded my development tools in Windows, I was forced to upgrade
    the browser and a myriad of other components, whether I wanted to or not. And
    there were significant reasons for not wanting to just upgrade those components
    without a choice, as you’ll see in the next section. With open-source software,
    you don’t get a set of unwanted or needed components jammed down your throat against
    your will.


    I like being able to choose which religion I practice, which political party to
    belong to, which way to educate my kids, and which clothes to wear and how long
    to wear my hair. I like the choice that open-source software offers, too.


    # **Security**


    I feel open-source platforms offer better security from dangers such as attacks
    and viruses for many reasons. These reasons include publicly available code, and
    a lack of conflicting political and economic agendas.


    Here’s an example that illustrates some of these reasons. Over a year ago, Microsoft
    announced that a severe NT 4 vulnerability wouldn’t be fixed. They claimed that
    they—a company with tens of thousands of very smart people and $50 billion in
    the bank—didn’t have the resources to fix it.


    With open-source software, the code is available for all to inspect. With proprietary
    software, no one is allowed to see the source code except a few select employees.
    How can Microsoft’s claim be verified? It can’t.


    Microsoft has a vested interest in getting their customers to regularly upgrade
    their software. They don’t want their customers to use old versions of software.
    I feel it’s much more likely that they simply wanted to pressure customers who
    are still using NT 4 to upgrade to not fixing problems with NT 4. By doing so,
    Microsoft saves money in not producing a fix as well as generates money via upgrades.


    A third reason is the simple matter of ego driving quality. I have more confidence
    in the quality of open-source code itself because it’s produced by people who
    *want* to do so, not because they *have* to in order to make a living, or because
    their bosses ordered them to. Who would you rather have perform your heart surgery—a
    fellow who needs to do the operation because he needs the money to pay off a loan
    shark by Friday, or a guy who is independently wealthy, and who went through med
    school because she wanted to become a great surgeon?'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'dependent on how close the media holds their feet to the fire. It''s common
    to find severe vulnerabilities in Microsoft products that go unpatched for months.


    As of this writing in early 2004, back-to-back “critical” security holes have
    been discovered in Windows. One had been discovered late in the summer of 2003
    and yet hadn''t been acknowledged by Microsoft until February of 2004, when an
    independent security firm forced them to go public. How many more security holes
    are known by Microsoft and will never be announced because the media pressure
    hasn''t been applied?


    Open-source-software vulnerabilities, on the other hand, when they are discovered
    (and despite the availability of all of the source code, that doesn''t happen
    very often), are always fixed within days, if not hours, of their discovery. It''s
    a contest of egos to be the first one to provide the patch that fixes a problem.
    Of course, it''s still up to the admins to take it from there. Historically, Linux
    administrators have been more technically savvy, but that tilt has been gradually
    changing as Linux becomes more mainstream.


    I''ve been running Internet Information Server (IIS) and Apache Web servers side
    by side for a couple of years. When I look at the logs on the two boxes, I see
    the attacks based on Windows exploits outnumber Linux-oriented attacks by tens
    of thousands to one. Clearly crackers see more opportunity in attempting to exploit
    Windows security holes than Linux.


    Combine this with the forced upgrades of ancillary components such as browsers,
    media players, database engines, and other packages when you upgrade your productivity
    or development tool suites. You''re now forced onto yet another merry-go-round
    of patches, security fixes, and unknown vulnerabilities.


    I feel more secure with open-source software.


    # Opportunity


    Open-source software offers opportunities everywhere you look. Linux continues
    to make inroads both in the back room as a server as well as on the desktop. Netrack''s
    numbers show that Apache, an open-source Web server that runs on Windows and Linux,
    is continuing to take market share away from IIS. And penetration on the desktop—a
    place that the pundits claimed would never accept Linux—has now become “just a
    matter of time.”


    Hardly a day goes by without another conversion to open-source software by a former
    Microsoft customer. The open-source books from Hentzenwerke Publishing have done
    orders of magnitude better than any of our books on proprietary software in the
    last couple of years. And we''re just getting started.


    As Linux continues to make inroads on the desktop, people will get used to using
    their primary workstation running mostly open-source software. But they''re still
    going to need service and support, they''re going to need to customize standard
    applications, and they''re going to need custom applications for their business.
    The opportunities are only going to grow over the next few years.


    I''m interested in growth markets, and I see the markets available to open-source
    software, such as Linux, to be exceedingly bright.


    # Why not Linux? The top 10 myths


    As with any new phenomenon, folklore soon arises that often has its roots in truth,
    but has gotten twisted way out of proportion. Here are 10 common misconceptions
    about Linux.


    +   - Linux is only for servers.

    +   - Linux is only for techie.'
