  md: 'Finally, you can choose where you want to store the packages you’re downloading—important
    if your system has limited hard disk space and the default partition in /var doesn’t
    have room.


    The third tab, **Package Exceptions**, allows you to specify which packages you
    don’t want to include in a standard update operation, as shown in Figure 13.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_98_0.png)


    **Figure 13.** *The Package Exceptions tab allows you to choose which packages
    you don’t want to include in a standard update operation.*


    By default, an update will grab all packages available on the server. You may
    know about some packages in advance that you aren’t going to update regularly.
    For example, the Linux kernel is updated regularly. But many people don’t want
    to install every single update, preferring to wait for updates that affect them.
    Thus, the packages that begin with the name “kernel*” are by default part of the
    Package Exceptions group. (The asterisk denotes every package that begins with
    the six letters “kernel,” including the kernel itself, the documentation, and
    the source code.)


    You can use this feature to customize just exactly what shows up during the installation
    process, but you can also override your default choices in special cases.


    When you’re done with all your changes, just click OK.


    # Point up2date to a local mirror


    As mentioned earlier, Fedora Core up2date is configured to point to a single Web
    site for fetching updates. As a result, this site is usually overloaded, which
    results in a couple of common problems. One is an abnormally slow transfer, as
    shown in **Figure 14**.


    You’ll notice that the data transfer in this screen is 11 KB/sec, which is a little
    slow given that the receiving end is an unfettered T1 line. Another common error
    is shown in **Figure 15**, after the retrieval of a package.'
