- pgno: 36
  md: 'calculates a 128-bit text string (or "fingerprint") for that file that can
    be compared with the fingerprint of the original file on the server to ensure
    that both files are the same.


    There are two ways to do an MDSUM check. You can either check each file separately
    or check a set of files all in one step.


    To use MDSUM on a single file on a Linux machine, follow these steps:


    +   1. Go to a terminal window.

    +   2. Change to the directory that contains your ISO files.

    +   3. Run the following command:


    ```

    md5sum yarow-i386-disc1.iso

    ```


    It''ll take 10 to 30 seconds, depending on your processor.


    +   4. You will get a response of text characters. Those characters should match
    the string on the http://fedora.redhat.com/download/ page:


    ```

    yarow-i386-disc1.iso  (md5sum: 76ef2249d5186580e47efd88da765fe6b)

    yarow-i386-disc2.iso  (md5sum: fdc23fe32fafe7557f5d1f1a1d31100580)

    yarow-i386-disc3.iso  (md5sum: 6a26b34069639dc0c31465d4079a8e81b2)

    ```


    You can also find a copy of the original string in the MDSUM file that you downloaded
    along with the ISO files.


    +   5. Compare the two strings. If you don''t get the same string, your file is
    corrupt (or illegitimate) and you need to get a new one. In **Figure 1**, the
    first ISO checked out okay, because the fingerprints are the same. However, the
    second one is corrupt—the original fingerprint begins with "fd23", while the fingerprint
    that MDSUM calculated from the downloaded ISO file begins with "c8b5". Thus, the
    second ISO has to be downloaded again.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_36_0.png)


    Figure 1. Verifying the MD5 sums for the downloaded ISO files.


    To check all the files in one shot, follow these steps.


    +   2. Download the MDSUMS file.

    +   3. Open a terminal window.

    +   4. Run the following command:


    ```

    md5sum --check MDSUMS

    ```'
