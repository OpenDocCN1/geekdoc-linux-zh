  md: 'In which we, the folks who make up Hentzenwerke Publishing, describe what you,
    the reader, can expect from this book and from us.


    # Our Contract with You, the Reader


    Hi there!


    I’ve been writing professionally (in other words, eventually getting a paycheck
    for my scribbles) since 1974, and writing about software development since 1992.
    As an author, I’ve worked with a half-dozen different publishers and corresponded
    with thousands of readers over the years. As a software developer and all-around
    geek, I’ve also acquired a library of more than 100 computer and software-related
    books.


    Thus, when I donned the publisher’s cap seven years ago to produce the 1997 Developer’s
    Guide, I had some pretty good ideas of what I liked (and didn’t like) from publishers,
    what readers liked and didn’t like, and what I, as a reader, liked and didn’t
    like.


    Now, with our new titles for 2004, we’re entering our seventh season. (For those
    who are keeping track, the ’97 DevGuide was our first, albeit abbreviated, season;
    the batch of six “Essentials” for Visual FoxPro 6.0 in 1999 was our second, and,
    in keeping with the sports analogy, the books we published in 2000 through 2003
    comprised our third and subsequent seasons.)


    John Wooden, the famed UCLA basketball coach, posited that teams aren’t consistent;
    they’re always getting better—or worse. We’d like to get better...


    One of our goals for this season is to build a closer relationship with you, the
    reader. In order for us to do this, you’ve got to know what you should expect
    from us.


    +   * You have the right to expect that your order will be processed quickly and
    correctly, and that your book will be delivered to you in new condition.

    +   * You have the right to expect that the content of your book is technically
    accurate and up-to-date, that the explanations are clear, and that the layout
    is easy to read and follow without a lot of fluff or nonsense.

    +   * You have the right to expect access to source code, errata, FAQs, and other
    information that’s relevant to the book via our Web site.

    +   * You have the right to expect an electronic version of your printed book
    to be available via our Web site.

    +   * You have the right to expect that, if you report errors to us, your report
    will be responded to promptly, and that the appropriate notice will be included
    in the errata and/or FAQs for the book.


    Naturally, there are some limits that we bump up against. There are humans involved,
    and they make mistakes. A book of 500 pages contains, on average, 150,000 words
    and several megabytes of source code. It’s not possible to edit and re-edit multiple
    times to catch every last'
