- pgno: 194
  md: '# Using Evolution


    Although Evo is a multipurpose application, I’m just going to cover its basic
    e-mail functions: sending and receiving.


    Sending e-mail is simply a matter of clicking the New button, filling in the To
    and Subject fields, typing a note, and clicking the Send button. If you’ve created
    multiple accounts, you can choose which account to use by clicking the From combo,
    shown in Figure 15.


    Receiving e-mail is just as simple. Click the Send/Receive button, and messages
    queued up on the incoming mail server will be brought to the in-box. You can create
    filters to act on incoming mail and perform the actions you specify. Click Tools
    | Filters to open the Filters dialog, and then click Add to use the Add Rule dialog,
    shown in Figure 16.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_194_0.png)


    Figure 15. You can choose to send a message from multiple Evo accounts.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_194_1.png)


    Figure 16. You can create custom rules to handle incoming or outgoing e-mail.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'You''ll see that you can create a wide variety of rules that include one or
    more conditions. The conditions are evaluated against the message, and then one
    or more actions are executed if the conditions are met. In Figure 16, the incoming
    condition checks for the string “Linux ThinkPad” in the subject line; if it’s
    found, the message moves to the LTP folder.


    Sometimes it can be a pain to create a message condition from scratch; you can
    create filters based on information in the currently selected message, as shown
    in **Figure 17**.


    Right-click an individual message, select Create Rule From Message, and then select
    one of the “Filter on” menu items. If the message is from a mailing list, there
    will be a special menu item to handle it.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_195_0.png)


    Figure 17. You can create filters based on a specific message.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# **KMail**


    KMail is KDE’s default graphical e-mail client. Unlike Evolution, KMail does one
    thing—handle e-mail—and does it well.


    # **KMail setup**


    KMail has the same three-pane interface as Evolution and other graphical e-mail
    clients, but as with Evolution, it doesn’t do you much good until you set it up.
    Click Settings | Configure KMail to open the Configure dialog, shown in **Figure
    18**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_196_0.png)


    **Figure 18. Use the Configure dialog to set up preferences for using KMail.**


    The interface is similar to that of Evolution, with icons on the left that drive
    the appearance of various screens in the dialog, and a list box in the middle
    that displays the e-mail accounts. Click New to create a new account, or highlight
    an existing account and click Modify to change its attributes. The Rename button
    simply allows you to edit the value in the Identity Name column.


    The first account that you create automatically becomes the default mail account;
    once you have multiple accounts, you can make another account the default by highlighting
    it and clicking the Set as Default button on the right side of the dialog.


    The Edit Identity dialog provides tabs for basic and advanced features, as shown
    in **Figures 19 and 20**. You have to fill in values for the “Your name” and “Email
    address” fields, pursuant to the same suggestions made for Evolution in the previous
    section.


    The Advanced tab, shown in **Figure 20**, allows you to set some of the same options
    as in the various optional tabs in Evolution’s setup dialog.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'You''ll notice that there aren''t any places for incoming and outgoing server
    settings in the Edit Identity dialog. Rather, you need to select the Network icon
    on the left and then work with the items in the list box and the command buttons
    on the right as shown in Figure 21. You''ll see that you can edit common options
    under the list box. Selecting the highlighted account and clicking the Modify
    button will open the Modify Transport dialog, as shown in Figure 22.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_197_0.png)


    *Figure 19. You have to fill in a name and e-mail address on the General tab before
    sending e-mail.*


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_197_1.png)


    *Figure 20. The Advanced tab allows you to specify automatic addresses and default
    folders.*'
  merge: -1
  img_proc: true
- pgno: 198
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_198_0.png)


    **Figure 21.** The Network tab of the Configure dialog allows you to control the
    settings of the incoming and outgoing mail servers.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_198_1.png)


    **Figure 22.** The Modify Transport dialog for the incoming e-mail server.'
  merge: -1
