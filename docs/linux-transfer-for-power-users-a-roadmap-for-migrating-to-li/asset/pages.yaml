    # Red Hat Network


    Red Hat Corporation used to provide a version of Linux called Red Hat Linux that
    you could purchase in a box set (either directly from Red Hat, from an online
    distributor, or from a physical store) or download for free from the Red Hat Web
    site.


    Part of the Red Hat Linux package was a service called the Red Hat Network, which
    was available as a demo, free for a couple of months. You could then extend your
    free subscription by filling out a survey every few months. An alternative was
    to buy a subscription to the Red Hat Network. Such subscriptions started at $60
    per year.


    Red Hat Linux could be configured to connect to the Red Hat Network, download
    available updates, and install them—all automatically—without any work on the
    part of the user. The Red Hat Network used a software tool called up2date that
    I’ll discuss shortly.


    With the introduction of Fedora Core, access to the Red Hat Network is restricted
    to people who purchase Red Hat’s enterprise products. Fedora Core can be configured
    to check for available updates, but the automated update mechanisms of Red Hat
    Network (whereby the updates are automatically downloaded and installed) are not
    available to Fedora Core users. More on this in a minute.


    With this background in mind, let’s look at the specific mechanisms available
    for Fedora Core users.


    # up2date


    The first update mechanism is the Red Hat Update Agent, referred to as “up2date”
    in shorthand. up2date is also used by the Red Hat Network for its enterprise products.
    The difference between Red Hat Network’s version of up2date and Fedora Core’s
    implementation is the work that the user has to perform.


    Fedora Core still has the Red Hat Network Alert Notification Tool (as shown earlier
    in Figure 1) that appears when upgrades are available. However, in order to use
    up2date, you’ll run the up2date tool to fetch the headers for the available updates.
    These headers will be displayed in a list, from which you can then pick and choose,
    depending on which packages you want to install.


    After selecting the packages of interest, you’ll fetch the actual updates from
    the Red Hat Web site and download them to your computer. Once downloaded, up2date
    will verify that the downloaded files are good, and then attempt to install them.
    You can also manually install packages using the rpm command as mentioned earlier.


    The default configuration of up2date suffers from some performance and reliability
    issues. It attempts to connect to just one server by default, which means that
    just about every FC user on the planet is trying to get updates from the same
    server. That server can get overloaded rather easily with all of this traffic,
    and as a result connections can be very slow, and they often time out, even if
    you’ve got a fast connection on your end. The error messages and resulting'
