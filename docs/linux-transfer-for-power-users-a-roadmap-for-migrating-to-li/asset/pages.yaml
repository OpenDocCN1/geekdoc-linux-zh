- pgno: 5
  md: '# iv


    misspelling and typo, nor is it possible to test the source code on every permutation
    of development environment and operating system—and still price the book affordably.


    Once printed, bindings break, ink gets smeared, signatures get missed during binding.
    On the delivery side, Web sites go down, packages get lost in the mail.


    Nonetheless, we’ll make our best effort to correct these problems—once you let
    us know about them.


    In return, when you have a question or run into a problem, we ask that you first
    consult the errata and/or FAQs for your book on our Web site. If you don’t find
    the answer there, please e-mail us at books@hentzenwerke.com with as much information
    and detail as possible, including 1) the steps to reproduce the problem, 2) what
    happened, and 3) what you expected to happen, together with 4) any other relevant
    information.


    I’d like to stress that we need you to communicate questions and problems clearly.


    For example...


    +   Bad reports:


    “Your downloads don’t work.”


    “Your Web site is down.”


    “The code in Chapter 10 caused an error.”


    These types of complaints don’t contain enough information for us to help you.


    +   Good reports:


    “I get a 404 error when I click on the **Download Source Code** link on www.hentzenwerke.com/book/downloads.html”


    “I performed the following steps to run the source code program DisplayTest.PRG
    in Chapter 10, and I received an error that said ‘Variable m.liCounter not found.’”


    Now this is something we can help you with.


    We’ll do our best to get back to you within a couple of days, either with an answer
    or at least an acknowledgement that we’ve received your inquiry and that we’re
    working on it.


    On behalf of the authors, technical editors, copy editors, layout artists, graphical
    artists, indexers, and all the other folks who have worked to put this book in
    your hands, I’d like to thank you for purchasing this book, and I hope that it
    will prove to be a valuable addition to your technical library. Please let us
    know what you think about this book—we’re looking forward to hearing from you.


    As Groucho Marx once observed, “Outside of a dog, a book is a man’s best friend.
    Inside of a dog, it’s too dark to read.”


    Whil Hentzen

    Hentzenwerke Publishing

    April 2004'
