  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_137_0.png)


    *Figure 14. The Mouse Configuration dialog allows you to define the type of mouse
    attached to your computer.*


    As a power user, you don’t need a “This is the ON switch” guide, leading you through
    the nose on each of these applets. Their usage will be obvious as you look through
    them. Thus, I suggest that you just spend a few moments scrolling through the
    various menu options under Preferences, System Settings, and System Tools to get
