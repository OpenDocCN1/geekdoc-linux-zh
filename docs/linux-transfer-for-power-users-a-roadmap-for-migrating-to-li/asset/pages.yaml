  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_206_0.png)


    Figure 31. The Konqueror Web browser''s Settings tab.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_206_1.png)


    Figure 32. The Browser identification tab allows you to control how you identify
    yourself when visiting Web sites.'
