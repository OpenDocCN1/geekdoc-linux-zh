    Next to it is the System Monitor applet. Continuing to the right are a series
    of boxes that represent running applications. The area of the panel that contains
    all of the boxes is called the Taskbar. And finally, the far right of the panel
    is the Notification Area, where a number of icons display as appropriate. Let’s
    look at each of these in more detail.


    The Workspace Switcher (see **Figure 8**), always placed on the panel during installation,
    is a mechanism that is new to Windows users, but once you get used to it, you’ll
