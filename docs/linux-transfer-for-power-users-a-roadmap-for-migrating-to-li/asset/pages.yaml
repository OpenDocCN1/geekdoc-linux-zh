- pgno: 191
  md: 'The icons on the left serve as navigation aids to different screens in the
    dialog, much like a tabbed dialog. Clicking the Mail Accounts icon displays the
    list of accounts (shown in Figure 10), while clicking other icons displays entirely
    different screens.


    You can configure Evolution to handle more than one mail account—for example,
    if you have accounts for yourself at home and at work, Evolution can fetch mail
    from both accounts—even if the mail is handled by different servers. Another reason
    you might have multiple mail accounts is if you set up one personal account (such
    as “whil.hentzen@hentenzerwerke.com”), and another one for use when you have to
    register on a Web site (such as “whil_register@hentenzerwerke.com”). All of these
    accounts will be displayed in the list in the center of the Evolution Settings
    dialog.


    Selecting an account and then clicking the Edit button brings forward the Evolution
    Account Editor dialog, shown in Figure 11.


    You’ll need to fill in values in certain fields in three of the first four tabs
    in the Evolution Account Editor. The other three tabs have optional fields in
    them.


    The first tab, Identity, is where you fill in the e-mail address you’re going
    to use. You should also include your real name in the “Full name” field; nothing
    says “13-year-old maladjusted script kiddie” faster than a clever, computer-oriented
    nom de plume like “deathruler.” And fill in your whole name—professionals don’t
    send e-mail as “jim”; and with the amount of spam out there these days, a message
    from “jim” ends up in the auto-delete folder instantly.


    You can enter whatever value you want in the Name field because it will be the
    identification for this account in Figure 10.


    The Receiving Mail tab, as shown in Figure 12, is where you configure the mail
    server that you connect to, in order to fetch the mail that other people have
    sent you.


    As requested in Chapter 2, you should have copied down your e-mail settings so
    that you know what to put in these fields. The key fields are Server Type, Host,
    and Username.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_191_0.png)


    Figure 11. The Evolution Account Editor displays a set of six tabs for configuring
    a specific account.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_192_0.png)


    Figure 12. Use the Receiving Mail tab to configure the server for incoming mail.


    The Server Type is most likely POP unless you know you''re using an IMAP server.
    The Host can be one of two types of values. It might be an IP address as shown
    in Figure 12, or it might be a fully qualified domain name. If you''re using a
    third-party ISP, your e-mail host name might be a string like “mail.pop3.pacbell.net,”
    or something similar.


    Finally, the Username is the name with which you log on to your mail server. It''s
    not your e-mail address, but in some cases the first part of your e-mail address
    and your account name might be the same. If you''re using a third-party ISP mail
    account, it''s the account name they''ve given you. When you attempt to connect
    the first time, you''ll be prompted for the password that goes with this account
    name.


    You can skip the third tab, Receiving Options, as shown in Figure 13, but it has
    useful options for handling your mail.


    Some people like incessant interruptions during the day, and so check the “Automatically
    check for new mail every N minutes” check box. If you travel a lot and use multiple
    computers, you may also want to check the “Leave messages on server” check box.
    That way, you can download to your notebook copies of messages while you''re on
    the road and leave the originals on the mail server, and then when you get back
    to the office (or home), you can download them again, deal with the unread messages,
    and then have the client on your desktop delete them.


    Unless you''re terribly shy, you''ll probably want to send mail as well as receive
    it. Use the fourth tab, Sending Mail, as shown in Figure 14, to configure the
    server that you connect to in order to send mail.


    There are just two critical fields in this tab: Server Type and Host. Server Type
    is ordinarily going to be SMTP unless you know specifically that it''s different.
    The Host field should be filled in similarly to the Host field on the Receiving
    Mail tab. It may have different specific values, though, because some organizations
    use different e-mail servers to handle incoming and outgoing e-mail, in order
    to spread out the load.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'For example, the Receiving Mail IP address might be 192.168.2.1 and the Sending
    Mail IP address might be 192.168.2.2, or they might be “mail.pop3.pacbell.net”
    and “mail.smtp.pacbell.net”. Again, the settings from your old Windows machine
    will help you.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_193_0.png)


