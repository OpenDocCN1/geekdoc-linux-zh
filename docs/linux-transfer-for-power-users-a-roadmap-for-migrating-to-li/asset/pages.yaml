- pgno: 248
  md: 'Another option on the Session Options tab, "Automatically save changes to session,"
    saves the state of the session when you log out, without you needing to do anything.
    If this option is selected, the "Save current setup" option on the logout confirmation
    dialog isn''t displayed. The Current Session tab, shown in **Figure 21**, allows
