  img_proc: true
- pgno: 337
  md: 'If you use this method, you’ll note that both the prompt string and the title
    bar have changed. Also note that you’re now in the **root directory** (which is
    the root user’s home directory). The reason that this is different is that the
    “~” after the “su” command brings root’s environment along with it. What’s an
    environment? It’s a group of settings, such as the prompt, system variables, and
    so on, that belong to a specific user. The home directory, for example, is one
    such setting, and the command-prompt string is another. These can be different
    (and often are) for different users.


    When you use the “su” command, you’re just gaining root privileges, but you’re
    still working in the original user’s environment—with the original user’s path,
    prompt, home directory, and so on.


    When you use the “su -” command, you switch your environment to that of root,
    and that’s why you’re suddenly launched into root’s home directory. “su -” is
    short for “su -i” or “su --login”, by the way.


    # ## 6. Commands are case-sensitive


    One command is “ls” (list). Type “ls” at the command prompt, and you’ll get a
    directory listing. Type “LS” (or “lS” or “Ls”) and you’ll get a response like
    this: “bash: LS: command not found.”


    # ## 7. Move through command history


    You can scroll through command history by using the up and down arrow keys. You
    can also type “history n”, where “n” is a number to display the last “n” commands.
    Because bash stores the last 1000 commands by default, you may want to include
    a number that is fairly small (perhaps less than the number of rows in your command
    window).


    ```

    history 10

    ```


    # ## 8. String completion


    Pressing the Tab key will complete strings. As you saw in Chapter 13, you can
    use the Tab key to complete a long file name instead of typing it (and creating
    typos). To try this out if you didn’t go through Chapter 13, switch to a directory
    that contains a bunch of long file names. If you created a “zips” directory under
    your home directory in order to save zips and rpms that you’ve downloaded, your
    zips directory might look something like this:


    ```

    fp-linux-ws.rpm

    mozilla-1.606-pc-linux-gnu-1.6-installer.tar.gz

    rp9.yesenseer-1.0.4-1.i386.rpm

    rpl9.linux20.1ibc6.1386.cs2.rpm

    rv9_libc6_1386_cs2.gz

    VMware-workstation-4.0.5-6030.i386.rpm

    xams-mikmod-1.2.8-1.i386.rpm

    xmms-mp3-1.2.8-3.2.fr.i386.rpm

    ```


    Suppose you wanted to run the “rpm” command on the VMWare rpm package instead
    of doing so through a graphical file manager. According to the VMWare documentation,
    the command would look something like this:


    ```

    rpm -Uhv VMware-<xxx>.rpm

    ```'
