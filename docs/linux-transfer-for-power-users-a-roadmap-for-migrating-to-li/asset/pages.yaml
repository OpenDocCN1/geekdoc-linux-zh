- pgno: 152
  md: 'envisioning a clock with the hour and minute hands spinning around wildly,
    and indeed, I''m wondering why someone hasn''t done that. The actual definition
    of Internet time, however, references Biel Mean Time, which is a global time.
    Biel Mean Time is the same everywhere in the world, and uses the meridian in Biel,
    Switzerland, the home of Swatch, as its reference. In other words, with Biel Mean
    Time, it''s the same time everywhere in the world. No more time zones or other
    arbitrary demarcations of time differences. The day is divided into 1000 beats,
    so that 1 beat is 1 minute, 26.4 seconds. The current Internet time is shown by
    the symbol @ plus three digits, ranging from @000 to @999. Thus, a person in Switzerland,
    a person in Florida, and a person in Hawaii could all hold a conference call at
    750 Biel Mean Time, which would be 6 p.m. (local) for the first person, noon EST
    for the second, and 1 a.m. for the third.


    You can also configure whether or not to display seconds (if appropriate), the
    date, and Universal Coordinated Time (Greenwich Mean Time). You can set the date
    and time via the Adjust Date & Time menu item in the Clock applet''s context menu.
    You''ll need to log in as root in order to do so, because you''re changing system
    properties. Doing so brings forward the Date/Time Properties dialog, as shown
    in **Figure 38**.


    You have two choices: either manually set the date and time, and hope your computer
    keeps time correctly, or have your computer connect to a remote time server to
    synchronize with an atomic clock. To do this, select the **Enable Network Time
    Protocol** check box. You''ll need an Internet connection to use this option.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_152_0.png)


