- pgno: 207
  md: '# ## Summary


    One primary benefit of open-source software—and Linux in particular—is that you
    have choices. And these choices aren’t thinly masked options that are frequently
    trampled by the desired defaults of a specific manufacturer.


    Dozens of e-mail clients and Web browsers are available for Linux, and they generally
    play well with each other. Your biggest challenge will be finding the time to
    evaluate all of them, should you feel the need.


    > The purpose of this chapter is to get you started with Linux on your desktop,
    but of course there’s a lot more than what I can cover here. In addition, new
    versions of Fedora Core are released on a regular basis. I’ll keep you up to date
    by writing new articles as well as posting updates related to this book. These
    materials can be found on Hentzenwerke’s Web site, www.hentzenwerke.com. Click
    “Catalog” and navigate to the page for *Linux Transfer for Windows Power Users*.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# # Chapter 8

    ## Office and Productivity Applications


    One of the two primary reasons most people use a computer (the first was discussed
    in Chapter 7) is to create and manage documents by using "office and productivity
    applications." These apps include a word processor, a spreadsheet, perhaps presentation
    software, a note taker, and financial-management software. In this chapter, I’ll
    give you a quick tour through the most popular office and productivity applications
    available natively on your Fedora Core system.


    Everyone knows that Linux is a fine operating system for a variety of needs in
    the server room—Web servers, file servers, print servers, e-mail servers, DNS
    servers, and so on. But the experts have said for years that Linux could never
    make inroads on the desktop. The primary reason: Linux lacked applications that
    could replace common end-user tools such as the Microsoft Office productivity
    suite and Intuit’s Quicken personal-finance software.


    Well, that reason has evaporated. Microsoft Office is facing daunting competition
    from OpenOffice.org, an open-source software suite that goes head-to-head and
    often comes out ahead. GnuCash is a worthy replacement for Quicken and QuickBooks.


    While this chapter can’t possibly do justice to these and other productivity tools,
    I can introduce them to you and show you that they’re prime-time contenders and
    worthy of your attention.


    # ## Editors


    Sometimes all you want to do is write a quick little note, and you don’t want
    to fire up a full-blown word processor to do so. Or you want to work with a simple
    text file, such as a script (see Chapter 14 for more on Shell scripts) or another
    type of program, or an HTML page. Or maybe you’ve received a mysterious e-mail
    that looks like spam or a virus, but you’re not sure. You don’t want to open it
    in your e-mail client and risk activating the virus or installing spyware or cookies
    if it ends up being an HTML message. So you can save the e-mail to a file and
    open that file safely with a text editor.


    Another reason for using a simple text editor is to automatically remove unnecessary
    formatting from a chunk of text. For example, I often open an editing window as
    a temporary work area. I’ll grab a small chunk of something from another application,
    such as a word-processing file, Web page, or PDF file, so I can print it or pop
    it into an e-mail, but the data will be formatted with control codes, HTML formatting,
    or other extraneous and distracting information. That special formatting automatically
    disappears when I paste the block into a text-only editor, and then cut from the
    editor and paste it into another application’s file.


    Windows comes with two basic editors: Notepad, which is still my tool of choice,
    even though it took Microsoft nearly a decade to add the keyboard shortcut “Ctrl-S”
    to save a file; and WordPad, which has more formatting features, but also can
    mess up your data because it can apply its own formatting to files.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Linux comes with a variety of text-file editors, as shown in **Figure 1**;
    indeed, the choice of editor is one of the most popular “religious wars” the Linux
    community engages in (next to the “which distribution” and “which desktop manager”
    arguments).


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_209_0.png)


    **Figure 1. Fedoracore provides a number of potential text-file editors through
    the context menu’s Open With command.**


    Two general classes of editors come with Fedora core.


    The first class includes classic Unix-style editors, such as emacs and vi, which
    are tools that have been used by programmers for ages. These editors are incredibly
    powerful, flexible, customizable, and ... can be rather difficult to learn, because
    they don’t rely on keystroke commands common to software that Windows users are
    accustomed to, such as Ctrl-S to save a file, Ctrl-C and Ctrl-V to copy and paste
    an object, and so on. If you’re a hard-core Windows programmer or administrator
    and want to delve deeply into the traditional Linux world, you may find yourself
    inextricably drawn to one of these tools. But for the regular Windows power user,
    these editors are simply too arcane for me to recommend them, and thus I won’t
    cover them here.


    The second class includes the new graphical style of editors, much like Notepad
    and WordPad on Windows.


    My personal preference is gedit, GNOME’s graphical editor, which you can open
    by clicking Main Menu | Accessories | Text Editor, as well as from the context
    menu when right-clicking a text file.


    Although it’s a simple text editor, gedit works like a simple word processor.
    After starting up, an editing window appears, and the gedit menu above the typing
    area displays essential text-editing functions in a familiar fashion, as shown
    in **Figure 2**.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_210_0.png)


    # Figure 2. The gedit menu has common functions arranged in a familiar manner.


    Open, Save, and Print are found under the File menu; Cut, Copy, Paste, and Preferences
    show up under Edit; configuration options (such as turning the toolbar and status
    line on and off) are found under View; a variety of search mechanisms are under
    Search; and the Documents menu acts similarly to the Window menu in many other
    GUI applications.


    It has a number of basic, but useful, features that make it my tool of choice
    for day-to-day scribbling. In fact, I use gedit to quickly scratch out drafts
    of longer pieces when I don''t want to be bothered by (that''s polite talk for
    “distracted by”) all of the features of a full-blown word processor. One particularly
    useful feature is how gedit handles multiple files: Instead of opening multiple
    windows, it opens each file under a tab in the same main editing window, as shown
    in Figure 3.


    Another handy feature is the asterisk that shows up to the right of the file name
    in the tab; this happens when the file has been edited and changes haven''t been
    saved. I can never remember the last time I''ve hit Ctrl-S.


    The Tools menu I''ve a bit confusing at first, because there''s nothing there
    when you first fire up gedit. You can add items to the Tools menu by turning them
    on in the Edit | Preferences | Plugins Manager, as shown in Figure 4.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_210_1.png)


    # Figure 3. gedit opens multiple files under separate tabs in the same window.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_211_0.png)


    Figure 4. The Plugins Manager in the Preferences dialog allows you to add functionality
    to gedit.


    Once you select the appropriate plugin, functionality will be available in the
    Tools menu, as shown in Figure 5. Selecting the Document Statistics plugin adds
    a Document Statistics menu option, while selecting the Spell Checker plugin adds
    several items to the Tools menu.


    In addition, some of the plugins affect other menus. Selecting the Username and
    Insert Date/Time plugins causes new menu options to be placed in the Edit menu
    itself, as shown in Figure 6.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_211_1.png)


    Figure 5. Options in the Tools menu are displayed after you select their respective
    plugins.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_212_0.png)


    **Figure 6.** Insert options on the Edit menu are displayed after you select their
    respective plugins.


    Gedit is actually much more than a simple note-taking tool, with a number of configuration
    options that optimize it to work with formats such as Java, Latex, HTML, XML,
    and Perl, but those are beyond the purview of this book.


    You''ll note that while there are nine editors in the list of options in the Open
    With menu in Figure 1, not all of them are available via the Main Menu. If you
    want to use one of the other editors, you need to do a couple of things to make
    it available as an icon on your desktop or panel.


    First, you need to know the command to run the editor, and that may require a
    bit of spelunking. Generally, the command will be the name of the editor, such
    as "gedit" or "kate." Then you''ll have to find the location of the program itself
    (the file with that name). It''s often in /usr/bin, but if not, there are instructions
    on how to find a file in Chapter 14, "Under the Hood." Finally, you''ll just create
    an icon on your desktop or panel as described in Chapter 6, "Files, Directory
    Structures, and File Managers."


    # OpenOffice.org


    Until about two years ago, the major impediment to considering Linux as a desktop
    operating system was probably the lack of a replacement for Microsoft Office.
    With the introduction of OpenOffice.org 1.0 at that time, this hurdle was removed.


    OpenOffice.org (or "OOo," as it''s known) has quickly become the standard open-source
    office suite around the world (and I don''t just say that because we publish several
    OOO books ourselves!). It''s part of every popular Linux distribution, and has
    the backing of Sun Microsystems, which funded OOO''s predecessor, StarOffice,
    and still provides a great deal of programming support.


    The OOO suite consists of several major applications, including a word processor
    (Writer), a spreadsheet (Calc), and a presentation manager (Impress). In addition,
    OOO has a drawing package (Draw), a formula editor (Math), and an extremely powerful
    macro editor and'
  merge: -1
  img_proc: true
- pgno: 213
  md: "database-access capability. Because there are a number of excellent e-mail\
    \ clients available on various platforms, Ooo doesn't include an e-mail client\
    \ of its own.\n \nWith text editors, it'd be impossible to cover Ooo thoroughly\
    \ in just this chapter. Indeed, there are a number of books dedicated just to\
    \ Ooo. Solweig Haugland's 1040-page OpenOffice.org Resource Guide (Prentice-Hall)\
    \ is the ultimate exhaustive resource for using OpenOffice.org, while Tamar Granor's\
    \ OooSwitch: 501 Things You Wanted to Know About Switching to OpenOffice.org from\
    \ Microsoft Office (Hentzenwerke Publishing) addresses Ooo in detail from the\
    \ perspective of an experienced Office user.\n\nHowever, I can give you a brief\
    \ tour and point out some of the highlights. There are several key benefits to\
    \ using Ooo that you need to know right away.\n\nFirst, Ooo is completely cross-platform.\
    \ And that means truly cross-platform-it works on Windows, Linux, and Macintosh-like\
    \ Microsoft, which uses the term \"cross-platform\" to mean Windows ME and Windows\
    \ XP. Because Ooo is cross-platform, you can use it on a Linux machine and on\
    \ a Windows or Macintosh, and the software will read and write the same data files.\
    \ This is a great feature when you've got a variety of operating systems in your\
    \ organization, or different OSs at home and at work.\n\nThe second key feature\
    \ is just that-data files. Ooo can save files in two different formats-its own\
    \ native, openly documented file format, as well as the proprietary Microsoft\
    \ Office formats. And these file formats can be exchanged across platforms too.\
    \ This means that you have a huge amount of flexibility.\n\nFor example, you can\
    \ write a document in OpenOffice.org Writer on a Linux machine, save the file\
    \ in OpenOffice.org's .sxw file format, and someone using OpenOffice.org on a\
    \ Windows or Macintosh computer can open and edit that file. In addition, because\
    \ the .sxw file format is well documented, other applications can open and reliably\
    \ work with these documents as well.\n\nThe same applies to OpenOffice.org's other\
    \ file formats-spreadsheets (.sxc), presentations (.sxi), and drawings (.sxd).\n\
    \nOpenOffice.org can also read and write files that were saved in Microsoft's\
    \ proprietary file formats, so that OpenOffice.org users can exchange files with\
    \ people using Microsoft Office. For example, you can create a presentation in\
    \ OpenOffice.org Impress on either a Linux or Windows computer, and someone using\
    \ Microsoft PowerPoint (on a Windows computer, of course) can open and edit that\
    \ file.\n\nAt Hentzenwerke Publishing, we rely on both of these capabilities.\
    \ Authors write their original drafts using the tool and platform of their choice-either\
    \ Microsoft Word or OpenOffice.org, and either Windows or Linux. Chapters then\
    \ go back and forth through technical editing, and the tech editors use whichever\
    \ tool and platform they're most comfortable with. The same process is repeated\
    \ with copy editing and layout; most of our copy editors and layout personnel\
    \ use OpenOffice.org (on either platform), but occasionally we'll have a freelancer\
    \ who uses Microsoft Word.\n\nA third benefit to using OpenOffice.org is that\
    \ you can generate a PDF directly from a Writer document, Calc spreadsheet, or\
    \ Impress presentation. Starting with version 1.1, Ooo has an \"Export to PDF\"\
    \ button on the Function toolbar that generates PDF files. These files are good\
    \ enough that we at Hentzenwerke Publishing generate PDFs that are sent directly\
    \ to our book printer electronically, and that don't require any manual pre-press\
    \ work before printing the book."
  merge: -1
  img_proc: true
- pgno: 214
  md: 'A similar feature is the ability to export Impress presentations as Macromedia
    Flash (.swf) files, which you can then run inside a browser without having a separate
    runtime engine of any sort (except the Flash player plugin).


    With these items in mind, let’s take a quick tour of OpenOffice.org.


    # Installation


    OpenOffice.org is installed by default with a desktop installation of Fedora Core.
    If you neglected to install it for some reason, use the Add/Remove Applications
    menu item under System Settings. Once it’s installed, menu items for each of the
    OpenOffice.org tools will be available under Main Menu | Office, as shown in Figure
    7.


    Icons for each of the OoO applications are also available in the panel; I’ve removed
    all of them except for Writer, because I don’t use the others that much, and the
    real estate on my panel is valuable.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_214_0.png)


    > Figure 7. The Office menu displays all of the OpenOffice.org tools by default.


    # Configuration and options


    As soon as you start creating documents, you’re going to want to perform operations—and
    some of these can be configured to your liking. So before I talk about working
    with documents, let’s spend a moment setting up OoO so that it behaves the way
    you want.


    There are two places to bend OoO’s behavior to your will—one is under Tools |
    Options, where you can control how OoO functions. And it’s here that we’ll spend
    our time first.


    As soon as you create a document, you’re going to want to save it. The default
    save path for OpenOffice.org documents is your home directory (for example, /home/whil
    on my machine).'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'If you’re on a network, you might want to change this path to a network drive.
    Regardless of whether you keep your save path intact, you’ll probably want to
    change a number of other settings immediately. Here are the ones I change every
    time I install OOO on a new machine.


    First, and this is really important, you’ll want to set the default file format
    in which you’ll save new documents. During installation, OpenOffice.org asks you
    which file format (OpenOffice.org or Microsoft Office) should be default, but
    based on the questions on the OpenOffice.org mailing lists, a lot of people skip
    by that choice, only to be puzzled by OOO’s behavior later.


    In the Options dialog, select the Load/Save node and the General subnode, as shown
    in **Figure 8**.


    Direct your attention to the “standard file format” controls at the bottom of
    the General page. You need to specify the default file format for each document
    type—it’s not an all-or-nothing type of choice. Select “Text document” in the
    list and then choose which type of file format to save new text documents in,
    using the “Always save as” box. Be sure to read the choices in this box carefully,
    because some of them look similar, such as “OpenOffice.org Text Document” and
    “OpenOffice.org Text Document Template.”


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_215_0.png)


    Once you’ve chosen the default file format for text documents, highlight the next
    item in the “Document type” list, change its file format in the “Always save as”
    box, and continue on for the rest of the document types.


    If you choose to save files originally created in Microsoft Office in OpenOffice.org,
    but using a Microsoft Office file format, you may get a warning the first time
    you actually perform a save. This warning alerts you to the possibility that some
    formatting may be lost. This warning appears because the Microsoft Office format
    is proprietary, and so the OpenOffice.org developers have had to reverse-engineer
    the file formats in order to create Microsoft Office-compatible files. As a practical
    matter, you can ignore the warning; it’s there “just in case,” to'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'warn you about the one-in-a-thousand situation, rather because you should worry.
    In practice, I’ve found that Microsoft Office–formatted files are more compatible
    with OpenOffice.org than they are with other versions of Microsoft Office!


    If you are going to be using the revision-tracking feature of OpenOffice.org (found
    under Edit | Changes), you might want to set some preferences under the OpenOffice.org
    node, User Data subnode. If you don’t at least enter your name and initials, your
    changes will appear to other users to have been made by Unknown User, which may
    or may not be what you intended.


    Also under the OpenOffice.org node is the Paths subnode. In this screen you can
    define where OOO looks for files. You may want to tweak some of these paths depending
    on your particular needs. I already discussed the default save path—the My Documents
    type. If you use your own document templates, you may not want to store them in
    the default location of `/usr/lib/openoffice/share/template/english`. I don’t,
    because it’s a bad idea to keep your own data buried in the bowels of program
    directories. I keep all my own templates in a directory on the file server where
    everyone can access them, and where I can easily back them up.


    There are already some templates in the default directory, supplied by the OOO
    installation. You don’t necessarily want to lose access to those; conveniently,
    you can add your own template path to the existing path. Select the Templates
    type from the list, click Edit to display the Select Paths dialog, and then click
    Add. Use the file drill-down box to select the folder you want to add to the path.
    See Figure 9.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_216_0.png)


    **Figure 9.** You can add your own template directory to the template path.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'I tend not to mess with the rest of the options because they’re generally set
    to the way I work. You should scan through them to see if there are specific settings
    that you want to change to your preferences.


    # Configure


    The other mechanism you can use to configure Ooo is located under Tools | Configure.
    Here you can customize the appearance of the Ooo screen interface and how the
    keyboard works. You can determine what toolbars are visible, what buttons they
    have on them, what keyboard shortcuts do what, and even customize the existing
    menus and create your own menus.


    Again, I try not to spend too much time customizing, because that fine-tuning
    becomes an impediment if I have to work on someone else’s machine. There are only
    two changes I make. The first is to modify the Function toolbar (it’s the one
    with the icons for New, Save, Print, and so on—you know, commonly used functions)
    at the top of the OpenOffice.org desktop. I add buttons for Document Properties
    and Insert Graphics because when I’m writing, I use those functions a lot. I also
    change the mapping of a couple of keyboard shortcuts to represent operations I
    do a lot.


    To add a button to the Function toolbar, select Tools | Configure (or right-click
    anywhere on a toolbar and select Configure). Select the Toolbars tab of the Configuration
    dialog, highlight the Function Bar item, and click the Customize button on the
    right to open the Customize Toolbars dialog. Scroll down through the “Available
    buttons” list on the left to the Insert node, and then highlight Insert Graphics
    as shown in **Figure 10**.


    Note that you can also remove a button from a toolbar in two ways. The first is
    to simply uncheck the check box. The button will stay in the list but won’t appear
    under the toolbar. This technique is handy for temporarily hiding a button. If
    you’re darn sure you don’t want the button again, you can highlight the button
    label in the “Buttons in use” list and then click the Remove button. (You can
    get it back by adding it from scratch, as I described earlier when discussing
    the Insert Graphics button.)


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_217_0.png)


    **Figure 10.** Adding a button to a toolbar.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'I use the Edit | Repeat command a lot, but I don’t like using the keyboard
    or mouse to do it. I’d rather just hit a function key. So I reassigned F12 to
    execute the Edit | Repeat command. The interface for reassigning keys is a little
    awkward. In order to modify a keyboard shortcut like this, open the Configuration
    dialog via the Tools | Configure menu option, and then select the Keyboard tab.


    Next, in the “Shortcut keys” list, highlight the key you want to assign to a command.
    On the right side of the list, you may see a command already assigned to the key.
    Use the Functions area in the bottom half of the Keyboard tab to select the command
    you want to assign. First, select a category from the Category list (in this example,
    that would be Edit). The choices that appear in the Function list change according
    to which category you select. Then select a function (in this example, that would
    be Repeat). The Configuration dialog looks like Figure 11 at this point.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_218_0.png)


    **Figure 11. Assigning the Edit | Repeat command to the F12 key.**


    Finally, click the Modify button, and you’ll see two things. First, the key you
    selected (in this example, F12) will appear in the Keys list. Second, the F12
    key will have a command associated with it in the “Shortcut keys” list in the
    top half of the Keyboard tab. See Figure 12.


    You can perform similar modifications to the menu and to the status bar by using
    other tabs in the Configuration dialog.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_219_0.png)


    *Figure 12. The newly assigned F12 key now will execute the Edit | Repeat command.*


    # The OpenOffice.org interface


    The OpenOffice.org interface looks pretty much like any other graphical office
    suite, with a menu and one or more toolbars above the work area, whether that
    space is a writing area, a grid of spreadsheet cells, or a presentation or drawing
    canvas.


    OpenOffice.org features an additional toolbar, called Main, which resides to the
    left of the work area. Its specific functions vary according to which kind of
    application you’re working in. In Calc, the icons in the Main toolbar provide
    one-click access to functions such as Insert, Insert Cells, Insert Object, Spell
    Check, Find, Filter, and Sort. In Writer, however, the icons represent different
    functions, such as Insert Table, Insert Auto Text, Spell Check, Find, Show Nonprinting
    Characters, Show Graphics, and Show Online Layout.


    Some menu items are disabled depending on which functions are selected in the
    various toolbars. For example, if you have selected Show Online Layout, your document
    will appear as one long document without page breaks—as if you were typing on
    a roll of towels. In this mode, you can’t do a print preview.


    While there seems to be a zillion (plus or minus a couple) icons, menu options,
    functions, and other goodies in the OpenOffice.org suite, implementations of two
    specific functions bear special mention.


    The last two icons in the standard Function bar are the Navigator (a spiral-shaped
    star) and the Stylist (a finger pushing up one of two buttons). I’ll cover the
    Stylist first because one of its features is used with the Navigator.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# The Stylist


    If you''re not familiar with styles and templates, a brief sojourn is in order,
    and will be well

    worth your while. A paragraph style is a collection of formatting attributes that
    are given a

    single, specific name. For example, you could create a custom look for a paragraph
    that

    specified a 28-point font, bold, and left-aligned. Instead of manually applying
    those attributes

    to each paragraph that you wanted to look like that, you just apply the style
    to a paragraph,

    and voilà! The paragraph now has all those attributes. Even better, should you
    decide that all of

    those paragraphs should really be 30 points instead of 28, you only have to change
    the style,

    and the paragraphs themselves will automatically inherit the new attributes. The
    name of each

    chapter in this book has a style called "chaptitle" that has those attributes.


    You can create a special type of document called a template that contains a group
    of styles

    —for example, the template used for this book has styles for various levels of
    headings,

    paragraphs that directly follow a heading, body paragraphs, figure captions, and
    so on. Using a

    template makes it a lot easier to create a long document (or multiple documents)
    because you

    can simply apply a style to a paragraph and you know it will be consistent with
    all of the other

    paragraphs formatted with the same style.


    The Stylist is a tool that helps you use styles (either native OpenOffice.org
    styles or your

    own) in your documents. Clicking the Stylist button (or selecting Format | Stylist,
    or pressing

    F11) displays a list, as shown in **Figure 13**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_220_0.png)


    **Figure 13.** The OpenOffice.org Stylist displays a list of available styles.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'The first time you look at the Stylist, you might think it has an unusual interface.
    It displays the styles native to OpenOffice.org in a collection called “Automatic”
    in the list box that makes up the majority of the window. At the bottom of the
    window is a drop-down box that contains a list of all style collections, including
    one called “Custom Styles.”


    If you have applied a template (which works much like a Microsoft Office template)
    to the document, the Custom Styles collection lists all of the styles in that
    template. You can use the drop-down box to switch to the Custom Styles collection
    and see all of those styles. Then you can select a paragraph in the document and
    apply a custom style to it by double-clicking the style name, as shown in Figure
    14.


    Once a style is applied to a paragraph in the document, the style name shows up
    in the Apply Style box at the far left of the Object toolbar. In Figure 14, “chaptertitle”
    is the name of the style applied to the “Chapter 7” paragraph in the document.


    The Applied Styles collection shown in Figure 13 is a handy reminder—it shows
    you just the styles that are being used in the current document. These styles
    are also the only ones that appear in the Apply Style box in the Object toolbar,
    by the way.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_221_0.png)


    **Figure 14. You can apply a specific style to a paragraph by using the Stylist.**'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# The Navigator


    Now on to the Navigator, possibly my favorite writing aid in OpenOffice.org. Clicking
    the Navigator button (or selecting Edit | Navigator, or pressing F5) displays
    a dialog as shown in Figure 15.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_222_0.png)


    *Figure 15. The OpenOffice.org Navigator displays an outline of a variety of objects
    in a document.*


    The Navigator is a separate window that displays an outline of a variety of objects
    in a document. For example, every image inserted into a document is listed under
    the Graphics node, while each URL is listed under the Hyperlinks node. Of particular
    usefulness to me is the Headings node. Each object marked with a heading style
    (as identified in the Outline Numbering dialog) will be displayed in an indented
    outline format under the Headings node.


    This can be a bit tricky to implement, so let me explain a bit further. An OpenOffice.org
    document can have up to 10 levels of numbering, and you can assign a particular
    style to a level of numbering. By default, an OpenOffice.org document uses its
    own styles for headings, “Heading 1” through “Heading 10,” and these headings
    are also assigned to a level in the Outline Numbering dialog. Thus, assigning
    one of these styles to an object (typically a paragraph heading) can cause that
    object to be displayed and indented to the appropriate level in the Navigator.
    The document in *Figure 16* uses several native OpenOffice.org styles.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_223_0.png)


    **Figure 16.** *The Navigator shows paragraphs assigned to an outline numbering
    level in an indented fashion.*


    The heading “Paragraph 1 Heading” uses the “Heading 1” style, as you can see in
    the Apply Style box at the far left of the Object toolbar. The heading “Subparagraph
    2 Heading” uses the “Heading 2” style. In the Navigator, then, you can see “Paragraph
    1 Heading” is not indented under the Headings node, while “Subparagraph 2 Heading”
    is indented one level.


    You may want to use your own styles instead of relying just on the native OpenOffice.org
    styles. You assign these styles to outline numbering levels in the Outline Numbering
    dialog (select Tools | Outline Numbering) as shown in Figure 17.


    Clicking a number in the Level list on the left side of the dialog displays the
    attributes assigned to that level. In Figure 17, Level 1 is assigned to Paragraph
    Style "_subhead 1", the style we use for major headings in our chapters. You can
    see that we assign styles "_subhead 2" through "_subhead 4" to levels 2 through
    4 in the list on the right side of the dialog.


    The result is that you can see an outline of your document right via the indented
    headings under the Headings node in the Navigator. This is much like the Outliner
    tool in Microsoft Word, although as I’ve used it, I’ve decided it’s actually more
    flexible than Word.


    In addition to seeing the big picture of your document, you can actually move
    to a spot in your document simply by double-clicking the desired item in the Navigator.
    This works not only for items under the Headings node, but for items under any
    node—graphics, URLs, bookmarks, and so on. Very handy.


    You can control how many levels of outline are displayed by right-clicking in
    the Navigator and selecting Outline Level, and then choosing how many levels you
    want to view, as shown in Figure 18.


    There is much more to the Navigator than I’ve covered in this short discussion,
    but I hope I’ve whetted your appetite enough to prod you to explore further on
    your own.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_224_0.png)


    **Figure 17.** Use the *Outline Numbering* dialog to map outline numbering levels
    to specific paragraph styles.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_224_1.png)


    **Figure 18.** You can choose how many levels of headings to display in the Navigator.'
  merge: -1
