- pgno: 114
  md: '# ## Chapter 4 Getting Help


    Maybe someday in the future we’ll have honest-to-goodness self-healing computers
    that can fix themselves. Until then, we humans will have to get involved when
    problems occur. As the master of your computer, that job falls on your shoulders,
    and, generally, you’re not going to be able to do it yourself. Fedora Core provides
    several mechanisms for getting help: online help files, Web sites, and the mailing
    lists and associated archives. Taking advantage of these resources can be daunting
    for a Windows user who is not used to having a set of community resources to rely
    on. In this chapter, using live examples, I discuss how to use these resources
    when you run into a problem.


    Back in the ‘60s, there were two kinds of folks who drove cars: those who could
    perform some minor maintenance on their own set of wheels, and those who stood
    by the side of the road helplessly, waiting for someone else to change a flat
    tire or put water in the radiator.


    You’re a power user. You aren’t going to idly sit by the first time you run into
    trouble, saying, “Oh my! Helpless me!” You’re going to dig in and fix the damn
    thing yourself. But in order to do so, you need to know where to look for a helping
    hand.


    There are two basic sources of help: static files such as online help, FAQs, Web
    sites and the like, and interactive forums and mailing lists.


    # ### Static help


    Software’s Achilles’ heel has long been documentation, and open-source projects
    are no different. Fortunately, there’s a cadre of open-source volunteers whose
    mission is supporting and enhancing the documentation through additional resources.
    There are several sources for static help files, beginning with the documentation
    that is installed with the product and ending with the endless multitude of sites
    on the Web.


    # ### Online help


    It may surprise you, but Fedora Core comes with a series of online documents for
    various components of the GNOME interface. Unfortunately, the help files are uneven,
    incomplete, and generally not comprehensively useful. Of course, it may also surprise
    you that Windows has a similar feature, for the little good that their help does
    one, either.


    I hate to jam on help files, because the folks who wrote them spent a lot of time
    at a difficult and thankless job that is often last on anyone’s list of Important
    Things To Do. Still, being blunt in this respect is important, so that you don’t
    develop unrealistic expectations.


    You can access the GNOME help by clicking the Red Hat button in the panel and
    selecting Help. Doing so will bring forward the main help screen, as shown in
    Figure 1.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_115_0.png)


    Figure 1. The opening screen in Fedora Core''s help system.


    Notice how the help is organized by things—which is helpful if you want to reference
    a specific widget in an interface—not by tasks. Users usually look things up based
    on the tasks they''re trying to accomplish, and just once in a while when trying
    to figure out what a specific object on the screen is.


    You can drill down into specific subject areas, but the help files available in
    each area are irregularly populated. In addition, even if you''ve installed KDE-specific
    files, the help files are unfortunately just provided for GNOME components. You
    will have to switch to the KDE desktop in order to access KDE help.


    Drilling down into, say, Applications, as shown in Figure 2, provides two sets
    of links: one for Categories and another for Documents—help files specific to
    individual applications. For example, the complete user guides for Evolution and
    Balsa (a pair of mail clients) are provided here. However, if you drill down into
    the Office category, there''s only one link, for the Gnumeric spreadsheet application.
    Help for OpenOffice.org and KOffice are not available. (You have to load those
    applications in order to get to the help.)


    The biggest stumbling block with the Fedora Core Help menu option is that the
    help only focuses on the GNOME interface. Issues dealing with the operating system
    itself are not available at all.


    With earlier versions of Red Hat Linux, you could install the documentation files
    separately. That functionality hasn''t yet been completed in this first release
    of FC. An installation guide is planned for a future release.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_116_0.png)


    Figure 2. Drilling down into the Applications section of Fedora Core’s help system.


    There is also a set of release notes available for FC 1 at http://fedora.redhat.com/docs/.
    If you’re interested, consider joining the Fedora documentation project and contributing
    to the community. A lot of people who don’t write code find that writing documentation
    is one way of giving back to the community. Users like yourself can point out
    (and contribute to!) sections that they wish they’d been able to find.


    # The Linux Documentation Project


    The Linux Documentation Project (also known as TLDP) was started in the mid-’90s
    when a number of folks in the Linux community realized that the lack of good documentation
    was a serious hindrance to the increased acceptance of Linux.


    The contributors at TLDP (well into the hundreds) have produced a huge amount
    of material over the years, and more is still being added on a regular basis.
    Visit them at http://www.tldp.org/ and be prepared to spend some time looking
    through the riches available. As a new power user, you may find that some of the
    help files are beyond you. Some authors assume a moderate level of Linux familiarity,
    and will say things like “then you can grep for the string in question.” Because
    you’re a new Linux user, that won’t be helpful now, but don’t be dismayed—you’ll
    be surprised at how quickly some of what seems to be Greek becomes understandable
    in short order.


    # Fedora Core Web sites


    There are a huge number of Linux-oriented Web sites. Simply doing a search via
    Google or another search engine will often generate more hits than you can process
    in a practical manner. Indeed, searching on “Linux tutorials” generated nearly
    3 million hits. Because Fedora Core is'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'a popular Linux distribution and adheres to standard Linux practices in most
    places, you don’t have to limit your searches to Fedora Core.


    A number of popular Linux Web sites have tutorials and HOWTOS of various sorts.
    Here is a sampling of some sites that contain lots of additional information:


    +   * http://www.linuxgazette.com/

    +   * http://www.linux-tutorial.info/

    +   * http://www.linux.org/

    +   * http://www.linuxplanet.com/

    +   * http://www.linuxbeginner.org/


    If you’re searching the Web, careful consideration of keywords will help a lot.
    Vague, generic keywords like “Linux” and “GNOME problems” will generate huge numbers
    of hits. If you can provide specific text that may be unique to the situation
    you’re working on, you have a much better chance of finding a smaller number of
    hits that are directly related to the problem you’re trying to solve.


    For example, suppose you’ve received a specific error, such as “device driver
    conflict: no dma available” in response to an operation you’re trying. If you
    search on “Linux device driver problem,” you’ll get oodles of hits. If you search
    on the exact error message—using quotes around the message text—you’re much more
    likely to find hits that are applicable, because they’ll have at least something
    to do with that exact error message. Of course, you may end up with a bunch of
    posts from other mailing lists or electronic forums that are all asking the same
    question (to which no one has received an answer), but more likely, you’ll also
    find the associated answer, or at least suggestions on dealing with it.


    Another great site that is getting more and more traffic is the Unofficial FAQ
    (Frequently Asked Questions) site at http://fedora.artoo.net/faq/.


    # Interactive help


    Static help goes only so far, and often it doesn’t go far enough. There’s really
    no substitute for being able to ask a question of another human being. A number
    of electronic forums and mailing lists are dedicated to Linux, including the Fedora
    Core project’s own mailing lists and associated archives.


    In this section, I’ll discuss how to make best use of the mailing list and archives
    for Fedora Core.


    # Mailing lists


    Fedora Core’s “official” mailing lists are hosted on the Red Hat Web site at http://www.redhat.com/mailman/listinfo/.
    Several dozen public mailing lists are available, as shown in Figure 3.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_118_0.png)


    **Figure 3.** *A partial list of public mailing lists supported by Red Hat.*


    The current lists devoted specifically to Fedora Core include (but are not limited
    to):


    +   * fedora-announce-list: Announcements related to the Fedora Project

    +   * Fedora-config-list: Discussions about configuration tools for Fedora

    +   * Fedora-de-list: Fedora discussions in German

    +   * Fedora-desktop-list: Discussions about development for the Fedora desktop

    +   * fedora-devel-list: Development discussions related to Fedora Core

    +   * fedora-docs-list: For participants of the docs project

    +   * Fedora-legacy-list: Discussion of the Fedora Legacy Project

    +   * fedora-list: For users of Fedora Core releases

    +   * Fedora-test-list: For testers of Fedora Core development releases

    +   * Fedora-trans-list: Fedora Translation Project List'
