  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_289_0.png)


    # XMS


    Ever been in a situation where you had to choose which of two pretty girls to
    ask out? (Or been asked out by two hunky guys for the same night?) Well, I never
    have, but I’ve heard it’s happened to others. And I can imagine what it’s like,
    because having to choose between Rhythmbox and XMMS is probably similar.


    I’ve used XMMS ever since I put Linux on a desktop machine, but recently started
    using Rhythmbox because of its radio-station capabilities. Still, like that first
    girlfriend, I keep coming back to XMMS.


    XMMS has three primary windows in the interface. The Main window contains the
    controls for the player, the Playlist Editor window displays track names and times,
    and the Equalizer window provides the controls similar to a stereo equalizer (and
    eye candy for those attracted to bright and shiny things). Figure 15 shows all
    three windows. The Main window is on the upper left, the Equalizer is under the
    main window, and the Playlist Editor occupies the entire right side.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_289_1.png)


    The Main window consists of several sections, much like the Rhythmbox interface.
    The upper left displays the time the current track has played, as well as a nifty
    little visualization of the sounds themselves. To the right is information about
    the track being played, including the artist name, track name and total track
    time, and the sampling rate (how many bits per second'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'the track is playing back at). Under the title window are, from left to right,
    the volume and speaker slider controls, and buttons that display or hide the Equalizer
    and Playlist Editor windows. If you’ve used WinAmp, you’ll find a lot of similarities.


    The long slider that spans the entire width of the window displays how much of
    the track has played. And the VCR controls under the slider allow you to go to
    the previous song, play, pause, stop, and go to the next song. The RAND button
    will mix up the order in which the tracks in the Playlist window are played, and
    the REP button will repeat playback when the end of the playlist is reached.


    The five letters to the left of the time display don’t seem to spell anything
    or form a recognizable acronym. Instead, they each provide functionality that
    would usually be represented by a button.


    Clicking the O displays the Options menu, which I’ll get to in a moment.


    Clicking the A toggles “Always on top” functionality for the windows. If the A
    is highlighted, the windows will always display on top of all other windows, even
    if one of those other windows has focus.


    Clicking the I will show the File Info box for the current track, as in Figure
    16.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_290_0.png)


    # **Figure 16. The File Info dialog in XMMS.**


    The D acts as another toggle, this time for the size of the windows. Figure 16
    shows all windows as “double-sized”; this toggle reduces the size of the window
    if you’ve got good eyes or a big monitor.


    Finally, clicking the V will display the Visualizations menu, which I’ll also
    discuss in a moment.


    You can also open the XMMS main menu by clicking the upper left corner of the
    window or right-clicking most anywhere else in the main window. The main menu,
    as well as my complete lack of taste in music, is shown in Figure 17.'
