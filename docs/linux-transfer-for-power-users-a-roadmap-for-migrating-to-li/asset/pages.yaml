- pgno: 128
  md: '# ## Chapter 5


    # ## Configuring Your Desktop


    So you’ve installed Fedora Core, you’ve logged in, and you’re facing a GUI desktop.
    What next? You’ve got two choices. Either leave it alone and just learn how to
    use what’s in front of you, or customize it—make it bend to your will. Hey, I
    know! Let’s do both! In this chapter, I’ll explain how to use the desktop "out
    of the box," and then I’ll show you how to customize it by showing you how I customize
    my own desktop.


    As mentioned in earlier chapters, what people refer to as "Linux" is actually
    multiple components that work together.


    At the heart of all the software on your computer is the Linux kernel—the software
    that provides the core services that comprise an operating system.


    You can work with the services that the kernel provides in a couple of ways. One
    way is through a terminal window and a set of text commands to manipulate the
    machine, much like old-time PC users used DOS to do their work.


    But many people don’t want to do that. They prefer a graphical user interface
    on top of the kernel, so they don’t have to remember commands or long strings
    of fussy parameters—indeed, so they don’t even have to know how to type!


    With Windows, the operating system and the GUI on top of that are bound together
    so tightly that it’s virtually impossible to run the OS without the GUI anymore.
    Furthermore, with Windows, you don’t have a choice of GUIs. This is not the case
    with Linux.


    The X Window System (commonly known simply as "X") is a piece of software that
    runs on top of the Linux kernel and provides windowing capabilities. X has been
    through a number of versions, with version 11 finally gaining critical mass and
    developing widespread acceptance. This version is known as "X11." You may have
    already seen references to it. X11 has been through a number of upgrades, each
    of which has attempted to maintain backward compatibility. The current release
    number is 6, so you may also see references to "X11R6." The first time you saw
    that string—X11R6—it probably seemed obscure to the point of distraction, but
    now it’s not so bad, is it?


    X is a foundation upon which people can create software applications that take
    advantage of those windowing capabilities. One particular breed of applications
    is known as "window managers"—and a number of people and groups have created them.
    As a result, there isn’t just one GUI available for Linux; there may be many—about
    a dozen, all told. Names of popular window managers that you might have heard
    of include Enlightenment, Metacity, Fawish, and WindowMaker. But these are just
    window drawing packages—they handle how windows are drawn and how they appear,
    how they interact with each other, and so on. Everything that appears on the screen
    shows up in a window, and the window manager simply provides the engine to control
    the windows.


    But there’s more to a desktop than just windows. As you’ve already seen, there’s
    a menu system and a panel, to name a couple of obvious items. And there are tools
    that provide a GUI interface to the operating system (not just end-user applications).
    The rise in the number of window managers has brought forth a "super-class" of
    tools called desktop environments. These provide a complete interface to the operating
    system, including menus, panels, utilities and applications, and all sorts of
    other fun stuff. The two most popular desktops'
  merge: -1
