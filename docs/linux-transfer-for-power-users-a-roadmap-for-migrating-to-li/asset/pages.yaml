  md: '# Document your hardware


    If you are installing Linux on a machine that already has another operating system
    installed on it, it''s a good idea to do one thing before you start the Linux
    installation itself. You''ll want to document your existing hardware settings,
    in the unlikely case you have a piece of equipment—such as an oddball video card
    or some sort of device with an old chipset—that Fedora Core doesn''t immediately
    recognize.


    The location of these settings varies according to the operating system. On Windows
    2000, select Start \ Control Panel \ System applet \ Hardware tab \ Device Manager
    button \ View menu \ Print menu \ All devices and system summary. You''ll get
    an exhaustively detailed list of the hardware on your computer.


    You''ll also want to write down your network settings if you''re connected to
    a network and/or the Internet. On Windows 2000, select Start \ Settings \ Network
    and Dial-up Connections. Right-click the Local Area Connection icon and select
    Properties \ General tab \ Internet Protocol (TCP/IP), and then click the Properties
    button. Write down all of the settings and numbers.


    If the option button "Obtain an IP address automatically" is selected, it means
    your computer is getting IP information via DHCP.


    # Prepare for Installation


    Step 1. Stick the first CD in and boot the box. Feedback from the boot process
    will appear, as shown in Figure 8. Then the install screen will appear, as shown
    in Figure 9.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_43_0.png)


    Figure 8. Feedback from the boot process with Fedora Core CD 1 in the disk drive.'
