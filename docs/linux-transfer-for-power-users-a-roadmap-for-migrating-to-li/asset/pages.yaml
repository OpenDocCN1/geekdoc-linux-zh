- pgno: 31
  md: 'Gentoo is similar to Debian in that it is a community-supported distro without
    commercial ties, but with a strong fan base, and you can download or buy CDs.
    It has more sophisticated tools for installing and maintaining, but still requires
    more technical sophistication than the big four, and as a result, I can''t recommend
    it for a first-time user. Again, once you''re comfortable with some Linux basics,
    you may well want to consider it. Find out more at **www.gentoo.org**.


    # ## Why I chose Fedora Core


    My criteria for choosing a distribution were (1) ease of use, (2) free distribution,
    and (3) stability of the provider.


    At the time I started this book, I felt that Fedora Core and Mandrake were neck-and-neck
    in terms of ease of use, but Mandrake was having some financial troubles. SuSE
    had just been purchased by Novell, but after a half dozen installs, I just didn''t
    cotton to its user interface. And Debian and Gentoo, while having technical merits
    that make them outstanding candidates for advanced users, aren''t ready for first-time
    Linux users.


    That said, I think SuSE and Mandrake are worthy of your consideration. The concepts
    covered in this book are the same, but some of the implementation details differ.
    I''ve included occasional notes on both of these distributions as part of the
    electronic downloads. (See "How to Download the Files" in the front of the book
    for details.) I''ll also post updates on the Hentzenwerke Web site.


    Remember, you are a power user. You''re going to love Linux. Linux rocks!


    > The purpose of this chapter is to get you started with Linux on your desktop,
    but of course there''s a lot more than what I can cover here. In addition, new
    versions of Fedora Core are released on a regular basis. I''ll keep you up to
    date by writing new articles as well as posting updates related to this book.
    These materials can be found on Hentzenwerke''s Web site, www.hentzenwerke.com.
    Click "Catalog" and navigate to the page for *Linux Transfer for Windows Power
    Users*.'
