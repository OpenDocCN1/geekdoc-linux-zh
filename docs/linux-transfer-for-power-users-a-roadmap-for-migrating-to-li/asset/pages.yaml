- pgno: 70
  md: 'As startup continues, the thermometer bar at the top of the screen will make
    its way to the right, and prompts will begin to appear, as shown in Figure 51.
    As each step passes, the installation process displays a green “OK” response.
    If a startup operation fails, a corresponding red “FAILED” response will appear,
    as shown in Figure 52. (Note that it’s not uncommon for a “FAILED” message to
    show up. Don’t get all bothered about it; once in a while a program or service
    will get installed that fails during boot but doesn’t affect the running of the
    system.)


    Unless a catastrophic error occurs (in which case you’d examine the install.log
    file in the root directory for more information), the Welcome screen appears,
    as shown in Figure 53.


    # Welcome


    The Welcome screen is similar to the installation wizard, except that the remaining
    steps are listed on the left side and all explanatory text is contained on the
    right.


    Step 1. Click Next to move to the License Agreement screen, as shown in Figure
    54.


    # License Agreement


    The License Agreement screen, although it looks like lots of other license screens,
    simply serves to confirm that Fedora Core is developed under the GPL, and to explain
    Red Hat’s role in the process. You’ll have to accept the agreement to continue,
    but you’re not signing your life away like you do with proprietary software license
    agreements.


    Step 2. Click Next to move to the Date and Time screen, as shown in Figure 55.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_70_0.png)


    **Figure 51.** Character-based prompts will start to appear below the thermometer
    bar.'
