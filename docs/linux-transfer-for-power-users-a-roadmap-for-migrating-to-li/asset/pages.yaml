    additional properties. This is an advanced tab and you probably don''t want to
    mess with it while you''re getting started.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_248_0.png)


    The Startup Programs tab, shown in **Figure 22**, allows you to list what programs
    are started up automatically. Figure 22 shows what the list looks like after The
    GIMP has been added. The one downside of this dialog is that you aren''t given
    a friendly navigation tree through the Main Menu, as with other tools. Instead,
    you have to know the name of the program you want to add, and then navigate to
    its location (probably in /usr/bin.)


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_248_1.png)'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# System Tools applets


    The Preferences menu isn’t the only place where Fedora Core keeps its goodies.
    The System Tools menu has several as well.


    The Hardware Browser allows you to look through the hardware on your system. To
    do so, select Main Menu | System Tools | Hardware Browser. You’ll be asked for
    the root password, and then the Hardware Browser dialog will appear with a list
    of hardware and drivers. Some screens have additional information. The Hard Drives
    screen also shows you the amount of disk space used, as shown in Figure 23.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_249_0.png)


    When posting a query for help on various electronic forums and lists, one frequent
    suggestion is to “check the logs.” So where are these “logs” and how does one
    “check” them? The System Logs viewer, accessible via Main Menu | System Tools
    | System Logs (you’ll need to enter the root password) provides access to logs
    that are created by various applications on your system, as shown in Figure 24.


    The System Logs viewer shows only the logs that exist on your system; if your
    system doesn’t have the same applications as mine, the logs available on your
    system may vary.


    You can set your own preferences for the log files through the Edit | Preferences
    menu option in the System Logs viewer. The Log Files tab, as shown in Figure 25,
    allows you to point the System Logs viewer to a specific path and file name for
    each log. Suppose you have another application that generates log files. You can
    add those to the System Logs viewer by clicking the Add button in the Log Files
    tab of the Preferences dialog.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_250_0.png)


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_250_1.png)


    When a log file becomes large, it can be easy to miss a line that points out a
    specific alert or warning. The Alerts and Warnings tabs of the Preferences dialog
    allow you to specify an icon beside log file lines that contain words or phrases
    of your choice. Thus, a line in a log that contains a specific user name or module
    name could be easily spotted.'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'Back in Chapter 5, I discussed the System Monitor that comes with GNOME. There
    is another system monitor that displays much of the same information, but in a
    different interface that’s pretty interesting. Find it under Main Menu | System
    Tools | More System Tools | GKrellM System Monitor; it looks like **Figure 26**.


    Despite its miniscule size, the GKrellM monitor has a lot of information packed
    into it. It’s actually a combination of many monitors all stacked on top of each
    other, and you can choose which monitors you want to display. Right-click on the
    title bar (where it says “freedom” in Figure 26) or press F1 when the monitor
    window is active, and you’ll see the GKrellM Configuration screen, as shown in
    **Figure 27**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_251_0.png)


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_251_1.png)'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'You can also configure the appearance of each monitor that has a graphical
    display by right-clicking the monitor in question. For example, right-clicking
    above the “Disk” label in Figure 26 opens the GKRellM Chart Config dialog, shown
    in **Figure 28**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_252_0.png)


    Figure 28. The GKRellM Chart Config dialog is used to configure the display attributes
    of the monitor.


    Note that we can also configure the display of the entire monitor by selecting
    the General option in the Monitors list in the GKRellM Configuration dialog.


    With today’s hard disks ranging from 40 GB to 120 GB or more, one would think
    that running out of disk space would be the last thing on one’s mind. However,
    one advantage of Linux is the ability to run on older machines that have small
    hard disks where disk space is at a premium. The KDiskFree monitor allows you
    to see at a glance how your disk space is faring. Open the monitor via Main Menu
    | System Tools | More System Tools | KDiskFree, and you’ll see the monitor as
    shown in **Figure 29**.


    There are separate displays for each storage device attached to the system, including
    mounted drives. You can configure the update frequency and the mount commands
    by clicking Settings | Configure.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_253_0.png)


    Figure 29. The KDiskFree monitor displays space usage for each storage device
    attached to the system.


    # ## Summary


    This list doesn''t even scratch the surface—a quick look at the /usr/bin directory
    shows hundreds of programs. However, many handy Linux utilities don''t have a
    GUI interface. In Chapter 14, "Under the Hood," I''ll discuss how to use a shell
    window and run more utilities from the command line.


    > > The purpose of this chapter is to get you started with Linux on your desktop,
    but of course there''s a lot more than what I can cover here. In addition, new
    versions of Fedora Core are released on a regular basis. I''ll keep you up to
    date by writing new articles as well as posting updates related to this book.
    These materials can be found on Hentzenwerke''s Web site, www.hentzenwerke.com.
    Click "Catalog" and navigate to the page for Linux Transfer for Windows Power
    Users.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# # Chapter 10

    ## Digital Images


    Working with digital images is the newest mainstream application for the personal
    computer, and Linux has a variety of tools to help you do so. In this chapter,
    I cover a range of applications that will help you download pictures from your
    digital camera, capture screen shots of your computer''s monitor, or draw freehand
    (should that be "freemouse"?). Then I''ll show you how to modify the results to
    suit your needs, and finally, view those images either one at a time or in a slide
    show.


    I love my digital camera. With a houseful of kids who are involved in three zillion
    activities, I could never afford the film bill that would show up every month
    if I tried to work with silver halide film like I did in the old days. With a
    digital camera and a 512 MB flash card, I can shoot hundreds of pictures during
    an event, knowing that my only costs are a few errant electrons and the minuscule
    degradation of a rechargeable battery.


    When the camera manufacturers finally packed this capability into a very small,
    yet feature-complete camera about two-thirds the size of a deck of cards, I could
    carry a camera around with me everywhere—and I do. I never leave the house without
    my keys, my cell phone, and my camera. This way, I''ve always got the camera—and
    that means I can always take that one shot, whereas before I would have said to
    myself, "Boy, if I just had a camera..." However, hooking up a digital camera
    to a Linux computer wasn''t always the easiest. Between immature software and
    hardware incompatibilities, one had to go through significant work to connect
    to a digital camera, and then run the software necessary to download its pictures.
    With Fedora Core, however, digital photography on Linux is ready for prime time.
    In fact, I''ve found that it''s actually easier and more reliable than using Windows.


    But photos aren''t the only digital images I work with on a computer. As you can
    imagine, I spend a lot of time capturing screen shots of my computer monitor to
    accompany what I''ve written, and once in a while I even doodle by hand.


    And once images are on a computer, there are oodles of things to do with them—modify
    and tweak them, for sure, as well as set them up for viewing by others. Here''s
    how to get started with digital images on Linux.


    # ## Connecting and downloading images from your digital camera


    One tool that comes with Fedora Core—called gtkam—is a simple and straightforward
    application that allows you to download images from a digital camera to a computer.
    Using it takes only a few steps.


    First, open the tool by selecting Main Menu | Graphics | Digital Camera Tool.
    The bare gtkam window appears, shown in Figure 1.


    Next, plug your camera into your computer, and turn the camera on, making sure
    it''s set to download pictures. The exact settings, of course, will depend on
    the specific model of camera. Most recent digital cameras come with a cable that
    plugs straight into a USB port, and mine, although a couple of years old, was
    no different. I did have trouble getting the computer to recognize my camera when
    I tried to plug it into the USB port of my notebook docking station;'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'when I undocked the computer, the computer recognized the camera just fine.
    Interestingly enough, the same thing happens with a Windows-based notebook from
    the same manufacturer: The docking station for that computer (a slightly different
    model) doesn’t have a functional USB port, but plugging the camera directly into
    the computer’s USB port works fine.


    In gtkam, select Camera | Add Camera to open the Select Camera dialog (Figure
    2). The Select Camera dialog gives you two options. You can select your camera
    from a pre-populated list, or have gtkam try to detect your camera itself.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_255_0.png)


    *Figure 1. The gtkam window before adding a camera to it.*


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_255_1.png)


    *Figure 2. You can select your camera from a pre-populated list, or gtkam can
    try to detect it.*


    The list that gtkam provides is extensive—several hundred models at least—so I
    figured I’d just grab my version if I could find it. Not surprisingly, my camera—a
    Canon Powershot S400—was in the list, but when I tried to manually select it,
    gtkam told me it couldn’t find that model physically attached to the computer.
    Mmmm, bummer, bummer. My heart sank, of course. However, when I asked gtkam to
    detect my camera, it found the physical device and identified it as a Canon Digital
    IXUS 400 model, as shown in **Figure 3**. Go figure.


    After clicking the Apply button in the Select Camera dialog, the model shows up
    in the camera list, shown in **Figure 4**.


    As soon as the camera is identified, gtkam will look for pictures on the camera
    and download the thumbnail images. Drill down through the treeview control as
    shown in **Figure 5** to see the thumbnails.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_256_0.png)


    **Figure 3.** gkram''s Detect feature identified my camera as a slightly different
    model, but it worked.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_256_1.png)


    **Figure 4.** Once a camera is found and identified, it''s displayed in the camera
    list in the gtkam window.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_256_2.png)


    **Figure 5.** The thumbnails for your pictures are available as soon as the camera
    is successfully connected.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'Select the pictures you want to actually download from the camera. You can
    either highlight selected pictures in the right pane, or, if you want all of the
    pictures, open the Select menu and click All. The selected images are identified
    by highlighted file names (see **Figure 6**).


    The next step is to initiate the downloading itself. To do so, click File \| Save
    Selected Photos (see **Figure 7**). This dialog provides several capabilities.
    First, you can navigate to the folder you want to save the files in, and if the
    folder in question doesn’t exist, you can create a new one without leaving the
    dialog.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_257_0.png)


    Selected pictures in the right pane are displayed with highlighted file names.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_257_1.png)


    The "Save photos..." dialog allows you to determine what attributes to save as
    well as how to name the files on your hard disk.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'Second, you can decide what attributes you want to save. I just save the photos
    themselves, but you may choose to save other stuff as well.


    Finally, you can choose how you want the files to be named. The files on disk
    are named IMG_nnnn.JPG, where nnnn runs from 0001 through 9999. I use a custom
    naming scheme where the first characters are the date in CCYYMMDD format, as shown
    in **Figure 8**.


    If I didn’t do it this way, I’d end up with a file named IMG_0001.JPG (and so
    on) every time I downloaded pictures. With a custom naming scheme, I don’t have
    to keep files in separate folders just to avoid naming incompatibilities.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_258_0.png)


    **Figure 8.** *I precede camera file names with the date.*


    As soon as you click the OK button in the “Save photos...” dialog, gtkam will
    start the downloading process, as shown in **Figure 9**.


    The thermometer bars at the bottom of the gtkam window display the progress downloading
    each file as well as the progress of the whole collection. An indicator showing
    which file is being downloaded is also displayed in the status bar, and this indicator
    can be misleading at first. It shows you the name of the file on the camera, not
    the file name that is being saved on the computer. Thus, if you have chosen a
    custom file-naming scheme in the “Save photos...” dialog, those custom names won’t
    show up in the gtkam window’s status bar, but the files on your computer’s hard
    disk will be named as you desired.


    The gtkam tool has a couple of other interesting menu options. The Camera | Summary
    menu item displays an informational dialog about your camera, including the amount
    of space on its storage media. The 256 MB flash card in my Powershot had eight
    pictures on it when I made a screen shot for **Figure 10**.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_259_0.png)


    Figure 9. The gtkam window displays the download progress of each file as well
    as the overall download progress.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_259_1.png)


    Figure 10. The gtkam Summary dialog shows the amount of space on the storage media
    for your camera.


    Somewhat disappointingly, the Camera | Preferences menu item doesn’t provide a
    screen full of customization goodies like we’re used to in many software applications.
    Instead, it just shows information about the camera and driver (see Figure 11)
    — not much to select, actually.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_259_2.png)


    Figure 11. The gtkam Camera and Driver Configuration dialog doesn’t actually provide
    much to select.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'Once the images are downloaded from the camera, you can choose to delete them
    from the camera by clicking File | Delete Photos, but I never use this function.
    Rather, I first disconnect the camera from the computer. Then I open up GQVView
    and make sure the photos are safely saved. Once I’m satisfied that I’ve downloaded
    my photos properly, I delete them from the camera using the camera’s own delete
    functionality. This may be unnecessary, but I figure it’s just too easy to make
    a mistake and accidentally delete photos from the camera that for some reason
    didn’t get downloaded successfully.


    # ## Capturing screen shots


    A common task for many power users is copying something you see on your computer
    screen so that you can manipulate it, such as placing it in a document or on a
    Web page. This operation is called capturing screen shots, and you can do it a
    couple of ways.


    The easiest way is to simply use one of two key combinations to grab the contents
    of a single window or the entire screen.


    Pressing the <PrtScn> key on your keyboard (it’s usually in a group next to the
    ScrLk and Pause keys) will cause an hourglass to appear briefly, and then a dialog
    asking what you want to do with the resulting image, as shown in Figure 12.


    You can save the image (it’s currently just in the computer’s memory) to a file
    on disk or directly to your desktop. The default file name is, cleverly, “Screenshot”,
    and the default file format is PNG (Portable Network Graphics). You can navigate
    to another location on your hard disk if you like.


    Sometimes you don’t want a “screen shot” per se; rather, you want a “window shot”—an
    image of just one window on your screen. Press Alt-PrtScn to capture the active
    window, as shown in Figure 13.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_260_0.png)


    Figure 12. Pressing the PrtScn key on your keyboard captures the entire screen.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'When you capture just a window, the name of the file defaults to “Screenshot-”
    and then adds the name of the window to the file name. The default file format
    is still PNG. The default file name for the screen captured in Figure 13 was “Screenshot-Gnome-keybinding-properties.png”.


    The GIMP, an image manipulation program that comes with all popular Linux distros,
    has a more advanced screen-shot-capture feature. It’s discussed later in this
    chapter.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_261_0.png)


    Figure 13. All-PrtScn captures just the active window.


    # Draw freehand images with KPaint


    Another avenue for creating images is to draw them yourself. Fedora Core comes
    with an open-source tool called KPaint, which mimics the Windows painting programs
    that you might have used. To open KPaint, select Graphics | More Graphics Applications
    | Paint Program. Figure 14 shows the resulting KPaint window.


    Once you’ve opened an empty canvas, the first thing you’ll probably want to do
    is change the size. The default canvas size is 320 pixels wide by 200 pixels tall
    (you can find this out by looking in the far left of the status bar or via the
    Image | Information menu command if the status bar isn’t visible). Select Image
    | Resize to open the New Canvas Size dialog, shown in Figure 15.


    If you don’t check the “Keep picture ratio” check box, you can enter values in
    either or both of the Width and Height text boxes independently, creating a new
    canvas with a different proportion than 320 x 200. If you check the check box,
    the Height text box becomes disabled and you can enter a new value in the Width
    text box. The height will automatically be adjusted.


    The second thing you’ll want to do is select what color you want to draw with.
    The default color is displayed in the left of the two color boxes in the upper
    half of the screen. You can choose your own color by using the multipurpose color-chooser
    control in the upper right quadrant of the dialog. Click the Recent Colors box
    to display a set of choices for populating the box underneath it with color selections,
    as shown in Figure 16.


    Each item in the combo box has its own set of color choices, ranging from 40 basic
    colors to “Web-safe” color choices to your own set of custom-selected colors.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'The third step is to select a tool to work with. The toolbar in the second
    row, immediately above the drawing canvas, contains a variety of simple drawing
    tools, ranging from line, ellipse, circle, rectangle and rounded angle to pen,
    spray can, and text.


    The last tool in the row is the Area Select tool; it allows you to select an area
    on the canvas that you can copy or cut.


    You can set line attributes for all tools except the Text and Area Select tools.
    If you’re using a tool that encompasses an area, such as the circle or rectangle,
    you can click the Tool Properties button to set properties for the way the object
    will be filled as well. **Figure 17** shows the Tool Properties dialog for both
    sets of attributes.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_262_0.png)


    **Figure 14.** KPaint is an open-source painting program that comes with Fedora
    Core.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_262_1.png)


    **Figure 15.** The New Canvas Size dialog allows you to change the dimensions
    of the canvas.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_263_0.png)


    **Figure 16.** *The combo box in the upper right quadrant allows you to fill the
    control with predefined color choices.*


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_263_1.png)


    **Figure 17.** *The Line Properties and Fill Properties tabs of the Tool Properties
    dialog allow you to set the attributes for the currently selected tool.*


    You can set the viewing size of the canvas from 10% to 1000% by using the Zoom
    box in the main toolbar. A nice feature of KPaint is that the entire image snapshot
    of the canvas appears in the upper left quadrant, regardless of what zoom percentage
    is active. You can save your drawing in a number of popular formats, including
    BMPs, JPGS, Windows icons, X pixmaps, and PNG files. It isn’t straightforward
    how to do this, however. Most graphics programs ask what type of file format you
    want to save in, but KPaint has a non-'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'standard Save As dialog that determines the file type. Select File | Save As,
    and then navigate to the directory where you want to save your image. Then select
    the type of file format in the Filter box at the bottom of the dialog. Finally,
    type a file name and click Save. You can also use KPaint to convert images from
    one file format to another by opening the file in KPaint and then saving the file
    in a different format.


    # Draw icons with KIconEdit


    One type of very specialized graphic file is the icon—the picture that is attached
    to a program shortcut on the desktop or panel. Icons have certain properties that
    make it awkward (and in some cases impossible) to use some drawing programs. For
    example, you can create an icon with KPaint as described in the previous section,
    but you need to know that an icon is either 16 or 32 pixels square, and you have
    to know what file format to use for Linux (PNG is best). And you have to be able
    to eyeball your drawing, because KPaint doesn’t have a grid overlay that allows
    you to count pixel by pixel.


    Fedora Core comes with KIconEdit, a program designed specifically for creating
    and manipulating icon files, and not only solves these issues but also provides
    additional features. Open the editor window by clicking Graphics | More Graphics
    Applications | Icon Editor. You’ll see the empty Icon Editor window, shown in
    Figure 18.


    Icons are simple bitmaps of a certain size; KIconEdit comes preconfigured as a
    32-pixel-square drawing area. You can toggle the grid on and off by clicking the
    Grid button in the toolbar or by selecting Settings | Show Grid. This is handy—it’s
    easier to count pixels with the grid on, but then view the final result with the
    grid off.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_264_0.png)'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'The toolbar on the side provides the ability to draw freehand or create predefined
    shapes such as rectangles, circles, and ellipses (all either filled or empty),
    and straight or diagonal lines. You can also use a spray can or a flood fill,
    and erase through an area that had been drawn on.


    The color pickers on the side provide a fixed set of colors but also allow you
    to create a palette of custom colors; double-clicking one of the squares in the
    “Custom colors” picker opens the KDE standard Select Color dialog, shown in Figure
    19.


    The Preview box in the upper right corner above the “System colors” picker shows
    you a 1:1 display of what your icon will look like. You can change the background
    of the Preview box by clicking Settings \| Configure KiconEdit to provide a higher
    contrast if you like.


    Finally, you can save your icon by clicking File \| Save As. The Save As dialog
    has the PNG filter already selected, but you can choose a different file format
    if you desire.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_265_0.png)


    > Figure 19. The Select Color dialog is a standard widget used by many KDE tools.


    # ## Modifying images with The GIMP


    The GIMP (The GNU Image Manipulation Program) is an application somewhat comparable
    to PC Paintbrush, Paint Shop Pro, and Photoshop. It provides a wide variety of
    image- and photograph-manipulation capabilities. For example, many of my authors
    use it on Linux to capture and modify screen shots for their books.


    But The GIMP''s capabilities go far beyond that; indeed, there are 900-page books
    that cover all of The GIMP''s nooks and crannies. Some of its general image-manipulation
    capabilities (beyond screen-shot work) include a variety of tools, such as sharp
    and fuzzy drawing tools, airbrushes, fills, reverses, transparencies, and stamping;
    and selection tools such as freform, rectangular, elliptical, fuzzy, and intelligent
    scissors. You can rotate, scale, shear, flip, resize, resample, feather, and magnify
    images, and use a number of alternatives to crop them.


    The GIMP also supports advanced scripting via Perl, Python, and others; you can
    use these scripts to access internal GIMP functions. In addition, a comprehensive
    plug-in system allows you to extend The GIMP with new functions, filters, file
    formats, and other additions.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'As you’re starting to see, The GIMP is tremendously powerful, but its interface
    causes it to be one of those classic open-source tools that one either loves or
    hates; actually, many people love it and hate it at the same time.


    Many people open The GIMP, struggle with it for a bit and give up, completely
    frustrated. In this section, I’ll show you how to get started with The GIMP.


    # The GIMP interface


    Load The GIMP by selecting Main Menu | Graphics | The GIMP. One of the two main
    GIMP windows (the Toolbox) appears, as shown in **Figure 20**.


    The other main GIMP window (Image) appears once you have an image to work with.
    Select File | Open and navigate to the image you’re interested in. You’ll then
    see the image in the Image window, shown in **Figure 21**.


    The Image window is where the action occurs—it’s where you’ll do most of your
    work. Figure 21 shows a screen shot of my desktop while I was writing this chapter;
    OpenOffice.org Writer takes up most of the left side, while The GIMP’s Toolbox
    window is in the lower right, and a partially obscured window of a picture in
    GQView is in the upper right.


    Even as you’re just getting started with The GIMP, you’ll occasionally use two
    other windows: Color Selection and Brush Selection, as shown in **Figure 22**.


    Open the Color Selection window by clicking on either of the large, colored rectangles
    in the lower left corner of the Toolbox window. Open the Brush Selection window
    by clicking the round dot in the lower right area of the Toolbox window. Clicking
    the colored square to the right of the dot will open the Pattern Selection window,
    and clicking the rectangle under the Brush Selection dot or the Patterns square
    will open the Gradient Selection window, shown in **Figure 23**.


    The last primary piece of The GIMP’s interface is the Image window’s menu. With
    the Image window open, right-click anywhere in the image to display a context
    menu, shown in **Figure 24**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_266_0.png)


    Figure 20. The GIMP Toolbox window.'
  merge: -1
  img_proc: true
- pgno: 267
