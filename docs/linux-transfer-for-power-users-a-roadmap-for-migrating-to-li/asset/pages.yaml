- pgno: 293
  md: "Menu items allow you to perform the same functions as with the buttons in the\
    \ lower left corner of the Playlist window, as discussed earlier.\n\nA playlist\
    \ is simply a text file stored on your hard disk that contains identifying information\
    \ about the list, as well as the list of tracks themselves. You can then load\
    \ this text file for replaying later via any of the multitude of Load List options.\n\
    \nWhen you create a playlist, you are given the option to save it in M3U or PLS\
    \ format. M3U format looks like this:\n\n```\n``` \n#EXTM3U \n#EXTINF:301,B.B.\
    \ King - Ain't Nobody's Business /home/whil/ogg/bb_king/live_at_san_quentin/aint_nobodys_bisnis...\
    \ /home/whil/ogg/bb_king/live_at_san_quentin/every_day_i_have... #EXTINF:272,B.B.\
    \ King - Into The Night /home/whil/ogg/bb_king/live_at_san_quentin/into_the_night.ogg\
    \ \n```\n```\n\nAnd PLS format looks like this:\n\n```\n``` \n[playlist] \nNumberofEntries=4\
    \ \nFile1=/home/whil/ogg/acdc/live/dirty_deeds_done_dirt_cheap.ogg \nFile2=/home/whil/ogg/acdc/live/thunderstruck.ogg\
    \ \nFile3=/home/whil/ogg/acdc/live/tnt.ogg \nFile4=/home/whil/ogg/acdc/live/we_who_rog\
    \ \n```\n```\n\nThese are compatible with WinAmp, so you may already have some\
    \ playlists on your Windows computer that you can use immediately with XMMS. Neat,\
    \ eh? The Playlist Editor and Equalizer windows can float separately from the\
    \ Main window or they can be docked next to or below the window. When they are\
    \ docked, moving the Main window will cause the docked window to be dragged along.\
    \ However, moving the docked window undocks it from the Main window. To dock either\
    \ the Playlist Editor or Equalizer window, just drag it next to the Main window.\
    \ Figure 15 shows the playlist docked to the right, while the equalizer is undocked.\n\
    \nYou can also cause any of the three windows to roll up (like a window shade)\
    \ by double-clicking the title bar. Doing so causes a minimal number of controls\
    \ to appear in the title bar of the Main and Equalizer windows, while the Playlist\
    \ Editor window just displays the title and time of the current track. Double-clicking\
    \ the title bar again unrolls the window.\n\nXMMS has long been known for providing\
    \ the ability to change the appearance of the interface through add-ins known\
    \ as \"skins.\" A skin is simply a file that changes the player's appearance by\
    \ overlaying the windows and controls, and altering their colors, shapes, and\
    \ locations. **Figure 20** shows the XMMS Main window with the \"Aretic\" and\
    \ \"Marble\" skins applied, respectively.\n\nSo where do you get skins? Pop on\
    \ over to www.xmms.org and click the Skins link on the left side. Scroll through\
    \ the list (there are hundreds) and click Download for a few that you find attractive.\
    \ Download them into /usr/share/xmms/Skins if you can get root permission on your\
    \ machine, and then they'll be available to every user on the computer. If you\
    \ just want them available to you, or if you don't have root permission, download\
    \ them to the _xmms/Skins directory under your home folder, such as /home/whil/xmms/Skins.\
    \ The \".\" in front of \".xmms\" means that it's a hidden folder, so you'll have\
    \ to display hidden folders in order to navigate all the way in."
  merge: -1
  img_proc: true
- pgno: 294
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_294_0.png)


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_294_1.png)


    Figure 20. XMMS with two different skins.


    SkinS come in a couple of formats, including .zip and .tar.gz. Interestingly enough,
    XMMS can read these file formats “as is”—you don’t have to perform another step,
    that of unpacking the archive.


    To open the Skin Selector window, click Options | Skin Browser (or press Alt-S).
    From there you can pick and choose an available skin to display on XMMS.


    # ## Video


    Unfortunately, while working with audio files has matured on Linux, video hasn’t
    made the same progress. There are no GUI-based tools in the Fedora Core distribution.
    Rather silly, considering the Main Menu option says Sound and Video, eh?


    There are a number of open-source tools (and a few proprietary ones as well) that
    provide various CD, DVD, and VCD playback capabilities. Unfortunately, they suffer
    from the same basic problem. Because they aren’t available on the FC distribution
    (for the same reason that Fedora Core doesn’t come with an MP3 codec—proprietary
    licensing restrictions), you have to install them in addition to the FC installation.
    That by itself isn’t the problem; rather, what makes them unusable for the regular
    Windows user who’s moving to Linux is that they all require a fair level of user
    involvement simply to install and configure. If you’re interested in some adventure
    and have more than the average amount of patience, here are a couple of players
    worth investigating.


    **xine** ([http://www.xinehq.de](http://www.xinehq.de)) is a free multimedia player
    that plays back CDs, DVDs, and VCDs; decodes formats including AVI, WMV, and MP3;
    and can display multimedia streamed over the Internet.


    No binaries are available for Fedora Core, so xine requires you to download and
    install xine-lib, which requires you to download a number of tarballs (.ZIP files
    in Windows parlance), and then issue a series of export/configure/make commands
    for the various files. Once you’ve compiled xine, you’ll need to download and
    install a front end. Which front end you choose depends on what you’re going to
    use xine for—straught media players, or inside browsers or other file manager
    plugins.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'MPlayer (http://www.mplayerhq.ru) is another open-source tool that has developed
    quite a following; but, again, using it isn''t as simple as just downloading a
    file and installing it. You need to figure out what files to download and then
    install them, taking care of all the dependencies as well as wrestling with the
    appropriate codecs (software that allows you to play selected types of files,
    such as MPG, QuickTime, Real, and so on).


    A search on the Web will turn up a number of other tools. Be careful before throwing
    your lot in with one; some are rather old and haven''t been maintained, while
    others have onerous licensing issues. And, of course, there''s always the chance
    that you''ll find the perfect tool, only to discover that Linus Torvalds himself
    couldn''t install it successfully without losing handfuls of hair.


    > The purpose of this chapter is to get you started with Linux on your desktop,
    but of course there''s a lot more than what I can cover here. In addition, new
    versions of Fedora Core are released on a regular basis. I''ll keep you up to
    date by writing new articles as well as posting updates related to this book.
    These materials can be found on Hentzenwerke''s Web site, www.hentzenwerke.com.
    Click "Catalog" and navigate to the page for Linux Transfer for Windows Power
    Users.'
  merge: -1
