- pgno: 52
  md: '# ### Mouse Configuration


    Step 9. Select your mouse. Mine was detected as a Generic 3 Button Mouse (USB)
    and I changed it to the right one—a Microsoft IntelliMouse Optical (USB). You
    may have to experiment a bit if you''re using offbeat hardware. If your mouse
    has only two buttons, select the “Emulate 3 buttons” check box. Doing so enables
    you to click both buttons at the same time to take the place of clicking the middle
    button.


    Then click Next to open the Monitor Configuration screen, as shown in Figure 24.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_52_0.png)


    Figure 24. The Monitor Configuration screen.


    # ### Monitor Configuration


    Step 10. Again, depending on your hardware, your monitor may already have been
    detected and shown as selected in the screen. If not, you can either choose “Generic
    monitor” at the very top of the list, manually choose your monitor if it''s in
    the list, or choose the closest available choice to your monitor from the list.
    Then click Next to bring forward the Installation Type dialog, as shown in Figure
    25.


    # ### Installation Type


    The Fedora Core distribution comes with literally hundreds of software packages
    in addition to the basic Linux operating system. The three FC CDs also include
    Office suites, Web browsers, e-mail clients, drawing packages, PDF viewers, and
    utilities, as well as tools for administration, programming, and a variety of
    servers (such as e-mail servers, network file servers, and Web servers). These
    packages, in toto, represent functionality for a wide variety of users, from power
    users to programmers to server administrators. Not everyone would use all of these
    packages. Instead, each type of user would use a subset of packages.


    As a result, most users will not install every single package, although that could
    be done if a user wanted to use a machine for a wide variety of purposes (not
    advisable unless you know what you''re doing). Instead, most users will want to
    select a subset of packages that would be'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'used for a particular purpose. Installing packages that you have no use for
    could open your system to security vulnerabilities. Later, if you find a package
    that you want but didn''t install, you can always install it then.


    Because there are so many packages, it would be awkward, if not impossible, for
    most users to identify and install just the packages they want. Fedora Core comes
    with three predefined configurations of packages—one for power users (called “Desktop”),
    one for programmers (called “Workstation”), and one for server administrators
    (called “Server”). In addition, a fourth configuration allows users to customize
    their choices, but because you can customize the first three configurations too,
    it’s not really necessary.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_53_0.png)


    Figure 25. The Installation Type dialog.


    Step 11. Select the “Personal Desktop” option, because you’re installing for an
    end-user machine. Then click Next to open the Disk Partitioning Setup screen,
    as shown in Figure 26.


    # ## Disk Partitioning Setup


    The Fedora Core installation wizard provides a number of options for partitioning
    your hard disk. (See Appendix A, “Partitions,” for a detailed explanation of how
    partitions work with respect to Linux.) According to the Disk Partitioning Setup
    screen, you can have FC automatically create partitions or you can manually partition
    the hard disk yourself by using FC’s Disk Druid tool. If you choose automatic
    partitioning, FC will create several partitions by default that are good enough
    for many users. If you choose manual partitioning, you’ll have to create every
    partition yourself. With automatic partitioning, you’ll be able to review and
    modify the default partitions through Disk Druid, so there’s no real advantage
    to selecting manual partitioning.


    Step 12. Select “Automatically partition” and click the Next button to open the
    Automatic Partitioning screen, as shown in Figure 27.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_54_0.png)


    **Figure 26.** The Disk Partitioning Setup screen.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_54_1.png)


    **Figure 27.** The Automatic Partitioning screen.


    # ## Automatic Partitioning


    The Automatic Partitioning screen gives you three choices. The first choice is
    what specific action to take regarding which partition or partitions to use or
    modify. If your system has more than one operating system installed on it, you
    can do one of three things.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'The first action is to remove just the partitions used by Linux and leave the
    others (such as those used by games, Windows, and so on) alone.


    The second action is to obliter ate the entire hard disk, removing every partition
    on the disk and having it completely at your disposal when installing Linux.


    The third action is to leave the existing partitions alone, and use free space
    (that is, disk space that hasn’t been partitioned or formatted at all) for installation
    of Fedora. Obviously, this choice is applicable only if there is free space available.


    Your next choice is which device (in other words, which hard disk) to use for
    the installation. Again, this choice is applicable only if you have more than
    one hard disk in the machine.


    The third choice to make is whether or not to review the partitions created automatically
    by the installation routine via the check box at the bottom of the screen. Even
    if you wouldn’t even dream of making changes to the values chosen for you, it’s
    a good idea to review the partitions just to learn more about what’s going on
    under the hood.


    **Step 13.** Select the action appropriate for your installation. (If you’re using
    a box exclusively for Fedora Core, select “Remove all partitions.”) Select a device,
    if necessary. If you select the Review check box, you can find a description of
    what you’ll see in the “Options” section later in this chapter. In the Automatic
    Partitioning screen, click Next to advance to the Boot Loader Configuration screen,
    as shown in **Figure 28**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_55_0.png)


    # Boot Loader Configuration


    The Boot Loader Configuration screen is one of the wonderful screens in the installation
    wizard, because you can click through it with nary a second thought if you don’t
    want to mess with anything, but it also gives you access to all sorts of advanced
    configuration options in one handy place, should you need them.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Because this is an introduction to installing Fedora Core, I''m going to assume
    that you''re not going to want to mess with the boot loader at this point. The
    "Options" section, later in this chapter, describes what you''ll see if you select
    some of the Boot Loader options.


    **Step 14.** In the Boot Loader Configuration screen, simply click Next to move
    to the next step, the Network Configuration screen, as shown in Figure 29.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_56_0.png)


    Figure 29. The Network Configuration screen allows you to determine how IP addresses
    and hostnames will be assigned.


    # ## Network Configuration


    The default choice for the network configuration is DHCP (Dynamic Host Configuration
    Protocol). This means that the IP address that the computer uses is dynamically
    assigned by another computer. This is the default for many desktop computers,
    so we''re going to go with it. You can use the Edit button in the upper right
    corner to assign a static IP address. Details are provided in the "Options" section
    later in this chapter.


    **Step 15.** Click Next to move to the Firewall Configuration screen, as shown
    in Figure 30.


    # ## Firewall Configuration


    A firewall is a vehicle for controlling what types of traffic are allowed to access
    your machine from the network. Fedora Core includes a software firewall that is
    turned on by default, via the "Enable firewall" option button. You can optionally
    permit selected services to pass through the firewall by selecting the appropriate
    check boxes in the middle of this screen.


    **Step 16.** Leave "Enable firewall" selected, don''t check any of the services
    or device check boxes in the other sections, and click Next to move to the Additional
    Language Support screen, shown in Figure 31.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Firewall Configuration


    A firewall sits between your computer and the network, and determines which resources
    on your computer remote users on the network are able to access.


    A properly configured firewall can greatly increase the out-of-the-box security
    of your system.


    Choose the appropriate security level for your system.


    **No Firewall — No firewall** provides complete access to your system and does
    no security checking. Security checking is the disabling of access to certain
    services. This should only be selected if you are running on a trusted network
    (not the Internet) or


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_57_0.png)


    *Figure 30. The Firewall Configuration screen allows you to configure a personal
    firewall in a number of ways.*


    Additional Language Support


    Select a language to use as the default language. The default language will be
    the language used on the system once installation is complete. If you choose to
    install other languages, it is possible to change the default language after the
    installation.


    The installation program can install and support several languages. To use more
    than one language on your system, choose specific languages to be installed, or
    select all languages to have all available languages installed on the system.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_57_1.png)


    *Figure 31. The Additional Language Support screen allows you to choose the default
    language and additional languages for optional use.*'
