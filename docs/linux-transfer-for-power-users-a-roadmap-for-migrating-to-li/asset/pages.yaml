  md: 'However, because it’s possible to install a large number of applications in
    any functional area, the installation program puts the most commonly used programs
    for the desktop environment you’ve selected in the Main Menu and moves the rest
    to a “More… applications” submenu. For example, if your desktop environment is
    GNOME, but you’ve installed KDE applications as well, the KDE programs will be
    placed in the “More…” menu.


    # ### Applets


    You can control and manage your computer system by using **GUI** applets that
    are found under various menu options, similar to the applets found in Windows
    Control Panel. Here, again, things are a little different: Applets are separated
    according to function, instead of jamming them all in one place. For example,
    you can choose how the interface looks on your desktop by changing various options
    under Main Menu | Preferences. System settings, on the other hand, are found under
    (gasp) Main Menu | System Settings.


    If you open both Main Menu | Preferences, and Main Menu | System Settings, you’ll
    see a number of options that appear to be similar or downright identical. For
    example, consider the Login Photo option under Preferences and Login Screen under
    Systems Settings; also Network Proxy under Preferences and Network under Settings.
    And there are “Keyboard” and “Mouse” options on both. The options, however, lead
    to dialogs that provide different types of choices. **Figure 13** shows the Mouse
    Preferences, where you see options for using a left-handed mouse and setting the
    double-click speed.


    In **Figure 14**, the Mouse Configuration dialog, you can choose which type of
    mouse is being used with the computer.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_136_0.png)


    # **Figure 13.** The Mouse Preferences dialog allows you to configure how the
    mouse reacts.'
