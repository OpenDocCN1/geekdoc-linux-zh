- pgno: 145
  md: 'This is a terrifically handy tool that helps me navigate through the file system.
    I’m a data-oriented guy, so I want easy access to my data in a graphical fashion,
    and a file manager is the way to get it. The Home Folder icon opens Nautilus with
    two folders automatically loaded in the tree view on the left pane: my own home
    folder, and the entire file system on my computer. I’ll have a lot more to say
    about files, file managers, and file systems in Chapter 6, “Files, Directory Structures,
    and File Managers.”


    Next to the Home Folder icon are launchers for two browsers: Mozilla and Konqueror.
    The World Wide Web is still, in many places, the Wild, Wild Web, and as a result,
    pages render differently from one browser to another. I’ve found that if a site
    I visit doesn’t render properly in one browser, it will look fine in the other,
    so I keep both handy.


    There are enough times that it’s useful to have a terminal window available, so
    the next item on my panel is a launcher for one.


    The next icon, the manila folder, is another copy of Nautilus that is configured
    to open to the most recent folder I was working in. As my directory structure
    can get pretty deep, perhaps five or six levels at times, always starting out
    at the top level in my home folder means I have to spend time navigating through
    the folders. This launcher allows me to get right to where I was last working.
    I just opened Nautilus to the folder in question and dragged the window to the
    panel.


    The next seven icons are all primary applications. GOViewer is an image viewer,
    which I use all the time for moving between screen shots in a chapter. The two
    icons with an envelope and a stamp are e-mail clients, one is Evolution and the
    other is Kmail. The document with the seagulls is OpenOffice.org Writer, which
    you can guess I use a lot (all my writing is done in OpenOffice.org). Screen shots
    and other graphic tasks are handled by The GIMP, music is played through XMMS,
    and the volume control icon allows me to adjust the sound level of the speakers
    as well.


    # Menus


    You can add your own menu-launching icons to the panel, similar to the way you
    can add icons for regular applications or applets. Suppose you wanted to create
    a menu for accessories that you could access right from the panel. To do so, open
    Main Menu | Accessories, and right-click to open the context menu for the Accessories
    menu. Then select the “Entire Menu” option at the bottom, as shown in **Figure
    28**.


    Click “Add this as menu to panel,” and you’ll have a new icon in the panel. Clicking
    the new icon displays an Accessories menu that duplicates the Main Menu | Accessories
    menu, as shown in **Figure 29**.


    It is technically possible to edit the menus, both those accessed through the
    red fedora on the panel as well as those added to the panel. Editing includes
    adding new items, removing existing items, and changing the order of the items.
    (The menu options for adding and removing items are displayed in **Figure 30**.)'
