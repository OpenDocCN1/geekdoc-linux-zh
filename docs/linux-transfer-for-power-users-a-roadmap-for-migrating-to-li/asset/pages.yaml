- pgno: 156
  md: '# Chapter 6

    # Files, Directory Structures, and File Managers


    It’s all about data. Your data. Except for those poor souls who wander around
    airports with a $5,000 notebook that’s used only for Solitaire and the occasional
    DVD, people use computers to work with data. And oftentimes, that data will be
    stored on your computer. In this chapter, I’ll discuss what you need to know about
    dealing with data files on your computer—how files are different on Linux, what
    the directory structure in Linux looks like and what goes where, and how to manipulate
    files with popular file managers.


    Even in 2004, I’m continually amazed at the disregard that most software manufacturers
    have toward data. Data is the whole reason we use computers, after all. We’re
    not spending our time learning software just to learn software—we want to be able
    to manipulate data with that software. The definition of data spans a wide variety
    of uses, from word processing documents like letters and proposals, to spreadsheets
    with this month’s financial projections, to presentations for next week’s sales
    meetings or group laboratory report, to simply e-mail messages, music files, and
    pictures of the grandkids.


    In a perfect world, your data would just be “there,” and you wouldn’t have to
    know exactly where “there” was, nor would you need to worry about it; it would
    always be “there.” Indeed, my personal definition of Nirvana is having all my
    data accessible to me no matter where I am or what device I happen to have with
    me at the time.


    But the world isn’t quite perfect—yet, at least. So we have to know where our
    data is, how it’s organized, and how to get to it.


    Where do start? This chapter has a “chicken and egg” quality feeling to it. In
    order to talk about files, you sort of need to have a context for them, such as
    a directory (or “folder”) structure. But to talk about a directory structure,
    you sort of need a picture to demonstrate, and what can provide a picture better
    than a graphical file manager? But a file manager doesn’t do much good without
    files and directories, so we’re back where we started. So that means you’re going
    to want to read through this chapter a couple of times. The first time through,
    I may ask you to take a leap of faith on some things, but the second time through,
    many of those things will make sense.


    # ## Files: the data itself


    A file on a Linux computer is much like a file on a Windows computer, but not
    necessarily identical. Let’s look at the similarities first.


    On Linux, as with Windows, a file can represent a single coherent chunk of data
    (how’s that for a mouthful?), such as a memo, a spreadsheet, a digital image,
    a music file, or a database table. You use files for storing data from your application
    programs as well as for storing the programs themselves.


    Now about those differences. First, the naming scheme in Linux is different from
    Windows. Programs—those files that customarily have an EXE extension—generally
    don’t have extensions at all. Text files—TXT files—also usually go extensionless.
    You can create'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'files with spaces and long file names—these abilities are nothing new since
    the mid-’90s for Windows users—but Linux users never knew any differently. File
    extensions for some types of files are different: A compressed archive in Windows
    has a ZIP extension; in Linux, there are several, including bzip, gzip, tar, and
    gz, and sometimes a file can use multiple extensions on one file. That’s another
    thing: In Windows, the period is a separator between the file name and the extension;
    with Linux files, it’s not uncommon to run across a file with multiple periods
    in it, for any number of reasons.


    The second big difference is that case matters. Sometimes, MYFILES.abc.xyz is
    different from myfiles.ABC.XYZ, much to the consternation of many new Linux users.


    And the biggest difference is that on Linux, a file also can represent other entities,
    such as folders, disk drives, printers, processes, memory, the CPU, and everything
    else. Now wait, you say. How can that be?


    The short answer is that a “file” actually consists of two parts: an entry in
    a table that points to the actual entity, and the actual entity itself—the chunk
    of data. The table of pointers is stored in one place on the computer’s disk,
    and the actual entity—the data itself—is elsewhere on the disk. So what we think
    of as a “file” is actually the “pointer.” What difference does it make if a pointer
    points to a bunch of 1’s and 0’s in a particular place on a disk or if it points
    to another type of object, like a hard disk?


    # Symbolic links


    Before I bring this section to a close, I need to mention one more special type
    of file in Linux called a “symbolic link,” or “symlink” for short. You’ll run
    across them all over the place, and while you can get by without knowing much
    about them, it’s best that you don’t take that shortcut. You’re a power user after
    all, right?


    A symlink is essentially the Linux version of a Windows shortcut. That’s all.
    Nothing terribly magical or obscure.


    Why use symlinks? Why not use the original file? One example is a symlink on a
    desktop that points to another file. Instead of making a second copy of the file
    and putting it on your desktop (which you certainly wouldn’t want to do, because
    then you’ve got two copies of a file), a symlink on the desktop allows you to
    work with the original file, whether that’s opening a document or executing a
    program.


    Another example would be when you need a program accessible in one place (say,
    a certain directory), but there’s not enough room in that directory (because the
    directory is on a partition or disk that’s running out of room). So you can create
    a symlink in the directory where the program has to be accessible, and point the
    symlink to the program in another location.


    Installation programs frequently use symlinks during the process of installing
    software as well as during upgrades—the symlinks are kept out of your way while
    the program is working, but *they* are *there*.


    For example, when you install a new version of the Python programming environment,
    the old version is left where it was. The new one is not installed on top of the
    old one. Then, the “python” command is a symbolic link to the last Python interpreter
    you installed; if you need to run a specific version of Python, say version 2.2
    after you’ve installed 2.3, you can do so by typing “python2.2” instead of just
    “python.”


    See Chapter 14, “Under the Hood,” for information about how to create and work
    with symlinks.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Directory structures


    I''ll use the Nautilus file manager to demonstrate the directory''s structure,
    but I won''t discuss the details of various file managers until later.


    When Fedora Core is first installed, it creates a standard set of directories
    that looks like Figure 1.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_158_0.png)


    A number of questions spring to mind immediately. First of all, where''s the darn
    C: drive? Second, the folder names are all short and difficult to understand;
    calling them “obscure” is being kind. What do their names mean? And what goes
    in each of them? Third—whoa, I got distracted for a moment by the folder names.
    Where do I find my drives, like I did in Windows? I''ll answer each of these questions
    one at a time.


    # Where''s the C: drive?


    Having grown up with Windows, we''ve gotten used to a disjointed collection of
    objects representing our personal computer system, and think that it''s the “right
    way.” Back in the old days before hard drives (or color monitors!), a personal
    computer usually had two floppy disk drives, and the operating system (MS-DOS
    or PC-DOS) referred to these drives as Drive A: and Drive B: When a hard drive
    was added to a personal computer, it naturally received the moniker of “Drive
    C:” When other storage devices, such as additional hard disks or removable media
    (such as tape backups, Bernoulli Boxes, Zip drives, and CD-ROMS) were added, they'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# 138  **Linux Transfer for Windows Power Users**


    were also referred to with letters from the alphabet. A packed PC could easily
    have seven or eight drives, like so:


    +   * Drive A:—floppy disk

    +   * Drive B:—second floppy disk

    +   * Drive C:—hard disk

    +   * Drive D:—CD-ROM drive

    +   * Drive E:—second hard disk

    +   * Drive F:—Zip drive

    +   * Drive G:—tape drive


    In addition, if you''re attached to a network, you will probably have randomly
    assigned network drives.


    Computer components are all commonly organized in a tree structure, shown in **Figure
    2**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_159_0.png)


    The additional hard disk starts the schism of the interface to the computer. Some
    programs and data are stored on Drive C: while other data (and possibly some programs)
    are stored on'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'Drive D:. However, it’s not clear what goes where; thus, a hardware issue that
    should be hidden from the user now becomes a usability issue for the user.


    The tree structure now has two nodes (Drive C: and Drive D:) for data that is
    stored inside the computer. That distinction is actually an arbitrary choice,
    which is unnecessary, because it exposes the hardware setup to the user, they
    generally didn’t care. Imagine if you had separate names for each bank of physical
    RAM chips or SIMMs, and had to tell the computer which bank to load a program
    into?


    Furthermore, in order to make things “easier” for the user, Microsoft started
    adding artificial interfaces to the tree structure. The Desktop node is simply
    a different view of some information in directories on Drive C:. The Control Panel,
    presumably an object of the same type as the drives displayed above it, is actually
    a launcher for a variety of programs. The My Digital Camera and MacroMedia FTP
    and RDS nodes also seem to be objects like the drives, but whether they are or
    not is suspect. Indeed, I don’t even have a digital camera attached to this computer—why
    is there a node for a nonexistent device?


    So, as you can see, the interface that Windows uses for access to the components
    of a PC kind of falls short.


    With Linux, everything on a computer is represented by a file: files, directories
    (or folders), and even devices such as disks, cameras, printers, and so on. It
    can take a bit of getting used to—you might think, how can a floppy disk be a
    file? The intellectual leap you need to take is that files can contain files.
    Thus, directories can contain files, and you can copy a file to a floppy disk,
    because the file represented by the floppy disk can contain files too. At best,
    though, it’s probably not worth it to worry about this distinction, any more to
    worrying about how the electricity passing through the chips in your computer
    knows where to go. Linux handles the details.


    As a result, the tree structure for a Linux computer is considerably cleaner than
    a corresponding Windows computer. The top-level node, denoted by a single slash
    (/), is called “root,” and the rest of the tree flows out from the root. That’s
    why you don’t see separate nodes for Drive C:, Drive D:, and so on. The physical
    devices on a computer are all represented by files in the tree structure—there
    are no artificial or uneven interfaces. For example, a machine with two floppy
    disk drives would have two subdirectories under the /mnt directory: “/mnt/floppy1”
    and “/mnt/floppy2”. More on this shortly.


    Let’s look at these files and folders in more depth.


    # What do the folder names mean?


    Underneath root are a series of folders, including /etc, /home, and /usr. Note
    that the slashes used in Linux are forward-pointing, as opposed to the backslashes
    in Windows. (I remember which is which by reminding myself that Windows is where
    I was, back a while ago, while Linux represents where I’m going—forward into the
    future.)


    At first glance, the folder names are hard to understand, but as with anything,
    it just takes a bit of time to learn something new. It’s easiest if you concentrate
    on the first few folders that you’ll use all the time, and then add more to your
    cache of knowledge as needed. While I’ve found that any alphabetical listing of
    these explanations becomes mind-numbing in short order, putting them in any other
    order is an arbitrary and random practice. Thus, I’ll list them alphabetically,
    and then add a couple of editorial comments at the end about which ones you’ll
    use most often.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# /bin


    /bin contains programs or symbolic links (think “shortcuts” in Windows) that are
    used by the system administrator, by regular users, and by scripts (think “batch
    files”). These programs differ from those in /sbin and /usr/bin in that they are
    required before the rest of the directories are available for use. (You might
    hear people refer to this requirement in Linux terms as “before any other file
    systems are mounted.”) If you were going to create a floppy disk to boot Linux,
    these the contents of /bin would be useful.


    Examples of programs in /bin include cp (a utility to copy files), mkdir (a utility
    to make a directory), sh (the Bourne command shell) and su (a utility to change
    the user ID).


    # /boot


    /boot contains all of the files and data required for the machine to boot, in
    addition to configuration files not needed during boot-up.


    # /dev


    /dev contains files that map to devices (get it?) that are attached to the computer.


    # /etc


    The /etc folder stores configuration files for the operating system as well as
    programs on the computer. Some, but not all, configuration files have a “.conf”
    extension, but, in contrast with Windows, many Linux files do not have extensions
    at all. For example, the file “/etc/fstab” is a configuration file that contains
    the file system table (f.s. table—get it?). Another example is the file “/etc/gimp/1.2/gimpirc”—the
    configuration file for the GIMP (The GNU Image Manipulation Program). The corollary
    to Windows is the Windows Registry.


    # /home


    The most important folder to you is /home, because it stores regular user data,
    including yours. It’s somewhat like “My Documents” on Windows. Each regular user
    (as opposed to the root, or administrative, user) on a Linux computer has their
    own folder under /home, and each user can only get to their own folder under /home
    when they log on. So, for example, if three regular users—Al, Barb, and Connie—are
    set up on a Linux computer, there will be three folders under /home, like so:


    ```

    /home/al

    /home/barb

    /home/connie

    ```


    When Al logs on, he can get access to his own folder, but not to /home/barb or
    /home/connie.


    /home is like C:\Documents and Settings, because there’s a directory for each
    user underneath, and each user’s directory contains user-specific config files
    and (usually) users’ data.


    # /initrd


    When Linux is booted up, a RAM disk that contains a subset of the operating system
    is created. The “initrd” file is stored in this RAM disk and acts as a temporary
    operating system that points'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'the way for the rest of the computer to boot up. You should never have to worry
    about this directory, nor should you ever mess with it.


    # /lib


    /lib contains library files used to boot the system as well as run commands located
    in /bin and /sbin. This is a centralized location for these files, somewhat like
    C:\winnt\system32.


    # /lost+found


    This is where “lost” files and/or directories get dumped during a file-system
    check.


    # /misc


    /misc is just what it sounds like—a location for miscellaneous items. You may
    never find a need for it yourself.


    # /mnt


    /mnt is an empty directory provided for the temporary mounting of a file system.
    This is a fancy way of saying “this is where floppy disks and CD-ROM drives are
    found.” Current mainstream Linux distributions like Fedora Core automatically
    recognize when floppies and CDs are inserted into drives, and they place a drive
    icon on the desktop, as shown in **Figure 3.** Functions such as Open (to display
    the contents in the default graphical file manager) and Eject (to eject the CD
    from the drive) are available in the CD’s context menu.


    Floppies and CDs are also recognized in some file managers, such as Nautilus,
    as shown in **Figure 4.**


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_162_0.png)


    **Figure 3.** Current Linux distributions automatically detect a CD-ROM and place
    an icon on the desktop.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# 142 Linux Transfer for Windows Power Users


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_163_0.png)


    You’ll also find your removable storage devices under /mnt in the directory tree,
    as shown in Figure 5.


    Some suggest that entries to mount shares to remote file systems (in other words,
    mapped network drives) should be placed in /mnt, but I disagree. I argue they
    go under /home/\<user\> in order to facilitate easier access to the data. I cover
    this in more detail in Appendix B, “Connecting to a Windows Network.”'
  merge: -1
  img_proc: true
- pgno: 164
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_164_0.png)


    *Figure 5. Removable storage devices are found under the /mnt directory.*


    # /opt


    /opt is reserved for applications programs installed by the user.


    # /proc


    /proc is a virtual file system that stores a copy of the system currently in memory.
    This mechanism provides an easy way to get information about the kernel and currently
    running processes, instead of having to dig at the memory itself. You will likely
    never have to mess with this folder.


    # /root


    The /root folder is simply the root user''s home folder. It is not put in the
    /home folder for security reasons—you can have /home on a separate partition but
    still have the root user''s home folder available before that partition is mounted.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# /sbin


    /sbin contains utilities used for system administration. Programs that are involved
    with booting the machine as well as repairing broken installations and recovering
    corrupt files are located here. There is also a /sbin directory under /usr, called
    /usr/sbin, that contains similar programs that are executed after /usr has been
    mounted during boot up.


    # /tmp


    /tmp is reserved for programs that create or use temporary files, just like C:\temp
    (or C:\Documents and Settings\<user>) in Windows. Note that the contents of /tmp
    are deleted during the boot process, so don’t ever expect something in /tmp to
    be there five minutes later.


    # /usr


    /usr is roughly equivalent to “Program Files” in Windows. It has six major subdirectories.


    /usr/bin contains programs used by regular users of the system that are not in
    /bin. /usr/include and /usr/lib contain libraries that aren’t found in /lib. /usr/local
    is empty after initial installation, but eventually gets populated with programs
    installed by users. /usr/sbin has been covered in the /sbin description. /usr/share
    is used for data that isn’t modified once created. For example, a program that
    creates a key or other type of fingerprint file might put it in /usr/share/<program>.


    # /var


    By now you’re probably getting used to the abbreviations—and so it comes as no
    surprise that /var is used for variable data files. Examples include mail and
    print spoolers, log files, lock files, temporary files saved during system reboots,
    and caches for specific applications.


    # Which ones are important?


    These are brief descriptions of these folders. You can find more precise definitions
    and detailed information about subdirectories of these folders, at http://www.pathname.com/fhs.


    You’ll see that some distributions, such as Fedora Core, include other top-level
    directories, such as /libboot. Don’t worry about them.


    So now that we’ve been through the definitions, which ones are important? You
    can use Linux for a long time while dealing with only three directories: /home,
    /etc, and /usr. If pressed, you might be interested in /bin, /sbin, /tmp, and
    /var.


    If you’re using a different distribution, you’ll find many of these directories
    are the same as found in other distributions; in fact, the differences are fairly
    minor—much like the differences you find between the directory structures of Windows
    95 and Windows NT, for example, where the directory “Windows” was changed to “WINNT”
    (and then back again in Windows XP, ahem!).


    # About multiple drives


    During the conversation in the previous section, I quickly skipped past the “Where’s
    my C: drive?” issue and just talked about the folder structure under the “/” folder.
    If you’ve got a single hard disk, you can just assume that “/” sits on that hard
    drive much like “C:” would, and accept that you’ll find your floppy and CD-ROM
    drives under /mnt. But what if you’ve got more than one hard disk? What does the
    tree structure of folders look like in that case?


    The answer: Exactly the same!'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'How can that be? For a moment, pretend that your hard disk is rectangular—tall
    and not so wide. Now picture your file and directory structure laid out one line
    after another, like so:


    ```

    /

    /bin

    /boot

    /dev

    /etc

    /home

    /initrd

    /lib

    /misc

    /mnt

    /opt

    /proc

    /root

    /sbin

    /tmp

    /usr

    /var

    ```


    And all of this is on one hard disk. Now let’s suppose you had two hard disks.
    Linux puts some of the directories, in their entirety, on the second hard disk,
    like so:


    ```

    Disk 1:

    /

    /bin

    /boot

    /dev

    /etc

    /home

    /initrd

    /lib

    /misc

    /mnt

    /opt


    and


    Disk 2:

    /proc

    /root

    /sbin

    /tmp

    /usr

    /var

    ```


    To you, the user, does it really matter if /tmp is physically on Disk 1 or Disk
    2? Of course not. You can still access it all through the folder structure. The
    arbitrary use of separate drive letters for different disks is due to a lack of
    planning back in the early days of DOS, and Windows users have been paying for
    that decision ever since.


    In practical terms, which directories are on which disks is actually different.
    You’ll typically find /home (and maybe /tmp and /var) on a second disk if there’s
    one available. But the idea is the same. When you’re drilling down into /home,
    you don’t know (or care) whether'
  merge: -1
  img_proc: true
- pgno: 167
  md: "you’re working with hard disk #1, #2, or if there’s a tiny little man with\
    \ grey hair and a beard inside, furiously scribbling down data in a very small\
    \ book. Linux handles the specifics of getting data from the hardware to you transparently.\n\
    \nIf you want to learn more, there’s a long and involved description about how\
    \ this works in Appendix A, “Partitions.”\n\n# File managers\n\nNow that you know\
    \ something about your data and how the disk is structured, how do you go about\
    \ working with it?\n\nThere have long been two schools of thought about using\
    \ computer programs to work with data. One school of thought relies on the “noun-action”\
    \ or “application-centric” paradigm, where you open up a program and then use\
    \ that program to navigate to a piece of data, such as a memo or a spreadsheet.\
    \ The other school of thought relies on the reverse— an “action-noun” or “document-centric”\
    \ paradigm— where you navigate to your data, and then rely on the computer system\
    \ to know which program to use to work with it.\n\nDifferent kinds of data lends\
    \ themselves to one approach versus another, so it’s actually common to use both\
    \ methods at the same time. For instance, it’s common for an e-mail program to\
    \ keep its data in a specific place. Thus, you would open your e-mail client and\
    \ expect it to know where the data is. You wouldn’t navigate to a specific e-mail\
    \ message and then launch your client from that message, because you’re probably\
    \ going to want to work with more than one message.\n\nThe same goes for music\
    \ jukebox programs. In order to listen to a bunch of music, you’d typically start\
    \ your music player, and then create a new playlist or point to an existing playlist\
    \ of music. You ordinarily wouldn’t navigate to a specific song and load it, since\
    \ you’re probably going to want to work with (that is, listen to) more than one\
    \ song.\n\nOn the other hand, when you’re working with, say, spreadsheets, it’s\
    \ pretty common to navigate through your folders, find the spreadsheet you’re\
    \ interested in, and then launch the computer program associated with that type\
    \ of file.\n\nIn the early days of computers, the ability to associate a program\
    \ with a type of file didn’t exist, but as character-based and graphical file\
    \ managers became popular (after the introduction of hard disks, when people had\
    \ more data on their hard disks than in their boxes and boxes of floppies), this\
    \ technique became more and more common, until it’s now a standard technique on\
    \ both Windows and Linux operating systems.\n\nIn the late 1980s, I began using\
    \ a software tool that provided a graphical view of files and directories (and\
    \ thus provided the ability to launch applications from within it), and have never\
    \ looked back. I started with a couple of character-based programs that displayed\
    \ directory structures in hierarchal diagrams, like so:\n\n```\n```\n c:\\\n +-~Directory1\n\
    \ | +~fileA\n | +-~fileB\n |\n +-~Directory2\n +-~Directory3\n +-~file1\n +-~file2\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 168
  md: 'Once Windows hit, I started using Windows Explorer to navigate through the
    files on my system, and then started using PowerDesk as Explorer’s replacement
    once it was released. So I have a long-time bias toward using graphical file managers.


    As with any software category, a number of graphical file managers are included
    with mainstream distributions of Linux. Fedora Core includes three popular file
    managers. Nautilus is the default graphical file manager for GNOME, Konqueror
    is the default graphical file manager for KDE, and Midnight Commander is a popular
    character-based file manager called from the command line.


    I’ll discuss Nautilus and Midnight Commander briefly, and then spend more time
    with Konqueror, because it’s quickly become my personal favorite.


    # ### Midnight Commander


    Midnight Commander, or “MC” as it’s called by many folks, is a character-based
    file manager that mimics many of the functions that full-featured graphical file
    managers have. If you’re an old-time DOS user, you may notice a distinct similarity
    to the DOS Norton Commander, and for good reason.


    To run MC, open a terminal window and type “mc”. MC will appear in a window as
    shown in Figure 6.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_168_0.png)


    **Figure 6. Midnight Commander is a popular character-based file manager.**


    MC is terrifyingly robust, and packed with functionality. Because it’s not a GUI,
    it doesn’t require a lot of system resources. One could write a small book just
    on MC, but that’s beyond the scope of this discussion. Instead, I’ll just give
    you a quick tour.


    Despite it being a character-based tool, MC is accessible via keyboard and mouse,
    as well as a combination of both, so it will work with you regardless of your
    own personal style.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'The screen is divided into four areas, with the two directory panels taking
    up most of the real estate. The other two areas are the top line, which contains
    the menu bar, and the bottom couple of lines, which contain a shell command line
    and the function key labels.


    The current directory is displayed in the left panel; you can scroll through it
    as well as navigate through higher and lower directories by clicking parent directories
    (denoted by `../`) and subdirectories (denoted by `/some_subdir`). The right panel
    is generally used as a target during commands that use one, such as copy and move
    (don’t worry, MC warns you if you use one beforehand).


    You can configure how the panels display information, both in terms of sort orders
    as well as the types of information.


    As you would expect, you can perform any type of file operation you can think
    of, including copying, moving, renaming, deleting, finding, zipping and unzipping,
    comparing, editing, executing, changing ownership or permissions—and you can do
    so in several different ways. The File menu provides access to all of these functions,
    as shown in **Figure 7**, while the function keys perform the more common commands.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_169_0.png)


    **Figure 7**. You can access many of Midnight Commander’s functions through the
    menu and keyboard shortcuts.


    You can also access a "quick menu" by pressing the F2 (user menu) key, and you
    can customize this menu by editing one of the MC configuration files.


    # Nautilus


    It’s almost impossible not to get slightly acquainted with Nautilus (shown in
    Figure 1 earlier in this chapter), because it’s the default file manager used
    by GNOME, which in turn is the default desktop environment for Fedora Core.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Because many of the menu items and commands use Nautilus as their default engine
    (for example, opening the Home Folder from the Main Menu), it’s a good idea to
    learn a little bit about it.


    Nautilus opens in a two-pane display, with the left pane showing treeview nodes
    for the current user’s home directory, the machine’s entire file system, and any
    removable storage devices. **Figure 8** shows the first two standard nodes, plus
    one for a CD-ROM.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_170_0.png)


    By default, you can navigate through the treeview on the left side, expanding
    and contracting nodes in order to show the contents of folders, and navigating
    through folders and files.


    The first thing you’ll want to do is investigate the preferences for Nautilus
    so you can set it up to your own style. Click **Edit | Preferences** in the Nautilus
    menu to bring forward the File Management Preferences screen, as shown in **Figure
    9**.


    My preference is to smash lots and lots of data into the smallest space possible.
    On the Views tab, I set “View new folders using” to List View, I select the “Sort
    folders before files” check box, and I uncheck the “Show hidden and backup files”
    check box. I also make sure that the “Show only folders” check box is selected
    in the Tree View Defaults section at the bottom of the tab.


    On the Behavior tab, I select the “Include a Delete command that bypasses Trash”
    check box because it’s nice to be able to delete a file completely with one keystroke
    or mouse click without being prompted.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_171_0.png)


    *Figure 9. The File Management Preferences dialog allows you to tune Nautilus
    the way you want it.*


    Finally, beware of the “Count number of items” option on the Preview tab. This
    determines whether or not the row for a folder in the list in the right pane displays
    the number of files in that folder. Selecting “Local folders” or “Always” may
    have a negative impact on performance, depending on your hardware and number of
    files.


    Nautilus is an acceptable file manager. Indeed, when I started using Linux, I
    got by with it fine. However, one day a friend showed me Konqueror, and, as the
    fairy tale goes, my life has never been the same. Read on and enjoy.


    # Konqueror


    I’ve saved the best (in my opinion) for last. Konqueror is KDE’s combination Web
    browser and graphical file manager, and it occupies a permanent position on my
    panel and desktop.


    Like Nautilus, it has a dual-pane setup with a treeview on the left side (the
    “Navigation Panel”) and a file listing on the right. *Figure 10* shows Konqueror
    displaying my Home directory, instead of the computer’s file system, as shown
    in Figure 5.


    The first thing you may notice is that the Konqueror display is much more compact
    than in Nautilus, which may seem silly but was a key benefit for me. When I’m
    trying to navigate to a specific file, I don’t want to have to scroll through
    several pages if I can find a way around it.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_172_0.png)


    Figure 10. Konqueror displays the current user''s home directory, such as /home/whl,
    by default.


    The second thing you immediately notice is the summary information at the bottom
    of the screen: 23 items—14 files (213 MB total)—9 directories. That''s one feature
    of PoPDesk on Windows had, that I missed in Naulus.


    The next thing I want to point out is a terrifically elegant mechanism that gives
    Konqueror a number of different faces with just a mouse click. The icons in the
    column to the left of the Navigation Panel (they''re called “tabs”) allow you
    to display different views.


    Clicking on the second tab (I''ll come back to the first tab in the stack shortly)
    displays your bookmarks in a treeview, as shown in Figure 11.


    Remember how I said that Konqueror was a combination Web browser and file manager?
    Clicking on a bookmark in the left pane will open the Web page in the right pane.
    In Figure 11, I''ve navigated to the bookmark for the Web page for the Milwaukee
    Linux Users Group.


    The third tab is your browser history; I didn''t include a screen shot because
    I don''t want to give away the list of all the Heather Locklear, Space Ghost and
    KISS shrine sites I regularly visit. Sorry.


    The fourth tab in the list, the brown folder with a little house in front of it,
    is your home folder, as shown in Figure 10.


    The fifth tab is the Sidebar Media Player, which I don''t bother with, in favor
    of XMMS (see Chapter 10, “Multimedia: Audio and Video/). The sixth tab is the
    network view, and shows a variety of KDE-oriented Web and FTP sites.


    The seventh tab, the red folder, displays the entire file system, starting with
    the “/” folder, as shown in Figure 5 earlier in this chapter. And, finally, the
    last tab displays the services running on your computer, as shown in Figure 12.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_173_0.png)


    Figure 11. The second tab in the Navigation Panel in Konqueror displays your Web
    bookmarks.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_173_1.png)


    Figure 12. Konqueror’s Services tab displays a variety of nodes.


    The first tab in the column, the one that I skipped at the beginning, is the Configuration
    button. It provides a number of functions, including Add New, Multiple View, and
    options to control whether to show the Configuration button and where to show
    the tabs.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Okay, just for this set of views, Konqueror is wonderfully useful to me. But,
    as they say, wait, there''s more! First, you can split panes (repeatedly) to display
    multiple views. For instance, suppose you wanted to compare files at the top and
    bottom of a folder with lots of files. You can click one of the toolbar buttons
    to create a pair of panes, one above the other, and scroll independently in each
    of them.


    The buttons in the Konqueror toolbars provide such marvelous functionality that
    they are worth describing briefly. In Figure 10, I placed two toolbars (Main and
    Extras) on the same level in order to save screen real estate. (I once tried putting
    the Location toolbar on the same level as the Bookmarks toolbar, but the address
    box ended up getting truncated shorter than I liked. Compromises, compromises...)


    In Figure 13, I show the left half of the Main toolbar. (The Extras toolbar begins
    with the fifth icon in Figure 15.)


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_174_0.png)


    The first browsers, as you can guess, are navigation buttons similar to the Back
    and Forward buttons in browsers like Mozilla and Microsoft Internet Explorer,
    and the fourth pops you back to your Home directory. The fifth simply reloads
    the contents of the window, whether it''s a Web page or a file listing. As with
    other browsers, pressing the F5 key performs the same function. And the X inside
    a circle performs a "stop loading" operation.


    The next four buttons are Cut, Copy, Paste, and Print—and do pretty much what
    you would expect.


    The button to the right of Print, with a couple of grey folders and a yellow star,
    is New Tab. Tabbed browsing was made popular by Mozilla a couple of years ago;
    Konqueror has the same functionality built in, but it works across all of its
    functions, not just when browsing the Web. For instance, you could have your Home
    folder on one tab and a subdirectory of the "/" file system on another tab, as
    shown in Figure 14. Or you could even have Web pages on various tabs. Truly wonderful.


    The button next to New Tab is Close Tab, which becomes enabled when there''s more
    than one tab open. The Increase Icon Size button (the magnifying glass with the
    plus sign) enlarges the font size of the file listing in the right pane, while
    the Decrease Icon Size button does the reverse.


    Figure 15 shows the right half of the Main toolbar and the entire Extras toolbar.


    The first button, Icon View, and the second, Detailed List View, provide different
    views of the right pane.


    Cervisia is a graphical front end for the client software package of CVS, a version-control
    system that is used in many open-source software projects. The brick wall button
    opens the currently selected directory in the left pane in Cervisia if that directory
    is a CVS directory.


    The last button in the Main toolbar, the gear with the K in the center, is a progress
    indicator that provides feedback on the loading of data in Konqueror.


    The contents of the Extras toolbar vary according to what''s in the right pane.
    When files are listed in the pane, there are six buttons; when a Web page is displayed
    in the right pane, additional browser-specific button appear.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_175_0.png)


    *Figure 14. Konqueror fully supports the use of tabs in the right panel for any
    purpose.*


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_175_1.png)


    *Figure 15. The last few buttons in Konqueror’s Main Toolbar, and the entire Extras
    toolbar.*


    The first, Show Navigation Panel, is a toggle that displays or hides the Navigation
    Panel. The second, Find File, does what it says. The next two, *Split View Top/Bottom*
    and *Split View Left/Right*, divide the right pane into multiple windows as described
    earlier in this section. The *Remove Active View* button closes the multiple windows
    that the other two icons created.


    And the last button in the toolbar, *Filter* (*Only Show Files of Type...*), displays
    just selected files in the right panel according to user-provided criteria.


    There’s a lot more in Konqueror than I have space to cover. The help file is extremely
    well written, well organized, and just packed with information. Even better is
    the “What’s This?” feature available in the Help menu or just by pressing *Shift-F1*.
    When you press *Shift-F1*, a pointer appears; moving it to a location within the
    Konqueror window and then clicking will display a lengthy tooltip that explains
    that particular user interface object. Try it with the small box in the bottom
    right corner of the Konqueror window.


    # File associations


    The Windows and Macintosh operating systems come with a number of programs automatically
    set up to launch when a file with a particular extension is double-clicked in
    various programs, such as in a file manager like *Windows Explorer*, on the desktop,
    and in other places (like *Microsoft*’s e-mail clients, *Outlook Express* and
    *Outlook*).


    On the Mac, when someone created a document, information about the program that
    created that document was stored in the Mac file system. Then, when you double-clicked
    a document, the operating system knew which program was associated with that document,
    and automatically opened that document with the proper application. Because this
    information was stored out of sight, it was difficult to break a file association,
    but easy and foolproof to use.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Windows, on the other hand, does it differently. It ties a file’s file-name
    extension to a specific application, and stores that relationship in the Windows
    Registry. As a result, simply changing the extension of a file can break the file
    association. However, this also means that the user has more control over changing
    file associations.


    Linux, as of kernel 2.2 (many moons ago), has the same general functionality,
    but implements it slightly differently, using what we might say is the best of
    both worlds. Linux now supports multiple file formats that can be run at a command
    prompt, similar to an executable file. For example, you could associate all text
    files with a specific editor. Typing just the name of a text file would then automatically
    load that editor and then open the text file in the editor.


    You can see how file associations are handled by opening up your favorite file
    manager and right-clicking a file, as shown in **Figure 16**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_176_0.png)


    Figure 16. Right-clicking a file in a file manager displays the primary file associations
    for that type of file.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'In the Open With context menu, you’ll find the applications that have automatically
    been associated with the type of file that application. In Figure 16, the file
    is an image file (with an extension of .tif), and so the default image-viewing
    applications were listed. The first application in the list will be used automatically
    if you simply double-click the file or select any of the Open options at the top
    of the context menu.


    The file association isn’t keyed on the extension, though. In **Figure 17**, I’ve
    displayed the context menu and the Open with submenu for a file without an extension.


    As you can see, Konqueror has already identified (“detected”) as a “Plain Text”
    file with a file size of 9 bytes. (I spare no expense when creating examples!)
    There are a number of associated programs in the context menu, including gedit
    (GNOME’s g graphical text editor), KWrite (KDE’s text editor for programmers),
    and Emacs (one of the classic Linux text editors), to name a few.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_177_0.png)


    Figure 17. The Open With submenu for a file without an extension.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'What''s interesting is that it''s not just text files that don''t need extensions.
    If you delete the “.tif” extension from Copper.tif and then right-click, the same
    options under the Open With submenu will be displayed. How is this possible?


    As I mentioned earlier, Linux uses a combination of Windows and Macintosh mechanisms
    to deal with file associations. Each file on a Linux computer has two attributes:
    a file type and a file extension. (If the file extension isn''t there, then it''s
    an empty file extension.) The file type can be something simple, like “Text Document”
    or “QuickTime Movie,” or it can be something somewhat more obscure, like “H.323
    Internet Telephony” or “InterTrust DigFile.”


    The first few bytes of most files contain special encoding that specify the type
    of file, regardless of the extension. That''s why you can delete the extension
    from “Copper.tif” and the file associations still show up. “Copper.” is identified
    as a tiff file, and thus the applications for tiff files are still displayed.


    However, if you change the extension of “Copper.tif” to “.xls”, right-clicking
    the file will display file associations for .xls files, including Microsoft Excel
    and OpenOffice.org''s Calc.


    Now, what if I wanted to open Copper.tif with The GIMP? How would I add that file
    association? Or what if I wanted the default application to be ImageView instead
    of Kuickshow?


    In Konqueror, select Settings | Configure Konqueror from the menu, then click
    the File Associations icon in the left pane to open the “Configure file associations”
    tab. I suggest you widen the window, as shown in Figure 18, because a lot of info
    appears in the right pane.


    The file types mentioned a moment ago are all listed in the Known Types treeview
    on the left side of the tab. They''re organized into functional groups, such as
    image, text, and video. It can be tricky to find which file type you''re looking
    for, because some of the functional groups aren''t obvious if you''re not already
    familiar with them.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_178_0.png)


    **Figure 18. Konqueror provides an easy-to-use graphical interface to manage your
    file associations.**'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'Here are a couple of hints to find a specific file association. First, most
    of the file types are listed under “applications.” It can take a while to scroll
    through all of the file types, and not all of them are named what you would think.
    For example, you might know that OpenOffice.org is the open-source branch of Sun’s
    StarOffice office suite. As a result, you might think it reasonable to find that
    the OpenOffice.org Writer file type is “vnd.stardivision.writer” as shown in Figure
    19.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_179_0.png)


    Figure 19. The vnd.stardivision.writer file type isn’t associated with the OpenOffice.org
    .sxx extension.


    However, that’s not the case, as you can see that the native OpenOffice.org Writer
    file extension, “sxx”, is not listed in the Filename Patterns in the upper right
    of the tab.


    So here’s the second hint. You can use the “Find filename pattern” text box above
    the Known Types treeview in order to look for a file type if you have an idea
    of at least one of the file extensions. Simply typing “sx” in the text box, as
    shown in Figure 20, displays all of the file types that are associated with file
    extensions that begin with “sx”, and you can find and confirm the file type for
    OpenOffice.org Writer Text Documents.


    Back to our original quest—associating The GIMP with “Copper.tif” (and all other
    tiff files).


    This task is a bit easier than the myriad in the application node. Click the image
    node and scroll down to the “tiff” file type. Then click Add to bring forward
    the “Choose Application for image/tiff” dialog, as shown in Figure 21.


    Now simply navigate through the Known Applications treeview, first selecting the
    Graphics node, and then The GIMP node, and click OK. The GIMP will now be added
    to the Application Preference Order list box. Click on the row with The GIMP,
    then click Move Up a couple of times to maneuver it to be the default application,
    as shown in Figure 22.'
