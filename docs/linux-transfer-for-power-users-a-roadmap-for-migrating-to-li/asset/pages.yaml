  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_181_0.png)


    Figure 22. Rearranging the Application Preference Order so that The GIMP is the
    default application for opening tiff files.


    Now, when you double-click a tiff file, or right-click and select one of the Open
