- pgno: 20
  md: '# Introduction


    When I first conceived of this book, Red Hat 6 had just shipped. I gave it a try,
    and found it not quite ready for desktop prime time—not ready for use by folks
    who just wanted it to run, who didn’t want to mess about with the internals just
    to get the machine running. It was approximately on a par with Windows 95—in some
    cases much easier, in others, still way too obscure. And then the early versions
    of OpenOffice.org showed up, and I realized that it was just a matter of time.


    Not everyone saw it that way. At the time, people were saying that Linux would
    never make it on the desktop. I’d like to draw your attention to the word “never,”
    because these people were smart folks, but “never” is a really long time. The
    major reason they said “never”? Because there wasn’t an office suite like Microsoft
    Office available on the desktop.


    Sure, there was KOffice, but it wasn’t file-format compatible with Microsoft Office.
    And there was OpenOffice.org, but in those early days, the first incarnations
    of Ooo led people to say “It’s unusable” in the same breath as “Linux will never
    make it on the desktop.” Six months later, they said that OpenOffice.org was pretty
    bad, but you could use it as an alternative to Microsoft Office if you were desperate.
    Six months after that, the regular line went “It’s usable in a small number of
    unique situations, but it’s not ready for use by a publicity line went “It’s usable
    in a small number of unique situations, but it’s not ready for use by the public.”


    Seeing a trend here?


    Another six months passed ... the OpenOffice.org team had kept the pressure on,
    continuing to add features and fix bugs, and suddenly it hit the radar—and people
    started deploying it on the desktop for real. Suddenly the story was “It’s just
    as good as Microsoft Office for the large majority of users.” And it’s immune
    to viruses, has significant, cost-saving features that Office doesn’t have, and
    can be downloaded and installed for free, without the risk of running afoul of
    licensing violations.


    As I started this book, the realization that OpenOffice.org was for real hit Bonfident,
    and they started publishing materials to combat OpenOffice.org, treating it as
    a bona fide competitor, although they’d never admit it themselves. With OpenOffice.org,
    Linux was ready for the desktop.


    While this isn’t supposed to be a testimonial for Ooo, the fact is that its availability
    has made Linux a contender on the desktop.


    I switched my entire family to Linux last year, basically without telling them.
    One weekend my eldest daughter woke up to find that a SuSE box had replaced her
    Windows XP machine—and other than complaining about having to learn The GIMP for
    a couple of days, she’s never had a question. Web browsing, e-mail, word processing,
    spreadsheets and presentations for school projects, music, drawings—she does it
    all just as easily as with Windows. Our next two oldest kids share a Fedora Core
    box, on which they do most of the same things. And, again, they took to it without
    a second thought. Even my wife woke up one morning to a Red Hat 9 box, and except
    for an ancient sound card that didn’t work, she was back in business after a couple
    of hours of tweaking her settings to make them just the way she wanted them.


    The best part of this transition is that they all interoperate with their friends
    and schoolmates transparently. Teachers don’t know that assignments are being
    done with OpenOffice.org or The GIMP, and friends don’t know that they’re exchanging
    e-mail and pictures with a Linux box. You might think my kids have an advantage,
    with a “local computer expert” available around the clock, but I actually spend
    less time helping them now. I don’t have to deal with blue screens, keeping service
    packs up to date, reinstalling the OS when the'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'service packs fail, and worrying that a new, clever virus is going to sneak
    by them—not to mention other typical Windows problems.


    2004 is the year of Linux on the desktop for a distinct population of end users,
    and as a power user, you''re in that camp.


    That said, there is a huge world of Linux usage to explore, and a single book
    isn''t possibly going to cover it all. The purpose of this book is to get you
    started with putting a Linux box on your desktop—to get you going, and up and
    running with a minimum of fuss. Once you''re set up, you can go the next step
    if you want, by using additional resources. When you''re ready to continue, check
    out the updates for this book as well as other white papers on our Web site, and
    even other Linux books—by us as well as other publishers.


    As I write this, Fedora Core 2 is in beta testing and will be out in a few months.
    I''ll post updates for each chapter as appropriate when Fedora Core 2 ships.


    I''ve been having a blast learning new stuff and getting up to speed on Linux.
    It''s an operating system that''s designed right from the start, and it makes
