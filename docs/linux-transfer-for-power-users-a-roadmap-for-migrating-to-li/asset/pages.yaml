  md: 'Once the installation of the packages is complete, it''s time to perform one
    more housekeeping task-creating a boot diskette-as shown in Figure 46.


    # Boot Diskette Creation


    A boot diskette contains the minimum information needed to start your Linux machine
    in the event that information on the hard disk (such as the Master Boot Record)
    gets corrupted.


    **Step 25.** Because this is your first Linux machine, it''s a good idea to create
    a boot diskette now. It takes about a minute, and remember that all of the information
    on the diskette will be overwritten by this process. Once the boot-diskette-creation
    process is complete, take the diskette out of the drive and label it with today''s
    date, the name of the computer, the name of the distribution (such as “Fedora
    Core 1”), and the words “Boot Diskette,” so you can remember what it''s for when
    you need it three months from now. Store it with your Fedora Core CDs.


    Click **Next** when you''re done with the boot diskette and you''ll be greeted
    by the Congratulations screen, shown in Figure 47.


    # Congratulations!


    You''re done! Well, not really. There are a few more housekeeping tasks, but first
    you have to reboot-your first and only reboot necessary during the entire installation
    process.


    **Step 26.** Take all removable media out of their drives (floppies and CDs),
    and click **Reboot**. The machine will restart, and you''ll see prompts during
    the restart much like you did in Figures 8 and 18. See Figure 48.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_67_0.png)


    *Figure 46. After installation is complete, you are prompted to create a boot
    diskette.*'
  merge: -1
  img_proc: true
