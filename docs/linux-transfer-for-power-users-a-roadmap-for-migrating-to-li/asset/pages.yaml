- pgno: 291
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_291_0.png)


    Figure 17. The XMMs main menu and Options menu.


    As you can see, the main menu provides keyboard equivalents to a number of common
    functions that are available through the Main window. The Options menu item expands
    to provide access to a large number of additional functions; this second menu
    is the same Options menu that is displayed via the O button on the Main window.
    The Playback and Visualization menu items provide similar secondary menus; the
    Visualization menu is identical to that displayed via the V button on the Main
    window.


    A visualization is a graphical representation of the audio file being played.
    First, open the Visualization menu, and select a Visualization Mode (the first
    menu item)—either Analyzer or Scope. From there, cruise through the other menu
    options as desired. Note that some of the plugins can really chew up CPU power!


    The Playlist Editor window simply displays a list of tracks that are currently
    playing, but also provides controls to manipulate the tracks and run the player
    in “mini-mode.” The +FILLE button in the lower left corner allows you to add tracks
    to the current playlist, either one file at a time, one directory at a time, or
    via a URL. The -FILE button to its right does the same thing, except in reverse.
    Continuing on the right, the SEL ALL button provides the ability to select various
    combinations of the items in the playlist, in order to then perform other operations,
    such as removing them from the playlist. Finally, the MISC OPT button has options
    for displaying the file information, just like the I button in the Main window,
    and for sorting the playlist, as shown in Figure 18.'
