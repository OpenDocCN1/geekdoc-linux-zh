- pgno: 230
  md: '# 2.1. Accounting Concepts


    GnuCash is easy enough to use that you do not have to have a complete understanding
    of accounting principles to find it useful. However, you will find that some basic
    accounting knowledge will prove to be invaluable as GnuCash was designed using
    these principles as a template. It is highly recommended that you understand this
    section of the guide before proceeding.


    # 2.1.1. The 5 Basic Accounts


    Basic accounting rules group all financial related things into 5 fundamental types
    of “accounts”. That is, everything that accounting deals with can be placed into
    one of these 5 accounts:


    +   - **Assets** - things you own

    +   - **Liabilities** - things you owe

    +   - **Equity** - overall net worth

    +   - **Income** - increases the value of your accounts

    +   - **Expenses** - decreases the value of your accounts


    It’s clear that it is possible to categorize your financial world into these 5
    groups. For example, the cash in your bank account is an asset, your mortgage
    is a liability, your paychecks are income, and the cost of dinner last night is
    an expense.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_230_0.png)


    Most users will want to select just this set of accounts:


    +   includes (and commonly) these accounts: (checking, savings, cash, credit card,
    income, common expenses).


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_230_1.png)'
  merge: -1
  img_proc: true
