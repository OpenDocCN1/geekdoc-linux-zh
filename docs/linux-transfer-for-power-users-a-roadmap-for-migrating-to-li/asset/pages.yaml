    Finally, what if the program you want to use isn’t found in the Known Applications
    treeview? In that case, you’ll have to specify the program itself on disk, using
    the controls located above the Known Applications treeview in Figure 21. If you
    know the name of the program, you can just type it in the combo box; otherwise
    you can use the folder icon to the left of the combo box and navigate through
    the hard disk’s folder structure to find the program executable manually. (I know,
    that’s easier said than done, particularly with Linux and its inscrutable folder
    and file names. See Chapter 14, “Under the Hood,” for some hints.)


    # Migration of data from Windows to Linux


    This whole chapter has covered various topics relating to data, because, as I
    said, it’s your data. I haven’t addressed one topic yet—a subtle, yet important
    one. What about your existing data? After all, as a power user, you’re not going
    to fire up a Linux computer and just start fresh. You’ve got loads and loads of
    data already (“out there”—how do you get that data “into Linux,” for lack of a
    better phrase?).


    The good news is that, generally, you don’t have to do a thing!


    There are two levels of working with your existing Windows data on a Linux computer.
    The first is getting the files themselves onto or accessible by your Linux computer.
    The second is actually opening or working with your files once they’re accessible—that
    means using Linux programs to open your “Windows” data.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# ## Accessing Windows files on a Linux computer


    There isn’t anything magical about a file that restricts itself to reside on a
    Windows computer. You can copy a file on a Windows computer to a Linux computer
    without any ill effects or fear of messing up the file. The process isn’t like
    trying to read an Apple II floppy disk in an IBM PC disk drive, for example. There
    aren’t any secret codes in a file that designate it as “Windows-only.”


    You can copy your Windows data files to your Linux computer over a network connection
    or via floppy disk, Zip disk, or CD-ROM. Or you can connect your Linux computer
    to a network that has Windows computers or servers on it, and access your Windows
    data remotely. Indeed, I still have a Windows file server on my network, and I
    work with files stored on it from my workstation running Fedora Core. Details
    on connecting your Linux workstation to a Windows file server are in Appendix
    B, “Connecting to a Windows Network.”


    # ## Using Linux programs to open your Windows files


    Once you can “get to” your Windows data, what do you do with it when you’re running
    Linux? After all, you’re generally going to be running Linux programs, not Windows
    programs. You’ve got files in Microsoft Office format, e-mail in Microsoft Outlook
    or Outlook Express files, music files stored in MP3 format, and family pictures
    saved as JPG with the special Windows software that came with your digital camera.


    The answer is, as with many things computer-wise, “It depends.” Generally, you’ll
    be able to use files created with popular Windows applications “as is” with Linux.


    In many cases, Linux programs have been designed to work with the proprietary
    formats that Microsoft tries to use to continue its monopoly status. For example,
    OpenOffice.org can open Microsoft Office Word, Excel, and PowerPoint files with
    ease. In fact, oft-repeated tip by Microsoft MVPs on the various Office electronic
    forums is to use OpenOffice.org to repair damaged Office files that Office can’t
    open any longer itself!


    In some cases, Windows programs use industry-standard file formats, like HTML,
    MP3, PDF, and so on, which are also used by Linux programs, and so you can work
    with those files transparently.


    Finally, in a few cases, Windows programs use formats that aren’t natively readable
    by Linux programs. You’ll most likely have to export your data into a format that
    can be read by a similar Linux program. For example, Microsoft Outlook uses a
    proprietary format for its PST mail and address file. However, you can export
    your data into a format that can be read into a Linux mail program such as Evolution,
    KMail, or Mozilla Mail. Other programs use formats that can be read by other programs.
    For example, Mozilla’s mail client, Thunderbird, can import Outlook Express address
    books and e-mail absolutely flawlessly.


    In each of the following chapters that cover individual applications, I’ll discuss
    specific issues that relate to migrating your data from Windows to Linux.


    > The purpose of this chapter is to get you started with Linux on your desktop,
    but of course there’s a lot more than what I can cover here. In addition, new
    versions of Fedora Core are released on a regular basis. I’ll keep you up to date
    by writing new articles as well as posting updates related to this book. These
    materials can be found on Hentzenwerke’s Web site, www.hentzenwerke.com. Click
    “Catalog” and navigate to the page for Linux Transfer for Windows Power Users.'
  merge: -1
  img_proc: true
