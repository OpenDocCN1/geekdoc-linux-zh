- pgno: 58
  md: '# Additional Language Support


    Every system uses a default language, which is already selected in this screen.
    If you install additional languages here, they will be available as options to
    switch to once you''re up and running.


    +   **Step 17.** Select the default language to be used for the system. Select
    additional languages if you want them to be available as options later. Then click
    **Next** to move to the Time Zone Selection screen, as shown in **Figure 32**.


    # Time Zone Selection


    The Time Zone Selection screen allows you to set the system time graphically.


    +   **Step 18.** Select the dot nearest your locale in the world map. Alternatively,
    you can scroll through the entries in the drop-down box under the map. Select
    the "System clock uses UTC" check box if you want your system clock to take Daylight
    Savings Time into account. Then click **Next** to move to the Set Root Password
    screen, as shown in **Figure 33**.


    # Set Root Password


    The root password provides access to the root user''s account. "Root" is akin
    to "administrator" on a Windows system, although more powerful, because root on
    a Linux system can perform more functions than an administrator on a Windows computer.
    As such, it''s important to set a very strong password for the root user.


    +   **Step 19.** Set the root password, repeat it, and click the **Next** button.
    The "Reading packages" dialog appears for a moment, and then is replaced by the
    Package Installation Defaults screen, as shown in **Figure 34**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_58_0.png)


    **Figure 32.** Use the *Time Zone Selection* screen to set the system time graphically.'
  merge: -1
  img_proc: true
