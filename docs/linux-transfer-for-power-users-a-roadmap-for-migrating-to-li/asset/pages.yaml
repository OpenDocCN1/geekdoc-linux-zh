- pgno: 315
  md: '# Summary


    Linux has made great strides in hooking up to a wide variety of hardware in the
    past couple of years, and even better compatibility is high on the list of most
    open-source projects. Indeed, the biggest stumbling block these days is the recalcitrant
    vendor that doesn’t want to open up its APIs to Linux developers, but the number
    of those companies is shrinking daily. Life is good and it’s only going to get
    better.


    The purpose of this chapter is to get you started with Linux on your desktop,
    but of course there’s a lot more than what I can cover here. In addition, new
    versions of Fedora Core are released on a regular basis. I’ll keep you up to date
    by writing new articles as well as posting updates related to this book. These
    materials can be found on Hentzenwerke’s Web site, www.hentzenwerke.com. Click
    “Catalog” and navigate to the page for Linux Transfer for Windows Power Users.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# # Chapter 13

    Security


    In Chapter 1, I mentioned that one of the top 10 mythes with respect to Linux
    is that “because it''s more secure, you don''t have to worry about security.”
    And, yes, it is a myth: You do have to worry about security. The only computer
    that''s completely secure is the one that''s turned off, unplugged, and sitting
    in a locked box in the middle of the room. In this chapter, I''ll address a variety
    of topics dealing with security from the point of view of a power user: from strong
    passwords and separate user accounts to virus protection and firewalls.


    Security is a hot topic these days, and I''m not going to get into a big argument
    with folks in the Microsoft camp about how operating system is more secure. There''s
    plenty of material available for research on the Web and from various consulting
    companies; some of it will convince you that Windows is more secure and some of
    it will convince you that Linux is. And obviously, I''m biased. I spent over a
    decade developing software on Windows, and I''m moving everything to Linux.


    All I can offer is my personal experience running Windows and Linux servers and
    workstations side-by-side for the last couple of years. I''ve experienced attack
    targeted against Windows boxes that are many orders of magnitude larger than those
    that target Linux computers. Whether the attackers look for holes in Windows server
    software, aim at vulnerabilities in desktop software and applications, or rely
    on the naiveté of Windows users, the fact is that more attempts are made against
    Windows than against Linux. My Web server logs are filled with tens of thousands
    of attacks against Windows exploits; I''ve yet to be hit by a Linux exploit (knock
    on wood, of course). And my Windows workstation is being hammered by viruses in
    a dozen different ways incessantly throughout the day, through e-mail viruses,
    Web-site spoofs, and other means. I''ve yet to receive a Linux-based virus though
    e-mail, and if I did get one, it would have to be a shell script—and I''m not
    aware of any Linux mail client that ever allowed the execution of attachments
    by default.


    That''s because, generally, attackers want to make the biggest splash possible,
    and they do that by attacking the largest installed base with the most vulnerable
    population. And right now, that target is Windows. But as Linux becomes more popular,
    it will offer an increasingly attractive target, and undoubtedly someone out there
    would like to become known as the person who engineered the first widespread Linux
    attack. So don''t let the current minuscule likelihood of being attacked let you
    stay complacent.


    # ## Your own password


    When you installed Fedora Core, presumably you followed the instructions and created
    your own user account instead of just cruising around as “root.” (If you didn''t,
    I''ll show you how to create a user account in an upcoming section.)


    When you created your user account, you also created a password. At some point,
    you will probably want to change it. Here''s how. Select Main Menu | Preferences
    | Password, and you''ll be prompted for the password for the currently logged-in
    user, as shown in Figure 1.'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'Why? Obviously you know your password, because how else could you be logged
    in? The answer is ... perhaps it isn’t at your computer right now. Someone could
    have wandered by your machine while you went for a coffee, and changed your password
    on you, and you’d never be the wiser—not until tomorrow when you tried to log
    in and found your password didn’t work. That would start the day out wrong.


    Once you enter your password (or the password for whichever user is shown—maybe
    you’re changing the password for one of your kids on this machine), you’re asked
    for a new password (see Figure 2). Linux will do some checks on the password you
    enter. For example, if you enter “mouse” or “herman,” you’ll get an error (see
    Figure 3).


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_317_0.png)


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_317_1.png)


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_317_2.png)'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'So enter a good password. What makes a good password? Oh, gosh, lots of things.
    First, make it long enough. Fedora Core won''t let you enter a two- or three-letter
    password; it has to be at least five characters long.


    The second attribute of a good password is that it''s a completely random combination
    of letters and characters. Despite what the movies will have you believe (I''m
    referring specifically to Spaceballs), "12345" is not a good password. On the
    other hand, "j4$R83_dT" is much better because it contains all of the elements
    that people advise: lowercase and uppercase letters, numbers, and even a symbol
    thrown in for good measure. The problem is that it''s hard to remember and type.


    A good compromise is a combination of letters and numbers that means something
    to you but is put together in a random manner. For example, suppose you played
    soccer goalie as a youngster, and you lived at 1026 North Elm Avenue. Combining
    these attributes could generate passwords like these: "so1026cCelmer" or, even
    better, "go10NEal26!".


    You don''t want to make it so hard, though, that you won''t remember the trick
    you used, and end up writing it down on a piece of paper taped to your monitor.


    Once you''ve entered a secure password, you''ll be prompted to retype it (see
    Figure 4). If you don''t retype it the same way (you might have mistyped, but
    you need to mistype twice the same mistaken way), you''ll be warned, as shown
    in Figure 5.


    And that''s all there is to it. You don''t have to have any special privileges,
    but you do have to know the original password.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_318_0.png)


    *Figure 4. Retyping your password ensures that you didn''t make a mistake typing
    it the first time.*


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_318_1.png)


    *Figure 5. If you don''t repeat the password properly, you''ll be notified.*'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Change root password


    Just as with your user password, you may find a need to change the root password.
    One common reason is that when people start out with Linux, they provide a “weak”
    password for root so that they can easily remember it and get on with getting
    acquainted with their new operating system. After a while, you’ll realize that
    it really is time to create a stronger root password. Here’s how.


    Select Main Menu | System Settings | Root Password, and you’ll be prompted for
    the root password, as shown in **Figure 6**, much like when you changed your own
    password. In this case, you’re running an application that requires root access.


    After entering the current root password, you’ll be prompted to enter and re-enter
    the new password, as shown in **Figure 7**.


    The same process applies as with your user password: The new passwords must match,
    for example. And, again, that’s all there is to it.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_319_0.png)


    Figure 6. You have to know the root password in order to change it.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_319_1.png)


    Figure 7. Enter and re-enter the new root user password.


    # Users and groups


    As I’ve mentioned regularly, using root as your daily account is one surefire
    way to expose yourself to security problems, make yourself susceptible to accidentally
    trashing your system, and attract ridicule from friends who know better. But because
    you’ve been using Windows, where running as Administrator is a common practice,
    perhaps you haven’t taken those warnings to heart yet. If not, now is the time
    to create a user account for your daily use.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'Select Main Menu | System Settings | Users and Groups to open the User Manager
    window, shown in **Figure 8**. Then click the Add User button (or the File | Add
    User menu item) to bring forward the Create New User dialog, shown in **Figure
    9**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_320_0.png)


    **Figure 8.** *This is the control center for working with users and groups.*


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_320_1.png)


    **Figure 9.** *Adding a new user.*


    The **User Name** value is the text string that you''ll use to log on, so don''t
    make it too long or include a lot of weird characters in it. The **Full Name**
    value is simply used to identify who owns the User Name. The **Password** and
    **Confirm Password** values are for the user being added. The rest of the values
    can stay as-is. Click **OK** and the new user will be added to the User Manager
    window.


    If you''ve just got one or a few users on the same computer, that''s all you really
    need to do. You may be wondering, “Why bother with multiple users at all?” There
    are some advantages of having separate users. The first is that each user can
    customize the interface as she wants,'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'including the programs and applications installed on the panel and desktop,
    as well as the visual components of the desktop manager.


    Another advantage is that each user gets his or her own directory under the /home
    directory. In Figure 8, you can see the home directories for each user. For example,
    herman''s home directory is /home/herman, while Igor''s is /home/Igor. Access
    to this directory is restricted to the user; to prove it, create another user
    on your machine, and then log on as yourself and try saving a file in it other
    user''s directory.


    This means that you can make sure that each person''s data is segregated. You
    won''t have anyone accidentally (or maliciously) messing with someone else''s
    data. This also means that the unknown user, such as an attacker that gains access
    to your machine, is restricted to the harm they can perform. If they take control
    of your machine due to an action that you perform (such as visiting an evil-laden
    Web site), they''ll only have the same access that you do. If you were running
    as root, they''d have full run of your machine: yet another reason for not running
    as the root user during your day-to-day chores.


    This discussion has centered on users, yet the section heading says “Users and
    groups.” What''s a group and why should you care? A group is a collection of users
    who all have common attributes, needs, and requirements. The most common reason
    for creating a group is so that several users can share a set of files. Because
    each individual user''s files are owned just by that user, one user can''t generally
    access another user''s files. There are ways around this, but those methods are
    awkward, inconvenient, and generally a bad idea.


    The better solution is to create a “joint use” whose files can be accessed by
    others who have been given special permission. Another name for this “joint use”
    is a group. The fundamental idea is that you create a group, and then add users
    to that group. When users create files as part of that group, those files can
    then be accessed by anyone else who is a member of the group.


    Specifically, here is how you would make this happen. Suppose Herman and Igor
    needed to share files. You would create a group, say, “theboys,” by opening the
    User Manager and selecting Add Group. Enter the name of the group, as shown in
    Figure 10. When you''re done, the new group is listed on the Groups tab of the
    User Manager window, shown in Figure 11. You''ll note that each user has its own
    group, or, if you think about it in a different way, every time you create a user,
    a group is created that contains one and only one member—that user. That''s why
    each user is restricted to only its own files.


    You''ll also notice that the “theboys” group doesn''t have any members yet. Select
    the group in the list and the Properties button will become enabled; click it
    to bring forward the Group Properties dialog. Select the Group Members tab in
    the Group Properties dialog, as shown in Figure 12, and you''ll see a list of
    users who are eligible to join the group. Scroll down and select both Herman and
    Igor.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_321_0.png)'
  merge: -1
  img_proc: true
- pgno: 322
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_322_0.png)


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_322_1.png)


    You’ll notice that a lot of items in the list are not users. The details of this
    are beyond the scope of the book, but the general idea is that individual processes
    (somewhat like programs) running on your computer can also be eligible to join
    a group so that they can have access to specific files or directories. In addition,
    this prevents a process from becoming a security hole if that service is somehow
    compromised.


    After you select Herman and Igor, they’ll show up as group members in the User
    Manager window, as shown in Figure 13.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_323_0.png)


    Now what? Herman and Igor both have their own home directories, under /home. But
    what we want is a separate directory, called /home/theboys, that all members of
    the “theboys” group have access to, just like Herman has access to /home/herman
    and Igor has access to /home/igor. But no one except members of the “theboys”
    group will have access to /home/theboys.


    Here’s how to make this happen. Open a command window and enter the following
    commands, as shown in Figure 14 and in the following listing:


    ```

    `$ su

    Password:

    # cd /home

    # mkdir /home/theboys

    # chown herman /home/theboys

    # chgrp theboys /home/theboys

    # chmod 770 /home/theboys

    # chmod g+s /home/theboys`

    ```


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_323_1.png)'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'For the time being, take the commands as a leap of faith; I’ll describe them
    in more detail in Chapter 14, “Under the Hood.” In short, after becoming root,
    you’re creating a directory called /home/theboys, assigning its ownership to herman
    (the original owner was root), and then mapping the directory and the group together.


    If you look in a file manager such as Konqueror, you’ll see the owner and group
    for the new directory, as shown in Figure 15.


    The only people who are allowed access to the directory “theboys” are members
    of the group “theboys”——currently only Herman and Igor. When they relent and make
    their little club friendlier by letting Sandra in, only two things have to be
    done. First, the user “sandra” needs to be added in the User Manager. Then Sandra
    needs to be added to the “theboys” group. Once those two tasks are accomplished,
    Sandra has access to files in the “theboys” group and can give them a difficult
    time about how poorly they named their group.


    Note that the group name and directory name do not have to be the same; I just
    made them identical for the sake of convenience.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_324_0.png)


    Figure 15. The new “theboys” directory is owned by “herman” and is attached to
    the “theboys” group.


    # Authentication


    There’s an intriguing-sounding item in the menu that just cries out for some snooping.
    If you click Main Menu | System Settings | Authentication, you’ll see a dialog
    whose Authentication tab is shown in Figure 16.


    Despite its allure, there’s really nothing useful in this dialog for a desktop
    user unless you’re connecting to a network that supports LDAP, Kerberos, or SMB.
    And if you are, the administrator of the network will take care of these settings
    for you.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_325_0.png)


    Figure 16. The Authentication tab of the Authentication Configuration dialog doesn’t
    contain anything relevant to a desktop user.


    # Virus scanners


    Everyone knows that there aren’t any viruses for Linux, right? Well, 600 years
    ago everyone knew that the world was flat, and 100 years ago everyone knew that
    heavier-than-air flight was impossible. Things change, and you can bet that sooner
    or later (and probably sooner), Linux will get hit with its first widespread virus.


    Thus it behooves you to be prepared, and get used to having a virus scanner installed
    and running on your desktop system now. When the first big-time virus hits, you’ll
    be in much better shape than all those folks who will end up saying, “I didn’t
    think it would happen to me.”


    The rest of this book has covered software that comes as part of the standard
    Fedora Core distribution, but FC does not come with a virus scanner. This functionality
    is important enough that I’m going to break my rule this one time and show you
    how to download, install, and run a third-party piece of software.


    F-Prot (http://www.f-prot.com) has a virus scanner that’s free for personal use
    on workstations. It comes in three types of packages, including a 2.3 MB RPM.
    There are also a gzipped TAR file and a version for Debian/GNU.


    # Download and install


    Navigate to http://www.f-prot.com and look for the Download link for Linux home
    users. (They also make versions for Windows, BSD, and DOS (yes, DOS!), so make
    sure you get the right one.)'
  merge: -1
  img_proc: true
- pgno: 326
  md: "Because this book is using Fedora Core, download the RPM file to a directory.\
    \ I keep a subdirectory under my home directory specifically for software installation\
    \ files I download—/home/whil/zips—and this is where I’d put the RPM file from\
    \ F-Pro. On the page for the link for the RPM file, there should also be a link\
    \ for the MD5SUM file. Click on that next. It should open a browser window, shown\
    \ in Figure 17.\n\n![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_326_0.png)\n\nFigure\
    \ 17. Clicking the MD5SUM link will display the md5sum string in the browser.\n\
    \nOpen a command window and change to the directory where you saved the RPM. For\
    \ me, that would be this command:\n\n```\n``` \ncd /home/whil/zips\n```\n```\n\
    \nBut your command might be different. Then type this:\n\n```\n``` \nmd5sum fp-\n\
    ```\n```\n\nThen press the Tab key. It’ll automatically complete the rest of the\
    \ command for you. Press the Enter key, and the md5sum for the file you downloaded\
    \ will appear in the command window. Compare this with the md5sum value you downloaded,\
    \ and if they match, you’re all set. (If they don’t, trying downloading the RPM\
    \ file again; most likely, the file was corrupted during downloading.)\n\nNow\
    \ install it. The F-Pro documentation instructs you to use the “rpm” command in\
    \ the command window, like so:\n\n```\n``` \nrpm -Uvh /path/to/fp-linux-ws-VERSION.rpm\n\
    ```\n```\n\nBut you don’t have to. Because it’s an RPM file, you can just double-click\
    \ the RPM file in GNOME or Konqueror. If you run RPM from one of the file managers,\
    \ you’ll go through the standard RPM install process. First it will request the\
    \ root password, because you’re installing a system-wide package. See Figure 18.\n\
    \nThe package will start installing, and you’ll see a couple of progress windows,\
    \ shown in Figure 19. The last screen appears and disappears pretty fast. And\
    \ then ... nothing. So now what? Is it installed? Is it running? Is it working?"
