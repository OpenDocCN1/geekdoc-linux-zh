- pgno: 308
  md: 'While sparse, the main window has all that you need to scan and tweak your
    image. The rest of the windows just provide more functionality. I’ll take a look
    at them for a moment and then come back to the main window to do an actual scan.


    The **Standard Options** window underneath the main window, also shown in **Figure
