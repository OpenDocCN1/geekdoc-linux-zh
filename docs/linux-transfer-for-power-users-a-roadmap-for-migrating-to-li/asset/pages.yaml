- pgno: 303
  md: 'This is where the action is. Select a print queue in the list and then click
    the Edit button, and you''ll be in the “Edit a print queue” dialog, shown in Figure
    14.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_303_0.png)


    *Figure 14. The “Edit a print queue” dialog allows you to continue configuring
    the print queue.*


    This dialog allows you to set all sorts of advanced options for the print queue.
    For example, the “Queue options” tab allows you to set the margins for the area
    that can be printed upon, as well as select banner pages for the start and end
    of the job—which can be handy for identifying which print job belongs to whom,
    if more than one person uses the printer. The “Driver options” tab, as shown in
    Figure 14, has a number of settings that you may want to modify according to your
    specific needs. As you can see, you can change parameters such as resolution,
    number of copies, and manual sheet feed. As a result, you can set up multiple
    queues for the same physical printer that simply have different attributes, and
    then just select the appropriate option instead of changing those attributes each
    time you want to print in a special way.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_303_1.png)


    You could use this capability to set up a 300-dpi queue for “draft” printing and
    a 600-dpi (or 1200-dpi, depending on your printer) for “final printing.” Similarly,
    you could set up a “grayscale” queue on a color printer for drafts in order to
    conserve color ink.'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'Another reason to set up more than one printer queue is if you''ve got more
    than one physical printer—say, a sluggish color ink jet and a zippy black-and-white
    laser—attached to your computer.


    If you''ve set up more than one printer queue, you can choose which printer will
    be the default printer in your applications by selecting that printer and then
    clicking the Default button in the toolbar. Once you do so, the default printer
    will have a check mark in the Default column in the "Printer configuration" dialog.


    # Using a print queue


    So now you''ve got a print queue set up. So what? What do you do with it? Simply
    put, the print queue will be available for you to select when printing with applications.
    Well-behaved applications should respect the "default" print-queue settings as
    well.


    **Figure 15** shows you the print dialog in the GIMP. You''ll see the Printer
    Name box in the upper right corner, with "(local)" selected as the default printer
    for the current image. On the other hand, OpenOffice.org doesn''t seem to respect
    the default print-queue settings, but the print queues are available in the Print
    dialog, as shown in **Figure 16**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_304_0.png)'
  merge: -1
  img_proc: true
- pgno: 305
  md: '284 Linux Transfer for Windows Power Users


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_305_0.png)


