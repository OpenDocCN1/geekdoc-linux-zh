    # Panel


    The panel is a wise and marvelous tool. Like the taskbar in Windows, it is divided
    into a number of areas. **Figures 6 and 7** illustrate my panel. I separated it
    into two halves because one screen shot would end up being so wide and so short
    that you couldn’t see anything in the images.


