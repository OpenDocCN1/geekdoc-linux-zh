- pgno: 129
  md: 'are GNOME and KDE, and popular distributions include at least one of these
    desktops (and usually both).


    For example, SuSE ships with KDE "out of the box." Red Hat upset a lot of folks
    when it released Red Hat Linux 8.0, which presented the user with a combination
    of GNOME and KDE, using components of both in a theme called "Bluecuvre." Fedora
    Core continues that tradition, using Bluecuvre as the default environment and
    theme.


    You can install either GNOME or KDE, or both, during installation. Depending on
    your choice, you will get the applications that fit with the desktop environment
    you selected. For example, if you selected GNOME, you''ll get OpenOffice.org;
    if you selected KDE, you''ll get KOffice. If you chose both, you''ll get all applications
    from both desktop environments.


    I''ll concentrate on GNOME and Bluecuvre in this book, mentioning KDE when appropriate.
    If you''re interested in other window managers, you can find a central repository
    at http://www.xwindow.org/.


    # # Using the desktop as-is


    The first thing you''ll notice, regardless of whether you select GNOME or KDE
    during installation, is that the standard Fedora Core desktop is rather spartan.
    Because there isn''t a profit-oriented company behind any of the various desktop
    organizations, you won''t see a desktop full of icons that have been placed there
    for a goodly dose of lucre.


    Instead, you''ll see three default icons: one that leads you to your home directory,
    one for trash, and one ("Start Here") that gives you a convenient location for
    the items you typically want to use most often. See Figure 1 for the basic GNOME
    desktop.


    The KDE desktop isn''t any more complicated (see Figure 2).


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_129_0.png)


    **Figure 1.** The default Fedora Core desktop with GNOME is rather spartan.'
