- pgno: 225
  md: '# Creating, printing, and saving documents


    You can start a new document, spreadsheet, presentation, or other Ooo file by
    clicking the appropriate menu item in the Main Menu. A subtle trick is that once
    you have any type of Ooo document open, you can create a new document of any type
    through the File \ New menu. See Figure 19.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_225_0.png)


    Creating a document, whether it be a word-processing document, a spreadsheet,
    or a presentation, works pretty much as in other office suites. Some of the functions
    are in different places, and some of the processes work somewhat differently.
    But the basics—typing in text, making it bold, changing the font and the size,
    building formulas, spell-checking, inserting graphics, and so on—can be figured
    out by anyone who can read the tooltips on the toolbar buttons.


    Once you''ve created a document, you might want to print it. And you''re definitely
    going to want to save it. File \ Print (Ctrl-P) and File \ Save (Ctrl-I) work
    just like you''d expect them to. As I said earlier, there isn''t enough room in
    even a thousand-page book to completely do justice to OpenOffice.org. The purpose
    of this section, rather, was just to show you that Linux offers a viable competitor
    to Microsoft Office.


    # KOffice


    The KDE desktop environment has long been accompanied by its own desktop suite,
    KOffice. Comprised of a half-dozen tools, similar to OpenOffice.org, KOffice also
    sports a "control center" called the KOffice Workspace, which acts as a launching
    pad for all of the KOffice applications, as shown in Figure 20.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_226_0.png)


    Figure 20. The KOffice Workspace acts as a launcher for the KOffice applications.


    The menu and toolbars change according to the type of document you''re working
    on. For example, when you''ve got a KWord document open, the menu choices include
    Format, Frames, and Table; when you''ve got a Kontour drawing document open, the
    menu choices change to Layout and Style. Under the Settings menu, you can choose
    which objects you want to display, and that list of objects again changes according
    to which type of document you''re working on. KWord settings include the Table,
    Insert, Paragraph, Format, Borders, and Formula toolbars, while Kontour includes
    a few of the same toolbars but also panels for Layer, Outline, Paint, and Transformation.


    At the same time, common functions such as Save, Print, Edit, and View are all
    located in the same place in the menu regardless of which application you''re
    using.


    A nice feature of the KOffice Workspace is that once you have opened at least
    one document, all of the KOffice documents appear in the Documents work area,
    as shown in Figure 21.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_227_0.png)


    Figure 21. Clicking the Documents bar in the KOffice Workspace displays a list
    of open documents across all of the KOffice applications.


    If you want to switch back to the applications, click the Parts bar above the
    Documents bar on the left side of the workspace.


    Probably the biggest impediment to widespread adoption of KOffice is that, while
    it can read Microsoft Office files, it can’t save in Microsoft Office formats.
    Funny enough, it will save in many other formats, including WordPerfect, Lotus
    AmiPro, Rich Text, AbiWord, and a variety of plain-text formats. As a result,
    KOffice isn’t a good choice if you exchange documents with folks using files formatted
    with Microsoft Office file formats (which is nearly everyone).


    The KOffice documentation is generally excellent, although there are a couple
    of places where it’s missing from the original distribution. In those cases, the
    help file presents a page that directs you to the KDE Web site for documentation
    updates.


    # Gnumeric


    Gnumeric is a widely popular, open-source spreadsheet application that is found
    on many Linux distributions—including, of course, Fedora Core. To load Gnumeric,
    select Main Menu | Office | More Office Applications | Gnumeric Spreadsheet (see
    Figure 22).'
  merge: -1
  img_proc: true
- pgno: 228
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_228_0.png)


    *Figure 22. Gnumeric is a popular open-source spreadsheet application.*


    Not as functionally rich as OpenOffice.org’s Calc or even KOffice’s KSpread, Gnurmic
    has nonetheless won a wide following for its no-nonsense, “just the important
    stuff” design. And Gnumeric’s development team has won kudos for responsiveness;
    when their implementation of important statistical functions was found to be buggy,
    the team fixed them within a few weeks; contrast that with Microsoft Excel, which
    has carried the same bugs through several major releases over half a decade. (See
    [http://www.csdassn.org/software\_reports/gnumeric.pdf](http://www.csdassn.org/software_reports/gnumeric.pdf)
    for details.)


    As with other applications, one of the first things you’re going to want to do
    is set up some preferences. Select Format | Gnurmic to open the Gnurmic Preferences
    dialog (*Figure 23*).


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_228_1.png)


    *Figure 23. You can set a variety of preferences to customize Gnurmic spreadsheets.*'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Personally, I like to see lots of data on the screen at once, so I change both
    the size of the sheet and the fonts for the default, so that I don’t have to change
    them for each new spreadsheet I create.


    # # GnuCash


    After questions about running Microsoft Office on Linux, the next question many
    people have is “Can I run Quicken on Linux?” The strict answer is “no,” because
    Quicken is a Windows product. However, that doesn’t mean that you’re out of luck,
    any more than you’re out of luck buying a car because the General Motors dealership
    you’re visiting doesn’t sell Ford Escorts. If you’re looking for automotive transportation,
    that GM dealership still has plenty of options.


    Similarly, the personal finance software option on Linux is the highly regarded
    GnuCash, which you can find under Main Menu \| Office \| More Office Applications.


    The first time you run GnuCash, you’ll be offered the opportunity to import your
    personal finance files in QIF format, as shown in Figure 24.


    Quicken Interchange Format files, used by Quicken, QuickBooks, Microsoft Money,
    and a number of competing personal finance programs, can be imported by GnuCash
    either during the initial setup or later, by using the File \| Import \| Import
    QIF menu option.


    If you’re new to GnuCash, or if you’d like to learn how it works, and how it differs
    from the personal finance program you’re currently using in Windows, you may decide
    to (gasp!) read the instructions. While open-source software routinely gets a
    burn rap with respect to its documentation, you’ll find GnuCash to be a breath
    of fresh air—one-line documentation is well written and chock full of help, as
    shown in Figure 25.


    At the same time, the program is wonderfully laid out and well designed. For example,
    the New Account Wizard walks you through the tasks of creating accounts (similar
    to “Categories” in Quicken), as shown in Figure 26.


    For example, Figure 26 shows the selection of two sets of accounts. The first
