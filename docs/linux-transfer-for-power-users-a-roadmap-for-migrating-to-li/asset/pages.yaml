    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_99_1.png)


    **Figure 15.** The “*invalid GPG signature*” error is often a result of an interrupted
    file download.


    What has likely happened is that the file hasn’t been tampered with, but it’s
    simply corrupt, because the download was terminated and wasn’t resumed, leaving
    a bad file.


    These two problems are posted on the Fedora Core mailing list on a daily basis.
    You can avoid them by hitting a different mirror. update2date gets its configuration
    information from a plain text file called /etc/sysconfig/rhn/sources. In this
    step, you’ll modify this file and change the URL for the Web site to grab files.
    Here’s how, in detail.


