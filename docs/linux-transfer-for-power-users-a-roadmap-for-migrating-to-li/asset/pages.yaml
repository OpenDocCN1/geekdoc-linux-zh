- pgno: 242
  md: 'In Figure 10, I have created an item that will pop up a window in an hour and
    five minutes, reminding me to throw the current load of wet laundry into the dryer.
    Once an alarm has been created, the alarm list looks like Figure 11.


    A number of customization options are available. You can specify a file to open
    or a command to run instead of just displaying a window; you can require an acknowledgment
    to be entered before the alarm is dismissed; and you can control the repetition
    (or lack thereof) in a variety of ways. The controls on the Recurrence tab are
    enabled if you select the Recur option button in the Repetition option group;
    these controls allow you to determine how often the alarm is repeated as well
    as when the recurrence will end.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_242_0.png)


    Figure 11. The KAlarm window with an activated alarm.


    # KArm


    As a software developer, I think that probably every one of my friends and acquaintances
    has created their own custom time and billing package so that they can track their
    time and then send accurate invoices to their customers.


    In the same batch of utilities as KAlarm is KArm, a simple time tracker. Before
    you drive yourself crazy trying to figure out what acronym or hidden meaning is
    behind the name, relax—the word “karm” means “work” in the native language, Punjabi,
    of the author, Sirtaj Singh Kang. You can start KArm by clicking Main Menu | Accessories
    | More Accessories | KArm. Figure 12 shows the KArm window with several tasks
    entered.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_242_1.png)


    Figure 12. The KArm window with several tasks and subtasks.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'You can enter a combination of top-level tasks (such as “Linux Transfer for
    Power Users”), subtasks, such as “Chapter 8—Productivity,” and then cascade subtasks
    (such as the File Roller, KAlarm, and KArm tasks) under the “Chapter 9—Utilities”
    task.


    To create a task, select a menu option under Task—“New” or “New Subtask” as appropriate.
    You can create subtasks under the currently highlighted task in the KArm window.
    The same dialog allows you to edit the task name as well as get a running start
    on the time spent on the task. For example, selecting Task | Edit will open the
    dialog shown in Figure 13.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_243_0.png)


    The two option buttons, “Edit absolute” and “Edit relative,” can be confusing.
    They’re used for adding time that has already elapsed to a task that you’ve just
    created. “Edit absolute” allows you to replace whatever values are already there
    with values you enter, while “Edit relative” allows you to add more time to an
    existing amount. For example, in order to create Figure 12, I created a task for
    Chapter 8, and then entered an absolute time, 23:51, into the task. However, I
    had turned on the KArm task about seven minutes after I started working. Thus,
    to get the 12-minute value in Figure 12, I entered 5 minutes in the “Edit relative”
    boxes.


    Once you’ve set up a task, you’ll want to start the timer against a specific task.
    The easiest way is to simply click the task or subtask. When you do so, a little
    clock will appear to the left of the elapsed time, as shown in Figure 14.


    When you want to switch from one task to another, just click that new task—you
    can’t have the timer running on more than one task at a time.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_243_1.png)'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# PDF viewers


    Adobe Acrobat’s PDF (Portable Document Format) file format has become a *de facto*
    standard in the world of exchanging read-only documents. With hidden information
    problems that can accompany Microsoft Word coming to light over the past year,
    people have been turning to PDFs as a means of providing information in a safe,
    non-alterable format.


    I’ve already mentioned that OpenOffice.org has a built-in PDF-creation capability
    that’s accessed by a button on the main toolbar. But that’s for *creating* PDFs.
    Once you *have* a PDF, how do you read it?


    Fedora Core ships with not one, not two, but four different PDF viewers. Although
    the PDF file format has been published so that third parties (like OpenOffice.org)
    can create PDF files as well as read them, the format continues to evolve; as
    of this writing, version 6 is the most recent. And even earlier versions have
    a variety of features that may not work in a specific reader. In addition, not
    all of the readers that come with Fedora Core have been kept up to date.


    As a result, different readers may have better luck with different PDF files.
    If you have trouble with one PDF viewer, you may want to try a different one for
    better results.


    The four viewers are Ghostview, Kghostview (KDE’s PDF viewer based on Ghostview),
    xpdf, and GNOME PDF Viewer, which is based on xpdf. The Ghostview viewers that
    ship with Fedora Core are a little long in the tooth and often don’t display recent
    PDFs correctly, if they can open them at all.


    The xpdf-based viewers are much more robust, handling PDFs created with Adobe
    Acrobat and OpenOffice.org perfectly. **Figure 15** shows GNOME PDF Viewer with
    a 300-page PDF created with Adobe Acrobat, while **Figure 16** shows xpdf displaying
    a PDF created with OpenOffice.org running on Linux.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_244_0.png)


    **Figure 15. A PDF created with Adobe Acrobat and viewed with GNOME PDF Viewer.**'
  merge: -1
  img_proc: true
- pgno: 245
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_245_0.png)


    Both GNOME PDF Viewer and xpdf are available through the Main Menu | Graphics
    menu on Fedora Core, as well as through the “Open with…” context menu in Konqueror.
    Nautilus displays only the GNOME PDF Viewer option on its “Open with…” context
    menu.


    # Preference applets


    The Preferences menu has a number of handy applets that help you customize your
    system. Here are four that I find useful: Control Center and Keyboard Shortcuts
    (under the Preferences menu) and CD Database, and Sessions (under the More Preferences
    menu).


    The Control Center (see Figure 17) is somewhat similar to the Windows Control
    Panel; it provides a one-window point of access for user preferences. If you''re
    spending a bunch of time tuning your preferences, use this window instead of opening
    the Main Menu over and over.


    The Keyboard Shortcuts applet is great. With it, you can configure a variety of
    keyboard shortcuts for specific Desktop and Window Management actions, as shown
    in Figure 18. For example, scroll through the Window Management actions until
    you get to the “Switch to workspace 1” action, which is undefined by default.
    Simply press the keyboard shortcut you want to use for this action; I use <Control>-1
    and <Control>-2 for switching between the two workspaces I have defined on my
    desktop.


    The CD Database applet, shown in Figure 19, allows you to point your machine to
    a database for fetching song information that is used by Grip and other CD rippers.
    (See the Config | DiscDB | Primary Server tab to see where it''s used.)


    The fourth applet is the Sessions preference tool. It allows you to specify which
    applications to start when you start a session, and whether or not you want to
    save and restore the state of the currently open applications on your desktop
    the next time you start up.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_246_0.png)


    **Figure 17. The Control Center provides one-stop shopping for all user preferences.**


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_246_1.png)


