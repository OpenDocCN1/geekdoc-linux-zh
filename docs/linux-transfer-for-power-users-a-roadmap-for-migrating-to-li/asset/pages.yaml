- pgno: 371
  md: '*“The world is flat.” “I recommend we close the U.S. Patent Office because
    everything worthwhile has already been invented.” “I can see a need for, someday,
    perhaps five computers in the world.” “Linux will never make it on the desktop.”*


    *People say all sorts of things, things that in retro-spect seem pretty silly.
    Linux, and in particular, Red Hat’s Fedora Core distribution, is landing on the
    desktop of more and more Windows users each day. These desktops have mature, full-featured
    versions of Linux suitable for day to day use, including not only a complete operating
    system but also a Microsoft Office-compatible application suite and a plethora
    of additional tools available for free download.*


    *But today’s experienced computer user doesn’t have time to set up and learn a
    new operating system and programs alone. This book shows a power user who is comfortable
    with using Microsoft Windows and associated popular applications how Linux works
    and how using it is similar in many ways to their current software.*


    *Then it guides them through the wonderful world of popular Linux applications
    that perform the same day to day functions they’re used to on their Windows computer
    – word processing, spreadsheets, presentations, graphics processing, email, Internet
    browsing, digital images, music and video, and more. Also addressed are file compatibility,
    how to connect to a Windows network, and, for those a bit more technically adept
    or curious, how things work “under the hood”.*


    *Computer users are discovering that they don’t have to pay hundreds of dollars
    for an operating system, and then hundreds more for common applications, and that
    the alternatives are less expensive and more secure. But there is a lot of choices
    out there. This book helps the experienced user get comfortable with those choices
    and how to use them.*


    U.S. $29.95

    Canada $44.95


