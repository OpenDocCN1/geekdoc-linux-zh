    # Basic operation of the desktop


    Because GNOME is the default, I’m going to cover it in fair detail. However, I’ll
    also discuss some KDE applets and features. As a result, this discussion assumes
    that you’ve installed all of GNOME and KDE as suggested in Step 21 of the “Installing
    Fedora Core” section in Chapter 2.


    There are four primary components to the GNOME desktop environment:


    +   - The desktop is the entire area on the screen except for the bar at the bottom.

    +   - The panel (Linux-speak for the Windows taskbar) is the strip at the bottom
    that contains a variety of icons and widgets.

    +   - The Main Menu (the Linux version of the Windows Start menu) is displayed
    by clicking on the red fedora icon at the far left of the panel.

    +   - The system applets, which provide a graphical interface to using the OS,
    are found through various menu options via the Main Menu.


    # Desktop


    The GNOME desktop looks and feels much like other graphical desktops, complete
    with icons, wallpaper (in Fedora core, they’re called Desktop Backgrounds), screensavers,
    and, when applications are open, windows. Double-clicking an icon on the desktop
    runs the program or opens the file associated with the icon. Right-clicking an
    open area of the desktop displays a context menu from which you can choose a different
    background.


    Screensavers can be configured by clicking Main Menu | Preferences | Screensavers,
    as shown in Figure 4.'
