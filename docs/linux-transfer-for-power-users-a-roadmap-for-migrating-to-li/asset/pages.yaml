- pgno: 75
  md: '# Sound Card


    The Sound Card configuration screen allows you to confirm that a sound card, if
    found, is operating properly. If detected, the sound card is identified, and you
    are offered the chance to test it.


    **Step 5.** Click the Play Test Sound button. A sound will be played out of each
    speaker in turn, and then out of both speakers at the same time. Then you are
    asked if you heard the sounds properly, as shown in **Figure 59**.


    If you heard the sounds properly, click Yes; otherwise, click No. If you click
    No, you''ll be given the chance to configure the sound card manually.


    **Step 5a.** After you are done, click Next to move to the Additional CDs screen,
    shown in **Figure 60**.


    # Additional CDs


    You can giggle now if you like. The Additional CDs screen says, “If you have any
    of the CDs listed below…” but there aren''t any CDs listed. This screen is an
    errant holdover from the installation routine in Red Hat 9 and earlier.


    **Step 6.** Just click Next to move to the Finish Setup screen, shown in **Figure
    61**.


    # Final Setup


    The Final Setup screen simply confirms that installation is complete.


    **Step 7.** Click Next to finish installation and move to the login screen, shown
    in **Figure 62**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_75_0.png)


    *Figure 59. Sound card detection confirmation.*'
  merge: -1
  img_proc: true
