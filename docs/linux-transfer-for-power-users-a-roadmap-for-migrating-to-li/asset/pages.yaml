    **Figure 36.** Dialogs that appear when you (left) click the Red Hat Network Alert
    Notification Tool icon.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_111_1.png)


    **Figure 37.** The Red Hat Network Alert Notification Tool is a remnant of Red
    Hat Linux.


    Then, when you click the Launch up2date button, you’ll be prompted for the root
    password, and then you’ll see the same “Welcome to Red Hat Update Agent” screen—as
    if you’d clicked the Register with RHN button in the previous screen. Go figure.


    # ### Summary


    The mechanisms for updating Fedora Core are possibly one of its best-kept secrets.
    I’ve heard Windows users claim superiority despite the security holes constantly
    found in that operating system—because “Windows is easy to update; just click
    ‘Windows Update’ and that’s that!”


    Fedora Core’s mechanism is actually better, both because updates require rebooting
    only if the kernel is modified, and because the source of updates is distributed
    across many servers on the Internet. If you take the time to configure up2date
    for your location, updating couldn’t be simpler!'
