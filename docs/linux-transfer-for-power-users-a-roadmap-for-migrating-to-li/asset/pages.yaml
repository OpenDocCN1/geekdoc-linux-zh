    print-queue settings.


    # Scanners


    When you think about it, a scanner is really just a printer in reverse, right?
    So setting up a scanner is pretty similar. After plugging in your scanner, select
    Main Menu | Graphics | Scanning. This starts the XSane scanning software. The
    first time you load XSane, you’ll be prompted to answer a license agreement, shown
    in **Figure 17**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_305_1.png)


    **Figure 17.** The XSane license agreement appears only the first time you start
    XSane.'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'After you click **Accept**, XSan e will attempt to locate the scanner attached
    to your computer, and will display a dialog telling you so, as shown in **Figure
    18**.


    If XSan e fails to locate or connect to a scanner, you''ll get a message like
    the one shown in **Figure 19**. I mention this because it''s important to click
    the Help button. Unlike a lot of error dialogs that purport to offer assistance
    (you know, with advice like "The software was unable to connect to the device.
    Check the documentation that came with the device for more information."), clicking
    the Help button here opens a dialog with a variety of suggestions that may prove
    significantly more helpful. See **Figure 20**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_306_0.png)


    **Figure 18**. XSan e will tell you it''s looking for devices.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_306_1.png)


    **Figure 19**. If a device isn''t found or a connection isn''t available, you''ll
    see an error message similar to this one.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_306_2.png)


    **Figure 20**. The XSan e help is more helpful than many other software packages.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'True, some of the options may still be obscure, but given the wide variety
