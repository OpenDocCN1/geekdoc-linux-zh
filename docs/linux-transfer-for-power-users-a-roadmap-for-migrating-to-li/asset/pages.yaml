- pgno: 79
  md: 'To shut down, click the Red Hat icon in the lower left corner of the screen,
    and select the Log Out menu option. You can choose to simply log out, to reboot
    the machine, or to shut the machine down completely.


    If you log out, the Username login screen will be displayed just as it was in
    Figure 62. If you either reboot, or start the machine up after shutting it down,
    you''ll be greeted by the boot menu screen, as shown in Figure 66.


    If you don''t press Enter within 10 seconds, Fedora Core will start automatically,
    and you''ll soon be greeted by the Username login screen as described earlier.


    And that''s that!


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_79_0.png)


    Figure 66. The boot menu screen appears upon reboot or machine startup.


    # Advanced Topics/Alternatives/Options


    Installation doesn''t simply consist of a single path, straight and narrow. As
    you''ve seen, you can make a number of choices along the way, such as partitioning,
    setting IP addresses, and so on. In this section, I''ll discuss each of these
    alternatives.


    # Modifying automatic partitioning''s choices


    In step 12 of the "Perform installation" section, you had the choice to examine
    (and modify) the choices made by the installation routine''s automatic partitioning
    mechanism. At the time, you just accepted the defaults and moved on. Now I''ll
    explain how to modify those choices and suggest some alternatives.


    If you select the Review Choices check box in Figure 27, Fedora Core''s installation
    routine will create three partitions and then display them when you click the
    Next button in step 12. This display looks something like Figure 67.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_80_0.png)


    **Figure 67.** The Disk Setup screen, showing the default partitions created by
    FC.


    There are two parts to the right pane of this screen. The first is the Drive bar
    across the top of the pane, showing you graphically how the hard disk is divided
    up into partitions. (If your computer has more than one hard disk, there will
    be a separate bar for each disk, stacked one above another, with each stretching
    all the way across the screen.)


    The second part is the list of devices, drives, and partitions on each drive,
    shown in the bottom half of the right pane. Figure 67 shows one hard disk with
    three partitions. The first rows shows the device name, and subsequent rows identify
    each partition, together with information about that partition.


    If there is a second disk, it will be listed after the last partition of the first
    disk, with rows for each of its partitions and their information under the row
    for the disk itself. Selecting a partition in the device list will also highlight
    the partition in the drive bar, as shown in **Figure 68**.


    Automatic partitioning creates three partitions by default: one for *swap*, one
    for `/boot`, and one for `/`, as you can see in Figure 68. If you want to modify
    this configuration, you can use the buttons between the Drive bar and the partition
    list. For example, suppose you wanted to create another partition. Assuming there
    was no available disk space, you would have to resize one of the existing partitions
    to create some available space, and then create a new partition in that newly
    freed-up space.


    Specifically, here are the steps you would follow to create a fourth partition
    for `/home` by taking some of the space used by `/`. First, highlight the `/`
    partition in the device list, as shown in Figure 68. Second, click the **Edit**
    button to open the *Edit Partition* dialog, shown in **Figure 69**.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_81_0.png)


    **Figure 68. Selecting a partition in the Disk Setup screen also highlights the
    partition in the Drive bar at the top of the screen.**


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_81_1.png)


    **Figure 69. The Edit Partition dialog allows you to change the attributes of
    an existing partition.**'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'The Edit Partition dialog allows you to modify attributes of the partition,
    including the size, how the size is determined, the mount point, and so on. For
    the purposes of this example, reduce the size of the 3679 MB / partition by half
    a gigabyte. This will leave that half gigabyte free, and you can use that to create
    another gigabyte. (As a matter of practicality, leaving 3179 MB for the / partition
    may not be enough, depending on how much software you''re planning to install
    on the system.) Click OK and you''re returned to the Disk Setup screen.


    Next, click the New button to bring forward the Edit Partition dialog again. (Yes,
    I know you''re not editing an existing partition, but that''s what the dialog
    says.) Because you''re creating a brand new partition, you should go through each
    object in the dialog. First, select the mount point from list, as shown in Figure
    70. In this example, that''s /home.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_82_0.png)


    > **Figure 70.** *The Mount Point list allows you to assign a mount point to the
    partition being edited.*


    Second, click the Fixed Size option button. Then enter "500" in the "Size (MB)"
    text box. Third, click OK to return to the Disk Setup screen.


    As an aside, remember that you can only have four primary partitions on a single
    hard disk. If you want to create more than four partitions, you can keep clicking
    New and adding partitions to your system, assuming you''ve got the disk space
    for it. Disk Druid will automatically create an extended partition and logical
    partitions within that extended partition as needed. If one of the partitions
    you''re creating absolutely has to be a primary partition, select the "Force to
    be a primary partition" check box in the Edit Partition dialog. One of the existing
    primary partitions will be converted to a logical partition.


    # Customizing the boot loader options


    The two things I''m going to mention with respect to boot loaders aren''t necessary
    during your first (or even your fifth) installation. However, they''re nice to
    know, and may come in handy as you become more experienced.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Writing to the Master Boot Record


    The first item is determining whether or not this installation is going to write
    the boot loader to the Master Boot Record. This is done during step 14 of the
    “Perform installation” section. If you don''t understand the concept of writing
    boot loaders now, don''t worry—file it away for later. Click the Change Boot Loader
    button in the upper right of the screen shown in Figure 28 to open the Change
    Boot Loader dialog, shown in Figure 71.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_83_0.png)


    Figure 71. The Change Boot Loader dialog allows you to prevent the boot loader
    from being written to the Master Boot Record.


    If you want to install GRUB into the Master Boot Record as the boot loader for
    this installation (which is the default), you''d do nothing in this dialog. However,
    if you do *not* want to install a boot loader into the Master Boot Record for
    this installation of Fedora Core, select the “Do not install a boot loader” option
    button and then click OK. This option comes in handy if you''re installing Fedora
    Core on a machine that already has an operating system (such as Windows) that
    has its own boot loader in the Master Boot Record, and you don''t want to mess
    with it.


    # Editing the boot loader''s label


    The second item that is useful is editing the label on the current boot loader.
    When you finish with installation and start up your machine, you''ll be presented
    with a boot menu like that shown in Figure 66 earlier in this chapter. As you
    can see, there''s only one choice available, and the text on it has already been
    determined.


    There are a couple of reasons that you might want to change the text. Perhaps
    you just want it your own way. A more common reason is that if you install other
    operating systems, or if you install updates to this Linux installation, there
    will be multiple choices in this boot menu, like so:'
  merge: -1
  img_proc: true
- pgno: 84
  md: '+   Fedora Core (2.6.08-1.0189.npt1)

    +   Fedora Core (2.4.24-1.2222.npt1)

    +   Fedora Core (2.4.22-1.2115.npt1)


    You might want text labels that are more descriptive, which might remind you of
    the differences between the various choices, like so:


    +   FC 1 - 2nd 2.6 kernel (2.6.08-1.0189.npt1)

    +   FC 1 - new NVIDIA drivers (2.4.24-1.2222.npt1)

    +   FC 1 - original install (2.4.22-1.2115.npt1)


    To change the text, highlight the Fedora Core line in the list box in the middle
    of the right pane, and then click the Edit button immediately to the right of
    the list box. The Image dialog, as shown in Figure 72, will appear. To change
    what appears in the boot menu, change the value in the Label text box, and then
    click OK.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_84_0.png)


    **Figure 72. Changing the description of the operating system title in the boot
    menu.**


    # Assigning static IP addresses instead of using DHCP


    In step 15 of the “Perform installation” section, you assumed that you were going
    to use DHCP so that your computer would automatically be assigned an IP address
    by another box as necessary. What if you want to manually assign an IP address
    to your computer and keep it the same all the time—in other words, what if you
    want to use a static IP address?


    Technically, the IP address isn’t assigned to your computer, but to the Ethernet
    card inside your computer that connects your machine to the network. If you have
    more than one Ethernet card in your computer, you would have more than one entry
    in the Network Devices list box in the top half of Figure 29.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'In order to assign a static IP address to a specific Ethernet interface, highlight
    the interface of interest in the Network Devices list box, and click the Edit
    button in the upper right corner of Figure 29 to open the Edit Interface dialog,
    shown in **Figure 73**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_85_0.png)


    Figure 73. Use the Edit Interface dialog to assign a static IP address to a computer''s
    Ethernet card.


    You can use this dialog to enter data for the specific Ethernet interface that
    was highlighted in the Network Configuration screen (you can see this behind the
    Edit Interface dialog in Figure 73). That''s why the title bar of the dialog identifies
    the name of the device.


    First, uncheck the "Configure using DHCP" check box. Doing so will enable the
    IP Address and Netmask text boxes below.


    Second, enter the static IP address you want to assign to the Ethernet interface,
    and the netmask of the device as well. See **Figure 74** for an example.


    Finally, click OK to get back to the Network Configuration screen, as shown in
    **Figure 75**.


    The next step is to assign a name to the machine you''re working on, instead of
    letting the machine get a name automatically assigned to it (via DHCP). Click
    the "manually" option button in the Hostname area. Doing so enables both the Hostname
    text box and all of the text boxes under the Miscellaneous Settings label.


    Enter a hostname for the machine. You can enter simply a label, as shown in **Figure
    76**, or enter a fully qualified hostname---as shown in the example on the screen
    (host.domain.com).


    You can also enter the IP address for the gateway machine on your network (such
    as the IP address of your router) and the IP addresses for your DNS servers.


    Then click the Next button, and you''re all done with setting static IP addresses.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_86_0.png)


    **Figure 74.** Entering the static IP address for an Ethernet interface.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_86_1.png)


