    # # Applets


    Fedora Core comes with a number of handy applets that can be added to the panel.
    Which ones you find useful is, of course, a matter of personal preference. Here
    are three that I find indispensable.


    # ## Notification tool


    The one applet that everyone should have on their panel is the Red Hat Alert Notification
    Tool: the red/blue/green icon that indicates whether or not updates to the system
    are available. The use of this applet is discussed at length in Chapter 3, “Updating
    Fedora Core.”


    While goofing around with the menu as you''re customizing the various areas, it
    is possible for the Alert Notification Tool icon to disappear, and that can cause
    a fair amount of consternation. (For example, clicking the **Exit** menu item
    shown in Figure 6 in Chapter 3 will make the icon vanish.) Here''s how to bring
    it back.


    First, the Red Hat Network Alert Notification Tool icon resides in an area of
    the panel called the **Notification Area**. This entire area can vanish itself,
    and that is terribly frustrating. To bring the Notification Area back, right-click
    in a blank area of the panel to open the panel-editing context menu, as shown
    in Figure 24 earlier in this chapter.


    Sometimes it can be tricky to find a blank area. As you can see in Figures 6 and
    7, my panel is so jammed up with icons that it''s nearly impossible. If you''re
    having trouble finding a blank area that displays a panel-editing context menu,
    try closing all of your running applications to open an area on the left side
    of the panel. If that doesn''t work, try shrinking the size of the panel (say,
    from 30 pixels tall to 20 pixels tall). One result of this action will be to shrink
    the icons in the panel, thus leaving room between them.


