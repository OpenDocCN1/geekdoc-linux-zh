- pgno: 62
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_62_0.png)


    **Figure 37.** *The About to Install screen is your last chance to abort the installation.*


    # About to Install


    The About to Install screen is the last step in the installation wizard. The wizard
    claims that this screen is your last chance to make changes to choices you’ve
    made so far, as well as to simply cancel the installation completely, but the
    wizard lies.


    Once installation begins, notes regarding the progress are stored in a text file
    named “install.log” and stored in the /root directory. If anything went wrong
    during installation, you can examine this file for clues about what might have
    happened (or not happened). **Step 22.** Click Next to view the Required Install
    Media dialog, shown in **Figure 38**.


    # Required Install Media


    The Required Install Media dialog is your actual last chance to abort the installation.
    The list of CDs varies according to which Installation Type you selected and which
    packages you chose in earlier steps.


    **Step 23.** Once you’ve assembled the CDs you’re going to need, click Continue
    to move to the Installing Packages screen, shown in Figure 39.


    # Installing Packages


    Once the Installing Packages screen in the wizard appears, a series of dialogs
    pop up. These dialogs contain progress bars and describe the steps involved in
    preparing the system for installation of the software packages. **Figures 39 through
    42** show these dialogs.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# About to Install!


    Caution: Once you click Next, the installation program will begin writing the
    operating system to the hard drive(s). This cannot be undone. If you decided not
    to continue installation, this is the point at which you can safely abort the
    installation process.


    To abort this installation and return all installation media, at your computer''s
    Reset switch using Ctrl+Alt+Del.


    The software you have selected to install will require the following CDs:


    +   * Fedora Core 1 CD #1

    +   * Fedora Core 1 CD #2


    Please have these ready before proceeding with the installation. If you need to
    abort the installation and reboot your system, please select ''Reboot''.


    The Required Install Media dialog will begin installation. When done, you can
    be found in the general log after restarting the system. To verify that the installation
    took place, you can check the /var/log/install.log file.


    # Figure 38. The Required Install Media dialog describes which CDs will be needed
    during installation.


    # Installing Packages


