- pgno: 14
  md: '# Aeknowledgments


    A lot of people are involved in creating a book that covers a topic as broad as
    Linux on the desktop.


    Some of them are aware of what they did—and, even better, are still speaking to
    me at the end of the book! Chris Herborh, my technical editor, did something that
    most technical editors don''t do: made me laugh while I was reviewing his entertaining
    and occasionally caustic edits. Somehow we got on the same wavelength immediately,
    and that made putting this book together a lot of fun. Jeana Frazier, whom I''ve
    been working with for nearly a decade now, continues to tolerate my weaknesses
    and knows what I mean to say, sometimes even when I don''t know myself, and often
    figures out a better way to say it. She''s my ace in the hole and I sleep easier
    knowing she''s on my team.


    Other people, however, aren''t really aware of their contributions, and this is
    my opportunity to surprise them. Paul McNett, a fellow Visual FoxPro developer,
    weathered my early questions when I was learning to install some specialized applications
    in the earlier Red Hat days, while Ted Roche alternated between whipping me upside
    the head when I got too full of myself and providing constant moral support when
    the To Do list seemed to overwhelm. It''s hard to concentrate on writing when
    you''ve got a hundred other things on your mind. And Ed Leafe runs a couple forums
    for Fox developers who are jumping into the Linux game; some of the ProLinux regulars
    include Carl Karsten, Chet Gardiner, Derek Kailwaif, Leland Jackson, and Stephen
    Russell, to name but a few. Stay the course, Ed; I''ll grab a Mac with OS X one
    of these days!


    The members of the local Linux user group, the Milwaukee Linux Users Group, make
    up another major source of inspiration. Many of the Saturday afternoon meeting-goers,
    as well as folks who have never made it to a meeting but are there in spirit and
    on the mailing list, have helped me in one way or another. I''m sure I''m going
    to miss someone, but here goes ... Aaron Schrab, Andrew Hoyos, Doug Turner, George
    Moulton, Glenn Hollner, Jerry Davis, Joe Boker, Jonathan Chaillet, Jonathan Dettri,
    Luciano Moretti, Mary Ann Panevska, Phil Gombel, Rick Miller, Roger Jensen, Scott
    DeVos, TOM Francis, Tom Oele, and, of course, all of the Marks! (And, interrupting
    myself for a moment... if you haven''t joined a Linux user group in your hometown,
    I strongly encourage you to do so. Doesn''t matter how new—or experienced— you
    are with Linux, you''re bound to find someone else who will be able to help you
    with a difficult problem, or that you''ll be able to help her. And if there isn''t
    a user group in your area, start one! See www.meetup.com to find other Linux enthusiasts
    in your area.)


    While I''ve not met some of my local group members in person, the sense of community
    provided by other Linux users can''t be beat. It would have taken me a lot longer
    to get where I am without these folks.


    —Wilf Hentzen'
  merge: -1
  img_proc: true
