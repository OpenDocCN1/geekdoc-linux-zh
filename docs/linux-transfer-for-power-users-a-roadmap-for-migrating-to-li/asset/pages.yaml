- pgno: 135
  md: 'Depending on the height of the panel (which you can customize), the application
    boxes in the Taskbar section may show up in one or more rows. The bars shrink
    as their number increases, to the point that the legend may not be readable anymore.
    Holding your mouse over a specific box will display a tooltip with the full name.


    The Notification Area displays the time and the Red Hat Network Alert Notification
