- pgno: 296
  md: '# Chapter 12

    Devices: Printers, Scanners, CD Burners


    While the majority of this book has focused on what comes as part of the standard
    Fedora Core package, there’s one thing that you’re undoubtedly going to use that
    doesn’t come with Fedora Core: devices. Some devices have already been covered
    elsewhere in this book: I discussed a quick, step-by-step procedure for burning
    a CD-ROM in Chapter 2, and a similar procedure for downloading files from a digital
    camera in Chapter 10. In this chapter, I continue to show you how to use various
    common devices with your Linux desktop. I’ll show you how to hook up a local printer
    and how to configure a print queue, how to use a Fedora Core GUI application to
    burn CDs, and how to connect a scanner.


    As a software developer, I hang out with other programmers in many venues. And
    our common mantra has long been “If it weren’t for the darn hardware, our job
    would be a lot easier.” As a power user, you may have come to the same realization
    yourself. Nonetheless, hardware is here to stay, at least for a while, so we will
    have to learn to get along with it. Fortunately, there is a group of very bright
    programmers who enjoy interfacing with hardware, and their efforts have made our
    lives easier with respect to printers, scanners, and CD burners.


    # Printers


    Linux has gotten a bad rap for being hostile when dealing with hardware; in some
    cases, that reputation has been well justified. But great strides have been made
    in the last couple of years with Kudzu—the hardware-detection daemon from Red
    Hat—which automatically finds and configures new hardware attached to the system.
    Fedora Core is particularly friendly toward local printers.


    I’m going to discuss attaching a local printer to your Fedora Core box in three
    stages. First, I’ll discuss how Kudzu works when you simply plug a new printer
    into your computer, and what you can expect. Then I’ll describe how to set up
    a print queue. Finally, I’ll show you how a print queue works with typical software
    on your machine.


    What if you don’t let Kudzu configure your printer for you? As you’ll see, it
    doesn’t matter. You can configure your printer and add a print queue at the same
    time.


    # Kudzu


    If you plug a printer into your computer and then boot it up, the Kduzu daemon
    will typically detect that new hardware has been added (or removed) and offer
    to continue configuration for you. You can also skip the configuration at that
    time, and run Kduzu manually from a command prompt. You have to be logged in as
    root in order to run this command:


    ```

    /usr/sbin/kudzu

    ```'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'For more information about running commands like this manually, see Chapter
    14, “Under the Hood.”


    In either case, you’ll see a screen that looks like **Figure 1**, which appears
    when you run Kudzu manually after boot-up. During automatic detection during normal
    boot-up, this screen will vary slightly in that you’ll also have an option to
    skip Kuzdu configuration and run it later.


    In either case, if you continue with Kuzdu, the next screen identifies specific
    hardware and offers you several avenues to follow, as shown in **Figure 2**.


    The first option, Configure, configures your computer with the new hardware, be
    it a mouse, a printer, or an external drive. Once finished, you’re returned to
    where you were before Kuzdu started. You’ll probably use this choice almost every
    time you run Kuzdu.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_297_0.png)


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_297_1.png)'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'The second option, Ignore, allows you to ignore the device for good. You can
    have the device detected automatically later if you run Kudzu from the command
    prompt. This option is handy if you want to investigate the hardware you’re adding
    before running Kudzu, or if you want to manually configure the device yourself.
    You would also use this option when you’ve temporarily added a device that you’re
    going to remove soon.


    The third option, Do Nothing, sounds similar to Ignore, but it really isn’t. It
    allows you to temporarily ignore the device; the next time you boot up your computer,
    Kudzu will run again as if it were the first time. You might use this option if
    you’ve added a device but don’t want to spend the time configuring it right now.
    It usually doesn’t take long (a few seconds to a half minute) but in the event
    that something doesn’t work, you may end up spending more time getting it to work
    than you had planned, and it’s handy to be able to ignore the detection if you
    aren’t ready to commit the time.


    # Adding a print queue


    Once you’ve installed a printer, your second step is to create a print queue—a
    definition of how to talk to that printer from your computer.


    Select Main Menu | System Settings | Printing, and you’ll be asked for the root
    password because you’re changing system-wide settings. Upon successful entry of
    the password, the “Printer configuration” dialog will appear (see **Figure 3**).


    Click the New button to start the “Add a new print queue” wizard, shown in **Figure
    4**.


    Click the Forward button, as there’s not that much interesting on this screen,
    and you’ll be greeted by the “Queue name” dialog, shown in **Figure 5**.


    The queue name is used throughout your system when you print, so you’ll want to
    provide a short but descriptive name. “LocalHP400” or “MyCanon1200” are pretty
    good names, while “BozoMan” and “MyPrinter” are probably not so good. Exactly
    what you use depends on the variety of printers you might have access to. If you
    have a number of different laser printers, the queue names used in Figure 5, locally,
    wouldn’t be descriptive enough, but if you only had a laser and an ink jet, then
    that semi-generic name would be fine.


    You can add more information about your print queue in the “Short description”
    box if you need. It’s probably a good idea to identify at least the make and model,
    maybe the location (although some printers tend to be moved a lot), and perhaps
    any other printer-specific or queue information.


    Click the Forward button to see the “Queue type” dialog, shown in **Figure 6**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_298_0.png)


    **Figure 3.** Set up definitions for how to connect with a printer.'
