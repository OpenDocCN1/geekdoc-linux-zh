- pgno: 239
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_239_0.png)


    # Figure 6. The default form for archives that contain subdirectories is to display
    the folder itself, not the contents.


    When an archive includes subdirectories, its main window displays the folder itself,
    not the contents (the files) of the folder. This is File Roller’s default behavior.
    I don’t care for this, because I rarely care about folders more than I care about
    their contents. You can change the view by selecting View | View All Files. Doing
    so will change the display of the File Roller window, as shown in Figure 7.


    The nice thing about the view in Figure 7 is that you get the best of both worlds.
    You can see the files themselves, but you also see the directory location in the
    last column in the window. In Figure 7, you can see that the file “EvenMoreImportantDataFile.txt”
    is in the “RollerSubdirectory” directory, as expected. Note that the “/” in the
    Location column indicates that a file is in the root of the archive, not the root
    directory of the file system.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_239_1.png)


    # Figure 7. Selecting View | View All Files displays them in an archive, regardless
    of directory location.'
  merge: -1
