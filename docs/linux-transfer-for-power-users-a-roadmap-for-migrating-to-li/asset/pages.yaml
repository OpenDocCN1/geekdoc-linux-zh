- pgno: 234
  md: '# Chapter 9

    Fedora Core Utilities


    There is a breed of human being that insists on collecting tools that can only
    be used for the most arcane and specialized of purposes. Some folks have a workshop,
    garage, or kitchen that holds tools that were used only once, seven years ago,
    for one particular project. These are the people who insist on a quid pro quo—if
    you’re going to make me do another home repair project, my price is that I get
    to visit the hardware store with our joint checkbook. For these types of folks,
    a popular Linux distribution like Fedora Core is a veritable paradise, because
    it includes more software tools than they’d ever be able to use in one lifetime.
    This chapter takes a look at some of the more popular tools available with Fedora
    Core.


    Some Windows zealots point to the variety and abundance of programs as a significant
    reason for using Windows over another operating system. While in some situations
    this claim has merit—for example, there are more vertical market applications
    such as dentist office billing software or freight rate calculation tools—in the
    area of utilities and system tools, there’s really no point. There may be 250
    utilities to edit an icon on Windows and only a dozen for Linux. Do you really
    need 250 “me-too” programs to sort through? At some point, the time-consumiveness
    of monotonous redundancy overrides the usefulness of choice and variety.


    Linux was entering a stage where Windows was a number of years ago: There’s enough
    critical mass and a growing body of ordinary users that people find it rewarding
    to write end-user software and distribute it for public use. We’re now at that
    exciting stage in which power users will become a louder and louder voice, expecting
    and demanding software to be well designed, easy to install, and reliable. Many
    of these tools have become part of popular distributions: Consider File Roller
    (the Linux equivalent to WinZip), and xpdf (an open-source replacement for Adobe
    Reader).


    Let’s take a look.


    # File Roller


    File Roller is a GUI tool that performs file-compression and archiving functions.


    In the olden days, file-compression software was a required utility if you were
    sending files electronically via modems in order to reduce the time (and money)
    spent online. While file compression isn’t quite as important as it used to be,
    due to the increased perversaivity of high-speed connections, it’s still useful,
    particularly if you’ve graduated to sending huge files across the Internet.


    An archive is a collection of files put into one file. The files can all be in
    one directory, or they can span multiple directories and subdirectories. Archives
    are probably more useful now than in the past, as it seems that everyone has a
    hard disk full of files that they rarely use, but don’t dare delete altogether.
    An archive doesn’t have to be compressed, but it often is.


    Linux has long had a number of command-line tools that perform these functions,
    such as tar, zip, gzip, and bzip2. However, each of these requires its own syntax,
    and a misstep can end up ruining files. File Roller provides a friendly and more
    foolproof front end for these utilities.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Unlike Windows, where compressed and archived files all end up as ZIP files,
    each of these Linux functions has its own file format. In addition, when you combine
    the two functions, the result ends up with either a combination of the two inputs,
    or a third file format altogether.


    # Formats


    Archive file extensions generally end in “ar”. For example, the most common Linux
    archive format, a tar archive, has an extension of “.tar”. ZIP files created on
    a Windows machine have a “_.zip” extension (and can be read by File Roller), while
    tar archives compressed with gzip carry either a “.tgz” extension or a double
    extension of “.tar.gz”. The File Roller help file lists the archive file formats
    and matching extensions, which are shown in Table 1.


    | Format | File Name Extension |

    | :--- | :--- |

    | ARJ archive | .arj |

    | Enterprise archive | .ear |

    | Java archive | .jar |

    | LHA archive | .lzh |

    | Resource Adapter archive | .rar |

    | Uncompressed tar archive | .tar |

    | Tar archive compressed with bzip | .tar.bz | .tbz |

    | Tar archive compressed with bzip2 | .tar.bz2 | .tbz2 |

    | Tar archive compressed with gzip | .tar.gz | .tgz |

    | Tar archive compressed with lzop | .tar.lzo | .lzo |

    | Tar archive compressed with compress | .tar.Z | .taz |

    | Web archive | .war |

    | PKZIP or WinZip archive | .zip |


    **Table 1. Formats of common Linux archive and compressed files.**


    Note that the Java archive “formats” (JAR, WAR, and EAR) are just ZIP files with
    different names. You don’t need special tools to work with them.


    In other words, you can create an archive without compressing the files in it.
    The result would be simply an archive file, such as YourArchive.tar. Or you can
    also compress the files by using a tool such as gzip, in which case the result
    would be a compressed archive, such as YourCompressedArchive.tar.gz. But you can’t
    just compress a file without creating an archive with File Roller (but you can
    do it with a compression tool using the command line, of course).


    # Using File Roller


    You can use File Roller to perform two opposite functions. The first is to create
    an archive, optionally compressing the files during the archive process. Naturally,
    the second is to extract files from an archive.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Creating archives


    Run File Roller by clicking Main Menu | Accessories | File Roller (see Figure
    1).


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_236_0.png)


    *Figure 1. The main File Roller screen before adding files to an archive.*


    To create an archive, the first thing you do is create an archive. Ho, ho, ho.
    Just love saying that. With WinZip, you can create archives on the fly after selecting
    a bunch of files, or by creating an archive file, sort of as an empty shell. With
    File Roller, you don''t have both options; you need to create the archive file
    first. Then you add files to it.


    To create an archive file, first click the New button on the toolbar (select Archive
    | New from the menu, or press Ctrl-N) to open the New Archive dialog. Enter a
    name for the archive file, and then select the type of archive by opening the
    Archive Type combo box, shown in *Figure 2*.


    If you enter an extension with the name of the archive, keep Archive Type set
    to “Automatic,” and File Roller will automatically determine the archive type
    from the extension you''re using. If you choose an archive type, don''t include
    an extension with the file name, and the appropriate extension will be added to
    the archive once it''s created. In either case, click OK to return to the main
    File Roller dialog, as shown in *Figure 3*.


    You can see the name of the archive in the title bar. In *Figure 3*, the archive
    is named “SampleArchive.tar.gz”. If you decide to abandon the archive process
    before adding files to the archive file, File Roller will delete the newly created
    archive file.


    Now that you''ve got an archive file started, add files to it. Click the Add button
    in the toolbar (or use the menu, or a keystroke combination) to open the Add Files
    dialog, shown in *Figure 4*. You can also drag files from Nautilus into File Roller.


    In *Figure 4*, I''ve highlighted three of four files in the directory /home/whill/RollerStuff.


    In *Figure 4*, I''ve highlighted three of four files in the directory /home/whill/RollerStuff.
    Clicking the OK button will add those files to the archive, resulting in a main
    File Roller dialog, shown in *Figure 5*.


    Note that in *Figure 2* you could have selected a simple archive, without compression,
    such as the “tar uncompressed (.tar)” option. Doing so would have resulted in
    a file named SampleArchive.tar.


    Once you''ve added files to an archive, the disabled options in *Figure 4* become
    available. You can choose from a variety of advanced options. For example, you''ve
    choose just certain files, according to file name masks (such as *.txt to add
    just files with a .txt extension) that you enter in the Selection text box. Another
    option is to add files only if there isn''t a newer version already in the archive.'
  merge: -1
  img_proc: true
