- pgno: 123
  md: '# How to search


    So now you’ve made it to the main screen. What do you do now? Here’s a real-life
    example.


    As mentioned in Chapter 3, “Updating Fedora Core,” one of the most frequent questions
    asked on the mailing lists has to do with updates. If a user depends on the default
    servers for update files, a variety of errors can occur. Searching on the exact
    text in the error messages is one way to look for messages that relate to this
    problem. If you can do that, it’s a great idea.


    However, that’s not always possible, either because you just plan forget to copy
    the message down exactly, or if flashes by the screen too fast to write down,
    or the message is so generic that it ends up delivering a zillion hits on a Web
    search.


    That doesn’t mean that you’re out of luck, though. The archives are not so voluminous
    that searching on generic terms won’t result in some little matches. For example,
    when I searched on “update” and “strange error,” I found the message displayed
    in Figure 7. This message provides the answer to the problem instantly. It gives
    instructions on how to configure update and yum to connect to mirrors for downloading
    updates instead of relying on the defaults provided with Fedora Core.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_123_0.png)


    Figure 7. Sample result of searching for “update” and “strange error” text in
    the fedora-list archives.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Don’t assume that a generic-sounding message will automatically generate so
    many hits that the search results are useless. For example, another common error
    in the early Fedora Core days had to do with trying to install packages via the
    RPM tool accessed via System Settings | Add/Remove Applications.


    The operation would fail, and generate an error message as shown in Figure 8.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_124_0.png)


    **Figure 8. At first, a generic error message doesn’t offer much hope for targeted
    searching.**


    This is a terrible error message—not much better than the classic messages so
    common on Windows systems, such as “Install failed” and “There was an unexpected
    error.”


    Not only is this message woefully unhelpful (couldn’t the programmer have done
    something to help the user out a bit?), but it is so generic that there is certainly
    not enough to search on, wouldn’t you say? Surprisingly enough, though, this was
    enough to go on. Doing a Google search on “Fedora” and “There was an error installing
    packages.” generated 70 hits. The first page of the Google results is shown in
    Figure 9.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_124_1.png)


    **Figure 9. Searching on “Fedora” and a generic error message produced a manageable
    number of hits.**'
  merge: -1
