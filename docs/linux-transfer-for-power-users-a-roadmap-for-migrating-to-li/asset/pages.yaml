    Now that I’ve shown you how to operate and customize the panel, what about those
    tips you get from looking over someone’s shoulder? Everybody’s work needs and
    habits are different, but I’ll share how I’ve selected the applications on my
    panel in the hopes that you’ll find some useful applications as well.


