- pgno: 278
  md: '# # Chapter 11

    ## Multimedia: Audio (and Video)


    The classic examples of multimedia applications are listening to music (audio)
    and watching movies (video). Multimedia, unlike other popular end-user applications
    like word processing, spreadsheets, and e-mail, puts a strain on hardware and
    requires software that’s more sophisticated and powerful than a simple office
    suite or Web browser. As a result, Linux hasn’t always kept up with Windows in
    this arena. In this chapter, I’ll explore what a power user can do with multimedia
    today.


    The media has been abuzz over the last year about how Hollywood is moving toward
    Linux in a big way: Every month brings another report about how a major studio
    or project has moved to a farm of off-the-shelf Linux machines to replace their
    previous (that’s spelled “expensive”) workstations for digital media. Indeed,
    2003 saw animation studios such as Pixar, Industrial Light and Magic, and Dreamworks
    all move to Intel-based computers running Linux. However, these installations
    aren’t for the faint-hearted; for example, the Pixar move involved eight blade
    servers containing 1024 2.8 GHz Xeon processors. In many cases, bucketloads of
    custom software are also involved.


    This detail—the level of sophistication involved in these moves—is sometimes overlooked
    in the enthusiasm of those reporting the stories, and thus leads to unrealistic
    expectations on the part of regular computer users.


    Deploying multimedia functions on the Linux desktop is still a mixed bag. Sound—listening
    to your favorite Led Zeppelin tune, downloading the latest Enya demo, or reminiscing
    to an ancient Firesign Theatre booleet that a friend just ripped for you—is ready
    for prime time no matter where you are. But video capabilities are erratic and
    immature. Between beta-quality software, competing formats, and inept digital
    rights management (or, as some refer to it, “digital restriction management”"
    techniques, it’s a tussle whether you’ll be able to properly play an MPEG of your
    cousin’s wedding in Fiji that he posted on his Web site before leaving on his
    honeymoon, or if the new Matrix Regurgulated DVD will display at all.


    But we’re getting there. Remember, a couple of years ago, the experts all stated
    that Linux would never be usable on the desktop.


    # ## Audio


    Listening to music or other audio files is nearly a prerequisite with a computer
    these days; indeed, I haven’t played music on a stereo system in years. Naturally,
    you’ll want to be able to use audio on your Fedora Core system. Here’s what you
    have to do.


    # ## Testing the sound card


    The first thing you’ll want to do is make sure your sound card works and is recognized
    by Fedora Core. I’m making this sound like a bigger deal than it really is; normally
    you’ll do the sound-card detection during installation and won’t have any problems.
    If you skipped that step during installation, or if you’ve since changed your
    sound card and need to check it out again, here’s how.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'Select Main Menu | System Settings | Soundcard Detection. You’ll be prompted
    for the root password, because you’re messing with the system in general, and
    not just your own settings. Once you enter the password, you’ll be greeted by
    the Audio Devices screen, shown in Figure 1.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_279_0.png)


    Figure 1. The Fedora Core Audio Devices dialog allows you to test your sound card.


    If a physical device was found in the computer, it’ll be identified and you can
    click the “Play test sound” button to see if Fedora Core can send sounds through
    it. You should hear a tone in the right speaker, then a tone in the left speaker,
    and then a tone in both speakers at the same time.


    Then you’ll be asked, “Did you hear the sample sound?”


    If yes, you’re all set; if not, you’ll get a message that says, “Automatic detection
    of the sound card did not work. Audio will not be available on the system. Please
    click OK to continue.”


    I’ve only had the sound-card detection fail on one machine in two years, and that
    was on an old, old box with a terribly antiquated sound card. I went to the local
    computer store and picked up a new Sound Blaster for $30 and all was good again.


    # Playing a CD with CD Player


    Playing a CD on Fedora Core is essentially a trivial process. Stick the CD into
    the CD-ROM drive, wait a few seconds for the drive to spin up, and the CD Player
    applet will appear, as shown in Figure 2.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_279_1.png)


    Figure 2. The CD Player applet that comes with Fedora Core.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'If you''ve used a CD player or VCR before, you''ll be able to understand the
    controls in short order. The CD-style controls at the bottom of the screen provide
    standard functionality: previous track, rewind, play/pause, stop, fast forward,
    next track, and eject. Above the controls are the **Track** Editor button, which
    opens the CDBB **Track** Editor screen shown in **Figure 3**; the **Preferences**
    button; and a drop-down combo box that allows you to select and play a specific
    track on the CD.


    The slider above those three buttons is a progress bar that shows you how far
    through the song the player has moved. The slider in the upper right corner is
    the volume control, and the display screen shows you information about the current
    track.


    If you forget any of these, you can noodle them again by moving your mouse over
    the control and reading the tooltip.


    If you close CD Player while a CD is in the drive, you can open it again via Main
    Menu | Sound and Video | CD Player.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_280_0.png)


    *Figure 3. The CDBB Track Editor that''s part of the CD Player.*


    # Moving CDs to disk, so you can keep them with you


    While some folks are content to pop CDs in and out of the drive, others prefer
    to copy the contents of their CDs to a hard disk. Doing so not only saves you
    from lugging a bunch of CDs around (I know some folks who have hundreds of CDs
    on a hard disk), but also saves wear and tear on the drive. Getting a track (I
    don''t call them "songs" because all this applies to other types of digital audio,
    such as recordings of the Boston Pops and George Carlin comedy routines) from
    a CD to a hard disk is not simply a matter of copying a file from the CD, as it
    is with other types of data files.


    Files on an audio CD are commonly stored in a format called CDDA, with an extension
    of CDA. If you view the contents of an audio CD, you''ll see a list of files with
    names like Track01.cda, Track02.cda, and so forth, and the file size is typically
    44 bytes. The rest of the'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'data is hidden from view. Copying the .cda file, if you could, wouldn''t result
    in a "satisfactory user experience," and so another software is required.


    Instead, one uses a piece of software called a "ripper" that extracts the raw
    digital audio files on the CD and creates a new type of audio file, a Wave file
    (WAV), which is usually stored on a hard disk. These WAV files are great for a
    number of reasons, including sound quality and ubiquitous acceptance, but they''re
    also huge. As an example, Bob Seger''s live rendition of "Nuthush City Limits,"
    a 4:37 track, becomes a 49 MB WAV file. That''s a lot of ones and zeros. Most
    people will then convert the WAV file to a different format that sounds just as
    good but takes considerably less space, such as MP3 or OGG. "Nuthush" in OGG format
    only takes 4.3 MB. However, some rippers will bypass creating the WAV file and
    generate an MP3 or OGG file immediately.


    # Audio formats


    Before I discuss the ripping processes, I need to discuss file formats in more
    detail.


    As mentioned, audio files can be saved in a variety of formats—in fact, a quick
    search on the Web will generate a list of more than 100. Popular formats include
    CDA (CD Audio Track), MP3 (Moving Picture Experts Group Audio Layer), OGG (Ogg
    Vorbis), RA, RAM, and RPM (varieties of RealNetworks Real Audio compressed streaming
    data), WAV (WAVEform audio format from Microsoft and IBM), and WMA (Windows Media
    Audio). Here''s a little more information about these formats:


    +   * CDA is the native format found on a CD and is transparent to file management
    programs such as Nautilus and Konqueror.

    +   * MP3 is a compressed format with very good sound quality. It requires a plugin
    or helper application. A proprietary format, MP3 requires royalty payments and
    can''t be used by open-source projects.

    +   * RA, RAM, and RPM: These formats are very highly compressed, with poorer
    quality sound. They require a plugin, and they''re proprietary.

    +   * WAV format has very good sound quality, is widely supported, but results
    in very large file sizes. The sound quality is so good because the file is an
    exact 1:1 copy of the digital data on the CD itself.

    +   * OGG offers very good sound quality in a compressed format. Vorbis is unpatented,
    and doesn''t have the licensing issues of proprietary formats such as MP3 or WMA.

    +   * WMA is a very good quality, proprietary format from Microsoft, and recent
    versions feature digital rights management. The WMA file extension (as opposed
    to ASF) indicates that the file contains only audio.


    # Which format should you choose?


    With so many to pick from, which should you choose? MP3 is the established leader
    because it was the first to market, but it''s a proprietary technology, which
    means it can''t be included in open-source projects. A similar issue restricts
    the use of the WMA format. Many open-source users have gravitated to the Ogg Vorbis
    format, which offers similar (and in some cases, superior) performance without
    the licensing issues associated with proprietary formats.'
  merge: -1
  img_proc: true
- pgno: 282
  md: "The downside of using Ogg Vorbis files is that the manufacturers of many portable\
    \ audio players (such as the Apple iPOD and the Creative line of USB players)\
    \ do not support OGG files—yet, at least.\n\nI’ll use the Ogg Vorbis format in\
    \ this chapter; if you choose to use a different open-source format, the concepts\
    \ and processes are similar. If you choose to use a proprietary format, you’ll\
    \ probably need to pay for a product because the owner of the format requires\
    \ royalty payments.\n\n# ## Using Grip to rip\n\nFedora Core comes with a CD-ripping\
    \ program called Grip, which provides the ability to rip a CD to a number of popular\
    \ formats, including WAV and OGG. Here’s how to use Grip.\n\n+   1. Pop an audio\
    \ CD into your drive, and close the CD Player window if it automatically appears.\n\
    +   \n+   2. Start Grip by selecting Main Menu | Sound and Video | More Sound\
    \ and Video Applications | Grip. The Grip window will appear, as shown in Figure\
    \ 4.\n\n![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_282_0.png)\n\nFigure 4. The main\
    \ Grip screen, with a Rolling Stones CD loaded in the drive.\n\n+   3. Configure\
    \ Grip. By default, Grip will create WAV files and store them in the “ogg” directory\
    \ under your home directory, such as /home/whf/ogg. (This is the default directory\
    \ regardless of what file format you select.) I’ll accept the defaults for now\
    \ and come back to this step later, once you’ve gone through the basic process.\n\
    +   \n+   4. On the Tracks tab of the main screen, select the track (or tracks)\
    \ you want to rip by right-clicking them, as shown in Figure 5."
  merge: -1
  img_proc: true
- pgno: 283
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_283_0.png)


    Figure 5. Right-click the Tracks tab to select the tracks to rip.


    If you do not select any tracks when you start to rip (discussed in the next step),
    you’ll be prompted as to whether or not you want to rip the entire CD, as shown
    in Figure 6.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_283_1.png)


    Figure 6. If you don’t select any tracks, you can rip the entire CD at once.


    +   5. Once you’re ready to rip (ahem!), click the Rip tab. You have two choices.
    If you simply want to rip the CD, automatically creating WAV files (remember,
    they’re about 10 MB per minute of playback time), click the Rip Only button. If
    you want to rip and convert the default WAV file to a different format, click
    the Rip+Encode button instead. The drive may take a few seconds to spin up, and
    then the process will begin. The two sets of thermometer bars in the bottom half
    of the Rip tab will display the progress. The top bar in each pair will scroll
    first, as shown in Figure 7, as the track is ripped.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_284_0.png)


    **Figure 7. The top and bottom bars display per-track and overall progress.**


    Once a track has been ripped, the bottom bar will scroll as the track is encoded.
    The ripping process creates a WAV file regardless of whether you''re encoding
    the track as well. The default behavior of Grip is to delete the WAV file after
    it has been encoded to another format so your hard disk doesn''t get filled up.


    However, note that the WAV files are all ripped first. With a CD that''s packed
    full of music (some can hold over 70 minutes), you might end up with 500 to 700
    MB of temporary WAV files before they''re all encoded into a different, smaller
    format.


    If you create a WAV file, and then later decide to Rip+Encode the same track,
    Grip will use the WAV file already on disk instead of creating the WAV file all
    over again.


    # Grip configuration options


    Grip acts as a front end to a number of ripping and encoding programs, and as
    a result, there are a lot of possible configuration options. Clicking the Config
    tab in the main Grip screen displays a set of seven subtabs, some of which have
    their own subtabs. All told, there are more than 60 options to choose from. Here
    are a few options that I''ve found useful.


    The default settings on the CD tab and both of the subtabs under the Rip tab are
    well chosen and I''ve never had a reason to change them. The Rip | Options tab
    has one option (Delay before ripping) that you might find useful if you''re experiencing
    errors. Sometimes the ripping process starts before the CD-ROM drive has had a
    chance to get spinning at full speed.


    The Encode tab, on the other hand, has a variety of choices. The Encoder tab allows
    you to choose which encoding program to use—I''ve left it at “oggenc” but if you
    want to change to a different one, you may need to find the encoder program (called
    a "codec" if that goes along with it. If you want your files to land in a location
    other than the default "ogg" directory under'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'your home directory, use the “Encode file format” text box to change it. The
    label says “file format” but it includes the directory as well, such as “~/.ogg/%Aa/%dd/%n.ogg”.


    If you wanted to store your files in the “music” drive under your home directory,
    you would change this to “~/music/%Aa/%dd/%n.ogg”.


    What do the funny-looking parameters mean? These are detailed in the help file,
    but to spare you the busywork of looking them up, the %Aa parameter is replaced
    by the artist’s name, the %dd is replaced by the album name, and, of course, the
    %n is replaced by the track number.


    Where does Grip find this information? Grip looks up an ID3 on the Internet, using
    a signature contained in most audio tracks. The DiscDB tab has a link to an online
    database that Grip uses by default.


    The ID3 and Proxy tabs contain specialized options that I’ve never had to worry
    about, but you might need to check them out if you’ve got particular needs. The
    Misc tab contains two options that I like a lot: “Do not lowercase filenames”
    and “Do not change spaces to underscores.” Of course, your preferences may vary.


    # **Tools to convert formats**


    What if you’ve already ripped your entire Barry Manilow and John Tesh collection
    in a format such as MP3 or WMA? The cynic in me might suggest that you press Delete
    and acquire some Bruce Springsteen and Rush, but then my wife would have me sleeping
    on the couch for the next decade or so.


    As with images, many tools are available for converting your audio files from
    one format to another. However, this idea is generally frowned upon. The reason
    is that compressed formats such as MP3 and OGG achieve much of their benefit by
    eliminating parts of the track that are either redundant or that human beings
    won’t hear. However, the MP3 and OGG people use different algorithms, so, in essence,
    they’re each getting rid of different parts of the data. Thus, converting from
    one of these formats to another will result in a “double dip” of data loss, to
    the extent that it could very well harm the eventual playback of the track.


    If you insist, however, the following Web site lists some third-party tools:


    [http://freshmeat.net/search/?q=convert%20ogg%20mp3](http://freshmeat.net/search/?q=convert%20ogg%20mp3)


    You’re on your own, of course, from here.


    # **Playing a ripped track from the hard disk**


    Once you have a track on your hard disk, how do you play it? Yes, you can use
    Grip to play tracks, but that’s not its primary purpose, so its features are rather
    limited. The playback functionality is there primarily so you can verify that
    the ripping process is working properly.


    Fedora Core comes with several music players that provide functionality way beyond
    simple playback; the one you choose will depend primarily on your personal likes
    and dislikes.


    Rhythmbox is a file and radio-station music player written for GNOME, and is available
    through Main Menu \ Sound and Video \ Music Player, while XMMS is a cross-platform
    multimedia player that handles music (as well as videos) quite nicely. XMMS is
    available through Main Menu \ Sound and Video \ Audio Player.


    Both players have the capability to act as a jukebox. You add tracks to a master
    library, and then create playlists by selecting individual tracks from the library.
    You could create one playlist to act as background music while you’re working,
    and another to use during your Friday lunchtime table-tennis match.'
  merge: -1
  img_proc: true
