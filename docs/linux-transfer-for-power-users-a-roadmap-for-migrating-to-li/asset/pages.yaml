- pgno: 300
  md: 'Because you’ve allowed Kudzu to identify and configure the printer, the printer
    name will appear in the “Queue type” dialog. Your next step is to determine the
    queue type by using the “Select a queue type” box. The first choice, as shown
    in Figure 6, is “Locally-connected,” while the others all have to do with network
    printers, and are thus beyond the scope of this book. Whitpapers available on
    the Hentzeuerweke Web site address network printing with Linux in various incarnations.


    Click Forward to open the “Printer model” dialog, shown in Figure 7. Oddly, the
    wizard requires you to select a printer’s manufacturer and model even if Kudzu
    has detected it. As a result, there’s really not much point going through Kudzua
    because you’ll need to identify your printer again during this print-queue setup.


    Select your printer manufacturer from the drop-down box at the top of the “Printer
    model” dialog, and the list of available printers for that manufacturer will appear
    in the list below, as shown in Figure 8.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_300_0.png)


    > Figure 7. You must re-identify the printer for which you’re setting up a queue.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_300_1.png)


    > Figure 8. You’ll see manufacturer-specific models once you select a manufacturer.'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'Some manufacturers are rather prolific in terms of models, and it can be a
    chore to scroll through the list. Try resizing the dialog so that it’s as tall
    as your screen, and it’ll be easier to find your printer model. Yes, this list
    should probably be presented as a treeview, with all the LaserJet models in one
    node, and so on. Maybe next release!


    Then click Forward and you’ll see the Finish dialog, shown in Figure 9. Click
    the Finish button and the wizard will ask if you want to print a test page, as
    shown in Figure 10. It’s a good idea to do this now to make sure that all the
    connections are working properly. It’s a pain to troubleshoot an errant printer
    after the fact.


    If the printer prints the page, you’ll get a chance to confirm that everything
    is working fine, as shown in Figure 10. Note that it can take a minute or two
    for the page to print, depending on your printer.


    If your printer isn’t physically connected to your computer (or vice versa, I
    guess), you’ll get an error dialog similar to the one shown in Figure 11.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_301_0.png)


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_301_1.png)'
