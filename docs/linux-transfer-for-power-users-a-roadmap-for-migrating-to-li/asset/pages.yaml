    On the far left of Figure 6, the Main Menu icon (the red fedora) is used to display
    a menu that launches a variety of functions and applications. Next to the Main
    Menu icon is a series of icons for commonly used applications. The panel is automatically
    populated during installation with some application launchers, such as the Mozilla
    browser and OpenOffice. Figure 6 shows the panel after I’ve customized it with
