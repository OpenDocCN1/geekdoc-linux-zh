  md: '# How to Download the Files


    **Hentzwerk Publishing** generally provides two sets of files to accompany its
    books. The first is the source code referenced throughout the text. Note that
    some books do not have source code; in those cases, a placeholder file is provided
    in lieu of the source code in order to alert you of the fact. The second is the
    e-book version (or versions) of the book. Depending on the book, we provide e-books
    in either the compiled HTML Help (.CHM) format, Adobe Acrobat (.PDF) format, or
    both. Here’s how to get them.


    Both the source code and e-book file(s) are available for download from the Hentzwerk
    Web site. In order to obtain them, follow these instructions:


    +   1. Point your Web browser to **www.hentzwerk.com**.

    +   2. Look for the link that says “Download.”

    +   3. A page describing the download process will appear. This page has two sections:

    +       * **Section 1**: If you were issued a user name/password directly from
    Hentzwerk Publishing, you can enter them into this page.

    +       * **Section 2**: If you did not receive a user name/password from Hentzwerk
    Publishing, don’t worry! Just enter your e-mail alias and look for the question
    about your book. Note that you’ll need your physical book when you answer the
    question.

    +   4. A page that lists the hyperlinks for the appropriate downloads will appear.


    Note that the e-book file(s) are covered by the same copyright laws as the printed
    book. Reproduction and/or distribution of these files is against the law.


    If you have questions or problems, the fastest way to get a response is to e-mail
    us at **books@hentzwerk.com**.'
