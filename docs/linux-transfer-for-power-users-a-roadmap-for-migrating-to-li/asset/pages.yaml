  md: 'Third, select File | New Playlist to open the New Playlist dialog. Type a name
    for the playlist, and then select the "Add the selected songs to the new playlist"
    check box, as shown in Figure 10.


    The new playlist will be added to the Source list on the left. Highlighting the
    playlist will display the tracks in the browser, as shown in Figure 11.


    What if you forget a track and want to add it to a playlist later? Or what if
    your library is so big that you just can''t scroll to every item and keep them
    all selected before creating a playlist? You can add tracks to an existing playlist,
    but again, it''s not exactly intuitive.


    Select the Library in the source list, and scroll to the desired item. Then highlight
    the track and drag it to the desired playlist, as shown in Figure 12.


    You can delete items from a playlist (or from the Library, for that matter) by
    right-clicking the offending track in the browser and selecting Delete from the
    context menu.


    The radio-station capability works much like the Library without playlists. To
    add an Internet radio station, select Radio from the Source list, which will show
