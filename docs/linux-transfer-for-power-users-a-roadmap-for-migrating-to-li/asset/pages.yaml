    be displayed. You can add other notification-type tools there as well; I''ll cover
    the Weather Report applet later in this chapter.


    # ### Main Menu


    Clicking the Main Menu icon opens a hierarchical menu bar, as shown in **Figure
    12**. Clicking any of the menu items with an arrow pointing to the right opens
    a subsidiary menu, and so on. As you can see, menu items are grouped according
    to functional areas, instead of everything being grouped under one huge Program
    Files option, or hidden behind rarely used menu pads.


