- pgno: 132
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_132_0.png)


    > **Figure 4. The Screensaver Preferences dialog provides access to dozens of
    screensavers.**


    Windows in GNOME work much the same as with Windows. The icons in the upper right
    serve to minimize, maximize (or revert to original size), and close the window.


    The Window menu in the upper left has the typical Minimize, Maximize, Move, Resize,
    and Close options that you’d expect from using Microsoft Windows. The rollup menu
    item isn’t found in Windows, but is known as “window shade” on Mac OS. The next
    couple of options in the Window menu, Put on All Workspaces, and Move to Workspace
    1/2/3/4, refer to workspaces, a feature of Linux that isn’t found in Windows.
    I’ll discuss this in a later section. You can resize windows by using the sides
    and corners, while clicking and dragging on the title bar moves the window around.
    GNOME has a couple of nice touches that you don’t find in Windows; these can be
    configured via Main Menu | Preferences | Window Preferences, as shown in Figure
    5.


    You can choose to automatically select a window simply by moving the mouse over
    it. (I’ve tried this and it’s always driven me crazy because it doesn’t bring
    the selected window to the front, but that’s my own personal preference.) Double-clicking
    the title bar can either roll up the window (like a window shade) or maximize
    it. You can move a window by holding down a key of your choice and then dragging
    the window, and resize the window by holding down the same key while also holding
    down the middle mouse button. The default key for both of these operations is
    Alt, but you can change it in the Window Preferences dialog.'
