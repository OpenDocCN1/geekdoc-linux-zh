- pgno: 332
  md: '# Chapter 14

    Under the Hood


    Just about everything we''ve done so far has been through a graphical user interface
    (GUI) running on top of Linux. We''ve used the GUI for just about everything,
    from making changes to the system configuration to launching programs. However,
    the GUI is a fairly recent addition to the Linux world. Many hard-core and experienced
    users never use the GUI, and there are uses for Linux for which a GUI would be
    out of place. You''ve seen hints of this word: an interface underneath the GUI
    that can be entered by using a tool similar to the Windows command window or DOS
    prompt. In this chapter, I''ll discuss how to get under the hood by using the
    Linux command window. You''ll also learn the whys and hows of some of the things
    you''ve done with the command window.


    The Linux command window is known by a variety of names; go to a Linux user-group
    meeting and you''ll hear terms such as “command line,” “command prompt,” “shell”
    or “shell prompt,” “terminal window,” “command line,” and “console,” and perhaps
    even a misplaced “DOS prompt” or two.


    Strictly speaking, “Command Line Interface” (CLI) is the generic term for the
    software device used to issue commands to the system. CLIs are called by different
    names depending on what operating system you''re using, and how you are accessing
    the system. For example, Unix systems refer to them as “shells.” If you have direct
    physical access to the machine, “console” is proper usage. The application on
    Fedora Core and on the Macintosh OS X operating system is called “Terminal,” so
    common terminology refers to “opening another terminal” or “opening another terminal
    window.”


    Because we''re using Linux, you''ll run into the term “shell” rather often. “Shell”
    is a generic term that refers to a class of programs that provide CLI functionality.
    Most Linux distributions come with a number of shell programs, including the Korn
    Shell (ksh), the C Shell (csh) and the Bourne Again Shell (bash). In Fedora Core,
    the default shell program is bash; to get to it, select Main Menu | System Tools
    | Terminal.


    To find all available shells on your system, type:


    ```

    cat /etc/shells

    ```


    Each of these shells performs the same functions, but they understand different
    commands and provide different built-in functions—consider OpenOffice.org Calc,
    Microsoft Excel and Lotus 1-2-3, which are all spreadsheets, but they have different
    menu structures and built-in spreadsheet functions.


    By contrast, Windows has only one shell, called “command.com,” and accessed through
    Program Files | Accessories | Command Prompt. You can find oodles of additional
    information about shells here: [http://www.faq.org/faqs/unix-faq/shell-shell-differences/](http://www.faq.org/faqs/unix-faq/shell-shell-differences/)


    Getting back to the definitions discussion ... common terminology, then, often
    refers to “opening a shell.” When you open a CLI such as bash in Linux, you''re
    greeted with a window that contains an operating-system prompt, like so:


    ```

    [will@freadom ~]$

    ```'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'You type a command, press Enter, and the system (hopefully) responds to the
    command with some sort of output, or perhaps another shell prompt. For example,
    if I entered the command “ls -al” to list the files in the current directory,
    I might see something like:


    ```

    [whil@freedom whil]$ ls -al

    drwx------   58 whil    whil          8192 Apr  1 18:19 .

    drwxr-xr-x    8 root    root          4096 Mar 31 13:48 ..

    drwxr-xr-x    3 whil    whil          4096 Mar 23 14:16 Desktop

    drw-rw-r-- 2 whil    whil          4096 Mar  2 20:36 evolution

    drw-rw-r-- 2 whil    whil      1324820 Mar  7 18:27 installation.pdf

    drw-rw-r-- 2 whil    whil          4096 Feb 25 18:01 mail

    drw-rw-r-- 1 whil    root        4096 Mar 19 12:08 music

    drw-rw-r-- 2 whil    whil          4096 Mar 22 16:34 RollerStuff

    drw-rw-r-- 4 whil    whil          4096 Mar 30 18:32 zips

    [whil@freedom whil]$

    ```


    Not all commands return a response; a lot of Linux commands produce no output
    if they succeed, so all you’ll see is another prompt.


    The operating system prompt is often referred to as a “command line” or a “command
    prompt.” Programs that are designed to run by typing a command at the operating-system
    prompt are often called “command-line utilities.”


    In this book, I’ve referred to the Fedora Core Command Line Interface by different
    names. In this chapter, I’ll refer to the application that appears when you select
    Main Menu | System Tools | Terminal as the command window, and the place inside
    the command window where you specifically type commands as the command prompt.
    You’re free to call it what you want.


    # Top 10 things you need to know about the command window


    The command window is a rich, powerful, programmable tool, and many books have
    been written that cover it alone. Here are the top 10 things about the command
    window I’ve found to be useful. The following discussion assumes that you’re running
    bash as your shell program.


    # 1. Command window title bar


    The string in the title bar defaults to the name of the current user, concatenated
    with the host name (machine name) and the current directory. If you open a command
    window and change to a different directory, like so:


    ```

    cd /home

    ```


    The string in the title bar will change.


    # 2. Command prompt


    The string in front is the prompt. The default bash prompt includes the user,
    the host name, and the current directory. Typically, your command window will
    start in your home directory, so


    ```

    [whil@freedom whil]$

    ```'
  merge: -1
  img_proc: true
- pgno: 334
  md: "means\n\n```\n[wh11@freedom /home/wh11]$ \n```\n\nIf you're in the \"zips\"\
    \ subdirectory of your home directory (for example, /home/wh11/zips), you'd see\
    \ this:\n\n```\n[wh11@freedom zips]$ \n```\n\n# 3. Command prompts for root vs.\
    \ regular user\n\nThe prompt ends in either a dollar sign ($) or a pound sign\
    \ (#). The $ means that you are logged on as a regular user. The # means you are\
    \ logged on as root. You'll hear this again, but note that if you're logged on\
    \ as root in a command window, you can easily mangle or destroy your system with\
    \ one typographic error.\n\n# 4. Customize your prompt\n\nYou can customize the\
    \ prompt by making changes to certain configuration files.\n\nThe behavior of\
    \ the command window (more specifically, the behavior of the shell) depends on\
    \ values in several configuration files. Linux looks at the /etc/profile file\
    \ first, then the ~/.bash_profile file, and then the ~/.bashrc file. (If you're\
    \ using a different shell, these files are different.)\n\nThe first file is a\
    \ generic, system-wide file that runs regardless of which user is logging on,\
    \ and only the system administrator can modify this file. As you can see, there\
    \ is a copy of the second file in every user's home directory, and it runs every\
    \ time that user logs in. Because each user has her own ~/.bash_profile file,\
    \ the command window can be customized on a per-user basis.\n\nThe third file,\
    \ which also exists in every user's home directory, also runs on a user-by-user\
    \ basis whenever a new command window is opened, except during initial login.\
    \ As a result of having separate .bash_profile and .bashrc files, each user can\
    \ run specific customizations just during initial login or for all command windows\
    \ except during initial login. You might be thinking that while this complex mechanism\
    \ makes for wonderful flexibility, it's also awkward if you want to run some customizations\
    \ for a specific user, but also for every command window, because you'd have to\
    \ add the same customizations to both files. Ha! Gotech covered that: Fedora Core's\
    \ default .bash_profile file comes with a short script that looks like this:\n\
    \n```\n# Get the aliases and functions\nif [ -f ~/.bashrc ]; then\n. ~/.bashrc\n\
    fi\n```\n\nDon't worry about how it works; the important thing is that this script\
    \ makes bash run the .bashrc file in the user's home directory whenever the .bash_profile\
    \ script runs. As a result, if you put all of your customizations in .bashrc,\
    \ they'll run for every shell. But you still need customizations that run only\
    \ during login, put them before this line in .bash_profile.\n\nIt's a good idea\
    \ to put anything that takes a noticeable amount of time in .bash_profile so that\
    \ subshells start up really fast by doing only the minimum in .bashrc.\n\nAnd,\
    \ of course, this all applies to the root user as well as every other user. The\
    \ root user's .bash_profile and .bashrc files are in /root, of course."
  merge: -1
  img_proc: true
- pgno: 335
  md: 'Now on to the business of customizing the prompt, since that’s what we started
    talking about. The commands I’ll be discussing all go into the `~/.bashrc` file,
    right? The basic structure of the command to change the prompt looks like this
    (note that there can’t be spaces on either side of the Equals sign):

    `PS1=''Hello world!''`


    Enter this string into your .bashrc file, save the file, and then open a command
    window. The command prompt will simply say:


    Hello World!


    That’s probably not going to be very helpful, although I’ve seen a number of whimsical
    variations, the best being:


    Yes, Master?


    You’ll notice that you have to enclose a string that has a space in it with quotation
    marks, which is probably no big surprise. If you’ve got a string that already
    has a quotation mark in it, you’ll need to use a different delimiter, like so:

    `PS1="Whil''s computer awaits direction:"`


    There are a number of special characters that will display certain types of information,
    such as the name of the user currently logged in, the name of the computer, the
    current directory, the date, the time, and so on. **Table 1** lists some common
    ones. Typing "`man bash`" at the command prompt () will give you a full list of
    special characters.


    # Table 1. *Special characters you can use to customize your prompt.*


    | Special Character | Text Output |

    | :--- | :--- |

    | \a | An ASCII bell character (07) |

    | \d | The date in "Weekday Month Date" format (for example, "Tue May 26") |

    | \e | An ASCII escape character (033) |

    | \h | The host name up to the first ''.'' |

    | \H | The host name |

    | \n | Newline |

    | \r | Carriage return |

    | \s | The name of the shell |

    | \t | The current time in 24-hour HH:MM:SS format |

    | \T | The current time in 12-hour HH:MM:SS format |

    | \@ | The current time in 12-hour am/pm format |

    | \u | The user name of the current user |

    | \v | The version of bash (for example, 2.00) |

    | \w | The full name of the current working directory (except for your own home
    directory, which will be displayed as "~") |'
  merge: -1
  img_proc: true
- pgno: 336
  md: '| Special Character | Text Output |

    |:---:|:---:|

    | \W | The basename of the current working directory (for example, ''cups'' instead
    of ''/etc/cups'' and ''whil'' instead of ''~'') |

    | \V | The history number of this command |

    | \# | The command number of this command |

    | \$ | If the effective UID is 0, a #; otherwise a $ |

    | \\ | A backslash |

    | \[ | Begin a sequence of nonprinting characters, which could be used to embed
    a terminal control sequence into the prompt |

    | \] | End a sequence of nonprinting characters |


    Here are several examples to get you started. Note that you can just type the
    command in a command prompt; you don’t have to modify your .bashrc file and save
    it each time.


    | This command | Produces these results |

    |:---:|:---:|

    | PS1=''[\w'' | [~] |

    | | (when you’re in your home directory) |

    | | [/etc/cups/interfaces] |

    | | (when you’re in the /etc/cups/interfaces directory) |

    | PS1=''[\w Dude?'' | [~ Dude?] |

    | | (when you’re in your home directory) |

    | PS1=''[\u@\h \w Dude?'' | [whil@ffreedom cups] Dude? |

    | | (when you’re in the /etc/cups directory) |

    | PS1=''[\t] [\u@\h:\w]\$'' | [21:52:01] [whil@ffreedom:~]$ |


    # 5. Change to root inside the command window


    You can change to root after opening a command window in one of two ways. The
    first is by using the "su" command:


    ```

    [whil@ffreedom whil]$ su

    Password:

    [root@ffreedom whil]#

    ```


    Note that you’re still in the /home/whil directory, but now you’re root. (Referring
    back to the first item, you’ll note that the title bar has also changed, which
    means you have “godlike” powers. You can make any change you want to the system,
    install software, delete files, get into anyone else’s home directory, and so
    on. This also means, as I’ve said before, that you can do tons of damage. For
    example, “rm -rf /” will destroy every file on your computer in about five blimpseconds.


    The second way you can change to root is by using the “su -” command:


    ```

    [whil@ffreedom whil]$ su -

    Password:

    [root@ffreedom root] #

    ```'
