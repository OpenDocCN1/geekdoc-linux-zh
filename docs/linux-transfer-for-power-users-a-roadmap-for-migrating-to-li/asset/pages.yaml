- pgno: 32
  md: '# Chapter 2

    Installing Fedora Core


    In mid-2003, Red Hat spun off its mainstream Red Hat distribution into a true
    open-source project called "Fedora Core," FC, as it''s known, differs from Red
    Hat Linux in a couple of specific ways: First, you can only get it by downloading
    ISOs (or getting them from a friend), and second, it''ll be updated on a regular
    basis, not strictly through open-source means. Some have taken these changes to
    mean that FC will become unstable or otherwise unworthy of attention, and thus
    been reluctant to give it a try. That''s not really fair—most people (myself included)
    think that FC is on par with where "Red Hat 10" would have been at this time.
    Some people may not be convinced, so to give those doubting Thomases in the audience
    a preview of FC, I use a liberal number of screen shots from this chapter, as
    well as detailed supporting explanations to show you how to install Fedora Core
    from scratch for desktop usage.


    I was initially among the skeptics when I heard about Red Hat''s plans for Fedora
    Core. Part of the reason was that they didn''t do a very good job at providing
    a timeline for support on the existing products—they in fact, I had been preparing
    to buy a number of subscriptions for a couple of recent RH 9.0 purchases; and
    if I had, those would have been wasted dollars and I would have been an unhappy
    camper. In other part of my skepticism was that they didn''t do a very good job
    at explaining the differences between Fedora Core and their commercial products;
    it took me months to determine how an update service was going to work or, indeed,
    if there was even going to be one, past manually applying patches to individual
    packages.


    As it turns out, I didn''t have anything to fear, and generally, you shouldn''t
    either. The most difficult problem for me was burning CDs—after that, the installation
    was a rather nicer version of the comfortable Red Hat installs I''d been used
    to with 8.0 and 9.0. I was not running in a couple of hours, most of which was
    spent watching thermometer bars race across the screen.


    # The big picture


    There are three basic steps to installing FC: downloading and creating CDs, the
    initial installation process, and final setup.


    Fedora Core comes as a series of three ISO files, each about 650 MB in size. After
    downloading and verifying the files, you''ll want to put them on CDs. Most every
    version of Windows comes with CD-burning software, so I won''t belabor that process
    here. It''s not quite as straightforward on a Linux box, though, so I''ll provide
    explicit details for creating CDs with Linux.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_32_0.png)


    Once you''ve got your three CDs, it''s time to install. The first CD is bootable,
    so assuming that your machine can boot from a CD, you just stick it in and restart
    the machine. A wizard'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'starts, first offering to check the CDs for errors, and then guiding you through
    about 16 screens that allow you to configure your machine and set up preferences.
    Most of these screens can be navigated simply by clicking “Next,” because the
    wizard will detect and display the appropriate choice for you.


    After completing the wizard, the installation starts, and you’ll be prompted to
    insert CD #2 and CD #3 when necessary. Once all the files have been transferred
    and the system has been installed, the machine will restart and you’ll spend a
    few more minutes making a few final tweaks and choosing settings. Upon completion,
    you’ve got a Linux box ready to go.


    # ## Installing Linux alongside a pre-existing OS


    The preceding discussion assumes that you’re installing Linux on a machine all
    by itself. Actually, you have two options when it comes to installing Linux: whether
    to make Linux the only operating system on your computer, or install it alongside
    a pre-existing OS. That pre-existing OS could be Microsoft Windows, or it could
    be Linux.


    If you want to do a Linux-only installation, you’ll be formatting your entire
    hard disk. As a result, if you have any data that’s already on the target machine—and
    you want to keep that data—make a backup or otherwise copy it somewhere else.


    If you want to install Linux alongside another operating system, which is called
    a dual-boot configuration, you’ll want to do two things. First, back up anything
    of value on the target machine. One can never be too rich, too thin, or have too
    many backups. Second, ensure that there’s enough room on the hard disk of the
    target machine to install Linux. You’ll need an absolute minimum of 1 GB, but
    that won’t get you very far in terms of what you can install other than the operating
    system itself. You’ll be much happier if you’ve got between 3 GB and 5 GB. The
    amount of disk space you have available will determine how much software you can
    install.


    After you’ve freed up enough space on the target machine, you’ll need to make
    sure that Linux can take advantage of it. There’s a difference between “unused
    space” and “free space.” The former is simply space in a formatted partition that
    isn’t being used, while the latter is space that is not formatted and/or part
    of a partition. Once you’ve got unused space in a partition, you may need to resize
    it (using something like Partition Magic software) in order to create free space.


    This book assumes that you’re going to perform a Linux-only installation.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_33_0.png)


    > > If you’re interested in setting up a dual-boot system, there are a large number
    of guides for doing so on the Web. You might also check with your local Linux
    user group: they often have “installfests” where you can get help with a tricky
    Linux installation.


    # ### The details—step by step


    In this section, I’ll go through the exact steps needed to download, install,
    and complete the installation of Fedora Core on a desktop computer. The big picture
    includes:


    +   1.  Download Fedora Core

    +       1.1  Download the ISO files

    +       1.2  Verify that the bits came down properly

    +       1.3  Burn a CD'
  merge: -1
  img_proc: true
