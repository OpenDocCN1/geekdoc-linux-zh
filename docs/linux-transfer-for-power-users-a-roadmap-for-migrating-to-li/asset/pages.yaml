  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_238_0.png)


    Selecting files to add to an archive.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_238_1.png)


    An archive after files have been added to it.


    You can also choose to exclude files that match a file name mask (for example,
    *.zip, in order to exclude other compressed archives), and direct File Roller
    to ignore case when dealing with file masks.


    File Roller will drill down through a subdirectory structure if you select the
    “Include subfolders” check box. If you do this, the resulting display can be confusing.
    For example, suppose there was a directory under “/home/will/RollerStuff” named
    “RollerSubdirectory.” If you create an archive and include that subdirectory,
    the File Roller window will look like Figure 6.'
