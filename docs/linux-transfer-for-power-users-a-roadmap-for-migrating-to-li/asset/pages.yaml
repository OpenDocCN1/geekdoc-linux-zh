    # The details—step by step


    In this section, I''ll discuss how to use the up2date mechanism in great detail,
    because it''s the mechanism most applicable to a new Fedora Core user.


    # Are there updates available?


    When you right-click the Red Hat Network Alert Notification Tool icon, you''ll
    get a menu that offers a variety of update options, as shown in **Figure 5**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_93_0.png)


    **Figure 5. Right-clicking the Red Hat Network Alert Notification Tool icon displays
    a number of update options.**


    Because Fedora Core 1 is a transitional release—from Red Hat Linux to a distribution
    completely supported by the community—some of the items in the commercial version
    are still hanging around. The RHN Website option available in the Red Hat Network
    Alert Notification Tool is one example of commercial remnants. Clicking on it
    still takes you to the RHN Web site, but the information there doesn''t have anything
    to do with Fedora Core updates.


    In order to run up2date properly, you''ll want to follow three steps. First, you''ll
    configure up2date with the Red Hat Network Alert Notification tool. Second, you''ll
    point up2date to a mirror different than the default that comes with Fedora Core.
    Third, you''ll launch up2date and run the wizard. After you''ve done this process
    once, future up2date episodes will simply involve the third step of checking for
    (and installing, if any) updates.


