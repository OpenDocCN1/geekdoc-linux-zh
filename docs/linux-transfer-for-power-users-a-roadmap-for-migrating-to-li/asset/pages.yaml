- pgno: 119
  md: 'As a power user, the one list you will be most interested in is the “fedora-list”
    mailing list, although you’re certainly welcome to join others as you desire.
    This list covers subjects that users (as opposed to folks who do programming,
    administration, testing and quality assurance, or documentation) are interested
    in. You can ask questions and get help, and offer help to fellow Fedora Core users.


    # Subscribing


    To subscribe, click on the “fedora-list” link in the left column to bring forward
    the subscription page as shown in Figure 4.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_119_0.png)


    This page contains everything you need to know about managing your subscription
    to the mailing list. The first link is for the mailing list archives (more on
    that in a moment). The second link contains instructions to post a message to
    the list, and the third section allows you to subscribe.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'At this writing, the fedora-list mailing list generates between 100 and 250
    messages a day. Some people feel that’s a lot of messages, while others aren’t
    quite as cowed. (I used to belong to a list that generated close to 1,000 messages
    a day, so 200 doesn’t phase me at all!) Depending on your experience and personality,
    you may decide to shunt the mailing list messages off into a separate folder in
    your e-mail client (investigate “filter” options if you’ve not done this before)
    so that your inbox isn’t continually filled (and you’re continually distracted).


    Once you’ve subscribed, you’ll receive a confirmation e-mail that you’ll need
    to respond to. (That’s so that “friends” of yours don’t subscribe you to the list
    as a prank, much like kids fill out business reply cards in magazines with the
    address of their school’s principal.) As soon as you do, you’ll start getting
    messages from the list.


    Oh, and if you’ve decided that a particular mailing list isn’t for you, don’t
    send “Please unsubscribe me” messages to the list. There’s a “To unsubscribe”
    link at the bottom of every message on the list.


    # ## Getting help effectively


    Once you’re subscribed, you’ll want to read some messages and get the feel of
    the list. Each mailing list has its own personality, and fedora-list is no exception.
    If you’re not in a terrible rush to get a question answered, read the messages
    for a few days to get an idea of what questions are being asked, and the knowledgeable
    people seem to be, and so on.


    If you’re new (or inexperienced) at using mailing lists for technical support,
    and you have to post a question right away, you need to know a few rules of the
    road in order to make best use of the list.


    +   1. Be nice.


    Lists are generally frequented by folks like yourself—volunteers in most part,
    folks who want to help the community by contributing their time to help others,
    just as they have been helped in the past.


    Unfortunately, two factors serve to cause people in need of help to ask for it
    in a hostile manner. First, they’re under pressure, under stress, and that often
    makes one irritable. Second, some folks seem to think that the lack of face-to-face
    contact gives them permission to ignore normal courtesy.


    As a result, people will sometimes act impossibly when requesting help. This is
    a bad idea both because it’s wrong, and because you’re much less likely to get
    help if you act that way. Be courteous, even though you’re having a problem, and
    people will react in kind.


    +   2. Show that you’ve done your homework first.


    People who frequent mailing lists eventually start to see the same questions over
    and over, and end up getting tired of answering those questions. This results
    in those questions being ignored or answered in a terse (in other words, less
    than helpful) manner. The first time someone asks about a problem, someone will
    likely respond with a long, detailed response, including each step to take, and
    links to other sources. The 20th time that the question is asked, that person
    isn’t nearly as likely to provide the same detailed answer.


    Show that you’ve done your research: You’ve read the help (if applicable), you’ve
    searched the mailing-list archives to see if the question has already been asked
    (see the next section for instructions and an example of how to do so), and you’ve
    done a general Web search on the topic.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '3. **Provide detailed information about the problem.**


    This is the classic step that is so infrequently followed, even by folks who should
    definitely know better. A post that says


    > "My graphics driver doesn''t work. Please help."


    is completely useless. There is no way that someone else is going to be able to
    offer any type of useful assistance in response to this post. *What machine? What
    distribution? What version? What graphics driver? What doesn''t work?* Are you
    sure it''s the graphics driver to begin with? How is anyone going to be able to
    make substantive suggestions in this scenario? It would be much better to provide
    a post like so:


    ```

    After I upgraded my kernel from .2115 to .2160 on my Super Duper Zannboook 4000Z,
    I''m getting a message "Invalid ShowFast video driver: Load failed." during boot
    up. The graphical boot process starts to load and then fails, and I''m stuck with
    a character-based "boot:" prompt.

    ```


    4. **More ideas.**


    Eric S. Raymond has written an entertaining essay titled “How to Ask Smart Questions.”
    It may seem a little heavy-handed at times, but that''s simply because it''s a
    realistic view of what the online world is like. Even experienced online participants
    will find interesting information here: [http://www.catb.org/~esr/faqs/smart-questions.html](http://www.catb.org/~esr/faqs/smart-questions.html)


    # Mailing list archives


    Step 2 in the previous section suggested that you explain what you''ve already
    done to try to solve the problem yourself. This assumes, of course, that you have
    actually done your own homework. One critical step is to search the archives to
    see if someone else has run into the same problem—which is the case in a startling
    number of situations.


    Doing so—searching the archives first—provides two benefits. First, if you can
    find the answer, you''ve saved yourself a bunch of time. You found the answer
    immediately instead of posting a question and having to wait for an answer. And
    if the answer is in the archives, it may well be an answer that would have never
    come, because folks don''t want to bother with folks who are too lazy to do a
    bit of homework on their own.


    Second, if you search the archives and don''t find the answer, you may still find
    enough information to help you provide more details when you post your question—which
    might well be the difference between someone else answering the question accurately
    and solving your problem, or simply making out guesses or silly suggestions. (“Did
    you try standing on one foot and pressing Alt-Q during bootup? How about shaking
    the machine too?”)


    # Where to search


    The Fedora Core archives can be found at [http://www.redhat.com/archives/fedora-list/](http://www.redhat.com/archives/fedora-list/).
    Navigating to this URL opens the main fedora-list archive screen as shown in **Figure
    5**.'
  merge: -1
  img_proc: true
