- pgno: 73
  md: '# Date and Time


    You can perform three tasks in this screen. First, you can set the system date
    using the calendar widget on the left. Second, you can set the system time, using
    the Hour, Minute and Second spinners on the right.


    Third, you can configure your system to automatically synchronize with a remote
    time server by using the Enable Network Time Protocol check box and Server box
    at the bottom. Selecting the check box will enable the drop-down box as shown
    in Figure 56, and provide choices for remote servers.


    **Step 3.** Set the date and time, and, if desired, enable NTP and select a remote
    server. Then click Next to move to the User Account screen, as shown in Figure
    57.


    # User Account


    The root user should be used only when performing administrative duties on the
    computer that can''t be done any other way. For general use, you should have a
    second account. All other users of the computer should also either use that same
    account, or, preferably, use their own accounts. This screen is used to create
    one or more user accounts.


    This account is stored on the local machine. If you want to create a network login
    (for example, to log in to a Linux or Windows server), click the Use Network Login
    button. I''ll cover this in more detail in Appendix B, “Connecting to a Windows
    Network.”


    **Step 4.** Enter a username, the full name of the user (optional, but recommended
    if more than one person will be using the computer), and a password. Click Next
    to move to the Sound Card configuration screen as shown in Figure 58.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_73_0.png)


    **Figure 56.** The Server box provides predefined choices for remote time servers.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_74_0.png)


    Figure 57. The User Account screen allows you to create day-to-day accounts.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_74_1.png)


    Figure 58. The Sound Card screen allows you to ensure that the sound card on the
    machine works properly.'
