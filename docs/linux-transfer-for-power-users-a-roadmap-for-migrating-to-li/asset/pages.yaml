    # Verify that the bits came down properly


    Just because you’ve got three ISO files sitting in a directory somewhere doesn’t
    mean that everything is hunky dory. Remember that these files are simply carefully
    arranged combinations of 1’s and 0’s—and that any number of events could have
    conspired to interrupt the flow of 1’s and 0’s to your computer. Thus, you’ll
    want to make sure that the files you’ve got are the same as the files on the mirror.
    To do so, you’ll use a program called “MD5SUM.” An MD5SUM check is a way of ensuring
    that two files are identical—that one didn’t get corrupted or otherwise altered
    during downloading. Running the MD5SUM program on a file'
