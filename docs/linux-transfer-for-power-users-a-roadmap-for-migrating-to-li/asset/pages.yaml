- pgno: 240
  md: '# Extracting files


    Now, how about the reverse—extracting files from an archive?


    If the archive file was created with File Roller, regardless of which type of
    archive and/or compression, you can use File Roller to extract one or more files.
    Run File Roller by clicking **Main Menu** | **Accessories** | **File Roller**,
    and you’ll see the main screen as shown in **Figure 1**.


    Next, click the **Open button** (or select **Archive** | **Open**, or type Ctrl-O),
    and select the archive file you want to work with. **File Roller** will show the
    archived files, similar to **Figure 5**.


    Select the files you want to extract, and then click the **Extract button** (or
    **Edit** | **Extract To,** or Ctrl-X, or right-click and select **Extract To**)
    to see the Extract dialog, shown in **Figure 8**.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_240_0.png)


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_240_1.png)


    The first thing is to specify where you want to extract the files. Note that the
    default action is “Re-create folders.” This means that if you’re working with
    an archive including files that were originally archived with a directory structure,
    that folder structure will be re-created when you extract the files.


    You may want to consider whether or not you want to re-create that structure.
    For example, I often get files from authors who have included the original path
    to their files with the archive. I don’t want to dig through a directory structure
    four or five levels deep, so I uncheck the “Re-create folders” check box before
    extracting the files. How do you know if someone has included the directory structure?
    If you have selected the “View | View All Files” menu option in the File Roller
    main window, you’ll quickly see if there are any directories to deal with.


    You are not limited to using File Roller on archives that were created using Linux
    programs. You can extract files from a PKZIP or WinZip compressed archive using
    File Roller, and you can usually use those (and other) Windows programs to extract
    files from File Roller archives.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# # KAlarm


    Not all Linux utilities are as involved as File Roller. KAlarm is a simple alarm-clock
    utility that comes with the KDE desktop environment. It runs in its own window
    on the desktop. To open it, select Main Menu | Accessories | More Accessories
    | KAlarm (see Figure 9). Selecting the Actions | New menu option (or pressing
    the Insert key) opens the New Alarm dialog, shown in Figure 10.


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_241_0.png)


    *Figure 9. The KAlarm main window.*


    ![](img/50a238d93c7edbdc4387d5ff7f6b7b3c_241_1.png)


