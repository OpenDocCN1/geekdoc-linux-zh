- pgno: 338
  md: 'where the `<xxx>` is the string “workstation-4.0.5-6030.i386”. You certainly
    don’t want to type all of those numbers and periods and hyphens. Instead, you
    can type this:


    `rpm -Uhv VM`


    and then press the Tab key. The string will be expanded to this:


    `rpm -Uhv VMware-workstation-4.0.5-6030.i386.rpm`


    and the cursor will be sitting at the end of the line, waiting for you to make
    additional edits; or you can simply press the Enter key to execute the command.


    The only caveat is that you have to type enough of the string that the shell will
    be able to uniquely identify the file you’re interested in. If you don’t type
    enough to identify the file, the amount that is matched will display, and then
    you can continue typing until you get enough to make another unique match.


    # 9. Multiple command windows


    You can have multiple command windows open at the same time. This is handy for
    several reasons. The first is that some commands take over the command window,
    disabling it for any other use until the command is finished. For example, if
    you want to edit a configuration file, you can call gedit from within a command
    window, like so:


    ```

    `gedit /etc/estab`

    ```


    However, as long as gedit is running, you don’t have access to the command window
    that spawned the editor session. If you want to run another command, you need
    to open a second command window.


    The second reason to open multiple command windows is so you can do something
    as root without logging in as root. If you’ve already got one command window open
    as your day-to-day user, you don’t have to close it. Just open a second command
    window and change to root in that window.


    # 10. Command window attributes


    You can change the attributes of a command window. The collection of a command
    window’s attributes make up its “profile,” and you can create multiple profiles,
    each of which is used by a different user. This is particularly useful when you
    need to run one command window as root. Sure, the prompt changes, but it’s easy
    (particularly as our eyes pass a certain vintage, like mine) to miss that small
    visual clue. (That’s why I also change my root command prompt to be radically
    different from all others.)'
