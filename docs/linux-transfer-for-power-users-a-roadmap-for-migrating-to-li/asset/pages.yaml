- pgno: 16
  md: '# # About the Authors


    # ## Will Hentzen


    Will Hentzen fills the role of “player-coach” at Hentzenwerke Publishing, a 7-year-old,
    Milwaukee-based publisher that specializes in titles covering high-end software
    development and, more recently, the migration of Windows developers and users
    to Linux.


    Will started out life as a custom software developer using dBASE II (he still
    has the original 8 1/2 × 11 gray binder of documentation, much to the chagrin
    of his wife), and switched to FoxPro in 1990. Besides billing 15,000 hours in
    the ''90s, he presented more than 70 papers at conferences throughout North America
    and Europe, edited *FoxTalk*, Pinnacle Publishing’s high-end technical journal
    for seven years, and has hosted the Great Lakes Great Database Workshop since
    1994. He was a Microsoft Most Valuable Professional from 1995 through 2003 for
    his contributions to the FoxPro development community, and received the first
    Microsoft Lifetime Achievement Award for Visual FoxPro in 2001.


    Will began writing in order to develop credentials to bolster his software-development
    career. His first book, *Rapid Application Development with FoxPro*, showed up
    in 1993, and six more have appeared since. He started Hentzenwerke Publishing
    in 1996 to self-publish a specialized volume on software development, and then
    began producing Visual FoxPro books when the major publishers abandoned the market
    in 1998. Sensing the impending acceptance of Linux on the desktop and anticipating
    a demand for custom business applications on those Linux desktops, he turned his
    attentions to Linux in 2002, and will have eight narrowly targeted Linux and open-source
    books available by the end of 2004. HWP’s backlist now numbers more than 30, with
    some 60 authors and editors worldwide on the payroll.


    Will has a B.S. in mechanical engineering from Rose-Hulman Institute of Technology
    and currently spends his copious amounts of spare time with his five kids and
    volunteering for the local school district. An avid distance runner, who logged
    nearly 50,000 lifetime miles and, pending recovery from a severe injury a few
    years ago, hopes for one more shot at a sub-15- minute, 5,000-meter clocking—before
    age and common sense close the door on that activity.


    You can reach Will at will@hentzenwerke.com.


    # ## Chris Herborsth


    Chris Herborsth is an award-winning senior technical writer with more than 10
    years of experience in the field of technology (http://www.pobox.com/~chris/chris-resume.html),
    with a background in operating systems, programming, and other interesting areas.
    When he''s not playing with his son or hanging out with his wife, Chris spends
    his spare time designing and writing video games, enjoying various Nintendo GameCube
    titles, and fretting over how long it takes him to finish playing games on his
    PC. Chris can be reached at chris@pobox.com.'
