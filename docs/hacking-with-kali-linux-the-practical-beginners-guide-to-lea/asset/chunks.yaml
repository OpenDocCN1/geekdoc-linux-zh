    \ process. Now that we have our data packets, we can open another terminal and\
    \ type in:\n\n```\nairrack-ng *filename*-01.cap\n```\nThis should begin the cracking\
    \ process, or, if there are multiple wireless networks, the program will ask which\
    \ wireless network will be the target of the crack. Note that if there are multiple\
    \ wireless networks, the amount of captured data packets needed may be even higher.\
    \ If the password is fairly weak, then the password should appear in the following\
    \ format:\n\n`Xx :: xx :: xx :: xx :: xx :: xx :: xx …`\n\nRemove the colons (so\
