  trans: '


    ## 成功策略


    虽然普通组织需要定期处理许多潜在的恶意软件向量，但也有许多不同的策略可以使防止恶意软件于门外变得更易管理。


    其中第一点是确保始终通畅的通信流。同时，确保你的通信流路径不仅定义良好，而且经过了授权或记录也同样重要。从此开始，你应该努力提高对系统的意识，这些系统可以根据需要被用作网关进行横向移动，或直接连接到位于整个企业范围内任何地方的终端端点。无论你采取什么措施，重要地要尽可能确保这些系统被维护在这些受限的
    `VLANs` 中，并根据需要实施适当的网络访问控制和分段。


    在确保对谁可以访问什么内容拥有足够的控制权时，对于能够直接与大量终端建立接口的企业级系统，任何交互式登录都必须要求双因子身份验证。此外，确保授权用户被限制在组织人员的特定子集内也非常重要。无论你如何，确保默认用户组不具备直接身份验证或访问这些系统的能力这一点。


    你还需要确保为每个涉及企业级应用程序的服务记录并使用唯一的域帐户。在向各种账户分配这些权限的上下文中，应始终完整记录，并配置为让尽可能多的用户拥有尽可能少的权限。这样做可以使企业能够追踪和监控基于分配的服务器帐户所执行的操作。


    这就是为什么避免为服务帐户提供交互式或本地登录权限至关重要的原因。事实上，服务帐户应该被明确拒绝此类权限，特别是当其能够访问关键数据位置或重要的网络共享时。此外，用于身份验证中央服务器的帐户不应包含具有高权限的下游系统，因为这可能允许一个更容易被攻破的系统感染通常保护得更好的系统。


    ## 恢复计划


    在准备应对系统遭受严重攻击的应急计划时，业务影响分析是一个至关重要的组件。该计划应为你的组织提供两个关键部分：相互依赖关系，以及相关组件的分类和特征。


    为了应对这种场景制定计划，组织需要解决可用资源的可访问性，包括关键任务应用程序和系统、关键外部联系人的联系方式、基本人员的联系方式，以及每个项目都提供的安全通信通道。同样，拥有所有主要供应商的联系详情、组织采购方面的联系人，以及所有关键应用程序和系统的备份
    `ISO` 文件也是重要的。


    ## 遏制


    如果组织经历了大规模恶意软件爆发，首要关注点应是遏制，以希望减少攻击的整体范围，并最大限度地减少额外系统受到影响的概率。


    为了制定遏制策略，最好的起点是确定所有出现问题的系统所共同拥有的向量（或多个向量），这些向量可能曾被用于传递恶意病毒。常见的选项包括：


    - `DNS Server`

    - 网络边界或分段

    - 权限高于平均水平的用户帐户

    - 中央文件共享

    - 集中应用程序


    '
- fmt: '

    Once you find a likely distribution vector, you can then move on to enforcing
    additional means of mitigation, starting with implementing network control lists
    as a means of denying applications the capability of communicating directly with
    other systems. Doing so will immediately make it much easier to isolate and sandbox
    specific resources so that you can more accurately determine what’s wrong. Your
    internal DNS can be used for this task by simply adding a null pointer to the
    DNS zone for any identified applications or servers which will make it easy to
    see what both are running and unidentified.


    ### D. FIREWALL AND WHAT ARE YOUR FIREWALL OPTIONS

    It is an internet filtering measure, was bypassed using encrypted PDF files sent
    as email attachments that could both contain commands and harvested data, such
    as email content and metadata. These PDF files could be opened with a PDF viewer
    but contained only a 1x1 pixel white image, displaying a single blank page. Automated
    email management systems legitimately present in `Outlook` were used to hide these
    command&control emails, so a user watching at his inbox intently could spot only
    a flicker of an email before the exploit deleted it without any record. Desktop
    notifications were also blocked. The exploit came with a list of preset email
    addresses where it could report back to `Turla` but also had a way to add backup
    email addresses in case the original ones were taken down.


    By all accounts, `Turla` was a state-sponsored hacker group since their goal was
    mainly surveillance and monitoring rather than immediate financial gain. They
    showed a great deal of patience and skill, using custom encryption methods to
    buy as much time as possible when their exploit was ultimately discovered. An
    entire suite of `Turla` malware was eventually discovered. Among them were Trojans,
    used to deploy the `Outlook` exploit, such as `Gazer`, where the authors even
    put in some video game references in the code. Malware was used against states
    before, and this exploit was fairly tame compared to `Stuxnet`, the world''s most
    famous cyber-weapon.


    ### E. WHAT YOU NEED TO KNOW ABOUT CRYPTOGRAPHY AND DIGITAL SIGNATURES

    The problem with cryptography and hashing, in general, is that once deployed,
    these algorithms stay still, but the computing power advances and makes it more
    likely the security of these measures will be breached. So, using older software
    becomes a gamble that''s more and more likely to wipe you out as time goes on,
    but updating isn''t always the best option since it costs money and disrupts your
    workflow. You don''t have to feel obliged to update to the very last version of
    software as soon as it comes out – unless others are depending on you.


    On the other hand, companies certainly should do as much as they can to tighten
    their cybersecurity efforts and stop data leaks, which are a frighteningly common
    occurrence. When your computer gets hacked, you can lose banking data but just
    as easily call the bank to reverse any given transaction; when `Facebook` gets
    hacked, millions of people will have their most intimate data, from chat conversations
    to photo albums exposed to hackers and possibly exploited at some point down the
    line.


    Hospitals and airports are very vulnerable targets that we don''t think about
    until they''re hit with ransomware, malware that locks up the system until some
    money is paid to the hacker, usually cryptocurrency. In May 2017, `WannaCry` ransomware
    hit over 200 thousand computers across the world, including those in hospitals,
    banks, and airports. Some of these institutions used `Windows XP` way past its
    support date, making it trivial for hackers to waltz into an office, plug in an
    infected `USB` and lock down their entire network. Who made `WannaCry`? It was
    supposedly a hacking tool made by the `NSA`, stolen by a hacker group and repurposed
    for theft.


    In any case, hardware and software failures will happen; hence, the smartest move
    is to back up your data, which is the only surefire way to protect against hacking.
    Separate the original and the backup as much as possible, preferably by having
    one on the cloud and the other on an external hard drive that''s disconnected
    from the internet. Include photographs, voice messages and other personal trivia
    in your backup, so these precious memories don''t get lost due to a hack.


    ### F. WHAT IS A VPN AND HOW TO USE IT FOR YOUR OWN SECURITY

    Most users nowadays have routers, which connect the devices like mobiles, tablets
    and computers to the Internet. The router will be given a public IP address by
    your Internet service provider and each of the devices that connect to the Internet
    will be given a private IP address. The router gives the private IP address. Whenever
    you connect your computer to the Internet, it will look like your computer is
    your router. In cases where the users have only a single computer, they can connect
    it directly to the Internet and their `ISP` will give a public IP address to it.
    Since the assigned IP address is public, a host from the other end can track your
    Internet activities.


    `VPN` (virtual private network) allows the users to connect to another network.
    The `VPN` will provide your computer with its own IP address. `VPN` can be used
    for hiding your original IP address and your IP address provided by your `ISP`
    will be hidden. `VPNs` are not just used for hiding IP addresses. You can access
    any network from your organization, which may be blocked from certain networks.
    There are many commercial and free `VPN` and proxy services available on the Internet.
    Using these you can connect to the Internet with a new IP address and your original
    IP address will be hidden.


    ### G. TOR BUNDLE AND PROXY CHAINS

    `Linux` supports the classic multiprogramming scheme. `Linux` supports parallel
    (or quasi-parallel if there is only one processor) user processes. Each process
    runs in its own virtual address space, i.e., processes are protected from each
    other and the collapse of one process will not affect the other running processes
    and the system as a whole. One process cannot read anything from the memory (or
    write to it) of another process without the "permission" of another process. Authorized
    interactions between processes are allowed by the system.


    The `kernel` provides system calls for creating new processes and for managing
    generated processes. Any program can start executing only if another process starts
    it or some interruption occurs (for example, an external device interrupt).


    In connection with the development of `SMP` (Symmetric Multiprocessor Architectures),
    a mechanism of threads or control threads was introduced into the `Linux` kernel.
    A thread is a process that runs in virtual memory, used together with other threads
    of a process that has separate virtual memory.


    If the `shell` encounters a command corresponding to the executable file, the
    interpreter executes it, starting from the entry point. For `C` programs, the
    entry point is a function of `main`. A running program can also create a process,
    i.e. run some program and its execution will also begin with the function `main`.


    ### H. ADVANTAGES OF CYBERSECURITY

    When it comes to the importance of ensuring the cybersecurity of your portable
    devices, only you can accurately determine what’s at risk besides the machine
    itself. However, with most portable devices these days, if the thief is able to
    access the information that is stored within it successfully, a lot more than
    the data directly on the device itself is at risk.


    You have likely heard stories about the uproar caused when a senior manager for
    one major corporation or another leaves a laptop or a smartphone somewhere they
    shouldn’t. Confidential information of this type can cause untold damage to a
    company, especially if it has something to hide. Even if your devices don’t have
    serious secrets hidden within, there is still enough on the average smart device
    to make your life very difficult if the wrong person gained access to it. Keep
    the following in mind when it comes to keeping your data private on the go.Password
    protect everything: It doesn’t matter if it takes you an extra 30 seconds to access
    your device, this one simple step is responsible for decreasing the likelihood
    that your device is accessed by the wrong person by more than 100 percent. It’s
    easy, readily available and an option when you set the device up for the first
    time, there is no reason not to take full advantage of it.

    '
