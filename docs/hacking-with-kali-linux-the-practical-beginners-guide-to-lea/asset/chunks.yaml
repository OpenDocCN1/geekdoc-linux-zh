- fmt: "\n# Treat your property as valuable\n\nWith smart devices so ubiquitous, it\
    \ can be easy to be flippant about them when you are out and about, especially\
    \ if you are busy or otherwise in a hurry. Regardless of the personal cost of\
    \ the device in question, it is important to not just think about the physical\
    \ value if the device was lost but the value of the time wasted in changing literally\
    \ every password and credit/debit card you own. Furthermore, think about the potential\
    \ value of keeping your identity secure and act accordingly.\n\nLikewise, you\
    \ should make a habit of keeping an eye on your surroundings when using your device,\
    \ which will likely be easier said than done. Nevertheless, you should try and\
    \ pay attention to those around you, including anyone who may be trying to look\
    \ over your shoulder for a peek at your sweet, sweet data. Generally speaking,\
    \ if you don’t need your device at the moment, it is best to keep it hidden away\
    \ from prying eyes, just to be safe. If you are using a company laptop, you may\
    \ even want to consider a third-party alarm that can be set to ensure that anyone\
    \ who tries to access the computer without your permission is in for a rude awakening.\n\
    \nRegardless of how important your information is, it is important to have at\
    \ least one backup of all your data stored in a secure location or, more likely,\
    \ the cloud. This way you will be able to ensure you are able to get back to where\
    \ you were as quickly as possible, you will also know exactly what information\
    \ is now at risk, allowing you to take additional precautions as needed.\n\n##\
    \ What to do if your device is stolen\n\nThe first thing you are going to want\
    \ to do is report the theft to the proper authorities as they may have procedures\
    \ in place that you might not be aware of for this sort of thing. It is also important\
    \ to cancel any mobile data service that is on the device as quickly as possible\
    \ to delay the culprit as much as possible and give yourself time to change all\
    \ of the relevant passwords in the interim.\n\n## Ensure your data is secure\n\
    \n### Add additional layers of protection\nWhile there are naturally going to\
    \ be innate security options for portable devices, their very nature means they\
    \ are more likely to be targeted than anything else you own which means it is\
    \ important to take as many security precautions as are warranted for the type\
    \ of data you are typically transporting. It is also important to keep in mind\
    \ that if your device is going to be connecting to an unsecured network connection\
    \ then it is vulnerable to network attacks as well and plan accordingly.\n\n###\
    \ Store important data separately\nThere are a wide variety of extremely secure\
    \ external storage options available these days which means there are plenty of\
    \ ways to keep your sensitive data safe from prying eyes, and completely separate\
    \ from the devices that are most likely to be targeted for theft. Despite the\
    \ prevalence of storage space, this option is used far less frequently than it\
    \ should be which means you will have the advantage of being unexpected on your\
    \ side as well. You can even keep the data in a pocket on your person at all times,\
    \ virtually ensuring that you know where it is at all times.\n\n### Don’t rely\
    \ on passwords alone\nIf you are dealing with sensitive files, don’t trust passwords\
    \ alone to defend it. Instead, take the extra step of encrypting them and ensuring\
    \ that even if your device ends up in the wrong hands the data is still largely\
    \ secure. By adding an extra layer of encryption, you ensure that unauthorized\
    \ people won’t view the data, even if it physically falls into their hands. Keep\
    \ in mind that it is very important to keep a list of these passwords, and to\
    \ ensure that said list is not directly accessible from your computer to avoid\
    \ making the whole thing pointless.\n\n### Ensure your virus protection software\
    \ is up to date\nUnlike personal computers which are far more likely to remain\
    \ on, and thus receive automatic updates, portable devices, especially those provided\
    \ by the company, tend to be used on a more sporadic basis which means ensuring\
    \ everything is updated regularly is going to be your responsibility. Make a habit\
    \ of checking for new security updates once a month, and also ensure that the\
    \ virus and spyware software available on the device is up to date as well.\n\n\
    ### Maintain a strong firewall\nWhile a firewall is a good idea when it comes\
    \ to securing your personal computer, it is even more important as your portable\
    \ device is going to be connecting to a wide variety of different networks, very\
    \ few of which you will be able to tell are secure with any degree of certainty.\
    \ If you are going to be using your device while traveling you are going to want\
    \ to ensure your firewall settings are set to the highest settings at all times,\
    \ just to be safe.\n\n## I. NETWORK MANAGEMENT AND A LOT OF METHODS TO SPOOF ADDRESSES\n\
    \nThere are several things that you can do to get into a network using your hacking\
    \ abilities.\n\n### Ping\nEvery Wi-Fi has an IP address that is assigned to it.\
    \ Even the computer that you use to hack into someone else’s system is going to\
    \ have an IP address. An IP address is going to be a series of numbers that is\
    \ unique to that router. However, the IP address alone is not going to tell you\
    \ much on its own.\n\nTo convert the address, you are going to use the `ping`\
    \ option. The `DNS` is also going to help to get the name of the domain. `Ping`\
    \ is going to stand for packet internet groper and is going to be on all versions\
    \ of Windows that their clients are going to use.\n\nAfter you have logged into\
    \ the internet, you are going to need to open up the shell for DOS and then insert\
    \ a command for `ping`. This is going to look for the domain name and then display\
    \ it on the computer that you are using. \n\nThe use of `ping` is going to usually\
    \ be the first step that you are going to take when you are trying to hack into\
    \ a network. The `ping` is going to reach out to your target and tell you if it\
    \ is online or offline. Multiple IP addresses are not going to be able to be converted\
    \ into domain names. When you are wanting more control of your `ping`, you are\
    \ going to use `ping` commands.\n\n### Ping sweep\nThis is going to involve `ping`,\
    \ but instead of using it to get into a system, it is going to search the IP addresses\
    \ that are open in a specific area around you. Using this is only going to be\
    \ useful when you are not sure where you want to attack therefore you are going\
    \ to know where you can get into without necessarily knowing who the target is\
    \ or where they are located.\n\n### Tracert\nThis program is another tool that\
    \ is going to get information about the host no how remote. It is going to use\
    \ `ICMP`. `Tracert` is going to locate data by sending out packets from the source\
    \ computer to the computer that is the target is going to get an IP address sent\
    \ back to it after connecting and is thus going to reveal all of the stations\
    \ that are going to start with the connection you have to the internet. Should\
    \ the name not be able to be revealed with `ping`, then this program is going\
    \ to be able to give it, or even the last station that attacker visited.\n\n###\
    \ Port scanning\nAt the point in time that the system that has been targeted is\
    \ listed online, the next thing to do is to scan the system for any open ports\
    \ that can be used to get in. The port scanners that you can choose from is going\
    \ to be numerous and they can be found online. However, most of these scanners\
    \ are going to use techniques that are going up getting the hacker caught because\
    \ they are outdated. `nmap` is not going to only scan all the ports that open\
    \ on a system, it is also going to tell you the operating system and the version\
    \ numbers of the programs that being used on computer.\n\n### Common ports\nThere\
    \ are some of the more common ports that are going to be opened for hackers to\
    \ get into and in this list, you are going to find not just the port name, but\
    \ the service that normally runs.\n\n| Port | Service |\n| :--- | :--- |\n| 445\
    \ | `SMB` - is going to use `NetBios` unless it has to use `TCP` |\n| 20 | `FTP`\
    \ - is used mostly for file transfers |\n| 443 | `SSL` - a secure layer for the\
    \ `sockets` |\n| 21 | `FTP` - another one for file transfers |\n| 389 | `LDAP`\
    \ |\n| 22 | `SSH` |\n| 220 | `IMAP` - this will use the internet message access\
    \ 3 |\n| 23 | `Telnet` |\n| 194 | `IRC` - which is used for the chat that is to\
    \ go between the computer and the internet |\n| 25 | `SMTP` - mail transfers |\n\
    | 161 | `SNMP` - a network management |\n| 53 | `DNS` - the domain name |\n| 143\
    \ | `IMP` - the internet message but is not going to be a specific version |\n\
    | 68 | `DHCP` - the host for configuration |\n| 139 | `NetBIOS` |\n| 79 | `Finger`\
    \ |\n| 137 | `NetBIOS-ns` |\n| 80 | `HTTP` |\n| 110 | `POP3` - the post office\
    \ protocol version 3 is going to be used\n\n## CHAPTER 4) KALI LINUX\n\n### A.\
    \ WHAT IS KALI LINUX\nTo get started with wireless hacking, one must first become\
    \ familiar with the tools of the trade. No single tool is more valuable, especially\
    \ to a beginning hacker, than Kali Linux. A free, stable, well-maintained, and\
    \ astonishingly complete set of analysis and penetration software, Kali evolved\
    \ in the crucible of open-source Linux distributions and has emerged as the king\
    \ of all hacker operating systems. This successor to the notorious `BackTrack`\
    \ distribution has everything a hacker needs, from newbies to experts.\n\n###\
    \ B. HOW TO INSTALL KALI LINUX\nThe most convenient way to use Kali Linux long-term\
    \ is by installing it on your hard drive. You can install Kali Linux alongside\
    \ other operating systems such as Windows, MacOS, and other Linux distributions.\
    \ To install Kali Linux on the hard drive, we are going to require several tools.\
    \ They include:\n* USB/DVD bootable media\n* A minimum 20GB disk space for Kali\
    \ Linux installation\n* Kali Linux ISO\n\nPhysical machine requires a clean, non-partitioned\
    \ hard drive without any data in it. Here, we are installing Kali alongside another\
    \ operating system. Once you have obtained a media device such as USB or DVD,\
    \ it is time to create a bootable disk. If you are using a USB flash drive, download\
    \ and install `BalenaEtcher` tool and follow instructions to burn the image. Once\
    \ you have created your bootable media, you need to create a partition for Linux\
    \ partition. If you are using windows, open disk manager, select the disk to partition,\
    \ and click shrink. Set the size of the partition—it must be 10 GB and above—and\
    \ click shrink. Once you have allocated your partition size, boot your device\
    \ using the created bootable media above. NOTE: Different computer models have\
    \ different boot configuration. You can search the internet for your device boot\
    \ options. Once your system boots, Kali Linux will prompt you with the following\
    \ boot menu. Choose the method of installation. The graphical installer is the\
    \ friendlier to beginners. Select and configure your preferred language of installation.\
    \ Next, select your geographical location. The next step is to configure your\
    \ keyboard settings. Follow this with setting up your network settings and connect\
    \ to a network. After that, create a password for the root user, which is a MUST-do.\
    \ Continue to setup user account and password. On the next screen, which is the\
    \ partition part, select ‘use the largest continuous disk space’ and select the\
    \ partition you created earlier. Confirm and allocate the disk space, and then\
    \ select ‘write changes to disk.’ Select ‘yes’ and continue. Wait until the installation\
    \ process completes. The next step is the package manager. Select ‘yes’ and continue.\
    \ If you select yes, make sure your device has an active network connection. If\
    \ not, select no. Next, install the `GRUB` bootloader on to the disk. Once the\
    \ installation has completed, reboot the computer and select Kali Linux in the\
    \ `GRUB` menu.\n\n### C. INSTALLATION OF VIRTUAL MACHINE VMWARE\nAdvances in processor\
    \ speed, the advent of multicore and multiprocessor chips, increased memory size,\
    \ and increased data storage have made hardware virtualization a viable and practical\
    \ means of running multiple software platforms on a single computing device. Running\
    \ operation systems within a `VM` has advantages because it eliminates the need\
    \ for multiple pieces of expensive hardware and makes the use of highly specialized\
    \ distributions such as Kali practical. In addition, using penetration testing\
    \ software within a single host allows hackers to practice attacks in a safe “sandbox”\
    \ environment, targeting various other `VM`s within the host. The downside of\
    \ using an OS within a `VM` is that there is competition for host resources, and\
    \ the virtual hardware capabilities are limited to those of the host machine.\
    \ Functional and feature-rich virtual machine software is available free of charge.\
    \ Most common free applications are `Virtualbox` and `VMware Player` (which has\
    \ commercial versions with additional features). `QEMU` is an open-source option\
    \ that runs solely on Linux.\n\n### D. HOW TO WORK WITH KALI LINUX\nThis kind\
    \ of operating system is known as a distribution and is designed for penetration\
    \ testing and security auditing. It is meant for a single user at a time. This\
    \ limits the potential for security breaches. In fact, this system is very particular\
    \ about security since it is designed for people who work in information and network.\
    \ It can be modified to allow for more users and become compatible. It is recommended\
    \ that you work within the parameters of the Linux system so as not allow in any\
    \ security breaches. Because it is such a closed system, it won’t be compatible\
    \ with programs that permit a lot of online interactions or open sourcing. Steam\
    \ won’t work with it at all, nor will Launchpad and many commonly used programs.\
    \ If you want to install additional programs on Linux that connect to a network,\
    \ such as Bluetooth, then you won’t have much luck. These kind of services are\
    \ disabled under the default settings used by Kali. The distribution is intended\
    \ to remain secure, and unless you tamper with the settings it will stay that\
    \ way. You can tamper with the program as you like, but when you first start out,\
    \ you probably shouldn’t try to tamper with it. Wait until you are familiar with\
    \ it to start doing high-level modifications.\n\n### E. HOW TO START HACKING WITH\
    \ KALI LINUX\nDepending on the needs of the user, they may wish to build their\
    \ own ISO using available tools. Building your own ISO can be rewarding as it\
    \ allows the user to fully customize their build, rather than relying on the pre-built.\
    \ Most of these modification builds are done using Debian live, given that Kali\
    \ Linux is built on Debian core. These scripts allow the user to automate the\
    \ process of building a live system by creating a framework for the configuration\
    \ set to be able to build the needed image. This ensures that the custom build\
    \ remains safe and secure.\n\n### F. EXPLAIN ALL THE BASIC CONCEPTS TO KNOW BEFORE\
    \ HACKING\nGiven the short background of Kali Linux as discussed, it would be\
    \ beneficial for the reader to have a short overview of the features and specific\
    \ capabilities, which should give a clearer idea of what Linux really is and how\
    \ it is used. Expansive library of network security and penetration testing tools:\
    \ Kali found its origins from Backtrack, and thanks to this, there have a huge\
    \ amount of tools developed over time for the distribution. However, lot of these\
    \ tools have been rendered redundant or outdated, which no longer serve the intended\
    \ purpose while integrating and adding new tools.\n\n### G. INSTALLATION OF VIRTUAL\
    \ MACHINE VMWARE AND INSTALLATION OF KALI LINUX IN DETAIL\nFor Kali Linux to run\
    \ “live” on standard Windows or MacOS based computers running on Intel processor,\
    \ the user has to make sure they have a bootable image, which is available in\
    \ both 32-bit and 64-bit format. If the user is not entirely sure of what architecture\
    \ they will be running, if they are operating on Linux or OS, for example, the\
    \ command `uname -m` on the command line should return either `x86_64` or `i386`.\
    \ In case of `x86_64`, it means that 64-bit format should be used, while `i386`\
    \ means that 32-bit format should be used. For Windows users, system architecture\
