    \ Wait until you are familiar with it to start doing high-level modifications.\n\
    \n## II. PRIORITISING PROCESSES\n\nThe hacker now has access to the resources\
    \ available on the database. The hacker is then free to either extract the information\
    \ he sees of value or is able to take control of the network and use it as a base\
    \ to launch further attacks against other networks in how we described a DoS attack.\
