    virtual Linux machine, the user can login, with the default username and password
    of the application being set to “msfadmin”. Once logged in, the user should change
    the application’s network settings to “bridge”, and restart the machine in order
    to make sure that the changes have properly taken effect. ii. PRIORITISINNG PROCESSESESThe
    hacker now has access to the resources available on the database of the organization.
    The hacker is then free to either extract the information that he sees of value
    or he is able to take control of the network and use it as a base to launch further
    attacks against other targeted networks in how we described a DoS attack. By gaining
    access to the network, the hacker now has control over one or more devices.As
    was the case in the preventative measures of scanning, there are some precautions
    that administrators and security personnel are able to take to ensure that devices
    and services are more challenging to access by legitimate users such as black
    hat hackers. This can involve restricting access of users such who have no legitimate
    day to day requirement to be accessing the devices. Furthermore, security managers
    should be closely monitoring the domains and those who are accessing services
    such as local administrators. Using physical security controls will allow managers
    to detect attacks that are occurring in real time and can deny access while also
    alerting the proper authorities to ensure the intruder is exposed. Another approach
    which can be taken to ensure that access is denied is to encrypt highly sensitive
    and confidential information using protection keys. This would mean that any attacker
    attempting to access the system regardless of how well the system is protected,
    will gain access only to find that the information is scrambled and with the keys
    protected, the attacker would have no reliable method for using the data that
    has been encrypted. Encryption is a good final line of defence for particularly
    valuable data however it cannot be relied upon entirely in itself. Even if the
    attacker was to access the system and discover that the data is encrypted, they
    can still wreak havoc on the network and even disable it, causing significant
    damage as a means of sabotage. Even more alarming, the attacker could have control
    over the system and use it for further crimes which could be traced back to the
    organization''s network. Once the attack has gained access to the system, they
    are still far from being in the clear. Access is for a limited time, the longer
    the hacker is operating from the system, the greater the chances of being caught.
    The hacker must then shift to the next phase, maintaining access to ensure they
    are able to collect as much data as possible. Maintaining AccessThe hacker is
    working against the clock at this point and they must ensure they are able to
    maintain access long enough to succeed in what they had set out to do whether
    this was to steal critical data and information or to launch a further attack
    from the encumbered server. The hacker has been able to avoid detection up until
    this point, however they are still at risk of being caught and the longer they
    have access to the system, the higher the risk they could be detected.Covering
    TracksYou are aware that there are a number of attacks launched using the network,
    which means that hackers do consider access points to be among the most vulnerable
    aspects of any information technology fortress. If you remember the Heartbleed
    incident, you would realize that even top corporations can be easily exploited
    over the network, even causing their more advanced systems to suddenly spit out
    confidential and encrypted information about their clients. If they are vulnerable,
    then so are you.If you suspect that your system has been attacked over your network,
