    ```\nThat should allow us to access a few data packets. If we want to save the\
    \ data in a file, which we do, we add another command to the end, `write *filename>`,\
    \ so it should look like the following:\n\n```\nairodump-ng wlan0mon --write *filename*\n\
    ```\nThat will store any captured packets in `filename.cap`. Once we have about\
