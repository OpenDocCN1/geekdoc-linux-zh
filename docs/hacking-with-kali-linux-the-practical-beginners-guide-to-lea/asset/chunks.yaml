    Denial of Service, as we had mentioned earlier. This involves causing a website
    to become unusable. The site is taken down due to the flooding of information
    and traffic, enough to overload the system as it struggles to process all the
    requests and is ultimately overwhelmed and crashes. These attacks are employed
    by hackers who aim to disrupt websites or servers that they want to cause destruction
    to for whatever their reason or motivation was.3\. To detect weaknesses within
    a computer network, hackers use a tool known as vulnerability scanner. This could
    also refer to port scanners which are used to scan a specific computer for available
    access points that the hacker would be able to take advantage of. The port scanner
    is also able to determine what programs or processes are running on that particular
    port which allows hackers to gain other useful information. Firewalls have been
    created to prevent unauthorised access to these ports however this is more of
    a harm reduction strategy rather than a sure-fire way to prevent hackers.4\. If
    you have ever wondered why you have a limited number chances to enter your password
    before being denied access, the server you are attempting to access has a safeguard
    against brute force attack. Brute force attack involves software that attempts
    to recreate the password by scanning through a dictionary or random word generator
    in an extremely short amount of time to hit on the password and gain access. For
    this reason, passwords have advanced to become far longer and more complex than
    they once were in the past, such as including characters, numbers, upper and lower-case
    letters and some going as far as barring words that are found in the dictionary.5\.
    Waterhole attacks are known by this name due to the fact hackers prey on physical
    locations where a high number of people will access their computers and exchange
    secure information. Similar in a way that a waterhole can be poisoned for the
    wildlife surrounding, the hacker can poison a physical access point to claim a
    victim. For example, a hacker may use a physical point such as a coffee shop,
    coworking space or a public Wi-Fi access point. These hackers are then able to
    track your activity, websites frequented and the times that you will be accessing
