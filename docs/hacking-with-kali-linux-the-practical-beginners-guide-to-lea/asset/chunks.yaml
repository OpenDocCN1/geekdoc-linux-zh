    \ but only from authorized sources. SQL injection is a method where unauthorized\
    \ sources are granted access to the database. This is done through “inserting”\
    \ them into the normal flow of queries in order to disguise them as authorized\
    \ requests. This is also a method of security breaches. In fact, this system is\
