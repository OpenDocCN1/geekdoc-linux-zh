    a safe surfing environment. Adequately securing the website protects it from being
    infected with malware, protects your visitor''s details, improves your web ranking
    and ensures you continue doing business for a long time. Keep in mind that once
    your website is hacked, it is very difficult to put it back together. You will
    lose customers when your website goes down and your reputation will also be lost.We
    have talked about the various flaws that can be exploited on the server and client
    sides of a website. Some of these attacks are very difficult to detect and that
    is why prevention is the best policy. If you run a website based on a content
    management system like WordPress or Joomla, always install security plugins that
    are available on that CMS. Sitelock is a valuable tool that scans a website daily
    for flaws, malware and viruses. Investing in a good cloud protection service is
    also a great idea, as it will filter all of the content that reaches the site
    and screen out suspicious traffic and bots.One of the most popular and commonly
    executed website attacks is the SQL injection. Exploiting this flaw gives a hacker
    access to private information. This type of attack is executed on websites that
    have form fields which accept user input. A very good way to prevent this attack
    is to use parameterized queries. This ensures the website contains parameters
    that make it impossible to insert malicious codes.We also talked about cross-site
    scripting attacks, or XSS attacks for short. We now know that cross-script attacks
    are a result of JavaScript codes that are executed in the client''s browser. As
    with the SQL injection attack, preventing the XSS attack requires that the programmer
    or developer state explicitly what entries are allowed in a browser’s various
    user input fields. A great way to do this is by implementing a content security
    policy, or CSP for short. This will give directions to the browser for different
    entry fields, including which field should allow for executable scripts and which
    should not. For websites that require user login information, it is important
    to insist on strong passwords when the user registers. Users should create a password
    that is a mixture of letters, numbers and special characters or symbols. It is
    also important to ensure that passwords are encrypted when users log into the
    website. This measure makes it difficult for hackers to crack the password if
    they happen to execute a man-in-the-middle attack. Also keep in mind that it takes
    just one weak password for a hacker to gain access to all of the accounts.Also
    ensure that user inputs are properly validated when they are typed in and when
    they are sent over to the server. This client side and server-side validation
    ensures that malicious codes are not mistakenly executed. Regarding the browser,
    on the web page, it is important to define the fields that require input and to
    also make sure they follow the input field specification. A field that is meant
    for numbers should reject a letter or a special character input before the content
    is sent to the server for another phase of input validation.If you run an e-commerce
    store, a banking app or any other website that accepts and stores very sensitive
    information, get an SSL certificate. This provides an extra layer of security
    for your website. Customers and clients who visit your site will rest easy when
    they see that “HTTPS” precedes your website URL. This HTTPS encrypts all the information
    traveling to and from your server. It renders any information being sought by
    a hacker as useless even if he or she is performing the sniffing attack. Error
    messages displayed to the user should be kept minimal. If an error message is
    to be shown to the user at all, it should not include vital information like the
    database type or error code. It is a good idea to configure the error message
    to display a generic message because error messages give a hacker information
    about the underlying structure of the website or web app, which can be used to
    coordinate a targeted attack.It is also important that your admin username and
    password are very strong. Make sure there is a limited number of login trials
    on the login page. Ensure that security questions are asked when a user uses the
    “forgot password” link. Even if the user gets the question right, avoid sending
    the login username, password or other credentials to the user''s email.Make sure
    you set strict permissions that need to be granted before anyone can access your
    files. Ensure that only the admin can edit some files, while keeping other files
    readable for the website’s users. It is also a useful practice to limit the number
    of files that can be uploaded on your website. Through file uploads, it is easy
    to embed malicious codes that can open up a website to attacks. Make sure that
    all uploaded files are saved in a private folder and can only be shown by executing
    a script written solely for that purpose. Furthermore, you should not allow the
    uploaded files to reach the root folder.As with web apps and websites, it is important
    that we ensure that when coding or working with programmers on a project, we adopt
    what is known as secure coding practice. Examples of secure coding practice include
    designing a system for maximum protection against hacks, building each module
    separately, testing modules for flaws and merging everything together so that
    the entire application can be tested for other vulnerabilities. It is also a good
    policy to keep designs as simple as possible. Complex websites or web app designs
    are more prone to errors and issues that a malicious user can take advantage of.
    As mentioned throughout this book, data sanitization is very important for securing
    your website or web app. Always sanitize the data that is flowing through your
    application, whether it is coming from the user, the server or even a third-party-linked
    application.CHAPTER  5) HOW TO HACK WITH KALI LINUXA. HOW TO START HACKING WITH
    KALI LINUXWhile Kali Linux is used by security professionals all over the world
    and is a highly specialized version of Linux, it won’t cost you anything. The
    developers vow that it will always be free, even as they continue to provide support
    and updates for their version of Linux. They also make sure that modifications
    are not being made to the OS by just anyone.What Kali Linux DoesThis kind of operating
    system is known as a distribution and it is designed for penetration testing and
    security auditing. It is meant for a single user at a time. This limits the potential
    for security breaches.It is recommended that you work within the parameters of
    the Kali Linux system so as not to allow in any potential security breaches. Because
    it is such a closed system, it won’t be compatible with programs that permit a
    lot of online interactions or open sourcing. So Steam won’t work with it at all,
    nor will Launchpad and many other commonly used programs. If you want to run those
    programs, then you should really use a different operating system that isn’t designed
    to be as narrowly focused as this one is.B. STEP BY STEP SPPROACH ON HACKING WITH
    KALI LIUNXBy now, we should have a good idea of what Kali Linux is used for, and
    what “white hats” are, and ethical hacking. In addition, we have already gone
    over how to make sure that the Kali Linux that the user is downloading is verified
    and safe, with no malware or any other modification that would compromise its
    security. We now also know how to build our own installer image and package of
    Kali Linux, customizing it to our needs. We’ve already gone over how to install
    Kali Linux, and even dual – boot it, in case we need such a feature. Now we can
    go on to some of the basics, how to actually use this program that we’ve learned
    about, downloaded, and installed. C. STEP BY STEP GAINING REMOTE ACCESSWifi hacking
    is one of the most basic forms of hacking, and is usually taught to beginner white
    hats to get them familiar with the process. The first step is to find a wireless
    network to hack: remember that “just trying” or “I’m learning” is not an excuse,
    and any unauthorized access or attempt to access without authorization may be
    punishable, so best that you ask permission, or better yet, simply create your
    own wireless network for convenience. Now that we have a wireless network to work
    with, the next step is to find out the name of your own device’s wireless adapter.
    Note that there are a couple of terms that we should be familiar with: “eth –
    ethernet”, and “wlan – wireless local area network”. The “wlan” is what we’re
    looking for, so keep an eye out for that. Boot up your Kali Linux terminal and
    type in ifconfig, which should show us a lsit of all the terminals of our computer.
    Take note of the “wlan” adapter, along with the suffix, which is usually 0 / 1
    / 2. Now that we have our wireless adapter, we now have to enable monitor mode.
    The user can employ a tool called airmon – ng to create a “mon” virtual interface.
    This can easily be done by typing Airmon – ng start wlan0 This should create a
    monitoring interface, which would be named by default as - mon0 if using an earlier
    version of Kali Linux, but if using the Kali Linux 2.x onwards, the name would
    be wlan0mon. Once the monitoring interface is up, we can begin to attempt to capture
    data packets that are being transmitted by the wireless network that we are trying
    to crack into. The following tool should help us gather data: Airodump – ng wlan0mon That
    should allow us to access a few data packets. If we want to save the data in a
    file, which we do, we add another command to the end, “write *filename*”, so it
    should look like the following: Airodump – ng wlan0mon - - write *filename* That
    will store any captured packets in *filename*.cap. Once we have about ten thousand
    data packets minimum stored, we can proceed with the wifi cracking process. Now
    that we have our data packets, we can open another terminal and type in: Aircrack
    – ng *filename*-01.cap This should begin the cracking process, or, if there are
    multiple wireless networks, the program will ask which wireless network will be
    the target of the crack. Note that if there are multiple wireless networks, the
    amount of captured data packets needed may be even higher. If the password is
    fairly weak, then the password should appear in the following format: Xx :: xx
    :: xx :: xx :: xx :: xx :: xx … Remove the colons (so it will be “xxxxxxxxx”),
    and that should be the password of the wireless network. If the data packets captured
    aren’t enough, then the program will tell you so, and you have to gather more
    data packets to have enough to crack into the wifi. One of the more common attacks,
    as earlier discussed, is SQL injection in order to gain access to a website or
    a database. Though the reader should know this by now, just for review: SQL is
    a structured query language that allows the computer to manage data, in order
    to store, manipulate, and retrieve data from the server or system database. The
    database is the repository of all the data, often containing passwords and other
    sensitive information. So what is SQL injection? SQL injection is a way of injecting
    queries into the database. Now the database is specifically meant to answer queries,
    but only from authorized sources. SQL injection is a method wherein external queries,
    from unauthorized sources are granted access to the database. This is done through
    “inserting” them into the normal flow of data queries in order to disguise them
    as authorized requests for information. This allows the hacker to retrieve the
    information in the database, whether it be passwords, encryption keys, or even
    raw data. There are also some SQL injection methods that not only allow for retrieval
    of information, but even insertion of malware or other files, which may allow
    the hacker in question to control the database, either locking out the owner or
    even deleting some or all the files within. Needless to say, SQL injection is
    one of the preferred methods of attack by many hackers. Now, “white hats” can
    duplicate some types of methods of SQL injection by trying to find vulnerabilities.
    One of the tools available to a white hat running the Kali Linux distribution
    is “metasploitable”, a virtual linux machine that will allow a person to practice
    gaining access and looking for vulnerabilities using the SQL injection method. The
    “metasploitable” virtual machine is available online, or may even be contained
    in the bundle or installation of your Kali Linux. It should include various duplicates
    of web applications that have vulnerabilities, something that will help the “white
    hat” learn how to find vulnerabilities and how access to them is gained, which
    in turn can help the network security professionals find a way to shore up those
    vulnerabilities by patching them out or developing workarounds. After installing
    or opening the “metasploitable” virtual Linux machine, the user can login, with
    the default username and password of the application being set to “msfadmin”.
    Once logged in, the user should change the application’s network settings to “bridge”,
    and restart the machine in order to make sure that the changes have properly taken
    effect. CHAPTER 6) QNA ON HOW TO HACKING WITH KALI LINUXQUIZ1\. What is Keylogger?2\.
