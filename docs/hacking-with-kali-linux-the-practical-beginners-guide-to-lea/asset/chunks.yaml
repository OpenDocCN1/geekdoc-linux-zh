    一旦你发现了一个可能的分布向量，就可以开始实施额外的缓解措施了，首先是实施网络控制列表，以拒绝应用程序与其他系统直接通信的能力。这样做将立即变得更容易对特定资源进行隔离和沙箱化，从而让你能够更准确地确定问题所在。你可以使用内部
    DNS 来执行此任务，只需为任何已识别的应用程序或服务器的 DNS 区域添加一个空指针，就可以轻松地看到哪些是运行中的，哪些是未识别的。


    ### D. 防火墙以及你的防火墙选择

    这是一种网络过滤措施，曾通过作为邮件附件发送的加密 PDF 文件被绕过，这些文件既可以包含命令，也可以收集数据（例如邮件内容和元数据）。这些 PDF 文件可以使用
    PDF 查看器打开，但实际上只包含一个 1x1 像素的白色图像，显示为空白页。`Outlook` 中存在合法的自动化邮件管理系统被用来隐藏这些命令与控制邮件，因此，紧盯着收件箱的用户只能看到邮件的一闪而过，漏洞程序就会在不留留任何记录的情况下将其删掉。桌面通知也被阻止了。该漏洞程序带有一份预设的电子邮件地址列表，它可以向
    `Turla` 报告，但也有添加备份电子邮件地址的方法，以防原始地址被封。


    从方方面来看，`Turla` 是一个国家支持的黑客组织，因为他们的目标主要是监控和追踪，而不是直接的财务收益。他们表现出了极大的耐心技巧，使用自定义加密方法在他们的漏洞最终被发现时尽可能争取时间。最终，整套
    `Turla` 恶意软件被查出。其中包括用于部署 `Outlook` 漏洞的木马，例如 `Gazer`，作者甚至在代码中加入了一些视频游戏的引用。恶意软件以前曾被用于攻击国家，而这个漏洞与世界上最著名的网络武器
    `Stuxnet` 相比是相当温和。


    ### E. 关于加密和数字签名你需要了解的知识

    加密和哈希的通性问题在于，一旦部署，这些算法就会保持不变，但计算能力的进步使得这些安全措施的安全性被破解的可能性增加。因此，使用旧软件变成了一场赌博，随着时间的推移，这种赌博越来越可能让你崩溃；但更新并不总是最佳选择，因为这需要成本并干扰你的工作流。你不必义务在软件一发布时就立即更新到最后一个版本——除非其他人依赖于你。


    另一方面，公司确实应该尽一切努力加强其网络安全工作并防止数据泄露，这是一种发生得惊人的常态。当你的电脑被黑时，你可以丢失银行数据，但同样很容易地拨打银行撤销任何交易；当
    `Facebook` 被黑时，数百万人的最私密数据，从聊天记录到相册将暴露在黑客面前，并可能在未来的某个时间点被利用。


    医院和机场是非常脆弱的目标，在它们受到勒索软件攻击之前，我们并不会考虑到它们。勒索软件是一种锁定系统直到向黑客支付某些资金（通常是加密货币）的恶意软件。2017
    年 5 月，`WannaCry` 勒索软件影响了全球超过 20 万台计算机，包括医院、银行和机场的计算机。这些机构中的一些在支持日期之后仍在使用 `Windows
    XP`，这使得黑客可以轻而易举地进入办公室，插上受感染的 `USB` 并锁定他们的整个网络。是谁制作了 `WannaCry`？据说是由 `NSA` 制造的黑客工具，被黑客组织盗取并改用于盗窃。


    无论如何，硬件和软件故障都会发生；因此，最明智的举措是备份你的数据，这是防止攻击的唯一可靠方法。尽可能将原始数据和备份分离，最好一个放在云端，另一个放在断开网络连接的外部硬盘上。在备份中包含照片、语音消息和其他个人琐事，这样这些珍贵的记忆就不会因为黑客攻击而丢失。


    ### F. 什么是 VPN 以及如何使用它保护自己的安全

    如今大多数用户都有路由器，将手机、平板和平电脑等设备连接到互联网。你的互联网服务提供商会给路由器一个公共 IP 地址，每个连接到互联网的设备将获得一个私有
    IP 地址。由路由器提供。每当你将电脑连接到互联网时，看起来就像你的电脑就是路由器。在用户只有一台电脑的情况下，他们可以直接将其连接到互联网，他们的 `ISP`
    会分配一个公共 IP 地址。由于分配的 IP 地址是公开的，另一端的主可以追踪你的上网活动。


    `VPN`（虚拟专用网络）允许用户连接到另一个网络。`VPN` 将你的电脑提供自己的 IP 地址。`VPN` 可用于隐藏你的原始 IP 地址，你的 `ISP`
    提供的 IP 地址将被隐藏。`VPNs` 不仅用于隐藏 IP 地址。你可以访问你组织的任何网络，这些网络可能被某些网络封锁。互联网上有许多商业和免费的 `VPN`
    及代理服务。使用这些服务，你可以通过新的 IP 地址连接到互联网，你的原始 IP 地址将被隐藏。


    ### G. TOR 隧道和代理链

    `Linux` 支持经典的多程序设计方案。`Linux` 支持并行（如果只有一个处理器则为准并行）用户进程。每个进程都运行在自己的虚拟地址空间中，即进程之间相互保护，其中一个进程的崩溃不会影响其他运行的进程以及整个系统。在没有另一个进程“许可”的情况下，一个进程无法从另一个进程的内存中读取或或写入）任何内容。系统允许进程之间的授权交互。


    `内核` 提供了创建新进程和管理生成进程的系统调用。由于 `SMP`（对称多处理器架构）的发展，`Linux` 内核引入了线程或控制机制。线程是在虚拟内存中运行的进程，与该进程的其他线程一起使用。


    如果 `shell` 遇到对应执行文件的命令，解释器会执行它，并从入口点开始。对于 `C` 程序，入口点是 `main` 函数。运行中的程序也可以创建进程，即运行某个程序且其执行也从
    `main` 函数开始。


    ### H. 网络安全的优势

    当涉及到确保移动设备网络安全的重要性时，只有你才能准确确定除机器之外还有什么面临风险。然而，对于现在的大多数移动设备，如果小偷成功访问了存储其中的信息，除了设备本身，还有更多东西面临风险。


    你可能听过关于某大公司高管在不该留的地方离开电脑或手机引发骚动的故事。这类机密信息可能会给公司带来不可估量的损失，特别是当它有需要隐藏的时候。即使你的设备中没有严重的秘密，如果错误的人访问了它，普通智能设备上的信息足以让你的生活变得非常困难。在保护移动数据隐私时，请记住以下几点。密码保护一切：无论访问设备额外多花
    30 秒，这一个简单的步骤就能将设备被错误人员访问的概率降低 100% 以上。它简单、随手，且在首次设置设备时就有选项，没有理由不充分利用。

