    \ This type of attack is executed on websites that have form fields which accept\
    \ user input. A very good way to prevent this attack is to use parameterized queries.\
    \ This ensures the website contains parameters that make it impossible to insert\
    \ malicious codes. We also talked about cross-site scripting attacks, or XSS attacks\
    \ for short. We now know that cross-script attacks are a result of JavaScript\
    \ codes that are executed in the client's browser. As with the SQL injection attack,\
    \ preventing the XSS attack requires that the programmer or developer state explicitly\
    \ what entries are allowed in a browser’s various user input fields. A great way\
    \ to do this is by implementing a content security policy, or CSP for short. This\
    \ will give directions to the browser for different entry fields, including which\
    \ field should allow for executable scripts and which should not. For websites\
    \ that require user login information, it is important to insist on strong passwords\
    \ when the user registers. Users should create a password that is a mixture of\
