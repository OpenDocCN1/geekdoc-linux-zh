  trans: '


    - 后门（Backdoor），也被称为加密系统或算法，是绕过密码等正常安全控制的方法。它们可以是授权的（针对特定目的），也可以由攻击者添加。无论何种情况，它们都会产生漏洞。

    - 拒绝服务攻击（Denial-of-service attacks）的目标是使计算机或资源不可用。这可以通过多次输入错误密码导致账户锁定，或者通过请求过载系统来阻塞所有用户。这些攻击可能源于僵尸电脑，甚至可能通过诱导无辜系统发送意外流量。

    - 窃听（Eavesdropping）顾名其实义——监听网络主机之间的私人通信。某些政府机构使用特定程序对互联网服务提供商（ISP）进行“审计”。当电磁传输被监控时，这种广泛的做法还会延伸到闭式系统。

    - 通过伪造数据以获取未经授权的数据访问权限，这种行为被称为欺骗（Spoofing），它有多种形式：电子邮件伪造（伪造发件地址）、MAC 伪造（更改介质访问地址以伪装成合法用户）、生物识别伪造（伪造生物识别样本）、IP
    地址伪造（更改源 IP 地址以隐藏身份或冒充另一个系统）。

    - 通过物理访问或直接访问攻击，攻击者可以复制数据、破坏安全、安装监听设备或蠕虫等。即使是受保护的系统也容易受到此类攻击。

    - 钓鱼攻击（Phishing）经常利用电子邮件伪造或即时消息，通过看起来与合法网站几乎相同的界面，引导用户输入机信息。

    - 通过权限提升（Privilege escalation），攻击者可以欺骗系统授予受限数据或资源的访问权限，从而提升其访问级别。

    - 点击劫持（Clickjacking）字面意思是劫持用户点击指向非预目标网站的链接或图标。点击劫持尤为狡猾，它会将点击（有时是按键输入）路由到无关的页面。

    - 通过冒充机构、银行、客户或其他实体，社会工程会导致用户泄露密码、信用卡号和其他隐私信息。据报道，这种诈骗每两年给美国企业带来的损失超过 20 亿美元。


    如果没有计算机，世界将回到工业革命之前的模式。技术简化了生活的方方面，特别是对于企业和其他公共实体，其中一些正面临着日益严重的风险。


    ### 金融系统

    金融监管机构、投资银行和商业银行吸引了网络犯罪分子，他们看到了市场操纵和非法获利的途径。任何允许资金转账或购买商品的网站也是目标，ATM 机也是如此，它们经常被黑客获取客户数据和
    码。


    ### 公用事业与工业

    包括电网、核电站、水网和气网在内的关键服务由计算机控制。事实证明，即使是那些未连接互联网的计算机控制系统也容易受到攻击。


    ### 航空

    大型机场的一次停电会对航空交通产生动荡连锁反应。无线电传输将被中断，可能发生机载攻击、系统完整性和飞机的丢失，以及航空管制故障，这些只是可能的结果之一。


    ### 个人设备

    人们用来简化生活的各种奇妙设备——智能手机、平板电脑、智能手表、活动追踪器——都可以通过内置摄像头和其他设备被利用。攻击者可以收集健康或其他个人信息，或将设备网络作为攻击路径。


    ### 公司

    身份盗窃和信用卡信息等数据泄露一直针对 Target 公司和 Equifax 等大型公司。在某些情况下，外国政府试图通过攻击传播宣传或进行间谍活动。医疗诈骗让每个人都受害，而冒充患者获取非法用途的药物也是常见的。尽管存在这些活动，62%
    的组织在 2015 年没有加强安全培训。


    ### 汽车

    如今的车辆实际上可以自动驾驶，这一天已不远。巡航控制、安全气囊、防锁刹车和其他功能让驾驶变得更加愉快，并希望更加安全。WIFI 和蓝牙保持汽车连接，并增加了安全漏洞的可能性。


    ### 政府

    对政府和军事系统的攻击会造成混乱、中断服务，并在极端情况下被归类为恐怖行为。无论是活动分子、外国政府或其他黑客，结果都是人员记录、警察及其他急响应人员的通信、学生记录、交通控制和金融系统的基础设施故障。护照和准入卡等个人身份物品的广泛计算机化也导致了该领域的漏洞。


    ### 物联网 (IoT)

    带有传感器、软件或任何类型的网络连接以存储和共享数据的物理对象是物联网的一部分。一栋建筑、一个车辆或家用电器组成物联网，这种现代现象的扩散产生了物理（而非仅仅虚拟）威胁的可能性。例如，被盗的手机可以解锁住宅或酒店房间的门。


    ### 医疗系统

    病毒、敏感医疗数据泄露、诊断设备和其他设备都是攻击的潜在目标。这些威胁被认为极可能发生，因此美国食品药品管理局（FDA）在 2016 年为医疗设备制造商制定了安全维护指南。然而，其中并未包含具体的建议或实施结构。


    ### 恶意软件

    各种类型的恶意软件是普通组织日常运营的最大威胁，它们具有直接影响关键数据和资产可用性的潜力。因此，如果希望有效对抗这种威胁，无论大小的组织都需要提高警惕性，同时评估它们在响应、检测、准备和对潜在威胁规划方面的能力。由于新类型破坏性恶意软件必然会随着推推演变，不仅了解组织将如何准备已知威胁至关重要，了解它将如何准备未知威胁也同样关重要。


    ### 分布向量

    具有潜在破坏性的恶意软件经常具有针对大型系统的能力，这些系统随后可以在给定网络中的多个点同时执行。因此，组织定期评估其运行环境以寻找可能指示恶意软件传播或交付的异常通道至关重要。值得关注的系统包括：


    - 企业级应用，特别是那些可能与多个主机和终端直接接口的程序。常见示例包括补丁管理系统、资产管理系统、远程协助软件、防病毒软件、集中备份服务器、文件共享和网络管理系统。

    - 虽然不仅限于恶意软件，但以下威胁者可能破坏资源，最终影响关键应用程序的可用性。此类类型的潜在威胁包括集中存储设备、高风险分区或数据存储、网络设备、路由表和关键网络资源。

    '
- fmt: '

    ## Strategies for success


    While there are plenty of potential malware vectors that the average organization
    needs to deal with on a regular basis, there are also numerous different strategies
    that make keeping malware at bay far more manageable.


    The first of these is ensuring a viable communication flow at all times. It is
    also important to ensure that your flow paths for communications are not only
    well defined but authorized or documented as well. From there, you will want to
    strive to increase awareness of systems that can be utilized as a gateway to laterally
    pivot as needed or directly connect to relevant endpoints found anywhere throughout
    the enterprise. Whatever you do, it is important to do what you can to ensure
    that these systems are maintained within these restrictive `VLANs` with appropriate
    network access control and segmentation as needed.


    When it comes to ensuring the right amount of control over who has access to what,
    it is important that enterprise systems that can interface with numerous endpoints
    directly all require dual-factor authentication for any interactive logins. Further,
    it is important to make sure that authorized users are limited to a specific subset
    of the organization’s personnel. Whatever you do, it is important that the default
    user group doesn’t have the ability to authenticate or access these systems directly.


    You will also need to ensure that unique domain accounts are documented and utilized
    for every service that involves and enterprise application. The context in which
    these permissions are assigned to various accounts should always be fully documented
    and also configured in such a way that the greatest number of users have the fewest
    number of privileges possible. Doing so provides the enterprise the ability to
    track and monitor actions that are taken based on assigned service accounts.


    This is why it is important to avoid providing a service account with either interactive
    or local login permissions. In fact, service accounts should be expressly denied
    these types of permissions, especially if access to critical data locations or
    important network shares. Additionally, accounts that are used for the purpose
    of authenticating centralized servers should not contain downstream systems that
    have elevated permissions as this could allow a system that is far easier to compromise
    to infect a system that is typically far better protected.


    ## Recovery planning


    A business impact analysis is a crucial component when it comes to preparing a
    contingency plan in case your system is attacked in a serious way. This plan should
    provide your organization with two key components: interdependencies and a classification
    and characterization of relevant components.


    To plan for this type of scenario, an organization is going to need to address
    the accessibility of available resources including mission critical applications
    and systems, contact information for crucial external contacts, contact information
    for essential personnel and a secure communication channel for each. It is also
    important to have all major vendor contact details, points of contact when it
    comes to organizational procurement and back up `ISO` files for all critical applications
    and systems.


    ## Containment


    If an organization experiences a large-scale outbreak of malware, the immediate
    focus should be on containment above all else in hopes of reducing the scope of
    the attack overall and minimizing the likelihood that additional systems are going
    to be impacted.


    To develop a strategy for containment, the best place to start is by determining
    the vector or vectors that are common to all of the systems that are experiencing
    problems that could have been used to deliver a malicious virus. Common options
    include:


    - `DNS Server`

    - Network boundaries or segments

    - User accounts with higher than average privileges

    - Centralized file shares

    - Centralized applications

    '
