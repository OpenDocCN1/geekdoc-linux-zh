- fmt: '

    - A backdoor, also known as a cryptosystem or algorithm, is a way to bypass normal
    security controls such as passwords. They can be authorized (as for a specific
    purpose) or added by an attacker. In any case, they create a vulnerability.

    - With the goal of making a computer or resource unavailable, denial-of-service
    attacks can occur when incorrect passwords are entered multiple times, thus locking
    the account, or by overloading the system with requests and blocking all users.
    These attacks can stem from zombie computers or even from duping innocent systems
    into sending unwanted traffic.

    - Eavesdropping is exactly what it sounds like—listening to private communications
    between network hosts. Certain programs are used by government agencies to “audit”
    ISPs. This widespread practice extends to closed systems when electro-magnetic
    transmissions are monitored.

    - Masquerading through falsifying data in order to gain access to unauthorized
    data is called spoofing and comes in many forms: email spoofing, forgery of a
    sending address; MAC spoofing, changing the Media Access Control address to pose
    as a valid user; biometric spoofing, faking a biometric sample; IP address spoofing,
    altering the source IP address to hide identity or impersonate another system.

    - Through physical access or direct-access attacks, a perpetrator can copy data,
    compromise security, install listening devices or worms and more. Even protected
    systems are vulnerable to this type of attack.

    - Phishing frequently uses email spoofing or instant messaging to direct a user
    to enter confidential information by looking almost the same as the legitimate
    site.

    - Through privilege escalation, an attacker can escalate their access level by
    fooling the system into granting access to restricted data or resources.

    - Clickjacking is literally hijacking a user to click on a link or icon to another
    website other than the intended one. Particularly sneaky, clickjacking routes
    the clicks, or sometimes keystrokes, to an irrelevant page.

    - By impersonating an institution, bank, customer or other entity, social engineering
    leads users to reveal passwords, credit card numbers and other private information.
    This scam reportedly costs U.S. businesses more than $2 billion every two years.


    Without computers, the world would slip back into pre-Industrial Revolution mode.
    Technology has streamlined every aspect of life, particularly for businesses and
    other public entities, some of which are more and more at risk.


    ### Financial systems

    Financial regulators, investment banks and commercial banks attract cybercriminals
    who see an avenue to market manipulation and illegal gains. Any website than enables
    transfer of funds or buying goods is also a target, as are ATMs, which are frequently
    hacked for customer data and PINs.


    ### Utilities and Industry

    Vital services including the power grid, nuclear power plants, water and gas networks
    and telecommunications are controlled by computers. It has been proven that even
    those controlled by computers not connected to the Internet are vulnerable to
    attack.


    ### Aviation

    One power outage at a major airport can have a tumultuous ripple effect on air
    traffic. Radio transmissions would be disrupted, an in-plane attack can occur,
    loss of system integrity and aircraft, and air traffic control outages are just
    some of the possible outcomes.


    ### Personal devices

    All of those wonderful gadgets that people use to simplify life—smart phones,
    tablets, smart watches, activity trackers—can be exploited through built-in cameras
    and other devices. Attackers can collect health other personal information or
    use the device networks as paths to an attack.


    ### Corporations

    Identity theft and data breaches such as credit card information have been aimed
    at large corporations such as Target Corporation and Equifax. In some cases, foreign
    governments attempt to spread propaganda or spy through attacks. Health insurance
    fraud, which costs everyone, and impersonation of patients to obtain drugs for
    illicit purposes, are also common. Despite these activities, 62% of all organizations
    did not augment security training in 2015.


    ### Autos

    Today’s vehicles practically drive themselves, and the day when this common is
    not far off. Cruise control, airbags, anti-lock brakes and other features make
    driving more enjoyable and, hopefully, safer. WIFI and Bluetooth keep the cars
    connected and raise the possibility of security breaches.


    ### Government

    Attacks on government and military systems create chaos, disrupt services and—to
    the extreme—qualify as acts of terrorism. Whether it is an activist, foreign government
    or other hackers, the result is infrastructure malfunction of personnel records,
    police and other first responder communications, student records, traffic controls
    and financial systems. Widespread computerization of personal identity items such
    as passports and access cards also lead to vulnerability in this area.


    ### Internet of things (IoT)

    Physical objects that carry sensors, software or any type of network connection
    to store and share data are part of the Internet of things. A building, vehicle
    or appliance can comprise the IoT, and the proliferation of this modern phenomenon
    creates the possibility for physical—not just virtual—threat. For instance, a
    stolen cellphone can unlock a residence or hotel room door.


    ### Medical systems

    Viruses, breaches of sensitive medical data, diagnostic equipment, and other devices
    are potential targets of attacks. These threats are deemed so likely that, in
    2016, the U.S. Food and Drug Administration created guidelines for secure maintenance
    of manufacturers of medical devices. However, no recommendations or structure
    for implementation were included.


    ### Malware

    Malware of one type or another, is the single largest threat to the average organization’s
    daily operations, offering the potential to directly impact the availability of
    critical data and assets. As such, if they hope to combat this threat effectively,
    organizations both big and small need to increase their vigilance while at the
    same time evaluating their capabilities when it comes to response, detection,
    preparation and planning for potential threats. As new types of destructive malware
    are certain to evolve over time, it is critical to not just understand how your
    organization is going to prepare for known threats, but how it will prepare for
    the unknown as well.


    ### Distribution vectors

    Potentially destructive malware frequently has the ability to target large-scale
    systems that can then potentially execute simultaneously at multiple points throughout
    a given network. As such, it is crucial that organizations regularly asses their
    operating environments for atypical channels that could indicate potential malware
    propagation or delivery. Systems worth keeping an eye on include the following:


    - Enterprise applications, especially those that have the potential to interface
    directly with multiple hosts and endpoints. Common examples include patch management
    systems, asset management systems, remote assistance software, antivirus software,
    centralized backup servers, file shares, and network administrative systems.

    - While not limited to just malware, the following threat actors could compromise
    resources that would ultimately impact the availability of critical applications.
    Potential threats of this type including centralized storage devices, high risk
    partitions or data stores, network devices, routing tables and crucial network
    resources.

