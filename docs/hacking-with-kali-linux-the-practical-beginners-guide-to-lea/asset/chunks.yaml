    \n# Answers\n\n### 1. Free-to-use software \nMuch like the predecessor, `BackTrack`,\
    \ `Kali Linux` is available for use free of charge, and according to the developers,\
    \ they intend to keep it that way, making this tool available for download and\
    \ use without need for any paywall, with all users receiving full functionality\
    \ of the `Kali Linux` distribution.\n\n### 2. Open Source delevop tree\n`Kali\
    \ Linux` is freeware, and much like other freeware and many Linux distributions,\
    \ it is also open source. The developers of `Kali Linux` are committed to using\
    \ the open source development model, allowing their development tree to be made\
    \ public. In addition, all the source code used in `Kali Linux` is also consistently\
    \ made available by the developers, for any user that wants to tweak or modify\
    \ `Kali Linux` for a specific need.\n\n### 3. File System Hierarchy (FHS)\nThe\
    \ `Kali Linux` software is adherent to the `FHS`, or the “Filesystem Hierarchy\
    \ Standard”, making it much easier for Linux users to navigate and locate specific\
    \ files such as binary codes, support files, software libraries, and the like.\
    \ The use of this standard allows for convenience and ease of use, one advantage\
    \ that `Kali Linux` has over a lot of other similar software.\n\n### 4. Wide device\
    \ support\nThe developers of `Kali Linux` have tried their best to make `Kali\
    \ Linux` as user – friendly and versatile as possible, making it compatible with\
    \ a large range of platforms. `Kali Linux` is supported by multiple operating\
    \ systems, and one of the biggest things is that `Kali Linux` itself supports\
    \ the use of wireless devices. Not only is `Kali Linux` compatible with multiple\
    \ software setups, but also a large range of hardware setups, and the developers\
    \ are trying their best to include as many hardware configurations as possible.\
    \ This is quite notable, especially due to the wireless device support, as one\
    \ of the regular criticisms against most Linux distributions is that they tend\
    \ to lack support for wireless hardware, which `Kali Linux` provides.\n\n### 5.\
    \ Custom Kernel\n`Kali Linux`’s development team are, first and foremost, penetration\
    \ testers, meaning that they are often required to do assessments wirelessly,\
    \ and as such, the kernel of `Kali Linux` has injection patches constantly included,\
    \ keeping it up to date.\n\n### 6. Secure Development Environment\nThe `Kali Linux`\
    \ team is made up of “white hat” hackers and penetration testers, and as such,\
    \ they are acutely aware of the need of security, especially when it comes to\
    \ software that “white hats” often use, as a vulnerability or bug in the software\
    \ itself can have disastrous and wide – ranging results. As such, the development\
    \ team is restricted, and they are the only ones who commit packages and interact\
    \ with `Kali Linux`’s repositories, all of this being done under multiple secure\
    \ protocols to ensure fidelity and security. In addition, `Kali Linux`’s packages\
    \ and repositories are `GPG` signed, with all packages contained by `Kali Linux`\
    \ signed by the individual developer responsible for building and committing it,\
    \ and each repository also signs the package, allowing for a secure set of software\
    \ packages and repositories.\n\n### 7. Multi-lingual support\nThough much of coding\
    \ and a lot of penetration tools are built on the English language, `Kali Linux`\
    \ attempts to include multi – lingual support, allowing non – native English speakers\
    \ to operate in their native language, making it easier for them to make use of\
    \ `Kali Linux` and its features, enabling them to be more effective in carrying\
    \ out their tasks.\n\n# Conclusion\nWe have come to the end of this book. `Kali\
    \ Linux` is a very powerful Linux distribution, especially for penetration testing.\
    \ The OS comes with a number of tools which can help you do penetration testing\
    \ on systems and applications. This makes `Kali Linux` the best operating system\
    \ to use for penetration testing. Before deploying your system in a working or\
    \ production environment, it is good for you to first test it via penetration\
    \ testing so that you can be sure it has no loopholes. With penetration testing,\
    \ you can identify the loopholes in your system and seal them before using it\
    \ for production. This will help you prevent disasters which might have occurred\
    \ as a result of exploitation by hackers.\n"
