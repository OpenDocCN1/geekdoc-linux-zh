- fmt: "\nIt is said that the color blue represents a member of law enforcement, although\
    \ this is just a convention. These hackers are freelancers who sell their hacking\
    \ skills as a service. Computer security firms hire hacking experts to test their\
    \ networks so that they can be checked for weaknesses, vulnerabilities and loopholes\
    \ before they are released to the public. Blue hat hackers are “good guys” and\
    \ are different from grey hat hackers, whose intentions may be unpredictable.\n\
    \n# CHAPTER 2: THE PROCESS OF HACKING\n\n## A. HOW THE PROCESS OF HACKING WORKS\
    \ AND HOW ATTACKERS COVER THEIR TRACES\n\nA computer, as a standalone piece of\
    \ hardware, is not an intelligent machine. It is the programs written for the\
    \ computer that determine what it can and cannot do. This chapter will teach you\
    \ some of the basic principles of programming, as well as how to choose a programming\
    \ language. At the end of the chapter, you will find an exercise that will help\
    \ you write a program in `Python` computer language.\n\n### Why You Need to Learn\
    \ a Programming Language to Hack\nComputers operate using a series of switches.\
    \ These electronic switches are turned on/off in different combinations. This\
    \ creates the functions of a computer. For a computer to turn a switch on or off,\
    \ a computer program sends a message using binary code. Binary code is a series\
    \ of `0`s and `1`s, with the `0`s meaning on and the `1`s meaning off. \n\nThe\
    \ problem with binary code is that it is incredibly complex. It would take even\
    \ advanced programmers a long time to interpret the code, let alone alter it to\
    \ do what they want. This is where a programming language comes in.\n\nA programming\
    \ compiler translates pre-determined commands from the programming language into\
    \ binary code that can be read by the computer.\n\n### A Few Considerations (and\
    \ Key Terms) Concerning Programming Languages\nTo choose the best program to learn,\
    \ you should consider what you want to do with your hacking/computer knowledge.\
    \ Here are some common terms you may come across as you learn about the different\
    \ programming languages:\n\n#### Language Generation\nGenerally speaking, as technology\
    \ has advanced, so have computer languages. Currently, there are five generations\
    \ of computer language:\n- First generation (`1GL`) were the most primitive. They\
    \ were difficult to write, since it was written in binary code (`0`s and `1`s).\n\
    - Second generation (`2GL`) are often referred to as assembly languages. It was\
    \ the first step that allowed programmers to use symbolic names for commands,\
    \ rather than just binary code.\n- Third generation (`3GL`) was another advancement,\
    \ with higher level languages like `Javascript`, `Java`, `C`, and `C++` being\
    \ developed. `3GL` allowed commands and words to be used in programming.\n- Fourth\
    \ generation (`4GL`) is a type of coding similar to human language. This programming\
    \ is common for database access, with some of the most common being `ColdFusion`\
    \ and `SQL`.\n- Fifth generation (`5GL`) is the most advanced language by far,\
    \ with its applications for neural networks. Neural networks imitate the inner\
    \ workings of the human mind and are applied in the area of artificial intelligence.\n\
    \n## B. RECONNAISSANCE IN ACTION\nOne of the most important things that Hackers\
    \ do when they decide to attack a system (server, network, etc.) is to gather\
    \ as much data as possible about it.\n\nThink in the following way: when you want\
    \ to go for a holiday in a place /country where you have not been, what are you\
    \ doing? Most likely, you do homework. You mean you're interested in that location.\
    \ You are looking for different things on `Google` (what you can do there, such\
    \ as weather /food, reviews of places in the area, etc.). In other words, you\
    \ inform yourself about your target. \n\nExactly through this process a hacker\
    \ passes when he decides to attack a system. There are different ways you can\
    \ learn more about a site /server, one of the simplest methods is to search `Google`\
    \ for information about it.\n\nWith a simple command like `nslookup` (or `dig`),\
    \ you can find out with the IP address of a site, and with the `whois` command\
    \ you can find out more about that domain.\n\n```\nnslookup google.com\nwhois\
    \ google.com\n```\n\nThe term `Reconnaissance` (or `Information Gathering`) comes\
    \ from the idea of researching, informing you about a particular topic before\
    \ moving on to action. In short, basically it means documenting before the action.\
    \ As a matter of time this process is most \"expensive\". Why? Because an attacker\
    \ needs to be very well informed, he needs to know things in detail because otherwise\
    \ (as we said in step # 5) risk his own freedom.\n\n## C. SCANNING THE SYSTEM\n\
    The next step in the \"Hacking Process\" is scanning. Once a Hacker has more information\
    \ about his target, he will begin to learn more (technically this time). And how\
    \ will he do that? Using a variety of tools (such as `Nmap`) to scan networks,\
    \ servers, and provide clearer information about network topology, used equipment,\
    \ operating system, and more.\n\nWhy are they important? Why is it important for\
    \ a Hacker to know if a particular web server is running on `Windows` or `Linux`?\
    \ Because once it has this information it can go further (step 3) with a little\
    \ research on `Google` to discover some existing vulnerabilities and try to take\
    \ advantage of them in order to gain access to that system (or to extract certain\
    \ data).\n\n## D. GAINING ACCESS TO THE SYSTEM\nHaving done the themes (done research,\
    \ scanned networks /servers, learned information from different sources - `Google`,\
    \ `Facebook`, `Forums` - about the target), the hacker can start the attack. The\
    \ attack should be very well thought to be in stealth mode (without triggering\
    \ alarms and - if possible - without generating too many logs).\n\nThere are a\
    \ lot of tools (`Burp Suite`, `SQLmap`, `Metasploit`, etc.) that can be used to\
    \ generate a cyber attack, everything depends on technology and objective.\n\n\
    Getting access can be done in several ways and from several points of view:\n\
    - Getting root access on a `Linux` server\n- Obtain access to a site's administration\
    \ panel\n- Obtaining access to a particular network equipment (`Router`, `Firewall`,\
    \ `Switch` etc.)\n- Get access to a network’s end device (smart phone, tablet,\
    \ laptop, etc.)\n\nOnce the hacker has access to one of the items listed earlier,\
    \ he is infiltrated into the network and can get a lot of information about the\
    \ organization he is (digital).\n\n## E. MAINTAINING ACCESS\nOnce in the network,\
    \ Hacker has the option of retaining access. In many situations when different\
    \ servers of major companies (`Yahoo`, `Google`, `Microsoft`, etc.) have been\
    \ broken, Hackers have always left open doors to get back into the system.\n\n\
    These wickets are called \"backdoor\" and are intentionally left by Hackers (or\
    \ even by the software developers of any applications that you and I use day by\
    \ day) to have access later in the system. So they can constantly extract data,\
    \ track what's happening in organizations, hold back control, and then do something\
    \ with these data (usually they are sold on the black market on the `Deep Web`).\n\
    \n## F. COVERING TRACKS\nThis is a very important process (the \"Trace Coverage\"\
    \ feature). A process that many Hackers (especially those who are at the beginning\
    \ of the road) omit it. They are simply not mindful (or aware) of covering their\
    \ tracks and getting caught (in the US, by the `FBI`, `CIA` or the `NSA`) and\
    \ punished in court for their deeds.\n\nI repeat that unauthorized access to a\
    \ system can lead to serious criminal consequences:\n- confiscation of computer\
    \ goods - laptops, external hard drives, etc.\n- placing under supervision\n\n\
    ## G. REPORTING\nAnother very important step, especially in the Ethical Hacking\
    \ process, is # 6, Reporting, the step in which Hacker generates a report on the\
    \ vulnerabilities found (and exploited), the ways in which they can be corrected,\
    \ and other information that will lead to solve and secure the system.\n\n## H.\
    \ WEB HACKING USING THE BURP SUITE\nThe most powerful tool that currently exists\
    \ online is “Suite.” `Suite` is an app that provides web services and penetration\
    \ testing. When it is fully maximized, the possibility of its usage is almost\
    \ limitless. Below are some of the features of the `Burp Suite`.\n\n- `Intercepting\
    \ Proxy` is a feature that monitors and improves communication between an application\
    \ and the web browser.\n- `Spider` is a feature that specifies all lists, names\
    \ and characteristics of files that exist on a network.\n- `Web Scanner` is an\
    \ important feature that scans for loopholes in the server.\n- `Intruder` is a\
    \ feature that can be used to launch attacks against networks. It is used to scan\
    \ for flaws and take advantage of them.\n- `Repeater` improves and makes solicitations\
    \ on behalf of the user.\n- `Sequencer` examines the irregularity of the token’s\
    \ `CSRF`, authenticity token, etc.\n- `Extensions` allow the user to include his\
    \ or her own customized plugin or to install plugins directly from the systems\
    \ database. They are used to creatively stage a tactical and cryptic attack.\n\
    \n## I. WORDPRESS SECURITY & HACKING\nBy now, you should have some insight into\
    \ what hacking is all about. Now we will outline the fundamental security guidelines\
    \ that will protect you, your system and your information from external threats.\
    \ All of the information we will provide is based on practical methodologies that\
    \ have been used successfully. These methodologies will help prevent a computer\
    \ system from being attacked and ravaged by malicious users.\n\n### Update Your\
    \ OS (Operating System)\nOperating systems are open to different types of attacks.\
    \ On a daily basis, new viruses are released; this alone should make you cautious\
    \ because your operating system might be vulnerable. This is why vendors of these\
    \ operating systems release updates on a regular basis, so that they can stay\
    \ ahead of new threats. The best way to protect yourself from new threats is update\
    \ your operating system on weekly or monthly basis.\n\n### Update Your Software\n\
    In the previous section, we talked about the importance of update. Updated software\
    \ is equipped with more efficiency and convenience, and even has better-in security\
    \ features. Thus it is imperative that you frequently update your applications\
    \ and browsers.\n\n### Antivirus\nBased on our research, we have seen that some\
    \ operating systems are open to a lot of attacks, especially `Windows` platforms.\
    \ One way to protect your system from viruses is through `antivirus` program.\
    \ An `antivirus` program can save you in many ways. There are many `antivirus`\
    \ programs (free or paid) that you can install on your system to protect against\
    \ threats. A malicious hacker can plant a virus on your system through the internet,\
    \ but with a good `antivirus` scan, you can see the threat and eliminate it.\n\
    \n### Anti-Spyware\nThis program is also important, as you don’t want trojan programs\
    \ on your system. You can get many `anti-spyware` programs on the internet; just\
    \ make sure you go for one that has received good ratings.\n\n### For Macintosh\n\
    The `Macintosh` operating system is very popular and therefore many hackers target\
    \ it. However, `Macintosh` is immune to many threats. Thus, we urge you to try\
    \ `Macintosh` if necessary. You may have read articles and blogs saying that `Macintosh`\
    \ operating systems are less secure; however, `Macintosh` is a secure platform.\n\
    \n### Avoid Shady Sites\nWhen you are browsing `Facebook`, you may come across\
    \ unknown people who send you messages with links, some in the form of clickbait.\
    \ Also, you must avoid sites sites that promise you things that are too good to\
    \ be true. Some of these sites promise you free music when you click a link, while\
    \ others are run by malicious hackers who are looking for ways to harm your computer\
    \ with malware. Take note that on some malicious sites you don’t even have to\
    \ click on anything to be hacked. A good browser will always inform you of a bad\
    \ site before it takes you there.\n\n### Firewall\nIf you are a computer specialist\
    \ working in an organization, you might come across cases where more than one\
    \ computer system’s OS is under network. In situations like these, you must install\
    \ software that provides security `firewall`. This feature comes in different\
    \ versions, including `Windows XP`, `Windows Professional`, `Windows10`.\n\n###\
    \ Spam\nYou can be hacked from spamming too. Email providers have taken the initiative\
    \ to classify emails according to a set of parameters. Some emails will be sent\
    \ directly into the inbox and some will be sent to spam folder. To be safe, avoid\
    \ opening emails that look suspicious. Some of them will have attachments that\
    \ you should not open.\n\n### Back-Up Options\nWhether you are running your own\
    \ business or working for an organization as an ethical hacker, it is crucial\
    \ that you back up your work. Some files will contain confidential information\
    \ such as personal files and work-related documents that you cannot afford to\
    \ lose. You should register with `Google Drive`, `OneDrive` and other cloud drive\
    \ so that you can upload your files. You can also purchase an external hard disk\
    \ and transfer all important files to it. Take all these security measures because\
    \ a single malicious software can scramble your data regardless of the antivirus\
    \ you have installed. Always have a backup.\n\n### Password\nThis is the most\
    \ important aspect of security. The importance of a strong password can never\
    \ be overstated. Starting from your email or even a secure server, a good password\
    \ is the first and last line of defense against threats. There are two categories\
    \ of passwords: weak and strong. A weak password is made by using your phone number,\
    \ your name, a family member’s name or something that can be easily guessed. Avoid\
    \ using this kind of password. People using dates such as their birthday or special\
    \ anniversary is still not safe. When creating a password, take time and do some\
    \ basic math because password must contain both letters and numbers. For instance,\
    \ if your initial password is `jack`, you can make it `Jack@007`. A password like\
    \ this will be almost impossible to guess though it is simple. Furthermore, avoid\
    \ writing down your passwords; password isn’t a file that must be personal to\
    \ you. Make sure you use a strong password. However, keep in mind that a strong\
    \ password doesn’t make you completely safe.\n\n## J. HOW TO DO GOOGLE HACKING\n\
    A few years ago, there was a standard way of transferring virtual machines for\
    \ software applications. One major reason for undertaking this process was to\
    \ ensure flexible prices for the container in comparison to virtual machines.\
    \ After many years of partnership with `Borg` and container management, Google\
    \ successfully implemented know-how for running apps on massive platforms. By\
    \ getting involved in `cgroups`, Google successfully enriched the community. Due\
    \ to the fact that they are disclosed to a single point of failure, different\
    \ containers cannot operate on a single host. Failure of a host will also affect\
    \ the containers. To circumvent this, a container cluster is used. Google took\
    \ that initiative and utilized a cluster called `Kubernetes`, which had open source.\
    \ `Docker`, on the other hand, invented a container solution which is yet fully\
    \ accepted on the ground. Another remarkable software or program is `Microservices`,\
    \ which makes use of containers. A `microservice` is the simple usage of a web\
    \ function that can be initiated more quickly than a standard web function. Thinking\
    \ deeply about the discussed factors, we can foretell that in some years’ time,\
    \ VMs will be routed out and completely replaced by containers. Some years back,\
    \ experts worked together to carry out a container solution on the `POC` stage.\
    \ \n\n# CHAPTER 3: CYBERSECURITY\n\n## A. WHAT IS CYBERSECURITY\nCybersecurity\
    \ is the implementation of measures to protect systems, networks, and software\
    \ applications from digital attacks. Such attacks are usually aimed at gaining\
    \ access to confidential information, changing and destroying it, extorting money\
    \ from users, or at disrupting the regular operation of companies. Implementing\
    \ effective cybersecurity measures is currently a rather complicated task since\
    \ today there are much more devices than people and attackers are becoming more\
    \ and inventive.\n\n## B. BASIS OF CYBERSECURITY\nWhat is the best way to secure\
    \ a house against burglary? A typical burglar would scope out the premises beforehand\
    \ to find the easiest point of access: a garage door that won’t shut the way or\
    \ a second story open window, but a brash one might just walk to the front door\
