    # INTRODUCTION


    The comprehensive offensive and defensive security suite included in BackTrack
    Linux made it the tool of choice for hobbyists, security professionals, legitimate
    penetration testers, and black hat hackers alike. The developer of BackTrack,
    Offensive Security, eventually rewrote the distribution, renaming the project
    as Kali Linux. Kali installation packages and virtual machine images are available
    free of charge. Offensive Security also offers for-pay courses in security using
    Kali, as well as professional certifications and an online penetration testing
    environment.


    # KALI TOOLS


    The centerpiece of Kali Linux, and the primary reason for its popularity among
    hackers and security professionals, is its extensive and well-organized suite
    of free tools. Kali currently features over 300 tools including passive information
    gathering, vulnerability assessment, forensics, password cracking, network analysis,
    wireless hacking, and a powerful set of exploitation tools. Although all of the
    tools included with Kali are free and open source and can be downloaded and built
    onto most (Debian-based) Linux derivatives - having a tested, vetted OS that comes
    native with such a large array of tools is an invaluable resource.


    Among the most useful tools that come with Kali are:


    - Metasploit Framework – Metasploit is a popular vulnerability exploitation platform
    containing various analysis and penetration tools. It features multiple options
    for user interface and provides the user with the ability to attack nearly any
    operating system. Kali also contains `Armitage`, a graphical management platform
    that helps the user organize.

    - Wireshark – Wireshark is a real-time traffic analyzer.

    - John the Ripper – John the Ripper is a legendary password cracker, originally
    written for Unix.

    - Nmap – Nmap, short for network map, is a common tool for scanning hosts.

    - Aircrack-ng – Aircrack-ng is a software suite of tools to wireless networks
    on WEP and WPA/WPA2.

    - BurpSuite – BurpSuite is a collection of tools that focus on web applications.


    # CHAPTER 1) HACKERS


    In the most elemental definition, hacking can be described as the act of exploiting
    the weaknesses and shortfalls in a computer system, as well as the network. In
    the exploitation of these weaknesses, illegal acts might include stealing private
    information, accessing a network’s configuration and sabotaging the structural
    view of the operating system.


    Hacking is practiced in almost all countries. However, it predominates in developed
    countries. The advancement of information and technology within the last two decades
    has shown that most hackers are based in developing countries such as South Asia
    and Southeast Asia.


    The term “hacker” is the source of a lot of controversy today and is confusing
    to many people. Some regard a “hacker” as someone who has the power to make a
    computer do anything at will. In another context, a hacker is viewed as a computer
    security specialist whose primary job is to find the loopholes in a computer system
    or network and fix them. These loophole finders are sometimes referred as crackers.


    A plethora of reasons are behind hacking. Some people are into hacking simply
    to make money. They can steal your password, break into your private information
    or even alter your correct information and make it incorrect all for monetary
    gain. Other hackers are in the game just for a challenge or competition. Furthermore,
    some hackers are the computer world’s equivalent of social miscreants, whose purpose
    is to gain access to a network or system. After gaining access, these hackers
    will render the network useless so that the users cannot use it properly. For
    example, if a community is protesting against something, it can try to hack into
    a system as a sign of protest against the authorities. It can choose to do this
    instead of breaking other laws that it considers to be important.


    There are different types of hackers who have various intentions. Based on their
    modus operandi, we can classify hackers into the following:

