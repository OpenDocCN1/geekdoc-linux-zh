    \ and services are more challenging to access by legitimate users as black hat\
    \ hackers. This can involve restricting access of users who have no legitimate\
    \ day to requirement to accessing the devices. Furthermore, security managers\
    \ should be closely monitoring the domains and those who are accessing services\
    \ such local administrators. Using physical security controls will allow managers\
    \ to detect attacks that are occurring in real time and can deny access while\
    \ also alerting the proper authorities to ensure the intruder is exposed.\n\n\
    Another approach which can be taken to ensure that access is denied is to encrypt\
    \ highly sensitive and confidential information using protection keys. This would\
    \ mean that any attacker attempting to access the system regardless of how well\
    \ the system is protected, will gain access only to find that the information\
    \ is scrambled and with the keys protected, the attacker would have no reliable\
    \ method for using the data that has been encrypted. Encryption is a good final\
    \ line of defence for particularly valuable data however it cannot be relied upon\
    \ entirely in itself. Even if the attacker was to access the system and discover\
    \ that the data is encrypted, they can still wreak havoc on the network and even\
    \ disable it, causing significant damage as a means of sabotage. Even more alarming,\
    \ the attacker could have control over the system and use it for further crimes\
    \ which could be traced back to the organization's network. Once the attack has\
    \ gained access to the system, they are still far from being in the clear. Access\
    \ is for a limited time, the longer the hacker is operating from the system, the\
    \ greater the chances of being caught. The hacker must then shift to the next\
    \ phase, maintaining access to ensure they are able to collect as much data as\
    \ possible.\n\n## QUIZ\n\n1. What is Keylogger?\n2. What is Denial of Service\
    \ (DDoS)?\n3. What is Vulnerability Scanner?\n4. What is Brute Force Attack?\n\
    5. What is Waterhole Attacks?\n6. What is False WAP?\n7. What is Phishing?\n8.\
    \ What is Clickjacking Attacks?\n9. What is Bait and Switch?\n10. What is Social\
    \ Engineering?\n11. What is Rootkit?\n12. What is Packet Analyser?\n13. What is\
    \ Name-dropping?\n\nANSWERS\n\n1. A keylogger is a simple software that is designed\
    \ to record each keystroke made by the user. These keystrokes are then stored\
    \ on a file that is accessed by the hacker to get information such as email ID,\
    \ passwords, credit card numbers.\n2. Denial of Service (DDoS) is one of the most\
    \ common attacks, as earlier discussed. It involves flooding the site with traffic\
    \ to make it unusable.\n3. A vulnerability scanner is a tool that scans a website\
    \ daily for flaws, malware and viruses.\n4. Brute force attack is a method that\
    \ tries to gain access by trying all possible combinations.\n5. Waterhole attacks\
    \ are known by this name because they target locations that a specific group of\
    \ people likely to visit.\n6. False WAP is a fake access point.\n7. Phishing is\
    \ a technique where a hacker creates a link that you would normally associate\
    \ with a site to steal your details.\n8. Clickjacking attacks occur when a user\
    \ is tricked into clicking something different from what they intended to see.\n\
    9. Bait and switch involves the hacker supplying you with a program that appears\
    \ to be authentic but is actually a virus.\n10. Social engineering is a technique\
    \ used to manipulate people into giving up information.\n11. Rootkit is a type\
    \ of malware that provides hidden access to a computer.\n12. Packet analyser is\
    \ a tool used to monitor data flowing through a network.\n13. Name-dropping is\
    \ not clearly defined in the text but likely refers to techniques related to domain\
    \ names.\n"
  raw: 'Treat your property as valuable: With smart devices so ubiquitous, it can
    be easy to be flippant about them when you are out and about, especially if you
    are busy or otherwise in a hurry. Regardless of the personal cost of the device
    in question, it is important to not just think about the physical value if the
    device was lost but the value of the time wasted in changing literally every password
    and credit/debit card you own. Furthermore, think about the potential value of
    keeping your identity secure and act accordingly.Likewise, you should make a habit
    of keeping an eye on your surroundings when using your device, which will likely
    be easier said than done. Nevertheless, you should try and pay attention to those
    around you, including anyone who may be trying to look over your shoulder for
    a peek at your sweet, sweet data. Generally speaking, if you don’t need your device
    at the moment, it is best to keep it hidden away from prying eyes, just to be
    safe. If you are using a company laptop, you may even want to consider a third-party
    alarm that can be set to ensure that anyone who tries to access the computer without
    your permission is in for a rude awakening.Regardless of how important your information
    is, it is important to have at least one backup of all your data stored in a secure
    location or, more likely, the cloud. This way you will be able to ensure you are
    able to get back to where you were as quickly as possible, you will also know
    exactly what information is now at risk, allowing you to take additional precautions
    as needed. What to do if your device is stolen: The first thing you are going
    to want to do is report the theft to the proper authorities as they may have procedures
    in place that you might not be aware of for this sort of thing. It is also important
    to cancel any mobile data service that is on the device as quickly as possible
    to delay the culprit as much as possible and give yourself time to change all
    of the relevant passwords in the interim. Ensure your data is secureAdd additional
    layers of protection: While there are naturally going to be innate security options
    for portable devices, their very nature means they are more likely to be targeted
    than anything else you own which means it is important to take as many security
    precautions as are warranted for the type of data you are typically transporting.
    It is also important to keep in mind that if your device is going to be connecting
    to an unsecured network connection then it is vulnerable to network attacks as
    well and plan accordingly. Store important data separately: There are a wide variety
    of extremely secure external storage options available these days which means
    there are plenty of ways to keep your sensitive data safe from prying eyes, and
    completely separate from the devices that are most likely to be targeted for theft.
    Despite the prevalence of storage space, this option is used far less frequently
    than it should be which means you will have the advantage of being unexpected
    on your side as well. You can even keep the data in a pocket on your person at
