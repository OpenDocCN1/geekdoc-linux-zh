    \ One of the more common attacks, as earlier discussed, is SQL injection in order\
    \ to gain access to a website or a database. Though the reader should know this\
    \ by now, just for review: `SQL` is a structured query language that allows the\
    \ computer to manage data, order to store, manipulate, and retrieve data from\
    \ server. The database is the repository of all the data often containing passwords\
    \ and other information. So what is SQL injection? SQL injection is a way of injecting\
