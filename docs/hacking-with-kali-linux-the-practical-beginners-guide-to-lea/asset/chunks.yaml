    allows the information to be sent through to the hacker and allow them to use
    it at a later time at their leisure. Be sure that when you are using public Wi-Fi,
    you have appropriate anti spyware and antivirus software to alert you when there
    may be suspicious activity while online.6\. Similarly, to the waterhole attack,
    the hacker can create, using software, a fake wireless access point. The WAP is
    connected to the official public wireless access point however once the victim
    connects they are exposed and vulnerable in that their data can be accessed at
    any point and stolen. When in public spaces, ensure that the WAP you are using
    is the correct one, they will generally have a password prior to access or a portal
    which will require you to enter a username, email address and password which is
    obtained from the administer. If you find the access point is completely open,
    this could be a cause for alarm knowing that this point is likely bait.7\. Another
    common technique used by hackers to obtain secure information from an unsuspecting
    victim is through phishing. Phishing involves a hacker creating a link that you
    would normally associate with a site that you commonly access such as a banking
    site or payment portal. However, when you input your details, they are sent to
    the hacker rather than the institution that you you believe you are sending them
    to. Phishing is often times done through sending false emails that appear as though
    they are from your bank or billing institution and generally request that you
    access your account to either update your details or make a payment.8\. If you
    have ever attempted to stream a video on a less reputable site, you may have noticed
    that the interface can be quite confusing to navigate due to false play buttons
    or common sections after which you click on them and are then redirected somewhere
    else. These are known as Clickjacking attacks as well as UI Redress. While redirecting
    to the ad or another page may seem harmless, when done correctly these attacks
    can be quite sinister and potentially dangerous as they are able to capture your
    information. You need to exercise extra caution when using unfamiliar websites
    as they may not be as safe as they appear, with their interface taking you to
    a place right where the hacker wants you. Always be aware of the URL of each click
    you make and if it differs drastically from the website that you were just on,
    ensure that where you are taken does not involve any downloads or exchanging of
    details for your own protection. 9\. The bait and switch technique involves the
    hacker supplying you with a program that appears to be authentic but when it faces
    it is a virus or a tool used by the hacker to access your computer. These can
    generally be found in unscrupulous websites that offer pirated programs, software,
    movies or games that are in high demand. Once you download the program, you will
    find that the file is not what you had intended and instead had loaded a virus
    to your computer to provide the hacker with access. 10\. We mentioned earlier,
    the social engineering techniques used by white hat hackers. This technique is
    often overlooked as a means of hacking however it can be quite effective. An example
    of social engineering is conning a system administrator into supplying details
    by posing as a user or an individual with legitimate access. These hackers are
    often thought of as con men rather than what we understand to be hackers, however
    it is a means of hacking nonetheless. Many of these hackers have a good understanding
    of the security practices of the organization in which they are attacking.11\.
    A rootkit finds its way onto your operating system through legitimate processes,
    using low-level and hard to detect program. The rootkit can assume control of
    the operating system from the user and since the program itself is hidden within
    the system binaries as replacement pieces of code, it can be incredibly difficult
    and virtually impossible for the user to detect and remove the program manually.12\.
    When transmitting data across the internet or any other network, an application
    known as a packet analyser or packet sniffer can be used by a hacker to capture
    data packets which may contain critical information such as passwords and other
    records.13\. Having the name of an authorised user provides the hacker with the
    advantage that they can pretend to be a specific person who should rightly have
    access to the information. This can be done by sourcing through web pages of companies
    which can be easily found online. Another example of this is the searching through
