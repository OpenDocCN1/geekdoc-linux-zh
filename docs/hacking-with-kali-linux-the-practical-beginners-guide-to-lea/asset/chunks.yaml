    also begin with the function main.H. ADVANTAGES OF CYBERSECURITYWhen it comes
    to the importance of ensuring the cybersecurity of your portable devices, only
    you can accurately determine what’s at risk besides the machine itself. However,
    with most portable devices these days, if the thief is able to access the information
    that is stored within it successfully, a lot more than the data directly on the
    device itself is at risk. You have likely heard stories about the uproar caused
    when a senior manager for one major corporation or another leaves a laptop or
    a smartphone somewhere they shouldn’t. Confidential information of this type can
    cause untold damage to a company, especially if it has something to hide. Even
    if your devices don’t have serious secrets hidden within, there is still enough
    on the average smart device to make your life very difficult if the wrong person
    gained access to it. Keep the following in mind when it comes to keeping your
    data private on the go.Password protect everything: It doesn’t matter if it takes
    you an extra 30 seconds to access your device, this one simple step is responsible
    for decreasing the likelihood that your device is accessed by the wrong person
    by more than 100 percent. It’s easy, readily available and an option when you
    set the device up for the first time, there is no reason not to take full advantage
    of it.'
