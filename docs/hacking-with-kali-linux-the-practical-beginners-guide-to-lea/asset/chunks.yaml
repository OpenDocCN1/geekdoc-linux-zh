    analysis tool. All traffic on a chosen network node is captured and broken down
    into useful packet metadata, including header, routing information, and payload.
    Wireshark can be used to detect and analyze network security events and to troubleshoot
    network failures.John the Ripper – John the Ripper is a legendary password cracking
    tool containing multiple password attack algorithms. Although originally written
    exclusively for Unix, John the Ripper is now available on several OS platforms.
    One of its most useful features is its ability to automatically detect the password
    encryption “hash ” type. The free version of John the Ripper available on Kali
    supports the cracking of many password hash algorithms, but not as many as its
    commercial counterpart.Nmap – Nmap, short for network map or network mapper, is
    a common hacking tool that is essential for penetration testing. Nmap allows the
    user to scan a network for all connected hosts and network services, providing
    a detailed view of the network’s structure and members. Additionally, Nmap provides
    a list of each host’s installed operating system as well as its open ports. This
    allows the user to zero in on known vulnerabilities during exploitation.Aircrack-ng
    - Aircrack-ng is the quintessential software package for wireless analysis and
    penetration testing, focusing on Wired Equivalent Privacy (WEP ), Wi-Fi Protected
    Access (WPA ) and WPA2-PSK Wi-Fi encryption protocols. This tool features wireless
    packet sniffing, packet injection, wireless network analysis, and encrypted password
    cracking tools.  Aircrack-ng requires network interface hardware that supports
    monitor mode functionality. Kali also features a more graphically-based wireless
    hacking tool known as Fern .BurpSuite – BurpSuite is a collection of tools that
    focus on the exploitation of web applications. These programs interact to not
    only test applications for vulnerabilities, but also to launch attacks.The list
