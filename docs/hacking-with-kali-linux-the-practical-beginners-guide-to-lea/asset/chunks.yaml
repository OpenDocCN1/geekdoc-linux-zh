    # 将你的财产视作珍宝


    在智能设备无处不在的今天，当你外出时，很容易对它们掉以轻心，尤其是当你忙碌或赶时间时。无论相关设备本身的个人成本如何，不仅要考虑设备丢失时的物理价值，还要考虑为了更改你所拥有的每一个密码和信用卡/借记卡而浪费的时间，这是非常重要的。此外，还要考虑保持身份安全的潜在价值，并采取相应的行动。


    同样，你应该养成在使用设备时留意周围环境的习惯，尽管这可能说起来易、做起来难。尽管如此，你应该尝试注意你周围的人，包括任何可能试图越过你的肩膀偷看你那些宝贵数据的人。通常情况下，如果你目前不需要使用设备，最好将其隐藏在他人窥探的目光之外，以防万一。如果你使用的是公司笔记本电脑，你可能还会考虑使用可以设置的第三方报警，确保任何未经你许可尝试访问计算机的人都会受到“不友的警醒”。


    无论你的信息有多重要，将你所有的数据至少备份一份并存储在安全位置（或更有可能是云端）都是至关重要的。这样一来，你就能确保能够尽可能快地回到原来的状态，你也会确切知道哪些信息现在面临风险，从而根据需要采取额外的措施。


    ## 如果设备被盗该怎么办


    你首先想做的应该是向适当部门报报被盗案，因为他们可能针对此类事件制定了你可能并不了解的程序。此外，尽快取消设备上的任何移动数据服务也很重要，以尽可能地延迟罪犯，并为你留出时间在期间更改所有相关密码。


    ## 确保你的数据安全


    ### 添加额外的保护层

    虽然便携式设备自然会有固有的安全选项，但其本质决定了它们比你拥有的任何其他东西更容易成为攻击目标，这意味着，根据你通常传输的数据类型，采取尽可能多的安全措施是有关重要的。同样重要的是要记住，如果你的设备将连接到不安全的网络连接，那么它也容易受到网络攻击，并据此制定计划。


    ### 分开存储重要数据

    现在有各种极其安全的外部存储选项可用，这意味着有许多方法可以保护你的敏感数据免受窥视，并将其与最有可能被盗窃的设备完全分离。尽管存储空间非常普及，但这种选项的使用频率远低于其应有的水平，这意味着你还将拥有出其不意的竞争优势。你甚至可以将数据一直随身放在口袋里，几乎可以确保你任何时候都知道它在哪里。


    ### 不要仅依赖密码

    如果你正在处理敏感文件，不要仅仅信任密码来防御它们。相反，要采取加密这些文件的额外步骤，确保即使设备最终落入他人之手，数据在很大程度上仍然是安全的。通过增加额外的加密层，你可以确保即使数据物理上落入他们手中，未经授权的人也不会查看数据。请记住，保留这些密码列表非常重要，并确保该列表无法从你的计算机直接访问，以避免让这一切变得毫无意义。


    ### 确保你的病毒防护软件是最新版本

    与更有可能保持开启状态并接收自动更新的个人电脑不同，便携式设备（尤其是公司提供的设备）往往被零散使用，这意味着确保所有内容定期更新将是你的责任。养成每月检查一次新安全更新的习惯，并确保设备上的病毒和间谍软件软件也是最新版本。


    ### 维护强力防火墙

    在保护个人电脑安全方面，防火墙是一个好主意，但对于你的便携设备来说，这更为重要，因为你的设备将连接到各种不同的网络，其中极少有网络是你能以任何程度确定其是安全的。如果你要在旅行期间使用设备，你希望确保防火墙设置始终处于最高设置，以防万一。


    ## I. 网络管理及许多欺骗地址的方法


    你可以利用你的黑客能力通过几种方法进入网络。


    ### Ping（封包）

    每个 Wi-Fi 都有一个分配给它的 IP 地址。即使是你用来入侵他人系统的计算机也会有一个 IP 地址。IP 地址是一系列对该路由器是唯一的数字。然而，单凭
    IP 地址本身无法告诉你太多信息。


    要转换地址，你将使用 `ping` 选项。`DNS` 也有助于获取域名称。`Ping` 代表“数据包互联网探测器”（packet internet groper），它存在于客户端使用的所有
    Windows 版本中。


    在你登录互联网后，你需要打开 DOS 命令行界面（shell），然后输入 `ping` 命令。这将查找域名并将其显示在你正在使用的计算机上。


    使用 `ping` 通常是你尝试尝试入侵网络时会采取的第一步。`ping` 会连接到你的目标并告诉你它是在线还是离线。多个 IP 地址将无法转换为域名。当你想要对
    `ping` 进行更多控制时，你将使用 `ping` 命令。


    ### Ping sweep（Ping 扫描）

    这涉及 `ping`，但不是用它进入系统，而是搜索你周围特定区域开放的 IP 地址。这种方法只有在你不确定想从哪里攻击时才有用，因此你将知道在哪里可以进入，而不必一定知道目标是谁或他们在哪里。


    ### Tracert（路由跟踪）

    该程序是另一个可以获取关于无论多远主机信息的工具。它使用 `ICMP`。`Tracert` 通过从源计算机向目标计算机发送数据包来定位数据，目标计算机在连接后会回传
    IP 地址，从而揭示你到互联网连接开始的所有站点。如果无法通过 `ping` 显示名称，那么该程序可以提供它，甚至可以提供攻击者访问的最后一个站点。


    ### 端口扫描

    当目标系统列在在线时，下一步要做是扫描系统以寻找任何可用于进入的开放端口。你可以选择的端口扫描器非常多，可以在网上找到。然而，这些扫描器的大部分使用的技术由于过时，增加了黑客被抓获的概率。`nmap`
    不仅会扫描系统上打开的所有端口，还会告诉你计算机上使用的操作系统和程序版本号。


    ### 常用端口

    有一些供黑客入侵的较常用端口，在这个列表中，你不仅会找到端口名称，还有通常运行的服务。


    | 端口 | 服务 |

    | :--- | :--- |

    | 445 | `SMB` - 除非必须使用 `TCP`，否则将使用 `NetBios` |

    | 20 | `FTP` - 主要用于文件传输 |

    | 443 | `SSL` - `sockets` 的安全层 |

    | 21 | `FTP` - 另一个用于文件传输的 |

    | 389 | `LDAP` |

    | 22 | `SSH` |

    | 220 | `IMAP` - 这将使用互联网消息访问协议 3 |

    | 23 | `Telnet` |

    | 194 | `IRC` - 用于计算机与互联网之间的聊天 |

    | 25 | `SMTP` - 邮件传输 |

    | 161 | `SNMP` - 网络管理 |

    | 53 | `DNS` - 域名 |

    | 143 | `IMP` - 互联网消息，但不是特定版本 |

    | 68 | `DHCP` - 配置的主机 |

    | 139 | `NetBIOS` |

    | 79 | `Finger` |

    | 137 | `NetBIOS-ns` |

    | 80 | `HTTP` |

    | 110 | `POP3` - 使用邮局协议版本 3 |


    ## 第 4 章) KALI LINUX


    ### A. 什么是 KALI LINUX

    要开始无线黑客攻击，必须首先熟悉行业工具。没有任何单一工具比 Kali Linux 对便携式设备更有价值，这意味着根据你通常传输的数据类型，采取尽可能多的安全措施是有关重要的。作为一个免费、稳定、维护良好且惊人的完整分析工具集，Kali
    Linux 在开源操作系统发行版中已成为黑客之王。`BackTrack` 的继任者包含了从初学者到专家所需的一切。


    ### B. 如何安装 KALI LINUX

    长期使用 Kali Linux 最方便的方法是将其安装在硬盘上。你可以将它与 Windows、MacOS 以及其他 Linux 发行版一起安装。要在硬盘上安装
    Kali Linux，需要以下几种工具：

    * USB/DVD 启动介质

    * 至少 20GB 的磁盘空间用于 Kali Linux 安装

    * 一个干净、未分区的物理硬盘


    一旦你获取了介质（如 USB 或 DVD），是时候创建启动介质了。如果你使用 USB 闪存，下载并安装 `BalenaEtcher` 并按照指示刻录镜像。一旦你创建了启动介质，你需要为
    Linux 创建一个分区。如果你使用 Windows，打开磁盘管理器，选择磁盘进行分区并点击缩小。设置分区的大小——必须是 10GB 以上——并点击缩小。一旦你分配了分区大小，使用创建的启动介质启动你的设备。一旦系统启动，Kali
    Linux 将向你显示以下启动菜单。选择安装方法。图形化安装程序对初学者更友好。选择并配置你的首选语言。下一步是选择你的地理位置。下一步是配置你的键盘设置。通过设置网络设置并连接到网络。之后，为
    root 用户创建密码并继续。设置账户和密码。在下一个屏幕上，即分区部分，选择你之前创建的磁盘空间。确认分区大小，然后将更改写入磁盘。点击“是”并继续。安装过程完成后，重启计算机并在
    `GRUB` 菜单中选择 Kali Linux。


    ### C. 安装虚拟机 VMWARE

    处理器速度的进步、多处理器的出现、内存的增加以及数据存储的增加使得虚拟化成为可行且实用的方法。在虚拟机中运行多个操作系统的优点是它消除了对昂贵硬件的需求。此外，可以在安全的“沙箱”环境中进行攻击。最常见的免费应用程序是
    `Virtualbox` 和 `VMware Player`（带有商业版本）。`QEMU` 是一个仅运行在 Linux 上的开源选项。


    ### D. 如何使用 KALI LINUX

    这种操作系统被称为发行版，设计用于渗透测试和安全审计。它是供单用户使用的，这限制了安全漏洞的风险。事实上，该系统对安全非常敏感，因为它是为在信息领域工作的人设计的。它可以被修改以适应各种用户和兼容性。


    ### E. 如何通过 KALI LINUX 开始

    根据用户的需求，他们可能希望构建自己的 ISO。使用可用工具根据 Kali Linux 构建自己的 ISO 是有益的，因为这些脚本允许用户自动化构建系统的过程。这确保了自定义构建是安全的。


    ### F. 在黑客之前需要了解的所有基本概念

    在黑客之前，了解 Kali Linux 的背景对读者是有有益的。丰富的网络安全和渗透测试工具库。然而，许多工具已变得多余或过时，不再满足预期目的，而添加了新工具。


    ### G. 安装虚拟机 VMWARE 和 KALI LINUX 细节

    为了让 Kali Linux 以“现场”模式运行，用户必须确保他们有启动镜像。如果用户在 Linux 或 OS 上，例如，在命令行执行 `uname -m`
    命令应该返回 `x86_64` 或 `i386`。如果情况下是 `x86_64`，则应使用 64 位格式；如果情况下是 `i386`，则应使用 32 位格式。


    ### H. BASH 脚本

    为你的网站提供足够的防黑客保护比以往任何时候都重要。网站所有者必须为访问者提供安全环境。充分保护网站可以防止被恶意软件感染，保护访问者的详情，提高你的网页排名并确保你长期经营。记住，一旦你的网站被黑，恢复它非常困难。当网站崩溃时，你会失去客户，声誉也会丢失。我们讨论了可以在服务器和客户端利用的各种漏洞。这些攻击中的某些很难检测，这就是为什么预防是最好的策略。如果你运行基于
    WordPress 或 Joomla 等内容管理系统的网站，务必安装该 CMS 提供的安全插件。Sitelock 是一个宝贵的工具，可以每天扫描网站的漏洞、恶意软件和病毒。投资良好的云保护服务也是一个好主意，它可以过滤到达网站的所有内容并筛选可疑流量和机器人。


    最流行且最执行的网站攻击之一是 SQL 注入。利用此漏洞可以让黑客获取私有信息。这种攻击发生在接受用户输入的表单字段的网站上。防止这种攻击的一种非常好方法是使用参数化查询。这确保网站包含了使无法插入恶意代码的参数。我们还讨论了跨站脚本攻击，简称
    XSS 攻击。我们现在知道跨脚本攻击是在客户端浏览器中执行的 JavaScript 代码的结果。与 SQL 注入攻击一样，防止 XSS 攻击需要程序员或开发者显式说明浏览器的各种用户输入字段允许哪些内容。实现此点的一种极方法是实施内容安全策略，简称
    CSP。这将为浏览不同的输入字段提供指示，包括哪些字段应该允许执行脚本，而哪些字段不应该。对于需要用户登录信息的网站，在用户注册时坚持使用强密码是非常重要的。用户应该创建一个字母、数字和特殊字符或符号混合的密码。当用户登录网站时，确保密码被加密也是重要的。这种措施使得黑客在执行中间人攻击时很难破解密码。还要记住，这还需要时间。


