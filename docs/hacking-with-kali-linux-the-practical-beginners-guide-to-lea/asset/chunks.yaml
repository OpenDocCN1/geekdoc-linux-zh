    # 问题


    ## 1. 什么是免费使用的软件？

    ## 2. 什么是开源 Git 树？

    ## 3. 什么是符合标准的层系统层级结构？

    ## 4. 什么是对广泛设备的支持？

    ## 5. 什么是自定义内核？

    ## 6. 什么是安全开发环境？

    ## 7. 什么是多语言支持？


    # 答案


    ### 1. 免费使用的软件

    与其前身 `BackTrack` 一样，`Kali Linux` 可免费使用。根据开发者的说法，他们打算保持这种状态，使该工具无需任何付费墙即可下载和使用，且所有用户都能获得
    `Kali Linux` 发行版的完整功能。


    ### 2. 开源开发树

    `Kali Linux` 属于免费软件，与其他许多免费软件和许多 Linux 发行版一样，它也是开源的。`Kali Linux` 的开发者致力于使用开源开发模型，允许他们的开发树公开。此外，`Kali
    Linux` 中使用的所有源代码都由开发者持续提供，以供任何根据特定需求微调或修改 `Kali Linux` 的用户。


    ### 3. 文件系统层级结构 (FHS)

    `Kali Linux` 软件遵循 `FHS`，即“文件系统层级标准”，这使得 Linux 用户能够更容易导航和定位特定文件，例如二进制代码、支持文件、软件库等。使用这一标准提供了便利性和易用性，这是
    `Kali Linux` 相比许多其他类似软件的优势之一。


    ### 4. 广泛的设备支持

    `Kali Linux` 的开发者尽力让 `Kali Linux` 尽可能对用户友好且功能丰富，使其兼容大量的平台。`Kali Linux` 受多个操作系统支持，其中最大的特点之一是
    `Kali Linux` 本身支持无线设备的使用。`Kali Linux` 不仅兼容多种软件设置，还兼容大量的硬件设置，开发者正尽力包含尽可能硬件配置。这一点非常值得注意，尤其是对无线设备的支持，因为对大多数
    Linux 发行版的常见批评之一就是它们往往缺乏对无线硬件的支持，而 `Kali Linux` 提供了这一点。


    ### 5. 自定义内核

    `Kali Linux` 的开发团队首先是渗透测试员，这意味着他们经常需要进行无线评估，因此 `Kali Linux` 的内核不断包含注入补丁，以保持更新。


    ### 6. 安全开发环境

    `Kali Linux` 团队由“白帽”黑客和渗透测试员组成，因此他们敏锐地意识到对安全的需求，特别是涉及到“白帽”经常使用的软件时，因为软件本身的漏洞或
    Bug 可能会导致灾难性和广泛的后果。因此，开发团队受到限制，他们是唯一提交包并与 `Kali Linux` 仓库交互的人，所有这些操作都在多重安全协议下进行，以确保保真和安全。此外，`Kali
    Linux` 的软件包和仓库经过了 `GPG` 签名，`Kali Linux` 包含的所有包都由负责构建和提交它的个人开发者进行签名，每个仓库也会对包进行签名，从而形成了一套安全的软件包和仓库。


    ### 7. 多语言支持

    尽管许多编码和许多渗透工具是基于英语构建的，但 `Kali Linux` 尝试包含多语言支持，允许非英语母语者使用其母语言进行操作，使他们能够更容易利用 `Kali
    Linux` 及其功能，使他们能够更有效地执行任务。


    # 结论

    我们已经读到了本书的末尾。`Kali Linux` 是一个非常强大的 Linux 发行版，特别是对于渗透测试而言。该操作系统自带许多工具，可以帮助你对系统和应用程序进行渗透测试。这使得
    `Kali Linux` 成为用于渗透测试的最佳操作系统。在将你的系统部署到工作或生产环境之前，先通过渗透测试对其进行测试是很好的，这样你就可以确保它没有漏洞。通过渗透测试，你可以识别系统中的漏洞并在生产前将其封堵。这将帮助你防止可能因黑客利用而导致的灾难。


