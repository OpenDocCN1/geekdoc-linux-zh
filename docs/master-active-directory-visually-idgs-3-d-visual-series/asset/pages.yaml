- pgno: 361
  md: '# WHAT IS REPLICATION?


    Replication is the process of sending update notifications to other Active Directory
    domain controllers when changes or updates occur in the Active Directory. Imagine
    you have two documents that are exactly alike. If you change a sentence in one
    document, you must also change the same sentence in the second document to keep
    them exactly the same.


    The purpose of replication is the same—to *replicate*, or copy, changes to other
    Active Directory databases so that all Active Directory data on all domain controllers
    is exactly the same. Through Active Directory replication, all domain controllers
    are assured of having correct database information that accurately reflects the
    resources available in the Active Directory environment.


    ![](img/763d5ae436311371600c0952a3da9094_361_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_361_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_361_2.png)


    ![](img/763d5ae436311371600c0952a3da9094_361_3.png)


    Changes made on one Active Directory domain controller are replicated to all other
    Active Domain controllers so that all domain controllers have exactly the same
    information.'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# # UNDERSTANDING REPLICATION TOPOLOGY


    Active Directory replication occurs between two topologies—Intrasite and intersite.
    Intrasite replication occurs within a site, which is a grouping of computers or
    domains connected by high-speed bandwidth. (You can learn more about sites in
    Chapters 22 and 23.) Within a site, or intrasite, the Active Directory automatically
    generates a replication topology; it determines how the domain controllers replicate
    data to one another. This feature is a great administrative benefit because it
    removes the burden of manually configuring replication between domain controllers.


    For intersite replication, you manually establish the site link used to replicate
    data (see Chapter 23). Sites are generally connected by slower or less reliable
    links, and a replication topology is not automatically generated between sites.


    In order to fully understand the replication process, you should understand how
    the Active Directory automatically generates the intrasite replication topology.
    Replication topology defines the pathways between domain controllers through connection
    objects and the Knowledge Consistency Checker (KCC).


    Replication occurs through domain controller partners. The Active Directory determines
    whether a domain controller is a direct partner with another domain controller
    or if it receives replication indirectly from a domain controller through transitive
    replication. This


    ![](img/763d5ae436311371600c0952a3da9094_362_0.png)


    simply means that if Server1 is a direct partner with Server2, and Server2 is
    a direct partner with Server3, then Server3 receives replication data indirectly
    (transitively) from Server1. The KCC determines how domain controllers are partnered
    so that all domain controllers receive replication data. Direct connections are
    called connection objects and are unidirectional between the two domain controllers.
    In other words, a potential direct partner domain controller


    is seen as a connection object in terms of the replication topology. The Active
    Directory automatically generates connection objects based on information about
    the sites, subnets within the sites, and cost of connections. The KCC uses this
    information to generate a replication topology in a bi-directional ring (by default).
    When a change is made to the Active Directory that needs to be replicated, the
    replication engine on the domain controller begins the replication process at
    a defined interval when replication can occur (every five minutes by default).
    Then, it notifies its first replication partner, which notifies its partner, and
    so forth. By this design of direct and indirect replication, replication within
    a site generally takes about 15 minutes to replicate to all domain controllers.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# ## HOW REPLICATION WORKS IN THE ACTIVE DIRECTORY


    Windows 2000 functions using *multimaster replication*, which means that no single
    master replicator domain controller exists; all domain controllers function as
    peers and are equally responsible for replication. Through the use of multimaster
    replication, changes to the Active Directory can be made at any domain controller
    in the Active Directory environment, and those changes are replicated to all other
    domain controllers in the environment. Without effective, timely replication,
    domain controllers would lose the accurate view of Active Directory resources
    because each domain controller would not be aware of changes made at other domain
    controllers. So, you can see that replication is a highly important part of the
    Active Directory''s functionality and without it, the Active Directory would be
    full of errors in a short period of time.


    ![](img/763d5ae436311371600c0952a3da9094_363_0.png)


    Windows 2000 uses multimaster replication. All domain controllers are responsible
    for sending and accepting replication data.


    Replication begins with a *change notification*, which is a message that a domain
    controller sends to other domain controllers to inform them of a change in the
    Active Directory. For example, if you add a new object, such as a user account,
    to the Active Directory, the domain controller on which you added the object sends
    a change notification to all other domain controllers telling them that a new
    object has been added.


    ![](img/763d5ae436311371600c0952a3da9094_363_1.png)


    When a change is made on an Active Directory domain controller, a change notification
    is sent to other domain controllers notifying them of the change.'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'After a change notification is sent, the process continues with an *update
    request*. When a domain controller needs to replicate data to other domain controllers,
    an *originating update* is created. An originating update determines what kind
    of change needs to be made to the Active Directory data. There are four kinds
    of originating updates: Add, Modify, ModifyDN, and Delete. The Add originating
    update adds something to the Active Directory—for example, if you add a new user
    account. If you modify something in the Active Directory, such as user account''s
    password, the Modify originating" update is used. The exception to the Modify
    originating update is the ModifyDN originating update. The ModifyDN originating
    update is used if you change the name of an object or an object''s parent. Because
    changing the name of an object or an object''s parent is different than changing
    an attribute (such as a user account password), the ModifyDN is used to modify
    the name. Keep in mind that Active Directory objects have a number of LDAP names
    that are hidden from users. The DN portion of the name is the “distinguished name”
    of the object—or what you normally call the object. Finally, if you delete something,
    such as a user account, the Delete originating update is used.


    Originating updates occur on the domain controller where the change was made and
    are replicated to other domain controllers. When other domain controllers receive
    the originating update, the update becomes a *replicated update* in their databases.


    ![](img/763d5ae436311371600c0952a3da9094_364_0.png)'
  merge: -1
  img_proc: true
- pgno: 365
  md: '# HOW REPLICATION WORKS IN THE ACTIVE DIRECTORY


    # Update Sequence Numbers


    The replication process works, in part, due to the use of Update Sequence Numbers
    (USN). USNs are assigned numbers that are stored on a USN table on each domain
    controller. USNs determine the updates that need to occur between domain controllers.
    When a domain controller needs to change, delete, or update an object, the USN
    number for the updated attribute changes. For example, if you change a user account''s
    password, the password attribute USN number is updated on the domain controller
    so that all other domain controllers have an outdated USN for that user account''s
    password. This way, other domain controllers know they have an outdated USN that
    needs to be updated. The other domain controllers accept the replication change
    and update their USN table so that each domain controller maintains the highest
    USN numbers for each object and for the attributes of that object.


    Because of USNs, timestamps are not used in the normal replication process, but
    they are still maintained for special circumstances, such as tie-breaking. For
    example, if an administrator on one domain controller changes a user account''s
    password, and at the same time on a different domain controller, an administrator
    makes the same change, the timestamp is used to break the tie. The highest timestamp
    wins.


    ![](img/763d5ae436311371600c0952a3da9094_365_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_365_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_365_2.png)


    ![](img/763d5ae436311371600c0952a3da9094_365_3.png)'
  merge: -1
  img_proc: true
- pgno: 366
  md: '# HOW REPLICATION WORKS IN THE ACTIVE DIRECTORY


    # Propagation Dampening


    The Active Directory maintains a *loop* of traffic so that replication reaches
    all domain controllers. However, this loop can potentially allow unnecessary replication
    traffic. To avoid this, propagation dampening is used. Basically, *propagation
    dampening* prevents the same replication traffic from visiting the same domain
    controller twice. Domain controllers detect when data has already been replicated
    to another domain controller, and when this detection occurs, the domain controller
    “kills” the replication so that it is not sent to the same domain controller twice.


    This process occurs through the use of two *vectors*, which are made up of pairs
    of data containing the USN and the Globally Unique Identifier (GUID). The two
    vectors are called the *Up-to-date vector* and the *High Watermark vector*. The
    Up-to-date vector contains the server USN pairs containing the highest originating
    update. The High Watermark vector holds the USN numbers for attributes that have
    been changed or modified in the Active Directory and are stored in the replication
    metadata (which is data about data) for that attribute. Through the use of both
    vectors, domain controllers can detect when another domain controller has already
    received the replication data so that propagation dampening can occur. This is
    a system process and one that is not configurable and is invisible to administrators.


    ![](img/763d5ae436311371600c0952a3da9094_366_0.png)'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# # HOW REPLICATION WORKS IN THE ACTIVE DIRECTORY


    # ## Solving replication collisions


    Because Active Directory replication occurs through multimaster replication, replication
    conflicts can occur. One of the Active Directory’s internal tasks is to solve
    replication conflicts. A conflict occurs when the same attribute is changed at
    the same time on two different domain controllers. The Active Directory avoids
    collisions by using *attribute replication* rather than *object replication*.
    For example, when you change a user account’s password, only the password attribute
    is replicated instead of the entire user object. If another administrator on another
    domain controller is changing the user object’s group membership at the same time,
    a conflict does not occur because each administrator is changing a different attribute.


    ![](img/763d5ae436311371600c0952a3da9094_367_0.png)'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'However, even though data is replicated at the attribute level, conflicts can
    still occur. If an administrator on one domain controller changes a user''s password
    and another administrator on another domain controller changes the same user''s
    password, and if replication occurs at the same time, then a replication collision
    occurs.


    In this case, *replication resolution* occurs to correct the collision. Resolution
    is accomplished by using the USN numbers and timestamps recorded in the attribute''s
    metadata. The domain controller on which the collision occurs looks for the highest
    USN or timestamp to resolve the collision and determine which change should be
    replicated. In extreme cases in which the USN and timestamp are the same, then
    the **GUID** is used to break the tie. The collision resolution process makes
    certain that the latest change to the attribute is the one that is replicated.


    ![](img/763d5ae436311371600c0952a3da9094_368_0.png)'
  merge: -1
  img_proc: true
- pgno: 369
