- pgno: 77
  md: '# INTRODUCTION TO DHCP


    Dynamic Host Configuration Protocol (DHCP) is used to dynamically assign IP addresses
    to network clients. DHCP is a TCP/IP standard that eliminates the need for manual
    TCP/IP address assignment. Before the use of DHCP, each client on a TCP/IP network
    had to be manually assigned a static IP address, subnet mask, and default gateway.
    Because each network client must have a unique TCP/IP address, the possibility
    of errors and network problems was great. With the wide usage of TCP/IP as a network
    protocol, administrators would be overwhelmed with IP address configuration and
    problems without DHCP. DHCP is an extension of the BOOTP protocol that enables
    diskless workstations to automatically configure TCP/IP. With the use of DHCP,
    the DHCP server automatically assigns the IP address and other TCP/IP information
    to clients so that administrators do not have to worry about automatic assignment
    and duplicate address problems.


    ![](img/763d5ae436311371600c0952a3da9094_77_0.png)


    +   2.  The DHCP server answers the DHCPDISCOVER request by making a lease offer
    to the client. This is called the DHCPOFFER. The DHCP server reserves an IP address
    for the client in case the client accepts the offer. If multiple DHCP servers
    respond to the client, the client will only accept one offer. Offers not accepted
    are then rescinded and offered to other clients as needed.


    # How DHCP assigns IP addresses


    A DHCP server automatically leases an IP address to network clients when the client
    logs on to the network. Because each network client must have a unique IP address,
    the DHCP server leases an IP address from a pool of available IP addresses. This
    ensures that no network clients receive the same IP address. When a client logs
    on, a process with the DHCP server occurs in order to assign the IP address. There
    are four steps to this process:


    +   1.  The process begins when the client sends a broadcast message that looks
    for a DHCP server. This is a DHCPDISCOVER request. The discover message contains
    the client computer''s name and MAC address so that the DHCP server can respond
    to the request.


    ![](img/763d5ae436311371600c0952a3da9094_77_1.png)'
  merge: -1
  img_proc: true
- pgno: 78
  md: '3. The client accepts the DHCPOFFER request from one of the DHCP servers by
    sending a broadcast message for a particular server. This is called DHCPREQUEST.
    Other DHCP servers that have made an offer rescind their offers.


    ![](img/763d5ae436311371600c0952a3da9094_78_0.png)


    4. Finally, the DHCP server whose offer was accepted sends an acknowledgement
    message with a valid IP address and lease time information. This is called the
    DHCPACK, which is the server acknowledgement message and the IP address assignment
    to the client. The client then becomes a DHCP client and can fully participate
    in the TCP/IP network.


    ![](img/763d5ae436311371600c0952a3da9094_78_1.png)


    # DHCP *terms you need to know*


    In order to use and implement DHCP in your network, you need to understand the
    following terms. You see these terms throughout the rest of this chapter as you
    configure DHCP.


    +   Address Pool: An address pool is the addresses in a scope that are available
    for lease.


    +   Exclusion Range: An exclusion range is a group of addresses in the scope that
    are not available for lease. These are reserved for servers, routers, and other
    communication components on the network.


    +   Lease: The DHCP lease is the amount of time a client can keep an IP address
    before it expires.


    +   Reservation: A reservation is used to assign a particular IP address to a
    particular client so that the client always has the same IP address. Reservations
    are normally used for hardware devices, such as routers, that need a static address.


    +   Scope: A DHCP scope is the full range of IP addresses that are available for
    leasing for a particular DHCP server.


    +   Superscope: A superscope is a grouping of scopes used to support logical IP
    subnets that exist on one IP subnet.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# INSTALLING DHCP


    Any Windows 2000 server, whether it’s a domain controller or member server, can
    be a DHCP server. Many administrators choose to use member servers to handle the
    DHCP functions in order to decrease the domain controller’s workload. Generally,
    you should have at least one DHCP server on each subnet in your network.


    In mixed environments, you can still use Windows NT 4.0 servers as DHCP servers
    as well. Client computers running Windows 2000 and earlier versions of Windows
    (such as NT and Windows 9x) can contact a Windows NT DHCP server for obtaining
    an IP address. Refer to the Windows NT documentation for how to install and configure
    DHCP.


    To install DHCP on a Windows 2000 server, you use the Add/Remove Programs feature
    in Control Panel. You can also use the Configure Your Server program in Administrative
    Tools.


    ![](img/763d5ae436311371600c0952a3da9094_79_0.png)


    +   1.  Open Control Panel and double-click Add/Remove Programs.


    +   2.  Click Add/Remove Windows Components.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# TIPS


    # Is there another way to install DHCP?


    Yes. You can also install DHCP by choosing Start**Programs**Administrative Tools**Configure
    Your Server. Click the Networking link in the left pane, and then click DHCP.
    Follow the instructions that appear on your screen.


    # Can a Windows 2000 Professional computer function as a DHCP server?


    No. You can install DHCP on any Windows 2000 server or Windows 2000 Advanced Server,
    but Windows 2000 Professional computers cannot function as DHCP servers. You can
    also use Windows NT 4.0 Server computers as DHCP servers in Windows 2000 networks,
    but no versions of earlier Windows clients, such as NT or 9x can function as DHCP
    servers.


    # Does Windows 2000 include an auto-IP- addressing feature?


    Yes. Windows 2000 server includes an auto-addressing feature that allows clients
    to automatically assign an IP address to themselves if a DHCP server is not available
    or present. This feature is primarily designed for use in small networks so that
    TCP/IP can be used without configuring DHCP.


    ![](img/763d5ae436311371600c0952a3da9094_80_0.png)


    +   3 Click Next to continue.


    +   4 Select Networking Services.


    +   5 Click Details.


    ![](img/763d5ae436311371600c0952a3da9094_80_1.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# INSTALLING DHCP CONTINUED


    As with other networking components, you install the DHCP service by selecting
    it from the Networking Services options. You can also use the Configure Your Server
    program that is available in the Administrative Tools folder. This particular
    service does not present you with a configuration wizard during the installation.
    You can simply install the service first, and then you can configure the service
    after the installation is complete.


    After the installation is complete, the DHCP server does not become active on
    your network until you authorize it and configure it. Authorization allows the
    DHCP service to lease IP addresses to network clients, and the Active Directory
    provides authorization. The authorization feature provides an extra measure of
    security. Because all DHCP servers must be authorized with the Active Directory,
    an unauthorized DHCP server cannot come online and begin issuing IP addresses.
    See the next section to learn how to authorize the DHCP server.


    ![](img/763d5ae436311371600c0952a3da9094_81_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_81_1.png)'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# TIPS


    # Will I need to know the scope information for my network during installation?


    No. You can install the DHCP service first, and then you need to authorize and
    configure it after the installation is complete.


    # Can I install other networking components when I am installing DHCP?


    Yes. If you would like to install other networking components as well, simply
    select the components you want to install by clicking their check boxes. Windows
    2000 lets you install several components at one time.


    # Why doesn''t the DHCP server begin functioning automatically?


    In order for DHCP to work, you have to configure certain components of the service.
    You need to create a scope that gives the service the IP address range that it
    can lease from, and a pool of addresses that it can actually lease. The server
    also has to be authorized by the Active Directory to lease IP addresses to clients.


    ![](img/763d5ae436311371600c0952a3da9094_82_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_82_1.png)'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# AUTHORIZING THE DHCP SERVER


    The DHCP server does not become active when the installation is complete because
    it must be authorized first. Authorization occurs by adding the server to the
    authorized DHCP servers in the Active Directory. This authorization process prevents
    unauthorized, or rogue, DHCP servers from leasing IP addresses.


    The Active Directory determines if the server can be authorized to participate
    on the network and lease IP addresses to clients. If you are installing DHCP on
    a domain controller, you may not have to authorize it manually, but you have to
    authorize member servers. To complete this action, you must be logged on with
    an account that is a


    member of the Enterprise Administrators group for the enterprise where you are
    adding the server. Authorization is a safety feature that enables you, as the
    administrator, to control the DHCP servers that function on your network.


    ![](img/763d5ae436311371600c0952a3da9094_83_0.png)


    +   1. Click Start > Programs > Administrative Tools > DHCP.


    ![](img/763d5ae436311371600c0952a3da9094_83_1.png)


    The MMC snap-in appears. Notice that the server is not yet authorized.'
  merge: -1
  img_proc: true
- pgno: 84
  md: "# TIPS\n\n# What is a rogue DHCP server?\n\nA rogue DHCP server is one that\
    \ is not authorized to lease IP addresses to clients. DHCP servers must be authorized\
    \ by the Active Directory in order to present any server on the network from issuing\
    \ IP addresses from invalid scopes. The authorization process prevents other users\
    \ who have access to a server from installing the DHCP server and assigning inappropriate\
    \ IP addresses to clients. This action may prevent those clients from gaining\
    \ network connectivity. The Active Directory determines if the server is authorized\
    \ to participate by checking both the server and the administrator's permissions.\n\
    \n# What permission do I need to authorize a server?\n\nYour user account must\
    \ be a member of the Enterprise Administrators group in order to authorize a DHCP\
    \ server in an Enterprise environment. This feature prevents a user or administrator\
    \ who is not an Active Directory administrator from bringing a DHCP server online.\n\
    \n![](img/763d5ae436311371600c0952a3da9094_84_0.png)\n\n+   2 Choose  \n+   Action\
    \ > Authorize.\n\n+   3 To authorize several  \n+   servers, choose  \n+   Action\
    \ > Manage Authorized  \n+   Servers."
  merge: -1
  img_proc: true
- pgno: 85
  md: '# # AUTHORIZING THE DHCP SERVER CONTINUED


    If you select the server in the MMC snap-in and then use the Console menu, you
    can authorize that particular server. You can also use the snap-in to authorize
    (or unauthorize) other servers as well. This feature enables you to manage all
    DHCP servers from one location. This snap-in feature is particularly


    useful in environments where one person administers many DHCP servers. Instead
    of having to visit each machine, you can manage them all from one location after
    the initial installation is complete. From the single location, you can configure
    individual scopes, review performance, add new servers, and


    remove servers that you no longer want to function as DHCP servers.

    In order to authorize the server, you need to know the server''s IP address. All
    domain controllers should be configured with a static IP address and subnet mask
    that does not change.


    ![](img/763d5ae436311371600c0952a3da9094_85_0.png)'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Can DHCP assign IP addresses to other servers?


    All servers, whether they are DHCP servers or not, should be assigned a static
    IP address. You can enter the static IP address by accessing the TCP/IP Properties
    dialog box. You should not use DHCP to dynamically assign servers IP addresses.


    # Can Windows 9x computers receive a DHCP lease from a Windows 2000 DHCP server?


    Yes. You can use the TCP/IP Properties dialog box to configure Windows 9x computers
    to receive an IP address automatically. Windows 9x computers can receive this
    address and log on just as they could with Windows NT. To configure this feature,
    access the TCP/IP Properties dialog box for the computer. On that screen, you
    can either enter a manual IP address, subnet mask, and default gateway, or you
    can click the radio button that says, "Obtain an IP address automatically." Click
    this button to enable DHCP for the client. When the client logs on, it attempts
    to contact a DHCP server for an IP address.


    ![](img/763d5ae436311371600c0952a3da9094_86_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_86_1.png)'
  merge: -1
  img_proc: true
- pgno: 87
  md: "# ## CREATING SCOPES\n\nA scope is the total group of IP addresses for a particular\
    \ subnet. Before creating a scope, you need to know what the starting and ending\
    \ IP addresses of the scope are. This action determines the number of IP addresses\
    \ that are in the scope and which IP addresses can be leased to clients. You also\
    \ need to know the subnet mask for the IP subnet. When the lease is made to the\
    \ client, the client is provided with both an IP address and the correct subnet\
    \ mask for the IP subnet. Each subnet must have only one scope.\n\nThe scope should\
    \ contain all IP addresses that can be used in that subnet. This does not mean\
    \ that all IP addresses within the scope must be available for lease. You can\
    \ reserve addresses for other uses and create static mappings. The leftover addresses\
    \ are then used for leasing purposes.\n\n+   1. Select the server, and then choose\
    \ Action->New Scope.\n+   \n+   ![Screenshot showing the DHCP management console\
    \ with the 'New Scope' option selected in the Action menu.](image1)\n+   \n+ \
    \  ![Screenshot showing the 'Welcome to the New Scope Wizard' dialog box.](image2)\n\
    +   \n+   2. Click Next to continue."
  merge: -1
  img_proc: true
- pgno: 88
  md: '# TIPS


    # How can I determine what IP addresses I should configure for the scope?


    You need to consult your network''s configuration data to determine which IP addresses
    are available for the particular subnet where you are installing the DHCP server.
    Most TCP/IP networks use subnets to segment the network so that it is more manageable.
    Before implementing DHCP, make certain that you have planned your scope(s) so
    that they don''t overlap with other DHCP servers.


    # Does a single scope apply to the entire network?


    No. A scope is configured for each individual subnet on the network. The server(s)
    then uses the addresses in the scope to lease IP addresses to clients on that
    subnet, with the exception of those addresses within the scope that have been
    reserved. Each subnet should have only one scope.


    ![](img/763d5ae436311371600c0952a3da9094_88_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_88_1.png)


    +   Type a scope name (and a description if desired).


    +   Click Next to continue.


    +   Enter the IP address range with the starting and ending IP addresses for the
    scope.


    +   Enter the subnet mask for the IP subnet. The length number appears automatically.


    +   Click Next to continue.


    ![](img/763d5ae436311371600c0952a3da9094_88_2.png)'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# CREATING SCOPES CONTINUED


    An exclusion range is a range of IP addresses that exist in the scope but are
    not available for lease to clients. Exclusion ranges enable you to assign static
    IP addresses to servers using the excluded IP addresses. The excluded IP addresses
    still exist in the subnet scope, but they are never offered to clients for lease.
    You can then use these excluded addresses for static assignment. Exclusion ranges
    are particularly helpful because you can use DHCP to keep your static IP assignment
    organized. Because the complete IP address range is in the scope, the exclusion
    range allows you to use the scope as a means of assigning static addresses. This
    makes your job as an administrator easier and helps keep you organized.


    During scope creation, you also have the option to configure other aspects of
    the scope. You can determine the default gateway (router) by entering the static
    IP address for it. This information is also sent to the DHCP clients so that they
    can access information on other subnets. The default gateway allows clients to
    communicate with other subnets by sending IP traffic to the appropriate subnet.


    ![](img/763d5ae436311371600c0952a3da9094_89_0.png)


    +   10 Type an exclusion range (if desired).

    +   11 Click Next to continue.

    +   12 If you entered an exclusion range, click the Add button.

    +   13 Use these boxes to enter the lease time.

    +   14 Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Can there be more than one gateway?


    Depending on your network configuration, you may have more than one gateway. You
    can think of the gateways as roads that lead out of the local subnet. The gateway
    allows communication to take place between different subnets. The gateway IP address
    refers to the router that can pass IP traffic onto another subnet. By providing
    the IP address of the gateway, clients can send packets bound for a different
    IP subnet directly to the gateway.


    # How many IP addresses can I include in the exclusion range?


    You can exclude as many IP addresses from the scope as desired by using the exclusion
    range. However, any excluded addresses are never available to clients for lease,
    so the general rule of thumb is to keep your exclusion range as small as possible.


    ![](img/763d5ae436311371600c0952a3da9094_90_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_90_1.png)


    +   - **13** This window enables you to configure scope options either now or
    later.

    +   - **13** Click Yes to configure now.


    +   - **14** Click Next to continue.


    +   - **15** Enter the IP address for the default gateway.

    +   - **16** Click Add.


    +   - **17** Click Remove to remove existing default gateways, if necessary.

    +   - **18** Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# CREATING SCOPES CONTINUED


    A long with the default gateway for the subnet, the DHCP server can also send
    IP address information for DNS and WINS servers. DNS resolves fully qualified
    domain names for the network while WINS resolves NetBIOS names. As with other
    IP address information, you can enter the DNS and WINS server addresses


    in the clients'' TCP/IP Properties dialog boxes, but allowing the DHCP server
    to provide this information to the client is much easier.


    After you complete the wizard, you are asked if you would like to activate the
    scope. You must activate the scope before it can be used and before IP addresses
    can be leased to


    network clients. You can choose not to activate the scope, but you must remember
    that a scope has to be activated before it can be used to lease IP addresses.
    If you want to further configure DHCP or other server components, you may choose
    not to activate the scope until you are finished with configuration.


    ![](img/763d5ae436311371600c0952a3da9094_91_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_91_1.png)


    +   19 Enter the parent domain name, if one exists.

    +   20 Enter the IP address of the DNS server and click Add.

    +   21 Click Resolve to resolve the server name with its IP address.

    +   22 Click Next to continue.

    +   Repeat the process to add more DNS servers as needed.


    +   23 Enter the server name of the WINS server, if one exists on your network.

    +   24 Click Resolve to resolve the server name.

    +   25 Enter the WINS Server IP address and click Add.

    +   26 Click Next to continue.

    +   Repeat the process to add additional servers as needed.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# What does DNS do?


    DNS (Domain Name System) resolves domain names to IP addresses. For example, the
    name server1.corp.com represents an IP address of server1 in the corp domain.
    DNS resolves server1.corp.com to an IP address, such as 10.0.0.2 so that communication
    can take place. You can learn more about DNS in Chapter 6.


    # What does WINS do?


    WINS (Windows Internet Naming Service) resolves NetBIOS names to IP addresses.
    This allows each computer to have a friendly name, such as Server1. WINS resolves
    the friendly name to its corresponding IP address so that communication on the
    network can take place. If you have a network with only Windows 2000 computers,
    you do not need WINS. See Chapter 5 to learn more about WINS.


    # Do I have to provide the IP addresses of the DNS and WINS servers?


    No. You are not required by DHCP to provide this information, but remember that
    the DNS and WINS IP-addressing information is returned to clients. Client computers
    can still discover the IP addresses of the DNS and WINS servers if they are not
    provided in a DHCP lease. This is accomplished through broadcast messages which
    increases your network traffic. The preferred method is to provide this information
    through DHCP.


    ![](img/763d5ae436311371600c0952a3da9094_92_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_92_1.png)


    27 Click the Yes radio button to activate the scope.


    28 Click the No radio button if you want to activate the scope at a later time.


    29 Click Next to continue.


    30 Click Finish to finish creating the scope.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# CREATING SUPERSCOPES


    As mentioned previously, a network subnet has one scope. However, you can use
    superscopes to group multiple scopes under one name. This allows you to extend
    the number of IP addresses you can use in a subnet by making several scopes appear
    as one. This solution is often used with multinet. A multinet is a single network
    segment where multiple, logical IP networks exist. This is an administrative solution
    to extend the network segment without creating additional subnets.


    A superscope also enables you to support clients on the far side of the DHCP or
    BOOTP relay agent. As with any aspect of DHCP configuration, you should plan carefully
    before using superscopes to make certain that this organizational feature benefits
    the configuration of the subnet and the network in general. Although superscopes
    and multinets are effective, they should be planned carefully to avoid confusion
    and ensure communication interoperability.


    ![](img/763d5ae436311371600c0952a3da9094_93_0.png)


    1. Click Start > Programs > Administrative Tools > DHCP.


    ![](img/763d5ae436311371600c0952a3da9094_93_1.png)


    2. Select the server where you want to create a new superscope.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# How many scopes are contained in a superscope?


    Every superscope must contain at least one scope, but normally they contain two
    or more. No exact limit exists for the number of scopes a superscope can hold,
    but at some point, the superscope can become more problematic than helpful. The
    superscope is used to contain several scopes so they appear as one scope on your
    subnet, which is done for administrative purposes. You may find it helpful to
    think of a superscope as a large file folder that holds several smaller file folders.
    The large file folder does not have any functionality on its own, but is designed
    to contain the other file folders. A superscope is an organization solution to
    hold other scopes so that they appear as one. As with most implementations, superscopes
    require planning and careful thought to make certain that they benefit the design
    or needs of your subnet.


    ![](img/763d5ae436311371600c0952a3da9094_94_0.png)


    +   3 Choose Action→New Superscope.


    ![](img/763d5ae436311371600c0952a3da9094_94_1.png)


    +   The New Superscope Wizard appears.


    +   4 Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# CREATING SUPERSCOPES CONTINUED


    You can use superscopes to solve several potential problems in multinet environments.
    The following list points out some of the major solutions superscopes can provide:


    +   - When an address pool is nearly depleted because of growth and the full range
    of IP addresses for the subnet are nearly depleted, the superscope can solve this
    problem by providing a multinet approach. With this feature, you can expand the
    subnet "logically" through a multinet.


    +   - You can use a superscope to slowly migrate client computers to a new scope
    that has been configured for the subnet.

    +   - You can use a superscope so that two DHCP servers on the same physical network
    can manage separate logical IP networks.


    The multinet and superscope solutions are effective solutions in environments
    where certain subnets or even networks need to be extended so that more IP addresses
    are available. Once again, careful planning is very important.


    ![](img/763d5ae436311371600c0952a3da9094_95_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_95_1.png)


    +   - 5. Type a name for the superscope.

    +   - 6. Click Next to continue.


    +   - 7. From the list of scopes, select one or more to add to the superscope.

    +   - 8. Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# **How can a superscope allow more than one scope on a subnet?**


    The superscope makes several scopes appear as one scope. Because the scopes are
    grouped as one, DHCP can manage all scopes as one and ensure that duplicate IP
    addresses are not being leased. The superscope is a solution to use more than
    one scope on a particular subnet.


    # **Why would you use a multinet?**


    A multinet is an organizational solution that enables you to group a collection
    of computers together within a subnet or network so that the computers appear
    as if they are on a separate segment. This lets you organize the network segment
    into several logical IP networks without having to further subnet the segment.
    You can use multiets as a method of extending the subnet or breaking down the
    organization so that you can more easily manage it. You should plan carefully
    before implementing superscopes or multinets.


    ![](img/763d5ae436311371600c0952a3da9094_96_0.png)


    5 Click Finish to complete the wizard.


    ![](img/763d5ae436311371600c0952a3da9094_96_1.png)


    The new superscope now appears in the console.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# CREATING MULTICAST SCOPES


    Multicasting is the process of sending messages to multiple clients. In much the
    same way that you can send a single e-mail to several people, multicasting allows
    a group of network clients to appear as one client. This is accomplished using
    multicast addresses, which are Class D addresses (224.0.0.0 to 239.255.255.255).
    The entire Class D is reserved for multicasting and can be used on your network
    without IP address conflicts.


    Multicast DHCP (MDHCP) is an extension of the typical DHCP services. MDHCP and
    DHCP work together but are considered separate services. Clients that participate
    in multicasting, however, must have a normal, leased IP address from the DHCP
    server. In other words, a client cannot be an MDHCP client and not a DHCP client.
    The multicasting functionality must work within the normal DHCP configuration.
    As you consider and plan a multicast implementation, this is important information
    to keep in mind.


    ![](img/763d5ae436311371600c0952a3da9094_97_0.png)


    1 Select the desired server.


    ![](img/763d5ae436311371600c0952a3da9094_97_1.png)


    2 Choose Action>New Multicast Scope.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# What is a Class D address?


    IP address are defined by class. Class A, B, and C are typical IP address classes
    that you can use for network and Internet communication. Class D is a class created
    and reserved for multicasting. Class D is defined by the address range of 224.0.0.0
    through 239.255.255.255. Multicast clients must be assigned an IP address that
    falls within that range.


    # Can computers be both DHCP and MDHCP clients?


    Yes. Typical DHCP clients receive a DHCP lease, but clients that you want to include
    in the multicast group also receive an IP address for multicasting purposes. The
    two IP addresses are not interrelated and do not interfere with each other. In
    order for multicasting to work, the multicast client must also be a DHCP client.
    In this case, the client receives both a typical network IP address for normal
    communications and a multicast IP address for multicast communication.


    ![](img/763d5ae436311371600c0952a3da9094_98_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_98_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_98_2.png)


    ![](img/763d5ae436311371600c0952a3da9094_98_3.png)'
  merge: -1
  img_proc: true
- pgno: 99
