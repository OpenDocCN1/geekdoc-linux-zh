- pgno: 74
  md: "![](img/763d5ae436311371600c0952a3da9094_74_0.png)\n\n# **What is hardware\
    \ flow control?**\n\nHardware flow control allows the modem to control the stream\
    \ of data. The modem can tell the remote access software when the line is congested\
    \ or clear so the remote access software knows when to send data. Hardware flow\
    \ control increases throughput and reduces the possibility of errors because data\
    \ is not sent when the line is congested.\n\n# **What is modem error control?**\n\
    \nModem error control allows the remote access software to perform a cyclical\
    \ redundancy check (CRC) on blocks of data to check for errors. When errors occur,\
    \ the data can be retransmitted.\n\n# **What is modem compression?**\n\nModem\
    \ compression allows the modem to compress data before it is sent to another modem.\
    \ This feature reduces the number of bytes transmitted and consequently reduces\
    \ the transmission time.\n\n![](img/763d5ae436311371600c0952a3da9094_74_1.png)\n\
    \n![](img/763d5ae436311371600c0952a3da9094_74_2.png)\n\n+   **7** Click the **Using\
    \ Dialing Rules** check box to enable dialing rules.\n+   \n+   **8** Click **Rules**.\n\
    +   \n+   **9** Click **New** to create a new **Dialing Rule**.\n+   \n+   **10**\
    \ Click **Edit** to make adjustments to existing dialing rules.\n+   \n+   **11**\
    \ Click **OK** when you are finished."
  merge: -1
  img_proc: true
