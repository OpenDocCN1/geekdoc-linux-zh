- pgno: 579
  md: '# APPENDIX A


    # RETAINING SYSTEM LOG


    The Group Policy can be set up to retain system log files for a specified number
    of days. Events that are older than 7 days will be overwritten by the system (this
    is the default setting). Depending on your needs, however, you can raise or lower
    this value. Note that client computers usually need more disk space to store the
    logs as they grow. This is important to know if you decide to raise the value.


    ![](img/763d5ae436311371600c0952a3da9094_579_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_579_1.png)


