- pgno: 429
  md: '# # ACTIVE DIRECTORY SECURITY FEATURES


    Security is a complex topic in Windows 2000. If you have explored your server''s
    security options or read any information about security, you realize that Microsoft
    includes many technologies so that organizations can develop security solutions
    based on need. Kerberos, encrypting file system, IP Security, and Certificate
    services are only a few of the security features available to enable a network
    to lock out intruders.


    All these security features are often confused with the Active Directory. But
    remember that the Active Directory is an integrated component of a Windows 2000
    network—not a process that stands on its own. All security features in Windows
    2000 affect the Active Directory in some way, but for the most part, you can implement
    four major security options to secure the Active Directory''s resources.


    # **Domain, OU, and object security**


    You can secure your Active Directory domains, organizational units, and individual
    objects in the Active Directory. Through the properties sheets for domains, OUs,
    and objects, you can control who can access them and what those users can do.


    An important feature concerning security is inheritance. For example, the resources
    (objects) residing in an OU can inherit the security settings of the actual OU.
    Or you can set the security permissions for each object individually. The point
    is you have a fine level of control over the resources in the Active Directory,
    from the domain level down to a simple user account.


    This chapter shows you the basic process of setting up security on domains, OUs,
    and objects, but you can also learn about this task in Chapters 14, 15, 16, and
    17 on an individual basis.


    # **Delegation**


    Delegation is a tool that allows an administrator to delegate administrative authority
    of domains, OUs, and containers to other users or groups. This feature enables
    you to implement distributed security and administrative control so that a single
    group of administrators is not'
  merge: -1
  img_proc: true
- pgno: 430
  md: 'faced with the task of managing all aspects of a Microsoft Enterprise environment.
    Delegation of different domains, OUs, and objects is performed through the Delegation
    Wizard. You can learn about delegation in this chapter as well, or you can see
    examples of delegation in Chapters 14, 15, 16, and 17.


    # **Group policy**


    Group policy is a powerful security feature of Windows 2000 that enables you to
    apply a variety of policies to a particular group of users. You can assign group
    policy at the domain and OU level. In other words, the users in a particular OU
    can have a group policy while users in another OU may have another group policy.
    Group policy enables you to


    manage security settings, desktop settings, system settings, applications, and
    a host of other features. Group policy is integrated with the Active Directory
    and is the method of choice for managing Enterprise users. You can learn all about
    group policy in Chapter 25.


    # **Class and attribute security**


    As mentioned earlier, you can apply security measures to every object in the Active
    Directory on an individual basis. You can also set security on classes of objects
    and even attributes of objects.


    Active Directory objects are divided into *classes*, such as the User class. For
    each class of objects, you can determine which


    users or groups should access that class of objects and what permissions they
    have for the class. At an even lower level, you can set security on object attributes.
    Attributes are *qualities* of an object that define the object. For example, a
    user account has the attributes of a username, e-mail address, and group membership.
    You can finely control the security of attributes so that users can see a user
    account''s e-mail address but not the group membership, or any other combination.
    This level of security enables you to completely control your Active Directory
    environment. To set security on classes and attributes, you use the Active Directory
    Schema Manager, which you can learn about in Chapter 27.'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# # SETTING UP OBJECT SECURITY


    n Active Directory object is basically any resource within the Active Directory.
    Objects include users, groups, shared folders, printers, shared applications,
    contacts, and so on. The Active Directory enables you to set security for each
    object in the Active Directory. By design, you can control which groups or users
    can


    access particular objects and what they can do with those objects after they access
    them.


    Security for Active Directory objects is configured on the Security tab that appears
    on each object''s properties sheets. Each Security tab has the same basic options.
    For example, a user''s Security tab allows


    you to configure who can access the user''s account and what they can do with
    the account; a printer''s Security tab lets you control who can access the printer
    and what they can do with the printer. This level of administration enables you
    to finely control your Active Directory resources and what groups and users can
    do with those resources.


    ![](img/763d5ae436311371600c0952a3da9094_431_0.png)


    +   1. Choose Start→Programs→Administrative Tools→Active Directory Users and Computers.


    ![](img/763d5ae436311371600c0952a3da9094_431_1.png)


    +   2. Select the desired object and choose Action→Properties.'
  merge: -1
  img_proc: true
- pgno: 432
  md: '# Can I give a user full control for one object and not for another?


    Each object in the Active Directory is managed separately in terms of security.
    You can assign any permission you want to any group or user for each object. For
    example, you can give Full Control to user on one printer and no access on another
    printer for the same user.


    # Should I apply security to individual users or groups?


    The preferred method for managing users in any manner is to organize them into
    groups. Then, you can assign resource access permissions based on groups instead
    of on an individual basis. In large environments, individual security permission
    would be a daunting task. Groups alleviate this problem, and you can even further
    manage group access through group policies, which you can learn about in Chapter
    25.


    ![](img/763d5ae436311371600c0952a3da9094_432_0.png)


    +   *   **3** Click the Security tab.

    +   *   **4** Select a desired user or group.

    +   *   **5** Click the appropriate check boxes to adjust the security settings.

    +   *   **6** To add a new user or group to the security list, click Add.

    +   *   **7** Select the user or group you want to add.

    +   *   **8** Click Add.

    +   *   **9** Click OK.'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# ## SETTING UP OBJECT SECURITY CONTINUED


    F or each Active Directory object, you can also assign advanced permissions. You
    can access the advanced permissions by clicking the Advanced button on the Security
    tab of the object''s properties.


    The Advanced options enable you to define the permissions that a user or group
    has for a particular object and


    that object''s properties. The options presented are more detailed than the general
    security options and allow you finer control over the object.


    Generally, you do not need to define advanced security permissions for all objects.
    The standard set of permissions available on the Security tab is usually enough
    to define all the security needs you


    may have. However, with certain objects, you may wish to define advanced features
    so that even if a group has “full control” permission, you can still deny some
    permissions through advanced features. The overall purpose of the advanced features
    is to enable you to configure security in a manner that best benefits your environment.


    ![](img/763d5ae436311371600c0952a3da9094_433_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_433_1.png)


    +   **10** To access advanced security options, click **Advanced**.


    +   **11** Select the user or group for whom you want to define advanced permissions.


    +   **12** Click this check box to allow or disallow inheritable permissions from
    the parent object to a child object.


    +   **13** Click **View/Edit**.'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# TIPS


    # Should I give advanced property settings to most users or groups?


    In general, the standard settings, such as full control, read, write, and so forth,
    are all you need to implement an effective security policy. Use the advanced rights
    for situations in which you need finer control of what a user or group can do
    with permissions.


    # When would I want to use advanced permissions?


    You don’t need to use advanced permissions on a regular basis, but they are useful
    for custom security situations. For example, let’s say that you want to assign
    a user full control over an object, but you do not want the user to be able to
    delete the object or take ownership of it. You can assign full control, then use
    the Advanced permissions entries to override the Full Control permission for delete
    and take ownership. Using the Advanced feature, you can customize permissions
    as necessary for your environment.


    ![](img/763d5ae436311371600c0952a3da9094_434_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_434_1.png)


    Click Change if you want to move from one user/group to another set permissions
    for another object.


    Use this drop-down box to choose whether to apply permissions to only this object
    or to all child objects.


    Click the appropriate Allow or Deny check boxes to configure the desired security
    features.


    Click the Properties tab.


    Use this drop-down box to choose whether to apply permissions to only this object
    or to all child objects.


    Click the appropriate Allow or Deny check boxes to configure the desired security
    features. Click OK.'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# # SETTING UP OU SECURITY


    An *organizational unit* (OU) is a container that is designed to hold resources
    and other OUs. OUs are built on a hierarchy structure in which OUs can hold other
    OUs. This process is called *nesting*, and you should take great care when designing
    your organization’s OU structure. The Active Directory enables you to set security
    for each OU in the Active Directory. By design, you can control which groups or
    users can access the OU and what they do with the resources inside the OU. Security
    for Active Directory OUs is configured on the Security tab on each OU’s properties
    sheets. The Security tabs for each OU appear the same and have the same basic
    options. This level of administration enables you to finely control how Active
    Directory OU and how users and groups can access an OU.


    ![](img/763d5ae436311371600c0952a3da9094_435_0.png)


    **1**  Choose Start→Programs→Administrative Tools→Active Directory Users and Computers.


    ![](img/763d5ae436311371600c0952a3da9094_435_1.png)


    **2**  Select the desired OU and choose Action→Properties.'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# What default settings do most users have for the OU?


    Most users have a default setting of Read. In other words, they can read the OU
    and what it contains. Access to resources within the OU or to other nested OUs
    can be individually controlled.


    # Does a user’s permissions for an OU apply to all resources within the OU?


    Permissions can “filter” down through an OU to other nested OUs and resources
    within those OUs. This is called inheritance. You can allow inheritance to occur
    or you can set permissions for each nested OU and resource. If you choose to block
    inheritance, then you can allow a user to access some resources and not others.
    The decision is based on your security needs and corporate security policies.


    ![](img/763d5ae436311371600c0952a3da9094_436_0.png)


    4 Select the desired user or group in the list.


    5 Click the appropriate check boxes to adjust the security settings.


    6 To add a new user or group to the security list, click Add.


    ![](img/763d5ae436311371600c0952a3da9094_436_1.png)


    7 Select the user or group you want to add.


    8 Click Add.


    9 Click OK.'
