    +   4.  Click the check box to either enable or disable the policy setting.


    +   5.  Click Add.


    +   6.  Select the desired groups, then click OK.


    You can also use the Remove button to remove any existing groups.


    +   Click OK.'
  merge: -1
  img_proc: true
- pgno: 551
  md: '# BYPASSING TRAVERSE CHECKING


    T


    raverse checking is a security process that determines if a user can move through
    a series of folders. You can use this policy to bypass traverse checking for particular
    users or groups. This policy allows users to traverse folder structures without
    having to be checked for security access.


    ![](img/763d5ae436311371600c0952a3da9094_551_0.png)


    +   1.

    +      Expand the Security Settings container, expand the Local Policies container,
    then select Users Rights Assignment.

