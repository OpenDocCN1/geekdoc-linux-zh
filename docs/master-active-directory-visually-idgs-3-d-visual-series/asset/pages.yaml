- pgno: 486
  md: '# TIPS


    Can users find the folder if I don''t enter keywords?


    Yes. All objects contain built-in attributes that define the object. If a user
    searches for shared folders, he or she will find the folder. However, in large
    environments, such a search could return many results. The keywords help you define
    the folder''s contents so that those users can perform a more detailed search
    for the kind of shared folder or documents they are searching for.


    A shared folder on my network has been moved to a different computer. Do I have
    to remove the shared folder from the Active Directory and recreate it?


    No. If a shared folder is physically moved to a different computer, simply access
    the shared folder''s properties sheets in the Active Directory and change the
    UNC path on the General tab so that it points to the correct location. Remember
    that the Active Directory shared folder is really just a pointer that redirects
    the users to the appropriate server or computer on which the folder physically
    resides.


    ![](img/763d5ae436311371600c0952a3da9094_486_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_486_1.png)'
  merge: -1
  img_proc: true
- pgno: 487
  md: '# SHARING PRINTERS


    The Active Directory can also store information about shared printers so that
    users can perform a search, locate a shared printer they want to use, and then
    use the shared printer.


    As with a shared folder, the Active Directory stores pointer information for the
    printer that redirects the user to the actual computer to which the print device
    is physically connected. This process allows users to find the shared printer
    they want to use and then print to that printer.


    Printers that are connected to Windows 2000 computers function in a different
    manner with the Active Directory than printers connected to down-level computers.
    Windows 2000 computers can share a printer and automatically publish the shared
    printer to the Active Directory. Also, Windows 2000 printers can hold drivers
    for down-level computers and then send those drivers to those computers when they
    want to use the printer. All this is done in the background without user intervention.


    ![](img/763d5ae436311371600c0952a3da9094_487_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_487_1.png)'
  merge: -1
  img_proc: true
- pgno: 488
  md: '# **TIPS**


    Can a computer other than a Windows 2000 computer publish a printer to the Active
    Directory?


    +   Any printer on any computer can be published to the Active Directory, but
    only Windows 2000 computers can perform this process automatically. In the case
    where a printer is connected to a down-level computer, the administrator must
    manually add the printer to the Active Directory.


    Can only certain types of printers be published in the Active Directory?


    +   No. If a printer is connected to a computer and the printer is shared, it
    can be published in the Active Directory. Remember that the Active Directory simply
    stores pointer information that redirects the user''s request to the computer
    to which the printer is physically attached.


    ![](img/763d5ae436311371600c0952a3da9094_488_0.png)


    +   The Printers folder opens.


