    +   program.


    +   4. Find the file named Setup.exe, or Install.exe, or

    +   something similar, and double-click that file.

    +   The installer for the program you selected now

    +   walks you through the process of setting up your

    +   new software.


    # Troubleshooting


    The programs on the CD-ROM work on most

    computers with the minimum system requirements.

    However, your computer may differ, and some

    programs may not work properly for some reason.


    The two likeliest problems are that you don''t have

    enough memory (RAM) for the programs you want to

    use, or you have other programs running that are

    affecting installation or running of a program. If you

    get error messages such as Not enough memory or

    Setup cannot continue, try one or more of these

    methods and then try using the software again:


    +   ▶ Turn off any anti-virus software that you have

    +   on your computer. Installers sometimes mimic

    +   virus activity and may make your computer

    +   incorrectly believe that it is being infected by a

    +   virus.


    +   ▶ Close all running programs. The more

    +   programs you''re running, the less memory is

    +   available to other programs. Installers also

    +   typically update files and programs; if you keep

    +   other programs running, installation may not

    +   work properly.


    +   ▶ In Windows, close the CD interface and run

    +   demos or installations directly from Windows

    +   Explorer. The interface itself can tie up system

    +   memory, or even conflict with certain kinds of

    +   interactive demos. Use Windows Explorer to

    +   browse the files on the CD and launch

    +   installers or demos.


    +   ▶ Have your local computer store add more RAM

    +   to your computer. This is, admittedly, a drastic

    +   and somewhat expensive step. However, if you

    +   have a Windows 95 PC or a Mac OS computer

    +   with a PowerPC chip, adding more memory

    +   can really help the speed of your computer and

    +   enable more programs to run at the same time.


    If you still have trouble installing the items from the

    CD, please call the IDG Books Worldwide Customer

    Service phone number: 800-762-2974 (outside the

    U.S.: 317-596-5430).'
  merge: -1
  img_proc: true
