- pgno: 556
  md: '# ## DEBUGGING PROGRAMS


    When programs malfunction in Windows 2000, you have the option to debug the program.
    This process generates data about the


    program and examines the program''s code to determine what caused the problem.
    In many cases, the information gained is not decipherable unless you are a


    programmer. You can use this policy to allow certain users and groups the right
    to debug malfunctioning programs.


    ![](img/763d5ae436311371600c0952a3da9094_556_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_556_1.png)


    +   1. Expand the Security Settings container, expand the Local Policies container,
    and select User Rights Assignment.


    +   - The policy settings appear in the details pane.


    +   2. Double-click the Debug Programs policy setting.


    +   3. The Debug Programs policy window appears.


    +   4. Click the check box to either enable or disable the policy setting.

    +      Click Add.


    +   5. Select the desired groups, then click OK.

    +      - You can use the Remove button to remove any existing groups.

    +      6. Click OK.


    535'
  merge: -1
