- pgno: 29
  md: '# ACTIVE DIRECTORY TECHNOLOGY


    # CONTINUED


    # Understanding LDAP


    DNS is the namespace used in the Active Directory, and *Lightweight Directory
    Access Protocol* (LDAP) is how you access the Active Directory.


    To understand LDAP, you need a brief history lesson. The X.500 standard is a directory
    specification that introduced *Directory Access Protocol* (DAP) to read and modify
    the directory database. DAP is an extensible protocol in that it can handle directory
    requests and changes, as well as directory security. However, DAP places much
    of the processing burden on the client computers and is considered to be a high
    overhead protocol. LDAP, which is not defined within the X.500 specification,
    was developed to overcome the weaknesses of DAP. LDAP is an open standard, which
    means that it can be used by anyone wishing to develop


    a directory service and is not restricted to X.500 directories like DAP is. Another
    major difference is that LDAP is not a client-based service. The service runs
    on the server and the information is returned to the client. The Active Directory
    is not an X.500 directory, but it supports the information model without requiring
    systems to implement the X.500 overhead. The result is an LDAP-based directory
    that supports high levels of interoperability.


    LDAP is widely supported on the Internet. If you have participated in newsgroups
    or searched the World Wide Web with a search engine, you more than likely have
    used LDAP. This open standard is directly supported in the Active Directory so
    that users can find the resources they need.'
