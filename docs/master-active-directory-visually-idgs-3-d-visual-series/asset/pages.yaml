- pgno: 27
  md: '# ACTIVE DIRECTORY TECHNOLOGY


    If you have been in the computing and network environment at all during the past
    two years, you have heard a thing or two about the Active Directory. Some of what
    you have heard is probably true—a lot is probably not. This book can help you
    make sense of it all and master the Active Directory through a visual approach.
    But before you get into the details of installing and configuring the Active Directory,
    you need to know some conceptual information so that it all makes sense. Chapters
    1, 2, and 3 show you the conceptual and background information you need to know
    to implement, configure, and support the Active Directory.


    information about real network objects—such as users, shares, printers, applications,
    and so forth—so that users can find the resources they need. Through the Active
    Directory, users do not have to keep track of which server holds which resource,
    or where a particular printer resides. The Active Directory lists the information,
    is completely searchable, and provides users a standard folder interface so that
    they can find what they need on the network.


    # What is a directory?


    The term *directory* has received a lot of use (and abuse!) in computing environments
    in the last several years. As computing environments have become larger and more
    complex, the need to organize information so that network users can locate the
    information they need has become increasingly important. By definition, **a directory**
    is an information storage location that uses a systematic scheme, or **namespace**,
    to organize the information. A common example is the telephone book. All information
    in a telephone book is stored by city/region, last name, and then first name.
    By referencing a particular name in a particular city/region, you can find that
    person''s telephone number. The phone book uses a *namespace* in that all names
    are organized in alphabetical order using the last and first name. If the telephone
    book did not follow a *namespace*—in other words, if some names listed were by
    first name, some by last, some by nicknames, and some by address—you would never
    find what you needed.


    The Active Directory is also designed to provide a single point of administration
    for network administrators. Instead of having to manage multiple servers that
    hold multiple resources, the administrator can find all the directory information
    located in the Active Directory, and that information can be replicated to all
    Windows 2000 domain controllers. Resource access, security permissions, and user
    and group accounts are all centrally located in one place.


    # Understanding the features of the Active Directory


    The Active Directory contains many features and options, but you should understand
    the big picture and design goals first. The following list explains the major
    features and design goals of the Active Directory:


    +   * **Scalability:** The Active Directory is highly scalable, which means it
    can function in small networking environments or global corporations. The Active
    Directory supports multiple stores and can hold more than one million objects
    per store. A store is a major grouping of Active Directory objects—and the Active
    Directory even supports multiple stores.

    +   * **Extensibility:** The Active Directory is extensible, which means that
    you can customize it to meet the needs of an organization.


    # What is the Active Directory?


    The Active Directory is Microsoft''s answer to directory services. The Active
    Directory''s purpose is to organize'
