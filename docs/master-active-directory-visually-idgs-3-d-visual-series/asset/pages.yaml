- pgno: 118
  md: '# What is conflict detection?


    You can let DHCP check for an IP address conflict before leasing the IP address
    to the client. The DHCP server attempts to detect the IP addresses that are leased
    and whether the new lease will create a conflict with another client. Because
    some clients have static IP addresses or are not DHCP clients, this feature reduces
    the possibility of IP address conflicts. This action is useful, but you may experience
    slower lease times by allowing DHCP to detect address conflicts too many times
    before leasing the IP address.


    # What does the Bindings button do?


    If you click the Bindings button, you can adjust the LAN connection(s) that DHCP
    uses to communicate with network clients. This feature is useful if your server
    has more than one network interface card (NIC). The NIC, sometimes called a network
    adapter card, packages network data and sends it over the network cable. Each
    computer on a network contains a NIC.


    ![](img/763d5ae436311371600c0952a3da9094_118_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_118_1.png)


    +   4. Click the DNS tab.

    +   The DNS tab is the same as you have seen for scope properties.


    +   5. Click the appropriate check boxes to make changes, or simply accept the
    defaults.


    +   6. Click the Advanced tab.


    +   7. If desired, change the default location of the audit log file and database
    path.

    +   You can also change the server''s connection bindings by clicking Bindings.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# INTRODUCTION TO WINS


    In networks that use the NetBIOS naming method to communicate, WINS (Windows Internet
    Naming Service) is responsible for resolving NetBIOS computer names to IP addresses.
    NetBIOS enables you to assign up to 15 characters as “friendly” names, such as
    Workstation2 or wk2. In a TCP/IP network, these friendly names have to be resolved
    to IP addresses so that communication on the network can occur.


    In Windows 2000 networks, name resolution occurs through DNS, so WINS is provided
    in Windows 2000 for backward compatibility with previous Windows operating systems.
    In a network where all servers and client computers run Windows 2000, you do not
    need WINS. In most cases, however, networks contain a mix of operating systems,
    so WINS will continue to be a part of administrators’ lives for some time into
    the future.


    Who are WINS clients?


    The following operating systems can be WINS clients:


    +   - Windows 2000

    +   - Windows 9x

    +   - Windows NT 3.5 or later

    +   - Windows for Workgroups 3.11 running TCP/IP-32

    +   - Microsoft Network Client version 3.0 for MS-DOS with real-mode TCP/IP driver

    +   - LAN Manager 2.2c for MS-DOS


    How does WINS work?


    WINS clients register their NetBIOS names and IP addresses with a WINS server.
    The WINS server’s job is to maintain the database that maps the NetBIOS names
    to the IP addresses. When clients attempt to communicate with each other, the
    WINS server is queried for the name-to-IP address mapping.


    When a WINS client starts, it registers its name and IP address with a WINS server.
    When this information changes, such as a new DHCP lease, the client updates its
    name-to-IP address mapping with the WINS server. When a WINS client needs to contact
    another WINS client, the resolution request—instead of a broadcast message—is
    sent to the WINS server. The WINS server resolves the request and returns the
    IP address information to the client. The client can then use the IP address to
    communicate with other clients.


    WINS database records are temporary, so like DHCP, the WINS client has to renew
    its lease with the WINS server. When a client shuts down, it sends a name release
    to the WINS server so that the WINS server has the latest browse list.


    You can configure the DHCP server to send the WINS server’s IP address to the
    clients when an IP lease is made. This way, client computers do not have to use
    a broadcast message to discover the IP address of the WINS server (which reduces
    traffic on your network). You can learn more about DHCP in Chapter 4.'
  merge: -1
  img_proc: true
