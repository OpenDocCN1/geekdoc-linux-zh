- pgno: 301
  md: '# ## ACCESSING THE USERS AND COMPUTERS SNAP-IN


    All Active Directory configuration concerning users and computers is performed
    in the Active Directory Users and Computers MMC snap-in.


    This snap-in is one of the three main Active Directory MMC snap-ins that you use
    to configure and manage the Active Directory. From this interface,


    you can manage user, group, and computer accounts, and you can also manage some
    aspects of domain controllers that appear in the directory. All objects and OUs
    are configured with this snap-in.


    Within the Active Directory Users and Computers snap-in, the Action menu gives
    you a list of tasks you can accomplish for each object, OU, container, computer,
    and domain.


    Most of your everyday Active Directory tasks are performed with this snap-in,
    including the creation of your OU structure (see Chapter 10).


    ![](img/763d5ae436311371600c0952a3da9094_301_0.png)


    +   - Choose Start -> Programs -> Administrative Tools -> Active Directory Users
    and Computers.


    ![](img/763d5ae436311371600c0952a3da9094_301_1.png)


    +   - The console appears listing your domain and OUs.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# TIPS


    Is there another way to access the Active Directory Users and Computers snap-in?


    The Active Directory snap-ins appear in Administrative Tools, which you can access
    using the Start menu. You can also open Control Panel and open the Administrative
    Tools folder to access the snap-in. Finally, you can click Start>Run and then
    type MMC in the dialog box. An empty MMC opens. Click the Console menu, and then
    click Add/Remove Snap-in. Click Add on the screen that appears, and then select
    the Users and Computers snap-in from the list that appears.


    I need to create OUs for this domain. How can I do that?


    You can create OUs for your domain by using this snap-in. For specific instructions,
    see Chapter 17 and also review Chapter 10 to learn about developing an OU structure.


    ![](img/763d5ae436311371600c0952a3da9094_302_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_302_1.png)


    If you click one of the OUs in the left pane, the contents of the OU appear in
    the right pane.


    The Action menu presents you with configuration actions that you can take for
    each domain, OU, and object.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# CREATING A NEW USER ACCOUNT


    Domain users are created in the Active Directory of an Active Directory domain
    controller. Domain users are both created and managed by using the Active Directory
    Users and Computers MMC snap-in, which provides one simplified interface for managing
    users. If you are used to working with Windows NT, you have probably searched
    for User Manager for Domains, which is no


    longer a part of Windows 2000. All user accounts are configured for your Active
    Directory domains using this snap-in.


    Creating a user account is really no different in Windows 2000 than it has been
    in previous versions of Windows. You provide a username for a specified user and
    a default password. The New User window displays both the Active Directory


    username, such as **JWilliams@alpha.com** and the down-level name, or NetBIOS,
    name for earlier versions of Windows, such as JWilliams.


    After you determine a default password, you can choose whether the user must change
    the password at the next logon, whether the password expires, and so forth.


    ![](img/763d5ae436311371600c0952a3da9094_303_0.png)


    +   1.  Select the OU in which you want to create the User account and then choose
    *Action*→*New*→*User*.

    +   2.  Or you can simply click the **New User** icon to create a new user account.

    +   3.  Enter the user''s name and logon name.

    +       4.  Click *Next* to continue.

    +           *   The DNS representation of the Active Directory name and the down-level
    logon name are displayed.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# What logon convention should I use?


    Most network environments implement a standard logon naming convention, such as
    a first initial and last name (ksmith) or first name and last initial (karens).
    This is done for administrative purposes.


    # What password should I enter and what requirements should I use for the password?


    Normally, the administrator enters a standard password, such as the user’s logon
    name, and then requires the user to change the password at the next logon by checking
    the appropriate box. However, in certain cases, the administrator may want to
    assign a password and select the “User cannot change password” and “Password never
    expires” check box options.


    # What password parameters should be required?


    Users should be required to create passwords of minimum length of four or six
    characters provides higher security than shorter passwords. Also, users should
    not use the names of family members or common words for passwords. Finally, a
    password combination of letters and numbers is the most secure approach.




    ![](img/763d5ae436311371600c0952a3da9094_304_0.png)


    +   4. Enter and confirm the password.

    +   5. Select the appropriate password options for the user.


    +   6. Click Next to continue.


    ![](img/763d5ae436311371600c0952a3da9094_304_1.png)


    +   7. This window gives a summary of the new user you are creating.


    +   8. You can change the object characteristics you entered by clicking the Back
    button.

    +   9. Click Finish to create the new user.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# # CONFIGURING USER ACCOUNT PROPERTIES


    After you create a new user account, you can further define the user''s properties.
    As you create and configure user accounts, you will notice you have a lot of options
    available. Remember that the configuration options presented in the Properties
    pages are not specifically required for the user account to become active. In
    other words, all you have to do is create the account and assign a default password
    for the user to be able to log on.


    The General and Address tabs enable you to configure contact information for the
    user, such as the user''s phone numbers and address information. This information
    helps users locate and contact other users in the Active Directory. Some environments
    choose to provide complete information on these tabs and others only provide phone
    numbers. This is an administrative decision and not one that affects the functionality
    of the user''s account in the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_305_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_305_1.png)'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Some of your most important configuration options for user accounts appears
    on the Account tab. The account tab allows you to determine when the user can
    logon and to which computer the user can logon. Depending on the security structure
    of your environment, you may wish to restrict users'' logon hours. This action
    prevents users from gaining access to the network during certain times of the
    day (such as at night). This is a security feature for both your users and for
    persons you may try to gain access to the network with a valid user name and password.
    In a similar manner, you can restrict users to only certain computers. This action
    stops a user from gaining access to the network from any computer available. As
    with logon hours, this too is an effective security feature. With both of these
    options, it is important, however, that you are not so restrictive that you prevent
    users from accomplishing their jobs effectively.


    +   1. Click the Account tab.

    +   2. Click the desired check box to enforce additional logon restrictions.

    +   3. Use the calendar feature to select a month and day for the account to expire
    by clicking the appropriate date.

    +   4. Click the Logon Hours button to set logon hours.

    +   5. Click either the Logon Permitted or Logon Denied radio button to adjust
    the user''s logon hours.

    +   6. Click OK.


    ![](img/763d5ae436311371600c0952a3da9094_306_0.png)'
  merge: -1
  img_proc: true
- pgno: 307
  md: "# CONFIGURING USER ACCOUNT\nPROPERTIES CONTINUED\n\nA\nside from the importance\
    \ of\nthe Account tab configuration,\nyou also have the Profile tab\nwhere you\
