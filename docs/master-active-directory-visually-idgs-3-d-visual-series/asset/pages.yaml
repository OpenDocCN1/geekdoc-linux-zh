- pgno: 72
  md: "![](img/763d5ae436311371600c0952a3da9094_72_0.png)\n\n# How can I remove an\
    \ unneeded protocol?\n\nTo remove an unneeded protocol, simply select the protocol\
    \ in the Local Area Connection Properties dialog box and click the Remove button.\n\
    \n# Do all components have properties pages?\n\nNo. Some components, such as NetBEUI,\
