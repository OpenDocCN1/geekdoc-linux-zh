- pgno: 180
  md: '# **What are the available Logging Options?**


    Logging options allow you to track different kinds of data within DNS:


    +   - **Query**: Logs all queries received from clients

    +   - **Notify**: Logs all notification messages received from other DNS servers

    +   - **Update**: Logs all dynamic updates received

    +   - **Questions**: Logs the contents of the question part of each DNS query
    message

    +   - **Answers**: Logs the contents of the answer part of each DNS query message


    +   - **Send**: Logs the number of DNS query messages sent by the DNS service

    +   - **Receive**: Logs the number of DNS query messages received by the DNS service

    +   - **UDP**: Logs the number of DNS requests received on a UDP port

    +   - **TCP**: Logs the number of DNS requests received on a TCP port

    +   - **Full Packets**: Logs the number of full packets written and sent

    +   - **Write Through**: Logs the number of packets written through the DNS service
    and back to the zone


    ![](img/763d5ae436311371600c0952a3da9094_180_0.png)


