- pgno: 223
  md: '# CONFIGURING IP ROUTING CONTINUED


    On the Configuration tab, you can choose for the device to obtain an IP address
    from the DHCP server or you can specify a static IP address. Under many circumstances,
    you may prefer to use a static IP address for RAS IP Routing devices.


    The Multicast Boundaries tab enables you to define a multicast scope for multicasting
    communication. *Multicasting* is the process of sending messages or communication
    to a group, much like you would send a group e-mail message. You must have multicasting
    scopes configured in the properties of the IP Routing General icon in the RAS
    console for this action to be available.


    Finally, the Multicast Heartbeat tab enables you to enable multicast heartbeat
    detection. This feature listens for periodic multicast traffic to determine that
    multicasting is functioning properly on your network. The heartbeat detection
    determines this by an acceptable quiet time. If quiet time goes higher than the
    configured amount (default of ten minutes), an alert is sent to the administrator.


    ![](img/763d5ae436311371600c0952a3da9094_223_0.png)


    +   1. Click the Configuration tab.


    +   2. Click the appropriate radio button for the device to obtain an IP address
    for DHCP or specify one manually.


    +   3. Click the Advanced button.


    ![](img/763d5ae436311371600c0952a3da9094_223_1.png)


    +   4. Use the Add, Edit, or Remove buttons to manage the IP address(es) and default
    gateway(s) for the device.


    +   5. Click OK.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# TIPS


    # Should I allow my RAS devices to receive an IP address from DHCP?


    Under normal circumstances, the best advice is to use a static IP address for
    all server hardware because dynamic IP addresses can cause communication problems,
    especially in the case of a router. You can choose DHCP, but you may experience
    some communication problems.


    # Why is it called a multicast heartbeat?


    The heartbeat detection listens to multicast traffic on your network to determine
    if the traffic flow is normal. Much the same way that a doctor listens to a human
    heart for a pattern or rhythm, the multicast heartbeat listens to the traffic
    and sends an alert after an acceptable amount of quiet time has passed. A quiet
    time that is too long may indicate that multicast communication problems exist.


    ![](img/763d5ae436311371600c0952a3da9094_224_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_224_1.png)


    +   1.  Click the Multicast Boundaries tab.

    +   2.  Click the drop-down box to select a Multicast scope.

    +   3.  Click the Add button to define a multicast boundary.


    +   4.  Click this check box to activate the TTL boundary, and enter TTL values
    as desired.


    +   5.  Click the Multicast Heartbeat tab.

    +   6.  Click this check box to enable multicast heartbeat detection.


    +   7.  Adjust the quiet time if desired.

    +   8.  Click OK to save the changes.'
  merge: -1
  img_proc: true
