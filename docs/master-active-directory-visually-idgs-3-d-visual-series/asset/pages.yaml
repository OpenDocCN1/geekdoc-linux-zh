    +   2. Click Configure to configure your modem or ISDN hardware.

    +   3. Click this drop-down box to adjust the modem''s maximum speed as needed.

    +   4. Click the appropriate check boxes to enable hardware features.

    +   5. These features are normally selected by default.

    +   6. Click this check box to show a terminal window.

    +   7. Click this check box to enable the modem speaker.'
