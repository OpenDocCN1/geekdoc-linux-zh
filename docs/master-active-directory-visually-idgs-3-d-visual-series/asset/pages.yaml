- pgno: 356
  md: "# To how many groups should a domain controller belong?\n\nYou can allow the\
    \ domain controller to be a member of any group you choose. However, for administrative\
    \ purposes, you should limit group membership to those that are necessary. Excessive\
    \ group memberships may cause permission problems. See Chapter 14 for more information\
    \ about group accounts.\n\n# If I use the Remove button to take a group membership\
    \ away from a server, will this affect the other groups?\n\nNo. Each group functions\
    \ on its own, so you can add and remove group membership for the server without\
    \ affecting other groups. The server should, however, remain in any default groups\
    \ configured by Windows 2000 (such as the Domain Controllers group). Keep in mind\
    \ that computer group membership functions in much the same way as user group\
    \ membership. The purpose is to organize computer accounts so they can access\
    \ desired resources and have rights applied for the desired groups.\n\n![](img/763d5ae436311371600c0952a3da9094_356_0.png)\n\
    \n![](img/763d5ae436311371600c0952a3da9094_356_1.png)\n\n+   6 Select the group\
    \ you want to add the server to.\n\n+   7 Click Add.\n\n+   8 Repeat Steps 6 and\
    \ 7 to add the server to more groups.\n\n+   9 Click OK when you are done.\n\n\
    +   10 Click the Location tab.\n+   \n+   - This tab tells you which locations\
    \ are served by the site in the directory.\n\n+   11 Click Browse to choose a\
    \ different location."
  merge: -1
  img_proc: true
- pgno: 357
  md: '# # MANAGING DOMAIN CONTROLLERS CONTINUED


    On the Managed By tab, you can assign a manager for the domain controller. After
    you configure a manager for the domain controller, the manager''s name and contact
    information is taken from the Active Directory and automatically entered on the
    Managed By tab. This feature enables you to easily see who manages various domain
    controllers and how to contact the manager. Of course, this information is not
    required on this tab and does not appear if the contact information is not configured
    in the manager''s Active Directory user account.


    You can also see more information about the manager by clicking the View button.
    This action opens the properties sheet for the user or group from the Active Directory
    who manages the domain controller. If no additional information is configured
    in the manager''s user account, then it will be not be viewable.


    ![](img/763d5ae436311371600c0952a3da9094_357_0.png)


    +   12. Click the Managed By tab.

    +   13. To add a manager for the server, click Change.

    +   14. Select the user account or group account you want to designate as the
    manager.

    +   15. Click OK.'
