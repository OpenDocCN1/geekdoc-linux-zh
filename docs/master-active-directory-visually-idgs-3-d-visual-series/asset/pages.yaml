- pgno: 178
  md: '# TIPS


    # Which name checking option should I use?


    The three name checking options are provided so you can control the DNS naming
    schemes in your network. For example, you can provide a loose structure so that
    all names are checked by your DNS server, or you can tightly restrict the name
    so that only strict RFC naming can be used. The other options fall in-between
    these two extremes. The default option is Multibyte.


    # How should I load zone data?


    For Active Directory integrated DNS servers (on an Active Directory network),
    the load zone data should come from the Active Directory and Registry option.
    This ensures that your server DNS files are integrated with the Active Directory
    and other DNS servers on your network.


    ![](img/763d5ae436311371600c0952a3da9094_178_0.png)


