- pgno: 437
  md: '# CHAPTER 24  ACTIVE DIRECTORY SECURITY MANAGEMENT


    # # SETTING UP OU SECURITY *CONTINUED*


    For each Active Directory OU, you can also assign advanced permissions. You can
    access the advanced permissions by clicking the Advanced button on the Security
    tab of the object''s properties sheets.


    The Advanced options enable you to define the permissions that a user or group
    has for a particular object and that object''s properties. The options presented
    are more detailed than the general security options and allow you finer control
    over the OU.


    Generally, you do not need to define advanced security permissions for all OUs.
    The standard set of permissions available on the Security tab is usually enough
    to define all the security needs you may have. However, with certain OUs, you
    may wish to define advanced features so that even if a group has Full Control
    permission, you can still deny some permissions through advanced features.


