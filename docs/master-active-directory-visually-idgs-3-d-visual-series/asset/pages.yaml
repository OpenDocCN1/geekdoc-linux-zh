- pgno: 112
  md: '# **What is the RRAS user class?**


    The RRAS user class defines addressing information for users who remotely dial
    into the network using remote access.


    DHCP can provide dial-in clients with an IP address and other addressing information
    just as those clients who are physically connected to the network.


    ![](img/763d5ae436311371600c0952a3da9094_112_0.png)


    +   1. **Choose Action** → **Define User Classes**.

    +   2. **Select the class that you** want to add from the list.

    +   3. **Click Add**.


    ![](img/763d5ae436311371600c0952a3da9094_112_1.png)


    # **TIPS**


    **Does the statistics dialog box tell me how many IP addresses are currently available
    for lease?**


    **Yes**. Scroll to the bottom of the window and you can see an “Available” category.
    In the category, you see the actual number of available IP addresses that can
    be leased and a percentage of the addresses that are available for the scope.
    You can use this information to see how many IP addresses are available on an
    average basis. A low availability may indicate that your scope is too small (not
    enough IP addresses for lease) and may need to be expanded.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# MANAGING DHCP SERVERS CONTINUED


    You can define both user and vendor classes for the DHCP server by choosing those
    options in the Action menu.


    When you choose to add either a user class or vendor class, you need to enter
    the class name, description, and ID information as needed for that class. You
    can review the Microsoft documentation on your


    Windows 2000 Server CD-ROM for more detailed information about adding and using
    additional vendor classes. The default options are normally all you need, so you
    should carefully evaluate the addition of user or vendor classes to make certain
    the additions will benefit the DHCP functionality on your network. Keep in mind
    that DHCP automatically configures the


    needed options for Microsoft networking and Microsoft clients, so the addition
    of vendor and user classes is only necessary for unique networking situations.


    You can also use the Action menu to set the predefined options, which are automatically
    configured by the DHCP service.


    ![](img/763d5ae436311371600c0952a3da9094_113_0.png)


    +   4. Enter the display name and description, as well as ID information for the
    new class.

    +   5. Click OK.


    ![](img/763d5ae436311371600c0952a3da9094_113_1.png)


    # DEFINING A NEW VENDOR CLASS


    +   1. Choose Action-> Define Vendor Classes.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# **Do I need to define additional user and vendor classes?**


    Typically, you do not need to define additional user and vendor classes. However,
    depending on the configuration of your network and your needs, you may find some
    of these user and vendor classes particularly helpful to service the needs of
    certain clients. You should carefully consider your need for these classes, however,
    and make certain the service they provide will be beneficial. The necessary options
    for Microsoft clients are automatically configured by DHCP, so in typical Microsoft
    networks, you do not have to worry about configuring additional user and vendor
    classes.


    # **What are predefined options?**


    Predefined options are the user and vendor class options that are automatically
    configured. You can change these options by adding new ones, deleting existing
    options, or editing existing options. In general, this is not an action you need
    to perform for most implementations of DHCP.


    ![](img/763d5ae436311371600c0952a3da9094_114_0.png)


    **2** Select the vendor class you want to add.


    **3** Click **Add**.


    ![](img/763d5ae436311371600c0952a3da9094_114_1.png)


    # SETTING PREDEFINED OPTIONS


    **1** Choose **Action->Set Predefined Options**.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# MANAGING DHCP SERVERS CONTINUED


    The Set Predefined Options command on the Action menu enables you to adjust the
    settings for the options that are defined by default in DHCP.


    You can add, edit, or delete a class option as needed. You should consider carefully
    the need and result of making changes to the default class options. Generally,
    the


    default options are all you need and are configured appropriately. If you have
    specific reasons to make changes to the default options, consult the documentation
    on the Windows 2000 Server CD-ROM before proceeding.


    You can also use the All Tasks feature to start, stop, or restart the


    DHCP service on a particular server. This feature enables you to easily manage
    the server service on all your DHCP servers from one central location. Keep in
    mind that any time you stop the DHCP service, the DHCP server cannot lease IP
    addresses to clients.


