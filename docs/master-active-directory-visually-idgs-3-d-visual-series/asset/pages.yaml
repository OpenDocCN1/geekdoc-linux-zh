- pgno: 308
  md: '# TIPS


    # Should users be restricted to certain workstations?


    +   Depending on the design and security needs of your organization, you may want
    to restrict users so that they can log on only to certain workstations. This is
    a security feature that may or may not be needed in your environment. For example,
    you may need to restrict certain users to certain computers within a certain part
    of building. The workstation restriction feature prevents users from logging on
    to the network anywhere in the office.


    # How can I use the Comments box on the Telephone/Notes tab


    +   You can use the Comments box to point out useful contact information about
    the user. For example, if Sally works from home every Tuesday and Thursday, you
    can place a note in the Comments box instructing users to contact Sally at her
    home number on those days.


    # How can I enter the name of the user''s manager?


    +   The user''s manager has to have a user account in the Active Directory to
    be listed on the Organization page. Click the Change button, which opens the Active
    Directory, and select the manager''s user account.


    ![](img/763d5ae436311371600c0952a3da9094_308_0.png)


    +   **17** Click the Telephones tab.

    +   **18** Enter additional contact information for the user as needed.

    +   **19** You can click the Other buttons to add more numbers.

    +   **20** Use the Comments section to point out specific contact information
    concerning the user.


    ![](img/763d5ae436311371600c0952a3da9094_308_1.png)


    +   **20** Click the Organization tab.

    +   **21** Enter organizational information about the user as well as the user''s
    manager and other individuals who report to the user.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# CONFIGURING USER ACCOUNT

    PROPERTIES *CONTINUED*


    Finally, you also see a Member Of tab and a Dial-in tab. The Member Of tab allows
    you to add or remove groups to which the user account belongs. This tab enables
    you to easily configure group membership for user accounts.


    The Dial-in tab allows you to grant or deny dial-in access to network clients.
    For clients using Remote Access to gain access to the network from a remote computer,
    you can either allow or deny access and configure callback options. As in Windows
    NT, each user must be allowed to gain dial-in access on this tab. In other words,
    no user has automatic rights for dial-in.


    Depending on your server configuration and the services available on your network,
    other tabs (such as those for Terminal Services) may appear as well. Although
    these services are not a part of the Active Directory, they still appear as a
    configuration option on the user''s account properties pages.


    ![](img/763d5ae436311371600c0952a3da9094_309_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_309_1.png)


    **22** Click the Member Of tab.


    **23** Click Add to add the user to other groups.


    **24** The Select Groups dialog box appears.

    **24** Select the group you want to add the user to.


    **25** Click Add.

    *The group you chose is displayed in this box.*

    **25** Click OK to return to the Member Of tab.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '![](img/763d5ae436311371600c0952a3da9094_310_0.png)


    # Should I add every user to groups?


    Groups are designed to organize users and reduce administrative overhead. You
    can use groups to configure permissions that give the group members access rights
    to certain resources. This design enables you to configure the permissions one
    time for the group instead of on an individual basis.


    # What is the difference between dial-in and Virtual Private Network (VPN)?


    Dial-in allows a client to dial in to a RAS server and gain access to network
    resources from a remote location. VPN also allows clients to dial in, but with
    a VPN, packets are encapsulated and routed over a public network, such as the
    Internet. Depending on the security configuration of Windows 2000 Server, the
    VPN can also provide encryption of data.


    ![](img/763d5ae436311371600c0952a3da9094_310_1.png)


    The new group appears in the list.


    +   27 Click **Add** if you want to assign the user to more groups.


    +   28 Click the **Dial-in** tab.


    +   29 Click the **appropriate radio button** to allow or deny dial-in access.


    Depending on your routing and remote access configuration, you can assign a callback
    feature and provide a static IP address and route for the user when dialing in.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# MANAGING A USER''S ACCOUNT


    aside from configuring an account''s properties, you can also manage each account
    by using the Action menu.


    First, you can easily disable the account by selecting Disable Account. When you
    perform this action, a red X appears over the account''s icon. In the same manner,
    you can enable an account that has


    been disabled. You can also reset the password, move the account, open the home
    page, or send an e-mail message to the user if these options are configured in
    the user''s properties.


    If you click All Tasks, you see a repeat of the same tasks that appear at the
    top of the window. You have


    the options to delete, rename, or refresh the account as well.


    Windows 2000 provides the All Tasks option, which you can also see by right-clicking
    the User Accounts icon, so you can configure these options either through the
    Action menu or by using a simple right-click.


    ![](img/763d5ae436311371600c0952a3da9094_311_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_311_1.png)


    Select the user account in the console and click the Action menu.


    The All Tasks option contains the same actions you can perform from the Action
    menu or by right-clicking the User Accounts icon.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# TIPS


    # Why would I need to disable an account?


    You can easily disable an account by choosing Disable Account from the Action
    menu. You may want to perform this action for a variety of reasons. For example,
    if a company employee takes a leave of absence, you may want to disable the employee''s
    account until he or she returns. This action increases network security.


    # What happens if I click Send Mail?


    You can send a user an e-mail by clicking Send Mail. When you do this, the user''s
    e-mail account is read from the user''s properties and your default mail client
    opens with a new mail message directed to the user. You can then type your message
    and send it to the user.


    # If I rename an account, is the logon name changed as well?


    No. If you rename an account, you are simply renaming the object in the Active
    Directory. This action does not alter the user''s logon name or other information
    in the user''s properties.


    ![](img/763d5ae436311371600c0952a3da9094_312_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_312_1.png)


    +   1. If you choose Action > Move, this screen appears.

    +   2. You can expand the directory folders to select where you want to move the
    account.


    +   3. Click OK.


    +   4. If you choose Action > Reset Password, this dialog box appears prompting
    you to enter a new password.


    +   5. Click this checkbox to make the user change his password at the next logon.

    +   6. Click OK to apply the changes.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# CHAPTER 14 CREATING AND MANAGING USER ACCOUNTS


    # DELEGATING CONTROL OF A USER ACCOUNT OU


    You can easily delegate control of user accounts or groups by selecting the OU
    that holds the user accounts. You cannot delegate control of an individual user
    account or group account, and when you delegate control of an OU, the delegate
    is given administrative rights to manage the accounts in that OU.


    When you perform this action, you allow another user or a group of users to control
    certain user accounts or other groups. Depending on the design of your organization,
    this may be an effective solution to reducing overhead for senior administrators.


    Delegation is a powerful tool that allows you to assign certain administrative
    tasks to other users you select. For example, you can allow a certain employee
    to create user accounts, but not configure or delete them. Using this tool, you
    can tailor your administrative needs to reduce administrative overhead while still
    maintaining the security of your network and your administrative control.


    ![](img/763d5ae436311371600c0952a3da9094_313_0.png)


    Select the OU you want to delegate and choose Action>Delegate Control.


    ![](img/763d5ae436311371600c0952a3da9094_313_1.png)


    The Delegation of Control Wizard begins.


    Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Should I delegate control to several groups or users?


    This is normally not a good idea. Only a select few should have delegation control
    so that only those few can make administrative changes to the delegated folder.


    # When I delegate control, do I have to give the delegatee full control over the
    OU?


    No. Delegation is a powerful tool in Windows 2000 because you can give other users
    or groups administrative permissions, but you do not have to “turn over” all the
    rights and permissions. As a network administrator, you can delegate some permissions
    while denying others. For example, you could allow a delegate to create user accounts,
    but not reset passwords. By using the delegation wizard, you can finely control
    what your delegates can do.


    ![](img/763d5ae436311371600c0952a3da9094_314_0.png)


    +   3. Click Add to select the users or groups you want to delegate to.


    ![](img/763d5ae436311371600c0952a3da9094_314_1.png)


    +   4. Select the users or groups.

    +   5. Click Add.

    +   6. Click OK.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# # DELEGATING CONTROL OF A USER ACCOUNT OU _CONTINUED_


    When you delegate control, you can choose to delegate either predefined tasks
    or a custom task. From the predefined tasks, you can select the check boxes you
    want to delegate control. The predefined options include typical tasks, such as
    creating, deleting, and managing user accounts.


    Make selections that give the delegate the power he or she needs to perform the
    task you assign. However, do not give a delegate more power than needed. For example,
    if you do not want the delegate to manage group membership, do not assign that
    permission.


    You can define standard permissions, such as full control, read, write, and so
    on. But, you can also finely control what the delegate can do, such as manage
    child objects, delete child objects, and so on. Delegation is another example
    of how the Active Directory enables you to fine-tune your configuration to meet
    the needs of your network.


    ![](img/763d5ae436311371600c0952a3da9094_315_0.png)


    +   - **6** Your selections appear in the window.

    +   - **7** Click Next to continue.


    ![](img/763d5ae436311371600c0952a3da9094_315_1.png)


    +   - **8** Specify the scope of the task you want to delegate by clicking the
    appropriate radio button.

    +   - **9** If you choose to restrict control, click the appropriate check boxes
    to determine which objects in the folder the delegate can control.

    +   - **10** Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# **Which predefined delegations should I use?**


    Generally, you want to be somewhat restrictive. In other words, do not give the
    delegation user or group the right to reset a user''s password unless you explicitly
    want this done. Allow enough control to accomplish the tasks, but do not give
    more control than necessary.


    # **What if I want to delegate control only on certain objects in the Active Directory?**


    You can click the Custom button and then select Objects in Folder to delegate
    control of certain objects. This feature enables you to finely control what tasks
    a delegate can perform.


    ![](img/763d5ae436311371600c0952a3da9094_316_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_316_1.png)


    **11**  Select the type of permissions you want to display by clicking either
    the appropriate check box(es).


    — The selected Permissions appear in this window.


    **12**  Select the desired permissions for the delegate by clicking the appropriate
    check boxes.


    **13**  Click **Next** to continue.


    **14**  The final wizard screen shows a summary of the options you selected.


    — Click **Back** if you want to return to a previous step and change your answers.


    **15**  Click **Finish** to complete the wizard.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# WHAT NETWORK USERS CAN VIEW


    Because user account information is stored in the Active Directory, you may wonder
    what information network users can view in Active Directory. After all, you do
    not want network users to be able to see confidential information about other
    users.


    Network users can use the Active Directory to view basic contact information about
    other users. This information includes the user''s name, phone numbers, e-mail
    address, and postal addresses. The Active Directory users can also find another
    user''s manager or the names


    of people who report to that user. This feature allows a user to search for a
    particular person and find that person''s contact information and general information
    about his or her job. This information allows a user to search for another user
    by e-mail address or first or last name.


    ![](img/763d5ae436311371600c0952a3da9094_317_0.png)


    +   1. Active Directory users can access the directory by first opening My Network
    Places and then double-clicking Entire Network.


    +   2. Double-click Directory and double-click the domain name.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# What if I do not want certain user information to appear in the directory?


    If you do not want user certain information about the user to appear in the directory,
    such as a user''s telephone number, simply do not include that information in
    the user''s account properties. Remember that aside from management, the purpose
    of the Active Directory is to provide network users a way to find the resources
    they need. If you do not want some information to appear, simply leave those fields
    blank when you configure the account.


    # What is the best way to find an Active Directory user? I only know the first
    name.


    The easiest way to find an Active Directory user is to perform an LDAP search
    using the Windows search feature. Simply type the first name of the user and the
    search function returns all users from the Active Directory with that first name.
    You can then find the user you desire to contact. The LDAP search feature is a
    great improvement in Windows 2000 compared to previous versions of Windows that
    required browsing the network to find what you need.


    ![](img/763d5ae436311371600c0952a3da9094_318_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_318_1.png)'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# # VIEWING AND CREATING WINDOWS 2000 GROUP ACCOUNTS


    Group accounts are used to organize users so that permissions can be assigned
    with less administrative overhead. By adding users to groups, you can configure
    group settings instead of managing user permissions on an individual basis. In
    Windows 2000, you create and manage groups in the Active Directory Users and Computers
    MMC snap-in.


    Windows 2000 includes a number of built-in groups, and you can create your own
    as well. If you click the built-in container in the left console pane, the built-in
    groups appear in the right console pane. Built-in groups include Account Operators,
    Administrators, Backup Operators, Guests, Print Operators, Replicator, Server
    Operators, and Users. You can also click the Users container in the left console
    pane to see


    additional domain local and global groups that are built in. Beside each group
    in the details pane, you can see a description of the group and which users should
    belong to each group.


    You can also create your own groups, in addition to the built-in groups, to meet
    the needs of your organization. Table 15-1 describes some of the most important
    groups in Windows 2000.


    ![](img/763d5ae436311371600c0952a3da9094_319_0.png)


    +   1  Select Built-in to view the built-in groups and descriptions.


    ![](img/763d5ae436311371600c0952a3da9094_319_1.png)


    +   2  Select Users to view the domain’s local and global groups.'
  merge: -1
  img_proc: true
- pgno: 320
  md: "# **Table 15-1: Group Scopes in Windows 2000**\n\n| Scope | Description |\n\
    | :--- | :--- |\n| Global Groups | Global groups are organizational units that\
    \ allow users to access resources. Global group members come from one domain,\
    \ but can access resources in any domain. |\n| Local Groups | Local groups are\
    \ used to assign permissions for a local resource. Group members can come from\
    \ any domain, but members can access only resources in the local domain. Global\
    \ groups are assigned to local groups. |\n| Universal Groups | Universal groups\
    \ can come from any domain and access resources in any domain. Universal groups\
    \ are only available in domain native mode, not mixed mode. |\n\n![](img/763d5ae436311371600c0952a3da9094_320_0.png)\n\
    \n+   **CREATING A NEW GROUP**\n+   \n+   1. Select the Users container (or whichever\
    \ OU you wish to store the new group in).\n+   2. Choose Action\\> New\\> Group.\n\
    +   3. Enter the name of the group.\n+   4. Click the appropriate radio button\
    \ to select the group scope.\n+   5. Click the appropriate radio button to select\
    \ group type.\n+   6. Click OK."
  merge: -1
  img_proc: true
- pgno: 321
  md: "# CONFIGURING GROUP PROPERTIES\n\nYou can change the configuration for any\
    \ group (including built-in groups) by accessing the group objects properties.\n\
    \nThe General tab contains the name and description of the group, as well\n\n\
    as the e-mail address for the group. You can use the group's e-mail address to\
    \ send an e-mail message to every member of the group. The group type and group\
    \ scope you selected when creating the group also appears. You can change the\
    \ group type or scope if needed.\n\nThe Members tab lists the users that are members\
    \ of that particular group. You can add or remove members from the group as needed.\
    \ Because group membership can change frequently, this tab offers you an easy\
    \ way to manage group membership.\n\n![](img/763d5ae436311371600c0952a3da9094_321_0.png)\n\
    \n+   1. From the console, select the group you want to administer.\n+   2. Choose\
    \ Action>Properties.\n\n+   3. You can alter the group's description, e-mail address,\
    \ group name, group type, or scope as needed.\n\n+   4. Click the Members tab.\n\
    +   \t* You can use the Members tab to add or remove users, groups, or computers\
    \ to or from the group.\n\n+   5. To add users, groups, or computers, click Add."
  merge: -1
  img_proc: true
- pgno: 322
  md: '# **Tips**


    # ### Should I give a group membership to another group?


    +   ✓ **Yes.** You can add groups to a group just as you can add computers or
    users. This process, called *nesting*, essentially gives the members of one group
    an additional group membership by including that group within a group. For example,
    you could have a group called Marketing and another group called Publicity. You
    could give the Marketing group membership in the Publicity group, which basically
    gives all the Marketing group members permission rights that exist in the Publicity
    group. Nesting is a quick management tool, but you should be careful—multiple
    groups within multiple groups often create permission conflicts and problems,
    and those problems are usually difficult to troubleshoot.


    # ### Can I put a local group inside a global group?


    +   ✓ **No.** Just as in Windows NT, local groups define access to resources—global
    groups go into local groups so that global groups can access those local resources.


    ![](img/763d5ae436311371600c0952a3da9094_322_0.png)


    +   6. Select the user, group, or computer you want to add.

    +   7. Click **Add**.

    +   8. Repeat Steps 6 and 7 to add additional users, groups, or computers as needed.

    +   9. Click **OK** when you are done.


    The object(s) you added to the group now appear in the Members list.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# # CONFIGURING GROUP PROPERTIES

    ## CONTINUED


    The Member Of tab enables you to add a group to other existing groups. For example,
    you could add the Accounting group to the Administrators group. As you can imagine,
    this feature takes careful thought and planning so that excessive permissions
    are not given to users who do not need them. One of your best actions as an Active
    Directory administrator is to first organize your group structure on paper before
    every implementing that structure in the Active Directory.


    The Managed By tab lists the name and contact information for the person that
    manages the group. You can change this information by clicking the Change button
    and selecting a new manager from the Active Directory. The address and phone information
    are automatically filled in according to the user''s properties. You can also
    click the View button to find more information about the manager (such as additional
    phone numbers) contained in the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_323_0.png)


    +   *   Click The Member Of tab.

    +   *   Click Add to add the group to other groups.

    +   *   Click the Managed By tab.

    +   *   Here you can view information about the group manager or change information
    if necessary.

    +   *   Click View to see additional information about the manager that is contained
    in the Active Directory.'
  merge: -1
  img_proc: true
- pgno: 324
  md: "# TIPS\n\n**Who should be given group management?**\n\n✍️ Depending on the\
    \ design of your organization, you can assign “regular” users to manage a group.\
    \ Obviously, that user has to be trustworthy and contain strong computer and management\
    \ skills. A good idea is to allow someone within the group to manage the group.\
    \ This way, the manager is also a user and can understand any problems or concerns\
    \ that may arise with members of the group.\n\n**Can someone who does not have\
    \ a user account in the Active Directory manage a group?**\n\n✍️ No. Windows 2000\
    \ security requires that a group manager have a valid user account in the Active\
    \ Directory. If a manager could be a person who gains access to the network without\
    \ a valid username and password, this would obviously be a serious security breach.\n\
    \n![](img/763d5ae436311371600c0952a3da9094_324_0.png)\n\n![](img/763d5ae436311371600c0952a3da9094_324_1.png)\n\
    \nThe manager's properties appear. You can use this sheet to edit the manager's\
    \ properties.\n\nIf you click **Change** on the **Account Properties** Managed\
    \ By tab, you can select a new manager from the Active Directory.\n\n+   15 Click\
    \ **OK**.  \n+   16 Click **OK** to exit the Accounting Properties sheet.\n\n\
    +   14 Click the person or group you want to manage the group."
  merge: -1
  img_proc: true
- pgno: 325
  md: "# MOVING GROUPS OR SENDING  \nGROUP E-MAIL\n\nThe Active Directory enables\
    \ you to move a group object to another location within the Active Directory.\
    \ This feature is useful because the organization of a business or company does\
    \ not remain static. As the organization changes and the structure changes, your\
    \ groups can be moved to different\n\nOUs so that the Active Directory maintains\
    \ the same organizational structure of your business. When you choose to move\
    \ a group to a different OU, the group membership is not affected by the move.\n\
    \nYou can also use group accounts to send group e-mail. This feature is\n\nparticularly\
    \ useful for departments that need to receive blanket notices or instructions.\
    \ For example, if you need to send an e-mail to each employee in the Accounting\
    \ group, you can send a single group e-mail instead of individually e-mailing\
    \ each employee.\n\n![](img/763d5ae436311371600c0952a3da9094_325_0.png)\n\n![](img/763d5ae436311371600c0952a3da9094_325_1.png)\n\
    \n+   1. Select the group you want to move and choose Action  \n+   Move.\n\n\
    +   2. Expand the directory tree and select which OU you want to move the group\
    \ to.\n\n+   3. Click OK."
  merge: -1
  img_proc: true
- pgno: 326
  md: '# TIPS


    # Must each group have an e-mail address?


    As with each user account, you can decide what information you want to configure
    for the Active Directory. If you do not want the group to have an e-mail address,
    simply do not enter one on the group’s properties sheets. Then, users cannot send
    e-mail to the group as a whole. The advantage, of course, in using a group e-mail
    address is the ease of sending mail to the group.


    # How often can I move groups?


    You can move a group as often as necessary. In order to avoid this management
    task, however, be careful to create an OU structure that remains as static as
    possible. Highly defined OU structures introduce more management tasks, which
    can be avoided by creating a more static OU structure. Some organizations even
    choose to have a users and groups OU so that all user and group accounts are always
    contained in one location.


    ![](img/763d5ae436311371600c0952a3da9094_326_0.png)


    # SENDING GROUP E-MAIL


    +   1 Select the group you want to send e-mail to and choose Action>Send Mail.


    ![](img/763d5ae436311371600c0952a3da9094_326_1.png)


    +   1 The e-mail address for the group is taken from the Active Directory and
    used to address an e-mail message from your default e-mail client.


    +   2 Type a message and send it to the group.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# WHAT CAN NETWORK USERS VIEW?


    As with other Active Directory objects, Active Directory users can view information
    about groups by browsing for the desired group or performing an LDAP search to
    locate the group object.


    A first question is usually, “Can users see who belongs to each group?” The answer
    is yes. The names of the members of that group are available for Active Directory
    users to see, and the names can be very helpful if an Active Directory user needs
    to contact a member of a group. For example, an Active Directory user needs to
    contact a manager in the Marketing department. The user knows that the management
    group exists but does not have any information about the manager’s name or e-mail
    address. The user can find the management group and browse the users that belong
    to the group so that he or she can find the information needed to contact a manager.


    ![](img/763d5ae436311371600c0952a3da9094_327_0.png)


    +   ☒ A user can view group information by double-clicking My Network Places and
    then double-clicking Entire Network.


    ![](img/763d5ae436311371600c0952a3da9094_327_1.png)


    +   ☒ Double-click Directory, double-click the domain icon, and then double-click
    Users (or the OU in which the groups are stored).'
  merge: -1
  img_proc: true
- pgno: 328
  md: '![](img/763d5ae436311371600c0952a3da9094_328_0.png)


    **Can Active Directory users make changes to group membership?**


    No. You must have appropriate permissions to be able to change group membership.
    The interface provided for users allows them only to view the group members—they
    cannot access properties sheets for the group object or use the Add button without
    appropriate permissions.


    **Besides browsing the directory, is there another way to find a group?**


    Yes. As with any Active Directory object, you can perform an LDAP search. For
    example, if you wanted to find the Management group, you can access a search window
    and run a search for Management. The Active Directory returns the matches, and
    then you can access the members list of the Management group.


    ![](img/763d5ae436311371600c0952a3da9094_328_1.png)


    2 Double-click the group icon that you want to view.


    ![](img/763d5ae436311371600c0952a3da9094_328_2.png)


    ■ The group members and a description of the group appear.'
  merge: -1
  img_proc: true
- pgno: 329
  md: "# CREATING A NEW COMPUTER ACCOUNT\n\nJust as a domain user has a user account\
    \ that represents that person, a computer account represents an actual computer\
    \ on the network. Each Windows 2000 and Windows NT computer in a Windows 2000\
    \ network has a computer account in the Active Directory. Windows 9x computers\
    \ do not have the security features of Windows 2000 and Windows NT,\n\nand therefore\
    \ do not have computer accounts, but they can still log on to the domain and access\
    \ resources.\n\nYou can also manually add a computer account to the Active Directory,\
    \ and the process for adding a computer account is very similar to adding a user\
    \ or group. By adding computer accounts to the Active Directory, you can identify\n\
    \ncomputers on the network that do not automatically have a computer account configured\
    \ for them (Windows 2000 and Windows NT). Windows 2000 and Windows NT computers\
    \ must have computer accounts in the Active Directory in order for them to actively\
    \ participate in the domain.\n\n![](img/763d5ae436311371600c0952a3da9094_329_0.png)\n\
    \n+   1 Select the Computers OU (or another OU in which you want to store the\
    \ computer account).\n+   \n+   2 Choose Action->New->Computer.\n+   \n+   3 Type\
    \ the name of the computer.\n+   \n+   4 Click Change if you want to change the\
    \ group that can join the computer to the domain."
  merge: -1
  img_proc: true
- pgno: 330
  md: '# **TIPS**


    # How can I use computer accounts?


    ✔ Just as you can organize users into a group to assign permissions, you can organize
    physical computers into groups to assign permissions. For example, if you want
    only a particular set of computers to use a certain printer, you can assign permissions
    for that group of computers. This way, no matter what user is logged on to the
    computer, that user can access the printer for that group.


    # How can I create a computer account for a **Windows 98** computer?


    ✔ Only Windows 2000 and Windows NT computers can have accounts in the Active Directory.
    This is due to the lack of advanced security features in the Windows 9x generation.
    Windows 9x computers can, however, log on to a Windows 2000 server and participate
    on the network.


    # Can previous versions of **Windows** use a computer account I create?


    ✔ Yes. When you create the computer account, click the Allow Pre-Windows 2000
    Computers To Use This Account check box to enable this feature.


    ![](img/763d5ae436311371600c0952a3da9094_330_0.png)


    +   **5** Select the desired group or user.


    +   **6** Click OK.


    +   **7** Click OK to close the New Object - Computer window.


    ![](img/763d5ae436311371600c0952a3da9094_330_1.png)


    +   **8** The new computer account appears in the details pane.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# CONFIGURING COMPUTER ACCOUNT PROPERTIES


    Just like users and groups, computer accounts have Properties sheets. You can
    configure computer accounts by accessing the properties sheet. To access the properties
    sheet, select the computer account, access the Action menu, and click Properties.


    Configuring computer accounts is rather easy. Of particular interest on


    the General tab, you can choose to click the Trust Computer For Delegation check
    box. Just as you can delegate duties to user accounts, you can also delegate duties
    to computer accounts. This feature does require careful consideration so that
    you do not create security breaches with computers operated by nonadministrative
    personnel.


    The Operating System tab simply displays OS version and service pack information
    about the computer, and as with other properties sheets, the Member Of tab allows
    you to configure the computer account''s group memberships.


    ![](img/763d5ae436311371600c0952a3da9094_331_0.png)


    +   1. To access the properties sheet, select the computer you want to administer.


    +   2. Choose Action→ Properties.


    +   3. Type a description in this box if desired.


    +   4. Click this check box if you want the computer to be trusted for delegation.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '![](img/763d5ae436311371600c0952a3da9094_332_0.png)


    # To how many groups should a computer belong?


    In order to manage access permissions and keep your network organization from
    becoming confusing, assign computers only to groups that they absolutely need
    to belong. Also, remember that after a user logs on to that computer, the user
    effectively has membership to the groups that the computer is assigned. As with
    group accounts for users, planning is of utmost importance.


    ![](img/763d5ae436311371600c0952a3da9094_332_1.png)


    # What is the down-level name?


    In Windows 2000, all earlier versions of Windows, such as NT and 9x, are called
    *down-level computers*. Down-level computers used NetBIOS to establish a friendly
    name, such as Server12. In Windows 2000, DNS is used for name resolution, so in
    mixed environments, both the DNS and the NetBIOS name are often displayed for
    objects.


    ![](img/763d5ae436311371600c0952a3da9094_332_2.png)


    1 Click the Operating System tab.


    This tab displays the computer''s operating system, version number, and the service
    pack that is applied (if any).


    ![](img/763d5ae436311371600c0952a3da9094_332_3.png)


    6 Click the Member Of tab.


    This tab tells you what groups the computer currently belongs to.


    7 Click Add to add the computer to more groups.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# # CONFIGURING COMPUTER ACCOUNT PROPERTIES


    **T**he Location and Managed By tabs provide the same configuration options as
    other properties sheets. The Location tab tells which locations are served by
    the site in the directory setup. You can use the Browse button to change site
    locations if necessary.


    The Managed By tab allows you to enter a manager for the computer account. When
    you enter a manager, the manager''s contact information (such as telephone, address,
    and so on) is extracted from the manager''s user account and placed on this tab,
    if the information is available in the user account. You do not have to


    assign a manager to a computer account, but the Active Directory provides you
    this option so you can decentralize administrative duties in your network. Like
    delegation, you can assign managers to various Active Directory objects to remove
    the management burden from senior IT administrators.


    ![](img/763d5ae436311371600c0952a3da9094_333_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_333_1.png)


    +   8 Select a new group from the list.

    +   9 Click Add.


    +   10 Repeat Steps 8 and 9 to add additional groups as needed.

    +   11 Click OK when you are done.


    The new group(s) appear on the Member Of tab.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# **Who should manage a computer account?**


    Any number of domain users can be the manager of a computer account. You should
    select someone who works primarily with the physical computer or manages a group
    of computers and employees. Remember that group memberships should be carefully
    configured, so the manager needs to understand the dynamics of group membership
    and group management. Also, you should minimize the number of people who manage
    Active Directory objects, for security purposes as well as administrative control.


    # **Should a computer account belong to different groups?**


    You can give a computer account membership in any group, just as you can a user
    account. The group memberships define what actions that particular computer can
    perform and how that computer can be used on the network. The rule of thumb is
    to give group memberships that are necessary, but do not assign excessive memberships
    to either users or computers.


    ![](img/763d5ae436311371600c0952a3da9094_334_0.png)


    **12** Click the **Location** tab.

    ■ The **Location** tab tells you which locations are served by the site.


    **13** For multiple sites, you can use the **Browse** button to browse to a different
    location.


    ![](img/763d5ae436311371600c0952a3da9094_334_1.png)


    **14** Click the **Managed By** tab.

    ■ The **Managed By** tab gives you the name and contact information for the account
    manager.


    **15** Use **Change** to change the computer account manager.

    **16** Click **OK** to close the Properties sheet.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# CHAPTER 16 CREATING AND MANAGING COMPUTER ACCOUNTS


    # MANAGING COMPUTER ACCOUNTS


    You can easily manage computer accounts by performing the typical tasks of disabling
    and resetting accounts, deleting accounts, and refreshing accounts.


    Two very helpful actions are the Move and Manage features. The Move action enables
    you to move the object to a different OU in the Active Directory. Although you
    should try to keep the Active Directory as static as possible, restructuring may
    occur from time to time, and you may have to move objects to different locations.
    With the Move feature, you can easily perform this action without having to delete
    and recreate the object in the desired location.


    The Manage feature is particularly helpful because it allows you to open the Computer
    Management snap-in for the computer account. With appropriate administrative rights,
    you can configure remote computers, install and remove devices, and even configure
    hard disks—all while sitting at your own server.


    ![](img/763d5ae436311371600c0952a3da9094_335_0.png)


    +   1. Click the Action menu to see account management options.

    +      If you click Disable Account, a warning message tells you that users will
    not be able to log on to the domain from that computer.

    +   2. Click Yes to disable the account; click No to cancel.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# **Does disabling the account delete it?**


    No. If you disable the computer account, users cannot log on to the domain from
    that computer. The computer account object in the directory appears with a red
    X over it. You can re-enable the account by right-clicking the account object
    and choosing Enable Account.


    # **When should a computer account be deleted?**


    You should always use the Disable Account option unless the computer has been
    physically removed from the network and is no longer in service. In that case,
    you can delete the account from the directory.


    # **If I choose to manage another computer, what can I do?**


    The Manage option opens the Computer Management console on other Windows 2000
    computers. You can perform any task within the console, such as using system tools,
    configuring shared folders, managing storage, and even managing services and applications.


    ![](img/763d5ae436311371600c0952a3da9094_336_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_336_1.png)


    +   If you choose Action>Move, the Move window appears, which allows you to select
    the folder to which you want to move the account.


    +   If you choose Action>Manage, the Computer Management snap-in opens (if you
    have administrative privileges). You can configure the computer from this window.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# CREATING ORGANIZATIONAL UNITS


    Organizational units (OU) are provided in the Active Directory to help you organize
    resources in a logical manner so that your Active Directory structure models your
    administrative structure. You can think of an OU as a file folder—a container
    into which you can put other files or documents. In the Active Directory, an OU
    is simply a container where you can place and organize similar OUs and Active
    Directory objects.


    As with all aspects of the Active Directory, you should carefully plan what OUs
    you will create and what other OUs and resources will reside in those OUs. You
    can learn about planning your Active Directory OU structure in Chapter 10. You
    can easily create OUs in the Active Directory Users and Computers snap-in.


    ![](img/763d5ae436311371600c0952a3da9094_337_0.png)


    +   1. Select the domain or other OU in which you want to create the new OU and
    choose Action:\New\Organizational Unit.

    +   You can also click the OU icon on the MMC taskbar.

    +   2. Type the name of the new OU.

    +   3. Click OK'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# TIPS


    ![](img/763d5ae436311371600c0952a3da9094_338_0.png)


    # Should I create additional OUs within an OU?


    Think of an OU as a folder on your hard disk. You can create additional folders
    within that folder to further organize information. Additional OUs within an OU
    help you organize the resources that are available within the OU. This process
    is called nesting. Depending on the purpose of the OU, you may not need additional
    OUs, but the overall goal is to make the OU''s resources organized, logical, and
    easy for users to find and access. However, you should also be aware that deeply
    nested OUs may cause problems or slow response time for Active Directory object
    discovery—in other words, nested OUs can slow down resource search times.


    # How many OUs can I create?


    You can create as many first-level OUs and nested OUs as needed for your network.
    However, you should have a firm understanding of OU planning and carefully plan
    the structure before implementation, or OUs can quickly get out of control.


    ![](img/763d5ae436311371600c0952a3da9094_338_1.png)


    The new OU appears in the console tree. If you want to create additional OUs within
    the OU, repeat Steps 1 through 3.


    ![](img/763d5ae436311371600c0952a3da9094_338_2.png)


    These are examples of nested OUs.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# CREATING ORGANIZATIONAL UNITS

    CONTINUED


    Like most Active Directory components, you can use the Action menu and select
    Properties to further configure the OU. The OU properties sheet contains three
    tabs.


    On the General tab, you can enter a description and address information for the
    OU if desired. This


    information is useful in large environments in which different OUs are based on
    a physical location. For example, an Atlanta OU can contain the network segment
    at an Atlanta site. The address information can identify the physical location
    of the resources within the OU. On the Managed By


    tab, you can click the Change button to assign a manager from the Active Directory
    to the OU. Also, you can click the Group Policy tab to implement additional group
    policies for the OU if necessary, depending on the policies you have configured
    in Windows 2000 Server.


    ![](img/763d5ae436311371600c0952a3da9094_339_0.png)


    +   1. Open the OU Properties sheet by choosing Action Properties.


    +   2. Enter a description and address information in the boxes if desired.


    +   3. Click the Managed By tab.


    +   4. To assign a manager to the OU, click Change.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# TIPS


    # Must I provide a description and address for an OU?


    No. The description and address feature allows you to enter organizational information
    about the OU, but it is not required. Depending on the structure of your Active
    Directory environment and the particular OU you are working with, a description
    and address may not be desired or needed.


    # Is it necessary to assign a manager to an OU?


    Depending on the needs of your organization, you may wish to assign a manager
    to certain top-level OUs. The manager can then create additional OUs within the
    OU and manage how resources are organized.


    # What about group policies?


    Group policies are a powerful new feature of Windows 2000 that enables you to
    implement highly detailed policies applying to groups, OUs, or even domains. You
    can learn all about group policies in Chapter 24.


    ![](img/763d5ae436311371600c0952a3da9094_340_0.png)


    +   8  Select a manager from the list.


    +   9  Click OK.


    ![](img/763d5ae436311371600c0952a3da9094_340_1.png)


    +   10  Click the Group Policy tab.


    +   11  Click OK to close the Properties sheet and save your changes.


    ■ Use this tab to add policies you have created in Windows 2000 Server that affect
    the OU. See Chapter 25 for more information.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# CREATING AND CONFIGURING A CONTACT


    The Active Directory provides a way to keep track of people who may or may not
    be employed with your company through the use of contacts. A *contact* is similar
    to a personal address book entry in an e-mail application. You can use contacts
    for a variety of purposes, but they are particularly useful for keeping track
    of temporary or contract employees


    and others who provide services to users. The contact information is stored in
    the Active Directory so that other users can view the contact''s information.


    After you create a contact, the contact appears in the OU you selected. You can
    then configure the properties for the contact by using the Action menu.


    On the General tab, you can enter additional contact information about the person,
    such as a telephone number, description, e-mail address, and Web site location.
    This is optional configuration data, and this does not affect your network communication
    process.


    ![](img/763d5ae436311371600c0952a3da9094_341_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_341_1.png)


    # CREATING A CONTACT


    +   1.  Select the OU in which you want to place the contact object and choose
    Action->New->Contact.


    +   2.  Type the name of the contact and the display name.


    +   3.  Click OK.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Who should be a contact?


    Because network user information is stored in the Active Directory, you do not
    need to create contacts for network users. You can, however, use the contact feature
    to store information about temporary employees who do not have a network account,
    consultants, or other business associates who you frequently contact.


    # How should contacts be organized?


    No hard and fast rules for organizing your contacts exist, but if you want your
    Active Directory users to easily find the contacts, consider creating an OU that
    identifies itself as a contact OU, and then storing the contact objects in the
    OU. Of course, the contact OU can also reside in another OU, depending on your
    Active Directory structure.


    # CONFIGURING A CONTACT


    +   1. After you create a contact, choose Action Properties.


    +   2. Use these boxes to enter contact information.

    +   3. Use these boxes to enter phone, e-mail, and Web information.


    +   4. Use the Other buttons to list additional phone or Web information.


    ![](img/763d5ae436311371600c0952a3da9094_342_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_342_1.png)'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# CREATING AND CONFIGURING A CONTACT


    **O**n the Address tab, enter information in the boxes about the contact''s address.


    The Telephones tab provides a number of boxes for the contact''s phone and pager
    information. You can enter additional information about contacting the user in
    the comments section.


    On the Organization tab, you can enter information about the contact''s organization.
    If the contact is a member of your organization, you can click the Change button
    to enter the manager''s name from the Active Directory. The Direct Reports box
    lists the people within your organization who directly report to the contact.


    The Member Of tab enables you to add the contact to groups within the Active Directory.
    Use the Add button to add the selected group(s).


    ![](img/763d5ae436311371600c0952a3da9094_343_0.png)


    +   5. Click the Address tab.


    +   6. Use these boxes to enter the contact''s address information.


    +   7. Click the Telephones tab.

    +   8. Use these boxes to enter the contact''s telephone numbers


    +   9. Click the Other buttons to add additional telephone information.

    +   10. Enter any additional comments about the contact.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# TIPS


    # Why would a contact have a manager?


    Remember that contacts in the Active Directory are loosely defined and can be
    used in an appropriate manner for your organization. Many organizations hire contractors
    who directly report to management at the company. These managers are a part of
    the Active Directory, even though the contractor may not be.


    # Should contacts have group access?


    Contacts may be considered part of groups as necessary. Without a valid logon
    and password, however, they cannot use the network or directory resources. Again,
    the contact can be used in a number of ways, depending on the needs of your organization.


    # What is the purpose of the Telephone tab when you can enter the contact’s phone
    number on the General tab?


    The Telephone tab is simply another place to enter additional phone information—such
    as home phone, pager, cellular phone, and so on—about the contact.


    ![](img/763d5ae436311371600c0952a3da9094_344_0.png)


    +   - **11** Click the Organization tab.

    +   - **12** Enter the contact’s position and company information.


    +   - **13** If the contact has a manager in the local environment, click the
    Change button to select the manager from the Active Directory.


    +   - **14** Click the Member Of tab.

    +   - **15** If you want the contact to be a member of a group, click Add and
    select the group.


    +   - **16** Click OK to save your changes.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# **USING SHARED FOLDERS**


    You can publish shared folders in the Active Directory so that users can more
    easily find information. In the past, a user had to know which server or workstation
    stored a shared folder. Now, you can store that information in the Active Directory
    so that users can more


    easily find shared folders and even search for them. The shared folders and the
    information they contain still reside on the hosting computer''s hard drive, but
    the directory keeps track of the folder''s location so that users don''t have
    to.


    With the powerful search features of the Active Directory, a user can perform
    a search for shared folders, find the folder he or she needs, and simply open
    the folder from the Active Directory. Knowing the network path to the shared folder
    is not necessary.


    ![](img/763d5ae436311371600c0952a3da9094_345_0.png)


    # **ADDING A SHARED FOLDER**


    +   1. Select the OU in which you want the object to reside and choose Action>New>Shared
    Folder.


    +   2. Use these boxes to enter the shared folder''s name and the UNG path.


    +   3. Click OK.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# What information can reside in a shared folder?


    Virtually any information can reside in a shared folder. Common examples include
    documents, applications, databases, or other shared folders. Shared folders function
    the same as they did in Windows NT and contain any shared information. The Active
    Directory simply provides a directory object for the folder and keeps track of
    where it is located on the network.


    # Where is the information in the shared folder?


    The shared folder object in the Active Directory is simply a pointer to a computer
    that contains the shared folder and the information in the shared folder. The
    method allows a user to contact a computer, such as CORP64737, and use the shared
    folder on that computer without having to know that the folder actually resides
    on CORP64737.


    # Does the Active Directory keep track of a shared folder''s contents?


    No. A shared folder object only provides the pointer to the shared folder and
    a description of the contents in the shared folder, which an administrator enters.


    ![](img/763d5ae436311371600c0952a3da9094_346_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_346_1.png)


    +   To perform additional configuration, select the shared folder.


    +   Choose the Action menu.


    # OPENING A SHARED FOLDER


    +   Choosing Action:: Open displays the shared folder and its contents.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# USING SHARED FOLDERS CONTINUED


    You can also click Explore in the selection list so that you can see the network
    directory structure in an Explorer window.


    If you click Map Network Drive in the selection list, you can map a network drive
    to the shared folder that will connect each time you log on. This feature enables
    you to use My Computer to connect to the share and is a useful feature for shares
    that you access regularly. The Map Network Drive window enables you to specify
    a drive letter and shared folder. You can also connect using a different username.
    This feature is provided for anonymous access and allows administrators to connect
    to shares as other users. You can also connect to Web folder or FTP site by clicking
    the link. This opens the Add Network Place Wizard, which allows you to create
    a connection object on your system. With the ever-growing use of intranet sites,
    this feature is particularly helpful if you need to connect to a shared folder
    on the intranet or even the Internet.


    ![](img/763d5ae436311371600c0952a3da9094_347_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_347_1.png)


    # EXPLORING A SHARED FOLDER


    +   - Choosing Action→Explore brings up an Explorer window presenting the directory
    location of the shared folder.


    # MAPPING A NETWORK DRIVE TO A SHARED FOLDER


    +   - Choosing Action→Map Network Drive brings up this window.

    +     - Select a drive letter.


    +   1. Type the shared folder UNC path.

    +   1. Click this link to connect using a different name.

    +   1. Click this link to connect to a Web folder or FTP site.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# TIPS


    # Why is mapping a drive to a Web folder or FTP site an option?


    One of the goals of Windows 2000 is to provide seamless integration with the Internet.
    You can map a network drive to a Web folder or FTP site on the Internet or intranet
    just as though the folder were available on your LAN. This feature enables you
    to access any resource you may need, whether local or not. An important feature
    of Web folders is user contact over the Internet. A company in several geographic
    locations can set up a Web site with shared folders available so that network
    users in other geographic locations can access the information via the Internet.
    This possibility can reduce site bandwidth by using the Internet.


    # Do I need to connect to a shared folder using a different username?


    In most cases, no. This option is provided for anonymous access and for users
    who want to connect using a very secure account (such as an administrator''s account).


    ![](img/763d5ae436311371600c0952a3da9094_348_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_348_1.png)


    +   **4** If you clicked Connect Using A Different User Name, the Connect As dialog
    box appears.


    +   **5** Enter the username and password.


    +   **6** Click OK.


    +   **7** If you clicked to connect to a Web folder or FTP site, the Add Network
    Place Wizard appears.


    +   **8** Type the location information or click Browse.


    +   **9** Click here to see some examples of shared folder, Web folder, and FTP
    site syntax.


    +   **9** Click Next to continue, and then click Finish.


    CONTINUE


    325'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# # USING SHARED FOLDERS CONTINUED


    You can also access the properties sheet for the shared folder using the Action
    menu.


    The properties sheet has two tabs: General and Managed By. On the General tab,
    you can enter a description of the shared folder. The UNC path also appears. The
    UNC path is the network location of the shared folder. When users access the shared
    folder object in the Active Directory, they are redirected to the computer that
    holds the shared folder by the UNC path. If a shared folder ever changes locations
    on the network, you (as the administrator), will need to change the UNC path so
    it is correct, or users will not be able to access the shared folder from the
    directory.


    If you click the Keywords button, you can enter keywords for the shared folder,
    which help users find the folder when they search the Active Directory. You can
    enter any keywords desired, but they should carefully and accurately describe
    the contents of the shared folder so that users can find the resources they are
    searching for.


    ![](img/763d5ae436311371600c0952a3da9094_349_0.png)


    # **CONFIGURING A SHARED FOLDER**


    +   1. From the console, choose **Action > Properties**.

    +   2. Enter a description for the shared folder if desired.


    +   3. Click **Keywords** if you want to add keywords for the shared folder.

    +      - The keywords help Active Directory users find the shared folder when
    they search for it.


    +   4. Type a keyword.

    +   5. Click **Add**.

    +      - The keyword you typed appears in the list.


    +   6. Repeat Steps 4 and 5 if you want to add more keywords.

    +   7. Click the **OK** when you finish adding keywords.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '![](img/763d5ae436311371600c0952a3da9094_350_0.png)


    # What keywords should I use?


    You can use any combination of keywords to help identify a shared folder. The
    purpose of the keywords is to allow Active Directory users to perform searches.
    For example, if users know that a folder resides on a marketing server that contains
    the marketing department’s policies, but they do not know the name of the folder,
    users can search for “marketing shares documents.” If the keywords for this share,
    such as “marketing, folders, documents, shared folders, marketing policies,” and
    so on, have been entered, users can find the folder they need using the search
    operation.


    +   8 Click the Managed By tab.


    ![](img/763d5ae436311371600c0952a3da9094_350_1.png)


    +   9 Click Change if you want to add a manager to the shared folder from the
    Active Directory.


    +   10 Select the manager from the Active Directory list.


    ![](img/763d5ae436311371600c0952a3da9094_350_2.png)


    +   11 Click OK to save your changes.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# # USING NETWORK PRINTERS


    You can add network printers to the Active Directory so that users can more easily
    find them. Typically, various printers are attached to print servers or even users’
    computers. The Active Directory makes it easy for users to find printers because
    users do not have to know the UNC path to the printer. Printers connected to Windows
    2000 computers can be automatically published in the Active Directory without
    administrator intervention.


    You can use the Active Directory Printer object to connect to the printer, and
    you can open it to see what is in the print queue. You can also select Properties
    using the Action menu.


    The printer properties sheet has two tabs: General and Managed By. On the General
    tab, you can add information about the printer’s location, model, and additional
    comments if desired. On the Managed By tab, you can click the Change button to
    assign the printer object to an Active Directory user.


    ![](img/763d5ae436311371600c0952a3da9094_351_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_351_1.png)


    # ## CREATING A PRINTER OBJECT


    +   1.  Select the OU in which you want to create the printer and choose Action>New>Printer.

    +   2.  Enter the UNC path of the printer location.

    +   3.  Click OK.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# Can users access various printers directly through the Active Directory or
    will they still need the UNC path?


    Users, provided they have appropriate permissions, can access the printers directly
    from the Active Directory. The object stores the UNC path information to the printer
    so that users do not have to know this information to reach the printer.


    # How can I keep certain groups from using a printer in the Active Directory?


    Just because an object, such as a printer, resides in the Active Directory does
    not mean that any user or group can use the resource. Permissions are configured
    on the actual shared object on the machine that houses the printer. You can set
    permissions there and deny whatever groups or users you so choose. Even though
    users can access the printer object in the directory, they must have appropriate
    permissions to use the object.


    ![](img/763d5ae436311371600c0952a3da9094_352_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_352_1.png)


    # CONFIGURING A PRINTER OBJECT


    +   1. Select the printer object and choose Action>Properties.

    +   2. Enter the location, model, and description.

    +   3. Enter additional information about the printer''s properties.


    +   4. Click the Managed By tab.

    +   5. Click Change to assign a manager to the printer object. Select an Active
    Directory user from the list that appears and click OK.'
  merge: -1
  img_proc: true
- pgno: 353
  md: "# MANAGING DOMAIN CONTROLLERS\n\nYou can use the Active Directory Users and\
    \ Computers snap-in to manage domain controllers and their properties that apply\
    \ to the Active Directory within this snap-in. With proper permissions, you can\
    \ even manage the actual machine itself from within the Active Directory. Certain\
    \ functions, such as trust\n\nrelationships, replication, and others that affect\
    \ the entire Active Directory, are managed from other snap-ins that are discussed\
    \ later in the book.\n\nIf you click the Domain Controllers OU, you see a list\
    \ of domain controllers for your particular domain appears in the right details\
    \ pane of the console. If you select a\n\ndomain controller and use the Action\
    \ menu, you can see the actions you can perform.\n\nYou can perform a number of\
    \ configuration tasks, such as move domain controllers, manage domain controllers,\
    \ and even access the domain controller's properties sheets for further configuration\
    \ options.\n\n![](img/763d5ae436311371600c0952a3da9094_353_0.png)\n\n+   **MOVING\
    \ A DOMAIN CONTROLLER**\n+   \n+   1.  Select the domain controller you want to\
    \ administer, and then click Action->Move.\n+       The Move window appears. You\
    \ can expand the directory and select the OU you want to move the domain controller\
    \ to.\n\n+   2.  Make your selection and click OK."
  merge: -1
  img_proc: true
- pgno: 354
  md: '# What does delegation mean?


    You can assign both computers and users the right to *delegate*. This means that
    other resources can be assigned to the user or computer so that those resources
    can be managed by that person or computer.


    Delegation is a powerful feature of Windows 2000 that is designed to reduce administrative
    overhead by allowing other people to manage certain aspects of the Active Directory.
    Delegation, however, still allows you to maintain control over what you delegate
    and how the delegate manage the object.


    # Do I need to enter a description for the server on the General tab?


    A description is not required; however, the description appears in the details
    pane in the Active Directory for the object. Generally, entering a description
    for all Active Directory objects is a good idea so that you can easily find needed
    objects.


    ![](img/763d5ae436311371600c0952a3da9094_354_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_354_1.png)


    +   **1.** Choose **Action->Manage.**


    The Computer Management snap-in opens. You can then perform a number of configuration
    options (provided you have appropriate permissions).


    # CONFIGURING A DOMAIN CONTROLLER


    +   **1.** Return to the Active Directory Users and Computers snap-in, select
    the desired domain controller, then choose **Action->Properties.**


    +   **1.** You can enter a description in this box on the General tab.


    +   **2.** Click this check box if you want the server to be trusted for delegation.'
  merge: -1
  img_proc: true
- pgno: 355
