- pgno: 9
  md: '# About the Author


    Curt Simmons, Microsoft Certified Systems Engineer (MCSE) and Microsoft Certified
    Trainer (MCT), is a Windows expert who spends his most of his time writing technical
    books. Curt has been working closely with Windows 2000 and the Active Directory
    since beta 1 was released, and he is author of a dozen high-level computing books
    on Microsoft technologies. Curt lives in a little Texas town outside of Dallas
    with his wife and daughter, and you can visit him on the Internet at curtssimmons.hypermart.net.


    # Author’s Acknowledgements


    I would like to thank everyone at IDG Books, especially Martine Edwards and Darren
    Meiss. Thanks to Martine for the opportunity to write this book, and a big thanks
    to Darren for all his time and effort. I would, as always, like to thank my agent,
    Margot Maley, for always pursuing opportunities on my behalf. Finally, thanks
    to my wife Dawn for her constant patience and support when I spend too many hours
    hammering the computer keys.'
