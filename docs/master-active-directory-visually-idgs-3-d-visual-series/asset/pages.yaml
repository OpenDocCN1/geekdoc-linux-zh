    \  \nFirst, by using the Action menu, you can choose to manually update the Server\
    \ Data File. This action manually forces a zone transfer so\n\nthat the server's\
    \ database file is updated. You don't need to do this under normal circumstances\
    \ because changes to the primary zone database file are automatically sent to\
    \ secondary DNS servers. However, if several changes have occurred, then you can\
    \ choose to manually force the update.\n\nYou can also choose to completely reload\
    \ the zone database file instead of update it. This action, which is accessible\
    \ from the Action menu, removes the previous record and replaces it with a new\
    \ copy of the primary zone database file.\n\n![](img/763d5ae436311371600c0952a3da9094_181_0.png)\n\
    \n![](img/763d5ae436311371600c0952a3da9094_181_1.png)\n\n# ### MANUALLY UPDATING\
