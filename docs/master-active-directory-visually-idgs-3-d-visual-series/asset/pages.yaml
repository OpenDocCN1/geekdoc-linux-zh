- pgno: 101
  md: '# # MANAGING SCOPES


    Several options within the MMC console''s Action menu can help you manage scopes.


    First, you can reconcile the scopes. If you suspect that there are missing IP
    addresses within the scope that should be available, you can run the Reconcile
    command. This action


    checks the database for consistency. If discrepancies exist, a dialog box appears
    listing the discrepancies; if no discrepancies exist, a message box tells you
    that the scope is consistent.


    You can also use the Action menu to deactivate a scope. When you


    deactivate a scope, the DHCP server can no longer use that scope to lease IP addresses
    to client computers. You could use the deactivation for a number of purposes,
    especially if you have designed a new scope that you want to implement. Remember
    that a subnet can only contain one DHCP scope.


    ![](img/763d5ae436311371600c0952a3da9094_101_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_101_1.png)


    # RECONCILING A SCOPE


    +   1 Select the scope you want to manage in the console, and then choose Action\Reconcile
    All Scopes to check for inconsistencies.


    +   2 Click Verify to continue.


    +   1. The Reconcile All Scopes dialog box appears.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# TIPS


    # When should I run the Reconcile option?


    You can run the Reconcile scope option anytime you think problems with the DHCP
    scope may exist. If clients are having communication problems or are not receiving
    IP addresses from the server, you should reconcile the scope to look for any problems.
    Also, you may choose to reconcile the scope on a regular basis as a preventive
    tool in case problems are developing in the DHCP database.


    # Would overlapping scopes create problems?


    Yes. When planning your network scopes, it is important that scopes do not overlap
    with each other. Overlapping scopes would allow DHCP servers to lease duplicate
    IP addresses on different network segments. Depending on your network configuration,
    scopes could overlap if the subnet mask that applies to the scopes is different.
    As with most implementations, planning is of key importance.


    ![](img/763d5ae436311371600c0952a3da9094_102_0.png)


    1 Click OK


    ![](img/763d5ae436311371600c0952a3da9094_102_1.png)


    # DEACTIVATING A SCOPE


    1 To deactivate a scope, select the scope in the console and choose Action→Deactivate.


    CONTINUED'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# # MANAGING SCOPES CONTINUED


    If you deactivate a scope, the scope still exists and remains configured, but
    it is not active in the Active Directory and cannot be used for leasing. You can
    reactivate the scope after you deactivate it.


    You can also choose to delete a scope that you no longer need. If the scope is
    a part of a superscope, you receive a message telling you that the scope will
    also be removed from the superscope. If the scope is the only scope left in the
    superscope, you receive a message telling you


    that the superscope will be deleted as well. Remember that a superscope is an
    organizational method that typically contains several scopes. A superscope cannot
    exist without child scopes, and so if you remove the last scope within the superscope,
    you must delete the superscope also.


    ![](img/763d5ae436311371600c0952a3da9094_103_0.png)


    +   1. Click Yes in the warning message that appears to deactivate the scope.

    +   2. Click No to cancel the action.


    ![](img/763d5ae436311371600c0952a3da9094_103_1.png)


    # ### DELETING A SCOPE


    +   1. Select the scope you want to delete in the console tree, and then choose
    Action→ Delete.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# TIPS


    # Why would I want to deactivate a scope?


    The Deactivate command enables you to stop using a particular scope without deleting
    it. You may want to deactivate a scope for a number of reasons. First, you could
    deactivate the scope for troubleshooting purposes. In this case, the scope still
    exists, and you do not have to reconfigure the scope when you want to bring it
    online again. Also, you may choose to begin using a new scope, so you deactivate
    the old one. Deactivating the scope enables you to keep it in case you decide
    to use it again, or you can keep it until you are certain that you want to delete
    it.


    # Can''t I keep a superscope without any child scopes configured for later use?


    No. Think of the superscope as a container. Without anything in the container,
    the superscope cannot function. The DHCP Manager does not allow you configure
    or keep a superscope that does not have at least one child scope.


    ![](img/763d5ae436311371600c0952a3da9094_104_0.png)


    +   1. A warning message appears if this is the only scope in the superscope.


    +   2. Click Yes to continue the delete.


    # REFRESHING A SCOPE


    +   1. You can refresh any scope by selecting it in the console tree.


    +   2. Choose Action\Refresh.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# CONFIGURING SCOPE PROPERTIES


    You can access the Properties dialog boxes of each scope to further configure
    it. The Properties dialog box for a standard DHCP scope contain three tabs.  On
    the General tab, you can change the scope range by changing the starting and ending
    IP addresses, and you can also enter a new lease time value. These features make
    it easy for you to change the scope without having to create a new one.


    On the DNS tab, you can determine if you want DHCP to dynamically update client
    name to IP address mappings in the DNS. These options are enabled by default when
    Active Directory is in use, and you should allow the default settings to remain
    for optimal performance. You can learn more about the functionality of Dynamic
    DNS in Chapter 6.  The Advanced tab enables you to also assign IP addresses to
    BOOTP clients, if they exist on your network. If you choose to allow the DHCP
    server to lease IP addresses to BOOTP clients, then you need to configure a lease
    expiration time for the BOOTP clients as well.


    ![](img/763d5ae436311371600c0952a3da9094_105_0.png)


    +   1. Select the scope in the console tree, and then choose ActionProperties.


    ![](img/763d5ae436311371600c0952a3da9094_105_1.png)


    +   2. Use the General tab to reconfigure the scope by changing the starting and
    ending IP addresses as needed.

    +   3. You can change the lease duration by entering a new value for the lease.

    +   4. Or, you can click the Unlimited button to allow no time limit for the lease.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Should I allow unlimited lease time?


    You can allow DHCP clients to keep their IP addresses for an unlimited amount
    of time by selecting the option on the General tab. In large networks, this is
    usually not a good idea. This option allows the client to keep an IP address,
    even if the client is no longer on a particular subnet. As a result, a number
    of IP addresses cannot be leased to other clients because they are “locked up”
    by nonexistant clients on the network. In small environments, where the number
    of IP addresses available to lease is not an issue, the Unlimited option works
    fine.


    # What is a BOOTP client?


    A BOOTP client is a diskless workstation that receives operating system information
    from the server. DHCP originated from BOOTP. If you are using BOOTP clients on
    the network, you can use DHCP to dynamically assign the BOOTP clients an IP address,
    just as you would a normal network client.


    ![](img/763d5ae436311371600c0952a3da9094_106_0.png)


    +   1.  Click the DNS tab.

    +   2.  This tab enables you to automatically update client lease information
    in DNS.


    +   1.  Click the appropriate check boxes to enable the features you want.


    ![](img/763d5ae436311371600c0952a3da9094_106_1.png)


    +   1.  On the Advanced tab, you can choose which clients you would like to assign
    IP addresses to. You can click either DHCP, BOOTP, or both. If you use BOOTP clients
    on your network, enter an IP address lease time as well.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# **ADDITIONAL SCOPE CONFIGURATION**


    Y ou can expand any scope you want to administer to see the Address Pool, Address
    Leases, Reservations, and Scope Options containers. These containers enable you
    to easily view the current IP addresses that have been leased to clients, the
    reservations within the scope that are made, and the IP addresses that are available
    for lease.


    If you select the Address Pool container, the starting and ending IP addresses
    for the pool appear in the right console pane. You can use the Action menu to
    add a new exclusion range for the scope if desired.


    If you select the Address Leases container, the clients and IP addresses lease
    appear in the right console pane so that you can see which client has been issued
    which IP address.


    If you select the Reservations container, you can see the reservations that exist,
    and you can use the Action menu to create new reservations.


    ![](img/763d5ae436311371600c0952a3da9094_107_0.png)


    1. To expand the scope you want to administer, select Address Pool, and choose
    Action➣New Exclusion Range.


    2. Enter the starting and ending IP addresses for the exclusion range.


    3. Click Add.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Why would I want to add or change the exclusion range?


    Because networks are not static entities, you need to change some of your scope
    options from time to time. You may need to add or change exclusion ranges based
    on the number of IP addresses you need to exclude from the leasing process. This
    gives you a pool of IP addresses that you can statically assign to servers or
    other hardware that need static addresses.


    # What does a reservation do?


    A reservation sets aside an IP address that would normally be leased to a particular
    client. This ensures that the client always receives the same IP address. To configure
    the reservation, you need the client’s name and MAC address, as well as the IP
    address that you want to reserve. After you complete the reservation, that client
    always has the same IP address.


    ![](img/763d5ae436311371600c0952a3da9094_108_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_108_1.png)


    +   4. Select the Reservations container, and then choose Action: New Reservation.


    +   5. Enter the Reservation name, IP address, MAC address, and Description to
    reserve an IP address for a client.


    +   6. Click the appropriate radio button for either DHCP, BOOTP, or both.

    +   7. Click Add.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# ## ADDITIONAL SCOPE CONFIGURATION

    ### CONTINUED


    You can define additional scope options by selecting the Scope Options container
    and choosing Action::: Configure Options.


    As in Windows NT, DHCP in Windows 2000 enables you to configure a number of additional
    options, depending on the services installed on your network. You can use the
    options to have DHCP return additional information to clients for particular servers.
    For example, if you are using Log Servers, Cooke Servers, other Name Servers,
    and so forth, DHCP can return this information to the clients along with their
    IP addresses.


    You can also select different kinds of vendor and user classes to configure additional
    DHCP options. You can configure DHCP Standard Options, Microsoft Options, Microsoft
    Windows 2000 Options, or Microsoft Windows 98 Options, as well as user classes,
    such as the Default User class, Dynamic BOOTP class, or RRAS class.


    The standard options are configured by default, so make certain that you have
    specific reasons for making changes to the DHCP options and that you are certain
    the changes will benefit your network clients.


    ![](img/763d5ae436311371600c0952a3da9094_109_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_109_1.png)


    9 Select the Scope Options container and choose Action::: Configure Options.


    10 On the General tab, select the options by clicking the appropriate check boxes.


    11 Enter the Server name for the option.


    11 Enter the IP address information for the option.

    12 Click Add to add the information to the list.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Do I need to configure any of these options if I use simple DHCP services?


    No. The standard options are configured by default, so you do not need to make
    option changes unless you have specific needs. Microsoft has taken great care
    to ensure that the default options are configured automatically and are all that
    are needed for most DHCP implementations. You should plan carefully before changing
    these default options.


    **TIPS**

    I want the IP address information for a finger server returned to clients. Can
    I configure this in DHCP?


    Yes. A finger server retrieves information about a user on a computer running
    the finger service. In environments where the finger service is used, you have
    the IP address of the finger server returned to client computers with their IP
    address lease. You can select the option on the General tab and enter the server''s
    name and IP address. When clients are assigned an IP address, the finger server''s
    IP address is returned to the client as well.


    ![](img/763d5ae436311371600c0952a3da9094_110_0.png)


    +   * **13** Click the Advanced tab.

    +   * **14** Select the desired vendor class.


    ![](img/763d5ae436311371600c0952a3da9094_110_1.png)


    +   * **15** Select the desired user class.

    +   * **16** Click OK.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# MANAGING DHCP SERVERS


    Aside from managing the scopes that you create, you can also perform several actions
    to manage and configure the DHCP server.


    If you select the server you want to manage, you can choose the Action menu to
    see the options you have.


    You can display the server statistics. A window appears that gives you a variety
    of statistical information about the DHCP servers functions and leasing. The statistics
    provided can help you determine the overall performance and functionality of your
    DHCP server, and you can use the statistics to see the number of IP addresses
    and renewals the server is handling.


    You can also define user classes for the DHCP server. This is the same information
    you can configure for individual scopes. You can select an available class and
    add it for configuration. Generally, the default options are all you need, so
    you should plan carefully before implementing any of the additional user class
    options.


    ![](img/763d5ae436311371600c0952a3da9094_111_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_111_1.png)


    +   1. Select the desired server, and then choose Action- Display Statistics.


    +   2. A window appears showing the statistics.


    +   3. Click Close when you are done viewing the statistics.'
