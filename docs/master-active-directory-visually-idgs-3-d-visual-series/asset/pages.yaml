- pgno: 370
  md: '# Domain partition


    The Domain partition contains information about all Active Directory objects in
    a domain (such as users, groups, printers, shared folders, and so on). Domain
    partition information is completely replicated to all domain controllers within
    the domain. A read-only replica of the domain partition is also replicated to
    all global catalog servers in other domains. This allows all domain


    controllers to know what resources reside in other domains, but changes to the
    domain partition can only occur within the domain for which it applies. This feature
    maintains domain security, but still allows users in other domains to see what
    resources are available.


