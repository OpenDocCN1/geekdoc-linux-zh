- pgno: 177
  md: '# CONFIGURING SERVER PROPERTIES

    CONTINUED


    The Advanced tab gives you several options that may help your server perform with
    other DNS servers more effectively, such as BIND Secondaries, enable round robin,
    and enable netmask ordering (all of which are selected by default.) The name checking
    drop-down menu determines how the DNS server checks names and the kind of names
    it checks. You have the following options:


    +   - Strict RFC—strictly enforces the use of RFC compliant rules for all DNS
    names. Non-RFC names are treated as errors.

    +   - Non-RFC—any names that are not RFC compliant can be used.

    +   - Multibyte—uses the Unicode 8-bit translation encoding scheme.

    +   - All Names—allows all names to be used with the DNS server.


    The All Names and Non-RFC options are the most lenient and provide the greatest
    amount of interoperability between DNS servers.

    You can also alter the way DNS retrieves its zone data information at startup.
    You have the options of Active Directory and Registry, From Registry, or From
    File.


    ![](img/763d5ae436311371600c0952a3da9094_177_0.png)


