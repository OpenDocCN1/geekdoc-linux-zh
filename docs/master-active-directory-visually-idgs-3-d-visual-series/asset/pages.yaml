- pgno: 572
  md: '# CHOOOSING THE MAXIMUM APPLICATION LOG SIZE


    The Event Log container of Security settings allows you to configure how the Event
    Log functions for client computers to whom the policy applies. Your first option
    is the maximum Application Log Size. Event Logs are useful, but can use up a lot
    of hard disk space. You can use this policy to set the maximum size of the Application
    Log. The default setting is 512 kilobytes.


    ![](img/763d5ae436311371600c0952a3da9094_572_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_572_1.png)


    +   1. Expand the Security Settings container, expand the Event Log container,
    then select Settings For Event Logs.

    +      - The policy settings appear in the details pane.

    +   2. Double-click the Maximum Application Log Size policy setting.

    +   3. The Maximum Application Log Size policy window appears. Click the check
    box to either enable or disable the policy setting.

    +   4. Use the scroll box to increase or decrease the log size.

    +   5. Click OK.'
  merge: -1
  img_proc: true
- pgno: 573
  md: '# CHOOSING THE MAXIMUM SECURITY LOG SIZE


    The Event Log container of Security settings allows you to configure how the Event
    Log functions for client computers to whom the policy applies. Your second option
    is the maximum Security Log Size. Event Logs are useful, but can use up a lot
    of hard disk space. You can use this policy to set the maximum size of the Security
    Log. The default setting is 512 kilobytes.


    ![](img/763d5ae436311371600c0952a3da9094_573_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_573_1.png)'
