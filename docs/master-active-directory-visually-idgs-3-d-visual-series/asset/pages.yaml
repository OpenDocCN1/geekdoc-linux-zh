- pgno: 563
  md: '# **APPENDIX A**


    # ### GENERATING SECURITY AUDITS


    Security audits are a user right that you can assign to desired individuals or
    groups.


    Security auditing should only be performed by administrative groups. Security
    audits enable administrators to gain information about security events within
    the network and examine potential security problems. This is not a policy you
    want to enable for the general networking community.


    ![](img/763d5ae436311371600c0952a3da9094_563_0.png)


    +   1. Expand the Security Settings container, expand the Local Policies container,
    then select Users Rights Assignment.

    +      - The policy settings appear in the details pane.

    +   2. Double-click the Generate Security Audits policy setting.


    ![](img/763d5ae436311371600c0952a3da9094_563_1.png)


    +   3. The Generate Security Audits policy window appears.

    +   4. Click the check box to either enable or disable the policy setting.

    +   5. Click Add.

    +   6. Select the desired groups, then click OK.

    +      - You can also use the Remove button to remove any existing groups.

    +   7. Click OK.'
  merge: -1
  img_proc: true
- pgno: 564
  md: '# # INCREASING QUOTAS


    Disk Quotas are used to provide a user a certain amount of storage space on a
    server. This policy enables you to give certain individuals or users the right
    to increase existing disk quotas. This is an administrative feature and one that
    should not be assigned to typical users.


    ![](img/763d5ae436311371600c0952a3da9094_564_0.png)


    1. Expand the Security Settings container, expand the Local Policies container,
    then select Users Rights Assignment.


    2. The policy settings appear in the details pane. Double-click the Increase Quotas
    policy setting. The Increase Quotas policy window appears.


    3. Click the check box to either enable or disable the policy setting.


    4. Click Add.


    +   a.  Select the desired groups, then click OK.


    +   b.  You can also use the Remove button to remove any existing groups.


    +   c.  Click OK.'
  merge: -1
  img_proc: true
- pgno: 565
  md: '# APPENDIX A


    # INCREASING THE SCHEDULING OF PRIORITIES


    This policy gives the users or groups you select the right to increase the way
    a computer system schedules priority processing. This action can be used to increase
    the productivity of a workstation, but it is an administrative task that should
    not be performed by typical end-users.


    ![](img/763d5ae436311371600c0952a3da9094_565_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_565_1.png)


    +   1. Expand the Security Settings container, expand the Local Policies container,
    then select User Rights Assignment.

    +       - The policy settings appear in the details pane.

    +   2. Double-click the Increase Scheduling Priority policy setting.

    +       - The Increase Scheduling Priority policy window appears.

    +   3. Click the check box to either enable or disable the policy setting.

    +   4. Click Add.

    +   5. Select the desired groups, then click OK.

    +       - You can also use the Remove button to remove any existing groups.

    +   6. Click OK.'
  merge: -1
  img_proc: true
- pgno: 566
  md: '# LOADING AND UNLOADING DEVICE DRIVERS


    This policy allows the users and groups you select to configure computers by loading
    or unloading device drivers. This policy can be applied to both administrative
    and user accounts, depending if you want your users to be able to configure their
    own system hardware. When a driver is unloaded, the device is essentially removed
    from the system. As drivers are updated for various devices, they may need to
    be installed on your desktop systems, and this policy allows you to determine
    who has that right.


    ![](img/763d5ae436311371600c0952a3da9094_566_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_566_1.png)


    +   1. Expand the Security Settings container, expand the Local Policies container,
    then select Users Rights Assignment.

    +       ▪ The policy settings appear in the details pane.


    +   2. Double-click the Load And Unload Device Drivers policy setting.


    +   ▪ The Load And Unload Device Drivers policy window appears.

    +   3. Click the check box to either enable or disable the policy setting.

    +   4. Click Add.


    +   5. Select the desired groups, then click OK.

    +       ▪ You can also use the Remove button to remove any existing groups.

    +   6. Click OK.'
  merge: -1
  img_proc: true
- pgno: 567
  md: '# LOCKING PAGES IN MEMORY


    This policy allows the users or groups you select to lock system pages into memory.
    This is an advanced operation that should only be performed by administrators,
    and not one you should give to typical users. The lock pages option allows you
    to force a system to hold certain pages in physical memory instead of using a
    pagefile.


    ![](img/763d5ae436311371600c0952a3da9094_567_0.png)


    +   1.  Expand the Security Settings container, expand the Local Policies container,
    then select Users Rights Assignment.

    +       *   The policy settings appear in the details pane.

    +   2.  Double-click the Lock Pages In Memory policy setting.

    +   3.  The Lock Pages In Memory policy window appears.

    +       *   Click the check box to either enable or disable the policy setting.

    +       4. Click Add.

    +   5.  Select the desired groups, then click OK.

    +       *   You can also use the Remove button to remove any existing groups.

    +       6. Click OK.'
  merge: -1
  img_proc: true
- pgno: 568
  md: '# SHUTTING DOWN THE SYSTEM


    This policy gives users or administrators the right to shut down a computer system.
    You can use this policy to prevent certain user groups from shutting down a system
    and grant that right to others.


    ![](img/763d5ae436311371600c0952a3da9094_568_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_568_1.png)


    +   1. Expand the Security Settings container, expand the Local Policies container,
    then select Users Rights Assignment.

    +      - The policy settings appear in the details pane.


    +   2. Double-click the Shut Down The System policy setting.

    +   3. Click the check box to either enable or disable the policy setting.

    +   4. Click Add.


    +   5. The Shut Down the System policy window appears.

    +   6. Select the desired groups, then click OK.

    +      - You can also use the Remove button to remove any existing groups.

    +   7. Click OK.'
  merge: -1
  img_proc: true
- pgno: 569
  md: '# TAKING OWNERSHIP OF FILES AND OTHER OBJECTS


    **W**indows 2000 allows the taking of ownership of files and objects. This feature
    allows one person to create a file and another to take ownership of the file.
    This feature is helpful in a variety of circumstances, such as when an employee
    leaves the company. You determine which users or groups have the ownership right
    by configuring this policy. Under most circumstances, the take ownership right
    should be restricted to administrators or other administrative type groups.


    ![](img/763d5ae436311371600c0952a3da9094_569_0.png)


    +   **1** Expand the Security Settings container, expand the Local Policies container,
    then select Users Rights Assignment.

    +   * The policy settings appear in the details pane.


    +   **2** Double-click the Take Ownership Of Files And Other objects policy setting.


    +   **3** Click the check box to either enable or disable the policy setting.

    +   **4** Click Add.


    +   **5** Select the desired groups, then click OK.

    +   * You can also use the Remove button to remove any existing groups.

    +   **6** Click OK.'
  merge: -1
  img_proc: true
- pgno: 570
