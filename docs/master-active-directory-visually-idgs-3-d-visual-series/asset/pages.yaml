- pgno: 49
  md: '# ACCESSING ADMINISTRATIVE TOOLS AND CONTROL PANEL


    Before you install and configure Active Directory, you need to have a good handle
    on the location and configuration of several networking items in Windows 2000
    Server.


    Windows 2000 Server is a complex operating system that offers a variety of technologies,
    tools, and


    services. For the Active Directory, you are primarily going to use the networking
    interfaces to configure your server as necessary for your network environment.
    The two major locations for accessing networking tools and services are the Start
    menu and Control Panel. The tools that are installed with Active Directory appear
    in these


    locations. You also have the option to install and configure many networking components
    through a new program called "Configure Your Server," which is available in the
    Administrative Tools folder. Configure Your Server provides you a graphical interface
    that looks similar to a Web page.


    ![](img/763d5ae436311371600c0952a3da9094_49_0.png)


    +   **ACCESSING ADMINISTRATIVE TOOLS**

    +   1. Choose Start\Programs\Administrative Tools.

    +      ■ The Administrative Tools submenu appears.


    2. Click the tool that you want to open.


    +   **ACCESSING CONTROL PANEL**

    +   1. Double-click My Computer on the desktop, and then double-click Control
    Panel.


    26'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# TIPS


    # Is there a difference between using the Start menu or Control Panel?


    No. All administrative tools that are available appear in the Start menu under
    Administrative Tools. Shortcuts to these tools also appear in the Control Panel
    Administrative Tools folder.


    # What are some of the most common administrative tools?


    Aside from the Active Directory tools that will appear once you install the Active
    Directory, the following points out some of the most common administrative tools,
    many of which you may recognize from NT Server 4.0:


    +   DNS—allows you to configure DNS on your server.


    +   Internet Services Manager—allows you to configure your server to be a web
    server.


    +   Licensing—allows you to manage server and client licensing.


    +   Performance—opens Performance Monitor.


    +   WINS—allows you to configure WINS on your server


    +   DHCP—allows you to configure DHCP on your server.


    +   Services—enables you to manage the various server services that are running.


    ![](img/763d5ae436311371600c0952a3da9094_50_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_50_1.png)


    1 Control Panel contains a number of configuration tools.


    2 Double-click the Administrative Tools folder.


    The Administrative Tools window shows all the available tools.'
