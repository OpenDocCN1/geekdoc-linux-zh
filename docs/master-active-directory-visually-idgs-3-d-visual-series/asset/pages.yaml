- pgno: 571
  md: '# APPENDIX A


    # MANAGING AUDITING AND SECURITY LOG


    The Audit and Security logs store audit and security information for the local
    machine. The logs are used by administrators to gain an understanding of how the
    computer is being used and who is using the computer. The Managing Auditing And
    Security Log policy allows you to assign rights to users or groups so that those
    users or groups can manage the auditing and security log. This task is an administrative
    or power user function.


    ![](img/763d5ae436311371600c0952a3da9094_571_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_571_1.png)


