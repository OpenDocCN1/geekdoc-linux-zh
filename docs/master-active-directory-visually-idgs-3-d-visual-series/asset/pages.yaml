- pgno: 231
  md: 'CHAPTER 8 PLANNING THE ACTIVE DIRECTORY NAME


    # INTERNET PRESENCE AND NAMING OPTIONS


    As mentioned in the previous section, you can use the same Active Directory DNS
    name you use on the Internet. However, some other options may serve your business
    or organization more effectively. Using the same Internet domain name as your
    local network domain name, as shown below, provides the easiest administration
    and makes your network naming scheme seamless with your Internet naming scheme.
    However, many businesses separate the two for greater


    Active Directory security against the Internet. If your external naming scheme
    is the same as your internal naming scheme, Internet intruders have a greater
    chance of gaining access to your internal network. The following sections point
    out some additional possibilities you may want to consider if you are hosting
    an Internet domain name that provide greater security features.


    ![](img/763d5ae436311371600c0952a3da9094_231_0.png)


    208'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Use a subdomain for the Active Directory


    You can use a subdomain of your Internet domain name for your Active Directory
    implementation. With this solution, the root domain is exposed to the Internet,
    but the subdomain naming scheme is not. In other words, Internet users can see
    alphatoys.com, but because alphatoys.com is not your internal root domain, your
    internal network is more “hidden” from Internet users.


    For example, Wilson-Adams decides to use wilsonadams.com for its Internet presence,
    but use a subdomain for its Active Directory naming scheme. In this case, the
    root domain could become local.wilsonadams.com (or any subdomain name) and its
    child domains would be tulsa.local.wilsonadams.com, sandoiego.local.wilsonadams.com,
    and so forth.


    This solution requires you to create a new DNS zone to host the subdomain, and
    the subdomain requires its own DNS server. In the root domain, you need a delegation
    record to the other DNS server in the subdomain. DNS zones are network segments
    where particular DNS servers have authority and a delegation record allows the
    two zones to exchange DNS records. You can learn more about DNS in Chapter 6.


    The advantage to this design is that your Active Directory domain tree is isolated
    from the root domain and more invisible to would-be intruders.


    ![](img/763d5ae436311371600c0952a3da9094_232_0.png)'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Use a firewall to separate the private network


    You can also implement a firewall to protect your private network from the public
    network. This solution enables you to use the same root domain, such as wilsonadams.com
    for the private and public network, but a firewall (or proxy server) separates
    the two. In this case, two DNS zones are created, one on each side of the firewall.
    The external DNS server would maintain records for hosts that are accessed via
    the Internet. The internal DNS server would maintain records for the internal
    hosts and Active Directory objects. The firewall is used to manage the traffic
    between the two while keeping unauthorized persons out of the private network.
    This solution is effective, but can be challenging to implement and maintain if
    your internal clients need to have Internet access.


    # Using a private DNS domain name


    A new draft exists for a first-level domain, the local domain, which is reserved
    for private use. This reserved, private, first-level domain enables you to have
    a DNS naming scheme, such as wilsonadams.local, to effectively separate your Internet
    domain name from your local domain name. To accomplish this, you need to create
    a DNS zone where *yourname*.local is the root domain. The advantage is that your
    local network is separated from the Internet. The disadvantage is this private
    name cannot be registered for use on the Internet, and to change the DNS root
    later requires reinstallation of the Active Directory forest.'
  merge: -1
  img_proc: true
