- pgno: 442
  md: '# TIPS


    # Should most users or groups be given advanced property settings?


    In general, the standard settings, such as Full Control, Read, Write, and so forth,
    are all you need to implement an effective security policy. You should use the
    advanced rights for situations in which you need finer control of what a user
    or group can do with permissions.


    # What group should have Full Control permission over a domain?


    The enterprise admins group in Windows 2000 is established for an Active Directory
    implementation. Enterprise admins are those administrators that configure and
    administer the Active Directory. In most circumstances, only the enterprise admins
    group should have Full Control. Before assigning Full Control to another group
    or user, you should carefully examine your security plan.


    ![](img/763d5ae436311371600c0952a3da9094_442_0.png)


