    \ uses to communicate with another computer. Depending on the clients in your\
    \ network, you may need to install additional protocols. For example, Novell Netware\
    \ clients require the NWLink protocol to communicate with Microsoft clients, and\
    \ Apple Macintosh clients require the AppleTalk protocol.\n\n![](img/763d5ae436311371600c0952a3da9094_72_1.png)\n\
    \n![](img/763d5ae436311371600c0952a3da9094_72_2.png)\n\n+   □ The new protocol,\
    \ service, or client now appears in the list.  \n+      7 Click Properties. □\
