- pgno: 100
  md: "![](img/763d5ae436311371600c0952a3da9094_100_0.png)\n\n# Should I make the\
    \ lease time shorter?\n\nYou can define any multicast lease time that you would\
    \ like. However, unless you have a specific reason for changing the default, the\
    \ 30 lease is sufficient. Due to the nature of multicasting, you do not need shorter\
    \ lease times for security purposes, and as long as you have multicast IP addresses\
    \ available in the pool, you should not need a shorter lease time.\n\n# Why can’t\
    \ I just assign a static multicast address to all my multicast clients.\n\nYou\
    \ could assign a static multicast address to your multicast clients so that all\
    \ clients have a static address. However, this manual configuration requires a\
    \ lot of planning and implementation time on your part because you have to manually\
    \ assign a multicast address to each client. Also, there is a great chance of\
    \ errors or duplicate addresses that are difficult to track down. MDHCP is designed\
    \ to remove this administrative burden from you, so letting MDHCP manage the multicast\
    \ leases is best.\n\n![](img/763d5ae436311371600c0952a3da9094_100_1.png)\n\n![](img/763d5ae436311371600c0952a3da9094_100_2.png)\n\
