- pgno: 580
  md: '# RETENTION METHOD FOR

    APPLICATION LOG


    Configuring the retention

    method for security logs

    enables you to determine

    how events are overwritten. You

    have three options: you can

    overwrite events by day, you can


    overwrite events only as needed,

    or you can choose not overwrite

    events at all. If you choose the last

    option, then you will be forced to

    manually clear the log. The most

    efficient setting in most


    circumstances is to overwrite

    events as needed. This ensures

    that you do not overwrite more

    events than necessary, but still

    allows the Event Log to create

    needed room.


    ![](img/763d5ae436311371600c0952a3da9094_580_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_580_1.png)


    +   1. Expand the Security

    +   Settings container, expand

    +   the Event Log container,

    +   then select Settings For

    +   Event Log.

    +   The policy settings appear

    +   in the details pane.


    +   2. Double-click the

    +   Retention Method For

    +   Application Log policy

    +   setting.


    +   3. The Retention Method For

    +   Application Log policy

    +   window appears.

    +   Click the check box to

    +   either enable or disable the

    +   policy setting.


    +   4. Click either the Enabled

    +   or Disabled radio button.

    +   5. Click OK.'
  merge: -1
