- pgno: 475
  md: '# APPLYING GROUP POLICIES TO THE ACTIVE DIRECTORY


    You use either the Active Directory Users and Computers snap-in or the Active
    Directory Sites and Services snap-in to apply group policies to Active Directory
    sites, domains, or OUs. You can do this by accessing the properties sheets and
    clicking Group Policy. From this location,


    you can apply the desired Group Policy to the site, domain, or OU.


    If you click Edit, you can also make changes to the policy, and those changes
    apply to that particular site, domain, or OU. This feature is useful if you want
    to use the same Group Policy for two domains, but


    alter them slightly. You can simply make the changes from this location and the
    changes apply to only that site, domain, or OU.


    As far as policy configuration is concerned, all the options work the same as
    when you use the manual snap-in.


    ![](img/763d5ae436311371600c0952a3da9094_475_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_475_1.png)


    +   1. Choose Start►Programs► Administrative Tools►Active Directory Users and
    Computers.


    +   • Or, choose Start►Programs► Administrative Tools►Active Directory Sites and
    Services if you want to apply a Group Policy to a site.


    +   2. Select the domain or OU to which you want to apply the Group Policy and
    then choose Action►Properties.'
  merge: -1
  img_proc: true
- pgno: 476
  md: '# **Tips**


    # **Can I create a new Group Policy from this location?**


    Yes. If you want to create a new Group Policy from the Group Policy properties
    sheet, simply click **New** and a new policy object appears in the window. You
    can enter a name for the policy, select it, and then click **Edit** to begin configuring
    the policy for that site, domain, or OU. The configuration options are the same
    as when you use the manual snap-in.


    ![](img/763d5ae436311371600c0952a3da9094_476_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_476_1.png)


    **3** Click the Group Policy tab.


    **4** Use these buttons to add, remove, edit, delete, select options, or view
    properties for a Group Policy you want to apply.


    If you click **Edit**, the snap-in window appears. You can make direct changes
    from this location that apply to this site, domain, or OU.'
  merge: -1
  img_proc: true
- pgno: 477
  md: '# **CHAPTER 26** PUBLISHING ACTIVE DIRECTORY RESOURCES


    # # SHARING FOLDERS


    S om e Active Directory resources, such as users and groups, are automatically
    published when they are created in the Active Directory. However, other resources,
    such as files, folders, applications, and down-level printers, must first be shared
    on the computer where they reside. Then they must be placed in the Active Directory
    so that other users can access these resources.


    You can share folders so that they are placed in the Active Directory. Typically,
    a group of files or applications are placed in an appropriate folder and the folder
    is shared. The network administrator(s) determine in what OU the shared folder
    should reside, and then it can be published so that Active Directory users can
    find the folder that contains the files or applications they need.


    In order to publish a folder to the Active Directory, you must first share it
    on that computer.


    ![](img/763d5ae436311371600c0952a3da9094_477_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_477_1.png)'
  merge: -1
  img_proc: true
- pgno: 478
  md: '![](img/763d5ae436311371600c0952a3da9094_478_0.png)


    # Can I share an individual file without sharing a folder?


    You can share individual files under the NTFS file system, but under most circumstances
    those shared files should be placed in a folder. Placing files in a folder allows
    ease of administration, and you can group similar documents in one folder.


    # Where is Windows Explorer? I would rather use Explorer to view my drives and
    folders.


    Windows Explorer, which you used extensively in Windows 9x and Windows NT, is
    provided in Windows 2000 for backwards compatibility and user ease. You can now
    access Windows Explorer by clicking Start\ Programs\ Accessories\ Windows Explorer.


    # If I share an application folder, is the application downloaded to the client
    when the client runs it?


    No. Shared applications reside on a server or server farm. When a user accesses
    the shared application and runs the application, the server or computer actually
    runs the application, performs all processing, and sends the information to the
    client.


    ![](img/763d5ae436311371600c0952a3da9094_478_1.png)


    The drive window appears.


    ![](img/763d5ae436311371600c0952a3da9094_478_2.png)


    Select the folder you want to share.


    Choose File→Properties.'
  merge: -1
  img_proc: true
- pgno: 479
  md: '# **SHARING FOLDERS CONTINUED**


    You can share folders on any Windows 2000 computer or down-level Windows computer,
    such as 9x or NT. After an administrator or user shares a folder, he or she can
    set permissions for the folder. This determines who can access the folder and
    the contents in the folder.


    By default in Windows 2000, the Everyone group has Full Control permissions for
    a shared folder. If no overriding permissions for the contents in the folder exist,
    the Everyone group has full control of the documents as well. In most cases, you
    want to change this to Read only or at least a more restrictive permission. For
    private documents, you can simply remove the Everyone group and select users for
    whom you want to provide permissions.


    When assigning permissions, you want to determine who you want to access the folder
    and its contents and then determine what level of permissions those different
    groups or individuals should be assigned. Normally, you only want to allow a few
    trusted users to have full control of a shared folder.


    ![](img/763d5ae436311371600c0952a3da9094_479_0.png)


    +   6 Click the *Sharing* tab.


    +   7 Click this radio button to share the folder.


    +   8 Type a name for the share.


    +   9 Click Permissions.'
  merge: -1
  img_proc: true
- pgno: 480
  md: "# TIPS\n\n# Can I give access permissions to only a few people?\n\nYes, you\
    \ can assign the desired permissions to only a few users and deny all permissions\
    \ for all others. However, if this is the case, you should question whether you\
    \ should actually store the folder in the Active Directory. Because only a few\
    \ people are allowed access, you may wish to consider other means of sharing the\
    \ folder rather than placing an object in the Active Directory.\n\n# Can I give\
