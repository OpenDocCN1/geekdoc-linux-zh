- pgno: 373
  md: '# CHANGING THE OPERATIONS MASTER


    You can change the operations master for the domain by connecting to a different
    domain controller in the domain and transferring the role to that domain controller.


    An *operations master* is a domain controller that is assigned one or more special
    roles within an Active Directory domain. Domain controllers that are assigned
    the role of operations master perform tasks that are called *single-master*. In
    other


    words, these tasks must be performed by the operations master domain controller
    and are not permitted to occur at different places on the network at the same
    time. The operations master can handle such tasks as resource identifier allocation,
    schema modification, PDC elections, and so forth. A major role of the operations
    master is to perform domain-naming operations. The operations master makes certain
    that all domain names are unique.


    Typically, only one domain controller in the Enterprise performs the role of operations
    master. By default, the first domain controller where the Active Directory is
    installed in the root domain becomes the operations master. You can, however,
    change this role to another domain controller by using the Active Directory Domains
    and Trusts snap-in.


    ![](img/763d5ae436311371600c0952a3da9094_373_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_373_1.png)


    **1** Choose Start▸Programs▸Administrative Tools▸Active Directory Domains and
    Trusts.


    The console opens.


    **2** Select Active Directory Domains and Trusts.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '![](img/763d5ae436311371600c0952a3da9094_374_0.png)


    # What permissions do I need to change the operations master?


    ✂ Permissions may vary depending on your network configuration, but generally,
    you need to be a member of the Enterprise Admins group. For most Active Directory
    operations, your user account should be a member of this group so that you can
    have proper permissions to handle Enterprise tasks and issues, such as transferring
    the operations master role.


    # Is there more than one operations master role?


    ✂ Yes. By using the transfer option, you are transferring the operations master
    that handles domain naming, which is called the *domain-naming master*. Other
    operations master roles exist, depending on your Enterprise configuration, including
    Schema Master, Relative ID Master, PDC Emulator, and Infrastructure Master. These
    master roles are automatically configured by the Active Directory. For example,
    if you upgrade a PDC from Windows NT 4.0 in a mixed environment, that server will
    automatically be a PDC Emulator.


    ![](img/763d5ae436311371600c0952a3da9094_374_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_374_2.png)


    +   **3** Choose **Action**\> **Operations Master**.


    +   **4** Click **Change** to transfer the operations master role to the other
    domain controller you have connected to.


    +   **5** Click **Close**.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# CREATING UPN SUFFIXES


    Every user account is given a User Principal Name (UPN). The UPN is made up of
    a prefix and a suffix. The prefix is the user''s logon name, such as jwilliams.
    The prefix is the domain name, such as corp.com. The prefix and suffix are combined
    with the @ symbol to create the UPN, such as jwilliams@corp.com. The UPN functions
    as both a username in a Windows 2000 network and an e-mail address.


    Typically, the UPN suffix is the domain name; however, you can assign additional
    UPN suffixes to provide additional security and to simplify the logon process
    in a Windows 2000 domain tree or forest.


    You use the Active Directory Domains and Trusts to assign additional UPN suffixes
    for the domain. For example, in a domain tree that has several subdomains, a user''s
    logon name could be


    jwilliams@production.tx.america.corp.com. You can simplify this by assigning an
    alternative UPN for this particular domain. For example, you could substitute
    the long domain name (production.tx.america.corp.com) with prodtx. Now, the user
    can logon with the optional suffix as jwilliams@prodtx.com. This option can be
    particularly effective in large enterprise environments.


    ![](img/763d5ae436311371600c0952a3da9094_375_0.png)


    +   1 Choose Start ProgramsAdministrative ToolsActive Directory Domains and Trusts.


    ![](img/763d5ae436311371600c0952a3da9094_375_1.png)


    The console opens.


    +   2 Select Active Directory Domains and Trusts.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# **TIPS**


    # **Wouldn''t the domain name have to be changed to use a new UPN?**


    No. The purpose of additional UPN suffixes is to substitute the real domain name
    for another one. In other words, the new UPN suffix acts as an alias. This can
    provide greater security because users can logon without revealing the actual
    Active Directory structure (production.tx.namerica.corp.com) during the logon
    process. This feature also simplifies user logon by making the domain name shorter.


    # **Can I have more than one UPN suffix?**


    Yes, but under normal circumstances, just one is enough. If you wanted some users
    in the domain to logon using different UPN suffixes, then you could create additional
    suffixes. However, you should carefully consider creating more than one UPN suffix
    and whether it can actually benefit your domain. You do not want to make the logon
    process confusing for users either.


    ![](img/763d5ae436311371600c0952a3da9094_376_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_376_1.png)


    +   5. **Choose Action -> Properties.**


    +   4. **Type a new UPN suffix in the Alternative UPN Suffixes box.**

    +   5. **Click Add.**

    +   6. **You can remove any suffixes in the list by selecting them and clicking
    Remove.**

    +   7. **When you finish adding or removing suffixes, click OK.**'
  merge: -1
  img_proc: true
