- pgno: 481
  md: '# SHARING FOLDERS CONTINUED


    After you have the security permissions configured for the shared folder, you
    can place your documents or even applications in the shared folder. Then, you
    can access the properties sheets for those shared documents or applications. This
    way, you can set different permissions for each item that exists in the shared
    folder.


    All shared folders on your computer are displayed with a hand under the folder
    icon. You can stop sharing a folder at any time by accessing the properties sheet
    for the folder and clicking the button on the Sharing tab to stop sharing the
    folder. When you perform this action, all the documents or applications in the
    shared folder stop being shared as well.


    With shared folders, documents, and applications published in the Active Directory,
    you can allow users in an Enterprise network to access the information in the
    shared folder. The next sections shows you, as the administrator, how to publish
    a shared folder in the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_481_0.png)


    **16** Select the new user(s) or group(s) you added.


    **17** Click the appropriate check boxes to allow or deny permissions.


    **18** Click **Apply**.


    **19** Click **OK**.'
  merge: -1
  img_proc: true
- pgno: 482
  md: '# Can I add or remove documents from a shared folder as necessary?


    Yes. You can add documents to a shared folder as needed. When you add a document,
    you should make certain that you set the desired permissions for the file.


    # Can I store a document in a shared folder without sharing the document?


    Yes. You can store a document in a shared folder and simply deny all access to
    the Everyone group on the document’s Security tab on the properties sheet. Users
    can see the file but cannot access it. Generally, this is not a good practice.
    If you have documents that should not be shared, then you should store those documents
    in folder that is not shared. This avoids confusion and removes unnecessary clutter
    from the shared folder.


    ![](img/763d5ae436311371600c0952a3da9094_482_0.png)


    **20** Click OK to complete the sharing task.


    ![](img/763d5ae436311371600c0952a3da9094_482_1.png)


    The folder is now shared, as indicated by the hand that appears under the folder.'
  merge: -1
  img_proc: true
- pgno: 483
  md: '# PUBLISHING A SHARED FOLDER


    After an administrator or user shares a folder, that folder can then be published
    to the Active Directory. Publication allows users to find the shared folder through
    an Active Directory LDAP search.


    Only administrators with appropriate permissions can add a shared folder to the
    directory. Typically, a shared folder resides in some OU, and the administrator
    that manages that particular OU adds the shared folder.


    This is an easy and quick process. All you need to do to publish a shared folder
    is enter a name for the shared folder that Active Directory users can see and
    the network path to the shared folder, such as \\server1\documents.


    After you share the folder, users can find the folder through the search function,
    or they can find it by browsing the directory using My Network Places.


    ![](img/763d5ae436311371600c0952a3da9094_483_0.png)


    1. Choose Start->Programs \->Active Directory Users and Computers.


    2. The console opens.'
  merge: -1
  img_proc: true
- pgno: 484
  md: "![](img/763d5ae436311371600c0952a3da9094_484_0.png)\n\n# Does the Active Directory\
    \ upload and store the shared folder and documents in the folder on a domain controller?\n\
    \nNo. The Active Directory simply stores information about the shared folder so\
    \ that users can locate it. When a user finds the shared folder in the Active\
    \ Directory and wants to access it, the request is redirected to the computer\
    \ that physically houses the shared folder. Active Directory uses the LDAP functionality\
    \ to locate the shared folders on the network. At that computer, permissions are\
    \ checked and access is either granted or denied.\n\n# Is the network path to\
    \ the shared folder revealed to Active Directory users?\n\nNo. The users are not\
    \ aware of the shared folder's physical location on the network. This is by design\
    \ so that users do not have to remember which servers or computers hold which\
    \ resources. They simply access the shared folder in the Active Directory, and\
    \ the redirection process to the computer that physically houses the shared folder\
    \ is invisible to user.\n\n![](img/763d5ae436311371600c0952a3da9094_484_1.png)\n\
    \n![](img/763d5ae436311371600c0952a3da9094_484_2.png)\n\n+   2. Select the OU\
    \ in which you want to place the shared folder.\n+   \n+   3. Choose Actions\\\
    New\\Shared Folder.\n+   \n+   4. Type a name for the shared folder.\n+   \n+\
    \   5. Type the UNC network path to the shared folder.\n+   \n+   6. Click OK."
  merge: -1
  img_proc: true
