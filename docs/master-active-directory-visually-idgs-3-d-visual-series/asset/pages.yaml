- pgno: 193
  md: '# # ENABLING REMOTE ACCESS SERVICE


    Remote Access Service (RAS) allows remote network clients to establish a remote
    connection with a RAS server. After the connection is established, RAS clients
    function just like locally connected network clients—they can browse the network,
    access resources, and perform all tasks available through a local connection.
    A RAS client can perform all these actions, if they are allowed to by RAS configuration,
    and they can use the Active Directory.


    Although RAS is not technically a part of Active Directory’s operation, I include
    it in this book because of its networking mature and growing usage. As more users
    become mobile, users will access RAS more often. RAS in Windows 2000, formally
    called Routing and Remote Access Service (RRAS) in Windows NT, is an integrated
    part of the operating system and is installed by default when you install Windows
    2000 Server. In order to configure your server to be a RAS server, you have to
    enable RAS and configure it so it provides the functionality needed.


    ![](img/763d5ae436311371600c0952a3da9094_193_0.png)


    +   1. Click Start->Programs->Administrative Tools->Routing and Remote Access.

    +   2. The RAS snap-in appears with your server icon and a note about enabling
    RAS.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '![](img/763d5ae436311371600c0952a3da9094_194_0.png)


    # Why is RAS installed by default?


    Windows 2000 expects you to use RAS. With the distributed nature of networks today
    and the mobility of users, most network environments need to use RAS to give remote
    network clients access to the network. Windows 2000 installs the service by default,
    but you can remove it from the system by using Add/Remove Programs in Control
    Panel if desired.


    # Do I have to enable RAS?


    RAS exists in your operating system, but it is not configured or enabled. If you
    want to use your Windows 2000 server as a RAS server, then you need to configure
    and enable RAS.


    # If I enable RAS, can I later remove it from my server?


    RAS is installed by default on your operating system. If you configure RAS for
    use, then later decide not to use the server as a RAS server, you can disable
    the service. See the next section to find out how to disable RAS.


    ![](img/763d5ae436311371600c0952a3da9094_194_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_194_2.png)


    +   2. Select your server, and then click Action>Configure and Enable Routing
    and Remote Access.


    +   3. The Routing and Remote Access Configuration Wizard begins.


    +   3. Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# ENABLING REMOTE ACCESS SERVICE

    CONTINUED


    To enable and configure RAS, you use the Action menu for your server. A wizard
    appears that guides you through the configuration process. As you configure RAS,
    you need to make some important decisions.


    First, you can choose to allow your server to function as a router, for either
    the local network or for both local and remote networks (LAN and WAN). A router
    passes TCP/IP traffic to different subnets so that


    communication among subnets can occur. By selecting the check box, your server
    can function as a router and help manage network traffic.


    Next, you have to click a check box to enable remote access. This allows remote
    clients to gain access to the local network through your server. These two features
    together enable you to configure your server for both routing and RAS, or as one
    or the other.


    Next, you have to select which external adapters (such as NICs, modems, ISDN,
    and so on) are configured for routing and remote access. The options allow you
    to enable all external devices, enable all devices for routing only, enable all
    devices for remote access only, or choose to configure your devices individually.


    ![](img/763d5ae436311371600c0952a3da9094_195_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_195_1.png)


    +   4. Click this check box to enable your server as a router.

    +   5. Click the appropriate radio button to enable local routing only or local
    and remote routing.

    +   6. Click this check box to enable Remote Access.

    +   7. Click Next to continue.


    +   8. Click the appropriate radio button to configure your external adapter(s)
    as required.

    +   9. Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# **What authentication and encryption methods should I use?**


    First, you can choose all methods. This allows clients to submit their passwords
    to the RAS server for authentication using any authentication method available,
    including clear text. Obviously, this choice is not very secure. You can also
    choose to use only methods that secure the users'' passwords, which basically
    means that passwords must be encrypted. This feature is more secure, but may cause
    problems for some network clients. You can fine-tune these features after you
    configure the RAS server, and policies that you implement on your network also
    drive the configuration as well.


    # **Which protocol and access features should I use?**


    Next, you select the protocol that RAS users must use to connect to the RAS server.
    This is normally TCP/IP. You also select whether to allow RAS clients to access
    only the RAS server or the entire network. The entire network feature is less
    secure, but it gives the RAS users the most access to Active Directory and network
    resources.


    ![](img/763d5ae436311371600c0952a3da9094_196_0.png)


    **10** Click the appropriate radio button to allow either all methods of authentication
    or only secure methods.


    **11** Click Next to continue.


    ![](img/763d5ae436311371600c0952a3da9094_196_1.png)


    **12** Select the protocol clients use for dial-up connections.


    **13** Click the appropriate radio button for either Access this server only or
    Access entire network.


    **14** Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# ENABLING REMOTE ACCESS SERVICE


    CONTINUED


    Next, you decide whether you want RAS clients to use DHCP or whether you want
    to define a static IP address pool. As you may recall, DHCP leases IP addresses
    to client computers so that they can participate on a TCP/IP network. This feature
    enables client IP configuration to occur automatically and without the administrative-intensive
    task of manual IP address assignment. You can configure RAS so that RAS clients
    are authenticated by the RAS server and then receive a DHCP IP lease from a DHCP
    server. However, some network environments choose to provide a static pool of
    IP addresses that can be assigned to RAS clients. This is a security feature to
    prevent RAS clients from being completely integrated into the network. If you
    choose this option, then the RAS wizard asks you to create a pool of IP addresses
    for RAS client leases. Obviously, you must supply a pool of IP addresses that
    are appropriate for your network and also supply an appropriate subnet mask.


    ![](img/763d5ae436311371600c0952a3da9094_197_0.png)


    15 Click the appropriate radio button to allow RAS clients to use DHCP or define
    a static pool for RAS clients.


    16 Click Next to continue.


    ![](img/763d5ae436311371600c0952a3da9094_197_1.png)


    17 If necessary for your environment, click this check box to forward file and
    print sharing broadcast packets.


    18 Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'When you reach the final wizard screen, you see several pieces of information
    that are important to note.


    First, if you enabled routing and/or remote access, you can manage further configuration
    from the RAS snap-in. The wizard configures the basic details, but you will most
    likely need to perform further configuration to enable the RAS server to function
    as desired.


    Next, the wizard informs you that user settings are managed through the Active
    Directory, which you learn about in Chapters 14 and 15. Also, policies based on
    site, domain, and OU levels may be applied so they affect RAS settings. Group
    Policies are a powerful feature of Windows 2000 and the Active Directory that
    gives you more administrative control and prevents many end-user problems. You
    can learn more about policies in the Active Directory in Chapter 25.


    ![](img/763d5ae436311371600c0952a3da9094_198_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_198_1.png)


    +   **19** Click Finish to complete the process.


    +   **20** Click Yes to start the service.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# ## DISABLING RAS


    RAS is installed on your server by default. However, you must enable it in order
    for your server to become a RAS Server. Just as you can enable the RAS service,
    you can also disable it.


    There are a number of reasons for disabling the RAS service. A major reason is
    a change in the role your


    server plays on the network. As networks grow and change, servers are often moved
    to different locations or are reconfigured to perform a different set of tasks.
    If the time comes when you no longer want your server to authenticate dial-in
    clients through RAS, you can disable the service. After the service is disabled,
    clients can not dial-in


    and be authenticated by the server, but will have to use other RAS servers that
    may be available. Before disabling the RAS service, make certain that you have
    a specific reason for doing so and make certain that other RAS servers are available
    to clients.


    ![](img/763d5ae436311371600c0952a3da9094_199_0.png)


    +   1. Choose **Start** > **Programs**>**Administrative Tools**>**Routing and
    Remote Access**.


    +   2. Select the server in the console for which you want to disable RAS.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# TIPS


    If I disable RAS, can I re-enable it?


    Yes. As with many services in Windows 2000, you can easily disable or re-enable
    RAS as necessary. This feature allows you to permanently take a RAS server offline
    so that the service is no longer available to clients, or you can take the service
    offline temporarily while you perform troubleshooting or system configuration.
    However, if you disable it, the service prompts you to re-run the setup wizard
    in order to start the service again. Generally, you should avoid disabling the
    RAS service unless you plan to permanently do so in order to avoid additional
    configuration.


    If I disable RAS, are all of my previous settings removed?


    Yes. If you disable the RAS service, you can always re-enable it later. However,
    you will be prompted to re-configure the service through setup wizard. You cannot
    disable the service and preserve the previous settings.


    ![](img/763d5ae436311371600c0952a3da9094_200_0.png)


    3 Choose Action → Disable Routing and Remote Access.


    ![](img/763d5ae436311371600c0952a3da9094_200_1.png)


    4 Click Yes to confirm that you want to disable RAS.'
  merge: -1
  img_proc: true
- pgno: 201
  md: "# # EXAMINING BASIC RAS OPTIONS\n\nAs with other networking components in Windows\
    \ 2000 Server, you have the option to manage your RAS server from within the RAS\
    \ console, but you can also add other RAS servers (and routing servers) to the\
    \ console for management. This feature makes it easy for you, as the administrator,\
    \ to manage all your RAS servers from one central location. Instead of having\
    \ to physically visit each machine, you can load each server into one console\
    \ and manage them all from one location.\n\nYou can also adjust the Refresh rate\
    \ for all RAS servers loaded into the console. By default, RAS servers are refreshed\
    \ every 60 seconds, but you can change this value as needed. After you make a\
    \ change, this value affects all RAS servers in your RAS console. Typically, the\
    \ 60-second interval is enough and you should not need to change this setting,\
    \ unless you have specific reasons for lowering the refresh rate.\n\n![](img/763d5ae436311371600c0952a3da9094_201_0.png)\n\
    \n+   1. Select RAS in the console, and then choose Action » Add Server.\n+  \
    \ \n+   2. Click the appropriate radio button to add another RAS or Routing server\
    \ to the console.\n+   \n+   3. Click OK."
  merge: -1
  img_proc: true
- pgno: 202
  md: '# TIPS


    # What permission do I need to manage all RAS servers on my network from my server?


    +   One person can manage most networking components from one location. This design
    allows your network to have a RAS administrator whose main job focus is to manage
    all the RAS servers and make certain they are working properly for your environment.
    This manager needs to be a member of the Enterprise Admins group so that he or
    she can authoritatively control other servers in the Enterprise. With this permission,
    the RAS administrator can manage all RAS servers from his or her own server.


    # Do I ever need to lower the refresh rate?


    By default, the refresh rate is every 60 seconds. You might need to lower the
    refresh rate for troubleshooting purposes, but for the most part, the default
    setting is all you need.


    ![](img/763d5ae436311371600c0952a3da9094_202_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_202_1.png)


    +   4 Choose Action: Refresh Rate.


    +   5 Adjust the Refresh Rate as desired.


    +   6 Click OK.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# ## EXPLORING SERVER PROPERTIES


    T he good thing about most wizard setups is that you can change the configuration
    later. In other words, the decisions you make during the initial setup are not
    "written in stone." You can make changes to that configuration without rerunning
    the wizard. RAS is no exception.


    By accessing the properties sheet for the RAS server, you can make a number of
    configuration changes.


    First, the General tab enables you to change the role the RAS server plays. You
    can either enable or disable the computer as a router, RAS server, or both, just
    as you did during setup.


    The Security tab enables you to choose between Windows authentication for clients
    or RADIUS authentication. You can also select


    between the Windows accounting provider and the RADIUS Accounting provider. This
    feature allows you to use RADIUS servers in your network. For the security options,
    you can click the Configure button and select a number of options, which are explained
    on the next page.


    ![](img/763d5ae436311371600c0952a3da9094_203_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_203_1.png)'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# What authentication methods can I choose?


    You can choose the following authentication choices, listed from most secure to
    least secure:


    +   * Extensible Authentication Protocol (EAP)—This protocol allows the use of
    third-party authentication software and is also used for Smart Card login.

    +   * MS-CHAP v2—This generates encryption keys during RAS authentication negotiation.

    +   * MS-CHAP—This is the previous version that provides secure login.

    +   * CHAP—CHAP is Challenge Handshake Authentication Protocol, an early version
    of MS-CHAP that provides secure login.


    +   * Shiva Password Authentication Protocol (SAP)—This is used by Shiva clients
    connecting to a Windows 2000 RAS server. SAP is more secure than CHAP, clear text,
    but less secure than PAP.

    +   * Unencrypted password (PAP)—Unencrypted passwords are sent in clear text—no
    encryption required.

    +   * Unauthenticated access—Unauthenticated access allows a user to access the
    network without authentication. Obviously, this provides no security.


    ![](img/763d5ae436311371600c0952a3da9094_204_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_204_1.png)


    3 Click the appropriate check boxes to change the configuration of the RAS server.


    4 Click the Security tab.


    5 Click the drop-down boxes to make changes to the Authentication and/or Accounting
    provider.'
  merge: -1
  img_proc: true
- pgno: 205
