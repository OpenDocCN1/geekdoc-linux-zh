- pgno: 46
  md: '# Ipconfig


    *Ipconfig* is a popular utility that gives you additional information about your
    current settings, such as the IP Address, Subnet Mask, Default Gateway, and DNS,
    WINS, and DHCP servers. You can type **ipconfig** at the command line to get this
    information, or you can type ipconfig /all at the command line to have complete


    information returned to you. This information will include all of your computer’s
    IP configuration information, such as DHCP lease, MAC (Media Access Control) address,
    and so forth. As with Netstat, you can type **ipconfig** ? to view the available
    switches to refine the information returned.


