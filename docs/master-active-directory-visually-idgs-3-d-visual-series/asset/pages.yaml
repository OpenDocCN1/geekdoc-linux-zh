    +   3. Double-click the Enable Computer And User Accounts To Be Trusted For Delegation
    policy setting.


    ![](img/763d5ae436311371600c0952a3da9094_561_1.png)


    +   4. The Enable Computer And User Accounts To Be Trusted For Delegation policy
    window appears.

    +      5. Click the check box to either enable or disable the policy setting.


    +   6. Click Add.

    +      7. Select the desired groups, then click OK.

    +      8. You can also use the Remove button to remove any existing groups.

    +      9. Click OK.'
