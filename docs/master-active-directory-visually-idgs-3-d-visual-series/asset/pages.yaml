- pgno: 175
  md: '# CONFIGURING SERVER PROPERTIES


    You access the DNS server properties sheets to configure the various DNS functions
    that you want your server to perform.


    Depending on the needs of your network, you may want to restrict a DNS server
    so that it only listens for query requests on certain IP addresses. This feature
    allows you to use a DNS server for a specific group of clients. You can enable
    this option, or simply allow the DNS server to listen on all IP addresses on the
    Interfaces tab.


    The Forwarders tab enables you to configure *forwarders*—which is a DNS service
    that is configured to provide recursive service for other DNS servers. The forwarder
    helps other DNS servers resolve a DNS name request that cannot be resolved by
    forwarding the request to other DNS servers. If your server is the root DNS server,
    the forwarders option is not available because it is the root server.


    ![](img/763d5ae436311371600c0952a3da9094_175_0.png)


    +   1. Select the desired server in the console.


    ![](img/763d5ae436311371600c0952a3da9094_175_1.png)


    +   2. Click *Action*→*Properties*.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# TIPS


    **Why would I want to use the Interfaces tab to limit the IP addresses the server
    listens to?**


    In networks where many DNS servers are in use, you may want to specify that a
    particular DNS server listen only to DNS queries from particular IP addresses.
    This feature enables you to restrict the DNS server so that it concentrates on
    a particular group of clients and only seeks to resolve queries for that group.


    **On my server, the Forwarders option is not available because it is a root server.
    Why?**


    Forwarders help resolve any DNS queries that cannot be answered by the DNS server.
    They do this by forwarding the request to up-stream servers within the namespace.
    Because your server is a root server, it resides at the top of the namespace,
    and therefore there is nowhere to forward queries to.


    ![](img/763d5ae436311371600c0952a3da9094_176_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_176_1.png)


