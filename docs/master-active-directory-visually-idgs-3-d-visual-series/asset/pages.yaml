- pgno: 457
  md: '# GROUP POLICY COMPUTER CONFIGURATION


    You have a number of possibilities when configuring client computers using Group
    Policy. The computer configuration portion of the Group Policy is divided into
    three major categories: software settings, Windows settings, and administrative
    templates. Each of these containers have different policy files that you can configure
    for your policy. (See Appendix A for more information on configuring Group Policies.)


    The software settings container has an icon for software installation. You can
    use the Group Policy to automatically install applications onto a user''s computer
    using the Windows installer. This feature enables you to create custom application
    packages that are pushed to the user''s computer and automatically installed.
    This feature allows each user in the group to have a particular set of applications
    automatically installed.


    Explaining how to configure custom packages for your Group Policy is beyond the
    scope of this book, but you can refer to the Windows Help files or the Windows
    2000 Server Resource Kit to learn more about software package development.


    ![](img/763d5ae436311371600c0952a3da9094_457_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_457_1.png)


    # CONFIGURING GROUP POLICY PROPERTIES


    +   1. **Expand** the policy you want to configure and click Computer Configuration.


    +   2. **Expand** the Software Settings, Windows Settings, and Administrative
    Templates containers to see the contents.


    +   3. Select Software Installation.'
  merge: -1
  img_proc: true
- pgno: 458
  md: '# How does the software installer work?


    Just as a policy can download system and user settings, the Group Policy can be
    configured to push the installer application and installation files to a user''s
    desktop. This feature allows the user to obtain a software installation without
    having to perform any of the installation manually. This feature ensures that
    all users have the same software applications installed and configured appropriately.


    # Can a user manually change the software configuration as he would do during
    a normal setup routine?


    The installation settings are defined by the Group Policy administrator when a
    software package is created. The entire package is then run on the client system.
    Depending on configuration, the user may be able to make some configuration choices,
    but this depends on the configuration of the package. This feature prevents users
    from making configuration changes during setup that are not desirable and ensures
    that all users in the group have the same software setup configuration.


    ![](img/763d5ae436311371600c0952a3da9094_458_0.png)


    +   * 4. Choose Action: Properties.


    ![](img/763d5ae436311371600c0952a3da9094_458_1.png)


    +   * 5. Click Browse to establish a default software installation package.

    +   * 6. Use these buttons to configure options for user settings when a new package
    is added to a client computer.


    +   * 7. Use these buttons to specify a basic or minimum user interface during
    the installation.

    +   * 8. Click to uninstall the applications.'
  merge: -1
  img_proc: true
- pgno: 459
  md: '# GROUP POLICY COMPUTER CONFIGURATION CONTINUED


    By accessing the properties sheets for the package installation object, you can
    configure general options for the package installer. On the General tab, you can
    load a default package, and you can use the radio buttons to establish the way
    the packages appear to users. Under the New Packages category, you can choose
    the options:


    +   - **Display the Deployment Software dialog box:** This dialog box appears
    when you deploy a new package so that you choose whether to assign, publish, or
    configure the package properties.

    +   - **Publish:** This option specifies that you want the new package to be published
    when it is added. Publishing occurs to users only, not computers.


    +   - **Assign:** This option specifies that you want the new package to be assigned
    with the standard package properties. Assignment can occur to either users or
    computers.

    +   - **Configure Package Properties:** This option specifies that the configure
    package properties form should appear when a new package is added. You can use
    this if you expect to stray from the standard package properties.


    ![](img/763d5ae436311371600c0952a3da9094_459_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_459_1.png)


    +   9.  Click the File Extensions tab.

    +   10. Click the drop-down box to select a file extension.

    +   11. Click Up or Down to rearrange the precedence.


    +   12. Click the Categories tab.

    +   13. Click Add.


    ■ Use the File Extensions tab to generate a list of file extensions that will
    invoke the application to open on the user’s desktop.


    ■ Use the Categories tab to configure categories under which the applications
    appear in Add/Remove programs in Control Panel.'
  merge: -1
  img_proc: true
- pgno: 460
  md: '# TIPS


    # Can I change the file extensions that are associated with a software package?


    Yes. The File Extensions tab enables you to list the file extensions that are
    to be associated with the package. For example, if you installed Microsoft Office,
    you can specify that the application should open automatically when a user attempts
    to open a Word (.doc) file. This feature is useful for programs that can handle
    a number of different file types and ensures that users use a certain program
    to work on a certain kind of file.


    # Can I modify the way that programs appear under Add/Remove Programs in the Control
    Panel?


    Yes. The Categories tab enables you to add categories in Add/Remove Programs in
    Control Panel where the software program will exist. This feature allows you to
    add custom categories so that all corporate software programs appear in one place.
    For example, the ABC Engineering has some custom programs. You can add a category
    labeled ABCs that appears in Add/Remove Programs in Control Panel so that the
    custom programs are stored in one location.


    ![](img/763d5ae436311371600c0952a3da9094_460_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_460_1.png)


    The Enter New Category dialog box appears.


    Type the name of the category where the program will appear.


    Click OK.


    Click OK to close the properties sheet.


    # ADDING A NEW PACKAGE TO THE CONSOLE


    Choose Action->New->Package.'
  merge: -1
  img_proc: true
- pgno: 461
  md: "# GROUP POLICY COMPUTER CONFIGURATION **CONTINUED**\n\nYou can easily add different\
    \ installer packages to the console by using the Action menu. You may have existing\
    \ installer packages (.msi files) that have been previously created, and this\
    \ option allows you to use those packages.\n\nNext, you can configure the Windows\
    \ settings so that they apply to the members of the Group Policy. You can expand\
    \ the Windows Settings container, which enables you to configure both script and\
    \ security settings. The Script icon in the console tree allows you to add\n\n\
    startup and shutdown scripts that run automatically when a Group Policy member\
    \ starts up and shuts down his or her computer. Scripts can be written and customized\
    \ to meet the needs of your environment; then you can add them to the Group Policy\
    \ from this location.\n\n![](img/763d5ae436311371600c0952a3da9094_461_0.png)\n\
    \n+   **2** Browse and select the Windows Installer package that you want to load.\n\
    \n+   **3** Click Open.\n\n![](img/763d5ae436311371600c0952a3da9094_461_1.png)\n\
    \n+   **WINDOWS SETTINGS**\n+   \n+   **1** Expand the Windows Settings container\
    \ and click the Scripts icon to configure the Startup and Shutdown scripts."
  merge: -1
  img_proc: true
- pgno: 462
  md: '![](img/763d5ae436311371600c0952a3da9094_462_0.png)


    # TIPS


    # How many software packages can I add to

    the Group Policy?


    You can add as many software packages to the Group Policy as needed for your organization.
    This is an issue that you should plan carefully so that the software installation
    feature of the Group Policy is used in an effective manner. Too many software
    packages can create management and traffic problems. The key rule is to use them
    as they are needed and to avoid unnecessary or trivial packages.


    # What are startup and shutdown scripts?


    Startup or shutdown scripts are custom scripts that run on the client computer
    when the computer is either started or shutdown. The script may perform system
    checks or file checks—basically anything that you want to run at either startup
    or shutdown. Scripts are often created fro specific network or company needs.


    ![](img/763d5ae436311371600c0952a3da9094_462_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_462_2.png)


    +   1. Use this interface to add, edit, or remove startup scripts that you want
    applied to this Group Policy.

    +   2. To view the current script files stored in the GPO, click Show Files.

    +   3. Click Add.

    +   4. Type the name of the script you want to load. You can also click Browse
    to locate the script you want to load.

    +   5. Click OK.'
  merge: -1
  img_proc: true
- pgno: 463
  md: "# GROUP POLICY COMPUTER CONFIGURATION CONTINUED\n\nThe second component of\
    \ Windows Settings is the Security Settings. If you click the Security Settings\
    \ icon in the console, the available policies appear. You see a number of possible\
    \ security configuration policies, such as account policies, local policies, event\
    \ log, restricted groups, and so forth. If you click a policy, the policy settings\
    \ appear in the details pane. By double-clicking each setting, you can configure\
    \ the setting options as you desire.\n\nFor example, the Account Policy object\
    \ contains policy settings for passwords, account lockout, and Kerberos. If you\
    \ double-click the policy setting in the details pane, a window appears in which\
    \ you can enable or disable the policy and configure any settings for the policy.\
    \ Fortunately, all the windows look the same or very similar so that you can configure\
    \ Group Policy quickly and without having to learn a lot of different interfaces.\n\
    \n![](img/763d5ae436311371600c0952a3da9094_463_0.png)\n\n+   1.  **SECURITY SETTINGS**\n\
    +   Click the Security Settings icon to expand it.\n+   2.  Expand any container\
    \ and select the desired policy.\n+   3.  Double-click a policy setting to view\
    \ it.\n+   \n+   The policy settings appear in the details pane."
  merge: -1
  img_proc: true
- pgno: 464
  md: '# How can I disable a policy setting?


    You can disable a policy setting by double-clicking it in the details pane and
    then clearing the check box that enables the policy. For example, on Account Lockout,
    the check box enables you to define the policy setting and enter the number of
    times a user may attempt to logon before the account is locked. If you clear the
    check box, the policy is not enabled and no limit is in place for the number of
    times a user can attempt to logon. Obviously, this choice reduces network security.


    # Do all policy configuration windows appear the same?


    Most of the policy configuration windows look the same or very similar. All of
    them allow you to either enable or disable the policy and configure it as appropriate
    or if necessary. Although the configuration windows may vary slightly depending
    on the policy, they have the same “feel” that lets you easily and quickly configure
    the policy.


    ![](img/763d5ae436311371600c0952a3da9094_464_0.png)


    +   - The selected Policy Setting window appears.

    +   - Click the check box to either enable or disable the policy setting.

    +   - Use the scroll box to configure the setting as desired.

    +   - Click OK.


    ![](img/763d5ae436311371600c0952a3da9094_464_1.png)


    This is another example of a policy setting. Notice that the policy settings have
    the same interface, which is provided for ease of administration.'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# GROUP POLICY COMPUTER CONFIGURATION _CONTINUED_


    To configure the security policy for the Group Policy, simply work your way through
    the various categories and policies. For each policy, you can enable or disable
    the specific policy and configure it as desired.


    As you move into additional security categories, such as system services, the
    registry, file services, and so forth, you notice that most of the options are
    not configured by default. This feature allows you to enable the security features
    you want to enable without having to wade through the entire list. For


    example, in the System Services container, every service listed in the details
    pane is not defined in the policy. Say that you want each member of the group
    to be a DHCP client. Simply double-click the DHCP client icon in the details pane,
    enable the policy, and then configure it as desired.


    ![](img/763d5ae436311371600c0952a3da9094_465_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_465_1.png)


    +   7 Select another policy and the settings for that policy appear in the details
    pane.


    +   8 Double-click a policy setting to configure it.


    +   The policy window appears.


    +   Note that the setting window is similar to the previous example.'
  merge: -1
  img_proc: true
- pgno: 466
  md: '# TIPS


    **I want all the clients in a certain Group Policy to share their Internet connections.
    Can I define this for my Windows 2000 Professional computers?**

    Yes. Select System Services in the console and then double-click Internet connection
    sharing. You can enable this policy and configure it as automatic, manual, or
    disabled. You can also click Edit Security to edit the security page for this
    policy. When users log on, their systems are automatically configured for Internet
    Connection Sharing.


    **If I don''t want to define any System Services for my clients, do I need to
    do Group Policy by default, so if you do not want them enabled, simply do nothing.
    If you want to enable some of them, simply double-click the appropriate icon in
    the details pane.**




    ![](img/763d5ae436311371600c0952a3da9094_466_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_466_1.png)


    +   9 For each other security category, you can click the container and the policy
    settings available appear in the details pane.


    +   10 Double-click any policy in the details pane to configure it.


    +   The policy window appears.


    +   11 For this particular policy, click Edit Security to make the security changes
    for the policy object.'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# GROUP POLICY COMPUTER CONFIGURATION CONTINUED


    From security settings, especially those in the System Services container, you
    see an Edit Security button on the policy configuration window. If you click this
    button, you see a standard security settings window in which you can configure
    security permissions for various users or groups. This security setting defines
    who has permission for the particular policy object, so you should be cautious
    before assigning lenient permissions for the object.


    The final portion of the Group Policy computer configuration is the administrative
    templates container. This container provides a number of templates that define
    additional computer settings and either allow or deny users to perform a variety
    of tasks. You can use the templates to give users control over certain networking
    components or printers. You can also use the Action menu to add additional templates
    to the console or remove existing ones.


    ![](img/763d5ae436311371600c0952a3da9094_467_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_467_1.png)


    +   1. Make the security changes for the policy object as desired and click OK.


    # ADMINISTRATIVE TEMPLATES


    +   1. Click the Administrative templates container to expand it.'
  merge: -1
  img_proc: true
- pgno: 468
  md: '# What all can I do with administrative templates for the computer configuration?


    The templates are divided into major categories, such as Windows Components, System,
    Network, and Printers. Within each container, you can configure a variety of policies
    that relate to the category. For example, in the Window Components container,
    you can configure settings for Internet Explorer, Task Scheduler, and Windows
    Installer. In the System container, you can configure settings for Logon, Disk
    Quotas, Group Policy, and System File Protection.


    ![](img/763d5ae436311371600c0952a3da9094_468_0.png)


    +   1. To add or remove an administrative template, choose Action > Add/Remove
    Templates.

    +   2. Select the policy template you want to use.

    +   3. Click Add to add the administrative template or Remove to remove it.'
  merge: -1
  img_proc: true
- pgno: 469
  md: '# **CHAPTER 25** **GROUP POLICY**


    # # GROUP POLICY COMPUTER

    # CONFIGURATION CONTINUED


    When you double-click a policy in the templates section, a window appears that
    enables you to either enable, disable, or not configure the policy. Either enabling
    or disabling a policy causes the registry to be written accordingly. If you click
    Not Configured, then the policy is not written to the registry.


    You can also click the Explain tab to read an explanation of what the policy enforces
    if enabled. This feature is useful to make certain that the policy will benefit
    your Group Policy members.


    Some policies contain additional information that must be configured. For example,
    on the Disk Quota


    limit and warning level, you input the value for the Disk Quota limit and the
    type of warning that is returned to the user if the limit is exceeded.


    Finally, you can use the Previous Policy and Next Policy buttons to easily navigate
    from policy to policy.


    ![](img/763d5ae436311371600c0952a3da9094_469_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_469_1.png)


    +   5 Expand any container to see what you can configure for the Group Policy.


    +   6 Double-click the policy setting you want to configure.


    +   7 Click the appropriate radio button to enable, disable, or not configure
    the policy.


    +   8 Use the Next and Previous Policy buttons to navigate through the policy
    list for that category.'
  merge: -1
  img_proc: true
- pgno: 470
  md: '# What is the default setting for the security templates?


    By default, the security template settings are not configured, which means that
    the value is not written to the registry. You should leave the setting as “not
    configured” for policy settings that you do not want to use to lower the overhead
    of your Group Policy. Enabled policies and disabled policies are written to the
    registry on client computers.


    ![](img/763d5ae436311371600c0952a3da9094_470_0.png)


    Click the Explain tab to read an explanation of the policy.


    Click OK.


    Some policy windows, such as this one, allow you to configure additional options
    that appear in the dialog box.'
  merge: -1
  img_proc: true
- pgno: 471
  md: '# # GROUP POLICY USER CONFIGURATION


    Configuration of user policies is very similar to configuring the computer policy.
    If you expand User Configuration in the console, you have Software Settings, Windows
    Settings, Security, and Administrative Templates. Most of the settings for the
    user are the same as for the computer. This feature


    enables you to define the same kind of settings for computers as well as user
    accounts. You have some additional options, such as Internet Explorer Maintenance,
    Remote Installation Service, and Folder Redirection.


    The Internet Explorer Maintenance feature enables you to configure


    Internet Explorer for the Group Policy users. With this feature, you can configure
    the browser''s user interface, connection, URLs, security, and the programs that
    IE uses. This allows you to customize IE for your environment so that it meets
    corporate policies while meeting the needs of your users.


    ![](img/763d5ae436311371600c0952a3da9094_471_0.png)


    **1** Click User Configuration in the console to expand it.


    ![](img/763d5ae436311371600c0952a3da9094_471_1.png)


    **2** Select a category in Internet Explorer Maintenance to see the policy options
    in the details pane.'
  merge: -1
  img_proc: true
- pgno: 472
  md: '![](img/763d5ae436311371600c0952a3da9094_472_0.png)


    I want to customize Internet Explorer for the Group Policy members so that IE
    opens a particular home page each time it launches. Can I do this?


    Yes. Select Internet Maintenance in the console and then double-click URLs in
    the details pane. Next, double-click Important URLs in the details pane. In the
    window that opens, click the Customize Home page URL check box and then enter
    in the dialog box the URL you want to load. When a user launches IE, this home
    page opens each time.


    ![](img/763d5ae436311371600c0952a3da9094_472_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_472_2.png)


    By double-clicking one of the policies, you can read about the policy and configure
    it as desired. In this example, a custom title bar has been added to Internet
    Explorer for the Group Policy members.


    If you select Remote Installation Service under Security in the console, a Choice
    Options diagram appears in the details pane.'
  merge: -1
  img_proc: true
- pgno: 473
  md: '# GROUP POLICY USER

    CONFIGURATION CONTINUED


    Windows 2000 includes Remote Installation Services, which enable administrators
    to remotely install Windows 2000 Professional on client computers that are booted
    with a boot floppy or have a boot-enabled BIOS. Remote Installation is also included
    in the Group Policy so


    that the Windows 2000 operating system can be set up remotely and then all the
    Group Policy features applied. Within the Group Policy, you have the option of
    setting installation choices that are made available to the user by accessing
    the Choice Options icon in the details pane. This feature presents you with


    a simple window of radio buttons so that you can choose allow, deny, or "don''t
    care" options for automatic setup, custom setup, restart setup, and tools.

    The rest of the policy options for user configuration work the same as with computer
    configuration.


    ![](img/763d5ae436311371600c0952a3da9094_473_0.png)


    **5** Click the appropriate radio buttons to make your selections for the Remote
    Installation Policy.


    **6** Click OK when you''re finished.


    **7** Click Administrative Templates to view the available user templates.

    **8** Click a category to view the template options in the details pane.


    **9** Double-click the policy in the details pane to enable it, if desired.'
  merge: -1
  img_proc: true
- pgno: 474
  md: '# TIPS


    # What else do I have to do to use the

    Remote Installation Service?


    The Remote Installation Service Choice

    Options in the Group Policy allow you to

