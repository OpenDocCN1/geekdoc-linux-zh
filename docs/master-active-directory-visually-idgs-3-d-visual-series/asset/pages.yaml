- pgno: 588
  md: '# TIPS


    # How do I install Acrobat Reader?


    Open the ACROREAD folder on the CD-ROM disc. Double-click the R540ENG.exe file
    and then follow the instructions on your screen.


    # How do I search all the sections of the book at once?


    You must first locate the index. While viewing the contents of the book, click
    Contents in the Acrobat Reader window. Click Indexes and then click Add. Locate
    and click the index.pdx file, click Open and then click OK. You need to locate
    the index only once. After locating the index, you can click Search to search
    all the sections.


    # How can I make searching the book more convenient?


    Copy the Acrobat Files folder from the CD-ROM disc to your hard drive. This allows
    you to easily access the contents of the book at any time.


    # Can I use Acrobat Reader for anything else?


    Acrobat Reader is a popular and useful program. There are many files available
    on the Web that are designed to be viewed using Acrobat Reader. Look for files
    with the .pdf extension.


    # FIND TEXT


    Click Search to search for text in the section.


    The Find dialog box appears.


    2. Type the text you want to find.


    3. Click Find to start the search.


    The first instance of the text is highlighted.


    Repeat steps 1 and 3 to find the next instance of the text.'
