- pgno: 116
  md: '# TIPS


    **Why would I want to stop the DHCP service?**


    You may need to stop the DHCP service in certain instances. For example, if you
    are having a problem with the DHCP service or if you are having problems with
    the server itself, you can stop the DHCP service until you resolve the problem.
    After you stop the service, however, network clients cannot receive IP addressing
    from that particular server.


    **Does stopping the service affect the scope?**


    No. You can stop the DHCP service without affecting your scope configuration.
    Because the service is stopped, no new IP addresses can be leased into the service
    restarts, but stopping the service does not change or remove the scope. This feature
    enables you to perform additional configuration or troubleshooting tasks for that
    particular scope.


    ![](img/763d5ae436311371600c0952a3da9094_116_0.png)


    +   1.  If you click **Edit** from the **Predefined Options and Values** dialog
    box, this window appears, enabling you to make changes to the name and description
    of the option.

    +   2.  Click **OK**.


    ![](img/763d5ae436311371600c0952a3da9094_116_1.png)


    **STARTING, STOPPING, OR RESTARTING THE DHCP SERVICE**


    1.  Choose **Action: All Tasks** and then choose the desired action.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# MANAGING DHCP SERVERS CONTINUED


    As with the scope, you can manage the DHCP server''s properties, which enables
    you to configure how your server performs and the background actions that occur.


    On the General tab, you can choose to update the server''s DHCP statistics at
    certain time intervals that you enter. You can also enable DHCP audit logging
    and show the BOOTP table folder if desired.


    The DNS tab is the same as the one in the scope properties. The default options
    are already configured so that updates can be dynamically sent to DNS. You should
