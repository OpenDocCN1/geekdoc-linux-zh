- pgno: 443
  md: '# SETTING UP DELEGATION


    Delegation is both a powerful tool and a powerful concept in Windows 2000. Delegation
    enables you to create delegates who control certain aspects of the Active Directory.
    This feature allows you to delegate administrative control of certain Active Directory
    domains, OUs, and containers to others within your organization. The delegate
    can then administer the domain, OU, container, and the objects residing in them.
    Delegation lets you easily set up decentralized administration while still maintaining
    control of your overall Enterprise network.


    Delegation is accomplished through a wizard that walks you through the necessary
    steps to set up delegation.


    For each domain, OU, and container in the Active Directory, you can use the Action
    menu to access the Delegation Wizard. Delegation is easy to configure, but you
    should carefully establish your delegation plan before implementing it.


    ![](img/763d5ae436311371600c0952a3da9094_443_0.png)


    +   1.  Choose Start\Programs\Administrative Tools\Active Directory Users and
    Computers.


    ![](img/763d5ae436311371600c0952a3da9094_443_1.png)


    +   2.  Select the desired domain, OU, or container and choose Action\Delegate
    Control.'
  merge: -1
  img_proc: true
- pgno: 444
  md: '# Tips


    # Can I delegate control to anyone?


    An authenticated user can be a delegate. Your decision, of course, must be made
    on that individual''s qualifications and responsibilities. You should delegate
    control only to users who are skilled and can be trusted with administrative control.


    # Why would I delegate control to a group?


    You can delegate control to a user or group. Group delegations are usually given
    to some kind of administrative group that can effectively manage the domain, OU,
    or container. You should remember that when you delegate control to a group, every
    member of the group becomes a delegate and can administer the delegation. As with
    any administration delegation, you should practice care and consideration.


    ![](img/763d5ae436311371600c0952a3da9094_444_0.png)


    +   3. The Delegation of Control Wizard appears.


    +   4. Click Next to continue.


    ![](img/763d5ae436311371600c0952a3da9094_444_1.png)


    +   5. Click Add to locate the person or group you want to delegate to.'
  merge: -1
  img_proc: true
- pgno: 445
  md: '# SETTING UP DELEGATION **CONTINUED**


    When you delegate control to a user or group, you have the option to control the
    delegation. This feature enables you to delegate some responsibilities but not
    necessarily all of them. This is a powerful way to allow other users or groups
    to handle certain administrative tasks while you continue to keep firm control.


    For example, you could delegate an OU that contained users so that the delegate
    could create new user accounts or reset passwords. You could allow the delegate
    to complete these tasks while denying the delegate the right to delete a user
    account or view sensitive user account information.


    With this design, you can delegate simple administrative tasks to other users
    so that they do not consume too much senior administrative time.


    ![](img/763d5ae436311371600c0952a3da9094_445_0.png)


    +   - Select the delegate.

    +   - Click Add.

    +   - Click OK.

    +   - The selected user or group appears.

    +   - Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 446
  md: '# **How much control should I give to a delegate?**


    The amount of control, or administrative power, you give to a delegate is entirely
    your decision, or you can base your decision on the security policies in effect
    for your organization. A good rule of thumb is to delegate only the administrative
    responsibilities the delegate needs. In other words, allow the delegate the power
    to complete the tasks necessary, but no more.


    # **Is the Delegation Wizard exactly the same for every domain, OU, or container?**


    The Delegation Wizard varies somewhat depending on what you are delegating. The
    basic tasks for which the wizard are determining the delegate and assigning that
    delegate administrative rights over certain aspects of the domain, OU, or container.
    Depending on what you are delegating, you may have additional administrative rights
    to assign with the wizard.


    +   - **9** Click this radio button to select tasks for delegation.

    +   - **10** Click the appropriate check boxes to delegate tasks.


    +   - **11** Click this button to create a custom task to delegate.

    +   - **11** Click Next to continue.


    +   - **12** Click Finish to complete the delegation.'
  merge: -1
  img_proc: true
- pgno: 447
  md: '# INTRODUCTION TO GROUP POLICY


    Windows 2000 introduces a powerful new tool called *Group Policy* that is integrated
    with the **Active Directory**. Group policies are an effective way to implement
    corporate policies so that a user''s desktop, documents, programs, access rights,
    and virtually any other computer component complies with corporate dictates and
    operating procedures. A Group Policy enables you to impose a set of rights and
    rules on a particular Active Directory domain or even site.


    # What is Group Policy?


    Microsoft designed Group Policy to give administrators more user control over
    the Active Directory. Group Policy can also reduce an organization''s *total cost
    of ownership* (TCO) by reducing user downtime due to misconfiguration. In other
    words, a Group Policy enables a group of users to do the work they need to do
    while maintaining a standard corporate system configuration.


    # What you can do with Group Policy


    Group Policy enables you to impose a set of standards for every user''s computer
    in the group. This can include custom Start menu items, software configuration,
    access to Active Directory objects, document and file availability, security settings,
    and even the automation of common tasks (such as network connections). Generally,
    group policies are applied at either the site or domain level and can give you
    a "one policy" control of the users and groups within that domain or site.


    ![](img/763d5ae436311371600c0952a3da9094_447_0.png)


    # What are the Group Policy components?


    Three major components make up a Group Policy. First, *Group Policy Objects* (GPOs)
    contain the configuration settings for particular Active Directory objects. The
    GPO is then applied to an Active Directory site, domain, or even OU. You can use
    multiple GPOs, and a GPO can be applied to multiple sites, domains, or OUs. GPOs
    store information in two locations: Group Policy Containers (GPC) and Group Policy
    Templates (GPT).'
  merge: -1
  img_proc: true
- pgno: 448
  md: 'Group Policy Containers (GPC) are Active Directory objects that contain property
    information and even subcontainers for GPOs. The property information includes
    version information so that GPOs are synchronized with GPCs. GPCs contain information
    that does not change frequently, and they also contain class store information
    for GPO application deployment.


    Group Policy Templates (GPT) reside in the System Volume folder (Sysvol) of domain
    controllers and contains the folder structure for GPOs. The GPT contains the security
    information, software policies, scripts, files, and additional system setting
    information.


    # What about inheritance?


    The term inheritance refers to the way multiple group policies affect each other.
    For example, if you have a site policy and also a domain policy, which one goes
    into effect? The inheritance order for group policies are site, domain, and OU.
    In other words, site group policies are applied first, then domain policies, then
    OU policies. If the OU policies contradicts a setting in the site or domain policy,
    the site or domain setting is overwritten. The policy closest to the user is the
    effective policy for that user. You can change this inheritance behavior if desired,
    and this chapter shows you how.


    ![](img/763d5ae436311371600c0952a3da9094_448_0.png)'
  merge: -1
  img_proc: true
- pgno: 449
  md: '# ACCESSING THE GROUP POLICY MMC SNAP-IN


    The Group Policy M MC snap-in is not considered one of the Active Directory tools
    per se, and it does not appear in your Administrative Tools folder. Like many
    MMC snap-ins in Windows 2000, you have to manually add the snap-in to the MMC.
    You can then save the MMC after the snap-in loads so that you may access it more
    easily.


    You can also access the Group Policy from either the Active Directory Users and
    Computer snap-in or the Active Directory Sites and Services snap-in by accessing
    the properties sheets for the site, domain, or OU. You use this interface to manage
    the Group Policy for the site, domain, or OU. You can also use this interface
    to create or edit a new Group Policy.


    It does not matter whether you manually add the MMC snap-in or access it from
    within a Group Policy properties sheet within the Active Directory. The configuration
    is the same and can be applied at whatever level is desired. You learn how to
    access the Group Policy from within the Active Directory later in the chapter.


    ![](img/763d5ae436311371600c0952a3da9094_449_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_449_1.png)


    +   1. To open an empty MMC, choose Start→Run.

    +   2. Type mmc.

    +   3. Click OK.


    +   4. Choose Console→Add/Remove Snap-in.'
  merge: -1
  img_proc: true
- pgno: 450
  md: '# TIPS


    Why is the Group Policy snap-in not a part of the Active Directory administrative
    tools?


    Remember that the Active Directory does not stand alone. It is the service that
    drives all directory functions in a Windows 2000 network. You use the administrative
    tools to manage actual components of the Active Directory. However, many other
    tools, such as the Group Policy snap-in, function within the Active Directory
    and configure it for various organization needs. Remember that even from within
    the Active Directory tools, you can still access the Group Policy snap-in as well
    as other snap-ins.


    Can I create a new Group Policy from within the Active Directory?


    Yes. You can create a new Group Policy by accessing the Group Policy properties
    sheet for the site, domain, or OU to which the policy will be applied. From this
    location, you can create a new policy just as you would using the manual snap-in.


    ![](img/763d5ae436311371600c0952a3da9094_450_0.png)


    +   The Add/Remove Snap-in window appears.


    +   Click Add.


    ![](img/763d5ae436311371600c0952a3da9094_450_1.png)


    +   A list of available standalone snap-ins appears.


    +   Scroll down and select Group Policy.


    +   Click Add.'
  merge: -1
  img_proc: true
- pgno: 451
  md: '# ## ACCESSING THE GROUP POLICY MMC SNAP-IN  CONTINUED


    When you access the Group Policy snap-in, you need to determine whether you want
    the Group Policy to be stored on the local computer or in the Active Directory.
    A Group Policy can apply to a local computer so that the settings you specify
    apply only to that local machine. However, if you want the Group Policy settings
    to apply to groups on a site, domain, or OU basis, you must configure the policy
    for use in the Active Directory.


    Because you want the Group Policy to be stored in the Active Directory, you can
    browse to select the domain controller on which you initially want to save the
    Group Policy. The Group Policy is then saved in the Active Directory and then
    replicated to the other domain controllers within the organization.


    ![](img/763d5ae436311371600c0952a3da9094_451_0.png)


    +   1. Click Browse to change the Group Policy object from the local computer
    to an Active Directory domain controller.

    +   2. Click this check box if you want to allow the focus of the Group Policy
    snap-in to change when using the command line.


    ![](img/763d5ae436311371600c0952a3da9094_451_1.png)


    +   3. The Browse for a Group Policy Object window appears.

    +   4. Open any domain controller s containers and select the domain controller
    desired.

    +   5. Click OK.

    +   6. Use these tabs to apply either a domain/OU policy, site policy, computer
    policy, or all policies.'
  merge: -1
  img_proc: true
- pgno: 452
  md: '# TIPS


    # What is the difference between a local policy and an Active Directory policy?


    An Active Directory policy, also called a nonlocal policy, is stored on domain
    controllers and applies to users and computers within the site, domain, or OU
    with which the GPO is associated. The local policy is stored on a computer running
    Windows 2000 and applies to that computer only. Both Active Directory and local
    policies can be applied to the same computer, but the Active Directory policy
    overwrites the local policy.


    # Can I create both a local policy and a nonlocal policy?


    You can create as many group policies as needed for your organization. Depending
    on your needs, you may have a combination of local policies and nonlocal policies
    that are applied to computers and Active Directory groups, respectively.


    ![](img/763d5ae436311371600c0952a3da9094_452_0.png)


    The Default Domain Controllers Policy now appears.


    12 Click Finish.


    ![](img/763d5ae436311371600c0952a3da9094_452_1.png)


    13 Click OK.'
  merge: -1
  img_proc: true
- pgno: 453
  md: '# # CONFIGURING GENERAL POLICY PROPERTIES


    You can configure general properties for the overall Group Policy by accessing
    the policy’s properties pages.


    In the Properties dialog box, you are given General, Links, and Security tabs.
    The General tab gives you information about the policy, but you can use the Disable
    Computer


    Configuration settings and Disable User Configuration settings check boxes if
    desired. This action disables either the user or computer portion from the policy
    and would be used if you wanted to apply only computer settings. Doing this helps
    system performance because the unused configuration does not have to be parsed
    each time a user logs on.


    On the Links tab, you can run a global catalog search for other sites, domains,
    and OUs that use this policy. The Security tab enables you to configure what users
    and groups have access to the policy settings and what rights they have.


    ![](img/763d5ae436311371600c0952a3da9094_453_0.png)


    +   Select the Policy object and choose Action→Properties.


    The General tab gives you information about the policy and its creation date.


    +   Click either of these two check boxes to disable computer configuration or
    user configuration.'
  merge: -1
  img_proc: true
- pgno: 454
  md: '# TIPS


    # When should I disable user or computer configuration?


    You do not want to disable either option if they are in use. However, under some
    circumstances, you may have a Group Policy that applies only to computer settings
    and all the user settings are not configured. Even though you did not configure
    the user settings, the system still has to parse the policy to check the configuration.
    If you disable it, the logon process speeds up because the configuration does
    not have to be parsed.


    # How can I find out which domains use a particular Group Policy?


    The easiest way to determine which domains use a particular Group Policy is to
    access the properties sheet for that policy. As an administrator in a large distributed
    network, it may be helpful to know which domains use a particular Group Policy.
    The properties sheet is the easiest way to access this information.


    ![](img/763d5ae436311371600c0952a3da9094_454_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_454_1.png)


    +   3. Click the **Links** tab.

    +      **The Links tab** enables you to run a search in the Active Directory for
    all sites, domains, or OUs that use this particular Group Policy.


    +   4. Click **Find Now** to start the search.


    +   5. Click the **Security** tab.

    +      **The Security tab** lists the default groups that have access to the policy.


    +   6. Click the appropriate check boxes to adjust each group’s permissions.

    +   7. Click **Add** to add new groups or users for policy access.


    CONTINUED >

    451'
  merge: -1
  img_proc: true
- pgno: 455
  md: '# # CONFIGURING GENERAL POLICY

    ## PROPERTIES CONTINUED


    As with other objects in the Active Directory, you can use the Security tab to
    determine who can access the Group Policy and what permissions they have for that
    policy. This feature enables you to assign certain permission rights to particular
    groups or individual users. Depending on the needs of


    your organization, you may want certain groups or users to be able to read the
    policy but not change it, while you may want other groups or users to have full
    control to the policy and be able to make policy changes. Obviously, you should
    carefully consider the permissions you assign for the policy.


    You can also use the Advanced button to refine permissions for users or groups
    to suit the needs of your organization. This feature allows you finer control
    over policy so that you can define exactly what groups or users can do with the
    policy.


    ![](img/763d5ae436311371600c0952a3da9094_455_0.png)


    +   * **8** Select the user(s) or group(s) you want to add permission for.

    +   * **9** Click **Add**.

    +   * **10** Click **OK**.

    +   * **11** Click the appropriate check boxes to configure the permissions you
    want to assign to the new users or groups.

    +   * **12** If you want to configure advanced security options, click **Advanced**.'
  merge: -1
  img_proc: true
- pgno: 456
  md: '# TIPS


    # Who should have access to the Group Policy object?


    Because the Group Policy object affects the configuration of computer and user
    accounts in the Active Directory, you should be very careful who is assigned permissions
    to the policy object. You would not want a user or group member changing the policy
    without specific and authorized reasons to do so.


    # What is the purpose of the advanced permission entries?


    In most cases, the general permissions are all you need. However, Windows 2000
    provides detailed and advanced security options so that you can further refine
    what permissions you assign on what objects. This feature allows Windows 2000
    to work within the security needs of your network.


    ![](img/763d5ae436311371600c0952a3da9094_456_0.png)


    +   13 Select the user or group you want to configure advanced properties for.


    +   14 Click View/Edit.


    ![](img/763d5ae436311371600c0952a3da9094_456_1.png)


    +   15 Use this drop-down box to choose whether to apply permissions to only this
    object or to all child objects.


    +   16 Click the appropriate Allow or Deny check boxes to configure the desired
    security features.


    +   17 Click OK.


    A list of additional permission options appears.'
  merge: -1
