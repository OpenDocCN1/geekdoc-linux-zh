    You can use the snap-in to manage other domain controllers, even those in different
    domains. When you choose to manage an Active Directory domain controller, the


    Active Directory Users and Computers snap-in opens for that domain. From your
    server, you can then manage that domain through the Users and Computers snap-in.
    This feature enables an administrator to make Enterprise-wide changes by accessing
    different domain controllers in different domains without having to physically
    visit each computer and each domain controller. After you access a domain controller,
    you can


    perform any management functions available within the Active Directory, including
    operation master roles and security.


    In order to manage another domain controller, you must first add the domain controller
    to your snap-in so that you can access it. See Chapter 19 for specific instructions
