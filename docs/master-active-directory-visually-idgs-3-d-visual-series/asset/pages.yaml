- pgno: 182
  md: '# WINDOWS 2000 NETWORKING


    # TIPS


    > Why do I have the option to update or reload the zone database file? Isn''t
    this operation automatic?


    The zone database files are updated at regular intervals, which ensures that each
    DNS server has accurate database records so that client queries can be resolved.
    As with most operations that automatically occur in Windows 2000, you also have
    the capability to force the action to occur. This allows you to always have control
    over the operating system services. In case there are problems with the server
    or a number of DNS changes occur, you can manually reload the database file or
    manually update the database file.


    ![](img/763d5ae436311371600c0952a3da9094_182_0.png)


    # MANUALLY RELOADING THE SERVER DATA FILE


    +   1. Choose Action->Reload.


    ![](img/763d5ae436311371600c0952a3da9094_182_1.png)


    +   2. Click OK to reload the zone data file.'
