- pgno: 358
  md: '# **TIPS**


    # How can I keep a manager''s contact information private?


    A manager''s contact information is taken from the information configured in the
    manager''s Active Directory user account. In order to keep the contact information
    (such as the manager''s phone number) private, you have to delete this information
    from the manager''s user account in the Active Directory. By doing so, no Active
    Directory users can read the information because it does not appear in the manager''s
    account.


    # Do I have to assign a manager?


    No. You are not required to assign a manager on this tab. In some cases, a single
    person or group manages all domain controllers, in which case, you do not need
    to assign a manager using the Managed By tab. This is strictly an administrative
    issue and not a required configuration component of the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_358_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_358_1.png)


    **16** The new manager''s name and contact information — taken from the Active
    Directory — now appears.


    **16** To view additional Active Directory information about the manager, click
    View.


    **17** The Properties sheet for the manager appears.


    **17** Click OK when you are done.'
  merge: -1
