- pgno: 371
  md: '# # CONNECTING TO A DOMAIN CONTROLLER


    T he Active Directory Domains and Trusts MMC snap-in is one of the three Active
    Directory tools. You can use this snap-in to manage Active Directory domains and
    trust relationships between domains.


    From this snap-in, you can connect to different domain controllers, both within
    the domain and in other domains that are part of the Active Directory tree or
    forest. By connecting to other domain controllers within the domain, you can make
    changes to the domain, such as changing the operations master. This task is explained
    later in this chapter. By connecting to domain controllers in other


    domains, you can manage trust relationships between the domains as necessary.
    This console does not enable you to perform a lot of different tasks, but it does
    give you an easy way to manage the domains in your network and their relationships
    to one another.


    ![](img/763d5ae436311371600c0952a3da9094_371_0.png)


    1. Choose Start> Programs>Administrative Tools>Active Directory Domains and Trusts.


    ■ The console opens.


    2. Select Active Directory Domains and Trusts.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# What permissions do I need to connect to other domain controllers?


    Permissions may vary depending on your network configuration, but generally you
    need to be a member of the Enterprise Admins group. For most Active Directory
    operations, your user account should be a member of this group so that you can
    have proper permissions to handle Enterprise tasks and issues.


    # Why would I want to connect to other domain controllers in different domains?


    You may need to connect to other domain controllers in different domains to manage
    communication issues between the domains. For example, you can connect to domain
    controllers in other domains to establish proper trust relationships. You can
    learn more about establishing trust relationships in Chapter 21. Remember that
    Windows 2000 allows you to use one interface to manage different domain controllers
    and even different domains. This design saves administrators time and promotes
    streamlined management.


