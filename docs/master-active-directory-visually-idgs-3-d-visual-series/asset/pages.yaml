    +   3.

    +      The Bypass Traverse Checking window appears.

    +      * Click the check box to either enable or disable the policy setting.

    +      * Click Add.

    +   5.

    +      Select the desired groups, then click OK.

    +      * You can also use the Remove button to remove any existing groups.

    +   6.

    +      Click OK.'
  merge: -1
  img_proc: true
- pgno: 552
  md: '# CHANGING SYSTEM TIME


    Y ou use the Changing System Time policy to allow or disallow users or groups
    to change the system time on their computers. When you enable the policy, no users
    can change their system time unless you add the desired users and groups. As with
    all policies, if you do not want this policy in effect, simply do not define it.


    ![](img/763d5ae436311371600c0952a3da9094_552_0.png)


    +   1. Expand the Security Settings container, expand the Local Policies container,
    then select Users Rights Assignment.


    The policy settings appear in the details pane.


    +   2. Double-click the Change The System Time policy setting.


    +   3. The Change The System Time policy window appears.


    +   4. Click the check box to either enable or disable the policy setting.


    +   5. Click Add.


    +   6. Select the desired groups, then click OK.


    You can also use the Remove button to remove any existing groups.


    +   7. Click OK.'
  merge: -1
  img_proc: true
- pgno: 553
  md: '# APPENDIX A


    # CREATING A PAGEFILE


    Windows systems use a pagefile to handle system memory. A pagefile allows the
    system to write temporary memory data to the hard disk when physical memory is
    running low. With this policy, you can determine which users or groups have the
    right to create a pagefile on their systems.


    Typically, you want to implement a standard pagefile configuration, and this is
    not something end users should be tampering with.


    ![](img/763d5ae436311371600c0952a3da9094_553_0.png)


    +   - Expand the Security Settings container, expand the Local Policies container,
    then select Users Rights Assignment.

    +   - The policy settings appear in the details pane.


    +   - Double-click the Create A Pagefile policy setting.


    +   - The Create A Pagefile policy window appears.

    +   - Click the check box to either enable or disable the policy setting.

    +   - Click Add.


    +   - Select the desired groups, then click OK.

    +   - You can also use the Remove button to remove any existing groups.

    +   - Click OK.'
  merge: -1
  img_proc: true
- pgno: 554
  md: '# CREATING A TOKEN OBJECT


    Windows 2000 uses token objects in some security scenarios. Tokens are a


    part of advanced security configuration and should not be used by typical end
    users, so


    definition of the policy is a good idea.


    ![](img/763d5ae436311371600c0952a3da9094_554_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_554_1.png)


