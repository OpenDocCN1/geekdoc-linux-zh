- pgno: 577
  md: "# # APPENDIX A\n\n# ## RETAINING APPLICATION LOG\n\nYou can define policies\
    \ so that log files are retained on client computers within the Group Policy for\
    \ a certain number of days. The default setting is for the system to overwrite\
    \ events that are older than 7 days. You can raise or lower this value to meet\
    \ your needs, but this default configuration allows the computer system to retain\
    \ the log file for a week. Keep in mind that if you raise the value, client computers\
    \ will need more disk space to store the logs as they grow.\n\n![](img/763d5ae436311371600c0952a3da9094_577_0.png)\n\
    \n+   1. Expand the Security Settings container, expand the Event Log container,\
    \ then select Settings For Event Logs.\n+   \n+   2. Double-click the Retain Application\
    \ Log policy setting.\n+   \n+   3. The Retain Application Log policy window appears.\
    \ Click the check box to either enable or disable the policy setting.\n+   \n\
    +   4. Click either the Enabled or Disabled radio button.\n+   \n+   5. Click\
    \ OK."
  merge: -1
  img_proc: true
