- pgno: 192
  md: '# What is a zone transfer?


    The updates to the secondary DNS servers occurs through a process known as zone
    transfer. Without the zone transfer process enabled, secondary DNS servers in
    the zone will not be automatically updated when the DNS database changes. You
    can choose to allow zone updates to any server in the zone, only the servers listed
    in the Name Servers tab, or you can configure the server list manually by adding
    them on the Zone Transfers tab. To add a name server to the list, simply enter
    the IP address of the name server and click Add. When you choose this option,
    only the servers you specify in the list receive zone transfers.


    ![](img/763d5ae436311371600c0952a3da9094_192_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_192_1.png)'
