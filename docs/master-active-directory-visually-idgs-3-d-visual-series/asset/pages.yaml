- pgno: 206
  md: 'On the **PPP** tab, you have some different options when using the Point to
    Point Protocol. First, you can allow **multilink** connections. **Multilink**
    allows you to use several modems or adapters to increase bandwidth. With the **multilink**
    option, you can choose to use dynamic bandwidth control using BAP or BACP. BAP
    is Bandwidth


    Allocation Protocol and BACP is Bandwidth Allocation Control Protocol. Both of
    these allow the multilink connection to automatically drop or add PPP links as
    needed by the traffic flow. You can also choose to choose Link Control Protocol
    (LCP) extensions and software compression to help control PPP connections.


    The **Event Logging** tab enables you to determine what events you want logged
    in the event log. You can choose from errors only or errors and warnings, you
    can log the maximum amount of information, you can disable all event logging,
    and you can enable PPP logging.


    ![](img/763d5ae436311371600c0952a3da9094_206_0.png)


    +   12. Click the PPP tab.


    +   13. Click these check boxes to either allow or disallow the PPP connection
    properties.


