- pgno: 264
  md: '# TIPS


    How can I quickly reinstall the Active Directory after an uninstall?

    After the uninstallation takes place, the only way to reconfigure your server
    and install the Active Directory is to run dcpromo.exe or use the Configure Your
    Server tool. This action opens the Active Directory Installation Wizard, at which
    time you must complete the entire installation process again. You cannot recover
    the Active Directory after you have uninstalled it.


    Can member servers authenticate users?

    No. Only domain controllers, which run the Active Directory, can authenticate
    users. Keep in mind that all user accounts are stored in the Active Directory
    as objects. When a user logs on, a domain controller checks the Active Directory
    database for the validity of that user account. Member servers can use the Active
    Directory just like client computers, but they do not have the security privileges
    to authenticate users.


    ![](img/763d5ae436311371600c0952a3da9094_264_0.png)


    +   ▪ The system completes the uninstallation.

    +   ■ 18 Click Finish to exit the wizard.


    ![](img/763d5ae436311371600c0952a3da9094_264_1.png)


    +   ▪ For the changes to take effect, you must restart Windows.

    +   ■ 16 Click Restart Now to reboot your computer.


    17 Click Don''t Restart Now if you want to restart later.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# ACCESSING THE MMC


    The Microsoft Management Console (MMC) is a GUI interface, or shell, that you
    use often when working with Active Directory. The MMC houses the Active Directory
    tools and other tools in Windows 2000 Server.


    The MMC is a basic interface that looks similar to Windows Explorer. The MMC alone
    does not provide any functionality, instead it allows you to load various tools,
    called snap-ins, into the MMC so you can complete various tasks. All Active Directory
    tools are MMC snap-ins.


    If you have worked with any BackOffice products, such as Internet Information
    Server (IIS), Proxy Server, or Systems Management Server (SMS), you have used
    the MMC because these BackOffice products are snap-ins. If you have worked with
    these products, you are probably familiar with the MMC and its functionality.


    The MMC is available at the Run prompt. When you launch the MMC, a standard interface
    appears.


    ![](img/763d5ae436311371600c0952a3da9094_265_0.png)


    **1** To access the MMC, choose Start>Run.


    ![](img/763d5ae436311371600c0952a3da9094_265_1.png)


    The Run dialog box appears.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# TIPS


    **Can I use a snap-in without the MMC?**


    No. Snap-ins are created specifically to function within the MMC. The MMC provides
    the controls necessary to use the snap-in, and the snap-in does not function without
    the MMC. All Active Directory tools are MMC snap-ins, and these tools cannot be
    accessed and used without the MMC.


    **What does the MMC do without a snap-in?**


    The MMC does not have any functionality without a snap-in. You can compare the
    MMC to a kitchen stove. Without something on the burners or in the oven, the stove
    does not have any real functionality. But if something is on the burners or in
    the oven, you use the stove to control it. For example, if a pot of water is on
    a burner, you can use the stove controls to heat the water, or cool it back down.
    The MMC is similar—you use the MMC controls to manage and use snap-ins.


    ![](img/763d5ae436311371600c0952a3da9094_266_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_266_1.png)


    **2** In the Run box, type mmc.


    **3** Click OK.


    **■** The MMC opens.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# OPENING AND SAVING MMCS


    At the top of the MMC, you see MMC menus, and immediately under those menus, you
    see root menus. The MMC menus enable you to control the overall appearance and
    behavior of the MMC. You also use the MMC Console menu to add or remove snap-ins.


    If you click the Console menu, you can perform several actions. For example, you
    can create new MMCs or open existing ones on your system. This feature allows
    you to open several MMCs, and consequently several snap-ins, so you can work with
    many tools at one time. You can also save an MMC


    console, just as you would a document. This feature enables you to create custom
    MMC consoles that contain several snap-ins of your choice. Note that you do not
    need to manually create MMC consoles for the Active Directory tools—these are
    provided for you in the Programs folder.


    ![](img/763d5ae436311371600c0952a3da9094_267_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_267_1.png)'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Tips


    # Why would I want to open a new MMC when one is already open?


    You can load numerous snap-ins into one MMC if desired. But if you are working
    with several tools at once, you may want each snap-in to exist in its own MMC
    so that you can save them individually. In this case, the New command enables
    you to easily open several MMCs at one time. Some administrators prefer to create
    custom MMC consoles where they load several snap-ins and then save the console
    for future use. Other administrators find this approach confusing and prefer to
    use each snap-in in its own separate MMC.


    # Are saved MMCs text files?


    No. MMCs are saved as an .msc file, which is the Microsoft Management Console
    file type. You can then open and close saved MMCs as desired.


    ![](img/763d5ae436311371600c0952a3da9094_268_0.png)


    +   *   2. Choose Console::Open.

    +   *   3. Browse to select another MMC.

    +   *   4. Click Open after you select the MMC.


    ![](img/763d5ae436311371600c0952a3da9094_268_1.png)


    +   *   5. Choose Console::Save As.

    +   *   6. Type a filename for the MMC.

    +   *   7. Click Save.'
  merge: -1
  img_proc: true
- pgno: 269
  md: "# ADDING AND REMOVING SNAP-INS\n\nYou'll use the Console menu mainly to add\
    \ or remove snap-ins. You can add snap-ins to empty MMCs, or you can add them\
    \ to existing MMCs so that you have more than one tool present within a given\
    \ MMC. Keep in mind you can load snap-ins in several different ways. Some administrators\
    \ prefer to use several snap-ins within one MMC, and other administrators prefer\
    \ to use each snap-in within its own MMC. When you choose to add or remove a snap-in,\
    \ a Windows 2000 list of available snap-ins appears. You can then select the snap-in\
    \ you want to use. After the snap-in loads, you can begin using the snap-in.\n\
    \n![](img/763d5ae436311371600c0952a3da9094_269_0.png)\n\n![](img/763d5ae436311371600c0952a3da9094_269_1.png)\n\
    \n+   ### ADDING A SNAP-IN\n+   \n+   1.  Choose Console\\ Add/Remove Snap-in.\n\
    +   2.  The Add/Remove Snap-in dialog box appears.\n\n+   2.  Click **Add**.\n\
    +   3.  The **Add Standalone Snap-in** dialog box appears."
  merge: -1
  img_proc: true
- pgno: 270
  md: '# **Tips**


    # Why are so many tools in Windows 2000 snap-ins?


    The MMC is a major component of Windows 2000, and most major tools in Windows
    2000 function as MMC snap-ins. This approach makes configuration and management
    easier. Instead of each tool having a different interface, the MMC brings a streamlined
    approach to management tools. Also, the snap-in structure easily enables Microsoft
    and other vendors to create new snap-ins that you can download from the Web.


    # Can I create custom consoles with the multiple snap-in so that I can use them
    over and over?


    Sure. Simply load the snap-ins you want, and then use the Console menu to save
    the console to the desired location on your system. Then you can use the MMC console
    over and over. For example, some administrators prefer all Active Directory snap-ins
    to appear in one console so they can configure the Active Directory from one console
    location. You could also load networking tools, such as DHCP, DNS, and WINS into
    one console so you can administer all of these services from one interface.


    ![](img/763d5ae436311371600c0952a3da9094_270_0.png)


    +   3 Select the snap-in that you want to add

    +   4 Click Add.

    +   *Note: You can add additional snap-ins the same way.*


    +   5 Click Close when you are done.


    +   6 The Add/Remove Snap-in window now shows the snap-in loaded. Select the snap-in.


    +   7 Click About to learn more about the snap-in.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# ADDING AND REMOVING SNAP-INS


    # CONTINUED


    After you add the desired snap-ins, you can use the Add/Remove Snap-in Standalone
    and Extensions tab to manage the snap-ins before they are added to the MMC console.
    First, you can select any snap-in in the Standalone window and click the About
    button to learn more about the snap-in. This feature provides you with a short
    paragraph describing the snap-in''s functionality.


    The Extensions tab enables you to manage each snap-in''s extensions, if extensions
    are available for the particular snap-in. Extensions are other snap-ins which
    work with the snap-in you select. For example, the Active Directory Users and
    Computers snap-in contains several extensions to other snap-ins, such as Group
    Policy. By default, all extensions for each snap-in are loaded, so you do not
    need to specifically use the Extensions tab unless you only want to load particular
    extensions.


    Finally, you can also use the Standalone tab to Remove snap-ins from the list
    before they are added to the console.


    ![](img/763d5ae436311371600c0952a3da9094_271_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_271_1.png)


    8 The About window gives you information about the snap-in''s functionality.


    9 Click OK to close the window.


    10 Click the Extensions tab to configure snap-in extensions.


    11 Select the extensions you want to load.


    10 Clear the Add All Extensions check box.


    Note: By default, all extensions are loaded for snap-ins.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# TIPS


    # How are Extensions used?


    Some snap-ins contain extensions to other snap-ins. You can think of extensions
    as “links.” Some snap-ins have configuration that requires the snap-in to open
    another snap-in. For example, in Active Directory Users and Computers, you can
    configure Group Policy for a domain. In order to configure Group Policy, the Group
    Policy snap-in has to be opened. The Users and Computers snap-in contains a link
    to the Group Policy snap-in so it can be automatically launched when you want
    to configure Group Policy. The extensions allow different, yet related, snap-ins
    to function together so you do not have to manually open related snap-ins.


    # When I remove a snap-in, is the snap-in deleted?


    No. When you remove a snap-in from the Standalone tab, you are simply telling
    the MMC not to load a previously selected snap-in. This action simply removes
    the snap-in from you list so it is not loaded.


    ![](img/763d5ae436311371600c0952a3da9094_272_0.png)


    # REMOVING A SNAP-IN


    +   1. Select the Standalone tab, then select the snap-in you want to Remove.


    +   2. Click the Remove button.

    +   3. Click OK when you are done.


    ![](img/763d5ae436311371600c0952a3da9094_272_1.png)


    The snap-in now appears in the console.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# ## CONFIGURING MMC OPTIONS


    The Options command enables you to change the icon appearance of the MMC console
    and also change the mode. You have four mode options that you can implement. Each
    mode provides the user with different rights and permissions for using and configuring
    the MMC. The mode options are useful if several different people use the same
    MMC. One user may have "full control," while others can only make certain changes
    to the console.


    Depending on which mode you choose, you can also use the check boxes at the bottom
    of the window to enable context menus, stop the user from saving changes to the
    console, or allow the user to customize views. You can customize the MMC views
    by using the Window menu on the console.


    ![](img/763d5ae436311371600c0952a3da9094_273_0.png)


    +   1. Choose Console: Options to change the MMC console''s functionality.


    ![](img/763d5ae436311371600c0952a3da9094_273_1.png)


    +   2. The Options dialog box appears.


    +   3. You can change the MMC''s icon by clicking Change Icon and selecting a
    new Icon from the window that appears.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# **TIPS**


    **What are the different modes?**


    +   MMC modes allow the user different MMC permissions. The following list explains
    the MMC modes:

    +   - Author mode provides full access to the MMC with the ability to add or remove
    snap-ins, create new windows, save or change any options, and view all parts of
    the console.

    +   - User mode - full access gives users full access to all commands and the
    console, but the user cannot add or remove snap-ins or change the console properties.


    +   - User mode - limited access, multiple window gives the user access only to
    areas that were visible in the console when the console was saved. Users can create
    new windows but cannot close existing windows.

    +   - User mode - limited access, single window provides users access only to
    areas of the console that were visible when the console was saved.


    ![](img/763d5ae436311371600c0952a3da9094_274_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_274_1.png)


    3 Click the Console Mode drop-down box and select the mode you want to use.


    4 Make any desired changes by clicking the appropriate check boxes.


    5 Click OK when you are done.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# **USING THE MMC WINDOW MENU**


    T he Window menu enables you to add new windows to the MMC and adjust the way
    you view the windows. This provides you an easy way to adjust the appearance of
    your MMC so that each snap-in loaded appears as desired.


    You can open various windows in the MMCs and then arrange them in a manner you
    desire. For example, you can choose to either cascade or tile the open windows
    so that you can easily move from window to window in the MMC.


    The Help Menu allows you to access MMC help by either accessing the Windows 2000
    Help files or by accessing Microsoft on the Web. The “on the Web” option enables
    you to download new snap-ins, view product news, and even send feedback to Microsoft.


    ![](img/763d5ae436311371600c0952a3da9094_275_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_275_1.png)'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# TIPS


    # **Why would I want to use different windows within one MMC console?**


    You can open various snap-ins in different windows instead of the same window.
    If you are working with several snap-ins, this feature is often helpful to keep
    the snap-ins organized. The functionality remains the same regardless of how you
    load the snap-ins—you can load various snap-ins in one window or several windows
    as desired.


    # **What happens if I use the Microsoft On The Web help options?**


    If you click one of the Microsoft On The Web options, your system opens a browser
    window and attempts to establish an Internet connection to access the particular
    Web page. When you use the Microsoft On The Web option, you can access the MMC
    snap-in gallery so you can download new snap-ins as they become available and
    read product news.


    ![](img/763d5ae436311371600c0952a3da9094_276_0.png)


    Click the Help menu, then select either Help Topics or Microsoft On The Web.


    ![](img/763d5ae436311371600c0952a3da9094_276_1.png)


    The Help menu gives you access to the Windows 2000 Help files or to help information
    on Microsoft’s Web site, depending on the selection you made.


    IV  INSTALLING ACTIVE DIRECTORY'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# USING ROOT MENUS


    Root menus enable you to adjust several options for the MMC root. The main MMC
    menus (Console, Window, and Help) affect the overall MMC. Root menus affect the
    snap-ins you have loaded into the MMC. The Action menu is the most common. If
    you select the root folder and choose the Action menu, a list of basic operations
    appears. After you begin using snap-ins, you can also use the Action menu to manage
    that particular snap-in. The options on the Action menu change depending on which
    snap-in you use.


    ![](img/763d5ae436311371600c0952a3da9094_277_0.png)


    If you choose the Action menu, you see standard menu items that appear for every
    snap-in.


    ![](img/763d5ae436311371600c0952a3da9094_277_1.png)


    If you choose Action -> Rename, you can rename the root folder in the console.


    Type in the new name for the root folder.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '![](img/763d5ae436311371600c0952a3da9094_278_0.png)


    # TIPS


    # **What appears if I click the snap-in folder and click the Action menu?**


    The Action menu contains a list of action operations that you can perform on a
    particular folder or snap-in. The actions that appear vary according to the snap-in
    that you have loaded, or the child folders of the snap-in. When you select different
    snap-ins or child folders and then choose the Action menu, the menu contains the
    actions that you can perform on that particular object.


    # **Is there another way to configure items in the console without using the Action
    menu?**


    Yes. You can select any item in the console and then right-click it to see a list
    of available actions. The right-click menu offers the same options that appear
    on the Action menu.


    ![](img/763d5ae436311371600c0952a3da9094_278_1.png)


    The Help option on the Action menu opens the Windows 2000 Help files.


    ![](img/763d5ae436311371600c0952a3da9094_278_2.png)


    By choosing the View menu, you can choose large or small icons, a list, or details,
    or you can click Customize.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# USING ROOT MENUS CONTINUED


    You can use the View menu to change the way the MMC root folder and snap-ins appear.
    You can choose to see the window with large icons or small icons, and you can
    use the Customize option to alter the appearance of the window. This option presents
    you with


    several check box selections, such as show or not show the console tree, standard
