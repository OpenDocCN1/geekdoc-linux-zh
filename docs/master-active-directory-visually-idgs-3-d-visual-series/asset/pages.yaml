- pgno: 381
  md: '# **CHAPTER 21 MANAGING DOMAINS AND TRUSTS**


    # # CHANGING THE DOMAIN MODE


    Windows 2000 domains can function in two modes: mixed mode and native mode. *Mixed
    mode* allows Windows NT and Windows 2000 domain controllers to coexist in the
    domain. However, when mixed mode is in effect, you cannot use some of the Windows
    2000 enhancements, such as universal groups and nested groups. When you install
    the first


    Active Directory domain controller for a domain, mixed mode is selected by default.
    With mixed mode, you can slowly implement Windows 2000 domain controllers instead
    of having to upgrade all your domain controllers at one time.


    *Native mode* allows only Windows 2000 domain controllers. After you change a
    domain to native mode,


    Windows NT domain controllers cannot be used in the domain. Although you should
    change to native mode as soon as you are ready, make certain that you do not intend
    to use any Windows NT domain controllers in the future. After you change to native
    mode, you cannot move back to mixed mode.


    ![](img/763d5ae436311371600c0952a3da9094_381_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_381_1.png)


    +   1.  Select the domain you want to administer, and then choose Action→Properties.

    +   2.  The *Properties* sheet appears.

    +   3.  Enter a description for the domain if desired.

    +   4.  To change the domain mode, click *Change Mode*.

    +       **Warning:** After you change to *native mode*, you cannot return to *mixed
    mode*!'
  merge: -1
  img_proc: true
- pgno: 382
  md: '![](img/763d5ae436311371600c0952a3da9094_382_0.png)


    # Can I still use Windows NT Workstation or Windows 9x client computers in the
    domain after a change to native mode?


    ✔ Yes. The change to native mode affects only domain controllers. After you make
    the change, only Windows 2000 domain controllers can be used. However, client
    computers are not affected by the change to native mode, and you can still use
    a mix of Windows 2000, Windows NT, or Windows 9x client computers.


    # Can’t I still use a Windows NT BDC after the change to native mode?


    ✔ No. Native mode allows only Windows 2000 servers. You cannot use Windows NT
    servers in the domain, regardless of the role they once played in a Windows NT
    network. Keep in mind that native mode erases any functionality with downlevel
    NT servers, so if your environment still uses NT servers, you should not change
    to native mode until they have all been upgraded.




    VI


    ![](img/763d5ae436311371600c0952a3da9094_382_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_382_2.png)


