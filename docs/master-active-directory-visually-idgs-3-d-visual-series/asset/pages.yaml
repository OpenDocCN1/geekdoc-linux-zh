- pgno: 557
  md: '# DENYING ACCESS TO THIS COMPUTER FROM THE NETWORK


    In some cases, you may have particular users or groups for whom you want to deny
    access to network computers. You can use this policy to configure users or groups
    who are not permitted to access the network computers. After they are denied access,
    they will not be able to connect, but other users and groups will be able to connect
    to network computers normally.


    ![](img/763d5ae436311371600c0952a3da9094_557_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_557_1.png)


    +   1. Expand the Security Settings container, expand the Local Policies container,
    then select Users Rights Assignment.


    The policy settings appear in the details pane.


    +   2. Double-click the Deny Access To This Computer From The Network policy setting.


    +   - The Deny Access To This Computer From The Network policy window appears.


    +   3. Click the check box to either enable or disable the policy setting.


    +   4. Click Add.


    +   5. Select the desired groups, then click OK.


    +   - You can also use the Remove button to remove any existing groups.


    +   6. Click OK.'
  merge: -1
  img_proc: true
- pgno: 558
  md: '# # DENYING LOGON AS A BATCH JOB


    Batch jobs are scripts that are used for a variety of purposes. This policy prevents
    certain users or groups from logging onto a computer as a part of a batch job.
    This is an extra security measure and one you may want to implement, depending
    on the use of batch jobs on your network. This privilege is granted only to administrators
    by default.


    ![](img/763d5ae436311371600c0952a3da9094_558_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_558_1.png)


    +   1.  Expand the Security Settings container, expand the Local Policies container,
    then select Users Rights Assignment.

    +       *   The policy settings appear in the details pane.

    +   2.  Double-click the Deny Logon As A Batch Job policy setting.

    +       *   The Deny Logon As A Batch Job policy window appears.

    +   3.  Click the check box to either enable or disable the policy setting.

    +   4.  Click Add.

    +   5.  Select the desired groups, then click OK.

    +       *   You can also use the Remove button to remove any existing groups.

    +   6.  Click OK.'
  merge: -1
  img_proc: true
- pgno: 559
  md: '# # APPENDIX A


    # # DENYING LOGON AS A SERVICE


    T

    he LocalSystem account of a computer always retains the right to log on as a service.
    Logging on as a service allows the user to logon with a security principal as
    a service rather than a user account. This right is not granted to any user by
    default, but it is granted to services that require a separate account to run.


    ![](img/763d5ae436311371600c0952a3da9094_559_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_559_1.png)


