- pgno: 121
  md: '# INSTALLING WINS


    A s with other networking components in Windows 2000, you can install WINS by
    accessing Add/Remove Programs in Control Panel. You can also use the Configure
    Your Server program that is available in the Administrative Tools folder or from
    the Start menu.


    Keep in mind that pure Windows 2000 networks use DNS for name resolutions, so
    WINS is unnecessary. If your network uses a mixture of Windows 2000 operating
    systems as well as earlier versions of Windows, such as NT and 9x, then you need
    to use WINS.


    Before installing WINS, you should make certain that the WINS server has a static
    IP address, subnet mask, and default gateway (optional). If you are using DHCP,
    you should also configure DHCP to return the WINS server name and the IP address
    to clients with their IP lease. See Chapter 4 for more information about configuring
    DHCP.


    ![](img/763d5ae436311371600c0952a3da9094_121_0.png)


    +   1. Double-click Add/Remove Programs in Control Panel.


    ![](img/763d5ae436311371600c0952a3da9094_121_1.png)


    +   2. Click Add/Remove Windows Components.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '![](img/763d5ae436311371600c0952a3da9094_122_0.png)


    # Is there another way to install WINS?


    Yes. You can use the Configure Your Server tool by choosing Start\>Programs\>
    Administrative Tools\>Configure Your Server. Click the Networking link in the
    left pane and click WINS to begin the installation.


    # Can a DHCP server also be a WINS server?


    Yes. You can use the same server to run DHCP and WINS, and this is not an uncommon
    configuration. You should include the server''s IP address for the WINS configuration
    so that clients contact the DHCP/WINS server for name resolution, just as they
    would if they were separate servers.


    # Can a domain controller be a WINS server?


    Yes. Your domain controller(s) can provide the WINS service. However, depending
    on the configuration and size of your network, you may want to use servers other
    than domain controllers to handle the WINS service. Doing so reduces the load
    on your domain controllers and improves their performance.


    ![](img/763d5ae436311371600c0952a3da9094_122_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_122_2.png)


    Click Next to continue.


    Select Networking Services in the list.


    Click Details.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# CHAPTER 5 CONFIGURING WINS


    # INSTALLING WINS CONTINUED


    If you have non-WINS clients on your networks, you can configure static name-to-IP
    address mappings for those clients and include them in the WINS database. This
    feature allows WINS clients to query the database to discover the name-to-IP address
    mapping for the non-WINS clients. By using this feature, you no longer


    need to use LMHOST files to keep track of non-WINS clients.

    After the installation is complete, you need to configure and set up the WINS
    server. WINS configuration is generally easy, and Windows 2000 does most of the
    configuration work for you by configuring default options that are standard in
    most


    networks. Typical default options include subnet mask and default gateway mappings.
    Keep in mind that once your network runs only Windows 2000 computers, WINS will
    no longer be necessary and can be removed from your servers. Refer to the following
    sections to configure your WINS server.


    ![](img/763d5ae436311371600c0952a3da9094_123_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_123_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_123_2.png)'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Do I have to configure WINS during the installation?


    +   * No. The installation places the service on your server. After the installation
    is complete, you must configure the service for operation.


    # Can I install other networking services when I install WINS?


    +   * Yes. You can select other networking components at the same time you install
    WINS and perform the installations together. Other networking components may present
    you with configuration wizards to complete before the installation takes place.


    # Can Windows NT servers on my network be WINS servers?


    +   * Yes. You can use your Windows NT servers to function as WINS servers, just
    as you did before implementing Windows 2000. Windows 2000 clients, NT clients,
    and Windows 9x computers can contact a WINS server for name resolution. In many
    mixed environments, Windows NT servers and Windows 2000 member servers are assigned
    the task of handling WINS and even DHCP. This feature reduces the load placed
    on domain controllers.


    ![](img/763d5ae436311371600c0952a3da9094_124_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_124_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_124_2.png)


    ![](img/763d5ae436311371600c0952a3da9094_124_3.png)'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# CONFIGURING WINS GENERAL PROPERTIES


    A s with other tools in Windows 2000 Server, the WINS manager is an MMC snap-in
    that enables you to configure and manage the local WINS server or other WINS servers
    in your network.


    Of course, you must install WINS before you can configure it. See the previous
    section for information on installing WINS. After you open the WINS snap-in.


    arrow next to the server name. This arrow denotes that the WINS service is connected
    and running. At this point, you can configure the WINS server to perform as you
    desire.


    You can also use this interface to administer all WINS servers on your network
    by simply adding other WINS servers to the interface. This feature enables you
    to manage your WINS environment from one location without having to physically
    visit each WINS server.


    In most cases, Windows 2000 allows administrators to load all servers for WINS,
    DHCP, DNS, and other components into a single MMC interface where they can all
    be configured together. This a great benefit for administrators who manage certain
    services rather than particular servers.


    ![](img/763d5ae436311371600c0952a3da9094_125_0.png)


    +   1. Choose Start→Programs→Administrative Tools→WINS to open the MMC snap-in.

    +   2. Select WINS at the top of the console tree.


    ■ The snap-in opens.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# TIPS


    # Can I manage all WINS servers on my network from this single snap-in?


    Yes. Assuming you have proper permissions, you can add all the WINS servers on
    your network to the snap-in so that you can administer all the servers from one
    location. This feature makes it easy for you to manage your total WINS environment.


    # Can I use a Windows NT 4.0 workstation for the WINS server?


    No. Only servers, such as Windows 2000 or Windows NT, can function as WINS servers.
    You cannot install the WINS server service on Windows 2000 Professional, Windows
    NT Workstation, or Windows 9x computers.


    # Can I manage both WINS and DHCP servers from the same MMC interface?


    Yes. You can create a custom interface by manually loading the two MMC snap-ins.
    Then, you can save the new MMC so that you can use it over and over. See Chapter
    12 to learn more about using the MMC.


    ![](img/763d5ae436311371600c0952a3da9094_126_0.png)


    +   1. Choose Action\>Add Server.


    ![](img/763d5ae436311371600c0952a3da9094_126_1.png)


    +   2. Type the name of the WINS server you want to administer.


    +   3. Or you can click the Browse button to browse for the server.


    +   4. Click OK.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# CONFIGURING WINS GENERAL PROPERTIES CONTINUED


    You can use the Action menu to perform standard operations, such as exporting
    the MMC list or obtaining help from the Windows 2000 help files. The Export List
    option allows you to save the WINS database file as a text file that you can read.


    You can also access the Properties for WINS through the Action menu. From the
    General tab of the Properties dialog box, you can choose to have the WINS servers
    displayed in the snap-in by name or IP address. You can also have the WINS snap-in
    show the DNS name


    of the WINS servers, and you can choose to validate the cache of the WINS servers
    at startup. These different features enable you to manage the WINS servers in
    a way that''s best for you and your networking environment.


    ![](img/763d5ae436311371600c0952a3da9094_127_0.png)


    **EXPORTING THE SERVER LIST**

    1. Choose Action->Export List to save the WINS server list data into a file.


    ![](img/763d5ae436311371600c0952a3da9094_127_1.png)


    +   2. Select a location where you want to save the file.

    +   3. Type a filename for the list.

    +   4. Select a file type from the drop-down menu.

    +   5. Click Save.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# TIPS

    Should I validate the WINS cache at startup?


    This option is not enabled by default because additional startup time is required
    to validate the WINS cache. You probably do not need this feature enabled, but
    if you do not mind the longer startup time, it is a good preventive feature.


    # Why does the snap-in enable you to view the servers by their DNS name?


    Because DNS is an integrated and integral part of Windows 2000, you can choose
    to set up your snap-in view so that the DNS name for each server is displayed.
    As Windows 2000 is more heavily implemented, administrators and users begin to
    see their servers and computers through the DNS naming scheme. This option simply
    makes your configuration easier to view after you are comfortable with the DNS
    names of your WINS servers.


    ![](img/763d5ae436311371600c0952a3da9094_128_0.png)


    +   1. Select WINS and choose Action->Properties to view general WINS properties.

    +   2. Click the appropriate radio button to show the servers either by name or
    IP address.


    ![](img/763d5ae436311371600c0952a3da9094_128_1.png)


    Click the appropriate check boxes to show the DNS names of the WINS servers and
    to validate the cache of WINS servers at startup.


    +   1. Choose Action->Help to open the Windows 2000 help files on WINS topics.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# CHECKING SERVER STATUS


    The WINS snap-in contains a server status icon that enables you to check the status
    of a server. When you click the Server Status icon, the WINS server is displayed
    in the right pane with a green icon telling you that it''s running. If a server
    is not running, the icon tells you that the server is not running and is displayed
    with a red icon. You can adjust the time between server status updates; the default
    is every five minutes. In most cases, the default setting is best. If you lower
    or increase the five-minute interval, you may see performance problems or a lack
    of timely data on the performance of your WINS servers. If you lower the status
    update to one minute, for example, the server has to update its status every 60
    seconds while also performing the many other tasks assigned to it. Although you
    want timely data to be displayed in the Server Status, you also do not want your
    server to work harder than necessary.


    ![](img/763d5ae436311371600c0952a3da9094_129_0.png)


    1 Select Server Status in the Console tree.


    ![](img/763d5ae436311371600c0952a3da9094_129_1.png)


    2 If you want to save the WINS database list to a file, choose Action→Export List.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# **TIPS**


    # **Should I lower the frequency of status updates?**


    The status updates are performed every five minutes by default. You can lower
    this value so that updates occur more often, or you can increase it so they do
    not happen as often. If you lower the value, the update checks perform more often,
    which increases the amount of time the server spends performing updates. If you
    increase the time too much, however, the status information will not be current.


    # **What is the purpose of the server status icon in the console?**


    The server status icon in the console enables you to quickly see the status of
    your WINS servers in the details pane. If you suspect that one of your WINS servers
    is not running, you can simply click the server status icon to determine if a
    server is down. If so, you can identify which server is down and then troubleshoot
    the problem.


    ![](img/763d5ae436311371600c0952a3da9094_130_0.png)


    **3** Choose **Action** → **Properties**.


    ![](img/763d5ae436311371600c0952a3da9094_130_1.png)


    **4** Type a new value to change the periodic update of the server status.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# MANAGING THE WINS SERVER


    You can check your server’s performance by accessing the server’s statistics.
    The statistical information returned to you includes information on replication
    with other WINS servers, the total number of name resolution queries, the records
    found and not found for queries, the total name reservation releases, as well
    as the number of WINS registrations. You can use this information to determine
    if the server is behaving in a satisfactory manner. You also have the option of
    resetting the current reading and refresh the statistics so that you can receive
    accurate, timely information. The server statistics information is a good way
    to determine how well your server is performing and if the server seems to be
    handling the registration and query load that network clients place on it. As
    a WINS administrator, you should get in the habit of checking your server’s status
    from time to time. This action can help you find existing problems and determine
    if future problems are developing.


    ![](img/763d5ae436311371600c0952a3da9094_131_0.png)


    **DISPLAYING SERVER STATISTICS**


    **1** Select the WINS server that you want to manage from the console tree.


    ![](img/763d5ae436311371600c0952a3da9094_131_1.png)


    **2** Choose Action\>Display Server Statistics.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '![](img/763d5ae436311371600c0952a3da9094_132_0.png)


    # Where can I find information about queries received by the WINS server?


    The server statistics give you information about the queries that are sent to
    the WINS server. From the statistics file, you can see the total number of queries,
    the records that were found, and the records that were not found. If you want
    to gain statistical information for a specific time period, you can reset the
    statistics record and view the statistics again after a period of time has passed.


    # I need to know when a particular WINS server started. How can I find this information?


    You can learn the start time of the WINS server by clicking the WINS server in
    the console and then choosing ActionDisplay Server Statistics. At the top of the
    list, you see an entry called Server start time. In the details column, the start
    time is displayed by date and time.


    ![](img/763d5ae436311371600c0952a3da9094_132_1.png)


    +   3 Use the Reset or Refresh buttons as necessary.


    +   4 Click Close when you are done.


    ![](img/763d5ae436311371600c0952a3da9094_132_2.png)


    # SCAVENGING THE DATABASE


    +   1 Choose ActionScavenge Database.'
  merge: -1
  img_proc: true
- pgno: 133
  md: "# MANAGING THE WINS SERVER \nCONTINUED\n\nYou perform a number of operations\
    \ by using the Action menu. First, you can scavenge the WINS database. As with\
    \ all databases, the WINS database collects information that becomes outdated.\
    \ Periodically, WINS needs to remove this outdated information, and this process\
    \ is known as scavenging. You don't need to force scavenging using the Action\
    \ menu unless you have specific reasons for\n\nwanting to clean the database—\n\
    WINS will do this automatically—\nthrough the settings on the Name \nRecord tab\
    \ in the server's Properties \nsheets (which you learn about later \nin this chapter.)\
    \ If you do manually \nscavenge the database, you should \nknow that the process\
    \ is very CPU- \nand network-intensive, so you \nshould scavenge only during \n\
    nonpeak hours.\n\nYou can also use the Action menu to run a check for consistency.\
    \ This task helps maintain database integrity among the WINS servers. In other\
    \ words, the check determines if the database is consistent among all the WINS\
    \ servers. The process is automatically scheduled, but you can force it to run\
    \ using the Action menu. As with the database scavenge, the process is CPU-intensive.\n\
    \n![](img/763d5ae436311371600c0952a3da9094_133_0.png)\n\n![](img/763d5ae436311371600c0952a3da9094_133_1.png)"
  merge: -1
  img_proc: true
- pgno: 134
  md: '# How much time does scavenging take?


    Depending on the size of your network, the amount of WINS traffic, and the last
    time the database was scavenged, the process may take some time to complete. You
    can still work with your server while the process is running, but you will notice
    a performance hit. Scavenging the database during off-peak hours is always best.


    # When is a good time to run a consistency check?


    Because consistency checking is both CPU- and network-intensive, you should try
    to perform the process during nonpeak hours. This includes both nonpeak hours
    for the server as well as the network. Typically, a good time to run consistency
    checking is at the end of a business day or early in the morning before business
    activities commence.


    # How does the WINS server know if all databases are consistent?


    The consistency check allows the WINS server to compare its database records with
    other WINS servers. The server finds and corrects inconsistencies so that the
    database is identical on all servers. This process is also CPU- and network-intensive.


    ![](img/763d5ae436311371600c0952a3da9094_134_0.png)


    1. A Warning message tells you that consistency checking is very CPU- and network-intensive.


    2. Click Yes to continue or No to exit.


    ![](img/763d5ae436311371600c0952a3da9094_134_1.png)


    If you click Yes, a message appears telling you that the database consistency
    check has been queued on the server.


    3. Click OK.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# ## MANAGING THE WINS SERVER

    ### CONTINUED


    You can also use the Action menu to check version number consistency. This check
    makes certain that each WINS server has the correct version number, which ensures
    that all servers have been tested for consistency. Each consistency check records
    a version number for the consistency check.


    Your server can tell if all WINS servers have been checked by examining the consistency
    numbers. This action is performed by the WINS server to check that each server
    has the highest consistency number. To do this, the WINS server where you run
    the check pulls the owner-version map from the WINS servers on your network and
    then checks the map for the highest version number. If all numbers are the same,
    each WINS server has been tested for consistency. When you run this check, a dialog
    box appears telling you the results or problems.


    ![](img/763d5ae436311371600c0952a3da9094_135_0.png)


    # ### VERIFYING VERSION ID CONSISTENCY


    +   1.  Choose **Action**> **Verify Version ID Consistency**.


    +   2.  Click **Yes** to continue or **No** to cancel.


    A message appears telling you that the operation may take a long time.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# TIPS


    Does the version check operation take a long time?


    +   Depending on the size of your network, the operation can take some time because
    the WINS server has to pull the owner-version maps and then compare the version
    numbers. If only a few WINS servers are on your network, then the process does
    not take an inordinate amount of time. However, if you have many servers, it can
    be a long process. The number of servers, network speed and congestion, and server
    processing power all affect the amount of time a version check takes.


    Do I need to run a version check regularly?


    +   No. A version check allows you to make certain that all servers have been
    checked for consistency. The version allows your server to check each server to
    make certain each server has the correct version number. If you think a server
    has not been checked or there is a problem communicating with a particular server,
    then you should run a version check.


    ![](img/763d5ae436311371600c0952a3da9094_136_0.png)


    +   A window displays the results when the check is complete.


    +   Click Close.


    ![](img/763d5ae436311371600c0952a3da9094_136_1.png)


    **PERFORMING A PUSH REPLICATION**


    +   See the section “Managing Replication Partners” for more information.


    +   To start a push replication, choose Action→Start Push Replication.


    CONTINUED'
  merge: -1
  img_proc: true
- pgno: 137
  md: "# MANAGING THE WINS SERVER CONTINUED\n\nAfter replication is set up, WINS database\
    \ replication among all WINS servers is managed automatically by WINS. However,\
    \ you can use the Action menu to manually force replication. You have the option\
    \ of using either a pull or push replication trigger. The pull trigger enables\
    \ you to enter the name of a WINS server you want to\n\npull replication from\
    \ and start the pull. The push trigger allows you to push replication to other\
    \ WINS servers. WINS replication functions in a partner design where one partner\
    \ is a pull partner while the other is a push partner. This design allows effective\
    \ replication between the two because one pushes changes while the other requests\
    \ changes.\n\nYou can also use the Action menu to manually back up the WINS database.\
    \ By default, the backup path is the root folder on your volume, such as C:\\\
    . You can change this, however. The WINS backup file is called Wins.mdb.\n\n![](img/763d5ae436311371600c0952a3da9094_137_0.png)\n\
    \n![](img/763d5ae436311371600c0952a3da9094_137_1.png)\n\n+   **PERFORMING A PULL\
    \ REPLICATION**\n+   \n+   See the section \"Managing Replication Partners\" for\
    \ more information."
  merge: -1
  img_proc: true
- pgno: 138
  md: '# TIPS


    Does a push or pull replication trigger interrupt the WINS server(s) operations?


    +   No. Replication occurs in the background and the process does not hinder the
    work of the WINS servers. You may see a performance decrease among the servers
    during the process, but they are still operational. If you need to use a push
    or pull replication trigger, you should wait until nonpeak network hours, which
    are typically early in the morning or late in the evening when network traffic
    and server requests are low.


    Can I save the backup file in any location on your volume?


    +   Yes, you can browse to any location on your volume to save the WINS backup
    file. If you do not store the backup file in the default location, you should
    keep records so that you know exactly where the WINS database file, along with
    other database files, is stored. Many administrators choose to store backup files
    on other hard drives or even removable media.


    ![](img/763d5ae436311371600c0952a3da9094_138_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_138_1.png)


    # BACKING UP THE DATABASE


    +   To back up the database, choose Action®Back Up Database.


    Browse to the backup folder you want to use.


    Click OK.






    11'
  merge: -1
  img_proc: true
- pgno: 139
  md: "MANAGING THE WINS SERVER\nCONTINUED\n\nThe Action menu's All Tasks feature\
    \ enables you to stop, start, restart, pause, and resume the WINS server. In some\
    \ cases, such as troubleshooting, you may need to stop or restart the service.\
    \ Through this menu item, you can easily accomplish this task.\n\nThe WINS server\
    \ also has Properties sheets that you can access from the Action menu. On the\
    \ General tab, you can configure the time between statistic updates. The default\
    \ is ten minutes, but you can change this as desired. You can also specify a location\
    \ for the WINS backup file and configure the server to backup the database whenever\
    \ the server shuts down.\n\nWhen you select this option, your server may take\
    \ longer to shut down because the database has to be backed up, but the option\
    \ is a good fault tolerance method so that you always have a backed-up copy of\
    \ the database when you restart your server.\n\n![](img/763d5ae436311371600c0952a3da9094_139_0.png)\n\
    \n![](img/763d5ae436311371600c0952a3da9094_139_1.png)\n\n+   1. A message appears\
    \ telling you the backup was completed successfully.\n\n2. Click OK.\n\n+   3.\
    \ **USING THE ALL TASKS FEATURE**\n+   \n+   1. Choose Action^All Tasks to start,\
    \ stop, pause, resume, or restart the WINS service."
  merge: -1
  img_proc: true
- pgno: 140
  md: '![](img/763d5ae436311371600c0952a3da9094_140_0.png)


    # Should I change the statistic update time?


    The default time is ten minutes, which gives you accurate information about the
    WINS server’s performance. You can lower the time if desired, but this causes
    the server to do more update checks. If you increase the time, you may not receive
    as accurate statistical information as desired. The default setting is best, so
    make sure that you have a specific reason to change it before doing so.


    # Should I have the server back up the database each time it shuts down?


    Using the General tab in the Properties dialog box, you can tell the WINS server
    to back up the database every time the server shuts down. This option is not enabled
    by default, but it is a good safety measure. This action, however, may slow the
    time it takes to shut down the server.


    ![](img/763d5ae436311371600c0952a3da9094_140_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_140_2.png)


    # CHANGING THE STATISTIC UPDATE TIME


    +   1. Choose **Action**➔**Properties**.


    +   2. On the **General** tab, use these boxes to change the statistic update
    time.

    +   3. Enter a location for the backup path.

    +   4. Or use the **Browse** button to browse for the location.

    +   5. Click here to back up the database every time the server shuts down.'
  merge: -1
  img_proc: true
- pgno: 141
  md: "# MANAGING THE WINS SERVER\n\n# CONTINUED\n\nOn the Intervals tab, you can\
    \ adjust the name record settings, such as the renew interval, extinction interval,\
    \ and verification interval. These settings control the rate at which records\
    \ are renewed, deleted, and verified.\n\nOn the Database Verification tab, you\
    \ can configure database verification to occur at certain intervals. If you enable\
    \ this option, the default is every 24 hours. You can also change the number of\
    \ records that are verified in each period, with the default being 3,000.\n\n\
    The Advanced tab enables you to configure logging options as desired. Burst handling\
    \ is also configured on this tab. Burst handling allows the server to write database\
    \ changes to a temporary file called jet.log in order to improve performance.\
    \ This way, if there are many requests for updates from clients, the server can\
    \ handle them all by using the temporary log until all the changes can be written\
    \ to the actual database. You should allow the server to use burst handling; otherwise,\
    \ clients have to requery the server during high update request times.\n\n![](img/763d5ae436311371600c0952a3da9094_141_0.png)\n\
    \n![](img/763d5ae436311371600c0952a3da9094_141_1.png)\n\n+   **ADJUSTING INTERVALS**\n\
    +   \n+   1. Click the Intervals tab.\n+   2. Use these boxes to change the interval\
    \ records as desired.\n\n+   3. If you want to restore the default settings, click\
    \ Restore Defaults.\n+   4. Click OK when you are done.\n\n+   **MANAGING DATABASE\
    \ VERIFICATION**\n+   \n+   1. Click the Database Verification tab.\n+   2. Use\
    \ these boxes to change the frequency of the database consistency check; change\
    \ the verification timing; and change the maximum number of records verified each\
    \ period.\n+   3. Click the appropriate radio button to verify against owner servers\
    \ or random partners.\n+   4. Click OK."
  merge: -1
  img_proc: true
- pgno: 142
  md: '# TIPS


    What are the burst settings I can choose from?


    The burst handling settings enable you to tell the server how many requests can
    occur before burst handling takes effect. Each setting allows a certain number
    of name registrations or refresh requests in the burst queue before burst handling
    begins. You have four settings to choose from (the default setting is Medium):


    +   - Low: 300 registrations and name refresh requests in the burst queue before
    burst handling begins


    +   - Medium: 500 registrations and name refresh requests in the burst queue before
    burst handling begins


    +   - High: 1,000 registrations and name refresh requests in the burst queue before
    burst handling begins


    +   - Custom: Enter the desired number of registration and name refresh requests
    in the burst queue before burst handling begins.


    ![](img/763d5ae436311371600c0952a3da9094_142_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_142_1.png)


    # ADJUSTING ADVANCED SETTINGS


    +   1. Click the Advanced tab.

    +   2. Use these check boxes and radio buttons to log detailed events and to enable
    burst handling.


    +   3. Change the default database path here.

    +   4. Click this check box to use computer names that are LAN Manager-compatible.

    +   5. Click OK when you are done.


    # ACCESSING HELP


    +   1. For help with WINS server management, choose Action>Help.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# MANAGING REGISTRATIONS


    The Registrations container in the console tree enables you to perform several
    actions concerning the current WINS registrations.


    First, you can find records that currently exist. You can find a record by searching
    for the name of the record (or closest match) or for the record''s owner. To find
    a record by the owner, you search all WINS servers for the record, or you can
    search a particular owner, which allows you to select a server from the list and
    run the search. The owner search allows to WINS database to find records for certain
    WINS server owners. Note that an owner search can be network-intensive because
    the search requires downloading databases from remote WINS servers. Depending
    on the size of the databases and network traffic conditions, the process can consume
    a lot of network bandwidth.


    ![](img/763d5ae436311371600c0952a3da9094_143_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_143_1.png)


    # FINDING RECORDS BY NAME


    +   1.  Select the Active Registrations container in the console tree and choose
    Action:\Find by Name.


    +   2.  Type the name you want to find.

    +   3.  Click this check box to match the case.

    +   4.  Click Find Now.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# If I search by owner, are all registration records returned?


    Yes. The owner search pulls all the WINS registration records for all WINS servers
    or for a particular server, depending on which action you select. After the list
    appears in the details pane of the snap-in, you can browse the list to find the
    record that you want to view.


    # How does the Find by Name function work?


    The Find by Name function enables you to search for particular name records through
    a set of characters. You enter the name you want to search for, and the WINS server
    uses the search entry to find all NetBIOS names that closely match your request.


    # Can I filter a Find by Owner function?


    Yes. You can refine a Find by Owner search by filtering the search so that it
    only provides the types of records you want returned. You can filter the search
    by using the Record Types tab and checking or unchecking your desired returns.


    ![](img/763d5ae436311371600c0952a3da9094_144_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_144_1.png)


    +   1. Choose Action→Find by Owner.

    +   2. Click either the All Owners or This Owner radio button.

    +   3. If you click This Owner, select an owner from the list.

    +   4. Click Find Now.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# MANAGING REGISTRATIONS CONTINUED


    From the Registrations container, you can also click the Action menu to define
    a static mapping and to import an LMHOSTS file.


    You use the static mapping feature to create static name-to-IP address mappings
    in the WINS database. This mapping is replicated to all


    other databases and overwrites any conflicting records. You can use the static
    mapping only for non-WINS clients or clients that cannot dynamically register
    with the WINS database.


    You can also import an LMHOSTS file into the WINS database. An LMHOSTS file is
    a static file that


    contains NetBIOS-to-IP address mappings. The import feature is used to preserve
    these mappings within the WINS database. Although LMHOSTS files are not typically
    used any longer, this feature is helpful if you have a static list of name-to-IP
    address mappings in an LMHOSTS file that you want to import into the WINS database.


    ![](img/763d5ae436311371600c0952a3da9094_145_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_145_1.png)


    +   **USING STATIC MAPPING**

    +   1. Choose Action->New Static Mapping.

    +   2. Enter the Computer Name, NetBIOS scope (if needed), Type, and IP Address.

    +   3. Click OK.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# TIPS


    # Why can''t I create a static mapping for a normal WINS client?


    The static mapping feature is designed for non-Windows clients that cannot dynamically
    register their NetBIOS name and IP address with the WINS server. WINS clients
    automatically perform this action and attempt to update their mapping information
    as it both changes and expires.


    # How does an LMHOSTS file work?


    An LMHOSTS file is simply a text file that lists a computer’s NetBIOS name and
    that computer’s IP address. When resolution needs to occur, the computer can check
    the LMHOSTS file to find the NetBIOS name of the computer and resolve that name
    to an IP address. Although you do not need to use LMHOSTS files in a WINS network,
    Windows 2000 allows you to import them into the WINS database so they can be used.
    This is particularly helpful for static mappings you have already configured.


    ![](img/763d5ae436311371600c0952a3da9094_146_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_146_1.png)


    # IMPORTING AN LMHOSTS FILE


    +   1. Choose Action->Import LMHOSTS File.


    +   2. Browse to locate the LMHOSTS file and then select it.


    +   3. Click Open. The LMHOSTS file is imported.


    CONTINUED'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# MANAGING REGISTRATIONS CONTINUED


    Finally, the Registrations container Action menu enables you to verify a set of
    name records and also delete owners.


    The Verify Name Records option allows you to verify a set of name records on specific
    servers. To perform this action, you either select a file or create a list of
    name records that you want to verify. Then, you select either a server or a list
    of servers by IP address to verify the records on. The record verification feature
    checks the records that you specify and verifies if the records are valid in the
    WINS database. When you perform the check, you also have the option of verifying
    all name records with all partners of the servers that you select.


    You can also delete an owner. The owner deletion removes the selected owner and
    all the owner''s records. You have the option to delete the owner from the server
    only or to replicate the deletion to all other WINS servers. This action creates
    a tombstone marker, which is then replicated to the other servers. A tombstone
    is simply a marker that a record has been deleted. The tombstone remains until
    all WINS servers have received the deletion request, and then the tombstone is
    removed.


    ![](img/763d5ae436311371600c0952a3da9094_147_0.png)


    +   1. **VERIFYING NAME RECORDS**

    +   2. Choose Action > Verify Name Records.

    +   3. Enter the information in these boxes to verify the name records on specific
    services.

    +   4. Click OK after you enter the information.


    +   1. 2 Enter the information in these boxes to verify the name records on specific
    services.

    +   2. You can verify a particular file or a list.

    +   3. 3 Click OK after you enter the information.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# TIPS


    Why would I want to verify a name record?


    The name record feature enables you to check the WINS registrations for a particular
    name record. The verification returns information to you about the registration.
    This tool is particularly useful for troubleshooting WINS registration problems
    or issues.


    What does the tombstone do?


    When you delete an owner, you can delete the owner on a particular server or have
    the deletion replicated to other servers. If the deletion is replicated, a tombstone,
    which is a marker, is replicated so that other servers know the owner has been
    deleted. Each server holds the tombstone until all servers receive the deletion
    request. After all servers receive the tombstone, the owner and all records for
    that owner are deleted. The tombstone method is an effective way to make certain
    that servers receive the deletion request before actual deletion takes place.


    ![](img/763d5ae436311371600c0952a3da9094_148_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_148_1.png)


    +   **1** Choose Action\Delete Owner.


    +   **2** Select the owner you want to delete.


    +   **3** Click the appropriate radio button to either delete from this server
    only or to replicate deletion to other servers (tombstone).


    +   **4** Click OK.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# MANAGING REPLICATION PARTNERS


    WINS replication ensures that all WINS server databases are replicated so that
    each server has an accurate copy. Replication occurs through the use of replication
    partners. This enables you to structure replication so that each server has a
    partner closest on the network for replication. For replication to work, each
    WINS server must be configured to have at least one replication partner. This
    design ensures that all records and changes are replicated to all WINS servers.
    Partners can either be push or pull. Partners, or they can be both push and pull.
    The push/pull partner offers the best performance and is the default configuration.


    Replication occurs on a set schedule, but you can use the Action menu to force
    replication at desired. Generally, allowing the schedule to handle the replication
    requests is usually best unless you have a specific reason to force the replication.


    ![](img/763d5ae436311371600c0952a3da9094_149_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_149_1.png)


    # CREATING A NEW REPLICATION PARTNER


    +   1. Select the Replication Partners container, and then choose Action:New Replication
    Partner.


    +   2. Type the name or IP address of the server you want to add as a replication
    partner.


    +   3. Click OK.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# TIPS


    # Is replication really necessary?


    Replication ensures that your WINS servers have each other''s data. This action
    maintains one WINS database so that clients can be serviced from any WINS server.
    If multiple WINS servers are used in your network, replication is a necessary
    component of the WINS functionality to ensure that you have the best performance
    and reliability for WINS operation.


    # Why would I force replication?


    Generally, you do not need to force replication among partners. Replication occurs
    automatically and the replication partners maintain a replication schedule. However,
    in some cases, especially if you have replication concerns, you may want to force
    WINS replication to attempt to resolve any accessibility problems WINS clients
    may be experiencing.


    ![](img/763d5ae436311371600c0952a3da9094_150_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_150_1.png)


    # FORCING REPLICATION


    +   1. To force replication, choose Action\RePLICATE NOW.

    +   2. Click OK.

    +      A message tells you that the replication request has been queued.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# MANAGING REPLICATION PARTNERS CONTINUED


    You can configure the partner replication by accessing the properties sheet, which
    has four tabs.


    On the General tab, you can choose whether or not to replicate only with partners.
    This action is selected by default and should not be changed unless you have specific
    reasons for doing so. You can also choose to overwrite unique static mappings
    at this particular server. This allows the server to overwrite the static records
    when they conflict with a new name registration.


    On the Push Replication tab, you can configure push replication to occur at startup
    or when the address changes, which informs pull partners of the database status
    when an address changes in the mapping record. You can also determine the number
    of changes in version ID that must occur before replication— the default is 0.
    And you can choose whether to use persistent connections for replication with
    push partners.


    ![](img/763d5ae436311371600c0952a3da9094_151_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_151_1.png)


    +   **CONFIGURING PARTNER REPLICATION**

    +   1.  On the General tab, you can select Replicate with partners only and Overwrite
    unique static mappings at this server by selecting the check boxes.


    +   2.  Click the Push Replication tab.

    +   3.  Click the appropriate check boxes to enable push replication at startup
    and/or when the address changes.

    +   4.  Enter a value here if you want a specific number of version ID changes
    before replication occurs.

    +   5.  Click this check box to use a persistent connection for push replication
    partners.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# What options does the **Pull Replication tab** offer?


    On the Pull Replication tab, you can configure the start time of the replication.
    You can set the time in hours, minutes, and seconds. When the pull replication
    should begin. If the values are set to 0: 0, then no automatic pull replication
    occurs. You can also configure the replication interval, which is the amount of
    time in days, hours, and minutes that should pass between each pull replication.
    You can also choose to start replication at service startup and to use a persistent
    connection for all pull replication partners.


    # What options does the **Advanced tab** offer?


    On the Advanced tab, you can choose to block records for certain owners. This
    feature enables you to block other WINS servers from having their records replicated
    to your WINS servers. You also have the option to enable automatic partner configuration.
    This method is designed for small networks and allows the WINS server to use a
    broadcast approach to automatically configure itself with a partner for replication.


    ![](img/763d5ae436311371600c0952a3da9094_152_0.png)


    +   - **6** Click the Pull Replication tab.

    +   - **7** Enter the start time for pull replication.


    +   - **8** Enter the desired replication interval.

    +   - **9** Use these check boxes to start pull replication at service startup
    and to use persistent connections for pull partners.


    ![](img/763d5ae436311371600c0952a3da9094_152_1.png)


    +   - **10** Click the Advanced tab.

    +   - **11** Click Add to block certain records for particular owners so that
    they are not replicated.


    +   - **12** Click this check box to enable automatic partner replication using
    multicast.

    +   - **13** Click OK to save any changes.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# DOMAIN NAME SYSTEM OVERVIEW


    To effectively plan, implement, and maintain the Active Directory, you work with
    Domain Name System (DNS). DNS is an industry standard for resolving host names
    to IP addresses and IP addresses to host names. DNS is the primary naming system
    of choice in Windows 2000 networks. Why? Because DNS is widely used, accepted,
    and highly extensible. Every time you use the Internet, the URL you type in your
    browser is resolved to an IP address by DNS.


    DNS is fully integrated with Windows 2000 and the Active Directory, and public
    domain names like www.microsoft.com can also be private names on your network.
    JohnD@corp.com is an e-mail address on the Internet and also a username in the
    Active Directory. With DNS as the naming structure in the Active Directory, users
    have to learn only one naming convention for the local network and Internet, and
    the use of DNS on the local network provides a more seamless approach to combining
    the local network and the Internet, as many organizations are doing today.


    In order to effectively implement the Active Directory, you must have a firm understanding
    of DNS concepts and how to configure your Windows 2000 server as a DNS server.
    To fully understand DNS, you must first understand the DNS namespace.


    DNS namespace


    A namespace is any area that can be resolved. A telephone book is a namespace
    in that all persons are listed by last name, first name, and address. By accessing
    this information, you can “resolve” the name into a telephone number. No matter
    who you want to call, you use the same process over and over to resolve different
    persons to different numbers.


    DNS functions in much the same way. DNS is structured in such a way that www.infoseek.com
    or www.ucia.edu can be resolved to an IP address. Remember that computers on a
    TCP/IP network can communicate using only an IP address—friendly names must be
    resolved. DNS can accomplish this because all names are structured in a hierarchical
    fashion based on different domains.


    The hierarchical structure of DNS is built on the DNS tree. At the top of the
    DNS tree is the root domain, called the Internet root. This is represented by
    a period.


    ![](img/763d5ae436311371600c0952a3da9094_153_0.png)'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Next in the tree is the first-level domain. First-level domains are made up
    of large divisions of names that you see at the end of the DNS name. Common examples
    are com, edu, net, gov, mil, org, and even foreign country initials such as jp
    (for Japan) and au (for Australia).


    ![](img/763d5ae436311371600c0952a3da9094_154_0.png)


    Next in the tree is the second-level domain. The second-level domain represents
    some business or organization and is normally a friendly name that users can recognize.


    ![](img/763d5ae436311371600c0952a3da9094_154_1.png)'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# DOMAIN NAME SYSTEM OVERVIEW CONTINUED


    Next, some domains may contain subdomains that further divide the second-level
    domain. These subdomains, also called child domains and grandchild domains, may
    be different divisions or groups within the second-level domain company.


    ![](img/763d5ae436311371600c0952a3da9094_155_0.png)


    When resolution reaches a host—which is a computer within the domain—the DNS name
    is said to be a Fully Qualified Domain Name.


    ![](img/763d5ae436311371600c0952a3da9094_155_1.png)


    A Fully Qualified Domain Name can be resolved for the top of the tree down to
    the host computer. Much like how the postal system can deliver a piece of mail
    to your home by resolving the zip code, state, city, street address, and then
    your name, DNS can resolve host names to IP address by resolving the root domain,
    first-level domain, second-level domain, subdomains (if present), and the host.
    In the example in Figure 6-6, any computer can reach Server12 by allowing DNS
    to resolve it to its IP address.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '![](img/763d5ae436311371600c0952a3da9094_156_0.png)


    First, a computer requests a resolution for a FQDN — for example, **server12.prod.transcont.net**.
    The client sends the request to a local DNS server for resolution. If the DNS
    server does not have authority over the domain **corp.com**, then it has to go
    through a resolution process with other servers, beginning with an Internet root
    server. The DNS server asks the Internet root server for the IP address of a “com”
    server to begin the resolution process.


    ![](img/763d5ae436311371600c0952a3da9094_156_1.png)


    # Understanding name resolution


    Fully Qualified Domain Names (FQDN) must be resolved to IP addresses in order
    for network communication to occur. The DNS name resolution process is performed
    by resolving each domain in FQDN, beginning at the top of the hierarchy and working
    its way down. On your network, a DNS server may be able to check its database
    file and resolve a FQDN to an IP address. On the Internet, this process normally
    requires several servers. Different DNS servers must resolve each portion of the
    DNS name until the host is eventually reached and an IP address can be returned.
    This process is called a *forward lookup query*.


    The Internet root returns the IP address of a com server, and then the DNS server
    contacts this server for the IP address of a “corp” DNS server. The com server
    checks its database and returns the IP address of a transcont DNS server.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# # DOMAIN NAME SYSTEM OVERVIEW CONTINUED


    ![](img/763d5ae436311371600c0952a3da9094_157_0.png)


    The DNS server then queries the transcot DNS server for the IP address of a prod
    DNS server. The prod DNS server checks its database and returns the IP address
    to the DNS server.


    The DNS server then queries the prod DNS server for the IP address of Server12.
    The acct DNS server checks its database and returns the IP address of Server12
    to the DNS server.


    ![](img/763d5ae436311371600c0952a3da9094_157_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_157_2.png)


    The DNS server then returns the IP address mapping to the client computer. The
    client computer can now establish a TCP/IP communication session with the server
    using the server''s IP address.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '![](img/763d5ae436311371600c0952a3da9094_158_0.png)


    A communication session can now be established using Server3''s IP address.


    This process can resolve any FQDN, and the entire process is invisible to the
    user.


    # Understanding DNS zones


    A final DNS concept you should understand is DNS zones. Zones are used to subdivide
    administrative duties. A zone is a discrete and contiguous portion of the DNS
    namespace. Due to administration needs, zones provide a way to partition the namespace
    so that it can be managed by different persons. For example, you


    company may have divisions, such as “production” and “administration.” In order
    to help IT administrators, the network can be divided into a “production zone”
    and an “administrative zone.” This feature allows different groups of administrators
    to handle the DNS tasks in each zone.


    Each DNS zone contains at least one DNS server that contains the DNS database
    for that zone. The DNS server can resolve name-to-IP-address queries for that
    zone. The main DNS server in the zone holds the primary zone database file. If
    other DNS servers are in the zone, they contain a secondary zone DNS database
    file. The secondary zone database file is a copy of the primary zone database
    file and it cannot be updated. Only changes to the primary zone database file
    can be made, and then the secondary zone database files are updated by a replication
    process known as zone transfer. Because only one DNS server can hold the primary
    zone database file and make changes to the file, that server is said to have authority
    over the zone. This DNS server may be referred to as the authoritative DNS server
    for the zone. Because of the zone transfer process, additional DNS servers can
    be used in the zone to help with FQDN queries, but only one DNS server is authoritative.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# INSTALLING DNS


    You can install the DNS service in the same manner as you install other networking
    components in Windows 2000 Server. You can use the Add/Remove programs feature
    in Control Panel and then access the Add/Remove Windows Components button to add
    the service. Or you can add the DNS service by using the Configure Your Server
    application in Administrative Tools.


    You should note that you are prompted to install DNS when you install the Active
    Directory, but you can install it ahead of time to configure the DNS service if
    desired. If not, the Active Directory installation prompts you—then setup can
    automatically install the service and perform a basic setup of DNS. You cannot
    install the Active Directory without installing DNS, and after you install the
    Active Directory, your server automatically becomes a domain controller. You can
    think of the Active Directory and DNS as partners—the Active Directory uses the
    DNS service to resolve domain names to IP addresses and it is an integrated part
    of the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_159_0.png)


    +   1. Open Control Panel and double-click Add/Remove Programs.


    ![](img/763d5ae436311371600c0952a3da9094_159_1.png)


    +   2. Click Add/Remove Windows Components.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '![](img/763d5ae436311371600c0952a3da9094_160_0.png)


    # Do I need to set up the DNS service before installing the Active Directory?


    No. The Active Directory installation automatically prompts you to install an
    initial configuration using the information you enter into the Active Directory
    installation wizard. However, you can choose to install and set up the service
    before you install the Active Directory if desired.


    # Can I have a Windows 2000 domain controller that does not run the Active Directory?


    No. The act of installing the Active Directory automatically promotes a server
    to domain controller status. The act of removing the Active Directory automatically
    demotes a server from domain controller status. You cannot have a Windows 2000
    domain controller that does not run the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_160_1.png)


    +   1. The Windows Components Wizard appears.


    +   2. Click **Next** to continue.


    ![](img/763d5ae436311371600c0952a3da9094_160_2.png)


    +   3. Select **Networking Services**.


    +   4. Click **Details** to see what is included in a component.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# INSTALLING DNS **CONTINUED**


    T here is no difference between using Add/Remove Programs in Control Panel to
    install the service and using the Configure Your Server program in Administrative
    Tools. If you want to use the Configure Your Server program, simply choose Start**Programs**Administrative
    Tools. In the left pane, expand Networking and click


    the DNS Service link to start the installation.


    After the installation is complete, you need to configure the DNS server for service
    on your network. DNS is not automatically set up and configured upon installation
    as some of the other networking components are, so you have to configure it so


    that it functions appropriately in your network. Also, once installation is complete,
    you are not prompted to start a configuration wizard. The installation simply
    ends, and then your next step is to access the DNS Management console and begin
    the configuration process. The next section shows you how to configure the DNS
    service.


    ![](img/763d5ae436311371600c0952a3da9094_161_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_161_1.png)


    +   **6**  Click the Domain Name System check box.


    +   **7**  Click OK.


    +   **8**  Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 162
  md: "# TIPS\n\nWhy does Windows 2000 Server provide two different ways to install\
    \ components?\n\nThese options are provided for administrative ease and user preference.\
    \ You can install most major components in Windows 2000 Server through either\
    \ Add/Remove Programs or the Configure Your Server program. You can perform many\
    \ other tasks in Windows 2000 in several ways. No right or wrong way exists to\
    \ configure your server—just pick which one works best for you.\n\nCan I configure\
    \ the DNS service at a later time?\n\nYes. You can install any networking component\
    \ and configure the component at a later time if desired. You should note that\
    \ the DNS service will not be active and cannot resolve FQDNs to IP addresses\
    \ until you configure the service.\n\n![](img/763d5ae436311371600c0952a3da9094_162_0.png)\n\
    \n![](img/763d5ae436311371600c0952a3da9094_162_1.png)\n\n+   4  The system installs\
    \ DNS.  \n+   The status bar indicates the level of completion.\n\n+   5  Click\
