- pgno: 438
  md: '# **What permissions should generally be allowed for OUs?**


    In most environments, the typical permissions are assigned by default. This gives
    enterprise admins Full Control while allowing users Read access. You want your
    users to be able to read the OUs and their contents, but you do not want them
    to be able to make any configuration changes. In the same manner, you typically
    want enterprise admins, who administer the Active Directory, to have Full Control
    over all objects, including OUs.


    # **What is the easiest way to configure OU security?**


    The easiest way to configure OU security is to simply leave the default settings
    and use them. The default settings for all Active Directory objects are typically
    all that are needed in most Active Directory environments. You can make changes
    to the security settings as desired, but do take a look at your security plan
    and your real-world security needs before making excessive changes to default
    settings.


    ![](img/763d5ae436311371600c0952a3da9094_438_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_438_1.png)


    +   13 Click Change if you want to move from one user/group to another to set
    permissions for another object.

    +   14 Use this drop-down box to choose whether to apply permissions to only this
    object or to all child objects.

    +   15 Click the appropriate Allow or Deny check boxes to configure the desired
    security features.

    +   16 Click the Properties tab.

    +   17 Use this drop-down box to choose whether to apply permissions to only this
    object or to all child objects.

    +   18 Click the appropriate Allow or Deny check boxes to configure the desired
    security features. Click OK.'
  merge: -1
  img_proc: true
- pgno: 439
  md: '# SETTING UP DOMAIN SECURITY


    **D**omain security, in terms of the Active Directory, affects how users access
    the domain for resources. Obviously, you can implement additional security features,
    such as encryption and certificates, for domain logon. After users are authenticated
    and become Active Directory users, the security you set on the domains for the
    Active Directory determines how users access resources in those domains. The Active
    Directory enables you to set security for each domain in the Active Directory.
    By design, you can control which groups or users can access the domain and what
    they do with the resources inside the domain.


    Security for Active Directory domains is configured on the Security tab on each
    domain''s properties sheets. The Security tabs for each domain appear the same
    and have the same basic options. This level of administration enables you to finely
    control your Active Directory domain and how users and groups can access a domain.


    ![](img/763d5ae436311371600c0952a3da9094_439_0.png)


    +   1. Choose Start→Programs→Administrative Tools→Active Directory Users and Computers.

    +   2. Select the desired domain and choose Action→Properties.'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# TIPS


