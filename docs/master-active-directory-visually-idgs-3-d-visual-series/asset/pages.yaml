    +   3 Click the check box to either enable or disable the policy setting.


    +   4 Click Add.


    +   5 Select the desired groups, then click OK.

    +       * You can also use the Remove button to remove any existing groups.

    +       5 Click OK.'
  merge: -1
  img_proc: true
- pgno: 560
  md: '# DENYING LOGON LOCALLY


    L ogging on locally means that a user can sit down at a computer and log onto
    the machine. Whereas users may be able to logon to a computer over the network,
    you can choose to deny the logon locally right to various users and groups as
    desired. This prevents certain users and groups from physically sitting down at
    computers and logging onto them.


    ![](img/763d5ae436311371600c0952a3da9094_560_0.png)


    +   2. Double-click the Deny Logon Locally policy setting.

    +   3. The Deny Logon Locally policy window appears.

    +   4. Click the check box to either enable or disable the policy setting.

    +   5. Click Add.

    +   6. Select the desired groups, then click OK.

    +   7. You can also use the Remove button to remove any existing groups.

    +   8. Click OK.'
  merge: -1
  img_proc: true
- pgno: 561
  md: '# APPENDIX A


    # ENABLING COMPUTER AND USER ACCOUNTS TO BE TRUSTED FOR DELEGATION


    T his policy allows computers and user accounts to be trusted for delegation by
    the


    users or groups that you specify in the policy. Typically, you should only allow
    administrators or other


    advanced groups, such as Power Users, the right to delegate.


    ![](img/763d5ae436311371600c0952a3da9094_561_0.png)


