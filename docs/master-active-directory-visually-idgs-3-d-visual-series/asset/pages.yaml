    Finally, the Advanced tab enables you configure the number of times DHCP should
    perform a conflicting detection before leasing an IP address to the client. You
    can also change the default audit log path and DHCP database path if desired.


    ![](img/763d5ae436311371600c0952a3da9094_117_0.png)


    +   2. To configure the server s properties, choose Action>Properties.


    +   3. On the General tab, click the appropriate check boxes to make changes to
