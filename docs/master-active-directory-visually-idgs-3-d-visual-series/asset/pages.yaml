- pgno: 227
  md: '# # DNS NAMESPACE


    To find out more about the DNS namespace before you begin your planning, refer
    to Chapters 1 and 6. Active Directory names are DNS names because the Active Directory
    naming scheme follows the DNS hierarchical naming format.


    The overall purpose of the Active Directory is to enable users to easily find
    objects located on your network. This is accomplished by giving each object in
    the Active Directory a fully qualified domain name so that it cannot be confused
    with any other object. In order for this to occur in a manner that benefits your
    network, you must carefully plan your DNS namespace. This process begins by establishing
    your root domain.


    # # WHY THE NAME IS SO IMPORTANT


    DNS is a name resolution method—it maps IP addresses to hostnames so that clients
    and servers in a TCP/IP network can communicate with one another. This process
    occurs by resolving the fully qualified domain name to an IP address. Without
    this method of name resolution, network communication cannot take place.


    On your network, DNS with the Active Directory is used to resolve computers to
    IP addresses. If you want to have a presence on the Internet, your domain name
    must be accepted and registered with Network Solutions. Because most companies
    host Internet sites, your DNS name will determine how customers contact and communicate
    with you and how users on your network see different domains. Commonly, the DNS
    name chosen for your network is based on the name of your company, but this is
    not always the case. As an IT professional, be aware that your DNS name affects
    your network and Internet presence and has as much to do with management and marketing
    decisions as it does IT decisions. Because of these issues, you should take care
    when determining your domain name and make certain that all necessary decision
    makers in your company participate in the planning process.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# HOW SHOULD I DECIDE MY

    DOMAIN NAME?


    The following sections point out several important issues you should consider
    when planning your domain name.


    # Choose a representative name


    Your domain name should be a friendly, recognizable name for your business or
    organization. Common examples of recognizable domain names are: microsoft.com,
    amazon.com, ucla.edu, and irs.gov.


    Each of these names represent the entire organization to which the namespace applies.
    You do not want your root domain to be a segment of a larger organization;


    the name you select should represent the entire organization or business. The
    Active Directory can only accommodate one root domain name for an organization—and
    that name should be static. In other words, companies merge and reorganize on
    a regular basis, but the company or organization name usually remains the same.
    In order to change the domain name of your organization, you have to completely
    reinstall the Active Directory, so plan your domain name carefully!


    Wilson-Adams Inc.


    ![](img/763d5ae436311371600c0952a3da9094_228_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_228_1.png)'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Consider this example: Wilson-Adams, Inc., is a large video game and entertainment
    software development company. Wilson-Adams is headquartered in Dallas, but they
    have offices and production plants in Tulsa, San Diego, Atlanta, and Tampa. Wilson-Adams
    does not currently have a presence on the Internet, but they plan to open an Internet
    site and sell their products online. To plan their DNS root, the network administrators
    at Wilson-Adams need to look at the entire organization as well as Internet access.


    As Wilson-Adams plans the domain root, they need to make the name as all-encompassing
    as possible so that the name can cover everything in their organization. In other
    words, the domain root should not have to "grow and change" as the organization
    grows and changes.


    # Plan for Internet presence


    Many companies and organizations host Internet sites. From these sites, the companies
    and organizations advertise their products and services and even sell those services
    over the Internet. When you plan your domain name, consider your organization''s
    presence on the Internet. If you are planning or already have an Internet domain
    name, then your Active Directory DNS implementation can be the same as your Internet
    domain name.


    For example, say alphatoys.com has an Internet site and is implementing the Active
    Directory. Alpha Toys already has their domain name registered with Network Solutions,
    so they can simply use the alphatoys.com domain name as their Active Directory
    domain name.


    If you do not have an Internet presence, but you intend to create one in the future,
    then you should register your name with Network Solutions before implementing
    the Active Directory domain name. By doing so, you can use the same name for your
    domain that you use on the Internet. You can register your domain name on the
    Internet through an ISP or directly at www.networkksolutions.com.


    What if you don''t want an Internet presence? Before simply ruling out your organization''s
    presence on the Internet, think about the future. Will your company want a presence
    in five years? What if you install the Active Directory using a certain domain
    name that represents your business and then you decide to build a Web site a few
    years down the road? What if another organization is already using your Active
    Directory domain name on the Internet at that time? Then, you either have to choose
    another domain name on the Internet (which may not be your business name) or reinstall
    the Active Directory to change the domain name.


    The key is to plan carefully and into the future. For example, Wilson-Adams has
    decided that they want wilsonadams.com to be their domain name. Wilson-Adams wants
    a presence on the Web, but they do not want to implement this presence for several
    months. When they implement their Internet presence, they want the name to be
    the same as their Active Directory network, wilsonadams.com. So, they decide to
    register their name with Network Solutions now (and pay the annual fee—about $70)
    so that the name is reserved and they can implement their Web site when they are
    ready. Again, planning is of utmost importance.


    # Your first domain is the root domain


    When you select a domain name, the first domain where the Active Directory is
    installed and named becomes the root domain for your organization. You should
    typically implement the root domain so that it is at the company headquarters
    or a major division. This domain becomes the root, and you build all the other
    domains in your organization from the root domain.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'For example, Wilson-Adams is headquartered in Dallas, so they begin their Active
    Directory tree in the Dallas domain. In terms of DNS, the Dallas domain simply
    becomes wilsonadams.com.


    and that are static. You may choose to name the domains by location, because the
    location usually doesn’t change. For example, wilsonadams.com could name their
    child domains tulsa.wilsonadams.com, san_diego.wilsonadams.com, atlanta.wilsonadams.com,
    and tampa.wilsonadams.com.


    Your other domains create the hierarchical tree


    After you establish your root domain, your other domains fall into the hierarchical
    tree. For example, wilsonadams.com has domains in Tulsa, San Diego, Atlanta, and
    Tampa. You need to give these domains descriptive names that become child domains
    of the root domain, wilsonadams.com. You name your child domains using the same
    principles you did for the root domain — choose names that describe the domain


    This design creates a contiguous namespace where network users can find resources
    in any domain. You can learn more about planning your domain structure in Chapter
    9.


    ![](img/763d5ae436311371600c0952a3da9094_230_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_230_1.png)'
  merge: -1
