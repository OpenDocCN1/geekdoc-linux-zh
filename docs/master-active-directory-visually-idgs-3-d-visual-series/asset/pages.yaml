- pgno: 251
  md: '# INSTALLING THE ACTIVE DIRECTORY


    You install the Active Directory only on Windows 2000 domain controllers, and
    all domain controllers must have the Active Directory installed. In Windows 2000,
    every domain controller must run the Active Directory, and you cannot uninstall
    the Active Directory from a domain controller without demoting it to a member
    server. You need to remember that you can change the role of a server from a domain
    controller to a member server or a standalone server—and vice versa—without having
    to reinstall the Windows 2000 operating system.


    Remember that Windows 2000 networks do not contain primary domain controllers
    or backup domain controllers. All domain controllers are simply domain controllers.
    Windows 2000 uses multimaster replication for the Active Directory, so all Windows
    2000 domain controllers function as peers. In other words, no single domain controller
    is in charge of replication. Every domain controller has equal responsibility
    for maintaining the Active Directory replication.


    If you upgrade a Windows NT 4.0 PDC to Windows 2000 Server, the installer prompts
    you to install the Active Directory during the operating System installation.
    This occurs because the upgrade must install the Active Directory in order to
    maintain the domain controller status. If you started with a clean installation,
    your server is installed as a member server. Installing the Active Directory upgrades
    it to domain controller status.


    ![](img/763d5ae436311371600c0952a3da9094_251_0.png)


    +   1. Choose Start > Programs > Administrative Tools > Configure Your Server.


    +   2. Click Active Directory in the left pane.


    The Windows 2000 Configure Your Server window appears.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/763d5ae436311371600c0952a3da9094_252_0.png)


    What happens to a member server when you install Active Directory? * You can install
    the Active Directory only on domain controllers, so your member server is automatically
    upgraded to a domain controller. Likewise, if you later uninstall Active Directory,
    the server is demoted from a domain controller to a member server.


    Is there another way to install Active Directory without using the Configure Your
    Server tool? * Yes. You can also install Active Directory by choosing Start➔Run
    and typing dcpromo. This action launches the Active Directory Installation Wizard.
    You can also use this command to uninstall the Active Directory.


    What if I have a mix of Windows 2000 and Windows NT servers? Don’t the NT servers
    look for a primary domain controller? * Yes. Windows NT servers in mixed environments
    still look for a domain controller, so the upgraded PDC (which is now simply a
    Windows 2000 domain controller) acts as a PDC emulator for all downlevel servers
    and clients. The PDC emulator performs the PDC tasks that downlevel Windows operating
    systems expect it to perform.


    ![](img/763d5ae436311371600c0952a3da9094_252_1.png)


    3 To start the installation wizard, scroll to the bottom of the screen and click
    the Start link.


    ![](img/763d5ae436311371600c0952a3da9094_252_2.png)


    The Active Directory Installation Wizard begins. * 4 Click Next to continue.


    ![](img/763d5ae436311371600c0952a3da9094_252_3.png)'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# INSTALLING THE ACTIVE DIRECTORY

    CONTINUED


    Before proceeding with the installation, you need to make some decisions. First,
    you need to know if you''re installing the Active Directory in a new domain or
    if you''re joining an existing domain in your organization. If you''re creating
    a new domain, you also need to know if the new domain is part of a new domain
    tree or part of an existing domain tree and forest. Your selection is determined
    by the structure of your Active Directory implementation (See Chapters 8 and 9).
    Finally, you need to enter the DNS name of your domain, such as corp.com. The
    Active Directory uses DNS as its primary naming system. To learn more about DNS,
    see Chapter 6.


    Before proceeding with an Active Directory installation, you must carefully plan
    the implementation and know the Active Directory domain you will create or join.
    As with most implementations, planning is of utmost importance to create an effective
    Active Directory environment.


    ![](img/763d5ae436311371600c0952a3da9094_253_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_253_1.png)


    +   5. If this is a new domain, check this radio button.

    +   6. If you''re joining an existing domain, check this radio button.


    +   7. Click Next to continue.

    +   8. Click the appropriate radio button to create a new domain tree or create
    a new child domain in an existing tree.

    +   9. Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# **Tips**


    Why does installing the domain controller in an existing domain delete all local
    accounts on the server?


    Joining an existing domain deletes all local accounts on the server because all
    accounts must be configured through the Active Directory. This feature eliminates
    possible security problems or duplicate accounts. When you have a stand-alone
    server, you can configure user accounts so that users can log on to your local
    machine. After you upgrade the server to domain controller status with the Active
    Directory, users cannot log on locally to the domain controller, but must be authenticated
    through the Active Directory.


    What is a child domain?


    A child domain exists beneath a parent domain. The parent domain is in control
    of the child domain. You can think of the parent domain as an umbrella, with the
    child domain existing beneath the umbrella. Child domains have a DNS extension
    of the parent domain. For example, if a domain is named corp.com, a child domain
    could be named atlanta.corp.com. See Chapter 9 to learn more.


    ![](img/763d5ae436311371600c0952a3da9094_254_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_254_1.png)


    +   10 Click the appropriate radio button to create a new forest of domain trees
    or place the new domain tree in an existing forest.


    +   11 Click Next to continue.


    +   12 Type the DNS name for the domain.


    +   13 Click Next to continue.


    Your selections may vary depending on the configuration you chose in Steps 5 and
    6.


    CONTINUED'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# # INSTALLING THE ACTIVE DIRECTORY

    ## CONTINUED


    After you establish the domain controller’s place in the network and assign a
    DNS name, the downlevel NetBIOS name appears. This is the name of the domain that
    previous versions of Windows see. Keep in mind that Windows 2000 uses DNS for
    its naming scheme, but previous, or downlevel, versions of Windows use the NetBIOS
    naming scheme. The NetBIOS name is provided in Windows 2000 for backward compatibility.


    The wizard shows the location of the log files, database, and System Volume folder.
    For best performance, you should store the log files on a separate disk if you
    have one available. The log files and database are stored by default in C:\WINNT\NTDS
    and the System Volume folder is stored by default in C:\WINNT\SYSVOL.


    Also, if you have Windows NT 4.0 RAS users on your network, the wizard prompts
    you to weaken RAS permissions. This is a security feature of the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_255_0.png)


    +   - The NetBIOS name of the domain appears.

    +   14 Type a new name in the dialog box or keep the name provided.

    +   15 Click Next to continue.


    ![](img/763d5ae436311371600c0952a3da9094_255_1.png)


    +   - The database log locations appear.

    +   16 Click the Browse buttons if you want to change either location.

    +   17 Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 256
  md: "# TIPS\n\n# Why should I store the log files on a different hard disk?\n\n\
    +   For best domain controller performance, store the log files on a separate\
    \ hard disk. This action speeds the server’s performance because the log-write\
    \ operations are moved to a different disk. Also, if you store the log files on\
    \ a different disk, you can more easily recover Active Directory in the event\
    \ of a failure.\n\n# Why should I weaken NT 4.0 RAS permissions?\n\n+   For installation,\
    \ RAS permissions for Active Directory objects need to be weakened for security\
    \ purposes. This limits RAS client access to Active Directory objects, like user\
    \ objects. After all servers are running Windows 2000, you can strengthen permissions\
    \ by using the Ntsetup.exe utility.\n\n# What is the SYSVOL folder?\n\n+   The\
    \ SYSVOL folder is a shared directory that stores the server’s copy of the domain’s\
    \ public files. SYSVOL is replicated among all domain controllers and is considered\
    \ “System State” data in Windows 2000.\n\n![](img/763d5ae436311371600c0952a3da9094_256_0.png)\n\
    \n18 Enter a new location for the SYSVOL folder or keep the location provided.\
    \  \n\n*Note: The SYSVOL folder must be stored on a Windows 2000 NTFS partition.*\n\
    \n![](img/763d5ae436311371600c0952a3da9094_256_1.png)\n\n20 Click the appropriate\
    \ radio button to either weaken NT 4.0 RAS permissions or leave them unchanged."
  merge: -1
  img_proc: true
- pgno: 257
  md: '# INSTALLING THE ACTIVE DIRECTORY

    CONTINUED


    The Active Directory Installation Wizard also prompts you for a password that
    you can use with Directory Services Restore mode. Directory Services Restore mode
    is a “safe” mode you can boot into by pressing the F8 key at startup. When in
    Directory Services Restore Mode, you can troubleshoot problems with the Active
    Directory or you can run an


    Active Directory data restore if you have a failure. A number of Active Directory
    tools require you to run in Directory Services Restore Mode to fix and troubleshoot
    problems. You can learn more about these issues in Chapter 27.


    After you reach the end of the wizard, you can either finish the installation,
    or use the Back button


    to make changes. Remember that after you finish the wizard, you cannot make major
    configuration changes, such as changing the DNS name of the domain, without reinstalling
    the Active Directory on your server, so make certain that you are satisfied with
    the installation before clicking Finish.


    ![](img/763d5ae436311371600c0952a3da9094_257_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_257_1.png)


    +   1. **22** Type a password for use with the Directory Services Restore mode.

    +   2. **23** Retype the password for confirmation.

    +   3. **24** Click Next to continue.


    +   1. **25** Use the Back button to make any changes.

    +   2. **26** Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Can you make changes to the configuration after you reach the end of the
    wizard?


    You can make changes to your settings when you reach the review page by using
    the Back button. When you click the Back button, you simply move back through
    the wizard screens you have completed. After you click the Finish button, you
    cannot make major Active Directory changes, such as renaming the domain, without
    reinstalling the Active Directory.


    # Why do I have to enter a password to use the Active Directory Services Restore
    Mode?


    As a security feature, you must enter a valid password for using the Active Directory
    Services Restore Mode. This password prevents anyone else from booting into Directory
    Services Restore Mode. This is a security feature so that you can allow other
    administrators to manage the Active Directory on your domain controller without
    using the Directory Services Restore Mode.


    ![](img/763d5ae436311371600c0952a3da9094_258_0.png)


    The system configures the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_258_1.png)


    Click **Finish** to complete the installation.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# UNINSTALLING

    THE ACTIVE DIRECTORY


    You can choose to uninstall the Active Directory from a domain controller, but
    after you perform this action, the domain controller is demoted to a member server.
    Every domain controller must have the Active Directory installed.


    From time to time, you may have reason to uninstall the Active Directory and demote
    your server.


    As hardware needs change and as your server becomes outdated, you can demote it
    and use it as a member server, a print server, or an application server. Older
    machines can perform these tasks effectively without having to run the intensive
    overhead of the Active Directory.


    To uninstall the Active Directory, you use a command-line tool called


    dcpromo.exe. You can use dcpromo.exe to upgrade a server to the Active Directory
    or remove the Active Directory. The Configure Your Server tool does not provide
    you with a way to demote the domain controller, but it does give you the instructions
    for using dcpromo.exe.


    ![](img/763d5ae436311371600c0952a3da9094_259_0.png)


    +   1. Choose Start\[icon\]Run.


    ![](img/763d5ae436311371600c0952a3da9094_259_1.png)


    +   ■ The Run window appears.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# **TIPS**


    # Does uninstalling the Active Directory on one server affect the Active Directory''s
    functionality on the network?


    If you have more than one domain controller (DC), the Active Directory database
    functionality is not harmed. The Active Directory is replicated through multimaster
    replication so that all DCs have an exact copy of the database. Removing one DC
    does not affect the functionality of the other DCs or the Active Directory data.
    If your domain controller is the last domain controller in the forest, all data
    will be lost. This action, however, does not occur unless you are completely removing
    the Active Directory from your network.


    # Can I keep my machine a domain controller without the Active Directory?


    No. You can think of the Active Directory as being synonymous with a domain controller.
    Installation of the Active Directory automatically promotes a server to a DC,
    and uninstallation demotes the server to a member server. Likewise, you cannot
    promote a server to a DC without installing the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_260_0.png)


    +   2  **Type dcpromo** to start the uninstall tool.


    +   3  **Click OK.**


    ![](img/763d5ae436311371600c0952a3da9094_260_1.png)


    +   ■  The **Active Directory Installation Wizard** begins.


    +   4  **Click Next** to continue to uninstall.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# CHAPTER 11 INSTALLING THE ACTIVE DIRECTORY


    # UNINSTALLING THE ACTIVE DIRECTORY CONTINUED


    The Active Directory Installation Wizard prompts you for several pieces of information
    before it can perform the uninstall. First, the wizard wants to know if this is
    the last domain controller in the domain. If it is, the domain will no longer
    function after the uninstall is complete. If you are removing the Active Directory
    from your network, uninstallation of the last domain controller completely removes
    the Active Directory and all Active Directory data. Obviously, this is an option
    you should weigh carefully before proceeding because you will lose all objects,
    including all user accounts.


    Next, the wizard prompts you for the Enterprise administrator account password
    for the domain controller; you also need to enter a new password for the computer
    because it will become a standalone server. The Enterprise admin password verifies
    that you have administrative rights to remove the Active Directory from the domain
    controller. After you remove the Active Directory, you log on to the standalone
    server with a typical admin account—not an Enterprise admin account.


    ![](img/763d5ae436311371600c0952a3da9094_261_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_261_1.png)


    +   1. This dialog box appears if your server is a global catalog server.

    +   2. Click OK.

    +   3. If this is the last domain controller in the domain, click the check box.

    +   4. Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# What is the difference between the passwords?


    Your current administrator account and password is for the Enterprise administrator
    group. You use this account on domain controllers. Because you are uninstalling
    the Active Directory, the administrator account is returned to a local standalone
    server account. The first password you are prompted for checks your account and
    permission to perform the uninstall. The second password box in the wizard asks
    you to assign a new password to the local standalone server administrator account.


    # If I reinstall the Active Directory after an initial uninstall, is the Active
    Directory data still current?


    When you reinstall the Active Directory, or even install the Active Directory
    for the first time, the data, such as objects, are replicated from other domain
    controllers (assuming they exist). For example, all user accounts and other objects
    are replicated to the new domain controller automatically. You are not required
    to configure the data of each domain controller individually.


    ![](img/763d5ae436311371600c0952a3da9094_262_0.png)


    +   8. Type an account username and password with Enterprise Administrator privileges.

    +   9. Click Next to continue.


    ![](img/763d5ae436311371600c0952a3da9094_262_1.png)


    +   10. Type the administrator password for the standalone server''s administrator
    account.

    +   11. Retype the password for confirmation.

    +   12. Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 263
  md: "# # UNINSTALLING THE ACTIVE DIRECTORY CONTINUED\n\nAfter you enter the information\
    \ that the Active Directory needs to uninstall, you see a summary window in which\
    \ you can review the configuration changes you made.  \nAfter you click Next,\
    \ the Active Directory is removed from the system. A final window appears and\
    \ prompts you to finish the uninstall.\n\nYou then need to reboot your computer.\
    \  \nAfter you reboot your computer, you log on with your new local administrator\
    \ password. The Enterprise admin password you previously used does not function\
    \ because the server is now a member server and no longer a domain controller.\
    \ After you reboot, you can\n\nbegin to configure the new member server with services\
    \ appropriate for the tasks you want the server to perform. If at any time you\
    \ want to reinstall the Active Directory and upgrade the member server to a domain\
    \ controller again, simply access the Configure Your Server tool or run dcpromo.exe\
    \ at the Run prompt.\n\n![](img/763d5ae436311371600c0952a3da9094_263_0.png)\n\n\
    ![](img/763d5ae436311371600c0952a3da9094_263_1.png)"
  merge: -1
