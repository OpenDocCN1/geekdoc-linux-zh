- pgno: 32
  md: '# Domain


    By definition, a domain is a logical grouping of users and computers. The domain
    typically resides in a localized geographic location, but this is not always the
    case. In reality, a domain is more than a logical grouping—it is actually a security
    boundary of a Windows 2000 or NT network. You can think of a network with multiple
    domains as being similar to a residential neighborhood. All the homes make up
    the neighborhood, but each home is a security boundary that hold certain objects
    inside and keeps others out.


    ![](img/763d5ae436311371600c0952a3da9094_32_0.png)


    *Each domain serves as a security boundary.*


    A domain is like a house in a neighborhood. Each domain can have its own security
    policies and can establish trust relationships with other domains. The Active
    Directory is made up of one or more domains. Domains contain a schema, which defines
    what objects are stored in the domain. The Schema defines objects by classes (such
    as a Users class, a Computers class, and so on) and all objects belonging to a
    class are called “instances” of that class. You can learn more about the Active
    Directory schema in Chapter 27.


    ![](img/763d5ae436311371600c0952a3da9094_32_1.png)


    *The domain sits at the top of the hierarchy.*'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# THE STRUCTURE OF THE ACTIVE

    DIRECTORY  *CONTINUED*


    # *Tree*


    The hierarchy structure of the domain, organizational units, and objects is called
    a *tree*. The objects within the tree are referred to as *endpoints* while the
    OUs in the tree structure are *nodes*. In comparison to a physical tree, you can
    think of the branches as OUs or containers and the leaves being objects—an object
    is the natural endpoint of the node within the tree.


    ![](img/763d5ae436311371600c0952a3da9094_33_0.png)


    # *Domain trees*


    A *domain tree* exists when several domains are linked by trust relationships
    and share a common schema, configuration, and global catalog. Trust relationships
    in Windows 2000 are based on the Kerberos Security protocol. Kerberos trusts are
    transitive. In other words, if Domain 1 trusts Domain 2 and Domain 2 trusts Domain
    3, then Domain 1 trusts Domain 3. The Active Directory automatically configures
    trust relationships


    within the same tree and forest. You can learn more about trust relationships
    in the Active Directory in Chapter 21.


    A domain tree also shares a contiguous namespace. A contiguous namespace follows
    the same DNS naming hierarchy within the domain tree. For example, if the root
    domain is corp.com and DomainA and DomainB exist in a domain tree, the contiguous
    namespace for the two would be domaina.corp.com and domainb.corp.com. If Domain
    A resides in corpjp.com and Domain B resides in the corp.com root, then the two
    would not share a contiguous namespace.


    ![](img/763d5ae436311371600c0952a3da9094_33_1.png)


    *This is an example of a contiguous namespace.*'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Forest


    A forest is one or more trees that do not share a contiguous namespace. The trees
    in the forest do share a common schema, configuration, and global catalog, but
    the trees do not share a contiguous name space. All trees in the forest trust
    each other through Kerberos transitive trusts. In actuality, the forest does not
    have a distinct name, but the trees are viewed as a hierarchy of trust relationships.
    The tree at the top of the hierarchy normally refers to the tree. For example,
    corp.com, production.corp.com, and mgmt.corp.com form a forest with corp.com serving
    as the forest root.


    # Site


    A site is not actually considered part of the Active Directory hierarchy, but
    it is configured in the Active Directory for replication purposes. A site is defined
    as a geographical location in a network containing Active Directory servers with
    a well-connected TCP/IP subnet. *Well-connected* means that the network connection
    is highly reliable and fast. Administrators use the Active Directory to configure
    replication between sites. Users do not have to be aware of site configuration.
    As far as the Active Directory is concerned, users only see domains.


    # How the structure appears to administrators and users


    As an administrator, you view the structure of the Active Directory through the
    administrative tools that you can explore in detail later in Chapters 14 through
    21. From the tools, you can see the structure through the domains, OUs, and objects
    that are a part of the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_34_0.png)


    *Administrators can view the tree structure of the Active Directory.*


    Users browse the Active Directory by accessing it in My Network Places. Users
    see a folder view for the domain and organizational units within the domain. The
    objects then reside in their respective OUs. Primarily, users find resources by
    performing LDAP searches instead of browsing (see Chapter 13).'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# THE STRUCTURE OF THE ACTIVE DIRECTORY CONTINUED


    ![](img/763d5ae436311371600c0952a3da9094_35_0.png)


    *Users can see a folder view of the Active Directory.*


    # Active Directory names


    In the Active Directory, every object, such as users, groups, computers, printers,
    and so forth, has a unique name. Four kinds of names are assigned to each object.


    First, each object has a *distinguished name* (DN). The DN is unique from all
    other objects and contains the full information needed to retrieve the object.
    The DN contains the domain where the object resides and the path to the object.
    The DN is made up of these attributes (or qualities):


    +   - Domain component name (DC)

    +   - Organizational unit name (OU)

    +   - Common name (CN)


    For example, if you wanted to access a document called “Company mission” that
    resides in a particular domain, the DN may read:


    ```

    `/DC=com/DC=mycompany/OU=acct/CN=documents/CN=Company Mission`

    ```


    By using the DN, the Active Directory can begin at the top of the domain and work
    its way down to the actual folder or document.


    Second, the Active Directory uses *relative distinguished names* (RDN). The RDN
    is the part of the DN that defines the actual object, called an attribute. This
    is the CN, or common name. Fortunately, all you need to know to search for objects
    are common names. You don''t have to know or use the DN, and the DN itself is
    normally hidden from the users.


    Third, the Active Directory uses *globally unique identifiers* (GUID), which are
    unique 128-bit numbers. The GUID is assigned to an object when it is created in
    the Active Directory and it never changes.


    And fourth, Active Directory objects can be identified by *user principal names*
    (UPN), which are short, friendly names that look like an e-mail address, such
    as jwilliams@corp.com.


    The major point to remember is that the Active Directory provides the DN, RDN,
    GUID, and UPN for objects to ensure uniqueness, ease of location for LDAP queries,
    and ease of use for users.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Global catalog


    The purpose of LDAP is to allow network users to search and find objects in the
    Active Directory. In order for this to happen, certain Active Directory domain
    controllers, called “global catalog servers” maintain a *global catalog*.


    The global catalog enables users and applications to find objects in the Active
    Directory by searching for particular attributes. The global catalog holds a partial


    replica of the objects and their most common attributes. When a user performs
    a search operation to find an object, the global catalog looks for that attribute
    and returns matches to the user.


    The Active Directory replication builds and maintains the global catalog, and
    through the held replica, users can locate resources in any domain or OU in the
    tree or forest.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# WHY YOU NEED TO KNOW ABOUT

    TCP/IP FOR THE ACTIVE DIRECTORY


    TCP/IP (Transmission Control Protocol/Internet Protocol) is the de facto standard
    for internet communication. TCP/IP is the protocol that allows all communication
    on the World Wide Web to take place, and over the years, TCP/IP has become more
    popular as the protocol of choice in LAN and WAN environments.


    The Active Directory is integrated with TCP/IP in that all directory replication
    between domain controllers occurs using TCP/IP. In fact, Windows 2000 is designed
    for TCP/IP networks. In order to understand and implement the Active Directory,
    you do need at least a general understanding of TCP/IP. If you are already immersed
    in a TCP/IP network, then this chapter serves as a good review. If you are new
    to Windows networking, then this chapter is just what you need to understand the
    basics of TCP/IP.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# WHAT IS TCP/IP?


    TCP/IP is a protocol that was originally developed by the Department of Defense.
    Basically, TCP/IP provides a set of rules that govern how computers communicate
    with each other over a network. just as people have to speak the same language
    to communicate with each other, computers must also communicate in the same language,
    or *protocol*. TCP/IP is considered a suite of protocols because it is made up
    of many protocols that provide the vast communication functionality we now enjoy
    in networking environments and on the Internet. In fact, over 100 protocols are
    in the TCP/IP suite. The following list points out some of the most common ones:


    +   >

    +   - *Transmission Control Protocol (TCP)* provides connection-orientated communication.

    +   - *Internet Protocol (IP)* manages routing and network traffic.

    +   - *File Transfer Protocol (FTP)* manages file transfer and remote directory
    management.

    +   - *Hypertext Transfer Protocol (HTTP)* is the Internet standard for the delivery
    of HTML documents.

    +   - *Simple Network Management Protocol (SNMP)* manages network devices and
    monitors network events.

    +   - *Simple Mail Transfer Protocol (SMTP)* provides messaging (e-mail) services.

    +   - *User Datagram Protocol (UDP)* provides connectionless communication.

    +   - *Network News Transfer Protocol (NNTP)* provides newsgroup services.

    +   - *Telnet* provides terminal emulation for remote connections.

    +   - *Address Resolution Protocol (ARP)* resolves IP address to hardware (MAC)
    addresses

    +   - *Internet Control Management Protocol (ICMP)* provides error control

    +   - *Lightweight Directory Access Protocol (LDAP)* provides directory access
    capabilities'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# TCP/IP COMPONENTS


    Just as a language has certain components, such as words, grammar, and syntax,
    the TCP/IP protocol contains components that enable each computer on a TCP/IP
    network to function and communicate on the network. You must configure three major
    TCP/IP components on TCP/IP computers: the IP address, subnet mask, and default
    gateway.


    Binary numbers are calculated by counting from the right to the left of a series
    of binary digits. Each bit counts twice as much as the previous bit. In other
    words, the first bit equals 1, the second bit equals 2, the third bit equals 4,
    and so forth. In an IP address, there are 8 bits, so the eighth bit is equal to
    128:


    ```

    128 64 32 16 8 4 2 1

    ```


    # IP Address


    Each computer on a TCP/IP network must have a unique IP address. The IP address
    identifies that computer on the network and the address must be unique (no two
    computers can have the same IP address. You can think of an IP address as being
    similar to a postal address, which is uniquely identified by city, state, zip
    code, then by street address, then by the person’s name. These address qualities
    enable the postal system to deliver a piece of mail to a particular person at
    a particular address. A computer’s IP address enables the network to deliver communication
    to that particular computer.


    In binary math, the bits are added together to determine the numerical value.
    For example, if all bits in the octet are turned "on," then the numerical value
    is 255. In other words, 11111111 in binary is equal to 128+64+32+16+8+4+2+1, which
    equals 255.


    Each IP address is 32 bits long, and is divided into 4 bytes. Each byte is referred
    to as an octet. A typical IP address looks like this: 131.107.2.200. In order
    to understand IP addressing, you have to start thinking in binary math. Computers
    see data in terms of ones and zeroes. In essence, a stream of network data is
    simply made up of ones and zeroes that the computer interprets. One (1) represents
    "on" and zero (0) represents "off."


    If all the bits are "off," then the binary representation is 00000000 which is
    equal to 0+0+0+0+0+0+0+0, which equals 0. Using this scheme, you can represent
    any number between 0 and 255.


    For example, what is binary value of 10? Remember that the bits in the octet must
    be turned on or off to equal the number ten. In the binary octet, the number 10
    is represented as 00001010, which equals 0+0+0+0+0+8+0+2+0, which equals 10.


    An IP address is made up of four octets that are separated by periods. A typical
    IP address you may assign to a computer would be 10.2.0.4. In binary, the computers
    see this address as:


    ```

    00001010 00000010 00000000 00000100

    ```'
  merge: -1
  img_proc: true
- pgno: 40
  md: '![](img/763d5ae436311371600c0952a3da9094_40_0.png)


    My IP address is 10.2.0.4


    Other computers on the network communicate with me by using this IP address.


    They see my IP address in binary, which is 00001010 00000010 00000000 00000100


    You cannot simply assign computers on your network any IP address you choose.
    The IP addressing scheme you use must be defined by classes and subnets. Just
    as everyone in a certain town has the same addressing properties of city, state,
    and zip code, the IP addresses must belong to certain classes and subnets. An
    isolated LAN or WAN can determine a class of addresses and appropriate subnet
    masks to use for their network, but for proper Internet communication, many networks
    choose to obtain IP addressing from Network Solutions, which is the organization
    that handles all of the Internet''s domain name and IP address assignment.


    Each IP address identifies both the network in which the computer (or node, such
    as a router) resides and the actual computer or node itself. These are called
    the network ID and host ID. The three major groupings of IP addresses are called
    classes. The following list gives you an overview of the three classes:


    +   - Class A: Class A addresses have a beginning octet from 1 to 126. Network
    Solutions assigns the first octet and the network administrator assigns the three
    remaining octets. Class A networks were developed for large networks and obtaining
    a Class A address today is very difficult. Class A networks can support up to
    16,387,064 hosts.

    +   Also, the address range of 127 is reserved for TCP/IP troubleshooting and
    is called a loopback address.


    +   - Class B: Class B networks have the first octet assignment from 128 to 191.
    Network Solutions assigns the first and second octet numbers and the network administrator
    assigns the last two. Class B networks can support up to 64,516 hosts.


    +   - Class C: Class C networks use 192 through 255 for the first octet. Network
    Solutions assigns the first three octets and the network administrator assigns
    the final octet. Class C networks can only support up to 254 hosts.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '![](img/763d5ae436311371600c0952a3da9094_41_0.png)


    # Subnet mask


    The second component of IP addressing is the *subnet mask*. As mentioned in the
    previous section, part of the IP address points to the actual network while another
    portion of the IP address points to the actual computer or node (host). The subnet
    mask hides, or masks, part of the IP address to keep the network ID and the host
    ID separated. Subnet masks enable you to break your network into *subnets*, which
    can provide you more available IP addresses and further organize your network.
    Also, subnetting controls reduces overall network traffic. Each IP address assigned
    to a client


    must include at least a default subnet mask. For Class A networks, the default
    subnet mask is 255.0.0.0. For Class B networks, the default subnet mask is 255.255.0.0
    and for Class C networks, the default subnet mask is 255.255.255.0.


    The process of subnetting a network and assigning a proper mask for a subnet is
    often a difficult task and is beyond the scope of this book. But to understand
    the basics of TCP/IP, do remember that at least a default subnet mask is required.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Default gateway


    The last component of IP addressing is the default gateway. A default gateway,
    or router, is the IP address of the router that leads out of the subnet. You can
    think of the default gateway as the “road that leads out.” Client computers use
    the default gateway to


    communicate with computers on different subnets. A default gateway is not a required
    component of client IP configuration, but if gateways are in use in your network,
    the client computers must know the IP address of the gateway(s) for communication
    to take place with different network segments.


    ![](img/763d5ae436311371600c0952a3da9094_42_0.png)'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# # TCP/IP MANAGEMENT TECHNOLOGIES


    I


    f people could speak and think in binary math, they


    could seamlessly communicate with computers. But


    humans are language-based creatures while


    computers “think” in terms of math. You would have a


    very difficult time remembering the IP address of each


    computer you wanted to access on the network. It’s


    much easier to remember ServerD as opposed to


    131.107.2.200. So, people contact servers and


    computers using a friendly, language-based name, but


    computers must contact each other using the actual IP


    address. In order for the two worlds to mix, any friendly,


    language-based names must be resolved to IP addresses


    so that computers can communicate with each other. For


    this to happen and to ease the burden of IP address


    resolution and assignment, several services are available.


    ![](img/763d5ae436311371600c0952a3da9094_43_0.png)


    # ## Dynamic Host Configuration Protocol (DHCP)


    DHCP is a server service that dynamically assigns IP


    addresses and IP network information (such as the


    default gateway) to network clients. Traditionally,


    TCP/IP had the reputation of having high overhead


    because each client had to be assigned a unique IP


    address. Imagine having to manually assign IP addresses


    to 1,000 network clients without making a mistake!


    DHCP solves this problem by automatically handling


    client IP assignment. DHCP works by leasing an


    appropriate and unique IP address to network clients for


    a specified period of time. DHCP makes certain that no


    duplicate addresses are assigned so that all clients can


    have connectivity. This process is invisible to users and


    requires little intervention on the part of network


    administrators. You can learn more about DHCP in


    Chapter 4.


    # ## Windows Internet Naming Service (WINS)


    WINS resolves NetBIOS computer names to IP


    addresses. A NetBIOS name is a friendly, language-based


    computer name. Because computers must communicate


    using a computer’s IP address and not its NetBIOS name,


    WINS maps NetBIOS names to their corresponding IP


    address. This way, you can name your computer “Joe’s


    Laptop” instead of an IP address like 131.107.2.200.


    WINS maintains a database that keeps track of this


    information. WINS clients contact a WINS server to find


    the information that “MyComputer” equals


    131.107.2.200. The client can then use the IP address to


    communicate with Joe’s Laptop. This process is invisible


    to users and requires little intervention from


    administrators. WINS is not necessary in pure Windows


    2000 environments, but is provided for backward


    compatibility. Windows 2000 computers use DNS for


    name resolution, so WINS will slowly phase out over the


    next several years. You can learn more about WINS in


    Chapter 5 and DNS in Chapter 6.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/763d5ae436311371600c0952a3da9094_44_0.png)


    # Domain Name System (DNS)


    DNS resolves fully qualified domain names (FQDN) to IP addresses. Just as WINS
    resolves friendly NetBIOS names to IP addresses, DNS resolves domain names, such
    as www.microsoft.com, to its appropriate IP address. This process enables you
    to communicate with computers on the Internet (and now in Windows 2000 networks)
    using friendly domain names instead of IP addresses. In the past, DNS was a static
    mapping contained in HOSTS files, which is simply a text file that lists the host
    name to IP address mapping. Now, Dynamic DNS (DDNS) can respond to and update
    changes that occur. You learn more about DNS and its place in Windows 2000 in
    Chapter 6.


    Note: DNS resolution usually requires a number of servers. Each server resolves
    a portion of the domain name.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# CHAPTER **2**


