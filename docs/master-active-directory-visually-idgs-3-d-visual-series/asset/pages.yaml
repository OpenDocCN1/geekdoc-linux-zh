- pgno: 218
  md: '# TIPS


    # What settings can I edit on the Encryption tab?


    You have the selection of no encryption, basic, or strong. You can use any combination
    of these, only one, or all of them. With one selection, users are restricted to
    that method. For example, if you select only strong encryption, then all connections
    require strong authentication. If all your RAS clients are capable of strong encryption,
    then this is the most secure choice. However, you may need to allow a combination
    of strong and basic (or even no encryption) to service all clients.


    # What settings can I edit on the Advanced tab?


    On the Advanced tab, you can specify additional attributes for policy. By clicking
    the Add button, you have an extensive list of attributes that you can use to meet
    the RAS needs of your organization. For example, if you are using a RADIUS server,
    you can add attributes for that server. If you are using AppleTalk or other networking
    methods, such as ATM, you can add attributes for those as well.


    ![](img/763d5ae436311371600c0952a3da9094_218_0.png)


    +   12 Click the Encryption tab.


