    +   15. Click the desired radio button or check box to adjust RAS logging.


    +   16. Click **OK** to save your changes.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# EXPLORING ROUTING INTERFACES


    If you select Routing in the console pane under your RAS server, you can see the
    routing interfaces that are currently configured—if your server has been configured
    to be a router. You can select any of the current LAN and demand dial interfaces
    and use the Action menu to connect or disconnect, as well as set the interface
    credentials.


    You can add a new demand dial interface by selecting Routing Interfaces in the
    console and clicking the Action menu. This option is only available if WAN routing
    is configured (see the General tab of the RAS server properties sheets). The demand
    dial connection establishes a connection


    to a remote site “on demand,” or when data needs to be sent. The connection is
    established and maintained all the time, but only when it is needed.


    If you want to establish a new demand dial interface, a wizard helps guide you
    through the process.


    ![](img/763d5ae436311371600c0952a3da9094_207_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_207_1.png)


    +   1. Expand the RAS server in the console and select Routing Interfaces.


    +   2. Choose Action> New Demand-dial Interface.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Why should I use demand-dial routing?


    Demand-dial interfaces use demand-dial routing, which allows the establishment
    of switched connections across Wide Area Networks (WAN). The connection is based
    on “demand,” or a need for the connection. For example, an office in Portland
    and an office in New York, which are a part of a WAN, need to share information
    about three times a week. A modem or ISDN connection can connect with the router
    in the other office. With demand-dial, the modems or ISDN adapters dial up and
    connect on demand to the other router so that data transfer takes place. This
    is a cost-effective solution that provides connectivity when needed, but avoids
    the cost of having a dedicated WAN link.


    # Do I have to use demand-dial interfaces?


    Demand-dial is an optional component provided to help network administrators create
    inexpensive connectivity solutions. The use of demand-dial is based solely on
    the needs of your network.




    ![](img/763d5ae436311371600c0952a3da9094_208_0.png)


    +   1 The Demand Dial Interface Wizard begins.  2 Click Next to continue.


    ![](img/763d5ae436311371600c0952a3da9094_208_1.png)


    +   3 Type a name for the interface.  4 Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# # EXPLORING ROUTING INTERFACES


    ## CONTINUED


    When you run the wizard to configure a new demand-dial interface, you need to
    make some decisions about the router''s use. First, you have to determine the
    kind of demand-dial interface you want to use. You can connect using a modem,
    ISDN adapter, or some other physical device connected to your computer,


    or you can connect using a Virtual Private Network (VPN). A VPN enables you to
    use the Internet as a private network by encapsulating network communication data
    into PPF frames so that they can be transmitted over the Internet.


    Next, you need to determine the protocols and security features of the demand-dial
    interface. The available options are listed on the next page. Also, you need to
    determine an appropriate username, domain, and password so that the connection
    to the remote router can be made. The remote router must have an account configured
    for this purpose.


    ![](img/763d5ae436311371600c0952a3da9094_209_0.png)


    **6** Click the appropriate radio button to select the connection type: either
    physical device or VPN.


    **7** Click Next to continue.


    **8** Click the appropriate check boxes to select security and transport options.


    **9** Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '**TIPS**

    What protocols and security features can I use?


    +   • Demand-dial interfaces use the following protocols and security features:

    +     * Route IP Packets on the interface—IP packets can be routed on this particular
    demand-dial interface.

    +     * Route IPX packets on the interface—IPX packets can be routed on this particular
    demand-dial interface.

    +   • Add a user account so a remote router can dial-in—Allows you to create a
    user account for the router so the router can connect and be authenticated.


    +   • Send a plain-text password if that is the only way to connect—Allows plain
    text passwords to be used, which significantly lowers network security.

    +   • Use scripting to complete the connection with the remote router—Allows you
    to create and implement connections scripts for demand-dialing.


    ![](img/763d5ae436311371600c0952a3da9094_210_0.png)


    **10** Type the dial-out credentials in these boxes.


    ![](img/763d5ae436311371600c0952a3da9094_210_1.png)


    **11** Click **Finish** to complete the wizard.'
  merge: -1
  img_proc: true
- pgno: 211
  md: "# CREATING A NEW IP TUNNEL\n\nAside from the demand-dial interface, you can\
    \ also create a new IP tunnel for your VPN connections. An IP tunnel is a logical\
    \ interface, meaning that it’s not created through a physical piece of hardware.\
    \ The IP tunnel enables IP packets on your local network to be “tuneled” over\
    \ the Internet or an intranet. This is accomplished by adding additional IP header\
    \ information to the packet. The actual data is encapsulated in the new IP packet\
    \ with additional header information. It can then be sent over the Internet or\
    \ intranet and appears as normal IP Internet communication. The receiving computer\
    \ can then decrypt the actual data in the packet. This feature enables you to\
    \ use the Internet to transmit secure network data from one location to the next\
    \ without the expense of a dedicated WAN link.\n\n![](img/763d5ae436311371600c0952a3da9094_211_0.png)\n\
    \n+   1. Click Start→Programs→Administrative Tools→Routing and Remote Access.\
    \  \n+   2. Expand the desired server and select Routing interfaces."
  merge: -1
  img_proc: true
- pgno: 212
  md: "# TIPS\n\n> **Why would I want to use an IP tunnel?**\n> \n> An IP tunnel allows\
    \ you to securely send data over the Internet or an intranet. With this feature,\
    \ you can make use of existing network topology to securely and inexpensively\
    \ send data. The IP tunnel hides your data in a PPF frame so it appears as typical\
    \ Internet or Intranet traffic. IP tunnels are an effective means to use the Internet\
    \ to send data to remote locations without having to maintain an expensive WAN\
    \ link.\n\n> **What is the difference between an IP tunnel and a VPN?**\n> \n\
    > IP tunnels create “virtual private networks” (VPN), so the terms are basically\
    \ interchangeable. The technology was originally referred to as VPNs, which use\
    \ the Point-to-Point Tunneling Protocol (PPTP) to securely tunnel data over a\
    \ public network, such as the Internet. This technology solution is commonly called\
    \ IP tunnels.\n\n![](img/763d5ae436311371600c0952a3da9094_212_0.png)\n\n![](img/763d5ae436311371600c0952a3da9094_212_1.png)\n\
    \n+   1. Choose Action→New IP Tunnel.\n+   2. Type the name for the new IP tunnel.\n\
    +   3. Click OK."
  merge: -1
  img_proc: true
- pgno: 213
  md: '# # ADDING RAS POLICIES


    RAS Policies enable you to manage what users can do when dialing into a RAS server
    and what they can do after they are authenticated. You can also configure Group
    Policies that affect RAS (see Chapter 25).


    By default, a RAS policy is created that enables you to define when RAS users
    can dial in to the RAS server and be authenticated. In other words, you can use
    this feature to restrict the dial-up time to business hours only, or any other
    combination that you choose. You can create additional RAS policies as desired
    by selecting Remote Access Policies in the console and choosing Action❐New. All
    are configured the same, so the following sections show you how to configure the
    default policy.


    ![](img/763d5ae436311371600c0952a3da9094_213_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_213_1.png)


    1. Click Start❐Programs❐ Administrative Tools❐ Routing and Remote Access.


    2. Click Remote Access Policies in the console tree. ▪ A list of current policies
    appears in the details pane.


    3. Double-click the desired policy in the details pane.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# What types of attributes can I add to a policy?


    When you open the existing RAS policy, a window appears that tells you the parameters
    of the policy. You can add more parameters, or attributes, so that the policy
    affects more than one setting. For example, the dial-in constraints policy also
    allows you to add attributes, such as phone number restrictions, protocol restrictions,
    and so forth.


    # How do I edit an existing policy?


    You can configure this policy by clicking the Edit button and making changes to
    the dial-up hours as desired. After you set the confirmation, you then determine
    whether remote access is granted or denied based on your settings. This allows
    you to create a policy that allows dial-in access Monday through Friday from 8:00
    a.m. to 5:00 p.m., or you can select the appropriate grids for nightime and weekend
    access using a deny button. This accomplishes the same thing, but the policy enables
    you to configure it either way for the same result. See the next section for more
    information.


    ![](img/763d5ae436311371600c0952a3da9094_214_0.png)


    +   1. The dialog box describing the policy appears.

    +   2. Use the Add, Remove, or Edit buttons to manage the policy.


    +   3. Click the appropriate radio button to grant or deny access when the policy
    is matched.


    ![](img/763d5ae436311371600c0952a3da9094_214_1.png)


    +   5. If you click Add, this window appears.

    +   6. Select an attribute you want to add to the policy.


    +   7. Click Add.

    +   8. Properties sheet to save the changes.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# EDITING RAS POLICIES


    If you click the Edit Profile button, you can make a number of additional changes
    for the RAS policy. First, you have a Dial-In Constraints tab, on which you can
    force a number of connectivity settings. You can have the server disconnect the
    call if it is idle for a configured period of time. Also, you can restrict the
    maximum session


    time so that the server automatically disconnects the session after a certain
    period of time. You can restrict access to certain days and times as desired.
    Additionally, you can restrict the dial-in connection to one specific phone number
    and one specific media, such as ISDN.


    The IP tab enables you to determine how a client obtains an IP address, from either
    the server or client, or you can allow server settings to define the policy. You
    can also use this tab to configure different protocol filters, which prevents
    a user from using a certain IP protocol (such as UDP).


    ![](img/763d5ae436311371600c0952a3da9094_215_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_215_1.png)


    1

    Double-click the policy

    you want to edit.


    The policy''s Properties

    sheet appears.


    2

    Adjust the grid by clicking

    on the cells to create the

    desired logon availability

    times.


    If you click the Edit button

    for a time restriction policy,

    this window appears.


    3

    Click OK when you are

    done.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '![](img/763d5ae436311371600c0952a3da9094_216_0.png)


    # **Why would I want to edit a policy?**


    Windows 2000 creates predefined RAS policies, and you can also create custom policies
    as well. Often, the predefined policies will need some editing so they function
    in the manner necessary for your network. A common example is to allow remote
    access permission for certain times and days. In some environments, users can
    dial-in to the network 24 hours a day, 7 days a week, while other environments
    restrict users from dialing-in on the weekends.


    # **Is there another way to edit RAS policies?**


    Yes. RAS policies can also be created and edited using the Group Policy feature
    of Windows 2000, which is integrated with the Active Directory. You can learn
    all about Group Policy in Chapter 25.


    ![](img/763d5ae436311371600c0952a3da9094_216_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_216_2.png)


    4 Click the Edit Profile button, then click the appropriate check boxes to adjust
    the dial-in constraints for the policy.


    5 Click the IP tab.


    6 Click the appropriate radio button to define the IP address assignment for the
    policy.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# EDITING RAS POLICIES CONTINUED


    On the Multilink tab, you can allow multilink connections based on the default
    server settings, disable multilink, or allow multilink and set the maximum number
    of ports yourself. If you choose to allow multilink, you should also make a decision
    about BAP (Bandwidth Allocation Protocol). BAP manages the links within a multilink
    connection by dropping or adding links based on connection needs. For example,
    if a multilink connection falls below a certain bandwidth usage percentage, one
    of the links can be dropped because it is not needed, or vice versa. This feature
    helps conserve bandwidth so that it can be used for other connections. The default
    setting is a 50 percent reduction for two minutes. At that time, one of the links
    is dropped. You can adjust this setting so that the policy is more strict or lenient
    with bandwidth usage.


    On the authentication tab, you can choose to enforce a certain protocol that is
