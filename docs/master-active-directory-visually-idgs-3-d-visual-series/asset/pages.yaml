- pgno: 30
  md: '# THE STRUCTURE OF THE ACTIVE DIRECTORY


    The Active Directory is designed in a hierarchy structure, and before installing
    and implementing the Active Directory, you must have a firm understanding of the
    structure as well as the components that make up the Active Directory. You may
    see these components as terms that you need to learn, but you must also know how
    these components or terms relate to each other and how they fit into the hierarchy.


    In this chapter, you begin with the smallest component in the hierarchy and work
    your way up to the top of the hierarchy. This section gives you a complete view
    of the Active Directory''s structure.


    Directory objects are users, groups, printers, shared folders, applications, databases,
    contacts, and so forth. Each of these objects represents something tangible on
    the network.


    Each object contains attributes. An attribute is a quality that helps define the
    actual object. For example, a user object could have attributes of a username,
    actual name, and e-mail address. Attributes for each kind of object are defined
    in the Active Directory. The attributes define the object itself and enable users
    to search for the particular object. Technically attributes are called "metadata"—which
    is simply "data about data"—and are a portion of the Active Directory "schema,"
    which defines what objects and object attributes can be stored in the Active Directory.


    # Object


    An Active Directory object represents a physical object of some kind on the network.
    Common Active


