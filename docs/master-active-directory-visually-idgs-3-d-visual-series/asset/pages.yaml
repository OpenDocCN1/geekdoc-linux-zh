- pgno: 28
  md: "+   \n+   > > Security: The Active Directory is integrated with Windows 2000\
    \ security, allowing administrators to control access to objects.\n+   > > Seamlessness:\
    \ The Active Directory is seamlessly integrated with the local network and the\
    \ intranet/Internet.\n+   > > Open Standards: The Active Directory is based on\
    \ open communication standards, which allow integration and communication with\
    \ other directory services, such as Novell's NDS.\n+   > > Backward Compatibility:\
    \ Although Windows 2000 operating systems make the most use of the Active Directory,\
    \ the Active Directory also works with earlier versions of Windows. This feature\
    \ allows the implementation of the Active Directory to be taken one step at a\
    \ time while still maintaining a functioning network.\n+   \n\n# Understanding\
    \ domains and domain controllers\n\nIf you have worked with Windows NT at all,\
    \ you should be familiar with the concepts of domain and domain controllers. A\
    \ domain is a logical grouping of users, computers, and resources. In actuality,\
    \ the domain is a security boundary that enables administrators to control the\
    \ resources in that domain and keep unauthorized users out of the domain. The\
    \ Active Directory is built through the domain. Domain controllers are the servers\
    \ that manage the domain. Primary domain controllers (PDC) and backup domain no\
    \ longer exist in Windows 2000; all the domain controllers simply act as peers.\
    \ Through trust relationships, the Active Directory is replicated using multimaster\
    \ replication, which means that all domain controllers are responsible for maintaining\
    \ the Active Directory and replicating changes to other domain controllers. You\
    \ learn more about managing trusts in Windows 2000 later in this book.\n\n# DNS\
    \ and the Active Directory\n\nDomain Name System (DNS) is the most widely used\
    \ directory namespace in the world. Each time you use the Internet, you are finding\
    \ URLs by using DNS. DNS takes a Uniform Resource Locator (URL), such as www.microsoft.com,\
    \ and resolves the URL into a TCP/IP address, such as 131.107.2.200, which is\
    \ required for communication on the Internet. Because computers must have the\
    \ TCP/IP address to communicate, and users need the language-based names to communicate,\
    \ the job of DNS is to resolve the two.\n\nThe Active Directory is integrated\
    \ with DNS, and the naming schemes used in the Active Directory are DNS names.\
    \ For example, corp.com is a valid DNS name and can also be used as a Windows\
    \ 2000 domain name. With DNS as the locator service in the Active Directory, the\
    \ local area network (LAN) becomes more seamless with the Internet and an intranet.\
    \ Corp.com can be an Internet name or a local area name, and Jwilliams@corp.com\
    \ can be both an Internet e-mail address and a username in the local network.\
    \ This structure enables you to find items on your network in the same manner\
    \ you find them on the Internet.\n\nWindows 2000 also supports Dynamic DNS (DDNS),\
    \ a new addition to the DNS standard. DDNS can dynamically update a DNS server\
    \ with new or changed values, which had to be manually updated in the past. Because\
    \ name records can be dynamically updated, pure Windows 2000 networks no longer\
    \ need to use Windows Internet Naming Service (WINS). In mixed environments, however,\
    \ WINS is used for backwards compatibility with older versions of Windows. You\
    \ can learn all about WINS and DNS in Chapters 5 and 6."
  merge: -1
