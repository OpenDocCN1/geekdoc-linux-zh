    This description helps the users determine the contents of the shared folder.
    Also, you can use the Keywords button to enter keywords for the share. The keywords
    help Active Directory users find the shared folder by performing a keyword search.
    For example, if you shared a documents folder that contained general corporate
    documents, you may use such keywords as share, documents, corporate, and so forth,
    so that a user searching for corporate documents would find the folder in the
    directory.


    documents, you may use such keywords as share, documents, corporate, and so forth,
    so that a user searching for corporate documents would find the folder in the
