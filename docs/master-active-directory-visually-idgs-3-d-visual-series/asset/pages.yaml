- pgno: 586
  md: '+   1. Double-click the file named License.txt.

    +   This file contains the end-user license that you

    +   agree to by using the CD. When you finish

    +   reading the license, close the program, most

    +   likely Notepad, that displayed the file.


    +   2. Double-click the file named Readme.txt.

    +   This file contains instructions about installing the

    +   software from this CD. You may find it helpful to

    +   keep this text file open while you use the CD.


    +   3. Double-click the folder for the software you are

