    \n+   3. Click the Features tab.\n+   4. Select desired features using the check\
    \ boxes and drop-down menus\n\n![](img/763d5ae436311371600c0952a3da9094_292_1.png)\n\
    \n+   5. If you want to perform an advanced search, click the Advanced tab.\n\
    +   6. Select a desired field and a condition and value.\n+   7. Click Add.\n\
    +   8. Click Find Now to begin the search. \n+      * ■ Your selections appear\
    \ in the window."
  merge: -1
  img_proc: true
- pgno: 293
  md: '# FINDING SHARED FOLDERS


    You can use the Active Directory to find shared folders on your network. To find
    a shared folder, you use the Find drop-down menu and select Shared Folders.


    You can also use the Advanced tab on the search window to set specific criteria
    for the search. This feature is useful when you do not know the specific name
    or information about the shared folder, but you know some information that you
    can use for the search. For example, if you know of a shared folder that contains
    company documents, you can use the advanced search function to refine the search
    to look for all instances of the keywords "company documents." This action is
    accomplished using fields, conditions for the fields, and a value for the search.


    ![](img/763d5ae436311371600c0952a3da9094_293_0.png)


    Click the Find drop-down menu and click Shared Folders.


    ![](img/763d5ae436311371600c0952a3da9094_293_1.png)


    Enter a name and keywords for the folder search.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# **How can I use keywords to search for a shared folder?**


    When a shared folder is added to the Active Directory, the administrator can enter
    keywords to help Active Directory users find the shared folder. For example, if
    a shared folder resides in the marketing department and contains marketing guidelines
    and related documents, the keywords for the folder could be *marketing*, *guidelines*,
    and *documents*. When a user searches for the folder using keywords, the matches
    for those keywords are retrieved so that the user can select which folder he or
    she wants to use.


    # **Can I find a folder in the Active Directory using the Network Path?**


    Yes. If you know the network path to a shared folder, such as \\server1\\documents,
    you can use the Advanced tab and click Network Path from the Field drop-down menu.
    If you are certain that the network path is correct, use the Is (Exactly) condition,
    and then enter the network path in the Value box. Click the **Add** button and
    then click **Find Now**.


    +   1.  If you want to perform an advanced search, click the **Advanced** tab.

    +   2.  Click the **Field** button to select a search field.

    +   3.  Enter a **Condition** and **Value**, if needed.

    +   4.  Click **Add**.

    +   5.  Your selections appear in the window.

    +   6.  Click **Find Now** to start the search.


    ![](img/763d5ae436311371600c0952a3da9094_294_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_294_1.png)'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# FINDING ORGANIZATIONAL UNITS


    You can use the Active Directory to find organizational units (OUs) by either
    using the browse button, or by using the Find menu and searching for them as you
    would any other object. Click the Find menu and select Organizational Units, then
    you can search for the OU by name on the Organizational Units tab. You can also
    use the Advanced tab on the search window to set specific criteria for the search.
    This feature is useful when you do not know the specific name or information about
    an OU, but you know some information that you can use for the search. For example,
    if you know of an OU managed by John Smith, but you do not know the name of the
    OU, you can use the advanced search function to refine the search so that it looks
    for all instances of OUs managed by John Smith. This action is accomplished using
    fields, conditions for the fields, and a value for the search.


    ![](img/763d5ae436311371600c0952a3da9094_295_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_295_1.png)


    +   1. Click the Find drop-down menu and click Organizational Units.


    +   2. Enter a name for the OU search.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# TIPS


    # Why would I want to find an Organizational Unit?


    You can use the Browse button to browse the domain structure and find an OU, or
    you can locate an OU by using the Active Directory search function. In complex
    environments, this feature may be useful to locate a particular OU for which you
    only know the manager or some details. If you do not know the name of the OU,
    you cannot find it by browsing, so the search function is included to allow you
    to find the OU.


    # Can I find an OU if all I know is a description?


    Yes. Use the Advanced tab and select the Description field. Then, use either the
    Starts With condition or the Is Exactly condition, then enter a description in
    the Value box. Be as specific as possible. Click the Add button, then click Find
    Now to begin the Active Directory search.


    ![](img/763d5ae436311371600c0952a3da9094_296_0.png)


    +   3 If you want to perform an advanced search, click the Advanced tab.

    +   4 Click the Field button to select a search field.


    ![](img/763d5ae436311371600c0952a3da9094_296_1.png)


    +   5 Enter a Condition and Value, if needed.

    +   6 Click Add.

    +   7 Your selections appear in the window.

    +   Click Find Now to start the search.


    ![](img/763d5ae436311371600c0952a3da9094_296_2.png)'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# CREATING A CUSTOM SEARCH


    The Active Directory allows you to create a custom search. To perform a custom
    search, you select Custom Search from the Find menu, which provides you with a
    Custom Search tab and an Advanced tab.


    The Custom Search tab allows you to set specific criteria for the search. This
    feature is useful when you do not know the specific name or information about
    an object, but you know some information that you can use for the search. The
    fields available in the Custom Search basically give you every Active Directory
    object you may want to find and detailed fields about each.


    On the Advanced tab, you can run an LDAP query where you simply type the search
    string. This can be any combination of words and the Active Directory will look
    for a match using your query.


    ![](img/763d5ae436311371600c0952a3da9094_297_0.png)


    1 Click the Find drop-down menu and click Custom Search.


    ![](img/763d5ae436311371600c0952a3da9094_297_1.png)


    2 Click the Field button to select a search field.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# What is the purpose of a custom search?


    The custom search option enables you to select from a greater list of Active Directory
    objects, some of which are not available in the other Find categories. This feature
    allows you to search for an Active Directory object that is closest to what you
    actually need. By using the Custom Search option, you can search for domains,
    Certificate Templates, RPC Services, and so forth.


    # What is an LDAP search?


    An LDAP search, which is available on the Advanced tab of the Custom Search, enables
    you to perform a simple text search for the object you want to find. The search
    function uses the words you type in and attempts to locate Active Directory objects
    that contain the same words or keywords.


    ![](img/763d5ae436311371600c0952a3da9094_298_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_298_1.png)'
  merge: -1
  img_proc: true
