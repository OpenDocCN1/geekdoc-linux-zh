- pgno: 491
  md: '# PUBLISHING PRINTERS NOT CONNECTED TO WINDOWS 2000 COMPUTERS


    Printers that are shared and are attached to Windows 2000 computers are automatically
    shared in the Active Directory. If the printer is later not shared, then it is
    automatically removed. Users who run a search query for printers automatically
    find the printers connected to Windows 2000 computers, and no additional configuration
    is required on the part of the administrator.


    However, down-level computers, such as those running Windows 9x or NT, cannot
    automatically publish their shared printers to the Active Directory. This must
    be manually done by an administrator.


    The process is an easy one. Simply choose which OU you want the printer to reside
    in and add the printer using the Action menu. All you have to do is enter the
    network path, and if the printer is actually shared, it is published. You can
    also access the properties sheets for the down-level shared printer to make slight
    adjustments to its printing options as well as assign a manager.


    ![](img/763d5ae436311371600c0952a3da9094_491_0.png)


    1 Open Active Directory Users and Computers and then select the OU where you want
    to publish the down-level computer.


    2 Choose Action->New->Printer.


    3 Type the path of the shared down-level printer.


    4 Click OK.'
  merge: -1
  img_proc: true
- pgno: 492
  md: '# TIPS


    Can users run a search for my printer connected to a Windows 98 computer and find
    it?


    After you manually add the printer to the Active Directory, users can run a search
    for the printer and find it.


    Are drivers automatically downloaded for down-level computers sharing a printer?


    Driver files are shared with the printer, but a different operating system may
    have difficulty using the printer. For example, if a Windows 2000 Professional
    computer attempts to use a printer on a Windows 95 computer, the printer drivers
    may not be compatible with Windows 2000.


    If I stop sharing my printer connected to a Windows 98 computer, is it automatically
    removed from the Active Directory?


    No. An administrator must manually remove that printer object. Users can find
    the printer in the Active Directory, but they cannot print to it after it is no
    longer shared.


