- pgno: 574
  md: '# RESTRICTING GUEST ACCESS TO APPLICATION LOG


    By default, users can view the application, security, and system logs in Event
    Viewer. As a security precaution, you can use this policy to restrict access so
    that users that log on with a guest account cannot access the application, security,
    or system logs of computers within this Group Policy.


    ![](img/763d5ae436311371600c0952a3da9094_574_0.png)


    +   1 Expand the Security Settings container, expand the Event Log container,
    then select Settings For Event Logs.

    +   The policy settings appear in the details pane.


    +   2 Double-click the Restrict Guest Access To Application Log policy setting.


    +   3 Click the check box to either enable or disable the policy setting.

