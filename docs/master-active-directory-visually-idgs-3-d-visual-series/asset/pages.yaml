- pgno: 163
  md: '# SETTING UP DNS


    After you install the DNS service, you have to set up the service for use. You
    can find the service in Administrative tools, which you can access from either
    the Start menu or Control Panel. When you open the DNS manager, the name of your
    server appears in the left console pane and


    a note about configuring the DNS service appears in the right pane. Fortunately,
    Windows 2000 provides a wizard to help you set up your DNS service.


    Before setting up the service, you need to take a look at your current network
    configuration and where


    your server falls within the configuration. In other words, you need to know which
    zone your server will service and what other zones are around your zone. Consult
    your network documentation to implement DNS so that it can service the needs of
    your particular zone.


    ![](img/763d5ae436311371600c0952a3da9094_163_0.png)


    +   1. Choose **Start** \> **Programs** \> **Administrative Tools** \> DNS.


    ![](img/763d5ae436311371600c0952a3da9094_163_1.png)


    +   2. The DNS Manager opens showing your server icon in the left pane and a note
    in the right pane about configuring the server.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# TIPS


    # What is a zone?


    A zone is an area of the DNS namespace that is segmented for administrative purposes.
    This zone method enables you to run different DNS servers on your network that
    service the needs of particular groups. For example, if you had an **hr.corp.com**
    division and an **acct.corp.com** division in your network, each of these could
    function as DNS zones. They apply to a discreet portion of the namespace and you
    can set up different DNS servers to manage each zone. This feature keeps query
    traffic more localized on the network because all computers within a zone have
    to contact a DNS zone server for queries.


    # Why is a wizard provided to set up DNS?


    Windows 2000 includes wizards for most tasks that require several steps or several
    “pieces” that must be configured. The wizard makes certain you enter all the information
    needed to appropriately configure the service.


    ![](img/763d5ae436311371600c0952a3da9094_164_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_164_1.png)


    +   **1** Choose **Action** Configure The Server.


    +   **2** The Configure DNS Server Wizard appears.


    +   **3** Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# SETTING UP DNS CONTINUED


    The Configure DNS Server Wizard asks you a number of questions to determine what
    place the DNS server has on the network. DNS needs to know if this is the first
    DNS server on the network. If it is not, then you have to enter the IP address
    of a known DNS server that currently exists.


    You also need to decide whether you want to set up a forward lookup zone. You
    should allow DNS to create the forward lookup zone because this zone is used to
    forward and resolve IP to name mappings. The wizard recommends that you allow
    the service to create the forward lookup zone.


    You also need to select the type of zone you want to create. You have the options
    of Active Directory integrated or a primary or secondary zone. An Active Directory
    integrated zone stores new zone database information in the Active Directory and
    provides secure updates to the database file. A standard primary zone stores the
    database file in a text file on the server so that the zone database information
    can be exchanged with other DNS servers that use text-based storage.


    ![](img/763d5ae436311371600c0952a3da9094_165_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_165_1.png)


    **4** Click the appropriate radio button.


    **5** Click Next to continue.


    **6** Click either the Yes or No radio button to create the forward lookup zone.


    **7** Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# TIPS


    **Why do I need a forward lookup zone?**


    A forward lookup zone resolves host names to IP address. The forward lookup zone
    allows the DNS server to "forward" host name to IP address resolution requests
    to other DNS servers in other zones and service local DNS queries.


    ## Should my zone be Active Directory integrated?


    An Active Directory integrated zone enables you to integrate the DNS database
    files with the Active Directory. The Active Directory supports Dynamic DNS (DDNS)
    so that changes to the database file can be dynamically written. In the past,
    this was a manual process by editing the database text file. In most cases where
    the Active Directory is implemented, you should install your DNS servers so that
    they are integrated with the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_166_0.png)


    **8** On the New Zone Wizard window, click the appropriate radio button to install
    the Zone type desired.


    ![](img/763d5ae436311371600c0952a3da9094_166_1.png)


    **9** Click Next to continue.


    **10** Type the name of the zone.


    **11** Click Next to continue.


    CONTINUED'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'T he standard *secondary zone* simply creates a copy of the existing zone database
    file. You can use this option for load-balancing purposes if your server is a
    secondary server in an existing zone.


    You also need to enter a zone name. You should make certain that the zone name
    you enter is appropriate for your network design. Refer to your network documentation
    to determine the appropriate zone name.


    You have the option of creating a *reverse lookup zone*. A forward lookup zone
    resolves a host, such as **server2.corp.com**, to an IP address. A reverse lookup
    zone resolves the IP address to the DNS name, such as **131.107.2.0 = server2.corp.com**.
    Creating a reverse lookup zone is important for name resolution, but it is not
    required during the initial configuration. You can always add reverse lookup zones
    later using the New Zone Wizard.


    New Zone Wizard. The zone selection window appears again so that you can choose
    to add the reverse lookup zone to the Active Directory or use it as a primary
    or secondary zone. The wizard also prompts you to enter how the reverse zone is
    identified, either by IP address or DNS name.


    ![](img/763d5ae436311371600c0952a3da9094_167_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_167_1.png)


    +   12 Select either the Yes or No radio button to create a reverse lookup zone.


    +   13 Click Next to continue.


    +   14 Click the appropriate radio button for the reverse zone to be stored in
    the Active Directory or as a primary or secondary zone.


    +   15 Click Next to continue.


    > If you click No, skip ahead to Step 18.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Do I need a reverse lookup zone?


    A reverse lookup zone simply allows a standard DNS resolution query to function
    in "reverse." Normally, a DNS name is sent to the DNS server for resolution to
    the IP address. The reverse lookup zone allows an IP address to be sent to DNS
    server to discover the DNS name of the host. Depending on your network, reverse
    lookup zones are not always necessary; however, they are easy to configure and
    for full DNS functionality, having them available is a good idea.


    # When I get to the end of the wizard, can I make changes if I made a mistake?


    You can always use the wizard''s Back button to return to previous wizard screens
    and make changes. If you have already finished the wizard, you can manually make
    configuration changes within the DNS Manager. The following sections show you
    how to manage the different configuration tasks concerning the DNS server and
    the DNS zones.


    ![](img/763d5ae436311371600c0952a3da9094_168_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_168_1.png)


    +   1. Click the appropriate radio button.

    +   2. Enter the information to identify the reverse lookup zone by IP address
    or name.

    +   3. Click Next to continue.


    +   1. Review your selections and click Finish.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# MANAGING DNS SERVER TASKS


    As with most networking service consoles, such as WINS and DHCP, you can connect
    to other DNS servers. This feature enables you to easily manage a set of DNS servers
    from one location without having to physically visit each machine.


    Typically, depending on the design of your organization, an administrator may
    be in control of all DNS servers for a particular zone. Remember that there is
    one primary DNS server per zone and any number of secondary DNS servers per zone.
    The secondary DNS servers provide load balancing for resolution request. Through
    this one interface, you can manage all the DNS servers, which makes your job as
    an administrator much easier.


    To connect to another DNS server, simply use the Action menu and enter the name
    or IP address of the DNS server. After the connection is made, the server’s icon
    appears in the console.


    ![](img/763d5ae436311371600c0952a3da9094_169_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_169_1.png)


    +   1. Select DNS in the console and choose Action→Connect To Computer.


    +   2. Click the appropriate radio button to connect to either your server or
    another server.


    +   3. If you chose to connect to another computer in Step 2, type the name or
    IP address of the server in this dialog box.


    +   4. Click OK.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'When you configured the DNS service, you made some decisions about forward
    lookup zones and reverse lookup zones. These zones help you control DNS on your
    network and make certain that host names can be resolved to an IP address or that
    IP addresses can be resolved to DNS names.


    Zones also help you segment your network for administrative purposes. When you
    create zones, you must install a DNS server that will be authoritative for that
    zone. You can also use secondary DNS servers for the zone to help with load balancing.


    You can easily add new zones to your server by using the New Zone Wizard. To perform
    this action, simply access the Action menu for the server and select New Zone.
    After you do this, the New Zone Wizard begins and you can create new zones as
    needed. This is the same wizard that you use when you set up DNS.


    ![](img/763d5ae436311371600c0952a3da9094_170_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_170_1.png)


    # ADDING NEW ZONES


    +   1. Select the server in the console and choose Action\::New Zone.


    +   2. The New Zone Wizard appears.


    +   3. Refer to the section Setting Up DNS for more information on completing
    the New Zone Wizard.


    CONTINUED'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# MANAGING DNS SERVER TASKS

    CONTINUED


    You can use the Action menu to clear the DNS server''s cache. Remember that a
    cache is simply a temporary storage location that holds DNS temporary records.
    Clearing the cache allows you to remove those records so new records can be immediately
    cached.


    You can also run a process that helps you keep a clean DNS database. This process,
    known as *scavenging*, cleans old records out of the database to make certain
    the database is up-to-date.


    First, you can set the properties for scavenging by accessing Set Aging/Scavenging
    for all zones on the Action menu. The properties sheet enables you to configure
    the DNS server to scavenge stale DNS resource records. Then, you can set the no-refresh
    and the refresh interval. The no-refresh interval is the time between the most
    recent refresh of a record timestamp and time when it can be refreshed. The default
    setting is seven days. The refresh interval is the time between the earliest moment
    when a record timestamp can be refreshed and the earliest moment when the record
    can be scavenged. The default is also seven days.


    ![](img/763d5ae436311371600c0952a3da9094_171_0.png)


    +   **CLEARING THE CACHE**

    +   Select your server in the console, then choose Action→Clear Cache.


    ![](img/763d5ae436311371600c0952a3da9094_171_1.png)


    +   **OPENING A NEW WINDOW**

    +   Select your server in the console, then choose Action→New Window From Here.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Why do I need to scavenge the database?


    As with any database, the DNS database can collect clutter over time. The clutter
    in the database is the old DNS records that have expired. The scavenge operation
    cleans these old records out of the database, which keeps your database free of
    unnecessary records.


    # How often should the database be scavenged?


    Under normal circumstances, the default setting of seven days for scavenge records
    is sufficient. You do not need to manually scavenge the database on a regular
    basis, unless you have specific reasons to believe the database needs to be cleaned.
    Windows 2000 DNS automatically scavenges the database every seven days, which
    under most circumstances is all you need.


    # How does scavenging affect performance?


    As with any system, the more "clutter" that is removed, the more likely the DNS
    service will perform better. By removing unneeded and old records, the DNS database
    will be clean of outdated information.


    ![](img/763d5ae436311371600c0952a3da9094_172_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_172_1.png)


    # CHOOSING THE AGING AND SCAVENGING SETTINGS


    +   1 Select the server in the console and choose Action®Set Aging/Scavenging
    For All Zones.


    +   2 Adjust the no-refresh interval as desired.


    +   3 Adjust the refresh interval as desired.


    +   4 Click OK.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# **MANAGING DNS SERVER TASKS**

    **CONTINUED**


    You can manually update the DNS server''s database files, if desired, by using
    the Action menu and choosing Update Server Data Files. Data files are normally
    updated to the database at predefined intervals and when the server is shut down,
    but you can choose to manually update the files


    as desired. This action causes the DNS service to write all changes to the zone
    data files immediately.


    As with most MMC snap-in tools, you can also choose to stop, start, pause, and
    restart the DNS service by clicking the Action menu and accessing the All Tasks
    feature. In


    case of server maintenance or problems, you can pause or stop the service while
    the problem is being resolved. When you do this, the server is not available to
    answer name resolution queries, but other DNS servers in the zone can take on
    the query load while the server is offline.


    ![](img/763d5ae436311371600c0952a3da9094_173_0.png)


    +   **MANUALLY SCAVENGING DATABASE RECORDS**

    +   **1.** *Choose Action*\> Scavenge Stale Resource Records to manually scavenge
    records.

    +   **2.** Click OK to continue the scavenge operation.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Do I need to update the server''s database files manually?


    No. The DNS server automatically updates its server database files on a periodic
    basis, so manually updating the files is not a task you need to perform as a part
    of your administrative duties. However, the option is provided for you in the
    case of major changes to the DNS database. If a number of changes occur, you can
    use the Update Server database files option to manually update the database so
    those changes can go into effect immediately. As with most options in DNS, the
    server handles the tasks automatically, or you can manually force them as the
    need arises.


    # What happens when I pause the DNS service?


    When you pause the DNS service, the service is taken offline and is not available
    to clients. Client DNS query requests will have to be fulfilled by other DNS servers.
    The pause option is particularly useful if you are having problems with the server.
    You can take the server offline until the problems are resolved, then resume the
    DNS service.


    ![](img/763d5ae436311371600c0952a3da9094_174_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_174_1.png)


    # MANUALLY UPDATING SERVER DATA FILES


    +   1. Choose Action>Update Server Data Files to perform the manual update.


    # STOP, START, AND PAUSE


    +   1. Choose Action> All Tasks.

    +   2. Choose Stop, Start, or Pause to manage the DNS service.'
