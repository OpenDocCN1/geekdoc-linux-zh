- pgno: 562
  md: "# # FORCING SHUTDOWN FROM A REMOTE SYSTEM\n\nYou can use this policy to allow\
    \ certain users or groups to force a computer to shut down while logged on at\
    \ a remote system. Administrators and other power user-type groups can use this\
    \ policy so that remote management of network computers can be enabled. Obviously,\
    \ this is not a policy you want to implement for typical user accounts.\n\n![](img/763d5ae436311371600c0952a3da9094_562_0.png)\n\
    \n+   1. Expand the Security Settings container, expand the Local Policies container,\
