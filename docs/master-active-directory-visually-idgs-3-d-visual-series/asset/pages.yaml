- pgno: 493
  md: '# # WHAT IS THE SCHEMA?


    The Active Directory determines what can be stored through the Active Directory
    schema. The schema is a list of "definitions" that identify the kinds of objects
    and the information about those objects that can be stored in the Active Directory
    database. The schema includes the definitions for objects, such as users, computers,
    and printers, that are stored in the Active Directory database. For a database
    to function properly, a set of rules must exist to determine what kinds of objects
    can be stored in it and the kind of information about those objects that can also
    be stored.


    The Active Directory schema definitions are also considered objects in the Active
    Directory, so they can be managed just as any other Active Directory object. This
    feature enables you to manage the schema in the same way you would any other Active
    Directory object.


    Two different kinds of definitions are in the schema: attributes and classes.
    In terms of the Active Directory, attributes and classes are called metadata,
    which is simply “data about data.” For example, a user account is considered an
    object, or data, and the username, password, e-mail address, group membership,
    and so on, for the account is metadata for that account.'
  merge: -1
  img_proc: true
- pgno: 494
  md: '# # UNDERSTANDING ATTRIBUTES


    For each object that can be stored in the Active Directory, attributes exist for
    that object. An attribute defines the object in the Active Directory, and you
    can think of attributes as “fields” in a typical database. For example, a user
    account may contain attributes of username, user’s actual name, e-mail address,
    group membership, and so forth.


    Because the attributes are defined for the object, the Active Directory can effectively
    store the object, and users can perform LDAP search queries on attributes of an
    object. For example, if you know only a user’s e-mail addresses, you can run an
    LDAP search on the e-mail address, and the Active Directory checks its database
    for that e-mail address.


    The Active Directory finds it as an attribute of a certain user account, and the
    user account information is returned.


    Each Active Directory attribute is defined only once in the Active Directory,
    and the same attribute can be used in many different classes.


    # ## Attributes


    ![](img/763d5ae436311371600c0952a3da9094_494_0.png)


    | Ksmith | Karen Smith | ksmith@nxbd.com |

    | jwilliams | John Williams | jwilliams@mntxd.com |'
  merge: -1
  img_proc: true
- pgno: 495
  md: '# UNDERSTANDING CLASSES


    Classes, also called *object classes*, define where certain objects belong. The
    classes group objects together that share a collection of attributes. For example,
    the User Class is a collection of attributes that define user accounts, the Printer
    Class is a collection of attributes that define the printers, and so forth. Every
    object in the Active Directory belongs to some class, and every object is considered
    *an instance* of that class.


    The Active Directory comes with a set of predefined classes and attributes. In
    most cases, the predefined classes and attributes are sufficient for most networking
    environments; however, you can tailor the schema to your organization.


    ![](img/763d5ae436311371600c0952a3da9094_495_0.png)'
  merge: -1
  img_proc: true
- pgno: 496
  md: '# SCHEMA MODIFICATION


    As an administrator, you really do not have to be highly aware of the Active Directory
    schema. You should understand how attributes and classes function and why they
    are needed, but the Active Directory schema is not a portion of the Active Directory
    that you administer and change as a part of your administrative duties. The schema
    is designed to be an internal part of the Active Directory and not something you
    administer.


    However, in some cases, your business may need to define new attributes or even
    classes. Most of the time, your needs can be met by tailoring an attribute of
    an object to your environment. These schema modifications are relatively simple
    and harmless. The most dangerous configuration would be to add a new class of
    objects. This process requires very careful thought and carefully planning. In
    fact,


    Microsoft recommends that only programmers or highly skilled administrators attempt
    to modify the schema because incorrect modification can result in Enterprise Active
    Directory problems and failures. Changes to the schema are automatic and they
    are replicated to every domain controller. If you do want to make modifications
    to schema, you may consider using a test network or test machine before actually
    attempting the modification on the network. In most cases, you can work with the
    schema that is already in place, so you must plan carefully to make certain that
    schema modification is an act that really needs to be performed. Again, great
    care must be exercised before making any changes to the schema.


    You can modify the schema by using the Active Directory Services Interface (ADSI),
    which is used by developers, or you can make schema modifications using Active
    Directory Schema Manager, which is available in the Windows 2000 Resource Kit
    included on your Windows 2000 CD-ROM. The following sections introduce you to
    the Active Directory Schema Manager and shows you the basics of how it works.
    Advanced schema modification is beyond the scope of this book and is not a task
    that should be performed by a typical administrator.


    You can use the Schema Manager to manage classes and attributes and set security
    permissions for them. You can also create new classes and attributes, but this
    action requires careful forethought and is not advisable without the help of properly
    trained developers.


    The following section is included to give you an overview, just in case you want
    to experiment with the schema on a test machine.


    ![](img/763d5ae436311371600c0952a3da9094_496_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_496_1.png)'
  merge: -1
  img_proc: true
- pgno: 497
  md: '# CHAPTER **27** ACTIVE DIRECTORY SCHEMA


    # ## USING THE SCHEMA MANAGER


    Accessing the Schema Manager


    The Active Directory Schema Manager is a MMC snap-in available by installing the
    Adminpak found in the 1386 folder on your installation CD-ROM. Double-click the
    Adminpak icon, then choose to install all of the administrative tools.


    After the tools are installed, you can access the Active Directory Schema Manager
    snap-in by manually loading the snap-in into a MMC console. After you install
    the Adminpak, some of the tools will be available by choosing Start❪Programs❪Windows
    2000 Support Tools. In this location, you can access some of the tools, such as
    the Active Directory Replication Monitor, Security Administration Tools, and other
    utilities. Some tools, such as the Schema Manager are only available by manually
    loading the snap-in.


    ![](img/763d5ae436311371600c0952a3da9094_497_0.png)


    +   1. Choose Start❪Run.

    +   2. Type MM.

    +   3. Click OK.

    +   4. Choose Console❪Add/Remove Snap-in.'
  merge: -1
  img_proc: true
- pgno: 498
  md: '# What does the Schema Manager do?


    The Schema Manager is an MMC snap-in that enables you to make modifications to
    Active Directory attributes and classes. From this interface, you can tailor the
    Active Directory to meet the needs of your organization. However, under normal
    circumstances, extensive changes should be performed only by highly skilled programmers.
    This is not a tool that you should use on a regular basis, if at all. In most
    cases, you can use the existing schema without altering it.


    # Why is the Schema Manager not included with the other Active Directory tools?


    The Active Directory contains three built-in administrative tools, Users and Computers,
    Sites and Services, and Domains and Trusts. The Schema Manager is in fact another
    Active Directory tool, but it is included only in the Adminpak because it is a
    resource tool only. The Schema Manager is not to be used as a regular management
    tool, and it is not installed with the Active Directory because of this purpose.


    ![](img/763d5ae436311371600c0952a3da9094_498_0.png)


    +   * 5 Click Add.


    ![](img/763d5ae436311371600c0952a3da9094_498_1.png)


    +   * 6 Select Active Directory Schema.

    +   * 7 Click Add.

    +   * 8 Click Close.

    +   * 9 From the Add/Remove Snap-in window, click OK.'
  merge: -1
  img_proc: true
- pgno: 499
  md: '# CHAPTER 27 ACTIVE DIRECTORY SCHEMA


    # USING THE SCHEMA MANAGER


    Examining class properties


    The Schema Manager has containers for both classes and attributes. If you select
    the Classes container, a list of the Active Directory classes appear in the console.
    If you double-click one of them, you can see the properties sheet.


    On the General tab, you see a description of the class, the Common Name (CN),
    the OID number, and the class type. The OID (Objected Identifiers) are unique
    numbers that are assigned to different object classes and objects themselves.
    The OID number is assigned by the International Standards Organization (ISO) and
    are completely unique for all directory services (such as ADS, NDS, and so on).
    If you wanted to create a new class of objects, you would need to apply to the
    ISO for an OID number. The uniqueness of the OID makes certain that different
    directory services follow an industry standard and are compatible.


    The Category button enables you to change the category of the class in which the
    schema resides. Obviously, this is a feature you should carefully consider before
    changing.


    ![](img/763d5ae436311371600c0952a3da9094_499_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_499_1.png)


    +   * 1 Expand the Active Directory Schema Manager and click Classes.

    +   * The classes appear in the details pane.

    +   * 2 In the details pane, double-click a class you want to examine.'
  merge: -1
  img_proc: true
- pgno: 500
  md: '# What does deactivating a class do?


    You cannot remove classes and attributes from the schema, but you can deactivate
    them by accessing the General tab. Deactivation marks the class or attribute as
    *being unused*. The class or attribute still remains, but the Active Directory
    does not use it. In this case, replication of that class no longer occurs and
    you cannot create objects that belong to that class.


    # Can I delete a class?


    No. In order to prevent potential problems, classes and attributes cannot be deleted
    from the schema. You can, however, deactivate them so that they are not used.


    ![](img/763d5ae436311371600c0952a3da9094_500_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_500_1.png)


    +   1. The class properties appear. On the General tab, you see the description,
    common name, OID, and category.

    +   2. If you want to deactivate the class or show the objects in this class while
    browsing, click the appropriate check box.

    +   3. If you want to change the category, click Change.

    +   4. Select a schema object that will define the new category.

    +   5. Click OK.'
  merge: -1
  img_proc: true
- pgno: 501
  md: '# ## USING THE SCHEMA MANAGER


    Examining class properties (continued)


    The Relationship tab lists the Parent Class, Auxiliary Classes, and Possible Superior
    classes. You can add or remove both Auxiliary Classes and Possible Superior Classes.
    This feature enables you to further define the relationship between the class
    and other classes.


    The Attributes tab enables you to define optional attributes for the class. Remember
    that attributes are


    used to define the objects residing within the class. Most class properties attribute
    contain both mandatory attribute(s) and optional attributes. The optional attributes
    further define the objects that can belong to that particular class.


    You also have a typical Security tab. This feature enables you to determine which
    administrators have access to this particular Active Directory class. By default,
    account


    operators have Full Control, authenticated users have Read access, domain admins
    have Full Control, SELF has various rights, depending on your account, and SYSTEM
    has Full Control.


    The security features within the schema manager allow you to fine-tune who can
    access different classes and attributes and what permissions those classes have
    for the classes and attributes.


    ![](img/763d5ae436311371600c0952a3da9094_501_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_501_1.png)


    7 Click the Relationship tab.


    8 Use the Add or Remove buttons to make changes to the Auxiliary Classes or Possible
    Superior Classes.


    9 Click the Attributes tab.


    10 Use the Add or Remove buttons to make changes to the Optional attributes.'
  merge: -1
  img_proc: true
- pgno: 502
  md: '# TIPS


    **What is the purpose of adding optional attributes?**


    Optional attributes further define object attributes for a particular class. In
    most cases, object classes have at least one mandatory attribute that must apply
    to every object for the object to belong to that class. Optional attributes further
    define the objects in that class. You can add attributes to the class to enable
    you to include objects that need additional attributes defined for them. On the
    Attributes tab, you use the Add button to add more attributes from the list that
    appears.


    **What security changes should be made?**


    You can fine-tune the security settings for each class as desired. In general,
    you should be very careful who you give more than Read access. However, in some
    cases, you may want certain users to have more control over certain classes, and
    the security feature enables you to make those changes as needed. As with any
    security policy, you should carefully plan security changes.


    ![](img/763d5ae436311371600c0952a3da9094_502_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_502_1.png)


    +   11.  Click the Security tab.

    +   12.  Adjust the security permissions for class by clicking the appropriate
    permissions check boxes.

    +   13.  Click Add to add another user or group to the list.


    +   14.  Select the person or group you want to add.

    +   15.  Click Add.

    +   16.  Click OK.

    +   17.  From the properties window, click OK.'
  merge: -1
  img_proc: true
- pgno: 503
  md: '# # USING THE SCHEMA MANAGER


    # ### Examining attribute properties


    The properties sheet for all attributes consists of a General tab. On this tab,
    you find the description of the attribute, common name (CN), OID number, and a
    syntax and range field that defines how the attribute is described.


    You may notice that some attributes have the statement, “This attribute is multi-valued.”
    This means that this attribute can store multiple characteristics. For example,
    if a user has more than one e-mail address, the attribute that defines “e-mail
    address” can hold more than one e-mail address for that object.


    In the bottom of the window, you see several check boxes that allow you to manage
    the attribute as needed.


    In some classes, such as the System class, all the edits may not be allowed, depending
    on the attribute. As with schema class modifications, you should be very careful
    before modifying attributes due to the implications in the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_503_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_503_1.png)


    +   1. Expand the Active Directory Schema in the console.


    +   2. Click the Attributes container.


    The attributes appear in the details pane.'
  merge: -1
  img_proc: true
- pgno: 504
  md: '# **Can I delete an attribute?**


    No. The Active Directory does not allow you to delete either a class or an attribute.
    You can, however, deactivate an attribute by clicking the check box on the General
    tab. Make certain that you have planned carefully and understand the implications
    an attribute deactivation may have on the Active Directory and its functionality
    in your network.


    # **What is the Replicate This Attribute To The Global Catalog check box option?**


    The Replicate This Attribute To The Global Catalog check box enables you to force
    the attribute, and any changes you make to it, to be replicated to the global
    catalog server, which will then replicate the attribute to all domain controllers.
    Once again, these option should not be used without specific guidance or instructions
    from Active Directory programmers.


    ![](img/763d5ae436311371600c0952a3da9094_504_0.png)


    +   3  Scroll to find the attribute you want to view and then double-click it.


    ![](img/763d5ae436311371600c0952a3da9094_504_1.png)


    +   4  Click the appropriate check boxes to make changes to the attribute as needed.

    +   5  Click OK.'
  merge: -1
  img_proc: true
- pgno: 505
  md: '# BACKING UP THE ACTIVE DIRECTORY


    As with any data on your computer, a good backup plan is extremely wise. The Active
    Directory is no exception, and you should plan a regular backup plan to ensure
    that you can recover your Active Directory database in case of a system error.


    In general, Microsoft recommends that you store your Windows 2000 system files
    and the Active Directory database and transaction log files on separate disks.
    If one disk should fail, at least you have not lost all your data at one time.
    You should also plan to back up the data on a regular basis so that it can be
    restored if necessary.


    To back up the Active Directory database and transaction log files, you use the
    Backup utility included in Windows 2000. When you use the Backup Wizard to back
    up your Active Directory, choose to back up “System State Data.”


    ![](img/763d5ae436311371600c0952a3da9094_505_0.png)


    +   1.  Choose **Start** \> **Programs** \> **Accessories** \> **System Tools**
    \> **Backup**.


    ![](img/763d5ae436311371600c0952a3da9094_505_1.png)


    +   2.  Click **Backup Wizard**.'
  merge: -1
  img_proc: true
- pgno: 506
  md: '![](img/763d5ae436311371600c0952a3da9094_506_0.png)


    # Do I have to use the wizard to run a backup job?


    No. The wizard is provided to help you create a backup, but after you have used
    the wizard and are comfortable performing the backup manually, you can use the
    Backup tab in the Backup utility to manually run it.


    # What is System State Data?


    System State Data is a term used to describe the following data in a Windows 2000
    domain controller:


    +   The Registry

    +   COM+ Class Registration Database

    +   System Boot Files

    +   Certificate Services Database (if the server is a certificate server)

    +   Active Directory Services Database

    +   SYSVOL Directory, which is a server copy of the domain''s public files that
    are replicated among domain controllers


    ![](img/763d5ae436311371600c0952a3da9094_506_1.png)


    +   The Backup Wizard appears.

    +   Clic Next to continue.


    ![](img/763d5ae436311371600c0952a3da9094_506_2.png)


    +   To back up only the Active Directory, click the Only Back Up System State
    Data radio button.

    +   Clic Next to continue.


    IMPLEMENTATION VIII


    CONTINUED 483'
  merge: -1
  img_proc: true
- pgno: 507
  md: "# BACKING UP THE ACTIVE DIRECTORY\nCONTINUED\n\nYou can back up your files\
    \ to a number of media options. In most cases, backups are written to a tape backup,\
    \ and Windows 2000 supports all major tape back types, including digital audio\
    \ tape (DAT). You can also use Zip or Jaz drives for backup purposes.\n\nYou also\
    \ have the option to configure advanced backup options. First, you can choose\
    \ the type of backup that you want to perform. The options are normal, copy, incremental,\
    \ differential, and daily. A definition of each option is presented on the next\
    \ page. Typically, most environments use a mixture of normal and incremental or\
    \ differential backups. The goal is to reduce the amount of daily backup time\
    \ while keeping the data that is backed up most current.\n\nYou can also back\
    \ up any migrated remote storage data, which typically does not apply to an Active\
    \ Directory backup. Windows 2000 has the ability to allow you to store data in\
    \ remote locations on tape, CD, or Zip disk formats.\n\n![](img/763d5ae436311371600c0952a3da9094_507_0.png)\n\
    \n![](img/763d5ae436311371600c0952a3da9094_507_1.png)\n\n+   **6** Use the drop-down\
    \ menu to select the media type.\n+   \n+   **7** Type the location name for the\
    \ backup file (.BKF). You can also click Browse to browse for a particular file.\
    \ If you don’t need to browse, skip to Step 12.\n\n+   **8** Select the location\
    \ using the drop-down menu.\n+   \n+   **9** Type the filename for the backup.\n\
    +   \n+   10 Click Open.\n+   \n+   11 Click Next to continue."
  merge: -1
  img_proc: true
- pgno: 508
  md: '# **What is a definition of each backup type?**


    +   * Normal backs up all selected files and marks each file as backed up.

    +   * Copy backs up all selected files but does not mark them as backed up.

    +   * Incremental backs up selected files only if they have not been backed up
    or have changed, and marks them as backed up.


    +   * Differential backs up selected files only if they have not been backed up
    or have changes, but does not mark them as backed up.

    +   * Daily backs up only files that have changed today, but does not mark them
    as backed up.


    ![](img/763d5ae436311371600c0952a3da9094_508_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_508_1.png)'
  merge: -1
  img_proc: true
- pgno: 509
  md: '# BACKING UP THE ACTIVE DIRECTORY CONTINUED


    The wizard presents you with the option to verify the data after backup. This
    option allows the system to read the backed-up data to verify it. Verification
    can take some time, but it does enable you to make certain the data has been backed
    up correctly. Aside from using this option, you can also take a look at the backup
    log file to verify the backup job. You can also use hardware compression if it
    is available on the backup media. Compression gives you more space on the media,
    but you should make certain that all drives you may use for a restore operation
    can read a compressed backup job.


    Next, you can choose to append the backup job to an existing job on the media,
    or you can choose to completely overwrite an older job and replace it with the
    new one. Additionally, the wizard enables you to perform the backup job immediately,
    or you can choose to schedule it for a specific time.


    ![](img/763d5ae436311371600c0952a3da9094_509_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_509_1.png)


    **18** Click Next to continue.


    **19** Click the appropriate radio button to either append the backup job to existing
    media or replace the data on the media with the new backup.


    **20** Click Next to continue.


    **16** Click this check box to verify the data after backup.


    **17** Click this check box to use hardware compression, if available.'
  merge: -1
  img_proc: true
- pgno: 510
  md: '# TIPS


    # Why does the wizard give me the option to schedule the backup job?


    The Backup utility in Windows 2000 enables you to schedule backups so that they
    automatically occur at a certain time every day. For example, you may want your
    backup jobs to run at 9 p.m. each evening after the workday is over. This automated
    feature allows the system to handle the backup procedures so that busy administrators
    can concentrate on other tasks.


    # What is the Backup Label?


    The backup label is simply a name that you give the backup job. In environments
    in which multiple backup jobs occur, you may have a particular naming convention
    in use so that you can easily locate different backup jobs. The Backup Wizard
    provides a default label that includes the date and time of the backup, but you
    can change this as desired.






    ![](img/763d5ae436311371600c0952a3da9094_510_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_510_1.png)


    +   21 If you want to change the label, type a new one.


    +   22 Click Next to continue.


    +   23 Click the appropriate radio button to run the backup now or at a later
    time.


    +   24 If you choose to run the backup at a later time, use these boxes to set
    the schedule.


    +   25 Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 511
  md: '# CHAPTER 28 MAINTAINING THE ACTIVE DIRECTORY


    # BACKING UP THE ACTIVE DIRECTORY CONTINUED


    After you finish the wizard, a backup window displays the progress of the backup
    job. The window also tells you what is being backed up and to what media. Should
    you need to stop the backup job while it is in progress, you can click Cancel.
    However, if you cancel the backup job while it is in progress, you cannot restart
    it. You have to recreate the backup job and start all over to perform the backup.
    As mentioned at the beginning of this section, the importance of an effective
    backup plan for both the Active Directory and system files cannot be understated.
    The backup plan lets you recover your data in case of system failure. Although
    a regular backup plan may take some configuration time and certainly requires
    storage resources, the results are well worth it in case your server goes down.


    ![](img/763d5ae436311371600c0952a3da9094_511_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_511_1.png)


    > 28 Click Finish to complete the wizard.


    > The backup job begins. You can click Cancel to stop it if necessary.'
  merge: -1
  img_proc: true
- pgno: 512
  md: '# RESTORING THE ACTIVE DIRECTORY


    If you should experience a server or disk failure, your first task is to restore
    the Active Directory data after the server is back online. To do this, you use
    the Restore Wizard in the Windows Backup utility. However, you cannot restore
    the Active Directory with your server running in normal mode. Instead, you must
    restore Active Directory in a "safe" mode called Directory Services Restore Mode.


    To go into Directory Services Restore Mode, reboot your server and press the F8
    key at reboot. A menu appears with several booting options. Select Directory Services
    Restore Mode and press Enter. The computer boots into safe mode. Log on with your
    administrator account, and then click OK to the message telling you the computer
    is running in safe mode. After the computer boots in safe mode, you can run the
    Restore Wizard to restore your Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_512_0.png)


    +   1. Click OK to the Safe Mode message that appears after you log on.

    +   2. Choose Start→Programs→Accessories→System Tools→Backup.'
  merge: -1
  img_proc: true
- pgno: 513
  md: '# RESTORING THE ACTIVE DIRECTORY

    CONTINUED


    When you use the Restore Wizard, you select what items you want to restore. This
    is particularly useful if a folder is lost. You can restore the folder and the
    files in it without having to perform a complete restore of your entire system.


    To restore the Active Directory, you choose to restore System State Data.


    The wizard may prompt you for the location of the backup job, and then the restore
    process begins. After the restoration is complete, you can reboot your computer.
    When the server is back online, changes are replicated from the other domain controllers
    so that the Active Directory database on your computer is up-to-date.


    In some instances, however, you may not wish for certain data to be updated through
    replication. In this case, you can choose to *authoritatively* restore that data.
    You can learn how to use an authoritative restore in the next section.


    ![](img/763d5ae436311371600c0952a3da9094_513_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_513_1.png)


    **3** Click Restore Wizard.


    **4** The Restore Wizard appears.


    **4** Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 514
  md: '# TIPS


    **Can I restore other data when I am restoring the System State Data, or should
    I perform this task individually?**


    You can restore any data that you want by selecting the desired data in the file
    list. The Restore Wizard then restores all the data that you select.


    **What happens if I leave my server in safe mode?**


    Safe mode is provided so that you can repair problematic parts of your system.
    When safe mode is in effect, a limited number of hardware drivers are running
    and your server services are disabled. If you leave your server in safe mode,
    it is not available on the network or to service clients. Also, your Active Directory
    data cannot be updated through replication with other domain controllers until
    you reboot into normal mode.


    ![](img/763d5ae436311371600c0952a3da9094_514_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_514_1.png)


    +   5 Expand the What To Restore File and select System State by clicking the
    check box.


    +   6 Click Next to continue.


    +   7 Click Finish to perform the restore.


    # IMPLEMENTATION


    VIII'
  merge: -1
  img_proc: true
- pgno: 515
  md: '# PERFORMING AN AUTHORITATIVE RESTORE


    After performing an Active Directory restore using the Restore Wizard, you may
    also need to perform an authoritative restore as well before rebooting from safe
    mode. An authoritative restore is used to tag certain information to prevent the
    Active Directory replication process from updating it. For example, say you accidentally
    delete an OU. The deletion is then replicated to the


    other domain controllers. You can restore that OU from backup, but when you bring
    your server online, the other domain controllers delete it again because of replication.
    An authoritative restore prevents this from happening. When you authoritatively
    restore an object, OU, or domain, the restore is tagged as authoritative and replicated
    to the other domain controllers instead of


    the domain controllers replicating the error back to the server.


    The authoritative restore is performed using the command line utility, Ntdsutil,
    which is accessible from the Run line. If you want to perform an authoritative
    restore, you must do so after the Backup Wizard restore has taken place and before
    you reboot your server out of safe mode.


    ![](img/763d5ae436311371600c0952a3da9094_515_0.png)'
  merge: -1
  img_proc: true
- pgno: 516
  md: '# What happens if I perform a restore and reboot my server before running an
    authoritative restore?


    If you reboot into normal mode before using authoritative restore, the server
    will be updated through replication. If you are trying to replace an accidentally
    deleted object or another operation in which replication should not overwrite
    the restore, then you must use the authoritative restore function. If not, the
    error is replicated back to your server and you have to go through the restore
    process again.


    # Can Ntdsutil perform other tasks!


    Yes. Ntdsutil can help you with other Active Directory management tasks. To see
    a list, simply access Ntdsutil at the Run line and then type Help when the console
    opens.


    ![](img/763d5ae436311371600c0952a3da9094_516_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_516_1.png)


    +   **5** Type restore subtree followed by the correct information for the object,
    OU, or domain.


    +   **6** Review the results and type quit to end the Ntdsutil session.'
  merge: -1
  img_proc: true
- pgno: 517
  md: '# ## CLEANING THE LOSTANDFOUND FOLDER


    For the most part, Active Directory maintains itself. It performs replication
    automatically, defragments the database, and takes care of database issues. The
    Active Directory also performs “garbage cleanup” at 12-hour intervals to remove
    unnecessary log files and delete old, or tombstoned, objects from the Active Directory.


    One item you should occasionally check, however, is the LostAndFound folder. LostAndFound
    is a hidden container in Active Directory Users and Computer. From time to time,
    misplaced objects are put in the LostAndFound container. For example, say you
    create an object to be added to a container. At the same time, another administrator
    deletes the container. Now, the object has


    nowhere to go. Because the Active Directory cannot determine where to place the
    object, it is put in the LostAndFound container and held there.


    As a part of your administrative duties, you should occasionally check the LostAndFound
    container to see if the objects residing there need to be deleted or moved to
    a valid container.


    ![](img/763d5ae436311371600c0952a3da9094_517_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_517_1.png)


    +   1.  Choose **Start**\> **Programs**\> **Administrative Tools**\> **Active
    Directory Users and Computers**.


    +   1.  The Console opens.'
  merge: -1
  img_proc: true
- pgno: 518
  md: "![](img/763d5ae436311371600c0952a3da9094_518_0.png)\n\nHow can I move a LostAndFound\
    \ object?  \n If you find an object in the LostAndFound container that you want\
    \ to keep, you can move it to a different location. Select the object and then\
    \ choose Action Move. In the window that appears, select a new location for the\
    \ object.\n\nHow often should I check the LostAndFound container?  \n Objects\
    \ end up in the LostAndFound container only in environments with multiple domain\
    \ controllers and even multiple domains. In an Enterprise environment, you should\
    \ check the LostAndFound container every few weeks because a greater possibility\
    \ of misplaced objects exists. In medium to smaller environments, a once-a-month\
    \ check is plenty.\n\n![](img/763d5ae436311371600c0952a3da9094_518_1.png)\n\n\
    2 Choose View Advanced Features.\n\n![](img/763d5ae436311371600c0952a3da9094_518_2.png)\n\
    \n3 Click LostAndFound.\n\n4 Review any files in the details pane and delete or\
    \ move them as necessary."
  merge: -1
  img_proc: true
- pgno: 519
  md: '# RESOURCE KIT TOOLS


    # Installing the Resource Kit


    To help you manage and maintain the Active Directory, the Windows 2000 Resource
    Kit contains some additional tools for Active Directory management. These tools
    are described in the following sections so that you can see what tools are available,
    what they do, and when you would want to use them.


    Before you can access the tools, you must install the Resource Kit that is located
    on your Windows 2000 Server CD-ROM. Browse the CD, open the Support folder, and
    then open the Reskit folder. Double-click the Setup icon to install the Resource
    Kit on your server. The Resource Kit contains both tools and online documentation
    to assist you


    with a variety of Windows 2000 features and options.


    You can also expect Microsoft to release updates, patches, and additional tools
    for the Active Directory from time to time. You can keep abreast of these updates
    by accessing the update Web site available at Start\<>Windows Update.


    ![](img/763d5ae436311371600c0952a3da9094_519_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_519_1.png)


    +   1. Open the installation CD-ROM.


    +   2. Open Support, Reskit, and then double-click Setup.


    +   3. Follow the on-screen instructions to complete setup.'
  merge: -1
  img_proc: true
- pgno: 520
  md: '# RESOURCE KIT TOOLS


    # Accessing the Resource Kit


    After you install the Resource Kit, you can access it from the Start\u2192Programs
    menu. You see from this menu that you can choose to open either the online books
    or the Tools Console.

    Choose the Tools Console.


    When the console opens, you can expand the Resource Kit, expand Windows 2000 Resource
    Kit, and click on Tools A to Z. A list of available tools on the Resource Kit
    appears in the details pane.


    If you are uncertain about which tool you want to use, click the Tool Categories
    container in the left pane so that each tool is accompanied by a short description
    in the details pane.


    The following sections point out the tools that are useful with Active Directory
    management and when you should consider using each particular tool.


    ![](img/763d5ae436311371600c0952a3da9094_520_0.png)


    1 Choose Start\u2192Programs\u2192Resource Kit\u2192Tools Management Console.


    ![](img/763d5ae436311371600c0952a3da9094_520_1.png)


    2 Expand the Resource Kit and click Tools A to Z or Tools Categories.'
  merge: -1
  img_proc: true
- pgno: 521
  md: '# RESOURCE KIT TOOLS


    # DsacIs.exe


    The DsacIs.exe (Directory Services Access Control Lists) tool helps you manage
    access control lists for the Active Directory. When you launch DsacIs.exe, a command
    prompt opens and displays information about the utility. The purpose of the utility
    is to display or modify existing Access Control Lists of


    Active Directory Objects, ACLs determine who can access what Active Directory
    object. With this command line utility, you can view information about the current
    ACLs and use the string command to modify ACLs as desired.


    When the utility opens, you can see a list of switches and command line codes
    available to help you manage ACLs. This tool is a useful way to manage ACLs from
    one location, but you may face a slight learning curve to master the syntax options.


    ![](img/763d5ae436311371600c0952a3da9094_521_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_521_1.png)


    +   1.  Double-click DsacIs.exe in the Resource Kit details pane.


    The utility opens with a list of syntax and switch options.'
  merge: -1
  img_proc: true
- pgno: 522
  md: '# # RESOURCE KIT TOOLS


    # ## Dsstat.exe


    Dsstat.exe (Directory Services Status) is a command-line utility that performs
    diagnostic tests to detect differences between naming contexts on domain controllers.


    For example, you can use Dsstat.exe to compare two different directory trees across
    different domains. The tool gathers statistical information about the capacity
    of the domain controllers, such as database size and the number of objects per
    server. By gathering these statistics, Dsstat.exe can determine if the domain
    controllers have an accurate image of their own domains.


    Dsstat.exe has switches that allow you to refine its operation to specific domains,
    domain controllers, or global catalogs. It is particularly helpful as a troubleshooting
    tool.


    ![](img/763d5ae436311371600c0952a3da9094_522_0.png)


    **Double-click Dsstat.exe in the Resource Kit details pane.**


    **The utility opens with a list of syntax and switch options.**'
  merge: -1
  img_proc: true
- pgno: 523
  md: '# RESOURCE KIT TOOLS


    # Ldp.exe


    Ldp.exe is a graphical tool that allows you to perform a variety of LDAP (Lightweight
    Directory Access Protocol) actions. You can use the tool to connect, bind, and
    search different servers and gain the LDAP information about different directory
    objects.


    The most important aspect of the Ldp.exe tool is the display of the *metadata*,
    which is information about the attributes of each object within the directory.
    You can search for a particular object and gain its full LDAP name, such as CN=CorpServ,
    CN=Servers,


    DC=Corp, DC=com. This information is not displayed using a typical LDAP search
    for an Active Directory object. By using this tool, you can troubleshoot LDAP
    retrieval problems.


    ![](img/763d5ae436311371600c0952a3da9094_523_0.png)


    1. Double-click Ldp.exe in the Resource Kit details pane.


    The window opens.


    2. Use the menus to connect to different LDAP servers and gather LDAP information.'
  merge: -1
  img_proc: true
- pgno: 524
  md: '# RESOURCE KIT TOOLS


    # Movetree.exe


    Movetree.exe is a useful tool for administrators who manage Active Directory environments
    that are undergoing organizational changes. You can use Movetree.exe to move Active
    Directory objects and OUs between different domains in a single forest. This utility
    can be of great value if you find yourself


    needing to consolidate two domains or move objects and OUs between domains within
    a forest.


    Although Movetree.exe is a useful utility, you should note that the utility does
    not solve all of the problems with a major resource movement or domain consolidation.
    Some objects, due to


    data storage, cannot be moved, and you must perform these moves manually. As always,
    careful planning to attempt to avert resource movement or domain consolidation
    is your best action. Yet, in the case of a resource movement or consolidation,
    this command line utility can be of great value.


    ![](img/763d5ae436311371600c0952a3da9094_524_0.png)


    Double-click Movetree.exe in the Resource Kit details pane.


    The utility opens and displays a list of command line switches and options.'
  merge: -1
  img_proc: true
- pgno: 525
  md: '# ENFORCING PASSWORD HISTORY


    Password history allows the computer to remember passwords that have previously
    been used on the system. By remembering passwords, the computer can tell a user
    when he or she is attempting to reuse a password that has previously been used.


    You can determine how many passwords you want the policy to remember. The default
    is only 1, but you can set the system to remember as many as you like. The decision
    you make depends on the security desires of your organization and whether or not
    you allow users to reuse old passwords.


    ![](img/763d5ae436311371600c0952a3da9094_525_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_525_1.png)


    +   1.  **Expand** the Account Policies container and select Password Policy in
    the left pane. The policy settings appear in the details pane.


    +   2.  **Double-click** the Enforce Password History policy setting.


    +   3.  **Click** the check box to either enable or disable the policy setting.


    +   4.  Use the scroll box to increase or decrease the number of passwords the
    system remembers.


    +   5.  **Click** OK.'
  merge: -1
  img_proc: true
- pgno: 526
  md: "# ## ENFORCING MAXIMUM\n## PASSWORD AGE\n\nPassword age is a serious security\
    \ issue. Most networks do not allow a user to have the same password for an indefinite\
    \ period of time. The longer passwords are used, the more likely they are to be\
    \ stolen by unauthorized individuals. A good security plan limits the\n\namount\
    \ of time a password can be used. The default setting is 42 days. After the time\
    \ expires, users are prompted to create a new password for their accounts. You\
    \ can use a shorter or longer time if desired, but create a\n\nreasonable length\
    \ of time. You do not want to force your users to learn—and remember—a new password\
    \ every week, but you do not want them using the same password for six months—or\
    \ longer—either.\n\n![](img/763d5ae436311371600c0952a3da9094_526_0.png)\n\n+ \
    \  1.  Expand the Account Policies container and select Password Policy in the\
    \ left pane.\n+       *   The policy settings appear in the details pane.\n+ \
    \  \n+   2.  Double-click the Maximum Password Age policy setting.\n+   \n+  \
    \     *   The Maximum Password Age window appears.\n+       *   Click the check\
    \ box to either enable or disable the policy setting.\n+   \n+   4.  Use the scroll\
    \ box to increase or decrease the number of days in which the password expires.\n\
    +   \n+   5.  Click OK."
  merge: -1
  img_proc: true
- pgno: 527
  md: '# ENFORCING MINIMUM PASSWORD AGE


    As with enforcing password maximum age, you can also enforce a minimum age. For
    example, let''s say that a particular user is very worried about password security.
    The user changes his or her password every day, then eventually forgets the password,
    then the user has to get help. The minimum password age prevents users from changing
    their passwords too frequently by requiring a certain number of days to pass before
    they can change their passwords again. By default, the setting is 0 days, which
    means users can change their passwords any time they desire, but you can change
    this so that users must keep their passwords for a specified number of days before
    changing it.


    ![](img/763d5ae436311371600c0952a3da9094_527_0.png)


    +   1. Expand the Account Policies container and select Password Policy in the
    left pane.

    +      - The policy settings appear in the details pane.


    +   2. Double-click the Minimum Password Age policy setting.


    +   3. Click the check box to either enable or disable the policy setting.


    +   4. Use the scroll box to increase or decrease the minimum number of days a
    password must be used.

    +   5. Click OK.'
  merge: -1
  img_proc: true
- pgno: 528
  md: "# ENFORCING MINIMUM PASSWORD LENGTH\n\nF or security purposes, you can force\
    \ users to create passwords that adhere to a certain length of characters. This\
    \ is a good security policy because longer passwords are more difficult for unauthorized\
    \ users to\n\nsteal. As a general rule, a password character length of seven characters\
    \ should suffice. By setting a length requirement, you prevent users from using\
    \ simple passwords, such as “cat,” or “dog” or “car,” and so on. The\n\ndefault\
    \ setting for this policy is 0, which means no length requirements exists, but\
    \ for good security, you should consider implementing a password length of at\
    \ least five characters, with seven being your best choice.\n\n![](img/763d5ae436311371600c0952a3da9094_528_0.png)\n\
    \n+   **1** Expand the Account Policies container and select Password Policy in\
    \ the left pane.\n+   \n+   * The policy settings appear in the details pane.\n\
    \n+   **2** Double-click the Minimum Password Length policy setting.\n\n![](img/763d5ae436311371600c0952a3da9094_528_1.png)\n\
    \n+   * The Minimum Password Length window appears.\n+   \n+   **3** Click the\
    \ check box to either enable or disable the policy setting.\n\n+   **4** Use the\
    \ scroll box to increase or decrease the number of characters the password must\
    \ contain.\n+   \n+   **5** Click OK."
  merge: -1
  img_proc: true
- pgno: 529
  md: '# **APPENDIX A**


    # # ENFORCING PASSWORD COMPLEXITY REQUIREMENTS


    As with password minimum lengths, another good security measure is to require
    that passwords meet complexity requirements. This policy requires users to create


    passwords that contain a mixture of numbers, letters, or keyboard symbols. For
    example, under this policy, a user could not have a password of “sweetbaby,” but
    would be required to make the


    password more complex, such as “sweetbaby847.” Complex passwords that use a combination
    of letters, numbers, or symbols are much more difficult for unauthorized users
    to break.


    ![](img/763d5ae436311371600c0952a3da9094_529_0.png)


    +   1. Expand the Account Policies container and select Password Policy in the
    left pane.

    +      - The policy settings appear in the details pane.


    +   2. Double-click the Passwords Must Meet Complexity Requirements policy setting.


    +   3. The Passwords Must Meet Complexity Requirements window appears.

    +      - Click the check box to either enable or disable the policy setting.


    +   4. Use the radio buttons to either enable or disable the policy.

    +      5. Click OK.'
  merge: -1
  img_proc: true
- pgno: 530
  md: '# STORING PASSWORDS USING REVERSIBLE ENCRYPTION FOR ALL USERS IN THE DOMAIN


    An additional security feature you can implement regarding user passwords is reversible
    encryption. Passwords may or may not be encrypted when in transit, depending on
    other security settings in your domain. This feature enables you to use reversible
    encryption, which basically scrambles the encrypted data in a reverse fashion
    in order to provide superior encryption performance. This setting ensures that
    passwords stolen off the network while the password is in transit cannot be read.


    ![](img/763d5ae436311371600c0952a3da9094_530_0.png)


    +   1.  Expand the Account Policies container and select **Password Policy** in
    the left pane.

    +       The policy settings appear in the details pane.


    +   2.  Double-click the **Store Password Using Reversible Encryption For All
    Users In The Domain** policy setting.


    +   3.  The **Store Password Using Reversible Encryption For All Users In The
    Domain** window appears.

    +       Click the check box to either enable or disable the policy setting.


    +   4.  Use the radio buttons to either enable or disable the policy.

    +   5.  Click **OK**.'
  merge: -1
  img_proc: true
- pgno: 531
  md: '# APPENDIX A


    # ENFORCING ACCOUNT LOCKOUT DURATION


    Account lockout is a security feature that locks a user''s account if the user
    makes a specified number of failed logon attempts. The default three failed attempts.
    This lockout policy enables you to define the amount of time, in minutes, that
    the account is locked out. For example, you can configure the account to be locked
    for 30 minutes. If someone is trying to hack his or her way into the account,
    this provides a lock for a period of time, in which the hacker will hopefully
    give up. If you do not enter a number of minutes, then the account remains locked
    until an administrator unlocks it.


    ![](img/763d5ae436311371600c0952a3da9094_531_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_531_1.png)


    +   1. Expand the Account Policies container and select Account Lockout Policy.

    +      The policy settings appear in the details pane.

    +   2. Double-click the Account Lockout Duration policy setting.


    +   3. The Account Lockout Duration window appears.

    +      Click the check box to either enable or disable the policy setting.

    +   4. Use the scroll box to adjust the number of minutes. If you do not enter
    any minutes in the box, the account remains locked until an administrator unlocks
    it.

    +   5. Click OK.'
  merge: -1
  img_proc: true
- pgno: 532
  md: '# ENFORCING ACCOUNT LOCKOUT THRESHOLD


    If you decide to use Account Lockout, then you need to set a threshold, which
    determines how many times a user can attempt to log on before the account is locked
    out. A good value is 3, which gives the user three chances to enter a correct
    user name before the account locks. This setting allows the user to make a spelling
    mistake on one or two tries, but locks after the third unsuccessful attempt. This
    way, if an unauthorized person is attempting to hack into the account, he or she
    can only try three times before the account is locked.


    Also, if you specify 0 attempts, the account will not lock.


    ![](img/763d5ae436311371600c0952a3da9094_532_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_532_1.png)


    +   1. Expand the Account Policies container and select Account Lockout Policy.

    +       ■ The policy settings appear in the details pane.


    +   2. Double-click the Account Lockout Threshold policy setting.


    +   3. The Account Lockout Threshold window appears.

    +       ■ Click the check box to either enable or disable the policy setting.


    +   4. Use the scroll box to adjust the number of times a user can attempt to
    logon before the account is locked.

    +       ■ If the value is set to 0, the account will not lock.


    +   5. Click OK.'
  merge: -1
  img_proc: true
- pgno: 533
  md: '# APPENDIX A


    # ENFORCING ACCOUNT LOCKOUT COUNTER


    T he computer system maintains an account lockout counter that records the number
    of times an account is locked within a specified time period. You can change this
    time period by adjusting the number of minutes that pass before the lockout counter
    is reset.


    ![](img/763d5ae436311371600c0952a3da9094_533_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_533_1.png)


    +   1. Expand the Account Policies container and select Account Lockout Policy.

    +   ■ The policy settings appear in the details pane.

    +   2. Double-click the Account Lockout Counter policy setting.


    +   ■ The Account Lockout Counter window appears.

    +   3. Click the check box to either enable or disable the policy setting.

    +   4. Use the scroll box to adjust the number of minutes that pass before the
    counter is reset.

    +   5. Click OK.'
  merge: -1
  img_proc: true
- pgno: 534
  md: "# ENFORCING USER LOGON RESTRICTIONS\n\n**K**erberos is the primary security\
    \ protocol in Windows 2000. By using the User Logon Restrictions policy, you can\
    \ determine whether or not to enable user logon restrictions. You use this policy\
    \ in conjunction with other policies found in the Kerberos Policy container. If\
    \ you want to enable user logon restrictions, click the enable radio button, then\
    \ use the other policies in this container to configure the desired options.\n\
    \n![](img/763d5ae436311371600c0952a3da9094_534_0.png)\n\n![](img/763d5ae436311371600c0952a3da9094_534_1.png)\n\
    \n+   * **1** Expand the Account Policies container and select Kerberos Policy.\n\
    +   \t* ■ The policy settings appear in the details pane.\n+   \t* **2** Double-click\
    \ the Enforce User Logon Restrictions policy setting.\n+   \t* ■ The Enforce User\
    \ Logon Restrictions window appears.\n+   \t* **3** Click the check box to either\
    \ enable or disable the policy setting.\n+   \t* **4** Click either the enabled\
    \ or disabled radio button.\n+   \t* **5** Click OK."
  merge: -1
  img_proc: true
- pgno: 535
  md: '# APPENDIX A


    # ENFORCING MAXIMUM LIFETIME FOR

    SERVICE TICKET


    **K**erberos authentication works by using service tickets. By enabling this policy,
    you can place a maximum lifetime age for the service ticket for the users’ accounts.
    This feature requires the system to periodically generate new service tickets,
    which provides an additional measure of security for your network logon process.


    ![](img/763d5ae436311371600c0952a3da9094_535_0.png)


    The policy settings appear in the details pane.


    2.  Double-click the Maximum Lifetime For Service Ticket policy setting.


    ![](img/763d5ae436311371600c0952a3da9094_535_1.png)


    The Maximum Lifetime For Service Ticket window appears.


    4.  Use the scroll box to determine the number of minutes for ticket expiration.


    5.  Click OK.'
  merge: -1
  img_proc: true
- pgno: 536
  md: "# ENFORCING MAXIMUM LIFETIME FOR USER TICKET\n\nJust as service tickets are\
    \ used for the logon service, users also have a logon ticket for Kerberos security.\
    \ You can set the maximum age for the user's ticket based on hours. By default,\
    \ a user's ticket expires after ten hours, but you can reduce this number for\
    \ additional security. However, the default setting is typically all you need\
    \ for effective Kerberos security.\n\n![](img/763d5ae436311371600c0952a3da9094_536_0.png)\n\
    \n+   1. Expand the Account Policies container and select Kerberos Policy.\n+\
    \   \n+   The policy settings appear in the details pane.\n+   \n+   2. Double-click\
    \ the Maximum Lifetime For User Ticket policy setting.\n+   \n+   The Maximum\
    \ Lifetime For User Ticket window appears.\n+   \n+   3. Click the check box to\
    \ either enable or disable the policy setting.\n+   \n+   4. Use the scroll box\
    \ to determine the number of hours for ticket expiration.\n+   \n+   5. Click\
    \ Ok."
  merge: -1
  img_proc: true
- pgno: 537
  md: '# APPENDIX A


    # ENFORCING MAXIMUM TOLERANCE FOR COMPUTER CLOCK SYNCHRONIZATION


    Kerberos security maintains clock synchronization with the server in order to
    handle ticket expirations and renewals.


    The Maximum Tolerance For Computer Clock Synchronization policy allows you to
    adjust the amount of clock synchronization


    difference that is tolerated. The default setting is 5 minutes, and this is typically
    all you need.


    ![](img/763d5ae436311371600c0952a3da9094_537_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_537_1.png)


    +   1.  Expand the Account Policies container and select Kerberos Policy.

    +       ■ The policy settings appear in the details pane.


    +   2.  Double-click the Maximum Tolerance For Computer Clock Synchronization
    policy setting.


    +   ■ The Maximum Tolerance For Computer Clock Synchronization window appears.

    +   3.  Click the check box to either enable or disable the policy setting.


    +   4.  Use the scroll box to determine the number of minutes for the maximum
    clock synchronization tolerance.

    +   5.  Click OK.'
  merge: -1
  img_proc: true
- pgno: 538
  md: '# # AUDITING ACCOUNT LOGON EVENTS


    uditing is a category of local policy found under the Security Settings. These
    policies allow you to configure how auditing is applied on client


    computers and how different events are audited. Using logon auditing, you can
    generate a log file telling you about the successful or failed logon attempts


    to that computer. This information can be very helpful if you believe unauthorized
    persons are attempting to log on to a particular computer.


    ![](img/763d5ae436311371600c0952a3da9094_538_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_538_1.png)


    +   1 Expand the Security Settings container, expand the Local Policies container,
    then select Audit Policy.


    +   - The policy settings appear in the details pane.


    +   2 Double-click the Audit Account Logon Events policy setting.


    +   3 The Audit Account Logon Events window appears.

    +   - Click the check box to either enable or disable the policy setting.


    +   4 Select either the Success or Failure check box, or both.

    +   5 Click OK.'
  merge: -1
  img_proc: true
- pgno: 539
  md: "# APPENDIX A\n\n# AUDITING ACCOUNT MANAGEMENT\n\nY ou can also audit a user’s\
    \ account management. These events include such as items\n\nas password changes,\
    \ phone number changes, and so forth. You can choose to either audit\n\nsuccessful\
    \ or failed account management actions that users may perform on the client computer.\n\
    \n![](img/763d5ae436311371600c0952a3da9094_539_0.png)\n\n![](img/763d5ae436311371600c0952a3da9094_539_1.png)\n\
    \n+   1. Expand the Security Settings container, expand the Local Policies container,\
    \ then select Audit Policy.\n+   \n+      - The policy settings appear in the\
    \ details pane.\n\n+   2. Double-click the Audit Account Management policy setting.\n\
    \n+   3. Click the check box to either enable or disable the policy setting.\n\
    +   4. Select either the Success or Failure check box, or both.\n+   5. Click\
    \ OK."
  merge: -1
  img_proc: true
- pgno: 540
  md: '# AUDITING DIRECTORY SERVICE ACCESS


    The auditing of Directory Service access allows you to see a computer''s success
    or failure when attempting to access the Active Directory. This information can
    help you determine if directory service access problems exist for particular computers.


    ![](img/763d5ae436311371600c0952a3da9094_540_0.png)


    +   1.  Expand the Security Settings container, expand the Local Policies container,
    then select Audit Policy.

    +   2.  Double-click the Audit Directory Service Access policy setting.

    +   3.  The Directory Service Access window appears. Click the check box to either
    enable or disable the policy setting.

    +   4.  Select either the Success or Failure check box, or both.

    +   5.  Click OK.


    The policy settings appear in the details pane.'
  merge: -1
  img_proc: true
- pgno: 541
  md: "# APPENDIX A\n\n# AUDITING LOGON EVENTS\n\nThe audit logon events policy is\
    \ much like auditing account logon events, but the logon events policy applies\
    \ to any type of logon the user attempts to perform. For example, if the user\
    \ is required to access a particular share or Web folder, then that logon event\
    \ is audited under this policy. This policy can help you determine resource access\
    \ on your network and find access problems that may exist.\n\n![](img/763d5ae436311371600c0952a3da9094_541_0.png)\n\
    \n+   1 Expand the Security Settings container, expand the Local Computer container,\
    \ and select Audit Policy.\n+   \n+   - The policy settings appear in the details\
    \ pane.\n\n+   2 Double-click the Audit Logon Events policy setting.\n\n+   3\
    \ The Audit Logon Events window appears.\n+   \n+   - Click the check box to either\
    \ enable or disable the policy setting.\n\n+   4 Select either the Success or\
    \ Failure check box, or both.\n+   5 Click OK."
  merge: -1
  img_proc: true
- pgno: 542
  md: '# AUDITING OBJECT ACCESS


    Object access means the Active Directory objects that users access, such as folders,
    shares, printer, and so forth. You can choose to audit the


    success or failure of object access for client computers. This information can
    help you see trends with access problems or help you discover when a


    particular client computer has a high failure rate, or when some unauthorized
    user may be trying to gain access to the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_542_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_542_1.png)


    +   1.  Expand the Security Settings container, expand the Local Policies container,
    then select Audit Policy.

    +   2.  The policy settings appear in the details pane.

    +   3.  Double-click the Audit Object Access policy setting.


    +   4.  The Audit Object Access window appears.

    +   5.  Click the check box to either enable or disable the policy setting.

    +   6.  Select either the Success or Failure check box, or both.

    +   7.  Click OK.'
  merge: -1
  img_proc: true
- pgno: 543
  md: '# AUDITING POLICY CHANGE


    Y ou can audit policy changes that occur for client computers. This auditing process
    involves any changes that are made to the user''s local policy by the user. You
    can use this information to determine if excessive change attempts are being made
    to the policy. This can be a clue that an unauthorized person is attempting to
    change configuration of the computer.


    ![](img/763d5ae436311371600c0952a3da9094_543_0.png)


    +   1. Expand the Security Settings container, expand the Local Policy container,
    then select Audit Policy.

    +   * The policy settings appear in the details pane.


    +   2. Double-click the Audit Policy Change policy setting.


    +   3. The Audit Policy Change window appears.

    +   * Click the check box to either enable or disable the policy setting.


    +   4. Select either the Success or Failure check box, or both.

    +   5. Click OK.'
  merge: -1
  img_proc: true
- pgno: 544
  md: "# AUDITING PRIVILEGE USE\n\nPrivilege use audits certain events that are tied\
    \ to the user's rights and privileges configured for the account.\n\nAuditing\
    \ privilege use enables you to see a user's success or failure to privilege portions\
    \ of the network or information. You can audit this event to determine if a high\
    \ number of failures have occurred,\n\nwhich may signal that an unauthorized person\
    \ may be trying to access information on the network.\n\n![](img/763d5ae436311371600c0952a3da9094_544_0.png)\n\
    \n+   1. Expand the Security Settings container, expand the Local Policies container,\
    \ then select Audit Policy.\n+   \n+      - The policy settings appear in the\
    \ details pane.\n\n+   2. Double-click the Audit Privilege Use policy setting.\n\
    \n+   3. The Audit Privilege Use window appears.\n+   \n+      - Click the check\
    \ box to either enable or disable the policy setting.\n\n+   4. Select either\
    \ the Success or Failure check box, or both.\n+   5. Click OK."
  merge: -1
  img_proc: true
- pgno: 545
  md: '# APPENDIX A


    # AUDITING PROCESS TRACKING


    Process tracking audits success or failure of processes that occur on the users''
    computers and through network processes. This auditing feature enables you to
    view the success or failure of processes that are tracked by the system.


    ![](img/763d5ae436311371600c0952a3da9094_545_0.png)


    +   1.  Expand the Security Settings container, expand the Local Policies container,
    then select Audit Policy.

    +       *   The policy settings appear in the details pane.

    +   2.  Double-click the Audit Process Tracking policy setting.

    +   3.  The Audit Process Tracking window appears.

    +       *   Click the check box to either enable or disable the policy setting.

    +   4.  Select either the Success or Failure check box, or both.

    +   5.  Click OK.'
  merge: -1
  img_proc: true
- pgno: 546
  md: '# # AUDITING SYSTEM EVENTS


    A s with process tracking, you can audit system events that occur on the user''s
    computer both from a success or failure perspective. Typically, you would choose
    to audit system events based on failure. This enables you to see possible user
    tampering and configuration changes.


    ![](img/763d5ae436311371600c0952a3da9094_546_0.png)


    +   1.  Expand the Security Settings container, expand the Local Policies container,
    then select Audit Policy.

    +   2.  Double-click the Audit System Events policy setting.

    +   3.  The Audit System Events window appears.

    +   4.  Select either the Success or Failure check box, or both.

    +   5.  Click OK.'
  merge: -1
  img_proc: true
- pgno: 547
  md: '# **ACCESSING THIS COMPUTER FROM THE NETWORK**


    A side from auditing events, you can also determine what rights users have for
    accessing and using various computers on the network, as well as other configuration
    options. This user right enables the groups you select to access the particular
    client computer through a network connection as necessary to access shared files
    and folders.


    ![](img/763d5ae436311371600c0952a3da9094_547_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_547_1.png)


    +   **1** Expand the Security Settings container, expand the Local Policies container,
    then select Users Rights Assignment.


    The policy settings appear in the details pane.


    +   **2** Double-click the Access This Computer From The Network policy setting.


    +   **3** Click the check box to either enable or disable the policy setting.


    The Access This Computer From The Network policy window appears.


    +   **4** Click Add.


    +   **5** Select the desired groups, then click OK.


    You can also use the Remove button to remove any existing groups.


    +   **6** Click OK.'
  merge: -1
  img_proc: true
- pgno: 548
  md: '# ACT AS A PART OF THE OPERATING SYSTEM


    The Act As A Part Of The Operating System policy gives users or groups the user
    right of being recognized by the operating system for configuration purposes.
    This feature enables you to restrict configuration to certain users or groups
    that you select.


    ![](img/763d5ae436311371600c0952a3da9094_548_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_548_1.png)


    +   1. Expand the Security Settings container, expand the Local Policies container,
    then select Users Rights Assignment:

    +   * The policy settings appear in the details pane.


    +   2. Double-click the Act As A Part Of The Operating System policy setting.


    +   * The Act As Part Of The Operating System policy window appears.

    +   3. Click the check box to either enable or disable the policy setting.

    +   4. Click Add.


    +   5. Select the desired groups, then click OK.

    +   * You can also use the Remove button to remove any existing groups.

    +   6. Click OK.'
  merge: -1
  img_proc: true
- pgno: 549
  md: "# APPENDIX A\n\n# ADDING WORKSTATIONS TO THE DOMAIN\n\nThis policy allows users\
    \ to add workstations to the domain. As with other policy settings in this container,\
    \ you select which users or groups you want to have this right. Typically, you\
    \ do not want everyone to be able to add new workstations to the domain, but only\
    \ certain users or groups should handle this task.\n\n![](img/763d5ae436311371600c0952a3da9094_549_0.png)\n\
    \n+   * **Expand the Security Settings container, expand the Local Policies container,\
    \ then select Users Rights Assignment.**\n+   \t* The policy settings appear in\
    \ the details pane.\n\n+   * **Double-click the Add Workstations To Domain policy\
    \ setting.**\n\n![](img/763d5ae436311371600c0952a3da9094_549_1.png)\n\n+   * **The\
    \ Add Workstations To Domain policy window appears.**\n+   \t* **Click the check\
