- pgno: 183
  md: '# MANAGING ZONE RESOURCE RECORDS AND DELEGATION


    # Managing Zone Resource Records


    Each zone database file contains any number of resource records. A resource record
    is simply an entry in the database—a record—that the DNS can use to help resolve
    certain queries and resolutions. When a zone is created, two records are created
    by default—the Start of Authority (SOA) and the Name Server (NS). The SOA defines
    which server in the zone is the authoritative server. The NS records lists all
    the DNS servers operating in the zone. Besides these two default records, you
    can add several records as needed.


    First, you can add a *host* record (A). An A record provides a host to IP address
    mapping for a forward lookup zone. With this resource record, the DNS server can
    access the A record and forward unresolved queries to the forward lookup zone
    host. Next, you can create an *alias* (CNAME). A CNAME record, which stands for
    “canonical name,” allows a host to have an alternate name.


    ![](img/763d5ae436311371600c0952a3da9094_183_0.png)


    +   1. Select the zone in the console you want to administer and choose Action
    → New Host.

    +   2. Type the host information.

    +   3. Click this check box to create a PTR record.

    +   4. Click Add Host.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Tips


    **Why do I need to use A records?**


    A records are helpful for your DNS server to easily identify another server in
    a forward lookup zone. By accessing the A record, the DNS server knows exactly
    where to send query requests for forward lookup. In multiple zone environments,
    A records improve query performance, so you should use them when necessary. You
    also have the option of creating a “pointer record” (PTR) when you create an A
    record. A PTR record points to another portion of the namespace and can be used
    to resolve an IP address to a host name.


    **Why would I use a CNAME record?**


    A CNAME record allows a DNS server to have multiple “names.” The CNAME record
    gives the server a canonical name, which can be used in situations where round-robin
    resolution services are needed. For example, one CNAME record can contain several
    servers, or several CNAME records can point to one particular server.


    ![](img/763d5ae436311371600c0952a3da9094_184_0.png)


    5 Choose Action -> New Alias.


    ![](img/763d5ae436311371600c0952a3da9094_184_1.png)


    6 Type the alias name for the target host.


    7 Type the fully qualified name for the target host.


    8 Click this check box to delete the record when it becomes stale.


    9 Click OK.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# MANAGING ZONE RESOURCE RECORDS AND DELEGATION


    # New Mail Exchanger and New Domain Records


    You can also create a Mail Exchanger (MX) record. The MX record identifies a mail
    server with a particular host or domain. With the addition of the MX record, mail
    addressed to either the host or the domain is sent to the mail server that you
    specify when you create the resource record. You also have the option of setting
    the mail server priority. This is a two-digit number that you can enter when you
    create the record that determines the priority of the mail servers over others.
    This enables you to set a mail server that has the highest priority over a host
    or domain. You can also add a new domain to the zone. This feature is not a resource
    record function but is provided for ease of administration. After you add the
    domain, the DNS server(s) in the zone begins servicing the new domain.


    ![](img/763d5ae436311371600c0952a3da9094_185_0.png)


    **NEW MAIL EXCHANGER**

    **1** Select the zone in the console you want to administer and choose Action>New
    Mail Exchanger.


    **2** Type the host or domain name, mail server name, and mail priority.


    **3** Click this check box to delete the record when it becomes stale.


    **4** Click OK.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Tips


    # Why should I use MX records?


    MX records help you identify particular mail servers within the zone in the DNS
    database. This feature allows DNS to prioritize the mail servers for use within
    the zone. MX records are particularly useful in environments that use a number
    of mail servers within different DNS zones. By creating the MX records, your DNS
    server can easily keep track of the location of the mail servers.


    # What happens when I add a new domain?


    By selecting a particular zone in the console and using the Action menu, you can
    add a new domain to a zone. Remember that zones and domains are not related in
    terms of organization. A business may have four domains but only two zones. You
    can choose to add a domain to a zone so that domain becomes a part of the DNS
    zone and is serviced by DNS servers within the zone.


    ![](img/763d5ae436311371600c0952a3da9094_186_0.png)


    +   1. Choose Action\New Domain.


    ![](img/763d5ae436311371600c0952a3da9094_186_1.png)


    +   - 2. Type the name of the New Domain.

    +   - 3. Click OK.


    NEW DOMAIN


    163'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# MANAGING ZONE RESOURCE RECORDS AND DELEGATION


    # Zone Delegation


    As with many Windows 2000 components, both within the Active Directory and the
    operating system, you can delegate control. Delegation means that you allow another
    user, group, or computer to control some object, group, process, or service. Delegation
    is a concept you learn to use throughout the rest of the book


    in relation to Active Directory objects, OUs, services, and so on.


    You can choose to delegate control of a zone to another DNS server in another
    zone. This action allows another DNS server(s) to have authority of a particular
    zone. When


    you perform this action, however, you must also create delegation records in the
    other DNS zones that point to the DNS servers that have authority over the new
    zone. This allows the transfer of authority to take place and provides a correct
    reference to the other DNS servers that the zone has been delegated to.


    ![](img/763d5ae436311371600c0952a3da9094_187_0.png)


    1 Select the appropriate zone in the console and choose Action>New Delegation.


    ![](img/763d5ae436311371600c0952a3da9094_187_1.png)


    The New Delegation Wizard appears.


    2 Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Tips


    # Do I really need to delegate a zone?


    Keep in mind that delegation is powerful tool in Windows 2000 that allows you,
    as the administrator, to delegate duties or tasks to other individuals. By delegating
    portions of your administrative tasks, you can lower the amount of senior administrative
    overhead.


    # Who should be delegated tasks?


    Obviously, you must exercise caution and careful planning when delegating tasks
    or administrative duties to other people. The delegates must have the technical
    skills and knowledge to be able to complete the tasks. As with many issues in
    a networking environment, training and planning are of key importance.


    +   3  Type the name of the domain you want to delegate to a different zone.


    +   4  Click Next to continue.


    +   5  Select the names and IP addresses of any DNS server that you want to host
    the delegated zone.


    +   6  Click Add, Edit, or Remove to manage the list, then complete the wizard
    for the delegation to take effect.


    ![](img/763d5ae436311371600c0952a3da9094_188_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_188_1.png)'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# CONFIGURING ZONE PROPERTIES


    The properties sheets for each zone enables you to configure the zone to operate
    within your environment. As with other server services, you can pause and change
    the type of service (such as Active Directory integrated) by using the General
    tab. This feature is particular useful for troubleshooting purposes. An important
    aspect of the General tab is the dynamic updates section. Windows 2000 supports
    Dynamic DNS (DDNS) so that database updates can be performed dynamically and not
    manually by the administrator. The General tab enables you to configure dynamic
    updates by allowing them, not allowing them, or using only secure updates. In
    an Active Directory environment, the zones should be allowed to perform dynamic
    updates. You can use the Start of Authority tab (SOA) to manage the SOA record
    on your server.


    ![](img/763d5ae436311371600c0952a3da9094_189_0.png)


    +   1. In the console, select the zone that you want to administer and choose
    Action->Properties.

    +   2. Click these buttons to either pause the zone or to change the type of zone.

    +   3. Use this drop-down list to select whether or not to use dynamic updates
    and the type of update.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '![](img/763d5ae436311371600c0952a3da9094_190_0.png)


    # What is the SOA?


    The Start of Authority is a resource record that defines which server is authoritative
    for a zone. The SOA tab allows you to make adjustments this record as necessary.
    You can change the primary server that holds the SOA record, and you can even
    change the responsible person who manages the SOA on that server. The important
    point about this option is you can make major changes to your server''s DNS configuration
    without having to delete your zones and start all over. This is, of course, a
    very important feature of Windows 2000.


    # What is the Name Servers tab?


    Like the SOA tab, the Name Servers tab lists the NS records that are configured
    for the zone. This list tells you which servers are in the zone and available
    for the zone. You can use the add, edit, and remove buttons on the Name Server
    tab to manage the list as desired.


    ![](img/763d5ae436311371600c0952a3da9094_190_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_190_2.png)


    +   1.  Click the Start of Authority (SOA) tab.


    +   2.  Click Increment to adjust the serial number, if necessary.


    +   3.  Adjust the Refresh, Retry, and Expires After, if necessary.


    +   4.  Click the Name Servers tab.


    +   5.  Use the Add, Edit, or Remove buttons to adjust the name servers in the
    list.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# # CONFIGURING ZONE PROPERTIES CONTINUED


    The WINS tab enables you to use a WINS forward lookup to resolve NetBIOS names.
    DNS resolved domain names to IP addresses while WINS resolves NetBIOS names to
    IP addresses. The WINS lookup feature allows the DNS server to query the WINS
    server(s) that you specify to lookup a name in the WINS database that the DNS
    server cannot resolve. This feature is useful in mixed Windows 2000 environments
    where both DNS and WINS are in use. On the WINS tab, simply click the check box
    to enable the WINS lookup and then provide the IP address(es) of the WINS server(s).


    On the Zone Transfers tab, you can choose to allow zone transfers. A zone transfer
    updates the secondary DNS servers with the primary zone database file. Remember
    that the secondary DNS servers in the zone receive a copy of the primary zone
    database file. Only the primary DNS zone database file can be updated. After the
    primary zone file is updated, the secondary servers will get the database file
    from the primary zone server.


