- pgno: 220
  md: '# What is the demand-dial routing option for?


    You can configure your devices to inbound (RAS) connections or for inbound and
    outbound (RAS and Routing) connections. The demand-dial feature is used by Routing
    to establish remote connections with other RAS servers in a WAN. Because the feature
    is demand-dial, a connected is established only when a “demand” exists to send
    data. This feature is particularly helpful to conserve bandwidth or connection
    time on slow or leased WAN links. Because there is not a persistent connection,
    the demand-dial component allows a connection to be establishing when there is
    a need for routing communication to occur.


    # What is the phone number box for?


    Each device, depending on your configuration, may have its own phone number that
    users dial to access your RAS server. Depending on the device, this dialog box
    appears for you to enter the phone number.


    ![](img/763d5ae436311371600c0952a3da9094_220_0.png)


    +   1. Select a device in the list.

    +   2. Click Configure.


    ![](img/763d5ae436311371600c0952a3da9094_220_1.png)


    +   3. Click the appropriate check boxes for your configuration.

    +   4. Type a phone number if necessary.

    +   5. Click OK.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# CONFIGURING IP ROUTING


    Depending on your system configuration, you may have an IP Routing icon in the
    console and perhaps an IPX Routing icon. Both of these function in a similar fashion
    and are used for IP and IPX routing purposes. This section focuses on IP because
    it is the most common, and if you are using IPX, it is configured in a similar
    way.


    For the most part, IP routing takes care of itself. You do have some configuration
    options through the properties sheets, and, mostly, you can use the icon and the
    actual routing icons in the details pane to gain TCP/IP information, which is
    especially helpful for troubleshooting purposes.


    On the properties sheets, you have four major tabs. First, the General tab allows
    you to enable IP router manager, which is automatically selected. You can also
    enable router discover advertisements. This feature allows your router to learn
    about routing table updates through discover advertisement packets. Windows 2000
    sends these packets using multicast ICMP messages. Although helpful, they may
    produce a lot of excessive traffic on your network.


    ![](img/763d5ae436311371600c0952a3da9094_221_0.png)


    +   1.  Expand IP Routing in the console and select General.


    +   2.  Select a desired IP connection in the details pane.

    +   3.  Click the Action menu.


    +   From this menu, you can gain TCP/IP information by simply selecting the category
    to display the desired information.'
  merge: -1
  img_proc: true
