- pgno: 51
  md: '# ## **3** THE WINDOWS 2000 SERVER NETWORKING INTERFACE


    # ### USING THE CONFIGURE YOUR SERVER TOOL


    **D**epending on the design of your network, you may need to add and remove networking
    components from time to time. Windows 2000 contains a number of services and protocols
    that you can use on your network.


    One way that you can add or remove networking components is to use the Configure
    Your Server tool. This interface, which looks and acts similar to a Web page,
    contains menus and links for the various


    server components you may need to configure. This tool is particularly helpful
    for services or server configuration that is somewhat unfamiliar to you.


    ![](img/763d5ae436311371600c0952a3da9094_51_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_51_1.png)


    +   1. Choose Start→Programs→Administrative Tools→Configure Your Server.

    +   2. Click Networking.


    The menu expands and also gives you a general networking screen. You can install
    any of the services in the left pane by clicking them.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/763d5ae436311371600c0952a3da9094_52_0.png)


    # What happens if I decide to install networking components from this interface?


    You can install any components through the Configure Your Server interface by
    clicking the subject in the left pane and then clicking the service you want to
    install. This action begins the installation wizard for that particular component.


    # What options are available in Configure Your Server?


    The Configure Your Server tool contains expandable categories, such as Active
    Directory, File Server, Print Server, Networking, and so forth. Under each category,
    various components and services appear. For example, under the Networking category,
    DHCP, DNS, Remote Access, and Routing appear.


    # Is there another way to install networking components in Windows 2000 Server?


    Yes. You also use Add/Remove Programs in Control Panel to configure Windows components.
    See the next page for more information.


    ![](img/763d5ae436311371600c0952a3da9094_52_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_52_2.png)


    +   3. If you click the Network and Dial-Up Connections link in the right pane,
    the Network and Dial-Up Connections window appears.


    +   4. If you click the Network Identification link, your server''s identification
    tab appears.


    WINDOWS 2000 NETWORKING'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# USING ADD/REMOVE PROGRAMS


    A side from the Configure Your Server tool, another way to install networking
    components in Windows 2000 Server is to use Add/Remove Programs in Control Panel.
    The Add/Remove programs feature now enables you to configure Windows components
    as well. If you are adding or removing a lot of components, you may find this
    interface easier to use than the Configure Your Server interface. The Add/Remove
    Windows Components feature does not present you with a graphical interface and
    information about each component. A wizard appears that allows you to select what
    you want to install or uninstall. You can use either Add/Remove Windows Components
    or Configure Your Server. Both tools provide the same functionality—one is simply
    more graphical than the other. In fact, the Configure Your Server tool still launches
    the same type of interface as the Add/Remove Windows Components tools when you
    choose to install or uninstall a service. The Add/Remove Windows Components simply
    allows you to bypass the graphical interface in Configure Your Server.


    ![](img/763d5ae436311371600c0952a3da9094_53_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_53_1.png)


    Open Control Panel, and then double-click Add/Remove Programs.


    Click the Add/Remove Windows Components icon.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# TIPS


    # What can you do with Add/Remove Programs?


    You can use the Add/Remove Programs feature to change or remove existing programs
    on your server, add new programs, or add or remove Windows components. This single
    interface for all of these actions enables you to manage your system more effectively
    and easily. You can also learn more about the existing programs on your system
    and the amount of memory each of them uses.


    # Can I add or remove several Windows components at one time?


    Yes. You can add or remove Windows components at one time without having to walk
    back through the wizard for each instance. However, some components require you
    to complete various wizards and reboot your system, so adding or removing components
    one at a time may be best to avoid problems or confusion.


    ![](img/763d5ae436311371600c0952a3da9094_54_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_54_1.png)


    +   1.  The Windows Components Wizard begins.

    +   2.  Click Next to continue.

    +   3.  From the list that appears, select the component you want to add or remove.

    +   4.  Click Details.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# # USING ADD/REMOVE PROGRAMS

    ## CONTINUED


    Under each category of components to add or remove, you may see additional components
    to select. If the Details button is available for the component, click it to see
    exactly what components you can add or remove. The major components you can add
    or remove are:


    +   COM Internet Services Proxy enables Distributed Component Object Model (DCOM)
    to travel over HTTP through Internet Information Services (IIS)/o


    +   Domain Name System (DNS)—resolves fully qualified domain names to IP addresses
    (see Chapter 6).


    +   Dynamic Host Configuration Protocol (DHCP)—dynamically assigns IP addresses
    to network clients (see Chapter 4).


    +   Internet Authentication Service—enables authentication of dial-up users.


    +   QoS (Quality of Service) Control Service—enables you to specify the quality
    of network connections.


    +   Simple TCP/IP Services—installs simple TCP/IP services (such as Echo and Discard).


    +   Site Server ILS Services—scans TCP/IP stacks and updates directories with
    the most current user information.


    +   Windows Internet Naming Service (WINS)—resolves NetBIOS names for clients
    (see Chapter 5).


    ![](img/763d5ae436311371600c0952a3da9094_55_0.png)


    6 If you want to add a component, click the check box next to the component.


    7 If you want to remove an existing component, clear the check box next to it.


    8 When you are done, click OK.


    9 Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# TIPS


    # Can I both add new components and

    remove existing components at the same

    time?


    Yes. Simply check or clear the check box

    next to each component that you want to

    add or remove. If you check the check box,

    the component is added. If you clear the

    check box, the component is removed.


    # Will I need the Windows 2000 Server

    CD-ROM?


    Depending on the component you choose to

    add while using the Add/Remove Windows

    Components option, your system may need

    to copy files from the installation CD-ROM.

    Putting the CD-ROM into your drive before

    beginning any component addition is a

    good idea.


    # How do I know if I have enough disk space

    for an installation?


    The installation wizard provides the total

    disk space required for a component or

    service and the available space on your disk.

    Before installing a component, simply check

    the required space against your available

    disk space to determine if you have enough

    room on your hard disk.




    ![](img/763d5ae436311371600c0952a3da9094_56_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_56_1.png)


    Setup copies files and

    installs the component. The

    status bar indicates the level

    of completion.


    10 Click Finish to complete

    the configuration.


    Depending on the

    component, you may be

    prompted to reboot your

    computer.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# USING MY NETWORK PLACES


    My Network Places replaces Network Neighborhood in Windows 2000 Server. You will
    find that My Network Places offers more features and provides network users with
    a way to access the Active Directory. My Network Places allows you to configure
    network connections, such as local area connections, VPN connections, ISDN connections,
    or simply dial-up connections. All of this can be done with the Add Network Place
    Wizard. You can also use My Network Places to Browse the network and the Active
    Directory. In Windows NT and 9x, Network Neighborhood was primarily used for network
    browsing. In other words, you could find a particular server on your network that
    contained a particular resource. In Windows 2000, My Network Places is primarily
    used to configure different network connections. Due to the advanced features
    of the Active Directory, browsing is seldom necessary because the Active Directory
    contains resource pointers so you do not have to browse the network.


    ![](img/763d5ae436311371600c0952a3da9094_57_0.png)


    +   **ACCESSING MY NETWORK PLACES**

    +   1.  Double-click My Network Places on the desktop.


    +   2.  Double-click the Add Network Place icon to start the wizard.

    +   3.  Or you can double-click Entire Network to browse.


    +   **TOOLS MENU OPTIONS**

    +   4.  Choose the Tools menu, which enables you to map a network drive, disconnect
    a network drive, synchronize, or access folder options.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# TIPS


    How can I use My Network Places to find printers on my network?


    You can use the search feature to locate printers on your network. In My Network
    Places, double-click Entire Network, and then click the Search for Printers link
    in the left pane. This action opens the search window where you can type the name
    of the printer you would like to find.


    How can I map a network drive using My Network Places?


    A network drive connects your computer to another computer by assigning a drive
    letter. You can then use the connection as though the drive exists on your local
    computer. You can map a network drive by opening My Network Places, clicking the
    Tools Menu, and then clicking Map Network Drive. You are prompted to enter the
    location of the network drive, such as \\server\2\documents, and the drive letter
    you want to assign.


    ![](img/763d5ae436311371600c0952a3da9094_58_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_58_1.png)


    # ACCESSING THE ENTIRE NETWORK


    +   1 By double-clicking Entire Network, you can choose to search for printers,
    computers, people, or files. Click the Entire Contents link to view the entire
    contents of the network.


    # SEARCHING THE ENTIRE NETWORK


    +   1 Type the name of the object you want to search for.

    +   If you click one of the search links, this window appears.

    +   2 Click Search Now.

    +   The results for your search appear in the right-hand pane.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# **USING MY NETWORK PLACES CONTINUED**


    You can use My Network Places to browse the Active Directory or the domain(s)
    available.


    The Active Directory contains the OUs for the domain that you select and the objects
    within those OUs. Active Directory users can then browse the directory for the
    objects they need, such as users, groups, printers, folders, applications, and
    so forth. Take note that the Active Directory contains powerful search features,
    so user browsing is not the preferred method of finding Active Directory resources.
    In new Active Directory environments, users may need to be trained so they can
    effectively and quickly locate the Active Directory resources they need without
    having to browse the directory itself.


    You can also browse the domain. This feature is the same as in Network Neighborhood
    in Windows NT, where you can browse the various computers in the domain and the
    resources they offer. However, users can more easily find the resources they need
    through the Active Directory.


    ![](img/763d5ae436311371600c0952a3da9094_59_0.png)


    # **BROWSING THE NETWORK**


    +   1. Open Entire Network and then click the Entire Network link in the left-hand
    pane.

    +   2. Double-click Directory to make the available domains appear.

    +   3. Double-click the domain you want to view.


    > The contents of your network appear in the window.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# **TIPS**


    # Can users see everything about the Active Directory objects?


    Certain attributes of the objects held in OUs are available for network users
    to view. What users can view often depends on how the objects are defined in their
    Properties. For example, users can browse a list of other users and obtain general
    information about another user, such as e-mail address and phone number. You learn
    more about these features in later chapters.


    # Can network users find Active Directory resources without browsing?


    Yes. The Active Directory natively supports the LDAP protocol, which allows users
    to query the directory database. Through this powerful search feature, users can
    perform full text searches to find the resources desired. Browsing is provided
    for backwards compatibility and is not the preferred method of resource discovery.


    ![](img/763d5ae436311371600c0952a3da9094_60_0.png)


    The OUs for the Directory appear. You can then open each OU and browse its contents.


    ![](img/763d5ae436311371600c0952a3da9094_60_1.png)


    If you double-click Microsoft Network in the Entire Network window, you can then
    open the domain and browse the actual computers within the domain.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# ## ADDING A NETWORK PLACE


    A **network place** is a location on the network where you can store documents.
    This network place can be a shared folder on a computer, a Web folder on the Internet,
    or even an FTP site where documents can be stored.


    After you add the network place, it appears in the My Network Places folder.


    My Network Places makes it easy for you to add a network place by providing an
    Add Network Place wizard. The wizard enables you to enter the desired network
    place or browse your network to find the network place that you want to add. The
    Add Network Place feature is


    particularly helpful in environments that use Web and FTP servers for storage.
    You can use My Network Places to establish a connection to these locations that
    is reconnected each time you logon to the network. This way, the network place
    you configure is always available.


    ![](img/763d5ae436311371600c0952a3da9094_61_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_61_1.png)


    +   1. Open My Network Places and double-click Add Network Place.

    +   2. Type the location of the network place. You can use a UNC path or a URL.


    +   * The Add Network Place Wizard begins.


    +   3. Click Next to continue.


    +   * You can also use the Browse button to browse for the location.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '![](img/763d5ae436311371600c0952a3da9094_62_0.png)


    # Why would you use this interface to connect to a URL?


    One of the goals of Windows 2000 server is to provide seamless integration with
    the local network and the Internet. You can define a network place on the Internet
    or an intranet just as easily as on a local network computer by creating a network
    place. After you establish the network place, you can use the network place as
    though it resides on your local computer. If you use modem dial-up access, however,
    you need a dial-up connection each time you access the network place.


    # Why is the FTP Site option available?


    In environments where Web servers reside, network clients may be assigned a folder
    on an FTP server where they can store documents. You can use the Add Network Place
    Wizard to establish a network connection to an FTP site. Once you establish the
    network place, the connection is reestablished each time you log on to the network.
    This allows you to use the FTP connection as though the folder resides on your
    local hard drive.


    ![](img/763d5ae436311371600c0952a3da9094_62_1.png)


    ![](img/763d5ae436311371600c0952a3da9094_62_2.png)


    +   4 Type a name for the network place.


    +   5 Click Finish.


    If you are connecting to a Web folder, you may be prompted for the dialing information
    or username and password for the connection.'
  merge: -1
  img_proc: true
- pgno: 63
  md: "# # ESTABLISHING AND CONFIGURING\nCONNECTIONS\n\nWindows 2000 enables you to\
    \ configure various connections for your system. You can both establish new connections\
    \ and configure existing connections using the Network and Dial-up Connections\
    \ folder located in Control Panel.\n\nBy using the Make New Connection Wizard,\
    \ you can configure a variety of connections, such as dial-up to the Internet,\
    \ dial-up to a private network, VPN, or parallel port connection, or you can even\
    \ accept other connections.\n\nAfter you configure the desired connection(s),\
    \ the connections\n\nremain on your computer and you can use them to connect with\
    \ various servers. You can easily establish desired connections by using the Make\
    \ New Connection wizard. This Wizard enables you to configure a variety of connection\
    \ types, such as modem or ISDN, Virtual Private Network (VPN), serial, parallel,\
    \ and even infrared connections.\n\n![](img/763d5ae436311371600c0952a3da9094_63_0.png)\n\
    \n+   1. Open Control Panel, and\n+   then open Network and\n+   Dial-up Connections.\n\
    +   \n+   * The Network and Dial-up\n+   Connections window opens\n+   containing\
    \ your current\n+   connections and a wizard to\n+   make new connections.\n+\
    \   \n+   2. To create a new\n+   connection, double-click the\n+   Make New Connection\
    \ icon."
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Is there another way to access the Network and Dial-up Connections folder?


    Yes. Instead of using Control Panel, you can also right-click My Network Places
    and click Properties. This action also opens the Network and Dial-up Connections
    folder.


    # Can I use the connection wizard to create a PPTP connection?


    Yes. To create a "PPTP" connection, or Virtual Private Network (VPN), select this
    option on the selection screen in the wizard. The wizard then asks you questions
    to configure the VPN connection. A VPN connection uses the Internet to transmit
    data to a remote computer. This is accomplished by making local area network data
    appear as PPP data over the Internet. In most cases, the data transmitted over
    the Internet is encrypted.


    # What about local area connections?


    Local area network (LAN) connections automatically appear in the Network and Dial-up
    Connections folder if a Network Interface Card (NIC) is attached to your computer.
    You can right-click the Local Area Connection icon in the window and click Properties
    to configure it.


    ![](img/763d5ae436311371600c0952a3da9094_64_0.png)


    The Network Connection Wizard begins.


    Click Next to continue.


    ![](img/763d5ae436311371600c0952a3da9094_64_1.png)


    Select the type of connection you would like to make by clicking the appropriate
    radio button.


    Click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # ESTABLISHING AND CONFIGURING CONNECTIONS

    ## CONTINUED


    A fter you launch the Network Connection Wizard and select the type of connection
    you want to create, the wizard asks you to input additional information pertinent
    to the new connection. You may be asked to enter server names and username and
    password information for remote network connections.


    In Windows 2000, you can also share connections with other users. In most cases,
    the wizard asks you if you want to share the connection or not. If you choose
    not to share the connection, you can still share it later if you wish. This is
    a powerful feature of Windows 2000. For example, a small office can have one Windows
    2000 computer (server or Professional) configured with an


    ISDN adapter. This connection can then be shared so that other Windows 2000 computers
    in the office can use the ISDN connection. You can also share modem connections
    in the same manner.


    After you create connections, you can further configure them by accessing their
    Properties sheets.


    ![](img/763d5ae436311371600c0952a3da9094_65_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_65_1.png)


    +   5 Click the appropriate radio button to share or not share the new connection.


    +   7 Click Next to continue.


    +   8 Type a name for the connection.

    +   9 If you want a shortcut to be placed on the desktop, click this check box.


    +   10 Click Finish.

    +   - Depending on the type of connection you choose, you may see different dialog
    boxes.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# TIPS


    # Can I share a dial-up connection?


    Yes. You can share a dial-up connection, such as an Internet connection, so that
    other users can access your dial-up connection and use it. This feature is an
    easy way for a small office or home network to use one modem connection.


    # Can I create shortcuts to my connections?


    Yes. The final screen of the wizard gives you the option of creating a shortcut
    on your desktop. You can also create a shortcut to the connection by right-clicking
    the connection and selecting to create a shortcut.


    # Can I share my modem connection so that it dials on demand?


    Yes. When you configure your dial-up connection, simply click the Enable On-Demand
    Dialing button on the Internet Connection Sharing window. When you make this selection,
    the modem will automatically establish a dial-up connection when another user
    attempts to use the shared connection. Once the dial-up link is established, the
    user can use the connection just as though it were established on his or her computer.


    ![](img/763d5ae436311371600c0952a3da9094_66_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_66_1.png)


    +   After you establish the connection, you can further configure it by accessing
    its Properties sheet.


    +   In Network and Dial-up Connections, select the Local Area Connection, and
    then choose File® Properties.


    +   The Local Area Connection Properties sheet appears.


    +   Click Configure to configure your Network Interface Card.'
  merge: -1
  img_proc: true
- pgno: 67
  md: "# ESTABLISHING AND CONFIGURING CONNECTIONS CONTINUED\n\nYou can use the Properties\
    \ sheets for your local area connection to configure properties for your Network\
    \ Interface Card (NIC). One of the most important features available to you through\
    \ the Properties sheets is the Troubleshooter. If you are having problems with\
    \ the NIC, you can launch the Troubleshooter, which opens a section of Windows\
    \ 2000 help files so you can attempt to solve the problem.\n\nThe Advanced tab\
    \ allows you to adjust various properties for the NIC. For example, the line speed\
    \ property typically is available. You can use the Value drop-down menu to select\
    \ the type of line speed that is available to the NIC, such as TP Half Duplex,\
    \ TP Full Duplex, and so on.\n\nYou can also use the Properties sheets to learn\
    \ more about the NIC’s driver and update the driver if an update is available.\
    \ This tab makes it easy for you to update your NIC driver as changes become available\
    \ without having to uninstall and reinstall the NIC itself. Most hardware devices\
    \ in Windows 2000 contain the Update Driver option.\n\n![](img/763d5ae436311371600c0952a3da9094_67_0.png)\n\
    \n![](img/763d5ae436311371600c0952a3da9094_67_1.png)\n\n+   The Properties sheets\
    \ for the NIC appears. The General tab gives you the status of the device.\n+\
    \   \n+   13. Click the Device Usage drop-down box to either enable or disable\
    \ the device.\n+   \n+   14. Click Troubleshooter to launch the troubleshooting\
    \ help files if you are having problems with the device.\n\n+   The Troubleshooter\
    \ window appears. Use the troubleshooter to walk through a series of steps to\
    \ attempt to isolate the problem."
  merge: -1
  img_proc: true
- pgno: 68
  md: '![](img/763d5ae436311371600c0952a3da9094_68_0.png)


    # When should I use the Troubleshooter?


    Any time you have problems with your NIC, such as slow performance or an inability
    to connect, you can use the Troubleshooter. You select the problems you are having
    from a list and the Troubleshooter attempts to offer possible solutions to the
    problem.


    # I have a new NIC driver. What is the easiest way to update the driver?


    Access the Properties dialog box for the NIC and click the Driver tab. At the
    bottom of the window, click the Update Driver button. Follow the instructions
    to update the driver. Most hardware devices in Windows 2000 can be updated in
    this manner.


    # Do I need to manually configure the line speed for my NIC?


    In most cases, the line speed is automatically configured when the NIC is installed.
    The line speed is dependent on the NIC itself—in other words—you can not simply
    select the line speed you want. The NIC has to be able to support the selected
    speed. See your NICs documentation for more information about the line speed it
    can support.


    ![](img/763d5ae436311371600c0952a3da9094_68_1.png)


    The Advanced tab enables you to change various properties for the NIC.


    +   15 Click Driver Details.


    The Driver tab of the NIC Properties dialog box lists the driver that is currently
    in use for the NIC.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# ESTABLISHING AND CONFIGURING CONNECTIONS CONTINUED


    Finally, the Resources tab on the NIC Properties sheets tells what system resources
    are currently in use by the NIC. These settings will typically give you an Input/Output
    range and Interrupt Request number. A particularly helpful feature of this tab
    is the Conflicting Device List at the bottom of the window. This section reports
    any resource conflicts with other devices. For example, if another device was
    also configured to use IRQ 9, the conflict would appear in the list. Because Windows
    2000 is plug and play compliant, it does a good job of managing devices and the
    resources they use without intervention from the administrator or use.


    Aside from configuring setting for your NIC, you can access other Properties dialog
    boxes for the services that you have running. On the Local Area Connection Properties
    page, select any component that is installed, and then click the Properties button
    to further configure properties that are available for the component. The list
    includes both services and protocols that are currently available on your server.


    ![](img/763d5ae436311371600c0952a3da9094_69_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_69_1.png)


    +   - The Driver File Details window tells you more about the driver.

    +   - Click OK when you are done.

    +   - The Resources tab of the NIC Properties dialog box gives you the resource
    settings, such as the I/O Range and IRQ, for the NIC.

    +   - The Conflicting device list at the bottom of the window reports any resource
    conflicts with the device.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# TIPS


    How can I reduce the amount of memory used for file sharing?


    +   - To reduce or minimize the amount of memory used for file and printer sharing,
    select File and Printer Sharing for Microsoft Networks in the Local Area Connection
    Properties dialog box, and then click the Properties button. Click the Minimize
    memory used button and click OK.


    How can I change the configuration of TCP/IP?


    +   - You can access the Properties dialog box for any service or protocol from
    the Local Area Connection Properties page. Simply select Internet Protocol (TCP/IP),
    and then click Properties. The Properties dialog box appears and you can adjust
    the configuration as needed. Remember that TCP/IP settings should be planned carefully
    for each network server. Typically, all domain controllers should be issued a
    static IP address that does not change. Clients can be issued IP addresses by
    a DHCP Server.


    ![](img/763d5ae436311371600c0952a3da9094_70_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_70_1.png)


    12 Return to the Local Area Connection Properties dialog box and click File and
    Printer Sharing for Microsoft Networks.


    18 Click Properties.


    19 Adjust optimization settings, if desired, by clicking the appropriate radio
    button.


    The default setting of Maximize data throughput for file sharing provides the
    best performance for file sharing.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# INSTALLING OR REMOVING CLIENT, SERVICE, OR PROTOCOL FOR A NIC


    You can also use the Local Area Connections Properties dialog box to install or
    remove a client, service, or protocol. If you have used Windows 98, this interface
    will be familiar to you. To remove an item, simply select it and click the Remove
    button. To install a new item, click the Install button. This action


    prompts you to select a client, service, or protocol. After you make your selection,
    you are then provided a list of components that you can install. After you install
    a new item, you can access its Properties sheets by selecting the item and clicking
    the Properties button. This interface is useful


    because all protocols services, and clients for a particular NIC can configured
    in one location. Depending on the client, protocol, or service you decide to install,
    you may be prompted for you Windows 2000 Server CD-ROM so that files can be copied
    to your system.


    ![](img/763d5ae436311371600c0952a3da9094_71_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_71_1.png)


    +   1. Open the Local Area Connections Properties dialog box and click Install.

    +   2. Select either Client, Service, or Protocol.


    +   3. Click Add.


    +   4. In the list that appears, select what you want to install.


    +   5. Click OK.'
