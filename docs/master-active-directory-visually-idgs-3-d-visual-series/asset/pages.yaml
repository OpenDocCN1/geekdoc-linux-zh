- pgno: 235
  md: '# ## WINDOWS 2000 DOMAINS


    The word *domain* is used so often in Microsoft networking that IT professionals
    seldom give serious thought to the word. In Windows NT networks, multiple domains
    are very common and often quite necessary. In order to implement the Active Directory
    in the most effective manner, your thoughts and assumptions about domains need
    to change. One of Microsoft’s major goals with Windows 2000 networking is to reduce
    the number of domains that organizations use, which reduces cost and administrative
    overhead.


    A *domain*, by definition, is a logical grouping of computers and users that serves
    as a security boundary and administrative unit. The domain defines how resources
    are used within the domain and who can access those resources within the domain.
    Multiple domain organizations usually have different administrators in charge
    of each domain, and each domain usually has different security policies and rules.


    To plan your domain structure for a Windows 2000 and Active Directory environment,
    you need to carefully consider the difference between domains and organizational
    units (OU) in the Active Directory.


    # #### Domains versus organizational units


    Domains are logical groupings of computers and users for security and administrative
    purposes. *Organizational units* (OU) are administrative containers that follow
    your network or administrative model. By using OUs, you can develop a logical
    view of the groupings and resources


    within a domain. An OU is like a file folder in a filing cabinet. The folder itself
    does not have any functionality, but is designed to contain other objects. Active
    Directory OUs contain resources particular to that OU, or they can contain other
    OUs.


    You can learn all about planning your OU structure in Chapter 10. OUs are mentioned
    here because you should carefully consider your domain and OU structure before
    installing and implementing the Active Directory. If you have an existing network
    with multiple domains, you may want to consolidate some of those domains so that
    they are absorbed as OUs.


    Here is an example. Liner Toys has three domains: administration, sales, and marketing.
    The domains were established for administrative purposes, but after further consideration,
    there are no specific security requirements that need to segment each domain.
    After reviewing their network structure and needs, Liner Toys learned that they
    can consolidate all their domains into one domain with OUs for each division.
    Now, they have one domain that requires less cost and administration, but they
    can use the OUs to organize their business structure and Windows 2000 security
    to manage who can access what resources in each OU.


    Before implementing the Active Directory, take a close look at your existing domain
    structure and look for ways to consolidate your existing domains into one domain,
    or least reduce the number of domains that currently exist.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '![](img/763d5ae436311371600c0952a3da9094_236_0.png)


    However, if you have network groups that can be logically assembled and have different
    security needs, then the multiple domain model may be best for your organization.
    If you have a large group of computers and users that need to be controlled by
    different administrators and who, in terms of security, need different configuration
    than the rest of the network, then that group may need to be a domain. For example,
    a company has offices in Houston and Portland. Although the two offices can function
    as a single domain, the Portland office needs to have very tight security to protect
    certain internal resources. In fact, the Portland office does not even provide
    Internet access to users. The Houston office has much looser security and users
    need the use the Internet to perform their jobs. With these two different groups,
    two domains would be best because you can implement very different security policies
    that meet the needs of each office.


    # **Should I use a single domain?**


    For many network environments, the single domain model provides the service and
    performance desired. You can use the Active Directory to segment the domain according
    to your administrative model through OUs. The advantage to this model is lower
    cost in hardware (fewer domain controllers) and a lower cost in administrative
    upkeep and configuration.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# USING MULTIPLE ACTIVE DIRECTORY DOMAINS


    If you decide to use multiple Active Directory domains, then you need to understand
    the options you have and how the multiple domains interact with each other for
    resource access. You have three major options: the multiple-domain tree, multiple-tree
    forest, and multiple forests of trees.


    ![](img/763d5ae436311371600c0952a3da9094_237_0.png)


    # Multiple-domain tree


    The multiple-domain tree is established by installing the Active Directory in
    what becomes the Active Directory root domain. This domain is the top of the tree
    hierarchy. After you install the initial root domain, you then install the existing
    domains as child domains of the root or grandchild (which is a child of a child)
    domains of the root, and so forth. Only members of the Enterprise Admins Group
    can perform this process. With this structure, you create a hierarchy that contains
    a contiguous domain namespace.


    For example, Acme Graphics has three domains: Atlanta, Toronto, and New York.
    Their Atlanta domain is the first Active Directory domain, so it becomes the root
    domain named acmeographics.com. The existing domains become child domains.


    In the multiple-domain tree, all child domains get their names from the parent
    domain (root). Communication between the domains occurs through automatic transitive
    trusts. A trust relationship allows users to access resources in a different domain.
    The transitive trust feature allows each domain to trust the other'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'domains so that users can access resources (for which they have permissions)
    in any domain. A transitive trust is a *two-way trust*, which means that if Domain
    1 trusts Domain 2 and Domain 2 trusts Domain 3, then Domain 1 automatically trusts
    Domain 3. The trust relationships are established from the root domain so that
    all domains trust each other. For example, acmegraphics.com is the root domain
    and has transitive trust relationships with New York and Toronto. Even though
    New York and Toronto do not actually have a trust relationship established, they
    still indirectly trust each other through transitive trust.


    The Active Directory multiple-domain model is an effective solution that provides
    decentralized administration, domain-level security, domain-level policies, and
    ease of management. Also, the multiple-domain model provides lower replication
    traffic because only changes to the global catalog server need be replicated.
    Because of the transitive trust relationships, users can find any resource in
    any domain using an LDAP search.


    ![](img/763d5ae436311371600c0952a3da9094_238_0.png)'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# # USING MULTIPLE ACTIVE DIRECTORY DOMAINS CONTINUED


    ## Multiple-true forests


    A *forest* is a group of two or more Active Directory trees. The trees in the
    forest do not have contiguous namespaces, but are considered an overall hierarchy
    in which all names can be resolved. The trees in the forest are connected by two-way
    transitive trust relationships at the root domain of each tree. The trees share
    common configuration information, a global catalog, and a common schema. Connecting
    the two trees with a trust relationship creates the forest. Before they are connected,
    each tree is simply an individual Active Directory tree.


    A forest configuration is useful in environments that are made up of several subcompanies
    or divisions that need to maintain their own DNS names. The forest configuration
    is also useful for two organizations that need to share resources on a partnership
    basis. This configuration allows for communication between the two trees while
    keeping each entity separated. The global


    catalog is used to maintain a resource list of what is available in each tree
    so that users can access information in each tree. Because the trust relationship
    between trees is transitive, if Tree1 trusts Tree2 and Tree2 trusts Tree3, then
    Tree1 automatically trusts Tree3, and so forth.


    For example, Acme Graphics, Inc., has just acquired Bolton Graphics, Inc. Each
    company has implemented the Active Directory with the DNS names of acmgraphics.com
    and blgraphics.com, respectively. Rather than restructure Bolton Graphics, management
    would like to form a forest so that each company can maintain its own identity
    within the organization and on the Internet. To accomplish this, they establish
    a transitive trust relationship so that users in each tree can access resources
    in the other tree. Each company maintains its own identity and existing Active
    Directory Domain structure.


    # ## Forest


    ![](img/763d5ae436311371600c0952a3da9094_239_0.png)'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Multiple forests


    You can also connect multiple forests together; however, this is not a configuration
    you should plan for. Microsoft Active Directory enables you to configure multiple
    forests for connectivity and sharing of resources, but this solution is designed
    for temporary circumstances in which two different organizations need to connect
    together. A multiple forest configuration is most often used in situations in
    which one company works directly with another


    company on a project or joint business opportunity. The configuration for multiple
    forests can be difficult and complex to create and manage. This solution requires
    you to create explicit one-way trusts between different domains to provide resource
    access. Although multiple forests can be an effective temporary solution, you
    should never plan and implement a multiple forest solution. A single forest always
    works instead and is much easier to manage.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# UNDERSTANDING ORGANIZATIONAL UNITS (OU)


    You can consolidate your existing Windows NT domains into one domain, or at least
    fewer domains, while maintaining your security standards and administrative control
    by using organizational units (OUs). In order to implement the Active Directory
    appropriately in your network, you must understand the importance of OUs and how
    you should use them in your implementation. An OU is like a file folder in a file
    cabinet and does not have any functionality on its own. Its purpose is to hold
    other OUs, users, groups, printers, applications, shared files—any Active Directory
    resource.


    You can design your network administrative model by using OUs. The OU structure
    allows different administrators and differing security policies to exist in one
    domain because you can organize those divisions through the OU structure.


    ![](img/763d5ae436311371600c0952a3da9094_241_0.png)'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# # DEFINING AN OU STRUCTURE


    Designing an OU structure for your network is relatively easy, and as with most
    major network issues, planning is the key to a long-lived OU structure and one
    that is free of problems.


    Before planning your OU structure, you must learn one simple rule:


    Plan your OU structure based on your network administration model.


    The purpose of the OU structure is to organize and provide control to different
    network divisions or large groups. The OU structure allows your network administrators
    to effectively administer your network. A common mistake is to base the OU structure
    on the needs of users by planning the structure to make browsing easier. In other
    words, when a user browses the directory through My Network Places, they can see
    the OU structure in the domain(s).


    ![](img/763d5ae436311371600c0952a3da9094_242_0.png)


    But, the OU structure itself is only useful to administrators. Although users
    can see the OU structure, you should not design it with the goal of helping them
    find resources. The Active Directory contains powerful query capabilities that
    users can access to find resources. Querying, not browsing, is the preferred method
    for finding resources on the network. Therefore, set up the structure of the OU
    to mirror your IT administrative model.


    Before planning your OU structure, you should make certain you understand these
    points about OUs:


    +   - OUs can contain only resources within the domain. An OU cannot contain a
    resource from a subdomain or any other domain.

    +   - OUs are not a part of the DNS naming scheme.

    +   - OUs are designed to follow your IT administrative model.

    +   - OUs are not designed to make browsing easier for end users.

    +   - OUs are visible to users, but are not returned as answers to an LDAP query.

    +   - By default, members of the Domain Admins and Enterprise Admins groups have
    permissions to create and edit OUs.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# PLANNING AN OU STRUCTURE


    As with any planning process, the steps you should complete can sometimes be uncertain.
    However, planning an OU structure does not have to be a highly difficult task.
    When you complete your planning, your OU structure should accomplish the following
    goals:


    +   - The design should follow your IT administrative model.

    +   - The design should accommodate any upcoming IT changes.

    +   - The design should allow for future growth.

    +   - The design should be simple. Complex OU structures can become a headache
    and require more management time.


    +   - The design should be as static as possible. You don''t want to have to restructure
    your OU design every time a change comes along.

    +   - If you have multiple domains, the OU structure in each domain does not have
    to follow the other domains. In other words, the OU structure is used for administrative
    purposes and you can set it up however you like for each domain. However, most
    organizations find it easier to at least adhere to some standard organizational
    OU structure for each domain.


    In order to reach these goals, consider the following planning steps:


    +   1. Examine your current IT administration model. Explore possible changes
    that need to be made now due to organizational changes.

    +   2. Start at the top of the IT model—you don''t need a top-level OU for every
    single division or process on the model. (This issue is discussed in more detail
    later in the chapter.)

    +   3. Examine the new features of Windows 2000, such as Group Policy, that you
    may want to implement. How do these features affect your IT model?

    +   4. Create a test OU structure and examine it in a lab setting, if possible.


    # Understanding the OU hierarchy


    As with the Active Directory itself, you can build OUs in a hierarchical fashion
    by having top-level OUs, second-level OUs, and third-level OUs. This structure
    enables you to have a few top-level OUs. Then you can create other OUs inside
    the top-level OUs. This process is called nesting.


    Nesting is an important feature that allows you to further organize your network
    for administrative control.


    ![](img/763d5ae436311371600c0952a3da9094_243_0.png)'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'However, do not lose sight of this simple point: OUs are designed to be useful
    to administrators. The time to create a new OU occurs when you need to group Active
    Directory resources for administrative control. As you can imagine, if you are
    not careful, nesting can quickly get out of hand. Too many nested OUs can be difficult
    to manage, especially if you implement Group Policy. The general rule with nesting
    is that you want to provide the needed administrative control without creating
    a confusing and difficult structure to manage.


    Here are some other issues concerning nesting that you should keep in mind when
    planning your OU hierarchy:


    +   ▸ Each OU, including nested OUs, can be administered independently. However,
    by default, each nested OU inherits the properties of the parent OU.


    +   ▸ Group Policy (see Chapter 25) is applied from the domain root. A nested
    OU has at least two levels of logon policy that have to be applied, which can
    slow response time.


    +   ▸ Deeply nested OUs, or OUs that are several levels under the top-level OU,
    may have performance problems when users search for a resource residing in that
    deeply nested OU. With deeply nested OUs, the Active Directory query process has
    to wade through too many layers of OUs to find desired objects. Typically, three
    levels of nested OUs should be enough, and if you feel that you need more, re-examine
    your desired structure and look for ways you can consolidate some of the OUs.


    ![](img/763d5ae436311371600c0952a3da9094_244_0.png)'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# **Planning the structure**


    There are no correct or incorrect ways to plan the OU structure per se. The purpose
    is to mirror your IT administrative model so that different administrators can
    control the contents of each OU. You can change the OU structure as needed, but
    doing so is a time-consuming task and one you should avoid if at all possible.


    Begin your planning process with the top-level OU. Base your top-level OUs on
    something static, such as location or major division. Departments are often restructured
    and smaller groups change frequently, so begin at the top level with something
    unlikely to change. Many administrators use the names of sites or company offices
    in geographic locations for the top-level OUs.


    ![](img/763d5ae436311371600c0952a3da9094_245_0.png)'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Or some administrators use major company divisions to create the top-level
    OUs. Again, closely examine your overall IT administrative model and ask what
    makes the most sense for your organization. This model is effective if you have
    infrequent changes in the company divisions, but can cause problems if a lot of
    restructuring takes place.


    If your company has one domain and all offices or divisions are located in one
    geographic location, then you can base your top-level OUs on major company functions
    or divisions. This approach is also effective, but remember to base the top-level
    OUs on functions or divisions that are unlikely to change. A major restructuring
    can cause you to have to restructure all of your OUs. Remember, try to keep the
    top-level OUs as static as possible.


    ![](img/763d5ae436311371600c0952a3da9094_246_0.png)'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Next, when you are satisfied with your first level OUs, you should plan your
    nested OUs. Begin with second-level and work your way down as necessary. Remember,
    try to keep the OUs to a minimum and always ask the


    question “How does the OU benefit our administrative model” before creating it.
    Some models call for nested OUs to be created by office or divisions.


    ![](img/763d5ae436311371600c0952a3da9094_247_0.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'Some companies build the nested OUs based on administrators who have control
    over different resources. For example, one administrator may be in control of
    all users and groups for all OUs, or one administrator may be in control of a
    particular OU and all nested OUs in that OU.


    After you install the Active Directory, you create your OU structure, determine
    the administrator who will control each OU, and then add resources to the OU structure.
    You can learn how to perform these operations in Chapter 17.


    ![](img/763d5ae436311371600c0952a3da9094_248_0.png)'
  merge: -1
  img_proc: true
