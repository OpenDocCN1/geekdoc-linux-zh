    # Organizational unit


    An organizational unit (OU) is like a file folder in a file cabinet. The OU is
    designed to hold objects (or even other OUs). It contains attributes like an object,
    but it has no functionality on its own. As with a file folder, its purpose is
    to hold other objects. As the name implies, an OU helps you organize your directory
    structure. For example, you could have an accounting OU that contains other OUs,
    such as Accounts Payable and Accounts Receivable, and inside those OUs can reside
    objects, such as users, groups, computers, printers, and so forth.


    ![](img/763d5ae436311371600c0952a3da9094_31_2.png)


    *Objects are contained within organizational units.


    8'
