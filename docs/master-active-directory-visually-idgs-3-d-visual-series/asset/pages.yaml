- pgno: 73
  md: '# CHAPTER 3

    THE WINDOWS 2000 SERVER NETWORKING INTERFACE


    # CONFIGURING REMOTE NETWORK

    CONNECTION PROPERTIES


    Just as you can configure the Properties for a Local Area Connection, you can
    also configure various properties for remote network connections, such as dial-up
    connections or ISDN connections. You access the connection''s properties by right-clicking
    the connection in the Network and Dial-up Connections window and clicking Properties,
    or you can use the File menu.


    Depending on the connection you select, you have a number of properties sheets
    for remote connections. The General tab presents you with dial-up hardware you
    are using, such as a modem or ISDN adapter. You can click the Configure button
    to adjust the properties of the device itself. You also have the option of entering
    additional phone numbers that can be dialed for the connection and to use dialing
    rules. You can click the Rules button to configure the dialing rules you wish
    to use, such as local area code options or dialing long distance with a "1".


    ![](img/763d5ae436311371600c0952a3da9094_73_0.png)


