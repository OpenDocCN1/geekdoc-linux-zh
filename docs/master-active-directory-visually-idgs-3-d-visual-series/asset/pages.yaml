    ![](img/763d5ae436311371600c0952a3da9094_279_0.png)


    ![](img/763d5ae436311371600c0952a3da9094_279_1.png)


    ▪ The Customize View dialog box appears when you choose View\> Customize.


    +   2. Click on the appropriate check boxes to adjust the views that are available
