  可以在 [www.mythbuntu.org](http://www.mythbuntu.org) 找到 Mythbuntu。\n\n## Ubuntu Kylin\n\
  \n中国是 Ubuntu 社区增长最快的市场之一。为了满足这一市场的需求，中国 Ubuntu 社区开发了一个专门针对中国用户的 Ubuntu 版本，即 Ubuntu\
  \ Kylin（麒麟系统）。除了完全翻译成中文的界面外，该发行版还自带了许多中国用户习惯默认安装的应用。优化包括中文日历、获取中国源的天气应用，以及与流行的中文办公套件集成。该版本的首次正式发布是\
  \ 2013 年 4 月 25 日的 13.04。\n\n提示：Ubuntu Kylin 资源\nLaunchpad 团队：[`launchpad.net/~ubuntukylin-members`](https://launchpad.net/~ubuntukylin-members)\n\
  论坛：[www.ubuntukylin.com/ukylin/portal.php](http://www.ubuntukylin.com/ukylin/portal.php)\n\
  Wiki 页面：[`wiki.ubuntu.com/UbuntuKylin`](https://wiki.ubuntu.com/UbuntuKylin)\n\n\
  提示：Ubuntu Kylin\n可以在 [www.ubforylin.com](http://www.ubforylin.com) 找到 Ubuntu Kylin。\n\
  \n## Ubuntu GNOME\n\n随着 Unity 成为默认桌面，GNOME 社区发现自己没有专门为其桌面环境设计的 Ubuntu 发行版。2013 年\
  \ 4 月 25 日，团队发布了 Ubuntu GNOME 的第一个官方版本 13.04。该发行版寻求在发布时尽可能提供最新版本的 GNOME，并保持其与上游\
  \ GNOME 的“相对纯净性”，而不进行过多的定制。\n\n提示：Ubuntu GNOME 资源\nIRC：#ubuntu-gnome`\n邮件列表：[`lists.ubuntu.com/mailman/listinfo/ubuntu-gnome`](https://lists.ubuntu.com/mailman/listinfo/ubuntu-gnome)\n\
  Launchpad 项目：[`launchpad.net/ubuntu-gnome`](https://launchpad.net/ubuntu-gnome)\n\
  Wiki 页面：[`wiki.ubuntu.com/UbuntuGNOME`](https://wiki.ubuntu.com/UbuntuGNOME)\n\n\
  提示：Ubuntu GNOME\n可以在 [`ubuntugnome.org`](http://ubuntugnome.org) 找到 Ubuntu GNOME。\n\
  \n## 版本 (Editions)\n官方 Ubuntu 版本包括 Ubuntu 桌面版、服务器版和手机版。它们得到了 Canonical 的完全支持。\n\n\
  #### Ubuntu Server\n创建 Ubuntu Server 的目的是让 Ubuntu 在服务器上易于安装和使用。服务器版随 Ubuntu 5.04\
  \ 正式发布，最初侧重于确保高质量的服务器应用程序可以易于安装和配置，包括 `MySQL`、`Apache` 等。\n\n最近的工作涉及改进 Ubuntu Server\
  \ 的云计算能力。Ubuntu Server 的 Ubuntu Cloud 功能旨在为您提供使用 Ubuntu 构建自有云基础设施所需的所有工具和服务（图 9-8）。无论在何种环境下，Ubuntu\
  \ Server 的云功能都能帮助您构建云架构。\n\n![Image](img/00383.jpeg)\n\n**图 9-8 云 (Cloud)** 运维人员可以使用\
  \ Juju 来部署公共云服务。要了解更多信息，我们推荐 *The Official Ubuntu Server Book*，由 Prentice Hall 出版。\n\
  \n提示：Ubuntu Server Edition\nUbuntu Server Edition 可以在 [www.ubuntu.com/server](http://www.ubuntu.com/server)\
  \ 找到，[www.ubuntu.com/cloud](http://www.ubuntu.com/cloud) 以及 [juju.ubuntu.com](https://juju.ubuntu.com)\
  \ 提供了更多信息。\n\n### 其他发行版 (Other Distributions)\n某些发行版运行在 Ubuntu 社区之外，并且通常有自己的软件包仓库。它们可能不像\
  \ Ubuntu 同时发布。过去，许多此类衍生版是直接构建在其他发行版之上的，例如 Ubuntu 的基础 Debian。Ubuntu 开发者在创建发行版过程中做的更改被认为对具有自定义需求或想法的人是有益且用的。衍生发行版的列表增长迅速，随着发行版的出现和消失，该列表不断变动。在本书的第一版中，我们的列表几乎是完整的；从那以后，衍生发行版社区的规模不断扩大，使得在第八版中编制完整列表已不再可能。相反，我们通过一些最古老和最著名的衍生发行版示例，提供这种多样性的氛围，让您了解其范围。\n\
  \n### Ubuntu Phone\nUbuntu 版本的最新成员是专门为手机和平板电脑开发的 Ubuntu 版本，最初称为 Ubuntu Touch，现在称为\
  \ Ubuntu Phone（图 9-9）。开发者投入了大量精力开发该项目的默认应用，许多 Ubuntu 桌面应用也适用于手机。开发了一种专为小型触摸屏设备设计的创新界面。\n\
  \n![Image](img/00384.jpeg)\n\n**图 9-9 手机 (Phone)** 在编写时，它是 Ubuntu 桌面的独立项目，但随着 Unity\
  \ 8 开始引入 `Mir`团队希望桌面和 Touch 代码库能够更激进地融合。\n\n提示：Ubuntu Phone\nUbuntu Phone 的最新消息、进展和版本可以在\
  \ [www.ubuntu.com/phone](http://www.ubuntu.com/phone) 找到。\n\n\n\n\n\nGuadalinex\
  \ 最初于 2003 年发布，前两个版本基于 Debian。2005 年，Guadalinex 项目决定开发基于 Ubuntu 的第三版本。Guadalinex\
  \ 版本 3 于 2006 年 1 月基于 Ubuntu 5.10 发布，这使其成为第一个主要的 Ubuntu 衍生版本。该项目是政府某项计划的一部分，旨在将自由软件作为公立学校的默认选项。2006\
  \ 年初，该项目涉及 500 所学校和约 200,000 台仅配备 Guadalinex 和免费软件的桌面电脑。随着每年 9 月新课程的开始和新电脑的购买，这些数字每年都在增加（2006\
  \ 年新增约 40,000 台）。单这一举就让 Guadalinex 居于全球自由软件实施规模的首位。此外，该软件还用于公共互联网接入中心、老年中心、图书馆、妇女协会以及公民家庭。Guadalinex\
  \ 仅仅是许多由政府创建或与政府合作、用于学校和政府机构的 Ubuntu 衍生版示例之一。现在，它只是这些环境中大量 Ubuntu 部署中的众多案例之一。\n\n\
  提示：Guadalinex\n可以在 [www.guadalinex.org](http://www.guadalinex.org) 找到 Guadalinex。\n\
  \n## Linux Mint\n\n由于 Ubuntu 致力于尽可能地默认使用自由软件，因此它没有预装任何专源媒体解码器。这正是 Linux Mint 最初创建的原因。随着时间的推移，它发展出了社区，专注于创建一个易于使用、易于安装且外观良好的\
  \ Linux 桌面，并重点于让一切变得尽可能简单和愉快，特别是对于新手来说。该发行版完全兼容并使用 Ubuntu 的软件存储库。主要的区别在于外观和感受，以及默认安装软件的选择。Linux\
  \ Mint 还制作了一个基于 Debian 的版本。\n\n提示：Linux Mint\n可以在 linuxmint.com 找到 Linux Mint。\n\
  \n## 提示：更多衍生版本\n\n官方和受认可的衍生版本列表保存在 [www.ubuntu.com/about/about-ubuntu/derivatives](http://www.ubuntu.com/about/about-ubuntu/derivatives)\
  \ 中。更多的衍生版本列在 [`wiki.ubuntu.com/DerivativeTeam/Derivatives`](https://wiki.ubuntu.com/DerivativeTeam/Derivatives)\
  \ 中。\n\n## Launchpad\n\n正如我们在第 1 章 中提到的，Canonical 的大多数技术员工并不在 Ubuntu 上工作。相反，他们工作于基础设施。这些基础设施的大部分由大量服务组成，这些服务共同工作，提供构建\
  \ Ubuntu 的框架。这种相关应用程序的超结构统称为 Launchpad。虽然它有几个非 Web 的系统，但几乎完全可以通过 Web 访问。\n\n虽然 Launchpad（图\
  \ 9-10）主要用于开发 Ubuntu，但其开源 (`AGPLv3`) 基础设施的设计旨在对任何自由软件项目都有用，并且正变得越来越流行，现在有多个非 Ubuntu\
  \ 项目托管在 Launchpad 上。它旨在为这些项目提供必要的代码跟踪、错误跟踪和翻译跟踪软件，以便更方便、更强大地与他人协作，并开发自由开源软件。这些功能中的每一个（代码、错误和翻译跟踪）都是高度集成的，使其比具有类似目标的传统\
  \ Web 解决方案更具雄心，也可能强大得多。在早早期，Launchpad 网页对该项目的描述如下：\n\n```\n![Image](img/image00385.jpeg)\n\
  ```\n\n**图 9-10** Launchpad 中的 Ubuntu 项目\n\n一个为开源宇宙项目提供的服务集合。你可以注册你的项目，然后与开源社区就翻译、错误跟踪和代码进行协作。\n\
  \n尽管项目随着支持和规范模块的增加而扩展，该描述仍然有效。除了代码、错误和翻译跟踪外，Launchpad 还提供了处理代码的能力，不仅是在单个包或单个项目层面，而且在发行版层面。如果\
  \ Ubuntu 中的某件软件报告了错误，那么上游和下游项目都能看到。该项目可以跟踪软件随时间推移的演变，并一眼看出错误是否适用。开发者可以以类似的方式跟踪翻译。\n\
  \n理解 Launchpad 的最佳方法是看它的运行情况。本节将更深入地介绍 Launchpad 的各个组成部分。Ubuntu 的大部分基础设施都高度集成在 Launchpad\
  \ 中。如果你已经为报告错误或加入 Ubuntu 团队创建了账户，那么你已经有一个 Launchpad 账户了。\n\n提示：Launchpad\n可以在 [www.launchpad.net](http://www.launchpad.net)\
  \ 找到 Launchpad。\n\n## Soyuz\n\nSoyuz 是集成到 Launchpad 中的发行和存档管理软件。它处理 Ubuntu 在每种架构上的所有软件自动构建，并将成功构建的软件集成到存档中。Soyuz\
  \ 在俄语中意为“联盟”，是马克·卫星（Mark Shuttleworth）在太空旅行时乘坐 1 器的名称。\n\nSoyuz 几乎完全在后台运行。它于 2006\
  \ 年 2 月初首次激活，但对 Ubuntu 上传或下载软件的方式没有产生初始影响。Soyuz 做的是将软件构建并插入 Ubuntu 存档不同部分的过程整合。软件的构建无法使用\
  \ Launchpad Web 基础设施进行跟踪。\n\n提示：近期构建\nUbuntu 中近期构建的状态可以在 [`launchpad.net/distros/+builds`](https://launchpad.net/distros/+builds)\
  \ 找到。\n\n## Launchpad 翻译\n\nTranslations 是一个集成到 Launchpad 的 Web 翻译系统（图 9-11）。它是\
  \ Launchpad 第一个发布的组件。它以“罗塞塔石”命名，这是一种著名的带有三种文字相同文本的深灰色花岗岩，它破解了埃及象形文字。\n\n```\n![Image](img/image00386.jpeg)\n\
  ```\n\n**图 9-11** Launchpad 中的 Ubuntu 翻译\n\nRosetta 是 “PO` 文件编辑器的 Web 版本。换句话说，它提供了一种简单的机制，让翻译人员可以查看未翻译短语或字符串列表，然后将它们每一个翻译成自己的语言。目前，该系统仅适用于从英语的翻译。Rosetta\
  \ 的非 Web 前身包括 `Kbabel` 和 `Gtranslate`，它们可以在 Ubuntu 上下载并安装。通过将此功能放在 Web 上并将其集成到存档脚本中，Rosetta\
  \ 降低了翻译的门槛，增加了翻译进入发行版的机会。\n\nRosetta 包含了 Ubuntu 中每个应用程序的每个可翻译字符串。当新软件上传到 Ubuntu\
  \ 时，Rosetta 将检查是否有任何字符串发生了更改或添加。对以前翻译过的字符串的更改会导致该翻译被标记为“模糊”（fuzzy），直到翻译人员检查翻译和新字符串，进行任何必要的更改，然后将翻译标记为不再模糊。通过跟踪新字符串，Rosetta\
  \ 可以轻松地向翻译人员提示待翻译的新字符串，并提供特定应用程序或整个 Ubuntu 中已翻译成特定语言的字符串百分比统计数据。\n\n\n\n\n当用户翻译字符串时，他们会在系统中积累积极的“声望”（karma）——这一创新现在已部署到\
  \ Launchpad 的许多其他部分。用户还可以在本地化团队中协作（称为 l10n 团队，因为 `localization` 一词的首字母和最后一个字母之间有\
  \ 10 个字母）。Rosetta 为 Ubuntu 用户参与发行版提供了一种极佳的方式。任何认识英语和另一种语言的人都可以开始贡献。由于该系统已集成到 Launchpad\
  \ 中，用户无需再次提交翻译即可将其纳入 Ubuntu——该项目已经拥有了这些翻译。在 Rosetta 中提交并获得批准后，新的翻译将自动推送给使用相应语言的\
  \ Ubuntu 用户。\n\n**提示：翻译**\n\n可以在 [`translations.launchpad.net`](https://translations.launchpad.net)\
  \ 找到。\n\n### Launchpad Bugs（错误跟踪）\nLaunchpad Bugs（图 9-12）是一个基于 Web 的错误系统，类似于 Mozilla\
  \ 项目的 Bugzilla，某些用户可能对其并不熟悉。它提供了一个位置，让用户可以通过易于使用的软件（如 `Apport`）、命令行工具 `ubuntu-bug`\
  \ 或通过 Web 报告他们在 Ubuntu 软件中发现的错误。\n\n![Image](img/image00387.jpeg)\n\n**图 9-12**\
  \ Launchpad 中的 Ubuntu 错误\n\nLaunchpad Bugs 的第一个作用是提供一个用户提交错误的地方。不过，Launchpad Bugs\
  \ 不仅仅是收集投诉。它的工作是跟踪并记录错误从报告到关闭的全生命周期。错误可以分配给特定的开发者或重新分配。如果错误实际上是另一个应用程序的结果，则可以将错误重新分配给另一个包。可以根据严重程度对错误进行评分，或以任何有用的方式进行标记和分类。修复错误的信息、文件和补丁可以上传到\
  \ Launchpad Bugs。当错误解决后，可以将其关闭。错误报告提供了一个单一的场所，从错误提交者、错误修复者、必要时的上游维护者以及任何其他相关方那里收集信息。\n\
  \n当然，这些完全是你对任何实用的现代错误跟踪器的预期。Launchpad Bugs 旨在使其区别于竞争对手的，在于它与 Launchpad 的集成，以及通过单个错误报告跟踪多个软件的能力。首先，这意味着\
  \ Launchpad Bugs 的用户可以跟踪与特定补丁或特定代码段相关的错误状态。由于 Ubuntu 支持*每个*发布版本九个月，而某些版本（如 Ubuntu\
  \ 14.04 LTS）支持更久，因此 Ubuntu 能够跟踪哪些错误出现在哪些版本中至关重要。由于 Ubuntu 的衍生作品是在 Launchpad 中创建的，Launchpad\
  \ Bugs 还允许这些衍生作品使用 Launchpad Bugs 查看提交给 Ubuntu 其他发行版的错误是否适用于它们的代码，如果是，则可以快速获取修复方案。\n\
  \n与 Rosetta 一样，Launchpad 声望可以通过随着时间修复、报告和与错误交互来建立。涉及关闭不可复的错误和合并重复错误的错误分检（Bug triage）是用户积累声望的一种方式。当然，仅仅运行开发者版本并提交新错误也是积累良好声望的好方法。\n\
  \n**提示：错误**\n\n错误可以在 [`bugs.launchpad.net.Launchpad`](https://bugs.launchpad.net.Launchpad)\
  \ 找到。\n\n### Blueprint Tracker（蓝图跟踪器）\nLaunchpad Blueprint Tracker（图 9-13）或 Blueprints，是\
  \ Ubuntu 的自定义规范和特性跟踪系统。Blueprints 为用户创建规范页提供了一种方法，链接到现有的 Ubuntu wiki 中，用于他们希望在 Ubuntu\
  \ 中看到的特性。其他感兴趣的相关方可以使用 Blueprints 订阅他们感兴趣的规范或提案，以协作进行规范的开发并跟踪进度。随着时间的推移，在 wiki 和\
  \ Blueprints 中工作的用户通过一个过程帮助新想法实现，这个过程从“头脑风暴”（braindump——非常粗略的想法收集和头脑风暴）开始，到实现特性结束。在\
  \ Ubuntu 中，这一过程涉及 (1) 社区和信任成员的审查以及 (2) 决策者和 Ubuntu 技术委员会或相应的团队负责人和委员会的批准。Blueprint\
  \ 提供了支持这一过程的技术，并确保没有重要内容遗漏。\n\n![Image](img/image00388.jpeg)\n\n**图 9-13** Launchpad\
  \ 蓝图跟踪器\n\n特别是，Blueprints 帮助 Ubuntu 的领导和决策者确定特性和规范的优先级，并确保必要特性的工作正在进行，以按时发布。因此，Blueprint\
  \ 既被用作主要的规范跟踪器，也是 Ubuntu 主要发行管理工具。\n\n虽然 Blueprint 对技术规范非常有用，但它也大量用于开发和跟踪与社区相关的提案，以及从头脑风暴阶段到实现的阶段。Blueprint\
  \ 还具有围绕冲刺（sprints）和会议设计的功能，帮助组织会议并协调小组以提交规范。作为一个最后的冷知识，有趣的是，Blueprint 很大程度上是由 Ubuntu\
  \ 创始人兼金融家 Mark Shuttleworth 本人写的！\n\n**提示：蓝图**\n\nBlueprint 可以在 [`blueprints.launchpad.net`](https://blueprints.launchpad.net)\
  \ 找到。\n\n### Launchpad Answers（问答）\nLaunchpad Answers（图 9-14）是构建在 Launchpad 内部的一个技术支持跟踪器，用于系统托管的\
  \ Ubuntu 和其他自由软件项目。它允许社区成员提交支持请求，让其他社区成员帮助解决这些请求。与大多数其他系统不同，可以使用多种语言提问和回答。Launchpad\
  \ Answers 通过提供一个熟悉的工单系统并记录已回答的问题来补充 Ubuntu 其他社区支持形式，使用户可以轻松找到他人问过的问题答案。用户可以提交支持请求并与志愿者社区联系人通信，提供更多信息、讨论问题并注明他们的问题已解决。除了以可搜索的方式存储答案外，Launchpad\
  \ Answers 还通过与其他 Launchpad 功能集成，为支持请求提供上下文，显示相关错误、翻译、人员、团队以及 Launchpad 跟踪的各种版本之间的连接和背景。当然，可以通过与\
  \ Launchpad Answers 交互特别是回答问题来积累声望。\n\n![Image](img/image00389.jpeg)\n\n**图 9-14**\
  \ Launchpad Answers\n\n**提示：答案**\n\n答案可以在 [`answers.launchpad.net`](https://answers.launchpad.net)\
  \ 找到。\n\n### 其他功能\n除了刚刚讨论的 Launchpad 内可见旗舰产品外，Launchpad 还有许多其他用途。Launchpad 与 Ubuntu\
  \ One 集，持有用户名和其他对参与社区有价值的信息，包括 GNU Privacy Guard 加密密钥、联系信息等。更重要的是，Launchpad 包含了\
  \ Ubuntu 内每个团队和小组的表示，并处理整个 Ubuntu 世界的权限。例如，仅允许向 Ubuntu 上传核心包的人是 Launchpad 中 Ubuntu\
  \ 核心开发者团队的成员。\n\n### Bazaar\n\n\n\n\nBazaar (图 9-15) 是一个分布式版本控制系统。这到底意味着什么？首先，版本控制系统是一种跟踪程序源代码变化的程序。它会记录每一次具体的更改，例如添加了哪些新代码，以及是谁进行了这些更改。它还允许开发者回滚到之前的版本，或者创建一个分支（即一个独立的并行的代码版本）来尝试新想法，而不会强制将更改合并到主代码中。\n\
  \n![图像](img/image00390.jpeg)\n\n图 9-15：Bazaar Explorer（可以从 Ubuntu 软件中心安装）\n\n关于\
  \ Bazaar 的第二个关键点是它是分布式的，与流行的版本控制软件 Git 非常相似。传统的版本控制系统只有一个存储代码的地方，只有极少数人可以访问该地方并修改那里的代码。分布式版本控制系统的不同在于，它没有单一的代码存储地。开发者正在工作的每一个分支都被认为是平等的，并且它们之间相互获取代码。这个系统非常像巴集（Bazaar）中许多平等的商人——这也是其命名的由来。\n\
  \nBazaar 最初是 Arch 分布式版本控制系统的分支（fork）。（分支意味着开发者对程序的后续去向产生分歧，他们分成不同的小组以实现各自不同的目标。）然而，Bazaar\
  \ 2 经过了完全重写，因为人们发现当时的代码无法长期运行。\n\n***\n\n提示：Bazaar\n\n可以在 [`bazaar.canonical.com`](http://bazaar.canonical.com)\
  \ 找到 Bazaar。\n\n***\n\n### Ubuntu One\n\nUbuntu One 是一项单点登录和支付服务。Ubuntu One 账户用于处理整个\
  \ Ubuntu 社区服务的身份验证，包括 wiki 和 Launchpad。\n\n### 总结\n\n除了构建一个许多人使用的优秀操作系统外，Ubuntu\
  \ 项目还开发了一种操作系统，供构建其他操作系统的人以此为基础进行开发。这以内部合作伙伴项目和外部派生发行版的形式存在。这些项目共同跨越了语言、大陆和市场。此外，Ubuntu\
  \ 与 Canonical 的其他项目紧密相关：Launchpad 和 Bazaar。Bazaar 提供了一个极具吸引的版本控制系统，而 Launchpad 提供了一个处理漏洞、翻译等许多功能的一站式平台。\n\
  \n# 第 10 章 Ubuntu 社区\n\n![图像](img/image00260.jpeg) 场所\n\n![图像](img/image00260.jpeg)\
  \ 团队、流程与社区治理\n\n![图像](img/image00260.jpeg) 参与\n\n![图像](img/image00260.jpeg) 总结\n\
  \n*社区*（Community）是讨论 Ubuntu 时经常使用的一个词。早期关于 Ubuntu 的文章带有副标题，问道：“想要在这个系统里再带点社区吗？”该项目最早的新闻稿和公告强调了操作系统的开发和分发采用“社区驱动的方法”。事实上，Ubuntu\
  \ 最高级别的治理委员会被称为社区委员会（Community Council）和 Canonical 有限公司；它雇佣了一支全职社区团队，该团队由 Jono Bacon\
  \ 领导，他是本书早期版本的作者之一。正为了实现这一目标，我们做出了一个非常自觉的决定，用书中的整一章来描述 Ubuntu 社区。事实上，每一个版本都致力于介绍\
  \ Ubuntu 社区！\n\n尽管如此，虽然 Ubuntu 社区很重要，但并不总是容易简洁地描述它。Ubuntu 在很大程度上是由 Canonical 开发和资助的。根据定义，社区的范围远超\
  \ Canonical。Ubuntu 项目拥有成员和自封的活动分子，但 Ubuntu 社区甚至超过了那些具有明确声明关系的人。该项目包含了多种参与场所。但虽然社区在这些每个领域都是活跃的，但它的范围更广。\n\
  \nUbuntu 社区是由以上无数方式、在无数场所构建、推广、分发、支持、记录、翻译和倡导 Ubuntu 的个人集合。Ubuntu 社区中的大多数人从未见过、交谈过或听过彼此。社区成员通过他们的贡献（包括技术和非技术性的）以及\
  \ Ubuntu 本身联系在一起。这些贡献将 Ubuntu 建设成一个发行版、一场社会运动、一套支持基础设施以及一个项目。简而言之，他们将 Ubuntu 造成了一个社区。虽然任何活跃的软件开发项目都有许多人做出贡献，但并不是每个项目都有一个社区。\n\
  \n*社区*也是一个代表 Ubuntu 项目保持包容性承诺的术语。对社区社区意味着志愿者不仅受到欢迎，而且至关重要。这意味着 Ubuntu 是一个个人可以聚集在一起创造出大于部分总和之物的“地方”。“社区”这个词承认了一个事实：尽管许多开发工作由\
  \ Canonical 资助，尽管某些人比其他人为 Ubuntu 投入了更多的时间、精力、代码、翻译、文档或倡导工作，但没有任何个人或小组可以对 Ubuntu\
  \ 变成的一切独揽功劳。在 Ubuntu 中，没有哪种贡献是可以抛弃的。拥有社区也反映了 Ubuntu 为这些贡献提供低准入门槛的目标。任何关心 Ubuntu\
  \ 的人都可以项目做出贡献，并能以最合适的方式成为 Ubuntu 社区的参与者。\n\n本章提供了 Ubuntu 社区活跃的场所和流程的概览。首先，它游览了社区获取和传递信息的场所。接着查看了社区的组织方式及其运作流程。最后，它介绍了你可以如何参与\
  \ Ubuntu 社区并为其成功贡献。\n\n### 场所\n\n正如我们在第 1 章中所述的，透明和公开的是 Ubuntu 项目的早期目标。技术和社区决策是公开的，并对所有利益方开放。当这不可行时（例如，由于面对面会议无法让所有相关者都参加），社区尝试发布摘要和记录，并提供反馈渠道。Ubuntu\
  \ 社区不包含“仅限成员”、“仅限开发者”或“仅限决策者”的后台，除非是为了保护个人隐私或安全——Ubuntu 社区拒绝创建此类通道。Ubuntu 的所有工作发生在所有人都可以查看的地方，任何同意建设性且尊重他人的人都可以参与。\n\
  \n当然，这种活动本节尝试尽可能完整地记录 Ubuntu 的通信场所。它描述了进行开发、支持和倡导讨论的地点。虽然没有人能参与所有描述的场所，但了解存在什么可以让参与者在选择合适的地点提问或提建议时更有见地。\n\
  \n#### 邮件列表\n\nUbuntu 通信最重要的单一场所是 Ubuntu 邮件列表。这些列表提供了发布所有重要公告和进行开发讨论的空间。在本书期间，有\
  \ 300 多个公共邮件列表。这个数字正在不断增长。然而，Ubuntu 社区委员会付出了巨大的努力，确保随着社区持续增长，该列表保持更新。\n\n\n\n\n\n\
  关于 Ubuntu 邮件列表的最新完整页面可以在 [`lists.ubuntu.com`](https://lists.ubuntu.com) 找到，用户可以在那里查看可用邮件列表列表、查看存档讨论，并通过\
  \ Web 界面订阅列表。\n\n邮件列表是电子邮件最古老的通信形式之一。邮件列表提供单一的电子邮件地址，当向该地址发送邮件时，它会将收到的消息转发给许多人。在\
  \ Ubuntu 中，列表是按主题划分的，如果个人想接收列表主题的信息，可以订阅相应的邮件列表。Ubuntu 的所有邮件列表都托管在 [`lists.ubuntu.com`](http://lists.ubuntu.com)。\n\
  \n除极少数情况外（例如，社区委员会的邮件列表），`anybody` 都可以订阅任何 Ubuntu 列表。在大多数情况下，向列表发送电子邮件的权限被限于列表成员（当然，列表成员身份对任何人开放）。这意味着所有从非列表成员发送到列表的邮件都将被放入队列，在广播给列表成员之前，由人工审核员进行审核。这是一种反垃圾邮件的防范措施。用户可以订阅列表，然后配置系统从不发送电子邮件。对于某些邮件列表，`all`\
  \ 消息都会经过审核。这在很大程度上确保列表保持“低容量”或“仅限公告”。\n\nUbuntu 的邮件列表由流行的 Mailman 软件运行，某些用户可能对它很熟悉。Mailman\
  \ 使订阅列表、取消订阅以及配置任意数量的邮件递送选项变得简单。一个受欢迎的选项是接收每日消息摘要，而不是每次发送新消息时都接收一封独立的电子邮件。这些功能可以通过\
  \ [`lists.ubuntu.com`](https://lists.ubuntu.com) 的 Web 界面实现。用户还可以通过发送主题行包含“subscribe”字样的邮件到\
  \ `<mailing list name>*-REQUEST@lists.ubuntu.com` 来订阅列表。\n\n虽然每个列表在 Ubuntu 社区中都起着重要作用，但以下核心列表值得更详细的介绍。你可能会发现订阅这些列表是一个好主意。\n\
  \n### ubuntu-announce\n\n这是一个完全审核的列表，转发 Ubuntu 项目的所有重要公告，通常每周少于一封邮件。它是 `the` 发布新版本的地方，也是第一个找到其他重要信息的地方。如果你使用\
  \ Ubuntu，可能考虑订阅此列表。如果你只订阅一个列表，那应该是这一个。\n\n### community-announce\n\n这是一个完全审核的列表，提供普通社区可能认为有价值的公告。公告可能包括下一次\
  \ Ubuntu 开发者峰会举行的时间以及如何参与，或即将举行的社区选举详情，例如 Ubuntu 社区委员会的选举。阅读此列表不需要技术专业知识，建议你订阅以跟踪社区的活动动态。\n\
  \n### ubuntu-devel-announce\n\n这是一个完全审核的列表，包含与 Ubuntu 开发相关的公告。它的邮件量较低，每周包含一到三封邮件。如果你在\
  \ Ubuntu 中处理代码、使用开发发行版，或在任何技术层面上做出贡献，你就应该在这个列表上。这是所有参与 Ubuntu 开发的人员都被预期会阅读的列表。\n\
  \n### ubuntu-devel-discuss\n\n该列表是用于 Ubuntu 开发通用讨论的主要开放列表。如果你正寻求以任何技术方式为 Ubuntu\
  \ 做出贡献，你应该订阅此列表并开始关注讨论。该列表的邮件量相对较大。\n\n### ubuntu-devel\n\n该列表是用于讨论 Ubuntu 的审核列表。虽然订阅仍然免费，但向列表发布帖子被限制为\
  \ Ubuntu 开发者或选定的其他开发者。其他人也可以发布，但所有帖子都将经过审核团队的检查。\n\n#### 网上实时聊天 (IRC)\n\n虽然邮件列表提供了异步通信（即不同时进行）的主要场所，但对同步或实时协作仍有重要需求。网上实时聊天\
  \ (IRC) 填补了这一空白。虽然它主要设计用于频道中的小组（即多对多）通信，但它也配备了私信功能，便于一对一通信——且全都是瞬时的。IRC 与即时消息或聊天室通信非常相似。虽然时差和全球使得全球\
  \ Ubuntu 社区难以在同一时间聚集，但许多用户和开发者利用 IRC 的功能，让任何人实时讨论问题或提问并立即获得回答。\n\n与邮件列表一样，IRC 频道为\
  \ Ubuntu 中许多不同子社区的许多不同类型的通信提供了场所。有很多不同的频道，包括各种语言的频道。\n\n所有官方 Ubuntu IRC 频道都位于 freenode\
  \ IRC 网络上，该网络还托管了一系列其他自由开源软件项目。用户可以使用 Ubuntu 中的几个软件连接到 IRC，包括 Empathy、Xchat-gnome\
  \ (Figure 10-1)、Irssi，并且对于不想在机器上使用本地应用程序进行 IRC 但想偶尔加入频道的用户，提供了一个 freenode Web 聊天客户端\
  \ (Figure 10-2)。如 `ubuntu-users@lists.ubuntu.com` 等邮件列表将帮助用户找到正确的帮助和支持；`#ubuntu`\
  \ 设计用于帮助和支持。在加入任何频道时，用户应仔细阅读主题，因为那里回答了许多常见问题，而且频道的审核员可能会被询问审核员已经回答过的问题的用户困扰。\n\n\
  ![Image](img/00391.jpeg)\n\n**图 10-1** Xchat-gnome 是允许 Ubuntu 用户连接到 IRC 频道的 IRC\
  \ 客户端。\n\n![Image](img/00392.jpeg)\n\n**图 10-2** freenode 聊天客户端的登录界面以及 freenode.net\
  \ 上 #ubuntu-community-team IRC 的视图。目前，`#ubuntu` 频道通常是 freenode 上最大的频道，大多数时候有超过 1,500\
  \ 名同时用户，并且在持续增长——特别是在发布版期间。另一个重要频道是 `#ubuntu-devel`，专门用于讨论 Ubuntu 开发。对开发发行版的支持已移动到\
  \ `#ubuntu+1`。维护具有特定目的频道允许支持社区保持专注并帮助尽可能多的人。频道列表可以在 [`wiki.ubuntu.com/IRC/ChannelList`](https://wiki.ubuntu.com/IRC/ChannelList)\
  \ 找到。\n\n#### Web 论坛\n\n官方 Ubuntu 论坛是 Ubuntu 中最频繁使用的通信场所。出于许多原因，许多用户倾向于通过基于 Web\
  \ 的论坛或公告板而非邮件列表进行通信。Ubuntu 论坛是为了满足这一群体而创建的并取得了巨大的成功。\n\n论坛可以在 [`ubuntuforums.org`](http://ubuntuforums.org)\
  \ 在线访问，并显示出惊人的使用量。论坛拥有超过 200 万注册用户，任何时候大约有 10,000 人在线。论坛讨论的话题涵盖了以下类别：\n\n![Image](img/00259.jpeg)\n\
  \n**支持讨论**，包括关于特定硬件（例如预装 Ubuntu 的电脑，以及网络和多媒体卡）和特定用例（例如桌面或服务器用户）的问题空间。\n\n![Image](img/00259.jpeg)\n\
  \n**Ubuntu 社区讨论**，包括致力于 Ubuntu 艺术的人士、科学和教育领域工作的人士以及开发新文档和教程的人士的讨论空间。\n\n\n\n\n\n\
  ![Image](img/image00259.jpeg) 针对论坛的社区讨论空间，包括多个社交空间以及用于行政和社区治理讨论的场所\n\n通过涵盖这些领域，Ubuntu\
  \ 论坛提供了一个令人印象深刻的支持资源。它们为提问和回答问题提供了极佳的场所，也为获取支持和向 Ubuntu 社区做出重要贡献提供了平台。如果你对其中任何内容感兴趣，论坛是一个很好的起点。\n\
  \n关于论坛唯一值得提及的说明是，开发 Ubuntu 的人员并不经常频繁使用它们——尽管这一规则也有例外。如果用户想参与对项目的技术贡献，他们很可能需要通过使用邮件列表或\
  \ `Launchpad` 来补充他们对论坛的使用。\n\n论坛由志愿者创立，并完全由志愿者进行审核和维护，其运作由 `Forums Council`（论坛委员会，将在本章节稍后部分讨论）管辖。\n\
  \n### Wikis（维基百科）\n\n几乎从第一天起，大部分 Ubuntu 文档和支持工作都在官方的 Ubuntu `wiki` 中进行。如果你还不了解，`wiki`（发音为“wik-ee”）是指任何查看者都可以添加、删除或编辑内容的网站。\n\
  \n有多个 Ubuntu 维基，但其中两个对社区至关重要。第一个位于 [`help.ubuntu.com/community`](https://help.ubuntu.com/community)\
  \ 的 `Community Help wiki`（图 10-3）。它由 `Ubuntu Documentation Team` 编辑和指导，专注于 Ubuntu\
  \ 社区产出的技术文档问题。第二个维基位于 [`wiki.ubuntu.com`](https://wiki.ubuntu.com)，用于处理其他所有内容。`Community\
  \ Help wiki` 可以被视为一个通过社区贡献和编辑构建庞大手册的项目。通用维基则用于规范编写、流量分发、会议组织、聚会、参与 Ubuntu 的团队和个体的页面，以及任何其他与\
  \ Ubuntu 社区相关的书面形式的内容。这两个维基都可以由社区中任何创建账户的成员进行编辑、添加内容或重新组织，且编辑权限是完全无限制的。由于需要注册，每次更改都可以追溯到特定的用户。\n\
  \n![Image](img/image00393.jpeg)\n\n**图 10-3** Ubuntu 社区支持和文档维基的首页\n\n与随 Ubuntu 附带的其他文档不同，任何人都可以修复维基中的错误、不准确之处或过时事实。因此，没有可靠的方法可以确定维基中的信息是否正确。它无法进行像本书这样的文档那类类型的质量保证工作流。然而，在每六个月发布一个新版本的\
  \ Ubuntu 开发快速变化的世界中，它更有可能保持更新。维基为这种水平的实时信息提供了一个低门槛的平台，因此它成为社区中无足珍贵的资源。\n\n两个主要的维基都运行\
  \ `MoinMoin` 维基软件，维基的使用和操作方式是相同的。此外，如果你需要英语以外语言的信息和支持资源，[www.ubuntu.com/support/community/local-language](http://www.ubuntu.com/support/community/local-language)\
  \ 上的综合列表提供了指向维基内包含非英语语言文档和信息的页面链接，以及指向其他十多个完全使用另一种语言的维基的链接。建议寻找非英语维基页面的用户访问此页面，因为许多基于语言的团队运行着自己的维基或其他相关资源。\n\
  \n### The Fridge（冰箱）\n\n`Fridge` ([`fridge.ubuntu.com`](https://fridge.ubuntu.com))\
  \ 是 Ubuntu 一个风格奇特的社区门户网站。在许多西方文化中，冰箱在家庭中提供了一种中心化的“公告板”。因为冰箱具有磁性，孩子和父母可以使用磁铁贴上纸条，与接触到这台冰箱的人们分享这些内容。对于孩子们来说，这通常包括好成绩、新闻报道或其他让他们感到自豪或想分享的信息。`Fridge`\
  \ 试图在 Ubuntu 社区内部创建这样一种共享资源。`Fridge` 首页如图 10-4 所示。\n\n![Image](img/image00394.jpeg)\n\
  \n**图 10-4** Fridge 首页\n\n`Fridge` 最的描述或许是 Ubuntu 的社区门户。它既是部分新闻网站，也是部分草根营销和倡导网站。它托管了新闻、采访、带有近期活动列表的日历、投票等内容。网站的核心内容以博客（Weblog）的形式排列。用户经常将\
  \ `Fridge` 设置为主页，或通过其 `RSS` 馈订阅该网站。`Fridge` 在社区中是独特的，因为它吸引了各种 Ubuntu 参与者——开发者、倡导者、翻译人员、用户——并提供了一个每个小组都能与他人分享信息的平台。`Fridge`\
  \ 上每两到三天就会有一个故事，尽管随着时间的推移，这可能会增加到每天几个。用户可以在 `Fridge` 的评论区对每个故事进行评论和讨论。\n\n任何人都可以为\
  \ `Fridge` 贡献内容。如果你想做出贡献，可以将对功能、文章的建议，甚至一件原创作品（如文章、照片或活动评论）发送至 editor.ubuntu.news@ubuntu.com，或者通过\
  \ [`wiki.ubuntu.com/Fridge/Submit`](https://wiki.ubuntu.com/Fridge/Submit) 上建议的任何方式进行。\n\
  \n### AskUbuntu.com\n\n位于 [`askubuntu.com`](http://askubuntu.com) 的 Ask Ubuntu 是一个社区驱动的问答网站，旨在让用户轻松获取\
  \ Ubuntu 相关问题的答案。它也是用户分享 Ubuntu 平台知识的地方。该网站专注于由社区投票并由网站其他成员评审的答案，这可以保持信息的实时性和话题性。\n\
  \nAsk Ubuntu 网站允许用户提问和回答问题，并通过成员身份和积极参与，以维基的方式对问题和答案进行赞成或反对。`Stack Overflow` 用户可以获得声望值和勋章；例如，答案获得“赞成”票的人将获得\
  \ 10 点声望，并根据其实贡献获得勋章。所有用户生成的内容均遵循知识共享许可。\n\n从这里用户可以访问回答或提问，也可以搜索并查看所有已提的问题。用户无需注册登录即可访问网站。对于希望注册的用户，有多种方法可以实现。如果你拥有\
  \ `Google`、`Yahoo!`、`myOpenID`、`Facebook`、Ubuntu 账户、`AOL` 或 `OpenID` 账户可以将这些账户关联到你的\
  \ AskUbuntu 账户。\n\n有关 AskUbuntu 的更多信息可以访问 [`askubuntu.com`](http://askubuntu.com)。\n\
  \n### Ubuntu Discourse\n\nUbuntu Discourse ([`discourse.ubuntu.com/`](http://discourse.ubuntu.com/))\
  \ 是 Ubuntu 社区的“饮水机”。\n\n#### 社交媒体\n\n\n\n\n\nFacebook、Twitter 和 Google+ 等社交媒体网站也用于向社区传播信息。\n\
  \nFacebook: [`facebook.com/ubuntulinux`](http://facebook.com/ubuntulinux)\n\nTwitter:\
  \ [`twitter.com/ubuntu`](http://twitter.com/ubuntu)\n\nGoogle+: [`google.com/+Ubuntu`](https://google.com/+Ubuntu)\n\
  \n### 开发者峰会、冲刺活动和集会\n\n自 Ubuntu 首次发布以来，Canonical 组织并资助了多次公开的开发者峰会、冲刺活动和集会。亮点包括：\n\
  \n![Image](img/image00259.jpeg) 2004 年 12 月在西班牙加泰罗尼亚的马塔罗举办的 Mataró 会议——首届 Ubuntu\
  \ 开发者峰会\n\n![Image](img/image00259.jpeg) 2005 年举行的两个命名 Ubuntu 会议：4 月在澳大利亚悉尼的 Ubuntu\
  \ Down Under 和 11 月在加拿大蒙特利尔的 Ubuntu Below Zero\n\n![Image](img/image00259.jpeg)\
  \ 2006 年 11 月在加利福尼亚州山景城的 Google 总部举办的 Ubuntu 开发者峰会\n\n![Image](img/image00259.jpeg)\
  \ 2012 年 10 月在丹麦哥本哈根的 Ubuntu 开发者峰会-R\n\n随着社区的增长，这些完全针对 Ubuntu 的活动越来越让所有人线下参与变得困难。2013\
  \ 年，Ubuntu 开发者峰会转变为通过视频聊天的在线活动。\n\n通过 Canonical，Ubuntu 尝试组织开发者峰会使其每个版本举办两次。通常，第一次在发布周期的最开始阶段，以便对即将发布的版本规范和目标进行讨论、辩论并决定。随后在周期中期举行第二次\
  \ `UDS`，以便在发布前根据需要对任务进行审查并调整计划。\n\n虽然每次的格式略有不同，但这些会议的时长从三天到两周不等。\n\n在开发者峰会上，与会者会描述他们希望在下一个\
  \ Ubuntu 版本中看到的功能。在安排的时间或一系列会议中，一小部分感兴趣的社区贡献者和开发者将起草一份书面规范。这一起草过程涉及脑力风暴，并形成一份正式的、经批准的规范，描述问题或需求，并提供关于如何修复或实现的详细说明。虽然这些规范通常具有技术性，但它们也被用于描述可能涉及本地化、文档或社区建设的目标。例如，`The\
  \ Fridge` 和每次峰会的规划都是从一份规范开始的。随着时间的推移，这些规范根据即将发布的版本的优先级进行分类。随后，个人将认领或被分配这些规范中的某些。每份规范都会作为\
  \ `Launchpad` 上的蓝图进行编写和改进，以便无法参加峰会的 Ubuntu 开发者和贡献者仍然能够参与。\n\n这些峰会还会解决社区内部的问题。例如，许多\
  \ Ubuntu 领导者参与其中，讨论如何不仅帮助提升自己的领导能力，还能帮助提升 Ubuntu 社区。\n\n除了每年举办四次的这些峰会外，Canonical\
  \ 每年还会组织多次线下冲刺活动/集会。这些冲刺活动/集会通常是为期一到三周的密集地点工作会议，涉及一个承担了明确目标的团队或子团队。它们为团队成员提供了时间，让他们编写代码、编写文档、制定计划或完成实现该目标所需的任何工作。冲刺活动的规模通常较小，人数少于\
  \ 100 人，而集会通常可以包含 100 多人；但两者都试图在短时间内完成大量工作，并因精疲力竭、充实自我、效率惊人且有趣的体验而闻名。这些冲刺活动/集会是工作会议，通常限于一组\
  \ Canonical 员工；但偶尔，它们也可能包括志愿者与会者。\n\n### 用户会议\n\n开发者峰会和冲刺活动是有效的，但主要令技术思维的人士或已经积极参与\
  \ Ubuntu 社区的个人感兴趣。它们的目标是通过现有团队之间的高带宽交互完成工作。用户会议则尝试为尚未积极参与社区的用户提供一个替代空间。这些会议试图让人们熟悉\
  \ Ubuntu，并为社区建设、支持和人际网络提供空间。\n\n虽然许多本地社区团队有定期会议和自己的 Ubuntu 活动，但到目前为止已经举办了多次更大规模的\
  \ Ubuntu 用户会议，目前正在计划另外几场。这些会议分为两大类。第一类是一系列被称为 `Ubucons`（Ubuntu Conferences 的缩写）的会议。`Ubucons`\
  \ 已举办过多次——前两次在山景城和纽约的 Google 总部，其他的则设计与许多其他 Ubuntu 用户参加的规模得得 Linux 世界大会同步举行。`Ubucons`\
  \ 由约 100 名用户和少数开发者参加，为用户彼此之间建立联系提供了一种简单的方法。此外，一些 `Ubucons` 为“安装节”（installfests）提供了空间，用户可以带着电脑，让其他\
  \ Ubuntu 用户、开发者和爱好者在他们的机器上安装 Ubuntu。\n\n任何活跃的 Ubuntu 用户小组都可以策划 `Ubucon`，`Ubucons`\
  \ 已在世界各地举行。例如，`Ubucons` 现在与南加州 Linux 展、俄亥俄 Linux Fest、东南亚 Linux Fest 等活动共同举行。这种依附于大型活动的方式非常好，以至于在\
  \ 2010 年，其他几个组织允许将 `Ubucon` 作为其大型活动的一个较小部分，这种做法预计未来还将继续。`Ubucons` 变得越来越流行是因为 Ubuntu\
  \ 用户已经参加了大型活动，`LoCo` 团队可以负担举办 `Ubucons` 的场地成本很低且只需一个赞助商即可，它们是免费活动，而且流行的 Ubuntu 演讲者通常已经参加了大型活动，并愿意且乐意将参与\
  \ `Ubucon` 加入他们的日程。\n\n虽然会议和峰会是头脑风暴和开发的场所，但它们也是有趣且愉快的体验。它们为用户将名字、IRC 昵称和电子邮件对应起来提供了场所，并提供了愉快、幽默且高效的互动。\n\
  \n#### Planet Ubuntu\n\n想要了解构成 Ubuntu 的人物，从博客聚合器 Planet Ubuntu `[`planet.ubuntu.com`](http://planet.ubuntu.com)`\
  \ 是一个很好的起点（见图 10-5](#part0022.xhtml_ch10fig05)。博客聚合器基本上是一个博客博客，它从选择将博客加入系统的 Ubuntu\
  \ 成员那里获取最新帖子，并按时间倒序发布在一个单一博客。虽然内容大部分关于 Ubuntu，但作为 Ubuntu 成员的窗口，`Planet Ubuntu` 也包含了社区成员的个人信息。通过这种方式，`Planet\
  \ Ubuntu` 为参与者在 Ubuntu 社区留下印记提供了很好的方法，并让其他人看到 Ubuntu 社区正在做的事情。\n\n![Image](img/image0395.jpeg)\n\
  \n**图 10-5** Planet Ubuntu\n\n\n\n\n\n# Ubuntu 治理\n\nUbuntu 的运行遵循著名的黑客格言：“粗略的共识和运行的代码”（rough\
  \ consensus and running code）。该项目试图达成共识、做出良好的技术决策并不断向前。它尝试尽可能地减少政治化，并将权力授予那些最擅长完成良好工作的人。马克·舒特尔沃（Mark\
  \ Shuttleworth）解释道：“这不是民主制，而是精英治理制。我们努力更多地基于共识而非投票来运行，寻求那些必须执行工作的人的认可。”\n\n该项目试图通过在第\
  \ 1 章中描述的《行为准则》随时执行相互尊重，以防止分歧变得失控。当然，分歧是不可避免的，并且在性质上可能是技术性的，也可以是非技术性的。社区能够处理这些问题，为此，社区创建了一个轻量级治理系统，旨在确保分歧得到审慎解决，并确保项目始终有一个强大、公平且具有响应性的方向。\n\
  \nUbuntu 网站描述了其社区治理系统的目标为三点：\n\n1. 确保定义了一个流程，允许人们对有关 Ubuntu 社区和发行版的决策做出贡献。\n2. 确保有关\
  \ Ubuntu 发行版和社区的决策是以公平透明的方式做出的。\n3. 确保即使在社区没有达成明确共识的情况下，也能做出必要的决策。\n\n本着这些目标，Ubuntu\
  \ 的系统基于将决策权委托给中小型团队。当分歧产生时，它们会在相关团队内部处理。在某些较大团队的案例中，团队委员会以非常结构化的方式处理各种争议解决。当团队无法解决自己的分歧，或者当团队之间存在分歧时，问题将转发给治理该社区区域的委员会或董事会，有时可以并可能升级到`社区委员会`（Community\
  \ Council）或`技术委员会`（Technical Board），取决于问题在性质上是否是技术性的。作为资助者和项目创始者，舒特尔沃斯担任`社区委员会`成员，并占据着一个自封的“终身仁慈独裁者”（SABDFL）特殊职位。用户可以通过参与团队来参与\
  \ Ubuntu 的治理结构，并且作为 Ubuntu 成员和维护者，他们在批准`社区委员会`和`技术委员会`成员方面拥有发言权。\n\n## 团队\n\nUbuntu\
  \ 的大部分工作被委托给一组团队，每个团队负责 Ubuntu 的特定工作领域。重要团队的示例（远非完整列表）可能包括论坛、营销、文档、内核、服务器、笔记本电脑和翻译团队。任何对\
  \ Ubuntu 项目某个方面感兴趣的人都可以加入团队讨论，并对其决策做出贡献。\n\n当参与者认为某个领域的资源投入不足时，他们可以在 Ubuntu wiki\
  \ 中起草团队详细信息，从而建立一个新团队，并招募贡献者来帮助他们的工作。团队应该始终包含多个人的参与。Ubuntu 中没有单人男性或单女性团队。\n\n有几个团队规模之大、之重要，以至于他们以团队委员会的形式建立了自己更先进的治理结构。这些委员会要么由`社区委员会`从团队内的活跃成员和领导者中任命，并作为该团队及其在项目中所区域的`社区委员会`代表行事，要么是完全自自运行的。这些团队委员会定期举行会议，解决冲突，在每个周期向`社区委员会`汇报，并在某些情况下甚至代表`社区委员会`授予成员身份。\n\
  \n## Canonical 的 Ubuntu 社区团队\n\n正如章开头提到的，Canonical 理解并感谢 Ubuntu 社区对每个 Ubuntu 版本的成功和增长所起的重要作用。Canonical\
  \ 的 Ubuntu 社区团队是一个由 Ubuntu 社区经理 Jono Bacon 领导的五人团队，成员由 Canonical 雇佣，他们直接负责 Ubuntu\
  \ 社区的各个部分，包括开发者关系、质量保证和云。\n\n社区团队成员各专注于他们负责的社区领域，并与其领域合作，以帮助教育、鼓励和激发更广泛的参与。这有助于与\
  \ Canonical、上游软件项目、新闻和博客作者以及更广泛的社区建立信任关系，有助于维护一个健康且包容的社区，该社区能够开发、设计并影响 Ubuntu 项目的方向和增长。\n\
  \nUbuntu 社区团队实施了以下参与 Ubuntu 社区的新机会：\n\n### 针对 Ubuntu 应用程序开发者社区\n\n* Ubuntu 应用程序开发者网站：[`developer.ubuntu.com`](http://developer.ubuntu.com)\n\
  * Facebook：[www.facebook.com/ubuntuappdev](http://www.facebook.com/ubuntuappdev)\n\
  * Twitter：[www.twitter.com/ubuntuappdev](http://www.twitter.com/ubuntuappdev)\n\
  * Google +：[`plus.google.com/u/1/111697084657487423167/posts`](https://plus.google.com/u/1/111697084657487423167/posts)\n\
  \n### 针对 Ubuntu 开发者社区\n\n* Ubuntu 打包指南：[`packaging.ubuntu.com/`](http://packaging.ubuntu.com/)\n\
  * Facebook：[www.facebook.com/ubuntudev](http://www.facebook.com/ubuntudev)\n* Twitter：[www.twitter.com/ubuntudev](http://www.twitter.com/ubuntudev)\n\
  * Google +：[`plus.google.com/u/1/107265043789873157543/posts`](https://plus.google.com/u/1/107265043789873157543/posts)\n\
  \n### 针对云社区\n\n* Ubuntu 云门户：[`cloud.ubuntu.com`](http://cloud.ubuntu.com)\n* Juju：[`juju.ubuntu.com/`](https://juju.ubuntu.com/)\n\
  * Twitter：[www.twitter.com/ubuntucloud](http://www.twitter.com/ubuntucloud)\n\n\
  ## 本地社区团队\n\n本地社区团队在社区中亲切地称为 LoCo，是非常重要的团队。每个 LoCo 负责在特定区域推广、支持并代表 Ubuntu。这些区域通常是地理性的，通常覆盖全国，尽管在某些情况下可能会重叠。Ubuntu\
  \ 鼓励 LoCo 尽可能合作。\n\nLoCo 类似于 Linux 用户小组（LUG），并且经常密切合作或与 LUG 关联。LoCo 经常参与 Ubuntu\
  \ 的地语言本地化或翻译，并在当地学校、政府机构和社区中进行宣传。优秀的 LoCo 定期举行社交活动、演讲和讨论。他们甚至经常举办安装活动（installfests），团队成员帮助新用户在电脑上安装\
  \ Ubuntu。LoCo 的代表被要求协助本地化事务，在当地会议和贸易会上代表 Ubuntu 项目发言，并在此类活动中组织展位或出席。\n\nCanonical,\
  \ Ltd. 为每个团队提供邮件列表和域名（通常格式为 `ubuntu-<CC>.org`，其中 `CC` 是国家双字母代码代码）。Canonical 还愿意托管\
  \ LoCo 网页、wiki、论坛、博客、下载区域和额外的邮件列表。LoCo 向任何人开放。\n\n想寻找你附近的本地社区团队吗？你只需要访问 Ubuntu 本地社区团队门户\
  \ [`loco.ubuntu.com/`](http://loco.ubuntu.com/)，通过在地图上选择你所在的区域或点击页面顶部的团队选项卡开始。任何操作都将列出当前的\
  \ LoCo 团队列表。\n\n## MOTUs\n\n\n\n\n\n书中另一类值得深入描述的非常特殊的团队是 MOTU。MOTU 是 Ubuntu Universe\
  \ 软件包仓库的维护者，该缩写在开默中中意为“宇宙之主”（Masters of the Universe）。MOTU 自称为“努力保持 Ubuntu Universe\
  \ 部分运行良好的勇敢灵魂”。”。他们是社区成员，投入时间尽可能地对 Universe 仓库中发现的软件进行添加、维护和支持。\n\nMOTU 是软件包维护者。他们作为一个小组，维护着\
  \ Ubuntu 归档中绝大多数的软件包。一些由 MOTU 维护良好的软件包随着时间的推移，已经迁移到了主组件（main）并成为 Ubuntu 发行版的正式部分。由于\
  \ Ubuntu 不对 universe 中的软件包提供任何支持或质量保证，MOTU 团队为维护者提供了一个磨练技巧的机会，并让他们（由于这有时不可避免）在进入\
  \ main 组件中责任更高的软件包之前犯一些错误。\n\nMOTU 的角色和职责非常多。一些重要的职责包括 MOTU：\n\n- ![Image](img/image00259.jpeg)\
  \ 理解打包概念，并具有丰富的通过赞助人（sponsor）上传软件包的经验。\n- ![Image](img/image00259.jpeg) 通过在 universe\
  \ 组件中上传新软件包和更新现有软件包来应用这些知识。\n- ![Image](img/image00259.jpeg) 可能与核心开发者合作对主组件做出贡献。\n\
  - ![Image](img/image00259.jpeg) 回答其他开发者的问题，扩展他们对打包工作的理解。\n- ![Image](img/image00259.jpeg)\
  \ 为潜在的 Ubuntu 开发者提供技术问题的指导。\n\nMOTU 贡献者是那些对贡献 Ubuntu 感兴趣并正在学习如何打包以及如何在 Ubuntu 开发社区中工作的人。他们主要通过使用\
  \ MOTU 作为其工作的赞助人来开展。成为 MOTU 贡献者没有要求或考试，只需有学习意愿和对 Ubuntu 行为准则的承诺。这些贡献者中许多成为了正式的 MOTU，而许多\
  \ MOTU 最终被授予全核心开发者身份。这个三步走系统是几乎所有新维护者学习在 Ubuntu 中维护软件包的过程。\n\n## 社区委员会 (The Community\
  \ Council)\n\n社区委员会和技术委员会（Technical Board）是 Ubuntu 内部最高级别的治理结构。社区委员会涉及所有 Ubuntu\
  \ 成员和活动，可以说是是 Ubuntu 项目中权力最大的团队。社区委员会负责监督项目的社会结构、场所和流程。\n\n社区委员会的日常工作涉及 Ubuntu 的五个主要领域。第一个也是最直接的是维护《Ubuntu\
  \ 行为准则》（Ubuntu Code of Conduct）。社区委员会是唯一可以批准准则修订的机构。由于社区委员会不会在准则更改时要求每位成员“重新同意”准则，因此这些修订必须完全符合之前草案的精神。\n\
  \n社区委员会的第二项职责是调解在特定团队内无法处理或团队之间产生的纠纷。这些通常是关于行为准则的纠纷，可能需要对准则某部分进行说明，或者描述特定行为是否实际上违反了准则的任何内容。然而，社区委员会的职责范围不仅限于违反行为准则，且社区委员会也可以处理任何非技术情况下的纠纷。在大多数情况下，社区委员会不会对个人采取行动，而是帮助小组成员之间达成一致或共识。如果失败，社区委员会可以要求维护者或其他社区成员道歉并停止某种特定行为，或离开社区。委员会承诺，在没有经过实质性审查和自我辩护机会的情况下，不会要求任何人离开。\n\
  \n委员会工作的第三个领域是协助团队解决其运行过程中可能遇到的任何障碍。这可能包括但不限于：协助获取因贡献者离开而丢失的资源访问权限、解决团队在社区中可能遇到的障碍，以及在需要时协助任命新领导。为此，社区委员会在每个周期的定期会议期间与社区中的关键团队会面，以查看是否能以任何方式帮助这些团队。\n\
  \n第四，社区委员会最终负责批准和欢迎新成员加入项目，这将在接下来的“成员身份”小节中进行更详细的描述。\n\n最后，社区委员会负责所有与社区相关的结构和流程。新类型的团队、成员要求和核心哲学文档应首先获得社区委员会的批准。希望建议新结构或流程的社区成员可以将其提议提交社区委员会进行讨论和批准。\n\
  \n社区委员会在每个月的第一个和第三个周四通过 IRC 会议，在每个月的第二个和第四个周四通过视频会议举行非正式的“面对面”会议。任何社区参与者都可以向社区委员会提交讨论事项或提议。会议对社区开放，但委员会只寻求成员的共识或投票——尽管他们会咨询提交提议团队代表和其他社区成员的意见。如果开放会议变得太嘈杂，委员会保留对频道进行调制的权利以恢复秩序。会议全文记录会在社区委员会会议后发布。社区委员会的现成员可以在\
  \ `https://launchpad.net/~communitycouncil` 找到。委员会的任命由 Shuttleworth 监督，并由所有成员通过最终投票从列表中选出提名者。任期为两年。\n\
  \n## 技术委员会 (The Technical Board)\n\nUbuntu 技术委员会负责 Ubuntu 项目的技术方向。通过处理所有技术事务，技术委员会补充了社区委员会，成为\
  \ Ubuntu 项目治理的最高层级。特别是，技术委员会负责 Ubuntu 策略的三个主要领域：软件包策略、发布特性目标和软件包选择。此外，技术委员会也可以像之前描述社区委员会那样，调解团队内部或团队之间的任何技术分歧或问题。\n\
  \n技术委员会的首要责任是 Ubuntu 软件包策略。技术委员会维护策略文档，该文档描述了所有 Ubuntu 软件包必须遵循的过程和标准。由于策略在不断演变，每个\
  \ Ubuntu 版本都对应技术委员会确定的特定 Ubuntu 软件包策略版本。任何策略的建议或提议都提交给技术委员会进行考虑。\n\n\n\n\n最后，技术委员会（Technical\
  \ Board）负责维护 Ubuntu 软件（即软件包）的 `list`。在此项职能上，技术委员会决定哪些软件被安装在默认桌面版本中，以及哪些软件包有资格作为\
  \ Ubuntu 核心组件的一部分获得完全支持。用户和开发者可以提议将特定的软件纳入主（main）、基础安装（base install）或桌面安装（desktop\
  \ install）。在任何情况下，最终决定都将由技术委员会做出。\n\n与社区委员会（Community Council）一样，技术委员会每两周在 IRC 上上一次会议。与社区委员会类似，任何用户都可以在计划会议之前向技术委员会提交待讨论的事目或提案。会议对所有相关方开放，但决策和投票仅限于技术委员会成员。适用于社区委员会的完整转录和关于噪音的规则也适用于技术委员会。你可以随时在\
  \ [`launchpad.net/~techboard`](https://launchpad.net/~techboard) 找到技术委员会成员的当前列表。任命由沙特尔沃（Shuttleworth）做出，但须经过维护者的投票确认，而非全体成员的投票。任期为一年。\n\
  \n## 其他委员会和理事会\n\n### Ubuntu 论坛委员会 (Ubuntu Forum Council)\n\nUbuntu 论坛由一组被称为论坛委员会的小组成员领导。\n\
  \n- Launchpad 团队：[`launchpad.net/~forum-council`](https://launchpad.net/~forum-council)\n\
  - Wiki 页面：[`wiki.ubuntu.com/ForumCouncil`](https://wiki.ubuntu.com/ForumCouncil)\n\
  - 邮件列表：ubuntu-forums-council@lists.ubuntu.com\n\n### Ubuntu IRC 委员会 (Ubuntu IRC\
  \ Council)\n\nIRC 委员会是负责治理 IRC 频道以及处理 IRC 与 Ubuntu 社区其他部分及治理系统接口的团体。\n\n- Launchpad\
  \ 团队：[`launchpad.net/~ubuntu-irc-council`](https://launchpad.net/~ubuntu-irc-council)\n\
  - Wiki 页面：[`wiki.ubuntu.com/IrcTeam/IrcCouncil`](https://wiki.ubuntu.com/IrcTeam/IrcCouncil)\n\
  - 邮件列表：irc-council@lists.ubuntu.com\n\n### Ubuntu LoCo 委员会 (Ubuntu LoCo Council)\n\
  \nLoCo 委员会治理 LoCo 社区，对资源分配做出决定，处理冲突解决，并对项目的发展方向做出决策。\n\n- Launchpad 团队：[`launchpad.net/~ubuntu-lococouncil`](https://launchpad.net/~ubuntu-lococouncil)\n\
  - Wiki 页面：[`loco.ubuntu.com/loco-council/`](http://loco.ubuntu.com/loco-council/)\n\
  - 邮件列表：loco-council@lists.ubuntu.com\n\n### Ubuntu 开发者成员委员会 (Ubuntu Developer Membership\
  \ Board)\n\nUbuntu 开发者成员委员会负责考虑并批准成为 Ubuntu Core 开发者团队成员的申请。\n\n- Launchpad 团队：[`launchpad.net/~developer-membership-board`](https://launchpad.net/~developer-membership-board)\n\
  - Wiki 页面：[`wiki.ubuntu.com/DeveloperMembershipBoard`](https://wiki.ubuntu.com/DeveloperMembershipBoard)\n\
  - 邮件列表：developer-membership-board@lists.ubuntu.com\n\n### Ubuntu 成员批准委员会 (Ubuntu\
  \ Membership Approval Board)\n\nUbuntu 成员批准委员会由一个地理分布的团队组成，负责考虑 Ubuntu 成员申请。\n\n\
  - Launchpad 团队：[`launchpad.net/~ubuntu-membership-board`](https://launchpad.net/~ubuntu-membership-board)\n\
  - Wiki 页面：[`wiki.ubuntu.com/Membership/Boards`](https://wiki.ubuntu.com/Membership/Boards)\n\
  - 邮件列表：ubuntu-membership-boards@lists.ubuntu.com。\n\nUbuntu 变体（例如 Kubuntu、Edubuntu）也可能由某个委员会治理，但这取决于每个项目，并可能随着项目的变化和演变而发生改变。\n\
  \n## SABDFL\n\n马克·沙特尔沃（Mark Shuttleworth）开玩笑地称自己为 Ubuntu 的 SABDFL——自封的终身仁慈独裁者。作为\
  \ Ubuntu 项目的赞助人和 Canonical 有限公司的创始人，他扮演着一个承认的非民主角色。在 Canonical 员工方面，沙特尔沃有权要求人们从事特定的项目、功能目标和错误修复。他正是这样做的。\n\
  \n沙特尔沃在社区委员会也拥有一票平决票，并公开表示他不会轻率使用这票票。在委员会意见分歧且没有“正确”答案的情况下，SABDFL 将提供决定而不是更多的辩论。SABDFL\
  \ 的存在是为了对困难问题提供明确的领导，并为项目设定节奏和方向。作为这种权力的交换，他有责任听取社区意见，并理解使用 SABDFL 权威可能会损害项目。\n\n\
  ## Ubuntu 成员\n\n加入 Ubuntu 项目是项目认可持续且重大贡献的官方方式之一。任何签署了《Ubuntu 行为准则》并证明对 Ubuntu 社区做出了重大且持续贡献的人，都可以获得官方成员身份。这些贡献可以是任何类型的——技术性的或非技术性的——但需要是以能够在社区委员会授权下提交给\
  \ Ubuntu 成员委员会的形式存在的。候选人面前的成员委员会将单独考虑每份申请。在下文关于“参与”的章节中，列了一些符合条件的贡献类型列表（非详尽列表）。成员委员会在考虑贡献类型时会尽量保持灵活性。\n\
  \nUbuntu 成员负责通过投票确认社区委员会的所有提名。他们还可能被社区委员会要求对提交给全体成员的提案进行投票。作为交换，成员获得了 `@ubuntu.com`\
  \ 电子邮件地址以及携带 Ubuntu 名片的权利。成员身份有效期为两年，可以自行续约。未能续约的成员将被标记为非活跃状态，但通过涉及社区委员会批准的简单程序，可以重新激活。\n\
  \n成为成员的过程相对简单，并在 [`wiki.ubuntu.com/Membership`](https://wiki.ubuntu.com/Membership)\
  \ 有详细记录。最重要的是，它要求用户在 Wiki 页面上记录他们的贡献，包括代码链接、邮件列表、能够证明其参与的特定文档以及/或相关材料。成员申请还需要包含对\
  \ Ubuntu 工作和参与的证明。\n\n## 参与\n\n用户可以通过不同的层次和多种方式参与 Ubuntu 社区。以下章节很大程度上改编自 Ubuntu\
  \ 网站上的相关链接页面（[`community.ubuntu.com/contribute`](http://community.ubuntu.com/contribute)），提供了人们如何快速上手\
  \ Ubuntu 社区的列表。\n\n### Ubuntu 在线活动\n\nUbuntu 社区每个周期都会组织几次基于 IRC 的在线活动，目标是教授每个版本的新内容，帮助更多用户成为开发者，帮助现有开发者变得更熟练，鼓励\
  \ LoCo 团队和成员，鼓励用户成为贡献者等等。活动在 Ubuntu Classroom wiki 上跟踪，并随版本而异：[`wiki.ubuntu.com/Classroom`](https://wiki.ubuntu.com/Classroom)。\n\
  \n\n\n\n\nUbuntu On Air! 团队还会定期举办一系列基于视频的活动，这些活动的主题与 Ubuntu Classroom 活动相似，但通常还包括与社区核心成员的采访和问答环节。有关当前和即将进行的\
  \ Ubuntu on Air! 活动的详情，可以在 [`ubuntuonair.com/`](http://ubuntuonair.com/) 上找到。\n\n\
  ## 推广 (Advocacy)\n个人为 Ubuntu 社区贡献的最简单方法就是向他人介绍 Ubuntu。推广通常以多种方式进行。一种很好的方法是加入或建立一个\
  \ LoCo 团队（本地小组）。在本章早些时候描述的 LoCos 提供了一种让你参与 Ubuntu 活动的方法。如果用户没有 LoCo 团队，且没有足够的用户群来启动一个团队，他们可以通过向当地的\
  \ Linux 用户组或其他技术小组进行关于 Ubuntu 的讲座来帮助建立支持。通过这些或其他手段，推广是传播 Ubuntu 信息的绝佳方式，并为向社区贡献提供了一个低门槛的机会。许多社区成员在\
  \ Spread Ubuntu 网站（[`spreadubuntu.org`](http://spreadubuntu.org））上分享传单、海报、CD 封面和横幅等资源。Spread\
  \ Ubuntu 是一个官方的 Ubuntu 资源，由社区驱动，致力于为用户、团队和社区成员提供各种工具和资源，以协助推广工作。\n\n## 支持 (Support)\n\
  用户为 Ubuntu 贡献最有意义的方式之一是帮助未使用软件。用户可以通过加入支持性质的邮件列表、IRC 频道或论坛来实现，这些内容在本章早些时候已进行了详细描述。通过在这些场所中响应帮助请求，用户可以帮助其他用户在\
  \ Ubuntu 上运行起来。即使用户本身是初学者，他们在解决即使简单问题时获得的知识也能让他们帮助遇到相同问题的用户。社区成员 Fabián Rodríguez\
  \ 对这种精神总结得非常到位：“每一位用户都是某人的导师。”\n\n## 想法与反馈 (Ideas and Feedback)\n为 Ubuntu 贡献的另一种方法是通过描述愿景或提供想法来引导项目方向。这可以通过参加会议以及\
  \ Ubuntu wiki 上的讨论和头脑风暴会议来实现。通过监控规范的编写并提供反馈（特别是在早期阶段），用户可以做出意义的贡献。然而，贡献想法的用户应该记住，空谈是免费的。明智的做法是与他人合作，帮助将愿景变为现实。\n\
  \n## 文档 (Documentation)\n当用户被某个问题难住时，其他用户很可能也对此感到困扰。如果用户无法编写代码来改变这种局面，他们可以通过编写自己的经验并记录解决方案来帮助他人。Ubuntu\
  \ 拥有一个充满活力的文档团队和社区，编写文档是为 Ubuntu 社区做出重大贡献的极佳低门槛方式。\n\n旨在为 Ubuntu 文档做出贡献的用户建议在钻研问题时做笔记，并在找到解决方案时将其记录下来。在编写之前，用户还应该检查是否已经存在针对特定问题的文档。如果存在，明智的做法是选择改进或补充现有文档，而不是编写新文档。同样，用户可以通过阅读现有文档并修复事实性、技术性、风格性、拼写和语法错误来做出意义的贡献。花费大量时间在文档工作上的用户，随着时间的推移，可能还想加入\
  \ Ubuntu 文档团队，该团队可以帮助从 Ubuntu 文档目标的角度来组织和协调这项工作。\n\n## 翻译与本地化 (Translation and Localization)\n\
  对 LoCos 的讨论应该已经清楚地说明，翻译对于任何精通英语和另一种语言的人来说，都是为 Ubuntu 社区做贡献的绝佳方式。翻译工具（在第 9 章中描述）允许用户翻译从单个字符串到整个应用程序的内容。通过其易用的界面和基于\
  \ Web 的特性，翻译提供了一条低门槛的贡献途径。严肃的翻译者应该加入本地社区团队和 `ubuntu-translators` 邮件列表，以便与其他 Ubuntu\
  \ 翻译人员保持联系。\n\n## 质量保证与错误 (Quality Assurance and Bugs)\n质量保证（QA）是许多公司聘请专门工程师的工作。在\
  \ Ubuntu 中，开发团队依赖 Canonical QA 团队和社区在软件发布之前进行测试，让开发者了解问题，以便在绝大多数用户看到之前修复漏洞（bugs）。用户可以以多种方式参与软件测试，从测试即将发布的最新\
  \ ISO 构建版本，到在更新发布给更广泛的社区之前逐个测试软件包。\n\nISO、笔记本电脑测试和软件包的跟踪器可以通过 Ubuntu 质量团队获取。当用户在帮助\
  \ QA 时发现漏洞时，他们应该在 Ubuntu 错误跟踪系统中报告它们。他们还可以通过“标记”漏洞、关闭或合并重复项，或者验证漏洞并向漏洞描述中添加信息来提供帮助。如果你打算参与\
  \ QA，你应该订阅 `ubuntu-devel-announce` 邮件列表和 `ubuntu-quality` 邮件列表，考虑监控 `ubuntu-devel`，并加入\
  \ irc.freenode.net 上的 `#ubuntu-quality` IRC 频道。\n\n## 与打包 (Programming and Packaging)\n\
  用户为 Ubuntu 社区贡献的最后方式是通过生产代码。由于 Ubuntu 是免费开源软件，用户可以访问 Ubuntu 支持的所有软件。这允许用户打包额外的软件以纳入\
  \ Ubuntu，修复漏洞并添加功能。开发者和测试软件的人一样，应该订阅 `ubuntu-devel-announce` 邮件列表，并同样考虑监控 `ubuntu-devel`。开始做出贡献的最佳方法是像之前描述的那样，作为一名\
  \ MOTU 志向者通过 MOTU 团队。用户还可以查看规范列表，找到一个他们个人感兴趣的项目。\n\n### 总结 (Summary)\nUbuntu 是一个充满活力且多样化的社区，在全球范围内和多种语言中活跃。它的活动主要在各种虚拟场所进行，包括邮件列表、IRC、Web\
  \ 论坛、wiki、社交媒体、上游视频、开发者和云门户，以及名为 The Fridge 和 Planet Ubuntu 的两个 Web 门户。Ubuntu 通过现实生活中的会议补充了这种虚拟活动。Ubuntu\
  \ 社区被分为各种团队和流程。这种架构的顶部是 Ubuntu 社区委员会、技术委员会和 SABDFL Mark Shuttleworth。通过多种方式，该社区旨在轻松促进贡献。最终，这些贡献通过获得正式项目成员身份和投票权的过程获得认可。\n\
