  \n\n\n\n\n\n\n\n\n\n\n\n## 对《Ubuntu 官方指南》之前版本的赞誉\n\n“《Ubuntu 官方指南》是入门的极佳方式。” — John\
  \ Stevenson, TechZone\n\n“这本书是我可以诚实地推荐给任何使用 Ubuntu 的人的。” — Bill Blinn, Ubuntu Worldwide\n\
  \n“这是一本新 Ubuntu 用户会发现非常有用的书。” — Thomas Petrucha, Florida Local Community\n\n“简而言之，它非常好用。”\
  \ — Gregory Chapelle 博士，General Atomics, Electromagnetics Division, San Diego, California\n\
  \n“我无法再如何强调这些作者的知识是多么渊博了。” — Paul Tagliamonte, Ubuntu Member, Debian Developer\n\
  \n*本书献给 Ubuntu 社区。没有你们的不懈工作和投入，这一切都是不可能的。*\n\n\n\n\n\n# 第一版序言\n\n# 前言\n\n# 致谢\n\n\
  # 关于作者\n\n# 引言\n\n## 关于本书\n### 本书的范围\n\n默认设置对大多数用户都是合理的。但如果你用不同的程序打开特定的媒体文件怎么办？点击\
  \ `System Settings` 菜单中的 `Details` 图标更改默认设置（图 6-6）。从左侧菜单选择不同的项目。\n\n![Image](img/image00361.jpeg)\n\
  \n**图 6-6** 更改默认应用程序很容易：只需在尝试让 Ubuntu 使用它之前确保已安装它。\n\n***\n\n注意\n\n有很多可用设置。可以根据你的需求或偏好更改任何设置。在更改之前你可能想记录当前设置，以防改变主意并恢复原始设置。\n\
  \n***\n\n### 理解 Linux 如何存储和组织文件\n\n如果你没有用过 Linux，Linux 存储和组织的方式对你来说可能是全新的，因为其布局与\
  \ Windows 和 Mac OS X 不同。\n\n***\n\n提示：文件夹与目录\n\n在阅读文件管理时，不要被 `folders` 和 `directories`\
  \ 这两个术语困扰——这两个词描述同一个东西。\n\n***\n\n在 Windows 世界中，每个磁盘驱动器都有一个标识字母，例如硬盘的 C: 和光驱/DVD\
  \ 器的 D。但在 Linux 世界中，一切都是同一个文件系统的一部分。因此，如果你插了两个或三个硬盘、一个光驱和一个 USB 闪存盘，它们都将属于同一个文件夹结构。\n\
  \n图 6-7 所示的图应该让你对这一切是如何结合在一起的有一个直观的了解。\n\n\n\n\n\n![Image](img/image00362.jpeg)\n\
  \n**图 6-7** Linux 文件系统结构\n\n树形结构的顶端是根目录，称为 `/`。此文件夹内有许多特殊的系统文件夹，每个文件夹都有特定的用途。例如，`/home`\
  \ 文件夹包含系统上每个用户的家目录。因此，用户账户的家目录可能设置为 `/home/jono`（如果你的用户名是 jono 的话！）。\n\n## 哪些文件夹是做什么的？\n\
  \n像 Ubuntu 等现代 Linux 发行版的文件夹结构，很大程度上灵感来自由留着大胡子的男人创建的原始 UNIX 基础。虽然你并不真正需要了解这些文件夹的作用，因为\
  \ Ubuntu 会为你处理好这些杂务，但你的一些人可能对更重要的文件夹感兴趣。为了方便起见，我们在表 6-1 中列出了 Linux 文件夹清单。\n\n![Image](img/image00363.jpeg)\n\
  \n**表 6-1** Linux 文件夹\n\n## 配置文件\n\n在表 6-1 中，`/etc` 被描述为存储计算机的系统级配置文件。除了这些影响所有人的文件外，还有针对每个特定用户的配置文件。早些时候，当你自定义\
  \ Ubuntu 的外观时，设置仅适用于你的当前用户账户。那么这些设置存储在何处？\n\n在你的家目录下有许多以点（`.`）开头的文件夹，例如 `.config`\
  \ 和 `.mozilla`。这些文件夹包含用户特定应用程序的配置。默认情况下，这些点文件夹在图形文件查看器中是隐藏的，因为你很少需要访问它们。在查看家目录时，你可以点击菜单中的查看\
  \ > 显示隐藏文件，或按下 `Ctrl-H` 来查看这些隐藏文件和文件夹。\n\n### 在另一个分区上使用 Windows 文件\n\n对于那些生命中大部分时间都花在\
  \ Windows 分区上的人来说，你可能希望能够从 Ubuntu 访问这些分区。这并不是问题，尽管你需要编辑一个特殊的配置文件来实现。幸运的是，你只需要编辑一次该文件，然后一切都会设置好。\n\
  \nUbuntu 应该会自动识别你电脑上的任何 Windows 分区，并在文件管理器中为你设置好；但是，你可能需要修改它们或添加你自己的分区。在 Dash 中搜索*Disks*，并记录下你\
  \ Windows 分区的编号和文件系统。分区编号看起来类似于 `/dev/hdb1` 或 `/dev/sdb1`，文件系统将是 FAT、VFAT 或 NTFS。\n\
  \n下一步是创建一些挂载点。当你的 Windows 分区被启用时，可以通过 Ubuntu 中的特定文件夹来访问它们。这被称为挂载点。例如，如果你有一个名为 `/media/win1`\
  \ 的挂载点，并且你想在 Windows 分区上访问 Work 文件夹，那么你可以在 Ubuntu 中通过 `/media/win1/work` 访问它。\n\n\
  挂载点通常位于 `/media` 文件夹。你可以为每个 Windows 分区创建一个不同的挂载点。例如，如果你有三个 Windows 分区，运行以下命令：\n\n\
  点击此处查看代码图片\n\n```\nfoo@bar:~$ sudo mkdir /media/win1\nfoo@bar:~$ sudo mkdir /media/win2\n\
  foo@bar:~$ sudo mkdir /media/win3\n```\n\n现在打开以下配置文件：\n\n点击此处查看代码图片\n\n```\nfoo@bar:~$\
  \ sudo gedit /etc/fstab\n```\n\n`/etc/fstab` 文件将分区编号映射到挂载点。在文件底部，为每个挂载点添加类似下面的一行：\n\
  \n点击此处查看代码图片\n\n```\n/dev/hdb1 media/win1 vfat users,rw,owner,umask=000 0 0\n```\n\
  \n你需要为相关分区更改分区编号（第一列）、挂载点（第二列）和文件系统（第三列）。\n\n现在重新加载 `/etc/fstab` 以启用分区：\n\n```\n\
  foo@bar:~$ sudo mount -a\n```\n\n现在出现了新分区的某些硬盘图标。\n\n***\n\n 提示\n\n你可以在 [`help.ubuntu.com/community/Fstab`](https://help.ubuntu.com/community/Fstab)\
  \ 找到关于 fstab 的更多信息。\n\n***\n\n## 学习 Unity 快捷键\n\n使用鼠标是因为手部、眼睛和光标之间的直接交互是直观的，但对于重复操作，键盘快捷键能让你工作（和游戏）得更快。你不需要花时间抬起手，移动到桌子的另一个位置，使用鼠标，点击某些东西，将手移回键盘输入几个字母，再回到鼠标点击其他东西，以此类推。你在一个地方可以做得越多，你的操作就越高效。这是一份你可以在不离开键盘的情况下使用\
  \ Unity 完成的事情列表。当然，你不必非这样做，但高级用户喜欢节省时间和精力，即使这意味着在前期多花一点时间学习如何操作；从长远来看，这种节省是累积的。\n\
  \nSuper 键用于几个快捷键。它有时被称为 Windows 键。在下面的表中，它被简单地称为 Super。\n\n### Launcher\n\n表 6-2\
  \ 列出了与 Launcher 相关的快捷键。\n\n![Image](img/image00364.jpeg)\n\n**表 6-2** Launcher\n\
  \n## Dash\n\n表 6-3 列出了与 Dash 相关的快捷键。\n\n![Image](img/image00365.jpeg)\n\n**表 6-3**\
  \ Dash\n\n### Switching\n\n表 6-4 列出了与切换应用程序相关的快捷键。\n\n![Image](img/image00366.jpeg)\n\
  \n**表 6-4** Switching\n\n### Windows\n\n表 6-5 列出了与窗口及其管理相关的快捷键。\n\n![Image](img/image00367.jpeg)!Image](Images/image00368.jpeg)\n\
  \n**表 6-5** Windows 管理\n\n### Workspaces\n\n工作区——即会话中的多个“桌面”在 13.04 及更高版本中默认禁用。要恢复它们，你必须进入系统设置菜单并选择外观\
  \ > 行为。选择“启用工作区”选项以显示四个工作区并将工作区切换器插入 Launcher。\n\n表 6-6 列出了与使用工作区相关的快捷键。\n\n![Image](img/image00369.jpeg)\n\
  \n**表 6-6** 工作区\n\n### Other\n\n表 6-7 列出了不属于之前任何一类别的快捷键。\n\n![Image](img/image00370.jpeg)\n\
  \n**表 6-7** 其他\n\n\n\n\n必须非常明确的是，使用命令行`并不是`使用 Ubuntu 的必备技能，但它是一项可以增加你的计算机灵活性、以完成更高级、定制化任务的技能。我们在这里并不打算介绍终端的使用，而是在第\
  \ 7 章中包含了关于它的极佳介绍，我们强烈建议所有想要成为高级用户的用户阅读该章节。\n\n## 与 Windows 程序一起\n\n尽管 Linux 为桌面端提供了一个日益具有吸引力的平台，但在某些情况下，除了为\
  \ Windows 编写的应用程序之外，没有其他替代方案。这通常发生在特定的业务应用程序、某些教育工具以及许多游戏中。幸运的是，你有一种方法可以在 Ubuntu\
  \ 桌面面上运行许多此类应用程序。\n\n20 多年来，`Wine` 项目团队的成员一直致力于创建一种在 Linux 上运行 Windows 应用程序的免费方法。虽然并不是每个应用程序都能完美运行，有些甚至完全无法运行，但在\
  \ `Wine` 中可以运行的程序数量已经大幅增加，并且仍在持续增长。然而，建议你在在使用 `Wine` 运行的程序进行重要工作之前，对其进行彻底测试。如果你遇到问题，可以尝试咨询帮助资源、使用虚拟化在\
  \ Ubuntu 之上运行 Windows，或者搜索其他应用程序来使用。\n\n> 提示\n> 你可以在 [www.winehq.org/help/](http://www.winehq.org/help/)\
  \ 找到一些实用的 `Wine` 帮助资源并在[www.winehq.org/docs/wineusr-guide/alternatives](http://www.winehq.org/docs/wineusr-guide/alternatives)\
  \ 更多关于 `Wine` 替代方案的信息。你也可以在 [`appdb.winehq.org`](http://appdb.winehq.org) 查看你想运行的程序是否经过\
  \ `Wine` 兼容性测试。\n\n从 Ubuntu 软件中心安装 `Wine` 包，或直接双击 `.exe` 文件，系统将提示你安装该包。点击启动器中的应用程序图标后，可以在应用程序\
  \ Dash 中搜索 `Wine Applications` 来配置 `Wine`。你的 `C:\\` 驱动将出现在“位置”菜单中以便于访问，你也可以从 Ubuntu\
  \ 软件中心卸载 `Wine`。\n\n要运行应用程序，只需双击已安装的 `.exe` 文件即可。一旦安装完成，你就可以在 Dash 中搜索 `Wine` 了。\n\
  \n> 提示\n> 你可以从 Ubuntu 的视角在 [`help.ubuntu.com/community/Wine`](https://help.ubuntu.com/community/Wine)\
  \ 获取更多关于 `Wine` 的信息。\n\n## 从 PPAs 安装软件\n\n有时，Ubuntu 仓库中并不提供某些软件；可能因为它太新了，可能有新版本可用，也可能它是没有人有机会构建并获准包含在\
  \ Ubuntu 仓库中的软件。你通常可以在个人包存档（PPA）中找到这些软件。PPAs 的 Launchpad 主页面写道：“个人包存档 (PPA) 允许你上传\
  \ Ubuntu 源包，以便由 Launchpad 构建并作为 `apt` 存储库发布”（参见 [`launchpad.net/ubuntu/+ppas`](https://launchpad.net/ubuntu/+ppas)）。\n\
  \n简而言之，`PPA` 是一个小型存储库，包含了在 Ubuntu 主仓库中未找到的软件，可能是出于上述列出的原因之一或其他原因。如果你想要安装的软件包或版本在\
  \ Ubuntu 主仓库中不可用，请使用网络浏览器在 Launchpad 主站搜索该软件，并查看是否存在 `PPA`。\n\n> 提示：当心！\n> 某些 `PPAs`\
  \ 是为了开发或 beta 甚至 alpha 测试而创建的。它们不能保证包含稳定或经过良好测试的软件。任何人都可以创建 `PPA` 且没有审核程序，因此你只想安装来自你信任的源的\
  \ `PPAs`。使用时风险自负。\n\n对于我们的示例，我们安装了 LibreOffice 的前沿测试版本。除非你绝对需要 `PPA` 提供的内容，否则我们建议坚持使用\
  \ Ubuntu 仓库中的软件包。\n\n要将 `PPA` 添加到你的系统，请从 Launchpad 中特定 `PPA` 的网页记下其位置。在这种情况下，`PPA`\
  \ 位于 `ppa:libreoffice/ppa`，如图 6-8\n\n**图 6-8** 你可以在所有 PPA 页面找到技术细节和安装说明。\n\n添加 `PPA`\
  \ 最简单的方法是使用终端。在命令行输入以下命令来添加 LibreOffice `PPA` 并更新你的包管理器列表：\n\n点击此处查看代码图像\n\n```bash\n\
  $ sudo add-apt-repository ppa:libreoffice/ppa\n$ sudo apt-get update\n```\n\n然后，你可以通过你偏好的包管理器访问\
  \ `PPA` 的内容：Ubuntu 软件中心、Synaptic、命令行等。\n\n如果你以后想移除 `PPA`，可以再次使用此工具，但带有 `--remove`\
  \ 选项。\n\n点击此处查看代码图像\n\n```bash\n$ sudo add-apt-repository --remove ppa:libreoffice/ppa\n\
  $ sudo apt-get update\n```\n\n最后，如果你想移除 `PPA` 并回退到之前的软件版本，可以使用 `ppa-purge` 工具。\n\
  \n点击此处查看代码图像\n\n```bash\n$ sudo apt-get install ppa-purge\n$ sudo ppa-purge ppa:libreoffice/ppa\n\
  ```\n\n## 从源码编译\n\n某些软件在任何仓库中都找不到。在 Linux 上安装软件的传统方法在 Ubuntu 上同样适用。下载你的软件并将其放在一个空目录中。有时它会包含安装说明。如果是，请按照它们操作。\n\
  \n在安装源码包之前，必须将其编译为计算机可以运行的二进制文件。为此，你需要安装默认未包含的某些包。你需要的只需要其中一个依赖项。安装它，你就准备好了。\n\n\
  接下来，进入你放置下载源码的目录。它最可能是以压缩存档提供的，具有 `.tar.gz` 或 `.tar.bz2` 文件扩展名。根据文件名扩展名使用相应的命令解压存档：\n\
  \n```bash\n$ tar -xvf file.tar.gz\n$ tar -xvf file.tar.bz2\n```\n\n接下来，编译软件包。此步骤将从源码编译成可安装的内容。\n\
  \n```bash\n$ make\n```\n\n接下来，安装软件包。传统方法是使用此命令：\n\n```bash\n$ sudo make install\n\
  ```\n\n虽然这种技术可行，但有一种更好的方法。`make install` 会安装包，但它不会使用你的包管理器来这样做。如果你想从系统中删除该软件包，弄清楚方法可能会非常困难。相反，使用以下命令安装软件：\n\
  \n点击此处查看代码图像\n\n```bash\n$ sudo apt-get install checkinstall\n$ sudo checkinstall\n\
  ```\n\n像从官方仓库安装的任何软件一样，可以使用你的包管理器来移除：\n\n```bash\n$ sudo checkinstall\n```\n\n\n\
  \n在本章中，我们查看了许多与运行和管理 Ubuntu 系统相关的高级主题。我们讨论了桌面设置的更改，包括添加用户以及更改安全和隐私设置。接着，我们涵盖了文件系统的基本结构，并学习了如何手动添加\
  \ Windows 文件以便从桌中访问。随后，我们深入探讨了 Unity 快捷键，并通过示例演示了你如何使用它们来提高操作效率。我们还提到了从 PPA 安装软件，这包括更新版本、开发版本以及\
  \ Ubuntu 未附带的其它未打包的软件。最后，我们探讨了在 Ubuntu 下运行为微软 Windows 编写的某些程序的可能性，甚至是从源代码编译软件。\n\
