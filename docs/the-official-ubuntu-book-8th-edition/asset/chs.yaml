  \nWiki 页面：[`wiki.ubuntu.com/Xubuntu`](http://wiki.ubuntu.com/Xubuntu)\n\n### 提示：Xubuntu\n\
  \nXubuntu 可以在 [www.xubuntu.org](http://www.xubuntu.org) 找到。\n\n### Ubuntu Studio\n\
  \nUbuntu Studio ([图 9-6) 是一种专为多媒体制作设计并优化的 Ubuntu 版本。该系统包含了许多适用于音频视频录制、混音、编辑、合成和制作以及图像处理的应用。它包含一个修改过的内核，允许系统降低音频延迟以提高性能，但该内核在其他环境中可能并不适用。Studio\
  \ 团队专注于 LTS 版本。\n\n![Image](img/image0381.jpeg)\n\n**图 9-6** Ubuntu Studio 14.04\
  \ 桌面\n\n### 提示：Kubuntu Ubuntu Studio 资源\n\nIRC：`#ubuntustudio`\n\n邮件列表：[`lists.ubuntu.com/mailman/listinfo/ubuntu-studio-users`](https://lists.ubuntu.com/mailman/listinfo/ubuntu-studio-users)\n\
  \nLaunchpad 团队：[`launchpad.net/~ubuntustudio`](https://launchpad.net/~ubuntustudio)\n\
