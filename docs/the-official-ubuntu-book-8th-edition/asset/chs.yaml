- "# Ubuntu 官方指南 (第8版)\n\n\n\n![](img/cover00430.jpeg)\n\n## 关于本书\n\nePUB 是一种开放的行业标准电子书格式。然而，阅读设备和应用程序对\
  \ ePUB 及其许多功能的支持各不相同。请使用您的设备或应用设置根据您的喜好自定义显示效果。您可以自定义的设置通常包括字体、字号、单栏或双栏、横屏或竖屏模式，以及可以点击或触摸放大的图片。有关您的阅读设备或应用上设置和功能的更多信息，请访问设备制造商的网站。\n\
  \n许多书籍包含编程代码或配置示例。为了优化这些元素的显示效果，请在单栏横屏模式下查看电子书，并将字体大小调整为最小设置。除了以重流文本格式显示代码和配置外，我们还包含了代码图像，以模拟印刷版中的呈现；因此，当重流格式可能会影响代码列表的显示时，您将看到一个“点击此处查看代码图像”的链接。点击链接可查看保真代码图像。要返回上上一页，请点击设备或应用上的“返回”按钮。\n\
