  \ `总结`\n\n任何 Ubuntu 系统最强大的部分之一就是命令行。它也可能是最令人畏惧的入门部分。看起来通常没什么什么帮助，而且命令也不容易找到或理解。如果你愿意学习，命令行的力量将加速你的工作，并成为一项令你受益终身的极佳教育，因为它增强了你以更高的效率在计算机上执行你想做的任何操作的能力。\n\
  \n虽然命令行是桌面用户生活的一个很棒补充，但如果你运行服务器，它将是无价之。Ubuntu 服务器在安装时不附带任何图形用户界面（GUI），因此本章和其他书籍中解释的工具对于成功至关重要。嘿，记住要玩得开心！\n\
  \n### 启动终端\n\n可以通过点击提示工具或 Dash 主页图标来找到终端（`图 7-1`——它上面有 Ubuntu 符号，应该是你在启动器（Launcher）顶部找到第一个图标）。这会打开\
  \ Dash。在 Dash 中，输入 `terminal` 找到终端（`图 7-2`）。当它首次启动时，你将看到类似于`图 7-3`所示的内容。\n\n![Image](img/image00372.jpeg)\n\
  **图 7-1** Dash 首页图标\n\n![Image](img/image00373.jpeg)\n\n**图 7-2** 带有终端搜索的 Dash\n\
  \n![Image](img/image00374.jpeg)\n**图 7-3** 终端窗口\n\n你将看到一个闪烁的光标，它前面紧跟在一些字母，可能还有数字和符号，并以\
  \ `$` 结尾。该字符串中的第一个单词是你的用户名，后面跟着 `@` 符号。在 `@` 之后，列出了你计算机的主机名，接着是冒号以及你当前所在的目录名称（你总是从主目录开始，它由\
  \ `~` 符号表示）。\n\n有几十个命令可用。\n\n### 开始使用\n\n首先，查看当前目录下的文件：\n\n```\nls\n```\n\n`ls`\
  \ 命令列出当前目录下的文件。要查看更多详情，可以使用选项：\n\n```\nls -l\n```\n\n`-l` 选项提供了详细列表格式，包括权限、所有者、大小和修改日期。要查看隐藏文件，使用\
  \ `-a` 选项：\n\n```\nls -a\n```\n\n你也可以组合选项：\n\n```\nls -la\n```\n\n要在目录之间移动，使用 `cd`\
  \ 命令：\n\n```\ncd /path/to/directory\n```\n\n`cd` 命令更改当前工作目录。要返回主目录，只需使用：\n\n```\n\
  cd ~\n```\n\n要查看文件内容，使用 `cat` 命令：\n\n```\ncat filename\n```\n\n`cat` 命令将文件内容显示到终端。要逐页查看大文件，使用\
  \ `less` 命令：\n\n```\nless filename\n```\n\n### 构建管道\n\n当你开始将一个命令的输出传递给下一个命令的输入时，命令行的威力就真正发挥出来了，这就是通过使用管道组合命令。管道使用管道符号（`|`）来连接多个命令以执行特定任务。例如，如果你使用\
  \ `cat` 命令将文件内容显示到屏幕上，但文件滚动得太快，可以创建一个管道并使用 `less` 命令，这样就可以浏览文件：\n\n```\ncat foo.txt\
  \ | less\n```\n\n要了解它是如何工作的，将命令拆分为若干部分，每个部分都由管道符隔开。左侧部分的输出（`cat` 文件）被输入到右侧的 `less`\
  \ 命令中，允许你使用方向键浏览文件。\n\n管道对于查找系统的特定信息非常有用。例如，如果你想知道有多少个特定的进程正在运行，你可以运行这样的命令：\n\n\
  ```bash\nps ax | grep getty | wc -l\n```\n\n\n\n\n在这里，你可以统计运行了多少个 `getty` 进程（`getty`\
  \ 是运行控制会话的软件）。左侧的 `ps ax` 命令列出系统中的进程，然后 `grep` 命令搜索进程列表并仅返回包含文本“getty”的行。最后，这些行被输入到\
  \ `wc` 中，`wc` 是统计单词数或行数的小工具。`-l` 选项指定统计行数。很酷，对吧？\n\n## 以超级用户身份运行命令\n\n当你登录到计算机时，你使用的账户是一个普通用户账户。该账户被限制执行各种系统管理任务。Ubuntu\
  \ 背后的安全模型让你始终以普通用户身份运行，并且只在需要时才进入系统管理员账户。这可以防止意外更改或恶意安装不必要的程序以及类似的操作。\n\n在使用终端时，如需切换到此超级用户账户，请在你想要运行的命令之前加上\
  \ `sudo` 命令。例如，如果你想从命令行重启网络系统，请执行此命令：\n\n点击此处查看代码图片\n\n```\nusername@computer:~$\
  \ sudo apt-get install byobu\n```\n\n`sudo` 右侧的命令应该是以管理员身份运行的命令，但 `sudo` 允许你以当前用户的身份运行。当你运行此命令时，系统会要求输入管理员密码。这就是你在计算机上安装\
  \ Ubuntu 时为添加的第一个用户设置的密码。如果你正在使用该用户的账户，只需输入你的普通密码即可。在此例中，你正在安装 `byobu`，你可以用它让你的终端生活变得简单。\n\
  \n提示：Byobu\n\nByobu 是一个日语术语，指作为折叠屏隔风的装饰性多面板屏幕。作为一个开源项目，`byobu` 是对原本功能单一、简单实用的 GNU\
  \ screen 的优雅增强。Byobu 包含了针对 GNU screen 窗口管理的增强配置和配置实用程序，例如可切换的系统状态通知。关于 `byobu` 的更多信息可以查阅：[`manpages.ubuntu.com/manpages/precise/en/man1/byobu.1.html`](http://manpages.ubuntu.com/manpages/precise/en/man1/byobu.1.html)。\n\
  \n当通过终端向 `sudo` 完成身份验证后，在接下来的 15 分钟内将不再再次询问密码。\n\n## 查找帮助\n\n你计算机上的每个命令都包含一个手册页（或称\
  \ man page），其中包含了可用选项列表。手册页通常非常简练，仅供参考命令的不同用法。若想通过更易于理解的方式了解如何使用命令，我们建议使用 Google\
  \ 搜索。\n\n要查看手册页（例如 `ls` 的手册页），请运行此命令：\n\n```\nusername@computer:~$ man ls\n```\n\
  \n`man` 命令本身有很多选项（运行 `man man` 查看这些选项），其中最实用的之一是 `-k`。该选项允许你在手册页中搜索特定的单词。当你忘记了某个命令时，这个功能非常有用。例如，你可以通过执行此命令找到所有与进程相关的任务命令：\n\
  \n点击此处查看代码图片\n\n```\nusername@computer:~$ man -k processes\n```\n\n提示：Ubuntu 手册页仓库\n\
  \n此网站包含了来自每个受支持 Ubuntu 版本的每个包的数十万份动态生成手册，并且每天更新。如前所述，手册页传统上是从命令行查看的，但多亏 Dustin Kirkland\
  \ 的贡献，Ubuntu 用户现在可以使用 HTML 网页浏览格式查看 Ubuntu 中包含的所有手册。你可以在此处找到该仓库：[`manpages.ubuntu.com`](http://manpages.ubuntu.com)。\n\
  \n本章的剩余部分将对你可能会遇到并想要学习的一些常用且实用命令进行简要介绍，并根据用途进行分类。最后，我们将列出其他供进一步研究的资源列表。\n\n## 在文件系统中移动\n\
  \n用于在文件系统中导航的命令包括以下：\n\n![Image](img/image00259.jpeg) **pwd:** `pwd` 命令允许你知道当前所在的目录（`pwd`\
  \ 代表“打印工作目录”）。例如，在桌面目录下运行 `pwd` 将显示 `~/Desktop`。注意，GNOME 终端也会在其窗口的标题栏中显示此信息。\n\n\
  ![Image](img/image00259.jpeg) **cd:** `cd` 命令允许你切换目录。当你打开终端时，你将位于主目录。要在文件系统中移动，请使用\
  \ `cd`。\n\n![Image](img/image00259.jpeg) 使用 `cd ~/Desktop` 导航到你的桌面目录。\n\n![Image](img/image00259.jpeg)\
  \ 使用 `cd /` 导航到根目录。\n\n![Image](img/image00259.jpeg) 使用 `cd` 导航到你的主目录。\n\n![Image](img/image00259.jpeg)\
  \ 使用 `cd ..` 导航到上一级目录。\n\n![Image](img/image00259.jpeg) 使用 `cd -` 导航到上一个目录（或返回）。\n\
  \n![Image](img/image00259.jpeg) 如果你想直接跳转到一个特定的已知目录位置，请使用 `cd /directory/otherdirectory`。例如\
  \ `cd/directory/otherdirectory`。\n\n### 操作文件和文件夹\n\n可以使用以下命令操作文件和文件夹：\n\n![Image](img/image00259.jpeg)\
  \ **cp:** `cp` 命令为你创建一个文件的副本。例如，`cp file foo` 会为你输入的文件创建一个完全副本并命名为 foo，但第一个文件仍然存在。\n\
  \n![Image](img/image00259.jpeg) **mv:** `mv` 命令将文件移动到不同位置或重命名文件。示例如下：`mv file foo`\
  \ 将原始文件重命名为 foo。`mv foo ~/Desktop` 将文件移动到你的桌面目录但不重命名。重命名文件必须指定一个新的文件名。在使用 `mv` 后，原始文件不再存在；但在使用\
  \ `cp` 后（如前所述），该文件继续存在并创建了副本。\n\n![Image](img/image00259.jpeg) 为了减少输入，你可以用 `~` 代替主目录，因此\
  \ `/home/username/pictures` 等于 `~/pictures`。\n\n注意\n\n如果你在使用 `sudo` 执行 `mv`（这在主目录之外通常是必要的），你将无法使用\
  \ `~` 快捷方式。相反，你必须使用文件的完整路径。\n\n![Image](img/image00259.jpeg) **rm:** 使用此命令删除目录中的文件，例如\
  \ `rm file.txt`。它不适用于包含文件的目录，目录必须先清空，然后可以使用 `rmdir` 命令删除。\n\n![Image](img/image00259.jpeg)\
  \ **ls:** `ls` 命令显示当前目录下的文件。配合某些选项使用时，它可以让你查看文件大小、创建时间以及文件权限。例如，`ls ~` 将显示你主目录中的文件。\n\
  \n![Image](img/image00259.jpeg) **mkdir:** `mkdir` 命令允许你创建目录。例如，`mkdir music` 会创建一个音乐目录。\n\
  \n\n\n\n\n![Image](img/image00259.jpeg) **chmod:** `chmod` 命令用于更改列出的文件的权限。权限基于一个非常简单的模型。你可以为用户、组和其他世界（所有人）设置权限，并指定他们各自是否可以读取、写入和/或执行该文件。例如，如果允许所有人读取文件，但只有用户可以写入该文件，则权限将显示为\
  \ `rwxr—r—`。要添加或删除权限，可以在特定权限前加上加号（`+`）或减号（`-`）。例如，要允许用户组编辑上一个示例中的文件，你可以输入 `chmod\
  \ g+w file`。\n\n![Image](img/image00259.jpeg) **chown:** `chown` 命令允许用户更改文件的用户所有者和组所有者。例如，`sudo\
  \ chown jim file` 将文件的所有者更改为 Jim。\n\n### 系统信息命令\n\n系统信息命令包括以下内容。\n\n![Image](img/image00259.jpeg)\
  \ **df:** `df` 命令显示所有分区的系统磁盘空间使用情况。`df -h` 命令可能是最有用的。它使用兆字节（`M`）和千字节（`G`）而不是块来报告（`-h`\
  \ 表示“人类可读”）。\n\n![Image](img/image00259.jpeg) **free:** `free` 命令显示系统中空闲和已用内存量。例如，`free-m`\
  \ 使用兆字节信息，这对于目前的计算机可能最有用。\n\n![Image](img/image00259.jpeg) **top:** `top` 命令显示你的\
  \ Linux 系统、运行进程和系统资源的信息，包括 CPU、RAM、交换分区使用情况以及运行的任务总数。要退出 `top`，按 Q。\n\n![Image](img/image00259.jpeg)\
  \ **uname -a:** `uname` 命令配合 `-a` 选项打印所有系统信息，包括机器名称、内核名称、版本以及其他一些细节。此命令对于检查你正在使用哪个内核最有用。\n\
  \n![Image](img/image00259.jpeg) **lsb_release -a:** `lsb_release` 命令配合 `-a` 选项打印你正在运行的\
  \ Linux 版本的版本信息。例如：\n\n点击此处查看代码图像\n\n```\nusername@computer:~$ lsb_release -a\n\n\
  No LSB modules are available.\n\nDistributor ID: Ubuntu\n\nDescription:     Ubuntu\
  \ 12.04\n\nRelease:         12.04\n\nCodename:       precise\n```\n\n![Image](img/image00259.jpeg)\
  \ **ifconfig:** `ifconfig` 命令报告你系统的网络接口。\n\n![Image](img/image00259.jpeg) **iwconfig:**\
  \ `iwconfig` 命令显示你任何无线网络适配器及其特定的无线信息，如速度和网络连接情况。\n\n![Image](img/image00259.jpeg)\
  \ **ps:** `ps` 命令允许你查看在机器上运行的所有进程。\n\n以下命令列出了你计算机上的硬件，可以是特定类型或通过特定方法列。当硬件运行不正常时，这些命令对于调试最有用。\n\
  \n![Image](img/image00259.jpeg) **lspci:** `lspci` 命令列出所有 PCI 总线及其连接到其上的设备。这通常包括网卡和声卡。\n\
  \n![Image](img/image00259.jpeg) **lsusb:** `lsusb` 命令列出所有 USB 总线和任何连接的 USB 设备，如打印机和优存盘。\n\
  \n![Image](img/image00259.jpeg) **lshal:** `lshal` 命令列出硬件。\n\n### 搜索与编辑文本\n\n以下命令用于搜索和编辑的文本，可以是特定类型或通过特定方法。\n\
  \n![Image](img/image00259.jpeg) **grep:** `grep` 命令允许你从文本中搜索模式。\n\n\n\n\n\n几乎所有的命令都支持\
  \ `-h`（或 `--help`）选项，该选项会生成该命令及其选项的简短用法说明，然后返回到命令行提示符。尝试运行 `man -h` 或 `man --help`\
  \ 来查看效果。\n\nLinux 中的每条命令和几乎每个应用程序都有一个 `man`（手册）文件，因此查找此类只需输入 `man` 命令即可显示指定命令的更详细手册条目。例如，`man\
  \ mv` 会显示 `mv`（移动）手册。\n\n以下是一些使用 `man` 命令的实用提示。\n\n![Image](img/image00259.jpeg)\
  \ **方向键：** 使用方向键向上或向下移动 man 文件。\n\n![Image](img/image00259.jpeg) **q：** 输入 `q` 退出返回命令行提示符。\n\
  \n![Image](img/image00259.jpeg) **man man：** `man man` 会显示 `man` 命令的手册条目，这是一个非常好的开始点！\n\
  \n![Image](img/image00259.jpeg) **man intro：** `man intro` 特别有用。它显示《用户命令介绍》（Introduction\
  \ to User Commands），这是一份关于 Linux 命令行编写良好且相当简洁的介绍。\n\n还有 info 页面，通常提供比 man 页面更深入的信息。尝试\
  \ `info info` 来查看 info 页的介绍。\n\n### 查找 Man 文件\n\n如果你不确定需要使用哪个命令或应用程序，可以尝试搜索 man\
  \ 文件。\n\n![Image](img/image00259.jpeg) **man -k foo：** 这会在 man 文件中搜索 foo。尝试 `man\
  \ -k nautilus` 来查看它是如何工作的。\n\n***\n\n注意\n\n`man -k foo` 等于 `apropos` 命令。\n\n***\n\
  \n![Image](img/image00259.jpeg) **man -f foo：** 这仅搜索你系统中 man 文件的标题。例如，尝试 `man -f\
  \ unity`。\n\n***\n\n注意\n\n`man -f foo` 等于 `whatis` 命令。\n\n***\n\n### 使用通配符\n\n有时你可能需要同时查看或使用多个文件。例如，你可能想删除所有的\
  \ .rar 文件或将所有的 .odt 文件移动到另一个目录。坦率地说，你可以使用一系列通配符来完成此类任务。\n\n![Image](img/image00259.jpeg)\
  \ `*` 匹配任意数量的字符。例如，`*.rar` 匹配任何以 .rar 结尾的文件。\n\n![Image](img/image00259.jpeg) `?`\
  \ 匹配任意单个字符。例如，`?.rar` 匹配 a.rar 但不匹配 ab.rar。\n\n![Image](img/image00259.jpeg) `[*characters*]`\
  \ 匹配括号内的任何字符。例如，`[ab].rar` 匹配 a.rar 和 b.rar 但不匹配 c.rar。\n\n![Image](img/image00259.jpeg)\
  \ `[!characters*]` 匹配任何未列出的字符。例如，`[!ab].rar` 匹配 c.rar 但不匹配 a.rar 或 b.rar。\n\n###\
  \ 执行多条命令\n\n通常你可能想一起执行几个命令，通过一个接一个运行它们，或者通过将一个命令的输出传递给另一个命令。\n\n#### 顺序执行\n\n如果你需要顺序执行多个命令，但不需要在它们之间传递输出，有两种选择，取决于后续命令是否仅在前一个命令成功时运行（或不运行）。如果你希望命令无论前面的命令是否成功都一个接一个运行，请在命令之间放置分号（`;`）。例如，如果你想获取有关硬件的信息，可以运行\
  \ `lspci; lsusb`，这将按顺序输出你的 PCI 总线和 USB 设备的信息。\n\n然而，如果你需要根据前一个命令是否成功来条件条件运行命令，请在命令之间插入\
  \ `&&`。这方面的例子是从源码构建程序，传统上通过 `./configure`、`make` 和 `sudo make install` 完成。命令 `make`\
  \ 和 `sudo make install` 要求前一个命令已成功完成，因此你应该使用 `./configure && make && sudo make install`。\n\
  \n#### 使用 Byobu 管理你的终端\n\n使用终端的挑战之一是难以管理多个屏幕。如果你在桌面环境中，可以启动另一个终端窗口或使用 GNOME 终端的标签页，但如果你位于没有安装桌面环境的服务器或其他机器上，那么该策略将不起作用。\n\
  \n幸运的是，确实有这样一个帮助你的工具：`byobu`。byobu 在日语中意为“双屏”，它是 GNU `screen` 命令的一组默认配置。本质上，screen\
  \ 是命令行的窗口管理器。要安装 byobu，输入 `sudo apt-get install byobu`。\n\n启动 byobu 后，你会发现自己回到了终端提示符，但有几处不同。底部有两行信息。从左到右，底行显示了你当前运行的\
  \ Ubuntu 版本、需要更新的包数量（如果没有，则不会显示）、系统运行时间、系统负载、CPU 速度、当前内存使用情况以及当前日期时间。上方栏显示已打开的窗口列表、当前登录用户、系统名称和菜单选项（图\
  \ 7-4）。\n\n![Image](img/image00375.jpeg)\n\n**图 7-4** GNOME 终端中的 Byobu\n\n你现在可以像往常使用终端，只是多了一些信息。byobu（以及\
  \ screen）的高级用法在本章中范围太大了，但这里描述了一些命令供你入门：\n\n![Image](img/image00259.jpeg) **F2：**\
  \ 打开新终端。\n\n![Image](img/image00259.jpeg) **F3/F4：** 在窗口列表中前后移动。\n\n![Image](img/image00259.jpeg)\
  \ **F6：** 断离当前 byobu 会话。要重新连接，使用 `byobu -x`。\n\n![Image](img/image00259.jpeg) **F7：**\
  \ 回滚输出。按 Esc 退出此模式并返回命令行提示符。\n\n![Image](img/image00259.jpeg) **F8：** 设置窗口标题。\n\n\
  ![Image](img/image00259.jpeg) **F9：** 启动菜单。\n\n#### 在 GNOME Terminal 中默认使用 Byobu\n\
  \n要让 GNOME 终端在启动时默认运行 byobu，你需要编辑设置（位于编辑 > 首选项 > 标题标签页）。勾选“运行自定义命令代替我的 shell”，并在下方输入\
  \ `byobu`。现在当你启动 GNOME 终端时，byobu 会随之启动，关闭 byobu 也会关闭 GNOME 终端。\n\n### 转向更高级的命令行用法\n\
  \n有很多关于命令行的好书。此外，由于大部分命令行多年没有变化，互联网上有大量的信息。如果你需要某些方面的帮助，通常只需搜索该命令就能找到你需要的。\n\n正如你所想象的，系统上有成百上千种命令，我们在这里无法涵盖它们。许多优秀的网站和书籍可以帮助你发现许多不同的命令。\n\
  \n为了让你入门，这里是一些建议：\n\n![Image](img/image00259.jpeg) ***The Official Ubuntu Server\
  \ Book, third edition***，Kyle Rankin 和 Benjamin Mako Hill 著（Prentice Hall, 2013）是学习服务器相关内容的优秀资源，包括有效使用命令行完成管理任务。\n\
  \n![Image](img/image00259.jpeg) ***A Practical Guide to Linux® Commands, Editors,\
  \ and Shell Programming, third edition***，Mark G. Sobell 著（Prentice Hall, 2012）是任何\
  \ Linux Shell 用户书架上必备的一本好书。\n\n![Image](img/image00259.jpeg) ***Ubuntu Unleashed\
  \ 2014***，Matthew Helmke 著（SAMS 2013），他也是本书的主作者，是面向中高级用户或希望成为该层级用户的顶尖的、内容全面的 Ubuntu\
  \ 教程。\n\n\n\n\n![Image](img/image00259.jpeg) `LinuxCommand.org` 位于 [`linuxcommand.org`](http://linuxcommand.org)，是一个旨在帮助初学者使用命令行的实用网站。\n\
  \n![Image](img/image00259.jpeg) `The Linux Documentation Project` 位于 [`www.tdlp.org`](http://www.tdlp.org)，是另一个高质量的免费资源。\n\
  \n### 总结\n\n对于初学者来说，命令行可能有点令人生而畏，但事实并非如此。当你花时间去理解它的强大之处以及你所可用命令背后的逻辑时，你就开始发现 Linux\
  \ 的真正威力。优雅、高效以及以新方式组合命令的能力，使得命令行成为你一旦学会了基础知识就会发现它不可或缺的工具。\n\n# 第 8 章：Ubuntu Server\n\
  \n![Image](img/image00260.jpeg) 什么是 Ubuntu Server？\n\n![Image](img/image00260.jpeg)\
  \ 安装 Ubuntu Server\n\n![Image](img/image00260.jpeg) Ubuntu 包管理\n\n![Image](img/image00260.jpeg)\
  \ Ubuntu Server 安全\n\n![Image](img/image00260.jpeg) 高级主题\n\n![Image](img/image00260.jpeg)\
  \ 总结\n\nUbuntu 4.10 是 Ubuntu 的第一个公共版本。它的安装媒体没有提供明显的方法来安装不带完整桌面环境的骨干操作系统。系统管理员们天生容易聚集且脾气火爆，他们对此非常恼火：他们宣称\
  \ Ubuntu 只是一个桌面发行版，并轻蔑地回到了他们的山穴。\n\n下一个发布的 Ubuntu 版本 5.04 解决了这个问题，允许简易地安装适用于服务器的极简\
  \ Ubuntu 版本。然而，Ubuntu 是纯桌面导向发行版的这种神话依然存在。\n\n幸运的是，这种情绪仅仅是——神话。今天的 Ubuntu 是一个世界级的服务器平台，提供了你对服务器操作系统所预期的一切，并带有让\
  \ Ubuntu 与众不同的人情味。Ubuntu Server 团队的黑客负责硬件支持和测试的细微细节，无情地折磨最新版本的服务器软件以确保其符合纳入发行版的标准，寻找向服务器领域推动创新的方法，并随时为像你这样的用户提供反馈、问题和痛苦的诉求。\n\
  \n尽管如此，搭建服务器并不是一项轻的任务。服务器管理员不断地处理系统安全、容错和数据安全等复杂问题，虽然 Ubuntu 让这些问题的处理变得更加愉快，但不能掉以轻心。因此，本章的目的不是教你如何成为一名系统管理员——我们可以很容易写上十本书来尝试这样做——而是给你提供一个快速的入门课程。我们还强调了让\
  \ Ubuntu Server 区别于其他服务器平台的特定细节，提供了一些最常见服务器用处的提示，并指引你在哪里寻找其他相关信息。\n\n### 什么是 Ubuntu\
  \ Server？\n\n到目前为止，首次遇到 Ubuntu Server 的用户最常见的反应是完全且绝望的困惑。人们并不清楚 Ubuntu Server 是一个全新的发行版、一个像\
  \ Kubuntu（仅用于服务器）那样的 Ubuntu 变体，还是完全其他。\n\n让我们澄清一下。Ubuntu 及其变体的主要软件库被称为 Ubuntu 存档（Ubuntu\
  \ archive）。该存档仅仅是 Debian `deb` 格式软件包的集合，它包含了组成 Ubuntu、Edubuntu、Xubuntu、Kubuntu 和\
  \ Ubuntu Server 等变体的每一个包。那么，让 Kubuntu 区别于 Ubuntu 的，仅仅是其安装程序默认安装且其 DVD 携带的一组包。\n\n\
  Ubuntu Server 也不一样。它依赖于与标准 Ubuntu 发行版完全相同的存档，但它安装了一套独特的默认包。值得注意的是，构成 Ubuntu Server\
  \ 的包集非常小。安装程序默认不会安装图形化环境或许多用户程序。但由于 Ubuntu Server 的所有包都来自同一个官方 Ubuntu 存档，你稍后可以安装你喜欢的任何包。理论上，没有什么能阻止你将\
  \ Ubuntu Server 的安装转换为普通的 Ubuntu 桌面安装，反之亦然（在实践中，这很棘手，我们不建议你尝试）。你甚至可以从运行 Kubuntu\
  \ 变为运行 Ubuntu Server。存档范式赋予了你最大的灵活性。\n\n我们已经确定了 Ubuntu Server 提供的与 Ubuntu 不同的默认包。但这组不同的包有什么重要？是什么让\
  \ Ubuntu Server 成为一个服务器平台？\n\n最显著的区别是自定义的服务器内核。该内核采用 100Hz 的内部定时器频率而不是桌面默认的 250Hz，使用\
  \ deadline I/O 调度器而不是桌面的 CFQ 调度器，并包含了一系列针对虚拟化、内存支持和路由的其他微调。我们将为你跳过操作系统理论：其想法是为服务器应用程序提供额外的性能和吞吐量。此外，服务器内核支持基本的\
  \ NUMA，这是一种某些多处理器系统中的内存设计，可以大幅提高多处理性能。\n\n那么 Ubuntu Server 还有什么不同？除了服务器内核和一组最小包，没多少。尽管\
  \ Ubuntu 已经在多个版本中支持了极简安装模式，但将 Ubuntu Server 拆分为一个真正独立的独立仍然是一项年轻的尝试，但这项工作进展得非常快。\n\
  \n从 Ubuntu Server 6.06 LTS 开始，Ubuntu Server 为 Red Hat Cluster Suite、Red Hat 的全局文件系统\
  \ (GFS)、Oracle 的 OCF2 文件系统以及 Linux 虚拟服务器工具：`keepalived` 和 `ipvsadm` 提供了官方支持的包。结合专门的服务器内核，这些部分已经让你能够使用\
  \ Ubuntu Server 完成一些重型任务。而且有一系列日益增长的强大功能，包括内置虚拟化、通过 Samba 与网络上的 Windows 机器互操作性、配置文件的自动版本控制、对\
  \ LDAP 目录服务的支持、网络硬盘复制，甚至包含了大量的最新热门词汇——云计算。\n\n### 安装 Ubuntu Server\n\n现在，你已经从 [`releases.ubuntu.com/14.04/`](http://releases.ubuntu.com/14.04/)\
  \ 下载了服务器包并将其刻录，迫不及待地将其放入 CD 驱器，并重启机器，看到友好的 Ubuntu 菜单。第一个选项“安装 Ubuntu Server”标志着通往你自己的系统管理员山穴之旅的开始。\n\
  \n很久以前，安装 Ubuntu Server 的过程与安装桌面相同。两种安装都是通过文本安装器完成的，这是一种红蓝屏幕和文字组成的、迷人的古朴组合。此后，桌面版本的安装程序被漂亮的图形化环境取代，让你可以直接从安装\
  \ CD 运行一个完全可用的设置。但 Server CD 保留了红色和蓝色；因为文本安装器不依赖于自动检测挑剔的显卡，所以它几乎肯定可以在你获取的任何硬件上运行。而当你正在安装服务器时，这比世界上所有的视觉效果都更有价值。\n\
  \n在这里，我们将介绍一些特别针对服务器用户的高级文本安装器功能。\n\n\n\n\n\n当你到达安装程序的分区部分时，精彩的内容才刚刚开始。对于台式机，你可能会让安装程序自动配置一组基础分区，然后让它自个去忙。但对于服务器来说，情况会变得复杂一些。\n\
  \n### 安装程序的一些小技巧\n\n正如我们在下面将探索的那样，在分区和存储方面，服务器的安装可能比桌面版复杂得多。安装程序自带了一些实用的技巧，在情况棘手时可以提供帮助。\n\
  \n安装程序本身运行在虚拟控制台 1 上。如果你按下 `Alt-F2` 切换到控制台 2，可以通过按下 `Enter` 激活控制台并进入一个极简主义的（busybox）shell。这将允许你探索整个安装环境，并在必要时亲自处理某些问题。你可以按下\
  \ `Alt-F1` 回到安装程序控制台。控制台 4 包含一个正在运行的非交互式安装日志文件，你可以通过 `Alt-F4` 进行检查。最后，在安装期间能够连接到另一台服务器有时很有用，例如上传日志文件或访问你的邮箱或其他通信工具。默认情况下，控制台\
  \ 2 上的 shell 不为你提供 ssh 客户端，但在安装程序配置网络后，你可以运行 `anna-install openssh-client-udeb`\
  \ 来安装一个。现在，你可以使用 `ssh` 和 `scp` 二进制文件登录或向选择的服务器拷贝数据。\n\n### 为你的 Ubuntu 服务器分区\n\n\
  决定如何为服务器分区是一件棘手的事情，绝不是什么精确的科学。通常，至少有三个与系统其余部分分开的分区是个好主意：\n\n![Image](img/image00259.jpeg)\
  \ /home: 用户文件存放的地方\n\n![Image](img/image00259.jpeg) /tmp: 运行程序的临时空间\n\n![Image](img/image00259.jpeg)\
  \ /var: 邮件队列和日志文件\n\n提示：分区安全以及日志与队列的分离\n\n对于特定的系统分区，你可以开启某些选项，以获得提供额外的安全性。我们将在本章稍后的安全部分解释这些选项。\n\
  \n顺便提一下，如果你的服务器将保存大量的邮件和新闻队列，你可能希望将 `/var` 进一步划分为 `/var/log` 和 `/var/spool` 分区。如果它们都在同一个分区上，在重度使用下可能会导致严重的\
  \ I/O 拥堵。\n\n将数据保留在独立的分区上，让你作为管理员对特定用途有更广泛的文件系统选择。例如，你可能选择将 `/tmp` 放在 ReiserFS 上，因为它对目录中的大量文件处理得更好，且在小文件上性能优异；但你可能将\
  \ `/home` 和 `/var` 保留在 `ext3` 上以利用其稳如磐石的稳定性，或者使用默认的 `ext4` 文件系统作为两者之间的良好折中。\n\n\
  此外，独立的 `/home` 分区允许你在挂载到系统时使用特殊选项，例如实施磁盘空间配额或对用户数据启用扩展安全。将 `/tmp` 和 `/var` 与系统其余部分分开的原因要普通得多：这些目录很容易填满。`/tmp`\
  \ 就是此类情况，因为它是一个临时写板，管理员通常会给那里的用户非常慷慨的配额（例如，有一项策略是清除 `/tmp` 中所有于两天的所有用户数据），这意味着 `/tmp`\
  \ 很容易被堵塞。相比之下，`/var` 存储日志文件和邮件队列，这两者都可能因为恶意活动或正常系统使用量的激增而占用大量的磁盘空间。\n\n成为系统管理员意味着你必须学会像他们一样思考。如果\
  \ `/tmp` 和 `/var` 很容易被填满，你就将它们进行隔离，以免它们最终耗尽你服务器上所有的可用磁盘空间。\n\n### RAID 的故事\n\n如果你的服务器中只有一个硬盘，请尽管跳过此处。否则，让我们谈谈如何利用那些额外的硬盘。RAID\
  \ 的缩写代表“冗余磁盘阵列”（redundant array of inexpensive disks），尽管如果你是一个商人，可以用“独立的”（independent）代替“廉价的”（inexpensive）。我们原谅你。如果你在法国，RAID\
  \ 是“cherche assistance intervention dissuasion”（搜索援助干阻）的缩写，那是国家警察的一支精英突击队——但如果你需要帮助的是那个\
  \ RAID，那你读错书了。我们认为 RAID 对数据来说只是一个非常棒的主意：在处理你的信息时，它提供了额外的速度、容错能力或两者兼顾。\n\nRAID 的核心只是在多个物理驱动器上复制相同信息的方法。该过程可以通过多种方式设置，特定类型的驱动器配置被称为\
  \ RAID 级别。如今，即使是中低服务器也配备了集成硬件 RAID 控制器，它们可以在无需操作系统任何支持的情况下运行。如果你的新服务器没有带 RAID 控制器，你可以使用\
  \ Ubuntu 内核中的软件 RAID 功能来实现相同的目标。\n\n在安装 Linux 系统时设置软件 RAID 在不久前仍然困难且笨拙，但现在已是轻而易举。Ubuntu\
  \ 安装程序为此提供了一个美观、方便的界面，并处理了所有必要的后台魔法。你可以从三个 RAID 级别中选择：0、1 和 5。\n\n#### RAID 0\n\n\
  所谓的“条带集”（striped set），RAID 0 允许你将多个独立驱动器的存储空间合并为一个大型虚拟驱动器。需要记住的一点是，RAID 0 并没有实际上连接物理驱动器——相反，它将数据均匀地分布在这些驱动器上，这意味着每个驱动器使用的空间不会超过最小那个驱动器的容纳量。在实际操作中，如果你有两个\
  \ 250GB 的硬盘和一个 200GB 的硬盘，总空间将是 600GB；较大硬盘上的每个有 50GB 将被闲置。以这种方式散布数据提供了惊人的性能，但也显著降低了可靠性。如果你\
  \ RAID 0 阵列中的任何一个驱动器故障，整个阵列将会崩溃，并将你的数据一并带走。\n\n#### RAID 1\n\n这种级别提供了非常直接的复制。它将取一个物理驱动器的内容并将其复用到任意数量的驱动器上。RAID\
  \ 1 阵列的大小不会随着额外硬盘的增加而增长；相反，它的可靠性和读取性能会提高。整个阵列的大小取决于其最小驱动器的大小。\n\n#### RAID 5\n\n\
  如果你的存储的首要目标是容错能力，并且你希望使用比 RAID 1 中单个物理驱动器提供的更多的空间，那么这就是你想要使用的级别。RAID 5 允许你使用相同大小物理驱动器（如果存在不同大小的驱动器，则每个驱动器使用的空间不会超过最小的一个的大小）来构建一个阵列，其总可用空间为\
  \ *n-1* 个驱动器的空间，且阵列可以容忍单个（但最多不超过一个）驱动器的故障而不丢失数据。\n\n提示：神话中的校验盘\n\n如果你将五块 200GB 的硬盘丢进\
  \ RAID 5 阵列中，该阵列的总可用空间将是 800GB，即四块硬盘的大小。这让人很容易错误地认为 RAID 5 阵列“牺牲”了一个驱动器来维护冗余和校验，但事实并非如此。通过伽罗瓦域上多项式系数的巧妙数学方法，实际的校验信息被均匀分布在所有驱动器上，允许任何单个驱动器故障而不影响数据。别担心，我们不会考你这些数学知识的。\n\
  \n#### 如何选择哪种 RAID？\n\n\n\n\n如果你天生就优柔不决，那么过去的几段话可能让你局促地缩在椅子里，无情地咬着那支 2 号铅笔，脚尖紧张地敲着地板。幸运的是，RAID\
  \ 级别的初始选择通常是不费脑筋的，所以你只需要把犹豫不决用在别处。如果你只有一个硬盘，那就不要用 RAID 了。不要通过起点，不要领取那 200 美元。两块硬盘？把它们丢进\
  \ `RAID 1`，晚上就能睡得安稳些。三块或更多？`RAID 5`。除非你真的知道自己在做什么，否则要像避瘟疫一样避开 `RAID 0`。如果你不是主要提供只读数据且不在乎冗余，那么\
  \ `RAID 0` 并不是你想要的。\n\n### 提示：其他 RAID 模式\n\n虽然安装程序仅提供了常见的 RAID 模式——0、1 和 5——但还有许多其他\
  \ RAID 模式，可以在安装后进行配置。请查看 [`en.wikipedia.org/wiki/RAID`](http://en.wikipedia.org/wiki/RAID)\
  \ 以获取所有模式的详细解释。\n\n### 设置 RAID\n\n在仔细研究了最后一节之后，可能又读了几关于抽象代数的书和几本关于有限域理论的书，你终于决定了一个适合自己的\
  \ RAID 级别。由于书籍还无法读取你的心术，我们假设你选择了 `RAID 1`。那么你如何设置它呢？\n\n回到安装程序。当提示对磁盘进行分区时，你会勇敢地选择最后一个选项，`手动编辑分区表`（Manually\
  \ Edit Partition Table）。\n\n在屏幕上前两个选项（`引导分区`和`帮助`）下方，你将看到 Ubuntu 安装程序检测到的服务器中的物理驱动器列表。\n\
  \n### 提示：避免“哦，不！”的时刻\n\n我们以前说过过，现在还会说一遍：在对系统分区时，很容易误删宝贵的数据。然而，由于你正在安装一台服务器，我们假设你习惯删除硬盘上可能已经存在的任何数据。如果情况并非如此，现在备份所有你关心的数据！我们认真的。\n\
  \n在每个硬盘下方缩进处，你将找到任何现有分区的列表，以及它们在磁盘上的序号、大小、可启动状态、文件系统类型，以及可能的挂载点。使用方向键高亮摘要物理驱动器的行（而不是它的任何分区），并按\
  \ `Enter`。系统将要求你确认用新分区表替换任何现有分区表。选择 `Yes`，该硬盘下方列出的唯一条目将是 `FREE SPACE`（空空间）。在我们虚构的服务器中，有两个\
  \ 80GB 的硬盘——`hda` 和 `hdb`——所以我们将对两个硬盘都遵循此过程，为每个硬盘提供全新的分区表。假设我们决定创建一个 20GB 的 `/home`\
  \ 分区。方向键移动到 `FREE SPACE`，按 `Enter` 并创建分区。一旦输入了新分区的尺寸，你将进入一个可以在其中选择文件系统和挂载选项的对话框。然而，你不想直接在原始分区上放置文件系统，而是要进入`用作`（Use\
  \ As）对话框并将新分区设置为 `RAID` 的物理卷。\n\n还在坚持吗？现在对另一个硬盘重复此操作：创建一个完全相同大小的分区，将其设置为 `RAID`\
  \ 卷。完成后，你应该回到了初始分区界面，并且在每个硬盘下都应该有一个大小相同的分区。此时，在屏幕顶部选择`配置软件 RAID`（Configure Software\
  \ RAID），在需要时同意将更改写入存储设备，然后选择创建一个 `MD`（多磁盘）设备。在选择 `RAID 1` 后，系统会要求你输入阵列的活动设备数量。在我们虚构的双硬盘服务器中，数量是\
  \ 2。下一个问题涉及阵列中备用设备的数量，你可以留为零。现在只需使用空格键在你创建的两个分区（`hda1` 和 `hdb1`）旁边打钩，并在`多磁盘`（Multidisk）对话框中点击`完成`以返回基础分区器。\n\
  \n如果你查看之前使用的两个物理驱动器下方，你会注意到一个新的驱动器，即 `软件 RAID` 器设备，它下方有一个分区。那就是你未来的 `/home` 分区，快乐地运行在\
  \ `RAID` 阵列上。如果你方向键移动到它并按 `Enter`，你现在就可以像配置真实分区一样配置它了。\n\n对于任何其他你想放入 `RAID` 的分区，过程都是相同的。在所有参与的物理硬盘上创建相同大小的分区，选择将它们作为\
  \ `RAID` 空间，进入多磁盘配置器（`software RAID`），最后创建一个使用实际分区的阵列。然后在新创建的阵列上创建文件系统。\n\n### 提示：阵列故障与备用设备\n\
  \n当运行提供冗余的 RAID 级别（例如 1 级或 5 级）发生物理硬盘故障时，阵列会进入所谓的降级模式（千万不要对你的 `RAID` 阵列辱骂或残忍！）。取决于阵列中设备的数量，在降级模式下可能只是性能影响，但也可能意味着另一个物理硬盘的故障将导致整个阵列崩溃并引起数据完全丢失。要从降级模式恢复阵列，你需要向系统添加一个工作正常的物理硬盘（旧的可以移除），并指令阵列使用新设备进行“重构”。\n\
  \n为了尽可能地减少阵列处于降级模式的时间，并防止在服务器不支持热插拔的情况下插入新物理硬盘，你可以将额外的硬盘放入机器并将其标记为`热备用`（hot spares），这意味着系统会在故障发生前保持其激活状态。`冷备用`（Cold\
  \ spares）正如其名，是指放在架子上的额外硬盘，直到故障发生时才手动将它们添加到阵列中。\n\n就是这些！Ubuntu 安装程序将处理在正确时间启动并使用\
  \ RAID 阵列的所有讨厌细节，即使你选择将根分区放在阵列上。现在让我们看看 Ubuntu 安装程序的另一个强大功能：逻辑卷管理（lvm）。\n\n####\
  \ 逻辑卷管理器的故事\n\n让我们从 RAID 冒险中退后一步，看看数据存储的大局。整个局面都很糟糕。硬盘很慢且经常故障，尽管分区早早已从内存中被废除，但固定大小分区仍然存储空间分配的主流模式。如果担心速度和数据丢失还不够，你还必须担心在安装服务器时分区大小计算是否准确，或者你是否会陷入分区空间不足的窘境，尽管另一个分区可能大部分处于闲置状态。\n\
  \n\n非常酷，而且通过 LVM 可以轻松实现。这是一种将存储的基本单位从物理驱动器转移到虚拟或逻辑驱动器的系统（尽管我们怀疑“逻辑”（logical）一词是对存储现状的讽刺，但事实并非如此）。LVM\
  \ 传统上一直是昂贵的企业级 UNIX 操作系统的特性，或者需要从第三方供应商购买。在自由软件的魔法下，一个名叫 Heinz Mauelshagen 的人在 1998\
  \ 年为 Linux 写了一个逻辑卷管理器的实现。从那时，LVM 经历了巨大的改进，并在今天的生产环境中被广泛使用。正如你预期的那样，Ubuntu 安装程序让你轻松地在安装期间在服务器上配置它。\n\
  \n## LVM 理论与术语\n\n理解 LVM 比 RAID 稍微困难一点，因为 LVM 重新思考了处理存储的整个方式，这在预料之中引入了一些你需要学习的术语。在\
  \ LVM 中，物理卷（`PVs`）仅被视为磁盘空间的提供者，没有任何内在的组织结构（例如映射到操作系统挂载点的分区）。我们将 `PVs` 分组成卷组（`VGs`），这些是虚拟存储池，看起来就像老式的、模具化出来的硬盘。我们将它们划分成逻辑卷（`LVs`），它们的作用就像我们习惯处理的普通分区。我们在这些\
  \ `LVs` 上创建文件系统并将其挂载到我们的目录树中。在后台，LVM 将物理卷拆分为较小的字节块（默认为 `4MB`），每个块被称为物理扩展区（`PE`）。\n\
  \n好了，那是一连串缩写词，但只要你理解了这种演进过程，就没问题了。你取一个物理硬盘，并在上面设置一个或多个用于 LVM 的分区。这些分区现在就成了物理卷，它们被拆分为物理扩展区，然后分组到卷组中，在卷组之上，你最终创建了逻辑卷。是\
  \ `LVs`——这些虚拟分区，而不是物理硬盘上的分区——承载了文件系统，并映射且挂载到操作系统中。如果你真的困惑于增加这么多复杂性最终却只得到相同固定大小的分区到底能带来什么好处，请耐心一下。几秒钟后你就会明白了。\n\
  \nLVM 将物理卷拆分为较小的、等大的物理扩展区的原因是，这样卷组的定义（将要划分成逻辑卷的空间）就变成了“物理扩展区的集合”，而不是像旧式分区那样的“物理硬盘上的物理区域”。注意，“扩展区的集合”并没有说明这些扩展区从何而来，也绝没有对卷组的大小施加固定限制。我们可以从多个不同的驱动器中获取\
  \ `PEs`并将它们丢进一个卷组中，这解决了我们将分区从物理驱动器中抽象出来的的需求。我们可以通过通过向 `VG` 添加几个扩展区来让它变大，也许可以从另一个\
  \ `VG` 获取，也许可以通过丢入一个新的物理卷并使用那里的扩展区来完成。我们还可以通过只需告诉 `VG` 重新定位到不同的扩展区集合，从而将其移动到不同的物理存储上。最棒的是，我们可以在线完成所有这些，而无需任何服务器停机。\n\
  \n你闻到那个味道了吗？那是存储革命的新鲜气息。\n\n## 设置 LVM\n\n到这里，你一定已经确信 LVM 是自切片面包以来最棒的东西。事实如此——而且令人惊讶的是，在安装期间设置它并不比设置\
  \ RAID 更难。在在你想要用于 LVM 的每个物理硬盘上创建分区，就像你对 RAID 做的那样，但告诉安装程序将它们作为 LVM 的物理空间。注意，在这种语境下，`PVs`\
  \ 并不是实际物理硬盘；它们是你创建的分区。\n\n你不需要将整个硬盘都投入到 LVM 分区中。如果你愿意，完全可以在用于 LVM 的存储分区旁边创建包含实际文件系统的分区，但请确保在继续之前对你的分区选择感到满意。一旦你进入安装程序中的\
  \ LVM 配置器，所有包含 LVM 分区的硬盘上的分区布局都将被冻结。\n\n让我们回到我们的虚构服务器，但给它配备四块硬盘，大小分别为 `10GB`、`20GB`、`80GB`\
  \ 和 `120GB`。假设我们想使用每个驱动器上的所有可用空间创建一个 LVM 分区（或 `PV`），然后将前两个 `PVs` 合并为一个 `30GB` 的卷组，将后两个合并为一个\
  \ `200GB` 的卷组。每个 `VG` 将作为一个大型虚拟硬盘运行，在上面我们可以像创建普通分区一样创建逻辑卷。\n\n就像 RAID 一样，将箭头移动到每个硬盘的名称上并按回键将允许我们删除分区表。然后在\
  \ `FREE SPACE` 条目上按回键让我们创建一个物理卷——一个我们被设置为用作 LVM 物理空间的分区。一旦所有三个 LVM 分区就就绪，我们在分区菜单上选择\
  \ `Configure the Logical Volume Manager`（配置逻辑卷管理器）。\n\n在关于分区布局的警告之后，我们进入一个相当简洁的\
  \ LVM 对话框，允许我们修改 `VGs` 和 `LVs`。根据我们的计划，我们选择第一个选项并创建所需的两个 `VGs`，选择合适的 `PVs`。然后我们选择\
  \ `Modify Logical Volumes`（修改逻辑卷），并为我们要放在系统上的普通分区创建 `LVs`——例如，为 `/`、`/var`、`/home`\
  \ 和 `/tmp` 各创建一个一个。\n\n你已经可以看到 LVM 带来的某些分区灵活性了。如果你决定为 `/var` 创建 `25GB` 的逻辑卷，你可以从创建的第一个\
  \ `VG` 中划分它，`/var` 将神奇地跨越那两个较小的硬盘。如果你以后决定给 `/var` 分配了太多空间，你可以缩小文件系统，然后简单地从第一个 `VG`\
  \ 将一些空间移动到第二个。可能性是无限的。\n\n最后但同样重要的是，最近的 Ubuntu 版本支持从安装程序开始加密你的 LVM 卷，这对于偏执症患者来说简直是福音：这意味着你从安装机器的那刻起就可以进行全盘加密。加密\
  \ LVM 是分区菜单中“引导式”选项之一提供的，但你也可以手动完成相同的结果。\n\n***\n\n### 提示：LVM 不提供冗余\n\nLVM 的点在于存储的灵活性，而不是容错能力。在我们示例中，包含\
  \ `/var` 文件系统的逻辑卷位于跨越两块硬盘的卷组上。不幸的是，这意味着任何一个硬盘的故障都会损坏整个文件系统，而 LVM 故意不包含防止此类问题的功能。\n\
  \n相反，当你需要容错能力时，通过位于 RAID 之上的物理卷来构建卷组！在我们的示例中，我们可以创建一个跨越整个 `10GB` 硬盘大小的分区并将其分配给 RAID\
  \ 卷的物理空间。然后，我们可以在 `20GB` 硬盘上创建两个 `10GB` 分区并将第一个也设为 RAID 的物理空间。进入 RAID 配置器，我们将从两块硬盘上的\
  \ `10GB` RAID 分区创建一个 RAID 1 阵列，但与之前在 RAID 阵列上放置普通文件系统不同，我们实际上是将 RAID 阵列指定为 LVM 的物理空间。当我们进入\
  \ LVM 配置时，阵列将像任何其他物理卷一样出现，但我们知道该物理卷是冗余的。如果底部的某个物理硬盘故障，LVM 永远不会知道，也不会发生数据丢失。当然，标准的\
  \ RAID 阵列警告适用，所以如果有足够的硬盘故障并关闭阵列，LVM 仍然会挣扎着并掉掉。\n\n#### 加密主目录和软件选择\n\n\n\n完成磁盘分区后，安装程序将安装基础系统并向你询问用户信息，这与桌面版的安装非常。。，你将遇到一个以前可能没见过的问题：你是否希望加密你的家目录（home\
  \ directory）？\n\n如果你回答肯定的，那么你的账户密码将具有第二个用途。它不仅允许你登录，还将被用于透明地加密你家目录中的每一个文件，对于任何没有密码的人来说，这些文件将变成乱码。这意味着，如果你的电脑被盗了，只要你的密码不是太容易猜，你的数据就能免受窥探，保持安全。如果这听起来很熟悉，是因为相同的功能在\
  \ Apple 的 Mac OS X 上以 FileVault 的形式存在，并且也是 Windows Vista 中首次推出的 BitLocker 系统的一个子集。（Ubuntu\
  \ 使用的目录加密系统被称为 `ecryptfs`，这个名字显然没那么响亮。我们正在改进它。）\n\n***\n\n提示：加密交换分区和远程登录\n\n如果你使用交换分区（swap\
  \ partition），仅保护家目录是不够的；敏感数据可能会以明文交换到磁盘。解决方案是使用加密交换，你可以通过 `ecryptfs-setup-swap`\
  \ 命令手动启用它，但这将导致你的电脑目前无法进入休眠（hibernate）省电模式。挂起（suspend）模式不受影响。\n\n另外注意，加密家目录会使得其中所有数据（包括如\
  \ `.ssh` 等特殊目录）在登录之前都是不可用的。如果你正在登录一台家目录已加密且尚未解锁的机器，且该机器仅允许 SSH 公钥认证，那么系统将无法查询你的\
  \ `authorized_keys` 文件，你会被锁在外面。你可以通过物理登录来修复这个问题：使用 `ecryptfs-umount-private` 卸载你的加密家目录，然后在由\
  \ `ecryptfs` 留下的“底层”家目录中创建一个 `.ssh` 目录。像往常一样将你的公钥放入该 `.ssh` 目录下的 `authorized_keys`\
  \ 文件中，这样你就可以准备远程登录了。此时，你可以使用 `ecryptfs-mount-private` 输入密码并解锁你真实的家目录。\n\n***\n\n\
  不过，在安装程序下载了一些更新的软件源后，你将看到一个新菜单，其中列出了许多常见的服务器类型，包括 DNS、LAMP、Mail、OpenSSH、PostgreSQL、Print\
  \ 和 Samba 服务器。选择这些选项中的一个或多个，安装程序将自动下载该服务器所需的标准软件包，并为你对服务进行一些基础配置。例如，如果你想安装 LAMP\
  \ 环境，但又想确保能从另一台电脑 ssh 到这台机器，你可以从菜单中同时选择 LAMP 和 OpenSSH 服务器。\n\n***\n\n提示：软件安装器提示\n\
  \n根据你选择的服务器，在软件包安装过程中可能会被问到问题。例如，当你选择 LAMP 环境时，安装程序会建议你为 MySQL root 用户选择密码。\n\n\
  ***\n\n## 大功告成：现在留心 Root！\n\n呼。搞定了存储和软件方面后，服务器安装的其余部分应该与安装普通的 Ubuntu 工作站无二异。既然服务器已经安装好了，我们可以进入有趣的内容了。从现在开始，我们所做的一切操作都将在\
  \ shell 中进行。\n\n当你的 Ubuntu 服务器首次启动时，你必须使用安装期间创建的用户登录。这里有一个让许多 Ubuntu 新手感到困惑的重要点：与大多数发行版不同，Ubuntu\
  \ 在安装期间不会启用 root 账户！相反，安装程序会将你在安装期间创建的用户添加到 `sudo` 组，这允许你使用名为 `sudo` 的机制来执行管理任务。我们稍后会向你展示如何使用\
  \ `sudo`。在此期间，如果你对禁用直接使用 root 账户的原因感兴趣，只需登录后运行 `man sudo_root` 即可。\n\n***\n\n提示：RAID\
  \ 和 LVM 数组的维护\n\n如果你在安装期间设置了这些数组中的某些，你需要在服务器安装后学习如何管理它们。我们推荐参考 Linux Documentation\
  \ Project 提供的相关教程，地址位于 [www.tldp.org/HOWTO/Software-RAID-HOWTO.html](http://www.tldp.org/HOWTO/Software-RAID-HOWTO.html)\
  \ 和 [www.tldp.org/HOWTO/LVM-HOWTO](http://www.tldp.org/HOWTO/LVM-HOWTO)。\n\n这些教程有时会变得很技术化，但如果你理解了我们在本章对该主题的介绍，那么大部分细节听起来应该很熟悉。\n\
  \n## Ubuntu 软件包管理\n\n服务器安装完成后，它仅包含启动和正常运行所需的少数几个软件包，加上你在软件选择屏幕上选择的任何软件。在 Ubuntu\
  \ 桌面舒适 GNOME 图形环境中，我们可以启动 Synaptic 并通过点击完成应用程序的发现和安装。但在服务器上，我们必须是“shell 武士”。\n\n\
  ### Ubuntu 存档\n\n在我们深入研究软件包管理的细节之前，让我们简要概述一下 Ubuntu 主软件包存档的结构，我们在本章的引言中提到过。每个新版本在存档中有五个仓库，分别称为\
  \ main、restricted、backports、universe 和 multiverse。新安装的系统仅启用了前两个仓库以及安全更新仓库。以下是仓库的分类说明。\n\
  \n![Image](img/image00259.jpeg) **Main:** 包含所有默认安装的软件包；这些软件包具有官方支持。\n\n![Image](img/image00259.jpeg)\
  \ **Restricted:** 这些是版权限制的软件包，通常是硬件驱动程序。\n\n![Image](img/image00259.jpeg) **Backports:**\
  \ 这些是存档中较版本的软件包，由社区提供。\n\n![Image](img/image00259.jpeg) **Universe:** 包含由 Ubuntu\
  \ 社区维护的软件包。\n\n![Image](img/image00259.jpeg) **Multiverse:** multiverse 包含非（自由意义上的）自由软件包。\n\
  \n*官方支持* 这个术语有点误导，因为它并不是指可以购买或获得的技术支持，而是指 Ubuntu 版本发布后安全更新的可用性。标准 Ubuntu 版本的支持为九个月，这意味着\
  \ Ubuntu 的母公司 Canonical, Ltd. 保证对 *main* 仓库中发现的任何漏洞免费提供安全更新。对于其他仓库中的软件不作此类保证。\n\n\
  特别注意的是，某些 Ubuntu 版本具有更长的支持周期。这些版本在版本号中带有 LTS（长期支持）缩写。最新的 Ubuntu LTS 版本 14.04 将支持五年。\n\
  \n#### APT 源和仓库\n\n你现在已经了解了 Ubuntu 存档的结构，但我们还没有解释如何修改你系统使用的仓库列表。在 Debian 软件包管理术语中，仓库列表是高级软件包工具（APT）源的一部分。（请留心：我们稍后讨论的许多软件包工具都以\
  \ apt.* 开头。） APT 源指定在 `/etc/apt/sources.list` 文件中。这些源告诉 APT 在哪里可以找到可用软件包：互联网上的 Ubuntu\
  \ 存档、光盘或第三方存档。\n\n让我们编辑器打开这个文件。（如果你不习惯 `vim`，可以用 `nano` 替换它，它是一个更易用、对新手友好的编辑器。）\n\
  \n```\n$ vim /etc/apt/sources.list\n```\n\n\n\n\n\n以井号（##）开头的行表示注释行，APT 会跳过这些行。在顶部，你会看到安装程序添加的\
  \ CD-ROM 源码，其之后的是这两行（或非常相似的内容）：\n\n点击此处查看代码图像\n\n```\ndeb http://us.archive.ubuntu.com/ubuntu/\
  \ precise main restricted\n\ndeb-src http://us.archive.ubuntu.com/ubuntu/ precise\
  \ main restricted\n```\n\n通过观察这些行，我们可以推断出 APT 源列表的一般格式。该文件由各个源组成，每行一个，且每行包含几个由空格分隔的字段。第一个字段告诉我们该行描述的是哪种源，例如二进制软件包源（`deb`）或源代码包（`deb-src`）。第二个字段是软件包源的实际\
  \ URI，第三个字段是我们想要获取包的发行版名称（`lucid`），剩余字段告诉 APT 从我们描述的源中使用哪些组件——默认情况下，是 `main` 和 `restricted`。\n\
  \n如果你查看文件的其余部分，你会发现它有非常友好的注释，可以让你轻松启用两个额外的仓库：非常有用的 `universe` 和最前沿的 `backports`。通常情况下，既然你已经理解了每个源行的格式，你就对所使用的仓库有了完全控制权；虽然我们强烈建议不要服务器上使用\
  \ `backports` 仓库，但启用 `universe` 通常是一个好主意。\n\n还有一个名为 `/etc/apt/sources.list.d/` 的目录，可以在该处找到更多源。这通常是你存放第三方软件（例如\
  \ Google Chrome）或你安装的 PPA 列表的地方。\n\n考虑到这些，让我们熟悉 Ubuntu 系统上一些基础的命令行包管理工具。Ubuntu 继承了\
  \ Debian 的包管理机制，因此如果你熟悉 Debian，我们将讨论的工具都是老朋友了。\n\n#### dpkg\n\n我们的第一站是 Debian 软件包管理器\
  \ `dpkg`，它位于软件包管理栈的最底层。通过一个名为 `dpkg-deb` 的实用，`dpkg` 处理单个 Debian 软件包文件，由于其扩展名为 `.deb`，因此被称为\
  \ `debs`。\n\n`dpkg` 在系统手册页中有详尽文档，因此你可以在 shell 中输入 `man dpkg` 来阅读它支持的各种选项。我们将指出最常见的\
  \ `dpkg` 操作：列出和安装软件包。当然，`dpkg` 也可以删除软件包，但我们将展示如何使用更高级的工具 `apt-get` 来完成。\n\n#####\
  \ 列出软件包\n\n在 shell 中运行 `dpkg -l | less` 将以六列格式列出你系统中所有 `dpkg` 跟踪的软件包。前三列每列宽度一个字符，分别表示预期的软件包状态、当前软件包状态和错误状态。大多数情况下，错误状态列是空的。\n\
  \n`dpkg` 输出的前三行作为图例，解释了你在前三列中可以找到字母。这让你能够使用 `grep` 工具搜索软件包列表，也许是为了只查看已删除的包或配置失败的包。\n\
  \n#### 手动安装软件包\n\n归档中 get 17,000 多个软件包。假设你下载了一个名为 `myspecial.deb` 的包。你可以通过此命令来安装它：\n\
  \n点击此处查看代码图像\n\n```\nsudo dpkg -i myspecial.deb\n```\n\n`dpkg` 将解压 deb 包，确保其依赖关系已满足，并继续安装。记得我们提到过\
  \ root 账户默认不可用吗？安装软件包需要管理员权限，我们通过在命令前加上 `sudo` 并在 `sudo` 提示输入用户密码来获取权限。\n\n#####\
  \ 关于示例的快速说明\n\n在示例中，美元符号 `$` 是标准的 UNIX shell 符号，因此你不需要实际输入它。我们将在本章其余部分使用它来表示需要输入的内容。在你的\
  \ Ubuntu 系统上，shell 提示符不仅仅是一个美元符号，而是看起来像这样：\n\n`user@server:~$`\n\n`user` 和 `server`\
  \ 分别会被替换为你的用户名和安装期间给服务器的主机，冒号和美元符号之间的部分将显示你的工作目录。波浪号 `~` 是 UNIX 用户目录的简写。\n\n####\
  \ apt-get 和 apt-cache\n\n现在让我们跳到栈的更高处。`dpkg` 主要处理软件包文件，而 `apt-get` 知道如何从 Ubuntu\
  \ 归档下载软件包或从你的 Ubuntu CD 中获取它们。它提供了一个方便、简洁的界面，因此，它是大多数系统管理员在 Ubuntu 服务器上进行包管理的工具，这并不意外。\n\
  \n虽然 `apt-get` 处理高级软件包操作，但它不会告诉你归档中实际上有哪些包是可安装的。它知道如何在后台从包缓存中获取这些信息，你可以通过一个名为 `apt-cache`\
  \ 的简单工具来操纵它。让我们通过一个示例来看看这两个命令是如何协同工作的。假设我们正尝试查找并安装一个允许我们处理扩展文件系统属性的软件。\n\n#####\
  \ 搜索包缓存并显示软件包信息\n\n我们告诉 `apt-cache` 搜索短语“extended attributes”。\n\n点击此处查看代码图像\n\n\
  ```\n$ apt-cache search \"extended attributes\"\n```\n\n`attr` - 用于操作文件系统扩展属性的实用程序\n\
  `libattr1` - 扩展属性共享库\n`libattr1-dev` - 扩展属性静态库和头文件\n`python-pyxattr` - 操作文件系统扩展属性的模块\n\
  `python2.4-pyxattr` - 操作文件系统扩展属性的模块\n`rdiff-backup` - 远程增量备份\n`xfsdump` - XFS 文件系统的管理工具\n\
  `xfsprogs` - 管理 XFS 文件系统的工具\n\n\n\n`apt-cache search` 的参数可以是包名，也可以是描述包的短语（如我们的示例所示）。调用后的后续行是我们收到的输出，左侧是包名，右侧是单行描述。看起来我们要找的是\
  \ `attr` 包，让我们来看看它的一些详细信息。\n\n点击此处查看代码图片\n\n```\n$ apt-cache show attr\n```\n\n\
  Package: attr\nPriority: optional\nSection: utils\nInstalled-Size: 240\nMaintainer:\
  \ Ubuntu Core Developers <ubuntu-deel-discuss@lists.ubuntu.com>\nOriginal-Maintainer:\
  \ Nathan Scott <nathans@debian.org>\nArchitecture: i386\nVersion: 1:2.4.39-1\nDepends:\
  \ libattr1 (>= 2.4.4-1), libc6 (>= 2.6.1-1)\nConflicts: xfsdump (<< 2.0.0)\nFilename:\
  \ pool/main/a/attr/attr_2.4.39-1_i386.deb\nSize: 31098\nMD5sum: 84457d6edd44983bba3dcb50495359fd\n\
  SHA1: 8ae3562e0a8e8a314c4c6997ca9aced0fb3bea46\nSHA256: f566a9a57135754f0a79c2efd8fcec626cde10d2533c10c1660bf7064a336c822\n\
  Description: Utilities for manipulating filesystem extended attributes\nA set of\
  \ tools for manipulating extended attributes on filesystem objects, in particular\
  \ getfattr(1) and setfattr(1).\nAn attr(1) command is also provided which is largely\
  \ compatible with the SGI IRIX tool of the same name.\nHomepage: http://oss.sgi.com/projects/xfs/\n\
  Bugs: mailto:ubuntu-users@lists.ubuntu.com\nOrigin: Ubuntu\n\n不要被冗长的输出吓到。提取有用的部分其实非常简单。我们已经从描述（description）字段中看到，这正是我们要找的包。我们还可以看到软件包的准确版本、任何依赖项和冲突包，以及一个可以发送错误报告的电子邮箱地址。查看文件名（filename）字段，`pool/main`\
  \ 片段告诉我们这是主仓库中的一个包。\n\n### 安装软件包\n\n到目前为止一切顺利。让我们执行实际安装：\n\n点击此处查看代码图片\n\n```\n\
  $ sudo apt-get install attr\n```\n\n`apt-get` 将查找软件包的源（例如 Ubuntu CD 或互联网上的 Ubuntu\
  \ 归档文件），获取 deb 文件，验证其完整性，对该包的任何依赖项执行相同的操作，最后安装该包。\n\n### 移除软件包\n\n出于教学目的，我们将继续假设你是一个非常犹豫不决的人，在安装完\
  \ `attr` 包之后，你意识到你们之间并不不来。让 `attr` 滚进垃圾桶去吧！\n\n```\n$ sudo apt-get remove attr\n\
  ```\n\n确认一次后，`attr` 就从你的系统中彻底消失了，除了它可能安装的任何配置文件。如果你也想把它们删掉，则需要运行以下命令：\n\n```\n$\
  \ sudo apt-get --purge remove attr\n```\n\n### 执行系统更新\n\n安装和移除软件包是常见的系统管理任务，但不如保持系统更新那样常见。这并不意味着要升级到越来越新的软件版本（好吧，确实如此，但不是传统意义上的），因为一旦某个\
  \ Ubuntu 版本发布，除了 backports 仓库外，没有新的软件版本进入仓库。然而，在服务器上，强烈不建议使用 backports，因为它们接受的质量保证和测试非常有限，而且服务器通常没有理由去追求新的软件功能。新功能会带来新的漏洞，作为系统管理员，你应该视稳定性和可靠性远高于功能。Ubuntu\
  \ 短短的六个月开发周期意味着你总能在半年内获得所有新功能。但到那时，它们已经进入了主仓库，并经过了实质性的测试。因此，保持系统更新意味着确保它正在运行最新的安全补丁，以防止发布后发现的任何漏洞危及你的系统。\n\
  \n幸运的是，`apt-get` 让这个过程变得异常简单。你首先从 Ubuntu 归档文件获取更新的软件包列表：\n\n```\n$ sudo apt-get\
  \ update\n```\n\n然后只需运行升级：\n\n```\n$ sudo apt-get upgrade\n```\n\n在此之后，`apt-get`\
  \ 会告诉你你的系统已经是最新状态，或者它计划升级的内容，并且它将自动为你处理升级。这酷酷吗？\n\n#### 运行发行版升级\n\n当新的 Ubuntu 版本发布且你想将服务器升级到该版本时，将使用一个新工具\
  \ `do-release-upgrade`。该升级工具会将你的 `sources.list` 切换到新的。\n\n**注意**\n更新过程可能需要几小时，不应中断。\n\
  \n### 从源码构建软件包\n\n现在你感到兴奋了，让我们回顾一下。从源码构建主要是开发者感兴趣，而不是系统管理员。事实上，作为系统管理员，你应该尽可能避免手动构建包，而是利用\
  \ Ubuntu 归档文件中的包所获得的质量保证。但是，有时你可能需要在安装某个软件之前对其应用自定义补丁。我们将像之前一样使用 `attr` 包。以下是从源码构建\
  \ `attr` 并安装新包的过程——如果你想尝试，请确保已安装 `dpkg-dev`、`devscripts` 和 `fakeroot` 软件包。\n\n```\n\
  $ mkdir attr-build\n$ cd attr-build\n$ apt-get source attr\n$ sudo apt-get build-dep\
  \ attr\n$ cd attr-2.4.39\n<应用补丁或编辑源码>\n$ dch -i\n$ dpkg-buildpackage -rfakeroot\n\
  $ cd ..\n$ sudo dpkg -i *.deb\n```\n\n我们调用的所有命令在系统 man 页中都有详细文档，详细介绍它们超出了本章的范围。不过，为了让你简要了解我们做了什么，这里是快速描述：\n\
  \n1. 我们创建名为 `attr-build` 的临时目录并进入。\n2. `apt-get source attr` 获取了 `attr` 包的源码并将其解压到当前目录。\n\
  3. `sudo apt-get build-dep attr` 安装了从源码构建 `attr` 包所需的所有软件包。\n\n\n\n\n4. 我们进入了解包后的\
  \ `attr-2.4.39` 目录，应用了补丁，并编辑了包日志（changelog）以描述我们对源码的修改。\n\n5. `dpkg-buildpackage\
  \ -rfakeroot` 从我们的包中构建了一个或多个可安装的 deb 包。\n\n6. 我们在文件系统中向上移动了一级目录，并安装了刚刚构建的所有 deb\
  \ 包。\n\n这是一个关于某个需要费长时间才能掌握的主题的超级压缩版备忘录。我们省略了很多内容，所以如果你需要为生产环境对软件包进行丁，请先去阅读我们提到的工具的帮助页（man\
  \ pages），更好地了解正在发生什么！\n\n### aptitude\n\n在软件包管理栈的顶层附近，环绕着 `aptitude`，它是一个精美、色彩丰富的文本化界面，可以与\
  \ `apt-get` 互换使用。我们在这里不会详细介绍 `aptitude` 的用法；系统手册页和在线的 `aptitude` 帮助系统（如果你在 shell\
  \ 中通过 `aptitude` 启动它）提供了大量丰富的信息。不过，值得一提的是，某些系统管理员倾向于使用 `aptitude` 而不是 `apt-get`\
  \ 的主要原因之一是对其所谓的“孤立包”（orphan packages）的处理更好。孤立包是指作为其他包的依赖项安装的，但该包随后被删除，导致孤立包无缘无故留在系统中。`apt-get`\
  \ 没有提供自动处理孤立包的方法，而是将任务交给可以从存档安装的 `deborphan` 工具。相比之下，`aptitude` 会自动删除孤立包。\n\n###\
  \ 技巧与技巧\n\n恭喜你。如果你已经到了这里，你已经熟悉了在 Ubuntu 服务器上有效处理软件包的大多数方面。但在转向其他主题之前，我们还想向你介绍一些可能在某个时刻对你有所帮助的小杂项。\n\
  \n#### 列出软件包拥有的文件\n\n有时，查看系统上的哪些文件属于特定软件包——例如 `cron`——是非常有用的。`dpkg` 来救场了：\n\n```\n\
  $ dpkg -L cron\n```\n\n但要小心，`dpkg -L` 的输出可能包含并非由该包独占、而是与其他包共享的目录。\n\n#### 查找文件属于哪个包\n\
  \n上一个操作的反向操作同样简单：\n\n```\n$ dpkg -S /etc/crontab\ncron: /etc/crontab\n```\n\n单行输出告诉我们左侧的所有者包名称。\n\
  \n#### 查找哪个包提供了文件\n\n`dpkg -S` 和 `dpkg -L` 都作用于已安装软件包的数据库。有时，你可能需要确定哪个（可能尚未安装的）包提供了某个文件。我们可能在寻找一个会安装\
  \ bzr 二进制文件或 `/usr/bin/bzr` 的包。要做到这一点，首先安装包 `apt-file`（需要 universe 存储库），然后执行：\n\n\
  ```\n$ apt-file update\n$ apt-file search /usr/bin/bzr\n```\n\n搞定！`apt-file` 会告诉你你想要的包是\
  \ bzr，输出格式与 `dpkg -S` 相同。\n\n我们的软件包管理技巧就到此为止——现在是时候谈谈安全了。\n\n### Ubuntu 服务器安全\n\n\
  作为一名系统管理员，你的主要任务之一就是处理服务器安全。如果你的服务器连接到互联网，出于安全考虑，它就处于战争区。如果它只是一个内部服务器，你仍然需要处理（无意的）恶意用户、不满的员工，以及那个*真的*想读老板秘书邮件的财务人员。\n\
  \n总来说，Ubuntu Server 是一个非常安全的平台。Ubuntu 安全团队——产生所有官方安全更新的团队——拥有行业内顶尖的周转时间之一。Ubuntu\
  \ 遵循“无开放端口”策略，这意味着在你安装 Ubuntu 之后，默认情况下没有任何开放端口。出于安全考虑，如果你的服务器连接到互联网，出于安全考虑，它就处于战争区。如果它只是一个内部服务器，你仍然需要处理（无意的）恶意用户、不满的员工，以及那个*真的*想读老板秘书邮件的财务人员。\n\
  \n总来说，Ubuntu Server 是一个非常安全的平台。Ubuntu 安全团队——产生所有官方安全更新的团队——拥有行业内顶尖的周转时间之一。Ubuntu\
  \ 遵循“无开放端口”策略，这意味着在你安装 Ubuntu 之后，默认情况下没有任何开放端口。\n（译注：原文此处存在段落重复，根据“不要重复输出原文”的原则，此处仅按逻辑流翻译一次后停止，或按要求翻译如下）\n\
  \n作为系统管理员，你的主要任务之一就是处理服务器安全。如果你的服务器连接到互联网，出于安全考虑，它就处于战争区。如果它只是一个内部服务器，你仍然需要处理（无意的）恶意用户、不满的员工，以及那个*真的*想读老板秘书邮件的财务人员。\n\
  \n总来说，Ubuntu Server 是一个非常安全的平台。Ubuntu 安全团队——产生所有官方安全更新的团队——拥有行业内顶尖的周转时间之一。Ubuntu\
  \ 遵循“无开放端口”策略，这意味着在你安装 Ubuntu 之后，默认情况下没有任何开放端口。\n\n（注：由于原文最后两段出现了完全重复，根据您的指令“一定不要重复输出原文”，译文将仅保留一份逻辑内容。）\n\
  \n**修正后的翻译文部分（去重后）：**\n\n作为系统管理员，你的主要任务之一就是处理服务器安全。如果你的服务器连接到互联网，出于安全考虑，它就处于战争区。如果它只是一个内部服务器，你仍然需要处理（无意的）恶意用户、不满的员工，以及那个*真的*想读老板秘书邮件的财务人员。\n\
  \n总来说，Ubuntu Server 是一个非常安全的平台。Ubuntu 安全团队——产生所有官方安全更新的团队——拥有行业内顶尖的周转时间之一。Ubuntu\
  \ 遵循“无开放端口”策略，这意味着在你安装 Ubuntu 之后，默认情况下没有任何开放端口。\n\n#### 用户账户管理\n\n在 Linux 系统上的许多用户管理方面在不同发行版中是一致的，这就是为什么我们在这里不关注它。为了复习，请查阅\
  \ `chmod` 和 `chown` 的帮助页，或者浏览互联网。\n\n相反，我们想看看通过挂载选项来保护分区，这是处理系统安全的一个经常被忽视的方面，当使用得当时非常强大。当我们解释如何划分系统时，我们赞美了至少将以下用户默认放入\
  \ sudo 组。在添加新用户后，你可以通过以下方式将他们加入 sudo 组：\n\n```\n$ adduser username sudo\n```\n\n\
  只需用 `deluser` 替换 `adduser` 来将用户从组中删除。（在 `adduser` 时使用 `--encrypt-home` 选项将为新用户设置家目录加密。）\n\
  \n你需要记住的一点是 `sudo` 并不是赋予人们 root 权限的替代方案。`sudo` 还可以处理细粒度的权限，例如，“允许此用户以超级用户权限执行这三个命令。”关于指定这些权限的信息可以在\
  \ sudoers 帮助页中找到，它可能有点令人敬畏——你可以随时跳到末尾，直到看到示例部分。你可能只需要花 10 到 15 分钟就能理解它，而且示例涵盖了你所需的大部分情况。当你准备好使用新知识时，只需运行此命令：\n\
  \n```\n$ visudo\n```\n\n在这里要小心——sudoers 数据库位于 `/etc/sudoers`，不应该直接用编辑器打开，因为编辑器不会为你检查语法！如果你弄乱了\
  \ sudoers 数据库，你可能会发现自己无法成为机器管理员。\n\n#### 文件系统安全\n\n文件安全模型在大多数 Unix 类操作系统中都是标准的，被称为\
  \ POSIX 模型。该模型对每个文件和目录要求三种大类的访问权限：所有者、组和其他。它在任何 Linux 发行版上的工作方式完全相同，这就是为什么我们在这里不关注它。为了复习，请查阅相关帮助页或浏览互联网。\n\
  \n相反，我们想看看如何通过挂载选项来保护分区，这是处理系统安全的一个经常被忽视的方面，当被适当使用时非常有威力。当我们解释如何划分系统时，我们强调了至少为 `/home`、`/tmp`\
  \ 和 `/var` 目录分配独立分区的益处，并提到在挂载这些分区到文件系统时可以使用特殊选项。\n\n\n\n\n许多特殊的挂载选项取决于文件系统，但我们想要考虑的那些并不如此。以下是我们感兴趣的几个。\n\
  \n### nodev\n使用 `nodev` 选项挂载的文件系统将不允许使用或创建特殊的“设备”文件。通常情况下，没有充分的理由允许大多数文件系统解释块设备或字符特殊设备，而且允许这些行为会带来潜在的安全风险。\n\
  \n### nosuid\n如果你研究过 UNIX 文件权限，就会知道某些文件可以被标记特定的标记，允许任何人以另一个用户或用户组（通常是系统管理员）的权限执行它们。这种标记分别称为\
  \ `setuid` (`suid`) 位位或 `setgid` 位。在存放系统二进制执行文件的目录之外允许这种行为通常是没必要的，并且会降低安全性。如果用户能够以任何方式创建或获取其自行选择的\
  \ `setuid` 二进制文件，那么该用户实际上已经破解了系统。\n\n### noexec\n如果文件系统被标记为 `noexec`，用户将无法运行其上的任何可执行文件。\n\
  \n### noatime\n此标志告诉文件系统不要记录文件的最后访问时间。如果不加区别地使用，它会限制在安全事件发生时（特别是进行计算机取证时）可用信息量，从而降低安全性。然而，该标志对某些使用模式具有性能优势，因此对于那些可以以安全性换取速度的分区来说，它是一个很好的选择。\n\
  \n决定在哪个分区上使用哪些挂载选项是另一门模糊的科学，随着你对管理机器越来越熟悉，你通常会形成自己的偏好。不过，这里有一个基础建议，可以作为一个很好的起点：\n\
  \n![Image](img/image00259.jpeg) `/home`: `nosuid`, `nodev`\n\n![Image](img/image00259.jpeg)\
  \ `/tmp`: `noatime`, `noexec`, `nodev`, `nosuid`\n\n![Image](img/image00259.jpeg)\
  \ `/var`: `noexec`, `nodev`, `nosuid`\n\n### 系统资源限制\n默认情况下，Linux 不对用户进程施加任何资源限制。这意味着任何用户都可以自由占用机器所有的工作内存，或者在无限循环中产生进程，导致系统在几秒钟无法使用。解决方案是通过编辑\
  \ `/etc/security/limits.conf` 文件来设置你自己的资源限制：\n\n点击此处查看代码图像\n\n```bash\nsudoedit\
  \ /etc/security/limits.conf\n```\n\n所有可能的设置都在文件内的注释中进行了解释，没有推荐的“灵丹妙药”值，但我们确实建议你至少设置\
  \ `nproc` 限制，可能还可以设置 `as`/`data`/`memlock`/`rss` 设置。\n\n#### 提示：真实世界的资源限制示例\n为了让你了解这些限制在生产服务器上的样子，这里是来自哈佛大学计算机协会（Harvard\
  \ Computer Society）通用登录服务器的配置：\n\n点击此处查看代码图像\n\n```\n-   as          2097152\n-\
  \   data        131072\n-   memlock     131072\n-   rss         1013352\nhard  nproc\
  \      128\n```\n\n这将普通用户限制为 128 个进程，最大地址空间为 2GB，最大数据大小和锁定内存的地址空间为 128MB，最大驻留集大小为\
  \ 1GB。\n\n如果你需要为用户设置磁盘配额，请安装 `quota` 包并查看其 man 页（帮助手册）。\n\n### 系统日志文件\n作为系统管理员，系统日志文件是你最好的朋友之一。如果你仔细观察它们，你通常能预先知道系统何时出了问题，并能够在问题升级之前解决大部分问题。\n\
  \n遗憾的是，随着你负责管理的服务器数量增加，你密切关注日志文件的能力随之递减，因此管理员通常会使用日志处理软件，这些软件可以配置为特定事件发生时提醒他们，或者使用\
  \ Perl 和 Python 等语言编写自己的工具。\n\n日志通常位于 `/var/log` 中。在服务器运行一段时间后，你会发现该目录下有很多版本越来越旧的日志文件，其中许多已使用\
  \ `gzip` 压缩（以 `.gz` 文件扩展结尾）。\n\n以下是一些值得注意的日志文件：\n\n![Image](img/image00259.jpeg)\
  \ `/var/log/syslog`: 通用系统日志\n\n![Image](img/image00259.jpeg) `/var/log/auth.log`:\
  \ 系统身份认证日志\n\n![Image](img/image00259.jpeg) `/var/log/mail.log`: 系统邮件日志\n\n![Image](img/image00259.jpeg)\
  \ `/var/log/messages`: 通用日志消息\n\n![Image](img/image00259.jpeg) `/var/log/dmesg`:\
  \ 内核环形缓冲区消息，通常自系统启动以来\n\n#### 你的日志工具箱\n在查看日志时，你应该熟悉几个首选工具。`tail` 实用程序打印文件的文件的 10\
  \ 行，这使其成为一个获取给定日志文件中最近发生了什么事的整洁工具：\n\n```bash\ntail /var/log/syslog\n```\n\n带有 `-f`\
  \ 参数，`tail` 会进入跟踪模式，这意味着它会在文件发生变化时持续在屏幕上显示。如果你想用你的新技能让朋友们印象深刻，现在可以轻松地实现这一点：\n\n\
  非常有用的还有 `zgrep`、`zcat` 和 `zless`，它们的操作与对应的工具类似，但适用于 `gzip` 压缩的文件。例如，为了列出包含“warthog”一词的所有压缩日志（不区分大小写），你可以执行以下命令：\n\
  \n点击此处查看代码图像\n\n```bash\nzgrep -i warthog /var/log/*.gz\n```\n\n你的日志处理工具箱会随着经验的增长而丰富，但为了了解已经有什么内容，可以搜索\
  \ `apt-cache` “log files”。\n\n### 网络安全概述\n网络安全管理是另一个由操作系统提供的功能，因此在 Ubuntu 上与其他任何现代\
  \ Linux 发行版没有区别。这意味着我们在这里不会涵盖它，但会给你一个提示。\n\n`iptables` 命令是强大的 Linux 防火墙表的前端。遗憾的是，处理\
  \ `iptables` 可能相当困难，特别是当你尝试设置复杂的防火墙策略时。为了引起你的兴趣，这里是 `iptables` 的用法，丢弃来自某个臭名浪费时间的域名的数据包：\n\
  \n点击此处查看代码图像\n\n```bash\nsudo iptables -A INPUT -s www.slashdot.org -j DROP\n```\n\
  \n关于 `iptables` 的教程、指南和文章网上有很多，系统 man 页提供了所有选项的详细信息。花时间学习 `iptables` 是非常值得的，因为它让你能够在任何\
  \ Linux 机器上设置网络安全，并让你在需要时能够轻松学习其他操作系统的防火墙系统。\n\n如果你只想在 Ubuntu Server 上管理基本的防火墙，你不一定接触\
  \ `iptables`。Ubuntu 提供了一个名为 `ufw` 的优秀前端，它让添加新的防火墙规则变得非常。有关 `ufw` 的更多信息，请查看该工具的 man\
  \ 页，或者如果你想要更完整的参考，请查看《Official Ubuntu Server Book》中的安全章节。\n\n#### 关于安全的结语\n\n\n\n\
  \n\n在本小节中，我们仅仅刚刚触及系统安全的冰角，尽管我们尝试为你提供一些关于从何处开始以及从何处获取所需信息的建议。但请让我们给你提供一些关于安全性的明智建议，因为这是一个痛苦的事实：世界上不存在完全安全的系统。确保安全并不是为了让破解变得不再可能，而是为了让破解变得极其困难，以至于对攻击者来说不值。这个定义是非常流动的，因为如果你的攻击者是一个坐在某个地下室里吃着冷披萨的无聊\
  \ 14 岁少年，只要你的系统稍微有一点安全性，你就可以打赌那个孩子不会理会你的系统。但如果你在保存顶密信息，要让系统足够安全以至于从成本效益的角度让攻击者觉得破解不值，就要困难得多。\n\
  \n安全的奇妙之处在于，作为一个概念，它渗透了计算机科学的整个思想空间。要精通安全需要对计算机系统的内部运作有极其深刻的理解，这具有一个显而易见的优势：如果你想深入理解计算机系统但不知道从何处开始，可以从安全入手，只需顺着线索即可。利用好这一优势吧！祝你好运。\n\
  \n* * *\n\n### 提示：联系我们\n\n如果你想告诉我们你为什么喜欢 Ubuntu Server，或者你为什么讨厌它，或者给我们发一些 Cookie，或者只是在远处关注我们，请尽管来！访问\n\
  \n[`lists.ubuntu.com/mailman/listinfo/ubuntu-server`](https://lists.ubuntu.com/mailman/listinfo/ubuntu-server)\n\
  \n加入 ubuntu-server 邮件列表，访问我们在 Launchpad 上的页面：\n\n[`launchpad.net/~ubuntu-server`](https://launchpad.net/~ubuntu-server)，\n\
  \n或者加入 IRC。我们在 freenode 的 `#ubuntu-server` 频道。希望在那里见到你！\n\n* * *\n\n### 高级主题\n\n\
  单本书的一个章节并不是详尽介绍 Ubuntu Server 中汇集的所有功能的合适地方。空间不够，而且许多功能非常专业化。但这阻止不了我们带你进行一次旋风式的之旅。我们在这里的目标是提供足够的信息，让你知道有哪些功能，并激发你的兴趣去进一步探索那些可能与你使用\
  \ Ubuntu 的相关的功能。\n\n#### 虚拟化\n\n如果说过去几年里有一个充斥服务器领域的流行术语，那一定是 `virtualization`（虚拟化）。2007\
  \ 年 8 月，一家名为 VMware 的虚拟化公司在首次公开募中筹集了约 10 亿美元，“虚拟化”一词终于爆发，从技术领域进入金融主流，并很快传遍各地的首席信息官（CIO）和技术经理。\n\
  \n从根本上说，虚拟化是将一台计算机变成多台的方法。（博学的读者会注意到，这与美国国徽上的拉丁语格言“E Pluribus Unum”恰恰相反，格言意为“合众为一”。某些技术也符合该描述，例如单系统镜像\
  \ [SSI] 网格。但如果我们用拉丁语谈论虚拟化，我们的格言将是“Ex Uno Plura”，意出一多。）为什么将一台计算机变成多台很有用呢？\n\n回到 20\
  \ 世纪 60 年，服务器巨大且极其贵，没有人想要买比绝对需要更多的服务器。很快人们发现，一台能够同时运行不同操作系统的服务器可以允许不同需求的人使用同一台硬件，这意味着硬件购买的减少，意味着客户预算受损更少且更开心。IBM\
  \ 是第一家提供此作为卖点的公司，在其 `IBM 7044` 和 `IBM 704` 型中引入了虚拟化，随后在其 `Model 67` 主机的硬件中也引入了。后来，行业很大程度上放弃了主机，转向了小型廉价的机架式服务器，这意味着对虚拟化的需求大部分消失了：如果你需要并行运行不同的操作系统，只需买两台服务器即可。但最终摩尔定律追上了我们，即使是微型机架式机器也变得如此强大，以至于机构发现许多它们未被充分利用，而购买更多服务器（尽管这本身是一种相对廉价的策略）意味着巨大的冷却和电力辅助成本。这为虚拟化再次流行奠定了舞台。也许你想在同一台机器上运行不同的\
  \ Linux 发行版。也许你需要一个与 Windows 并行的 Linux 服务器。虚拟化可以满足这些。\n\n虚拟化有四种关键类型。从底层到最高层，它们是硬件模拟（hardware\
  \ emulation）、全虚拟化（full virtualization）、半虚拟化（paravirtualization）和操作系统虚拟化（OS virtualization）。硬件模拟意味着通过软件中为每个操作系统模拟计算机的所有硬件来运行不同的操作系统。这种方法非常强大但速度慢得令人痛苦。全虚拟化则使用一个名为\
  \ `hypervisor` 的特权软件作为操作系统与底层硬件之间的代理，它提供了良好的性能，但需要对无处不在的 `x86` 等指令集的特殊处理器支持。半虚拟化也使用\
  \ `hypervisor`，但仅支持执行经过特殊修改的操作系统，以此换取高性能。最后，操作系统虚拟化更准确的术语是“容器化”（containerization）或“分区”（zoning），指的是支持利用单个运行内核的多个用户空间的操作系统。容器化提供了近原生的性能，但与其他虚拟化方法并不可比拟，因为它的重点不是并行运行多个操作系统，而是将其分割成隔离的片段。\n\
  \nLinux 上最常用的硬件模拟器是 `QEMU` 和 `Bochs`，在 Ubuntu 中分别作为包 `qemu` 和 `bochs` 可用。Linux 上全虚拟化的主要参与者是\
  \ VMware 的商业产品、IBM 的 `z/VM`，以及最近成为 Linux 内核一部分 `KVM` 技术。在半虚拟化方面，关键竞争对手是 `Xen`；Linux\
  \ 操作系统虚拟化领域由 `OpenVZ` 和 `Linux-VServer` 项目主导，尽管操作系统虚拟化所需的许多接口已逐渐进入 Linux 内核。\n\n\
  现在我们已经铺好了基础，让我们根据你正在寻找的内容为你指明方向。如果你是桌面版 Ubuntu 用户，并想要一种安全地运行一个或多个 Linux 发行版（包括不同版本的\
  \ Ubuntu！）或操作系统（BSD、Windows、Solaris 等）的方法进行测试或开发，且封装在一个良好的界面中，那么首选推荐是来自太阳微系统（Sun\
  \ Microsystems）的开源项目 VirtualBox。它在 Ubuntu 中以包 `virtualbox-ose` 的提供，其主页为 [www.virtualbox.org](http://www.virtualbox.org)。\n\
  \n如果你想虚拟化你的服务器，Ubuntu 中的首选解决方案是 `KVM`，这是一种快速的全虚拟化工具，可将运行的内核转换为 hypervisor。然而，由于\
  \ x86 指令集的特殊性，全虚拟化只能在处理器的帮助下工作，KVM 也不例外。要测试你的处理器是否具有相应支持，请尝试：\n\n```bash\negrep\
  \ '(vmx|svm)' /proc/cpuinfo\n```\n\n如果该行产生了任何输出，那就没问题了。请访问 [`help.ubuntu.com/community/KVM`](https://help.ubuntu.com/community/KVM)\
  \ 获取有关安装和配置 KVM 及其客户操作系统的指令。\n\n\n\n\n\n值得提的一个与 Xen 相关的项目是 MIT 的开源 XVM（不要与 Sun Microsystems\
  \ 的 xVM 混淆），它是一套基于 Debian 构建的工具集，允许用户通过 Web 浏览器创建并启动 Xen 客户端虚拟机，并配备了串行控制重定向、ssh\
  \ 访问以及各种其他功能。MIT 使用该系统为任何 MIT 关联人员提供点击即用的虚拟机；该项目主页地址为 [`xvm.mit.edu`](http://xvm.mit.edu)。\n\
  \n## 磁盘复制\n\n我们已经讨论过在磁盘发生故障时 RAID 在保护数据完整性方面的作用，但我们还没有回答那个跟进问题：当整台机器故障时会发生什么？答案完全取决于你的用例，因此给出一个通用的方案是没有意义的。例如，如果你是\
  \ Google，你拥有自动化集群管理工具，这些工具会检测到机器宕机，并在技术人员被派往修复机器之前不再向其分发工作。但这是因为 Google 的基础设施确保了（除极端情况外）没有机器持有未在其他地方进行复制的数据，因此任何一台机器的故障最终都是无关紧的。\n\
  \n如果你没有像 Google 那样拥有在深度冗余基础设施上数以万计的服务器，你可以考虑一种简单的方法：将整个硬盘复制到另一台计算机上，实时传播更改，就像 RAID1，但是在网络上运行。\n\
  \n这种功能被称为分布式复制块设备（DRBD），它并不局限于硬盘：它可以复制你喜欢的任何块设备。Ubuntu 9.04 及更高版本附带 DRBD，你需要的用户空间工具位于\
  \ `drbd8-utils` 软件包中。欲查看完整文档，请参阅 DRBD 网站 [www.drbd.org](http://www.drbd.org)。\n\n\
  ## 云计算\n\n云计算构建在虚拟化最有趣的方面之上：你可以轻松地创建、暂停和销毁多台虚拟计算机，而它们都运行在一台真实的裸机上。对于用户来说，这些虚拟计算机的行为就像真实的计算机一样。\n\
  \n通过云计算，计算力变成了一种商品。你不需要提前几个月来计划、预算并安装新的计算能力。相反，向云请求一台机器，它在几秒钟内就会就绪。完成后，把它扔掉即可。\n\
  \n这就像挖井和打开水龙头的区别。如果你有水龙头提供的流动水，水仍然是一项宝贵的资源，但它不再是你需要投入时间去获取的东西。如果你拥有云计算，计算力可能仍然有限，但更容易获取、共享和重新利用。\n\
  \n如果你想要云计算能力，有几种方法可以实现：构建你自己的私有云，或者在需要时从 Amazon 或 RackSpace 等大型云服务提供商处购买计算力。实际上，通过\
  \ Ubuntu，你可以在使用自己的私有云和在需要时购买额外资源之间进行混合搭配。\n\nUbuntu 是云计算革命的核心。它既作为运行云计算集群的基础操作系统——即那些为云提供计算力的机器——又作为人们选择在云端虚拟机中运行的操作系统。\n\
  \n由于云计算是一个非常新的领域，它的发展非常快，但已经出现了两种运行云的主流方法：Amazon 的 EC2 和开源项目 OpenStack。Ubuntu 都是这两者的核心。如果你想进行实验，这是一个极好的消息，因为\
  \ Ubuntu 为你提供了一系列工具来设置和管理你自己的云。\n\n你将遇到的两个主要工具是 MAAS（也称为“金属即服务”）和 Juju。MAAS 帮助你设置和管理服务器集群，而\
  \ Juju 让你轻松地在直接在裸机服务器或云中运行的服务。\n\n使用 MAAS，你可以将一组裸机视为云：你拥有的不再是一堆孤立的服务器，而是一个可以在上面部署不同服务的计算资源。通过\
  \ MAAS 的 Web UI，你可以快速概览你的计算集群的使用情况以及哪些可用资源。即使只有几台服务器，MAAS 也是一种以类似云的方式处理真实机器极极方法。\n\
  \n你可以将 Juju 认为类似于 `apt-get`，但它是用于运行在服务器上的服务的。Juju 使用称为 \"charms\"（咒语）的脚本，这些脚本执行了运行特定服务所需的所有设置。假设你想运行一个\
  \ WordPress 服务器。你只需要在服务器上部署正确的 Juju charm，一切就应该被正确设置好了。\n\n通过结合 MAAS 和 Juju，你可以相对容易地建立起自己的私有云。MAAS\
  \ 帮助你管理真实机器，而 Juju 帮助你设置运行该云所需的服务。\n\n假设你想使用 Juju 在云上部署一个特定的服务。我们在我们的示例中使用了 Zookeeper。部署服务通常开始如下：\n\
  \n```\n$ juju bootstrap\n$ juju deploy zookeeper\n$ juju expose zookeeper\n```\n\
  \n此时，Juju 会创建一个虚拟机实例，安装 Zookeeper 并对其进行配置。使用以下命令来确定实例状态：\n\n```\n$ juju status\n\
  ```\n\n当你收到实例已启动并运行的通知时，你将获得它的 IP 地址并开始使用它。这个过程异常地快速且简单！\n\n对于 12.04 版本来说，非常有用的工具是\
  \ Juju charm store。在 Juju 启动初期，使用 charms 查找和部署服务要困难得多，但有了 charm store 作为中央仓库，这个过程变得简单得多。\n\
  \n\n\n\n允许任何人为你提供安装软件的程序（charm）可能是危险的，因此系统内置了一些安全和防护机制。这是商店存在的第二个原因（另一个是为终端用户提供便利）。Juju\
  \ 商店中包含的 charm 经过了社区同行评审过程和自动化构建过程，以测试故障。任何人都可以为自己的使用编写 charm，或者直接与他人分享，但在 charm\
  \ 被纳入商店之前，需要付出更多的努力和审查。\n\n关于 Juju、`MAAS` 和 charm 还有很多内容超出了本书的论述范围。如果你感兴趣，请参阅 [jujucharms.com](http://jujucharms.com)\
  \ 或由 Prentice-Hall 出版的《官方 Ubuntu 服务器书籍》（*The Official Ubuntu Server Book*）第三版。\n\
  \n### 总结\n\n如果你以前从未管理过系统，那么从普通用户到管理员的转变将是困难的，无论你选择学习管理哪种操作系统。这种困难源于更广泛的思维转变。你不再仅仅是确保自己的房间整洁，现在你必须运行并保护整栋公寓楼。但这种困难也是具有教育意义且有回报的。（我们知道大学的理论物理课上老师也告诉过你这些，但我们没有在撒谎。）学习维护\
  \ Ubuntu 服务器对你来说是一个极佳的选择，因为你将受益于充满活力且乐于助的用户社区，并且每一步都在与顶级的操作系统合作。\n\n如果你是一位经验丰富的管理员，想来看看\
  \ Ubuntu Server 到底有什么特别之处，请请期待。尽管该项目在稳定性方面稳如磐石，但在功能上仍处于幼年阶段，服务器团队正非常努力使其成为最优秀的服务器平台。我们正在强调高级功能，并对每一个小细节的完美做到非常挑剔。\n\
  \n在以上两种情况下，如果你正在安装一台新服务器，请尝试 Ubuntu Server。它是一个最先进的系统，我们相信你会喜欢使用它。与我们联系，告诉我们如何改进它，并伸出援手。帮助我们让\
  \ Ubuntu 在大型机和重型硬件上变得更加强悍！\n\n# 第 9 章 与 Ubuntu 相关的项目和派生版本\n\n![Image](img/image00260.jpeg)\
  \ 认可的口味\n\n![Image](img/image00260.jpeg) 版本\n\n![Image](img/image00260.jpeg) 其他发行版\n\
  \n![Image](img/image00260.jpeg) Launchpad\n\n![Image](img/image00260.jpeg) Bazaar\n\
  \n![Image](img/image00260.jpeg) Ubuntu One\n\n![Image](img/image00260.jpeg) 总结\n\
  \nUbuntu 不仅仅是一个完整的操作系统；它还是不断扩大的发行版生态系统的中心。某些项目被称为合作伙伴项目，它们与 Ubuntu 合作以及在 Ubuntu\
  \ 内部紧密工作。另一些则倾向于在 Ubuntu 项目的边缘工作开发官方的“口味”（Flavors），它们共享 Ubuntu 的软件源，但创建目的是为了突出特定的软件选择或用例，例如\
  \ Ubuntu Studio 项目，它专注于多媒体创作和编辑。还有一些项目，如 Lubuntu 项目，是由具有特定需求的用户社区创建的。\n\n另一些项目是为了与\
  \ Linux 和开源软件的国际性质相关的原因而创建的。虽然大多数 Ubuntu 开发是用英语进行的，但在其他语言和国家也有大型的开发者和用户社区。因此，可能会为了满足这些需求而产生派生发行版。有的派生发行版针对基督徒、儿童、电脑运行慢的人，以及希望将\
  \ Ubuntu 系统针对若干种替代用户界面之一进行优化，或供世界各地不同学校和政府机构使用的人群。你应该使用这些中的任何一个而不是原生 Ubuntu 吗？我们无法为你回答这个问题。其中一些项目完全位于\
  \ Ubuntu 内部，因此与 Ubuntu 并不是互斥的；而另一些是基于 Ubuntu 的，但是不同的项目。根据你的偏好或情况，其中一个可能比另一个更合适。你可以混合、匹配并尝试这些发行版，直到找到一个适合你自己的。正如我们在第\
  \ 1 章中提到的，Ubuntu 将这些派生版视为一个社区健康且充满活力的标志。该项目的目标之一就是让这类发行版的出现变得更容易。我们都可以期待未来看到更多它们。\n\
  \n### 认可的口味\n\n认可的口味（[图 9-1](#part0021.xhtml_ch09fig01））按照相同的进度发布，共享共同软件包仓库，并与 Ubuntu\
  \ 保持密切关系。在本书出版时，有八种官方认可的口味——Xubuntu、Ubuntu Studio、Mythbuntu、Kubuntu、Edubuntu、Lubuntu、Ubuntu\
  \ Kylin 和 Ubuntu GNOME——它们将在本章稍后部分进行讨论。Canonical 为这些认可的口味提供基础设施、每日 ISO 构建和发布资源、与\
  \ Ubuntu 发布的协调以及发布后的支持。然而，Canonical 并不为这些认可的口味提供某些服务：口味的测试、每日 ISO 构建和发布资源、与 Ubuntu\
  \ 发布的协调以及发布后的支持。（注：此处原文存在重复，已按翻译要求处理）。\n\n\n\n\n\nWiki 页面：[`wiki.kubuntu.org/Kubuntu`](https://wiki.kubuntu.org/Kubuntu)\n\
  \n### 提示：Kubuntu\n\n可以在 [www.kubuntu.org](http://www.kubuntu.org) 找到 Kubuntu。\n\n\
  ### Edubuntu\n\nEdubuntu ([图 9-3) 是适用于学校和其他教育环境的 Ubuntu 版本。它使用了 `Linux Terminal\
  \ Server Project` (`LTSP`) 的瘦客户端技术，以及许多针对教育市场的程序，例如 `GCompris` 和 `KDE Education\
  \ suite`。Edubuntu 将精力放在每两年发布一次的 `LTS`（长期支持）版本上。\n\n![Image](img/image00378.jpeg)\n\
  \n**图 9-3** Edubuntu 14.04 桌面\n\nEdubuntu 的独特特性之一是在一个易于使用的、开箱即用的安装程序中包含了 `LTSP`。`LTSP`\
  \ 在网络上部署客户端的方法与传统的计算机部署方法不同。`LTSP` 不使用全功能计算机，而是使用瘦客户端——即性能较低、价格更廉的计算机，它们连接到较大的服务器并由其完成所有的处理工作。*The\
  \ Official Ubuntu Server Book*（由 Prentice Hall 出版）详细介绍了 LSP。\n\n对于本书的大多数读者来说，Ubuntu\
  \ 是为一个极其兴奋的用户群体提供的替代操作系统。在 Ubuntu 内部，没有哪个团队或项目在针对、支持和发展这一群体用户方面比 Edubuntu 项目做得更多。\n\
  \n虽然 Ubuntu、`Kubuntu` 和其他面向桌面的版本强调了 `GNOME`、`KDE` 以及其他社区的产品，但 Edubuntu 项目旨在提供 Ubuntu\
  \ 中的所有精华——为学校用途而量身定制，并尽可能易用。让 Edubuntu 受欢迎的原因之一是其惊人的集成客户端能力，允许使用一台强大的机器（服务器）为许多低功耗、通常无磁盘的机器（客户端）提供整个操作系统。这种模型对于大多数使用工作站和笔记本电脑的家庭或商业用户来说毫无吸引，但在教室环境中是一项主要功能，它可以减轻配置和维护的烦恼，并大幅降低教室部署的成本。\n\
  \n### 提示：Edubuntu 资源\n\nIRC：`#edubuntu`\n\n邮件列表：[`lists.ubuntu.com/mailman/listinfo/edubuntu-users`](https://lists.ubuntu.com/mailman/listinfo/edubuntu-users)\n\
  \nLaunchpad 团队：[`launchpad.net/~edubuntu-members`](https://launchpad.net/~edubuntu-members)\n\
  \n论坛：[www.ubuntuforums.org/tags.php?tag=edubuntu](http://www.ubuntuforums.org/tags.php?tag=edubuntu)\n\
  \nWiki 页面：[`wiki.ubuntu.com/Edubuntu`](http://wiki.ubuntu.com/Edubuntu)\n\n### 提示：Edubuntu\n\
  \nEdubuntu 以及更详细的安装说明和选项，可以在 [www.edubuntu.org](http://www.edubuntu.org) 找到。\n\n\
  ### Lubuntu\n\nLubuntu ([图 9-4)) 在 11.10 发布周期期间获得了官方认可的版本地位，并努力通过默认使用轻量级 X11 桌面环境\
  \ (`LXDE`）来替代 `GNOME`、`KDE` 或 `Xfce`，提供一个更轻量、更快速的桌面。虽然 `LXDE` 可以在许多当前的 Linux 发行版上构建，但它只有\
  \ Lubuntu 是原生环境。\n\n![Image](img/image00379.jpeg)\n\n**图 9-4** Lubuntu 14.04 桌面\n\
  \nLubuntu 针对的是在低配置硬件运行且可能不知道如何使用命令行工具的“普通”PC 和笔记本电脑用户。在大多数情况下，他们没有足够的资源来运行“全功能”主流发行版的所有花哨功能。\n\
  \n### 提示：Lubuntu 资源\n\nIRC：`#lubuntu`\n\n邮件列表：[`lists.ubuntu.com/mailman/listinfo/lubuntu-usersv`](https://lists.ubuntu.com/mailman/listinfo/lubuntu-usersv)\n\
  \nLaunchpad 团队：[`launchpad.net/~lubuntu-desktop`](https://launchpad.net/~lubuntu-desktop)\n\
  \n论坛：[`ubuntuforums.org/tags.php?tag=lubuntu`](http://ubuntuforums.org/tags.php?tag=lubuntu)\n\
  \nWiki 页面：[`wiki.ubuntu.com/Lubuntu`](https://wiki.ubuntu.com/Lubuntu)\n\n### 提示：Lubuntu\n\
  \nLubuntu 可以在 [`lubuntu.net`](http://lubuntu.net) 找到。\n\n### Xubuntu\n\nXubuntu\
  \ ([图 9-5) 是构建在 `Xfce` 窗口管理系统上的 Ubuntu 版本。在 Xubuntu 中，`Xfce` 及其相关应用的角色类似于 `Kubuntu`\
  \ 场景下的 `KDE`。与视觉上华丽得多的 `Unity`、`GNOME` 和 `KDE` 相比，`Xfce` 非常小巧且轻量。在正常配置下，它比任何替代方案都消耗更少的内存和少的\
  \ CPU 周期。虽然这意味着 Xubuntu 通常被认为功能比 Ubuntu 或 `Kubuntu` 少，或不那么易用，但也意味着它运行更快、响应更迅速。\n\
  \n![Image](img/image0380.jpeg)\n\n**图 9-5** Xubuntu 14.04 桌面\n\n像 `Kubuntu` 一样，`Xubuntu`\
  \ 从 5.04 开始加入行列，拥有自定义的 `Xubuntu Control Center`，并且从 6.10 开始一直存在。现在 Xubuntu 只提供 LTS\
  \ 版本。\n\n### 提示：Xubuntu 资源\n\nIRC：`#xubuntu`\n\n邮件列表：[`lists.ubuntu.com/mailman/listinfo/xubuntu-users`](https://lists.ubuntu.com/mailman/listinfo/xubuntu-users)\n\
  \nLaunchpad 团队：[`launchpad.net/~xubuntu-desktop`](https://launchpad.net/~xubuntu-desktop)\n\
