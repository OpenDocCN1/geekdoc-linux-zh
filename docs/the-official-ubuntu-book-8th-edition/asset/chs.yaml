  \ 找到。\n\n### Mythbuntu\n\nMythTV 是最受欢迎的家庭影免费软件之一，但它有一个设置起来非常头疼的声誉。Mythbuntu ([图\
  \ 9-7)的设计是为了让这种设置变得简单。像 Xubuntu 和 Studio 一样，Mythbuntu 使用 `Xfce` 作为桌面环境，拥有自定义的 `Mythbuntu\
  \ Control Center`，并提供了一个用于测试的 `LiveCD`。\n\n\n\n\n\n# 图 9-7 Mythbuntu 14.04 桌面\n\n\
