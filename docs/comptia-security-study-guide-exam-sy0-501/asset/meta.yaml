- - '#'
  - 测试答案
- - '###'
  - 21. **A.** 入侵防护系统 (IPS) 对网络上的异常活动提供主动监控和基于规则的响应。例如，防火墙通过阻止未经授权流量的访问来提供被动安全防护。如果防火墙被破解，IPS
    将根据其设计实施的规则通知你。更多信息，请参阅第 3 章。
- - '###'
  - 22. **B.** 证据链（Chain of custody）确保从收集点开始，处理证据的每一步骤都经过记录并可追溯。证据链涉及证据存储的谁、做了什么、何时、何地以及为什么。更多信息，请参阅第
    12 章。
- - '###'
  - 24. **C.** 被动方法而非实际尝试入侵网络的渗透/漏洞测试被称为非侵入性测试。更多信息，请参阅第 12 章。
- - '###'
  - 25. **B.** 密钥交换算法 (KEA) 用于创建一个临时会话以交换密钥信息。该会话会创建一个密钥。当密钥交换完成后，正式会话开始。更多信息，请参阅第
    8 章。
- - '###'
  - 27. **B.** 增量备份通常是最快的备份方法，因为它只备份自上次增量备份或全备以来更改的文件。更多信息请参阅第 12 章。
- - '###'
  - 28. **C.** 生物识别是利用物理特征（如掌纹或视网膜模式）建立身份识别的认证过程。更多信息，请参阅第 11 章。
- - '###'
  - 30. **A.** 计算机取证是调查计算机系统以确定事件原因的过程。该过程的一部分是收集证据。更多信息，请参阅第 12 章。
