  \     inet 192.168.0.5  Bcast:192.168.0.255  Mask:255.255.255.0\n```\n\n一旦 BIOS\
  \ 设置完成，重新启动进入服务器，并安装 KVM 所需的所有软件包：\n\n点击此处查看代码图\n\n```\n$ sudo apt-get install gemu-kvm\
  \ libvirt-bin ubuntu-vm-builder\n```\n\n除了 KVM 软件和必要的库之外，这组软件包还将为您提供管理虚拟机所需的 `virsh`\
