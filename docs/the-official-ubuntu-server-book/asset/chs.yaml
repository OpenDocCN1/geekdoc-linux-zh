  \ `virsh` 命令。在这种情况下，它输出当前机器上运行的所有虚拟机列表。我们目前还没有设置任何虚拟机，但得到了有效输出而不是错误，意味着我们可以准备好继续后续了。如果你遇到了某种权限错误，可能是因为你的用户不在\
  \ `libvirtd` 组中。\n\n### 配置 KVM 网络\n\n有两种主要方法可以为虚拟机设置网络。默认的网络设置提供了一个 `192.168.122.0/24`\
  \ 下的私有网络。DHCP 服务器将分发剩余的 IP；或者，你也可以为虚拟机设置静态 IP。KVM 主机的 IP 为 `192.168.122.1`，虚拟机随后通过\
  \ NAT（网络地址转换）通过该网关与外部世界通信。这种方式运行良好，特别是对于桌面上的虚拟机，但由于我们在这里讨论的是服务器，我的假设是你希望 KVM 宿主机之外的机器能够与你的虚拟机通信。虽然你完全可以设置某种\
  \ `iptables` DNAT 规则并将流量转发回，但那种解决方案的可扩展性不太好。真正的解决方案是设置桥接网络，使得你的虚拟机看起来与你的主机在同一个网络上。\n\
  \n在 Ubuntu 上设置 `br0` 桥接接口相对简单。本质上，你只需确定想要桥接流量的接口（可能是 `eth0`，或者如果你设置了绑定，则可能是 `bond0`），将其所有配置传输到\
  \ `br0` 并带上一些额外的桥接选项，然后将原始接口更改为手动模式。看到示例后这会更有意义。例如，如果我为 `eth0` 设置了 DHCP，且在 `/etc/network/interfaces`\
  \ 中的旧配置如下：\n\n```\nauto eth0\niface eth0 inet dhcp\n```\n\n那么我的新配置将如下所示：\n\n```\n\
  auto eth0\niface eth0 inet manual\nauto br0\niface br0 inet dhcp\n      bridge_ports\
  \ eth0\n      bridge_fd 9\n      bridge_hello 2\n      bridge_maxage 12\n      bridge_stp\
  \ off\n```\n\n注意，我将 `eth0` 的 `inet` 模式从 `dhcp` 改为了 `manual`。如果 `eth0` 配置了静态 IP，我将直接将所有配置传输到\
  \ `br0`，所以它会从：\n\n```\nauto eth0\niface eth0 inet static\n      address 192.168.0.5\n\
  \      network 192.168.0.0\n      netmask 255.255.255.0\n      broadcast 192.168.0.255\n\
  \      gateway 192.168.0.1\n```\n\n变为：\n\n```\nauto eth0\niface eth0 inet manual\n\
  auto br0\niface br0 inet static\n      address 192.168.0.5\n      network 192.168.0.0\n\
  \      netmask 255.255.255.0\n      broadcast 192.168.0.255\n      gateway 192.168.0.1\n\
  \      bridge_ports eth0\n      bridge_fd 9\n      bridge_hello 2\n      bridge_maxage\
  \ 12\n      bridge_stp off\n```\n\n一旦我配置好 `/etc/network/interfaces` 包含了桥接，我将重启网络：\n\
  \n```\n$ sudo /etc/init.d/networking restart\n```\n\n现在我的 `ifconfig` 输出应该列出我新的桥接接口：\n\
  \n点击此处查看图像\n\n```\n$ ifconfig\nbr0  encap:Ethernet  HWaddr 00:17:42:1f:18:be\n \
  \     inet 192.168.0.5  Bcast:192.168.0.255  Mask:255.255.255.0\n```\n\n### 创建虚拟机\n\
  \n一旦 KVM 和桥接设置好，你就可以开始创建虚拟机了。`ubuntu-vm-builder` 脚本可以自动化这一过程。你可以使用以下命令来创建一个虚拟机：\n\
  \n```\n$ sudo vmbuilder kvm ubuntu --suite precise --flavour virtual --rootsize=2048\
  \ --swapsize=256 --user ubuntu --pass insecure -d test1-kvm\n```\n\n此命令将创建一个名为 `test1-kvm`\
  \ 的 Ubuntu Precise 虚拟机，并设置了磁盘大小为 2048MB，交换空间为 256MB，用户为 `ubuntu`，密码为 `insecure`。\n\
  \n`vmbuilder` 脚本可以根据你选择的虚拟化技术和操作系统创建虚拟机，你可以在每个选项后添加 `--help` 参数来获取具体选项：\n\n```\n\
  $ sudo vmbuilder kvm ubuntu --help\n```\n\n`vmbuilder` 脚本会在当前目录下创建一个虚拟机，取决于取决于平台（hypervisor）以及要安装的操作系统（suite）。这里是一个创建一个基础\
  \ Ubuntu 虚拟机的示例 `vmbuilder` 命令（先不要按回车）：\n\n```\n$ sudo vmbuilder kvm\n```\n\n###\
  \ 创建虚拟机\n\n一旦 KVM 和桥接设置好，你就可以开始创建虚拟机了。`ubuntu-vm-builder` 脚本可以自动化这一过程。你可以使用以下命令来创建一个虚拟机：\n\
  \n```\n$ sudo vmbuilder kvm ubuntu --suite precise --flavour virtual --rootsize=2048\
  \ --swapsize=256 --user ubuntu --pass insecure -d test1-kvm\n```\n\n此命令将创建一个名为 `test1-kvm`\
  \ 的 Ubuntu Precise 虚拟机，并设置了磁盘大小为 2048MB，交换空间为 256MB，用户为 `ubuntu`，密码为 `insecure`。\n\
  \n`vmbuilder` 脚本可以根据你选择的虚拟化技术和操作系统创建虚拟机，你可以在每个选项后添加 `--help` 参数来获取具体选项：\n\n```\n\
  $ sudo vmbuilder kvm ubuntu --help\n```\n\n`vmbuilder` 脚本会在当前目录下创建一个虚拟机，取决于平台（hypervisor）以及要安装的操作系统（suite）。这里是一个创建一个基础\
  \ Ubuntu 虚拟机的示例 `vmbuilder` 命令（先不要按回车）：\n\n```\n$ sudo vmbuilder kvm\n```\n\n\n\
  Ubuntu 提供了不同的内核版本（flavors）。`virtual` 版本选择的是针对虚拟机优化的 JeOS 内核，但根据你选择的 Ubuntu 变体系列和架构，还有许多不同的内核可供选择。\n\
  \n![Image](img/box.jpg) **--arch *i386***\n\n这是我为虚拟机使用的处理器架构。如果我不指定它，它将默认使用宿主机架构。有效选项有\
  \ `i386`、`amd64` 和 `lpia`。\n\n![Image](img/box.jpg) **--hostname *test1***\n\n如果不指定主机名，虚拟机将默认主机名为为\
  \ `ubuntu`。在你决定创建多个虚拟机之前，这是没问题的，但届时你会收到一个域名 `ubuntu` 已经存在的错误。使用 `--hostname` 选项，你不仅可以在操作系统内部指定主机名，还可以指定用于在\
  \ KVM 中注册的唯一名称。\n\n![Image](img/box.jpg) **--libvirt *qemu:///system***\n\n`--libvirt`\
  \ 选项将将此虚拟机添加到我的本地 KVM 实例中。\n\n![Image](img/box.jpg) **--rootsize *2048* and --swapsize\
  \ *256***\n\n对于基础虚拟机，你可能只需要一个包含根分区和交换区的单磁盘。在这种情况下，你可以使用 `--rootsize` 和 `--swapsize`\
  \ 以兆字节为单位指定根分区和交换分区的大小。还有一个 `--optsize` 选项可以设置一个独立的 `/opt` 分区。\n\n![Image](img/box.jpg)\
  \ **--user *ubuntu* and --pass *insecure***\n\n你可能需要在系统中设置某种默认用户，这样一旦构建完成你就可以登录，除非你的网络使用了\
  \ LDAP 或其他网络身份认证。`--user` 和 `--pass` 参数允许我指定要使用的默认用户和密码；否则两者都默认为 `ubuntu`。你还可以使用\
  \ `--name` 选项来设置用户的全名。\n\n![Image](img/box.jpg) **-d *test1-kvm***\n\n默认情况下，`vmbuilder`\
  \ 将虚拟机的根磁盘安装在用户主目录下的 `ubuntu-kvm` 目录下。当然，一旦你设置了一个虚拟机，就无法重复使用同一个目录，因此 `-d` 选项允许你指定目标目录的位置。\n\
  \n安装完成后，我将看到当前目录下创建了一个新的 `test1-kvm` 目录，里面是该虚拟机的磁盘文件：\n\n```\n$ ls test1-kvm/\n\
  run.sh tmpHHSJGz.qcow2\n```\n\n此外，我的新虚拟机将在 KVM 中注册，定义其设置的 XML 文件将安装在 `/etc/libvirt/qemu/test1.xml`\
  \ 下，看起来如下：\n\n点击此处查看代码图片\n\n```xml\n<domain type='kvm'>\n  <name>test1</name>\n\
  \  <uuid>907a0091-e31f-e2b2-6181-dc2d1225ed65</uuid>\n  <memory>131072</memory>\n\
  \  <currentMemory>131072</currentMemory>\n  <vcpu>1</vcpu>\n  <os>\n    <type arch='i686'\
  \ machine='pc-0.12'>hvm</type>\n    <boot dev='hd'/>\n  </os>\n  <features>\n  \
  \  <acpi/>\n  </features>\n  <clock offset='utc'/>\n  <on_poweroff>destroy</on_poweroff>\n\
  \  <on_reboot>restart</on_reboot>\n  <on_crash>destroy</on_crash>\n  <devices>\n\
  \    <emulator>/usr/bin/kvm</emulator>\n    <disk type='file' device='disk'>\n \
  \     <source file='/home/ubuntu/vms/test1-kvm/tmpHHSJGz.qcow2'/>\n      <target\
  \ dev='hda' bus='ide'/>\n    </disk>\n    <interface type='network'>\n      <mac\
  \ address='52:54:00:c6:18:b7'/>\n      <source network='default'/>\n      <model\
  \ type='virtio'/>\n    </interface>\n    <input type='mouse' bus='ps2'/>\n    <graphics\
  \ type='vnc' port='-1' autoport='yes' listen='127.0.0.1'/>\n    <video>\n      <model\
  \ type='cirrus' vram='9216' heads='1'/>\n    </video>\n  </devices>\n</domain>\n\
  ```\n\n### 额外的 vmbuilder 选项\n\n我提供的 `vmbuilder` 命令示例肯定可以工作，但该脚本支持许多对你的虚拟机可能有额外选项。例如，在我的示例中，我列出了\
  \ `--rootsize` 和 `--swapsize` 选项来设置虚拟机磁盘中的根分区和交换分区。你可能决定需要比简单的根分区和交换区更复杂的分区布局，在这种情况下你可以使用\
  \ `--part` 选项。`--part` 选项从你创建的文件读取内容，该文件包含分区信息，并在设置磁盘时使用它。该文件的语法非常简单。每行包含一个挂载点，后跟以兆字节为单位的分区大小。你甚至可以设置多个磁盘——只需在单独的一行中使用\
  \ `---` 来区分不同的磁盘。\n\n例如，假设我想创建两个磁盘。第一个磁盘将有一个 100Mb 的 `/boot` 分区、2GB 的 `/` 分区和 512Mb\
  \ 的交换区。第二个磁盘将有...（此处已省略）\n\n\n\n\n![Image](img/box.jpg) `--ssh-key */root/.ssh/authorized_keys*\
  \ and *--ssh-user-key /home/username/.ssh/authorized_keys***\n\n这些选项接受 root 用户（`--ssh-key`）或普通用户（`--ssh-user-key`）的\
  \ SSH 授权密钥文件的完整路径，并将其复制到宿主机上。你可以进行这种配置，以便在虚拟机安装并启动后，无需密码即可自动 ssh 进入虚拟机。\n\n![Image](img/box.jpg)\
  \ **--copy *filename***\n\n此选项读取你指定的一个文件，该文件包含源文件和目标文件的列表，例如：\n\n```\n/home/ubuntu/vmfiles/filename\
  \ /etc/filename\n```\n\n它会将文件从主机上的源文件复制到虚拟机上的目标文件。\n\n![Image](img/box.jpg) **--execscript\
  \ *script***\n\n此参数会在安装结束时，使用 `chroot` 在虚拟机内部运行你指定的命令行脚本。\n\n![Image](img/box.jpg)\
  \ **--firstboot *script***\n\n此选项与 `--execscript` 类似，但它会将指定的脚本复制到虚拟机中，并在虚拟机首次启动时执行它。\n\
  \n![Image](img/box.jpg) **--firstlogin *script***\n\n大多数自动化安装器选项的缺点是它们要求脚本是非交互式的。`--firstlogin`\
  \ 选项没有这个限制。它接受你指定的脚本并在用户首次登录虚拟机时执行它。由于第一个登录的用户将看到该脚本，因此你可以让它具有交互性。你可能还想使用此脚本在虚拟机上安装任何带有交互式安装程序的软件包。\n\
  \n一旦你使用 `vmbuilder` 成功创建了虚拟机，就可以开始首次启动虚拟机并使用 `virsh` 对其进行管理了。\n\n## 使用 virsh 管理虚拟机\n\
  \n`virsh` 命令是你管理虚拟机时使用的主要工具之一。KVM 的基本语法是 `virsh -c qemu:///system` 后面跟某种命令。例如，要列出所有运行中的虚拟机，请输入：\n\
  \n```\n$ virsh -c qemu:///system list\nConnecting to uri: qemu:///system\n  Id Name\
  \              State\n----------------------------------\n  9 test1            \
  \  running\n```\n\n现在你已经创建了一个新虚拟机，可以使用 `start` 命令启动它：\n\n```\n$ virsh -c qemu:///system\
  \ start test1\nConnecting to uri: qemu:///system\nDomain test1 started\n$ virsh\
  \ -c qemu:///system list\nConnecting to uri: qemu:///system\n  Id Name         \
  \     State\n----------------------------------\n  9 test1              running\n\
  ```\n\n注意，`start` 命令后面跟着你想要启动的虚拟机。与 `start` 类似的命令还有 `shutdown` 和 `destroy`，它们将分别关闭并切断虚拟机的电源。如果你希望虚拟机在启动时自动启动，请使用\
  \ `autostart` 命令：\n\n```\n$ virsh -c qemu:///system autostart test1\nConnecting\
  \ to uri: qemu:///system\nDomain test1 marked as autostarted\n```\n\n如果你想移除 `autostart`\
  \ 选项，请在命令中添加 `--disable`：\n\n```\n$ virsh -c qemu:///system autostart --disable\
  \ test1\nConnecting to uri: qemu:///system\nDomain test1 unmarked as autostarted\n\
  ```\n\nKVM 还支持快照，因此你可以保存虚拟机的当前状态并在以后回滚到该状态。要拍摄快照，请使用 `save` 命令，后跟虚拟机名称以及保存状态的文件：\n\
  \n```\n$ virsh -c qemu:///system save test1 test1-snapshot.state\nConnecting to\
  \ uri: qemu:///system\nDomain test1 saved to test1-snapshot.state\n```\n\n稍后你可以使用\
  \ `restore` 命令后跟之前保存的状态文件，将虚拟机恢复到该状态：\n\n```\n$ virsh -c qemu:///system restore\
  \ test1 test1-snapshot.state\nConnecting to uri: qemu:///system\nDomain restored\
  \ from test1-snapshot.state\n```\n\n你还可以使用 `suspend` 和 `resume` 命令挂起和恢复虚拟机。请记住，挂起的虚拟机仍然消耗内存资源。挂起的虚拟机将显示在\
  \ `paused` 状态的列表中：\n\n```\n$ virsh -c qemu:///system suspend test1\nConnecting to\
  \ uri: qemu:///system\nDomain test1 suspended\n$ virsh -c qemu:///system list\n\
  Connecting to uri: qemu:///system\n  Id Name              State\n----------------------------------\n\
  \  1 test2              running\n  2 test1              paused\n$ virsh -c qemu:///system\
  \ resume test1\nConnecting to uri: qemu:///system\nDomain test1 resumed\n$ virsh\
  \ -c qemu:///system list\nConnecting to uri: qemu:///system\n  Id Name         \
  \     State\n----------------------------------\n  1 test2              running\n\
  \  2 test1              running\n```\n\n使用虚拟机的一个特别方便的特性是，如果虚拟机需要更多 RAM 而你的宿主机有内存，你可以轻松地进行更改。首先使用\
  \ `dominfo` 命令查看使用的 RAM 数量。虚拟机关闭后，使用 `setmax` 命令更改虚拟机可用的最大 RAM，并使用 `setmem` 命令更改虚拟机当前使用的\
  \ RAM（二者可以不同，只要最大内存更大即可）。重启虚拟机后，它将以新的内存大小启动：\n\n```\n$ virsh -c qemu:///system dominfo\
  \ test1\nConnecting to uri: qemu:///system\nId:     -\nName:   test1\nUUID:   e1c9cbd2-a160-bef6-771d-18c72efa098\n\
  OS Type:  hvm\nState:   shut off\nCPU(s):  1\nMax memory:  131072 kB\nUsed memory:\
  \  131072 kB\nAutostart:  disable\nSecurity model:  apparmor\nSecurity DOI:  0\n\
  $ virsh -c qemu:///system setmax test1 262144\nConnecting to uri: qemu:///system\n\
  $ virsh -c qemu:///system dominfo test1\nConnecting to uri: qemu:///system\nId:\
  \     -\nName:   test1\nUUID:   e1c9cbd2-a160-bef6-771d-18c72efa098\nOS Type:  hvm\n\
  State:   shut off\nCPU(s):  1\nMax memory:  262144 kB\nUsed memory:  131072 kB\n\
  Autostart:  disable\nSecurity model:  apparmor\nSecurity DOI:  0\n$ virsh -c qemu:///system\
  \ setmem test1 262144\nConnecting to uri: qemu:///system\n$ virsh -c qemu:///system\
  \ dominfo test1\nConnecting to uri: qemu:///system\nId:     -\nName:   test1\nUUID:\
  \   e1c9cbd2-a160-bef6-771d-18c72efa098\nOS Type:  hvm\nState:   shut off\nCPU(s):\
  \  1\nMax memory:  262144 kB\nUsed memory:  262144 kB\nAutostart:  disable\nSecurity\
  \ model:  apparmor\nSecurity DOI:  0\n```\n\n## KVM 图形控制和管理工具\n\n有很多方法可以获取 KVM 虚拟机的控制。有些人会预先设置\
  \ ssh 并 ssh 进入机器，另一些人则设置某种基于 VNC 的远程桌面。然而，当你刚开始时可能还没有准备好这些基础设施，因此拥有某种工具来获取虚拟机的图形控制是非常用的。`virt-manager`\
  \ 工具让这个过程变得简单。\n\n首先，使用 `sudo apt-get install virt-manager` 安装 virt-manager 软件包。如果你的服务器有某种图形桌面，你可以从那里运行它。你将看到一个可以连接的\
  \ KVM 实例列表。双击 `localhost (System)` 项，它将连接并展开显示所有可用的虚拟机，如图 9-1 所示。\n\n![Image](img/09fig01.jpg)\n\
  \n**图 9-1** 虚拟机管理器默认界面\n\n\n\n\n如果你从主界面选择一个特定的 VM 并点击“打开”（Open）按钮，它将打开一个进入该机器的图形控制台，如图\
  \ 9-2 所示。从该窗口，你可以登录到你的 VM 并运行命令，就像你连接了键盘、鼠标和显示器一样。你还可以在此界面内关机、挂起和拍摄快照。\n\n![Image](img/09fig02.jpg)\n\
  \n**图 9-2** 图形化 VM 控制台\n\n回到主菜单，你还可以获取有关 VM 的更详细信息。选择 VM，然后点击 `Edit_Machine Details`（编辑虚拟机详情）。在这里，你不仅可以看到其当前负载的更详细图表，如果你点击\
  \ `Hardware`（硬件）选项卡（图 9-3），就可以查看、添加和删除硬件，尽管根据你想更改的内容，主机可能需要关机。\n\n![Image](img/09fig03.jpg)\n\
  \n**图 9-3** VM 硬件详情\n\n### 远程 KVM 管理\n\n此工具不仅限于本地 KVM 管理，因为你的服务器上很可能没有图形化环境。你也可以将该包安装到网络上的桌面端，然后通过\
  \ SSH 隧道连接到你的 KVM 服务器。只需确保你已经设置了 SSH，然后在虚拟机管理器器的主窗口中点击 `File->Open Connection`（文件->打开连接）。接着在\
  \ Connection 下拉菜单中选择“Remote tunnel over SSH”（通过 SSH 的远程隧道），确保虚拟监控程序（hypervisor）设置为\
  \ QEMU，然后输入你的 KVM 服务器的主机名并点击 `Connect`（连接）。\n\n### Amazon EC2\n\n许多人在一提到云计算时，特别是在云端启动虚拟机时，会想到\
  \ Amazon EC2。Amazon 提供了许多不同的云服务，但 EC2 是允许你启动 Amazon 硬件上运行虚拟机的服务。Amazon 根据虚拟机运行的小小时向你计费，费率根据虚拟机所使用的资源而异。对于最小的\
  \ `t1.micro` 实例，费率每小时 0.02 美元。EC2 是 Ubuntu Server 的理想环境，在本节中，我将介绍如何使用与 EC2 API 接口的命令行工具来创建和监控你的服务器。\n\
  \n#### 注册账户\n\n第一步是访问 [`https://aws.amazon.com/ec2/](https://aws.amazon.com/ec2/)\
  \ 注册 Amazon 账户以使用 EC2。Amazon 目前正在进行一项促销，只要你坚持使用 `t1.micro` 实例，就可以获得若干小时的免费 EC2 使用时长。由于你们很多人可能想免费尝试\
  \ EC2，我的示例命令默认启动 `t1.micro` 实例。\n\n注册账户后，你可以登录并点击名为 `My Account` 或实际账户名的下拉菜单，访问\
  \ Amazon Web Services (AWS) 管理控制台或 `My Account` 页面。AWS 控制台（图 9-4）提供了一个基于 Web 的界面，可以使用它创建新实例、更改安全组规则（实例的防火墙规则）、添加\
  \ ssh 密钥对以及其他 EC2 管理。当然，在本节中，我将尽量避免使用 Web 端管理控制台，而是使用命令行工具。\n\n![Image](img/09fig04.jpg)\n\
  \n**图 9-4** AWS 管理控制台\n\n`My Account` 页面让你访问各种账户设置，但最重要的是，在你开始使用时，它提供了创建新的安全凭据来操作\
  \ EC2 API。一旦进入 `My Account` 页面，选择左侧的 `Security Credentials`（安全凭据）链接，滚动到 `Access\
  \ Credentials`（访问凭据），然后选择 `X.509 Certificates` 选项卡，可以在那里查看并创建新的证书对，如图 9-5 所示。X.509\
  \ 证书由一个私钥和一个公共证书文件组成，类似于公钥和私钥 ssh 密钥对。公共证书可以安全地共享，但私钥应该像密码或 ssh 私钥一样保持保密。事实上，虽然此页面允许你查看公共证书，但你只有在生成这些证书时才能下载相应的私钥。如果你在那之后丢失了私钥，将不得不重新创建一个全新的证书对。\n\
  \n![Image](img/09fig05.jpg)\n\n**图 9-5** AWS 安全凭据\n\n#### 设置 EC2 API 工具\n\n我们大部分关于\
  \ EC2 的工作是在 Web 界面之外通过命令行完成的。虽然有许多与 EC2 API 兼容的软件库，但 `ec2-api-tools` 包为 EC2 的所有主要功能提供了简单的命令行界面。第一步是安装\
  \ `ec2-api-tools` 包：\n\n```bash\nsudo apt-get install ec2-api-tools\n```\n\n在软件下载和安装期间，如果你还没有创建\
  \ X.509 证书，请前往 AWS Security Credentials 页面，点击 `X.509 Certificates` 选项卡并创建一个。记住至少下载私钥，因为这是你唯一的机会，尽管你也可以把证书文件一并下载。你需要这两个文件来配置\
  \ EC2 API 工具。\n\n`ec2-api-tools` 包安装了许多以 “ec2” 开头的命令行工具。如果你输入 `ec2` 并按 Tab 键，将看到许多命令。例如，`ec2-describe-regions`\
  \ 命令显示当前可用区域。你可以使用 `-C` 和 `-K` 命令行参数来传递证书和私钥的路径。\n\n\n\n\n此处列出的区域对应于全球不同地区的数据中心，你可以在这些区域创建实例。每个区域都有自己的实例小时级费用，默认情况下，命令使用位于弗吉尼亚的\
  \ `us-east-1` 区域，该区域的成本也最低。你可以通过运行 `ec2-describe-availability-zones` 命令来观察此默认设置，该命令会列出区域中当前的可用区：\n\
  \n点击此处查看代码图片\n\n```\n$ ec2-describe-availability-zones\n\nAVAILABILITYZONE  us-east-1a\
  \  available  us-east-1\nAVAILABILITYZONE  us-east-1b  available  us-east-1\nAVAILABILITYZONE\
  \  us-east-1c  available  us-east-1 \n```\n\n如你所见，`us-east-1`区域目前有三个不同的可用区。不过，如果你想在其他区域运行命令，始终可以在任何\
  \ `ec2-api-tools` 命令上使用 `--region` 参数指定不同的区域：\n\n点击此处查看代码图片\n\n```\n$ ec2-describe-availability-zones\
  \ --region us-west-2\n\nAVAILABILITYZONE  us-west-2a  available  us-west-2\nAVAILABILITYZONE\
  \  us-west-2b  available  us-west-2\nAVAILABILITYZONE  us-west-2c  available  us-west-2\n\
  ```\n\n在这种情况下，我列出了位于俄勒冈州的 `us-west-2` 区域的可用区。那么，区域和可用区之间有什么区别呢？每个 AWS 区域都被细分为多个可用区。每个区都保证位于不同的物理硬件、不同的电源基础设施和不同的物理网络上。其核心思想是任何故障都不应同时影响超过一个可用区，因此如果你将冗余服务器分布在不同的可用区中，那么你就可以免受\
  \ Amazon 可能发生的任何故障的影响。\n\n### 创建 ssh 密钥对\n\n在开始启动新实例之前，我们还需要多做几件事。首先，我们需要生成一个 ssh\
  \ 密钥对，用于登录到我们创建的实例。当你第一次创建实例时，可以指定要使用哪个密钥对，ssh 公钥会在实例启动时自动复制到实例中。由于 ssh 是我们登录和访问这些服务器的主要方式，这是一个非常重要的步骤。要创建\
  \ ssh 密钥对，输入 `ec2-add-keypair` 后后跟你想要为该密钥对使用的名称：\n\n点击此处查看代码图片\n\n```\n$ ec2-add-keypair\
  \ default\n\nKEYPAIR   default   8c:48:69:73:bd:de:68:d2:61:83:d8:55:4b:1e:95:9b:7f:23:56:49\n\
  \n-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEAuLFXSzOk/ckgO81MeAQw/BLWjJE6CQSNFmnjpXbFkx6cov+F3ovQO3Dh/d5c\n\
  FcKJnQRxK5CQXsYwGprsUADUOofgb+6sXBfhxu8miPG2a8L5JQyewD7jhCyJ0/anA30fbJpyEZ42\nV3LfDCPPhHmAxLktUmd8gT5WGF7RJtNzG7bqdVRMB33q8qLsTJFpSqGA24h89KZFhwE9nx5gX87E\n\
  lw7A6IGeQ3ijJndBWoNPPQXa0NDfeKhwr2Rt7CjhtBCoHf9lGa1Vo0SDBeaG9FOq7ZZJ8BmAoBJ/\n+xGTFlFvz/f7SecvoI25ue3yPmOXPKZsX1zc8JzOUos0ClpWGng5xwIDAQABAoIBADSXm0n4zNTP\n\
  vvQIg+vxFZnSK3IfKKz8tMhbIs3tQlmgb+4iYRZ8LbGfdVr7RLGVkeY6a5eCNPon6W7KCtzFP6nj\nI0/8YOxgiJRDaW+5lL6e6J9aNqJ7xgHPRPgs1mYx7Q7Z8/18VfEU7trgH6mTh819BaDfgx6yh4Wt\n\
  ClXKBI8xTIz1JnaZIMxgLUDwy1rDofH9P45B9dKTZZQqtfvNskv06PZytqKe9fQJmOnLmW/jGaOg\n225oOPez+uqNMgAISDsDZOiRgmJBulYHAIPK3NwPPOxU64re3GcGOhFPW2fIt7xqRkpJqK3WRDevN\n\
  \n\
  -----END RSA PRIVATE KEY-----\n```\n\n该命令会将你的私钥输出到屏幕上，因此选择从 `-----BEGIN RSA PRIVATE\
  \ KEY-----` 到输出结束的所有内容，并将其粘贴到 .pem 文件中，你可以在 ssh 登录这些机器时引用它。我建议使用类似 `~/.ssh/ec2-default.pem`\
  \ 的文件名。此文件是机密的。\n\n选择 AMI\n\n现在我们已经选择了 AMI ID，是时候使用 `ec2-run-instances` 命令（带有简写别名\
  \ `ec2run`）创建我们的第一个实例了：\n\n\n\n\n\n点击此处查看代码图像\n\n```\n$ ec2run ami-1ebb2077 -k default\
  \ -t t1.micro -g default\n\nRESERVATION  r-f0186c8d  709488244382  default\nINSTANCE\
  \    i-788bed14  ami-1ebb2077  pending default 0 t1.micro\n  2013-04-07T21:56:20+0000\
  \ us-east-1c aki-88aa75e1\n  monitoring-disabled  ebs  paravirtual  xen sg-aae1d4c2\
  \ default\n```\n\n`ec2run` 的语法非常直观。首先，我指定了想要使用的 AMI。`-k` 参数指定了该实例将使用哪个密钥对。在我的案例中，我指向了之前创建的默认密钥对。`-t`\
  \ 参数允许你选择实例类型。我选了 `t1.micro`，因为它是最小、最便宜的实例类型，但根据你的预算和需要的资源，也可以选择 `m1.small`、`m1.medium`、`m1.large`\
  \ 或 `c1.large` 等。最后，`-g` 参数定义了该机器应该所属的安全组。默认情况下，所有实例都是默认安全组的一部分，所以这个选项并不是必须的，但我想提一下，因为我们稍后会讨论安全组。\n\
  \n`ec2run` 命令输出了大量关于实例的信息，包括它所在的可用区（`us-east-1c`）、当前状态（`pending`）以及最重要的——它的实例 ID（`i-788bed14`）。实例\
  \ ID 非常重要，因为它是区分该实例和我可能创建的任何其他实例的唯一标识。默认情况下，可以通过 `ec2-describe-instances` 命令（使用缩写别名\
  \ `ec2din`）获取我所有实例的信息：\n\n点击此处查看代码图像\n\n```\n$ ec2din\n\nRESERVATION  r-f0186c8d\
  \  709488244382  default\nINSTANCE      i-788bed14  ami-1ebb2077  ec2-50-19-174-100\n\
  \  .compute-1.amazonaws.com  ip-10-245-29-169.ec2.internal\n  running  default \
  \ 0     t1.micro  2013-04-07T21:56:20+0000\n  us-east-1c  aki-88aa75e1    monitoring-disabled\
  \  50.19.174.100\n  10.245.29.169    ebs  paravirtual  xen    sg-aae1d4c2  default\n\
  BLOCKDEVICE  /dev/sda1  vol-2ae8eb6c  2013-04-07T21:56:24.000Z\nRESERVATION  r-1c047061\
  \  709488244382  default\nINSTANCE      i-a4a90acf  ami-1ebb2077  ec2-54-235-26-33\n\
  \  .compute-1.amazonaws.com  ip-10-117-33-240.ec2.internal\n  running  default \
  \ 0     t1.micro  2013-04-07T22:00:11+0000\n  us-east-1c  aki-88aa75e1    monitoring-disabled\
  \  54.235.26.33\n  10.117.33.240    ebs  paravirtual  xen    sg-aae1d4c2  default\n\
  BLOCKDEVICE  /dev/sda1  vol-aef3f0e8  2013-04-07T22:00:15.000Z\nRESERVATION  r-ae0571d3\
  \  709488244382  default\nINSTANCE      i-a4dbfd8  ami-ebb2077  ec2-23-20-150-126\n\
  \  .compute-1.amazonaws.com  ip-10-112-53-44.ec2.internal\n  running  default  0\
  \     t1.micro  2013-04-07T22:01:20+0000\n  us-east-1c  aki-88aa75e1    monitoring-disabled\
  \  23.150.126\n  10.112.53.44    ebs  paravirtual  xen    sg-aae1d4c2  default\n\
  BLOCKDEVICE  /dev/sda1  vol-cff1289  2013-04-07T22:01:26.000Z\n```\n\n此输出中包含大量信息，因为默认情况下，它列出了所有实例的信息。不过，可以通过指定特定的\
  \ ID 来只查看某个实例的信息：点击此处查看代码图像\n\n```\n$ ec2din i-788bed14\n\nRESERVATION  r-f0186c8d\
  \  709488244382  default\nINSTANCE      i-788bed14  ami-1ebb2077  ec2-50-19-174-100\n\
  \  .compute-1.amazonaws.com  ip-10-245-29-169.ec2.internal\n  running  default \
  \ 0     t1.micro  2013-04-07T21:56:20+0000\n  us-east-1c  aki-88aa75e1    monitoring-disabled\
  \  50.19.174.100\n  10.245.29.169    ebs  paravirtual  xen    sg-aae1d4c2  default\n\
  BLOCKDEVICE  /dev/sda1  vol-2ae8eb6c  2013-04-07T21:56:24.000Z\n```\n\n此输出中包含大量信息，因为默认情况下，它列出了所有实例的信息。不过，可以通过指定特定的\
  \ ID 来只查看某个实例的信息：点击此处查看代码图像\n\n\n\n\n\n.compute-1.amazonaws.com ip-10-243-115-104.ec2.internal\n\
  \nrunning default 0 t1.micro 2013-04-07T22:40:14+0000\n\nus-east-1c aki-88aa75e1\
  \ monitoring-disabled 67.202.50.22\n\n10.243.115.104 ebs paravirtual xen sg-aae1d4c2,\
  \ sg-621dea09 default\n\nBLOCKDEVICE /dev/sda1 vol-5ab1b21c 2013-04-07T22:40:16.000Z\n\
  \n在这种情况下，外部 IP 是 `67.202.50.22`，所以我可以像往常一样 ssh 登录，但必须使用 `-i` 参数指向我之前生成的 ssh 密钥：\n\
  \n点击此处查看代码图片\n\n```\nssh -i ~/.ssh/ec2-default.pem ubuntu@67.202.50.22\n```\n\n\
  主机 '67.202.50.22 (67.202.50.22)' 的真实性无法确认。\nECDSA 密钥指纹为: d3:8f:10:91:22:1c:32:8e:b5:c2:c3:bd:59:3c:6b。\n\
  你确定要继续连接吗 (yes/no)? yes\n\n警告: 已将 '67.202.50.22' (ECDSA) 永久添加到已知主机列表。\n\n欢迎来到 Ubuntu\
