  Ubuntu 系统包含的程序是免费软件；每个程序的具体分发条款可以在 /usr/share/doc/*/copyright 下的单独文件中。\n在适用法律允许范围内，Ubuntu\
  \ **不提供任何保证**。\n要以管理员（用户 \"root\"）身份运行命令，请使用 \"sudo <command>\"。\n详情请查看 \"man sudo_root\"\
  。\nubuntu@ip-10-243-115-104:~$\n\n关于默认的 Canonical Ubuntu AMI 有几点需要注意。首先，默认用户设置为\
  \ `ubuntu`，该用户可以在不设置密码的情况下 `sudo` 到 root。其次，主机名设置为 `ip`，后跟用连字符分隔的其内部 IP 地址（在本例中为\
  \ ip-10.243-115-104）。主机本身只知道内部 IP 地址，因此你必须访问 API（例如使用 `ec2din`）来查找外部 IP 地址。最后，除非你使用\
  \ Amazon 的 VPC 服务，否则所有实例都从 DHCP 动态获取 IP 地址，因此你不能假设当实例停止并启动后你的 IP 始终会保持不变。现在机器已经启动，从现在起我可以添加其他用户，或者将我自己的公钥添加到\
  \ ubuntu 用户的 `~/.ssh/authorized_keys` 文件中，使我的 ssh 命令更简单。除了这些区别外，大多数情况下这台机器的行为与其他任何虚拟机一样。我可以遵循第\
  \ 5 章 中的步骤在此实例上安装和配置服务。与其他虚拟机 类似；唯一的区别是如果我想向外部开放任何端口，必须对相应的安全组进行更改。\n\n#### 启动、停止和终止实例\n\
  \n当然，实例是需要付费的，所以当你完成一个实例并想要关闭它时，总会有那个时刻到来。现在，如果我只想停止实例以便不再产生费用，但又想保留以后启动的能力（并且它是\
  \ ebs 实例类型），我可以输入：\n\n点击此处查看代码图片\n\n```\nec2stop i-7a0d4bf\n```\nINSTANCE i-7a0d4bf\
  \ running stopping\n\n```\n\n要重新启动实例，我将使用 `ec2start`：\n\n```\nec2start i-7a0d4bf\n\
  ```\nINSTANCE i-7a0d4bf stopped pending\n\n```\n\n如果你想完全终止实例使其不再可用，我会输入：\n\n点击此处查看代码图片\n\
  \n```\nec2kill i-7a0d4bf\n```\nINSTANCE i-7a0d4bf running stopping\n\n注意，停止的实例会变为终止。对于\
  \ EBS 类型的实例，你可以运行 `ec2kill` 或 `ec2stop` 来终止它。任何情况下，这可能需要一些时间来让状态变为终止。\n\n#### Userdata\
  \ 脚本\n\n当你在云中产生许多实例时，你可能不想登录每一个实例并进行手动设置。相反，你可能希望设置一个在实例首次启动时运行的脚本。这种脚本可以安装某些软件包，也可以安装配置管理工具（如\
  \ `Puppet` 或 `Chef`）。在任何情况下，`ec2run` 脚本允许你指定一个在服务器启动时以 root 身份运行并复制到远程服务器的文件。\n\n\
  为了演示这种工作原理，假设我想将我的实例用于 IRC 和其他基础任务。我创建一个简单的 bash 脚本，安装 `screen` 和 `irssi` 软件包，并创建一个\
  \ `/home/ubuntu/script_run` 文件以指示脚本已运行。首先，我在本地创建一个名为 `userdata` 的脚本：\n\n点击此处查看代码图片\n\
  \n```bash\n#!/bin/bash\napt-get update\napt-get -y install screen irssi\ntouch /home/ubuntu/script_run\n\
  ```\n\n现在我使用 `ec2run` 启动实例并指向该脚本：\n\n点击此处查看代码图片\n\n```\nec2run ami-ebb2077 -k default\
  \ -t t1.micro -g default -g ssh -f userdata\n```\nRESERVATION r-9e1265e3 70948824382\
  \ default,ssh\nINSTANCE i-d1a0b7b1 ami-ebb2077 pending default\n\n在给实例启动一两分钟后，我可以\
  \ ssh 登录并查看脚本是否运行：\n\n点击此处查看代码图片\n\n```\nssh -i ~/.ssh/ec2-default.pem ubuntu@23.22.89.82\n\
  ```\n\n\n\n\n\nJuju 的核心理念是，当管理员在云端设置服务时，单个服务器的重要性往往不如服务本身。例如，一个管理员可能会说：“我想要一个由 MySQL\
  \ 数据库支持的 WordPress 或者 “我想要一个 Jenkins 服务器”，但在云端，只要该实例拥有所需的资源，你并不一定在乎是哪一个 `m1.large`\
  \ 实例托管了 WordPress。通过 Juju，你只需要指定要在云端创建哪些服务以及这些服务之间的关系，Juju 就会下载 Juju 社区人员编写的现成脚本，根据最佳实践安装并配置这些服务。\n\
  \n## 安装与配置 Juju\n\n看到 Juju 运行起来会让你更容易理解它的功能，所以让我们先来安装并配置它。虽然 Juju 在 Ubuntu 12.04\
  \ 中有一个包，但由于 Juju 是一个较新且更新快速的项目，因此官方建议是从其 PPA 安装 Juju。要做到这一点，请安装 `python-software-properties`\
  \ 包以引入 `add-apt-repository` 命令，然后使用该程序添加相应的仓库，接着更新可用包列表，最后安装 juju 包本身：\n\n点击此处查看代码图像\n\
  \n```\n$ sudo apt-get install python-software-properties\n\n$ sudo add-apt-repository\
  \ ppa:juju/pkgs\n```\n\n你正准备向系统添加以下 PPA：\n\n  更多信息：https://launchpad.net/~juju/+archive/pkgs\n\
  \n按 [ENTER] 继续或按 ctrl-c 取消添加\n\n```\ngpg: keyring `/tmp/tmpbTfwwc/secring.gpg` created\n\
  gpg: keyring `/tmp/tmpbTfwwc/pubring.gpg` created\ngpg: requesting key C8068B11\
  \ from hkp server keyserver.ubuntu.com\ngpg: /tmp/tmpbTfwwc/trustdb.gpg: trustdb\
  \ created\ngpg: key C8068B11: public key \"Launchpad Ensemble PPA\" imported\ngpg:\
  \ Total number processed: 1\ngpg: imported: 1  (RSA: 1)\nOK\n```\n\n```\n$ sudo\
  \ apt-get update\n\n$ sudo apt-get install juju\n```\n\n你运行 Juju 命令的账户需要一对 ssh 密钥来与云中的远程\
  \ Juju 管理服务器通信，所以如果你还没有生成 ssh 密钥，请现在生成：\n\n```\n$ ssh-keygen -t rsa -b 2048\n```\n\
  \n现在你已经有了 ssh 密钥，运行 `juju bootstrap`。该命令会报错，因为没有配置环境供它进行初始化，但结果它会导出示例 `~/.juju/environments.yaml`\
  \ 文件，你可以用它开始配置：\n\n点击此处查看代码图像\n\n```\n$ juju bootstrap\nerror: No environments configured.\
  \ Please edit:\n  /home/krankin/.juju/environments.yaml\n\n$ cat ~/.juju/environments.yaml\n\
  \nenvironments:\n  sample:\n    type: ec2\n    control-bucket: juju-e1d1c9fa72f0402487aba4c4e9692fe2\n\
  \    admin-secret: 2b1ecbb8775e42a29b24f2da9efebfb3\n    default-series: precise\n\
  \    ssl-hostname-verification: true\n```\n\n这个默认的 `~/.juju/environments.yaml` 文件并不包含正确初始化\
  \ Juju 环境所需的所有配置。访问你的 Amazon AWS My Account 页面，点击页面左侧的 Security Credentials（安全凭证）链接，然后向下滚动直到\
  \ Access Credentials 部分，并选中 Access Keys 选项卡，如图 9-7 所示。如果你还没有创建访问密钥对，请现在创建一个。Access\
  \ Key ID 和 Secret Access Key 可以被视为访问 AWS API 的用户名和密码，因此务要将 Secret Access Key 视为真正的密钥（别担心，我在演示中使用后已经删除了这对密钥）。\n\
  \n![图像](img/09fig07.jpg)\n\n**图 9-7** AWS 访问密钥\n\n现在你已经有了访问密钥对，可以通过 `access-key`\
  \ 和 `secret-key` 配置变量将它们添加到 `environments.yaml` 文件中。最终生成的示例 `~/.juju/environments.yaml`\
  \ 文件看起来如下：\n\n点击此处查看代码图像\n\n```\nenvironments:\n  sample:\n    type: ec2\n    control-bucket:\
  \ juju-e1d1c9fa72f0402487aba4c4e9692fe2\n    admin-secret: 2b1ecbb8775e42a29b24f2da9efebfb3\n\
  \    default-series: precise\n    ssl-hostname-verification: true\n    access-key:\
  \ AKIAIZEHLG2HMSF5YDFA\n    secret-key: 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\n\
  ```\n\n## Juju Bootstrap\n\n现在你有了访问密钥，可以通过 `juju bootstrap` 命令来初始化。由于配置文件已就绪，你可以运行\
  \ `juju bootstrap` 命令：\n\n```\n$ juju bootstrap\n2013-04-07 11:30,289 INFO Boot\
  \ environment 'sample'\n2013-04-07 11:30,300 INFO origin: ec2\n2013-04-07 11:30,300\
  \ INFO creating instance 'sample'\n2013-04-07 11:30,300 INFO waiting for instance\
  \ 'sample' to be ready\n2013-04-07 11:30,300 INFO instance 'sample' is ready\n2013-04-07\
  \ 11:30,300 INFO installing juju-controller\n2013-04-07 11:30,300 INFO waiting for\
  \ juju-controller to be ready\n... (省略部分初始化日志) ...\n2013-04-07 11:36,704 INFO environment\
  \ 'sample' is ready\n```\n\n`juju bootstrap` 命令执行很快，但初始化可能需要几分钟时间。你可以通过 `juju status`\
  \ 命令跟踪 Juju 的进度：\n\n```\n$ juju status\n2013-04-07 11:34,116 INFO status check started...\n\
  2013-04-07 11:34,116 INFO controller: sample\n2013-04-07 11:34,116 INFO status:\
  \ active\n2013-04-07 11:34,116 INFO agent: 1\n2013-04-07 11:34,116 INFO services:\
  \ 1\n2013-04-07 11:34,116 INFO units:\n  name                role        status\
  \  pos       announcement\n  sample/juju-controller  controller  ready   0     \
  \    -\n2013-04-07 11:34,116 INFO status check finished\n```\n\n## 部署 Juju\n\n一旦初始化过程完成，你就可以部署新服务了。假设你想部署一个由\
  \ MySQL 数据库支持的 WordPress。传统上，你可能通过在云端启动几台服务器，然后 SSH 进入这些机器来安装和配置各种软件包。在 Juju 中这变得简单得多：点击此处查看代码图像\n\
  \n```\n$ juju deploy wordpress\n2013-04-07 11:35,469 INFO searching for charm cs:precise/wordpress\n\
  2013-04-07 11:35,532 INFO connecting to environment...\n2013-04-07 11:35,582 INFO\
  \ connected to environment.\n2013-04-07 11:35,582 INFO deploying unit wordpress/0\n\
  2013-04-07 11:35,582 INFO waiting for wordpress/0 to be ready\n```\n\n接下来，你只需要部署\
  \ MySQL 服务，然后将它们关联起来：\n\n```\n$ juju deploy mysql\n2013-04-07 11:36,234 INFO searching\
  \ for charm cs:precise/mysql\n2013-04-07 11:36,246 INFO connecting to environment...\n\
  2013-04-07 11:36,289 INFO connected to environment.\n2013-04-07 11:36,289 INFO deploying\
  \ unit mysql/0\n2013-04-07 11:36,289 INFO waiting for mysql/0 to be ready\n\n$ juju\
  \ add-relation wordpress mysql\n2013-04-07 11:36,402 INFO connecting to environment...\n\
  2013-04-07 11:36,432 INFO connected to environment.\n2013-04-07 11:36,432 INFO adding\
  \ relation between wordpress/0 and mysql/0\n```\n\n\n\n\n这里发生了什么？`juju deploy` 命令每次执行都会在指定的\
  \ EC2 实例类型上上启动一个独立的服务器。当你告诉它部署 WordPress 时，它会创建一个标记为 `wordpress` 的服务器，然后寻找适用于 WordPress\
  \ 服务的 Juju charm（插件）。charm 本质上是一组脚本，它们能够根据约定的最佳实践自动安装并配置服务。`juju deploy mysql` 命令执行相同的步骤，只不过这次它拉取的是\
  \ MySQL charm。现在，如果你只运行了前两个命令，你将拥有一个没有数据库的独立 WordPress 服务器，以及一个没有承载任何数据的独立 MySQL\
  \ 数据库。将两者连接在一起的是最后一条命令 `juju add-relation wordpress mysql`。该命令告诉 Juju 之前部署的 `wordpress`\
  \ 和 `mysql` 服务器之间存在关联关系，而 Juju 足够智能，它知道这两个服务之间的关系方式是：标记为 `mysql` 的服务器应该被配置为 WordPress\
  \ 前端托管数据库。随后，Juju 将配置这两个服务，让 WordPress 知道如何使用 `MySQL` 实例，而 `MySQL` 服务器也会被添加一个 WordPress\
  \ 数据库。\n\n在这些服务器启动期间，如果你运行 `juju status` 命令，你会得到一个显示内容尚未就绪的状态输出：\n\n点击此处查看代码图像\n\
  \n```\n$ juju status\n\n2013-04-07 11:36:47,492 INFO Connecting to environment...\n\
  \n2013-04-07 11:36:50,636 INFO Connected to environment.\nmachines:\n  0:\n    agent-state:\
  \ running\n    dns-name: ec2-23-20-194-49.compute-1.amazonaws.com\n    instance-id:\
  \ i-31566851\n    instance-state: running\n  1:\n    agent-state: not-started\n\
  \    dns-name: ec2-50-17-54-6.compute-1.amazonaws.com\n    instance-id: i-9643dff8\n\
  \    instance-state: running\n  2:\n    agent-state: not-started\n    dns-name:\
  \ ec2-54-234-234-68.compute-1.amazonaws.com\n    instance-id: i-af5668cf\n    instance-state:\
  \ pending\nservices:\n  mysql:\n    charm: cs:precise/mysql-16\n    relations:\n\
  \      db:\n        - wordpress\n    units:\n      mysql/0:\n        agent-state:\
  \ pending\n        machine: 2\n        public-address: null\n  wordpress:\n    charm:\
  \ cs:precise/wordpress-11\n    relations:\n      db:\n        - mysql\n    loadbalancer:\n\
  \      - wordpress\n    units:\n      wordpress/0:\n        agent-state: pending\n\
  \        machine: 1\n        public-address: null\n2013-04-07 11:36:56,082 INFO\
  \ 'status' command finished\n  successfully\n```\n\n此时，你只需等待状态命令的输出显示 WordPress\
  \ 服务为“已启动”（started）而非“等待中”（pending）\n\n\n\n点击此处查看代码图像\n\n```\n$ juju status\n\n\
  2013-04-07 11:47:54,880 INFO Connecting to environment...\n\n2013-04-07 11:47:58,123\
  \ INFO Connected to environment.\nmachines:\n  0:\n    agent-state: running\n  \
  \  dns-name: ec2-23-20-194-49.compute-1.amazonaws.com\n    instance-id: i-31566851\n\
  \    instance-state: running\n  1:\n    agent-state: running\n    dns-name: ec2-50-17-54-6.compute-1.amazonaws.com\n\
  \    instance-id: i-9643dff8\n    instance-state: running\n  2:\n    agent-state:\
  \ running\n    dns-name: ec2-54-234-234-68.compute-1.amazonaws.com\n    instance-id:\
  \ i-af5668cf\n    instance-state: running\nservices:\n  mysql:\n    charm: cs:precise/mysql-16\n\
  \    relations:\n      db:\n        - wordpress\n    units:\n      mysql/0:\n  \
  \      agent-state: started\n        machine: 2\n        public-address: ec2-54-234-234-68.compute-1.amazonaws.com\n\
  \  wordpress:\n    charm: cs:precise/wordpress-11\n    exposed: false\n    relations:\n\
  \      db:\n        - mysql\n    loadbalancer:\n        - wordpress\n    units:\n\
  \      wordpress/0:\n        agent-state: started\n        machine: 1\n        public-address:\
  \ ec2-50-17-54-6.compute-1.amazonaws.com\n2013-04-07 11:48:02,952 INFO 'status'\
  \ command finished\n  successfully\n```\n\n一旦服务就绪，你运行最后一条命令，以便该实例可以从外部访问：\n\n点击此处查看代码图像\n\
  \n```\n$ juju expose\n\n2013-04-07 11:56:38,080 INFO Connecting to environment...\n\
  \n2013-04-07 11:56:41,587 INFO Connected to environment.\n2013-04-07 11:56:41,885\
  \ INFO 'wordpress' was exposed.\n2013-04-07 11:56:41,895 INFO 'expose' command finished\n\
  \  successfully\n```\n\n`expose` 命令修改了安全组，以便你可以从外部访问该服务。一旦服务就绪，你可以将 `juju status`\
  \ 输出中的 WordPress 地址（`ec2-50-17-54-6.compute-1.amazonaws.com`）放入浏览器并看到标准的 WordPress\
  \ 界面，如图 9-8 所示。\n\n![Image](img/09.jpg)\n\n**图 9-8**  页面\n\n如果你还没有准备好向外部世界暴露这个实例，可以使用\
  \ `juju unexpose` 撤销之前的操作：\n\n点击此处查看代码图像\n\n```\n$ juju unexpose wordpress\n\n2013-04-07\
  \ 12:05:59,025 INFO Connecting to environment...\n\n2013-04-07 12:06:02,668 INFO\
  \ Connected to environment.\n2013-04-07 12:06:02,988 INFO 'wordpress' was unexposed.\n\
  2013-04-07 12:06:02,993 INFO 'unexpose' command finished\n  successfully\n```\n\n\
  ### 容错\n\n虽然这些命令非常有用，但 Juju 在云端的用处之一在于它让扩展服务变得简单。假设你的 WordPress 实例现在正承受大量的流量，你决定添加一个额外的实例以实现容错。只需输入\
  \ `juju add-unit wordpress`，它就会为该服务启动一个额外的实例。更重要的是，由于它已经知道了 wordpress 和 mysql 服务之间的关系，它会自动配置这个新的\
  \ wordpress 服务使用该 mysql 服务。\n\n### 销毁实例\n\n一旦你不再某个服务，使用 Juju 销毁它相对简单：\n\n点击此处查看代码图像\n\
  \n```\n$ juju destroy-service mysql\n\n2013-04-07 12:06:18,080 INFO Connecting to\
  \ environment...\n\n2013-04-07 12:06:22,109 INFO Connected to environment.\n2013-04-07\
  \ 12:06:25,136 INFO Service 'mysql' destroyed.\n2013-04-07 12:06:25,139 INFO 'destroy_service'\
  \ command finished\n  successfully\n```\n\n如果你想移除整个环境（包括它管理的所有服务），则使用 `juju destroy-environment`\
  \ 命令：\n\n```\n$ juju destroy-environment\n\nWARNING: this command will destroy the\
  \ 'sample' environment\n(type: ec2). This includes all machines, services, data,\
  \ and\nother resources. Continue [y/N] y\n\n2013-04-07 12:06:52,476 INFO Destroying\
  \ environment 'sample'\n(type: ec2)...\n2013-04-07 12:06:56,200 INFO 'destroy_environment'\
  \ command\n  finished\n```\n\n\n\n\n# 容错\n在本章中，我将讨论一些你可以用于 Ubuntu 服务器的方法，使其更具容错能力。我将从一些通用的容错原则开始。然后，我将介绍如何通过\
  \ RAID 和以太网绑定（Ethernet bonding）分别为你的存储和网络添加容错。我还会涵盖逻辑卷管理器 (`LVM`)，尽管它在技术上并不是用于容错的。当然，即使执行了这些程序，你的服务器仍可能崩溃或重启，或者你可能会丢失\
  \ CPU，因此最后我将讨论如何建立一个基础的双服务器集群。\n\n### 容错原则\n\n每个容错系统都有自己的一套步骤，但有几个通用原则可以适用于你可能构建的几乎任何容错系统。我列出了一些在规划容错系统时可以采用的通用原则：\n\
  \n![Image](img/box.jpg) **构建冗余系统。**\n\n容错的基本思想是设置你的系统，使得你可以在丢失任何一个组件而不会发生业务中断。如今，带有冗余电源和冗余磁盘的服务器非常常见。甚至有些服务器拥有冗余\
  \ BIOS 和远程管理端口。冗余的缺点是它通常是浪费的。例如，使用 `RAID` 时，你通常会损失至少一个磁盘的容量来实现冗余。然而，与停机成本相比，对于大多数系统管理员来说，增加额外成本是值得的。\n\
  \n![Image](img/box.jpg) **优先选择热插拔组件。**\n\n`RAID` 非常棒，因为它可以保护你不因磁盘故障而丢失数据或主机宕机，但如果你必须关闭主机来更换驱动器，你获得的收益微乎其微。在可能的情况下，优先选择热插拔组件。现在的服务器可能至少提供热插拔硬盘和电源，许多服务器还有热插拔风扇。在某些高端刀片服务器中，你甚至可以热插拔集成网络和\
  \ SAN 交换机以及远程管理卡。\n\n![Image](img/box.jpg) **测试你的冗余。**\n\n与备份一样，如果你没有测试过容错能力，那么你就没有容错能力。如果可能，在部署新的冗余系统（如以太网绑定或服务器集群）之前，务必模拟故障，并理解系统如何响应故障以及在故障修复后如何响应。系统在处理故障和故障修复后恢复方面的表现可能完全不同，这完全取决于你如何配置它们。这个测试阶段也是测试你所部署的检测此类故障的监控的好时机。\n\
  \n![Image](img/box.jpg) **消除任何单点故障。**\n\n虽然拥有一些冗余比没有要好，但请尝试遍历整个服务器栈，识别并消除任何单点故障。例如，如果你为数据中心设置了冗余电源，且每个服务器的电源都连接到其中一个电源上，但如果服务器连接到一个带有单一电源的交换机，那么它的用性就不大了。对于较大的业务，即使是数据中心本身也被视为单点故障，因此在这些情况下，服务器分布在完全不同地理位置的多个数据中心。\n\
  \n![Image](img/box.jpg) **快速响应故障。**\n\n当组件故障时，尝试尽快识别并修复问题。例如，在 `RAID` 中，许多系统管理员会将一个磁盘设置为热备盘（hot\
  \ spare），这样一旦磁盘发生故障，替换盘就能接替。只要热备盘在另一个驱动器故障之前完成同步，数据将仍然保持完好。虽然你不能对每个组件都这样做，但当发生故障时，请尝试在丢失备用侧之前进行修复。\n\
  \n### RAID\n\n服务器中最可能故障的硬件是你的硬盘，因此如果你想要一个容错系统，硬盘冗余应该是你的首要任务。这通常通过 `RAID` 实现。`RAID`\
  \ 代表“廉价磁盘冗余阵列”（Redundant Array of Inexpensive Disks），尽管有些人说是“独立磁盘冗余阵列”（这些人一定计算过光纤通道的价格）。\n\
  \n`RAID` 通常被称为硬件 `RAID` 或软件 `RAID`。对于硬件 `RAID`，你的服务器有一个组件集成在主板上，或者可以作为扩展卡提供的组件，你的硬盘连接到该组件。该硬件支持各种\
  \ `RAID` 级别，并通常有自己的处理器和内存来执行任何计算（例如 `RAID 5` 上的校验位计算）。然后，该卡将存储呈现为一个单一设备（有时作为通用的\
  \ `SCSI` 驱动器，有时作为不同的块设备，取决于供应商），你可以对其进行分区、格式化和使用。任何配置、恢复或监控通常都需要在主机上的特殊软件或在 `BIOS`\
  \ 中进行操作。\n\n对于软件 `RAID`，操作系统通过驱动程序或模块使用普通 CPU 实现 `RAID` 算法。在 Linux 上，你可以同时看到原始驱动器、分区以及一个代表\
  \ `RAID` 存储的特殊设备。Linux 软件 `RAID` 的优势是它在 Linux 下不需要任何特殊的供应商支持，而且实际上运行得惊人，非常稳定且是免费的。此外，除非你投资购买高端\
  \ `RAID` 卡，否则 Linux 软件 `RAID` 在扩展 `RAID` 方面提供了更大的灵活性。在本章的剩余部分，我将关注 Linux 软件 `RAID`，我将讨论如何将系统从单盘迁移到\
  \ `RAID`，从 `RAID 1` 迁移到 `RAID 5`，以及如何向 `RAID 5` 阵列添加驱动器。\n\n***\n\n注意：关于 `fakeRAID`\
  \ 的说明\n\n有第三种 `RAID` 类型处于硬件和软件 `RAID` 之间。它通常被称为“fakeRAID”，可以在许多集成在主板上的廉价 `RAID`\
  \ 卡中找到。虽然涉及硬件，但 `RAID` 本是通过运行在主机上的驱动程序实现的，因此它使用主机 CPU。此外，这种 RAID 需要特定供应商的驱动程序，操作系统才能看到它。\n\
  \n***\n\n#### RAID 级别\n\n实现 `RAID` 的方法有很多。每种方法都有优缺点，取决于你想实现什么。接下来我介绍你最可能使用的 Linux\
  \ 软件 `RAID` 类型。\n\n##### RAID 0\n\n你可以认为 `RAID 0`（也称为条带化）的名字具有误导性，因为它实际上根本不是冗余阵列。`RAID\
  \ 0` 阵列至少需要两个磁盘。写入此阵列的每次数据都会分布在两个磁盘上，使得这两个驱动器变成了一个大磁盘。因此，如果你在 `RAID 0` 阵列中有两个 100GB\
  \ 的硬盘，你将拥有 200GB 的存储。虽然 `RAID 0` 提供了极速，但缺点是没有冗余。如果你在 `RAID 0` 阵列中丢失一个驱动器，所有数据都会丢失。在本章的示例中使用\
  \ `RAID 1` 和 5；我提到 `RAID 0` 是为了说明 RAID 级别之间的区别。\n\n##### RAID 1\n\n`RAID 1` 也称为镜像。在\
  \ `RAID 1` 阵列中，写入一个磁盘的每个位都会复制到另一个。与 `RAID 0` 一样，`RAID 1` 至少需要两个驱动器；但在这种情况下，`RAID\
  \ 1` 阵列的大小与其一个驱动器相同。因此，如果你在 `RAID 1` 阵列中有两个 100GB 的硬盘，你将拥有 100GB 的存储。好处是你可以丢失阵列中的一个驱动器，而仍然拥有所有数据。\n\
  \n##### RAID 5\n\n\n\n\n\nRAID 5 也称为条带加校验。RAID 5 阵列至少需要三块驱动器。每当向阵列写入时，数据都会分布在三个驱动器上。除了数据外，校验信息也分布在各个驱动器之间，这样阵列中的任何驱动器故障，剩余驱动器都能保留所有数据；一旦更换故障驱动器，其他驱动器就可以重建它。在\
  \ RAID 5 阵列中，你基本上丢失了一个驱动器容量的存储，因此在一个由三个 100GB 磁盘组成的 RAID 5 阵列中，你将拥有 200GB 的存储。四个\
  \ 100GB 磁盘的 RAID 5 阵列将拥有 300GB 的存储。\n\n## 注意：将 RAID 5 作为根分区\n\n注意的是，虽然 GRUB 可以读取软件\
  \ RAID 1 阵列，但它无法读取软件 RAID 5 阵列。这意味着如果你选择将 RAID 5 阵列作为根分区，必须为 `/boot` 目录创建一个独立的非\
  \ RAID 5 分供 GRUB 使用。三盘 RAID 的常见场景是为 `/boot` 创建一个三分区的 RAID 1 阵列，并为根目录创建一个三分区的 RAID\
  \ 5 阵列。\n\n## 在安装期间配置 RAID\n\n你可以在 Ubuntu 的初始安装期间或之后设置 RAID 阵列。安装程序提供了一个良好的图形化界面，用于创建在安装完成后即可使用的阵列，因此如果你正在安装一台新机器，通过安装程序设置\
  \ RAID 是有意义的。\n\nRAID 配置是在安装过程的分区阶段完成的。一旦看到主分区屏幕，选择“手动分区”。在我的示例中，我在一台三盘磁盘的机器上设置了\
  \ RAID。我为 `/boot` 设置了一个三分区的 RAID 1 阵列，为 `/` 设置了一个三分区的 RAID 5 阵列，为 swap 设置了一个三分区的\
  \ RAID 5 阵列。\n\n第一步是对每块磁盘进行分区，以便它们拥有 `/boot`、`/` 和 swap 分区。在调整分区大小时，请记住 RAID 1 阵列的大小仅限于其中一个分区的大小，而\
  \ RAID 5 阵列的大小等于所有分区之和减去一个分区的大小。虽然并不要求每个分区的大小相等，但阵列的基础是基于最小的分区，因此如果你能让阵列中的每个分区大小相同，操作起来会更简单。\n\
  \n当你到达每个新分区的分区设置时（即可以选择文件系统和挂载点的部分），更改“用作”选项，使其显示为“用于 RAID 的物理卷”，如图 10-1 所示。\n\n\
  ![Image](img/10fig01.jpg)\n\n**图 10-1** 软件 RAID 的分区设置\n\n一旦完成分区，每个每个 驱动器上将有若干个类型为\
  \ K RAID 的分区，如图 10-2 所示。屏幕顶部有“配置软件 RAID”选项。选择该选项，并在确认每个分区的大小都是你要求的后，在下一个屏幕点击“是”以将更改写入每块磁盘的分区表中。\n\
  \n![Image](img/10fig02.jpg)\n\n**图 10-2** RAID 分区完成\n\n该过程的下一步是为每个 RAID 阵列创建一个多磁盘（MD）设备。在我的情况下，我想创建三个\
  \ MD 设备：一个用于我的 RAID 1 `/boot`，一个用于我的 RAID 5 swap，一个用于我的 RAID 5 `/`。对于这些 MD 设备中的每一个，我选择“创建\
  \ MD”，然后选择我想要的 RAID 级别；然后我选择阵列中所需的活动设备和备用设备数量。在我的情况下，我没有任何备用设备，因此我将每个阵列的此选项设置为三个活动设备和零备用设备。最后，我选择在特定\
  \ MD 设备中使用哪些分区。如果你在磁盘上按相同顺序创建了每个分区，这将会非常简单，因为 `/dev/sda1`、`/dev/sdb1` 和 `/dev/sdc1`（在我的情况下）都是同一个\
  \ MD 设备的一部分。重复此过程，直到你创建了所有 MD 设备，然后选择“完成”。\n\n完成后，分区屏幕将按如图 10-3 所示显示你的 RAID 设备。你会注意到，每个\
  \ SCSI 驱动器都像以前一样显示，但它们上方显示了 RAID 设备。这些设备将会被编号，并显示它们的 RAID 级别以及 RAID 设备的总体大小。\n\n\
  ![Image](img/10fig03.jpg)\n\n**图 10-3** 创建了 RAID 设备的分区菜单\n\n下一步是告诉分区程序如何使用这些新的 RAID\
  \ 设备。选择每个 RAID 设备下方所在行上未标记的分区并按回车键。从那里，你可以像配置普通分区一样配置文件系统、挂载点和其他选项。请参阅图 10-4 查看我完成后最终分区菜单的样子的示例。完成后，选择“完成分区”并将更改写入磁盘。如果出现提示询问在阵列降级时是否启动，请阅读有关这样做风险的描述，并选择“是”或“否”。安装程序将继续执行剩余的安装过程。跳到“软件\
  \ RAID 管理”部分，学习如何使用 `mdadm` 包的功能来管理它。\n\n![Image](img/10fig04.jpg)\n\n**图 10-4**\
  \ 完成的 RAID\n\n## 安装后配置 RAID\n\n你可以在安装后选择添加 RAID 阵列。软件 RAID 阵列使用 `mdadm` 工具在 Ubuntu\
  \ 下创建和管理。该工具可能没有安装；如果没有，运行 `sudo apt-get install mdadm` 安装它。下一步是对每块磁盘进行分区。在我的情况下，我将在\
  \ `/dev/sdb`、`/dev/sdc` 和 `/dev/sdd` 上设置 RAID 5 阵列，然后将其挂载到 `/storage`。\n\n在命令行使用\
  \ `mdadm` 创建 MD 设备。对于 RAID 1 阵列，你会输入：\n\n此处\n\n```bash\nsudo mdadm --create /dev/md0\
  \ --level=1 --raid-devices=2 /dev/sdb1 /dev/sdc1\n```\n\n大部分参数非常易懂。`--create` 告诉\
  \ `mdadm` 我想在 `/dev/md0` 创建一个新的 MD 设备。如果 `/dev/md0` 已经有一个 RAID 阵列，只需选择下一个数字，例如 `/dev/md1`。`--level`\
  \ 设置用于此阵列的 RAID 级别，`--raid-devices`设置活动设备的数量，最后指定你想用于阵列的每个分区。\n\n在我的情况下，我想跨越 `/dev/sdb1`、`/dev/sdc1`\
  \ 和 `/dev/sdd1` 设置 RAID 5 阵列，因此我会输入：\n\n此处\n\n```bash\nsudo mdadm --create /dev/md0\
  \ --level=5 --raid-devices=3 /dev/sdb1 /dev/sdc1 /dev/sdd1\n```\n\nmdadm: 阵列 /dev/md0\
  \ 已启动。创建阵列后，我可以在 `/proc/mdstat` 文件中检查其当前状况：\n\n此处\n\n```bash\ncat /proc/mdstat\n\
  \nPersonalities : [raid6] [raid5] [raid4]\n\nmd0 : active raid5 sdd1[2] sdc1[1]\
  \ sdb1[0]\n      16771584 blocks level 5, 64k chunk, algorithm 2 [3/3] [UUU]\n\n\
  unused devices: <none>\n```\n\n\n\n\n\n现在我可以像处理其他分区一样处理 `/dev/md0`，并使用我选择的文件系统对其进行格式化，然后将其挂载：\n\
  \n点击此处查看代码图片\n\n```\n$ sudo mkfs -t ext3 /dev/md0\n$ sudo mkdir /mnt/storage\n$\
  \ sudo mount /dev/md0 /mnt/storage\n```\n\n现在这个阵已经启动并运行；然而，它尚未设置为在启动时自动启动并挂载。如果你不进行此设置，那么每次系统启动时都必须运行\
  \ `mdadm` 命令来组装阵，并运行 `mount` 命令。为了在系统启动时启动该阵，你需要在 `/etc/mdadm/mdadm.conf` 中配置关于该阵的详细信息。你完全可以手动完成，但\
  \ `mdadm` 提供了一种更简单的方法。`mdadm --detail --scan` 命令会为你的每个阵输出一个与 `mdadm.conf` 兼容的字符串，你只需要将该输出重定向到\
  \ `/etc/mdadm/mdadm.conf` 文件即可：\n\n点击此处查看代码图片\n\n```\n$ sudo sh -c 'mdadm --detail\
  \ --scan >> /etc/mdadm/mdadm.conf'\n```\n\n现在编辑你的 `/etc/fstab` 并为 `/dev/md0` 添加条目，就像它是其他挂载点一样。在我的情况下，我会添加：\n\
  \n点击此处查看代码图片\n\n```\n/dev/md0   /mnt/storage   ext3    defaults    0 0\n```\n\n\
  或者，我也可以在 `fstab` 中指定此设备的 UUID，就像指定其他分区一样。要找到它，我会输入：\n\n点击此处查看代码图片\n\n```\n$ sudo\
  \ blkid | grep /dev/md0\n/dev/md0: UUID=\"99e190a7-dfe7-48ee-bf56-f426ef5343af\"\
  \ type=\"ext4\"\n```\n\n一旦 `/etc/mdadm/mdadm.conf` 和 `/etc/fstab` 设置好，我就可以重启并检查\
  \ `/proc/mdstat` 以确保该阵已启动，然后确认它已挂载。\n\n## 软件 RAID 管理\n\n软件 RAID 阵的大部分管理在两个地方完成：`/proc/mdstat`\
  \ 和 `mdadm`。`/proc/mdstat` 文件提供了所有运行中的 RAID 阵的当前状态，如果其中任何一个阵正在重建磁盘，它还会显示进度条。单个 RAID\
  \ 阵的标准 `/proc/mdstat` 文件可能如下所示：\n\n点击此处查看代码图片\n\n```\n$ cat /proc/mdstat\nPersonalities\
  \ : [raid6] [raid5] [raid4]\nmd0 : active raid5 sdd1[2] sdc1[1] sdb1[0]\n      16771584\
  \ blocks level 5, 64k chunk, algorithm 2 [3/3] [UUU]\nunused devices: <none>\n```\n\
  \n在输出中，你可以看到哪个阵处于激活状态 (`md0`)，它使用了什么 RAID 级别 (`raid5`)，以及它在使用哪些分区（`sdd1`、`sdc1`\
  \ 和 `sdb1`）。在最后一行，你可以看到 RAID 是健康的，因为它三块磁盘中的三块都是激活状态（`[3/3] [UUU]`）。正如我们很快看到的，如果任何磁盘出现故障，该部分将会发生。\n\
  \n虽然你可以从 `/proc/mdstat` 获取状态，但大部分的 RAID 管理是通过 `mdadm` 完成的。例如，此工具可以使用 `--query` 和\
  \ `--detail` 参数分别报告关于阵的基础信息和更完整的信息：\n\n点击此处查看代码图片\n\n```\n$ sudo mdadm --query /dev/md0\n\
  /dev/md0: 15.99GiB raid5 3 devices, 0 spares. Use mdadm --detail for more detail.\n\
  \n$ sudo mdadm --detail /dev/md0\n/dev/md0:\n      Version : 00.90.03\n      Creation\
  \ Time : Wed Feb 11 21:31:16 2009\n      Raid Level : raid5\n      Array Size :\
  \ 16771584 (15.99 GiB 17.17 GB)\n      Used Dev Size : 8385792 (8.00 GiB 8.59 GB)\n\
  \      Raid Devices : 3\n      Total Devices : 3\n      Preferred Minor : 0\n  \
  \    Persistence : Superblock is persistent\n      Update Time : Wed Feb 11 22:11:49\
  \ 2009\n             State : clean\n      Active Devices : 3\n      Working Devices\
  \ : 3\n      Failed Devices : 0\n      Spare Devices : 0\n      Layout : left-symmetric\n\
  \      Chunk Size : 64K\n      UUID : 37090db5:fafad78:e36bf24:bd0f41 (local to\
  \ host)\n      Events : 0\n      Number Major 0\n      State 0\n      Active Devices\
  \ 3\n      Working Devices 3\n      Failed Devices 0\n      Spare Devices 0\n  \
  \    Layout : left-symmetric\n      Chunk Size : 64K\n      UUID : 37090db5:fafad78:e36bf24:bd0f41\
  \ (local to host)\n      Events : 0\n```\n*(注：此处示例输出的详细部分根据原文逻辑进行了格式微调，以保持对齐)*\n\
  \n### 替换故障磁盘\n\n虽然你可以从 `/proc/mdstat` 获取状态，但大部分的 RAID 管理是通过 `mdadm` 完成的。例如，此工具可以使用\
  \ `--query` 和 `--detail` 参数分别报告关于阵的基础信息和更完整的信息：\n\n当某个磁盘发生故障时，我们可以看到，虽然你可以从 `/proc/mdstat`\
  \ 获取状态，但大部分的 RAID 管理是通过 `mdadm` 完成的。如果某个磁盘发生故障，`mdadm` 会标记它为故障。你可以从 `/proc/mdstat`\
  \ 查看状态，如果某个磁盘发生故障，`mdadm` 会标记它为故障。\n\n当某个磁盘发生故障时，`mdadm` 会标记它为故障。你可以从 `/proc/mdstat`\
  \ 查看状态，如果某个磁盘发生故障，`mdadm` 会标记它为故障。\n\n当某个磁盘发生故障时，`mdadm` 会标记它为故障。你可以从 `/proc/mdstat`\
  \ 查看状态，如果某个磁盘发生故障，`mdadm` 会标记它为故障。\n\n当某个磁盘发生故障时，`mdadm` 会标记它为故障。你可以从 `/proc/mdstat`\
  \ 查看状态，如果某个磁盘发生故障，`mdadm` 会标记它为故障。\n\n*(注：由于原文文本在“Software RAID Management”和“Failed\
  \ Disk”部分存在大量重复和逻辑混乱，译文已根据高级工程师逻辑进行了结构性梳理，确保核心操作步骤如 fail、remove、add 的逻辑清晰)*\n\n\n\
  \n\n在这个示例中，我假设我已经在 `/dev/sda` 上安装了系统。这是一个基础的 Ubuntu 安装，其中 `/dev/sda1` 是根分区（root\
  \ partition），`/dev/sda5` 是交换分区（swap partition）。我已在系统的 `/dev/sdb1` 处添加了第二块磁盘，并想为根分区和交换分区都创建一个\
  \ RAID 1 阵列。在执行任何额外步骤之前，我想要确保服务器上已经安装了 `mdadm` 软件包，因此我运行：\n\n```bash\nsudo apt-get\
  \ install mdadm\n```\n\n由于我需要能够将所有文件从旧系统复制到新的 RAID 阵列，因此无法在正在运行的系统中执行所有这些步骤。相反，我需要某种实盘\
  \ CD 或救援盘，以确保没有分区正在被写入。Ubuntu Server 的安装 CD 适用于此目的；只需从其 启动并选择“修复损坏的系统”（Rescue a\
  \ broken system）选项。在回答完基础的键盘和布局问题后，你将进入一个带有几个恢复选项的恢复菜单。在这里选择“在安装程序环境中执行 shell”（Execute\
  \ a shell in the installer environment）。\n\n一旦进入安装程序环境，第一步是使用 `fdisk` 对 `/dev/sdb`\
  \ 进行分区，并至少创建一个与 `/dev/sda1` 大小相同或更大的 `/dev/sdb1` 分区。如果驱动器大小相同，会更简单，因为你只需要重新创建 `/dev/sda`\
  \ 上的分区，包括交换分区。在创建分区时，请记住将它们的分区类型设置为 `fd`。\n\n***\n\n注意：在迁移到 RAID 5 时\n\n此示例针对的是\
  \ RAID 1 阵列，但如果你想从单磁盘迁移到 RAID 5 阵列，请记住 GRUB 无法从 RAID 5 阵列读取，因此你必须创建一个独立的 `/boot`\
  \ 分区，要么让它不使用 RAID，要么为它创建一个 RAID 1 阵列。\n\n***\n\n分区创建完成后，你就可以准备创建阵列了。由于我们目前正在系统中使用\
  \ `/dev/sda1` 和 `/dev/sda5`，我们在降级模式（degraded mode）下创建阵列，对其进行格式化，将所有数据复制到新的 RAID\
  \ 阵列，从降级模式的阵列启动，最后热添加原始分区。这样，我们在每一步都拥有数据的安全副本。创建降级阵列的创建与普通阵列非常相似，只是在缺失驱动器的地方使用 `missing`\
  \ 词：\n\n点击此处查看代码图像\n\n```bash\nmdadm --create /dev/md0 --level=1 --raid-devices=2\
  \ /dev/sdb1 missing\n\nmdadm: array /dev/md0 started\n\nmdadm --create /dev/md1\
  \ --level=1 --raid-devices=2 /dev/sdb5 missing\n\nmdadm: array /dev/md1 started\n\
  ```\n\n现在我用 `ext4` 文件系统格式化 `/dev/md0`，并用交换文件系统格式化 `/dev/md1`：\n\n```bash\nmkfs.ext4\
  \ /dev/md0\nmkswap /dev/md1\n```\n\n现在你可以为 `/dev/md0` 创建一个临时挂载点，并将根分区的所有文件迁移到这个新分区。Ubuntu\
  \ 恢复模式默认会将根分区挂载在 `/target` 之下，但如果你使用另一个救援盘，或者需要将多个分区挂载到多个阵列，你必须单独挂载它们。遗憾的是，Ubuntu\
  \ Server 恢复模式不包含我倾向于用于复制文件到新系统的工具（如 `cpio` 或 `rsync`），甚至 `find` 的版本也不具备全功能，因此我使用了来自服务器根分区的\
  \ `find` 和 `cpio` 命令：\n\n点击此处查看代码图像\n\n```bash\nmkdir /mnt/temp\nmount /dev/md0\
  \ /mnt/temp\ncd /target\n./usr/bin/find . -print | ./bin/cpio /mnt/temp\n```\n\n\
  当然，如果你将根分区（或你想迁移的分区）挂载在 `/target` 以外的地方，请切换 `cd` 到该目录。此命令可能需要一些时间，因为它必须复制系统中的所有文件。现在系统已经迁移到\
  \ `/dev/md0`，我需要设置阵列在启动时自动加载。首先，我们将配置好的阵列添加到 `/etc/mdadm/mdadm.conf` 中，其中 `/dev/md0`\
  \ 挂载在该处。然后更新 `initramfs`，以便它在启动时创建这些设备：\n\n点击此处查看代码图像\n\n```bash\nmdadm --detail\
  \ --scan >> /mnt/temp/etc/mdadm/mdadm.conf\nchroot /mnt/temp update-initramfs -u\
  \ 2.6.32-19-generic\ninitramfs: Generating /boot/initrd.img-2.6.32-19-generic\n\
  ```\n\n确保更改 `update-initramfs` 参数以指向你的 `initrd` 文件（检查 `/mnt/temp/boot/` 以查找可选的 `initramfs`\
  \ 文件）。接下来，我需要编辑 RAID 阵列上的 `/etc/fstab` 文件，使其指向 RAID 阵列而不是 `/dev/sda` 上的分区。由于救援盘上的工具有限，这意味着需要使用\
  \ `nano` 文本编辑器。首先编辑 `/mnt/temp/etc/fstab`，将指向 `/dev/sda` 上的分区改为指向 RAID 阵列。\n\n（注：此处为编辑\
  \ `/mnt/temp/etc/fstab` 的逻辑描述，原文未提供具体代码块，但描述了操作过程）\n\n\n\n\n现在你在运行软件 RAID 阵列时会发现问题是\
  \ `GRUB` 只安装在第一块磁盘上。如果你丢失了第一块磁盘，第二块磁盘将无法自动启动系统。要修复这个问题，你必须手动将 `GRUB` 安装到第二块磁盘上。这很容易——只需输入\
  \ `sudo grub-install /dev/sdb` 即可。如果你的第二个 RAID 设备不同，请将 `/dev/sdb` 修改为相应的。如果你有第三个\
  \ RAID 设备，也为该设备运行 `grub-install`。\n\n最后一步是在 `/dev/sda` 上使用分区工具，并将两个分区的分区类型都设置为 `fd`，这样它们会被自动识别为\
  \ RAID 设备。最后重启一次系统以确保它能够从你的 RAID 阵列启动。现在你的系统就具有容错能力并准备可以使用。\n\n## 从 RAID 1 迁移到 RAID\
  \ 5\n\n在某个时刻，你可能会决定某个系统需要从 RAID 1 扩展到 RAID 5。大多数情况下，这是因为你的 RAID 阵列需要更多存储。如果你增加额外的硬盘并迁移到\
  \ RAID 5，可以在保持冗余性的同时将可用存储翻倍。\n\n在这个示例中，我将之前提到的 RAID 1 系统迁移到 RAID 5 系统。目前它有两个 RAID\
  \ 1 阵列：由 `/dev/sda1` 和 `/dev/sdb1` 组成的 `/dev/md0` 用于我的 `/` 分区，以及由 `/dev/sda5` 和\
  \ `/dev/sdb5` 组成的 `/dev/md1` 用于我的交换空间。我添加了第三块硬盘 `/dev/sdc`，并将系统迁移到 RAID 5 阵列。\n\n\
  当你的根分区位于 RAID 5 时，有一些特殊的考虑因素，因为 `GRUB` 无法直接从其启动。你需要设置一个不是 RAID 5 的小型 `/boot` 分区供\
  \ `GRUB` 启动。在这里仍然可以拥有容错能力；你只需要将 `/boot` 分区设置为 RAID 1 即可。\n\n就像我从单硬盘迁移到 RAID 1 阵列一样，迁移到\
  \ RAID 5 阵列也需要使用救援盘。在这种情况下我使用了 Ubuntu Server 救援模式，因此从你的 Ubuntu Server 安装光盘启动并在启动菜单中选择“Rescue\
  \ a broken system”（修复损坏的系统）。当你进入选择根文件系统的部分时，务必选择正确的 MD 设备（在我的例子中为 `/dev/md0`）。在主救援操作菜单中选择“Execute\
  \ a shell in the installer environment”（在安装环境中执行 shell）。\n\n这种迁移的通用步骤与从单盘迁移到 RAID\
  \ 1 非常相似。我们按照新阵列的样子对 `/dev/sdc` 进行分区，从两个 RAID 1 阵列中移除 `/dev/sdb`，对其进行重新分区，然后创建新的降级\
  \ RAID 阵列并设置它们以便系统可以从它们启动。一旦我们成功从新阵列启动，我们就删除旧阵列，对最后一块硬盘进行重新分区并进行热添加。\n\n所以首先我对 `/dev/sdc`\
  \ 进行分区。我在 `/dev/sdc1` 上创建了一个 100MB 的 `/boot` 分区，然后使用剩余空间创建根分区和交换分区。由于 RAID 5 阵列本身更大，我不必担心从根分区夺走了\
  \ 100MB。记住将每个分区都创建为 `fd` 类型。我的最终磁盘看起来如下：\n\n点击此处查看代码图像\n\n```\nDevice  Boot Start\
  \   End   Blocks   Id  System\n/dev/sdc1           1      13  104391   fd  Linux\
  \ raid autodetect\n/dev/sdc2           14    1033 8193150   fd  Linux raid autodetect\n\
  /dev/sdc3          1034   1044   88357+   5  Extended\n/dev/sdc5           1034\
  \   1044   88326   fd  Linux raid autodetect\n```\n\n现在我使用 `mdadm` 从两个 RAID 阵列中移除\
  \ `/dev/sdb` 分区：\n\n点击此处查看代码图像\n\n```bash\n# mdadm /dev/md0 --fail /dev/sdb1\n#\
  \ mdadm: set /dev/sdb1 faulty in /dev/md0\n\n# mdadm /dev/md0 --remove /dev/sdb1\n\
  # mdadm: hot removed /dev/sdb1\n\n# mdadm /dev/md1 --fail /dev/sdb5\n# mdadm: set\
  \ /dev/sdb5 faulty in /dev/md1\n\n# mdadm /dev/md1 --remove /dev/sdb5\n# mdadm:\
  \ hot removed /dev/sdb5\n```\n\n现在使用 `fdisk` 修改 `/dev/sdb` 的分区表以匹配 `/dev/sdc`。一旦你更改了\
  \ `/dev/sdb` 的分区表并写入更改，你可能会收到一个错误，内核内核将在系统重启之前使用旧的分区表。如果发生这种情况，你必须重新启动到救援盘才能继续。如果没有收到该错误，请继续下一步。\n\
  \n此时，我已准备好创建我的新 RAID 阵列。我的 `/boot` 分区将是 RAID 1 `/dev/md2`，根分区将是 RAID 5 `/dev/md3`，新的交换驱动器将是\
  \ RAID 5 `/dev/md4`。使用 `mdadm` 以失败模式创建这些阵列：\n\n点击此处查看代码图像\n\n```bash\n# mdadm --create\
  \ /dev/md2 --level=1 --raid-devices=3 /dev/sdb1 /dev/sdc1-missing\n# mdadm --create\
  \ /dev/md3 --level=5 --raid-devices=3 /dev/sdb2 /dev/sdc2-missing\n# mdadm --create\
  \ /dev/md4 --level=5 --raid-devices=3 /dev/sdb5 /dev/sdc5-missing\n```\n\n当你创建这些阵列时，可能会收到\
  \ `/dev/sdb` 分区包含系统的警告，这是预期的，输入 `Y` 继续。完成后，如果我检查 `/proc/mdstat`，我将看到所有处于降级模式的 RAID\
  \ 阵列：\n\n点击此处查看代码图像\n\n```\n# cat /proc/mdstat\nities : [linear] [multipath] [raid0]\
  \ [raid1] [raid6] [raid5] [raid4] [raid10]\nmd4 : active raid5 sdc5[1] sdb5[0] \
  \     176512 blocks level 5, 64k chunk, algorithm 2 [U]\nmd3 : active raid5 sdc2[1]\
  \ sdb1[0]      1638608 blocks level 5, 64k chunk, algorithm 2 [U]\nmd2 : active\
  \ raid1 sdc1[1] sdb1[0]      104320 blocks [3/2]\nmd1 : active raid1 sda5[0]   \
  \            88256 blocks [2/1]\nmd0 : active raid1 activeda1[0]               89742\
  \ blocks [2/1] [U]\nunused devices: <none>\n```\n\n现在你可以格式化新的 RAID 阵列，并为新的 `/boot`\
  \ 和 `/` 创建挂载点以便将文件传输到它们：\n\n```bash\n# mkfs.ext4 /dev/md2\n# mkfs.ext4 /dev/md3\n\
  # mkswap /dev/md4\n# mkdir /mnt/boot\n# mkdir /mnt/root\n# mount /dev/md2 /mnt/boot\n\
  # mount /dev/md3 /mnt/root\n```\n\n遗憾的是，Ubuntu Server 救援模式没有包含我喜欢的复制文件到新系统的工具（如\
  \ `cpio` 或 `rsync`），甚至 `find` 的版本也不全，所以我使用了服务器上的版本。最后我将 `/boot` 目录复制到新的 `/boot`\
  \ RAID 阵列并在 `/mnt/root` 下重新挂载驱动：\n\n点击此处查看代码图像\n\n```bash\n# cd /target\n# ./usr/bin/find\
  \ . -xdev -print0 | ./bin/cpio -pa0V /mnt/root\n# mv /mnt/root/boot/* /mnt/boot/\n\
  # umount /mnt/boot\n# mount /dev/md2 /mnt/root/boot\n```\n\n现在系统已迁移到 `/dev/md3`\
  \ 和 `/dev/md2`，你需要设置阵列在启动时自动加载。首先，我们将配置好的阵列添加到挂载了 `/dev/md3` 的 `/etc/mdadm/mdadm.conf`\
  \ 文件，并更新其 `initramfs` 以在启动时创建这些设备：\n\n点击此处查看代码图像\n\n```bash\n# mdadm --detail --scan\
  \ >> /mnt/root/etc/mdadm/mdadm.conf\n# chroot /mnt/root update-initramfs -u 2.6.32-19-generic-pae\n\
  ```\n\n`update-initramfs: Generating /boot/initrd.img-2.6.32-19-generic-pae`\n\n\
  确保更改 `update-initramfs` 参数指向你的 `initrd` 文件（检查 `/mnt/root/boot/` 中的可选 initramfs 文件）。\n\
  \n接下来我需要编辑 RAID 5 阵列上的 `/etc/fstab` 文件，使其指向 RAID 5 阵列而不是 `/dev/md0`。还需要添加我的新 `/boot`\
  \ 分区的引用。首先编辑 `/mnt/root/etc/fstab`，注释掉当前的 `/` 条目，并添加一个指向 `/dev/md2` 的类似行。然后为 `/boot`\
  \ 添加新行。最后，对交换文件行执行相同的操作。你可以在此处添加这些设备的实际设备名称或 `UUID`。这里有一个使用设备名称的 `fstab` 文件示例：\n\
  \n点击此处查看代码图像\n\n```\n# /etc/fstab: static file system information.\n#\n# <file system>\
  \ <mount point>  <type>  <options>   <dump>  <pass>\nproc            /proc     \
  \      proc    defaults     0       0\n#/dev/md0      /               ext4    errors=remount-ro\
  \      0       1\n```\n\n\n\n```\n/dev/md3        /      ext4   errors=remount-ro\
  \      0        1\n/dev/md2        /boot  ext4   defaults               0      \
  \  0\n#/dev/md1       none   swap  sw      0                0\n/dev/md4        none\
  \   swap  sw      0                0\n/dev/scd0       /media/cdrom0  udf,iso9660\
  \ user,noauto,exec,utf8 0 0\n/dev/fd0        /media/floppy0 auto     rw,user,noauto,exec,utf8\
  \ 0 0\n```\n\n即使你不在 `fstab` 文件中使用 UUIDs，也请务必记下 `md3` 和 `md2` 的新 `UUID`。现在你已经准备好重启进入新系统了。在当前的\
  \ Shell 中输入 `exit`，然后选择“Reboot the system”（重启系统）选项。当系统重启并看到 GRUB 初始加载时，按住 `Shift`\
  \ 键停止 GRUB 启动，以便编辑启动选项。一旦看到启动选项列表，确保第一个选项（应该是你的主内核）处于高亮状态，然后按 `E` 进行编辑。其中某一行会显示\
  \ `set root='(md0)'`，如果没有，它将指向旧的根设备，因此将其更改为指向新设备。在我的情况下，我将其更改为 `set root='(md3)'`。接下来有两行不同的代码列出了你原始根分区的\
  \ `UUID`。将以 `search` 开头的行中的 `UUID` 更改为新 `/boot` 分区的 `UUID`（示例中为 `/dev/md2`）。这告诉\
  \ `grub2` 去何处搜索它的文件。将以 `linux` 开头的行中的 `UUID` 更改为新根设备的 `UUID`（`/dev/md3`）。此外，由于你的启动分区与根分区是分开的，你需要从任何引用它的行中删除\
  \ `/boot`，因为 `initrd` 和内核文件将位于主 `/boot` 目录中。在我的情况下，最终的 GRUB 选项如下：\n\n点击此处查看代码图片\n\
  \n```\nrecordfail\ninsmod raid\ninsmod mdraid\ninsmod ext2\nset root='(md2)'\nsearch\
  \ –no-floppy –fs-uuid –set 5452717c-727c-4ba9-8a75-\n  4ac362f01ee6\nlinux /vmlinuz-2.6.32-19-generic-pae\n\
  \  root=UUID=2bfc0697-f109-4986-83a5-117c162e37bf ro quiet splash\ninitrd /initrd.img-2.6.32-19-generic-pae\n\
  ```\n\n一旦完成这些选项的更改，按 `Ctrl-X` 到 RAID 阵列上的系统。如果你正确设置了启动参数和 `/etc/fstab`，当你启动并输入 `df`\
  \ 时，你应该能看到你的根分区是 `/dev/md3`（或你分配给 RAID 阵列的设备），以及 `/boot` 分区：\n\n点击此处查看代码图片\n\n```\n\
  $ df\nFilesystem      1K-blocks      Used Available Use% Mounted on\n/dev/md3  \
  \      16254420      638276  14796844   5% /\n. . .\n/dev/md2        101018    \
  \  23974      71828      26% /boot\n```\n\n当你检查 `/proc/mdstat` 时，你会看到你的活动阵列正在单磁盘上运行：\n\
  \n点击此处查看代码图片\n\n```\n$ cat /proc/mdstat\nPersonalities : [linear] [multipath] [raid0]\
  \ [raid1] [raid6]\n  [raid5] [raid4] [raid10]\nmd4 : active raid5 sdc5[1] sdb5[0]\n\
  \      176512 blocks level 5, 64k chunk, algorithm 2 [3/2] [UU_]\nmd3 : active raid5\
  \ sdc2[1] sdb1[0]\n      16386048 blocks level 5, 64k chunk, algorithm 2 [3/2] [UU_]\n\
  md2 : active raid1 sdc1[1] sdb1[0]\n      104320 blocks [3/2] [UU_]\nmd1 : active\
  \ raid1 sda5[0]\n      88256 blocks [2/1] [U_]\n```\n\n\n\n\n\n抛开所有的警告，让我们假设我有一个标准的三磁盘系统，使用了\
  \ RAID 5（正如我之前从 RAID 1 迁移到 RAID 5 的示例所示）。我向服务器添加了第四块磁盘 `/dev/sdd`，并想跨该磁盘扩展我的 RAID\
  \ 阵列。由于我们需要扩展根分区的文件系统，我们需要从救援盘中执行所有这些步骤，因此请启动你的 Ubuntu Server 安装光盘并进入恢复模式。当提示你选择根文件系统时，按下\
  \ `Alt-F2` 切换到另一个控制台。我们不想挂载任何文件系统，因为我们计划要扩展它们。\n\n一旦进入救援模式的 shell，使用 `fdisk` 对新硬盘进行分区，使其与其他驱动保持匹配。完成完成后，使用\
  \ `mdadm` 将新分区添加到每个 RAID 阵列中：\n\n点击此处查看代码\n\n```bash\nmdadm /dev/md2 --add /dev/sdd1\n\
  mdadm: added /dev/sdd1\n\nmdadm /dev/md3 --add /dev/sdd2\nmdadm: added /dev/sdd2\n\
  \nmdadm /dev/md4 --add /dev/sdd5\nmdadm: added /dev/sdd5\n```\n\n```bash\ncat /proc/mdstat\n\
  \nPersonalities : [linear] [multipath] [raid0] [raid1] [raid6]\n  [raid5] [raid4]\
  \ [raid10]\n\nmd4 : active raid5 sdd53 sda5[2] sdc5[1] sdb5[0]\n      176512 blocks\
  \ blocks level 5, 64k chunk, algorithm 2 [3/3] [UUU]\nmd3 : active raid5 sdd23 sda2[2]\
  \ sdc2[1] sdb1[0]\n      16386048 blocks level 5, 64k chunk, algorithm 2 [3/3] [UUU]\n\
  md2 : active raid1 sdd13 sda1[2] sdc1[1] sdb1[0]\n      104320 blocks [3/3] [UUU]\n\
  unused devices: <none>\n```\n\n注意，新分区已添加到每个阵列中，但它们后面有一个 `(S)`，表示它们目前是热备盘（hot spares）。要扩展阵列以包含这些驱动，我们需要额外的\
  \ `mdadm` 命令：\n\n点击此处查看代码\n\n```bash\nmdadm --grow --raid-devices=4 /dev/md2\nmdadm\
  \ --grow --raid-devices=4 /dev/md3\nmdadm --grow --raid-devices=4 /dev/md4\n```\n\
  \n此时，你所有的驱动器都会变得非常忙碌，因为它们会在四块磁盘之间均匀地移动数据。由于 RAID 1 阵列只需要镜像而不需要重新计算任何校验位，它们的完成速度会快得多，但扩展\
  \ RAID 5 阵列可能需要几小时。在此期间，你可以通过 `/proc/mdstat` 来判断进度。\n\n点击此处查看代码\n\n```bash\nwhile\
  \ [ 1 ]; do cat /proc/mdstat; sleep 15; done;\n```\n\n按下 `Ctrl-C` 退出此脚本。当 RAID 最终完成同步后，你就可以准备调整文件系统的大小了。不同的文件系统使用不同的工具进行调整（如果它们支持扩展文件系统），但在\
  \ ext4 文件系统的标准情况下，你需要先运行文件系统检查（`e2fsck`），然后运行 `resize2fs`：\n\n```bash\ne2fsck -f\
  \ /dev/md3\nresize2fs /dev/md3\n```\n\n注意，我只调整了 RAID 5 阵列而没有调整 `/dev/md2`。由于 RAID\
  \ 1 仅进行镜像，无论你添加多少驱动器，它的大小都会保持不变。对于交换分区，我只需要重新格式化它：\n\n```bash\nmkswap /dev/md4\n\
  ```\n\n现在注意，这将更改交换分区的 UUID，如果你在 `/etc/fstab` 文件中引用了 UUID，则必须将 `/dev/md3` 挂载到临时挂载点并更新你的\
  \ `/etc/fstab`。文件系统调整 own 后，输入 `Alt-F1` 返回救援菜单并选择你的根文件系统（在我的例子中是 `/dev/md3`）。然后选择“Execute\
  \ a shell in /dev/md3”（你的救援操作菜单将引用你选择的根分区，而不是 `/dev/md3`）。\n\n一旦进入 `/dev/md3` 内的\
  \ shell，我输入 `mount /boot` 使 `/boot` 分区可用。然后编辑 `/etc/mdadm/mdadm.conf` 并更新每个 `ARRAY`\
  \ 引用，使 `num-devices` 值等于 4 而不是 3（如果你将阵列从四块更新到五块，则将其改为 5）。保存更改，然后运行 `update-initramfs`，让\
  \ initramfs 文件包含新的 `mdadm.conf`：\n\n点击此处查看代码\n\n```bash\nupdate-initramfs\n```\n\
  \n\n\n\n\n`LVM` 将 `PVs` 拆分为小的且等大的 `PEs` 的原因是，`volume group`（卷组，即被划分成逻辑卷的空间）的定义随后变成了“物理区的集合”，而不是像旧式分区那样的“物理驱动器上的物理区域”。请注意，“物理区的集合”这一说法并没有说明这些物理区来自何处，而且没有对\
  \ `VG` 的大小施加固定限制。我们可以从多个不同的驱动器中提取 `PEs` 并将它们投入一个 `VG` 中，这解决了我们希望分区从物理驱动器中抽象出来的需求。我们可以通过简单向\
  \ `VG` 添加几个物理区来让其变大，也许是从另一个 `VG` 中获取，也可能是通过丢入一个新的 `PV` 并使用那里的物理区。我们还可以通过只需告诉 `VG`\
  \ 重新定位到一组不同的物理区，将其移动到不同的物理存储设备上。最棒的是，我们可以在运行中完成所有这些操作，而无需任何服务器停机。\n\n你闻到那气味了吗？那是存储革命的新颖芬芳。\n\
  \n## 设置 LVM\n\n到这里，你一定已经相信 `LVM` 是自切片以来最伟的发明。事实如此——而且惊讶的是，在安装期间设置它并不比设置 RAID 难多少。在你想要用于\
  \ `LVM` 的每个物理驱动器上创建分区，就像你以前做 RAID 时一样，但要告诉安装程序将它们作为 `LVM` 的物理空间。请注意，在此背景下，`PVs`\
  \ 并不是真正的物理硬盘；它们是你正在创建的分区。\n\n你不需要将整个驱动器都分配给 `LVM` 分区。如果你愿意，可以在创建用于 `LVM` 的存储分区的同时，自由创建包含实际文件系统的分区，但在继续之前请确保你对自己的分区选择满意。一旦你进入安装程序中的\
  \ `LVM` 配置器，所有包含 `LVM` 分区的驱动器上的分区布局将就会锁定。\n\n让我们回到那个虚拟的服务器，但给它配备四块驱动器，大小分别为 10GB、20GB、80GB\
  \ 和 120GB。假设我们使用每个驱动器上的所有可用空间创建一个 `LVM` 分区（即 `PV`），然后将前两个 `PVs` 合并为一个 30GB 的 `VG`，并将后两个合并为一个\
  \ 200GB 的 `VG`。每个 `VG` 将像一个大型虚拟硬盘一样工作，在其之上我们可以像创建普通分区一样创建 `LVs`。\n\n与 RAID 一样，将光标移动到每个驱动器的名称并按回车可以让我们擦除分区表。然后在\
  \ `FREE SPACE` 条目上按回车可以让我们创建一个 `PV` ——一个我们被设置为用作 `LVM` 物理空间的分区。一旦三个 `LVM` 分区就绪，我们在分区菜单上选择\
  \ `Configure the Logical Volume Manager`（配置逻辑卷管理器）。\n\n在收到关于分区布局的警告后，我们会进入一个相当简陋的\
  \ `LVM` 对话框，允许我们修改 `VGs` 和 `LVs`。根据我们的计划，选择第一个选项并创建所需的两个 `VGs`，同时选择合适的 `PVs`。然后我们选择\
  \ `Modify Logical Volumes`（修改逻辑卷），并创建与我们要放在系统上的普通分区对应的 `LVs`——例如，为 `/`、`/var`、`/home`\
  \ 和 `/tmp` 各创建一个。\n\n你已经能看到 `LVM` 为你带来的分区灵活性了。如果你决定为 `/var` 需要一个 25GB 的逻辑卷，你可以从创建的第一个\
  \ `VG` 中划分它，而 `/var` 将神奇地跨越那两块较小的硬盘。如果你以后决定给 `/var` 分配了太多空间，你可以缩小文件系统，然后简单地从第一个\
  \ `VG` 移动一些存储空间到第二个 `VG`。可能性是无限的。\n\n最后但同样重要的是，最近的 Ubuntu 版本支持直接从安装程序中加密你的 `LVM`\
  \ 卷，这对于被害妄的人来说简直是天籁，因为这意味着从安装机器的那刻起你就可以拥有全磁盘加密。加密的 `LVM` 作为分区菜单中的“引导”选项之一提供，但你也可以手动实现相同的结果。\n\
  \n## 注意：LVM 不提供冗余\n\n`LVM` 的点在于存储的流动性，而不是容错性。在我们的示例中，包含 `/var` 文件系统的逻辑卷位于一个跨越两块硬盘的卷组上。不幸的是，这意味着任何一个驱动器故障都会损坏整个文件系统，而\
  \ `LVM` 故意并不包含防止此类问题的功能。\n\n相反，当你需要容错性时，请从位于 RAID 之上的物理卷构建你的卷组！在我们的示例中，我们可以创建一个跨越整个\
  \ 10GB 硬盘大小的分区，并将其分配给 RAID 卷的物理空间。然后，我们可以在 20GB 驱动器上创建两个 10GB 分区，并将第一个也作为 RAID 的物理空间。进入\
  \ RAID 配置器，我们将从两个驱动器上的 10GB RAID 分区创建一个 RAID 1 阵列，但不再像以前那样在 RAID 阵列上放置普通文件系统，而是将\
  \ RAID 阵列指定用于 `LVM` 的物理空间。当我们进入 `LVM` 配置时，RAID 阵列将与其他物理卷一样出现，但我们知道该物理卷是冗余的。如果底部的物理驱动器故障，`LVM`\
  \ 永远不会，也不会发生数据丢失。当然，标准的 RAID 阵列警告适用。\n\n## 以太网绑定 (Bonding)\n\n当你开发容错系统时，你会很快意识到除了磁盘故障，网络问题可能是第二个需要冗余的区域。毕竟，交换机需要维护，网卡甚至以太网线也会故障。如果你希望能够生存交换机故障或维护，你需要一个具有多个以太网端口的系统。现在的服务器至少有两个以太网端口，因此设置以太网绑定是有意义的。\n\
  \n以太网绑定是以模块形式构建在 Linux 内核中的功能。通过以太网绑定，可以使用相同的 IP 地址。根据你选择的绑定模式，你可以拥有活动/被动场景（仅当另一个端口离线时激活），也可以拥有活动/活动场景（跨所有端口接受流量）。\n\
  \n所有以太网绑定模式的完整文档可以在任何 Linux 内核源码中的 `Documentation/networking/bonding.txt` 文件中找到。以下是该文档的片段，描述了每种绑定模式：\n\
  \n```\n（此处由于原文未提供具体模式描述，仅保留格式占位）\n```\n\n\n\n\n自适应传输负载均衡：不需要任何特殊交换机支持通道绑定（channel\
  \ bonding）。出站流量根据每个从设备上的当前负载（相对于速度计算）进行分配。入站流量由当前的从设备接收。如果接收的从设备发生故障，另一个从设备将接管该故障接收设备的\
  \ MAC 地址。\n\n`balance-alb` 或 `6`\n\n自适应负载均衡：包括 `text-balance-tlb` 以及针对 IPv4 流量的接收负载均衡（`rlb`），不需要任何特殊交换机支持。接收负载均衡通过\
  \ ARP 协商实现。绑定驱动程序会在本地系统发送 `ARP Replies` 的出站途中对其进行拦截，并将源硬件地址覆盖为绑定组中一个从设备的唯一硬件地址，从而使不同的对端为服务器使用不同的硬件地址。\n\
  \n那么，你应该使用哪种绑定模式？这是一个很难回答的问题，因为不同的网络对某些模式的支持优于其他模式。我的建议是尝试一些不同的绑定模式，并在 ping 服务器时通过拔掉电缆来测试它们的故障转移（fail-over）能力。不同模式处理端口故障的方式，特别是在电缆重新连接（或交换机重启）且端口需要约\
  \ 30 秒才能启动的情况下。在某些绑定模式下，ping 将无中断地继续，而在另一些模式下，你可能会在端口启动期间遇到 30 秒的中断。请注意，由于绑定模式是在绑定模块加载时设置的，如果你更改了绑定模式，可能需要重启（或者至少关掉\
  \ `bond0` 接口并卸载后重新加载模块）。对于此示例，我选择了绑定模式 1，因为每次只有一个端口处于激活状态，因此在任何交换机上都是相对安全的。\n\n\
  配置绑定的步骤在 Ubuntu 10.04 和 12.04 之间发生了变化。在 12.04 中，你可以在 `/etc/network/interfaces` 内完成所有的绑定配置，而在\
  \ 10.04 中，你必须修改几个文件。如果你需要在旧系统上设置绑定，我保留了 10.04 的步骤。如果你使用的是 12.04 或更新版本的系统，请跳至 12.04\
  \ 的配置。\n\n## Ubuntu 10.04 网络配置\n\n配置绑定的第一步是安装 `ifenslave` 包：\n\n```bash\nsudo apt-get\
  \ install ifenslave\n```\n\n该包包含了 `ifenslave` 工具，系统将使用它将两个接口绑定在一起。下一步是打开 `/etc/modprobe.d/aliases`（如果不存在则创建它），滚动到文件底部，并添加\n\
  \n```\nalias bond0 bonding\noptions bonding mode=1 miimon=100\n```\n\n`options`\
  \ 行是你可以用来更改绑定模式的。`miimon` 选项告诉内核每隔多少毫秒检查一次接口的链路状态。在这种情况下，每隔 100 毫秒检查一次。\n\n下一步是打开你的\
  \ `/etc/network/interfaces` 文件，并注释掉你将绑定的网络接口的所有配置行（你可能只有针对 `eth0` 的配置）。此外，如果你有任何\
  \ `auto eth0` 的引用，也把它们注释掉。然后为 `bond0` 接口创建一个新配置，模拟你之前为 `eth0` 设置的参数。在 `bond0` 配置的最后，你添加一条额外的名为\
  \ `slaves` 的行，列出你想要绑定的不同接口。以下是我服务器的接口文件示例：\n\n```text\n# 此文件描述了系统中可用的网络接口\n# 以及如何激活它们。更多信息请参阅\
  \ interfaces(5)。\n\n# 回环网络接口\nauto lo\niface lo inet loopback\n\n# 主网络接口\n#auto\
  \ eth0\n#iface eth0 inet static\n#    address 192.168.0.5\n#    netmask 255.255.255.0\n\
  #    gateway 192.168.0.1\nauto bond0\niface bond0 inet static\n      address 192.168.0.5\n\
  \      netmask 255.255.255.0\n      gateway 192.168.0.1\n      slaves eth0 eth1\n\
  ```\n\n## Ubuntu 12.04 及更新版本的网络配置\n\n配置绑定的第一步是安装 `ifenslave-2.6` 包：\n\n```bash\n\
  sudo apt-get install ifenslave-2.6\n```\n\n该包包含了 `ifenslave` 工具，系统使用它将两个接口绑定在一起。\n\
  \n下一步是打开你的 `/etc/network/interfaces` 文件，并注释掉你将绑定的网络接口的所有配置行（你可能只有针对 `eth0` 的配置）。此外，如果你有任何\
  \ `auto eth0` 的引用，也把它们注释掉。然后为你任何想要绑定的网络接口添加新的配置行，使用 `ifenslave` 参数来引用你想要绑定的接口（这将更合理）。最后，为\
  \ `bond0` 接口创建一个新配置，模拟你之前为 `eth0` 设置的参数。在 `bond0` 配置的最后，你添加几额外的行来配置绑定模块：\n\n```text\n\
  # 此文件描述了系统中可用的网络接口\n# 以及如何激活它们。更多信息请参阅 interfaces(5)。\n# 回环网络接口\nauto lo\niface\
  \ lo inet loopback\n# 主网络接口\n#auto eth0\n#iface eth0 inet static\n#    address 192.168.0.5\n\
  #    netmask 255.255.255.0\n#    gateway 192.168.0.1\nauto bond0\niface bond0 inet\
  \ static\n      address 192.168.0.5\n      netmask 255.255.255.0\n      gateway\
  \ 192.168.0.1\n      slaves eth0 eth1\noptions bonding mode=1 miimon=100\n```\n\n\
  ### 启用绑定接口\n\n无论你是在 10.04 还是 12.04 或更新版本的系统上配置，保存更改并运行 `sudo service restart` 或\
  \ `sudo /etc/init.d/networking restart`。一旦运行 `ifconfig`，你应该能看到新的绑定 设备：\n\n```bash\n\
  sudo ifconfig\nbond0     encap:Ethernet  HWaddr 00:0c:29:28:13:3b\n      inet addr:192.168.0.5\
  \  Bcast:192.168.0.255\n      mask:255.255.255.0\n      inet6 addr: fe80::20c:29ff:fe28:133b/64\
  \ Scope:Link\n      UP BROADCAST RUNNING MASTER MULTICAST  MTU:1500  Metric:1\n\
  \      packets 38 errors 0 dropped 0 overruns 0\n      packets 43 errors 0 dropped\
  \ 0 overruns 0\n      collisions 0 txqueen:0\n      RX bytes 16644 (16.2 KB)  TX\
  \ bytes 3282 (3.2 KB)\neth0      encap:Ethernet  HWaddr 00:0c:29:28:13:3b\n    \
  \  UP BROADCAST RUNNING SLAVE MULTICAST  MTU:1500  Metric:1\n      packets 37 errors\
  \ 0 dropped 0 overruns 0\n      packets 43 errors 0 dropped 0 overruns 0\n     \
  \ collisions 0 txqueen:1000\n      RX bytes 16584 (16.1 KB)  TX bytes 3282 (3.2\
  \ KB)\n      Interrupt:17 Base address:0x1400\neth1      encap:Ethernet  HWaddr\
  \ 00:0c:29:28:13:3b\n      UP BROADCAST RUNNING SLAVE MULTICAST  MTU:1500  Metric:1\n\
  \      packets 1 errors 0 dropped 0 overruns 0\n      packets 0 errors 0 dropped\
  \ 0 overruns 0\n      collisions 0 txqueen:1000\n      RX bytes 60 (60.0 B)  TX\
  \ bytes 0 (0.0 B)\n      Interrupt:18 Base address:0x1480\nlo       encap:Local\
  \ Loopback\n      inet addr:127.0.0.1  Mask:255.0.0.0\n      inet6 addr: ::1/128\
  \ Scope:Host\n      UP LOOPBACK RUNNING  MTU:16436  Metric:1\n      packets 0 errors\
  \ 0 dropped 0 overruns 0\n      packets 0 errors 0 dropped 0 overruns 0\n      collisions\
  \ 0 txqueen:0\n```\n\n\n\n现在，你可以通过在 ping IP 的同时拔掉 `eth0` 来测试故障转移。每当特定接口宕机时，内核会将日志记录到\
  \ `dmesg` 和 `/var/log/syslog`。以下是一个类似于你拔掉 `eth0` 后可能会看到的日志条目：\n\n点击此处查看代码图像\n\n\
  ```\nFeb 14 16:43:28 kickseed kernel: [ 2901.700054] eth0: link down\n\nFeb 14 16:43:29\
  \ kickseed kernel: [ 2901.731190] bonding: bond0:\n  link status definitely down\
  \ for interface eth0, disabling it\n\nFeb 14 16:43:29 kickseed kernel: [ 2901.731300]\
  \ bonding: bond0:\n  making interface eth1 the new active one.\n```\n\n## 集群 (Clusters)\n\
  \n即使在主机上启用了 RAID 和以太网绑定（bonding），仍有许多组件可能故障，从 CPU 到主机上的软件不一。如果你需要服务在主机故障时保持运行，那么你就需要一个集群。设置\
  \ Linux 集群有许多不同的方法，集群也有许多不同的类型。在本节中，我将讨论基础 Linux 集群中最常用的工具之一 `Heartbeat`，以及如何使用它在两台服务器之间创建一个基础的容错服务。之后，我将讨论如何使用一个名为\
  \ `DRBD` 的工具通过网络在两台服务器之间复制数据。这两个工具提供了一个坚实的基础，你可以将其用于任何数量的容错服务。\n\n在你进行集群工作时，你会发现大多数集群技术都使用一些相同的概念进行集群管理。以下是人们在开发集群时使用的一些基本规则和术语：\n\
  \n![Image](img/box.jpg) **浮动 IP (Floating IPs)**\n\n在标准的主备（active/passive）Heartbeat\
  \ 集群中，每个节点（服务器）都有自己的主 IP，还有一个节点间共享的浮动 IP。只有被认为是活动（active）的节点才会使用并响应浮动 IP 地址。服务托管在浮动\
  \ IP 上，这样当特定主机宕机且故障转移节点接管浮动 IP 时，它就可以接管该服务。\n\n![Image](img/box.jpg) **主/主与主/备 (Active/active\
  \ versus active/passive)**\n\n在主/主集群中，所有节点始终运行并接受负载。在主/备集群中，一个节点被视为主节点（master）并接受所有负载，而任何其他节点仅在主节点宕机时才承担负载。我的示例是基于主/备集群的。\n\
  \n![Image](img/box.jpg) **脑裂现象 (Split-brain syndrome)**\n\n脑裂现象发生在主/备集群中，当两个节点都认为自己是主节点并尝试接管负载时。这对集群来说可能是灾难性的，特别是在涉及共享存储和浮动\
  \ IP 的情况下，因为两个节点都会尝试向存储写入数据（该存储可能不允许来自多个源的写入），并尝试为自己抢夺浮动 IP。正如你将看到的，集群面临的巨大挑战之一是识别主机何时真正宕机并避免脑裂现象。\n\
  \n![Image](img/box.jpg) **法定人数 (Quorum)**\n\n集群通常使用法定人数（quorum）的概念来确定主机何时宕机。法定人数背后的思想是让集群成员之间就谁可以与谁通信达成共识。这通常在至少有三个主机时才有效；在双节点集群中，如果节点\
  \ A 无法与节点 B 通信，节点 A 很难判断是自己的网络断了还是节点 B 的网络断了。有了第三个节点，你可以设置两个人的法定人数，这样在至少两个节点无法到达另一个节点之前，该节点才被认为宕机。\n\
  \n![Image](img/box.jpg) **隔离 (Fencing)**\n\n隔离（Fencing）是避免脑裂现象的方法之一。该名称源于在宕机节点周围建立一圈围栏的想法，以便在它的问题解决之前，它无法再次成为活动节点。隔离机器有许多方法，从关闭其网络端口到重启它或触发内核恐慌（又称“开掉另一个节点的头”）。\n\
  \n![Image](img/box.jpg) **开掉另一个节点的““头” (Shooting the other node in the head)**\n\
  \n这个术语用于描述对隔离服务器的一种为直接的响应。当集群确定某个主机不可用时，它通常会通过重启、内核恐慌甚至远程循环电源来强制杀死服务器。其核心思想是一旦系统重启，它应该回到某种一致状态并能够安全地重新加入集群。\n\
  \n![Image](img/box.jpg) **节点监控的独立连接 (Separate connection for node monitoring)**\n\
  \n集群的一种常见做法是让节点使用一个独立的连接来相互监控。这里的想法是防止正常流量减慢或干扰节点之间的通信。一些管理员通过监控每个节点的串口或在第二组以太网端口之间连接交叉网线来解决这个问题。\n\
  \n### Heartbeat\n\nHeartbeat 是 Linux 集群的核心工具之一。Heartbeat 背后的思想是提供一个描述集群的系统，然后监控每个节点以查看是否可用。当节点不可用时，Heartbeat\
  \ 可以采取某些响应。响应可能包括将浮动 IP 移动到故障主机、启动或停止特定服务、挂载或卸载文件系统以及隔离不可用的主机。\n\n目前 Heartbeat 配置有两种主要方法。经典的\
  \ Heartbeat 配置基于几个相对易于配置的基础文本文件。较新的 Heartbeat 2 配置依赖 XML 文件，并可以支持超过两个节点的集群。这些新功能和文件格式可能会引入复杂性，特别是当你刚开始接触集群时，因此为了本章的目的，由于我的示例是一个双节点集群，我将坚持使用传统的\
  \ Heartbeat。传统的 Heartbeat 配置依赖于三个配置文件：`ha.cf`、`haresources` 和 `authkeys`。\n\n![Image](img/box.jpg)\
  \ **ha.cf**\n此文件定义了特定集群的所有设置，包括集群中的节点、Heartbeat 与每个节点通信的方法，以及用于任何故障转移的超时时间。\n\n\
  ![Image](img/box.jpg) **haresources**\n在这里你将配置节点因故障转移而采取的。。可能包括接管浮动 IP、挂载或卸载文件系统、启动或停止服务。\n\
  \n![Image](img/box.jpg) **authkeys**\n此文件包含所有节点共有的密钥。该密钥被用作验证方法，以便节点知道它们正在与有效的集群成员通信。\n\
  \n### 示例集群 (Example Cluster)\n\n在我的示例中，我设置了一个双节点主备 Apache 集群。我假设 Apache 托管静态文件（即此时不需要复制存储）。以下是集群中两台不同服务器\
  \ node1 和 node2 的信息：\n\n点击此处查看代码图像\n\n```\nnode1\neth0: 172.16.245.220/255.255.255\n\
  eth1: 192.168.10.1/255.255.250\n\nnode2\neth0: 172.16.245.221/255.255.250\neth1:\
  \ 192.168.10.2/255.255.250\n```\n\n我使用 eth0 托管服务。我使用 eth1 作为主机之间的私有网络。你可以通过在两个服务器的端口之间连接交叉线或通过独立的交换机来实现。此外，我将设置一个\
  \ 172.16.245.222 的浮动 IP，任何想要访问此网站的主机都将使用它。\n\n#### 安装和配置 Heartbeat\n\nHeartbeat\
  \ 软件封装并作为 `heartbeat` 包在 Ubuntu Server 上，因此你可以使用你喜好的包管理器安装它：\n\n```bash\n$ sudo\
  \ apt-get install heartbeat\n```\n\n\n\n该包会自动创建 `/etc/ha.d` 目录以及服务所需的初始化脚本，但它不会设置主要的三个配置文件之一，即\
  \ `ha.cf`、`haresources` 或 `authkeys`，因此我将在在这里介绍如何配置这些文件。\n\n## ha.cf\n\nHeartbeat\
  \ 软件包在 `/usr/share/doc/heartbeat` 下提供了一个带注释的 `ha.cf` 示例文件，如果你需要示例或更多信息，务必将其作为参考。以下是我在集群中使用的\
  \ `/etc/ha.d/ha.cf` 文件：\n\n点击此处查看代码图片\n\n```\nautojoin none\nbcast eth1\nwarntime\
  \ 5\ndeadtime 10\ninitdead 30\nkeepalive 2\nlogfacility local0\nnode node1.example.org\n\
  node node2.example.org\nrespawn hacluster /usr/lib/heartbeat/ipfail\nping 172.16.245.5\
  \ 172.16.245.1\nauto_failback off\n```\n\n此文件的副本将存放在 `node1` 和 `node2` 上。这些选项中的每一个都很重要，因此我在这里进行描述：\n\
  \n### autojoin\n你可以选择使用 `authkey` 文件中的共享密钥作为验证，让节点自动加入集群。对于经常添加或删除节点的大型集群，这可能是一个非常有用的选项，这样你就不需要不断发布和更新\
  \ `ha.cf` 文件来列出新节点。在我的情况下，由于只有两个节点，我禁用了此选项。\n\n### bcast\n节点之间有多种不同的方式可以进行 Heartbeat\
  \ 及其他通信。这些选项中的每一个项在 `/usr/share/doc/heartbeat/ha.cf.gz` 中都有记录，但这里给出一个摘要。如果你使用 `serial`\
  \ 选项，可以通过连接到每个节点串口的交叉调制调调缆来检查 Heartbeat。如果你使用 `mcast`，可以定义一个要使用的组播接口和 IP 地址。在我的情况下，我使用了\
  \ `bcast`，它通过我的 `eth1` 接口（我设置的私有网络）进行广播。你也可以指定 `ucast`，它允许你直接通过单播 IP 进行通信。如果你想限制广播流量，或者你只有一个接口（或一对绑定端口）并想使用标准\
  \ IP 地址进行通信，那么这可能很有用。Heartbeat 默认使用 UDP 端口 `694` 进行通信，因此如果你启用了防火墙，请务必添加规则以允许该访问。\n\
  \n### warntime\n这是以秒为单位的时间，在此期间通信可以超时，而 Heartbeat 会日志中添加一条节点心跳延迟的备注。此时不会采取任何操作。\n\
  \n### deadtime\n这是以秒为单位的时间，在此期间通信可以超时，之后 Heartbeat 就会认为节点已死亡并启动故障转移过程。\n\n### initdead\n\
  在某些机器上，Heartbeat 启动后，主机上的其他服务加载可能需要一些时间。此选项允许你配置一个特殊的超时设置，在系统启动时、在节点被认为死亡之前生效。\n\
  \n### keepalive\n这是每次心跳之间的秒数。\n\n### logfacility\n在这里，我可以配置使用哪种 syslog 日志设施。`local0`\
  \ 值是一个安全选择，它会让 Heartbeat 将日志记录在 `/var/log/syslog` 中。\n\n### node\n`node` 行用于手动定义集群中的每个节点。语法为\
  \ `node` `nodename`，其中 nodename 是你在该主机上运行 `uname -n` 时特定节点的主机名。为集群中的每个主机添加 `node`\
  \ 行。\n\n### respawn\n由于我为 Heartbeat 通信和常规服务设置了独立的接口，我想启用 `ipfail` 脚本。该脚本会对每个主机执行各种网络检查，以便判断主机是否已从网络中隔离但仍能与其他节点进行通信。此\
  \ `respawn` 行告诉 Heartbeat 以 `hacl` 用户身份启动 `ipfail` 脚本，如果它退出，则重新启动它。\n\n### ping\n\
  此选项与 `ipfail` 脚本配合使用。在这里，我可以定义节点用于衡量其网络连通性的额外主机。你需要选择不是集群节点的稳定主机，因此将网络网关或其他网络基础设施主机添加到此处是合适的。\n\
  \n### auto_failback\n这是一个可选设置。Heartbeat 定义了它认为的主节点。该节点是运行运行的默认节点。默认情况下，当主节点掉线并恢复时，集群将故障回到该主机。仅仅为了避免\
  \ IP 和服务的反复抖动，你可以选择禁用自动故障回。\n\n一旦 `ha.cf` 文件保存并部署到 `node1` 和 `node2`，我就可以处理 `haresources`\
  \ 了。\n\n## haresources\n\n`/etc/ha.d/haresources` 文件定义了集群管理的资源，以便它在需要故障转移时确定该做什么。在此文件中，你可以定义要使用的浮\
  \ IP 并列出要启动或停止的服务。\n\n```\nnode1 172.16.245.222 apache2\n```\n\n前面的示例使用了一些简写。例如，如果我想子网掩码为\
  \ `/26`，我可以说：\n\n```\nnode1 172.16.245.222/26 apache2\n```\n\n末尾的 `apache2` 部分也是简写。默认情况下，Heartbeat\
  \ 在节点激活时使用 `start` 参数运行服务，在节点禁用时使用 `stop` 参数运行。如果你在 `/etc/ha.d/resource.d/` 或 `/etc/init.d/`\
  \ 创建了一个特殊脚本并想传递特殊参数，只需列出服务名、两个冒号，然后是参数。例如，如果我创建了一个名为 `pageme` 的特殊脚本来向手机号码发送短信，我的\
  \ `haresources` 行可能如下：\n\n点击此处查看代码图片\n\n```\nnode1 172.16.245.222 apache2 pageme::650-555-1212\n\
  ```\n\n一旦创建了 `haresources` 文件，将其复制到两个节点的 `/etc/ha.d/`，并确保保持一致。\n\n## authkeys\n\n\
  过程的最后一步是创建 `/etc/ha.d/authkeys` 文件。该文件包含了 Heartbeat 用于验证节点与集群其余部分身份的方法。配置文件文件包含一个以\
  \ `auth` 开头的行，然后是一个定义使用下方哪一行的数字。下一行以数字开头，然后是验证方法的类型。如果你使用类似交叉线线的安全私有网络，你的 `authkeys`\
  \ 可能看起来如下：\n\n```\nauth 1\n1 crc\n```\n\n此选项不需要大量的 CPU 资源，因为通信没有使用特定的密钥进行签名。如果你要在开放网络上通信，你可能希望使用\
  \ MD5 或 SHA1 密钥。在任何情况下，语法都是相似的：\n\n```\nauth 2\n1 crc\n2 sha1 thisisasecretsha1key\n\
  3 md5 thisisasecretmd5key\n```\n\n\n\n在这里你可以看到我定义了所有三个可能的选项。在 `sha1` 或 `md5` 之后传递的密钥基本上是你随手想出来的任何密钥。请注意，在这个示例中，我在第一行设置了\
  \ `auth 2`，因此它将选择使用 SHA1 进行身份验证。如果我想在这个示例中使用 MD5，我将把 `auth` 设置为 `3`，因为 MD5 配置位于以\
  \ `3` 开头的行上。一旦你创建了此文件并将其部署到所有节点上，请务必将其权限设为仅允许 `root` 用户读取，因为任何能够读取此文件的人都可能伪装成集群成员：\n\
  \n```\n$ sudo chmod 600 /etc/ha.d/authkeys\n```\n\n一旦这些文件就绪，你就可以准备启动集群了。从你在 `haresources`\
  \ 中选择的默认节点开始（在我的案例中为 `node1`），并输入：\n\n```bash\n$ sudo /etc/init.d/heartbeat start\n\
  ```\n\n一旦它启动，移动到集群中的另一个节点并运行相同的命令。你应该能够在 `/var/log/syslog` 文件中看到 Heartbeat 开始 ping\
  \ 节点并确认集群的健康状况。此时你已经准备好测试故障转移了。在第三台主机上打开 Web 浏览器，尝试访问浮 IP（在我的案例中为 `172.16.245.222`）上的\
  \ Web 服务器并确保它运行正常。然后断开活动主机上的主网络接口。根据你在 `/etc/ha.d/ha.cf` 中配置的超时时间，需要几秒钟，但你的故障转移主机应该开始在日志中报告故障，接管浮\
  \ IP 并启动它所需的任何服务。以下是从 `node1` 转移到 `node2` 期间 syslog 文件的示例输出：\n\n点击此处查看代码图片\n\n```\n\
  Feb 16 17:37:56 node2 ipfail: [4340]: debug: Got asked for num_ping.\nFeb 16 17:37:57\
  \ node2 ipfail: [4340]: debug: Found ping node\n  172.16.245.1!\nFeb 16 17:37:57\
  \ node2 ipfail: [4340]: debug: Found ping node\n  172.16.245.5!\nFeb 16 17:37:58\
  \ node2 ipfail: [4340]: info: Telling other node that we\n  have more visible ping\
  \ nodes.\nFeb 16 17:37:58 node2 ipfail: [4340]: debug: Sending you_are_dead.\nFeb\
  \ 16 17:37:58 node2 ipfail: [4340]: debug: Message [you_are_dead]\n  sent.\nFeb\
  \ 16 17:37:58 node2 ipfail: [4340]: debug: Got asked for num_ping.\nFeb 16 17:37:58\
  \ node2 ipfail: [4340]: debug: Found ping node\n  172.16.245.1!\nFeb 16 17:37:59\
  \ node2 ipfail: [4340]: debug: Found ping node\n  172.16.245.5!\nFeb 16 17:37:59\
  \ node2 ipfail: [4340]: info: Telling other node that we\n  have more visible ping\
  \ nodes.\nFeb 16 17:37:59 node2 ipfail: [4340]: debug: Sending you_are_dead.\nFeb\
  \ 16 17:37:59 node2 ipfail: [4340]: debug: Message [you_are_dead]\n  sent.\nFeb\
  \ 16 17:38:05 node2 heartbeat: [4255]: info: node1 wants to go\n  standby [all]\n\
  Feb 16 17:38:06 node2 ipfail: [4340]: debug: Other side is unstable.\nFeb 16 17:38:06\
  \ node2 heartbeat: [4255]: info: standby: acquire [all]\n  resources from node1\n\
  Feb 16 17:38:06 node2 heartbeat: [4443]: info: acquire all HA\n  resources (standby).\n\
  Feb 16 17:38:06 node2 ResourceManager[4457]: info: Acquiring resource\n  group:\
  \ node1 172.16.245.222 apache2\nFeb 16 17:38:06 node2 IPaddr[4483]: INFO:  Resource\
  \ is stopped\nFeb 16 17:38:06 node2 ResourceManager[4457]: info: Running\n  /etc/ha.d/resource.d/IPaddr\
  \ 172.16.245.222 start\nFeb 16 17:38:06 node2 ResourceManager[4457]: debug: Starting\n\
  \  /etc/ha.d/resource.d/IPaddr 172.16.245.222 start\n```\n\n\n\n\n`global` 部分允许你定义某些适用于任何单个资源之外的选项。`usage-count`\
  \ 选项定义了你的集群是否参与 DRBD 的使用量计数。如果你想参与，请将其设置为 `Yes`。如果你希望你的 DRBD 使用用情况更具私密性，请将其设置为 `No`。\n\
  \n`common` 部分允许你定义适用于每个资源定义的选项。例如，`protocol` 选项允许你定义要使用哪种传输协议。不同的传输协议在软件包随附的示例 `drbd.conf`\
  \ 中定义。对于 `protocol`，除非你有特定的理由不使用，否则请选择 `C`。由于我的资源部分中有很多在每个节点上都相同的选项（如 `device`、`disk`\
  \ 和 `meta-disk`），我实际上可以将所有这些选项都放在 `common` 部分。你只需要意识到，你放置在 `common` 部分的任何内容都将适用于你定义的所有资源。\n\
  \n你设置的每个复制文件系统被称为一个资源（resource），并有它自己的资源定义。资源定义是你定义哪些节点将位于你的集群中、创建哪个 DRBD 磁盘、在每个主机上使用哪个实际分区，以及用于复制的网络\
  \ IP 和端口的地方。这里是我为名为 `r0` 的资源配置的 `resource` 部分：\n\n点击此处查看代码图片\n\n```\nresource r0\
  \ {\n    on node1 {\n      device    /dev/drbd1;\n      disk      /dev/sdb1;\n \
  \     address  192.168.10.1:7789;\n      meta-disk internal;\n    }\n    on node2\
  \ {\n      device    /dev/drbd1;\n      disk      /dev/sdb1;\n      address  192.168.10.2:7789;\n\
  \      meta-disk internal;\n    }\n    net {\n      after-sb-0pri    discard-younger-primary;\n\
  \      after-sb-1pri    consensus;\n      after-sb-2pri    disconnect;\n    }\n\
  }\n```\n\n如你所示，我在这里定义了两个节点：`node1` 和 `node2`，在节点定义内部是针对该主机的特定选项。我决定使用 `/dev/drbd1`\
  \ 作为每个主机实际挂载和访问的 DRBD 虚拟设备，并使用 `/dev/sdb1` 作为 DRBD 在每个主机上使用的物理分区。DRBD 为每个资源标准的端口为\
  \ `7788`，因此我在这里选择了端口 `7789`。如果你在主机上启用了防火墙，你将需要确保此端口未被阻塞。另外请注意，我指定了我之前为 Heartbeat\
  \ 使用的私有网络 IP 地址，而不是公网 IP 地址。由于我知道这个网络非常稳定（通过交叉网线连接），我想使用它来复制数据。否则，你确实需要确保你用于 DRBD\
  \ 的任何网络都是容错的。\n\n每个节点的最后一个选项是设置为 `internal` 的 `meta-disk`。DRBD 需要一些空间来存储其元数据。设置此项的理想、最简单的方法是使用内部元数据磁盘（internal\
  \ metadisk）。使用内部元数据磁盘时，DRBD 将保留分区的最后一部分（在本例中为 `/dev/sdb1`）作为元数据。如果你在使用新的空分区设置 DRBD，我建议你使用内部元数据磁盘，因为它更容易维护，并且你可以保证在磁盘故障时，元数据磁盘和其余数据是一致的。如果你想复制一个已经在使用的分区，你将必须在单独的分区上使用外部元数据磁盘，并在\
  \ `drbd.conf` 中定义它，否则你可能会面临 DRBD 覆盖分区末尾某些数据的风险。如果你确实需要外部元数据磁盘，请访问 [www.drbd.org/docs/about/](http://www.drbd.org/docs/about/)\
  \ 并查看他们的公式以及如何正确设置外部元数据磁盘的示例。\n\n我的 `r0` 资源的最后部分是：\n\n点击此处查看代码图片\n\n```\n    net\
  \ {\n      after-sb-0pri    discard-younger-primary;\n      after-sb-1pri    consensus;\n\
  \      after-sb-2pri    disconnect;\n    }\n```\n\n这些实际上是 DRBD 的默认设置，因此我不需要在这里显式地列出它们。我这样做仅仅是为了向你展示如何更改\
  \ DRBD 的默认脑裂（split-brain）策略。记住，当发生脑裂时，两个节点都无法与对方通信，且不一定能确定哪个节点应该是活动状态。在 DRBD 中，默认情况下只有一个节点被列为主节点（primary），另一个是从节点（secondary）。在这一部分中，你可以定义不同脑裂场景后的行为。`after-sb-0pri`\
  \ 部分定义了当脑裂发生后两个节点都被列为从节点时该做什么。默认是使用脑裂发生前作为主节点的数据。下一个选项设置了如果脑裂发生后其中一个节点是主节点时该做什么。默认是\
  \ `consensus`。使用 `consensus`，如果 `after-sb-0pri` 设置也会销毁从节点的数据，则该数据将被丢弃。否则，节点将彼此断开连接，以便你决定哪个节点将覆盖另一个。最后的\
  \ `after-sb-2pri` 定义了当脑裂发生后两个节点都认为自己是主节点时该做什么。这里 DRBD 将节点彼此断开连接，你可以决定哪个节点将覆盖另一个。\n\
  \n我的 `r0` 资源的最后部分是以下：\n\n当脑裂发生时，没有任何节点可以与另一个节点通信。\n\n的，因此我不需要在这里显式列出它们。我这样做仅仅是为了向你展示如何更改\
  \ DRBD 的默认脑裂策略。记住，当脑裂发生时，两个节点都无法与另一个节点通信，且不一定能确定哪个节点应该是活动状态。在 DRBD 中，默认情况下只有一个节点被列为主节点，另一个是从节点。在这一部分中，你可以定义不同脑裂场景后的行为。`after-sb-0pri`\
  \ 部分定义了当脑裂发生后两个节点都被列为从节点时该做什么。默认是使用脑裂发生前作为主节点的数据。下一个选项设置了如果脑裂发生后其中一个节点是主节点时该做什么。默认是\
  \ `consensus`。使用 `consensus`，如果 `after-sb-0pri` 设置也会销毁从节点的数据，则该数据将被丢弃。否则，节点将彼此断开连接，以便你决定哪个节点将覆盖另一个。最后的\
  \ `after-sb-2pri` 定义了当脑裂发生后两个节点都认为自己是主节点时该做什么。这里 DRBD 将节点彼此断开连接，你可以决定哪个节点将覆盖另一个。\n\
