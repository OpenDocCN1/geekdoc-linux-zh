  \n点击此处查看代码图片\n\n```\ndefault install\n\nlabel install\nmenu label ^Install\nmenu\
  \ default\nkernel ubuntu-installer/i386/linux\nappend vga=normal initrd=ubuntu-installer/i386/initrd.gz\n\
  ks=http://10.1.1.5/ks.cfg -- quiet\n\nlabel web\nmenu label ^Install\nmenu default\n\
  kernel ubuntu-installer/i386/linux\nappend vga=normal initrd=ubuntu-installer/i386/initrd.gz\n\
  ks=http://10.1.1.5/ks-web.cfg -- quiet\n\nlabel mysql\nmenu label ^Install\nmenu\
  \ default\nkernel ubuntu-installer/i386/linux\nappend vga=normal initrd=ubuntu-installer/i386/initrd.gz\n\
  ks=http://10.1.1.5/ks-mysql.cfg -- quiet\n```\n\n如你所见，我在每个部分中做的唯一真实更改是指向我创建的另一个\
  \ Kickstart 文件。现在一旦我启动，我就可以输入 `web` 或 `mysql` 然后按回车来选择这些特定的选项。\n\n### 启动作弊码 (Boot\
  \ Cheat Codes)\n\n另一种区分不同安装类型的实用方法是使用作弊码（cheat codes，我借用了 Knoppix 的术）。作弊码是你在命令行输入的一个选项，它会被传递给系统。启动提示符的有趣之处在于，启动提示符上的所有内容在安装期间都可以通过\
  \ `/proc/cmdline` 文件进行访问。如果你想创建自定义的作弊码，你只需要提供一个安装前或安装后的脚本，解析 `/proc/cmdline` 并将这些设置存储在环境变量中。然后你就可以在脚本中引用这些环境变量，并根据它们对安装前或安装后的过程进行自定义更改。\n\
  \n例如，假设我们想在启动提示符处定义两个作弊码：`mytype`，用于标记服务器的类型（Web、MySQL、DNS），以及 `myraid`，告诉系统是否应该使用\
  \ RAID。与其设置三个不同的 Kickstart 文件，我可以使用单个 Kickstart 文件，然后在其安装前脚本中编写逻辑来解析这些选项并根据它们更改设置。这里有一个示例的安装前脚本，它可以解析\
  \ `/proc/cmdline` 文件，设置环境变量，然后根据它们执行特殊操作：\n\n点击此处查看代码图片\n\n```bash\n%pre\nfor i\
  \ in `cat /proc/cmdline` ; do\n        echo $i | grep -iq MYTYPE=\n        if [\
  \ $? -eq 0 ] ; then\n            export MYTYPE=`echo $i | awk -F\"=\" '{ print $2;\
  \ }'`\n        fi\n        echo $i | grep -iq MYRAID=\n        if [ $? -eq 0 ] ;\
  \ then\n            export MYRAID=`echo $i | awk -F\"=\" '{ print $2; }'`\n    \
  \    fi\ndone\n\nif [ $MYTYPE == \"web\" ]; then\n# 修改 Web 服务器的 preseed 设置\nelif\
  \ [ $MYTYPE == \"mysql\" ]; then\n# 修改 MySQL 服务器的 preseed 设置\nelif [ $MYTYPE ==\
  \ \"dns\" ]; then\n# 修改 DNS 服务器的 preseed 设置\nfi\n\nif [ $MYRAID ]; then\n# 修改 RAID\
  \ 的 preseed 设置\nfi\n```\n\n现在，在启动提示符处，如果我想设置一个带有 RAID 的 MySQL 服务器，我可以输入 `install\
  \ mytype=mysql myraid=1`。再次，这种方法的优势在于它允许你维护单个 Kickstart 文件，该文件内部包含用于更改不同服务器类型设置的逻辑。这种方法的缺点是，生成的\
  \ Kickstart 文件可能会变得庞大且复杂。\n\n### DHCP 选择\n\n如果你的组织对服务器使用静态 DHCP 分配，这种方法会特别得有效。在静态\
  \ DHCP 中，DHCP 服务器会根据主机的 MAC 地址，每次为请求 IP 地址的每个主机分配相同的 IP 地址。通常，在这种设置下，你的服务器每当从网络启动时，会自动安装新镜像。你会发现这种方法在大规模集群或服务器在获取操作系统之前已物理安装的环境中流行。一旦你将\
  \ `pxelinux` 配置更改为自动安装默认镜像，你的配置文件就会控制每台服务器将变成什么。管理员在服务器上安装 Ubuntu 需要的只是将其连接到网络并开启。\n\
  \n在这种情况下，你在 `/var/lib/tftp` 下创建多个目录，每个目录都包含 `netboot.gz` 的副本。例如，如果我想为 Web、MySQL\
  \ 和 DNS 设置三个独立的配置，我可以这样做：\n\n```bash\n$ cd /var/lib/tftp\n$ sudo wget http://archive.ubuntu.com/ubuntu/dists/precise/main/installer-i386/current/images/netboot.gz\n\
  $ sudo mkdir web mysql dns\n$ cd web\n$ sudo tar -xzvf netboot.gz\n$ cd ../mysql\n\
  $ sudo tar -xzvf netboot.gz\n$ cd ../dns\n$ sudo tar -xzvf netboot.gz\n```\n\n现在，我会更改\
  \ `pxelinux` 配置以自动安装默认镜像，你的配置文件就会控制每台服务器将变成什么。管理员在服务器上安装 Ubuntu 需要的只是将其连接到网络并开启。\n\
  \n（注：由于原文中存在大量重复段落，此处译文已根据指令进行去重处理，确保逻辑连贯且不重复输出。）\n\n\n\n\n\n```\n    option routers\
