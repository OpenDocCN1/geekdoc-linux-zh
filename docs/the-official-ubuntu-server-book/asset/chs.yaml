  \n这本书不仅是主作者们，更是整个 Ubuntu Server 团队共同努力的成果。作为 Ubuntu Server 的官方授权书籍，其重点在于提供一份基于我们集体经验的服务器指南。除此之外，我们的目标是为初级系统管理员和经验老丰富的高级系统管理员都提供有价值的内容。从表面上看，要实现这种平衡似乎很难，但实际上，这两组人最终想要的都是同一件事：让他们的服务器正常运行。诚然，有些管理员乐于用复杂的方法解决问题，有些人甚至将其视为一种自豪。事实是，我们这些多年管理服务器的人也完全能够且做过这些复杂的操作，但最终你会意识到，手动完成一切并没有什么特别了不起的——到头来，你要的事情太多了，任何节省时间的步骤都是受欢迎的。\n\
  \n\n\n\n\n\n## 第 12 章：救援与恢复\n\n## 附录：酷技巧与技巧\n## 致谢\nDebra 和 Mako，与你们两位一起完成这个项目非常愉快，感谢你们提供的机会和指导。还要感谢\
  \ Matthew 在支持章节提供的帮助。Robert，非常感谢你对细节的关注，并找出了我所有写错字的地方。感谢 Bill “The Cloud” Childers\
  \ 为 UEC 章节提供设备。\n**Benjamin Mako Hill** 是麻理工学院（MIT）斯林管理学院和媒体实验室的博士候选，截至 2013 年秋，他是华盛顿大学传播学助理教授。作为\
  \ Ubuntu 创始团队的一部分，他在 Canonical 的职责是在项目第一年帮助扩大 Ubuntu 开发和用户社区。Mako 通过社区委员会治理会成员以及通过本书等项目继续参与\
  \ Ubuntu 工作。\n\n也许仅仅是因为人们对 Ubuntu 在桌面端上的易用性感到如此惊讶——特别是在早期，人们对桌面 GNU/Linux 发行版的期望很低——以至于公众的焦点自然偏离了\
  \ Ubuntu 的服务器产品。许多其他 GNU/Linux 发行版在服务器上运行良好，但出色的桌面体验对许多用户来说仍然令人惊讶。因此，当人们谈论 Ubuntu\
  \ 时，他们往往倾向谈论桌面。也许另一方面，人们只是认为，如此精良的桌面体验一定是以牺牲面向于服务器的功能和支持为代价的。当然，并没有做出这样的牺牲。\n\n\n\
  \n\n\n今天所有被称为 Linux 的系统实际上都是建立在这种协作基础上的。技术上，Linux 一词仅指内核。许多程序员和 GNU 贡献者（包括斯塔尔曼）强烈主张，整个操作系统应该被称为\
  \ GNU/Linux，以便不仅感谢 Linux，也感谢 GNU 项目，并突出 GNU 传播软件自由的目标——这些目标莱纳斯·托瓦尔斯可能并不完全认同。许多人认为这个名字太复杂，更倾向于简单地将系统称为\
  \ Linux。另一些人，例如致力于 Ubuntu 项目的人，则试图通过仅使用自己的项目名称来引用 GNU/Linux，完全避免这种争议。\n关于命名的争议并没有随着对\
  \ GNU 和 Linux 组合讨论而结束。事实上，随着 GNU 和 Linux 贡献者列表的增加，一个充满活力的自由软件新世界脱颖而出，这在某种程度上得益于互联网的普及。随着这个社区的增长和多样化，许多人开始注意到斯坦曼（Stallman）自由软件的一个无意副作用。由于自由软件是以开放的方式构建的，`anyone`都可以通过查看代码、发现漏洞并修复漏洞来贡献软件。由于软件最终经过了更多程序员的审查，自由软件的质量更高、性能更好，功能也比通过专有开发机制开发的类似软件更多。在许多情况下，自由软件背后的开发模型使得软件比专有替代方案`本质上更好`。\n\
  为了解决这两个问题，该小组创造了一个新术语——`open source`（开源），并创建了一个名为“开源倡议组织”（Open Source Initiative）的新组织。该小组的核心设定了一个开源软件的定义，该定义完全且排他地与斯坦曼的自由软件四部分定义重叠，并与其他基于斯坦曼定义的其他社区定义重叠。\n\
  ### Ubuntu 项目简史\n#### 马克·舒特沃（Mark Shuttleworth）\n\n\n\n\n\n\n因此，一个“内部”社区对 Ubuntu\
  \ 发行版的创建方式有着很大影响，这并不意外。虽然 Ubuntu 4.10 版本（Warty Warthog）主要由少数人构建的，但 Ubuntu 的广泛成功是通过一个大得多的群体贡献实现的，其中包括程序员、文档撰写者、志愿者支持人员和用户。虽然\
  \ Canonical 雇用了一个由几十名活跃贡献者组成的核心小组，但该发行版从第一天起就鼓励并吸收了社区中*任何人*的贡献，并对所有贡献进行奖励和认可。付费贡献者并没有占据中心位置，他们*并不是*由\
  \ Ubuntu 项目雇佣的——相反，他们是由 Canonical, Ltd. 雇佣的。这些员工被简单视为另一组社区成员。他们必须申请加入 Ubuntu 社区，并以与其他人完全相同的方式获得对其贡献的认可。关于\
  \ Ubuntu 项目的所有非业务相关通信都在公共场合和社区内进行。志愿者社区成员占据了 Ubuntu 项目两个治理委员会的大多数席位：负责所有技术事务的 `Technical\
  \ Board`（技术委员会），以及批准新 Ubuntu 成员并解决争议的 `Community Council`（社区委员会）。这两个委员会的席位都由相关的社区小组批准，`Technical\
  \ Board` 的开发者和 `Community Council` 的 Ubuntu 成员。\n\n\ntotal 85\ndrwxr-xr-x  2 root\
