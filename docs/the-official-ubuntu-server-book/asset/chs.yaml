  \n# 关于本电子书\n\nePUB 是一种开放的行业标准电子书格式。然而，不同阅读设备和应用程序对 ePUB 及其许多功能的支持程度不相同。请使用您的设备或应用设置来根据您的喜好自定义显示效果。您可以自定义的设置通常包括字体、字号、单栏或双栏、横屏或竖屏模式，以及可以点击或触摸放大的图片。有关您的阅读设备或应用上关于设置和功能的更多信息，请访问设备制造商的网站。\n\
  \n许多书籍包含编程代码或配置示例。为了优化这些元素的显示效果，请在单栏、横屏模式下查看电子书，并将字体大小调整为最小设置。除了以重流文本格式呈现代码和配置外，我们还包含了代码的图像，以模仿印刷书籍中的呈现效果；因此，当重流格式可能会损害代码列表的显示效果时，您将看到“点击此处查看代码图像”的链接。点击该链接查看高保真代码图像。要返回之前的上一页，请点击设备或应用上的“后退”按钮。\n\
  \n\n\n\n\n![Image](img/pub.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 《官方 Ubuntu\
  \ 服务器教程》书评\n\n“墨菲定律在管理 Linux 服务器时比以往任何时候都更贴切。你几乎可以肯定，在你最需要机器的时候，它总会出点事子。这时，一本包含一些基础故障排除说明的书值你付出的每一分钱。第\
  \ 11 章涵盖了出现问题时你应该采取的步骤。”\n—Paul Ferrill, LinuxPlanet.com 评论员\n\n“面向 Linux 程序员和开发者的大学级合集会发现《官方\
  \ Ubuntu 服务器教程》是该合集中的顶级之作，它在一份让你快速上手的指南中涵盖了完整的、免费的服务器操作系统。从充分利用 Ubuntu Server 的最新技术到自动化安装以及使用\
  \ Ubuntu 内置安全工具保护服务器，《官方 Ubuntu 服务器教程》为任何 Ubuntu 用户提供了丰富的成功秘诀。”\n—Jim Cox, Midwest\
  \ Book Review\n\n“这本书将带你进入服务器管理员的道路，无论是在 Ubuntu 服务器的背景下，还是在更广泛的服务器基础设施管理领域。Ubuntu\
  \ 的桌面版和服务器版本正在不断成熟。如果你想跟上潮流，请阅读此书。”\n—James Pyles, 作者\n\n*我将这本书献给我的妻子 Joy。在平衡全职工作和写书的同时空出时间给家庭并不容易。到目前，她经历了许多次写书的过程，并一直是我主要的支持和动力来源。*\n\
