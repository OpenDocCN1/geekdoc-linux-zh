  \ 组可以读取和执行该文件，而其他人只能读取该文件。\n\n\n\n\n/home/kyle/example.net\n\n## 硬链接 (Hard Links)\n\
  \n硬链接与符号链接相似，区别在于符号链接指向另一个文件，而硬链接实际上*就是*该文件。如果你想理解硬链接，了解 `inode` 是很有帮助。你在分区上创建的每个文件都将其数据存储在\
  \ `inode` 中。该 `inode` 与该分区上的任何其他 `inode` 相比都有一个唯一的编号，并且 `inode` 内部包含了如文件权限、文件所有者以及指向文件实际数据的指针等信息。当你在目录中创建一个文件时，该目录实际上只包含文件名及其对应的\
  \ `inode` 编号。当你访问该文件时，你会被重定向到该 `inode` 并读取其数据。在硬链接的情况下，会在分区的某处创建第二个文件，该文件也指向同一个\
  \ `inode`。\n\n由于硬链接与原始文件共享完全相同的 `inode` 信息，从任何意义上来说，它就是那个文件；只是可能位于不同的目录。与符号链接不同，如果你为文件创建一个硬链接，你可以删除原始文件，而硬链接仍然有效。\n\
  \n你什么时候会使用硬链接？当你想要在文件系统的两个位置引用同一个文件（例如一个大型 DVD 镜像或其他文件）时，硬链接非常有用。使用硬链接，两个文件具有相同的权限和正确的文件大小，并且像普通文件一样运行。你会发现某些备份软件会使用硬链接，这样如果两台服务器拥有相同的文件，备份服务器只需要存储一次该文件。那么，为什么要使用一种链接类型而不是另一种呢？首先，你不能对目录使用硬链接。其次，硬链接仅在同一个文件系统上工作，所以如果你有一个根分区和一个独立的\
  \ `/home` 分区，你就无法在它们之间创建硬链接。\n\n要创建硬链接，只需使用 `ln` 命令且不带 `-s` 选项即可。因此，如果我想在桌面上获得 `/home/kyle/isos/`\
  \ 下的 Ubuntu 服务器 ISO 文件的副本，而不占用大量空间，我可以输入：\n\n```\n$ ln /home/kyle/isos/ubuntu-8.04.1-server.i386.iso\
  \ /home/kyle/Desktop/ubuntu-8.04.1-server-i386.iso\n```\n\n这个硬链接看起来与原始文件没有区别：\n\n\
  ```\n$ ls -l /home/kyle/isos/ubuntu-8.04.1-server-i386.iso\n-rw-r--r-- 2 kyle kyle\
  \ 584722432 2008-10-08 20:26 /home/kyle/isos/\n  ubuntu-8.04.1-server-i386.iso\n\
  \n$ ls -l /home/kyle/Desktop/ubuntu-8.04.1-server-i386.iso\n-rw-r--r-- 2 kyle kyle\
  \ 584722432 2008-10-08 20:26 /home/kyle/\n  Desktop/ubuntu-8.04.1-server-i386.iso\n\
  ```\n\n## 设备文件 (Device Files)\n\n随着你对 Linux 的学习，你会听到有人谈论在 Linux 下“一切皆文件”。如果你习惯了其他操作系统，这可能会很奇怪，但在\
  \ Linux 下，一切（包括你电脑上的硬件）都是文件。这些设备文件主要存储在 Linux 系统的 `/dev` 目录下。当你开始处理 Linux 分区时，经常会遇到这些设备文件。例如，你系统上的第一个\
  \ SCSI 驱动器由名为 `/dev/sda` 的文件表示，该驱动器上的所有分区从 1 开始编号，因此驱动器上的第一个分区是 `/dev/sda1`。尽管这是一个特殊的设备文件，你\
  \ Linux 系统上的许多基于文件的工具也可以像处理其他文件一样处理它。例如，在 Linux 下制作磁盘镜像的常用方法是使用名为 `dd` 的工具，它一次一个位地从文件读取数据（从一个设备文件，例如\
  \ `/dev/sda1`），并写入另一个设备文件（例如 `/dev/sdb1`）。\n\n那么，如何区分设备文件和普通文件呢？通常，所有设备文件都位于 `/dev`\
  \ 目录内。此外，如果你对设备文件运行 `ls -l`，你会在文件权限之前看到 `b` 或 `c`。`b` 告诉你这是一个块（无缓冲）设备，而 `c` 意味着它是一个字符（缓冲）设备：\n\
  \n```\n$ ls -l /dev/sda\nbrw-rw---- 1 root disk 8, 0 2009-04-03 06:17 /dev/sda\n\
  \n$ ls -l /dev/zero\ncrw-rw-rw- 1 root root 1, 5 2009-04-03 06:17 /dev/zero\n```\n\
  \n我已经提到过 `/dev/sda` 和 `/dev/zero` 是设备文件。你可以使用 `/dev/zero` 生成无限的空字节流，这对于创建文件或擦除磁盘很有用。\n\
  \n## At 和 Cron\n\n当你更熟悉 Linux 之后，你会发现自己需要调度任务。为此，你将使用 `at` 和 `cron`。\n\n### At\n\
  \n要使用 `at`，首先在终端中输入 `at` 命令，后跟上你想运行命令的时间。`at` 可以接受时间和日期，你甚至可以使用像“tomorrow”这样的单词。一旦按下回车，你将进入一个交互式\
  \ shell：\n\n```\n$ at 9pm\n```\n\n在这个 shell 中，你可以输入想让 at 执行的所有命令，就像在终端中一样。如果你想运行多个命令，只需在每个命令后按回车进入新的\
  \ `at>` 提示符。当你输入完所有想在该时间运行的命令后，在空的 `at>` 提示符处按 Ctrl-D，任务就会入队。\n\n```\n$ at 9pm\n\
  at> /usr/local/bin/my_backup_script\nat> <EOT>\njob 1 at Sat Apr 17 21:00:00 2010\n\
  ```\n\n命令入队后，你可以使用 `atq` 命令查看所有的队列任务。输出将列出任务编号、执行时间以及执行的用户（即最初运行 `at` 命令的用户）：\n\n\
  ```\n$ atq\n1  Sat Apr 17 21:00:00 2010 a kyle\n```\n\n如果你想从队列中删除任务，只需使用 `atrm`\
  \ 命令后跟任务编号即可将其出队。\n\n### Cron\n\n大多数情况下，你会发现自己不想使用 `at`，而是想要定期运行命令。为此你将使用 `cron`。`cron`\
  \ 是在你的 Linux 系统后台运行的守护进程。每个用户和系统本身都有一个 cron 表（称为 crontab），列出了他们想要运行的任务以及运行的频率。\n\
  \n系统级 cron 表位于 `/etc/crontab`，它是了解 cron 语法的好去处：\n\n```\n$ cat /etc/crontab\n```\n\
  \n\n\n\n[content]\n# /etc/crontab: 系统级 crontab\n\n与其他任何 crontab 不同，当你编辑此文件以及 `/etc/cron.d`\
  \ 中的中的文件时，你不需要运行 `crontab` 命令来安装新版本。这些文件还包含用户名字段，而其他 crontab 都没有该字段。\n\n```bash\n\
  SHELL=/bin/sh\nPATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin\n\
  \n# m h dom mon dow user     command\n17 * * * *    root     cd / && run-parts —report\
  \ /etc/cron.hourly\n25 6 * * *    root     test -x /usr/sbin/anacron ||\n    ( cd\
  \ / && run-parts —report /etc/cron.daily )\n47 6 * * 7    root     test -x /usr/sbin/anacron\
  \ ||\n    ( cd / && run-parts —report /etc/cron.weekly )\n52 6 1 * *    root   \
  \  test -x /usr/sbin/anacron ||\n    ( cd / && run-parts —report /etc/cron.monthly\
  \ )\n```\n\n此文件中的每个 crontab 条目都以几个字段开头，告诉 cron 何时运行该条目。然后，条目指定了将由哪个用户执行命令（在这些示例中为\
  \ root），最后列出要运行的命令。让我们来看一下这几行，看看语法是如何工作的：\n\n点击此处查看代码图片\n\n```bash\n25 6 * * * \
  \   root     test -x /usr/sbin/anacron ||\n    ( cd / && run-parts —report /etc/cron.daily\
  \ )\n```\n\n该行的第一个字段告诉 cron 在每小时的第几分钟触发命令，第二个字段设置几小时。在这个示例中，命令将在早上 6:25 触发。接下来的三个字段允许你设置在每月的哪一天、月份或星期的几几天运行命令。在我们的情况下，我们在这些字段中都使用了\
  \ `*`，它作用像通配符，因此 cron 就会每天早上 6:25 运行该命令。\n\ncrontab 中的下一行向你展示了如何每周运行一次命令：\n\n点击此处查看代码图片\n\
  \n```bash\n47 6 * * 7    root     test -x /usr/sbin/anacron ||\n    ( cd / && run-parts\
  \ —report /etc/cron.weekly )\n```\n\n在这条命令中，分钟字段被设置为 47，小时字段设置为 6（即早上 6:47），日期和月份字段是通配符，而星期字段被设置为\
  \ `7`。星期字段可以接受 0 到 7 之间的数字，其中 0 或 7 都代表星期日，1 代表周一，2 代表周二，以此此类推。在这种情况下，命令将在每周日的早上\
  \ 6:47 运行。\n\n文件中的最后一行向你展示了如何让 cron 每月执行一次命令：\n\n点击此处查看代码图片\n\n```bash\n52 6 1 *\
  \ *    root     test -x /usr/sbin/anacron ||\n    ( cd / && run-parts —report /etc/cron.monthly\
  \ )\n```\n\n在这里我们看到分钟字段被设置为 52，小时字段设置为 6，日期字段被设置为 1，而其余字段都是通配符。这告诉 cron 在每月第一日的早上\
  \ 6:52 运行该命令。如果我想让命令在每月的第 20 天运行，我会将 1 改为 20。\n\n除了可以在每个字段中填入的标准数字外，cron 还接受范围和用逗号分隔的多个数字。你可以通过在两个数字之间放置一个连字符来定义范围。例如，如果我想每\
  \ 15 分钟运行一次命令，我的字段看起来像这样：\n\n```bash\n0,15,30,45 * * * *      root      mycommand\n\
  ```\n\n这样，cron 将在每小时的 0、15、30 和 45 分运行命令。如果我只想在周一到周五的早上 9 点运行命令，我可以这样说：\n\n```bash\n\
  0 9 * * 1-5      root      mycommand\n```\n\n最后，cron 还接受分数形式，这可以让你避免输入所有用逗号分隔的数字。例如，上述每\
  \ 15 分钟运行一次命令的简写形式可以是：\n\n```bash\n*/15 * * * * root      mycommand\n```\n\n虽然过去许多管理员会将他们的命令直接放入\
  \ `/etc/crontab` 中，但随着时间的推移，这导致该文件变得巨大且难以管理。现实中，你通常想每小时、每天、每周或每月运行一次命令。与其直接将这些命令放入\
  \ `/etc/crontab`，你所只需要创建一个包含你想要运行的 shell 脚本的文件，然后将其放置在 `/etc/cron.hourly/`、`/etc/cron.daily/`、`/etc/cron.weekly/`\
  \ 或 `/etc/cron.monthly/` 中，cron 就会按照该频率运行它。在过去，许多管理员会将他们的命令直接放入 `/etc/crontab` 中，但随着时间的推移，这导致该文件变得巨大且难以管理。现实中，你通常想每小时、每天、每周或每月运行一次命令。与其直接将这些命令放入\
  \ `/etc/crontab`，你所做的只是创建一个包含你想要运行的 shell 脚本的文件，然后将其放置在 `/etc/cron.hourly/`、`/etc/cron.daily/`、`/etc/cron.weekly/`\
  \ 或 `/etc/cron.monthly/` 中，cron 就会按照该频率运行它。在过去，许多管理员会将他们的命令直接放入 `/etc/crontab` 中，但随着时间的推移，这导致该文件变得巨大且难以管理。现实中，你通常想每小时、每天、每周或每月运行一次命令。与其直接将这些命令放入\
  \ `/etc/crontab`，你所做的只是创建一个包含你想要运行的 shell 脚本的文件，然后将其放置在 `/etc/cron.hourly/`、`/etc/cron.daily/`、`/etc/cron.weekly/`\
  \ 或 `/etc/cron.monthly/` 中，cron 就会按照该频率运行它。\n[/content]\n\n\n\n这之所以可行是因为正则表达式的力量。当我用括号括起第一个字符时，我是在告诉\
  \ `grep` 在字符类中进行搜索。通常你使用字符类是为了列出多个不同的字符以进行匹配，但在这种情况下，由于里面只有一个字符，它的作用就像我直接在搜索 `bash`\
  \ 一样。当然，由于 `grep` 命令本身本身包含括号，因此它不会显示在结果中。\n\n## 命令路径的快捷方法\n\n有时你想查看一个位于二进制路径中的 shell\
  \ 脚本，但你不一定确定它是在 `/bin`、`/sbin`、`/usr/bin`、`/usr/local/bin` 还是其他地方。虽然你可以一直按 `Tab`\
  \ 键直到找到它，但使用 `which` 命令会搜索你的路径并输出你所列出的命令的完整路径：\n\n```\n$ which vim\n```\n/usr/bin/vim\n\
  ```\n\n如果我想对 `vim` 二进制文件执行 `ls -l`，但不确定它在哪个目录，我只需要输入：\n\n点击此处查看代码图像\n\n```\n$ ls\
  \ -l `which vim`\nlrwxrwxrwx 1 root root 21 2008-03-21 22:22 /usr/bin/vim -> /etc/alternatives/vim\n\
  ```\n\n当你用反引号（`` ` ``）括起命令时，它会运行该命令并将输出显示在原命令的位置。我特别喜欢在编辑自己编写的自定义 shell 脚本且不知道它保存在哪里时这样做。\n\
  \n## 一行命令擦除驱动\n\n请小心使用此命令！作为系统管理员，你经常会有需要处理的系统，并且需要擦除硬盘以防止公司隐私数据泄露。实现此目的的一种简单方法是使用\
  \ `dd` 命令从特殊的 `/dev/zero` 设备读取，并输出到你想擦除的驱动器。当命令完成后，整个驱动器将全是零。因此，如果我想完全擦除 `/dev/sdb`，我会输入：\n\
  \n```\n$ sudo dd if=/dev/zero of=/dev/sdb\n```\n\n## 重复执行命令\n\n通常我会在需要将文件从一个文件系统或服务器复制到另一个，并想监控复制进度。虽然我可以不断输入\
  \ `ls -l`，但更好的方法是使用 `watch` 命令。`watch` 程序接受命令作为参数，然后每两秒运行一次该命令并在屏幕上显示其输出。例如，如果我想监控\
  \ `ubuntu.iso` 的大小，我会输入 `watch \"ls -l ubuntu.iso\"`。`watch` 命令接受几个参数，例如 `-n` 参数，以便你可以调整再次运行程序之前等待的秒数。\n\
  \n## 服务器恢复启动时发出声音\n\n我工作时通常一次会有多件事在进行。当我处理一个服务器并需要重启它时，我通常希望在它恢复后立即知道，这样我可以登录并完成正在做的工作。当然，通常发生的情况是我重启服务器，然后在等待它恢复时被其他工作分散了注意力，完全忘了直到以后才想起。解决这个问题的不错方法是使用带有\
  \ `-a` 参数的 `ping` 程序。`-a` 参数告诉 `ping` 每次响应都播放一次听性蜂声（你有时按下键盘上的 `Tab` 键时听到的那种哔声）。当系统启动时，这意味着一个接一个哔声。我喜欢的做法是在重启时对特定的主机名运行\
  \ `ping -a`。这样我就可以去忙其他事情，一旦服务器在网络上恢复，我的终端就会一直哔作，直到我停止 `ping` 进程。\n\n## 在文件中搜索并替换文本\n\
  \n在文件中搜索和替换文本有多种方法，从 `sed` 和 `awk` 脚本到用文本编辑器打开文件。我最喜欢的方法之一是用我称之为“Perl 饼”的脚本。如果我想将\
  \ `file.txt` 中所有的 `kyle` 替换为 `Kyle`，我会输入：\n\n```\n$ perl -pi -e 's/kyle/Kyle/' file.txt\n\
  ```\n\n由于这个单行命令使用了 Perl，这也意味着你可以利用 Perl 高级的正则表达式引擎。\n\n## find 和 exec 命令\n\n一个非常常见的命令行需求是定位目录及其所有子目录中具有特定属性的文件，并在它们上运行某些命令。例如，假设我想将当前目录及其所有子目录下所有以\
  \ `.txt` 结尾的文件移动到 `~/Documents`目录。如果你只想列出所有文件，可以运行以下 `find` 命令：\n\n```\n$ find ./\
  \ -name \"*.txt\"\n```\n\n在输出中，你将获得每个以 `.txt` 结尾的文件列表及其路径。若要对这些文件执行某些程序，你可以使用 `find`\
  \ 的 `-exec` 参数：\n\n点击此处查看代码图像\n\n```\n$ find ./ -name \"*.txt\" -exec mv {} ~/Documents/\
  \ \\;\n```\n\n`-exec` 命令会将每个文件中的 `{}` 替换为该文件的完整路径。在这种情况下，它将对文件运行 `mv` 命令并将其移动到 `~/Documents`\
  \ 目录。注意结尾那个奇怪的 `\\;`。\n\n\n\n\n如果一个文件系统上有文件被打开，Linux 将不会允许你卸载该文件系统。通常，如果你在该文件系统的某个目录下运行了\
  \ shell，就会看到这种提示。在这种情况下，你只需要切换到另一个目录就可以解决问题，然后卸载该文件系统；但有时你并不确定哪个程序正在占用它。这时，你可以使用\
  \ `lsof` 命令。`lsof` 命令会列出系统中所有打开的文件。你只需要对想要卸载的文件系统进行 `grep` 搜索，就能看到哪些进程在该文件系统上打开了文件。例如，假设我想卸载\
  \ `/media/cdrom`。我会输入：\n\n```bash\nsudo lsof | grep /media/cdrom\n```\n\n在 `lsof`\
  \ 的输出中，我将看到所有在该文件系统上打开了文件的进程列表、它们的进程 ID（PID），甚至它们打开了哪些文件。然后，我可以关闭该程序或杀死该进程，并卸载文件系统。\n\
  \n### 使用 telnet 发送测试邮件\n\n邮件服务器在 25 端口监听 SMTP 连接，当你连接到该端口时，如果你知道要发送哪些 SMTP 命令，就可以伪装成另一个邮件服务器。一个非常方便的技巧是，只需通过\
  \ `telnet` 连接到机器的 25 端口并输入原始邮件消息，即可测试邮件服务器：\n\n点击此处查看代码\n\n```bash\ntelnet localhost\
  \ 25\n\nTrying 127.0.0.1...\nConnected to localhost.\nEscape character is '^]'.\n\
  220 minimus ESMTP Postfix (Ubuntu)\nHELO kyle\n250 minimus\nMAIL FROM: kyle@example.net\n\
  250 2.1.0 Ok\nRCPT TO: kyle@localhost\n250 2.1.5 Ok\nDATA\n354 End data with <CR><LF>.<CR><LF>\n\
  Subject: test\nThis is just a test\n.\n250 2.0.0 Ok: queued as 1ADD057CD0\nquit\n\
  221 2.0.0 Bye\nConnection closed by foreign host.\n```\n\n你输入的第一个命令是 `HELO`，后面跟着你希望系统识别的身份名称。接下来输入\
  \ `MAIL FROM:`，后面跟着你希望邮件显示的发件人地址。之后输入 `RCPT TO:`，后面跟着你想发送到的接收人地址。然后输入 `DATA`。此时，你之后输入的所有内容都将被视为邮件正文。在我的示例中，我添加了\
  \ `Subject:` 字段，但该字段也是可选的。继续输入你的信息，完成后，按 `enter`（回车），输入一个点 `.`，然后再次按 `enter`。最后输入\
  \ `quit` 结束会。\n\n### 轻松共享 SSH 密钥\n\n在设置 SSH 密钥认证时，恼人的部分之一是将所有公钥移动到每个系统的 `authorized_keys`\
  \ 文件中。多年来，我编写一些复杂的 Shell 脚本来拷贝密钥，但后来发现 `openssh` 软件包包含了一个名为 `ssh-copy-id` 的工具专门为此设计。要使用该程序，只需输入\
  \ `ssh-copy-id`，后面加上想要拷贝密钥的远程服务器（以及可选的远程用户名）。例如，如果我想将当前用户的密钥拷贝到名为 `web1` 的服务器，我可以输入：\n\
  \n```bash\nssh-copy-id web1\n```\n\n或者，如果我想将密钥拷贝到名为 `db4` 的服务器上的 kyle 用户账户，我会输入：\n\
  \n```bash\nssh-copy-id kyle@db4\n```\n\n### 充分利用 dig 的功能\n\n许多人（包括我在内）仍然使用 `nslookup`\
  \ 进行许多 DNS 查询，尽管它已经被废弃多年，这只是因为我们习惯了使用它。毕竟，`dig` 的语法不同，而且通常你会得到大量的输出，必须仔细研究才能找到你想要的信息。除非你使用\
  \ `dig` 的 `+short` 选项如此。使用该选项后，`dig` 将只给你你需要的输出：\n\n```bash\ndig www.ubuntu.com\
  \ +short\n91.189.90.40\n```\n\n`dig` 的另一个优秀选项是 `+trace` 选项。通常 `dig` 会给你你正在搜索的最终结果，但你可能没有意识到，在你的查询和答案之间存在许多\
  \ DNS 服务器（如果答案没有被缓存）。如果你在 `dig` 查询中添加 `+trace`，它的作用非常像 `traceroute`，会追踪 `dig` 查询并向你显示\
  \ DNS 请求所经过的所有跳数。\n\n点击此处查看代码\n\n```bash\ndig www.ubuntu.com +trace\n\n; <<>> DiG\
