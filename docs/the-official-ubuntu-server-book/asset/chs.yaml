  \n我的 `r0` 资源的最后部分是以下：\n\n当脑裂发生时，没有任何节点可以与另一个节点通信。\n\n***\n\n### 精简版的 `drbd.conf`\n\
  \n我将配置文件精简了一些，因为两个节点都使用相同的元数据磁盘类型、驱动器设置。这里是一个你可以使用的精简版 `drbd.conf` 示例：\n\n点击此处查看代码图片\n\
  \n***\n\n我的 `r0` 资源的最后部分是以下：\n\n当脑裂发生时，没有任何节点可以与另一个节点通信。\n\n我的 `r0` 资源的最后部分是以下：\n\
  \n当脑裂发生时，没有任何节点可以与另一个节点通信。\n\n我的 `r0` 资源的最后部分是以下：\n\n当脑裂发生时，没有任何节点可以与另一个节点通信。\n\n\
  我的 `r0` 资源的最后部分是以下：\n\n当脑裂发生时，没有任何节点可以与另一个节点通信。\n\n我的 `r0` 资源的最后部分是以下：\n\n当脑裂发生时，没有任何节点可以与另一个节点通信。\n\
  \n我的 `r0` 资源的最后部分是以下：\n\n当脑裂发生时，没有任何节点可以与另一个节点通信。\n\n我的 `r0` 资源的最后部分是以下：\n\n当脑裂发生时，没有任何节点可以与另一个节点通信。\n\
  \n***\n\n### 初始化 DRBD 资源\n\n现在 `drbd.conf` 文件已经设置好，我确保它在两个节点上都存在，然后在两个节点上运行相同的命令来初始化。首先我加载内核\
  \ DRBD 模块，然后创建元数据，然后启动设备：\n\n```\nmodprobe drbd\ndrbdadm create-md r0\ndrbdadm up\
  \ r0\n```\n\n注意我使用的是资源 `r0`。如果你设置了多个资源，你需要对每个资源首次执行这些命令。在两个节点上运行这些命令后，你可以检查每个节点上的\
  \ `/proc/drbd` 文件以查看磁盘的当前状态：\n\n点击此处查看代码图片\n\n```\n$ cat /proc/drbd\nversion: 8.0.11\
  \ (api:86/proto:86)\nGIT-hash: b3fe2bdfd3b9f7c2f923186883eb9e2a0d3a5b1 build by\n\
  phil@mescal, 2008-02-12 11:56:43\n\n1: cs:WFConnection st:Secondary/Unknown ds:Inconsistent/DUnknown\n\
  \  C r---\n  ns:0 nr:0 dw:0 dr:0 al:0 bm:0 lo:0 pe:0 ua:0 ap:0\n  resync: used:0/31\
  \ hits:0 misses:0 starving:0 dirty:0 changed:0\n  act_log: used:0/127 hits:0 misses:0\
  \ starving:0 dirty:0\n  changed:0\n```\n\n在这个输出中，你可以看到它的当前状态（`cs`）是 `WFConnection`，这意味着它正在等待连接。目前没有节点被分配为主节点，因此每个节点都会认为它的状态（`st`）是\
  \ `Secondary/ Unknown`。最后，磁盘状态（`ds`）将是 `Inconsistent`，因为两个 DRBD 资源尚未同步。如果你的集群发生了脑裂且\
  \ DRBD 无法自动恢复，在这里也会显示 `Inconsistent`。\n\n\n\n\n接下来，你准备好执行从一个节点到另一个初始同步。这意味着你必须选择一个节点作为主节点（primary），并且两个节点都必须能够通过网络通信。现在，如果你的磁盘上已经有了数据，那么将其选择为主节点至关重要。否则，第二个节点上的空白磁盘将覆盖你所有的数据。如果两个磁盘当前都是空的，那么影响就不那么大。在我的情况下，我选择\
  \ `node1` 作为主节点并在其上运行以下命令：\n\n点击此处查看代码图片\n\n```\n$ sudo drbdadm -- --overwrite-data-of-peer\
  \ primary r0\n```\n\n此时，数据将开始从 `node1` 同步到 `node2`。如果我检查 `/proc/drbd` 的输出，我就可以看到它的进度，就像查看\
  \ `/proc/mdstat` 和软件 RAID 一样：\n\n点击此处查看代码图片\n\n```\n$ cat /proc/drbd\n\nversion:\
  \ 8.0.11 (api:86/proto:86)\n\nGIT-hash: b3fe2bdfd3b9f7c2f923186883eb9e2a0d3a5b1b\
  \ build by\n  phil@mescal, 2008-02-12 11:56:43\n  1: cs:SyncSource st:Primary/Secondary\
  \ ds:UpToDate/Inconsistent\n    C r---\n      ns:9568 nr:0 dw:0 dr:9568 al:0 bm:0\
  \ lo:0 pe:0 ua:0 ap:0\n      [>....................] sync'ed:  0.2% (8171/8181)M\n\
  \      finish: 7:15:50 speed: 316 (316) K/sec\n      resync: used:0/31 hits:597\
  \ misses:1 starving:0 dirty:0\n        changed:1\n      act_log: used:0/127 hits:0\
  \ misses:0 starving:0 dirty:0\n        changed:0\n```\n\n现在你可以看到当前状态、状态和磁盘状态都发生了变化。一旦同步开始，你就可以像使用普通分区一样开始使用\
  \ `/dev/drbd1`，在上面创建文件系统并挂载它。在我的情况下，磁盘是空的，所以我需要在 `node1` 上同时完成这两项操作：\n\n点击此处查看代码图片\n\
  \n```\n$ sudo mkfs -t ext3 /dev/drbd1\n$ sudo mkdir /mnt/shared\n$ sudo mount /dev/drbd1\
  \ /mnt/shared\n```\n\n现在去 `node2` 并确保 `/mnt/shared` 目录在该处也存在，但**不要**挂载 `/dev/drbd1`！由于我使用的是\
  \ `ext3` 而不是集群文件系统，我一次只能在一个节点上挂载并写入 `/dev/drbd1`。一旦文件同步完成，状态将变为 `Connected`，磁盘状态将变为\
  \ `UpToDate`。然后你就可以准备设置 Heartbeat，以便它能够正确地 DRBD 进行故障切换（fail-over）。\n\n***\n\n###\
  \ 警告\n\n注意，我在这里没有提到任何关于 `/etc/fstab`。你不应该向 `/etc/fstab` 中添加任何 DRBD 设备，因为它们不一定会在启动时自动挂载。相反，Heartbeat\
  \ 将负责在集群的活动成员上挂载任何 DRBD 磁盘。\n\n***\n\n### 配置 Heartbeat\n\nHeartbeat 特别地以 `/etc/ha.d/resource.d/`\
  \ 下名为 `drbddisk` 的脚本形式提供了 DRBD 支持。你可以使用此脚本告诉 Heartbeat 要启动或停止哪些资源。除非使用集群文件系统，否则一次只有一个节点可以挂载并写入\
  \ DRBD 设备，因此你需要设置 Heartbeat，让它根据哪个节点处于活动状态来挂载或卸载文件系统。之前我的 `/etc/ha.d/haresources`\
  \ 文件中的该行是：\n\n`node1 172.16.245.222 apache2`\n\n现在我将把它改为：\n\n点击此处查看代码图片\n\n```\n\
  node1 172.16.245.222 drbddisk::r0\n  Filesystem::/dev/drbd1::/mnt/shared::ext3 apache2\n\
  ```\n\n对 `node2` 上的 `haresources` 文件也进行类似的更改。一旦你更改了两个主机上的 `/etc/ha.d/haresources`\
  \ 文件，运行：\n\n```\n$ sudo /etc/init.d/heartbeat reload\n```\n\n现在你的集群已经准备就绪了。你可以通过例如重启主主机来模拟一次故障。如果你去第二个节点，你应该会注意到\
  \ Heartbeat 几乎立即介入并挂载 `/dev/drbd1`、启动 Apache 并接管浮动 IP。`/proc/drbd` 文件将状态列为 `WFConnection`。\n\
