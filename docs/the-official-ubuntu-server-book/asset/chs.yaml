  ```\n\n第一列列出了文件或目录的权限。如果该列以 `d` 开头，则它是一个目录；如果以 `-` 开头，则是一个普通文件；如果以 `l` 开头，则是一个符号链接（稍后会详细介绍）。之后，你将看到一组三一组的\
  \ `r`、`w` 或 `x`。`r`、`w` 和 `x` 分别代表可读、可写和可执行。\n\n### 文件所有权\n\n作为管理员，你会发现你经常需要更改文件的所有者、组或权限。`chown`\
  \ 和 `chgrp` 命令分别允许更改所有者和组，前提是你的用户拥有更改所有权的权限。因此，如果我想把文件的组改为 `staff`，我会输入 `sudo chgrp\
  \ staff filename`。\n\n`chmod` 命令允许你更改文件的权限。有许多描述文件权限的方法（输入 `man chmod` 查看完整列表），但一种常用的方法是列出\
  \ `u`、`g` 或 `o` 代表用户、组或其他人，后面紧跟 `+` 或 `-` 号，然后是要添加或删除的权限。因此，如果我想移除文件所有者的写入权限，我会输入\
  \ `chmod u-w filename`。如果我想为文件的组添加读取权限，我会输入 `chmod g+r filename`。要为系统上的其他人添加文件的读取权限，请输入\
  \ `chmod o+r filename`。甚至有一个快捷方式 `a`，可以将更改应用于用户、组和所有人，所以如果想为用户、组和所有人添加读取权限，请输入 `chmod\
  \ a+r filename`。\n\n### 检查运行进程\n\n管理员经常需要检查系统上正在运行哪些程序以及它们消耗了多少资源。你可能还需要停止系统上的某个进程。Linux\
  \ 提供了许多管理进程的工具，但 `top` 和 `ps` 是最常用的。当你在命令行上输入 `top` 并按回车时，你会一次性看到大量的系统信息。这些数据会不断更新，以便让你看到系统的实时信息，包括系统运行了多久、负载平均值、系统总共运行了多少进程、你有多少内存（总计、已用和空闲），最后是进程列表以及它们使用的资源。\n\
  \n![Image](img/02fig01.jpg)\n\n**图 2-1** top 命令的输出\n\n\n\n你可能无法通过 `top` 查看系统上当前运行的所有进程，因为它们无法完全显示在屏幕上。默认情况下，`top`\
  \ 会根据进程对 CPU 的使用率对其进行排序。这样你就可以一眼看出哪些进程正在消耗 CPU。那么，如果你发现某个进程耗尽了你所有的 CPU 并想杀掉它怎么办？在\
  \ `top` 中，进程的第一列标记为 `PID`，它显示程序的进程 ID（Process ID）——这是分配给系统上每个进程的唯一数字。要杀死一个进程，按下\
  \ `K` 键，然后输入你想要杀死的 `PID`，最后在提示使用信号 15 杀死时按回车键。`top` 是一个非常强大且信息丰富的程序，我提到的只是它能实现的功能的一小部分。如果你想了解更多关于\
  \ `top` 的信息，包括输出中每个字段的详细信息、如何按不同字段进行排序等，可以在终端中输入 `man top` 来打开该命令的帮助手册。\n\n### 注意：man\
  \ 命令\n\n你可能已经注意到我提到过几次 `man` 命令了。这个命令是 `manual`（手册）的缩写，是 Linux 系统中最有用的命令之一，因为它为你提供了所有主要\
  \ Linux 命令的手册。无论你使用 Linux 多久，你似乎永远无法背下每个命令的每一个参数，但你并不需要这样做。当你遇到困难时，只需输入 `man command`\
  \ 即可查看该命令的所有参数列表以及如何使用该程序的总体说明。在 `man` 程序运行时，按 `q` 键退出。关于 `man` 程序的更多信息，你可以输入——你猜得没错——`man\
  \ man`。\n\n另一个列出进程的有用命令行程序是 `ps` 命令。当你不带任何参数运行它时，它并不好用——它只列出你当前 shell 中的进程。正是这些参数让\
  \ `ps` 变得如此强大。当你输入 `ps -ef` 时，你将看到关于系统上所有运行进程的海量信息。输出的最顶部将显示每列的标签，但在输出中，你将看到所有进程的用户、`PID`、父进程的\
  \ `PID`（启动该进程的进程）、进程的启动时间，甚至是运行该进程及其所有参数的完整命令。\n\n### 提示\n\n当你得到一列列滚过终端的输出时，记得你可以输入\
  \ `Shift + PgUp` 来向上滚动终端。你还可以将任何命令通过到 `less` 程序（例如 `ps -ef | less`），这样你可以更方便地翻页输出。\n\
  \n`ps` 命令是查找特定进程 `PID` 以将其杀死的另一种有用方法，但与 `top` 不同，`ps` 不会为你杀死进程。要在命令行中杀死进程，请输入 `kill`\
  \ 后跟 `PID`。因此，如果我想杀死一个 `PID` 为 4023 的程序，我会输入 `kill 4023`。你会发现有些程序是固执的，即使你杀掉了它们也不会消失。这是因为默认情况下，`kill`\
  \ 命令向进程发送一个让其关闭的信号——该进程可能会忽略这个信号。如果你尝试杀死一个进程而它似乎不配合，你可以通过向 `kill` 传递 `-9` 选项来强制进程死亡。因此，如果\
  \ 4023 进程很固执，我可以输入 `kill -9 4023`。在在使用 `-9` 选项之前，请务必先运行普通的 `kill` 命令，以便进程有机会进行清理工作。\n\
  \n### 编辑文件\n\n在 Linux 服务器上，大多数程序将其配置存储在文本文件中。当你想要对程序进行更改时，最常见的方法是找到它的配置文件，用文本编辑器打开它，进行更改，然后将这些更改保存到文件中。Ubuntu\
  \ 提供了许多文本编辑器，即使在默认的服务器安装中，也有两个流行的编辑器供选择：`vi` 和 `nano`。虽然许多管理员（包括我自己）更倾向于 `vi`，但它的学习曲线很陡，所以当你刚开始时，有一个像\
  \ `nano` 这样更简单的选项是好的。\n\n使用 `nano` 编辑文件，输入 `nano` 后跟文件名。文件打开后，你可以使用方向键在文件中移动光标。当你到达想要更改的部分时，可以使用标准的退格键（backspace）和删除键删除文本并输入新文本。你还会注意到屏幕底部列出了你可以执行的操作列表。每个操作都有一个按键绑定，每个键绑定都以\
  \ `^` 开头，代表 `Ctrl` 键。完成文件编辑后，你可以按 `Ctrl-X` 退出程序。Nano 在关闭之前会提示你保存文件，所以如果你不想保存更改，将会有机会在不保存的情况下退出。\n\
  \n### 成为 Root\n\n当你管理系统时，很快就会发现作为普通用户你能做的事情是多么少的。基本上每个配置文件都需要额外的权限才能编辑，每个主要服务也是如此。`root`\
  \ 用户非常像 Windows 系统上的管理员用户，拥有机器上所有文件和服务的权限。在某些 Linux 系统上，`root` 用户与其他用户一样，为该账户分配了密码，但在\
  \ Ubuntu 上，`root` 密码被禁用了。相反，你可以以普通用户身份登录，然后使用 `sudo` 命令获取 root 权限。\n\n### Ubuntu\
  \ 启动过程\n\n当你管理 Ubuntu 系统时，了解启动过程以及每个服务如何启动是非常重要的。与其他某些发行版不同，Ubuntu 实际上使用一种完全不同的服务启动过程称为\
  \ Upstart，除非你仔细观察，否则可能不会注意到，因为它增加了对 System V 模型的后兼容。我将涵盖两者，但让我们先熟悉启动过程的一些重要部分。\n\
  \n### GRUB\n\n当你首次启动 Ubuntu 服务器时，你会看到一个被称为 GRUB 引导器的启动界面。该程序至少部分位于主引导记录（MBR，硬盘的前\
  \ 512 字节）中，并控制系统从哪个 Linux 内核启动以及启动时使用的选项。\n\n在当前的 Ubuntu Server 版本（从 9.10 开始）中，原始的\
  \ GRUB 引导器已更新为 GRUB2。这在 GRUB 配置方面引入了许多与你使用 Linux 一久后可能不同的变化。例如，主 GRUB 配置文件以前是 `/boot/grub/menu.lst`，但现在是\
  \ `/boot/grub/grub.cfg`。然而，如果你查看该文件，你会注意到一个不要直接编辑它的警告。相反，如果你想更改 GRUB 设置，应该编辑 `/etc/default/grub`，然后运行\
  \ `sudo update-grub` 来更新主配置文件。在标准的 Ubuntu 桌面安装中，你通常不需要查看或编辑此文件。但在服务器上，你可能会遇到需要编辑它的情况。如果你想获取\
  \ GRUB 的完整文档，可以从阅读配置文件中的注释开始，也可以访问 `www.gnu.org/software/grub/grub.html`。\n\n\n\n\
  \n当你查看 `/boot/grub/grub.cfg` 甚至 `/etc/default/grub` 时，你会发现其中引用了一个名为 `update-grub`\
  \ 的程序。这是一个辅助程序，在添加新内核时能够更方便地自动更新 GRUB 配置。该程序会读取并执行 `/etc/grub.d` 内的多个配置脚本。通常情况下，如果你想进行任何配置更改，都应该坚持使用\
  \ `/etc/default/grub` 文件。\n\nGRUB 的强大之处之一是，你可以在启动提示符处对其设置进行临时更改。当 GRUB 加载时，你可能看不到菜单。按下\
  \ `Shift` 键即可查看所有可选内核选项。高亮你想编辑的内核并按下 `E` 键。此时，你可以更改想要编辑的特定配置行，进行所需的修改，然后按 `Ctrl\
  \ X` 根据这些选项进行启动。\n\n***\n\n### 注意：增加 GRUB 超时时间\n\n如果你发现很难及及时按下 `Shift` 键，可能需要编辑\
  \ `/etc/default/grub` 文件，并将 `GRUB_HIDDEN_TIMEOUT` 值改为较大的数字（例如 10），然后运行 `sudo update-grub`。这应该给你更多时间来按下\
  \ `Shift` 键。\n\n***\n\n### 内核启动过程\n\n当你通过 GRUB 菜单选择内核启动时，GRUB 会将内核同其 `initrd` 文件（初始内存磁盘）一起加载到内存中。`initrd`\
  \ 文件实际上是一个 gzipped 压缩的 cpio 存档，在 Ubuntu 下被称为 `initramfs` 文件。如果你对特定 `initramfs` 文件中包含哪些文件感兴趣，可以执行以下步骤将其提取：\n\
  \n```\ncp /boot/initrd.img-$(uname -r) /tmp/\ncd /tmp\ngunzip -c initrd.img-$(uname\
  \ -r) | cpio -idm --directory-root\n```\n\n\n\n\n\n此目录包含了每个运行级别（runlevel）所有服务的启动脚本。通常，这些是标准的\
  \ shell 脚本，符合基本标准。每个脚本至少接受两个参数，`start` 和 `stop`，分别用于启动或停止服务（例如，你的 Web 服务器）。此外，init\
  \ 脚本通常还接受几个额外选项，如 `restart`（停止并启动服务）、`status`（返回服务的当前状态）、`reload`（通知服务从配置文件中重新加载设置）以及\
  \ `force-reload`（强制服务重新加载设置）。当你从不带参数的情况下运行 init 脚本时，它通常会返回一个它接受的参数列表。\n\n![Image](img/box.jpg)\
  \ `/etc/rc0.d` 到 `/etc/rc6.d`\n\n这些目录包含每个对应运行级别的 init 脚本。在实践中，这些通常是指向 `/etc/init.d`\
  \ 下实际文件的符号链接（symlinks）。然而，你会注意到这些目录中的 init 脚本被分配了特殊的名称，以 `S`（启动）、`K`（杀死）或 `D`（禁用）开头，后面跟着一个数字。当\
  \ init 进入某个运行级别时，它会按数字顺序运行每个以 `K` 开头的脚本并传递 `stop` 参数，但仅当相应的 init 脚本在上一个运行级别中启动时才会执行。然后\
  \ init 会按数字顺序运行每个以 `S` 开头的脚本并传递 `start` 参数。任何以 `D` 开头的脚本会被 init 忽略——这允许你在特定的运行级别中临时禁用某个脚本，你也可以直接删除符号链接。因此，如果你有两个脚本\
  \ `S01foo` 和 `S05bar`，当 init 进入该特定运行级别时，它会先运行 `S01foo start`，然后运行 `S05bar start`。\n\
  \n![Image](img/box.jpg) `/etc/rcS.d`\n\n在此目录中，你将找到 init 在切换到特定运行级别之前启动时运行的所有系统 init\
  \ 脚本。修改此目录中的脚本时要小心，因为如果它们挂起，可能会阻止你甚至进入单用户模式。\n\n![Image](img/box.jpg) `/etc/rc.local`\n\
  \n并不是所有的发行版都使用 `rc.local`，但传统上这是一个留给用户编辑的 shell 脚本。它通常在 init 过程结束时执行，因此你可以在这里放入想要运行的额外脚本，而无需创建自己的\
  \ init 脚本。\n\n这里是一个标准 System V init 启动过程示例。首先，init 启动并读取 `/etc/inittab` 来确定其默认运行级别，在本例中为运行级别\
  \ 2。然后，init 进入 `/etc/rcS.d` 并按数字顺序运行每个以 S 开头的脚本，并将 `start` 作为参数。接着，init 对 `/etc/rc2.d`\
  \ 目录执行相同的操作。最后，init 完成了工作但保持在后台运行，等待运行级别的发生变化。\n\n## Upstart\n\nSystem V init 是一个很好的系统，多年来在\
  \ Linux 上运行良好；然而，它并非没有缺点。其一，init 脚本没有在服务崩溃时自动重新启动的机制。例如，如果 cron 守护进程由于某种原因崩溃了，你必须创建其他工具来监控并重启该进程。\n\
  \ninit 脚本的另一个问题是，它们通常只受运行级别变化或系统启动的影响，否则除非你手动执行，否则不会执行。依赖于网络连接的 init 脚本就是一个很好的例子。在\
  \ Ubuntu 上，有一个名为 `networking` 的 init 脚本用于建立网络连接。任何依赖网络连接的 init 脚本其数字都比此 init 脚本大，以确保它们在网络脚本运行之后再运行。如果你拔掉服务器的网线然后启动它会怎样？嗯，网络脚本会运行，但所有需要网络连接的\
  \ init 脚本将逐一超时。最终你将获得一个登录提示并能够登录。现在，在你登录后，如果插上网线并重启网络服务，你就可以访问网络了，但任何需要网络连接的服务都不会自动重启。你必须一个一个地启动它们。\n\
  \nUpstart 的设计不仅是为了解决 System V init 的某些缺点，还为了提供一个更健壮的服务管理系统。Upstart 的一个主要特性是它是事件驱动的。Upstart\
  \ 持续监控系统中某些事件的发生，当这些事件发生时，可以配置 Upstart 根据这些事件采取行动。一些示例事件可能是系统启动、系统关机、按下 Ctrl-Alt-Del\
  \ 序列、运行级别更改，或 Upstart 脚本的启动或停止。为了查看事件驱动系统如何改进传统的 init 脚本，让我们看看之前那个在拔掉网线的情况下启动系统的例子。你可以创建一个在插入网线时触发的\
  \ Upstart 脚本。该脚本随后可以为你重启网络服务。然后你可以配置任何需要网络连接的服务，使其在网络服务成功启动时被触发。现在当系统启动时，你只需插入网线，Upstart\
  \ 脚本就会处理其余工作。\n\nUpstart 尚未完全取代 System V init，至少在系统服务方面是如此。目前，Upstart 取代了 init 和\
  \ `/etc/inittab` 文件的功能，并管理运行级别的变化、系统启动和关机、控制台 tty 等，越来越多的核心功能正在迁移到 Upstart 脚本中，但你仍然会在\
  \ `/etc/init.d` 中找到一些标准 init 脚本以及 `/etc/rc.d` 中的符号链接。区别在于 Upstart 现在在运行级别更改时启动和停止。\n\
  \n### Upstart 脚本\n\nUpstart 脚本位于 `/etc/init`，其语法与 init 脚本不同，因为它们实际上并不是脚本。为了说明语法，这里有一个用于切换运行级别的示例\
  \ Upstart 脚本（`/etc/init/rc.conf`）：\n\n```\n# rc - System V 运行级别兼容性\n#\n# 此任务在切换运行级别时运行旧的\
  \ System V 风格 rc 脚本。\ndescription \"System V 运行级别兼容性\"\nauthor \"Scott James Remnant\
  \ <scott@netsplit.com>\"\n\nstart on runlevel [0123456]\nstop on runlevel [$RUNLEVEL]\n\
  \nexport RUNLEVEL\nexport PREVLEVEL\n\ntask\nexec /etc/init.d/rc $RUNLEVEL\n```\n\
  \nUpstart 将以 # 开头的行视为注释，与其他脚本和配置文件一样。两个配置选项是 `start on` 和 `stop on`。这些行定义了脚本启动和停止必须发生的事件。在这种情况下，脚本会在进入任何运行级别\
  \ 2 时启动，并在未设置运行级别时停止。\n\n接几行导出了一些环境变量，然后 `task` 告诉 init 该脚本不是持久的——它执行后就会停止。\n\n\
  从 Upstart 脚本运行的实际程序通过 `script` 或 `exec` 选项定义。在 `exec` 选项的情况下，Upstart 执行命令以及 `exec`\
  \ 选项之后的所有参数，并跟踪其 PID。使用 `script` 选项，Upstart 将随后的行视为 shell 脚本，直到遇到 `end script` 行。\n\
  \n\n\n\n尽管 Upstart 设计为事件驱动型，但它仍然提供了方法来检查 Upstart 任务的状态，并根据需要启动或停止它们。你可以使用命名为相应的\
  \ `status`、`start` 和 `stop` 命令来检查、启动和停止 Upstart 脚本。Ubuntu 服务器上的一个 Upstart 任务是 `tty1`\
  \ 任务，它在 `tty1` 上启动 `getty` 程序。这使得管理员在输入 `Alt-F1` 时能够获得一个控制台。然而，假假设由于某种原因，你认为控制台挂起了。以下是检查状态并重新启动任务的方法：\n\
  \n点击此处查看代码图片\n\n```\n$ sudo status tty1\n\ntty1: start/running, process 789\n\n\
  $ sudo stop tty1\n\ntty1 stop/waiting\n\n$ sudo start tty1\n\ntty1 start/running,\
  \ process 2251\n```\n\n你还可以通过 `initctl list` 查询所有可用 Upstart 任务的状态：\n\n点击此处查看代码图片\n\
  \n```\n$ sudo initctl list\n\nmountall-net stop/waiting\nrc stop/waiting\nrsyslog\
  \ start/running, process 640\ntty4 start/running, process 708\nudev start/running,\
  \ process 299\nupstart-udev-bridge start/running, process 297\nureadahead-other\
  \ stop/waiting\napport start/running\nhwclock-save stop/waiting\nirqbalance stop/waiting\n\
  plymouth-log stop/waiting\ntty5 start/running, process 713\natd start/running, process\
  \ 727\nfailsafe-x stop/waiting\nplymouth stop/waiting\nssh start/running, process\
  \ 1210\ncontrol-alt-delete stop/waiting\nhwclock stop/waiting\nmodule-init-tools\
  \ stop/waiting\ncron start/running, process 728\nmountall stop/waiting\nrcS stop/waiting\n\
  ufw start/running\nmounted-varrun stop/waiting\nrc-sysinit stop/waiting\ntty2 start/running,\
  \ process 717\nudevtrigger stop/waiting\nmounted-dev stop/waiting\ntty3 start/running,\
  \ process 718\nudev-finish stop/waiting\nhostname stop/waiting\nmountall-reboot\
  \ stop/waiting\nmountall-shell stop/waiting\nmounted-tmp stop/waiting\nnetwork-interface\
  \ (lo) start/running\nnetwork-interface (eth0) start/running\nplymouth-splash stop/waiting\n\
  tty1 start/running, process 2251\nudevmonitor stop/waiting\ndmesg stop/waiting\n\
  network-interface-security start/running\nnetworking stop/waiting\nprocps stop/waiting\n\
  tty6 start/running, process 720\nureadahead stop/waiting\n```\n\n## 修改默认运行级别 (Runlevel)\n\
  \n在某种程度上，Upstart 的终极目标是消除多个运行级别，因为如果你所有的服务都是通过 Upstart 脚本而不是 System V init 脚本来启动和停止的，你只需设置特定的事件来使系统进入一种状态或另一种状态。尽管如此，现在的系统仍然有多个运行级别，你可能想要设置不同的运行级别，甚至更改默认的运行级别\
  \ 2，以下是操作方法。\n\n默认的 Upstart 运行级别定义在 `/etc/init/rc-sysinit.conf` 中：\n\n点击此处查看代码图片\n\
  \n```bash\n# rc-sysinit - System V initialisation compatibility\n#\n# 此任务运行旧的 System\
  \ V 风格的系统初始化\n# 脚本，并在完成后进入默认运行级别。\ndescription     \"System V initialisation compatibility\"\
  \nauthor          \"Scott James Remnant <scott@netsplit.com>\"\nstart on filesystem\
  \ and net-device-up IFACE=lo\nstop on runlevel\n#默认运行级别，这可能在内核中被覆盖\nenv DEFAULT_RUNLEVEL=2\n\
  .\n```\n\n更改默认运行级别的方法之一是创建自己的 `/etc/inittab` 文件，并向其添加一个类似于经典 System V init 的 `initdefault`\
  \ 段（stanza）。另一种可能更简单的方法是编辑 `/etc/init/rc-sysinit.conf`，并将 `DEFAULT_RUNLEVEL` 的值更改为你想要的默认运行级别。\n\
  \n### 服务 (Services)\n\n内核和初始启动过程是 Ubuntu 服务器的重要部分，但根结上，服务器之所以存在（并命名）是因为服务。服务是你的计算机通过系统上的软件提供的某些功能。该软件以及运行它的计算机通常被称为服务器。一台计算机可以在同一台机器上运行多个服务，例如\
  \ Web 服务器、文件服务器和 DNS。\n\n在 Ubuntu 中，服务通过两种主要方式管理：通过初始化 脚本（init scripts）或一个名为 `xinetd`\
  \ 的程序。虽然 Upstart 在后台管理运行级别，并在未来最终也将管理 Ubuntu 上的大部分服务，但今天系统中的许多服务仍然通过 init 脚本启动和停止。正如我在章节开头提到的，init\
  \ 脚本位于 `/etc/init.d`，并在 `/etc/rc?.d` 目录中拥有符号链接，其中 `?` 是代表运行级别的数字。这些脚本中的每一个都支持扩展选项：`start`、`stop`、`restart`、`reload`、`force-reload`、`status`。大多数编写良好的脚本在你不带任何参数运行\
  \ init 脚本时会返回支持的参数列表：\n\n点击此处查看代码图片\n\n```\n$ /etc/init.d/networking {start|stop|restart|reload|force-reload}\n\
  ```\n\n点击此处查看代码图片\n\n```\n$ sudo /etc/init.d/networking stop\n```\n\n点击此处查看代码图片\n\
  \n```\n$ sudo /etc/init.d/networking start\n```\n\n点击此处查看代码图片\n\n```\n$ sudo /etc/init.d/networking\
  \ restart\n```\n\n\n\n\nservice 工具基本上提供了一种启动和停止服务的快捷方式。与其其输入 `sudo /etc/init.d/networking\
  \ restart`，你可以输入 `sudo service networking restart`。Red Hat 有一个非常实用的工具称为 `chkconfig`，管理员可以使用它启用和禁用服务。在\
  \ Red Hat 系统上，如果你想禁用名为 named 的服务（例如），你可以输入 `sudo chkconfig named off`，`chkconfig`\
  \ 脚本就会为你删除 `/etc/rc?.d/` 内部所有相关的符号链接。如果你想启用该服务，只需输入 `sudo chkconfig named on` 即可。\n\
  \n遗憾的是，Ubuntu 还没有类似于 `chkconfig` 的工具。与它最接近的是一个名为 `update-rc.d` 的程序。重要的一点是该脚本的设计目的是供软件包使用的，而不是像其语法所示的那样供用户使用的。它的原始意图是让软件包在安装时轻松地创建所需的所有符号链接，并在卸载软件包时移除所有符号链接。尽管如此，`update-rc.d`\
  \ 还有一些基本参数可以让你，用以获得与 `chkconfig` 类似的行为。要禁用一个 init 脚本启动，输入 `sudo update-rc.d -f`\
  \ `servicename` `remove`；要启用脚本，输入 `sudo update-rc.d` `servicename` `defaults`。\n\
  \n## 编写自己的 init 脚本\n\n最终，当你管理服务器时，你可能需要在启动时运行你自己的自定义程序。实现此点的简单方法是将脚本放在 `/etc/rc.local`\
  \ 中，使其在启动过程结束时运行。然而，如果你有一个更复杂的脚本，需要在开机时启动并在系统关机时停止，那么你想要编写一个自定义的 init 脚本。虽然你完全从头开始写，但\
  \ Ubuntu 通过一个名为 `skeleton` 的快捷 init 脚本让这个过程变得简单得多，你可以以此为基础编写你的 init 脚本。首先复制 skeleton\
  \ init 脚本并以你的服务命名文件：\n\n点击此处查看代码图像\n\n```bash\n$ sudo cp /etc/init.d/skeleton /etc/init.d/myservice\n\
  ```\n\n然后编辑你复制的 skeleton 文件，将文件中找到的通用占位符替换为适用于你服务的自定义信息：\n\n点击此处查看代码图像\n\n```bash\n\
  ### BEGIN INIT INFO\n\n# Provides:           skeleton\n# Required-Start:      $remote_fs\n\
  # Required-Stop:       $remote_fs\n# Default-Start:       2 3 4 5\n# Default-Stop:\
  \       0 1 6\n# Short-Description:   Example initscript\n# Description:       \
  \  This file should be used to construct\n#                       scripts to be\
  \ placed in /etc/init.d.\n### END INIT INFO\n\n# Author: Foo Bar <foobar@baz.org>\n\
  #\n# 如果你复制并修改此脚本，请删除上面的 \"Author\" 行\n# 并将其替换为你自己的名字。\n```\n\n在更改了注释中的通用条目后，你在 init\
  \ 脚本其余部分更改的内容实际上取决于你应用程序的复杂性。对于基础应用程序，你只需要关注初始注释之后的一系列环境变量：\n\n点击此处查看代码图像\n\n```bash\n\
  PATH=/sbin:/usr/sbin:/bin:/usr/bin\nDESC=\"Description of the service\"\nNAME=daemonexecutablename\n\
  DAEMON=/usr/sbin/$NAME\nDAEMON_ARGS=\"--options args\"\nPIDFILE=/var/run/$NAME.pid\n\
  SCRIPTNAME=/etc/init.d/$NAME\n```\n\nskeleton 脚本中的初始注释适用于你的服务是存在 `/usr/sbin` 中的可执行程序的基础情况。更改\
  \ `DESC` 和 `NAME` 变量，使其等于 `/usr/sbin` 下服务的描述和可执行文件名。如果你的服务安装在其他地方，例如 `/usr/local/sbin/`\
  \ 或 `/opt/`，请务必更改 `DAEMON` 变量中的路径以反映这一点。如果你的服务在运行时需要传递它的任何特殊参数，请在 `DAEMON_ARGS`\
  \ 变量中设置它们，否则将其更改为空。\n\n一旦完成了 init 脚本，你将需要为各种运行级别（runlevels）创建所有符号链接。虽然你可以手动创建符号链接，但使用\
  \ `update-rc.d` 脚本显然简单得多。首先查看你默认运行级别的当前 init 脚本（例如 `/etc/rc2.d` 中的），并决定你的 init 脚本应该何时启动。数字越小，它在启动过程中的启动时间越早，但请记住，如果你的服务依赖于其他服务的运行，你可能希望让它的序号更高。一旦你确定了一个数字（例如\
  \ 90），然后运行：\n\n点击此处查看代码图像\n\n```bash\n$ sudo update-rc.d myservice defaults 90\n\
  ```\n\n并将 `myservice` 替换为你在 `/etc/init.d/` 中提供的文件名。\n\n## Xinetd\n\n启动服务有两种主要方法。虽然大多数服务通过\
  \ `init` 脚本启动，但某些服务是由名为 `xinetd` 的程序管理的。`xinetd` 是 `inetd` 的更新版本，旨在更高效地利用资源。`init`\
  \ 脚本的问题是，当系统启动时，服务可能会在那里闲置几天或几周；`xinetd` 的设计思想是监听所有端口。如果其中一个端口建立了连接，`xinetd` 就会产生服务，一旦连接完成，服务就会退出。\n\
  \n`xinetd` 对于许多经典服务都很流行，包括 `echo`（回显发送给它的内容）、`daytime`（返回系统时间）和 `TFTPD`（简单文件传输守护进程）。`xinetd`\
  \ 默认不再安装，但如果你想使用，只需输入 `sudo apt-get install xinetd`。你可以在 `/etc/xinetd.d` 目录下看到所有配置的\
  \ `xinetd` 服务。默认这些服务都是禁用的；但启用服务相对简单。例如，要启用 `echo` 服务，用文本编辑器打开 `/etc/xinetd.d/echo`并将\
  \ `disable = yes` 更改为 `disable = no`。然后运行 `sudo service xinetd reload` 来重新加载配置文件。现在你可以连接本地的\
  \ 7 端口，你输入的任何内容都会回显：\n\n```bash\n$ telnet localhost 7\nTrying 127.0.0.1...\nConnected\
  \ to localhost.\nEscape character is '^]'.\n\nhello\nhello\necho\necho\n\n^]\ntelnet>\
  \ quit\nConnection closed.\n```\n\n按下 Ctrl-] 然后按回车进入交互式 telnet 提示符。然后输入 `quit` 并回车退出。\n\
  \n## 注意：使用 init 停机和重启\n\n我们讨论了很多关于 Ubuntu 如何启动的内容，但你可能也想知道如何停止或重启它。虽然你完全可以使用 `init`\
  \ 工具切换到运行级别 0 或 6，但有两个易记的命令叫做 `halt` 和 `reboot`，分别停止和重启系统。只需以 root 权限运行这两个命令之一，系统就会立即开始机过程并在完成后重启或关机。\n\
  \n## 文件系统层次结构\n\n在如今的 Ubuntu 桌面系统中，文件系统层次结构（目录在系统中的组织方式）对普通用户并不重要。在桌面端，你通常与个人主目录、桌面目录以及主目录下的其他几个目录交互。系统的所有其他目录在某种程度上都是隐藏的，设置通过\
  \ GUI 工具更改。然而，在 Ubuntu 服务器上，你从可靠的命令行管理一切，因此你很快就会熟悉根文件系统的许多目录。\n\n\n\n\n\nLinux 的伟大之处在于，这些目录每一个都有其直接用途，这些用途是根据\
  \ Linux（以及在此之前的 UNIX）被用作服务器多年来演变而来的。你对这些目录的作用及其存在的原因越了解深入，你排除故障的速度就越快，系统的安全性就越高，而且你添加自己的软件包和其他扩展时也越得游从心。以下是\
  \ Ubuntu 服务器上的一些重要目录。此列表并不意味着详尽或完整。其重点在于突出你作为管理员将与之交互的核心目录，并解释它们存在那里。不过，如果你确实需要详尽的解释，请查看\
  \ [`tldp.org/LDP/Linux-Filesystem-Hierarchy/html/index.html`](http://tldp.org/LDP/Linux-Filesystem-Hierarchy/html/index.html)。\n\
  \n![Image](img/box.jpg) \n\n## /bin\n\n此目录包含系统管理员和普通用户都可能使用的核心二进制文件。你会在此目录下找到如 `ps`、`ls`、`rm`、`mv`、`chmod`、`df`\
  \ 以及其他核心程序。\n\n![Image](img/box.jpg) \n\n## /sbin\n\n`/sbin` 目录的功能与 `/bin` 类似。它也包含二进制文件；但它是仅供管理员使用的核心二进制文件。此目录应只包含挂载系统其余部分以及系统无法启动时恢复系统至关重要的系统二进制文件。你在这里可以找到\
  \ `fsck`、`ifconfig`、`mkfs`、`route` 和 `init` 等程序。虽然 `/sbin` 中的一些二进制文件可以由普通用户运行，但它们通常旨在供\
  \ root 用户使用。\n\n![Image](img/box.jpg) \n\n## /lib\n\n在 `/lib` 下，你会找到系统完成启动过程以及使用\
  \ `/bin` 和 `/sbin` 下二进制文件所需的内核系统库。所有的内核模块也位于此处的 `/lib/modules/`。\n\n![Image](img/box.jpg)\
  \ \n\n## /usr\n\n`/usr` 目录（UNIX System Resources 的缩写）旨在存储系统中所有的非关键二进制文件和库。为什么要划分？嗯，想法是，如果你只在\
  \ `/bin`、`/sbin` 和 `/lib` 中保留核心二进制文件和库，就可以保持主根分区相对较小，并且在系统的整个生命周期内它增长不会太多。磁盘空间的大部分可以被分配给\
  \ `/usr` 分区，如果你愿意，可以将其挂载在独立的更大的磁盘上。关于 `/usr` 的另一个有用事实是，除非你更新系统上的软件包，否则 `/usr` 保持相对静态。这意味着如果你将\
  \ `/usr` 分离到单独分区，你实际上可以增加一层安全性，并将其挂载为只读，在执行更新时将其重新挂载为读写。\n\n![Image](img/box.jpg)\
  \ \n\n## /usr/bin\n\n此目录的作用与 `/bin` 类似，只是它存储系统中其他不被认为是关键的二进制文件。你在这里可以找到 `man`、`gzip`、`nano`\
  \ 以及其他供管理员和普通用户使用的二进制文件。\n\n![Image](img/box.jpg) \n\n## /usr/sbin\n\n此目录与 `/sbin`\
  \ 类似，只是它存储了管理员使用但对启动至关重要的二进制文件。在这里你会找到 `traceroute`、`chroot` 和 `ntpdate` 等工具，以及大多数由\
  \ init 脚本启动的守护进程，如 Web 服务器、ntp 守护进程和邮件服务器。\n\n![Image](img/box.jpg) \n\n## /usr/lib\n\
  \n与 `/lib` 一样，你在此目录下找到程序库，在这种情况下，它们是支持 `/usr/bin` 和 `/usr/lib` 下二进制文件的库。\n\n![Image](img/box.jpg)\
  \ \n\n## /usr/local\n\nUbuntu 作为服务器的优点在于，你想运行大多数服务和其他程序已经打包并准备好使用。但在某些情况下，你可能想为系统提供自定义的服务、二进制文件甚至你自己的自定义脚本。这就是\
  \ `/usr/local` 目录的用处。你会发现它提供了 `bin`、`sbin` 和 `lib` 目录，就像 `/usr` 一样，但这些目录旨在存放你想提供的非\
  \ Ubuntu 本身提供的第三方程序。\n\n![Image](img/box.jpg) \n\n## /opt\n\n倾向于使用 `/usr/local`\
  \ 第三方程序的人与倾向于 `/opt` 的人之间存在持续的争议。我会尽量不火上浇油，但只需说 `/opt` 和 `/usr/local` 具有相同的目的——存储第三方程序。两者主要区别在于组织方式。通常安装在\
  \ `/opt` 下的程序会安装在它们自己的目录下（例如，`/opt/someprogram`），然后在该目录下创建自己的 `bin`、`sbin` 和 `lib`\
  \ 目录。一方面这意味着你可以通过删除 `/opt` 下的目录来删除程序，但另一方面意味着如果你大量使用 `/opt`，你的 `PATH` 环境变量可能会变得很大。\n\
  \n![Image](img/box.jpg) \n\n## /boot\n\n我在讨论 /boot 过程时已经提到过 `/boot` 目录，该目录存储了内核镜像、initramfs\
  \ 文件以及 GRUB 配置文件。`/boot` 目录的存在是为了你可以可能将其分离到自己的小型挂载点中。如果你想尝试 LVM 或实验性文件系统，这将非常有用。你可以将\
  \ `/boot` 分区格式化为 ext2 或 ext3 并配置软件 RAID，以确保引导程序可以读取它。\n\n![Image](img/box.jpg) \n\
  \n## /etc\n\n对于系统管理员至关重要的目录。在 `/etc` 下，你会找到系统和服务的各种配置文件。正如我之前提到的，你还会在 `/etc/init`\
  \ 和 `/etc/init.d` 下找到系统启动脚本，以及 `/etc/default` 下的 cron、邮件服务器、Web 服务器、网络设置以及所有其他重要配置文件。在这里你不会（或者说不应该）发现二进制文件和库。所有配置文件存储在\
  \ `/etc` 中的巨大优点是配置文件是文本，且压缩率很高。这使得 `/etc` 非常容易备份，而且占用空间很小。我强烈建议，即使你不备份系统的其他任何内容，至少也要备份\
  \ `/etc`。\n\n![Image](img/box.jpg) \n\n## /var\n\n`/var` 目录旨在存储大小变化且经常更改的文件和目录。其理念是让管理员可以将\
  \ `/var` 挂载为独立分区，并可能放置在比系统其他部分快的磁盘上。在 `/var` 下，你会找到系统日志、邮件队列、Web 服务器文档和其他经常增长或更改的文件。虽然\
  \ `/bin`、`/sbin` 甚至 `/usr` 目录在服务器之间可能非常一致，但 `/var` 目录根据服务器的功能可能差异巨大。\n\n![Image](img/box.jpg)\
  \ \n\n### /var/log\n\n所有的系统日志都存储在 `/var/log` 下。任何经验丰富的管理员都知道，日志的大小各异，而且当系统负载过大或出现问题时，它们倾向于失控增长。这是你可能想要将\
  \ `/var` 挂载为独立分区的另一个原因——如果日志确实失控增长（相信我，它们终有一天会），你会填满 `/var` 而不会填满 `/` 导致系统崩溃。\n\n\
  ![Image](img/box.jpg) \n\n### /var/spool\n\n此目录包含存储如用户 crontab、打印队列和邮件队列等信息的子目录。特别是运行邮件服务器，此目录对你将变得非常重要，因为如果服务器积积大量邮件待发送，它可能会变得很大。\n\
  \n![Image](img/box.jpg) \n\n### /var/www\n\n\n\n\n\n此目录在所有系统中并不存在，但如果你运行 Web 服务器，它将成为\
  \ Web 服务器的 `docroot` 和 `cgi-bin` 目录的默认位置。\n\n![Image](img/box.jpg) `/home`\n\n在这里，你将找到所有添加到系统中的用户的家目录。如果你计划让有一组活跃的用户登录服务器，你可能希望将其挂载为单独分区，因为它可能会增长得非常大。将此目录分离的另一个优势是，如果你决定更换发行版，你可以在根分区上安装系统并覆盖原有内容，但保留此处的所有用户设置。\n\
  \n![Image](img/box.jpg) `/root`\n\n这是一个专门为 root 用户准备的特殊家目录。它与 `/home` 分离开来（原因包括但不限于等），以便在系统需要恢复且无法挂载\
  \ `/home` 时，root 用户仍可以使用该目录。\n\n![Image](img/box.jpg) `/dev`\n\n这是一个特殊目录，包含了系统上所有的设备文件。这些文件包括磁盘设备、键盘、鼠标以及系统检测到的任何其他设备。在经典的\
  \ Linux 系统中，这些文件是静态的，但在现代 Ubuntu 服务器上，随着设备的添加或模块的加载，设备文件通常由 `udev` 程序动态创建。\n\n![Image](img/box.jpg)\
  \ `/mnt`\n\n`/mnt` 目录旨在作为管理员临时挂载磁盘的通用位置。例如，你可能会在此临时挂载一个 NFS 共享，以便向系统复制或从系统复制信息。在过去，许多系统也使用\
  \ `/mnt` 处理可移动介质，但最近创建了 `/media` 目录专门为此目的。\n\n![Image](img/box.jpg) `/media`\n\n\
  过去，对于挂载软盘、CD-ROM 和 USB 驱动器等可移动介质，存在许多不同的标准。有些人主张为此创建额外的根目录，而另一些人则倾向于使用 `/mnt`。Ubuntu\
  \ 使用 `/media` 目录这些设备，以便将 `/mnt` 留非移动介质的临时挂载点。\n\n![Image](img/box.jpg) `/proc`\n\
  \nLinux 下有几个虚拟文件系统，`/proc` 是其中最有用的之一。它不是磁盘上的实际区域，而是存在于 RAM 中。在此目录下，你将找到实时系统信息。例如，系统上创建的每一个进程在\
  \ `/proc` 下都会获得一个与其 `PID` 对应的目录。该目录下包含许多其他文件和目录，包含了关于该进程的实时信息。除了进程信息外，`/proc` 还存储了与内核进程本身相关的虚拟文件。你可以查询诸如启动时传递给内核的选项（`/proc/cmdline`），查看不同内核设备的设置或其他设置。许多内核\
  \ `/proc` 文件不仅可以读取设置，还可以通过向相应文件写入写入设置。\n\n![Image](img/box.jpg) `/sys`\n\n`/sys`\
  \ 目录是一个类似于 `/proc` 的虚拟文件系统。`/sys` 内部的文件提供了有关系统上设备和驱动程序的信息，创建该文件系统的部分是为了让这类文件不再拥挤\
  \ `/proc`。与 `/proc` 一样，`/sys` 内的许多文件不仅提供系统部分的信息，你还可以写入各种文件来动态更改设置。\n\n![Image](img/box.jpg)\
  \ `/tmp`\n\n`/tmp` 目录是一个预留用于存储临时文件的特殊目录。每个用户都有权限在 `/tmp` 下创建文件，但用户创建的任何文件仅对其用户所在组（当然还有\
  \ root）可读可写。系统上的许多程序将使用 `/tmp` 存储临时状态信息。事实上，这种 `/tmp` 的用法给管理员带来了常见的头疼问题，因为用户程序有时会在\
  \ `/tmp` 中存储过多信息并填满根分区。只使用 `/tmp` 存储临时文件是非常重要的，因为该目录在每次系统启动时都会被清空。\n\n## 网络\n\n\
  Linux 网络是一个可以写好几本书的话题，因此我不会尝试记录管理员在网络方面需要的所有知识。相反，我将提供一些在 Ubuntu 下更改网络设置时需要了解的基础信息。\n\
  \n## 网络配置文件\n\nUbuntu 管理网络设置的方式与它的前身 Debian 相同。主要的网络配置文件是 `/etc/network/interfaces`，包含了系统中所有网络设备的配置。如果你来自\
  \ Red Hat 系统，你可能习惯于每个接口在 `/etc/sysconfig/network-scripts` 下都有自己的配置文件，但在 Ubuntu 中，所有这些设置都将包含在这一个文件中。\n\
  \n`/etc/network/interfaces` 的语法可能会变得复杂，如果你通过输入 `man 5 interfaces` 参考其文档就会发现，但对于大多数用途（特别是对于服务器），它是非常简单的。我假设由于这是一台服务器，我们通常只需要关心几个接口：环回接口（loopback）和以太网设备。回环接口被称为\
  \ `lo`，始终具有地址 `127.0.0.1`，当系统程序需要与系统本身建立网络连接时使用；这样它们就不需要浪费时间通过外部网络再路由回来。通常情况下，你不需要担心配置此接口，因为\
  \ Ubuntu 应该会为你完成，但如果你确实需要配置，它看起来是这样的：\n\n```\nauto lo\niface lo inet loopback\n\
  ```\n\n`auto` 行指定 `lo` 接口应在启动时自动启动。`iface` 行定义了 `lo` 接口并创建了它的设置（在此情况下定义 `lo` 为回环设备）。\n\
  \n在 Linux 下，以太网设备通常标记为 `eth` 后跟数字，从 `0` 开始。因此，如果你的服务器有两个以太网端口，它们将被引用为 `eth0` 和 `eth1`。以太网配置取决于是通过\
  \ DHCP 获取地址和设置还是静态分配。如果你的服务器通过 DHCP 获取 `eth0` 的网络设置，那么以下是有效的配置：\n\n```\nauto eth0\n\
  iface eth0 inet dhcp\n```\n\n反，如果网络设置是静态的，这里有一个示例配置：\n\n点击此处查看代码\n\n```\niface eth0\
  \ inet static\n    address 10.1.1.10\n    netmask 255.255.255.0\n    gateway 10.1.1.1\n\
  \    dns-nameservers 10.1.1.2 10.1.1.3\n    dns-search example.com site1.example.com\n\
  ```\n\n这些字段非常直观。第一行定义 `eth0` 为静态接口而非 DHCP 接口。然后设置接口地址（`10.1.1.10`），然后是子网掩码（`255.255.255.0`），最后是网关（`10.1.1.1`）地址——机器访问其他网络使用的路由器\
  \ IP。常规网络设置之后是配置 DNS 的两行。由于最近 Ubuntu 版本增加了 `resolvconf`，只要启用了 `resolvconf`，就可以与其他网络设置一起使用\
  \ DNS 配置。`dns-nameservers` 选项设置作为命名服务器使用的 IP 地址，而 `dns-search` 选项允许你设置 DNS 搜索路径。\n\
  \n\n\n\n\n除了 `/etc/network/interfaces` 之外，还有两个核心网络设置文件。第一个是 `/etc/resolv.conf`，第二个是\
  \ `/etc/hosts`。`/etc/resolv.conf` 文件长期以来被 UNIX 系统用于定义要使用的名称服务器。在 Ubuntu 的最新版本中，即使是\
  \ Ubuntu 服务器安装，该文件也交由 `resolvconf` 程序进行管理。`/etc/resolv.conf` 现在不再是一个静态文件，而是一个指向由\
  \ `resolvconf` 管理的文件的软链接。现在，如果你的服务器通过 `DHCP` 获取设置，该文件将被自动设置；如果你更改了此文件，这些设置将在机器下次获取\
  \ `DHCP` 租约时被覆盖。否则，如果你设置了静态地址，并在初始安装期间为该机器设置了名称服务器，它们将显示在此处。如果你需要更改设置，可以保持启用 `resolvconf`\
  \ 并在如文所述在 `/etc/network/interfaces` 文件中进行更改，也可以禁用 `resolvconf` 以回到经典的 `resolv.conf`\
  \ 行为。要禁用 `resolvconf`，只需删除 `/etc/resolv.conf` 软链接并在其位置创建一个新的 `/etc/resolv.conf`\
  \ 文本文件。`/etc/resolv.conf` 的语法非常简单，如下例所示：\n\n点击此处查看代码图片\n\n```\nsearch example.com\
  \ site1.example.com\n\nnameserver 10.1.1.2\n\nnameserver 10.1.1.3\n```\n\n第一行是可选的，它配置了要使用的\
  \ DNS 搜索路径。这样，如果我想访问 `web.example.com`，我只需要引用 `web`，系统将首先尝试获取 `web.example.com`\
  \ 的地址，然后是 `web.site1.example.com`。接下来的几行定义了要使用的名称服务器的 IP 地址。\n\n在 `DNS` 出现之前，互联网上所有的主机都定义在\
  \ `/etc/hosts` 文件中。当然，现在主机数量太多，无法在 `/etc/hosts` 中列出，但你仍然可以使用 `/etc/hosts` 文件来覆盖或补充\
  \ `DNS`。默认情况下，你会在在此处只配置 `localhost` 和 `loopback` 地址，但如果你想覆盖某个 `DNS` 地址，或者确保系统即使\
  \ `DNS` 宕机也拥有主机的 IP 地址，你可以静态地将地址和名称添加到此文件中。\n\n### 核心网络程序\n\n管理员应该在 Ubuntu 服务器上注意的一些重要网络程序。其中第一个是\
  \ `ifup` 和 `ifdown`。当系统首次启动时，`/etc/init.d/networking` 脚本会读取 `/etc/network/interfaces`\
  \ 并自动启动任何配置为启动加载的接口，但有时你可能想手动关闭或启动接口。`ifup` 和 `ifdown` 脚本分别启动和关闭你作为参数传递的接口，因此，如果我想关闭\
  \ `eth0`，我将输入 `sudo ifdown eth0`。\n\n***\n\n**警告**\n\n在关闭接口时要小心。这不仅可能会中断系统上的任何服务，而且如果你通过\
  \ `SSH` 连接到系统并关闭了系统的主接口，你会被断开连接。\n\n***\n\n另一个重要的网络程序是 `ifconfig`。该命令传统上是你用于配置网络接口的命令，实际上仍然可以这样使用，尽管\
  \ `ifup` 和 `ifdown` 是为了简化过程而创建的。尽管你不再需要手动运行 `ifconfig` 来配置网络，但它仍然是一个获取网络信息的有用工具。当不带任何参数运行时，它将返回系统上所有接口的信息：\n\
  \n点击此处查看代码图片\n\n```\n$ sudo ifconfig\n\neth0      Link encap:Ethernet  HWaddr 00:30:48:2a:fb:b0\n\
  \          inet addr:10.1.1.10  Bcast:10.1.1.255  Mask:255.255.255.0\n         \
  \ inet6 addr: fe80::230:48ff:fe2a:fbb0/64 Scope:Link\n          UP BROADCAST RUNNING\
  \ MULTICAST  MTU:1500  Metric:1\n          RX packets:803 errors:0 dropped:0 overruns:0\
  \ frame:0\n          TX packets:741 errors:0 dropped:0 overruns:0 carrier:0\n  \
  \        collisions:0 txqueuelen:100\n          RX bytes:70230 (68.5 KB)  TX bytes:68449\
  \ (66.8 KB)\n          Base address:0x3000 Memory:fc200000-fc220000\n\nlo      Link\
  \ encap:Local Loopback\n          inet addr:127.0.0.1  Mask:255.0.0.0\n        \
  \  inet6 addr: ::1/128 Scope:Host\n          UP LOOPBACK RUNNING  MTU:16436  Metric:1\n\
  \          RX packets:0 errors:0 dropped:0 overruns:0 frame:0\n          TX packets:0\
  \ errors:0 dropped:0 overruns:0 carrier:0\n          collisions:0 txqueuelen:0\n\
  ```\n\n\n\n\n\n在 Ubuntu 以及其他 GNU/Linux 环境中，软件包是构建、部署和安装软件的主要方式。几乎每一个主要的 GNU/Linux\
  \ 操作系统都以软件包的形式发布软件，包括二进制软件和源码。这些软件包通常是采用 `Rpm` 软件包格式（`RPM`）或 Debian 软件包格式（`DEB`）的二进制软件，亦是相应的“源码”格式\
  \ `RPM` 和 `DEB` 格式。由于 Ubuntu 作为一个持续基于 Debian 工作成果的项目，与 Debian 项目有着紧密的关系，因此自然地使用\
  \ `DEB` 格式的软件包。\n\n简单来说，软件包是从零开始下载、构建和安装软件的替代方案。与标准的“从源码构建”模型相比，它们在安装、删除、监控以及处理软件组件之间的交互方面提供了许多优势。由于打包在\
  \ GNU/Linux 世界之外并不常见——或者至少不是以完全相同的术语进行描述的——因此在描述如何在 Ubuntu 系统上进行这些操作之前，了解一些打包的背景知识是值得的。\n\
  \n### 软件包背景\n\n几乎每一个基于 GNU/Linux 的操作系统——Fedora、RHEL、open-SUSE、Slackware、Debian 等——都包含一组几乎完全重叠的核心软件选择。根据定义，这些每一个操作系统都包含了\
  \ Linus Torvalds 的 Linux 内核，以及大量 GNU 项目中面向开发者和用户的应用程序，这些程序是构建和使用内核所必需。大多数系统还包含了面向服务器的软件，如\
  \ `OpenSSH` 和 `Apache`、X 窗口系统的 `XFree86` 或 `X.Org` 实现，以及通常极其庞大的命令行和图形界面应用程序集合。尽管人们经常随意使用这个术语，但明确这一点很重要：这一软件集合被统称为“发行版”（distribution）。Ubuntu\
  \ 就是一个发行版。当人们将“Linux”指作一种操作系统时，他们通常是指 Linux 或 GNU/Linux 发行版。\n\n所有发行版的主要目标是实现软件的自动安装、配置、删除、维护和更新——这既通过创建此目的的基础来实现，也通过创建现有软件的修改版本来实现。这种通过特殊方式对现有软件进行自定义的行为被称为“打包”（packaging），它构成了\
  \ Ubuntu 开发者所完成的大部分工作。在很大程度上，它构成了 Ubuntu 在包含的软件之外的额外价值。虽然打包主要是像 Ubuntu 这样的发行版制作者的工作，但也可以由发行版用户完成（以便将“未打包”的软件部分整洁地集成到系统中），也可以由软件供应商完成（以便让用户更方便地安装和维护软件）。\n\
  \n### 什么是软件包？\n\n软件包的创建——无论是在 Ubuntu 上还是其他地方——始于需要打包的软件。在大多数（并非所有）情况下，这涉及源码的获取。在所有情况下，它都涉及原始源码，在发行版世界中被称为“上游”（upstream）源码。打包者对代码的首要添加是创建额外的元数据，这些通常包括：\n\
  \n![Image](img/box.jpg) 软件名称\n\n![Image](img/box.jpg) 上游作者名称以及创建软件包的人员\n\n![Image](img/box.jpg)\
  \ 软件许可证\n\n![Image](img/box.jpg) 软件的上游位置（或对获取地点的描述）\n\n![Image](img/box.jpg) 保证软件运行的架构或架构\n\
  \n![Image](img/box.jpg) 用于分类软件的信息，这通常与软件包的使用有关，主要帮助浏览软件包的人\n\n![Image](img/box.jpg)\
  \ 以计算机可解析格式描述的软件说明\n\n![Image](img/box.jpg) 关于软件包在整个 Ubuntu 系统中重要性或“优先级”的信息（例如：必需、可选）\n\
  \n这些信息将由软件包系统或一系列软件包选择工具使用，允许用户搜索、排序、查询或与已安装或可选软件交互——这是软件包系统的工作之一。然而，虽然这类元数据因允许用户找到（并了解）他们的软件而变得重要，但软件包中添加的最重要的元数据组与软件包内软件与发行版内其他软件包软件之间关系的文档有关。虽然语法和语义在不同发行版之间差异很大，但它们包含了与以下的关系：\n\
  \n![Image](img/box.jpg) 软件构建所需的其他软件\n\n![Image](img/box.jpg) 软件安装或配置所需的其他软件\n\n\
  ![Image](img/box.jpg) 软件运行所需的其他软件\n\n![Image](img/box.jpg) 与该软件无法同时安装或使用的其它软件\n\n\
  ![Image](img/box.jpg) 该软件可以作为无缝替换的其它软件\n\n![Image](img/box.jpg) 可以增强或改进该软件的其它软件\n\
  \n现代软件包系统记录了更多信息。例如，配置文件与普通文件不同，在软件升级时不能总是简单地用新版本替换。结果是，打包系统已经包含了几项基础设施，用于查询用户并在跨需要更改配置文件的软件包升级时维护核心配置信息。最后，软件包一个最近实现的目标是提供一个结构，围绕该元数据（如描述）进行翻译，为用户提供本地化到语言、脚本和文化的软件界面。关于在\
  \ Ubuntu 软件包中访问和创建所有元数据的细节将在后续章节介绍。\n\n### 软件包的基本功能\n\n广泛的功能可以被认为是软件包系统的核心功能。这些功能通常由低级工具或工具集实现。在\
  \ Ubuntu 和 Debian 的中，这些脚本是 `dpkg` 及其相关脚本。几年前，这些工具是大多数用户操作软件包的主要方式，但随着为这些工具提供“前台”的高级软件包管理工具的出现，大多数基于软件包系统的用户很少使用它们，尽管对于构建自定义软件包的开发者或系统管理员来说，这些工具仍然非常核心。广义且不完全准确地说，许多此类工具在\
  \ Debian 和 Ubuntu 上被称为 `APT`。\n\n\n\n\n打包的主要目标是实现软件编译的自动化。DEB 格式软件包提供两种格式：一种用于源码包，另一种用于二进制包。这些源码包是源代码分发和编译的极佳系统。在\
  \ Ubuntu 及其他系统中，软件包的设计旨在以非交互方式构建，并且（对于官方 Ubuntu 软件包）可以通过名为“自动构建器（autobuilders）”的自动软件包构建软件在系列不同的架构上自动构建。软件包提供了一种简单（通常只需一个命令）的构建方法，该方法适用于所有软件包。构建配置和选择的问题由打包者提前解决。代价是构建时的可配置性，但正如你将在本书的其他部分看到的，其回报是巨大的。必要的构建时依赖已在软件包中声明，以便自动满足。例如，依赖于架构的源码包（即必须为每个架构重新构建的包）作为源码上传到\
  \ Ubuntu，在大多数情况下，它们可以在不更改源码包的情况下，在 Ubuntu 支持的所有架构上自动构建。\n\n从单个源码包可以创建任意数量的二进制包。从单个源码包创建多个二进制包对于大型项目非常有用，这些项目会发布包含许多不同软件组件的大型或单体源码包——或者即使拆分某些高度相关的软件组件和/或文档是有益的。前一种情况的例子是\
  \ XFree86 窗口系统（现在已被已模块化的 X.Org 代替），它包含在一个源码包中，但会创建几十个二进制包。在这种情况下，打包允许用户独立地从终端模拟器、xlib\
  \ 库包或窗口管理器分发、安装和删除 Xserver。\n\n从前述讨论可以推断出，软件包系统的关键优势之一是它们有助于实现软件安装的自动化。当安装二进制包时：\n\
  \n![Image](img/box.jpg) 可以验证软件的“内容”以确保软件包的完整性。可以使用密码学验证来验证软件的来源。\n\n![Image](img/box.jpg)\
  \ 可以分析软件的依赖关系，并查询系统中正在安装的软件的依赖的软件的安装状态。如果依赖关系未满足，将提示用户缺少所需的软件及其性质，并中止安装。\n\n![Image](img/box.jpg)\
  \ 在安装过程的某个点，可以询问安装软件包的用户关于配置选项。这些查询的答案可以保存在系统中，然后用于被安装软件的配置文件的自定义。\n\n![Image](img/box.jpg)\
  \ 软件包的内容存储在系统中。\n\n![Image](img/box.jpg) 各种形式的元数据和计数信息放在系统数据库中，包括已安装软件包的当前信息及其安装状态（例如，已安装但未配置）、文件列表及其所属软件包以及其他信息。\n\
  \n也许这里最核心的元素是针对正在安装的软件包的依赖与系统中已安装软件包列表进行检查。通过依赖关系信息，用户可以一眼看出运行该包中的软件需要哪些软件。结果是，编写将最终打包软件的人可以轻松地编写针对共享库构建的软件并进行部署。软件包系统的成功是\
  \ GNU/Linux 环境广泛使用动态链接共享库的原因之一。\n\n当用户想要删除某个软件时，软件包系统凭借其属于该软件包的文件目录以及安装期间执行的操作，非常有助于确保干净的卸载。\n\
  \n虽然与安装类似，但软件的自动升级是另一个可以利用软件包系统获得类似有用结果的领域：软件包系统的用户可以安全、方便地从软件的某一个升级到另一个版本。软件的升级工作与安装软件几乎完全相同。在大多数情况下，软件安装在现有软件包之上，不再由软件包提供的文件将被删除。由安装自定义且之后未被用户更改的配置文件可以由用户自动重新生成，或者可以提示用户查看并合并更改。\n\
  \n依赖信息在涉及共享库的软件包升级中起着重要作用。在 ABI 变化的情况下，软件包系统将警告用户，如果不安装新库将无法完成软件包的升级，用户还会被提醒其他将在本次更新中损坏的软件包。结果是，用户可以结构化更新——或者系统可以为他们结构化——使得\
  \ API 和 ABI 破坏不是意料之外的，并且用户可以确保所有依赖于单个共享库的软件包都能同步升级。\n\n最后，在任何时候，用户可以使用软件包上的密码学签名以及该包中包含的文件哈希值列表（通常是\
  \ MD5 和）来验证系统上文件是否损坏或被攻击者篡改。\n\n### 软件包管理系统的高级功能\n\n虽然这些功能带来了管理系统上软件的强大潜力，但*仅*具有这些功能的软件包系统（本质上是\
  \ 20 世纪 90 代中期的打包状态）引入了重要的局限性。大规模的 API 和 ABI 迁移需要下载许多软件包以及用户的高度协调。用户被迫在安装或升级期间弄清楚程序的依赖状态，然后寻找、下载并同时安装新的软件部分。对于具有许多依赖关系的复杂软件，这个过程通常是极其乏味的。\n\
  \n结果，大多数系统升级和 ABI/API 变化都是在发行版发布之间通过大型升级脚本完成的。用户预计通过升级脚本一次安装涉及重大迁移的每个软件包，该脚本将正确构建顺序并妥善处理依赖关系。虽然这些问题是受限软件包系统的局限性，但它们大多数是存在于软件包系统之外的问题。如果没有软件包系统，发生\
  \ API 和 ABI 变化的共享库要么从或很少被处理（会对每个产生危险的致性和安全影响），要么在没有软件包系统提供的警告的情况下面临相同的局限性。\n\n受\
  \ Debian 项目创建名为 `dselect` 的程序以及广受赞誉的高级软件包工具（APT，原名为 *deity*，主要实现在名为 `apt-get` 的程序中）的推动，过去五软件包器的范围和成功取得了重大进化。大多数这些工具都是之前描述的低级软件包管理工具的抽象层或“前端”。与大多数其他基于\
  \ DEB 的发行版一样，Ubuntu 使用 `apt-get`、`Aptitude`、`dselect` 和图形前端 Synaptic。\n\n\n\n\n\
  由于跟踪和记录依赖关系可能是任何包管理系统中最重要的一个方面，因此这些高级工具的主要功能是在现有软件包工具的基础上增加功能类，并以一种一次性处理多个软件包的方式进行操作。这些工具中的每一个工具都包含额外的数据库，不仅描述了已安装的软件包，还描述了通过本地存储的存档、CD\
  \ 或（在如今几乎所有情况下）网络作为安装候选的 `available`（可用）软件包。\n\n这些系统可以自动理出依赖关系和顺序，下载软件包（包括依赖项），首先安装依赖项，然后使用上一节详细介绍的低级工具安装并配置相关的软件包。\n\
  \n同样地，这些相同的高级工具也可以用于卸载软件包。例如，如果用户想要卸载一个共享库，系统会弹出一个屏幕，以软件包列表的形式描述后果，即某些软件包必须被卸载，因为在卸载后，这些软件包的依赖项将不再存在于系统中。涉及依赖关系更改（例如，替换软件包）的升级也可以通过该系统处理。\n\
  \n当软件包的依赖关系随时间发生变化，或者多个软件包可以作为无缝替换时，此类系统的真实潜力就会显现出来。一个需要发送邮件能力的软件包可以仅依赖于其他软件包“提供”的虚拟软件包。新版本的软件包可能会与其他软件包冲突，并声明它们“替换”其他软件包或提供原始软件包的功能。例如，如果多个软件包合并成一个软件包，从而使其他三个软件包过时，高级软件包系统应该能够跟踪不断变化的依赖信息，并在升级期间做出正确决定。沿着这一思路，大多数高级包管理工具赋予了用户根据软件包依赖关系中声明的数据，对系统上的每个软件包进行战略性的“智能升级”到可用的最新版本。\n\
  \n对于某些用户来说，更令人的是，可以跟踪一个开发中的 GNU/Linux 操作系统的版本，并每天升级到所有内容的最新版本。包管理器可以计算出安全的升级路径并从此开始。在这些升级过程中，ABI\
  \ 和 API 版本的变化也可以被自动处理，因为系统会在所有依赖于该共享库的已安装软件包能够同时升级之前，拒绝对该库进行完全升级。系统不需要随着时间的推移保留或跟踪多个版本的共享库。\n\
  \n### Debian 软件包 (Debian Packages)\n\n正如书中提到的，Ubuntu 项目基于 Debian GNU/Linux 发行版。在许多其他技术遗产中，Ubuntu\
  \ 继承了 Debian 软件包系统。事实上，许多早期参与的核心 Ubuntu 开发者会将 Debian 的软件包系统归认为是 Debian 证明自己是一个非常有吸引力的起点、并代表其相对于其他\
  \ GNU/Linux 发行版的主要吸引力的原因。因此，软件包管理的所有几乎所有方面——从格式到工具——在 Ubuntu 和 Debian 上都是相同的。在许多情况下，未修改的\
  \ Debian 软件包可以直接安装在 Ubuntu 上。在几乎所有情况下，未修改的 Debian 源码包都可以在 Ubuntu 上构建。因此，我们的第一步是深入检查一个\
  \ Ubuntu `DEB` 文件，以了解软件包的解剖结构以及它实现前几节描述的功能的方式。\n\n#### 源码包 (Source Packages)\n\n\
  DEB 源码包在通常为三个或两个文件的格式中清晰地表示，但也可能包含由更多文件组成的源码包。这意味着软件包本身包含多个文件，而下载“一个源码包”实际上可能涉及下载一小部分不同的文件。源码包可以大致分类为\
  \ `native`（原生）DEB 软件包或 `nonnative`（非原生）DEB 软件包。原生 DEB 是一份软件，其上游版本和 DEB 软件包之间没有区别。在大多数情况下，原生包特定于\
  \ Ubuntu、Debian 或另一个基于 Debian 的发行版。换句话说，原生包在创建时不需要任何更改。DEB 源码包始终由一个以 gzip 压缩的 GNU\
  \ tar 文件形式存在的“纯净”源码存档和一个 `DSC` 文件组成，该文件将列出软件包的内容并可以被视为源码包的“核心”。我维护的一个名为 `most` 的程序的\
  \ `DSC` 示例所示：\n\n点击此处查看代码图像\n\n```\n-----BEGIN PGP SIGNED MESSAGE-----\n\nHash:\
  \ SHA1\nFormat: 1.0\nSource: most\nBinary: most\nArchitecture: any\nVersion: 5.0.0a-1\n\
  Maintainer: Benjamin Mako Hill <mako@debian.org>\nStandards-Version: 3.7.3\nBuild-Depends:\
  \ debhelper (>= 4), libslang2-dev\nFiles:\n  30f2131b67f61716f6fe1f65205da48b 155233\
  \ most_5.0.0a.orig.tar.gz\n  07e3eb05ad5524fe6d885f5cdc2eb902 20160 most_5.0.0a-1.diff.gz\n\
  -----BEGIN PGP SIGNATURE-----\n\nVersion: GnuPG v1.4.6 (GNU/Linux)\niD8DBQFH4IoAic1LIWB1WeYRAjyOAKCrLCfuZA7b8JcvYTFYeuHrF7r34wCfVTBS\n\
  /jGUfIrELNq173sM9CorZA4=\n=/Cia\n-----END PGP SIGNATURE-----\n```\n\n该文件使用 `GnuPG`（GNU\
  \ 隐私卫 [`GPG]`）或 `PGP`（漂亮隐私）密钥签名，以确保文件的完整性和作者的身份。如果你使用 `GPG` 检查此签名，将看到它是由我的 GPG 密钥签名的。`DSC`\
  \ 文件还包含源码格式版本的信息（在本例中为“旧”格式 1.0）、源码包的名称、软件包的版本（分为上游源码版本和最终后的软件包版本）- 维护者的名称和电子邮件、软件运行的架构、创建软件时遵循的策略版本（标记为“standards”）、构建软件包所需的软件，以及该源码包包含的其他文件列表（通过文件大小和\
  \ MD5 哈希值进行标识）。\n\n在原生 DEB 中，只有一个压缩的 `tar.gz` 文件。在这个非原生包中，将会有额外的代表软件包所有更改的文件。这样可以确保\
  \ DEB 打包员所的所有更改都清晰可见。这也使得软件包维护者在出现错误时很容易理解问题所在。对软件包的更改通常以 gzip 压缩的差异文件表示，该文件表示了软件包源码与纯净源码之间的所有差异。在上一页的案例中，它列为\
  \ `most 5.0.0a-1.diff.gz`。在新版本的 DEB 源码包格式中也允许包含对纯净源码存档添加或更改额外的 tar 文件，只要它们列在 `DSC`\
  \ 文件的文件列表中即可。\n\n\n\n\n当解压并应用所有必要的补丁后，每个 DEB 源码包都会解压到格式为 `packagename-version` 的单一目录中，并包含一个强制性的\
  \ `debian` 子目录。在大多数软件包中，对源码几乎的所有更改都在此目录内进行。该目录包含许多文件——我在这里没有空间全部介绍。其中最重要的文件是 `control`\
  \ 文件和 `rules` 文件。`control` 文件包含了在 `DSC` 文件找到的关于源码包的大部分信息（`DSC` 文件是使用 `control` 文件的数据自动生成的），以及描述每个二进制包的额外信息。`control`\
  \ 文件表达了所有的包间关系，包括 `Depends`、`Conflicts`、`Provides`、`Replaces`、`Recommends`、`Suggests`\
  \ 和 `Enhances`。作为“硬”需求，前四个最重要的。`Suggests` 和 `Enhances` 很少被任何程序使用。该文件还包含单行和多行描述。这里显示了一个示例控制文件（大多数软件包的控制文件）：\n\
  \n点击此处查看代码图像\n\n```\nSource: most\nSection: text\nPriority: optional\nMaintainer:\
  \ Benjamin Mako Hill <mako@debian.org>\nStandards-Version: 3.7.3\nBuild-Depends:\
  \ debhelper (>=4), libslang2-dev\nPackage: most\nArchitecture: any\nDepends: ${shlibs:Depends}\n\
  Description: Pager program similar to more and less\n```\n\n长格式描述已从输出中删除，但实际上跟在最后的描述行之后，并包含缩进了一个空格的文本，段落之间用单个“`.”隔开。如前所述，`control`\
  \ 文件由一系列段（stanzas）组成。第一个段始终以 `Source:` 开头，并包含有关源码包的信息。随后的每个段将描述一个二进制包。在这种情况下，只有一个二进制包，它和源码包一样，命名为\
  \ `most`。这种情况——一个单一源码包创建一个同名的单一二进制包——是非常常见的情况。\n\n`rules` 文件是一个 GNU Make Makefile，包含了创建和构建包的所有\
  \ Makefile 规则。在解压后的源码包目录内运行 `debian/rules` 二进制文件，如果你的系统安装了所有必要的依赖项，则会在上一级目录（`../`）中创建一个\
  \ Debian 包。大多数情况下，软件将构建并“安装”到 `debian` 目录下的系列子目录中；这些位于临时位置的文件将被包含作为包的内容。\n\n`debian`\
  \ 目录中的其他文件包括 `copyright` 文件、软件包的 `changelog`、在安装或删除包前后运行的可选脚本，以及额外的配置数据以及打包者想要包含任何其他内容。\n\
  \n### 二进制包\n\nDebian 二进制包的格式非常简单，因此没有必要在这里花大量时间研究它们。更重要的是，它们几乎不会手动操作。二进制包仅被安装和删除。二进制包的更改首先在源码包中进行，然后重建新的、更改过的二进制包。在\
  \ Ubuntu 和 Debian 中，二进制包是 `ar` 格式存档中的单个文件。存档中有 `debian-binary`，它包含了一系列用换行符分隔的行。目前，仅包含格式版本号。存档的第二个成员名为\
  \ `control.tar.gz`，它包含了包控制信息（如前所述）。第三也是最后一个成员称为 `data.tar.gz`，它包含了作为 gzipped tar\
  \ 存档的文件系统存档。\n\n### Ubuntu 中的包管理\n\n每个 Ubuntu 安装（无论是服务器还是桌面版）的管理员必须学习包管理的基本机制。由于管理员需要寻找新软件来解决特定问题，软件包系统中的元数据是一个极好的起点。当管理员想要安装新软件时，软件包系统提供了最佳实现方法。Ubuntu\
  \ 包系统还允许用户安装和删除软件、检查更新——特别是安全更新——并安装这些更新。最后，当 Ubuntu 发布新版本时，软件包系统将允许管理员更新他们的系统。\n\
  \nUbuntu 提供了多种不同的包管理工具。在桌面 Ubuntu 系统上，用户与包管理系统的交互主要通过桌面上的一个小图标进行（该图标提醒他们软件的新发布），并通过图形化的“添加/删除程序”应用程序以及第二个名为\
  \ `Synaptic` 的图形化包管理程序，后者提供了让用户浏览包存档的功能。由于这些程序在《Ubuntu 官方书》（*The Official Ubuntu\
  \ Book*, ISBN: 0133017605）中已有深入介绍，而且由于本书的重点是服务器，因此本节侧重于用于浏览和管理的命令行工具。\n\n大多数服务器管理员主要使用\
  \ `APT` 家族的工具来处理高层包管理。最初为此目的开发的工具是 `apt-get`。`aptitude` 是 `apt-get` 的一个常用替代方案，它提供了交互式前端，并涵盖了大多数默认的\
  \ `apt-get` 命令。本章其余部分描述的许多调用 `aptitude` 的命令也可以用 `apt-get` 使用，在输出或行为上几乎没有或完全没有差异。主要区别在于系统解决复杂依赖关系的方式，这显然不会影响这里描述的相对简单的操作。\n\
  \n#### 保持更新\n\n每个 Ubuntu 系统在 `/etc/apt/sources.list` 中存储一个包存储源列表。这描述了“位置”列表，你的包管理器（最初只是\
  \ APT，现在是其他几个工具）将从那里寻找软件的更新版本。这些源可能包括本地文件系统、计算机中的 CD，或者（在绝大多数情况下）网络位置。要更新系统的包列表，你可以运行\
  \ `apt-get update` 或 `aptitude update`。\n\n该命令下载 `/etc/apt/sources.list` 中列出的所有仓库的最新更新列表，并根据存储在机器上的密钥对这些更新进行签名检查。对于新系统，它只检查你安装的\
  \ Ubuntu 软件包仓库和安全仓库。\n\n安装任何新版本的软件包只需运行 `aptitude safe-upgrade`，它是更老练的用户可能熟悉的 `apt-get\
  \ upgrade` 命令的替代方案。`safe-upgrade` 尝试将所有已安装的包升级到最新版本。除非包未使用，否则不会删除已安装的包，但也为了解决可能会可能会额外的软件包。\n\
  \nAPT 可以配置为自动下载并升级新版本的软件包。对于那些希望不需要登录系统即可保持更新的管理员来说，这是一个非常有吸引力的建议。然而，由于系统中特定的软件状态或特定的配置更改，自动包升级可能会出错，因此这些自动升级可能会导致系统处于不稳定或无法运行的状态。因此，本书未涵盖自动升级，作者也不推荐这样做。\n\
  \n#### 搜索与浏览\n\n历史上，搜索新包的主要方法是使用 `dselect` 程序。桌面版 Ubuntu 用户将主要使用“添加/删除程序”应用程序和图形化程序\
  \ `Synaptic`。控制台用户还有其他选择。\n\n\n\n\n\n其中第一个是简单的程序 `apt-cache`，它可以提供有关软件包的统计数据和信息。例如，如果我决定想要一个像\
  \ `less` 这样的分页器，可以通过以下方式进行搜索：\n\n点击此处查看代码图片\n\n```\n$ apt-cache search pager less\n\
  ```\n\n- `less` - 类似于 `more` 的分页器程序\n- `wdiff` - 逐字比较两个文件\n- `console-log` - 在虚拟控制台上放置日志文件分页器\n\
  - `gdesklets-data` - 用于 gdesklets 的小组件\n- `jless` - 一个文件分页程序，类似于 `more(1)` 并支持 ISO2022\n\
  - `most` - 类似于 `more` 和 `less` 的分页程序\n- `nagios-plugins-basic` - 用于 nagios 网络监控和管理系统的插件\n\
  \n从前面的列表中可以看出，`apt-cache search` 命令针对我对两个关键词 `pager` 和 `less` 的搜索返回了 8 个“匹配结果”，并返回了一个软件包名列表，以及随后的简短单行描述。关键词搜索遍历了所有可用软件包的完整列表，并关注了软件包名、简短描述以及返回列表中未显示的完整描述。如果我想了解更多关于软件包的信息，`apt-cache`\
  \ 还可以通过 `show` 子命令如下面的示例显示更多关于软件包的信息：\n\n点击此处查看代码图片\n\n```\n$ apt-cache show most\n\
  ```\n\nPackage: most\nPriority: optional\nSection: universe/text\nInstalled-Size:\
  \ 172\nMaintainer: Ubuntu MOTU Developers <ubuntu-motu@lists.ubuntu.com>\nOriginal-Maintainer:\
  \ Benjamin Mako Hill <mako@debian.org>\nArchitecture: i386\nVersion: 5.0.0a-1\n\
  Depends: libc6 (>= 2.7), libslang2 (>= 2.0.7-1)\nFilename: pool/universe/m/most/most_5.0.0a-1_i386.deb\n\
  Size: 48092\nMD5sum: e089c00005b536e1b8848b7087df2bae\nSHA1: 4f4ab395f340be4804732452aa112007916f90cb\n\
  SHA256: ccf50fb49270e7ddf7735da23e699afcd11dcfc8e241973bb17ad03bf49e6f4a\nDescription:\
  \ Pager program similar to more and less.\nMost 是一个分页程序，它可以在终端上一次显示一个窗口大小的文件内容。屏幕底部的状态行显示文件名、当前行号以及目前已显示的文件的百分比。\n\
  \n与其他分页程序不同，most 能够显示任意数量的窗口，只要它们都能适应屏幕，并且可以使用不同的窗口在不同的位置查看同一个文件。\n\n除了显示普通的文本文件外，most\
  \ 还可以显示二进制文件以及带有任意 ascii 字符的文件。\nBugs: mailto:ubuntu-users@lists.ubuntu.com\nOrigin:\
  \ Ubuntu\n\n你可能会发现，这些信息中很大一部分看起来像是源包信息，以及之前描述的控制文件中引用该二进制软件包的相应段（stanza）。事实然，这正是这些元数据被提取的地方。\n\
  \n当然，输出的大部分是由上一个示例中省略的长描述组成的。还有其他一些可能感兴趣的字段，包括“Original-Maintainer”（原始维护者，即在 Debian\
  \ 中打包系统的人）、“Maintainer”（维护者，即就软件包的问题或问题联系的人或组），以及尺寸和哈希（例如 `MD5Sum`、`SHA1` 和 `SHA256`），它们描述了如何识别特定版本的软件包已正确下载且未被修改。\n\
  \n在不带任何参数调用时，`Aptitude` 还可以为用户提供基于 Curses 的文本界面，允许对所有可用软件包进行更具交互性的浏览。对于熟悉 `Synaptic`\
  \ 的用户，这可以被认为是 `Synaptic` 界面的文本版本。在这种模式下，可以通过方向键导航许多搜索结果，并对不同的应用程序进行“标记”安装。\n\n在结束对搜索和浏览软件包的选项之旅之前，值得提到\
  \ [`packages.ubuntu.com`](http://packages.ubuntu.com) 网站。该界面允许用户以类似于我在此处展示的一些工具的方式进行搜索，但带有几个额外的实用选项。特别是，该网站允许用户搜索\
  \ Ubuntu 中*任何*软件包中的特定文件。通常情况下，用户只有在系统中安装了某个软件包时才能发现哪个软件包“拥有”该文件。例如，如果你需要某个特定的头文件或共享库，且只知道文件名，你可以在网站上搜索\
  \ Ubuntu 存档中所有可用软件包的该。\n\n### 安装与卸载\n\n安装和卸载软件包是另一项你经常执行的简单任务。要安装软件包，你可以类似地调用 `apt-get`\
  \ 或 `Aptitude`，尽管与搜索不同，用户必须以 root 身份运行。\n\n如果我想安装 `most`，只需运行以下命令：\n\n点击此处查看代码图片\n\
  \n```\n# aptitude install most\n```\n\nReading package lists... Done\nBuilding dependency\
  \ tree\nReading state information... Done\nInitializing package states... Done\n\
  Writing extended information... Done\nThe following NEW packages will be installed:\n\
  slang2{a} most\n0 packages upgraded, 2 newly installed, 0 to remove\nNeed to get\
  \ 0B/509kB of archives. After unpacking 1323kB will be used.\nDo you want to continue?\
  \ [Y/n]? y\nWriting extended information... Done\nSelecting previously selected\
  \ package libang2.\n(Reading database ... 362131 files and directories currently\
  \ installed.)\nUnpacking libang2 (from .../libang2_2.1.3-3ubuntu1_i386.deb) ...\n\
  Setting up libang2 (2.1.3-3ubuntu1) ...\nSelecting previously selected package most.\n\
  (Reading database ... 362143 files and directories currently installed.)\nUnpacking\
  \ most (from .../most_5.0.0a-1_i386.deb) ...\nProcessing triggers for man-db ...\n\
  Setting up most (5.0.0a-1) ...\n\n从前面的命令输出可以看出， 함께 most 还安装了 `libang2`。在这种情况下，Aptitude\
  \ 发现 `most` 需要 S-Lang 库但该库尚未安装。Aptitude 提示你确认安装额外的软件包（我批准了），下载了两个软件包，然后在我的系统中安装并配置了它们。\n\
  \n卸载软件包同样简单。如果我决定移除 `most`，可以通过运行来实现：\n\n```\n# aptitude remove most\n```\n\n在这种情况下，`libslang2`\
  \ 不会被卸载（因为我没有要求卸载它）。如果我反而尝试卸载 `libslang2`，Aptitude 将提示你并解释卸载 `libslang2` 也需要卸载所有依赖于它的软件包——在当前系统中，将是\
  \ `most`，但对于其他软件包或其他系统，可能会有很多软件包。这种依赖关系管理意味着，例如，用户不应该（也无法）移除核心或基础软件包。可以使用 `apt-get\
  \ autoremove` 命令删除额外的的“未使用”软件包。\n\n\n\n\n最后，虽然这些示例都使用了 Aptitude，但软件包的安装和卸载也可以通过低级工具\
  \ `dpkg` 完成。事实上，在在这两种情况下，Aptitude 只是在后台对已下载的包文件调用了 `dpkg`。Aptitude——或者 `apt-get`——在转向\
  \ `dpkg` 之前，总是会下载软件包并处理依赖关系。如果你已经安装了现有的依赖项，可以使用 `-i` 命令并将包文件名作为参数，用 `dpkg` 直接安装\
  \ DEB 包。例如，如果我收到一个 `most` 的 DEB 文件，我可以使用这样的命令来安装它：\n\n```bash\n$ dpkg -i most_5.0.0a-1_i386.deb\n\
  ```\n\n`dpkg` 会检查依赖项，如果缺少依赖项则会产生错误，但不会自动下载或安装软件包，因为它不具备这些功能。我可以使用 `dpkg -r most`\
  \ 命令通过 `dpkg` 卸载 `most`。\n\n### 操作已安装的软件包\n\n`dpkg` 提供了数十种查询、搜索和操作已安装的方法。它包含一个关于系统上已安装软件包信息的数据库。为了快速概览这可能的样子，你可以运行以下命令：\n\
  \n点击此处查看代码图像\n\n```bash\n$ dpkg -l most\n```\n\nDesired=Unknown/Install/Remove/Purge/Hold\n\
  | Status=Not/Inst/Cfg-files/Unpacked/Failed-cfg/Half-inst/ trig-aWait/Trig-pend\n\
  |/ Err?=(none)/Hold/Reinst-required/X=both-problems (Status,Err: uppercase=bad)\n\
