  \ 10.1.2.99;\n    next-server 10.1.1.5;\n    filename \"/mysql/pxelinux.0\";\n}\n\
  ```\n\n请注意，两个子网的 `next-server` 部分保持一致，因为我仍然在使用同一个 TFTP 服务器。我同样假设这台单一的 DHCP 服务器为这两个子网提供租约服务。在这样的安装环境中，我只需通过控制服务器所属的子网，就可以控制在服务器上安装的内容。根据你的环境，这可能简单到更改交换机上的一个设置。\n\
  \n# 第 5 章 常用 Ubuntu 服务器指南\n\n虽然 Linux 长期以来一直被用桌面操作系统，但可以说，它作为服务器的使用时间更长，使用人数也多得多。多年来，Linux\
  \ 积累了数百种不同的服务，这些服务要么是从其他操作系统移植过来的，要么主要是在 Linux 上开发的。这意味着当你想要将 Ubuntu 作为服务器时，Ubuntu\
  \ 实际上可以变成几百种不同的服务器，其中许多可以通过简单地调用包管理器来安装。\n\n要在书中（更不用说章节了）记录 Ubuntu 所有可能的服务是极其困难的，甚至是不可能的。但我意识到，在你可能安装的数百种服务中，有少数大多数管理员每天处理的常用服务。本章涵盖了管理员可能会遇到的一些常见的\
  \ Ubuntu 服务器类型。如果你是一个新手管理员，我将为你提供一份分步指南，帮助你设置可能的第一个 DNS 服务器，并提供一些常用的配置方案和最佳实践。如果你是高级管理员，请将本章视为\
  \ Ubuntu 服务器方法的指南。我将向你展示 Ubuntu 如何组织配置文件，以及它为特定服务提供的任何工具或快捷方式。我还涵盖了主要的目录位置，这样你就能确切知道去哪里查找核心配置文件、哪些初始化脚本是重要的，以及日志存储在哪里。\n\
  \n已经有整本书专门讨论了如何管理这里讨论的几乎每种服务。例如，我并没有尝试记录所有主要的 Apache 模块，也没有讨论 BIND 或 Postfix 的每一个配置选项。我提供的是一个良好的起点，以及可以运行的示例配置文件。系统管理员总是很忙的，因此在\
  \ Ubuntu 提供节省时间的快捷方式之处，我会指出它们。毕竟，你只需要反复用那种困难的、“老派的”、耗时的方法去做某件事，直到它失去它的神秘感为止。\n\n\
  ## DNS 服务器\n\n我讨论的第一项服务恰好是最老的服务之一。DNS，即域名系统（Domain Name System），是维持运行的基础服务之一。简而言之，DNS\
  \ 是在其他功能之外，将主机名（例如 [www.ubuntu.com](http://www.ubuntu.com)）转换为 IP 地址（如 91.189.94.8）的服务。DNS\
  \ 服务器维护着一个对其具有权威性的名称和 IP 地址的本地目录，因此，如果你向 DNS 服务器查询它拥有权威性的名称的 IP 地址，它通常会返回答案。许多 DNS\
  \ 服务器还可以处理递归请求。通过递归查询，DNS 服务器本身可能不包含你正在寻找的记录，但它可以到互联网上为你寻找答案。\n\nUbuntu 上有许多提供 DNS\
  \ 服务的程序，但最常见的也是存在时间最长的——BIND。BIND 是 Berkeley Internet Name Domain（伯克利互联网域名）的缩写，它有许多高级功能，但许多功能也意味着更复杂的配置文件。老实说，最让大多数管理员感到困惑的仅仅是从零开始构建一个\
  \ BIND 服务器，但正如你所看到的，在 Ubuntu 下，大部分苦力工作已经为你完成了。\n\n### 安装 BIND\n\n在 Ubuntu 下安装 BIND\
  \ 有几种方法。在初始的 Ubuntu 安装期间，你可以从服务器类型列表中选择 DNS Server。如果你已经安装了 Ubuntu，可以输入 `sudo tasksel`\
  \ 进入相同的菜单。一旦你选择 DNS Server 并点击 OK，`bind9` 和 `bind9-doc` 包将自动为你下载并安装。或者，你也可以直接运行\n\
  \n```bash\nsudo apt-get install bind9 bind9-doc\n```\n\n你将发现（这也是我将在后续详细介绍的），一旦安装了\
  \ Ubuntu 的 BIND 包，你实际上将拥有一个完全配置并运行良好的名称服务器，至少可以作为递归查询的缓存名称服务器使用。示例配置文件、根区域文件、本地区域，甚至\
  \ `rndc` 密钥已经为你配置好了。\n\n### Ubuntu 规范\n\nUbuntu 的 BIND 使用了一些关键的文件命名规范，根据你使用过的其他\
  \ Linux 发行版，这些可能与你习惯的不同。以下是 Ubuntu 的一些关键位置：\n\n#### /etc/bind/\n此目录包含主配置文件 `named.conf`\
  \ 以及任何单独的区域文件。任何新的主区域文件也应该存储在此目录下，或者如果你有许多区域文件想要组织，可以存储在 `/etc/bind` 下的子目录中。\n\n\
  #### /etc/bind/named.conf\n这是 BIND 的主配置文件，你在此处更改 BIND 的选项和行为。所有 BIND 的单独区域文件（包含名称和\
  \ IP 信息的文件）都会在 `/etc/bind/named.conf.local` 中被引用。BIND 中启用的主要选项包含在一个名为 `/etc/bind/named.conf.options`\
  \ 的独立文件中。\n\n#### /etc/bind/db.*\n按照惯，所有区域文件都以 `db.` 开头，然后是用于标识特定区域的名称或数字。当区域包含传统的\
  \ DNS 记录（名称映射到 IP）时通常使用名称，而反向 DNS 记录（IP 映射回名称）时通常使用数字。例如，Ubuntu 的 BIND 默认会包含几个区域文件，如\
  \ `db.root`（关于互联网根名称服务器的信息）、`db.local`（localhost 区域信息）和 `db.127`（localhost 的反向 DNS\
  \ 记录）。\n\n#### /var/cache/bind\n这是 BIND 的工作目录，它将在此存储从区域文件。如果你的服务器将作为特定区域的从服务器，配置将其存储在此处。\n\
  \n#### /etc/init.d/bind9\n这是 BIND 的初始化脚本。一旦你安装了 `bind9` 包，它将自动设置为系统启动时启动，但你可以通过\
  \ `/etc/init.d/bind9` 手动运行初始化脚本，或者运行 `sudo service bind9`。\n\n#### /var/log/syslog\n\
  这是 BIND 的默认日志文件。许多不同的服务都会记录到此文件中，但 BIND 的日志条目以关键字 `named` 为前缀，因此如果你只想查看 BIND 的日志条目，可以运行\
  \ `sudo grep named /var/log/syslog`。\n\n#### 缓存名称服务器\n\n\n\n\n默认的 Ubuntu BIND 配置开箱即用，作为一个缓存名称服务器（caching\
  \ name server）。本质上，缓存名称服务器充当 DNS 查询的中间人。一旦你配置某些主机指向缓存名称服务器，当其中一个主机请求特定记录时，缓存名称服务器会连接互联网检索该记录并将其存储在本地。如果第二个主机请求相同的记录，且该记录在缓存中尚未过期，缓存名称服务器将直接返回缓存结果。这可以显著提高主机主网络的响应时间，特别是对于\
  \ Web 浏览，因为通常多个主机会请求相同的记录（例如，`www.google.com`）。\n\n## DNS 主服务器 (DNS Master) \n\n\
  缓存名称服务器非常有用，但当大多数人安装 BIND 时，他们的意图是托管一些属于自己的区域传输文件（zone files）。当一个名称服务器在本地托管区域文件且不需要从任何其他源检索它们时，它被称为主服务器（master）。当你想要向\
  \ DNS 服务器添加区域时，基本上有三个步骤：创建一个区域文件，在 `named.conf.local` 中添加对该区域文件的引用，并告诉 BIND 重新加载配置。\n\
  \n在我的示例中，假设我的网络内部有一个 IP 为 `192.168.0.5` 的名称服务器，并且注册了 `example.net`。我希望这个名称服务器拥有以下记录：\n\
  \n![Image](img/box.jpg) `ns1.example.net` 指向 `192.168.0.5`（名称服务器本身）。\n\n![Image](img/box.jpg)\
  \ `example.net` 也指向 `192.168.0.7`。\n\n![Image](img/box.jpg) `www.example.net` 指向\
  \ `192.168.0.7`。\n\n![Image](img/box.jpg) `gateway.example.net` 指向 `192.168.0.1`。\n\
  \n创建新区域文件的简单方法是复制一个已有的文件并进行修改。在这种情况下，最好的候选文件是 `/etc/bind/db.local`，因此我将其复制到 `/etc/bind/db.example.net`：\n\
  \n点击此处查看代码图片\n\n```\n$ sudo cp /etc/bind/db.local /etc/bind/db.example.net\n```\n\
  \n当我用文本编辑器打开 `db.example.net` 时，我将看到以下配置：\n\n点击此处查看代码图片\n\n```\n;\n\n; 用于本地回环接口的\
  \ BIND 数据文件\n\n;\n\n$TTL   604800\n@   IN    SOA    localhost. root.localhost. (\n\
  \n                   2         ; Serial\n               604800        ; Refresh\n\
  \                   86400        ; Retry\n               2419200        ; Expire\n\
  \               604800 )      ; Negative Cache TTL\n;\n\n@   IN    NS    localhost.\n\
  @   IN      A     127.0.0.1\n@   IN      AAAA  ::1\n```\n\n由于这并打算作为一份 BIND 的完整指南，我不会详细介绍该文件中的每一个选项，但默认情况下，它配置的\
  \ TTL（生存时间，即名称服务器在请求记录后认为该记录过期之前的时间）为 604,800 秒，即七天。接下来，它列出 `localhost` 为 SOA（起始起点，应被视为信息最佳来源的服务器），`root@localhost`\
  \ 是用于该主机的联系电子邮件地址（由 `root.localhost` 引用）。在文件下方，文件列出 `localhost` 作为该区域的名称服务器并带有 `NS`\
  \ 记录，然后将 `localhost` 的 IP 地址设置为 `127.0.0.1`，甚至通过 `AAAA` 记录为 `localhost` 添加了 IPv6\
  \ 地址。\n\n然后我修改了这些记录以符合我之前设的要求，以下是生成的区域文件：\n\n点击此处查看代码图片\n\n```\n;\n\n; 用于 example.net\
  \ 的 BIND 数据文件\n;\n\n$TTL   1d\n@   IN    SOA    ns1.example.net. root.example.net.\
  \ (\n\n                   2         ; Serial\n               604800        ; Refresh\n\
  \                   86400        ; Retry\n               2419200        ; Expire\n\
  \               604800 )      ; Negative Cache TTL\n;\n\n@   IN    NS    ns1.example.net.\n\
  @   IN      A     192.168.0.6\nns1  IN      A     192.168.0.5\nwww  IN      A  \
  \   192.168.0.7\ngateway  IN      A     192.168.0.1\n```\n\n在这个区域文件中有很多需要注意的地方。首先，我将\
  \ TTL 从七天改为了一天。虽然可以用秒为单位指定它，但 BIND 支持简写，因此我可以使用 `1d` 表示一天，或用 `4h` 表示四小时。我将 `ns1.example.net`\
  \ 设置为 SOA，并将 `root@example.net` 设置为联系电子邮件地址。我还将将 `ns1.example.net` 设置为用于该区域的名称服务器，注意\
  \ `NS` 记录引用了该主机名。由于该名称服务器位于 `example.net` 域名下，我需要在这里为它添加一个 IP 地址。\n\n### 注意：区域文件权限\n\
  \n在保存区域文件时，请确保它的权限与目录中的其他区域文件相同——这是在以后重新加载 BIND 时避免麻烦的最佳方法。\n\n现在我已经创建了区域文件，需要在\
  \ `named.conf.local` 中为它添加引用。该文件初始没有任何示例，但如果你打开 `/etc/bind/named.conf.default`，你可以看到许多类似的示例，例如\
  \ `db.local` 文件：\n\n```\nzone \"localhost\" {\n   type master;\n   file \"/etc/bind/db.local\"\
  ;\n};\n```\n\n在 `named.conf.local` 的底部添加类似的条目：\n\n点击此处查看代码图片\n\n```\nzone \"example.net\"\
  \ {\n   type master;\n   file \"/etc/bind/db.example.net\";\n};\n```\n\n保存更改后，我只需要告诉\
  \ BIND 重新加载配置，然后就可以查询名称服务器其中一个新记录了：\n\n点击此处查看代码图片\n\n```\n$ sudo service bind9 reload\n\
  * Reloading domain name server... bind      [OK]\n\n$ nslookup www.example.net localhost\n\
  Server:      localhost\nAddress:     127.0.0.1#53\nName:        www.example.net\n\
  Address:     192.168.0.7\n```\n\n如果 BIND 重新加载失败，它会在命令行显示。如果命令行输出没有告诉你 BIND 拒绝重新加载的原因，你可以查看\
  \ `/var/log/syslog` 来寻找线索。\n\n## DNS 从服务器 (DNS Slave)\n\nDNS 从服务器从另一个 DNS 服务器（称为其主服务器）检索其区域信息。事实上，一个\
  \ BIND 服务器可以作为一个区域的主服务器，同时作为另一个区域的从服务器。拥有一个主服务器和多个从服务器极大简化了 DNS 管理，因为你只需要在主服务器上更新区域信息，它会自动同步到从服务器。只要主服务器配置为允许从从服务器进行区域传输，你只需要在\
  \ `/etc/bind/named.local` 中添加条目即可。对于我们的示例，假设我想添加一个 IP 为 `192.168.0.10` 的名称服务器 `ns2.example.net`。\n\
  \n\n\n\n\n点击此处查看代码图片\n\n```\nzone \"example.net\" {\n    type master;\n    file\
  \ \"/etc/bind/db.example.net\";\n    allow-transfer { 192.168.0.10; };\n};\n```\n\
  \n### 配置从服务器\n\n在从服务器上，我通过 `tasksel` 或 `apt-get` 安装了 `bind9` 软件包，然后我需要做的就是在 `/etc/bind/named.conf.local`\
  \ 的底部为 `example.net` 添加一个从条目：\n\n点击此处查看代码图片\n\n```\nzone \"example.net\" {\n   \
  \ type slave;\n    file \"/var/cache/bind/db.example.net\";\n    masters { 192.168.0.5;\
  \ };\n};\n```\n\n使用 `sudo service bind9 reload` 重新加载 BIND。一旦 BIND 重载完成，它将立即尝试从 `192.168.0.5`\
  \ 对 `example.net` 进行区域传输。当区域传输完成后，如果我检查 `/var/cache/bind/` 目录，我会发现 `db.example.net`\
  \ 区域文件已在那里创建。现在，下次当我想修改 `db.example.net` 时，只需要更改主服务器上的文件，更新序列号，然后在主服务器上重新加载 BIND。从服务器会自动获取更新。\n\
  \n#### 使用 rndc 管理 BIND\n\n到目前为止，我一直使用 `bind9` 初始化脚本来重新加载 BIND。Ubuntu 还包含了另一个名为 `rndc`\
  \ 的工具，它可以帮助你进行 BIND 管理。例如，要使用 `rndc` 重新加载 BIND 配置，我会输入：\n\n```\n$ sudo rndc reload\n\
  ```\n\n你可以向 `rndc` 传递许多其他参数以获取有关 BIND 服务的更多信息或向其提交命令。`rndc` 命令的一个实用用点是，如果你希望管理员能够更新\
  \ DNS 但不需要拥有完全 root 权限，你可以赋予该人员对 `rndc` 命令的 `sudo` 权限。如果你不带任何参数输入 `rndc`，将得到一个列出可用命令的帮助页面。以下是其中一些有趣的命令：\n\
  \n![Image](img/box.jpg) `reload`——重新加载所有配置文件和区域。如果你在 `reload` 命令后指定一个特定区域，它将只重新加载该区域。\n\
  \n![Image](img/box.jpg) `retransfer zone`——无论序列号是否增加，都重新传输区域。\n\n![Image](img/box.jpg)\
  \ `reconfig`——类似于 `reload` 命令，但它只重新加载 `named.conf` 和任何新区域。\n\n![Image](img/box.jpg)\
  \ `flush`——刷新服务器的所有缓存。这对于缓存名称服务器非常有用，特别是当它正持有一个不再有效的过时 IP 地址时。\n\n![Image](img/box.jpg)\
  \ `status`——输出有关 BIND 进程当前状态的一些统计信息，包括它正在管理的区域数量以及其当前工作负载的一些统计数据。\n\n如果你想了解更多关于\
  \ BIND 配置语法或通用 DNS 管理的信息，有大量的资源可用。`bind9-doc` 软件包在 `/usr/share/doc/bind9-doc/` 下包含系列文档文件，这是一个极佳的起点。例如，要查看\
  \ BIND 版本 9 HTML 手册的第一章，输入 `w3m /usr/share/doc/bind9-doc/arm/Bv9ARM.ch01.html`。\n\
  \n## Web 服务器\n\nLAMP 是 Linux Apache MySQL PHP（有时是 Perl 或 Python）的缩写。它指的是一种共识：一种非常常见的\
  \ Web 服务器部署方案是使用 Apache Web 服务器程序（使用 Perl、PHP 或 Python 处理动态内容）以及后端的 MySQL 数据库，全部运行在\
  \ Linux 上。它已成为在 Linux 下搭建网站的一种如此常见的方式，以至于 Ubuntu 甚至将所有必要的软件包分在了一起。\n\n事实上，有许多不同的\
  \ LAMP 环境方法。对于高流量 Web 网站，Web 服务器通常运行在与 MySQL 数据库服务器不同的硬件上。即使你在安装时选择了 LAMP 服务器选项，可能仍需要安装额外的\
  \ Apache 模块或其他软件。我将会在本章的“数据库服务器”部分中介绍 MySQL 服务器，因此如果你计划在单台服务器上运行完整的 LAMP 环境，请务必也查看该部分。\n\
  \n#### 安装 Web 服务器\n\n在默认的 Ubuntu 服务器安装上设置 Web 服务器有几种不同的方法。最简单的方法是在初始安装期间或之后使用 `tasksel`\
  \ 工具选择 LAMP 服务器。这将添加 `apache2`、`apache2-mpm-prefork`、`mysql-server-5.5`、`mysql-client-5.5`\
  \ 和 `php5-mysql` 软件包以及它们所有的库和其他依赖项。或者，你也可以从命令行安装这些每个软件包：\n\n点击此处查看代码图片\n\n```\n\
  $ sudo apt-get install apache2 apache2-mpm-prefork \\\nmysql-server-5.5 mysql-client-5.5\
  \ php5-mysql\n```\n\n无论在何种情况下，软件包管理器都会在安装期间提示输入 MySQL 的 root 密码。这是一个可选步骤，但 Ubuntu\
  \ 已将所有必要的软件包分在了一起。\n\n### Ubuntu Apache\n\n与大多数发行版一样，Ubuntu 在 Apache 方面有某些约定。配置文件以特定方式组织，管理工具和日志也是如此。如果你习惯\
  \ Ubuntu 组织 Apache 的方式，它与其他你在发行版上看到的不同。以下是主要的目录约定：\n\n![Image](img/box.jpg) `/etc/apache2`\n\
  \n所有的 Apache 配置文件都可以在此目录下找到。传统上，Apache 通过一个巨大的 httpd.conf 文件进行配置，其中包含大量的选项、设置和不同的虚拟主机。当然，如果你只是启动这里的\
  \ httpd.conf 文件，你会发现它是空的。Ubuntu 已经抛弃了单式的 httpd.conf 模型，将其配置拆分到多个文件和子目录中。\n\n![Image](img/box.jpg)\
  \ `/etc/apache2/apache2.conf`\n\n这是 Ubuntu 的 `apache2` 二进制文件使用的主 Apache 配置。默认的 apache2.conf\
  \ 有大量的注释，因此可以作为每个配置选项及其作用的指南。\n\n![Image](img/box.jpg) `/etc/apache2/envvars`\n\n\
  在 Apache 启动时，不同脚本使用了许多环境变量来定义如 PID 文件位置之类的设置。这些环境变量在这里定义。\n\n![Image](img/box.jpg)\
  \ `/etc/apache2/ports.conf`\n\n此文件用于定义 Apache 在启动时监听哪些端口。默认设置让它监听标准端口 80，以及如果启用了\
  \ SSL 模块则额外监听 443 端口。\n\n![Image](img/box.jpg) `/etc/apache2/conf.d/`\n\n此目录在主 apache2.conf\
  \ 文件中列为包含目录，这意味着当 Apache 启动时，它还将包含此目录中的任何配置文件并添加到总配置中。某些管理员（例如你）过去曾使用此目录来存储所有的虚拟主机，每个主机单独放在一个文件中，但\
  \ Ubuntu 现在有一个更好的解决方案，在章的稍后部分提到。该目录不再包含虚拟主机条目，而是用于管理员（或软件包）可能从核心 apache2.conf 之外添加的额外\
  \ Apache 选项。\n\n\n\n\n\n以前向 Apache 添加模块一直是一件苦事。一旦安装了模块本身，你就必须在一个巨大的 `httpd.conf`\
  \ 文件中查找，并找到可能被注释掉的包含该模块的引用，而且大多数时候你还必须粘贴某种 `IfModule` 逻辑才能让它加载。Ubuntu 了一了一种更简单、更模块化的方法。系统中所有可用模块都通过此目录下的\
  \ `.load` 和 `.conf` 文件来表示。`.load` 文件包含了将模块加载到 Apache 所需的所有配置，而可选的 `.conf` 文件则包含了\
  \ Apache 在加载该文件后可能需要的任何额外配置。如果你想知道你的 Apache 安装中有哪些可用模块，只需扫看一眼这个目录即可。\n\n![Image](img/box.jpg)\
  \ `/etc/apache2/mods-enabled/`\n\n这个目录的工作方式非常像 System V init 中不同的运行级别（runlevel）目录，因此如果说\
  \ `mods-available` 类似于你的 `init.d` 目录，那么这个目录就类似于 `rcS.d`（如果你不确定我的意思，请查看我在第 2 章中对\
  \ System V init 的描述）。基本上，这个目录包含了指向 `mods-available` 目录中 `.load` 和 `.conf` 文件的符号链接。当\
  \ Apache 启动时，它会扫描此目录并加载其中引用的所有模块。例如，如果我想启用 CGI 模块，我可以输入\n\n点击此处查看代码图像\n\n```bash\n\
  $ sudo ln -s /etc/apache2/mod-available/cgi.load \\\n/etc/apache2/mods-enabled/cgi.load\n\
  ```\n\n当然，Ubuntu 甚至提供了工具来简化这一操作。要启用模块，只需运行 `a2enmod` 后跟你想要启用的模块名称。要像我上面那样启用 CGI\
  \ 模块，我只需运行：\n\n```bash\n$ sudo a2enmod cgi\n```\n\n同样，还有一个 `a2dismod` 程序可以为你禁用模块。它采用与\
  \ `a2enmod` 相同的语法，因此要禁用 CGI 类型，输入：\n\n```bash\n$ sudo a2dismod cgi\n```\n\n![Image](img/box.jpg)\
  \ `/etc/apache2/sites-available/`\n\nUbuntu 对 Apache 虚拟主机的组织与模块类似。在 Apache 创建之前，市面上的可用\
  \ Web 服务器软件每台物理服务器只能托管一个站点。Apache 引入了虚拟主机的概念，允许它在同一台物理服务器上托管多个站点。每个虚拟主机可以有完全不同的域名和完全不同的文档根。在\
  \ Ubuntu 下，此机器上 Apache 提供的每个虚拟主机（或站点）其配置都在 `sites-available` 下的一个单独文件中。默认情况下，那里唯一的文件是命名恰当的\
  \ default 文件，它定义了默认虚拟主机，当没有配置其他主机，或者没有其他站点的配置匹配请求的主机名时，就会显示它。\n\n![Image](img/box.jpg)\
  \ `/etc/apache2/sites-enabled/`\n\n与 `mods-enabled` 一，这个目录包含了指向 `sites-available`\
  \ 中配置文件的符号链接。因此，当你想要为 Apache 添加一个新的虚拟主机时，只需在 `sites-available` 下为该主机创建一个包含完整 `<VirtualHost>`\
  \ 块的新配置文件，并将其符号链接到此处：\n\n点击此处查看代码图像\n\n```bash\n$ sudo ln -s /etc/apache2/sites-available/mysite\
  \ \\\n/etc/apache2/sites-enabled/mysite\n```\n\n或者你可以使用 `a2ensite` 脚本，它的工作方式与 `a2enmod`\
  \ 相同。只需运行 `a2enmod` 并将想要启用的站点作为参数。要启用 `mysite`，我会输入：\n\n```bash\n$ sudo a2ensite\
  \ mysite\n```\n\n要禁用它可以使用 `a2dissite`：\n\n```bash\n$ sudo a2dissite mysite\n```\n\
  \n默认站点是一个特殊情况，因为它在 `sites-enabled` 下的符号链接前加上了 `000`，以确保它首先加载并作为默认虚拟主机正常工作。\n\n![Image](img/box.jpg)\
  \ `/var/www/`\n\n这是 Apache 的默认文档根。任何 Apache 可读并放置在此目录下的 HTML 文件，一旦你将 Web 浏览器指向该服务器，即可可用。该目录下已经有一个默认的\
  \ `index.html`。\n\n![Image](img/box.jpg) `/usr/lib/cgi-bin/`\n\n这是 CGI 脚本的默认位置。Web\
  \ 服务器上通过 `/cgi-bin` 引用的任何脚本将指向这里。\n\n![Image](img/box.jpg) `/var/log/apache2/`\n\
  \n这是存储 Apache 日志的标准目录。`access.log` 文件包含了 Web 服务器上访问了哪些文件的信息，而 `error.log` 文件列出了任何\
  \ Apache 错误。例如，如果你在启动 Apache 时遇到困难，请查看 `error.log` 寻找线索。\n\n### apache2ctl\n\n`/usr/sbin/apache2ctl`\
  \ 程序是你在 Ubuntu 下管理 Apache 时最主要的命令行程序。该命令的语法非常直观。从命令行运行 `apache2ctl` 并将单个命令作为参数传递给它。正如你想象的，`start`、`stop`\
  \ 和 `restart` 简单命令将分别启动、停止和重启 Apache 进程。你也可以通过 init 脚本实现相同的功能，具有相同功能的简单命令有\n\n点击此处查看代码图像\n\
  \n```bash\n$ sudo apache2ctl restart\n\n$ /etc/init.d restart\n```\n\n### 优雅地停止\
  \ Apache\n\n`restart` 和 `stop` 命令存在潜在风险。当你使用这些命令重启或停止 Apache 时，所有进程都会被杀死，即使它们正在处理请求。为了避免这种情况，`apache2ctl`\
  \ 提供了 `graceful` 和 `graceful-stop` 命令。这些命令分别重启和停止 Apache，但它们会等待进程完成任何请求。对于活跃的站点，优雅重启甚至不会被使用服务的用户察觉。通常情况下，除非你知道站点没有活跃流量（或者你不在乎活动连接是否关闭），否则你应该使用\
  \ `graceful` 和 `graceful-stop`。唯一的例外是你为站点添加 SSL 证书或进行了其他需要完全重启才能生效的更改。\n\n### apache2ctl\
  \ 命令\n\n`apache2ctl` 的其他主要命令提供了更多诊断功能。第一个 `configtest` 将测试你当前的 Apache 配置是否存在错误。当你决定自动化部署脚本时，这非常有用。当你设置部署配置文件并重启\
  \ Apache 的脚本时，一个挑战是如果你在配置文件犯了错，Apache 可能无法重新启动。如果你将相同的文件部署到整个 Web 集群，一个语法错误和一个盲目部署并重启\
  \ Apache 的脚本可能会导致整个集群崩溃。通过 `configtest`，你可以在部署脚本中设置逻辑，只有当服务器通过 `configtest` 后才重启\
  \ Apache。\n\n当 Apache 服务器获得流量时，你通常想从中获取诊断信息，例如有多少 Apache 进程是活跃的、这些进程正在做什么以及你还有多少可用空位。`status`\
  \ 和 `fullstatus` 命令为你提供了大量的诊断数据。`status` 命令输出 Apache 服务器的通用总体状态，包括服务器运行了多久、有多少活动请求以及有多少空闲进程，并额外输出所有可用进程的\
  \ ASCII 映射，不同的字母代表不同的进程状态，如图 5-1 所示。`fullstatus` 命令输出类似的信息，只是更多、更详细。\n\n![Image](img/05fig01.jpg)\n\
  \n**图 5-1** `apache2ctl` 状态输出\n\n\n\n\n虽然本指南足够带你入门，但当你开始开发自己的复杂网站时，你将需要更完整的 Apache\
  \ 文档。已经有很多关于 Apache 配置的整本书籍，但你也可以直接从你的 Ubuntu 服务器获取出色的文档。只需安装 `apache2-doc` 包即可：\n\
  \n```bash\nsudo apt-get install apache2-doc\n```\n\n该包会将 Apache 文档以 HTML 文件的形式安装在\
  \ `/usr/share/doc/apache2-doc/manual/` 下。你可以直接对这些文件使用 `w3m`，但为什么不使用你桌面桌面的 Web 浏览器呢？默认的\
  \ Apache 虚拟主机已配置为指向此目录。你只需访问你 Web 服务器上的 `/manual/` 文件夹即可。例如，如果我的 Web 服务器地址是 `192.168.0.5`，我可以在\
  \ Web 浏览器中访问 [`192.168.0.5/manual/`](http://192.168.0.5/manual/) 并查看完整的文档。\n\n#\
  \ WordPress，示例 LAMP 环境\n\n在 Ubuntu LAMP 栈上，你可以搭建许多不同的网站，但为了演示在 Ubuntu 下搭建新站点是多么简单，我将带你逐步完成一个常见的\
  \ LAMP 部署——安装 WordPress。WordPress 是一种流行的博客软件，由 Ubuntu 打包，并为一个或多个博客提供了一个精美且功能丰富的平台。\n\
  \n## 安装 WordPress\n\n在这个示例中，我将 Web 服务器和 MySQL 数据库都运行在同一台主机上，命名为 `blog.example.net`，因此我在安装时选择了\
  \ LAMP Server 任务。我已经确保在我的 DNS 服务器中设置了 `blog.example.net` 指向这台特定的 Web 服务器。接下来，我将使用包管理器安装\
  \ WordPress 包，这会下载 WordPress 软件以及它所需的任何额外库：\n\n```bash\nsudo apt-get install wordpress\n\
  ```\n\n## 配置 Apache\n\n有几种不同的方法可以配置 Apache 以供 WordPress 使用，位于 `/usr/share/doc/wordpress/example/apache.conf`\
  \ 包含的示例 Apache 文件提供了你正在寻找的主要选项。文件中的第一个示例是最好的全方位案例，因为它易于在同一个站点上托管多个 WordPress 博客。将以下配置保存到\
  \ `/etc/apache2/sites-available/wordpress`：\n\n点击此处查看代码图像\n\n```apache\nNameVirtualHost\
  \ *:80\n<VirtualHost *:80>\nUseCanonicalName    Off\nVirtualDocumentRoot /var/www/%0\n\
  Options All\n</VirtualHost>\n```\n\n配置文件到位后，我使用 `a2ensite` 启用站点，并使用 `a2dissite`\
  \ 禁用可能存在的任何默认站点：\n\n```bash\nsudo a2ensite wordpress\nsudo a2dissite default\n```\n\
  \n由于配置使用了 `VirtualDocumentRoot` 选项，我需要确保 `vhost_alias` 模块已启用，因此我使用 `a2enmod` 命令：\n\
  \n```bash\nsudo a2enmod vhost_alias\n```\n\n***\n\n**提示**\n\n我是如何知道 `VirtualDocumentRoot`\
  \ 需要 `vhost_alias` 模块的呢？首先，如果你尝试在没有该模块的情况下重载 Apache，Apache 会报关于未知配置选项的错误。此时，对 `Virtual\
  \ -DocumentRoot` 进行快速 Web 搜索将引导你找到 `vhost_alias` 模块，它是提供该功能的模块。\n\n***\n\n现在我需要在\
  \ `/var/www` 下为我的网站创建一个软链接，并将其指向到包含所有 PHP 文件的 WordPress 根目录。如果我想托管多个 WordPress 站点，我可以在这里创建多个软链接。\n\
  \n点击此处查看代码图像\n\n```bash\nsudo ln -s /usr/share/wordpress /var/www/blog.example.net\n\
  ```\n\n现在我可以重载 Apache 了：\n\n```bash\nsudo apache2ctl graceful\n```\n\n## 配置 MySQL\n\
  \nWordPress 在 `/usr/share/doc/wordpress/examples/setup-mysql` 下提供了一个简单的脚本，该脚本将为指定的\
  \ MySQL 用户和网站域名设置 WordPress MySQL 配置：\n\n点击此处查看代码图像\n\n```bash\nsudo bash /usr/share/doc/wordpress/examples/setup-mysql\
  \ \\\n-n wordpress blog.example.net\n```\n\n搞定。博客已经可以使用。此时我只需要做的是在 Web 浏览器中打开 [`blog.example.net`](http://blog.example.net)，我将会看到如图\
  \ 5-2 所示的 WordPress 安装页面。最后一步是在提供的字段中输入你的站点名称和电子邮件地址，并点击写有“Install WordPress”的大按钮。随后将为你的站点设置数据库，并加载一个新页面，列出你的管理员用户名、临时密码以及登录你博客的链接。此时，其余的配置将由你决定。你可以更改主题、创建一个“Hello\
  \ World”文章、安装插件，或者更好的是，将你的密码更改为你能记住的内容。\n\n![图像](img/05fig02.jpg)\n\n**图 5-2** WordPress\
  \ Web 安装页面\n\n### 邮件服务器\n\n除了 Web，电子邮件可能可能是大多数人在提到互联网时最想到的服务。和 Web 服务器一样，邮件服务器传统上也比较难设置，有很多关于该主题的指南和书籍。（注：此处原文存在大量重复段落，译文已按原文逻辑进行处理）。\n\
  \n\n\n\n此配置选项将所有传出*和*传入的邮件通过智能主主机（smarthost）转发。如果您希望提供邮件服务器冗余，可以选择此选项。您的智能主主机可以是电子邮件的最终终点，并负责发送所有出站邮件，但您的卫星系统（satellite\
  \ system）可以作为主、备或三级邮件服务器，帮助分担智能主机的负载。\n\n![Image](img/box.jpg) `仅限本地`\n\n如果您选择此选项，此服务器将仅投递本地邮件，例如从\
  \ cron 进程发送到 root 的邮件，或从另一个本地用户发送给本地用户的其他邮件。该服务器将不会接受来自来自网的任何邮件。如果您想将 Postfix 作为您的本地邮件服务器，但不打算发送或接收来自网络其他部分的任何电子邮件，请选择此选项。\n\
  \n取决于您为 Postfix 选择的配置，系统将提示您选择一个邮件服务器用于传出邮件的主机名。这可能与服务器的主机名相同，也可能不同。这是 Postfix 用于标记传出邮件的主机名。例如，如果您在内部将服务器命名为\
  \ zeus，但在互联网上该主机被称为 mail2.example.com，那么您应该在该字段中输入 mail2.example.com。\n\n### Ubuntu\
  \ Postfix 约定\n\nUbuntu 的 Postfix 约定并没有太多惊喜，但以下是 Postfix 在 Ubuntu 下使用的主要目录和文件：\n\n\
  ![Image](img/box.jpg) `/etc/postfix/`\n\n此目录包含所有主要的 Postfix 配置。当然，与 Postfix old\
  \ 的程序（如垃圾过滤器和灰名单软件）通常会将它们的配置存储在其他地方。\n\n![Image](img/box.jpg) `/etc/postfix/main.cf`\n\
  \n这是 Postfix 的主配置文件。上游的 `main.cf` 有大量的注释，列出了所有主要选项、默认值和良好的描述。当您想学习 Postfix 时，它非常棒，但实际上作为配置文件使用时可能会很繁琐。由于由于，Ubuntu\
  \ 的 Postfix 包安装脚本会生成一个自己的较小的 `main.cf` 文件，尽管您仍然可以在 `/usr/share/postfix/main.cf.dist`\
  \ 参考带有完整注释的版本。\n\n![Image](img/box.jpg) `/etc/aliases`\n\n此文件包含用户别名的映射，Postfix 在邮件投递时会引用这些别名。基本语法本质上是\
  \ `username1: username2`，这告诉 Postfix 将发给 `username1` 的邮件重定向到 `username2`。您还可以将邮件重定向到管道命令以实现更复杂的重定向。\n\
  \n![Image](img/box.jpg) `/var/spool/mail/`\n\n该目录默认包含系统上每个用户的邮箱。默认情况下，Postfix 将使用\
  \ mbox 格式，因此该用户的每封电子邮件都将位于此目录下一个以用户命名的单文件文件中。当然，如果您安装了 POP 或 IMAP 服务器，或者改用 Maildirs\
  \ 存储邮件，此情况可能会发生，但将在本章节的 POP/IMAP 部分进行详细介绍。\n\n![Image](img/box.jpg) `/var/spool/postfix/`\n\
  \nPostfix 在此目录下存储了许多不同的子目录，并使用它们组织系统缓存的邮件，这些邮件用于在服务器上投递或投递到不同的邮件服务器。通常情况下，您不希望干预此目录。Postfix\
  \ 提供了可以使用的工具来获取当前邮件队列的信息。\n\n![Image](img/box.jpg) `/var/log/mail.*`\n\n在 Ubuntu\
  \ 下，Postfix 日志组织在几个不同的日志文件中，以便您可以更容易地找到所需信息。`mail.log` 文件存储所有邮件日志，因此如果您不确定要检查哪些其他日志（或者您打算直接使用\
  \ `grep` 来查找所需信息），请使用此日志文件。同样，`mail.info` 日志包含所有信息性日志，例如已入队列的新邮件、与远程服务器每次交互的日志条目以及其他常见日志记录。`mail.err`\
  \ 和 `mail.warn` 文件分别将错误或警告从其他 Postfix 日志中分离出来，因此如果您想快速查看错误或警告，请查看此处。\n\n![Image](img/box.jpg)\
  \ `/etc/init.d/postfix`\n\n这是 Postfix 的初始化脚本，应该自动设置为在系统启动时启动。\n\n### 管理 Postfix\n\
  \n您将用于管理 Postfix 的主要工具名之其实切为 `postfix`。它的工作方式非常类似于 `apache2ctl`，接受几个不同的命令作为参数，也可以作为初始化脚本的替代品来启动和停止服务。例如，要停止\
  \ Postfix 然后重新启动它，您需要输入：\n\n```bash\nsudo postfix postfix stop\nsudo postfix start\n\
  ```\n\n其他命令的工作方式通常相同。以下是您可以传递给 Postfix 的主要命令及其功能：\n\n![Image](img/box.jpg) `reload`\n\
  \n每当您更改了 Postfix 配置并想要加载它时，请使用此命令。它的运行方式类似于 `apache2ctl graceful` 函数，它允许每个进程在可以时终止并重新加载，因此比直接停止然后启动\
  \ Postfix 要安全得多，并且提供的过程更平滑。\n\n![Image](img/box.jpg) `flush`\n\n此命令告诉 Postfix 刷新其邮件队列。通常情况下，Postfix\
  \ 会错开邮件投递时间以避免限制网络带宽，当消息由于某些原因被推迟时，它将在队列中延迟一段时间，然后 Postfix 才会尝试重新投递。有时您会遇到一些问题（例如网络中断），导致大量邮件在服务器上缓存，一旦问题解决，您希望投递这些邮件。\n\
  \n![Image](img/box.jpg) `status`\n\n返回 Postfix 的状态。如果 Postfix 正在运行，此命令还会返回主进程的 PID。\n\
  \n![Image](img/box.jpg) `abort`\n\n这是 `stop` 命令的强力版本，会立即杀死所有运行中的 Postfix 进程，无论它们是否完成。\n\
  \n![Image](img/box.jpg) `check`\n\n此命令类似于 `apache2ctl check`。它扫描 Postfix 目录结构的坏文件或目录权限，并向您警告发现的问题。\n\
  \n除了 Postfix 命令行工具外，Postfix 还提供了其他工具来帮助管理服务。`postqueue` 命令可供普通用户获取当前邮件队列的信息。这非常有用，以便您可以跟踪推迟的邮件并回答“我两小时前发送了这封邮件，收件人说没收到。发生了什么？”的问题。例如，要获取当前队列中所有邮件的完整列表，输入：\n\
  \n```bash\npostqueue -p\n```\n\n有时您想对队列中的邮件执行刷新以外的操作。偶尔您可能想删除队列中的邮件（或者可能是所有邮件）。`postsuper`\
  \ 命令允许超级用户对队列执行特权操作。例如，要删除队列 ID 为 522 的队列邮件，您需要输入：\n\n```bash\nsudo postsuper -d\
  \ 522\n```\n\n如果您确实想删除队列中的所有邮件，可以使用大写的单词 `ALL` 代替特定的队列 ID。您可能还想将邮件挂起，以便 Postfix\
  \ 将其保留在队列中但不尝试投递。使用 `-h` 选项加上队列 ID 将邮件挂起，然后使用相同的队列 ID 使用 `-H` 选项将邮件放回队列。\n\n\n\n\
  \n\n之前我讨论了 `/etc/alias` 文件以及它如何用于在邮件投递时将一个用户名映射到另一个用户名。`/etc/alias` 文件实际上仅供人类编辑。Postfix\
  \ 不会直接读取它。相反，它会根据该文件创建一个数据库，以便更快速地引用它。每当你编辑该文件时，请输入 `sudo newaliases` 来更新 `/etc/alias.db`\
  \ 文件。此外，对于某些更高级的 Postfix 配置（如规范映射、虚拟账户或其他功能），你在 `/etc/postfix` 内会有一个需要数据库的独立文件。你可以在\
  \ `main.cf` 文件中识别这些文件，因为它们的路径前面带有 `hash:` 前缀。如果你确实创建或编辑了这些查找表之一，请运行 `sudo postmap\
  \ /path/to/file`。如果我在 `/etc/postfix/virtual` 中设置了虚拟用户，我将通过以下命令更新数据库：\n\n```bash\n\
  sudo postmap /etc/postfix/virtual\n```\n\n最后，有时你正在调整 `main.cf` 文件，并想要查看运行中的 Postfix\
  \ 实例上当前和激活的设置。`postconf` 命令会将每一个（我的意思是每一个）Postfix 设置及其其值输出到屏幕上。因此，如果我想查看运行配置中 `myhostname`\
  \ 的当前值，我可以输入：\n\n```bash\nsudo postconf | grep ^myhostname\n```\n\nmyhostname =\
  \ mail1.example.net\n\n## 默认 Postfix 示例\n\nPostfix 安装脚本的优点之一是，一旦完成安装，你就应该拥有一个功能完的邮件服务器。当然，取决于你计划如何使用该服务器，可能仍有更多配置需要完成。虽然你可以对\
  \ Postfix 进行近乎无限的调优和微调，但有很多常见的配置选项是你想要研究的。我将涵盖一些主要选项，然后提供不同邮件服务器配置的示例。\n\n对于所有这些示例，我都是从一个由\
  \ Postfix 安装脚本为 Internet 站点设置的基础 `main.cf` 文件开始的。该配置接受来自本地局域网邮件以及发送到 example.org\
  \ 和 mail1.example.org 的邮件。以下是完整的 `main.cf` 文件：\n\n点击此处查看代码图像\n\n```text\n# 查看 /usr/share/postfix/main.cf.dist\
  \ 以获取带有注释的更\n# 完整的版本\n# Debian 特有：指定文件名将导致该文件的\n# 第一行用作名称。Debian 默认\n# 是 /etc/mailname。\n\
  \n#myorigin = /etc/mailname\n\nsmtpd_banner = $myhostname ESMTP $mail_name (Ubuntu)\n\
  biff = no\n\n# 添加 .domain 是 MUA 的工作。\nappend_dot_mydomain = no\n\n# 取消下一行的注释以生成“延迟邮件”警告\n\
  #delay_warning_time = 4h\n\nreadme_directory = no\n\n# TLS 参数\nsmtpd_tls_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem\n\
  smtpd_tls_key_file=/etc/ssl/private/ssl-cert-snakeoil.key\nsmtpd_use_tls=yes\nsmtpd_tls_session_cache_database\
  \ =\nbtree:${data_directory}/smtpd_scache\nsmtp_tls_session_cache_database =\nbtree:${data_directory}/smtp_scache\n\
  \n# 查看 postfix-doc\n# 包中的 /usr/share/doc/postfix/TLS_README.gz\n# 获取在 smtp 客户端中启用\
  \ SSL 的信息。\n\nmyhostname = mail1.example.org\nalias_maps = hash:/etc/aliases\nalias_database\
  \ = hash:/etc/aliases\nmyorigin = /etc/mailname\nmydestination = mail1.example.org,\
  \ example.org,\nlocalhost.example.org, localhost\nrelayhost =\nmynetworks = 127.0.0.0/8\
  \ [::ffff:127.0.0.0]/104 [::1]/128\nmailbox_size_limit = 0\nrecipient_delimiter\
  \ = +\ninet_interfaces = all\n```\n\n文件的开头大部分设置了与标准 Postfix 默认值不同的 Ubuntu 默认值。供你调整的核心配置从\
  \ `myhostname` 开始。要获取这些选项的完整文档，请输入 `man 5 postconf`。该手册包含了所有的 Postfix 配置选项以及其用法描述。以下是示例配置文件中你经常使用的几个选项：\n\
  \n![Image](img/box.jpg) `myhostname`\n\n这是邮件服务器的 Internet 主机名。如果你没有在该文件中显式地设置它，它将使用\
  \ `gethostname()` 并使用该值。许多许多其他选项（如 `myorigin`）如果没有显式设置，它们将使用或引用 `myhostname` 的值。\n\
  \n![Image](img/box.jpg) `myorigin`\n\n这里列出的域名是从这台机器发送的邮件看起来源自的域名。例如，如果你的服务器命名为 mail1.example.org，但你希望从那里发送的电子邮件看起来源自\
  \ example.org，你就会将此值设置为 `example.org`。\n\n![Image](img/box.jpg) `mydestination`\n\
  \n这是一个该邮件服务器接受邮件并认为自己是终目的地的域名列表。如果发往其中一个域名的邮件到达这台服务器，Postfix 将其在本地投递。\n\n![Image](img/box.jpg)\
  \ `relayhost`\n\n在此示例中，此值为空，但如果你确实想通过另一个邮件服务器路由所有的出站邮件，你会将此值设置为该服务器的主机名。你可能会在数据中心的所有服务器上使用此值，以便它们指向单一的出站主机。这样你就可以从一个单一的节点更严格地控制访问并查看所有出站邮件。\n\
  \n![Image](img/box.jpg) `mynetworks`\n\n此值是用逗号分隔的网络列表（IP 地址和子网掩码），此服务器将为此转发邮件。请非常小心此值！如果你将其设置得太宽并允许\
  \ Internet 上的随机主机通过你的服务器转发，你就建立了一个所谓的开放中继。开放中继经常被垃圾邮件发送者用于转发垃圾邮件，如果你错误地让你的服务器变成开放中继，很快就会发现并将你的服务器列入黑名单。通常，这将设置为\
  \ localhost，如果你允许网络内的其他主机通过你转发邮件。\n\n![Image](img/box.jpg) `mailbox_size_limit`\n\
  \n此选项设置任何本地用户邮箱的最大值。示例中的默认值设置为 `unlimited`（无限制）。\n\n## 备用服务器\n\n我提供的默认示例可以作为小型域名（例如你自己的邮件服务器）的默认\
  \ Internet 邮件服务器。一旦你设置了接收域邮件服务器并开始依赖它，你应该考虑设置一个备用服务器作为备份。如果你只有一个邮件服务器且它由于某种原因宕机，任何想要向其投递邮件的主机理想情况下会将邮件缓存几天。然而，如果服务器没有在规定时间内恢复，邮件将作为无法投递退回给发送者。每个管理员可能会设置其邮件服务器在不同的时间后退回。Postfix\
  \ 默认通过 `bounce_queue_lifetime` 选项将其设置为五天。为了避免邮件退回，你将希望至少设置一个可以接收并缓存你的域邮件的服务器。该服务器将在主邮件服务器恢复后将邮件投递过去。\n\
  \n使用 Ubuntu 和 Postfix 设置备用服务器其实非常简单。我们从 Internet 站点安装时选项开始，它给你一个与我之前列出的相似的 `main.cf`。此时，你真正需要在\
  \ `main.cf` 中添加的另一个选项是 `relay_domains` 选项。该选项定义了该机器将接受并转发邮件的域名。例如，如果你想为 example.org\
  \ 和 example.net 设置一个备用邮件服务器，你会将此值设置为：\n\n```text\nrelay_domains = example.org, example.net\n\
  ```\n\n\n\n\n一旦你使用 `postfix reload` 重新加载此配置，要开始使用备用邮件服务器只需要在你域名的 DNS 区域中添加一条 MX\
  \ 记录，并确保其优先级数字大于主邮件服务器。如果我的主邮件服务器是 `mail1.example.org` 而备用服务器是 `mail2.example.org`，那么区域条目可能如下：\n\
  \n点击此处查看代码图像\n\n```\nexample.org.   IN      MX      100       mail1.example.org.\n\
  example.org.   IN      MX      200       mail2.example.org.\n```\n\n一旦 DNS 更改生效，你的邮件服务器就会开始被使用。对于备用邮件服务器，你可能想要考虑的最后一个设置是增加邮件在退回前在队列中的天数。如果你知道主邮件服务器将宕超过五天，你可能希望增加限制，以便备用邮件服务器继续为你保留邮件，直到主服务器恢复在线。例如，要将队列限制增加两周，请在你的\
  \ `/etc/postfix/main.cf` 中添加以下设置：\n\n```\nbounce_queue_lifetime = 14d\nmaximal_queue_lifetime\
  \ = 14d\n```\n\n一旦主服务器恢复在线，在备用服务器上运行 `postfix flush`，使其立即开始投递所有延迟邮件。\n\n## 灰名单邮件服务器\
  \ (Greylisting Mail Server)\n\n垃圾邮件是几乎每个邮件服务器管理员面临的问题。有很多解决方案可以帮助减少服务器收到的垃圾邮件，其中一个概念被称为\
  \ `灰名单` (greylisting) 。\n\n`灰名单` 基于这样一种观点：由于垃圾邮件发送者发送数百万封电子邮件，如果邮件没有立即送达，他们通常不会设置延迟队列。SMTP\
  \ 协议中有一个特殊的响应叫做 `450`，它基本上意思是“请稍后再试”。互联网上的大多数合法邮件服务器都会遵守该请求并在稍后返回。大多数垃圾邮件发送者不会。通过`灰名单`，你的邮件服务器将对所有新邮件服务器响应\
  \ `450` 命令。一旦服务器返回，`灰名单` 程序就会在本地服务器数据库中记录其 `To:`  way 和 `From:` 地址。这意味着（取决于你在服务器被列入白名单之前配置了多少次成功），在服务器等待一次后，将来就不再需要等待了。\n\
  \n有许多为 Ubuntu 实现 `灰名单` 的不同程序，但与 Postfix 配合最简单的程序之一叫做 `Postgrey`。正如我之前提到的，它实现了`灰名单`，并且包含了已知与灰名单配合良好的良好的邮件服务器白名单；它还允许你将服务器加入白名单，以便它们永远看不到初始延迟。\n\
  \n### 安装和配置 Postgrey\n\n要安装 `Postgrey`，请使用包管理器安装同名的包：\n\n```\n$ sudo apt-get install\
  \ postgrey\n```\n\n`Postgrey` 程序通过启动时的 init 脚本启动，并监听本地 `10023` 端口以接收来自 Postfix 的查询。一旦安装并运行，你只需要修改\
  \ Postfix 中 `main.cf` 的 `smtpd_recipient_restrictions` 选项，添加 `localhost:10023` 服务。如果你完全没有调整过\
  \ `smtpd_recipient_restrictions` 设置，这里有一个可以适用于你的的示例：\n\n点击此处查看代码图像\n\n```\nsmtpd_recipient_restrictions\
  \ = permit_mynetworks, \\\n               permit_sasl_authenticated, \\\n      \
  \         reject_unauth_destination, \\\n               check_policy_service inet:127.0.0.1:10023\n\
  ```\n\n一旦添加了该选项，重新加载 Postfix，它将立即开始实施`灰名单`。如果你不太熟悉`灰名单`，这应该适合你开始。如果你想调整白名单，例如默认的\
  \ `Postgrey` 配置存储在 `/etc/postgrey`。`whitelist_clients` 和 `whitelist_recipients`\
  \ 由 `Postgrey` 包提供并设置了一些良好的默认值。如果你想添加额外的条目，请创建一个 `whitelist_clients.local` 或 `whitelist_recipients.local`\
  \ 文件，以便保持设置分离。然后输入 `sudo service postgrey reload`，让 `Postgrey` 重新加载设置。如果你想获得关于配置文件语法或其他\
  \ `Postgrey` 选项的更具体信息，请查看 `/usr/share/doc/postgrey/` 下的文档。\n\n## POP/IMAP 服务器\n\n\
  大多数设置邮件服务器的人不再实际上登录邮件服务器来获取邮件。他们通常使用某种邮件客户端，然后由客户端连接到目标邮件服务器并通过 `POP` 或 `IMAP` 获取邮件。使用\
  \ `POP` 时，邮件在你访问时会被下载并从服务器删除，而使用 `IMAP` 时，邮件保留在服务器上。\n\n邮件服务器有多种存储电子邮件的方法。长期以来邮件存储的主要格式是\
  \ `mbox` 格式。在 `mbox` 格式中，用户的所有邮件都存储在一个大文件中。这种方法有效；但它并非没有缺点。现在，除了 `mbox` 格式外，邮件通常存储在\
  \ `Maildir` 中。`Maildir` 基本上将每个邮件文件夹拆分为自己的目录。在该目录下有存储新邮件和已读邮件的目录。在这些子目录下，每封邮件作为一个单独的文件存储。\n\
  \n### 在 Postfix 上启用 Maildir\n\n要在 Postfix 上启用 `Maildir`，你只需要设置 `home_mailbox` 选项以指定你将使用的\
  \ `Maildir` 目录。打开 `/etc/postfix/main.cf` 并添加以下选项：\n\n```\nhome_mailbox = Maildir/\n\
  ```\n\n确保记住目录名称后面的 `/`，这在使用 `Maildir` 时是需要的。在此示例中，Postfix 将使用每个人家目录下的 `Maildir`\
  \ 目录存储邮件。一旦完成更改，输入 `sudo postfix reload` 重新加载配置。此时，所有新邮件都将投递到本地用户家目录下的 `Maildir`。如果该目录不存在，Postfix\
  \ 将创建它。\n\n### 安装 Dovecot\n\n你需要的所有 Dovecot` 包在 Ubuntu 中默认均可用。如果你在安装 Postfix 时或之后通过\
  \ `tasksel` 安装了它，那么 Dovecot 包已包含在内。否则，你可以直接使用包管理器安装它们。我将安装的包将启用 `POP`、带 SSL 的 `POP`、`IMAP`\
  \ 以及带 SSL 的 `IMAP`：\n\n```\n$ sudo apt-get install dovecot-imapd dovecot-pop3d\n\
  ```\n\n默认情况下，Dovecot 将设置为 `POP`、带 SSL 的 `POP`、`IMAP` 以及带 SSL 的 `IMAP`。如果出于某种原因你想禁用这些选项之一，打开\
  \ Dovecot 的默认配置文件 `/etc/dovecot/dovecot.conf` 并找到以下行：\n\n```\nprotocols = imap imaps\
  \ pop3 pop3s\n```\n\n\n\n只需移除任何你不想启用的协议，然后运行 `sudo /etc/init.d/dovecot reload` 以使更改生效。下一步是告诉\
  \ Dovecot 使用 Maildirs，并让它知道可以在系统的何位置找到这些目录。要执行此操作，请检查是否已经存在以 `mail_location` 开头的未注释行（在默认安装中，该行是被注释的）。如果不存在，请添加以下行；如果它已存在，则修改\
  \ `mail_location` 行使其看起来如下所示：\n\n```\nmail_location = maildir:~/Maildir\n```\n\n\
  然后使用 `sudo /etc/init.d/dovecot reload` 重新加载 Dovecot。现在，你应该能够配置你的邮件客户端指向服务器并访问它们的本地邮件了。\n\
  \n### 注意：允许明文密码身份验证\n\n默认情况下，Dovecot 被配置为使用系统的本地账户。但请注意，只有当你通过 `IMAPS` 或 `POP3S`\
  \ 等安全协议进行操作时，它才允许你使用明文密码身份验证。如果你想配合明文密码使用 `IMAP` 或 `POP3`，且不介意用户密码以未加密的形式在网络上传输，请在\
  \ `dovecot.conf` 中将配置选项 `disable_plaintext_auth` 设置为 `no`：\n\n```\ndisable_plaintext_auth\
  \ = no\n```\n\n然后重新加载 Dovecot 以使新更改生效。\n\n### Ubuntu Dovecot 规范\n\nDovecot 在文件存储方面遵循相当标准的规范。本节描述了\
  \ Dovecot 使用的常用文件目录：\n\n![Image](img/box.jpg) `/etc/dovecot/`\n\n这是 Dovecot 的默认配置目录，包含了所有的配置文件，包括\
  \ `dovecot.conf`（这是你用于配置服务的主文件）。\n\n![Image](img/box.jpg) `/etc/init.d/dovecot`\n\
  \n这是 Dovecot 的初始化脚本。该脚本在安装时设置，以便在系统启动时自动运行。\n\n![Image](img/box.jpg) `/var/log/syslog`\
  \ 和 `/var/log/mail.log`\n\nDovecot 会将其日志副本发送到这两个文件中，因此你可以使用其中任何一个文件来查找错误或监控登录情况。\n\
  \n### OpenSSH 服务器\n\n虽然我理解为什么该服务默认不安装，但现如今大多数系统管理员都使用 SSH 远程管理他们的服务器。`SSH` 为你提供了一个安全的加密通道，使你可以在远程机器上登录并执行命令。除了标准的远程控制用途外，`SSH`\
  \ 还允许许多有趣的黑客玩法，让你能够建立隧道、运行远程 X 应用程序以及各种其他有趣的技巧。似乎每隔几天，网上就会出现出一篇关于新 SSH 技巧的文章。\n\n\
  要安装 OpenSSH，你既可以在安装程序的任务选择过程中选择 OpenSSH Server，也可以在安装后运行 `sudo tasksel` 并在那里选择它，或者运行：\n\
  \n```\nsudo apt-get install openssh-server\n```\n\n一旦安装完成后，`sshd` 进程将启动。要从远程主机登录到服务器，请输入：\n\
  \n```\nssh username@hostname\n```\n\n将 `username` 和 `hostname` 分别替换为在该机器上的用户名以及该机器的主机名或\
  \ IP 地址。一旦通过 `SSH` 登录，你就可以在远程服务器上运行命令，就像你坐在带有键盘和鼠标的机器上一样。要退出当前的 `SSH` 会话，只需在终端中输入\
  \ `exit` 即可。\n\n### Ubuntu OpenSSH 规范\n\n本节描述了 OpenSSH 的主要目录和文件位置及其用途：\n\n![Image](img/box.jpg)\
  \ `/etc/ssh/`\n\n该目录包含了 OpenSSH 服务器和客户端的所有主要配置文件。\n\n![Image](img/box.jpg) `/etc/ssh/ssh_config`\n\
  \n此文件定义了本机器上 `SSH` 客户端的默认设置。本地用户可以通过 `~/.ssh/config` 中的自定义选项来覆盖这些设置。\n\n![Image](img/box.jpg)\
  \ `/etc/ssh/sshd_config`\n\n在此文件中，你会找到 SSH 服务器的默认设置。值得注意的是，默认启用了通过 `SSH` root 登录，尽管\
  \ Ubuntu 默认并没有在系统本身设置 root 登录。如果你想禁用 root 登录，请编辑文件并将 `PermitRootLogin` 值设置为 `no`。\n\
  \n![Image](img/box.jpg) `/etc/ssh/ssh_host_dsa_key` 和 `/etc/ssh/ssh_host_dsa_key.pub`\n\
  \n这些文件分别提供了系统的 DSA 私钥和公钥。这些密钥用于验证系统身份，以便你更好地检测中间人攻击。\n\n![Image](img/box.jpg) `/etc/ssh/ssh_host_rsa`\
  \ 和 `/etc/ssh/ssh_host_rsa.pub`\n\n这些文件与我提到的 DSA 密钥类似，只是它们是用 RSA 算法生成的。\n\n![Image](img/box.jpg)\
  \ `/etc/init.d/ssh`\n\n这是 OpenSSH 服务器的初始化脚本，提供了标准的 `start`、`stop` 和 `restart` 命令，以及在更改配置文件时使用的\
  \ `reload` 和 `force-reload` 命令。\n\n![Image](img/box.jpg) `/var/log/auth.log`\n\n\
  OpenSSH 服务器将将其信息记录到此日志文件中，包括信息消息、错误和用户登录情况。\n\n### DHCP 服务器\n\n如今，把 DHCP 视为理所当然是很容易的。毕竟，即使是最基本的家用路由器似乎也提供了\
  \ DHCP 服务，大多数企业网络也使用 DHCP。如果你曾经管理过没有 DHCP 的大型网络，你可能还记得手动输入静态 IP 的痛苦。`DHCP` 代表动态主机配置协议，通过该协议，网络上的新主机可以请求\
  \ IP 信息。\n\n### 安装 DHCP\n\n在 Ubuntu 上安装 DHCP，输入：\n\n```\nsudo apt-get install dhcp3-server\n\
  ```\n\n### Ubuntu DHCP 规范\n\n本节描述了 DHCP 的主要目录和文件位置及其用途。注意，在之前的版本中，配置文件存储在 `/etc/dhcp3`；现在位于\
  \ `/etc/dhcp`：\n\n![Image](img/box.jpg) `/etc/dhcp/dhcpd.conf`\n\n这是 DHCP 服务器的配置文件。默认情况下，这是一个注释详细的文件，应该为你提供大量的示例。\n\
  \n![Image](img/box.jpg) `/var/lib/dhcp/dhcpd.leases`\n\n此文件包含了服务器分配出的租约列表。如果你好奇哪个\
  \ MAC 地址获得了某个 IP，或者某个租约何时过期，请查看此文件。\n\n![Image](img/box.jpg) `/var/log/syslog`\n\
  \nDHCP 使用标准的 syslog 文件记录所有日志。在这里，你可以找到网络上的任何 DHCP 请求以及 DHCP 服务器的响应。\n\n### 配置 DHCP\n\
  \nUbuntu 提供了一个注释详细的 DHCP 配置文件，解释了所有主要选项并提供了多个配置示例。对于基础 DHCP 服务，你通常需要设置一个或两个场景：动态\
  \ DHCP 和静态 DHCP。在动态 DHCP 配置中，新主机从可能的 IP 范围内被分配 IP。无法保证主机每次都会获得相同的 IP。在静态 DHCP 中，你可以将特定的\
  \ IP 地址与主机的 MAC 地址绑定，并确保它每次出现在网络上都会获得相同的 IP。动态 DHCP 适用于简单、易于维护的 DHCP 服务器，而静态 DHCP\
  \ 能带给你静态 IP 的许多好处，却几乎没有麻烦。\n\n\n\n\n# 动态 DHCP 配置\n\n要设置动态 DHCP，请打开 `/etc/dhcp/dhcpd.conf`\
  \ 文件并移动到文件末尾，以通过所有的示例选项。你只需要添加单个子网声明（subnet declaration），提供 DHCP 分配地址所需的关于你子网的所有信息，以及\
  \ `DHCP` 可以使用的 IP 地址范围。在我的示例中，我分配的范围是从 `10.1.1.50` 到 `10.1.1.99`，因此我在文件末尾添加了以下设置：\n\
  \n点击此此处查看代码图片\n\n```bash\nsubnet 10.1.1.0 netmask 255.255.255.0 {\n    range 10.1.1.50\
  \ 10.1.1.99;\n    option routers 10.1.1.1;\n    option domain-name-servers 10.1.1.2,\
  \ 10.1.1.3;\n}\n```\n\n现在，为了启动 `DHCP` 并启用我的设置，我将运行 `sudo start isc-dhcp-server`。如果没有出现任何语法错误，`DHCP`\
  \ 服务器将启动。如果文件中存在错误，它将输出到屏幕并显示错误位置。一种常见的错误是某行末尾缺少分号。\n\n## 静态 DHCP\n\n如果你需要，可以将静态\
  \ DHCP 分配与动态 DHCP 子网声明一起使用。如果服务器匹配到静态分配，它将获得该地址；否则，它将默认使用动态范围内的地址。每个获得静态分配的主机都需要其自己的主机声明（host\
  \ declaration）。例如，这里有一个 MAC 地址为 `00:0c:c0:ff:ee:00` 且分配为 `10.1.1.10` 的主机的声明：\n\n\
  点击此此处查看代码图片\n\n```bash\nhost examplehost {\n    hardware ethernet 00:0c:c0:ff:ee:00;\n\
  \    option host-name \"examplehost\";\n    fixed-address 10.1.1.10;\n}\n```\n\n\
  你可以添加任意数量的主机声明；只需记住，文件中的每个声明都需要一个唯一的 MAC 地址和唯一的 IP 地址。一旦你添加了所有的主机声明，请保存更改并重启 `dhcp3-server`\
  \ 初始化脚本。\n\n***\n\n### 注意：如何查找你的 MAC 地址\n\n如果你不确定如何查看特定主机的 MAC 地址，请登录该主机并运行 `sudo\
  \ ifconfig`：\n\n点击此此处查看代码图片\n\n```bash\n$ sudo ifconfig\n\neth0      Link encap:Ethernet\
  \  HWaddr 00:0c:c0:ff:ee:00\n          inet addr:10.1.1.10  Bcast:10.1.1.255  Mask:255.255.255.0\n\
  \          UP BROADCAST MULTICAST  MTU:1500  Metric:1\n          RX packets:0 errors:0\
  \ dropped:0 overruns:0 frame:0\n          TX packets:0 errors:0 dropped:0 overruns:0\
  \ carrier:0\n          collisions:0 txqueuelen:1000\n          RX bytes:0 (0.0 B)\
  \  TX bytes:0 (0.0 B)\n          Interrupt:10\n\nlo        Link encap:Local Loopback\n\
  \          inet addr:127.0.0.1  Mask:255.0.0.0\n          inet6 addr: ::1/128 Scope:Host\n\
  \          UP LOOPBACK RUNNING  MTU:16436  Metric:1\n          RX packets:2741 errors:0\
  \ dropped:0 overruns:0 frame:0\n          TX packets:2741 errors:0 dropped:0 overruns:0\
  \ carrier:0\n          collisions:0 txqueuelen:0\n```\n\n\n\n\n\n程序将返回此类信息，例如当前运行时间、活跃线程数、正在运行的慢查询数量，以及每秒处理的平均查询数。请注意，我在此命令中使用了\
  \ `-p` 参数，这会告诉 `mysqladmin` 在命令行中提示我输入密码。如果你为 root 用户设置了密码，则需要在执行命令时使用 `-p`；或者，如果你计划运行一组命令且不想每次都输入密码，可以将密码直接添加到\
  \ `-p` 选项中。例如，如果我的 MySQL 密码是 `insecure`，我将输入以下内容：\n\n```\n$ sudo mysqladmin -pinsecure\
  \ status\n```\n\n`mysqladmin` 帮助页（在控制台上输入 `man mysqladmin` 查看）列出了全套命令，但这里高亮显示了其中几个常用命令：\n\
  \n![Image](img/box.jpg) `create and drop`\n\n`create` 和 `drop` 命令以数据库名称作为参数，分别从你的\
  \ MySQL 实例中创建或删除数据库。\n\n![Image](img/box.jpg) `flush-`\n\n有许多命令可以刷新 MySQL 内部缓存或其他设置。`flush-hosts`、`flush-threads`\
  \ 和 `flush-logs` 命令分别刷新主机缓存、线程缓存和所有日志。`flush-privileges`、`flush-status` 和 `flush-tables`\
  \ 命令分别重新加载权限表、清除状态变量并刷新所有表。\n\n![Image](img/box.jpg) `password`\n\n如果你从没有设置过 root\
  \ 密码，或者你想更改它，请使用此命令并将新密码作为下一个参数。如果密码包含任何特殊字符或空格，请确保将其放在双引号中。\n\n![Image](img/box.jpg)\
  \ `status, extended-status, processlist`\n\n所有这些命令都能为你提供有关当前 MySQL 实例的信息。我已经讨论过\
  \ `status` 命令。`extended-status` 命令提供更完整的状态信息集，而 `processlist` 命令列出所有活跃的服务器线程以及它们的\
  \ ID。如果你需要杀死特定的进程，可以使用该 ID 作为参考。\n\n![Image](img/box.jpg) `kill`\n\n`mysqladmin\
  \ processlist` 命令列出所有进程及其 ID，而 `kill` 命令会杀死你通过作为参数传递的所有进程 ID。如果你指定了多个进程，请用逗号将它们隔开。\n\
  \n## MySQL Web 管理\n\n虽然硬核数据库管理员可能会蔑视使用 Web 界面来管理 MySQL，但它是创建和修改数据库的流行方式，特别是在 Web\
  \ 设计师中。`phpMyAdmin` 程序是一个流行的 MySQL Web 界面，并且在 Ubuntu 上很容易设置。\n\n### 安装 phpMyAdmin\n\
  \n要安装 phpMyAdmin，请使用你的包管理器安装 `phpmyadmin` 包：\n\n```\n$ sudo apt-get install phpmyadmin\n\
  ```\n\n这不仅会获取 `phpmyadmin` 包，还会获取其依赖项（如果你还没有安装 Web 服务器，则还包括 `apache2`）。在包安装过程中，你将看到一些用于配置\
  \ phpMyAdmin 的问题。第一个问题是使用哪种 Web 服务器。除非你专门为此任务设置了另一个 Web 服务器，否则在此处选择 `apache2`。\n\
  \n一旦安装完成，phpMyAdmin 就可以使用了。只需打开 Web 浏览器并指向 phpMyAdmin 服务器的 IP 地址或主机名，并在后面加上 `/phpmyadmin`。例如，如果我的服务器地址是\
  \ `192.168.1.7`，我将访问 `http://192.168.1.7/phpmyadmin`。你看到的第一个屏幕是登录界面，如图 5-3 所示。要记住，phpMyAdmin\
  \ 自身并不维护任何用户账户——它只是将你的登录和密码直接传递给 MySQL——因此输入 `root` 和你的 MySQL 密码（如果你在 MySQL 上设置了其他用户，在此输入相应信息）。登录后，你将看到主配置界面，如图\
  \ 5-4 所示，从那里你可以调整 MySQL 设置、创建和修改数据库及表，并访问 phpMyAdmin 文档本身。\n\n![Image](img/05fig03.jpg)\n\
  \n**图 5-3** phpMyAdmin 登录界面\n\n![Image](img/05fig04.jpg)\n\n**图 5-4** phpMyAdmin\
  \ 主配置界面\n\n## PostgreSQL\n\nPostgreSQL 和 MySQL 是开源数据库世界的阴阳。MySQL 早期侧重于速度和易用性，然后开始添加更多高级的数据库功能；而\
  \ PostgreSQL 则首先关注高级的数据库功能，然后致力于优化和易用性。这两种数据库都有自己的追随者，并且所有主要的基于开源数据库的 Web 软件都支持这两种数据库。不过，PostgreSQL\
  \ 远超网站数据库，它拥有先进的功能集，包括完全的 ACID 合规性、外键、连接、视图、触发器和存储过程。\n\n### 安装 PostgreSQL\n\n尽管\
  \ MySQL 以易用闻名，但 Ubuntu 下的 PostgreSQL 安装和使用同样简单。要安装 PostgreSQL，你可以在安装 Ubuntu 时选择\
  \ PostgreSQL Server，或者事后通过 `tasksel` 选择，也可以使用包管理器安装 `postgresql` 包：\n\n```\n$ sudo\
  \ apt-get install postgresql\n```\n\n一旦安装了 `postgresql` 包，数据库服务将在后台启动，然后你就可以设置超级用户账户并创建数据库。初始管理将由\
  \ `postgres` 用户执行，因此首先使用 `postgres` 用户：\n\n```bash\n$ sudo -u postgres psql  # 切换到用户\n\
  ```\n或者，先使用 `sudo` 切换到 `postgres` 用户：\n\n```bash\n$ sudo -u postgres\n```\n\n现在从这个\
  \ shell 中你可以创建一个新用户。如果你想以超级用户权限在 PostgreSQL 数据库中创建一个名为 `kyle` 的新用户，我只需要向 `createuser`\
  \ 程序传递正确的标志：\n\n点击此处查看代码\n\n```\n$ createuser -P -s kyle\n```\n\n输入新密码：\n\n再次输入：\n\
  \n```\nCREATE ROLE kyle PASSWORD 'md5966c432c86920283876a8b4f925ccc' SUPERUSER INHERIT\
  \ LOGIN;\n```\n\n或者，如果我只想创建一个普通的无权限用户：\n\n```bash\n$ createuser -P -DRS kyle\n```\n\
  \n输入新密码：\n\n再次输入：\n\n如果你犯了错并想重试，或者你想删除用户，直接使用 `dropuser` 命令并将用户名作为参数。现在我已经创建了用户，可以为该用户创建一个数据库。`createdb`\
  \ 完成了所有繁杂工作；我只需要指定所有和数据库名称，在本例中是 `kyledatabase`。因此在我还是 `postgres` 用户时，输入以下内容：\n\n\
  ```\n$ createdb -O kyle kyledatabase\n```\n\n现在我可以输入 `exit` 退出 postgres shell 回到普通用户。作为普通用户可以使用\
  \ `psql` 命令访问数据库：\n\n```bash\n$ psql --password kyledatabase\n```\n\n现在，如果我的 PostgreSQL\
  \ 用户名与我的 shell 账户不同，这将报错，因为默认它尝试本地用户名。在这种情况下，我可以在命令末尾添加 PostgreSQL 用户名：\n\n```\n\
  $ psql --password kyledatabase kyle\n```\n\n### Ubuntu PostgreSQL 规范\n\n本节描述了 PostgreSQL\
  \ 的主要目录和文件位置及其用途：\n\n![Image](img/box.jpg) `/etc/postgresql/`\n\n在这里你可以找到系统中所有 PostgreSQL\
  \ 实例的主配置文件。由于不同 PostgreSQL 版本之间的配置文件可能不兼容，Ubuntu 为每个 PostgreSQL 版本提供了独立的子目录。这样你就可以在同一台机器上轻松地维护多个\
  \ PostgreSQL 版本。例如，Precise 下的默认 `postgresql` 包将安装 PostgreSQL 9.1 版本，因此其所有配置都位于 `/etc/postgresql/9.1/`\
  \ 下。\n\n\n\n\n\n![Image](img/box.jpg) `/etc/postgresql/9.1/main/postgresql.conf`\n\
  \n`/etc/postgresql/9.1/main/` 目录包含 PostgreSQL 9.1 的主配置文件，其中 `postgresql.conf` 是主要的配置文件。该文件有大量的注释，因此在更改选项时，可以使用该文件作为参考。\n\
  \n![Image](img/box.jpg) `/etc/postgresql/9.1/main/pg_hba.conf`\n\n这是存储所有主机身份验证信息的配置文件。在这里，你可以控制网络上的哪些主机可以访问\
  \ PostgreSQL 数据库。\n\n![Image](img/box.jpg) `/etc/postgresql/9.1/main/pg_ident.conf`\n\
  \n`pg_ident.conf` 文件允许你将服务器上的本地用户名映射到不同的 PostgreSQL 用户名。因此，如果你的本地用户名和 PostgreSQL\
  \ 用户名不匹配，你可以在这里添加映射，从而避免在每次运行 `psql` 时都必须将 PostgreSQL 用户名添加到命令行中。\n\n![Image](img/box.jpg)\
  \ `/etc/init.d/postgresql`\n\n这是 PostgreSQL 9.1 的初始化脚本。\n\n![Image](img/box.jpg)\
  \ `/var/log/postgresql/`\n\n与 MySQL 记录到 syslog 不同，PostgreSQL 将所有日志都分离在 `/var/log/postgresql`\
  \ 下。从那里，每个日志都根据其版本进行标记，因此 Precise 下默认的 PostgreSQL 9.1 数据库日志 `/var/log/postgresql/postgresql-9.1-main.log`。\n\
  \n## 基于 Web 的 PostgreSQL 管理\n\n如果你认为硬核 MySQL 管理员会对基于 Web 管理感到望而却步，那么你应该看看硬核 PostgreSQL\
  \ 管理员是如何反应的。尽管如此，如果你只是想创建一个由固的 PostgreSQL 数据库的网站，你可能会喜欢从 Web 管理数据库的简单性。与 MySQL 一样，有一个名为\
  \ `phpPgAdmin` 的基于 PHP 的管理工具。要安装 phpPgAdmin，你只需要安装 `phppgadmin` 包：\n\n```bash\n\
  sudo apt-get install phppgadmin\n```\n\n该包将下载所有的依赖项，包括尚未安装的 Web 服务器。一旦安装完成后，在 `/etc/apache2/sites-available`\
  \ 下为其 Apache 配置文件创建一个符号链接，然后使用 `a2ensite` 启用该站点：\n\n点击此处查看代码图像\n\n```bash\nsudo\
  \ ln -s /etc/phppgadmin/apache.conf /etc/apache2/sites-available/phppgadmin\nsudo\
  \ a2ensite phppgadmin\nsudo apache2ctl graceful\n```\n\n默认情况下，phpPgAdmin 配置为仅允许\
  \ localhost 访问该站点，因此要允许来自本地网络的访问，请打开 `/etc/phppgadmin/apache.conf` 并找到如下行：\n\n```\n\
  allow from 127.0.0.0/255.0.0.0\n```\n\n为了也允许 192.168.1.0 网络访问该工具，请添加：\n\n```\nallow\
  \ from 192.168.1.0/255.255.255.0\n```\n\n在另一个 `allow from` 行下方，然后运行 `sudo apache2ctl\
  \ graceful` 来重新加载你的更改。现在，你可以在网络上打开 Web 浏览器并浏览到 phpPgAdmin 主机上的 `/phppgadmin` 目录。如果它的\
  \ IP 地址是 192.168.1.7，你将浏览到 `http://192.168.1.7/phppgadmin/` 并看到图 5-5 中显示的默认 Web\
  \ 页面。\n\n![Image](img/05fig05.jpg)\n\n**图 5-5** phpPgAdmin 默认页面\n\n左侧边栏列出了所有可用的\
  \ PostgreSQL 服务器。默认情况下你配置了一个，只需点击它并使用你的 PostgreSQL 凭据登录并管理服务器。如图 5-6 所示，该界面与 phpMyAdmin\
  \ 不同，但与 phpMyAdmin 一样，你可以修改数据库、更改表并执行你可能想要的所有其他数据库管理操作。\n\n![Image](img/05fig06.jpg)\n\
  \n**图 5-6** phpPgAdmin 数据库管理\n\n## 文件服务器\n\n我想你可能从某种意义上认为 Web 服务器是文件服务器——它确实共享文件——但通常来说，当人们想到文件服务器时，他们想的是本地网络上一台具有大量存储空间、并允许网络上的多个主机访问和修改该服务器上文件的机器。Ubuntu\
  \ 有两种大多数人青睐的文件服务器：Samba 和 NFS。虽然两者都可以在多个平台上运行，但大多数管理员在客户端大部分为 Windows 时倾向于使用 Samba，在客户端大部分为\
  \ Linux 时倾向于使用 NFS。两者在 Ubuntu 上都都相对简单。\n\n### Samba\n\nSamba 是实现 Windows 文件共享协议\
  \ SMB 和 CIFS 的程序。因此，它是 Windows 下文件共享的理想平台，因为所有客户端都可以无需额外软件访问服务器。随着时间的推移，Samba 已增长支持\
  \ Windows 文件共享的高级部分，以至于它可以运行非常像任何其他 Windows 文件服务器或主域控制器。\n\n### 安装 Samba\n\n要安装\
  \ Samba，你可以在 Ubuntu 安装期间选择 Samba Server 选项，或者在安装后使用 `tasksel` 选择，或者你可以单独安装 `samba`、`samba-doc`、`smbfs`\
  \ 和 `winbind` 包：点击此处查看代码图像\n\n```bash\nsudo apt-get install samba samba-doc smbfs\
  \ winbind\n```\n\nSamba 服务将自动启动。\n\n### Ubuntu Samba\n\n此节描述了 Samba 的主要目录和文件位置：\n\
  \n![Image](img/box.jpg) `/etc/samba/`\n\n此目录包含 Samba 的所有配置文件，包括密码文件。\n\n![Image](img/box.jpg)\
  \ `/etc/samba/smb.conf`\n\n`smb.conf` 文件是 Samba 的核心配置文件，用于定义共享和全局设置。默认的 `smb.conf`\
  \ 有大量注释并设置了工作组等合理默认值。该文件包含许多共享示例，包括共享用户目录的示例，但默认这些共享都被注释掉了。\n\n初始化脚本已转换为 Upstart\
  \ 脚本，尽管仍旧的初始化脚本可用。这意味着你将使用标准的 Upstart 程序 `start`、`stop` 和 `status` 来管理服务。Samba 默认在启动时运行。\n\
  \n![Image](img/box.jpg) `/etc/init.d/smbd`\n\n与 smbd 初始化脚本一样，nmbd 初始化脚本现在也由 Upstart\
  \ 管理。\n\n![Image](img/box.jpg) `/usr/bin/smbpasswd`\n\n此工具用于创建 Samba 用户帐户。如果你想设置需要身份验证的\
  \ Samba 共享，你可以使用此工具创建 Samba 用户数据库。你添加的 Samba 用户名需要在系统中已经存在。例如，为了将 ubuntu 用户添加到 Samba，我会输入：\n\
  \n```bash\nsudo smbpasswd -a ubuntu\n```\n\n当我想要更改特定用户的密码时，可以使用此命令。要从 Samba 中删除用户，将\
  \ `-a` 选项替换为 `-x`。你还可以临时禁用 Samba 用户而不删除其帐户。要这样做，请使用 `-d` 和 `-e` 选项分别禁用和启用用户。\n\n\
  ![Image](img/box.jpg) `/usr/share/doc/samba/`\n\n如果你安装了 `samba-doc` 程序，可以在此目录下找到\
  \ Samba 文档和示例配置文件。\n\n![Image](img/box.jpg) `/var/lib/samba`\n\n此目录包含 Samba 使用的所有不同数据库，包括\
  \ `smbpasswd` 使用的用户和密码数据库。\n\n\n\n\nSamba 会登录到自己的目录，并为 `smbd` 和 `nmbd` 进程创建单独的日志文件（分别为\
  \ `log.nmbd` 和 `log.smbd`），同时为每个访问 Samba 的主机单独创建一个日志文件。这种组织方式可以让你更容易地缩小范围，找到你所需的日志信息。\n\
  \n### Samba 配置示例\n\n设置新 Samba 共享的好方法是阅读 `/etc/samba/smb.conf` 文件中的注释。这里有很多不同的示例，向你展示如何共享用户主目录或\
  \ CD-ROM 驱动器等。在这个示例中，我将展示如何共享位于 `/mnt/share` 的目录，以便网络上的每个人都可以访问并将其作为通用存储位置进行写入。用你喜欢的文本编辑器打开\
  \ `/etc/samba/smb.conf` 并移动到文件末尾。然后添加以下内容：\n\n```\n[general]\n    path = /mnt/share\n\
  \    comment = General Storage\n    writeable = Yes\n    browseable = Yes\n    guest\
  \ ok = Yes\n    force user = ubuntu\n```\n\n在这个示例中，我设置了 `/mnt/share` 目录，使得网络上的任何人都可以对其写入（`writeable\
  \ = Yes`, `guest ok = Yes`），并使用 `force user = ubuntu` 选项，这样当用户在共享上创建文件时，该文件将属于名为\
  \ `ubuntu` 的本地用户。当然，你可能希望将此用户从 `ubuntu` 更改为系统中存在的用户。现在我可以创建共享目录并确保其权限设置，使得本地 `ubuntu`\
  \ 用户可以对其写入：\n\n```\n$ sudo mkdir /mnt/share\n$ sudo chown ubuntu:ubuntu /mnt/share\n\
  ```\n\nSamba 的一个很棒特性是，我可以添加或调整像前面这样的共享，而无需重启 Samba。这非常方便，因为当你重启 Samba 时，任何访问共享上文件的用户将暂时与文件断开连接。某些程序对文件被拔走（即使是暂时的）反应非常糟糕，我甚至见过某些程序在发生这种情况时直接崩溃。\n\
  \n现在 Samba 已配置，，到网络上的另一台主机并尝试连接到你的 Samba 服务器。在 Ubuntu 桌面上，你将点击 `位置 > 连接到服务器...`，然后在“服务类型”下拉菜单中选择“Windows\
  \ 共享”。最后，你将输入 Samba 服务器的 IP 地址或主机名，然后输入共享名称 `general`（或你在 `smb.conf` 括号中放入的任何名称）。点击连接，Ubuntu\
  \ 将挂载并在桌面上显示已挂载的共享。\n\n### NFS\n\nNFS 是一种源自 UNIX 而非 Windows 的文件共享服务。如今，Linux 和 Windows\
  \ 都可以挂载 NFS 共享，但你仍然倾向于将 NFS 用于 Linux 或 UNIX 客户端网络。正如你将看到的，如果你想通过 NFS 共享目录，涉及并不复杂。\n\
  \n### 安装 NFS\n\n要安装 NFS，请在包管理器中选择 `nfs-kernel-server`。这将下载并安装该服务以及所需的任何额外依赖项。\n\n\
  ```\n$ sudo apt-get install nfs-kernel-server\n```\n\n软件包安装后，NFS 就可以准备好配置了。默认情况下不会配置任何\
  \ NFS 导出，因此在显式配置之前，没有任何内容会被共享。\n\n### Ubuntu NFS 规范\n\n此节描述了 NFS 的主要目录和文件位置及其用途：\n\
  \n![Image](img/box.jpg) `/etc/exports`\n\n这是 NFS 的核心配置文件，包含了 NFS 将向用户导出的所有文件系统列表。\n\
  \n![Image](img/box.jpg) `/etc/init.d/nfs-kernel-server`\n\n此初始化脚本控制 NFS 服务器并接受标准的初始化脚本选项列表，包括\
  \ `reload`，这样你就可以在不重启服务的情况下加载配置。\n\n![Image](img/box.jpg) `/var/log/syslog`\n\n\
  NFS 以 `NFSD` 进程的形式记录到标准的 syslog 文件。如果远程主机无法访问共享且你想追踪具体是哪里失败了，就在这里查找。要仅查看此文件的 NFS\
  \ 日志，运行 `sudo grep NFSD /var/log/syslog`。\n\n### NFS 配置示例\n\n添加 NFS 共享相对简单，所有的工作都在\
  \ `/etc/exports` 文件中完成。该文件的语法在 exports man 页面中有详细介绍，你可以通过输入 `man 5 exports` 访问。通常，该文件每行包含一个导出，每行有两个由一个或多个空格分隔的列。第一列是要共享的目录的路径，第二列是允许访问共享的主机或网络，以及一组在括号内的选项。\n\
  \n我创建了一个类似于我在 Samba 部分提供的示例的示例共享。为了做到这一点，我需要在 `/etc/exports` 中添加以下行：\n\n```\n/mnt/share\
  \ 192.168.1.0/255.255.255.0(rw)\n```\n\n现在，如果 `/mnt/share` 目录不存在，我设置它：\n\n```\n\
  $ sudo mkdir /mnt/share\n$ sudo chown ubuntu:ubuntu /mnt/share\n```\n\n最后，我可以重载\
  \ NFS 来启用此设置：\n\n```\n$ sudo service nfs-kernel-server reload\n```\n\n一旦 NFS 重载，我就可以去网络上的任何主机并挂载共享。如果\
  \ NFS 服务器位于 `192.168.1.7` 且我想将其挂载到 `/mnt/local`，我将输入：\n\n```\n$ sudo mount -t nfs\
  \ 192.168.1.7:/mnt/share /mnt/local\n```\n\n如果你的 Ubuntu 主机收到关于错误文件系统的错误，你可能没有在系统中安装\
  \ NFS 客户端支持。只需运行\n\n```\n$ sudo apt-get install nfs-common``````### NFS 用户权限\n\n\
  NFS 一个有趣且具有争议的特性是它是如何处理用户权限的。当你挂载 NFS 共享时，文件所有权将基于 NFS 服务器上的用户 ID。为了让远程系统上的用户能够读取和写入共享，它们的用户\
  \ ID 需要与 NFS 服务器匹配。如果你使用 LDAP 或其他系统来跨服务器保持用户 ID 一致，这不会产生太大问题，但例如，如果我的 NFS 服务器上的\
  \ `ubuntu` 用户 ID 为 `1000`，而我的客户端上的 `ubuntu` 用户 ID 为 `1001`，则客户端将无法写入挂载点。\n\nNFS\
  \ 权限另一个感兴趣的问题是它是如何处理 root 的。在 Ubuntu 上，默认情况下 root 账户会被压缩（squashed），因为 NFS 会阻止远程\
  \ root 用户以其 root 权限访问共享。否则，网络上任何带有 Ubuntu Live 光盘的主机都可以启动它、挂载 NFS 共享并读取和写入该共享上的任何文件，无论权限如何。考虑到这个安全问题，你可能仍然想禁用\
  \ root 压缩。要这样做，请 `/etc/exports` 中的导出选项列表中添加 `no_root_squash` 选项。每个选项用逗号分隔，因此如果我想在我之前创建的共享上禁用\
  \ root 压缩，文件将如下所示：\n\n```\n/mnt/share 192.168.1.0/255.255.255.0(rw,no_root_squash)\n\
  ```\n\n\n\n\n\n由社区驱动的 Edubuntu 项目旨在为 Ubuntu 创建一个专为中等教育定制的扩展。Edubuntu 作为一个面向教师和管理员的工具平台而存在。但当然，真正的动力和目的是将免费的开源软件交到孩子们手中。通过这种方式，Edubuntu\
  \ 为孩子们提供了一个灵活且强大的技术环境，用于学习和实验。基于自由软件，它提供了可破解的教育技术，并最终可以供学生和教师`按照自己的方式`使用。由于它是免费分发的，这种免费性质满足了学校的重要需求，因为学校的技术计划往往面临人手和资金不足的问题。精通\
  \ Ubuntu 和自由软件的那些目前正在使用 Edubuntu 成长的孩子们，正向 Ubuntu 社区展示着其未来的发展方向，以及可能带我们走向那里的下一代\
  \ Ubuntu 用户。\n\n虽然 Ubuntu、Kubuntu 和 Xubuntu 桌面分别凸显了 GNOME、KDE 和 Xfce 社区的产物，但 Edubuntu\
  \ 项目提供了 Ubuntu 中所有的精华——为学校环境进行了量身定制，并且尽可能易用。让 Edubuntu 流行的原因之一是其惊人的瘦客户端集成能力，允许使用一台强大的机器（服务器）为许多低功耗、通常无磁盘的机器（客户端）提供整个操作系统。（请参下一节获取更多信息。）这种模式对于大多数家庭或商业用户的工作站和笔记本电脑来说毫无意义，但在教室环境中是一项主要特性，它可以减轻配置和维护的烦恼，并大幅降低教室部署的成本。\n\
  \n## 什么是 LTSP？\n\nLTSP 代表 终端服务器项目（Linux Terminal Server Project）。它为当前的客户端/服务器模型提供了与多年前盛行的大型机/哑终端设置相同的功能。\n\
  \nLTSP 模式以一台充当服务器的强大机器为中心，连接着几台通常功率低得多的作为客户端的机器。所有机器都连接在局域网上。\n\n该网络允许启动客户端计算机所需的数据（这些数据通常存储在客户端的硬盘上）通过网络传输给客户端。如果启动计算机所需的所有数据通过网络提供，客户端机器完全不需要存储介质，这就产生了\
  \ `diskless clients`（无磁盘客户端）一词。\n\n***\n\n**提示**\n\n客户端需要网卡，可以通过 `PXE` 或 `Etherboot`\
  \ 启动，以便在网络接力启动之前允许本地介质进行初始启动。更多信息可以在 `http://rom-o-matic.com` 找到。\n\n***\n\n## LTSP\
