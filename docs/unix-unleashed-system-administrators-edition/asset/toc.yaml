  - 受限 shell Korn 以受限 shell 模式运行，防止用户使用 cd 命令、修改 PATH、重定向输出以及全路径调用命令。此选项仅对系统管理员设置特殊用户账户。如果调用的是其名称的第一个字符或
    r，Korn也会作为受限 shell启动。（例如，复制或使用链接到 ksh，然后运行 rsh 的结果与 ksh-r 相同）。rsh 形式存在是因为，如果 ksh
    在密码数据库 /etc/passwd 中定义为登录 shell，则无法保证 ksh-r 运行受限 shell。）
