  md: "```\nint status = 0;\nwait(&status);\\ptrace(PTRACE_CONT, getppid(), NULL,\
    \ NULL);\n\n// handle any signals that may come in tracees\nwhile (true) {\n \
    \   int pid = wait(&status);\n    if (status >> 16 == PTRACE_EVENT_FORK) {\n \
    \       // follow the fork\n        long newpid = 0;\n        ptrace(PTRACE_GETEVENTMSG,\
    \ newpid, NULL, NULL, &newpid);\n        ptrace(PTRACE_ATTACH, newpid, NULL, NULL);\n\
    \        ptrace(PTRACE_CONT, newpid, NULL, NULL);\n    }\n}\n}\n```\n\nThe code\
    \ above will fork() a child process that becomes the tracer of the parent Trouble\
    \ process via PTRACE_ATTACH. It will also automatically begin tracing any forks\
    \ that Trouble due to the PTRACE_SETOPS call. This largely addresses the issues\
    \ that we had with the PTRACEME method because we now know the tracing program:\
    \ Trouble! This also addresses the issues we had with SIGTRAP. No one can simply\
    \ attach to the main Trouble process since it is being traced by a child.\n\n\
