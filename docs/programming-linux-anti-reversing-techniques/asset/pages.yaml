  md: "Chapter 3: File Format Hacks\n\n# chap_3_format_hacks/mixDynamicSymbols/CMakeLists.txt\n\
    \n```\nproject(mixDynamicSymbols CXX)\nmake_minimum_required(VERSION 3.0)\n\n\
    set(CMAKE_FLAGS \"Wall -Wextra -Wshadow\")\nadd_executable(${PROJECT_NAME} src/mixDynamicSymbols.cpp)\n\
    ```\n\n# chap_3_format_hacks/mixDynamicSymbols/src/mixDynamicSymbols.cpp\n\n```\n\
    #include <cstdlib>\n#include <iostream>\n#include <fstream>\n#include <iomanip>\n\
    #include <string>\n#include <elf.h>\n#include <vector>\n```\n\n```\n/*\n* This\
    \ tool takes an ELF binary that has a sections table and uses dynamic\n* linkage\
    \ and attaches a fake dynamic symbol table at the end of the binary.\n* Then the\
    \ symbol names in the fake symbol table are mixed. This will cause\n* disassemblers\
    \ in the place too much trust in the sections table, like IDA,\n* to display the\
    \ wrong symbol name in the disassembly.\n*/\n```\n\n```\n/*\n* Finds the SHT_DYNSYM\
    \ in the sections table, points the offset to the end\n* of the binary, and copies\
    \ the existing dynym to the end of the binary. Then\n* loops over the symbols\
    \ in the new dynym and changes all the name offsets\n*\n* @param[in,out] p_data\
    \ the ELF binary we are modifying\n* @return true if we didn't encounter error\
    \ and return false otherwise\n*/\n```\n\n```\nbool append_dynym(std::string& p_data)\n\
    {\n    if (p_data[0] != 0x7f || p_data[1] != 'E' || p_data[2] != 'L' ||\n    \
    \    p_data[3] != 'F') {\n        std::cerr << \"Bad magic.\" << std::endl;\n\
    \    }\n}\n```"
