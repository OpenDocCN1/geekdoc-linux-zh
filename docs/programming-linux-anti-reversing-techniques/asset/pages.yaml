  md: 'Chapter 3: File Format Hacks


    79


    # man elf


    The sixth byte-specific data specifies the data encoding of the processor-specific
    data in the file. Currently, these encodings are supported:


    | EI_DATA | |

    | --- | --- |

    | ELFDATONE | Unknown data format. |

    | ELFDATA2LSB | Two''s complement, little-endian. |

    | ELFDATA2MSB | Two''s complement, big-endian. |


    If you think about it, it sort makes sense that this field isn''t necessary to
    execute a binary. A system is either little-endian or big-endian (its ARM which
    can be bi-endian). As such, a loader properly doesn''t need to check this byte
    because it can execute one or the other.


    However, tools like readelf, Radare2, and IDA are expected to read files from
    many architectures. This byte is important for them to determine the endianness
    of the binary. So what happens if you insert a lie?


    Look at what readelf currently says about the EI_DATA in Trouble (it appears in
    both the "Magic" and "Data" lines):


