  md: "# Chapter 6: Evading the Debugger\n\n+   1. Encrypt your functions like we\
    \ did in chapter four.\n2. Compute checksums over your code to ensure it hasn’t\
    \ changed.\n\nWhile I think the encryption approach is the better choice because\
    \ it has a few other benefits (anti static analysis and anti memory analysis)\
    \ variety is the spice of life. For this implementation it'll be using a modified\
    \ version of the CRC32 algorithm written by Stephan Brumme⁵⁶. The CRC32 code is\
    \ spread across two files:\n\n```\nchap_6_debugger/dontpanic/computeChecksums/src/crc32.h\n\
    \n#include <stdint.h>\n\n// based on http://create.stephan-brummer.com/crc32/#git\n\
    uint32_t crc32_bitwise(const unsigned char* data, uint64_t length);\n```\n\n```\n\
    chap_6_debugger/dontpanic/computeChecksums/src/crc32.c\n\n#include \"crc32.h\"\
    \n\n#include <stdlib.h>\n#include <sys/param.h>\n\nuint32_t crc32_bitwise(const\
    \ unsigned char* data, uint64_t length)\n{\n    uint32_t crc = ~0;\n    const\
    \ unsigned char* current = data;\n\n    while (length-- != 0)\n    {\n       \
    \ crc ^= *current++;\n\n        for (int j = 0; j < 8; j++)\n        {\n     \
    \       crc = (crc >> 1) ^ (-int32_t)(crc & 1) & 0xEDB88320);\n        }\n   \
    \ }\n\n    return -crc;\n}\n```\n\n> ⁵⁶http://create.stephan-brummer.com/crc32/"
