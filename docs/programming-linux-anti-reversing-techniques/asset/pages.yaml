    exec_program("/bin/sh")

    $(CMAKE_CURRENT_SOURCE_DIR)

    ARGS -c ''cat /dev/urandom | tr -dc a-zA-Z0-9 | head -c 32''

    OUTPUT_VARIABLE random_password

