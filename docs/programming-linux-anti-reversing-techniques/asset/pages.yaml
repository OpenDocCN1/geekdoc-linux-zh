    # -O


    An often overlooked subject is that of optimization. You control the many ways
    the compiler tries to improve the performance or size of your program through
    the optimization flags. There are many flags¹⁹, so it’s helpful that GCC has combined
    many of them under various “O” flags. While there are more “O” flags, I believe
    the following four are most useful:


    > ¹⁹https://gcc.gnu.org/onlinedocs/gcc/Optimize-Options.html'
