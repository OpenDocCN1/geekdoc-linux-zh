  md: 'Chapter 2: Compiler Options


    Setting up musl-dev (1.1.9-1) ...

    Setting up musl-tools (1.1.9-1) ...


    To update Trouble to use the -static flag you just update the compiler flags.


    ```

    set(CMAKE_C_FLAGS "-Wall -Wshadow -s -fvisibility=hidden -O03 -funroll-loops -\nstatic
    -std=gnu1")

    ```


    Also, you need to tell CMake to use a different compiler. Put the following line

    above the CMAKE_C_FLAGS line:


    ```

    set(CMAKE_C_COMPILER musl-gcc)

    ```


    And that''s it! Now when you compile Trouble you''ll be using musl libc instead

    of glibc.


    # Size matters


    I wanted to see the size difference between static linking with glibc and

    musl libc. I compiled Trouble using each library and the results are really

    telling:


    Is -l on the glibc version of Trouble


    ```

    albino-lobster@ubuntu:~/antire_book/chap_2_compiler/trouble/build$ ls -l - ./trouble

    -rwxxr-x 1 albino-lobster albino-lobster 840632 Nov 3 17:32 trouble

    ```


    Is -l on the musl libc version of Trouble


    ```

    albino-lobster@ubuntu:~/antire_book/chap_2_compiler/trouble/build$ ls -l - ./trouble

    -rwxxr-x 1 albino-lobster albino-lobster 9560 Nov 3 17:44 ./trouble

    ```


    You there have it. 840kb vs 9.5kb. A huge difference in size:


    You might be asking, how do I know I''m no longer using any dynamic libraries?
    One

    way is to check the needed shared library''s listed in the dynamic section. You
    can

    use reread to this.'
