  md: "# Chapter 4: Fighting Off String Analysis\n\nabove the check_password function.\n\
    \n```\nextern void* check_password_size;\n```\n\nIf you recompile and include\
    \ for check_password_size in the symbol table you won't find it. The reason is\
    \ that you haven't added the logic to the linker script yet. Unfortunately, this\
    \ is one of the few cases that CMake fails us. There is no way to actually pass\
    \ a script to the linker in CMake. I was forced to hack it in. Trouble's CMakeList.txt\
    \ was updated to look like this:\n\nUsing sed to insert the linker script into\
    \ CMake\n\n```\nproject(trouble C)\ncmake_minimum_required(VERSION 3.0)\n```\n\
    \n```\n# This will create a 32 byte \"password\" for the bind shell. This command\n\
    # is only run when \"cmake\" is run, so if you want to generate a new password\n\
    # then `cmake ..` should be run from the command line.\nexec_program(\"/bin/sh\"\
    \n  ${CMAKE_CURRENT_SOURCE_DIR}\n  ARGS -c 'cat /dev/urandom | tr -dc a-zA-Z0-9\
    \ | head -c 32'\n  OUTPUT_VARIABLE random_password)\n```\n\n```\n# Pass the random\
    \ password into ${PROJECT_NAME} as a macro\nadd_definitions(-Dpassword=\\$(random_password)\
    \ -Dpassword_size=33)\n```\n\n```\nset(CMAKE_C_COMPILER gcc-misc)\nset(CMAKE_C_FLAGS\
    \ \"-Wall -Wextra -Wshadow -03 -funroll-loops -fno-asynchronous-unwind-\ntables\
    \ -static -std=gnu1\")\nadd_executable(${PROJECT_NAME} src/trouble.c)\n```\n\n\
    ```\nadd_custom_target(addDLDS\n  COMMAND sed -i 's,-o,$${CMAKE_CURRENT_SOURCE_DIR}/trouble.layout_'\n\
    \  ls -o,g '${CMakeFiles}/trouble/dir/link.txt)\n```\n\n```\nadd_dependencies(${PROJECT_NAME}\
    \ addDLDS)\n```\n\n```\n# After the build is successful, display the random password\
    \ to the user\nadd_custom_command(TARGET ${PROJECT_NAME} POST_BUILD\n  COMMAND\
    \ ${CMAKE_COMMAND} -E echo\n  \"The bind shell password is: \\${random_password}\"\
    )\n```"
