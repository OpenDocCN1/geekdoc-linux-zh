    # Using musl


    If you want to write a truly hardened binary it''s best to distrust all of the
    shared libraries on this system. According to the GCC documentation, -static “prevents
    linking with the shared libraries”²⁸. However, glibc, the lib version shipped
    with many major Linux distros, is really not meant to be statically linked. If
    we statically link it, some lib functionality gets broken and makes our binary
    significantly larger The fact of the matter is that glibc simply should not be
    used for static linking. Luckily, there are other versions of lib that are intended
    to be statically linked²⁹.


