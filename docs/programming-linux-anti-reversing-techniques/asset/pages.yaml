    \ sections in the section table\n* @param[in,out] p_str_index the index of the\
    \ sections string table\n* @return a pointer to the start of the sections table\n\
    */\n```\n\n```\nElf64_Shdr* find_sections(std::string& p_data, int& p_sec_count,\
    \ int& p_str_index)\n{\n    if (p_data[0] != 0x7f || p_data[1] != 'E' || p_data[2]\
    \ != 'L' || p_data[3] != 'F')\n    {\n        return NULL;\n    }\n\n    Elf64_Ehdr*\
    \ ehdr = reinterpret_cast<Elf64_Ehdr*>(&p_data[0]);\n\n    Elf64_off section_offset\
    \ = ehdr->e_shoff;\n    ehdr->e_shoff = 0;\n\n    p_sec_count = ehdr->e_shnum;\n\
    \    ehdr->e_shnum = 0;\n\n    p_str_index = ehdr->e_shstrndx;\n    ehdr->e_shstrndx\
