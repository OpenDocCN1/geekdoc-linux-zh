  md: '# Chapter 6: Evading the Debugger


    However, if you execute Trouble without GDB then it executes without issue. What’s
    the deal? The new code you added makes a call to ptrace using PTRACE_TRACEME.
    If Trouble wasn’t started with GDB then this PTRACE_TRACEME call sets the parent
    program as tracing program. In this case, the parent program is `/bin/bash`. To
    confirm this, run Trouble and check it’s `/proc/<pid>/status file. Here is an
    example of what you should see.


    Observing the tracer pid in albino-lobster@ubuntu:-$ cat /proc/pid/pidof trouble/status


    ```

    Name:           trouble

    State:          S (sleeping)

    Tgid:           59935

    Ngid:           0

    Pid:            59935

    PPid:           2402

    TracerPid:      2402

    ```


    The two most important lines in the above are “PPid” (parent pid) and “TracerPid”.
    Both of these show the value of 2402. You can confirm that is bash by using the
    ps command.


    albino-lobster@ubuntu:-$ ps f


    ```

    PID TTY      STAT TIME COMMAND

    2835 pts/17 Ss       00:00 \_

    59935 pts/1 R+       00:00  ps f

    2402 pts/1 Ss       00:01 bash

    59935 pts/1 S+       00:00 \_ ./trouble

    ```


    If Trouble was executed via GDB then the PTRACE_TRACEME call you added would fail
    and Trouble will exit. This is because Trouble is already being traced by GDB
    it can’t set the parent process as the tracer. Remember there can only be one
    tracer at a time. In this way we prevent brace pid debugger from attaching to
    Trouble. As another example, consider the gcore utility. gcore is a tool that
    produces core dumps of running programs. This is particularly useful if a program
    is using a cryptor, like Trouble does, because the dump will capture the unencrypted
    version of the program which can then be loaded into IDA or another disassembler.
    However, if we use the PTRACE_TRACEME logic then gcore will fail.'
