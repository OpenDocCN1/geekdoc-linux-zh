    # # Hiding FUNC symbols


    As you can see from the above, the password for the bind shell is easily retrievable.
    However, you can use a GCC compile flag to remove the check_password symbol and
    prevent a reverse engineer from yet, easily dumping the password. The GCC flag
    is “visibility-hidden”18 and when you add it to Trouble’s compiler options it
    would look like this:


    Using “visibility-hidden” will, hide all possible symbols. That means that check_password()
    would be hidden in the chapter version of Trouble.


    # ## Static functions


    We could also have hidden the check_password symbol by using the static keyword
    in the function definition. In fact, if a function is not going to be used outside
    of the file (or translation unit) it is considered best practice to make the function
    static.


    > 18https://gcc.gnu.org/onlinedocs/gcc-4.6.0/gcc/Code-Gen-Options.html'
