  md: "# Chapter 4: Fighting Off String Analysis\n\nPsudo code for badly computing\
    \ a functions size\n\n```\nvoid a_function()\n{\n}\nvoid b_function()\n{\n}\n\
    void c_function()\n{\n  int a_function_length = b_function - a_function();\n}\n\
    ```\n\nThis method makes the assumption that, when compiled, b_function() will\
    \ immediately follow a_function(). This might work. It might not. It totally depends\
    \ on what the compiler decides to do with your code. A fool proof of finding a\
    \ function's size is to use a linker script*. The linker script describes how\
    \ sections are mapped in the binary. Normally, you don't worry about the linker\
    \ script because the linker uses an internal script. You can see the default internal\
    \ script by passing the verbose option to the linker (note that the following\
    \ output is truncated because it goes on for a while).\n\nFinding the default\
    \ linker script\n\n```\nalbino-lobster@ubuntu:~$ gcc empty.c -Wl,--verbose\nGNU\
    \ ld (GNU Binutils for Ubuntu) 2.26.1\nSupported emulations:\nelf_x86_64\nelf_32_x86_64\n\
    elf_i386\nelf_iamcu\ni386linux\nelf_l1om\nelf_k1om\ni386pep\ni386pe\n```\n\n>\
    \ *https://sourceware.org/binutils/docs/ld/Scripts.html#Scripts"
