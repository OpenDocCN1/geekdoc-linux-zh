  md: "# Chapter 6: Evading the Debugger\n\nMADV_DONTUMP (since Linux 3.4) Exclude\
    \ from a core dump those pages in the range specified by addr and length. This\
    \ is useful in applications that have large areas of memory that are not known\
    \ to be useful in a core dump. The effect of MADV_DONTUMP takes precedence over\
    \ the bit mask that is set via the /proc/PID/coredump_filter file (see core(5)).\n\
    \nUsing madvise(), you can prevent gdb from dumping Trouble has been executed.\
    \ The only real challenge is to programmatically find the addresses to pass to\
    \ madadvise(). To do this I created another post-compilation tool under madadvise.\
    \ The project, as usual, contains two files.\n\nchap_6_debugger/dontpanic/madvise/CMakeLists.txt\n\
    \n```\nproject(madvise CXX)\ncmake_minimum_required(VERSION 3.0)\n```\n\n```\n\
    set(CMAKE_CXX_FLAGS \"-Wall -Wextra -g\")\n```\n\n```\nadd_executable(${PROJECT_NAME}\
    \ src/madvise.cpp)\n```\n\nchap_6_debugger/dontpanic/madvise/src/madvise.cpp\n\
    \n```\n#include <cstdlib>\n#include <iostream>\n#include <fstream>\n#include <iomnip>\n\
    #include <cstring>\n#include <elf.h>\n```\n\n```\n/*\n * Parse the program headers\
    \ and store the address/size of the first LOAD.\n * the section headers table\
    \ looking for \".madvise_base_addr\" and \".madvise_size\"\n * where we'll store\
    \ the address and size we pulled from the LOAD segment.\n * \\param[in,out] p_data\
    \ the ELF binary\n * \\return true if we found both .madvise sections\n */\nbool\
    \ add_advise_info(std::string& p, p_data)\n```"
