- img_proc: true
  md: "# 64-bit ELF64_section header struct\n\n```\nstruct Elf64_Shdr\n{\n    uint32_t\
    \ sh_name;\n    uint32_t sh_type;\n    uint64_t sh_flags;\n    Elf64_Addr sh_addr;\n\
    \    Elf64_Off sh_offset;\n    uint64_t sh_size;\n    uint32_t sh_link;\n    uint32_t\
    \ sh_info;\n    uint64_t sh_addralign;\n    uint64_t sh_entsize;\n};\n```\n\n\
    The three fields this technique is concerned with sh_addr (the virtual address),\
    \ sh_offset (the physical offset), and sh_size. It's also important to note that\
    \ the entry point address in the ELF header is the virtual address.\n\nNow, let's\
    \ say you have a virtual address and you want to look up the actual location in\
    \ the binary. You look at the section headers table and find which section the\
    \ address would fall within calculating the range of sh_addr and sh_addr + sh_size.\
    \ Once you've found the section, you'll want to calculate the physical offset\
    \ of your virtual address by subtracting the sh_addr and adding the sh_offset.\
    \ You should now know the exact offset into the binary where you can find your\
    \ virtual address.\n\nHowever, if we put in a box value for sh_addr How does that\
    \ break the calculation? Let's say we have the following values:\n\n```\nvirtual_address\
    \ = 0x4002f0\nsh_addr = 0x0400000\nsh_size = 0x0000800\nsh_offset = 0\n```\n\n\
    Normally, you'd be able to find 0x4002f0 bytes into the file by 0x2f0 ((0x4002f0\
    \ - 0x400000) + 0). However, if you introduce a little lie and say sh_addr = 0x400010\
    \ then the calculation changes. Now the math comes out that 0x4002f0 is 0x2e0\
    \ bytes into the file."
