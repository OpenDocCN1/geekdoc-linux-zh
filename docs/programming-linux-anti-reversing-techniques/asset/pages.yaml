    \ point correctly. It appears that this is only useful against IDA, but it is\
    \ still a useful tool to keep in our toolbox.\n\n# Mixing the Symbols\n\nThis\
    \ chapter, so far, emphasized file format hacks using the statically compiled\
    \ Trouble. However, this section will discuss an anti reverse engineering technique\
    \ that requires the dynamic symbol table to be present. There, you'll have to\
    \ revert back to using the one version of Trouble for this section.\n\nI saw this\
    \ in a blog post written by Andrew Pawlowski¹⁵. In this technique, you'll append\
    \ a fake dynamic symbol table to the end of the binary. Then you'll repoint the\
    \ offset in the .dynymsection header to point to the fake symbol table. Finally,\
    \ you'll mix all of the symbol name pointers for FUNC symbols. This will cause\
    \ the disassemblers that rely on the symbols section, inside of the program headers,\
    \ to display incorrect function names in the disassembly.\n\nI wrote a tool to\
    \ mix the dynamic symbols. You can find it in the chapter three directory under\
    \ mixDynamicSymbols. There are two files in the project: CMakeLists.txt and mixDynamicSymbols.cpp.\n\
    \n> ¹⁵https://bdes.org/index.php?blog/archives/346-ELF-obfuscation-let-analysis-tools-show-wrong-external-symbol-calls.html"
