  md: '# Preface


    +   2. Hiding Network Communication: Understanding a binary’s network communication
    is a huge aid in reverse engineering. However, this topic is too deep to do justice
    within these pages.


    +   3. Rootkit Topics: Hiding and persistence are out of scope.


    +   4. Anything Related to the Kernel: This book focuses only on userland binaries.


    # Prerequisites


    The reader should have access to a Linux host using the x86-64 architecture. The
    code for this book was written and tested on Ubuntu 16.04.


    This book does discuss the use of IDA, but I understand that the high cost of
    IDA is a non-starter for many. Therefore, I’ve done my best to also include examples
    using Radare2 and Hopper.


    Finally, the code for this book is largely written in C with a small amount of
    x86-64 assembler. Some of the tooling is written in C++. However, I do not expect
    the reader to be well versed in any of these languages. Part of the beauty of
    having complete code examples to work from is that it gives the author a chance
    to point out any idiosyncrasies and provides the reader the oppunity to pull apart
    the code on their own time.


    # Code and Command Output


    All the code is available on Github: https://github.com/antire-book/antire_book.
    I understand that the reader may not always be close to a computer or have access
    to GitHub in order to browse the book’s code. As such, all of the code is also
    listed within the book. I know some people don’t like that, but since the code
    is essential to this book I can’t have the reader without.


    Also related to formatting, any output from a command line tool included in this
    book will generally include all of the output. For example, when GDB prints out
    a lot of version, license, and help information. I won’t cut any of that. I want
    the reader to be able to match the output from their computer with what I’ve listed
    in the book. This largely aids in troubleshooting any issues the reader runs into.'
