  md: "# Chapter 4: Fighting String Analysis\n\nsince each character's hex representation\
    \ is visible in the disassembly. Let's go one step further and XOR each byte so\
    \ that the reverse engineer can't just read the values straight from the disassembly.\n\
    \nBefore you add in the new XOR logic consider if you had one hundred of these\
    \ strings that need to be obfuscated. It's not really reasonable to write them\
    \ out as arrays every single time is it? Let use macros to automate this. What\
    \ is a macro exactly? GCC's documentation calls it \"a fragment of code which\
    \ has been given a name^38. For our purposes, you can consider macros to be a\
    \ simple and replace mechanism. When you compile the preprocessor will find all\
    \ calls to the macros and replace them with the actual code defined in the macro.\
    \ Understand that this is an oversimplification but it's enough to understand\
    \ the basics.\n\nI would love to present you with a beautiful recursive macro\
    \ that pretty creates the stack string. Reality isn't as beautiful as we've liked.\
    \ Recursive macros aren't possible in C (or C++ for that matter). Therefore, you're\
    \ forced to create a new macro for each index in the string. Luckily, I've written\
    \ it for you.\n\nchap_4_static_analysis/dontpanic/trouble/src/xor_string.h\n\n\
    ```\n/*\n * The Macros below can be used to generate a stack string that has been\n\
    \ * obfuscated by a given \"key\" (ie 0xaa). The macros are listed from 0-31.\n\
    \ * The length of the string is the number in the macro name. For example, if\
    \ I\n * have an 8 byte string I want to obfuscate then I'd use XOR_STRING7. Why?\n\
    \ * Because the macros start at @.\n */\n\n#define XOR_STRING0(storage, string,\
    \ key) storage[0] = string[0] ^ key;\n#define XOR_STRING1(storage, string, key)\
    \ storage[1] = string[1] ^ key \\\nXOR_STRING0(storage, string, key), storage[2]\
    \ = string[2] ^ key \\\nXOR_STRING1(storage, string, key), storage[3] = string[3]\
    \ ^ key \\\nXOR_STRING2(storage, string, key), storage[4] = string[4] ^ key \\\
    \nXOR_STRING3(storage, string, key), storage[5] = string[5] ^ key \\\nXOR_STRING4(storage,\
    \ string, key);\n```\n\n> ^38https://gcc.gnu.org/linedocs/gcc-5.1.0/cpp/Macros.html"
