  md: '# Chapter 3: File Format Hacks


    This is a technique you use to hide the entry point. If you add a fake section
    headers table and alter the base address of the section that contains the entry
    point then any disassembler relying exclusively on the sections headers table
    won''t be able to properly find the entry point in the file.


    I wrote some code that will do so you can examine it further. The project is called
    fakeHeadersHideEntry and can be found in the chapter directory. There are two
    files: CMakeLists.txt and fakeHeadersHideEntry.cpp.


    chap3_format_hacks/fakeHeadersHideEntry/CMakeLists.txt


    ```

    project(fakeHeadersHideEntry CXX)

    cmake_minimum_required(VERSION 3.0)


    set(CMAKE_C_FLAGS "-Wall -Wextra -Wshadow")

    add_executable(${PROJECT_NAME} src/fakeHeadersHideEntry.cpp)

    ```


    chap3_format_hacks/fakeHeadersHideEntry/src/fakeHeadersHideEntry.cpp


    ```

    #include <cstdlib>

    #include <iostream>

    #include <fstream>

    #include <iomanip>

    #include <cstring>

    #include <ctime>

    #include <elf.h>

    ```


    > /*

    * This tool will cause disassemblers that rely on the sections table for

    * virtual address mapping to fail to correctly find the entry point. This

    * tool expects the binary to have no sections table. It will add

    * its own fake table with four sections:

    *

    * null header

    * .text: the section code is in. This will have an altered sh_addr.

    * .data: the r/w data section

    * .shstrtab: the strings table.

    *

    * This code makes the assumption that the binary has two PF_LOAD segments

    * the program table. One segment with PF_X set and one with PF_W set.

    */'
