  md: '# Chapter 2: Compiler Options


    Focus on the “flags” column in the output above. The .dynym section has the “A”
    flag where, .symtab has no flags. The “A” flag means that .dynym will be loaded
    into memory when the program is started. Lacking the “A” flag means that .symtab
    is not loaded into memory and is therefore not necessary to execute the program.
    You can safely remove the entire .symtab from the binary.


    # Finding the Bind Shell Password Using .symtab


    Why you would want to strip away the .symtab? Look at the readelf –syms output
    above you to see this line:


    ```

    38: 0000000000400f00  33 OBJECT LOCAL DEFAULT  16 s_password

    ```


    Even though you''ve excluded the debugging information from Trouble table makes
    finding and extracting the password trivial. You can use hexdump again.


