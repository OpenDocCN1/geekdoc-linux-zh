    # Looking at FUNC symbols


    In the previous section, you removed the .symtab in order to deny a reverse engineer
    useful data. However, if you look at the .dynsym you''ll still find useful information.
    Specifically these two symbols:


    ```

    24: 000000000000400c06 41 FUNC GLOBAL DEFAULT 14 check_password

    30: 000000000000400c2f 558 FUNC GLOBAL DEFAULT 14 main

    ```


    These FUNC symbols are associated with the main() and check_password() functions
    in Trouble. The .dynsym provides both the starting address of the function as
    well as its size. These are really useful pieces of information for a disassembler!


    For example, looking at the check_password() function that check_password points
    at in Radare2 you can easily find password.


