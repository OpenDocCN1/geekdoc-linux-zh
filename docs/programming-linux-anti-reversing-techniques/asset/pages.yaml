  md: '# Preface


    # Why Read This Book?


    There are many articles and books that talk about anti-reverse engineering techniques
    and how to break them. However, the writing is often limited to small code snippets
    or a screenshot of assembly in IDA. This book seeks to be different by starting
    with a simple program you''ll update with anti-re techniques as you progress through
    the book. This gives the reader the opportunity to compile and analyze the binary
    on their own. I believe the emphasis on the “proof of concept” makes this book
    unique.


    Another unique aspect of this book is the emphasis on Linux anti-reverse engineering.
    Hackers have been writing about these techniques since the late 90''s, but much
    of what has been written across the internet. This book attempts to coalesce a
    majority of techniques and present them to the reader as one unit.


    Finally, a lot of the proof of concept code that currently exists on the internet
    is bad. Not to be all judgemental, but some of it doesn’t compile. Simply crashes.
    Others are written in confusing and bizarre manners. The code provided in this
    book attempts to be clean, useful, and maintainable.


    # Topics Not Covered


    There are some topics that have been intentionally left out of this book. I want
    to state these topics up front so the reader knows what they are getting.


    +   Virtual Machine Detection: VM detection techniques are continuously in flux
    as both sides seek to one up each other. A technique that works one week easily
    be be broken the next. As such, I’ve avoided this subject altogether.'
