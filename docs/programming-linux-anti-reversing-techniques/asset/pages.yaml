  md: 'Chapter 2: Compiler Options


    +   1. -O1: "With -O, the compiler tries to reduce code size and execution time,
    without performing any optimizations that take a great deal of compilation time."20


    +   2. -O2: "Optimize even more. GCC performs nearly all supported optimizations
    that do not involve a space-speed tradeoff."21


    +   3. -O3: All optimizations in -O2 perform a handful of others.


    +   4. -Os: "All -O2 optimizations that do not typically increase code size. It
    also performs further optimizations designed to reduce code size."22


    ![](img/fdf1e4bfff3995dc5a8580eb00fa23e5_41_0.png)


    # Writing good code


    One of the problems with optimizations is that they can break poorly written programs.
    I think optimization levels aren''t often discussed or even fully understood by
    programmers because many write such shod code they couldn''t use optimizations
    if they wanted.


    If you''re going to write code then do it well. Use -Wall and -Wextra when compiling.
    Use CPPCheck23 to do static analysis. Use Valgrind24 to do runtime analysis. These
    things are the bare minimum to write quality C or C++ code, I''ve rarely seen
    security professionals use any of these tools.


