  md: '# 6.3 Migrating the WebSphere Application Server


    The process of migrating from one WebSphere Application Server environment to
    another is straightforward. The application was migrated by using the source system''s
    WebSphere Administrative Console EXPORT command. This command creates an enterprise
    archive (EAR) file on the client running the WebSphere Application Server console
    using the Firefox web browser. We used the FileZilla FTP client to move the EAR
    file to the target system. The installation of the application on the target WebSphere
    Application Server running on Red Hat Enterprise Linux 6 (RHEL6) was undertaken
    by using the target system''s WebSphere Administrative Console IMPORT command.
    Both the export and import actions completed without incident.'
