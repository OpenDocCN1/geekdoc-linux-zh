    # 3.6 KVM hypervisor components


    "KVM" refers to the entire hypervisor. However, it is just one of many components
    that make up the entire virtualization solution. This section describes the major
    components that comprise the KVM hypervisor.


    KVM relies on a basic infrastructure known as *virtio* to provide devices to a
    guest in a high-performance, low-processor requirement manner. These veio interfaces
    connect device types (disk, network, and so on) into a common platform used by
    both the KVM hypervisor and the guests that are connecting to it before being
    routed to the respective drivers that communicate with the actual device. For
    example, a disk would be connected through vostro-bitio by the guest communicating
    with the Linux block driver on the host.


    # 3.6.1 Linux kernel and KVM module


    The KVM module is a cross-platform virtualization technology that extends the
    Linux kernel into an enterprise-class hypervisor by using the virtualization capabilities
    of a real processor. In addition, other modules and packages are included to provide
    the connectivity and resources necessary for a guest to run under the Linux system
    that runs KVM. This configuration includes, but is not limited to, KVM and virtio
    modules that provide an interface to interact with hardware while separating access
    from individual virtual machines. Further, it provides all packages necessary
    to provide a useful environment for the system administrator, such as management
    tools.


    The KVM module manages the sharing of all the virtual resources (processors, memory,
    and so on) onto the real resources, among the different virtual machines that
    are running in parallel.


    # 3.6.2 QEMU


    The QEMU application connects to the KVM interface of the host kernel and provides
    both emulation and virtualization of resources that are presented to a guest OS
    run within the QEMU process. The invocation of the QEMU process specifies all
    the resources that the guest has access to, as processors, memory, disks, and
    network devices. An interface'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'exists that allows certain resources to be added or removed from a running
    process, for example to add a disk to guest OS.


    # 3.6.3 The libvirt API


    The libvirt application programming interface (API) is a collection of open source
    software that enables more human-friendly interfaces to the QEMU processes. The
    API can be used to handle things such as starting/stopping a guest, adding/removing
    resources, or migrating a running guest to another system. Libvirt includes a
    set of command-line interfaces (the virsh command) for managing KVM itself and
    the virtual machines that run within the LinuxONE partition. Libvirt also provides
    the interface for resource management tools as described in "Resource management"
    on page 33.


    # 3.6.4 Resource management


    Many tools that can use the libvirt interfaces are described above to manage KVM
    and its virtual machines. This section describes a few ones for LinuxONE.


    Kimchi and a plug-in named Gner are open source tools for managing virtual machines
    by using a web browser. Kimchi is installed on a KVM host, and presents an HTML5
    web application to connected clients. This tool allows common configuration changes
    such as storage and network devices, basic system information and statistics,
    and simple KVM services such shutdown and restart.


    OpenStack is a collection of services that manage storage, networking, and compute
    resources for cloud computing throughout the KVM lifecycle.


    Virtual Machine Manager (virt-manager) is a graphical user interface for Libvirt
    that allows a user to manage multiple KVM hosts from a single location. It provides
    KVM lifecycle management, and performance metrics of recent virtual resource usage
    of each virtual machine.


    # 3.7 z/VM hypervisor components


    Two primary components of z/VM help PR/SM in managing the virtualization environments.
    These components are command line operating environments that give the system
    administrator control over the hypervisor. An additional component allows a graphical
    interface that can be used for easier administration over the hypervisor and its
    guests. This section describes explains these components.


    # 3.7.1 Control program


    The control program (CP) provides a user (in this example, the Linux operating
    system) with a complete environment of a virtual machine with virtual resources
    that appear as real hardware resources. Communication with the control program
    is CP commands that are used by the z/VM administrator and Linux administrator
    to manage, query, and allow the definition of additional resources.


    When a guest logs on to a z/VM session, it starts its CP session. For production
    systems, this is usually done automatically when the z/VM system is initially
    loaded or booted. There is an entry in the z/VM directory for each virtual machine
    that can be started.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'Each entry contains information about the virtual resources that are required
    by guest operating system, and details of the relative priority of the virtual
    machine. This information is used by CP to determine which virtual machine is
    be dispatched. Communication to the Linux system can be either through the Linux
    virtual machine console (which must be a 327-type terminal emulator), or more
    commonly using an SSH client terminal.


    > Note: If an administrator logs off the Linux console by the conventional LOGOFF
    command, the virtual machine powers off and terminates all running. The administrator
    must use the DISCONNECT command (not the LOGOFF command) to ensure that this problem
    does not occur.


    # 3.7 Conversational Monitor System


    The Conversational Monitor System (CMS) is an operating system that runs only
    as a z/VM guest. CMS is used by the z/VM system administrator to manage the system
    components, and to create and edit virtual machine user profiles in the zVM environment.
    CMS is the operating system for many service machines such as TCP/IP, print services,
    directory maintenance, accounting, and error recording.


    For information about z/VM, Introduction to the New Mainframe: z/VM Basics, SG24-7316.


    Both CP and CMS system an administrator more direct route to managing the available
    resources for the benefit of the Linux guest.


    # 3.7.3 IBM Wave


    IBM Wave for z/VM is an intuitive virtualization management software product that
    provides management, administration, provisioning, and enables automation of Linux
    virtual servers in a z/VM environment.


    To reduce the complexity of z/VM management, IBM Wave for z/VM is a perfect solution
    to help system administrators in their daily tasks. The following is a list of
    features that can help maintain:


    +   Display and manage virtual servers and resources, all from the convenience
    of a single graphical interface


    +   Provision virtual machines, and install a guest operating system


    +   Provision virtual resources, such as processors, memory, network, and storage


    +   Capture and clone virtual servers across partitions


    +   Create and configure virtual switches (vSWITCHes) and guest LANs


    +   Relocate virtual machines to other partitions


    +   Display, monitor, and manage z/VM hypervisor resources, such as paging


    More information about IBM Wave can be found in IBM Wave for z/VM, Implementation,
    and Exploitation, SG24-8192.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 3.8 Virtualized resources


    A key feature of LinuxOne is how utilization is optimized and maximized. In the
    current environment of distributed computing, the memory, the CPU, or the disk
    is underutilized most of the time the server is running. However, it is necessary
    to have the capacity available when the server is under peak load. With LinuxOne,
    a considerable amount of "overcommitting" is possible, such that memory, CPU,
    and I/O can adequately accommodate the workload when the needs needs it, and can
    be diverted elsewhere, without having to commit specific resources to any one
    workload. Although resources can be rigidly committed to a specific guest, the
    flexibility of the virtual resources is so. Overcommit is powerful for virtualized
    guests because typically not every guest needs all of its allocated resources
    at the same.


    # 3.8.1 Virtualized CPU


    LinuxOne is equipped with dozens of processor cores, which reflect directly on
    the performance of the Linux guest running in a partition. The number of virtual
    CPUs allocated to a single Linux guest should not exceed the number of logical
    CPUs allocated to a Linux partition. For example, if the partition has four cores,
    do not allocate five CPUs to a single guest guest. If a situation occurs where
    the Linux guest uses 100% of the CPUs, that will adversely affect the entire partition
    and all guests that are running within.


    However, in a partition with four cores, you can assign three virtual CPUs to
    a Linux guest and two virtual CPUs to a LinuxB, and another two virtual CPUs to
    a LinuxC. All request cycles are managed by the hypervisor. Generally, maintain
    a total of four active virtual CPUs to one logical CPU in a partition.


    # 3.8.2 Virtualized memory


    System memory is a resource that is shared across all LinuxOne guests. Each virtual
    guest is assigned a default amount of virtual memory during logon.


    The key to efficient memory management is to be aware of the total amount of virtual
    memory that is likely to be active at any time. Also, be aware of the amount of
    real memory (storage) that is allocated to the Linux partition.


    Both KVM and zVM allow you to overcommit memory, but keep the overcommit ratio
    of the total amount of virtual memory likely to be active to total amount of virtual
    memory around 2:1. For test or development workloads, the ratio should not be
    more than 3:1.


    The keys to determining the appropriate virtual memory size are to understand
    the workload set for each virtual machine, and to ensure that the Linux images
    do not have any unnecessary processes installed. Another recommendation is to
    use VDisks for swap, as described in "Swap device consideration" on page 38.


    # Memory management features


    LinuxOne and its hypervisors have memory management features that you can use
    to reduce the amount of memory that is required by guests:


    +   * Cooperative Memory Management (CMM)

    * Collaborative Memory Management Assist (CMMA)

    * Named Saved System (NSS)

    * Discontiguous Saved Segment (DCSS)'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'These features are not possible in a distributed x86 environment. Only LinuxONE
    can provide these versatile features, dramatically reducing the amount of physical
    memory that is required to maintain a similar set of workloads.


    # CMM


    CMM is used to simplify double paging that can happen between a Linux guest and
    z/VM. CMM requires the IBM Virtual Machine Resource Manager (VMRM) running on
    z/VM to collect performance data and notify the Linux guest about constraints
    when they occur. On Linux servers, the cmm kernel extension is required, and it
    is loaded with the modprobe command.


    # CMMA


    CMMA enables a Linux guest to share the page status of all 4 KB pages of guest
    memory with the KVM or z/VM hypervisor. Linux does this sharing by marking the
    status of each page, which allows the hypervisor to preferentially steal unused
    and volatile pages and thus reduce paging.


    # NSS


    NSS is a z/VM feature that allows virtual guests to share a read-only copy of
    a single operating system such as CMS or Linux. The benefit of this feature is
    that only one copy of the operating system is in storage accessible to all virtual
    machines. This feature decreases storage requirements and simplifies maintenance.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'DCSS is a z/VM feature that allows virtual machines to share reentrant code
    for applications, such as Oracle, which also reduces overall storage requirements.
    Figure 3-7 illustrates how both NSS and DCSS work. Linux guests use a single copy
    of the application in real memory. The NSS copy of Linux is also shared by all
    virtual guests.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_50_0.png)


    Figure 3-7 DCSS and NSS shared by multiple Linux guests on z/VM


    For more information about setting up a Discontinuous Saved Segment and its use
    with the Execute-In-Place (XIP) file system, see Using Discontinuous Shared Segments
    and XIP2 Filesystems With Database 10g on IBM System z, SG24-7285.


    **Note:** When defining memory requirements for virtual Linux guests, remember
    that the Linux kernel uses all the available memory allocated to it as a file
    system cache. Although this feature is useful on a standalone-system (where memory
    would otherwise go unused), in a virtualized environment this causes the memory
    resource be consumed in the partition. Furthermore, it is important to assign
    only the memory needed for the running applications when they are at peak load.


    Linux swap can be thought of as an overflow when an application cannot get enough
    memory resource. Thus, paging is an indication that the application needs to be
    analyzed to understand whether more memory is needed. Simply adding more memory
    to a virtual machine might not be the solution to the problem.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Swap device consideration


    Understand that the concept of "swapping" is different today than when it was
    invented, back when large amounts of RAM were very expensive. Modern operating
    system technology is more focused on paging than swapping. As suggested before,
    commit specific amount of virtual memory to each Linux guest to accommodate more
    than its intended workload, and to fine-tune the memory precisely so that paging
    does not normally occur. This might not be realistic, but it is something to seriously
    consider.


    In the absence of the perfect memory configuration, when workloads demand significant
    swapping, the ideal is to provide a VDisk for this purpose. VDisks are virtual
    disks that are allocated in z/VM memory. They become a fast swap device for Linux.
    Swapping to a VDisk in memory is far more efficient than swapping to regular disk,
    and it is generally less expensive, too, considering all factors. The Linux administrator
    must take care during the initial installation of the Linux guest to ensure that
    the VDisk is formatted as a swap device. But more than that, the VDisk must be
    formatted each time the Linux guest booted.


    For more information about optimizing memory on z/VM and Linux, see on IBM System
    Z: Measurement and Tuning, SG24-6926.


    # 3.8.3 Virtualized disk


    Many x86 computing environments have disk storage maintained in storage area networks
    (SANs) and other, external storage arrays. LinuxONE is fully capable of using
    disk from a SAN or network-attached storage (NAS). In many cases, the system administrator
    chooses to maintain the data of a particular application on the array while migrating
    the application to LinuxONE. Whether maintaining the data on a SAN or migrating
    the data to LinuxONE storage, the virtualized disk can be readily accessed by
    the workloads in the virtual environment. In many cases, leaving the data on the
    SAN eases and simplifies the migration effort.


    With LinuxONE, SAN support is expanded to include Small Computer System Interface
    (SCSI), connected to LinuxONE through Fibre Channel. In the x86 world, the Fibre
    Channel is often abbreviated as FC. To avoid confusion with FC in IBM terminology,
    referring to FICONB devices, LinuxONE uses the Fibre Channel Protocol (FC) to
    refer to the connection to a SAN.


    Typically, a SAN with Fibre Channel consists of independent and redundant fabrics,
    which provide connectivity between processor and peripheral devices. The Fibre
    Channel adapters have their own unique name (WWN) which is put into zones within
    the fibre.


    Modern Fibre Channel adapters can be virtualized by using N.Port ID Virtualization
    (NPIV). They provide a number of different devices that have their unique WWN
    and can be put into separate zones, despite sharing physical resources on a server.


    In theory, just one zone with all adapters and storage adapters would be sufficient.
    For actual production deployments, create a separate zone for each NPIV device.
    The reason is that during login and logoff of a single NPIV device, the whole
    zone is rediscovered. This process does not cause errors, it can cause short hangs
    depending on the size of the zone. If a separate zone is created for each NPIV
    device, the only local zone is discovered, which has no effect on other zones.


    Disk storage, by itself, is not a virtual resource. The bits and stripes on the
    disk do not have the same characteristics for virtualization that memory does.
    Disk is a more permanent resource than. Nevertheless, allocating free space for
    a workload would be just'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'as flexible and effortless allocating virtual processing power or virtual memory.
    A competent hypervisorSCI facilitates the management of disk storage.


    KVM provides SCSI support by using the Linux **zfcp** and **scsi drivers**, and
    can pass a full SCSI LUN to a Linux guest through the virtual infrastructure.
    z/VM provides SCSI support by using its own drivers, and can pass either a SCSI
    LUN, or a small piece of one amidisk, to a Linux guest. However, it is more common
    for z/VM from the FCP devices to a Linux guest, and allow the Linux to perform
    the SCSI configuration.


    For a more detailed description of disk storage, see 5.2, "Storage analysis" on
    page 66.


    # 3.8.4 Virtual network


    The physical network in LinuxONE consists of devices known as Open Systems Adapters
    (OSAs). An IBM LinuxONE provides up to 96 OSA-Express5S ports for external communications,
    handling up to 640 TCP/IP stacks simultaneously. The OSA supports both fiber and
    Ethernet connections at speeds of up to 10 Gbps.


    OSA devices can be virtualized through a virtual switch device to many Linux guests.
    It is available to KVM guests by using the Open Switch interface, and to z/VM
    guests by using a VSWITCH controller. Each Linux guest connects by a virtual device
    that is controlled by the qeth module to a virtual switch system in a Linux partition.


    HiperSockets provide high-speed interconnectivity among guests that run on IBM
    LinuxONE, without any special physical device configuration or cabling. The guests
    communicate with one another internally using the in-memory capabilities of the
    PR/SM hypervisor. However, HiperSockets are not inted to be used for sophisticated
    networking and should not be used for external traffic.


    Both OSA-Express and HiperSockets use the queued direct I/O (QDIO) mechanism to
    transfer data. This mechanism improves the response time by using system memory
    queues to manage the data queue and transfer between a hypervisor and the network
    device. Various examples are available in 5.1, "Network analysis" on page 56.


    For more information about network in Linux, see *Advanced Networking Concepts
    Applied Using Linux on IBM System z*, SG24-7995.'
  merge: -1
  img_proc: true
