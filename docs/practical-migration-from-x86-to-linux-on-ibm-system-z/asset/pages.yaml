- pgno: 151
  md: '# 8.1 Deciding between containers and virtual machines


    The LinuxONE Platform is equipped with some of the fastest general-purpose processors
    in the world, ideally suited for data processing throughput. The large number
    of cores available in Linux systems and their high input/output bandwidth mean
    that open solutions can scale up and scale out.


    The underlying hardware is ready for a highly scalable environment, there are
    advantages and disadvantages specific to having the solution on either a container
    or virtual machine. Containers can allow you to have a lot more applications in
    a single physical server than a virtual machine (VM) can. But we cannot fully
    negate the need for application deployments based on virtual machines.


    The following are the factors for determining whether the solution should be on
    either containers or virtual machines:


    +   How the application is to be packaged. If you want to run multiple copies
    of a single app, say MongoDB, use containers. However, if you want the flexibility
    of running multiple applications (MongoDB with a Java based Homepage), use a virtual
    machine


    +   Usually containers tend to lock in a particular version of an operating system
    and its subsystems. This feature can be an advantage for an administrator, with
    containers you can create a portable, consistent environment for development,
    testing, and deployment. From a virtual machine perspective, no matter what hypervisor
    you use, you can deploy any operating environment. This feature is especially
    useful with in-house applications with specific dependencies.


    +   From a resource point of view, containers share an operating system, kernel
    instance, network connection, and base file system. Each instance of the application
    runs within a separate user space. This configuration significantly cuts back
    on the CPU usage that is associated with running multiple operating systems because
    a new kernel is not needed for each user session. This is one of the major reasons
    why containers are often used for running applications.


    +   Concerning speed to production, with the advent of the cloud and DevOps mode
    of application development, containers have an advantage because each container
    provides a microservice and can be part of a larger solution. This feature provides
    containers with the advantage of scale over the virtual machine.


    +   Concerning security, without any alterations to the container, a virtual machine
    is more secure than a container. Virtual machines have shared kernel resources
    and application libraries. This feature means that if a virtual machine breaks
    down, it is less likely to affect other VMs in the same operating environment.
    For now, containers do not have hardware isolation. If your organization has high
    security requirements, stick with virtual machines.


    Most organization will run both containers and VMs in their clouds and data-centers.
    The economy of containers at scale makes too much financial sense for anyone to
    ignore. At the same time, VMs still have their virtues. And LinuxONE provides
    the best in class features for running both containers and virtual machines.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 8.2 Setting up Docker on Ubuntu 16.04 LTS


    With the release of Docker version 1.11, the Docker Engine was heavily redesigned
    to make it compliant with the Open Container Initiative (OCI) run time. Specifically,
    it is built with the runC and contained daemons.


    +   - runC is a lightweight container run time. It is a command-line tool for
    creating and running containers according to the OCI specification.

    - contained is a daemon to control runC, built for performance and density, contained
    used runC''s advanced features such as seccomp and namespace support as well as
    checkpoint and restore for cloning and migration of containers.


    Docker itself does image management, and passes the management of the image to
    contained. Then used runC to run the container.


    Ubuntu v16.04, is packed with the pre-built Docker debian packages, so contained
    and runC are included by default. There are slight changes to the way that you
    deploy engine on the host system been installed. The first step is to update the
    local host apt index by using the command shown in Example 8-1.


    Example 8-1 Update the Ubuntu package repository


    ```

    blockchain@itschain:$ sudo apt-get

    Hit:1 http://us.ports.ubuntu/ubuntu-ports-xenial InRelease

    Hit:2 http://us.ports.ubuntu/ubuntu-ports-xenial-updates InRelease

    Hit:3 http://us.ports.ubuntu/ubuntu-ports-xenial-backports InRelease

    Hit:4 http://us.ports.ubuntu/ubuntu-ports-xenial-security InRelease

    Reading lists... Done

    blockchain@itschain:$

    ```


    Use one of these options to deploy Docker packages onto the host system:


    +   - Deploy the packages from official Docker engine distribution repository

    - Deploy Docker Engine from the pre-packaged Ubuntu distribution


    Example 8-2 shows deploying Docker using the second option. Ubuntu 16.04 LTS has
    pre-built debian for LinuxONE, which are named docker.io and docker.registry.
    The advantage of this approach is that the docker engine is integrated and tested
    on the distributions. However, the Docker Engine might be an older version or
    otherwise not the latest Docker version.


    Example 8-2 Install Docker packages


    ```

    blockchain@itschain:$ sudo apt-get -y install docker.io docker-registry

    Reading packages... Done

    Building dependency tree

    Reading state information... DonenThe following additional packages will be installed:

    bridge-utils cgroups-mount contained dns-root-data dnsmasq-base git-man-liberror-perl

    netfilter-containerpack3 runc-ubuntu xz-utils

    Suggested packages:

    mountall all-tools btrfs-tools bootstrap linux rnfse-fuse | zfutis-git-daemon-run
    |

    git-daemon-systemd git-docker doc-git-extra git-git gitkit

    git-diffutils-doc

    ```


    The NEW packages will be installed:

    bridge-utils cgroups-mount contained dns-root-data dnsmasq-base docker-registry.io

    git git-man liberror-perl netfilter-containerpack3 runc-ubuntu'
