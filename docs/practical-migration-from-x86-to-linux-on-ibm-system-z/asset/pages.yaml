    # 3.5 Guest mobility


    A critical responsibility of systems administrators is ensuring that all systems
    are running the latest operating systems software, and that all maintenance and
    security fixes have been applied. Protecting the system from unexpected downtime
    and from security vulnerabilities, ensuring that applications are running at the
    latest patch release, and balancing loads across a diverse infrastructure are
    all tasks that concern systems administrators. This is a particularly troubling
    challenge in the data center, where downtime should be minimized and maintenance
    windows are scarce.


    # 3.5.1 KVM guest migration


    The KVM hypervisor allows a migration of guests, either when the guest is running
    or pause the system to be restored at a later point. This migration is done by
    moving the guest state from one QEMU process to another. The guest itself is unaware
    of the underlying movement. It is possible to move a Linux guest to another LinuxONE,
    guest migration is more useful to move the guest to a wholly different LinuxONE,
    perhaps because the hardware is being. The migration can be performed between
    distinct LinuxONES, either in an ad hoc fashion or with a high-availability clustering
    solution that ties multiple systems together as.


    The guest must have access to identical resources on both the source and destination
    to run satisfactorily. An attempt to perform a migration with a mismatch in resources
    will fail the guest might not behave correctly upon being started on the destination
    system.


    In addition to being able to move between real servers, the KVM guest migration
    permits the state of a guest OS to be saved to a file on the host. This process
    allows guest OS to be restarted later.


    # 3.5.2 z/VM single system image and live guest relocation


    The z/VM single system image (SSI) is a clustering technology that provides multiple,
    redundant hosts upon which virtualized guests share common pool disks, network
    devices, and user data. Ideally the cluster would be contained on separate systems
    for optimum safety if a failure were to occur, although running the members on
    the same system is also feasible. The members of the SSI cluster are managed together.


    Coupled with SSI is Live Relocation (LGR), which facilitates the relocation of
    a Linux guest from one member of the SSI cluster to another. This relocation happens
    nearly instantaneously, without the Linux guest having any knowledge of the relocation.
    Network processes and connections, disk operations, and user interactions on the
    Linux guest are unaware that the underlying infrastructure has moved to a different
    "physical" environment.'
  merge: -1
  img_proc: true
