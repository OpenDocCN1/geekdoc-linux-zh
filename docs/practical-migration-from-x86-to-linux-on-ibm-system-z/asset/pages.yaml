  md: "# 5.8.7 Understanding the availability requirements of applications\n\nThis\
    \ section describes how service level agreements (SLAs) and the cost of providing\
    \ availability can help you achieve a better understanding of the availability\
    \ requirements of your applications.\n\n# Service level agreements\n\nTo determine\
    \ the availability requirements of applications that you want to migrate to LinuxONE,\
    \ consider the needs of the business units that rely on these agreements. Ideally,\
    \ create SLAs that state requirements, such as availability needs, response time,\
    \ maximum system utilization, and DR requirements. Use these SLAs as the basis\
    \ for the design of the system on Linux.\n\nIf SLAs do not exist, before designing\
    \ a solution, discuss with the business units what levels of service you can offer\
    \ and what level of investment they are willing to make. The key to success for\
    \ an SLA is that it is achievable and measurable with defined penalties for failure\
    \ to deliver. You also need to ensure that SLAs are regularly reviewed because\
    \ things will change.\n\nAccording to IT Management principles, a service level\
    \ agreement typically defines or covers the following topics:\n\n+   * The services\
    \ to be delivered\n* Performance, tracking, and reporting mechanisms\n* Problem\
    \ and change management procedures\n* Dispute resolution procedures\n* The recipient's\
    \ duties and responsibilities\n* Security\n* Legislative compliance\n* Intellectual\
    \ property and confidential information issues\n* Agreement termination\n\nSome\
    \ of these components might not be relevant in an \"in-house\" SLA.\n\nFrom an\
    \ availability view point, an SLA for an \"in-house\" business application should\
    \ focus on the first two items: What service is being delivered and how it is\
    \ measured:\n\n+   * Application availability hours, for example:\n  * 24 hours/day\
    \ x 7 days a week.\n  * 6:00 AM to 6:00 PM, weekdays.\n  * 9:00 AM to 5:00 PM,\
    \ weekdays.\n\n+   * Definition of how availability is measured and who will do\
    \ the measurement. For example, system availability, application availability,\
    \ database availability, and network availability.\n\n+   * Minimum system response\
    \ time\n  * Defined number and definition of where and how it is measured.\n\n\
    # The cost of availability\n\nAs shown the examples in this chapter, there is\
    \ a great degree of difference in cost and complexity of the various availability\
    \ options discussed. Providing CA and a DR plan is not an insignificant expense,\
    \ but with the degree of reliance on IT systems by most businesses today, it is\
    \ a cost that cannot be ignored."
