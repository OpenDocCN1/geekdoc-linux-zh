    # # Virtualization concepts


    Virtualization is a highly prized capability in the modern computing environment.
    Virtualization on LinuxONE offers industry-leading, large-scale, and proven Cloud
    and IT optimization capabilities to drive down the costs of managing and maintaining
    the tremendous proliferation of servers in today''s technology infrastructures.


    This chapter provides helpful information about virtualization, particularly to
    compare and contrast the virtualization concepts of IBM LinuxONE with those commonly
    used by x86 distributed systems. The two have many concepts in common, but other
    concepts are very different. This brief comparison provides terminology, vocabulary,
    and diagrams that are helpful when migrating workloads to LinuxONE.


    This chapter includes the following sections:


    +   - The demand for virtualization

    - Typical x86 virtualization

    - LinuxONE virtualization

    - Linux guest

    - Guest mobility

    - KVM hypervisor components

    - z/VM hypervisor components

    - Virtualized resources'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# ## 3.1 The demand for virtualization


    As the computing environment grows in size and complexity, the sprawling infrastructure
    becomes more difficult to manage. Resources such as CPU, RAM, and disk are too
    easily wasted and cannot be efficiently used. Virtualization turns physical hardware
    into logical resources that can be shared, shifted, and reused. One of the most
    highly prized features of virtualization is dynamically decreasing more virtual
    resources, such as CPU, RAM, and disk, to a virtual host while the virtual host
    is running. This greatly eases the system administration tasks of scaling the
    supply of services to meet demand.


    Virtualization allows a single physical server to host numerous logical servers.
    The servers share the physical resources to allow all the logical servers to accomplish
    more than the single physical server could on its own, maximizing the effective
    use of the physical resources. In a virtual environment, the physical server is
    commonly called the "host" system and the logical servers are known as "guests."
    Although software solutions in the industry use variations of these terms, this
    publication uses the terms "host" and "guest" as defined above.


    System administrators rely on virtualization to ease and facilitate the complex
    work of managing complex environments. IT managers look to virtualization to address
    the ever increasing demand for more computing power from customers while accommodating
    shrinking budgets.


    The growing number of physical servers also increases the amount of power that
    is consumed in the data center. Virtualization helps to reduce the amount of electricity
    consumed, and reduces cost. Aspirations of a "green" data center can similarly
    be met by using virtualization.


    Virtualization has become popular in recent years, with research suggesting that
    more than half of all workloads in the data center are virtualized¹. Despite its
    more recent hype, virtualization has existed in advanced computing systems for
    quite some time. The conception of virtualization began in the late 1960s as IBM
    introduced Control Program (CP-67). This innovation quickly grew to become a defining
    feature of IBM hardware, including Linux systems.


    # ## 3.2 Typical x86 virtualization


    Figure 3-1 on page 25 shows a typical way that systems administrators set up virtual
    services in a distributed x86 environment. A physical server employs virtualization
    software (such as KVM or XEN) to install and run a Linux guest.


    > ¹ Nemertes Research, "Data Center Dynamics", Ted Ritter, 27 September 2011'
  merge: -1
  img_proc: true
