  md: '# Single LinuxONE LPAR: Clustered WebSphere Application Server


    Figure 5-14 shows a LinuxONE partition that shares system resources to all Linux
    virtual machines in that partition. The WebSphere Application Servers are in a
    two-node cluster. The unlikely event that a processor fails, IBM LinuxONE automatically
    switches the workloads to a spare or any unassigned processor without disruption
    to the active task.


    If a Linux machine runs the WebSphere Application Server workload fails, the other
    node in the cluster takes over if you are running redundant WebSphere Server Network
    Deployment. This failover is achieved because an application deployed to a cluster
    runs on all members concurrently. Additional availability is provided through
    the nondisruptive addition of new virtual machines to the cluster.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_123_0.png)


    Figure 5-14 LinuxONE with a single partition running WebSphere Application Server
    cluster


    This environment also provides extra availability through redundant HTTP servers.'
