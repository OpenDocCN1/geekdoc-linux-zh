  md: '# 8.6.1 Analysis and planning


    Following the guidelines and recommendations outlined in Chapter 4, "Migration
    process" on page 43, and Chapter 5, "Migration analysis" on page 55, appropriate
    planning and analysis should be performed before these migration activities. The
    checklists for identifying how virtual resources should be dedicated and organized.


    For this scenario, the Linux image has already been set up and a minimal Linux
    operating system installed. The Linux guest is called LSUNDB2 and is running SUSE
    Linux Enterprise 11 SP3, with one virtual CPU and 1 GB of virtual memory. It is
    assumed that an adequate package management (RPM) repository for installation
    source is already set up and available for the installation of the application
    software.


    # 8.6.2 Installing the LAMP stack


    The installation of the application software can be done by YaST for SUSE Linux
    Enterprise 11. To better illustrate the universality of LAMP on SUSE Linux Enterprise
    and RHEL, the command-line interface (CLI) is used for these instructions, with
    sample commands for both SUSE Linux Enterprise and RHEL.


    # Install LAMP on SUSE Linux Enterprise Server


    First, ensure SUSE Linux Enterprise Server has a pattern (a collective group of
    related packages) for a LAMP server. Use **zypper info -t pattern lamp_server**
    to see the packages that are associated with a LAMP server.


    Example 8-28 shows the helpful information that is displayed by LAMP by running
    the following command: zipper info -t pattern lamp_server


    > Example 8-28 LAMP pattern output from zypper

    Insubd2:"$ zypper info -t pattern lamp_server

    Loading repository data...

    Reading installed packages...


    Example for pattern lamp_server:

    Repository: SLES_DVD

    Name: lamp_server

    Version: 11-38.44.33

    Arch: s390x

    Vendor: SUSE LINUX Products GmbH, Nuernberg, Germany

    Installed: No

    Summary: Web and LAMP Server

    Description:

    Software to set up a web server that is able to serve static, dynamic, and interactive
    content (like a Web shop). This includes Apache HTTP Server, the database management
    system MySQL, and scripting languages such as PHP, Python, Ruby on Rails, or Perl.

    Contents:


    | S | | Type | Dependency |

    |---|---|---|---|

    | mysql | | package |'
