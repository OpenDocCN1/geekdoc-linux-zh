    # # 5.6 Security analysis


    This section provides an overview of the security considerations you need to include
    in analyzing programs and functions that are going to be part of the migration.
    Available enterprise-wide authentication options and their possible role in migration
    are all described. Finally, because SSL/SSH is probably going to be, the use of
    the cryptography hardware is covered as well.


    A properly secured application, on a properly secured system, is a cornerstone
    of any computing environment used today. Thus, migrating an application from one
    server to another, regardless of the platforms that are used, is simply a matter
    of validating that the same policies are available and in place the new environment.
    This section covers the security options that can be implemented for an environment
    that is migrated to LinuxONE, if none were already in place. It is entirely possible
    these tasks are already implemented, and need validation as being intact after
    a migration.


    This section discusses the following topics:


    +   * Security migration overview

    * Code and application analysis

    * Availability and accountability

    * Data integrity and confidentiality

    * Security change management

    * Enterprise authentication options

    * CP Assist for Cryptographic Function


    # # 5.6.1 Security migration overview


    Overall security is composed of three domains:


    +   * Physical security

    * System security

    * Network security


    In each domain, the concept of "principle of least privilege" is applied, which
    results in the security policy. That policy is where each individual is granted
    the access they need, no more. You need to establish individuals and their roles,
    and who is going to be allowed to do what. This process is vital for overall system
    security because if a compromise occurs, its exposure will be to the affected
    area.


    Use mandatory access controls to ensure not only that you are only as strong as
    your weakest point, but also ensure that authorization is withdrawn when privileges
    are revoked.


    A basic premise underlying the concept of security is that you are only as strong
    as your weakest point. That is why security is time-consuming, and it is difficult
    to predict the amount of time that the analysis will take. If this is the first
    time that you are undertaking a security analysis, do not underestimate the time
    or scope involved in this task.'
