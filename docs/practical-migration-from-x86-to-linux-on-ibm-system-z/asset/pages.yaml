    \ SUSE Linux Enterprise Server. OpenLDAP, Linux, and LinuxONE are all happy regardless\
    \ of the distribution, and the migration of OpenLDAP is unchallenged by the distribution.\n\
    \n# 8.8 Deploying log server\n\nAs you saw in \"Logging and recording events\"\
    \ on page 100, forwarding local log records to a remote system is a good practice\
    \ to keep your logs safe. When someone attempts to attack one of the servers,\
    \ they will probably try to clean up their tracks. By using remote log servers,\
    \ you can keep a safe copy even if they remove the local copies or stop the service.\
    \ Also, you will be able to analyze all logs from your environment and use a real-time\
    \ search and analytics tool to create business insights or a monitoring tool.\n\
    \nTo create a centralized log server, use the default log daemon from SUSE, syslog-ng\
    \ (version 2.09). It can be easily installed on RHEL using Extra Packages for\
    \ Enterprise Linux (EPEL6).\n\n# 8.8.1 Analysis and planning\n\nUse the Logical\
    \ Volume Manager (LVM) to create a log volume for files because log tend to grow\
    \ fast. With different hosts writing logs to a centralized log server at the same\
    \ time, log files can fill your disk faster. Therefore, leave some space available\
    \ in a volume group that can be used during an emergency.\n\n# 8.8.2 Initial configuration\n\
    \nThe default path for the syslog-ng configuration file is /etc/syslog-ng/syslog-ng.conf.\
    \ It is made up of key words that define the message route and global options.\
    \ You can see all the global options by issuing the following command:\n\n```\n\
    syslog-ng.conf\n```"
