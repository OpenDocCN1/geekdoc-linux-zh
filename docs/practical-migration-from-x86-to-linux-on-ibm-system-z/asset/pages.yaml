- pgno: 97
  md: '# ## 5.4 Database analysis


    This section provides information about the configurations of the database server
    on LinuxONE. Preferred practices for different database management systems are
    also presented. And while this topic is presented using offline migration methods,
    consult your DBMS vendor to investigate the variety of tools available to move
    data online.


    # ### 5.4.1 Before database migration


    Database servers are well suited for migration to LinuxONE. However, a migration
    of the database server also demands detailed planning because technical configuration
    changes need to be considered.


    During migration planning discussions, the workload of the instances and the databases
    that are running at the source environment must be considered, along with the
    number of concurrent users and the number of instances and databases running in
    a unique server.


    # ### 5.4.2 Migrating a single instance


    For instance servers, migration is fairly simple because the number of variables
    from the source environment to the new destination environment is relatively small.
    You can use the following steps to migrate when using the same database software
    vendor and version:


    +   1. Configure the LinuxONE network (follow steps 1 - 4 as listed in 5.1.4,
    "Helpful steps for a network migration" on page 66).

    2. Configure the temporary storage area at the source server and at the destination
    server.

    3. Stop the database services.

    4. Issue the export/dump procedures at the source server.

    5. Transfer the export/dump files through the network to the destination Linux
    server.

    6. Shut down the source server.

    7. Change the Linux server host name and IP address.

    8. Perform import procedures at the destination server.

    9. Perform the database and applications tests.


    # ### 5.4.3 Migrating multiple instances


    For a multiple instance on a single server, or multiple instances on multiple
    servers, migration is more detailed and complicated. However, among the benefits
    of the migration are lower license cost, less data center space needed, energy
    savings, and better performance.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Migrating multiple servers to LinuxONE


    A significant factor in the migration of multiple servers to LinuxONE is the distribution
    of server peak load. Document and compare peak workload, including how long the
    workloads take and how much of the server resources are used. Use Table 5-1 to
    map server workloads when creating migration configurations.


    Table 5-1 Sample database server workload map


    | Server information | Total of CPU | Total of memory | % CPU used | % Mem. used
    | Week day | Start time | Stop time |

    |---|---|---|---|---|---|---|--|

    | Server name | | | | | | | |

    | | | | | | | | |


    As explained in 3.8.1, "Virtualized CPU" on page 35, the CPU and memory constraints
    in LPAR are possible and desirable. the server should maintain the same peak load
    for a long time if there are not real CPUs to process each virtual CPU request.


    For example, a configuration of one LPAR set with three dedicated CPUs and running
    three Linux guests. LinuxA has two virtual CPUs, LinuxB has two virtual CPUs,
    and LinuxC has one virtual CPU.


    If LinuxA and LinuxB share the same load time and period and during this peak
    load, both LinuxA and LinuxB use 100% of the CPU, that causes a CPU constraint
    because the number of virtual CPUs is four and the number of real CPUs is three.


    In this case, the hypervisor handles all the processor requests and the server
    is still available. However, the performance of the application would probably
    not be good and would also affect Linux''s response time. However, if the server
    peak loads of LinuxA and LinuxB occur at different times, the entire LPAR is not
    affected.


    This kind of constraint is acceptable if it happens in milliseconds to seconds.
    However, it can be a problem in intervals that last for more than a few minutes,
    depending on how critical the server is to the business purpose.


    Having the correct workload capacity plan is key to successfully migrating multiple
    servers in a single LPAR on LinuxONE.


    Another point to consider CPU capacity is the relationship between the source
    server and the migration server. It is not 1:1. In other words, one distributed
    server with four CPUs does not necessarily have four CPUs in the destination virtual
    server. Preferred practice shows that the actual number is less than that. For
    more information about this topic, see 5.4.4, "Technical configurations" on page
    86.


    # Migrating a multiple instance server to LinuxONE


    Usually on your development environment you have one database server with multiple
    instances. This configuration generally works well for a development environment,
    but when you are migrating your production environment, you want to isolate your
    instances and simplify the database management. For best results from this type
    of migration, perform a detailed workload analysis. Different instances have different
    workload types, times, and characteristics that might allow the overcommitment
    of CPUs and memory.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'In an environment where the instances are divided among various virtual servers,
    a software problem occurring on a specific instance affects only the database
    server where the instance is running. As a result, only the database server where
    the instance is running will need to be restarted or investigated.


    To minimize the work related to database software fixes and security updates,
    it is possible to use shared devices for database binary files and libraries.
    For more information about these topics, see “Shared file system” on page 74.


    Consider the following questions when you migrate from a multiple instance server
    to multiple Linux servers on LinuxONE:


    +   - Is the source server running at maximal CPU capacity?

    - Is the CPU load balanced across all instances? Or is there a unique instance
    that is consuming all the CPU?

    - What is the average CPU cycle used by each instance?

    - During which period does the instance use more CPU cycles?

    - Does the instance write or read more onto the disk devices?

    - How much memory does each instance have allocated?


    You can use Table 5-1 on page 85 to map the instances by changing the Server name
    column to “Instance name” and documenting the appropriate information.


    With this information, you can configure multiple servers in a partition to respond
    to all user requests, without degraded performance and with improved database
    management. This process makes it easy to define the number of virtual CPUs that
    each server needs and avoid the constraint of real CPU in peak usage hours.


    > Tip: If possible, gather data for an month instead of a single day. The more
    data you have, the more accurate your analysis will be.


    # 5.4.4 Technical considerations


    Database management software requires particularly careful when you are planning
    a migration. Most database servers use shared memory segments and semaphores to
    process communications. The database application uses buffer page configuration
    to speed up access and the overall application. In other words, database servers
    are memory-bound and storage-bound, and table access must be considered at server
    migration.


    # CPU


    The number of virtual CPU resources in a database server is important. The maximum
    does not guarantee better performance. The number of CPUs must be large enough
    to avoid the processor queue.


    The number of processes in a processor queue is influenced by all the other resources
    of the server, and should not be analyzed as a separate resource. Memory constraints
    or I/O constraints affect the processor queue number directly. Therefore, before
    deciding that the server does not have enough CPU and adding a CPU to the service,
    analyze the CPU schedule time. If the system is running in a high processor queue
    and most of the CPU time is dedicated to SYSTEM, it is probably with memory. The
    correct parameter to resize is if the CPU time is dedicated to I/O WAIT, reorganize
    the file system.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'In the beginning, you will not know how many virtual CPUs your database will
    need on LinuxONE. Start with a low number of CPUs and increase them as needed.


    You can read more about it in Linux on IBM System z: Performance Measurement and
    Tuning, SG24-6926.


    # Memory


    The database server uses a large memory area to achieve acceptable performance,
    but with LinuxONE, allocating more resources is not related to improving performance.
    Instead, size the machine as needed. One consideration that is involved is the
    server paging process.


    Keep in mind that a huge memory setting the server is not desirable, so at the
    start of the migration, start the Linux memory size with 60% of the total memory
    size from the source server and then increase or decrease as needed.


    # Swap memory


    In database servers, have a swap area and it is part of the total usable memory.
    However, use the swap area only at the peak to avoid the Linux kernel stopping
    the database process because memory constraint.


    A LinuxONE preferred practice is to use the zVM disks as swap devices. Because
    swap configured at ZDI provides desirable response times, the eventual memory
    paging (the process that moves data to blocks from real memory and to swap memory)
    is not considered a real problem. It also not considered a problem if the server
    has no more than 50% of the swap allocated. However, this configuration involves
    paging and swapping allocation, which must be monitored to avoid database outages.


    If the server serves a very high paging value for 5 minutes, increase memory at
    the server and continue monitoring the server to find the best memory size.


    The Linux server uses the swap to allocate memory pages that are not used in real
    memory as its default configuration. However, that might not be the most desirable
    solution when considering database servers. A configurable kernel parameter called
    swappiness swappiness configuration is a whole number from 0-100, inclusive, with
    a default of 60. Earlier versions of Linux suggested setting this to zero for
    database workloads. However, changes in newer versions of Linux would take this
    as an indication to almost never swap to disk. This configuration leads to a greater
    risk of out-of-memory conditions for the Linux guest, a clearly undesirable attribute.


    Newer Linux distributions such as RHEL 6.4 might suggest a lower, nonzero swappiness
    value, such as in Example 5-1.


    Example 5-1 /proc/sys/vm/swappiness


    ```

    at /etc/sysctl.conf include the line

    vm.swappiness = 10

    ```'
  merge: -1
