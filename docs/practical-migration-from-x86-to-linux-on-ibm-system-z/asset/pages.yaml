- pgno: 10
  md: '# Preface


    LinuxONE is a portfolio of hardware, software, and solutions for an enterprise-grade
    Linux environment. It has been designed to run more transactions faster and with
    more security and reliability specifically for the open community. It fully embraces
    open source-based technology.


    Two servers are available for LinuxONE: The LinuxONE Emperor and Rockhoper.


    The IBM® LinuxONE Emperor server has these features:


    +   - Near limitless scaling and support of up to 8,000 virtual servers on a single
    footprint

    - Intrinsic polymorphic security, safety, and faster data encryption than x86

    - Faster critical workloads and near real-time insights with higher performance
    and throughput than x86 with a net lower cost per transaction

    - Lowered costs by managing fewer servers, reducing complexity, gaining unparalleled
    utilization and using usage-based pricing


    The LinuxONE™ Rockhoper server has these features:


    +   - Unprecedented performance, security, and resiliency

    - Scale up and out with one million Docker containers per system

    - Manage more transactions more quickly with 34 percent greater capacity

    - Gain faster response times with high-performance I/O throughput

    - Faster insights with large many configurations that are optimized for Linux

    - Deliver of data and services on the most secure Linux platform


    Aside from still running SUSE Linux Enterprise Server and Red Hat Enterprise Linux
    Servers, LinuxONE runs Ubuntu, which is possible on x86 hardware.


    Ubuntu, which runs in the cloud, smartphones, a computer that can remote control
    a planetary rover for NASA, many market-leading companies, and the Internet of
    Things, is now available on IBM LinuxONE servers together. these technology communities
    deliver the perfect environment for cloud and DevOps. Ubuntu 16.04 on LinuxONE
    offers developers, enterprises, and Cloud Services Provide a scalable and secure
    platform for next generation applications that include OpenStack, KYVM, Docker,
    and Juju.


    The reasons are why you might want to optimize your servers through virtualization
    using LinuxONE:


    +   - Too many distributed physical servers with low utilization

    - A lengthy provisioning process that delays the implementation of new applications

    - Limitations in data center power and floor space

    - High cost of ownership (TCO)

    - Difficult allocating processing power for a dynamic environment


    This IBM Redbooks® publication provides a technical reference for IT organizations
    that are considering a migration from their x86 distributed servers to LinuxONE.
    This book walks you through some of the important considerations and planning
    issues you may encounter during a migration project. Within the context of a pre-existing
    UNIX or x86 environment, it presents an end-to-end view of the technical challenges
    and methods necessary to complete a successful migration to LinuxONE.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Authors


    This book was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Poughkeepsie Center.


    Lydiaiale is a Project Leader for the ITSO team in Poughkeepsie, New York, with
    world-wide experience in technology management including software development,
    project leadership, and strategic planning. Her areas of expertise include business
    development and database management technologies. Lydia is a certified PMP and
    an IBM Certified IT Specialist with an MBA in Technology Management, and has been
    employed by IBM for 25+ years in various technology areas.


    Eric R. Farman is a Senior Software Engineer for IBM Systems® Virtualization Development
    in Indianapolis, New York, with 10 years of experience with zVM/ four years with
    KVM development. He holds a degree in Computer Science from Susquehanna University.
    His areas of expertise include device connectivity and operating system virtualization
    of virtualized devices. He has presented at numerous technical conferences over
    years.


    Manoj S. Pattabhiraman is an Open Source Architect from the Asia Pacific - IBM
    Z Systems Team. He has more than 16 years of experience in Open Source Solutions
    (virtualization, cloud, and Blockchain). In his current role, he drives and provides
    consultation and implementation services for various Linux customers across Asia
    Pacific region. Manoj has contributed to several zVM/LinuxONE publications, and
    has been a frequent presenter at various technical conferences and workshops on
    Cloud, Blockchain, and Virtualization.


