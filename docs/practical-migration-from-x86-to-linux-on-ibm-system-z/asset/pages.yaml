  md: '# 8.3.3 Running MongoDB container


    Starting the MongoDB container by the docker run command. Example 8-12 shows that
    the docker should instantiate the image mongodb-2.6.6-s390x and assign the newly
    instantiated container with the name itsomongo. This technique allows you to refer
    to the container by name rather than having to use the ID hash. If you do not
    provide a name, docker assigns one from some randomly selected words. Also, specify
    the ports so that it maps the default MongoDB port 27017 to an external port.


    The response to the successful instantiation will be a return of a hash that is
    the full ID of the new running container.


    Example 8-12 Starting MongoDB


    ```

    itsoadmn@innxmongo:\$ docker run -p 27017:27017 --name itsomongo -d

    brunswickheads/mongodb-2.6.6-s390x

    ce2673ee3939527315187fd721102284f82d63d72db2f626ba73503214dd49

    ```


    # 8.3.4 Verifying and accessing MongoDB container


    Check whether the container named itsomongo has started by the docker ps command
    as shown in Example 8-13. The status column of the command output shows that the
    MongoDB container is up and ready. In addition, the output provides the mapping
    of 27017 and 28017 to the container''s local ports.


    Example 8-13 Container verification


    | CONTAINER ID | COMMAND | CREATED |

    | --- | --- | --- |

    | STATUS IMAGE NAMES |

    | PORTS | ce2673ee39393 brunswickheads/mongodb-2.6.6-s390x /bin/sh -c ''mongod''
    - 4 seconds ago | Up 3 |

    | seconds 27017/tcp, 0.0.0.0:27017->27017/tcp itsomongo | |


    > For in-depth information about the container, inspect the container by the sudo
    **inspect <container id>** command.


    You can use multiple methods to access MongoDB from the host:


    +   - Use MongoDB client tools

    - Use Connect to the MongoDB container and verify the database


    This example uses the latter option. Therefore, start a Docker interactive shell
    into the Mongo container and create a sample database (Example 8-14).


    Example 8-14 Access MongoDB Container Using Docker


    ```

    itsoadmn@innxmongo:\$ docker exec -it itsomongo /bin/bash

    bash-4.2# mongo

    MongoDB shell version: 2.6.6

    connecting to test

    Welcome to the MongoDB shell.

    For interactive help, type "help".

    For more comprehensive documentation, see

    http://docs.mongodb.org/

    Questions? Try the support group

    http://groups.google.com/group/mongodb/

    ```


