- pgno: 142
  md: '# Post migration considerations


    This chapter describes general post migration consideration concepts for getting
    acceptance, measuring performance, and tuning. Topics covered in this chapter
    include an acceptance list, performance measurement understanding, and key considerations
    for performance tuning.


    Every migration poses a large challenge for IT organizations because each stakeholder
    has different expectations and requirements from the project. Most of the topics
    after migration will center around performance and functionality. IT organizations
    face these difficult questions:


    +   - What exactly has been done?

    - Is there anything missing?

    - Is everything working?

    - Is the performance as expected?

    - Is the process completed?

    - Did we get approvals?


    To answer these questions, you need to take some important steps before and after
    the migration implementation phase. This chapter includes the following sections:


    +   - Gaining acceptance

    - Performance measurement

    - Performance tuning'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 7.1 Gaining acceptance


    Migration projects are generally recognized as major changes to the IT environment.
    Each change requires significant testing and acceptance by various stakeholders.
    These stakeholders must decide whether the migration was a success.


    Acceptance requires an understanding of the big picture before and after migration:


    +   - Before the implementation phase starts, complete these tasks:

    - Decide and document test scope.

    - Decide and document test case (including test scenario).

    - Create post migration checklists for all components.

    - Collect performance data about the system.

    - Get acceptance from the stakeholders for testing.


    +   - After the implementation is done, complete these tasks:

    - Use the post-migration checklists and check whether the implementation is done.

    - Test the system using documented test cases (complete and document all scenarios).

    - Measure performance and compare it with the previous performance data.

    - If necessary, perform performance testing.


    Based on project scope and context, items used for acceptance testing can differ,
    but the following list is the most common acceptance tests that are performed
    before gaining stakeholder acceptance:


    +   - Application testing

    - In some cases, usability testing might be required.

    - Functional testing

    - Performance testing

    - Security testing

    - User acceptance testing


    # 7.2 Performance measurement


    This section describes performance measurement and its impact on the success of
    your migration. The most important point to consider is that you need to measure
    the performance of the application when it is running in production on the source
    environment. Compare data with the performance of the application on the target
    environment.


    This section also covers monitoring commands and tools that can assist you in
    identifying and resolving performance inhibitors.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# 7.2.1 What is performance


    "Performance" in computer systems is a relative term. Usually computer performance
    is described in measurable terms, such as transactions per second, response time,
    or time to process a specific task. However, when a migration project is undertaken,
    it is important to understand the performance metrics used on the source environment
    so that you can understand the relative performance of the target system.


    The initial performance of a new system is often not as expected, especially when
    changing hardware platforms. Therefore tuning must be undertaken to improve the
    performance of the target system. Without having proper metrics, it is impossible
    to validate the performance of the new platform relative to the source platform.
    For this reason, the migration project team needs to agree on what performance
    metrics from the source platform will be used in the migration project to measure
    the performance of the target platform.


    # 7.2.2 Choosing what to measure


    To determine the success of a migration, simply having the application on the
    target platform provides the answer as the source platform does not prove. The
    natural expectation of a migration onto LinuxONE is that the application will
    not only be more resilient and available, but it will also provide equal or better
    performance than the source platform. To ensure that the performance improvements
    are easy to show, it is important to choose the correct metrics. But what are
    these metrics, and how should they be measured?


    # Response time


    Response time is the measure of the time it takes for happen in a computer system.
    Generally, the response time of a unit of work called transaction is measured.
    The transaction can entail something simple as checking an account balance, or
    something as complex as the time taken to issue a new insurance policy or open
    a new bank account.


    The point to remember with computer systems is that the response time of a single
    transaction is the sum of a number of response times. Figure 7-1 shows the various
    components that make up response time.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_144_0.png)


    Figure 7-1 Components that make up the response time of transactions


    Figure 7-1 shows that there are two points where response time can be measured:
    System response time and user response time. When you are trying to understand
    the relative performance improvement from a new system, the only point to measure
    response time is from when a system receives the request and it provides a response
    of some sort to'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'In the case shown in Figure 7-1 on page 131, the system response time includes
    application time and the I/O response time to access the data. If you choose to
    measure the response time of user experiences at their terminal or over the web,
    you add the network response time, which can vary greatly for the transaction
    because it can be influenced by network load.


    To compare the source and target systems directly, measure response time on the
    source system, and assuming that the application has not changed greatly, measure
    the system response time on the target platform.


    # Transaction throughput


    The transaction throughput metric might provide a more meaningful measure of system
    performance because it measures the number of transactions processed over a period
    of time. This period is typically one second, but can be any time period that
    you prefer.


    In both cases, you have baseline performance metrics for the source system to
    properly compare the old and new systems.


    # 7.3 Performance tuning


    Tuning any system follows some basic principles because every hardware and software
    platform has unique features and characteristics that must be considered when
    you tune your environment. The art of performing tuning system requires a strict
    combination of performance analyses, multi-step tuning processes, and change management.


    Regardless of tools you choose, the best method for analyzing the performance
    of a system is to start from the outside and work down to the small tuning details
    in your system. Gather data about overall health of the system and processes.
    The following list is a sampling of the types of questions to answer both your
    source and target systems:


    +   - How busy is the processor during the peak periods of each day?

    - What happens to I/O response times during those peaks?►

    - Do peaks remain fairly consistent, or do they elongate?

    - Can current system resources provide user response times that meet service level
    agreements?


    It is important to know what tuning tools are available and what type of information
    they provide. Equally important is knowing when to use those tools and what to
    look for. How can you know what is normal for your environment and what is problematic
    unless you check the system activity and resource utilization regularly? Conducting
    regular health checks on a system also provides utilization and performance information
    that you can use for capacity planning.


    Tuning is not a one-size-fits-all approach. A system that is tuned for one type
    of workload often performs poorly with another type of workload. This consideration
    means that you must understand the workload you want to run and be prepared to
    review your tuning efforts when the workload changes.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'A simple workload is a server that shows one or more peaks during the day.
    A complicated workload is an application that is CPU-intensive during part of
    the day and I/O-intensive during another part. The most cost-effective approach
    to tuning workloads is to adjust the capacity of the server during the day. This
    is exactly what a hypervisor does. Portions of the virtual machine are brought
    in to run in memory while inactive virtual machines are moved to create space.


    Multi-step tuning process requires the skills of a systems performance detective.
    performance analysis identifies IT problems by using a detection process similar
    to that of solving a crime. In IT systems environments, the crime is a performance
    bottleneck or sudden degrading response time. The performance asks questions,
    searches for clues, researches sources and documents, formulates a hypothesis,
    tests that hypothesis by tuning or other means, and eventually solves the mystery.
    This process results in improved system performance. Bottleneck analysis and problem
    definition are facilitated by sophisticated tools such as IBM Tivoli OMEGAMON
    XE on zVM and Linux. These tools detect performance problems and alert a system
    administrator for degraded response time becomes evident.


    Change management is not strictly related to performance tuning is probably the
    single most important factor for successful performance tuning. The following
    considerations highlight this point:


    +   - Implement a proper change management process before tuning any system.


    +   - Never start tweaking settings on a production system.


    +   - Never change more than one variable at a time during the tuning process.


    +   - Retest parameters that supposedly improve performance. Sometimes statistics
    come into play. Document successful parameters and share them with the community
    no matter how trivial you think they are. System performance can benefit greatly
    from any results obtained in various production environments.'
  merge: -1
  img_proc: true
