- pgno: 178
  md: '#  8.7 Deploying OpenLDAP


    Enterprises of all sizes need to manage the users of their computing resources.
    With the user management comes the various characteristics of the user, such as
    user ID, authentication, file system rights, printer rights, and more, all needing
    to be managed. One of the most common products used for managing this data is
    the Lightweight Directory Access Protocol (LDAP).


    LDAP is widely used throughout the industry for directory services as an open
    standard running over an IP network. Although several commercial LDAP products
    are available, OpenLDAP is the implementation that is most commonly used in Linux.
    OpenLDAP is a fully featured suite of tools and applications. It is readily available
    as a workload on LinuxOne from both RHEL and SUSE. LDAP is a perfect workload
    for LinuxOne, due to the centrality of Linux among many other systems and services,
    fast I/O and its CPU and memory usage. And OpenLDAP is open source. Migrating
    OpenLDAP to LinuxOne is straightforward.


    We installed a LAMP server with MediaWiki and iSCSI external storage was used
    to facilitate the migration in 8.6, "Deploying MediaWiki and MySQL" on page 12.
    In this example, the LDAP database on x86 server is exported, the data is transferred
    to a Linux guest running on LinuxOne, and the data is imported into the LDAP service.


    #  8.7.1 Analysis and planning


    As with the MediaWiki example described in 8.6, "Deploying MediaWiki and MySQL"
    on page 152, it is important that you follow Chapter 4, "Migration process" on
    page 43, and Chapter 5, "Migration analysis" on page 55. Perform this migration
    and analysis before your migration activity. The checklists help identify many
    considerations that should be taken into account to help prevent problems during
    migration.


    This example assumes that the Linux guest has already been set up and a minimal
    Linux operating system has been installed. The Linux guest is called LNSUB2 and
    is running SUSE Linux Enterprise Server 11 SP3, with one virtual CPU and 1 GB
    of memory. An OpenLDAP server does not require a large amount of CPU or RAM running
    on LinuxOne. It is possible that an adequate RPM repository installation source
    is ready and up for the installation of the application service.


    The x86 server is called zs4p01-r1 and is running RHEL 6.4. For this example,
    this is the current OpenLDAP server that provides directory services for the hypothetical
    organization. This server has a myriad (small) LDAP directory already configured.


    Although there is much to consider when setting up an enterprise directory service,
    a simple OpenLDAP scenario is covered here. More extensive documentation can be
    found at the following site:


    http://www.openldap.org


    This example is a stand-alone server with a local, non-replicated directory service.
    Nevertheless, migrating an existing OpenLDAP installation on x86 to LinuxOne should
    be straightforward.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 8.7.2 Installing LDAP software


    The OpenLDAP server is a simple application, consisting of a single package. Therefore,
    installing the software is relatively easy. The software must first be installed
    on the LinuxONE guest before the other migration steps. If you are going to install
    OpenLDAP on SUSE Linux Enterprise Server, run the following command to install
    the package:


    ```

    zypper install openldap

    ```


    To install OpenLDAP on RHEL, run the following command:


    ```

    yum install openldap-servers

    ```


    # 8.7.3 Configuring the OpenLDAP service


    The principal player in the OpenLDAP server suite of applications is the Standalone
    LDAP Daemon, known as slapd. This example configures the slapd to operate as a
    stand-alone, local, non-replicated directory. The package, in RPM format, contains
    functional sample configuration files, which serve as the basis of the example
    service that is configured here.


    The initial configuration of OpenLDAP on SUSE Linux Enterprise Server running
    on LinuxONE is accomplished using yAST, whereas configuration on Red Hat is done
    by manually modifying configuration files and running commands.


    Before migrating the LDAP database to LinuxONE, establish a basic configuration
    of OpenLDAP. Using different terminology, the OpenLDAP configuration must be started,
    or known as bootstrapped.


    > Note: OpenLDAP maintains its configuration using one of two different configuration
    methods. The "old" method involves maintaining the primary configuration in /etc/openldap/slapd.conf.
    This method is simple, but does not have as many features. The "new" way (called
    the cn=config format) uses several configuration files below /etc/openldap/slapd.d/.
    The default behavior with OpenLDAP 2.4 is to use the cn=config method.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Configuring OpenLDAP on SUSE Linux Enterprise Server using YaST


    All of the activities to create a basic configuration of OpenLDAP are facilitated
    by the LDAP server YaST module. By following a few simple screens in YaST, the
    LDAP services are configured and running in short order. Perform the following
    steps:


    +   1. From a command prompt, start YaST, calling specifically the ldap-server
    module:

    nyast2 ldap-server


    Figure 8-4 shows the first panel.


    | General Settings |

    | Start LDAP Server |

    | (x) Yes |

    | ) No |

    | ] Register at an SLP Daemon |

    | Firewall Settings- |

    | [ ] Open Port in Firewall [Firewall Details...] |

    | Firewall is disabled |


    Figure 8-4 yast2 ldap-server module


    Select Yes to start the LDAP server automatically. Be certain to open a port in
    the firewall. In this example, because the firewall is disabled, we did not have
    the option to select Port in Firewall.


    Press F10 to go to the next panel.


    +   2. Select Stand-alone server as the server type, as shown in Figure 8-5.


    | Server type |

    | (X) Stand-alone server |

    | ) Master server in a replication setup |

    | ) Replica (slave) server. |

    | All data, including configuration, is re |


    Figure 8-5 Stand-alone server type of the LDAP server


    Press F10 to go to the next panel.'
  merge: -1
