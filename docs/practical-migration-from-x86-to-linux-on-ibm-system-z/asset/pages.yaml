    # ## 8.8.3 Server configuration


    A complex server configuration is out of the scope of this book. The default configuration

    of syslog-ng comes with definitions that split your files depending on the facility
    that will be

    logged. Figure 8-9 shows a centralized syslog-ng server receiving log copies from
