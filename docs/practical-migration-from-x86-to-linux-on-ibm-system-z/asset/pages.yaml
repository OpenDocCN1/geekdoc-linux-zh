- pgno: 54
  md: '# Part 2


    # Migration


    After you have decided to migrate from the x86 platform to LinuxONE, this part
    of the book guides you with an overview of the migration process and assists you
    in migration planning.


    The following chapters describe the key components of a migration analysis and
    walk you through an example hands-on migration. Planning checklists and worksheets
    are provided in this part to assist you in your own planning and hands-on migration.


    This part includes the following chapters:


    +   - Chapter 4, "Migration process" on page 43

    - Chapter 5, "Migration analysis" on page 55

    - Chapter 6, "Hands-on migration" on page 121

    - Chapter 7, "Post migration considerations" on page 129'
