    # 2.7 Planning checklists


    Planning checklists are used to identify the hardware and software requirements,
    migration tasks, and project deliverables during a migration project. Although
    the approach and parameters for a migration planning checklist can vary somewhat
    from project to project and between organizations, the foundation of an effective
    planning checklist is similar to the generic checklists in this chapter. The checklists
    shown in this chapter are created specifically for LinuxONE.


    # 2.7.1 Product and tools checklist


    The software product and tools checklist template is shown in Table 2-1 lists
    all the products and tools that are used in the source operating environment.


    It provides space where you can record whether the same or similar products and
