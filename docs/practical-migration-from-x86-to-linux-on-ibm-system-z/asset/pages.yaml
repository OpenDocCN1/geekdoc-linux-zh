    The relocation of Linux guests from one SSI member to another makes it possible
    to perform maintenance on the individual SSI cluster members without disrupting
    the services running on the Linux guests. With all Linux guests relocated away
    from an SSI member, SSI member can now be deployed and rebooted with no impact
    to any running guests. When the maintenance on this SSI member is completed, Linux
    guests can be relocated back to their original hosts. Perhaps all Linux guest
    systems can be relocated to this SSI member while maintenance is performed on
    other SSI members in the cluster.


    An additional benefit of SSI and LGR is the ability to relocate workloads to accommodate
    a more balanced use of system resources. If an SSI cluster currently contains
    a configuration of multiple Linux guests that are overusing the network, a portion
    of the guests can be relocated to a different member of the SSI cluster where
    network utilization is lower.


