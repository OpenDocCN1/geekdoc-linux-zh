  img_proc: true
- pgno: 21
  md: 'The answer is to understand your dynamic workload patterns and dynamic automation
    composition for your heterogeneous system as well as autonomic and proactive management
    such as shown in Figure 1-2.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_21_0.png)


    Figure 1-2 Future of workload management


    The future, as shown in Figure 1-2, can be considered as the intersection of three
    main areas:


    +   * Consumability

    * Agility

    * Efficiency


    The intersection of these three areas requires reconsideration of how to design
    an IT workload, services, and Infrastructure cloud solution. A Workload centric
    cloud provides abstraction and solution of workloads, services, and infrastructure,
    and an end-to-end mapping of an intelligent software-defined system environment.


    # 1.4 Workload centric cloud cloud


    A workload centric cloud can be described as a workload cloud solution. However,
    this awareness is not covered by existing software as a service (SaaS), as a platform
    (PaaS), or infrastructure as a service (IaaS) solutions because these systems
    run "cloud enabled" workloads on their scalable, virtualized heterogeneous infrastructure.
    They are not aware of the often varying workload definitions. They can only be
    aware of when system resources are busy or which system is running which workload.
    This section describes a different cloud architecture: A workload centric cloud.


    A workload centric cloud offers a programmable and optimized way of continuously
    delivering and running workload.'
  merge: -1
  img_proc: true
