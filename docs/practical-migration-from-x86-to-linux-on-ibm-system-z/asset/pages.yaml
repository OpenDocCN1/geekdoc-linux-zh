  md: '# ## 1.1 Benefits


    Linux is available on a variety of computing platforms from set top boxes and
    handheld devices to the largest servers. This flexibility means that after your
    applications are running on Linux, you are no longer tied to a specific hardware
    platform. You have control over the choice of hardware platform that supports
    your application. Workloads running LinuxONE benefits from a hardware platform
    that includes specialized processors, cryptographic cards with dedicated RISC
    processors, and a combination of hypervisors that allow unparallelled flexibility
    in deployment.


    A major benefit of Linux is that it is open source. The software is unumbered
    by licensing fees and its source code is freely available. Hundreds of Linux distributions
    are available for almost every computing platform. The following are the three
    distributions of Linux:


    +   - Red Hat: Red Hat Enterprise Linux (RHEL)


    http://www.redhat.com


    +   - SUSE: SU Linux Enterprise Server


    http://www.suse.com


    +   - Canonical: Ubuntu Server


    http://www.ubuntu.com


    All of these Linux distributions provide customers who use Linux with various
    support options, including 24 x 7 support with one-hour response time for customers
    production systems. In addition to the Linux operating system, all the major Linux
    distributions offer a number of other open source products that they fully support.


    To simplify problem determination, IBM customers can contact IBM in the first
    instance and, if it is a new problem with Linux, IBM will work with the distributors
    to resolve the problem.


    The increased interest and usage of Linux resulting from its set of features,
    including virtualization, security, Microsoft Windows interoperability, development
    tools, a growing list of independent software (ISV) applications, performance,
    and, most importantly, its multipatform support.


    This multipatform support allows customers to run a common operating system across
    all computing platforms, which significantly means lower support costs and, for
    Linux, no incremental license charges. It also offers customers the flexibility
    of moving applications to the most appropriate platform. For example, many IT
    organizations choose Linux for the ability to scale databases across highly scalable
    hardware.


