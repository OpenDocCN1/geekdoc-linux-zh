    The virtual guests are allocated CPU, RAM, and disk resources as a subset of what
    is available from the physical server, and the network resources are equally shared
    by the guests and physical host.


    | Virtual Linux guest | Virtual Linux guest | Virtual Linux guest |

    | Alvin | Boris | Charlie |

    | Physical Server x86host1 |


    Figure-3-1 Typical x86 virtualization scheme


    In a typical x86 deployment of virtual services, the physical servers are generally
    deployed in pairs or trios, often called clusters of servers. The clusters provide
    for some level of high availability such that if one physical server fails, another
    would be able to take over the workload with negligible interruption.


    # 3.3 Linux virtualization


    Like virtualization systems deployed by x86 clusters, LinuxONE accomplishes these
    many virtualization functions. Unlike x86, LinuxONE does so in a consolidated
    and comprehensive way, with multiple layers of virtualization that provide an
    extensive list of capabilities for the Linux guest operating system.


    A LinuxONE system is carved into isolated logical partitions (LPARs), with each
    partition running as an independent system with its own operating environment.
    This configuration means that it has its own CPUs, RAM, devices such as disks
    and network connections, and other resources. LinuxONEEmperor can be configured
    to run as many as 85 partitions, and the LinuxRockhopper can be configured with
    up to 40 partitions.


    With LinuxONE partitions, it is routine to maintain all of the pre-release development
    of a system contained within one partition, such that anything that goes wrong
    in this test environment will not adversely affect anything that is running in
    the production environment. When development is completed, the workloads that
    have been tested in the test environment can be migrated to the production environment.
    One partition can be dedicated to development and testing activity, and a separate
    partition can be dedicated to the production environment.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 3.3.1 Process Resource/System Manager hypervisor


    The IBM Process Resource/Systems Manager (PR/SM) is a standard feature on all
    LinuxONE servers, facilitating virtualization of all physical resources of LinuxONE
    into isolated partitions. PR/SM is responsible for the isolation of each partition
    from each other, and contains powerful tools for the fine management of each.


    Although LinuxONE runs dozens of partitions, and thus dozens of Linux instances,
    greater flexibility to virtualization can be achieved by running an extra hypervisor
    within each partition. For more information about these technologies, see 3.3.3,
    "KVM hypervisor" on page 26, and 3.3.4, "z/VM hypervisor" on page 27.


    # 3.3.2 Dynamic Partition Manager


    The IBM Dynamic Partition Manager (DPM) provides a simple mode of operation for
    a LinuxONE system to easily manage and configure the system and its guests. DPM
    is not a new hypervisor, but rather a graphical interface that uses the PR/SM
    infrastructure. A system administrator can easily create, modify and manage the
    LinuxONE without needing to learn PR/SM and its associated components or commands.
    The DPM interface allows for dynamic reconfiguration of CPU, memory, and I/O resources.
    Wizards prompt for details about a system as it is being created, and automatically
    enter those and additional values necessary where they are required. Advanced
    menus are available for greater control by experienced administrators.


    A system administrator can start the installation of a KVM hypervisor with DPM
    to simplify the deployment of Linux guests within a newly created partition.


    DPM provides some resource monitoring on a per-partition basis, allowing for nearly
    real-time usage data and historical trends over time.


    # 3.3.3 KVM hypervisor


    The Kernel-based Virtual Machine (KVM) hypervisor is a module that can be built
    into the Linux operating system. KVM enables the virtualization capabilities of
    a real processor to be used by a user application, which can then set up virtual
    resources to be used by a guest operating system. On LinuxONE, KVM enhances the
    capabilities of PR/SM while further protecting and isolating each virtual machine
    that is established on the host.


    Running Linux, extended with the KVM module, within multiple instances of the
    QEMU emulator, which provides emulation and virtualization to a guest OS. Each
    QEMU instance runs as a separate process of the Linux system, thus separating
    guest instances and protecting each set of virtual resources from each other,
    and from the host system. QEMU communicates with the KVM interface to establish
    a guest Linux OS as though it were running on its own private hardware.


    For more information about KVM, see 3.6, "KVM hypervisor components" on page 32,
    and Getting Started with KVM for IBM z, SG24-8332.'
