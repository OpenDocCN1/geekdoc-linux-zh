    on SAMBA is an important feature, the configuration is out of the scope of this
    book.


    For information about how to set up LDAP on Samba, see the Samba official website:

    http://www.samba.org


    # Configuration files


    You can manually set up configuration files for Samba. The main configuration
    file on SUSE Linux Enterprise Server is stored in /etc/samba/smb.conf, and has
    two sections:


    +   * [ global ] for general settings

    * [ ] to specify specific settings about sharing files and printers


