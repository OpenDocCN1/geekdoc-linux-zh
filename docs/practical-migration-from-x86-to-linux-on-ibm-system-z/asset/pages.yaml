    # 5.4.5 Migrating DB2 and Oracle from x86 to LinuxONE


    The following sections provide an overview of the steps that are needed to migrate
    DB2 and Oracle from x86 to IBM LinuxONE. You can find a full example of migrating
    your DB2 data in Chapter 6, "Hands-on migration" on page 121.


    # Migrating DB2 databases across platforms


    Although DB2 has many different ways of migrating the data from one operating
    environment to the target, the simplest and most flexible way of migrating the
    data is using the DB2MOVE command with the INSERT or LOAD parameter.


    Four formats are supported for import and export. The format chosen usually reflects
    the source it comes from or the tools used. Using the extension of files such
    as .ixf, .del, or .asc reveal the content format. For example, a file is named
    employee.ixf contains undeleted DB2 interchange format data. Import can traverse
    the hierarchy of tables in .ixf.


    The following steps present a general overview of how to move an archived database
    between platforms:


    +   1. Connect to the source DB2 database.

    2. Use the export utility to export the database to any of the file formats supported
    by DB2.

    3. Import the exported file to the target environment.


    # Migrating Oracle databases across platforms


    Before Oracle 10g, one of the only supported ways to move an Oracle database across
    platforms was to export the data from the existing database and import it into
    a new database on the new server.


    The following steps present a general overview of how to move a database between
    platforms:


    +   1. Connect to a DBA user, issue the following SQL query to get the exact name
    of all table spaces.

    2. As a DBA you need this information later in the process.


    ```

    SELECT tablespace_name FROM dba_tablespaces;

    ```'
  merge: -1
  img_proc: true
- pgno: 103
  md: '3. As a DBA user, perform a full export from the source database:

    exp <database name> FULL=oradbst.dmp


    4. Move the dump file to the target database server. If you use FTP, be sure to
    copy it in binary format (by entering the FTP prompt) to avoid file corruption.


    5. Create a database on the target server, and create the respective tables, indexes,
    and so on using the DDL Scripts.


    > Note: Before importing the dump file, you must first create your table spaces
    by using the information obtained in step 2 of this list.


    Otherwise, the import will create the corresponding data files in the file structure
    as the source database, which might not be compatible with the file structure
    on the target system.


    6. As a DBA user, perform a full import with the IGNORE parameter enabled:


    ```

    imp <database name> FULL=IGNORE FILE=oradbst.dmp

    ```


    Using IGNORE instructs Oracle to ignore any creation errors during the import
    and permit the import to complete its tasks.


    This method can require an excessive amount of downtime if your database is large.
    Oracle has developed additional methods to migrate from one hardware platform
    to another:


    +   * Transportable table spaces: This technique was introduced in Oracle 8 to
    allow wide tables to be copied between databases in the time it takes to copy
    the data files.

    * Data Pump export/import: These are high-performance replacements for the original
    Import and Export Utilities.

    * Recover manager (rman): An Oracle Database client performs backup and recovery
    on your databases and automates administration of your backup strategies.

    * Oracle GoldenGate: A comprehensive software package for real-time data integration
    and replication in heterogeneous IT environments.

    * Custom procedural approaches.


    # 5.4.6 Tips for successful migration


    All database servers use buffer pools in the shared memory area to manage the
    database memory context. Avoid using any automatic memory management systems to
    allocate memory. For example, if 6 GB of shared memory needs to be allocated to
    the database application, force the database application to allocate all memory
    at the system start.


    If the database server is not using all memory, try to reduce the server memory
    until the paging process occurs. The first result that indicates insufficient
    memory size for the Linux servers is swap paging.


    If the server for any reason is experiencing a processor queue, add more virtual
    CPU to the server. However, monitor the entire workload to avoid having the performance
    of a Linux guest interfere with another guest.


    The data files and log files must be in different file systems and should be striped
    across the storage hardware. Multiple paths to the data to ensure availability.'
