  md: '# 8.5 Deploying high availability clustering


    Both Red Hat Linux Servers and SUSE Enterprise Servers deliver add-on products
    that provide high availability (HA) failover clustering for their respective Linux
    operating systems. These products can be deployed to increase the availability
    and reliability of workloads on LinuxONE. During a catastrophic event that takes
    down one cluster member, the applications running on that member can be automatically
    brought online by one of the other members of the cluster, with no perceived downtime.
    SUSE Enterprise Server High Availability Extensions offer geodistribution clustering,
    enabling the restart of a database or application from a remote site.


    # 8.6 Deploying MediaWiki and MySQL


    A popular application for MediaWiki, the general-purpose wiki that originated
    with Wikipedia. It is written in PHP and uses MySQL as its backend database. This
    configuration is commonly known as a LAMP server, meaning that the application
    employs Linux, Apache, MySQL, and PHP. The Web 2.0 is an ideal workload for LinuxONE.


    The Linux environment on x86 is just as large as it is on LinuxONE, with a few
    exceptions. Configuration files on the x86 are in the same place as your Linux
    images on LinuxONE, unless you choose to keep them in a different place. Here,
    the MySQL configuration files, for example, typically only need to be copied from
    the x86 server to the LinuxONE server and placed in the same location in the file
    system (/etc/my.cnf).


    Migrating to LinuxONE should be tested first in a test environment before performing
    the migration to the production environment.


    In this example, the MySQL database is contained on its own disk partition on
    an external SCSI disk. Likewise, the DocumentRoot of the Apache webserver is also
    stored on its own external SCSI disk, different from the LUN where the MySQL database
    is stored.


    In today''s data centers, it is common to store data on external disks in this
    way. This practice makes it easier to move (migrate) services from one host to
    another. It commodifies the operating system and the various services. This is
    a preferred practice in the industry for these tasks:


    +   Maintaining the configurations of the operating system and services using
    a configuration management tool


    +   Deploying the operating system and services configurations to virtual machines
    using a cloud tool or an external application such as Puppet, Chef, or caffeine-hx


    The infrastructure can be easily adapted and scaled to meet demand, while keeping
    the data available universally from a main storage system.


    In this example, the application data is stored on external disks. Although it
    is possible to back up the data, transfer the data from one host to another, and
    reimport the data into the new running service, this method is very slow. The
    method demonstrated here is a much faster way to accomplish migration tasks.'
  merge: -1
  img_proc: true
