    \ -f /tmp/config.itso.ibm.com.ldap\n\nNow the configuration of OpenLDAP allows\
    \ a migration of the database.\n\n# 8.7.4 Export OpenLDAP data from x86 server\n\
    \nThe LDAP directory tree running on the x86 server now needs to be exported so\
    \ that the data can be transferred to the Linux guest on LinuxONE. To do this,\
    \ complete the following steps:\n\n+   1. Connect to the x86 host, zs4p01-r1,\
    \ using SSH. This example is on RHEL server.\n2. Stop the slapd daemon so that\
    \ the data can be exported from OpenLDAP:\nservice slapd stop\n3. Export the data\
    \ from the OpenLDAP database. The tool used to accomplish this is called slapcat\
    \ which is a common method of extracting whole sets from OpenLDAP. The output\
    \ is written in LDAP Data Interchange Format (LDIF), which is a standard plain\
    \ text data format for representing LDAP:\nslcat -b 'dc=itso,dc=ibm,dc=com' -l\
    \ /tmp/migrate.ldif\nThe -l argument tells slapcat to export the database (in\
    \ the LDIF format) to the file /tmp/migrate.ldif. The -b argument identifies the\
    \ specific domain of data to export (known as the suffix in the OpenLDAP vernacular).\n\
    4. (Optional) Restart the slapd daemon on zs4p01-r1. Because the daemon is being\
    \ migrated to another server, it might not be necessary to restart.\nservice slapd\
    \ stop\n5. Transfer the database file to the Linux guest, LNSUB2, running on LinuxONE.\
    \ Use the transfer mechanism that is most suitable. This example uses a utility\
    \ software and network protocol called rsync:\rsync /tmp/migrate.ldif 9.12.7.90:/tmp/\n\
    \nThe server with the IP address 9.12.7.90 is LNSUB2 and the Linux guest on LinuxONE.\
    \ Provide appropriate credentials when prompted. When the transfer is complete,\
    \ the process of exporting the data from this x86 server to the Linux guest running\
    \ LinuxONE is completed.\n\n170 Practical Migration from x86 to LinuxONE"
