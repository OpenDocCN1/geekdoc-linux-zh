- pgno: 189
  md: '# 8.8.5 Testing syslog-ng


    From the log server (syslog-server-1), you can use the command `tail -f` to monitor
    the messages written to the `/var/log/message file. See Example 8-57.


    Example 8-57 Monitoring the syslog-ng server


    ```

    syslog-server-1:" # tail -f /var/log/messages

    May 21:45:01 syslog-server-1 syslog-ng[32617]: Configuration reload request received,
    reloading configuration;

    May 21:45:01 syslog-server-1 syslog-ng[32617]: New configuration initialized;

    ```


    To test the client, you can use the `logger` command:


    Example 8-58 shows the results from the log server (syslog-server-1).


    Example 8-58 Getting logs from the syslog-ng clients


    ```

    syslog-server-1:" # tail -f /var/log/messages

    May 21:45:01 syslog-server-1 syslog-ng[32617]: Configuration reload request received,
    reloading configuration;

    May 21:45:01 syslog-server-1 syslog-ng[32617]: New configuration initialized;

    May 21:50:39 syslog-client-1 root: Testing syslog-ng

    ```


    For alternative setups, see the official configuration website:


    http://www.balabit.com/support/documentation


    # 8.8.6 Migrating syslog-ng


    You can use syslog-ng as a tool for migrating. You can set up a centralized log
    server to keep a copy of the log files for all the servers that you are migrating.
    If this configuration, a problem happens on the server and you lose access, you
    can easily fetch information or error messages.


    If you are migrating an existing syslog-ng server/client, check whether syslog-ng
    is installed on the target server. Also, ensure that the configuration file is
    compatible with the version running on Linux. To migrate the data, you can use
    an VM snapshot to transfer the log volume to the new server. Other commands such
    as `tar` and `rsync` be used to transfer the old log files. You can see a practical
    example of LVM snapshot, `tar`, and `rsync` in Set up IBM System for Production,
    SQ24-8137.


    # 8.9 Deploying Samba


    Samba is an open software suite that serves the Server Message Block (SMB) over
    the Internet protocol and provides seamless file and print services to users.
    Although several commercial products are available, Samba is the implementation
    that is most commonly used in Linux environments to share files and printers.
    It is available for LinuxONE from both Red Hat and SUSE and allows interoperability
    BETWEEN UNIX/Linux servers and Windows/Linux based clients. Samba runs easily
    on LinuxONE because its hardware has fast I/O that provides high-performance access
    to applications and files.'
  merge: -1
  img_proc: true
