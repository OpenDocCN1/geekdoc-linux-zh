    ```


    The output in Example 8-40 is similar to the information seen on z4p0-s1, the
    iSCSI target that you gathered in the preceding steps, such as the IP address
    of the iSCSI target, the iSCSI Target Identifier, and the Ls that the iSCSI target
    is exporting. In this example, the target devices will be mounted on insubd2 (which
    contains the Apache web file system) and LUN3 (containing the MySQL database files).
    Although LUN1 is listed, LUN1 is not used in this exercise:


    ```

    9.12.7.97:3260,1.iqn.2014-04.ibm.itso:LUN2

    9.12.7.97:3260,1.iqn.2014-04.ibm.itso:LUN3

    ```


    +   3. Log to the remote iSCSI disk, discovering the LUN (LUN2) for the Apache
    web disk:

    iscsiadm --mode=node --portal=9.12.7.97 --targetname=iqn.2014-04.ibm.itso:LUN2

    --login


    The output that in Example 8-41 represents a successful login.


    Example 8-41 Successful login to iSCSI target''s LUN2


    ```

    insubd2~ # iscsiad --mode=portal=9.12.7.97 --targetname=iqn.2014-04.ibm.

    itso:LUN2 --login

    Logging in to :iface: default, target: iqn.2014-04.ibm.itso:LUN2, portal: 9.12.7.97,

    3260] [multiple] success.

    ```


    In your environment, the iSCSI target will probably require more sophisticated
    authentication for login. In this example, the iSCSI target requires no credentials
    of any kind.


    +   4. Repeat the login, this target specifying LUN3, which contains the MySQL
    data partition:

    iscsiadm --mode=node --portal=9.12.7.97 --targetname=iqn.2014-04.ibm.itso:LUN3

    --login


    > Note: The --login subcommand on Linux Enterprise Server causes the iSCSI target
    to connect only to the specified LUN. Therefore, only the specified LUN is viewable.
    However, with RHEL, the --login subcommand allows you to see and manipulate all
    the LUNs that are available on the iSCSI target that are authorized by the login.
    This behavior on RHEL means that only one login step is needed. One challenge
    of it that after the login is accomplished, all the iSCSI LUNs are given /dev/sdx
    assignments regardless of whether they are wanted.


    +   5. See how the remote LUNs are connected to host insubd1:

