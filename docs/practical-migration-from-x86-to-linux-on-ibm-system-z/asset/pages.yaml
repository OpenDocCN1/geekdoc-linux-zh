    In this architecture, the workload definitions and resource abstraction are made
    well known to the orchestration platform. Business rules are used to identify
    required service components are defined along with the necessary infrastructure
    resources.


    The infrastructure resources are then managed by these components:


    +   - Software-defined compute provides workload-aware infrastructure management
    and optimization.


    +   - Software-defined networks for virtual environments, such as Linux, create
    a virtual network for virtual machines that is decoupled and isolated from the
