    # 8.8.4 Client configuration


    To configure the syslog-client, a deployment needs to be created to point to the
    log server. In addition, a new log statement needs to be added to the client source
    to the destination. Append the lines shown in Example 8-55 to the syslog-ng.conf
    of the client, using your client''s IP address.


    **Example 8-55** Append these lines to your client configuration to create a destination
    for the log server


    ```

    destination logserver {"9.12.7.88" port(514)); };

    log { source(src); destination(logserver); };

    ```


    In this example, all logs from the client are sent to 9.12.7.88 (Insuashvili)
    through UDP using port 514. This is a simple configuration, you can set filters,
    new destinations, and sources depending on the requirement of your environment.


    Restart your syslog-ng client as shown in Example 8-56.


    **Example 8-56** Restarting the syslog-ng client to update the configuration


    ```

    syslog-client-1:"# /etc/init.d/syslog restart

    Shutting down syslog services done

    Starting syslog services done

    ```'
