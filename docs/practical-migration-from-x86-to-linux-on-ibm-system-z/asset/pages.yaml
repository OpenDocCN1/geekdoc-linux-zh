- pgno: 107
  md: '# 5.5.6 General archival migration considerations


    Multiple ways of migrating data from the existing operating environment to another
    operating environment are available:


    +   - Change in the hardware environment

    - Change in the hardware and software environment


    # Change in the hardware environment


    This scenario applies when the hardware (servers and storage devices) is replaced
    by newer and more efficient hardware environments.


    Sometimes change in the hardware environment leads to a change of storage technology,
    which means reorganizing the media data content. Therefore, to allow efficient
    retrieval the data inventory structures might need to be reconverted.


    Because the operating system and the backup and archival management tools are
    going to be retired or upgraded, there will not be any incompatibility with the
    archived data. This fact also means that the migration will be relatively straightforward
    because the storage backup and archival manager product are able to access the
    archived data.


    Often backup and archival managers have built-in migration tools that migrate
    the archived data from the source operating environment to the target environment.
    This is a useful time to reorganize the archives and purge unwanted data so that
    you efficiently reduce the storage needs of the archives.


    # Change in the hardware and software environment


    This scenario applies when the IT department decides to move to a totally new
    operating environment (both hardware and software). In this case, both the hardware
    and software technologies must be replaced. The hardware can have a highly efficient
    virtualization server and the software can have new technologies that are either
    proprietary or open source.


    # 5.5.7 Migrating to new backup software


    This section describes the migration approaches that you can employ when changing
    the target environment''s software stack.


    # Your old software is not compatible with LinuxONE


    In this approach, because your guest is not compatible with the old software,
    archived data must be restored to a staging server compatible with the old backup
    tool. Use the staging server to restore the archived data and share it with the
    new LinuxONE server that is connected to the new backup software. The following
    is an example of this:


    +   1. From the existing archival software, the archived data needs to be restored
    to a staging server that is compatible with the old backup software.

    2. Connect the new server running LinuxONE that is used for the current backups
    and archives to the staging server (using a shared file system, for example) to
    access the already restored logs.

    3. The new backup and archival connects to LinuxONE, accesses the restored data,
    and rearchives it according to defined organizational attributes and backup policies.


    94 Practical Migration from x86 to LinuxONE'
