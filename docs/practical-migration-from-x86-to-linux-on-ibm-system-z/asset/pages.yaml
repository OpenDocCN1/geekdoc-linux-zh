- pgno: 170
  md: '# Start MySQL services on SUSE Linux Enterprise Server


    Set the MySQL database service to automatically start each time that the server
    is booted, then manually start the service using these commands:


    ```

    chkconfig mysql on

    service mysql start

    ```


    # Start MySQL services on Red Hat Enterprise Linux


    As before Apache, the MySQL database service is named slightly differently in
    RHEL than it is in SUSE Linux Enterprise Server. To set MySQL to start each time
    that the server is booted, and to manually start the service, issue the following
    commands:


    ```

    chkconfig mysql on

    service mysql start

    ```


    > Note: SUSE Linux Enterprise 11 SP3 and RHEL 6.4 both use SysVinit commands.
    SUSE Linux Enterprise Server 12 and RHEL 7 are both slated to replace SysVinit
    with system management of services.


    # Verifying that MySQL is working


    MySQL must be configured and working properly before MediaWiki can be installed.
    Complete these steps to verify that MySQL is working:


    +   1. Copy a sample configuration file for MySQLs production configuration, /etc/my.cnf.
    Then apply the appropriate ownership and access. Reading through the configuration
    file to understand its contents is a good idea. Example 8-34 shows sample commands.

    Later, when migrating from the x86 server, you will likely copy the my.cnf file
    from the x86 server to LinuxONE. For now, the example my.cnf configuration file
    is sufficient to test the functions of the system before migrating.


    Example 8-34 Configure MySQL configuration file


    ```

    cp /usr/share/mysql/medium.cnf /etc/my.cnf

    chown root:root /etc/my.cnf

    chmod 640 /etc/my.cnf

    ```


    > Note: The default permissions of /etc/my.cnf are 644, allowing anyone to read
    the MySQL configuration settings. Preferred practices in security suggest that
    system services should not provide unnecessary information to privileged users.
    Setting the permissions to 640 prevents privileged users from discovering information
    about the configuration of the MySQL server.


    +   2. Set a temporary password for the database administrative user. Remember
    this password because it is required during a few steps of the process before
    migrating the MediaWiki application from the x86 server. This can be the same
    password as the MySQL database that later be migrated, but does that have to be.
    Use the command shown in Example 8-35 to set password.


    Example 8-35 Set administrative password for the MySQL service


    ```

    mysqladmin -u root password ''agoodpassword''

    ```


    With the admin password set for the root user, all future interactions with the
    MySQL database require providing a password. General administrative functions
    require the root password, whereas commands that involve MediaWiki use a different
    password.'
  merge: -1
  img_proc: true
- pgno: 171
  md: "Note: Quotation marks in Linux can be a bit tricky. When setting the root password,\
