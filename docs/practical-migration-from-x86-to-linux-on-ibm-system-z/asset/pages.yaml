- pgno: 78
  md: 'You can isolate the entire secure network from the physical network segment
    by using multiple partitions. The communication between the partitions is managed
    by HyperSocks devices. Figure 5-9 illustrates an example.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_78_0.png)


    Figure 5-9 Multiple virtualized network scenario with multiple LPARs


    > Note: Although the use of HyperSocks for this scenario is possible, it might
    not be the best solution. If one of the LPARs is CPU-constrained, using HyperSocks
    could cause a delay of network traffic. For more information about HyperSocks,
    see *Set Linux on IBM System for Production, SG24-8137.*


    # VLAN segmented network


    The use of the VLAN tag on virtual switches. The VLAN configuration helps the
    segmentation of network packages, bringing security and organization to the environment.
    It facilitates the administration of the network by grouping the guests with common
    requirements regardless of their physical location. The VSWITCH, like a physical
    switch, provides full authorization on a per port basis for membership in a VLAN
    segment.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'For a high security network scenario, use the LPAR environment mixed with the
    multiple network segmented solution. As illustrated in Figure 5-8 on page 64,
    the entire LinuxONE environment is virtualized and all configurations are made
    per virtual machine, which increases the security, reduces the complexity, and
    simplifies the environment.


    # ## 5.1.4 Helpful steps for a network migration


    The Linux administrators and network administrators should work together to engineer
    the best solution for your environment. Complete the following basic steps:


    +   1. Determine the new IP addresses for the new servers. Each IP address should
    be on the same IP network to minimize the number of variables of the entire migration.

    2. Determine the VLAN IDs of the Linux servers.

    3. Configure the VSWITCH with the listed VLAN IDs.

    4. Configure the Linux servers using the designated IP addresses.


    At this point, the Linux server must be assigned a host name that is different
    from the source server name:


    +   1. Migrate the applications (for more information, see 5.3, "Application analysis")
    on page 76) and files from the source server to the target server.

    2. Shut down the source server.

    3. Change the Linux server''s host name.

    4. Change the DNS registered name to the new Linux IP address.


    If the application is an IP-based application, you can change the IP address of
    the target Linux server to the source IP address.


    # ## 5.2 Storage analysis


    This section explains concepts and designs, such as online migration and offline
    migration, regarding the storage configuration possibilities for LinuxONE. Other
    storage migration issues are also covered.


    # ## 5.2.1 Data migration


    Two models of data migration are discussed in this section:


    +   > Online migration refers to case where the source server, target servers,
    and all services are up and running, and a system outage is not required.

    > Offline migration requires a service outage to switch over from the source server
    to the target servers.


    These migration models are covered in more detail in the following subsections.


    In both types of data migration, some unexpected issues must be carefully considered.
    The result of not doing so might lead to an extended outage, unexpected downtime,
    data corruption, missing data, or data loss.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Online data migration


    Some applications are eligible for online migration. To be eligible, an application
    must provide multi-operating system clustering support and be available on LinuxONE.


    To perform an online migration, complete these steps:


    +   1. Install and configure the Linux guest. See 5.2.2, "LinuxONE: pre-installation
    considerations" on page 70 for more details.


    +   2. Install the middleware application on the Linux guest.


    +   3. Copy the application data to the target Linux guest.


    The software application selection depends on the type of data that needs to be
    copied. Solutions like the Linux sc program can be used in online data migrations
    where the application does not change or the changes are totally controlled.


    Otherwise, the Rsync software application can be used to synchronize the data
    between the server in a small amount of time during the migration process.


    +   4. Include the Linux guest in a cluster as a cluster node.


    +   5. Monitor the Linux guest to verify that the application is responding to
    requests correctly.

    This step is not a test of the application on LinuxONE. The application must be
    tested on a development system to ensure that the application is a LinuxONE compatible
    application (see 5.3, "Application analysis" on page 76 for more details).


    +   6. Shut down the source servers.


    Always consider the content of the data that is migrated before selecting online
    migrations as a solution.


    To avoid such issues, online data migration must be run during off-hours, and
    you should always take a data backup just before the actual data migration activity
    begins.


    # Offline data migration


    Offline data migration can apply to all system migrations. This kind of migration
    can be achieved using several different approaches and functions:


    +   Using the network mount points NFS or Samba connections and ensure the DD
    or CP Linux command.


    +   Using an FTP server on the source or target server.


    +   Using an SCP/SSH server between the server and the target server.


    +   Using the Rsync synchronization application between the source or target server.


    +   Attaching the storage volume to a Fibre Channel device (Linux-to-Linux migration).


    # Using the Rsync application


    For a better result when using the Rsync application, schedule synchronization
    for an entire week before the outage by completing these steps:


    +   1. On the first migration day, run the first synchronization.


    Run the first synchronization during a time when the use of the server is low.
    Rsync only copies files that are not locked, which avoids any issues with files
    in use. However, during this time server response might be slower than normal
    because of the extra read I/O activity.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '2. During the migration week, you can run a daily synchronization on the server
    during off-peak hours.


    Only modified files are copied from the source to the target server.


    3. The last synchronization day is the server outage day, when access to the source
    server is denied to users.


    Because there are no open files, the Rsync application is able to copy all files
    to the target servers.


    4. Shut down the source servers and start all services on the target Linux servers.


    # Transferring files over the network


    Database migrations are the most common example of the requirement for files to
    be transferred over the network. That is because most database software needs
    an offline backup that includes a data export or data dump to a new file.


    That exported/dumped file needs needs to be transferred across the network, and
    the database import procedure must be run at the target server. See 5.4, “Database
    analysis” on page 84 for more details.


    # Migrating storage volumes


    When the source servers are Linux86 and connected to an external storage device
    using Fibre Channel, and a zFCP device is part of the same storage area network
    (SAN), you can connect the source Linux volume to the target Linux guest on a
    LinuxONE server. However, both servers cannot share a volume at the same time.


    # Storage SAN Volume Controller


    One option to simplify the storage and data migration for Fibre Channel disks
    are involved in a migration to LinuxONE is to install the IBM System Storage®
    SAN Volume Controller.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'The SAN Volume Controller sits in the channel path and allows you to visualize
    all FCP storage from multiple vendors that sit behind it. Figure 5-10 shows where
    the SAN Volume Controller sits in the SAN. The SAN Volume Controller has visibility
    to all supported storage on the SAN.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_82_0.png)


    Figure 5-10 SAN Volume Controller


    The following benefits are provided by the SVC:


    +   - Single point of control for heterogeneous storage resources

    - Dynamic data migration between heterogeneous storage devices on a SAN

    - Ability to pool the storage capacity of multiple storage systems on a SAN

    - Scalability to support up to 1024 host servers

    - Instant copies of data across multiple storage systems with IBM FlashCopy®

    - Copy data across metropolitan and global distances as needed to create high-availability
    solutions


    When migrating Linux systems from x86 to LinuxONE, the SAN Volume Controller allows
    you to non-disruptively migrate data to LinuxONE. For more information about the
    IBM System Storage Volume Controller, see the following site:


    http://www.ibm.com/systems/storage/software/virtualization/svc


    Additional information is available in these publications:


    +   - Introduction to Storage Area Networks, SG24-5470

    - IBM System Storage SAN Volume Controller and Storwize V7000 Best Practices and
    Performance Guidelines, SG24-7521

    - Implementing the IBM System Storage SAN Volume Controller with IBM Spectrum
    Visualize V7.6, SG24-7933

    - Implementing FlashSystem 840 with SAN Volume Controller, TIPS11337'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Helpful steps for an auxiliary storage migration


    The multiple possibilities provided by LinuxONE to store and access files leads
    to many types of solutions. The solution that you design for the target system
    dramatically affects the flexibility, efficiency, and performance of the migrated
    application.


    For source applications that are on servers where storage is local or the external
    storage is not compatible with Fibre Channel data storage, all data must be copied
    using the network file system from the source server to the target server (LinuxONE):


    +   1. Create a server file system with mounts for all data files.

    2. Create a temporary file system to be used in the file transfer process on the
    target server.

    3. Configure the target server as an NFS file server, a Samba file server, or
    an FTP File Server to upload the files from the source server.

    4. Note the following points:


    +   - If there is enough space at the source server to compact all of the data,
    consider data compression features as zip, or tar with gzip and bzip. Both of
    these formats are compatible with LinuxONE. The data can be transferred by using
    an FTP server that is configured on the target.

    - If not enough space is available at the source server to compact the data, the
    NFS file system or map the Samba file system at the source machine, and copy the
    files across the network.


    +   5. Verify the correct file permissions at the target directory. Adjust file
    permissions after the transfers for work.


    For file storage in an external storage system with Fibre Channel, you can migrate
    to a LinuxONE server configured with zFCP adapters to connect directly to the
    volumes that should be migrated to LinuxONE.


    # 5.2.2 LinuxONE: pre-installation considerations


    The storage and file system design has a direct influence on system performance,
    system availability, and the capabilities for system expansion.


    A best practice for LinuxONE is that only one version of a Linux distribution
    should be installed from scratch. Therefore, design the basic Linux file system
    to allow the highest possible model of servers and then clone all the other Linux
    guests in the environment from this source (called the golden image). IBM Wave
    for z/VM, this golden image is called a prototype. The file system that stores
    the application data is created after the cloning process depending on the needs
    of the application that resides on the server. If you want to know how to create
    SUSE Linux Enterprise Server 11 or RHEL 6.4 golden image, see The Virtualization
    Cookbook for IBM z Systems Volumes 1: IBM z/VM 6.3, SG24-8147.


    # Logical Volume Manager


    All file systems, except the root (/) system, should be created as Logical Volume
    Manager (LVM) devices. File systems that are created with an LVM make it possible
    to expand or reduce the file without a system outage (using SUSE Linux Enterprise
    10 SP2 or higher, RHEL 5.0 or higher and LVM2).


    The LVM is useful for Linux file systems because it allows you to dynamically
    manage file size and has tools to help back up and restore failing partitions.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'Basically, LVM volumes are composed of the following components:


    +   - Physical volume

    nA physical volume (PV) is a storage device, such as a SCSI device connected over
    an Fibre Channel Protocol (FCP) device.


    +   - Logical volume

    A logical volume (LV) is the disk partition of the LVM system. This is the area
    that is formatted and accessed by users and applications. The LV is exposed through
    a mount point.


    +   - Volume group

    A volume group (VG) is the highest level of the LVM unit. A volume group is created
    by one or more physical volumes and gathers together the logical volumes.


    Figure 5-11 shows minifyEnabled (mDisk) devices that are used by a Linux guest
    to create a unique VG. It is then further organized or allocated into two LVMs.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_84_0.png)


    Figure 5-11 LVM example


    However, a small performance price must be paid when using LVM. However, the flexibility
    of LVM outweighs the cost of the performance loss.


    For more information about the LVM setup during the installation, see The Virtualization
    Cookbook for IBM z Systems Volume 1: IBM z/VM 6.3, SG24-8147.


    # Linux file system


    As mentioned previously, design the basic Linux OS file system so that one image
    (the golden image or prototype) can be cloned and used on many Linux servers as
    possible.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'The golden image should include the following file systems:


    +   - root (/) file system

    - /boot file system

    - /usr file system

    - /var file system

    - /tmp file system

    - /opt file system

    - /home file system


    The following sections describe these file systems in more detail.


    # The root (/) file system


    The root file system is the first file system to be created, and it is the base
    for all other file systems in the hierarchical structures of the Linux operating
    system. A size of 350 MB is generally enough for the root file system.


    > Important: The root (/) file system should not be placed on an LVM device because
    an LVM failure, you can recover the system using the single user mode.


    # The /boot file system


    /boot file system is often left as a subdirectory under root (/), but maintaining
    its directory structure as its own partition can be useful. The /boot file system
    contains the boot files, such as the kernel, the part file, the initial ramdisk,
    and in Linux, the /boot partition contains boot configurations such as zPL or
    GRUB. Because it holds the kernel files, it might be considered the most important
    partition of all. Keeping it as one partition helps preserve its status and maintain
    its integrity.


    > Important: Like root (/), do not place the /boot file system on an LVM device.
    The preferred file system type for /boot is EXT3.


    # The /usr file system


    /usr file system is where all Linux standard applications are installed. The files,
    libraries, and shared files are copied to this directory during the installation
    process. The file system size depends on the type of server you are running and
    on the distribution-based packages that need to be installed for the functions
    that the server provides.


    Keep the golden image /usr file size at the minimum to support the basic Linux
    distribution files. You must be able to increase this file system because after
    cloning the server, the system administrator might need to increase the file system
    to install new packages or additional package dependencies.


    Create this file system on LVM devices that allow you to dynamically extend or
    reduce the file system size.


    In a shared Linux environment, this file system can be set as read-only the system
    simply needs to read the application file into memory. This setup also offers
    an security benefit because no one can delete or change any file in a directory
    mounted as read-only.


    # The /var file system


    /var file system is where all the variables files (such as spool files, cache
    files, and log files) are written. The /var file system has files that are constantly
    changing such as /var/log/messages and /var/log/secure.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'The size of the file system depends on the number and type of applications
    that are running and how long the log files are kept on the server. Also, consider
    whether the application is designed to write files here, and their sizes and frequencies.


    The services controls are also placed on the /var file system so it can never
    be scaled to be a shared file system and it must always be read/write.


    Because it is a dynamic file system, place it on an LVM device to allow it to
    be extended or reduced as needed.


    # The /tmp file system


    The /tmp file system was originally designed to store operating system and temporary
    application files. These files would be deleted every time that the system is
    rebooted or deleted by the application immediately after the file is no longer
    in use. Some homemade applications use the /tmp file system as a dump area or
    an exchange file resource. Rare cases, the size of the /tmp need to be increased.


    Because it is a dynamic file system, place it on an LVM device to allow the capability
    to be extended or reduced as needed.


    # The /opt file system


    Deploy all third-party applications in the /opt file system. As a preferred practice,
    further organize the /opt directory by the company or organization that developed
    the application or software. The next directory level specifies the software package
    that is installed. For example, install a DB2 for Linux server at /opt/ibm/db2.
    Place a WebSphere Application in the /opt/ibm/websphere directory.


    The file system size depends on the size of the software packages that will be
    installed in it. It is easy to estimate the requirements for a single package
    software. However, upgrades, maintenance, and additional software packages are
    not so easy to plan. The /opt file system can also be a dynamic file system and
    should be configured on an LVM device.


    # The /home file system


    The /home file system is designed to allocate user files. The size of the file
    system depends on the server function and the number of users who are defined
    on. For example, application production servers do not need a /home file system
    because development staff will store files on a production server. However, it
    is expected that applications will be developed on a development application server,
    so developers need sufficient file system space to create and transfer their files.


    Depending on the situation, the /home file system can be a dynamic file system.
    If it is dynamic, configure it on an LVM device.


    # Other file systems


    An example of additional file systems that might be created on a specific server
    during the migration process is the database server file. Basically, you need
    to have at least one file system for file data and one for log files. Therefore,
    a minimum of two file systems must be created in addition to the file system where
    the application binaries are installed. For an IBM DB2 database server, the default
    location for the binary files is /opt/ibm/db2.


    Other database management systems put their data in other directories. For example,
    the MySQL database server''s default location for data files is the /var/lib/mysql
    directory. If the server is a MySQL database server and you are using the Linux
    distribution from Red Hat or SUSE Linux, consider including a new file system
    at the /var/lib/mysql mount point.


    Chapter 5. Migration analysis 73'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'For each target database management server, make sure that you know where the
    binary files and the data files will be located. Only with this information can
    you plan to create the devices and files for the target system.


    There might be file location differences depending on the distribution of Linux
    that you install at your site. Make sure you know these differences, if any, and
    plan for them.


    # Additional resource


    For more recommendations, like volume group and disk naming conventions, see *Set
    up Linux on IBM z for Production, SG24-8137*.


    # Shared file system


    The data storage in a LinuxONE environment can be shared physically by one or
    more Linux guests. However, because of limitations of the file system, it is not
    possible for two Linux guests to have read/write control to a device at the same
    time. However, this configuration might be possible at the hardware level.


    In a shared disk environment, remember that the file system changes performed
    by a guest machine that has the read/write control are only available to other
    guests who share the file system after unmount and mount of that system. As an
    example, think of the environment of a web cluster service where the application
    servers only need read access to the web pages and do not need to write to the
    same file system where the files are allocated.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'In the example shown in Figure 5-12, only the special file system and mount
    points relevant to the solution are represented. The data file location is mount
    point /srv/www/app. This is the file system that is shared between the Linux guests.
    There is also the shared file system /opt/ibm/IBMHTTP, where the web server binary
    files are installed. If the IBMHTTP service, the log files are redirected to the
    local /var/log/httpd file system. All shared devices are the same device type,
    and are managed by the zVM operating system.


    # Enterprise Storage Server


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_88_0.png)


    Figure 5-12 Shared devices example


    The benefits of using a shared file system are based on economy of resource. You
    can reduce application binary space allocation and code updating efforts because
    you only have one master server and remount it on the subordinate servers.


    > System: System administrators must pay special attention to managing this kind
    of environment if the same file system is mounted as read/write in two different
    servers, all data might be lost.


    # Disk devices


    A Linux guest can talk to multiple disk devices of the same or different device
    type. This feature is helpful when using large file systems, such as in the case
    of database servers. A SCSI LUN, accessed by a zCP device, provides better response
    time compared to a similarly configured IBM ECKD™ DASD device, which is common
    on Z platforms. If you wanted, you could split up a single disk into partitions
    with the fdisk or fdasd Linux utilities, or into minidis with z/VM.


    A combination of both solutions can help you improve system performance and storage
    resources efficiently. For more information, see *Linux on IBM System z: Performance
    Measurement and Tuning*, SG24-6926.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Software-defined storage


    The IBM LinuxONE brings support for IBM Spectrum Scale and other software-defined
    storage technologies. This newer virtualization abstracts the rich features that
    are found in a single enterprise storage system so that they become available
    across multiple storage facilities. This feature provides tremendous benefits
    in the clustering technologies used for High Availability solutions and data replication
    backup.


    For more information about IBM Spectrum Scale, see:


    ```

    http://www.ibm.com/systems/storage/spectrum/scale

    ```


    # 5.3 Application analysis


    This section describes the analysis that you need to perform to identify applications
    that would be good candidates for migration to LinuxONE.


    This section deals with the following topics:


    +   - How to identify the best candidates for a migration to LinuxONE

    - How to select the appropriate application for a LinuxONE proof of concept

    - What can you do if your independent server (ISV) does not support LinuxONE

    - How you can accommodate application interdependencies in a LinuxONE environment

    - How you can redesign your application to take advantage of the strengths of
    the LinuxONE platform


    # 5.3.1 Why migrate applications


    Only perform application migration after thorough planning. You also need a compelling
    reason to act, such as the following real world situations:


    +   - An existing application has outgrown its original platform and is close
    to reaching the architectural limits of the platform.

    - Software license costs are rapidly increasing as servers are added to an application.

    - Performance issues are arising between distributed application servers and centralized
    databases.

    - Uncontrolled distributed server growth is leading to power and cooling issues
    in the data center.

    - Complex distributed systems, which are costly to maintain, are suffering from
    increasing unreliability.

    - New application development is required following a merger or acquisition.

    - Regulatory requirements impose the need for a more secure environment.


    Such situations present valid reasons for considering a migration to a more efficient
    platform like IBM LinuxONE. In cases, a migration to LinuxONE will help an organization
    realize significant cost savings over three to five years. Which applications
    can you migrate and what risks are associated with the migration?


    The output of this exercise is a list of an organization''s applications ordered
    by complexity. The list is based on factors such as the number of servers or applications
    that make up the "IT systems", and can be grouped as large, medium, or small applications
    or number of servers.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# ## 5.3.2 Which applications can be migrated


    Every computing platform offers specific areas of strength, and the aim of a migration
    should be to select applications that take advantage of the strengths of the target
    platform. The strengths of IBM LinuxONE include high availability, high I/O bandwidth
    capabilities, the flexibility to run disparate workloads concurrently, and excellent
    disaster recovery capabilities.


    Another key element in choosing the appropriate applications for migration is
    whether they are supported on LinuxONE. This consideration is normally not a problem
    with homegrown applications, depending on what language they were written in.
    Also, LinuxONE has a long list of open source applications available on the platform.


    # ## 5.3.3 Selecting the basic rules for migration to LinuxONE


    This section lists and describes the basic rules for selecting an application
    to migrate to LinuxONE.


    The following list includes applications that cannot or should not be migrated
    to LinuxONE, and which are unwise:


    +   - Applications that are available only on Intel or UNIX platforms.

    - Requesting an ISV to support their application on LinuxONE is a long process.

    - Servers that have already been virtualized.


    In such cases, most of the cost of ownership (TCO) benefits of virtualization
    have already been realized and only minor benefits can be achieved. However, if
    the existing virtual environment is reaching its limits or the server leaves are
    within 9 to 12 months of expiration, there might be a good business case for moving
    the applications to LinuxONE because of its higher virtualization capabilities.


    The following list includes applications that are suitable for migration and why
    they are suitable:


    +   - Applications or middleware (database, application servers, and so on) that
    are supported by a software vendor on multiple platforms, including LinuxONE.

    - There are no support issues and migration is much simpler.

    - Applications that need close proximity to data on IBM LinuxONE, or that are
    components of LinuxONE applications.

    - Applications with high I/O or transactional I/O. Because of its design, LinuxONE
    excels at handling high I/O rates.

    - Applications with lower sustained CPU peaks and average memory needs. The platform
    has been designed to run multiple workloads at a consistently high CPU and memory
    utilization.\n- Application development environment for Linux on other platforms.


    The virtualized LinuxONE platform provides an ideal environment to test applications
    before their deployment to Linux on other platforms.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# 5.3.4 Applications that are best suited for migration


    The applications that are described in this section gain the most benefit from
    the LinuxONE platform strengths, including high availability, high I/O bandwidth
    capabilities, the flexibility to run disparate workloads concurrently, and excellent
    disaster recovery characteristics.


    Applications that are used to communicate directly with earlier mainframe applications
    are able to use the architectural advantages of the LinuxONE platform.


    # IBM software


    IBM has ported many of its products to LinuxONE. The benefit to customers is that
    a migration from one platform to another is in effortless because many of these
    products share their code base across multiple platforms. This benefit is particularly
    the case for IBM WebSphere Application Server, since Version 6, has the same code
    base on Intel x86, IBM POWER®, System z®, and LinuxONE, simplifying migration
    considerably.


    LinuxONE offers various solutions, which you can see here:


    http://www.ibm.com/systems/linuxone/solutions/


    Generally, migrating from IBM products on distributed servers to the same IBM
    products on LinuxONE is a relatively straightforward process. You can see examples
    in Chapter 6, "Hands-on migration" on page 121.


    # DB2


    You can use DB2 for Linux, UNIX, and Windows on LinuxONE. It works seamlessly
    in the virtualized environment without any additional configuration. In addition,
    the autonomic features as self-tuning memory management, and enhanced automatic
    storage help the database administrator to maintain and tune the DB2 server. To
    see a migration example from x86, see 6.2, "Migrating DB2 and its data" on page
    125.


    You can find more information and use cases in DB2 10 for Linux on System z Using
    v/M v6.2, System Image Clusters and Guest Live Replication, SG24-8036.


    # Oracle


    Oracle database is fully supported on LinuxONE and in an efficient manner on this
    platform, so it is a good candidate for migration to LinuxONE.


    Oracle databases on LinuxONE also support Real Application Clusters (RAC), the
    Oracle high availability clustering solution. The advantages for Oracle RAC on
    Linux are a high-availability cluster with low latency within the LinuxONE platform
    that is combined with HiperSockets communication.


    The Oracle WebLogic Server is also supported on LinuxONE, and allows you to have
    a complete Java environment and high availability Oracle database within the same
    server.


    In many cases, Oracle supports mixed configuration where the database tier sits
    on Linux and applications for Oracle E-Business Suite, Oracle Siebel, and Oracle
    Intelligence running on distributed servers under Linux, WINDOW, or UNIX. To obtain
    the latest information about which Oracle products are certified for LinuxONE,
    contact your Oracle representative or refer to the following website:


    http://www.oracle.com/technet'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Additional information can be found in:


    +   * Experiences with Oracle 11gR2 on Linux system, SG24-8104

    * Experiences with Oracle Solutions for Linux on IBM system, SG24-7634

    * Experiences with Oracle Database 12c Release 1 on Linux system, SG24-8159


    # Big data Hadoop solutions on LinuxONE


    Big data analytics solutions that are built on the IBM Linux platform are designed
    to harness the data explosion that is facing the businesses. IBM has taken a leadership
    role in optimizing clusters that are ready for immediate deployment. These solutions
    are built on IBM InfoSphere software like BigNights and Streams. IBM has also
    taken its leading role in the open community seriously. IBM has made heavy contributions
    to projects like Apache Hadoop, enabling continuous development in the fields
    of analytics and high performance computing. Clients and solution builders who
    want to innovate on top of a high-performance data analytics platform can take
    advantage of the flexibility, throughput, and resiliency of IBM LinuxONE, and
    the immense price-performance value provided by LinuxONE solutions.


    # MongoDB solutions on LinuxONE


    MongoDB''s NoSQL technology eliminates the processor burden of - relational mapping.
    It enables developers to build and deploy modern applications rapidly, without
    having to define a data schema ahead of time and contend with restrictions. Main
    features of MongoDB include flexible data modeling, cloud and on-premises cluster
    management and automation, expressive query language, always-on global deployments,
    scalability, and high performance.


    A LinuxONE server running Node and MongoDB can handle over 30 billion events per
    day while maintaining 400k reads and writes. The peak MEAN stacks up to 2x faster
    than other platforms. IBM LinuxONE allows MongoDB to scale vertically with dynamically
    allocated resources, instead of horizontally sharing and sharding the database.
    LinuxONE and MongoDB provide strong consistency, ensuring that critical data remains
    consistent, and minimize sharing-related processor usage.


    # 5.3 Other software


    This section lists some non-IBM software that are good candidates for migrating
    to LinuxONE.


    # Infrastructure services


    The following infrastructure services are good candidates for LinuxONE:


    +   * Network infrastructure, FTP, NFS, DNS, and so on, are well served on LinuxONE.
    These workloads are generally minimal, but are critical to the business. The main
    benefit of hosting these services on LinuxONE is the availability of the hardware''s
    disaster recovery capabilities.


    Additionally, a significant amount of network traffic is generated between IBM
    z/OS and FTP and NFS servers. When the servers are hosted on the same system as
    the data and HiperSockets, this network traffic is greatly reduced, and the batch
    processing window for that data can be reduced.


    +   * LDAP security services fit very well running on LinuxONE, including OpenLDAP
    products as well as commercial products like IBM Tivoli® Directory Server, Tivoli
    Directory Integrator, and Tivoli Access Manager. Using LinuxONE architecture,
    clients can build a robust LDAP infrastructure.'
  merge: -1
  img_proc: true
