- pgno: 186
  md: '# Global options


    You can specify several global options in the options statement of syslog-ng.
    You can define how the host name of the client appears in the log files, enable
    or disable DNS cache, use the ownership of the files and some other features that
    you use depending on the size or specific requirements of your environment.


    # Source options


    The source keyword is used to add source drivers or define your own sources. For
    example, the syntax to syslog-ng and define a UDP or TCP connection to listen
    for remote hosts is the following:


    ```

    s_net { tcp(ip(127.0.0.1) port(40000)) }; udp ();

    ```


    This entry in the configuration files defines a source s_net that listens on localhost
    to port 40000 using TCP and port 514 (default for syslog-ng) UDP on all interfaces.
    Also, it is limiting the maximum number of connections of the TCP port. For more
    information about parameters you can define, see the syslog-ng.conf manual.


    # Filter options


    Filters allow you to set different definitions depending on key words. The syntax
    for the filter statement is as follows:


    ```

    filter <identifier> { expression };

    where <identifier> is the name you give your filter and <expression> contains
    the function, and Boolean operators (and, or not). Example 8-49 demonstrates this
    filter.

    ```


    Example 8-49 Filter examples


    ```

    filter_iptables { facility(kern) and match("IN=") and match("OUT="); }

    filter_messages { not facility(news, mail) and not filter(f_iptables); }

    filter_warn { level(warn, err, crit) and not filter(f_iptables); };

    ```


    # Destination options


    Destination options define the files to which log messages are sent. The syslog-ng.conf
    default covers the destination for local files, but what about the incoming messages?
    By default, the log messages are written to the default local files depending
    on what kind of message received. If it is an authentication message, the log
    is written to the file /var/log/auth with the appended information defined in
    the global options such as host name, date. Example 8-50 uses files as a destination,
    but you can use databases or even another remote server, depending on how you
    configure your server.


    Example 8-50 Destination example


    ```

    #

    # All messages except iptables and the facilities news and mail:

    #

    destination messages { file("/var/log/messages"); }

    log { source(src); filter(f_messages); destination(messages); };

    #

    # Firewall (iptables) messages in one file:

    #

    destination firewall { file("/var/log/firewall"); }

    log { source(src); filter(f_iptables); destination(firewall); }

    #

    # Warnings (except iptables) in one file:

    ```'
  merge: -1
