- pgno: 184
  md: "# 8.7.5 Import OpenLDAP data to LinuxONE\n\nIn the previous section, the OpenLDAP\
    \ database export file was transferred to insudb2, the Linux guest running on\
    \ LinuxONE. All that is required now to import the data and start the OpenLDAP\
    \ daemon:\n\n+   1. Reconnect to the Linux guest, insudb2, using SSH.\n2. Ensure\
    \ that slapd is not running. Importing data for migration requires that the service\
    \ is not running:\n   service slapd stop\n3. Import the data that was copied.\
    \ This process employs a tool called slapadd. This is a common method of importing\
    \ data sets into OpenLDAP:\n\n```\nslapadd -F /etc/openldap/slapd.d \\\\\n-b 'dc=itso,dc=ibm,dc=com'\
    \ -l /tmp/migrate.ldif\n```\n\nBecause the base configuration was established\
    \ in 8.7.3, \"Configuring the OpenLDAP service\" on page 166, the ito.com domain\
    \ exists in the new OpenLDAP database, making it easy to import the data. The\
    \ -b argument identifies the data, and the -l argument identifies the LDIF file\
    \ from which the database information will be imported.\n\nA successful import\
    \ shows 100% success, as shown in Example 8-46. Any other value than 100% means\
    \ something went wrong and the import of the data was not successful.\n\nExample\
    \ 8-46 Import of OpenLDAP data is 100% successful\n\n```\ninsudb2:-# slapd -F\
    \ /etc/openldap/slapd.d -b 'dc=itso,dc=ibm,dc=com' \\\n-l /tmp/migrate.ldifnh_db_open:\
    \ monitoring disabled; configure monitor database to enable\n################\
    \ 100.0% eta none elapsed none fast!\nClosing DB...\n```\n\n+   4. After the database\
    \ has been successfully imported, OpenLDAP can be started again, ready to query:\n\
    \   service slapd start\n\n# 8.7.6 Verify OpenLDAP is working\n\nThe slapd process\
    \ is running, and sample LDAP is presumed to exist in the directory, but that\
    \ does not necessarily mean OpenLDAP is usable by all clients. Test that the LDAP\
    \ server responds to client requests. In this example, the user queried:\n\n```\n\
    ldapsearch -XLLL -H ldap:/// -b \"dc=itso,dc=ibm,dc=com\" uid=fred sn givenName\n\
    ```\n\nExample 8-47 shows the results of the ldapsearch query.\n\n```\nExample\
    \ 8-47 Output from ldapsearch, showing user fred in the directory\n```\n\n```\n\
