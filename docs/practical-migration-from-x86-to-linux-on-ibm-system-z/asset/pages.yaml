- pgno: 120
  md: '# 5.8 Disaster recovery and availability analysis


    IT system outages can significantly impact businesses by rendering critical systems
    unavailable. The key to ensuring that this problem does not occur is to analyze
    your systems and determine a hierarchy of availability need. Keep in mind that
    not everything needs a remote site.


    For better understanding, the following terms and definitions are used when discussing
    disaster recovery, high availability, and related concepts:


    +   - Disaster recovery (DR)


    Planning for and using redundant hardware, software, networks, facilities, and
    so on, to recover the IT systems of a data center or the major components of an
    IT facility if they become unavailable for some reason.


    +   - High availability (HA)


    Provide service during defined periods, at acceptable or agreed upon levels, and
    mask unplanned outages from users. High availability employs automated failure
    detection, recovery, bypass reconsideration, testing, problem, and change management.


    +   - Continuous operations (CO)


    Continuously operate and mask outages from users. Continuous operations employ
    nondisruptive hardware and software changes, nondisruptive configuration changes,
    and software coexistence.


    +   - Continuous availability (CA)


    Deliver nondisruptive service to users 7 days a week, 24 hours a day. With continuous
    availability, there are no planned or unplanned outages.


    The goal for mission-critical systems should be continuous availability. Otherwise,
    the systems should not be mission-critical.


    # 5.8.1 Availability analysis


    Migrating an application to a virtualized Linux environment on IBM LinuxONE offers
    an opportunity to implement an availability profile in line with the impact of
    the unavailability that the application has on the organization''s overall business.
    However, this analysis is not always straightforward. For example, test and development
    workloads are generally not considered to be mission-critical, because they might
    be needed to correct an error in a production system, consider providing some
    sort of test and development environment in your DR planning.


    The challenge with DR is to achieve a balance between the impact of an unavailable
    system on the health of the business versus the cost of creating a resilient environment
    for the application. This planning should include the likely scenarios that might
    impact an application''s availability, and unrelated events that might impact
    the ability of a business to function.


    The usual IT issues such as server failure, network failure, power outage, disk
    failure, application failure, and operator error, can be planned through duplication
    of resources and sites. Unrelated factors are rare and not directly related to
    IT, but they can have a huge impact on the ability of a business to function.
    These events include fire, natural disasters such as earthquake, severe weather,
    and flood, and civil disturbances. These events can have a major impact on the
    ability of people to work.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Although this chapter focuses on the IT-related issues, you also create a plan
    to deal with the other, non-IT related events.


    # 5.8.2 Single points of failure


    In determining the DR requirements of an application, you need to look at the
    probability of failure of a component and the cost to eliminate a single point
    of failure (SPOF).


    Table 5-3 lists the components of an IBM LinuxONE virtualized environment running
    an application as a Linux guest and the relative costs of rectifying a single
    point of failure.


    Table 5-3 Potential single points of failure that can impact availability


    | Single point of failure | Probability of failure | Cost to rectify |

    |---|---|--|

    | LinuxONE hardware | Very low | High |

    | LinuxONE LPAR | Very low | Low |

    | LinuxONE hypervisor | Low | Low |

    | Linux | Low | Very low |

    | Disk system microcode | Low | Medium |

    | Virtual network | Very low | Medium |

    | Physical network | Medium | Medium |

    | Application | High | Very Low |


    Apart from hardware and software failures, the following types of planned outages
    can impact your application''s availability:


    +   - Hardware upgrades that require a power-on reset

    - Configuration changes that require a reboot of the partition

    - KVM or z/VM maintenance

    - Linux kernel maintenance that requires a reboot

    - Application maintenance


    # 5.8.3 LinuxONE features for high availability


    IBM LinuxONE was designed around providing HA. Perhaps the most design effort
    has gone in to the transparent recovery of processor errors. During a hardware
    error at an individual level, the task is moved to a spare processor where processing
    continues transparently to the application. In the IBM LinuxONE, a number of availability
    features have been introduced to reduce the number of planned system outages.
    For example, the following actions are now concurrent and require no system outage:


    +   - Adding logical partitions (LPARs)

    - Adding logical processors to a partition

    - Adding logical channel subsystems (LCSSs) - I/O paths

    - Adding subnet sets

    - Enabling dynamic I/O

    - Adding a cryptographic processor to an LPAR


    108 Practical Migration from x86 to LinuxONE'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'Additionally, many services enhancements have been introduced to avoid planned
    outages:


    +   - Concurrent firmware fixes

    - Concurrent driver upgrades

    - Concurrent parts replacement

    - Concurrent hardware upgrades


    The IBM LinuxONE offers a number of customer-initiated capacity on demand features.
    These billable features are designed to provide customers with additional capacity
    to handle the following events:


    +   - A Customer Initiated Up (CI) is used for a predefined capacity upgrade.

    - Capacity Backup Up (CBU) is a predefined capacity for DR. A system at a DR site
    does not need to have the same capacity as the primary site. During a declared
    disaster, or for up to 5 DR tests, the customer can turn on the number of processors,
    including IFLs, to handle the workload from the primary site.

    - Capacity for Planned Event (CPE) is used to replace capacity lost within the
    enterprise due to a planned event such as a facility upgrade or system relocation.


    On/Off Capacity on Demand provides extra capacity in two hour increments that
    is available to be turned on satisfy peak demand in workloads.


    # 5.8.4 Availability scenarios


    The scenarios present a number of different situations where a LinuxONE environment
    is set up with increasing degrees of availability and increasing levels of cost.
    The key to maximum availability is to eliminate single points of failure.


    All scenarios assume that the IBM LinuxONE is configured with redundant LPARs,
    redundant paths to disk (FICON and FCP), redundant Open System Adapters connected
    to the organization''s network, redundant system consoles, and redundant Hardware
    Management Consoles. This is the normal setup for IBM LinuxONE System.


    The application design needs to include redundant software servers. The storage
    infrastructure should include redundant Fibre channels, mirrored disks, and data.


    Design the communications network around redundancy with redundant routers, switches,
    hubs, and wireless access points.


    For mission-critical systems, provide an uninterrupted power supply and a second
    site far away from the primary site to avoid being affected by natural disasters.


    Another important factor in the availability of applications is security and access
    controls. For more information about this topic, see 5.6, “Security analysis”
    on page 95.'
  merge: -1
  img_proc: true
