- pgno: 27
  md: '# 2.1 Total cost of ownership analysis


    Many CIOs recognize the return on investment (ROI) in the information technology
    of their companies, but at the same time they are frustrated by an increasingly
    costly IT infrastructure. There are many reasons for these costs, some of which
    are the annual costs of software licensing, power, cooling, and ongoing support.
    The complexity of environments in most cases determines the magnitude of these
    costs.


    The business case to support a migration to LinuxONE is focused on cost savings
    provided by server consolidation to the LinuxONE platform and an overall simplification
    of the distributed environment.


    ICU in the Netherlands (a Cloud Service Provider) decided to use LinuxONE as their
    alternative data center architecture for their Linux farms. ICU wanted to harness
    the power of openness, flexibility, and amazing innovation of Linux and open source
    software with the availability, scalability, and robustness of a platform like
    LinuxONE. With this competitive edge, ICU IT Services has helped businesses slash
    their costs by up to 50 percent and improve their bottom line.


    The Met Office is the UK''s national weather service, providing weather forecasts
    for the public, government, and for businesses in a wide variety of sectors. It
    creates more than 3,000 tailored forecasts and briefings each day, as well as
    conducting weather- and climate-related research. The Met Office uses post-processing
    systems to tailor its weather forecasts for specific clients''. The requirement
    is to have the applications 24 hours a day, 365 days a year, and being able to
    deliver services day-in and day-out is critical to its brand and reputation.


    Running these systems on a distributed Linux infrastructure was becoming complex
    and expensive. Therefore, Met Office needed to migrate suitable candidates from
    its distributed Linux landscape to IBM LinuxONE.


    # 2.2 Migration planning


    The migration process requires several steps, and anticipating how much time is
    needed for each step is crucial.


    The following are the phases of migration at the highest level:


    +   - Planning: After you have decided what will be migrated and how, the plan
    must specify the time, risks, and owner for each migration task.

    - PoC and Test: Proof of concept to check the compatibilities between the x86
    and LinuxONE environment, and give special focus to performance.

    - Education: The technical staff needs the correct skills to work on a LinuxONE
    migration and maintain the new environment.

    - Build Environment: In this phase, the new infrastructure is ready for migration.

    - Implementation: The actual migration. Communication between stakeholders is
    important during this process. All involved people must know and approve the migration,
    and receive follow up on the progress.

    - Post Migration: After implementation, documentation must be created that further
    references the project and documents all necessary maintenance and care procedures.
    Additionally, the project manager must have a signed acceptance agreement.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'In general, it can be presumed that the proof of concept, associated testing,
    and final implementations are the most time consuming of a migration.


    # 2.3 Choosing workloads to migrate


    When you make the decision to migrate and consolidate, the next step is to examine
    which workloads would be good candidates to migrate.


    Consider these variables, among others:


    +   - Associated costs

    - Application complexity

    - Service level agreements

    - Skills and abilities of your support staff


    Start with a fairly simple application that has a low service level agreement
    (SLA) and a staff that has the associated skills.


    For applications developed within the company, ensure that you have the source
    code available. Regarding the operating system platform, even a Linux environment,
    a workload from a different platform can be migrated, but start with servers running
    Linux. This process will substantially increase the success of your migration
    effort. Applications that require close proximity to corporate data on IBM LinuxONE
    are also ideal candidates, as applications that have high I/O rates allow I/O
    operations from general-purpose processors to specialized I/O processors.


    IBM LinuxONE has a powerful processor with a clock of 4.3 GHz (IBM LinuxONE Rockhopper)
    or 5 GHz (IBM LinuxONE Emperor). Because IBM LinuxONE is designed to concurrently
    run disparate workloads, remember that workloads that require dedicated physical
    processors to run at high CPU utilization rates might not be optimal for migration
    to a virtualized Linux environment. This is because workloads that require dedicated
    processors do not take advantage of the virtualization and hardware sharing capabilities.
    An example of such an application might include video rendering, which requires
    specialized hardware.


    Chapter 5, "Migration analysis" on page 55, provides an in-depth analysis of the
    process of determining the most appropriate applications to migrate to an IBM
    LinuxONE environment.


    # 2.4 Analysis of how to size workloads for migration


    One of the challenges of migration is to determine the resources that are required
    on the target platform to accommodate the distributed workload.


    The first step is to determine the expected consolidation ratio for a specific
    workload type. This step allows you to answer the question "What is the theoretical
    maximum number of servers that can be consolidated?"


    The answer to this question is a function of several factors:


    +   - Processor speed (or speeds) of the servers to be consolidated

    - Average of CPU utilization of applications to these servers

    - Workload characteristics of applications

    - Amount of disk space'
  merge: -1
  img_proc: true
