    # 5.9 Virtualized Environment to LinuxONE Migration


    Today digital economy requires speed and agility to keep up with competitive demands
    for new applications and data analytics, while well maintaining infrastructure.
    Many of these enterprises also large vendor-dependent virtualized infrastructures
    to support their mission-critical, scale-up applications and enterprise databases.
    They value various products for their computer, network, storage, and management
    technologies. But they are also encountering new cases that demand the agility
    that offered by cloud.


    This section covers some of the technical aspects that needs to be considered
    before migrating a virtualized environment onto IBM LinuxONE cloud. This process
    is usually easy if the workloads targeted for LinuxONE cloud have been virtualized.
    You cannot move the individual virtual machines directly on a LinuxONE cloud.
    But you can create similar capabilities of the virtualized environment on the
    targeted LinuxONE cloud.


    Before migration, create a chart of the following information for planning purposes:


    +   - Performance and availability of range of services and the linkages between
    them.

    Performance metrics for each of the individual supervisor.


    +   - Application architectures and interdependencies.


    +   - Network connectivity diagram for individual virtual machines and their applications.


    +   - Security and isolation of networks among applications.


    +   - Storage allocations, and their performance requirements.


    # 5.9.1 Hypervisor Considerations


    Different hypervisors have different degrees of guest and functionality support.
    For instance, in a OpenStack cloud platform, KVM and Xen Hypervisors are closely
    coupled with network and software storage options. The following are the most
    important considerations:


    +   - Standardization and hardening of virtual machines is very important. Before
    the migration, plan and validate an approach on how the virtual machines are to
    be patched, maintained, and monitored.


    +   - Validate that the security, management, and monitoring tools can be extended
    or similar functions are available in the targeted LinuxONE cloud platform.


    +   - Interoperability and isolation of applications functional interfaces and
    cloud services interfaces.


    +   - Use LinuxONE based patterns for deployment of standardized OS and middleware
    template for deployments.


    +   - Analyze application portability on the targeted cloud platform and, if required,
    start application functional and performance testing activity on cloud.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# 5.9.2 Network considerations


    Even though clouds platforms mask underlying differences at the infrastructure
    layer to allow for scale and dynamism, this homogeneity creates new network bandwidth
    and provisioning challenges.


    # Bandwidth requirements


    In a traditional virtualized environment, physical servers are connected by physical
    switches, which meant that network administrators had total control of the network
    traffic and security. When moving the workloads onto a LinuxONE base cloud, it
    is better to monitor the current bandwidth. In a cloud environment, the virtual
    switch has links from the physical switch through the physical NIC that attaches
    to virtual machines. Therefore, it is better to validate and identify whether
    LinuxONE infrastructure network cards and internal switch connectivity is sufficient,
    in terms of throughput and latency.


    # Virtual switch and VLAN Tagging


    In LinuxONE Cloud Platform, virtualized networks also need a separation of VMs
    to ensure data privacy of one tenant in the cloud another. Therefore, they need
    mechanisms to ensure that these networks can share a physical network link without
    compromising or leaking information between networks. To access to a physical
    network, most cloud automation (like OpenStack) uses the local area network (VLAN)
    tagging model. This approach requires network administrators to create pools of
    VLAN IDs on a physical switch. When a new VM or virtual application is created
    from the cloud software, a cloud consumer uses these VLAN IDs without having any
    delay.


    # 5.9.3 Security considerations


    The following are security consideration of the LinuxONE cloud service:


    +   * Authentication and authorization of users and administrators of the cloud
    service.

    * Configuration and operation of encryption both for data stored within the cloud
    service and also for data transmitted to and from the cloud service.

    * Firewalls and configuration of other security capabilities.

    * Virtual systems running on top of the hypervisor must have no means of network
    communication directly with the hypervisor.

    * Hypervisor management traffic must use a separate physical network interface
    for the virtual guests.

    * Create separate security zone spanning LPARs and Hypervisor depending on the
    application and organizational requirements.

    * For KVM-based hypervisors, additional technologies like SELlinux can be enforced
    in addition to security or firewall zones.

    * Standardized user interfaces, APIs, protocols, and data formats are defined
    for cloud services.

    * Open technologies are driving innovation, standardizing open source products
    for administration and business interfaces.

    * Use existing or newer equivalent Access Management functions to authenticate
    and authorize access to virtual machines in cloud services.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# 5.9.4 LinuxONE cloud management


    The following applications are available to help you with LinuxONE cloud management:


    +   - OpenStack

    - vRealize Automation for IBM LinuxONE


    # OpenStack


    To provide cloud management capability, both z/VM and KVM are OpenStack-enabled,
    which is the industry standard for ubiquitous cloud computing platforms. Applications
    that use the OpenStack APIs are supported on both hypervisors. IBM Cloud Manager
    Appliance (CMA) is an infrastructure as a service product that helps establish
    a cloud infrastructure and simplifies management of a virtualized environment.
    It also offers additional services such as identity management and orchestration
    accessed in the same programmatic manner through the API.


    # vRealize Automation for IBM LinuxONE


    With VMware vRealize Automation (vRA), you can extend your existing vRealize Automation
    cloud to IBM LinuxONE. vRealize Automation interfaces with the OpenStack enabled
    cloud endpoints from IBM LinuxONE of IBM LinuxONE systems to allow clients to
    use the same cloud management that is used within their distributed cloud environment
    (Figure 5-21).


