- pgno: 104
  md: 'The Linux administrator and database administrator must work together in the
    Linux guest sizing process because changes are needed at both the Linux and database
    levels.


    # 5.5 Backup analysis


    This section provides a conceptual approach to migrating backed-up data from an
    existing operating environment to the target LinuxONE environment.


    # 5.5.1 Introduction to backup and archival concepts


    This section provides a high-level introduction to the basic data and storage
    management paradigms that are used in the IT Industry. It covers data protection
    or backup, record retention or archiving, storage management, and security.


    # Backup concepts


    The term backup refers to the creation of an additional copy of a data object
    to be used for operational recovery. As already mentioned, the selection of data
    objects to be backed up needs to be done carefully to ensure that, when restored,
    the data is still usable.


    A data object can be a file, a part of a file, a directory, or a user-defined
    data object like a database table. Potentially, you can make several backup versions
    of the data, each version at a different point in time. These versions are closely
    tied and related to the original object as a group of backups. The files are backed
    up by normal daily operations each day that it changes. The most recently backed-up
    file version is designated the "active" backup. All other versions are "inactive"
    backups.


    If the original data object is corrupted or lost on the client system, restore
    is the process of recovering the most current version of the backed-up data. The
    number and retention period of backup versions is controlled by backup policy
    definitions.


    Old versions are automatically deleted as new versions are created under these
    circumstances:


    +   - The number of versions exceeds the defined limit

    - After a defined time


    On any system, several categories of data objects need to be backed up, each with
    different retention needs. A database table can be backed up frequently at regular
    intervals, whereas an operating system configuration file would be backed up only
    when it is changed.


    # Common backup types


    The following are the most common types of backups:


    +   - Normal

    - Incremental

    - Daily


    A normal backup copies all selected files and marks each as having have been backed
    up. With normal backups, you need only the most recent copy of the backup file
    to restore all of the files.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'An incremental backup backs up only those files that have been created or changed
    since the last normal or incremental backup. Performed periodically, this backup
    is generally faster than a normal backup and marks files as having backed up to
    assist on the next incremental backup. If you use a combination of normal and
    incremental backups, you need the last normal set and all the incremental backup
    sets to restore your data.


    A daily backup copies all selected files that have been modified on the day the
    daily backup is performed. The backed-up files are not marked as having backed
    up.


    # Archiving concepts


    Archiving means creating a copy of a file as a separate object in the storage
    repository to be retained for a specific time. Typically, you would use this function
    to create an extra copy of data to be saved for historical purposes. For this
    reason, special consideration to task to ensure the data format is not dependent
    on anything. Vital records (data that must be kept due to government regulation,
    compliance, legal or other reasons) are likely candidates for the archive process.


    The difference between backup and archive software is that backup creates and
    controls multiple backup versions that are directly attached to the original client
    file, whereas archive creates an extra stored object that is normal for a specific
    time, such as for vital records.


    # 5.5.2 KVM backup


    Because the KVM hypervisor is a module that is loaded into a Linux kernel, the
    same tools described for a Linux guest in 5.2,"KVM backup" on page 92 apply to
    the Linux running in LinuxONE partitioning and acting as a KVM host. These tools
    can be used to back up the KVM hypervisor and its system configuration.


    In addition, the KVM snapshot and managed save functions can be used to save the
    state of the Linux guests.


    # 5.5.3 z/VM backup


    The z/VM hypervisor can use utilities such as FLASHCOPY and DDR to back up volumes.
    It is possible to perform a backup of Linux volumes here as well. Linux can be
    backed up while online using FLASHCOPY without issues. For options on backing
    up within Linux that offer better flexibility, see 5.5.2,"KVM backup".


    You can see examples of z/VM backups in Set Linux on IBM System z for Production,
    SG24-8137.


    # IBM Backup and Restore Manager for z/VM


    IBM Backup and Restore Manager for z/VM is a complete solution to back up and
    restore data for CMS or non-CMS systems (one file, a group of files, or an entire
    minidisk) in a VM environment. It is integrated with Tape Manager for z/VM, can
    compress data during the backup, and supports encryption bits.


    You can find more information on the official website:


    ```

    http://www.ibm.com/software/products/en/backupvm

    ```'
  merge: -1
  img_proc: true
- pgno: 106
  md: "# ### 5.5.4 Linux backup\n\nVarious methods can be used to perform backups\
    \ with Linux. Whichever method is selected, the output must be a consistent data\
    \ set that is usable when a recovery is necessary. These methods include command-line\
    \ tools that are included with every Linux distribution, such as dd, dump, rsync,\
    \ and tar. These are very useful in the hands of a skilled administrator who has\
    \ experience using them. Tools without withstand the test of time, but they require\
    \ considerable skill to wield properly.\n\nOther utilities are available that\
    \ have customized the use of the command-line tools mentioned above. Amanda, for\
    \ example, was designed to make a little more user-friendly interface for the\
    \ backup and restore procedures, making backup tasks little easier to manage.\
    \ It has both a client and server component to facilitate a central backup solution\
    \ for various clients regardless of the platform. Amanda is typically included,\
    \ or at least available, in Linux distributions.\n\nAnother feature of Linux is\
    \ represented directly in the capabilities of the file system. File systems such\
    \ as ZFS and BTRFS are capable of taking snapshots. These mechanisms can aid the\
    \ backup process by allowing the backup software to concern itself only with backing\
    \ up the latest snapshot while allowing new changes to the data to continue unimpeded.\
    \ This process provides for much greater efficiency of the backup process.\n\n\
    Several databases provide mechanisms to create backups themselves, which ensures\
    \ that memory buffers are flushed to disk and that a consistent data set is created.\
    \ This can also be combined with storage facilities like FlashCopy that perform\
    \ instantaneous-in-time copies.\n\nFinally, commercial utilities, such as the\
    \ IBM Spectrum TM, are available for an enterprise environment. Read more about\
    \ IBM Spectrum Protect at the following site:\nhttp://www.ibm.com/software/products/spectrum-protect\n\
    \n# ### 5.5.5 Migrating backed-up and archived data\n\nWhen moving to a newer\
    \ or modern environment, the archived data in the existing environment might no\
    \ longer be supported, depending on the storage technologies used. It becomes\
    \ necessary to migrate archived data to a newer format. This process ensures compatibility\
    \ with the production IT environment and maintains data availability.\n\nWhy migrate\
    \ archived data?\n\nThe following factors can force the migration of archived\
    \ data, among others:\n\n+   - Preserving data on the same medium would face two\
    \ problems:\n  - The lifetime of the medium.\n  - The long-term availability of\
    \ the technology for reading it.\n\n+   - Eventually, technology changes and your\
    \ solution becomes less competitive compared to emerging ones.\n\n+   - Some older\
    \ storage technologies have a direct impact on the volume of data that can be\
    \ stored and the space requirements due to the low MBytes/cm3 and Weight/MByte\
    \ factors.\n\n+   - End of support for your current solution."
  merge: -1
