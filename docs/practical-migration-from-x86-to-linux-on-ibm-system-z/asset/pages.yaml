    \ clients follow this process:\n\n+   1. Talk to other customers who have migrated\
    \ to LinuxONE to understand how their migration went and to obtain their recommendations\
    \ about how to proceed.\n2. Choose one of their own applications as a candidate\
    \ for a proof of concept (POC).\n\nWhen choosing an application for a POC, keep\
    \ it as simple as possible because a proof of concept is performed to demonstrate\
