- pgno: 94
  md: '# 5.3.7 Application interdependencies


    Not many applications are self-contained. In cases, an application obtains data
    from a number of other applications and its output is sent on to other applications.
    These applications can also be on different platforms and are often from entities
    outside your organization. An application migration to LinuxONE provides an opportunity
    to simplify your application without affecting any interdependencies.


    Many distributed applications have grown, in only a few years, from a single server
    to tens or even hundreds of interconnected servers. These interconnected servers
    not only add burden, but also add complexity and built-in frailty. If such an
    application is being considered for migration, make simplification part of the
    core of what needs to be done. LinuxONE supports all modern communication methods,
    so it is a straightforward process to receive data inputs and transmit outputs
    in the same way as before application was migrated. In this, no changes to external
    applications are needed.


    The main thing to remember during migration planning is to completely map all
    application interdependencies. The aim is to identify any obsolete technologies
    and interfaces, which might in turn require another application to be migrated
    to a current network technology.


    # 5.3.8 Sucessful application migration


    This section outlines the considerations to keep in mind and the steps to follow
    to help you on a successful application migration for Java and C/C++ applications.


    # 5.3.9 Special considerations for migrating a Java application


    Migrating Java from one platform to another is easy compared to the migration
    effort required for C or C++ applications. Even though Java applications are system-independent,
    implementation and distribution不得不 needs to be considered:


    +   Most of the Java distributions have their own Java virtual machine (JVM) implementations.
    There will be differences in the JVM switches. These switches are used to make
    the JVM and the Java application run as optimally as possible on that platform.
    Each JVM switch that is used in the source environment needed for a similar switch
    in the target Java environment.


    +   Even though Java Developer Kits (JDKs) are expected to conform to common Java
    specifications, each distribution will have differences in the helper classes
    that provide functions to implement specific Java application programming interfaces
    (APIs). If the application is written to conform to a particular Java distribution,
    the helper classes referenced in the application must be changed to refer to the
    new Java distribution classes.


    +   Special procedures must be followed to obtain the best application migration.
    One critical point is to update the JVM to the current state version. The compatibility
    with earlier versions is significant and performance improvements benefit applications.


    +   Ensure that the just-in-time (JIT) compiler is enabled.


    +   Set the minimum heap size (-Xms) equal to the maximum heap size (-Xmx). The
    size of the heap size should be always less than the total of memory configured
    to the server.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# 5.3.10 Special considerations for migrating C++ applications


    When migrating C++ applications, there are a few special considerations to be
    aware of, as explained in this section.


    # Architecture-dependent code


    Programs reading in directories (or non IBM LinuxONE systems) with names like
    /sysdeps or /arch contain architecture-dependent code. You will need to reimplementation
    them for the hardware architecture to port any of these programs to LinuxONE.


    # Assembl code


    Any assembler code would need to be rewritten. Opcodes or, if you use assembly
    header files, you would need an appropriate version of the header. Assembly code
    for Linux uses the s390 opcodes but follow the syntax of GNU assembly. The GNU
    assembly manual can be downloaded at the following site:


    ```

    http://www.gnu.org/software/binutils

    ```


    # ptrace and return structure


    Exercise caution using ptrace and the return structure because they are architecture-dependent.


    # Little endian to big endian


    LinuxONE is a big endian system, storing multibyte numbers with the most significant
    byte at a lower address. Meanwhile, x86 servers are a little endian system, storing
    the most significant byte at a higher address. Any code that processes byte-oriented
    data originated on a little endian system might need some byte-swapping. The data
    might have to be regenerated, or if that is not possible (for example, shared
    files), the application might have to be reworked for processing little endian
    data.


    # Stack frame layout and linkage specific to LinuxONE


    For details about stack frame layout and linkage specific to LinuxONE, refer to
