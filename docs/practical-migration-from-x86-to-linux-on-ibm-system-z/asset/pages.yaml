  md: 'Similarly, the failover solution described previously can also be applied in
    this case. Sharing the two OSA cards between partitions is shown in Figure 5-5.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_74_0.png)


    # Multiple network scenario


    Several types of network solutions require multiple network segments. Some of
    these solutions demand package routing or the use of multiple LPARs. This section
