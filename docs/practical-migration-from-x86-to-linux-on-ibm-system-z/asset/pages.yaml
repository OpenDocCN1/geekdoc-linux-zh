    \ which members track and exchange digital assets. A shared ledger contains the\
    \ single record of all network transactions, and is replicated across all network\
    \ members. Blockchain applications contain self-executing contracts and client-side\
    \ applications that interface with the network through an SDK or API.\n\nBecause\
    \ LinuxONE is the most secure platform, it allows users to innovate with DevOps\
    \ by providing purpose—cutting-edge solutions around open source technologies.\
    \ LinuxONE provides superior security with performance and sustainable higher\
    \ transaction encoding speeds. While generating digital signatures or hashing\
    \ encryption for the chain, LinuxONE uses cryptographic accelerators.\n\nThis\
    \ section looks at deploying Hyperledger Fabric on a LinuxONE environment.\n\n\
