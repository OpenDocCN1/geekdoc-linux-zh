    and provides a technical direction for your migration. Each section addresses
    a different part of your infrastructure, and uses scenarios to show how the migration
    affects the environment.


    This chapter includes following sections:


    +   - Network analysis

    - Storage analysis

    - Application analysis

    - Database analysis

    - Backup analysis

    - Security analysis

    - Operational analysis

    - Disaster recovery and availability analysis

    - Virtualized Environment to LinuxONE Cloud Migration'
