    # Configuring OpenLDAP manually on Red Hat Enterprise Linux\n\nThe configuration\
    \ on the Red Hat Enterprise Linux (RHEL) server is also a relatively easy task\
    \ because all is needed is a basic, bootstrapable configuration. This configuration\
    \ by itself is not useful for running a proper directory, but it allows the migration\
    \ of the OpenLDAP directory from another server. OpenLDAP 2.4 also uses the cn=config\
    \ feature format by default:\n\n+   1. Ensure that the slapd daemon is running:\n\
    \   service slapd start\n\n+   2. From a command prompt on the RHEL server, edit\
    \ a basic OpenLDAP configuration file, perhaps using vi in the following example:\n\
    \   vi /tmp/config.itso.ibm.com.ldif\n   Put the content in Example 8-45 into\
    \ the following\n\nExample 8-45 /tmp/config.itso.ibm.com.ldif file to bootstrap\
    \ the OpenLDAP database\n\n```\ndn: olcdatabase=hdb,cn=config\nobjectClass: olcDatabaseConfig\n\
    objectClass: olcConfig\nlolcDatabase: hdb\nlolcSuffix: dc=itso,dc=ibm,dc=com\n\
    lcDbDirectory: /var/lib/ldap\nlocRootDN: cn=Administrator,dc=itso,dc=ibm,dc=com\n\
    locRootPW: ldadmin\n```\n\nChapter 8. Deployment of workloads 169"
