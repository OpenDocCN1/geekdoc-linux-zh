    # 6.1.3 FCP and multipath


    The failover configuration for FCP is not handled by PR/SM or zVM, and must be
    done from the Linux guest. Therefore, two N. Port ID Virtualization (NPIV) adapters
    must be attached to the guest system that is connected over the two different
    Fibre Channel fabrics. The description that follows is also applicable to a KVM
    environment because the multipathing must be performed by the host system, and
    then given as a single virtual device to the Linux guests of KVM.


    The multipath setup is configured within the Linux system with the configuration
    file /etc/multipath.conf. After multipathd daemon is started, all available LUNs
    together with their paths can be checked with the following command:


    ```

    multipath -ll1

    ```


    > Note regarding SUSE Linux Enterprise Server: The behavior of SCSI devices changed
    between SUSE Linux Enterprise Server 11 and SUSE Linux Enterprise Server 12. In
    SUSE Linux Enterprise Server 11, all LUNs had to be configured entirely manually.
    With SUSE Linux Enterprise Server 12, automatic LUN scanning has been added, and
    therefore all LUNs are automatically detected after the zfcp host has been configured.'
