  md: '# Verifying PHP is working


    Before a test can be conceived and run for PHP, the location of the DocumentRoot
    directory of the Apache server must be determined.


    In SUSE Linux Enterprise Server, the default location is /srv/www/htdocs. However,
    a non-default location might have been configured. The document root directory
    can be determined by running the commands that are shown in Example 8-31:


    ```

    Example 8-31 Finding the DocumentRoot on SUSE Linux Enterprise Server

    root@insud2:~# grep ''DocumentRoot'' /etc/apache2/default-server.conf

    DocumentRoot "/srv/www/htdocs"

    ```


    Under RHEL, the default location is /var/www/html, but the definitive value is
    revealed by the commands in Example 8-32:


    ```

    Example 8-32 Finding the DocumentRoot on RHEL

    [root@8z84p0-ri1 ~] grep ''DocumentRoot'' '''' /etc/httpd/conf/httpd.conf

    DocumentRoot "/var/www/html"

    ```


    After confirming the DocumentRoot of the Apache server, a one-line PHP script
    is created that will print the standard PHP installation information. Using vi
    or some other text editor, create a script file phpinfo.php, as shown in Example
    8-33, and place the script file in the appropriate DocumentRoot directory.


    Example 8-33 Simple PHP script that displays functional characteristics


    ```

    <?php phpinfo();  ?>

    ```


    With the PHP file in the DocumentRoot directory, the PHP script can be run by
    using a web browser. Connect to your web server, using the following URL as an
