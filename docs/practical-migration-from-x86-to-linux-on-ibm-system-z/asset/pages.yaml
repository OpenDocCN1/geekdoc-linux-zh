  md: '# 8.3 Deploying MongoDB on IBM LinuxONE


    MongoDB is an open source database that is considered to be the most popular and
    fastest growing NoSQL database. This is mostly due to how well it works in areas
    where traditional SQL databases have trouble. It is good for dealing with large
    sets of unstructured data and has exceptionally good read times on the data that
    is stored. Although it is not a replacement for all applications that store structured
    data, it gives a modern solution for the massive amounts of unstructured data
    and mobile traffic.


    With the performance and virtualization capabilities of LinuxONE, it makes an
    ideal platform for scaling out and using MongoDB based NoSQL workloads. This section
    looks at the steps for deploying MongoDB (as a Docker container) over LinuxONE.


    # 8.3.1 Work environment


    This example uses Ubuntu 16.04 LTS as the hosting system for the MongoDB deployment.
    Because we have decided to install MongoDB as a Docker container, the first step
    is to set up Docker on the host systems. For in-depth documentation about deploying
    Docker see The Virtualization Cookbook for Systems Volume 4: Ubuntu Server 16.04,
    SG24-8354.


    > **Important: The Docker installation package available in the official Ubuntu
    16.04 repository might not be the latest version. To get the latest version, install
    Docker from the official Docker repository.


    After Docker is configured, enable its service and run it on the host operating
    system.

    Example 8-6 shows verifying the Docker configuration.


    Figure 8-6: Verification of Docker


    ```

    itsoadmin@lnxmongo:$ docker version

