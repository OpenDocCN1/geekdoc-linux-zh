  md: "To correct this problem, run the mysqladmin command again as shown in Example\
    \ 8-35 on page 157, taking extra care to set the password to a value that you\
    \ will remember. If the original password cannot be remembered or otherwise lost,\
    \ you must reinstall MySQL.\n\n**Note:** Another migration option for MySQL is\
    \ to run mysqldump on the x86 server, transfer the resulting MySQL dump files\
    \ to the Linux server, and restore the database with mysqlimport. This is a widely\
    \ used practice, but if your environment might need a different approach. Your\
    \ pre-migration analysis will help you to understand which approach is best for\
    \ your circumstances.\n\nWith the preliminary Apache, MySQL, and PHP configurations\
    \ functioning properly on the new LinuxONE server, the ISCSI disks can be migrated\
    \ from the x86 server.\n\n# 8.6.4 Migrating iSCSI disks using MySQL and MediaWiki\n\
    \nOne of the particularly useful aspects of external storage is that disks can\
    \ effectively be unplugged from one and plugged into another, fast-tracking the\
    \ migration process. This is not an appropriate approach for all cases, but it\
    \ is the case for the MediaWiki migration example.\n\nIn this example, the MySQL\
    \ database and the Apache DocumentRoot are each contained on separate ISCSI partitions.\
    \ The file systems on those partitions will be unmounted from the zs4p01-s1 host\
    \ (an x86 system), then mounted on the Insub2 host running on LinuxONE.\n\n> When\
    \ dealing with remote disk storage, mount and manage the remote LUNs by referring\
    \ to them by-path rather than any other method. udev will not ensure that the\
    \ same name or ID is used persistently when the host is rebooted. The only persistent\
    \ identification is by-path.\n\n# Prepare Linux Guests on LinuxONE for iSCSI\n\
    \nBefore making any changes to the x86 host using the ISCSI LUNs, set up the minimum\
    \ iSCSI software on LinuxONE:\n\n+   1. Connect to the Linux guest called insub2\
    \ by using Secure Shell (SSH).\n\n+   2. Ensure that the iscs initiator software\
    \ is installed on Linux guest Insub2:\n   - For USE, use install open-iscsi\n\
    \   - For RHEL, use yum install iscsi-initiator-utils\n\n+   3. Stop the Apache\
    \ and MySQL services running on insub2. This guest runs Apache and MySQL for the\
    \ earlier tests:\n   - For USE, use these commands:\n     service apache2 stop\n\
    \     service mysql stop\n   - For RHEL, use these commands:\n     service httpd\
    \ stop\n     service mysqld stop"
