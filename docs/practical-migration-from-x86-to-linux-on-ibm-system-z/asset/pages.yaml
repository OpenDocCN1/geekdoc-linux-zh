    8-6.


    | Basic Settings | TLS Settings |

    |---|---|

    | [X] Enable TLS | |

    | [X] Enable LDAP over SSL (ldaps) | inte |

    | [X] Use Common Server Certificate |


    Figure 8-6 TLS and SSL certificate settings for OpenLDAP


    Using a proper SSL certificate is preferred, but not necessary for this demonstration.
    This example uses the self-signed certificate that were generated when SUSE Linux
    Enterprise Server was installed. More importantly, using SSL for LDAP (Lightweight
    Directory Access Protocol Over Socket Links (LDAPS)) is essential. Without LDAP,
    passwords and sensitive data are exchanged with the LDAP server in plaintext.
