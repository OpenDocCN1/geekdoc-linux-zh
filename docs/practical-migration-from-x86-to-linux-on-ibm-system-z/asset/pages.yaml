  md: "olcAccess: to attrs=password by dn=cn=Administrator,dc=itso,dc=ibm,dc=com\n\
    write by anonymous auth by self write by * none\nolcAccess: to attrs=shadowLastChange\
    \ by self write by * read\nolcAccess: to dn.base** by * read\nolcAccess: to by\
    \ dn=cn=Administrator,dc=itso,dc=ibm,dc=com by * read\n\nSave the file, and edit\
