  md: '4. Move the content of the /srv/www and /var/lib/mysql directories out of the
    way so that the file systems of the ISCSI remote luns can be mounted in their
    places. However, keep the contents of these directories available as a backup.
    The default DocumentRoot for RHEL is /var/lib/html/. Use the proper directory
    for your circumstances.


    ```

    mv /srv/www /srv/www.orig

    mv /var/lib/mysql /var/lib/mysql.orig

    mkdir -p /srv/www /var/lib/mysql

    ```


    # Prepare x86 system for migration


    Complete these steps to prepare the x86 system for migration:


    +   1. Connect to the zs4p0-s1 (x86) host using SSH.


    +   2. Display the mount table of zs4p0-s1, taking note of which file system contains
    the MySQL partition and the Apache we partition:


    mount


    In this example, the /var/lib/mysql directory is mounted in /dev/sdd1 and the
    /srv/www directory is mounted in /dev/sdcl. Example 8-3 shows a method of displaying
    the mounted file systems using **df -h**.


    Example 8-3 Mounted partitions on zs4p0-s1


    | Filesystem | Size | Used | Mounted On |

    |---|---|---|---||

    | /dev/sda2 | 491G | 29G | 462G | 6% |

    | udev | 2.00G | 116K | 2.00 | 1% /dev |

    | tmpfs | 2.00G | 728K | 2.00 | 1% /dev/shm |

    | /dev/loop0 | 3.2G | 3.2G | 100% /srv/iso |

    | /dev/sdcl | 1018M | 199M | 820M | 20% /srv/www |

    | /dev/sdd1 | 4.0G | 3.3M | 1% | /var/lib/mysql |


    3. Take note of which LUNs are currently being mounted on host zs4p0-s1:


    ```

    ls -dev/disk/by-path/

    ```


    Look for symlinks in the directory that has the following:

    <IPADDRESS=3260-iscsi-iqn.<ISCSI_Target_identifier>:<ISCSI_unique_LUN>


    ip-9.12.7.97:3260-iscsi-iqn.2014-04.ibm.itso:lun-2-lun-1


    where:


    +   - The IP address of the remote iscsi target is 9.12.7.97

    - The SCSI Target Identifier is iscsi-iqn.2014-04.ibm.itso

    - The unique SCSI LUN for the Apache we partition = lun2


    For the MySQL data directory, the IP address of the remote iscsi target and the
    SCSI Target Identifier are the same as the Apache we disk. The only difference
    is that the unique SCSI LUN for the MySQL data partition is equal to lun3.'
