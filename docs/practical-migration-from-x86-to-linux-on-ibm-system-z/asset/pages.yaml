  img_proc: true
- pgno: 109
  md: 'It is generally held that "security through obscurity" is not a valid method.
    Using open, well-established security methods implemented correctly provides the
    best defense. For example, developing your own cryptographic libraries, instead
    use open, established ones that have been vetted for many years. Hiding information
    creates more system work, and any mistakes could cause a failure to protect against
    attacks.


    System logs and application logs must be immutable. Logs must be kept in such
    a way that they cannot be altered by system users. If logs can be altered, overall
    system integrity comes into question if a hack is suspected. Therefore, it is
    important that all logs be kept in a way that makes them a permanent record of
    what occurred on the system.


    Document the system security and all the assumptions made. Include all "what if"
    situations that can reasonably be expected to occur. Also, document security plans
    such as change control, audits, and procedures for break-ins in all domains.


    # Understanding the hypervisor foundation


    The Linux virtual machine (VM) is controlled by a hypervisor, perhaps KVM or z/VM.
    Thus, for a complete survey to be done, you need both access and an understanding
    of its security.


    The VM layer allows for many operating system images to run on the same hardware
    at the same time. The hypervisor allows for resources to be shared between each
    VM. It also allows for virtual devices to be created and consumed, like HyperSocks.


    # LinuxONE and existing security policies


    Most organizations have an existing security policy dictating that hardware, especially
    those virtual environments, must not be Internet-facing. With the migration of
    a distributed environment to LinuxONE, this requirement often raises questions
    about the role of LinuxONE within the existing security policy. A useful approach
    regarding security policies is to conform with the existing policy as much as
    possible because it simplifies the migration process.


    Processor Resource/System Manager (PR/SM) has been certified through the Common
    Criteria at Evaluation Acceptance Level (EAL) 5. More details about Common Criteria
    are covered in 1.2, "Reasons to choose LinuxONE" on page 4.


    To ensure the isolation of one partition from another, dedicate the OSAs to connect
    to external networks by a hypervisor to the partition in question. These precautions
    ensure that guests or partitions share an external network. However, if the security
    policy states that nothing on a virtualized environment can be connected to the
    internet, you have the option of putting the web servers on x86 servers with a
    physical firewall between the web servers and the hypervisor.


    # Firewalls and existing security policies


    In many cases, an organization''s existing security policy identifies specific
    firewalls that have been approved for use on the corporate network. Most often
    the LinuxONE hypervisors can provide a virtual network between distributed servers,
    such there is often requirement to have a firewall between such as a database
    server. In a distributed environment, the firewall is in the communication path.


    LinuxONE provides two options. The first is to implement a software firewall on
    a virtual server within the LinuxONE environment. This configuration has some
    challenges because the software firewall might not be used in the organization
    and as such would have to be certified, which might be a long and complicated
    process.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'The second option is to continue to use the physical firewalls by having the
    inter-security level communication exit the virtual environment through an OSA,
    go through the physical firewall, and then return to the virtual environment through
    a different OSA. Figure 5-13 illustrates the use of an external firewall.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_110_0.png)


    Figure 5-13 Using external firewalls between security zones


    In 5-13, the different security zones can be in separate partitions or even in
    the same partition. Customers have reported that using external firewalls has
    minimal performance impact.


    As mentioned, conforming to the existing security policy can signify a migration.
    However, the reality is that for applications within the LinuxONE footprint, as
    shown in Figure 5-13, there might be no requirement for firewalls if all incoming
    communications to LinuxONE are processed by external firewalls.


    # Control of hypervisor


    Who will the hypervisor, and what is the protocol for requesting changes or actions?
    Regardless of whether the KVM or zVM hypervisor is used, if you control the hypervisor,
    you need to fully understand it because it is the basis for all the virtual machines
    on that partition. It must be secure and its access be highly controlled. Also,
    document a change request protocol and publish it to all stakeholders.


    You also need to plan for hypervisor maintenance, which might require that some
    or all of the virtual machines be queried. Therefore, ensure that a change window
    is set aside to allow for maintenance, and put a plan in place and set a schedule
    for security and hypervisor updates and maintenance.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Security references


    For more information about hosting Linux guests, and security and networks, see
    the following IBM publications:


    +   - Security on z/VM, SG24-7471

    - Introduction to the New Mainframe: z/VM Basics, SG24-7316

    - IBM Z Systems Connectivity Handbook, SG24-5444


    # Hardening the base Linux guest


    The term hardening is commonly used in server security to mean the process of
    taking a generic operation and changing it to provide what is necessary for the
    production environment. This configuration provides a baseline for security for
    the operating system.


    During migration, you might be given an already hardened Linux image. In that
    case, simply need to know what is allowed and not allowed with the image. However,
    if a hardened Linux image does not exist, create and maintain one.


    # Creating a hardened Linux guest


    The basics of hardening a Linux on any platform consists of removing unnecessary
    applications and services, and then securing the applications and services that
    remain. Explaining this process is beyond the scope of this book, but for more
    information, see Security for Linux on System z, SG24-7728.


    # Migrating to a hardened Linux guest


    A hardened Linux should have most if not all applications and services removed
    or disabled. There might be more than one Linux to choose from, so be sure to
    choose the version that provides the maximum number of applications and services
    that you need to perform the migration.


    You will need your migration analysis to determine what needs to be reenabled.
    If any applications are to be installed and services enabled, you need to provide
    credible business cases for each, individually or as a set. Completing the security
    analysis can provide just such business cases. Make sure that the documentation
    includes all applications and services as a delta from the base hardened Linux
    image.


    > Important: RHEL includes SELinux security method, SUSE Linux Server includes
    AppArmor for its enhanced security method, and Ubuntu uses AppArmor (although
    SELinux is available). Determine whether these environments are in use or required,
    plan accordingly.


    Those mechanisms are complex, so invest the time you need to identify code and
    applications that have not been ported to work in these environments.


    # Maintaining a hardened Linux guest


    It is necessary to maintain base hardened Linux guest. Kernel changes and security
    patches are issued, so you need to develop a plan for maintaining the base image
    and assigning the resources to accomplish it. Thus, successive migrations will
    benefit from a properly maintained hardened Linux.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 5.6.2 Code and application analysis


    When migrating an application from x86 to LinuxONE, the vendor might provide a
    supported package for LinuxONE. The application might only be available as source
    code (from a vendor, or something developed internally) that needs to be recompiled
    for the new LinuxONE platform. Either way, it is important to know what the security
    methods are, and how they will be used in a virtual machine on LinuxONE. Be sure
    to poll the stakeholders about the security requirements that must be met.


    When moving an application to LinuxONE, consider isolating applications on different
    virtual machines from those that will be serving data. The more isolation, the
    more straightforward the security will be.


    If you know there is a security issue with an application, do not use it. You
    need to address all security issues before the system is placed in production.
    If more secure ways to configure an application are available, invest the time
    to make those changes during migration. For example, you might place a database
    on a different virtual machine than the application that uses it. Remember, the
    more separation, the more straightforward security will be. With easy-to-understand
    security tend to be easier to defend and maintain.


    # Code dependencies


    Almost all code uses APIs and other libraries to carry out the tasks it was designed
    for. Therefore, you need to review these dependencies before migrating. If you
    discover that a dependency exists on an item that has a known security issue,
    you must find and implement a suitable replacement.


    # Application dependencies


    Generate and review a list of all application dependencies for known security
    issues. Only fixed or known versions should be used. You might be tempted to migrate
    the application over to the new Linux guest and test to prove that the protection
    is achievable. However, testing is invalid if any application or its dependency
    is on code that has known security issues.


    # Checking user input


    User input is the vector that is commonly used to attack systems and programs,
    so all user interaction must be examined carefully. Check all input to make sure
    it is within the range of the data needs to be processed. Pass raw input to another
    application or system request.


    Use exceptions to ensure that input always conforms to the format that is expected,
    and if the unexpected occurs, that can be gracefully handled.


    # Planning for updates when migrating code


    When code is migrated to an enterprise-class system, changes need to be addressed
    in a different manner. Unlike critical code, changes must be allowed to run while
    the application is still running. Thus, you must ensure that a method is in place
    to signal that configuration and control files have been updated and need to be
    reloaded.


    A security issue might need to be addressed by configuration changes. In an enterprise
    environment, a program should not be stopped but only signaled to take on changes
    (for example, you might need to change the TCP port that an application uses).
    Ensure that the code can handle such changes gracefully.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Carefully examine all configuration changes. Do not assume that the changes
    are valid, but instead verify that they are within the bounds of the setting.
    If they are not, handle the error gracefully.


    # Networking


    If the code implements TCP sockets, make sure that its design and function are
    reviewed with the networking team that represents the firewall. That team will
    probably need to know the following information:


    +   - What ports are used by the code, and for what purpose?

    - What type of protocol is used: TCP, UDP, ICMP, and so on?

    - Are special settings used on the port, as in TCP keep?

    - How long can a connection tolerate a lack of response?

    - How long is a connection allowed to idle?


    # Logging and recording events


    As previously, all logs must be kept in a way so they cannot be changed. They
    need to be a permanent record of what occurred on the system. Configure the Linux
    so syslog (the Linux system log) not only keeps a local record, but also forwards
    it to a remote secure system. Also, make sure that all critical applications are
    properly configured to use syslog.


    # Implementing syslog logging when migrating code


    The syslog-daemon will run on Linux. Take to update the code as needed to send
    messages to this daemon. At the very least, log all information that deals with
    security and critical state information. The benefit of implementing syslog functionality
    is that maintenance is performed by the system (log rotation and archiving).


    # Escalations of authority


    Apply the "principle of least privilege", which means that programs only operate
    with the authority needed to accomplish a goal. If the code accesses a database,
    it should access it only as a user with the access needed, and not as an administrator.


    # Migrating code


    Analyze your code to determine any escalations of authority. Also, ensure that
    it accounts for exceptions, so that a de-escalation of authority exists. In other
    words, make sure that if the code is broken, it does not allow the user to operate
    at a different access level than allowed.


    # Migrating applications


    Programs that run as root, the super user, must be carefully examined and assured
    that they are operating as designed. Generally, allow no code or program to run
    with root, if you can avoid. Make sure that server applications are at the suggested
    secure settings during all phases of the migration. You do not want to run applications
    as the administrator during development, only to discover during testing that
    certain functions do not work.


    # Security test plan and peer review


    All code and applications that are be migrated should be in their secure mode
    during development straight through test and deployment. This validation determines
    what you need to include in the security test plan. Everything that can be tested
    and document what was not tested and why. It is also worth to change control and
    verify the restore of backups. If an incident does occur,'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'the only way to recover might be to patch the fault and restore data from the
    backups (assuming that they have not been compromised).


    #  5.6.3 Availability accountability


    Security involves more than simply who can access a system. It also involves keeping
    the system available to authorized users and not available to unauthorized users.
    Denial-of-service attacks (DoS) have become more frequent in recent years, and
    Internet-facing systems must take the possibility of such threats into account.


    Implementing executable system security requires an audit trail, without exceptions.
    All access to the system must be logged in a secure fashion to ensure that if
    an authorized user commits an indiscretion, it cannot be covered up.


    # Availability analysis


    Sometimes attackers do not break into a system, but instead bring down a service
    by overwhelming it with requests. This system or services availability needs to
    be understood and service agreements maintained.


    # Internet-facing considerations


    The internet is a "space" where individuals are usually anonymous. Therefore,
    every effort must be made to mitigate malicious access if you have an internet-facing
    Linux system. You must be able to identify individuals and their IP addresses
    so that, if necessary, you can work with the networking team to prevent malicious
    access while still allowing users to access.


    # Communicating availability


    Establish a standard for communicating system availability that explains how to
    resolve issues and outages to ensure that they are communicated to the appropriate
    staff. An unexpected interruption in availability can be the first sign that there
    is a security issue, that potential security threat needs to be addressed.


    # Accountability analysis


    As previously mentioned, all system logs and application logs must be immutable.
    If attackers gain access, they generally erase evidence of their presence to avoid
    detection. Also, if users attempt to perform unauthorized acts, they might try
    to cover their activities by erasing logs or incriminating evidence.


    # Making log files immutable


    Configure syslog-log to store logs on a separate secure server. Ideally, the logs
    should be stored in a Write Once Read Many (WORM) device. Do not delete, and keep
    a secure backup.


    Another approach to securing system logs is to use a remote log server, as supported
    by syslog-log. An example of this approach is in i.8, "Deploying central log server"
    on page 172. The logs on the remote log server are not necessarily immutable,
    but they are not directly writable from a system that has been compromised.


    # Audit trails encompassing all security domains


    Make sure that security audits can always be passed by verifying that you can
    trace an individual''s physical, network, and application access to systems. You
    must be able to show a system access audit trail from all domains, not just from
    system access.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Authentication


    Ensure that communication end-points are who they say they are. Attackers often
    "spoof" or pretend to be a system or user they are not. To protect against such
    attacks, use "authentication" conversations:


    +   - Users must be assured that they are connecting to the server that they think
    they are.

    - Servers need to be assured that users are who they say they are.

    - This authentication must be kept private so eavesdropping cannot occur.


    Disabling Telnet and using Secure Shell (SSH) accomplishes this authentication.
    Using Secure Sockets Layer (SSL) with web servers also accomplish this level of
    security, and is preferred over the default of no SSL.


    # 5.6.4 Data integrity and confidentiality


    A benefit of LinuxONE is that data can be stored on an enterprise-class system.
    However, you need to analyze the current state of the data and then determine
    how it fits in the new enterprise system.


    # Data integrity analysis


    Data integrity refers to the assurance that data is unchanged from creation to
    reception. Data integrity also entails the following items:


    +   - Who can access data and what is allowed

    - Is there an audit trail in place to map what changed and when

    - Whether the data is corrupted in some way and how it is to be restored

    - Whether a disaster recovery plan is in place


    # Protecting data at rest from unauthorized access


    Protecting access to a database is well understood, but what about protecting
    raw data on the disk? Mobile computers with full accounts of data are sometimes
    misplaced or stolen. Thus, you need to protect data "at rest" (meaning the files
    themselves) and ensure that the data is kept in a secure way. Prevent offline
    copies of a database from being kept on portable devices or drives. Control of
    data is key. Be sure to communicate the data integrity policy to all individuals
    who have access, and monitor the audit trail to make sure the policy is being
    enforced


    # Data backups: Part of security


    Part of your security needs to include backups and how they are stored. They need
    to be kept in a secure way. When backups are separate from the system for disaster
    recovery purposes, use encryption to prevent unauthorized access. Understand the
    impact if the backups are stored and mitigate the risk.


    # Confidentiality analysis


    Confidentiality must first be communicated and then enforced. Thus, before users
    can access a system, they need to be told what the confidentiality of a system
    is and how any data or information is to be used or shared. In addition a system
    needs to be in place to enforce the policy. This enforcement is normally done
    by auditing access logs. If a violation is detected, it needs to be communicated
    to the affected parties.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Understanding laws and regulations before an incident occurs


    Before you can create a confidentiality policy, you need to understand what is
    legally expected.


    +   * Are there national, regional, or state laws that need to be followed?

    * Are there any industry compliance requirements (such as Payment Card Industry
    (PCI) requirements) regarding the storage of credit card information?

    * Is there company policy? If so, it needs to be followed.

    * Document all expectations regarding how long to keep the data (for example,
    We expect or are required to keep the data for up to 5 years).


    # Publishing your confidentiality policy


    You need to communicate the confidentiality policy in such a way as to ensure
    all users of the system are aware of it and thus can be held accountable. When
    a user logs in to a system, use the Message of the Day (MOTD) in /etc/motd as
    shown in Example 5-2 to communicate with your users.


    > Tip: Use ANSI art or special characters to make the linux login window attractive.
    It is useful to display system information such as the Linux distribution with
    its version and release information, along with a greeting.


    On web pages, create a link from the main page so that the system policy can be
    easily accessed. If you are using VNC login, display the policy by updating /etc/gdm/custom.conf
    as shown in Example 5-3.


    ```

    Example 5-3 Policy found in /etc/gdm/custom.conf

    [greeter]

    DefaultRemoteWelcome=false

    RemoteWelcome=Connected to \nn must read policy K49-R v21

    ```


    # Having a plan in place before an incident occurs


    Have a plan in place case confidentiality is violated. The plan should include
    these items:


    +   * Who should be notified and what should be disclosed about the incident.

    * If there is a requirement to notify the public, document how and what should
    be disclosed.


    Communicate actions that will be taken to prevent future incidents.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 5.6.5 Security change management


    No system is perfect so there will be changes, however infrequent. Because security
    fixes are important to keep current, you need a plan to understand their impact
    on the system. If a Linux needs to be restarted, it must be done in an orderly
    and timely basis.


    After the system is moved from test to production mode, it remains that way. Outages
    are expensive for companies, but failing to plan change windows and downtime also
    causes security problems. In the rare case that a VM needs to be restarted, you
    need the ability to allow for these types of changes.


    # Testing changes with a clone of the Linux guest


    The advantage of migrating to LinuxONE is that you can clone a VM and test changes
    before you apply them to the production images. Run through the complete change
    from start to finish, rather than assuming that it will.


    Record long it takes to make changes and test worst scenarios. After testing the
    change on the clone is complete, report to production stakeholders how long the
    change will take and how long the worst case will take.


    # 5.6.6 Enterprise authentication options


    Migrating to an enterprise system means that user and identification management
    can be consolidated. This section describes enterprise authentication options
    and where to find the corresponding information about how to implement them.


    # A common centralized LDAP server


    When migrating applications and code to LinuxONE, you can simplify user administration
    by storing user information in a Lightweight Directory Access Protocol (LDAP)
    server. Configuring the Linux guest to authenticate from a centralized LDAP server
    provides the following benefits:


    +   - User management is simplified, and users can be managed across the enterprise.

    - Changes to a user are applied across all images.

    - An offline VM might contain outdated information. Using LDAP ensures that bringing
    in an old image does not compromise current security.


    You can also configure Samba to use LDAP as its repository. Thus, you can have
    security domain access across MS Windows, IBM AI®, and Linux. For more information
    about this topic, Open Your Windows with Samba on Linux, REDP-3780.


    # 5.6.7 CP Assist for Cryptographic Function


    When migrating to LinuxONE, the underlying hardware can accelerate cryptographic
    mathematics. The CP Assist for Cryptographic Function (CPAC) supports synchronous
    cryptographic functions. The work is processed by the crypto-assist processor
    that is integrated into every processor in IBM LinuxONE, or the Crypto-Express
    card, if it installed.


    The following APIs are supported:


    +   - OpenCryptoki

    - OpenSSL

    - Global Security Kit


    104 Practical Migration from x86 to LinuxONE'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# OpenCryptoki


    An open source implementation of Public-Key Cryptography Standard #11 (PKCS#11),

    OpenCryptoki uses the libica shared library to access IBM cryptographic adapters

    the z90crypt device driver.


    # OpenSSL


    An open source implementation of Secure Sockets Layer, OpenSSL can use the libica

    library for hardware encryption.


    # Global Security Kit


    Provided as part of the IBM HTTP Server, Global Security Kit (GSKit) manages SSL

    cificates. It uses OpenCryptoki for hardware encryption.


    Using this approach offloads the cycles and allows for more concurrent access
    to a web

    server that is using SSL or applications that use one of the supported APIs. To
    learn about

    how to configure your system so that your Linux guest takes advantage of the installed

    hardware, see The Virtualization Cookbook for IBM z Systems Volume 1: IBM z/VM
    6.3,

    SG24-8147.


    # ## 5.7 Operational analysis


    The source application comes with a complete support structure. Part of that support

    structure performs daily operational tasks. Depending on the application, this
    support can

    be 24 hours a day, 7 days a week, and 365 days a year. The application relies
    on manual and

    utomated intervention to start, stop, monitor, and maintain the services provided
    by the

    application.


    This section describes the operational issues which, if present in the source

    application, must be addressed in the target application. A careful and detailed
    analysis about

    how the source application is supported by operations staff is required for a
    successful

    migration effort.


    An analysis of the operational functions can highlight characteristics of the
    application that

    were not clear from the analysis of other interfaces or from the code itself.
    The

    application code might be successfully ported, but it is just important as the
    application''s

    operational support structures be migrated successfully as well.


    # ### 5.7.1 Operational migration tasks


    This section describes operational issues that might change when migrating the
    source

    application to the target application in a new environment:


    +   - Starting and stopping the application


    These processes can be automated or manual. The source application probably had

    certain methods for starting and stopping its processes, but the target application
    will

    probably have different commands and methods for starting and stopping the application.


    If the target application is a manual process, the operators must be trained and
    the

    appropriate documentation must be written and published. If it is an automated
    process,

    the automation scripts need to be written, tested, documented, and explained to
    the

    operators.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '+   Notification of problems

    Sometimes automated messages or indicators can be sent that are unfamiliar, and
    the correct response is unknown. Operators and systems support staff need to know
    who to turn to for guidance when this type of problem arises, the application
    owner needs to be clearly identified. If the application owner is not available
    or unresponsive, escalation procedures need to be in place. These details might
    change when the application is migrated to the target system.


    +   Normal intervention and monitoring

    Some applications need to be checked or modified during their lifecycle throughout
    the day. This process simply involves monitoring indicators or displays that show
    the health of the application. New procedures for the migrated application must
    be communicated to the operators. Hands-on training sessions are optimal for operators
    so that they can learn by observation and perform required tasks.


    +   Hardware manipulation

    Some migrations include hardware consolidation or replacement. Operators need
    to be trained on how to operate and manipulate the new hardware. Even if the operators
    are not required to manipulate the hardware, it is still useful to tell them what
    is running on the new server and to have the appropriate documentation, labels,
    and signs available for reference.


    +   Hardware intervention and problem escalation

    There are fewer hardware interventions for operators to deal with on LinuxONE.
    For example, with the source application and server, an operator might be comfortable
    with required to restart a server using the power switch. However, on LinuxONE
    is a serious error to use a power switch to restart a server or application.


    If a new hardware is involved in the migration project, the method that the operators
    must use to notify the vendor of an actionable message or event that needs to
    be communicated to the operators. Carry out and document a test of procedure.
    Do not wait for a critical situation to occur before learning how to contact vendors
    or other support personnel. The contact information should include day shift,
    off hours, and weekend names and months. The requirements for the vendor contact
    needs to be clear. The vendor often requires precise, detailed information such
    as serial numbers, machine type, and location.


    +   Batch processes and scheduling

    Most applications have batch processes that support the application. Automatic
    scheduling software is common at all installations to schedule and track those
    batch processes. Schedulers within the operations department need to be involved
    to create the necessary scheduling changes for the migrated application. The new
    schedules must then be communicated to the operators on each shift.


    +   Other considerations

    Not everything in your operating environment can be envisioned and described here.
    The intent of this chapter is to give you an idea of possible operational issues
    related to the migration project. Think of everything in your operating environment
    that might change or be affected by the migration of the source application to
    the target application. Then, create a plan to perform the required operational
    migration tasks. And finally, run your plan.


    106 Practical Migration from x86 to LinuxONE'
