- pgno: 69
  md: '# 5.1 Network analysis


    This section provides information about network migration configuration issues,
    explains how the virtual network can be configured, and provides the facilities
    that are available on LinuxONE and its hypervisors. The following terms and components
    are used throughout LinuxONE:


    +   - Open Systems Adapter

    The Open Systems Adapter (OSA) serves the same function as an Ethernet card on
    x86, by acting as the hardware controller and providing connectivity to clients
    on local area networks (LANs) or wide area networks (WANs). It can be directly
    attached to Linux, but will typically be attached to virtual switches. You can
    find more technical information about OSA cards on IBM z13 Technical Guide, SG24-8251.


    +   - OSA with Link Adapter

    You aggregate multiple physical OSA cards into a single logic link, which is called
    a link aggregation group (LAG). This configuration increases the bandwidth and
    provides nondisributive favor. How to configure it is described in *Advanced Networking
    Concepts Using Linux on IBM System z*, SG24-7995.


    +   - HyperSockets

    HyperSockets is a LinuxONE microcode emulate of a Logical Link Controller of an
    OSA interface, and provides near zero latency at memory speed communications between
    servers running different LPARs, but not external connections. If an external
    connection is required, a HyperSockets bridge must be implemented by using a virtual
    switch, or a Linux guest must be set up as a router.

    HyperSockets provide a fast connection between LPARs. This direct connection involving
    real hardware is an important factor to simplify setups with many Linux systems.
    Some benefits are explained in *Set Linux on IBM System z for Protection*, SG24-8137.


    +   - Virtual switch

    A virtual switch (VSWITCH) is a software program that enables one virtual host
    to communicate with another virtual host within a computer system. Virtual switches
    typically emulate functions of a physical Ethernet switch. In LinuxONE, a VSWITCH
    provides direct attachment of Linux guests to the physical network segment. The
    VSWITCH allows IP network architects and administrators to treat Linux guests
    as a regular server in the network.


    The actual speed of a connection with a VSWITCH depends on a number of different
    variables. The type of traffic is as important as the real underlying hardware
    and the maximum transmission unit (MTU). MTU is the maximum size (in bytes) of
    one packet that can be transferred in a network. Comparison to all of these solutions
    is that the VSWITCH is faster than a real switch connected to the server would.


    Implementing VLANs also helps guests run in different security zones of a network.
    It is easy to configure network interfaces to Linux guests that provide only selected
    VLANs to the guest. These can be configured as tagged VLANs or single untagged
    VLAN on an interface.


    # 5.1.1 Network facilities available on LinuxONE and KVM


    The switched network inside a KVM hypervisor is commonly implemented with Open
    vSwitch (OVS) devices, which provide a robust, multilayer, open source virtual
    switch. OVS supports standard interfaces and protocols, and can bond multiple
    OSA devices together for redundancy. OVS devices can communicate between virtual
    machines, or between a VM and an external network hosted by KVM.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'Another networking device, MacVTap, virtualizes bridge networking and is supported
    on KVM. However, OVS bridging is generally preferred due to its richer features
    and a more granular control over devices.


    VLAN and VLAN tagging are supported by both OVS and MacVTap devices.


    # 5.1.2 Network facilities available on LinuxONE and z/VM


    The switched network device a z/VM hypervisor is commonly implemented with a VSWITCH,
    managed by the VSWITCH virtual machine. When running the VSWITCH as Layer 2, it
    behaves similar to a real switch just between virtual machines.


    VSWitches do not need a connection to an OSA to operate. They can also provide
    purely virtual networks. This feature also simplifies the setup of private interconnects
    between guest systems. When creating private interconnects in an SSI with live
    guest relocation (LGR) enabled, dedicated VLANs with external interfaces. This
    configuration is necessary to accomplish the private connection between guests
    that run on different nodes in the SSI.


    The VSWITCH infrastructure provides two basic configuration options. One configures
    user-based access, and the other configs port-based access. From the possibilities,
    both are equivalent. Just the configurations differs.


    You can read more about VSWITCH benefits on Set up Linux on IBM System z for Production,
    SG24-8137, and technical information about Advanced Networking Concepts Using
    Linux on IBM System z, SG24-7995.


    # 5.1.3 Network migration overview


    Consider several different levels of network migration because LinuxONE allows
    for complete virtual network systems. Among other features, you can create multiple
    virtual switches in the same partition, and the create virtual LANs (VLANs).


    The VSWITCH operates at either Layer 2 or Layer 3 of the OSI Reference Model,
    and is virtually attached to the same network segment where the OSA is physically
    connected.


    This section covers some common scenarios and how they look on LinuxONE.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Single network scenario


    One of the most common scenarios is the migration of several distributed machines
    from the same physical subnet to a single LinuxONE partition attached to the same
    network segment.

    Figure 5-1 shows an example that involves a single distributed network.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_71_0.png)


    Figure 5-1 Single distributed network


    Within this scenario, all physical machines can be migrated to a single LinuxONE
    machine running Linux and sharing a virtual switch that is attached to an OSA
    card. The OSA card is then connected to the physical network. Figure 5-2 illustrates
    this type of configuration.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_71_1.png)


    Figure 5-2 Single virtualized network'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'To increase the availability of each Linux guest, the preferred solution is
    to configure two or three OSA cards that are attached to different physical switches
    in the network. This configuration provides a network failover capability, as
    illustrated in Figure 5-3.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_72_0.png)


    In a Layer 2 VSWITCH configuration, all Linux guests have their own Media Access
    Control (MAC) address. In a Layer 3 VSWITCH configuration, the Linux guests respond
    with the OSA card''s MAC address to requests from outside the LinuxONE LAN segment.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'In multiple partition scenario where a single network segment is used, the
    preferred solution is to share the OSA card between partitions. Each partition''s
    VSWITCH is connected to the OSA card, and the OSA card is directly connected to
    the physical network segment. This is a common scenario where the development
    and production server are in separate partitions. This configuration is illustrated
    in Figure 5-4.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_73_0.png)


    Figure 5-4 Single virtualized network with multiple LPARs


    60 Practical Migration from x86 to LinuxONE'
  merge: -1
