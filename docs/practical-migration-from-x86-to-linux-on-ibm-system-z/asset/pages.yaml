- pgno: 124
  md: '# Multiple LPARs: HA solution for Linux


    Figure 5-15 shows a scenario with three partitions defined. Each partition can
    have one or more cores that are shared among partitions.


    In this case, the production workload and WebSphere Application Server cluster
    is split across two LPARs, which give HA to WebSphere Application Server because
    a partition or hypervisor failure will not impact the availability of WebSphere
    Application Server.


    Development and test workloads run in their own LPAR, so any err servers have
    no impact on the production workloads. As in the first scenario, a failure of
    a LinuxONE processor is fixed automatically without any impact to the running
    application.


    This configuration eliminates most failure points at a reasonable cost.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_124_0.png)


    Figure 5-15 LinuxONE with multiple partitions running WebSphere Application Server
    cluster


    # Active/passive standby cluster with Pacemaker and Heartbeat


    Beyond specialized facilities such as the WebSphere Application Server cluster
    described above, the Linux ecosystem has more generalized and robust clustering
    solutions available. A solution can be established with an open source product
    such as Pacemaker, or a commercial product using Tivoli System Automation for
    Multiplatforms (SA MP). In this scenario, the virtual machines are established
    in an active/passive relationship. In this relationship, software runs on each
    server monitors and communicates with each other. The software coordinates an
    automated failover of traffic to the standby server during a failure of the primary
    system.'
  merge: -1
  img_proc: true
- pgno: 125
