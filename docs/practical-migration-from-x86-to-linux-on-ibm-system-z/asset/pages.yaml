    # 1.3 A new type of information technology: Workload centric


    An IT workload can be described as one or more system resources that are used
    by one system or a combination of systems to complete one or more jobs at the
    same time or period using system resources such as CPU, memory, and I/O.


    This definition might seem a little simple. However, if you try to create boundaries
    and focus only on one workload on one system, each workload has its characteristics
    and its own behaviors, it is not easy to separate system functionality from infrastructure.


    A classic IT workload approach such as "workload slots" no longer meets the business
    and IT requirements such as workload deployments for analytics, big data, or secure
    commerce on multiple components. This is especially true now that cloud components
    have been positioned as an answer to all IT requirements.


    Currently, when deploying a workload, multiple components need to be wired together:
    Application code, middleware, management agents, preexisting services, virtual
    machines, data, disks, and networks. Workload availability and performance depend
    on the correct wiring as shown in Figure 1-1. The question becomes how to provision
    and maintain the components that are used by a cloud management system to achieve
    both agility and optimization for a varying set of workloads.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_20_0.png)


    Figure 1-1 What is workload'
