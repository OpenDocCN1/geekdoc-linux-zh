    API version: 1.24

    Go version: go1.6.3

    Git commit: 23cf638

    Built: Mon, 19 Sep 2016 20:34:59 +1200

    itsoadmin@lnxmongo:$ $

    ```


    ```

    itsoadmin@lnxmongo:$ docker images

    REPOSITORY TAG IMAGE ID CREATED SIZE

    itsoadmin@lnxmongo:$

    ```'
