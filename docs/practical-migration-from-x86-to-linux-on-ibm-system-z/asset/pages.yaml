- pgno: 167
  md: 'Note: The lamp_server pattern includes the Apache and MySQL components, but
    is missing the PHP component. That is because the "P" in "LAMP", confusingly,
    stands for "Ruby", which is often used as the server-side dynamic web page engine.


    Install the packages for Apache and MySQL by issuing the following command:

    zypper install -t lamp_server


    The zypper command reports which packages are expected to be installed, then prompts
    for confirmation. Press y and Enter to install the packages.


    Install the remaining PHP packages by issuing the following command:

    zypper install apache2-mod_php53 php53-mysql


    # LAMP on Red Hat Enterprise Linux


    Although RHEL has a similar mechanism for representing collections of packages
    as SUSE Linux Enterprise Server does, RHEL does not have a group for LAMP packages.
    Therefore, installing the LAMP packages involves specifying different groups:

    yum groupinstall "Web Server" "MySQL database" "PHP Support"


    Yum reports which packages are expected to be installed, then prompts for confirmation.
    Press y and Enter to install the packages.


    In addition to the packages selected by the indicated groups, another package
    must be installed on the RHEL server:

    yum install php-mysql


    # 8.6.3 Starting and testing LAMP components


    Before migrating the MediaWiki software, configure and test Apache, PHP, and MySQL
    on the target system ensure they are working. This process reduces the number
    of variables to debug if something goes wrong.


    The Apache and MySQL configurations in this example scenario are simple, whereas
    your configuration might be more complex. Migrating the Apache and MySQL configurations
    can be a more complex process. This example presumes that MediaWiki is the only
    application configured for Apache and that no other data exists in the MySQL database
    than is used by MediaWiki.


    Confirm that the version of Apache is what is expected. A common method of displaying
    the version is by running the apachectl -v command, which is the same for SUSE
    Linux Enterprise and RHEL.'
  merge: -1
  img_proc: true
