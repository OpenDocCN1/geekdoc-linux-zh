- pgno: 56
  md: '![](img/2db39dd28fa1ef80e2c2d208b955dfbd_56_0.png)


    # Migration process


    In the field of information technology, the term *migration* refers to the process
    of moving from one operating environment to another. In many cases, the move to
    a new platform involves various organizational and strategic changes.


    This chapter provides you with information about the approaches that are involved
    in planning your migration and defines various types of stakeholders along with
    their roles and responsibilities. Not every organization uses the same titles
    for stakeholders, but the titles you use should match the functions described
    in this book.


    Additionally, this chapter describes the process for a migration project from
    identifying the stakeholders, assembling them, and identifying success criteria
    through verifying both the migration itself and its success.


    This chapter includes the following sections:


    +   * Stakeholder definitions

    * Identify the stakeholders

    * Assembling the stakeholders

    * Migration methodology'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 4.1 Stakeholder definitions


    This section categorizes stakeholders as comparatively non-technical business
    stakeholders, or as technically oriented information technology stakeholders.
    A stakeholder is anyone who is affected by the activities of the project. Conversely,
    it could also be stated that a stakeholder is anyone who affects the migration
    project. A stakeholder analysis is essential to facilitate the communication and
    cooperation between the project participants and to ensure successful outcomes,
    whether the outcomes are individual milestones or the entire completed project.
    Ensure that stakeholders are involved during the planning stages of the migration
    project, rather than just when they are needed to perform tasks for you in the
    execution stages of migration project.


    # 4.1 Business stakeholders


    Business stakeholders are those who are responsible for making the decisions about
    the business and provide direction for migration:


    +   Business owners or business managers

    These stakeholders lead business lines such as Chief Financial Officer (CFO),
    marketing, and sales. They are concerned with the business and financial resources
    used in the project. They often view information technology as a tool to accomplish
    business tasks efficiently and effectively. These stakeholders might have a staff
    member reporting on technical issues, including migration proposals that must
    be evaluated by the technology stakeholders. Conversely, proposals for migration
    originate with the technology stakeholders, who must provide sufficient justification
    to the business. Migration justifications are discussed in Chapter 2, "Analyze
    and update" on page 13.

    Large and complex consolidation projects require participation from several business
    owners and business lines. The business owners and IT management must be closely
    aligned and operate to achieve a successful migration.


    +   Business managers and supervisors

    These stakeholders are concerned with the workflow within their departments. They
    understand the importance of the application and how their employees use it. They
    select users who are the most qualified and motivated to participate in the migration
    project.

    Quality Auditors

    Large and complex consolidation projects require participation from quality auditors
    to create the Quality Indicators (QI) and ensure that the QI get achieved post
    migration project.


    +   Users

    These stakeholders are the customers. They use the application or consume the
    services that are provided by the application, and perform testing to ensure that
    the application is working at least the same level after the successful implementation
    of the migrated system. In a migration without enhancements, users should not
    see any changes. Availability and response times must meet the service level objectives
    agreed to by management and communicated to the users. Their perspective and input
    to the conversion project is valuable. Their satisfaction must be criteria for
    the success of the migration project.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 4.1.2 Operational stakeholders


    Operational stakeholders are different from business stakeholders in that these
    are the people who are responsible for implementing the systems and changes:


    +   - Chief Information Officer (CIO)


    The highest level of IT management is usually the CIO. In some companies, the
    highest level of IT management is a director or a manager. This stakeholder''s
    role is to provide vision and leadership for information technology initiatives.
    The main concerns are to support business operations and services as well as to
    improve cost effectiveness, improve service quality, and develop new business
    processes services. These stakeholders should clearly understand the benefits
    and risks of the migration project.


    +   - Project manager (PM)


    This stakeholder is responsible for creating and managing the plans, interdependencies,
    schedule, budget, and required personnel for the migration effort.

    Other responsibilities include defining and obtaining agreement on the approach.
    The project manager tracks and reports to all key stakeholders on progress plans,
    escalating any issues or risks where appropriate.


    +   - IT managers and supervisors


    Some stakeholders are managers or supervisors of mainframe system administrators
    and system programmers. Managers at this level have various types of influence
    on the migration project. Some have a high level of technical competence and understanding
    of the technologies that are used in the migration project. These stakeholders
    should be intimately aware of the staff and training considerations of the migration
    project. They should work closely with their staff on current skills and map out
    a training plan to acquire the required hardware and software related skills.


    +   - Infrastructure administrator, hardware administrator


    Infrastructure administrators are responsible for defining and configuring hardware
    and the virtualization layer in LinuxONE. LinuxONE offers several virtualization
    technologies: PR/SM, zVM, and KVM for IBM systems.

    Unique to LinuxONE, PR/SM is a type-1 hypervisor that runs directly on bare metal,
    allowing you to create multiple logical partitions (LPARs) on the same physical
    server. These stakeholders can easily define and configure hardware definitions
    using the IBM Dynamic Partition Manager. Infrastructure administrators can configure
    and define LPARs and their resources like processor, memory, and network. In addition,
    various cloud management capabilities provided by both zVM and KVM are OpenStack-enabled,
    which makes the infrastructure administrators'' duties more efficient.


    +   - Linux, UNIX, and Windows administrators


    Linux administrators might help installing Linux, or take over administration
    tasks after the Linux guest has been installed. These stakeholders work closely
    with the system programmers when manager changes or additions are made (such as
    increasing the memory, disk space, or CPU). All Linux administration duties are
    the same as on all platforms, such as Linux on x86.


    Other Windows and UNIX administrators might be involved in the migration project.
    This involvement is partially dependent on where the source system is hosted (that
    is, the platform where the source application resides). The administrator of the
    source system is heavily involved because that the application is being migrated.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Other services, such as DNS, mail servers, and security, will be running on
    UNIX or MS Windows servers. These and other services will usually be required
    by the application that is being migrated. The administrators of these services
    are required to make adjustments for the migrated application.


    +   - Network engineers


    These stakeholders design, install, and maintain data communication equipment,
    such as routers, switches, local area networks (LANs), wide area networks (WANs),
    and other network appliances. They monitor the network for performance and errors.
    During migration, network engineers help to design the new network and deploy
    any changes to the existing network.


    For more information about IBM LinuxONE networking, see 5.1, "Network analysis"
    on page 56. The network concepts and tools outside of LinuxONE is the same for
    these stakeholders.


    +   - Database administrators (DBAs)


    The tasks that are performed by these stakeholders can be separated into two or
    more different related jobs such as database analyst, database administrator,
    and system administrator. The database administrators are responsible for installing
    and maintaining the database management system (DBMS) code base. They design and
    implement the corporate databases, ensure the data integrity, and good database
    performance. They work closely with the application development group to ensure
    that the application running efficiently.


    +   - Application architects and developers


    Applications that are developed in-house require porting and testing on the target
    Linux system. The effort that is involved can vary greatly, depending on what
    the source is written in and how hardware-dependent the code is. Open and commercial
    tools are available to help with tasks such as assessing the portability of their
    applications. IBM Global Services, as part of its migration services offerings,
    uses tools developed in cooperation with IBM Research to help with code assessment
    and conversion. The application architect and developers are the stakeholders
    who are responsible for this porting effort. See 5.3, "Application analysis" on
    page 76 for more information about what needs to be considered.


    +   - Operators


    The operators monitor the application, the operating system, and physical environment
    by checking the monitor consoles, logs, and alerts. They raise problem tickets,
    notify support, and escalate issues to management. New tools and procedures that
    result from the migration project are required to.


    +   - Service Desk staff


    These stakeholders are on the front line of support to the customer. They are
    usually the first ones to get a call when there is a real or perceived problem
    with the application. They need to be the first staff trained on the new environment,
    and should be heavily involved in the migration testing so they can provide meaningful
    support after the migration.


    +   - Users


    Perhaps the most important stakeholders involved in a migration are those who
    will use the application every day. They need to be involved from the beginning
    because the success of the project depends in large measure on how easy the system
    is for them to use. Ideally it should have the same "look and feel" to which they
    are accustomed. However, in many cases a migration is an opportunity for firms
    to improve the application, which often results in additional functions and procedures
    they need to learn.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Note: Users are identified both as business stakeholders and operational stakeholders.


    +   - Vendors

    nThe third-party vendors have many resources that you can use, and they are often
    ready to help if you make your needs known. They can respond quickly and are often
    the most cost-effective source of information and solutions.


    For independent software vendor (ISV) applications that you are targeting for
    migration, you need to determine whether the vendors provide compatible versions
    that support the distribution of Linux that you plan to use. Many ISV applications
    have other third-party dependencies. Vendors should be able to help you map out
    ISV dependencies, including middleware. Leading middleware products are available
    on LinuxONE, and there are often open source alternatives.


    +   - Contractors

    Specialists can be called to assist with transient needs. They can provide skills
    that your staff does not have, or skills that will not be needed after the migration
    project is completed. Contractors can be used to enhance the skills of your staff
    as they perform tasks on the migration project. Make sure that skills transfer
    takes place for persistent, recurring tasks.


    # ## 4.1. Security stakeholders


    The functional area of security has become more visible and critical as company
    assets become more exposed to the internet and available on mobile and wireless
    devices. The security stakeholders include security administrators.


    The security administrators are the team responsible for data protection, including
    the authentication and authorization of users who access company applications.
    The target application must adhere to existent security policies or demonstrate
    heightened security methods and standards. For more details about LinuxONE security,
    see 5.6, "Security analysis" on page 95.


    # ## 4.2 Identify the stakeholders


    The first phase of the migration involves identifying the stakeholders, as defined
    in 4.1, "Stakeholder definitions" on page 44. In turn, the stakeholders identify
    the business and operational requirements that affect the migration process. All
    stakeholders within the company must be consulted to ensure their requirements
    are factored into the migration planning.


    Identify the following stakeholders, as defined in 4.1, "Stakeholder definitions"
    on page 44:


    +   - Business stakeholders define the business and success criteria.

    - Operational stakeholders provide information about the application requirements,
    database requirements, and available network bandwidth, as well as CPU load and
    allowable downtime.

    - Security and compliance teams define compliance requirements for the entire
    migration effort.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 4.3 Assembling a meeting of stakeholders


    Holding a meeting of stakeholders (or representatives of larger groups of stakeholders)
    is a useful way to set expectations and to address other planning considerations.
    Meetings help to uncover whether extra administrator, manager, or user skill enhancements
    are needed. The participants are also the people to whom status and milestone
    results are reported. Some of these people have never met, and a cohesive, efficient,
    and successful project requires personal personal relationships.


    To make sure that all interests are taken into account, request a meeting of the
    key people who requested the migration and who are affected by it. Subsets of
    stakeholders with related tasks and responsibilities should also need to enhance
    communications and encourage teamwork.


    # 4.3.1 Communicating the change


    Stakeholder meetings can be an efficient way to open communication channels. Effective
    communications plans help to "flatten out" the negative aspects of the acceptance
    curve.


    A communications plan, coupled with proper training on the new system, should
    minimize the number of users who reject or oppose the project. It encourages users
    to start out with acceptance instead of dissatisfaction as the initial response,
    and lead to a quick transition into exploration and productive use.


    These issues are more important regarding the IT support team. A strategic decision
    to switch an operating system or platform can inadvertently create an impression
    of disapproval of the work has done so far. This perception might cause staff
    to think that their current skills are devalued.


    You should be able to articulate the objectives for your Linux migration and relate
    them to your key business drivers. Whether you are trying to gain efficiencies
    by reducing costs, increasing your flexibility, improving your ability to roll
    out new application workloads, or some other key business drivers, be sure to
    set up objectives that line up with these goals. The smallest of migrations should
    be able to do this process, and it will help guide you through planning.


    Defining metrics (increased performance, more uptime, open standards, enterprise
    qualities) early in the project helps the team focused and reduces opposition.
    Be sure that you have a means of tracking the metrics. Getting stakeholder agreement
    on your metrics early in the project helps everyone from executives to users.


    Often, the migration to Linux is accompanied by other objectives. For example,
    customers upgrade their database at the same time to get the latest features and
    performance enhancements, and to obtain support that works with the latest distributions
    of Linux. As any project, the scope must be well defined to prevent project overrun.
    However, it is also important that you have a means to manage additions to the
    plan as business needs dictate.


    Because cost is often a key motivator for migrating to Linux, give careful consideration
    to identifying where cost reduction is targeted. Identify metrics for returning
    on investment before beginning migration activities, and identify metrics for
    other success criteria.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# ## 4.4 Migration methodology


    After the business value and need for moving to LinuxONE has been accepted by
    the stakeholders, it is time for the actual migration planning.


    In a typical migration scenario, an entire environment must be identified, rationalized,
    and tested for compatibility with the new host operating environment. Figure 4-1
    illustrates an approach to planning.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_62_0.png)


    Figure-4-1 Typical migration approach


    Identifying the stakeholders is described in 4.2, "Identify the stakeholders"
    on page 47 and 4.3, "Assembling the stakeholders" on page 48. This section describes
    each of the remaining elements in this approach.


    # ## 4.4.1 Pre-assessment


    During the pre-assessment phase, a high-level analysis and initial feasibility
    of the application architecture, source code dependencies, database compatibility,
    and build environment is performed. This task defines an overall scope for the
    migration to the target operating system. The applications that run on the current
    servers are assessed to determine whether they are available and certified to
    run on LinuxONE. In addition, an evaluation of the risks that are related to migration
    is performed. This process helps to identify risk areas at the earliest stage.


    Additionally, perform a careful analysis of present and anticipated business needs
    and weigh the results against the pros and cons inherent in each option of migration.
    The outcome of this phase is a recommended migration approach, and a high-level
    risk assessment and analysis report that identifies potential issues that can
    occur during the migration.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 4.4.2 Define success criteria


    In this phase, a consensus success must be reached by all stakeholders regarding
    the portant project success criteria. Migration success might mean, for example,
    passing a percentage of system tests on the LinuxONE platform or passing a level
    of performance criteria set out by the quality auditor in agreement with the other
    stakeholders.


    Regardless of how the project success is defined, all stakeholders must understand
    and agree on the criteria before the porting starts. Any changes to the criteria
    during the porting cycle must be communicated to all stakeholders and approved
    before they replace the existing criteria.


    # 4.4.3 Finalize the new environment


    Usually a migration involves moving custom-build or third-party applications to
    another operating environment. This task involves careful analysis of different
    tiers of the hierarchy based on a fit between the database, the application requirements,
    and other environmental attributes.


    Generally, perform a one-to-one mapping of the various middleware, compilers,
    third-party tools, and their respective build parameters. If any of the one-to-one
    mappings for any parameters are missing, you need to list other parameters available
    in the tool that would provide the same functions or feature. Examples of forms
    that can be used to help document your software and hardware requirements, see
    2.7, "Planning checklists" on page 18.


    During this phase, most of the technical incompatibilities and differences in
    the environmental options are identified, and are usually fixed.


    # Custom-built applications


    If custom-build applications are written in one or more programming languages,
    several tools might need to be validated on the target environment. These tools
    can include compilers, the source code management system, the build environment,
    and third-party add-on tools.


    Additionally, an in-depth analysis should be carried out on the various build
    options to ensure that the tools on the LinuxONE platform provide the expected
    functionality after the migration (for example, static linking, library compatibilities,
    and other techniques). The effort that is involved can vary greatly depending
    on how portable the application code is.


    # ISV applications


    If you are running ISV applications on x86 that you are targeting for migration,
    you need to determine whether the vendor provides compatible versions that support
    the distribution and version of the target LinuxONE. Many ISV applications have
    other third-party dependencies. Be sure to map out all ISV dependencies, including
    middleware. Most leading middleware and open source products are available on
    LinuxONE.


    > Note: There are many open source alternatives for many applications and services
    for LinuxONE.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 4.4.4 Pilot proof of concept


    After you have a clear understanding of the target environment and the areas with
    possible issues and risks, you can proceed to a pilot proof of concept (POC).
    This phase is a subset of the actual migration, but with a reduced scope and duration.
    In this phase, you implement a small module or stand-alone snippet from the application
    to the target environment.


    The POC phase should involve all of the tasks and activities of the full migration.
    The main objectives of the POC are to focus on the identified areas of risk, empirically
    test the recommended approaches, and prove that the full migration can be completed
    successfully.


    In this way, many potential migration risks that are identified during the pre-assessment
    can be addressed in a controlled environment, and the optimum solution can be
    selected and proved. This services takes the areas of issue and risk, proves that
    the optimal resolution methods have been selected, and provides a minor scope
    of the migration.


    > Note: POC projects might require extra funding and can lengthen the project
    schedule, but will likely contribute to the project''s success.


    # 4.4.5 Decision to migrate


    After the pilot, you should have a complete analysis of the target operating system
    environment and a plan that details the resources, time, and costs that are required
    to migrate to LinuxONE.


    During this phase, analyze and discuss all key requirements with the stakeholders
    including mining, resources, and business commitments such as service level agreements
    (SLAs). Also, discuss any related aspects of the migration, such as new workloads,
    infrastructure, and consolidation. The decision to implement the migration must
    be acceptable to all stakeholders involved in such activity, especially the business
    owner.


    # 4.4.6 Resource estimation


    Understanding the migration objectives and developing metrics with stakeholder
    involvement and agreement helps provide a useful base from which to build a plan.
    Be sure to include all key requirements (such as resource needs) and business
    commitments (such as service level agreements) for each stakeholder in the plan.


    Migration activities rely heavily on the personnel responsible for the development,
    deployment, and production support of the applications and infrastructure in question.
    Anticipating change and ensuring the early involvement of affected teams are efficient
    ways to handle issues. For example, support staff for hardware might be comfortable
    with UNIX hardware support and know where to go for help. However, practitioners
    who are expert in the previous environment might be less open to change if they
    feel threatened by new ways of doing things where they do not have expertise.


    Consider the following areas when performing your resource estimation:


    +   - Resources Determine what hardware and software are required. Identify the
    housing aspects required (for example, whether the electrical and cooling inputs
    are equal). Identify skills-related requirements. Decide what staff is needed
    to help with the crossover.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '+   - Education skills-related requirements and determine whether the staff
    has adequate Linux education. Identify whether there are special skills that are
    needed for the areas specific to hardware or Linux and hardware combination.


    +   - Service level agreements

    While installing, configuring, and testing the change is occurring, determine
    what the support mechanisms are for both you and your vendors. Determine what
    your commitments are to current stakeholders while you are performing the migration.


    +   - Related project aspects

    Determine what other projects are occurring in addition to the basic system changeover.


    # ## 4.4.7 Actual migration


    The scope of this phase is performing the actual migration of the applications
    and the infrastructure to the LinuxONE environment, producing an environment that
    is ready for the testing phase.


    The team follows the planned approach and methodology during their migration activities.
    If needed, modifications are made to the application source code and build environment.
    The new application binary files are generated and checked for compliance with
    the target version of the operating system.


    # ## 4.4.8 Verification testing


    The purpose of performing a formal test is to provide objective evidence that
    the predefined set of objectives is verified and the customer test requirements
    are validated on the target operational environment. This is an important step
    before verification of a successful migration. The goal is to validate the post-migration
    environment and confirm that all expectations have been met before committing
    or moving to production.


    Keep the following questions in mind for validation:


    +   - Does it interoperate correctly?

    - Can it handle the expected load?

    - Does it have the expected performance?


    If any performance issues are encountered during this stage, the target environment
    can be tuned for maximum performance.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# # 4.4.9 Check against success criteria


    After you successfully migrate the environment, reassess the original acceptance
    criteria for all of the stakeholders. If the criteria is achieved, move the environment
    to production and obtain a sign-off for the migration activities. Figure 4-2 illustrates
    three important criteria of success from a user perspective.


    If the success criteria are not achieved, the migration implementation must be
    reviewed. After the review is complete, the testing phase must be redone to ensure
    that the application being migrated meets the acceptance criteria and is ready
    to go into production.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_66_0.png)


    Figure 4-2 Criteria of success from the user perspective'
  merge: -1
  img_proc: true
