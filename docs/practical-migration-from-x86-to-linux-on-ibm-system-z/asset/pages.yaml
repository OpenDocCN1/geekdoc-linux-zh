  md: '# Additional use case scenarios


    The complexity of a migration from Linux on the x86 can change by platform architecture
    and context of the migration. The Linux operating system is more straightforward
    and well-known, and makes migration much easier for technical people. However,
    when you consider an application, database management system, or middleware migration,
    you need to consider degrees of complexity, cost, and risk.


    This appendix provides additional use case scenarios where a telecommunications
    company, a healthcare company, and an energy and utilities company all want to
    migrate from x86 to LinuxONE. It describes the challenges inherent to each industry
    and their respective migration scenarios.


    This appendix includes the following sections:


    +   * Telecom industry consolidation and cloud

    * Healthcare industry: Mobile and internet solution

    * Energy and utilities industry: SAP Cloud and Automation solution on System z'
