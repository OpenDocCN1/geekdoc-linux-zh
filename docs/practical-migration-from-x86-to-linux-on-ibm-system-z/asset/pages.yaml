- pgno: 101
  md: 'The correct swap size depends on your database and how much memory it uses.
    The swap memory should only be used in a usage peak, so set your swap size to
    a safe number that hold this peak and avoids an outage out of memory issues. For
    reference, you can use the amount of 20% of the total memory, but do not set more
    than 2 GB of swap memory at a first moment. Like the memory sizing, monitor swap
    when the usage peak occurs and increase or decrease it to improve performance.


    # Shared memory


    Linux systems use theprocess communication (IPC) facility for efficient communication
    of process with no kernel intervention. The IPC uses three resources to communicate:
    Message queues, semaphores, and shared memory.


    Shared memory is a memory segment that is shared by more than one process. The
    size of shared memory directly influences database performance if the database
    can allocate more objects in real memory, the system performs less I/O.


    To obtain the best memory allocation, some Linux kernel parameters depending on
    what the DBA advocated in the migration. Follow the guidelines in Table 5-2 to
    avoid issues like memory starvation.


    | Table 5-2 Guidelines for kernel parameters |

    | Parameter | Description | Guideline |

    | kernel.shmax | Defines the maximum size of one shared memory segment in bytes.
    | 90% of the total memory, but if you have a large amount of storage, you leave
    512 MB to 1 GB for the operating system indent. |

    | kernel.shmall | Defines the available memory for shared memory in 4 K pages.
    | Convert the shmall value to 4 K (shmax value x 1024/4) |

    | kernel.shmni | Defines the maximum number of shared memory segments. | 4096,
    This amount enables large segments to be created, avoiding the need for thousands
    of small shared memory segments. This parameter varies depending on your application.
    |

    | kernel.sem | Four values must be set in this parameter: The number of semaphores,
    The maximum number of semaphores, The maximum number of semaphores operations
    within one semcall, The limit on the number of allocatable semaphores | 250 256000
    32 1024 |

    | kernel.msgmni | Maximum number of queues on the system. | 1024 |

    | kernel.msgmax | Maximum size of a message in bytes. | 65536 |

    | kernel.msgbn | Default size of a queue in bytes. | 65536 |'
  merge: -1
