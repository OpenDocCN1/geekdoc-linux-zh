  md: '# 1.5 Enterprise cloud computing blueprint for IBM LinuxONE


    Enterprise computing encompasses all the various types of business software solutions
    including database management software such as IBM DB2.


    Enterprise cloud computing refers to the comput environment that delivers infrastructure,
    such as web services, software, and platform services, to your entire enterprise.
    Figure 1-5 shows the IBM LinuxONE platform ready for each layer of cloud.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_24_0.png)


    # 1.5.1 Cloud Solutions on IBM LinuxONE


    Cloud is a method for delivering computing services that allows users to self-service
    provision environments with the agility that businesses need. Running mission-critical
    applications are the backbone of an enterprise. When they go down, there is major
    impact to a business. Because of these factors, workloads require a cloud solution
    that has exceptional system uptime, excellent data security/privacy, and a powerful
    vertical scale architecture. For these work-loads, IBM LinuxONE is the most secure,
    reliable, and scalable on-premises cloud solution. LinuxONE can provide the same
    agility and time to value as other cloud services, with unparalleled enterprise
    qualities of service.


    IBM LinuxONE also deliver cloud services to rapidly deploy a trusted, scalable
    OpenStack-based cloud environment that can start and scale up to 6000 virtual
    machines in a single footprint on IBM LinuxONE.


    # Virtualization portfolio


    Establishing cloud environments on IBM LinuxONE begins with virtualization technology.
    Customers have a choice of deploying z/VM, the worlds first commercially available
    hypervisor to provide virtualization technology, and the newer industry-standard
    KVM. Hypervisors allow you to bring new virtual servers online in minutes (or
    less) to accommodate growth in users, although each technology is designed with
    a different audience in mind.'
