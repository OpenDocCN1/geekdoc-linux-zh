  md: '# Active/active application server cluster


    Figure 5-18 shows a WebSphere Application Server setup in an active/active configuration
    where the WebSphere Application Server Cluster spans two Linux virtual machines
    in two partitions. This setup handles the very rare occurrence of the failure
    of a partition. More importantly, it allows hypervisor maintenance to be performed
    without an outage to the Sphere applications. This task would be scheduled for
    a time when the processing load is light. Guest relocation or migration can also
    be used to avoid an outage due to hypervisor maintenance.


    ![](img/2db39dd28fa1ef80e2c2d208b955dfbd_126_0.png)


    Figure 5-18 Active/active/WebSphere Application Server cluster


    # Active/active application server cluster added to database replication


    Figure 5-19 on page 114 shows a DB2 database added to an active/active WebSphere
    cluster. To provide HA for the DB2 database, the DB2 database replication feature,
    high availability disaster recovery (HADR). HADR protects against data failure
    by replication changes from the source (*primary*) database to a target (*standby*)
    database.


    During a partition-wide outage of the primary DB2 system, the DB2 system takes
    over in seconds, providing high availability. Communication between the primary
    and standby is through TCP/IP, in which this could be done by using the high-speed
    network feature HyperSockets, available on LinuxOne.


    The standby DB2 system can also be at a remote site to provide enhanced availability
    during a site failure.


    IBM Tivoli SA MP running in both DB2 servers is designed to automatically detect
    a failure of the primary, and then issue commands on the standby for its DB2 to
    become the primary.


    Other cluster management software can be used. However, SA MP and sample automation
    scripts are included with DB2 to manage the HA requirements of your DB2 database
    system.'
