    \ contains special characters like a space, then the quotation marks are necessary.\
    \ Do not use quotation marks unless you are certain that they are necessary. Copying\
    \ a string from somewhere and pasting the password can have unexpected results,\
    \ and might make reproducing the password later an inconvenient mystery.\n\nTest\
    \ the MySQL capabilities by running this sample command:\n\n```\nmysql -u root\
    \ -p -e \"show tables\" mysql\n```\n\nThe preceding command prompts you for the\
