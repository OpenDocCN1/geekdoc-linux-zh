  md: '# Chapter 2. Installing SuSE Linux


    This chapter discusses the basic installation of SuSE Linux 7.0 Professional on
    different models of IBM Netfinity servers and how to work around common problems.
    Since it is almost impossible to cover all hardware combinations, we have concentrated
    on typical configurations, which are representative examples:


    +   * IBM Netfinity 3000

    * IBM Netfinity 3500 M10

    * IBM Netfinity 5000 with ServeRAID controller

    * IBM Netfinity 5500 with ServeRAID controller

    * IBM Netfinity 5600 with ServeRAID controller

    * IBM Netfinity 7000 with ServeRAID controller

    * IBM Netfinity 8500 with ServeRAID controller


    We strongly recommend that you also have a look at the extensive SuSE manual,
    which covers the installation process in more detail and more variations we will
    describe here. It also gives you a lot of background information to begin. Before
    you start the installation, make sure that you check the SuSE Web site for updates
    and bug fixes. Linux is a fast-moving target, and the development is a continuously
    ongoing process. There might be new floppy images or kernel patches that contain
    newer drivers. Also, make sure that you add all security fixes if you plan to
    connect your machine to the Internet. Updates and bug fixes for SuSE Linux 7.0
    can be found at:


    ```

    http://www.suse.de/en/support/download/updates/70_i386.html

    ```


    The updates are located on the SuSE FTP server at the following address:


    ```

