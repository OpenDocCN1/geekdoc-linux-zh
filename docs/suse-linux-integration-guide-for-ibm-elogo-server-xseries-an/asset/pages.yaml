- img_proc: true
  md: 'For verifying archives, BRU gives you two options:


    +   1. Checksum Verification - When archives are written, a checksum is calculated
    for each block of data. The checksum is stored in the header of each block. Checksum
    verification will read each block, recalculate the checksum, and compare the checksum
    to the value in each header. Each file will be as it verified, along with any
    errors found. If no errors are found, you know you have an accurate backup.


    +   2. Compare Verification - BRU compares the modifications in time, size, or
    files in the archive that are nonexistent on the hard drive. Any differences,
    such as modification time, are noted. An end of differences notice will be posted
    when the verification is complete.


