    hda5 5985 2048 No ext2 /boot Linux native


    ![](img/85b06e2bfb0156a5e744cfac214d4788_38_0.png)


    Figure 21. File system creation


    After the partition table has been written, you need to create file systems on
    all partitions that you want to use for Linux (this is similar to formatting them).
    Additionally you have to define mount points, which is the partition that will
    act as your root file system, and other partitions should be mounted to. Press
    F4 to open the mount point dialog.


    SuSE Linux provides a new journaling file system that monitors all changes to
    the system disk (hence the journaling) and can play back those changes in the
    event of a system crash. Users who have experienced a system failure on a 20 GB
    hard disk running ext2 will know how long it can take for the file system to be
    checked at boot up for errors. With ReiserFS a 20 GB hard disk can be checked
    by the system in a matter of seconds. ReiserFS is now considered stable enough
    to be used in production systems; therefore, you have the option of creating your
    partitions using ReiserFS. You can see in Figure 21 that we have defined the /
    (root) mount point as a ReiserFS file.


