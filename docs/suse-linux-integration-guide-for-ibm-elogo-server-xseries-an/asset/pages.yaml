    There are some TCP options that can be disabled in a local network with high signal
    quality and bandwidth, since they are mostly intended for loss connections (see
    /usr/src/linux/net/TUNABLE in the Linux kernel sources for a detailed list):


    To disable TCP timestamps, enter:


    ```

    echo 0 > /proc/sys/net/ipv4/tcp_timestamps

    ```


    To disable window scaling, enter:


    ```

    echo 0 > /proc/sys/net/ipv4/tcp_window_scaling

    ```


    To disable selective acknowledgments, enter:


    ```

    echo 0 > /proc/sys/net/ipv4/tcp_sack

