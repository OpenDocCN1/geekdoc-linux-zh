  md: '# Chapter 7. Apache and IBM HTTP Servers


    The Apache Web server is the most popular Web server software on today’s Internet.
    According to the NetCraft Web server survey

    http://www.netcraft.com/survey/, approximately 60% of all surveyed servers (more
    than 13 million) were running a version of Apache (of the time of writing). Apache
    is a very successful collaborative Open Source project. The Web site for Apache
    is http://www.apache.org. Because of the free availability of the full source
    code, it is a very flexible and powerful Web server solution. There are also a
    lot of additional modules, which can be used in combination with the Apache main
    program. Some popular examples aren PHP (PHP: Hypertext Preprocessor, an embedded
    HTML scripting language),

    mod_perl (an embedded perl interpreter) and mod_ssl for secure

    transactions. More Apache modules can be downloaded from the Apache

    Module Registry:

    http://modules.apache.org.


    Some of key features of Apache are:


    +   - Implements the latest protocols, including HTTP/1.1 (RFC2068).

    - Is highly configurable and extensible with third-party modules.

    - Can be customized by writing "modules" using the Apache module API.

    - Provides full source code and comes with an unrestricted license.

    - Runs on most versions of UNIX (including Linux) with modification.

    - DBM databases for authentication, which allow you to easily set up password-protected
    pages with enormous numbers of authorized users without bogging down the server.
    A wide variety of SQL databases can be used for authentication too (using additional
    modules).

    - Customized responses to errors and problems, which allow you to set up files,
    or ever CGI scripts, which are returned by the server in response to errors and
    problems. For example, you can set up a script to intercept 500 errors and perform
    on-the-fly diagnostics for both users and yourself.

    - Multiple DirectoryIndex directives, which allow you to "say" DirectoryIndex
    index.html index.cgi, which instructs the server to either send back index.html
    or run index.cgi when a directory URL is requested, whichever finds in the directory.

    - Unlimited numbers of aliases and redirect directives that may be declared in
    the config files.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '+   • Content negotiation, the ability to automatically serve clients of varying
    sophistication and HTML level compliance, with documents that offer the best representation
    of information that the client is capable of accepting.


    +   • Multi-homed servers, which allow the server to distinguish between requests
    made to different IP addresses (mapped to the same machine).


    # 7.1 The IBM HTTP Server


    The IBM HTTP Server powered by Apache is based on the Apache HTTP Server. In addition
    to Linux, this HTTP Server also runs on AIX, Solaris and Windows NT. See the home
    page at:


    ```

    http://www.ibm.com/software/websservers/

    ```


    IBM HTTP Server for Linux offers the following additional features:


    +   • Remote Configuration: a browser-based configuration tool to allow manipulation
    of the server configuration via a GUI.


    +   • SNMP Support: Simple Network Management Protocol (SNMP) is a well-established
    protocol for managing and gathering information about servers remotely. This new
    support allows IBM HTTP Server to be managed by the SNMP protocol.


    +   • LDAP: The IBM HTTP Server Lightweight Directory Access Protocol (LDAP) plug-in
    allows authentication and authorization (which is required when accessing a resource)
    to be performed by an LDAP server, thereby greatly decreasing overhead for maintaining
    user and group information locally for each Web server.


    +   • Machine Translation Support: This function, when used with an available
    IBM Machine Translation Engine, enables the IBM HTTP Server to translate Web pages
    into other languages without human intervention. This permits Web site visitors
    to read the page in their native language, effectively broadening the reach of
    your Web site. IBM Machine Translation Engines are included in the WebSphere Application
    Server 3.0 and include German, Simplified Chinese and Traditional Chinese. Additional
    languages will be available in the future.


    +   • Support for SSL connections: The IBM HTTP Server powered by Apache supports
    both the SSL Version 2 and SSL Version 3 protocols. This protocol, implemented
    using IBM security libraries, ensures that data transferred between a client and
    a server remains private. Once your server a digital certificate, SSL-enabled
    browsers such as Netscape Navigator and Microsoft Internet Explorer can communicate
    securely with your server using the SSL protocol. The IBM HTTP Server powered
    by


