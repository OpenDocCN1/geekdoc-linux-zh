    # 3.7 System administration with Yast2


    If you prefer to use a GUI to administer your system, Yast2 is the answer. Yast2
    has an easy-to-use point-and-click interface to allow first time UNIX administrators
    to configure a server quickly and efficiently.


    Yast2 is a shell that holds a collection of modules (not to be confused with kernel
    modules). These modules provide the GUI component to configure a certain part
    of your Linux system.


    Yast2 is a relatively new SuSE application, and more modules are added with every
    SuSE release. If Yast2 is not capable of configuring a part of the system that
    you wish to maintain, either use Yast1 or configure the service manually.


    The SuSE technical manual details a wide range of administration procedures, and
    as such should be consulted if you are unsure of a procedure.


    Chapter 3. Basic system administration 135'
