  md: '# Chapter 6. Secure Shell


    Security is a big issue in networks today, and as much many tools have been developed
    to make securing a network just that little bit easier.


    The most widely used application in communicating and maintaining machines has
    been the Secure Shell (SSH). SSH provides a way to encrypt every aspect of a connection
    between two computers on public and private key technology. Passwords are not
    sent as clear text as is common with the "normal" network services, but a challenge
    is sent by the server on connection that the client must answer, all encrypted.


    Once a connection has been established, all communications on the SSH link are
    encrypted based on the public and private key pair.


    # 6.1 Installing SSH


    The US version of SuSE Linux does not include SSH by default, due to US export
    restrictions on strong cryptography.


    You can download SSH for SuSE Linux at:


    ```

    ftp://ftp.gwdg.de/pub/linux/suse/7.0/i1386/suse/sec1/openssh.rpm

    ```


    Install SSH by typing:


    ```

    rpm -i openssh.rpm

    ```


    You will notice that it will update /etc/rc.config, so you will have to run SuSEConfig
    to update your system.


    # 6.2 Configuring SSH


    To set up a secure system, we need to tell the SSH daemon not to allow a fallback
    to password authentication, as it still allows "guessing" of users passwords.
    It is also advisable to restrict access to the SSH service to a certain network
    device. This is not needed if you wish everyone to be able to access the system
    based on public/private key authenticating.


    Open the file /etc/ssh/sshd_config and change PasswordAuthentication yes to PasswordAuthentication
    no. This disables users to log in using a password and forces a key challenge.'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'To change network device SSH will listen on, add the IP addresses of the network
    adapters to the ListenAddress parameter. Using an IP address of 0.0.0.0 will tell
    the SSH daemon to listen on all network devices in the system.


    #  6.2.1 Host key generation


    Start the SSH daemon by typing:


    ```

    rcsshd start

    ```


