    # 14.1.3 Kernel recompilation


    Recompiling the kernel to include only the drivers and features needed by a machine
    can help to decrease the amount of memory used in the system.


    To be able to re the kernel, you will need the C development system installed
    on the system. The development environment can be found in the d (devel) package
    section. You will also need the SuSE kernel source and headers, these can be found
    as the packages, lx_suse and include.


    Once you have installed the development system, and the kernel source code, you
    have a choice of how to set up the kernel for compilation:'
