  md: '+   1. Create module dependency information for all modules by executing the
    command:

    depmod -a


    +   2. Load the module for proper FTP masquerading:

    /sbin/modprobe ip_masq_ftp

    If you want to use another protocol, as Real Audio and Internet Relay Chat (IRC),
    you can load the modules for them also.


    +   3. Set up the timeout for IP Masquerading:

    /sbin/ipchains -M -S 8000 20 200nThe parameters have the following meaning:

    8000 - timeout value for TCP sessions in seconds

    20 - timeout value for TCP sessions after a FIN packet in seconds

    200 - timeout value for UDP packets in seconds

    You adjust these settings to meet your needs.


    +   4. Change build-in policy for forwarding by disabling it for all IP addresses:

    /sbin/ipchains -P forward DENY


    +   5. Add the policy for enabling the masquerading with your internal networks:

    /sbin/ipchains -A forward -s 192.168.1.0/24 -j MASQ

    /sbin/ipchains -A forward -s 172.168.1.0/24 -j MASQ

    You are ready to try your setup. From the computer on the network 172.168.1.0,
    execute the command:

    /usr/bin/ftp server


    Where ftp server is the FTP server on the external network (in our example 9.0.0.0).
    You will see a window sampler in Figure 187.


    ```

    [root@rv220]# ftp -s 24 106.73

    Connected to 9.24.106.73

    220 TCP/IP IBM TCP/IP for OS/2 - FTP server is at 11:45:06 on Apr 17 2000 ready.

    Name (9.24.106.73:root) ivo

    331 Password required for ivo.

    Password:

    230 User ivo logged in.

    Remote system type is OS/2.

    ftp>

    ```


    Figure 187. FTP after IP Masquerading setup'
