  md: '# Chapter 4. Samba


    If you look at any English dictionary, Samba is defined as a Brazilian dance,
    but Samba in Linux is something completely different. Samba is an implementation
    of a Server Message Block (SMB) protocol server that can run on almost every variant
    of UNIX. Samba is an open source project, just like Linux. The entire code is
    written in C so it is easily ported to all flavors of UNIX. Samba is a tool for
    the peaceful coexistence of UNIX and Windows on the same network on the level
    of file and print over the NetBIOS protocol. It allows UNIX systems to move into
    a "Network Neighborhood" without causing a mess. With Samba, UNIX servers are
    acting like any other Windows server, offering resources to the SMB clients. Recently
    Samba was renamed by Microsoft to Common Internet File System (CIFS).


    # 4.1 What can you do with Samba?


    +   * With Samba, a Linux server can act as a file/print server for Windows networks.
    It can replace expensive Windows NT file/print server in this role, creating a
    less expensive solution.

    * Samba can act as a NetBIOS name server (NBNS) in a Windows world, where it is
    referred to as WINS Server - Windows Internet Name Service.

    * Samba can participate in NetBIOS browsing and master browser elections.

    * Samba can provide a gateway for synchronizing UNIX and Windows NT passwords.

    * With Samba client software, you can access any shared directory or printer on
    Windows NT servers or Samba servers and allow UNIX clients to access Windows NT
    files.

    * With Samba File System (SMBFS) you can mount any share from a Windows NT server
    or Samba server in your directory structure (this is available only on Linux).


    # 4.2 Setting up the Samba server


    To see if Samba is installed, issue:


    ```

    rpm -q samba

    ```'
