    # 2.5.1 Installing SuSE with the latest ServeRAID driver


    SuSE Linux 7.0 was released before the new IBM ServeRAID driver, and as such the
    support for the new 4.40 ServeRAID BIOS is not in the stock SuSE 7.0 distribution.


    > The update of the ServeRAID driver can be found at:

    ftp://ftp.suse.com/pub/suse/i386/update/7.0/kernel/ips-4.40

    The directory contains the file bootdisk.img. This is an update for the installation
    system for ServeRAID systems.


    See section 2.7.3 in the SuSE manual for instructions on how to install the floppy
    boot disk.

    The ips-4.40 directory also contains the ips.0 module for ServeRAID on uniprocessor
    systems, as well as ips-smp.o for multiprocessor systems.


    To install a system with the new ServeRAID BIOS, you will have to use the boot
    disk detailed earlier in the chapter to boot Linuxrc, and create an initial ramdisk.
    This is the system that will load the ServeRAID driver from the initial ramdisk
    to boot SuSE from the ServeRAID system. It is not as difficult as it sounds, and
    we will guide you through the process.


    After you have created your logical drives on the system, create the boot disk
    from the SuSE FTP site, and also copy the ips-smp.o and ips.o to a separate floppy
    disk.'
