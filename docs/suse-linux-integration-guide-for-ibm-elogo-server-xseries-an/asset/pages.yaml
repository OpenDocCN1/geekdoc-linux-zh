    ```


    Figure 199. smtpd_etrn_restrictions section of the main.cf


    # 10.2.5 Reporting Postfix errors


    A mail server is one of the busiest services employed on a system, and as such
    should be monitored by the administrator for erratic behavior.


    The log file for the mail server is located in /var/log/mail. If you need to troubleshoot
    the server, this is the first place to look for errors.


    The administrator should also be kept up to date about errors during the running
    of Postfix. We can set the server to send an e-mail to the post master when an
    error or a trigger occurs.


    ```

    notify_classes = bounce, 2bounce, delay, policy, protocol, resource, software

    ```


    Figure 200. notify_classes section of the main.cf


    The notice triggers are:


    +   **bounce** - Notify the administrator that an e-mail has bounced.


    +   **2bounce** - Notify the administrator that an e-mail has double bounced.


    Chapter 10. Postfix 229'
