    # 8.5 How to permanently enable IP Forwarding


    IP Forwarding is not enabled by default. To enable it, edit the /etc/rc.config
    file and make sure IP_FORWARD is set to yes. Run SuSEConfig commit the changes
    and restart the network by typing:

    network restart


    Now your server is ready to act as a router. You can try this by pinging to the
    tr0 interface 92.104.28 from the machine on 172.168.1.00. If the ping is successful
    then your router is working correctly. You can see a window similar to Figure
    186.


