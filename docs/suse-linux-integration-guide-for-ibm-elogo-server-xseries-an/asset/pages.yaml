    # 2.5.7 Using the ServeRAID Manager utility


    The ServeRAID Manager for Linux allows you to manage your ServeRAID controller
    from Linux, without the need for the not-so-stable Windows controller workstation.
    It is a Java based tool and has the same functionality across supported platforms.
    With ServeRAID Manager for Linux you can manage the ServeRAID controller locally
    or remotely. That means that you can install it on the server with the ServeRAID
    controller and manage the controller in the'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'server, or you can install it on a separate Linux box and manage the

    ServeRAID remotely.


    > Note

    For remote management you also need to install the ServeRAID Manager

    on the server with the ServeRAID controller, because the agent needed for

    remote management is included in the package. Also the server and

    management station have to be connected with TCP/IP.


    After you get the file RaidMan-4.40-03.1386.rpm from the Web or the CD,

    install it with the command:


    ```

    rpm -lhv RaidMan-4.40-03.1386.rpm

    ```


    > Note

    Before using this version of the ServeRAID Manager software, the

    BIOS/firmware and the driver for the controller must be on the same level.


    During the installation you have the option to enable the background agent

    which is used for remote management. If you plan to manage the

    ServeRAID adapter remotely, you should answer yes. If you answer yes the

    installation program will add the following line to the /etc/initab file:


    ```

    nfra:12345:once:/usr/RaidMan/Raid@nt.sh #Raid@Man

    ```


    This will start the agent in every runtime. The installation program also starts

    t agent right after installation, so you do not need to reboot to start using

    remote management, as in some other operating systems.


    The ServeRAID Manager is installed in the /usr/RaidMan directory.


    The installation program also installs the necessary Java runtime. This Java

    runtime will not interfere with an already installed Java environment.


    To start the ServeRAID Manager, simply execute the following command in

    the X Windows environment:


    ```

    /usr/RaidMan/Raid@Man.sh

    ```


    > Note

    To use the ServeRAID Manager you have to have a working X Windows

    setup.'
