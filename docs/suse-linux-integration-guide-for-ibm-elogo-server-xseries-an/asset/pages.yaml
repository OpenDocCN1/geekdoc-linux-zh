- img_proc: true
  md: '# # SuSE Linux Integration Guide for IBM @server for xSeries and Netfinity


    The complete guide to running SuSE Linux on xSeries and Netfinity


    Here''s all the information you need to maximize SuSE Linux performance and reliability
    on the IBM state-of-the-art @xSeries and Netfinity server platforms. In this book,
    team of IBM''s experts presents start-to-finish, Netfinity server-specific coverage
    of SuSE Linux 7.0 Professional deployment and system administration throughout
    the entire life cycle!


    Netfinity server-specific coverage you can''t find anywhere else, including ServerRAID
    configuration


    You will get running with expert step-by-step preparation and installation techniques:
    updating your BIOS and firmware, making the CD-ROM bootable, preparing SCSI devices,
    partitioning, configuration, X-Windows setup, deploying ServerRAID in SuSE Linux
    environments, and much more.


    Plan, configure, and install key services, step-by-step: Samba, Apache, Postfix,
    DNS, DHCP, LDAP and more


    Next, you''ll master all the key techniques of day-to-day SuSE Linux system administration,
    including backup and recovery, Internet and e-mail connectivity, DNS/DHCP name
    services, and using SuSE Linux with Samba as a world-class file/print server for
    Windows workstations. IBM-tested, proven, and crystal clear, this is the essential
    book for everyone running SuSE Linux on xSeries and Netfinity.


    # INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    # BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from Partners from around the world create timely technical information
    based on realistic scenarios and recommendations provided to help you implement
    IT more effectively in your environment.


    For more information: ibm.com/redbooks'
  merge: -1
  pgno: 417
