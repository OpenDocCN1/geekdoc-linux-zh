  md: "The various options are explained in the table.\n\nTable 21. Access options\n\
    | | |\n|---||\n| ro read only | Only permits reading |\n| rw read write | Permits\
    \ reading and writing. If both ro and rw are specified, rw takes priority. |\n\
    | root_squash client | Anonymous user (nobody) access from client. |\n| no_root_squash\
    \ client | Access request privileges the privileges of the client root. Useful\
    \ for diskless clients. |\n| squash_uids and squash_gids | Specify a list of UIDs\
    \ or GIDs that should be subject to mapping. A valid list of IDs like this: squash_uids=0,15,20,25-50\
    \ |\n| all_squash all access | Processes all requests for access as anonymous\
    \ user. |\n| anonuid=uid | root_squash or all_squash when options are set will\
    \ assign a group ID to an anonymous user request. |\n| anonuid-gid | root_squash\
    \ or all_squash when options are set will assign a group ID to an anonymous user\
    \ request. |\n\nA sample /etc/exports file is shown in the man pages for exports\
    \ and in Figure 203.\n\n```\n# sample /etc/exports file\n/*.trusty(rw,no_root_squash)\n\
    /projects\n    *.local.domain(rw)\n/home/user\n    *.local.domain(ro) @trusted(rw)\n\
    \    pc001(rw,all_squash,anonuid=150,anongid=100)\n/pub\n    (ro,insecure,all_squash)\n\
    /private\n    (noaccess)\n```\n\nFigure 203. A sample /etc/exports file\n\nThe\
    \ lines in the sample /etc/exports file are explained as follows:\n\n# sample\
    \ /etc/exports file\n\nThis is a comment. Any line or character string can be\
    \ converted to a comment and disabled by entering a # symbol. Everything from\
    \ that point to the end of the line is considered to be a comment.\n\n/ master\
    \ (rw) trusty(rw,no_root_squash)\n\nThis says that the root directory (/) is exported\
    \ to the servers:\n\n```\nmaster - whose rights are read-write\n```"
