    phrase, and you will be asked for your pass phrase each time you log in to the
    system. You can use sentences for your pass phrase; the longer it is, the harder
    it is to crack. And as a general warning do not use a common


    > "The quick brown fox jumped over the lazy dog"


    You would be surprised how it is.


    # 6.2.3 Configuring connections


    Once your key pair has been created, you will need to allow the keys to be used
    to log in to the system. This can be done by copying your public key to the file
    authorized_keys in the ~/.ssh directory (.ssh directory in your home directory)
    of the server you wish to connect.


    ```

    cat identity.pub >> authorized_keys

    ```


    Using >> concatenates the identity.pub file to the authorized_keys file. This
    way you can keep adding public keys if you are connecting from more than one host.


    You need to use your private key to log in to the server. Your private key is
    your pass to the server. If anyone has your private key, they have access to your
    files, do not lose it!


    You can now log in to the server using the SSH client:'
