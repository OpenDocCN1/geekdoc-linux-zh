- img_proc: true
  md: 'If you want this server to be started on bootup, you have to create the correct
    symbolic links in the directory /sbin/init.d/rc2.d (if you start the system in
    runlevel 2, the default runlevel), or /sbin/init.d/rc3.d (if you use the graphical
    login, runlevel 3). You can do this manually with the following commands:


    ```

    cd /sbin/init.d/rc2.d

    ln -s ..ibmhtpd /S67/ibmhtpd

    ln -s ..ibmhtpd /K01/ibmhtpd

    ```


    This start will the IBM HTTP Server in runlevel 2 and ensures that it will be
    properly shut down when switching into another runlevel (for example shutdown).
    Repeat the last two steps above in /sbin/init.d/rc3.d for runlevel 3 if necessary.


    SE Linux also has a runlevel configuration tool, called rctab, which can be used
    to configure the services to start in runlevel. To add the script ibmhtpd to this
    runlevel, run rctab with the following commands:


    ```

    rctab -e -2

    ```


    This will open an editor (vi by default, depending on the environment variable
    EDITOR) that shows the sequence in which services will be started in the runlevel.
    Move to the last entry in the list and add "ibmhtpd" at the first slot marked
    with a "-". After saving this file, rctab will create the necessary symbolic links.


    # 7.3.2 Setting up the administration server


    You have to perform some preliminary steps before you can start using the administration
    server to be able to modify the configuration files of the IBM HTTP Server remotely.


    The administration server tasks allow the administration server read/write/execute
    access to the necessary configuration files and one executable file. The administration
    server should obtain read/write access through a unique user ID and group, which
    must be created. The User and Group directives of the administration server''s
    configuration file should be changed to the unique user ID and group. The administration
    server''s configuration file "group access permissions" should be changed to allow
    read/write "group access". In addition there is a utility program that have "Group
    execute permissions" and "Set User ID Root permissions". This executable must
    run as root in order to request restarts for the IBM HTTP Server and the administration
    server.


    To properly set up these prerequisites, these tasks can be performed by executing
    the script /opt/IBMHTTPserver/bin/setupdm. After the invocation,


