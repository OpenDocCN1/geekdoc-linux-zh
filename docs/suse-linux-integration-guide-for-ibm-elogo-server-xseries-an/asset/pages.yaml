  md: '# Chapter 17. SNMP


    SNMP stands for Simple Network Management Protocol. However, don''t be fooled
    by the name SNMP can be powerful and complex. SNMP is an application-layer protocol
    that facilitates the exchange of management information between network devices.
    It is part of the Transmission Control Protocol/Internet Protocol (TCP/IP) protocol
    suite.


    The two primary components of an SNMP implementation are the SNMP agent and the
    Network Management Application.


    +   - SNMP agent

    An agent is a software component that resides on a managed device and collects
    management information. A managed device could be anything from a UPS, a router,
    or a computer.

    - Network Management Application


    The Network Management application can monitor and control devices on which an
    SNMP agent is running.


    The three commands that are most commonly used in SNMP communication are read,
    write, and trap.


    +   - Read: Used by the network management application to query SNMP agents for
    management information.

    - Write: Used by the network management application to modify variables maintained
    by the SNMP agent.

    - Trap: Used by SNMP agents to send alerts to Network management applications
    when defined thresholds are met or events occur.


    # 17.1 Community Strings


    The collection of management information that an agent is responsible for is called
    the Management Information Base or MIB. MIBs are organized hierarchically and
    are comprised of managed objects. These managed objects are identified by Object
    Identifiers or OIDs within the MIB hierarchy.


    The MIB tree begins with the standards organizations: CCITT, ISO, and ISO-CCITT.


    The objects that we will be looking at our examples are located under the .iso.identified-organization.dod.internet.mgmt.mib-2
    branch. This can also be referenced by short the .1.3.6.1.2.1 descriptor.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '![](img/85b06e2bfb0156a5e744cfac214d4788_365_0.png)


    Figure 306. Partial MIB tree illustration


    Under the mib-2 branch, we have several OIDs that contain basic system information.
    For example, from RFC1213-mib2.asn1:


    +   • 1.3.6.1.2.1.1.1 - sysDesc


    A textual description of the entity. This value should include the full name and
    version identification of the system''s hardware type, operating system, and networking
    software. It is mandatory that this only contain printable ASCII characters.


    +   • 1.3.6.1.2.1.1.3 - sysUpTime


    The time (in hundredths of a second) since the network management portion of the
    system was last re-initialized.


    +   • 1.3.6.1.2.1.1.4 - sysContact


    The textual identification of the contact person for this managed node, together
    with information on how to contact this person.


    +   • 1.3.6.1.2.1.1.5 - sysName


    An administratively assigned name for this managed node. By convention, this is
    the node''s fully qualified domain name.


    +   • 1.3.6.1.2.1.1.6 - sysLocation


    The physical location of this node (e.g., ''telephone closet, 3rd floor'').'
  merge: -1
  pgno: 365
- img_proc: true
  md: 'Sure, it''s nice to know the amount of time since a device rebooted or the
    physical location, but let''s look at something that may be more useful. Again
    under the MIB-2 branch, we have several OIDs that can be used to track network
    usage and also alert to certain kinds of network errors. For example, each interface:


    +   - 1.3.6.1.2.1.2.2.1.8 - ifOperStatus


    The current operational state of the interface (up, down, or testing). The testing(3)
    state indicates that no operational packets can be passed.


    +   - 1.3.6.1.2.1.2.2.1.10 - ifInOctets


    The total number of octets received on the interface, including framing characters.


    +   - 1.3.6.1.2.1.2.2.1.16 - ifOutOctets


    The total number of octets transmitted out of the interface, including framing
    characters.


    +   - 1.3.6.1.2.1.2.2.1.20 - ifOutErrors


    The number of outbound packets that could not be transmitted because of errors.


    These examples contain general information about network interfaces. You have
    the ability to get much more specific the farther you drill down into the MIB
    sub-set.


    > Note

    The.1.3.6.1.4.1 is where vendors such as IBM or Cisco locate customized objects
    for their products. There is practically no limit to the number of branches that
    are available. You should research vendor-specific MIB collections to get the
    most out of SNMP.


    # 17.2 Why should I use SNMP?


    SNMP is typically used to gauge network performance, find and solve network problems,
    and plan for network growth. However, you can also use SNMP to monitor vendor-specific
    hardware such as the current load on a UPS, the CPU utilization on routers, hubs,
    and computers, and even disk I/O and free space. The possibilities are endless.'
  merge: -1
  pgno: 366
- img_proc: true
  md: 'You are not limited to predefined MIBs. Although it is beyond the scope of
    the document, you can compile your own MIBs. I urge you to take a look at the
    document included with the net-snmp packages.


    > Note

    In emergency, timing can be critical. Several commercial SNMP packages include
    paging software. If you wish to utilize paging and your software does not include
    it, take a look at the free application HylaFAX, included in SuSE.


    # 17.3 Implementation on Linux


    The SNMP package can be found in the n (networking) package selection section
    as:


    ```

    snmp

    ```


    The default configuration file installed with SNMP is fine for our purposes. To
    find more information about the configuration file syntax, look at the snmpd.conf
    page.


    To start snmpd, type:


    ```

    snmpd start

    ```


    Congratulations. You have set up a basic SNMP agent.

    to our snmp implementation, we will use the snmpget command. This command queries
    SNMP agents on specified hosts for one or more OID values. The syntax is as follows:


    ```

    snmpget HOST COMMUNITY OID

    ```


    Try the following command:


    ```

    snmpget localhost public .1.3.6.1.2.1.1.0

    ```


    You should get a similar response to:


    ```

    system.sysDesc.0 = OCTET STRING:"Linux Mail 2.2.16 i1686"

    ```


    The OID .1.3.6.1.2.1.1.1 maps to the system description.


    To see all of the available objects in our tree we use the snmpwalk command. This
    command queries an entire tree instead of individual OIDs.'
  merge: -1
  pgno: 367
- img_proc: true
  md: 'The basic syntax is the same as snmpget (although the two commands have several
    different options):


    snmpwalk localhost public .1


    With this command "walk" the entire tree of OIDs that are available to you. You
    can use the snmpwalk and snmpget commands from a remote Linux host on the network
    and get the same result.


    This is a very simplistic implementation of SNMP. Included with the SNMP package
    is a sample snmpd.conf file that includes methods for monitoring CPU utilization,
    disk space, and other useful examples. With these packages comes the ability to
    set traps to be sent to a specified host. The documentation with net-snmp is quite
    thorough. Take a look.


    # 17.3.1 MRTG


    The Multi Router Traffic Grapher (MRTG) is a tool that utilizes SNMP to monitor
    the traffic load on network-links. MRTG generates HTML pages containing images
    which provide a snapshot visual representation of this traffic. MRTG is an excellent
    example of what you can do with SNMP.


    ![](img/85b06e2bfb0156a5e744cfac214d4788_368_0.png)


    Figure 307. MRTG in action


    MRTG requires Perl to be installed. If the Perl packages is not installed, simply
    mount the distribution media and install the following RPM:


    perl


    from the a (base system) section.


    Although MRTG can be used without a Web server, we recommend you install the Apache
    Web server. See Chapter 7, "Apache and IBM HTTP Servers" on page 197.


    Install the mrtg package from the n(networking) package selection section.


    Chapter 17. SNMP 355'
  merge: -1
  pgno: 368
- img_proc: true
  md: 'In our example we will create a configuration file to monitor and graph the
    network traffic on the localhost. We will use the cfgmaker tool to create the
    configuration file:


    ```

    cd /usr/local/share/doc/packages/mrtg /cfgmaker publics localhost > /etc/mrtg.conf

    ```


    We need to edit the newly created mrtg.conf. In the section Global config options,
    uncomment and change the WorkDir entry for UNIX to the default HTML directory
    to the subdirectories mrtg. In our example we are using the Apache web server,
    which serves Web pages from /usr/local/httpd/htdocs. Open the mrtg.conf, located
    in the following subdirectory:


    ```

    WorkDir: /usr/local/httpd/htdocs/mrtg

    ```


    Save the file:


    Sample mrtg.conf file:


    ```

    ################################################################

    # Description: Linux math 2.2.16 1686

    # Contact: jhkins@wlib.com

    # Location: Seattle, WA USA

    ################################################################

    ```


    ```

    ### Interface 2 Descr: ''eth0'' | Name: '''' | Ip: ''192.168.1.1'' | 05-44-99

    [localhost_2]: 2:public192.168.1.1

    MaxBytes[localhost_2]: 96000

    Title[localhost_2]: Traffic Analysis for 2 - phu

    PageTop[localhost_2]: <html>Traffic Analysis for 2 - phu</html>

    <TABLE><TR><TD>System</TD><TD>phu in Seattle</TD></TR>

    <TR><TD>Maintainer</TD><TD>jhkins@rwest.net</TD></TR>

    <TR><TD>Description</TD><TD>eth0</TD></TR>

    <TR><TD>ifType</TD><TD>ethernetCmac (6)</TD></TR>

    <TR><TD>ifname</TD><TD></TD></TR>

    <TR><TD>MaxSpeed</TD><TD>96.0 kB/s</TD></TR>

    <TR><TD>ifIP</TD><TD>10.0.0.254</TD></TR>

    </TABLE>

    ```


    Now we can run MRTG using our config:


    ```

    [root0ga bin]# mrtg /etc/mrtg.conf

    Rateup WARNING: /usr/bin/rateup could not read the primary log file for

    localhost.2

    Rateup WARNING: /usr/bin/rateup The backup log file for localhost.2

    invalid as well

    ```'
  merge: -1
