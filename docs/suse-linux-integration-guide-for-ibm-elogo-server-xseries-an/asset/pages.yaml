    # ## 2.6 XFree86 configuration


    After the initial installation, the system will boot up only on the text console.
    While this is fine if you want to use Linux as a server operating system, many
    people prefer a MS Windows-based user interface. If you want to use a graphical
    desktop environment like KDE or GNU Network Object Model Environment (GNOME),
    you first have to configure the X-Windows system to fit your configuration.


    To configure XFree86, we recommend using SaX, SuSE''s advanced X configuration
    tool. For a more detailed documentation of SaX, see section 8.4, "Configuration
    using SaX" in the SuSE Linux manual. If SaX fails for some reason, you can still
    use XF86Setup or x86config as a fallback solution. Both belong to the XFree86
    tool collection and can also be used to configure XFree86. However, they are not
    as friendly as SaX and you may need some experience with XFree86 to use them.


