  md: '# Chapter 12. NIS - Network Information System


    In a distributed computing environment, maintenance of password, group, and host
    files can be a major task. Consistency is possibly the the biggest difficulty
    here. For example, when a user changes his password on one machine, it would be
    propagated to any other machine he has accounts on. When a network is composed
    of hundreds or thousands of machines, this convenience becomes a necessity. NIS
    is one of ways to


    # ## 12.1 What is NIS?


    The Network Information System (NIS) is a service designed to provide a distributed
    database for common configuration files. It was formerly known as Sun Yellow Pages
    (YP). NIS servers manage copies of the database files. NIS clients request the
    information from the NIS server instead of using their own configuration files.


    NIS is designed after the client/server model. A NIS server contains data files
    called "maps". These maps are owned by the NIS master and can only be updated
    by the master. When there is a change to a master server''s map, this change is
    then distributed to all the slave servers. Clients are hosts that request information
    from these maps but are not allowed to modify them.


    NIS is commonly used in UNIX environments. However, it is also possible to integrate
    Windows NT clients in a NIS-based environment. NISGINA provides a NIS authenticated
    interactive login for Windows NT 4.0 workstations. It supports changing UNIX passwords
    using a Windows NT dialog and some limited remote registry configuration. You
    can find it at the author''s Web page at:


    ```

    http://www.dcs.qmw.ac.uk/~williams/

    ```


    # ## 12.2 How can I use NIS?


    NIS is typically used to centrally manage commonly replicated configuration files.
    Examples of common configuration files are:


    +   * /etc/hosts

    * /etc/passwd

    * /etc/group'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# 12.3 Implementation on Linux


    To introduce the concepts behind NIS, we will create a map of our password file
    kept on the NIS master server. This will allow users to log in to NIS clients
    without having to maintain an account on each system. Centralized administration
    is a key benefit of using NIS.


    A note on security: Before deciding to put NIS in a production environment, please
    consider the security implications of passing sensitive data across the network.
    You may wish to take a look at NIS+, which has strong encryption as well as additional
    maintenance implications.


    The ypclient packages needs to be installed for a NIS client.


    Packages that need to be installed for a NIS server:


    +   * ypserv

    * make


    The nswitch file determines the order of lookups performed. In the case of the
    passwd entry, the system will query the local password database, and then query
    the NIS server for the relevant username entry.


    Sample nswitch.conf file:


    ```

    # /etc/nswitch.conf


    passwd: files nis

    shadow: files nis

    group: files nis

    hosts: files dns

    bootparams: files

    ethers: files

    netmasks: files

    networks: files

    protocols: files

    rpc: files

    services: files

    #netgroup: nisplus

    #publickey: nisplus

    automount: files

    aliases: files

    ```'
  merge: -1
