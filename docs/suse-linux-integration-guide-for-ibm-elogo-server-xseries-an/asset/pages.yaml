  md: 'Apache supports client authentication, configurable cipher specifications,
    and session ID caching for improving SSL performance on the UNIX platforms.


    +   * Fast Response Cache: The Cache Accelerator can dramatically improve the
    performance of the IBM HTTP Server by Apache when serving static pages, for example,
    text and image files. Because the Cache Accelerator cache is automatically loaded
    during server operation, you are not required to list the files to be cached in
    your server configuration. In addition, the server will automatically recache
    changed pages and remove outdated pages from the cache. The Cache Accelerator
    provides support for caching on Web servers with multiple TCP/IP adapters.


    # 7.2 Apache HTTP Server installation


    The Apache HTTP Server is installed and started by default on SuSE Linux, because
    it is used for the online help system. You can verify the installation by querying
    the RPM database.


    ```

    rpm -q apache

    ```


    This command will return either the version number of the installed package or
    an error message, if the package is not installed. Refer to 3.1, "Adding and removing
    software packages using YaST" on page 111 for how to install the package if it
    is missing. The package window is located in series n - Network-Support (TCP/IP,
    UOCP, Mail, News). Apache will be automatically started on startup, if the variable
    START_HTTP in the central configuration file /etc/rc.config is set. See 3.6, "Changing
    the configuration file with YaST" for methods to modify this variable. To start,
    stop or reload the server (after a configuration change), run the script:


    ```

    /usr/sbin/apache [start][stop][reload].

    ```


    This file is a symbolic link to the init script in:


    ```

    /sbin/init.d/apache.

    ```


    In the SuSE default installation, Apache will serve HTML documents from the directory
    /usr/local/httpd/htdocs and CGI scripts from /usr/local/httpd/cgi-bin. If you
    installed the PHP module (mod_php), it will also execute PHP code, if the file
    ends in .php. The access log file is in /var/log/httpd/access_log the error log
    file is in /var/log/httpd/error_log. The Apache configuration resides in the subdirectory
    /etc/httpd.'
