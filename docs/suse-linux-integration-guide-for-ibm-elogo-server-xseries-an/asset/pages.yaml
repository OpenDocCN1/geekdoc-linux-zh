    To tune the default and maximum window size (only if you know what you are doing),
    enter:


    ```

    /proc/sys/net/core/rmem_default - default receive window

    /proc/sys/net/core/rmem_max - maximum receive window

    /proc/sys/net/core/wmem_default - default send window

    /proc/sys/net/core/wmem_max - maximum send window

    ```


    The Web sites offer a lot of additional helpful hints about tuning and performance
