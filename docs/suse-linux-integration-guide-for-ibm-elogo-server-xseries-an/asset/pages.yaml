    # 16.2.10 MicroliteEDGE


    By using the RecoverEDGE tools you can create emergency recovery diskettes to
    rebuild your system in the case of disaster. RecoverEDGE handles the details of
    reconstructing your FDisk, divvy, and/slice tables, rebuilding your file systems
    and restoring your data, even if your hard drive size has changed. RecoverEDGE
    uses your live system backups, so there is no need to shut down your system in
    order to protect it. You can even restore your system over the network.


    With RecoverEDGE restoring the system is very easy. To recover the system you
    should follow these tasks:


    +   1. Identify and recover the cause of the RecoverEDGE failure.

    2. Boot from the RecoverEDGE disks.

    3. Reconfigure your file systems.

    4. Restore your backups.

    5. Shut down and reboot.


    314 SuSE Linux Integration Guide for xSeries and Networking'
