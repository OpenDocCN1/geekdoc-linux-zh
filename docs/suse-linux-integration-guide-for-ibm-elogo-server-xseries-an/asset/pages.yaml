  md: '# Chapter 16. Backup and recovery


    It may seem obvious that backing up and restoring data quickly is critical, but
    many administrators leave this to the end of the "to do" list until it is too
    late. With the ease of use of the commercially available packages BRU (Enhanced
    Software Technologies), BackupEDGE/RecoverEDGE (MicroLite) or Orkeia (Knox Software),
    there is no need to wait.


    > > Note We recommend that you do not connect tape devices to the IBM ServeRAID
    adapter. Use a separate SCSI controller for the tape devices.


    # 16.1 BRU


    BRU is a backup and restore utility with significant enhancements over other common
    utilities such as tar, cpio, volopy and dump. BRU is designed to work with most
    backup devices, including cartridge, 4mm DAT, 8mm (Exabate) and 9-track tape devices.


    BRU includes incremental backups, full backups, multivolume archives, distribution
    and updates, error detection and recovery, random access capabilities, file comparisons,
    file overwrite protection, and increased speed over previous versions.


    # 16.1.1 Installing BRU


    Before you begin, you need to know the following:


    +   1. The device name of your tape drive. Typically under SuSE Linux this will
    be /dev/st0 for the rewinding and /dev/nst0 for the non-rewinding drive.

    2. The size of your backup medium in megabytes.


    To install BRU from the floppy drive with the tar command, type:


    ```

    cd /tmp

    tar xvf /dev/fd0

    ./install

    ```


    Follow the prompts regarding readme files and licenses, enter your license data
    and your BRU serial number when asked to do so until you come to the following
    window:'
  merge: -1
  pgno: 292
- img_proc: true
  md: '![](img/85b06e2bfb0156a5e744cfac214d4788_293_0.png)


    Enter the letter for your backup device and answer the following questions

    appropriate for your device.


    ![](img/85b06e2bfb0156a5e744cfac214d4788_293_1.png)


    280 SuSE Linux Integration Guide for xSeries and Netinity'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'If you have entered information for all your backup devices, you will be asked
    if you would like to install the X11 interface. Select Y.


    The installation program needs to create an xbru directory. You can select a path
    or accept the default /usr/local/.


    The installation program will install executables in a user-specified directory.
    The default is /usr/local/bin.


    Note

    The key configuration file is /etc/brutat. Consult the BRU User''s Guide for advanced
    information. Do not edit unless you know what you are doing.


    BRU is now installed.


    # 16.1.2 Basic commands


    The basic command structure for BRU is:


    ```

    # bru modes [control options] [selection options] [files]

    ```


    Where bru is the command or program followed by the mode specifying backup, restore,
    or various queries. Control options specify which files or directories to work.
    Files is the specified target of the bru command.


    # 16.1.3 Basic backup


    To back up a single file /home/ayne/.profile:


    ```

    # bru -c -vvvv -G /home/ayne/.profile

    ```


    To back up the complete directory /home/ayne/


    ```

    # bru -c -vvvv -G /home/ayne

    ```


    To back up the entire system:


    ```

    # bru -c -vvvv -G /

    ```


    # 16.1.4 Basic restore


    To restore a single file /home/ayne/ayne/.profile:


    ```

    # bru -x -vvvv -ua -w /home/ayne/.profile

    ```


    To restore the complete directory /home/ayne/'
  merge: -1
  pgno: 294
- img_proc: true
  md: '```

    # bru -x -vvvv -ua -w /home/ayme

    ```


    To restore the entire system:


    ```

    # bru -x -vvvv -ua -w /

    ```


    # 16.1.5 Basic verification and listing commands


    The -i mode can be used in conjunction with a backup command or by itself. The
    -i mode reads each block of data and verifies the checksum of the block. If used
    with the verbosity options (-vvv), BRU will give a complete listing of the contents
    of an archive.


    The -g mode displays the archive header block, which contains detailed information
    on the archive including the command used to create the archive. See the BRU User''s
    Guide for more information.


    The -gg mode displays the contents of the on-tape directory. This mode can only
    be used if the archive was created with the -g option.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# 16.1.6 X Interface


    To use BRU''s interface, you will need to be in an X-Windows environment.

    Type:


    ![](img/85b06e2bfb0156a5e744cfac214d4788_296_0.png)


    Figure 230. XBRU window


    You will see a window similar to Figure 230.


    From this interface you can:


    +   * Create and restore backups.

    * Create save, and load backup definitions.

    * Schedule backups.

    * List and verify the contents of archives.

    * View the BRU log.


    # 16.1.7 The big buttons in BRU


    The three main buttons (Full, Level 1, and Level 2) are shortcuts to various

    levels of backing up your system, directories, or individual files.


    +   * Select **Full** to back up all the files in the user''s home directory,
    or if the

    user is root, the entire system.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '+   * Select Level 1 to execute a backup for the same files as listed above,
    on the condition that files have been modified since the previous backup.

    If no previous backup has been done, this will be considered a full backup.


    +   * Select Level 2 to execute a backup for the same files as listed above, on
    the condition that files have been modified since the previous level 1 backup.
    If no previous level 1 backup has been done, this will be considered a level 1
    backup.


    #  16.1.8 Creating archives


    Creating archives with BRU''s X interface is simple. Click the Backup button to
    bring up the Backup File Selection interface (Figure 231).


    ![](img/85b06e2bfb0156a5e744cfac214d4788_297_0.png)


    Figure 231. Creating an archive


    The box on the left displays the contents of the current directory (CD): You can
    change the current directory by editing the CD entry. Then press Enter.


    You can add or remove files and directories from the backup list by selecting
    them and clicking the appropriate button.'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'BRU also provides a search function. Click the Search button to bring up a
    dialog box prompting for a search string. This string can contain typical wildcards.


    Backup Definitions are a way to define a set of commonly used backup options or
    preferences for use at a future time. You can create definitions for use with
    the backup scheduler or simply use the default selections.


    After you have selected the files and directories you wish to back up, you can
    click the Options button. In this dialog (Figure 232) you can set your preferences
    regarding different options. After you have made your decisions, click the Close
    button to return to the previous dialog. To start the backup click the Start Backup
    button.


    ![](img/85b06e2bfb0156a5e744cfac214d4788_298_0.png)


    Figure 232. Dialog for backup options


    Enter in the next dialog, click Enter Archive Label and enter text to identify
    your archive. Click Create Backup to proceed.


    The backup will inform you of how many directories/files and which amount of data
    will be backed up. During backup, you see a window, informing you about the progress
    and the actual action. When the backup process has finished, click Done to return
    to XBRU''s main dialog.


    Chapter 16. Backup and recovery 285'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# 16.1.9 Scheduling


    To access the scheduling feature, go to File>Scheduler on the menu.


    ![](img/85b06e2bfb0156a5e744cfac214d4788_299_0.png)


    Figure 233: Scheduler


    BRU provides a scheduling utility to automate the backup process for the busy
    administrator. There are three predefined definitions: Full, Level 1, and Level
    2. These are the same definitions used in 16.1.7, "The big buttons on BRU" on
    page 283. You can create your own definitions in the Creating Archives interface.


    From the BRU for X11 Scheduler interface, you can set scheduled backups based
    on weekly, monthly, or single dates. The scheduler is very flexible. In order
    to take advantage of the scheduling options, you must save your desired scheduling
    configuration and verify that the scheduler is being run from cron. To add the
    cron entry, log in as root and type:


    ```

    crontab -e

    ```


    Insert the following line:


    ```

    0/5 * * * * /usr/local/bin/bruschedule

    SuSE Linux Integration Guide for xSeries and Netfinity

    ```'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'If you chose a different path for the binaries during installation, change
    the entry accordingly.


    Save the crontab entry. You can now schedule backups.


    # 16.1.10 Restoring files


    Restoring files with BRU''s interface is simple. BRU will retrieve the contents
    of the archive when you click the Restore button. After scanning the archive,
    the Restore File Selection interface (similar to Figure 231) will appear.


    > > Note: If the on-tape directory is not in the archive, BRU must scan the entire
    archive to get a listing. This can be very time consuming. When creating an archive,
    use the -G option to create the on-tape directory or choose **Create On-Tape Directory**
    in XBRU''s **Options** dialog from the backup dialog.


    The box on the left displays the contents of the current directory that is stored
    on the tape. You can change the current directory by editing the **CD:** entry
    and pressing Enter.


    You can add or remove files and directories from the backup list by selecting
    them and selecting the appropriate button.


    When you have selected all of the files and directories to restore, click the
    **Restore** button. A progress window will show each file as it is restored.


    # 16.1.11 Listing and verifying archives


    For listing the contents of an archive, BRU gives you three options:


    +   - Header - This option shows the archive header record, which lists the label,
    creation date, version, and serial number. For more information on the header,
    consult the **BRU User''s Guide**.


    +   - Filenames - This option displays the on-tape directory. If the archive was
    created without using the -G option, BRU will scan the entire archive to create
    a list of files. You will be prompted before this occurs, as this can be a lengthy
    process.


    +   - Full details - This option scans the entire archive for details such as
    file names, permissions, owners, size, modification times, etc. This process can
    be time consuming.'
