  md: '# Chapter 5. DNS - Domain Name System


    If you connect two or more computers to a network, they can share information
    and resources. However, these computers need to "talk in the same language" to
    be able to establish a connection. This "language" is called a network protocol.
    Today, the most popular communication protocol is TCP/IP. This is the protocol
    that is used on the Internet and in many local area networks.


    Hosts in a TCP/IP network communicate with each other by using unique IP addresses.
    These addresses consist of four 8-bit numbers (octets) that are divided by dots.
    For example, host A has the address 192.168.99.1, while host B uses 122.68.25.9.


    However, this addressing scheme is not very comprehensible to human beings and
    is almost impossible to remember the number of hosts by their IP addresses. Therefore
    a naming scheme has been invented.


    Each host has a host name (for example fred) and belongs to a certain domain (for
    example snake-oil.com). Domains can be organized in a hierarchical fashion and
    consist of several subdomains (for example marketing.snake-oil.com). The combination
    of a host name and its domain name is a fully qualified domain name (FQDN) for
    example fred.management.snake-oil.com. Since domains are hierarchical, it is possible
    to have more hosts with the same host name in different subdomains. Therefore,
    fred.management.snake-oil.com can be a different host from the Internet, you need
    to register your domain with a central registry. There are several top-level domains,
    such as .com,.org or .net. In addition to these generic top-level domains, each
    country in the world has its own country code as the top-level domain. For example,
    Germany has .de, and Finland uses .fi.


    Since the hosts still use their IP addresses to communicate, there needs to be
    a mapping between host names and the corresponding IP address. There are two ways
    this can be implemented.


    All hosts of a network, including their IP addresses, are put into a static text
    file. This file has to be copied on each host that wants to communicate with the
    others by name. As soon as a host has been added or removed from the network,
    or an IP address or host name has changed, the host files on all computers have
    to be adjusted accordingly. If the number of hosts is large,'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'This is where the Domain Name System (DNS) comes in. The following description
    of DNS is very simplified, but it should give you a rough picture of what DNS
    is all about.


    Instead of maintaining a separate host file on each machine, there is a central
    server that carries a list of all hosts and IP addresses of its domain. All clients
    now send their host resolution request to this central server instead of looking
    in a local table. The name server will look up the requested host and return the
    respective IP address. The opposite is also possible: the client can also ask
    for a host name that belongs to a certain IP address. If a client asks for an
    IP address of another, the local domain name server will forward the request to
    the next name server above in its hierarchy, if it cannot answer the request by
    itself. Therefore changes to the table of host names have to be made at one central
    point only rather than on all participants of the network.


    ![](img/85b06e2bfb0156a5e744cfac214d4788_197_0.png)


    Figure 168. Internet domain hierarchy


    This chapter describes how to set up a name server for a local domain and how
    to maintain a host list for this domain.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# 5.1 Installation of software


    The server that will be the DNS server needs to have a working TCP/IP connection
    to the other hosts in its network before we start. The program that is responsible
    for this service is called bind and belongs to the software package bind, which
    is maintained by Paul Vixie for the Internet Software Consortium. There are two
    major versions of bind4 and bind8. We will focus on the new version bind8, because
    it is more secure and is designed to replace bind4 in the future. Most Linux distributions
    already contain a compiled and preconfigured package for bind8.


    > Note

    The package bind8 has been split into two separate packages in SuSE Linux 7.0:
    bind8, which contains the actual server program, and bindutil, which contains
    the utilities such as nslookup, dig. We recommend you install both on the server.
    A client machine only needs the bindutil package.


    Make sure that the bind package is actually installed. In SuSE Linux, you can
    use the rpm manager to query the database of installed packages by entering the
    following command:


    ```

    rpm -q bind8

    ```


    If the package is already installed, RPM will return the version and build number
    of this package:


    ```

    bind8-0.2.3-34

    ```


    If it is not installed, you will receive the following message:


    ```

    package bind8 is not installed

    ```


    You will then have to install this package first. Please refer to 3.1, “Adding
    and removing software packages using YaST ” on page 111 for how to install software
    packages. The package bind8 is located in series - Network-Support (TCP/IP, UUOCP,
    Mail, News). Quit YaST to return to the command line after installing the package.


    # 5.2 DNS sample configuration


    Configuring DNS can be very complex, depending on the intended functionality.
    Covering this in depth is beyond the scope of this chapter. We'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'will therefore focus on a simplified example and recommend that you take a
    look at the very informative DNS-how at:


    http://www.linuxdoc.org/HOWTO/DNS-HOWTO.html


    or at /usr/share/dochow/en/DNS-HOWTO.gz on your local file system for further
    information on DNS and bind.


    We begin with a simple example. At first the local DNS will be configured to act
    as a caching-only name server. This means that it forwards all requests to the
    ISP’s name server (forwarders) and caches all requests from its clients. This
    reduces the network traffic on the outside world.


    Put the following lines in the /etc/resolve.conf file:


    ```

    search snake-oil.com

    nameserver 127.0.0.1

    ```


    This will make sure that the server itself will use its local name server for
    host resolution.


    In SuSE Linux, you can use YaST to modify this entry. Choose System administration
    -> Network configuration -> Configuration nameserver. Enter the IP address 127.0.0.1
    and your domain. To enter this directly from the command line, enter the following
    command:


    ```

    yast --mask nameserver --autoexit

    ```


    The name server’s main configuration file is /etc/named.conf. Most distributions
    ship with a very detailed example configuration file; you might want to save this
