  md: '# 8.7 How packets travel through a gateway


    In this section we will explain how IP Chains work. You can see the path of a
    packet coming into your server in Figure 188.


    ![](img/85b06e2bfb0156a5e744cfac214d4788_229_0.png)


    Figure 188. How the packet travels


    Here are short descriptions of each stage:


    +   - Checksum - this is to test if the packet is corrupted or not.

    - Sanity - Malformed packets are denied here.

    - Input chain - this is the first real packet checking point. Packets can be rejected,
    denied or accepted.

    - Demasquerade - If the packet is a reply to a previously masqueraded packet,
    it is demasqueraded and goes directly from here to the output chain.

    - Routing decision - Routing code decides if this packet is for a local process
    or should be forwarded to a remote machine.

    - Local process - a process running on the server can receive packets after a
    routing decision step, and then send the packets, which go through a routing decision
    step and then to the output chain.

    - lo interface - if packets from a local process are destined for another local
    process, they will go through the output chain with interface set to "lo", and
    will return to the input chain with interface "lo". The "lo" interface is usually
    called the loopback interface.


    216 SuSE Linux Integration Guide for xSeries and Netfinity'
  merge: -1
  pgno: 229
- img_proc: true
  md: '+   * Local - if the packet is not created by the local process, then the forward
    chain is checked.


    +   * Forward chain - this is the checkpoint for all packets passing through this
    server to another.


    +   * Output chain - this is a checkpoint for all packets just before they are
    sent out.


    As you can see from Figure 188, you have three places where you can check the
    packets in your server:


    +   a. Input chain


    +   b. Forward chain


    +   c. Output chain


    With the `/sbin/ipchains` command you can set up your rules for packet checking.


    > Note

    By default, all checking policies are set to Accept. This means that all packets
    can come in, go through or go out from your server without any restrictions.


    You can see the current checking policies by executing:


    ```

    /sbin/ipchains -L

    ```


    You will see a window similar to Figure 189.


    Figure 189. Listing the default IP Chains policies


    # 8.8 Using IP Chains


    With the `/sbin/ipchains` command, you can create, change or delete your own policies
    for checking packets or you can modify built-in policies. You cannot delete the
    built-in chains, but you can append your rules to the existing chains or even
    create your own chains.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'To manage whole chains you can use the parameters described in Table 17.


    Table 17. Parameters for managing whole chains


    | Parameter | Description |

    | - | - |

    | -N | Create a new chain |

    | -X | Delete an empty chain |

    | -P | Change policy for a built-in chain |

    | -L | List the rules in a chain |

    | -F | Flush the rules out of a chain |

    | -Z | Zero the packets and byte counters on all rules in a chain |


    For manipulating rules inside the chain you can use the parameters explained in
    Table 18.


    Table 18. Parameters for managing rules in the chain


    | Parameter | Description |

    | - | - |

    | -A | Append new rule to a chain |

    | -I | Insert a new rule in a chain at some position |

    | -R | Replace a rule at some position in a chain |

    | -D | Delete a rule at some position in a chain |


    And there are more operations for managing masquerading. They are described in
    Table 19.


    Table 19. Parameters for managing masquerading


    | Parameter | Description |

    | - | - |

    | -M -L | List the currently masqueraded connections |

    | -M -S | Set masquerading timeout values |


    # 8.8.1 How to create a rule


    The most common syntax for creating a new rule is:


    ```

    /sbin/ipchains -A input -s source -p protocol -j action

    ```'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'The parameters are described in Table 20.


    Table 20. IP Chains parameters

    | Parameter | Description |

    |---|---|

    | -A | Append a new rule to the chain |

    | source | IP address or host name of which one rule is applied |\| protocol |
    Type of the protocol to which one rule is applied |

    | action | What will happen with the packet:

    1) ACCEPT - packet will be accepted

    2) REJECT - packet will be rejected

    3) DENY - packet is dropped since it was not received

    4) MASQUADE - packet will be masqueraded

    5) REDIRECT - packet is redirected to local port

    6) RETURN - fall off the chain immediately |


    > Note

    Redirecting packets to a local port using the REDIRECT action makes sense only
    in combination with masquerading for a transparent proxy server.


    For example, if you want to create a rule for denying the ICMP protocol packets,
    which are used when you execute the ping command, for a specific IP address you
    will do this by executing the command:


    ```

    /sbin/ipchains -A input -s IP_address -p icmp -j DENY

    ```


    If you omit the protocol definition, all the packets will be denied. For example
    if you want to block the access to your machine from the network 172.168.1.0 with
    subnet mask 255.255.255.0 you can do this by executing the command:


    ```

    /sbin/ipchains -A input -s 172.168.1.0/255.255.255.0 -j DENY

    ```


    or with:


    ```

    /sbin/ipchains -A input -s 172.168.1.0/24 -j DENY

    ```


    As you can see, the subnet mask can be specified with the number of bits for that
    mask.


    The command for not allowing any traffic from your server to the network 172.168.1.0
    with subnet mask 255.255.255.0 will look like this:


    ```

    /sbin/ipchains -A output -d 172.168.1.0/24 -j DENY

    ```


    Chapter 8. Packet filtering with IP Chains 219'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'Here we used the -d parameter for specifying the destination address.


    # 8.8.1.1 Using the inversion flag


    With some of the flags, you can use the inversion option "I". This means that
    the rule will be applied to everything except the parameters specified after "I".
    For example, if you want to deny packets from all IP addresses except from network
    192.168.1.0 with subnet mask 255.255.255.0 you can do this by executing the command:


    ```

    /sbin/ipchains -A input -s ! 192.168.1.0/24 -j DENY

    ```


    > Note

    The rules you make are not permanent, next time you restart the server they will
    be lost.


    # 8.8.2 Making the rules permanent


    For making the rules permanent you have two scripts available that can make your
    life easier. To save all the rules you created, you can execute the command:


    ```

    /sbin/ipchains-save > filename

    ```


    If you execute this command without a file name, the rules will be sent to the
    standard output.


    You can then restore the saved rules by executing the command:


    ```

    cat filename | /sbin/ipchains-restore

    ```


    So if you want your saved rules to be enabled whenever you start your system,
    add the following line to the /etc/rc.d/rc.local file:


    ```

    cat filename | /sbin/ipchains-restore

    ```


    # 8.9 Sources of additional information


    You can find more information on the official Linux Firewall Chains page at:


    ```

    http://www.rustcorp.com/linux/ipchains

    ```


    And there are always good how-to documents on the Linux Documentation Project
    home page:


    ```

    http://www.linuxdoc.org/

    ```'
