    allows Linux to "swap out" unused memory segments from main memory to the hard
    drive, creating more available, faster main memory. The recommended size of a
    swap partition is between the amount of system memory you have and 1.5 times the
    amount of system memory you have. If you envisage your system using more swap
    space, then increase this value. We recommend buying more RAM to suit your memory
    needs rather than relying on swap memory to provide memory to the system, as swap
    space is nowhere near as fast as main memory.'
