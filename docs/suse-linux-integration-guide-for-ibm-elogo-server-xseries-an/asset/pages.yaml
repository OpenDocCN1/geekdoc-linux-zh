  md: '# # Chapter 15. Setting up a Beowulf cluster


    For a long time, parallel computing has been a domain of commercial vendors. By
    using Linux, it is now possible to create a powerful supercomputer using regular
    PCs with off-the-shelf components that are networked together with fast Ethernet
    or by using special high-speed interconnections like SCI or Myrinet. Beowulf clusters
    offer higher performing computing at a fraction of the cost of a regular parallel
    computer (the price/performance ratio is usually between three and ten times better
    than for a "regular" supercomputer).


    Beowulf was the Scyld of the Scandian lands, a character one of the oldest English
    poems. The legend tells that he defeated a monster Grendel (see http://legends.dm.net/beowulf/index.html
    and http://www.lnistar.com/literature/beowulf/beowulf.html for historical background).


    The first Beowulf cluster was set up by Donald Becker and Tom Sterling at the
    NASA Goddard Flight Center in 1994. Don Becker is also well known in the Linux
    community for his work on network drivers in the Linux kernel.


    To make use of the parallelism, your software needs to be distributable between
    the nodes of a cluster. One way is to use libraries as PVM (Parallel Virtual Machine)
    or LAM/MPI (Local Area Metacomputer/Message Passing Interface). Regular programs
    are not suitable for distributed computing. There is now a special load-sharing
    software called MOSIX, which allows transparent process migration in a cluster.
    MOSIX requires a special patched Linux kernel and will not be covered.


    This chapter focuses on how to set up PVM and how to demonstrate the parallel
    computing using a special version of the famous raytracing software POVray, called
    PVPOVray. Raytracing is a method to create realistic images of a scene that is
    only described by coordinates, light sources, textures, and surface properties
    such as reflectivity or opacity. The raytracer computes the reflections, shadows,
    and refractions of all light rays in the picture and generates the realistic image
    of this scene. Further information about POVray can be found on the POVray Web
    site at


    http://povray.org.


    To set up a simple Beowulf cluster, you need at least two PCs running Linux and
    a functional TCP/IP network connection between them. Regular Ethernet is fine
    for starters; however, it does not offer the best performance, since it'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'has a high latency, which is crucial if you run applications that need to communicate
    at lot nodes. Pv needs to be installed on all these machines as well. XPVM is
    a useful tool to monitor the communication and setup of the virtual machine, if
    the number of nodes is not too high (approximately 20-30). XPVM only needs to
    be installed on the master server.


    When SuSE Linux, make sure that the following packages are installed on all machines
    in the cluster. These packages can be found in the "beo" series:


    +   - pvm

    - povray

    - pmpov


    One machine acts as the master node that distributes jobs to the "save" nodes.
    They should share a common work directory (NFS) and it should be possible to run
    a remote shell rah from each node to another without being prompted for a password
    edit the /hosts file in the home directory of the user who wants to spawn jobs
    on remote machines. Start the PvVM console using pvm on the command line. At the
    PvVM prompt pvm, use the command add Hostname to add your virtual machine. PvVM
    now attempts to start the PvVM daemon process on the remote machine using rah.
    If this fails, have a look at the log on the remote machine. The command conf
    gives you a list of all nodes in your cluster that have successfully been added
    to PvVM. Use quit to return to the shell. Alternatively, you can create a file
    that contains the names of all hosts that you want to run for your cluster (one
    on each line) and run pvm postfile. This will automatically add all these hosts
    to the virtual machine. This is basically all you need to set up a Beowulf cluster.
    You now need to have a program that has been written using the PvVM library. One
    example here is PPMOVRAY.


    To run PvVM, you first have to set the following environment variable:


    ```

    export XPVM_ROOT=/usr/X11r/lib/xpvm/

    ```


    Now you can start xppm by typing xppm in a terminal window. Add the other nodes
    by clicking Hosts... -> Other Hosts.. An icon should appear for each host that
    has been successfully added to the virtual machine. Click Tasks... -> SPAWN to
    start the distribution of a job. To give a demonstration, spawn the following
    command:


    276 SuSE Linux Integration Guide for xSeries and Netfinity'
