    ```


    The parameters are described in Table 12.


    Table 12. Security parameters


    | Parameter | Description |


    | security | This parameter has four possible values: share, user, server, domain
    |


    | password server | In the case of server of domain security level this server
    is used for authorization. For the parameter you can use the server NetBIOS name
    or an IP address. |


    | encrypt passwords | By setting this parameter to yes, you enable Samba to use
    the Encrypted Password Protocol, which is used in Windows NT Service Pack 3 and
    in Windows 98. This is needed to communicate with those clients. |


    The default location of the Samba password file is /etc/smbpasswd.


    The security modes are as follows:


    +   - Share - for this security mode, clients only need to supply the password
    for the resource. This mode of security is the default for Windows 95 file/print
    server. It is not recommended for use in UNIX environments, because it violates
    the UNIX security scheme.


    +   - User - the user/password validation is done on the server that is offering
    the resource. This mode is most widely used.


    +   - Server - the user/password validation is done on the specified authentication
    server. This server can be a Windows NT server or another Samba server.


    158 SuSE Linux Integration Guide for xSeries and Netfinity'
  merge: -1
  pgno: 171
- img_proc: true
  md: '- Domain - this level is basically the same as the server security level, with
    the exception that the Samba server becomes a member of a Windows NT domain. In
    this case the Samba server can also participate in such things as trust relationships.


    Because Windows NT 4.0 Service Pack 3 or later, Windows 95 and Windows 98 with
    the latest patches, and use the encrypted passwords for accessing NetBIOS resources,
    you need to enable the Samba server to use the encrypted passwords. Before you
    start the Samba server for the first time, you need to create a Samba encrypted
    passwords file. This can be done with the mksmbpasswd utility. The recommended
    way is to first create the user accounts in Linux and then create the Samba password
    file with the command:


    ```

    ```\acat /etc/passwd | sh /usr/lib/samba/scripts/mksmbpasswd.sh >

    /etc/smbpasswd

    ```

    ```


    This creates the Samba password file from the Linux password file.


    > > Note

    By default passwords for the Samba users are undefined. Before any connection
    is made to the Samba server, users need to create their passwords.


    Now you need to specify the password for all users. If you are changing or specifying
    a password for a user, you can do this by executing the command:


    ```

    /usr/bin/smbpasswd -U username

    ```


    You will see a window similar to Figure 150.


    [root@5500]# # /usr/bin/smbpasswd -U user

    New SMB password:

    Retype new SMB password:

    Password changed for user user.

    [root@5500]# # ]


    Figure 150. Specifying the password for Samba


    Another way is to have each Samba user change the password for himself, by remotely
    connecting to the Samba server and executing the command:


    ```

    ```

    usr/bin/smbpasswd

    ```

    ```


    Chapter 4. Samba 159'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'The output will be similar to Figure 15. If a Samba user already has defined
    a password they will need to type the old password before they can change to a
    new password.


    If you want to add another user to the Samba server user later, it can be done
    with the following command:


    ```

    /usr/sbin/smbpasswd -a username password

    ```


    This will add a new user to the Samba password file.


    > Note

    You have to be logged on as root if you want to manage other users. If you are
    logged on as a user, you can only change your own password. smbpasswd utility
    uses the location of the password file from the smb.conf file.


    # 4.2.1.4 Global name resolution settings


    In your smb.conf file you will see something similar to this:


    ```

    wins support = yes

    wins server = w.x.y.z

    ```


    The parameters are described in Table 13.


    | Parameter | Description |

    | --- | --- |

    | wins support | If this option is enabled the Samba server will also act as a
    WINS server. |

    | wins server | With this parameter you tell Samba which WINS server to use. |


    > Note

    amba can act as a WINS server or a WINS client, but not both. Only one of the
    parameters (wins support or wins server) can be set at the same time. If you specify
    the IP address of WINS server, then wins support must be set to no.


    # 4.2.1.5 Creating shares


    In the previous section we explained how to prepare general configuration parameters.
    But a Samba server is only of use if you offer resources to users.'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'In this section we will explain how to create a share. The simple share section
    in the smb.conf file looks similar to this:


    ```

    [redbook]

    comment = Redbook files

    path = /redbook

    browseable = yes

    printable = yes

    write list = @users

    ```


    Table 14 describes the most important parameters for creating a share.


    | Parameter | Description |

    | --- | --- |

    | comment | This describes the function of the share. |

    | admin users | This parameter is used to specify the users who have administrative
    privileges for the share. When they access the share they perform all operations
    as root. |

    | path | Defines the full path to the directory you are sharing. |

    | browseable | If this parameter is set to yes, you can see the share when you
    are browsing the resources on the Samba server. The value can be yes or no. |

    | printable | This parameter specifies if the share is a print share. The value
    can be yes or no. |

    | write list | Users specified in this list have write access to the share. If
    the name begins with @ it means a group name. |

    | writable | This parameter specifies if the share is writable. The value can
    be yes or no. |

    | read list | Users specified in this list have read access to the share. If the
    name begins with it means a group name. |

    | read only | If this is set to yes, share is read only. The value can be yes
    or no. |

    | valid users | This parameter specifies which users can access the share. |


    By using these parameters you can easily set up a new share. Each share definition
    starts with the share name in brackets "[]". Below this name you can specify the
    values for the share parameters.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# ### 4.2.1.6 Share permissions


    Although you can control the share permissions with share parameters, UNIX permissions
    are applied before the user can access files on the share. So you need to take
    care of UNIX permissions, so the user also has access to shared directory under
    UNIX.


    When a user creates a new file on the shared directory, the default create mask
    used is 0744. For directory creation, the default create mask is 0755. If you
    want, you can force a creation mask. The parameters for doing are explained in
    Table 15.


    Table 15. Create mask parameters


    | Parameter | Description |

    | --- | --- |

    | create mask | This is used for file creation against UNIX mask calculated from
    the DOS mode requested. |

    | directory mask | This is used for directory creation against UNIX mask calculated
    from the DOS mode requested. |


    # ### 4.2.1.7 Creating shares for home directories


    For handling directories Samba has a special share section called [homes]. This
    share definition is used for all home directories, so you do not need to create
    separate shares for each user.


    When a client requests a connection to a file share, existing shares are scanned.
    If a match is found, that share is used. If no match is found, the requested share
    is treated as a user name and validated by security. If the name exists and the
    password is correct, that the home share definition uses the parameters as a normal
    share definition. The following is an example of a home share definition in the
    smb.conf configuration file:


    ```

    ```

    [homes]

    comment = Home Directories

    path = $%nvalid users = $

    browseable = no

    writable = yes

    create mode = 0700

    directory mode = 0700

    ```

    ```'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'As you can see, we used variables in this definition, which are explained in
    Table 16.


    # Table 16. Variable description


    | Parameter | Description |

    |---|---|

    | %H | This variable represents the home directory of the user. |

    | %S | The name of the current service, which is, in the case of home shares,
    equal to username. |


    As you can see in this example, we used creation masks for the files and the directories
    in such a way that we forced all new files or directories to be accessible only
    by the owner of the directory.


    # 4.2.1 Creating a printer share


    A Samba server uses the same procedure for printer shares as user names are tested
    against the requested share name and the matched definition is not found, Samba
    searches for a printer with that name (if the [printers] section exists). If the
    match is found in the printer definitions, that [printers] share section is cloned
    with the name of the requested service, which is really a printer name. The following
    is an example of the printers definition in the smb.conf configuration:


    ```

    [printers]

    comment = All Printers

    path = /var/spool/samba

    browable = no

    # Set public = yes to allow user ''guest account'' to print

    guest ok = no

    writable = no

    printable = yes

    create mask = 0700

    ```


    As you can see, the [printers] section is just another share definition, when
    a user basically copy the data into a spool directory, after that the data is
    handled by the local printing system. The only big difference between a printer
    share and other share definitions is that the printable parameter is set to "yes".
    This means that a user can write a spool file to the directory specified under
    the share definition. If the share is printable, then it is also writable by default.'
  merge: -1
  pgno: 176
- img_proc: true
  md: "# ### 4.2.2 Starting and stopping the Samba server\n\nYou can start the Samba\
    \ server by executing the command:\n\n```\n```rcsmb start\n```\n\nYou will see\
    \ output similar to the following:\n\n```\n```bash-2.04# rcmb start\nStarting\
    \ SMB services:\n```\n\nThe Samba server can be stopped by executing the command:\n\
    \n```\n```rcsmb stop\n```\n\nWhenever you make modifications to the smb.conf configuration\
    \ file, you\n restart the Samba server.\n\n# ### 4.2.3 Starting Samba as startup\
    \ service\n\nYou can configure your boot process so Samba is started at the boot.\
    \ Edit the\n/etc/rc.conf file and change START_SMB=\"no\" to START_SMB=\"yes\"\
    . Make\nyour use SUSEnfig to edit the changes.\n\n# ### 4.2.4 Using SWAT\n\nThe\
    \ Web Administration Tool (SWAT) allows the remote configuration\nof smb.conf\
    \ configuration file via a Web browser. That means you\nconfigure Samba in a GUI-like\
    \ environment. SWAT itself is a Web\nserver and CGI scripting application, designed\
    \ to run from inetd, provides\naccess to the smb.conf configuration file.\n\n\
    An authorized user with the root password can configure the smb.conf\nconfiguration\
    \ file via Web pages. SWAT also helps links to all\nconfigurable options on every\
    \ page, which lets an administrator easily\nunderstand the effect of the changes.\n\
    \nSWAT is started with a TCP wrapper, so you can control who can access the\n\
    Samba service with the /etc/hosts.deny file. For example, if you want to\naccess\
    \ SWAT locally, your /etc/hosts.deny file should look like this:\n\n```\n```\n\
    # hosts.deny      This file describes the names of the hosts which are\n#    \
    \             *not=allowed to use the local INET services, as decided\n#     \
    \            by the /usr/sbin/tcpd/ server.\n\n# The portmap line is redundant,\
    \ but it is left to remind you that\n# the new secure portmap uses hosts.deny\
    \ and hosts.allow. In particular\n# you should know that NFS uses portmap!\n```"
  merge: -1
  pgno: 177
