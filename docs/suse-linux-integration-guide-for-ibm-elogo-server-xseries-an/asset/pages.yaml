  md: 'An LDIF is the standard way of representing directory data in a textual format.
    The following is an LDIF file for loading a LDAP directory and adding a user that
    we can use for test authentication.


    ```

    dn: ou=people, dc=ibm, dc=com

    objectclass: top

    objectclass: organizationalUnit

    description: users who authenticate via the ldap server


    dn: uid=ldaptest, ou=People, dc=ibm, dc=com

    uid: ldaptest

    cn: ldaptest

    objectclass: account

    objectclass: posixAccount

    objectclass: top

    objectclass: shadowAccount

    userpassword: test123

    shadowLastChange:11263

    shadowMax:99999

    shadowWarning: 7

    loginShell: /bin/bash

    uidNumber: 500

    gidNumber: 500

    homeDirectory: /home/testldap

    ```


    Each LDAP entry must have a distinguished name (DN). The distinguished name is
    a unique key that refers to that entry specifically.


    The first group of entries is to create the root or base entries in the directory.
    In this case we are using com, ibm, and people (organizational unit).


    Within the organizational unit, people we will store the users and their corresponding
    authentication information. The second group of entries is to add the user ldaptest
    and the attributes that are necessary for authentication.


