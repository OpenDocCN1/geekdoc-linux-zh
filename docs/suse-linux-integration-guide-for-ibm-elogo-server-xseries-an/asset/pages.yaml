    # 3.3 User and group administration using YaST


    Linux is a multi-user operating system. To differentiate between the various users,
    each user has to log in with unique user name and password. Each user belongs
    to a primary user group, but they can also be a member of other groups (up to
    16 groups). Each user name is associated with a user ID (UID), which is unique
    throughout the system. The same applies to user group names and group IDs (GIDs).


    Usually each user has a personal home directory. This is space on the file system
    (usually a directory below /home, for example /home/username) that belongs to
    a person and where the person can store their personal files (for example e-mail
    or text documents). Other users generally have no access to the files stored in
    another user''s home directory.


    You should carefully consider user groups before adding users. Sometimes there
    concerns about restricting access to some parts of the user system. You can do
    this by creating separate user groups to control access to various files and filesystems.
    Also if you are going to be creating a system with many users, you should creating
    separate groups divided by what they are doing on the system. You can create an
    admin group for admins, db2user group for DB2 users, and so forth. Linux allows
    you to control access to both files and directories by users, groups, and everyone
    on the system.


    Another concern in setting up users and groups is that you may want to share files
    with other systems. This can be done by CD-ROM, tape, diskette or similar device.
    You can use the network to share information with NFS,


    118 SuSE Linux Integration Guide for xServers and Netinity'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'Samba, IPX and other network packages. If you use user and group names and
    characteristics that are not the same on all systems during the sharing, then
    you can have file sharing and access problems.


    If you are creating logins and groups on each box separately, it is often best
    to use a single system where all your IDs can be created. This system is then
    used as a reference. It is not necessary that everyone actually log into the reference
    system. It only exists to coordinate ID and group creation to prevent non-standard
    IDs and groups. A user can also not log into the reference system if the password
    is not enabled. This will prevent unauthorized access to the system. If you want
    to administer a lot of users on different machines, you should consider setting
    up NIS. See Chapter 12, "NIS - Network Information System" on page 237 or Chapter
    13, "LDAP - Lightweight Directory Access Protocol" on page 247 for more information
    about this.


    It is one of the root user''s tasks to add and remove user or group accounts.
