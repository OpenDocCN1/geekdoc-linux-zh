  md: '# Chapter 1. Introduction


    Linux is a UNIX-like open-source operating system and was the original creation
    of Linux Torvalds from Helsinki, Finland in 1991. He wrote the first kernel, the
    underlying program interfacing and running the computer hardware. Torvalds invited
    programmers from around the world to come and improve his code. This is one of
    the key ideas behind the success of Linux. With the world as your laboratory,
    the number of testers and developers is nearly endless. It is because of this
    resource that Linux is constantly evolving and improving.


    With the source code being freely available, several companies have developed
    different distributions of Linux. A distribution is a complete system. The key
    component is the Linux kernel. Other utilities, services, and various applications
    can be included as well, depending on the distribution and the intended use. There
    is no standard distribution. Each of the many distributions has unique advantages.


    IBM was early to recognize the value of Linux, Linux-related product development,
    forming alliances with key Linux distributors, contributing to the open-source
    community, and aggressively supporting the platform. IBM believes this will benefit
    its customers as they continue to exploit Linux for their IT infrastructures and
    e-business applications.


    # 1.1 The IBM commitment to Linux


    IBM is fully committed to the open source movement and believes Linux will emerge
    as a key platform for e-business. IBM will work with the open source community,
    bringing relevant technologies and experience to the table to help enhance Linux,
    to define the standards and extend Linux to the enterprise level. IBM provides
    continued support and participation in three main locations:


    +   * The Open Source Development Lab

    * IBM Development and Competency Centers for Linux

    * IBM Technology Center


    As part of this continuing commitment, IBM has teamed with leading commercial
    Linux distributors, Caldera Systems, Red Hat, SuSE, and TurboLinux to port, test,
    and certify the performance of IBM offerings on various Linux distributions, enabling
    you to exploit the full potential of Linux.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 1.2 SuSE Linux


    ![](img/85b06e2bfb0156a5e744cfac214d4788_15_0.png)


    Founded in 1992 by four German software engineers, SuSE (pronounced soo-sah) is
    the oldest major Linux solutions provider. The company''s commitment to the highest
    standards in open source software development has helped the award-winning SuSE
    Linux operating system become one of the most widely used Linux distributions
    in the world.


    Today, SuSE has an international presence, with offices in Europe, Latin America
    and the United States. SuSE Inc., the company''s subsidiary was established in
    Oakland, California in 1997 and provides solutions, technical support, Premier
    Partner programs, and sales support to customers, resellers and distributors.


    SuSE''s mission is two-fold: to make open source the global standard and to establish
    itself as the most reliable source for Linux on a worldwide basis. SuSE is a chosen
    IBM distribution partner for Linux.


    The IBM @xserver xSeries Brand team works closely with SuSE and other distribution
    partners to fully test and certify xSeries and Netfinity servers are ready to
    perform for Linux. Additionally, xSeries servers are designed with X-architecture
    technologies to bring reliability, high availability, powerful performance and
    manageability in an affordable Intel processor-based platform to meet a variety
    of customer needs and choices of operating environments.


    # 1.3 Introducing the xSeries family of servers


    IBM @xserver xSeries is the new IBM server brand. xSeries are Intel processor-based
    servers with X-architecture technology enhancements, for a level of reliability,
    performance and manageability previously out of reach for industry-standard servers.
    This represents a full circle of technology evolution for Netfinity heritage in
    X-architecture, which is based on technologies derived from the IBM ES, RS, and
    AS servers, bringing mainframe category technology to the industry-standard architecture.
    Also, NUMA-Q is aligned with xSeries to ensure IBM resources are focused most
    effectively on the Intel marketplace.


    xSeries servers are available in the following categories:


    +   - Point Solution Servers

    - Universal Servers

    - Rack Optimized Servers

    - Extremely Scalable Servers


    2 SuSE Linux Integration Guide for xSeries and Netfinity'
