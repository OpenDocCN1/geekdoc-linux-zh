    # 16.2.5 Master and incremental backups


    Usually system administrators perform so-called master and incremental backups.
    The master backup is a backup of all files on the system. Incremental backup is
    a backup of only those files that have changed since the last master backup. When
    you need to restore your data, restore the master backup and the last incremental
    backup. BackupEDGE can perform different types of incremental backups. Refer to
    the BackupEDGE manual for the explanation of them. Master and incremental backups


    To perform a backup follow these steps:


    +   1. Start the edgemenu program by executing the following command:


    ```

    edgemenu

    ```


    You will see a window similar to Figure 238 on page 293.


    +   2. Select **Backup > Master**, and you will see a window similar to Figure
    247.


