  md: '> Note

    If /etc/exports file does not exist or is empty, the NFS daemons will not start.
    Information on setting up the /etc/exports file is in 11.2, "Allowing NFS access
    to data" on page 233.


    To stop the NFS server, use the command:


    ```

    rcfnsserver stop

    ```


    You can restart the NFS process with the command:


    ```

    rcfnsserver restart

    ```


    This can also be used to restart the NFS process if you have made changes to the
    configuration files.


    # 11.2 Allowing NFS access to data


    You can give NFS access to a file system by setting it up in the /etc/exports
    file. The file is set up on the exporting server. You can create a sample file
    by opening the /etc/exports file. Then you can add an entry like:

    /usr/local/share myserver.mydomain.com(ro)


    This says that the directory /usr/local/share is only accessible to the server
    myserver.mydomain.com.


    > Note

    When exporting a file system you need to be sure that the exporting server can
    recognize and access the server that is in the /etc/exports file. You can verify
    this with this command:

    ping server_name


    Where server_name is the name of the server you are trying to access. Otherwise,
    the NFS commands may hang.


    There are a number of options you can set up in the /etc/exports file. Some of
    them are listed in Table 21.


    You need to be sure that the exporting server can recognize the server name.'
