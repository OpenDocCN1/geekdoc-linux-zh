    # 14.1.2 Services


    You should disable all unused daemons, especially network-related services. This
    has several advantages: fewer services need fewer system resources (file descriptors,
    memory) and the system is less vulnerable to external attacks against known security
    holes. A good starting point is the /etc/inetd.conf file. Comment out all services
    you do not need, or disable inetd completely. This can also be done using Yast2.


    The Linux /proc filesystem offers a lot of entries for run-time optimization without
    recompiling the kernel. This directory does not physically exist on your hard
    drive; it is mapped as a virtual directory. Most of the files contained are readable
    and contain various system information. Other files can be edited with a regular
    text editor to set a kernel parameter. See /usr/src/linux/Documentation/sysctl/README
    in Linux kernel sources for


    Chapter 14. General performance tools in Linux 261'
