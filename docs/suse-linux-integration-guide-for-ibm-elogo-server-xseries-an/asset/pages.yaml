  md: 'c - refers to files in the /dev directory. This signifies the file represents
    a character device.


    b - refers to files in the /dev directory. This signifies the file represents
    a block device.


    rwx - In this case it allows only the owner of the file (in this case linux) to
    read, write and execute this file.


    | Type | Owner | Group | World |

    |---|---|---|--|

    | rwx | --- | --- | --- |


    As you can see, the format of the string is becoming a bit easier to understand.


    The owner of the file is the user who created the file. The group part is the
    group that owns the file (for example, the group users). The world part means
    everyone else. Setting a permission in the world part sets the permission for
    every user, irrelevant of their group membership and so on.


    Here is another example:


    ```

    rwx-xr--

    ```


    This means that this is a normal file, the owner can read, write and execute the
    file, the group can read and execute the file, and everyone else can read the
    file, but not modify or execute it.


    As for directories, if you set a directory as:


    ```

    drwxr-xr-x

    ```


    you are saying that only the directory owner is allowed to execute something “inside”
    the directory. So if another user tries to change directory (cd) into this directory,
    they will get a "permission denied" error message. This is exactly what happens
    with regards to user''s home directories.


    To change the permissions on a file, you use the chmod command. Only root users
    can modify files that do not belong to them. You must own the file to be able
    to change its permissions.


    The easiest way to change permissions is to use symbolic representations of what
    you want permissions to be.


    152 SuSE Linux Integration Guide for xSeries and Netinity'
  merge: -1
  pgno: 165
- img_proc: true
  md: '> The other way to represent file permissions is to use octals. For more information
    about this and the chmod command see the chmod man page.


    ```

    chmod g+rw myfile

    ```


    This is one of the simplest ways of changing a permission. You are saying that
    you want the myfile to allow all members of the group to be able to read and write
    to it.


    If you used a - (minus sign) instead of a plus, you would be taking away those
    permissions. This would mean that members of the group would not be allowed to
    read or write to the file.


    You can mix adding and removing permissions in the same command:


    ```

    chmod u+x-rw myfile

    ```


    This will allow executing the file, but will not allow reading or writing the
    file for the file owner.


    Here is a summary of the symbolic representations available in chmod:


    +   - r - read

    - w - write

    - x - execute

    - - take away the permissions

    - + - add the permissions

    - s - set the SUID bit. This says that if the file is executable, it will be run
    as the owner of the file, not as the user that is running the file.'
  merge: -1
