  md: '# 2.3.5 LILO - the Linux Loader


    LILO INSTALLATION:

    LILO (the Linux Loader) allows you to boot Linux from a hard disk. To configure
    LILO, fill in the following fields. Then, create and edit your boot configurations.
    The first boot configuration will be booted automatically after the boot delay.
    You must create at least one boot configuration (using F4). After that, you can
    commit your configuration by pressing <CONTINUE> and LILO will be installed.


    Append-line for hardware parameter


    | Where do you want to install LILO | Master boot record |

    | :--- | :--- |

    | Boot delay | Boot sector of the root partition |

    | :10: | Boot sector of the /boot partition |

    | | Dn floppy disk |


    The boot configurations are currently available


    | F1-Help | F4-New Config | F5-Edit Config | F6-Delete Config |

    | :--- | :--- | :--- | :--- |

    | < Continue > | < Abort > |


    ![](img/85b06e2bfb0156a5e744cfac214d4788_47_0.png)


    LILO, the Linux Loader, is a boot manager that allows you to boot multiple operating
    systems that can reside on different hard disk partitions or even on different
    hard disks. Even if you only have Linux installed, you still need to create a
    boot configuration for LILO. Linux cannot be booted with LILO.


    For an exhaustive explanation of LILO and boot concepts, see Chapter 4, “Booting
    and boot managers: LILO, loading, etc.” in the SuSE manual.


    Figure 31 shows YaST''s LILO main configuration window. You can stick with these
    default values. However, you might want to decrease the boot delay from 10 seconds
    (default) to a lower value to save time during the system startup. By default,
    LILO will be written to the master boot record of your primary hard disk. Alternatively,
    you can write it to a floppy disk, which has to be inserted during the system
    boot.


    Press F4 to create a new boot configuration.'
