  md: '# Chapter 9. DHCP - Dynamic Host Configuration Protocol


    With the ever-decreasing number of IP addresses available, along with the headache
    of maintaining static IPs, DHCP has become a necessity in most TCP/IP computing
    environments.


    # 9.1 What is DHCP?


    DHCP stands for Dynamic Host Configuration Protocol. When using TCP/IP, a computer
    system needs a unique IP address to communicate with other computer systems. Without
    DHCP, the IP address must be entered manually at each computer system. DHCP lets
    network administrators distribute addresses from a central location without having
    to manage each individual address.


    With DHCP, IP addresses are distributed through pools broken up by subnet. Addresses
    are given for a specific time period for each address. The process of managing
    leases is all done by the DHCP server. Once a lease has expired the DHCP server
    will contact the client or the client will contact the server to renew the lease.
    If the server cannot contact the client, the IP address is returned to the pool
    and available for the next client in need of an address.


    # 9.2 Why should I use DHCP?


    In the past, for every device on a network you had to have a static IP address.
    With the increasing number of computers accessing the Internet, the pool of available
    addresses is quickly diminishing. Network administrators can significantly reduce
    the number of IP addresses they need using DHCP.


    Even with smaller networks, keeping track of individual IP addresses can be maintenance
    intensive. With DHCP, the server does all of the maintenance, mapping IP addresses
    to MAC addresses and tracking lease times. Administrators can adjust lease times,
    expand or reduce pools, and change gateways or DNS addresses, all from a central
    location.


    # 9.3 Implementation on Linux


    In this section we will discuss how to implement a DHCP server on Linux.


    The DHCP server can be found in the network (n) series. Use YaST to install it.'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'Using your editor of choice, create the /etc/dhcpd.conf file.


    The following dhcpd.conf file is simpler. We designate a default lease time of
    600 seconds (10 minutes) but we will let clients request up to a 7200-second (2-hour)
    lease time. We include a recommended subnet mask of 255.255.255.0 and a broadcast
    address of 192.168.1.255. Other options we specify include a gateway (router),
    two name servers, and domain.


    For our subnet prefixes we are using the private 192.168.1.0 class subnet. For
    our DHCP pool we will give out addresses numbered from 15 to 100 for a total of
    85 addresses. The rest can be used by static devices.


    ```

    #/etc/dhcpd.conf

    lease-time 600;

    max lease-time 7200;

    option subnet-mask 255.255.255.0;

    option broadcast-address 192.168.1.255;

    option router 192.168.1.254;

    option domain-name-servers 192.168.1.1, 192.168.1.2;

    option domain-name "ibm.com";


    subnet 192.168.1.0 mask 255.255.255.0 {

    range 192.168.1.15 192.168.1.100;

    }

    ```


    You are not limited to a single subnet. You are allowed to have shared network-specific
    parameters, multiple subnet-specific parameters, group parameters, and host-specific
    parameters.


    You can define multiple ranges, assign specific IP addresses based on the hardware
    address of the client, and specify a WINS server if needed.


    More information is available from the dhcpd.conf man page.


    To start the DHCP daemon, type:


    ```

    rcdhcp start

    ```'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Chapter 10. Postfix


    Sendmail is considered the de-facto mail system for UNIX systems. It includes
    all the features needed in a mail system and has been in circulation for many
    years, and as such provides excellent stability.


    The problem with Sendmail is the configuration of the service. Most Linux servers
    use a common configuration file format, commonly known as rc files, rc files use
    variable=value pairs that are usually self explanatory.


    Sendmail, on the other hand, uses cryptic variable/value pairs. Having a system
    that is difficult to configure and administer can lead to the administrator overlooking
    or wrongly setting configuration options. It also affects the time it takes to
    deliver the system, which can be a big decider in choosing a system configuration.


    Postfix was written by Wietse Venema while he was a resident at an IBM research
    facility. In Wietse''s words:


    > "Postfix is my attempt to provide an alternative to the widely used Sendmail
    program. Postfix attempts to be fast, easy to administer, and hopefully secure,
    while at the same time being sendmail-compatible enough to not upset your users."


    # 10.1 Installing Postfix


    The installation if Postfix isn''t as straightforward as other applications, you
    will need to remove the current mail system installed. By default Sendmail is
    installed in a SuSE Linux system. Both Sendmail and Postfix can be found in the
    n (networking) section of the package selection dialog in YaST.


    You will need to remove Sendmail before installing Postfix, since both systems
    will "battle" to run and produce unpredictable results and will almost definitely
    prohibit one of the servers from running. If you do not remove Sendmail, or do
    set Sendmail to be removed, you will receive a warning from YaST that it is not
    advisable for both of the services to be running on the same system.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 10.1.1 Postfix configuration files


    Once you have installed Postfix you can start to configure it. Postfix''s configuration
    files are based in the /etc/postfix directory. The most important configuration
    file is /etc/postfix/main.cf. Other configuration files are:


    +   **access** - This configuration file dictates what hosts may access resources
    through Postfix.


    +   **canonical** - This defines address remapping rules, both local and remote.


    +   **main.cf** - This file is the global configuration file for Postfix.


    +   **master.cf** - Defines the master daemon configuration that controls Postfix
    daemons for incoming and outgoing mail.


    +   **relocated** - Defines members of the organization that are no longer using
    the mail system. Postfix will notify senders that the recipient is no longer at
    the address and can also tell the sender of a new e-mail address where the recipient
    can be contacted.


    More information on these files and their configuration options can be found by
    typing:


    ```

    man filename

    ```


    Where filename is the name of the Postfix configuration file about which you want
    more information.


    ![](img/85b06e2bfb0156a5e744cfac214d4788_237_0.png)'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# 10.2 Example Postfix installation


    ![](img/85b06e2bfb0156a5e744cfac214d4788_238_0.png)


    Figure 191. Mail server test configuration


    The mail system will be configured to provide local mail services for the internal
    network (*.netfinity.com) and provide mail services for incoming Internet mail.
    The mail server interface that will be connected to the Internet will need a public
    IP address, and will also need to have a registered MX record in DNS. The MX record
    can either be handled by your DNS server if you have one, or you can use your
    ISP to handle the DNS records for the mail server.


    In our situation, once the MX records have been updated for mail justin@netfinity.com
    will be directed to mail.netfinity.com automatically by other mail servers looking
    up the MX handle in the DNS record for the netfinity.domain.


    # 10.2.1 Telling Postfix about the server


    The first thing we need to do is tell Postfix what domain it is working on. Postfix
    works from the FQDN of the mail server, in our case mail.netfinity.com. The FQDN
    will be automatically adjusted in different situations of the Postfix configuration,
    the most common being to truncate the host part of the FQDN to the domain name
    of the server.


    The main Postfix configuration file, /etc/postfix/main.cf, is a placeholder for
    the configuration options we choose to edit. Use your favorite text editor to
    edit the file as detailed in the rest of the chapter.'
  merge: -1
  pgno: 238
