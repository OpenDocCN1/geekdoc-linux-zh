    Web site at:


    ```

    http://www.estinc.com/

    ```


    # 16.2 Microlite BackupEDGE


    BackupEDGE is a complete backup solution for the Linux platform. It is easy to
    use and still robust. With BackupEDGE you can safely archive every file, directory
    node and special file on your file systems. Unlike standard UNIX tar command,
    which ignores many files, BackupEDGE also verifies every byte of data written
    to the tape to ensure the tape is an accurate reflection of your data. Below are
    the features provided by BackupEDGE backup software:


    +   * Data Compression - automatic data compression is supported.


    +   * Menu Interface - almost all functions can be accessed through an intuitive
    menu system.


    +   * Remote Tape Drive Support - you can back up computers across the network.


    +   * High Performance - advanced double buffering and variable block factors.


    +   * Virtual File Support - you can back up virtual (sparse) files.


    +   * Multi-Volume / Multi-Device Archives - automatic spanning across multiple
    volumes or devices.


    +   * Wildcard Support - when selecting files you can use a wildcard.


    +   * Raw Device Backups - you can archive an entire raw device/partition to tape.


    288 SuSE Linux Integration Guide for xSeries and Nettinity'
  merge: -1
  pgno: 301
- img_proc: true
  md: '+   - Master / Incremental Backups

    - Unattended Operation - you can perform a master backup or back up only the changed
    files.


    BackupEDGE is designed to operate on Linux kernels 2.x and there are available
    versions for several types of libraries.


    In the following sections we describe how to install, configure and use the Microlite
    BackupEDGE backup software.


    > Note we recommend that you do not connect tape devices to the IBM ServeRAID
    adapter. Use a seraide SCSI controller for the tape devices.


    # 16.2.1 Installing Microlite BackupEDGE


    Before installing BackupEDGE you must identify the device entry for your backup
    device. Usually tape devices under Linux are assigned in device nodes /dev/st5,/dev/st1...
    A no-rewind device is created for each tape device, which is /dev/nst0,/dev/nst1....
    In our example, we used /dev/st0 as tape device and /dev/nst1 as the no-rewind
    device.


    In our example, we used diskette as the installation medium. To install the product,
    follow these steps:


    +   1. Log in as root.

    2. Change the directory to root "f/".

    3. Insert the diskette with the product in the floppy drive and execute the command:

    ```

    t xf /dev/fd0

    ```

    Where /dev/fd0 is your floppy device.

    4. Execute the following command to finish the installation:

    ```

    tmp/init.edge

    ```

    You will see a window similar to Figure 234.'
