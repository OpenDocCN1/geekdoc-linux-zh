  md: 'Click **Next** to create the "normal" user and to proceed to setting the root
    password.


    ![](img/85b06e2bfb0156a5e744cfac214d4788_73_0.png)


    Unlike normal users of the system, who write texts, create graphics or browse
    the Internet, the user "root" exists on every system and is called action whenever
    administrative tasks need to be performed. In other words login as not need, want
    to be the system administrator, and only then. Because the root user is equipped
    with the extensive permissions, the password for "root" should be carefully chosen
    - A correlation of letters.


    **Figure 63.** Setting the root password


    The root password is the most critical password in the system. It means the difference
    between a safe controlled system and a compromised system. Therefore, choose a
    password that is not easy to guess. This means do not use the name of a spouse,
    a birth date, or a social security number, or anything else that can be guessed
    from your life.


    Use a combination of letters and numbers to create the password, but make sure
    you can remember it. It is very difficult to access to the system if you forget
    the password.


    To set the root password, click **Next.**'
