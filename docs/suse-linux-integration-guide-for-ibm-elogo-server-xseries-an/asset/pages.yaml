  md: 'feature that all mail servers have, but is the biggest pitfall for system administrators,
    because relaying is used by spammers to send mail to the Internet or to hide the
    identity of malicious users.


    If you allow relaying from all hosts you may end up getting blacklisted by recipients
    ISPs, if someone sends "spam" from your host to its customers. This will result
    in mail to ISP''s customers (it can be a considerable amount of users if it is
    AOL, Freverse or any of the other big ISPs) being blocked from your mail server.
    You have been warned; it is a very common thing to see in your logs that someone
    has tried to use your mail server for relaying. Do not think it will not happen
    to you. It will.


    Extended Turn ETR commands are not needed in our configuration. Default Postfix
    allows all hosts to issue ETR commands to the server. This is unnecessary and
    can present security holes in the system. We need to restrict access to ETR commands
    in our system.


    ```

