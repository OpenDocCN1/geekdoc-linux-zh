  md: 'Here you define how the diskettes will be created.

    10.After you configured all settings return to the main window and select Make
    Disks. You will be prompted to insert three diskettes.


    > Note

    If you get an error that diskettes cannot be created, the probable cause is that
    images are too big. To reduce the number of loaded modules or even make the special
    kernel just for this purpose, throwing out all unnecessary things.


    After the diskettes you created are ready to deal with disaster on your system.
    But before this really happens, try to boot from these diskettes and verify if
    your tape device is recognized.


    # 16.2.10.2 Verifying the RecoverEDGE boot diskettes


    To verify the diskettes, boot from the first diskette and follow instructions
    on the window. When the system is started you will get the RecoverEDGE main menu.
    Select Utilities > Tape Drive.


    In the Tape Device field, you see the defined tape device. Go to the Test Drive
    field and test your tape device. If the test is successful your recovery set is
    ready to use.


    # 16.2.10.3 Recovering from a total crash


    To recover from a disaster crash follow these steps:


    +   1. Resolve all hardware problems.


    > Note

    Before restoring the system, initialize the Master Boot Records of all disk drives.


    +   2. Boot the server from the first RecoverEDGE boot diskette.


    +   3. When you are prompted to insert the root diskette, insert the second RecoverEDGE
    boot diskette. After the diskette is loaded, RecoverEDGE will start and you will
    see a window similar to Figure 277.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '![](img/85b06e2bfb0156a5e744cfac214d4788_336_0.png)


    Figure 277. RecoverEDGE initial window


    +   4. Select Restore > One Touch. Follow the instructions on the window to complete
    the recovery.


    > > Note

    > For recovery you will use your master and incremental backups.


    +   5. When all files are backed up, press a key to get back to the main window.
    All the file systems will be then synchronized and LILO will be set up and executed.


    +   6. Before you reboot, switch to a console 2 with Alt+F2 and execute the following
    commands to check the fstab file for correct entries for your system:

    ```

    mount /dev/sdb6

    cat /mount/etc/fstab

    ```

    in our example sdb6 is your root partition. You should use your root partition
    here.

    That is all there is to it. Your restored system is ready to use.'
