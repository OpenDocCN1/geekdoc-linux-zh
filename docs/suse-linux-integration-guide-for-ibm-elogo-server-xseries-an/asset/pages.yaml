  md: '# Chapter 14. General performance tools in Linux


    Linux offers a great variety of ways to optimize your system for maximum performance.
    Apart from the fact that it is always good to have much RAM and the fastest CPU
    as possible, there are some additional parameters to tune a Linux system. This
    section is intended as a collection of useful tools, but without getting into
    too much about them. Please refer to the respective documentation and references.
    You should also note that using some of these hints may render your system unstable;
    use them at your own risk and only if you know what you are doing.


    # 14.1 General configuration hints


    These are some general tips for tweaking your system to maximize performance.


    Recompile your programs and the Linux kernel with all available compiler optimization
    flags (for example, `-froll-loops`, `-fomit-frame-pointer`) and all architecture-specific
    compiler options for your architecture. This may increase the size of binaries
    or make them unable to run on some processors, but you can gain a lot of speed
    in comparison with the binaries shipped in the distribution. Alternatively you
    could use special compilers for your architecture (for example, pgcc), which offer
    even more sophisticated optimization options.


    Create swap partitions of equal priority but different hard disk drives to allow
    load balancing. Please note that they need to be different devices! Using two
    different partitions on one hard disk will have the reverse effect. Even better,
    try to avoid swapping at all by adding more memory. A busy server should never
    need to swap, as this would severely degrade the overall performance.


    If you are running a heavily loaded server with a lot of parallel processes, you
    might run into the Linux kernel''s limit of running processes (512 by default).
    This maximum number of tasks is configurable in the kernel sources, so you have
    to recompile the kernel after changing this value. Value is defined in the file
    `/usr/src/kernel/include/linux/tasks.h`:


    ```

    #define NR_TASKS             512

    ```


    You can increase this value up to 4090 processes, if necessary.


    Linux offers a file system mount option that is called noatime. A is a timestamp
    of the last access time (reading and writing) for a certain file. This option
    can be added to the mount options in the /etc/fstab file. When a file'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'system is mounted with this option, read accesses to files will no longer result
    in an update of the inode access time information. This information is usually
    not very interesting on a file or Web server, the lack of updates to this field
    is not relevant. The performance advantage of noatime is that it suppresses writes
    to the filesystem for files that are simply being read. Since these write accesses
    add additional overhead, this can result in measurable performance gains. Instead
    of specifying this as a mount option that would apply to the whole file system,
    you can use the command chatter to set this flag on single files or directories.
    For example:


    ```

    chattr -R /var/pool/news

    ```


    This command would set the noatime flag recursively on all files below the news
    spool (a very common practice on busy servers). See the manual page chatter(1)
    for more information.


    You can use the hdparam tool to tune some hard disk drive parameters. Unfortunately
    most of them only work on IDE systems (which should be avoided in server systems,
    anyway), but the option -a works for SCSI too. The manual page describes it as
    follows: "This option is used to get/set the sector count for file system read-ahead.
    This is used to improve performance in sequential reads of large files, by prefetching
    blocks in anticipation of being needed by the running task. The default is 8 sectors
    (4 KB). This value seems good for most purposes, but in a system where most file
    accesses are random seeks, a smaller setting might provide better performance.
    Also, many drives have a separate buffer-in-read-ahead function, which alleviates
    the need for a file system read-ahead in many situations." For example, to set
    the sector count read-ahead of your first disk to 4 sectors (2 KB), you would
    use the following command:


    ```

    hdparam -a 4 /dev/sda

    ```


    See the hdparam manual page for a complete list of available options.


    # 14.1.1 Powerweak


    Powerweak, by Dave Jones of SuSE Labs, is a general-purpose application to allow
    you to "tweak" different system parameters.'
