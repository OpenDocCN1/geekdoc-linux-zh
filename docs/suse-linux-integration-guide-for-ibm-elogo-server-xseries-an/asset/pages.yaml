    # 3.6 Changing the configuration file with YaST


    SuSE Linux utilizes a central configuration file /etc/rc.config to store most
    of the system configuration information. The contents of this file will be used
    by the init scripts on startup, as well as for creating configuration files for
    the different services.


    The format of this file is plain ASCII text. The configuration is stored in variables
    in the form VARIABLE=value. Additional comments are marked with a ''#'' at the
    beginning of the line. Since rc.config contains most of the configuration information,
    you do not need to edit the original configuration files for most services. It
    is sufficient to make the change in this single file; YaST (in combination with
    the SuSEconfig script collection) will take care of the correct creation of these
    files. However, if you are used to modifying the


