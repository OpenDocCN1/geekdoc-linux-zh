  md: '# Preface


    This redbook will help you install, tailor and configure the SuSE Linux 7.0 distribution
    on different servers of the xSeries and Netfinity class. You will be instructed
    on how to do the basic installation, and installing and configuring different
    services such as Apache (http-Server), Samba (Fileserver for Windows-based networks),
    and Postfix (an alternative to Sendmail), backup and recovery, and other servers.


    Linux is a very mature and stable operating system but the Linux kernel is constantly
    being updated in order to make the operating system better. It can make it difficult
    for Linux beginners, so be prepared for a bumpy ride and but it is worth the effort
    and, as they say at SuSE, don''t forget to have a lot of fun...


