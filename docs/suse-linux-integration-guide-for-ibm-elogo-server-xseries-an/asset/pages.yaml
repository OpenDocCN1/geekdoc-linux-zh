  md: 'trusty - whose rights are read-write and the access rights of the client

    root can be the same as the server''s


    /projects proj*.local.domain(rw)

    The directory /projects is read-write accessible to all servers whose

    names match the pattern *.local.domain. This includes

    proj.local.domain, proj1.local.domain,projproroj.local.domain and so

    forth.


    +   * /usr *.local.domain(ro) @trusted(rw)

    Any systems whose hostname ends in .local is allowed read-only

    access. The @trusted group is allowed read-write access.


    +   * /home/joe pc001(rw,squash,anuid-150,ancgid-100)

    The directory /home/joe is accessible for read-write access; all

    requests for access are processed as anonymous users. The anonymous

    UID number is set to 150 and the anonymous group ID is set to 100.This is

    useful when using a client that is running NFS or an equivalent NFS

    process on the PC. The PC IDs do not necessarily map to the UNIX

    IDs, this allows the proper file attributes to be set.


    +   * /pub (ro,insecure,squash)

    The directory /pub is accessible as read-only. The option in this entry\allows
    clients with NFS implementations that do not use a reserved port

    for NFS and all requests as an anonymous user.


    +   * /pub/private (noaccess)

    The directory /pub/private does not allow any NFS access.


    # 11.3 Accessing data remotely with NFS - the command line view


    To mount a remote file system on your local system, the mount point must

    exist. The mount process does not create the mount point automatically.

    The process of making the mount point is to use the Linux mkdir command. To

    make the /usr/local/share mount point, enter:


    ```

    mkdir /usr/local/share

    ```


    Typically you do not need to worry about file attributes and ownership when\making
    an NFS mount point. The NFS access rights will usually supersede

    any rights established for the directory.


    Once you have created the mount point, you can use the mount command as\follows:'
