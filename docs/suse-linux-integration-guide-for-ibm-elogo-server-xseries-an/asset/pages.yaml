  md: '# Chapter 13. LDAP - Lightweight Directory Access Protocol


    LDAP has become a buzzword in the IT world. The exciting thing about LDAP and
    directory services is that they can be used for so many purposes. This chapter
    will give you a brief explanation of what LDAP is, how it can be used for basic
    structures, and simple implementation on the Linux OS. This chapter merely scratches
    the surface of what is actually possible with LDAP.


    # 13.1 What is LDAP?


    LDAP stands for Lightweight Directory Access Protocol. LDAP has become an Internet
    standard for directory services that run over TCP/IP. LDAP is a client/server
    protocol for accessing a directory service. Originally designed as a front-end
    for X.500 databases, LDAP is now commonly used in a stand-alone capacity. IBM,
    Netscape, Sun, Novell, Microsoft, and many other companies are incorporating LDAP
    into their directory structures.


    # 13.1.1 Directory Services


    A directory service is the collection of software, hardware, processes, policies,
    and administrative procedures involved in making the information in a directory
    available to the users of the directory.


    A directory is similar to a database. However, directories and databases differ
    in the number of times they are searched and updated. Directories are tuned for
    being searched, while relational databases are geared toward maintaining data
    with a frequent number of updates.


    Examples of directories would be the Yellow Pages, a card catalog, or an address
    book. Information is organized in a defined hierarchy and given attributes.


    When we place a directory online, the data becomes dynamic in the sense that it
    can be easily updated and cross-referenced. Unlike printed material, any updates
    that occur are instantaneous for all users.


    You can apply security to the directory so that only intended users can view,
    modify, or create data. This security can be based upon groups, individual users,
    or any other authentication scheme. The data can be encrypted.


    Directory services typically involve data distribution and replication. The advantages
    of distributing your directory services are performance, availability, and reliability.
    For a segmented network, distribution of servers containing the directory data
    improves performance by reducing network'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'traffic and load on individual servers. By replicating your data on multiple
    servers you increase availability in case a single server should go down.


    # 13.1.2 X.500


    In the mid-1980s, the International Telecommunications Union (ITU, formerly the
    CCITT) and the International Organization for Standardization (ISO) merged their
    efforts on directory services standards and created X.500. The X.500 specifications
    consist of a series of recommendations on the concepts, models, authentication,
    distribution, attributes, objects, and replication that underlie an X.500 directory
    service.


    Early X.500 implementations used a client access protocol known as DAP. DAP is
    thick, complicated, and difficult to implement for desktop computers. For all
    of these lighter-weight protocols were developed. As predecessors to LDAP, DIXIE
    and DAS were very successful. Out of this success a group from the Internet Engineering
    Task Force (IETF) began work on LDAP. The first Request for Comments (RFC 1487)
    describing LDAP was released in July 1993.


    # 13.2 How can I use LDAP?


    LDAP can allow system and network administrators to centrally manage users, groups,
    devices, and other data. IT decision makers can avoid tying themselves to a single
    vendor for applications and operating systems. Developers can use LDAP-based standards
    to ensure cross-platform integration.


    Some practical applications of LDAP-based directory services include:


    +   * Corporate address book

    * User authentication

    * Domain Name System


    # 13.3 LDAP basics


    The LDAP information model is based on objects. Objects can be people, printers,
    servers, or just about anything you can think of. The most basic unit of LDAP
    is the entry. An entry is a collection of information about an object. Each entry
    belongs to an object class that determines required and optional attributes. Each
