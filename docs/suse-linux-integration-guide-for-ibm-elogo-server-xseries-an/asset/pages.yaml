    where:


    +   - -t nfs Says to the mount as an NFS mount. This is now optional because if
    you explicitly specify the directory to be mounted as host:directory the mount
    command knows that it is an NFS mount.


    +   - nfs_host Is the host that is exporting the file system to be shared.


    +   - share_dir Is the actual directory that is to be shared.


