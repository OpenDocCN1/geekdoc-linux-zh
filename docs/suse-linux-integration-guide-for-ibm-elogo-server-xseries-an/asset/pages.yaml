  md: '# Chapter 11. NFS - Network File System


    The Network File System (NFS), developed by Sun Microsystems, allows you to share
    directories across the network. The directory mounts become transparent to. You
    access the mounted directories just as you do any directory or file system on
    your computer. The mounting process is the same as for any file system or partition
    you want to mount on your system. The basic function of this is the mount command.


    In order to share directories across the network you will need two basic things:


    +   * The system sharing the data must allow you to have access

    * The system that is using the data must originate the request and allow the mount
    to happen


    Both concepts will be discussed in this chapter.


    # 11.1 The NFS process


    First, you need to verify that the NFS package has been loaded. To use the RPM
    package. RPM package is short for Red Hat Package Manager and is a way of installing
    software packages in Linux. You can do this with the command:


    ```

    rpm -q knfsd

    ```


    If the NFS server has been installed you will be shown the package version. If
    it cannot be found, install the knfsd package as detailed in 3.1, “Adding and
    removing software packages using YaST” on page 111. The knfsd package can be found
    in the n (networking) services.


    NFS makes use of several daemons. Those daemons are:


    +   This is the process that converts numbers into Remote Procedure Call (RPC)
    programs into Defense Advanced Research Projects Agency (DARPA) protocol port
    numbers. When a client wishes to make an RPC call to a given program number (for
    example, the NFS server), it will first contact portmap on the server machine
    to determine the port number where RPC packets should be sent.


    rpc.kmountd handles the exporting of NFS file systems. It looks in the /etc/exports
    file to figure out what to do with mount requests from various hosts.'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'rpc.knfsd This provides the user level part of the NFS process.

    rpc.quotad This handles quotas for access to file systems. The quotas are based
    on disk usage and can be hard or soft limits.


    You can verify that the rpc.knfsd, rpc.mountd, and portmap daemons are running
    as shown in Figure 201.


    ```

    # ps ax grep nfs

    323 ? SW 0:00 [nfsd]

    324 ? SW 0:00 [nfsd]

    326 ? SW 0:00 [nfsd]

