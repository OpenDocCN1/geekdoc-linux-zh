    # 2.5 ServeRAID: Installation and configuration


    In this section we will describe how to install SuSE Linux on the IBM Netinity
    servers with the IBM ServeRAID controller and how to use the features of the IBM
    ServeRAID controller. The IBM ServeRAID controller is a high-performance RAID
    controller. In the current version of the Linux driver, all ServeRAID adapter
    versions are supported. Before you start the installation, you need to define
    the RAID arrays and the logical drives. The logical drives are represented to
    the operating system as if they were physical disk drives. For more information
    on RAID levels and performance issues, see Appendix A, “RAID levels” on page 361.


    > Stop


    > Before installing SuSE Linux on the IBM Netinity server with an IBM ServeRAID
    controller, you need to define RAID arrays and logical drives. You can do this
    with ServerGuide, which comes with all IBM Net servers, or with the ServeRAID
    DOS Configuration diskette, which is available at http://www.pc.ibm.com/support.


    > We strongly recommend that you use spare hard disks in your system to secure
    your data the best possible way.


    SuSE Linux supports the ServeRAID SCSI controller. To install the operating system,
    follow the procedure in Chapter 2, “Installing SuSE Linux” on page 5. Your Logical
    disk drives defined in the RAID array will appear as SCSI drives in the installation
    program.


    After you have installed the system, the utilities for RAID administration from:


    ```

    http://www.developer.ibm.com/welcome/netfinity/serveraid.html

