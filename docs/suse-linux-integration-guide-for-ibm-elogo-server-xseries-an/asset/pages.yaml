  md: '# 16.2.11 More information on Microlite


    For information on advanced features consult the *Microlite User''s Guide* and
    the Microlite Web site at:

    http://www.microlite.com


    # 16.3 Arkeia


    Arkeia is a complete client/server backup solution for Linux and other platforms.
    With Arkeia you can safely archive every file, directory, device node and special
    file on your file systems. Unlike standard UNIX tar command, which ignores important
    files, Arkeia also verifies the data written to tape to ensure that the tape is
    an accurate reflection of your data. Below are the features provided by Arkeia
    backup software:


    +   * Data Compression - automatic data compression is supported.

    * GUI Interface - A CLI-interface is also available.

    * High Performance - advanced double buffering and variable block factors.

    * Virtual File Support - you can back up virtual (sparse) files.

    * Multi-Volume / Multi-Device Archives - automatic spanning across multiple volumes
    or devices.

    * Wildcard Support - when selecting files you can use a wildcard.

    * Raw Device Backups - you can archive an entire device/partition to tape.

    * Master / Incremental Backups

    * Unattended Operation - you can configure schemas to periodically perform full
    backups and/or incremental backups.


    Arkeia is designed to operate on Linux kernels 2.x and there are available versions
    for several types of libraries (libc5 and libc6) and distributions.


    Requirements for the server:


    +   * A 486 processor or higher

    * 32 MB RAM

    * 1 GB disk space

    * SCSI adapter card

    * SCSI tape drive

    * TCP/IP services

    * Linux 2.0 or higher


    324 SuSE Linux Integration Guide for xSeries and Netfinity'
  merge: -1
