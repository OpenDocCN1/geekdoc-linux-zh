    57. Allocating swap space


    SUSE Linux provides a new journaling file system that monitors all changes to
    the system disk (hence the journaling) and can play back those changes in the
    event of a system crash. Users who have experienced a system failure on a 20 GB
    hard disk running ext2 will know how long it can take for the file system to be
    checked at bootup for errors. With ReiserFS is be checked by the system in a matter
    of seconds. ReiserFS is now considered stable enough to be used in production
    systems; therefore, you have the option of creating your partitions using ReiserFS.


    > Important -

    Do not set / a ReiserFS partition unless you have created a /boot partition. The
    files in the /boot directory have to be read at system boot up and as such should
    be on an ext2 file system. The usual way to set up a ReiserFS system is to create
    a /boot partition formatted as ext2, and then create a / partition formatted as
    ReiserFS.


