    # 2.5.3.4 The hrebuild command


    This command is used for setting the state of the Hot Swap Rebuild.

    hrebuild command has the following syntax:


    ```

    ipassend hrebuild <Controller> <Options>

    ```


    The parameters are explained in Table 3.


    Table 3. hrebuild command parameters


    | Parameter | Description |

    | | | |

    | Controller | Number of controller (1 to 12) |

    | Options | ON: enable Hot Swap Rebuild |

    | | ?: Display status of Hot Swap Rebuild feature |


    With this command you can retrieve or set the Hot Swap Rebuild feature. If the
    Hot Swap Rebuild feature is ON, it means that if one drive in the RAID array fails,
    rebuilding of this drive will start automatically when you replace the failed
    drive with a new one. This can improve the safety of your data.


    Note


    The Hot Swap Rebuild feature should not be confused with a hot spare drive. A
    hot spare drive means that a drive is in a waiting state as long as the RAID array
    is in an Okay state. Once the RAID array becomes in a Critical state, the hot
    spare drive is enabled and the data from the defunct drive automatically gets
    rebuilt onto the hot spare drive, disregarding the Hot Swap rebuild setting.'
