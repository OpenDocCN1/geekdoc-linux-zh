- img_proc: true
  md: '+   - make config - A series of questions are asked about settings and drivers
    etc you wish to compile into the kernel (console based).


    +   - make menuconfig - A menu-based tool to set up the kernel compilation. Based
    on ncourse (console based).


    +   - make xconfig - An application to configure the kernel compilation. You will
    need to be running X-Windows to use this version.


    change to the /usr/src/linux-2.26.16.SuSE directory and type to:


    ```

    make config_type

    ```


    where config_type is one of the above settings.


    Once you have set up the compilation environment in the same directory, type the
    following, pressing Ener after each:


    ```

    make clean

    make dep

    make bzimage

    ```


    The resulting kernel image will be stored as /usr/src/linux-2.26.16.SuSE/arch/386/boot/bzimage.


    If you compiled any features as modules, in the /usr/src/linux-2.26.16.SuSE directory
    you will need to type:


    ```

    make modules

    make modules_install

    ```


    You will need to copy the bzimage file to the /boot directory and YaST to install
    the image as a new kernel. See section 3.6.2, "Kernel and boot configuration"
    in the SuSE manual.


    Here are a few guidelines to follow when selecting the drivers and features to
    be used in a kernel:


    +   - Drivers that are needed constantly by the server should be compiled directly
    into the kernel.


    +   - Drivers that are needed by the system, but will not be in constant use,
    should be compiled as modules. This could be the case for IDE CD-ROM drive.


    +   - You are given the opportunity to set default values for a number of system
    resources, including timeouts. Set these to realistic values that can reduce times
    for device/resource access. Make sure you understand what you are changing with
    these values. You can usually look in the source code of the relevant driver to
    view comments about certain settings.


    Chapter 14. General performance tools in Linux 263'
