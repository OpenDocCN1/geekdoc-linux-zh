  \n1.1 启动过程\n\n以下是使用的文件和工具：\n- 引导加载器：Anaconda、NFS、HTTP\n- 启动：Kickstart、持久化\n- 卷：桥接、叠加\n\
  - 虚拟机：Libvirt、vmm\n- 配置：`/etc/grub.cfg`\n- `/boot/initrd`\n- `/boot/vmlin`\n- `grub-mkconfig`\n\
  \n1.2 管理内核模块\n\n以下是使用的文件和工具：\n- `lsmod`\n- `insmod`\n- `modprobe`\n- `dmesg`\n-\
  \ `rmmod`\n- `depmod`\n- `/lib/modules`\n- `/etc/modprobe.conf`\n\n1.3 配置并验证网络\n\
  \n以下是使用的文件和工具：\n- `ping`\n- `netstat`\n- `nslookup`\n- `dig`\n- `host`\n- `route`\n\
  - `ip`\n- `ethtool`\n- `ss`\n- `iwconfig`\n- `nmcli`\n- `brctl`\n- `/etcconfig/network`\n\
  - `/etcconfig/network-scripts/`\n- `/etc/hosts`\n- `/etc/resolv.conf`\n- `/etc/netplan`\n\
  - `/etc/sysctl.conf`\n- `/etc/dhcp.conf`\n\n1.4 管理存储\n\n以下是使用的文件和工具：\n- LVM、mdadm、Multipath\n\
  - 文件系统：ext3、ext4、xfs、smb、cifs、ntfs\n- `fdisk`\n- `parted`\n- `mkfs`\n- `iostat`\n\
  - `df`\n- `du`\n- `mount`\n- `umount`\n- `tune2fs`\n- `fsck`\n- `/etc/fstab`\n-\
  \ `/etc/cryptab`\n- `/dev/mapper`\n- `/dev/disk/by-id`\n- `/etc/mtab`\n\n1.5 比较云与虚拟化\n\
  \n以下是使用的文件和工具：\n- 模板：OVA、OVF、JSON、YAML\n- 容器镜像\n- 虚拟机：VMs\n- 虚拟化：Libvirt、virsh\n\
  \n1.6 配置本地化选项\n\n以下是使用的文件和工具：\n- `/etc/timezone`\n- `/usr/share/zoneinfo`\n- `localectl`\n\
  - `timedatectl`\n- `date`\n- `hwclock`\n- `time`\n- 环境变量：`LC_*`、`LC_ALL`、`LANG`、`TZ`\n\
  - 字符集：UTF-8、ASCII、Unicode\n\n1. 哪个命令会自动加载模块及其依赖项？\nA. `modprobe`\nB. `lsmod`\nC.\
  \ `insmod`\nD. `rmmod`\n\n2. 启动时的哪个选项会将系统带单用户模式？\nA. `single-user`\nB. `su`\nC.\
  \ `single`\nD. `root`\n\n3. 在 GRUB 启动期间，按下哪个键可以显示 GRUB 菜单？\nA. Shift\nB. E\nC. V\n\
  D. H\n\n4. 哪个命令可以查看内核环缓冲区以进行故障排除？\nA. `lsboot`\nB. `boot-log`\nC. `krblog`\nD. `dmesg`\n\
  \n5. 哪个命令可以获取当前加载内核模块的列表？\nA. `insmod`\nB. `modlist`\nC. `ls –--modules`\nD. `lsmod`\n\
