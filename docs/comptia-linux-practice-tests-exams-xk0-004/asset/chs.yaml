  - 权限提升\n    - `su`\n    - `sudo`\n    - `wheel`\n    - `visudo`\n    - `sudoedit`\n\
  - 用户类型\n    - Root（根)\n    - 标准 (Standard)\n    - 服务 (Service)\n\n### 3.2 在给定的场景下，配置并实施适当的访问和认证方法\n\
  \n#### PAM\n- 密码策略\n- LDAP 集成\n- 用户锁定\n- 要求的 (Required)、允许的 (allowed) 或充分的 (sufficient)\n\
