  md: 'Clinging to the boom, which still has the sail attached, Justforkix has flung
    himself into the void with Abba. They fall faster and faster, the sail unfurls
    … and carries them up into the air. The lovers, reconciled again, are gliding.
    It''s a great feeling. The young man really is a champion: at one and the same
    moment he has saved the life of the girl he loves and invented the hang-glider.


    His personal trainers are astonished. He really is doing very well.


    ''You see, Obelix,'' says Asterix, ''it''s love, not fear, that lends you wings!''


    Cryptograf could do with something to lend *him* wings, clinging as he is to the
    cliffside. Oh for a little love to get him out of there!


    At the next full moon, as he promised, Doublehelix is back in the village. But
    there is no sign of Justforkix yet.


    ''Er, I think he''s gone hunting … er, fishing,'' Vitalstatistix says.


    ''Hunting or fishing, which is it? Make up your mind!''


    While our heroes are doing their best to get home in time, the villagers keep
    Doublehelix happy with plenty of boar, barley beer and hopeful attempts to explain.
    But things look bad – until in the nick of time Justforkix turns up, with Abba
    in his arms.


    The marriage between the young people is about to take place. The Vikings in their
    longship have followed Asterix, Obelix and Justforkix all the way back from the
    frozen North, but now they join the Gauls to celebrate the wedding in the village
    of the indomitable Gauls. The Viking wedding guests tell the tale of Justforkix''s
    many adventures, and Doublehelix feels very proud of his son.


    Asterix turns to the druid Getafix. ''Tell me, Getafix, how would you define fear?''


    ''Fear is a test of courage,'' says the druid. ''True courage means overcoming
    your fear.''


    At this point the bard speaks up. ''I will now give you an ode in celebration
    of this happy event.'' And he plucks the strings of his lyre, chanting tunelessly,
    ''Lurve … it''s lurve that makes the ancient wuurrrld go round!''


    The Vikings are transfixed by terror. They clutch their heads, making frightful
    faces.


    ''What''s this barbaric noise? It''s unbearable!''


    ''By Thor! By Odin! Bye-bye!''


    And they flee for their lives, swimming out to their ship, suddenly very keen
    to get away from the bard and back home to the frozen North.'
