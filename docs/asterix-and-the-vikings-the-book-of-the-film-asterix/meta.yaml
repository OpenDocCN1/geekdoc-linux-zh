  md: '# GAUL

    (ROMAN CONQUEST)

    50 BC


    THE YEAR IS 50 BC. GAUL IS ENTIRELY OCCUPIED BY THE ROMANS. WELL, NOT ENTIRELY
    ... ONE SMALL VILLAGE OF INDOMITABLE GAULS STILL HOLDS OUT AGAINST THE INVADERS.
    AND LIFE IS NOT EASY FOR THE ROMAN LEGIONARIES WHO GARRISON THE FORTIFIED CAMPS
    OF TOTORUM, AQUARIUM, LAUDANUM AND COMPENDIUM ...


    ![](bbox=[0.0, 0.0, 1.0, 0.82])'
  merge: -1
  pgno: 7
- img_proc: false
  md: '![](bbox=[0.08, 0.03, 0.92, 0.42])


    There is a distant land far to the North where night is always in conflict with
    day. It has to be admitted that night usually wins, and it lasts for months on
    end, interrupted only by the green shimmer of the Northern Lights now and then.


    The people who live in this inhospitable country, a place of icy winters and frozen
    food, are called the Vikings. Do you think they spend those long winter nights
    keeping comfortable at home in the warm? Not at all! What they really like is
    conquering the world, having adventures, living dangerously. Blizzards, stormy
    seas, lightning flashing through the night, none of that can stop them. And the
    dragon prows of their longships are designed to face all perils.


    See them set off with a mighty roar for unknown lands and to fight new enemies:
    before them all barriers go down like straw, a little push opens every gate, and
    inside it they find … no one! Yet again, the terrified local inhabitants have
    run for their lives.


    ![](bbox=[0.08, 0.68, 0.92, 0.97])'
  merge: -1
  pgno: 8
- img_proc: false
  md: 'Gathering around their chief Timandahaf, the infuriated Vikings wash down their
    sorrows with a heady brew: apple brandy served in the skulls of their conquered
    foes. What use is their talent for fighting if all enemies make for the wide blue
    yonder before the Vikings even arrive? Their baffled soothsayer Cryptograf is
    muttering away. Odin speaks through the soothsayer, so let''s hear what inspired
    wisdom the god puts into his mouth.


    ''Half a loaf is better than no bread ... The early bird catches the worm ...''


    This is sending Timandahaf to sleep. The soothsayer is just droning on. Nothing
    he says explains why their enemies are so elusive. Cryptograf carries on translating
    the divine message into its VV.*


    ''Odin teaches ... that fear lends you wings ...''


    ''By Odin! By Thor! By gum!'' The chief is cooking up a brainstorm under his helmet.
    ''Fear lends you wings? That''s the answer! Let''s learn the meaning of fear and
    then we''ll know how to fly too! What we need is a coward, a scaredy-cat, a lily-livered
    poltroon! Let''s go and find one and then, now that we''ve conquered the earth
    and the sea, the sky itself will be ours too!''


    The Vikings are famous for their wide experience and fine navigation, and their
    name itself tells you how adventurous they are,** but nobody''s perfect: they
    don''t know what a figure of speech is. Listen to them shouting in unison, repeating
    their chief''s words.


    ''We want fear! We want wings!''


    Timandahaf is staking his all on this adventure: he promises to give the man who
    can capture a champion of the art of fear anything he asks.


    ''Anything? Do you really mean it?'' The crafty Cryptograf is laughing up his
    sleeve.


    ''Yes, anything! But first tell us where we can find this rare being! Which way
    do we sail the longships?''


    A look of evil calculation comes into the soothsayer''s eyes. See him unfurl a
    rolled-up map and cast the fateful runes. It''s like gambling in a casino ...
    No more bets, the die is cast ... no, ladies and gentlemen, no more bets taken
    at all now. And the rune Fehu, the sign of abundance, lands on a certain point
    on the coast of Armoric a.


    *Viking version.    **To go ''viking'' meant to go on an adventure.


    ![](bbox=[0.08, 0.84, 0.92, 0.99])'
