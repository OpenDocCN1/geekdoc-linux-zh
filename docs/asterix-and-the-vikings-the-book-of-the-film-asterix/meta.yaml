  md: 'Timandahaf is finishing his preparations. His wife Vikea, a real domestic goddess,
    gives him a looting list of things to bring home: flat-packed easy self-assembly
    furniture, candelabras, a set of matching skulls …


    The back door is flung open as if by a gust of wind, and in comes a pretty, lively
    girl with a big trunk on her back, ready for the great adventure. But no way is
    Timandahaf letting his daughter Abba come too.


    ''Oh, Dad, pretty please!''


    Fluttering eyelashes, a bewitching smile, a loving hand placed on the Viking''s
    manly chest – none of her coaxing works.


    ''Why on earth would you want to come?''


    ''Because!''


    She''s a girl with attitude: after sending her mother''s cadaverous crockery flying
    with a furious kick, she takes a sharp sword to her pillows and her cuddly toys,
    and soon she''s enveloped in a cloud of feathers. When two of them settle under
    her nose like a moustache, they tickle. That gives her an idea …


    And so the oarsmen on the expedition include a slender young man who rows with
    a firm stroke. A few locks of red hair escape from his helmet, his feathery moustache
    quivers in the sea breeze, but he keeps going well, no doubt feeling better than
    the cunning Cryptograf, who is seasick.


    Will Cryptograf''s cunning plan work? The longship ploughs a furrow through the
    waves, the clouded sky offers no clues …


    ![](bbox=[0.05, 0.69, 0.95, 0.95])'
