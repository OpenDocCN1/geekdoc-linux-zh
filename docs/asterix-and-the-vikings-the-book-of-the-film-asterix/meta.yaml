  md: 'Cryptograf decides it''s time he put his plan into practice.


    ''And now let''s drink a toast to the heroic Olaf, the man who captured the champion
    of fear!'' he announces. ''You haven''t forgotten your promise, I hope, Chief
    Timandahaf?''


    ''A chief always keeps his word, by Thor! What would that lad of yours like?''


    ''My son has the honour of asking for your daughter''s hand in marriage!''


    At this crucial moment Abba comes up. ''What''s all this about marriage?'' she
    enquires.


    ''None of your business, young lady!'' And Timandahaf reminds her that in Viking
    tradition, a man just drags his intended bride away to her new home by the hair.


    But Abba rebels. ''I''m not going to marry that herring brain!''


    ''Oh yes, you are going to marry that herring brain!''


    At least father and daughter agree on the subject of herrings.


    Out loud, Abba''s mother Vikea remembers her own wedding day, her grazed knees,
    bruises all over her … the happiest day of her life!


    But now Justforkix speaks up. ''Er … may I say something?''


    The answer is no. Timandahaf is the chief around here. At a sign from him, guards
    grab the young couple and tear them apart.


    ''Tomorrow would be a good day for the wedding, don''t you think?'' suggests Cryptograf.


    ''Yes, fine,'' agrees the chief. ''But first the champion must show us how to
    fly!''


    Oh dear … Cryptograf hadn''t foreseen that little difficulty.


