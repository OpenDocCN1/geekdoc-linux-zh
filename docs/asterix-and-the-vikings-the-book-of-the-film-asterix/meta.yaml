  md: 'The Gauls see Justforkix dancing in an electric blue light, twirling sometimes
    on his fingers, sometimes on one knee. He seizes Abba and gets her to dance too.
    She likes it. Cryptograf casts a gloomy eye on all this. He tries to open his
    idiot son Olaf''s eyes to what''s going on.


    ''Can''t you see he''s going to steal your fiancée, you total fool?''


    Olaf doesn''t see it.


    This is Justforkix''s moment of glory. His audience hoist him on their shoulders
    in triumph. And as usual, just when young people are having fun … guess what?
    Along comes Dad or the teacher to spoil everything!


    In this case it''s Obelix who feels that, as Justforkix''s personal trainer, he
    should come to the rescue. He grabs the boy, picks him up like a feather, and
    carries him off.


    ''Hey, I only just got here!'' protests Justforkix.


    After all his hardships he was beginning to dance and enjoy himself, and now the
    Gauls want to stop him, saying it''s for his father. The father who''d like to
    be rid of him!


    ''Because if he didn''t,'' he tells them, ''he''d never have sent me to visit
    you lot! You great oafs! You country bumpkins!''


    That cruel remark strikes home. Obelix opens his mouth and then closes it again.
    Wasn''t there some ancient Germanic philosopher who said, ''Whereof one cannot
    speak, thereof one must be silent''? That''s just how Obelix feels. Deeply wounded,
    he turns on his heel and marches away.


    Seeing his Gaulish friends go, Justforkix is sorry for what he said and wants
    to apologise. He runs after them. Abba is baffled, but she follows him.


    ''Go on, give me a smile!'' she begs. ''Pretty please!''


    Yes, what do such squabbles mean when Abba is here? Justforkix''s feet are freezing
    in the snow, but his heart is burning … and that first kiss sweeps him away through
    space and time!


