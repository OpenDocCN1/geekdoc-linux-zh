  md: 'Once upon a time there were some Asterix enthusiasts at the M6 Studio who dreamed
    of the day when they would get the chance to produce a feature-length animated
    film about the Gauls we know so well, the people living in that ''village full
    of madmen''. They were always phoning me, trying to present the best of the animated
    film companies in Paris to the Master. The problem was that every time a meeting
    was fixed Albert Uderzo – Grand Master of the Order of Druids and thus in the
    confidence of the wise Getafix – went away without agreeing. You don''t get around
    a old sage in the field of the animated cartoon so easily!


    So working session followed working session, for month after month. All around
    Albert Uderzo the young film-makers were busy with explanations and questions,
    wondering about this or that movement, model sheet, the consistency of the storyline
    and the sequence of scenes, while the sessions in which the screenplay was worked
    out were very lively, involving both the Gauls of Neuilly (in Paris) and the Vikings
    of Copenhagen. *''Watch out or you''ll get this rollmop in your face!''* *''Oh,
    will I, just! Take that, it''s my smoked herring!''* *''Are you claiming that
    herring''s not fresh?''* *''See you outside in the lunch break!''* … And so on.
    Let us pass over the more violent arguments in silence, although I could a tale
    unfold … but the Grand Master won''t let me.


    And then, one day in December 2001, in the M6 screening room, Albert Uderzo and
    his followers, including your humble servant, watched a showing of the film *Help!
    I''m a Fish!*


    ''By Toutatis!'' cried the Grand Master. ''This is a film with a touch of magic
    about it!'' And legend tells us that later, as darkness fell, Albert raised his
    favourite Americano, a potion unknown to the druidical magic books of tradition,
    to the stars to drink a toast to his friend that other Grand Master, René Goscinny,
    now on his celestial mission to teach the angels how to laugh. The adventure could
    begin.


    So Natalie the producer and I shook hands warmly, the way our friends from Britain
    do. We were a mere handful at first – Stefan and Jesper the directors, Jean-Luc
    the screenwriter, Natalie, André the production manager, Albert and I, with the
    blessing of Anne Goscinny – and we ended up an army! An army mobilised to send
    an icy northern wave sweeping over Europe! The Vikings, men of the North, were
    at last to make their first foray into the cinema, almost forty years after the
    first publication of the album *Asterix and the Normans*. You will remember that
    they wanted to learn how to feel fear, because of course fear lends you wings!


    Be that as it may, as time went by the Gauls of M6 Studio, 2d3D Animations, Néomis
    Animation and, of course, the Danes of A-Film all set to work on a task worthy
    of Odin himself: to bring Asterix back to the world of the animated film after
    twelve years of absence. And what a film!


    In the following pages, which are devoted to the secrets of the making of that
    film, you will see some of the preliminary work on the creation of the models,
    as corrected, revised or approved by Albert Uderzo. For future reference, I wanted
    you to see the drawings by the artist who with his friend René Goscinny created
    Asterix.


    Among the high spots of this Gaulish venture was the moment when Albert Uderzo
    explained to the two Danish directors, Stefan and Jesper, the importance of animated
    film in the development of his drawings for Asterix. He told them, for instance,
    how when he and René were working on their first animated cartoon film, *Asterix
    and Cleopatra* (the film of *Asterix the Gaul* was made on the initiative of Georges
    Dargaud, without their knowledge or full approval), he found he had to make his
    little Gaul''s legs longer; mechanically, it would be been impossible for him
    to get about normally with the short legs shown in the very first strip-cartoon
    albums.


    So enjoy your journey to the country imagined by Goscinny and Uderzo, a land that
    has been offering the joys of escapism to generations of readers ever since 1959.
    For after all, it''s imagination that really lends us wings, wouldn''t you agree?


    Doubleclix'
