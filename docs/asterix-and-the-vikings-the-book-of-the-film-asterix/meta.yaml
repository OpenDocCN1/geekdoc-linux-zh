  md: 'In fact it lands in that peaceful, happy village where the Gauls are indulging
    in one of their favourite pastimes: a lively debate about fish, fresh or otherwise.
    Asterix and Obelix are off to join the happy fray when Chief Vitalstatistix and
    his shield-bearers arrive. The village chieftain has just had a letter from Lutetia.
    It''s from his brother Doublehelix, and the news in it concerns the whole village.
    Doublehelix, famous for fighting beside Vercingetorix at the battle of Gergovia,
    is sending his son Justforkix to stay with his uncle in the country. He feels
    that city life has left the teenager rather too soft. Vitalstatistix decides that
    it will be up to Asterix and Obelix to make a man of him, while the entire village
    will prepare a welcoming banquet.

    Meanwhile, the fish fight goes on.


    But suddenly the fish stop flying, and all heads turn to look at the young man
    driving up in his showy chariot, his long blond hair flying in the wind as his
    two horses gallop full speed ahead. Spreading panic among the chickens, the chariot
    and pair comes to a halt in the middle of the village with a fairly well-controlled
    skid. Vitalstatistix, slightly surprised by his nephew''s spectacular arrival,
    is starting to introduce everyone when a dove flies down to join the young man.
    ''Meet SMS,'' he explains to the Gauls. ''She provides my short-message service.''

    Before the eyes of the startled villagers the dove, vibrating convulsively, pecks
    out her message on a wooden post with the speed and precision of a woodpecker.
    Rather disappointed to find his hosts so technologically backward, Justforkix
    asks what''s for supper. ''Your fish doesn''t look very fresh.''

    This tactless remark takes instant effect: the fish fight hadn''t gone on nearly
    long enough, and now it can resume.


    ![](bbox=[0.13, 0.79, 0.92, 0.98])'
