  md: 'The young couple are just going on board the ship when they see Olaf, taking
    gigantic strides as he leaps from ice floe to ice floe. Justforkix picks up an
    oar and threatens to snap it, to show Olaf how strong he is. But the effects of
    the magic potion have worn off, and it resists his puny strength. Meanwhile Olaf
    has grabbed the boom of the sail. Seeing that Justforkix is terrified again, Abba
    says encouragingly, ''Go on, fly away! I''ll fly too, in your arms!''


    Feeling ashamed of himself, Justforkix finally admits that he can''t fly at all.
    ''What?'' cries Abba. ''You''re no better than anyone else! You lied to me!''


    Poor Justforkix has to fight on all fronts now, trying to fend off the brutal
    Olaf with his oar and at the same time stop his beloved Abba leaving.


    ''I didn''t want to lie to you,'' he tells her. ''I had to, in spite of myself.''


    Meanwhile SMS is flying off to warn Asterix and Obelix, but the dove is exhausted
    on reaching them, and unable to pass on any message. A quick drink of potion,
    however, gives her new energy to peck the message out on the ice. What a beak!
    They follow SMS back to the fjord.


    Out there matters are worse than ever. Deaf to the pleas of Justforkix, Abba leaves
    her two suitors to their fate. But when Olaf seizes Justforkix, who lets out a
    scream, she turns back and shouts, ''No! No! Don''t kill him!''


    In all the scuffling, however, she''s the one who is knocked senseless. The two
    rivals are facing each other not far from a steaming crater now. Justforkix realises
    that it is a geyser, and could come in useful – sure enough, when Olaf falls into
    it, it erupts and flings him up in the air to land a long way off. By the time
    Asterix and Obelix arrive, followed by a Viking horde, Abba is coming round.


    Timandahaf gives his men orders to capture Justforkix before he can fly away.
    This time all is revealed. Justforkix is a liar and can''t fly at all. Olaf was
    holding him up in the air by a rope – ''Right, Dad?'' he appeals. And the sly
    Cryptograf fixed the whole thing. His plot is uncovered, and all he can say in
    self-defence is that Odin must have lied to him!


    A dramatic scene unfolds on the icy cliffs. Cryptograf slides towards the abyss
    below, clinging to Abba''s cloak. Justforkix catches hold of her just in time,
    and they reach a ledge on the side of the cliff, exactly where the boom fell after
    Olaf dropped it. Asterix shouts to them not to move, and he and Obelix will come
    for them. But how? ''This is the end,'' says Abba, and she''s right. ''Flying
    is the only way to get out of here – and that''s impossible!''


    ''Impossible? Doesn''t that remind you of something?'' Justforkix remembers now.
    ''A very good friend once told me, how do you know something''s impossible until
    you try?''


    Asterix and Obelix shout, ''No!''


    But too late …'
