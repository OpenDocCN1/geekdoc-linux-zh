  md: 'as he really seen the Vikings? Let''s take a closer look ourselves … yes, he''s
    right! The fearless Abba, hanging from the prow of the ship with one hand, looks
    forward to going ashore. But that''s not how her father sees things.


    ''Don''t even think about it, young lady! You''re staying here on board!''


    ''You can''t make me!''


    ''Can''t I, though?''


    And next moment the girl has been overpowered and shut inside that sinister cage.
    So much for her bold exploration of enemy territory! So much for her dreams of
    warlike deeds! Abba is furious. But now Timandahaf can concentrate on addressing
    his men.


    ''Right then, no killing and looting for once. This is a study trip. For now,
    we observe them. The time to slaughter them will come later.''


    At these stirring words the Vikings charge off inland, roaring. All of them but
    Abba, who is left imprisoned on board the longship.


    Olaf and Cryptograf have gone a little way from the others, because Cryptograf
    has something to say to his son. He starts by hitting him on the head with his
    stick.


    ''Now, are you sure you understand what we have to do?''


    ''I''m sorry, Dad,'' says Olaf, ''but it''s a really complicated plan.''


    They are sitting under a couple of trees, facing each other. The soothsayer tries
    a practical illustration.


    ''See this stone? That''s you. And see that one? It''s the champion of fear. If
    you capture him you''ll get to marry the chief''s daughter. This is the chief''s
    daughter.''


    ''Looks like another rock to me.''


    ''No, it''s a girl now! And if you marry her you get to be chief after Chief Timandahaf.
    Got the idea, son?''


    ''Er … yes. I''m solid rock.''


    Well, perhaps Olaf has grasped the basics.


    ![](bbox=[0.1, 0.66, 0.9, 0.97])'
