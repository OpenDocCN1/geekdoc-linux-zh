  md: 'While the Gauls make for their ship, moored at the entrance to the fjord, and
    go aboard, Justforkix is still arguing. At last Obelix''s heart is softened.


    ''Oh, why don''t we go and look for the little Viking girl, Asterix?'' he asks.
    ''It will make young Justforkix so happy!''


    ''Nothing doing!'' says Asterix.


    Once again the two friends'' educational theories are at odds. But when the young
    man spots the gourd of magic potion at Asterix''s belt, he doesn''t hesitate to
    help himself to some.


    So as they carry on arguing, silhouetted against the snow, Justforkix, all tanked
    up on potion, jumps ship and swims strongly back to the village.


    Abba is still resisting the marriage as hard as she can, but her own parents too
    watch the traditional ceremony with sentimental pleasure.


    ''You just wait till Justforkix gets back!'' she threatens.


    Cryptograf laughs heartily. He''s sure the young man has fallen to the bottom
    of the cliff and will never be seen again. But suddenly …


    ''Nobody move! The wedding''s off!''


    And in true Viking tradition, Justforkix flings the girl over his shoulder and
    carries her away. The non-traditional bit is that she''s willing, even delighted!


    A general punch-up follows. When Asterix and Obelix turn up to rescue the young
    people, Asterix takes a good swig of potion himself and goes into action. Meanwhile,
    the lovers take advantage of the brawl to run away in the snow and reach the Gaulish
    ship.


    Seeing political power escape his grasp, Cryptograf gives his son a simple order:
    kill the champion. Olaf understands that, no problem, and he sets off after them
    with all the strength and determination of a man who can entertain only one idea
    at a time.


    ![](bbox=[0.13, 0.75, 0.88, 0.98])'
