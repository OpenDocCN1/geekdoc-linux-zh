  md: 'Alone in space, Justforkix really does seem to be flying. He can''t go forward
    or back, he''s been liberated from the law of gravity, he''s hovering. But higher
    up, on top of a control tower, Olaf looks as if he''s fishing. He is holding a
    rod, and now, as the mist drifts aside, anyone can see that the fishing line is
    the other end of the rope round Justforkix''s waist.


    So that''s how the trick was done! And Cryptograf, also balancing on the roof
    of the control tower, begins cutting through the rope to get rid of the champion
    of fear, who has now served his purpose. But before the soothsayer has quite finished
    cutting, he slips in the snow. Justforkix''s life is literally dangling by a thread.


    And crash! As the thread breaks, Justforkix plunges into the abyss. SMS dives
    with him. As if they were a circus act, Justforkix catches her feet, hanging from
    the bird – and once again he seems to be flying, caught in mid-air by the Gauls
    who have turned up to save him in the nick of time.


    He flings himself on Obelix''s broad chest, and then hugs Asterix. All is forgotten
    and forgiven.


    ''Time to go home,'' says Asterix.


    ''No!'' And Justforkix explains. ''We must rescue Abba. She needs me.''


    ''Nothing doing! We''re going home now.''


    How selfish young folk can be! Forgetting his gratitude and their emotional reunion
    just a moment ago, Justforkix turns against the Gauls again, hammering Obelix
    on the back with his fists.


    Meanwhile Abba, with her hands tied, is struggling frantically as Olaf hauls her
    away under the eyes of his parents. This is their son''s wedding day, and they
    are deeply moved.


    ![](bbox=[0.18, 0.89, 0.8, 0.99])'
