  md: 'Viking roosters greet the dawn with loud crowing, like the Gaulish variety.
    And the wake-up call that sends you flying through the window seems to be a custom
    all over the world. National differences depend only on whether you land on straw,
    dunghills, beaten earth … or, in this case, snow.


    Now the day can begin.


    ''Go on,'' Timandahaf tells his Gaulish captive. ''Frighten us!''


    This means life or death to Justforkix. He remembers his boyhood in Lutetia, when
    he and the other street urchins used to compete in making faces. He pulls some
    faces. He might as well have tried tickling an elephant with a feather. He utters
    a faint growl.


    ''What''s all this nonsense?'' says Timandahaf. ''Now this is what I call a terrifying
    yell … WOOOOAH!''


    ''Eeek!''


    All any Viking has to do to scare Justforkix silly is open his mouth. Timandahaf
    is getting tired of such a feeble performance. ''That''s enough chit-chat!'' he
    says. ''Let''s have your flying demonstration. Off we go to get you on the runway!''


    ''No! No!''


    So when Asterix and Obelix reach the Viking village, there''s no one around. Only
    a single Viking buried headfirst in the snow. Asterix takes him out and smacks
    his face.


    ''Are you or aren''t you going to talk? Yes or no?''


    ''No! Viking … fly!''


    And he does, too, when Asterix sends him sailing through the air.


    Justforkix is standing on top of the cliff, with a steep drop below him. His teeth
    are chattering. This wasn''t in Cryptograf''s plan, and now he''s trying to gain
    time. Quickly, he slips a rope round the young man''s waist, just before he''s
    thrown off the top of the cliff … and guess what? Justforkix is flying!


    The delighted Vikings, with Timandahaf in the lead, run to the edge of the cliff
    ready to throw themselves off too.


    ''STOP! Let''s have the wedding first,'' Cryptograf reminds them.


    Brought up short at the last minute, they turn round, leaving young Justforkix
    dangling.


    ![](bbox=[0.083, 0.875, 0.917, 0.997])'
