  md: 'When night falls, spits are turning, wild boar are roasting, and everyone is
    keen to get to know the young man. City ways meet country life: all the girls
    and young women want to hear about the bright lights and nightclubs of Lutetia.
    To Obelix''s horror, Justforkix turns out to be a vegetarian. Obelix earnestly
    tries to convince him of the nutritional value of wild boar.


    Time for the dancing to begin! A row of women faces a row of men; they take a
    few steps forward, a few steps back, then to one side … Bored out of his mind,
    Justforkix won''t join in. This is stuff for the golden oldies!


    ''How do they dance in Lutetia?'' Impedimenta asks.


    ''Hey, why don''t I show you?'' And the hip young man jumps up on the platform,
    pushing the bard aside and gyrating wildly in trendy modern style. He looks as
    if he''s dislocating all his joints. The catchy rhythm gradually takes the villagers
    over.


    ![](bbox=[0.057, 0.537, 0.943, 0.953])'
