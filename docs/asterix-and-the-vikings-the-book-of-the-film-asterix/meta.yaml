  md: 'On the longship, Olaf is going down the rows of Viking oarsmen, serving dinner.
    ''Salmon or salmon?''


    ''Shalmon!'' says the unknown oarsman with the fluffy moustache, indistinctly.


    A faint mist is fogging up Olaf''s brain. Surely he''s never seen this Viking
    before? At that moment the heavy swell of the sea throws the oarsman overboard.
    He almost sinks before they fish him out and get him back on deck, dripping with
    water. It''s now that the young man turns out to be a girl … and what a girl!


    With a single sword stroke, Timandahaf sends her helmet flying. Her bright red
    plaits fall to below her waist.


    ''Abba! I said you couldn''t come!''


    ''I''m sick and tired of staying at home!''


    ''Well, have you had enough of going to sea now?''


    ''No way!'' And Abba leaps up on the prow, where she makes an eloquent speech.
    ''Women have a right to learn what fear means too!''


    Standing like a superb statue, admired by all the crew and looking like *Liberty
    Leading the People,*\* she carries them along with her. ''Onward and upward!''
    she cries.


    Olaf has only just worked it out that this boy is really the chief''s daughter
    when the cry they''ve all been waiting for rings out.


    ''Land! Land ahead!''


    And they row, row together …


    \* Picture by the famous Gaulish artist Delacrowix


    ![](bbox=[0.13, 0.62, 0.87, 0.96])'
