  md: 'In the fog, things are getting even worse. Really worried now, Obelix wonders
    out loud where the North Star has gone.


    ''By Toutatis!'' says Asterix. ''You''ve just given me a good idea! Throw me up
    as high as you can, Obelix!''


    Asterix flies through the thick cloud layer like an arrow, before dropping back.


    ''Do it again!'' he says. And what should he see this time, high in the sky, but
    the North Star.


    ''We go thataway!''


    And the ship moves on, this time in the right direction.


    The Vikings are home again. With Abba beside him, Justforkix gets to know the
    amazing blue and white world of the Arctic. But one thing bothers him: the promise
    he made to teach her how to fly. Justforkix has come a long way since he was last
    in Lutetia. He knows now that every nation has its own laws and customs. And he
    wonders what Vikings do to liars.


    ''See that skeleton?'' asks Abba. ''Over there, frozen into that ice floe. That''s
    the last man who lied to me. Dad punished him as he deserved!''


    Poor Justforkix! What can he do but keep up the lies and empty promises?


    ''How about Tuesday at three in the afternoon for your first flying lesson?''


