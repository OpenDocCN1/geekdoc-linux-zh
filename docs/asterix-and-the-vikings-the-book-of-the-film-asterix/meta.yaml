  md: '![](bbox=[0.117, 0.151, 0.788, 0.366])


    In the peaceful little Gaulish village, the rooster''s crow rends the morning
    air, but nothing wakes Justforkix and SMS up easily. However, the young man''s
    initiation into village life has begun, and everyone knows that the early bird
    catches the worm. Obelix, a logical thinker, tries the kind of wake-up call that
    he knows will work: he sends Justforkix flying through the window.


    Now the daily routine can begin: there are menhirs to deliver, boars to hunt,
    pirates to attack. Every new day has its quota of menhirs, boars and pirate fights,
    and Obelix, as the young man''s personal trainer and an excellent teacher, shows
    him how it''s all done. Justforkix takes refuge with his uncle. ''Please don''t
    leave me alone with those lunatics,'' he begs.


    So Asterix and Obelix are told to find something that Justforkix *does* like to
    do. They decide to show him round a Roman camp. Justforkix thinks they''re going
    to a party.


    Before they leave, they drink a spoonful or so of magic potion from the cauldron.


    ![](bbox=[0.117, 0.704, 0.788, 0.964])'
