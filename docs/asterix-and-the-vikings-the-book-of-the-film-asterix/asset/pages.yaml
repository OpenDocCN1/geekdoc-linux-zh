  md: 'thering around their chief Timandahaf, the infuriated Vikings wash down their
    sorrows with a heady brew: apple brandy served in the skulls of their conquered
    foes. What use is their talent for fighting if all enemies make for the wide blue
    yonder before the Vikings even arrive? Their baffled soothayer Cryptograf is muttering
    away. Odin speaks through the soothayer, so let''s hear what inspired the god
    puts into his mouth ...


    Half a loaf is better than no bread ... The early bird catches the worm ...nThis
    is sending Timandahaf to speak. The soothayer is just droning on. Nothing explains
    why their enemies are so exclusive. Cryptograf carries translating the divine
    meaning into its VV.


    Odin teaches ... that fear lands you ... ''By Odin! By Thor! The chief is cooking
    up a brainstorm under his wings. Fear lands you wisely?That''s the meaning of
    fear and then we''ll know how to fly tool! What we need is a coward, a scary-cat,
    a lily-livered poltron! Let''s go and find one and them, now that we''ve conquered
    the earth and the sea, the sky itself will be ours!


    The Vikings are famous for their wide experience and navigation, and their name
    tells you how adventurous they are," but nobody''s perfect: they don''t know what
    a figure of speech is. Listen to them shouting in unison, repeating their chief''s
    words.


    “We want fear! We want wants!

    Timandahaf is staking his all on this adventure: he promises to give the man who
    can capture a champion of the art of fear anything he asks.


    “Anything? Do you really mean it?” The crafty Cryptograf is laughing up his sleeve.

    “Yes, anything! But first tell us we can find this rare being! Which way do we
    sail the longships?


    A look of evil calculation comes into the soothayer''s eyes. We see him unfurl
    a rolled-up map and cast the fateful runes. It''s like gambling in a casino ...
    No more bets, the die is cast ... no, ladies and gentlemen, no more bets taken
    at all now. And the rune Fehu, the sign of abundance, lands on a certain point
    on the coast of Armonica.


    *Viking version. ** To go ''viking'' meant to go on an adventure.


