  md: 'Justforkix, who has fainted, is lying on the deck of the longship. A bucket
    of icy water in the face brings him round, and he finds himself surrounded by
    horned helmets, terrifying jaws, gigantic bodies and heaps and heaps of skulls.


    ‘Mercy!'' he begs.


    ‘Mercy? What''s that?’ ask the Viking story group.


    ‘Must be one of their newfangled inventions!''


    Their mission isn''t to take an interest in mercy, so they tie their prisoner
    tightly – don''t forget, it''s his ability to fly that makes him so valuable to
    them.


    Some way off, the Gaulish ship has gone off in fog, a real pea-soup. The Gauls
    have lost sight of the North Star. As Asterix peers through the fog, Obelix complains
    that he''s starving, and wishes they hadn''t exhausted their provisions so soon.
    He ate all the boars without stopping to work out how long they might be at sea.


    But however on the Viking longship, SMS swoops through the fog and settles on
    deck beside her friend. Justforkix smiles. Suddenly a red bombshell explodes next
    to him.


    ‘Hey, I like your bird?’


    ‘Who are you?''


    ‘I’m Abba.’ She sees that the precious champion is trembling! Abba takes off her
    cloak and puts it over him, revealing herself in full combat gear. ‘It’s not the
    cold,’ the young man protests, ‘it’s fear. I’m so scared.’


    ‘Oh, aren''t you lucky! Will you teach me the meaning of fear too? I love to fly.’
    ‘Er… well, if you''ll help me, I''ll try my best.’


    Delighted, Abba takes SMS by the hand and the two of them twirl in front of the
    unfortunate champion. He was bowled over. And then – what? Fathers always choose
    the right word to break the spell.


    ‘What do you think you’re doing, Abba? How many times have I told you not to talk
    to strangers?


    Abba turns away with dignity. Justforkix watches her go, while SMS collapses on
    deck.


    What will become of them?'
