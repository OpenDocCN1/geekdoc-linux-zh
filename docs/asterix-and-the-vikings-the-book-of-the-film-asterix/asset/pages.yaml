    Abba is still resisting the marriage as hard as she can, but her own parents too
    watch the traditional ceremony with sentimental pleasure. ''You just wait until
    Asterix gets back!'' she threatens. Cryptograf laughs heartily. He''s sure the
    young man has fallen to the bottom of the cliff and will never be seen again.
    But suddenly...


    ''Nobody move! The wedding''s off!'' And in true Viking tradition, Asterix flings
    the girl over his shoulder and carries her away. The non-traditional bit is that
    she''s willing, even delighted!


    A general punch-follow. When Asterix and Obelix turn up to rescue the young people,
    Asterix takes a swift swing of potion himself and goes into action. Meanwhile,
    the lovers take advantage of the brawl to run away in the snow and reach the Gaulish
    ship.


    Seeing political power escape his grasp, Cryptograf gives his son a simple order:
    kill the champion. Olaf understands that, no problem, and he sets off after them
    with all the strength and determination of a man who can entertain only one idea
