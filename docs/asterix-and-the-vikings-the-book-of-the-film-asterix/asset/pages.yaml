  md: 'Sitting on the bench outside their hut, Asterix and Obelix are brooding gloomily.
    Anyone can see that Obelix is sad about the sudden way Justforkix left. He isn''t
    even hungry. The friends feel remorseful, regretting what might have been. Asterix
    is trying to cheer his friend up when SMS arrives in a flurry of dove wings.


    “What’s going on?”


    Dogmatic deciphers the message she has brought and passes the news on. ‘Justforkix
    has had an accident.


    They hurry through the forest, they see a panorama of sea and sky, perfectly calm.
    Past the green trees, they see


    But there’s a terrible sight on the beach at their feet: a wrecked chariot, and
    the remains of Justforkix’s sword. There’s no doubt about it – the Vikings have
    kidnapped him. They must go back to the village at once to warn Chief Vistatalstatix.


    And guess who’s visiting the village? Justforkix’s father, come to see how his
    son is doing! Asterix and Obelix, as the boy’s personal trainers, can’t possibly
    tell Doublehelikix the whole truth. They pretend he’s gone on a field trip as
    part of his training, and his father, reassured, roars with laughter and says
    he’ll be back at the next moon.


    Now they must go after the Vikings as fast as possible, rescue the young man and
    bring him back before his father returns at the time of the full moon. Asterix
    and Obelix go aboard a ship to embark on their new mission: saving the life of
    the chief’s nephew and the honour of the village.


    All they have to do now is find sea route leading to the icy Arctic lands. Their
    frail craft, heavily laden with stocks of wild boar, must follow the North Star.


