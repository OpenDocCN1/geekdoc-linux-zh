  md: "And far away, at the mouth of a narrow fjord, a longship is putting out to\
    \ sea. The square sail with its wide vertical stripes unfurls. In single file,\
    \ the Vikings are carrying their heavy loads aboard the ship. Cryptograf checks\
    \ that his fool of a son hasn't forgotten anything.\n\n‘Club, bludgeon, change\
    \ of under-armour?’\n his deep, cavernous voice Olaf protests. ‘Dad, please! I'm\
    \ not a kid now, and this isn't my first expedition, you know.’\n\nHe’s right,\
    \ it isn't, but there's a lot at stake. Because if Olaf captures the champion\
    \ of fear he'll get the chief's daughter, he'll get the chief's position, and\
    \ Cryptograf will get power. All that, however, is rather too complicated for\
    \ poor Olaf to understand.\n\nAmong the crates and chests dumped in the snow near\
    \ the ship, there is a distinctly sinister item. A cage the right size for a human\
    \ being is waiting to be taken aboard.\n\n![](img/853b795d059a91d2073dcdb59109a4d5_15_0.png)"
