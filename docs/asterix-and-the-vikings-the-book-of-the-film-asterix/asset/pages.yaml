  md: 'Let''s raise our skulls to toast the champion of fear! says Timandahaf. The
    drink is rather strong at first, but his hosts seem so pleased to have him there
    that Justforkix feels better.


    Meanwhile a small ship reaches land at the entrance to the fjord. Asterix and
    Obelix march through the snow to the door of a large building where the Vikings
    are queuing up, men with names like Telegraph, Stenograf, Caraf, Nescaf. Obelix
    thinks those names ending in ''at'' are funny, and roars with laughter. There''s
    obviously a big party going on inside the banqueting hall ahead of them. The doorway
    doesn''t want to let them in, but a mighty punch from Asteraf, as he decides to
    call himself, settles the minor matter of an invitation card. Taking his cue from
    his friend, Obelaf hands out the strong stuff to anyone who wants a punch. Then
    the prospect of a delicious dish of creamed walrus calms everyone down.


    But not for long ...


