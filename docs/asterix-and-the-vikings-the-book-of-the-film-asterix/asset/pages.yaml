  md: 'back in the Roman camp, Obelix and Asterix are finishing their demolition job
    when Justforkix arrives at a run. ''The Vikings are coming!''


    But the two Gauls calmly finish off what they are doing.

    Vikings, did you say? Well, bloodthirsty tries they may be, but they''ll just
    have to wait their turn everyone else!


    The young man starts off to the forest in despair. There are glints of light in
    the darkness, sounds a pair of eyes ... and the eyes belong to Olaf, who is spying
    out the land. Suddenly feeling worried about Justforkix, Asterix and Obelix catch
    up with him.


    > Don''t be frightened. We''re here to help you. We''re Gauls, remember? We don''t
    know the meaning of fear!


    > ''Speak for yourselves,'' Justforkix. ''I do. I''m frightened of everything
    ... I''m a real champion of fear!''


    Olaf''s eyebrows come together, his mouth drops open. He''s actually found the
    champion of fear! Here he is, just a couple of paces away! But what are those
    Gauls doing? Reassuring him That''s sabotage!


    Olaf hurries to tell Chief Timandah about his discovery. The chief isn''t pleased.


    > ''You come here just to eat Gaulish pancakes and take notes? Why didn''t you
    grab him? Go and get that champion before the Gauls turn him brave!


    > ''Yes, Chief,'' says Olaf.


    While the Gaulish village comes to life, Justforkix is harnessing the horses to
    his chariot. Obelix goes over him, putting on his shoes and sketching a few steps.
    But the young man can''t be persuaded to stay. Regretfully, Obelix goes to find
    him goodbye perfect.


    > ''This is for one training session and you''ll soon be able to lift it!'' he
    says, giving Justforkix his best menhir.


    > ''It''s impossible!'' says the young man, discouraged.

    How can you say something''s impossible if you''ve never tried it?


    > (Please don''t forget that ... it''s going to be important in this story.)


    Now Asterix arrives. He''s not pleased, and says Justforkix must stay. While the
    two friends are arguing Justforkix drives away, taking the men.


    Once again reaches at high speed through the dark forest. He is standing up to
    drive his chariot when a wheel suddenly comes off. The chariot skies and its frame
    collapses.


    > ''My lovely sports chariot!''

    And there''s no one around to help. No one? A slight breeze, small sounds, maybe
    small squirrels? A little echo? A shadow?


    > ''Beek! A Viking! A fist! A...'''
