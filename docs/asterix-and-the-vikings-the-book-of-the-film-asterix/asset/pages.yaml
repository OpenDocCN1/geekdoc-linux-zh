  md: 'ut in the lush green countryside of Gaul, Asterix and Obelix and their pupil
    are making for the Roman camp. The gates open and they walk in. The place looks
    completely deserted until a centurion appears, bravely shouting, "Hooray for the
    Pax Romana!


    He''s obviously new here.

    "Ssh, Oleaginus, calm down! mutters the decurion from his hiding place.

    Obelix overpowers the eager beaver and hands him to Justforkix.

    "You go now, sonny. I''ll count up to three. One ..."

    Justforkix is a pacifist


    ...

    ... and opposed to all forms of physical violence.

    "Three! Oh, well done! A promising start!"

    Justforkix has some magic potion, so a tiny little tap knocked the Roman down.


    Now for the kind of fun that Asterix and Obelix like! Once the Roman legionaries
    have formed a crocodile, all the Gauls have to dash their orderly ranks they''re
    flying through the air. It''s raining teeth, splintered spears, shields and Romans!
    But Justforkix doesn''t like rain, or this sort of party. He''d rather a rave.
    A kindly Roman shows him the exit.


    "Second gate on the right?"


    Howling with fight, the young man makes for the dark forest. In his headlong flight
    he sees light in the distance. Over there he''ll be sure to find the open sky,
    the beach, peace and quiet! He collapses on the sand, where his equally scared
    dove SMS joins him. Getting his breath back, he finally raises his head – and
    what he sees on the horizon?


    "The Vi ... the Vi-vi ... the Vikings!"


    ![](img/853b795d059a91d2073dcdb59109a4d5_23_0.png)'
