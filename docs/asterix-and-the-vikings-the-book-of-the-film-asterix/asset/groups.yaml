    THE YEAR IS 50 BC. GAUL IS ENTIRELY OCCUPIED BY THE ROMANS. WELL, NOT ENTIRELY
    ... ONE SMALL VILLAGE OF INDOMITABLE GAULS STILL HOLDS OUT AGAINST THE INVADERS.
    AND LIFE IS NOT EASY FOR THE ROMAN LEGIONARIES WHO GARRISON THE FORTIFIED CAMPS
    OF TOTORUM, AQUARIUM, LAUDANUM AND COMPENDIUM ...


    ![](img/853b795d059a91d2073dcdb59109a4d5_8_0.png)


    There is a distant land far to the North where night is always in conflict with
    day. It has to be admitted that night usually wins, and it lasts for months on
    end, interrupted only by the green shimmer of the Northern Lights now and then.


    The people who live in this inhospitable country, a place of icy winters and frozen
    food, are called the Vikings. Do you think they spend those long winter nights
    keeping comfortable at home in the warm? Not at all! What they really like is
    conquering the world, having adventures, living dangerously. Blizzards, stormy
    seas, lightning flashing through the night, none of that can stop them. And the
    dragon proves of their longterm are designed to face all perils.


    See them set off with a mighty roar for unknown lands and to fight new enemies:
    before them all barriers go down alike, a little push opens every gate, and inside
    it they find ... no one! Yet again, the terrified local inhabitants have run for
    their lives.


    ![](img/853b795d059a91d2073dcdb59109a4d5_8_1.png)


    thering around their chief Timandahaf, the infuriated Vikings wash down their
    sorrows with a heady brew: apple brandy served in the skulls of their conquered
    foes. What use is their talent for fighting if all enemies make for the wide blue
    yonder before the Vikings even arrive? Their baffled soothayer Cryptograf is muttering
    away. Odin speaks through the soothayer, so let''s hear what inspired the god
    puts into his mouth ...


    Half a loaf is better than no bread ... The early bird catches the worm ... This
    is sending Timandahaf to speak. The soothayer is just droning on. Nothing explains
    why their enemies are so exclusive. Cryptograf carries translating the divine
    meaning into its VV.


    Odin teaches ... that fear lands you ... ''By Odin! By Thor! The chief is cooking
    up a brainstorm under his wings. Fear lands you wisely? That''s the meaning of
    fear and then we''ll know how to fly tool! What we need is a coward, a scary-cat,
    a lily-livered poltron!


