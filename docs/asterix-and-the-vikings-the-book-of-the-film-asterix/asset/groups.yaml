    “俱乐部、大锤、换件内护甲？”奥拉夫深沉、空洞的声音在抗议道，“爸爸，拜求了！我不是孩子了，这也不是我的第一次远征，你知道的。”


    他是对的，这确实如此，但意义重大。因为如果奥拉夫俘获了恐惧之王，他就能得到酋长的女儿，获得酋长的位置，而克里普托拉夫就能获得权力。然而，这一切对于可怜的奥拉夫来说太复杂了无法理解。


