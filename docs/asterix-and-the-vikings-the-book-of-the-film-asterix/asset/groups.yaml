    Yes, what do squabbles mean when Abba is here? Justfork''s feet are freezing in
    the snow, but his heart is burning ... and that first kiss sweeps him away through
    space and time!


    ![](img/853b795d059a91d2073dcdb59109a4d5_37_0.png)'
  - '[PAGE 38]


    <!-- no content -->'
  - '[PAGE 39]


    Cryptograf decides it''s time he put his plan into practice.


    ''And now let''s drink a toast to the heroic Olaf, the man who captured the champion
    of fear!'' he announces. ''You haven''t forgotten your promise, I hope, ChiefTimandahaf?''


    A chief always keeps his word, by Thor! What would that lay of yours like? My
    son has the honour of asking for your daughter''s hand in marriage!'' At this
    crucial moment Abba comes up. ''What''s all this about marriage?'' she inquires.


    ''None of your business, young lady! And Timandahaf reminds her that in Viking
    tradition, a man drags his intended bride away to her new home by the hair.


    But Abba yells, ''I''m not going to marry that herring brain!


    At least father and daughter agree on the subject of herrings,


    Out loud, Abba''s mother Vilea remembers her own wedding day, she grazed knees,
    bruises over all her ... the happiest day of her life!


    But now Justforix speaks up, ''Er ... may I say something?'' The answer is no.
    Timandahaf is the chief around here. At a sign from him, guards grab the young
    couple and tear them apart.


    ''Tomorrow would be a good day for the wedding, don''t you think?'' suggests Cryptograf.


    ''Yes, fine,'' agrees the chief. ''But first the champion must show us how to
    fly!'' Oh dear ... Cryptograf hadn''t foreseen that little difficulty.


    ![](img/853b795d059a91d2073dcdb59109a4d5_39_0.png)'
  - '[PAGE 40]


    <!-- no content -->'
  - '[PAGE 41]


    outside, Obelix is walking through the night, his feet sinking deep into the snow.
    A doorman goes flying, a house collapses – in his wounded pride, he flattens everything
    in sight like a steamroller. Even the snowflakes seem heavy-hearted. Asterix tries
    to catch up with his friend and persuade him that they must go back and help Justforkix.


    # But Obelix marches straight ahead over a suspension bridge. All Asterix''s arguments
    are in vain. Only the faithful Dogmatix deserves his friendship, thinks Obelix,
    and he never wants to hear about Justforkix again. ''Help the boy? After those
    things he said? Impossible,'' he says.


    But now Asterix finds the argument that will change his mind. ''Did you say impossible?
    That''s what Justforkix said when you told him to pick up the menhir! You mean
    there''s something you can''t do?


    The mere suggestion is an insult that goes home, making Obelix forget Justforkix''s
    harsh words. He turns and retraces his steps. Our friends go back to the Viking
    village together, on their way to rescue Justforkix and save the honour of their
    little Armorican village.


    ![](img/853b795d059a91d2073dcdb59109a4d5_41_0.png)'
  - '[PAGE 42]


    ![](img/853b795d059a91d2073dcdb59109a4d5_42_0.png)'
  - '[PAGE 43]


    iking roosters greet the dawn with loud crowing, like the Gaulish variety.

    And the wake-up call that sends you flying through the window seems to be a

    custom all over the world. National differences depend only on whether you land

    straw, dunghills, beaten earth ... or, in this case, snow.


    Now the day can begin.

    ''Go on,'' Timandahah tells his Gaulish captive. ''Frighten us!''


    This means life or death to Justforkix. He remembers his boyhood in Lutetia,

    when he and the other street urchins used to compete in making faces. He pulls

    some faces. He might as well have tried ticking an elephant with a feather. He

    uters faint growl.


    ''What''s all nonsense?'' says Timandahah. ''Now this is what I call a

    terrifying yell ... WOOOAH!''


    ''Eek!

    All any Viking who does to scare Justforkix silly is open his mouth. Timandahah

    is getting ever tired of such a feeble performance. ''That''s enough chit-chat!''
    he says.

    Let''s have your flying demonstration. Off we go to get you on the runway!''


    ''No! No!


    So when Asterix and Obelix reach the Viking village, there''s no one around.

    Only a single Viking buried headfirst in the snow. Asterix takes him out and

    smacks his face.


    ''Are you or aren''t you going to talk? Yes or no?

    ''No! Viking ... fly!''


    And he does, when, Justforkix sends him sailing through the air.


    Justforkix is standing on top of the cliff, with a steep drop below him. His teeth

    are chattering. This wasn''t in Cryptogaf''s plan, and now he''s trying to gain

    time. Quickly, he slips a rope around the young man''s waist, just before he''s

    thrown off of the cliff ... and guess what? Justforkix is flying!


    The delighted Vikings, with Timandahah in the lead, run to the edge of the

    cliff ready to throw themselves off too.


    ''STOP! Let''s have the wedding first,'' Cryptogaf reminds them.


    Brought up short at the last minute, they turn around, young viking

    Justforkix dangling.


    ![](img/853b795d059a91d2073dcdb59109a4d5_43_0.png)'
  - '[PAGE 44]


    ![](img/853b795d059a91d2073dcdb59109a4d5_44_0.png)'
  - '[PAGE 45]


    Alone in space, Justforkix really does seem to be flying. He can''t go forward
    or back, he''s been liberated from the law of gravity, he''s hovering. But higher
    up, on top of a control tower, Olaf looks as if he''s fishing. He is holding a
    rod, and as the mist drifts aside, anyone can see that the fishing line is the
    other end of the rope around Justforkix''s.


    So that''s how the work was done! And Cryptograf, also balancing on the roof of
    the control tower, begins cutting through the rope to get rid of the champion
    of fear, who has now served his purpose. But before the soothsayer has quite finished
    cutting, he slips in the snow. Justforkix''s life is literally dangling by a thread.


    And crash! As the thread breaks, Justforkix plunges into the abyss. SMS dives
    with him. As if they were a circus act, Justforkix catches her feet, hanging from
    the bird—and once again he seems to be flying, caught in mid-air by the Gauls
    who have turned up to save him in the neck of time.


    He flings himself on Obelisk''s broad chest, and then hugs Asterix. All is forgiven
    and forgiven.


    “Time to go home,” Asterix.\n“No!” And Justforkix explains. “We must rescue Abba.
    She needs me.”

    “Nothing doing! We''re going home now.”


    How selfish young folk can be! Forgetting his gratitude and their emotional reunion
    just moment ago, Justforkix turns against the Gauls again, hammering Obelisk on
    the back with his fists.


    Meanwhile Abba, with her hands tied, is struggling frantically as Olaf hauls away
    under the eyes of her parents. This is their son''s wedding day, and they are
    deeply moved.


