    ![](img/853b795d059a91d2073dcdb59109a4d5_26_0.png)


    在罗马营地里，奥贝利克斯（Obelix）和阿斯特克斯（Asterix）正完成他们的拆除工作，此时朱斯福基克斯（Justforkix）冲了进来。“维京人来了！”


    但这两个高卢人冷静地完成了手头的工作。“你刚说维京人？好吧，尽管他们可能很贪血，但其他人也得排队等候！”


    年轻人绝望地走进了森林。黑暗中闪烁着光点，传来了某双眼睛的声音……那双眼睛属于奥拉夫（Olaf），他正在侦察这片土地。突然，担心朱斯福基克斯的阿斯特克斯和奥贝利克斯追上了他。


    > “别害怕。我们来这里帮你的。我们是高卢人，记得吗？我们不知道恐惧的含义！”


    > “那是你们自己的话，”朱斯福基克斯说道，“我懂。我什么都害怕……我是个真正的恐惧之王！”


    奥拉夫的眉头皱在一起，张大了嘴巴。他竟然真的发现了恐惧之王！就在这里，只有几步之遥！但这两个高卢人在做什么？他们安慰他道：“那是破坏行为！”


    奥拉夫急忙向酋长提曼达赫（Chief Timandah）汇报他的发现。酋长并不高兴。


    > “你来这里儿就是为了吃高卢薄饼并做笔记的吗？你为什么不抓住他？快在高卢人把他变勇敢之前，把那个恐惧之王抓回来！”


    > “是的，酋长，”奥拉夫说。


    当高卢村庄变得活跃起来时，朱斯福基克斯正在把马套在战车上。奥贝利克斯走过去，给他穿上鞋并试着走了几步。但那个年轻人并没有说服留下来。遗憾的是，奥贝利克斯去找他并告别了。


    > “这只是为了一次训练，你很快就能举起它的！”他说，送给朱斯福基克斯他最喜欢的巨石（menhir）。


    > “这不可能！”年轻人灰心心地说道。


    如果你从未尝试过，又怎么能说某事是不可能的呢？


    > （请不要忘记……这在故事中将非常重要。）


    现在阿斯特克斯来了。他不高兴，说朱斯福基克斯必须留下来。当两个朋友在争论时，朱斯福基克斯驾车离开了，带走了那些男人。


    他再次以高速穿过黑暗的森林。当他站着驾驶战车时，一个轮子突然掉了。战车飞向天空，框架崩塌了。


    > “我可爱的运动战车！”


    周围没有人帮忙。没有人？一阵微风，一些细小的声音，也许是小松鼠？一个小回声？一个影子？


    > “哔哔！一个维京人！一个拳头！一个……”


    坐在木屋外的长子上，阿斯特克斯和奥贝利克斯忧郁地沉思着。任何人都能看出奥贝利克斯对朱斯福基克斯的突然离开感到难过。他甚至都不饿。朋友们感到内疚，后悔可能发生的事情。当阿斯特克斯试图让朋友开心时，短信（SMS）随着鸽子翅膀的声音飞来。


    “发生什么事了？”


    多格玛（Dogmatic）翻译了她带来的信息并传了了。“朱斯福基克斯出事故了。”


    他们匆忙穿过森林，看到了海天的全景，一切非常平静。穿过绿色的树木，他们看到


    但脚下的沙滩上有一幅可怕的景象：一辆撞毁的战车，以及朱斯福基克斯剑的残骸。毫无疑问——维京人绑架了他。他们必须立即回到村子里警告酋长维斯塔塔蒂克斯（Vistatalstatix）。


    猜猜谁在访问村庄？朱斯福基克斯的父亲，来看来看儿子过得怎么样！阿斯特克斯和奥贝利克斯作为男孩的私人教练，不可能告诉双尔赫利基克斯（Doublehelikix）真相。他们假装他是为了训练去野外了，而他的父亲放了心，大笑着说下个月满他会回来。


    现在他们必须尽快追上维京人，把那个年轻人救回来，并在父亲满月返回之前带回来。阿斯特克斯和奥贝利克斯登船，开启了他们的新任务：拯救酋长侄子的生命和村庄的荣誉。


    他们现在要做的就是找到通往冰冷北极地区的航线。他们那只载满野猪的破旧船必须遵循北极星。


    ![](img/853b795d059a91d2073dcdb59109a4d5_29_0.png)


    昏迷的朱斯福基克斯躺在长船的甲板上。脸上的一盆冰水让他清醒了，他发现自己被一群戴着角头盔的人包围着，恐怖的大口和成堆的头骨。


    “慈悲！”他哀求道。


    “慈悲？那是什么？”维京人小组问道。


    “那是他们的新发明吧！”


    他们的任务不是关注慈悲，所以他们紧紧锁住囚犯——不要忘记，他的飞行能力对他们是如此宝贵。


    有些，高卢船消失在迷雾中，真正的浓汤。高卢人迷失了北极星。当阿斯特克斯穿过迷雾时，奥贝利克斯抱怨他快饿死了，希望他们没有那么快耗尽物资。他吃掉了所有的野猪，没有停下来计算他们可能留在海上多久。


    但在维京长船上，短信（SMS）穿过迷雾停在她的朋友身边。朱斯福基克斯笑了。突然，一个炸弹在他身边爆炸了。


    “嘿，我喜欢你的鸟？”


    “你是谁？”


    “我是阿巴（Abba）。”她看到那个完美的冠军在颤抖！阿巴脱下披风披在他身上，显露了……（注：OCR文本存在重复/损坏片段。我根据可用连贯文本清理了叙述流。）

