    The Vikings are famous for their wide experience and navigation, and their name
    tells you how adventurous they are," but nobody''s perfect: they don''t know what
    a figure of speech is. Listen to them shouting in unison, repeating their chief''s
    words.


    “We want fear! We want wants!

    Timandahaf is staking his all on this adventure: he promises to give the man who
    can capture a champion of the art of fear anything he asks.


    “Anything? Do you really mean it?” The crafty Cryptograf is laughing up his sleeve.

    “Yes, anything! But first tell us we can find this rare being! Which way do we
    sail the longships?


    A look of evil calculation comes into the soothayer''s eyes. We see him unfurl
    a rolled-up map and cast the fateful runes. It''s like gambling in a casino ...
    No more bets, the die is cast ... no, ladies and gentlemen, no more bets taken
    at all now. And the rune Fehu, the sign of abundance, lands on a certain point
    on the coast of Armonica.


    *Viking version. ** To go ''viking'' meant to go on an adventure.


    ![](img/853b795d059a91d2073dcdb59109a4d5_9_0.png)'
  - '[PAGE 10]


    <!-- no content -->'
  - '[PAGE 11]


    In fact it lands in that peaceful, happy village where the Gauls are indulging
    in one of their favourite pastimes: a lively debate about fish, fresh or otherwise.
    Asterix and Obelix are to join the happy fray when Chief Vitalstatistix and his
    shield-bearers arrive. The village chieftain has just had a letter from Lutetia.
    It''s from his brother Doublehelix, and the news in the entire village. Doublehelix,
    famous for fighting beside Vercingetorix at the battle of Gergovia, is sending
    his son Justforkis to stay with his uncle in the country. He feels that city life
    has the teenager rather too soft. Vitalstatistix decides that it will be up to
    Asterix and Obelix to make a man of him, while the entire village will prepare
    a welcoming banquet.


    Meanwhile, the fish fight goes on.


    But suddenly the fish stop flying, and all heads turn to look at the young man
    driving in his shiny chariot, his long blond hair flying in the wind as his two
    horses gall full speed ahead. Spreading panic among the chickens, the chariot
    and pair comes to a halt in the middle of the village with a fairly well-controlled
    skid. Vitalstatistix, slightly surprised by his nephew''s spectacular arrival,
    is starting to introduce everyone when a dove flies down to the young man.


    ‘Meet SMS,’ he explains to the Gauls. She provides my short-message service.


    Before the eyes of the startled villagers the dove, vibrating convulsively, peeks
    out her message on a wooden post with the speed and precision of a woodpecker.
    Rather disappointed to find his hosts so technologically backward, Justforkis
    asks for supper. ‘Your fish doesn''t look very fresh.’


    This tactless remark takes instant effect: the fish fight hasn''t gone on nearly
    enough, and now it can resume.


    ![](img/853b795d059a91d2073dcdb59109a4d5_11_0.png)'
  - '[PAGE 12]


    ![](img/853b795d059a91d2073dcdb59109a4d5_12_0.png)'
- md: '

    When night falls, spits are turning, wild boar are roasting, and everyone is keen
    to get to know the young man. City ways meet country life: all the girls and young
    women want to hear about the bright lights and nightclubs of Lutetia. To Obelix''s
    horror, Justforix turns out to be a vegetarian. Obelix earnestly tries to convince
    him of the nutritional value of wild boar.


    Time for the dancing to begin! A row of women faces a row of men; they take a
    few steps forward, a few steps back, then to one side ... Bored out of his mind,
    Justforix won''t join in. This is stuff for the golden oldies!


    ‘How do they dance in Lutetia? Hey, why don''t I show you?’ And the hip young
    man jumps up on the platform, pushing the bard aside and gyrating wildly in trendy
    modern style. He looks as if he''s dislocating all his joints. The catchy rhythm
    gradually takes the villagers over.


    ![](img/853b795d059a91d2073dcdb59109a4d5_13_0.png)

    ![](img/853b795d059a91d2073dcdb59109a4d5_14_0.png)


    And far away, at the mouth of a narrow fjord, a longship is putting out to sea.
    The square sail with its wide vertical stripes unfurls. In single file, the Vikings
    are carrying their heavy loads aboard the ship. Cryptograf checks that his fool
    of a son hasn''t forgotten anything.


    ‘Club, bludgeon, change of under-armour?’ his deep, cavernous voice Olaf protests.
    ‘Dad, please! I''m not a kid now, and this isn''t my first expedition, you know.’


    He’s right, it isn''t, but there''s a lot at stake. Because if Olaf captures the
    champion of fear he''ll get the chief''s daughter, he''ll get the chief''s position,
    and Cryptograf will get power. All that, however, is rather too complicated for
    poor Olaf to understand.


    Among the crates and chests dumped in the snow near the ship, there is a distinctly
    sinister item. A cage the right size for a human being is waiting to be taken
    aboard.


    ![](img/853b795d059a91d2073dcdb59109a4d5_15_0.png)

    ![](img/853b795d059a91d2073dcdb59109a4d5_16_0.png)


    Dimandahaf is finishing his preparations. His wife Vikea, a real domestic goddess,
    gives him a list of things to bring home: flat-packed easy-assembly furniture,
    candelabras, a set of matching skulls ...


    The back door is flung open if by a gust of wind, and in comes a pretty, lively
    girl with a big trunk on her back, ready for the great adventure. But no way is
    Timandahaf letting his daughter come. "Oh, Dad, please! Why on earth would you
    want to come?" She''s a girl with attitude: after sending her mother flying with
    a kick, she takes a sword to the pillows and soon she''s enveloped in a cloud
    of feathers. When two of them settle under her nose, they tickle. That gives her
    an idea ... And so the oarsmen on the expedition include a slender young man who
    works with a firm stroke. A few locks of red hair escape from his helmet, his
    feathery moustache quivers in the sea breeze, but he keeps going well, no better
    than Cryptograf, who is seasick. Will Cryptograf''s cunning plan work? The longship
    ploughs a furrow through the waves, the clouded sky offers no clues ...


    ![](img/853b795d059a91d2073dcdb59109a4d5_17_0.png)


    In the peaceful Gaulish village, the rooster crows the morning air, but nothing
    wakes Justforix up easily. However, the young man''s initiation into Obelix has
    begun, and everyone knows that the early bird catches the worm. Obelix, a logical
    thinker, tries the kind of wake-up call that he knows will work: he sends Justforix
    flying through the window. Now the daily routine can begin: there are men to deliver,
    boars to hunt, pirates to attack, and Obelix, as the young man''s personal trainer
    and an excellent teacher, shows him how it''s done. Justforix takes refuge with
    his uncle. "Please don''t leave me alone with those lunatics," he begs. So Asterix
    and Obelix are told to find something that Justforix likes to do. They decide
    to show him round a Roman camp. Before they leave, they drink a spoonfulful or
    so of magic potion from the cauldron.


    ![](img/853b795d059a91d2073dcdb59109a4d5_20_0.png)


    On the longship, Olaf is going down the rows of Viking oarsmen, serving dinner.
    ‘Salmon or fish?’ ‘Salmon!’ says the unknown oarsman with the fluffy moustache.
    A faint mist is fogging up Olaf’s brain. Surely he’s never seen this Viking before?
    At that moment the heavy swell of the sea throws the oarsman overboard. He almost
    thinks him out and gets him back on deck, dripping with water. It''s now that
    the young man turns out to be a girl ... and what a girl! With a single sword
    stroke, Timandahaf sends her helmet flying. Her bright red plaits fall to below
