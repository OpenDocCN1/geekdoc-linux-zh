    \n## Chapter 1: Introduction to Linux\nIn this chapter, you will learn:\n- What\
    \ is Linux?\n- Installing VirtualBox on Windows\n- Importing Rocky Linux 9 virtual\
    \ machine on VirtualBox\n- VirtualBox extension pack and guest additions\n\n###\
    \ What is Linux?\n> According to the Linux Foundation (an entity that is dedicated\
    \ to fostering the growth of Linux):\n> \n> Linux is, in simplest terms, an operating\
    \ system. It is the software on a computer that enables applications and the computer\
    \ operator to access the devices on the computer to perform desired functions.\
    \ The operating system (OS) relays instructions from an application to, for instance,\
    \ the computer's processor. The processor performs the instructed task, then sends\
    \ the results back to the application via the operating system.\n\nBesides, Linux\
    \ is both a *multi-user* (in that it allows multiple users on different computers\
    \ or terminals to access a single system with one OS on it) and *multitasking*\
    \ (available processor time is divided between several tasks automatically, creating\
    \ the illusion, so to speak, that the tasks are running simultaneously).\n\n###\
    \ A Little History\nIn 1991, in Helsinki, a computer science student by the name\
    \ of Linus Torvalds began a project that later became the Linux kernel. Development\
    \ was done on Linus' computer, which was equipped with a 80386 processor, the\
    \ MINIX operating system, and the GNU C compiler. As he would write later in his\
    \ book *Just for fun* [2001], Torvalds eventually realized that he had written\
    \ an operating system kernel (a program to allocate resources and talk to the\
    \ hardware, the 'heart' of the operating system, so to speak). The first version\
    \ of the Linux kernel was released under a personal license that restricted commercial\
    \ activity. Later, in the middle of December 1992 he published version 0.99 using\
    \ the GNU GPL. The reason behind this change in this way of licensing had been\
    \ explained earlier by Linus himself in the release notes of version 0.01:\n>\
    \ Sadly, a kernel by itself gets you nowhere. To get a working system you need\
    \ a shell, compilers, a library etc. These are separate parts and may be under\
    \ a stricter (or even looser) copyright. Most of the tools used with linux are\
    \ GNU software and are under the GNU copyleft. These tools aren't in the distribution\
    \ - ask me (or GNU) for more info.\n\nThat is why, from that moment on, Linus\
    \ and GNU project developers worked to integrate GNU components (applications,\
    \ libraries, and developer tools) with the Linux kernel (to make a fully functional\
    \ and free operating system). We must mention at this point that the GNU Project\
    \ had been launched much earlier, (in 1984, to be accurate) by the Free Software\
    \ Foundation (led by a former MIT AI scientist named Richard Stallman) to develop\
    \ the GNU system."
