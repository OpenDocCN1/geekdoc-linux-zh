  md: '# # File Permissions and Ownership


    In **Chapter 2**, you learned to use ls to list files and directories. Let''s
    take a look at the output of ls -l, which provides a detailed listing of a directory''s
    contents or a file''s properties.


    The first character indicates the object type (first highlighted column in the
    below image):


    +   - – represents a regular file.

    - d indicates the object is a directory.

    - l represents a symbolic link (a link, or shortcut, to another object).

    - b indicates the object is a block device. Storage devices fall into this category.


    ![](img/79598d2857a22f9e332d2a8526914a29_19_0.png)


    The next nine characters of the file attributes represent the **file mode**. The
    first 3 characters in this group indicate whether the permissions of the file''s
    owner on a given object.


    The next 2 sets of 3 characters indicate the same information for the file''s
    group owner, and the rest of the system users. For example, let''s examine infoSistema.html
    in the above image:


    +   - It is a regular file.

    - The file''s owner (*user: gacanepa*) has read and write permissions on the file.

    - Other members of the file''s group owner (*group: gacanepa*) will only be able
    to read the file. Same as other system users.


    The easiest way to change a file''s mode is using the chmod command followed by
    an expression that indicates the owner''s rights with the letter u, the group
    owner''s rights'
