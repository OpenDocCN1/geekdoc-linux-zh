    \ and write permissions for the owner, and only read privileges for the rest).\
    \ Hint: use the -perm option as explained in Chapter 4.\n\n## Further Reading\n\
    http://www.tecmint.com/category/bash-shell/\n\nThe very first line of a shell\
    \ script must be as follows (also known as a *shebang*):\n```bash\n#!/bin/bash\n\
    ```\nIt \"tells\" the operating system the name of the interpreter that should\
    \ be used to run the text that follows.\n\nNow it's time to add our commands.\
    \ We can clarify the purpose of each command, or the entire script, by adding\
    \ comments as well. Note that the shell ignores those lines beginning with a pound\
    \ sign # (explanatory comments).\n```bash\n#!/bin/bash\nDATE=$(date +%Y-%m-%d)\n\
    echo \"I am learning shell scripting\"\necho \"Today is $DATE\"\n```\nIn line\
    \ #2, we create a variable named **DATE** with the contents of the command enclosed\
    \ within `$()`. This syntax tells Bash to run whatever command we specify between\
    \ `$()` and assign the output to the variable.\n\nOnce the script has been written\
    \ and saved, we need to make it executable:\n```bash\nchmod +x myscript.sh\n```\n\
    \nBefore running our script, we need to say a few words about the `$PATH` environment\
    \ variable, a special kind of variable that is available from the moment you login\
    \ using a console or a terminal. If we run\n```bash\necho $PATH\n```\nfrom the\
    \ command line, we will see the contents of `$PATH`: a colon-separated list of\
    \ directories that are searched when we enter the name of an executable program.\
    \ It is called an environment variable because it is part of the shell environment\
    \ - a set of information that becomes available for the shell and its child processes\
    \ when the shell is first started. When we type a command and press Enter, the\
    \ shell searches in all the directories listed in the `$PATH` variable and executes\
    \ the first instance that is found.\n\nLet's see an example:\n```bash\n[gacanepa@dev1\
    \ ~]$ echo $PATH\n/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin:/home/gacanepa/.local/bin:/home/gacanepa/bin\n\
    [gacanepa@dev1 ~]$\n```\n\nIf there are two executable files with the same name,\
    \ one in /usr/local/bin and another in /usr/bin, the one in the first directory\
    \ will be executed first, whereas the other will be disregarded. If we haven't\
    \ saved our script inside one of the directories listed in the $PATH variable,\
    \ we need to prepend ./ to the file name in order to execute it:\n```bash\n./myscript.sh\n\
    ```\nOtherwise, we can run it just as we would do with a regular command:\n```bash\n\
    myscript.sh\n```"
  mdcn: "\n## 流程控制\n当你在 shell 脚本中需要根据命令执行的成功或失败指定不同的处理路径时，可以使用 `if` 结构来定义这类条件。其基本语法如下：\n\
    ```bash\nif CONDITION; then\n    COMMANDS\nelse\n    OTHER-COMMANDS\nfi\n```\n\
    其中 `CONDITION` 可以是以下任意一种（这里仅列出最常用的条件），满足对应情况时会被判定为真：\n- [ **-a 文件** ] → 文件存在。\n\
    - [ **-d 文件** ] → 文件存在且为目录。\n- [ **-f 文件** ] → 文件存在且为普通文件。\n- [ **-u 文件** ] →\
    \ 文件存在且其 SUID（设置用户 ID）位已启用。\n- [ **-g 文件** ] → 文件存在且其 SGID 位已启用。\n- [ **-k 文件**\
    \ ] → 文件存在且其粘滞位已启用。\n- [ **-r 文件** ] → 文件存在且可读。\n- [ **-s 文件** ] → 文件存在且非空。\n\
    - [ **-w 文件** ] → 文件存在且可写。\n- [ **-x 文件** ] → 文件存在且可执行。\n- [ **字符串1 = 字符串2** ]\
    \ → 两个字符串相等。\n- [ **字符串1 != 字符串2** ] → 两个字符串不相等。\n- [ **整数1 op 整数2** ]，其中 `op`\
    \ 为以下比较运算符之一：\n  - **-eq** → 整数1等于整数2时结果为真。\n  - **-ne** → 整数1不等于整数2时结果为真。\n \
    \ - **-lt** → 整数1小于整数2时结果为真。\n  - **-le** → 整数1小于等于整数2时结果为真。\n  - **-gt** → 整数1大于整数2时结果为真。\n\
    \  - **-ge** → 整数1大于等于整数2时结果为真。\n\n### 循环\n该循环允许对值列表中的每一个值执行一条或多条命令。其基本语法如下：\n\
    ```bash\nfor item in SEQUENCE; do\n    COMMANDS\ndone\n```\n其中 **item** 是一个通用变量，每次迭代时代表\
    \ **SEQUENCE** 中的一个值。\n\n### While 循环\n该循环只要控制命令的退出状态码为 0（即执行成功），就会持续执行一系列重复命令。其基本语法如下：\n\
    ```bash\nwhile EVALUATION; do\n    EXECUTE_COMMANDS\ndone\n```\n其中 *EVALUATION_COMMAND*\
    \ 可以是任意可判定为真或假的条件，*EXECUTE_COMMANDS* 可以是任意程序、脚本或 shell 结构，包括其他嵌套循环。\n\n### 综合应用\n\
    我们将通过以下示例演示 **if** 结构和 **for** 循环的用法。\n\n### 判断 systemd 系发行版中的服务是否正在运行\n我们先创建一个包含需要一目了然监控的服务列表的文件：\n\
    ![](img/79598d2857a22f9e332d2a8526914a29_36_0.png)\n\n我们的 shell 脚本 *(for_demo.sh)*\
    \ 内容如下：\n```bash\n#!/bin/bash\n# This script iterates over a list of services\
    \ and\n# is used to determine whether they are running or not.\nLIST=$(cat myservices.txt)\n\
    for service in $LIST; do\n    systemctl --quiet is-active $service\n    if [ $?\
    \ -eq 0 ]; then\n        echo \"$service is [ACTIVE]\"\n    else\n        echo\
    \ \"$service is [INACTIVE, NOT INSTALLED, OR UNKNOWN]\"\n    fi\ndone\n```\n\n\
    我们来解释一下这个脚本的运行逻辑：\n- 1）*LIST* 变量的值由 ```cat myservices.txt``` 的输出填充。\n- 2）每次迭代时，*service*\
    \ 代表 *LIST* 中一个元素的值。对 *LIST* 中的每个元素，都会执行以下命令：\n  ```bash\n  systemctl status $service\
    \ | grep --quiet \"running\"\n  ```\n  这次我们需要在通用变量（代表 LIST 中的每个元素）前加上美元符号 `$`，表明它是一个变量，因此需要使用每次迭代时的对应值。随后输出会被传递给\
    \ grep。此时上述命令的退出状态码为 0（在 if 结构中用 *$?* 表示），由此可验证服务正在运行。如果退出状态码不为 0，则说明服务未运行。\n\
    ![](img/79598d2857a22f9e332d2a8526914a29_37_0.png)\n\n我们可以更进一步：在尝试进入 `for` 循环之前，先检查\
    \ `myservices.txt` 文件是否存在：\n```bash\n#!/bin/bash\n# This script iterates over\
    \ a list of services and\n# is used to determine whether they are running or not.\n\
    LIST=$(cat myservices.txt)\nif [ -f myservices.txt ]; then\n    for service in\
    \ $LIST; do\n        systemctl status $service | grep --quiet \"running\"\n  \
    \      if [ $? -eq 0 ]; then\n            echo $service \"is [ACTIVE]\"\n    \
    \    else\n            echo $service \"is [INACTIVE or NOT INSTALLED]\"\n    \
    \    fi\n    done\nelse\n    echo \"myservices.txt is missing\"\nfi\n```\n\n###\
    \ 检测一系列网络/互联网主机的 Ping 回复统计\n你可以将主机列表保存在一个文本文件中，编写脚本定期检查这些主机是否可 ping 通（你可以替换 `myhosts`\
    \ 文件的内容自行尝试）。\n`read` 是 shell 内置命令，它会让 `while` 循环逐行读取 `myhosts` 文件，将每行的内容赋值给变量\
    \ `host`，之后将 `host` 变量传递给 `ping` 命令。\n```bash\n#!/bin/bash\n# This script is used\
    \ to demonstrate the use of a while loop\nwhile read host; do\n    ping -c 2 $host\n\
    done < myhosts\n```\n```bash\n[gacanepa@dev1 ~]$ cat myhosts\n8.8.8.8\n8.8.4.4\n\
    1.2.3.4\ntecmint.com\ngabrielcanepa.com.ar\n[gacanepa@dev1 ~]$\n```\n> read 指令会让\
    \ while 循环遍历 `myhosts` 文件中的每一行，向每个主机发送 2 个测试数据包\n```bash\n#!/bin/bash\n# This\
    \ script is used to demonstrate the use of a while loop\nwhile read host; do\n\
    \    ping -c 2 $host\ndone < myhosts\n```\n\n## 练习 5.1\n### 5.1.1\n编写一个 shell\
    \ 脚本，将当前运行进程的列表保存到当前目录下名为 *process_list.txt* 的文件中。使用自定义格式仅显示 PID、PPID、CMD、%CPU\
    \ 和 %MEM 字段，并按照 %CPU 降序排列。\n\n### 5.1.2\n编写一个 shell 脚本，查找所有权限为 777（系统中所有用户都拥有读、写、执行权限）的文件，并将它们的权限修改为\
    \ 644（文件所有者拥有读、写权限，其余用户仅拥有读权限）。提示：使用第 4 章中介绍的 `-perm` 选项。\n\n## 延伸阅读\n[Bash Shell\
    \ 相关教程](http://www.tecmint.com/category/bash-shell/)\n\nshell 脚本的第一行必须是如下内容（也被称为\
    \ *shebang*）：\n```bash\n#!/bin/bash\n```\n它会“告诉”操作系统，后续的文本应该使用哪个解释器来执行。\n\n现在我们可以添加自己的命令了。同时也可以通过添加注释来说明每条命令乃至整个脚本的作用。注意，shell\
    \ 会忽略以井号 `#` 开头的行（即解释性注释）。\n```bash\n#!/bin/bash\nDATE=$(date +%Y-%m-%d)\necho\
    \ \"I am learning shell scripting\"\necho \"Today is $DATE\"\n```\n\n在第 2 行，我们创建了一个名为\
    \ **DATE** 的变量，其值为被包裹在 `$()` 中的命令的输出。这个语法会指示 Bash 运行我们在 `$()` 中指定的任意命令，并将其输出赋值给该变量。\n\
    \n脚本编写并保存完成后，我们需要为其添加可执行权限：\n```bash\nchmod +x myscript.sh\n```\n\n在运行脚本之前，我们需要先介绍一下\
    \ `$PATH` 环境变量：这是一种特殊变量，从你通过控制台或终端登录的那一刻起就会生效。\n如果在命令行中运行 ```bash echo $PATH ```，我们就能看到\
    \ `$PATH` 的内容：它是一个用冒号分隔的目录列表，当我们输入可执行程序的名称时，shell 会在这个列表中的目录里搜索对应的程序。\n它之所以被称为环境变量，是因为它是\
    \ shell 环境的一部分——shell 环境是一组信息，在 shell 首次启动时就会对其自身及其子进程开放。\n当我们输入命令并按下回车键时，shell\
    \ 会在 `$PATH` 变量列出的所有目录中搜索，并执行第一个找到的目标程序。\n\n我们来看一个示例：\n```bash\n[gacanepa@dev1\
    \ ~]$ echo $PATH\n/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin:/home/gacanepa/.local/bin:/home/gacanepa/bin\n\
    [gacanepa@dev1 ~]$\n```\n\n如果存在两个同名的可执行文件，一个位于 `/usr/local/bin` 目录，另一个位于 `/usr/bin`\
    \ 目录，那么第一个目录中的文件会先被执行，另一个则会被忽略。\n如果我们的脚本没有保存在 `$PATH` 变量列出的某个目录下，就需要在文件名前加上 `./`\
    \ 前缀来执行它：\n```bash\n./myscript.sh\n```\n否则，我们就可以像运行普通命令一样执行它：\n```bash\nmyscript.sh\n\
    ```\n"
