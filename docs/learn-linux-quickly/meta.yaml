    \ by modification time.\n\nFor example,\n\n+   - `ls -a` will display the names\
    \ of all the objects inside the current working directory, hidden or not.\n- `ls\
    \ -la /var` will return a long directory listing of the contents of the `/var`\
    \ directory.\n- `ls -lt ../` will show a long directory listing of the current\
    \ working directory's parent.\n- `ls -l /home/student/files/info.txt` will return\
    \ a long directory listing of a file named *info.txt* located inside `/home/student/files`\
    \ if it exists, or an error message if it does not.\n\n# ## Exercises 1.1\n\n\
    In these exercises, you will write the commands to perform the following actions:\n\
    \n+   - 1.1.1: Change the current working directory to `/etc`. Then move to `/var/log`\
    \ using a relative path.\n- 1.1.2: Refer to the man page of `ls` to find out what\
    \ option should be used to return a long directory listing of `/var/log` (not\
    \ its contents)."
  - '[PAGE 13]


    1.1.3: Display a long directory listing of */usr* ordered by modification time,
    newest first.


    1.1.4: Navigate to the root directory using **cd** / and then list its contents
    with **ls**. Check the [FHS documentation](https://fsstnd.org) to learn more about
    each of the subdirectories found inside.


    # **More commands to work with files and directories**


    The following commands are often used while working with files and directories
    in the command line:


    +   - **touch** is used followed by a filename. If the file exists, **touch**
    will update its modification time (you can verify this with **ls -l** followed
    by the filename before and after doing **touch**). Otherwise, an empty file will
    be created with the name of the argument. For example, if *myfile.txt* does not
    exist inside the current directory, **touch myfile.txt** will create an empty
    file named *myfile.txt* in the said location.

    - **rm** (short for remove) followed by a filename will remove the file in question.
    For example, **rm myfile.txt** will remove *myfile.txt* from the current working
    directory.

    - **mkdir** followed by an argument will create a new directory. For example,
    **mkdir me** will create a directory named *me* inside the current directory.
    However, **mkdir me/otherdir** will fail if *me* does not already exist. To avoid
    this, use the **-p** option to create a directory structure that starts with a
    missing parent. In other words, **mkdir -p me/otherdir** will create a directory
    named *me* and a subdirectory called *otherdir* inside *me* in the same operation.

    - **rmdir** is analogous to **rm**, but for directories. To remove a directory
    with this command, it must be empty.

    - **cp**, besides the optional flags, requires two arguments. It is often used
    to copy the contents of one file (first argument) into another (second argument).
    For example, **cp file1.txt file2.txt** will copy the contents of *file1.txt*
    into *file2.txt*.

    - **mv** operates almost identically than **cp**, only that it is used to move
    a file or directory (first argument) to a different location (second argument)
    when both arguments represent existing objects. If the second argument does not
    correspond to an existing object, **mv** will remove the first argument to the
    second one. For example, let us suppose that both *dir1* and *dir2* exist, whereas
    *dir3* does not. In that scenario, **mv dir1 dir2** will move *dir1* to *dir2*,
    thus becoming a subdirectory of the latter. On the other hand, **mv dir1 dir3**
    will rename *dir1* to *dir3*.


    Note: You can use either relative or absolute paths with the above commands.'
  - '[PAGE 14]


    # Exercises 1.2


    1.2.1: The commands associated with removing or renaming files or directories
    should be used with caution. All of them provide an option that prompts the user
    for confirmation before actually performing the operation. Consult the man pages
    to find out what option should be used in this case.


    1.2.2: Create an entire structure as files/personal/2017 inside the current directory
    using only one command.


    1.2.3: Create an empty file inside files/personal/2017. Use `ls -l` to verify
    its last modification time and update it, then check again.


    # Redirection and Pipelines


    To store the output of a given command in a file for later inspection, we will
    use the redirection operators. Depending on whether you want to overwrite the
    contents of a file or append to them, you will use > or >>, respectively. For
    example, `ls -l` > longdirectorylisting.txt will create a file named longdirectorylisting.txt
    inside the current directory (if it does not exist already) and write the output
    of `ls -l` to it. If the file exists and is not empty, use >> instead to avoid
    overwriting its contents, since > will replace them with the output of the command.


    A classic use of redirection is writing a text string to a file using the **echo**
    command as follows:


    ```

    echo "I love Tecmint.com" > testfile.txt

    ```


    will write the message within quotes to a file named *testfile.txt* in the current
    directory.


    On the other hand, we can chain several commands together using pipelines, represented
    by a vertical bar (|).


    When two or more commands are thus chained together, the output of the first is
    sent as input to the second, and so on.


    The advantage of using pipelines will become evident as we learn more and more
    commands. When we reach that point, we will recall what we have said in this chapter.


    # History and Tab Completion


    After working with the command line for some time, you may want to repeat a command
    previously executed.


    To facilitate this, the shell keeps a history that you can access using the **history**
    (surprise!) command.'
  - '[PAGE 15]


    When you type history in the command line and press Enter, the command history
    will be listed with line numbers. A command in the history list can be repeated
    by typing the command number preceded by an exclamation sign.


    For example, the following excerpt shows some commands in the history list. In
    the following example, the output has been truncated for the sake of brevity and
    shows a portion of the command history:


    ```

    ...

    253  cd /var/log

    254  cd /home/student

    255  ls -lt /home/student

    ...

    ```


    If we want to execute **cd /home/student**, we can just type **!254** and press
    Enter.


    As we can see, this way of entering commands can come in handy when we want to
    repeat long entries in the history list.


    Additionally, Bash provides a very useful feature known as tab completion. It
    allows you to autocomplete a command after typing a partial name and pressing
    the *Tab* key twice.


    When multiple completions are possible, then all of them will be listed. For example,
    type *whi* and press Tab twice. Based on your system, you will get more or less
    results, but should be similar to:


    ```

    which     which-nodejs   while     whiptail

    ```


    On the other hand, if you do the same after typing *wha*, most likely you will
    only get **whatis** as result.


