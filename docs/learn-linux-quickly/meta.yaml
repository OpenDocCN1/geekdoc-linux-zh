    # ## Chapter 6 – Linux Shell Scripts


    In this chapter, you will learn:


    +   - Shell scripts with Bash

    - Environment Variables

    - Variable substitution

    - Shell expansion

    - Extra reading (links to related Tecmint articles)

    - Exercises


    In simple words, a shell script is nothing less and nothing more than a plain
    text file. Thus, it can be created and edited using our preferred text editor.
    We will use vim in the following examples, but you may choose whatever one you
    like.


    Type


    ```

    vim myscript.sh

    ```


    and press Enter.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'The very first line of a shell script must be as follows (also known as a *shebang*):


    ```

    #!/bin/bash

    ```


    It "tells" the operating system the name of the interpreter that should be used
    to run the text that follows.


    Now it''s time to add our commands. We can clarify the purpose of each command,
    or the entire script, by adding comments as well. Note that the shell ignores
    those lines beginning with a pound sign # (explanatory comments).


    ```

    #!/bin/bash

    DATE=$(date +%Y-%m-%d)

    echo "I am learning shell scripting"

    echo "Today is $DATE"

    ```


    In line #2, we create a variable named **DATE** with the contents of the command
    enclosed within `$()`. This syntax tells Bash to run whatever command we specify
    between `$()` and assign the output to the variable.


    Once the script has been written and saved, we need to make it executable:


    ```

    chmod +x myscript.sh

    ```


    Before running our script, we need to say a few words about the `$PATH` environment
    variable, a special kind of variable that is available from the moment you login
    using a console or a terminal. If we run


    ```

    echo $PATH

    ```


    from the command line, we will see the contents of `$PATH`: a colon-separated
    list of directories that are searched when we enter the name of a executable program.
    It is called an environment variable because it is part of the shell environment
    - a set of information that becomes available for the shell and its child processes
    when the shell is first started.


    When we type a command and press Enter, the shell searches in all the directories
    listed in the `$PATH` variables and executes the first instance that is found.
    Let''s see an example:


    ```

    [gacanepa@dev1 ~]$ echo $PATH

    /usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin:/home/gacanepa/.local/bin:/home/gacanepa/bin

    [gacanepa@dev1 ~]$

    ```'
  merge: -1
  pgno: 33
