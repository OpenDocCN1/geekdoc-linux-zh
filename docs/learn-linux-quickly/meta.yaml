    \ followed by the name of the command and press Enter.\n\nA text document known\
    \ as the man page of the command will open. To scroll down or up, use the arrows\
    \ of your keyboard, and press the letter Q when you want to exit.\n\nLet's consider\
    \ the following examples to illustrate.\n\n+   - To print the path of the current\
    \ working directory, use **pwd**. This command does not take any optional flags\
    \ nor requires an argument.\n- To change to another location in the directory\
    \ tree, use **cd** followed by a relative or absolute path. For example:\n  -\
    \ **cd Documents** will change the working directory to a directory named Documents\
    \ inside the current one. In this case, a relative path is used since it is given\
    \ starting at the current directory."
- md: "- `cd /home/student/files` will change the working directory to `/home/student/files`.\
    \ This is an example of an absolute path since it is indicated starting at the\
    \ root (/) directory.\n- In the above examples, both *Documents* and `/home/student/files`\
    \ are arguments passed to the `cd` command.\n- Additionally, `cd` accepts the\
    \ following arguments:\n  - `cd ~` or `cd` (without arguments) will change to\
    \ the current user's home directory.\n  - `cd ..` will change to the parent directory\
    \ of the current one.\n  - `cd ../../` will move two levels up the tree.\n\nTo\
    \ view detailed information about files and directories, we will use `ls` followed\
    \ by an optional flag (or more) and a file or directory name. When used without\
    \ arguments, `ls` will return information about the objects inside the current\
    \ working directory. These are the most used flags:\n- `-l` returns a long directory\
    \ listing. This includes not only the names of the objects (files and directories,\
    \ for example) inside the current working directory, but also the access permissions\
    \ (we will revisit this topic in the next chapter) and the owners of each object.\n\
    - `-a` causes `ls` to return hidden files, whose names start with a dot (.). Hidden\
    \ files are often used as configuration files, and to store user preferences.\n\
    - `-t` tells `ls` to order the results by modification time. For example,\n  -\
    \ `ls -a` will display the names of all the objects inside the current working\
    \ directory, hidden or not.\n  - `ls -la /var` will return a long directory listing\
    \ of the contents of the `/var` directory.\n  - `ls -lt ../` will show a long\
    \ directory listing of the current working directory's parent.\n  - `ls -l /home/student/files/info.txt`\
    \ will return a long directory listing of a file named *info.txt* located inside\
    \ `/home/student/files` if it exists, or an error message if it does not.\n\n\
    ### Exercises 1.1\nIn these exercises, you will write the commands to perform\
    \ the following actions:\n- 1.1.1: Change the current working directory to `/etc`.\
    \ Then move to `/var/log` using a relative path.\n- 1.1.2: Refer to the man page\
    \ of `ls` to find out what option should be used to return a long directory listing\
    \ of `/var/log` (not its contents).\n- 1.1.3: Display a long directory listing\
    \ of */usr* ordered by modification time, newest first.\n- 1.1.4: Navigate to\
    \ the root directory using `cd /` and then list its contents with `ls`. Check\
    \ the [FHS documentation](https://fsstnd.org) to learn more about each of the\
    \ subdirectories found inside.\n\n## More commands to work with files and directories\n\
    The following commands are often used while working with files and directories\
    \ in the command line:\n- **touch** is used followed by a filename. If the file\
    \ exists, **touch** will update its modification time (you can verify this with\
    \ **ls -l** followed by the filename before and after doing **touch**). Otherwise,\
    \ an empty file will be created with the name of the argument. For example, if\
    \ *myfile.txt* does not exist inside the current directory, **touch myfile.txt**\
    \ will create an empty file named *myfile.txt* in the said location.\n- **rm**\
    \ (short for remove) followed by a filename will remove the file in question.\
    \ For example, **rm myfile.txt** will remove *myfile.txt* from the current working\
    \ directory.\n- **mkdir** followed by an argument will create a new directory.\
    \ For example, **mkdir me** will create a directory named *me* inside the current\
    \ directory. However, **mkdir me/otherdir** will fail if *me* does not already\
    \ exist. To avoid this, use the **-p** option to create a directory structure\
    \ that starts with a missing parent. In other words, **mkdir -p me/otherdir**\
    \ will create a directory named *me* and a subdirectory called *otherdir* inside\
    \ *me* in the same operation.\n- **rmdir** is analogous to **rm**, but for directories.\
    \ To remove a directory with this command, it must be empty.\n- **cp**, besides\
    \ the optional flags, requires two arguments. It is often used to copy the contents\
    \ of one file (first argument) into another (second argument). For example, **cp\
    \ file1.txt file2.txt** will copy the contents of *file1.txt* into *file2.txt*.\n\
    - **mv** operates almost identically to **cp**, only that it is used to move a\
    \ file or directory (first argument) to a different location (second argument)\
    \ when both arguments represent existing objects. If the second argument does\
    \ not correspond to an existing object, **mv** will rename the first argument\
    \ to the second one. For example, let us suppose that both *dir1* and *dir2* exist,\
    \ whereas *dir3* does not. In that scenario, **mv dir1 dir2** will move *dir1*\
    \ to *dir2*, thus becoming a subdirectory of the latter. On the other hand, **mv\
    \ dir1 dir3** will rename *dir1* to *dir3*. Note: You can use either relative\
    \ or absolute paths with the above commands.\n\n### Exercises 1.2\n1.2.1: The\
    \ commands associated with removing or renaming files or directories should be\
    \ used with caution. All of them provide an option that prompts the user for confirmation\
    \ before actually performing the operation. Consult the man pages to find out\
    \ what option should be used in this case.\n1.2.2: Create an entire structure\
    \ as files/personal/2017 inside the current directory using only one command.\n\
    1.2.3: Create an empty file inside files/personal/2017. Use `ls -l` to verify\
    \ its last modification time and update it, then check again.\n\n## Redirection\
    \ and Pipelines\nTo store the output of a given command in a file for later inspection,\
    \ we will use the redirection operators. Depending on whether you want to overwrite\
    \ the contents of a file or append to them, you will use `>` or `>>`, respectively.\
    \ For example, `ls -l > longdirectorylisting.txt` will create a file named longdirectorylisting.txt\
    \ inside the current directory (if it does not exist already) and write the output\
    \ of `ls -l` to it. If the file exists and is not empty, use `>>` instead to avoid\
    \ overwriting its contents, since `>` will replace them with the output of the\
    \ command.\n\nA classic use of redirection is writing a text string to a file\
    \ using the **echo** command as follows:\n```\necho \"I love Tecmint.com\" > testfile.txt\n\
    ```\nwill write the message within quotes to a file named *testfile.txt* in the\
    \ current directory.\n\nOn the other hand, we can chain several commands together\
    \ using pipelines, represented by a vertical bar (`|`). When two or more commands\
    \ are thus chained together, the output of the first is sent as input to the second,\
    \ and so on. The advantage of using pipelines will become evident as we learn\
    \ more and more commands. When we reach that point, we will recall what we have\
    \ said in this chapter.\n\n## History and Tab Completion\nAfter working with the\
    \ command line for some time, you may want to repeat a command previously executed.\
    \ To facilitate this, the shell keeps a history that you can access using the\
    \ **history** (surprise!) command.\n\nWhen you type `history` in the command line\
    \ and press Enter, the command history will be listed with line numbers. A command\
    \ in the history list can be repeated by typing the command number preceded by\
    \ an exclamation sign. For example, the following excerpt shows some commands\
    \ in the history list. In the following example, the output has been truncated\
    \ for the sake of brevity and shows a portion of the command history:\n```\n...\n\
    253 cd /var/log\n254 cd /home/student\n255 ls -lt /home/student\n...\n```\nIf\
    \ we want to execute `cd /home/student`, we can just type `!254` and press Enter.\
    \ As we can see, this way of entering commands can come in handy when we want\
    \ to repeat long entries in the history list.\n\nAdditionally, Bash provides a\
    \ very useful feature known as tab completion. It allows you to autocomplete a\
    \ command after typing a partial name and pressing the *Tab* key twice. When multiple\
    \ completions are possible, then all of them will be listed. For example, type\
    \ *whi* and press Tab twice. Based on your system, you will get more or less results,\
    \ but should be similar to:\n```\nwhich\nwhich-nodejs\nwhile\nwhiptail\n```\n\
    On the other hand, if you do the same after typing *wha*, most likely you will\
    \ only get **whatis** as result.\n\n### Exercises 1.3\n**1.3.1:** Write a text\
    \ string of your choice to a file named *mychoice.txt*. Use the right redirection\
    \ operator to write another line without overwriting the existing contents of\
    \ the said file. Then use the **cat** command, followed by the filename (`cat\
    \ mychoice.txt`) to display the contents of the file.\n\n**1.3.2:** Repeat the\
    \ exercise of tab completion. Type **ch** and press *Tab* twice. Take note of\
    \ 3 commands out of the resulting list and use the **whatis** command to find\
    \ out what it is used for. Note you'll have to consult the man page of **whatis**\
    \ first.\n\n© 2022 Tecmint.com - Last Revised: July 2022 - All Rights Reserved"
