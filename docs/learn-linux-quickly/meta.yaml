    ## Appendix A - Compression and Archiving

    A file archiving tool groups a set of files into a single standalone file that
    we can backup to several types of media, transfer across a network, or send via
    email. The most frequently used archiving utility in Linux is **tar**. When an
    archiving utility is used along with a compression tool, it allows to reduce the
    disk size that is needed to store the same files and information.


    ### The tar utility

    **tar** bundles a group of files together into a single archive (commonly called
    a **tar file** or **tarball**). The name originally stood for tape **archiver**,
    but we must note that we can use this tool to archive data to any kind of writeable
    media (not only to tapes). **Tar** is normally used with a compression tool such
    as gzip, bzip2, or xz to produce a compressed tarball.

    **Basic syntax:**

    ``` tar [options] [path ...] ```

    where ... represents the expression used to specify which files should be acted
    upon.


    ### Most commonly used tar commands

    | Long option | Abbreviation | Description |

    | --- | --- | --- |

    | --create | c | Creates a tar archive |

    | --concatenate | A | Appends tar files to an archive |

    | --append | r | Appends files to the end of an archive |

    | --update | u | Appends files newer than copy in archive |

    | --diff or --compare | d | Find differences between archive and file system |

    | --file ARCHIVE | f | Use archive file or device ARCHIVE |

    | --list | t | Lists the contents of a tarball |

    | --extract or --get | x | Extracts files from an archive |


    ### Normally used operation modifiers

    | Long option | Abbreviation | Description |

    | --- | --- | --- |

    | --directory dir | C | Changes to directory **dir** before performing operations
    |

    | --same-permissions | p | Preserves original permissions |

    | --verbose | v | Lists all files read or extracted. When this flag is used along
    with --list, the file sizes, ownership, and time stamps are displayed. |

    | --verify | W | Verifies the archive after writing it |

    | --exclude file | --- | Excludes file from the archive |

    | --exclude=pattern | X | Exclude files, given as a PATTERN |

    | --gzip or --gunzip | z | Processes an archive through gzip |

    | --bzip2 | j | Processes an archive through bzip2 |

    | --xz | J | Processes an archive through xz |


    ### The Gzip utility

    Gzip is the oldest compression tool and provides the least compression, while
    bzip2 provides improved compression. In addition, xz is the newest but (usually)
    provides the best compression. These advantages of best compression come at a
    price: the time it takes to complete the operation, and system resources used
    during the process. Normally, tar files compressed with these utilities have .gz,
    .bz2, or .xz extensions, respectively. In the following examples we will be using
    these files: file1, file2, file3, file4, and file5.


    ### **EXAMPLE 1**: Group all the files in the current working directory and compress
    the resulting bundle with gzip, bzip2, and xz (please note the use of a regular
    expression to specify which files should be included in the bundle - this is to
    prevent the archiving tool to group the tarballs created in previous steps)

    ``` tar czf myfiles.tar.gz file[0-9]

    tar cjf myfiles.tar.bz2 file[0-9]

    tar cJf myfiles.tar.xz file[0-9] ```

    ![](img/79598d2857a22f9e332d2a8526914a29_50_0.png)


    ### **EXAMPLE 2**: List the contents of a tarball and display the same information
    as a long directory listing. Note that update or append operations cannot be applied
    to compressed files directly (if you need to update or append a file to a compressed
    tarball, you need to uncompress the tar file and update / append to it, then compress
    again)

    ``` tar tvf [tarball] ```

    ![](img/79598d2857a22f9e332d2a8526914a29_50_1.png)

    Run any of the following commands:

    - gzip -d myfiles.tar.gz

    - bzip2 -d myfiles.tar.bz2

    - xz -d myfiles.tar.xz

    Then

    ``` tar --delete --file myfiles.tar file4 (deletes the file inside the tarball)
    ```

    ``` tar --update --file myfiles.tar file4 (adds the updated file) ```

