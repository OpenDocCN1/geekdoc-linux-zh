  md: "![](img/79598d2857a22f9e332d2a8526914a29_11_0.png)\n\nwhere the *gacanepa*\
    \ is the current username and *desktop* is the hostname. With that said, let's\
    \ dive into the amazing world of the Linux command line!\n\n# ## Navigating the\
    \ System\n\nIf we log into Linux using a text-mode login screen, chances are we\
    \ will be dropped directly into our default shell.\n\nOn the other hand, if we\
    \ log into Linux using a graphical user interface (GUI) login screen, we will\
    \ have to open a shell manually by starting a terminal.\n\nEither way, we will\
    \ be presented with the user prompt and we can start typing and executing commands\
    \ (a command is executed by pressing the Enter key after we have typed it).\n\n\
    Commands are composed of two parts:\n\n1) the name of the command itself (along\
    \ with one or more optional flags preceded by a hyphen), and\n\n2) arguments.\n\
    \nTo view the list of available options and / or required arguments, type **man**\
    \ followed by the name of the command and press Enter.\n\nA text document known\
    \ as the man page of the command will open. To scroll down or up, use the arrows\
    \ of your keyboard, and press the letter Q when you want to exit.\n\nLet's consider\
    \ the following examples to illustrate.\n\n+   - To print the path of the current\
    \ working directory, use **pwd**. This command does not take any optional flags\
    \ nor requires an argument.\n- To change to another location in the directory\
    \ tree, use **cd** followed by a relative or absolute path. For example:\n  -\
    \ **cd Documents** will change the working directory to a directory named Documents\
    \ inside the current one. In this case, a relative path is used since it is given\
    \ starting at the current directory."
  merge: -1
  pgno: 11
- img_proc: true
  md: "+   - `cd /home/student/files` will change the working directory to `/home/student/files`.\
    \ This is an example of an absolute path since it is indicated starting at the\
    \ root (/) directory.\n- In the above examples, both *Documents* and `/home/student/files`\
    \ are arguments passed to the `cd` command.\n- Additionally, `cd` accepts the\
    \ following arguments:\n  - `cd ~` or `cd` (without arguments) will change to\
    \ the current user's home directory.\n  - `cd ..` will change to the parent directory\
    \ of the current one.\n  - `cd ../../` will move two levels up the tree.\n\nTo\
    \ view detailed information about files and directories, we will use `ls` followed\
    \ by an optional flag (or more) and a file or directory name. When used without\
    \ arguments, `ls` will return information about the objects inside the current\
    \ working directory. These are the most used flags:\n\n+   - `-l` returns a long\
    \ directory listing. This includes not only the names of the objects (files and\
    \ directories, for example) inside the current working directory, but also the\
    \ access permissions (we will revisit this topic in the next chapter) and the\
    \ owners of each object.\n- `-a` causes `ls` to return hidden files, whose names\
    \ start with a dot (.). Hidden files are often used as configuration files, and\
    \ to store user preferences.\n- `-t` tells `ls` to order the results by modification\
    \ time.\n\nFor example,\n\n+   - `ls -a` will display the names of all the objects\
    \ inside the current working directory, hidden or not.\n- `ls -la /var` will return\
    \ a long directory listing of the contents of the `/var` directory.\n- `ls -lt\
    \ ../` will show a long directory listing of the current working directory's parent.\n\
    - `ls -l /home/student/files/info.txt` will return a long directory listing of\
    \ a file named *info.txt* located inside `/home/student/files` if it exists, or\
    \ an error message if it does not.\n\n# ## Exercises 1.1\n\nIn these exercises,\
