- md: "## Flow Control\n\nWhenever you need to specify different courses of action\
    \ to be taken in a shell script, as result of the success or failure of a command,\
    \ you will use the if construct to define such conditions. Its basic syntax is:\n\
    ```bash\nif CONDITION; then\n    COMMANDS\nelse\n    OTHER-COMMANDS\nfi\n```\n\
    where CONDITION can be one of the following (only the most frequent conditions\
    \ are cited here) and evaluates to true when:\n- [ **-a file** ] → file exists.\n\
    - [ **-d file** ] → file exists and is a directory.\n- [ **-f file** ] → file\
    \ exists and is a regular file.\n- [ **-u file** ] → file exists and its SUID\
    \ (set user ID) bit is set.\n- [ **-g file** ] → file exists and its SGID bit\
    \ is set.\n- [ **-k file** ] → file exists and its sticky bit is set.\n- [ **-r\
    \ file** ] → file exists and is readable.\n- [ **-s file** ] → file exists and\
    \ is not empty.\n- [ **-w file** ] → file exists and is writable.\n- [ **-x file**\
    \ ] → file exists and is executable.\n- [ **string1 = string2** ] → the strings\
    \ are equal.\n- [ **string1 != string2** ] → the strings are not equal.\n- [ **int1\
    \ op int2** ] where op is one of the following comparison operators:\n  - **-eq**\
    \ → is true if int1 is equal to int2.\n  - **-ne** → true if int1 is not equal\
    \ to int2.\n  - **-lt** → true if int1 is less than int2.\n  - **-le** → true\
    \ if int1 is less than or equal to int2.\n  - **-gt** → true if int1 is greater\
    \ than int2.\n  - **-ge** → true if int1 is greater than or equal to int2.\n\n\
    ### Loops\nThis loop allows to execute one or more commands for each value in\
    \ a list of values. Its basic syntax is:\n```bash\nfor item in SEQUENCE; do\n\
    \    COMMANDS\ndone\n```\nwhere **item** is a generic variable that represents\
    \ each value in **SEQUENCE** during each iteration.\n\n### While Loops\nThis loop\
    \ allows to execute a series of repetitive commands as long as the control command\
    \ executes with an exit status equal to zero (successfully). Its basic syntax\
    \ is:\n```bash\nwhile EVALUATION; do\n    EXECUTE_COMMANDS\ndone\n```\nwhere *EVALUATION_COMMAND*\
    \ can be any condition that can evaluate to true or false, and *EXECUTE_COMMANDS*\
    \ can be any program, script or shell construct, including other nested loops.\n\
    \n### Putting it all Together\nWe will demonstrate the use of the **if** construct\
    \ and the **for** loop with the following example.\n\n### Determining if a service\
    \ is running in a systemd-based distro\nLet's create a file with a list of services\
    \ that we want to monitor at a glance:\n![](img/79598d2857a22f9e332d2a8526914a29_36_0.png)\n\
    \nOur shell script *(for_demo.sh)* should look like:\n```bash\n#!/bin/bash\n#\
    \ This script iterates over a list of services and\n# is used to determine whether\
    \ they are running or not.\nLIST=$(cat myservices.txt)\nfor service in $LIST;\
    \ do\n    systemctl --quiet is-active $service\n    if [ $? -eq 0 ]; then\n  \
    \      echo \"$service is [ACTIVE]\"\n    else\n        echo \"$service is [INACTIVE,\
    \ NOT INSTALLED, OR UNKNOWN]\"\n    fi\ndone\n```\n\nLet's explain how the script\
    \ works:\n- 1) The *LIST* variable is populated with the output of ```cat myservices.txt```\n\
    - 2) During each iteration, *service* represents the value of an element inside\
    \ *LIST*. For each element of *LIST*, the following command will be executed:\n\
    \  ```bash\n  systemctl status $service | grep --quiet \"running\"\n  ```\n  This\
    \ time we need to precede our generic variable (which represents each element\
    \ in LIST) with a dollar sign to indicate it's a variable and thus its value in\
    \ each iteration should be used. The output is then piped to grep. When that happens,\
    \ the above command returns an exit status of 0 (represented by *$?* in the if\
    \ construct), thus verifying that the service is running. An exit status different\
    \ than 0 indicates that the service is not running.\n![](img/79598d2857a22f9e332d2a8526914a29_37_0.png)\n\
    \nWe could go one step further and check for the existence of myservices.txt before\
    \ even attempting to enter the for loop:\n```bash\n#!/bin/bash\n# This script\
    \ iterates over a list of services and\n# is used to determine whether they are\
    \ running or not.\nLIST=$(cat myservices.txt)\nif [ -f myservices.txt ]; then\n\
    \    for service in $LIST; do\n        systemctl status $service | grep --quiet\
    \ \"running\"\n        if [ $? -eq 0 ]; then\n            echo $service \"is [ACTIVE]\"\
    \n        else\n            echo $service \"is [INACTIVE or NOT INSTALLED]\"\n\
    \        fi\n    done\nelse\n    echo \"myservices.txt is missing\"\nfi\n```\n\
    \n### Pinging a series of network or internet hosts for reply statistics\nYou\
    \ may want to maintain a list of hosts in a text file and use a script to determine\
    \ every now and then whether they're pingable or not (feel free to replace the\
    \ contents of myhosts and try for yourself). The read shell built-in command tells\
    \ the while loop to read myhosts line by line and assigns the content of each\
    \ line to variable host, which is then passed to the ping command.\n```bash\n\
    #!/bin/bash\n# This script is used to demonstrate the use of a while loop\nwhile\
    \ read host; do\n    ping -c 2 $host\ndone < myhosts\n```\n\n```bash\n[gacanepa@dev1\
    \ ~]$ cat myhosts\n8.8.8.8\n8.8.4.4\n1.2.3.4\ntecmint.com\ngabrielcanepa.com.ar\n\
    [gacanepa@dev1 ~]$\n```\n> read instructs the while loop to iterate through myhosts\
    \ and send 2 test packets to each of them\n\n```bash\n#!/bin/bash\n# This script\
    \ is used to demonstrate the use of a while loop\nwhile read host; do\n    ping\
    \ -c 2 $host\ndone < myhosts\n```\n\n## Exercises 5.1\n### 5.1.1\nWrite a shell\
    \ script that saves the list of running processes to a file named *process_list.txt*\
    \ in the current directory. Use the custom format to display only the PID, PPID,\
