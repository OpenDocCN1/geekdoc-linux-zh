    # ## Chapter 1: Introduction to Linux


    In this chapter, you will learn:


    +   - What is Linux?

    - Installing VirtualBox on Windows

    - Importing Rocky Linux 9 virtual machine on VirtualBox

    - VirtualBox extension pack and guest additions


    # ## What is Linux?


    According to the Linux Foundation (an entity that is dedicated to fostering the
    growth of Linux):


    > > Linux is, in simplest terms, an operating system. It is the software on a
    computer that enables applications and the computer operator to access the devices
    on the computer to perform desired functions. The operating system (OS) relays
    instructions from an application to, for instance, the computer''s processor.
    The processor performs the instructed task, then sends the results back to the
    application via the operating system.'
  merge: -1
  pgno: 3
- img_proc: true
  md: 'Besides, Linux is both a *multi-user* (in that it allows multiple users on
    different computers or terminals to access a single system with one OS on it)
    and *multitasking* (available processor time is divided between several tasks
    automatically, creating the illusion, so to speak, that the tasks are running
    simultaneously).


    # ## A Little History


    In 1991, in Helsinki, a computer science student by the name of Linus Torvalds
    began a project that later became the Linux kernel.


    Development was done on Linus'' computer, which was equipped with a 80386 processor,
    the MINIX operating system, and the GNU C compiler.


    As he would write later in his book *Just for fun* [2001], Torvalds eventually
    realized that he had written an operating system kernel (a program to allocate
    resources and talk to the hardware, the ''heart'' of the operating system, so
    to speak).


    The first version of the Linux kernel was released under a personal license that
    restricted commercial activity. Later, in the middle of December 1992 he published
    version 0.99 using the GNU GPL.


    The reason behind this change in this way of licensing had been explained earlier
    by Linus himself in the release notes of version 0.01:


    > > Sadly, a kernel by itself gets you nowhere. To get a working system you need
    a shell, compilers, a library etc. These are separate parts and may be under a
    stricter (or even looser) copyright. Most of the tools used with linux are GNU
    software and are under the GNU copyleft. These tools aren''t in the distribution
    - ask me (or GNU) for more info.


    That is why, from that moment on, Linus and GNU project developers worked to integrate
    GNU components (applications, libraries, and developer tools) with the Linux kernel
    (to make a fully functional and free operating system).


    We must mention at this point that the GNU Project had been launched much earlier,
    (in 1984, to be accurate) by the Free Software Foundation (led by a former MIT
    AI scientist named Richard Stallman) to develop the GNU system.'
  merge: -1
  pgno: 4
- img_proc: true
  md: '# ## Running Linux for the First Time


    First off, let us clarify that when we use the word Linux nowadays, we usually
    refer to a Linux distribution, a fully-functional operating system that consists
    of the kernel and a series of application programs and libraries.


    There are at least two ways to start experimenting with Linux. You can boot your
    computer using a live CD/DVD or USB stick, or installing a virtualization platform
    such as *VirtualBox*.


    The first option (booting your computer using a live CD/DVD or USB stick) will
    not make any modifications to your storage devices.


    Linux will run directly from the media device, and you will be able to test the
    operating system before actually installing it. If you decide you like it, you
    can later install it using the built-in wizard.


    However, this book focuses on the second option: installing VirtualBox and setting
    up virtual machines. A virtual machine consists of an operating system (a Linux
    distribution, for example) running on top of the physical resources of your computer.


    In the virtualization ecosystem, virtual machines are also known as *guests* or
    *appliances*, whereas the computer that runs the virtualization platform is known
    as the host.


    To install VirtualBox, download it from [here](#) and then follow the instructions
    provided in [Chapter 2](#) of [the VirtualBox manual](#).


    # ## Importing a Virtual Machine


    One of the advantages of using VirtualBox is that it allows us to export and import
    virtual machines previously created, and use them in a different host.


    Thus, you will be able to start using Linux almost immediately by importing the
    virtual machines that are provided with this book.


    To download the virtual machine files, go to [here](#). The **Rocky Linux 9 VM**
    is all in one file since it is relatively small (~830 MB).'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'Using VirtualBox, you can also add virtual disks as storage devices, increase
    the amount of memory allocated for the guest, and change the settings of virtual
    machines, among other things.


    To import one of the virtual machines, follow these steps:


    +   1. Go to File → Import appliance.

    2. Select the .ova file.

    3. Click Next and follow the instructions on the screen.

    4. When the import process is completed, your virtual machine will show up in
    the main screen of VirtualBox. Right click on it and choose Start.


