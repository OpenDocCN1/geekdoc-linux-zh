    - `-a` 参数会让 `ls` 返回隐藏文件，这类文件的名称以点（.）开头。隐藏文件通常被用作配置文件和存储用户偏好设置。

    - `-t` 参数会让 `ls` 按修改时间对结果排序。例如：

    - 执行 `ls -a` 会显示当前工作目录内所有对象的名称，包括隐藏和非隐藏对象。

    - 执行 `ls -la /var` 会返回 `/var` 目录内容的长格式目录列表。

    - 执行 `ls -lt ../` 会显示当前工作目录父目录的长格式目录列表。

    - 执行 `ls -l /home/student/files/info.txt` 时，如果存在位于 `/home/student/files` 目录内名为
    *info.txt* 的文件，会返回该文件的长格式目录列表；如果不存在，则会返回错误信息。


    ### 练习题 1.1

    在本练习中，你需要编写命令来完成以下操作：

    - 1.1.1：将当前工作目录切换到 `/etc`，然后使用相对路径切换到 `/var/log`。

    - 1.1.2：查阅 `ls` 命令的手册页，找出需要使用哪个参数来返回 `/var/log` 目录本身（而非其内容）的长格式目录列表。

    - 1.1.3：显示 */usr* 目录的长格式目录列表，按修改时间排序，最新的排在前面。

    - 1.1.2：使用 `cd /` 导航到根目录，然后用 `ls` 列出其内容。查阅 [FHS 文档](https://fsstnd.org) 以了解根目录下各个子目录的更多信息。


    ## 用于处理文件和目录的更多命令

    以下是在命令行中处理文件和目录时常用的命令：

    - **touch** 命令后跟文件名使用。如果文件已存在，**touch** 会更新其修改时间（你可以在执行 **touch** 前后分别使用 **ls
    -l** 加文件名的方式验证这一点）；如果文件不存在，则会创建一个与参数同名的空文件。例如，如果当前目录下不存在 *myfile.txt*，执行 **touch
    myfile.txt** 就会在该位置创建一个名为 *myfile.txt* 的空文件。

    - **rm**（remove 的缩写）后跟文件名使用时，会删除对应的文件。例如，执行 **rm myfile.txt** 会从当前工作目录中删除 *myfile.txt*。

    - **mkdir** 后跟参数时会创建新目录。例如，执行 **mkdir me** 会在当前目录下创建一个名为 *me* 的目录。但如果 *me* 尚不存在，执行
    **mkdir me/otherdir** 会失败。为避免这种情况，可以使用 **-p** 参数来创建包含缺失父目录的目录结构，即执行 **mkdir -p
    me/otherdir** 会一次性创建名为 *me* 的目录，以及 *me* 下的子目录 *otherdir*。

    - **rmdir** 与 **rm** 功能类似，但用于删除目录。使用该命令删除目录时，目录必须为空。

    - **cp** 除可选参数外，还需要两个参数。它通常用于将一个文件（第一参数）的内容复制到另一个文件（第二参数）中。例如，执行 **cp file1.txt
    file2.txt** 会将 *file1.txt* 的内容复制到 *file2.txt*。

    - **mv** 的操作与 **cp** 几乎完全一致，区别在于当两个参数都代表已存在的对象时，它用于将文件或目录（第一参数）移动到其他位置（第二参数）。如果第二参数不是已存在的对象，**mv**
    会将第一参数重命名为第二参数。例如，假设 *dir1* 和 *dir2* 都存在，而 *dir3* 不存在，在这种情况下，执行 **mv dir1 dir2**
    会将 *dir1* 移动到 *dir2* 中，成为后者的子目录；而执行 **mv dir1 dir3** 则会直接将 *dir1* 重命名为 *dir3*。

    注：上述命令均可使用相对路径或绝对路径。


    ### 练习题 1.2

    1.2.1：与删除或重命名文件、目录相关的命令使用时需格外谨慎。这类命令都提供了在执行实际操作前向用户请求确认的参数。请查阅对应命令的手册页，找出本例中应使用的参数。

    1.2.2：仅使用一条命令，在当前目录下创建 files/personal/2017 的完整目录结构。

    1.2.3：在 files/personal/2017 目录下创建一个空文件。使用 `ls -l` 验证该文件的最后修改时间，更新后再重新检查。


    ## 重定向与管道

    若要将某条命令的输出保存到文件中供后续查看，我们会使用重定向运算符。根据你希望覆盖文件原有内容还是追加内容，分别使用 `>` 或 `>>`。例如，执行 `ls
    -l > longdirectorylisting.txt` 会在当前目录下创建一个名为 longdirectorylisting.txt 的文件（如果文件不存在），并将
    `ls -l` 的输出写入该文件。如果文件已存在且不为空，请改用 `>>`，避免覆盖原有内容，因为 `>` 会用命令的输出替换原有内容。


    重定向的一个经典用法是使用 **echo** 命令将文本字符串写入文件，示例如下：

    ``` echo "I love Tecmint.com" > testfile.txt ```

    以上命令会将引号内的消息写入当前目录下名为 *testfile.txt* 的文件。


    另一方面，我们可以使用管道将多条命令串联在一起，管道用竖线（`|`）表示。当两条及以上命令通过这种方式串联时，前一条命令的输出会作为后一条命令的输入，以此类推。随着我们学习的命令越来越多，使用管道的优势会逐渐显现，到那时我们就会想起本章中提到的内容。


    ## 历史记录与Tab补全

    使用命令行一段时间后，你可能想要重复之前执行过的命令。为了方便做到这一点，shell 会保存历史记录，你可以通过 **history**（是不是很惊喜！）命令来访问。在命令行中输入
    `history` 并按回车后，会显示带行号的命令历史列表。重复历史列表中的命令时，只需输入该命令对应的行号，前面加上感叹号即可。例如，以下摘录显示了历史列表中的部分命令：

    ``` ... 253 cd /var/log 254 cd /home/student 255 ls -lt /home/student ... ```

    如果要执行 `cd /home/student`，我们只需输入 `!254` 并按回车即可。由此可见，当需要重复历史列表中较长的命令条目时，这种命令输入方式非常方便。


    此外，Bash 提供了一项非常实用的功能，称为Tab补全。它允许你在输入命令的部分名称后，按下两次 *Tab* 键自动补全命令。如果存在多个可补全的结果，会列出所有匹配项。例如，输入
    *whi* 后按两次 Tab 键，根据你的系统配置，会得到或多或少的结果，但大致如下：

    ``` which which-nodejs while whiptail ```

    另一方面，如果在输入 *wha* 后执行同样的操作，很可能只会得到 **whatis** 这一个结果。


    ### 练习题 1.3

    **1.3.1：** 将任意一段文本字符串写入名为 *mychoice.txt* 的文件。使用正确的重定向运算符写入另一行内容，且不覆盖该文件的原有内容。然后使用
    **cat** 命令，后跟文件名（`cat mychoice.txt`）来显示文件内容。

    **1.3.2：** 重复Tab补全练习。输入 **ch** 后按两次 *Tab* 键，从结果列表中记录3个命令，然后使用 **whatis** 命令查看这些命令的用途。注意你需要先查阅
    **whatis** 的手册页。


