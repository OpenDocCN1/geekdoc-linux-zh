    \  - Gzip工具\n  - 总结\n\n## 版权声明\n保留部分权利。未经出版方事先许可，不得以任何形式或通过任何电子、机械、复印、录制、或其他方式复制、存储在检索系统中、或传播本书的任何部分用于商业目的。\n\
    \n## 重要声明\n**免责声明**：我们强烈建议您熟悉本电子书中使用到的命令及其手册页。\n© 2022 Tecmint.com - 最后修订时间：2022年7月\
    \ - 保留所有权利\n尽管本书已尽可能完善，但其定位是系统管理的入门参考资料，而非详尽的全指南。希望您能像我们享受编写、排版并以PDF格式分发本书的过程一样，享受阅读本书的乐趣。\n\
    您可能会有其他能丰富本书内容的想法，如果有，欢迎在我们的任一社交平台主页给我们留言：\n| 平台 | 链接 |\n| --- | --- |\n| Twitter\
    \ | http://twitter.com/tecmint |\n| Facebook | https://www.facebook.com/tecmint\
    \ |\n| LinkedIn | https://www.linkedin.com/company/tecmint |\n| Facebook群组 | https://www.facebook.com/groups/linuxsysadmins/\
    \ |\n此外，如果您发现本书中有拼写错误或内容错误，请告知我们，以便我们修正并优化内容。我们也欢迎您的提问和其他建议，期待您的反馈！\n\n## 第1章：Linux入门\n\
    在本章中，您将学习：\n- 什么是Linux？\n- 在Windows上安装VirtualBox\n- 在VirtualBox中导入Rocky Linux\
    \ 9虚拟机\n- VirtualBox扩展包与增强功能\n\n### 什么是Linux？\n> 根据Linux基金会（一个致力于推动Linux发展的组织）的说法：\n\
    > 简而言之，Linux是一种操作系统。它是计算机上使应用程序和操作员能够访问计算机设备以执行所需功能的软件。操作系统（OS）会将应用程序的指令传递给例如计算机处理器等硬件组件。处理器执行指令指定的任务，随后通过操作系统将结果返回给应用程序。此外，Linux同时具备*多用户*（即允许多个位于不同计算机或终端上的用户访问安装有同一操作系统的单台系统）和*多任务*（可用的处理器时间会自动分配给多个任务，所谓任务同时运行不过是这种分配方式营造出的假象）特性。\n\
    \n### Linux简史\n1991年，在芬兰赫尔辛基，名为林纳斯·托瓦兹的计算机科学专业学生启动了一个项目，该项目后来发展成为了Linux内核。开发工作是在林纳斯的计算机上完成的，这台计算机配备有80386处理器、MINIX操作系统和GNU\
    \ C编译器。正如他后来在2001年出版的著作*只是为了好玩*中所写的那样，托瓦兹最终意识到自己编写的正是一个操作系统内核（即负责分配资源、与硬件通信的程序，可以说是操作系统的“心脏”）。\n\
    \nLinux内核的首个版本是以限制商业活动的个人许可证发布的。随后在1992年12月中旬，他以GNU GPL协议发布了0.99版本。这一许可方式的变更原因，林纳斯本人在0.01版本的发布说明中早已解释过：\n\
    > 遗憾的是，仅有一个内核是无法实现任何实用功能的。要获得可用的系统，你还需要Shell、编译器、函数库等组件。这些是独立的组成部分，可能适用更严格（甚至更宽松）的版权规则。大多数与Linux搭配使用的工具都是GNU软件，遵循GNU版权Copyleft原则。这些工具并未包含在内核发行版中，你可以向我（或GNU项目）咨询更多相关信息。\n\
    \n也正因如此，从那时起，林纳斯和GNU项目的开发者们开始将GNU组件（应用程序、函数库和开发者工具）与Linux内核整合（以打造一个功能完备且免费的操作系统）。在此需要说明的是，GNU项目启动时间要早得多，准确来说是在1984年，由自由软件基金会（时任负责人为麻省理工学院前人工智能科学家理查德·斯托曼）发起，目标是开发GNU系统。\n"
