    # ## Chapter 1: Introduction to Linux


    In this chapter, you will learn:


    +   - What is Linux?

    - Installing VirtualBox on Windows

    - Importing Rocky Linux 9 virtual machine on VirtualBox

    - VirtualBox extension pack and guest additions


    # ## What is Linux?


    According to the Linux Foundation (an entity that is dedicated to fostering the
    growth of Linux):


    > > Linux is, in simplest terms, an operating system. It is the software on a
    computer that enables applications and the computer operator to access the devices
    on the computer to perform desired functions. The operating system (OS) relays
    instructions from an application to, for instance, the computer''s processor.
    The processor performs the instructed task, then sends the results back to the
    application via the operating system.'
  - '[PAGE 4]


    Besides, Linux is both a *multi-user* (in that it allows multiple users on different
    computers or terminals to access a single system with one OS on it) and *multitasking*
    (available processor time is divided between several tasks automatically, creating
    the illusion, so to speak, that the tasks are running simultaneously).


    # ## A Little History


    In 1991, in Helsinki, a computer science student by the name of Linus Torvalds
    began a project that later became the Linux kernel.


    Development was done on Linus'' computer, which was equipped with a 80386 processor,
    the MINIX operating system, and the GNU C compiler.


    As he would write later in his book *Just for fun* [2001], Torvalds eventually
    realized that he had written an operating system kernel (a program to allocate
    resources and talk to the hardware, the ''heart'' of the operating system, so
    to speak).


    The first version of the Linux kernel was released under a personal license that
    restricted commercial activity. Later, in the middle of December 1992 he published
    version 0.99 using the GNU GPL.


    The reason behind this change in this way of licensing had been explained earlier
    by Linus himself in the release notes of version 0.01:


    > > Sadly, a kernel by itself gets you nowhere. To get a working system you need
    a shell, compilers, a library etc. These are separate parts and may be under a
    stricter (or even looser) copyright. Most of the tools used with linux are GNU
    software and are under the GNU copyleft. These tools aren''t in the distribution
    - ask me (or GNU) for more info.


    That is why, from that moment on, Linus and GNU project developers worked to integrate
    GNU components (applications, libraries, and developer tools) with the Linux kernel
    (to make a fully functional and free operating system).


    We must mention at this point that the GNU Project had been launched much earlier,
    (in 1984, to be accurate) by the Free Software Foundation (led by a former MIT
    AI scientist named Richard Stallman) to develop the GNU system.'
- md: "## Running Linux for the First Time\n\nFirst off, let us clarify that when\
    \ we use the word Linux nowadays, we usually refer to a Linux distribution, a\
    \ fully-functional operating system that consists of the kernel and a series of\
    \ application programs and libraries. There are two ways to start experimenting\
    \ with Linux. You can boot your computer using a live CD/DVD or USB stick, or\
    \ install a virtualization platform such as *VirtualBox*.\n\nThe first option\
    \ (booting your computer using a live CD/DVD or USB stick) will not make any modifications\
    \ to your storage devices. Linux will run directly from the media device, and\
    \ you will be able to test the operating system before actually installing it.\
    \ If you decide you like it, you can later install it using the built-in wizard.\
    \ However, this book focuses on the second option: installing VirtualBox and setting\
    \ up virtual machines.\n\nA virtual machine consists of an operating system (a\
    \ Linux distribution, for example) running on top of the physical resources of\
    \ your computer. In the virtualization ecosystem, virtual machines are also known\
    \ as *guests* or *appliances*, whereas the computer that runs the virtualization\
    \ platform is known as the host.\n\nTo install VirtualBox, download it from [here](#)\
    \ and then follow the instructions provided in [Chapter 2](#) of [the VirtualBox\
    \ manual](#).\n\n## Importing a Virtual Machine\n\nOne of the advantages of using\
    \ VirtualBox is that it allows us to export and import virtual machines previously\
    \ created, and use them in a different host. Thus, you will be able to start using\
    \ Linux almost immediately by importing the virtual machines that are provided\
    \ with this book. To download the virtual machine files, go to [here](#). The\
    \ **Rocky Linux 9 VM** is all in one file since it is relatively small (~830 MB).\n\
    \nUsing VirtualBox, you can also add virtual disks as storage devices, increase\
    \ the amount of memory allocated for the guest, and change the settings of virtual\
    \ machines, among other things.\n\nTo import one of the virtual machines, follow\
    \ these steps:\n- Go to File → Import appliance.\n- Select the .ova file.\n- Click\
    \ Next and follow the instructions on the screen.\n- When the import process is\
    \ completed, your virtual machine will show up in the main screen of VirtualBox.\
    \ Right-click on it and choose Start.\n\n![](img/79598d2857a22f9e332d2a8526914a29_6_0.png)\n\
    \n![](img/79598d2857a22f9e332d2a8526914a29_7_0.png)\n\n## Guest Additions and\
    \ the Extension Pack\n\nAs mentioned previously, VirtualBox makes it possible\
    \ to run one or more guests on top of the host operating system. To better leverage\
    \ the hardware resources and to provide a better working experience with VirtualBox\
    \ and the appliances running on top of it, the following software packages are\
    \ provided separately:\n\n**Guest additions** are drivers that can be installed\
    \ on a per-appliance basis and help improve communication between hosts and guests.\
    \ They provide functionality such as shared clipboard/storage and support for\
    \ multiple screen resolutions.\n\nTo install guest additions, start a virtual\
    \ machine [must have desktop environment installed], then go to Devices → Insert\
    \ Guest Additions CD image menu, and follow the prompts.\n\nTo install a desktop\
    \ environment in a Rocky Linux 9 minimal system, run:\n```\n$ sudo dnf install\
    \ epel-release\n$ sudo dnf config-manager --set-enabled powertools\n$ dnf copr\
    \ enable stenstorp/lightdm\n$ dnf groupinstall \"xfce\"\n$ dnf install lightdm\n\
    $ systemctl disable gdm\n$ systemctl enable lightdm\n$ systemctl set-default graphical.target\n\
    $ reboot\n```\n\nThe **Extension pack** provides integration between the host's\
    \ USB 2.0 and 3.0 ports and the guest, encryption for disk images, and virtual\
    \ remote desktop functionality. To install them, go to the [VirtualBox Downloads\
    \ page](https://www.virtualbox.org/wiki/Downloads), and click on the Oracle VM\
    \ VirtualBox Extension Pack.\n\nNote that the installation file is operating system-agnostic,\
    \ so it will work regardless of the operating system of the host where VirtualBox\
    \ has been installed. More information on how to install guest additions and the\
    \ extension pack can be found in [Chapter 1 of the VirtualBox manual](https://www.virtualbox.org/manual/ch01.html).\n\
    \n## Chapter 2: Files and Directories in Linux\n\nIn this chapter, you will learn:\n\
    - The Filesystem Hierarchy Standard\n- What is the shell?\n- Commands: pwd, cd,\
    \ ls\n- More commands: touch, echo, mkdir, rmdir, rm, cp, mv\n- Redirection and\
    \ pipelines\n- History and tab completion in the command line\n- Extra reading\
    \ (links to related Tecmint articles)\n\n### The Filesystem Hierarchy Standard\n\
    \nA quick glance at [distrowatch.com](http://distrowatch.com) will give us but\
    \ a glimpse of the vast number of Linux distributions available today. Some of\
    \ them are maintained by well-known companies or free software initiatives, whereas\
    \ others represent the contributions of individuals. In order to provide a fundamental\
    \ standard to be expected in modern Linux distributions, the Linux Foundation\
    \ designed the Filesystem Hierarchy Standard (FHS) to be used by distribution\
    \ maintainers, package developers, and system implementers. The FHS consists of\
    \ a document that provides an overall outline and reference of the Linux directory\
    \ structure. Although it is not intended as a fixed set of instructions, it represents\
    \ the specifications on what to reasonably expect in the directory tree of a given\
    \ distribution. We will revisit this topic once we have learned the basic commands\
    \ that are needed to navigate a Linux system.\n\n### What is the Shell?\n\nA *shell*\
    \ is a program that accepts commands and gives them to the operating system to\
    \ be executed. In other words, the shell provides an interface layer between the\
    \ Linux kernel and the end user. Often used interchangeably, a *terminal* is a\
    \ program that allows us to interact with the *shell*. For example:\n\n![](img/79598d2857a22f9e332d2a8526914a29_10_0.png)\n\
    \nWhen we first start a terminal, it presents a command prompt (also known as\
    \ *the command line*), which tells us that the shell is ready to start accepting\
    \ commands from the user. Linux provides a range of options for shells, the following\
    \ being the most common:\n- **bash**: Bash stands for **B**ourne **A**gain **SH**ell\
    \ and is the default shell in most (if not all) modern Linux distributions. It\
    \ incorporates tens of built-in commands, and extensive documentation on how to\
    \ use its wide variety of features. We will cover some of them in this book.\n\
    - **sh**: The Bourne **SH**ell is the oldest shell and therefore has been the\
    \ default shell of many UNIX-like operating systems for many years.\n- **ksh**:\
    \ The **Korn SH**ell is a Unix shell which was developed by David Korn at Bell\
    \ Labs in the early 1980s. It is backward-compatible with the Bourne shell and\
    \ includes many features of the C shell.\n\nTo open a terminal, simply go to the\
    \ applications menu and select *Terminal* (or a similar name) from the list. Regardless\
    \ of the distribution, you will be presented with a command prompt that should\
    \ look as the below image:\n\n![](img/79598d2857a22f9e332d2a8526914a29_11_0.png)\n\
    \nwhere the *gacanepa* is the current username and *desktop* is the hostname.\
    \ With that said, let's dive into the amazing world of the Linux command line!\n\
    \n### Navigating the System\n\nIf we log into Linux using a text-mode login screen,\
    \ chances are we will be dropped directly into our default shell. On the other\
    \ hand, if we log into Linux using a graphical user interface (GUI) login screen,\
    \ we will have to open a shell manually by starting a terminal. Either way, we\
    \ will be presented with the user prompt and we can start typing and executing\
    \ commands (a command is executed by pressing the Enter key after we have typed\
    \ it). Commands are composed of two parts: 1) the name of the command itself (along\
    \ with one or more optional flags preceded by a hyphen), and 2) arguments. To\
    \ view the list of available options and / or required arguments, type **man**\
    \ followed by the name of the command and press Enter. A text document known as\
    \ the man page of the command will open. To scroll down or up, use the arrows\
    \ of your keyboard, and press the letter Q when you want to exit. Let's consider\
    \ the following examples to illustrate.\n- To print the path of the current working\
    \ directory, use **pwd**. This command does not take any optional flags nor requires\
    \ an argument.\n- To change to another location in the directory tree, use **cd**\
    \ followed by a relative or absolute path. For example:\n  - **cd Documents**\
    \ will change the working directory to a directory named Documents inside the\
    \ current one. In this case, a relative path is used since it is given starting\
    \ at the current directory."
  mdcn: "\n## 首次运行Linux\n首先需要明确的是：如今我们提到「Linux」时，通常指的是Linux发行版，它是一个包含内核、一系列应用程序和系统库的完整功能操作系统。\n\
    有两种方式可以开始尝试使用Linux：你可以通过Live CD/DVD或U盘启动电脑，也可以安装像*VirtualBox*这样的虚拟化平台。\n第一种方式（通过Live\
    \ CD/DVD或U盘启动电脑）不会对你的存储设备做任何修改。Linux会直接从媒体设备运行，你可以在正式安装前先试用该系统。如果你觉得满意，后续可以使用系统内置的向导完成安装。\n\
    不过本书重点关注第二种方式：安装VirtualBox并配置虚拟机。\n虚拟机是运行在你电脑物理资源之上的操作系统（例如Linux发行版）。在虚拟化生态中，虚拟机也被称为*客户机*或*设备镜像*，而运行虚拟化平台的电脑则被称为宿主机。\n\
    要安装VirtualBox，请从[此处](#)下载，然后按照[VirtualBox手册](#)中的[第2章](#)的说明操作。\n\n## 导入虚拟机\n\
    使用VirtualBox的优势之一在于，它支持导出和导入已创建的虚拟机，并可在不同的宿主机上使用这些虚拟机。因此，你可以通过导入本书配套的虚拟机，几乎立刻开始使用Linux。\n\
    要下载虚拟机文件，请前往[此处](#)。\n**Rocky Linux 9 虚拟机**仅包含单个文件，因为其体积相对较小（约830MB）。使用VirtualBox时，你还可以添加虚拟磁盘作为存储设备、增加分配给客户机的内存、修改虚拟机设置等。\n\
    要导入虚拟机，请按以下步骤操作：\n- 点击「文件」→「导入虚拟设备」。\n- 选择.ova格式的虚拟机文件。\n- 点击「下一步」，按照屏幕提示操作。\n\
    - 导入流程完成后，你的虚拟机将显示在VirtualBox的主界面中。右键点击该虚拟机，选择「启动」。\n\n![](img/79598d2857a22f9e332d2a8526914a29_6_0.png)\n\
    ![](img/79598d2857a22f9e332d2a8526914a29_7_0.png)\n\n## 客户机增强功能与扩展包\n如前所述，VirtualBox支持在宿主机操作系统之上运行一个或多个客户机。为了更好地利用硬件资源、提升VirtualBox及运行在其上的设备镜像的使用体验，需要单独安装以下软件包：\n\
    **客户机增强功能**是针对单个设备镜像安装的驱动程序，可提升宿主机与客户机之间的通信效率。它支持共享剪贴板/存储、多屏幕分辨率等功能。\n要安装客户机增强功能，请先启动已安装桌面环境的虚拟机，然后点击「设备」→「插入客户机增强功能光盘镜像」菜单，按照提示操作即可。\n\
    要在Rocky Linux 9最小化系统中安装桌面环境，请执行以下命令：\n``` $ sudo dnf install epel-release $ sudo\
    \ dnf config-manager --set-enabled powertools $ dnf copr enable stenstorp/lightdm\
    \ $ dnf groupinstall \"xfce\" $ dnf install lightdm $ systemctl disable gdm $\
    \ systemctl enable lightdm $ systemctl set-default graphical.target $ reboot ```\n\
    **扩展包**可实现宿主机与客户机的USB 2.0/3.0端口集成、磁盘镜像加密以及虚拟远程桌面功能。\n要安装扩展包，请前往[VirtualBox下载页面](https://www.virtualbox.org/wiki/Downloads)，点击Oracle\
    \ VM VirtualBox Extension Pack选项。\n请注意，该安装文件与操作系统无关，只要宿主机已安装VirtualBox，均可正常使用。\n\
    关于如何安装客户机增强功能和扩展包的更多信息，可查阅[VirtualBox手册第1章](https://www.virtualbox.org/manual/ch01.html)。\n\
    \n## 第2章：Linux中的文件与目录\n在本章中，你将学习：\n- 文件系统层级标准（FHS）\n- 什么是Shell？\n- 基础命令：pwd、cd、ls\n\
    - 更多命令：touch、echo、mkdir、rmdir、rm、cp、mv\n- 重定向与管道\n- 命令行历史与Tab补全\n- 拓展阅读（相关Tecmint文章链接）\n\
    \n### 文件系统层级标准\n快速浏览[distrowatch.com](http://distrowatch.com)就能发现，如今可用的Linux发行版数量极为庞大。其中一部分由知名企业或自由软件项目维护，另一部分则来自个人开发者的贡献。\n\
    为了给现代Linux发行版提供统一的底层标准，Linux基金会制定了文件系统层级标准（FHS），供发行版维护者、包开发者和系统实现者使用。\nFHS是一份提供Linux目录结构总体大纲与参考的文档。尽管它不是一套固定的操作指令，但代表了特定发行版目录树中可合理预期的规范。\n\
    等我们掌握了在Linux系统中导航所需的基础命令后，会再次讨论这个话题。\n\n### 什么是Shell？\n*Shell*是一个接收命令并将其传递给操作系统执行的程序。换言之，Shell是Linux内核与终端用户之间的接口层。\n\
    常被混用的*终端*是一个供我们与*Shell*交互的程序，示例如下：\n![](img/79598d2857a22f9e332d2a8526914a29_10_0.png)\n\
    当我们首次打开终端时，会出现命令提示符（也被称为*命令行*），这表明Shell已准备好接收用户输入的命令。\nLinux提供了多种Shell选项，最常见的有以下几种：\n\
    - **bash**：Bash是**B**ourne **A**gain **SH**ell（Bourne Again Shell）的缩写，是绝大多数现代Linux发行版的默认Shell。它内置了数十条命令，还有大量关于其各类功能的使用文档，本书会介绍其中的一部分。\n\
    - **sh**：Bourne **SH**ell是最早的Shell，因此多年来一直是许多类UNIX操作系统的默认Shell。\n- **ksh**：**Korn\
    \ SH**ell是Unix的一种Shell，由David Korn于20世纪80年代初在贝尔实验室开发。它向后兼容Bourne Shell，同时包含了C\
    \ Shell的诸多特性。\n要打开终端，只需进入应用菜单，从列表中选择*终端*（或类似名称的选项）即可。\n无论你使用哪个发行版，都会看到如下图片所示的命令提示符：\n\
    ![](img/79598d2857a22f9e332d2a8526914a29_11_0.png)\n其中*gacanepa*是当前用户名，*desktop*是主机名。\n\
    话不多说，让我们一同进入精彩的Linux命令行世界吧！\n\n### 系统导航\n如果我们通过文本模式登录界面登录Linux，通常会被直接带入默认Shell中；而如果通过图形用户界面（GUI）登录界面登录Linux，则需要手动打开终端来启动Shell。无论哪种方式，我们都会看到用户提示符，此时即可开始输入并执行命令（输入完成后按下Enter键即可执行命令）。\n\
    命令由两部分组成：1）命令本身（可附带一个或多个由连字符引导的可选标志）；2）参数。\n要查看可用选项和/或必填参数的列表，请输入**man**加命令名，然后按下Enter键。此时会打开一份被称为该命令手册页的文本文档。使用键盘方向键即可上下滚动内容，想要退出时按下Q键即可。\n\
    我们来看几个示例：\n- 要打印当前工作目录的路径，使用**pwd**命令。该命令无需任何可选标志，也不要求传入参数。\n- 要切换到目录树中的其他位置，使用**cd**命令加相对路径或绝对路径，示例如下：\n\
    \  - **cd Documents**会将工作目录切换到当前目录下名为Documents的文件夹中。这种情况使用的是相对路径，因为路径是相对于当前目录指定的。\n"
