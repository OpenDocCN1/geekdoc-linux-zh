    ### Monitoring Linux Processes with top

    Similar to ps, top lists the process currently running on our system - but updates
    by default every 5 seconds. This is useful when we want to watch the status of
    one or more processes or to see how they are using our system. This listing is
    ordered by default by CPU usage. Additionally, a header of useful information
    (current time, uptime, number of users and processes, load, CPU status, and memory,
    to name a few examples) is also displayed, as seen in the below image:


    ![](img/79598d2857a22f9e332d2a8526914a29_28_0.png)


    If you want to use a different refresh rate, use the interval (-d) option. For
    example, **top -d 3** will bring up **top** and refresh its output every 3 seconds.


    ### Killing Processes

    In more precise terms, killing a process means terminating it by sending it a
    signal to either finish its execution gracefully (SIGTERM=15) or immediately (SIGKILL=9)
    through the **kill** or **pkill** commands. The difference between these two tools
    is that the former is used to terminate a specific process or a process group
    altogether, while the latter allows you to do the same based on the process name
    and other attributes. In addition, **pkill** comes bundled with **pgrep**, which
    shows you the PIDs that will be affected should pkill be used. For example, before
    running

    ``` pkill -u gacanepa ```

    it may be useful to view at a glance which are the PIDs owned by gacanepa:

    ``` pgrep -l -u gacanepa ```


    ![](img/79598d2857a22f9e332d2a8526914a29_29_0.png)


    By default, both **kill** and **pkill** send the SIGTERM signal to the process.
    As we mentioned above, this signal can be ignored (while the process finishes
    its execution or for good), so when you seriously need to stop a running process
    with a valid reason, you will need to specify the *SIGKILL* signal on the command
    line. To force the termination of a process identified by PID=1954, do

    ``` kill -9 1954 ```

    or

    ``` kill -s SIGKILL 1954 ```


    Additionally, you can also terminate processes based on the owner or other attributes,
    such as all the children of a given process. For example,

    ``` pgrep -l -P 9892 ```

    will list the processes that would be killed if we run

    ``` pkill -P 9892 ```


    ### Exercises 4.2

    - **4.2.1:** Use **kill -l** and `man 7 signal` to a) list the available signals,
    and b) learn about what SIGTERM, SIGSTOP, and SIGKILL.

    - **4.2.2:** Use **pgrep** to identify a list of processes that would be killed
    if you run **pkill** to terminate a) all processes owned by a given user, and
    b) all the child processes of a given one.


    ### Modifying Process Execution Priorities

    Part of Linux’s flexibility is to let users and system administrators prioritize
    process execution. This feature can come in handy when we have a high-load machine
    and want to make sure some special process(es) get more rights (or “priority”)
    to use system resources than others. However, we must note that under normal circumstances
    we don’t need to worry about execution priority because the kernel handles it
    automatically. The usual method of performing a change of execution priority is
    through the **nice** and **renice** commands. We can use nice to launch a program
    with a specified priority or use renice to alter the priority of a running one.


    #### Using nice

    When you start a process using nice, the kernel will allocate more or less system
    resources to the process based on the assigned priority (a number commonly known
    as “niceness” in a range from -20 to 19). The lower the value, the greater the
    execution priority. Regular users (other than root) can only modify the niceness
    of processes they own to a higher value (meaning a lower execution priority),
    whereas root can modify this value for any process, and may increase or decrease
    it. The default priority value is 0. To start a script named *backup.sh* with
    a different priority, use `nice -n` followed by the desired priority. For example:

    ``` nice -n -10 backup.sh ```

    or

    ``` nice -n 5 backup.sh ```

    While the first example will increase the priority to -10, the second one will
    decrease it to 5.


    #### Using renice

    If a process is already running, you can modify its execution priority using **renice
    -n** followed by the new priority and **-p** to indicate the PID. For example,
    let''s suppose that *backup.sh* is still running with PID 9892 and you want to
    change its priority to 10. To do this, use the following command:

    ``` renice -n 10 -p 9892 ```


