  md: '# ## The Filesystem Hierarchy Standard


    A quick glance at [distrowatch.com](http://distrowatch.com) will give us but a
    glimpse of the vast number of Linux distributions available today. Some of them
    are maintained by well-known companies or free software initiatives, whereas others
    represent the contributions of individuals.


    In order to provide a fundamental standard to be expected in modern Linux distributions,
    the Linux Foundation designed the Filesystem Hierarchy Standard (FHS) to be used
    by distribution maintainers, package developers, and system implementers.


    The FHS consists of a document that provides an overall outline and reference
    of the Linux directory structure. Although it is not intended as a fixed set of
    instructions, it represents the specifications on what to reasonably expect in
    the directory tree of a given distribution.


    We will revisit this topic once we have learned the basic commands that are needed
    to navigate a Linux system.


    # ## What is the Shell?


    A *shell* is a program that accepts commands and gives them to the operating system
    to be executed.


    In other words, the shell provides an interface layer between the Linux kernel
    and the end user.


    Often used interchangeably, a *terminal* is a program that allows us to interact
    with the *shell*. For example:'
  merge: -1
  pgno: 9
- img_proc: true
  md: '![](img/79598d2857a22f9e332d2a8526914a29_10_0.png)


    When we first start a terminal, it presents a command prompt (also known as *the
    command line*), which tells us that the shell is ready to start accepting commands
    from the user.


    Linux provides a range of options for shells, the following being the most common:


    +   1. **bash**: Bash stands for **B**ourne **A**gain **SH**ell and is the default
    shell in most (if not all) modern Linux distributions. It incorporates tens of
    built-in commands, and an extensive documentation on how to use its wide variety
    of features. We will cover some of them in this book.

    2. **sh**: The Bourne **SH**ell is the oldest shell and therefore has been the
    default shell of many UNIX-like operating systems for many years.

    3. **ksh**: The **Korn SH**ell is a Unix shell which was developed by David Korn
    at Bell Labs in the early 1980s. It is backward-compatible with the Bourne shell
    and includes many features of the C shell.


    To open a terminal, simply go to the applications menu and select *Terminal* (or
    a similar name) from the list.


    Regardless of the distribution, you will be presented with a command prompt that
    should look as the below image:'
  merge: -1
