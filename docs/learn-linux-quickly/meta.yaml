- md: '## Chapter 7 - Maintaining Software using APT and YUM

    In this chapter, you will learn:

    - Use **aptitude** or **yum** to search for, install, update, or remove packages.

    - Extra reading (links to related Tecmint articles)

    - Exercises


    When we speak of package management in Linux, we refer to a method of *installing*
    and *maintaining* (which includes *updating* and probably *removing* as well)
    software on the system. In the early days of Linux, programs were only distributed
    as source code, along with the required man pages, the necessary configuration
    files, and pretty much nothing more. Nowadays, most Linux distributors use by
    default pre-built programs or sets of programs called **packages**, which are
    presented to users ready for installation on that distribution.


    ### How Package Management Systems Work

    If a certain package requires a certain resource, such as a shared library, or
    another package, it is said to have a *dependency*. All modern package management
    systems provide some method of dependency resolution to ensure that when a package
    is installed, all of its dependencies are installed as well. Almost all the software
    that is installed on a modern Linux system will be found on the Internet. It can
    either be provided by the distribution vendor through central repositories (which
    can contain several thousands of packages, each of which has been specifically
    built, tested, and maintained for the distribution) or be available in source
    code that can be downloaded and installed manually. Because different distribution
    families use different packaging systems (Debian: *.deb / CentOS: *.rpm), a package
    intended for one distribution will not be compatible with another distribution.
    In order to perform the task of package management effectively, you need to be
    aware that you will have available two types of utilities: **low-level tools**
    (which handle in the backend the actual installation, upgrade, and removal of
    package files), and high-level tools (which are in charge of ensuring that the
    tasks of dependency resolution and metadata searching ("data about the data")
    are performed).


    | DISTRIBUTION | LOW-LEVEL TOOL | HIGH-LEVEL TOOL |

    | --- | --- | --- |

    | Debian and derivatives | dpkg | apt-get / aptitude |

    | CentOS | rpm | yum |


    The most frequent tasks that you will do with high and low level package management
