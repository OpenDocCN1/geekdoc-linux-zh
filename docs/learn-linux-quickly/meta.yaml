    ### 使用top监控Linux进程

    和ps类似，top会列出当前系统中运行的进程，但默认每5秒更新一次数据。当我们想要监控一个或多个进程的状态，或是查看它们对系统资源的使用情况时，这个功能非常实用。默认情况下，列表会按CPU使用率排序。此外，顶部还会显示一系列有用的信息（包括当前时间、系统运行时间、用户数、进程数、负载、CPU状态、内存信息等），如下图所示：

