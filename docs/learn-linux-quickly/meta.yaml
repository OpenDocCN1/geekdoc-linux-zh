  md: '# Searching for a Package


    To search for a package by name, do


    ```

    aptitude search package_name

    ```


    ```

    yum search package_name

    ```


    ```

    yum search all package_name

    ```


    When you use **search all**, yum will search for **package_name** not only in
    package names, but also in package descriptions.


    # Installing or updating a package from a repository


    While installing a package, you may be prompted to confirm the installation after
    the package manager has resolved all dependencies. Note that running update or
    refresh (according to the package manager being used) is not strictly necessary,
    but keeping installed packages up to date is a good sysadmin practice for security
    and dependency reasons.


    Depending on your chosen distro, you will use one of the following options to
    install **package_name**:


    ```

    aptitude install package_name

    ```


    ```

    yum install package_name

    ```


    If you want to update a package that is already installed, replace **install**
    with **safe-upgrade** in *aptitude* and **install** with **update** in *yum*.
    Next, we''ll learn how to remove a package using the same tools.


    # Removing a Package


    In Debian and derivatives, do


    ```

    aptitude remove package_name

    ```


    or


    ```

    aptitude purge package_name

    ```'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'where **remove** will uninstall the package but leave its configuration files
    intact, whereas **purge** will erase every trace of the program from your system.


    Most (if not all) package managers will prompt you, by default, if you''re sure
    about proceeding with the uninstallation before actually performing it. So read
    the onscreen messages carefully to avoid running into unnecessary trouble!


    # ## Displaying information about a package


    After performing a search for a package, you may want to view additional information
    about it. Both aptitude and yum provide a method to do it:


    ```

    aptitude show package_name

    ```


    ```

    yum info package_name

    ```


    The following command will display information about the *birthday* and *htop*
    packages:


    ```

    aptitude show birthday

    ```


    ```

    yum info htop

    ```


