    # Finding Files in the System


    The `find` command is used to search recursively through directory trees for files
    or directories that match certain characteristics. Subsequently, it can either
    print the matching files or directories or perform other operations on the matches.
    We can search for files by name, owner, group, type, permissions, date, and other
    criteria.


    # Searching for Files by Name


    To search for a file by name, we will use the -name option. We can use wildcards
    if we enclose pattern in quotes.


    As a result, `find` will locate files that match the wildcard filename. The following
    example will locate all files with a name ending in .sh inside /home/gacanepa:


    ```

    find /home/gacanepa -name "*.sh"

    ```'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Searching by Permissions


    If we need to find files that have certain permissions, we can do so by using
    the **-perm** option. If we precede mode with a + (plus sign), find locates files
    in which any of the specified permission bits are set.


    If we precede mode with a - (minus sign), find locates files in which all the
    specified permission bits are set. To find all files that can be executed by any
    user, located inside the current directory (represented by a dot) and descend
    recursively down to 3 levels (using **-maxdepth**):


    ```

    find . -maxdepth 3 -type f -perm -o=x

    ```


    # Searching by Size


    We can search for a file of a given size with the **-size n** expression. Normally,
    n is specified in 512-byte blocks, but we can modify this by trailing the value
    with a letter code, such as c for bytes, k for kilobytes (units of 1024 bytes),
    M for megabytes (units of 1048576 bytes), or G for Gigabytes (units of 1073741824
    bytes). To find all files that are larger than 100MB inside the current directory,
    we will do


    ```

    find . -type f -size +100M

    ```


    where **-type f** indicates we''re searching for regular files. If we were searching
    for directories, we would use **-type d** instead.


    # Searching by Owner or Group Owner


    The **-gid GID** or **-uid UID** expression searches for files whose group ID
    (GID) or user ID (UID) is set to GID or UID, respectively.


    The -group option locates files whose group name is name, but the -gid option
    can come in handy if the GID has been orphaned and has no name, but the latter
    is generally easier to use. Same applies to **-user**.


    # Examples:


    Find all directories inside */var* owned by group *lp*:


    ```

    find /var -type d -group lp

    ```


    Find all files owned by *root* in */etc*:


    ```

    find /etc -type f -user root

    ```'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Searching by Access or Modification Time


    To avoid cluttering up your system with old files that you may never use again,
    it is a good idea to do a clean up once in a while. Modification and access times
    represent the date when a file was last modified or accessed.


    +   - **-atime +30** or **-mtime +30** means files that were last accessed or
    modified more than 30 days ago, respectively.

    - **-atime -30** or **-mtime -30** less than 30 days.

    - **-atime 30** or **-mtime 30** exactly 30 days.


    To view the list of files that were last accessed more than 6 months ago (180
    days) inside */home/me/Documents*, do


    ```

    find /home/me/Documents -type f -atime +180

    ```


    # Performing Operations on the Search Results


    Finally, we can do something with the results returned by find using the **-exec**
    option. This flag takes a command (along with its options) as an argument, followed
    by **{}** + which is a placeholder for the matches resulting from the search.


    To update the timestamps of all .sh files inside the current directory:


    ```

    find . -name "*.sh" -exec touch {} +

    ```


    To remove the execute permission from all .sh files inside */opt*, do


    ```

    find /opt -type f -name "*.sh" -exec touch {} +

    ```


    As you can see, you can combine several search criterias in the same command.


    # Determining a File''s Type


    As we explore the system, it will be useful to know what kind of contents a file
    has without opening it. T


    o do this, we can use the **file** command to determine a file''s type (unlike
    other operating systems, file extensions in Linux are not required to reflect
    a file''s contents).


    We invoke the file command followed by a filename. Similarly, the type command
    is used to determine the type of an executable file.'
  merge: -1
  pgno: 23
