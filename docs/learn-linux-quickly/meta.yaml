  md: '# Chapter 7 - Maintaining Software using APT and YUM


    In this chapter, you will learn:


    +   - Use **aptitude** or **yum** to search for, install, update, or remove packages.

    - Extra reading (links to related Tecmint articles)

    - Exercises


    When we speak of package management in Linux, we refer to a method of *installing*
    and *maintaining* (which includes *updating* and probably *removing* as well)
    software on the system.


    In the early days of Linux, programs were only distributed as source code, along
    with the required man pages, the necessary configuration files, and pretty much
    nothing more. Nowadays, most Linux distributors use by default pre-built programs
    or sets of programs called **packages**, which are presented to users ready for
    installation on that distribution.


    # How Package Management Systems Work


    If a certain package requires a certain resource -such as a shared library, or
    another package-, it is said to have a *dependency*. All modern package management
    systems provide some method of dependency resolution to ensure that when a package
    is installed, all of its dependencies are installed as well.


    Almost all the software that is installed on a modern a Linux system will be found
    on the Internet. It can either be provided by the distribution vendor through
    central repositories (which can contain several thousands of packages, each of
    which has been specifically built, tested, and maintained for the distribution)
    or be available in source code that can be installed downloaded and installed
    manually.


    Because different distribution families use different packaging systems (Debian:
    *.deb / CentOS: *.rpm), a package intended for one distribution will not be compatible
    with another distribution.


    In order to perform the task of package management effectively, you need to be
    aware that you will have available two types of utilities: **low-level tools**
    (which handle in the backend the actual installation, upgrade, and removal of
    package files), and'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'high-level tools (which are in charge of ensuring that the tasks of dependency
    resolution and metadata searching -"data about the data"- are performed).


    | DISTRIBUTION | LOW-LEVEL TOOL | HIGH-LEVEL TOOL |

    | Debian and derivatives | dpkg | apt-get / aptitude |

    | CentOS | rpm | yum |


    The most frequent tasks that you will do with high and low level package management
    tools are listed in the following sections.


    # Installing a Package from a compiled (*.deb or *.rpm) file


    The downside of this installation method is that no dependency resolution is provided.
    You will most likely choose to install a package from a compiled file when such
    package is not available in the distribution''s repositories and therefore cannot
    be downloaded and installed through a high-level tool.


    Since low-level tools do not perform dependency resolution, they will exit with
    an error if we try to install a package with unmet dependencies. To illustrate,
    we will use a fictitious file named file.deb for Debian and derivatives, and file.rpm
    for CentOS and similar distributions:


    ```

    dpkg -i file.deb

    ```


    ```

    rpm -i file.rpm

    ```


    # Upgrading a Package from a Compiled File


    Again, you will only upgrade an installed package manually when it is not available
    in the central repositories.


    ```

    dpkg -i file.deb

    ```


    ```

    rpm -Uvh file.rpm

    ```


    # Listing Installed Packages


    When you first get your hands on an already working system, chances are you''ll
    want to know what packages are installed:'
  merge: -1
  pgno: 40
- img_proc: true
  md: '```

    `dpkg -l`

    ```


    ```

    `rpm -qa`

    ```


    If you want to know whether a specific package is installed, you can pipe the
    output of the above commands to grep. Suppose we need to verify if package *mysql-common*
    is installed on an Ubuntu system:


    ```

    `dpkg -l | grep mysql-common`

    ```


    ![](img/79598d2857a22f9e332d2a8526914a29_41_0.png)


    Another way to determine if a package is installed:


    ```

    `dpkg --status package_name`

    ```


    ```

    `rpm -q package_name`

    ```


    For example, let''s find out whether package *sysdig* is installed on our system


    ![](img/79598d2857a22f9e332d2a8526914a29_41_1.png)


    # ## Finding out which package installed a file


    ```

    `dpkg --search file_name`

    ```


    ```

    `rpm -qf file_name # CentOS / openSUSE`

    ```


    For example, which package installed *pw_dict.hwm*?


    ![](img/79598d2857a22f9e332d2a8526914a29_41_2.png)'
