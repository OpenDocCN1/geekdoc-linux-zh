    ## EXAMPLE 3:

    Suppose you want to perform a backup of users'' home directories. A good sysadmin
    practice would be (may also be specified by company policies) to exclude all video
    and audio files from backups. Maybe your first approach would be to exclude from
    the backup all files with an .mp3 or .mp4 extension (or other extensions). What
    if you have a clever user who can change the extension to .txt or .bkp? Your approach
    won''t do you much good. In order to detect an audio or video file, you need to
    check its file type with `file`. The following shell script will do the job:

    ```bash

    #!/bin/bash

    # Pass the directory to backup as first argument.

    DIR=$1

    # Create the tarball and compress it. Exclude files with the MPEG string in its
    file type.

    # -If the file type contains the string mpeg, $? (the exit status of the most
    recently executed command) expands to 0, and the filename is redirected to the
    exclude option. Otherwise, it expands to 1.

    # -If $? equals 0, add the file to the list of files to be backed up.

    tar -X <(for i in $DIR/*; do file $i | grep -i mpeg; if [ $? -eq 0 ]; then echo
    $i; fi; done) -cjf backupfile.tar.bz2 $DIR/*

    ```


