    # Modifying Process Execution Priorities


    Part of Linux’s flexibility is to let users and system administrators prioritize
    process execution. This feature can come in handy when we have a high-load machine
    and want to make sure some special process(es) get more rights (or “priority”)
    to use system resources than others.


    However, we must note that under normal circumstances we don’t need to worry about
    execution priority because the kernel handles it automatically. The usual method
    of performing a change of execution priority is through the **nice** and **renice**
    commands. We can use nice to launch a program with a specified priority or use
    renice to alter the priority of a running one.


    # Using nice


    When you start a process using nice, the kernel will allocate more or less system
    resources to the process based on the assigned priority (a number commonly known
    as “niceness” in a range from -20 to 19).


    The lower the value, the greater the execution priority. Regular users (other
    than root) can only modify the niceness of processes they own to a higher value
    (meaning a'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'lower execution priority), whereas root can modify this value for any process,
    and may increase or decrease it.


    The default priority value is 0. To start a script named *backup.sh* with a different
    priority, use `nice -n` followed by the desired priority. For example:


    ```

    nice -n -10 backup.sh

    ```


    or


    ```

    nice -n 5 backup.sh

    ```


    While the first example will increase the priority to -10, the second one will
    decrease it to 5.


    # Using renice


    If a process is already running, you can modify its execution priority using **renice
    -n** followed by the new priority and **-p** to indicate the PID. For example,
    let''s suppose that *backup.sh* is still running with PID 9892 and you want to
    change its priority to 10. To do this, use the following command:


    ```

    renice -n 10 -p 9892

    ```


