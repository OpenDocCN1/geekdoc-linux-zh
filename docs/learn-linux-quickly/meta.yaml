    # Chapter 8 - Network Operations


    In this chapter, you will learn:


    +   - Installing and configuring an SSH server

    - Copying files securely over the network

    - Extra reading (links to related Tecmint articles)

    - Exercises


    As a system administrator you will often have to log on to remote systems to perform
    a variety of administration tasks using a terminal emulator. You will rarely sit
    in front of a real (physical) terminal, so you need to set up a way to log on
    remotely to the machines that you will be asked to manage.


    In fact, that may be the last thing that you will have to do in front of a physical
    terminal. For security reasons, using Telnet for this purpose is not a good idea,
    as all traffic goes through the wire in unencrypted, plain text. Instead, we will
    use SSH - a network protocol that provides a secure way to access a remote server.


    # Installing and Securing a SSH Server


    For you to be able to log on remotely to a remote system using SSH, you will have
    to do:


    ```

    yum update && yum install openssh openssh-servers

    ```


    or


    ```

    aptitude install openssh-server

    ```


    After installation, there is a couple of basic things that you need to take into
    account if you want to secure remote access to your SSH server. The following
    settings should be present in the /etc/ssh/sshd_config file.


    1) Change the port where the sshd daemon will listen on from 22 (the default value)
    to a high port (~2000 or greater), but first make sure the chosen port is not
    being used. For example, let’s suppose you choose port 2500. Use netstat (a tool
    included in the'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'net-tools package in CentOS, and out of the box in Debian and derivatives)
    in order to check whether the chosen port is being used or not:


    ```

    netstat -npltu | grep 2500

    ```


    If the above command does not return anything, you can safely use port 2500 for
    sshd, and you should change the Port setting in the configuration file as follows:


    ```

    Port 2500

    ```


    +   2) Only allow SSH protocol 2:


    ```

    Protocol 2

    ```


    +   3) Configure the authentication timeout to 2 minutes, do not allow root logins,
    and restrict to a minimum the list of users which are allowed to login via ssh:


    ```

    LoginGraceTime 2m

    PermitRootLogin no

    AllowUsers gacanepa

    ```


    +   4) If possible, use key-based and disable password authentication:


    ```

    PasswordAuthentication no

    RSAAuthentication yes

    PubkeyAuthentication yes

    ```


    Before this, you will need to create a pair of private and public keys and copy
    the public one from your local machine to the server. To do it, use


    ```

    ssh-keygen -t rsa

    ```


    After running the above command, press Enter a few times to accept the default
    options until you get taken back to the command prompt. Next, go to your home
    directory and type


    ```

    ssh-copy-id -i .ssh/id_rsa.pub192.168.0.100

    ```


    to transfer the public key to the remote server with IP 192.168.0.100. You will
    be prompted to enter the password for your current account in the remote server
    once. Afterwards, you will be able to login without a password by doing


    ```

    ssh 192.168.0.100

    ```'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Transferring files securely over the network


    If you need to ensure security while transferring or receiving files over a network,
    and specially if you need to perform that operation over the Internet, you will
    want to resort to 2 secure methods for file transfers: scp and sftp. Both should
    have been installed along with openssh.


    # Transferring files with scp (secure copy)


    Use the -P flag if SSH on the remote hosts is listening on a port other than the
    default 22. The -p switch will preserve the permissions of local_file after the
    transfer, which will be made with the credentials of remote_user on remote_hosts.
    You will need to make sure that /absolute/path/to/remote/directory is writeable
    by this user.


    ```

    scp -P XXXX -p local_file

    remote_user@remote_host:/absolute/path/to/remote/directory

    ```


    # Receiving files with scp


    You can also download files with scp from a remote host:


    ```

    scp remote_user@remote_host:myFile.txt /absolute/path/to/local/directory

    ```


    Or even between two remote hosts (in this case, copy the file myFile.txt from
    remote_host1 to remote_host2):


    ```

    scp

    remote_user1@remote_host1:/absolute/path/to/remote/directory1/myFile.txt

    remote_user1@remote_host2:/absolute/path/to/remote/directory2/

    ```


    Don''t forget to use scp -P followed by the port number if SSH is listening on
    a port other than the default 22.


    # Sending and receiving files with SFTP


    Unlike SCP, SFTP does not require previously knowing the location of the file
    that we want to download or send.


    This is the basic syntax to connect to a remote host using SFTP:


    ```

    sftp -oPort=XXXX username@host

    ```'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'where *XXXX* represents the port where SSH is listening on host, which can
    be either a hostname or its corresponding IP address. You can omit the **-oPort**
    flag if SSH is listening on its default port (22).


    Once the connection is successful, you can issue the following commands to send
    or receive files:


    ```

    get -Pr [remote file or directory] # Receive files

    put -r [local file or directory] # Send files

    ```


    In both cases, the **-r** switch is used to recursively receive or send files,
    respectively. In the first case, the **-P** option will also preserve the original
    file permissions.


    To close the connection, simply type "exit" or "bye".


    # ## Exercises 7.1


    7.1.1: What are the permissions of the *id_rsa* and *id_rsa.pub* files? Hint:
    these files are located in a hidden subdirectory named *.ssh* inside your */home*
    directory. Use the **file** command to determine their corresponding file types.


    7.1.2: Transfer the file created in 5.1.1 to a directory named rem_files on the
    remote server (IP 192.168.0.100) via scp. Assume SSH is listening on port 10543
    on the remote host. We are assuming the current local user account has write permissions
    on that directory


