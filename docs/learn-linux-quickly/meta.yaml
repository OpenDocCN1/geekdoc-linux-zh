    ## Chapter 5 – Linux Processes

    In this chapter, you will learn

    - Definition of a process

    - Daemons

    - Signals

    - Commands: ps, top, nice, renice, kill, killall

    - Extra reading (links to related Tecmint articles)

    - Exercises

    Every program that runs on our Linux system is a process. The normal life cycle
    of a process includes starting, executing, and dying, and is automatically managed
    by the kernel, without need for user intervention. However, once in a while one
    (or more) of the following exceptions may occur:

    - The process dies due to a known or an unknown reason and needs to be restarted.

    - The process "runs wild" and consumes system resources at an abnormal level and
    needs to be terminated.

    - The process needs to be restarted in order for it to reread its configuration
    file after it has been modified.

    Knowing how to handle those situations is at the very center of the Linux administration
    skills that every system administrator needs to possess.

    To begin, let''s introduce the following concepts related with processes:

    - Every process has a number assigned to it when it starts. It is called **Process
    ID (PID)** and is an integer unique among all running processes.

    - Processes must have associated privileges, and a process'' **UID (User ID)**
    and **GID (Group ID)** are associated with the user who started it, and only have
    access to the system resources owned by it and also others, depending on the file
    permissions.

    - The first process started by the kernel at boot time is a program called **systemd**.
    This process has PID 1 and is the **parent process** of all other processes on
    the system. The parent process ID (PPID) is the PID of the process that created
    the process in question.


    At any time, there could be tens or even hundreds of processes running on our
    Linux system. Monitoring these processes is done using three convenient tools:
    **ps**, **pstree**, and **top**.


    ### Reporting Current Processes with ps

    The **ps** command allows us to take a snapshot of processes currently running
    on our system. Depending on the options used, it can return different types of
    information as we will see in the examples. Without options, **ps** will list
    the processes owned by the current user. On the other hand, it is important to
    note that you can combine several options into one. For example, instead of typing
    ps -e -f you can do ps -ef.

    To display the full list of processes using the standard format, do **ps -ef**
    as shown in the following image where the output has been truncated for the sake
    of brevity:

    ![](img/79598d2857a22f9e332d2a8526914a29_26_0.png)

    In the above image, the **TIME** column indicates the accumulated CPU time used
    by the process. You''ll learn the meaning of the other columns in the *Exercises*
    section in this chapter. It is important to note that you can filter the output
    of **ps -ef** using a pipeline followed by the **grep** command and a filter pattern.
    For example, to display all the processes with the word *firefox* in the associated
    command, do:

    ```ps -ef | grep -i firefox | grep -v grep```

    where the **-i** option will cause **grep** to ignore the case and treat **Firefox**,
    **firefox**, or **FiReFoX** indistinctly. Also, the second pipeline followed by
    **grep -v grep** will remove the actual **grep** command from the results.'
