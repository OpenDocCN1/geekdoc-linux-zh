    In Linux, users and groups are used to control access to files, directories, and
    other system resources.


    As a system administrator you will need to know how to add, edit, suspend or delete
    user accounts and groups, and granting them the necessary permissions to perform
    their tasks.


    These tasks must be performed as root, the superuser, or using the sudo command
    as a regular user. To learn how to use sudo, refer to the links in the *Further
    reading* section at the end of this chapter.


    To switch to the root account, type


    ```

    su -

    ```


    and type root''s password.'
