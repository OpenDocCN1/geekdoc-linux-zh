    in order to check whether the chosen port is being used or not:

    ``` netstat -npltu | grep 2500 ```

    If the above command does not return anything, you can safely use port 2500 for
    sshd, and you should change the Port setting in the configuration file as follows:

    ``` Port 2500 ```

    - 2) Only allow SSH protocol 2:

    ``` Protocol 2 ```

    - 3) Configure the authentication timeout to 2 minutes, do not allow root logins,
    and restrict to a minimum the list of users which are allowed to login via ssh:

    ``` LoginGraceTime 2m PermitRootLogin no AllowUsers gacanepa ```

    - 4) If possible, use key-based and disable password authentication:

    ``` PasswordAuthentication no RSAAuthentication yes PubkeyAuthentication yes ```

    Before this, you will need to create a pair of private and public keys and copy
    the public one from your local machine to the server. To do it, use

    ``` ssh-keygen -t rsa ```

    After running the above command, press Enter a few times to accept the default
    options until you get taken back to the command prompt. Next, go to your home
    directory and type

    ``` ssh-copy-id -i .ssh/id_rsa.pub 192.168.0.100 ```

    to transfer the public key to the remote server with IP 192.168.0.100. You will
    be prompted to enter the password for your current account in the remote server
    once. Afterwards, you will be able to login without a password by doing

    ``` ssh 192.168.0.100 ```


    ## Transferring files securely over the network

    If you need to ensure security while transferring or receiving files over a network,
    and especially if you need to perform that operation over the Internet, you will
    want to resort to 2 secure methods for file transfers: scp and sftp. Both should
    have been installed along with openssh.


    ### Transferring files with scp (secure copy)

    Use the -P flag if SSH on the remote hosts is listening on a port other than the
    default 22. The -p switch will preserve the permissions of local_file after the
    transfer, which will be made with the credentials of remote_user on remote_host.
    You will need to make sure that /absolute/path/to/remote/directory is writeable
    by this user.

    ``` scp -P XXXX -p local_file remote_user@remote_host:/absolute/path/to/remote/directory
    ```


    ### Receiving files with scp

    You can also download files with scp from a remote host:

    ``` scp remote_user@remote_host:myFile.txt /absolute/path/to/local/directory ```

    Or even between two remote hosts (in this case, copy the file myFile.txt from
    remote_host1 to remote_host2):

    ``` scp remote_user1@remote_host1:/absolute/path/to/remote/directory1/myFile.txt
    remote_user1@remote_host2:/absolute/path/to/remote/directory2/ ```

    Don''t forget to use scp -P followed by the port number if SSH is listening on
    a port other than the default 22.


    ### Sending and receiving files with SFTP

    Unlike SCP, SFTP does not require previously knowing the location of the file
    that we want to download or send. This is the basic syntax to connect to a remote
    host using SFTP:

    ``` sftp -oPort=XXXX username@host ```

    where *XXXX* represents the port where SSH is listening on the host, which can
    be either a hostname or its corresponding IP address. You can omit the **-oPort**
    flag if SSH is listening on its default port (22). Once the connection is successful,
    you can issue the following commands to send or receive files:

    ``` get -Pr [remote file or directory] # Receive files

    put -r [local file or directory] # Send files ```

    In both cases, the **-r** switch is used to recursively receive or send files,
    respectively. In the first case, the **-P** option will also preserve the original
    file permissions. To close the connection, simply type "exit" or "bye".


