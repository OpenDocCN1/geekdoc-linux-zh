    ## Chapter 3 - Permissions and Ownership

    In this chapter, you will learn:

    - Users and groups

    - Important files: /etc/passwd, /etc/group, /etc/shadow

    - Commands: chmod, chown, chgrp, visudo

    - The /etc/sudoers file

    - Extra reading (links to related Tecmint articles)

    - Exercises


    In Linux, users and groups are used to control access to files, directories, and
    other system resources. As a system administrator you will need to know how to
    add, edit, suspend or delete user accounts and groups, and grant them the necessary
    permissions to perform their tasks. These tasks must be performed as root, the
    superuser, or using the sudo command as a regular user. To learn how to use sudo,
    refer to the links in the *Further reading* section at the end of this chapter.
    To switch to the root account, type:

    ```bash

    su -

    ```

    and type root''s password.


    ### Adding and Modifying User Accounts and Groups

    To add a new user called *me*, do:

    ```bash

    useradd me

    ```

    This will also create a group named *me*. Additionally, you can create other groups
    using `groupadd`. For example, the following command will add a group called *support*:

    ```bash

    groupadd support

    ```

    When a new account is added, you can find the information about it in */etc/passwd*.
    This file contains a record per system user account and has the following format
    (fields are delimited by a colon):

    - User name

    - User password (or the character x if the password is stored in /etc/shadow in
    encrypted form)

    - User ID (UID): an integer that identifies the account.

    - Group ID (GID): another integer that identifies the group to which the user
    belongs.

    - User info: this field is optional. If it is not empty, it will contain extra
    information about each user account.

    - Absolute path to the user''s home directory.

    - Absolute path to the default shell for the user.


    At any time after adding an account, you can edit the following information (and
    others as well) using **usermod**, whose basic syntax is as follows:

    ```bash

    usermod [options] [username]

    ```

    Examples:

    - To set an expiration date, use the **--expiredate** flag followed by a date
    in the YYYY-MM-DD format.

    - To add the user to supplementary groups, use the combined **-aG**, or the separate
    **--append** and **--groups** options, followed by a comma-separated list of groups.

    - To change the location of the user''s home directory, use the **-d**, or **--home**
    options, followed by the absolute path to the new home directory.

    - To change the user''s default shell, use the **--shell** switch, followed by
    the path to the new shell. If you don''t want to allow the user to be able to
    login (perhaps to temporarily suspend access to his/her account), you can use
    */usr/sbin/nologin* or */usr/bin/false* as shell.


    Note that you can edit the user''s information in a single command or separately.
    You can perform one or more of the above operations simultaneously. The following
    example illustrates the process of doing it all at once:

    ```bash

    usermod --expiredate 2017-05-31 --append --groups users --home /tmp --shell /bin/sh
    me

    ```

    Let''s examine what the above command does:

    - First off, the account that is being modified appears at the end of the command
    (*me*).

    - It will expire on May 31, 2017.

    - The account will be added to the users group.

    - Its home directory is changed to */tmp*, and its default shell to */bin/sh*.


    From time to time, you may need to change other users'' passwords or even your
    own. To do so, use the **passwd** command followed by the username for which you
    want to change the password. In case you want to reset it for yourself, just type
    **passwd** and press Enter.


    ### Exercises 2.1

    2.1.1: Create a new user account named *johndoe* and a group called *misc*.

    2.1.2: Add *johndoe* to group *misc*.

    2.1.3: Change the default shell to /bin/sh.

    2.1.4: Reset the password of johndoe to thi$#is$my%newpassword.


    ### File Permissions and Ownership

    In **Chapter 2**, you learned to use `ls` to list files and directories. Let''s
    take a look at the output of `ls -l`, which provides a detailed listing of a directory''s
    contents or a file''s properties. The first character indicates the object type
    (first highlighted column in the below image):

    - `-` represents a regular file.

    - `d` indicates the object is a directory.

    - `l` represents a symbolic link (a link, or shortcut, to another object).

    - `b` indicates the object is a block device. Storage devices fall into this category.


    ![](img/79598d2857a22f9e332d2a8526914a29_19_0.png)


    The next nine characters of the file attributes represent the **file mode**. The
    first 3 characters in this group indicate the permissions of the file''s owner
    on a given object. The next 2 sets of 3 characters indicate the same information
    for the file''s group owner, and the rest for other system users. For example,
    let''s examine infoSistema.html in the above image:

    - It is a regular file.

    - The file''s owner (*user: gacanepa*) has read and write permissions on the file.

    - Other members of the file''s group owner (*group: gacanepa*) will only be able
    to read the file, same as other system users.


    The easiest way to change a file''s mode is using the `chmod` command followed
    by an expression that indicates the owner''s rights with the letter `u`, the group
    owner''s rights with the letter `g`, and others with `o`. Permissions are then
    granted (or revoked) with the `+` or `-` signs, respectively. For example:

    - **chmod o-r infoSistema.html** revokes the read permission over the file for
    users that are not members of the group owner.

    - **chmod g+wx infoSistema.html** grants write and execute permissions over the
    file for members of the group owner.

    - **chmod +x infoSistema.html** grants execution permissions for all users.


    File and group ownership are changed with the **chown** and **chgrp** commands,
    respectively. The basic syntax for both commands is as follows:

    1. **chown root infoSistema.html** will change the owner of the file to *root*.

    2. **chgrp me infoSistema.html** will change the group owner of the file to *me*.


    After the owner and group associated with the file, **ls -l** shows the size of
    files, the last modification date, and the file name.


    ### Exercises 2.2

    2.2.1: Create a new empty file named file1.sh and set user johndoe as its new
    owner.

    2.2.2: Change the group owner of file1.sh to misc.

    2.2.3: Grant execute permissions on file1.sh to all system users.


    ### Removing Users and Groups

    From time to time, you may also need to remove users or groups for good. Note
    that this is different than merely disabling them as we learned previously. To
    remove an account, use **userdel** followed by the username. Similarly, use **groupdel**,
    followed by the group name, to remove a group.


    ### Exercises 2.3

    2.3.1: Remove the user account johndoe and the group misc. Do a `ls -l` on `file1.sh`.
    What do you see in the columns that represent the owner and group owner of `file1.sh`?


    ### Further Reading

    Links to articles published in Tecmint.com:

    - http://www.tecmint.com/vi-editor-usage/

    - http://www.tecmint.com/su-vs-sudo-and-how-to-configure-sudo-in-linux/

    - http://www.tecmint.com/rhcsa-exam-manage-users-and-groups/2/


    ## Chapter 4 - Finding and Describing Files

    In this chapter, you will learn:

    - Find files based on one or more search criteria

    - Describing files

    - Commands: find, type, file

    - Extra reading (links to related Tecmint articles)

    - Exercises


    ### Finding Files in the System

    The `find` command is used to search recursively through directory trees for files
    or directories that match certain characteristics. Subsequently, it can either
    print the matching files or directories or perform other operations on the matches.
    We can search for files by name, owner, group, type, permissions, date, and other
    criteria.


    ### Searching for Files by Name

    To search for a file by name, we will use the -name option. We can use wildcards
    if we enclose the pattern in quotes. As a result, `find` will locate files that
    match the wildcard filename. The following example will locate all files with
    a name ending in .sh inside /home/gacanepa:

    ```bash

    find /home/gacanepa -name "*.sh"

    ```'
