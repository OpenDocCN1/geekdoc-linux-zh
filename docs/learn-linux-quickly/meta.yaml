    # **Guest Additions and the Extension Pack**


    As mentioned previously, VirtualBox makes it possible to run one or more guests
    on top of the host operating system.


    To better leverage the hardware resources and to provide a better working experience
    with VirtualBox and the appliances running on top of it, the following software
    packages are provided separately:


    **Guest additions** are drivers that can be installed on an desktop appliance-basis,
    and help improve the communication between the hosts and the guests.


    They provide functionality such as shared clipboard / storage, and support for
    several screen resolutions.


    To install guest additions, start a virtual machine [must have desktop environment
    installed] and then go to the Devices → Insert Guest Additions CD image menu,
    and follow the prompts.'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'To install desktop environment in Rocky Linux 9 minimal system run:


    ```

    $ sudo dnf install epel-release

    $ sudo dnf config-manager --set-enabled powertools

    $ dnf copr enable stenstorp/lightdm

    $ dnf groupinstall "xfce"

    $ dnf install lightdm

    $ systemctl disable gdm

    $ systemctl enable lightdm

    $ systemctl set-default graphical.target

    $ reboot

    ```


    The **Extension pack** provides integration between the host''s USB 2.0 and 3.0
    ports and the guest, encryption for disk images, and virtual remote desktop functionality.


    To install them, go to the [VirtualBox Downloads page](https://www.virtualbox.org/wiki/Downloads),
    and click on Oracle VM VirtualBox Extension Pack.


    Note that the installation file is operating system-agnostic, so it will work
    regardless of the operating system of the host where VirtualBox has been installed.


    More information on how to install guest additions and the extension pack can
    be found in [Chapter 1 of the VirtualBox manual](https://www.virtualbox.org/manual/ch01.html).


