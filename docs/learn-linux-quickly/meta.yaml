- img_proc: true
  md: '# ## Adding and Modifying User Accounts and Groups


    To add a new user called *me*, do:


    ```

    useradd me

    ```


    This will also create a group named *me*.


    Additionally, you can create other groups using `groupadd`. For example, the following
    command will add a group called *support*:


    ```

    groupadd support

    ```


    When a new account is added, you can find the information about it in */etc/passwd*.
    This file contains a record per system user account and has the following format
    (fields are delimited by a colon):


    +   - User name

    - User password (or the character x if the password is stored in /etc/shadow in
    encrypted form)

    - User ID (UID): an integer that identifies the account.

    - Group ID (GID): another integer that identifies the group to which the user
    belongs.

    - User info: this file is optional. If it is not empty, it will contain extra
    information about each user account.

    - Absolute path to the user''s home directory.

    - Absolute path to the default shell for the user.


    At any time after adding an account, you can edit the following information (and
    others as well) using **usermod**, whose basic syntax is as follows:


    ```

    usermod [options] [username]

    ```


    Examples:


    +   - To set an expiration date, use the **--expiredate** flag followed by a date
    in the YYYY-MM-DD format.

    - To add the user to supplementary groups, use the combined **-aG**, or the separate
    **--append** and **--groups** options, followed by a comma separated list of groups.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '+   - To change the location of the user''s home directory, use the **-d**,
    or **--home** options, followed by the absolute path to the new home directory.

    - To change the user''s default shell, use the **--shell** switch, followed by
    the path to the new shell. If you don''t want to allow the user to be able to
    login (perhaps to temporarily suspend access to his / her account), you can use
    */usr/sbin/nologin* or */usr/bin/false* as shell.


    Note that you can edit the user''s information in one single command or separately.
    You can perform one or more of the above operations simultaneously. The following
    example illustrates the process of doing it all at once:


    ```

    usermod --expiredate 2017-05-31 --append --groups users --home /tmp --shell /bin/sh
    me

    ```


    Let''s examine what the above command does:


    +   - First off, the account that is being modified appears at the end of the
    command (*me*).

    - It will expire on May 31, 2017.

    - The account will be added the the users group.

    - Its home directory is changed to */tmp*, and its default shell to */bin/sh*.


    From time to time, you may need to change other users'' passwords or even your
    own. To do so, use the **passwd** command followed by the username for which you
    want to change the password. In case you want to reset it for yourself, just type
    **passwd** and press Enter.


