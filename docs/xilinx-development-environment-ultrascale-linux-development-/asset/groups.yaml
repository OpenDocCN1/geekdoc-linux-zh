    # ALINX Ultrascale+ Linux Development Basic Tutorial


    ## Part 6.3: Qt Creator Cross-compilation Environment Setting


    1) Run Qt Creator, if you can''t find the application shortcut, you can search
    for it


    ![](img/6f792577a28af84c82be0eef5006ef77_39_0.png)


    2) Click Tools -> Options


    ![](img/6f792577a28af84c82be0eef5006ef77_39_1.png)


    3) Click "Add.." on the Qt Versions page of the Build & Run option.


    4) Select the qmake file generated by the previous SDK compilation, the path is

    /opt/petalinux/2020.1/sysroots/x86_64-petalinux-linux/usr/bin/qmake


    5) After adding qmake, keep the default name, do not modify


    ![](img/6f792577a28af84c82be0eef5006ef77_40_1.png)


    6) On the Compilers page, click "Add..", select GCC -> C


    ![](img/6f792577a28af84c82be0eef5006ef77_41_0.png)


    7) The Name is modified to zynqMP_GCC, and the Compiler path is /opt/petalinux/2020.1/sysroots/x86_64-petalinux-linux/usr/bin/aarch64-xilinx-linux-aarch64-linux-gcc


    ![](img/6f792577a28af84c82be0eef5006ef77_41_1.png)


    8) On the Compilers page, click "Add..", select GCC -> C++, change the Name to
    zynqMP_C++, and the path selection is /opt/petalinux/2020.1/sysroots/x86_64-petalinux-linux/usr/bin/aarch64-xilinx-linux-aarch64-linux-g++


    ![](img/6f792577a28af84c82be0eef5006ef77_42_0.png)


    9) Click "Apply" as to update the information


    ![](img/6f792577a28af84c82be0eef5006ef77_42_1.png)


    10) Select Debuggers, add one, click Add to add a debugger, change the name to
    zynqMP_gdb, and the path selection is /opt/petalinux/2020.1/sysroots/x86_64-petalinux-linux/usr/bin/aarch64-xilinx-linux/aarch64-xilinx-linux-gdb,
    click Apply


    11) On the Kits page, click Add to add a new Kit, change the Name to zynqMP, select
    Generic Linux Device for Device type, Compiler C select zynqMP_GCC, Compiler C++
    select zynqMP_C++, Debugger select zynqMP_gdb, Qt version select Qt 5.13.2 (System)


    ![](img/6f792577a28af84c82be0eef5006ef77_43_1.png)


    12) Click OK to configure Kits to complete


    ## 6.3: Create Qt test project


    1) Click File -> New File or Project


    ![](img/6f792577a28af84c82be0eef5006ef77_44_0.png)


    2) Select "Application" -> Qt Widgets Application for the project template, and
    then click "Choose..."


    ![](img/6f792577a28af84c82be0eef5006ef77_44_1.png)


    3) Change the Name to qt_test, and select the path /home/alinx/work for this experiment


    ![](img/6f792577a28af84c82be0eef5006ef77_45_0.png)


    4) Kit selection, choose ZYNQMP version here


    ![](img/6f792577a28af84c82be0eef5006ef77_45_1.png)


    5) Choose Next to continue


    6) Select Finish to end the project creation wizard


    ![](img/6f792577a28af84c82be0eef5006ef77_46_1.png)


    7) Double-click the mainwindow.ui


    ![](img/6f792577a28af84c82be0eef5006ef77_47_0.png)


    8) Drag and drop a Push Button to the main interface


    ![](img/6f792577a28af84c82be0eef5006ef77_47_1.png)


    9) Double-click the text part to modify text


    10) Select ZYNQ Kit and click the hammer icon to compile


    11) In the build-zynqMP directory, you can see that a qt_test file has been generated,
    and this file needs to run on FPGA board.


    ![](img/6f792577a28af84c82be0eef5006ef77_48_1.png)


    ### Part 6.5: Run the cross-compiled version of Qt


    1) Copy the previously made BOOT.BIN and image.ub to the sd card


    2) Start the FPGA board and enter the system


    3) Set the Environment Variables for Qt (if X11 is configured, use export QT_PLATFORM=fb)


    ```bash

    export DISPLAY=:0.0

    ```


    4) Run the qt_test


    ```

    /media/sdmmblk1/qt_test

    ```


    5) Press Ctrl + C to end the program


