- md: "\nAfter saving the template, put the xsa file of the new project in the project\
    \ directory, and then use the command petalinux-config --get-hw-description. But\
    \ if the size of ddr you need to manually modify the definition in the project-spec/configs/config\
    \ file.\n\n```\n# Memory Settings\n# CONFIG_SUBSYSTEM_MEMORY_P5_DDR_0_BANKLESS_SELECT=y\n\
    # CONFIG_SUBSYSTEM_MEMORY_SIMPLE_SELECT is not set\n# CONFIG_SUBSYSTEM_MEMORY_MANUAL_SELECT\
    \ is not set\n# CONFIG_SUBSYSTEM_MEMORY_P5_DDR_0_BANKLESS_SIZE=0x40000000\n# CONFIG_SUBSYSTEM_MEMORY_P5_DDR_0_BANKLESS_KERNEL_BASEADDR=0x0\n\
    # CONFIG_SUBSYSTEM_MEMORY_P5_DDR_0_BANKLESS_U_BOOT_TEXTBASE_OFFSET=0x100000\n\
    # CONFIG_SUBSYSTEM_MEMORY_IF_NAME=\"P5_DDR_0\"\n```\n\n# Part 1.7: Some Official\
    \ Optimization Suggestions\n\nTo reduce the build time by disabling the network\
    \ state feeds, de-select the\n\npetalinux-config → Yocto Settings → Enable Network\
    \ state feeds\n\n# ALINX Ultrascale+ Linux Development Basic Tutorial\n\n# Part\
    \ 2: Program hello world\n\n## Part 2.1: Code\n\n- 1) Create an application directory\
    \ app_helloworld\n\n![](img/6f792577a28af84c82be0eef5006ef77_14_0.png)\n\n- 2)\
    \ In the app_helloworld folder, create a main.c document\n\n![](img/6f792577a28af84c82be0eef5006ef77_14_1.png)\n\
    \n- 3) Edit the main.c document\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
    {\n    printf(\"hello world\\r\\n\");\n    return 0;\n}\n```\n\n## Part 2.2: Compile\
    \ the Host Program\n\n- 4) Compile program\n\n```bash\ngcc -o helloworld main.c\n\
    ```\n\n- 5) Run the program directly\n\n```bash\n/helloworld\n```\n\n# ALINX Ultrascale+\
    \ Linux Development Basic Tutorial\n\n- 6) You can see the printed message \"\
    hello world\", indicating that the program has been executed correctly on the\
    \ computer\n\n## Part 2.3: Cross Compile Arm Program\n\nThe program ultimately\
    \ needs to run on the FPGA board. We need to select the arm compiler to compile\
    \ the program for the board. Here, we choose the compiler that comes with Petalinux\
    \ installation\n\n- 1) Run the following command to add the arm compiler to the\
    \ environment variable. The environment variable is only valid in the current\
    \ terminal, and the following commands must be completed in the current terminal.\n\
    \n```bash\nsource /tools/Xilinx/Vivado/2020.1/settings64.sh\n```\n\n- 2) Cross-compiler\n\
    \n```bash\naarch64-linux-gnu-gcc -o helloworld main.c\n```\n\n- 3) Generate executable\
    \ program helloworld on the board\n\n- 4) Use the linux system customized by petalinux\
    \ in the previous chapter, and copy the executable program helloworld to the SD\
    \ card\n\n| 电脑 > BOOT (l:) | SD卡目录 |\n| :--- | :--- |\n| BOOT.BIN | |\n| image.ub\
    \ | |\n| helloworld | |\n\n- 5) Set the board to SD card startup and power on\n\
    \n- 6) Enter linux system\n\n- 7) Enter the directory where helloworld is located\
    \ (sd-mmcblk1p1 represents the first partition of the sd card, sd-mmcblk0p1 represents\
    \ the first partition of emmmc)\n\n```bash\ncd /media/sd-mmcblk1p1\n```\n\n- 8)\
    \ Run the program\n\n```bash\n/helloworld\n```\n\n- 9) You can see the printed\
    \ message \"hello world\", indicating that the program has been executed correctly\
    \ on the board\n\n# Ultrascale+ Linux Development Basic Tutorial\n\n# Part 3:\
    \ gpio Control LED\n\nTo write some simple applications under linux, we will find\
    \ it very simple, such as opening a file, writing a piece of data, and closing\
    \ the handle that was just opened. This completes the entire writing process.\
    \ As for the location of this file, whether it is flash, memory, or hard disk,\
    \ we don't care about it, but don't think that everything becomes simpler under\
    \ linux: open certain file, how did it come from?\n\n## Part 3.1: Device tree\
    \ Generated by Petalinux\n\nIn the linux kernel, many drivers are already included.\
    \ We need to associate these drivers with the hardware on the FPGA board to generate\
    \ usable devices. Before, when we customized the Linux system, petalinux helped\
    \ us generate the device tree. The generated device tree is as follows:\n\n![](img/6f792577a28af84c82be0eef5006ef77_17_0.png)\n\
    \n| | |\n| :--- | :--- |\n| design_1_wrapper.bit | device-tree.mss |\n| hardware_description.hdf\
    \ | pl.dtsi |\n| psu_init.c | .dtree |\n| psu_init.tcl | psu_init.h |\n| system-config.dtsi\
    \ | psu_init_gpl.c |\n| system-top.ps | zynqmp-cc.dtsi |\n\nOpen the zynqp.dtsi\
    \ file, and the gpio device tree on the ps side is described as follows:\n\n```dts\n\
    gpio@ff0a0000 {\n    compatible = \"xinx,zynq-gpio\";\n    status = \"disabled\"\
    ;\n    gpio-cells = <2>;\n    interrupt-parent = <&gic>;\n    interrupts = <0\
    \ 16 4>;\n    interrupt-controller-cells = <2>;\n    reg = <0xff0a0000 0x1000>;\n\
    \    power-domains = <&pd_gpio>;\n};\n```\n\n## Part 3.2: Device Tree\n\nIn the\
    \ directory just now, any modification of the device tree by the user is invalid.\
    \ The user needs to use the following files to modify or add his device tree file.\n\
    \n![](img/6f792577a28af84c82be0eef5006ef77_18_0.png)\n\nBecause the GPIO device\
    \ tree on the ps side has been correctly generated by petalinux, we don't need\
    \ to make any changes.\n\n## Part 3.3: Project creation\n\n- 1) As in the previous\
    \ HelloWorld chapter, create a gpio_test.c function and modify the program code\
    \ as follows:\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n\
    #include <fcntl.h>\n#include <stdbool.h>\n\n#define PS_LED_BASE 338\n#define PS_LED_INDEX\
    \ 40\n#define PS_LED_ADDR (PS_LED_BASE+PS_LED_INDEX)\n\nvoid led_ctl_init(void)\n\
    {\n    int LGpioFd;\n    char ICache[100];\n\n    LGpioFd = open(\"/sys/class/gpio/export\"\
    , O_WRONLY);\n    if(LGpioFd < 0)\n    {\n        printf(\"open export fail\\\
    n\");\n        return;\n    }\n    int len = sprintf(ICache, \"%d\", PS_LED_ADDR);\n\
    \    write(LGpioFd, ICache, len+1);\n    close(LGpioFd);\n\n    sprintf(ICache,\
    \ \"/sys/class/gpio/gpio%d/direction\", PS_LED_ADDR);\n    LGpioFd = open(ICache,\
    \ O_RDWR);\n    if(LGpioFd < 0)\n    {\n        printf(\"open direction fail\\\
    n\");\n        return;\n    }\n    write(LGpioFd, \"out\", 4);\n    close(LGpioFd);\n\
    }\n\nvoid led_ctl_on(bool isON)\n{\n    int LGpioFd;\n    char ICache[100];\n\n\
    \    sprintf(ICache, \"/sys/class/gpio/gpio%d/value\", PS_LED_ADDR);\n    LGpioFd\
    \ = open(ICache, O_RDWR);\n    if (LGpioFd < 0)\n    {\n        printf(\"open\
    \ value fail\\n\");\n        return;\n    }\n    if(isON)\n    {\n        write(LGpioFd,\
    \ \"1\", 2);\n    }\n    else\n    {\n        write(LGpioFd, \"0\", 2);\n    }\n\
    \    close(LGpioFd);\n}\n\nint main()\n{\n    led_ctl_init();\n    printf(\"================\
    \ led ctrl================\\n\");\n    while(1)\n    {\n        led_ctl_on(true);\n\
    \        printf(\"on\\r\\n\");\n        usleep(500000);\n\n        led_ctl_on(false);\n\
    \        printf(\"off\\r\\n\");\n        usleep(500000);\n    }\n    return 0;\n\
    }\n```\n\n# ALINX Ultrascale+ Linux Development Basic Tutorial\n\n## Part 3.4:\
    \ Run The Program\n\n- 1) Boot and enter the FPGA board linux system\n2) View\
    \ the device nodes related to gpio as follows\n\n```bash\nls /sys/class/gpio/\n\
    ```\n\n```bash\nroot@petalinux:~# ls /sys/class/gpio/\nexport gpichip338 unexport\n\
    root@petalinux:~# _\n```\n\n- 3) Here, gpioxxxx refers to a group of gpio, the\
    \ number of pins in it and the specific pin pointed to, if the user does not make\
    \ other changes, it is determined by the vivado project.\n\n- 4) Check the pin\
    \ label information to determine the group of the pin\n\n```bash\nroot@petalinux:~#\
    \ ls /sys/class/gpio/\nexport gpichip338 unexport\nroot@petalinux:~# cat /sys/class/gpio/gpichip338/label\n\
    zynqmp_gpio\nroot@petalinux:~# _\n```\n\n- 5) Through the schematic diagram, we\
    \ know that the PS_led pin is MIO40.\n\n- 6) Use the number 338 of the group where\
    \ PS_led is located, plus\n"
