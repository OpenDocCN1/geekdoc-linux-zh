    # Part 9.3: Read and write speed


    After the SSD is formatted and mounted, you can use the dd command to read and
    write speed measurement.


    +   1. cd into the mounted path


    ```

    /run/media/nvme0np1

    ```


    +   2. Use the dd command to copy the file under the path, and the time-consuming
    and average read and write speed will be printed out completion.


    ```

    dd if=./testfile1 of=./test2 bs=100k

    root@petalinux:/run/media/nvme0np1# dd if=./testfile1 of=./testfile2 bs=100k

    51+1 records out

    5308914 bytes (5.3 MB, 5.1 MiB) copied, 0.0204968 s, 259 MB/s

    ```


    # 3) Sequential write test


    ```

    dd if=/dev/zero of=./testfile1 bs=100k count=1310

    root@petalinux:/run/media/nvme0np1# dd if=/dev/zero of=./testfile1 bs=100k count=1310

    1310+0 records out

    13100000 bytes (134 MB, 128 MiB) copied, 0.470858 s, 285 MB/s

    root@petalinux:/run/media/nvme0np1#

    ```


    # 4) Sequential reading test


    ```

    dd if=./testfile1 of=/dev/null bs=100k

    root@petalinux:/run/media/nvme0np1# dd if=./testfile1 of=/dev/null bs=100k

    51+1 records out

    51+1 records out

    5308914 bytes (5.3 MB, 5.1 MiB) copied, 0.00316914 s, 1.7 GB/s

    root@petalinux:/run/media/nvme0np1#

    ```'
