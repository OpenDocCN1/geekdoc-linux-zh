    U-boot Configuration ---

    Image Packaging Configuration ---

    Firmware Version Configuration ---

    (*)

    <Select> < Exit > < Help > < Save > < Load >

    ```


    - 3) Select SD/DIO Settings -->


    ```

    Subsystem AUTO Hardware Settings

    Arrow keys navigate the menu. <enter> selects submenu (or empty

    ubmenu...). Highlighted letters are hotkeys. Press <Y>

    Includes, <n> excludes, <*> modular features. Press <Esc><Esc> to

    exit, <?> for Help, < /> for Search Legend: [*] built-in []


    - Subsystem AUTO Hardware Settings

    System Processor (psu_cortex53_0) ---

    Memory Settings ---

    Serial Settings --nEthernet Settings ---

    Flash Settings ---

    SD/DIO Settings ---

    RTC Settings ---

    [*] Advanced boot images storage settings ---

    <Select> < Exit > < Help > < Save > < Load >

    ```


    ![](img/6f792577a28af84c82be0eef5006ef77_89_0.png)


    # ALINX Ultrascale+ Linux Development Basic Tutorial


    - 4) Select the SDIO corresponding to EMMC (try it if you are not sure)


    ![](img/6f792577a28af84c82be0eef5006ef77_90_0.png)


    - 5) Save and exit the configuration interface, and recompile the system.


    - 6) Copy the three files in the following figure obtained by compilation to the
    folder where the NFS of the development board is hung


    | 1 | 1 | 1 |

    |---|---|---|

    | 10 | 10 | 10 |

    | 101 | 101 | 101 |

    | 1010 | 1010 | 1010 |

    | boot.scr | BOOT.BIN | image.ub |


    - 7) Copy these three files in the system of the FPGA development board to the
    directory mounted by EMMC.


    - 8) After the copy is complete, use the "umount" command to unmount the EMMC.


    - 9) Disconnect the power supply of the FPGA development board, adjust the DIP
    switch to the state of EMMC startup, and then power on again.

