    # ALINX Ultrascale+ Linux Development Basic Tutorial


    # Part 1: Customizing Linux with Petalinux


    Special reminder, the environment construction tutorial used in this tutorial
    is in the Linux of "Xilinx Development Environment Installation Tutorial", please
    set up the development environment according to the tutorial first.


    This tutorial refers to the official Xilinx tutorial ug1144-petelinux-tools-reference-guide,
    and uses Petelinux to build a basic Linux system.


    # Part 1.1: Create a project with Petalinux


    1) In the user directory, create a working directory. The "~" in the path represents
    the user''s home path, which is equivalent to /home/alinx2020


    ```

    mkdir -p ~/peta_prj/linxBase

    ```


    2) Copy the vivado exported xsa file into the hardware folder. Here use the xsa
    compiled by ps_base(the routines in this document are all as an example, for other
    models, please use the vivado project)(img/6f792577a28af84c82be0eef5006ef77_4_0.png)


    3) Enter the project directory, "~" in the path represents the user''s home path,
    which is equivalent to /home/alinx2020


    ```

    cd ~/peta_prj/linxBase

    ```


    4) Set the petalinux environment variable, run the following command, Environment
    variables are only valid in the current terminal, so the following petalinux-related
    commands must be entered in the current terminal


    ```

    source /opt/pkg/petalinux/settings.sh

    ```


    5) Create a petalinux project with the name "petalinux" and the type "project",
    using the zynqMP template


    ```

    petalinux-create -t project -n petalinux --template zynqMP

    ```


    6) Use the following command to enter the petalinux directory, "-" in the path
    represents the user''s home path, which is equivalent to /home/alinx2020


    ```

    cd ~/peta_prj/linxBase/petalinux

    ```


    7) Configure the hardware information of the Petalinux project, there can only
    be one xsa in the hardware directory


    ```

    petalinux-config --get-hw-description ../hardware/

    ```


    8) The project configuration item interface pops up, as shown in the figure below.
    In the "Auto Config Settings" option, "Device tree autoconfig", "kernel autoconfig"
    and "u-boot autoconfig", then "Save", then "Exit"


    ```

    /home/alinx2020/peta_prj/linxBase/petalinux/project-spec/configs/config - misc/config

    -> Auto Config

    Auto Config Settings

    Arrow key navigate the menu. <Enter> selects submenu ---> (or empty submenu...).
    Highlighted letters are hotkeys. Press </> includes, <#> excludes<m> modular features.
    Press </> to exit, <?> for Help, </> for Search. [*] built-in [] excluded <> module
    capable

    [*] Device tree autoc

    [*] Specify a manual device tree include directory

    (${STAGING_KERNEL_DIR}/include) Automatic device tree include directory (N

    [*] kernel autocfig

    [*] boot autocfig

    ```


    9) If pop up whether to save the configuration interface, select <Yes>,

    press Enter


    ![](img/6f792577a28af84c82be0eef5006ef77_6_0.png)


    10)Wait for the configuration to complete

