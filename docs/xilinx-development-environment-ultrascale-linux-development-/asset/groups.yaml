    # Part 11.2: The Virtual Machine Folder using NFS


    We need to make the system started by eMMC on the virtual machine. In order to
    facilitate copying of the system files required by eMMC system of the FPGA development
    board.


    The NFS Operation refer to Part 7.2.


    # Part 11.3: Make EMMC boot system


    EMMC boot and SD card boot are almost the same. Only one setting in petalinux
    needs to be modified based on the SD boot system.


    - 1) Enter petalinux-config

