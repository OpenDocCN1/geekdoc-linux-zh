- md: "\n# ALINX Ultrascale+ Linux Development Basic Tutorial\n\n9) Edit the main.c\
    \ file and write a simple print\n\n```c\n#include<stdio.h>\n#include<stdlib.h>\n\
    int main()\n{\n    printf(\"hello world!\\n\");\n    return 0;\n}\n```\n\n10)\
    \ Build Project\n\n![](img/6f792577a28af84c82be0eef5006ef77_55_0.png)\n\n## Part\
    \ 7.2: Run via NFS server board is plugged into the Internet cable\n\n- 1) (PS,\
    \ ETH1, the router needs to support automatic IP acquisition, power on, and mount\
    \ the Linux host NFS, 192.168.1.115 is the host address, and /home/alinx2020/work\
    \ is the NFS directory, /mnt is the mount point of the FPGA development board.\
    \ Here, the host and FPGA development board are required to be in the same network\
    \ segment (the red part must be consistent with your actual situation).\n\n```bash\n\
    mount -t nfs -o nolock 192.168.1.115:/home/alinx2020/work /mnt\n```\n\n```bash\n\
    ax_Data login: root\nPassword:\nroot@ax_peta:~# mount -t nfs -o nolock 192.168.1.115:/home/alinx2020/work\
    \ /mnt\nroot@ax_peta:~# \n```\n\n- 2) Enter /mnt/linux_app/hello/Debug directory,\
    \ run hello.elf, we can see Hello World printed out.\n\n```bash\ncd /mnt/linux_app/hello/Debug\n\
    ./hello.elf\n```\n\n```bash\nroot_login: root\nPassword:\nroot@ax_peta:~# mount\
    \ -t nfs -o nolock 192.168.1.115:/home/alinx2020/work /mnt\nroot@ax_peta:~# cd\
    \ /mnt/linux_app/hello/Debug\nroot@ax_peta:~# cd /mnt/linux_app/hello/Debug# ./hello.elf\n\
    hello world!\nroot@ax_peta:~# /mnt/linux_app/hello/Debug# \n```\n\n## Part 8:\
    \ Vitis Accelerates Basic Platform Creation\n\nNote: this tutorial requires proficient\
    \ use of vivado and petalinux, and it is recommended to try Vitis acceleration\
    \ after learning OpenCL and HLS.\n\nThis chapter mainly introduces how to customize\
    \ the hardware and software platform that uses PL-side FPGA acceleration, which\
    \ requires special processing in the Vivado project to be used for acceleration.\
    \ Acceleration requires knowledge of OpenCL and HLS.\n\n## Part 8.1: Vivado hardware\
    \ platform\n\n- 1) The specific steps of the Vivado project will not be explained\
    \ in detail, as shown below\n\n![](img/6f792577a28af84c82be0eef5006ef77_57_0.png)\n\
    \n- 2) Define platform (PFM) interfaces and attributes. Define the interface used\
    \ by Vitis. Click Window→Platform Interface on the Vivado menu to set the platform.\
    \ Click Enable platform Interfaces to set the platform.\n\n![](img/6f792577a28af84c82be0eef5006ef77_58_0.png)\n\
    \n- 3) Change the name of the board to make it easier to understand the Vitis\
    \ platform. Choose Platform, change the following Board to axu3eg\n\n![](img/6f792577a28af84c82be0eef5006ef77_58_1.png)\n\
    ![](img/6f792577a28af84c82be0eef5006ef77_58_2.png)\n\n- 4) Define the available\
    \ interfaces and ports. Right-click on each port and the menu will come out. You\
    \ can also switch between Enable and Disable by double-clicking. In sysc_ultra_ps_0,\
    \ set the next interface and port to Enable (Other than Disable) AXI HPM0 FPD,\
    \ AXI HPM1 FPD, AXI LPD, SXI HPC0 FPD, SXI HPC1 FPD, SXI HP0 FPD, SXI HP1 FPD,\
    \ SXI HP2 FPD, SXI HP3 FPD; for clk all use Enable.\n\n![](img/6f792577a28af84c82be0eef5006ef77_59_0.png)\n\
    \n- 5) Clock default value. A certain clock must be set to the default value.\
    \ After selecting clk, click the Options tab in Platform Properties and select\
    \ \"default\". In addition, the ID must be set to 0 the default clock used in\
    \ Vitis. The other clocks are arranged in sequence starting from 1, and after\
    \ inputting the serial number, press the Enter key to confirm.\n\n![](img/6f792577a28af84c82be0eef5006ef77_60_0.png)\n\
    \n- 6) Then compile and generate bit file\n\n- 7) XRT environment settings, enter\
    \ the following command on the Tcl console\n\n```tcl\nset_property platform.design_intent.embedded\
    \ [current_project]\nset_property platform.design_intent.managed [current_project]\n\
    set_property platform.design_intent.external [current_project]\nset_property platform.design_intent.data\
    \ [current_project]\nset_property platform.default_output_type \"sd card\" [current_project]\n\
    ```\n\n## Part 8.2: Export XSA\n\n- 8) Export the xsa file and select \"Enabled\"\
    , so that you can use Vitis for acceleration.\n\n![](img/6f792577a28af84c82be0eef5006ef77_61_0.png)\n\
    \n- 9) Platform state select \"Pre-synthesis\", then select \"Include bitstream\"\
    \n\n![](img/6f792577a28af84c82be0eef5006ef77_62_0.png)\n\n- 10) Fill in the platform\
    \ properties as shown below\n\n![](img/6f792577a28af84c82be0eef5006ef77_62_1.png)\n\
    \n- 11) Fill in the xsa file name with \"axu3eg_base\"\n\n![](img/6f792577a28af84c82be0eef5006ef77_63_0.png)\n\
    \n## Part 8.3: Vitis Software Platform\n\n### Part 8.3.1: Petalinux configuration\n\
    \n- 1) Image Packaging Configuration -> Root filesystem type select EXT (SD/EMMC/QSPI/SATA/USB)\n\
    \n```\n/home/alinx/zq7020/meta_project/alinxBase/petalinux-sd/project-spec/configs/config\n\
    -> Image Packaging Configuration\nRoot filesystem type\nUse the arrows to navigate\
    \ this window or press the hotkey of the item you wish to select using the <SPACE\
    \ BAR>. Press <?> for additional information about this\n(*) INITRAMFS\n(*) INITRD\n\
    (*) Squash\n(*) NFS\n(*) EXT (SD/EMMC/QSPI/SATA/USB)\n(*) other\n\n<Select> <\
    \ Help >\n```\n\n- 2) The root system path selection is very important. If you\
    \ fill in the wrong file and you cannot start Linux, mmblk represents the sd card\
    \ and emmc, mmblk0p2 represents the second partition of the first device, if the\
    \ emmc and sd exist at the same time, the sd is mmblk1, so fill /dev/mmblk1p2\n\
    \n```\n$home/alinx/2020-04/alinx/project/project-spec/configs/config/\n-Image\
    \ Packaging Configuration\nImage Packaging Configuration\nArrow keys navigate\
    \ the menu. <Enter selects submenu ---> (or empty\nsubmenus...). Highlighted letters\
    \ are hotkeys. Press <Y> to includes, <N> excludes, <M> modularizes features.\
    \ Press <Esc> to exit, <H> for Help, <S> for Search. Legend: [*]\n```\n\n- 3)\
    \ Modify ./project-spec/meta-user/conf/userconfig as follows\n\n```\n# Note: Each\
    \ package in individual line\n#These packages will get added into rootfs\nCONFIG_gpio-demo\n\
    CONFIG_peekpoke\nCONFIG_xrt\nCONFIG_xrt-dev\nCONFIG_zocl\nCONFIG_opencl-hpp-dev\n\
    CONFIG_opencl-headers-dev\nCONFIG_packagegroup-opencv\n```\n\n- 4) Modify the\
    \ device tree file\n./project-spec/meta-user/recipes-bsp/device-tree/files/system-user.dtsi\n\
    \n```dts\n/include/ \"system-conf.dtsi\"\n\n/* SD */\n&sdhci1 {\n    disable-wp;\n\
    }\n\n/* USB */\n&dwc3_0 {\n    status = \"okay\";\n    dr_mode = \"host\";\n}\n\
    \n&amba {\n    zyclmm_drm {\n        compatible = \"xlnx,zocl\";\n        status\
    \ = \"okay\";\n    }\n}\n```\n\n- 5) Configure the root file system\npetalinux-config\
    \ -c rootfs\n\n- 6) check all user packages\n\n- 7) Configure the kernel\n\npetalinux-config\
    \ -c kernel\n\n- 8) Library routines ---> Size in Mega Bytes changed to 1024\n\
    \n- 9) Compile petalinux project\n\npetalinux-build\n\n- 10)Build SDK\n\npetalinux-build\
    \ --sdk\n"
  mdcn: "\n\n# ALINX Ultrascale+ Linux 开发基础教程\n\n9) 编辑 main.c 文件并编写一个简单的打印\n\n```c\n\
    #include<stdio.h>\n#include<stdlib.h>\nint main()\n{\n    printf(\"hello world!\\\
    n\");\n    return 0;\n}\n```\n\n10) 编译项目\n\n![](img/6f792577a28af84c82be0eef5006ef77_55_0.png)\n\
    \n## 第 7.2 部分：通过 NFS 服务器运行（开发板已连接网线）\n\n- 1) (PS, ETH1，路由器需要支持自动获取 IP，开启电源并挂载\
    \ Linux 宿机的 NFS。192.168.1.115 是主机地址，/home/alinx2020/work 是 NFS 目录，/mnt 是 FPGA\
    \ 开发板的挂载点。此处，主机和 FPGA 开发板需要处于同一网段内（红色部分必须与你的实际情况一致）。\n\n```bash\nmount -t nfs\
    \ -o nolock 192.168.1.115:/home/alinx2020/work /mnt\n```\n\n```bash\nax_Data login:\
    \ root\nPassword:\nroot@ax_peta:~# mount -t nfs -o nolock 192.168.1.115:/home/alinx2020/work\
    \ /mnt\nroot@ax_peta:~# \n```\n\n- 2) 进入 /mnt/linux_app/hello/Debug 目录，运行 hello.elf，我们可以看到\
    \ Hello Hello World。\n\n```bash\ncd /mnt/linux_app/hello/Debug\n./hello.elf\n\
    ```\n\n```bash\nroot_login: root\nPassword:\nroot@ax_peta:~# mount -t nfs -o nolock\
    \ 192.168.1.115:/home/alinx2020/work /mnt\nroot@ax_peta:~# cd /mnt/linux_app/hello/Debug\n\
    root@ax_peta:~# cd /mnt/linux_app/hello/Debug# ./hello.elf\nhello world!\nroot@ax_peta:~#\
    \ /mnt/linux_app/hello/Debug# \n```\n\n## 第 8 部分：Vitis 加速基础平台创建\n\n注意：本教程要求熟练使用\
    \ Vivado 和 Petalinux，建议在学习过 OpenCL 和 HLS 之后尝试 Vitis 加速。\n\n本章主要介绍如何自定义使用 PL 端\
    \ FPGA 加速的硬件和软件平台，这需要在 Vivado 项目中进行特殊处理以用于加速。加速需要具备 OpenCL 和 HLS 的知识。\n\n## 第\
    \ 8.1 部分：Vivado 硬件平台\n\n- 1) 将不再详细解释 Vivado 项目的具体步骤，如下所示\n\n![](img/6f792577a28af84c82be0eef5006ef77_57_0.png)\n\
    \n- 2) 定义平台 (PFM) 接口和属性。定义供 Vitis 使用的接口。点击 Vivado 菜单上的 Window→Platform Interface\
    \ 设置平台。点击 Enable platform Interfaces 设置平台。\n\n![](img/6f792577a28af84c82be0eef5006ef77_58_0.png)\n\
    \n- 3) 修改开发板名称以便更容易理解 Vitis 平台。选择 Platform，将以下 Board 修改为 axu3eg\n\n![](img/6f792577a28af84c82be0eef5006ef77_58_1.png)\n\
    ![](img/6f792577a28af84c82be0eef5006ef77_58_2.png)\n\n- 4) 定义可用的接口和端口。右键点击每个端口弹出菜单。你也可以双击在\
    \ Enable 和 Disable 之间切换。在 sysc_ultra_ps_0 中，将下一个接口和端口设置为 Enable（Disable 之外）AXI\
    \ HPM0 FPD, AXI HPM1 FPD, AXI LPD, SXI HPC0 FPD, SXI HPC1 FPD, SXI HP0 FPD, SXI\
