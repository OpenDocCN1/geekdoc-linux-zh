    # ALINX Ultrascale+ Linux Development Basic Tutorial


    # Part 5.2.2: Unzip the root file system to the EXT4 partition of the SD card


    +   1) Enter the decompression command to decompress the file system. It may take
    a few minutes to decompress. Please note that the decompression method must be
    consistent with the tutorial, (/media/alinx/EXT is the path of the EXT4 partition
    of the SD card, which may be different, please modify it according to your actual
    situation).


    ```

    sudo tar xvzf <petalinux path>/images/rootfs.tar.gz -C /media/alinx/EXT

    ```


    +   2) Enter "sudo rsync" in the command window, the synchronization may take
    more than ten minutes.


    +   3) Copy BOOT.bin and iamge.ub to the FAT32 partition (first partition) of
    the SD card, set the FPGA development board to start in SD mode, and start the
    FPGA development board.'
  - '[PAGE 33]


    # ALINX Ultrascale+ Linux Development Basic Tutorial


    # Part 6: QT and OPENCV


    # Cross-Compilation Environment


    Qt is a cross-platform C++ graphical user interface application development framework.
    It can be simply understood as a library for graphics development. If we use the
    Qt library to develop an application with an interface for the board, we need
    to cross-compile the Qt library. OpenCV is a well-known library in video processing.
    Many applications need to use the OpenCV library. In the past, the QT and OpenCV
    libraries had to download the code and compile it by themselves, which was very
    troublesome. This chapter explains how to use Petalinux to configure the development
    environment of OpenCV, which once again reflects the advantages of the Petalinux
    development environment, and only simple configuration can solve complex problems.


    # Part 6.1: Configure the Root File System


    +   1) Run petalinux command to configure rootfs


    ```

    petalinux-config -c rootfs

    ```


    +   2) Check Filesystem Packages → misc →→ gdb and gdbserver, gdb can be used
    to debug applications, and gdbserver can be used to debug applications remotely
    through the network.'
