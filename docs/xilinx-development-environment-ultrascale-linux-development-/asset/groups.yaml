    # Part 11: Boot Linux from EMMC


    EMMC and SD card are similar


    Use the SD card to make the system refer to Part1 or Part 5.

    Use Qflash to start the system refer to Part 10.


    # Part 11.1: Format EMMC and Mount


    To format EMMC, refer to the SSD operation in Part 9,

    The mmc device is generally "/dev/mmcblk", which has the same format as the device
    name of SD card. As for which is the SD card, you need to identify yourself.


    The difference with SSD is that after the partition is completed, the SSD uses
    the mkfs command to format the partition into EXT4 format, but here we need to
    format the EMMC into FAT32. After the partition is completed, do the following
    operations'
