  md: '# ALINX Ultrascale+ Linux Development Basic Tutorial


    home path, which is equivalent to /home/alinx2020


    ```

    cd ~/peta_prj/linxPsBase/

    ```


    +   4) Set the petalinux environment variable, run the following command, Environment
    variables are only valid in the current terminal, so the following petalinux-related
    commands must be entered in the current terminal and need to be re-run after closing


    ```

    source /opt/pkg/petalinux/settings.sh

    ```


    +   5) Create a petalinux project with the name "petalinux" and the type "project",
    using the zynqMP template


    ```

    petalinux-create -t project -n petalinux --template zynqMP

    ```


    +   6) Use the following command to enter the petalinux directory, "-" in the
    path represents the user''s home path, which is equivalent to /home/alinx2020


    ```

    cd ~/peta_prj/linxPsBase/petalinux

    ```


    +   7) Configure the hardware information of the Petalinux project, there can
    only be one xsa in the hardware information directory


    ```

    petalinux-config --get-hw-description ../hardware/

    ```


    +   8) The project configuration item interface pops up, as shown in the figure
    below. In the "Auto Config Settings" option, "Device tree autoconfig", "kernel
    autoconfig" and "u-boot autoconfig", then "Save", then "Exit"'
