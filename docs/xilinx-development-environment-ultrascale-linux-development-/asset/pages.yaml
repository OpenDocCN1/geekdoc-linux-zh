  md: '# ALINX Ultrascale+ Linux Development Basic Tutorial


    # Part 1.5: Petaalinux Use Process Summary


    +   1) Petalinux working environment

    * Petalinux software installation

    * "bin/sh" is bash, the system default may be dash, need to be modified

    * Cannot create petalinux project in shared folder

    * Set petalinux environment variables

    * $ <path-to-installed-PetaLinux>/settings


    +   2) Create Petalinux project

    petalinux-create --type project --template <CPU_TYPE> --name <PROJECT_NAME>

    <CPU_TYPE> can be zynq, zynq, microblaze <PROJECT_NAME> is the project name


    +   3) Import hardware information

    Use the cd command to enter the petalinux project directory

    Use petalinux-config --get-hw-description command to point to the directory containing
    *.xa


    +   4) Configure petalinux

    petalinux-config configures the entire petalinux project. If you need to configure
    uboot, kernel, rootfs, etc., you need to bring the following parameters.

    petalinux-config -c u-boot

    petalinux-config -c kernel

    petalinux-config -c rootfs


    +   5) Compile and create system image

    petalinux-build


    +   6) Manually modify the petalinux configuration, these configuration files
    can be directly copied and used in other projects

    Various files that can be manually configured are stored in the'
  merge: -1
