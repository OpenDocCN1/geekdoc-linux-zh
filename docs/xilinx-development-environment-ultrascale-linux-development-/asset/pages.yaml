  md: '# ALINX Ultrascale: Linux Development Basic Tutorial


    <plnx-proj-root>/project-spec/meta-user directory

    recipes-bsp/u-boot/files/platform-top.h modify u-boot configuration

    recipes-bsp/device-tree/files/system-user.dtsi,

    recipes-bsp/device-tree/files/pl-custom.dtsi can modify and add device tree

    recipes-kernel/linux/linux-xlnx/ saves the kernel configuration

    project-spec/meta-user/recipes-apps save app


    +   7) Clean up petelinux


    If there are various problems with petelinux compilation, especially if we cannot
    compile normally after modifying some configurations, or keep getting stuck, we
    need to use the command petelinux-build -x mrproper -f to clean up the previous
    compilation results.


    # Part 1.6: Save a Project as a Template Project


    Run the "petelinux-build -x mrproper -f" command to clean up the existing project


    Clean the folder according to the following table


    | Folder or File | Can be deleted | other |

    |---|---|--|

    | <base folder> | *.xsa .gitignore | config.project must be retained |

    | .petelinux/ | Delete everything except "metadata" | |

    | .xil/ | delete all | |

    | components/ | Should be an empty folder | Empty folder |

    | project-spec/ | yocto-layer.log | "attributes" must be retained |

    | project-spec/configs/ | config.old, rootfs_config.old | "config" and "rootfs_config"
    must be retained |

    | project-spec/hw-description/ | Delete everything except "metadata" | must be
    retained |

    | project-spec/meta-plinx-generated | delete all | Keep all |'
