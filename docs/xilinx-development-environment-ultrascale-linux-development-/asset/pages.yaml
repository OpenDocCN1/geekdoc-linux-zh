  md: '# ALINX Ultrascale+ Linux Development Basic Tutorial


    # Part 1: Customizing Linux with Petelinux


    Special reminder, the environment construction tutorial used in this tutorial
    is in the Linux of "Xilinx Development Environment Installation Tutorial", please
    set up the development environment according to the tutorial first.


    This tutorial refers to the official Xilinx tutorial ug1144-petelinux-tools-reference-guide,
    and uses Petelinux to build a basic Linux system.


    # Part 1.1: Create a project with Petelinux


    +   1) In the user directory, create a working directory. The "~" in the path
    represents the user''s home path, which is equivalent to /home/alinx2020


    ```

    mkdir -p ~/peta_prj/linxPsBase/hardware

    ```


    +   2) Copy the vivado exported xsa file into the hardware folder. Here I use
    the xsa compiled by the ps_hello project in course2(the routines in this document
    are all 4ev as an example, for other models, please use the vivado project corresponding
    to the chip)


    ![](img/6f792577a28af84c82be0eef5006ef77_4_0.png)


    Note: The xsa file exported by the vivado project of ps_base is used here


    +   3) Enter the project directory, "~" in the path represents the user''s'
