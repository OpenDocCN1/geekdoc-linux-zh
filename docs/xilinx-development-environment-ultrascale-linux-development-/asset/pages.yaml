  md: '# Part 9: NVMe SSD operation under Linux


    # Part 9.1: petelinux Configuration


    1) The PCIe driver is configured by default, and you only need to configure the
    NVMe driver. Enter in the petelinux project directory.


    ```

    petelinux-config -c kernel

    ```


    2) Select <*> NVM Express block device in Device Drivers.


    ![](img/6f792577a28af84c82be0eef5006ef77_77_0.png)


    3) Recompile the petelinux project after saving and exiting.


    # Part 9.2: Set up partition


    1) Plug in the SSD and start the board, run the following command to check if
    the SSD device is loaded normally.


    ```

    ls /dev/nvme*

    root@petelinux:-$ ls /dev/nvme*

    /dev/nvme0  /dev/nvme1

    ```


    2) Operate /dev/nvme01 to set the partition for the SSD.'
