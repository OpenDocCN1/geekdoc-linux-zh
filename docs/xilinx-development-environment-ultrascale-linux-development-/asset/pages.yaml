  md: '# Ultrascale+ Linux Development Basic Tutorial


    # Part 3: gpio Control LED


    To write some simple applications under linux, we will find it very simple, such
    as opening a file, writing a piece of data, and closing the handle that was just
    opened. This completes the entire writing process. As for the location of this
    file, whether it is flash, memory, or hard disk, it''s not that we do care about
    it, but the code just is now fully compatible. But don''t you think that everything
    becomes simpler under linux. This is because we didn''t consider this: open a
    certain file just mentioned, what is this file, and how did it come from?


    # Part 3.1: Device tree Automatically Generated by Petalinux


    In the linux kernel code, many drivers are already included. We need to associate
    these drivers with the hardware on the FPGA board to generate usable devices under
    the system.


    Here, we can use the device tree to associate our hardware and drivers. Before,
    when we customized the Linux system, petalinux helped us automatically generate
    the device tree. The generated device tree directory is as follows:


    ![](img/6f792577a28af84c82be0eef5006ef77_17_0.png)


    design_1_wrapper.bit | device-tree.mss | hardware_description.hdf

    pcw.dtsi | pl.dtsi | psu_init.c | psu_init.h

    psu_init.html | psu_init.tcl | psu_init_gpl.c | psu_init_gpl.h

    system-config.dtsi | system-top.tops | zynqmp.dtsi | zynqmp-clk-ccf.dtsi


    18 / 91 Amazon Store: https://www.amazon.com/alinx'
