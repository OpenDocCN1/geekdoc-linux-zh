- pgno: 44
  md: 'optional "length". You should also define the range of the number that the
    scale allows users to choose; to do this, set a floating point number for each
    of the "from" and "to" configuration options.


    There are several different ways you can set the current value of the scale (which
    must be a floating point value between the "from" and "to" values). You can set
    (or read, to get the current value) the scale''s "value" configuration option.
    You can link the scale to a variable using the "variable" option. Or, you can
    call the scale''s "set value" method to change the value, or the "get" method
    to read the current value.


    There is a "command" configuration option, which lets you specify a script to
    call whenever the scale is changed. Tk will automatically append the current value
    of the scale as a parameter each time it invokes this script (we saw a similar
    thing with extra parameters being added to scrollbar callbacks and those on the
    widgets they scroll).


    As with other themed widgets, you can use the "state disabled", "state !disabled"
    and "!nstate disabled" methods if you wish to prevent the user from modifying
    the scale.


    *As the scale widget does not display the actual values, you may want to add those
    as labels.*


    # ## Spinbox


    +   •Widget Roundup

    +   •Reference Manual


    A **spinbox** widget allows users to choose numbers (or in fact, items from an
    arbitrary list). It does this by combining an entry-like widget showing the current
    value with a pair of small up/down arrows which can be used to step through the
    range of possible choices.


    Spinboxes are part of the classic Tk widgets; there is not presently a spinbox
    in the themed Tk widget set.


    ![](img/94378c1b05607c1dc5649c738af95c74_44_0.png)


    Spinbox widgets are created using the **Spinbox** function:


    ```

    ```python

    spintval = StringVar()

    s = Spinbox(parent, from_=1.0, to=100.0, textvariable=spintval)

    ```

    ```


    Like scale widgets, spinboxes are normally used to let the user choose a number
    between a certain range (specified using the "from" and "to" configuration options),
    though through a very different user interface. You can also specify a "increment",
    which controls how much the value changes everytime you click the up or down button.


    Like a listbox or combobox, spinboxes can also be used to let the user choose
    an item from an arbitrary list of strings; these can be specified using the "values"
    configuration option, which works in the same was as in comboboxes. Specifying
    a list of values will override to "from" and "to" settings.


    *You might be puzzled about when to choose a scale, listbox, combobox, entry or
    a spinbox, since usually several of these can be used for the same types of data.
    The answer really depends on the type of data you want the user to select, platform
    user interface conventions, and the role the value plays in your user interface.*'
  merge: -1
  img_proc: true
- pgno: 45
  md: '> For example, both a combobox and a spinbox have the benefit of taking up
    fairly small amounts of space, which might make sense for a more peripheral setting,
    where the primary choice in a user interface may warrant the extra space a listbox
    occupies. Spinboxes don''t make much sense when items don''t have a natural and
    obvious ordering to them. You should be careful about both comboboxes and spinboxes
    that have too many items in them, which can make it more time consuming to select
    an item.


    Both both a numeric and arbitrary range, there is a "wrap" option which accepts
    a boolean, and determines whether the value should wrap around when it goes beyond
    the starting or ending values. You can also specify a "width" for the entry holding
    the current value of the spinbox.


    Again there are choices as to how to set or get the current value in the spinbox.
    Normally, you would specify a linked variable with the "textvariable" configuration
    option; as usual, any changes to the variable are reflected in the spinbox, while
    any changes in the spinbox are reflected in the linked variable. As well, the
    "setvalue" and "get" methods allow you to set or get the value directly.


    You can arranged to be called whenever the spinbox changes using the "command"
    configuration option.


