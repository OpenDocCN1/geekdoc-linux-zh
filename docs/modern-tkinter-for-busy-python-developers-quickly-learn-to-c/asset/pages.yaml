  md: "# ## Borders\n\nYou can display a border around the frame widget; you see this\
    \ a lot where you might have a part of the user interface looking \"sunken\" or\
    \ \"raised\" in relation to its surroundings. To do this, you need to set the\
    \ `borderwidth` configuration option (which defaults to 0, so no border), as well\
    \ as the `relief` option, which specifies the visual appearance of the border:\
    \ `flat` (default), `raised`, `sunken`, `solid`, `ridge`, or `groove`.\n\nframe[\"\
    borderwidth\"] = 2\nframe[\"relief\"] = 'sunken'\n\n# ## Changing Styles\n\nThere\
    \ is also a `style` configuration option, which is common to all of the themed\
    \ widgets, which can let you control just about any aspect of their appearance\
    \ or behavior. This is a bit more advanced, so we won't go into it right now.\n\
    \n> *Styles mark a sharp departure from the way most aspects of a widget's visual\
    \ appearance are changed in the \"classic\" Tk widgets. While in classic Tk you\
    \ could provide a wide range of options to finely control every aspect of behavior\
    \ (foreground color, background color, font, highlight thickness, selected foreground\
    \ color, padding, etc.), in the new themed widgets these changes are done by changing\
    \ styles, not adding options to each widget.*\n> \n> *As such, many of the options\
    \ you may be familiar with in certain widgets are not present in their themed\
    \ version. Given that overuse of such options was a key factor undermining the\
    \ appearance of Tk applications, especially when moved across platforms, transitioning\
    \ to themed widgets provides an opportune time to review and refine if and how\
    \ such appearance changes are made.*\n\n# ## Label\n\n+   • Widget Roundup\n+\
    \   • Reference Manual\n\nA label is a widget that displays text or images, typically\
    \ that the user will just view but not otherwise interact with. Labels are used\
    \ for such things as identifying controls or other parts of the user interface,\
    \ providing textual feedback or results, etc.\n\n![](img/94378c1b05607c1dc5649c738af95c74_21_0.png)\n\
    \nLabels are created using the `tk.Label` function, and typically their contents\
    \ are set up at the same time:\nlabel = tk.Label(parent, text=\"Full name:\")\n\
    \nLike frames, labels can take several different configuration options which can\
    \ alter how they are displayed."
  merge: -1
  img_proc: true
- pgno: 22
  md: '# ## Displaying Text


    The "text" configuration option shown above when creating the label is the most
    commonly used, particularly when the label is purely decorative or explanatory.
    You can of course change this option at any time, not only when first creating
    the label.


    You can also have the widget monitor a variable in your script, so that anytime
    the variable changes, the label will display the new value of the variable; this
    is done with the "textvariable" option:


    ```

    resultsContents = StringVar()

    label["textvariable"] = resultsContents

    resultsContents.set("New value to display")

    ```


    Tkinter only allows you to attach to an instance of the "StringVar" class, which
    contains all the logic to watch for changes, communicate them back and forth between
    the variable and Tk, and so on. You need to read or write the current value using
    the "get" and "set" methods.


    # ## Displaying Images


    You can also display an image in a label instead of text; if you just want an
    image sitting in your interface, this is normally the way to do it. We''ll go
    into images in more detail in a later chapter, but for now, let''s assume you
    want to display a GIF image that is sitting in a file on disk. This is a two-step
    process, first creating an image "object", and then telling the label to use that
    object via its "image" configuration option:


    ```

    image = PhotoImage(file=\"myimage.gif\")

    label[\"image\"] = image

    ```


    You can use both an image and text, as you''ll often see in toolbar buttons, via
    the "compound" configuration option. The default value is "none", meaning display
    only the image if present, otherwise the text specified by the "text" or "textvariable"
    options. Other options are "text" (text only), "image" (image only), "center"(text
    in center of image), "top" (image above text), "left", "bottom", and "right".


    # ## Layout


    While the overall layout of the label (i.e. where it is positioned within the
    user interface, and how large it is) is determined by the geometry manager, there
    are several options that can help you control how the label will be displayed
    within the box the geometry manager gives it.


    If the box given to the label is larger than the label requires for its contents,
    you can use the "anchor" option to specify which edge or corner the label should
    be attached to, which would leave any empty space in the opposite edge or corner.
    Possible values are specified as compass directions: "n" (north, or top edge),
    "ne", (north-east, or top right corner), "e", "se", "s", "sw", "w", "nw" or "center".


    Labels can be used to display more than one line of text. This can be done by
    embedding carriage returns ("\n") in the "text"/"textvariable" string. You can
    also let the label wrap the string into multiple lines that are no longer than
    a given length (with the size specified as pixels, centimeters, etc.), by using
    the"wraplength" option.


    Multi-line labels are a replacement for the older "message" widgets in classic
    Tk.


    You can also control how the text is justified, by using the "justify" option,
    which can have the values"left", "center" or "right". If you only have a single
    line of text, this is pretty much the same as just using the "anchor" option,
    but is more useful with multiple lines of text.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# # Fonts, Colors and More


    Like with frames, normally you don''t want to touch things like the font and colors
    directly, but if you need to change them (e.g. to create a special type of label),
    this would be done via creating a new style, which is then used by the widget
    with the "style" option.


    Unlike most themed widgets, the label widget also provides explicit widget-specific
    options as an alternative; again, you''d use this only in a special one-off cases,
    when using a style didn''t necessarily make sense.


    You can specify the font used to display the label''s text using the "font" configuration
    option. While we''ll go into fonts in more detail in a later chapter, here are
    the names of some predefined fonts you can use:


    +   * TkDefaultFont The default for all GUI items not otherwise specified.

    +   * TkTextFont Used for entry widgets, listboxes, etc.

    +   * TkFixedFont A standard fixed-width font.

    +   * TkMenuFont The font used for menu items.

    +   * TkHeadingFont The font typically used for column headings in lists and tables.

    +   * TkCaptionFont A font for window and dialog caption bars.

    +   * TkSmallCaptionFont A smaller caption font for subwindows or tool dialogs

    +   * TkIconFont A font for icon captions.

    +   * TkTooltipFont A font for tooltips.


    > Because the choice of fonts is so platform specific, be careful of hardcoding
    them (font families, sizes, etc.); this is something else you''ll see in a lot
    of older Tk programs that can make them look ugly.


    The foreground (text) and background color can also be changed via the "foreground"
    and "background" options. Colors are covered in detail later, but you can specify
    these as either color names (e.g. "red") or hex RGB codes (e.g. "#f340a").


    Labels also accept the "relief" option that was discussed for frames.


    # # Button


    +   * • Widget Roundup

    +   * • Reference Manual


    A button, unlike a frame or label, is very much designed for the user to interact
    with, and in particular, press to perform some action. Like labels, they can display
    text or images, but also have a whole range of new options used to control their
    behavior.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/94378c1b05607c1dc5649c738af95c74_24_0.png)


    Buttons are created using the **tk.Button** function, and typically their contents
    and command callback are set up at the same time:


    ```

    button = tk.Button(parent, text=''Okay'', command=submiForm)

    ```


    As with other widgets, buttons can take several different configuration options
    which can alter their appearance and behavior.


    # ## Text or Image


    Buttons take the same "text", "textvariable" (rarely used), "image" and "compound"
    configuration options as labels, which control whether the button displays text
    and/or an image.


    Buttons have a "default" option, which tells Tk that the button is the default
    button in the user interface (i.e. the one that will be invoked if the user hits
    Enter or Return). Some platforms and styles will draw this with a different border
    or highlight. Set the option to "active" to specify this is a default button;
    the regular state is"normal". Note that setting this option doesn''t create an
    event binding that will make the Return or Enter key activate the button; that
    you have to do yourself.


    # ## The Command Callback


    The "command" option is used to provide an interface between the button''s action
    and your application. When the user clicks the button, the script provided by
    the option is evaluated by the interpreter.


    You can also ask the button to invoke the command callback from your application.
    This is useful so that you don''t need to repeat the command to be invoked several
    times in your program; so you know if you change the option on the button, you
    don''t need to change it elsewhere too.


    ```

    button.invoke()

    ```


    # ## Button State


    Buttons and many other widgets can be in a normal state where they can be pressed,
    but can also be put into a disabled state, where the button is greyed out and
    cannot be pressed. This is done when the button''s command is not applicable at
    a given point in time.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "All themed widgets carry with them an internal state, which is a series of\
    \ binary flags. You can set or clear these different flags, as well as check the\
    \ current setting using the \"state\" and \"instatc\" methods. Buttons make use\
    \ of the \"disabled\" flag to control whether or not the user can press the button.\
    \ For example:\n\n```\n```text\nbutton.state(['disabled']) ;# set the disabled\
    \ flag, disabling the button\nbutton.state(['!disabled']) ;# clear the disabled\
    \ flag\nbutton.instate(['disabled']) ;# return true if the button is disabled,\
    \ else false\nbutton.instate(['!disabled']) ;# return true if the button is not\
    \ disabled, else false\nbutton.instate(['!disabled'], cmd) ;# execute 'cmd' if\
    \ the button is not disabled\n```\n```\n\nNote that these commands accept an *array*\
    \ of state flags as their argument.\n\nUsing \"state\"/\"inststate\" replaces\
    \ the older \"state\" configuration option (which took the values \"normal\" or\
    \ \"disabled\"). This configuration option is actually still available in Tk 8.5,\
    \ but \"write-only\", which means that changing the option calls the appropriate\
    \ \"state\" command, but other changes made using the \"state\" command are not\
    \ reflected in the option. This is only for compatibility reasons; you should\
    \ change your code to use the new state vector.\n\nThe full list of state flags\
    \ available to themed widgets is: \"active\", \"disabled\", \"focus\", \"pressed\"\
    , \"selected\", \"background\", \"readonly\", \"alternate\", and \"invalid\".\
    \ These are described in the themed widget reference; not all states are meaningful\
    \ for all widgets. It's also possible to get fancy in the \"state\" and \"inststate\"\
    \ methods and specify multiple state flags at the same time.\n\n# ## Checkbutton\n\
    \n+   - Widget Roundup\n+   - Reference Manual\n\nA **checkbutton** is like a\
    \ regular button, except that not only can the user press it, which will invoke\
    \ a command callback, but it also holds a binary value of some kind (i.e. a toggle).\
    \ Checkbuttons are used all the time when a user is asked to choose between e.g.\
    \ two different values for an option.\n\n![](img/94378c1b05607c1dc5649c738af95c74_25_0.png)\n\
    \nCheckbuttons are created using the **tk.Checkbutton** function, and typically\
    \ set up at the same time:\n\n```\n```python\nmeasureSystem = StringVar()\ncheck\
    \ = tk.Checkbutton(parent, text='Use Metric',\n                       command=metricChanged,\
    \ variable=measureSystem,\n                       onvalue='metric', offvalue='imperial')\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Checkbuttons use many of the same options as regular buttons, but add a few
    more. The "text", "textvariable", "image", and "compound" options control the
    display of the label (next to the check box itself), and the "state" and "instat"
    methods allow you to manipulate the "disabled" state flag to enable or disable
    the checkbutton. Similarly, the "command" option lets you specify a script to
    be called everytime the user toggles the checkbutton, and the "invoke" method
    will also execute the same callback.


    # ## Widget Value


    Unlike buttons, checkbuttons also hold a value. We''ve seen before how the "textvariable"
    option can be used to tie the label of a widget to a variable in your program;
    the "variable" option for checkbuttons behaves similarly, except it is used to
    read or change the current value of the widget, and updates whenever the widget
    is toggled. By default, checkbuttons use a value of "1" when the widget is checked,
    and "0" when not checked, but these can be changed to just about anything using
    the "onvalue" and "ofvalue" options.


    What happens when the linked variable contains neither the on value or the off
    value (or even doesn''t exist)? In that case, the checkbutton is put into a special
    " tristate" or indeterminate mode; you''ll sometimes see this in user interfaces
    where the checkbox holds a single dash rather than being empty or holding a check
    mark. When in this state, the state flag "alternate" is set, so you can check
    for it with the "instat" method:

    check.instate("alternate")


    Because the checkbutton won''t automatically set (or create) the linked variable,
    your program needs to make sure it sets the variable to the appropriate starting
    value.


    # ## Radiobutton


    +   - Widget Roundup

    +   - Reference Manual


    A **radiobutton** lets you choose between one of a number of mutually exclusive
    choices; unlike a checkbutton, it is not limited to just two choices. Radiobuttons
    are always used together in a set, and are a good option when the number of choices
    is fairly small, e.g. 3-5.


    ![](img/94378c1b05607c1dc5649c738af95c74_26_0.png)


    Radiobuttons are created using the **tk.Radiobutton** function, and typically
    as a set:

    phone = StringVar()

    home = tk.Radiobutton(parent, text=''Home'', variable=phone, value=''home'')

    office = tk.Radiobutton(parent, text=''Office'', variable=phone, value=''office'')

    cell = tk.Radiobutton(parent, text=''Mobile'', variable=phone, value=''cell'')


    Radiobuttons share most of the same configuration options as checkbuttons. One
    exception is that the"onvalue" and "ofvalue" options are replaced with a single
    "value" option. Each of the radiobuttons of the set will have the same linked
    variable, but a different value; when the variable has the given value, the radiobutton
    will be selected,'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'otherwise unselected. When the linked variable does not exist, radiobuttons
    also display a "tristate" or indeterminate, which can be checked via the "alternate"
    state flag,


    # Entry


    +   - Widget Roundup

    +   - Reference Manual


    An **entry** represents the user with a single line text field that they can use
    to type in a string value. These can be just about anything: their name, a city,
    a password, social security number, and so on.


    ![](img/94378c1b05607c1dc5649c738af95c74_27_0.png)


    Entries are created using the **tk.Entry** function:


    ```

    username = StringVar()

    name = tk.Entry(parent, textvariable=username)

    ```


    A "width" configuration option may be specified to provide the number of characters
    wide the entry should be, allowing you for example to provide a shorter entry
    for a zip or postal code.


    We''ve seen how checkbutton and radiobutton widgets have a value associated with
    them. Entries do as well, and that value is normally accessed through a linked
    variable specified by the "textvariable" configuration option. Note that unlike
    the various buttons, entries don''t have a separate text or image beside them
    to identify them; use a separate label widget for that.


    You can also get or change the value of the entry widget directly, without going
    through the linked variable. The "get" method returns the current value, and the
    "delete" and "insert" methods let you change the contents, e.g.


    ```

    print("current value is %s" % name.get())

    name.delete(0,''end'')       # delete between two indices, 0-based

    name.insert(0, ''your name'') # insert new text at a given index

    ```


    Note that entry widgets do not have a "command" option which will invoke a callback
    whenever the entry is changed. To watch for changes, you should watch for changes
    on the linked variable. See also "Validation", below.


    # Passwords


    Entries can be used for passwords, where the actual contents are displayed as
    a bullet or other symbol. To do this, set the "show" configuration option to the
    character you''d like to display, e.g. "*".


    # Widget States


    Like the various buttons, entries can also be put into a disabled state via the
    "state" command (and queried with "instat e"). Entries can also use the state
    flag "readonly"; if set, users cannot change the entry, though they can still
    select the text in it (and copy it to the clipboard). There is also an "invalid"
    state, set if the entry widget fails validation, which leads us to...


    # Validation


    validate (controls overall validation behavior) - none (default), key (on each
    keystroke, runs before - prevalidation),

    focus/focusin/focusout (runs

    after,

    revalidation),

    all

    * validatecommand

    script

    (script

    must

    return

    1

    or

    0)

    * invalidcommand

    script

    (runs

    when

    validate

    command

    returns

    0)'
  merge: -1
  img_proc: true
- pgno: 28
  md: '- various substitutions in scripts.. most useful %P (new value of entry), %s
    (value of entry prior to editing)

    - the callbacks can also modify the entry using insert/delete, or modify -textvariable,
    which means the in progress edit is rejected in any case (since it would overwrite
    what we just set)

    *.e validate to force validation now


    # # Combobox


    +   - Widget Roundup

    +   - Reference Manual


    A **combobox** combines an entry with a list of choices available to the user.
    This lets them either choose from a set of values you’ve provided (e.g. typical
    settings), but also put in their own value (e.g. for less common cases you don’t
    want to include in the list).


    ![](img/94378c1b05607c1dc5649c738af95c74_28_0.png)


    Comboboxes are created using the `tk.Combobox` function:


    ```

    ```python

    countryvar = StringVar()

    country = tk.Combobox(parent, textvariable=countryvar)

    ```

    ```


    Like entries, the "`textvariable`" option links a variable in your program to
    the current value of the combobox. As with other widgets, the linked variable
    will not be set automatically. You can also get the current value using the "`get`"
    method, and change the current value using the "`set`" method (which takes a single
    argument, the new value).


    A combobox will generate a "`<ComboboxSelected>`" virtual event that you can bind
    to whenever its value changes.


    ```

    ```python

    country.bind("<ComboboxSelected>", function)

    ```

    ```


    # ## Predefined Values


    You can provide a list of values the user can choose from using the "`values`"
    configuration option:


    ```

    ```python

    country[''values''] = (''USA'', ''Canada'', ''Australia'')

    ```

    ```


    If set, the "`readonly`" state flag will restrict the user to making choices only
    from the list of predefined values, but not be able to enter their own (though
    if the current value of the combobox is not in the list, it won’t be changed).


    As a complement to the "`get`" and "`set`" methods, you can also use the "`current`"
    method to determine which item in the predefined values list is selected (call
    "`current`" with no arguments, it will return a 0-based index into the list, or
    -1 if the current value is not in the list), or select one of the items in the
    list (call"`current`" with a single 0-based index argument).'
  merge: -1
  img_proc: true
- pgno: 29
  md: '> Want to associate some other value with each item in the list, so that your
    program can refer to some actual meaningful value, but it gets displayed in the
    combobox as something else? You''ll want to have a look at the section entitled
    “Keeping Extra Item Data” when we get to the discussion of listboxes in a couple
    of chapters from now.


    # The Grid Geometry Manager


    We''ll take a bit of a break from talking about different widgets (what to put
    onscreen), and focus instead on geometry management (where to put it). We introduced
    the general idea of geometry management in the “Tk Concepts” chapter; here, we
    focus on one specific geometry manager: grid.


    As you''ve seen, grid lets you layout widgets in columns and rows. If you''re
    familiar with using HTML tables to do layout, you''ll feel right at home here.
    This chapter describes the various ways you can tweak grid to give you all the
    control you need for your user interface.


    Grid is one of several geometry managers available in Tk, but it''s mix of power,
    flexibility and ease of use, along with its natural fit with today''s layouts
    (that rely on alignment of widgets) make it the best choice for general use. There
    are other geometry managers: “pack” is also quite powerful, but harder to use
    and understand; “place” gives you complete control of positioning each element;
    we''ll see even widgets like paned windows, notebooks, canvas and text can act
    as geometry managers.


    > Grid was first introduced to Tk in 1996, several years after Tk became popular,
    and took a while to catch on. Before that, developers had always used “pack” to
    do constraint-based geometry management. When grid came out, many developers kept
    using pack, and you''ll still find it used in many Tk programs and documentation.
    While there''s nothing technically wrong with it, the algorithm''s behavior is
    often hard to understand. More importantly, because the order that widgets are
    packed is significant in determining layout, modifying existing layouts can be
    difficult.


    > Grid has all the power of pack, generally produces nicer layouts (because it
    makes it easy to align widgets both horizontally and vertically), and is easier
    to learn and use. Because of that, we think grid is the right choice for most
    developers most of the time. Start your new programs using grid, and switch old
    ones to grid as you''re making changes to an existing user interface.


    The reference documentation for grid provides an exhaustive description of grid,
    its behaviors and all options.


    # Columns and Rows


    Using grid, widgets are assigned a “column” number and a “row” number, which indicates
    their relative position to each other. All widgets in the same column will therefore
    be above or below each other, while those in the same row will be to the left
    or right of each other.


    Column and row numbers must be integers, with the first column and row starting
    at 0. You can leave gaps in column and row numbers (e.g. column 0, 1, 2, 10, 11,
    12, 20, 21), which is handy if you plan to add more widgets in the middle of the
    user interface at a later time.


    The width of each column (or height of each row) depends on the width or height
    of the widgets contained within the column or row. This means when sketching out
    your user interface, and dividing it into rows and columns, you don''t need to
    worry about each column or row being equal width.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Spanning Multiple Cells


    Widgets can take up more than a single cell in the grid; to do this, you’ll use
    the “columnspan” and “rowspan” options when gridding the widget. These are analogous
    to the “colspan” and “rowspan” attribute of HTML tables.


    Here is an example of creating a user interface that has multiple widgets, some
    that take up more than a single cell.


    ![](img/94378c1b05607c1dc5649c738af95c74_30_0.png)


    ```

    ```

    from tkinter import *

    from tkinter import ttk


    root = Tk()


    content = ttk.Frame(root)

    frame = ttk.Frame(content, borderwidth=5, relief="sunken", width=200, height=100)

    namebl = ttk.Label(content, text="Name")

    name = ttk.Entry(content)


    onevar = BooleanVar()

    twowar = BooleanVar()

    threevar = BooleanVar()

    onevar.set(True)

    twowar.set(False)

    threevar.set(True)


    one = ttk.Checkbutton(content, text="One", variable=onevar, onvalue=True)

    two = ttk.Checkbutton(content, text="Two", variable=twovar, onvalue=True)

    three = ttk.Checkbutton(content, text="Three", variable=threevar, onvalue=True)

    ok = ttk.Button(content, text="Okay")

    cancel = ttk.Button(content, text="Cancel")


    content.grid(column=0, row=0)

    frame.grid(column=0, row=0, columnspan=3, rowspan=2)

    namebl.grid(column=3, row=0, columnspan=2)

    name.grid(column=3, row=1, columnspan=2)

    one.grid(column=0, row=3)

    two.grid(column=1, row=3)

    three.grid(column=2, row=3)

    ok.grid(column=3, row=3)

    cancel.grid(column=4, row=3)


    root.mainloop()

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# ## Layout within the Cell


    Because the width of a column (and height of a row) depends on all the widgets
    that have been added to it, the odds are that at least some widgets will have
    a smaller width or height than has been allocated for the cell its been placed
    in. So the question becomes, where exactly should it be put within the cell?


    By default, if a cell is larger than the widget contained in it, the widget will
    be centered within it, both horizontally and vertically, with the master’s background
    showing in the empty space around it. The “sticky” option can be used to change
    this default behavior.


    The value of the “sticky” option is a string of 0 or more of the compass directions
    “nsew”, specifying which edges of the cell the widget should be “stuck” to. So
    for example, a value of “n” (north) will jam the widget up against the top side,
    with any extra vertical space on the bottom; the widget will still be centered
    horizontally. A value of “nw” (north-west) means the widget will be stuck to the
    top left corner, with extra space on the bottom and right.


    > In Tkinter, you can also specify this as a list, containing any of N, S, E and
    W.


    Specifying two opposite edges, such as “we” (west, east) means that the widget
    will be stretched, in this case so it is stuck both to the left and right edge.
    So the widget will then be wider than its "ideal" size. Most widgets have options
    that can control how they are displayed if they are larger than needed. For example,
    a label widget has an “anchor” option which controls where the text of the label
    will be positioned.


    If you want the widget to expand to fill up the entire cell, grid it with a sticky
    value of "nsew" (north, south, east, west) meaning it will stick to every side.


    # ## Handling Resize


    If you’ve taken a peek below and added the extra “sticky” options to our example,
    when you try it out you’ll notice things still don’t look quite right (the entry
    is lower on the screen then we’d want), and things are even worse if you try to
    resize the window — nothing moves at all!


    It looks like “sticky” may tell Tk how to react if the cell’s row or column does
    resize, but doesn’t actually say that the row or columns should resize if extra
    room becomes available. Let’s fix that.


    Every column and row has a “weight” grid option associated with it, which tells
    it how much it should grow if there is extra room in the master to fill. By default,
    the weight of each column or row is 0, meaning don’t expand to fill space.


    For the user interface to resize then, we’ll need to give a positive weight to
    the columns we’d like to expand. This is done using the “columnconfigure” and
    “rowconfigure” methods of grid. If two columns have the same weight, they’ll expand
    at the same rate; if one has a weight of 1, another of 3, the latter one will
    expand three pixels for every one pixel added to the first.


    Both “columnconfigure” and “rowconfigure” also take a “minsize” grid option, which
    specifies a minimum size which you really don’t want the column or row to shrink
    beyond.


    # ## Padding


    Normally, each column or row will be directly adjacent to the next, so that widgets
    will be right next to each other. This is sometimes what you want (think of a
    listbox and its scrollbar), but often you want some space between widgets. In
    Tk, this is called padding, and there are several ways you can choose to add it.'
