    \ at a time, and as we do so, a status bar will display the population of the\
    \ country. Double-clicking on the list, or hitting the Return key, will send one\
    \ of several gifts to the selected country's head of state (well, not really,\
    \ but use your imagination).\n\n![](img/94378c1b05607c1dc5649c738af95c74_37_0.png)\n\
    \n```\nfrom tkinter import *\nfrom tkinter import ttk\nroot = Tk()\n\n# Initialize\
    \ our country \"databases\":\n# - the list of country codes (a subset anyway)\n\
    # - a parallel list of country names, in the same order as the country codes\n\
