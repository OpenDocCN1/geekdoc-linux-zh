  md: '# Conventions


    As is typically done, code listings, interpreter or shell commands and responses
    will be indicated with a fixed-width font. When showing an interactive session
    with the interpreter, the parts that you enter will additionally be in **bold
    fixed-width**.


    When describing procedure or method calls, the literal parts (e.g. the method
    name) will be in plain fixed-width font, parameters where you should fill in the
    actual value will add *italics*, and optional parameters will be surrounded by
    “?”, e.g. “set variable ?value?”.


    A number of icons appearing to the left of text are used, as follows:


    This paragrah consists of material that is specific to the Python binding to Tk.


    This paragraph will help point out common mistakes that people make, or suggest
    useful but not necessarily obvious solutions related to the topic.


    This indicates a new way of doing things in Tk 8.5 that is very different from
    the way things would have been done previously. People familiar with older versions
    of Tk, or working on programs developed with older versions of Tk, should pay
    close attention.


    This paragrah provides some additional background information, not strictly necessary
    to understanding the topic at hand, but that might help you understand a bit more
    about how or why things are done the way they are.


    This indicates some error in the tutorial itself which hasn’t yet been corrected,
    or a section that has been deleted but not yet replaced.


    This indicates an area in Tk that could most charitably be described as a “rough
    edge”. It may indicate a bad or missing API requiring you to use a workaround
    in your code. Because these things tend to get fixed up over time, it’s worth
    marking them in your code with a “TODO” so you can remember to go back later and
    see if a newer API resolves the problem cleanly.


    # Installing Tk


    In this chapter, you’ll get Tk installed on your machine, verify it works, and
    then see a quick example of what a Tk program looks like.


    Though pretty much all Mac OS X and Linux machines come with Tk installed already,
    it’s usually an older version (typically 8.4.x). You want to make sure you’ve
    got at least version 8.5 to use the new widget set, so if that’s not already there,
    you’ll want to install the newer version.


    Though there are lots of ways to install Tk, the easiest is to download and install
    one of the versions provided by ActiveState (www.activestate.com).


    ActiveState is a company that sells professional developer tools for dynamic languages.
    They also provide (for free) quality-controlled distributions of some of these
    languages, and happen to employ a number of core developers of these languages.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Installing Tk on Mac OS X


    Tkinter (and, since Python 3.1, ttk) are included with all standard Python distributions.
    It is important that you use a version of Python supporting Tk 8.5 or greater,
    and ttk. We recommend installing the "ActivePython" distribution from ActiveState,
    which includes everything you''ll need.


    In your web browser, go to www.activestate.com, and follow along the links to
    download the Community Edition of ActivePython for Mac OS X, available as a universal
    binary. Make sure you''re downloading a 3.1 or newer version.


    Run the installer and follow along. You''ll end up with a fresh install of ActivePython
    in /Library/Frameworks, along with links to the versioned Python binaries placed
    in /usr/local/bin (e.g. ‘python3.2’ if you downloaded ActivePython 3.2.x). From
    a Terminal window you should then be able to run a Python shell:


    ```

    % /usr/local/bin/python3.2

    ```


    This should give you the Python command prompt. From the prompt, enter these two
    commands:


    ```

    >>> import tkinter

    >>> tkinter._test()

    ```


    This should pop up a small window; the first line at the top of the window should
    say "This is Tcl/Tk version 8.5"; make sure it is not 8.4!


    You can also get the exact version of Tcl/Tk that is being used with:


    ```

    >>> tkinter.Tcl().eval(''info patchlevel'')

    ```


    which should return something like ''8.5.10''.


    Verified install using ActivePython 3.2.1.2 on Mac OS X 10.7.1.


    # Installing Tk on Windows


    Tkinter (and, since Python 3.1, ttk) are included with all standard Python distributions.
    It is important that you use a version of Python supporting Tk 8.5 or greater,
    and ttk. We recommend installing the "ActivePython" distribution from ActiveState,
    which includes everything you''ll need.


    In your web browser, go to www.activestate.com, and follow along the links to
    download the Community Edition of ActivePython for Windows. Make sure you''re
    downloading a 3.1 or newer version, not a 2.x version.


    Run the installer, and follow along. You''ll end up with a fresh install of ActivePython,
    located in, e.g. C:\python32. From a Windows command prompt, or the Start Menu''s
    "Run..." command, you should then be able to run a Python shell via:


    ```

    % C:\python32\python

    ```


    This should give you the Python command prompt. From the prompt, enter these two
    commands:


    ```

    >>> import tkinter

    >>> tkinter._test()

    ```


    This should pop up a small window; the first line at the top of the window should
    say "This is Tcl/Tk version 8.5"; make sure it is not 8.4!


    You can also get the exact version of Tcl/Tk that is being used with:'
