    number of menus, very long menus, or deeply nested menus, you may need to rethink
    how your user interface is organized. Second, many people use the menus to explore
    what the program can do, particularly when they''re first learning it, so try
    to ensure major features are accessible by the menus. Finally, for each platform
    you''re'
