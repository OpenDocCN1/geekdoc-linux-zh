  img_proc: true
- pgno: 69
  md: 'The "1.0" here represents where to insert the text, and can be read as "line
    1, character 0". This refers to the first character of the first line; for historical
    conventions related to how programmers normally refer to lines and characters,
    line numbers are 1-based, and character numbers are 0-based.


    The text to insert is just a string. Because the widget can hold multi-line text,
    the string you supply can be multi-line as well. To do, simply embed "\n" (newline)
    characters in your string at the appropriate locations.


    # Scrolling


    Scrollbars, both horizontal and vertical, can be attached to the text widget.
    This works exactly the same as using scrollbars in any other widget, such as a
    listbox or canvas.


    You can also ask the widget to ensure that a certain part of the text is visible.
    For example, if you''ve added more text to the widget than will fit onscreen (so
    it will scroll) but want to ensure that the top of the text rather than the bottom
    is visible, call the "see" method, passing it the position of the text (e.g.,
    "1.0").


    # Controlling Wrapping


    What if some lines of text in the widget are very long, longer than the width
    of the widget? By default, text will just wrap around to the next line, but if
    and how it does this can be controlled by the "wrap" configuration option. The
    default value is "char", meaning wrap around right at the character at the end
    of the line; other options are "word" to cause wrapping, but only at word breaks
    (e.g. spaces), and "none" meaning don''t wrap around at all. In the latter case,
    some of the text won''t be visible unless you attach a horizontal scrollbar to
    the widget.


    # Disabling the Widget


    Some forms will temporarily disable editing in particular widgets unless certain
    conditions are met (e.g. some other options are set to a certain value). To prevent
    the user from making any changes to a text widget, set the "state" configuration
    option to "disabled"; re-enable editing by setting this option back to "normal".


    # Retrieving the Text


    Finally, after the user has made any changes and submitted the form, your program
    will want to retrieve the contents of the widget, which is done with the "get"
    method:


    ```

    thextext = text.get(''1.0'', ''end'')

    ```


    # Modifying the Text in Code


    While the user can modify the text in the text widget interactively, your program
    can also make changes. Adding text is done with the "insert" method, which we
    used above to provide an initial value for the text widget.


    # Text Positions and Indices


    When we specified a position of "1.0" (first line, first character), this was
    an example of an index. It tells the insert method where to insert the new text
    (just before the first line, first character, i.e. at the very start of the widget).
    There are a variety of ways to specify these indices. You''ve also seen another
    one: the "end"(from the "get" example) means just past the end of the text ("just
    past" because text insertions go right before the given index, so inserting at
    "end" will add text to the end of the widget). Note that Tk will alwaysadd a newline
    at the very end of the text widget.


    Here are a few additional examples of indices, and what they mean:


    +   ```

    +   3.end         The newline at the end of line 3.

    +   1.0 + 3 chars Three characters past the start of line 1.

    +   2.end -1 chars The last character before the new line in line 2.

    +   end -1 chars  The newline that Tk always adds at the end of the text.

    +   end -2 chars  The actual last character of the text.

    +   ```'
