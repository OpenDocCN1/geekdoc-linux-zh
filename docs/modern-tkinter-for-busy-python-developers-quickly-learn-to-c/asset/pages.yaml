- pgno: 84
  md: 'Again, using our button example, we had an element "Button.label", which among
    other things had a "font" configuration option. What happens is that when that
    "Button.label" element is drawn, it looks at the "font" configuration option set
    on the style to determine what font to draw itself in.


    > *To understand why, you need to know that when a style includes an element as
    a piece of it, that element does not maintain any (element-specific) storage.
    In particular, it does not store any configuration options itself. When it needs
    to retrieve options, it does so via the containing style, which is passed to the
    element. Individual elements therefore are "flyweight" objects in GoF pattern
    parlance.*


    Similarly, any other elements will lookup their configuration options from options
    set on the style. What if two elements use the same configuration option (like
    a background color)? Because there is only one background configuration option,
    stored in the style, that means both elements will use the same background color.
    You can''t have one element use one background color, and the other use a different
    background color.


    > *Except when you can. There are a few nasty, widget-specific things called "sublayouts"
    in the current implementation which let you sometimes modify just a single element,
    via configuring an option like "TButton.Label" (rather than just "TButton", the
    name of the style). Are the cases where you can do this documented? Is there some
    way to introspect to determine when you can do this? No to both. This is one area
    of the themed widget API that I definitely expect to evolve over time.*


    The second difficulty is also related to modifying style options:


    **Options that are available don''t necessarily have an effect, and it''s not
    an error to modify a bogus option.**


    You''ll sometimes try to change an option that is supposed to exist according
    to element options, but it will have no effect. As an example, you can''t modify
    the background color of a button in the "aqua" theme used by Mac OS X. While there
    are valid reasons for these cases, at the moment its not easy to discover them,
    which can make experimenting frustrating at times.


    Perhaps more frustrating when you''re experimenting is that specifying an "incorrect"
    style name or option name does not generate an error. When doing a "configure"
    or "lookup" you can in fact specify any name at all for a style, and specify any
    name at all for an option. So if you''re bored with the "background" and "font"
    options, feel free to configure a "dothwithmean" option. It may not do anything,
    but it''s not an error. Again, it may make it hard to know what you should be
    modifying and what you shouldn''t.


    > *This is one of the downsides of having a very lightweight and dynamic system.
    You can create new styles by just providing their name when configuring style
    options; this means you don''t need to explicitly create a style object. At the
    same time, this does open itself to errors. It''s also not possible to find out
    what styles currently exist or are used. And because style options are really
    just a front end for element options, and the elements in a style can change at
    any time, it''s not necessarily obvious that options should be restricted to those
    referred to by current elements alone, which may themselves not all be introspectable.*


    Finally, here is the last thing that makes styles and themes so difficult:


    **The elements available, the names of those elements, which options are available
    or have an effect for each of those elements, and which are used for a particular
    widget can be different in every theme.**


    So? Keep in mind among other things that the default theme for each platform (Windows,
    Mac OS X, and Linux) are different, (which is a good thing). Some implications
    of this:


    85'
  merge: -1
  img_proc: true
- pgno: 85
  md: '+   1.If you want to define a new type of widget (or more likely a variation
    of an existing widget) for your application, you''re going to need to do it separately
    and differently for each theme your application uses (so at least three for a
    cross-platform application).


    +   2.The elements and options available will differ for each theme/platform,
    meaning you may have to come up with a quite different customization approach
    for each theme/platform.


    +   3.The elements, names, and element options available with each theme are not
    typically documented (outside of reading the theme definition files themselves),
    but are generally identified via theme introspection (which we''ll see soon).
    Because all themes aren''t available on all platforms (e.g. "aqua" will only run
    on Mac OS X), you''ll need ready access to every platform and theme you need to
    run on.


    As an example, here is what the layout of the "Button" style looks like on the
    theme used by default on three different platforms, as well as the advertised
    options for each element (not all of which have an effect):


    |  |  |

    | --- | --- |

    | Mac OS X | Button.button -sticky nsw -children {Button.padding -sticky nsw -children
    {Button.label -sticky nsw}} |


    Button.button -


    Button.padding padding, relief, shifrelief


    Button.label compound, space, text, font, foreground, underline, width, anchor,
    justify, wraplength, embossed, image, stipple, background


    |  |  |

    | --- | --- |

    | Windows | Button.button -sticky nsw -children {Button.focus -sticky nsw -children
    {Button.padding -sticky nsw -children {Button.label -sticky nsw}}} |


    Button.button -


    Button.focus -


    Button.padding padding, relief, shifrelief


    Button.label compound, space, text, font, foreground, underline, width, anchor,
    justify, wraplength, embossed, image, stipple, background


    |  |  |

    | --- | --- |

    | Linux | Button.border -sticky nsw -border 1 -children {Button.focus -sticky
    nsw -children {Button.padding -sticky nsw -children Button.label -sticky nsw}}
    |


    Button.border background, borderwidth, relief


    Button.focus focusthickness


    Button.padding padding, relief, shifrelief


    Button.label compound, space, text, font, foreground, underline, width, anchor,
    justify, wraplength, embossed, image, stipple, background


    The bottom line is that in classic Tk, where you had the ability to modify any
    of a large set of attributes for an individual widget, you''re able to do so much
    more easily on one platform and it will work more or less the same way on others.
    In themed Tk, the easy option just isn''t there, and you''re pretty much forced
    to do it the right way if you want your application to work with multiple themes/platforms.
    It''s more work up front.


    # Advanced: More on Elements


    While that''s about as far as we''re going to go on styles and themes in this
    tutorial, for curious users and those who want to delve further into creating
    new themes, we can provide a few more interesting tidbits about elements.


    Because elements are the building blocks of styles and themes, it begs the question
    of "where do elements come from?" Practically speaking, we can say that elements
    are normally created in C code, and conform to a particular API that the theming
    engine understands.


    At the very lowest level, elements come from something called an element factory.
    At present, there is a "default" one, which most themes use, and uses Tk drawing
    routines to create elements. A second allows you to create elements from'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'images, and is actually accessible at the script level using the "ttk::style
    element create" method (from Tcl). Finally, there is a third, Windows-specific
    engine using the underlying "Visual Styles" platform API.


    If a theme uses elements created via a platform''s native widgets, the calls to
    use those native widgets will normally appear within that theme''s element specification
    code. Of course, themes whose elements depend on native widgets or API calls can
    only run on the platforms that support them.


    Themes will then take a set of elements, and use those to assemble the styles
    that are actually used by the widgets. And given the whole idea of themes is so
    that several styles can share the same appearance, it''s not surprising that different
    styles share the same elements.


    So while the "TButton" style includes a "Button.padding" element, and the "TEntry"
    style includes a "Entry.padding" element, underneath these padding elements are
    more than likely one and the same. They may appear differently, but that''s because
    of different configuration options, which as we recall, are stored in the style
    that uses the element.


    It''s also probably not surprising to find out that a theme can provide a set
    of common options which are used as defaults for each style, if the style doesn''t
    specify them otherwise. This means that if pretty much everything in an entire
    theme has a green background, the theme doesn''t need to explicitly say this for
    each style. This uses a root style named ""; after all, if "F.un.TButton" can
    inherit from "TButton", why can''t "TButton" inherit from ""?


    Finally, it''s worth having a look at how existing themes are defined, both at
    the C code level in Tk''s C library, but also via the Tk scripts found in Tk''s
    "library/ttk" directory. Search for "Tkx_RegisterElementSpec" in Tk''s C library
    to see how elements are specified.'
  merge: -1
  img_proc: true
