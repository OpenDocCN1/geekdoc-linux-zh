- pgno: 50
  md: "```\nmenu_help = Menu(menubar, name='help')\nmenubar.add_cascade(menu=menu_help,\
    \ label='Help')\n```\n\n> The widget pathname of the menu must be explicitly provided,\
    \ in this case with the name 'help'. This can be specified for any Tkinter widget\
    \ using the 'name' option when creating the widget.\n\n# Contextual Menus\n\n\
    Contextual menus (\"popup\" menus) are typically invoked by a right mouse button\
    \ click on an object in the application. A menu pops up at the location of the\
    \ mouse cursor, and the user can select from one of the items in the menu (or\
    \ click outside the menu to dismiss it without choosing any item).\n\nTo create\
    \ a contextual menu, you'll use exactly the same commands you did to create menus\
    \ in the menubar. Typically, you'll create one menu with several command items\
    \ in it, and potentially some cascade menu items and their associated menus.\n\
    \nTo activate the menu, the user will use a contextual menu click, which you will\
    \ have to bind to. That however, can mean different things on different platforms.\
    \ On Windows and X11, this is the right mouse button being clicked (the third\
    \ mouse button). On Mac OS X, this is either a click of the left (or only) button\
    \ with the control key held down, or a right click on a multi-button mouse. Unlike\
    \ Windows and X11, Mac OS X refers to this as the second mouse button, not the\
    \ third, so that's the event you'll see in your program.\n\n> Most earlier programs\
    \ that have used popup menus assumed it was only \"button 3\" they needed to worry\
    \ about.\n\nBesides capturing the correct contextual menu event, you'll also need\
    \ to capture the location the mouse was clicked. It turns out you need to do this\
    \ relative to the entire screen (global coordinates) and not local to the window\
    \ or widget you clicked on (local coordinates). The \"%X\" and \"%Y\" substitutions\
    \ in Tk's event binding system will capture those for you.\n\nThe last step is\
    \ simply to tell the menu to popup at the particular location. Here's an example\
    \ of the whole process, using a popup menu on the application's main window.\n\
    \n```\nfrom tkinter import *\nroot = TK()\nmenu = Menu(root)\nfor i in ('One',\
    \ 'Two', \"Three\"):\n    menu.add_command(label=i)\nif (root.tk.call('tk', 'windowingsystem')==\
    \ 'aqua'):\n    root.bind('<2>', lambda e: menu.post(e.x_root, e.y_root))\n  \
    \  root.bind('<Control-1>', lambda e: menu.post(e.x_root, e.y_root))\nelse:\n\
    \    root.bind('<3>', lambda e: menu.post(e.x_root, e.y_root))\n```\n\n# Windows\
    \ and Dialogs\n\nEverything we've done up until now has been in a single window.\
    \ In this chapter, we'll cover how to use multiple windows, changing various attributes\
    \ of windows, and use some of the standard dialog box windows that are available\
    \ in Tk."
  merge: -1
  img_proc: true
- pgno: 51
  md: '# # Creating and Destroying Windows


    You''ve already seen that all Tk programs start out with a root toplevel window,
    and then widgets are created as children of that root window. Creating new toplevel
    windows works almost exactly the same as creating new widgets.


    Toplevel windows are created using the **Toplevel** function:


    ```

    ```

    t = Toplevel(parent)

    ```

    ```


    Unlike regular widgets, you don''t have to “grid” a toplevel for it to appear
    onscreen. Once you''ve created a new toplevel, you can then create other widgets
    which are children of that toplevel, and grid them inside the toplevel. In other
    words, the new toplevel behaves exactly like the automatically created root window.


    To destroy a window, you can use the **destroy** method on a widget:


    ```

    ```

    window.destroy()

    ```

    ```


    Note that you can use **destroy** on any widget, not just a toplevel window. Also,
    when you destroy a window, all windows (widgets) that are children of that window
    are also destroyed. So if you happen to destroy the root window (that all other
    widgets are descended from), that will normally end your application.


    # # Changing Window Behavior and Styles


    There are lots of things about how windows behave and how they look that can be
    changed.


    # ## Window Title


    To examine or change the title of the window:


    ```

    ```

    oldtitle = window.title()

    window.title(''New title'')

    ```

    ```


    # ## Size and Location


    In Tk, a window''s position and size on the screen is known as its geometry. A
    full geometry specification looks like this:


    ```

    ```

    widthxheight+x+y

    ```

    ```


    Width and height (normally in pixels) are pretty self-explanatory. The “x” (horizontal
    position) is specified with a leading plus or minus, so “+25” means the left edge
    of the window should be 25 pixels from the left edge of the screen, while “-50”
    means the right edge of the window should be 50 pixels from the right edge of
    the screen. Similarly, a “y” (vertical) position of “+10” means the top edge of
    the window should be ten pixels below the top of the screen, while “-100” means
    the bottom edge of the window should be 100 pixels above the bottom of the screen.


    > > Remember that the geometry''s position are the actual coordinates on the screen,
    and don''t make allowances for systems like Mac OS X which have a menubar along
    the top, or a dock area along the bottom. So specifying a position of “+0+0” would
    actually place the top part of the window under the system menu bar. It''s a good
    idea to leave a healthy margin (at least 30 pixels) from an edge of the screen.


    Here is an example of changing the size and position, placing the window towards
    the top righthand corner of the screen:


    ```

    ```

    window.geometry(''300x200-5+40'')

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# ## Stacking Order


    Stacking order refers to the order that windows are "placed" on the screen, from
    bottom to top. When the positions of two windows overlap each other, the one closer
    to the top of the stacking order will obscure or overlap the one lower in the
    stacking order.


    You can obtain the current stacking order, a list from lowest to highest, via:


    ```

    root.tk.eval(''wm stackorder ''+str(window))

    ```


    > This method doesn''t appear to be exposed cleanly through Tkinter''s API.


    You can also just check if one window is above or below another:


    ```

    if (root.tk.eval(''wm stackorder ''+str(window)+'' isabove ''+str(otherwindow))==1)
    ...

    if (root.tk.eval(''wm stackorder ''+str(window)+'' isbelow ''+str(otherwindow))==1)
    ...

    ```


    You can also raise or lower windows, either to the very top (bottom) of the stacking
    order, or just above (below) a designated window:


    ```

    window.lift()

    window.lift(otherwin)

    window.lower()

    window.lower(otherwin)

    ```


    > Tkinter uses the name ''lift''; since ''raise'' is a reserved keyword.


    Wondering why you needed to pass a window to get the current stacking order? It
    turns out that stacking order, raise and lower, etc. work not only for toplevel
    windows, but with any "sibling" widgets (those having the same parent). So if
    you have several widgets gridded together but overlapping, you can raise and lower
    them relative to each other. For example:


    ```

    from tkinter import *

    from tkinter import ttk

    root = Tk()

    little = ttk.Label(root, text="Little")

    bigger = ttk.Label(root, text=''Much bigger label'')

    little.grid(column=0,row=0)

    bigger.grid(column=0,row=0)

    root.after(2000, lambda: little.lift())

    root.mainloop()

    ```


    > The "after" command schedules a script to be executed at a certain number of
    milliseconds in the future, but allows normal processing of the event loop to
    continue in the meantime.


    # ## Resizing Behavior


    Normally, toplevel windows, both the root window and others that you create, can
    be resized by the user. However, sometimes in your user interface, you may want
    to prevent the user from resizing the window. You can prevent it from being resized,
    in fact independently specifying whether the window''s width (first parameter)
    can be changed, as well as its height (second parameter). So to disable all resizing:


    ```

    window.resizable(FALSE,FALSE)

    ```


    Remember that if you''ve added a ttk::sizegrip widget to the window, that you
    should remove it if you''re making the window non-resizable.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'If resizing is enabled, you can specify a minimum and/or maximum size that
    you''d like the window''s size to be constrained to (again, parameters are width
    and height):


    ```

    window.minsize(200,100)

    window.maxsize(500,500)

    ```


    # Iconifying and Withdrawing


    On most systems, you can temporarily remove the window from the screen by iconifying
    it. In Tk, whether or not a window is iconified is referred to as the window''s
    state. The possible states for a window include"normal"and "iconic" (for an iconified
    window), as well as several others: "withdrawn", "icon" or "zoomed".


    You can query or set the current window state, and there are also the methods
    "iconify" and "deiconify"which are shortcuts for setting the "iconic" or "normal"
    states respectively.


    ```

    thestate = window.state()

    window.state(''normal'')

    window.iconify()

    window.deiconify()

    ```


    # Standard Dialogs


    Dialog boxes are a type of window used in applications to get some information
    from the user, inform them that some event has occurred, confirm an action and
    more. The appearance and usage of dialog boxes is usually quite specifically detailed
    in a platform''s style guide. Tk comes with a number of dialog boxes built-in
    for common tasks, and which help you conform to platform specific style guidelines.


    # Selecting Files and Directories


    Tk provides several dialogs to let the user select files or directories. On Windows
    and Mac, these invoke the underlying operating system dialogs directly. The "open"
    variant on the dialog is used when you want the user to select an existing file
    (like in a "File | Open..." menu command), while the "save" variant is used to
    choose a file to save into (normally used by the "File | Save As..." menu command).


    ```

    from tkinter import filedialog

    filename = filedialog.askopenfilename()

    filename = filedialog.asksaveasfilename()

    dirname = filedialog.askdirectory()

    ```


    All of these commands produce modal dialogs, which means that the commands (and
    hence your program) will not continue running until the user submits the dialog.
    The commands return the full pathname of the file or directory the user has chosen,
    or return an empty string if the user cancels out of the dialog.


    ![](img/94378c1b05607c1dc5649c738af95c74_53_0.png)


    54'
  merge: -1
  img_proc: true
- pgno: 54
  md: '![](img/94378c1b05607c1dc5649c738af95c74_54_0.png)


    ![](img/94378c1b05607c1dc5649c738af95c74_54_1.png)


    There are a variety of different options that can be passed to these dialogs,
    allowing you to set the allowable file types, default filename, and more. These
    are detailed in the getOpenFile/getSaveFile and chooseDirectory reference manual
    pages.


    # Selecting Colors


    There is also a modal dialog to let the user select a color. It will return a
    color value, e.g. “#ff62b8”. The dialog takes an optional “initialcolor” option
    to specify an existing color that the user is presumably replacing.


    ```

    from tkinter import colorchooser

    colorchooser.askcolor(initialcolor=''#ff0000'')

    ```


    ![](img/94378c1b05607c1dc5649c738af95c74_54_2.png)'
  merge: -1
  img_proc: true
- pgno: 55
  md: "# Aler t and Confirmation Dialogs\n\nMany applications use various simple modal\
    \ alerts or dialogs to notify the user of an event, ask them to confirm an action,\
    \ or make another similar choice which is done by clicking on a button. Tk provides\
    \ a versatile 'message box' that encapsulates all these different types of dialogs.\n\
    \n```\nfrom tkinter import messagebox\nmessagebox.showinfo(message='Have a good\
    \ day')\n```\n\n![](img/94378c1b05607c1dc5649c738af95c74_55_0.png)\n\n![](img/94378c1b05607c1dc5649c738af95c74_55_1.png)\n\
    \n![](img/94378c1b05607c1dc5649c738af95c74_55_2.png)\n\n# Simple Message Boxes\n\
    \n```\nmessagebox.askyesno(\n    message='Are you sure you want to install SuperVirus?',\n\
    \    icon='question' title='Install')\n```\n\n![](img/94378c1b05607c1dc5649c738af95c74_55_3.png)\n\
    \n![](img/94378c1b05607c1dc5649c738af95c74_55_4.png)\n\n![](img/94378c1b05607c1dc5649c738af95c74_55_5.png)\n\
    \n# Example Message Boxes\n\nLike the previous dialogs that we've seen, these\
    \ are modal, and will return the result of the user's action to the caller. The\
    \ exact return value will depend on the \"type\" option passed to the command,\
    \ as shown here:\n\n| **Type option** | **Possible return values** |\n|---|---|\n\
    | ok (default) | \"ok\" |\n| okcancel | \"ok\" or \"cancel\" |\n| yesno | \"yes\"\
    \ or \"no\" |\n| yesnocancel | \"yes\", \"no\" or \"cancel\" |\n| retrycancel\
    \ | \"retry\" or \"cancel\" |\n| abortretryignore | \"abort\", \"retry\" or \"\
    ignore\" |\n\nRather than using a 'type' option, Tkinter uses a different method\
    \ name for each type of dialog. The available methods are: askokcancel, askquestion,\
    \ askretrycancel, askyesno, askyesnocancel, showerror, showinfo, showwarning.\n\
    \nThe full list of possible options is shown here:\n\n| **type** | **As described\
    \ above.** |\n|---|---|"
  merge: -1
  img_proc: true
