    # ## Frame


    +   •Widget Roundup

    +   •Reference Manual


    A **frame** is a widget that displays just as a simple rectangle. Frames are primarily
    used as a container for other widgets, which are under the control of a geometry
    manager such as grid.


    ![](img/94378c1b05607c1dc5649c738af95c74_20_0.png)


    Frames are created using the **ttk.Frame** function:

    frame = ttk.Frame(parent)


    Frames can take several different configuration options which can alter how they
    are displayed.


    # ### Requested Size


    Like any other widget, after creation it is added to the user interface via a
    (parent) geometry manager. Normally, the size that the frame will request from
    the geometry manager will be determined by the size and layout of any widgets
    that are contained in it (which are under the control of the geometry manager
    that manages the contents of the frame itself).


    If for some reason you want an empty frame that does not contain other widgets,
    you should instead explicitly set the size that the frame will request from its
    parent geometry manager using the "width" and/or "height" configuration options
    (otherwise you''ll end up with a very small frame indeed).


    > *Normally, distances such as width and height are specified just as a number
    of pixels on the screen. You can also specify them via one of a number of suffixes.
    For example, "350" means 350 pixels, "350c" means 350 centimeters, "350i" means
    350 inches, and **350p** means 350 printer''s points (1/72 inch).*


    # ### Padding


    The "padding" configuration option is used to request extra space around the inside
    of the widget; this way if you''re putting other widgets inside the frame, there
    will be a bit of a margin all the way around. A single number specifies the same
    padding all the way around, a list of two numbers lets you specify the horizontal
    then the vertical padding, and a list of four numbers lets you specify the left,
    top, right and bottom padding, in that order.

    frame["padding"] = (5,10)'
