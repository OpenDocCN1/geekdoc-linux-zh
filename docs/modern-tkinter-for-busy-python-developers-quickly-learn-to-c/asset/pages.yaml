- pgno: 15
  md: '# Widgets


    Widgets are all the things that you see ons creen. In our example, we had a button,
    an entry, a few labels, and a frame. Others are things like checkboxes, tree views,
    scrollbars, text areas, and so on. Widgets are what are often referred to as “controls”;
    you’ll also often see them referred to as “windows”, particularly in Tk’s documentation,
    a holdover from its X11 roots (so under that terminology, both a toplevel window
    and things like a Button would be called windows).


    Here is an example showing some of Tk’s widgets, which we’ll cover individually
    shortly.


    ![](img/94378c1b05607c1dc5649c738af95c74_15_0.png)


    # Widget Classes


    Widgets are objects, instances of classes that represent buttons, frames, and
    so on. So the first thing you’ll need to do is identify the specific class of
    the widget you’d like to instantiate. This tutorial and the widget roundup will
    help with that.


    # Window Hierarchy


    The other thing you’ll need to know is the parent of the widget instance you’d
    like to create. In Tk, all widgets are part of a window hierarchy, with a single
    root at the top of the hierarchy. This hierarchy can be arbitrarily deep; so you
    might have a button in a frame in another frame within the root window. Even a
    new toplevel window is part of that same hierarchy, with it and all its contents
    forming a subtree of the overall window hierarchy.


    In our metric conversion example, we had a single frame that was created as a
    child of the root window, and that frame had all the other controls as children.
    The root window was a container for the frame, and was therefore the frame’s parent.
    The complete hierarchy for the example looked like this:


    ![](img/94378c1b05607c1dc5649c738af95c74_15_1.png)


    The window hierarchy of the metric conversion example.


    # Creating and Using Widgets


    Each separate widget is a Python object. When creating a widget, you must pass
    its parent as a parameter to the widget creation function. The only exception
    is the “root” window, which is the toplevel window that will contain everything
    else. That is automatically created, and it does not have a parent. For example:


    ```

    root = Tk()

    content = tk.Frame(root)

    button = tk.Button(content)

    ```'
