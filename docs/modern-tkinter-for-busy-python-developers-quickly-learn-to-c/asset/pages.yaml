    \ line 2.\n2.5 wordstart The first character of the word containing the character\
    \ at index 2.5.\n2.5 wordend The first character just past the last character\
    \ of the word containing index 2.5.\n\nSome additional things to keep in mind:\n\
    •The term \"chars\" can be abbreviated as \"c\", and \"lines\" as \"l\".\n•You\
    \ can omit the spaces between the terms, e.g. \"1.0+1c\".\n•If you specify an\
    \ index past the end of the widget (e.g. \"end + 100c\") it will be interpreted\
    \ as the end.\n•Adding characters will wrap to the next lines as needed, e.g.\
    \ \"1.0 + 10 chars\" on a line with only five characters will end up being on\
    \ the second line.\n•When using indices containing multiple words, make sure to\
    \ quote them appropriately so that Tk sees the entire index as a single argument.\n\
    •When moving up or down a certain number of lines, this is interpreted as logical\
    \ lines, where each line is terminated only by the \"\\n\". With long lines and\
    \ wrapping enabled, this may be represent multiple lines on the display. If you'd\
    \ like to move up or down a single line on the display, you can specify this as\
    \ e.g. \"1.0 + 2 display lines\".\n•To determine the actual canonical position\
    \ of an index, use the \"index\" method, passing it the index expression, and\
    \ it will return the corresponding index in the form \"line.char\".\n•You can\
    \ compare two indices using the \"compare\" method, which lets you check for equality,\
    \ whether one index is later in the text than the other, etc.\n\n# Deleting Text\n\
    \nWhile the \"insert\" method adds new text anywhere in the widget, the \"delete\"\
    \ method removes it. You can specify either a single character to be deleted (by\
    \ index), or a range of characters specified by the start and end index. In the\
    \ latter case, characters from (and including) the start index through to just\
    \ before the end index will be deleted (so the character at the end index is not\
    \ deleted). So this would remove a single line of text (including its trailing\
    \ newline) from the start of the text:\ntext.delete('1.0', '2.0')\n\nThere is\
    \ also a \"replace\" method, taking a starting index, and ending index and a string\
