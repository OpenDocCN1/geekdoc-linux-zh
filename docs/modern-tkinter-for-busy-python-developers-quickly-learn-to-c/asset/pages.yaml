- pgno: 41
  md: '![](img/94378c1b05607c1dc5649c738af95c74_41_0.png)


    SizeGrips are created using the **ttk.Sizegrip** function:


    ```

    ttk.Sizegrip(parent).grid(column=999, row=999, sticky=(S,E))

    ```


    While you''ll notice that on some platforms (e.g. Mac OS X), Tk will automatically
    put the size grip there for you, it doesn''t hurt to explicitly add it yourself.
    We''ll discuss how to change the window size, determine if it''s resizable, etc.
    in a later chapter.


    # ## Text


    +   * Widget Roundup

    +   * Reference Manual


    A **text** widget provides users with an area so that they can enter multiple
    lines of text. Text widgets are part of the classic Tk widgets, not the themed
    Tk widgets.


    ![](img/94378c1b05607c1dc5649c738af95c74_41_1.png)


    Tk''s text widget is, along with the canvas widget, one of two uber-powerful widgets
    that provide amazingly deep but easily programmed features. Text widgets have
    formed the basis for full word processors, outliners, web browsers and more. We''ll
    get into some of the advanced stuff in a later chapter, but here we''ll just show
    you what you need to use the text widget to capture fairly simple, multi-line
    text input.


    Text widgets are created using the **Text** function:


    ```

    t = Text(parent, width=40, height=10)

    ```


    The "width" and "height" options specify the requested screen size of the text
    widget, in characters and rows respectively. The contents of the text can be arbitrarily
    large. You can use the "wrap" configuration option to control how line wrapping
    is handled: values are "none" (no wrapping, text may horizontally scroll), "char"
    (wrap at any character), and "word" (wrapping will only occur at word boundaries).


    A text widget can be disabled so that no editing can occur; because text is not
    a themed widget, the usual"state" and "invalidate" methods are not available.
    Instead, use the configuration option "state", setting it to either "disabled"
    or "normal".'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Scrolling works the same way as in listboxes. The “xscrollcommand” and “yscrollcommand”
    configuration options are available to attach the text widget to horizontal and/or
    vertical scrollbars, and the “xview” and “yview” methods are available to be called
    from scrollbars. To ensure that a given line is visible (i.e. not scrolled out
    of view), you can use the “see index” method, where index is in the form “line
    number.character number”, e.g. “5.0” for the first (0-based) character of line
    5 (1-based).


    # Contents


    Text widgets do not have a linked variable associated with them, like for example
    entry widgets do. To retrieve the text content for the entire widget, call the
    method “get 1.0 end”; the “1.0” is an index into the text, and means the first
    character of the first line, and “end” is a shortcut for the index of the last
    character, last line. Other indices could be passed to retrieve smaller ranges
    of text if needed.


    Text can be added to the widget using the “insert index string” method; again
    index is in the form“line.char” and marks the character before which text is inserted;
    use “end” to add text to the end of the widget. You can delete a range of text
    using the “delete start end” method, where both start and end are text indices
    as already described.


    We''ll get into the text widget''s many additional advanced features in a later
    chapter.


    # Progressbar


    +   * Widget Roundup

    +   * Reference Manual


    A **progressbar** widget provides a way to give feedback to the user about the
    progress of a lengthy operation. This may be done either as a percentage complete
    display for operations where this can be estimated, or a display that changes
    to indicate the operation is continuing, but without an estimate of completion.


    ![](img/94378c1b05607c1dc5649c738af95c74_42_0.png)


    Progressbar widgets are created using the **tk.ttk.Progressbar** class:


    ```python

    p = ttk.Progressbar(parent, orient=HORIZONTAL, length=200, mode=''determinate'')

    ```


    The “orient” option may be either “horizontal” or “vertical”. The “length” option,
    which represents the longer axis of either horizontal or vertical progressbars,
    is specified in screen units (e.g. pixels). The “mode”configuration option can
    be set to either “determinate”, where the progressbar will indicate relative progress
    towards completion, or to “indeterminate”, where its not possible to know how
    far along in the task the program is, but we still want to provide feedback that
    things are still running.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# ## Determinate Progress


    In determinate mode, you''re able to provide more-or-less accurate feedback to
    the user about how far an operation has progressed. To do this, you need to first
    of all tell the progressbar how many “steps” the operation will take, and then
    as you go along, tell the progressbar how far along the operation is.


    You can provide the total number of steps to the progressbar using the “maximum”
    configuration option; this is a floating point number that defaults to 100 (i.e.
    each step is 1%). To tell the progressbar how far along you are in the operation,
    you will repeatedly change the “value” configuration option. So this would start
    at 0, and then count upwards to the maximum value you have set. There are two
    slight variations on this. First, you can just store the current value for the
    progressbar in a variable linked to it by the progressbar’s “variable” configuration
    option; that way, when you change the variable, the progressbar will update. The
    other alternative is to call the progressbar’s “step?amount?” method to increment
    the value by the given “amount”(defaults to 1.0).


    # ## Indeterminate Progress


    Indeterminate mode is for when you''re not able to easily know (or estimate) how
    far along in a long running task you actually are, but still want to provide feedback
    to the user that the operation is still running (or that your program hasn''t
    crashed). Rather than providing specific values to indicate progress along the
    way, at the start of the operation you''ll just call the progressbar’s “start”
    method, and at the end of the operation, you''ll call its “stop” method. The progressbar
    will take care of the rest.


    # ## Scale


    ![](img/94378c1b05607c1dc5649c738af95c74_43_0.png)


    A **scale** widget provides a way for users to choose a numeric value through
    direct manipulation.


    ![](img/94378c1b05607c1dc5649c738af95c74_43_1.png)


    Progressbar widgets are created using the **tk.Scale** function:


    ```

    s = tk.Scale(parent, orient=HORIZONTAL, length=200, from_=1.0, to=100.0)

    ```


    > *Because ''from'' is a reserved keyword, you''ll need to add a trailing underscore
    when using it as a configuration option.*


    In some ways, scale widgets are like progressbars, except they are designed for
    the user to manipulate them. As with progressbars, they should be given an orientation
    (horizontal or vertical) with the "orient"configuration option, and an'
  merge: -1
