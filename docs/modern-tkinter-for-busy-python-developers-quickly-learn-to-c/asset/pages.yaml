- pgno: 77
  md: '# # Item Appearance and Events


    Like the text and canvas widgets, the treeview widget uses tags to help you modify
    the appearance of items in the tree. You can assign a list of tags to each item
    using the "tags" item configuration option (again, when creating the item or later
    on).


    Tag configuration options can then be specified, which will then apply to all
    items having that tag. Valid tag options include "foreground" (text color), "background",
    "font", and "image" (not used if the item specifies its own image).


    You can also create event bindings on tags, which let you capture mouse clicks,
    keyboard events etc.


    ```

    ```text

    tree.insert('''', ''end'', text=''button'', tags=(''ttk'', ''simple''))

    tree.tag_configure(''ttk'', background=''yellow'')

    tree.tag_bind(''ttk'', ''<1>'', itemClicked); # the item clicked can be found
    via tree.focus()

    ```

    ```


    The treeview will generate virtual events "<TreeviewSelect>", "<TreeviewOpen>"
    and "<TreeviewClose>"which allow you to monitor changes to the widget made by
    the user. You can use the "selection" method to determine the current selection
    (the selection can also be changed from your program).


    # # Customizing the Display


    There are many aspects of how the treeview widget is displayed that you can customize.
    Some of them we’ve already seen, such as the text of items, fonts and colors,
    names of column headings, and more. Here are a few additional ones.


    +   *   •Specify the desired number of rows to show using the "height" widget
    configuration option.


    +       •Control the width of each column using the column’s “width” or “minwidth”
    options. The column holding the tree can be accessed with the symbolic name “#0”.
    The overall requested width for the widget is based on the sum of the column widths.


    +       •Choose which columns to display and the order to display them in using
    the “displaycolumns” widget configuration option.


    +       •You can optionally hide one or both of the column headings or the tree
    itself (leaving just the columns) using the “show” widget configuration option
    (default is “tree headings” to show both).


    +       •You can specify whether a single item or multiple items can be selected
    by the user via the “selectmode”widget configuration option, passing “browse”
    (single item), “extended” (multiple items, the default), or “one”.


    # # Styles and Themes


    The “themed” aspect of the new Ttk widgets is one of the most powerful and exciting
    aspects of the new widget set. Yet because it does things quite differently from
    how Tk has traditionally worked, and because in trying to be flexible it does
    a lot of things, it’s certainly the most confusing for many people.


    # # Definitions


    We’ll first define a few concepts and terms that Ttk themes and styles rely on.


    # ## Widget Class


    A widget class is used by Tk to identify the type of a particular widget; essentially,
    whether it is a button, a label, a canvas, etc. In classic Tk, all buttons had
    the same class (“Button”), all labels had the same class (“Label”), etc.


    You could use this widget class both for introspection, and for changing options
    globally via the option database. This could let you say for example that all
    buttons by default had a red background.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'There were a few classic Tk widgets, including frame and toplevel widgets,
    which would allow you to changethe widget class of a particular widget when the
    widget was first created, by passing it a "class" configuration option. So while
    normally frames would have a widget class of "Frame", you could specify that one
    particular frame widget had a widget class of "SpecialFrame".


    Because of that, you could use the option database to define different looks for
    different types of frame widgets (not just all frame widgets, or frame widgets
    located at a particular place in the hierarchy).


    What Tk does is take that simple idea and give it rocket boosters.


    # Widget State


    A widget state allows a single widget to have more than one appearance or behavior,
    depending on things like mouse position, different state options set by the application,
    and so on. In classic Tk, several widgets had"state" configuration options which
    allowed you to set them to "normal" or "disabled"; a "disabled" state for a button
    for example would draw its label greyed out. Some used an additional state, "active",
    again which represented a different behavior.


    The widget itself, or more typically, the widget''s class bindings, controlled
    how the appearance of the widget changed in different states, typically via consulting
    widget configuration options like "foreground", "activeforeground", and "disabledforeground".


    Tk again extends and generalizes this basic idea of widget state, in two important
    ways. First, rather than being widget-specific, all Tk widgets have state options,
    and in fact, all have exactly the same state options, accessed by the "state"
    and "instat" widget commands.


    A Tk widget state is actually a set of independent state flags, containing zero
    or more of the following flags: "active", "disabled", "focus", "pressed", "selected",
    "background", "readonly", "alternate", or"invalid" (see the widget page in the
    reference manual for exact meanings).


    Note that while all of these state flags are available for every widget, they
    may not be used by each widget. For example, a label widget is likely to ignore
    an "invalid" state flag, and so no special appearance would be associated with
    that flag.


    The second major change that Tk makes is that it takes the decision of what to
    change when the state is adjusted out of the widget''s control. That is, a widget
    author will no longer hardcode logic to the effect of "when the state is disabled,
    consult the disabledforeground configuration option and use that for the foreground
    color". With that logic hardcodced, not only did it make coding widgets longer
    (and more repetitive), but also restricted how a widget could be changed based
    on its state. That is, if the widget author hadn''t coded in logic to change the
    font when the state changed, you as the user of the widget were out of luck.


    Instead of hardcoding these decisions within each widget, Tk moves the decisions
    into a separate location: styles. This means that the widget author doesn''t need
    to provide code for every possible appearance option, which not only simplifies
    the widget, but paradoxicallyl ensures that a wider range of appearances can be
    set, including those the widget author may not have anticipated.


    # Style


    That brings us then to define a widget style. Very simply, a style describes the
    appearance (or appearances) of a Tk widget class. All widgets created with that
    widget class will have the same appearance(s). While each themed widget has a
    default class (e.g. "Button" for "ttk.Button" widgets), you can, unlike in classic
    Tk, assign a different widget class for any themed widget you create. This is
    done using Tk''s "style"configuration option, which all themed widgets support.


    So a style defines the normal appearance of widgets of a certain widget class,
    but can also define variations of that appearance that depend on the current state
    flag. So for example a style can specify that when the "pressed" state flag is
    set, the appearance should change in a particular way. Because of this, a style
    can describe one or more ways for the widget to appear, depending on the state.


    The rest of this chapter will delve into far more detail of what a style actually
    is, but at least now you know the responsibility it has.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# # Themes


    You can think of a theme as a collection of styles. While each style is widget-specific
    (one for buttons, one for entries, etc.), a theme will collect many styles together.
    Typically, a theme will then define one style for each type of widget, but each
    of those styles will be designed so that they visually “fit” together with each
    other — though perhaps unfortunately Tk doesn’t technically restrict bad design
    or judgement!


    To use a particular theme for an application is really to say that you’d like
    to have a set of styles defined so that by default all the different type of widgets
    will have some common appearance, and fit in well with each other.


    # # Using Styles and Themes


    So now we know what styles and themes are supposed to do, but how exactly do we
    use them? To do this, we need to know how to refer to styles and themes, and how
    to apply them to a widget or user interface.


    # ## Style Names


    Every style has a name. If you’re going to modify a style, create a new one, or
    use a style for a widget, you need to know its name.


    How do you know what the names of the styles are? If you have a particular widget,
    and you want to know what style it is currently using, you can first check the
    value of its “style” configuration option. If that is empty, it means the widget
    is using the default style for the widget. You can retrieve that via the widget’s
    class. For example:


    ```

    ```

    >>> b = ttk.Button()

    >>> b[''style'']

    ''''

    >>> b.winfo_class()

    ''TButton''

    ```

    ```


    So in this case, the style that is being used is “TButton”. The default styles
    for other themed widgets are named similarly, e.g. “TEntry”, “TLabel”, “TSizeGrip”,
    etc. It’s always wise to check specifics though; for example, the treewiew widget’s
    class is “Ttreeview”, not “TTtreeview”.


    Beyond the default styles though, styles can be named pretty much anything. You
    might create your own style (or use a theme that has a style) named “FunButton”,
    “NuclearReactorButton”, or even “GuessWhatIAm” (not a smart choice). More often,
    you’ll find names like “Fun.TButton” or “NuclearReactor.TButton”, which suggest
    variations of a base style; as you’ll see, this is something Tk supports for creating
    and modifying styles.


    > The ability to retrieve a list of all currently available styles is currently
    not supported.


    # ## Using a Style


    To use a style means to apply that style to an individual widget. If you know
    the name of the style you want to use, and which widget to apply it to, it’s easy.
    Setting the style can be done at creation time:


    ```

    `b = ttk.Button(parent, text=''Hello'', style=''Fun.TButton'')`

    ```


    As well, you can change the style of a widget at anytime after you’ve created
    it with the “style” configuration option:


    ```

    `b[''style''] = ''NuclearReactor.TButton''`

    ```


    # ## Using Themes


    While styles control the appearance of individual widgets, themes control the
    appearance of the entire user interface. The ability to switch between themes
    is one of the significant features of the themed widgets.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Like styles, themes are identified by a name. You can obtain the names of all
    available themes:


    ```

    ```python

    >>> s = ttk.Style()

    >>> s.theme_names()

    (''aqua'', ''step'', ''clam'', ''alt'', ''default'', ''classic'')

    ```

    ```


    Only one theme can ever be active at a time. To obtain the name of the theme currently
    in use, you can use the following:


    > This API, which was originally targeted for Tk 8.6, was back-ported to Tk 8.5.9.
    If you''re using an earlier version of Tk getting this info is a bit trickier.


    ```

    ```python

    >>> s.theme_use()

    ''aqua''

    ```

    ```


    Switching to a new theme can be done with:


    ```

    ```python

    s.theme_use(''themename'')

    ```

    ```


    What does this actually do? Obviously, it sets the current theme to the indicated
    theme. Doing this therefore replaces all the currently available styles with the
    set of styles defined by the theme. Finally, it refreshes all widgets, so that
    they take on the appearance described by the new theme.


    # What''s Inside a Style?


    If all you want to do is use a style, you now know everything you need. If however,
    you want to create your own styles, or modify an existing one, now it gets ''interesting''.


    # Elements


    While each style represents a single widget, each widget is normally composed
    of smaller pieces, called elements. It''s the job of the style author to construct
    the entire widget out of these smaller elements. What these elements are depends
    on the widget.


    Here''s an example of a button. It might have a border on the very outside, which
    is one element. Just inside that there may be a focus ring, which is normally
    just the background color but may be highlighted when the user tabs into the button.
    So that''s a second element. Then there might be some spacing between that focus
    ring and the button''s label. So that spacing would be a third element. Finally,
    there is the label of the button itself, a fourth element.


    ![](img/94378c1b05607c1dc5649c738af95c74_80_0.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: "Why might the style author have divided it up that way? If you have one part\
    \ of the widget that may be in a different location from another, or might be\
    \ a different color than another, it may be a good candidate for an element. Note\
    \ that this is just one example of how a button could be constructed from elements.\
    \ Different styles and themes could (and do) accomplish this in different ways.\n\
    \nHere is a second example of a vertical scrollbar, containing a “trough” element\
    \ containing the rest, which includes the up and down arrow elements at either\
    \ end, and a “thumb” element in the middle.\n\n![](img/94378c1b05607c1dc5649c738af95c74_81_0.png)\n\
    \n# ## Layout\n\nBesides the choice of which elements are part of a widget, a\
    \ style also defines how those elements are arranged within the widget, or in\
    \ other words, their layout. In the button example, we had a label element inside\
    \ a spacing element, inside a focus ring element, inside a border element. So\
    \ the logical layout is like this:\n\n```\n```text\nborder {\n    focus {\n  \
    \      spacing {\n            label\n        }\n    }\n}\n```\n```\n\nWe can ask\
    \ Tik what the layout of the TButton style is like this:\n\n```\n```text\n>>>\
    \ s.layout(\"TButton\")\n[{'Button.border', ['children': [['Button.focus', ['children':\
    \ [['Button.spacing',\n['children': [['Button.label', {'sticky': 'nsw'}], 'sticky':\
    \ 'nsw']],\n'sticky': 'nsw']]], 'sticky': 'nsw', 'border': '1']]}\n```\n```\n\n\
    If we clean this up and format it a bit, we get something with this structure:\n\
    \n```\n```text\nButton.border -sticky nsw -border 1 -children {\n    Button.focus\
    \ -sticky nsw -children {\n        Button.spacing -sticky nsw -children {\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 82
  md: '```

    Button.label -sticky nsw


    ```

    }

    }

    ```

    ```


    This starts to make sense; we have four elements, named "Button.border", "Button.focus",
    "Button.spacing", and "Button.label". Each of these has different element options,
    such as "-children", "-sticky", and "-border" that here specify layout or sizes.
    Without getting into too much detail at this point, we can clearly see the nested
    layout, based on the "-children" and "-sticky" attributes; Tk uses a simplified
    version of Tk''s "pack" geometry manager to specify element layout.


    # Element Options


    Each of these different elements may have a number of different options. For example,
    the thumb of the scrollbar may have an option to set its background color, or
    another to provide the width of a border, if any. These can be customized to adjust
    how the elements within the widget look.


    What options are available for each element? Here’s an example of checking what
    options are available for the label inside the button (which we know from the
    "layout" command is identified as "Button.label"):


    ```

    ```python

    >>> s.element_options(''Button.label'')

    (''-compound'', ''-space'', ''-text'', ''-font'', ''-foreground'', ''-underline'',
    ''-width'', ''-anchor'', ''-justify'', ''-wraplength'', ''-embossed'', ''-image'',
    ''-stipple'', ''-background'')

    ```

    ```


    Presumably these options shouldn''t have the leading dash on them.


    In the next sections, we''ll take a look at the not-entirely-straightforward way
    that you can work with element options.


    # Changing Style Options


    In this section, we''ll look at how you can change the style’s appearance via
    modifying style options. You can do this either by modifying an existing style,
    or more typically, by creating a new style.


    # Modifying a Style Option


    Modifying a configuration option for an existing style is done in a similar fashion
    as modifying any other configuration option, by specifying the style, name of
    the option, and new value:


    ```

    ```python

    s.configure(''TButton'', font=helvetica 24)

    ```

    ```


    You''ll learn more about what the valid options are shortly.


    If you need to retrieve the current value of an option, this can be done with
    the "lookup" method.


    ```

    ```python

    >>> s.lookup(''TButton'', ''font'')

    ''helvetica 24''

    ```

    ```


    # Creating a New, Derived Style


    If you modify an existing style, such as "TButton", that modification will apply
    to all widgets using that style (so by default, all buttons). That may well be
    what you want to do.


    More often, you''re interested in creating a new style that is similar to an existing
    one, but varies in a certain aspect. For example, you''d like to have most of
    the buttons in your application keep their normal appearance, but create certain
    special "emergency" buttons, which will be highlighted in a different way. In
    this case, creating a new style (e.g. "Emergence.TButton") derived from the base
    style ("TButton") would be the appropriate thing to do.'
  merge: -1
  img_proc: true
- pgno: 83
  md: "By prepending another name (\"Emergency\") followed by a dot onto an existing\
    \ style, you are implicitly creating a new style derived from the existing one.\
    \ So in this example, our new style will have exactly the same options as a regular\
    \ button except for the indicated differences:\n\n```\n```\ns.configure('Emergency.TButton',\
    \ font=helvetica 24, foreground='red', padding=10)```\n```\n\n# ## State Specific\
    \ Style Options\n\nBesides the normal configuration options for the style, the\
    \ widget author may have specified different options to use when the widget is\
    \ in a particular widget state. For example, when a button is disabled, you'd\
    \ like to have the color of the button's label greyed out.\n\nTo do this, you\
    \ can specify a \"map\", which allows you to specify variations for one or more\
    \ of a style's configuration options. For each configuration option, you can specify\
    \ a list of widget states, along with the particular value the option should be\
    \ assigned when the widget is in that state.\n\n> Remember that the state is composed\
    \ of one or more state flags (or their negation), as set by the widget's \"state\"\
    \ method, or queried via the \"instase\" method.\n\nThe following example provides\
    \ for the following variations from a button's \"normal\" appearance:\n\n+   -\
    \ when the widget is in the disabled state, the background color should be set\
    \ to \"#d9d9d9\"  \n+   - when the widget is in the active state (mouse over it),\
    \ the background color should be set to \"#feecec\"  \n+   - when the widget is\
    \ in the disabled state, the foreground color should be set to \"#3a3a3a\" (this\
    \ is in addition to the background color change we already noted)  \n+   - when\
    \ the widget is in the state where the button is pressed and the widget is not\
    \ disabled, the relief should be set to \"sunken\"  \n+   PYTHONTODO\n\nRemember\
    \ that in the past, with classic Tk widgets, exactly what changed when the widget\
    \ was in each state would have been determined solely by the widget author. With\
    \ themed widgets, it is the style itself that determines what changes, which could\
    \ include things that the original widget author had never anticipated.\n\n> Because\
    \ widget states can contain multiple flags, it's possible that more than one state\
    \ will match for an option (e.g. \"pressed\" and \"pressed !disabled\" will both\
    \ match if the widget's \"pressed\" state flag is set). The list of states is\
    \ evaluated in the order you provide in the map command, with the first state\
    \ in the list that matches being used.\n\n# ## Sound Difficult to you?\n\nSo you\
    \ now know that styles are made up of elements, which have a variety of options,\
    \ and are composed together in a particular layout. You can change various options\
    \ on styles, to make all widgets using the style appear differently. Any widgets\
    \ using that style take on the appearance that the style defines. Themes collect\
    \ an entire set of related styles, making it easy to change the appearance of\
    \ your entire user interface.\n\nSo what makes styles and themes so difficult\
    \ in practice? Three things. First:\n\nYou can only modify options for a style,\
    \ not element options (except sometimes).\n\nWe talked earlier about how to discover\
    \ what elements were used in the style by examining the style's layout, and also\
    \ how to discover what options were available for each element. But when we went\
    \ to make changes to a style, we seemed to be configuring an option for the style,\
    \ without specifying an individual element. What's going on?\n\n84"
  merge: -1
