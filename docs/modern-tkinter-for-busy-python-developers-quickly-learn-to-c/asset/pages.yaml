- pgno: 46
  md: "targeting, become familiar with how applications use menus, and consult the\
    \ platform's human interface guidelines for full details about design, terminology,\
    \ shortcuts, and much more. This is an area you will likely have to customize\
    \ for each platform.\n\n# ## Menu Widgets and Hierarchy\n\n+   • Widget Roundup\
    \  \n+   • Reference Manual\n\nMenus are implemented as widgets in Tk, just like\
    \ buttons and entries. Each menu widget consists of a number of different items\
    \ in the menu. Items are things like the “Open...” command in a File menu, but\
    \ also separators between other items, and items which open up their own submenu\
    \ (so-called cascading menus). Each of these menu items also has attributes, such\
    \ as the text to display for the item, a keyboard accelerator, and a command to\
    \ invoke.\n\nMenus are arranged in a hierarchy. The menubar is itself a menu widget.\
    \ It has several children (submenus) consisting of items like “File”, “Edit” and\
    \ so on. Each of those in turn is a menu containing different items, some of which\
    \ might themselves contain submenus. As you'd expect from other things you've\
    \ seen already in Tk, anytime you have a submenu, it must be created as a child\
    \ of its parent menu.\n\n# ## Before you Start\n\nIt's important to put the following\
    \ line in your application somewhere before you start creating menus.\n\n```\n\
    root.option_add(\"*tearOff\", FALSE)\n```\n\nWithout it, each of your menus (on\
    \ Windows and X11) will start with what looks like a dashed line, and allows you\
    \ to “tear off\" the menu so it appears in its own window. You really don't want\
    \ that there.\n\n> This is a throw-back to the Motif-style X11 that Tk's original\
    \ look and feel were based on. Unless your application is designed to run on that\
    \ old box collecting dust in the basement, you really don't want to see this,\
    \ as its not a part of any modern user interface style.\n\n> And we'll all be\
    \ looking forward to a version of Tk where this backwards compatibility is not\
    \ preserved, and the default is not to have these tear-off menus.\n\n# ## Creating\
    \ a Menubar\n\nIn Tk, menubars are associated with individual windows; each toplevel\
    \ window can have at most one menubar. On Windows and X11, this is visually obvious,\
    \ as the menus are part of each window, sitting just below the title bar at the\
    \ top.\n\nOn Mac OS X though, there is a single menubar along the top of the screen,\
    \ shared by each window. As far as your Tk program is concerned, each window still\
    \ does have its own menubar; as you switch between windows, Tk will automatically\
    \ take care of making sure that the correct menubar is displayed at the top of\
    \ the screen. If you don't specify a menubar for a particular window, Tk will\
    \ use the menubar associated with the root window; you'll have noticed by now\
    \ that this is automatically created for you when your Tk application starts.\n\
    \n> Because on Mac OS X all windows have a menubar, it's important to make sure\
    \ you do define one, either for each window or a fallback menubar for the root\
    \ window. Otherwise, you'll end up with the “built-in” menubar, which contains\
    \ menus that are only intended for use when typing commands directly into the\
    \ interpreter.\n\nTo actually create a menubar for a window, we first create a\
    \ menu widget, and then use the window's “menu” configuration option to attach\
    \ the menu widget to the window. As noted, the menu widget must be a child of\
    \ the toplevel window.\n\n```\nwin = Toplevel(root)  \nmenubar = Menu(win)  \n\
    win['menu'] = menubar\n```"
  merge: -1
  img_proc: true
- pgno: 47
  md: "> This is truly ancient history, but menubars used to be done by creating a\
    \ frame widget containing the menu items, and packing it into the top of the window\
    \ like you would any other widget. Hopefully you don't have any code or documentation\
    \ that still does this.\n\n# ## Adding Menus\n\nWe now have a menubar, but that's\
    \ pretty useless without some menus to go in it. So again, we'll want to create\
    \ a menu widget for each menu that will go in the menubar (each one a child of\
    \ the menubar), and then add them all to the menubar.\n\n# ## Adding Menu Items\n\
    \nNow that we have a couple of menus in our menubar, it's probably a good time\
    \ to add a few items to each menu. Remember that menu items are part of the menu\
    \ itself, so we thankfully don't have to go and create another menu widget for\
    \ each one.\n\n```\n```text\n    menu_file.add_command(label='New', command=newFile)\n\
    \    menu_file.add_command(label='Open...', command=openFile)\n    menu_file.add_command(label='Close',\
    \ command=closeFile)\n```\n```\n\n> On Mac OS X, the ellipsis (“…”) is actually\
    \ a special character, which is more tightly spaced than three periods in a row.\
    \ Tk takes care of substituting this character for you automatically.\n\nSo adding\
    \ menu items to a menu is essentially the same as adding a submenu, but rather\
    \ than adding a menu item of type \"cascade\", we're adding one of type \"command\"\
    .\n\nEach menu item has associated with it a number of configuration options,\
    \ in the same way widgets do, though each menu item type has a different set of\
    \ relevant options. Cascade menu items have a \"menu\" option used to specify\
    \ the submenu, command menu items have a \"command\" option used to specify the\
    \ command to invoke when the item is selected, and both have a \"label\" option\
    \ to specify the text to display for the item.\n\nAs well as adding items to the\
    \ end of menus, you can also insert them in the middle of menus via the “insertindex\
    \ type ? option value...?” method; here “index” is the position (0...n-1) of the\
    \ item you want to insert before. You can also delete a menu using the “delete\
    \ index” method.\n\n# ## Types of Menu Items\n\nWe've already seen “command” menu\
    \ items, which are the common menu items that when selected will invoke a command.\n\
    \nWe've also seen the use of “cascade” menu items, used to add a menu to a menubar.\
    \ Not surprisingly, if you want to add a submenu to an existing menu, you also\
    \ use a “cascade” menu item, in exactly the same way.\n\nA third type of menu\
    \ item is the “separator”, which produces the dividing line you often see between\
    \ different sets of menu items.\n\n```\n```text\n    menu_file.add_separator()\n\
    ```\n```\n\nFinally, there are also “checkbutton” and “radiobutton” menu items,\
    \ which behave analogously to checkbutton and radiobutton widgets. These menu\
    \ items have a variable associated with them, and depending on the value of that\
    \ variable, will display an indicator (i.e. a checkmark or a selected radiobutton)\
    \ next to the item’s label.\n\n```\n```text\n    check = StringVar()\n    menu_file.add_checkbutton(label='Check',\
    \ variable=check, onvalue=1, offvalue=0)\n    radio = StringVar()\n    menu_file.add_radiobutton(label='One',\
    \ variable=radio, value=1)\n    menu_file.add_radiobutton(label='Two', variable=radio,\
    \ value=2)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 48
  md: 'When the user selects a checkbutton item that is not already checked, it will
    set the associated variable to the value in "onvalue"; while selecting a item
    that is already checked sets it to the value in "offvalue". Selecting a radiobutton
    item sets the associated variable to the value in "value". Both types of items
    also react to changes in the associated variable from within other parts of your
    program.


    As with command items, checkbutton and radiobutton menu items do accept a "command"
    configuration option, that will be invoked when the menu item is selected; the
    associated variable, and hence the menu item''s state, is updated before the callback
    is invoked.


    > Radiobutton menu items are not part of the Windows or Mac OS X human interface
    guidelines, so on those platforms the indicator next to the item''s label is a
    checkmark, as it would be for a checkbutton item. The semantics still work though;
    it''s a good way to select between multiple items, since the display will show
    one of the items selected (checked).


    # ## Accelerator Keys


    The "accelerator" option is used to indicate the menu accelerator that should
    be associated with this menu. This does not actually create the accelerator, but
    only displays what it is next to the menu item. You still need to create a binding
    for the accelerator yourself.


    > Remember that event bindings can be set on individual widgets, all widgets of
    a certain type, the toplevel window containing the widget you''re interested in,
    or the application as a whole. As menu bars are associated with individual windows,
    normally the event bindings you create will be on the toplevel window the menu
    is associated with.


    Accelerators are very platform specific, not only in terms of which keys are used
    for what operation, but what modifier keys are used for menu accelerators (e.g.
    on Mac OS X it is the "Command" key, on Windows and X11 it is usually the "Control"
    key). Example of valid accelerator options are "Command-N", "Shift+Ctrl+X", and"Command-Option-B".
    Commonly used modifiers include "Control", "Ctr", "Option", "Opt", "Alt", "Shift",
    "Command", "Cmd" and "Meta").


    > On Mac OS X, those modifiers will be automatically mapped to the different modifier
    icons that appear in menus.


    # ## More on Item Options


    There are a few more common options for menu items.


    # ### Underline


    While all platforms support keyboard traversal of the menubar via the arrow keys,
    on Windows and X11, you can also use other keys to jump to particular menus or
    menu items. The keys that trigger these jumps are indicated by an underlined letter
    in the menu item''s label. If you want to add one of these to a menu item, you
    can use the "underline" configuration option for the item. The value of this option
    should be the index of the character you''d like underlined (from 0 to the length
    of the string - 1).


    # ### Images


    It is also possible to use images in menu items, either beside the menu item''s
    label, or replacing it altogether. To do this, you can use the "image" and "compound"
    options, which work just like in label widgets. The value for "image" must be
    a Tk image object, while "compound" can have the values "bottom", "center", "left",
    "right", "top" or "none".


    # ### State


    It is also possible to disable a menu, so that the user cannot select it. This
    can be done via the "state" option, setting it to a value of "disabled", or a
    value of "normal" to reenable the item.


    49'
  merge: -1
