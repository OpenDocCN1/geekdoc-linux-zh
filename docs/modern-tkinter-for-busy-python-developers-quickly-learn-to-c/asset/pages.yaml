- pgno: 40
  md: "scrolled widget. When the scrollbar is manipulated, it will tack on some number\
    \ of parameters to the method call, indicating how it was scrolled, to what position,\
    \ etc.\n\nThe scrolled widget also needs to communicate back to the scrollbar,\
    \ telling it what percentage of the entire content area is now visible. Besides\
    \ the yview and/or xview methods, every scrollable widget also has a\"yscrollcommand\"\
    \ and/or \"xscrollcommand\" configuration option. This is used to specify a method\
    \ call, which must be the scrollbar's \"set\" method. Again, additional parameters\
    \ will be automatically tacked onto the method call.\n\nIf for some reason you\
    \ want to move the scrollbar to a particular position from within your program,\
    \ you can call the \"set first last\" method yourself. Pass it two values between\
    \ 0 and 1 indicating the start and end percentage of the content area that is\
    \ visible.\n\n# Example\n\nListboxes are one of several types of widgets that\
    \ are scrollable. Here we'll build a very simple user interface, consisting just\
    \ of a vertically scrollable listbox that takes up the entire window, with just\
    \ a status line at the bottom.\n\n![](img/94378c1b05607c1dc5649c738af95c74_40_0.png)\n\
    \n```\n```python\nfrom tkinter import *\nfrom tkinter import ttk\n\nroot = Tk()\n\
    \nl = Listbox(root, height=5)\nl.grid(column=0, row=0, sticky=(N,W,E,S))\ns =\
    \ ttk.Scrollbar(root, orient=VERTICAL, command=l.yview)\ns.grid(column=1, row=0,\
    \ sticky=(N,S))\n\nl[\"yscrollcommand\"] = s.set\n\nttk.Sizegrip().grid(column=1,\
    \ row=1, sticky=(S,E))\n\nroot.grid_columnconfigure(0, weight=1)\nroot.grid_rowconfigure(0,\
    \ weight=1)\n\nfor i in range(1,101):\n    l.insert('end', 'Line %d of 100' %\
    \ i)\n\nroot.mainloop()\n```\n```\n\n# SizeGrip\n\n+   - Widget Roundup\n+   -\
    \ Reference Manual\n\nWe actually snuck in one new widget in that last example,\
    \ the **sizegrip**. This is the little box at the bottom right corner of the window\
    \ that allows you to resize it."
