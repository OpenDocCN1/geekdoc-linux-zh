    \ via parent and index into the list of children, as was done with “insert”.\n\
    \n```\ntree.move('widgets', 'gallery', 'end'); # move widgets under gallery\n\
    ```\n\nItems can be detached from the tree, which removes the item and its descendants\
    \ from the hierarchy, but does not destroy the items, allowing you to later reinser\
