    \ and depends of course whether you'll need to refer to it later. Because the\
    \ object is inserted into the widget hierarchy, it won't be garbage collected\
    \ even if you don't keep your own reference to it.\n\n*If you snuck a peek at\
    \ how Tcl manages widgets, you'll see each widget has a specific pathname; you'll\
    \ also see this pathname referred to in Tk reference documentation. Tkinter chooses\
    \ and manages all these pathnames for you behind the scenes, so you should never\
    \ have to worry about them. If you do though, you can get the pathname from a\
    \ widget by calling `str(widget)`.*\n\n# ## Configuration Options\n\nAll widgets\
    \ also have a number of different configuration options, which generally control\
    \ how they are displayed or how they behave.\n\nThe options that are available\
    \ depend upon the widget class of course. There is a lot of consistency between\
    \ different widget classes, so options that do pretty much the same thing tend\
    \ to be named the same. So both a button and a label have a \"text\" option to\
    \ adjust the text the widget displays, while a scrollbar for example would not\
    \ have a \"text\" option since it's not needed. In the same way, the button has\
    \ a \"command\" option telling it what to do when pushed, while a label, which\
    \ holds just static text, does not.\n\nConfiguration options can be set when the\
    \ widget is first created, by passing along the names and values of the options\
    \ as optional parameters. You can later check what the value of those options\
    \ are, and with a very small number of exceptions, change them at any time. If\
    \ you're not sure what all the different options are for a widget, you can ask\
    \ the widget to provide it. This gives you a long list of all the options, and\
    \ for each option, you can see the name of the option and its current value (along\
    \ with three other attributes which you won't normally need to worry about).\n\
    \nThis is all best illustrated with the following interactive dialog with the\
    \ interpreter.\n\n```\n```python\n   % python\n   >>> from tkinter import *\n\
    \   >>> from tkinter import tk\n   >>> root = Tk()\n   create a button, passing\
