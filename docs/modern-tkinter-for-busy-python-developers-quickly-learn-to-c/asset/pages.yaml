    # ## Internal Padding


    You saw how the “padx” and “pady” grid options added extra space around the outside
    of a widget. There’s also a less used type of padding called “internal padding”,
    which is controlled by the grid options “ipadx” and “ipady”.


    The difference can be subtle. Let’s say you have a frame that’s 20x20, and specify
    normal (external) padding of 5 pixels on each side. The frame will request a 20x20
    rectangle (its natural size) from the geometry manager. Normally, that’s what
    it will be granted, so it’ll get a 20x20 rectangle for the frame, surrounded by
    a 5 pixel border.


    With internal padding, the geometry manager will effectively add the extra padding
    to the widget when figuring out its natural size, as if the widget has requested
    a 30x30 rectangle. If the frame is centered, or attached to a single side or corner
    (using “sticky”), you’ll end up with a 20x20 frame with extra space around it.
    If however the frame is set to stretch (i.e. a “sticky” value of “we”, “ns”, or
    “nwes”) it will fill the extra space, resulting in a 30x30 frame, with no border.


    # ## Forget and Remove


    The “forget” method of grid, taking as arguments a list of one or more slave widgets,
    can be used to remove slaves from the grid they’re currently part of. This does
    not destroy the widget altogether, but takes it off the screen, as if it had not
    been gridded in the first place. You can grid it again later, though any grid
    options you’d originally assigned will have been lost.


    The “remove” method of grid works the same, except that the grid options will
    be remembered.


    # ## Nested Layouts


    As your user interface gets more complicated, the grid that you’re using to organize
    all your widgets can get more and more complicated, and more fine-grained. This
    can make changing and maintaining your program very difficult.


    Luckily, you don’t have to manage your entire user interface with a single grid.
    If you have one area of your user interface that is fairly independent of others,
    create a new frame to hold that area, and grid the widgets that are part of that
    area within that frame. If you had a graphics program of some kind with multiple
    palettes, toolbars, and so on, each one of those areas might be a candidate for
    putting in its own frame.


    In theory, these frames, each with its own grid, can be nested arbitrarily deep,
    though in practice this usually doesn’t go beyond a few levels. This can be a
    big help in modularizing your program. If for example you have a palette of drawing
    tools, you can create the whole thing in a separate procedure, including creating
    all the component widgets, gridding them together, setting up event bindings,
    and so on. From the point of view of your main program, all it needs to see is
    the single frame widget containing it all.


    Our examples have shown just a hint of this, where a content frame was gridded
    into the main window, and then all the other widgets gridded into the content
    frame.


    # # More Widgets


    This chapter carries on introducing several more widgets: listbox, scrollbar,
    text, progressbar, scale and spinbox. Some of these are starting to be a bit more
    powerful than the basic ones we looked at before. Here we’ll also see a few instances
    of using the classic Tk widgets, in instances where there isn’t (or there isn’t
    a need for) a themed counterpart.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Listbox


    +   • Widget Roundup

    +   • Reference Manual


    A **listbox** displays a list of single-line text items, usually lengthy, and
    allows the user to browse through the list, selecting one or more.


    Listboxes are part of the classic Tk widgets; there is not presently a listbox
    in the themed Tk widget set.


    *Tk''s treeview widget (which is themed) can also be used as a listbox (a one
    level deep tree), allowing you to use icons and styles with the list. It''s also
    likely that a multi-column (table) list widget will make it into Tk at some point,
    based on one of the available extensions.*


    ![](img/94378c1b05607c1dc5649c738af95c74_35_0.png)


    Listboxes are created using the **Listbox** function:


    ```

    l = Listbox(parent, height=10)

    ```


    # Populating the Listbox Items


    There''s an easy way and a hard way to populate and manage all the items that
    are contained in the listbox.


    Here is the easy way. Each listbox has a "listvariable" configuration option,
    which allows you to link a variable (which must hold a list) to the listbox. Each
    element of this list is a string representing one item in the listbox. So to add,
    remove, or rearrange items in the listbox, you can simply manipulate this variable
    as you would any other list. Similarly, to find out which item is on the third
    line of the listbox, just look at the third element of the list variable.


    *The reason there is a hard way at all is because the "listvariable" option was
    only introduced in Tk 8.3. Before that, you were stuck with the hard way. Because
    using the list variable lets you use all the standard list operations, it provides
    a much simpler API, and is certainly an upgrade worth considering if you have
    listboxes doing things the older way.*


    The older, harder way to do things is use a set of methods that are part of the
    listbox widget itself that operate on the (internal) list of items:


    +   • The "insert idx item ?item... ?" method is used to add one or more items
    to the list; "idx" is a 0-based index indicating the position of the item before
    which the item(s) should be added; specify "end" to put the new items at the end
    of the list.

    +   • Use the "delete first ?last?" method to delete one or more items from the
    list; "first" and "last"are indices as per the "insert" method.

    +   • Use the "get first ?last?" method to return the contents of a single item
    at the given position, or a list of the items between "first" and "last".'
  merge: -1
  img_proc: true
- pgno: 36
  md: '•The “size” method returns the number of items in the list.


    # ## Selecting Items


    The first thing you need to decide is whether it is possible for the user to select
    only a single item at a time, or if multiple items can simultaneously be selected.
    This is controlled by the “selectmode” option: the default is only being able
    to select a single item (“browse”), while a selectmode of “extended” allows the
    user to select multiple items.


    > *The names “browse” and “extended”, again for backwards compatibility reasons,
    are truly awful. This is made worse by the fact that there are two other modes,
    “single” and“multiple”which you **should not use** (they use an old interaction
    style that is inconsistent with modern user interface and platform conventions).*


    To find out which item or items in the listbox the user has currently selected,
    use the “curselection” method, which will return the list of indices of all items
    currently selected; this may be an empty list, and for lists with aselectmode
    of “browse”, will never be longer than one item. You can also use the “selection
    includesindex” method to check if the item with the given index is currently selected.


    To programmatically change the selection, you can use the “selection clear first
    ?last?” method to deselect either a single item, or any within the range of indices
    specified. To select an item, or all items in a range, use the “selection set
    first ? last?” method. Both of these will not touch the selection of any items
    outside the range specified.


    If you do change the selection, you should also make sure that the newly selected
    item is visible to the user (i.e. it is not scrolled out of view). To do this,
    use the “see index” method.


    When the selection is changed by the user, a “<ListboxSelect>” virtual event is
    generated. You can bind to this to take any action you need. Depending on your
    application, you may also want to bind to a double-click“Double-1” event, and
    use it to invoke an action with the currently selected item.


    # ## Stylizing the List


    Like most of the “classic” Tk widgets, you have immense flexibility in modifying
    the appearance of a listbox. As described in the reference manual, you can modify
    the font the listbox items are displayed in, the foreground (text) and background
    colors for items in their normal state, when selected, when the widget is disabled,
    and so on. There is also an “itemconfigure” method which allows you to change
    the foreground and background colors of individual items.


    As is often the case, restraint is useful. Generally, the default values will
    be entirely suitable, and a good match for platform conventions. In the example
    we’ll get to momentarily, we’ll show how restrained use of these options can be
    put to good effect, in this case displaying alternate lines of the listbox in
    slightly different colors.


    # ## Keeping Extra Item Data


    The “listvariable” (or the internal list, if you’re managing things the old way)
    contains the strings that will be shown in the listbox. It’s very often the case
    though that each string in your program is associated with some other data item,
    and what you’re really interested in is not so much the string displayed in the
    listbox, but the associated data item. For example, a listbox containing names
    may be what is presented to the user, but your program is really interested in
    the user object (or id number) that is selected, not the particular name.


    How can we associate this value with the displayed name? Unfortunately, the listbox
    widget itself doesn’t offer any facilities, so it’s something we’ll have to manage
    separately. There are a couple of obvious approaches. First, if the displayed
    strings are guaranteed unique, you could use a hash table to map the names to
    the associated object. So, given the name you can easily get the associated object.
    This probably wouldn’t work well for doing names, but could work for choosing
    countries for example.


    A second approach is to keep a second list, parallel to the list of strings displayed
    in the listbox, which will hold the associated objects. So the first item in the
    strings list corresponds to the first item in the objects list, the second to
    the second, and so on. Any changes you make in one list (insert, delete, reorder)
    you need to make in the other. You can then easily map from the list item to the
    underlying object, based on their position in the list.'
  merge: -1
  img_proc: true
