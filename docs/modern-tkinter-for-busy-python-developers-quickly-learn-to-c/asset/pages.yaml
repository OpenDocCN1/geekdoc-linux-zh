    # A First (Real) Example


    With that out of the way, let’s try a slightly more useful example, which will
    give you an initial feel for what the code behind a Tk program looks like.


    # Design


    The example we’ll use is a simple GUI tool that will convert a number of feet
    to the equivalent number of meters. If we were to sketch this out, it might look
    something like this:


    ![](img/94378c1b05607c1dc5649c738af95c74_10_1.png)


    So it looks like we have a short text entry widget that will let us type in the
    number of feet, and a ''Calculate'' button that will get the value out of that
    entry, perform the calculation, and then put the resulting number of meters on
    the screen just below where the entry is. We’ve also got three static labels (“feet”,
    “is equivalent to”, and “meters”) which help our user figure out how to use the
    interface.


    In terms of layout, things seem to naturally divide into three columns and three
    rows:'
  merge: -1
  img_proc: true
- pgno: 11
  md: "![](img/94378c1b05607c1dc5649c738af95c74_11_0.png)\n\nThe layout of our user\
    \ interface, which follows a 3 x 3 grid.\n\n# ## Code\n\nNow here is the Python\
    \ code to create this program.\n\n```\n```python\nfrom tkinter import *\nfrom\
    \ tkinter import ttk\n\ndef calculate(*args):\n    try:\n        value = float(feet.get())\n\
    \        meters.set((0.3048 * value * 10000.0 + 0.5)/10000.0)\n    except ValueError:\n\
    \        pass\n\nroot = Tk()\nroot.title(\"Feet to Meters\")\n\nmainframe = ttk.Frame(root,\
    \ padding=\"3 3 12 12\")\nmainframe.grid(column=0, row=0, sticky=(N, W, E, S))\n\
    mainframe.columnconfigure(0, weight=1)\nmainframe.rowconfigure(0, weight=1)\n\n\
    feet = StringVar()\nmeters = StringVar()\n\nfeet_entry = ttk.Entry(mainframe,\
    \ width=7, textvariable=feet)\nfeet_entry.grid(column=2, row=1, sticky=(W, E))\n\
    \nttk.Label(mainframe, textvariable=meters).grid(column=2, row=2, sticky=(W, E))\n\
    ttk.Button(mainframe, text=\"Calculate\", command=calculate).grid(column=3, row=3,\
    \ sticky=W)\n\nttk.Label(mainframe, text=\"feet\").grid(column=3, row=1, sticky=W)\n\
    ttk.Label(mainframe, text=\"is equivalent to\").grid(column=1, row=2, sticky=E)\n\
    ttk.Label(mainframe, text=\"meters\").grid(column=3, row=2, sticky=W)\n\nfor child\
    \ in mainframe.winfo_children(): child.grid_configure(padx=5, pady=5)\n\nfeet_entry.focus()\n\
    root.bind('<Return>', calculate)\n\nroot.mainloop()\n```\n```\n\nAnd the resulting\
    \ user interface:"
