    # Menus


    This chapter describes how to handle menubars and popup menus in Tk. For a polished
    application, these are areas you particularly want to pay attention to. Menus
    need special care if you want your application to fit in with other applications
    on your users'' platform.


    Speaking of which, the recommended way to figure out which platform you''re running
    on is:


    root.tk.call(''tk'', ''winfoingsystem'')  ; # will return x11, win32 or aqua


    > To the best of my knowledge, Tkinter does not provide a direct equivalent to
    this call. However, as you can see from the example, it is possible to execute
    a Tcl-based Tk command directly, using the `.tk.call()` function available on
    any Tkinter widget.


    > This is probably more useful than examining global variables like `tcl_platform`
    or `RUBY_PLATFORM`, and older checks that used these methods should be examined.
    While in the olden days there was a pretty good correlation between platform and
    windowing system, it''s less true today. For example, if your platform is identified
    on Unix, that might mean Linux under X11, Mac OS X under Aqua, or even Mac OS
    X under X11.


    # Menubars


    In this section we''ll look at menubars: how to create them, what goes in them,
