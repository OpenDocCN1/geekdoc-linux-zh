- pgno: 72
  md: 'The "tag ranges" method will return a list of ranges in the text that the tag
    has been applied to. There are also "tag nextxrange" and "tag prevrange" methods
    to search forward or backward for the first such range from a given position.


    The "tag names" method, called with no additional parameters, will return a list
    of all tags currently defined in the text widget (including those that may not
    be presently used). If you pass the method an index, it will return the list of
    tags applied to just the character at the index.


    Finally, you can use the first and last characters in the text having a given
    tag as indices, the same way you can use "end" or "2.5". To do so, just specify
    "tagname.first" or "tagname.last".


    # ## Differences between Tags in Canvas and Text Widgets


    While both canvas and text widgets support "tags" which can be used to apply to
    several objects, style them, and so on, these tags are not the same thing. There
    are important differences to take note of.


    In canvas widgets, individual canvas items have configuration options that control
    their appearance. When you refer to a tag in a canvas, the meaning of that is
    identical to "all canvas items presently having that tag". The tag itself doesn''t
    exist as a separate object. So in the following snippet, the last rectangle added
    will not be colored red.


    ```

    ```python

    canvas.itemconfigure(''important'', fill=''red'')

    canvas.create_rectangle(10, 10, 40, 40, tags=(''important''))

    ```

    ```


    In text widgets by contrast, it''s not the individual characters that retain the
    state information about appearance, but tags, which are objects in their own right.
    So in this snippet, the newly added text will be colored red.


    ```

    ```python

    text.insert(''end'', ''first text'', (''important''))

    text.tag_configure(''important'', foreground=''red'')

    text.insert(''end'', ''second text'', (''important''))

    ```

    ```


    # ## Events and Bindings


    One quite cool thing is that you can define event bindings on tags. That allows
    you to do things like easily recognize mouse clicks just on particular ranges
    of text, and popup up a menu or dialog in response. Different tags can have different
    bindings, so it saves you the hassle of sorting out questions like "What does
    a click at this location mean?". Bindings on tags are implemented using the "tag
    bind" method.


    ```

    ```python

    text.tag_bind(''important'', ''<1>'', popupImportantMenu)

    ```

    ```


    Widget-wide binding to events works as it does for every other widget. Besides
    the normal low-level events, there are also two virtual events that will be generated:
    <Modified> whenever a change is made to the content of the widget, and <Selection>
    whenever there is a change made to which text is selected.


    # ## Selecting Text


    Your program may want to know if a range of text has been selected by the user,
    and if so, what that range is. For example, you may have a toolbar button to bold
    the selected text in an editor. While you can tell when the selection has changed
    (e.g. to update whether or not the bold button is active) via the <Selection>
    virtual event, that doesn''t tell you what has been selected.


    The text widget automatically maintains a tag named "sel", which refers to the
    selected text. Whenever the selection changes, the "sel" tag will be updated.
    So you can find the range of text selected using the "tag ranges" method, passing
    it "sel" as the tag to report on.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Similarly, you can change the selection by using "**tag add**" to set a new
    selection, or "**tag remove**" to remove the selection. You can''t actually delete
    the "self" tag of course.


    > *Though the default widget bindings prevent this from happening, "self" is like
    any other tag in that it can support multiple ranges, i.e. disjoint selections.
    To prevent this from happening when changing the selection from your code, make
    sure you remove any old selection before adding a new one.*


    The text widget manages the concept of the insertion cursor (where newly typed
    text will appear) separate from the selection. It does so using a new concept
    called a mark.


    # Marks


    Marks are used to indicate a particular place in the text. In that respect they
    are like indices, except that as the text is modified, the mark will adjust to
    be in the same relative location. In that way they are resemble tags, but refer
    to a single position rather than a range of text. Marks actually don''t refer
    to a position occupied by a character in the text, but specify a position between
    two characters.


    Tk automatically maintains two different marks. The first is named "insert", and
    is the present location of the insertion cursor. As the cursor is moved (via mouse
    or keyboard), the mark moves with it. The second mark is named "current", and
    reflects the position of the character underneath the current mouse position.


    To create your own marks, use the widget''s "**mark set**" method, passing it
    the name of the mark, and an index (the mark is positioned just before the character
    at the given index). This is also used to move an existing mark to a different
    position. Marks can be removed using the "**mark unset**" method, passing it the
    name of the mark. If you delete a range of text containing a mark, that also removes
    the mark.


    The name of a mark can also be used as an index (in the same way "1.0" or "end-1c"
    are indices). You can find the next mark (or previous one) from a given index
    in the text using the "**mark next**" or "**mark previous**"methods. The "**mark
    names**" method will return a list of the names of all marks.


    Marks also have a gravity, which can be modified with the "**mark gravity**" method,
    which affects what happens when text is inserted at the mark. Suppose we have
    the text "ac", with a mark in between that we''ll symbolize with a pipe, i.e.
    "a|c". If the gravity of that mark is "right" (the default) the mark will attach
    itself to the "c". If the new text "b" is inserted at the mark, the mark will
    remain stuck to the "c", and so the new text will be inserted before the mark,
    i.e. "ab|c". If the gravity is instead "left", the mark will attach itself to
    the "a", and so new text will be inserted after the mark, i.e. "a|bc".


    # Images and Widgets


    Like canvas widgets, text widgets can contain not only text, but also images and
    any other Tk widgets (including a frame itself containing many other widgets).
    In some senses, this allows the text widget to work as a geometry manager in its
    own right. The ability to add images and widgets within the text opens up a world
    of possibilities for your program.


    Images are added to a text widget at a particular index, with the image normally
    specified as an existing Tk image. There are also other options that allow you
    to fine-tune padding and so on.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Even More


    There are many more things that the text widget can do; here we''ll briefly mention
    just a few more of them. For details on using any of these, see the reference
    manual.


    # Search


    The text widget includes a powerful "search" method which allows you to locate
    a piece of text within the widget; this is useful for a "Find" dialog, as one
    obvious example. You can search backwards or forwards from a particular position
    or within a given range, specify your search using exact text, case insensitive,
    or using regular expressions, find one or all occurrences of your search term,
    and much more.


    # Modifications, Undo and Redo


    The text widget keeps track of whether or not changes have been made to the text
    (useful to know whether you need to save it for example), which you can query
    (or change) using the "edit modified" method. There is also a complete multi-level
    undo/redo mechanism, managed automatically by the widget when you set its"undo"
    configuration option to true. Calling "edit undo" or "edit redo" then will modify
    the current text using information stored on the undo/redo stack.


    # Eliding Text


    You can actually include text in the widget that is not displayed; this is known
    as "elided" text, and is made available using the "elide" configuration option
    for tags. You can use this to implement for example an outline, a "folding" code
    editor, or even just to bury some extra meta-data intermixed with your text. When
    specifying positioning with elided text you have to be a bit more careful, and
    so commands that deal with positions have extra options to either include or ignore
    the elided text.


    # Introspection


    Like most Tk widgets, the text widget goes out of its way to expose information
    about its internal state; we''ve seen most of this in terms of the "get" method,
    widget configuration options, "names" and "cget" for both tags and marks, and
    so on. There is even more information available that you can use for a wide variety
    of tasks. Check out the "debug", "dlineinfo", "bbox", "count" and "dump" methods
    in the reference manual.


    # Peering


    The Tk text widget allows the same underlying text data (containing all the text,
    marks, tags, images, and so on) to be shared between two or more different text
    widgets. This is known as peering, and is controlled via the "peer" method.


    # Tree


    +   * Widget Roundup

    +   * Reference Manual


    A **treeview** widget can display and allow browsing through a hierarchy of items,
    and can show one or more attributes of each item as columns to the right of the
    tree. It allows you to build user interfaces similar to the tree display you''d
    find in file managers like the OS X Finder or Windows Explorer. As with most Tk
    widgets, there is a ton of flexibility to make it behave as you need for a wide
    range of situations.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/94378c1b05607c1dc5649c738af95c74_75_0.png)


    ![](img/94378c1b05607c1dc5649c738af95c74_75_1.png)


    ![](img/94378c1b05607c1dc5649c738af95c74_75_2.png)


    # Treeview Widgets


    Treeview widgets are created using the `tkk.Treeview` function:


    ```

    tree = ttk.Treeview(parent)

    ```


    Horizontal and vertical scrollbars can be added in the usual manner, if desired.


    # Adding Items to the Tree


    To do anything useful with the treeview, you''ll need to add one or more items
    to it. Each item represents a single node in the tree, whether a leaf node or
    an internal node. Items are referred to by a unique id; this can be assigned by
    the programmer when the item is first created, or the widget can automatically
    choose an id for the item.


    Items are created by inserting them into the tree, using the treeview''s “insert”
    method. To insert an item, you need to know where in the tree to insert it, which
    means specifying the parent item as well as what position in the list of the parent''s
    children the new item should be inserted at.


    The treeview widget automatically creates a root node (which is not displayed),
    having the id of “{}” (i.e. the empty string), which can serve as the parent of
    the first level of items you add. Positions within the list of the parent''s children
    are specified by index (0 being the first, with the special “end” index meaning
    inserting after all existing children).


    Normally, you''ll also specify the name of each item, which is displayed in the
    tree. There are other options to add an image beside the name, specify whether
    the node is open or closed, and so on.


    ```

    ```python

    # Inserted at the root, program chooses id:

    tree.insert('''', ''end'', ''widgets'', text=''Widget Tour'')


    # Same thing, but inserted as first child:

    tree.insert('''', 0, ''gallery'', text=''Applications'')


    # Treeview chooses the id:

    id = tree.insert('''', ''end'', text=''Tutorial'')


    # Inserted underneath an existing node:

    tree.insert(''widgets'', ''end'', text=''Canvas'')

    tree.insert(id, ''end'', text=''Tree'')

    ```

    ```


    Inserting the item returns the id of the newly created item.'
