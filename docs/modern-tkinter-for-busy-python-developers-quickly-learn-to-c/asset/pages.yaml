    One obvious thing missing from this example was that while the list of countries
    could be quite long, only part of it fit on the screen at once. To show countries
    further down in the list you had to either drag with your mouse or use the down
    arrow key. A scrollbar would have been nice. Let’s fix that.


    # ## Scrollbar


    +   • Widget Roundup

    +   • Reference Manual


    A **scrollbar** helps the user to see all parts of another widget, whose content
    is typically much larger than what can be shown in the available screen space.


    ![](img/94378c1b05607c1dc5649c738af95c74_39_0.png)


    ```

    Scrollbars are created using the `ttk.Scrollbar` command:

    ```

    s = ttk.Scrollbar( parent, orient=VERTICAL, command=listbox.yview)

    listbox.configure(yscrollcommand=s.set)

    ```

    ```


    Unlike in some toolkits, scrollbars are not a part of another widget (e.g. a listbox),
    but are a separate widget altogether. Instead, scrollbars communicate with the
    scrolled widget by calling methods on the scrolled widget; as it turns out, the
    scrolled widget also needs to call methods on the scrollbar.


    The “orient” configuration option of scrollbars determines whether it will be
    used to scroll in the “horizontal” or “vertical”. You then need to set up the
    “command” configuration option to communicate with the scrolled widget. This needs
    to be the method to call on the scrolled widget.


    Every widget that can be scrolled vertically includes a method named “yview” (those
    that can be scrolled horizontally have a method named “xview”). As long as this
    method is present, the scrollbar doesn’t need to know anything else about the'
