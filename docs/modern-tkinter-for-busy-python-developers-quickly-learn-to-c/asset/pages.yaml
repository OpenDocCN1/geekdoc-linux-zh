- pgno: 62
  md: 'Tk''s images are actually quite powerful and sophisticated, and provide a wide
    variety of ways to inspect and modify images. You can find out more from the image
    command reference and the photo command reference.


    > *The types of multi-color images we''ve seen here are referred to in Tk as photo
    images. Tk also provides a second type of images, two-bit bitmap images, which
    were widely used in the 90''s when most Unix workstations used quite large (compared
    with PCs) monitors, but they were only black and white. Needless to say, color
    is de rigueur these days, so updating to full color images for icons and so on
