  md: 'message The main message displayed inside the alert.


    detail If needed, a secondary message, often displayed in a smaller font under
    the main message.


    title Title for the dialog window. Not used on Mac OS X.


    icon Icon to show: one of "info" (default), "error", "question" or "warning".


    default Specify which button (e.g. "ok" or "cancel" for a "okcancel" type dialog)
    should be the default.


    parent Specify a window of your application this dialog is being posted for; this
    may cause the dialog to appear on top, or on Mac OS X appear as a sheet for the
    window.


    > These new messagebox dialogs are a replacement from the older “tk_dialog” command,
    which does not comply with current platform user interface conventions.


    # Organizing Complex Interfaces


    If you have a large user interface, you’ll need to find ways to organize it in
    ways that don’t overwhelm your users with the complexity. There are a number of
    different approaches to doing this; again, both general and platform specific
    human interface guidelines are a good resource when deciding.


    Note when we’re talking about complexity in this chapter, it’s not the underlying
    technical complexity of how the program is put together, but how it’s presented
    to the user. A user interface can be pulled together from many different modules,
    be built up from multiple canvas widgets and deeply nested frames, but that doesn’t
    necessarily mean the user perceives it to be complex.


    # Multiple windows


    One of the benefits of using multiple windows in an application can be to simplify
    the user interface, by requiring the user to focus only on the contents of one
    window at a time (requiring them to focus on or switch between several windows
    can also have the opposite effect). Similarly, showing only the widgets that are
    relevant for the current task (via grid) can help simplify the user interface.


    # White space


    If you do need to display a large number of widgets onscreen at the same time,
    you have to think about how to organize them visually. You’ve seen how grid can
    help by making it easy to align widgets with each other. White space is another
    useful aid. Placing related widgets quite close to each other (possible with an
    explanatory label immediately above) and separated from other less-related widgets
    by white space helps the user organize the user interface in their own mind.


    > The amount of white space around different widgets, between groups of widgets,
    around borders and so on is highly platform specific. While you can do an adequate
    job without worrying about exact pixel numbers, if you want a highly polished
    user interface, you’ll need to tune this for each platform.


    # Separator


    +   * Widget Roundup

    +   * Reference Manual


    A second approach to grouping widgets in one display is to place a thin horizontal
    or vertical rule between groups of widgets; often this can be more space efficient
    than using white space, which may be relevant for a tight display. Tk provides
    a very simple separator widget for this purpose.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '![](img/94378c1b05607c1dc5649c738af95c74_57_0.png)


    ![](img/94378c1b05607c1dc5649c738af95c74_57_1.png)


    ![](img/94378c1b05607c1dc5649c738af95c74_57_2.png)


    Seperator Widgets


    Separators are created using the **tk.Separator** function:


    ```

    s = ttk.Separator(parent, orient=HORIZONTAL)

    ```


    The "orient" option may be specified as either "horizontal" or "vertical".


    # Label Frames


    +   - Widget Roundup

    +   - Reference Manual


    A **labelframe** widget, also commonly known as a group box, provides another
    way to group related components. It acts like a normal **tk.frame**, in that you
    will normally use it as a container for other widgets you grid inside it. However,
    it displays in a way that visually sets it off from the rest of the user interface.
    You can optionally provide a text label to be displayed outside the labelframe.


    ![](img/94378c1b05607c1dc5649c738af95c74_57_3.png)


    ![](img/94378c1b05607c1dc5649c738af95c74_57_4.png)


    ![](img/94378c1b05607c1dc5649c738af95c74_57_5.png)


    Labelframe Widgets


    Labelframes are created using the **ttk.Labelframe** function:


    ```

    lf = ttk.Labelframe(parent, text=''Label'')

    ```'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# # Paned Windows


    +   - Widget Roundup

    +   - Reference Manual


    A **panedwindow** widget lets you stack two or more resizable widgets above and
    below each other (or to the left and right). The user can adjust the relative
    heights (or widths) of each pane by dragging a sash located between them. Typically
    the widgets you''re adding to a panedwindow will be frames containing many other
    widgets.


    ![](img/94378c1b05607c1dc5649c738af95c74_58_0.png)


    Panedwindow Widgets (Shown here managing several labelframes)


    Panedwindows are created using the ttk.Panedwindow function:


    ```

    ```

    p = ttk.Panedwindow(parent, orient=VERTICAL)

    # first pane, which would get widgets gridded into it:

    f1 = ttk.Labelframe(p, text=''Pane1'', width=100, height=100)

    f2 = ttk.Labelframe(p, text="Pane2", width=100, height=100); # second pane

    p.add(f1)

    p.add(f2)

    ```

    ```


    A panedwindow is either "vertical" (it''s panes are stacked vertically on top
    of each other), or "horizontal". Importantly, all of the panes that you add to
    the panedwindow must be a direct child of the panedwindow itself.


    Calling the "add" method will add a new pane at the end of the list of panes.
    The "insert position subwindow" method allows you to place the pane at the given
    position in the list of panes (0...n-1); if the pane is already managed by the
    panedwindow, it will be moved to the new position. You can use the "forget(subwindow)"
    to remove a pane from the panedwindow; you can also pass a position instead of
    a subwindow.


    Other options let you sign relative weights to each pane so that if the overall
    panedwindow resizes, certain panes will get more space than others. As well, you
    can adjust the position of each sash between items in the panedwindow. See the
    command reference for details.


    # # Notebook


    +   - Widget Roundup

    +   - Reference Manual


    A **notebook** widget uses the metaphor of a tabbed notebook to let the user switch
    between one of several pages, using an index tab. In this case, unlike with paned
    windows, we''re only allowing the user to look at a single page (akin to a pane)
    at a time.


    59'
  merge: -1
  img_proc: true
- pgno: 59
  md: '![](img/94378c1b05607c1dc5649c738af95c74_59_0.png)


    # Notebook Widgets


    Notebooks are created using the **tk.Notebook** function:


    ```

    n = tk.Notebook(parent)

    f1 = ttk.Frame(n); # first page, which would get widgets gridded into it

    f2 = ttk.Frame(n); # second page

    n.add(f1, text=''One'')

    n.add(f2, text=''Two'')

    ```


    The operations on tabbed notebooks are similar to those on panedwindows. Each
    page is typically a frame, again a direct child (subwindow) of the notebook itself.
    A new page and its associated tab are added to the end of the list of tabs with
    the "add subwindow ?option value...?" method. The "text" tab option is used to
    set the label on the tab; also useful is the "state" tab option, which can have
    the value "normal", "disabled"(not selectable), or "hidden".


    To insert a tab at somewhere other than the end of the list, you can use the "insert
    position subwindow ?option value...?", and to remove a given tab, use the "forget"
    method, passing it either the position (0..n-1) or the tab''s subwindow. You can
    retrieve the list of all subwindows contained in the notebook via the "tabs"method.


    To retrieve the subwindow that is currently selected, call the "select" method,
    and change the selected tab by passing it either the tab''s position or the subwindow
    itself as a parameter.


    To change a tab option (like the text label on the tab or its state), you can
    use the "tab(tabid, option=value" method (where "tabid" is again the tab''s position
    or subwindow); omit the "=value" to return the current value of the option.


    Again, there is a variety of less frequently used options and commands detailed
    in the command reference.


    # Fonts, Colors, Images


    This chapter describes how Tk handles fonts, colors and images. We''ve touched
    on all of these before, but here we''ll provide a more in depth treatment.


    # Fonts


    Several Tk widgets, such as the label, text, and canvas, allow you to specify
    the fonts used to display text, typically via a "font" configuration option. As
    with many things in Tk, the default fonts are usually a good choice, but if you
    do want to make changes, this section will describe several ways to do so. Fonts
    are one of several areas that are highly platform specific, so how you specify
    them is important.


    The font command reference provides full details on specifying fonts, as well
    as other font-related operations.


    Most of the themed widgets that display text don''t have a "font" configuration
    option, unlike the classic Tk widgets. Rather than modifying individual widgets,
    the correct approach in the themed widgets is to specify the fonts used in a style,
    and then use that style for the individual widget. This is akin to the difference
    between hardcoding display-oriented markup like font tags inside HTML pages, vs.
    using CSS stylesheets that keep all the display specific information in one place.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Many older Tk programs hardcoded a lot of fonts, using either the "family size
    style" format we''ll see below, X11 font names, or the older and more arcane X11
    font specification string. In many cases, this left these applications with a
    dated look as platforms evolved. Further, many programs specified fonts on a per-widget
    basis, leaving the font decisions spread out through the program. Named fonts,
    and use of the standard fonts that Tk provides, are a far better solution. Reviewing
    and updating the usage of fonts is an easy and important change to make in any
    existing applications.


    # # Standard Fonts


    Particularly for more-or-less standard user interface elements, each platform
    defines specific fonts that should be used. Tk encapsulates many of these into
    a standard set of fonts that are always available, and of course the standard
    widgets use these fonts. This helps abstract away platform differences. The predefined
    fonts are:


    +   | | |

    +   |---|---|

    +   | TkDefaultFont | The default for all GUI items not otherwise specified. |

    +   | TkTextFont | Used for entry widgets, listboxes, etc. |

    +   | TkFixedFont | A standard fixed-width font. |

    +   | TkMenuFont | The font used for menu items. |

    +   | TkHeadingFont | The font typically used for column headings in lists and
    tables. |

    +   | TkCaptionFont | A font for window and dialog caption bars. |

    +   | TkSmallCaptionFont | A smaller caption font for subwindows or tool dialogs
    |

    +   | TkIconFont | A font for icon captions. |

    +   | TkTooltipFont | A font for tooltips. |


    # ## Platform-Specific Fonts


    A number of additional predefined fonts are available, but the precise set depends
    on the platform. Obviously, if you''re using these, and your application is portable
    across different platforms, you''ll need to ensure that proper fonts are defined
    individually for each platform.


    On X11, any valid X11 font name (see e.g. the "xlsfonts" command) may be used.
    Remember though that there is no guarantee that a particular font has been installed
    on a particular machine.


    On Windows, the following font names, which map to the fonts that can be set in
    the "Display" Control Panel, are available: `system, ansi, device, systemfixed,
    ansifixed, oemfixed`.


    On Mac OS X, the following fonts are available (see the Apple HIG for details):
    `systemSystemFont,systemSmallSystemFont, systemApplicationFont, systemViewsFont,
    systemMenuItemFont,systemMenuItemCmdKeyFont, systemPushButtonFont, systemAlertHeaderFont,
    systemMiniSystemFont,systemDetailEmphasizedSystemFont, systemEmphasizedSystemFont,
    systemSmallEmphasizedSystemFont, systemLabelFont, systemMenuTitleFont, systemMenuItemMarkFont,
    systemWindowTitleFont,systemUtilityWindowTitleFont, systemToolbarFont, systemDetailSystemFont`.


    # ## Named Fonts


    You can also create your own fonts, which can be used exactly like the predefined
    ones. To do so, you''ll need to pick a name to refer to the font, and then specify
    various font attributes that define how the font should look. Typically, you''d
    use different font attributes on different platforms; that way, you can use the
    font in your program without worrying about the details except in the one place
    the font is actually defined.


    Here''s an example:


    ```

    from tkinter import font

    appHighlightFont = font.Font(family=''Helvetica'', size=12, weight=''bold'')

    ttk.Label(root, text=''Attention!'', font=appHighlightFont).grid()

    ```'
