    # A Note on Coding Style


    Each of the languages included in this tutorial has a variety of coding styles
    and conventions available to choose from, which help determine conventions for
    variable and function naming, procedural, functional or object-oriented styles,
    and so on.


    Because the focus on this tutorial is Tk, this tutorial will keep things as simple
    as possible, generally using a very direct coding style, rather than wrapping
    up most of our code in procedures, modules, objects, classes and so on. As much
    as possible, you''ll also see the same names for objects, variables, etc. used
    across the languages for each example.


    # Step-by-Step Walkthrough


    Let''s take a closer look at that code, piece by piece. For now, all we''re trying
    to do is get a basic understanding of the types of things we need to do to create
    a user interface in Tk, and roughly what those things look like. We''ll go into
    details later.


    ```

    ```python

    from tkinter import *

    from tkinter import ttk

    ```

    ```


    These two lines tell Python that our program needs two modules. The first, “tkinter”,
    is the standard binding to Tk, which when loaded also causes the existing Tk library
    on your system to be loaded. The second, “ttk”, is Python''s binding to the newer
    “themed widgets” that were added to Tk in 8.5.


    > *Notice that we’ve imported everything from the tkinter module, so that we can
    call tkinter functions etc. without prefixing them, which is standard Tkinter
    practice. However, because we’ve imported just “ttk” itself, that means we''ll
    need to prefix anything inside that module. So for example calling “Entry(...)”
    would invoke the function*'
  merge: -1
  img_proc: true
- pgno: 13
  md: '*inside the tkinter module, while we’d need `tk.Entry(...)` to invoke the function
    inside `tk`. As you’ll see, several functions are defined in both modules, and
    sometimes you will need both, depending on the context. Making the `tk` calls
    explicit facilitates this, and will be the style used in this tutorial.*


    *One of the first things you’ll find if you’re migrating new code over, is that
    the name of the Tkinter module is now lowercase, i.e. `tkinter`, rather than `Tkinter`.
    This was changed as of `Python` 3.0.*


    ```

    root = Tk()

    root.title("Feet to Meters")

    mainframe = tk.Frame(root, padding="3 3 12 12")

    mainframe.grid(column=0, row=0, sticky=(N, W, E, S))

    mainframe.columnconfigure(0, weight=1)

    mainframe.rowconfigure(0, weight=1)

    ```


    *Yes, the "calculate" function appeared before this. We’ll describe it down below,
    but need to include it near the start because we reference it in other parts of
    the program.*


    Next, the above lines set up the main window, giving it the title “Feet to Meters”.
    Next, we create a frame widget, which will hold all the content of our user interface,
    and place that in our main window. The “columnconfigure”/“rowconfigure” bits just
    tell Tk that if the main window is resized, the frame should expand to take up
    the extra space.


    *Strictly speaking, we could just put the other parts of our interface directly
    into the main root window, without the intervening content frame. However, the
    main window isn’t itself part of the “themed” widgets, so its background color
    wouldn’t match the themed widgets we will put inside it. Using a “themed” frame
    widget to hold the content ensures that the background is correct.*


    ```

    feet = StringVar()

    meters = StringVar()

    feet_entry = tk.Entry(mainframe, width=7, textvariable=feet)

    feet_entry.grid(column=2, row=1, sticky=(W, E))

    tk.Label(mainframe, textvariable=meters).grid(column=2, row=2, sticky=(W, E))

    tk.Button(mainframe, text="Calculate", command=calculate).grid(column=3, row=3,
    sticky=W)

    ```


    The preceding lines create the three main widgets in our program: the entry where
    we type the number of feet in, a label where we put the resulting number of meters,
    and the calculate button that we press to perform the calculation.


    For each of the three widgets, we need to do two things: create the widget itself,
    and then place it onscreen. All three widgets, which are ‘children’ of our content
    window are created as instances of one of Tk’s themed widget classes. At the same
    time as we create them, we give them certain options, such as how wide the entry
    is, the text to put inside the Button, etc. The entry and label each are assigned
    a mysterious“textvariable”; we’ll see what that does shortly.


    If the widgets are just created, they won’t automatically show up on screen, because
    Tk doesn’t know how you want them to be placed relative to other widgets. That’s
    what the “grid” part does. Remembering the layout grid for our application, we
    place each widget in the appropriate column (1, 2 or 3), and row (also 1, 2 or
    3). The “sticky” option says how the widget would line up within the grid cell,
    using compass directions. So “W” (west) means anchor the widget to the left side
    of the cell, “we” (west-east) means anchor it to both the left and right sides,
    and so on.


    ```

    tk.Label(mainframe, text="feet").grid(column=3, row=1, sticky=W)

    tk.Label(mainframe, text="is equivalent to").grid(column=1, row=2, sticky=E)

    tk.Label(mainframe, text="meters").grid(column=3, row=2, sticky=W)

    ```


    The above three lines do exactly the same thing for the three static text labels
    in our user interface; create each one, and place it onscreen in the appropriate
    cell in the grid.


    ```

    for child in mainframe.winfo_children(): child.grid_configure(padx=5, pady=5)

    ```'
