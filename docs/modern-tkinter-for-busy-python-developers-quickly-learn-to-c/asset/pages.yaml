- pgno: 61
  md: 'The "family" specifies the font name; the names Courier, Times, and Helvetica
    are guaranteed to be supported (and mapped to an appropriate monospaced, serif,
    or sans-serif font), but other fonts installed on the system can be used (again,
    be careful to ensure the font exists, or the system will supply a different font,
    which may not necessarily be a good match). You can get the names of all available
    fonts with:


    font.families()


    The "size" option specifies the size of the font, in points. The "weight" option
    can be either **bold** or normal. You can specify a "slant" of roman (normal)
    or *italic*. Finally, the boolean options "underline" and"overstrike" are available.


    The current settings of these options can be examined or changed using the same
    mechanisms that you''d use for changing the configuration options of a widget
    (e.g. configure).


    # # Font Descriptions


    Another way to specify fonts is via a list of attributes, starting with the name
    of the font, and then optionally including a size, and optionally one or more
    style options. Some examples of this are "Helvetica", "Helvetica 12", "Helvetica
    12 bold", and "Helvetica 12 bold italic". These font descriptions are then used
    as the value of the "font" configuration option, rather than a predefined or named
    font.


    > In general, switching from font descriptions to named fonts is advisable, again
    to isolate font differences in one location in the program.


    # # Colors


    As with fonts, there are various ways to specify colors. Full details can be found
    in the colors command reference.


    In general, the system will provide the right colors for most things. Like with
    fonts, both Mac and Windows specify a large number of system-specific color names
    (see the reference), whose actual color may depend upon system settings (e.g.
    text highlight colors, default backgrounds).


    You can also specify colors via RGB, like in HTML, e.g. "#3FF" or "#FF016A". Finally,
    Tk recognizes the set of color names defined by X11; normally these are not used,
    except for very common ones such as "red", "black", etc.


    For themed Tk widgets, colors are often used in defining styles that are applied
    to widgets, rather than applying the color to a widget directly.


    It probably goes without saying that restraint in the use of colors is normally
    warranted.


    # # Images


    We''ve seen the basics of how to use images already, displaying them in labels
    or buttons for example. We create an image object, usually from a file on disk.


    ```

    imgobj = PhotoImage(file="myimage.gif")

    label["image"] = imgobj

    ```


    Out of the box, Tk includes support for GIF and PPM/PNM images. However, there
    is a Tk extension library called "Img" which adds support for many others: BMP,
    XBM, XPM, PNG, JPEG, TIFF, etc. Though not included directly in the Tk core, Img
    is usually included with other packaged distributions (e.g. ActiveTcl).


    PYTHONTODO'
