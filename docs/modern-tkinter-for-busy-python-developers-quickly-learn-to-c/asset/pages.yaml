    # # Canvas


    +   •Widget Roundup

    +   •Reference Manual


    A **canvas** widget manages a 2D collection of graphical objects — lines, circles,
    images, other widgets and more. Tk''s canvas is an incredibly powerful and flexible
    widget, and truly one of Tk''s highlights. It is suitable for a wide range of
    uses, including drawing or diagramming, CAD tools, displaying or monitoring simulations
    or actual equipment, and for building more complex widgets out of simpler ones.
    Canvas widgets are part of the classic Tk widgets, not the themed Tk widgets.


    ![](img/94378c1b05607c1dc5649c738af95c74_62_0.png)


    Canvas widgets are created using the **Canvas** function:


    ```

    ```python

    canvas = Canvas(parent)

    ```

    ```


    Because canvas widgets have a huge amount of features, we won''t be able to cover
    everything here. What we will do is take a fairly simple example (a freehand sketching
    tool) and incrementally add new pieces to it, each showing another new feature
    of canvas widgets. Towards the end of the chapter, we''ll then cover some of the
    other major features not illustrated in the example.


    # ## Creating Items


    When you create a new canvas widget, it will essentially be a large rectangle
    with nothing on it; truly a blank canvas in other words. To do anything useful
    with it, you''ll need to add items to it. As mentioned, there are a wide variety
    of different types of items you can add. Here, we''ll look at adding a simple
    line item to the canvas.


    To create a line, the one piece of information you''ll need to specify is where
    the line should be. This is done by using the coordinates of the starting and
    ending point, expressed as a list of the form x0 y0 x1 y1. The origin(0,0) is
    at the top left corner of the canvas, with the x value increasing as you move
    to the right, and the yvalue increasing as you move down. So to create a line
    from (10,10) to (200,50), we''d use this code:


    63'
