    \ or previous siblings of an item (“next” and “prev”), and return the list of\
    \ children of an item (“children”).\n\nYou can control whether or not the item\
    \ is open and shows its children by modifying the “open” item configuration option.\n\
    \n```\ntree.item('widgets'; open=TRUE)\n   isopen = tree.item('widgets', 'open')\n\
    ```\n\n# Displaying Information for each Item\n\nThe treview can also display\
