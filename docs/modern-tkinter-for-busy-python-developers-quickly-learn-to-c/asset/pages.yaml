    \ 10, 20, 20, tags=('firstline', 'drawing'))\n>>> c.create_rectangle(30, 30, 40,\
    \ 40, tags=('drawing'))\n>>> c.addtag('rectangle', 'withtag', 2)\n>>> c.addtag('polygon',\
    \ 'withtag', 'rectangle')\n>>> c.gettags(2)\n('drawing', 'rectangle', 'polygon')\n\
    >>> c.dtag(2, 'polygon')\n>>> c.gettags(2)\n('drawing', 'rectangle')\n>>> c.find_withtag('drawing')\n\
    (1, 2)\n```\n```\n\nAs you can see, things like \"withtag\" will take either an\
    \ individual item or a tag; in the latter case, they will apply to all items having\
    \ that tag (which could be none). The \"addtag\" and \"find\" have many other\
    \ options, allowing you to specify items near a point, overlapping a particular\
