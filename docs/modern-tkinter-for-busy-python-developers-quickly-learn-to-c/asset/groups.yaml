  mdcn: "\n为什么样式作者要这样划分？如果你小部件的一部分可能与另一部分位于不同位置，或者颜色可能与另一部分不同，那么它可能是使用元素的良好候选对象。请注意，这仅仅是构建按钮的一个示例。不同的样式和主题可以（也确实会）以不同的方式实现此目的。\n\
    \n下面是一个垂直滚动条的第二个示例，它包含一个容纳其余部分的“trough”（凹槽）元素，其中包括位于两端的上下箭头元素，以及中间的“thumb”（滑块）元素。\n\
    \n![](img/94378c1b05607c1dc5649c738af95c74_81_0.png)\n\n## 布局\n\n除了选择哪些元素属于小部件之外，样式还定义了这些元素在小部件内部的排列方式，换言之，即它们的布局。在按钮示例中，我们有一个标签元素位于间距元素内部，间距元素又位于焦点环元素内部，而焦点环元素则位于边框元素内部。因此，逻辑布局如下所示：\n\
    \n```text\nborder {\n    focus {\n        spacing {\n            label\n     \
    \   }\n    }\n}\n```\n\n我们可以通过以下方式询问 Tk TButton 样式的布局：\n\n```text\n>>> s.layout(\"\
    TButton\")\n[{'Button.border', ['children': [['Button.focus', ['children': [['Button.spacing',\n\
    ['children': [['Button.label', {'sticky': 'nsw'}], 'sticky': 'nsw']],\n'sticky':\
    \ 'nsw']]], 'sticky': 'nsw', 'border': '1']]}\n```\n\n如果我们整理并格式化这些内容，就会得到具有以下结构的结果：\n\
    \n```text\nButton.border -sticky nsw -border 1 -children {\n    Button.focus -sticky\
    \ nsw -children {\n        Button.spacing -sticky nsw -children {\n          \
    \  Button.label -sticky nsw\n        }\n    }\n}\n```\n\n这开始变得有意义了；我们有四个元素，命名为\
    \ \"Button.border\"、\"Button.focus\"、\"Button.spacing\" 和 \"Button.label\"。每个元素都有不同的元素选项，例如\
    \ \"-children\"、\"-sticky\" 和 \"-border\"，这里用于指定布局或尺寸。暂且不深入细节，我们可以清楚地看到基于 \"-children\"\
    \ 和 \"-sticky\" 属性的嵌套布局；Tk 使用 Tk \"pack\" 几何管理器的简化版本来指定元素布局。\n\n## 元素选项\n\n这些不同的每个元素可能拥有一系列不同的选项。例如，滚动条的滑块可能有一个选项用于设置其背景颜色，或者另一个选项用于提供边框宽度（如果有）。这些可以进行自定义，以调整小部件内元素的外观。\n\
    \n每个元素有哪些可用选项？下面是一个检查按钮内部标签可用选项的示例（我们知道从 \"layout\" 命令可知，它被标识为 \"Button.label\"\
    ）：\n\n```python\n>>> s.element_options('Button.label')\n('-compound', '-space',\
    \ '-text', '-font', '-foreground', '-underline', '-width', '-anchor', '-justify',\
    \ '-wraplength', '-embossed', '-image', '-stipple', '-background')\n```\n\n显然，这些选项不应该带有前导破折号。\n\
    \n在下一节中，我们将看看一种并非完全直观的方式来处理元素选项。\n\n## 更改样式选项\n\n在本节中，我们将研究如何通过修改样式选项来更改样式的外观。你可以通过修改现有样式，或者更常见的是，通过创建新样式来实现这一点。\n\
    \n### 修改样式选项\n\n修改现有样式的配置选项的方式类似于修改其他任何配置选项，通过指定样式、选项名称和新值：\n\n```python\ns.configure('TButton',\
    \ font='helvetica 24')\n```\n\n你很快会了解到哪些是有效选项。\n\n如果你需要检索某个选项的当前值，可以使用 \"lookup\"\
    \ 方法。\n\n```python\n>>> s.lookup('TButton', 'font')\n'helvetica 24'\n```\n\n###\
    \ 创建新的派生样式\n\n如果你修改一个现有样式，例如 \"TButton\"，该修改将应用于使用该样式的所有小部件（因此默认情况下是所有按钮）。这可能正是你想要做的。\n\
    \n更常见的是，你感兴趣的是创建一个与现有样式相似但在某些方面有所不同的新样式。例如，你希望应用程序中的大多数按钮保持其正常外观，但创建某些特殊的“紧急”按钮，这些按钮将以不同的方式突出显示。在这种情况下，创建一个从基础样式（\"\
    TButton\"）派生的新样式（例如 \"Emergency.TButton\"）将是合适的做法。\n\n通过在现有样式名前加上另一个名称（如 \"Emergency\"\
    ）和一个点，你实际上是在隐式创建一个从现有样式派生的新样式。因此，在这个示例中，我们的新样式将拥有与普通按钮完全相同的选项，除了指出的差异外：\n\n```python\n\
    s.configure('Emergency.TButton', font='helvetica 24', foreground='red', padding=10)\n\
    ```\n\n## 特定状态样式选项\n\n除了样式的正常配置选项外，小部件作者可能已指定当小部件处于特定小部件状态时应使用的不同选项。例如，当按钮被禁用时，你希望将按钮标签的颜色变灰。\n\
    \n为此，你可以指定一个 \"map\"（映射），它允许你为一个或多个样式配置选项指定变体。对于每个配置选项，你可以指定一组小部件状态，以及当小部件处于该状态时该选项应被分配的值。\n\
    \n> 请记住，状态由一个或多个状态标志（或其否定）组成，由小部件的 \"state\" 方法设置，或通过 \"instase\" 方法查询。\n\n以下示例提供了按钮从“正常”外观到以下变体的调整：\n\
    \n- 当小部件处于禁用状态时，背景颜色应设置为 \"#d9d9d9\"\n- 当小部件处于活动状态（鼠标悬停时）时，背景颜色应设置为 \"#feecec\"\
    \n- 当小部件处于禁用状态时，前景颜色应设置为 \"#3a3a3a\"（这是在已注意到的背景颜色更改之外）\n- 当小部件处于按钮按下且小部件未禁用的状态时，relief（浮雕）应设置为\
    \ \"sunken\"（凹陷）\n\n请记住，在过去，对于经典 Tk 小部件，当小部件处于每种状态时具体会发生什么变化，完全由小部件作者决定。而对于主题化小部件，是样式本身决定了会发生什么变化，这可能包括原始小部件作者未曾预想到的内容。\n\
    \n> 由于小部件状态可以包含多个标志，因此对于某个选项，可能不止一个状态会匹配（例如，如果设置了小部件的 \"pressed\" 状态标志，则 \"pressed\"\
    \ 和 \"pressed !disabled\" 都会匹配）。状态列表按照你在 map 命令中提供的顺序进行评估，使用列表中第一个匹配的状态。\n\n##\
    \ 对你来说很难吗？\n\n因此，你现在知道样式由元素组成，这些元素具有多种选项，并以特定布局组合在一起。你可以更改样式上的各种选项，使使用该样式的所有小部件呈现不同的外观。使用该样式的所有小部件都会呈现出样式定义的外观。主题收集了一整套相关的样式，使得更改整个用户界面变得容易。\n\
    \n那么，在实践中，是什么使样式和主题如此困难呢？三件事。首先：\n\n你只能修改样式的选项，而不能修改元素选项（除了少数情况）。\n\n我们之前讨论了如何通过检查样式的布局来发现样式中使用了哪些元素，以及如何发现每个元素的可用选项。但是，当我们尝试对样式进行修改时，我们似乎是在配置样式的某个选项，而没有指定具体的元素。这是怎么回事？\n\
    \n再次使用我们的按钮示例，我们有一个元素 \"Button.label\"，除了其他功能外，它还有一个 \"font\" 配置选项。实际情况是，当 \"\
    Button.label\" 元素被绘制时，它会查看设置在样式上的 \"font\" 配置选项，以确定用哪种字体绘制自身。\n\n> *要理解原因，你需要知道，当样式将某个元素作为其一部分包含时，该元素本身不维护任何（特定于元素的）存储。特别是，它本身不存储任何配置选项。当它需要检索选项时，它是通过传入的包含它的样式来完成的。因此，单个元素在\
    \ GoF（Gang of Four）模式术语中被称为“轻量级”（flyweight）对象。*\n\n类似地，其他任何元素都将从设置在样式上的选项中查找它们的配置选项。如果两个元素使用相同的配置选项（比如背景颜色）会怎样？因为只有一个存储于样式中的背景配置选项，这意味着两个元素都将使用相同的背景颜色。你不能让一个元素使用一种背景颜色，而另一个元素使用不同的背景颜色。\n\
    \n> *除非你可以。在当前实现中，有少数讨厌的、特定于小部件的东西叫做 \"sublayouts\"（子布局），有时让你可以通过配置像 \"TButton.Label\"\
    \ 这样的选项（而不仅仅是样式名称 \"TButton\"）来仅修改单个元素。可以这样做的那些情况有文档记录吗？有没有什么方法可以通过内省来确定何时可以这样做？答案是否定的。这是主题化小部件\
    \ API 中一个我绝对期待其随时间演变的部分。*\n\n第二个困难也与修改样式选项有关：\n\n**可用选项不一定有效，且修改无效选项不会报错。**\n\n\
    有时你会尝试更改根据元素选项本应存在的选项，但它不会有任何效果。作为一个例子，你无法修改 Mac OS X 使用的 \"aqua\" 主题中按钮的背景颜色。虽然这些情况有正当理由，但目前很难发现它们，这有时会使得实验变得令人沮丧。\n\
    \n在实验时可能更令人沮丧的是，指定一个“不正确”的样式名称或选项名称不会生成错误。在执行 \"configure\" 或 \"lookup\" 时，你实际上可以为样式指定任何名称，并可以为选项指定任何名称。因此，如果你对\
    \ \"background\" 和 \"font\" 选项感到厌倦，请随意配置一个 \"dothwithmean\" 选项。它可能不起任何作用，但这不是错误。同样，这可能使你难以知道应该修改什么，不应该修改什么。\n\
    \n> *这是拥有一个非常轻量级和动态系统的一个缺点。你只需在配置样式选项时提供名称即可创建新样式；这意味着你不需要显式创建样式对象。与此同时，这也容易出错。而且，你无法找出当前存在或正在使用哪些样式。并且由于样式选项实际上只是元素选项的前端，而且样式中的元素随时可能发生变化，因此显然选项不一定仅限于当前元素引用的那些，而这些元素本身可能也不都具有内省能力。*\n\
    \n最后，这是使样式和主题如此困难的最后一件事：\n\n**每个主题中可用的元素、这些元素的名称、每个元素可用的或有效的选项，以及特定小部件使用的选项，都可能不同。**\n\
    \n那么呢？请记住，除了其他事项外，每个平台（Windows、Mac OS X 和 Linux）的默认主题都是不同的（这是一件好事）。这带来的一些影响：\n\
    \n"
