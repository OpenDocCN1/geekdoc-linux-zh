    -children {Button.label -sticky nsw}}` | - `Button.button`: (文本中未列出特定选项，默认为空)<br>-
    `Button.padding`: padding, relief, shifrelief<br>- `Button.label`: compound, space,
    text, font, foreground, underline, width, anchor, justify, wraplength, embossed,
    image, stipple, background |

    | Windows | `Button.button -sticky nsw -children {Button.focus -sticky nsw -children
    {Button.padding -sticky nsw -children {Button.label -sticky nsw}}}` | - `Button.button`:
    (未列出特定选项)<br>- `Button.focus`: (未列出特定选项)<br>- `Button.padding`: padding, relief,
    shifrelief<br>- `Button.label`: compound, space, text, font, foreground, underline,
    width, anchor, justify, wraplength, embossed, image, stipple, background |

    | Linux | `Button.border -sticky nsw -border 1 -children {Button.focus -sticky
    nsw -children {Button.padding -sticky nsw -children Button.label -sticky nsw}}`
    | - `Button.border`: background, borderwidth, relief<br>- `Button.focus`: focusthickness<br>-
    `Button.padding`: padding, relief, shifrelief<br>- `Button.label`: compound, space,
    text, font, foreground, underline, width, anchor, justify, wraplength, embossed,
    image, stipple, background |


    简而言之，在经典 Tk 中，你能够修改单个小部件的大量属性集合中的任意一个，这在单一平台上非常容易实现，并且在其他平台上的工作方式也大致相同。而在带主题（Themed）的
    Tk 中，便捷的选项并不存在，如果你希望应用程序能在多个主题/平台上正常工作，基本上就被迫采用正确的方式进行处理。这需要预先投入更多的工作量。


    ## 进阶：关于元素的其他信息


    虽然本教程在样式和主题方面的讲解到此为止，但对于好奇的用户以及希望深入探索创建新主题的人来说，我们可以提供一些关于元素的更多有趣细节。


    由于元素是样式和主题的构建块，自然会引发“元素从哪里来？”的问题。实际上，我们可以说元素通常是通过 C 代码创建的，并且遵循主题引擎理解的特定 API。


    在最低层面上，元素来自所谓的元素工厂（element factory）。目前存在一个“默认”工厂，大多数主题都使用它，并利用 Tk 的绘制例程来创建元素。第二种工厂允许你从图像创建元素，并且实际上可以在脚本层级通过
    "ttk::style element create" 方法（源自 Tcl）访问。最后，还有一个针对 Windows 特有的引擎，使用底层的 "Visual
    Styles" 平台 API。


    如果主题使用通过平台原生小部件创建的元素，那么调用这些原生小部件的操作通常出现在该主题的元素规范代码中。当然，依赖原生小部件或 API 调用的主题只能在支持它们的平台上运行。


    随后，主题会获取一组元素，并使用这些元素来组装实际由小部件使用的样式。既然主题的核心思想是让多个样式共享相同的外观，不同样式共享相同元素也就不足为奇了。


    因此，虽然 "TButton" 样式包含 "Button.padding" 元素，而 "TEntry" 样式包含 "Entry.padding" 元素，但在这些填充元素底层，它们很可能是一模一样的。它们可能看起来不同，但这归因于不同的配置选项，正如我们之前提到的，这些选项存储在使用该元素的样式中。


    发现主题可以提供一组通用选项，如果样式未另行指定，这些选项将用作每个样式的默认值，这也并不令人惊讶。这意味着，如果整个主题中几乎所有内容都具有绿色背景，主题无需为每个样式明确说明这一点。这使用了一个名为
    "" 的根样式；毕竟，如果 "F.un.TButton" 可以继承自 "TButton"，为什么 "TButton" 不能继承自 "" 呢？


    最后，值得看一下现有主题是如何定义的，既要在 Tk C 库中的 C 代码层面，也要通过 Tk "library/ttk" 目录中的 Tk 脚本。在 Tk 的
    C 库中搜索 "Tkx_RegisterElementSpec" 以查看元素是如何指定的。


