    \n## 示例消息框\n\n与我们之前看到的对话框类似，这些也是模式对话框，并将返回用户操作的结果给调用者。确切的返回值将取决于传递给命令的 \"type\"\
    （类型）选项，如下所示：\n\n| **类型选项** | **可能的返回值** |\n|---|---|\n| ok（默认） | \"ok\" |\n| okcancel\
