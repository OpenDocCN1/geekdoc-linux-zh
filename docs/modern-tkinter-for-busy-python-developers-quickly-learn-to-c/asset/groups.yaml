  mdcn: "\n## 小部件\n\n小部件（Widgets）是你在屏幕上看到的所有事物。在我们的示例中，有一个按钮、一个条目框、几个标签和一个框架。其他小部件包括复选框、树视图、滚动条、文本区域等。小部件通常被称为“控件”（controls）；你也会经常看到它们被称为“窗口”（windows），尤其是在\
    \ Tk 的文档中，这是源自其 X11 历史的一个遗留习惯（在这种术语下，顶层窗口和像 Button 这样的控件都被称为窗口）。\n\n下面是一个示例，展示了\
    \ Tk 的一些小部件，我们稍后将会逐一介绍。\n\n![](img/94378c1b05607c1dc5649c738af95c74_15_0.png)\n\
    \n## 小部件类\n\n小部件是对象，是代表按钮、框架等类的实例。因此，你需要做的第一件事是确定你要实例化的小部件的具体类。本教程和小部件综述将帮助你完成这一步。\n\
    \n## 窗口层级\n\n你需要知道的另一件事是你想要创建的小部件实例的父级。在 Tk 中，所有小部件都是窗口层级的一部分，层级的顶部是单一的根节点。这个层级可以任意深；因此，你可能会在根窗口内的一个框架里嵌套另一个框架，而在其中再放置一个按钮。即使是新的顶层窗口也是该层级的一部分，它及其所有内容包括在整体窗口层级中形成一个子树。\n\
    \n在我们的单位换算示例中，我们创建了一个作为根窗口子项的单一框架，而该框架包含了所有其他控件作为其子项。根窗口是框架的容器，因此是框架的父级。该示例的完整层级结构如下所示：\n\
    \n![](img/94378c1b05607c1dc5649c738af95c74_15_1.png)\n\n单位换算示例的窗口层级。\n\n## 创建和使用小部件\n\
    \n每个独立的小部件都是一个 Python 对象。在创建小部件时，你必须将其父级作为参数传递给小部件创建函数。唯一的例外是“根”窗口，它是将包含其他所有内容的顶层窗口。根窗口是自动创建的，并且没有父级。示例如下：\n\
    \n```python\nroot = Tk()\ncontent = tk.Frame(root)\nbutton = tk.Button(content)\n\
    ```\n\n是否将小部件对象保存在变量中完全取决于你，这当然取决于你之后是否需要引用它。因为对象被插入到小部件层级中，即使你不保留对它的引用，它也不会被垃圾回收。\n\
    \n*如果你偷偷看了一眼 Tcl 是如何管理小部件的，你会发现每个小部件都有一个特定的路径名；你还会在 Tk 参考文档中看到对该路径名的引用。Tkinter\
    \ 在幕后为你选择和所有管理这些路径名，所以你永远不需要担心它们。不过，如果你确实需要，可以通过调用 `str(widget)` 从小部件获取路径名。*\n\
    \n## 配置选项\n\n所有小部件还有许多不同的配置选项，这些选项通常控制它们的显示方式或行为方式。\n\n可用的选项当然取决于小部件类。不同小部件类之间具有一致性，因此执行类似功能的选项往往具有相同的名称。例如，按钮和标签都有一个\"\
    text\"选项来调整小部件显示的文本，而例如滚动条就没有\"text\"选项，因为它不需要。同样，按钮有一个\"command\"选项，告诉它在被按下时要做什么，而仅持有静态文本的标签则没有该选项。\n\
    \n在小部件首次创建时就可以设置配置选项，方法是将选项的名称和值作为可选参数传递。之后，你可以检查这些选项的值，并在极少数的例外情况下随时修改它们。如果你不确定小部件的所有不同选项是什么，可以要求小部件提供信息。这将给你一个所有选项的长列表，对于每个选项，你可以看到选项的名称及其当前值（以及另外三个你通常不需要担心的属性）。\n\
    \n以下交互式解释器对话最能说明这一切。\n\n```python\n% python\n>>> from tkinter import *\n>>> from\
    \ tkinter import tk\n>>> root = Tk()\n# 创建一个按钮，传递两个选项：\n>>> button = tk.Button(root,\
    \ text=\"Hello\", command=\"buttonpressed\")\n>>> button.grid()\n# 检查 text 选项的当前值：\n\
    >>> button[\"text\"]\n'Hello'\n# 修改 text 选项的值：\n>>> button[\"text\"] = 'goodbye'\n\
    # 做同样事情的另一方法：\n>>> button.configure(text='goodbye')\n# 检查 text 选项的当前值：\n>>> button[\"\
    text\"]\n'goodbye'\n# 获取关于 text 选项的所有信息：\n>>> button.configure(\"text\")\n('text',\
    \ 'text', 'Text', '', 'goodbye')\n# 获取该小部件所有选项的信息：\n>>> button.configure()\n{'cursor':\
    \ ('cursor', 'cursor', 'Cursor', '', ''),\n 'style': ('style', 'style', 'Style',\
    \ '', ''),\n 'default': ('default', 'default', 'Default', <index object at 0x00DFFD10>,\
    \ <index object at 0x00DFFD10>),\n 'text': ('text', 'text', 'Text', '', 'goodbye'),\n\
    \ 'image': ('image', 'image', 'Image', '', ''),\n 'class': ('class', \"\", \"\"\
    , \"\", \"\"),\n 'padding': ('padding', 'padding', 'Pad', '', ''),\n 'width':\
    \ ('width', 'width', 'Width', '', ''),\n 'state': ('state', 'state', 'State',\
    \ <index object at 0x0167FA20>, <index object at 0x0167FA20>),\n 'command': ('command',\
    \ 'command', '', 'Command', '', 'buttonpressed'),\n 'textvariable': ('textvariable',\
    \ 'textVariable', '', 'Variable', '', ''),\n 'compound': ('compound', 'compound',\
    \ '', 'Compound', <index object at 0x0167FA08>, <index object at 0x0167FA08>),\n\
    \ 'underline': ('underline', 'underline', 'Underline', '', -1, -1),\n 'takefocus':\
    \ ('takefocus', 'takeFocus', 'TakeFocus', '', 'ttk:takefocus')}\n```\n\n## 几何管理\n\
    \n如果你一直在尝试创建小部件，你可能已经注意到，仅仅通过创建它们，它们并不会出现在屏幕上。将实际对象放入屏幕窗口中，以及精确确定它们在窗口中的位置，是一个称为几何管理的独立步骤。\n\
    \n在我们的示例中，这种定位是通过\"grid\"命令实现的，我们在那里传递了每个小部件所在列和行的编号、网格内物品的对齐方式等。网格是几何管理器（geometry\
    \ manager）的一个示例（Tk 中有几种几何管理器，网格最为实用）。我们将在后续章节中详细讨论网格，但在这里我们将概述几何管理的一般情况。\n\n几何管理器的任务是确定这些小部件确切的位置。事实证明，这是一个非常困难的优化问题，良好的几何管理器依赖于相当复杂的算法。良好的几何管理器提供了让程序员感到满意、功能强大且易用的灵活性，Tk\
    \ 的\"grid\"无疑是绝对最好的之一：糟糕的几何管理器……好吧，所有忍受过\"GridBagLayout\"的 Java 程序员请举手。\n\n###\
    \ 问题\n\n对于几何管理器来说，问题是接收程序创建的所有不同小部件，加上程序希望物品在窗口中放置位置的说明（显式的，或更常见的是相对于其他小部件），并将它们实际放入窗口中。\n\
    \n在此过程中，几何管理器必须平衡许多不同的约束：\n\n- 小部件可能有一个“自然”尺寸（例如，标签的自然宽度通常由其中的文本和字体决定），但这些不同小部件试图适应的顶层窗口不够大以容纳它们；几何管理器必须决定缩小哪些小部件以适应、缩小多少等。\n\
    - 如果顶层窗口大于所有小部件的自然尺寸，多余的空间如何使用？它是仅用于小部件之间的额外空间，如果是，该空间如何分配？它是用于使某些小部件比它们通常希望的大吗？\n\
    - 如果顶层窗口的大小改变，其中小部件的大小和位置如何变化？某些区域（例如文本输入区域）会扩展或缩小，而其他部分保持相同大小，还是区域以不同方式分配？某些小部件是否有你希望避免低于（或高于）的最小（或最大）尺寸？\n\
    - 用户界面不同部分的小部件如何相互对齐，以呈现整洁的布局并符合有关小部件间距的平台指南？\n- 对于复杂的用户界面，可能包含许多嵌套在其他框架中的框架，嵌套在窗口中（等等），如何实现上述所有目标，同时权衡整个用户界面不同部分的相互冲突的需求？\n\
    \n### 工作原理\n\nTk 中的几何管理依赖于主小部件（master）和从属小部件（slave）的概念。主小部件是一个小部件，通常是顶层窗口或框架，它将包含其他被称为从属小部件的小部件。你可以认为几何管理器接管了主小部件，并决定在内部显示什么。\n\
    \n几何管理器会向每个从属小部件询问其自然尺寸，或者它理想情况下希望显示的尺寸。然后，它将此信息与程序在要求几何管理器管理该特定从属小部件时提供的任何参数相结合。在我们的示例中，我们向网格传递了每个小部件的\"\
    column\"和\"row\"编号，指示了小部件相对于其他小部件的位置，还有一个\"sticky\"参数来建议小部件应如何对齐或可能的拉伸。我们还使用\"\
    columnconfigure\"和\"rowconfigure\"来指示如果我们希望窗口中有可用空间时，哪些列和行应该扩展。当然，所有这些参数都是网格特有的；其他几何管理器会使用不同的参数。\n\
    \n"
