    \ | \"abort\"、\"retry\" 或 \"ignore\" |\n\nTkinter 不使用 'type' 选项，而是为每种类型的对话框使用不同的方法名。可用的方法有：askokcancel,\
    \ askquestion, askretrycancel, askyesno, askyesnocancel, showerror, showinfo,\
