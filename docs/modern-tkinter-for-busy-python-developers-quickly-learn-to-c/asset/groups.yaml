    # # Item Appearance and Events


    Like the text and canvas widgets, the treeview widget uses tags to help you modify
    the appearance of items in the tree. You can assign a list of tags to each item
    using the "tags" item configuration option (again, when creating the item or later
    on).


    Tag configuration options can then be specified, which will then apply to all
    items having that tag. Valid tag options include "foreground" (text color), "background",
    "font", and "image" (not used if the item specifies its own image).


    You can also create event bindings on tags, which let you capture mouse clicks,
    keyboard events etc.


    ```

    ```text

    tree.insert('''', ''end'', text=''button'', tags=(''ttk'', ''simple''))

    tree.tag_configure(''ttk'', background=''yellow'')

    tree.tag_bind(''ttk'', ''<1>'', itemClicked); # the item clicked can be found
    via tree.focus()

    ```

    ```


    The treeview will generate virtual events "<TreeviewSelect>", "<TreeviewOpen>"
    and "<TreeviewClose>"which allow you to monitor changes to the widget made by
    the user. You can use the "selection" method to determine the current selection
    (the selection can also be changed from your program).


    # # Customizing the Display


    There are many aspects of how the treeview widget is displayed that you can customize.
    Some of them we’ve already seen, such as the text of items, fonts and colors,
    names of column headings, and more. Here are a few additional ones.


    +   *   •Specify the desired number of rows to show using the "height" widget
    configuration option.


    +       •Control the width of each column using the column’s “width” or “minwidth”
    options. The column holding the tree can be accessed with the symbolic name “#0”.
    The overall requested width for the widget is based on the sum of the column widths.


    +       •Choose which columns to display and the order to display them in using
    the “displaycolumns” widget configuration option.


    +       •You can optionally hide one or both of the column headings or the tree
    itself (leaving just the columns) using the “show” widget configuration option
    (default is “tree headings” to show both).


    +       •You can specify whether a single item or multiple items can be selected
    by the user via the “selectmode”widget configuration option, passing “browse”
    (single item), “extended” (multiple items, the default), or “one”.


    # # Styles and Themes


    The “themed” aspect of the new Ttk widgets is one of the most powerful and exciting
    aspects of the new widget set. Yet because it does things quite differently from
    how Tk has traditionally worked, and because in trying to be flexible it does
    a lot of things, it’s certainly the most confusing for many people.


    # # Definitions


    We’ll first define a few concepts and terms that Ttk themes and styles rely on.


    # ## Widget Class


    A widget class is used by Tk to identify the type of a particular widget; essentially,
    whether it is a button, a label, a canvas, etc. In classic Tk, all buttons had
    the same class (“Button”), all labels had the same class (“Label”), etc.


    You could use this widget class both for introspection, and for changing options
    globally via the option database. This could let you say for example that all
    buttons by default had a red background.'
