    \ take several different configuration options which can alter how they are displayed.\n\
    \n#### Requested Size\n\nLike any other widget, after creation it is added to\
    \ the user interface via a (parent) geometry manager. Normally, the size that\
    \ the frame will request from the geometry manager will be determined by the size\
    \ and layout of any widgets that are contained in it (which are under the control\
    \ of the geometry manager that manages the contents of the frame itself).\n\n\
    If for some reason you want an empty frame that does not contain other widgets,\
    \ you should instead explicitly set the size that the frame will request from\
    \ its parent geometry manager using the \"width\" and/or \"height\" configuration\
    \ options (otherwise you'll end up with a very small frame indeed).\n\n> *Normally,\
    \ distances such as width and height are specified just as a number of pixels\
    \ on the screen. You can also specify them via one of a number of suffixes. For\
    \ example, \"350\" means 350 pixels, \"350c\" means 350 centimeters, \"350i\"\
    \ means 350 inches, and 350p means 350 printer's points (1/72 inch).*\n\n####\
    \ Padding\n\nThe \"padding\" configuration option is used to request extra space\
    \ around the inside of the widget; this way if you're putting other widgets inside\
    \ the frame, there will be a bit of a margin all the way around. A single number\
    \ specifies the same padding all the way around, a list of two numbers lets you\
    \ specify the horizontal then the vertical padding, and a list of four numbers\
    \ lets you specify the left, top, right and bottom padding, in that order.\n`frame[\"\
    padding\"] = (5,10)`\n"
  mdcn: "\n\n几何管理器获取所有从属部件的信息，以及主部件的尺寸信息，并使用其内部算法来确定分配给每个从属部件的区域（如果有的话！）。之后，从属部件负责在该特定矩形内进行绘制等操作。当然，每当主部件的大小发生变化时（例如，因为顶层窗口被调整大小了），从属部件的自然尺寸会发生变化（例如，因为我们改变了标签中的文本），或者任何几何管理器参数发生变化时（例如\
    \ \"row\"、\"column\" 或 \"sticky\"），我们就会重复整个流程。\n\n这一切也是递归工作的。在我们的示例中，顶层窗口内部有一个内容框架，然后内容框架内还有若干其他控件。因此，我们有几何管理器在两个不同的主部件上工作。在外层，顶层窗口是主部件，而内容框架是从属部件。在内层，内容框架是主部件，而其他每个控件都是从属部件。因此，同一个控件既可以是主部件，也可以是从属部件。当然，这种层次结构可以嵌套得更深。\n\
    \n> 虽然每个主部件只能拥有一个几何管理器（例如 grid），但不同的主部件完全可以拥有不同的几何管理器；虽然 grid 通常被使用，但对于用户界面某一部分使用的特定布局，其他几何管理器可能更有意义。此外，我们一直假设从属控件是其在控件层次结构中父主部件的直接子级。虽然这种情况通常如此，而且没有其他好的理由这样做，但在某些限制下，也可以绕过这一规则。\n\
    \n## 事件处理\n\n在 Tk 中，与大多数其他用户界面工具包一样，有一个事件循环，用于接收来自操作系统的事件。这些事件包括按钮按下、按键输入、鼠标移动、窗口调整大小等等。\n\
    \n通常，Tk 会为你管理这个事件循环。它会确定事件适用于哪个控件（用户是否点击了这个按钮？如果按下了键，哪个文本框拥有焦点？），并相应地分发事件。各个控件知道如何响应事件，例如，当鼠标移入按钮时，按钮可能会改变颜色，当鼠标移出时恢复原状。\n\
    \n### 命令回调\n\n不过，你通常希望程序能处理特定事件，例如在按下按钮时执行某些操作。对于那些几乎必须自定义的事件（如果按下按钮时没有任何反应，那按钮有什么用呢？），控件会提供一个作为控件配置选项的回调函数。我们在按钮\
    \ \"command\" 选项的示例中看到过这一点。\n\nTk 中的回调函数通常比用于编译型语言的工具包中的回调函数更简单（后者的回调函数通常必须指向具有特定参数集的过程或具有特定签名的对象方法）。相反，回调函数只是一段由解释器执行的普通代码。虽然它可以做到你想让它多复杂就多复杂，但大多数时候，你只需要回调函数调用其他某个过程。\n\
    \n### 事件绑定\n\n对于没有关联命令回调函数的事件，你可以使用 Tk 的 \"bind\" 来捕获任何事件，然后（与回调函数类似）执行任意一段代码。\n\
    \n下面是一个（滑稽的）示例，展示如何为标签设置绑定以响应不同事件，它是通过仅更改标签中显示的内容来实现的。\n\n```python\nfrom tkinter\
    \ import *\nfrom tkinter import ttk\nroot = Tk()\n    l = ttk.Label(root, text=\"\
    Starting...\")\n    l.grid()\n    l.bind('<Enter>', lambda e: l.configure(text='Moved\
    \ mouse inside'))\n    l.bind('<Leave>', lambda e: l.configure(text='Moved mouse\
    \ outside'))\n    l.bind('<1>', lambda e: l.configure(text='Clicked left mouse\
    \ button'))\n    l.bind('<Double-1>', lambda e: l.configure(text=\"Double clicked\"\
    ))\n    l.bind(\"<B3-Motion>\", lambda e: l.configure(text='right button drag\
    \ to %d,%d' % (e.x, e.y)))\n    root.mainloop()\n```\n\n前三个事件绑定非常简单，只是查看简单事件。双击绑定引入了事件修饰符的概念；在这种情况下，我们希望在左键单击（\"\
    1\"）上触发移动，但仅当它是双击（\"Double-\"）时。\n\n最后一个绑定也使用了修饰符：捕获鼠标移动（\"Motion\"），但仅当按住鼠标右键（\"\
    B3\"）时。这个绑定还展示了一个使用事件参数的示例，通过百分号替换实现。许多事件，如鼠标单击或移动，都有额外信息作为参数，例如鼠标当前位置。这些百分号替换允许你捕获这些信息，以便在你的脚本中使用它们。\n\
    \n> *Tkinter 期望你提供一个函数作为事件回调，其第一个参数是代表触发回调的事件的对象。对于本例中这样的一次性回调，通常不值得麻烦去定义常规的命名函数，所以我们使用了\
    \ Python 的匿名函数（lambda）。之前的英尺转米示例使用了一个常规的已定义函数（calculate）。*\n\n若要获取所有不同事件名称、修饰符以及每个事件可用的不同事件参数的完整描述，最佳参考资料是\
    \ \"bind\" 命令参考。\n\n## 虚拟事件\n\n除了像鼠标单击和窗口调整大小等低级操作系统事件外，许多控件会生成称为虚拟事件的高级事件。例如，无论是因为用户点击了某项、使用方向键移动到某项，还是其他原因，只要选择发生变化，列表框控件都会生成\
    \ \"ListboxSelect\" 虚拟事件。这避免了设置多个可能具有平台特定性的事件绑定来捕获变化的问题。控件的虚拟事件（如果有）将列在控件的文档中。\n\
    \n## 多个绑定\n\n控件实际上可以有多个不同的事件绑定针对单个事件触发。通常，事件可以设置为：控件本身、某类所有控件（例如按钮）、包含该控件的顶层窗口、以及应用程序中的所有控件。这些绑定将按顺序触发。\n\
    \n我们在示例中看到过这种情况，当时我们为顶层窗口设置了回车键的绑定，该绑定应用于该窗口内的每个控件。\n\n> *Tk 中每个控件类的默认行为本身是通过脚本级事件绑定定义的，因此可以对其进行内省和修改，以改变某类所有控件的行为。你甚至可以完全修改每个控件的这个多事件序列的处理方式；如果你感兴趣，请参见\
    \ \"bindtags\" 命令参考。*\n\n## 基本控件\n\n本章向你介绍 Tk 的基本控件，这些控件几乎在任何用户界面中都会用到：框架、标签、按钮、复选按钮、单选按钮、条目框和组合框。读完本章，你将知道如何使用任何典型的填写表单类型用户界面所需的所有控件。\n\
    \n本章（以及讨论更多控件的后续章节）应按顺序阅读。由于许多控件之间存在大量的共同点，我们会在较早的控件中引入某些概念，这些概念也适用于较后的控件。为了避免多次重复同样的内容，我们只会指回该概念首次被引入的地方。\n\
    \n同时，每个控件也会参考特定控件的控件汇总页面以及参考手册页面，因此你也可以自由地跳跃阅读。\n\n### 框架\n\n- 控件汇总\n- 参考手册\n\n\
    **框架**是一种仅显示为简单矩形的控件。框架主要用作其他控件的容器，这些容器由诸如 grid 等几何管理器控制。\n\n![](img/94378c1b05607c1dc5649c738af95c74_20_0.png)\n\
    \n使用 **ttk.Frame** 函数创建框架：\n`frame = ttk.Frame(parent)`\n\n框架可以接受多种不同的配置选项，这些选项可以改变其显示方式。\n\
    \n#### 请求尺寸\n\n与其他控件一样，创建后，框架通过（父级）几何管理器添加到用户界面。通常，框架向几何管理器请求的尺寸将由其中包含的控件（受管理框架内容的几何管理器控制）的尺寸和布局决定。\n\
    \n如果出于某种原因，你希望拥有一个不包含其他控件的空框架，你应该显式地使用 \"width\" 和/或 \"height\" 配置选项来设置框架向其父几何管理器请求的尺寸（否则你会得到一个确实非常小的框架）。\n\
    \n> *通常，宽度、高度等距离仅以屏幕上的像素数指定。你也可以通过一系列后缀来指定它们。例如，\"350\" 表示 350 像素，\"350c\" 表示\
    \ 350 厘米，\"350i\" 表示 350 英寸，而 350p 表示 350 打印机点（1/72 英寸）。*\n\n#### 填充\n\n\"padding\"\
    \ 配置选项用于请求控件内部周围的额外空间；这样，如果你在框架内放置其他控件，四周就会有一些边距。单个数字指定四周相同的填充，两个数字的列表允许你指定水平填充然后是垂直填充，四个数字的列表允许你指定左、上、右、下填充，按此顺序。\n\
    `frame[\"padding\"] = (5,10)`\n\n"
