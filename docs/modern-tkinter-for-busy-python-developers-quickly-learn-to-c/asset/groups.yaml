  mdcn: "\n你可以通过使用“文本”类型的项向画布添加文本。你可以完全控制字体、大小、颜色等，以及实际显示的文本。\n\n最有趣的是，你可以使用“窗口”类型的项将其他小部件（包括本身包含其他小部件的框架）嵌入到画布中。这样做时，画布实际上充当了这些小部件的几何管理器。这种能力为你的应用程序带来了各种可能性。\n\
    \n关于画布小部件，这里描述的只是冰山一角；请务必查阅参考手册，以及 Tk 发行版中包含的大量示例程序。\n\n## 文本\n\n- 小部件概览\n- 参考手册\n\
    \n**文本**小部件管理一个多行文本区域。与画布小部件一样，Tk 的文本小部件是一个极其灵活且强大的工具，可用于各种任务。文本小部件的一些示例用途包括：作为表单的一部分提供简单的多行文本区域、风格化的代码编辑器、大纲视图，甚至网页浏览器。文本小部件属于经典\
    \ Tk 小部件，而不是主题化 Tk 小部件。\n\n![](img/94378c1b05607c1dc5649c738af95c74_68_0.png)\n\
    \n使用 **Text** 函数创建文本小部件：\n\n```python\ntext = Text(parent, width=40, height=10)\n\
    ```\n\n虽然我们在前面的章节中简要介绍了文本小部件，但在这里我们将深入更多细节，让你了解它所能达到的复杂程度。不过，对于任何涉及文本小部件的重要工作，参考手册都组织得非常良好且实用。\n\
    \n### 基础概念\n\n如果你只是想使用文本小部件从用户那里获取简单的多行文本作为表单的一部分，你只需要关注以下几点：创建和调整小部件的大小（已勾选）、为表单中的文本提供初始值，以及在用户提交表单后检索小部件中的文本。\n\
    \n### 提供初始内容\n\n当你最初创建它时，文本小部件是空的，所以如果你想提供初始文本，你需要自己添加。与例如条目小部件不同，文本小部件不支持“*textvariable*”配置选项；如我们稍后将看到的，文本小部件可以包含比普通文本更多的内容，因此简单的变量不足以容纳所有内容。\n\
    \n相反，要为小部件设置初始文本，你需要使用小部件的“*insert*”方法：\n\n```python\ntext.insert(\"1.0\", \"\
    here is my text to insert\")\n```\n\n这里的 \"1.0\" 代表插入文本的位置，可以读作“第 1 行，第 0 个字符”。这指的是第一行的第一个字符；出于与程序员通常如何引用行和字符相关的历史惯例，行号是从\
    \ 1 开始计数的，而字符号是从 0 开始计数的。\n\n要插入的文本只是一个字符串。由于小部件可以容纳多行文本，你提供的字符串也可以是多行的。为此，只需在字符串的适当位置嵌入\
    \ \"\\n\"（换行符）即可。\n\n### 滚动\n\n水平滚动条和垂直滚动条都可以附加到文本小部件上。其工作原理与其他小部件（如列表框或画布）中使用滚动条完全相同。\n\
    \n你还可以要求小部件确保文本的特定部分可见。例如，如果你向小部件添加的文本超出了屏幕显示范围（因此需要滚动），但希望确保显示的是文本的顶部而不是底部，请调用\
    \ \"see\" 方法，并传入文本位置（例如 \"1.0\"）。\n\n### 控制换行\n\n如果小部件中某些行文本非常长，长于小部件的宽度怎么办？默认情况下，文本会直接换行到下一行，但是否以及如何换行可以通过\
    \ \"wrap\" 配置选项来控制。默认值是 \"char\"，意味着在行末的字符处立即换行；其他选项有 \"word\"，表示仅在单词边界（例如空格）处换行，以及\
    \ \"none\"，表示完全不换行。在后者情况下，除非你为小部件附加一个水平滚动条，否则部分文本将不可见。\n\n### 禁用小部件\n\n某些表单会在满足特定条件前（例如某些其他选项设置为特定值时）暂时禁用特定小部件的编辑功能。为了防止用户对文本小部件进行任何更改，将\
    \ \"state\" 配置选项设置为 \"disabled\"；通过将此选项设置回 \"normal\" 来重新启用编辑。\n\n### 检索文本\n\n\
    最后，在用户进行任何更改并提交表单后，你的程序将希望检索小部件的内容，这通过 \"get\" 方法完成：\n\n```python\ntexttext =\
    \ text.get('1.0', 'end')\n```\n\n### 在代码中修改文本\n\n虽然用户可以交互式地修改文本小部件中的文本，但你的程序也可以进行修改。添加文本是通过\
    \ \"insert\" 方法完成的，我们在上面用它为文本小部件提供了初始值。\n\n### 文本位置和索引\n\n当我们指定位置 \"1.0\"（第一行，第一个字符）时，这是索引的一个例子。它告诉\
    \ insert 方法在哪里插入新文本（就在第一行、第一个字符之前，即在小部件的最开始处）。有多种方式可以指定这些索引。你还见过另一个： \"end\"（来自\
    \ \"get\" 示例）意味着在文本结束后的紧接位置（“紧接”是因为文本插入发生在给定索引之前，所以在 \"end\" 处插入文本将把文本添加到小部件的末尾）。请注意，Tk\
    \ 始终会在文本小部件的最末尾添加一个换行符。\n\n以下是一些额外的索引示例及其含义：\n\n- `3.end`: 第 3 行末尾的换行符。\n- `1.0\
    \ + 3 chars`: 第 1 行开头之后 3 个字符的位置。\n- `2.end - 1 chars`: 第 2 行中换行符之前的最后一个字符。\n\
    - `end - 1 chars`: Tk 始终在文本末尾添加的那个换行符。\n- `end - 2 chars`: 文本的实际最后一个字符。\n- `end\
