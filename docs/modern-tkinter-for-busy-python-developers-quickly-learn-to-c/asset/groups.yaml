    有一些经典的 Tk 小部件，包括框架（frame）和顶层（toplevel）小部件，它们允许你在小部件创建时通过传递一个 "class" 配置选项来更改特定小部件的类。因此，虽然通常框架的类都是
    "Frame"，但你可以指定某个特定的框架小部件具有 "SpecialFrame" 这样的类。


    正因为如此，你可以使用选项数据库为不同类型的框架小部件定义不同的外观（不仅仅是所有框架小部件，也不仅仅是位于层次结构中特定位置的框架小部件）。


    Tk 所做的，就是将这个简单的想法加上火箭推进器，使其威力大增。


    ## 小部件状态


    小部件状态允许单个小部件具有多种外观或行为，这取决于诸如鼠标位置、应用程序设置的不同状态选项等因素。在经典 Tk 中，某些小部件具有 "state" 配置选项，允许你将它们设置为
    "normal"（正常）或 "disabled"（禁用）；例如，按钮的 "disabled" 状态会将其标签置灰。有些小部件还使用了额外的状态 "active"（活动），同样代表不同的行为。


    小部件本身，或者更常见的是小部件的类绑定，控制了小部件在不同状态下外观的变化方式，通常是通过查询 "foreground"（前景色）、"activeforeground"（活动前景色）和
    "disabledforeground"（禁用前景色）等小部件配置选项来实现的。


    Tk 再次扩展并泛化了小部件状态这一基本概念，主要体现在两个方面。首先，状态选项不再特定于某种小部件，而是所有 Tk 小部件都具有状态选项，实际上，它们都拥有完全相同的状态选项，并通过
    "state" 和 "instat" 小部件命令来访问。


    Tk 小部件的状态实际上是一组独立的状态标志，包含以下标志中的零个或多个："active"（活动）、"disabled"（禁用）、"focus"（焦点）、"pressed"（按下）、"selected"（选中）、"background"（背景）、"readonly"（只读）、"alternate"（交替）或
    "invalid"（无效）（具体含义请参见参考手册中的小部件页面）。


    请注意，虽然所有这些小部件状态标志都可用于每个小部件，但并非每个小部件都会使用它们。例如，标签（label）小部件很可能会忽略 "invalid" 状态标志，因此不会与该标志关联任何特殊的外观。


    Tk 所做的第二个重大改变是，它将“当状态调整时改变什么”的决定权从小部件的控制中剥离出来。也就是说，小部件开发者不再需要硬编码像“当状态为禁用时，查询 disabledforeground
    配置选项并将其用作前景色”这样的逻辑。硬编码这种逻辑不仅使小部件的代码更长（且更具重复性），还限制了小部件基于其状态可被修改的方式。也就是说，如果小部件开发者没有编写在状态改变时改变字体的逻辑，那么作为小部件的使用者你就无能为力了。


    相反，Tk 不再在每个小部件内部硬编码这些决定，而是将它们转移到一个独立的位置：样式（styles）。这意味着小部件开发者不需要为每种可能的外观选项提供代码，这不仅简化了小部件，而且从另一个角度看，它确保了可以设置更广泛的外观，包括那些小部件开发者可能未曾预料到的。


    ## 样式


    由此我们可以定义小部件样式。非常简单地说，样式描述了 Tk 小部件类的外观（或多种外观）。使用该类创建的所有小部件都将具有相同的外观。虽然每个主题小部件都有一个默认类（例如
    "ttk.Button" 小部件的类为 "Button"），但你可以不像在经典 Tk 中那样，为你创建的任何主题小部件分配不同的类。这是通过使用 Tk 的
    "style" 配置选项完成的，所有主题小部件都支持此选项。


    因此，样式定义了某个小部件类的小部件的常规外观，但也可以定义依赖于当前状态标志的外观变体。因此，例如，样式可以指定当设置 "pressed" 状态标志时，外观应以特定方式改变。由于这一特性，样式可以根据状态描述小部件的一种或多种外观方式。


    本章其余部分将深入探讨样式的更多细节，但至少现在你已经知道它的职责了。


    ## 主题


    你可以将主题视为一组样式的集合。虽然每个样式都是针对特定小部件的（一个用于按钮，一个用于输入框等），但主题会将许多样式收集在一起。通常，主题会为每种类型的小部件定义一个样式，但这些样式的设计旨在使它们在视觉上相互“契合”——尽管遗憾的是，Tk
    在技术上并没有限制糟糕的设计或判断！


    在应用程序中使用特定主题，实际上就是表达你希望定义一组样式，使得默认情况下所有不同类型的小部件都具有一些共同的外观，并且彼此搭配良好。


    ## 使用样式和主题


    现在我们知道样式和主题的用途了，但具体如何使用它们呢？为此，我们需要了解如何引用样式和主题，以及如何将它们应用到小部件或用户界面中。


    ### 样式名称


    每个样式都有一个名称。如果你要修改样式、创建新样式或为小部件使用样式，你需要知道它的名称。


    如何知道样式的名称？如果你有一个特定的小部件，想知道它当前使用的样式，你可以首先检查其 "style" 配置选项的值。如果该值为空，则表示该小部件使用的是该小部件的默认样式。你可以通过小部件的类来获取该默认样式。例如：


    ```python

    >>> b = ttk.Button()

    >>> b[''style'']

    ''''

    >>> b.winfo_class()

    ''TButton''

    ```


    在这种情况下，正在使用的样式是 "TButton"。其他主题小部件的默认样式命名方式类似，例如 "TEntry"、"TLabel"、"TSizeGrip"
    等。不过，检查具体情况总是明智的；例如，树形视图（treeview）小部件的类是 "Ttreeview"，而不是 "TTtreeview"。


    除了默认样式外，样式可以命名为几乎任何名字。你可能会创建自己命名的样式（或使用包含该样式的主题），名为 "FunButton"、"NuclearReactorButton"，甚至是
    "GuessWhatIAm"（这不是一个明智的选择）。更常见的是，你会看到像 "Fun.TButton" 或 "NuclearReactor.TButton"
    这样的名称，它们暗示了基于基础样式的变体；你会发现，这是 Tk 在创建和修改样式时所支持的一种机制。


    > 目前不支持获取所有当前可用样式列表的功能。


    ### 使用样式


    使用样式意味着将该样式应用于单个小部件。如果你知道想要使用的样式名称以及要应用样式的小部件，那么操作很简单。在创建时设置样式：


    ```python

    b = ttk.Button(parent, text=''Hello'', style=''Fun.TButton'')

    ```


    此外，在创建小部件后的任何时间，你都可以通过 "style" 配置选项更改小部件的样式：


    ```python

    b[''style''] = ''NuclearReactor.TButton''

    ```


    ### 使用主题


    虽然样式控制单个小部件的外观，但主题控制整个用户界面的外观。在主题之间切换是主题小部件的重要功能之一。


    与样式类似，主题也是通过名称来识别的。你可以获取所有可用主题的名称：


    ```python

    >>> s = ttk.Style()

    >>> s.theme_names()

    (''aqua'', ''step'', ''clam'', ''alt'', ''default'', ''classic'')

    ```


    任何时刻只能有一个主题处于活动状态。要获取当前使用主题的名称，可以使用以下代码：


    > 此 API 最初是为 Tk 8.6 设计的，但已回溯移植到 Tk 8.5.9。如果你使用的是更早版本的 Tk，获取此信息稍微复杂一些。


    ```python

    >>> s.theme_use()

    ''aqua''

    ```


    切换到新主题可以通过以下方式完成：


    ```python

    s.theme_use(''themename'')

    ```


    这实际上做了什么？显然，它将当前主题设置为指定的主题。因此，这样做会用主题定义的样式集合替换当前可用的所有样式。最后，它会刷新所有小部件，使它们呈现新主题所描述的外观。


    ## 样式内部结构


    如果你只是想使用样式，那么你现在已经知道所需的一切了。但是，如果你想创建自己的样式或修改现有样式，事情就变得“有趣”了。


    ## 元素


    虽然每个样式代表一个小部件，但每个小部件通常由更小的部分组成，称为元素。样式作者的工作就是利用这些更小的元素构建整个小部件。这些元素是什么取决于小部件。


    以下是一个按钮的示例。它可能在外围有一个边框，这是一个元素。紧挨着边框内部可能有一个焦点环，它通常只是背景色，但当事用选项键切换到按钮时可能会高亮显示。这是第二个元素。然后，焦点环和按钮标签之间可能有一些间距，这个间距是第三个元素。最后，按钮自身的标签是第四个元素。


    ![](img/94378c1b05607c1dc5649c738af95c74_80_0.png)

