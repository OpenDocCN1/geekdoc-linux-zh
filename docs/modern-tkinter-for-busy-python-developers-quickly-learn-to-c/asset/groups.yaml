    # Entry


    +   - Widget Roundup

    +   - Reference Manual


    An **entry** represents the user with a single line text field that they can use
    to type in a string value. These can be just about anything: their name, a city,
    a password, social security number, and so on.


    ![](img/94378c1b05607c1dc5649c738af95c74_27_0.png)


    Entries are created using the **tk.Entry** function:


    ```

    username = StringVar()

    name = tk.Entry(parent, textvariable=username)

    ```


    A "width" configuration option may be specified to provide the number of characters
    wide the entry should be, allowing you for example to provide a shorter entry
    for a zip or postal code.


    We''ve seen how checkbutton and radiobutton widgets have a value associated with
    them. Entries do as well, and that value is normally accessed through a linked
    variable specified by the "textvariable" configuration option. Note that unlike
    the various buttons, entries don''t have a separate text or image beside them
    to identify them; use a separate label widget for that.


    You can also get or change the value of the entry widget directly, without going
    through the linked variable. The "get" method returns the current value, and the
    "delete" and "insert" methods let you change the contents, e.g.


    ```

