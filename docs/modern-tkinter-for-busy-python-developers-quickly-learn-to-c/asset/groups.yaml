    \ to it, each showing another new feature of canvas widgets. Towards the end of\
    \ the chapter, we'll then cover some of the other major features not illustrated\
    \ in the example.\n\n### Creating Items\n\nWhen you create a new canvas widget,\
    \ it will essentially be a large rectangle with nothing on it; truly a blank canvas\
    \ in other words. To do anything useful with it, you'll need to add items to it.\
    \ As mentioned, there are a wide variety of different types of items you can add.\
    \ Here, we'll look at adding a simple line item to the canvas.\n\nTo create a\
    \ line, the one piece of information you'll need to specify is where the line\
    \ should be. This is done by using the coordinates of the starting and ending\
    \ point, expressed as a list of the form x0 y0 x1 y1. The origin (0,0) is at the\
    \ top left corner of the canvas, with the x value increasing as you move to the\
    \ right, and the y value increasing as you move down. So to create a line from\
    \ (10,10) to (200,50), we'd use this code:\n\n```python\ncanvas.create_line(10,\
    \ 10, 200, 50)\n```\n\nThe `create_line` method will return an item id (an integer)\
    \ that can be used to uniquely refer to this item; every item created will get\
    \ its own id. Though often we don't need to refer to the item later and will therefore\
    \ ignore the returned id, we'll see how it can be used shortly.\n\nLet's start\
    \ our simple sketchpad example. For now, we'll want to be able to draw freehand\
    \ on the canvas by dragging the mouse on it. We'll create a canvas widget, and\
    \ then attach event bindings to it to capture mouse clicks and drags. When we\
    \ first click the mouse, we'll remember that location as our \"start\" position.\
    \ Every time the mouse is moved with the mouse button still held down, we'll create\
    \ a line item going from this \"start\" position to the current mouse position.\
    \ The current position will then be the \"start\" position for the next line segment.\n\
    \n```python\nfrom tkinter import *\nfrom tkinter import ttk\n\nlastx, lasty =\
    \ 0, 0\n\ndef xy(event):\n    global lastx, lasty\n    lastx, lasty = event.x,\
    \ event.y\n\ndef addLine(event):\n    global lastx, lasty\n    canvas.create_line((lastx,\
    \ lasty, event.x, event.y))\n    lastx, lasty = event.x, event.y\n\nroot = Tk()\n\
    root.columnconfigure(0, weight=1)\nroot.rowconfigure(0, weight=1)\n\ncanvas =\
    \ Canvas(root)\ncanvas.grid(column=0, row=0, sticky=(N, W, E, S))\ncanvas.bind(\"\
    <Button-1>\", xy)\ncanvas.bind(\"<B1-Motion>\", addLine)\n\nroot.mainloop()\n\
    ```\n\nTry it out - drag the mouse around the canvas to create your masterpiece.\n\
    \n### Item Attributes\n\nWhen creating items, you can also specify one or more\
    \ attributes for the item, that will affect how it is displayed. For example,\
    \ here we'll specify that the line should be red, and three pixels wide.\n\n```python\n\
    canvas.create_line(10, 10, 200, 50, fill='red', width=3)\n```\n\nThe exact set\
    \ of attributes will vary according to the type of item.\n\nLike with Tk widgets,\
    \ changing attributes for canvas items after you've already created them can also\
    \ be done.\n\n```python\nid = canvas.create_line(0, 0, 10, 10, fill='red')\n...\n\
    canvas.itemconfigure(id, fill='blue', width=2)\n```\n\n### Bindings\n\nWe've already\
    \ seen that the canvas widget as a whole, like any other Tk widget, can capture\
    \ events using the \"bind\" command.\n\nYou can also attach bindings to individual\
    \ items in the canvas (or groups of them, as we'll see in the next section using\
    \ tags). So if you want to know whether or not a particular item has been clicked\
    \ on, you don't need to watch for mouse click events for the canvas as a whole,\
    \ and then figure out if that click happened on your item. Tk will take care of\
    \ all this for you.\n\nTo capture these events, you use a bind command built into\
    \ the canvas. It works exactly like the regular bind command, taking an event\
    \ pattern and a callback. The only difference is you specify the canvas item this\
    \ binding applies to.\n\n```python\ncanvas.tag_bind(id, '<1>', ...)\n```\n\n>\
    \ Note the difference between the item-specific “tag_bind” method, and the widget-level\
    \ “bind” method.\n\nLet's add some code to our sketchpad example to allow changing\
    \ the drawing color. We'll first create a few different rectangle items, each\
    \ filled with a different color. Creating rectangle items is just like creating\
    \ line items, where you'll specify the coordinates of two diagonally opposite\
    \ corners. We'll then attach a binding to each of these so that when they're clicked\
    \ on, they'll set a global variable to the color to use. Our mouse motion binding\
    \ will look at that variable when creating the line segments.\n\n```python\ncolor\
    \ = \"black\"\ndef setColor(newcolor):\n    global color\n    color = newcolor\n\
    \ndef addLine(event):\n    global lastx, lasty\n    canvas.create_line((lastx,\
    \ lasty, event.x, event.y), fill=color)\n    lastx, lasty = event.x, event.y\n\
    \nid = canvas.create_rectangle((10, 10, 30, 30), fill=\"red\")\ncanvas.tag_bind(id,\
    \ \"<Button-1>\", lambda x: setColor(\"red\"))\nid = canvas.create_rectangle((10,\
    \ 35, 30, 55), fill=\"blue\")\ncanvas.tag_bind(id, \"<Button-1>\", lambda x: setColor(\"\
    blue\"))\nid = canvas.create_rectangle((10, 60, 30, 80), fill=\"black\")\ncanvas.tag_bind(id,\
    \ \"<Button-1>\", lambda x: setColor(\"black\"))\n```\n\n### Tags\n\nWe've seen\
    \ that every canvas item has a unique id number, but there is another very useful\
    \ and powerful way to refer to items on a canvas, and that is using tags.\n\n\
    A tag is just an identifier of your creation, something meaningful to your program.\
    \ You can attach tags to canvas items; each item can have any number of tags.\
    \ Unlike item id numbers, which are unique for each item, many items can have\
    \ the same tag.\n\nWhat can you do with tags? We saw that you can use the item\
    \ id to modify a canvas item (and we'll see soon there are other things you can\
    \ do to items, like move them around, delete them, etc.). Any time you can use\
    \ an item id, you can use a tag. So for example, you can change the color of all\
    \ items having a specific tag.\n\nTags are a good way to identify certain types\
    \ of items in your canvas (items that are part of a drawn line, items that are\
    \ part of the palette, etc.). You can use tags to correlate canvas items to particular\
    \ objects in your application (so for\n"
  mdcn: "\n## 字体描述\n\n“family”（字体族）指定字体名称；Courier、Times 和 Helvetica 的名称保证受支持（并映射到合适的等宽、衬线或无衬线字体），但也可以使用系统中安装的其他字体（同样，务必注意确保该字体存在，否则系统将提供不同的字体，这可能并不一定是最佳匹配）。您可以使用以下命令获取所有可用字体的名称：\n\
    \nfont.families()\n\n“size”（字号）选项以磅（points）为单位指定字体大小。“weight”（字重）选项可以是 **bold**（粗体）或\
    \ normal（常规）。您可以指定“slant”（倾斜度）为 roman（常规）或 *italic*（斜体）。最后，布尔选项“underline”（下划线）和“overstrike”（删除线）也可用。\n\
    \n可以使用与更改小部件配置选项相同的机制来检查或更改这些选项的当前设置（例如 configure）。\n\n另一种指定字体的方式是使用属性列表，以字体名称开头，然后可选地包含字号，以及可选的一个或多个样式选项。一些示例包括\
    \ \"Helvetica\"、\"Helvetica 12\"、\"Helvetica 12 bold\" 和 \"Helvetica 12 bold italic\"\
    。这些字体描述随后用作“font”配置选项的值，而不是预定义或命名字体。\n\n> 一般来说，建议从字体描述切换到命名字体，以便再次将字体差异隔离在程序中的一个位置。\n\
    \n## 颜色\n\n与字体一样，有各种方式可以指定颜色。完整细节可以在颜色命令参考中找到。\n\n一般来说，系统将为大多数内容提供正确的颜色。与字体类似，Mac\
    \ 和 Windows 都指定了大量系统特定的颜色名称（参见参考手册），其实际颜色可能取决于系统设置（例如文本高亮颜色、默认背景）。\n\n您也可以通过 RGB\
    \ 指定颜色，就像在 HTML 中一样，例如 \"#3FF\" 或 \"#FF016A\"。最后，Tk 识别 X11 定义的一组颜色名称；通常这些名称不使用，除非是一些非常常见的名称，如\
    \ \"red\"（红色）、\"black\"（黑色）等。\n\n对于主题化的 Tk 小部件，颜色通常用于定义应用于小部件的样式，而不是直接对应用颜色到小部件上。\n\
    \n可能不用说也明白，在颜色的使用上通常应当有所节制。\n\n## 图像\n\n我们已经看到过使用图像的基本方法，例如在标签或按钮中显示它们。我们创建图像对象，通常是从磁盘上的文件创建。\n\
    \n```python\nimgobj = PhotoImage(file=\"myimage.gif\")\nlabel[\"image\"] = imgobj\n\
    ```\n\n开箱即用，Tk 支持 GIF 和 PPM/PNM 图像。然而，有一个名为 \"Img\" 的 Tk 扩展库，它为许多其他格式添加了支持：BMP、XBM、XPM、PNG、JPEG、TIFF\
    \ 等。虽然 Img 没有直接包含在 Tk 核心中，但它通常与其他打包分发版一起包含（例如 ActiveTcl）。\n\nPYTHONTODO\n\nTk\
    \ 的图像实际上非常强大且复杂，提供了多种检查和修改图像的方式。您可以从图像命令参考和照片命令参考中了解更多内容。\n\n> *我们在这里看到的这种多色图像类型在\
    \ Tk 中被称为照片图像。Tk 还提供了另一种类型的图像，即双位位图图像，它们在 90 年代被广泛使用，当时大多数 Unix 工作站使用相当大的（与个人电脑相比）显示器，但它们的图像只有黑白。不用说，如今彩色是标配，因此强烈建议将图标等更新为全彩图像。*\n\
    \n## 画布\n\n- 小部件概览\n- 参考手册\n\n**画布**（canvas）小部件管理一个 2D 图形对象集合——线条、圆形、图像、其他小部件等。Tk\
    \ 的画布是一个极其强大且灵活的小部件，无疑是 Tk 的亮点之一。它适用于广泛的应用，包括绘图或制图、CAD 工具、显示或监控模拟或实际设备，以及用简单组件构建更复杂的小部件。画布小部件属于经典\
    \ Tk 小部件，而非主题化 Tk 小部件。\n\n![](img/94378c1b05607c1dc5649c738af95c74_62_0.png)\n\
    \n画布小部件使用 **Canvas** 函数创建：\n\n```python\ncanvas = Canvas(parent)\n```\n\n由于画布小部件拥有大量功能，我们无法在此涵盖所有内容。我们将做的是采取一个相当简单的示例（一个自由手绘工具），并逐步添加新的部分，每一部分展示画布小部件的另一个新功能。在章节末尾，我们将介绍示例中未展示的一些其他主要功能。\n\
    \n### 创建项目\n\n当您创建一个新的画布小部件时，它基本上是一个空无一物的大矩形；换句话说，这是一张真正的空白画布。要对它做任何有用的事情，您需要向其中添加项目。如前所述，您可以添加多种不同类型的项目。这里，我们将看看如何向画布添加一条简单的线条项目。\n\
    \n要创建线条，您需要指定的唯一信息是线条的位置。这是通过使用起点和终点的坐标完成的，表示为 x0 y0 x1 y1 形式的列表。原点 (0,0) 位于画布的左上角，x\
    \ 值向右移动时增加，y 值向下移动时增加。因此，要创建一条从 (10,10) 到 (200,50) 的线，我们将使用以下代码：\n\n```python\n\
    canvas.create_line(10, 10, 200, 50)\n```\n\n`create_line` 方法将返回一个项目 id（一个整数），可用于唯一地引用此项目；每个创建的项目都会获得自己的\
    \ id。虽然通常我们不需要稍后引用该项目，因此会忽略返回的 id，但我们很快就会看到它如何被使用。\n\n让我们开始我们的简单素描板示例。目前，我们希望能够在画布上通过拖动鼠标进行自由绘图。我们将创建一个画布小部件，然后为其附加事件绑定以捕获鼠标点击和拖动。当我们第一次点击鼠标时，我们会将该位置记住为“start”（起始）位置。每次鼠标在保持按钮按下的情况下移动时，我们都会创建一条从该“start”位置到当前鼠标位置的线条项目。当前位置随后将成为下一条线段段的“start”位置。\n\
    \n```python\nfrom tkinter import *\nfrom tkinter import ttk\n\nlastx, lasty =\
    \ 0, 0\n\ndef xy(event):\n    global lastx, lasty\n    lastx, lasty = event.x,\
    \ event.y\n\ndef addLine(event):\n    global lastx, lasty\n    canvas.create_line((lastx,\
    \ lasty, event.x, event.y))\n    lastx, lasty = event.x, event.y\n\nroot = Tk()\n\
    root.columnconfigure(0, weight=1)\nroot.rowconfigure(0, weight=1)\n\ncanvas =\
    \ Canvas(root)\ncanvas.grid(column=0, row=0, sticky=(N, W, E, S))\ncanvas.bind(\"\
    <Button-1>\", xy)\ncanvas.bind(\"<B1-Motion>\", addLine)\n\nroot.mainloop()\n\
    ```\n\n试一试 - 在画布上拖动鼠标以创建您的杰作。\n\n### 项目属性\n\n在创建项目时，您还可以指定一个或多个项目的属性，这将影响其显示方式。例如，这里我们将指定线条应为红色，且宽度为三个像素。\n\
    \n```python\ncanvas.create_line(10, 10, 200, 50, fill='red', width=3)\n```\n\n\
    确切的属性集将根据项目类型而变化。\n\n与 Tk 小部件一样，在您已经创建画布项目后，也可以更改其属性。\n\n```python\nid = canvas.create_line(0,\
    \ 0, 10, 10, fill='red')\n...\ncanvas.itemconfigure(id, fill='blue', width=2)\n\
    ```\n\n### 绑定\n\n我们已经看到，画布小部件作为一个整体，就像其他任何 Tk 小部件一样，可以使用“bind”命令捕获事件。\n\n您还可以将绑定附加到画布中的单个项目（或项目组，我们将在下一节中使用标签看到这一点）。因此，如果您想知道某个特定项目是否被点击，您不需要监视整个画布的鼠标点击事件，然后判断该点击是否发生在您的项目上。Tk\
    \ 会为您处理所有这些。\n\n要捕获这些事件，您使用画布内置的 bind 命令。它的工作方式与普通 bind 命令完全相同，接受事件模式和回调函数。唯一的区别在于您指定该绑定适用的画布项目。\n\
    \n```python\ncanvas.tag_bind(id, '<1>', ...)\n```\n\n> 请注意项目特定的 “tag_bind” 方法与小部件级别的\
    \ “bind” 方法之间的区别。\n\n让我们向我们的素描板示例中添加一些代码，以允许更改绘图颜色。我们将首先创建几个不同的矩形项目，每个填充不同的颜色。创建矩形项目就像创建线条项目一样，您只需指定两个对角顶点的坐标。然后我们将为每个矩形附加一个绑定，这样当它们被点击时，会将一个全局变量设置为要使用的颜色。我们的鼠标移动绑定在创建线段时会查看该变量。\n\
    \n```python\ncolor = \"black\"\ndef setColor(newcolor):\n    global color\n  \
    \  color = newcolor\n\ndef addLine(event):\n    global lastx, lasty\n    canvas.create_line((lastx,\
    \ lasty, event.x, event.y), fill=color)\n    lastx, lasty = event.x, event.y\n\
    \nid = canvas.create_rectangle((10, 10, 30, 30), fill=\"red\")\ncanvas.tag_bind(id,\
    \ \"<Button-1>\", lambda x: setColor(\"red\"))\nid = canvas.create_rectangle((10,\
    \ 35, 30, 55), fill=\"blue\")\ncanvas.tag_bind(id, \"<Button-1>\", lambda x: setColor(\"\
    blue\"))\nid = canvas.create_rectangle((10, 60, 30, 80), fill=\"black\")\ncanvas.tag_bind(id,\
    \ \"<Button-1>\", lambda x: setColor(\"black\"))\n```\n\n### 标签\n\n我们已经看到每个画布项目都有一个唯一的\
    \ id 号码，但还有另一种非常有用且强大的方式引用画布上的项目，那就是使用标签（tags）。\n\n标签只是您创建的标识符，对您的程序具有某种意义。您可以将标签附加到画布项目上；每个项目可以有任何数量的标签。与项目\
    \ id 号码不同（每个项目都是唯一的），许多项目可以拥有相同的标签。\n\n您可以使用标签做什么？我们看到了可以使用项目 id 来修改画布项目（并且我们很快就会看到还有其他事情可以做，比如移动项目、删除项目等）。在任何可以使用项目\
    \ id 的地方，都可以使用标签。因此，例如，您可以更改所有具有特定标签的项目的颜色。\n\n标签是识别画布中特定类型项目的好方法（属于绘制线条的项目、属于调色板的项目等）。您可以使用标签将画布项目与应用程序中的特定对象关联起来（因此\n\
    \n"
