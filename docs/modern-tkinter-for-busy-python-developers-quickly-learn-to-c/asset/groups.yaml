  - '[PAGE 66]


    # # Modifying Items


    You''ve seen how you can modify the configuration options on an item — its color,
    width and so on. There are a number of other things you can do items.


    To delete items, use the "**delete**" method. To change an item''s size and position,
    you can use the "**coords**"method; this allows you to provide new coordinates
    for the item, specified the same way as when you first created the item. Calling
    this method without a new set of coordinates will return the current coordinates
    of the item. To move one or more items by a particular horizontal or vertical
    amount from their current location, you can use the "**move**" method.


    All items are ordered from top to bottom in what''s called the stacking order.
    If an item later in the stacking order overlaps the coordinates of an item below
    it, the item on top will be drawn on top of the lower item. The "**raise**" and
    "**lower**" methods allow you to adjust an item''s position in the stacking order.


    There are several more operations described in the reference manual page, both
    to modify items and to retrieve additional information about them.


    # # Scrolling


    In many applications, you''ll want the canvas to be larger than what appears on
    the screen. You can attach horizontal and vertical scrollbars to the canvas in
    the usual way, via the "**xview**" and "**yview**" methods.


    As far as the size of the canvas, you can specify both how large you''d like it
    to be on screen, as well as what the full size of the canvas is, which would require
    scrolling to see. The "**width**" and "**height**" configuration options for the
    canvas widget will request the given amount of space from the geometry manager.
    The "**scrollregion**" configuration option (e.g. "0 0 1000 1000") tells Tk how
    large the canvas surface is.


    You should be able to modify the sketckpad program to add scrolling, given what
    you already know. Give it a try.


    Once you''ve done that, scroll the canvas down just a little bit, and then try
    drawing. You''ll see that the line you''re drawing appears above where the mouse
    is pointing! Surprised?


    What''s going on is that the global "**bind**" command doesn''t know that the
    canvas is scrolled (it doesn''t know the details of any particular widget). So
