    In text widgets by contrast, it''s not the individual characters that retain the
    state information about appearance, but tags, which are objects in their own right.
    So in this snippet, the newly added text will be colored red.


    ```

    ```python

    text.insert(''end'', ''first text'', (''important''))

    text.tag_configure(''important'', foreground=''red'')

    text.insert(''end'', ''second text'', (''important''))

    ```

