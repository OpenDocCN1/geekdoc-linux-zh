    Scrolling works the same way as in listboxes. The “xscrollcommand” and “yscrollcommand”
    configuration options are available to attach the text widget to horizontal and/or
    vertical scrollbars, and the “xview” and “yview” methods are available to be called
    from scrollbars. To ensure that a given line is visible (i.e. not scrolled out
    of view), you can use the “see index” method, where index is in the form “line
    number.character number”, e.g. “5.0” for the first (0-based) character of line
    5 (1-based).


    # Contents


    Text widgets do not have a linked variable associated with them, like for example
    entry widgets do. To retrieve the text content for the entire widget, call the
    method “get 1.0 end”; the “1.0” is an index into the text, and means the first
    character of the first line, and “end” is a shortcut for the index of the last
    character, last line. Other indices could be passed to retrieve smaller ranges
    of text if needed.


    Text can be added to the widget using the “insert index string” method; again
    index is in the form“line.char” and marks the character before which text is inserted;
    use “end” to add text to the end of the widget. You can delete a range of text
    using the “delete start end” method, where both start and end are text indices
    as already described.


    We''ll get into the text widget''s many additional advanced features in a later
    chapter.


    # Progressbar


    +   * Widget Roundup

    +   * Reference Manual


    A **progressbar** widget provides a way to give feedback to the user about the
    progress of a lengthy operation. This may be done either as a percentage complete
    display for operations where this can be estimated, or a display that changes
    to indicate the operation is continuing, but without an estimate of completion.


    ![](img/94378c1b05607c1dc5649c738af95c74_42_0.png)


    Progressbar widgets are created using the **tk.ttk.Progressbar** class:


    ```python

    p = ttk.Progressbar(parent, orient=HORIZONTAL, length=200, mode=''determinate'')

    ```


    The “orient” option may be either “horizontal” or “vertical”. The “length” option,
    which represents the longer axis of either horizontal or vertical progressbars,
    is specified in screen units (e.g. pixels). The “mode”configuration option can
    be set to either “determinate”, where the progressbar will indicate relative progress
    towards completion, or to “indeterminate”, where its not possible to know how
    far along in the task the program is, but we still want to provide feedback that
    things are still running.'
