    # ## Events and Bindings


    One quite cool thing is that you can define event bindings on tags. That allows
    you to do things like easily recognize mouse clicks just on particular ranges
    of text, and popup up a menu or dialog in response. Different tags can have different
    bindings, so it saves you the hassle of sorting out questions like "What does
    a click at this location mean?". Bindings on tags are implemented using the "tag
    bind" method.


    ```

    ```python

    text.tag_bind(''important'', ''<1>'', popupImportantMenu)

    ```

    ```


    Widget-wide binding to events works as it does for every other widget. Besides
    the normal low-level events, there are also two virtual events that will be generated:
    <Modified> whenever a change is made to the content of the widget, and <Selection>
    whenever there is a change made to which text is selected.


    # ## Selecting Text


    Your program may want to know if a range of text has been selected by the user,
    and if so, what that range is. For example, you may have a toolbar button to bold
    the selected text in an editor. While you can tell when the selection has changed
    (e.g. to update whether or not the bold button is active) via the <Selection>
    virtual event, that doesn''t tell you what has been selected.


    The text widget automatically maintains a tag named "sel", which refers to the
    selected text. Whenever the selection changes, the "sel" tag will be updated.
    So you can find the range of text selected using the "tag ranges" method, passing
    it "sel" as the tag to report on.'
