    # Organizing Complex Interfaces


    If you have a large user interface, you’ll need to find ways to organize it in
    ways that don’t overwhelm your users with the complexity. There are a number of
    different approaches to doing this; again, both general and platform specific
    human interface guidelines are a good resource when deciding.


    Note when we’re talking about complexity in this chapter, it’s not the underlying
    technical complexity of how the program is put together, but how it’s presented
    to the user. A user interface can be pulled together from many different modules,
    be built up from multiple canvas widgets and deeply nested frames, but that doesn’t
    necessarily mean the user perceives it to be complex.


    # Multiple windows


    One of the benefits of using multiple windows in an application can be to simplify
    the user interface, by requiring the user to focus only on the contents of one
    window at a time (requiring them to focus on or switch between several windows
    can also have the opposite effect). Similarly, showing only the widgets that are
    relevant for the current task (via grid) can help simplify the user interface.


    # White space


    If you do need to display a large number of widgets onscreen at the same time,
    you have to think about how to organize them visually. You’ve seen how grid can
    help by making it easy to align widgets with each other. White space is another
    useful aid. Placing related widgets quite close to each other (possible with an
    explanatory label immediately above) and separated from other less-related widgets
    by white space helps the user organize the user interface in their own mind.


    > The amount of white space around different widgets, between groups of widgets,
    around borders and so on is highly platform specific. While you can do an adequate
    job without worrying about exact pixel numbers, if you want a highly polished
    user interface, you’ll need to tune this for each platform.


    # Separator


    +   * Widget Roundup

    +   * Reference Manual


    A second approach to grouping widgets in one display is to place a thin horizontal
    or vertical rule between groups of widgets; often this can be more space efficient
    than using white space, which may be relevant for a tight display. Tk provides
    a very simple separator widget for this purpose.'
  md: "\n## Stacking Order\n\nStacking order refers to the order that windows are\
    \ \"placed\" on the screen, from bottom to top. When the positions of two windows\
    \ overlap each other, the one closer to the top of the stacking order will obscure\
    \ or overlap the one lower in the stacking order.\n\nYou can obtain the current\
    \ stacking order, a list from lowest to highest, via:\n\n```python\nroot.tk.eval('wm\
    \ stackorder ' + str(window))\n```\n\n> This method doesn't appear to be exposed\
    \ cleanly through Tkinter's API.\n\nYou can also just check if one window is above\
    \ or below another:\n\n```python\nif (root.tk.eval('wm stackorder ' + str(window)\
    \ + ' isabove ' + str(otherwindow)) == 1):\n    ...\nif (root.tk.eval('wm stackorder\
    \ ' + str(window) + ' isbelow ' + str(otherwindow)) == 1):\n    ...\n```\n\nYou\
    \ can also raise or lower windows, either to the very top (bottom) of the stacking\
    \ order, or just above (below) a designated window:\n\n```python\nwindow.lift()\n\
    window.lift(otherwin)\nwindow.lower()\nwindow.lower(otherwin)\n```\n\n> Tkinter\
    \ uses the name 'lift'; since 'raise' is a reserved keyword.\n\nWondering why\
    \ you needed to pass a window to get the current stacking order? It turns out\
    \ that stacking order, raise and lower, etc. work not only for toplevel windows,\
    \ but with any \"sibling\" widgets (those having the same parent). So if you have\
    \ several widgets gridded together but overlapping, you can raise and lower them\
    \ relative to each other. For example:\n\n```python\nfrom tkinter import *\nfrom\
    \ tkinter import ttk\n\nroot = Tk()\nlittle = ttk.Label(root, text=\"Little\"\
