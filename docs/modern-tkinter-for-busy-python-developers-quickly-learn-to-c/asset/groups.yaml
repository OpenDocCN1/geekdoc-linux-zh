    Checkbuttons use many of the same options as regular buttons, but add a few more.
    The "text", "textvariable", "image", and "compound" options control the display
    of the label (next to the check box itself), and the "state" and "instat" methods
    allow you to manipulate the "disabled" state flag to enable or disable the checkbutton.
    Similarly, the "command" option lets you specify a script to be called everytime
    the user toggles the checkbutton, and the "invoke" method will also execute the
    same callback.


    # ## Widget Value


    Unlike buttons, checkbuttons also hold a value. We''ve seen before how the "textvariable"
    option can be used to tie the label of a widget to a variable in your program;
    the "variable" option for checkbuttons behaves similarly, except it is used to
    read or change the current value of the widget, and updates whenever the widget
    is toggled. By default, checkbuttons use a value of "1" when the widget is checked,
    and "0" when not checked, but these can be changed to just about anything using
    the "onvalue" and "ofvalue" options.


    What happens when the linked variable contains neither the on value or the off
    value (or even doesn''t exist)? In that case, the checkbutton is put into a special
    " tristate" or indeterminate mode; you''ll sometimes see this in user interfaces
    where the checkbox holds a single dash rather than being empty or holding a check
    mark. When in this state, the state flag "alternate" is set, so you can check
    for it with the "instat" method:

    check.instate("alternate")


    Because the checkbutton won''t automatically set (or create) the linked variable,
    your program needs to make sure it sets the variable to the appropriate starting
    value.


    # ## Radiobutton


    +   - Widget Roundup

    +   - Reference Manual


    A **radiobutton** lets you choose between one of a number of mutually exclusive
    choices; unlike a checkbutton, it is not limited to just two choices. Radiobuttons
    are always used together in a set, and are a good option when the number of choices
    is fairly small, e.g. 3-5.


    ![](img/94378c1b05607c1dc5649c738af95c74_26_0.png)


    Radiobuttons are created using the **tk.Radiobutton** function, and typically
    as a set:

    phone = StringVar()

    home = tk.Radiobutton(parent, text=''Home'', variable=phone, value=''home'')

    office = tk.Radiobutton(parent, text=''Office'', variable=phone, value=''office'')

    cell = tk.Radiobutton(parent, text=''Mobile'', variable=phone, value=''cell'')


    Radiobuttons share most of the same configuration options as checkbuttons. One
    exception is that the"onvalue" and "ofvalue" options are replaced with a single
    "value" option. Each of the radiobuttons of the set will have the same linked
    variable, but a different value; when the variable has the given value, the radiobutton
    will be selected,'
