    # ## Additional Grid Features


    As you could see from the grid reference, there are lots of other things you can
    do with grid. Here are a few of the more useful ones.


    # ### Querying and Changing Grid Options


    Like widgets themselves, it''s easy to introspect the various grid options, as
    well as change them; setting options when you first grid the widget is just a
    convenience, and you can certainly change them anytime you''d like.


    The "slaves" method will tell you all the widgets that have been gridded inside
    a master, or optionally those within just a certain column or row. The "info"
    method will give you a list of all the grid options for a widget and their values.
    Finally, the "configure" method lets you change one or more grid options on a
    widget.


    These are illustrated in this interactive session:


    ```

    >>> **content.grid_slaves()**

    <map object at 0x00C3F470>

    >>> for w in **content.grid_slaves()**: print(w)

    ...

    .14597008.14622128

    .14597008.14622096

    .14597008.14622064

    .14597008.14622032

    .14597008.14622000

    .14597008.14621872

    .14597008.14621840

    .14597008.14621808

    >>> for w in **content.grid_slaves(row=3)**: print(w)

    ...

    .14597008.14622128

    .14597008.14622096

    .14597008.14622064

    .14597008.14622032

    .14597008.14622000

    >>> for w in **content.grid_slaves(column=0)**: print(w)

    ...

    ```'
