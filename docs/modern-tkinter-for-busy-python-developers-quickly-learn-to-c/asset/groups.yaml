    # ## Text


    +   * Widget Roundup

    +   * Reference Manual


    A **text** widget provides users with an area so that they can enter multiple
    lines of text. Text widgets are part of the classic Tk widgets, not the themed
    Tk widgets.


    ![](img/94378c1b05607c1dc5649c738af95c74_41_1.png)


    Tk''s text widget is, along with the canvas widget, one of two uber-powerful widgets
    that provide amazingly deep but easily programmed features. Text widgets have
    formed the basis for full word processors, outliners, web browsers and more. We''ll
    get into some of the advanced stuff in a later chapter, but here we''ll just show
    you what you need to use the text widget to capture fairly simple, multi-line
    text input.


    Text widgets are created using the **Text** function:


    ```

    t = Text(parent, width=40, height=10)

    ```


    The "width" and "height" options specify the requested screen size of the text
    widget, in characters and rows respectively. The contents of the text can be arbitrarily
    large. You can use the "wrap" configuration option to control how line wrapping
    is handled: values are "none" (no wrapping, text may horizontally scroll), "char"
    (wrap at any character), and "word" (wrapping will only occur at word boundaries).


    A text widget can be disabled so that no editing can occur; because text is not
    a themed widget, the usual"state" and "invalidate" methods are not available.
    Instead, use the configuration option "state", setting it to either "disabled"
    or "normal".'
