    \n滚动条的 “orient” 配置选项决定了它是用于 “水平” 还是 “垂直” 方向滚动。然后，你需要设置 “command” 配置选项以与被滚动的小部件进行通信。这必须是被滚动小部件上要调用的方法。\n\
    \n每个可以垂直滚动的小部件都包含一个名为 “yview” 的方法（可以水平滚动的小部件有一个名为 “xview” 的方法）。只要该方法存在，滚动条就不需要了解被滚动小部件的其他任何信息。当操纵滚动条时，它会在方法调用中添加一些参数，指示滚动方式、位置等。\n\
