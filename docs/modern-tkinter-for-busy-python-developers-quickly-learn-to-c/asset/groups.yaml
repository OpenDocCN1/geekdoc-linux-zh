    \n## 复选框\n\n- 小部件概览\n- 参考手册\n\n**复选框**（checkbutton）类似于普通按钮，不同之处在于，用户不仅可以按下它以触发命令回调，它还保存某种二进制值（即切换开关）。当用户被要求例如在某个选项的两个不同值之间进行选择时，复选框总是被频繁使用。\n\
