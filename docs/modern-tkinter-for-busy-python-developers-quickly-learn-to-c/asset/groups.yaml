    \ OS X, the ellipsis (“…”) is actually a special character, which is more tightly\
    \ spaced than three periods in a row. Tk takes care of substituting this character\
    \ for you automatically.\n\nSo adding menu items to a menu is essentially the\
    \ same as adding a submenu, but rather than adding a menu item of type \"cascade\"\
    , we're adding one of type \"command\".\n\nEach menu item has associated with\
    \ it a number of configuration options, in the same way widgets do, though each\
    \ menu item type has a different set of relevant options. Cascade menu items have\
    \ a \"menu\" option used to specify the submenu, command menu items have a \"\
    command\" option used to specify the command to invoke when the item is selected,\
    \ and both have a \"label\" option to specify the text to display for the item.\n\
    \nAs well as adding items to the end of menus, you can also insert them in the\
    \ middle of menus via the “insert index type ? option value...?” method; here\
    \ “index” is the position (0...n-1) of the item you want to insert before. You\
    \ can also delete a menu using the “delete index” method.\n\n## Types of Menu\
    \ Items\n\nWe've already seen “command” menu items, which are the common menu\
    \ items that when selected will invoke a command.\n\nWe've also seen the use of\
    \ “cascade” menu items, used to add a menu to a menubar. Not surprisingly, if\
    \ you want to add a submenu to an existing menu, you also use a “cascade” menu\
    \ item, in exactly the same way.\n\nA third type of menu item is the “separator”,\
    \ which produces the dividing line you often see between different sets of menu\
    \ items.\n\n```python\n    menu_file.add_separator()\n```\n\nFinally, there are\
    \ also “checkbutton” and “radiobutton” menu items, which behave analogously to\
    \ checkbutton and radiobutton widgets. These menu items have a variable associated\
    \ with them, and depending on the value of that variable, will display an indicator\
    \ (i.e. a checkmark or a selected radiobutton) next to the item’s label.\n\n```python\n\
    \    check = StringVar()\n    menu_file.add_checkbutton(label='Check', variable=check,\
    \ onvalue=1, offvalue=0)\n    radio = StringVar()\n    menu_file.add_radiobutton(label='One',\
    \ variable=radio, value=1)\n    menu_file.add_radiobutton(label='Two', variable=radio,\
    \ value=2)\n```\n\nWhen the user selects a checkbutton item that is not already\
    \ checked, it will set the associated variable to the value in \"onvalue\"; while\
    \ selecting an item that is already checked sets it to the value in \"offvalue\"\
    . Selecting a radiobutton item sets the associated variable to the value in \"\
    value\". Both types of items also react to changes in the associated variable\
    \ from within other parts of your program.\n\nAs with command items, checkbutton\
    \ and radiobutton menu items do accept a \"command\" configuration option, that\
    \ will be invoked when the menu item is selected; the associated variable, and\
    \ hence the menu item's state, is updated before the callback is invoked.\n\n\
    > Radiobutton menu items are not part of the Windows or Mac OS X human interface\
    \ guidelines, so on those platforms the indicator next to the item's label is\
    \ a checkmark, as it would be for a checkbutton item. The semantics still work\
    \ though; it's a good way to select between multiple items, since the display\
    \ will show one of the items selected (checked).\n\n## Accelerator Keys\n\nThe\
    \ \"accelerator\" option is used to indicate the menu accelerator that should\
    \ be associated with this menu. This does not actually create the accelerator,\
    \ but only displays what it is next to the menu item. You still need to create\
    \ a binding for the accelerator yourself.\n\n> Remember that event bindings can\
    \ be set on individual widgets, all widgets of a certain type, the toplevel window\
    \ containing the widget you're interested in, or the application as a whole. As\
    \ menu bars are associated with individual windows, normally the event bindings\
    \ you create will be on the toplevel window the menu is associated with.\n\nAccelerators\
    \ are very platform specific, not only in terms of which keys are used for what\
    \ operation, but what modifier keys are used for menu accelerators (e.g. on Mac\
    \ OS X it is the \"Command\" key, on Windows and X11 it is usually the \"Control\"\
    \ key). Example of valid accelerator options are \"Command-N\", \"Shift+Ctrl+X\"\
    , and \"Command-Option-B\". Commonly used modifiers include \"Control\", \"Ctr\"\
    , \"Option\", \"Opt\", \"Alt\", \"Shift\", \"Command\", \"Cmd\" and \"Meta\".\n\
    \n> On Mac OS X, those modifiers will be automatically mapped to the different\
    \ modifier icons that appear in menus.\n\n## More on Item Options\n\nThere are\
    \ a few more common options for menu items.\n\n### Underline\n\nWhile all platforms\
    \ support keyboard traversal of the menubar via the arrow keys, on Windows and\
    \ X11, you can also use other keys to jump to particular menus or menu items.\
    \ The keys that trigger these jumps are indicated by an underlined letter in the\
    \ menu item's label. If you want to add one of these to a menu item, you can use\
    \ the \"underline\" configuration option for the item. The value of this option\
    \ should be the index of the character you'd like underlined (from 0 to the length\
    \ of the string - 1).\n\n### Images\n\nIt is also possible to use images in menu\
    \ items, either beside the menu item's label, or replacing it altogether. To do\
    \ this, you can use the \"image\" and \"compound\" options, which work just like\
    \ in label widgets. The value for \"image\" must be a Tk image object, while \"\
    compound\" can have the values \"bottom\", \"center\", \"left\", \"right\", \"\
    top\" or \"none\".\n\n### State\n\nIt is also possible to disable a menu, so that\
    \ the user cannot select it. This can be done via the \"state\" option, setting\
    \ it to a value of \"disabled\", or a value of \"normal\" to reenable the item.\n\
    \n49\n"
  mdcn: "\n针对目标平台，熟悉应用程序如何使用菜单，并查阅平台的人机界面指南，以获取关于设计、术语、快捷键等更详细的信息。这通常是一个你需要针对每个平台进行自定义的领域。\n\
    \n## 菜单小部件与层级结构\n\n- 小部件综述\n- 参考手册\n\n在 Tk 中，菜单和按钮、条目一样，是作为小部件实现的。每个菜单小部件包含菜单中的多个不同项目。项目包括“文件”菜单中的“打开...”命令，但也包括项目之间的分隔符，以及打开其子菜单的项目（即所谓的级联菜单）。这些菜单中的每一项还具有属性，例如要显示的项目文本、键盘加速键以及要调用的命令。\n\
    \n菜单按照层级结构排列。菜单栏本身也是一个菜单小部件。它有多个子菜单（子项），包含诸如“文件”、“编辑”等项目。每一项本身又是一个包含不同项目的菜单，其中一些可能还包含子菜单。正如你在\
    \ Tk 中已经看到的其他内容一样，每次有子菜单时，它必须作为其父级菜单的子项创建。\n\n## 开始前须知\n\n在开始创建菜单之前，务必在应用程序中的某处添加以下这一行代码：\n\
    \n```python\nroot.option_add(\"*tearOff\", FALSE)\n```\n\n如果没有这一行，你的每个菜单（在 Windows\
    \ 和 X11 上）都会以一条看似虚线的线条开始，并允许你“拆卸”菜单，使其出现在独立的窗口中。你确实不希望在菜单中出现这种情况。\n\n> 这是对 Tk\
    \ 原始外观和风格所基于的 Motif 风格 X11 的一种怀旧。除非你的应用程序旨在运行于那台放在地下室吃灰的旧机器上，否则你确实不想看到这种情况，因为它不属于任何现代用户界面风格。\n\
    \n> 我们都期待着一个不再保留这种向后兼容性、并且默认不提供这种可拆卸菜单的 Tk 版本。\n\n## 创建菜单栏\n\n在 Tk 中，菜单栏与单个窗口相关联；每个顶级窗口最多可以有一个菜单栏。在\
    \ Windows 和 X11 上，这在视觉上是显而易见的，因为菜单是每个窗口的一部分，位于顶部标题栏下方。\n\n然而，在 Mac OS X 上，屏幕顶部有一个共享的菜单栏，由每个窗口共同使用。就你的\
    \ Tk 程序而言，每个窗口仍然拥有自己的菜单栏；当你在窗口之间切换时，Tk 会自动确保在屏幕顶部显示正确的菜单栏。如果你没有为特定窗口指定菜单栏，Tk 将使用与根窗口相关联的菜单栏；你现在应该已经注意到，当你的\
    \ Tk 应用程序启动时，这会自动为你创建。\n\n> 由于在 Mac OS X 上所有窗口都有菜单栏，因此确保你定义了一个菜单栏非常重要，无论是为每个窗口定义，还是为根窗口定义一个后备菜单栏。否则，你将最终使用“内置”菜单栏，其中包含仅用于直接输入解释器命令时使用的菜单。\n\
    \n要为窗口实际创建一个菜单栏，我们首先创建一个菜单小部件，然后使用窗口的“menu”配置选项将菜单小部件附加到窗口。如前所述，菜单小部件必须是顶级窗口的子项。\n\
    \n```python\nwin = Toplevel(root)  \nmenubar = Menu(win)  \nwin['menu'] = menubar\n\
    ```\n\n> 虽然这是非常古老的历史，但菜单栏过去是通过创建一个包含菜单项目的框架小部件，并将其像其他小部件一样打包到窗口顶部来实现的。希望你的代码或文档中没有仍然采用这种做法的部分。\n\
    \n## 添加菜单\n\n我们现在有了一个菜单栏，但如果没有菜单放进去，它相当没用。因此，我们需要再次为将要放入菜单栏的每个菜单创建一个菜单小部件（每个都是菜单栏的子项），然后将它们全部添加到菜单栏中。\n\
    \n## 添加菜单项\n\n现在我们的菜单栏中已经有了几个菜单，可能是时候往每个菜单中添加一些项目了。请记住，菜单项是菜单本身的一部分，所以幸运的是我们不需要为每一项都去创建另一个菜单小部件。\n\
    \n```python\n    menu_file.add_command(label='New', command=newFile)\n    menu_file.add_command(label='Open...',\
