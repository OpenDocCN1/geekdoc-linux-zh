    image sitting in your interface, this is normally the way to do it. We''ll go
    into images in more detail in a later chapter, but for now, let''s assume you
    want to display a GIF image that is sitting in a file on disk. This is a two-step
    process, first creating an image "object", and then telling the label to use that
    object via its "image" configuration option:


    ```python

    image = PhotoImage(file="myimage.gif")

    label["image"] = image

    ```


    You can use both an image and text, as you''ll often see in toolbar buttons, via
    the "compound" configuration option. The default value is "none", meaning display
    only the image if present, otherwise the text specified by the "text" or "textvariable"
    options. Other options are "text" (text only), "image" (image only), "center"
    (text in center of image), "top" (image above text), "left", "bottom", and "right".


    ## Layout


    While the overall layout of the label (i.e. where it is positioned within the
    user interface, and how large it is) is determined by the geometry manager, there
    are several options that can help you control how the label will be displayed
    within the box the geometry manager gives it.


    If the box given to the label is larger than the label requires for its contents,
    you can use the "anchor" option to specify which edge or corner the label should
    be attached to, which would leave any empty space in the opposite edge or corner.
    Possible values are specified as compass directions: "n" (north, or top edge),
    "ne" (north-east, or top right corner), "e", "se", "s", "sw", "w", "nw" or "center".


    Labels can be used to display more than one line of text. This can be done by
    embedding carriage returns ("\n") in the "text"/"textvariable" string. You can
    also let the label wrap the string into multiple lines that are no longer than
    a given length (with the size specified as pixels, centimeters, etc.), by using
    the "wraplength" option.


    Multi-line labels are a replacement for the older "message" widgets in classic
    Tk.


    You can also control how the text is justified, by using the "justify" option,
    which can have the values "left", "center" or "right". If you only have a single
    line of text, this is pretty much the same as just using the "anchor" option,
    but is more useful with multiple lines of text.


    # Fonts, Colors and More


    Like with frames, normally you don''t want to touch things like the font and colors
    directly, but if you need to change them (e.g. to create a special type of label),
    this would be done via creating a new style, which is then used by the widget
    with the "style" option.


    Unlike most themed widgets, the label widget also provides explicit widget-specific
    options as an alternative; again, you''d use this only in a special one-off cases,
    when using a style didn''t necessarily make sense.


    You can specify the font used to display the label''s text using the "font" configuration
    option. While we''ll go into fonts in more detail in a later chapter, here are
    the names of some predefined fonts you can use:


    - **TkDefaultFont** The default for all GUI items not otherwise specified.

    - **TkTextFont** Used for entry widgets, listboxes, etc.

    - **TkFixedFont** A standard fixed-width font.

    - **TkMenuFont** The font used for menu items.

    - **TkHeadingFont** The font typically used for column headings in lists and tables.

    - **TkCaptionFont** A font for window and dialog caption bars.

    - **TkSmallCaptionFont** A smaller caption font for subwindows or tool dialogs.

    - **TkIconFont** A font for icon captions.

    - **TkTooltipFont** A font for tooltips.


    > Because the choice of fonts is so platform specific, be careful of hardcoding
    them (font families, sizes, etc.); this is something else you''ll see in a lot
    of older Tk programs that can make them look ugly.


    The foreground (text) and background color can also be changed via the "foreground"
    and "background" options. Colors are covered in detail later, but you can specify
    these as either color names (e.g. "red") or hex RGB codes (e.g. "#f340a").


    Labels also accept the "relief" option that was discussed for frames.


    # Button


    - Widget Roundup

    - Reference Manual


    A button, unlike a frame or label, is very much designed for the user to interact
    with, and in particular, press to perform some action. Like labels, they can display
    text or images, but also have a whole range of new options used to control their
    behavior.


    ![](img/94378c1b05607c1dc5649c738af95c74_24_0.png)


    Buttons are created using the **tk.Button** function, and typically their contents
    and command callback are set up at the same time:


    ```python

    button = tk.Button(parent, text=''Okay'', command=submiForm)

    ```


    As with other widgets, buttons can take several different configuration options
    which can alter their appearance and behavior.


    ## Text or Image


    Buttons take the same "text", "textvariable" (rarely used), "image" and "compound"
    configuration options as labels, which control whether the button displays text
    and/or an image.


    Buttons have a "default" option, which tells Tk that the button is the default
    button in the user interface (i.e. the one that will be invoked if the user hits
    Enter or Return). Some platforms and styles will draw this with a different border
    or highlight. Set the option to "active" to specify this is a default button;
    the regular state is "normal". Note that setting this option doesn''t create an
    event binding that will make the Return or Enter key activate the button; that
    you have to do yourself.


    ## The Command Callback


    The "command" option is used to provide an interface between the button''s action
    and your application. When the user clicks the button, the script provided by
    the option is evaluated by the interpreter.


    You can also ask the button to invoke the command callback from your application.
    This is useful so that you don''t need to repeat the command to be invoked several
    times in your program; so you know if you change the option on the button, you
    don''t need to change it elsewhere too.


    ```python

    button.invoke()

    ```


    ## Button State


    Buttons and many other widgets can be in a normal state where they can be pressed,
    but can also be put into a disabled state, where the button is greyed out and
    cannot be pressed. This is done when the button''s command is not applicable at
    a given point in time.

