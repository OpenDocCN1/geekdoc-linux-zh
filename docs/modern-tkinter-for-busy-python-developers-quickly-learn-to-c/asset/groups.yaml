    # ## Differences between Tags in Canvas and Text Widgets


    While both canvas and text widgets support "tags" which can be used to apply to
    several objects, style them, and so on, these tags are not the same thing. There
    are important differences to take note of.


    In canvas widgets, individual canvas items have configuration options that control
    their appearance. When you refer to a tag in a canvas, the meaning of that is
    identical to "all canvas items presently having that tag". The tag itself doesn''t
    exist as a separate object. So in the following snippet, the last rectangle added
    will not be colored red.


