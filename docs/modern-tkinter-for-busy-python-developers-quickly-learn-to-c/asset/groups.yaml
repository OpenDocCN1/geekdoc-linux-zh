    \n第一行遍历内容框架的所有子小部件，并在每个周围添加一点填充，以便它们不会挤在一起。我们在最初将小部件放在屏幕上时可以在每个 “grid” 调用中添加这些选项，但这是一个很好的快捷方式。\n\
    \n第二行告诉 Tk 将焦点放在我们的输入小部件上。这样光标将开始于该字段，用户无需在开始输入前点击它。\n\n第三行告诉 Tk，如果用户在根窗口内任何地方按下\
    \ Return 键（Windows 上是 Enter），则应调用我们的 calculate 例程，就像用户按下了 Calculate 按钮一样。\n\n\
    ```python\ndef calculate(*args):\n    try:\n        value = float(feet.get())\n\
    \        meters.set((0.3048 * value * 10000.0 + 0.5)/10000.0)\n    except ValueError:\n\
    \        pass\n```\n\n这里我们定义了 calculate 过程，它在用户按下 Calculate 按钮或按下 Return 键时被调用。它执行英尺到米的计算，从我们的输入小部件中获取英尺数，并将结果放在我们的标签小部件中。\n\
    \n什么？看起来我们没有对这些小部件做任何事情！这就是我们在创建小部件时指定的魔法 “textvariable” 选项发挥作用的地方。我们将全局变量 “feet”\
    \ 指定为输入框的 textvariable，这意味着每当输入框改变时，Tk 会自动更新全局变量 feet。类似地，如果我们显式更改与小部件关联的 textvariable\
    \ 的值（正如我们为关联到标签的 “meters” 所做的），小部件会自动更新为变量的当前内容。很酷。\n\n```python\nroot.mainloop()\n\
    ```\n\n最后一行代码告诉 Tk 进入其事件循环，这是使一切运行所必需的。\n\n## 缺少什么\n\n也值得审视一下为了使我们的 Tk 程序正常工作，我们没有必要包含的内容。例如：\n\
    \n- 我们不必担心随着变化重绘屏幕\n- 我们不必担心解析和分发事件、命中检测或在每个小部件上处理事件\n- 我们在创建小部件时不必提供许多选项；默认值似乎处理了大多数事情，因此我们只需更改按钮显示的文本等\n\
    - 我们不必编写复杂的代码来获取和设置简单小部件的值；我们只是将它们附加到变量\n- 我们不必担心用户关闭窗口或调整其大小时会发生什么\n- 我们不需要编写额外的代码来使这一切跨平台工作\n\
    \n# Tk 概念\n\n有了第一个例子，你应该对 Tk 程序可能看起来的样子以及它需要完成的任务类型有了基本的想法。我们将退后一步，查看三个你需要知道以理解\
    \ Tk 的广泛概念：小部件、几何管理和事件处理。\n\n"
