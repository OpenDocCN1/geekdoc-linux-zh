    name.delete(0,''end'')       # delete between two indices, 0-based

    name.insert(0, ''your name'') # insert new text at a given index

    ```


    Note that entry widgets do not have a "command" option which will invoke a callback
    whenever the entry is changed. To watch for changes, you should watch for changes
    on the linked variable. See also "Validation", below.


