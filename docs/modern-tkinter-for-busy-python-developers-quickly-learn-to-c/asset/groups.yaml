    \n完成的英尺转米用户界面截图（在 Mac OS X、Windows 和 Linux 上）。\n\n# 关于代码风格的说明\n\n本教程中包含的每种语言都有多种可供选择的代码风格和约定，这些约定有助于确定变量和函数命名、过程式、函数式或面向对象风格等规范。\n\
    \n由于本教程的重点是 Tk，因此本教程将尽可能保持简单，通常使用非常直接的代码风格，而不是将大多数代码封装在过程、模块、对象、类等中。在尽可能多的情况下，你还会看到在每个示例中，跨语言使用相同的对象、变量等名称。\n\
    \n# 逐步详解\n\n让我们更仔细地查看那段代码，逐段分析。目前，我们要做的只是获得对创建 Tk 用户界面所需做的事情类型的初步理解，以及大致了解它们的样子。我们稍后会深入细节。\n\
    \n```python\nfrom tkinter import *\nfrom tkinter import ttk\n```\n\n这两行告诉 Python，我们的程序需要两个模块。第一个模块\
    \ “tkinter” 是 Tk 的标准绑定，加载它时也会加载系统上现有的 Tk 库。第二个模块 “ttk” 是 Python 对 Tk 8.5 中新增的较新\
    \ “主题化小部件” 的绑定。\n\n> *注意，我们从 tkinter 模块导入了所有内容，以便我们可以调用 tkinter 函数等而无需添加前缀，这是标准的\
    \ Tkinter 实践。然而，由于我们只导入了 “ttk” 本身，这意味着我们需要为该模块内部的所有内容添加前缀。例如，调用 “Entry(...)” 会调用\
    \ tkinter 模块内的函数，而我们需要使用 `tk.Entry(...)` 来调用 `tk` 内部的函数。你会看到，两个模块中都定义了几个函数，有时根据上下文，你需要两者都用。显式调用\
    \ `tk` 有助于实现这一点，这也是本教程中将采用的风格。*\n\n*如果你正在迁移新代码，你会发现的第一件事之一是，Tkinter 模块的名称现在是小写的，即\
    \ `tkinter`，而不是 `Tkinter`。这是从 `Python` 3.0 开始改变的。*\n\n```python\nroot = Tk()\n\
    root.title(\"Feet to Meters\")\nmainframe = ttk.Frame(root, padding=\"3 3 12 12\"\
    )\nmainframe.grid(column=0, row=0, sticky=(N, W, E, S))\nmainframe.columnconfigure(0,\
    \ weight=1)\nmainframe.rowconfigure(0, weight=1)\n```\n\n*是的，“calculate” 函数出现在这里之前。我们稍后会在下面描述它，但需要将其包含在开头附近，因为我们在程序的其他部分引用了它。*\n\
    \n接下来，上述代码行设置主窗口，并赋予其标题 “Feet to Meters”。然后，我们创建一个框架小部件，它将持有我们用户界面的所有内容，并将其放置在主窗口中。“columnconfigure”/“rowconfigure”\
    \ 部分只是告诉 Tk，如果主窗口被调整大小，框架应该扩展以占据额外空间。\n\n*严格来说，我们可以直接将界面的其他部分放入主根窗口，而不经过中间的内容框架。然而，主窗口本身并不是\
    \ “主题化” 小部件的一部分，因此其背景颜色将与我们要放入其中的主题化小部件不匹配。使用 “主题化” 框架小部件来持有内容可确保背景正确。*\n\n```python\n\
    feet = StringVar()\nmeters = StringVar()\nfeet_entry = ttk.Entry(mainframe, width=7,\
    \ textvariable=feet)\nfeet_entry.grid(column=2, row=1, sticky=(W, E))\nttk.Label(mainframe,\
    \ textvariable=meters).grid(column=2, row=2, sticky=(W, E))\nttk.Button(mainframe,\
    \ text=\"Calculate\", command=calculate).grid(column=3, row=3, sticky=W)\n```\n\
    \n前面的代码行创建了我们程序中的三个主要小部件：我们输入英尺数的输入框、放置结果的米数的标签，以及我们按下以执行计算的 calculate 按钮。\n\n\
    对于这三个小部件中的每一个，我们需要做两件事：创建小部件本身，然后将其放在屏幕上。这三个作为我们内容窗口 “子元素” 的小部件，都是 Tk 主题化小部件类的实例。在创建它们的同时，我们为它们指定某些选项，例如输入框的宽度、按钮内部的文本等。输入框和标签各自被分配了一个神秘的\
    \ “textvariable”；我们很快就会看到它是做什么的。\n\n如果小部件只是被创建，它们不会自动出现在屏幕上，因为 Tk 不知道你希望它们相对于其他小部件如何放置。这就是\
    \ “grid” 部分的作用。回忆我们应用程序的布局网格，我们将每个小部件放置在适当的列（1、2 或 3）和行（也是 1、2 或 3）中。“sticky”\
    \ 选项说明小部件如何在网格单元格内对齐，使用方位。因此 “W”（西）意味着将小部件锚定在单元格左侧，“we”（西-东）意味着将其锚定在左右两侧，等等。\n\
    \n```python\nttk.Label(mainframe, text=\"feet\").grid(column=3, row=1, sticky=W)\n\
