    # # Creating and Destroying Windows


    You''ve already seen that all Tk programs start out with a root toplevel window,
    and then widgets are created as children of that root window. Creating new toplevel
    windows works almost exactly the same as creating new widgets.


    Toplevel windows are created using the **Toplevel** function:


    ```

    ```

    t = Toplevel(parent)

    ```

    ```


    Unlike regular widgets, you don''t have to “grid” a toplevel for it to appear
    onscreen. Once you''ve created a new toplevel, you can then create other widgets
    which are children of that toplevel, and grid them inside the toplevel. In other
