    # ## Layout within the Cell


    Because the width of a column (and height of a row) depends on all the widgets
    that have been added to it, the odds are that at least some widgets will have
    a smaller width or height than has been allocated for the cell its been placed
    in. So the question becomes, where exactly should it be put within the cell?


    By default, if a cell is larger than the widget contained in it, the widget will
    be centered within it, both horizontally and vertically, with the master’s background
    showing in the empty space around it. The “sticky” option can be used to change
    this default behavior.


    The value of the “sticky” option is a string of 0 or more of the compass directions
    “nsew”, specifying which edges of the cell the widget should be “stuck” to. So
    for example, a value of “n” (north) will jam the widget up against the top side,
    with any extra vertical space on the bottom; the widget will still be centered
    horizontally. A value of “nw” (north-west) means the widget will be stuck to the
    top left corner, with extra space on the bottom and right.


    > In Tkinter, you can also specify this as a list, containing any of N, S, E and
    W.


    Specifying two opposite edges, such as “we” (west, east) means that the widget
    will be stretched, in this case so it is stuck both to the left and right edge.
    So the widget will then be wider than its "ideal" size. Most widgets have options
    that can control how they are displayed if they are larger than needed. For example,
    a label widget has an “anchor” option which controls where the text of the label
    will be positioned.


    If you want the widget to expand to fill up the entire cell, grid it with a sticky
    value of "nsew" (north, south, east, west) meaning it will stick to every side.


    # ## Handling Resize


    If you’ve taken a peek below and added the extra “sticky” options to our example,
    when you try it out you’ll notice things still don’t look quite right (the entry
    is lower on the screen then we’d want), and things are even worse if you try to
    resize the window — nothing moves at all!


    It looks like “sticky” may tell Tk how to react if the cell’s row or column does
    resize, but doesn’t actually say that the row or columns should resize if extra
    room becomes available. Let’s fix that.


    Every column and row has a “weight” grid option associated with it, which tells
    it how much it should grow if there is extra room in the master to fill. By default,
    the weight of each column or row is 0, meaning don’t expand to fill space.


    For the user interface to resize then, we’ll need to give a positive weight to
    the columns we’d like to expand. This is done using the “columnconfigure” and
    “rowconfigure” methods of grid. If two columns have the same weight, they’ll expand
    at the same rate; if one has a weight of 1, another of 3, the latter one will
    expand three pixels for every one pixel added to the first.


    Both “columnconfigure” and “rowconfigure” also take a “minsize” grid option, which
    specifies a minimum size which you really don’t want the column or row to shrink
    beyond.


    # ## Padding


    Normally, each column or row will be directly adjacent to the next, so that widgets
    will be right next to each other. This is sometimes what you want (think of a
    listbox and its scrollbar), but often you want some space between widgets. In
    Tk, this is called padding, and there are several ways you can choose to add it.'
