    ```python

    tree.item(''widgets'', open=TRUE)

    isopen = tree.item(''widgets'', ''open'')

    ```


    ## Displaying Information for each Item


    The treeview can also display one or more additional pieces of information about
    each item, which are shown as columns to the right of the main tree display.


    Again, each column is referenced by a symbolic name that you assign. You can specify
    the list of columns using the “columns” configuration option of the treeview widget,
    either when first creating the widget, or later on.


    ```python

    tree = ttk.Treeview(root, columns=(''size'', ''modified''))

    tree[''columns''] = (''size'', ''modified'', ''owner'')

    ```


    You can specify the width of the column, how the display of item information in
    the column is aligned, and more. You can also provide information about the heading
    of the column, such as the text to display, an optional image, alignment, and
    a script to invoke when the item is clicked (e.g. to sort the tree).


    ```python

    tree.column(''size'', width=100, anchor=''center'')

    tree.heading(''size'', text=''Size'')

    ```


    The values to place in each column for each item can be specified either individually,
    or by providing a list of values for the item. In the latter case, this is done
    using the ''values'' item configuration option (and so can be used either when
    first inserting the item or later) which takes a list of the values; the order
    of the list must be the same as the order in the “columns” widget configuration
    option.


    ```python

    tree.set(''widgets'', ''size'', ''12KB'')

    size = tree.set(''widgets'', ''size'')

    tree.insert('''', ''end'', text=''Listbox'', values=(''15KB'', ''Yesterday'',
    ''mark''))

    ```


    ## Item Appearance and Events


    Like the text and canvas widgets, the treeview widget uses tags to help you modify
    the appearance of items in the tree. You can assign a list of tags to each item
    using the "tags" item configuration option (again, when creating the item or later
    on).


    Tag configuration options can then be specified, which will then apply to all
    items having that tag. Valid tag options include "foreground" (text color), "background",
    "font", and "image" (not used if the item specifies its own image).


    You can also create event bindings on tags, which let you capture mouse clicks,
    keyboard events etc.


    ```python

    tree.insert('''', ''end'', text=''button'', tags=(''ttk'', ''simple''))

    tree.tag_configure(''ttk'', background=''yellow'')

    tree.tag_bind(''ttk'', ''<1>'', itemClicked) # the item clicked can be found via
    tree.focus()

    ```


    The treeview will generate virtual events "<TreeviewSelect>", "<TreeviewOpen>"
    and "<TreeviewClose>" which allow you to monitor changes to the widget made by
    the user. You can use the "selection" method to determine the current selection
    (the selection can also be changed from your program).


    ## Customizing the Display


    There are many aspects of how the treeview widget is displayed that you can customize.
    Some of them we’ve already seen, such as the text of items, fonts and colors,
    names of column headings, and more. Here are a few additional ones.


    - Specify the desired number of rows to show using the "height" widget configuration
    option.

    - Control the width of each column using the column’s “width” or “minwidth” options.
    The column holding the tree can be accessed with the symbolic name “#0”. The overall
    requested width for the widget is based on the sum of the column widths.

    - Choose which columns to display and the order to display them in using the “displaycolumns”
    widget configuration option.

    - You can optionally hide one or both of the column headings or the tree itself
    (leaving just the columns) using the “show” widget configuration option (default
    is “tree headings” to show both).

    - You can specify whether a single item or multiple items can be selected by the
    user via the “selectmode” widget configuration option, passing “browse” (single
    item), “extended” (multiple items, the default), or “one”.


    ## Styles and Themes


    The “themed” aspect of the new Ttk widgets is one of the most powerful and exciting
    aspects of the new widget set. Yet because it does things quite differently from
    how Tk has traditionally worked, and because in trying to be flexible it does
    a lot of things, it’s certainly the most confusing for many people.


    ### Definitions


    We’ll first define a few concepts and terms that Ttk themes and styles rely on.


    #### Widget Class


    A widget class is used by Tk to identify the type of a particular widget; essentially,
    whether it is a button, a label, a canvas, etc. In classic Tk, all buttons had
    the same class (“Button”), all labels had the same class (“Label”), etc.


    You could use this widget class both for introspection, and for changing options
    globally via the option database. This could let you say for example that all
    buttons by default had a red background.

    '
  mdcn: '

    # 更多功能


    文本控件可以做更多的事；这里我们简要提及其中几项。关于如何使用这些功能的详细信息，请参阅参考手册。


    ## 搜索


    文本控件包含一个强大的“search”（搜索）方法，允许你在控件中定位特定文本；例如，这对于实现“查找”对话框非常有用。你可以从特定位置向前或向后搜索，或在给定范围内搜索；可以使用精确文本、忽略大小写或正则表达式来指定搜索内容，查找搜索词的一个或所有出现位置，等等。


    ## 修改、撤销和重做


    文本控件会跟踪文本是否已被修改（例如，这有助于知道是否需要保存该文本），你可以使用“edit modified”方法查询（或更改）此状态。此外，还有一个完整的多级撤销/重做机制，当将其“undo”配置选项设置为
    true 时，由控件自动管理。调用“edit undo”或“edit redo”后，将使用存储在撤销/重做堆栈中的信息来修改当前文本。


    ## 省略文本


    实际上，你可以在控件中包含一些不显示的文本；这被称为“elided”（省略）文本，通过标签的“elide”配置选项实现。你可以使用此功能来实现例如大纲、“折叠”代码编辑器，或者仅仅将一些额外的元数据嵌入你的文本中。在指定省略文本的位置时，需要更加小心，因此处理位置的命令具有额外选项，用于包括或忽略省略文本。


    ## 内省


    与大多数 Tk 控件一样，文本控件努力暴露其内部状态的信息；关于这些内容，我们在“get”方法、控件配置选项、标签和标记的“names”和“cget”等方面已经见过大部分。还有更多信息可供使用，以满足各种任务需求。请参考手册中的“debug”、“dlineinfo”、“bbox”、“count”和“dump”方法。


    ## 共享


    Tk 文本控件允许在两个或更多不同的文本控件之间共享相同的底层文本数据（包含所有文本、标记、标签、图像等）。这被称为共享（peering），通过“peer”方法控制。


    ## 树


    -   [控件综述](#)

    -   [参考手册](#)


    **树视图**（treeview）控件可以显示并允许浏览项目层次结构，并可以在树的右侧显示每个项目的一个或多个属性作为列。它允许你构建类似于在 OS X Finder
    或 Windows Explorer 等文件管理器中看到的树形显示的用户界面。与大多数 Tk 控件一样，它具有极大的灵活性，使其能够以各种方式适应不同的情况。


    ![](img/94378c1b05607c1dc5649c738af95c74_75_0.png)

    ![](img/94378c1b05607c1dc5649c738af95c74_75_1.png)

    ![](img/94378c1b05607c1dc5649c738af95c74_75_2.png)


    ## 树视图控件


    树视图控件使用 `ttk.Treeview` 函数创建：


    ```python

    tree = ttk.Treeview(parent)

    ```


    如有需要，可以以常规方式添加水平和垂直滚动条。


    ## 向树中添加项目


    要对树视图做任何有用的事情，你需要向其中添加一个或多个项目。每个项目代表树中的一个单个节点，无论是叶节点还是内部节点。项目通过唯一的 id 来引用；此 id
    可以在项目首次创建时由程序员分配，或者由控件自动为项目选择一个 id。


    项目通过将其插入树中来创建，使用树视图的“insert”方法。要插入一个项目，你需要知道在树中的哪个位置插入它，这意味着除了指定父项之外，还要指定新项目应插入在父项子项列表中的哪个位置。


    树视图控件自动创建一个根节点（不显示），其 id 为“{}”（即空字符串），它可以作为你添加的第一级项目的父节点。父项子项列表内的位置通过索引指定（0 表示第一个，特殊的“end”索引表示在所有现有子项之后插入）。


    通常，你还会指定每个项目的名称，该名称显示在树中。还有其他选项用于在名称旁边添加图像，指定节点是打开还是关闭状态等。


    ```python

    # 插入到根节点，由程序选择 id：

    tree.insert('''', ''end'', ''widgets'', text=''Widget Tour'')


    # 同样的操作，但插入为第一个子项：

    tree.insert('''', 0, ''gallery'', text=''Applications'')


    # 由树视图选择 id：

    id = tree.insert('''', ''end'', text=''Tutorial'')


    # 插入到现有节点下方：

    tree.insert(''widgets'', ''end'', text=''Canvas'')

    tree.insert(id, ''end'', text=''Tree'')

    ```


    插入项目后会返回新创建项目的 id。


    ## 重新排列项目


    可以将节点（如果有任何后代）移动到树中的不同位置；唯一的限制是节点不能移动到其自身的后代下方。目标位置通过父项和子项列表中的索引指定，正如在“insert”中做的那样。


    ```python

    tree.move(''widgets'', ''gallery'', ''end'') # 将 widgets 移动到 gallery 下方

    ```


    可以将项目从树中分离，这会从层次结构中移除该项目及其后代，但不会销毁这些项目，允许你稍后使用“move”重新插入它们。


    ```python

    tree.detach(''widgets'')

    ```


    项目也可以被删除，这会完全移除该项目及其后代。


    ```python

    tree.delete(''widgets'')

    ```


    如果你希望导航层次结构，有一些方法可以让你查找项目的父项（“parent”），查找项目的下一个或上一个兄弟项（“next”和“prev”），以及返回项目的子项列表（“children”）。


    你可以通过修改“open”项配置选项来控制该项目是否打开并显示其子项。


    ```python

    tree.item(''widgets'', open=TRUE)

    isopen = tree.item(''widgets'', ''open'')

    ```


    ## 显示每个项目的信息


    树视图还可以显示关于每个项目的一个或多个附加信息，它们作为列显示在主树显示的右侧。


    同样，每个列通过你分配的符号名称来引用。你可以使用树视图控件的“columns”配置选项指定列列表，既可以在创建控件时指定，也可以在稍后指定。


    ```python

    tree = ttk.Treeview(root, columns=(''size'', ''modified''))

    tree[''columns''] = (''size'', ''modified'', ''owner'')

    ```


    你可以指定列的宽度、列中项目信息显示的对齐方式等。你还可以提供关于列标题的信息，例如要显示的文本、可选图像、对齐方式以及点击项时调用的脚本（例如，用于对树进行排序）。


    ```python

    tree.column(''size'', width=100, anchor=''center'')

    tree.heading(''size'', text=''Size'')

    ```


    每个项目中每列的值可以单独指定，也可以通过提供项目的值列表来指定。在后一种情况下，使用“values”项配置选项完成（因此可以在首次插入项目时或稍后使用），该选项接受一个值列表；列表的顺序必须与“columns”控件配置选项中的顺序相同。


    ```python

    tree.set(''widgets'', ''size'', ''12KB'')

    size = tree.set(''widgets'', ''size'')

    tree.insert('''', ''end'', text=''Listbox'', values=(''15KB'', ''Yesterday'',
    ''mark''))

    ```


    ## 项目外观和事件


    与文本和画布控件一样，树视图控件使用标签（tags）来帮助你修改树中项目的外观。你可以使用“tags”项配置选项（同样，在创建项目时或稍后）为每个项目分配一个标签列表。


    然后可以指定标签配置选项，这些选项将应用于具有该标签的所有项目。有效的标签选项包括“foreground”（文本颜色）、“background”、“font”和“image”（如果项目指定了自己的图像，则不使用此项）。


    你还可以在标签上创建事件绑定，从而捕获鼠标点击、键盘事件等。


    ```python

    tree.insert('''', ''end'', text=''button'', tags=(''ttk'', ''simple''))

    tree.tag_configure(''ttk'', background=''yellow'')

    tree.tag_bind(''ttk'', ''<1>'', itemClicked) # 可以点击的项目可以通过 tree.focus() 找到

    ```


    树视图将生成虚拟事件“<TreeviewSelect>”、“<TreeviewOpen>”和“<TreeviewClose>”，允许你监视用户所做的控件更改。你可以使用“selection”方法来确定当前选择（选择也可以通过你的程序更改）。


    ## 自定义显示


    关于树视图控件显示方式的许多方面都是可定制的。我们已经见过其中的一些，例如项目的文本、字体和颜色、列标题的名称等。以下是一些额外的自定义选项。


    -   使用“height”控件配置选项指定要显示的行数。

    -   使用列的“width”或“minwidth”选项控制每列的宽度。持有树的列可以通过符号名称“#0”访问。控件的总请求宽度基于列宽度之和。

    -   使用“displaycolumns”控件配置选项选择要显示的列及其显示顺序。

    -   你可以选择隐藏一个或两个列标题或树本身（仅留下列），使用“show”控件配置选项（默认为“tree headings”以同时显示两者）。

    -   你可以通过“selectmode”控件配置选项指定用户可以选择单个项目还是多个项目，传入“browse”（单个项目）、“extended”（多个项目，默认值）或“one”。


    ## 样式和主题


    新的 Ttk 控件的“themed”（主题化）方面是新控件集最强大且令人兴奋的特性之一。然而，由于其工作方式与 Tk 传统的运作方式非常不同，并且由于为了保持灵活性做了很多事情，这确实对许多人来说是最令人困惑的部分。


    ### 定义


    我们将首先定义一些 Ttk 主题和样式所依赖的概念和术语。


    #### 控件类


    控件类用于 Tk 标识特定控件的类型；本质上，它是按钮、标签、画布等。在经典 Tk 中，所有按钮都有相同的类（“Button”），所有标签都有相同的类（“Label”）等。


    你可以使用此控件类进行内省，也可以通过选项数据库全局更改选项。例如，这可以让你说所有按钮默认都具有红色背景。

