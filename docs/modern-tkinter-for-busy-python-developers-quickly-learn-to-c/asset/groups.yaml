    \n5\n\n## 简介\n\n本教程旨在帮助人们快速上手使用 Tk（特别是 Tk 8.5）构建主流桌面图形用户界面。Tk 8.5 是一个极其重要的里程碑版本，也是相对于大多数人熟知和喜爱的旧版本\
    \ Tk 的重大革新。\n\n缺点在于，除非你了解一两个特定事项，否则它实际上并不是一个多么重大的版本；出于向后兼容性的原因，除非现有程序进行一些简单的更改，否则它们的外观不会有多大不同。因此，虽然本教程肯定会惠及\
    \ Tk 的新手，但也会帮助现有的 Tk 开发人员更新他们的知识。这是一句老生常谈，但我无法相信自己编写此教程时学到了多少知识，而我使用 Tk 已经超过十五年了。\n\
    \n目前，Tk 的文档总体状况（Tcl 参考文档除外，那些文档非常优秀）不幸地并未处于高点。对于使用 Tcl 以外语言开发 Tk 以及跨平台开发的开发人员来说，这种情况尤为明显。\n\
    \n因此，本教程将尽可能针对三大主要平台（Windows、Mac、Linux）上的开发人员，并保持语言中立。最初，本教程将涵盖 Tcl、Ruby、Perl\
    \ 和 Python。随着时间推移，可能会增加更多语言。即使你的编程语言未被包含在内，你也可能从中受益；由于所有语言都使用相同的底层 Tk 库，显然存在大量重叠。\n\
    \n这也不是参考指南，它不会涵盖所有内容，只涵盖 95% 的应用程序所需的 essentials。其余内容你可以在参考文档中找到。\n\n## 本教程适合谁\n\
    \n本教程专为使用 Tk 构建工具和应用程序的开发人员设计。它也关注相当主流的图形用户界面，包括按钮、列表、复选框、富文本编辑、2D 图形等。因此，如果你打算深入研究\
    \ Tk 的内部 C 代码，或者构建下一个伟大的 3D 沉浸式游戏界面，这可能不适合你。\n\n本教程也不教授底层编程语言（Tcl、Ruby、Perl、Python\
    \ 等），因此你应该已经掌握其基础。同样，你应该熟悉桌面应用程序的一般概念。虽然你不必是用户界面设计师，但对 GUI 设计有一些了解总是有帮助的。\n\n\
    ## 现代最佳实践\n\n本教程全在于利用 Tk 当前提供的工具构建现代 Tk 用户界面。重点在于你需要知道的最佳实践。\n\n对于大多数工具，你可能认为没必要特意说明这一点，但对\
    \ Tk 来说情况并非如此。Tk 经历了漫长的演进过程（参见 Tk 背景介绍），任何演进往往会留下一些陈旧的负担：加上在此过程中图形用户界面平台和标准的演变，你可以看到，将像\
    \ GUI 库这样庞大且复杂的库保持更新和向后兼容可能具有挑战性。\n\n近年来，Tk 的名声受到了一些诋毁，轻描淡写了之。其中一些是实至名归的，大多数则不然。像任何\
    \ GUI 工具一样，它可以被用来创建外观糟糕且过时的用户界面，但如果有适当的注意和投入，它也可以被用来创建出色的用户界面。大多数人知道那些糟糕的界面；大多数人甚至不知道那些优秀的界面是用\
    \ Tk 制作的。在本教程中，我们将专注于构建良好用户界面所需的内容，这比 Tk 8.5 之前要容易得多。\n\n因此，使用现代桌面图形用户界面，采用现代惯例和设计感，利用\
    \ Tk 8.5 提供的现代工具。\n\n## Tk 扩展\n\n谈到现代最佳实践，Tk 扩展值得特别一提。多年来，许多组织为 Tk 提供了各种插件，例如添加核心中不可用（或当时不可用）的新部件。一些知名且相当受欢迎的\
    \ Tk 扩展包括 BLT、Tix、IWidgets、BWidgets；还有很多其他扩展。\n\n许多扩展是多年前创建的。由于核心 Tk 始终高度向后兼容，这些扩展通常能在新版本中继续工作。然而，许多扩展很久没有更新，或者没有重大更新。它们可能不符合当前的平台惯例或样式，因此虽然它们“能工作”，但可能使你的应用程序显得非常过时或不协调。\n\
    \n如果你决定使用 Tk 扩展，强烈建议你仔细调查和审查你的选择。\n\n## 更好的前进方向\n\nTk 也给你很多选择。至少有六种不同的方式将部件布局在屏幕上，通常还有多个不同的部件可以实现相同的功能，特别是如果你算上像\
    \ Tix、BLT、BWidgets、Itk 等大量 Tk 扩展。这些大部分也是较旧的，大多数未更新，因此外观糟糕，在许多情况下，它们提供的功能已被 Tk\
    \ 本身最近内置的更新、更现代的功能所取代。但出于向后兼容性的原因，这些旧方法中的大多数多年来仍能工作。这并不一定意味着人们应该继续使用其中一些。\n\n\
    因此，Tk 有很多选择，但坦率地说，所有这些选择反而成了障碍。如果你想学习和使用 Tk，你不需要所有选择，你需要的是正确的选择，这样你就不必进行所有研究和自行做出选择。这就是本教程将提供给你的。可以将其视为观点鲜明的软件的文档等价物。因此，我们通常会以与其他文档或示例不同的方式做事；通常，这是因为在那些文档编写时，更好的方法甚至还不存在。以后，一旦你成为专家，遇到正常选择不符合的怪诞情况时，你可以去寻找替代方案。\n\
    \n## 如何使用\n\n虽然本教程旨在按顺序使用，但你可以随意跳读。我们通常会提供链接，让你可以获取更多信息，无论是指向本站点上的其他文档（如提供每个 Tk\
    \ 部件使用信息的“部件概览”），还是指向外部文档（如特定命令的完整参考）。\n\n本教程还允许你选择显示的语言（Tcl、Ruby、Perl 或 Python）。你可以通过位于每页侧边栏右上角附近的“显示：”弹出菜单来更改。它还可以让你查看所有不同语言如何使用\
    \ Tk，这本身也相当有趣且有用。\n\n7\n\n"
