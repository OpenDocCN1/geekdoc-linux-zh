    ```\n\n> 在 Mac OS X 上，省略号（“…””）实际上是一个特殊字符，其间距比三个连续的句点更紧凑。Tk 会自动为你替换这个字符。\n\n因此，向菜单添加菜单项基本上与添加子菜单相同，只不过我们添加的不是类型为\
    \ \"cascade\"（级联）的菜单项，而是类型为 \"command\"（命令）的菜单项。\n\n每个菜单项都关联着一系列配置选项，与小部件类似，尽管每种菜单项类型有一组不同的相关选项。级联菜单项有一个\
    \ \"menu\" 选项，用于指定子菜单；命令菜单项有一个 \"command\" 选项，用于指定选中该项时要调用的命令；两者都有一个 \"label\"\
    \ 选项，用于指定项目的显示文本。\n\n除了向菜单末尾添加项目外，你还可以通过“insert index type ? option value...?”方法将项目插入到菜单中间；此处“index”是你想要在其之前插入的项目的位置（0...n-1）。你还可以使用“delete\
    \ index”方法删除一个菜单。\n\n## 菜单项类型\n\n我们已经见过“command”菜单项，这是常见的菜单项，选中时会调用一个命令。\n\n我们也见过“cascade”菜单项的用法，用于向菜单栏添加菜单。不出所料，如果你想向现有菜单添加子菜单，你也以完全相同的方式使用“cascade”菜单项。\n\
    \n第三种类型的菜单项是“separator”（分隔符），它会生成你在不同菜单项组之间经常看到的分隔线。\n\n```python\n    menu_file.add_separator()\n\
    ```\n\n最后，还有“checkbutton”和“radiobutton”菜单项，它们的行为类似于复选框和单选按钮小部件。这些菜单项关联着一个变量，根据该变量的值，会在项目标签旁边显示一个指示器（即对勾或选中的单选按钮）。\n\
    \n```python\n    check = StringVar()\n    menu_file.add_checkbutton(label='Check',\
    \ variable=check, onvalue=1, offvalue=0)\n    radio = StringVar()\n    menu_file.add_radiobutton(label='One',\
    \ variable=radio, value=1)\n    menu_file.add_radiobutton(label='Two', variable=radio,\
    \ value=2)\n```\n\n当用户选中一个尚未勾选的复选框项时，它会将关联变量设置为 \"onvalue\" 中的值；而选中一个已勾选的项则将其设置为\
    \ \"offvalue\" 中的值。选中单选按钮项会将关联变量设置为 \"value\" 中的值。这两种类型的项目还会响应程序其他部分对关联变量的更改。\n\
    \n与命令项一样，复选框和单选按钮菜单项也接受一个 \"command\" 配置选项，当菜单项被选中时将调用该命令；在调用回调之前，关联变量（从而菜单项的状态）会先被更新。\n\
    \n> 单选按钮菜单项不属于 Windows 或 Mac OS X 的人机界面指南，因此在这些平台上，项目标签旁边的指示器是对勾，就像复选框项一样。但语义仍然有效；这是从多个项目中进行选择的好方法，因为显示会表明其中一个项目被选中（勾选）。\n\
    \n## 加速键\n\n\"accelerator\"（加速键）选项用于指示应与此菜单关联的菜单加速键。这实际上并不创建加速键，只是在其旁边显示该加速键是什么。你仍然需要自己为加速键创建绑定。\n\
    \n> 请记住，事件绑定可以设置在单个小部件上、某种类型的所有小部件上、包含你所关注小部件的顶级窗口上，或者是整个应用程序上。由于菜单栏与单个窗口相关联，通常你创建的事件绑定将与菜单相关联的顶级窗口上。\n\
    \n加速键具有非常强的平台特定性，不仅在于用于特定操作的键，还在于菜单加速键使用的修饰键（例如，在 Mac OS X 上是 \"Command\" 键，在\
    \ Windows 和 X11 上通常是 \"Control\" 键）。有效的加速键选项示例包括 \"Command-N\"、\"Shift+Ctrl+X\"\
    \ 和 \"Command-Option-B\"。常用的修饰键包括 \"Control\"、\"Ctr\"、\"Option\"、\"Opt\"、\"Alt\"\
    、\"Shift\"、\"Command\"、\"Cmd\" 和 \"Meta\"。\n\n> 在 Mac OS X 上，这些修饰键会自动映射到菜单中出现的不同修饰图标。\n\
    \n## 关于项目选项的更多说明\n\n菜单项还有几个常见的选项。\n\n### 下划线\n\n虽然所有平台都支持通过箭头键遍历菜单栏，但在 Windows\
    \ 和 X11 上，你还可以使用其他键跳转到特定的菜单或菜单项。触发这些跳转的键通过菜单项标签中的下划线字母来表示。如果你想在菜单项中添加此类按键，可以使用该项的\
    \ \"underline\" 配置选项。该选项的值应该是你想要下划线的字符的索引（从 0 到字符串长度 - 1）。\n\n### 图像\n\n在菜单项中使用图像也是可能的，既可以放在菜单项标签旁边，也可以完全取代它。为此，你可以使用\
    \ \"image\" 和 \"compound\" 选项，它们的作用方式与标签小部件中相同。\"image\" 的值必须是一个 Tk 图像对象，而 \"\
    compound\" 的值可以是 \"bottom\"、\"center\"、\"left\"、\"right\"、\"top\" 或 \"none\"。\n\
    \n### 状态\n\n也可以禁用菜单，使用户无法选择它。这可以通过 \"state\" 选项完成，将其值设置为 \"disabled\"，或设置为 \"\
    normal\" 以重新启用该项目。\n\n49\n\n"
