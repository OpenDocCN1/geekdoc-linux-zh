    We''ve already actually seen one way, and that is using a widget''s own options
    to add the extra space around it. Not all widgets have this, but one that does
    is a frame; this is useful because frames are most often used as the master to
    grid other widgets. The frame''s "padding" option lets you specify a bit of extra
    padding inside the frame, whether the same amount for each of the four sides,
    or even different for each.


    A second way is using the "padx" and "pady" grid options when adding the widget.
    As you''d expect, "padx" puts a bit of extra space to the left and right of the
    widget, while "pady" adds extra space top and bottom. A single value for the option
    puts the same padding on both left and right (or top and bottom), while a two
    value list lets you put different amounts on left and right (or top and bottom).
    Note that this extra padding is within the grid cell containing the widget.


    If you want to add padding around an entire row or column, the "columnconfigure"
    and "rowconfigure" methods accept a "pad" option, which will do this for you.


    Let''s add the extra sticky, resizing, and padding behavior to our example (additions
    in bold).


    ```python

    from tkinter import *

    from tkinter import ttk


    root = Tk()


    content = ttk.Frame(root, padding=(3,3,12,12))

    frame = tk.Frame(content, borderwidth=5, relief="sunken", width=200, height=100)

    namelbl = tk.Label(content, text="Name")

    name = tk.Entry(content)


    onevar = BooleanVar()

    twovar = BooleanVar()

    threvar = BooleanVar()


    onevar.set(True)

    twovar.set(False)

    threvar.set(True)


    one = tk.Checkbutton(content, text="One", variable=onevar, onvalue=True)

    two = tk.Checkbutton(content, text="Two", variable=twovar, onvalue=True)

    three = tk.Checkbutton(content, text="Three", variable=threvar, onvalue=True)

    ok = tk.Button(content, text="Okay")

    cancel = tk.Button(content, text="Cancel")


    content.grid(column=0, row=0, sticky=(N, S, E, W))

    frame.grid(column=0, row=0, columnspan=3, rowspan=2, sticky=(N, S, E, W))

    namelbl.grid(column=3, row=0, columnspan=2, sticky=(N, W), padx=5)

    name.grid(column=3, row=1, columnspan=2, sticky=(N, E, W), pady=5, padx=5)

    one.grid(column=0, row=3)

    two.grid(column=1, row=3)

    three.grid(column=2, row=3)

    ok.grid(column=3, row=3)

    cancel.grid(column=4, row=3)


    root.columnconfigure(0, weight=1)

    root.rowconfigure(0, weight=1)

    content.columnconfigure(0, weight=3)

    content.columnconfigure(1, weight=3)

    content.columnconfigure(2, weight=3)

    content.columnconfigure(3, weight=1)

    content.columnconfigure(4, weight=1)

    content.rowconfigure(1, weight=1)


    root.mainloop()

    ```


