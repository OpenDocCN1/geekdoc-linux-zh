    \n## 组织复杂界面\n\n如果你有一个大型用户界面，你需要找到方法将其组织起来，以免复杂性压倒你的用户。有几种不同的方法可以做到这一点；同样，通用的和平台特定的人机交互指南在决策时都是很好的资源。\n\
    \n注意，当我们在本章谈论复杂性时，指的并不是程序如何构建的底层技术复杂性，而是它如何呈现给用户。用户界面可以由许多不同的模块组成，由多个画布小部件和深层嵌套框架构建，但这并不一定意味着用户会感到它很复杂。\n\
