    - 部件概览

    - 参考手册


    **进度条** 部件提供了一种向用户反馈长时间操作进度的方法。这可以通过两种形式实现：一种是针对可以估算进度的操作，显示完成百分比；另一种是显示状态变化以表明操作仍在继续，但不提供完成时间估算。


    ![](img/94378c1b05607c1dc5649c738af95c74_42_0.png)


    进度条部件使用 **tk.ttk.Progressbar** 类创建：


    ```python

    p = ttk.Progressbar(parent, orient=HORIZONTAL, length=200, mode=''determinate'')

    ```


    “orient” 选项可以是 “horizontal”（水平）或 “vertical”（垂直）。“length” 选项表示水平或垂直进度条较长轴的指定值，以屏幕单位（如像素）指定。“mode”
    配置选项可以设置为 “determinate”（确定型），此时进度条将指示相对于完成状态的相对进度；或者设置为 “indeterminate”（不确定型），此时无法知道任务进行到了哪一步，但希望提供反馈表明程序仍在运行。


    ### 确定型进度


    在确定型模式下，您可以向用户提供较为准确的操作进度反馈。为此，首先需告知进度条该操作将经历多少“步”，然后在操作过程中，持续告知进度条当前操作的进展程度。


    可以使用 “maximum” 配置选项向进度条提供总步数；这是一个浮点数，默认值为 100（即每步占 1%）。为了告知进度条当前操作进展，您需要反复修改 “value”
    配置选项。该值从 0 开始，然后递增直到您设置的最大值。这里有两种变体方法。首先，可以将进度条的当前值存储在一个通过进度条的 “variable” 配置选项与其关联的变量中；这样，当变量改变时，进度条就会更新。另一种替代方案是调用进度条的
    “step amount” 方法，以给定的 “amount”（默认为 1.0）增量增加值。


    ### 不确定型进度


    不确定型模式适用于无法轻松知晓（或估算）长任务进行到多少比例，但仍希望向用户提供反馈，表明操作仍在运行（或程序未崩溃）的情况。在这种情况下，不必提供具体数值来指示进度，而是在操作开始时调用进度条的
    “start” 方法，在操作结束时调用其 “stop” 方法。进度条会自动处理其余部分。


    ### 标尺


    ![](img/94378c1b05607c1dc5649c738af95c74_43_0.png)


    **标尺** 部件提供了一种让用户通过直接操作选择数值的方法。


    ![](img/94378c1b05607c1dc5649c738af95c74_43_1.png)


    标尺部件使用 **tk.Scale** 函数创建：


    ```python

    s = tk.Scale(parent, orient=HORIZONTAL, length=200, from_=1.0, to=100.0)

    ```


    > *由于 ''from'' 是保留关键字，因此在使用它作为配置选项时需要在其末尾添加下划线。*


    在某些方面，标尺部件类似于进度条，但它们的设计目的是供用户操作。与进度条一样，应使用 "orient" 配置选项为其指定方向（水平或垂直），并可指定可选的
    "length"。还应定义标尺允许用户选择的数值范围；为此，需为 "from" 和 "to" 配置选项分别设置一个浮点数。


    有几种不同的方法可以设置标尺的当前值（该值必须是 "from" 和 "to" 值之间的浮点数）。您可以设置（或读取以获取当前值）标尺的 "value" 配置选项。您可以使用
    "variable" 选项将标尺与变量关联。或者，可以调用标尺的 "set value" 方法来修改值，或调用 "get" 方法来读取当前值。


    还有一个 "command" 配置选项，允许您指定在标尺改变时调用的脚本。Tk 每次调用此脚本时都会自动附加标尺的当前值作为参数（我们在滚动条回调中见过类似的情况，其中滚动条被滚动部件也会添加额外参数）。


    与其他主题部件一样，如果您希望防止用户修改标尺，可以使用 "state disabled"、"state !disabled" 和 "instate disabled"
    方法。


    *由于标尺部件不显示实际数值，您可能希望将这些数值添加为标签。*


    ### 自旋框


    - 部件概览

    - 参考手册


    **自旋框** 部件允许用户选择数字（实际上，也可以是任意列表中的项目）。它通过结合一个显示当前值的类输入框部件和一对用于在可能选项范围内步进的小型上下箭头来实现这一功能。


    自旋框属于经典 Tk 部件；目前主题化 Tk 部件集中没有自旋框。


    ![](img/94378c1b05607c1dc5649c738af95c74_44_0.png)


    自旋框部件使用 **Spinbox** 函数创建：


    ```python

    spintval = StringVar()

    s = Spinbox(parent, from_=1.0, to=100.0, textvariable=spintval)

    ```


    与标尺部件一样，自旋框通常用于让用户在特定范围内选择数字（使用 "from" 和 "to" 配置选项指定），尽管用户界面非常不同。您还可以指定 "increment"，它控制每次单击上或下按钮时值的变更幅度。


    与列表框或组合框一样，自旋框也可用于让用户从任意字符串列表中选择项目；这些项目可以使用 "values" 配置选项指定，其工作方式与组合框相同。指定值列表将覆盖
    "from" 和 "to" 设置。


    *您可能会困惑于何时选择标尺、列表框、组合框、输入框或自旋框，因为通常其中几种部件都可以用于同一类型的数据。答案实际上取决于您希望用户选择的数据类型、平台用户界面惯例以及该值在用户界面中扮演的角色。*


    > 例如，组合框和自旋框都具有占用空间较小的优点，这可能适用于较为边缘的设置，而在用户界面的主要选择中，可能需要列表框所占用的额外空间。当项目没有自然且明显的排序时，自旋框不太有意义。对于包含过多项目的组合框和自旋框，您应当谨慎，因为这会使选择项目花费更多时间。


    对于数值范围和任意范围，都有一个接受布尔值的 "wrap" 选项，用于确定当值超出起始或结束值时是否应循环。您还可以为容纳自旋框当前值的输入框指定 "width"。


    同样，关于如何设置或获取自旋框中的当前值也有多种选择。通常，您会使用 "textvariable" 配置选项指定关联变量；照例，变量的任何更改都会反映在自旋框中，而自旋框中的任何更改也会反映在关联变量中。此外，"setvalue"
    和 "get" 方法允许直接设置或获取值。


    可以使用 "command" 配置选项安排 whenever 自旋框改变时调用某功能。


    > 命令包含几个百分号替换：%s = 当前值，%d = 向上或向下。需要确定在 Ruby 中指定此功能的正确方式。还需要添加关于验证的内容。


    由于自旋框不是主题化部件，"state" 和 "instate" 方法不可用。相反，可以使用 "state" 配置选项来更改其状态。这可以是 "normal"（正常）或
    "disabled"（禁用）以防止任何更改。


    ## 菜单


    本章介绍如何在 Tk 中处理菜单栏和弹出菜单。对于精细的应用程序，这些是您特别需要关注领域。如果您希望您的应用程序能与用户平台上的其他应用程序协调一致，菜单就需要特别的照顾。


    说到这一点，确定您正在运行哪个平台的推荐方式是：


    ```python

    root.tk.call(''tk'', ''winfo system'') # 将返回 x11, win32 或 aqua

    ```


    > 据我所知，Tkinter 没有提供与此调用直接等效的方法。然而，如您从示例中可以看到，可以使用任何 Tkinter 部件上可用的 `.tk.call()`
    函数直接执行基于 Tcl 的 Tk 命令。


    > 这比检查诸如 `tcl_platform` 或 `RUBY_PLATFORM` 等全局变量以及使用这些方法的旧检查可能更有用。虽然在早期，平台与窗口系统之间有着相当好的相关性，但现在情况已有所不同。例如，如果识别出您的平台为
    Unix，这可能意味着 X11 下的 Linux，Aqua 下的 Mac OS X，甚至 X11 下的 Mac OS X。


    ### 菜单栏


    在本节中，我们将探讨菜单栏：如何创建它们、其中包含什么、如何使用它们等等。


    合适地设计菜单栏及其菜单集合超出了本教程的范围，但有几条建议。首先，如果您发现自己拥有大量菜单、非常长的菜单或深度嵌套的菜单，您可能需要重新考虑用户界面的组织方式。其次，许多人使用菜单来探索程序的功能，尤其是在初次学习时，因此请尽量确保主要功能可以通过菜单访问。最后，对于每个您支持的


