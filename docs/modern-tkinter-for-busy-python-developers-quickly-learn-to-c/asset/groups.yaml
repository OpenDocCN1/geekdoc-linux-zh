    # Even More


    There are many more things that the text widget can do; here we''ll briefly mention
    just a few more of them. For details on using any of these, see the reference
    manual.


    # Search


    The text widget includes a powerful "search" method which allows you to locate
    a piece of text within the widget; this is useful for a "Find" dialog, as one
    obvious example. You can search backwards or forwards from a particular position
    or within a given range, specify your search using exact text, case insensitive,
    or using regular expressions, find one or all occurrences of your search term,
    and much more.


    # Modifications, Undo and Redo


    The text widget keeps track of whether or not changes have been made to the text
    (useful to know whether you need to save it for example), which you can query
    (or change) using the "edit modified" method. There is also a complete multi-level
    undo/redo mechanism, managed automatically by the widget when you set its"undo"
    configuration option to true. Calling "edit undo" or "edit redo" then will modify
    the current text using information stored on the undo/redo stack.


    # Eliding Text


    You can actually include text in the widget that is not displayed; this is known
    as "elided" text, and is made available using the "elide" configuration option
    for tags. You can use this to implement for example an outline, a "folding" code
    editor, or even just to bury some extra meta-data intermixed with your text. When
    specifying positioning with elided text you have to be a bit more careful, and
    so commands that deal with positions have extra options to either include or ignore
    the elided text.


    # Introspection


    Like most Tk widgets, the text widget goes out of its way to expose information
    about its internal state; we''ve seen most of this in terms of the "get" method,
    widget configuration options, "names" and "cget" for both tags and marks, and
    so on. There is even more information available that you can use for a wide variety
    of tasks. Check out the "debug", "dlineinfo", "bbox", "count" and "dump" methods
    in the reference manual.


    # Peering


    The Tk text widget allows the same underlying text data (containing all the text,
    marks, tags, images, and so on) to be shared between two or more different text
    widgets. This is known as peering, and is controlled via the "peer" method.


    # Tree


    +   * Widget Roundup

    +   * Reference Manual


    A **treeview** widget can display and allow browsing through a hierarchy of items,
    and can show one or more attributes of each item as columns to the right of the
    tree. It allows you to build user interfaces similar to the tree display you''d
    find in file managers like the OS X Finder or Windows Explorer. As with most Tk
    widgets, there is a ton of flexibility to make it behave as you need for a wide
    range of situations.'
