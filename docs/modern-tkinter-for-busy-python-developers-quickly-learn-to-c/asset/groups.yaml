  mdcn: "\n## 堆叠顺序\n\n堆叠顺序指的是窗口在屏幕上“放置”的顺序，从底部到顶部。当两个窗口的位置重叠时，堆叠顺序中更靠上的窗口会遮挡或覆盖堆叠顺序中靠下的窗口。\n\
    \n你可以通过以下方式获取当前的堆叠顺序（一个从最低到最高的列表）：\n\n```python\nroot.tk.eval('wm stackorder '\
    \ + str(window))\n```\n\n> 此方法似乎并未通过 Tkinter 的 API 清晰暴露。\n\n你 также 可以检查一个窗口是否在另一个窗口之上或之下：\n\
    \n```python\nif (root.tk.eval('wm stackorder ' + str(window) + ' isabove ' + str(otherwindow))\
    \ == 1):\n    ...\nif (root.tk.eval('wm stackorder ' + str(window) + ' isbelow\
    \ ' + str(otherwindow)) == 1):\n    ...\n```\n\n你还可以提高或降低窗口的堆叠顺序，既可以调整到堆叠顺序的最顶端（最底层），也可以调整到指定窗口的上方（下方）：\n\
    \n```python\nwindow.lift()\nwindow.lift(otherwin)\nwindow.lower()\nwindow.lower(otherwin)\n\
    ```\n\n> Tkinter 使用名称 'lift'；因为 'raise' 是保留关键字。\n\n想知道为什么需要传递一个窗口来获取当前堆叠顺序吗？事实证明，堆叠顺序、提升和降低等功能不仅适用于顶级窗口，也适用于任何“兄弟”小部件（即具有相同父级的小部件）。因此，如果你有几个通过网格布局排列但相互重叠的小部件，你可以相对于彼此来提升或降低它们的堆叠顺序。例如：\n\
    \n```python\nfrom tkinter import *\nfrom tkinter import ttk\n\nroot = Tk()\nlittle\
    \ = ttk.Label(root, text=\"Little\")\nbigger = ttk.Label(root, text='Much bigger\
    \ label')\nlittle.grid(column=0, row=0)\nbigger.grid(column=0, row=0)\nroot.after(2000,\
    \ lambda: little.lift())\nroot.mainloop()\n```\n\n> \"after\" 命令安排脚本在未来一定毫秒数后执行，但在此期间允许事件循环的正常处理继续进行。\n\
    \n## 调整大小行为\n\n通常，顶级窗口（包括根窗口和你创建的其他窗口）都可以被用户调整大小。然而，有时在你的用户界面中，你可能希望阻止用户调整窗口大小。你可以防止窗口被调整大小，实际上可以独立指定窗口的宽度（第一个参数）和高度（第二个参数）是否可变。因此，要禁用所有大小调整：\n\
    \n```python\nwindow.resizable(FALSE, FALSE)\n```\n\n请记住，如果你已经在窗口中添加了 ttk::sizegrip\
    \ 小部件，当你使窗口不可调整大小时，应该移除它。\n\n如果启用了大小调整，你可以指定希望窗口大小受限于最小和/或最大值（参数分别是宽度和高度）：\n\n\
    ```python\nwindow.minsize(200, 100)\nwindow.maxsize(500, 500)\n```\n\n## 最小化和隐藏\n\
    \n在大多数系统上，你可以通过最小化窗口暂时将其从屏幕上移除。在 Tk 中，窗口是否最小化被称为窗口的状态。窗口的可能状态包括“normal”（正常）和“iconic”（已最小化窗口），以及“withdrawn”（隐藏）、“icon”或“zoomed”（缩放）等几种其他状态。\n\
    \n你可以查询或设置当前窗口状态，还有“iconify”和“deiconify”方法，它们分别是设置“iconic”或“normal”状态的快捷方式。\n\n\
    ```python\nthestate = window.state()\nwindow.state('normal')\nwindow.iconify()\n\
    window.deiconify()\n```\n\n## 标准对话框\n\n对话框是一种在应用程序中用于从用户处获取信息、通知用户某些事件已发生、确认操作等的窗口类型。对话框的外观和使用方法通常在平台风格指南中有相当具体的说明。Tk\
    \ 内置了许多用于常见任务的对话框，并帮助你遵循平台特定的风格指南。\n\n## 选择文件和目录\n\nTk 提供了几个对话框，让用户选择文件或目录。在 Windows\
    \ 和 Mac 上，这些直接调用底层操作系统对话框。当你希望用户选择现有文件时（例如在“文件 | 打开...”菜单命令中），使用对话框的“open”变体；而“save”变体用于选择要保存到的文件（通常由“文件\
    \ | 另存为...”菜单命令使用）。\n\n```python\nfrom tkinter import filedialog\n\nfilename =\
    \ filedialog.askopenfilename()\nfilename = filedialog.asksaveasfilename()\ndirname\
    \ = filedialog.askdirectory()\n```\n\n所有这些命令都会产生模式对话框，这意味着在用户提交对话框之前，命令（因此你的程序）不会继续运行。这些命令返回用户选择的文件或目录的完整路径名，如果用户取消对话框，则返回空字符串。\n\
    \n![](img/94378c1b05607c1dc5649c738af95c74_53_0.png)\n\n![](img/94378c1b05607c1dc5649c738af95c74_54_0.png)\n\
    \n![](img/94378c1b05607c1dc5649c738af95c74_54_1.png)\n\n可以传递给这些对话框的各种不同选项允许你设置允许的文件类型、默认文件名等。这些在\
    \ getOpenFile/getSaveFile 和 chooseDirectory 参考手册页面中有详细说明。\n\n## 选择颜色\n\n还有一个模式对话框让用户选择颜色。它将返回一个颜色值，例如\
