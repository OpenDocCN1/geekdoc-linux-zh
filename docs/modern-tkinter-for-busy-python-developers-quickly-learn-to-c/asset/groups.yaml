    # The Grid Geometry Manager


    We''ll take a bit of a break from talking about different widgets (what to put
    onscreen), and focus instead on geometry management (where to put it). We introduced
    the general idea of geometry management in the “Tk Concepts” chapter; here, we
    focus on one specific geometry manager: grid.


    As you''ve seen, grid lets you layout widgets in columns and rows. If you''re
    familiar with using HTML tables to do layout, you''ll feel right at home here.
    This chapter describes the various ways you can tweak grid to give you all the
    control you need for your user interface.


    Grid is one of several geometry managers available in Tk, but it''s mix of power,
    flexibility and ease of use, along with its natural fit with today''s layouts
    (that rely on alignment of widgets) make it the best choice for general use. There
    are other geometry managers: “pack” is also quite powerful, but harder to use
    and understand; “place” gives you complete control of positioning each element;
    we''ll see even widgets like paned windows, notebooks, canvas and text can act
    as geometry managers.


    > Grid was first introduced to Tk in 1996, several years after Tk became popular,
    and took a while to catch on. Before that, developers had always used “pack” to
    do constraint-based geometry management. When grid came out, many developers kept
    using pack, and you''ll still find it used in many Tk programs and documentation.
    While there''s nothing technically wrong with it, the algorithm''s behavior is
    often hard to understand. More importantly, because the order that widgets are
    packed is significant in determining layout, modifying existing layouts can be
    difficult.


    > Grid has all the power of pack, generally produces nicer layouts (because it
    makes it easy to align widgets both horizontally and vertically), and is easier
    to learn and use. Because of that, we think grid is the right choice for most
    developers most of the time. Start your new programs using grid, and switch old
    ones to grid as you''re making changes to an existing user interface.


    The reference documentation for grid provides an exhaustive description of grid,
    its behaviors and all options.


    # Columns and Rows


    Using grid, widgets are assigned a “column” number and a “row” number, which indicates
    their relative position to each other. All widgets in the same column will therefore
    be above or below each other, while those in the same row will be to the left
    or right of each other.


    Column and row numbers must be integers, with the first column and row starting
    at 0. You can leave gaps in column and row numbers (e.g. column 0, 1, 2, 10, 11,
    12, 20, 21), which is handy if you plan to add more widgets in the middle of the
    user interface at a later time.


    The width of each column (or height of each row) depends on the width or height
    of the widgets contained within the column or row. This means when sketching out
    your user interface, and dividing it into rows and columns, you don''t need to
    worry about each column or row being equal width.'
