  md: "\nAll themed widgets carry with them an internal state, which is a series of\
    \ binary flags. You can set or clear these different flags, as well as check the\
    \ current setting using the \"state\" and \"instate\" methods. Buttons make use\
    \ of the \"disabled\" flag to control whether or not the user can press the button.\
    \ For example:\n\n```text\nbutton.state(['disabled']) ;# set the disabled flag,\
    \ disabling the button\nbutton.state(['!disabled']) ;# clear the disabled flag\n\
    button.instate(['disabled']) ;# return true if the button is disabled, else false\n\
    button.instate(['!disabled']) ;# return true if the button is not disabled, else\
    \ false\nbutton.instate(['!disabled'], cmd) ;# execute 'cmd' if the button is\
    \ not disabled\n```\n\nNote that these commands accept an *array* of state flags\
    \ as their argument.\n\nUsing \"state\"/\"instate\" replaces the older \"state\"\
    \ configuration option (which took the values \"normal\" or \"disabled\"). This\
    \ configuration option is actually still available in Tk 8.5, but \"write-only\"\
    , which means that changing the option calls the appropriate \"state\" command,\
    \ but other changes made using the \"state\" command are not reflected in the\
    \ option. This is only for compatibility reasons; you should change your code\
    \ to use the new state vector.\n\nThe full list of state flags available to themed\
    \ widgets is: \"active\", \"disabled\", \"focus\", \"pressed\", \"selected\",\
    \ \"background\", \"readonly\", \"alternate\", and \"invalid\". These are described\
    \ in the themed widget reference; not all states are meaningful for all widgets.\
    \ It's also possible to get fancy in the \"state\" and \"instate\" methods and\
    \ specify multiple state flags at the same time.\n\n## Checkbutton\n\n- Widget\
    \ Roundup\n- Reference Manual\n\nA **checkbutton** is like a regular button, except\
    \ that not only can the user press it, which will invoke a command callback, but\
    \ it also holds a binary value of some kind (i.e. a toggle). Checkbuttons are\
    \ used all the time when a user is asked to choose between e.g. two different\
    \ values for an option.\n\n![](img/94378c1b05607c1dc5649c738af95c74_25_0.png)\n\
    \nCheckbuttons are created using the **tk.Checkbutton** function, and typically\
    \ set up at the same time:\n\n```python\nmeasureSystem = StringVar()\ncheck =\
    \ tk.Checkbutton(parent, text='Use Metric',\n                       command=metricChanged,\
    \ variable=measureSystem,\n                       onvalue='metric', offvalue='imperial')\n\
    ```\n\nCheckbuttons use many of the same options as regular buttons, but add a\
    \ few more. The \"text\", \"textvariable\", \"image\", and \"compound\" options\
    \ control the display of the label (next to the check box itself), and the \"\
    state\" and \"instate\" methods allow you to manipulate the \"disabled\" state\
    \ flag to enable or disable the checkbutton. Similarly, the \"command\" option\
    \ lets you specify a script to be called every time the user toggles the checkbutton,\
    \ and the \"invoke\" method will also execute the same callback.\n\n### Widget\
    \ Value\n\nUnlike buttons, checkbuttons also hold a value. We've seen before how\
    \ the \"textvariable\" option can be used to tie the label of a widget to a variable\
    \ in your program; the \"variable\" option for checkbuttons behaves similarly,\
    \ except it is used to read or change the current value of the widget, and updates\
    \ whenever the widget is toggled. By default, checkbuttons use a value of \"1\"\
    \ when the widget is checked, and \"0\" when not checked, but these can be changed\
    \ to just about anything using the \"onvalue\" and \"offvalue\" options.\n\nWhat\
    \ happens when the linked variable contains neither the on value or the off value\
    \ (or even doesn't exist)? In that case, the checkbutton is put into a special\
    \ \"tristate\" or indeterminate mode; you'll sometimes see this in user interfaces\
    \ where the checkbox holds a single dash rather than being empty or holding a\
    \ check mark. When in this state, the state flag \"alternate\" is set, so you\
    \ can check for it with the \"instate\" method:\n`check.instate(\"alternate\"\
    )`\n\nBecause the checkbutton won't automatically set (or create) the linked variable,\
    \ your program needs to make sure it sets the variable to the appropriate starting\
    \ value.\n\n## Radiobutton\n\n- Widget Roundup\n- Reference Manual\n\nA **radiobutton**\
    \ lets you choose between one of a number of mutually exclusive choices; unlike\
    \ a checkbutton, it is not limited to just two choices. Radiobuttons are always\
    \ used together in a set, and are a good option when the number of choices is\
    \ fairly small, e.g. 3-5.\n\n![](img/94378c1b05607c1dc5649c738af95c74_26_0.png)\n\
    \nRadiobuttons are created using the **tk.Radiobutton** function, and typically\
    \ as a set:\n`phone = StringVar()`\n`home = tk.Radiobutton(parent, text='Home',\
    \ variable=phone, value='home')`\n`office = tk.Radiobutton(parent, text='Office',\
    \ variable=phone, value='office')`\n`cell = tk.Radiobutton(parent, text='Mobile',\
    \ variable=phone, value='cell')`\n\nRadiobuttons share most of the same configuration\
    \ options as checkbuttons. One exception is that the \"onvalue\" and \"offvalue\"\
    \ options are replaced with a single \"value\" option. Each of the radiobuttons\
    \ of the set will have the same linked variable, but a different value; when the\
    \ variable has the given value, the radiobutton will be selected, otherwise unselected.\
    \ When the linked variable does not exist, radiobuttons also display a \"tristate\"\
    \ or indeterminate, which can be checked via the \"alternate\" state flag.\n\n\
    ## Entry\n\n- Widget Roundup\n- Reference Manual\n\nAn **entry** represents the\
    \ user with a single line text field that they can use to type in a string value.\
    \ These can be just about anything: their name, a city, a password, social security\
    \ number, and so on.\n\n![](img/94378c1b05607c1dc5649c738af95c74_27_0.png)\n\n\
    Entries are created using the **tk.Entry** function:\n\n```python\nusername =\
    \ StringVar()\nname = tk.Entry(parent, textvariable=username)\n```\n\nA \"width\"\
    \ configuration option may be specified to provide the number of characters wide\
    \ the entry should be, allowing you for example to provide a shorter entry for\
    \ a zip or postal code.\n\nWe've seen how checkbutton and radiobutton widgets\
    \ have a value associated with them. Entries do as well, and that value is normally\
    \ accessed through a linked variable specified by the \"textvariable\" configuration\
    \ option. Note that unlike the various buttons, entries don't have a separate\
    \ text or image beside them to identify them; use a separate label widget for\
    \ that.\n\nYou can also get or change the value of the entry widget directly,\
    \ without going through the linked variable. The \"get\" method returns the current\
    \ value, and the \"delete\" and \"insert\" methods let you change the contents,\
    \ e.g.\n\n```python\nprint(\"current value is %s\" % name.get())\nname.delete(0,\
    \ 'end')       # delete between two indices, 0-based\nname.insert(0, 'your name')\
    \ # insert new text at a given index\n```\n\nNote that entry widgets do not have\
    \ a \"command\" option which will invoke a callback whenever the entry is changed.\
    \ To watch for changes, you should watch for changes on the linked variable. See\
    \ also \"Validation\", below.\n\n### Passwords\n\nEntries can be used for passwords,\
    \ where the actual contents are displayed as a bullet or other symbol. To do this,\
    \ set the \"show\" configuration option to the character you'd like to display,\
    \ e.g. \"*\".\n\n### Widget States\n\nLike the various buttons, entries can also\
    \ be put into a disabled state via the \"state\" command (and queried with \"\
    instate\"). Entries can also use the state flag \"readonly\"; if set, users cannot\
    \ change the entry, though they can still select the text in it (and copy it to\
    \ the clipboard). There is also an \"invalid\" state, set if the entry widget\
    \ fails validation, which leads us to...\n\n### Validation\n\n- `validate` (controls\
    \ overall validation behavior) - none (default), key (on each keystroke, runs\
    \ before prevalidation), focus/focusin/focusout (runs after revalidation), all\n\
    - `validatecommand` script (script must return 1 or 0)\n- `invalidcommand` script\
    \ (runs when validate command returns 0)\n- various substitutions in scripts.\
    \ most useful %P (new value of entry), %s (value of entry prior to editing)\n\
    - the callbacks can also modify the entry using insert/delete, or modify textvariable,\
    \ which means the in progress edit is rejected in any case (since it would overwrite\
    \ what we just set)\n- `force` validate to force validation now\n\n## Combobox\n\
    \n- Widget Roundup\n- Reference Manual\n\nA **combobox** combines an entry with\
    \ a list of choices available to the user. This lets them either choose from a\
    \ set of values you’ve provided (e.g. typical settings), but also put in their\
    \ own value (e.g. for less common cases you don’t want to include in the list).\n\
    \n![](img/94378c1b05607c1dc5649c738af95c74_28_0.png)\n\nComboboxes are created\
    \ using the `tk.Combobox` function:\n\n```python\ncountryvar = StringVar()\ncountry\
    \ = tk.Combobox(parent, textvariable=countryvar)\n```\n\nLike entries, the \"\
    `textvariable`\" option links a variable in your program to the current value\
    \ of the combobox. As with other widgets, the linked variable will not be set\
    \ automatically. You can also get the current value using the \"`get`\" method,\
    \ and change the current value using the \"`set`\" method (which takes a single\
    \ argument, the new value).\n\nA combobox will generate a \"`<ComboboxSelected>`\"\
    \ virtual event that you can bind to whenever its value changes.\n\n```python\n\
    country.bind(\"<ComboboxSelected>\", function)\n```\n\n### Predefined Values\n\
    \nYou can provide a list of values the user can choose from using the \"`values`\"\
    \ configuration option:\n\n```python\ncountry['values'] = ('USA', 'Canada', 'Australia')\n\
    ```\n\nIf set, the \"`readonly`\" state flag will restrict the user to making\
    \ choices only from the list of predefined values, but not be able to enter their\
    \ own (though if the current value of the combobox is not in the list, it won’t\
    \ be changed).\n\nAs a complement to the \"`get`\" and \"`set`\" methods, you\
    \ can also use the \"`current`\" method to determine which item in the predefined\
    \ values list is selected (call \"`current`\" with no arguments, it will return\
    \ a 0-based index into the list, or -1 if the current value is not in the list),\
    \ or select one of the items in the list (call \"`current`\" with a single 0-based\
    \ index argument).\n"
