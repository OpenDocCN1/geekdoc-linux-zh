    ```

    text.tag_configure(''highlightline'', background=''yellow'', font=''helvetica
    14 bold'', relief=''raised'')

    ```


    当前可用于标签的配置选项包括：“background”（背景色）、“bgstipple”（背景点画）、“borderwidth”（边框宽度）、“elide”（省略）、“fgstipple”（前景点画）、“font”（字体）、“foreground”（前景色）、“justify”（对齐）、“lmargin1”（左边距1）、“lmargin2”（左边距2）、“offset”（偏移量）、“overstrike”（删除线）、“relief”（凹凸效果）、“rmargin”（右边距）、“spacing1”（间距1）、“spacing2”（间距2）、“spacing3”（间距3）、“tabs”（制表位）、“tabstyle”（制表风格）、“underline”（下划线）和“wrap”（换行）。请查阅参考手册了解这些选项的详细说明。`tag
    cget` 方法允许你查询标签的配置选项。


    由于多个标签可以应用于相同的文本范围，因此可能存在冲突（例如，两个标签指定了不同的字体）。使用优先级顺序来解决这些冲突；最近创建的标签具有最高优先级，但可以使用“tag
    raise”和“tag lower”方法重新排列优先级。


    ## 更多标签操作


    要完全删除一个标签，可以使用“tag delete”方法。这当然也会移除文本中对标签的任何引用。你也可以使用“tag remove”方法将标签从文本范围中移除；即使这导致没有任何文本范围带有该标签，标签对象本身仍然存在。


    "tag ranges" 方法将返回该标签已应用于文本中的范围列表。还有 "tag next" 和 "tag prev" 方法，用于从给定位置向前或向后搜索第一个这样的范围。


    "tag names" 方法在不传入额外参数的情况下调用，将返回文本小部件中当前定义的所有标签列表（包括那些可能当前未被使用的标签）。如果你向该方法传入一个索引，它将返回仅应用于该索引处字符的标签列表。


    最后，你可以使用具有给定标签的文本中的第一个和最后一个字符作为索引，就像你可以使用 "end" 或 "2.5" 一样。为此，只需指定 "tagname.first"
    或 "tagname.last"。


    ## Canvas 和 Text 小部件中标签的差异


    虽然 canvas 和 text 小部件都支持 "tags"，可用于应用于多个对象、设置样式等，但这些标签不是同一种东西。有一些重要的差异需要注意。


    在 canvas 小部件中，单个 canvas 项目具有控制其外观的配置选项。当你在 canvas 中引用一个标签时，其含义等同于"所有当前具有该标签的 canvas
    项目"。标签本身并不作为一个单独的对象存在。因此，在以下代码片段中，最后添加的矩形不会变成红色。


    ```python

    canvas.itemconfigure(''important'', fill=''red'')

    canvas.create_rectangle(10, 10, 40, 40, tags=(''important''))

    ```


    相比之下，在 text 小部件中，保留外观状态信息的不是单个字符，而是标签，标签是它们自身的对象。因此，在这个代码片段中，新添加的文本将变为红色。


    ```python

    text.insert(''end'', ''first text'', (''important''))

    text.tag_configure(''important'', foreground=''red'')

    text.insert(''end'', ''second text'', (''important''))

    ```


    ## 事件和绑定


    一个很酷的功能是你可以为标签定义事件绑定。这允许你轻松识别仅针对特定文本范围的鼠标点击，并据此弹出菜单或对话框。不同的标签可以拥有不同的绑定，因此你可以省去诸如"这个位置的点击意味着什么？"这类问题的麻烦。标签上的绑定是使用
    "tag bind" 方法实现的。


    ```python

    text.tag_bind(''important'', ''<1>'', popupImportantMenu)

    ```


    小部件范围的事件绑定工作方式是与其他小部件相同的。除了常规的低层事件外，还有两个会生成的虚拟事件：只要小部件的内容发生更改，就会生成 <Modified>；只要选中的文本发生变化，就会生成
    <Selection>。


    ## 选择文本


    你的程序可能想知道用户是否选择了某段文本，如果是，该范围是什么。例如，在编辑器中，你可能有一个工具栏按钮用于加粗选中的文本。虽然你可以通过 <Selection>
    虚拟事件得知选择何时发生变化（例如，以更新加粗按钮是否处于激活状态），但这并没有告诉你具体选择了什么。


    文本小部件自动维护一个名为 "sel" 的标签，它指的是所选文本。每当选择发生变化时，"sel" 标签都会更新。因此，你可以使用 "tag ranges"
    方法来查找选定的文本范围，传入 "sel" 作为要报告的标签。


    类似地，你可以使用 "**tag add**" 来设置新的选择，或使用 "**tag remove**" 来移除选择，从而改变选择。当然，你实际上不能删除
    "sel" 标签。


    > *尽管默认的小部件绑定会防止这种情况发生，但 "sel" 与其他标签一样，它支持多个范围，即不相交的选择。为了防止在代码中更改选择时发生这种情况，请确保在添加新选择之前移除任何旧选择。*


    文本小部件将插入光标（新输入的文本将出现的位置）的概念与选择分开管理。它通过使用一种称为标记（mark）的新概念来实现这一点。


    ## 标记


    标记用于指示文本中的特定位置。在这点上，它们类似于索引，不同之处在于随着文本的修改，标记会调整到相同的相对位置。在这方面，它们类似于标签，但标记指的是单个位置，而不是文本范围。实际上，标记并不指代文本中被字符占据的位置，而是指定两个字符之间的位置。


    Tk 自动维护两个不同的标记。第一个名为 "insert"，是插入光标的当前位置。当光标移动时（通过鼠标或键盘），标记随之移动。第二个标记名为 "current"，反映当前鼠标位置下方字符的位置。


    要创建自己的标记，使用小部件的 "**mark set**" 方法，传入标记的名称和一个索引（标记位于给定索引处的字符之前）。这也用于将现有标记移动到不同位置。可以使用
    "**mark unset**" 方法移除标记，传入标记的名称即可。如果你删除了包含标记的一段文本，该标记也会被移除。


    标记的名称也可以用作索引（与 "1.0" 或 "end-1c" 是索引的方式相同）。你可以使用 "**mark next**" 或 "**mark previous**"
    方法，从给定索引在文本中找到下一个（或前一个）标记。"**mark names**" 方法将返回所有标记名称的列表。


    标记还具有重力（gravity），可以通过 "**mark gravity**" 方法进行修改，这会影响在标记处插入文本时发生的事情。假设我们有文本 "ac"，在中间有一个标记，我们用管道符
    | 来表示，即 "a|c"。如果该标记的重力是 "right"（默认值），标记将依附于 "c"。如果在标记处插入新文本 "b"，标记将保持依附于 "c"，因此新文本将插入到标记之前，即
    "ab|c"。如果重力改为 "left"，标记将依附于 "a"，因此新文本将插入到标记之后，即 "a|bc"。


    ## 图像和小部件


    与 canvas 小部件类似，文本小部件不仅可以包含文本，还可以包含图像和任何其他 Tk 小部件（甚至包括本身包含许多其他小部件的框架）。在某些意义上，这使得文本小部件可以作为一个独立的几何管理器。在文本中添加图像和小部件的功能为你的程序开启了无限可能。


    图像在特定索引处添加到文本小部件，图像通常指定为现有的 Tk 图像。还有其他选项允许你微调填充等。



