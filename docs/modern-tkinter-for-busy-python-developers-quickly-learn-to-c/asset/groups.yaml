    # # Geometry Management


    If you''ve been playing around creating widgets, you''ve probably noticed that
    just by creating them they didn''t end up showing up onscreen. Having things actually
    put in the onscreen window, and precisely where in the window they show up is
    a separate step called geometry management.


    In our example, this positioning was accomplished by the "grid" command, where
    we passed along the column and row we wanted each widget to go in, how things
    were to be aligned within the grid, and so on. Grid is an example of a geometry
    manager (of which there are several in Tk, grid being the most useful). We''ll
    talk about grid in detail in a later chapter, but for now we''ll look at geometry
    management in general.


    A geometry manager''s job is to figure out exactly where those widgets are going
    to be put. This turns out to be a very difficult optimization problem, and a good
    geometry manager relies on quite complex algorithms. A good geometry manager provides
    the flexibility, power and ease of use that makes programmers happy, and Tk''s"grid"
    is without a doubt one of the absolute best: A poor geometry manager... well,
    all the Java programmers who have suffered through "GridBagLayout" please raise
    their hands.


    # ## The Problem


    The problem for a geometry manager is to take all the different widgets the program
    creates, plus the instructions for where in the window the program would like
    things to go (explicitly, or more often, relative to other widgets), and then
    actually put them in the window.


    In doing so, the geometry manager has to balance a number of different constraints:


    +   * The widgets may have a "natural" size (e.g. the natural width of a label
    would normally be determined by the text and font in it), but the toplevel all
    these different widgets are trying to fit into isn''t big enough to accommodate
    them; the geometry manager must decide which widgets to shrink to fit, by how
    much, etc.


    +   * If the toplevel window is bigger than the natural size of all the widgets,
    how is the extra space used? Is it just used for extra space between widgets,
    and if so, how is that space distributed? Is it used to make certain widgets bigger
    than they normally want to be?


    +   * If the toplevel window is resized, how does the size and position of the
    widgets in it change? Will certain areas (e.g. a text entry area) expand or shrink,
    while other parts stay the same size, or is the area distributed differently?
    Do certain widgets have a minimum (or maximum) size that you want to avoid going
    under (over)?


    +   * How can widgets in different parts of the user interface be aligned with
    each other, to present a clean layout and match platform guidelines to do with
    inter-widget spacing?


    +   * For a complex user interface, which may have many frames nested in other
    frames nested in the window (etc.), how can all the above be accomplished, trading
    off the conflicting demands of different parts of the entire user interface?


    # ## How it Works


    Geometry management in Tk relies on the concept of master and slave widgets. A
    master is a widget, typically a toplevel window or a frame, which will contain
    other widgets, which are called slaves. You can think of a geometry manager as
    taking control of the master widget, and deciding what will be displayed within.


    The geometry manager will ask each slave widget for its natural size, or how large
    it would ideally like to be displayed. It then takes that information and combines
    it with any parameters provided by the program when it asks the geometry manager
    to manage that particular slave widget. In our example, we passed grid a "column"
    and "row" number for each widget, which indicated the relative position of the
    widget with respect to others, and also a "sticky" parameter to suggest how the
    widget should be aligned or possibly stretched. We also used "columnconfigure"
    and "rowconfigure" to indicate the columns and rows we''d like to have expand
    if there is extra space available in the window. Of course, all these parameters
    are specific to grid; other geometry managers would use different ones.'
