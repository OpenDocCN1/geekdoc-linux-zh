    `labelframe` 组件（通常也称为分组框）提供了另一种将相关组件分组的方式。它就像一个普通的 `tk.Frame`，通常用作容器，将其他组件放置在内部进行网格布局。然而，它的显示方式在视觉上使其与用户界面的其余部分区分开来。你可以选择提供文本标签，显示在标签框架的外部。


    ![](img/94378c1b05607c1dc5649c738af95c74_57_3.png)


    ![](img/94378c1b05607c1dc5649c738af95c74_57_4.png)


    ![](img/94378c1b05607c1dc5649c738af95c74_57_5.png)


    ### Labelframe 组件


    Labelframe 使用 `ttk.Labelframe` 函数创建：


    ```python

    lf = ttk.Labelframe(parent, text=''Label'')

    ```


    ## 窗格


    - 组件概览

    - 参考手册


    `panedwindow` 组件允许你将两个或更多可调整大小的组件垂直堆叠（或左右排列）。用户通过拖动位于窗格之间的分隔栏（sash）来调整每个窗格的相对高度（或宽度）。通常，添加到窗格中的组件是包含许多其他组件的框架。


    ![](img/94378c1b05607c1dc5649c738af95c74_58_0.png)


    窗格组件（此处显示管理多个标签框架）


    窗格使用 `ttk.Panedwindow` 函数创建：


    ```python

    p = ttk.Panedwindow(parent, orient=VERTICAL)

    # 第一个窗格，内部将网格布局组件：

    f1 = ttk.Labelframe(p, text=''Pane1'', width=100, height=100)

    f2 = ttk.Labelframe(p, text="Pane2", width=100, height=100) # 第二个窗格

    p.add(f1)

    p.add(f2)

    ```


    窗格可以是“垂直”的（其窗格垂直堆叠在彼此之上），也可以是“水平”的。重要的是，添加到窗格中的所有窗格都必须是该窗格本身的直接子级。


    调用“add”方法会在窗格列表的末尾添加一个新窗格。“insert position subwindow”方法允许你将窗格放置在窗格列表中的指定位置（0...n-1）；如果该窗格已由该窗格管理，它将被移动到新的位置。你可以使用“forget(subwindow)”从窗格中移除一个窗格；你也可以传递位置而不是子窗口。


    其他选项允许你为每个窗格指定相对权重，以便当整个窗格大小调整时，某些窗格将获得比其他窗格更多的空间。此外，你可以调整窗格中每个分隔栏的位置。有关详细信息，请参阅命令参考。


    ## 选项卡


    - 组件概览

    - 参考手册


    `notebook` 组件使用选项卡笔记本的比喻，让用户使用索引标签在几个页面之间切换。在这种情况下，与窗格不同，我们只允许用户一次查看单个页面（类似于一个窗格）。


    ![](img/94378c1b05607c1dc5649c738af95c74_59_0.png)


    ### Notebook 组件


    Notebook 使用 `tk.Notebook` 函数创建：


    ```python

    n = tk.Notebook(parent)

    f1 = ttk.Frame(n) # 第一页，内部将网格布局组件

    f2 = ttk.Frame(n) # 第二页

    n.add(f1, text=''One'')

    n.add(f2, text=''Two'')

    ```


    选项卡笔记本的操作与窗格类似。每个页面通常是一个框架，同样是笔记本本身的直接子级（子窗口）。使用“add subwindow ?option value...?”方法在标签列表的末尾添加新页面及其关联的标签。“text”标签选项用于设置标签上的文本；同样有用的是“state”标签选项，其值可以是“normal”、“disabled”（不可选择）或“hidden”。


    要在列表末尾以外的位置插入标签，可以使用“insert position subwindow ?option value...?”，要移除指定标签，请使用“forget”方法，传递位置（0..n-1）或标签的子窗口。你可以通过“tabs”方法获取包含在笔记本中的所有子窗口列表。


    要获取当前选中的子窗口，请调用“select”方法；通过传递标签的位置或子窗口本身作为参数来更改选中的标签。


    要更改标签选项（如标签上的文本标签或其状态），可以使用“tab(tabid, option=value)”方法（其中“tabid”再次是标签的位置或子窗口）；省略“=value”以返回选项的当前值。


    同样，命令参考中详细列出了许多不常用的选项和命令。


    ## 字体、颜色和图像


    本章描述了 Tk 如何处理字体、颜色和图像。我们之前已经接触过这些内容，但这里我们将提供更深入的介绍。


    ### 字体


    几个 Tk 组件，如 label、text 和 canvas，允许你指定用于显示文本的字体，通常通过“font”配置选项。与 Tk 中的许多事物一样，默认字体通常是不错的选择，但如果你确实想要进行修改，本节将描述几种方法。字体是几个高度平台相关的领域之一，因此如何指定它们很重要。


    字体命令参考提供了关于指定字体以及其它字体相关操作的完整细节。


    大多数显示文本的主题组件没有“font”配置选项，这与经典 Tk 组件不同。与其修改单个组件，在主题组件中正确的做法是指定样式中使用的字体，然后使用该样式为单个组件设置。这类似于在
    HTML 页面中硬编码面向显示的标记（如字体标签）与使用 CSS 样式表将所有显示特定信息集中在一处之间的区别。


    许多旧的 Tk 程序硬编码了大量字体，使用我们在下面看到的“family size style”格式、X11 字体名称或更旧且更晦涩的 X11 字体规范字符串。在许多情况下，随着平台的发展，这使得这些应用程序看起来过时了。此外，许多程序按单个组件指定字体，导致字体决策分散在整个程序中。使用命名字体以及
    Tk 提供的标准字体是更好的解决方案。审查和更新现有应用程序中的字体使用是一个简单且重要的改动。


    #### 标准字体


    特别是对于或多或少标准的用户界面元素，每个平台都定义了应使用的特定字体。Tk 将其中许多封装在一组始终可用的标准字体中，当然，标准组件使用这些字体。这有助于抽象平台差异。预定义的字体是：


    | 字体名称 | 描述 |

    |-----------------|-----------------------------------------------------------------------------|

    | TkDefaultFont   | 所有未特别指定的 GUI 项目的默认字体。 |

    | TkTextFont      | 用于 entry 组件、listbox 等。 |

    | TkFixedFont     | 标准固定宽度字体。 |

    | TkMenuFont      | 用于菜单项的字体。 |

    | TkHeadingFont   | 通常用于列表和表格列标题的字体。 |

    | TkCaptionFont   | 用于窗口和对话框标题栏的字体。 |

    | TkSmallCaptionFont | 用于子窗口或工具对话框的较小标题字体 |

    | TkIconFont      | 用于图标说明的字体。 |

    | TkTooltipFont   | 用于工具提示的字体。 |


    #### 平台特定字体


    还有一些可用的预定义字体，但具体集合取决于平台。显然，如果你使用这些字体，并且你的应用程序在不同平台之间可移植，你需要确保为每个平台单独定义适当的字体。


    在 X11 上，可以使用任何有效的 X11 字体名称（参见例如“xlsfonts”命令）。但请记住，没有保证特定字体已在特定机器上安装。


    在 Windows 上，可以使用以下映射到“显示”控制面板中可设置的字体的字体名称：`system, ansi, device, systemfixed,
    ansifixed, oemfixed`。


    在 Mac OS X 上，可以使用以下字体（详情参见 Apple HIG）：`systemSystemFont, systemSmallSystemFont,
    systemApplicationFont, systemViewsFont, systemMenuItemFont, systemMenuItemCmdKeyFont,
    systemPushButtonFont, systemAlertHeaderFont, systemMiniSystemFont, systemDetailEmphasizedSystemFont,
    systemEmphasizedSystemFont, systemSmallEmphasizedSystemFont, systemLabelFont,
    systemMenuTitleFont, systemMenuItemMarkFont, systemWindowTitleFont, systemUtilityWindowTitleFont,
    systemToolbarFont, systemDetailSystemFont`。


    #### 命名字体


    你还可以创建自己的字体，其用法与预定义字体完全相同。为此，你需要选择一个名称来引用该字体，然后指定定义字体外观的各种字体属性。通常，你会在不同平台上使用不同的字体属性；这样，你可以在程序中使用字体而无需担心细节，只需在字体实际定义的那个地方处理即可。


    这是一个示例：


    ```python

    from tkinter import font

    appHighlightFont = font.Font(family=''Helvetica'', size=12, weight=''bold'')

    ttk.Label(root, text=''Attention!'', font=appHighlightFont).grid()

    ```


