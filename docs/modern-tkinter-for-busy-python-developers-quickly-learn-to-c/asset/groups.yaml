  mdcn: "\n## 列表框（Listbox）\n+ 小部件综述\n+ 参考手册\n\n**列表框（listbox）** 显示单行文本项的列表（通常较长），并允许用户浏览该列表，选择一个或多个项。\n\
    \n列表框是经典 Tk 小部件的一部分；目前，主题化 Tk 小部件集中并没有列表框。\n\n*Tk 的树视图（treeview）小部件（已主题化）也可以用作列表框（即一级深度的树），允许你在列表中使用图标和样式。也很可能在某个时间点，基于现有扩展之一，一个多列（表格）列表小部件将加入\
    \ Tk。*\n\n![](img/94378c1b05607c1dc5649c738af95c74_35_0.png)\n\n使用 **Listbox**\
    \ 函数创建列表框：\n\n```python\nl = Listbox(parent, height=10)\n```\n\n### 填充列表框项\n\n\
    有一种简单的方法，也有一种困难的方法，来填充和管理包含在列表框中的所有项。\n\n这里介绍简单的方法。每个列表框都有一个“listvariable”配置选项，它允许你将一个变量（必须持有列表）与列表框关联。该列表中的每个元素都是表示列表框中一个项的字符串。因此，要向列表框中添加、删除或重新排列项，你只需像操作其他列表一样操作这个变量即可。类似地，要查看列表框第三行显示的是哪个项，只需查看列表变量的第三个元素即可。\n\
    \n*之所以存在困难方法，是因为“listvariable”选项仅在 Tk 8.3 中才引入。在此之前，你不得不使用困难方法。由于使用列表变量可以让你使用所有标准的列表操作，它提供了更简单的\
    \ API，如果你正在用较旧的方式处理列表框，这绝对是一个值得考虑的升级。*\n\n较旧、较困难的做法是使用一组属于列表框小部件本身的方法，这些方法操作（内部的）项列表：\n\
    \n-   • “insert idx item ?item... ?” 方法用于向列表中添加一个或多个项；“idx” 是一个基于 0 的索引，指示应在其之前添加项的位置；指定\
    \ “end” 可将新项放在列表末尾。\n-   • 使用 “delete first ?last?” 方法从列表中删除一个或多个项；“first” 和 “last”\
    \ 的索引定义如同 “insert” 方法。\n-   • 使用 “get first ?last?” 方法返回给定位置的单个项内容，或 “first” 和\
    \ “last” 之间项的列表。\n-   • “size” 方法返回列表中的项数。\n\n### 选择项\n\n你需要决定的第一件事是，用户是否可以一次只选择一个项，还是可以同时选择多个项。这由\
    \ “selectmode” 选项控制：默认情况下只能选择单个项（“browse”），而 “extended” 选择模式允许用户选择多个项。\n\n> *出于向后兼容性的原因，“browse”\
    \ 和 “extended” 这两个名称确实很差。更糟糕的是，还有另外两种模式 “single” 和 “multiple”，你**不应使用**它们（它们使用与现代表面界面和平台惯例不一致的旧交互样式）。*\n\
    \n要查找用户在列表框中当前选择的项或项，请使用 “curselection” 方法，它将返回当前所有选中项的索引列表；这可能是一个空列表，而对于选择模式为\
    \ “browse” 的列表，其长度永远不会超过一项。你还可以使用 “selection includes index” 方法来检查给定索引的项是否当前被选中。\n\
    \n要以编程方式更改选择，你可以使用 “selection clear first ?last?” 方法取消选择单个项或指定索引范围内的任何项。要选择一项或范围内所有项，请使用\
    \ “selection set first ?last?” 方法。这两种方法都不会影响指定范围之外项的选择状态。\n\n如果你更改了选择，还应确保新选择的项对用户可见（即未被滚动到视野之外）。为此，请使用\
    \ “see index” 方法。\n\n当用户更改选择时，会生成 “<ListboxSelect>” 虚拟事件。你可以绑定此事件以执行所需的任何操作。根据你的应用程序，你可能还希望绑定双击\
    \ “Double-1” 事件，并使用它对当前选中的项执行某个动作。\n\n### 样式化列表\n\n与大多数“经典”Tk 小部件一样，你在修改列表框外观方面拥有巨大的灵活性。如参考手册所述，你可以修改列表框项显示所用的字体、正常状态下项的前景色（文本）和背景色、选中时的状态、小部件禁用时的状态等等。还有一个\
    \ “itemconfigure” 方法，允许你更改单个项的前景色和背景色。\n\n通常，克制是有用的。一般来说，默认值完全适用，并且与平台惯例良好匹配。在我们即将看到的示例中，我们将展示如何克制地使用这些选项以产生良好效果，在本例中是显示列表框的交替行采用略微不同的颜色。\n\
    \n### 保留额外项数据\n\n“listvariable”（或内部列表，如果你是用旧方法管理的话）包含将在列表框中显示的字符串。然而，很多时候你程序中的每个字符串都关联着其他数据项，你真正关心的不是列表框中显示的字符串，而是关联的数据项。例如，包含姓名的列表框可能是呈现给用户的内容，但你的程序真正关心的是选中的用户对象（或\
    \ ID 号），而不是特定的姓名。\n\n我们如何将此值与显示的姓名关联起来？不幸的是，列表框小部件本身不提供任何机制，因此我们必须单独管理。有几种明显的方法。首先，如果显示的字符串保证唯一，你可以使用哈希表将姓名映射到关联对象。因此，给定姓名，你可以轻松获取关联对象。这可能不适用于处理姓名，但例如可用于选择国家。\n\
    \n第二种方法是保留第二个列表，与显示在列表框中的字符串列表平行，用于保存关联对象。因此，字符串列表中的第一项对应对象列表中的第一项，第二项对应第二项，依此类推。你在一个列表中进行的任何更改（插入、删除、重新排序），都需要在另一个列表中进行。然后，你可以基于它们在列表中的位置，轻松地将列表项映射到基础对象。\n\
