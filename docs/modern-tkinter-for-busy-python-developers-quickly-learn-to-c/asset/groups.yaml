    # ## Querying and Changing Item Options


    Like most everything in Tk, you can look at or change the value of an item’s options
    at any time. Items are referred to via an index. Normally, this is a number (0...n-1)
    indicating the item’s position in the menu, but you can also specify the label
    of the menu item (or in fact, a “glob-style” pattern to match against the item’s
    label).


    ```

    print( menu_.file.entrycget(0, ''label'') )

    menu_.file.entryconfigure(''Close'', state=DISABLED)

    print( menu_.file.entryconfigure(0) )

    ```


    # # Platfornm Menus


    Each platform has a few menus that are handled specially by Tk.


    # ## Mac OS X


    On Mac OS X, there are two menus that are treated specially. The application menu
    is the second menu in the menubar, titled with your application name. It will
    have any menu items you add to it, then following that, the standard application
    menu items (preferences, services, hide/show, and quit) are automatically added
    by Tk. The second special menu is the help menu, which is always placed as the
    last menu on the menubar. Again, along with the items you add, Tk will add others
    expected by the system (nothing on Tiger, a search box on Leopard).


    ```

    apple = Menu(menubar, name=''apple'')

    help = Menu(menubar, name=help)

    menubar.add_cascade(menu=apple)

    menubar.add_cascade(menu=help)

    ```


    > While normally Tkinter chooses a widget path name for us, here we’ve had to
    explicitly provide one using the ''name'' option. Naming the menus ''apple'' and
    ''help'' are the cues that Tk needs to recognize them as special.


    > The application menu, which is the one we’re dealing with here, is distinct
    from the apple menu (the one with the apple icon, just to the left of the application
    menu). Despite that we do really mean the application menu, in Tk it is still
    referred to as the “apple” menu. This is a holdover from pre-OS X days, when these
    sorts of items did go in the actual apple menu, and there was no separate application
    menu.


    It’s normal practice to add an “About appname” command item to the Application
    menu, followed by a separator item. When invoked this should display your application’s
    about box.


    ```

    PYHONTODO

    ```


    # ## Windows


    On Windows, each window has a “System” menu at the top left of the window frame,
    with a small icon for your application. It contains items like “Close”, “Minimize”,
    etc. In Tk, if you create a system menu, you can add new items that will appear
    below the standard items.


    ```

    sysmenu = Menu(menubar, name=''system'')

    menubar.add_cascade(menu=sysmenu)

    ```


    > While normally Tkinter will choose a widget path name for us, here we’ve had
    to explicitly provide one with the name ''system''; this is the cue that Tk needs
    to recognize it as the system menu.


    # ## X11


    On X11, if you create a help menu, Tk will ensure that it is always the last menu
    in the menubar.'
  - "[PAGE 50]\n\n```\nmenu_help = Menu(menubar, name='help')\nmenubar.add_cascade(menu=menu_help,\
    \ label='Help')\n```\n\n> The widget pathname of the menu must be explicitly provided,\
    \ in this case with the name 'help'. This can be specified for any Tkinter widget\
    \ using the 'name' option when creating the widget.\n\n# Contextual Menus\n\n\
    Contextual menus (\"popup\" menus) are typically invoked by a right mouse button\
    \ click on an object in the application. A menu pops up at the location of the\
    \ mouse cursor, and the user can select from one of the items in the menu (or\
    \ click outside the menu to dismiss it without choosing any item).\n\nTo create\
    \ a contextual menu, you'll use exactly the same commands you did to create menus\
    \ in the menubar. Typically, you'll create one menu with several command items\
    \ in it, and potentially some cascade menu items and their associated menus.\n\
    \nTo activate the menu, the user will use a contextual menu click, which you will\
    \ have to bind to. That however, can mean different things on different platforms.\
    \ On Windows and X11, this is the right mouse button being clicked (the third\
    \ mouse button). On Mac OS X, this is either a click of the left (or only) button\
    \ with the control key held down, or a right click on a multi-button mouse. Unlike\
    \ Windows and X11, Mac OS X refers to this as the second mouse button, not the\
    \ third, so that's the event you'll see in your program.\n\n> Most earlier programs\
    \ that have used popup menus assumed it was only \"button 3\" they needed to worry\
    \ about.\n\nBesides capturing the correct contextual menu event, you'll also need\
    \ to capture the location the mouse was clicked. It turns out you need to do this\
    \ relative to the entire screen (global coordinates) and not local to the window\
    \ or widget you clicked on (local coordinates). The \"%X\" and \"%Y\" substitutions\
    \ in Tk's event binding system will capture those for you.\n\nThe last step is\
    \ simply to tell the menu to popup at the particular location. Here's an example\
    \ of the whole process, using a popup menu on the application's main window.\n\
    \n```\nfrom tkinter import *\nroot = TK()\nmenu = Menu(root)\nfor i in ('One',\
    \ 'Two', \"Three\"):\n    menu.add_command(label=i)\nif (root.tk.call('tk', 'windowingsystem')==\
    \ 'aqua'):\n    root.bind('<2>', lambda e: menu.post(e.x_root, e.y_root))\n  \
    \  root.bind('<Control-1>', lambda e: menu.post(e.x_root, e.y_root))\nelse:\n\
    \    root.bind('<3>', lambda e: menu.post(e.x_root, e.y_root))\n```\n\n# Windows\
    \ and Dialogs\n\nEverything we've done up until now has been in a single window.\
    \ In this chapter, we'll cover how to use multiple windows, changing various attributes\
    \ of windows, and use some of the standard dialog box windows that are available\
    \ in Tk."
