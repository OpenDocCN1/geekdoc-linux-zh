    # Bindings


    We''ve already seen that the canvas widget as a whole, like any other Tk widget,
    can capture events using the"bind" command.


    You can also attach bindings to individual items in the canvas (or groups of them,
    as we''ll see in the next section using tags). So if you want to know whether
    or not a particular item has been clicked on, you don''t need to watch for mouse
    click events for the canvas as a whole, and then figure out if that click happened
    on your item. Tk will take care of all this for you.


    To capture these events, you use a bind command built into the canvas. It works
    exactly like the regular bind command, taking an event pattern and a callback.
    The only difference is you specify the canvas item this binding applies to.


    ```

    canvas.tag\_bind(id, ''<1>'',...)

    ```


    > Note the difference between the item-specific “tag\_bind” method, and the widget-level“bind”
    method.


    Let''s add some code to our sketcpad example to allow changing the drawing color.
    We''ll first create a few different rectangle items, each filled with a different
    color. Creating rectangle items is just like creating line items, where you''ll
    specify the coordinates of two diagonally opposite corners. We''ll then attach
    a binding to each of these so that when they''re clicked on, they''ll set a global
    variable to the color to use. Our mouse motion binding will look at that variable
    when creating the line segments.


    ```

    color = "black"\ndef setColor(newcolor):\n    global color\n    color = newcolor\n\ndef
    addLine(event):\n    global lastx, lasty\n    canvas.create\_line((lastx, lasty,
    event.x, event.y), fill=color)\n    lastx, lasty = event.x, event.y\n\nid = canvas.create\_rectangle((10,
    10, 30, 30), fill="red")\ncanvas.tag\_bind(id, "<Button-1>", lambda x: setColor("red"))\nid
    = canvas.create\_rectangle((10, 35, 30, 55), fill="blue")\ncanvas.tag\_bind(id,
    "<Button-1>", lambda x: setColor("blue"))\nid = canvas.create\_rectangle((10,
    60, 30, 80), fill="black")\ncanvas.tag\_bind(id, "<Button-1>", lambda x: setColor("black"))

    ```


    # Tags


    We''ve seen that every canvas item has a unique id number, but there is another
    very useful and powerful way to refer to items on a canvas, and that is using
    tags.


    A tag is just an identifier of your creation, something meaningful to your program.
    You can attach tags to canvas items; each item can have any number of tags. Unlike
    item id numbers, which are unique for each item, many items can have the same
    tag.


    What can you do with tags? We saw that you can use the item id to modify a canvas
    item (and we''ll see soon there are other things you can do to items, like move
    them around, delete them, etc.). Any time you can use an item id, you can use
    a tag. So for example, you can change the color of all items having a specific
    tag.


    Tags are a good way to identify certain types of items in your canvas (items that
    are part of a drawn line, items that are part of the palette, etc.). You can use
    tags to correlate canvas items to particular objects in your application (so for'
