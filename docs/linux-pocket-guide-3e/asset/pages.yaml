  md: '# Network Connections


    +   - ssh Securely log into a remote host, or run commands on it.


    +   - scp Securely copy files to/from a remote host (batch).


    +   - sftp Securely copy files to/from a remote host (interactive).


    +   - ftp Copy files to/from a remote host (interactive, insecure!).


    +   - netcat Create arbitrary network connections.


    With Linux, it''s easy to establish network connections from one machine to another
    for remote logins and file transfers. Make sure you do it securely.


    ```

    ssh stdin stdout -file --opt --help --version

    ssh [options] host [command]

    ```


    The ssh (Secure Shell) program securely logs you into a remote machine where you
    already have an account:


    +   - ssh remote.example.com


    Alternatively, it can invoke a program on that remote machine without logging
    you in:


    +   - ssh remote.example.com who


    ssh encrypts all data that travels across its connection, including your username
    and password (which you''ll need to access the remote machine). The SSH protocol
    also supports other ways to authenticate, such as public keys and host IDs. See
    man ssh for details.


    # Useful options


    +   - l user Specify your remote username; otherwise, ssh assumes your local username.
    You can also use the syntax username@host:


    +   - ssh smith@server.example.com'
  merge: -1
  pgno: 184
- img_proc: true
  md: '-p port Use a port number other than the default (22).


    -t Allocate a tty on the remote system; useful when trying to run a remote command
    with an interactive user interface, such as a text editor.


    -v Produce verbose output, useful for debugging.


    # scp stdin stdout -file --help --version


    scp local_spec remote_spec command copies files and directories


    The scp (secure copy) command copies files and directories from one computer to
    another in batch. (For an interactive user interface, see sftp.) It encrypts all
    communication between the two machines. As a simple example, scp can copy a local
    file to a remote machine:


    +   -> scp myfile remote.example:newfile


    recursively copy a directory to a remote machine:


    +   -> scp -r mydir remote.example.com:


    copy a remote file to your local machine:


    +   -> scp remote.example.com:myfile .


    or recursively copy a directory to your local machine:


    +   -> scp -r remote.example.com:mydir .


    To specify an alternate username on the remote system, use the username@host syntax:


    +   -> scp myfile smith@remote.example.com:


    # Useful options


    +   -p Duplicate all file attributes (permissions, timestamps) when copying.


    +   -r Recursively copy a directory and its contents.


    +   -v Produce verbose output, useful for debugging.'
