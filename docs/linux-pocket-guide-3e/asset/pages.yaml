    # mail stdin stdout -file --opt --help --version


    mail [options] recipient


    The mail program is a quick, simple email client. Most people want a more powerful
    program for regular use, but for quickly messages from the command line or in
    scripts, mail is really handy.


    To send a quick message:


    +   - mail smith@example.com

    Subject: my subject

    I''m typing a message.

    To end it, I type a period by itself on a line.

    Cc: jones@example.com


    To send a quick message using a single command, use a pipe-line:


    +   - echo "Hey!" | mail -s "subject" smith@example.com


    To mail a file using a single command, you can use redirection or a pipeline:


    +   - mail -s "my subject" smith@example.com < filename

    - cat filename \

    | mail -s "my subject" smith@example.com


    Notice how easily you can send the output of a pipeline as an email message; this
