  md: 'pdftk is the “Swiss Army knife” of PDF commands. This versatile program can
    extract pages from a PDF file, join PDFs into one, rotate pages, add watermarks,
    encrypt and decrypt files, and much more, all from the command line. This power
    comes with complicated syntax, unfortunately, but with a little effort you can
