    # Piping to bash


    Bash is not just a shell; it’s also a command, bash, that reads from standard
    input. This means you can construct commands as strings and send them to bash
    for execution:


    +   - echo wc -l myfile

    - wc -l myfile

    - echo wc -l myfile | bash

    18 myfile


    # Bash Warning


    > Piping commands into bash is powerful but can also be dangerous. First make
    sure you know exactly which commands will be executed. You don''t want to pipe
    an unexpected rm command to bash and delete a valuable file (or 1,000 valuable
    files).


    > If someone asks you to retrieve a web page (say, with the curl command) and
    pipe it blindly into bash, don''t you Instead, capture the web page as a file
    (with curl or wget), examine it closely, and make an informed decision whether
    to execute it with bash.


    This technique is incredibly useful. Suppose you want to download the files photo1.jpg,
    photo2.jpg, through photo100.jpg from a website. Instead of typing 100 wget commands
    by hand, construct the commands with a loop, using seq to construct the list of
    integers from 1 to 100:'
  merge: -1
  pgno: 251
- img_proc: true
  md: "```\n→ for i in `seq 1 100`\ndo\n  echo wget http://example.com/photo$i.jpg\n\
    done\nwget http://example.com/photo1.jpg\nwget http://example.com/photo2.jpg\n\
    ...\nw http://example.com/photo100.jpg\n```\n\nYes, you've constructed the text\
    \ of 100 commands. Now pipe the output to bash, which will run all 100 commands\
    \ as if you'd typed them by hand:\n\n```\n→ for i in `seq 1 100`\ndo\n  echo wget\
    \ http://example.com/photo$i.jpg\ndone | bash\n```\n\nHere's a more complex but\
    \ practical application. Suppose you have a set of files you want to rename. Put\
    \ the old names into a file oldnames, and the new names into a file newnames:\n\
    \n+   - cat oldnames\noldname1\noldname2\noldname3\n\n+   - cat newnames\nnewname1\n\
    newname2\nnewname3\n\nNow use the commands paste and sed (“File Text Manipulation”\
    \ on page 92) to place the old and new names side by side and prepend the word\
    \ “mv” to each line, and the output is a sequence of “mv” commands:\n\n```\n→\
    \ cat oldnames | paste -d' ' oldnames newnames \\\n| sed 's/^/mv /'\nnm oldfile1\
    \ newfile1\nm oldfile2 newfile2\nm oldfile3 newfile3\n```\n\nFinally, pipe the\
    \ output to bash, and the renaming takes place!"
  merge: -1
