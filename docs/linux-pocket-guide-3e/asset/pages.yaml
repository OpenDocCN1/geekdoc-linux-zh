  md: 'To see the ownership and permissions of a file named myfile,

    run:


    ```

    ls -l myfile

    -rw-r--r-- 1 smith 1168 Oct 28 2015 myfile

    ```


    To see the ownership and permissions of a directory named mydir, add the -d option:


    ```

    ls -ld mydir

    drwxr-x--x 3 smith smith 4096 Jan 08 15:02 mydir

    ```


    In the output, the file permissions are the 10 leftmost characters, r (read),
    w (write), x (execute), other letters, and dashes. For example:


    ```

    -rwxr-x--x

    ```


    Here’s what these letters and symbols mean:


    | Position | Meaning |

    | --- | --- |

    | 1 | File type: - = file, d = directory, l = symbolic link, p = named pipe, c
    = character device, b = block device |

    | 2–4 | Read, write, and execute permissions for the file’s owner |

    | 5–7 | Read, write, and execute permissions for the file’s group |

    | 8–10 | Read, write, and execute permissions for all other users |


    So our example -rwxr-x--x means a file that can be read, written, and executed
    by the owner, read and executed by the group, and not accessed by all other users.
    We describe ls in more detail in “Basic File Operations” on page 47. To change
    the owner, group ownership, or permissions of a file, use the chown, chgrp, and
    chmod commands, respectively, as described in “File Properties” on page 69.


