    Setuid and setgid, when applied to executable files (programs and scripts), have
    a powerful effect. Suppose we have an executable file F owned by user “smith”
    and the group “friends”. If file F has setuid (set user ID) enabled, then anyone
    who runs F will “become” user “smith”, with all her rights and privileges, for
    the duration of the program. Likewise, if F has setgid (set group ID) enabled,
    anyone who executes F becomes a member of the “friends” group for the duration
