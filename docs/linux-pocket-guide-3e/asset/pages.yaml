    # File Protections


    A Linux system may have many users with login accounts. To maintain privacy and
    security, most users can access only some files on the system, not all. This access
    control is embodied in two questions:


    Who has permission?


    Every file and directory has an owner who has permission to do anything with it.
    Typically, the user who created a file is its owner, but ownership can be changed
    by the superuser.


    Additionally, a predefined group of users may have permission to access a file.
    Groups are defined by the system administrator and are covered in “Group Management”
    on page 167.


    Finally, a file or directory can be opened to all users with login accounts on
    the system. You''ll also see this set of users called the world or simply other.


    What kind of permission is granted?


    File owners, groups, and the world may have permission to read (modify), and execute
    (run) particular files. Permissions also extend to directories, which users may
    read (access files within the directory), write (create and delete files within
    the directory), and execute (enter the directory with cd).'
