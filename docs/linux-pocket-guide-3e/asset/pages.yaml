  md: '# Copy and Paste


    xclip Copy and paste between the shell and the clipboard.


    xsel Manipulate the clipboard from the shell.


    Linux has a clipboard for copying and pasting between graphical applications.
    Actually, Linux has three different clipboards, which are called *selections*.
    You can access the selections from the command line, sending the output of any
    shell command to the selection, or reading the selection as standard input. Note
    that these commands work only if your shell is running in a graphical environment
    such as GNOME or KDE. Otherwise, no selection exists.


    # xclip stdin stdout -file --opt -help -version


    xclip [options]


    xclip reads and writes the three Linux selections (clipboards), so you can copy
    and paste text between the shell and graphical applications.


    To see it in action, use your mouse to copy some text to a selection—say, double-click
    a word in your terminal window—and then run:


    +   → xclip -o


    The text you copied will be printed on standard output.


    As another example, copy the contents of a file to a selection, and then print
    the selection:


    +   → cat poem See the file

    Once upon a time, there was a little operating system named Linux, which everybody
    loved.

    → cat poem | xclip -i Pipe file to selection

    → xclip -o Print selection'
