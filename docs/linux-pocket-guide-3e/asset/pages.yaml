  md: '# The Filesystem


    To make use of any Linux system, you need to be comfortable with Linux files and
    directories (a.k.a. folders). In a “windows and icons” system, the files and directories
    are obvious on screen. With a command-line system like the Linux shell, the same
    files and directories are still present but are not constantly visible, at times
    you must remember which directory you are “in” and how it relates to other directories.
    You''ll use shell commands like cd and pwd to “move” between directories and keep
    track of where you are.


    Let''s cover some terminology. As we''ve said, Linux files are collected into
    directories. The directories form a hierarchy, or tree, as in Figure 3: one directory
    may contain other directories, called subdirectories, which may themselves contain
    other files subdirectories, and so on, into infinity. The topmost directory is
    called the root directory and is denoted by a slash (/).³


    ![](img/3a5633af7cd0f699cfdf1067df3b494c_22_0.png)


