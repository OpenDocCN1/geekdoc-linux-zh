    so don''t use them unless you really know what you''re doing. One misplaced chmod
    +s can leave your whole system vulnerable to attack.


    The sticky bit, most commonly used for /tmp directories, controls removal of files
    in that directory. Normally, if you have write permission in a directory, you
    can delete or move files within it, even if you don''t have access to the files
    themselves. Inside a directory with the sticky bit, you need write permission
    on a file in order to delete or move it.


