  md: "# Becoming the Superuser\n\nNormal users, for the most part, can modify only\
    \ the files they own. One special user, called the superuser or root, has full\
    \ access to the machine and can do anything on it. You should rarely need superuser\
    \ privileges; and in fact, you should use them only when absolutely necessary,\
    \ to avoid harming your Linux system.\n\nYou can become the superuser in several\
    \ ways. One is to use the sudo command to gain superuser abilities for the duration\
    \ of a single command. Simply type \"sudo\" followed by the command. You may be\
    \ prompted for your password, depending on how sudo is configured on your machine:\n\
    \n+   - sudo rm protected_file\n  Password: ******** Your own password\n\nTo make\
    \ your superuser powers last for multiple commands, you can run a shell with sudo:\n\
    \n+   - sudo bash\n\nThis is convenient, say, before browsing through many protected\
    \ directories with cd. When finished executing commands as the superuser, type\
    \ ^D or run exit to end the superuser shell and become yourself again. If you\
    \ forget whether your shell is a superuser shell or just a normal one, check your\
    \ identity normal one, check your identity with the whoami command. If you're\
    \ the superuser, it will display root.\n\nAnother way to become the superuser\
    \ is the su command, which also creates a superuser shell, but you'll need a different\
    \ password, called the root password, to use it. If you don't know the root password\
    \ on the system, you can't use su. (If you installed Linux yourself, you chose\
    \ the root password during installation):\n\n+   - su -l\n  Password: ********\
    \ root password\n#"
  merge: -1
