  md: '+   - You can process your mailboxes with any command-line tools, such as grep,
    because mail files are plain text.


    +   - You can manually retrieve messages from your mail server at the command
    line with the fetchmail command. Using a simple configuration file, this command
    can reach out to IMAP and POP servers and download mail in batch. See man fetchmail.


    +   - Your system can run a mail server, such as postfix and sendmail, to handle
    the most complex mail delivery situations.


    +   - You can control local mail delivery in sophisticated ways with the procmail
    command, which filters arriving email messages through any arbitrary program.
    For more information, see man procmail.


    +   - Spam filtering is sophisticated on Linux: check out the SpamAssassin suite
    of programs. You can run it personally on your incoming email, or at the server
    level for large numbers of users.


    In short, email is not limited to the features of your mail-reading program. Investigate
