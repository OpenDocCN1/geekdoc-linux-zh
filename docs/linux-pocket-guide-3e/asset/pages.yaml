  md: 'ls never knows you used a wildcard: it sees only the final list of filenames
    after the shell expands the wildcard. This means every Linux command, regardless
    of its origin, works with wildcards and other shell features. This is a critically
    important point. A surprising number of Linux users mistakenly think that programs
    expand their own wildcards. They don''t. Wildcards are handled completely by the
    shell before the associated program even runs.


    # Dot Files


    Filenames with a leading period, called dot files, are special in Linux. When
    you name a file beginning with a period, it will not be displayed by some programs:


    +   * ls will omit the file from directory listings, unless you provide the -a
    option.

    * Shell wildcards do not match a leading period.


    Effectively, dot files are hidden unless you explicitly ask to see them. As a
    result, sometimes they are called "hidden files."


    Wildcards never match two characters: a leading period, and the directory slash
    (/). These must be given literally, as in .profile* or /etc/*conf to match all
    filenames ending in conf in the /etc directory.


    | Wildcard | Meaning |

    | * | Zero or more consecutive characters |

    | ? | Any single character |

    | [set] | Any single character in the given set, most commonly a sequence of characters,
    like [aeiouIOU] for all vowels, or a range with a dash, like [A-Z] for all capital
    letters |

    | [set] | Any single character not in the given set, such as [^0-9] to mean any
    nondigit |'
