  md: 'All Linux shells have job control: the ability to run commands in the background
    (multitasking behind the scenes) and foreground (running as the active process
    at your shell prompt). A job is simply the shell''s unit of work. When you run
    a command interactively, your current shell tracks it as a job. When the command
    completes, the associated job disappears. Jobs are at a higher level than Linux
    processes; the Linux operating system knows nothing about them. They are merely
    constructs of the shell. Here is some important vocabulary about job control:


    # Foreground job


    Running in a shell, occupying the shell prompt so you cannot run another command


    # Background job


    Running in a shell, but not occupying the shell prompt, you can run another command
    in the same shell


    # Suspend


    To stop a foreground job temporarily


    # Resume


    To cause a suspended job to start running in the foreground again


    # jobs


    The built-in command jobs lists the jobs running in your current shell:


    +   - jobs

    [1]- Running emacs myfile &\n[2]+ Stopped ssh example.com


    The integer on the left is the job number, and the plus sign identifies the default
    job affected by the fg (foreground) and bg (background) commands.'
