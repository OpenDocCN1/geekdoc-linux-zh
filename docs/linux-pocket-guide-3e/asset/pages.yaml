  md: '# Instant Messaging


    write Send messages to a terminal.


    mesg Prohibit write.


    tty Print your terminal device name.


    sendxmpp Send instant messages via XMPP (Jabber).


    profanity Text-based XMPP client.


    irssi Text-based IRC client.


    Linux provides two types of instant messaging. The first is for contacting other
    users on the same Linux machine, using an ancient command called write. The second
    is modern instant messaging, with commands such as sendxmpp. In the second case,
    it''s more common to use a graphical instant messaging program such as pidgin
    (http://www.pidgin.im/), but command-line tools are helpful if you aren''t using
    a graphical desktop.


    # write stdin stdout -file --opt --help --version


    write user [tty]


    The write program sends lines of text from one logged-in user to another on the
    same Linux machine:


    +   → write smith

    Hi, how are you?

    See you later.

    ^D


    ^D ends the connection. write is also useful in pipelines for quick one-off messages:


    +   → echo ''Howdy!'' | write smith


    The related command wall sends a message to all logged-in users at once:'
