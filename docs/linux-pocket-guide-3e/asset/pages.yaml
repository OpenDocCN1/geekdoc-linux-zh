  md: "# Loops\n\nThe while loop repeats a set of commands as long as a condition\
    \ is true.\n\n```\nwhile command          While the exit status of command is\
    \ 0\n  do\n    body\n  done\n```\n\nFor example:\n\n+   -> cat script-while\n\
    !/bin/bash\ni=0\nwhile [ $i -lt 3 ]\ndo\n    echo \"$i\"\n    i=`expr $i + 1`\n\
    done\n-> ./script-while\n\nThe until loop repeats until a condition becomes true:\n\
    \n```\nuntil command          While the exit status of command is nonzero\n  do\n\
    \    body\n  done\n```\n\nFor example:\n\n+   -> cat script-until\n!/bin/bash\n\
    i=0\nuntil [ $i -ge 3 ]\ndo\n    echo \"$i\"\n    i=`expr $i + 1`\ndone\n-> ./script-until"
  merge: -1
  pgno: 247
- img_proc: true
  md: "0\n\n1\n\n2\n\nBe careful to avoid infinite loops, using while with a condition\
    \ that always evaluates to 0 (true), or until with a condition that always evaluates\
    \ to a nonzero value (false):\n\n```\ni=1\nwhile [ $i -lt 10 ]\ndo\n  echo \"\
    forever\"\ndone\n```\n\nVariable i never changes. Infinite!\n\nAnother type of\
    \ loop, the for loop, iterates over values from a list:\n\n```\nfor variable in\
    \ list\ndo\n  body\ndone\n```\n\nFor example:\n\n```\n→ cat script-for\n!/bin/bash\n\
    for name in Tom Jane Harry\ndo\n  echo \"$name is my friend\"\ndone\n→ ./script-for\n\
    ```\n\nTom is my friend\nJane is my friend\nHarry is my friend\n\nThe loop is\
