- img_proc: true
  md: '# Supplied programs


    Thousands of programs for file manipulation, text editing, mathematics, web browsing,
    audio, video, computer programming, typesetting, encryption, DVD burning...you
    name it.


    # The shell


    A user interface for typing commands, executing them, and displaying the results.
    Linux has various shells: the Bourne shell, Korn shell, C shell, and others. This
    book focuses on bash, the Bourne-Again Shell, which is often the default for user
    accounts. However, all shells have similar basic functions.


    # X


    A graphical system that provides windows, menus, icons, mouse support, and other
    familiar GUI elements. More complex graphical environments are built on X; the
    most popular are KDE and GNOME. We will discuss only a few programs that open
    X windows to run.


    This book focuses on the second and third parts: supplied programs and the shell.


    # Running a Shell


    If you connect to a Linux machine over a network, you will immediately see a shell,
    waiting for you to type a command. If instead, you sit down in front of a Linux
    machine and log into it directly, you''re more likely to be greeted by a desktop
    of icons and menus, with no shell in sight. For many users, this is the primary
    way to work with Linux, and those icons and menus are fine for simple tasks such
    as reading email and browsing the Web. Nevertheless, for the true power of Linux,
    you must dive beneath this graphical interface, into the shell. It might initially
    be more difficult than icons and menus, but once you''re accustomed to it, the
    shell becomes easy to use and is very powerful.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'So, how do you run a shell within this graphical interface? The answer is “it
    depends.” Linux has several graphical interfaces, the most common being GNOME
    and KDE, and every Linux system may configure them differently! It’s your job
    to locate an icon or menu item that lets you open a shell window: a window with
    a shell running in it. Look in your system’s main menu or start menu for an application
    called Terminal, Konsole, xterm, gnome-terminal, uxtermm, or something similar.
    Launch this program to open a shell window.


    The window program (Terminal, Konsole, etc.) is not the shell. It''s just a graphical
    program—possibly with fancy features of its own—that runs a shell on your behalf.
    The shell is what prompts you for commands and runs them. Figure 2 illustrates
    this difference.


    ![](img/3a5633af7cd0f699cfdf1067df3b494c_20_0.png)


    Figure 2. The difference between a shell window and the shell


    This was just a quick introduction. We’ll discuss additional details in “Shell
    Features” on page 26, and cover more powerful constructs in “Programming with
    Shell Scripts” on page 232.


    # Input and Output


    Most Linux commands accept input and produce output. For example, the wc command
    accepts input from a file and pro-'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'duces output (the number of lines, words, and characters) on the screen.


    Linux commands are very flexible with input and output. Input can come from files
    or standard input, which is usually your keyboard. Likewise, output is written
    to files or standard output, which is usually your shell window or screen. Error
    messages are treated specially and displayed on standard error, which is also
    usually your screen but kept separate from standard output. Later, we will see
    how to redirect standard input, output, and error to files or pipes. When we say
    a command “reads” we mean from standard input unless we say otherwise. And when
    a command “writes” or “prints,” we mean standard output, unless we’re talking
    about computer printers.


    # Users and Superusers


    Linux is a multiuser operating system: multiple people can use a single Linux
    computer at the same time. With a given computer, each user is identified by a
    username, like “smith” or “funkyguy,” and owns a (reasonably) private part of
    the system for working.


    There is also a special user named root—the superuser—who has the privileges to
    do anything at all on the system. Ordinary users are restricted: though they can
    run most programs, in general they can modify only the files they own. The superuser,
    on the other hand, can create, modify, or delete any file and run any program;
    we will discuss this more in “Becoming the Superuser” on page 166.


    > 2 For example, you can capture standard output in a file and still have standard
    error messages appear on screen.'
