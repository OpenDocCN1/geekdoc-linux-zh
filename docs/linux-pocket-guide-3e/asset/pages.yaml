    # mutt stdin stdout -file --opt --help --version


    mutt [options]


    Mutt is a text-based mailer that runs in an ordinary terminal (or terminal window),
    so it can be used locally (e.g., in an X terminal window) or remotely over an
    SSH connection. It is very powerful, with many commands and options. To invoke
