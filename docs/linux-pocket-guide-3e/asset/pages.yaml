    # ftp stdin stdout -file --opt --help --version


    ftp [options] host

    The popular ftp (File Transfer Protocol) program copies files between computers,
    but not in a secure manner: your user-name and password travel over the network
    as plain text. Use sftp instead if your remote server supports it.

    The same commands we listed for sftp also work for ftp. (However, the two programs
