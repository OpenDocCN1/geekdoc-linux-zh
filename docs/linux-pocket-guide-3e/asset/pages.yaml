    # Logins, Logouts, and Shutdowns


    We assume you know how to log into your Linux account. To log out using GNOME
    or KDE, choose Logout from the main menu. To log out from a remote shell, just
    close the shell (type exit or logout).


    Never simply turn off the power to a Linux system: it needs a more graceful shutdown.
    To perform a shutdown from GNOME or KDE, use the main menu. To perform a shutdown
    from a shell, run the shutdown or systemctl command as the superuser, as follows.


    ```

    shutdown          stdin shutdown -file --opt --help --version

    ```


    ```

    shutdown [options] time [message]

