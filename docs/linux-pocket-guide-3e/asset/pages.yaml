  md: '# wc -lw myfile Same as -l -w


    though some programs are quirky and do not recognize combined options. Multiple
    arguments are also OK:


    wc -l myfile myfile2 Count lines in two files


    Options are not standardized. They may be a single dash and one character (say,
    -l), two dashes and a word (--lines), or several other formats. The same option
    may have different meanings to different programs: in the command wc -l, the option
    -l means "lines of text," but in ls -l it means "longer output." Two programs
    might also use different options to mean the same thing, such as -q for "run quietly"
    versus -s for "run silently." Some options are followed by a value, such as -s
    10, and space between them might not be required (-s10).


    Likewise, arguments are not standardized. They usually represent filenames for
    input or output, but they can be other things, like directory names or regular
    expressions.


    Commands can be more interesting than just a single program with options:


    +   - Commands can run several programs at a time, either in sequence (one program
    after another) or in a "pipeline" with the output of one command becoming the
    input of the next. Linux experts use pipelines all the time.


    +   - The Linux command-line user interface—the shell—has a programming language
    built in. Instead of a command saying "run this program," it might say, "run this
    program, write its output to a file of my choosing, and if any errors occur.\"


    # Shell prompts


    Before you can type a command, you must wait for the shell to display a special
    symbol, called a prompt. A prompt means,"I am waiting for your next command."
