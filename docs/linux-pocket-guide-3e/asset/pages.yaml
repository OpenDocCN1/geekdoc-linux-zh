  md: 'We refer to files and directories using a “names and slashes” syntax called
    a path. For instance, this path:


    /one/two/three/four


    refers to the root directory /, which contains a directory called one, which contains
    a directory two, which contains a directory three, which contains a final file
    or directory, four. Any such path that begins with a slash, which descends all
    the way from the root, is called an absolute path.


    Paths don’t have to be: they can be relative to some directory other than the
    root. In Figure 3, there are two different directories named bin, whose absolute
    paths are /bin and /usr/bin. If we simply refer to “the bin directory,” it’s not
    clear which one we mean (and could be many other bin directories too). More context
    is needed. Any time you refer to a path that doesn’t begin with a slash, like
    bin, it is called a relative path.


    To make sense of a relative path, you need to know “where you are” in the Linux
    filesystem. This location is called your current working directory (or just “current
    directory”). Every shell has a current working directory, and when you run commands
    in shell, they operate relative to that directory. For example, if your shell
    is “in” in the directory /usr, and you run a command that refers to a relative
    path bin, you’re really referring to /usr/bin. In general, if your current directory
    is /one/two/three, a relative path a/b/c would imply the absolute path /one/two/three/a/b/c.


    Two special paths are denoted . (a single period) and .. (two periods in a row).
    The former means your current directory, and the latter means your parent directory,
    one level above. So if your current directory is /one/two/three, then . refers
    to this directory and .. refers to /one/two/two.


    You “move” your shell from one directory to another using the cd command:


    +   - cd /usr/local/bin'
