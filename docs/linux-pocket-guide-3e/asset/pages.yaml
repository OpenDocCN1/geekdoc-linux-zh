    # Beyond Mail Readers


    Email is more “transparent” on Linux than other platforms that merely display
    your mailbox and send and receive messages. The ability to list outgoing email
    messages with mailq is just one example. Here are some other options to whet your
    appetite and encourage you to explore.'
