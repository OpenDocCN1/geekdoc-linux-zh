    To join the one.pdf and two.pdf into a single PDF file, combined.pdf:


    +   - pdftk one.pdf two.pdf cat output combined.pdf


    To extract pages 5, 7, and 10–15 from the file one.pdf and write them to new.pdf:


    +   - pdftk one.pdf cat 5 7 10-15 output new.pdf


    Extract the first five pages from one.pdf and the odd-numbered pages from two.pdf
    and combine them as combined.pdf:


    +   - pdftk A=one.pdf B=two.pdf cat A1-5 Bodd output \ combined.pdf


    Copy the file one.pdf to new.pdf, but with page 7 rotated by 90 degrees clockwise
    “east:


    +   - pdftk one.pdf cat 1-6 7east 8-end output new.pdf


    Interleave the pages of one.pdf and two.pdf, creating interleaved.pdf:


    +   - pdftk one.pdf two.pdf shuffle output \ interleaved.pdf


    You may have noticed that the page selection criteria, appearing after the output
    keyword, are very powerful. They consist of one or more page ranges with qualifiers.
    A page range can be a single page like 5, a range like 5-10, or a reverse range
    like 10-5 (which will reverse the pages in the output). Qualifiers can remove
    pages from a range, like 1 to 100 except for pages 20 to 25. They can also specify
    only odd pages or even pages, using the keywords odd or even, and rotations using
    the compass direc-'
