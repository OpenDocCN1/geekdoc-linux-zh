    # Group Management


    +   - groups Print the group membership of a user.

    - groupadd Create a group.

    - groupdel Delete a group.

    - groupmod Modify a group.


    A group is a set of accounts treated as a single entity. If you give permission
    for a group to take some action (such as modify a file), then all members of that
    group can take it. For example, you can give full permissions for the group friends
    to read, and execute the file /tmp/sample:


