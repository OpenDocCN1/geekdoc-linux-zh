    Let''s start with some technical talk and follow with common-sense advice. A umask
    is a binary (base two) value, though it is commonly presented in octal (base eight).
    It defines your default protection mode by combining with the octal value 0666
    for files and 0777 for directories, using the binary operation NOT AND. For example,
    the umask 0002 yields a default mode of 0664:


    ```

    0666 NOT AND 0002

    = 00110101110 NOT AND 00000000000

    = 00110101110 AND 11111111111

    = 001101011100

    = 0664

    ```


    Similarly for directories, 0002 NOT AND 0777 yields a default mode of 0775.


    If that explanation seems from outer space, here are some simple recipes. Use
    umask 0022 to give yourself full privileges, and all others read/execute privileges
    only:


