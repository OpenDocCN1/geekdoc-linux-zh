- pgno: 74
  md: '# ESS Copy Services and Linux


    In this chapter we provide an overview of the Copy Services functions available
    with the IBM TotalStorage Enterprise Storage Server, with particular reference
    to Linux on zSeries. For full details of these functions the reader should refer
    to the redbooks *Implementing ESS Copy Services with IBM eServer zSeries*, SG24-5680,
    and *Implementing Copy Services in an Open Environment*, SG24-5757.'
  merge: -1
  img_proc: true
- pgno: 75
  md: "# 6.1 Introduction\n\nThe Enterprise Storage Server Copy Services are enterprise-level\
    \ functions that give you leading edge solutions to meet your needs for disaster\
    \ recovery, data migration, and data duplication. The set of products which make\
    \ up the ESS Copy Services suite are:\n\n+   - Peer-to-Peer Remote Copy (synchronous\
    \ PPRC)\n- Peer-to-Peer Remote Copy Extended Distance (non-synchronous PPRC-XD)\n\
    - FlashCopy\n- Extended Remote Copy (XRC)\n- Concurrent Copy (CC)\n\n> **Note:**\
    \ Two of the ESS Copy Services, Extended Remote Copy and Concurrent Copy, are\
    \ only available for the z/OS and OS/390 operating systems, and are *not* available\
    \ for Linux on zSeries. We provide very little detail of these copy functions\
    \ in this book.\n\nFlashCopy and Peer-to-Peer Remote Copy (both synchronous PPRC\
    \ and non-synchronous PPRC-XD) are hardware based functions of the Enterprise\
    \ Storage Server, and can be used with open servers (UNIX and Intel based) as\
    \ well as with zSeries and iSeries servers. Figure 6-1 illustrates these ESS Copy\
    \ Services.\n\n![](img/da33d6b6aa12b73deb3c350a0a89d424_75_0.png)\n\n*Figure 6-1\
    \ ESS Copy Services for zSeries*\n\nWith the ESS, we have copy functions for copying\
    \ data either *locally*, that is within the same on-site ESS, or *remotely*, which\
    \ is copying data to a separate remote-site ESS.\n\n+   - The ESS copy functions\
    \ that fall within the *Remote Copy* category are:\n  - Extended Remote Copy (XRC)\n\
    \  - Peer-to-Peer Remote Copy (PPRC)\n  - Peer-to-Peer Remote Copy Extended Distance\
    \ (PPRC-XD)"
  merge: -1
  img_proc: true
- pgno: 76
  md: "+   ► The ESS copy functions that fall within the *local copy* category are:\n\
    \  – FlashCopy\n  – Concurrent Copy\n\nThe ESS Copy Services copy functions can\
    \ also be classified as either *dynamic* or *point-in-time*. Dynamic copy functions\
    \ constantly update the secondary copy as applications make changes to the primary\
    \ data source. Point-in-time copy functions provide an instantaneous copy or view\
    \ of what the original data looked like at a specific point-in-time. For example,\
    \ the Remote Copy functions listed above are all *dynamic*, while the local copy\
    \ functions mentioned above are both *point-in-time*.\n\n# 6.2 Peer-to-Peer Remote\
    \ Copy (PPRC)\n\nPeer-to-Peer Remote Copy (PPRC) is a synchronous remote data\
    \ mirroring technology used primarily as part of a business continuance solution\
    \ for protection against disk subsystem loss, or complete site failure. It is\
    \ also used for remote migration of data and application workloads, and for off-site\
    \ backups. It is a real-time copy technique that synchronously mirrors a *primary*\
    \ set of volumes (that are being used by applications) onto a *secondary* set\
    \ of volumes (see Figure 6-2). Typically, the secondary volumes will be on a different\
    \ ESS located at a remote location some distance away from the application site.\
    \ Mirroring is done at a logical volume level.\n\n![](img/da33d6b6aa12b73deb3c350a0a89d424_76_0.png)\n\
    \nFigure 6-2 Synchronous volume copy PPRC\n\nPPRC is a hardware solution, thus\
    \ it is application independent and the relevant hardware feature needs to be\
    \ available on both the local and the remote ESS. Because the copy function occurs\
    \ at the storage subsystem level, the application does no need to know of its\
    \ existence. PPRC guarantees that the secondary copy is up-to-date by ensuring\
    \ that the primary volume update will be successfully completed only when the\
    \ primary ESS receives acknowledgement that the secondary copy has been successfully\
    \ updated.\n\nThe sequence when updating records is as follows (refer to Figure\
    \ 6-2):"
  merge: -1
  img_proc: true
- pgno: 77
  md: '+   1. Write to primary volume (to primary ESS cache and non-volatile storage
    (NVS)). The application writes data to a primary volume on an ESS at the application
    site, and cache hit occurs.

    2. Write to secondary (to secondary ESS cache and NVS). The application site ESS
    then initiates an I/O channel program to the recovery site ESS, to transfer the
    updated data to the recovery site cache and NVS

    3. Signal write complete on the secondary. The recovery site ESS signals write
    complete to the application site ESS when the updated data is in its cache and
    NVS.

    4. Post I/O complete. When the application site ESS (primary ESS) receives the
    write complete from the recovery site ESS, it returns I/O complete status to the
    application system.


    Destage from cache to the back-end disk drives on both the application ESS and
    the recovery site ESS is performed asynchronously. The synchronous technique of
    PPRC ensures that application-dependent writes will be applied in the same sequence
    upon the secondary volumes, thus providing application consistency at every moment.
    PPRC has tailorable parameters (CRIT and consistency groups) which identify what
    should be done if there are errors or delays in updating the secondary copy.


    From a PPRC perspective, the volumes within an ESS can be in one of the following
    states (refer Figure 6-3):


    +   - Simplex: The initial state of a volume. A PPRC volume pair relationship
    has not been established yet between the primary and the secondary volumes.

    - Pending: The initial state of a defined PPRC volume pair relationship, when
    the initial copy of the primary volume to the secondary volume is happening. This
    state also is found when a PPRC volume pair is re-synchronized after it was suspended.
    During the pending period, the volume pair is not in synchronization, and PPRC
    is copying tracks from the primary to the secondary volume.

    - Duplex: The state of a PPRC volume pair after PPRC has fully completed the copy
    operation of the primary volume onto the secondary volume. At this moment the
    volume pair is in synchronization and all write updates to the primary volume
    are synchronously applied onto the secondary volume.

    - Suspended: In this state of the PPRC pair, the writes to the primary volume
    are not mirrored onto the secondary volume. The secondary volume becomes out of
    synchronization. During this time PPRC keeps a bit map record of the changed tracks
    in the primary volume. Later, the volume pair can be re-synchronized, and then
    only the tracks that were updated will be copied. A PPRC volume pair will automatically
    go into suspended state, for instance, when the primary ESS cannot complete a
    write operation to the recovery ESS.

    - Duplex pending-XD: This state is found when a volume pair is established in
    a non-synchronous PPRC-XD relationship. This PPRC volume state is explained in
    6.3, “PPRC Extended Distance (PPRC-XD)” on page 65.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '![](img/da33d6b6aa12b73deb3c350a0a89d424_78_0.png)


    Figure 6-3  PPRC volume states - synchronous mode of operation


    # Copying PPRC secondary volumes


    A PPRC secondary volume can be a FlashCopy primary volume. This allows you, for
    example, to produce a consistent point-in-time tertiary copy of the mirror volume
    while it is suspended. With PPRC V2 you can perform Asynchronous Cascading PPRC,
    whereby a (synchronous) PPRC secondary volume can simultaneously serve as the
    PPRC primary volume for a PPRC-XD relationship to a remote site. This provides
    the capability for a three-site PPRC configuration.


    # 6.3 PPRC Extended Distance (PPRC-XD)


    Peer-to-Peer Remote Copy Extended Distance (PPRC-XD) is a non-synchronous long-distance
    copy option for both open systems and zSeries servers. PPRC-XD can operate at
    distances well beyond the 103 km maximum supported distance for synchronous PPRC.
    It is an excellent solution for:


    +   - Data copy

    - Data migration

    - Off-site backup

    - Transmission of data base logs

    - Application recovery solutions based on periodic point-in-time copies of data


    In PPRC-XD, the primary volumes updates are mirrored to the secondary volumes
    in a non-synchronous operation while the application is running. Due to the non-synchronous
    transmission of the updates, the write operations at the primary site (and thus
    the application''s response time) are not affected by any transmission delay.
    When PPRC-XD'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'starts, a bitmap is built for each primary volume to keep a record of updated
    primary volume tracks. The first phase of the copy is a sequential copy of the
    primary volume tracks, which are sent in batches to the secondary volume. When
    all tracks have been copied, the initial copy is done, then PPRC-XD starts to
    periodically cycle through the bitmap for any updated tracks to send then in batches
    of updates to the secondary volumes. This is a throughput oriented very efficient
    way of non-synchronous mirroring.


    Figure 6-4 shows a simplified sequence of a PPRC-XD operation, illustrating its
    non-synchronous characteristics. The following is the sequence of the operation:


    +   1. Host writes data to primary volume (to primary ESS cache and NVS). Channel
    End is returned to the host.

    2. Primary volume bitmap is updated to reflect the update for later transmission
    to the secondary ESS. The ESS returns a Device End to the host, so the I/O operation
    is complete for the application

    3. The primary ESS mirrors the updates onto the secondary ESS volumes. The updates
    are grouped in batches for efficient transmission.

    4. The secondary ESS returns write completed to the primary ESS when the update
    is secured in the secondary ESS cache and NVS. The primary volume bitmap is updated
    to show that the primary update has been secured in secondary ESS cache and NVS.


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_79_0.png)


    Figure 6-4 PPRC-XD operation


    With PPRC-XD there is an addition to the PPRC traditional volume states (refer
    Figure 6-3). The additional state is the duplex-pending XD state (refer Figure
    6-5). While in this duplex-pending XD-state, PPRC is doing non synchronous mirroring
    of primary volume updates to the secondary site. PPRC-XD will periodically cycle
    through the bitmap of each volume for updated tracks and place them in a batch
    for copying to the secondary. The pair will stay in this status until a command
    is issued to go into synchronous mode (duplex state),'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'or a command is issued to suspend the pair (suspended state), or a command
    is issued to delete the PPRC-XD pair (simplex state).


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_80_0.png)


    Figure 6-5 Duplex-pending XD volume state


    # Catch-up operation (go-to-synch)


    PPRC-XD catch-up is the name of the transition that occurs to a PPRC-XD pair when
    it goes from its normal out-of-sync condition until it reaches a full synchronous
    condition. At the end of this transition, primary and secondary volumes become
    fully synchronized. The catch-up transition can be accomplished by commanding
    PPRC to go-to-SYNC, so the volume pair leaves the duplex-pending XD state and
    reaches the duplex state. From this moment on, if the pairs were not immediately
    suspended, primary write updates are synchronously transmitted to the recovery
    site. Catch-up transition can also be accomplished by temporarily quiescing the
    application writes to the primary volumes, and waiting for PPRC-XD to finish synchronization.


    When doing the catch-up operation by commanding PPRC to go-to-SYNC, you will not
    want any synchronous copy operations to occur if the volumes being mirrored are
    separated by long distances, beyond the 103 km. For this there is a copy option
    that allows you to ask PPRC to suspend the pair as soon as synchronization is
    established. Figure 6-6 shows the basics of PPRC-XD.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/da33d6b6aa12b73deb3c350a0a89d424_81_0.png)


    Figure 6-6 PPRC-XD Basic operation


    # Data consistency


    While volume pairs are in the duplex-pending XD state, application writes to the
    primary volumes are copied to the secondary volumes non synchronously. This means
    that the secondary volumes are keeping a fuzzy copy of the data. Application-dependent
    writes are not assured to be applied in the same sequence on the secondary volumes
    as they were written on the primary volumes. Moreover, at any time there will
    be a certain amount of application-updated data that is not reflected at the secondary
    volumes; this data corresponds to the tracks that were updated since the last
    volume bitmap scan was done. The catch-up transition will bring the pairs back
    to synchronous, either by setting them to duplex or by stopping write updates
    to the primary. When reaching duplex state, the pairs can be temporarily suspended
    to flash the secondary before resuming the PPRC-XD relation between the pairs.
    The FlashCopy will be a tertiary consistent point-in-time copy. Or, if it is a
    database application and the archive logs are being mirrored, then once the pairs
    catch up and are suspended, the logs can be applied on the shadow database.


    # 6.4 FlashCopy


    Today, data processing centers increasingly require applications to be available
    24 hours per day, 7 days per week, with minimal application downtime for data
    backups or copies. FlashCopy allows the user to implement such solutions.


    FlashCopy provides an instantaneous point-in-time copy of data, also called a
    T0 copy. FlashCopy enables applications that use either the source copy or the
    target copy to have them available almost immediately. Only a minimal interruption
    to the application is required'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'for the FlashCopy relationship to be established. The copy is then created
    under the covers by the IBM TotalStorage Enterprise Storage Server with minimal
    impact on other ESS activities. FlashCopy may be used in conjunction with either
    local or remote copies of data create by PPRC.


    Note that a new version of FlashCopy (FlashCopy V2) has been recently announced,
    which eliminates some restrictions of FlashCopy V1, and adds some new functionality.
    The following brief overview of FlashCopy is largely worded in terms of FlashCopy
    V1, for simplicity, but we will specifically identify when additional FlashCopy
    features are available with FlashCopy V2. Additional details on FlashCopy V2 can
    be found in the redbook *Implementing ESS Copy Services with IBM eServer zSeries,
    SG24-5680.*


    FlashCopy is at the logical volume level (FlashCopy V2 may be invoked at the level
    of volume extents, or even datasets). It has the following restrictions:


    +   - The source and target volumes must have the same track format.

    - The target volume must be at least as large as the source volume.

    - The source and target volumes must be within the same ESS logical subsystem
    (LSS). With FlashCopy V2 this condition is relaxed so that the source and target
    only need to be within the same ESS.

    - A source and target volume can only be involved in one FlashCopy relationship
    at a time. With FlashCopy V2, it is possible for a volume to have multiple FlashCopy
    relationships.


    When FlashCopy is invoked, the ESS establishes a FlashCopy relationship between
    the target volume and source volume. This relationship exists from the time you
    initiate a FlashCopy operation until the ESS copies all data from the source volume
    to the target volume. You may optionally request FlashCopy to not execute the
    background copy (**NOCOPY** option), in which case the relationship must be specifically
    withdrawn in order to terminate it.


    During the *establish* phase of the FlashCopy relationship, a bitmap is created
    for the relation. This bitmap is used by the ESS microcode to map source and target
    volumes as they were at the time when the FlashCopy was requested (T0 copy), as
    well as to manage subsequent reads and updates to the source and target volumes.
    As soon as the relationship is established, both volumes become available for
    application use, and the optional physical copy phase begins. (Note that applications
    do not have to be stopped for FlashCopy to be initiated. However, you need to
    consider that only data on the physical disk is copied, while data in the buffers
    in the applications will not be copied. For this reason, you will probably need
    to quiesce the applications while the FlashCopy relationship is being established.)


    # FlashCopy background copy mode (default)


    The background copy mode causes all tracks in the source volume be physically
    copied to the target volume. The background copy task runs at a lower priority
    than normal I/O on the ESS, thus ensuring minimal impact on normal application
    I/O processing. Using the bitmap, the ESS keeps track of which data has been copied
    from source to target, and manages the integrity of both copies. If an application
    wants to read some data from the target that has not yet been copied, the data
    is read from the source; otherwise, the read is satisfied from the target volume.
    Before updating a not-yet-copied track on the source volume, the ESS does an on-demand
    copy of the track to the target volume, thus preserving the T0 copy. Subsequent
    reads to this track on the target volume will be satisfied from the target volume,
    and subsequent updates to this track on the source volume are ignored by FlashCopy,
    thus preserving the T0 copy. Before updating a not-yet-copied track on the target
    volume, the ESS will perform an on-demand copy of this track to the target volume.
    After some time, all tracks will have been copied to the target volume, and the
    FlashCopy relationship will automatically end. Figure 6-7 illustrates how FlashCopy
    works when background copy is requested.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/da33d6b6aa12b73deb3c350a0a89d424_83_0.png)


    Figure 6-7 FlashCopy point-in-time copy


    # FlashCopy no-background copy mode (NOCOPY)


    The NOCOPY option causes the FlashCopy relationship to be established without
    initiating a background copy - only the source tracks which are updated are copied
    to the target. This may be useful if you need the copy only for a short time,
    such as making a backup to tape. While this relationship exists, before a track
    is updated on the source volume, the ESS does an on-demand copy of the track to
    the target volume, thus preserving the T0 copy. Similarly, before updating a track
    on the target volume, the ESS will perform an on-demand copy of this track to
    the target volume. A FlashCopy relationship established in this no-background
    copy mode remains active until one of the following occurs:


    +   - A FlashCopy withdraw is issued to remove the relationship.

    - All source device tracks have been copied onto the target device because they
    were updated.

    - All target device tracks have been updated by user applications.


    # Incremental FlashCopy


    FlashCopy V2 has introduced a new function known as Incremental FlashCopy, which
    provides the capability to refresh a FlashCopy relationship. With Incremental
    FlashCopy, the the initial FlashCopy relationship between a source and a target
    is maintained. When a subsequent FlashCopy establish is initiated, only the data
    required to bring the target current to the source''s newly established point-in-time
    is copied. Incremental FlashCopy helps reduce the background copy completion time
    when only a subset of data on either the source or target has changed. Figure
    6-8 gives a brief overview of how Incremental FlashCopy works.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/da33d6b6aa12b73deb3c350a0a89d424_84_0.png)


    Figure 6-8 Incremental FlashCopy


    When FlashCopy is established for a large number of volumes, there is a finite
    amount of time between the first and last establish, so that copies may not be
    created at a consistent point-in-time. FlashCopy V2 introduces a Consistency Group
    function, which can be used to create a consistent point-in-time copy across multiple
    volumes.


    # 6.5 ESS Copy Services Web User Interface


    The ESS Copy Services that runs in the ESS provides a Web interface that can be
    used to invoke and manage the ESS copy functions. First, one ESS has to be defined
    as the ESS Copy Services Server (CSS), and this will hold all ESS Copy Services
    related information. Optionally, there can be a second ESS defined to be the backup
    ESS Copy Services Server. The recommendation is to define the Copy Services server
    at the remote (recovery) site and the backup CSS at the primary (application)
    site. Setting up the CSS in the ESS is done by an IBM Service Support Representative.


    To access the Copy Services Web User Interface (WUI) you first open the ESS Welcome
    Screen, discussed earlier in 4.3.3, “ESS Specialist” on page 44, and shown in
    Figure 6-9.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '![](img/da33d6b6aa12b73deb3c350a0a89d424_85_0.png)


    Figure 6-9  ESS Welcome screen


    You then select Copy Services, which will connect your browser to the ESS that
    is specified as the Copy Services server. The main menu of the ESS Copy Services
    Web User Interface will be displayed (refer Figure 6-10).


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_85_1.png)


    Figure 6-10  Main menu ESS Copy Services Web User Interface'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'From the Copy Services main menu, you can access all ESS Copy Services panels
    by selecting one of the buttons on the left hand side. We will briefly look at
    each of these. For further details please refer to *IBM TotalStorage Enterprise
    Storage Server Web Interface User''s Guide*, SC26-7448, and *Implementing ESS
    Copy Services with IBM eServer zSeries*, SG24-5680.


    # The Volumes panel


    The Volumes panel is shown in Figure 6-11. From this panel you can:


    +   - Receive information and the status of volumes defined in a logical subsystem
    (LSS) of the ESS

    - Select source and target volumes for a PPRC or FlashCopy task

    - Filter the output of the volume display to a selected range

    - Search for a specific volume based on its unique volume ID

    - Establish, terminate, and suspend PPRC copy pairs and optionally save the task

    - Establish and withdraw FlashCopy pairs and optionally save the task

    - Enter the multiple selection mode for PPRC and FlashCopy


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_86_0.png)


    *Figure 6-11 Volumes panel*


    # The Logical Subsystems Panel


    The Logical Subsystems panel is shown in Figure 6-12. This panel displays the
    ESSs and the logical subsystems within the ESS storage network; the storage network
    includes all ESSs that are configured to use the same ESS Copy Services Server.
    From the Logical Subsystems panel you can:


    +   - View all ESSs within the storage network

    - View all logical subsystems (LSSs) within the storage network

    - Get information about a logical subsystem and its status

    - View and modify the copy properties of a logical subsystem

    - Filter the output of a selected range

    - Search for a specific logical subsystem based on its unique address

    - Establish, terminate, and suspend PPRC copy pairs, and optionally save the task'
  merge: -1
  img_proc: true
- pgno: 87
  md: '► Perform operations on consistency groups


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_87_0.png)


    Figure 6-12 Logical Subsystems panel


    # The Paths panel


    A path is used to send data between the primary and secondary PPRC pairs. The
    physical path consists of the ESCON connection between two ESSs, while a logical
    path describes the connection of the PPRC source and targets. Please note that
    before you can create PPRC copy pair relationships, you must use the Paths panel
    to establish logical paths between the source and target LSSs. The Paths panel
    is shown in Figure 6-13. From this panel you can:


    +   ► Establish PPRC paths

    ► Remove PPRC paths

    ► Create a PPRC consistency group

    ► View information about paths'
  merge: -1
  img_proc: true
- pgno: 88
  md: '![](img/da33d6b6aa12b73deb3c350a0a89d424_88_0.png)


    Figure 6-13 Paths entry panel


    # The Tasks Panel


    By using the Volumes, Logical Subsystems, and Paths panels you can save the setup
    of any data copy action within a task. A task can be any kind of FlashCopy, PPRC,
    and path operation. Using the Tasks panel you can run and modify saved tasks.
    You can also group multiple tasks into a single task group. This could be the
    case if multiple FlashCopy pairs from different LSSs have to be established at
    the same time in order to do a backup. This group of tasks can then by run by
    selecting the task group and running it. The Tasks panel is shown in Figure 6-14.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '![](img/da33d6b6aa12b73deb3c350a0a89d424_89_0.png)


    Figure 6-14 Tasks panel


    # 6.6 Copy Services command line interface


    Using the ESS Copy Services command line interface (CLI), users of selected open
    systems servers are able to communicate with the ESS Copy Services Server from
    the host''s command line to manage PPRC and FlashCopy. For example, any of the
    tasks you have saved using the Web User Interface could be invoked from the host
    through a command such as rsExecute Task. The CLI is a Java-based application
    that runs on the host server. The host system does not necessarily need to be
    connected to storage assigned to one of the host adapter ports of the ESS. The
    only requirement is that the host from where you want to invoke the commands is
    connected through the network to the ESS that is defined as the primary ESS Copy
    Services Server. Detailed information on the ESS Copy Services command line interface
    can be found in IBM TotalStorage Enterprise Storage Server Command Line Interface
    User''s Guide, SC26-7494. Details of which open systems servers support the CLI
    can be found at in the “ESS Interoperability Matrix” located at the Web site below.
    Supported servers include Red Hat Linux and SuSE Linux.


    http://www.storage.ibm.com/disk/ess/supserver.htm'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# 6.7 ESS Copy Services available with Linux on zSeries


    There are several ways of invoking and managing the various ESS Copy Services
    functions, for the different operating environments. For PPRC and FlashCopy, the
    most commonly used are the Copy Services Web User Interface (WUI) and the Copy
    Services command line interface (CLI). The only exception to this is the z/OS
    environment where TSO commands provide a convenient management mechanism.


    Table 6-1 summarizes the facilities available for invoking and managing PPRC,
    PPRC-XD, and FlashCopy for Linux on zSeries. Some further details for the items
    listed in that table are:


    +   - WUI: Web user interface (refer 6.5, “ESS Copy Services Web User Interface”
    on page 71)

    - CLI: command line interface (refer 6.6, “Copy Services command line interface”
    on page 76). Note that the CLI is run on a supported open systems server connected
    to the ESS, and not on the Linux for zSeries server itself.

    - VM ICKDSF: In a VM environment, some PPRC functions can be performed using the
    ICKDSF utility. For full details see *Implementing ESS Copy Services with IBM
    eServer zSeries*, SG24-5680.

    - VM CP `flashcopy`: In a VM environment, FlashCopy is supported using the CP
    command `flashcopy`. For full details see *Implementing ESS Copy Services with
    IBM eServer zSeries*, SG24-5680.


    Table 6-1 Managing PPRC,PPRC-XD, and FlashCopy on Linux for zSeries


    |  | Linux running in LPAR | Linux running under VM |

    |---|---|---|

    | **ESS connection via ESCON/FICON** | WUI and CLI

    (SuSE SLES 8 only) | WUI and CLI

    VM ICKDSF (for PPRC)

    VM CP `flashcopy` (for FlashCopy) |

    | **ESS connection via FCP** | WUI and CLI

    (SuSE SLES 8 only) | not formally supported |


    Note that theoretically the WUI and CLI can be used for invoking and managing
    ESS Copy Services functions for any Linux on zSeries system, regardless of the
    kind of attachment (ESCON/FICON or FCP), and regardless of whether Linux is running
    as a VM guest or natively in an LPAR. This is because the WUI and CLI interface
    directly to the ESS, without reference to the host operating environment. However,
    IBM has only tested these functions (and only provides official support for these
    functions) as per details in Table 6-1.


    Note that if the Linux for zSeries volumes are CKD (connected by ESCON or FICON),
    and they are defined to a z/OS system via the HCD, then copy services functions
    can be invoked and managed for those volumes using the z/OS system. (For details
    of z/OS facilities for managing copy services see *Implementing ESS Copy Services
    with IBM eServer zSeries* SG24-5680.) Obviously, this approach will introduce
    operational complexities, particularly for the z/OS system, and especially for
    functions that need to be performed on a regular basis. For this approach, it
    would be desirable to format the Linux volumes using the Linux on S/390 Compatible
    Disk Layout (CDL).'
  merge: -1
  img_proc: true
