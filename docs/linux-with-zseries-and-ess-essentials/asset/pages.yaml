    # 3.4 Linux application solutions


    Linux distributions for zSeries contain such notable open source applications
    as Apache, Samba, IMAP, OpenLDAP, Perl, Sendmail MTA, Squid, and PostgreSQL. Linux
    applications are sourced from many areas. Open source applications are available
    for download from the Internet. Applications can also be developed for the zSeries.
    Compilers are available with the Linux for zSeries distributions.


    Solutions providers have announced products for Linux on the zSeries server. These
    include infrastructure applications, line-of-business applications, and Web-enablement
    applications. There are more than 200 applications from more than 120 vendors
    available for Linux on zSeries. For a detailed product list, see:


    http://www.ibm.com/servers/eserver/zseries/solutions/s390da/linuxproduct.html


    # Typical file/print serving scenario with Samba


    We outline a typical consolidation of distributed file/print servers onto a zSeries.
    Other scenarios are discussed in Linux Handbook, SG24-7000.


    This scenario describes providing file/print services using the Samba file print
    application. Samba is high quality open source code and is integrated in most
    Linux distributions. File/print serving does not place great demand on the compute
    resource of the processor. However, it exercises the I/O capabilities of the solution
    as users upload/download files or route them to printers. Servers spend a significant
    amount of time waiting for users to request print or file services.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'The distributed solution consists of 150 Intel 2-way 1000 MHz servers, which
    is depicted in Figure 3-8. Note that the servers are connected to a physical network
    that requires hardware. Also note that each server is running a separate copy
    of the operating system and application code - this is duplicated for each of
    the 150 servers in this case. Each server requires disk space, and if additional
    disk storage is required for a server the alternatives are to purchase an additional
    entire disk volume and install it, or purchase a higher capacity disk, move the
    required software and data to it, and install it.


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_45_0.png)


    Figure 3-8 Samba file/print scenario - distributed solution


    Maintenance must be performed on each server individually. Some type of operator
    automation is required to monitor the 150 separate systems and respond to replies
    when necessary. Backup is done by a dedicated backup server, which communicates
    with client code on each system.


    The zSeries solution for this scenario is shown in Figure 3-9. Notice that the
    inter-server communication takes place within the machine, which allows the Linux
    instances to communicate at memory speeds, as opposed to physical networking speeds
    with the usual latency. In addition to improving inter-server communication, much
    of the cost of external networking hardware and software is avoided.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/da33d6b6aa12b73deb3c350a0a89d424_46_0.png)


    Figure 3-9 Samba file/print scenario - zSeries solution


    Disk storage for the operating system and application code is shared by all 150
    virtual servers, while they must be duplicated in the distributed case. Sharing
    the code offers the advantages of controlling the cost of disk storage and ease
    of maintenance. Since only one copy of the code exists, it must only be serviced
    in a single place, which results in savings in system management software and
    operation.


    z/VM can help you to share the available disk space amongst the servers. In the
    distributed model, increasing disk space meant that you needed to buy new disks.
    If there was free disk space on some servers, it could not be moved to the server
    that needed the increased disk storage. In the zSeries solution, z/VM allows you
    to partition disks into minidisks that you can easily allocate to a server that
    requires additional disk space.


    As in the distributed case, the 150 servers in operation will issue messages which
    must be monitored, and responded to in some cases. The PROP function in z/VM is
    designed for that purpose, avoiding the cost of additional software to perform
    the task. Backup is performed by Tivoli Storage manager (TSM). A TSM server is
    installed either on z/VM (as depicted in the figure), or in a Linux virtual instance
    (available with TSM version 5.2). TSM clients are installed on each of the Linux
    guests.'
  merge: -1
  img_proc: true
