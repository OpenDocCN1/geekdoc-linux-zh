  md: '# zSeries and Linux


    This chapter provides a brief overview of the IBM @server zSeries with a focus
    on how to run Linux on the zSeries architecture.


    Since Linux can run on zSeries as a z/VM® guest, this chapter contains background
    information on z/VM for the reader to get an understanding of the features and
    functions that their Linux installation would inherit in that case.


    Finally, this chapter discusses scenarios for scalability and consolidation of
    Linux solutions on zSeries.'
  merge: -1
  img_proc: true
- pgno: 37
  md: "# 3.1 Introduction\n\nThe IBM @server zSeries is the successor of the S/390\
    \ series and IBM's premier server for e-business transaction workloads. The zSeries\
    \ has a long history in running commercial applications with unmatched reliability\
    \ and availability. In 1999 Linux was ported to S/390 and became available in\
    \ early 2000. Since then, many new features and device support have been added,\
    \ and more and more customers are using Linux for S/390 and zSeries either for\
    \ running new workloads or consolidating servers. Linux for zSeries is supported\
    \ on all zSeries machines, and on the predecessor S/390 models G5, G6, and MP3000.\
    \ These are shown in Figure 3-1.\n\n![](img/da33d6b6aa12b73deb3c350a0a89d424_37_0.png)\n\
    \nFigure 3-1 IBM eServer zSeries\n\n# 3.1.1 Ways to run Linux on zSeries\n\nThere\
    \ are three ways to run Linux on the zSeries. These are:\n\n+   - Basic or native\
    \ mode\n  - Linux uses the entire machine, without any other operating system.\
    \ In basic mode, you can use a single Linux image on the zSeries \"bare metal.\"\
    \n- Logical partition or LPAR\n  - You can logically partition the zSeries hardware\
    \ into a maximum of 15 separate LPARs. A single zSeries, for example, can host\
    \ z/OS® applications in one partition, VM in another, and Linux applications in\
    \ additional partitions.\n- z/VM\n  - A customer can run Linux as a virtual machine\
    \ using z/VM as a hypervisor. z/VM provides virtualization of CPU processors,\
    \ input/output (I/O) subsystems, and memory. A customer running z/VM can run hundreds\
    \ of Linux systems on a single zSeries. With z/VM, for instance, a customer can\
    \ offer a complete Linux server environment to each application developer and\
    \ host production system all on the same zSeries server.\n\nThe decision on how\
    \ to run Linux on zSeries is typically made based on the expected workload:\n\n\
    +   - Few (if any) workloads require running Linux in basic mode.\n- Linux workloads\
    \ with large resource requirements (such as memory footprint and processing power)\
    \ may be best suited for running in an LPAR. This is particularly true if"
  merge: -1
  img_proc: true
- pgno: 38
  md: 'the Linux systems will be running at peak workloads for extended periods, so
    that there is limited opportunity for resource sharing. Use of LPARs may also
    be appropriate when only a small number of images are required, since in this
    case the additional resource and support requirements of z/VM may not be justified.


    +   - Running Linux as a z/VM guest offers the maximum flexibility. The number
    of Linux guests running under z/VM can be adjusted to meet workload requirements.
    Only the hardware resources limit the amount of concurrently running instances.
    Most customers choose this option to maximize their investment.


    The last two options are depicted in Figure 3-2. Note that this figure is only
    illustrative, and in a real production environment you would also expect to have
    an LPAR running z/OS, as depicted in Figure 3-4 on page 26.


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_38_0.png)


    # 3.1.2 S/390 and zSeries architecture


    The heart of zSeries and S/390 architecture is the multichip module (MCM) that
    contains up to 20 processing units (PU). These are commonly referred to as central
    processing units (CPUs) or engines.


    All PUs are identical, but can take on different roles in the system. Each PU
    can be one of:


    +   - Central Processor (CP) PU: Used by the operating system for executing customer
    work

    - System Assist Processor (SAP) PU: This is a PU that runs the channel subsystem
    Licensed Internal Code to control I/O operations.

    - Integrated Facility for Linux (IFL) PU: An IFL engine is restricted to running
    Linux or z/VM.

    - Integrated Coupling Facility (ICF) PU: This engine is used to run the Coupling
    Facility function for use in a Parallel Sysplex®.


    # The IFL engine


    An IFL is a processor reserved for Linux, or Linux under VM. The significance
    is that it cannot be used to run other operating systems, and its existence is
    not reflected in the system model numbers, MIPS rating, or other power ratings.
    These power rating methods have significant implications for software costs. Adding
    an IFL does not affect these costs, permitting the use of Linux without impacting
    other software costs.'
  merge: -1
  img_proc: true
