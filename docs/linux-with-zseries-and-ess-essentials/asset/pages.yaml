- pgno: 23
  md: '# 2.1 IBM’s commitment to Linux


    The history of IBM''s involvement with Linux is so large as to be outside the
    scope of this work. IBM is not a distributor of Linux. IBM is a contributor to
    Linux, a supplier of servers that run Linux, and a provider of support for customers
    who choose to use Linux. IBM''s commitment to Linux may best be illustrated with
    some of the many notable highlights over the last several years:


    +   - As early as March 1999, IBM had announced key alliances, products, and global
    support for Linux, including among others distributors like SuSE Holding AG (all
    of which later founded United Linux along with distributor Conectiva S.A22), and
    Red Hat Software Inc. The IBM Thinkpad 600 became the first notebook computer
    listed as supported hardware by Red Hat.

    - Linux made its official debut on S/390® servers in May 2000, with commercial
    deployment by a major ISP for server consolidation following shortly thereafter.
    In June, SuSE announced Enterprise Linux for the RS6000.

    - In 2001, IBM won top honors at LinuxWorld for zSeries and iSeries systems running
    Linux, completing the availability of Linux across the entire eServer™ product
    line. Complementing this was the announcement of a broad range of storage options
    for Linux servers, including the Enterprise Storage Server (ESS) and Fibre Array
    Storage System (FAStT) external storage arrays. IBM''s Linux supercomputer systems
    were deployed in research and also in oil and gas exploration, and prepackaged
    Linux clusters for eBusiness made their debut.

    - In 2002, continued emphasis on robust computing for small and medium businesses,
    server consolidation, retail, network infrastructure, advertising, telecom, and
    life sciences strengthened IBM''s position as the most committed Linux player
    across all market segments. By December 2002 IBM had made the eServer p630 available,
    the first pSeries system dedicated to Linux support. Internally, IBM began migrating
    its own business-critical services to Linux, demonstrating both an indisputable
    commitment to, and demonstrated scalability of, Linux eBusiness solutions.

    - In 2003 IBM regularly announced new Linux hardware, ports of additional existing
    software to Linux, and new Linux services and support options.


    # IBM industry leadership supporting Linux


    IBM has over $1 billion investment in the Linux community. IBM has the Linux Technology
    Center, IBM Research and Open Source Development Labs, and IBM Global Services
    Consulting and Support, which all contribute to the Linux and open source community.


    Linux support across IBM is growing across the entire product line with support
    for TotalStorage disk and tape. IBM also supports middleware solutions such as
    DB2®, Websphere, Lotus® Domino™, MQSeries®, Tivoli Storage Manager and more, and
    continues to work closely with many leading Linux distributors.


    # Worldwide IBM Linux commitment


    The $200 million Linux initiative in each of the Europe and Asia Pacific markets
    including the creation of Linux Solution Porting Centers. These centers are located
    all around the world including Paris and Montpellier in France; Greenock and Hursley
    in the UK; Boeblingen in Germany; Warsaw in Poland; Budapest in Hungary; Tokyo,
    Shanghai, Beijing, Taipei, Seoul, and Bangalore in the Asia Pacific; and U.S.
    centers in San Mateo, CA, Chicago, and Waltham, MA.


    Centers allow customers and key ISVs to transition their applications to Linux.
    IBM supports application development on all IBM servers.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 2.1.1 The IBM Linux Technology Centers


    The IBM Linux Technology Center (LTC), whose mission is to work directly with
    the Linux development community with a shared vision of making Linux succeed,
    has one of the industry''s most comprehensive Linux development teams. They are
    a proven, accepted part of the open source Linux community, successfully bringing
    enterprise features into Linux. By doing so they provide Linux technical expertise
    to the community.


    The LTC has a team of 250-plus, with a small part of the over community located
    in many centers around the world. These centers are located in Adelaide, Austin,
    Bangalore, Beaverton, Beijing, Bethesda, Boeblingen, Boston, Boulder, Cambridge,
    Canberra, Chicago, Endicott, Hawthorne, Hursley, Kirkland, Mt. Laurel, New York
    City, Portland, Poughkeepsie, Raleigh, Rochester, San Francisco, Somers, Urbana-Champaign,
    Yamato, and Yorktown.


    The Linux Technology center can be located on the Web at:

    http://www.ibm.com/linux/ltc


    # IBM contributes JFS to Linux Storage


    IBM''s journaled file system (JFS) technology, currently used in IBM enterprise
    servers is designed for high-throughput server environments, key to running intranet
    and other high-performance e-business file servers. IBM is contributing this technology
    to the Linux open source community with the hope that some or all of it will be
    useful in bringing the best of journaling capabilities to the Linux operating
    system.


    JFS is a log-based, byte-level file system, which was developed for transaction-oriented,
    high performance, high-throughput server environments, and is key to running intranet
    and other high-performance e-business file servers. JFS is a scalable and robust
    file system and provides fast file system restarts in the event of a system crash.


    JFS is currently shipping with many Linux distributions including Red Hat and
    SuSE Linux.


    More information about JFS for Linux can be found at:

    http://www-124.ibm.com/jfs/


    # EVMS


    The LTC is also working on volume management technology in the form of the Enterprise
    Volume Management System (EVMS), where the result of the effort is aimed at providing
    more volume management capability and interoperability in the kernel.


    For information on EVMS, refer to:

    http://evms.sourceforge.net/


    # 2.2 Linux services and application solutions


    Although the general opinion is that Linux has a limited number of enterprise-level
    applications available, the Linux applications featured in the IBM Global Solutions
    Directory has grown to more than 2,900. IBM has ten porting centers around the
    world and is continually enhancing this portfolio.


    For more in depth information regarding Linux application solutions refer to Linux
    Handbook - A Guide to IBM Linux Solutions and Resources, SG24-7000-00.'
  merge: -1
  img_proc: true
