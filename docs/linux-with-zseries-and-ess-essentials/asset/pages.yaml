    usage, installation, and technical questions, to address product compatibility
    and inter operability concerns, and to isolate and diagnose Linux cluster problems.
    It provides specialized Linux cluster support with open source and OEM. It offers
    remote problem identification and technical support for your Linux clustered environments.
    This service complements your in-house skills by providing comprehensive knowledge
    of Linux cluster environments.


    # IBM Operational Support Services: Advanced Support


    IBM''s Advanced Support provides the highest level of remote support available
    through IBM. The customer receives 24-x-7 coverage, 365 days-a-year. This service
    is tailored to meet unique customer needs for continuous, business-critical Linux
    system operation.


    # IBM Operational Support Services: Custom Linux Support


    IBM offers remote Linux engineering support for creating modified versions of
    Linux. This services provides full remote support once you implement this custom
    distribution throughout your enterprise or customer base. By leveraging IBM''s
    vast industry of Linux knowledge, IBM helps you to avoid serious pitfalls that
    can occur when you create your own distribution. We help you understand the necessary
    interdependent packages and required modules.


    IBM has the critical mass to deliver support teams in multiple worldwide locations.
    It has used some of its best talent in multiple locations to create the Change
    team. IBM can draw on the skills of over 200 key members of the Linux Technology
    Center found in more than 20 locations worldwide.


    You can learn more about the Support Line at:


    http://www.ibm.com/services/its/us/supportline.html


    # 2.2.4 Linux consultancy


    Linux acceptance by the marketplace is rapidly moving forward. It has gained credibility
    and is being deployed widely for Web serving and scientific and technical computing
    clusters in a relatively short time. It is now being ported as well to mission-critical
    areas such as workload consolidation, retail points-of-sale, and financial branch
    automation.


    IBM is committed to providing the same level of support normally associated with
    enterprise computing environments as Linux continues to move in to those key business
    and industry areas. IBM''s Linux service offerings are designed to help Linux
    customers achieve better flexibility and cost-to-benefit rates.


    IBM Global Services offers one of the industry''s most comprehensive portfolios
    of Linux consultative and support offerings, from planning and design, to implementation
    and technical support. IGS also offers a full portfolio of Linux Services and
