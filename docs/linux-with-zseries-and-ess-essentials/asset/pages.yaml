- pgno: 60
  md: '# FCP for zSeries with Linux


    This chapter gives details about the Fibre Channel Protocol (FCP) support for
    attaching the ESS to a zSeries server running Linux.


    Note that it remains possible to connect the Enterprise Storage Server to Linux
    on zSeries using traditional ESCON and FICON channels. This was in fact the only
    supported method when Linux for zSeries became available in early 2000. The Enterprise
    Storage Server can be configured as CKD disk, and generally speaking all current
    models of the Enterprise Storage Server are interoperable with all current models
    of the zSeries and all current levels of z/VM and Linux for zSeries, using ESCON
    or FICON channels. For specific details, refer to the ESS Interoperability Matrix
    and Host Systems Attachment Guide, SC267446, located at:


    http://www.storage.ibm.com/disk/ess/supserver.htm'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 5.1 zSeries and FCP


    In February 2003, the support of Fibre Channel attached devices was added to zSeries.
    (This support is only for Linux on zSeries, and not for z/OS or z/VM.) Using this
    new zSeries Fibre Channel Protocol (FCP), Linux for zSeries can access standard
    SCSI storage devices, and distributed storage in a SAN. This enables customers
    to preserve their existing investment in FCP/SCSI storage devices while consolidating
    distributed servers onto zSeries. A complete list of devices supported for attachment
    to zSeries systems using FCP can be found at:


    http://www-1.ibm.com/servers/eserver/zseries/connectivity/#fcp


    http://www-1.ibm.com/servers/eserver/zseries/connectivity/fcp.html


    The Enterprise Storage Server has been successfully connected to Linux for zSeries
    using FCP, and this is discussed in 5.2, “Connecting ESS to Linux on zSeries using
    FCP” on page 52. In this section we give a brief overview of the traditional zSeries
    I/O architecture versus the zSeries Fibre Channel. This overview is based on the
    redbook Implementing Linux with IBM Disk Storage, SG24-6261-01. Additional details
    can be found in the before mentioned redbook, and also in the redpiece Getting
    Started with zSeries Fibre Channel Protocol, REDP0205, and redbook IBM eServer
    zSeries Connectivity Handbook, SG24-5444.


    # 5.1.1 zSeries specific storage attachments


    The I/O component of z/Architecture™ is based on channels, control units, and
    devices. Channels provide a well-defined interface between a server and the attached
    control units. Originally implemented on parallel copper media, today''s channels
    such as ESCON and FICON use optical serial cables. Also, the parallel channel
    was a multi-drop interface, while both ESCON and FICON are switched point-to-point
    connections, as depicted in Figure 5-1.


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_61_0.png)


    Figure 5-1 Typical zSeries storage attachment concept


    ESCON channels use a unique physical interface and transmission protocol. FICON,
    on the other hand, is based on industry standard Fibre Channel lower-level protocols.
    In both cases, the higher-level I/O protocol used by software is based on channel
    programs consisting of channel command words (CCWs), and is unique to mainframes
    adhering to z/Architecture or its predecessors (such as the ESA/390 architecture).
    For access to disk storage, a specific set of CCWs is used, defined by the CKD
    protocol. This protocol describes not only the commands and responses exchanged
    across the channel, but also the format of the data as it is recorded on the disk
    storage medium. For tape, similar CCW-based command protocols'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'exist, but there are no associated access protocols for media such as DVDs
    or scanners, because the necessary software drivers and control units have never
    been provided.


    # zSeries and storage device addressing


    With z/Architecture, software addresses a storage device using a device number,
    which uniquely identifies the device. The device number is set by the IOCDS, and
    is an arbitrary 16-bit number expressed as four hexadecimal digits. It is informally
    know as an address. A device number is mapped to one or more physical paths to
    the device by the IOCDS. This physical path is typically described by a quadruple
    of hardware addresses consisting of:


    +   - Channel path identifier (CHPID): Identifies the channel that provides a
    path to the device

    - Physical link address: Identifies a route through a switch or director

    - Control unit address: Specifies the control unit

    - Unit address: Identifies the device


    Please refer to the left side of Figure 5-4 on page 51.


    There is typically more than one physical path to a device, to allow for redundancy
    for example. While these paths are specified using different address quadruples,
    software still uses a single device number to address the device, independent
    of the path that is chosen for any particular I/O.


    # 5.1.2 Distributed storage attachments


    Traditionally, storage controllers in the distributed world have been attached
    through parallel SCSI cabling, which allows for only very limited distances between
    the server and the controller. The SCSI standard uses a control-block-based command
    and status protocol. Today, there is a clear distinction between the physical
    level and the command/status level of the SCSI protocol.


    # FCP advantages


    Based on the higher-level SCSI command/status protocol, a new standard has been
    defined called FCP, which stands for Fibre Channel Protocol for SCSI. FCP employs
    the SCSI command/status protocol on top of an underlying Fibre Channel transmission
    protocol. Due to the superiority of the optical Fibre Channel connection regarding
    speed, distance, and reliability, storage attachments through FCP have the highest
    growth rate in today''s distributed world.


    # FCP storage addressing


    Traditional SCSI devices have a simple addressing scheme. Originally, the device
    address, known as the target address, was simply a number in the range 0-7 (extended
    to 0-15 in newer SCSI architecture), with address 7 usually reserved for the host
    adapter. As shown in Figure 5-2, SCSI also supports the definition of Logical
    Unit Numbers (LUNs), where each LUN represents a partition of the target (or controller),
    such as a disk drive.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '![](img/da33d6b6aa12b73deb3c350a0a89d424_63_0.png)


    Figure 5-2 SCSI addressing


    For FCP, a new addressing scheme, based on World Wide Names (WWN) was developed.
    Each node and each port on a node (such as an FCP port) is assigned a WWN, respectively
    known as World Wide Node Name (WWNN) and World Wide Port Name (WWPN). In addition,
    addressable units within a node (such as a disk drive) are assigned a LUN name.
    This is illustrated in Figure 5-3.


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_63_1.png)


    Figure 5-3 World Wide Names


    # 5.1.3 zSeries-specific versus distributed storage controllers


    Two types of storage controllers with Fibre Channel interfaces are currently available
    for zSeries:


    +   - Those supporting the z/Architecture specific FICON interface based on CCW
    architecture, with the CKD command set for disk storage and similar sets of commands
    for tapes.

    - Those supporting the SCSI-based FCP protocol, with SCSI command sets specific
    to the device type, such as disk or tape.


    Both types of controllers are normally based on the same hardware building blocks.
    Their individual characteristics are achieved by different firmware handling the
    host interface. For example, the Fibre Channel/FCP host adapter on the ESS can
    be configured for either FICON or FCP protocols. The way the DASD addressing or
    device mapping is handled is illustrated in Figure 5-4, which summarizes the previous
    discussion.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/da33d6b6aa12b73deb3c350a0a89d424_64_0.png)


    Figure 5-4 DASD addressing scheme


    # zSeries and storage: Summary


    To summarize, classical zSeries operating systems such as z/OS and z/VM were designed
    for use only with storage controllers that supported protocols defined by z/Architecture.
    This changed with the advent of Linux for zSeries, since its storage I/O component
    is oriented toward SCSI protocols. Lacking the capability to access SCSI-based
    storage devices on a zSeries server system, it was necessary to add specific support
    to Linux for zSeries to enable it to function in a CCW-based zSeries I/O environment.


    However, this additional layer in Linux for zSeries is unique to zSeries, and
    does not allow it to exploit storage subsystems and applications that are dependent
    on a SCSI attachment. For this reason, an FCP attachment capability has been added
    to the zSeries systems, allowing the attachment of SCSI-based storage controllers,
    and enabling Linux for zSeries to access these controllers in the Linux-standard
    manner. Figure 5-5 shows the differences in format translation between the two
    access methods. The overhead for accessing block-oriented devices from a block-oriented
    device layer through a conversion of the requests to CKD format has been removed.'
  merge: -1
  img_proc: true
