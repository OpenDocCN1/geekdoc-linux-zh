- pgno: 14
  md: '![](img/da33d6b6aa12b73deb3c350a0a89d424_14_0.png)


    # Introduction to Linux


    Linux is a UNIX-like open source operating system. It was the original creation
    of Linus Torvalds from Helsinki, Finland in 1991. He wrote the first kernel, which
    is the underlying program interfacing and running the computer hardware.


    Since the Linux source code is freely available, several companies have developed
    different distributions of Linux. A distribution is a complete system. The key
    component is the Linux kernel. Other utilities, services, and various applications
    can be included as well, depending on the distribution and the intended use. There
    is no standard distribution. Each distribution that is available has unique advantages.


    IBM was early to recognize the value of Linux:


    +   - Investing in Linux-related product development

    - Forming alliances with key Linux distributors

    - Contributing to the open-source community

    - Aggressively supporting the platform


    IBM believes this investment will benefit its customers as they continue to exploit
    Linux for their IT infrastructures and e-business.


    This chapter provides a brief introduction to Linux, and an historical perspective
    to its origins and relationship to open source and the GNU General Public License.
    The chapter continues with a high-level description of the Linux operating systems
    and its components, where Linux fits in the IT world, and Linux distributions.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 1.1 The foundation for Linux


    We know that Linux refers to a UNIX-like operating system, so let us begin with
    a brief overview of the development of portable operating systems and open source
    to see the context in which Linux evolved.


    # 1.2 The GNU General Public License


    In 1969, several AT&T Bell Labs employees¹ began work on an operating system (OS)
    that would be called UNIX. A significant novelty of their development was that
    the OS was portable across hardware platforms.


    At the time, AT&T, for various legal reasons, was permitting free academic access
    to the source code to UNIX while charging over $20,000 (in 1976 dollars!) for
    commercial or government access. AT&T then halted publication of the source code
    in university texts as this revealed proprietary Bell Labs code. The era of collaborative
    programming had arrived.


    In the US, the academic variant of interest to UNIX became the Berkeley Systems
    Distribution (BSD),² where virtual memory and networking were added. These advancements
    permitted large collaborative projects with contributors scattered throughout
    the world. Lawsuits eventually ensued among AT&T, the Regents of the University
    of California, and other parties over access to and distribution of the OS source
    code. Such constraints on intellectual property rights to code provided strong
    motivation for one researcher from the Artificial Intelligence Laboratories at
    the Massachusetts Institute of Technology to write an operating system that was
    both portable, and also would be licensed in a manner that would prevent its eventual
    constraint by intellectual property claims.


    The new OS was to be named GNU, a recursive acronym for “Gnu’s Not UNIX.” This
    work would be “copylefted” instead of copyrighted, licensed under the GNU General
    Public License (GPL), which stipulates that all programs run under or derived
    from GNU must have their source code published freely, relinquishing rights of
    control while retaining rights of ownership. This was the birth of free (as in
    freedom) software, in contrast to software in the public domain. By this time,
    vendors such as Sun, Hewlett-Packard, and IBM had proprietary commercial offerings
    derived from licensed AT&T UNIX that were gaining popularity with corporate customers.
    The nascent GNU development effort began by making tools such as editors, compilers,
    and file utilities available in source form that could be compiled and executed
    on any platform, standardizing and improving upon those offered by commercial
    vendors. Around 1990, programmers had contributed a nearly complete operating
    environment to GNU, with the exception of a kernel. The GNU kernel was to be based
    on a micro kernel architecture for improved portability.


    In the meantime, a small scale UNIX-like skeleton of an operating system³ called
    Minix was published in a text to be used as a teaching tool. It is here that Linus
    Torvalds enters the story. He decided to write a UNIX-like OS with improved functionality
    over that of Minix to run on readily available personal computers. He and colleague
    Lars Wirzenius published their source code under the GPL on the Internet for public
    comment, and Linux was born.


    Linux was a kernel without utilities, GNU was an operating environment lacking
    a finished kernel, and unencumbered non-kernel BSD pieces were available to complete
    the picture. In short order the components were combined with installation and
    maintenance tools and


    ¹ Ken Thompson, Dennis Ritchie, and J.F. Ossanna


    ² Twenty Years of Berkeley UNIX: From AT&T-Owned to Freely Redistributable, Marshall
    Kirk McKusick, in Open Sources: Voices from the Open Source Revolution, O’Reilly,
    1999 1-56592-582-3


    ³ Dr Andrew S. Tannenbaum, Vrije Universiteit, Amsterdam, The Netherlands'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'made available by distributors; the first of serious note is Slackware in 1993,
    followed by many others, making the GNU/Linux (or simply Linux, as it has since
    come to be known) combination readily available. In only a few years, a worldwide
    Linux community has evolved, comprised of programmers and users attracted by the
    reliability and flexibility of this “free” operating system.


    The term “open source” began to replace the term “free software” as the commercial
    adoption of GNU/Linux grew. There is in fact a difference, upon which hinges the
    fate of commercial ventures in this arena.


    # 1.3 Open source


    Linux was developed under GNU, which has articulated a philosophy that defines
    “free code” or the user’s right to use the code, rather than defining what they
    cannot do, which is the case with proprietary software. This license allows the
    user to alter, distribute and even sell the code covered under its license as
    long as they allow those to whom they distribute the code to do the same.


    The General Public License promotes free code on the GNU Web page. It also provides
    protection for the developer and prevents a user from altering the code and then
    asserting proprietorship over the code. This does not mean the code cannot be
    sold. According to the GNU Web site, “free software” allows a user to run, copy,
    distribute, study, change, and improve the software. It must also be available
    for commercial use.


    Standards enable communication among heterogeneous software and systems. Open
    source can be viewed as a manifestation of this process, and the process itself
    as a necessity for extending the development of inter-networking. When there is
    a need for new software or hardware support, or a defect is discovered and reported,
    the software (creation or correction) can be swiftly done by the user who required
    the changes (or by the original author), with no need for a design review, cost
    analysis, or other impositions of a centralized development structure. This is
    made possible by open source code.


    IBM has recognized the efficacy of this community and sees the benefit of the
    rapid and innovative development of robust and stable code to provide the enabling
    layer for e-business applications. As a result of the evolutionary development
    of Linux, pieces of the code are located on various Web sites. Without some integration,
    it is difficult to install and upgrade the product, keep track of module dependencies
    and acquire drivers for the hardware. Distributions provide coherent bundles of
    software in one location that furnish the capabilities needed for a usable server
    or desktop. Generally, the products of different distributors have a lot of things
    in common, but there may be particular features or functions, which you may require
    that are not available from a given distributor.


    # 1.4 Linux: The operating system


    Linux is a fully functional operating system similar to a UNIX system. It has
    all the standard features of enterprise UNIX systems. Management of the command
    structure is enabled through shells. We mention two of the many advanced shells
    that are available for Linux, the Bourne Again Shell (bash), and the tsch shell.
    Both shells support a complete shell-based programming language that you can use
    to create shell scripts.


    There are four fundamental components of Linux:


    +   - Kernel: Provides program and hardware device management (such as disks and
    printers)'
  merge: -1
  img_proc: true
- pgno: 17
  md: '+   - **Shell**: Receives commands from the user and sends those commands to
    the kernel for the execution through a standard user interface.

    - **File structure**: Files are organized into directories with the disk hardware.
    Each directory may contain any number of subdirectories each holding files. This
    is a similar structure to PC operating system file structures.

    - **Utilities**


    In some solutions, typically with clusters, the Linux server does not need the
    traditional PC hardware BIOS. The hardware is directly controlled by Linux. This
    provides phenomenal boot-up times (three seconds is the current record).


    Linux has the same multiuser and multitasking capabilities as large UNIX servers.
    It provides the same level of system administration that you find on standard
    UNIX systems. Users can run several programs concurrently. You can create user
    accounts for different users and define their access rights to the files and system
    components. Installation of new devices, and network connection and control are
    also provided as standard in the Linux operating system.


    As a development environment, Linux has a powerful set of development tools for
    creating industrial-strength applications. The development toolset includes the
    *GNU C Compiler*.


    The Linux structure provides the ability for programmers to access the hardware
    of the computer and the networks to which it is connected. This is achieved by
    the provision of a *hardware abstraction layer* where programs can take advantage
    of hardware features through a standard applications programming interface (API).


    Linux programs can be portable to other versions of UNIX systems. Linux can use
    ANSI C, combined with one of several portability graphical user interface (GUI)
    toolkits. These programs can be written for both UNIX systems and Windows servers.


    # 1.5 Where Linux fits in


    The adoption of Linux has been a rapid and changing process. It can be difficult
    to determine where Linux fits into the modern IT world. Linux plays a role in
    almost every area and is quickly making inroads where traditional operating systems
    ruled for years.


    # 1.5.1 Working with other operating systems


    Linux is being used not only as the single operating system on a given computer
    system. It is also frequently used to populate virtual partitions on larger, non-Intel
    based systems such as the IBM @server, iSeries™, pSeries™, and zSeries servers.
    The virtual or logical partition provide:


    +   - **Server consolidation:** An organization with existing Linux or UNIX servers
    can save hardware and personnel costs by consolidating those servers into virtual
    partitions on an existing IBM eserver platform.

    - **High availability:** Multiple virtual partitions can provide a level of availability
    and application-based load balancing while retaining the management benefits of
    consolidated hardware.

    - **Infrastructure:** Linux virtual partitions can provide security and infrastructure
    services to other partitions, which share the same virtual network.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 1.5.2 Infrastructure


    Linux enters the mainstream markets by providing critical infrastructure services.


    # Web serving


    The combination of Linux and Apache offers an attractive package for customers.
    It provides a low cost, flexible solution for Web servers, with over 30% of the
    world''s Web sites running this combination. The demand is now moving toward high
    capacity Web sites, which users can interact with and that support high transaction
    rates.


    # File and print serving


    One of the basics for Linux implementation is the provision of inexpensive facilities
    such as file and print services. Linux offers a rapid return on investment (ROI)
    in this part of the infrastructure space. The management capabilities and low
    cost make this an easy solution to justify. Also, this is an important environment,
    but it does not typically have the operational importance of line-of-business
    applications. It is a relatively safe place for businesses to test this new technology.


    # Domain name server (DNS) and DHCP


    As a UNIX-clone, Linux is well proven at hosting Berkeley Internet Name Daemon
    (BIND) name servers and Dynamic Host Configuration Protocol (DHCP) services.


    # Router


    Linux is capable of advanced routing using inexpensive commodity hardware. Also,
    some router vendors have chosen Linux to be their embedded operating system.


    # Firewall and Intrusion Detection Services (IDS)


    Linux has been a popular provider of firewall and IDS services. Because of the
    advanced configuration and customization options, along with a small memory footprint,
    Linux has been an ideal solution for many organizations who want to avoid proprietary
    solutions.


    # 1.6 Linux distributions


    Linux is available in many configurations from a variety of distributors. Linux
    advocates have strong preferences for one distribution over the other. Distributions
    from, for example, Red Hat, SuSE, Mandrake, and Debian, are presently available
    and offer their own advantages in package management, installation, development
    environment, and ease of use of various tools.


    In this book we only highlight two Linux distributors. IBM does not favor any
    specific Linux distribution, but instead IBM pushes for the standardization of
    Linux in general.


    # 1.6.1 Red Hat Enterprise Linux


    +   - **Red Hat Enterprise Linux AS**: Formerly known as Red Hat Linux Advanced
    Server, it is the core operating system and infrastructure enterprise Linux solution
    from Red Hat, supporting up to 8 CPUs and 16 GB of main memory, and is certified
    by the US Defense Information Systems Agency (DISA) as a Common Operating Environment
    (COE) compliant. It features High Availability Clustering and IP load balancing
    capabilities, asynchronous I/O support, Linux standard base interface conformity,
    improved SMP integration, and reduced I/O memory copy overhead.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '+   - **Red Hat Enterprise Linux ES**: Provides the core operating system and
    networking infrastructure specially suited for medium-scale, departmental applications.

    - **Red Hat Enterprise Linux WS**: The desktop/client counterpart for either Enterprise
    Linux ES or AS.


    Red Hat offers support and maintenance services for their enterprise distributions.


    For more information regarding Red Hat Linux, please visit:

    http://www.redhat.com


    # 1.6.2 SuSE Linux Enterprise Edition


    Founded in 1992, SuSE Linux is based in Nuremberg, Germany, and is the most widely
    used distribution in Europe. The latest versions have a new graphical installation
    tool to simplify the installation. The advanced features include hardware acceleration
    for 3-D graphic chips and a journaling file system. SuSE also develops and supports
    a series of X Servers for newer, high-end graphic cards. The installation is available
    in German, English, Italian, and French. SuSE Linux comes with a large group of
    utilities and applications.


    SuSE is available in business versions. These include SuSE Linux Enterprise Server
    (SLES); servers for zSeries, xSeries, pSeries, and iSeries; and versions that
    support Alpha, PowerPC®, and Intel platforms.


    SLES is a package distribution of United Linux (see 1.6.3, “UnitedLinux) intended
    for server applications.


    For more information regarding SuSE Linux, please visit:

    http://www.suse.com


    # 1.6.3 UnitedLinux


    UnitedLinux is a consortium formed in May 2002, established to combine the development
    efforts of several distributors.


    The vision is simple: partners combine the very best server operating system technology
    from leading distributors into a robust, single code based system. In January
    2003 IBM joined UnitedLinux as a technology partner.


    The following United Linux consortium members have identical United Linux distributions:


    +   - SuSE Linux Enterprise Server 8 (SLES 8)

    - Turbolinux Enterprise Server 8 (TLES 8)

    - Conectiva Linux Enterprise Edition Powered by United Linux


    All three companies provide distributions for Intel (xSeries), iSeries, pSeries,
    and zSeries. Turbolinux and Conectiva resell the SuSE distribution. Turbolinux
    markets primarily in the Asia Pacific, while Conectiva markets primarily in Latin
    America. Turbolinux and Conectiva will provide bug fixes to their customers within
    30 days of their release by SuSE. SuSE is the lead UnitedLinux developer.


    Key elements of the UnitedLinux distribution include POSIX standard asynchronous
    I/O (AIO), raw I/O enhancements that provide high-bandwidth, low-overhead SCSI
    disk I/O, and direct I/O that moves data directly between the user space buffer,
    and the device performing the I/O, avoiding expensive copy operations, and bypassing
    the operating system''s page cache.'
  merge: -1
  img_proc: true
