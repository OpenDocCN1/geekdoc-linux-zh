    # 3.2 Background to z/VM


    You can run tens to hundreds of virtual Linux systems under z/VM and, when running
    Linux as a z/VM guest, you inherit all the features of z/VM. This section highlights
    some of these features.


    Virtual Machine (VM) technology was introduced with the IBM System/360™, the original
    mainframe, back in the mid-1960s. At that time, VM enabled users of S/360 systems
    to run multiple copies of operating systems on a single mainframe. Being able
    to run multiple operating systems made it possible to migrate to new releases
    and versions on the same mainframe system. A user could run a production workload
    on the old level of software while, at the same time, performing the work required
    to migrate the environment to the new operating system.


    Over the course of 30-plus years, IBM made investments in hardware, architecture,
    and microcode, as well as in the VM product itself, to enhance the virtualization
    technology available with each successive line of mainframe computers. This ‘total
    system’ investment is why IBM @server zSeries line of servers offers the industry''s
    best-of-breed virtualization technology.


    The virtualization technology found in z/VM is unique. Some ‘virtual server’ solutions
    consist of running multiple applications on a single operating system using virtual
    storage techniques to meet memory demands. z/VM on the other hand uses the real
    resources at its disposal (processors, memory, I/O, network, etc.) to create virtual
    machines, each able to run its own independent copy of any operating system that
    supports the zSeries architecture (which includes Linux). An operating system
    running in a virtual machine does so as if it were executing on real hardware.
    Hardware architecture and facilities are presented to the ‘guest’ system (i.e.
    are virtualized) by z/VM in such a way that the guest operating system believes
    it is using a real system, not a virtual one. Figure 3-5 shows an example with
    multiple virtual machines, including three Linux machines and a z/OS. The physical
    hardware is not seen by the guests - instead, each guest sees the virtual machine
    presented by z/VM.


    z/VM is even able to create a virtual machine environment that is functionally
    richer than a ‘real’ environment. Examples of this include:


    +   - Using data-in-memory techniques to transparently enhance guest system performance

    - Simulating device networking facilities that do not exist in the real mainframe
    system

    - Sharing a single copy of a kernel among several guest systems'
  merge: -1
  img_proc: true
- pgno: 41
  md: '![](img/da33d6b6aa12b73deb3c350a0a89d424_41_0.png)


    Figure 3-5  z/VM virtualization


    # 3.2.1 Virtual networking with z/VM


    Virtual networks use z/VM virtualization to provide connectivity between guests
    without needing real hardware. Virtual networks enable fast and cost effective
    TCP/IP communication between z/VM Linux guests. Note that connectivity in a z/VM
    virtual network is limited to guests running in a single z/VM image. Virtual networks
    cannot be used for inter-LPAR communication. There are three types of virtual
    networks available to Linux guests:


    +   - **Inter-user communication vehicle (IUCV)**: Point-to-point TCP/IP connections
    between Linux guests can be established using IUCV. The Linux for S/390 and zSeries
    kernels include an IUCV driver, allowing you to connect two Linux virtual machines.
    Linux treats IUCV connections as any other TCP/IP network connection.

    - **Virtual channel-to-channel (vCTC)**: vCTC networks provide point-to-point
    connectivity between guests without real channel allocation. z/VM provides the
    ability to define virtual channel-to-channel adapters so that users can connect
    virtual machines using the CTCA protocol. On z/VM, this is useful for connecting
    Linux virtual machines to other virtual machines that do not support IUCV, such
    as z/OS. Virtual vCTC networks can also connect Linux virtual machines.

    - **VM Guest LAN**: IUCV and vCTC support point-to-point connections. This can
    be cumbersome to manage if you plan to connect a server image to a large number
    of virtual machines. z/VM 4.2 introduces a new capability called ''Guest LAN''
    support. A server image running z/VM connects to a Guest LAN using the Hipersocket
    protocol. Virtual Hipersockets look just like the real thing to a Linux server,
    or any software that supports real HiperSockets™. There is no limit to the number
    of virtual Hipersockets connections that can be defined in a z/VM environment,
    and there is no predefined limit on the number of Guest LANs that can be defined.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 3.2.2 Systems management functions built-in to z/VM


    There are many built-in systems management functions in z/VM. We describe just
    a few of them.


    Customers wanting to exercise command and control over their ‘real’ discrete server
    farms typically have to purchase additional servers to run Command and Control
    software products, often times also requiring client code to be installed on each
    server image being managed. This can become expensive in terms of software licence
    fees (for the servers and client code) plus additional hardware and networking
    expenses for the servers, not to mention the added complexity. z/VM includes a
    lot of Command and Control function built into the product.


    Resource utilization controls include the ability to allocate processor capacity
    on a per-image basis with a high degree of granularity. Adding more resources
    like memory, disk space, and data-in-memory support can be done quickly and easily,
    though sometimes requiring a re-boot of the affected Linux images depending on
    the resource being added.


    VM offers tools like REXX, the Programmable Operator (PROP) and Pipelines, to
    build automation routines that can help minimize the manual intervention required
    to manage a server farm. For example, you could capture console traffic from Linux
    servers and programmatically perform system operations based on the console data.


    # 3.3 Consolidation and scalability


    In this section we explain the advantages that z/VM offers when you need to grow
    the capacity of your solution (scalability) or make more efficient use of disparate
    server resources (consolidation).


    # 3.3.1 Scalability


    The zSeries platform has long been recognized for its ability to scale to support
    the consolidation of diverse workloads. Processors and disks (such as the Enterprise
    Storage Server) can be incrementally upgraded to meet growing demands. Once upgraded,
    the zSeries server can then scale or grow its Linux workload in two ways.


    Vertical growth - when more system resources are added to an existing Linux image.
    For example, a Linux virtual machine could be given more processor capacity, more
    virtual memory, more I/O devices, or more virtual networking bandwidth.


    Horizontal growth - when additional Linux systems (typically z/VM guests) are
    added. This is illustrated in Figure 3-7.


    # 3.3.2 Consolidation


    Consolidation of real distributed servers onto a zSeries platform, and in particular
    as guests under z/VM (as illustrated in Figure 3-6 on page 30), can offer many
    advantages. Virtual servers on z/VM share total system resources, such as memory
    and processor capacity, thus optimizing resource utilization. Disk space can be
    also be shared amongst z/VM guests, and in particular read-only files (like application
    code and operating systems software) can be placed on one disk and made accessible
    to all the virtual Linux servers, thus minimizing maintenance workload and software
    costs. z/VM also provides virtual networking and built-in systems management functions,
    as described in 3.2, “Background to z/VM” on page 27.


    Lightly to moderately loaded servers that do not peak concurrently are good candidates
    for consolidating on a zSeries server running Linux.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '![](img/da33d6b6aa12b73deb3c350a0a89d424_43_0.png)


    Figure 3-6 Server farm in a box


    Some key applications are usually deployed in a three-tiered mode; a database
    tier, an application tier, and a presentation tier. In a hybrid z/OS and Linux
    for zSeries environment, the database server resides on a z/OS image, while the
    application server runs on a Linux for zSeries instance. Both reside on the same
    hardware, enabling the customer to remove a layer of hardware and maintenance
    effort while still meeting the performance requirements that the solution demands.
    In addition, with the application and database now hosted on the one system, the
    real networks between them can be replaced by the networking features of zSeries
    (such as Hipersockets).


    When servers have been consolidated onto a zSeries server, and in particular when
    running as z/VM guests, the horizontal growth of your server farm can be accomplished
    with minimal time (typically minutes), and without requiring additional hardware
    or real estate, by simply adding another Linux virtual machine. This is shown
    in Figure 3-7. Moreover, you are still able to maintain the distributed environment
    paradigm of “one server one application.”


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_43_1.png)


    Figure 3-7 Horizontal server growth


    A number of the features and benefits discussed above are illustrated in “Typical
    file/print serving scenario with Samba” on page 31, where we outline a scenario
    in which multiple'
