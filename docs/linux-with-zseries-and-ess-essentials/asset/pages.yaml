    # 2.2.3 IBM Support Line


    IBM offers “enterprise-grade” support for Linux through the Internet, and voice
    support 24 hours-a-day, 7 days-a-week. This support ranges from answering usage
    questions to identifying problems, all revolving around the customer''s needs.


    Recent analyst studies have shown that among the most important concerns related
    to Linux implementations, support is an important consideration for both solution
    and vendor selection. IBM offers world-class support for Linux as a standard offering,
    with several options including the ability to customize support according to the
    skills and experience of the customers current IT staff.


    Support Line is IBM''s support offering for e-infrastructure software. It is an
    established worldwide proven service, which covers IBM and non-IBM Software products.
    Support Line offers:


    +   - Years of experience in world-wide support for IBM and non-IBM operating
    systems

    - World-wide support structure

    - The right tools

    - The right people

    - The right alliances


    # IBM Operational Support Services: Support Line for Linux


    This fee service provides remote Linux technical assistance to answer usage, installation,
    and technical questions, to address product compatibility and inter operability
    concerns, and to isolate and diagnose problems. IBM Linux engineers are available
    24 hours-a-day to provide defect support (fixes).


    Support Line provides consistent, cross-platform Linux support for IBM @server
    platforms and Intel/AMD OEM hardware. With this service, customers receive telephone
    access and electronic access to IBM services specialists.'
