- pgno: 12
  md: '# Preface


    IBM® has been committed to Linux long before it became trendy. This early adoption
    of the Linux potential explains why today IBM offers the widest range of platforms
    and products for deploying solutions on Linux, along with support and services.


    IBM TotalStorage® products are known for their high quality and reliability and
    work well with Linux. As part of a well designed Linux based e-business infrastructure,
    they can help you cut costs, consolidate infrastructure, and position you for
    the new on-demand world.


    This IBM Redbook presents high-level information on Linux in conjunction with
    IBM @server and TotalStorage products, giving proof points that these products
    can be deployed together to provide enterprise-class solutions. In particular
    this book looks at Linux with the zSeries® servers and IBM TotalStorage Enterprise
    Storage Server® (ESS) disk products. The book describes the Fibre Channel Protocol
    (FCP) support now available when connecting the ESS to a zSeries host running
    Linux. The last chapter describes the ESS copy services available for Linux on
    zSeries.


    This redbook is intended as a starting point and reference for IBM representatives,
    and Business Partners or clients who are planning Linux based solutions with IBM
    zServers and ESS storage products.


    Most of the information contained in this book is a compilation of the material
    from the Linux Handbook, SG24-7000, and Implementing Linux with IBM Disk Storage,
    SG24-6262-01. We encourage the reader to refer to these redbooks for more complete
    information, or for implementation details.


    # The team that wrote this redbook


    This redbook was produced by a team of specialists from around the world working
    at the International Technical Support Organization, San Jose Center.


    **Bertrand Dufrasne** is a Certified Consulting I/T Specialist and Project Leader
    for Disk Storage Systems at the International Technical Support Organization,
    San Jose Center. He has worked at IBM for 21 years in many IT areas. Before joining
    the ITSO he worked for IBM Global Services in the US as an IT Architect. He holds
    a degree in Electrical Engineering.


    **Don Skilton** is a Storage Systems Specialist with IBM Global Services, Australia.
    He has a degree in Mathematics, and joined IBM Australia in 1985. He has been
    working with mainframe storage software and hardware for the last 15 years. Areas
    of specialization in recent years include Tivoli® Storage Manager (especially
    for Linux on zSeries clients), storage management process engineering, conversion
    of third party tape management systems to IBM''s DFRMM, and data center relocations.


    **Jonathan Wright** is a Technical Specialist in New Zealand. He has 10 years
    of experience in the Intel server and storage field. His areas of expertise include
    xSeries® hardware, Linux, clustering, and FAST Storage.


    Thanks to the following people for their contributions to this project:


    Cristina Zabeu

    IBM Linux and Storage Solutions Market Leader'
  merge: -1
  img_proc: true
