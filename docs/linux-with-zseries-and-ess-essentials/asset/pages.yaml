    advantage of a Linux-powered IBM @server solution. It offers a scope of the tremendous
    acceptance and commitment Linux has today.


    The resources portrayed here provide a good, consolidated starting point to more
    detailed information. We recommend that you read and learn about these resources
    to help you stay current with Linux''s commitments and new services, which continue
    to grow rapidly.


    The information in this chapter was correct at the time this book was written.
    However, some of the information may change due to normal variations in the life
    cycle of each product. This is true for products other than Linux as well. This
    means that IBM may not support a specific product even though it may appear to
    be supported in this chapter. Therefore, we encourage you to investigate topics
    such as end-of-service dates, product withdrawals, and other support restrictions
    while gathering information from this chapter.


    **Important:** The services portrayed here are for IBM customers only, and may
    not be available in some specific countries or regions. Contact your local IBM
    Global Services (IGS) representative for details.'
