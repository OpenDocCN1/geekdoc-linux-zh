    \nFigure 4-4 Enterprise Storage Server Model 800\n\n# Efficient cache management\
    \ and powerful back-end\n\nThe ESS is designed to provide the highest performance,\
    \ for different types of workloads, even when mixing dissimilar workload demands.\
    \ For example, zSeries servers and open systems put very different workload demands\
    \ on the storage subsystem. A server like the zSeries typically has an I/O profile\
    \ that is very cache-friendly, and takes advantage of the cache efficiency. On\
    \ the other hand, an open system server does an I/O that can be very cache-unfriendly,\
    \ because most of the hits are solved in the host server buffers. For the zSeries\
    \ type of workload, the ESS has the option of a large cache (up to 64 GB) and\
    \ most importantly it has efficient cache algorithms. For the cache unfriendly\
    \ workloads, the ESS has a powerful back-end, with the SSA high performance disk\
    \ adapters providing high I/O parallelism and throughput for the ever-evolving\
    \ high-performance hard disk drives."
