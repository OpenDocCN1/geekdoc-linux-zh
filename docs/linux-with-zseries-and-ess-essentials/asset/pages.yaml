- pgno: 101
  md: '# Linux with zSeries and ESS: Essentials


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_101_0.png)


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_101_1.png)


    +   - Enterprise-class solutions with Linux and IBM TotalStorage

    - Focus on zSeries and ESS

    - FCP support for Linux on zSeries


    This IBM Redbook presents high-level information on Linux in conjunction with
    IBM @server and TotalStorage products, giving proof points that these products
    can be deployed all together to provide enterprise-class solutions.


    In particular this redbook looks at Linux with the zSeries servers and IBM TotalStorage
    Enterprise Storage Server (ESS) disk products. The book describes the Fibre Channel
    Protocol (FCP) support now available when connecting the ESS to a zSeries host
    running Linux. The last chapter describes the ESS copy services available for
    Linux on zSeries.


    This book is intended as a starting point and reference for IBM representatives,
    Business Partners, or clients who are planning Linux based solutions with IBM
    zServers and ESS storage products.


    Most of the information contained in this book is a compilation of the material
    from the Linux Handbook, SG24-7000, and Implementing Linux with IBM Disk Storage,
    SG24-6262-01. We encourage the reader to refer to those IBM Redbooks for more
    complete information, or for implementation details.


    # INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    # BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Customers and Partners from around the world create timely technical
    information based on realistic scenarios. Specific recommendations are provided
    to help you implement IT solutions more effectively in your environment.


    For more information:

    ibm.com/redbooks'
  merge: -1
  img_proc: true
