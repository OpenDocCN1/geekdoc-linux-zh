    ## 数据保护和远程复制功能


    图 4-5 说明了 ESS 的灾难恢复和可用性功能。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_55_0.png)


    图 4-5 灾难恢复和可用性


    IBM TotalStorage Enterprise Storage Server Model 800 的许多设计特性和高级功能有助于以有效的方式保护数据。


    ### 容错设计和并发维护


    ESS 采用容错硬件设计，其中主要硬件元素（如磁盘驱动器、数据路径、逻辑组件、电源和缓存）都是冗余的。例如，集群 1 的 NVS 位于集群 2 中，而集群
    2 的 NVS 位于集群 1 中，这样在集群发生故障时，故障集群的写入数据将被保存在另一集群的 NVS 中。此外，ESS 具有内置的呼叫回家功能，用于响应
    IBM 支持中心的响应以及定期主动验证 ESS 运行状态。ESS Model 800 的架构允许几乎所有维护操作，例如维修、代码升级和容量升级，都可以在 ESS
    在线运行的同时进行。对 ESS 配置的更改，例如定义逻辑磁盘卷并将其分配给主机，可以由客户随时动态完成。


    ### RAID 5 或 RAID 10 数据保护


    使用 ESS Model 800，现在除了 RAID 5 排列之外，还可以选择将磁盘阵列配置为 RAID 10 布局（镜像加条带），这在选择用于保护用户数据的冗余技术时提供了更大的灵活性。RAID
    5 由六个或七个用于用户数据的磁盘加上一个奇偶校验磁盘组成。RAID 10 由一组用于用户数据的磁盘及其镜像磁盘对应物组成。


    ### 远程复制


    ESS Model 800 支持两种类型的远程复制，即点对点远程复制（PPRC）和扩展远程复制（XRC）。PPRC 是一种基于硬件的解决方案，用于将主站点（应用程序站点）的逻辑卷镜像到从站点的卷（恢复站点），使用同步或非同步过程。PPRC
    是面向开放系统服务器（如 xSeries）以及 zSeries 服务器的远程复制解决方案。最近宣布了 PPRC V2，它提供了级联功能。PPRC 在 6.2
    节“点对点远程复制（PPRC）”第 63 页中有更详细的讨论。


    注意：XRC 仅适用于 z/OS 和 OS/390® 环境，不适用于 Linux on zSeries 或开放系统。


    ### 时间点复制功能


    用户仍需要进行备份以保护数据免受逻辑错误和灾难的影响。对于所有环境，传统上备份用户数据需要相当长的时间。通常，由于其持续时间以及对正常操作的后果影响，备份是在非主要班次之外进行的。数据库必须关闭以创建一致性和数据完整性，并且在线系统通常会关闭。


    使用 ESS Model 800，使用 FlashCopy® 功能时，备份时间已减少到最短时间。FlashCopy 创建数据的即时时间点副本，并使能够立即访问源卷和目标卷，从而允许应用程序以最小的干扰恢复。最近宣布了
    FlashCopy V2，它提供了多重关系和增量 FlashCopy 功能。FlashCopy 在 6.4 节“FlashCopy”第 68 页中有更详细的讨论。


    注意：IBM TotalStorage Enterprise Storage Server Model 800 还提供一种称为 Concurrent Copy
    的时间点复制功能，但该功能仅适用于 z/OS 和 OS/390 操作系统，不适用于 Linux。


    ### 按需备用容量


    为了使 ESS Model 800 更具可扩展性，并更能够适应动态和不可预测的工作负载需求，已宣布了按需备用容量功能。当您的存储需求增加时，您可以在没有任何
    IBM 干预的情况下激活额外容量，并且不会对您的工作造成任何中断。当备用容量被激活时，ESS 会自动报告容量使用量的增加。按需容量有助于控制成本，同时避免在无法准确预测容量增长时间时可能导致的获取存储延迟。


    ### 存储区域网络 (SAN)


    SAN 策略是如第 44 页图 4-6 所示将任何服务器连接到任何存储。随着 SAN 迁移到 2 Gb 技术，存储子系统必须利用这种更强大的带宽。跟上 SAN
    技术的演变，Enterprise Storage Server Model 800 正在引入新的 2 Gb 光纤通道/FICON 主机适配器，用于原生服务器连接和
    SAN 集成。这些新的 2 Gb 光纤通道/FICON 主机适配器将 F 型号可用先前适配器的带宽和瞬时数据速率加倍，每个适配器有一个端口，具有 LC 连接器，可通过长波或短波光纤链路进行全双工数据传输。这些适配器支持
    SCSI-FCP（光纤通道协议）和 FICON 上层协议。每个光纤通道端口可以由多个异构主机和 HBA 共享，可能减少所需的端口数量。包括 LUN 屏蔽以支持
    SAN 安全。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_57_0.png)


    图 4-6 存储区域网络 (SAN)


    广泛的连接能力使 ESS 在规划 SAN 解决方案时成为无可争议的选择。有关 ESS 结构支持的完整列表，请参阅：


    http://www.storage.ibm.com/disk/ess/supserver.htm


    有关 IBM TotalStorage SAN 产品描述，请参阅：


    http://www.storage.ibm.com/ibmsan/products/sanfabric.html


    ### 4.3.3 ESS 专家


    TotalStorage Enterprise Storage Server 包括 ESS Specialist，这是一个基于 Web 的界面，位于 ESS
    内部，允许存储管理员从 ESS 主控制台或从远程工作站使用 Web 浏览器监控和管理存储。ESS Specialist 界面是一组 Java 小程序，这些程序由浏览器动态加载，并在浏览器内执行。当您请求对
    ESS 配置进行更改时，Java 小程序会与 ESS 集群上运行的微代码通信以检索当前配置数据，提交请求的配置更改并显示请求的结果。有关详细信息，请参阅 IBM
    TotalStorage Enterprise Storage Server Web Interface User''s Guide SC26-7448。


    当您打开 Web 浏览器并登录到您的 ESS Specialist 时，您会看到欢迎屏幕，如图 4-7 所示。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_58_0.png)


    图 4-7 ESS 欢迎屏幕


    注意左侧的两个按钮：


    - **ESS Specialist** 按钮显示 ESS Specialist 主屏幕，您可以在此设置和查看 ESS 中的存储分割（我们将在第 5 章“用于
    Linux 的 zSeries FCP”第 47 页中使用此功能）。

    - **Copy Services** 按钮通向 ESS Copy Services 主屏幕，您可以在此调用和管理 ESS 上可用的各种 Copy Services
    功能（我们将在第 6 章“ESS Copy Services 和 Linux”第 61 页中使用此功能）。


    ## 用于 Linux 的 zSeries FCP


    本章详细介绍将 ESS 连接到运行 Linux 的 zSeries 服务器的 Fibre Channel Protocol（FCP）支持。


    请注意，仍然可以使用传统的 ESCON 和 FICON 通道将 Enterprise Storage Server 连接到 Linux on zSeries。这实际上是
    Linux for zSeries 于 2000 年初推出时唯一支持的方法。Enterprise Storage Server 可以配置为 CKD 磁盘，并且通常所有当前型号的
    Enterprise Storage Server 都与所有当前型号的 zSeries 以及所有当前级别的 z/VM 和 Linux for zSeries
    互操作，使用 ESCON 或 FICON 通道。有关具体细节，请参阅位于以下位置的 ESS Interoperability Matrix and Host
    Systems Attachment Guide，SC267446：


    http://www.storage.ibm.com/disk/ess/supserver.htm

