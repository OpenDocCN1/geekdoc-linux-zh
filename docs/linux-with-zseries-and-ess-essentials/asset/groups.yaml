  - '[PAGE 68]


    # Define the Linux on zSeries host to the ESS


    Unlike hosts accessing CKD disks in an ESS, hosts which access FB formatted disks
    must be defined to the ESS. In order to define our Linux on zSeries host, we clicked
    the Modify Host Systems button of the Open System Storage panel showing the panel
    shown in Figure 5-8. The fields which have to be completed here are:


    +   - Nickname - Unique identifier up to 29 characters long

    - Host type - We chose Linux (zSeries) for any Linux on zSeries instance (either
    LPAR or running under z/VM)

    - Host Attachment - Since we are configuring storage in FB format, the only option
    that will be available for Linux hosts is Fibre Channel attached, which is what
    we chose.

    - Hostname/IP Address

    - World-Wide Port-Name - The WWPN of the FCP port on your zSeries

    - Fibre-channel ports - Select the FC port(s) on the ESS which the Linux on zSeries
    host should use to access the ESS.


    After you have filled in the complete information click Add, and then Perform
    Configuration Update. You will be returned to the Open Systems Storage panel.


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_68_0.png)


    Figure 5-8 Modify Host Systems panel - add the Linux on zSeries host


    # Configure the ESS host adapters


    The Fibre Channel adapters on an ESS have a single port. Each FC port (or adapter)
    that the Linux on zSeries host will use to access the ESS needs to be configured.
    To do this select the Configure Host Adapter Ports button on the Open System Storage
    panel, and then click the icon for the Fibre Channel adapter to be configured.
    Figure 5-9 shows an example of the fields that are enabled once this has been
    done. Check that the value for Fibre Channel Topology is Point to Point (Switched
    Fabric), as this is the only environment supported for a Linux on zSeries environment.
    Repeat this for each of the Fibre Channel adapters that the Linux host will use
    to access the ESS, and then click Perform Configuration Update. You will be returned
    to the Open Systems Storage panel.'
  - '[PAGE 69]


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_69_0.png)


    Figure 5-9 Configure Host Adapter ports panel


    # Configure RAID arrays


    Before any logical volumes can be defined and assigned to our Linux host, some
    of the available disk space on the ESS has to be formatted with track format of
    fixed-block, and a storage type of either RAID5 or RAID10 selected.


    Selecting button Configure Disk Groups on the Open System Storage panel takes
    us to the Fixed Block Storage panel, shown in Figure 5-10.


    From the Available Storage table, select a disk group and select a Storage Type
    of either RAID-5 or RAID-10. You will see entries appear in the Modification column
    in the table. Repeat this step as required, and then click Perform Configuration
    Update to apply the changes.


    You will be returned to the Open Systems Storage panel.'
  - '[PAGE 70]


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_70_0.png)


    Figure 5-10 Fixed Block Storage panel


    # Allocate storage for Linux


    In order to create fixed-block formatted volumes (LUNs) for use by the Linux on
    zSeries host, we clicked Add Volumes on the Open Systems Storage panel.


    This leads to the panel shown in Figure 5-11.


    From this panel we selected the Linux host and the FC port to use, which highlights
    the connection between them. Then click Next. A second screen appears (Figure
    5-12) where you can choose from the available arrays and add volumes of different
    sizes.


    To add a volume, select the array and the desired size of the volume and the number
    of such volumes, and then click Add. Click Perform Configuration Update and the
    volume will be created.


    Note that a message window will inform you that the actual format of the volumes
    is being performed in the background (this formatting may take some time). You
    have to wait until the formatting is complete before accessing the new volumes.'
