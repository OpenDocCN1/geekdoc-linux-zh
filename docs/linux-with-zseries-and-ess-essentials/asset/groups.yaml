    请注意，Enterprise Storage Server 通过 Fibre Channel 连接到开放系统主机已有几年历史，尽管它最近才可用于 zSeries
    主机。详情请参阅红皮书 Implementing Fibre Channel Attachment on the ESS, SG24-6113, 和 IBM
    TotalStorage Enterprise Storage Server Model 800, SG24-6424, 以及位于以下位置的白皮书 Enterprise
    Storage Server Fibre Channel Attachment：


    ### 5.2.1 硬件和软件要求


    zSeries FCP 功能所需的硬件和软件特性在 Redpaper *Getting Started with zSeries Fibre Channel
    Protocol*, REDP0205 中描述。我们在此提供概述。


    zSeries FCP 通道需要 FICON 卡（功能 2315 或 2318），或 FICON Express 卡（功能 2319 或 2320）。加载到
    FICON/FICON Express 卡中的固件类型，将其转变为 FCP 通道或 FICON 通道，由 IOCP（CHPID 语句）中该特定通道的通道类型定义控制。因此，通过在
    IOCP 中定义 FCP 类型通道，可以配置的 FICON 类型通道总数会相应减少。


    支持 FCP 所需的 Linux for zSeries 发行版是 SLES8。FCP 和 SCSI 控制器和设备可以通过适当的 I/O 驱动程序由 Linux
    for zSeries 访问。Linux 可以在逻辑分区中原生运行，或作为 z/VM 下的客户操作系统运行。


    > 注意：需要 z/VM Version 4, Release 3 来支持 Linux 客户机的 FCP。然而，z/VM 本身不支持 FCP 设备，它仅在将
    FCP 传递给客户系统方面支持 FCP。


    Linux on zSeries 无法从 FCP 连接的磁盘启动（或 Initial Program Load (IPL)）。因此，需要一定量的 CKD 磁盘来保存
    Linux on zSeries 的操作系统。


    ### 5.2.2 实现概述


    如前所述，红皮书 *Implementing Linux with IBM Disk Storage*, SG24-6261-01 描述了在 zSeries
    上（既作为 z/VM 客户机，也在 LPAR 中原生运行）实现 SuSE Linux（SLES8）以及将 ESS Model 800 通过 FCP 连接到这些系统的实现。我们将简要概述该实现中涉及的
    ESS Specialist 活动；有关具体硬件/软件使用、执行 SuSE 安装的步骤、Linux 主机设置任务等进一步详细信息，请参阅红皮书。该实现中的
    ESS Specialist 活动涉及使用 ESS Specialist 定义 Linux on zSeries 主机、配置 ESS 主机适配器、配置 RAID
    阵列和分配存储。


    ## ESS Specialist


    我们已在 4.3.3，“ESS Specialist” 第 44 页介绍过 ESS Specialist。使用您的 Web 浏览器，您首先显示第 45 页图
    4-7 所示的欢迎屏幕，然后单击 **ESS Specialist** 按钮显示 ESS Specialist 主屏幕。从那里单击 **Storage Allocation**
    按钮即可设置和查看 ESS 中的存储分割，如图 5-6 所示。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_67_0.png)


    Figure 5-6 存储分配面板


    由于我们将 Fibre Channel 磁盘（固定块 FB 格式）连接到 Linux on zSeries，因此我们这次选择了 Open Systems Storage
    按钮，然后显示图 5-7 所示的面板。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_67_1.png)


    Figure 5-7 开放系统存储面板


    然后我们通过单击 Open Systems Storage 面板底部的相应按钮执行下面描述的配置操作。


    ## 将 Linux on zSeries 主机定义到 ESS


    与访问 ESS 中 CKD 磁盘的主机不同，访问 FB 格式磁盘的主机必须定义到 ESS。为了定义我们的 Linux on zSeries 主机，我们单击了
    Open System Storage 面板的 Modify Host Systems 按钮，显示图 5-8 所示的面板。这里需要完成的字段有：


    - Nickname - 最长 29 个字符的唯一标识符

    - Host type - 我们为任何 Linux on zSeries 实例（无论是 LPAR 还是在 z/VM 下运行）选择了 Linux (zSeries)

    - Host Attachment - 由于我们以 FB 格式配置存储，Linux 主机可用的唯一选项是 Fibre Channel 连接，这就是我们选择的内容。

    - Hostname/IP Address

    - World-Wide Port-Name - 您 zSeries 上 FCP 端口的 WWPN

    - Fibre-channel ports - 选择 Linux on zSeries 主机应用于访问 ESS 的 ESS 上的 FC 端口（或端口）。


    填写完整信息后单击 Add，然后单击 Perform Configuration Update。您将被返回到 Open Systems Storage 面板。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_68_0.png)


    Figure 5-8 修改主机系统面板 - 添加 Linux on zSeries 主机


    ## 配置 ESS 主机适配器


    ESS 上的 Fibre Channel 适配器具有单个端口。Linux on zSeries 主机将用于访问 ESS 的每个 FC 端口（或适配器）都需要进行配置。为此，请在
    Open System Storage 面板上选择 Configure Host Adapter Ports 按钮，然后单击要配置的 Fibre Channel
    适配器的图标。图 5-9 显示了完成此操作后启用的字段示例。请检查 Fibre Channel Topology 的值为 Point to Point (Switched
    Fabric)，因为这是 Linux on zSeries 环境唯一支持的环境。对 Linux 主机将用于访问 ESS 的每个 Fibre Channel
    适配器重复此操作，然后单击 Perform Configuration Update。您将被返回到 Open Systems Storage 面板。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_69_0.png)


    Figure 5-9 配置主机适配器端口面板


    ## 配置 RAID 阵列


    在定义和分配给我们的 Linux 主机的任何逻辑卷之前，必须使用固定块的磁道格式格式化 ESS 上的部分可用磁盘空间，并选择 RAID5 或 RAID10
    的存储类型。


    在 Open System Storage 面板上选择按钮 Configure Disk Groups 将带我们进入图 5-10 所示的 Fixed Block
    Storage 面板。


    从 Available Storage 表中，选择一个磁盘组并选择 RAID-5 或 RAID-10 的存储类型。您将在表中看到条目出现在 Modification
    列中。根据需要重复此步骤，然后单击 Perform Configuration Update 以应用更改。


    您将被返回到 Open Systems Storage 面板。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_70_0.png)


    Figure 5-10 固定块存储面板


    ## 为 Linux 分配存储


    为了创建供 Linux on zSeries 主机使用的固定块格式卷（LUNs），我们单击了 Open Systems Storage 面板上的 Add Volumes。


    这将导致显示图 5-11 所示的面板。


    从此面板我们选择了要使用的 Linux 主机和 FC 端口，从而突出显示它们之间的连接。然后单击 Next。会出现第二个屏幕（图 5-12），您可以在其中从可用阵列中选择并添加不同大小的卷。


    要添加卷，请选择阵列、卷的所需大小以及此类卷的数量，然后单击 Add。单击 Perform Configuration Update，卷将被创建。


    请注意，消息窗口会通知您卷的实际格式化正在后台执行（此格式化可能需要一些时间）。您必须等待格式化完成后再访问新卷。

