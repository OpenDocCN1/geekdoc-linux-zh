    reads to this track on the target volume will be satisfied from the target volume,
    and subsequent updates to this track on the source volume are ignored by FlashCopy,
    thus preserving the T0 copy. Before updating a not-yet-copied track on the target
    volume, the ESS will perform an on-demand copy of this track to the target volume.
