    # 2.4.1 zSeries services


    The IBM Managed Hosting for Linux on the zSeries service is intended to provide
    cost-effective managed server capacity on demand. If you are new to e-business
    on demand™, you can find out more information on the Web at:

    http://www.ibm.com/services/ondemand/thinking.html


    With IBM Managed Hosting - Linux virtual services, the customer can tap into managed
    server capacity without the up-front expense of buying the physical hardware.
    Instead of the physical Web, database, and application servers that businesses
    currently rely on, virtual servers on the zSeries running Linux can be leveraged.
    This means that availability and reliability gain a boost while IT infrastructure
    is greatly simplified.


    If you are interested in finding out more about this service, refer to:

    http://www.ibm.com/services/e-business/hosting/mgdhosting/linux.html


    Table 2-11 lists various resources for platform-based information about services
    that are available for the zSeries server.


