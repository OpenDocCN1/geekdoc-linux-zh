    图 3-6 机箱中的服务器群


    一些关键应用通常以三层模式部署；数据库层、应用层和表示层。在混合 z/OS 和 Linux for zSeries 环境中，数据库服务器驻留在 z/OS 映像上，而应用服务器则运行在
    Linux for zSeries 实例上。两者位于同一硬件上，使客户能够在仍满足解决方案所需的性能要求的同时，移除一层硬件和维护工作。此外，由于应用和数据库现在托管在同一系统上，它们之间的真实网络可以被
    zSeries 的网络功能（如 Hipersockets）所取代。


    当服务器已整合到 zSeries 服务器上时，特别是作为 z/VM 客户机运行时，服务器群的水平扩展可以通过简单地添加另一个 Linux 虚拟机来实现，最短时间（通常为几分钟），且无需额外的硬件或场地。这在图
    3-7 中显示。此外，您仍然能够保持分布式环境范式“一个服务器一个应用”。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_43_1.png)


    图 3-7 服务器群的水平增长


