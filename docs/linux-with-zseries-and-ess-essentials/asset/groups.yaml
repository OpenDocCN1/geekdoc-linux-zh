    ![](img/da33d6b6aa12b73deb3c350a0a89d424_67_0.png)


    Figure 5-6 Storage Allocation panel


    Since we are attaching Fibre Channel disk (fixed-block FB format) to Linux on
    zSeries, we chose the Open Systems Storage button this time, and the panel shown
    in Figure 5-7 now appears.


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_67_1.png)


