    ## 前言

    IBM® 在 Linux 变得流行之前很久就已致力于 Linux。这种对 Linux 潜力的早期采用解释了为什么今天 IBM 为在 Linux 上部署解决方案提供最广泛的平台和产品，以及支持和服务。


    IBM TotalStorage® 产品以其高质量和可靠性而闻名，与 Linux 配合良好。作为一个设计良好的基于 Linux 的电子商务基础设施的一部分，它们可以帮助您降低成本、整合基础设施，并使您为新的按需世界做好准备。


    本 IBM 红皮书介绍了 Linux 与 IBM @server 和 TotalStorage 产品结合的高层信息，证明这些产品可以一起部署以提供企业级解决方案。特别是本书研究了
    Linux 与 zSeries® 服务器以及 IBM TotalStorage Enterprise Storage Server® (ESS) 磁盘产品。书中描述了在将
    ESS 连接到运行 Linux 的 zSeries 主机时现在可用的 Fibre Channel Protocol (FCP) 支持。最后一章描述了在 zSeries
    上为 Linux 提供的 ESS 复制服务。


    本红皮书旨在作为 IBM 代表以及正在规划使用 IBM zServers 和 ESS 存储产品的基于 Linux 解决方案的业务合作伙伴或客户的起点和参考。


    本书中包含的大部分信息是从《Linux Handbook》SG24-7000 和《Implementing Linux with IBM Disk Storage》SG24-6262-01
    中汇编的材料。我们鼓励读者参考这些红皮书以获取更完整的信息或实施细节。


    ### 编写本红皮书的团队

    本红皮书由在国际技术支持组织圣何塞中心工作的来自世界各地的专家团队制作。


    **Bertrand Dufrasne** 是国际技术支持组织圣何塞中心的认证咨询 I/T 专家和磁盘存储系统项目负责人。他在 IBM 工作了 21 年，涉及多个
    IT 领域。在加入 ITSO 之前，他在美国 IBM 全球服务担任 IT 架构师。他拥有电气工程学位。


    **Don Skilton** 是 IBM 全球服务澳大利亚的存储系统专家。他拥有数学学位，并于 1985 年加入 IBM 澳大利亚。他在过去 15 年里一直从事大型机存储软件和硬件工作。近年来专业领域包括
    Tivoli® Storage Manager（尤其是针对 zSeries 上的 Linux 客户端）、存储管理流程工程、第三方磁带管理系统转换为 IBM
    的 DFRMM 以及数据中心搬迁。


    **Jonathan Wright** 是新西兰的技术专家。他在英特尔服务器和存储领域拥有 10 年经验。他的专业领域包括 xSeries® 硬件、Linux、集群和
    FAST Storage。


    感谢以下人员对本项目做出的贡献：


    Cristina Zabeu

    IBM Linux 和存储解决方案市场负责人

