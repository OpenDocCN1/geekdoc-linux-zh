    ## 3.4 Linux 应用解决方案


    zSeries 的 Linux 发行版包含诸如 Apache、Samba、IMAP、OpenLDAP、Perl、Sendmail MTA、Squid 和 PostgreSQL
    等知名开源应用。Linux 应用来源于多个领域。开源应用可从互联网下载。应用也可以为 zSeries 开发。Linux for zSeries 发行版提供编译器。


    解决方案提供商已为 zSeries 服务器上的 Linux 宣布产品。这些包括基础设施应用、业务线应用和 Web 启用应用。已有超过 200 个来自超过 120
    家厂商的应用可用于 Linux on zSeries。详细产品列表请参见：


    http://www.ibm.com/servers/eserver/zseries/solutions/s390da/linuxproduct.html


    ## 使用 Samba 的典型文件/打印服务场景


    我们概述了将分布式文件/打印服务器整合到 zSeries 上的典型情况。其他场景在 Linux Handbook，SG24-7000 中讨论。


    本场景描述了使用 Samba 文件打印应用提供文件/打印服务的情况。Samba 是高质量的开源代码，已集成到大多数 Linux 发行版中。文件/打印服务对处理器计算资源的需求不大。然而，它会考验解决方案的
    I/O 能力，因为用户上传/下载文件或将其路由到打印机。服务器花费大量时间等待用户请求打印或文件服务。


    分布式解决方案由 150 台 Intel 双路 1000 MHz 服务器组成，如图 3-8 所示。请注意，服务器连接到需要硬件的物理网络。还请注意，每台服务器都运行单独的操作系统和应用代码副本——在这种情况下，这
    150 台服务器各自重复。每台服务器都需要磁盘空间，如果服务器需要额外的磁盘存储，替代方案是购买额外的整个磁盘卷并安装，或购买更高容量的磁盘，将所需的软件和数据移动到其上并安装。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_45_0.png)


    图 3-8 Samba 文件/打印场景 - 分布式解决方案


    必须对每台服务器单独进行维护。需要某种类型的操作员自动化来监控 150 个独立系统，并在必要时响应回复。备份由专用备份服务器完成，该服务器与每个系统上的客户端代码通信。


    本场景的 zSeries 解决方案如图 3-9 所示。请注意，服务器间通信在机器内部进行，这使得 Linux 实例能够以内存速度通信，而非物理网络速度及其通常的延迟。此外，除了改善服务器间通信外，还避免了大部分外部网络硬件和软件的成本。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_46_0.png)


    图 3-9 Samba 文件/打印场景 - zSeries 解决方案


    操作系统和应用代码的磁盘存储由全部 150 个虚拟服务器共享，而在分布式情况下必须重复。共享代码提供了控制磁盘存储成本和易于维护的优势。由于代码只有一个副本，只需在一个地方进行维护，从而节省了系统管理软件和操作的成本。


    z/VM 可以帮助您在服务器之间共享可用磁盘空间。在分布式模型中，增加磁盘空间意味着您需要购买新磁盘。如果某些服务器上有空闲磁盘空间，则无法将其移动到需要增加磁盘存储的服务器。在
    zSeries 解决方案中，z/VM 允许您将磁盘划分为可轻松分配给需要额外磁盘空间的服务器的微型磁盘。


    与分布式情况一样，运行中的 150 台服务器会发出必须被监控的消息，并在某些情况下做出响应。z/VM 中的 PROP 功能正是为此目的而设计的，避免了执行该任务所需的额外软件成本。备份由
    Tivoli Storage Manager (TSM) 执行。TSM 服务器安装在 z/VM 上（如图所示），或安装在 Linux 虚拟实例中（随 TSM
    版本 5.2 提供）。TSM 客户端安装在每个 Linux 客户机上。


