    http://www-1.ibm.com/servers/eserver/zseries/connectivity/fcp.html


    企业存储服务器已成功使用 FCP 连接到 zSeries 上的 Linux，并在第 5.2 节“使用 FCP 将 ESS 连接到 zSeries 上的 Linux”第
    52 页中进行了讨论。本节简要概述了传统的 zSeries I/O 架构与 zSeries Fibre Channel 之间的区别。此概述基于红皮书《使用
    IBM 磁盘存储实现 Linux》，SG24-6261-01。更多详细信息可在前述红皮书中找到，也可在红皮书《开始使用 zSeries Fibre Channel
    协议》，REDP0205，以及红皮书《IBM eServer zSeries 连接手册》，SG24-5444 中找到。


    ### 5.1.1 zSeries 特定存储连接


    z/Architecture™ 的 I/O 组件基于通道、控制单元和设备。通道在服务器与所附控制单元之间提供明确定义的接口。最初在并行铜介质上实现，今天的通道如
    ESCON 和 FICON 使用光纤串行电缆。此外，并行通道是多点下挂接口，而 ESCON 和 FICON 都是如图 5-1 所示的交换式点对点连接。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_61_0.png)


    图 5-1 典型的 zSeries 存储连接概念


    ESCON 通道使用独特的物理接口和传输协议。另一方面，FICON 基于行业标准的 Fibre Channel 低层协议。在这两种情况下，软件使用的高层 I/O
    协议都基于由通道指令字（CCW）组成的通道程序，并且是遵循 z/Architecture 或其前身（如 ESA/390 架构）的大型机的特有协议。对于磁盘存储的访问，使用由
    CKD 协议定义的一组特定的 CCW。该协议不仅描述了通过通道交换的命令和响应，还描述了数据在磁盘存储介质上记录的格式。对于磁带，存在类似的基于 CCW 的命令协议，但对于
    DVD 或扫描仪等介质没有关联的访问协议，因为必要的软件驱动程序和控制单元从未提供。


    ### zSeries 与存储设备寻址


    在 z/Architecture 中，软件使用设备号寻址存储设备，该设备号唯一标识设备。设备号由 IOCDS 设置，是一个任意的 16 位数字，以四个十六进制数字表示。它非正式地称为地址。设备号由
    IOCDS 映射到设备的一个或多个物理路径。此物理路径通常由以下硬件地址四元组描述：


    - 通道路径标识符（CHPID）：标识提供到设备的路径的通道

    - 物理链路地址：标识通过交换机或控制器的路由

    - 控制单元地址：指定控制单元

    - 单元地址：标识设备


    请参阅第 51 页图 5-4 的左侧。


    通常设备有多个物理路径，例如以实现冗余。虽然这些路径使用不同的地址四元组指定，但软件仍使用单个设备号寻址设备，与为特定 I/O 选择的路径无关。


    ### 5.1.2 分布式存储连接


    传统上，分布式环境中的存储控制器通过并行 SCSI 电缆连接，这仅允许服务器与控制器之间有非常有限的距离。SCSI 标准使用基于控制块的命令和状态协议。今天，SCSI
    协议的物理层与命令/状态层之间有明确的区分。


    ### FCP 优势


    基于更高层的 SCSI 命令/状态协议，定义了一个名为 FCP 的新标准，全称为 SCSI 的 Fibre Channel 协议。FCP 在底层 Fibre
    Channel 传输协议之上使用 SCSI 命令/状态协议。由于光纤 Fibre Channel 连接在速度、距离和可靠性方面的优越性，通过 FCP 的存储连接在当今分布式世界中具有最高的增长率。


    ### FCP 存储寻址


    传统的 SCSI 设备具有简单的寻址方案。最初，设备地址，即目标地址，只是一个在 0-7 范围内的数字（在较新的 SCSI 架构中扩展到 0-15），地址
    7 通常保留给主机适配器。如图 5-2 所示，SCSI 还支持逻辑单元号（LUN）的定义，其中每个 LUN 代表目标（或控制器）的分区，例如磁盘驱动器。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_63_0.png)


    图 5-2 SCSI 寻址


    对于 FCP，开发了一种基于全球名称（WWN）的新寻址方案。每个节点和节点上的每个端口（如 FCP 端口）都被分配一个 WWN，分别称为全球节点名称（WWNN）和全球端口名称（WWPN）。此外，节点内的可寻址单元（如磁盘驱动器）被分配一个
    LUN 名称。这在图 5-3 中有所说明。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_63_1.png)


    图 5-3 全球名称


    ### 5.1.3 zSeries 特定与分布式存储控制器


    目前可用于 zSeries 的 Fibre Channel 接口存储控制器有两种类型：


    - 支持基于 CCW 架构的 z/Architecture 特定 FICON 接口的控制器，具有用于磁盘存储的 CKD 命令集以及用于磁带的类似命令集。

    - 支持基于 SCSI 的 FCP 协议的控制器，具有特定于设备类型的 SCSI 命令集，如磁盘或磁带。


    这两种类型的控制器通常基于相同的硬件构建块。它们各自的特性由处理主机接口的不同固件实现。例如，ESS 上的 Fibre Channel/FCP 主机适配器可以配置为
    FICON 或 FCP 协议。DASD 寻址或设备映射的处理方式如图 5-4 所示，该图总结了前面的讨论。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_64_0.png)


    图 5-4 DASD 寻址方案


    ### zSeries 与存储：总结


    综上所述，经典的 zSeries 操作系统如 z/OS 和 z/VM 仅设计用于支持由 z/Architecture 定义的协议的存储控制器。随着 zSeries
    上 Linux 的出现情况发生了变化，因为其存储 I/O 组件面向 SCSI 协议。由于 zSeries 服务器系统缺乏访问基于 SCSI 的存储设备的能力，因此有必要为
    zSeries 上的 Linux 添加特定支持，使其能够在基于 CCW 的 zSeries I/O 环境中运行。


    然而，zSeries 上 Linux 中的这一额外层是 zSeries 独有的，不允许其利用依赖于 SCSI 连接的存储子系统和应用程序。因此，zSeries
    系统中添加了 FCP 连接功能，允许连接基于 SCSI 的存储控制器，并使 zSeries 上的 Linux 能够以 Linux 标准方式访问这些控制器。图
    5-5 显示了两种访问方法之间格式转换的差异。通过将请求转换为 CKD 格式来访问块设备层中的块设备所产生的开销已被消除。

    '
