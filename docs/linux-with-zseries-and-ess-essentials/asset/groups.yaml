    # 4.3 Enterprise Storage Server


    This section introduces the Enterprise Storage Server and discusses the benefits
    it provides. The features discussed here are not specific to Linux, but remain
    for the most part available in a Linux environment as well.


    For more detailed information, please refer to the redbook *IBM TotalStorage Enterprise
    Storage Server Model 800*, SG24-6424.


    # 4.3.1 ESS overview


    Figure 4-1 summarizes the ESS architecture and features.


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_51_0.png)


    Figure 4-1 IBM''s Seascape® architecture - ESS Model 800


    The ESS is IBM''s most powerful disk storage server, developed using IBM Seascape
    architecture. The ESS provides un-matchable functions for all the IBM @server
    family, and also for the non-IBM (that is, Intel-based and UNIX-based) families
    of servers. Across all of these environments, the ESS features unique capabilities
    that allow it to meet the most demanding requirements of performance, capacity,
    and data availability that the computing business may require.


    The Seascape architecture is the key to the development of IBM''s storage products.
    Seascape allows IBM to integrate the best of breed technologies, both from IBM
    and from the general industry, producing flexible and upgradeable storage solutions.
    This Seascape architecture design has allowed the ESS to evolve from the initial
    E models to the succeeding F models, and to the more recent 800 models, each featuring
    new, more powerful hardware and functional enhancements. Server is part of the
    ESS product name because one of the'
  - '[PAGE 52]


    most significant facets of the Seascape architecture strategy is the use of server
    technology within the storage system. The integration of actual server computers
    (SMPs) into the ESS helps reduce the need for expensive custom components, and
    also increases reliability through the use of proven server and operating system
    technologies.


    The diagram in Figure 4-2 depicts an ESS Model 800, and all of its major components.
    At the top of the frame are the disk drives modules (DDMs), and immediately under
    them are the processor drawers that hold the cluster symmetrical multiprocessors
    (SMPs). Just below the processor drawers are the I/O drawers that hold the SSA
    device adapters that connect the SSA loops. Just below the I/O drawers are the
    host adapter bays that hold the host adapters. At the bottom of the frame are
    the AC power supplies and batteries.


    Between the two cages of DDMs is an operator panel that includes an emergency
    power switch, local power switch, power indicator lights, and message/error indicator
    lights.


    For larger configurations, the ESS base enclosure attaches to an Expansion Enclosure
    rack that is the same size as the base ESS, and stands next to the ESS base frame.


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_52_0.png)


    Figure 4-2 ESS Model 800 major components


    # 4.3.2 ESS features and benefits


    The ESS set a new standard for storage servers back in 1999 when it was first
    available, and since then it has evolved into the third-generation ESS Model 800.
    The IBM TotalStorage Enterprise Storage Server Model 800 introduces important
    changes that dramatically improve the overall value of the ESS and provide a strong
    base for strategic Storage Area Network (SAN) initiatives.'
  - '[PAGE 53]


    # Storage consolidation


    The ESS attachment versatility and large capacity enable data from different platforms
    to be consolidated onto a single high performance, high availability box. Storage
    consolidation can be the first step towards server consolidation, reducing the
    number of boxes you have to manage, and allowing you to flexibly add or assign
    capacity when needed. The IBM TotalStorage Enterprise Storage Server supports
    all the major operating systems platforms, from the complete set of IBM @server
    series of e-business servers and IBM NUMA-Q®, to the non-IBM Intel-based servers,
    and the different variations of UNIX, including Linux, as shown in Figure 4-3.


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_53_0.png)


    Figure 4-3 IBM TotalStorage Enterprise Storage Server for storage consolidation


    With a total capacity of up to 55 TB, and a diversified host attachment capability,
    SCSI, ESCON®, and Fibre Channel/FICON™ (the ESS Model 800) provide outstanding
    performance while consolidating the storage demands of the heterogeneous set of
    server platforms that must be dealt with nowadays.


    # Performance


    Key features that characterize the performance enhancements of the ESS Model 800
    are:


    +   - The ESS Model 800, with the optional Turbo feature for the SMP processors,
    is capable of delivering 2.5 times the throughput of its predecessor Model F20.

    - 64 Gb cache supports much larger system configurations and increases hit ratios,
    driving down response times.

    - Double the internal bandwidth provides high sequential throughput for digital
    media, business intelligence, data warehousing, and life science application.'
