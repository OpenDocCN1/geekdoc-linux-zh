    are not mirrored onto the secondary volume. The secondary volume becomes out of
    synchronization. During this time PPRC keeps a bit map record of the changed tracks
    in the primary volume. Later, the volume pair can be re-synchronized, and then
    only the tracks that were updated will be copied. A PPRC volume pair will automatically
    go into suspended state, for instance, when the primary ESS cannot complete a
    write operation to the recovery ESS.

    - Duplex pending-XD: This state is found when a volume pair is established in
    a non-synchronous PPRC-XD relationship. This PPRC volume state is explained in
