    图 6-7 FlashCopy 点-in-time 复制


    ## FlashCopy 无后台复制模式 (NOCOPY)


    NOCOPY 选项会导致 FlashCopy 关系在未启动后台复制的情况下建立——只有被更新的源磁道才会被复制到目标。这在您只需要短时间使用副本时可能很有用，例如备份到磁带。在此关系存在期间，在源卷上更新磁道之前，ESS
    会按需将该磁道复制到目标卷，从而保留 T0 副本。同样，在更新目标卷上的磁道之前，ESS 会执行该磁道的按需复制到目标卷。在此无后台复制模式下建立的 FlashCopy
    关系将保持活动状态，直到发生以下情况之一：


    - 发出 FlashCopy withdraw 以移除该关系。

    - 所有源设备磁道都已因被更新而复制到目标设备上。

    - 所有目标设备磁道都已被用户应用程序更新。


    ## 增量 FlashCopy


    FlashCopy V2 引入了一种称为增量 FlashCopy 的新功能，可提供刷新 FlashCopy 关系的能力。通过增量 FlashCopy，源与目标之间的初始
    FlashCopy 关系得以保持。当随后发起 FlashCopy 建立时，只复制将目标更新到源新建立的点-in-time 所需的数据。增量 FlashCopy
    有助于在源或目标上只有一小部分数据发生变化时减少后台复制完成时间。图 6-8 简要概述了增量 FlashCopy 的工作原理。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_84_0.png)


    图 6-8 增量 FlashCopy


    当为大量卷建立 FlashCopy 时，第一和最后一次建立之间存在有限的时间，因此副本可能无法在一致的点-in-time 创建。FlashCopy V2 引入了一致性组功能，可用于在多个卷上创建一致的点-in-time
    副本。


    ## 6.5 ESS Copy Services Web 用户界面


    运行在 ESS 中的 ESS Copy Services 提供了一个 Web 界面，可用于调用和管理 ESS 复制功能。首先，必须将一个 ESS 定义为 ESS
    Copy Services 服务器 (CSS)，它将保存所有 ESS Copy Services 相关信息。可选地，可以定义第二个 ESS 作为备份 ESS
    Copy Services 服务器。建议在远程（恢复）站点定义 Copy Services 服务器，并在主（应用）站点定义备份 CSS。ESS 中 CSS
    的设置由 IBM 服务支持代表完成。


    要访问 Copy Services Web 用户界面 (WUI)，您首先打开 ESS 欢迎屏幕，该屏幕在 4.3.3 “ESS Specialist” 第
    44 页中已讨论过，并显示在图 6-9 中。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_85_0.png)


    图 6-9 ESS 欢迎屏幕


    然后您选择 Copy Services，这将使您的浏览器连接到指定为 Copy Services 服务器的 ESS。ESS Copy Services Web
    用户界面的主菜单将被显示（参见图 6-10）。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_85_1.png)


    图 6-10 ESS Copy Services Web 用户界面主菜单


    从 Copy Services 主菜单，您可以通过选择左侧的按钮之一来访问所有 ESS Copy Services 面板。我们将简要查看其中每一个。有关进一步详细信息，请参阅
    *IBM TotalStorage 企业存储服务器 Web 接口用户指南*，SC26-7448，以及 *使用 IBM eServer zSeries 实现
    ESS Copy Services*，SG24-5680。


    ### Volumes 面板


    Volumes 面板显示在图 6-11 中。从此面板您可以：


    - 接收 ESS 中逻辑子系统 (LSS) 中定义的卷的信息和状态

    - 为 PPRC 或 FlashCopy 任务选择源卷和目标卷

    - 将卷显示的输出过滤到所选范围

    - 根据其唯一卷 ID 搜索特定卷

    - 建立、终止和挂起 PPRC 复制对并选择性地保存任务

    - 建立和撤回 FlashCopy 对并选择性地保存任务

    - 进入 PPRC 和 FlashCopy 的多选模式


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_86_0.png)


    *图 6-11 Volumes 面板*


    ### Logical Subsystems 面板


    Logical Subsystems 面板显示在图 6-12 中。此面板显示 ESS 存储网络中的 ESS 及其逻辑子系统；存储网络包括所有配置为使用同一
    ESS Copy Services 服务器的 ESS。从 Logical Subsystems 面板您可以：


    - 查看存储网络中的所有 ESS

    - 查看存储网络中的所有逻辑子系统 (LSS)

    - 获取有关逻辑子系统及其状态的信息

    - 查看和修改逻辑子系统的复制属性

    - 过滤所选范围的输出

    - 根据其唯一地址搜索特定逻辑子系统

    - 建立、终止和挂起 PPRC 复制对，并选择性地保存任务

    - 对一致性组执行操作


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_87_0.png)


    图 6-12 逻辑子系统面板


    ### Paths 面板


    路径用于在主和次 PPRC 对之间发送数据。物理路径由两个 ESS 之间的 ESCON 连接组成，而逻辑路径描述了 PPRC 源和目标的连接。请注意，在创建
    PPRC 复制对关系之前，您必须使用 Paths 面板在源和目标 LSS 之间建立逻辑路径。Paths 面板显示在图 6-13 中。从此面板您可以：


    - 建立 PPRC 路径

    - 移除 PPRC 路径

    - 创建 PPRC 一致性组

    - 查看有关路径的信息


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_88_0.png)


    图 6-13 Paths 输入面板


    ### Tasks 面板


    通过使用 Volumes、Logical Subsystems 和 Paths 面板，您可以在任务中保存任何数据复制操作的设置。任务可以是任何类型的 FlashCopy、PPRC
    和路径操作。使用 Tasks 面板您可以运行和修改已保存的任务。您还可以将多个任务组合成一个任务组。如果需要同时建立来自不同 LSS 的多个 FlashCopy
    对以进行备份，则可能出现这种情况。然后可以通过选择任务组并运行它来运行该任务组。Tasks 面板显示在图 6-14 中。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_89_0.png)


    图 6-14 Tasks 面板


    ## 6.6 Copy Services 命令行界面


    使用 ESS Copy Services 命令行界面 (CLI)，所选开放系统服务器的用户能够从主机命令行与 ESS Copy Services 服务器通信以管理
    PPRC 和 FlashCopy。例如，您使用 Web 用户界面保存的任何任务都可以通过主机上的命令（如 rsExecute Task）调用。CLI 是一个基于
    Java 的应用程序，运行在主机服务器上。主机系统不一定需要连接到分配给 ESS 的主机适配器端口之一的存储。唯一的要求是您想要调用命令的主机通过网络连接到定义为主要
    ESS Copy Services 服务器的 ESS。有关 ESS Copy Services 命令行界面的详细信息可在 *IBM TotalStorage
    企业存储服务器命令行界面用户指南*，SC26-7494 中找到。有关哪些开放系统服务器支持 CLI 的详细信息可在以下网站的“ESS 互操作性矩阵”中找到。受支持的服务器包括
    Red Hat Linux 和 SuSE Linux。


    http://www.storage.ibm.com/disk/ess/supserver.htm


    ## 6.7 Linux on zSeries 上的 ESS Copy Services


    对于不同的操作系统环境，有几种方法可以调用和管理各种 ESS Copy Services 功能。对于 PPRC 和 FlashCopy，最常用的是 Copy
    Services Web 用户界面 (WUI) 和 Copy Services 命令行界面 (CLI)。唯一的例外是 z/OS 环境，其中 TSO 命令提供了方便的管理机制。


    表 6-1 总结了在 Linux on zSeries 上调用和管理 PPRC、PPRC-XD 和 FlashCopy 的可用设施。表中所列项目的进一步详细信息如下：


    - WUI：Web 用户界面（参见 6.5，“ESS Copy Services Web 用户界面” 第 71 页）

    - CLI：命令行界面（参见 6.6，“Copy Services 命令行界面” 第 76 页）。请注意，CLI 在连接到 ESS 的受支持开放系统服务器上运行，而不是在
    Linux for zSeries 服务器本身上运行。

    - VM ICKDSF：在 VM 环境中，一些 PPRC 功能可使用 ICKDSF 实用程序执行。有关完整详细信息请参见 *使用 IBM eServer zSeries
    实现 ESS Copy Services*，SG24-5680。

    - VM CP `flashcopy`：在 VM 环境中，FlashCopy 使用 CP 命令 `flashcopy` 支持。有关完整详细信息请参见 *使用
    IBM eServer zSeries 实现 ESS Copy Services*，SG24-5680。


    表 6-1 在 Linux for zSeries 上管理 PPRC、PPRC-XD 和 FlashCopy


    |  | Linux 在 LPAR 中运行 | Linux 在 VM 下运行 |

    |---|---|---|

    | **通过 ESCON/FICON 连接 ESS** | WUI 和 CLI<br>（仅 SuSE SLES 8） | WUI 和 CLI<br>VM ICKDSF（用于
    PPRC）<br>VM CP `flashcopy`（用于 FlashCopy） |

    | **通过 FCP 连接 ESS** | WUI 和 CLI<br>（仅 SuSE SLES 8） | 未正式支持 |


    理论上，WUI 和 CLI 可用于为任何 Linux on zSeries 系统调用和管理 ESS Copy Services 功能，而不论连接类型（ESCON/FICON
    或 FCP）如何，也不论 Linux 是作为 VM 客户机运行还是原生在 LPAR 中运行。这是因为 WUI 和 CLI 直接与 ESS 接口，而不参考主机操作系统环境。然而，IBM
    仅根据表 6-1 中的详细信息测试了这些功能（并且仅为这些功能提供官方支持）。


    请注意，如果 Linux for zSeries 卷为 CKD（通过 ESCON 或 FICON 连接），并且它们通过 HCD 定义给 z/OS 系统，则可以使用
    z/OS 系统为这些卷调用和管理复制服务功能。（有关 z/OS 管理复制服务的设施的详细信息，请参见 *使用 IBM eServer zSeries 实现
    ESS Copy Services* SG24-5680。）显然，这种方法会引入操作复杂性，特别是对于 z/OS 系统，尤其是对于需要定期执行的功能。对于这种方法，最好使用
    Linux on S/390 兼容磁盘布局 (CDL) 格式化 Linux 卷。

