    启动时，为每个主卷构建位图以记录已更新的主卷磁道。复制的第一阶段是对主卷磁道进行顺序复制，这些磁道以批量的方式发送到辅助卷。当所有磁道都已复制完成后，初始复制完成，然后
    PPRC-XD 开始定期遍历位图，查找任何已更新的磁道，并将它们以更新批量的形式发送到辅助卷。这是一种面向吞吐量、非常高效的非同步镜像方式。


    图 6-4 显示了 PPRC-XD 操作的简化序列，说明了其非同步特性。以下是操作的序列：


    - 1. 主机向主卷写入数据（写入主 ESS 缓存和 NVS）。Channel End 返回给主机。

    - 2. 主卷位图被更新以反映更新，以便稍后传输到辅助 ESS。ESS 向主机返回 Device End，因此对于应用程序而言 I/O 操作已完成

    - 3. 主 ESS 将更新镜像到辅助 ESS 卷上。更新被分组为批量以实现高效传输。

    - 4. 当更新已安全存储在辅助 ESS 缓存和 NVS 中时，辅助 ESS 向主 ESS 返回写入完成。主卷位图被更新以显示主更新已安全存储在辅助 ESS
    缓存和 NVS 中。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_79_0.png)


    图 6-4 PPRC-XD 操作


    使用 PPRC-XD，PPRC 传统卷状态（参见图 6-3）增加了一个状态。新增的状态是 duplex-pending XD 状态（参见图 6-5）。在此
    duplex-pending XD 状态下，PPRC 对主卷更新进行非同步镜像到辅助站点。PPRC-XD 将定期遍历每个卷的位图以查找已更新的磁道，并将它们放入一批中复制到辅助端。配对将保持此状态，直到发出进入同步模式（duplex
    状态）的命令，


    或发出挂起配对（suspended 状态）的命令，或发出删除 PPRC-XD 配对（simplex 状态）的命令。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_80_0.png)


    图 6-5 Duplex-pending XD 卷状态


    ## Catch-up operation (go-to-synch)


    PPRC-XD catch-up 是 PPRC-XD 配对从其正常的非同步状态转换到完全同步状态时发生的转换的名称。在此转换结束时，主卷和辅助卷完全同步。追赶转换可以通过命令
    PPRC 执行 go-to-SYNC 来完成，因此卷配对离开 duplex-pending XD 状态并达到 duplex 状态。从这一刻起，如果配对未立即挂起，主写入更新将同步传输到恢复站点。追赶转换也可以通过暂时使应用程序对主卷的写入静默，并等待
    PPRC-XD 完成同步来实现。


    当通过命令 PPRC 执行 go-to-SYNC 进行追赶操作时，如果被镜像的卷相隔很远，超过 100 公里，您可能不希望发生任何同步复制操作。为此有一个复制选项，允许您在同步建立后立即要求
    PPRC 挂起配对。图 6-6 显示了 PPRC-XD 的基本操作。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_81_0.png)


    图 6-6 PPRC-XD 基本操作


    ## Data consistency


    当卷配对处于 duplex-pending XD 状态时，应用程序对主卷的写入会非同步复制到辅助卷。这意味着辅助卷保留的是数据的模糊副本。依赖于应用程序的写入不能保证以与主卷写入相同的顺序应用于辅助卷。此外，在任何时候都会有一部分应用程序更新的数据未反映在辅助卷上；这些数据对应于自上次卷位图扫描以来已更新的磁道。追赶转换将使配对恢复同步，要么将其设置为
    duplex，要么停止对主卷的写入更新。达到 duplex 状态后，配对可以暂时挂起以对辅助卷进行快闪，然后再恢复配对之间的 PPRC-XD 关系。FlashCopy
    将是一个三级一致的点-in-time 副本。或者，如果是数据库应用程序并且归档日志正在被镜像，那么一旦配对追赶完成并被挂起，日志就可以应用于影子数据库。


    ## 6.4 FlashCopy


    如今，数据处理中心越来越多地要求应用程序每天 24 小时、每周 7 天可用，且数据备份或复制时的应用程序停机时间最少。FlashCopy 允许用户实现此类解决方案。


    FlashCopy 提供数据的即时点-in-time 副本，也称为 T0 副本。FlashCopy 使使用源副本或目标副本的应用程序几乎可以立即获得访问权限。建立
    FlashCopy 关系仅需要对应用程序进行最小程度的中断


    然后由 IBM TotalStorage Enterprise Storage Server 在后台创建副本，对其他 ESS 活动的影响最小。FlashCopy
    可与 PPRC 创建的本地或远程数据副本结合使用。


    请注意，最近已宣布 FlashCopy 的新版本（FlashCopy V2），它消除了 FlashCopy V1 的一些限制，并增加了一些新功能。以下对 FlashCopy
    的简要概述在很大程度上以 FlashCopy V1 为表述，目的在于简化，但我们将特别指出 FlashCopy V2 可用的额外 FlashCopy 功能。有关
    FlashCopy V2 的更多详细信息可在红皮书 *使用 IBM eServer zSeries 实现 ESS 复制服务，SG24-5680.* 中找到。


    FlashCopy 在逻辑卷级别（FlashCopy V2 可在卷范围甚至数据集级别调用）。它具有以下限制：


    - 源卷和目标卷必须具有相同的磁道格式。

    - 目标卷必须至少与源卷一样大。

    - 源卷和目标卷必须在同一 ESS 逻辑子系统（LSS）内。使用 FlashCopy V2，此条件放宽，因此源卷和目标卷只需在同一 ESS 内即可。

    - 源卷和目标卷一次只能参与一个 FlashCopy 关系。使用 FlashCopy V2，一个卷可以具有多个 FlashCopy 关系。


    当调用 FlashCopy 时，ESS 在目标卷和源卷之间建立 FlashCopy 关系。此关系从您启动 FlashCopy 操作时开始存在，直到 ESS
    将源卷的所有数据复制到目标卷为止。您可以选择请求 FlashCopy 不执行后台复制（**NOCOPY** 选项），在这种情况下，必须明确撤回该关系才能终止它。


    在 FlashCopy 关系的 *建立* 阶段，会为该关系创建位图。此位图由 ESS 微码用于将源卷和目标卷映射为 FlashCopy 请求时（T0 副本）的状态，以及管理对源卷和目标卷的后续读取和更新。一旦关系建立，两个卷即可供应用程序使用，并且可选的物理复制阶段开始。（请注意，无需停止应用程序即可启动
    FlashCopy。但是，您需要考虑只有物理磁盘上的数据会被复制，而应用程序缓冲区中的数据不会被复制。因此，您可能需要在建立 FlashCopy 关系时使应用程序静默。）


    ## FlashCopy background copy mode (default)


    后台复制模式会导致源卷中的所有磁道被物理复制到目标卷。后台复制任务在 ESS 上的优先级低于正常 I/O，从而确保对正常应用程序 I/O 处理的影响最小。使用位图，ESS
    跟踪已从源复制到目标的数据，并管理两个副本的完整性。如果应用程序想要读取目标上尚未复制的一些数据，则数据将从源读取；否则，读取将从目标卷满足。在更新源卷上尚未复制的磁道之前，ESS
    会按需复制该磁道到目标卷，从而保留 T0 副本。对目标卷上该磁道的后续读取将从目标卷满足，并且对源卷上该磁道的后续更新将被 FlashCopy 忽略，从而保留
    T0 副本。在更新目标卷上尚未复制的磁道之前，ESS 将执行该磁道的按需复制到目标卷。经过一段时间后，所有磁道都将被复制到目标卷，并且 FlashCopy
    关系将自动结束。图 6-7 说明了请求后台复制时 FlashCopy 的工作原理。

    '
