    IBM 全球服务将这些先进技术转化为客户的业务价值，并帮助使信息技术（IT）易于获取和管理。欲了解更多关于 IBM 全球服务的信息，请参阅：


    http://www.ibm.com/services/


    ## 2.2.2 IBM 全球服务


    IBM 帮助客户通过成本效益、选择和竞争优势优化基于 Linux 的解决方案的业务价值。IBM 拥有经验丰富的 Linux 顾问和架构师，参与全球数千个开源项目。有了这些，IBM
    可以帮助各行业客户通过其 Linux 部署增强弹性、可扩展性、稳定性和安全性。


    IBM 全球服务是 IBM 的最大部门，在 164 个国家或地区拥有超过 140,000 名员工。它被广泛认为是世界上最大的服务公司。


    ## 2.2.3 IBM 支持热线


    IBM 通过互联网为 Linux 提供“企业级”支持，并提供 24 小时全天、7 天全周的语音支持。此支持范围从回答使用问题到识别问题，全部围绕客户需求展开。


    最近的分析师研究表明，在与 Linux 实施相关的最重要的关注点中，支持是解决方案和供应商选择的重要考虑因素。IBM 将世界级 Linux 支持作为标准产品提供，包含多个选项，包括根据客户当前
    IT 员工的技能和经验定制支持的能力。


