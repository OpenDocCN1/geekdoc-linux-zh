    ## IBM 与 Linux


    本章讨论了 IBM 对 Linux 和开源社区的承诺，并回顾了可用的 IBM 服务，这些服务帮助 Linux 客户最大程度地利用由 Linux 驱动的 IBM
    eServer 解决方案的优势。它展示了 Linux 今日所获得的巨大认可和承诺。


    这里介绍的资源为更详细的信息提供了良好的、集中的起点。我们建议您阅读并了解这些资源，以帮助您跟上 Linux 的承诺和不断快速增长的新服务。


    本章中的信息在本书撰写时是正确的。然而，部分信息可能会因各产品生命周期中的正常变化而改变。这对 Linux 以外的产品同样适用。这意味着 IBM 可能不支持某一特定产品，即使它在本章中似乎是受支持的。因此，我们鼓励您在查阅本章信息时，同时调查诸如服务终止日期、产品撤回以及其他支持限制等主题。


    **重要：** 这里介绍的服务仅面向 IBM 客户，且可能在某些特定国家或地区不可用。请联系您当地的 IBM 全球服务（IGS）代表了解详情。


    ### 2.1 IBM 对 Linux 的承诺


    IBM 参与 Linux 的历史之庞大，已超出本工作的范围。IBM 不是 Linux 的分销商。IBM 是 Linux 的贡献者、运行 Linux 的服务器供应商，以及为选择使用
    Linux 的客户提供支持的提供商。IBM 对 Linux 的承诺可通过过去几年中的众多显著亮点得到最好地说明：


    - 早在 1999 年 3 月，IBM 就宣布了关键的联盟、产品和对 Linux 的全球支持，其中包括诸如 SuSE Holding AG 等分销商（其后与分销商
    Conectiva S.A. 一起共同创立了 United Linux），以及 Red Hat Software Inc。IBM ThinkPad 600
    成为 Red Hat 列出的首款受支持硬件笔记本电脑。

    - Linux 于 2000 年 5 月在 S/390® 服务器上正式亮相，其后不久由一家主要 ISP 进行了服务器整合的商业部署。6 月，SuSE 宣布了面向
    RS6000 的 Enterprise Linux。

    - 2001 年，IBM 在 LinuxWorld 上凭借运行 Linux 的 zSeries 和 iSeries 系统赢得最高荣誉，完成了 Linux 在整个
    eServer™ 产品线中的可用性。补充这一点的还有对 Linux 服务器的广泛存储选项的宣布，包括企业存储服务器（ESS）和光纤阵列存储系统（FAStT）外部存储阵列。IBM
    的 Linux 超级计算机系统已部署于研究领域以及石油和天然气勘探，并推出了面向电子商务的预包装 Linux 集群。

    - 2002 年，持续强调中小企业、服务器整合、零售、网络基础设施、广告、电信和生命科学的稳健计算，加强了 IBM 在所有市场细分中作为最致力于 Linux
    的参与者的地位。截至 2002 年 12 月，IBM 已推出 eServer p630，这是首款专为 Linux 支持而设计 的 pSeries 系统。内部而言，IBM
    开始将其自身关键业务服务迁移到 Linux，展示了对 Linux 电子商务解决方案的无可争议的承诺和已证实的扩展性。

    - 2003 年，IBM 定期宣布新的 Linux 硬件、将更多现有软件移植到 Linux，以及新的 Linux 服务和支持选项。


    ### IBM 支持 Linux 的行业领导力


    IBM 在 Linux 社区投入超过 10 亿美元。IBM 拥有 Linux 技术中心、IBM 研究院和开源开发实验室，以及 IBM 全球服务咨询与支持，它们都为
    Linux 和开源社区做出贡献。


    IBM 全产品线的 Linux 支持正在增长，并支持 TotalStorage 磁盘和磁带。IBM 还支持诸如 DB2®、Websphere、Lotus®
    Domino™、MQSeries®、Tivoli Storage Manager 等中间件解决方案，并继续与众多领先的 Linux 分销商密切合作。


    ### 全球 IBM Linux 承诺


    在欧洲和亚太市场各投入 2 亿美元的 Linux 计划，包括创建 Linux 解决方案移植中心。这些中心遍布世界各地，包括法国的巴黎和蒙彼利埃；英国的格里诺克和赫斯利；德国的博布林根；波兰的华沙；匈牙利的布达佩斯；亚太地区的东京、上海、北京、台北、首尔和班加罗尔；以及美国的加州圣马特奥、芝加哥和马萨诸塞州沃尔瑟姆。


    这些中心允许客户和关键 ISV 将其应用程序迁移到 Linux。IBM 支持在所有 IBM 服务器上的应用程序开发。


    ### 2.1.1 IBM Linux 技术中心


    IBM Linux 技术中心（LTC）的使命是与 Linux 开发社区直接合作，怀着让 Linux 成功的共同愿景，拥有业界最全面的 Linux 开发团队之一。他们是开源
    Linux 社区的经过验证、被接受的一部分，成功地将企业功能引入 Linux。通过这样做，他们为社区提供 Linux 技术专业知识。


    LTC 拥有 250 多人的团队，其中一小部分社区分布在世界各地的多个中心。这些中心位于阿德莱德、奥斯汀、班加罗尔、比弗顿、北京、贝塞斯达、博布林根、波士顿、博尔德、剑桥、堪培拉、芝加哥、恩迪科特、霍桑、赫斯利、柯克兰、芒特劳雷尔、纽约市、波特兰、波基普西、罗利、罗切斯特、旧金山、索默斯、厄巴纳-香槟、山本和约克敦。


    Linux 技术中心可在网页上找到：

    http://www.ibm.com/linux/ltc


    ### IBM 将 JFS 贡献给 Linux 存储


    IBM 的日志文件系统（JFS）技术目前用于 IBM 企业服务器，专为高吞吐量服务器环境设计，是运行内联网和其他高性能电子商务文件服务器的关键。IBM 将该技术贡献给
    Linux 开源社区，希望其全部或部分能够有助于将最佳的日志功能带入 Linux 操作系统。


    JFS 是一种基于日志的字节级文件系统，专为面向事务的高性能、高吞吐量服务器环境而开发，是运行内联网和其他高性能电子商务文件服务器的关键。JFS 是一种可扩展且稳健的文件系统，并在系统崩溃时提供快速的文件系统重启。


    JFS 目前已随许多 Linux 发行版一起发布，包括 Red Hat 和 SuSE Linux。


    有关 Linux 版 JFS 的更多信息可在以下网址找到：

    http://www-124.ibm.com/jfs/


    ### EVMS


    LTC 还在以企业卷管理系统的形式开展卷管理技术工作，其成果旨在为内核提供更多卷管理能力和互操作性。


    有关 EVMS 的信息，请参考：

    http://evms.sourceforge.net/


    ### 2.2 Linux 服务和应用解决方案


    尽管普遍认为 Linux 可用的企业级应用程序数量有限，但 IBM 全球解决方案目录中介绍的 Linux 应用程序已增长至超过 2,900 个。IBM 在全球拥有十个移植中心，并持续增强该产品组合。


    有关 Linux 应用解决方案的更深入信息，请参考《Linux Handbook - A Guide to IBM Linux Solutions and
    Resources》，SG24-7000-00。

