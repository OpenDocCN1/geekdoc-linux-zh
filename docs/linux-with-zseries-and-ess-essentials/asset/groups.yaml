    Server Model 800, SG24-6424, and the whitepaper Enterprise Storage Server Fibre
    Channel Attachment located at:'
  - '[PAGE 66]


    # 5.2.1 Hardware and software requirements


    The hardware and software features required for zSeries FCP function for Linux
    are described in the Redpaper *Getting Started with zSeries Fibre Channel Protocol*,
    REDP0205. We provide an overview here.


    zSeries FCP channels require a FICON card (feature 2315 or 2318), or a FICON Express
    card (feature 2319 or 2320). The type of firmware to be loaded into the FICON/FICON
    Express card, turning it into either an FCP channel or a FICON channel, is controlled
    by the definition of the channel type for that particular channel in the IOCP
    (the CHPID statement). Thus, by defining FCP type channels in the IOCP, the total
    number of FICON type channels that can be configured is reduced accordingly.


    The Linux for zSeries distribution required for FCP support is SLES8. FCP and
    SCSI controllers and devices can be accessed by Linux for zSeries with the appropriate
    I/O driver. Linux may run either natively in a logical partition, or as a guest
    operating system under z/VM.


    > Note: The z/VM Version 4, Release 3 is required to support FCP for Linux guests.
    However, z/VM itself does not support FCP devices, it supports FCP to the extent
    of passing it through to guest systems.


    Linux on zSeries cannot boot (or Initial Program Load (IPL)) from FCP attached
    disk. Hence, a certain amount of CKD disk is required for Linux on zSeries to
    hold the operating system.


    # 5.2.2 An implementation overview


    As mentioned earlier, the redbook *Implementing Linux with IBM Disk Storage*,
    SG24-6261-01, describes an implementation of SuSE Linux (SLES8) on zSeries (both
    as a z/VM guest and also running natively in an LPAR), and the FCP attachment
    of an ESS Model 800 to these systems. We will briefly overview the ESS Specialist
    activities involved in that implementation; for further details, such as the specific
    hardware/software used, the steps to perform the installation of SuSE, the Linux
    host setup tasks, and so on, refer to the redbook. The ESS Specialist activities
    in this implementation involved defining a Linux on zSeries host, configuring
    ESS host adapters, configuring RAID arrays, and allocating storage, all using
    the ESS Specialist.


    # ESS Specialist


    We have introduced the ESS Specialist in 4.3.3, “ESS Specialist” on page 44. Using
    your Web browser you first display the welcome screen shown in Figure 4-7 on page
    45 and then click the **ESS Specialist** button to display the ESS Specialist
    main screen. From there clicking the **Storage Allocation** button enables you
    to set up and view the storage segmentation in your ESS, as shown in Figure 5-6.'
