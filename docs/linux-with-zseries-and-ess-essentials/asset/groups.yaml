    # 4.3.3 ESS Specialist


    The TotalStorage Enterprise Storage Server includes the ESS Specialist, which
    is a Web-based interface located internally within the ESS that allows the storage
    administrator to monitor and manage storage from the ESS Master Console or from
    a remote workstation using a Web browser. The ESS Specialist interface is a set
    of Java applets, which are programs that are dynamically loaded by the browser,
    and which execute within your browser. When you request a change to the ESS configuration,
    the Java applets communicate with the microcode running on the ESS clusters to
    retrieve the current configuration data, submit the requested configuration change,
    and display the outcome of the request. For further details please refer to IBM
    TotalStorage Enterprise Storage Server Web Interface User''s Guide SC26-7448.


    When you open a Web browser and log on to your ESS Specialist you get a welcome
    screen, as shown in Figure 4-7.'
