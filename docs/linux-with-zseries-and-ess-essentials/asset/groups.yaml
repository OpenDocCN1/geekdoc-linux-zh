    操作系统和应用代码的磁盘存储由全部 150 个虚拟服务器共享，而分布式情况下必须重复。共享代码提供控制磁盘存储成本和易于维护的优势。由于代码只有一个副本，只需在一个地方维护，从而节省系统管理软件和操作成本。


    z/VM 可帮助在服务器间共享可用磁盘空间。在分布式模型中，增加磁盘空间意味着需购买新磁盘。若某些服务器有空闲磁盘空间，也无法移动到需要增加磁盘存储的服务器。在
    zSeries 解决方案中，z/VM 允许将磁盘划分为可轻松分配给需要额外磁盘空间的服务器的微型磁盘。


    与分布式情况一样，运行中的 150 台服务器会发出必须被监控的消息，并在某些情况下做出响应。z/VM 中的 PROP 功能正是为此目的设计，避免了执行该任务所需的额外软件成本。备份由
    Tivoli Storage Manager (TSM) 执行。TSM 服务器安装在 z/VM 上如图所示，或安装在 Linux 虚拟实例中，随 TSM 版本
    5.2 提供。TSM 客户端安装在每个 Linux 客户机上。


    ## IBM TotalStorage 和 ESS


    本章首先对 IBM TotalStorage 方案的主要功能和优势以及其对 Linux 解决方案的支持进行概述。


    本章随后对 IBM TotalStorage Enterprise Storage Server，即 ESS，进行更具体的描述。


    整个产品系列在红皮书 *The IBM TotalStorage Solutions Handbook*，SG24-5250 中讨论。有关 IBM TotalStorage
    产品、软件和解决方案的进一步细节，包括 Linux 支持，可在以下网站找到：


    http://www.storage.ibm.com


    http://www.storage.ibm.com/linux


    ## 4.1 IBM TotalStorage


    Linux 启用存储是运行 Linux 的所有服务器的要求，无论其依赖的硬件基础设施如何。随着 Linux 从支持 Web 服务、网络、文件和打印操作等基础设施工作负载，转向数据中心核心的任务关键型应用，对存储基础设施交付卓越的可靠性、可扩展性、安全性和性能提出了更严格的要求。这些并不是
    IBM 存储产品组合的新要求，该组合目前已全面支持 Linux，并致力于通过新产品和解决方案使其更加强大。


    IBM 在所有服务器平台上继续支持 Linux，并在基于开放行业标准的异构平台存储网络方面引领行业。


    IBM 是交付世界级磁盘和磁带系统、存储管理软件、服务和集成解决方案的领导者，并包含以下内容：


    - Highly scalable storage - Enables administrators to manage growth and quickly
    respond to changing business needs, with ease of deployment and configuration

    - High availability and fault-tolerant storage - Provides continuous and reliable
    access to data using technologies like RAID and clustering

    - Improved data management - Helps administrators better control the security
    and growth of their data

    - Increased storage utilization - Allocates storage through a centrally managed
    pool of storage

    - Reduced administrative costs - Manage additional storage without having to add
    staff and, with IBM storage management tools, the ability to perform quicker problem
    resolution

    - Platform independence - Enables sharing of data and possibility of simplification
    of backup procedures

    - Centrally managed - Enables administrators to quickly respond to changing business
    needs, with ease of deployment and configuration

    - Reduced administrative costs - Manage additional storage without having to add
    staff, and with IBM storage management tools, the ability to perform quicker problem
    resolution


    ### 4.1.1 Value proposition


    IBM 提供全面的 Linux 战略，包括硬件、软件和管理工具等所有要素，为主要 IT 工作负载提供完整的基础设施。


    IBM 在 Linux 上的存储提供磁盘、高端和中端、磁带和网络存储以及主要 Linux 发行版的预测试组合，并提供在存储中部署 Linux 的明确战略。


    IBM 在 Linux 上的存储还提供与 IBM @server 和软件的对齐，以提供最合适的组合来满足各种客户需求，充分利用 Linux 带来的开源和异构环境的优势。

