    \ Proven 计划下，IBM 将继续与硬件供应商、ISV 和解决方案开发人员合作，在 IBM 庞大的存储产品系列上测试其产品。\n\n持续的益处包括：\n\
    \n- 预期客户价值：\n  - 通过投资经过验证的解决方案降低风险\n  - 降低集成成本\n  - 更快的解决方案部署\n\n有关 storage proven\
    \ 的更多信息可在以下网址找到：\nhttp://www.ibm.com/totalstorage/proven\n\n您可以在以下网址找到在 Linux\
    \ 环境中已测试其产品与 IBM 存储兼容的公司的最新列表：\nhttp://www.ibm.com/totalstorage/proven/solutions.htm\n\
    \n## 4.3 企业存储服务器\n\n本节介绍 Enterprise Storage Server 并讨论其提供的优势。这里讨论的功能并非 Linux 特有，但在\
    \ Linux 环境中大多仍然可用。\n\n有关更详细的信息，请参阅红皮书 *IBM TotalStorage 企业存储服务器 Model 800*，SG24-6424。\n\
    \n### 4.3.1 ESS 概述\n\n图 4-1 总结了 ESS 架构和功能。\n\n![](img/da33d6b6aa12b73deb3c350a0a89d424_51_0.png)\n\
    \n图 4-1 IBM 的 Seascape® 架构 - ESS Model 800\n\nESS 是 IBM 使用 IBM Seascape 架构开发的最强大的磁盘存储服务器。ESS\
    \ 为所有 IBM eServer 系列以及非 IBM（即基于 Intel 和基于 UNIX）的服务器系列提供无与伦比的功能。在所有这些环境中，ESS 具有独特的能力，能够满足计算业务可能要求的性能、容量和数据可用性的最苛刻要求。\n\
    \nSeascape 架构是 IBM 存储产品开发的关键。Seascape 使 IBM 能够整合来自 IBM 和整个行业的最佳技术，生产出灵活且可升级的存储解决方案。这种\
    \ Seascape 架构设计使 ESS 能够从最初的 E 型号发展到后来的 F 型号，再到最近的 800 型号，每一代都具有更新、更强大的硬件和功能增强。Server\
    \ 是 ESS 产品名称的一部分，因为 Seascape 架构战略中最重要的方面之一是在存储系统中使用服务器技术。将实际的服务器计算机（SMP）集成到 ESS\
    \ 中有助于减少对昂贵定制组件的需求，并通过使用经过验证的服务器和操作系统技术提高可靠性。\n\n图 4-2 中的图表描绘了 ESS Model 800 及其所有主要组件。机架顶部是磁盘驱动器模块（DDM），其正下方是容纳集群对称多处理器（SMP）的处理器抽屉。处理器抽屉下方是容纳连接\
    \ SSA 环路的 SSA 设备适配器的 I/O 抽屉。I/O 抽屉下方是容纳主机适配器的主机适配器舱位。机架底部是交流电源和电池。\n\n在两个 DDM\
    \ 框架之间是一个操作面板，包括紧急电源开关、本地电源开关、电源指示灯以及消息/错误指示灯。\n\n对于更大配置，ESS 基座机箱连接到一个与基座 ESS\
    \ 尺寸相同的扩展机箱机架，并放置在 ESS 基座框架旁边。\n\n![](img/da33d6b6aa12b73deb3c350a0a89d424_52_0.png)\n\
    \n图 4-2 ESS Model 800 主要组件\n\n### 4.3.2 ESS 功能和优势\n\nESS 在 1999 年首次推出时为存储服务器树立了新标准，此后已发展成为第三代\
    \ ESS Model 800。IBM TotalStorage 企业存储服务器 Model 800 引入了重要变化，极大地提高了 ESS 的整体价值，并为战略性存储区域网络（SAN）计划提供了坚实基础。\n\
    \n### 存储整合\n\nESS 的连接多样性和大容量使来自不同平台的数据能够整合到单个高性能、高可用性设备上。存储整合可以是服务器整合的第一步，减少您需要管理的设备数量，并允许您在需要时灵活添加或分配容量。IBM\
    \ TotalStorage 企业存储服务器支持所有主要操作系统平台，从完整的 IBM eServer 系列电子商务服务器和 IBM NUMA-Q®，到非\
    \ IBM 基于 Intel 的服务器，以及不同的 UNIX 变体，包括 Linux，如图 4-3 所示。\n\n![](img/da33d6b6aa12b73deb3c350a0a89d424_53_0.png)\n\
    \n图 4-3 用于存储整合的 IBM TotalStorage 企业存储服务器\n\n总容量高达 55 TB，并具有多样化的主机连接能力，SCSI、ESCON®\
    \ 和 Fibre Channel/FICON™（ESS Model 800）在整合当今必须处理的异构服务器平台的存储需求的同时提供卓越性能。\n\n###\
    \ 性能\n\nESS Model 800 性能增强的关键特性如下：\n\n- 配备 SMP 处理器可选 Turbo 功能的 ESS Model 800 能够提供其前身\
    \ Model F20 2.5 倍的吞吐量。\n- 64 GB 缓存支持更大规模的系统配置并提高命中率，从而降低响应时间。\n- 双倍内部带宽为数字媒体、商业智能、数据仓库和生命科学应用提供高顺序吞吐量。\n\
    - 更大的 2 GB 非易失性存储（NVS），带宽翻倍，可实现写入密集型应用的更大可扩展性。\n- 第三代硬件，例如更强大的 SSA 设备适配器，可为重要数据库应用提供高达\
    \ 40% 的响应时间改善\n- 2 GB Fibre Channel/FICON 主机适配器为开放系统和 zSeries 提供双倍的持续性能和即时吞吐量\n\
    - 与配置为 RAID 5 的相同物理容量相比，RAID 10 可为选定的数据库工作负载提供高达 75% 的更高吞吐量。虽然大多数典型工作负载在 RAID\
    \ 5 下会获得出色的响应时间，但某些不利于缓存的应用以及具有高随机写入内容的某些应用可以从 RAID 10 提供的性能中受益。\n- 15,000 rpm\
    \ 驱动器与 10,000 rpm 驱动器相比可提供高达 80% 的更高吞吐量和 40% 的响应时间改善。这使得工作负载能够达到显著更高的访问密度，同时获得改善的响应时间。\n\
    \n图 4-4 总结了上述提到的许多 ESS 功能。\n\n### IBM TotalStorage 企业存储服务器 Model 800\n\n- 第三代智能存储服务器\n\
    - 两个活动集群处理器，具有\n  - 更快的对称多处理器（SMP）\n  - 可选 Turbo 功能\n- 8、16、24、32 或 64 GB 缓存选项\n\
    - 2 GB 非易失性存储（NVS）\n- 8 x 160 MBps SSA 环路\n- 18.2 / 36.4 / 72.8 GB 容量磁盘选项\n  -\
    \ 磁盘容量混用\n- 10,000 rpm 和 15,000 rpm 磁盘选项\n  - 10,000 rpm 18.2 / 36.4 / 72.8 GB\
    \ 磁盘\n  - 15,000 rpm 18.2 / 36.4 GB 磁盘\n- 物理容量高达 55 TB\n- 最多 16 个 Fibre Channel/FICON\
    \ 端口\n- 最多 32 个 ESCON 端口\n- 最多 32 个 SCSI 端口\n- 连接到存储区域网络\n\n![](img/da33d6b6aa12b73deb3c350a0a89d424_54_0.png)\n\
    \n图 4-4 企业存储服务器 Model 800\n\n### 高效缓存管理和强大的后端\n\nESS 设计用于在混合不同工作负载需求时为不同类型的工作负载提供最高性能。例如，zSeries\
    \ 服务器和开放系统对存储子系统施加非常不同的工作负载需求。像 zSeries 这样的服务器通常具有非常利于缓存的 I/O 配置文件，并利用缓存效率。另一方面，开放系统服务器执行\
    \ I/O 可能非常不利于缓存，因为大多数命中在主机服务器缓冲区中解决。对于 zSeries 类型的工作负载，ESS 具有大缓存（最高 64 GB）的选项，最重要的是它具有高效的缓存算法。对于不利于缓存的工作负载，ESS\
    \ 具有强大的后端，SSA 高性能磁盘适配器为不断发展的高速硬盘提供高 I/O 并行性和吞吐量。\n"
