    ![](img/da33d6b6aa12b73deb3c350a0a89d424_46_0.png)


    Figure 3-9 Samba file/print scenario - zSeries solution


    Disk storage for the operating system and application code is shared by all 150
    virtual servers, while they must be duplicated in the distributed case. Sharing
    the code offers the advantages of controlling the cost of disk storage and ease
    of maintenance. Since only one copy of the code exists, it must only be serviced
    in a single place, which results in savings in system management software and
    operation.


    z/VM can help you to share the available disk space amongst the servers. In the
    distributed model, increasing disk space meant that you needed to buy new disks.
    If there was free disk space on some servers, it could not be moved to the server
    that needed the increased disk storage. In the zSeries solution, z/VM allows you
    to partition disks into minidisks that you can easily allocate to a server that
    requires additional disk space.


    As in the distributed case, the 150 servers in operation will issue messages which
    must be monitored, and responded to in some cases. The PROP function in z/VM is
    designed for that purpose, avoiding the cost of additional software to perform
    the task. Backup is performed by Tivoli Storage manager (TSM). A TSM server is
    installed either on z/VM (as depicted in the figure), or in a Linux virtual instance
    (available with TSM version 5.2). TSM clients are installed on each of the Linux
    guests.'
