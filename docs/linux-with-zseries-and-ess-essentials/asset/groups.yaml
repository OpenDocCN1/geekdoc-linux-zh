    ## 3.1.2 S/390 and zSeries 架构


    zSeries 和 S/390 架构的核心是多芯片模块（MCM），其包含多达 20 个处理单元（PU）。这些通常被称为中央处理单元（CPU）或引擎。


    所有 PU 都是相同的，但可以在系统中承担不同的角色。每个 PU 可以是以下之一：


    - 中央处理器（CP）PU：由操作系统用于执行客户工作

    - 系统辅助处理器（SAP）PU：这是一个运行通道子系统授权内部代码以控制 I/O 操作的 PU。

    - Linux 集成设施（IFL）PU：IFL 引擎仅限于运行 Linux 或 z/VM。

    - 集成耦合设施（ICF）PU：该引擎用于运行耦合设施功能，供 Parallel Sysplex® 使用。


    ### IFL 引擎


    IFL 是为 Linux 或 VM 下的 Linux 保留的处理器。其意义在于它不能用于运行其他操作系统，并且其存在不会反映在系统型号、MIPS 评级或其他功率评级中。这些功率评级方法对软件成本有重大影响。添加
    IFL 不会影响这些成本，允许在不影响其他软件成本的情况下使用 Linux。


    第 26 页图 3-3 显示了 IFL 如何分配给逻辑分区（LPAR）。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_39_0.png)


    图 3-3 IFL 与 LPAR 之间的关系


    注：IFL 必须专用于运行 Linux 或 z/VM 的 LPAR。它们可以由多个 LPAR 共享，前提是这些 LPAR 运行 Linux 或 z/VM。此外，LPAR
    不能同时包含 IFL 或 CP 的混合。


    图 3-4 为运行 z/VM 下 Linux 及其他工作负载的 zSeries 服务器的 CP 配置提供了一个示例。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_39_1.png)


    图 3-4 运行 z/OS 和 z/VM 下 Linux 的 zSeries 的 CP 配置。


    ## 3.1.3 进一步信息


    以下是一些有用的附加信息链接。


    Linux for IBM eServer zSeries：


    http://www.ibm.com/servers/eserver/zseries/os/linux


    Linux on zSeries 的讨论组可在以下位置找到：


    http://www2.marist.edu/htbin/wlvindex?linux-390


    Linux/390 项目的官方主页旨在提供 Linux/390 信息和软件的集中来源，可在以下位置找到：


    http://www.linuxvm.org


    zSeries 大型机服务器：


    http://www.ibm.com/servers/eserver/zseries


    ## 3.2 z/VM 背景


    您可以在 z/VM 下运行数十到数百个虚拟 Linux 系统，并且当 Linux 作为 z/VM 客户机运行时，您将继承 z/VM 的所有功能。本节重点介绍其中一些功能。


    虚拟机（VM）技术是在 20 世纪 60 年代中期随 IBM System/360™ 原始大型机引入的。当时，VM 使 S/360 系统用户能够在单台大型机上运行多个操作系统的副本。能够运行多个操作系统使得可以在同一大型机系统上迁移到新版本和发行版。用户可以在旧软件级别上运行生产工作负载，同时进行将环境迁移到新操作系统的所需工作。


    在 30 多年的时间里，IBM 在硬件、架构和微代码以及 VM 产品本身方面进行了投资，以增强随每代大型机产品线提供的虚拟化技术。这种“整体系统”投资是 IBM
    eServer zSeries 服务器系列提供业界领先虚拟化技术的原因。


    z/VM 中发现的虚拟化技术是独特的。一些“虚拟服务器”解决方案包括在单个操作系统上运行多个应用程序，使用虚拟存储技术来满足内存需求。另一方面，z/VM 使用其可用的实际资源（处理器、内存、I/O、网络等）创建虚拟机，每个虚拟机都能够运行支持
    zSeries 架构（包括 Linux）的任何操作系统的独立副本。在虚拟机中运行的操作系统就像在真实硬件上执行一样。硬件架构和设施由 z/VM 以这样的方式呈现给“客户机”系统（即被虚拟化），使得客户机操作系统认为它正在使用真实系统，而不是虚拟系统。图
    3-5 显示了一个包含多个虚拟机的示例，包括三台 Linux 机器和一台 z/OS。物理硬件对客户机不可见 - 相反，每个客户机看到的是 z/VM 提供的虚拟机。


    z/VM 甚至能够创建功能上比“真实”环境更丰富的虚拟机环境。示例包括：


    - 使用内存中数据技术透明地增强客户机系统性能

    - 模拟在真实大型机系统中不存在的设备网络设施

    - 在多个客户机系统之间共享单个内核副本


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_41_0.png)


    图 3-5  z/VM 虚拟化


    ### 3.2.1 使用 z/VM 的虚拟网络


    虚拟网络使用 z/VM 虚拟化在无需真实硬件的情况下提供客户机之间的连接。虚拟网络使 z/VM Linux 客户机之间能够进行快速且经济高效的 TCP/IP
    通信。请注意，z/VM 虚拟网络中的连接仅限于在单个 z/VM 映像中运行的客户机。虚拟网络不能用于 LPAR 间通信。Linux 客户机可用的虚拟网络有三种类型：


    - **用户间通信车辆（IUCV）**：使用 IUCV 可以在 Linux 客户机之间建立点对点 TCP/IP 连接。S/390 和 zSeries 的 Linux
    内核包含 IUCV 驱动程序，允许您连接两个 Linux 虚拟机。Linux 将 IUCV 连接视为任何其他 TCP/IP 网络连接。

    - **虚拟通道到通道（vCTC）**：vCTC 网络在无需实际通道分配的情况下提供客户机之间的点对点连接。z/VM 提供了定义虚拟通道到通道适配器的功能，以便用户可以使用
    CTCA 协议连接虚拟机。在 z/VM 上，这对于将 Linux 虚拟机连接到不支持 IUCV 的其他虚拟机（如 z/OS）很有用。虚拟 vCTC 网络也可以连接
    Linux 虚拟机。

    - **VM 客户机 LAN**：IUCV 和 vCTC 支持点对点连接。如果您计划将服务器映像连接到大量虚拟机，这可能会很麻烦。z/VM 4.2 引入了名为“Guest
    LAN”支持的新功能。运行 z/VM 的服务器映像使用 Hipersocket 协议连接到 Guest LAN。对 Linux 服务器或任何支持真实 HiperSockets™
    的软件来说，虚拟 Hipersockets 看起来就像真的一样。在 z/VM 环境中可以定义的虚拟 Hipersockets 连接数量没有限制，并且可以定义的
    Guest LAN 数量也没有预定义限制。


    ### 3.2.2 内置于 z/VM 的系统管理功能


    z/VM 中内置了许多系统管理功能。我们仅描述其中几个。


    希望对其“真实”独立服务器群进行指挥和控制的客户通常必须购买额外的服务器来运行指挥和控制软件产品，有时还需要在每个受管理的服务器映像上安装客户端代码。这在软件许可费（服务器和客户端代码）以及服务器的额外硬件和网络费用方面可能变得昂贵，更不用说增加的复杂性了。z/VM
    在产品中内置了大量指挥和控制功能。


    资源利用控制包括能够以高度精细的粒度按映像分配处理器容量。添加更多资源（如内存、磁盘空间和内存中数据支持）可以快速轻松地完成，尽管有时需要根据添加的资源重新启动受影响的
    Linux 映像。


    VM 提供诸如 REXX、可编程操作员（PROP）和管道等工具来构建自动化例程，以帮助最大限度地减少管理服务器群所需的手动干预。例如，您可以捕获来自 Linux
    服务器的控制台流量，并根据控制台数据以编程方式执行系统操作。


    ## 3.3 整合和可扩展性


    在本节中，我们解释了当您需要扩展解决方案的容量（可扩展性）或更有效地利用不同的服务器资源（整合）时，z/VM 提供的优势。


    ### 3.3.1 可扩展性


    zSeries 平台长期以来因其能够扩展以支持多样化工作负载的整合而受到认可。处理器和磁盘（如企业存储服务器）可以逐步升级以满足不断增长的需求。升级后，zSeries
    服务器可以通过两种方式扩展或增长其 Linux 工作负载。


    垂直增长 - 当向现有 Linux 映像添加更多系统资源时。例如，可以为 Linux 虚拟机提供更多处理器容量、更多虚拟内存、更多 I/O 设备或更多虚拟网络带宽。


    水平增长 - 当添加额外的 Linux 系统（通常是 z/VM 客户机）时。这在图 3-7 中有所说明。


    ### 3.3.2 整合


    将真实的分布式服务器整合到 zSeries 平台上，特别是作为 z/VM 下的客户机（如第 30 页图 3-6 所示），可以提供许多优势。z/VM 上的虚拟服务器共享总系统资源，如内存和处理器容量，从而优化资源利用率。磁盘空间也可以在
    z/VM 客户机之间共享，特别是只读文件（如应用程序代码和操作系统软件）可以放在一个磁盘上并使所有虚拟 Linux 服务器都可以访问，从而最大限度地减少维护工作量和软件成本。z/VM
    还提供虚拟网络和内置系统管理功能，如 3.2“z/VM 背景”第 27 页所述。


    负载轻到中等的且峰值不同步的服务器是整合到运行 Linux 的 zSeries 服务器上的良好候选对象。

