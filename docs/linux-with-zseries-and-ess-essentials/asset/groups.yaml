    # 1.3 Open source


    Linux was developed under GNU, which has articulated a philosophy that defines
    “free code” or the user’s right to use the code, rather than defining what they
    cannot do, which is the case with proprietary software. This license allows the
    user to alter, distribute and even sell the code covered under its license as
    long as they allow those to whom they distribute the code to do the same.


    The General Public License promotes free code on the GNU Web page. It also provides
    protection for the developer and prevents a user from altering the code and then
    asserting proprietorship over the code. This does not mean the code cannot be
    sold. According to the GNU Web site, “free software” allows a user to run, copy,
    distribute, study, change, and improve the software. It must also be available
    for commercial use.


    Standards enable communication among heterogeneous software and systems. Open
    source can be viewed as a manifestation of this process, and the process itself
    as a necessity for extending the development of inter-networking. When there is
    a need for new software or hardware support, or a defect is discovered and reported,
    the software (creation or correction) can be swiftly done by the user who required
    the changes (or by the original author), with no need for a design review, cost
