    Web 启用访问。他们还希望解决方案不需要长时间的开发周期，并支持符合开放标准的一体化基础设施。客户希望利用现有的事务应用程序、数据库资产以及在具有卓越可扩展性特征的硬件平台上的现有投资，以运行其新应用程序。


