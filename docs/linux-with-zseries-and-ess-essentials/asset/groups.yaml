    ## Linux 简介


    Linux 是一种类 UNIX 的开源操作系统。它由芬兰赫尔辛基的 Linus Torvalds 于 1991 年原创。他编写了第一个内核，即与计算机硬件交互并运行的基础程序。


    由于 Linux 源代码可自由获取，多家公司开发了不同的 Linux 发行版。发行版是一个完整系统。关键组件是 Linux 内核。根据发行版和预期用途，还可以包含其他实用程序、服务和各种应用程序。没有标准发行版。每个可用的发行版都有其独特的优势。


    IBM 很早就认识到 Linux 的价值：


    - 投资 Linux 相关产品开发

    - 与主要 Linux 分销商结成联盟

    - 为开源社区做出贡献

    - 大力支持该平台


    IBM 相信，随着客户继续利用 Linux 构建其 IT 基础设施和电子商务，这一投资将使客户受益。


    本章简要介绍 Linux，并从历史角度阐述其起源以及与开源和 GNU 通用公共许可证的关系。本章随后将从高层次描述 Linux 操作系统及其组件、Linux
    在 IT 世界中的定位以及 Linux 发行版。


    ### 1.1 Linux 的基础


    我们知道 Linux 指的是类 UNIX 的操作系统，因此让我们先简要回顾一下可移植操作系统的开发和开源的发展，以便了解 Linux 演进的背景。


    ### 1.2 GNU 通用公共许可证


    1969 年，几名 AT&T Bell Labs 员工¹ 开始着手开发一个名为 UNIX 的操作系统（OS）。其开发的一个重要创新在于该操作系统可在硬件平台之间移植。


    当时，出于各种法律原因，AT&T 允许学术界免费访问 UNIX 源代码，而对商业或政府访问收取超过 20,000 美元（按 1976 年美元计算！）的费用。随后，AT&T
    停止在大学教材中出版源代码，因为这会泄露 Bell Labs 的专有代码。协作编程时代已经到来。


    在美国，备受关注的 UNIX 学术变体成为伯克利系统发行版（BSD）²，其中增加了虚拟内存和网络功能。这些进步使得全球分散的贡献者能够进行大规模协作项目。随后，AT&T、加州大学董事会和其他各方就操作系统源代码的访问和分发问题发生了诉讼。代码知识产权的此类限制促使麻省理工学院人工智能实验室的一名研究人员编写一个既可移植又能以防止其最终受知识产权主张限制的方式许可的操作系统。


    新操作系统将被命名为 GNU，是“Gnu’s Not UNIX”的递归缩写。这项工作将采用“copyleft”而非版权保护的方式，在 GNU 通用公共许可证（GPL）下许可，该许可证规定所有在
    GNU 下运行或源自 GNU 的程序必须自由发布其源代码，放弃控制权同时保留所有权。这是自由（指自由）软件的诞生，与公有领域软件形成对比。此时，Sun、Hewlett-Packard
    和 IBM 等厂商已拥有基于许可的 AT&T UNIX 的专有商业产品，并在企业客户中日益流行。GNU 的萌芽开发工作始于以源代码形式提供编辑器、编译器和文件实用程序等工具，可在任何平台上编译和执行，从而标准化并改进了商业厂商提供的工具。1990
    年左右，程序员已为 GNU 贡献了几乎完整的运行环境，唯一例外是内核。GNU 内核将基于微内核架构，以提高可移植性。


    与此同时，一种名为 Minix³ 的小型类 UNIX 操作系统骨架被发表在教材中用作教学工具。Linus Torvalds 正是在这里进入故事。他决定编写一个类
    UNIX 操作系统，其功能比 Minix 更强大，可在现成个人计算机上运行。他与同事 Lars Wirzenius 在互联网上以 GPL 许可发布其源代码供公众评论，Linux
    就此诞生。


    Linux 是一个没有实用程序的内核，GNU 是一个缺少完整内核的运行环境，而不受限制的非内核 BSD 组件可用于完善整体。很快，这些组件与安装和维护工具结合起来，由分销商提供；其中最值得注意的首个是
    1993 年的 Slackware，随后还有许多其他发行版，使得 GNU/Linux（或自此被称为 Linux）的组合得以广泛使用。仅在几年之内，一个全球性的
    Linux 社区就发展起来，由被这种“自由”操作系统的可靠性和灵活性所吸引的程序员和用户组成。


    随着 GNU/Linux 的商业采用日益增长，“开源”一词开始取代“自由软件”一词。事实上两者存在差异，这关系到该领域商业企业的命运。


    ¹ Ken Thompson、Dennis Ritchie 和 J.F. Ossanna


    ² 《伯克利 UNIX 二十年：从 AT&T 所有到自由再分发》，Marshall Kirk McKusick，载于《Open Sources: Voices
    from the Open Source Revolution》，O’Reilly，1999 1-56592-582-3


    ³ Dr Andrew S. Tannenbaum，荷兰阿姆斯特丹自由大学


    ### 1.3 开源


    Linux 在 GNU 下开发，GNU 阐述了一种哲学，定义“自由代码”或用户使用代码的权利，而非定义用户不能做什么，后者是专有软件的情况。该许可证允许用户修改、分发甚至出售受其许可覆盖的代码，只要他们允许接收代码的人做同样的事情即可。


    GNU 通用公共许可证在 GNU 网页上推广自由代码。它还为开发者提供保护，防止用户修改代码后主张对代码的所有权。这并不意味着代码不能出售。根据 GNU 网站，“自由软件”允许用户运行、复制、分发、研究、更改和改进软件。它也必须可用于商业用途。


    标准使异构软件和系统之间能够通信。开源可以被视为这一过程的体现，而该过程本身则是扩展互联网络开发的必要条件。当需要新的软件或硬件支持，或发现并报告缺陷时，需要更改的用户（或原始作者）可以迅速完成软件的创建或修正，无需设计审查、成本分析或集中开发结构的其他限制。这得益于开源代码。


    IBM 认识到该社区的有效性，并看到了快速创新开发稳健稳定代码以提供电子商务应用使能层的益处。由于 Linux 的演进式开发，代码片段分布在各个网站上。如果没有一定的整合，安装和升级产品、跟踪模块依赖关系以及获取硬件驱动程序都很困难。发行版提供在同一位置的连贯软件包，提供可用服务器或桌面所需的各种功能。一般来说，不同分销商的产品有很多共同点，但您可能需要的特定功能或功能可能在某个分销商处不可用。


    ### 1.4 Linux：操作系统


    Linux 是一个功能齐全的操作系统，类似于 UNIX 系统。它具有企业级 UNIX 系统的所有标准功能。命令结构的管理通过 shell 实现。我们提及 Linux
    可用的众多高级 shell 中的两个，即 Bourne Again Shell（bash）和 tcsh shell。两者都支持完整的基于 shell 的编程语言，可用于创建
    shell 脚本。


    Linux 有四个基本组件：


    - 内核：提供程序和硬件设备管理（如磁盘和打印机）

