    |


    # 2.4 Platform services


    The xSeries, zSeries, iSeries, and pSeries platforms work with Linux as an operating
    system today, among the other operating systems that exist in the marketplace.
    Just as software-based services for Linux are needed, so is a well-founded, platform-based
    service and support structure which is still growing.


    The IBM Linux Support Line provides Operational Support Services and a Premier
    Remote technical support service. For more information, see:


    http://www-1.ibm.com/services/its/us/supportline.html


    IBM provides technical support for the major distributions of the Linux operating
    system running in the xSeries, zSeries, iSeries, and pSeries platforms, as well
    as some non-IBM applications that operate in a Linux environment. IBM helps answer
    how-to questions, performs problem source determination, and provides mechanisms
    for a solution. In addition, by leveraging partnerships with the key distributors
    of the Linux operating system, IBM provides defect-level support for the Linux
    operating system. Remote assistance is available through toll-free telephone or
    electronic access depending on the country or region.


    IBM provides services for all currently supported xSeries (including BladeCenter™),
    zSeries, iSeries, and pSeries platforms in a different degree of variety and complexity
    through its Linux Portal. For more information see:


    http://www.ibm.com/linux/


    As Linux continues to grow, so will IBM’s commitment to enhance current services
    or provide new ones.'
