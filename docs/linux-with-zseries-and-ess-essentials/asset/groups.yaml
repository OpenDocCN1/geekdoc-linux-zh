    | 产品 | 产品详情 | 服务和支持 |\n|---|---|---|\n| Lotus Notes® Domino | Lotus Notes Domino\
    \ V 6 Red Hat Linux, Version 7.2 或 SuSE Linux, Version 8.0 on Intel | http://www.lotus.com/products/rnext.nsf/873769A79D9C5B2285256A0800720B96/478B755CB7C8CB9C85256C400005EF2A?OpenDocument&cwesite=domfamserv\
    \ |\n\n## 2.4 平台服务\n\nxSeries、zSeries、iSeries 和 pSeries 平台目前将 Linux 作为操作系统使用，与市场上存在的其他操作系统一起。正如\
    \ Linux 需要基于软件的服务一样，也需要一个扎实且仍在发展的基于平台的服务和支持结构。\n\nIBM Linux 支持热线提供运营支持服务和高级远程技术支持服务。有关更多信息，请参阅：\n\
    \nhttp://www-1.ibm.com/services/its/us/supportline.html\n\nIBM 为运行在 xSeries、zSeries、iSeries\
    \ 和 pSeries 平台上的 Linux 操作系统主要发行版以及在 Linux 环境中运行的一些非 IBM 应用程序提供技术支持。IBM 帮助回答操作方法问题，进行问题源确定，并提供解决方案机制。此外，通过利用与\
    \ Linux 操作系统主要分销商的合作伙伴关系，IBM 为 Linux 操作系统提供缺陷级别支持。远程协助可通过免付费电话或电子访问提供，具体取决于国家或地区。\n\
    \nIBM 通过其 Linux 门户为所有当前受支持的 xSeries（包括 BladeCenter™）、zSeries、iSeries 和 pSeries\
    \ 平台提供不同程度的种类和复杂性的服务。有关更多信息请参阅：\n\nhttp://www.ibm.com/linux/\n\n随着 Linux 的不断发展，IBM\
    \ 致力于增强现有服务或提供新服务的承诺也将持续。\n"
