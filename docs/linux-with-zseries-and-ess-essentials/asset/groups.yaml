    IBM also provides Learning Services for customers who are interested in knowing
    more about Linux, and making it their key operating environment for e-business.
    IBM''s Linux education and training services offer a full curriculum and help
    to establish a personal Linux education plan. For details about IBM''s Linux Learning
    services and Linux Training, you can visit:

