    ## ESS 复制服务和 Linux


    本章提供了 IBM TotalStorage Enterprise Storage Server 可用的 Copy Services 功能概述，特别针对 zSeries
    上的 Linux。有关这些功能的完整详细信息，读者应参考红皮书 *使用 IBM eServer zSeries 实施 ESS Copy Services*，SG24-5680，以及
    *在开放环境中实施 Copy Services*，SG24-5757。


    ### 6.1 引言


    Enterprise Storage Server Copy Services 是企业级功能，可为您提供领先的解决方案，以满足灾难恢复、数据迁移和数据复制的需求。构成
    ESS Copy Services 套件的产品集包括：


    - 点对点远程复制（同步 PPRC）

    - 点对点远程复制扩展距离（非同步 PPRC-XD）

    - FlashCopy

    - 扩展远程复制（XRC）

    - 并发复制（CC）


    > **注意：** ESS Copy Services 中的两种服务，Extended Remote Copy 和 Concurrent Copy，仅适用于
    z/OS 和 OS/390 操作系统，且 *不可用* 于 zSeries 上的 Linux。本书对这些复制功能提供的细节很少。


    FlashCopy 和点对点远程复制（同步 PPRC 和非同步 PPRC-XD 均可）是 Enterprise Storage Server 的基于硬件的功能，可与开放服务器（基于
    UNIX 和 Intel）以及 zSeries 和 iSeries 服务器一起使用。图 6-1 说明了这些 ESS Copy Services。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_75_0.png)


    *图 6-1 面向 zSeries 的 ESS Copy Services*


    使用 ESS，我们具有复制数据的功能，既可以 *本地* 复制，即在同一现场 ESS 内部，也可以 *远程* 复制，即将数据复制到单独的远程站点 ESS。


    属于 *Remote Copy* 类别的 ESS 复制功能有：

    - 扩展远程复制（XRC）

    - 点对点远程复制（PPRC）

    - 点对点远程复制扩展距离（PPRC-XD）


    属于 *本地复制* 类别的 ESS 复制功能有：

    - FlashCopy

    - 并发复制


    ESS Copy Services 复制功能也可以归类为 *动态* 或 *时间点*。动态复制功能会随着应用程序对主数据源的更改不断更新副本。时间点复制功能提供原始数据在特定时间点的即时副本或视图。例如，上面列出的
    Remote Copy 功能全部为 *动态*，而上面提到的本地复制功能均为 *时间点*。


    ### 6.2 点对点远程复制（PPRC）


    点对点远程复制（PPRC）是一种同步远程数据镜像技术，主要作为业务连续性解决方案的一部分，用于防止磁盘子系统丢失或整个站点故障。它还用于远程迁移数据和应用程序工作负载，以及异地备份。它是一种实时复制技术，可将
    *主* 卷集（由应用程序使用）同步镜像到 *次* 卷集（参见图 6-2）。通常，次要卷位于距离应用程序站点一定距离的远程位置的不同 ESS 上。镜像在逻辑卷级别完成。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_76_0.png)


    图 6-2 同步卷复制 PPRC


    PPRC 是一种硬件解决方案，因此与应用程序无关，相关的硬件功能需要在本地和远程 ESS 上均可用。由于复制功能发生在存储子系统级别，因此应用程序无需知道其存在。PPRC
    通过确保只有在主 ESS 收到次要副本已成功更新的确认后，主卷更新才会成功完成，从而保证次要副本是最新的。


    更新记录时的顺序如下（参见图 6-2）：


    1. 写入主卷（写入主 ESS 缓存和非易失性存储 NVS）。应用程序将数据写入应用程序站点 ESS 上的主卷，并发生缓存命中。

    2. 写入次卷（写入次 ESS 缓存和 NVS）。应用程序站点 ESS 然后启动 I/O 通道程序到恢复站点 ESS，将更新的数据传输到恢复站点缓存和 NVS。

    3. 在次卷上发出写入完成信号。当更新的数据位于其缓存和 NVS 中时，恢复站点 ESS 向应用程序站点 ESS 发出写入完成信号。

    4. 报告 I/O 完成。当应用程序站点 ESS（主 ESS）收到恢复站点 ESS 的写入完成信号时，它向应用程序系统返回 I/O 完成状态。


    从缓存到应用程序 ESS 和恢复站点 ESS 后端磁盘驱动器的 destage 异步执行。PPRC 的同步技术可确保与应用程序相关的写入会以相同的顺序应用于次要卷，从而在每个时刻提供应用程序一致性。PPRC
    具有可调整的参数（CRIT 和一致性组），用于标识在更新次要副本时出现错误或延迟时应采取的操作。


    从 PPRC 角度来看，ESS 内的卷可以处于以下状态之一（参见图 6-3）：


    - Simplex：卷的初始状态。主卷和次卷之间尚未建立 PPRC 卷对关系。

    - Pending：已定义 PPRC 卷对关系的初始状态，此时主卷到次卷的初始复制正在进行。此状态也出现在 PPRC 卷对在暂停后重新同步时出现。在等待期间，卷对不同步，PPRC
    正在将磁道从主卷复制到次卷。

    - Duplex：PPRC 完全完成将主卷复制到次卷后，PPRC 卷对的状态。此时卷对同步，所有对主卷的写入更新都会同步应用于次卷。

    - Suspended：在 PPRC 对的此状态下，对主卷的写入不会镜像到次卷。次卷变得不同步。在此期间，PPRC 保留主卷中已更改磁道的位图记录。稍后，卷对可以重新同步，然后仅复制已更新的磁道。例如，当主
    ESS 无法完成对恢复 ESS 的写操作时，PPRC 卷对会自动进入暂停状态。

    - Duplex pending-XD：当卷对以非同步 PPRC-XD 关系建立时会出现此状态。此 PPRC 卷状态在 6.3“PPRC 扩展距离（PPRC-XD）”第
    65 页中进行了解释。


    ![](img/da33d6b6aa12b73deb3c350a0a89d424_78_0.png)


    图 6-3 PPRC 卷状态 - 同步操作模式


    ### 复制 PPRC 次要卷


    PPRC 次要卷可以是 FlashCopy 主卷。这使您例如可以在其暂停时生成镜像卷的一致时间点三级副本。使用 PPRC V2，您可以执行异步级联 PPRC，其中（同步）PPRC
    次要卷可同时充当到远程站点的 PPRC-XD 关系的 PPRC 主卷。这提供了三站点 PPRC 配置的能力。


