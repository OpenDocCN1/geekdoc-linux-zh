  md: '# Tips for Interview


    +   1. It is important you listen well to what the interviewer is saying so you
    know what he/she is asking, and so you won''t ask them about anything you have
    already discussed.


    +   2. Good eye-contact shows the interviewer that you are confident and that
    you are telling the truth


    +   3. You should always send a thank-you-letter immediately after the interview
    to show the interviewer how interested you are in the position, and how appreciative
    you are of their time.


    +   4. You should always show confidence to the employer so they realize that
    you believe you can do the job.


    +   5. You should always ask good questions to prove you are interested in the
    position.


    +   6. You should always carry a pen in case you need to fill out an application
    or other form.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '+   7. To prove that you have the experience and skills that you say do, you
    should give examples of your previous jobs that show you do possess them.


    +   8. During an interview you want to convey all your past experience by relating
    it to the responsibilities of the job you are applying for.


    +   9. Even if you have to say no to one of the interview questions, you should
    always find a way to end on a positive-note.


    +   10. You can make a follow-up-call if the employer hasn''t called you a week
    after your interview.


    +   11. You should always greet the interviewer with a firm handshakes to show
    them that you are professional, and happy to meet them.


    +   12. Although your resume may say it, you want to convey what skills you have
    to prove you can do the job.


    +   13. You should arrive early in case you have to fill out an application before
    the interview.


    +   14. You should always smile at the interviewer to show that you are happy
    to be at the interview.'
  merge: -1
