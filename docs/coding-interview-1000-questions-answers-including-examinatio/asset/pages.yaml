  md: '# # Seek for Interview


    # ### Finding Job Openings


    +   A. Read the classified ads

    B. Develop a network of friends, relatives, former employers...

    C. Check postings on the Internet

    D. Check with employment agencies (note fee)

    E. Set up informational interviews

    F. Do temporary or part-time work


    # ### Applying For A Job


    +   A. Preparing in advance

    1. Develop "I am..." and "I can..." lists

    2. Create a strong resume to market yourself

    3. Prepare a professional reference list'
