    ## Tips for Interview


    - It is important you listen well to what the interviewer is saying.

    - Good eye contact shows you interested in the position.

    - You should always send a thank you letter immediately after the interview to
    show how appreciative you are of their time.

    - You should always dress with confidence to prove you can do the job.

    - You should always ask good questions to show you are interested.

    - You should always carry a pen in case you need to fill out an application.


    - If you have to say no to one of the interview questions, you should always find
    a way to end on a positive note.

    - If the employer hasn''t called you, you can make a follow-up call a week after
    your interview.

    - You should always greet the interviewer with a firm handshake to show you are
    professional and happy to meet them.

    - Although your resume may say it, you want to convey what skills you have to
    prove you can do the job.

    - You should arrive early in case you have to fill out an application before the
    interview.


    - You should always bring an extra copy of your resume for the interviewer.

    - You should always dress with a professional appearance for an interview.


    # Practice Interview


    Just making a statement about your skills and strengths is not enough. You need
    to re-state what you say so that the employers knows you know the terms that you
    are using. Please match the statement on the left with how it can be restated
    in the right column.


    | | |

    |---|

    | 1. I am reliable | A. I learn new programs very fast. |

    | 2. I am a quick learner | B. I am always looking for more to do without my supervisor
    having to encourage me to. |

    | 3. I am flexible | C. I always come to work. |

    | 4. I am very honest | D. I can be flexible with my hours. |

    | 5. I am a team player | E. I tell the truth and can be trusted. |

    | 6. I am enthusiastic | F. I really enjoy my work and bring a lot of energy to
    it. |

    | 7. I am self-motivated | G. I enjoy helping my colleagues whenever I can. |

