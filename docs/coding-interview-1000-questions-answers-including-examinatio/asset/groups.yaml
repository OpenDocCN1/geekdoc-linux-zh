    \ and make good *eye contact*\n- Speak *courteously* and behave naturally.\n-\
    \ *Listen* carefully as the interviewer talks about the job and the business,\
    \ and take notes\n- Use *samples* to prove to the interviewer that you have the\
    \ *experience* and skill required\n- Be sure to tell the interviewer that you\
    \ are *enthusiastic, motivated, flexible, detail-oriented, reliable,* and a team\
    \ player with a good attitude\n- Make sure your body language shows the interviewer\
