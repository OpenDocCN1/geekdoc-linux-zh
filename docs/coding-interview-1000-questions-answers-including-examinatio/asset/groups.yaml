  mdcn: "\n\n## 如何面试\n\n-   *早点*到达以证明你是一个*准时*的人\n-   携带面试文件夹、简历、问题清单和一支*笔*可以显示出你的*专业素养*\n\
    -   带着*微笑*、有力的*握手*并保持良好的*眼神交流*问候面试官\n-   说话要*礼貌*，行为要自然\n-   当面试官谈论工作和业务时，仔细*倾听*并做笔记\n\
    -   使用*案例*向面试官证明你具备所需的*经验*和技能\n-   务必告诉面试官，你是一个*充满热情、有动力、灵活、注重细节、可靠*，且具有良好态度的团队合作者\n\
    -   确保你的肢体语言向面试官展示你对自己充满*热情*且*自信*\n-   在面试结束时，感谢面试官提供讨论工作的*机会*，并通过表达想得到这份工作来以*积极的基调*结束面试\n\
    -   面试后，务必立即发送一封*感谢信*，必要时进行*跟进电话*\n\n## 面试问题\n\n-   请介绍一下你自己好吗？\n-   你能够为我们提供什么别人做不到的服务？\n\
    -   我们为什么要聘用你做这份工作？\n-   你的优点是什么？\n-   你的缺点是什么？\n-   你在我们公司寻找什么样的职位？\n-   你为什么想在这公司工作？\n\
    -   你希望在五年后达到什么样的位置？\n-   你如何与他人相处？\n-   你对上一份工作的上怎么看？\n-   你对薪资的预期是多少？\n-   你在压力下工作良好吗？\n\
    -   在该领域有多少工作经验？\n-   你为什么认为自己胜任这个职位？\n-   你为什么认为自己值 $xxxx？\n-   你为什么不让我们联系你目前的雇主？\n\
    -   你有什么要问吗？\n-   你的优势是什么？\n-   你的劣势是什么？\n\n## 面试词汇\n\n1.   如果面试官告诉你你将获得医疗保险和带薪病假/年假，你就知道该职位将提供*福利*。\n\
    2.   如果你与人相处良好并且总是愿意帮助同事，你可能想举过去工作中作为*团队合作者*的例子。\n3.   如果你能够将许多任务按重要性排序并完成，请务必告诉面试官你具备*优先排序*的能力。\n\
    4.   如果你能激励自己去寻找更多要做的任务，你可能想传达你是如何*充满动力*的。\n5.   如果职位有几个时间段（早晨/白天/晚上……），它很可能是轮班工作。\n\
    6.   如果你能和孩子一起，从不对他们发脾气，并始终给予时间和理解，你可能想告诉雇主你有多有耐心。\n7.   如果你学得很快，你可能想告诉面试官你是一个快速学习者。\n\
    8.   如果你掌握了某些功能，你可以告诉雇主你所拥有的技能，这将让你能够轻松地完成工作。\n9.   如果公司有一个职位可以让你进入另一个薪水更高、责任更大的职位，那么它就有增长的机会。\n\
    10.  如果你的时间安排允许，你可能想展示你在工作时间上有多灵活。\n11.  如果你行为言语得体，并对工作表现保持严肃的态度，你可以传达出你具有专业素养。\n\
    12.  如果你为工作带来了很多能量和新想法，你应该告诉面试官你有多热情。\n13.  如果你准确履行职责且不犯错，你可能想告诉面试官你注重细节。\n14.\
    \  如果你总是准时，你可能想告诉面试官你有多准时。\n15.  如果你喜欢你所做的工作，与同事相处良好，并带着微笑完成主管要求的工作，你应该告诉面试官你有良好的态度。\n\
    16.  如果你在之前的某份有薪或无薪工作中履行过这项职责，请务必告诉面试官你过去的经验。\n17.  如果该职位不需要任何以前经验，是初级且包含培训，那么它可能是一个入门级职位。\n\
    18.  如果你每天都来 The Job Connection，你可以以此种方式向面试官解释你是有多么可靠。\n\n## C# 100\n## 问题与解答\n\
