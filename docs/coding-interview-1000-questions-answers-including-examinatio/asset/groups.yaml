    # 准备面试


    # （可选）


    ## 寻找面试


    ### 寻找招聘机会


    - A. 阅读分类广告

    - B. 建立朋友、亲戚、前雇主的人脉网络

    - C. 查看互联网上的招聘信息

    - D. 联系职业介绍机构（注意费用）

    - E. 进行信息性面试

    - F. 承担临时或兼职工作


    ### 申请工作


    - A. 提前准备

    1. 列出“我是……”和“我能……”列表

    2. 创建一份强有力的简历来推销自己

    3. 准备一份专业的推荐人列表


    - B. 通过申请表申请

    1. 准备好通用申请表、简历复印件和 2 支笔

    2. 始终打印所有信息

    3. 申请时务必留下一份简历副本

    4. 在你的求职日志上记录每次申请


    - C. 通过信函（求职信）申请

    1. 将信发送给招聘人员，而不是写“尊敬的先生/女士”

    2. 明确你申请的职位以及是如何获知的

    3. 突出你针对该职位的 3 或 4 个最核心的资质

    4. 始终为自己的档案留存一份质版

    5. 寄出的份简历都附上一封求职信

    6. 在你的求职活动日志上记录每封寄出的信

    7. 在适当的时间致电跟进面试请求


    - D. 通过电话申请

    1. 随身带上简历

    2. 准备好笔和纸记录笔记

    3. 尝试与招聘人员交谈

    4. 明确你致电的职位以及是如何获知的

    5. 简述你的资质并请求面试

    6. 记录面试的时间、日期、面试官姓名、路线等


