  - '[PAGE 19]


    # How to Interview


    +   - Arrive *early* to prove that you are *punctual*


    +   - Coming with an interview folder, resume, list of questions, and a *pen*
    shows your *professional*


    +   - Greet the interviewer with a *smile*, a firm *hank-shake* and make good
    *eye contact*


    +   - Speak *courteously* and behave naturally.


    +   - *Listen* carefully as the interviewer talks about the job and the business,
    and take notes


    +   - Use *sample* to prove to the interviewer that you have the *experiences*
    and skill required


    +   - Be sure to tell the interviewer that you are *enthusiastic, motivated, flexible,
    detail-oriented, reliable,* and a team player with a good'
  - '[PAGE 20]


    attitude


    +   - Make sure your body language shows the interviewer that you are *enthusiastic*
    and *confident* in yourself


    +   - At the end of the interview, thank the interviewer for the *opportunity*
    to discuss the job and end on a *positive-note* by saying you want the job


    +   - After the interview, be sure to send a *Thank-You-Letter* immediately and
    make a *follow-up-call* if necessary'
  - '[PAGE 21]


    # Questions in Interview


    +   - Could you tell us about yourself? Please.


    +   - What are you able to do for us that other people can''t?


    +   - Why should we hire you for this job?


    +   - What are your strong points?


    +   - What are your weak points?


    +   - What position do you look for in my company?


    +   - Why do you want to work for this company?


    +   - Where would you like to be in five years?


    +   - How do you get along with other people?


    +   - What do you think of your boss on your last job?'
  - '[PAGE 22]


    +   - What would you expect for a salary?


    +   - Do you work well under pressure?


    +   - How long working experience in this field?


    +   - Why do you think you are qualified for this position?


    +   - Why do you believe you are worth $xxxx?


    +   - Why don''t you want us to contact your current employer?


    +   - Do you have any question?


    +   - What is your strength?


    +   - What is your weakness?'
  - '[PAGE 23]


    # Vocabularies of Interview


    +   1. If the interviewer tells you that you will receive health insurance and
    paid sick/vacation time, you know that you will receive *benefits* with the position.


    +   2. If you get along along well with others and you are always willing to help
    your colleagues, you may want to give some examples from a past job when you were
    a *team-player*.


    +   3. If you are able to put many tasks in order of importance for completion,
    be sure to tell the interviewer about your ability to *prioritize*.


    +   4. If you inspire yourself to look for more tasks to do, you may want to convey
    how you are *motivated*.'
  - '[PAGE 24]


    +   5. If the position has several schedules (morning/day/night,...), it is probably
    shift work.


    +   6. If you''re able to work with children, never get short-tempered with them,
    and always give them time and understanding, you may want to tell the employer
    how patient you are.


    +   7. If you pick up things quickly, you may want to tell the interviewer that
    you are a quick-learner.


    +   8. If there are certain functions that you have learned, you can tell the
    employer about the skill you have that will make it easy for you to do the job.


    +   9. If the company has a position that can lead you to another position with
    a higher salary and more responsibilities, it has opportunity for growth.


    +   10. If your schedule allows, you may want to show how flexible you can be
    with your working hours.'
  - '[PAGE 25]


    11. If you act/speak appropriately and maintain a serious attitude

    about your job performance, you can convey that you have a sense

    of professionalism.


    12. If you bring a lot of energy and new ideas to your job, you should

    tell the interviewer how enthusiastic you are.


    13. If you perform duties accurately, without making mistakes, you

    may want to tell the interviewer that you are attentive to detail.


    14. If you are always on time, you may want to tell the interviewer

    how punctual you are.


    15. If you enjoy the work that you do, get along well with your

    colleagues, and do what your supervisor asks you to do with a

    smile, you should tell the interviewer that you have a good-

    attitude.'
  - '[PAGE 26]


    +   16. If you have performed this duty on a previously paid or unpaid job, be
    sure to tell the interviewer about your past experience.


    +   17. If the position does not require any previous experience, is the first
    level, and includes training, it is probably an entry level position.


    +   18. If you have come every day to The Job Connection, you can use that as
    a way to explain to the interviewer how reliable you are.'
