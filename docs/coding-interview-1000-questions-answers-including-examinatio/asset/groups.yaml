    2. Create a strong resume to market yourself

    3. Prepare a professional reference list'
  - '[PAGE 11]


    # B. Applying by Application


    +   1. Go prepared with generic application, copies of resume

    and 2 pens


    +   2. Always print all information


    +   3. Always leave a copy of your resume with your

    application


    +   4. Record each application on your Job Search Log


    # C. Applying by letter (cover letter)


    +   1. Send your letter to the person doing the hiring, not to

    "Dear Sir"


    +   2. Identify the job you are applying for and how you found

    out out about it


    +   3. Highlight your 3 or 4 strongest qualifications for that

    position


    +   4. Always make a hard copy for your files


    +   5. Include a cover letter with every resume you send


    +   6. Record each letter sent on your Job Search Activity Log'
  - '[PAGE 12]


    +   7. Make a follow-up interview request call at the appropriate time


    D. Applying by telephone


    +   1. Have a resume handy


    +   2. Have a pen and paper ready for note taking


    +   3. Try to talk to the person who will do the hiring


    +   4. Identify the job you are calling about and how you found out about it


    +   5. Briefly state your qualifications and request an interview


    +   6. Take notes on the interview time and date, interviewer''s name, directions,
    etc.


    +   7. Record each call in your Job Search Log


    # Interviewing For A Job


