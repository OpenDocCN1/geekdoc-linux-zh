- '# Linux：从灾难到精通




  ![](img/cover.jpeg)



  ## 引言


  我想感谢你的下载，并祝贺你下载了这本书《Linux：从零到精通的逐步指南：Linux 与命令行学习指南》。


  `Linux` 是一种在程序员和开发者中非常受欢迎的操作系统。即使是普通电脑用户，也由于该系统提供的独特功能想要学习如何使用这个系统。


  让我们来看关于该操作系统使用的一些统计数据。全球约 94% 的超级计算机由 `Linux` 驱动。超过一半驱动互联网的服务器运行在 `Linux` 上。Android
  设备、许多台式电脑以及各种类型的硬件都运行在 `Linux` 上。因此，了解如何使用这个系统非常重要。


  存在一种误的误解，认为 `Linux` 操作系统和 `Linux` 发行版家族复杂且难以理解。事实并非如此。`Linux` 和其他操作系统一样，很容易学习和理解。这种误解可能源于大多数计算机用户在学习其他系统之前已经习惯了
  `Windows`。这让切换变得具有挑战性，但这不应是事实。


  在这本电子书中，我将带你了解关于 `Linux`、命令行和图形用户界面所需的所有知识。如果你是一个初级开发者或程序员、普通电脑用户，或者只是想了解这个操作系统，你会发现本指南有趣且信息量丰富。无论你之前是否有
  `Linux` 经验，我将假设你是一个完全的初学者。


  本指南将作为培训，当我们结束时，你应该能够掌握对 `Linux` 的良好实践知识，从命令行和图形用户界面轻松地浏览任何 `Linux` 发行版，并学习 `Linux`
  的系统配置和常用应用程序。


  再次感谢下载本书，希望你喜欢它！





  ## 第 1 章：开始学习 Linux


  你决定学习 `Linux`。也许你想要从另一个操作系统切换到你听过的这个神奇操作系统。在第一章中，我将带你了解你可能想使用 `Linux` 的不同原因、`Linux`
  的后台工作原理、安装 `Linux` 以及如何开始。这一切都是为了在我们进入正题之前，让你逐渐融入 Linux 的世界。


  首先，Linux 是什么？用简单的话说，`Linux` 是一种让你的计算机能够运行的操作系统。`Windows`、`Mac OS`、`iOS` 和 `Android`
  都是操作系统。它们提供了一个让不同软件在硬件上运行的平台。因此，操作系统与硬件、软件、用户以及连接到你设备的任何其他交互，使它们共同工作以实现特定的功能。


  “这些操作系统之间有什么区别？我可以直接使用其中任何一个而不需要切换吗？”你可能会问。每种操作系统，特别是 `Linux`，都有它们自己的工作方式。在引言中，我们查看了
  Linux 作为操作系统的一些统计数据。在几乎所有的超级计算机和大多数互联网服务器上，`Linux` 是首选操作系统。在开发者和程序员中，`Linux` 是首选操作系统。这是因为他们喜欢
  Linux 的工作方式。让我们来看看 Linux 相对于其他操作系统的优势。


  Linux 操作系统非常安全。使用 `Linux OS` 时，感染病毒的概率极小。大多数 Linux 用户不在他们的计算机上运行杀毒软件——可能只有处理特殊和敏感用途的用户。正如你可能知道的，杀毒软件会降低电脑速度。


  Linux 操作系统非常灵活。与其他操作系统不同，`Linux` 在许多方面都非常灵活。你可以从许多选项中选择用户界面，而 `Windows` 只有一个。`Linux`
  运行在各种硬件上、超级计算机、服务器、台式电脑和智能手机上。它可以运行在旧硬件、低配置电脑以及超快速现代计算机上。`Linux OS` 提供了强加密等高级安全功能。这些以及更多功能使得该操作系统在各种常见和高级用途中都非常灵活。






  ## 引言


  将 Linux 与其他操作系统进行比较时，另一个主要的区别点是理念上的差异。Linux 是开源软件，这意味着它是免费的。任何人都可以根据意愿将其任何用途、对其进行修改、与社区共享并研究其工作原理，而不会违反任何规定。这对于
  Linux 社区非常重要，因为对于是否应该限制软件用户可以做和不能做的事情，人们存在意见分歧。Linux 操作系统提供的自由是吸引程序员和开发者加入它的动力，因为他们可以在寻求创新的过程中对其进行尝试。


  鉴于此，Linux 操作系统并不是由一个人或一家公司开发的。它是一个庞社区的产物，该社区不断开发 Linux 以及其他相关程序，以造人类更大的利益。因此，在使用
  Linux 和其他相关的开源程序时，你不必担心现在面临的监控、监测或在线活动被追踪等各种问题。


  所有这些特性使得 Linux 操作系统对大多数人都有吸引力。即使是以前未使用过 Linux 的人也愿意学习，他们仅仅受限于对学习曲线可能陡峭的假设。Linux
  帮助人类的一种简单方法是利用旧硬件运行免费的 Linux 操作系统和其他开源程序，为发展中国家和学校提供了一种获取廉价计算机的低成本方式。


  即使你对我们刚刚讨论的关于 Linux 的任何事情都不感兴趣，仍然值得尝试；你可能会爱上它，如果没有，你一无所获，但收获了关于不同操作系统的知识。让我们进入下一章，我们将讨论如何安装
  Linux。


  ## 第 2 章：安装 Linux


  既然你已经决定学习 Linux 操作系统，你就需要安装操作系统，因为你不能仅仅通过阅读指南来学习。你必须在几乎每一个阶段都付诸实践。就像骑自行车；你必须真正坐上去骑起来。在我们介绍安装此操作系统的各种方法之前，你需要对电脑上所有重要文件进行备份。特别是那些位于包含现有操作系统的分区中的文件。这并不意味着
  Linux 会以某种方式吞噬这些文件，但为了防止发生意外，保留某种形式的备份会更好。在大多数情况下，这些文件将保持完好无损，但防患胜于治疗治。你可以将这些文件备份到可移动硬盘上、刻录到
  CD 中，或者备份到云端。养成每次都备份文件的习惯——而不仅仅是在安装新操作系统时备份。


  目前有多个版本的 Linux 可供选择。最流行的（最适合初学者的）是 Ubuntu。这个版本的 Linux 易于使用、易理解且非常灵活。它可以运行良好，并以一种非常温和的方式带你进入
  Linux 世界作为一个开始，我们不需要安装这个操作系统；我们可以从 CD 运行它，只有当我们确定想要它时才进行安装。你将从 CD 运行整个 Linux 操作系统，你的电脑不会发生任何更改。然而，这样做的一个缺点是操作系统会比安装在硬盘上慢得多。这可能会让你对
  Linux 操作系统的速度产生错误的印象。事实恰相反：Linux 比 Windows 快。事实上，如果你因为任何原因遇到了 Windows 操作系统的速度问题，现在可能是尝试
  Linux 的好时候。


  ### Live CD 方法


  如果你采用 Live CD 方法，只需插入 CD 并重启电脑。当电脑启动并显示制造商标志时，你需要按下某个键告诉它从 CD 启动。此键因不同的制造商而异，通常是
  `F2`、`F12` 或 `DEL`。如果你不确定是哪一个，快速按下这几个键即可。其中一个将起作用并显示启动菜单。选择你的 CD 驱动器所在条目。会出现一个带有
  Linux 标志的菜单。选择显示“Ubuntu with Gnome”的选项。这将加载 Linux 操作系统并引导你进入桌面环境。这是你选择要做什么的主界面。还有命令行，我们稍后会介绍。


  如果你从未用过 Linux，你会发现它与其他操作系统不同。然而，在使用桌面界面方面，其概念是相同的。鼠标的工作方式相同——左键选择选项，右键调出菜单，双击打开选项，以此此类推。拖动项目的操作也是一样的。


  ### 默认程序


  Linux 操作系统默认安装了许多程序。你安装操作系统后就可以立即工作，与 Windows 不同，Windows 需要你在处理即使是基本工作之前之前先安装其他程序。你在这里发现的一些程序会让你觉得很熟悉，因为它们可以在不同的平台上运行，而另一些则是专门为
  Linux 操作系统设计的。这些默认程序包括 `Firefox`、`LibreOffice`、`Ubuntu One`、`Thunderbird`、`Movie
  Player`、`Empathy`、`Banshee` 和 `Shotwell` 等。这些程序也是开源的，并执行不同的基本功能，如浏览网页、文字处理、照片管理、备份等，你将在探索它们时会了解到。在用户菜单中，启动系统设置对话框来个性化设置，如壁纸、键盘布局等。


  在此时，你应该玩玩这个操作系统和不同的程序来自己学习，因为在一个指南中不可能涵盖所有的细微细节。不要担心破坏任何东西，因为 Linux 基本上是一个无风险的环境。此外，记住我们是从
  CD 启动的，对硬盘没有进行永久更改。你还应该测试你的硬件以确保一切正常。此时你不需要测试显卡，因为它已经工作正常了。你可能需要测试可能使用的无线网卡。


  ### 安装


  到这里，你对 Linux 操作系统有了初步了解，看到了它是如何工作的（尽管只是小范围内），测试了各种程序，甚至进行了个性化设置。是时候深入学习了。此时，我建议我们将操作系统安装在硬盘上以便良好体验。我希望你已经做了备份，因为现在我们正在对硬盘进行更改。此时的安装过程非常简单。你进入
  live CD 的桌面，然后双击安装。这将引导你进入安装界面，在安装过程中你会遇到一些直观的问题。我只会强调你需要小心的地方。


  在第三个安装界面上，你会得到关于如何安装操作系统的选项。选项包括与现有操作系统一起安装、替换现有操作系统或由你自定义。这是一个非常重要的阶段。对于初学者以及那些希望在某些时刻回退到现有操作系统的人来说，选择第一个选项。这将引导你对包含现有操作系统的驱动进行分区，就像我们把硬盘划分为不同的分区一样。此选项将使两个操作系统对你可用。你将在启动阶段选择使用哪一个。这是此时的最佳选择。





  另一个需要特别注意的安装界面是最后的安全界面。它会要求你输入计算机名称、用户名和密码。请务仔细选择这些信息，尤其是密码，因为它为你的电脑提供了安全保护。屏幕还会提供一个加密主目录的选项。这在有人访问它时可以提供额外的安全保障。


  你现在可以完成安装并重启电脑了。当电脑询问你要从哪个操作系统启动时，请记得选择 Ubuntu 系统。


  ## 第 3 章：导入你的数据


  你的操作系统已准备就绪可以使用。然而，你需要从另一个分区导入数据。要做到这一点，你需要从桌面上启动活动概览（activities overview）。点击底部的文件柜图标启动
  `Nautilus`。这是 Ubuntu 系统的文件管理器。你需要在文件管理器中导航。在窗口左侧，你会发现一个包含书签位置的面板，如 `Home`（主目录）和
  `Downloads`（下载）。在这些位置上方会有一个显示类似于 `250 GB file system` 的条目。（这实际上取决于你分区的大小。）


  ![`www.securitronlinux.com/wp-content/uploads/2012/03/nautilus.png`](img/00001.jpeg)


  这是你其他操作系统和文件所在的分区。然后你可以双击此条目来打开并访问所有的文件和文件夹。为了方便在新操作系统系统中访问，你可能需要将这些文件复制到 Ubuntu
  分区。你可以像在其他操作系统上那样通过普通的复制和粘贴，或者通过拖放来实现。将这些文件和文件夹存储在 Ubuntu 内部适当的位置会更好，例如将文档放在 `Document`
  部分，音乐和图片也放在它们各自的区域。你可能想将它们放在主文件夹中以便更快速访问。这取决于你的喜好。你可以在任何其他时间重新调整这些文件夹。


  这里简单说明一点：如果你经常处理这些文件，那么坚持使用一个操作系统会比在两个安装的操作系统之间切换要好。如果你来回切换，这些文件大部分将处于不同步状态。或者，你也可以在这些文件仍在
  Windows 分区时处理它们。这对比你来说会有点忙碌，因为你每次需要文件时都要通过文件管理器来访问。然而，这样就不会出现同步问题。


  ### 导入你的邮件


  电子邮件是我们日常活动的重要部分。我们几乎所有的在线通信都是通过电子邮件完成的。从 Windows 迁移到 Linux 时，也需要带上你的邮件。你需要完整移动移动邮件配置以实现平滑过渡。你可能在使用不同的邮件客户端；有些是跨平台的，而另一些只运行在一个平台上。`Outlook`
  和 `Express` 是 Windows 特有的，但不用担心；即使这些也可以顺利地迁移到另一个基于 Linux 的邮件客户端。你需要将数据从 Windows
  特有的邮件客户端导入 Windows 上的跨平台客户端，然后将其复制到你的 Linux 操作系统。`Thunderbird` 是 Linux 上非常流行的邮件客户端，我建议我们用它来实现此目的。你需要在
  Windows 上安装 `Thunderbird`，以便将 `Outlook` 设置导入其中。一旦完成此操作，现在就可以轻松从 Windows 上的 `Thunderbird`
  导入到 Linux 上的 `Thunderbird`。你所有的邮件将尽可能保持完整；完全不会丢失任何内容。让我们来看看如何操作。即使你只是在尝试 Linux，知道如何这样做也是很有趣的。


  要将邮件从 `Outlook` 或任何其他邮件客户端导入 Windows 上的 `Thunderbird`，你需要安装 `Thunderbird` 然后启动它。当它询问你是否将其设置为默认电子邮件应用程序时，选择“否”。进入
  `Tools`（工具）并点击 `Import`（导入）。选择 `Mail`（邮件）并点击 `Next`（下一步）。注意，你导入的邮件客户端必须是你的默认邮件。


  ![1e78f7f724ed9295cabef9d653f02e6b-1280168514-828-2.png](img/00002.jpeg)


  在下一个窗口中，选择你要导入的邮件客户端，即 `Outlook` 或 `Express`，然后点击 `Finish`（完成）。这将你的邮件导入到 `Thunderbird`。


  ### 将 Thunderbird 从 Windows 导入 Linux


  我们现在可以将 Windows 上 `Thunderbird` 的设置和数据导入到 Linux  `Thunderbird`。如果你一直在使用 `Thunderbird`，那么从这一步开始。


  进入 `Thunderbird`。在 `File`（文件）中，点击 `Compact Folders`（压缩文件夹）。这一步是必要的但不是必须的；它有助于清理你的邮件文件夹，这样当你迁移时就不会出现邮件计数不正确的问题。


  下一步是在 Windows 上找到配置文件夹。使用命令提示符是最容易的。


  ```

  cd %APPDATA%\\Thunderbird

  ```


  一旦你找到了 `Thunderbird` 配置文件夹，进入 `Profiles`（配置）。在这里，搜索一个随机命名但以 `.default` 结尾的文件夹。拷贝此文件夹：`Thunderbird>Profiles>xxxx.default`（你可以将此文件夹复制到
  Linux 系统中可以轻松访问的分区，或将其复制到移动驱动器上）。


  现在移动到 Linux。`Thunderbird` 将是 Ubuntu 中的默认程序。进入 Linux 的主文件夹并选择 `View > Show Hidden
  Files`（查看 > 显示隐藏文件）。你会发现一个名为 `.mozilla-thunderbird` 的文件夹。打开此文件夹并粘贴从 Windows 复制的配置文件夹。


  为了让邮件在 Linux 中运行，你需要采取的最后一步。在 `Thunderbird` 内部，你需要创建一个名为 `profiles.ini` 的文件。在文件夹中右键创建一个新的文本文件并命名为
  `profiles.ini`。用文本编辑器打开此新文件，粘贴以下内容：


  ```

  [General]

  StartWithLastProfile=1


  [Profile0]

  Name=default

  IsRelative=1

  Path=xxxxxxxx.default

  ```


  将 `xxxxxxxx` 替换为你粘贴的文件夹的实际名称。保存文件并退出，现在启动 `Thunderbird`。你的邮件将像什么都没发生过一样加载，所有的存档都将正常运行。


  对于 Linux 初学者来说，这是一个复杂的过程，但它有助于你理解 Ubuntu 系统的基本原理。实现此点的更简单方法是使用 IMAP 服务器。IMAP 邮件服务器不将邮件存储在硬盘上，而是存储在服务器上，因此你只需要为邮件客户端配置
  IMAP 服务器。IMAP 邮件服务器兼容跨平台的邮件客户端。


  ### 同步你的浏览器


  已安装的程序






  你在 Windows 上安装的大多数程序对你来说都是非常的。你可能经常使用它们，并希望在 Linux 操作系统中仍然保留它们。这里最好的办法是逐一查看你的已程序列表，确保在
  Linux 上也复制了它们。你可以通过检查同一个程序是否有 Linux 版本来实现这一点。就像浏览器一样，许多程序（基于微软的软件除外）都有 Linux 操作系统版本。在程序的网站上确认是否如此。如果你确认有
  Linux 版本，请在存储库中检查并安装它。如果没有 Linux 版本，请查找是否有替代程序。例如，对于 Microsoft Office，你可以使用 Open
  Office 或 LibreOffice，它们在功能上几乎相同。另一个备选方案是 Wine，它是一个旨在在 Linux 上运行为 Windows 设计的应用程序的开源软件。它是一个
  Windows 模拟器。然而，请仅将其作为最后的手段，因为可能会减慢电脑运行速度。如果某个应用程序只能在 Windows 上运行且对你的工作至关重要，由于你安装了双系统，你仍然可以切换
  Windows 系统。


  ## 第 4 章：安装和更新程序


  就像在 Windows 上一样，你需要根据需要安装新软件并更新现有软件。在 Linux 上，这样做比在所有其他操作系统上（包括 Windows）都要容易得多。区别在于，你不需要去第三方网站搜索程序。例如，当你在
  Windows 上需要某个程序时，你必须在网上搜索它。当你获取它时，并不能保证它是正品。事实上，病毒和恶意软件就是通过这种方式传播给毫无防备的用户。在 Linux
  中，情况完全不同。有包含所有程序的软件包存储库（package repositories）。它们存储了该特定发行版的所有可用软件。这里有数千个程序。当你需要操作系统未默认安装的某些软件时，你应该在存储库中搜索，而不是在网上。这大大减少了安装有害程序的概率，因为存储库中找到的所有程序都通过了原始作者的数字签名验证。


  在你的 Ubuntu 系统上，通过概览模式进入软件中心。


  ![`lh5.ggpht.com/_1QSDkzYY2vc/S74ey_fnNpI/AAAAAAAAAy0/EiDC0JE4ivU/s2000/Ubuntu%20Software%20Center_011.png`](img/00003.jpeg)


  在这里，你可以找到一些特色程序，并按各种类别搜索程序。要进一步了解某个程序，点击它以阅读描述、版本详情和评论。如果你想安装它，点击带有“Install”（安装）的按钮。如果你已经安装了该程序，你会看到它被标记了一个勾号。此时将显示“remove”（移除）按钮而不是“install”按钮。


  当你想要更新已安装的程序时，从概览模式启动更新管理器。


  ![`i.stack.imgur.com/KXqwl.png`](img/00004.jpeg) ![`i.stack.imgur.com/Maenw.jpg`](img/00005.jpeg)


  点击检查按钮检查应用程序是否有任何更新。如果你发现了更新，直接安装即可。需要注意的是，Linux 存储库中的程序通常是开源的，你可以直接安装它们，不像 Windows
  那样必须购买某些程序。


  为了理解 Linux 中的包（package）概念以及为什么它让安装软件变得简单，让我带你了解它的工作原理。


  为了让一个程序运行，它通常需要我们安装的软件之外的其他资源。例如，你在安装某些软件时会看到有许多其他文件伴随它。这些文件被程序使用，使其能够按预期方式运行。在
  Ubuntu 中，这些文件以一个名为“包”的文件形式出现。这是程序所需的所有内容，包括名为“安装脚本”的特殊文件，这些脚本将文件复制到它们应该所在的精确位置。某些程序使用与其他程序相同的文件来运行，这些被称为“包依赖”（package
  dependencies）。当开发者指定了包依赖时，对用户来说变得更容易了，因为包的体积会更小，而且你不需要再次安装相同的依赖项。软件包存储库会为你完成这一点。对于你安装的每个程序，它都会检查依赖项，如果依赖项已经安装，你只需要获取程序本身。这避免了文件和程序的重复，使操作系统更轻量、运行更快。


  ## 第 5 章：命令行简介


  命令行是使用户通过被称为“命令”的单词直接与计算机通信的接口。你对计算机需要的任何事情都可以在命令行完成。这是基于 Linux 的系统的强大之处之一。与看起来易用的图形用户界面（GUI）不同，命令行提供了更多与系统交互的选项，以实现你的目标。当使用
  GUI 时，你受限于界面设计以及开发者设想的需要。然而，有时你需要比这更多的功能。某些功能只能通过命令行访问。例如，通过组合命令执行修复或实现某些功能在 GUI
  中是无法完成的。学习命令行在很大程度上解放了你。基于 Linux 的系统的优点是，一旦你学会了其中一个系统的命令行，你就可以使用其他系统，因为命令是相同的。


  命令行是初学者和以前未使用过 Linux 的人最恐惧的方面之一。他们想象它是一个很难学习的东西，只为极客准备的。事实并非如此；命令行是非常容易学习的。正如任何使用它的人都会告诉你，你永远不会在一天内学会所有命令——你会在使用的过程中不断学习。它会变成你的本能，并成为与计算机交互的一种令人兴奋的方式。你将了解计算机是如何工作的，并能轻松控制它。


  命令行界面的另一个优势是它可以节省大量 GUI 使用的资源。如果你的机器运行缓慢，只需关闭 GUI 使用命令行。


  命令行是全文本显示；没有窗口、图像或指针设备。它现在对于许多常见任务并不常见，因为这些任务通过 GUI 完成。然而，命令行对于程序员、开发者，甚至是普通电脑用户来说仍然具有重要性。命令行通常被称为“壳”（shell）。然而，壳是提供命令行的程序。命令行的特点在于，只有当你开始使用它时，你才会发现它的力量和用途。你会发现浏览计算机和完成简单任务变得更容易。


  ### 访问命令行


  为了能够使用命令行，你首先必须访问它。取决于你使用的 Linux 发行版，访问命令行可能会略有不同，但通常是类似的。你需要在图形用户界面中找到终端窗口。它可能出现在系统工具、工具栏、桌面或菜单栏中。为了找到启动命令行提示符的终端，你需要寻找名为
  `Xterm`、`terminal`、`console`、`Konsole` 或类似的程序，具体取决于你的 Linux 发行版。这个图标通常形状像一个计算机屏幕。


  ![`wiki.blender.org/uploads/b/b5/(Doc_26x_Debian_Ubuntu)_(Dash_Terminal_Ubuntu)_(GNV1210FN).png`](img/00006.jpeg)





  你可以通过切换到控制台打开命令行。这是一种纯文本的全屏显示模式，无需使用 GUI 或鼠标。在 GUI 状态下，同时按下 `CTRL`、`ALT` 和 `F1`
  键——GUI 将消失，控制台将会出现。屏幕将变为黑色，除了命令行中的几个字符外。在此屏幕下，若要返回 GUI，只需同时按下 `CTRL`、`ALT` 和 `F8`
  键即可。


  当你打开命令提示符时，它会列出你的计算机名称和用户名。由于 Linux 是多用户操作系统，意味着一个一个用户可以访问并使用系统，因此这一点非常重要。每个用户将有一个主目录，他们可以在那里存储文件。在命令提示符启动时，你需要确保你当前处于哪个目录。


  用户名后面会跟随着一些标点符号，可能是 `$` 或 `#`，然后是一个闪烁的框或光标。`$` 表示你是以普通用户身份登录，而 `#` 表示你是以 `root`
  用户身份登录。除非你想在 root 目录内执行任何管理任务，否则请务必确保你是以普通用户身份登录的。如果你以 `root` 身份登录，你操作的所有目录和文件的权限将发生更改，以
  `root` 为用户。


  ## 第 6 章：运行命令


  命令是以特定的方式编写的。你应该注意，命令行是区分大小写的，这与你可能过的其他命令提示符不同。命令名称中不能有空格。在命令之后，你可以输入一个空格，然后添加一个连字符和另一个名称。这通常被称为选项（option）。它限制或更改命令的执行方式。命令行中使用的单词都是由长词缩写而来的简称。例如，我们使用
  `mv` 代表 move（移动），使用 `ls` 代表 list（列出）。在学习过程中以及在计算机上练习时，你会学习更多这些单词。


  ### 基础命令


  现在让我们来看看 Linux 系统经常使用的基础命令。这些并不是全部命令，但你会经常使用它们。不要费力去背诵这些命令；你用得越多，它们很快就会刻在脑海里。我们还将查看如何让命令实现所需的特定功能。


  ### `pwd` 命令


  这代表当前工作目录（present working directory）。它可以帮助你识别在任何特定时间你处于哪个目录。当你打开终端时，你会进入主目录，但随着你在目录之间切换，这一点会发生变化。它显示你正在操作的目录的名称和完整位置。为了避免混淆，“目录”（directory）通常指的是我们在
  Windows 操作系统常用的文件夹。你需要在提示符中输入 `pwd` 并按回车。


  ![`pad3.whstatic.com/images/thumb/5/5a/Get-Familiar-With-Ubuntu-Commands-Step-1.jpg/670px-Get-Familiar-With-Ubuntu-Commands-Step-1.jpg`](img/00007.jpeg)


  当你第一次打开终端时，不需要使用这个命令，因为你已经在主目录下了。然而，总有一天你需要知道自己身在哪里，因为当前目录的位置和名称并不总是显而易见的。


  ### `ls` 命令


  这是一个常用命令。你用它列出目录的内容。当你单独输入 `ls` 时，将列出该目录中所有对象的名称列表。这包括链接、文件、目录（此文件夹内的文件夹）和图像。


  为了方便识别，你会发现这些对象会经过颜色编码，以便你一眼看出对象的类型。你应当了解的某些基础颜色是：蓝色（目录）、白色（文本文件）、红色（归档文件）、青色（链接）、绿色（可执行文件）和粉色（图像）。


  这些对象不会提供额外信息，仅列出。如果你只想知道对象列表，这些就足够了。然而，你可能需要其中任何一个对象的更多信息。这时我们就使用 `ls` 命令以及其后的一个选项。这个选项通常是一个字母，也可以是一个单词。它跟在命令和空格之后。它指定了你所需的额外信息。你也可以在同一行输入多个选项，以获取关于某个对象的更多信息。这些选项之间不需要输入空格。现在让我们来看示例。


  如果你想知道目录中的所有对象，包括隐藏文件，你将使用选项 `-a`。这些隐藏文件或目录在命令行中、甚至在使用 GUI 时都是不可可见的，除非你指定了它们。按此顺序输入命令和选项：`ls
  -a`。这将显示该目录中的所有对象，包括隐藏文件。


  另一个选项是 `-l`。它提供了目录中对象的详细列表显示（long listing）。它提供了更多信息，例如对象类型（它是图像、链接、文件等吗）、权限（谁可以执行、读取或写入该对象）以及所有者（谁创建了该对象以及创建日期和时间）。所以，将此命令与此选项以及全部选项（如果你想获取所有对象的信息）写在一起，你输入这条命令行：`ls
  -al`。


  ![](img/00008.jpeg)


  ![](img/00009.jpeg)


  第一个字符代表文件类型。例如，在上方显示的行中，`d` 表示这是一个目录。其他值可以是：`-` 普通文件、`s` 套接文件、`l` 链接文件等。


  接下来的九个字符代表权限——`r`-读、`w`-写、`x`-执行。前三个字符代表所有者的权限，中间三个代表组权限，最后三个代表授予他人的权限。在上面的示例中，所有者拥有读、写、执行权限，而组以及其他人都具有读和执行权限。


  你可能希望以易于阅读的格式获取特定目录中对象的大小信息。这是一个非常常用的用法。除了我们已经拥的信息外，如果你添加大小选项（由 `s` 表示），你将获得每个对象以字节为单位的大小。你将拥有命令行：`ls
  -als`。如果你只需要大小选项而不是之前的其他选项，那么删掉它们并仅输入 `ls -s`。


  此命令可以接受参数（arguments）。这是从用户输入的数据，用于指定你希望获取信息的方向。你可以列出任何目录，甚至同时列出多个目录，配合精确指定你从这些目录所需的任何选项。如果你想查看两个目录（即
  `/home` 和 `/bin`）中的对象，你将使用以下命令行：


  ```

  ls -a /bin /home

  ```


  这将显示这两个文件夹中的所有对象，由于使用了选项 `-a`，还包含了隐藏文件。


  注意这些目录前的斜杠；这意味着这些目录是根目录下的标准一级目录。Linux 系统中的根目录包含所有其他目录和子目录。斜杠用于根目录的一级目录，以将它们与可能同名的其他目录区分开。


  `cd` 命令





  这是另一个基础命令。它用于从当前目录导航到你可能需要的另一个目录。根据该目录所在的位置，你需要输入目录名称或目录的完整路径。如果你寻找的目录位于当前所在的目录中，那么你不需要输入整个路径。如果你当前位于
  `/home/john/pictures` 并且想导航到名为 `/home/john/pictures/holiday` 的目录，你只需要在命令行中运行 `cd
  holiday` 命令，它将在 `pictures` 目录中搜索 `holiday` 目录。这被称为相对路径。


  如果你想从当前目录切换到另一个与当前目录不相关的目录，你必须输入整个路径。如果你想要 `bin` 目录，你必须输入完整路径，包括斜杠：`cd /home/bin`


  如果你想切换到根目录，可以使用以下命令：`cd /`


  如果你想回到主目录，不需要输入用户名，只需输入 `cd ~` 即可，这是一个为了节省时间的快捷方式。


  其他快捷方式还有：要切换到树结构中的上一个目录，运行：`cd ..`；或者如果你想切换到上一个工作目录，运行 `cd -`


  ### touch 命令


  此命令用于创建新文件。该命令要求你运行文件名作为参数。如果你想在当前目录下创建一个名为 `practice` 的新文件，只需运行以下命令：


  ```

  touch practice

  ```


  如果你想创建多个文件，可以运行命令并用空格分隔各个文件名：


  ```

  touch practice test log

  ```


  如果你想在当前工作目录之外的目录中创建文件，你需要指定该新位置的完整路径。例如：


  ```

  touch /home/john/practice/test

  ```


  要在新文件中写入任何内容，你需要使用命令行编辑器，我们将在稍后的章节中介绍它。


  ### mkdir 命令


  `mkdir` 的工作方式与 `touch` 命令完全相同，但用于创建目录（文件夹）


  ```

  mkdir dir1 dir2 dir3

  ```


  这将在当前目录下创建三个名为 `dir1`、`dir2` 和 `dir3` 的文件夹。如果参数中已经存在同名的目录，则将不会创建它；此时会显示一个警告提示你，这与
  `touch` 命令不同，`touch` 命令中会创建一个同名的新文件。如果你想在当前目录之外的目录创建文件夹，必须指定完整路径。


  ### rm 命令


  此命令用于删除文件和目录。你使用文件名作为参数。例如，如果你想删除名为 `file1` 的文件，运行以下命令：


  ```

  rm file1

  ```


  这将删除 `file1`。如果你想删除多个文件，请用空格分隔这些名称。


  ```

  rm file1 file2 file3

  ```


  然而，如果你想删除某个目录中的大量文件，这可能会变得非常繁琐，而且不带选项的 `rm` 无法删除整个目录。这里进行此说明是为了预防考虑，因为一旦你运行命令并删除了选定的文件或目录，就几乎无法找回。


  删除多个文件的一种方法是使用通配符。例如，`*` 代表字符串并可以作为通配符使用。使用命令 `rm *` 将删除当前目录下的所有文件。在使用这些通配符时要格外小心，因为你的操作是不可撤销的。命令行的一点是，它假设你清楚自己在做什么；没有你在图形用户界面（GUI）中可能会遇到的确认/警告窗口或其他任何东西。一旦运行命令，预期的结果就会实现。


  如果你想使用通配符仅删除特定目录内的文件，可以在命令中指定。


  ```

  rm dir1/*

  ```


  这将删除 `dir1` 中的所有文件。


  你仍然可以使用通配符进一步指定你想要删除的的确切类型的文件。例如，如果你想删除所有扩展名为 `.html` 的文件，运行以下命令：


  ```bash

  rm *.html

  ```


  然而，在使用此通配符时要非常小心，因为很容易丢失你从未打算丢失的数据。务必花时间确认你正在做什么，如果你不确定，就不要这样做。


  要使用此命令删除整个目录，你必须使用 `r` 选项。这是一种防止意外删除目录中整个文件的保护措施。


  ```bash

  rm -r /home/john/practice/

  ```


  这将删除该目录下的所有子目录和文件，然后移除 `practice` 目录。


  ### rmdir 命令


  此命令用于删除空目录。它与 `rm` 命令非常相似，只是只删除空目录。当你只想删除那些目录时，使用该命令更安全。


  ```

  rmdir dir1 dir2

  ```


  这将删除名为 `dir1` 和 `dir2` 的空目录。这些目录位于我们正在工作的当前目录下。如果不是，请带空目录的完整路径输入命令。


  如果你选择在不用 `r` 选项的情况下删除文件，此命令很有用，这样当你最后剩下空目录时，就可以使用 `rmdir` 删除它们。对于初学者（为了安全起见），如果你担心丢失任何数据会对你产生不利影响，我鼓励你使用这种方法。


  ### cp 命令


  此命令用于复制目录和文件。副本将与原始文件独立。对原始文件的操作不会影响副本。


  ```

  cp name new_name

  ```


  该命令要求你指定要复制的文件或目录以及新目录的名称。默认情况下，`cp` 只复制文件，要复制目录需要使用 `r` 选项。例如，如果你将副本放在不同的目录，可以使用与原始文件相同的名称
  `cp file1 /home/file1`


  你可以通过列出这些文件的名称并指定它们要进入的目录来复制多个文件：


  ```

  cp file1 file2 file3 dir1

  ```


  复制多个文件时，最后一个参数必须是目录。


  ### chmod 命令


  命令用于修改文件权限。它有两种用法：通过字母或数字。我们将查看字母方法，因为它比数字方法更直观。字母方法使用 `+`、`-` 和 `=` 符号来添加、删除或分配权限。字母
  `a` 代表所有，`o` 代表其他，`u` 代表所有者，`g` 代表组。权限为 `r` 代表读取、`w` 代表写入、`x` 代表执行。有了这些信息，我们现在可以理解它是如何工作的。例如：


  ```

  chmod u=rwx file1

  ```


  该命令赋予 `file1` 的所有者 (`u`) 读取(r)、写入(w) 和执行(x) 权限。


  ```

  chmod o+w file1

  ```


  该命令赋予其他人写入权限。


  ```

  chmod g-r file1

  ```


  该命令拒绝组读取文件 1 的权限。


  ```

  chmod a+x somefile

  ```


  该命令赋予所有执行权限。


  ## 第 7 章：


  ## 获取命令行的帮助


  命令行在非常有帮助的同时也具有挑战性。不仅是初学者会遇到挑战，即使是经验丰富的专家也是如此。幸运的是，帮助可以通过命令行即可获得。是的，命令行有手册和信息页，详细解释了不同的命令以及如何运行它们。你还可以使用
  `whatis` 命令，它可以提供对命令的简单解释：


  ```bash

  whatis mv

  ```




  这将返回一个简短的解释，说明 `mv` 是移动（重命名文件）。它的显示内容如下：


  ```

  $ whatis mv


  mv (1) - move (rename) files


  $

  ```


  然而，这些信息对你来说可能还不够，在这种情况下你需要查阅手册。要做到这一点，你需要运行 `man` 命令。你可以运行更具体的命令，如 `man ls`，来了解更多关于列表命令的信息。


  这些信息将以段落形式出现。你将使用空格键来翻页。你对任何命令所需的任何知识都可以在这里找到，包括所有可用选项。当你阅读完毕，可以按 `q` 退出手册。


  命令行的学习非常有趣。我们通过这些命令仅仅触及了冰一角。还有许多其他命令可用。这体现了命令行的力量和灵活性。不要死记硬背这些命令；在需要时使用它们，你会发现记住它们很容易的。


  当你使用命令行时，你是在与你的计算机进行对话。这就像面对面谈。你告诉它你需要让它做什么，它会忠实地响应，不会提问，也不会怀疑你的意图。随着你学习的命令行越来越多，你将体会它是多强大，以及它对开发者和程序员的重要性，因为你不需要依赖
  GUI（图形用户界面），而在大多数情况下，GUI 是非常基础的。


  ## Linux 命令索引


  - `alias`：允许使用预设字符或系列字符启动任何命令或命令组合。

  - `apropos`：显示内置用户手册中所有与查询主题相关的主题列表。

  - `bzip2`：用于压缩和解压缩文件。

  - `cat`：（concatenate 的缩写）对文本文件有三个相关功能：显示文件、合并副本和创建新文件。

  - `cd`：更改目录。

  - `clear`：清除控制台和终端窗口之前的所有命令和输出。

  - `cp`：复制文件和目录。

  - `df`：报告当前挂载文件系统的已用可用空间。

  - `dmesg`：读取内核消息。

  - `du`：显示目录的文件的大小。

  - `fdformat`：对软磁盘进行低级格式化。

  - `file`：对文件系统对象进行分类。

  - `free`：提供未使用和已内存以及交换空间的信息。

  - `grep`：搜索文本。

  - `head`：默认读取文本的前十行。

  - `hostname`：显示或设置计算机的主机名和域名。

  - `kdesu`：打开 KDE su，即 `su` 命令的图形前端。

  - `kill`：终止挂起的进程，而无需注销或重启。

  - `killall`：终止与作为参数提供的程序名称相关的所有进程。

  - `locate`：查找文件和目录。

  - `man`：格式化并显示内置手册页。

  - `mkbootdisk`：创建紧急启动软盘。

  - `mkdir`：创建新目录。

  - `mkfs`：在磁盘或其分区上创建文件系统。

  - `mv`：重命名并移动文件及目录。

  - `ps`：（process status 的缩写）列出当前运行的进程及其进程标识符 (PID)。

  - `pstree`：以树图的形式显示系统上的进程。

  - `pwd`：（present working directory 的缩写）显示当前目录的完整路径。

  - `reboot`：重启计算机而无需关闭并重新开启电源。

  - `rm`：删除指定的文件和目录。

  - `rmdir`：删除指定的空目录。

  - `runlevel`：报告当前和之前的运行级别。

  - `shred`：破坏文件。

  - `spell`：检查拼写。

  - `strings`：返回文件中每个可打印字符字符串。

  - `su`：（substitute user 的缩写）在所有者无需先注销会话的情况下更改会话的所有。

  - `tail`：默认读取文本的最后十行。

  - `tar`：将一组文件转换为归包。

  - `touch`：创建新空文件的简单方法。

  - `tr`：翻译或删除字符。

  - `unalias`：从当前用户的别名列表中删除项。

  - `uname`：提供系统软件和硬件的基本信息。

  - `uptime`：显示当前时间、系统自启动以来运行的时间、当前开启了多少用户会话以及平均负载。

  - `w`：显示谁登录了系统以及他们在做什么。

  - `wc`：默认统计文本中的行数、单词和字符数。

  - `whatis`：提供命令行程序和其他类 Unix 操作系统相关主题的极简短描述。

  - `whereis`：定位任何指定程序的二进制文件、源代码和手册页。

  - `whoami`：返回当前登录会话所有者的用户名。


  ## 第 8 章：使用文本编辑器


  文本编辑器是一种允许用户打开、查看、编辑、更改和存储纯文本的计算机程序。这些通常是字符和数字。然后这些内容会被计算机编码，以便它们对其他程序和用户具有意义。


  除了命令行，Linux 发行版还将包含文本编辑器，你会在很多方面发现它非常有用。就像 Windows 操作系统中有文本编辑器一样，所有的 Linux 发行版也有。掌握使用文本编辑器的基础是非常重要的。编辑器有很多种，但当你理解了如何操作其中一个时，你就能轻松地操作其他的，可能只需要学习几个不同点。文本编辑器与文字处理器非常相似，只是它们更轻量，格式选项较少。它们的功能较少，仅处理文本文件。有些甚至不支持拼写检查和校对。


  许多初学者倾向于忽略文本编辑器的重要性，并且依赖文字处理器进行所有的写作。然而，你很快就会发现，如果你需要在使用计算机方面更加灵活和多变，这个小功能至关重要。在
  Linux 发行版中，文本编辑器甚至更有用。如果你打算编写任何代码，就必须使用文本编辑器。在使用命令行时，文本编辑器将形影相随。命令行和文本编辑器将让你完全独立对
  GUI 的依赖。文本编辑器以纯文本格式保存，因此许多多样的程序都能读取这些文本，而文字处理器的内容只能用另一个文字处理器打开。这是一个巨大的优势，因为它使得纯文本在不同程序和操作系统之间具有高度的可移植性，而无需更改任何内容。


  使用文本编辑器进行日常写作时，非常易用。你不需要学习任何东西；只需输入你想要的文本即可。它没有菜单或结构，也没有格式。这意味着你可以打开任何操作系统，找到文本编辑器，并写下任何你想写的内容。然后你将能够将这些纯文本带到另一个程序或操作系统。你甚至可以使用文本编辑器起草电子邮件，然后发送。


  让我们来看一下 Linux 发行版中最流行的文本编辑器之一。


  ### Vi 编辑器


  这个编辑器几乎几乎所有的 Linux 发行版中。它简单易用（尽管初学者可能不认同），但非常强大。事实上，如果你只是想编写或编辑纯文本，可以尝试使用另一个编辑器。丰富的
  Linux 用户会在编码或编写标记语言时广泛使用 Vi 编辑器。由于它在广泛的发行版可用，学习 Vi 变得非常重要。你可能想在只有精简安装的 Linux 系统或远程服务器上编辑文件；它一定会有
  Vi 文本编辑器。


  `Vim` 是 `Vi` 的新版本。它的意思是改进后的 `Vi`。`Vim` 继承了 `Vi` 的功能，但也增加了一些功能。




  要获取 Vim，既然你现在已经知道如何使用命令行，你应该运行以下命令：


  ```bash

  sudo apt-get install vim

  ```


  ![`www.winterdom.com/weblog/content/binary/WindowsLiveWriter/Wombat_12AFD/VimWombat.png`](img/00010.jpeg)


  ### Vim 编辑器


  Vim 有许多命令，因此人们留下了它很难使用的印象，但这些命令支持广泛的功能，让我们列举几个。


  Vi 编辑器在两种模式下工作：插入模式（insert mode）和视图模式（viewing mode）。插入模式是编辑模式，而视图模式是命令模式。你可以通过按下
  `esc` 键这些模式之间切换。


  - 光标移动—`h`, `j`, `k`, `l`（左、下、上、右）

  - 删除字符—`x`

  - 删除行—`dd`

  - 模式切换—`Esc`, `Insert`（或 `i`）

  - 退出—`:q`

  - 不保存退出—`:q!`

  - 运行 shell 命令—`:sh`（使用 `''exit''` 返回）

  - 保存文件—`:w`

  - 文本搜索—`/`

  - `h` 将光标向左移动一个字符。

  - `j` 将光标向下移动一行。

  - `k` 将光标向上移动一行。

  - `l` 将光标向右移动一个字符。

  - `0` 将光标移动到行首。

  - `$` 将光标移动到行尾。

  - `w`向前移动一个单词。

  - `b` 向后移动一个单词。

  - `G` 移动到文件末尾。

  - `gg` 移动到文件开头。

  - `.` 移动到上次编辑的地方。

  - `v` 一次高亮一个字符。

  - `V` 一次高亮一行。

  - `Ctrl-v` 列高亮。

  - `p` 在当前行之后粘贴文本。

  - `P` 在当前行粘贴文本。

  - `y` 将文本复制到剪贴缓冲区。


  这些命令将帮助你进一步了解这个文本编辑器。当你完成并想保存工作时，按下 esc 键（如果处于插入模式），然后按回车键。光标将出现在屏幕底部。要写入当前所在的文件，输入
  `w`。如果是不同的文件名，使用 `w filename`。


  要退出此编辑器，你需要按下 `q`。如果你还没有保存工作，系统会询问你是否保存。如果你只想退出而不想要此提示，请使用 `q!`。你也可以使用 `zz`，它可以保存并退出。


  VI 和 Vim 是最广泛使用的文本编辑器，我建议你在使用其他编辑器之前先使用 `Vim`。一旦你习惯了使用这个编辑器，你就可以轻松地使用任何其他编辑器而没有任何任何问题。这个编辑器不需要使用鼠标——只需要键盘和屏幕。


  ## 结论


  在这个时代，有成千上万理由你应该学习 Linux。即使你还没有准备好从当前的操作系统切换到基于 Linux 的系统，学习它们的运行方式也是一项实用的技能。最近的调查发现，雇主更倾向于雇用精通
  Linux 发行版的人，因为这表明你灵活灵活且多才。在许多情况下，使用基于 Linux 的系统会更合适。


  Linux 社区也是另一个吸引你的点。有很多 Linux 用户总是渴望为你提供帮助。在大多数情况下，你遇到的任何问题很可能已经在论坛中得到了解决。所以请花点时间，注册一个论坛并浏览对话，以了解更多
  Linux 世界正在发生的事情。当你最终成为高级用户时，请回馈社区，帮助他人。这就是让 Linux 社区变得伟大并成为如此强大力量的原因。


  我们可以列出许多你应该使用 Linux 的理由，但最重要的一点是你有自由实验和尝试新事物。命令行赋予了你巨大的力量来理解和控制你的计算机如何工作、免费软件仓库、多桌面功能、硬件支持、在任何计算机上使用
  Linux、安全性以及与其他系统的互操作性。所有这些原因以及更多原因使得学习并精通 Linux 变得至关重要。


