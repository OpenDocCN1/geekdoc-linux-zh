    # Introduction


    Another major point of departure when comparing Linux and other operating systems
    is the ideological differences. Linux is open source software, meaning it is free.
    Anybody can use it for whatever purpose they wish, modify it, share with the community,
    and study how it works without breaching any regulations. This is very important
    to the Linux community, as there is a difference in opinion regarding whether
    software users ought to be restricted on what they can and cannot do. The freedom
    that the Linux operating system offers is what drives programmers and developers
    to it, since they can play around with it as they seek to innovate.


    In light of that, the Linux OS is not developed by a single person or company.
    It is the product of a massive community that continually develops Linux and other
    programs associated with it for the greater use of humanity. For this reason,
    you need not worry about the different issues we face nowadays of surveillance,
    monitoring, or your online activity being tracked when using Linux and other associated
    open source programs.


    All of these features make the Linux OS appealing to a vast majority of people.
    Even people who have not used Linux before are willing to learn and are only held
    back by the assumption that the learning curve will be stiff. A simple way through
    which Linux is helping humanity is the use of old hardware to run the free Linux
    OS and other open source programs as a very cheap way to get low cost computers
    to developing nations and schools.


    Even if you are not interested in any of the things we have just discussed about
    Linux, it is still worth trying; you might fall in love with it, and if you do
    not, you will have lost nothing, but gained knowledge about a different operating
    system. Let us move on to the next chapter, where we shall discuss installing
    Linux.


    # Chapter 2: Installing Linux


    Since you have decided to learn about the Linux operating system, you need to
    install the OS, since you cannot just learn by reading a guide. You have to do
    it at practically every stage. It is like riding a bike; you have to actually
    get on one and ride. Before we get to the various ways through which you can install
    this OS, you need to have a backup of all the important files on your computer.
    These are especially those in the partition that contains the existing OS. It
    does not mean that Linux will somehow gobble up these files, but it is better
    to have some form of backup in case of anything going wrong. In most instances,
    these files will remain intact, but it is better to be safe than sorry. You can
    back up these files onto a removable hard drive, burn them onto a CD, or back
    them up in the cloud. Make it a habit to back up your files every time – not just
    when installing a new OS.


    There are different versions of Linux available. The most popular one (and most
    suited for a beginner) is Ubuntu. This version of Linux is easy to use, quick
    to understand, and very flexible. It will work just fine and will introduce you
    into the world of Linux in a really gentle way. For a start, we do not have to
    install this OS; we can run it from a CD, and only when we are sure we want it
    should we install it. You will run the entire Linux OS from the CD, and no changes
    will be made to your computer. However, one drawback of doing this is that the
    OS will be far slower than when installed on your hard drive. This might give
    you a wrong impression about the speed of Linux OS. The opposite of this is actually
    true: Linux is faster than Windows. In fact, if you have been experiencing speed
    issues with your Windows OS for any reason, it might be a good time to try out
    Linux.


    ### The Live CD Method


    If you go the Live CD way, just mount the CD and reboot your computer. When your
    computer has started and displayed the manufacturer’s logo, you will need to press
    a certain key to tell it to boot from the CD. This key differs with various manufacturers,
    but it is either `F2`, `F12`, or `DEL`. If you are not sure of which, just quickly
    press all of these. One of these will work and display the boot menu. Select the
    entry that is the location of your CD drive. A menu will come up which will have
    the Linux logo. Select the entry that reads “Ubuntu with Gnome.” This will load
    the Linux OS and lead you to the desktop environment. This is the main interface
    where you will choose what to do. There is also the command line, which we will
    look at later.


    If you have never used Linux before, you will notice that it is different from
    other operating systems. However, the concept is the same when it comes to using
    the desktop interface. The mouse will work in the same way – left-click selects
    options, right-click pulls up a menu, double-clicking opens up an option, and
    so forth. Dragging an item will also work the same.


    ### Default Programs


    The Linux OS has lots of installed programs by default. You can get to work immediately
    after you install the OS, unlike Windows, which will require you to install other
    programs before you can work on even the basic stuff. Some of the programs you
    will find here will be familiar since they can operate on different platforms,
    while others will be specifically for the Linux OS. Some of these default programs
    are `Firefox`, `LibreOffice`, `Ubuntu One`, `Thunderbird`, `Movie Player`, `Empathy`,
    `Banshee`, and `Shotwell`, amongst many others. These programs are open source
    as well and perform different basic functions such as browsing the Internet, word
    processing, photo management, backup, and more, as you will learn when you explore
    them. In the user menu, launch the system settings dialog box to personalize settings
    such as wallpaper, keyboard layout, and others.


    At this point, you should play around with the OS and different programs to learn
    by yourself, since it is not possible to cover all minute details in one guide.
    Do not be afraid of destroying anything, as Linux is basically a risk-free environment.
    Also, remember that we have booted from a CD, and no permanent changes are made
    to your hard drive. You should also test your hardware to make sure everything
    works. You do not need to test the graphics card since it is already working if
    you are at this point. You will need to test the wireless cards you might be using
    with other operating systems.


    ### Installation


    By now, you have had a feel of the Linux OS, seen how it works (albeit in a small
    way), tested various programs, and maybe even done personalization. It is time
    to go deeper. At this point, I suggest we install the OS on the hard drive to
    have a good feel of it. I hope you have done the backup, since now we are making
    changes to the hard drive. The installation process is easy when you are at this
    point. You go to the desktop of the live CD, then double-click install. This will
    lead you to the installation screens, where you will get some straightforward
    questions along the installation progress. I will only highlight where you should
