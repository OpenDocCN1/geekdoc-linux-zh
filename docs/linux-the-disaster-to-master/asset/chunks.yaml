    # 引言


    将 Linux 与其他操作系统进行比较时，另一个主要的区别点是理念上的差异。Linux 是开源软件，这意味着它是免费的。任何人都可以根据意愿将其任何用途、对其进行修改、与社区共享并研究其工作原理，而不会违反任何规定。这对于
    Linux 社区非常重要，因为对于是否应该限制软件用户可以做和不能做的事情，人们存在意见分歧。Linux 操作系统提供的自由是吸引程序员和开发者加入它的动力，因为他们可以在寻求创新的过程中对其进行尝试。


    鉴于此，Linux 操作系统并不是由一个人或一家公司开发的。它是一个庞社区的产物，该社区不断开发 Linux 以及其他相关程序，以造人类更大的利益。因此，在使用
    Linux 和其他相关的开源程序时，你不必担心现在面临的监控、监测或在线活动被追踪等各种问题。


    所有这些特性使得 Linux 操作系统对大多数人都有吸引力。即使是以前未使用过 Linux 的人也愿意学习，他们仅仅受限于对学习曲线可能陡峭的假设。Linux
    帮助人类的一种简单方法是利用旧硬件运行免费的 Linux 操作系统和其他开源程序，为发展中国家和学校提供了一种获取廉价计算机的低成本方式。


    即使你对我们刚刚讨论的关于 Linux 的任何事情都不感兴趣，仍然值得尝试；你可能会爱上它，如果没有，你一无所获，但收获了关于不同操作系统的知识。让我们进入下一章，我们将讨论如何安装
    Linux。


    # 第 2 章：安装 Linux


    既然你已经决定学习 Linux 操作系统，你就需要安装操作系统，因为你不能仅仅通过阅读指南来学习。你必须在几乎每一个阶段都付诸实践。就像骑自行车；你必须真正坐上去骑起来。在我们介绍安装此操作系统的各种方法之前，你需要对电脑上所有重要文件进行备份。特别是那些位于包含现有操作系统的分区中的文件。这并不意味着
    Linux 会以某种方式吞噬这些文件，但为了防止发生意外，保留某种形式的备份会更好。在大多数情况下，这些文件将保持完好无损，但防患胜于治疗治。你可以将这些文件备份到可移动硬盘上、刻录到
    CD 中，或者备份到云端。养成每次都备份文件的习惯——而不仅仅是在安装新操作系统时备份。


    目前有多个版本的 Linux 可供选择。最流行的（最适合初学者的）是 Ubuntu。这个版本的 Linux 易于使用、易理解且非常灵活。它可以运行良好，并以一种非常温和的方式带你进入
    Linux 世界作为一个开始，我们不需要安装这个操作系统；我们可以从 CD 运行它，只有当我们确定想要它时才进行安装。你将从 CD 运行整个 Linux 操作系统，你的电脑不会发生任何更改。然而，这样做的一个缺点是操作系统会比安装在硬盘上慢得多。这可能会让你对
    Linux 操作系统的速度产生错误的印象。事实恰相反：Linux 比 Windows 快。事实上，如果你因为任何原因遇到了 Windows 操作系统的速度问题，现在可能是尝试
    Linux 的好时候。


    ### Live CD 方法


    如果你采用 Live CD 方法，只需插入 CD 并重启电脑。当电脑启动并显示制造商标志时，你需要按下某个键告诉它从 CD 启动。此键因不同的制造商而异，通常是
    `F2`、`F12` 或 `DEL`。如果你不确定是哪一个，快速按下这几个键即可。其中一个将起作用并显示启动菜单。选择你的 CD 驱动器所在条目。会出现一个带有
    Linux 标志的菜单。选择显示“Ubuntu with Gnome”的选项。这将加载 Linux 操作系统并引导你进入桌面环境。这是你选择要做什么的主界面。还有命令行，我们稍后会介绍。


    如果你从未用过 Linux，你会发现它与其他操作系统不同。然而，在使用桌面界面方面，其概念是相同的。鼠标的工作方式相同——左键选择选项，右键调出菜单，双击打开选项，以此此类推。拖动项目的操作也是一样的。


    ### 默认程序


    Linux 操作系统默认安装了许多程序。你安装操作系统后就可以立即工作，与 Windows 不同，Windows 需要你在处理即使是基本工作之前之前先安装其他程序。你在这里发现的一些程序会让你觉得很熟悉，因为它们可以在不同的平台上运行，而另一些则是专门为
    Linux 操作系统设计的。这些默认程序包括 `Firefox`、`LibreOffice`、`Ubuntu One`、`Thunderbird`、`Movie
    Player`、`Empathy`、`Banshee` 和 `Shotwell` 等。这些程序也是开源的，并执行不同的基本功能，如浏览网页、文字处理、照片管理、备份等，你将在探索它们时会了解到。在用户菜单中，启动系统设置对话框来个性化设置，如壁纸、键盘布局等。


    在此时，你应该玩玩这个操作系统和不同的程序来自己学习，因为在一个指南中不可能涵盖所有的细微细节。不要担心破坏任何东西，因为 Linux 基本上是一个无风险的环境。此外，记住我们是从
    CD 启动的，对硬盘没有进行永久更改。你还应该测试你的硬件以确保一切正常。此时你不需要测试显卡，因为它已经工作正常了。你可能需要测试可能使用的无线网卡。


    ### 安装


    到这里，你对 Linux 操作系统有了初步了解，看到了它是如何工作的（尽管只是小范围内），测试了各种程序，甚至进行了个性化设置。是时候深入学习了。此时，我建议我们将操作系统安装在硬盘上以便良好体验。我希望你已经做了备份，因为现在我们正在对硬盘进行更改。此时的安装过程非常简单。你进入
    live CD 的桌面，然后双击安装。这将引导你进入安装界面，在安装过程中你会遇到一些直观的问题。我只会强调你需要小心的地方。


    在第三个安装界面上，你会得到关于如何安装操作系统的选项。选项包括与现有操作系统一起安装、替换现有操作系统或由你自定义。这是一个非常重要的阶段。对于初学者以及那些希望在某些时刻回退到现有操作系统的人来说，选择第一个选项。这将引导你对包含现有操作系统的驱动进行分区，就像我们把硬盘划分为不同的分区一样。此选项将使两个操作系统对你可用。你将在启动阶段选择使用哪一个。这是此时的最佳选择。


    '
- fmt: '

    Another installation screen to pay particular attention to is the security screen
    towards the end. This will be asking for the computer name, username, and password.
    Choose these carefully, especially the password, as it provides security to your
    computer. The screen will also provide an option to encrypt the home directory.
    This provides additional security in case somebody accesses it.


    You can now finish the installation and reboot your computer. Remember to choose
    the Ubuntu OS when the computer asks you which OS to boot from.


    # Chapter 3: Importing Your Data


    Your operating system is ready to use. However, you need to import your data from
    the other partition. To do so, you will need to launch the activities overview
    from your desktop. Select the filing cabinet icon at the bottom to launch `Nautilus`.
    This is the file manager for Ubuntu OS. You need to navigate through the file
    manager. On the left of the window, you will find a panel with bookmarked locations
    such as `Home` and `Downloads`. Above these will be an entry that will read something
    like `250 GB file system`. (This will actually depend on the size of your partition.)


    ![http://www.securitronlinux.com/wp-content/uploads/2012/03/nautilus.png](images/00001.jpeg)


    This is the partition where your other operating system and files are located.
    You will then double-click this entry to open and access all your files and folders.
    For easy access with your new OS, you might need to copy these files to the Ubuntu
    partition. You can do so by copying and pasting the normal way we do on other
    operating systems, or by dragging and dropping. It will be better if you store
    these files and folders in the appropriate location within Ubuntu such that documents
    go to the `Document` section, and music and pictures do the same for their respective
    sections. You might want to place them in the home folder for quicker access.
    It will depend on your preferences. You can rearrange these folders at any other
    time you wish.


    A quick note here: If you work on these files a lot, it will be good if you choose
    to stick to one OS, rather than switch between the two installed OS. If you switch
    around, these files will mostly be out of sync. Alternatively, you could choose
    to work on these files while they are still in the Windows partition. This will
    be a little hectic for you since each time you require a file, you will go through
    the file manager to access it. However, issues of sync will not arise.


    ## Importing your mail


    Emails are an important part of our daily activities. Virtually all of our online
    communication is through emails. While migrating to Windows to Linux, you will
    need to move with your email as well. You need to move your email profile in its
    entirety for a smooth transition. There are different email clients that you might
    be using; some are cross-platform, while others operate on just one platform.
    `Outlook` and `Express` are Windows specific, but do not worry; even these can
    be moved to another Linux-based email client smoothly. You will need to import
    the data from the Windows specific email client to a cross-platform client on
    Windows, and then copy this over to your Linux OS. `Thunderbird` is a very popular
    email client on Linux and I suggest we use it for this purpose. You will have
    to install `Thunderbird` on your Windows to import `Outlook` settings into it.
    Once you do this, it will be easy to import now from `Thunderbird` on Windows
    to `Thunderbird` on Linux. All of your emails will be as intact as they can be;
    nothing will be lost at all. Let us look at how to do this. Even if you are just
    experimenting with Linux, it will be fun to know how to do this.


    To import emails from `Outlook` or any other email client to `Thunderbird` on
    Windows, you need to install `Thunderbird` and then launch it. When it asks you
    whether to make it your default email application, say no. Go to `Tools` and `Import`.
    Select `Mail` and click `Next`. Note that the email client you are importing from
    must be your default mail.


    ![1e78f7f724ed9295cabef9d653f02e6b-1280168514-828-2.png](images/00002.jpeg)


    In the next window, chose the email client you are importing from, either `Outlook`
    or `Express`, and then click `Finish`. This will have imported your mail to `Thunderbird`.


    ## Importing Thunderbird from Windows to Linux


    We can now go ahead and import these settings and data from `Thunderbird` on Windows
    to `Thunderbird` on Linux. If you have been using `Thunderbird`, then you start
    from this point.


    Go to `Thunderbird`. On `File`, click `Compact Folders`. This move is essential
    but not a must; it helps in cleaning up your mail folders so that when you migrate,
    you do not have issues with incorrect email counts.


    The next step is to locate the profile folder on Windows. It is easiest located
    using the command prompt.


    ```

    cd %APPDATA%\\Thunderbird

    ```


    Once you have found the profile folder `Thunderbird`, go to `Profiles`. While
    here, search for a folder which will be randomly named but will end with `.default`.
    Copy this folder: `Thunderbird>Profiles>xxxx.default` (you can copy this folder
    in a partition that you can access easily in your Linux OS or copy it to a removable
    drive.)


    Move over to Linux now. `Thunderbird` will be a default program in Ubuntu. Go
    to the home folder on Linux and choose `View > Show Hidden Files`. You will find
    a folder named `.mozilla-thunderbird`. Open this folder and paste the copied profile
    folder from Windows.


    The last step you need to take to get your mail up and running in Linux. Inside
    `Thunderbird`, you need to make a file called `profiles.ini`. Do a right-click
    and create a new text file in the folder, and name it `profiles.ini`. Open up
    this new file in a text editor, and paste in the following:


    ```

    [General]

    StartWithLastProfile=1


    [Profile0]

    Name=default

    IsRelative=1

    Path=xxxxxxxx.default

    ```


    Replace `xxxxxxxx` with the real name of profile folder you pasted. Save the file
    and quit, and now launch `Thunderbird`. Your email should load up as if nothing
    has happened, and all your archives should be up and rolling.


    This is a hectic process for a beginner in Linux, but it will help you understand
    the basic working of the Ubuntu OS. A simpler way to do this would be using an
    IMAP server. IMAP mail servers do not store your emails on your hard drive, but
    rather on a server, so all you need is to configure your mail client with IMAP
    server. IMAP mail servers are compatible with multiple email clients across different
    platforms.


    ## Synchronizing your browser


    For a seamless browsing experience, you need to sync your browser so that you
    can just continue where you left off on the new platform. Today, this is easy,
    as all major browsers are on both Windows and Linux systems. You need to ensure
    that you sync your data on your current browser, and when you launch it on Ubuntu,
    all your data will be available including bookmarks, cookies, history, app, extensions,
    and passwords. If you are using `Chrome`, you need to sign in using your `Gmail`
    account and then go to `Menu`, click `Settings`, then `Advanced Settings` and
    sync the information you want to migrate. Note that this information will still
    be available in Windows and anything else you do on Linux will automatically sync,
    so no matter the OS you choose to use, your browsing experience will be seamless.
    `Chrome`, `Opera`, `Mini`, and `Mozilla` will be found in the Ubuntu repositories
    ready to be downloaded.


    Installed programs

