- fmt: '

    To get Vim, and now that you know how to use the command line, you should run
    the following command:


    ```bash

    sudo apt-get install vim

    ```


    ![http://www.winterdom.com/weblog/content/binary/WindowsLiveWriter/Wombat_12AFD/VimWombat.png](images/00010.jpeg)


    # Vim editor


    Vim has so many commands, thus the impression that it is difficult to use, but
    these support a wide range of functionality, lets list a few of these.


    The Vi editor works in two modes: the insert mode and the viewing mode. The insert
    mode is the editing mode, while the viewing mode is the command mode. You can
    toggle through these modes by pressing the `esc` key.


    - Cursor movement—`h`, `j`, `k`, `l` (left, down, up, and right)

    - Delete character—`x`

    - Delete line—`dd`

    - Mode toggle—`Esc`, `Insert` (or `i`)

    - Quit—`:q`

    - Quit without saving—`:q!`

    - Run a shell command—`:sh` (use `''exit''` to return)

    - Save file—`:w`

    - Text search—`/`

    - `h` moves the cursor one character to the left.

    - `j` moves the cursor down one line.

    - `k` moves the cursor up one line.

    - `l` moves the cursor one character to the right.

    - `0` moves the cursor to the beginning of the line.

    - `$` moves the cursor to the end of the line.

    - `w` move forward one word.

    - `b` move backward one word.

    - `G` move to the end of the file.

    - `gg` move to the beginning of the file.

    - `.` move to the last edit.

    - `v` highlight one character at a time.

    - `V` highlight one line at a time.

    - `Ctrl-v` highlight by columns.

    - `p` paste text after the current line.

    - `P` paste text on the current line.

    - `y` yank text into the copy buffer.


    These commands will help you learn more about this text editor. When you are done
    and you want to save your work, you will hit escape, if in insert mode, and then
    enter. A cursor will appear at the end of the screen. To write the file you are
    currently on, enter `w`. If it is a different filename, use `w filename`.


    To quit from this editor, you need to hit `q`. You will be asked to save if you
    have not already saved your work. If you just want to quit without this reminder,
    use `q!`. You could also use `zz`, which saves and exits.


    VI and Vim are the most widely used text editors, I would suggest to you to first
    use `Vim` before using other text editors. Once you get to work with this editor,
    you can comfortably use any other editor without any trouble. This editor does
    not require you use the mouse – just the keyboard and the screen.


    # Conclusion


    There are thousands of reasons why you should learn Linux in this age. Even if
    you are not yet ready to make the switch from your current operating system to
    Linux-based systems, learning how they operate is a useful skill. A recent survey
    found out that employers are more likely to hire someone conversant with Linux-based
    distributions since it shows that you are flexible and versatile. There are many
    instances where using a Linux-based system will be more appropriate.


    The Linux community is also another thing which should attract you. There are
    many Linux users always eager to help you out. In most cases, any issue you encounter
    will most likely have been resolved in the forums. So take your time, sign up
    in a forum and go through the conversations to learn more about what is happening
    in the Linux world. When you finally become an advanced user, give back to the
    community be helping others. This is what makes the Linux community great and
    such a big force.


    We can list many reasons why you should be using Linux, but the most important
    is the fact that you have the freedom to experiment and try out new things. The
    command line gives you so much power to understand and control how your computer
    works, the free software repositories, the multiple desktop feature, the hardware
    support, using Linux on any computer, security, and interoperability with other
    systems. All these reasons and many more make it essential to learn and be conversant
    with Linux.


    Thank you again for downloading this book!


    I hope this book was able to help you with Linux and the command line. If you
    liked this book, please check out my other books on the next few pages.


    Finally, if you enjoyed this book and it was able to help you, please take the
    time to help me by sharing your thoughts and posting a review on Amazon. It would
    be greatly appreciated!


    # Check out my other books


    [Beginning of Excerpt] Raspberry PI 2: The Disaster To Master Step By Step User
    Guide


    The new Raspberry Pi 2 is able to run a wider range of the ARM GNU/Linux distributions,
    the Microsoft 10 I0T, and the snappy Ubuntu core due to the change in the architecture
    from the `ARMv6` instruction set to the `ARMv7` and advancements in the processor
    speed and memory. We shall be looking at these operating systems in more detail
    and how to install them.


    The Raspberry Pi 2 is fully backwards compatible with the `Pi 1` and all the projects,
    software, and hardware that were used on the `Pi 1`. It is able to integrate all
    the projects that were on `Pi 1`, but it performs at a higher level due to the
    increased power. This ensures a seamless transition for those willing to upgrade.
    It has a complete identical form factor to its predecessor, even after managing
    to pack much higher power. All connectors are in the same place, retaining the
    same functionality. This means that any case or third party board add-ons you
    were using before will still fit the new Pi 2. The circuit board is still run
    from the 5V micro power adapter.


    One thing that the Raspberry foundation should be commended for is sticking with
    the same price even with the added power. In fact, they have been responsible
    for bringing down the prices of embedded computers on the market. Before `Pi 1`,
    it was not possible to find them at prices any lower than $100. This has enabled
    more enthusiastic programmers, hobbyists, and students to try out their coding
    skills on an inexpensive platform.


    To demonstrate the increased performance of `Pi 2` over the previous models, the
    Raspberry foundation created a quick test using a `Python` script that calculates
    the approximation of Pi’s speed then displays it in visual form in the popular
    Minecraft game. The `Pi 1` used 47 seconds to complete this calculation, while
    the `Pi 2` used just three seconds. The quad-core processor is that fast. However,
    the speed will also depend on whether you have optimized your `Pi 2` to run multithreaded,
    which we will be looking at later. No matter how you use Raspberry, you will notice
    a bump in performance once you upgrade to the `Pi 2`.


    With all the added power and functionality it brings, the `Pi 2` is the one thing
    you should have. The extra flexibility over previous models that allows you to
    install and run a wider range of operating systems, including Windows 10 IoT operating
    system for builders and creators, will make it more popular with all it can do.


    [End of Excerpt] If you enjoyed this portion you can grab your copy in the link
    on the next page.


    [![](images/00011.jpeg)](http://amzn.to/1VDt3Gp)

