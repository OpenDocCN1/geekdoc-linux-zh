    The command line is pretty interesting to learn. We have just scratched the surface
    with these commands. There are numerous ore commands available. This manifests
    the power and flexibility of the command line. Do not memorize these commands;
    just use them as you need them and you will find it easy to remember them.


    When you use the command line, you get into a conversation with your computer.
    It is like a face-to-face talk. You tell it what it is you require it to do and
    it responds faithfully without questioning and without doubting your intentions.
    As you learn more of the command line, you will come to appreciate how powerful
    it is and its importance to developers and programmers, as you do not have to
    rely on the GUI which, in most cases, is very basic.


    # Index of Linux Commands


    - `alias`: allows launching of any command or combination of commands by using
    a preset character or series of characters.

    - `apropos`: displays a list of all topics in the built-in user manual that are
    related to the subject of a query.

    - `bzip2`: used for compressing and decompress files.

    - `cat`: (short for concatenate) has three related functions with regard to text
    files: displaying them, combining copies of them and creating new ones.

    - `cd`: changes directories.

    - `clear`: removes all previous commands and output from consoles and terminal
    windows.

    - `cp`: copies files and directories.

    - `df`: reports the amount of space used and available on currently mounted file
    systems.

    - `dmesg`: reads the kernel messages.

    - `du`: shows the sizes of directories and files.

    - `fdformat`: performs low-level formatting of floppy disks.

    - `file`: classifies file system objects.

    - `free`: provides information about unused and used memory and swap space.

    - `grep`: searches text.

    - `head`: by default reads the first ten lines of text.

    - `hostname`: shows or sets a computer''s host name and domain name.

    - `kdesu`: opens KDE su, the graphical front end for the `su` command.

    - `kill`: terminates stalled processes without having to log out or reboot.

    - `killall`: terminates all processes associated with programs whose names are
    provided to it as arguments.

    - `locate`: finds files and directories.

    - `man`: formats and displays the built-in manual pages.

    - `mkbootdisk`: creates an emergency boot floppy.

    - `mkdir`: creates new directories.

    - `mkfs`: creates a file system on a disk or on a partition thereof.

    - `mv`: renames and moves files and directories.

    - `ps`: (short for process status) lists the currently running processes and their
    process identification numbers (PIDs).

    - `pstree`: displays the processes on the system in the form of a tree diagram.

    - `pwd`: (short for present working directory) displays the full path to the current
    directory.

    - `reboot`: restarts a computer without having to turn the power off and back
    on.

    - `rm`: deletes the specified files and directories.

    - `rmdir`: deletes the specified empty directories.

    - `runlevel`: reports the current and previous runlevels.

    - `shred`: destroys files.

    - `spell`: checks spelling.

    - `strings`: returns each string of printable characters in files.

    - `su`: (short for substitute user) changes a login session''s owner without the
    owner having to first log out of that session.

    - `tail`: by default reads the final ten lines of text.

    - `tar`: converts a group of files into an archive.

    - `touch`: the easiest way to create new, empty files.

    - `tr`: translates or deletes characters.

    - `unalias`: removes entries from the current user''s list of aliases.

    - `uname`: provides basic information about a system''s software and hardware.

    - `uptime`: shows the current time, how long the system has been running since
    it was booted up, how many user sessions are currently open, and the load averages.

    - `w`: shows who is logged into the system and what they are doing.

    - `wc`: by default counts the number of lines, words and characters that are contained
    in text.

    - `whatis`: provides very brief descriptions of command line programs and other
    topics related to Unix-like operating systems.

    - `whereis`: locates the binary, source code, and man page for any specified program.

    - `whoami`: returns the user name of the owner of the current login session.


    # Chapter 8: Using a Text Editor


    A text editor is a computer program that allows the user to open, view, edit,
    change, and store plain text. These are usually characters and numbers. These
    are then encoded by the computer so that they can have a meaning to other programs
    and users.


    Along with the command line, Linux distributions will include a text editor, which
    you will find very useful in a number of ways. Just like on Windows OS where we
    have text editors, all Linux distributions will have one, too. It is very important
    to get the basics behind using the text editor. There are so many of these editors,
    but when you understand working on one, you will be comfortable navigating the
    others, maybe just a few different things to learn. Text editors are very similar
    to word processors only they are lighter with few formatting options. They have
    fewer features and work only with text files. Some of them do not even support
    spell checking and proofreading.


    Many beginners tend to overlook the importance of the text editor and will often
    rely on the word processors for all their writing. However, you will soon learn
    that this little feature is vital if you need to be a little flexible and versatile
    in how you use your computer. In Linux distributions, the text editor is even
    more useful. If you are going to write any code, you’ll have to use the text editor.
    When using the command line, the text editor will go hand in hand. The command
    line and the text editor will set you to total independence from the GUI. A text
    editor will save in plain text so that many diverse programs are able to read
    the text unlike word processors whose content can only be opened with another
    word processor. This is a great benefit as it makes the plain text highly portable
    across programs and operating systems without needing to change anything.


    When using the text editor to do your normal writing, it is very easy to use.
    You do not have to learn anything; just input the text you want and that is it.
    There are no menus or structures, and no formatting. This means you can open up
    any operating system, find the text editor, and just write whatever you want to
    write. You will then be able to carry on the plain text to another program or
    OS. You can even use the text editor to draft an email, and then send.


    Let us look at one of the most popular text editors on Linux distributions.


    ## Vi editor


    This editor is found in almost all Linux distributions. It is simple to use, though
    beginners might disagree, but very powerful. In fact, if you just want to write
    or edit plain text, you may try using another editor. Experienced Linux users
    will use the Vi editor extensively in their coding or writing markup language.
    Due to its availability in a wide range of distributions, learning Vi becomes
    very important. You may want to edit files in a Linux system or a remote server
    with a minimal install; it will definitely have Vi text editor.


    `Vim` is the newer version of `Vi`. It means `Vi` improved. `Vim` inherits features
    of `Vi` but also adds some functionality.

