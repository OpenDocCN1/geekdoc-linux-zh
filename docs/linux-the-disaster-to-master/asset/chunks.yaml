    Most of the programs you have installed on Windows will be important to you. You
    probably use them regularly and want them on the Linux OS still. The best thing
    here is to go to your list of installed programs one by one make sure you replicate
    them on Linux. You can do this by checking if the same program is available for
    Linux. Just like the browsers, many programs (except the Microsoft-based ones)
    will be available for the Linux operating systems. Check on the program’s website
    if this is the case. If you confirm there is a version for Linux, check it out
    in the repository and install it. In case there is no version for Linux, check
    for an equivalent program. For instance, for Microsoft Office, you could use Open
    Office or LibreOffice, which are almost the same in terms of functionality. There
    is another alternative, Wine, which is an open source software designed to run
    applications designed for Windows on Linux. It is a Windows emulator. However,
    use this only as a last resort, as it can slow down your computer. You can still
    switch to the Windows OS if you have dual installation if the application is only
    run on Windows and is essential for your work.


    # Chapter 4: Installing and Updating Programs


    Just like on Windows, you need to install new software as need arises and to update
    existing software. On Linux, its way easier to do this than on all other operating
    systems – Windows included. The difference is that you do not need to go to third
    party sites to search for programs. For instance, when you need a certain program
    on Windows, you will have to search for it online. When you get it, there is no
    guarantee that it will be the real thing. In fact, viruses and malware have been
    spread in this manner to unsuspecting users. In Linux, this is completely different.
    There are package repositories where all programs are found. They store all the
    software available for that specific distribution. These are thousands of programs.
    When you require certain software not installed by default with your OS, you search
    for it in the repository rather than on the Web. This greatly reduces the chance
    of installing a harmful program, since all programs found in the repositories
    have been verified through digital signatures from the original author.


    On your Ubuntu OS, go to the software center through the overview mode.


    ![http://lh5.ggpht.com/_1QSDkzYY2vc/S74ey_fnNpI/AAAAAAAAAy0/EiDC0JE4ivU/s2000/Ubuntu%20Software%20Center_011.png](images/00003.jpeg)


    While here, you find some featured programs, and you can search for a program
    by various categories. To get to know more about a program, click on it to read
    the description, version details, and reviews. If you want to install it, click
    on the button that says Install. If you have already installed the program, you
    will see it marked with a tick. This will have a remove button rather than an
    install button.


    When you want to update installed programs, you launch the update manager from
    the overview mode.


    ![http://i.stack.imgur.com/KXqwl.png](images/00004.jpeg) ![http://i.stack.imgur.com/Maenw.jpg](images/00005.jpeg)


    Click on the check button to check for any updates to your applications. If you
    find any, just install them. It is important to note that programs found in the
    Linux repositories are open source, and you can just install them unlike Windows,
    where you have to purchase some programs.


    To understand the package concept in Linux and why it makes it easy to install
    software, let me take you through how it works.


    For a program to work, it will often need other resources other than the software
    we install. For instance, you have seen when installing certain software that
    many other files accompany it. These are used by the program to enable it to function
    as intended. In Ubuntu, these files come as one file called a package. This is
    everything the program needs, including special files called installation scripts
    that copy the files to the exact location they should be. Some programs will use
    the same files as others to function. These are called package dependencies. When
    developers specify the package dependencies, it becomes easier for the users since
    the package will be made smaller and you will not have to install the same dependences
    once more. The package repository does this for you. For every program you install,
    it will check on the dependencies and if they are already installed, you will
    just have the program. This avoids duplication of files and programs, making the
    OS lighter and faster.


    # Chapter 5: Introduction to the Command Line


    The command line is the interface that enables users to communicate directly with
    the computer using words referred to as commands. Everything that you need to
    do with a computer can be done on the command line. This is one of the great strengths
    of Linux-based systems. Unlike using the Graphical User Interface which appears
    easy to use, the command line offers more options to interact with the system
    to accomplish what you want done. When using the GUI, you are limited to the design
    of the interface and what the developer envisioned would be your needs. However,
    at times, you need more functionality than this. Some functions can only be accessed
    through the command line. For instance, performing repairs or achieving a function
    through a combination of commands cannot be done in the GUI. Learning the command
    line liberates you in a great way. The good thing with Linux-based systems is
    that once you learn the command line in one of them, you can use any other because
    the commands are the same.


    The command line is one of the most feared aspects of Linux by beginners and people
    who have not used Linux before. They imagine it as a hard thing to learn, only
    reserved for the geeks. This is not the case; the command line is something very
    easy to learn. Like anybody who uses it will tell you, you never learn all the
    commands in one day – you learn day and day as you continue to use it. It becomes
    second nature to you and a very exciting way to interact with your computer. You
    learn how the computer works and you can control different aspects of it with
    ease.


    Another great strength of the command line interface is that it saves a lot of
    resources that the GUI uses. If your machine is running slow, just close the GUI
    and use the command line.


    The command line is an all text display; there are no windows, images, or pointing
    devices. It is not very common today for many common tasks, as these are done
    through the GUI. However, the command line still maintains a lot of importance
    not only to programmers and developers, but also to the average computer user.
    The command line is often referred to as the shell. However, the shell is the
    program that provides the command line. The thing with the command line is that
    you only appreciate its power and usefulness once you start using it. You find
    it easier to navigate through your computer and complete simple tasks.


    ## Accessing the command line


    To be able to use the command line, you have first to access it. Depending on
    the Linux distribution you are using, accessing the command line will be slightly
    different, but it is generally similar in all the distributions. You need to locate
    the terminal window in the Graphical User Interface. It can appear in the system
    tools, the toolbar, the desktop, or the menu line. To locate the terminal, which
    will allow you to launch the command prompt, you need to look for a program called
    `Xterm`, `terminal`, `console`, `Konsole`, or something similar to these depending
    on your Linux distribution. This icon is usually shaped as a computer screen.
    It will appear as an icon or a small image.


    ![http://wiki.blender.org/uploads/b/b5/(Doc_26x_Debian_Ubuntu)_(Dash_Terminal_Ubuntu)_(GNV1210FN).png](images/00006.jpeg)

