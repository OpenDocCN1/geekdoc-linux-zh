- fmt: '

    You can open the command line by switching to a console. This is a display mode
    of the entire screen in text only without using the GUI or the mouse. Press the
    `CRTL`, `ALT`, and `F1` keys while in GUI – the GUI disappears and the console
    appears. The screen will become black save for a few characters which are part
    of the command line. To get back to the GUI while at this screen, just press the
    `CTRL`, `ALT`, and `F8` keys simultaneously.


    When you open the command prompt, it will list your computer name and your username.
    Since Linux is a multi-user OS, meaning more than one user can access and use
    the system, this is very important. Each user will have access to a home directory
    where they can store their files. When starting on the command prompt, you need
    to make sure which directory you are in.


    The username will be followed by some punctuation marks, either `$` or `#`, then
    a blinking box or a cursor. `$` means that you are logged in as a regular user,
    while `#` means you are logged in as `root`. Always make sure you are logged in
    as a regular user unless you would like to perform any administrative tasks inside
    root directories. If you log in as a `root`, all directories and files you work
    in will change permissions to make the `root` as the user.


    # Chapter 6: Running Commands


    Commands are written in a specific way. You should note that the command line
    is case sensitive, unlike in other command prompts you may have used. The command
    should be typed with no spaces in the name. After the command, you can put a space
    then add a dash and another name. This is usually called an option. It limits
    or changes the way the command is executed. Most of the words used in the command
    line are shorthand words that are abbreviated from the longer word. For instance,
    we use `mv` for move and `lt` for list. You will learn more of these words along
    the way and as you practice them on your computer.


    ## Basic commands


    Now let us look at basic commands regularly used on the Linux systems. These are
    not the only commands, but you will use them often. Do not struggle to memorize
    these commands; they will soon stick in your head the more you use them. We shall
    also be looking at how to get the command to a certain function you need.


    ### The `pwd` command


    This stands for the present working directory. It helps you identify which directory
    you are in at any particular time. When you open the terminal, you get to the
    home directory, but this changes as you switch around directories. It shows the
    name and complete location of the current directory you are working on. Just to
    avoid confusion, “directory” will mostly refer to the folder we normally use in
    the Windows operating system. You will need to type `pwd` in the prompt and press
    enter.


    ![http://pad3.whstatic.com/images/thumb/5/5a/Get-Familiar-With-Ubuntu-Commands-Step-1.jpg/670px-Get-Familiar-With-Ubuntu-Commands-Step-1.jpg](images/00007.jpeg)


    You will not need to use this command when you first open your terminal, as you
    will already be in the home directory. However, there will come a time when you
    will need to know where you are, since the location and name of the present directory
    are not always obvious.


    ### The `ls` command


    This is a common command. You use it to list the contents of a directory. When
    you type `ls` alone, you will be presented with a list of names of all the objects
    in that directory. This will include links, files, directories (folders within
    this folder), and images.


    To enable easier identification, you will notice that these objects will be color
    coded so that you can tell the type of object at a glance. Some of the basic colors
    that you should know are: Blue (Directories), White (Text files), Red (Archives),
    Cyan (Links), Green (Executables), and Pink (Images).


    There will be no additional information provided for these objects, just the listing.
    If you just wanted to know the list of objects, this will be enough. However,
    you might require more information on any of these objects. That is where we use
    the command `ls` and an option besides it. This option will mostly be a letter,
    but also can be a word. It will follow the command and a space. It specifies the
    additional information you require. You can also input multiple options on the
    same line to get even more information about an object. You will not require inputting
    a space between these options. Let us now look at examples.


    If you want to know all the objects in a directory, including hidden files, you
    will use the option `-a`. These hidden files or directories cannot be seen in
    the command line or even when using the GUI unless you specify this. Type the
    command and the option in this sequence: `ls -a`. This will display all the objects
    in that directory, including the hidden files.


    Another option is `-l`. This provides a long listing of the object in the directory.
    It provides more information such as type of object (is it an image, link, file,
    etc.), permissions (who can execute, read, or write this object), and owner (who
    created this object and the date and time of creation). So, to write this command
    together with this option and the all option (if you want to get information about
    all the objects), you input this command line: `ls -al`.


    ![](images/00008.jpeg)


    ![](images/00009.jpeg)


    The first character represents the file type. For example, in the line shown above,
    `d` indicates this is a directory. Other values can be: `-` for normal file, `s`
    for socket file, `l` for link file, and more.


    The next nine characters represent permissions -- `r` - read, `w` - write, `x`
    - execute. The first set of three characters represents the owner’s permission,
    the next three are a group''s permission, and the final three represent permissions
    granted to others. In the example shown above, the owner has read, write, and
    execute permissions, while the group, as well as others, both have read and execute
    permissions.


    You might want to get information regarding the size of these objects in a certain
    directory in an easily readable format. This is a very common use. Besides the
    information we already have, if you add the option of size (which is denoted by
    `s`), you will get the size in kilobytes for each object. You will have this command
    line: `ls -als`. If you just require the option of size and not the other previous
    options, then you drop them and just input `ls -s`.


    This command can accept arguments. This is input data from the user to specify
    the direction from which you desire to get information. You can list any directory
    and even more than one together with any option that specifies exactly what you
    require from those directories. If you want to see objects in two directories,
    namely `/home` and `/bin`, you will use the following command line:


    ```

    ls -a /bin /home

    ```


    This will display all the objects in these two folders, including the hidden files
    due to the option `-a`.


    Notice the forward slash before these directories; it means that these directories
    are standard first-tier directories in the root directory. The root directory
    in a Linux system contains all other directories and sub-directories. The forward
    slash is used in the first-tier directories from the root directory to differentiate
    them from any other directories that may have the same name.


    The `cd` command

