    要获取 Vim，既然你现在已经知道如何使用命令行，你应该运行以下命令：


    ```bash

    sudo apt-get install vim

    ```


    ![`www.winterdom.com/weblog/content/binary/WindowsLiveWriter/Wombat_12AFD/VimWombat.png`](img/00010.jpeg)


    # Vim 编辑器


    Vim 有许多命令，因此人们留下了它很难使用的印象，但这些命令支持广泛的功能，让我们列举几个。


    Vi 编辑器在两种模式下工作：插入模式（insert mode）和视图模式（viewing mode）。插入模式是编辑模式，而视图模式是命令模式。你可以通过按下
    `esc` 键这些模式之间切换。


    - 光标移动—`h`, `j`, `k`, `l`（左、下、上、右）

    - 删除字符—`x`

    - 删除行—`dd`

    - 模式切换—`Esc`, `Insert`（或 `i`）

    - 退出—`:q`

    - 不保存退出—`:q!`

    - 运行 shell 命令—`:sh`（使用 `''exit''` 返回）

    - 保存文件—`:w`

    - 文本搜索—`/`

    - `h` 将光标向左移动一个字符。

    - `j` 将光标向下移动一行。

    - `k` 将光标向上移动一行。

    - `l` 将光标向右移动一个字符。

    - `0` 将光标移动到行首。

    - `$` 将光标移动到行尾。

    - `w`向前移动一个单词。

    - `b` 向后移动一个单词。

    - `G` 移动到文件末尾。

    - `gg` 移动到文件开头。

    - `.` 移动到上次编辑的地方。

    - `v` 一次高亮一个字符。

    - `V` 一次高亮一行。

    - `Ctrl-v` 列高亮。

    - `p` 在当前行之后粘贴文本。

    - `P` 在当前行粘贴文本。

    - `y` 将文本复制到剪贴缓冲区。


    这些命令将帮助你进一步了解这个文本编辑器。当你完成并想保存工作时，按下 esc 键（如果处于插入模式），然后按回车键。光标将出现在屏幕底部。要写入当前所在的文件，输入
    `w`。如果是不同的文件名，使用 `w filename`。


    要退出此编辑器，你需要按下 `q`。如果你还没有保存工作，系统会询问你是否保存。如果你只想退出而不想要此提示，请使用 `q!`。你也可以使用 `zz`，它可以保存并退出。


    VI 和 Vim 是最广泛使用的文本编辑器，我建议你在使用其他编辑器之前先使用 `Vim`。一旦你习惯了使用这个编辑器，你就可以轻松地使用任何其他编辑器而没有任何任何问题。这个编辑器不需要使用鼠标——只需要键盘和屏幕。


    # 结论


    在这个时代，有成千上万理由你应该学习 Linux。即使你还没有准备好从当前的操作系统切换到基于 Linux 的系统，学习它们的运行方式也是一项实用的技能。最近的调查发现，雇主更倾向于雇用精通
    Linux 发行版的人，因为这表明你灵活灵活且多才。在许多情况下，使用基于 Linux 的系统会更合适。


    Linux 社区也是另一个吸引你的点。有很多 Linux 用户总是渴望为你提供帮助。在大多数情况下，你遇到的任何问题很可能已经在论坛中得到了解决。所以请花点时间，注册一个论坛并浏览对话，以了解更多
    Linux 世界正在发生的事情。当你最终成为高级用户时，请回馈社区，帮助他人。这就是让 Linux 社区变得伟大并成为如此强大力量的原因。


    我们可以列出许多你应该使用 Linux 的理由，但最重要的一点是你有自由实验和尝试新事物。命令行赋予了你巨大的力量来理解和控制你的计算机如何工作、免费软件仓库、多桌面功能、硬件支持、在任何计算机上使用
    Linux、安全性以及与其他系统的互操作性。所有这些原因以及更多原因使得学习并精通 Linux 变得至关重要。


    再次感谢你下载这本书！


    我希望这本书能够帮助你学习 Linux 和命令行。如果你喜欢这本书，请查阅接下来的几页中我的我的其他书籍。


    最后，如果你喜欢这本书并且它对你有所帮助，请花时间通过分享你的想法并在 Amazon 上发表评论来帮助我。我将不胜感激！


    # 查阅我的其他书籍


    [节选开始] Raspberry PI 2: 逐步掌握的灾难之路用户指南


    由于架构从 `ARMv6` 指令集 变为 `ARMv7`，以及处理器速度和内存的进步，新的 Raspberry Pi 2 能够运行更广泛的 ARM GNU/Linux
    发行版、微软 10 IoT 以及快速的 Ubuntu core。我们将更详细地查看这些操作系统以及如何安装它们。


    Raspberry Pi 2 与 `Pi 1` 以及所有在 `Pi 1` 上使用的项目、软件和硬件完全兼容。它能够整合 `Pi 1` 上的所有项目，但由于功率的增加，它的性能更高。这确保了愿意升级的用户可以无缝衔接。它与前代产品具有完全相同的外形，即使在集成了更高的功率之后也是如此。所有的接口都在相同的位置。这意味着你之前使用的任何外壳或第三方扩展板仍然适用于
    Pi 2。电路板仍然由 5V 微型电源适配器供电。


    Raspberry 基金值得赞誉的一点是在功率增加的情况下仍保持相同的价格。事实上，他们降低了市场上嵌入式电脑的价格。在 `Pi 1` 之前，无法找到低于
    100 美元的产品。这让更多热情程序员、爱好者和学生能够在廉价平台上尝试他们的编程技能。


    为了演示 `Pi 2` 相较于旧模型的性能提升，Raspberry 基金创建了一个使用 `Python` 脚本的快速测试，计算 Pi 的近似值，然后在流行的
    Minecraft 游戏中以视觉形式显示。`Pi 1` 完成此计算用了 47 秒，而 `Pi 2` 仅用了三秒。四内核处理器就是那么快。然而，速度还取决于你是否优化了
    `Pi 2` 以运行多线程，我们稍后会讨论。无论你如何使用 Raspberry，一旦你升级到 `Pi 2`，你都会发现性能有所提升。


    由于它带来了所有额外的功率和功能，`Pi 2` 是你应该拥有的东西。它比旧模型的额外灵活性允许你安装和运行更广泛的操作系统，包括面向构建者和创造者的 Windows
    10 IoT 操作系统，这会让它因其功能更加受欢迎。


    [节选结束] 如果你喜欢这部分，可以在下一页的链接中购买副本。


