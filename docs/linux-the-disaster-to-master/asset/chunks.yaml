    - [Chapter 2: Installing Linux](#part0000_split_007.html__Toc427052350)

    - [Chapter 3: Importing Your Data](#part0000_split_008.html__Toc427052352)

    - [Chapter 4: Installing and Updating Programs](#part0000_split_009.html__Toc427052354)

    - [Chapter 5: Introduction to the Command Line](#part0000_split_010.html__Toc427052356)

    - [Chapter 6: Running Commands](#part0000_split_011.html__Toc427052358)

    - [Chapter 7: Getting Help with the Command Line](#part0000_split_012.html__Toc427052360)

    - [Chapter 8: Using a Text Editor](#part0000_split_013.html__Toc427052362)

    - [Conclusion](#part0000_split_014.html__Toc42705234)


    ## Chapter 1: Starting Off With Linux


    You have decided to learn about `Linux`. Maybe you want to make the switch from
    another operating system to this wonderful OS you have hearing about. In this
    first chapter, I am going to take you through different reasons why you might
    want to use `Linux`, the behind scenes working of `Linux`, installing `Linux`
    and how to begin it. All of this is meant to ease you into the Linux world before
    we can get to the real stuff.


    To start us off, what is Linux? In the simplest of terms, `Linux` is an operating
    system that enables your computer to work. `Windows`, `Mac OS`, `iOS`, and `Android`
    are all operating systems. They provide a platform on which different software
    work on hardware. Thus, an operating system interacts with the hardware, software,
    user and anything else that is connected to your device to make them all work
    together to deliver a certain function.


    “What is the difference between all these operating systems? Can I just use any
    of them without switching?” you might ask. Each of these operating systems, especially
    `Linux`, has their own way of doing things. In the introduction, we have looked
    at some statistics on Linux usage as an operating system. On virtually all supercomputers
    and most of the Internet servers, `Linux` is the preferred OS. Among developers
    and programmers, `Linux` is the preferred OS. This is because they like the Linux
    way of doing things. Let us look at the advantages Linux has over other OS.


    The Linux operating system is very secure. There is a minimal chance of being
    infected with a virus when using the `Linux OS`. Most Linux users do not run antivirus
    software on their computers due to this – maybe only those that deal with specialized
    and sensitive uses. As you might know, an antivirus slows down your computer.


    The Linux operating system is very flexible. Unlike other operating systems, `Linux`
    is very flexible in many different aspects. You can choose your user interface
    from many different options unlike `Windows`, which only has one. `Linux` runs
    on a wide range of hardware, supercomputers, servers, desktops, and smartphones.
    It can run on old hardware, computers with low specs, and on super-fast modern
    computers. The `Linux OS` provides advanced security features such as strong encryption.
    These and more features make this OS very flexible to use in a wide range of common
    and advanced uses.

