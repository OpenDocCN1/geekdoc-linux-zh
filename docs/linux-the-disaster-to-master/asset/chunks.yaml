    \nIn the next window, chose the email client you are importing from, either Outlook\
    \ or Express, and then click Finish. This will have imported your mail to Thunderbird.\n\
    \nImporting Thunderbird from Windows to Linux\n\nWe can now go ahead and import\
    \ these settings and data from Thunderbird on Windows to Thunderbird on Linux.\
    \ If you have been using Thunderbird, then you start from this point.\n\nGo to\
    \ Thunderbird. On File, click Compact Folders. This move is essential but not\
    \ a must; it helps in cleaning up your mail folders so that when you migrate,\
    \ you do not have issues with incorrect email counts.\n\nThe next step is to locate\
    \ the profile folder on Windows. It is easiest located using the command prompt.\n\
    \ncd %APPDATA%\\\\Thunderbird\n\nOnce you have found the profile folder Thunderbird,\
    \ go to Profiles. While here, search for a folder which will be randomly named\
    \ but will end with .default. Copy this folder: Thunderbird>Profiles>xxxx.default\
    \ (you can copy this folder in a partition that you can access easily in your\
    \ Linux OS or copy it to a removable drive.)\n\nMove over to Linux now. Thunderbird\
    \ will be a default program in Ubuntu. Go to the home folder on Linux and choose\
    \ View > Show Hidden Files. You will find a folder named .mozilla-thunderbird.\
    \ Open this folder and paste the copied profile folder from Windows.\n\nThe last\
    \ step you need to take to get your mail up and running in Linux. Inside Thunderbird,\
    \ you need to make a file called profiles.ini. Do a right-click and create a new\
    \ text file in the folder, and name it profiles.ini. Open up this new file in\
    \ a text editor, and paste in the following:\n\n[General]\n\nStartWithLastProfile=1\n\
    \n[Profile0]\n\nName=default\n\nIsRelative=1\n\nPath=xxxxxxxx.default\n\nReplace\
    \ the xxxxxxxx with the real name of your profile folder that you pasted. Save\
    \ the file and quit, and now launch Thunderbird. Your email should load up as\
    \ if nothing has happened, and all your archives should be up and rolling.\n\n\
    This is a hectic process for a beginner in Linux, but it will help you understand\
    \ the basic working of the Ubuntu OS. A simpler way to do this would be using\
    \ an IMAP server. IMAP mail servers do not store your emails on your hard drive,\
    \ but rather on a server, so all you need is to configure your mail client with\
    \ your IMAP server. IMAP mail servers are compatible with multiple email clients\
    \ across different platforms. You will then log in to your new system and your\
    \ email account will appear in your new system as it did in the old email client.\n\
    \nSynchronizing your browser\n\nFor a seamless browsing experience, you need to\
    \ sync your browser so that you can just continue where you left off on the new\
    \ platform. Today, this is easy, as all major browsers are on both Windows and\
    \ Linux systems. You need to ensure that you sync your data on your current browser,\
    \ and when you launch it on Ubuntu, all your data will be available including\
    \ bookmarks, cookies, history, app, extensions, and passwords. If you are using\
    \ Chrome, you need to sign in using your Gmail account and then go to Menu, click\
    \ Settings, then Advanced Settings and sync the information you want to migrate.\
    \ Note that this information will still be available in Windows and anything else\
    \ you do on Linux will automatically sync, so no matter the OS you choose to use,\
    \ your browsing experience will be seamless. Chrome, Opera, Mini, and Mozilla\
    \ will be found in the Ubuntu repositories ready to be downloaded.\n\nInstalled\
    \ programs"
