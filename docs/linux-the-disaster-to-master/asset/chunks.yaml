    你可以通过切换到控制台打开命令行。这是一种纯文本的全屏显示模式，无需使用 GUI 或鼠标。在 GUI 状态下，同时按下 `CTRL`、`ALT` 和 `F1`
    键——GUI 将消失，控制台将会出现。屏幕将变为黑色，除了命令行中的几个字符外。在此屏幕下，若要返回 GUI，只需同时按下 `CTRL`、`ALT` 和 `F8`
    键即可。


    当你打开命令提示符时，它会列出你的计算机名称和用户名。由于 Linux 是多用户操作系统，意味着一个一个用户可以访问并使用系统，因此这一点非常重要。每个用户将有一个主目录，他们可以在那里存储文件。在命令提示符启动时，你需要确保你当前处于哪个目录。


    用户名后面会跟随着一些标点符号，可能是 `$` 或 `#`，然后是一个闪烁的框或光标。`$` 表示你是以普通用户身份登录，而 `#` 表示你是以 `root`
    用户身份登录。除非你想在 root 目录内执行任何管理任务，否则请务必确保你是以普通用户身份登录的。如果你以 `root` 身份登录，你操作的所有目录和文件的权限将发生更改，以
    `root` 为用户。


    # 第 6 章：运行命令


    命令是以特定的方式编写的。你应该注意，命令行是区分大小写的，这与你可能过的其他命令提示符不同。命令名称中不能有空格。在命令之后，你可以输入一个空格，然后添加一个连字符和另一个名称。这通常被称为选项（option）。它限制或更改命令的执行方式。命令行中使用的单词都是由长词缩写而来的简称。例如，我们使用
    `mv` 代表 move（移动），使用 `ls` 代表 list（列出）。在学习过程中以及在计算机上练习时，你会学习更多这些单词。


    ## 基础命令


    现在让我们来看看 Linux 系统经常使用的基础命令。这些并不是全部命令，但你会经常使用它们。不要费力去背诵这些命令；你用得越多，它们很快就会刻在脑海里。我们还将查看如何让命令实现所需的特定功能。


    ### `pwd` 命令


    这代表当前工作目录（present working directory）。它可以帮助你识别在任何特定时间你处于哪个目录。当你打开终端时，你会进入主目录，但随着你在目录之间切换，这一点会发生变化。它显示你正在操作的目录的名称和完整位置。为了避免混淆，“目录”（directory）通常指的是我们在
    Windows 操作系统常用的文件夹。你需要在提示符中输入 `pwd` 并按回车。


    ![`pad3.whstatic.com/images/thumb/5/5a/Get-Familiar-With-Ubuntu-Commands-Step-1.jpg/670px-Get-Familiar-With-Ubuntu-Commands-Step-1.jpg`](img/00007.jpeg)


    当你第一次打开终端时，不需要使用这个命令，因为你已经在主目录下了。然而，总有一天你需要知道自己身在哪里，因为当前目录的位置和名称并不总是显而易见的。


    ### `ls` 命令


    这是一个常用命令。你用它列出目录的内容。当你单独输入 `ls` 时，将列出该目录中所有对象的名称列表。这包括链接、文件、目录（此文件夹内的文件夹）和图像。


    为了方便识别，你会发现这些对象会经过颜色编码，以便你一眼看出对象的类型。你应当了解的某些基础颜色是：蓝色（目录）、白色（文本文件）、红色（归档文件）、青色（链接）、绿色（可执行文件）和粉色（图像）。


    这些对象不会提供额外信息，仅列出。如果你只想知道对象列表，这些就足够了。然而，你可能需要其中任何一个对象的更多信息。这时我们就使用 `ls` 命令以及其后的一个选项。这个选项通常是一个字母，也可以是一个单词。它跟在命令和空格之后。它指定了你所需的额外信息。你也可以在同一行输入多个选项，以获取关于某个对象的更多信息。这些选项之间不需要输入空格。现在让我们来看示例。


    如果你想知道目录中的所有对象，包括隐藏文件，你将使用选项 `-a`。这些隐藏文件或目录在命令行中、甚至在使用 GUI 时都是不可可见的，除非你指定了它们。按此顺序输入命令和选项：`ls
    -a`。这将显示该目录中的所有对象，包括隐藏文件。


    另一个选项是 `-l`。它提供了目录中对象的详细列表显示（long listing）。它提供了更多信息，例如对象类型（它是图像、链接、文件等吗）、权限（谁可以执行、读取或写入该对象）以及所有者（谁创建了该对象以及创建日期和时间）。所以，将此命令与此选项以及全部选项（如果你想获取所有对象的信息）写在一起，你输入这条命令行：`ls
    -al`。


    ![](img/00008.jpeg)


    ![](img/00009.jpeg)


    第一个字符代表文件类型。例如，在上方显示的行中，`d` 表示这是一个目录。其他值可以是：`-` 普通文件、`s` 套接文件、`l` 链接文件等。


    接下来的九个字符代表权限——`r`-读、`w`-写、`x`-执行。前三个字符代表所有者的权限，中间三个代表组权限，最后三个代表授予他人的权限。在上面的示例中，所有者拥有读、写、执行权限，而组以及其他人都具有读和执行权限。


    你可能希望以易于阅读的格式获取特定目录中对象的大小信息。这是一个非常常用的用法。除了我们已经拥的信息外，如果你添加大小选项（由 `s` 表示），你将获得每个对象以字节为单位的大小。你将拥有命令行：`ls
    -als`。如果你只需要大小选项而不是之前的其他选项，那么删掉它们并仅输入 `ls -s`。


    此命令可以接受参数（arguments）。这是从用户输入的数据，用于指定你希望获取信息的方向。你可以列出任何目录，甚至同时列出多个目录，配合精确指定你从这些目录所需的任何选项。如果你想查看两个目录（即
    `/home` 和 `/bin`）中的对象，你将使用以下命令行：


    ```

    ls -a /bin /home

    ```


    这将显示这两个文件夹中的所有对象，由于使用了选项 `-a`，还包含了隐藏文件。


    注意这些目录前的斜杠；这意味着这些目录是根目录下的标准一级目录。Linux 系统中的根目录包含所有其他目录和子目录。斜杠用于根目录的一级目录，以将它们与可能同名的其他目录区分开。


    `cd` 命令


    '
- fmt: "\nThis is another basic command. It is used to navigate from the current directory\
    \ to another directory you may need. This directory will require you type the\
    \ directory name or the complete path of the directory depending on where it is\
    \ located. If the directory you are looking for is located within the directory\
    \ you are presently in, then you won’t have to type the whole path. If you are\
    \ presently in `/home/john/pictures` and you want to navigate to a directory named\
    \ `/home/john/pictures/holiday`, you will just have to run the command `cd holiday`\
    \ the command line, which will search for the directory `holiday` within `pictures`.\
    \ This is known as a relative path.\n\nIf you want to change from the current\
    \ directory to another directory not relative to the present one, you will have\
    \ to type the whole path. If you want the directory `bin`, you will have to type\
    \ the whole path, including the forward slash: `cd /home/bin`\n\nIf you want to\
    \ change to the root directory, you use the following: `cd /`\n\nIf you want to\
    \ go back to the home directory, you need not type the username you’ll just type\
    \ `cd ~` this is a short cut meant to save you time.\n\nOther shortcuts are: To\
    \ switch to the previous directory in the tree, run: `cd ..`, or if you want to\
    \ switch to the previous working directory, run `cd -`\n\n## The touch command\n\
    \nThis is used to create new files. This command will require you run the file\
    \ name as the argument. If you wish to create a new file named `practice` in the\
    \ present directory, you just run the command:\n\n```\ntouch practice\n```\n\n\
    If you want to create multiple files, you run the command with the names of the\
    \ files separated by a space:\n\n```\ntouch practice test log\n```\n\nIf you want\
    \ to create the file in a different directory other than the one you are working\
    \ on, you need to specify the full path of this new location. For example:\n\n\
    ```\ntouch /home/john/practice/test\n```\n\nTo write anything on the new file,\
    \ you will need to use a command line editor, which we will be looking at in a\
    \ later chapter.\n\n## The mkdir command\n\nThe `mkdir` works just the same way\
    \ as the `touch` command but is used to create directories (folders)\n\n```\n\
    mkdir dir1 dir2 dir3\n```\n\nThis will create three folders named `dir1`, `dir2`,\
    \ and `dir3` in the current directory. If there is already a directory with the\
    \ same name provided in the argument, it will not be created; a warning informing\
    \ you of this will appear unlike in the `touch` command, where a new file with\
    \ the same name will be created. If you want to create a folder in a different\
    \ directory other than the one present, you have to specify the full path.\n\n\
    ## The rm command\n\nThis command is used to delete files and directories. You\
    \ use the name of the file as the argument. For example, if you want to delete\
    \ a file by the name `file1`, you run the following command:\n\n```\nrm file1\n\
    ```\n\nThis will delete `file1`. If you want to delete multiple files, you write\
    \ the names separated by a space.\n\n```\nrm file1 file2 file3\n```\n\nHowever,\
    \ this can get tedious if you want to delete very many files in a certain directory\
    \ and the `rm` without an option cannot delete an entire directory. This is just\
    \ placed as a precaution since once you run the command and delete a chosen file\
    \ or directory, it will be almost impossible to retrieve it.\n\nOne way to delete\
    \ multiple files is by use of wildcards. For instance, `*` represents a string\
    \ and can be used as a wildcard. Using the command `rm *` will delete all files\
    \ in the present directory. Be extra careful when using these wildcards, as your\
    \ actions are undoable. One thing with the command line is that it assumes you\
    \ know what you are doing; there are no confirmation/warning windows or anything\
    \ you might have experienced in the GUI. Once you run a command, the desired result\
    \ is achieved.\n\nIf you want to use the wildcard to delete only files within\
    \ a certain directory, you specify this in the command.\n\n```\nrm dir1/*\n```\n\
    \nThis will delete all files in `dir1`.\n\nYou can still specify further using\
    \ the wildcard to pinpoint exactly what type of files you want deleted. For instance,\
    \ if you want to delete all files with the extension `.html`, you run the following\
    \ command\n\n```bash\nrm *.html\n```\n\nHowever, be very careful when using this\
    \ wildcard, as it is very easy to lose data you never intended to lose. Always\
    \ take time to confirm what you are doing and if you are not sure, do not do it.\n\
    \nTo delete entire directories using this command, you have to use the `r` option.\
    \ This is a safeguard against deleting entire files in a directory accidentally.\n\
    \n```bash\nrm -r /home/john/practice/\n```\n\nThis will delete all the files any\
    \ subdirectory and files within this directory, then remove the directory `practice`.\n\
    \n## The rmdir command\n\nThis command is used to remove empty directories. It\
    \ is very similar to the `rm` command, only it removes empty directories. It is\
    \ safer to use when you just want to delete those directories.\n\n```bash\nrmdir\
    \ dir1 dir2\n```\n\nThis will delete directories named `dir1` and `dir2` which\
    \ are empty. These are located in the present directory we are working on. If\
    \ not, type the command with the whole path to the empty directory.\n\nThis command\
    \ is useful if you choose to delete files without using the `r` option, so that\
    \ finally when you are left with the empty directory, you use the `rmdir` to delete\
    \ them. For a beginner (and to be safe), I would encourage you to use this method\
    \ if you fear losing any data will affect you adversely.\n\n## The cp command\n\
    \nThis command is used to copy directories and files. The copies will subsequently\
    \ become independent of the originals. Any actions taken on the originals will\
    \ not affect the copies.\n\n```bash\ncp name new_name\n```\n\nThat is the command\
    \ where you specify which file or directory you want to copy and the name of the\
    \ new directory. By default, `cp` will only copy files, to copy directories you\
    \ need to use `r` option. For instance, if you want to copy `dir1` with its content\
    \ including subdirectories to a new directory called `dir2`, you run the following\
    \ command\n\n```bash\ncp -r dir1 dir2\n```\n\nWhen you make a copy of a file or\
    \ directory, you must use a different name to the original. However, if you place\
    \ the copy in a different directory, you might let it have the same name `cp file1\
    \ /home/john/file1`\n\nYou could copy multiple files to a single directory by\
    \ listing the names of these files and then naming the directory to which they\
    \ should be:\n\n```bash\ncp file1 file2 file3 dir1\n```\n\nThe final argument\
    \ must be a directory when copying multiple files.\n\n## The chmod command\n\n\
    This command is used to alter file permissions. It can be used in two ways: either\
    \ through letters or through numbers. We shall look at the letter method since\
    \ it is more straightforward than the numbers method. The letter method uses `+`,\
    \ `-` and `=` signs to add, remove, or assign permissions. The letter `a` represents\
    \ all, `o` represents others, `u` represents owner, and `g` represents group.\
    \ The permissions are `r` for read, `w` for write, and `x` for execute. With this\
    \ information, we can now understand how the command works. For example:\n\n```bash\n\
    chmod u=rwx file1\n```\n\nThis command grants the owner (`u`) of `file1` read(r),\
    \ write(w), and execute(x) permissions.\n\n```bash\nchmod o+w file1\n```\n\nThis\
    \ command grants others the permissions to write.\n\n```bash\nchmod g-r file1\n\
    ```\n\nThis command denies the group permission to read file 1.\n\n```bash\nchmod\
    \ a+x somefile\n```\n\nThis command grants all the permissions to execute.\n\n\
    # Chapter 7: \n\n# Getting Help with the Command Line\n\nThe command line, inasmuch\
    \ as it is helpful, can be challenging as well. Not only beginners will encounter\
    \ challenges with the command line, but even the experienced pros. Luckily, help\
    \ is just a command line away. Yes, the command line has a manual and an info\
    \ page that explains more about the different commands and how to run them. You\
    \ could also use the `whatis` command, which gives you a simple explanation to\
    \ a command:\n\n```bash\nwhatis mv\n```\n"
