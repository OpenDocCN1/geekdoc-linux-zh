    # Shell

    Shell（又称为命令行）实现了一种文本接口，允许用户通过从键盘输入命令来运行程序并控制系统。如果没有 Shell 或桌面环境的帮助，要让一个系统完成大部分工作将是具有挑战性的。Linux
    有多种 Shell，每种 Shell 具有不同的特性。某些 Linux 系统使用 `bash`（即 Bourne again shell），且 Linux
    Shell 支持多任务处理，可以同时运行多个程序。


    # 设备即文件

    由于系统可以对文件进行读和写操作，计算机也可以发送和接收数据，因此，Linux 操作系统现在将连接到系统的设备表示为目录中的文件。事实仍然是，这些文件无法被移动或重命名，而且它们并不存储在任何磁盘上。这完全与应用程序有关。


    # X 窗口服务器

    窗口服务器组件是命令行 Shell 的图形化替代方案。它有助于绘制图形，并能够处理来自鼠标、键盘、平板电脑和其他设备的输入。该组件是网络透明的，这意味着它允许你在图形化环境中工作，该环境可以在你的个人计算机上，也可以通过网络连接到另一台远程计算机上。今天最常用的
    X 服务器是 `X.org`。许多图形化程序都需要 X 服务器才能运行，这意味着它们可以与任何桌面环境或窗口管理器配合。


    # 窗口管理器

    窗口管理器组件是一个帮助与 X 服务器通信的程序。它的真实职责是管理窗口。该组件有助于在窗口被点击时将其置到最前、绘制窗口框、隐藏窗口以最小化其程序，以及在屏幕上移动窗口。目前流行的窗口管理器程序包括
    Compiz fusion、Xfwm、KWin 和 Metacity。


    # 文件系统

    文件系统是 Linux 操作系统的另一个核心组件。这些是基于 Linux 的发行版使用的几种文件系统。这些文件包括 `squashFS`、`BTRFS`、`NIFS`、`VFS`
    和 `EXT3/4`。


    计算机的硬盘有一个简单的接口，它只接受诸如添加块号并将其放入内存地址之类的命令。现在，如果想编辑一段文本并希望将其保存到磁盘中，那么使用块号来识别如文本所需的数据片段将非常笨拙。问题在于首先要使用原始块号告诉你的程序将文件保存在，而且你必须确保这些块没有被用于存储其他文件，如音乐收藏、家庭照片或可能是你的系统内核。


    为了解决这个问题，引入了文件系统。这些文件被组织成称为目录的组。每个文件通常通过路径来识别，路径解释了它在层次结构中的位置。因此在 Linux 中，我们有根目录，它是顶层目录。根目录始终只有少量的子目录。这些：


    *   `Bin`

    *   `Home`

    *   `Media`

    *   `Tmp`

    *   `Var`

    *   以及 `bin`


    # Linux 体系

    Linux 操作系统在四层上正常工作，包括：


    *   硬件

    *   内核

    *   shell

    *   以及应用程序

    '
- fmt: "\n# Applications/utilities\n\nApplications\nThese are the utility programs\
    \ that run on the shell. These consist of any application which includes text\
    \ editor, web browsers, media player, etc.\n\n**Shell**: This is the interface\
    \ that does the duty of taking input from users and sending instructions to the\
    \ `Kernel`. Shell again takes the output from the kernel and sends its result\
    \ back to the output shell.\n\n**Hardware**: The hardware consists of all the\
    \ physical devices attached to the system, which includes the `RAM`, `CPU`, `Hard\
    \ disk`, `Motherboard`, and lots more.\n\n**Kernel**: This is like the central\
    \ component for any operating system which directly interacts with the hardware.\n\
    \n## Chapter 5 – Comparison Between Linux And Other Operating system![](image436.jpg)\n\
    \nEven though Linux operating system can co-exist easily with other operating\
    \ systems on the same machine there are still the difference between it and other\
    \ operating systems such as `windows OS/2`, `Windows 95/98`, `Windows NT` and\
    \ other implementations of UNIX for the personal computer. We can compare and\
    \ contrast the Linux and the other operating system with the following points.\n\
    \n### Linux is a version of UNIX\n`Window NT` and `window OS/2` can be said to\
    \ be multitasking operating system just like Linux. Looking technically at them\
    \ both `Windows NT` and `window OS/2` are very similar in features like networking,\
    \ having the same user interface, security, etc. but there is not a version of\
    \ UNIX like Linux that is a version of UNIX. So the difference here is that Linux\
    \ is a version of UNIX and as such enjoys the benefits from the contributions\
    \ of the UNIX community at large.\n\n### Full use of X86 PROCESSOR\nit is a known\
    \ fact that Windows such as `windows 95/96` cannot fully utilize the functionality\
    \ of `X86 processor` but Linux operating system can completely run in this processor’s\
    \ protected mode and explore all the features therein which also includes the\
    \ multiple processors.\n\n### Linux OS is free\nOther operating systems are commercial\
    \ operating system though windows are a litle inexpensive. Some of the cost of\
    \ these other operating system is really high for most personal computer users.\
    \ Some commercial operating system cost as high as a $1000 or more compared to\
    \ Linux that is free. The Linux software is free because once one can access the\
    \ internet or another computer network it can be downloaded free to be installed.\
    \ Another good option is that the Linux OS can be copied from a friend system\
    \ that already has the software.\n\n### Runs complete UNIX system\nUnlike other\
    \ operating system, one can run a complete UNIX system with Linux at home without\
    \ incurring the high cost of other Unix implementations for one’s personal computer.\
    \ Again there are tools that will enable Linux interact with Windows, so it becomes\
    \ very easy to access Windows files from Linux.\n\n### Linux OS still does much\
    \ than Windows NT\nThough more advanced operating systems are still on the rise\
    \ in the world of personal computer like the `Microsoft Windows NT` that is trending\
    \ now because of its server computing but can’t benefit from the contributions\
    \ of the UNIX community, unlike the Linux OS. Again `Windows NT` is a proprietary\
    \ system, the interface and design are owned and controlled by one corporation\
    \ which is Microsoft so it is only that corporation or Microsoft that may implement\
    \ the design so there might not free version of it for a very long time\n\n###\
    \ Linux OS is more stable\nThough Linux and other operating systems such as `Windows\
    \ NT` are battling for a fair share of the server computing market. The `Windows\
    \ NT` only has behind it the full support of the Microsoft marketing machine but\
    \ the Linux operating system has the help of a community which comprised of thousands\
    \ of developers which are really aiding the advancement of Linux through the open-source\
    \ model. So looking at this comparison it shows that each operating system has\
    \ its strong and weak point but Linux is more outstanding than another operating\
    \ system because other operating systems can crash easily and very often especially\
    \ the `Windows NT` while Linux machines are more stable and can run continuously\
    \ for a long period\n\n### Linux as better networking performance than others\n\
    Linux OS can be said to be notably better when it comes to networking performance,\
    \ though Linux might also be smaller than `Windows NT` it has better-performance\
    \ and can compete favorably with other operating system.\n\n### Linux works better\
    \ with other UNIX\nUnlike other operating system which can’t work with other implementations\
    \ of UNIX, Linux supports a wide range of hardware, sound, graphics, etc. through\
    \ the open-source model.\n\n### Booting and naming\nThe booting of Linux from\
    \ the primary partition is de facto standard (it can be booted from any partition\
    \ in other operating systems). In Linux, the primary partition is called the `rootFS`.\
    \ In Windows, the boot files must be on the primary partition.\n\n### Linux OS\
    \ is customisable\nThe operating system can be customized to suit the needs of\
    \ the user, for example the desktop environment can be changed. In Windows, the\
    \ interface is fixed by the corporation.\n\n### Linux commands\nThe Linux command\
    \ line is very powerful. You can use various commands to perform tasks quickly.\
    \ \n\n## Chapter 6 – Linux Tips and Tricks\n\n- `ls`: List files in the directory.\
    \ You can use `ls -a` to see hidden files or `ls -l` for detailed information.\n\
    - `cd`: Change directory. For example, `cd /var/log` to go to the log directory.\
    \ `cd ..` goes up one level, and `cd ~` takes you back to your home directory.\n\
    - `pwd`: Print the current working directory.\n- `clear`: Clear the terminal screen.\
    \ The shortcut `Ctrl+l` does the same thing.\n- `Ctrl+d`: Log out or exit the\
    \ current shell session.\n- `Ctrl+s`: Stop the display (often accidentally pressed).\
    \ Use `Ctrl+q` to resume the display.\n- `Ctrl+k`: Delete all text after the cursor.\
    \ `Ctrl+u` deletes command from the cursor to the beginning of the line.\n- `Ctrl+y`:\
    \ Paste text deleted with `Ctrl+k` or `Ctrl+u`.\n- `Ctrl+r`: Search through previous\
    \ commands in the history.\n- `history`: Show the list of previously executed\
    \ commands.\n- `man`: Show the manual page for a command. For example, `man ls`.\n\
    - `grep`: Search for patterns within text or files.\n- `sudo`: Run a command with\
    \ superuser privileges.\n- `chmod`: Change file permissions.\n- `cp`: Copy files\
    \ and directories.\n- `mv`: Move or rename files and directories.\n- `rm`: Remove\
    \ files or directories. Use `rm -rf` for recursive removal.\n- `touch`: Create\
    \ a new file or update the timestamp.\n- `cat`: Display the content of a file.\n\
    - `nano` or `vi`: Simple and advanced text editors for the terminal.\n\nThe Linux\
    \ command line is very powerful and flexible. You can chain commands together\
    \ using the pipe `|` symbol."
