    This command allows you to search the command history. Usually, you go back to
    commands already typed using the top arrow key. well with `ctrl+ r`, you can carry
    out a search in this history, do `ctrl+ r`, then type a piece of the command which
    you want to search.


    ! !


    In line with the practical bash shortcuts, the double exclamation point allows
    you to launch the last command again.this is certainly the most complex command
    of this section, especially for beginners.


    for is a loop instruction. A loop is used to execute an action several times,
    on all the elements of a variable. For example, we can very easily rename all
    files in a directory to replace spaces with hyphens or comma with full stop.


    - `ctrl + z`: On windows, this is used to undo an action but on Linux, this is
    used to pause the current process.

    - `bg`: This is used to escape from a process that is paused in the background.

    - `fg`: This is used to resume a process in the background (if several are running
    at the same time, `fg %n`).

    - `at`: This is used to program an event to run an hour later eg `at 18:22` or
    `at now`.

    - `q`: This is used to list pending tasks.

    - `atrm`: delete task.

    - `sleep`: this command allows you to pause between the execution of two commands.
    Example: `touch gt.txt && sleep 10 && rm gt.txt`


    `crontab` is actually a command that reads and modifies a file called "crontab".
    Here are the most common options:


    - `e`: modify the crontab,

    - `l`: displays the current crontab,

    - `r`: remove your crontab. Attention, the deletion is immediate and without confirmation!

