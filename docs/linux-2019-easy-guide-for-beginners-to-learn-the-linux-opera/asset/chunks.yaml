  trans: '


    # Applications/utilities


    应用程序

    这些是在 shell 中运行的实用程序。它们由任何应用程序组成，包括文本编辑器、网络浏览器、媒体播放器等。


    **Shell**：这是一个接口，负责接收用户输入并向 `Kernel`（内核）发送指令。Shell 再次接收内核的输出，并将结果传回输出 shell。


    **Hardware（硬件）**：硬件由连接到系统的所有物理设备组成，包括 `RAM`、`CPU`、硬盘、主板等许多。


    **Kernel（内核）**：这类似于任何操作系统的核心组件，直接与硬件交互。


    ## 第 5 章 – Linux 与其他操作系统的对比![](img/image436.jpg)


    尽管 Linux 操作系统可以轻松在同一台机器上与其他操作系统共存，但它与其他操作系统（如 `windows OS/2`、`Windows 95/98`、`Windows
    NT` 以及其他个人电脑 UNIX 实现）之间仍然存在差异。我们可以通过以下几点来对比 Linux 和其他操作系统。


    ### Linux 是 UNIX 的版本

    `Window NT` 和 `window OS/2` 可以说像 Linux 一样都是多任务操作系统。从技术角度来看，`Windows NT` 和 `window
    OS/2` 在网络、相同的用户界面、安全性等功能方面非常相似，但并没有像 Linux 这样的一个 UNIX 版本。因此，这里的区别在于 Linux 是 UNIX
    的版本，并因此受益于整个 UNIX 社区的贡献。


    ###充分利用 X86 处理器

    众所周知，像 `windows 95/96` 这样的 Windows 无法充分利用 `X86 processor` 的功能，但 Linux 操作系统完全运行在该处理器的保护模式下，并探索其中所有的功能，包括多处理器功能。


    ### Linux 操作系统是免费的

    其他操作系统都是商业操作系统，尽管 Windows 稍微便宜一些。对于大多数个人电脑用户来说，这些其他操作系统的成本非常高。某些商业操作系统的费用高达 1000
    美元，而 Linux 是免费的。Linux 软件是免费的，因为一旦访问互联网或其他计算机网络，就可以免费下载安装。另一个很好的选择是，从已经安装该软件的朋友系统中复制
    Linux OS。


    ### 运行完整的 UNIX 系统

    与其他操作系统不同，你可以在家里使用 Linux 运行完整的 UNIX 系统，而无需为个人电脑支付其他 Unix 实现的高昂费用。此外，还有工具可以使 Linux
    与 Windows 交互，因此从 Linux 访问 Windows 文件变得非常简单。


    ### Linux OS 的功能比 Windows NT 多

    尽管个人电脑领域仍有更先进的操作系统崛起，例如目前因为服务器计算而流行的 `Microsoft Windows NT`，但它无法像 Linux OS 那样从
    UNIX 社区的贡献中获益。此外，`Windows NT` 是一个专有系统，其界面和设计由一家公司（微软）所有并控制，因此只有该公司或微软可能会实现该设计，因此在很长一段时间内可能没有免费版本。


    ### Linux OS 更加稳定

    尽管 Linux 和 `Windows NT` 等其他操作系统正在争夺服务器计算市场的公平份额。`Windows NT` 背后只有微软营销机器的全力支持，但
    Linux 操作系统拥有一个由成千上万开发者组成的社区的帮助，这些开发者通过开源模型真正帮助了 Linux 的进步。从这一对比来看，说明每个操作系统都有其优缺点，但
    Linux 比其他操作系统更出色，因为其他操作系统很容易崩溃且经常发生崩溃，特别是 `Windows NT`，而 Linux 机器更稳定，可以持续运行长时间。


    ### Linux 的网络性能优于其他

    在网络性能方面，可以认为 Linux OS 显著更好，尽管 Linux 可能比 `Windows NT` 小，但它具有更好的性能，并能与其他操作系统进行良好竞争。


    ### Linux 与其他 UNIX 配合更好

    与无法与其他 UNIX 实现协作的其他操作系统不同，Linux 通过开源模型支持广泛的硬件、声音、图形等。


    ### 启动与命名

    从主分区启动 Linux 是事实上的标准（它可以从其他操作系统的任何分区启动）。在 Linux 中，主分区被称为 `rootFS`。在 Windows 中，启动文件必须位于在主分区上。


    ### Linux OS 是可定制的

    操作系统可以根据用户需要进行定制，例如，可以更改桌面环境。在 Windows 中，界面是由公司固定的的。


    ### Linux 命令

    Linux 命令行非常强大。你可以使用各种命令来快速完成任务。


    - `ls`: 列出目录中的文件。你可以使用 `ls -a` 查看隐藏文件，或使用 `ls -l` 查看详细信息。

    - `cd`: 切换目录。例如，`cd /var/log` 进入日志目录。`cd ..` 返回上一级，`cd ~` 回到主目录。

    - `pwd`: 打印当前工作目录。

    - `clear`: 清除终端屏幕。快捷键 `Ctrl+l` 具有相同功能。

    - `Ctrl+d`: 注销或退出当前的 shell 会话。

    - `Ctrl+s`: 停止显示（经常意外按下）。使用 `Ctrl+q` 恢复显示。

    - `Ctrl+k`: 删除光标后的所有文本。`Ctrl+u` 删除光标到行首的命令。

    - `Ctrl+y`: 粘贴用 `Ctrl+k` 或 `Ctrl+u` 删除的文本。

    - `Ctrl+r`: 在历史中搜索之前的命令。

    - `history`: 显示之前执行的命令列表。

    - `man`: 显示命令的帮助页。例如，`man ls`。

    - `grep`: 在文本或文件中搜索模式。

    - `sudo`: 以超级用户权限运行命令。

    - `chmod`: 修改文件权限。

    - `cp`: 复制文件和目录。

    - `mv`: 移动或重命名文件和目录。

    - `rm`: 删除文件或目录。使用 `rm -rf` 进行递归删除。

    - `touch`: 创建新文件或更新时间戳。

    - `cat`: 显示文件内容。

    - `nano` 或 `vi`: 终端的简单和高级文本编辑器。


    Linux 命令行非常强大且灵活。你可以使用管道符号 `|` 将多个命令组合在一起。

    '
