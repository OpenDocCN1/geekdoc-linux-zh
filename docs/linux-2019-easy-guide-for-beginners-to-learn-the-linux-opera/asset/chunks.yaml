    `/dev/cdrom`。`/dev/cdrom` 文件与 `/dev/cdrom0` 设备名称之间存在一个符号链接。可移动光驱器被挂载为外部硬盘。你首先需要使用
    `fdisk` 对磁盘进行分区，然后使用 `mk2fs` 创建分区表并安装文件系统，然后你需要使用 `mkdir` 创建挂载点并使用 `mount` 挂载分区。最后，在
    `/etc/fstab` 文件中添加一行，以便设备在每次启动时自动挂载。


    ### 访问权限

    权限（Access rights or permissions）允许某些用户或用户组限制对某些文件或目录的访问。共有三种访问权限：

    - `read (r)`：用于读取文件的访问权限（允许打印、显示和复制文件，并允许遍历目录或显示目录中的文件）

    - `write (w)`：用于写入文件的权限（允许修改文件，并允许删除文件或在目录中保存文件）

    - `execute (x)`：执行文件的可能性（允许执行程序、可执行文件，并允许访问目录文件的管理信息，如 inode、权限表等）


    对于每个文件，权限针对三类用户进行设置：

    - `user (u)`：文件的所有者

    - `group (g)`：拥有该文件的组

    - `all (a)`：所有用户


    查看当前目录下所有文件的权限：`ls -la`


    访问权限也可以以八进制形式表示，即使用 0 到 7 的数字（仅需 3 位即可设置所有可能性）。每种权限（`r`、`w`、`x`）对应一个八进制值（`4`、`2`、`1`），八进制值按每个用户进行累加（u,
    g, o）。对于每个用户（u, g, o），八进制值可以取 0, 1, 2, 3, 4, 5 和 6。例如，所有类型权限（`rwx rwx`）的组合相当于八进制值
    `777`。

    - `0`：意味着无权限

    - `1`：执行权限（`--x`）

    - `2`：写入权限（`-w-`）

    - `3`：对应执行和写入权限（`-wx`）

    - `4`：对应读取权限（`r--`）

    - `5`：读取和执行权限（`rx-`）

    - `6`：对应读取和写入权限（`rw-`）

    - `7`：读取、写入和执行权限（`rwx`）


    例如：

    - `666`：赋予所有人读写权限

    - `64`：赋予所有人权限

    - `700`：赋予文件所有者权限


    当设置了特殊权限（`s` 和 `t`）时，八进制数可以是四。


    ### 文件命名规则

    旧版 Unix 限制为 14 个字符，但现在处理的长文件名为 1 到 255 个字符。禁止使用斜杠 `/`，因为它是树中的目录分隔符并代表根目录（树的顶部）。以点开头的文件是隐藏文件或隐藏文件，在不使用
    `-a` 选项的情况下，`ls` 命令默认不会显示它们，大多数命令除非明确提到，否则不会考虑它们。双点 `..` 标识父目录，点 `.` 标识当前目录或工作目录。这两个文件存在于所有目录中。因此，由于指针已经存在，无法以单个点或两个点命名文件（在同一目录下不能有两个同名文件，且无法删除指向当前目录或父目录的指针）。


    ## 第 2 章 – Linux 优势

    ![](img/image189.jpg)


    从计算机新手那里，我们经常听到“Linux 很复杂”或“Linux 是极客的东西”。当然，也有只有热情的专家才能操作的 Linux 发行版；也有一些是专门为大众设计的：Linux
    Mint、Ubuntu 及其衍生版本。你会发现 GNU Linux 非常易用，而且比大多数人认为的要友好得多。


    使用 Linux 的优势是什么？亲手操作这款软件，你就是主机的主人。除非你明确要求，否则 Linux 完全不会做任何事情，不像由系统决定一切而非用户的专有系统。你不需要被强制安装你不想要的东西，也不会强加给你一个完全全新的系统。嗯，从开始你可能什么都不需要安装的；一个月没有病毒，没有锁定，简而言之没有臃肿软件。在使用
    Windows 多年后，Linux 赋予的自由可能会令人敬畏。然而，应该理解的是 Linux 允许你操纵自己的操作系统，根据你的喜味对其进行布局，就像它赋予你做任何事情的权利一样。


    ### 安全与效率

    即使某些发行版很复杂，也有一些非常适合初者的 Linux 发行版。一切的设计都是为了让初者的生活更简单。这意味着你不需要硕士学位就能操作 Linux。此外，Linux
    提供了一个在技术和人性上都可靠的环境。当你第一次安装发行版时，最引人注目的是它朴素的外观。通常，桌面上只有两个图标：“工作区”和一个个人文件夹。甚至垃圾桶都没有！这看起来很简陋，但它也是
    Linux 体验的象征：简单以及根据需要添加东西的选择。当你穿过界面时，这种简单性一而易见。与 Windows 不同，大多数尚未精通系统的人浪费时间安装无用软件并禁用强制执行的功能；在
    Linux 下，你不需要做这些。不需要卸载一堆无用的软件。相反，你自己选择要添加的软件。准确地说，从软件库的成千上万软件中选择并安装软件没有什么都更容易了。不需要浪费时间在网上搜索所需的应用程序，这些程序很容易包含病毒或损坏你的系统文件。Linux
    最具说服力的特征之一，而且很重要，是安装软件后不需要重启。更新时也可以立即生效而无需重启系统。与 Windows 更新的缓慢沉重相比，这简直是一股清风。


    ### 安全

    在 Linux 上不需要防病毒软件。这听起来如此但事实如此，因为这个操作系统的构建目标就是尽可能安全，它是类 Unix 系统（Linux、BSD）基因中的一部分。安全性与系统的其他组件同样重要。尽管如此，大多数计算机操作人员不得不对
    Linux 的安全构建给出解释。另一方面，购买以 Linux 作为默认系统的 PC 是稀奇的。当你第一次启动新电脑时，你甚至不会考虑将启动什么样的操作系统。你唯一关注的是
    PC 启动了并且你可以使用它。然而，如果你的电脑是 Linux 操作系统，只需启动 PC 并使用它即可。总结一下，轻松安装 Linux 的最好方法是让这个程序成为硬盘上唯一的系统。大多数人会告诉你你可以和
    Windows 一起安装 Linux。我们不是在争论在此过程中是否会遇到一两个问题。如今，Linux 通常以发行版的形式出现，可以放在 DVD 或 USB
    闪存盘上。这种发行版通常可以从相应发行版的官方网站免费下载。虽然寻找软件很容易，但最大的挑战是选择最适合你电脑的发行版。如果你直接在搜索中提问“应该选择哪个
    Linux 发行版？”然后阅读网站的回应，你很快就会陷入困惑，无法得到预期的正确答案。遗憾的是，我们无法帮你决定最适合你的发行版，因为我们不知道你使用的电脑类型，也无法解读每个人的需求。然而，我建议你测试一些流行的发行版，以决定哪种方案最适合你。这个列表将非常有争议性，而且对其他人来说肯定不同。尽管
    Linux 社区努力为你提供最好的产品，遗憾的是，它并不总是有机会从计算机组件制造商那里获得所有必要信息来开发配套这些组件的驱动程序，在少数情况下，选定的发行版与你的电脑部分兼容。例如，对于未识别的
    WIFI 卡或最近开发的显卡，可能不存在驱动让它们正常工作。


