    # 选择你想要使用的 Linux 发行版


    * 必须首先安装 ISO 镜像

    * 一旦下载了 ISO 镜像，通常可以在硬盘的“下载”（Download）目录中找到它。

    * 将 Linux 放入 USB 优盘或 DVD

    * 现在我们需要将此镜像置到 DVD 或 USB 优盘上。


    根据 32 位或 64 位的选择，互联网上有多种免费工具可用于制作 USB 优盘或 DVD。UnetBootIn 可能适用于 32 位系统，而 Rufus
    或其他发行版工具适用于 64 位发行版。


    * 接下来，你将需要刻录 ISO 镜像并将你想要的发行版放入 USB 优盘。

    * 只要我们的 USB 优盘或 DVD 准备就绪，你就可以指示电脑启动安装程序。


    对于旧电脑，这是通过更改 bios 中的参数来实现；对于较新的电脑，这是在启动 PC 时按下键盘上的某个键来实现。


    ## 安装 Linux

    一旦你进入所选发行版的界面，就可以找到一个用于在硬盘上安装 Linux 的图标。注意，在安装之前你应该知道，在整个硬盘上安装 Linux 会**删除**磁盘上的所有数据。因此，要么你的电脑是专门为安装
    Linux 准备，要么你对磁盘进行了完整备份。坦率地说，所有发行版的安装过程都是相同的。唯一的区别在于 Linux Mint，在那种情况下你需要安装之前清除磁盘。


    ## 第 4 章 – Linux 特性、组件与架构

    ![](img/image323.jpg)


    Linux 操作系统是一种免费、易用且快速的操作系统。它驱动着全球的服务器和笔记本电脑，Linux 操作系统具有许多特性，其中突出的特性包括：


    ### 可移植性

    Linux 程序可以安装在任何硬件上；这并不一定取决于它的大小；这意味着它的软件可以在不同类型的硬件上以相同的方式运行。Linux 内核和其他应用程序都支持其安装。


    ### 免费可用

    Linux 源代码是开源的，是一个基于社区开发的项目。Linux 仍在演进中，多个团队正在协作以增强其功能。


    ### 通信

    该操作系统具有与其他用户通信的完美功能。用户可以通过这些网络在两个或多个计算机网络之间或在单个中心系统的网络内轻松交换程序、邮件或数据。


    ### 为多用户设计

    Linux 操作系统是一个多用户操作系统，多个用户可以同时访问系统资源，如 RAM、应用程序甚至内存。


    ### 多任务处理

    Linux 操作系统可以同时运行多个应用程序，并且它将保持活动状态。


    ### 安全可靠

    无需担心使用 Linux 操作系统，因为它通过身份验证功能为用户提供安全性，例如数据加密、密码保护和对特定文件的受控访问。Linux 用于安全性的三个概念是：

    * **身份验证**（Authentication）：这是关于声称某人的身份，并为该用户分配密码和登录名以便于访问。

    * **授权**（Authorization）：Linux 为用户发布访问限制，每个文件都有读、写和执行权限，由操作系统决定谁可以访问、修改和执行此类文件。

    * **加密**（Encryption）：这是关于将一个文件编码为不可读的格式，操作系统通过这样做帮助保持用户文件和秘密的安全。


    ### Shell

    它提供了一个出色的解释器程序，可执行 Linux 操作系统的命令。此外，它还可以用于执行其他类型的操作并调用应用程序。


    ### 提供组织良好的系统

    Linux 操作系统提供了一个对系统文件组织完美的系统。


    ### 支持自定义

    Linux 操作系统在全球范围内使用，因此提供多种语言版本。


    ### 支持安装

    此操作系统有自己的仓库，用户只需通过 Shell 或终端即可轻松下载并安装应用程序。


    ### USB 和 CD 特性

    Linux 发行版具有 USB 和 CD 选项，用户可以在不安装的情况下运行 Linux。


    ### 具有图形用户界面

    Linux 操作系统不仅有命令行，还有软件包可以使整个界面图形化。


    ## Linux 操作系统的组件和架构

    Linux 系统的核心组件包括以下内容：


    ### 内核（Kernel）

    内核可以认为是与硬件直接通信的系统核心组件。内核帮助系统资源（如磁盘、外部设备、处理器和内存）分配给在计算机上运行的程序。内核有助于每个程序相互分离，这样当程序遇到错误时，其他程序就不会受到影响。虽然用户不需要担心内核，但记录显示某些版本的内核在特定的硬件或软件上运行更好。


    ### 守护进程（Daemons）

    守护进程是 Linux 系统的另一个出色的组件；它们被称为 Daemons，因为它们对用户通常是不可见的并且静默运行。它们帮助处理如下进程：

    * 响应连接的 USB 设备

    * 为用户配置网络连接

    * 管理文件系统

    * 以及管理用户登录。


    '
- fmt: '


    [content]

    # Shell

    The shell, otherwise known as the command line, implements a textual interface
    that enables one to run programs and control the system by entering commands from
    the keyboard. Making one system do most things would be challenging without the
    help of the shell or a desktop environment. There are various shells for Linux,
    each having different features. Some Linux systems use the `bash` which is the
    Bourne again shell, and Linux shells support multitasking which runs several programs
    at a go.


    # Devices as files

    As files can be written and read in the system, so can the computer send and receive
    data, because of this Linux operating system now represents the devices connected
    to the system as files in the directory. The fact remains that these files can’t
    be moved or renamed and they are not stored on any disk. This is all about application
    programming.


    # X window server

    The window server component is a graphical replacement for the command shell.
    It aids in drawing graphics and also processing input from the mouse, keyboard,
    tablets, and other devices too. This component is network transparent, which means
    that it allows one work in a graphical environment which will be on one personal
    computer or on another remote computer which one can connect across a network.
    The most used X server today is `X.org`. Some graphical programs mostly need the
    X server to run, which means they can be used with any desktop environment or
    window manager.


    # Window manager

    The window manager component is a program that helps communicate with the X server.
    The real duty is managing windows. This component helps in bringing a window to
    the front when it is clicked, drawing the window borders, hiding it to minimize
    its program and moving it on the screen too. The trending window managers programs
    include Compiz fusion, Xfwm, KWin, and Metacity.


    # File system

    The file system is another core component of the Linux operating system. These
    are the several file systems that Linux-based distributions use. These files are
    `squashFS`, `BTRFS`, `NIFS`, `VFS`, and `EXT3/4`.


    The hard drive of the computer has a simple interface, and it only accepts commands
    like adding block block no and put it in memory address, now if one wanted to
    edit a piece of text and want to have it saved it the disk, then using block numbers
    to identify fragments of the data like the text one needed will be awkward. The
    problem will first be telling your program where to save the file using the raw
    block numbers, and again you have to be sure that the blocks are not used for
    storing other files like music collection, family photos or maybe your system’s
    kernel.


    To resolve this issue, file system was introduced. These files are organized in
    groups called directories. Each of the files is commonly identified through a
    path which explains its place in the hierarchy of the list. So in Linux we have
    the root directory which is the top-level directory. The root directory always
    has a small number of subdirectories. There are:


    *   `Bin`

    *   `Home`

    *   `Media`

    *   `Tmp`

    *   `Var`

    *   and `bin`


    # Linux Architecture

    The Linux OS works correctly on four layers which include:


    *   the hardware

    *   kernel

    *   shell

    *   and the applications

