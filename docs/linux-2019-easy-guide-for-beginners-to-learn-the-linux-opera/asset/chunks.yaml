    # Linux：2019 学者入门指南，学习 Linux 操作系统和 Linux 命令行。包含 99 个技巧和窍门。


    ## 目录

    - 介绍

    - 第 1 章 – Linux 文件系统

    - 第 2 章 – Linux 优势

    - 第 3 章 – 如何安装 Linux

    - 第 4 章 – Linux 特性、组件与架构

    - 第 5 章 – Linux 与其他系统的比较

    - 第 6 章 – Linux 技巧与窍门

    - 总结


    ## 介绍


    对大多数人来说，Linux 代表着很多：一个带有复杂命令的糟糕系统，或者是一个专家使用的操作系统，但我们认为 Linux 应该是一个基础操作系统，就像 Windows
    或 macOS X 一样。它允许你像在 Windows 下一样工作，但运行机制不同。


    多年来，Windows 操作系统因为易于使用而比 Linux 更受青，但情况已不再如此。Linux 现在拥有一套美观、舒适且易于使用的图形界面，使其与 Windows
    操作系统并平。它的命令更加简化，而且最新版本（发行版）进行了大量升级以提升用户体验。


    尽管大多数人将 Linux 视为一个独立的操作系统，但从现实意义上说，Linux 几乎无不在。它的存在无处不在，几乎所有设备都在运行 Linux。从你的安卓
    手机到智能冰箱，甚至包括军事使用的步枪。


    Linux 通常被称为内核（kernel），它在操作系统中执行着各种功能。它的功能涉及处理底层工作，包括：内存管理、外围设备访问（硬盘、CD-ROM 读器、键盘、鼠标、显卡……）、网络管理、程序之间的微处理器时间共享（多任务处理）等。


    与 Windows 强制性的 GUI（图形用户界面）不同，Linux 下有不同的图形界面，主要的有 Gnome、KDE 和 XFCE。你甚至可以在没有 GUI
    的情况下运行 Linux，或者只在需要时启动 GUI。因此，通过 Linux，你对图形用户界面拥有完全的控制权，这对于喜欢折腾的用户来说非常有趣。


    GNU 是为 Linux 内核引入了许多工具的项目，例如著名的 `GCC` 编译器以及数以千计的实用（`tar`、`tail`、`man`、`bash`……）。这些工具让用户获得了执行许多任务的许可，包括通过点击一或两个按钮而无需编写命令即可复制、格式化和删除系统文件。


    这些与 Linux 内核相关的 GNU 工具组成了 Linux 操作系统。Linux 是免费的，不同的公司接管并决定根据自己的喜好打造一个操作系统。这些被称为发行版（distributions）。其中最著名的包括
    RedHat、`Fedora`、`Mandriva`、`Debian`、`Slack`、Gentoo、Archros 等……此外，该平台赋予了用户选择软件的自由。这包括对命令以及界面的选择。意料之的是，这一特征让困于默认设置的
    Windows 用户感到惊喜。幸运的是，Linux 拥有许多 Windows 用户应该探索的优势。首先，崩溃的概率较低且支持多任务处理。通过这一点，你可以同时运行多个程序而不会遇到任何问题。Linux
    发行版（称为 distros）是 Linux 操作系统的版本，带有安装程序和管理工具，就像我们 Windows 7、8 和 10 一样。带有内核设计的 Linux
    发行版比大多数使用命令的开源 Linux 更容易操作。这种发行版消除了用户在执行操作之前编译现有代码的需求。随着时间的推移，更多的发行版由供应商开发，每种都带来了新功能。目前，有数千个发行版供选择，包括
    Ubuntu、Debian、Fedora 和 Slack。


    市场上有百万个发行版，人们很容易对选择哪种发行版感到困惑。对于任何开始学习 Linux 的人来说，考虑价格和取向是非常重要的。


    - **取向**：例如，RedHat 高度倾向于企业级服务器（数据库、Web 服务器……），Mandriva 和 Ubuntu 更多面向办公用户和互联网用户，Phonix
    设计为直接从 USB 闪盘启动等。

    - **它们的“制造”方式**：例如，RedHat 由大公司设计，而 Debian 的设计更具民主（互联网用户的参与）。

    - **价格**：有些是付费的（RedHat、Mandriva……），其他是免费的（Fedora、Debian……）。注意，你可能需要为免费发行版支付费用，但价格仅用于支付支持（CD）、运费和任何纸质说明书。没有任何阻止你自己下载并刻录它们。


    在选择软件时，很难定论。这完全取决于你的水平以及你想用它做什么。为了知道哪一个更好，我鼓励你下载各种发行版进行测试，并找到你最喜欢的一个。如果你不知道从何开始，推荐以下几个：


    - `Kali`（如果你不想在磁盘上安装任何东西）。这个版本的 Linux 直接从 CD 启动，不向磁盘写入任何内容。磁盘安装是必要的。Ubuntu 是一个很棒的发行版，可以像
    `Kali` 那样使用（不安装任何东西），也可以安装在磁盘上。它的界面非常简洁且易于使用。安装后，只需点击几次即可访问数百个额外的软件。如果你想在电脑上安装
    Linux，这就是首选发行版。有些是这些发行版的衍生版本。例如，Kali 是源自 Debian 的发行版，Morphix 是派自 Kali 的等。Ubuntu
    是最流行的 Linux 发行版。Linux 由 Linus Torvalds 创建，目的是为了应对那些大多价格过高的大型系统。GNU 项目也出于类似的动机启动（GNU
    的意思是“GNU 不是 Unix”）。Linux 被认为是一个免费的操作系统，这意味着你可以自由地使用、修改和重新发布（Unix、Windows 或 MacOS
    则不是这样）。这些 Unix 今日仍然存在并仍在售：HP-UX（惠尔-帕奇 Unix）、AIX（IBM Unix）、Solaris（Sun Unix）、IRIX（Silicon
    Graphics 的 Unix）……Unix 是一个注册商标，任何想要创建 Unix 的公司必须遵循许多严格的规则。凭借其免费、开源和高性能，Linux 与其他
    Unix 相比日益受欢迎。即使是那些开发自己 Unix 的大公司也开始了！（如 IBM、Sun、HP……）。Linux 和 Windows 并不打算重启另一个“我的系统比你的好”的争论。Linux
    和 Windows 系统之间的竞争就像 iPhone 和三星 Galaxy 版本之间的争论。它们无法消失，用户也永远不会厌倦更多。这些竞争让每个制造商都推出了改进的版本，这真正塑造了用户体验。在这里，我们不想批评或加冕某个胜者。因为从实际意义上说，两者都有自己的用途。没有哪个版本是完美的。都有自己的优缺点。然而，最好的取决于用户以及你打算如何使用。另一方面，我想提供一些可以帮助你在
    Linux 和 Windows 之间做出决定的元素。“决定”也是一个很大的词，因为没有什么能阻止你在电脑上安装两个并在之间切换！但是，必须强调的是 Linux
    需要比 Windows 更多的时间。如果你准备好花时间，学习 Linux 是非常有成就感的，它不仅让你理解正在发生什么（如果你愿意的话），最重要的是能完全按照你想做的。对于像
    Ubuntu 或 Archros 这样的发行版，如果你不想，就不必动手。


