    # Choose the Linux distribution you want to use


    * must first start by installing the ISO image

    * Once the ISO image is downloaded, it should normally be found in the "Download"
    directory of your hard drive.

    * Put Linux on a USB key or DVD

    * We must now place this image on a DVD or a USB key.


    Depending on the choice between 32 or 64 bits, various tools are available on
    the internet for free for a USB key or a DVD. UnetBootIn may be suitable for 32-bit
    and Rufus or other distributions for 64-bit distributions.


    * Next, you will have to burn the ISO image and put the distribution you want
    on the USB key.

    * As soon as our USB Key or DVD is ready, you can instruct your computers to start
    the installation process.


    For old computers, this is done by changing a parameter in the bios, for recent
    computers, it is done by pressing a key on the keyboard when starting the PC.


    ## Install Linux

    Once you have arrived in front of the office of the chosen distribution, you can
    find an icon that will be used to perform the installation of Linux on the hard
    drive. Attention, before installing you should know that, the installation of
    Linux on the entire hard disk DELETE all data on the disk. So either your computer
    is specifically reserved for Linux installation, or you have made a full backup
    of your disk. Frankly, the installation process is the same for all distributions.
    The only option that differs is in the case of Linux Mint where you need to clear
    the disk before installing.


    ## Chapter 4 – Linux Features, Components And Architecture

    ![](image323.jpg)


    Linux operating system is one operating system that is free, easy, and fast to
    use. Its powers both servers and laptops worldwide, the Linux operating has several
    features, but the outstanding ones include the following:


    ### Portability

    Linux programs can be installed on any hardware; this is not necessarily about
    its size; this means that its software can work on different types of hardware
    in the same way. Linux kernel and other application programs support its installation.


    ### Freely available

    Linux source code is an open-source, and it’s a community-based development project.
    Linux is still evolving, and multiple teams are working in collaboration to boost
    its capability.


    ### Communication

    This operating system has a perfect feature for communicating with other users.
    Users can easily exchange program, mail, or data between two or more computer
    network or within a network of a single central system through these networks.


    ### Made for multi-users

    Linux operating system is a multiuser operating system, that several users at
    the same can have accessibility to system resources like the RAM, Application
    programs, and even the memory.


    ### It’s multitasking

    Linux operating system can be used to run multiple applications at the same time,
    and it will remain active.


    ### Is safe and secure

    There is no fear of using Linux OS because it offers users security using authentication
    features such as encryption of data, password protection, and controlled access
    to specific files. The three concepts used with Linux for security are:

    * **Authentication**: this is about claiming the person that one is and assigning
    such a user a password and login name for easy access.

    * **Authorization**: Linux issues access limits to users, there’s the read, write
    and execute permissions for each file and the OS will decide who access, modify
    and execute such a file.

    * **Encryption**: this is about encoding one’s file into an unreadable format,
    so the OS does this to help keep user files and secrets safe.


    ### Shell

    It offers an excellent interpreter program which can be used to carry out commands
    of the Linux OS. Additionally, it can be used to do other types of operations
    and call application.


    ### Offers well-arranged system

    Linux operating system provides a perfect system whereby system files are arranged.


    ### Supports custom

    Linux OS is used around the world and as such, it is available in several languages.


    ### Supports installation

    This OS has its own repository that users can easily download and install applications
    by just Shell or terminal.


    ### USB and CD feature

    Linux distributions have USB and CD option users can run Linux without installing
    it.


    ### It has graphical user

    Linux OS is not only a command, but it also has packages to make the whole graphical.


    ## Components and Architecture of Linux operating system

    The core components of a Linux system include the following:


    ### Kernel

    Kernel can be said to be the central component of the system that communicates
    directly with the hardware. The kernel helps allocates system resources such as
    disk, external devices, processor and memory to the programs that are running
    on the computer. Kernel aid in separating each program from one, so that when
    a program encounters an error, other programs are not affected. Though users don’t
    need to worry about the kernel it’s on record that some versions of kernel perform
    better with specific hardware or software.


    ### Daemons

    A daemon is another excellent component of the Linux OS; it is called Daemons
    because they are mostly invisible to the user and run silently. They help processes
    like:

    * Responding to connected USB devices

    * Configuring network connections for users

    * managing files system

    * And also managing user’s login.

