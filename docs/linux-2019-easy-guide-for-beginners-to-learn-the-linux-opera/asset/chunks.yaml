    # 系统命令


    `sudo`这用于以 root 身份执行命令。`sudo su`切换到 root 身份并保存状态。

    `chmod`更改文件或文件夹的权限。它修改了用户对文件的访问权限。

    `Chown`更改文件/文件夹的所有者（只能在 root 下使用）- `-R` 选项用于递归。


    ## 用户命令


    * `adduser`添加一个用户。

    * `password`更改用户的密码，例如 `passwd roger`。

    * `deluser`删除一个用户。

    * `addgroup`创建一个组。

    * `usermod`修改一个用户（选项：`-l` 更改名称，`-g` 分配一个组，`-G` 分配多个组（用逗号分隔））。

    * `del group`删除一个组。

    * `groups`检查用户加入了哪些组。

    * `chgrp`更改文件所属的组（等同于 `chown user: group`）。


    ## CPU 和内存使用


    * `free`显示被文件占据的空间和剩余的空内存。

    * `load`以图的形式显示 CPU 负载。

    * `ps -ef`查看所有启动的进程。或者，可以使用 BSD 语法 `ps aux`。

    * `ps -ejH`以树状显示进程。

    * `Ps -ul`列出指定用户启动的进程，例如 `ps -u buzut`。

    * `top`实时显示系统活动：负载、内存、SWAP、进程…… `top` 的优点是几乎随处可安装。

    * `htop`是 top 的改进版本，图形化更多，信息更清晰，并且可以根据某些标准对显示进行排序。

    * `glance`类似于 top 和 htop，`glance` 是你机器的仪表板，因为它一眼汇总了所有重要指标：CPU、负载、内存、交换、i/o 磁盘、磁盘填充率。

    * `iotop`是 top 的变体，正如其名称所示，它提供了 I/O 磁盘的实时预览。


    ## 系统


    * `who`此命令用于显示连接到系统的人以及他们正在做什么。

    * `who`用于显示谁连接到了你的系统。

    * `date`显示日期时间。

    * `kill`杀死程序的所有实例。

    * `reboot`重启操作系统。

    * `shutdown`计划重启或停止。关机这与 shutdown 类似，但 `Poweroff` 带有额外的选项可以注销或重启系统。

    * `halt`允许用户“关闭”系统。然而，使用此命令后系统可能保持电源开启（取决于之前的选项和系统默认设置）。

    * `last`此命令显示连接历史。

    * `lsof`列出打开的文件。此命令对于查看哪个文件正在使用非常有用。

    * `hostname`根据 `/etc/hostname` 文件中的内容显示机器的主名。

    * `uname`关于系统和内核的信息。`-r` 选项允许获取正在使用的内核版本。

    * `lsb_release``lsb_release -a` 提供你正在使用的 Linux 发行版的所有信息。

    * `lshw`提供系统硬件的详细信息，如内存配置、固件版本、主板配置……使用 `-short` 选项将获得更易读的输出。`-c` 选项也用于了解尚未配置的网络接口名称。

    * `lsblk`列出所有连接到硬盘的设备。

    * `lspci`列出所有 PCI 设备。

    * `lsusb`列出所有 USB 设备。

    * `sysctl`此命令用于查看和配置内核（热）设置。

    * `dmidecode`读取 bios 信息。

    * `dmesg`显示内核缓冲区中的消息。


    ## 运行多个命令


    `|`管道，将前一个命令的输出传递给后一个命令。

    `&&`只有在前一个命令执行成功时才执行后一个命令。

    `;`无论前一个命令执行与否都执行后一个命令。

    `>`重定向输出到文件（覆盖原有内容）。

    `>>`将输出追加到文件末尾。


