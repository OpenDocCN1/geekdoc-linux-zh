    ### New Version in a Snap

    On Linux, if you want to change the version, for example, to have a recent operating
    system, most distributions are to be reinstalled in full. Under Windows, this
    operation causes stress and takes a lot of time. To change Linux version is so
    easy that it can easily become a routine. To perform this in Linux Mint, just
    go to the update manager to start the installation of the latest version available.
    It is also interesting to note that installing a recent version does not mean
    changing the whole software. Linux offers operating systems light enough to run
    on computers with less than 4 GB of RAM. Generally, consider that with present
    Linux, an entry level computer with 4 GB of RAM is almost oversized for common
