    `/dev/cdrom`. There is a symbolic link between the `/dev/cdrom` file and the `/dev/cdrom0`
    device name. The removable cartridge drives are mounted as external hard drives.
    You first have to partition the drive with `fdisk`, then create a partition table
    and install a file system with `mk2fs`, then you have to create the mount point
    with `mkdir` and mount the partitions with `mount`. Finally, add a line in the
    file `/etc/fstab` so that the device is mounted at each startup.


    ### Access Rights

    Access rightsrights or permissions allow certain users or groups of users to restrict
    access to certain files or directories. There are three types of access rights:

    - `read (r)`: for reading access to the file (allows the printing, displaying
    and copying of a file, and allows traversing the directory or displaying files
    in a directory)

    - `write (w)`: for write access to the file (allows the modification of a file,
    and allows the deletion of a file or the saving of a file in a directory)

    - `execute (x)`: for the possibility of executing the file (allows the execution
    of a program, an executable, and allows to access the management information of
    the files of the directory, like the inode, the table of the rights ...)


    For each file, access rights are set for three categories of users:

    - `user (u)`: the owner of the file

    - `group (g)`: the group that owns the file

    - `all (a)`: all users


    To view the rights of all files in the current directory: `ls -la`


    The access rights can also be expressed in their octal form, that is say using
    a number from 0 to 7 (the right possibilities which can be fixed with only 3 bits).
    Each of the rights (`r`, `w`, `x`) corresponds to an octal value (`4`, `2`, `1`),
    the octal values are accumulated for each user (`u, g, o`). For each user (`u,
    g, o`), the value in octal can take the values 0, 1, 2, 3, 4, 5 and 6. For example,
    the combination of all rights for types (`rwx rwx`) is equivalent to the octal
    value `777`.

    - `0`: means no rights

    - `1`: is the executable right (`--x`)

    - `2`: is the write right (`-w-`)

    - `3`: corresponds to the execution and writing rights (`-wx`)

    - `4`: corresponds to the right of reading (`r--`)

    - `5`: is the read and execute rights (`rx-`)

    - `6`: corresponds to the rights of reading and writing (`rw-`)

    - `7`: read, write and execute rights (`rwx`)


    For example:

    - `666`: gives the right to all read and write

    - `64`: gives rights to all

    - `700`: gives rights to the file owner


    The octal number can be four digits when the super sets the special rights (`s`
    and `t`).


    ### File Naming Rules

    Old Unix limited to 14 characters, but nowadays long file names are handled from
    1 to 255 characters. The slash `/` is forbidden because it is the directory delimiter
    in the tree and represents the root, the top of the tree. Files whose names begin
    with a period are hidden or hidden files, they do not appear by default with the
    `ls` command without the `-a` option, and most commands do not take them into
    account unless mention it explicitly. The double dot `..` identifies the parent
    directory and the dot `.` identifies the current directory or working directory.
    These two files exist in all directories. It is therefore not possible to name
    a file with a single point or with two points since the pointers already exist
    (it is not possible to have two files with the same name in the same directory,
    and it is not possible to delete the pointer to the current directory or the parent
    directory).


    ## Chapter 2 – Linux Advantage

    ![](image189.jpg)


    From Computer novice, we often hear things like "Linux is complicated", or "Linux
    is a geek thing". If there are of course Linux distributions that only passionate
    experts are able to operate; There are also some that are specifically intended
    for the general public: Linux Mint, Ubuntu and its derivatives. You will discover
    that GNU Linux is very easy to use and much more user-friendly than what most
    people think.


    What are the advantages of using Linux? Hands-on this software you are the master
    of the board. Linux will do absolutely nothing unless you ask it explicitly, unlike
    a proprietary system that decides everything instead of the user. You are not
    mandated to install what you do not want, nor will a completely new system be
    imposed on you that is. Well, you will probably not have anything to install from
    the start; no virus for a month, no locks, in short no bloatware. After years
    of using Windows, the freedom that Linux grants can be scary. However, it should
    understood that Linux allows you to manipulate your operating system, to make
    it space arranged to your taste, as much as it gives you the right to do anything.


    ### Safety and Efficiency

    Even some distributions are complicated, there are some Linux distributions that
    are very suitable for beginners. Everything is designed to make life easier for
    beginners. This means that you will not need a master''s degree to operate Linux.
    Moreover, Linux offers a reliable environment, technically and human. When you
    are installing a distribution for the first time, the most striking thing about
    it is its bare look. Usually, only two icons are present on the desktop: the "workspace"
    and a personal folder. Not even the trash! It may seem austere but it is also
    the symbol of the Linux experience: simplicity and the choice to add things according
    to your needs. This simplicity is immediately visible when you go around the interface.
    Unlike Windows, where most people who have not yet mastered the system waste time
    installing useless software and disabling imposed functions; under Linux you don''t
    have to do this. No need to uninstall a useless bunch of software. Rather, you
    choose the software to add yourself. Precisely, nothing is easier than to install
    software chosen among the thousands available in a software library. No need to
    waste time searching the net for the desired application that could as easily
    contain a virus or corrupt files in your system. The most eloquent feature of
    Linux, and not least, is that no restart is necessary after installing software.
    This is so for updates that are operational instantly without rebooting the system.
    A breath of fresh air compared to the slow heaviness of Windows updates.


    ### Security

    There is no need for anti-virus when you are on Linux. This seems'' but is true
