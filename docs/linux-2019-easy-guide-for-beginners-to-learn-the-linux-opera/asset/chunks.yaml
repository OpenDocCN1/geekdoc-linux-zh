- fmt: "\n# Linux: 2019 Easy Guide for Beginners to Learn the Linux Operating System\
    \ and Linux Command Line. 99 tips and tricks included.\n\n## CONTENTS\n- [Introduction](#\n\
    - [Chapter 1 – Linux File System](#\n- [Chapter 2 – Linux Advantage](#\n- [Chapter\
    \ 3 – How To Set Up Linux](#\n- [Chapter 4 – Linux Features, Components And Architecture](#\n\
    - [Chapter 5 – Comparison Between Linux And Other Operating system](#\n- [Chapter\
    \ 6 – Linux Tips and Tricks](#\n- [Conclusion](#\n\n## Introduction\n\nTo most\
    \ people, Linux means a whole lot of things: A horrible system with complicated\
    \ commands or an operating system for the experts but we like to see Linux as\
    \ a basic operating system, just like Windows or macOS X. It allows you to work\
    \ as you would under Windows. But it works differently.\n\nFor several years,\
    \ Windows OS were heavily favored than Linux because of their ease of use but\
    \ this is no longer the case. Linux now has a nice, comfortable and easy-to-use\
    \ graphical system that puts it on par with Windows operating system. The commands\
    \ are more simplified and a lot of upgrades have gone into latest versions (distribution)\
    \ to improve users experience.\n\nEven though most people see Linux as an independent\
    \ operating system, in the real sense, Linux is pretty much everything. Its presence\
    \ is felt everywhere and almost all devices work with Linux. From your Android\
    \ phone to smart fridges and even rifles used by the military.\n\nOften referred\
    \ to as the kernel, Linux performs a whole of function in the operating system.\
    \ Its function involves taking care of dirty work which includes: memory management,\
    \ access to peripherals (hard disk, CD-ROM reader, keyboard, mouse, graphics card\
    \ ...), network management, time sharing microprocessor between programs (multi-task),\
    \ etc.\n\nUnlike Windows whose GUI is imposed on you, there are different graphical\
    \ interfaces under Linux, the main ones being Gnom, KDE and XFCE. It's even possible\
    \ to run Linux without a GUI, or even launch the GUI only when you want. Hence,\
    \ with Linux, you have total control over the graphical user interface which is\
    \ interesting for users who like to tweak things.\n\nGNU NU is a project that\
    \ has brought lots of utilities to the Linux kernel, such as the famous `GCC`\
    \ compiler, and thousands of utilities (`tar`, `tail`, `man`, `bash` ...). These\
    \ utilities give users the license to perform a whole lot of tasks which includes\
    \ copying, formatting and removing files from the system by simply clicking one\
    \ or two buttons without writing commands.\n\nThese GNU utilities associated with\
    \ the Linux kernel, make up Linux operating system. Linux is free, different companies\
    \ took over and decided to forge an operating system to their liking. These are\
    \ called distributions. Among the best known include RedHat, `Fedora`, `Mandriva`,\
    \ `Debian`, `Slack`, `Gentoo`, `Archros` ... In addition, this platform gives\
    \ users the freedom to make a choice of software. This includes making a choice\
    \ of commands as well as interface. Predictably, this feature comes as a surprise\
    \ to Windows users who are stuck with a default. Fortunately, Linux comes with\
    \ a host of advantage windows users should explore. First, the possibility of\
    \ crashing is less and supports multitasking. With this, you can run several programs\
    \ at the same time without encountering any problem. Linux distributions also\
    \ called distros are versions of Linux operating system that comes with installation\
    \ programs and management utilities just as we have Windows 7,8 and 10 on OS.\
    \ Linux distributions designed with kernels are often easier for users to operate\
    \ than open-source Linux which most uses commands. This distribution eliminates\
    \ the needs for users to compile existing codes before an action is performed.\
    \ As the years roll by, more distribution are developed by vendor each bringing\
    \ a new feature to the table. Currently, there are thousands of distributions\
    \ to choose from and they include Ubuntu, Debian, Fedora and Slack. \n\nWith millions\
    \ of distributions in the market, one is bound to easily confused on the type\
    \ of distributions to choose. For anyone getting started with Linux, it's important\
    \ to put price and orientation into consideration.\n\n- **Orientation**: For example,\
    \ the RedHat are highly oriented corporate servers (databases, web servers ...),\
    \ Mandriva and Ubuntu are more oriented towards office users and Internet users,\
    \ Phonix is designed to start directly at from USB key, etc.\n- **The way they\
    \ are \"fabricated\"**: for example, the RedHat is designed by a big company,\
    \ while the Debian is designed more democratic (participation of Internet users).\n\
    - **Price**: Some are paid (RedHat, Mandriva ...), others free (Fedora, Debian\
    \ ...). Note that you may have to pay for free distributions, but the price is\
    \ only used to cover the support (CD), shipping costs and any paper manuals. Nothing\
    \ prevents you from downloading and burning them yourself.\n\nWhen it comes to\
    \ choosing software, it's hard to say. It all depends on your level and what you\
    \ want to do with it. To know which one is better, I encourage you to download\
    \ various distributions to test them and find the one you like most. If you do\
    \ not know where to start, recommend the following:\n\n- `Kali` (if you do not\
    \ want to install anything on disk). This version of Linux starts directly from\
    \ the CD and writes nothing to disk. Installation is necessary on disk. own- `Ubuntu`\
    \ is a great distribution, which can either used as `Kali` (without installing\
    \ anything) or installed on disk. The interface is very clean and simple to use.\
    \ Once installed, you can access hundreds of additional software in a few clicks.\
    \ This is distribution if you want to install Linux on your computer. Some are\
    \ derivatives of these distributions. For example, Kali is a distribution derived\
    \ from Debian, and Morphix is derived from Kali, etc. Ubuntu is the most popular\
    \ Linux distribution. Linux was created by Linus Torvalds in response to the big\
    \ systems which mostly overpriced. The GNU project also started on a similar motivation\
    \ (GNU means \"GNU is Not Unix\"). Linux is said to be a free operating system,\
    \ which means that you are free to use, modify and re-distribution (which is not\
    \ the case with Unix, Windows or MacOS). These Unix still exist today and are\
    \ still sold: HP-UX (Hewlett-Packard Unix), AIX (IBM Unix), Solaris (Sun Unix),\
    \ IRIX (Unix of Silicon Graphics) ... Unix is a registered trademark, and any\
    \ company that wants to create a Unix must follow a number of strict rules. With\
    \ its free, open and performance, Linux is gaining popularity compared to other\
    \ Unix. Even the big companies that were doing their own Unix started! (like IBM,\
    \ Sun, HP, ...) Linux and Windows do not intend to relaunch another debate \"\
    my system is better than yours\". The rivalry between Linux and Windows System\
    \ is just like the debate between iPhones and Samsung Galaxy versions. They just\
    \ can't go away and users are never tired of asking for more. These competition\
    \ have seen improved versions from every manufacturer which really shaped users\
    \ experience. Here, we do not intend to criticize or crown one winner. Because\
    \ in the actual sense, both have their own use. No version is perfect. All has\
    \ its own pros and cons. The best, however, depends on the user and what you intend\
    \ to use it for On the other hand, I just want to give some elements that can\
    \ help you decide between Linux and Windows. \"Decide\" is also a big word, since\
    \ nothing prevents you from installing the 2 on your computer and switch from\
    \ another! However, it must emphasize that Linux requires more time than Windows.\
    \ If you are not ready to spend time, learning Linux is very gratifying not only\
    \ allows you to understand what is going on (if you wish), but above all to do\
    \ exactly what you want. Not with distributions like Ubuntu or Archros do not\
    \ have to put your hands if you do not want it.\n\n## Chapter 1 – Linux File System\n\
    \nAnyone who uses a computer must inevitably use files to do his whether he is\
    \ a simple user of Word or Excel or is a programmer of software. Moreover, many\
    \ people judge the environment on the quality of their file system, structure\
    \ and reliability. Today, interfaces that are more and similar to each other offer\
    \ a very good ability to manipulate files, to name them and authorize all kinds\
    \ of operations. These interfaces hide the internal structure of files and let\
    \ us think they are all similar, hidden behind folders and icons.\n\nA file system\
    \ is a data structure for storing information and organizing them in files on\
    \ the called secondary memory (hard disk, diskette, CD-ROM, key USB, etc.) For\
    \ the moment, the various operating systems adopt their own solutions for safeguarding\
    \ information; although this is almost exclusive through files that may contain\
    \ programs, data and other types of information. The operating system provides\
    \ special operations (system calls) to create, destroy, read, and so on. All operating\
    \ systems are striving to achieve independence from peripherals. Operating systems\
    \ consider the file system essentially as an interface with relatively static\
    \ objects. This interface has its own structure, often hierarchical, to designate\
    \ a set of data, but also devices. The purpose of the file system interface is\
    \ to visualize the objects it covers as much as possible, so the Linux and Windows\
    \ / Dos systems also name their objects in a uniform way. Checking Files On Linux\n\
    \nUnder LIN, the command `ls -` is used to check the type of files: the first\
    \ character of the result gives us this information:\n- `-` means ordinary files\n\
    - `d` means directories\n- `c` means character devices\n- `b` means block\n\n\
    Modern operating systems adopt a hierarchical structure of files. Each file belongs\
    \ to a group and each group belongs to a higher order group. These groups are\
    \ called directories or folders. The appearance of the general structure of a\
    \ file system takes the appearance of a tree, formed from a \"root\" directory\
    \ covering devices and especially one or more disks. In each of the directories,\
    \ we can find other directories as well as ordinary data files.\n\n### The File\
    \ System\n\nA file system is a data structure for storing information and organizing\
    \ them in files on the called secondary memory (hard disk, diskette, CD-ROM, key\
    \ USB, etc.)\nFor the moment, the various operating systems adopt their own solutions\
    \ for safeguarding information; although this is almost exclusive through files\
    \ that may contain programs, data and other types of information. The operating\
    \ system provides special operations (system calls) to create, destroy, read,\
    \ and so on. All operating systems are striving to achieve independence from peripherals.\
    \ Operating systems consider the file system essentially as an interface with\
    \ relatively static objects. This interface has its own structure, often hierarchical,\
    \ to designate a set of data, but also devices. The purpose of the file system\
    \ interface is to visualize the objects it covers as much as possible, so the\
    \ Linux and Windows / Dos systems also name their objects in a uniform way.\n\n\
    ### Checking Files On Linux\n\nUnder LINUX, the command `ls -` is used to check\
    \ the type of files: the first character of the result gives us this information:\n\
    - `-` means ordinary files\n- `d` means directories\n- `c` means character devices\n\
    - `b` means block\n"
