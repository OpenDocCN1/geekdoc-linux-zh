  trans: '


    此命令允许你搜索命令历史记录。通常，你使用向上方向键来返回已输入过的命令。而通过 `ctrl+ r`，你可以对这些历史进行搜索：按下 `ctrl+ r`，然后输入你想搜索的命令片段。


    ! !


    根据 bash 快捷键的实际用法，双感叹号允许你重新运行上上条命令。这无疑是本节中最复杂的命令，特别是对初学者而言。


    `for` 是一个循环指令。循环用于对变量中的所有元素多次执行某操作。例如，我们可以轻松地重命名目录中的所有文件，将空格替换为连字符，或将逗号替换为句号。


    - `ctrl + z`：在 Windows 上，这用于撤销操作；但在 Linux 上，它用于暂停当前进程。

    - `bg`: 用于从后台暂停的进程中恢复。

    - `fg`: 用于恢复后台运行的进程（如果同时运行了多个进程，使用 `fg %n`）。

    - `at`: 用于设定一个一小时后运行的事件，例如 `at 18:22` 或 `at now`。

    - `q`: 用于列出待处理的任务。

    - `atrm`: 删除任务。

    - `sleep`: 此命令允许在两个命令执行之间进行暂停。示例：`touch gt.txt && sleep 10 && rm gt.txt`


    `crontab` 实际上是一个读取并修改名为 "crontab" 文件的命令。以下是最常用的选项：


    - `e`: 修改 crontab。

    - `l`: 显示当前的 crontab。

    - `r`: 移除你的 crontab。注意，删除操作是立即生效且无需确认的！


