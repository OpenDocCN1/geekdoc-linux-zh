  - [`en.wikipedia.org/wiki/Comparison_of_X_Window_System_desktop_environments`](http://en.wikipedia.org/wiki/Comparison_of_X_Window_System_desktop_environments)—一份极其精彩的可用桌面环境列表，并附带功能对比。\n\
  \n# 第 8 章 游戏\n\n## 本章内容\n- Ubuntu 游戏\n- 为 Ubuntu 安装游戏\n- 玩 Windows 游戏\n- 参考文献\n\n\
  玩游戏是计算的一个趣味部分。对于我们的一些人来说，游戏是任何操作系统吸引力的很大一部分，至少在办公或企业环境之外是如此。从让数百万午茶时间娱乐的简单纸牌游戏，到遍布全球的玩家深度参与其中的第一人称射击游戏，Linux\
  \ 提供了一个可能会让你大惊喜的高质量游戏平台。\n\n在本章中，我们将探索一些可以在 Ubuntu 中轻松下载和安装的常用游戏。\n\n## Ubuntu 游戏\n\
  标准桌面版 Ubuntu 默认预装了极少数游戏，大部分是用来在任务之间转移转移你几分钟注意力的简易内容——例如纸牌牌或数独等游戏（请参见图 8.1）。这些游戏很容易尝试和学习，你可能会发现它们很有趣。\n\
  \n![Image](img/08fig01.jpg)\n\n图 8.1 “应用程序”下的“游戏”分类中列出的默认游戏。\n\n我们大多数喜欢游戏的人都想找到更多内容。幸运的是，Linux\
  \ 游戏并非止步于此——几个热门游戏具有原生的 Linux 支持。我们在这里讨论我们喜爱的少数几个游戏。\n\n### 模拟器\n此外，模拟器允许你将在 Linux\
  \ 下原生运行经典游戏，例如 LucasArts 的 ScummVM 游戏（如《猴子岛之谜》）。有针对 DOS、NES、SNES 等许多平台的的模拟器。如果你对此感兴趣，可以在网上搜索\
  \ `Dgen/SDL`、`DosBox`、`xtrs`、`FCEUltra`、`GnGeo`、`SDLMama`、`ScummVM` 和 `Stella`。模拟器的文档参差不齐，但如果你足够幸运，就可以玩你喜欢的已不存在或当前操作系统版本不支持的主机或操作系统的旧游戏。\n\
  \n#### 安装专有视频驱动\nLinux 用户的一个主要不满点是让现代 3D 显卡工作非常困难。幸运的是，AMD（已 defunct ATI 品牌的所有者）和\
  \ Nvidia 都支持 Linux，尽管是使用闭源驱动。这意味着 Ubuntu 发行时并未激活任何显卡的原生 3D 驱动程序，但它们可以很容易安装，通常在安装操作系统期间或之后不久即可。大多数视觉效果华丽的游戏都需要这些驱动程序。\n\
  \nNvidia 和 AMD 都生产专有驱动，这意味着源代码不是公开的，也不供外部开发者读取或修改。由于由于，某些 Linux 发行版很难将它们作为标准安装的一部分包含。Ubuntu\
  \ 社区采取了务实的方法，在 Ubuntu 主主发行版中包含了 Nvidia 和 AMD 驱动程序，但默认禁用了。这样，任何拥有 Nvidia 或 AMD 硬件并想这样做的人都可以激活这些驱动程序以利用其功能。\n\
  \n> 注意\n> 如果你认为专有驱动是 Linux 上的唯一途径，我们应该提到，目前有大量开发正在为较旧的显卡提供完全免费且开源的驱动。Ubuntu 会为你的系统选择最佳的“免费”驱动，并在你需要时允许切换到专有驱动。虽然开源驱动提供了\
  \ 3D 加速，但这种支持并不总是扩展到完整的功能集，也不支持较新的显卡。\n\n如果你需要，只需在 Dash 搜索中搜索“附加驱动”（additional drivers）即可轻松激活专有驱动。\n\
  \n安装不同的硬件驱动程序需要超级用户权限，因此会运行确认检查以确定你是否有权限，然后要求你输入密码。在“硬件驱动”对话框打开后，阅读描述并寻找适合你硬件的推荐选项，选中它，并点击右下角的“激活”（Activate）。Ubuntu\
  \ 会确认你想使用专有驱动，如果你同意，它会自动下载并配置相关驱动程序。如果你想恢复到开源驱动，执行相同的操作，但选择已激活的驱动并点击右下角的“移除”（Remove），如图\
  \ 8.2 所示，就在与之前的“激活”按钮相同的位置。\n\n![Image](img/08fig02.jpg)\n\n图 8.2 使用“附加驱动”管理器激活或禁用适用于你显卡的相应专有显卡驱动。\n\
  \n### 在 Ubuntu 中安装游戏\n在本节中，你将学习如何为 Ubuntu 安装一些流行的游戏，所有这些游戏都可以使用 Ubuntu 软件轻松安装，在“游戏”分类下还列出了数百种其他游戏。除了常见的射击游戏外，你还会发现一两款侧重于策略的游戏。\n\
  \n#### Warsow\nWarsow 是一款免费且节奏快速的第一人称射击 `FPS` 游戏，适用于 Windows、Mac OS X 和 Linux。Ubuntu\
  \ 社区的成员已经打包了该游戏，让 Ubuntu 用户可以从软件存储库直接轻松获取。游戏涉及快速移动、在敌人之前获取补给和武器，以及尝试安放和偷取敌人的旗帜。你可以在\
  \ 3D 环境中跳跃、冲刺、躲避甚至爬墙。图 8.3 显示了一个刚开始的游戏，有很多武器、平台、坡道以及可见补给。\n\n![Image](img/08fig03.jpg)\n\
  \n图 8.3 Warsow 是最新最快的 FPS 之一。\n\n#### Scorched 3D\nScorched 3D 基于一个名为《焦土地球》的老 DOS\
  \ 游戏。目标和玩法相似：有多个玩家，你输入目标详情使用各种导弹类武器摧毁其他玩家。每次获胜都会积分并在回合结束时购买新武器。这次有大量的武器可用，而且游戏体验完全是惊艳的\
  \ 3D，如图 8.4 所示。\n\n![Image](img/08fig04.jpg)\n\n图 8.4 Scorched 3D 的运行画面。\n\n####\
  \ Frozen Bubble\n\n\n\n\nFrozen Bubble 是一款有趣的小游戏，它画面精美、音乐动听，且操作简单。你可以单人玩，也可以与其他玩家对战。游戏的目标是在限定的时间内，使用你的彩色弹珠击掉上方的弹珠。你必须一次击中至少两个与你射出的球颜色相同的球，弹珠才会掉落；否则，你的击中将加入上方的“动物园”，并某种程度上加速了你的终结，如图\
  \ 8.5 所示。Frozen Bubble 还有许多细节，但即便有了这些细节，孩子也足以轻松上手，并且足以吸引大多数成年人的兴趣。\n\n![Image](img/08fig05.jpg)\n\
  \n图 8.5 向左或向右移动\n\n### SuperTux\n\n我们许多人成长于一个游戏性比画面更重要的时代。尽管如此，我们仍然喜欢华丽漂亮的游戏。SuperTux\
  \ 是一个对马里奥式 2D 横版滚球游戏的怀旧，你可以跳跃、奔，并在获得合适的道具时偶尔进行射击。这一次，你的英雄是 Linux 企鹅，有超过 25 个关卡可用，还有一个关卡编辑器供你创建自己的关卡。如果你喜欢奔跑、跳跃、击中头部来获取金钱以及敌人，《figureach-och6\
  \ 提供了基础的外观和感受 <！？unexpectedtext> 。\n\n ![image](img/chapter)：\n  尽管这个游戏的界观带回了童年时代但毫无疑问是充满趣味的。\n\
