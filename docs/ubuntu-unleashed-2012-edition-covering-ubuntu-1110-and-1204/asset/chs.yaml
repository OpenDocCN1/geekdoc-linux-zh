  \n## 第 18 章. 使用 SSH 和 Telnet 进行远程访问\n\n***\n\n### 本章\n\n- 设置 Telnet 服务器\n- Telnet\
  \ 对比 SSH\n- 设置 SSH 服务器\n- SSH 工具\n- 虚拟网络计算\n- 参考文献\n\n***\n\n远程控制你的系统是使用 Ubuntu\
  \ 能做的最酷的事情之一：只需少量配置，你就可以从任何 Linux 机器以各种方式连接到另一台计算机。如果你只是想快速检查某些东西，或者带宽有限，你可以选择仅使用命令行，但你也可以直接连接到\
  \ X 服务器并获得完全图形控制。\n\n理解可用工具的选择在很大程度上是一堂历史课。例如，Telnet 是早期通过命令行连接到另一台计算机的方法，但从那时已被\
  \ Secure Shell (SSH) 取代。这并不是说你应该忽略 Telnet；你需要知道如何使用它，以便将其作为备选。然而，SSH 是首选的，因为它更安全。我们在本章中将涵盖这两者。\n\
  \n### 设置 Telnet 服务器\n\nTelnet 是一个较旧的服务。客户端是默认安装的一部分，但默认不激活。服务器不是默认安装的一部分。这是因为 Telnet\
  \ 传输和接收的所有内容都是明文，包括密码和其他敏感信息。Telnet 通常不是通信的好选择。然而，你可能在某些情况下想要安装 Telnet，例如连接到某个没有提供\
  \ SSH 的设备，例如嵌入式系统，在这些系统中较小的 OS 占用很重要，且没有更安全的通信方法。此外，有时当你在睡眠不足或咖啡因摄入过量时配置网络连接；你明天不得不重做。\n\
  \n\n\n\n\n首先，配置你的防火墙允许通过端口 `22` 进行连接。如果此端口被拦截，你将无法使用 `SSH`。请参考第 19 章获取相关操作帮助。\n\n\
  SSH 存在两个不同的版本：`SSH1` 和 `SSH2`。后者更新、更安全、功能更多，并且是 Ubuntu 的默认设置建议禁用对 `SSH1` 客户端的支持，以防旧版客户端进行连接。这在\
  \ `/etc/ssh/sshd_config` 文件的这一行是默认完成的：\n\n```\nProtocol 2\n```\n\n如果你没有其他选择，并且必须允许旧版客户端连接，请添加新行：\n\
  \n```\nProtocol 1\n```\n\n## SSH 工具\n\n让许多人惊讶的是，OpenSSH 实际上包含了一套工具。我们已经见过了 `ssh`（用于连接到其他机器的\
  \ Secure Shell 命令）和 `sshd`（用于接受入站 SSH 连接的 SSH 服务器守护进程）。然而，还存在 `sftp`，它是 `ftp`、`scp`\
  \ 和 `rcp` 的替代品。\n\n你可能已经熟悉 `ftp` 命令，因为它是处理 FTP 文件传输的最低通用系统。但与 Telnet 一样，`ftp` 是不安全的：它以明文形式跨越网络发送你的数据，任何人都可以嗅探你的数据包以提取出用户名和密码。SSH\
  \ 的替代品 `sftp` 将 FTP 流量置于 SSH 链路之上，从而确保了安全性。\n\n`rcp` 命令对你来说可能是新的，这很大程度上因为它已经不再经常使用了。在过去，`rcp`\
  \ 是将单个文件复制到另一个服务器的主要方式。与 `ftp` 类似，`scp` 通过直接在安全的 SSH 连接上传输数据来取代了 `rcp`。`sftp` 和\
  \ `scp` 的区别在于，前者允许你同时队列并复制多个文件，而后者通常只用于发送一个文件，尽管 `scp` 可以配合 `-r` 选项一次发送整个目录。详情请参阅手册页（man\
  \ page）。\n\n### 使用 `scp` 在机器之间复制单个文件\n\n`scp` 命令最基本的用法是从当前机器复制文件到远程机器。你可以使用以下命令实现：\n\
  \n```\nmatthew@seymour:~$ scp test.txt 192.168.1.102:\n```\n\n第一个参数是你想发送的文件名，第二个参数是你想要将其发送到的服务器。注意\
  \ IP 地址末尾有一个冒号（`:`）。这是你可以指定文件复制确切位置的地方。如果你在冒号后什么都没写（如上例所示），`scp` 将将文件复制到你的 `/home`\
  \ 目录。与 SSH 一样，`scp` 在复制发生前会提示你输入密码。\n\n你可以重写之前的命令，以便从本地机器复制 `test.txt` 并将其保存为服务器上为\
  \ `newtest.txt`：\n\n```\nmatthew@seymour:~$ scp test.txt 192.168.1.102:newtest.txt\n\
  ```\n\n或者，如果你有一个想要保存文件的目录，可以这样指定：\n\n```\nmatthew@seymour:~$ scp test.txt 192.168.1.102:subdir/stuff/newtest.txt\n\
  ```\n\n到目前为止的三个命令都假设你在本地机器上的用户名与远程机器上的用户名相同。如果并非如此，你需要在远程地址之前指定用户名，如下所示：\n\n```\n\
  matthew@seymour:~$ scp test.txtusernameewtest.txt\n```\n\n你可以使用 `scp` 将远程文件复制到本地，只需将远程文件指定为源并将当前目录（`.`）指定为目的：\n\
  \n```\nmatthew@seymour:~$ scp 192.168.1.102:remote.txt .\n```\n\n如果你想使用 `scp` 从一台远程机器复制到另一台远程机器，最好的方法是先\
  \ `ssh` 到其中一台远程机器，然后在该位置使用 `scp`。\n\n### 使用 `sftp` 在机器之间复制多个文件\n\n`sftp` 是 `ftp`\
  \ 和 `scp` 的混合体。连接到服务器使用的语法与 `scp` 相同——你只需指定 IP 地址即可使用你的当前用户名连接，或者使用 `username`@ipaddress`\
  \ 指定用户名。你可以像 `scp` 一样可选地添加冒号和目录。连接成功后，命令与 `ftp` 相同：`cd`、`put`、`mput`、`get`、`quit`\
  \ 等。\n\n在其中一个 `scp` 示例中，我们将一个远程文件复制到了本地。你可以通过以下对话使用 `sftp` 执行相同的操作：\n\n```\nmatthew@seymour:~$\
  \ sftp 192.168.1.102\nConnecting to 192.168.1.102...\nmatthew@192.168.1.102's password:\n\
  sftp> get remote.txt\nFetching /home/matthew/remote.txt to remote.txt\n/home/matthew/remote.txt\
  \      100%  23   0.0KB/s   00:00\nsftp> quit\nmatthew@seymour:~$\n```\n\n尽管由于许多系统不支持导致\
  \ FTP 仍然很常见，但 SSH 是首选的安全通信方法。\n\n### 使用 `ssh-keygen` 启用密钥登录\n\n创建 SSH 密钥通过 `ssh-keygen`\
  \ 命令完成，如下：\n\n```\nmatthew@seymour:~$ ssh-keygen -t dsa\n```\n\n在提示保存密钥时按回键，并在询问时输入短语（passphrase）。该短语仅用于保护密钥。如果你想，可以留空，但这样做允许他人使用你的账户。\n\
  \n密钥生成后，切换到 `.ssh` 目录（`cd ~/.ssh`），这是存储密钥的隐藏目录。假设你使用默认选项，在这里看到 `id_dsa` 和 `id_dsa.pub`\
  \ 文件。第一个是私钥，不应给他人。第二个是公钥，可以安全分发。你需要将公钥复制到你想通过密钥连接的服务器。\n\n使用 `scp`，你可以将公钥复制到服务器，如下：\n\
  \n```\nmatthew@seymour:~$ scp id_dsa.pub 192.168.1.102:\n```\n\n这将 `id_dsa.pub`\
  \ 放置在 192.168.1.102 的 `/home` 目录中（对于与本地账户用户名相同的账户）。下一步是正常登录 192.168.1.102，并将该密钥设置为授权密钥。这样，你就可以以自己的身份登录：\n\
  \n```\nmatthew@seymour:~$ ssh 192.168.1.102\n```\n\n正常登录后，输入以下命令：\n\n```\nmatthew@babbage:~$\
  \ cat id_dsa.pub >> .ssh/authorized_keys\nmatthew@babbage:~$ chmod 400 .ssh/authorized_keys\n\
  ```\n\n`touch` 命令创建 `authorized_keys` 文件（如果尚不存在）；然后你使用 `cat` 将 `id_dsa.pub` 的内容追加到已授权密钥的列表中。最后，使用\
  \ `chmod` 将 `authorized_keys` 设置为只读。\n\n\n\n\n完成后，你可以输入 `exit` 断开与远程机器的连接并返回本地机器。然后你可以尝试再次运行\
  \ `ssh`。如果提示你输入密码短语（passphrase），说明你已成功配置了密钥身份验证。\n\n这意味着当前的机器已经安全了，但其他所有机器呢？仍然可能仅通过密码从另一台机器登录，这意味着你的远程机器仍然非常脆弱。\n\
  \n解决此问题的方法编辑 `/etc/ssh/sshd_config` 文件。这需要超级用户权限。寻找 `PasswordAuthentication` 一行并确保其内容为\
  \ `no`（并且确保它没有被 `#` 注释）。保存文件，并运行 `kill -HUP 'cat /var/run/sshd.pid'` 让 `sshd` 重新读取配置文件。完成后后，`sshd`\
  \ 将仅接受来自具有授权密钥的客户端的连接，这可以阻止黑客通过暴力破解进入系统。\n\n***\n\n### 提示\n\n为了获得额外的安全保障，强烈建议你在\
  \ `/etc/ssh/sshd_config` 中将 `PermitRootLogin` 设置为 `no`。设置此项后，将无法使用 root 账户 `ssh`\
  \ 登录到你的机器——你必须使用普通用户账户连接，然后使用 `su` 或 `sudo` 切换到 root。这样做是有优势的，因为大多数暴力破解尝试发生在 root\
  \ 账户上，因为它是服务器上保证存在的唯一账户。\n\n此外，即使黑客知道你的用户账户，她也必须同时猜测你的用户密码和 root 密码才能控制你的系统。\n\n\
  当然，如果你在你的机器上没有启用 root 账户，这就不是一个问题了，因为已经无法直接以 root 身份登录。Ubuntu 的默认设置稍微安全了一点，真好赞。\n\
  \n***\n\n### 虚拟网络计算 (VNC)\n\n到目前为止，我们所看到的所有内容都是关于使用命令行进行远程访问的，尚未提到如何启动图形用户界面（GUI）。在\
  \ Ubuntu 中实现此目标有多种方法，其中一些在本章稍后的“参考”部分提供了链接。在这里，我们讨论最流行且受 Ubuntu 社区欢迎的方法，它也是开发者支持最好的方案：虚拟网络计算（VNC）。\n\
  \nVNC 是一种通过图形界面远程控制计算机并在网络上共享桌面的系统。它创建于 Olivetti & Oracle 研究实验室，该实验室在 1999 年被 AT&T\
  \ 收购并在 2001 年关闭。从那时起，开发团队的几位成员聚在一起创建了一个免费的开源代码版本（使用 GPL 协议），并在此基础上出现了许多不同的版本。VNC\
  \ 在 Linux 世界非常广泛，在 Windows 世界中也略有涉及。它的主要优势在于其广泛的普及性：几乎所有的 Linux 发行版都集成了 VNC，并且有多种平台的客户端可用。\n\
  \n首先配置你的防火墙以允许通过端口 5900 建立连接。如果该端口被拦截，你将无法使用 VNC。请参阅第 33 章“云中的 Ubuntu”以获取相关帮助。\n\
  \n要在你的 Ubuntu 计算机上设置 VNC 以允许他人访问你的桌面，你只需要告诉 Ubuntu 谁被允许连接到会话。这是通过“系统—偏好—远程桌面”菜单完成的。默认情况下，你的桌面是不共享的。勾选“允许其他用户查看您的桌面”进行共享。你可能还想勾选“允许其他用户控制您的桌面”，否则人们只能看到你在做什么，但无法与桌面进行交互（这没什么大帮助）。如果你将此作为远程连接到自己的桌面或在你需要访问时无人值运行的桌面的方法，请取消勾选“必须确认每次访问此机器”。如果不执行此操作，当你从远程位置尝试连接时，Ubuntu\
  \ 会本地机器上弹出一个对话框询问“是否允许此人连接？”。由于你不在现场点击“是”，连接将失败。如果你想让他远程连接到你的系统，请保持此框启用，这样你就能知道有人正在连接。无论连接是谁，你都应该输入密码。建议的选项如图\
  \ 18.1。\n\n![Image](img/18fig01.jpg)\n\n图 18.1 远程桌面偏好。\n\n要从你的 Ubuntu 桌面访问运行 VNC\
  \ 的计算机，请在菜单中点击“应用程序—互联网—远程桌面查看器”。程序启动后会在本地网络中搜索共享桌面。如果找到任何项，它们将列出来。在图 18.2 中，显示了\
  \ Heather 的计算机。\n\n![Image](img/18fig02.jpg)\n\n图 18.2 远程桌面查看器。\n\n在图 18.2 的屏幕中，点击“连接”。然后你可以从下拉列表中选择之前显示的主机之一，在网络上寻找其他主机，或输入你选择的\
  \ IP 地址，该地址对应于你已经在某处设置好通过 VNC 访问的计算机，如图 18.3 所示。然后选择其他选项并点击“连接”开始。\n\n![Image](img/18fig03.jpg)\n\
  \n图 18.3 选择要连接的机器。\n\n完成后，点击“关闭”。\n\nVNC 不应在互联网或不可信的网络上被认为是安全的。\n\n#### 参考文献\n\n\
  - `www.telnet.org`: Telnet 的主页。\n- `https://help.ubuntu.com/community/SSH`: SSH\
  \ 的 Ubuntu 文档。\n- `www.openssh.com`: Ubuntu 使用的 OpenSSH 实现的主页。它与 OpenBSD（一个基于 BSD\
  \ 的安全操作系统）由同一团队运行。\n- `https://help.ubuntu.com/community/VNC`: VNC 的 Ubuntu 文档。\n\
  - `www.realvnc.com`: AT&T 实验室创建 VNC 的团队的主页。他们后来成立了 RealVNC，一家专注于开发和支持 VNC 的公司。\n\
  - `www.tightvnc.com`: 在这里你可以找到名为 TightVNC 的替代方案，相比标准 VNC 有若干关键改进。最重要的功能是 TightVNC\
  \ 可以使用 SSH 加密，保证安全。\n- `https://help.ubuntu.com/community/FreeNX`: FreeNX 的 Ubuntu\
  \ 文档。\n- `www.nomachine.com/`: 另一个替代方案正在开发中，被称为 NX。免费版本 FreeNX 在写作时正在密集开发，但承诺比 VNC\
  \ 快得多。\n\n\n\n\n在本章中，我们将讨论保护 Linux 机器的各个方面。你可能会奇怪，为什么我们没有在书中的合适地方散布这些信息，但原因很简单：如果你在\
  \ Linux 上遇到任何安全问题，你只需要转到这一页开始阅读，而无需搜索或尝试记忆你在哪里看到过某项建议。你需要的一切都在这一章中，我们强烈建议你从头到尾阅读一遍。\n\
  \n## 内核内置保护机制\n\nLinux 内核内置了许多网络和低级保护服务。可以使用 `sysctl` 命令来启用、禁用或显示这些服务，也可以通过向 `/proc`\
  \ 目录下的内核进程文件回显一个值（通常是 `1` 开启服务，`0` 关闭服务）来实现。\n\n## 理解计算机攻击\n\n计算机攻击可以通过许多方式进行分类。也许最易的二分法是将攻击分为`内部`（internal）——即由具有本地网络计算机访问权限的人实施的计算机攻击；以及`外部`（external）——即通过互联网访问计算机的人实施的攻击。这听起来像是一个微不足道的划分，但它实际上非常重要：除非你经常雇佣有天赋的计算机黑客，或者允许访客将计算机连接到你的网络，否则你可能遭遇的最糟糕的内部攻击来自一名不满的员工。\n\
  \n## 黑客与破解者\n\n在早期，`hacker`（黑客）和 `cracker`（破解者）之间是有区别的。`hacker`是指利用技术以新颖或异常方式进行创新的人，而\
  \ `cracker` 是指利用技术攻击他人计算机并造成伤害的人。在原始定义中，黑客做好事或酷事，而破解者做的是坏事。\n\n这种区别并没有被普通大众理解，因此遗憾的是，`hacker`\
  \ 一词现在对大多数人来说已经变成了和 `cracker` 同样的意思。然而，我们承认这种区别，并使用 `cracker` 一词来指代使用计算机为他人制造问题的恶意人员。在现实对话中，要意识到大多数人并不区分这两个词，因此如果你自称为黑客，请准备好为你的术语定义。\n\
  \n尽管你不应该忽视内部威胁，但理论上你应该更加关注外界。庞大而恶意的互联网是一个安全旋涡。直接连接到外部世界的机器可能会受到世界各地的人的攻击，而且在连接后的几分钟内无一例外地遭到攻击。\n\
  \n这种情况并不是恶意用户在伏守等待你的 `IP` 地址做些有趣的事。相反，精明的病毒编写者创建了蠕虫，它们利用漏洞控制控制机器，然后将其传播到周围的其他机器。因此，如今的大多数攻击都是这些自动破解工具（autocracking\
  \ tools）的结果；周围只有少数真正聪明的破解者，而且坦率地说，如果他们其中某一个真的认真地针对了你，无论你运行的是哪种操作系统，都要付出巨大的努力才能击退破解者。\n\
  \n自动破解脚本还有另一种类型：预先编写的代码，它们利用漏洞并赋予用户在被黑机器上获得特权权限。这些脚本很少由其创建者使用；相反，它们被发布在网上，并被想当黑客的人下载，然后使用它们来攻击有漏洞的机器。\n\
  \n因此，外部类别本身由蠕虫、严肃的职业破解者和新手破解者（通常被称为 `script kiddies`，即脚本小子）组成。他们结合起来将攻击你面向互联网的服务器，而你的工作是确保你的机器保持运行，愉快地忽略周围的交火战。\n\
  \n在内部方面，情况要困难一些。坐在你防火墙内部的用户已经过了过了主要防线，更糟糕的是，他们可能甚至对你的机器拥有物理访问权限。任何具有恶意意且拥有机器物理访问权限的人几乎无法停止，除非他们完全无能。如果他们没有物理访问权限但拥有你内部网络的访问权限，情况会稍微好一点。\n\
  \n无论攻击来源是什么，你都可以遵循五步检查清单来保护你的机器：\n\n1. 评估你的漏洞。决定哪些机器可能被攻击，它们运行着哪些服务，以及谁可以访问它们。\n\
  2. 配置服务器以实现最大安全性。只安装你需要的，只运行你必须运行的，并配置本地防火墙。\n3. 保护服务器的物理访问。\n4. 创建最坏情况策略。\n5. 跟进安全新闻。\n\
  \n这些每一项在随后的章节中都有介绍，且每一项都与其他项同样重要。\n\n### 评估你的漏洞\n\n人们认为开启防火墙就能让他们变得安全，这是一个常见的错误。事实并非如此，而且实际上从未如此。每个系统都有独特的安全需求，花时间定制其安全布局将带给你获得最大的安全性和最佳的性能。\n\
  \n以下列表总结了最常见的错误：\n\n- **安装每一个软件包**——你计划将该机器用作 DNS 服务器吗？如果没有，为什么要安装 `BIND`？检查并确保你只有你需要的软件。\n\
  - **启用未使用的服务**——你想远程管理这台机器吗？你想让人们上传文件吗？如果不想，关闭 `SSH` 和 `FTP`，因为它们只是增加了不必要的攻击面。这也适用于许多其他服务。\n\
  - **由于已经在边界设置了防火墙而禁用本地防火墙**——在安全领域，深度是至关重要的：人们必须破解的层数越多，破解者放弃或被捕的概率就越高。\n- **让你的机器输出比它需要的更多的信息**——许多机器默认配置为输出软件名称和版本号，这无异于给破解者帮了一手。\n\
  - **将你的服务器放在未锁的房间里**——如果是这样，你还不如直接关掉它省省心吧。唯一的例外是你公司所有的员工都是快乐且值得信任的。但为什么要冒这个险呢？\n\
  - **将你的机器连接到无线网络**——除非你需要无线网络，否则请避免，特别是当你的机器是服务器时。\n\n在排除了这些之后，你将面临真正的问题：哪些攻击面是开放的？在互联网术语中，这取决于哪些服务面向互联网以及它们运行在哪些端口上。\n\
  \n通常有两种工具用于确定你的漏洞：`Nmap` 和 `Nessus`。`Nessus` 扫描你的机器，查询运行的服务，将其与漏洞列表进行比对并报告问题。\n\n\
  尽管 `Nessus` 听起来很聪明，但在许多现代发行版（包括 Ubuntu）中，由于补丁的机制，它的效果并不理想。例如，如果你运行 `Apache 2.0.52`，发现了一个在\
  \ `2.0.53` 中修复的漏洞，Ubuntu 将该补丁回传到 `2.0.52`。这样做是因为新版本可能包含破坏你代码的新功能，因此 Ubuntu 团队只提取必要部分并复制到你的版本中。结果是\
  \ `Nessus` 会看到版本 `2.0.52` 并认为它存在一个实际上已经被修复的漏洞。\n\n更好的解决方案是使用 `Nmap`，它扫描你的机器并报告发现的任何开放\
  \ TCP/IP 端口。安装的任何响应 `Nmap` 查询的服务都会被指出来，这使你能够确保尽可能锁好一切。\n\n\n\n\n\n你可以从 Ubuntu 软件仓库安装\
  \ Nmap。虽然你可以从命令行使用 Nmap，但在使用图形界面时会更方便——至少在你变得精通之前是。要运行图形界面，请打开终端并运行 `nmapfe`。如果你想启用\
  \ Nmap 的所有选项，必须拥有管理员权限并运行 `sudo nmapfe`。\n\n当你运行 Nmap（点击 Scan 按钮）时，它会测试你机器上的每一个端口并检查它们是否有响应。如果端口有响应，Nmap\
  \ 就会向其查询版本信息，并将结果打印在屏幕上。\n\n输出列出了你系统中每个开放端口的端口号、服务名称（通常占用该端口的服务）和版本号。希望 Nmap 向你展示的信息不会让你感到意外。如果发现某个你不认识的端口是开放的，可能是黑客在你的系统上放置了后门以便于访问，因此你应该进行进一步调查。\n\
  \n利用 Nmap 的输出来帮助你发现并消除不需要的服务。对外界开放的服务的服务越少，你的安全性就越高。请仅在你拥有的系统上使用 Nmap。扫描他人的服务器是不礼貌的，你还可能被控在为非法活动做准备。\n\
  \n### 保护你的机器\n\n在你禁用了系统上所有不需要的服务后，剩余的是你想要保留的核心连接和程序。然而，你还没有完成：你还需要加强对无线网络的控制、物理锁定你的服务器，并建立扫描程序（例如\
  \ Tripwire 和混杂模式网络监控）。\n\n### 安全无线网络\n\n由于无线网络具有一些独特的安全问题，这些问题在这里值得专门讨论。\n\n无线网络虽然方便，但其本质非常不安全，因为传输的数据（即使是加密数据）也可以被远程设备接收。这些设备可能在同一个房间；在隔壁房屋、公寓或建筑内；甚至在几个街外。必须格外小心保护你的网络使用的实际频率。过去几年取得了巨大进展，但当攻击者在区域内知道监听的频率时，发生安全漏洞的可能性就会增加。还需要注意的是，大多数无线网卡使用的加密方法比其他形式的加密（如\
  \ `SSH`）弱，不应被视为你安全计划的一部分。\n\n提示：始终使用 OpenSSH 相关的工具（如 `ssh` 或 `sftp`）在你的无线局域网上进行业务。密码不会以明文传输，你的会话是加密的。请参阅第\
  \ 18 章，“使用 SSH 和 Telnet 进行远程访问](#ch18.html_ch18)”，了解如何使用 `ssh` 连接到远程系统。\n\n你网络周围的物理安全性越高，它就越安全。（这同样适用于有线网络。）将无线发射器（路由器、交换机等）尽可能靠近你建筑的中心。注意或监控传输信号的范围，以确定你的网络是否暴露在移动网络嗅探之下——这现在是一项极客运动，被称为*车载嗅探（war\
  \ driving）*。Wireshark 是一个用于分析无线流量（以及所有网络活动）的实用程序示例，可以从 Ubuntu 仓库安装，更多信息请访问 [www.wireshark.org/](http://www.wireshark.org/)。偶尔在你的建筑周围走走不仅可以让你从工作中休息一下，还能让你有机会注意到任何不该出现在该区域的人或设备。\n\
  \n请记住，只需要一个接入合法网络集线器的恶意无线接入点，就可以开启对整个系统的访问。这些接入点可能比一盒烟还小，因此发现它们的唯一方法是使用另一个无线设备对其进行扫描。\n\
  \n### 密码与物理安全\n\n迈向更好安全性的下一步是在你的网络中使用安全密码，并确保用户也使用它们。为了获得一定的物理安全性，你可以通过 GRUB 引导加载程序强制使用密码，移除软磁盘和\
  \ CD-ROM 等可启动设备，或为 Ubuntu 配置网络启动服务器。\n\n此外，请记住，有些研究显示，多达 90% 的网络入侵是现任或前员工的。如果某人不再需要访问你的网络，请锁定其访问，或者更好的是立即删除账户。良好的安全策略还规定，与账户相关的任何数据应先进行备份并保留一段时间，以防重要数据丢失。如果你可以的话，在离职员工离开建筑之前将其从系统中删除。\n\
  \n最后，注意物理安全。如果潜在的攻击者可以获得你系统的物理访问权限，获取完全访问权限将变得轻而易举。将所有服务器保存在锁好的房间里，并确保只给授权的人员访问客户端。\n\
  \n### 配置和使用 Tripwire\n\nTripwire 是一种安全工具，用于检查普通系统二进制文件的完整性，并通过 syslog 或电子邮件报告任何更改。Tripwire\
  \ 是确保你的二进制文件没有被木马程序替换的良好工具。*木马程序*是由于与分发的（预期）程序文件名相同而无意中安装的恶意程序，它们会对被攻破的系统造成破坏。\n\
  \nTripwire 有两个版本：开源版本和商业产品。Tripwire 的免费版本可在 Ubuntu 仓库中找到。你可以在 [www.tripwire.org](http://www.tripwire.org)\
  \ 了解差异。\n\n要初始化 Tripwire，使用其 `--init` 选项，如下：\n\n```\nmatthew@seymour:~$ sudo tripwire\
  \ --init\n\nPlease enter your local passphrase:\n\nParsing policy file: /etc/tripwire/tw.pol\n\
  \nGenerating the database...\n\n*** Processing Unix File System ***\n\n....\n\n\
  Wrote database file: /var/lib/tripwire/shuttle2.twd\n\nThe database was successfully\
  \ generated.\n```\n\n注意，这里没有显示所有输出。在 Tripwire 创建其数据库后，它使用该基础以及 `/etc/tripwire` 目录下的加密配置和策略来监控系统的状态。你应该使用所需的选项以完整检查模式启动\
  \ Tripwire。（详情请参见 tripwire 手页。）例如，你可以让 Tripwire 检查你的系统并在命令行生成报告，如下：\n\n```\nmatthew@seymour:~$\
  \ sudo tripwire -m c\n```\n\n这里没有输出，但示例显示了报告。输出可以重定向到文件，但报告保存为 `/var/lib/tripwire/report/hostname-YYYYMMDD-HHMMSS.twr`（也就是说，使用主机名、年、月、日、时、分、秒）。可以使用\
  \ `twprint` 工具读取此报告，如下：\n\n```\nmatthew@seymour:~$ sudo twprint --print-report -r\
  \ \\\n/var/lib/tripwire/report/shuttle2-20020919-181049.twr | less\n```\n\nTripwire\
  \ 还支持其他选项，例如发送报告，它应该通过系统的调度表 `/etc/crontab` 在空闲时间作为计划任务运行。（在性能较弱的计算机上可能会消耗资源。）Tripwire\
  \ 软件包还包含一个 `twadmin` 工具，你可以用它微调或更改设置、策略，或执行其他管理职责。\n\n如果你想使用 Tripwire，请记住花时间阅读文档。它功能强大但并不简单。我们建议从手册页和\
  \ [www.tripwire.com](http://www.tripwire.com) 开始。\n\n#### 设备\n\n\n\n\n\n永远不要宣传你已经将网卡（NIC）设置为混杂模式。混杂模式（可以通过使用\
  \ `ifconfig` 的 `promisc` 选项在接口上设置）有助于监控跨越网络的流量，并且通常允许你监控可能侵入你网络的人的操作。`tcpdump` 命令在运行期间会将指定的接口设置为混杂模式；遗憾的是，当\
  \ `tcpdump` 运行时，`ifconfig` 命令并不会报告这一事实！\n\n记住对对事用对工具。虽然可以使用网桥将你的网络连接到互联网，但并不是一个好的选择。网桥几乎已经过时了，因为它们转发任何经过它们的数据包，这在网桥连接到互联网时是非常不利的。路由器则允许你过滤哪些数据包被中继。\n\
  \n### 病毒\n\n在优秀的人手中，Linux 和 Windows 一样容易受到病毒的影响。这可能会让你感到惊讶，特别是如果你是因为它的安全记录而切换到 Linux\
  \ 的。然而，Windows 和 Linux 的区别在于，在 Linux 上防御病毒要容易得多。事实上，只要你足够明智勤奋，就永远不必担心它们。原因如下：\n\n\
  - Linux 永远不会将当前目录放入你的可执行路径中，因此输入 `ls` 运行的是 `/bin/ls`，而不是当前目录下任何名为 `ls` 的程序。\n- 非根用户只能感染该用户具有写权限的文件，这通常只是用户家目录下的文件。这就是为什么在不需要时绝不使用\
  \ `sudo` 的重要原因之一。\n- Linux 强制你手动将文件标记为可执行，所以你不会在误以为只是一个文本文件的情况下意外运行名为 `myfile.txt.exe`\
  \ 的文件。\n- 通过拥有多个常用的网络浏览器和电子邮件客户端，Linux 具有了多样性带来的优势：病毒编写者无法针对一个平台并击中 90% 的用户。\n\n\
  尽管如此，Linux 仍然可能成为病毒的载体。如果你运行邮件服务器，你的 Linux 机器可能会向 Windows 机器发送感染病毒的邮件。基于 Linux 的服务器可能是安全的，但\
  \ Windows 客户端会被病毒攻破。\n\n在这种情况下，请为你的机器考虑一个病毒扫描软件。你有几个选择，既有免费的也有商业的。最流行的免费套件是 Clam\
  \ AV (`www.clamav.net`)，但 Central Command、BitDefender、F-Secure、Kaspersky、McAfee\
  \ 等都在竞争提供商业解决方案。在决定之前，请寻找最优惠的。\n\n### 配置简单防火墙 (UFW)\n\n在连接到互联网的计算机上，始终使用基于硬件或软件的防火墙。Ubuntu\
  \ 默认安装了一个名为 `Uncomplicated Firewall (UFW)` 的防火墙应用程序。该工具允许你针对对计算机或局域网的访问实施选择性或限制性策略。\n\
  \nUFW 从终端运行，你必须拥有管理员权限才能使用。命令格式如下：\n\n```bash\nmatthew@seymour:~$ sudo ufw status\n\
  ```\n\n最有用的命令列在 表 19.1 中；其他的请参考 UFW 手页。许多在表格之后进行了详细描述。\n\n表 19.1 UFW 命令\n\n![Image](img/19tab01.jpg)\n\
  \n默认情况下，UFW 或防火墙是禁用的。要启用防火墙，运行以下命令：\n\n```bash\nmatthew@seymour:~$ sudo ufw enable\n\
  ```\n\n要禁用，将 `enabled` 替换为 `disabled`。\n\n接下来，我们要启用防火墙日志。与 `enable` 命令类似，我们运行以下命令：\n\
  \n```bash\nmatthew@seymour:~$ sudo ufw logging on\n```\n\n要在防火墙上启用特定端口，你可以运行 `ufw`\
  \ 命令并带有要打开的端口号。例如，如果你想允许端口 80 (HTTP) 入站连接到你的 Ubuntu 服务器，输入以下内容：\n\n```bash\nmatthew@seymour:~$\
  \ sudo ufw allow 80\n```\n\n要删除允许端口 80 连接的防火墙规则，运行以下命令：\n\n```bash\nmatthew@seymour:~$\
  \ sudo ufw delete allow 80\n```\n\n`ufw` 中已经定义了许多服务。这意味着你不需要记住这些服务使用的标准端口，你可以使用服务名称来允许、拒绝或删除，如下：\n\
  \n```bash\nmatthew@seymour:~$ sudo ufw allow ssh\n```\n\n你还可以允许来自特定 IP 地址的入站连接。例如，如果你想让\
  \ 192.168.0.1 连接到你的服务器，输入以下内容：\n\n```bash\nmatthew@seymour:~$ sudo ufw allow from\
  \ 192.168.0.1\n```\n\n要删除允许上述 IP 地址连接的防火墙规则，运行以下命令：\n\n```bash\nmatthew@seymour:~$\
  \ sudo ufw delete allow from 192.168.0.1\n```\n\n还有一个可以从 Ubuntu 仓库安装的用于管理 UFW 的图形界面，称为\
  \ `GUFW`。如果你安装了它，可以在“系统-管理-防火墙配置”中打开 GUFW。细节也一样，但界面更简单，不需要你记忆那么多，正如图 19.1 所示，其中我有一条规则允许端口\
  \ 22 的入站流量（用于 SSH 服务）以及如果使用 TCP 的端口 5900 入站流量（用于 VNC 服务）。\n\n![Image](img/19fig01.jpg)\n\
  \n如果你点击添加，可以轻松为预配置的服务添加规则，如图 19.2 所示。\n\n### AppArmor\n\nAppArmor 是一个强制访问控制 (MAC)\
  \ 系统。它比更著名的 SELinux 要简单。\n\nAppArmor 的设计通过限制程序访问预定义的资源来限制程序可以执行。默认情况下，AppArmor 几乎不起作用。你可以从\
  \ Ubuntu 仓库安装一些额外的配置文件。有关更完整的介绍，请参见本章末尾的链接。\n\n\n\n\n\n即使不知道语法，我们也可以从这个文件中看出，配置文件（profiles）是简单的文本文件，支持使用注释；支持绝对路径和通配符（文件名的模式匹配）；允许或禁止特定的功能；并规定了文件系统中的哪些位置和程序可以访问或使用。\n\
  \n每条访问规则都指定了列表中的特定权限：\n\n- `r` - 读取\n- `w` - 写入\n- `ux` - 无限制执行\n- `Ux` - 无限制执行\
  \ -- 清理环境\n- `px` - 离散配置执行\n- `Px` - 离散配置执行 -- 清理环境\n- `ix` - 继承\n- `m` - 允许通过 `mmap(2)`\
  \ 调用使用 `PROT_EXEC`\n- `l` - 链接\n\n这些权限列在行的末尾。\n\n`Genprof` 是一个帮助你生成或更新配置文件的程序。你需要提供可执行文件的名称（如果不在路径中，则提供路径），并可能可选提供配置文件的路径，如下：\n\
  \n```\nmatthew@seymour:~$ sudo genprof google-chrome\n```\n\n你会被要求启动程序并运行一段时间。完成后，你将有机会选择允许或拒绝对每个函数的访问。然后，程序将使用程序名称及其路径在\
  \ `/etc/apparmor.d` 中写入一个文本文件（在本例中，名称为 `opt.google.chrome.google-chrome`，我是直接从 Google\
  \ 安装的，因此我的系统中没有预设的 AppArmor 配置文件）。然后你可以根据需要编辑该文本文件，如果你想从投诉模式（complain mode）切换到强制模式（enforce\
  \ mode），就必须这样做。\n\n当你准备好了一组覆盖你需求的配置文件后，这些是你最常用的命令：\n\n启动 (start):\n```\nmatthew@seymour:~$\
  \ sudo service apparmor start\n```\n\n停止 (stop):\n```\nmatthew@seymour:~$ sudo service\
  \ apparmor stop\n```\n\n加载 (reload):\n```\nmatthew@seymour:~$ sudo service apparmor\
  \ reload (or restart)\n```\n\n显示状态 (show status):\n```\nmatthew@seymour:~$ sudo\
  \ service apparmor status\n```\n\n我们刚刚触及 AppArmor 的冰角，但希望能已经激发你进一步阅读的兴趣。AppArmor\
  \ 仍然比较新且处于变化中。在线文档是跟进它的最佳方式。一些好的起点包含在“References”章节中。\n\n### 制定灾难恢复计划\n\n没有人喜欢为最坏的情况做计划，这就是为什么三分之二的人没有遗嘱。系统被破解是一件可怕的事情：一个或多个犯罪分子突破了你精心布置的防御，对机器造成了不可估量的损失。如果你有老板，他想看到一份关于发生了什么以及为什么的完整报告，而你的用户希望在早上坐到桌前时就能看到邮件。该怎么办？\n\
  \n如果你真的被黑了，没有任何能完全消除这种压力。然而，如果你花时间提前做好妥当的响应，至少可以避免过早衰老。这里是一些帮助你起步技巧：\n\n- **不要直接拔掉网线**——这会作为一个信号，告知黑客已被发现，从而排除了安全专家监控该黑客返回并实际抓获他的机会。\n\
  - **只通知需要知道的人**——你的老板和其他 IT 人员在名单首位；其他员工不是。记住，攻击背后可能是某位员工，而这会引起他们的警觉。\n- **如果机器不再需要且你不想追踪攻击，可以安全地将其从网络中移除**——但是不要关闭它，因为某些后门只在系统重启时才会启用。\n\
  - **获取系统上所有日志文件的副本并将其存储在其他处**——这些文件可能被篡改过，但它们可能包含有价值的信息。\n- **检查 `/etc/passwd` 文件并寻找你不认识的用户**——更改系统上的所有密码并移除恶意用户。\n\
  - **检查 `ps aux` 的输出查看是否有异常程序在运行**——还要检查是否设置了任何 `cron` 任务运行。\n- **查看 `/var/www` 并看是否有任何不该存在的网页**。\n\
  - **检查用户 `/home` 目录下 `.bash_history` 文件的内容**——对于你的主用户是否有任何最近执行的命令？\n- **如果你之前与外部安全公司合作过，请他们他们进行新的审计**——交出你所有的所有的日志，并解释情况。他们能够从日志中提取出所有可能的信息。\n\
  - **开始整理过去几周和几个月的备份磁带**——你的系统可能在你注意到之前很久就被破解了，所以你可能需要多次回滚系统，才能发现攻击实际上是何时成功的。\n-\
  \ **从 [www.rootkit.nl/projects/rootkit_hunter.html] 下载并安装 Rootkit Hunter**——这会搜索（并移除）坏人留留以便返回的文件类型。\n\
  \n将你的灾难恢复计划放在安全的地方；将其保存为相关机器上的一个文件是一个*非常*糟糕的做法。\n\n#### 参考文献\n\n- **[https://help.ubuntu.com/community/InstallingTools]**——Ubuntu\
  \ 社区对各种工具的文档和建议。\n- **[www.insecure.org/nmap/]**——该网站包含关于 Nmap 的信息。\n- **[www.securityfocus.com/]**——Security\
  \ Focus 网站。\n- **[www.tripwire.org]**——Tripwire 开源版本的信息和下载。\n- **[www.ubuntu.com/usn]**——官方\
  \ Ubuntu 安全公告；值得关注。\n- **[https://help.ubuntu.com/community/UFW]**——关于 UFW 的 Ubuntu\
  \ 社区文档。\n- **[https://wiki.ubuntu.com/UncomplicatedFirewall]**——关于 UFW 的 Ubuntu\
  \ 文档。\n- **[https://help.ubuntu.com/community/AppArmor]**——关于 AppArmor 的 Ubuntu\
  \ 社区文档。\n- **[www.novell.com/linux/security/apparmor/]**——Novell 对 AppArmor 的优秀介绍和文档。\n\
  \n\n\n\n许多 Linux 用户喜欢在底层进行钻研以提高计算机性能，而 Linux 为你提供了一些很棒的来实现这一目标。妈妈们告诉我们“不要修理没坏的东西”，但爸爸们经常说“修它，直到它坏掉为止”。在本节中，你将学习许多用于调优或“微调（tweak）”文件系统的命令。\n\
  \n然而，在对 Linux 开展任何底层工作之前，请记住以下几点。首先，在开始之前对系统进行基准测试。Linux 并没有提供完善的基准测试应用程序，而且现有工具的可用性变化很快。你可以在网上搜索\
  \ Linux 基准测试应用的最新信息。如果你是系统管理员，可能会选择创建自己的基准测试。其次，一次只调整一种性，这样你就能判断哪些是有效的、哪些无效，以及哪些导致了问题。某些微调可能不起作用或者可能会导致机器死机，但如果你一次只实施一个，你会发现撤销导致问题的更改要容易得多。\n\
  \n务必随身准备一个可用的启动盘，例如 Ubuntu 的 Live CD 或 DVD。请记住，你对尝试任何这些微调个人承担所有风险。如果你不明白自己在做什么，或者对撤销此处讨论的任何更改没有信心，请不要尝试本章中的任何建议。Ubuntu\
  \ 的默认设置对大多数人来说运行良好，真的不需要调整——就像大多数人可以原样使用并享受他们的汽车一样。然而，有些人喜欢拆解汽车并改装赛车；他们喜欢微调、弄坏并修复它们。本章就是为这类人准备的。如果你认为自己无法修复它，就不要冒险弄坏它。\n\
  \n## 使用 BIOS 和内核调优驱动器\n\n调优的一种方法涉及调整 BIOS 中的设置。因为 BIOS 不是 Linux，而且每个 BIOS 看起来都不同，请务必阅读主板说明书以获取更好的可能设置，并确保所有驱动器都被\
  \ BIOS 正确检测。一次只更改一个设置。\n\nLinux 提供了有限的手段在启动过程中与 BIOS 设置进行交互（主要是覆盖它们）。在本节中，你将学习这些命令。\n\
  \n其他选项在以下列表中，并在 BOOTPROMPT HOWTO 和内核文档中有更详尽的概述。这些命令可以强制 IDE 控制器和驱动器进行优化配置。然而，YMMV（因人而异），因为这些方法并不适用于所有人：\n\
  \n- `idex=dma`—这强制为主 IDE 总线（`x=0`）或次级总线（`x=1`）开启 DMA 支持。\n\n- `idex=autotune`—此命令尝试调优接口以获得最佳性能。\n\
  \n- `hdx=ide-scsi`—此命令启用 IDE 驱动器的 SCSI 仿真。某些 CD-RW 驱动器在写入模式下正常工作需要此，它可能为普通的 CD-R\
  \ 驱动器提供一些性能改进。\n\n- `idebus=xx`—可以是 20 到 66 之间的任何数字；系统会尝试自动检测，但如果 `dmesg` 说未正确自动检测，或者你在\
  \ BIOS 中将其设置为不同的值（超频），则可以手动设置它。大多数 PCI 控制器都能接受 33。\n\n- `pci=biosirq`—某些主板可能会导致\
  \ Linux 生成错误消息，提示你应该使用此项。在 `dmesg` 中查看它；如果你没看到，就不需要使用它。\n\n这些选项可以像附加其他选项一样输入 `/etc/lilo.conf`、`/boot/grub/grub.conf`\
  \ 或 GRUB2 的 `/boot/grub/grub.cfg` 中。\n\n## `hdparm` 命令\n\nroot 用户可以使用 `hdparm` 工具来设置和调优\
  \ IDE 硬盘的设置。你这样做是为了调优驱动器以获得最佳性能。\n\n由于内核补丁和相关的支持程序，Ubuntu 现在已包含了 `hdparm` 程序。你应该只对只读挂载的文件系统进行实验，因为某些设置在使用不当时可能会损坏某些文件系统。`hdparm`\
  \ 命令也适用于 CD-ROM 驱动器和某些 SCSI 驱动器。\n\n命令的通用格式如下：\n\n```\nmatthew@seymour:~$ hdparm\
  \ command device\n```\n\n此命令运行硬盘测试：\n\n```\nmatthew@seymour:~$ hdparm -tT /dev/hda\n\
  ```\n\n你必须将 `/dev/hda` 替换为硬盘的位置。`hdparm` 然后运行两个测试：缓存读取和缓冲磁盘读取。良好的 IDE 硬盘在第一个测试应达到\
  \ 400MBps 到 500MBps，第二个测试达到 20MBps 到 30MBps。记下你的分数，然后尝试此命令：\n\n```\nmatthew@seymour:~$\
  \ hdparm -m16 -d1 -u1 -c1 /dev/hda\n```\n\n这启用了各种性能增强设置。现在再次尝试执行原始命令。如果你看到速度增加，应该运行此命令：\n\
  \n```\nmatthew@seymour:~$ hdparm -m16 -d1 -u1 -c1 -k1 /dev/hda\n```\n\n额外的参数告诉 `hdparm`\
  \ 将设置写入磁盘，以便在每次启动时都使用它们，确保未来的最佳磁盘性能。\n\n`hdparm` 的 man 条非常详尽，包含了有用的详细信息，但 Ubuntu\
  \ 选择的内核配置已经尝试了优化。\n\n### 提示\n\n你可以使用以下命令通过 `hdparm` 生成磁盘速度结果：\n\n```\nmatthew@seymour:~$\
  \ hdparm -tT device\n```\n\n但请注意，尽管得到的数字看起来是定量的，但它们受限于此处讨论和解释范围之外的技术限制。\n\n## 文件系统调优\n\
  \n永远不要满足于现状，Linux 提供了几种工具来调整和自定义文件系统设置。这种观点认为，硬件制造商和发行版创建者倾向于选择始终运行的保守设置，从而限制了你系统的某些潜力。\n\
  \nLinux 文件系统设计者在选择用于文件系统创建的默认值方面做得，2.6 版本的 Linux 内核现在包含了 IDE 子系统的代码，显著提高了比旧版本的 I/O\
  \ 传输速度，消除了大部分对文件系统和驱动器参数进行特殊微调的需求。因为 Linux 在向设备写入时使用缓冲区，写入将在缓冲区填满、内核通知它、或者你通过 `sync`\
  \ 命令通知它之前不会发生。传统上，会执行两次命令，如下：\n\n```\nmatthew@seymour:~$ sync ; sync\n```\n\n执行两次是多余的。尽管如此，在卸载某些写入速度慢的介质（如某些\
  \ USB 硬盘或 PCMCIA 存储介质）之前，这可能很有帮助，但是因为延迟了用户过早尝试移除介质，而不是因为两次 sync 比一次好。\n\n### `tune2fs`\
  \ 命令\n\n通过 `tune2fs`，你可以调整 `ext2` 或 `ext3` 文件系统的可调文件系统参数。以下是值得注意的几个性能相关项目：\n\n-\
  \ 要禁用文件系统检查，`-c 0` 将最大挂载次数设置为零。\n- 强制检查之间的间隔可以使用 `-i` 选项进行调整。\n\n\n\n\n- `-m` 选项通过设置较低的值来设定保留块百分比，从而释放更多空间，代价是\
  \ `fsck` 写入任何恢复文件的空间变小。\n- 使用 `-O sparse_super` 选项减少超级块数量以节省空间。（现代文件系统默认使用此项。）在更改此值后，务必运行\
  \ `e2fsck`。\n- 使用 `-r` 选项可以释放更多空间，该选项设置了保留（针对 root）块的数量。\n\n请注意，`tune2fs` 的大多数用法都是以牺牲\
  \ `fsck` 恢复数据的能力为代价来释放驱动器空间。除非你真的需要这些空间并且能够处理其后果，否则请接受默认值；现在大硬盘已经相对廉便宜了。\n\n## `e2fsck`\
  \ 命令\n\n此工具检查 `ext2/ext3` 文件系统。来自 `man e2fsck` 的一些有用参数如下：\n\n- `-c`—检查坏块并将其标记为坏块。\n\
  - `-f`—强制在洁净的文件上进行检查。\n- `-v`—详细模式。\n\n## `badblocks` 命令\n\n虽然 `badblocks` 工具本身不是一个性能调优程序，但它会检查（最好是）未挂载的分区是否存在坏块。不建议单独运行此命令，而是让它由\
  \ `fsck` 调用。只有在你准确指定了块大小的情况下，才应该直接使用它；不要猜测或假设任何内容。\n\n`badblocks` 可用的选项在 man 页中有详细说明。它们允许对文件系统进行非常底层的操作，这对于文件系统专家的数据恢复或文件系统黑客行为很有用，但超出了本章的范围和普通用户的范围。\n\
  \n## 禁用文件访问时间\n\n每当 Linux 读取文件时，它都会更改最后访问时间（称为 *atime*）。对于你的 Web 服务器来说也是如此：如果你每秒受到\
  \ 50 次请求的影响，你的硬盘每秒就会更新 50 次 `atime`。你真的需要知道文件最后一次访问的时间吗？如果不需要，你可以通过输入以下命令禁用目录的 `atime`\
  \ 设置：\n\n```bash\nmatthew@seymour:~$ chattr -R +A /path/to/directory\n```\n\n`chattr`\
  \ 命令更改文件系统属性，其中“不更新 atime”就是其中之一。要设置该属性，使用 `+A` 并指定 `-R` 以进行递归设置。`/path/to/directory`\
  \ 会被更改，其包含的所有文件和子目录也是如此。\n\n## 内核\n\n随着 Linux 内核随时间的发展，开发者寻求微调某些内核参数的方法。在 `sysctl`\
  \ 之前，这些参数必须在内核配置中更改，然后重新编译内核。\n\n`sysctl` 命令可以更改运行内核的某些参数。它通过 `/proc` 文件系统实现，它是运行内核的“虚拟窗口”。尽管\
  \ `/proc` 下似乎存在一组目录和文件，但那只是内核部分内容的表示。当我们是 root 用户（或使用 `sudo` 命令）时，我们可以从这些“文件”读取值并向其写入值，这些“文件”被称为*变量*。我们可以显示变量列表，如下。（提供带注释的列表是因为完整列表中大约有\
  \ 250 个或更多项目。）\n\n```bash\nmatthew@seymour:~$ sysctl -A\n\nnet.ipv4.tcp_max_syn_backlog\
  \ = 1024\nnet.ipv4.tcp_rfc1337 = 0\nnet.ipv4.tcp_stdurg = 0\nnet.ipv4.tcp_abort_on_overflow\
  \ = 0\nnet.ipv4.tcp_tw_recycle = 0\nnet.ipv4.tcp_syncookies = 0\nnet.ipv4.tcp_fin_timeout\
  \ = 60\nnet.ipv4.tcp_retries2 = 15\nnet.ipv4.tcp_retries1 = 3\nnet.ipv4.tcp_keepalive_intvl\
  \ = 75\nnet.ipv4.tcp_keepalive_probes = 9\nnet.ipv4.tcp_keepalive_time = 7200\n\
  net.ipv4.ipfrag_time = 30\n```\n\n显示的项目是网络参数，调优这些值超出了本书的范围。然而，如果我们想更改某个值，则使用 `-w`\
  \ 参数：\n\n```bash\nmatthew@seymour:~$ sysctl -w net.ipv4.tcp_retries 2=20\n```\n\n\
  这增加了该特定内核参数的值。\n\n如果你发现某个设置有用，可以将其输入 `/etc/sysctl.conf` 文件。格式如下（使用之前的示例）：\n\n```text\n\
  net.ipv4.tcp_retries 2=20\n```\n\n对于内核黑客来说，比起普通用户更有趣，`sysctl` 是一个持续开发和记录的潜在强大工具。\n\
  \n***\n\n### 提示\n\n内核在平衡图形系统性能方面做得很好，因此你对调优桌面以运行得更快并没有太多可以做的。\n\nGNOME 和 KDE 都是“重量级”桌面系统：它们是全能的、功能丰富且华丽的环境，其功能远比浏览文件系统要多。缺点是它们的体积使得它们在旧系统上运行较慢。相反，Ubuntu\
  \ 在存储库中还提供了其他可选的桌面，如 Xfce 和 LXDE，它们要精得多，比。\n\n### Apache\n\n尽管 Apache 是最流行的服务器，但它并不是最快的。它的开发有一部分。我们并不是试图忽视新网站，而是尊重原始。\n\
  \n\n\n\n最后，如果速度是你最关心的问题，你应该尽一切确保你的内容是静态的：可能就避免 `PHP`，可能就避免数据库，以此类推。如果你知道自己将面临访问客的洪流，请使用纯\
  \ HTML，这样 `Apache` 提供服务的速度将仅受限于你的带宽。\n\n### 提示\n\n当人们被问及如何优化 Apache 时，有些人会建议你通过\
  \ Apache 源码中调整 `HARD_SERVER_LIMIT` 并重新编译。虽然我们赞同如果你知道如何操作，那么编译自己的 Apache 源码是获得可衡量速度提升的极佳方法，但只有在你托管大型网站时，你才需要更改此指令。\n\
  \n默认值 `256` 足够处理“斯莱斯之效应”（Slashdot Effect），如果你能处理这一点，那么你就能处理大多数情况。\n\n### MySQL\n\
  \n调优你的 `MySQL` 服务器以提高性能是非常容易的，这在很大程度上是因为你只需要正确编写查询就能获得巨大的速度提升。然而，只要你的系统有足够的内存，你就可以调整服务器本身的各种设置来帮助它应对更高的负载。\n\
  \n关键在于理解它的缓冲区（buffers）。对于各种事务都有缓冲区和缓存，找出它们有多满对于实现性能最大化至关重要。`MySQL` 在充分利用其缓冲区时性能最佳，这反过来对系统内存提出了很高的要求。除非你的机器中拥有\
  \ 4GB 或更多的内存，否则你没有足够的容量为所有缓冲区设置非常高值；你需要进行筛选选择。\n\n#### 衡量关键缓冲区的使用情况\n\n当你向数据添加索引时，它使\
  \ `MySQL` 能够更快地找到数据。然而，理想情况下，你希望将这些索引存储在内存中以获得最高速度，变量 `key_buffer_size` 定义了 `MySQL`\
  \ 可以为索引键缓存分配多少内存。如果 `MySQL` 无法将索引存储在内存中，你将遇到严重的性能问题。幸运的是，大多数数据库对键缓冲区的需求相对较小，但你应该测量你的使用情况以查看需要做哪些工作。\n\
  \n要做到这一点，登录 `MySQL` 并输入 `SHOW STATUS LIKE '%key_read%'`；这会返回所有描述键缓冲区命中率的状态字段。你应该会得到两行结果，`Key_reads`\
  \ 和 `Key_read_requests`，它们代表从磁盘读取的键的数量以及从键缓冲区读取的键的数量。通过这两个数字，你可以使用这个简单的公式计算从内存和磁盘填充的请求百分比：\n\
  \n```\n100 – ((Key_reads / Key_read_requests) &in; 100)\n```\n\n也就是说，将 `Key_reads`\
  \ 除以 `Key_read_requests`，将结果乘以 100，然后从 100 中减去该结果。例如，如果你的 `Key_reads` 为 1000，`Key_read_requests`\
  \ 为 100000，将 1000 除以 100000 得到 0.01；然后乘以 100 得到 1.0，再从 100 中减去它得到 99。这个数字就是从内存提供的键读取百分比，这意味着你\
  \ 99% 的键是从内存提供的。\n\n大多数人应该寻求让超过 95% 从内存提供，尽管主要的例外是你频繁地更新或删除行——`MySQL` 无法缓存不断变化的内容。如果你的网站大部分是只读的，这个数字应该在\
  \ 98% 左右。较低的数字意味着你可能需要增大键缓冲区的大小。\n\n如果你发现存在问题，下一步是检查当前键缓冲区被使用了多少。使用 `SHOW VARIABLES`\
  \ 命令并查找 `key_buffer_size` 变量的值。它可能是像 8388600 这样的数字，即 800 万字节，或 8MB。现在，使用 `SHOW STATUS`\
  \ 命令并查找 `Key_blocks_used` 的值。\n\n你可以通过将 `Key_blocks_used` 乘以 1024，除以 `key_buffer_size`，再乘以\
  \ 100 来确定你的键缓冲区使用了多少。例如，如果 `Key_blocks_used` 是 8000，乘以 1024 得到 8192000；然后除以你的 `key_buffer_size`\
  \ (8388600) 得到 0.97656，最后乘以 100 得到 97.656。因此，你几乎 98% 的键缓冲区被使用了。\n\n现在，重要的部分来了：你已经确定自己正在从磁盘读取大量的键，而且也知道从磁盘读取的原因几乎肯定是因为没有为键缓冲区分配足够的内存。一条通用规则是尽可能为键缓冲区分配内存内存，最高到系统内存的\
  \ 25%——在 512MB 的系统上，128MB 对于频繁读取键的系统来说大约是理想的。超过此限制，你实际上会看到性能急剧下降，因为系统必须为键缓冲区使用虚拟内存。\n\
  \n在文本编辑器中打开 `/etc/my.cnf` 并寻找包含 `key_buffer_size` 的行。如果你没有，你需要创建一个新的。它应该在 `[mysqld]`\
  \ 行下方。当你设置新值时，不要只随机选一个很高的数字。尝试将当前的数值翻倍（或尝试 16MB）。\n\n```\n[mysqld]\nkey_buffer_size\
  \ = 16M\n```\n\n#### 查询缓存\n\n较版本的 `MySQL` 允许你缓存查询结果，这样当相同的查询进来时就可以从内存提供。在某些方面，查询缓存是非常智能的：例如，由于另一个查询导致部分结果变化，缓存的结果将被丢弃。然而，在其他方面，它非常简单。查询缓存在大多数场景下运行良好。如果你的网站读写比例均衡，查询缓存会尽力而为但并非最优。如果你的网站主要是读取且写入很少，会有更多的查询被缓存。\n\
  \n首先，你需要确定是否启用了查询缓存。要做到这一点，使用 `SHOW VARIABLES` 并查找 `have_query_cache` 的值。如果顺利，你应该会得到\
  \ `YES`，这意味着查询缓存已启用。接下来，查找 `query_cache_size` 和 `query_cache_limit` 的值。第一个分配给查询缓存的内存字节，第二个是允许的最大结果大小。这两个值的良好起始设置是\
  \ 8388608 (8MB) 和 1048576 (1MB)。\n\n接下来，输入 `SHOW STATUS LIKE 'Qcache%'` 查看有关查询缓存的所有状态信息。你应该得到这样的输出：\n\
  \n```\nmysql> SHOW STATUS LIKE 'Qcache%';\n+-------------------------+-------- +\n\
  | Variable_name           | Value  |\n+-------------------------+-------- +\n| Qcache_free_blocks\
  \      | 1      |\n| Qcache_free_memory      | 169544 |\n| Qcache_hits         \
  \    | 698    |\n| Qcache_inserts         | 38     |\n+-------------------------+--------\
  \ +\n```\n\n\n\n\n```\n| Qcache_lowmem_prunes     | 20       |\n| Qcache_not_cached\
  \       | 0        |\n| Qcache_queries_in_cache | 18       |\n| Qcache_total_blocks\
  \     | 57       |\n+-------------------------+--------+\n8 rows in set (0.00 sec)\n\
  ```\n\n从这里我们可以看到只有 18 个查询在缓存中（`Qcache_queries_in_cache`）；缓存中有 169544 字节空闲内存（`Qcache_free_memory`），从缓存中读取了\
  \ 698 次查询（`Qcache_hits`），插入了 38 次查询（`Qcache_inserts`），但其中 20 个因为内存不足被移除（`Qcache_lowmem_prunes`），因此得到了之前的\
  \ 18 个。`Qcache_not_cached` 为 0，意味着有 0 个查询未被缓存——MySQL 缓存了所有查询。\n\n通过这些，我们可以计算总共有多少次查询——它是\
  \ `Qcache_hits`、`Qcache_inserts` 和 `Qcache_not_cached` 的总和，即 736。我们也可以通过将 `Qcache_hits`\
  \ 除以该数字并乘以 100 来计算查询缓存的使用率。在这种情况下，所有查询的 94.84% 由查询缓存提供的，这是一个很的数据。\n\n在示例中，我们可以看到许多查询被裁剪了，因为查询缓存中的内存不足。可以通过编辑你的\
  \ `/etc/my.cnf` 文件并在 `[mysqld]` 部分添加类似下面的一行来更改：\n\n```\nset-variable = query_cache_size=32M\n\
  ```\n\n对于大多数人来说，8MB 的查询缓存应该足够了，但如果你正在存储特别大量的数据，较大的网站可能需要 16MB 甚至 32MB。极少数网站需要超过\
  \ 32MB 的查询缓存，但请关注 `Qcache_lowmem_prunes` 的值，以确保你分配了足够的内存。\n\n使用查询缓存不会产生太大的性能影响。当\
  \ MySQL 正常计算查询结果时，它会在连接关闭时将其丢弃。使用查询缓存时，它会跳过丢弃步骤，因此没有额外的工作要做。如果你的网站确实有很多更新和删除操作，请务必检查查询缓存是否真的带来了任何速度提升。\n\
  \n## 杂项调优\n\n如果你已经调整了键缓冲区（key buffer）并优化了查询缓存，但仍然发现网站运行吃力，你可以进行一些较小的更改来增加额外速度。\n\
  \n从表中读取数据时，MySQL 必须打开存储表数据的文件。它同时打开多少个文件由 `table_cache` 设置定义，默认设置为 64。如果你有超过 64\
  \ 张表，可以增加此设置，但请注意 Ubuntu 对 MySQL 同时可以打开的文件数量有限制。除非你的网站是特殊的数据库密集型网站且你清楚自己在做什么，否则不建议超过\
  \ 256。\n\n另一个你可以调优的是是读取缓冲区的大小，它由 `read_buffer_size` 和 `read_buffer_rnd_size` 控制。这两者都是按连接分配的，这意味着在设置较大的数值时应该要非常小心。无论你选择什么，`read_buffer_rnd_size`\
  \ 的大小都应该是 `read_buffer_size` 的三倍到四倍，所以如果 `read_buffer_size` 是 1MB（适用于非常大的数据库），那么\
  \ `read_buffer_rnd_size` 应该是 4MB。\n\n## 查询优化\n\n最大的速度提升可以通过重写你的 SQL 语句使其更高效来实现。如果你遵循这些提示，你的服务器将感谢你：\n\
  \n\n\n- 尽可能少地选择数据。与其使用 `SELECT *`，不如只选择你需要的字段。\n- 如果你只需要几行，使用 `LIMIT` 选择你需要的数量。\n\
  - 在创建表时将字段声明为 `NOT NULL` 以节省空间并提高速度。\n- 为字段提供默认值，并在可能的地方使用它们。\n- 非常小心处理表连接（joins），因为它们是编写低效查询最简单的方法。\n\
  - 如果你必须使用连接，请确保在有索引的字段上进行连接。这些字段最好也是整数字段，因为在进行比较时，整数比字符串快得多。\n- 找到并修复慢查询。在 `/etc/my.cnf`\
  \ 文件的 `[mysqld]` 下添加 `log-long-format` 和 `log-slow-queries = /var/log/slow-queries.log`，MySQL\
  \ 就会告诉你花费较长时间完成的查询。\n- 使用 `OPTIMIZE TABLE tablename` 来整理表碎片并刷新索引。\n\n#### 参考文献\n\
  \n- [www.coker.com.au/bonnie++/](http://www.coker.com.au/bonnie++)——bonnie 的主页，一个磁盘基准测试工具。它还包含\
  \ RAID 基准测试工具和 Postal（用于 SMTP 服务器的基准工具）。\n- [www.phoronix-test-suite.com/](http://www.phoronix-test-suite.com/)——Phoronix\
  \ Test Suite 由一个从事自动化测试和比较的网站创建，是一种质量基准软件。\n- [`httpd.apache.org/docs-2.0/misc/perf-tuning.html`](http://httpd.apache.org/docs-2.0/misc/perf-tuning.html)——Apache\
  \ 调优官方指南。\n- [`dev.mysql.com/doc/refman/5.6/en/optimization.html`](http://dev.mysql.com/doc/refman/5.6/en/optimization.html)——从源码学习优化\
  \ MySQL。\n- *High Performance MySQL*, Jeremy Zawdny 和 Derek Balling 著（O'Reilly），ISBN\
  \ 0-596-00306-4。\n\n## 21 内核与管理\n\n### 本章内容\n\n- Linux 内核\n- 模块管理\n- 何时重新编译\n- 内核版本\n\
  - 获取内核源码\n- 补丁内核\n- 编译内核\n- 出现问题\n- 参考文献\n\n### 引言\n\n内核是一个复杂的软件，负责管理操作系统内部的进程和进程交互。作为用户，你很少或从不直接与它交互。相反，你与内核管理的应用程序进行工作。\n\
  \nLinux 内核就是 Linux。它是全球范围内人员多年合作（有时也存在争议）的结果。只有一个公共内核源码树，但每个主要的 Linux 发行版都会对其版本进行微调，以添加功能、性能或选项。每个\
  \ Linux 发行版（包括 Ubuntu）都自带了自己的预编译内核以及内核源码，这让你对 Linux 操作系统拥有绝对权威。本章涵盖了内核及其对我们以及操作系统做了什么。\n\
  \n在本章中，你还将学习如何获取内核源码以及何时以及如何打补丁。本章将带你进行内核架构的专家之旅，并教你内核配置、构建和安装模块以及在 Ubuntu 中编译驱动程序的关键步骤。\n\
  \n\n\n\n几乎所有用户都发现预编译的 `Ubuntu` 内核符合他们的需求（而且有多个版本供选择）。在某些时刻，你可能需要重新编译内核以支持特定的硬件，或者为操作系统添加新功能，尽管\
  \ Ubuntu 内核团队已经在非常努力地回溯支持或启用任何可能的功能（作为模块），因此你极可能不会有需求。他们也非常平易近人，并乐意讨论特定的需求和功能。有时，某些功能没有启用仅仅是因为没有人请求过或需要过。偶尔，某些功能未启用是因为与另一个功能发生冲突。在这些情况下，Ubuntu\
  \ 内核团队可以帮助你发现发生了什么（但请不要滥用他们的善意和时间，他们工作已经非常辛苦且时间很长了）。\n\n实际上，今天人们自己编译内核的主要原因是他们想学习成为一名内核开发者。如果你听过关于重新编译\
  \ Linux 内核之困难的恐怖故事，你可以放松了；本章将为你提供所需的所有信息，如果你对学习新技能感兴趣，就能理解如何无痛地完成这一过程。这是一项复杂且注重细节的任务，但对于大多数技术用户来说是可以胜任的，即使它是完全没有必要的。\n\
  \n## 警告\n构建和使用自定义内核将使你的系统很难获得支持。虽然编译自己的内核是一种学习体验，但你将不允许在 `Ubuntu` 中为自定义构建的内核提交 报告（如果你这样做，它们将被拒绝且不作进一步解释），而且如果你与\
  \ `Ubuntu/Canonical` 签有商业支持合同，这将导致合同失效。\n\n## Linux 内核\nLinux 内核是操作系统管理部分，许多人称之为\
  \ `Linux`。尽管许多人将整个发行版视为 Linux，但唯一可以正确被称为 Linux 的部分是内核。Ubuntu 与许多 Linux 发行版一样，包含一个带有附加软件的内核，这些软件与内核交互，使用户能够以意义的方式与系统交互。系统实用程序和用户程序让计算机成为用户的有用工具。\n\
  \n## 第一个 Linux 内核\n1991 年，Linus Torvalds 发布了 Linux 内核的 `.99` 版本，这是他为自己的 Intel 80386\
  \ 个人电脑想要一个强大的、类 UNIX 操作系统的结果。Linus 编写了创建现在所知的 Linux 内核所需的初始代码，并与 Richard Stallman\
  \ 的 GNU 工具相结合。事实上，由于许多 Linux 基础系统工具源自 GNU 项目，许多人将该操作系统称为 `GNU/Linux`。从那时起，Linux\
  \ 受益于数千名贡献者为 Linux 项目投入他们的才华和时间。Linus 仍在维护内核，决定哪些内容将和不会作为正式发布进入内核，这被许多人称为 `vanilla`\
  \ 或 `Linus` Linux 内核。\n\n## Linux 内核版本号\n2011 年，内核版本命名系统移动到了 `3.0`，主要因为 Linus 觉得是时候对命名进行新的开始了，而且这样做提供了一个移除内核代码中一些旧的、不再使用的部分的好机会。本章中的所有内容都适用于最新的内核版本，无论你使用的是\
  \ `2.6` 版本还是 `3.0` 版本。本版本的编写是在 Ubuntu 开发者决定随 `Ubuntu 11.10` 发送哪个内核版本之前完成的。本章中的示例在过渡期间为了获得最大的灵活性使用了\
  \ `2.6`，但如果你知道你拥有 `3.0` 内核且信息仍然适用，你可以在适当的地方将引用改为 `3.0`。\n\n## Linux 源码树\nLinux 内核的源代码保存在一组名为\
  \ `kernel source tree`（内核源码树）的目录中。内核源码树的结构很重要，因为编译（构建）内核的过程是自动化的；它由 `make` 应用程序解释的脚本控制。这些脚本被称为\
  \ `makefiles`，它们期望在特定位置找到内核代码片段；如果找不到这些片段，它们将无法工作。你将在本章的后后部分学习如何使用 `make` 来编译内核。\n\
  \nLinux 内核源代码不需要安装在你的系统中即可运行系统，或让你完成电子邮件、网页浏览或文字处理等典型任务。然而，如果你想编译新内核，则必须安装源码。在下一节中，你将学习如何安装内核源码文件以及如何设置所需的符号链接。该链接是\
  \ `/usr/src/linux-2.6`，在我们检查内核源码树的内容时，通过它来引用内核源码树目录。\n\n`/usr/src/linux-2.6` 目录包含了\
  \ `.config` 和 `Makefile` 文件等。`.config` 文件是你 Linux 内核在编译时的配置。默认情况下没有 `.config` 文件；你必须从\
  \ `/configs` 子目录中选择一个。在那里，你将找到 Ubuntu 提供的每种口味内核的配置文件；只需将适用于你系统的文件拷贝到默认目录并重命名为 `.config`。\n\
  \n我们已经讨论过 `/configs` 子目录的内容，让我们检查在 `/usr/src/linux-2.6` 下的其他目录。对我们最有用的是 `Documentation`\
  \ 目录。在它及其子目录中，你将找到关于内核每个部分的几乎所有文档。`00-INDEX` 文件（每个 `Documentation` 子目录也包含一个 `00-INDEX`\
  \ 文件）包含了主目录中的文件列表以及对它们的简要解释。许多文件仅为内核编程师和应用程序编写者编写，但对于中级或高级 Linux 用户在尝试学习内核和设备驱动程序问题时，少数文件是有用的。一些比较有趣且实用的文档如下：\n\
  \n- `devices.txt`——`/dev` 目录中表示的所有可能的 Linux 设备的列表，给出了主设备和次设备号以及简短描述。如果你遇到过提到 `char-major-xxx`\
  \ 的错误信息，该文件就是存放该列表的地方。\n- `ide.txt`——如果你的系统使用 IDE 硬盘，此文件讨论了内核如何与它们交互，并列出了可以用于解决\
  \ IDE 相关的硬件问题、手动设置数据传输模式以及其他手动管理你的 IDE 硬盘的各种内核命令。大部分管理是自动的，但如果你想理解内核如何与 IDE 设备交互，此文件解释了这一点。\n\
  - `initrd.txt`——此文件提供了关于初始内存磁盘（initial RAM disks）更深入的知识，提供了用于创建和挂载它们的回环文件系统的细节，并解释了内核如何与它们交互。\n\
  - `kernel-parameters.txt`——此文件列出了大多数可以在启动时传递以配置内核或硬件设置的参数，但初看之下似乎并不好用，因为它只是一个列表。然而，知道某个参数的存在并可能与你正在寻找的内容相关可以帮助你追踪更多信息，因为你现在有了可以输入\
  \ Google 等互联网搜索引擎的术语。\n- `sysrq.txt`——如果你曾好奇过键盘上标记为 SysRq 的键是做什么用的，这个文件提供了答案。简之，它是硬编码在内核中的键组合，可以帮助你从系统锁定中恢复。Ubuntu\
  \ 出安全考虑禁用了此功能。你可以通过输入命令 `echo \"1\" > /proc/sys/kernel/sysrq` 重新启用它，通过回 `0` 而不是\
  \ `1` 来禁用它。\n\n\n\n\n在 `Documentation` 下的其他目录中，你会发现类似的文本文件，它们分别处理 CD-ROM 驱动程序、文件系统驱动程序、游戏端口和摇杆驱动程序、视频驱动（不是显卡驱动；那些属于\
  \ X11R6 而非内核）、网络驱动以及 Linux 操作系统中的所有其他驱动和其他系统。同样，这些文档通常是为程序员编写的，但它们也可以为中高级 Linux\
  \ 用户提供有用信息。\n\n名为 `scripts` 的目录包含许多 `make` 使用的脚本。对于任何不是程序员或内核开发者（也称为 `kernel hacker`）的人来说这里确实不包含任何他们感兴趣的内容。\n\
  \n内核编译完成后，所有编译后的文件将位于 `arch` 目录及其子目录下。虽然你可以手动将它们移动到最终位置，但你将在本章的后部分学习 `make` 脚本将如何为你完成这一工作的。在\
  \ Linux 早期，这种编译后的文件重定位完全是手工完成的；你应该感谢 `make`。\n\n***\n\n### 注意事项\n\n`make` 工具是一个复杂的程序。你可以在\
  \ [www.gnu.org/software/make/manual/make.html](http://www.gnu.org/software/make/manual/make.html)\
  \ 找到关于 `make` 文件结构以及它可以接受的参数的完整文档。\n\n***\n\n`/usr/src/linux-2.6` 中的其余目录包含内核和内核驱动程序的源码。当你安装内核源码时，这些文件会自动放置在该处。当你补丁内核源码时，这些文件会被修改。当你编译内核时，这些文件会被自动访问。尽管你永远不需要接触源码文件，但它们是有用的。内核源码文件只不过带有特殊格式的文本文件，这意味着我们可以查看它们并阅读程序员的注释。有时，程序员会写一个应用程序但无法（或通常不会）编写文档。程序员放在源代码中的注释往往是该代码唯一存在的文档。\n\
  \n一些小型测试程序甚至“隐藏”在某些代码的注释中，并附有注释以及与其他信息的引用。由于源代码使用的语言几乎可以像英语一样易读，非程序员可能能够了解该应用程序或驱动程序实际上在做什么（参见\
  \ 第 39 章“Ubuntu 的 C/C++ 编程工具”）。当中高级 Linux 用户遇到内核和驱动程序相关的问题时，这些信息可能对他们有用。\n\n***\n\
  \n### 注意事项\n\n硬件的交互和控制由内核的一小部分处理，称为 `device driver`。驱动程序告诉计算机如何响应用户提示，与调制解调器、SCSI\
  \ 卡、键盘、鼠标等进行交互。没有设备驱动程序，内核不知道如何与关联设备进行交互。\n\n***\n\n### 内核类型\n\n在 Linux 早期，内核是单块代码，包含了针对处理器、主板和其他硬件的所有指令。如果你更改了硬件，就必须重新编译内核代码，以包含你需要的内容并丢弃不需要的内容。包含额外的、不需要的代码会带来代价，因为内核会变得更大并占用更多内存。在当时只有\
  \ 4MB 到 8MB 内存的旧系统上，为了不必要的代码浪费珍贵的内存被认为是不可接受的。由于早期 Linux 用户试图从计算机中榨出最大的性能，内核编译在当时被视为一种“黑艺术”。这些作为单块代码编译的内核被称为\
  \ `monolithic kernels`（单体内核）。\n\n随着内核代码越来越增大，可以添加到计算机的设备数量增加，重新编译的要求变得非常繁重。开发了一种新的内核构建方法来使编译任务更容易。内核源码中组成设备驱动程序代码的部分可以选择性编译为模块，并根据需要加载和卸载到内核中。这被称为构建内核的\
  \ `modular`（模块化）方法。现在，所有内核代码都可以一次性编译，大部分代码被编译到这些模块中。只加载需要的模块；内核可以保持较小，且添加硬件变得简单得多。\n\
  \n典型的 Ubuntu 内核有一些驱动程序被编译为内核本身的一部分（称为 `inline drivers` 内联驱动），而另一些编译为模块。在启动过程中，只有内联编译的设备驱动程序对内核可用；模块化驱动程序只有在系统启动后才可用。\n\
  \n***\n\n### 注意事项\n\n作为一个常见的例子，如果你打算从 SCSI 磁盘启动，则 SCSI 磁盘驱动程序必须对内核可用。如果内核在编译时没有将这些驱动程序内联，系统将无法启动，因为无法访问磁盘。\n\
  \n模块化内核解决此问题的方法是使用初始 RAM 磁盘（`initrd`），这将在稍后的“创建初始 RAM 磁盘镜像”部分中讨论。`initrd` 加载一个小内核和适当的设备驱动程序，然后它可以访问设备以加载你想运行的实际内核。\n\
  \n***\n\n某些代码只能是二选一（出于对普通用户而言不重要的技术原因），但大多数代码都可以以模块化或内联的方式编译。根据应用程序的不同，某些系统管理员倾向于一种方法而非另一种方法，但有了快速的现代处理器和充足的系统内存，除了最狂热的\
  \ Linux 黑客外，性能差异已几乎不值得担心。\n\n在编译内核时，选择模块化或内联的步骤是本章稍后详细介绍的 `make config` 步骤的一部分。除非你有特定的理由这样做，否则在提供选择时选择模块化选项。因为你管理内核比比编译内核频繁，管理模块的过程将在下一节介绍。\n\
  \n### 管理模块\n\n使用模块化内核时，需要特殊的工具来管理模块。模块必须加载和卸载，如果能尽可能自动地完成就很好。我们还需要在加载模块时向它们传递必要的参数，例如内存地址和中断。（这些信息随模块而异，因此你需要查看模块的文档来确定需要传递它的什么信息。）本节介绍用于管理模块的工具，然后查看使用它们的几个示例。\n\
  \nLinux 提供了以下模块管理工具供我们使用。所有这些命令（以及 `modprobe.conf`）都有手册页：\n\n- `lsmod`——该命令列出已加载的模块。建议将其通过\
  \ `less` 命令进行处理，因为列表通常超过一页。\n\n- `insmod`——该命令将指定的模块加载到运行的内核中。如果给出没有完整路径的模块名称，将搜索运行内核的默认位置\
  \ `/lib/modules/*/`。该命令提供了几个选项；最有用的是 `-f`，它可以强制加载模块。\n\n- `rmmod`——该命令从运行的内核中卸载（移除）指定的模块。一次可以指定多个模块。\n\
  \n\n\n\n\n- `modprobe`—`insmod` 和 `rmmod` 的更高级版本，它使用由 `depmod` 创建的依赖文件并自动处理加载，或者通过\
  \ `-r` 移除模块。然而，它没有强制加载选项。`modprobe` 一个实用的选项是 `-t`，它会让 `modprobe` 遍历一组驱动程序，直到找到与你的系统匹配的一个。如果你不确定哪个模块适用于你的网卡，可以使用此命令：\n\
  \n```bash\nmatthew@seymour:~$ sudo modprobe -t net\n```\n\n使用 `net` 术是因为它是存放所有网络驱动程序的目录名称（`/lib/modules/*/kernel/net`）。它会逐一尝试每一个，直到成功加载其中一个。\n\
  \n- `modinfo`—该命令查询模块的对象文件，并提供模块名称、作者、许可证以及存在的任何其他信息的列表。它通常并不实用。\n\n- `depmod`—此程序为内核模块创建依赖文件。某些模块需要先加载其他模块；也就是说，它们“依赖”其他模块。（内核代码大部分都是这样，因为这消除了代码库中的冗余。）在启动过程中，一个启动文件之一包含命令\
  \ `depmod -a`，并且会在每次启动时运行，以重新创建 `/lib/modules/*/modules.dep` 文件。如果你更改了 `/etc/modprobe.conf`\
  \ 文件，请手动运行 `depmod -a`。`depmod` 命令、其依赖列表以及 `/etc/modprobe.conf` 文件使得内核模块能够根据需要自动加载。\n\
  \n- `/etc/modprobe.conf`—这不是一个命令，而是一个控制 `modprobe` 和 `depmod` 行为的文件；它包含了内核模块变量。虽然语法可能相当复杂，但大多数实际需求都是简单的。最常见的用法为模块设置别名并向其传递某些参数。例如，在以下代码中，我们将一个设备名称（来自\
  \ `devices.txt`）别名为更具描述性的词，然后向关联模块传递一些信息。`i2c-dev` 设备用于读取我们系统的 CPU 温度和风扇速度。这些用于\
  \ `/etc/modprobe.conf` 的行是程序文档建议我们使用的。我们使用文本文本编辑器添加了它们：\n\n```text\nalias char-major-89\
  \ i2c-dev\noptions eeprom ignore=2,0×50,2,0×51,2,0×52\n```\n\n这里显示了 `lsmod` 的部分列表，通过\
  \ `less` 命令管道传输，使我们能够逐页查看：\n\n```bash\nmatthew@seymour:~$ sudo lsmod | less\n```\n\
  \n```text\nModule              Size  Used by\nparport_pc          19392  1\nModule\
  \              Size  Used by\nparport_pc          19392  1\nlp                 \
  \ 8236  0\nparport             29640  2 parport_pc,lp\nautofs4             10624\
  \  0\nsunrpc             101064  1\n```\n\n列表实际上要长得多，但在这里我们看到输入模块正在被 `joydev`（摇纵杆设备）模块使用，但摇杆模块并没有被使用。这台电脑有一个自动检测到的摇纵杆端口，但没有连接摇纵杆。还加载了一个扫描仪模块，但由于\
  \ USB 扫描仪未拔掉，该模块未被使用。你使用 `lsmod` 命令来确定某个模块是否已加载以及哪些模块正在使用它。如果你查看完整列表，你将看到所有连接到计算机的设备的模块。\n\
  \n要移除模块（在本例中为 `joydev`），请使用：\n\n```bash\nmatthew@seymour:~$ sudo rmmod joydev\n\
  ```\n\n或者\n\n```bash\nmatthew@seymour:~$ sudo modprobe -r joydev\n```\n\n`lsmod`\
  \ 的输出现在显示它已不再加载。如果我们同时也移除 `input`，那么我们就可以通过简单的命令使用 `modprobe` 同时加载 `input` 和 `joydev`（记住，它们是相互依赖的），如下：\n\
  \n```bash\nmatthew@seymour:~$ sudo modprobe joydev\n```\n\n如果 Ubuntu 拒绝加载某个模块（因为它是使用你当前运行的内核内核版本编译的——例如，\
  \ NVIDIA 显卡模块），你可以这样强制加载它：\n\n```bash\nmatthew@seymour:~$ sudo insmod -f nvidia\n\
  ```\n\n在这种情况下，如果内核生成了任何抱怨（错误消息），你可以忽略它们。\n\n### 何时重新编译\n\nUbuntu 系统使用原生 Linux 内核的修改版本（一个修改版本）。Linux\
  \ 内核处于持续开发状态。随着新功能的添加、错误的修复以及新技术引入代码库，提供内核的稳定版本变得非常有必要。\n\n### 内核版本\n\n内核版本可以分为四个部分：\n\
  \n- **主版本（Major version）**—这是主版本号。\n- **次版本（Minor version）**—这是次版本号。\n- **子版本号（Sublevel\
  \ number）**—此数字表示内核的当前迭代。\n- **额外版本级（Extraversion level）**—这是代表 Ubuntu 工程师对内核进行的补丁和添加的数字。\n\
  \n在命令行提示符处输入 `uname -r` 显示你当前的内核版本：\n\n```bash\nmatthew@seymour:~$ uname -r\n3.0.0-12-generic\n\
  ```\n\n### 获取内核源码\n\n\n\n\nLinux 内核一直对任何需要它的人免费开放。如果你只想重新编译现有的内核，请从 Ubuntu 存储库安装\
  \ `linux-source` 软件包。要获取最新的原版版本（vanilla version，这是一个常用术语，指直接来自主内核开发者的、且尚未被任何特定发行版内核团队修补或过的内核版本），请使用你喜喜欢的\
  \ FTP 客户端向 `ftp.kernel.org` 建立 FTP 连接并以匿名身份登录。由于你对 3.0 内核感兴趣，请切换目录到 `/pub/linux/kernel/v3.0`。截至本文编写，最新的稳定内核是\
  \ 3.0.4。\n\n***\n\n### 注意事项\n\n`ftp.kernel.org` 站点收到的下载请求远超其负荷。使用镜像站点来减少 `ftp.kernel.org`\
  \ 承担的流量被认为是一种礼貌行为。[www.kernel.org/mirrors/](http://www.kernel.org/mirrors/) 列出了全球所有镜像站点的列表。找到一个距离你地理位置最近的站点，并用该地址替换\
  \ `ftp.kernel.org`。\n\n***\n\n每个内核版本在 FTP 存档站点都有许多不同的条目，但由于你对对整个内核感兴趣，因此必须获取完整的源码包（例如，`linux-3.0.4.bz2`）。\n\
  \n`.bz2` 扩展名由 `bzip2` 工具应用，它的压缩率比 `gzip` 高。\n\n下载完成后，将包移动到 `/usr/src` 以外的目录并解压。`bzip2`\
  \ 解压命令是 `tar -xjvf linux-3.0.4.tar.bz2`。解压后，包会创建一个名为 `linux-3.0.4` 的新目录。将其复制到 `/usr/src`\
  \ 或移动到那里。然后，创建一个从 `linux-3.0.4` 到 `linux-3.0` 的符号链接（否则，某些脚本将无法工作）。以下是创建符号链接的方法：\n\
  \n```\nmatthew@seymour:~$ sudo rm /usr/src/linux-3.0\nmatthew@seymour:~$ sudo ln\
  \ -s /usr/src/linux-3.0.4 /usr/src/linux-3.0\n```\n\n通过创建一个指向 `/usr/src/linux-3.0`\
  \ 的符号链接，可以允许编译多个版本的内核并为不同功能进行定制：你只需将符号链接更改为你想要操作的内核目录即可。\n\n***\n\n### 注意\n\n正确的符号链接对于\
  \ `make` 的操作至关重要。务必让符号链接指向你正在工作的内核源码版本。\n\n***\n\n### 修补内核\n\n将内核修补到最新的 Linux 内核版本比下载整个源码是可能的。对于那些没有使用高速宽带连接的人来说，这种选择是有益的。无论你是修补现有源码还是下载完整源码，结果都是相同的。\n\
  \n修补内核不是一项盲目的任务。它要求用户从当前版本获取到用户想要升级到的版本的所有补丁。例如，如果你正在运行 2.6.30（并拥有这些源码）并想升级到 2.6.35，你必须获取\
  \ 2.6.31 和 2.6.32 补丁集，以此此类推。下载后，必须连续应用这些补丁以升级到 2.6.35。这比下载整个源码要琐碎，但对于那些紧进内核黑客技术并希望通过增量升级使他们的\
  \ Linux 内核尽可能更新的人非常有用。\n\n要在单次操作中修补到多个版本，你可以使用当前使用的内核版本源码目录下的 `patch-kernel` 脚本。该脚本应用所有必要的版本补丁，将你的内核更新到最新版本。\n\
  \n使用 `patch-kernel` 脚本的格式如下：\n\n```\npatch-kernel source_dir patch_dir stopversion\n\
  ```\n\n如果没有给出源目录，则默认为 `/usr/src/linux`；如果没有提供 `patch_dir`，则默认为当前工作目录。\n\n例如，假设你有一个需要修补到\
  \ 2.6.35 版本的 2.6.33 内核代码树。2.6.34 和 2.6.35 的补丁文件已从 `ftp.kernel.org` 下载并放置在源码树的 `/patch`\
  \ 目录中。你 le 在 `/usr/src/linux-2.6` 目录下执行以下命令：\n\n```\nmatthew@seymour:~$ sudo scripts/patch-kernel\
  \ /usr/src/linux-2.6.33 /usr/src/linux-2.6.33/patch\n```\n\n每个连续的补丁文件会被应用，最终创建一个\
  \ 2.6.35 代码树。如果在此操作期间发生任何错误，会创建名为 `xxx#` 或 `xxx.rej` 的文件，其中 `xxx` 是失败的补丁版本。你必须通过检查错误并查看源码和补丁来手动解决这些失败的补丁。没有经验的人将在此方面毫无成功，因为你需要理解\
  \ C 语言编程和内核编程才能知道哪里出了问题以及如何修复。由于这是原生的 2.6.33 代码树，所有补丁都成功应用了，没有错误。如果你尝试应用非标准的第三方补丁，补丁可能会失败。\n\
  \n当你成功修补内核后，就可以开始编译此代码树了。\n\n***\n\n### 使用 patch 命令\n\n如果你有一个特殊的非标准补丁需要应用（例如某个产品的补丁），可以使用\
  \ `patch` 命令而不是 `patch-kernel` 脚本。以下是创建补丁代码且不影响原始代码的某些快速步骤：\n\n1. 在你的用户目录下创建一个目录并命名为有意义的名字，如\
  \ `mylinux`。\n2. 将原始源码拷贝到那里：`cp -rav /usr/src/linux-2.6 ~/mylinux`。\n3. 将补丁文件拷贝到同一个目录：`cp\
  \ patch_filename ~/mylinux`。\n4. 进入 `~/mylinux` 目录：`cd ~/mylinux`。\n5. 应用补丁：`patch\
  \ -p1 < patch_filename > mypatch.log 2>&1`（这将输出保存到文件中）。\n6. 如果补丁应用成功，你就完成了且没有危及任何源码。如果新代码不起作用，不需要重新安装原始源码。\n\
  7. 将你的代码拷贝到 `/usr/src` 并创建上述的特殊符号链接。\n\n***\n\n### 编译内核\n\n如果你想通过下载的新源码更新内核，或者应用了补丁来添加功能或硬件支持，你必须编译并安装新内核才能使用这些功能。编译内核涉及将内核从可读代码转换为二进制形式。安装内核涉及将所有编译文件放在\
  \ `/boot` 和 `/lib` 中的正确位置，并对引导加载程序进行更改。\n\n编译过程几乎完全由 `make` 工具自动化，与安装过程类似。通过提供必要的参数并遵循后续步骤，你可以重新编译并安装自定义内核。\n\
  \n以下是编译和配置内核的步骤：\n\n1. 不要删除当前的内核，以便在你编译的内核出现问题时有一个备用。\n2. 应用所有补丁（如果有），以便获得获得你想要的功能。详见前一节。\n\
  3. 备份 `.config` 文件（如果存在），以便从不可避免的错误中恢复。使用以下 `cp` 命令：\n```\nmatthew@seymour:~$ sudo\
  \ cp .config .config.bak\n```\n\n***\n\n注意\n\n如果你正在重新编译 Ubuntu 默认内核，`/usr/src/linux-2.6/configs`\
  \ 目录包含了不同用途的多个配置文件版本。\n\n\n\n\nUbuntu 在 `configs` 子目录下提供了一整套 `.config` 文件，这些文件均根据其所编译的系统类型命名。如果你想将这些默认配置之一作为自定义内核的基础，只需将适当的文件复制到\
  \ `/usr/src/linux-2.6` 并将其重命名为 `.config` 即可。\n\n### 4. 运行 `make mrproper` 指来准备内核源码树，清理任何旧文件或二进制文件。\n\
  \n### 5. 恢复被 `make mrproper` 命令删除的 `.config` 文件，并编辑 makefile 以更改 `EXTRAVERSION`\
  \ 数字。\n\n#### 注意事项\n如果你想保留使用相同代码树编译的任何当前内核版本，请使用你喜欢的文本编辑器手动编辑 makefile，并在 `EXTRAVERSION`\
  \ 变量中添加一些独特的字符串。你可以使用任何喜欢的描述。\n\n### 6. 使用 `make config`、`make menuconfig` 或 `make\
  \ xconfig` 修改内核配置文件；我们推荐使用最后一种。\n\n### 7. 运行 `make dep` 创建稍后编译过程中使用的代码依赖关系。\n\n\
  #### 提示\n如果你有一台多处理器机器，可以通过在 `make` 命令后插入 `-jx` 来使用两个处理器来加速 `make` 过程，根据经验，`x` 是你拥有的处理器数量加\
  \ 1。你可以尝试一个更大的数字，甚至可以在单处理器机器上尝试（我们已经在 SMP 机器上成功使用过 `-j8`）；这只会占用你的 CPU。\n\n```\n\
  matthew@seymour:~$ sudo make –j3 bzImage\n```\n除了 `make dep` 之外，所有的 `make` 过程在这种并行编译方法下运行良好。\n\
  \n### 8. 运行 `make clean` 为内核的实际编译准备源码。\n\n### 9. 运行 `make bzImage` 创建内核的二进制镜像。\n\
  \n#### 注意事项\n存在若干指令选择，最常见的后续如下：\n\n- `zImage`—该指令编译内核，创建一个名为 `zImage` 的未压缩文件。\n\
  - `bzImage`—该指令创建一个压缩的内核镜像，这对于某些系统是必要的，这些系统要求内核镜像小于特定大小，以便 BIOS 能够解析；否则新内核将无法启动。这是最常用的选择。然而，用\
  \ `bzImage` 编译的 Ubuntu 内核仍然太大，无法放入软盘，因此使用移除了一些模块和功能的较小版本用于启动软盘。Ubuntu 建议从救援 CD-ROM\
  \ 启动。\n- `bzDisk`—该指令的操作与 `bzImage` 相同，但它会将新内核镜像拷贝到软盘中进行测试。这对于在不将内核文件写入硬盘的情况下测试新内核非常有帮助。确保你的驱动器中有软盘，因为系统不会提示你插入。\n\
  \n### 10. 运行 `make modules` 编译你新内核所需的任何模块。\n\n### 11. 运行 `make modules_install`\
  \ 将模块安装到 `/lib/modules` 并创建依赖文件。\n\n### 12. 运行 `make install` 自动将内核复制到 `/boot`，创建所需的其他文件，并修改引导程序以默认启动新内核。\n\
  \n### 13. 使用你喜欢的文本编辑器验证对 `/etc/lilo.conf` 或 `/boot/grub/grub.conf` 的更改；如有必要进行修复并在需要时重新运行\
  \ `/sbin/lilo`。\n\n### 14. 重启并测试新内核。\n\n### 15. 如必要，重复该过程并选择一个配置界面。\n\n随着时间的推移，配置\
  \ Linux 内核的过程发生了变化。最初，你通过对每个配置参数回答一系列提示来配置内核；这就是稍后描述的 `make config` 实用。虽然你仍然可以通过这种方式配置\
  \ Linux，但大多数用户发现这种配置既困惑又不方便；例如，返回之前的提示来纠正错误是不可能的。\n\n`make config` 工具是一个命令行工具。该工具会提出一个关于内核配置选项的问题。用户用\
  \ `Y`、`N`、`M` 或 `?` 回答。（不区分大小）。选择 `M` 将该选项配置为编译为模块。回答 `?` 显示该特定选项的上下文帮助（如果可用）。如果你选择了\
  \ `?` 且没有可用帮助，你可以转向庞大的互联网资源来寻找信息）。我们建议避免使用 `make config` 工具。\n\n如果你更倾向于使用命令行界面，可以使用\
  \ `make menuconfig` 来配置 Linux 内核。`menuconfig` 为文本界面提供了一个图形外壳。虽然它不像 `make config`\
  \ 那么原始，但 `menuconfig` 也不是华丽的图形界面；你不能使用鼠标，而必须使用键盘命令进行导航。`make config` 中呈现的相同信息由 `make\
  \ menuconfig` 呈现，但它看起来好一点。现在，至少当你改变主意或出错时，你可以在选择过程中来回移动。\n\n在 `make menuconfig`\
  \ 中，你使用方向键上下移动选择器，并使用空格键切换选择。Tab 键将底部的焦点移动到 Select（选择）、Exit（退出）或 Help（帮助）。\n\n如果没有图形桌面，`menuconfig`\
  \ 是你所做的最好的。然而，`menuconfig` 和 `xconfig`（见下文对每个项目的解释）都比直接编辑 `.config` 文件有所改进。如果你想通过真正的图形界面（支持鼠标）来配置内核，`make\
  \ xconfig` 是最好的配置选项。要使用此工具，你必须运行 X Window 系统。`xconfig` 程序实际上只是 Tcl/Tk 图形组件 `widget\
  \ set`，提供边框、菜单、对话框等。它的界面用于封装在执行时解析的数据文件。\n\n#### 使用 xconfig 配置内核\n\n为了简单起见，在这次快速演示中，我们的讨论假设你正在使用\
  \ `make xconfig`，并且在此之前你已经完成了之前所示内核编译清单中的前五个步骤。\n\n正如上一节所学，你使用 `make xconfig` 在几个配置子窗口中做出选择来配置内核。每个子窗口包含特定的内核选项。由于有数百个选择，配置内核是令人望而畏的。我们无法为你提供关于选择哪些选项的详细描述，因为你的配置将取决于你自己的系统和设置。\n\
  \n\n\n\n表 21.1 对每个子节的选项进行了简要描述，以便你了解可能会遇到的内容。我们建议你将内核的 `.config` 文件复制到 `/usr/src/linux-2.6`\
  \ 并在那里运行 `make xconfig`。探索所有选项。只要你不保存该文件，你的系统上绝对不会发生任何变化。\n\n表 21.1. 用于配置的一些内核子项\n\
  \n![Image](img/21tab01a.jpg)![Image](img/21tab01b.jpg)![Image](img/21tab01c.jpg)![Image](img/21tab01d.jpg)\n\
  \n在选择完所有需要的选项后，你可以保存配置文件，并继续执行之前显示的内核编译检查清单中的第 7 步。\n\n### 创建初始 RAM 磁盘镜像\n\n如果你需要加载特殊的设备驱动来挂载根文件系统（例如\
  \ SCSI 驱动器、网卡或特殊文件系统），你必须创建一个名为 `/boot/initrd.img` 的初始 RAM 磁盘镜像。对于大多数用户来说，没有必要创建此文件，但如果你不确定，创建它并无害。要创建一个\
  \ `initrd.img` 文件，请使用 shell 脚本 `/sbin/mkinitrd`。\n\n命令格式如下，其中 `file_name` 是你想要创建的镜像文件名：\n\
  \n```\n/sbin/mkinitrd file_name kernel_version\n```\n\n`mkinitrd` 会查看 `/etc/fstab`、`/etc/modprobe.conf`\
  \ 和 `/etc/raidtab` 以获取确定启动期间应该加载哪些模块所需要的信息。对于我们的系统，我们使用以下命令：\n\n```\nmatthew@seymour:~$\
  \ sudo mkinitrd initrd-2.6.7-1.img 2.6.7-1\n```\n\n### 当出现问题时\n\n内核编译和安装过程中可能会出现一些问题，若干线索将指向真实问题。你会在屏幕上看到打印错误信息，某些错误信息将打印到\
  \ `/var/log/messages` 文件，你可以用文本编辑器对其进行检查。如果你遵循了我们的内核补丁说明，你需要检查一个特殊的错误日志。不要担心错误，因为很多问题通过你自己的研究就可以轻松解决。然而，取决于你的技能水平和技术信息的可用性，某些错误可能是无法修复的。\n\
  \n#### 编译期间的错误\n\n虽然内核无法编译的情况很少见，但总有某些东西漏掉回归测试的可能性。让我们来看一个编译期间可能出现的问题示例。\n\n内核编译可能会崩溃且无法成功完成，特别是当你尝试使用实验性补丁、添加未经测试的功能，或者在旧系统上构建较新的、可能不稳定的模块时。\n\
  \n此时，你有两个选择：\n\n* 修复错误并重新编译。\n* 移除引起问题的模块或选项，并等待内核团队修复错误。\n\n由于内核代码的复杂性，大多数用户可能无法修复某些错误，尽管你不应该排除这种选项。可能其他人在测试内核时发现了相同的错误，并为该问题开发了补丁：检查\
  \ Linux 内核邮件列表存档。如果问题在其中没有被提到，在 Google 上进行搜索可能会发现相关内容。\n\n第二种选择（移除代码）是最简单的，也是大多数人在不需要引起问题的代码时的做法。在\
  \ NTFS 模块失败的情况下，这几乎是意料之中的，因为 NTFS 支持仍然被认为是实验性的并且容易出现错误。这主要是因为文件系统的代码是通过逆向工程实现的，而不是通过记录的标准实现的。只读支持在最近的内核中得到了改进；写入支持仍然是实验性的。\n\
  \n最后，如果你想尝试自己修复问题的任务，这是一个参与 Linux 内核并为帮助许多他人做出贡献的绝佳机会。\n\n如果你精通编程和内核事务，你可能想查看内核源码\
  \ `/usr/src/linux-2.6/` 目录下的 `Maintainers` 文件并找到代码的维护者。建议的行动方案是联系维护者，查看维护者是否知道你正在遇到的问题。如果针对特定错误没有文档记录，将错误提交给内核邮件列表也是一种选择。执行此操作的指南位于内核根目录下\
  \ `README` 文件的 `IF SOMETHING GOES WRONG:.` 章节。\n\n#### 运行时错误、引导加载程序问题和内核崩溃 (Oops)\n\
  \n运行时错误发生在内核加载时。错误信息显示在屏幕上或写入 `/var/log/messages` 文件。引导加载程序问题会在屏幕上显示消息；不会产生日志文件。内核\
  \ oops 是运行的内核中的错误，错误信息被写入 `/var/log/messages` 文件。\n\n互联网上对于 GRUB2 或内核在启动期间可能提供的几乎每类型的错误进行故障排除都有极好的文档。找到这些文档的最佳方法是去你喜喜欢的搜索引擎，输入你收到的错误的关键词。随着搜索的深入，调整你使用的关键词。\n\
  \n如果你有 GRUB 问题，GRUB 手册在线位于 [www.gnu.org/software/grub/manual/](http://www.gnu.org/software/grub/manual/)，更多信息可以在\
  \ [`help.ubuntu.com/community/Grub2`](https://help.ubuntu.com/community/Grub2) 获取。\n\
  \n### 提示\n\n为了获得最佳结果，请访问 [www.google.com/linux](http://www.google.com/linux) 查找关于\
  \ Linux 的所有信息。\n\n#### 参考文献\n\n* **[www.kernel.org/](http://www.kernel.org/)**——内核内核存档。所有开发的源头。\n\
  * **[www.kerneltffic.org/kernel-traffic/index.html](http://www.kerneltffic.org/kernel-traffic/index.html)**——内核流量。每周生成的内核邮件列表的摘要版本和评论。\n\
  * **[www.gnu.org/](http://www.gnu.org/)**——自由软件基金会。整个内核过程中使用的手册和软件。`make` 和 `gcc`\
  \ 等工具的官方文档就在这里。\n* **[`wiki.ubuntu.com/Kernel`](https://wiki.ubuntu.com/Kernel)**——了解\
  \ Ubuntu 及其内核使用的任何问题的起点。\n* **[`wiki.ubuntu.com/Kernel/FAQ`](https://wiki.ubuntu.com/Kernel/FAQ)**——Ubuntu\
  \ 内核团队回答关于 Ubuntu 使用 Linux 内的常见问题。\n* **[www.tldp.org/](http://www.tldp.org/)**——Linux\
  \ 文档项目。所有 Linux 文档的圣地。关于 Linux 的 HOWTO 文档、FAQ 和在线书籍的优秀来源。\n* **[www.minix.org/](http://www.minix.org/)**——非官方\
  \ minix 网站。它包含了指向 minix 信息的链接以及指向实际主页的链接。尽管 minix 仍受版权保护，所有者已授予所有人无限权利。亲眼看看这个开发\
  \ Linux 的操作系统。\n\n\n\n\n\n文件和打印机共享都是非常重要的，因为一个人拥有一多台电脑的情况并不罕见。无论你是想在不同的电脑之间共享照片，还是希望有一个用于协作的中央存储库，文件共享都是我们信息时代的重要部分。与之相随的是共享打印机的需求；毕竟，人们不想为了快速打印一封信就反复插拔电脑与打印机之间的连接线。\n\
  \n无论你内需要在网络上共享文件和打印机的原因是什么，你都可以在本章了解到如何实现这两种操作。我们将介绍如何使用流行的 `UNIX NFS` 协议和更适合 Windows\
  \ 环境的 `Samba` 系统来共享文件。你还将了解到如何使用 `JetDirect` 等接口配置网络连接打印机。我们同时涵盖了图形界面工具和命令行工具，因此你应该能找到适合你工作方式的工具。\n\
  \n### 注意事项\n\n默认情况下，`Ubuntu` 发行时会阻塞所有的网络端口。这意味着在初次安装时，它不会监听任何网络端口上的任何请求。要配置防火墙，请参考第\
  \ 19 章中的“加固你的机器”所述，使用 `Uncomplicated Firewall (UFW)`。\n\n### 使用网络文件系统\n\n`Network\
  \ File System (NFS)` 是由 Sun Microsystems 开发的协议，允许计算机使用远程文件系统就像它是本地机器的一个真实部分一样。`NFS`\
  \ 的常见用途是让用户的 `/home` 目录出现在他们使用的每台本地机器上，从而消除了对物理主目录的需求。这为“热桌位办公”（hot desking）和其他灵活的工作安排提供了便利，特别是无论用户位于何处，他们的\
  \ `/home` 目录都会随身携带。\n\n`NFS` 的另一个流行用途是在相似的计算机之间共享二进制文件。如果你有一个想要让所有机器都拥有的新版本软件包，你只需要在\
  \ `NFS` 服务器上进行升级，所有运行相同版本 `Ubuntu` 的主机都将拥有相同的升级后软件包。\n\n#### 安装、启动或停止 NFS\n\n`Ubuntu`\
  \ 默认没有安装 `NFS`，因此你需要安装 `nfs-kernel-server` 软件包。`NFS` 本身由几个共同工作的程序组成。其中之一是 `portmap`，它将\
  \ `NFS` 请求映射到正确的守护进程。另外两个是 `nfsd`（即 `NFS` 守护进程）和 `mountd`（控制文件系统的挂载和卸载）。\n\n`Ubuntu`\
  \ 会自动将 `NFS` 添加到系统启动脚本中，因此在你配置后它将始终可用。要检查这一点，请使用命令 `sudo /etc/init.d/nfs-kernel-server\
  \ status`，它将向你显示服务正在运行。如果你需要手动启动 `NFS` 服务器，使用以下命令：\n\n```bash\nmatthew@seymour:~$\
  \ sudo /etc/init.d/nfs-kernel-server start\n Exporting directories for NFS kernel\
  \ daemon:  [ OK ]\nStarting NFS kernel daemon:               [ OK ]\n```\n\n在此示例中，`NFS`\
  \ 已启动。使用 `stop` 停止服务或使用 `restart` 重启服务器。这种控制 `NFS` 的方法非常方便，特别是在进行了配置更改之后。请参阅下一节了解如何在你的\
  \ `Ubuntu` 系统上配置 `NFS` 支持。\n\n#### NFS 服务器配置\n\n你可以通过编辑 `/etc/exports` 文件来配置 `NFS`\
  \ 服务器。该文件与 `/etc/fstab` 文件类似，都用于设置被导出的文件系统的权限。条目格式所示：\n\n```\n/file/system yourhost(options)\
  \ *.yourdomain.com(options) 192.168.0.0/24(options)\n```\n\n这显示了三个用于共享 `/file/system`\
  \ 的常见客户端。第一个 `yourhost` 仅向一个主机共享 `/file/system`。第二个 `.yourdomain.com` 使用星号 (`*`)\
  \ 作为通配符，允许 `yourdomain.com` 中的所有主机访问 `/file/system`。第三个共享允许允许 C 类网络 `192.168.0.0`\
  \ 的所有主机访问 `/file/share`。为了安全起见，最好不要跨互联网使用共享（如最后两个），因为数据经过的任何网络中的人都可以读取这些数据。\n\n\
  表 22.1 显示了一些常用选项。\n\n表 22.1 `/etc/fstab` 选项\n\n![Image](img/22tab01.jpg)\n\n以下是\
  \ `/etc/exports` 文件的示例：\n\n```bash\n# /etc/exports: 导出到 NFS 客户端的 own 系统访问控制列表\n\
  #               请参阅 exports(5)。\n/home/matthew 192.168.0.0/24(rw,no_root_squash)\n\
  ```\n\n该文件将 `/home/matthew` 导出给 `192.168.0.*` 中的任何主机，并允许用户读写 `/home/matthew`。\n\n\
  完成 `/etc/exports` 文件的编辑后，以下命令会将 `/etc/exports` 中的所有文件系统导出到 `/var/lib/nfs` 目录下的 `xtab`\
  \ 列表中，该列表作为 `var` 的指南：\n\n```bash\nmatthew@seymour:~$ sudo exportfs -a\n```\n\n\
  `-r` 选项代表重新导出（re-export），告诉 `exportfs` 命令重新读取 `/etc/exports`。你也可以使用 `exportfs` 导出特定目录：\n\
  \n```bash\nmatthew@seymour:~$ exportfs -v /home/share\n```\n\n`async` 选项用于允许异步操作。要配置\
  \ `NFS` 客户端，请编辑 `/etc/fstab` 文件。对 `/etc/exports` 进行任何更改后，重启 `NFS` 服务器。\n\n#### NFS\
  \ 客户端配置\n\n要配置 `NFS` 客户端，你需要确保已安装 `nfs-common` 软件包。安装后，像处理本地磁盘一样编辑 `/etc/fstab`。条目可能如下：\n\
  \n```\nDevice          Mount Point  Type  Options  Freq Pass\nyourhost:/home  /nfs\
  \   0       0\n```\n\n如果你的系统使用了 `autofs`，你需要为远程挂载使用正确的 `autofs` 条目。请参阅第 5 own。\n\
  \n你也可以以 root 使用 `mount` 命令通过远程主机名和导出目录快速将远程目录挂载到本地文件系统。例如：\n\n```bash\nmatthew@seymour:\
  \ sudo mount -t nfs 192.168.2.67:/music /music\n```\n\n按下回车键后，整个远程目录就会出现在你的文件系统中。你可以使用\
  \ `df` 命令验证导入的文件系统，如下：\n\n```bash\nmatthew@seymour:~$ df\nFilesystem     1k-blocks\
  \ Used Available Use% Mounted on\n/dev/hda2      18714368 9642600 8121124 55% /\n\
  /dev/hda1       46636 13247 30981 30% /boot\nnone           120016 0 120016 0% /dev/shm\n\
  192.168.2.67:/music 36875376 20895920 14106280 60% /music\n```\n\n\n\n\n\n在使用 `mount`\
  \ 命令之前，请确保所需的挂载点已存在。完成对该目录的使用（例如拷贝备份）后，你可以使用 `umount` 命令移除远程文件系统。请注意，如果你将根目录（`/`）指定为挂载点，在重启之前无法卸载\
  \ NFS 目录（因为 Linux 会报错文件系统正在使用）。\n\n### 让 Samba 工作起来\n\nSamba 使用`会话消息块 (SMB)` 协议让\
  \ Windows 操作系统（或任何操作系统）访问 Linux 文件。通过 Samba，你可以让你的 Ubuntu 机器在网络上的其他 Windows 电脑看起来就像一台\
  \ Windows 计算机。你不需要在 PC 上安装 Windows。\n\nSamba 是一个复杂的程序——仅仅是配置文件的 `Samba` 手册页（转换为文本后）就有\
  \ 330KB 大，且长达 7,226 行。尽管 Samba 很复杂，但设置和使用它并不一定非得困难。它有许多选项，这导致了 Samba 的某些复杂性来源。根据你的需求，Samba\
  \ 的用法可以如你希望般简单或复杂。\n\n幸运的是，Ubuntu 默认包含了一种非常简单访问 Windows 网络共享文件的方法。首先，从菜单中点击“位置”(Places)，“网络”(Network)。你会看到一个\
  \ Windows 网络图标，双击它会显示网络上发现的所有 Windows 域或工作组。只需双击那里的任何计算机图标即可访问共享和文件。\n\n要从你的 Ubuntu\
  \ 桌面共享内容，在使用文件浏览器时右键点击你拥有的文件夹（可能是 `/home/username` 目录下的某个），并选择“共享选项”(Sharing Options)。你将有机会确认共享该文件夹的意图并为其命名。共享赋予了他人查看的权限，但不一定具有创建或删除文件的权限，尽管这些权限也可以从此菜单中获得。如果你的电脑上尚未安装\
  \ Windows 共享服务，Ubuntu 会提示你请求权限以安装该服务。\n\n***\n\n#### 注意\n\n大多数 Ubuntu 用户将不需要本节其余部分包含的信息，因为安装共享服务也会处理配置，结果是，一切都将正常工作。\n\
  \n***\n\n可以使用 `Samba 网页管理工具 (SWAT)` 从浏览器浏览器配置 Samba。SWAT 提供了一种简单的方法来启动和停止 Samba\
  \ 服务器；设置打印服务；定义远程访问权限；以及创建 Samba 用户名、密码和共享目录。本节将深入探讨配置 Samba 的基础知识，你应该先阅读如何手动配置\
  \ Samba，以了解软件的工作原理。在本节末尾，你将学习如何启用、启动并使用 SWAT 来设置简单的文件共享。\n\n与 Ubuntu 自带的大多数软件一样，Samba\
  \ 遵循 GPL 许可协议且免费。安装过程非常简单，且软件位于 Ubuntu 仓库中。无论你采取哪种路径，你都应该获取 `samba` 和 `swat` 软件包。\n\
  \n从源码安装可能更耗时。然而，如果你不想使用 Ubuntu 的默认位置安装，那么从源码安装是一种更具可配置的方法。只需从 [www.samba.org/](http://www.samba.org/)\
  \ 下载源码并解压文件。进入源码目录，以 root 身份运行 `./configure` 命令并对默认值进行任何更改。然后运行 `make, make test`（如果你想的话），最后运行\
  \ `make install` 将 Samba 安装到指定位置。\n\n***\n\n#### 注意\n\n如果你还没有这样做，你可能需要安装一个名为 `build-essential`\
  \ 的元包（提供多个相关包的单个包）。该包会自动安装所有 `make` 工具，以及你从源码编译软件时所需的其他开发实用。\n\n***\n\n当你安装 Samba\
  \ 时，最好也安装 `samba-doc` 和 `samba-doc-pdf` 软件包，因为它们包含了文本、PDF 和 HTML 格式的详细文档。安装后，你可以在\
  \ `/usr/share/doc/samba*/doc` 中找到这些文档。如果你使用 Ubuntu 光盘安装 Samba，你可以在从 `/usr/share/doc/samba-doc`\
  \ 或 `/usr/share/doc/samba-doc-pdf` 开始的目录树中找到大量文档，包括 PDF、HTML 和文本等格式。总之，源码中包含了几乎\
  \ 3MB 的文档。\n\n安装 Samba 后，你可以创建 `/etc/samba/smb.conf` 文件，也可以使用 Samba 提供的 `smb.conf`\
  \ 文件，在 Ubuntu 中，该文件默认位于 `/etc/samba` 目录下。你可以在 `/usr/share/doc/samba*/examples` 目录下找到近十个示例配置文件。\n\
  \n***\n\n#### 注意\n\n根据你的需求，`smb.conf` 可以是一个少于 20 行的简单文件，也可以是一个跨越许多页文本的巨大文件。如果你的需求很复杂，我建议你浏览《Samba\
  \ 官方教程和参考指南》(The Official Samba HOWTO and Reference Guide) 或 TOSHARG。你可以在 [`samba.org/samba/docs/man/Samba3-HOWTO/`](http://samba.org/samba/docs/man/Samba3-HOWTO/)\
  \ 找到这个帮助指南。\n\n***\n\n#### 使用 /etc/samba/smb.conf 手动配置 Samba\n\n`/etc/samba/smb.conf`\
  \ 文件分为若干部分。每个部分都是共享资源（share）的描述，并应适当命名。三个特殊部分如下：\n\n- `[global]`——建立全局配置设置（在 `smb.conf`\
  \ 手册页中详细定义，该手册位于 `/usr/share/doc/samba/docs`）。\n- `[homes]`——共享用户的 `/home` 目录并指定目录路径。\n\
  - `[printers]`——通过定义共享打印机和打印机访问来处理打印。\n\n`/etc/samba/smb.conf` 配置文件中的每个部分应根据共享的资源命名。例如，如果共享\
  \ `/local/programs`，你可以将该部分命名为 `[programs]`。设置此共享的最简单快速方法是使用以下 `smb.conf` 示例：\n\n\
  ```\n[programs]\npath = /local/programs\nwriteable = true\n```\n\n这会将 `/local/programs`\
  \ 目录共享给任何请求的有效用户，并使该目录可写。这是最基本的共享，因为它没有对目录设置任何限制。\n\n以下是你可以在部分中设置的一些参数：\n\n- 要求用户在访问共享目录前输入密码\n\
  - 限制访问共享目录的主机\n- 修改用户允许拥有的权限\n- 限制访问目录的时间\n\n可能性几乎是无限的。在各个部分中设置的任何参数都会覆盖 `[global]`\
  \ 部分中设置的参数。以下部分为 `[programs]` 部分添加了一些限制：\n\n```\n[programs]\npath = /local/programs\n\
  writeable= true\nvalid users = mhelmke\nbrowseable = yes\ncreate mode = 0700\n```\n\
  \n***\n\n#### 注意\n\n你可以写作 `writeable` 或 `writable`——任何变体都有效。本章使用了这两种拼写。\n\n***\n\
  \n`valid users` 条目将 `userid` 限制为仅限 `mhelmke`。由于 `browseable = yes` 条目，所有其他用户都可以浏览目录，但只有\
  \ `mhelmke` 可以向目录写入内容。`ahudson` 在目录中创建的任何文件将赋予 `ahudson` 完全权限，但其他人将无法访问该文件。这与使用\
  \ `chmod` 命令设置权限相同。再次，有许多选项，因此在开发部分时你可以尽情发挥创意。\n\n##### 通过 [global] 部分设置全局 Samba\
  \ 行为\n\n\n\n\n\n`[global]` 部分设置的参数为整个 Samba 建立了配置设置。如果某个参数没有在其他部分中专门设置，Samba 将使用\
  \ `[global]` 部分中的默认设置。`[global]` 部分还设置了 Samba 的通用安全配置。`[global]` 部分是唯一不需要在括号中命名名称的部分。\n\
  \nSamba 假设在第一个未标记为 `[global]` 的括号部分之前的所有内容都是全局配置的一部分。（在 `/etc/samba/smb.conf` 中使用带括号的标题可以让你的配置文件更具可读性。）接下来的章节将讨论共享目录和打印机的常用\
  \ Samba 设置。随后，你将看到如何测试你的 Samba 配置。\n\n### 使用 `[homes]` 部分共享主目录\n\n`[homes]` 部分为用户共享\
  \ Ubuntu 的 `/home` 目录。当用户的 Windows 计算机连接到持有 `/home` 目录的 Linux 服务器时，`/home` 目录会自动共享。使用默认配置的一个问题是，用户会看到所有的配置文件（例如\
  \ `.profile` 以及其他文件名以点开头的文件），而这些文件在他们通过 Linux 登录时通常是看不到的。避免这种情况的一种快速方法是在 `[homes]`\
  \ 部分中包含路径选项。要使用此解决方案，任何需要其 `/home` 目录 Samba 共享的用户都需要一个独立的“主目录”作为他们的 Windows `/home`\
  \ 目录。\n\n例如，这个伪主目录可以是你 Ubuntu 系统上每个用户 `/home` 目录下名为 `share` 的目录。在使用 SWAT 时，可以通过在指定默认\
  \ `homes` 共享路径时使用 `%u` 选项来指定路径选项（参见本章节稍后的“使用 SWAT 配置 Samba”部分）。完整的路径设置如下：\n\n```\n\
  /home/%u/share\n```\n\n此设置指定每个用户目录下的 `share` 目录为共享的 Samba 目录。提供独立“主目录”的相应手动 `smb.conf`\
  \ 设置如下：\n\n```ini\n[homes]\n    comment = Home Directories\n    path = /home/%u/share\n\
  \    valid users = %S\n    read only = No\n    create mask = 0664\n    directory\
  \ mask = 0775\n    browseable = No\n```\n\n如果你有一个默认的 `[homes]` 部分，该共享将以用户命名显示在用户的“网络邻域”中。当用户连接时，Samba\
  \ 会扫描 `smb.conf` 中的现有部分，查找用户 `/home` 目录的特定实例。如果没有，Samba 将 `/etc/passwd` 中查找用户名。如果提供了正确的用户名和密码，`/etc/passwd`\
  \ 中列出的主目录将在用户的 `/home` 目录处共享。通常，`[homes]` 部分看起来所示。（`browseable = no` 防止其他用户能够浏览你的\
  \ `/home` 目录，这是一种良好的安全实践。）\n\n```ini\n[homes]\nbrowseable = no\nwritable = yes\n\
  ```\n\n此示例共享了 `/home` 目录并允许用户读写。以下是为每个用户指定独立 Windows `/home` 目录的方法：\n\n```ini\n\
  [homes]\nbrowseable = no\nwritable= yes\npath = /path/to/windows/directories\n```\n\
  \n### 通过编辑 `[printers]` 部分共享打印机\n\n`[printers]` 部分的工作方式与 `[homes]` 部分类似，但它定义了供网络使用的共享打印机。如果该部分存在，用户就可以访问你\
  \ Ubuntu `/etc/printcap` 文件中列出的任何打印机。\n\n与 `[homes]` 部分一样，当接收到打印请求时，会扫描所有部分以查找打印机。如果没有找到共享项（如果命名仔细，通常不应该出现，除非你为特定的打印机创建了部分），将扫描\
  \ `/etc/printcap` 文件查找打印机名称，然后使用该名称发送打印请求。\n\n为了让打印正常工作，你必须在你的 Ubuntu 计算机上正确设置打印服务。一个典型的\
  \ `[printers]` 部分如下：\n\n```ini\n[printers]\ncomment = Ubuntu Printers\nbrowseable\
  \ = no\nprintable = yes\npath = /var/spool/samba\n```\n\n`/var/spool/samba` 是专门为\
  \ Samba 打印设置的溢存路径。\n\n### 使用 `testparm` 命令测试 Samba\n\n在你创建 `/etc/smb.conf` 文件后，你可以使用\
  \ `testparm` 命令检查其正确性。该命令会解析你的 `/etc/smb.conf` 文件并检查任何语法错误。如果没有发现任何错误，你的配置文件可能就能正常工作。然而，它不能保证文件中指定的服务将正常运行。它仅仅是确保文件编写是正确的。\n\
  \n与所有的配置文件一样，如果你正在修改一个现有的、工作的文件，将该工作文件复制到另一个位置并修改该文件总是稳妥的。然后，你可以使用 `testparm` 工具检查文件。命令语法如下：\n\
  \n```bash\nmatthew@seymour:~$ sudo testparm /path/to/smb.conf.back-up\n```\n\n```\n\
  Load smb config file /path/to/smb.conf.back-up\nProcessing section \"[homes]\"\n\
  Processing section \"[printers]\"\nLoaded services OK\n```\n\n此输出显示文件是正确的，只要服务正在运行，Samba\
  \ 就能正常工作。现在将 `smb.conf` 复制到位置，重启 Samba。\n\n### 启动、停止和重启 `smbd` 进程\n\n一旦你的 `smb.conf`\
  \ 文件配置正确，你可能需要启动、停止或重启 Samba 进程。这可以通过 `/etc/init.d/samba` 脚本完成。从命令行启动、停止或重启 Samba，请使用\
  \ `/etc/init.d/samba` 脚本。\n\n### 使用 `smbstatus` 命令\n\n`smbstatus` 命令报告 Samba 连接的当前状态。语法如下：\n\
  \n```\n/usr/bin/smbstatus [options]\n```\n\n表 22.2 显示了一些可用选项。\n\n### 使用 `smbclient`\
  \ 命令连接\n\n`smbclient` 命令允许其他 Linux 主机上的用户访问你的 Samba 共享。你无法主机上挂载共享，但可以使用类似于 FTP 客户端的方式使用它。\n\
  \n#### 挂载 Samba 共享\n\n有两种方法可以将 Samba 共享挂载到你的 Linux 主机。挂载共享与挂载可用媒体分区或远程 NFS 目录相同，只是\
  \ Samba 共享使用 SMB 访问。第一方法使用标准的 Linux `mount` 命令：\n\n```bash\nmatthew@seymour:~$ sudo\
  \ mount -t smbfs //10.10.10.20/homes /mount/point -o username=heather,dmask=777,\\\
  \ fmask=777\n```\n\n\n\n如果你的名称服务正在运行，或者主机位于你的 `/etc/hosts` 文件中，你可以用 IP 地址替换主机名。\n\
  \n此命令将 `heather` 的 `/home` 目录挂载到你的主机上，并赋予所有用户对该挂载点的完全权限。这些权限等于 `chmod` 命令的权限。\n\n\
  第二种方法使用 `smbmount` 命令产生相同的结果如下：\n\n```bash\nmatthew@seymour:~$ sudo smbmount //10.10.10.20/homes\
  \ /mount/point -o username=heather,dmask-777,\\ fmask=777\n```\n\n要卸载共享，请使用以下标准命令：\n\
  \n```bash\nmatthew@seymour:~$ sudo umount /mount/point\n```\n\n你还可以使用这些挂载命令将真正的\
  \ Windows 客户端共享挂载到你的 Ubuntu 主机。通过 Samba，你可以配置服务器提供 Windows 能够提供的任何服务，而且除了你之外没人会知道。\n\
  \n## 使用 SWAT 配置 Samba\n\nSamba 开发者团队通过 `Samba 网页管理工具 (SWAT)` 让管理 Samba 变得简单得多。SWAT\
  \ 是一个基于 Web 的配置和维护界面，尽可能地接近点击操作的 Samba 环境。本节提供了一个如何使用 SWAT 设置对用户 `/home` 目录的 SMB\
  \ 访问以及如何共享目录的简单示例。\n\n### 注意\n\n你需要通过使用 `sudo passwd root` 命令为其设置密码来启用 root 账户。不启用\
  \ root 账户会导致你无法有效使用 SWAT。\n\n在开始使用 SWAT 之前，你需要执行几个步骤。首先，确保你已安装了 Samba 和 `swat` 包。然后，通过编辑\
  \ `/etc/inetd.conf` 文件并移除以下行中的 `#<off>#` 注释（如果有），来启用 SWAT 对系统的访问：\n\n```text\n#<off>#\
  \ swat  stream  tcp  nowait.400  root\\\n  /usr/sbin/tcpd  /isr/sbin/swat\n```\n\
  \n保存文件，然后使用以下命令重启 `openbsd_inetd` 守护进程：\n\n```bash\nmatthew@seymour:~$ sudo /etc/init.d/openbsd-inetd\
  \ restart\n```\n\n接下来，启动 X 会话，启动 Firefox，并浏览到 `http://localhost:901\\.`。你会看到一个登录提示。输入\
  \ root 用户名和密码，然后点击 OK 按钮。屏幕清除，你会看到 SWAT 主页，如图图 22.1 所示。\n\n![Image](img/22fig01.jpg)\n\
  \n图 22.1 你可以使用 SWAT 地配置和管理系统上的 Samba。\n\n### 提示\n\n你也可以使用 Ubuntu 的 `shares-admin`\
  \ 客户端配置 Samba。从 X 终端窗口的命令行启动客户端，或选择“系统-管理-共享文件夹”菜单项。\n\n首先，点击 SWAT 主页上的“全局”（Globals）图标。你会看到一个与图\
  \ 22.2 所示类似的页面。窗口中有许多选项，但你只需在安全选项（Security Options）部分的“允许主机”（Hosts Allow）字段中输入一个或多个\
  \ IP 地址或子网地址（例如 `192.168.0.—`——注意结尾的点，它允许所有主机访问；在此示例中，针对 `192.168.0` 子网），即可快速设置局域网主机的访问。如果你需要如何格式化条目的帮助，点击字段左侧的“帮助”（Help）链接。将出现一个新网页并显示相关信息。\n\
  \n![Image](img/22fig02.jpg)\n\n图 22.2 配置 Samba 以允许来自局域网特定主机或子网的访问。\n\n完成后，点击“提交更改”（Commit\
  \ Changes）按钮保存全局访问设置。下一步是创建一个 Samba 用户并设置用户密码。点击 SWAT 主页上的密码图标（参考图 22.1）。打开“服务器密码管理”页面，如图图\
  \ 22.3 所示。在“用户名”（User Name）字段中输入新用户名；然后在“新密码”（New Password）和“重复输入新密码”（Retype New\
  \ Password）字段中输入密码。\n\n![Image](img/22fig03.jpg)\n\n图 22.3 在 SWAT 密码页面中输入 Samba\
  \ 用户名和密码。\n\n### 注意\n\n你必须提供一个现有系统用户的用户名，但用于 Samba 访问的密码不需要与现有用户的密码匹配。\n\n完成后，点击“添加新用户”（Add\
  \ New User）按钮。SWAT 将创建用户名和密码并显示 `Added user` username（其中 `username` 是你输入的名称）。如果\
  \ Samba (`smb`) 服务器正在运行，则新的 Samba 用户现在应该能够从任何允许的主机访问 `/home` 目录。\n\n例如，如果你在一个名为\
  \ `mini` 的主机上设置了 Samba，且该主机有一个名为 `andrew` 的用户，该用户可以从任何远程主机（如果全局设置允许的话）访问 `mini`\
  \ 上的 `/home` 目录，也许可以使用这样的 `smbclient` 命令：\n\n```bash\nmatthew@seymour:~$ smbclient\
  \ //mini/andrew -U andrew\nadded interface ip=192.168.0.68 bcast=192.168.0.255 nmask=255.255.255.0\n\
  Password:Domain=[MYGROUP] OS=[Unix] Server=[Samba 3.0.28]\nCurrent directory is\
  \ \\mini\\```\n\n点击“状态”（Status）图标查看 Samba 状态，或启动、停止或重启服务器。\n\n你还可以使用 SWAT 共享一个 Linux\
  \ 目录。首先，点击 SWAT 主页顶部的“共享”（Shares）图标。在“创建共享”字段中输入共享名称，并点击“创建共享”按钮。SWAT 共享将在对话框中显示详细信息，如图图\
  \ 22.4 所示，为新共享提供详细配置。\n\n![Image](img/22fig04.jpg)\n\n图 22.4 使用 SWAT 共享页面设置 Linux\
  \ 文件系统的共享。\n\n在“基础”（Base options）下的“路径”（Path）字段中输入你想共享的目录名称（例如 `/music`）。在“安全选项”（Security\
  \ options）下的“只读”（Read-Only）字段中选择“否”或“是”以允许或拒绝读写访问。完成后，点击“提交更改”。远程用户即可访问共享卷。这就是运行\
  \ Samba 的 Linux 系统在混合计算环境中轻松共享卷的方式。\n\n\n\n首先，将你拥有的任何打印机安装到服务器，如第 2 章 中讨论的。（点击“添加”并等待片刻，打印机可能会被检测到；这通常简单到你不需要查找其他章节中的内容。）\n\
  \n接下来，打开`Server`，`Settings`（设置）并启用“发布连接到此系统的共享打印机”（Publish Shared Printers Connected\
  \ to This System）。点击`OK`。\n\n然后，右键点击任何打印机图标并选择“共享”（Share）。这样了。大多数用户不需要本节其余的信息，即使是通过\
  \ Web 界面访问“通用 UNIX 打印系统 (CUPS)”。\n\n要手动启用共享，请编辑你的 `/etc/cups/cupsd.conf` 文件。查找以\
  \ `<Location />` 开头的部分并将其修改为如下内容：\n\n```conf\n<Location />\nOrder Deny,Allow\nDeny\
  \ From All\nAllow From 127.0.0.1\nAllow From 192.168.0.*\n</Location>\n```\n\n这告诉\
  \ `CUPS` 通过网络 `192.168.0.*` 共享你的打印机。请确保将其更改以匹配你自己的网络设置。\n\n接下来，你需要在同一个文件中查找以以下开头的部分：\n\
  \n`Listen localhost:631`\n\n将其修改为：\n\n```conf\nListen 631\n```\n\n这告诉 `CUPS` 监听端口\
  \ `631` 以接收任何打印机请求。\n\n### 会话消息块打印\n\n打印到 `SMB` 打印机需要 `Samba` 以及及其工具（如 `smbclient`\
  \ 和相关的 `smbprint` 打印过滤器）。你可以使用 Ubuntu 自带的 `Samba` 软件打印到 Windows 网络上的共享打印机，或者将连接到系统的打印机设置为\
  \ `SMB` 打印机。本节描述了如何使用 `SMB` 创建本地打印机项以打印到远程共享打印机。\n\n设置 `SMB` 或共享打印机通常在 Windows 操作系统下通过“控制面板”中的网络设备设置完成。启用打印共享后，重启电脑。在“我的电脑”的“打印机”文件夹中，右键点击你想共享的打印机名称或图标，并从弹出菜单中选择“共享”（Sharing）。设置“共享为”（Shared\
  \ As）项目，然后输入描述性的共享名称（例如 `HP2100`）和密码。\n\n在运行 Linux 时，你必须输入共享名称和密码来配置打印机。你还需要知道打印机的工作组名称、IP\
  \ 地址和打印机名称，并准备好用户名和密码。要找到这些信息，请选择“开始”、“设置”、“打印机”；然后在“打印机”窗口中右键点击共享打印机的列表，从弹出窗口中选择“属性”（Properties）。\n\
  \n你可以通过编辑 `smb.conf` 文件，使用 `CUPS` 配置 `Samba` 使用你的打印机。\n\n在 `[global]` 部分，如果还没有这些行，请输入以下内容：\n\
  \n```ini\n...\nload printers = yes\nprinting = cups\nprintcap name = cups\n```\n\
  \n这告诉 `Samba` 使用 `CUPS` 提供打印服务。接下来，你需要在 `smb.conf` 文件的末尾创建一个新部分，如下：\n\n```ini\n\
  [printers]\ncomment = Use this for All Printers\npath = /var/spool/samba\nbrowseable\
  \ = no\npublic = yes\nguest ok = yes\nwritable = no\nprintable = yes\nprinter admin\
  \ = root, andrew\n```\n\n这会将你的打印机发布到网络，并允许其他通过 Windows 客户端连接它们。\n\n确保使用之前显示的命令重启\
  \ `Samba` 服务，以便 `Samba` 获取到配置文件的更改。\n\n### 使用通用 UNIX 打印系统 GUI\n\n你可以通过启动浏览器（如 `Firefox`）并访问\
  \ `http://localhost:631` 使用 `CUPS` 创建打印队列、获取打印服务器信息并管理队列。`CUPS` 提供了一个基于 Web 的管理界面，如图\
  \ 22.5\n\n图 22.5 使用基于 Web 的 CUPS 管理界面配置和管理打印。\n\n如果你点击浏览器页面上的“管理”（Administration）选项卡，就可以开始配置你的打印机，如图\
  \ 22.6\n\n图 22.6 输入根密码以使用 CUPS 执行打印机管理。\n\n### 创建 CUPS 打印机项\n\n本节提供了一个使用 `CUPS`\
  \ Web 界面创建 Linux 打印机项的简短示例。使用 `CUPS` 界面创建打印机和设备队列类型（如本地、远程、串口或 Internet）；然后你输入设备`统一资源标识符\
  \ (URI)`，例如 `lpd://192.168.2.35/lp`，它代表远程 UNIX 打印服务器的 IP 地址以及服务器上远程打印队列的名称。你还需要指定打印机的型号或品牌及其驱动程序。“打印机”页面链接允许你打印测试页、停止打印服务、管理本地打印队列、修改打印机项或添加另一个打印机。\n\
  \n在“管理”（Admin）页面中，点击“添加打印机”（Add Printer）按钮，然后在“名称”（Name）字段中输入打印机名称（例如 `lp`），在“位置”（Location）字段输入打印机的物理位置，并在“描述”（Description）字段中输入关于打印机的简短说明（例如其类型）。图\
  \ 22.7 显示了 `HP 2100` 的示例项。\n\n![Image](img/22fig07.jpg)\n\n图 22.5 使用基于 Web 的 CUPS\
  \ 管理界面配置和管理打印。\n\n\n\n\n\n其他问题可能是由于缺少打印机的 `通用串行总 (USB)` 厂商和设备 ID 信息引起的——某些在 Linux\
  \ 下的 USB 扫描仪也存在同样的问题。关于 USB 打印机支持的信息，请咨询 Linux 打印人员（见本节开头的 URL）或访问 [www.linux-usb.org/](http://www.linux-usb.org/)\
  \ 上的 Linux USB 项目。\n\n尽管许多较新的打印机需要 USB 端口，但 Linux 仍然对旧的并行端口（IEEE-1284）打印机提供极佳的支持，使得站点能够继续使用旧硬件。你可以利用\
  \ Linux 的变通方法来设置打印，即使主机计算机没有传统的并行打印口，或者你想在旧电脑上使用较新的 USB 打印机。\n\n例如，要在仅限 USB 的计算机上托管基于并行端口的打印机，可以使用一个廉价的\
  \ USB 转并行转换器将打印机连接到计算机。USB 转并行转换器通常提供 Centronics 接口；该接口的一端插入旧打印机，另一端插入 USB 接口。然后将\
  \ USB 接口插入你的集线器、台式电脑或笔记本电脑的 USB 端口。如果旧电脑没有内置 USB 端口，你可以使用扩展 PCI 卡为打印（以及其他设备）添加 USB\
  \ 支持。大多数 PCI USB 接口卡至少增加两个端口，你还可以通过集线器级联设备。\n\n***\n\n## 相关的 Ubuntu 和 Linux 命令\n\
  \n以下命令可以帮助你管理打印服务：\n\n- `accept`——通过命令行控制打印作业对 CUPS 服务的访问权限。\n- `cancel`——从命令行取消打印作业。\n\
  - `disable`——从命令行控制打印。\n- `enable`——控制 CUPS 打印机。\n- `lp`——将指定的文件发送到打印机，并允许控制打印服务。\n\
  - `lpc`——在控制台上显示打印机和打印服务的状态。\n- `lpq`——在控制台上查看打印队列（待处理的打印作业）。\n- `lprm`——通过命令行从打印队列中删除打印作业。\n\
  - `lpstat`——显示打印机和服务器状态。\n\n***\n\n#### 参考文献\n\n- [`help.ubuntu.com/community/SettingUpNFSHowTo`](https://help.ubuntu.com/community/SettingUpNFSHowTo)—关于设置\
  \ NFS 的 Ubuntu 社区文档。\n- [`help.ubuntu.com/community/SettingUpSamba`](https://help.ubuntu.com/community/SettingUpSamba)—关于设置\
  \ Samba 的 Ubuntu 社区文档。\n- [`help.ubuntu.com/community/Swat`](https://help.ubuntu.com/community/Swat)—关于\
  \ SWAT 的 Ubuntu 社区文档。\n- [www.samba.org/](http://www.samba.org/)——获取更多关于 Samba 以及在\
  \ Linux、UNIX、Mac OS X 和其他操作系统上使用 SMB 协议信息的入门入口。\n- [www.samba.org/samba/docs/man/Samba-HOWTO-Collection/SWAT.html](http://www.samba.org/samba/docs/man/Samba-HOWTO-Collection/SWAT.html)—使用\
  \ SWAT 的官方 Samba 文档。\n- [www.linuxprinting.org/](http://www.linuxprinting.org/)——在此浏览特定驱动程序以及关于\
  \ USB 其他类型打印机的信息。\n- [www.cups.org/](http://www.cups.org/)——CUPS 软件和信息的综合仓库。\n-\
  \ [www.pwg.org/ipp/](http://www.pwg.org/ipp/)——互联网打印协议（IPP）标准的主页。\n\n## 第 23 章 Apache\
  \ Web 服务器管理\n\n***\n\n### 本章内容\n\n- 关于 Apache Web 服务器\n- 安装 Apache 服务器\n- 启动和停止\
  \ Apache\n- 运行时服务器配置设置\n- 文件系统认证与访问控制\n- Apache 模块\n- 虚拟主机\n- 日志记录\n- 参考文献\n\n***\n\
  \n本章涵盖了 Apache Web 服务器的配置和管理，包括服务器某些主要组件的概述，以及对基于文本和图形的服务器配置的讨论。在本章中，你将学习如何使用命令行启动、停止和重启\
  \ Apache。本章从一些介绍信息开始，然后向你展示如何安装、配置和使用 Apache。\n\n### 关于 Apache Web 服务器\n\n根据 Netcraft\
  \ 对 2011 年 7 月活跃网站的调查，Apache 是当今互联网上使用最广泛的 Web 服务器，如表 23.1 所示（来自 [`news.netcraft.com/archives/2011/07/08/july-2011-web-server-survey.html`](http://news.netcraft.com/archives/2011/07/08/july-2011-web-server-survey.html)）。\n\
  \n表 23.1 Netcraft 调查结果（2011 年）\n\n![Image](img/23tab01.jpg)\n注意这些统计数据并不反映内网（intranets）的情况。\n\
  \nApache 的名字出现在 NCSA HTTPd 软件开发的早期，当时它是由许多补丁构成的。在 NCSA HTTPd 项目停止一段时间后，Brian Beendorf\
  \ 和 Cliff Skolnick 建立了这些补丁的集中仓库，Apache 项目应运而生。该项目仍然由一小组核心程序员组成，但欢迎任何人提交补丁以纳入代码中。\n\
  \n过去几年里，对 Apache 项目的兴趣激增，部分源于企业级服务对开源的新兴趣；部分归因于微软 `信息服务 (IIS)` 的致命安全漏洞；操作系统和网络漏洞，臭名名的\
  \ Code Red、Blaster 和 Nimda 蠕虫。IBM 早就承诺支持并使用 Apache 作为其服务的基础，并为此投入了大量资源。1999 年中期，Apache\
  \ 基金会（ASF）注册为一家非营利公司。由成员每年选举出的董事会监督该公司。该基金会为多个开源项目提供基础，包括 Apache Web 服务器项目。\n\n\
  ***\n\n#### 提示\n\n你可以在 `http://httpd.apache.org/docs/2.2/faq/` 找到 Apache 的概述。除了丰富的在线文档外，你还可以在\
  \ Apache 服务器的 `-html-` 目录中找到完整的文档。如果你的系统中运行了 Apache，可以通过 http://localhost/manual/index.html\
  \ 访问这些文档。\n\n***\n\n要确定系统中包含的 Apache 精确版本，可以使用 Web 服务器的 `-V` 命令行选项，如下：\n\n```\n\
  matthew@seymour:~$ /usr/sbin/apache2 -V\n```\n\n输出显示了版本号、编译日期、平台以及编译期间使用的各种选项。你可以使用\
  \ `-v` 选项查看简短的版本信息。\n\n### 安装 Apache 服务器\n\n你可以通过 APT 安装 Apache，也可以从源代码自行编译。\n\n\
  如果你正准备安装新版本的 Apache，请关闭旧服务器。即使旧服务器不太可能干扰安装过程，关闭它也能确保不会出现问题。如果你不知道如何停止 Apache，请参阅本章后面的“启动和停止\
  \ Apache”节。\n\n#### 从 Ubuntu 存储库安装\n\n\n\n\n你可以从 Ubuntu 软件仓库安装 `apache2` 软件包。更新后的包通常包含重要的漏洞修复和安全修复。当发布更新版本时，请尽快安装以保持您的系统安全。\n\
  \n### 注意\n\n请检查 Apache 网站以获取安全报告。访问 [`httpd.apache.org/security_report.html`](http://httpd.apache.org/security_report.html)\
  \ 查看 Apache 1.3、2.0 和 2.2 的安全漏洞链接。订阅支持列表，或在 [`httpd.apache.org/mail/`](http://httpd.apache.org/mail/)（用于各种文章）或\
  \ [`httpd.apache.org/lists.html`](http://httpd.apache.org/lists.html)（用于全面且组织的存档）浏览所有\
  \ Apache 邮件列表的最新存档。\n\n### 警告\n\n你应该警惕安装实验性软件包，绝不要在生产服务器上安装它们（即用于“实际生活中”的服务器）。在之前，请务必在未连接网络的主机上非常仔细地测试这些软件包！\n\
  \n有关从 Ubuntu 仓库安装软件的更多信息，请参阅第 9 章，“管理软件](#ch09.html_ch09)”。\n\nApache 软件包将文件安装在以下目录：\n\
  \n- `/etc/apache2`——此目录包含 Apache 配置文件 `apache2.conf`。\n- `/etc/init.d/`——此目录下的树包含系统启动脚本。Apache\
  \ 软件包在 `/etc/init.d` 目录下为 Web 服务器安装了一个名为 `apache2` 的启动脚本。你可以使用此脚本从命令行启动和停止服务器，它在计算机关机、启动或重启时自动启动和停止服务器。\n\
  - `/var/www`——该软件包将默认服务器图标、通用网关接口 (CGI) 程序和 HTML 文件安装在此位置。如果你想在其他地方保留 Web 内容，可以通过对服务器配置文件进行相应更改来实现。\n\
  - `/usr/share`——如果你安装了 `apache2-doc` 软件包，你将在此处找到 HTML 格式的 Apache 文档副本。你可以通过浏览器访问\
  \ http://localhost/manual/ 来查看它。\n- `/usr/share/man`——Ubuntu 的 Apache 软件包还包含手册页，放置在此目录下。例如，`apache2`\
  \ 手页位于 man 目录的第 8 。\n- `/usr/sbin`——可执行程序放置在此目录。这包括服务器可执行文件本身以及各种工具。\n- `/usr/bin`——Apache\
  \ 软件包的一些工具放置在此处——例如用于生成身份验证密码文件的 `htpasswd` 程序。\n- `/var/log/apache2`——服务器日志文件放置在此目录。默认情况下，有两个重要的日志文件（在其他几个文件之外）：`access_log`\
  \ 和 `error_log`。然而，你可以定义任意数量包含各种信息的自定义日志。详细信息请参阅本章节后面的“日志”。\n\n当 Apache 运行时，它会在\
  \ `/var/run/` 目录下创建 `apache2.pid` 文件，其中包含 Apache 父进程的进程 ID。\n\n### 注意\n\n如果你正在升级到更高版本的\
  \ Apache，APT 不会覆盖当前的配置文件。\n\n### 自行编译源码\n\n你可以直接从 [www.apache.org/](http://www.apache.org/)\
  \ 下载源码。编写本文时的最新版本是 2.2.19，尽管稳定的 2.0.64 版本仍然受支持并可用。尽管由于脚本和其他兼容性原因，许多网站继续使用如 1.3 系列等旧版本，但大多数网站正在迁移或开始使用最新的稳定版本。我们强烈建议你为站点使用当前受支持的稳定版本。该网站还提供\
  \ 2.3 beta 版本，你可以免费将其用于测试，但不应在生产服务器上使用。\n\n获取 `tar` 文件后，你必须在临时目录（如 `/tmp`）中打开它。打开此\
  \ `tar` 文件会创建一个名为 `apache_version_number` 的目录，其中 `version_number` 是你下载的版本（例如 `apache_2.2.19`）。\n\
  \n编译源码有两种方法——通过编辑 makefile 模板的旧、熟悉的方法（至少对于我们这些多年来使用 Apache 的人是这样），以及使用 `configure`\
  \ 脚本的新、简单方法。你首先将看到如何用简单的方法从源码构建 Apache。`configure` 脚本提供了一种根据你的系统自动配置源码软件的方法。然而，在编译和安装\
  \ Apache 之前手动编辑配置文件，可以对软件的安装位置以及在 Apache 构建哪些功能或特性提供更强的控制。\n\n### 提示\n\n与许多针对 Linux\
  \ 和其他 Unix 类操作系统的源码形式分发的软件软件包一样，提取源码会得到包含 `README` 和 `INSTALL` 文件的目录。在尝试构建和安装软件之前，务必仔细\
  \ `INSTALL` 文件。\n\n### 使用 `./configure` 构建 Apache\n\n要用简单的方法构建 Apache，请在刚创建的目录中运行\
  \ `./configure` 脚本。你可以提供 `--prefix` 参数将其安装到默认目录 `/usr/local/` 之外的目录。\n\n```\nmatthew@seymour:~/src/apache2$\
  \ sudo ./configure --prefix=/preferred/directory/\n```\n\n这将生成用于编译服务器的 Makefile。\n\
  \n接下来，输入 `make` 来编译服务器代码。编译完成后，以 root 身份输入 `make install` 来安装服务器。你现在可以通过配置文件配置服务器了。更多信息请参阅“运行时服务器设置”部分。\n\
  \n### 提示\n\n从源码安装新版本 Apache 的更安全方法是使用 `ln` 命令创建现有文件位置（本章前面的“使用 APT 安装”部分列出）到文件新位置的符号链接。这种方法更安全，因为默认安装位置与软件包安装文件时的位置不同。不使用这种方法可能会导致你的\
  \ Web 服务器进程在系统启动时无法启动。\n\n安装新版本 Apache 的另一种安全方法是首先备份重要的目录和文件（例如 `/etc/apache2`），然后使用\
  \ `apt-get` 命令删除服务器。然后你可以安装并测试新版本，并在需要时轻松恢复原始服务器和设置。\n\n强烈建议你使用 Ubuntu 版本的 Apache，直到你真正了解系统启动时发生了什么。从源码安装\
  \ Apache 时没有“卸载”选项！\n\n### 构建和安装后的 Apache 文件位置\n\n如果你从源码构建服务器，文件将放置在 `/usr/local/apache`（或你通过\
  \ `--prefix` 参数指定的目录）的各个子目录下。\n\n以下是 Apache 使用的目录列表及其用途简要说明：\n\n- `/usr/local/apache/conf`——这包含几个子目录和\
  \ Apache 配置文件 `httpd.conf`。基于 Debian 的系统（如 Ubuntu）通常将其重命名为 `apache2.conf`，因此你的情况可能不同。\n\
  - `/usr/local/apache`——`cgi-bin`、`icons` 和 `htdocs` 子目录分别包含 CGI 程序、标准图标和默认 HTML\
  \ 文档。\n- `/usr/local/apache/bin`——可执行程序放置在此目录。\n\n\n\n\n- `/usr/local/apache/logs`—服务器日志文件放置在此目录。默认情况下，有两个日志文件——`access_log`\
  \ 和 `error_log`——但你可以定义任意数量的自定义日志，包含各种信息（请参见本章后面的“日志记录”部分）。通过 Ubuntu 安装的 Apache\
  \ 日志默认位置为 `/var/log/apache2`。\n\n***\n\n# Apache 快速上手指南\n\n在 Ubuntu 上设置、测试网页并启动\
  \ Apache 仅需几个步骤即可。首先，确保你的系统已安装了 Apache。你可以在安装过程中选择它，或者安装服务器及相关的包文件。（如果需要安装服务器软件，请参阅第\
  \ 9 章，“管理软件”。）\n\n接下来，通过编辑（以 root 身份）系统 `/var/www` 目录下的名为 `index.html` 的文件，为你的系统设置首页。在开始之前，请对原始页面或\
  \ `www` 目录进行备份复制，以便在必要时将 Web 服务器恢复到默认状态。\n\n通过菜单栏中的“服务”窗口（位于“系统”、“管理”下）启动 Apache，确保已启用\
  \ Web 服务器。\n\n你也可以像这样使用 `/etc/init.d/` 目录下的 `apache2` 脚本：\n\n```\nmatthew@seymour:~$\
  \ sudo /etc/init.d/apache2 start\n```\n\n然后，你可以通过运行喜欢的浏览器并在 URL 中输入 `localhost`、你的系统主机名或其\
  \ `Internet 协议 (IP)` 地址来检查你的首页。例如，使用 links 文本浏览器，可以使用如下所示命令行：\n\n```\nmatthew@seymour:~$\
  \ links http://localhost/\n```\n\n出于安全考虑，如果你的主机连接到互联网或公司内网，不应以 root 身份启动和运行 Apache。幸运的是，无论如何启动，Apache\
  \ 都会以 `www-data` 用户和组身份运行（通过 `/etc/apache2/apache2.conf` 中的用户和组设置）。尽管有此安全默认，Apache\
  \ 应该由名为 `www-data` 的用户启动和管理，该用户在 `/etc/passwd` 中的定义如下：\n\n```\nwww-data:x:33:33:www-data:/var/www:/bin/sh\n\
  ```\n\n当你对网站满意后，使用服务配置对话框确保 Apache 已经启动。\n\n***\n\n## 启动和停止 Apache\n\n此时，你已经使用默认配置安装了\
  \ Apache 服务器。Ubuntu 在 `/var/www/` 目录下提供了一个名为 `index.html` 的默认首页作为测试。运行 Apache 的正确方法是设置系统初始化，使服务器在启动自启、网络配置以及任何防火墙配置后运行。有关\
  \ Ubuntu 如何启动的更多信息，请参阅第 14 章，“启动过程”。”\n\n现在是第一次启动它了。后续章节将展示如何启动和停止 Apache，或者配置 Ubuntu\
  \ 在启动时启动或不启动 Apache。\n\n### 手动启动 Apache 服务器\n\n你可以从文本控制台的命令行或 X 终端窗口中启动 Apache，但你必须拥有\
  \ root 权限才能操作。服务器守护进程 `apache2` 识别了几个你可以用于设置某些默认值的命令行选项，例如 `apache2` 从何处读取配置指令。Apache\
  \ 的 `apache2` 可执行文件还理解其他选项，允许你选择性地使用配置文件的部分、指定实际服务器和支持文件的不同位置、使用不同的配置文件（可能用于测试），并将启动错误保存到特定日志中。`-v`\
  \ 选项会导致 Apache 打印开发版本并退出。`-V` 选项显示服务器编译时生效的所有设置。\n\n`-h` 选项打印服务器的以下用法信息：\n\n```\n\
  matthew@seymour:~$ apache2 -h\n\nUsage: apache2 [-D name] [-d directory] [-f file]\n\
  \              [-C \"directive\"] [-c \"directive\"]\n              [-k start|restart|graceful|stop]\n\
  \              [-v] [-V] [-h] [-l] [-L] [-t]\nOptions:\n  -D name           :为 <IfDefine\
  \ name> 指令定义一个名称\n  -d directory      : 指定备用的 ServerRoot\n  -f file            :\
  \ 指定备用的 ServerConfigFile\n  -C \"directive\"    :在读取配置文件之前处理指令\n  -c \"directive\"\
  \    :在读取配置文件之后处理指令\n  -e level           : 显示级别等级的启动错误（参见 LogLevel）\n  -E file\
