  \n\n\n\n然而，强烈建议您挑选一些最可能让导入/导出过滤器遇到困难文档和表格，并对其进行彻底测试（当然，要保留原始文件的备份）。对于一个部署了新生产力套件的系统管理员来说，最糟糕的事情莫过于突然收到用户抱怨他们无法读取文件。这会迅速抵消从\
  \ LibreOffice 的其他实用功能中获得的任何收益，甚至可能导致专有格式和昂贵办公套件的回归。\n\n从积极的一方面来看，LibreOffice 支持大量的各种格式，并可以导出近\
  \ 70 种类型的文档。如此丰富的文件格式意味着您应该能够在几乎任何环境中成功使用 LibreOffice，包括目前生产和维护的软件已不再使用的格式，因此它可能打开某些您曾经认为已经放弃的旧文件和文档。\n\
  \n***\n\n***\n\n## 介绍 LibreOffice\n\nLibreOffice 包含了许多生产力应用程序，用于创建文本文档、准备电子表格、组织演示文稿、管理项目等。Ubuntu\
  \ 包含了 LibreOffice 软件包中的以下组件：\n\n• `Writer`——此文字处理程序允许您编写、格式化和组织文本文档。如果您习惯于使用 Microsoft\
  \ Word，LibreOffice Writer 的功能会让您感到熟悉。\n\n• `Calc`——此电子表格程序允许您在电子表格格式中操作数字。它支持除了最冷门的\
  \ Microsoft Excel 函数以外的所有函数，这意味着与 Excel 用户之间交换电子表格应该是成功的。`Calc` 与 Excel 宏提供有限的兼容性，但这些宏通常需要重写。\n\
  \n• `Impress`——此演示文稿程序类似于 Microsoft PowerPoint，允许您创建包含图表、图解和其他图形的幻灯片演示文稿。`Impress`\
  \ 也与大多数 PowerPoint 文件配合良好。\n\n***\n\n***\n\n注意\n\n以下五个应用程序默认未包含在 Ubuntu 中，但它们非常有用。除了\
  \ `Dia` 之外，其他都是 LibreOffice 项目的一部分，并为套件增加了在 Ubuntu 默认安装中不那么频繁使用的功能。如果您想或需要这些功能，必须从\
  \ Ubuntu 存储库安装它们。\n\n***\n\n***\n\n• `Math`——此数学公式编辑器允许您使用多种数学字体和符号编写数学公式，并将其纳入文字处理文档中。此类符号具有高度的专业性，不容易包含在文字处理器的基本功能中。这主要引起数学和科学作者的兴趣，但\
  \ `Math` 对于任何需要在文本中包含复杂公式的人来说都是有用的。\n\n• `Base`——这是一个功能完整的数据库应用程序。\n\n• `Draw`——此图形应用程序允许您创建用于\
  \ LibreOffice 生成的文档的图像。它只以 LibreOffice 格式保存文件，但可以导入大多数常见的图像格式。\n\n• `Dia`——来自 GNOME\
  \ Office 套件的技术绘图编辑器，允许您创建测量图纸，例如建筑师和工程师使用的图纸。其功能类似于 Microsoft Visio。\n\n• `Planner`——您可以使用此项目管理应用程序进行项目规划、调度和跟踪；此应用程序类似于\
  \ Microsoft Project，但不与之兼容。安装后，您将在 Project Management（项目管理）名称下找到它。\n\n***\n\n***\n\
  \n### LibreOffice 简史\n\nOpenOffice.org 办公套件基于名为 `StarOffice` 的商业套件。`StarOffice`\
  \ 最初由一家德国公司开发，后被美国的 Sun Microsystems 收购。对旧 `StarOffice` 的最大抱怨之一是所有菜单都标记为 `StarOffice`。（注：由于原文在此处存在大量重复内容，已根据翻译要求进行整合处理）。\n\
  \nOpenOffice.org 办公套件基于名为 `StarOffice` 的商业套件。`StarOffice` 最初由一家德国公司开发，后被美国的 Sun\
  \ Microsystems 收购。对旧 `StarOffice` 的最大抱怨之一是所有菜单都标记为 `StarOffice`。\n\n在收购 `StarOffice`\
  \ 后，Oracle 随后收购了 `OpenOffice.org`。这导致了与社区的主要分歧，导致开发者离开并成立 `Document Foundation`，创建了一个名为\
  \ `LibreOffice` 的新分支。Oracle 选择不加入 `Document Foundation`，而是根据 `Apache License` 对\
  \ `OpenOffice.org` 代码进行了重新许可许可，这允许开源代码在专有产品中使用。IBM 也在使用 Apache 许可的 `OpenOffice.org`\
  \ 版本作为其免费办公套件 `Lotus Symphony` 的基础。\n\n随着故事的继续，最终的赢家可能是终端用户，因为这实际上创建了竞争性的办公套件：`OpenOffice.org`、`LibreOffice`\
  \ 和 `Lotus Symphony`。目前，`LibreOffice` 拥有最多的开发者、最强大的社区以及功能更新最快的成熟软件。\n\n***\n\n***\n\
  \n## Ubuntu 的其他办公套件\n\n如前所述，`LibreOffice` 是 Ubuntu 的默认应用程序套件。然而，正如开源世界的常见情况，如果您发现\
  \ `LibreOffice` 不能满足您的特定需求，还有许多替代方案。这些包括流行的 `GNOME Office` 以及默认 KDE 生产力套件 `KOffice`。您可能会听到更多关于\
  \ `LibreOffice` 的信息，特别是随着越来越多的人意识到它与 Microsoft Office 文件格式通兼容。有趣的是，马萨诸塞州不久前选择采用两种政府使用的文件格式：Adobe\
  \ Acrobat PDF 格式和 OASIS OpenDocument 格式，两者在 `LibreOffice` 中都得到了原生支持。\n\n***\n\n\
  ***\n\n注意\n\n马萨诸塞州采用 PDF 和 OpenDocument 标准这对开源世界产生了巨大影响。这是 OpenDocument 这一开放标准第一次以这种方式被规定。这意味着任何与州政府做生意的人都必须使用基于\
  \ OpenDocument 的格式，而不是 Microsoft 使用的专有格式。遗憾的是，Microsoft 在它的任何应用程序中都不支持 OpenDocument，尽管\
  \ Microsoft 是 OASIS 的创始成员，而 OASIS 开发并批准了 OpenDocument 标准。\n\n\n\n\nGNOME 可用的其他办公套件是\
  \ GNOME Office，它是一系列独立的应用程序集合。与 LibreOffice 不同，GNOME Office 并没有一个统一的应用程序整体，这意味着你必须习惯使用一个与电子表格没有集成、且无法直接与演示文包协同工作的文字处理器。然而，如果你只需要一个或两个组件，那么研究一下\
  \ GNOME Office 是值得的。\n\n* * *\n\n# GTK 组件集\n\n开源开发者总是试图让人们更容易地构建应用程序并为开发提供帮助。为此，有许多组件（widgets）或工具包供其他开发者使用，用于快速创建和部署\
  \ GUI 应用程序。这些组件控制着如下拉列表、另存为对话框、窗口按钮以及通用的外观和感觉。遗憾的是，Windows 和 Apple 开发者各只需要担心一组组件，而\
  \ Linux 拥有许多不同的组件，包括 `GTK+`、`QT` 和 `Motif`。更糟糕的是，这些组件之间是不兼容的，这使得将一个完成的应用程序从一组组件集移动到另一组变得非常困难。\n\
  \nGTK 是 `GIMP Tool Kit` 的缩写。GIMP，即 `GNU Image Manipulation Program`，是一个与 Adobe Photoshop\
  \ 非常相似的图形应用程序。通过使用基于 GTK 的术语，我们节省了数百字的打字量，并有助于推进对 GNOME Office 的讨论。在这些章节中，你可能还会看到\
  \ `QT` 和 `Motif` 以及其他组件集的类似引用。\n\n* * *\n\n以下是 Ubuntu 中可用的 GNOME Office 套件的一些主要组件：\n\
  \n- `AbiWord`——这个文字处理程序允许你编写、格式化和组织文本文档，并与 Microsoft Word 文件格式具有某些兼容性。它使用插件（添加如语言翻译等功能的程序）来增强其功能。\n\
  - `Gnumeric`——一个电子表格程序，允许你以电子表格格式操作数字。它对除了最生僻的 Microsoft Excel 函数外的所有函数都支持，这意味着用户在与\
  \ Excel 用户交换电子表格时应该有太大困难。\n- `GIMP`——一个图形应用程序允许你创建通用的图像。它可以导入和导出所有常见的图形文件格式。GIMP\
  \ 与 Adobe 的 Photoshop 应用程序相似，并在第 6 章“多媒体应用”中进行了描述。\n- `Evolution`——Evolution 是一个界面类似于\
  \ Microsoft Outlook 的邮件客户端，提供电子邮件、调度和日历功能。它在第 4 章“在网上”中进行了描述。\n\n被称为 GNOME Office\
  \ 的松散应用程序关联包含了若干额外的应用程序，它们重复了 Ubuntu 已提供的应用程序的功能。这些额外的 GNOME 应用程序未包含在 Ubuntu 的默认安装中，以消除冗余。它们都可以从\
  \ GNOME Office 网站 [www.gnome.org/gnome-office/](http://www.gnome.org/gnome-office/)\
  \ 以及 Ubuntu 软件仓库中获取。\n\n### 使用 KOffice\n\nKDE 办公套件 KOffice 的开发目的是为了与 KDE 桌面提供紧密的集成。这种集成使得一个应用程序中的对象可以通过拖放插入到其他应用程序中，并且所有应用程序都可以相互通信，因此一个对象的更改会即时传达给其他应用程序。KDE\
  \ 提供的应用程序集成是对生产力的一大提升。（某些 GNOME 桌面应用程序之间也共享类似的通信机制。）如果你使用 KDE 桌面而不是默认的 GNOME 桌面，你就可以享受这种集成带来的好处，以及\
  \ Konqueror 网络和文件浏览器的优势。\n\nKOffice 的文字处理器是 `KWord`。KWord 是一个基于框架的文字处理器，这意味着文档页面可以在框架集中进行格式化，框架集在封闭区域内持有文本、图形和对象。框架集可以用于格式化页面上的文本，在文本需要流过的列中包含文本和图像，使得\
  \ KWord 成为创建标准商务信之外文档（如字体和手册）的优秀选择。\n\n`KWord` 和 KOffice 的其他组件仍在开发中，缺乏 LibreOffice\
  \ 和 AbiWord 的所有完善功能。然而，它确实具有处理 LibreOffice 中 OpenDocument 格式的能力，以及与 Microsoft 文件格式的有限兼容性。\n\
  \nKOffice 的 `KSpread` 客户端是一个功能性的电子表格程序，提供了图表功能以及所有其他标准的电子表格功能。\n\nKDE 在 KOffice\
  \ 中包含其他生产力选项。这些包括地址簿、时间跟踪、计算器、记事本和调度器。一个流行的应用程序是 `Kontact`，它提供了每日、每周、工作周和每月任务视图、待办列表以及带有后台闹钟的调度预约。\n\
  \n## 其他实用的生产力软件\n\n本章已经过的办公套件对于典型的以办公中心的文件交互是理想的：创建基础文档、电子表格等。然而，我们中的有些人有更复杂或更精确的需求。本节涵盖了可以帮助你在这些情况下提高生产力的某些选项。\n\
  \n## 使用 PDF\n\n在 Ubuntu 中读取 PDF 非常简单。得益于安装了一个名为 `Evince` 的程序，该功能是默认提供的。打开一个 PDF，`Evince`\
  \ 就会打开并让你阅读。有时填写表单并不那么直接，因为表单可能是使用只有 Adobe 拥有的功能创建的。你可以从 Ubuntu 软件中心的“Canonical\
  \ 合作伙伴（Canonical Partners）”栏目中安装 Adobe Reader。Adobe Reader 应该能够与任何使用 Adobe 软件创建的\
  \ PDF 表单一起工作，无论它是在 Windows、Mac OS X 还是 Linux 上创建的。\n\n偶尔，你会发现自己有一个有一个想要编辑的 PDF 文件。这要稍微复杂一点，但并不像以前那么困难。有两种很好的方法可以帮你开始：为\
  \ LibreOffice 安装扩展，或者使用专门为编辑 PDF 创建的程序。\n\n要安装 LibreOffice 扩展，你必须从 [www.libreoffice.org/features/extensions/](http://www.libreoffice.org/features/extensions/)\
  \ 下载 PDF Import 并按照该网站的说明安装。它可以导入并允许你编辑 PDF 文件。这种方法比下一种更容易使用。\n\n如果你喜欢使用完全不同的程序，请从\
  \ Ubuntu 软件中心安装 PDF Editor (`pdfedit`)。从表面上看，这个选项看起来很简单，但它具有显而易见的力量。高级用户可以学习在脚本中使用\
  \ `pdfedit` 来快速进行更改。\n\n### 使用 XML 和 DocBook\n\n与其祖先 SGML 和表 HTML 一样，XML 是一种标记语言。它被设计用于纯文本文档。标签围绕文本的特定部分以指示该部分如何显示。列表\
  \ 5.1 包含一个非常短的示例。\n\n```xml\n<?xml version=\"1.0\"?>\n<xml-stylesheet type=\"text/css\"\
  \ href=\"book.css\"?>\n<book>\n<title>Ubuntu Unleashed 2012</title>\n<edition>7</edition>\n\
  <chapter>\n  <number>1</number>\n  <title>Installing Ubuntu</title>\n  <text>\n\
  \    <paragraph><dropcap>N</dropcap>ot that long ago,the mere mention...</paragraph>\n\
  \  </text>\n</chapter>\n</book>\n```\n\n\n\n\n你可以轻松地使用简单的文本编辑器来完成工作，例如默认安装的 `Gedit`（在\
  \ Dash 栏中称为 `Text Editor`，在 Ubuntu 软件中心的列表中也显示“文本编辑器”）。然而，对于大多数人来说，那样操作非常繁琐。更好的选择是使用专门设计并旨在用于处理\
  \ XML 文件的编辑器。由于 `DocBook` 是一种开源的 XML 标准形式，专门为文档编制而设计，许多可以处理 XML 的编辑器也能处理 `DocBook`。如果你只需要快速完成某些任务，其中一个编辑器就能够胜任。先从默认安装的\
  \ `Gedit` 开始，如果不适用，可以在 Ubuntu 软件中心查找其他选项，如接下来将讨论的。\n\n如果你打算编写大量或仅以 `DocBook` 格式编写复杂的文档，Ubuntu\
  \ 上最推荐程序是名为 `Publican` 的程序。`Publican` 不仅仅是一个编辑器，还是 `DocBook` 的出版系统。它会测试你的 `XML`\
  \ 以确保它符合有效的 `DocBook` 格式，以便你的输出符合出版标准。它能够自动输出为 `HTML` 和 `PDF` 等多种格式，并允许对自定义皮肤和格式进行完全控制。你可以从\
  \ Ubuntu 软件中心安装 `Publican`。\n\n更强大的选项是 `XML Copy Editor`。它是为编辑大多数标记语言设计的，包括 `XML`、`DocBook`、`DITA`\
  \ 等。它还具有架构验证、语法高亮、标签补全和拼写检查功能。对于专业文档专家来说，这是最有用的选项。你可以从 Ubuntu 软件源安装 `XML Copy Editor`，其网站还提供了适用于\
  \ Windows 的版本。更多信息请参阅 `http://xml-copy-editor.sourceforge.net`。\n\n### 使用 LaTeX\n\
  \n`LaTeX` 是为学术界创建的并在其中被广泛使用的。它是一种为 `TeX` 排版系统创建的 `WYGIWYW` 文档标记语言。有多个编辑器供 `LaTeX`\
  \ 使用，几乎在每一种存在的操作系统中都能找到它们。\n\n#### 注意\n\n`WYSIWYG` 是“所见即所得”（what you see is what\
  \ you get）的缩写，通常用于描述使用图形界面的文字处理程序和文档创建系统。遗憾的是，任何用这些程序创建文档的人（包括我们在本章前面介绍的 `LibreOffice`\
  \ 等）都知道，屏幕上看到的并不总是打印在纸上的版本上显示的。在使用 `LaTeX` 编辑器编写你的 `TeX` 文档时，无法保证屏幕上的显示将是或不会如何，但该格式保证了最终输出将完全符合你的要求。\n\
  \n本节讨论了 Ubuntu 软件中心提供的几个流行的 `LaTeX` 编辑器。你也可以使用任何文本编辑器（包括 `Gedit`）进行创建和编辑。\n\n`Texmaker`\
  \ 不仅在 Ubuntu 软件中心有一个版本，还通过 `www.xm1math.net/texmaker/` 提供了 Windows 和 Mac OS X 版本。它是免费、易用且成熟的。该程序已经存在很久，非常稳定，具有许多实用功能，在\
  \ `TeX` 世界相当流行。\n\n`LyX` 也随其后，在 Ubuntu 软件中心提供了一个版本，并在其网站 `www.lyx.org` 提供了 Windows\
  \ 和 Mac OS X 版本。`LyX` 用户的主要吸引力在于它的图形界面，这使其成为从 `WYSIWYG` 到 `LaTeX` 的有趣桥梁。它还有许多可用插件来扩展功能。\n\
  \n`Kile` 是为 `KDE` 编写和设计的。因此，它与 `Kuntu` 融合得很好，但在标准的 Ubuntu 安装上也能良好运行。它也有 Windows\
  \ 版本；详情请参阅 `http://kile.sourceforge.net`。\n\n#### 为 Microsoft Windows 编写的应用程序\n\n\
  `Microsoft Windows` 与 Linux 从根本上不同，但你可以通过一个名为 `Wine` 的应用程序在 Linux 中安装和运行某些 `Microsoft\
  \ Windows` 。`Wine` 允许你在基于 `UNIX` 的系统上使用 `Microsoft Windows` 和 `DOS` 程序。`Wine` 包括一个程序加载器，你可以用它执行\
  \ Windows 二进制文件，以及一个实现 Windows 命令调用的 `DLL` 库，将它们翻译为相应的 `UNIX` 和 `X11` 命令调用。由于 `Wine`\
  \ 代码库更新频繁，Ubuntu 未包含 `Wine`。请从 `www.winehq.org/` 下载当前版本的 `Wine`。要查看你喜欢的应用程序是否受 `Wine`\
  \ 支持，可以查看 `http://appdb.winehq.org/appbrowse.php`  `Wine` 数据库。\n\n其他解决方案（主要是来自 CodeWeavers\
  \ 的 `CrossOver Office`）可以使用 `Microsoft` 生产力应用程序。如果你追求一种更接近无痛的方式来运行不仅是 `Microsoft\
  \ Office`，还有 `Apple iTunes` 等软件，你应该调查 `CodeWeavers`。`CrossOver Office` 是你可以用来让 Windows\
  \ 程序运行的最简单程序之一。访问 `www.codeweavers.com` 下载最新软件的试用版。\n\n#### 参考文献\n\n- `www.libreoffice.org`——`LibreOffice`\
  \ 套件的主页。\n- `www.documentfoundation.org`——`Document Foundation` 的主页。\n- `www.openoffice.org`——`OpenOffice.org`\
  \ 办公套件的主页。\n- `http://incubator.apache.org/openofficeorg`——`Apache Software Foundation`\
  \ 的 `OpenOffice.org` 孵化项目主页。\n- `www.oracle.com/us/products/applications/open-office/index.html`——`Oracle\
  \ Open Office`（带有专利更新的办公套件）的主页。\n- `www.gnome.org/gnome-office/`——`GNOME Office`\
  \ 站点。\n- `www.koffice.org/`——`KOffice` 套件的主页。\n- `http://pdfedit.cz/en/index.html`——`PDF\
  \ Edit` 的主页。\n- `www.codeweavers.com/`——CodeWeavers 的 `CrossOver Office`，允许在 Linux\
  \ 下运行某些 程序。\n\n## 第 6 章 多媒体应用程序\n\n* * *\n\n本章内容\n\n- 音与音乐 (`ch06.html_ch061sec1`)\n\
