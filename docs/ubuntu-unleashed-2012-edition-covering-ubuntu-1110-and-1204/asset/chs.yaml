  \ `MP3` 文件。除了视频片段、动画和其他图形，对这些庞大库的需求推动了应用程序的发展。\n\n\n\n\n本章概述了 Ubuntu 附带的几种基本多媒体工具。在本章中，你将学习如何创建自己的\
  \ CD、观看电视、将音频 CD 翻录为开源 Ogg 音频格式以便播放，以及管理你的媒体库。你还将了解 Ubuntu 如何处理图形和图片等更多内容。\n\n###\
