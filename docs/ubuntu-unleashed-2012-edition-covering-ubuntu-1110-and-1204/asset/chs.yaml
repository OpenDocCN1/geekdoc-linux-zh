  - [`www.cobol.com/`](http://www.cobol.com/)—Cobol 的主网站。\n- [`www.erlang.org/`](http://www.erlang.org/)—Erlang\
  \ 的主网站。\n- [`www.forth.org/`](http://www.forth.org/)—Forth 兴趣小组主网站，学习更多 Forth 的好地方。\n\
  - [`www.jwdt.com/~paysan/gforth.html`](http://www.jwdt.com/~paysan/gforth.html)—Gforth\
  \ 的主网站，它是 GNU 项目对 Forth 的实现。\n- [`gcc.gnu.org/fortran/`](http://gcc.gnu.org/fortran/)—Gfortran\
  \ 的主网站。\n- [`groovy.codehaus.org/`](http://groovy.codehaus.org/)—Groovy 的主网站。\n\
  - [`haskell.org/`](http://haskell.org/)—Haskell 的主网站。\n- [`www.java.com/`](http://www.java.com/)—Java\
  \ 的主网站。\n- [`www.w3schools.com/js/default.asp`](http://www.w3schools.com/js/default.asp)—JavaScript\
  \ W3C 教程页面。该网站也是学习 HTML 和 CSS 的好地方。\n- [`www.lisp.org/`](http://www.lisp.org/)—Lisp\
  \ 用户协会网页。\n- [`www.clisp.org/`](http://www.clisp.org/)—GNU Cisp 的主网站，Common Lisp\
  \ 的实现。\n- [`www.lua.org/`](http://www.lua.org/)—Lua 的主网站。\n- [`www.ruby-lang.org/en/`](http://www.ruby-lang.org/en/)—Ruby\
  \ 的主网站。\n- [`www.scala-lang.org/`](http://www.scala-lang.org/)—Scala 的主网站。\n- [`live.gnome.org/Vala`](http://live.gnome.org/Vala)—Vala\
  \ 的主网站。\n\n## 第 42 章 开始 Android 移动开发\n\n* *\n\n### 本章内容\n\n- Android 简介\n- 安装 Android\
  \ SDK\n- 创建你的第一个应用程序\n- 参考文献\n\n* *\n\n许多 Linux 用户不仅拥抱了智能手机，特别是基于 Android 的手机。Android\
  \ 由 Google 所有，基于 Linux 内核，是智能手机和平和平电脑最畅销的平台之一。Android 包含了操作系统、中间件和几个关键应用程序。中间件和应用程序示例包括基于\
  \ WebKit 的集成 Web 浏览器、优化的图形库、对大多数格式的媒体支持以及使用 SQLite 的结构化数据存储。它还包含了用于硬件相关功能（如 GSM、蓝牙、3G、WiFi、摄像头、GPS\
  \ 等）的软件。\n\n大部分 Android 源代码是免费提供的，并使用 Apache 许可。Google 运营着名为 `Android Market` 的在线应用商店，任何拥有\
  \ Android 手机或平板电脑的人都可以下载免费或付费应用程序来扩展其设备的功能。还存在相同目的的第三方网站，从而创建了许多可以将其软件提供给 Android\
  \ 用户的路径。\n\n本章通过描述如何查找和设置你所需的开发工具，帮助你从 Ubuntu 机器上开始为 Android 编写软件。在你考虑是否要为 Android\
  \ 平台开发程序时，如果是的话，你是否想尝试将这些程序上传并通过 Android Market 或第三方网站发布，本章将讨论你需要了解的基本细节。\n\n###\
  \ Android 简介\n\n在我们进一步涉及 Android 软件开发的细节之前，对 Android 架构进行更详细的介绍似乎更合适。我们的描述从硬件开始，在该基础上层层地构建。\n\
  \n#### 硬件\n\n\n\n虽然已经证明可以在其他平台上运行 Android，但主要的目标平台是 ARM。ARM 处理器是 32 位精简指令集计算机（RISC）处理器。与其他\
  \ RISC 处理器一样，它们的设计目标是速度，其理念是更简单的处理器指令集可以产生更高的效率和吞吐量。ARM 处理器还针对低功耗进行了设计，使其成为移动设备和嵌入式设备的理想选择。事实上，ARM\
  \ 是这些市场中的主导处理器。\n\n## Linux 内核\n\n在 Android 栈中运行的第一层软件是定制的 Linux 内核。大多数定制以功能增强或优化的形式存在，旨在帮助\
  \ Android 和 Linux 更高效地协同工作。最初，Google 特意贡献他们开发的代码，但某些功能被 Linux 内核主线开发者拒绝纳入标准 Linux\
  \ 内核。这意味着，为了保留他们所需的代码定制，Google 必须创建一个 Linux 内核的分支（fork），由于内核发布时的许可协议，这是允许的。第 21\
  \ 章“内核与模块管理”对 Linux 内核进行了介绍。\n\n## 库\n\n在内核之上运行着一组软件库。这些库被 Android 的高层组件使用，并供开发者在使用\
  \ Android 软件开发包（SDK）编写 Android 应用时使用（SDK 将章稍后部分讨论）。这些库包括标准 C 库 `libc` 版本、用于许多流行媒体格式录制和播放的库、图形和浏览器引擎、字体渲染等。\n\
  \n## Android 运行时\n\nAndroid 应用层（后文将描述）中的某些高层组件直接与上述库交互。应用层的其他部分则通过 Android 运行时与库交互。Android\
  \ 软件主要使用 Java 编写，并使用 Google 开发的特定 Java 库。这些软件运行在 Android 运行时，该运行时由运行在名为 Dalvik 的特殊虚拟机之上的一些额外核心库组成。核心库提供了\
  \ Java 的大部分功能。Dalvik 执行即时（JIT）编译，并针对移动设备进行了优化。\n\n## 应用程序框架\n\n应用框架是一组顶层应用程序可以调用的实用系统和服务。它们提供了访问系统信息、使用设备硬件、创建通知等标准化手段。它们与\
  \ Android 包含的核心应用程序使用的是同一套系统，因此终端用户创建的应用程序可以具有与 Android 提供的相同的外观、感觉和交互风格。\n\n##\
  \ 应用程序\n\nAndroid 自带了一组核心应用程序。这些包括网页浏览器、短信程序、联系人管理程序、日历、电子邮件客户端等。如前所述，Android 软件是用\
  \ Java 编写的。\n\n## 安装 Android SDK\n\nAndroid 提供了一个软件开发包，这是一套用于创建运行在 Android 上的应用程序的工具集。Android\
  \ SDK 有适用于 Linux、Mac OS X 和 Windows 的版本。\n\n### 安装 Java\n\n在下载和安装 Android SDK 之前，你需要安装适当的依赖项。从安装\
  \ Java 运行时环境（JRE）或 Java 虚拟机（JVM）开始。\n\n如果你在机器上运行 64 位的 Ubuntu，必须先从 Ubuntu 存储库安装\
  \ `ia32-libs` 库。这是一组为 64 位系统配置的 32 位运行时库，它将让你能够在使用 64 位操作系统的同时，开发并测试 32 位的 Android\
  \ 程序。\n\n你可以自由地从 Ubuntu 存储库选择开源的 Open JDK 版本 `openjdk-6-jre` 或 Sun/Oracle 版本 `sun-java6-jre`。你还必须安装相应的匹配\
  \ Java SDK，即 `openjdk-6-jdk` 或 `sun-java6-jdk`。\n\n### 安装 Eclipse\n\n虽然这一步并非绝对必要，但\
  \ Android SDK 包含了适用于 Eclipse 的 Android 开发工具（ADT）插件，它可以让开发更简单更快速。Ubuntu 存储库提供了 Eclipse\
  \ 版本，但它并不是 Android 开发者推荐的版本。Ubuntu 存储库中的版本实际上更新。请访问 [www.eclipse.org/downloads/](http://www.eclipse.org/downloads/)\
  \ Eclipse 网站，寻找本文编写时在 [`developer.android.com/sdk/installing.html`](http://developer.android.com/sdk/installing.html)\
  \ 推荐的旧版本 3.3。你也欢迎尝试 Ubuntu 存储库中的版本（称为 `eclipse`），但如果这样做的话，你可能会发现很难从 Android 开发者那里获得支持或帮助。由你决定。\n\
  \n### 安装 SDK\n\n从 Android 开发者网站的 [`developer.android.com/sdk/index.html`](http://developer.android.com/sdk/index.html)\
  \ 下载最新版本的 Android SDK。对于 Ubuntu，你需要 Linux 版本，该版本以 TGZ 归档格式提供。将文件解包到你希望开发工具包的位置（例如，`/home/matthew`）。这样做会创建一个名为\
  \ `android-sdk-linux_x86` 的新目录。记住你放置该目录的地方；稍后你需要这些信息。\n\n### 安装 ADT Eclipse 插件\n\
  \n如果你不使用 Eclipse，可以安全地跳过本节。按照以下步骤完成安装：\n\n1. 启动 Eclipse。选择 Help（帮助），Install New\
  \ Software（安装新软件）。\n2. 点击 Add（添加），在 Add Repository 窗口中，Name 输入 `ADT Plugin`，Location\
  \ 输入此 URL：`https://dl-ssl.google.com/android/eclipse/**`。点击 OK。\n3. 在 Available\
  \ Software 窗口中，勾选 Developer Tools 旁边的框并点击 Next（下一步）。\n4. 查看要下载的工具列表。点击 Next。\n5.\
  \ 阅读并接受许可协议。点击 Finish（完成）。\n6. 关闭并重启 Eclipse。\n\n你必须通过输入上一节中安装 SDK 的目录路径来配置插件使用\
  \ Android SDK。要配置插件，请在 Eclipse 中执行以下操作：\n\n1. 选择 Window（窗口），Preferences（偏好）。\n2.\
  \ 选择 Android。\n3. 在主面板的 SDK Location 中，点击 Browse（浏览）并找到正确的目录。点击 Apply（应用）。点击 OK。\n\
  \n### 安装其他组件\n\n你已经安装了 SDK 启动包，其中包含了最新版本的 SDK Tools。然而，要开发 Android 应用，你至少一个 Android\
  \ 平台及其相关的平台工具。你也可以同时添加其他实用的组件和平台。要此操作，你需要使用 Android SDK 和 AVD Manager。\n\n你可以在 Eclipse\
  \ 的菜单 Window -> Android SDK and AVD Manager 中完成。\n\n你也可以通过命令行进入 `android-sdk-linux_x86/tools`\
  \ 目录并输入 `android` 来完成。\n\n任种方法都会弹出图形用户界面（GUI），允许你浏览在线 Android SDK 存储库以选择新的或更新的组件。你已经安装了要求之一：Android\
  \ SDK Tools。\n\n至少，你还应该在一个对应你想编写应用程序的 Android 版本（例如 2.3 或 3.0）的 SDK 平台上安装 Android\
  \ SDK Platform-tools 包。并发安装多个平台。\n\n你还应该安装 Documentation（文档）和 Samples（示例）包。接下来查看第三方插件。如果你想开发使用\
  \ Google 应用程序接口（API）的应用程序，你还会想要安装 Google APIs 包。如果你想为特定制造商的硬件进行开发，你也会在这里找到他们的产品。\n\
  \n\n\n\n通过勾选相应的复选框选择您想要安装的包。点击 `Install` 安装这些包。\n\n### 安装虚拟机\n\n虚拟设备是运行 Android\
  \ 的硬件的软件仿真。这些设备对于测试您的应用程序以查看其在各种机器上的运行情况非常有用。从左侧面板选择 `Virtual devices` 开始。\n\n在\
  \ Virtual devices 窗口的右侧选择 `New`。\n\n在出现的窗口中配置您的虚拟机，如图 42.1 所示。准备完成后点击 `Create AVD`。\n\
  \n![Image](img/42fig01.jpg)\n\n图 42.1 使用您所需的配置创建虚拟设备。\n\n要运行 `Android Virtual Device\
  \ (AVD)`，请从列表中选择并点击 `Start`，如图 42.2 所示。左侧是模拟屏幕，右侧是硬件按钮。您可以使用鼠标和键盘与 `AVD` 交互。启动过程可能需要很长时间，请耐心等待。\n\
  \n![Image](img/42fig02.jpg)\n\n图 42.2 运行虚拟机以测试特定设置的兼容性。\n\n### 创建您的第一个应用程序\n\n现在您准备好开始了。虽然可以在不使用\
  \ Eclipse 的情况下开发 Android，但推荐的方法是使用它。这就是我们在简要介绍中将使用的。这个“Hello World”示例假设您已经正确安装并配置了\
  \ ADT 插件。\n\n1. 打开 `Eclipse` 并选择 `File`、`New`、`Project`。\n2. 选择 `Android Project`。点击\
  \ `Next`。\n3. 填写项目详情：\n• 项目名称（Project name）：`HelloUbuntuWorld`——这是 Eclipse 项目名称以及存储项目文件的目录名称。\n\
  • 应用程序名称（Application name）：`Hello, Ubuntu World!`——这是您的应用程序标题，以此命名，并将显示在 Android\
  \ 设备上。\n• 包名（Package name）：`com.example.helloubuntuworld`——这遵循与 Java 包命名相同的规则。请使用适用于您的组织或个人的名称。\n\
  • 创建 Activity（Create Activity）：`HelloUbuntuWorld`——这是插件将创建的类存根。这是可选的。\n4. 点击 `Finish`。\n\
  \n项目现在已创建。您将在 Eclipse 的 `Package Explorer` 中找到它。打开 `HelloUbuntuWorld` 下 `src`、`com.example.helloubuntuworld`\
  \ 中的 `HelloUbuntuWorld.java` 文件以查看为您生成的代码并开始。\n\nJava 开发以及通过 SDK 提供的 Android 小部件和其他组件的细节超出了本章的范围，本章仅旨在让您在\
  \ Ubuntu 上上手。假设您知道如何编写 Java 并像一个出色的开发者一样审阅过 Android SDK 文档，我们可以安全地跳到最后一步。\n\n您可以在\
  \ `Eclipse` 中运行应用程序进行测试。从菜单中，选择 `Run`、`Run`。选择 `Android Application`。`Eclipse` 会启动\
  \ Android 模拟器。与之前一样，模拟器可能需要长时间才能启动。启动后，您将看到模拟器以及您的应用程序在其中运行。\n\n#### 参考文献\n\n• [`developer.android.com/`](http://developer.android.com/)——Android\
  \ 开发的主网站。如果没有这个网站，本章的大部分内容将存在，它提供了比本简要介绍详细得多的信息，也是本书作者学习该领域大部分知识的地方。\n• [`developer.android.com/sdk/`](http://developer.android.com/sdk/)——Android\
  \ SDK 的主要网页。\n\n# 第六部分 附录\n\n## 附录 A. Ubuntu 内部\n\n* *\n\n在本附录中\n\n• 什么是 Linux？\n\
  • 为什么使用 Linux？\n• 什么是 Ubuntu？\n• 面向业务的 Ubuntu\n• 家中的 Ubuntu\n• 64 位 Ubuntu\n• 从\
  \ Ubuntu 和 Linux 文档中获取最大价值\n• Ubuntu 开发者与文档\n• 参考文献\n\n* *\n\n与任何任何新事物一样，了解一下它的历史是值得的。Ubuntu\
  \ 也不例外，在本附录中，您将学习更多关于 Linux（以及 Ubuntu）的来源。\n\n### 什么是 Linux？\n\nLinux 是一个自由操作系统的内核，该系统最早由林斯·本尼迪特·托瓦尔兹（Linus\
  \ Benedict Torvalds）于 1991 年开发并向世界发布。托瓦尔兹当时是芬兰赫尔辛基大学的一名研究生，现在是 Linux 基金会（[www.linuxfoundation.org/](http://www.linuxfoundation.org/））的会员。他是一名工程师，此前在\
  \ 2003 年离开 CPU 设计和制造公司 Transmeta, Inc.，转而在开源开发实验室（ODSL）工作，ODSL 是由许多高科技公司创建的财团，旨在支持\
  \ Linux 开发，这让他能够全职专注于 Linux 内核。对于所有 Linux 用户来说，幸运托瓦尔兹选择了一种名为 GNU `General Public\
  \ License (GPL)` 的自由软件许可证分发 Linux。\n\n* *\n\n注意\n\n免费在线资源维基百科（Wikipedia）有一份关于林斯·托瓦尔兹（Linus\
  \ Torvalds）的精彩传记，审视了他的生活和显著成就。您可以在 [`en.wikipedia.org/wiki/Linux_Torvalds`](http://en.wikipedia.org/wiki/Linux_Torvalds)\
  \ 找到它。\n\n* *\n\nGNU `GPL` 是自由软件基金会创始人理查·M·斯托曼（Richard M. Stallman）的结晶。斯托曼是 Emacs\
  \ 编辑环境和 GCC 编译器系统的著名作者，他制定了 `GPL` 以确保使用 `GPL` 许可的软件将始终是免费的并以源代码形式可用。`GPL` 是 Linux\
  \ 及其所有权、分发和版权的指导文档。托瓦尔兹拥有 Linux 商标权，但得益于他的慷慨、互联网、全球成千上万程序员、GNU 软件以及 GNU `GPL`，Linux\
  \ 将永远保持自由，不受许可或特许费问题的困扰。\n\n* *\n\n### 发行版本与内核编号方案\n\nLinux 内核、内核开发和 Ubuntu 版本有一套编号系统。请注意，这些数字与您的\
  \ Ubuntu 发行版版本号没有关系。Ubuntu 发行版版本号由 Ubuntu 开发者分配，而大多数 Linux 内核版本号由林斯·托瓦尔兹和他的内核开发者团队分配。\n\
  \n要查看编译 Linux 内核的日期，使用 `uname` 命令及其 `-v` 命令行选项。查看 Linux 内核版本使用 `-r` 选项。数字如 `2.6.32-24-generic`\
  \ 代表主版本（2）、次版本（6）和补丁级别（32）。最后的数字（24-generic）是开发者补丁级别，由 Ubuntu 开发者分配。\n\n即使是次版本也被认为是“稳定的”，通常适用于生产环境。本书仅包含稳定的\
  \ Linux 内核。您可以选择下载并安装内核的 beta（测试）版本，但这对于旨在日常使用的系统并不建议。使用时，开发者安装 beta 内是为了对新硬件或操作系统功能的支持。\n\
  \n* *\n\nLinux（读作“lih-nucks”）是自由软件。将 Linux 内核与 GNU 工具（驱动程序、实用程序、用户界面和其他如 X.Org Foundation\
  \ 的 X Window 系统）结合形成了一个 Linux 发行版。不同的供应商有不同的 Linux 发行版，但许多源自或密切模仿基于 Debian 的 Linux\
  \ 发行版。\n\n* *\n\n注意\n\n要查看究竟有多少发行版基于 Debian Linux，访问 [www.linux.org/](http://www.linux.org/)，点击\
  \ Distributions 并搜索“Debian-based”。在编写本书时，有 38 个发行版源自 Debian。\n\n\n\n\n\n数百万聪明的计算机用户已经使用\
  \ Linux 工作了近 20 年。在过去的一年里，许多国家的个人、小型办公/家庭办公（SOHO）用户、企业和公司、大学、非营利组织以及政府机构（地方、州和联邦）都成功地引入了\
  \ Linux。今天，Linux 已被纳入许多`信息服务/信息技术 (IS/IT)` 环境中，作为提高效率、安全性和降低成本的一部分。出于以下原因，使用 Linux\
  \ 是一个极佳的主意：\n\n- **Linux 提供了极佳的投资回报率 (ROI)**——每个席位的成本极低或完全没有。与商业操作系统不同，Linux 没有特许费或许可费，一个存储在\
  \ CD-ROM 或网络共享文件夹中的单一 Linux 发行版就可以作为企业级软件分发的基础，其中包含了应用程序和生产力软件。可以轻松制作定制的企业 CD-ROM，或创建网络共享以在企业级硬件上提供特定的安装。单此此项功能就能节省数十万甚至数百万的\
  \ IS/IT 成本——而且无需面临商业软件垄断进行软件审计的威胁，也无需对基础操作系统安装进行许可计数和控制。\n\n- **Linux 可以运行在桌面端**——Linux\
  \ 结合其支持的图形网络协议和接口（`X Window System`），自 20 世纪 90 年代中期以来作为消费级类 UNIX 桌面操作系统运行良好。UNIX\
  \ 已准备好用于消费级桌面这一事实，已通过 Apple Computer BSD UNIX（基于 Mac OS X）的引入、采用和快速成熟得到了证实；据 Apple\
  \ 介绍，该系统由超过 3000 个名为原生应用的 Mac OS X 特定程序支持。本书的光盘包含 800 多个软件软件包，包括互联网连接实用程序、游戏、全套办公套件、许多字体和数百个图形应用程序。\n\
  \n- **Linux 可以作为服务器平台运行**——Linux 快速、安全、稳定、可扩展且健壮。最新版本的 `Linux kernel` 能够轻松支持多处理器计算机、大量系统内存（高达\
  \ `64GB RAM`）、超过数百 GB 的单个文件大小、可选现代日志文件系统、数百个进程监控和控制工具，以及（理论上）同时支持 40 亿用户的能力。IBM、Oracle\
  \ 和其他主要的数据库供应商都为 Linux 提供了其企业软件版本。\n\n- **Linux 具有较低的入门和部署门槛**——维护成本也可以降低，因为 Linux\
  \ 在各种 PC 上都能良好运行，包括旧硬件，例如某些基于 Intel 的 486 和早期 Pentium CPU。虽然在较新的硬件上可以实现最佳程序性能，但由于客户端可以针对\
  \ Pentium 级 CPU 进行重新编译和优化，基础安装甚至可以在只有 `8MB of RAM` 的低端计算机或嵌入式设备上进行。这一特性涵盖了更广泛的用户群；延长了旧工作硬件的使用寿命；并能帮助家庭、小微企业和企业用户节省资金。\n\
  \n- **Linux 吸引了硬件和软件行业的广泛受**——几乎每种 CPU 都有相应的 Linux 版本。嵌入式系统开发者现在在使用 `ARM`、`MIPS`\
  \ 和其他低功耗处理器制作定制解决方案时，转向了 Linux。Linux 是适用于 Intel Itanium CPU 以及 `AMD64` 组 CPU 的第一个完整操作系统；此外，针对\
  \ HP/Compaq 的 Alpha 和 Sun Microsystems SPARC CPU 的端口也已可用一段时间。PowerPC 用户经常在 IBM 和\
  \ Apple 硬件上使用 Linux 的 `PPC` 端口。\n\n- **Linux 为跨平台开发提供免特许权税的开发平台**——由于开源开发模型和免费高质量开发工具的可用性，Linux\
  \ 为初级开发者和科技行业初创公司提供了一个低成本的切入点。\n\n- **IBM 等巨头在计算机硬件行业的支持，为 Linux 作为一个可行平台提供了信誉**——IBM\
  \ 已将 Linux 应用于其公司的整个系列计算机中，从低端笔记本电脑到“大铁塔”大型机。新的企业客户正在排队购买，并将 Linux 作为企业级计算解决方案的一部分。它已被用于世界上运行最快的计算机上，包括\
  \ IBM 的 `Blue Gene/L`。HP 也在其大部分硬件产品中认证了 Linux。\n\n随着 Linux 在全球范围内所有业务层面的普及，以寻求更低的成本、更好的性能以及稳定安全的实现，期待未来会有更多的支持。\n\
  \n## 什么是 Ubuntu？\n\nUbuntu 是一个基于 `Linux kernel` 的操作系统；由 Ubuntu 社区在 `[www.ubuntu.com/](http://www.ubuntu.com/)`\
  \ 创建、改进、精炼和分发。Ubuntu 由 Canonical Software 赞助，是由全球软件开发者社区支持的开源项目。\n\nUbuntu 是目前可用的较新的\
  \ Linux 发行版之一，其第一个版本于 2004 年 10 月发布。它因安装和使用简单而迅速闻名，再加上赋予每个发布版本略显古怪的代号。然而，Ubuntu\
  \ 本身基于 Debian，Debian 是一个非常老牌发行版，深受整个 Linux 社区的尊重。Ubuntu 将 `Debian` 描述为其赖以存在的基石，这是描述两者关系的一种良好方式。值得注意的是，`Debian`\
  \ 以发布频率低而闻名。从 `Debian 3.0` 到 `3.1` 的迁移花费了近三时间，在此期间，许多其他 Linux 发行版已经远远领先于 Debian。\n\
  \n在 Canonical Software 的赞助和 Mark Shuttleworth 的强大资源支持下，Ubuntu 从版本 `4.10`（Warty Warthog）开始有了良好的开端。从一开始开始，Ubuntu\
  \ 就设定了明确的目标：提供一种易于安装和使用、不会过度困扰用户、并且单张 CD 即可提供的发行版（这如今已越来越稀有，因为一个发行版可能占用四五张 CD）。每六个月发布一次，让\
  \ Ubuntu 在 Linux 社区中迅速进步，现在是全球最流行的 Linux 发行版之一。\n\n## Ubuntu 版本\n\n如前所述，自 2004 年\
  \ 10 月首次发布以来，Ubuntu 为其发布版本选择了独特的命名方案和奇特的代号。Ubuntu 摒弃了其他常见的版本命名法，决定采用发布时的月份和年份并反转。因此，2004\
  \ 年 10 月的第一个版本变为 `4.10`，随后是 `5.04`（2005 年 4 月）、`5.10`、`6.06LTS` 等，直到现在的 `11.10`。\n\
  \n本书涵盖的版本于 2011 年 10 月发布，因此其版本号为 `11.10`。某些版本更特别之处是它们还带有 `LTS（长期支持）` 标签，这意味着 Canonical\
  \ 将在桌面端支持 `LTS` 版本三年，并在服务器版本发布后总共支持五年。LTS 版本每两年发布一次，最近的 LTS 版本是 `10.04`。\n\n\n\n\
  \n\n开发期间的代号更有趣：4.10 被命名为“疣疣野猪”（Warty Warthog），以纪念它是首次发布，尽管尚不完美。第二个版本 5.04 被称为“花白豪猪”（Hoary\
  \ Hedgehog）。5.10 的情况稍好一些，代号为“清风大鼠”（Breezy Badger）。6.06 被宣布为“时髦的大蟒”（Dapper Drake），并且是第一个带有\
  \ LTS 标志的 Ubuntu 发行版。在 Dapper 之后，还有“边缘的山鲵”（Edgy Eft 6.10），接着是“活泼的小鹿”（Feisty Fawn\
  \ 7.04）等等，直到开发期间被称为“梦幻豹”（Oneric Ocelot 11.10）的版本，这本书涵盖的内容。开发代号完整列表请参见 [wiki.ubuntu.com/DevelopmentCodeNames](http://wiki.ubuntu.com/DevelopmentCodeNames)。\n\
  \n## 商业 Ubuntu\n\nLinux 多年来已经趋成熟，被认为企业级环境至关重要的功能（如 CPU 架构支持、文件系统和内存处理）已经得到了添加和改进。虚拟内存（将部分\
  \ RAM 交换到磁盘的能力）的加入是首批必要元素之一，此外 TCP/IP 栈的无版权实现（主要是因为当时 BSD UNIX 陷入了法律纠纷中）。其他功能也随之而至，例如对多种网络协议的支持。\n\
  \nUbuntu 包含一个可以使用多个处理器的 Linux 内核，这允许您在对 CPU 算力有要求的更高级计算环境中使用 Ubuntu。该内核将至少支持 16\
  \ 个 CPU；但实际上，小型企业服务器通常只使用双 CPU 工作站或服务器。不过，Ubuntu 可以在更强大的硬件上运行 Linux。\n\nUbuntu 将自动支持您的多\
  \ CPU Intel 架构主板，您可以利用 `symmetric multiprocessors (SMPs)` 带来的优势进行软件开发和其他操作。Ubuntu\
  \ 自带的 Linux 内核可以支持高达 64GB 的系统内存（RAM）大小，并允许单个文件大小超过 2GB，并能够承载（理论上）数十亿用户的需求。\n\n依赖高可用性、大规模系统的企业也可以获得\
  \ Ubuntu 的服务，并获得全球数百家支持合作伙伴提供的专业商业支持。\n\n然而，具有广泛不同计算需求的客户可以在这些许多环境中使用 Ubuntu。Ubuntu\
  \ 的一些应用包括：桌面支持；小型文件、打印或邮件服务器；内网 Web 服务器；以及部署在公司局域网（LAN）内外战略点的安全防火墙。\n\n商业客户也将从 Debian\
  \ 与包括惠普在内的几个顶级系统构建商的联盟中受益。\n\nDebian 本身也支持多种架构，直到最近仍在 11 种架构上并行开发，从 x86 到较老的摩托罗拉\
  \ 680x0 芯片（用于 Commodore Amiga），以及其他几种架构。\n\n小型企业主可以通过跳出软件许可和升级的“跑步机”，并采用基于 Linux\
  \ 的解决方案来获得巨大的回报。使用 Ubuntu 不仅避免了许可核算和软件审计的威胁，还为许多类型的商业生产力软件提供了可行的替代方案。\n\n在小型企业环境中使用\
  \ Ubuntu 在其他方面也有意义，例如不需要投资尖端硬件来建立一个高效的工作场所。Ubuntu 轻松支持旧的或 `legacy` 硬件，通过避免不必要的硬件升级，节省的费用随时间增加。由于软件和升级是免费的，还将实现额外的节省。新版本的应用程序可以低成本或无成本下载并安装，办公套件软件也是免费的。\n\
  \nUbuntu 在网络上易于安装，并且与其他系统良好共处，这意味着它在包含 Windows、Mac OS X 以及 UNIX 在其他操作系统的混合计算环境中运行良好。一个简单的\
  \ Ubuntu 服务器可以作为初始部分解决方案投入使用，或者被用来模拟其他操作系统的文件、邮件或打印服务器。文职人员应迅速适应使用熟悉的 Internet 和生产力工具，而您的业务将获得稳定性、安全性和无病毒计算平台的额外益处。\n\
  \n通过仔细分配花在服务器硬件上的资金，可以用比相当商业软件廉得多的成本构建出一个高效、实的多用户系统。将这些优势与对笔记本电脑、PDA 和远程访问的支持相结合，您将发现\
  \ Ubuntu 支持一种廉价且高效的工作环境的创建和使用。\n\n## 家庭中的 Ubuntu\n\nUbuntu 在您的硬盘上安装了一套特种预选软件软件包；这些软件包适用于小型办公室/家庭办公（SOHO）用户。此选项为文档管理、打印、通信和个人生产力提供了丰富的生产力工具。\n\
  \n标准安装需要近 2GB 的硬盘空间，但应该能够轻松地装入旧式奔腾类级 PC 的较小硬盘中。安装程序还包含管理工具、额外的创作和出版客户端、各种编辑器、基于\
  \ GNOME 的 X11 桌面、音频支持、图形编辑程序以及图形和文本的 Internet 工具。\n\n## 64 位 Ubuntu\n\n计算领域的进步使得\
  \ AMD 在 2003 年春季引入了 64 位 x86 兼容 CPU。Intel 针对 x86 的 EM64T 扩展在很大程度上反映了 AMD 实现的进展，进一步提高了通用\
  \ x86-64 硬件的可用性。\n\nUbuntu 完全支持 AMD64 处理器，并鼓励您使用 64 位版本的 Ubuntu 以充分发挥这些先进处理器的性能。\n\
  \n至于 Intel Itanium（安腾）架构，遗憾的是 Ubuntu 目前不支持 `ia64`。不过，您可能想研究 Debian，它支持 `ia64` 平台以及几个平台。\n\
  \n## 充分利用 Ubuntu 和 Linux 文档\n\n几乎所有的商业 Linux 发行版都包含缩封装的手册和文档，涵盖安装和配置。您将不会在随书提供的\
  \ DVD 中找到官方文档。但是，您可以在 [www.ubuntu.com/](http://www.ubuntu.com/) 在线阅读或获取各种手册或主题讨论的副本。在那里您将找到各种\
  \ Ubuntu 文档项目的链接。\n\nUbuntu 的文档（以及许多 Linux 软件包）以多种格式分发并提供。某些指南以 PDF 格式提供，可以使用 Linux\
  \ 版 Adobe Acrobat Reader 或 `evince` 客户端阅读。指南还以捆绑 HTML 文件的形式提供，可以使用网络浏览器如 links、KDE\
  \ 的 Konqueror、GNOME 的 Epiphany 或 Firefox 进行阅读。除了这些指南，Ubuntu 还提供了各种提示、常见问题解答（FAQs）和\
  \ HOWTO 文档\n\n您可以在 `/usr/share/man` 目录下找到传统的 Linux 软件包文档（如手册页），每个安装软件包的文档位于 `/usr/share/doc`\
  \ 下。\n\nLinux 手册页是压缩文本文件，包含了关于如何使用程序的简明信息。每个手册页通常提供命令用途的摘要、命令行选项的概览、命令目的的解释、潜在的警告或缺陷、作者姓名以及相关配置文件和程序的列表。\n\
  \n例如，您可以通过使用 `man` 命令显示其自己的手册页来学习阅读手册页，如下：\n\n```\nmatthew@seymour:~$ man man\n\
  ```\n\n在按下回车键后，文本页面将出现在屏幕或桌面的窗口中。然后您可以使用键盘的光标键滚动查看信息、阅读，然后按 Q 键退出阅读。\n\n\n\n\n许多软件包还包含名为\
  \ HOWTOs 的独立文档，其中包含有关特定主题或软件的信息。\n\n如果 HOWTO 文档是压缩格式的简单文本文件（以 `.gz` 结尾的文件），你可以使用\
  \ `zless` 命令轻松地阅读文档，该命令是一个文本分页器，允许你在文档中来回滚动。（请使用 `less` 命令读取纯文本文件。）你可以通过使用 `less`\
  \ 后跟完整的目录路径和文件名（或 `pathname`）来启动命令，如下：\n\n```\nmatthew@seymour:~$ less /usr/share/doc/httpd-2.0.50/README\n\
  ```\n\n要读取此文件的压缩版本，以同样的方法使用 `zless` 命令：\n\n```\nmatthew@seymour:~$ zless /usr/share/doc/attr-2.4.1/CHANGES.gz\n\
  ```\n\n按下回车键后，你可以使用光标键滚动文档。按 `Q` 键退出。\n\n如果 HOWTO 文档是 HTML 格式，你可以直接使用网络浏览器（如 Firefox）阅读信息。或者如果你在控制台中阅读，可以使用\
  \ `links` 或 `lynx` 等纯文本网络浏览器，如下：\n\n```\nmatthew@seymour:~$ links /usr/share/doc/stunnel-4.0.5/stunnel.html\n\
  ```\n\n链接浏览器提供了通过点击屏幕顶部访问的下拉菜单。你也可以按 `Q` 键退出。\n\n如果文档是 PostScript 格式（以 `.ps` 结尾的文件），你可以使用\
  \ `gv` 客户端这样读取或查看文档：\n\n```\nmatthew@seymour:~$ gv /usr/share/doc/iproute-2.4.7/ip-crefs.ps\n\
  ```\n\n最后，如果你想阅读便携式文档格式（以 `.pdf` 结尾的文件），请如下使用 `evince` 客户端：\n\n```\nmatthew@seymour:~$\
  \ evince /usr/share/doc/xfig/xfig-howto.pdf\n```\n\n***\n\n### Note\n\n本书是使用标准的\
  \ Ubuntu CD 开发和编写的。你可以使用书中随附的光盘进行安装，或者下载自己的副本（提供 ISO9660 镜像，文件名以 `.iso` 结尾），并将其刻录到\
  \ 700MB 的 CD-R 或 DVD 上。你也可以直接从 Ubuntu 的 [http://shipit.ubuntu.com] 订单压制的 CD。\n\n\
  除了完整的发行版外，你还可以获得 Linux 内核的完整源代码以及发行版中所有软件的源码——超过 5500 万行 C 代码和近 500 万行 C++ 代码。访问\
  \ [www.ubuntu.com/download/] 开始吧。\n\n***\n\n### Ubuntu 开发者与文档\n\n如果你有兴趣帮助 Ubuntu，可以通过测试\
  \ beta 版本（称为预览发布版，通常以为发布版本选择的动物命名）、编写文档以及为核心软件库或贡献型软件库贡献软件来提供帮助。你应该具备一些安装 Linux\
  \ 发行版的经验，有帮助将文档翻译成不同语言的意愿，或者能够使用各种软件项目管理系统（如 `CVS`）。\n\n邮件列表也是关于 Ubuntu 讨论的渠道或论坛。这些列表经过了分类。例如，Ubuntu\
  \ 的普通用户在 `ubuntu-users` 邮件列表讨论问题——beta 测试人员和开发者通过 `ubuntu-devel` 邮件列表交流，文档贡献者通过\
  \ `ubuntu-doc` 邮件列表交流。你可以在 [http://lists.ubuntu.com/mailman/listinfo/] 选择你感兴趣的列表进行订阅。但请注意：某些邮件列表每天的邮件超过\
  \ 200 到 300 封。\n\n#### 参考文献\n\n• **[www-1.ibm.com/linux/]**——来自 IBM 关于其在 Linux 硬件、软件和服务方面的努力和提供的信息。\n\
  \n• **[www.ubuntu.com/]**——Ubuntu 主页，由 Canonical Software 赞助，是你学习更多 Ubuntu 信息的起点。\n\
  \n• **[http://help.ubuntu.com/]**——带有指向当前 Ubuntu 文档和发布说明链接的网页。\n\n• **[www.tldp.org/]**——通用\
  \ Linux 答、指南和 HOWTO 文档最新更新的权威起点。\n\n• **[www.justlinux.com/]**——新 Linux 用户可以浏览以了解更多\
  \ Linux 信息的网站之一。\n\n• **[www.ubuntuforums.org/]**——一个流行的网站，允许用户就问题和困难进行交流和相互支持。\n\
  \n## 附录 B. Ubuntu 和 Linux 互联网资源\n\n***\n\n### 附录内容\n\n• 网站与搜索引擎\n• Usenet 新闻组\n\
  • 邮件列表\n• 互联网聊天室\n\n***\n\nUbuntu 拥有丰富的互联网支持，形式包括带有技术信息的网站、特定程序文档、针对性的白皮书、错误修复、用户体验、第三方商业技术支持，甚至是专门微调的克隆发行版的免费版本。\n\
  \n本附录列出了许多支持性网站、FTP 仓库、Usenet 新闻组和电子邮件列表，你可以利用它们获取更多信息并帮助你的 Ubuntu 使用。\n\n***\n\n\
  ### 如果你需要 24/7 的帮助\n\n无论你是个人、小型企业、公司还是企业级 Ubuntu 用户，请记住你随时可以寻求源码、Canonical 或提供 24/7\
  \ 现场支持、电话支持甚至按事件支持的帮助。Canonical 为其软件提供了系列支持方案。你可以在 Ubuntu 网站上了解更多支持选项：http://www.ubuntu.com/support]。\n\
  \n附录分为以下几个章节：\n\n按类别分类的 Linux 信息网站\n有关 Linux 的 Usenet 新闻组\n提供 Linux 用户和开发者讨论的邮件列表\n\
  Linux 信息的互联网聊天室\n\n附录还列出了在使用 Ubuntu 或特定组件（如 `Xorg`）时可能感兴趣的网站。已尽确保 URL 的准确性，但请记住互联网瞬息万变！\n\
  \n***\n\n### 保持更新\n\n关注错误修复、安全更新和其他错误对于 Ubuntu 系统的成功健康至关重要。为了跟进 Ubuntu 的重要动态，请务必订阅\
  \ Ubuntu Announcements 邮件列表。通过那里你可以了解到发布了哪些更新以及修复了哪些问题。访问 [https://lists.ubuntu.com/mailman/listinfo/ubuntu-security-announce]\
  \ 订阅此邮件列表。为了跟进错误修复、新软件包和安全更新，也请关注更新器的通知。\n\n#### 网络搜索技巧\n\n\n\n\n\n通过网络搜索来解决 Linux\
  \ 问题是获取棘手问题答案的一种高效且多产的方法。进行高效搜索的最基本规则之一是使用特定的搜索术语来寻找特定的答案。例如，如果你仅仅搜索“Ubuntu Linux”，你会得到过多的链接和信息。然而，如果你搜索“Ubuntu\
  \ sound”（Ubuntu 音频），你更有可能找到你需要的信息。如果你收到了错误消息，请使用它；否则，使用 Linux 内核诊断信息作为你的搜索标准。\n\n\
  其他有效技术还包括：\n\n- 在搜索字符串中使用符号，例如使用加号 `+` 强制匹配同时包含两个字符串的网页（如果所使用的网络搜索网站的搜索引擎支持此类功能）\n\
  - 在返回的结果中进行再次搜索\n- 对结果进行排序（通常按日期排序以获取最新信息）\n- 搜索相关信息\n- 词干提取搜索（Stemming searches）；例如，不仅指定“link”，还指定“linking”和“linked”的返回\n\
  \n花些时间尝试你最喜欢的搜索引擎的功能——结果将是带来更具成效的搜索。除了提高你的搜索技能外，还应该花时间根据你的需求选择最好的搜索引擎。\n\n## Google\
  \ 是你的朋友\n\n网络上一些最快且最全面的搜索引擎是由 Linux 驱动的，因此使用最好的可用资源是有意义的。在数以万计的带有搜索引擎网站中，[`google.com`](http://google.com)\
  \ 脱颖而出，每月拥有数百万用户。该网站使用先进的硬件软件为你的搜索带来速度和效率。如果你正在寻找特定的 Linux 答案，请利用 Google 在 [`google.com/linux`](http://google.com/linux)\
  \ 的 Linux 页面。\n\n为什么 Google（以一个数学数字命名）如此强大？你可以从 [www.google.com/corporate/tech](http://www.google.com/corporate/tech)\
  \ 的 Google 团队处获得快速概览。它的成功部分在于出色的算法、良好的编程和简单的界面设计；但大多数用户似乎真正赞赏 Google 在搜索结果的第一页就提供你所寻找内容的链接的神奇能力。Google\
  \ 的早期成功也得到了保障，因为该网站在运行 Red Hat Linux 的数千台 PC 集群上运行其搜索引擎。据传，Google 的桌面电脑上正在使用一种基于\
  \ Ubuntu 的发行版，非正式名称为 Goobuntu。\n\nGoogle 拥有网络任何搜索引擎中最大的数据库，搜索并索引了数十亿计的网页。数据库的大小非常重要，因为空搜索结果对在线用户来说是没用的，而返回生僻主题命中结果的能力可以决定成功与失败或满意与沮丧之间的差异。\n\
  \n为了让你更好地了解 Google 能为你提供什么，请访问 [www.google.com/options/](http://www.google.com/options/)。你将发现指向许多服务和工具的链接，涵盖了专门搜索、数据库、信息链接、翻译器和其他辅助浏览工具。\n\
  \n## Ubuntu 软件包列表\n\n你可以通过 Ubuntu 软件中心或 Synaptic 快速方便地查看你 Ubuntu 系统上安装的软件包列表，以及每个软件包的简短描述。它们还会向你每个软件包的描述，以便你决定是否要安装它。更多信息请参阅第\
  \ 9 章，“管理软件](#ch09.html_ch09)”。\n\n## 认证\n\nLinux 认证课程是快速增长的信息技术培训行业的一部分。数百不同的供应商现在提供关于\
  \ Linux 技能组的课程和测试。然而，由于 Linux 是开源软件，没有正式的规则或规定规定认证所需的知识或专业水平。如果你对认证感兴趣并想从事相关职业或在运行\
  \ Linux 的公司工作，你真的应该寻求培训。你可以在 [www.ubuntu.com/support/training/](http://www.ubuntu.com/support/training/)\
  \ 找到一份可以提供培训的公司良好列表。\n\n## 商业支持\n\n除了面向服务的公司，几乎每个 Linux 发行版都提供某种形式的商业支持。尽管有成百上千的精通\
  \ Linux 的顾问可以付费提供服务，但这里有一些 Linux 的指南：\n\n- “Advanced Bash-Scripting Guide,”由 Mendel\
  \ Cooper 编写；使用 `bash` 脚本指南\n- “LDP Author Guide，”由 Mark F. Komarinski 编写；如何编写 LDP\
  \ 文档\n- “Linux Administration Made Easy,”由 Steve Frampton 编写\n- “Linux from Scratch”（从\
  \ Linux），由 Gerard Beekmans 编写；从软件创建 Linux 发行版\n- “Linux Kernel Module Programming\
  \ Guide，”由 Peter J Salzman, Michael Burian 和 Ori Pomerantz 编写；关于构建 2.4 和 2.6 系列模块的良好指南\n\
  - “Securing and Optimizing Linux,”由 Gerhard Mourani 编写\n- Linux 认证指南\n- “The Linux\
  \ Network Administrator’s Guide, Second Edition，”由 Olaf Kirch 和 Terry Dawson 编写；一份全面的网络管理员指南\n\
  - Ubuntu\n\n## 加入 Linux 用户组的好处\n\n加入本地 Linux 用户组（LUG）。参与本地 LUG 有许多好处。你将获得帮助、交换信息并学习关于\
  \ Linux 的许多新事物。大多数 LUG 没有会费，许多经常举办 Linux、GNU 和开源专家的讲座和讨论。一个很好的开始地点是访问 [www.tux.org/luglist.html](http://www.tux.org/luglist.html)。对于\
  \ Ubuntu 特定小组，请查看 Ubuntu 社区 LoCo Teams，位于 [`loco.ubuntu.com/`](http://loco.ubuntu.com/)。\n\
  \n## 文档\n\n几乎所有的 Linux 发行版都包含了大量的手册页、HOWTO 文档（各种格式）、小型 HOWTO 或软件软件包文档（通常位于 `/usr/share/doc/`\
  \ 目录）。然而，阅读这些文档最新版本的权威网站是 Linux 文档项目，位于 [www.tldp.org](http://www.tldp.org)。\n\n\
  ## Linux 指南\n\n如果你正在寻找关于 Linux 主题更广泛、详细的信息，请尝试阅读许多 Linux 指南。这些指南涵盖多个主题，比 HOWTO 更深入地探讨技术话题，节奏更从容。你可以找到以下内容：\n\
  \n\n\n\n获取 Ubuntu 特定信息的最佳起点是专注于 Ubuntu 的网站。还有什么比该发行版的官方主网站和官方网络论坛更适合作为起点呢？虽然这些并不是全部的\
  \ Ubuntu 官方资源，但它们最有可能立即派用场。你可以轻松地在 `Ubuntu.com` 网站的“Support（支持）”标签页下找到其他资源：\n\n\
  - **[www.ubuntu.com](http://www.ubuntu.com)**——Ubuntu 的主页，由 Canonical 公司基于社区的免费\
  \ Linux 发行版。Ubuntu 是该 Linux 发行版的主要版本，包含了数千个软件软件包，这些软件包构成了现代、尖端基于 Linux 的桌面系统的核心。你还可以找到指向其他\
  \ `buntus` 的链接，例如 Kubuntu、Xubuntu 和 EdUbuntu。\n- **[www.ubuntuforums.org](http://www.ubuntuforums.org)**——如果你需要特定的\
  \ Ubuntu 支持，这是一个很好的去处。\n\n## Mini-CD Linux 发行版\n\nMini-CD Linux 发行版用于许多用途。某些发行版用于启动到只读的防火墙配置，某些用于提供尽可能完整的救援环境，另一些则用于安装或帮助启动完整发行版的安装。Mini-CD\
  \ 有多种尺寸，例如 3 张 CD-Rs（或 CD-RW），大小从 185MB 到 210MB 不等。你还可以下载 ISO 镜像并创建一个 Linux 启动内存卡，它通常可以装在\
  \ 40MB 或 50MB 信用卡大小的 CD-R 上。（考虑使用 mini–CD-RW，特别是如果你想经常更新发行版的话。）以下是这些发行版的链接：\n\n\
  - **[www.lnx-bbc.com](http://www.lnx-bbc.com)**——Linux BBC 的主页，这是一个 40MB 的镜像，托管了一个带有\
  \ X、网络浏览器和大量网络工具的相当完整的实时 Linux 会话。\n- **[`crux.nu/`](http://crux.nu/)**——CRUX i686\
  \ 优化 Linux 发行版的主页。\n- **[www.smoothwall.org](http://www.smoothwall.org)**——69MB\
  \ 的 SmoothWall 发行版用于安装带有 SSH、HTTP 和其他服务的 Web 管理防火墙、路由器或网关。\n\n## 各种基于 Intel 的 Linux\
  \ 发行版\n\n为基于 Intel 的 PC 选择 Linux `distribution (distro)` 通常取决于个人喜好或需求。许多 Linux 用户偏好\
  \ Red Hat 的发行版，因为它具有卓越的支持、商业支持选项以及在全球范围内的广泛使用。然而，许多不同的 Linux 发行版可下载。寻找新发行版或你喜欢的发行版新版本的最佳地点之一是\
  \ [www.distrowatch.com](http://www.distrowatch.com)：\n\n- **[www.debian.org](http://www.debian.org)**——Debian\
  \ Linux 发行版，仅由根据 GNU GPL 许可证分发的软件组成。Ubuntu 本身基于 Debian。\n- **[www.slackware.com](http://www.slackware.com)**——最古老的\
  \ Linux 发行版之一 Slackware 最新版本的下载主页。\n- **[www.opensuse.org](http://www.opensuse.org)**——SUSE\
  \ Linux 的主页。\n- **[`fedoraproject.org/`](http://fedoraproject.org/)**——与 Red Hat\
  \ 密切相关的流行发行版。\n- **[www.redhat.com/](http://www.redhat.com/)**——企业和服务器领域中使用率最高的发行版之一。\n\
  \n## 基于 PowerPC 的 Linux 发行版\n\nPowerPC 处理器是由 Apple、IBM 和 Motorola 联盟创建的。它们被广泛用于游戏机、嵌入式应用，并且是\
  \ 1994 年到 2006 年 Apple Macintosh 电脑所使用的处理器：\n\n- **[`penguinppc.org/`](http://penguinppc.org/)**——PowerPC\
  \ GNU/Linux 发行版的主页。\n- **[www.yellowdoglinux.com](http://www.yellowdoglinux.com)**——Terra\
  \ Soft Solutions 为 PowerPC 开发的 Yellow Dog Linux 主页，它基于 Fedora。\n\n## 笔记本电脑和 PDA\
  \  Linux\n\n获取关于在笔记本电脑上运行 Linux 的权威网站之一是 Kenneth Harker 的 Linux 笔记本网站。虽然更新不如以前那么活跃，但该网站（[www.linux-laptop.net](http://www.linux-laptop.net)）仍包含最大的\
  \ Linux 和笔记本信息集合，带有指向用户体验和特定笔记本型号详情的链接。\n\n另一个值得检查的网站是 Werner Heuser 的 Tuxmobil-Mobile\
  \ UNIX 网站，位于 [www.tuxmobil.org](http://www.tuxmobil.org)。你会发现指向 IrDA、Linux PDA 和手机手机等信息的链接。Linux\
  \ Zaurus PDA 用户可以浏览 [www.openzaurus.org](http://www.openzaurus.org) 来为 Zaurus 5000\
  \ 和 5500 型号下载完整的开源操作系统。\n\n## X 窗口系统 (X Window System)\n\n尽管互联网上有大量关于 X 窗口系统的技术信息，但在故障排除时寻找特定问题的答案可能会很困难。如果你在使用\
  \ X 时遇到问题，首先尝试确定问题是与软件还是硬件相关的。在搜索或寻求帮助（例如在 Usenet 的 `comp.os.linux.x` 新闻组，你可以通过\
  \ Google Groups 链接访问；请查看下一节其他有用的 Linux 新闻组）时，尽量尽可能具体。要评估一个问题是与软件还是硬件相关的关键因素包括 Linux\
  \ 发行版、X 版本、你的显示器品牌、型号以及其他相关硬件。\n\n关于 X 的权威技术信息可以通过 [www.X.org](http://www.X.org)\
  \ 获取。\n\n### Usenet 新闻组\n\nLinux 相关 Usenet 新闻组是另一个遇到 Linux 问题时的良好信息来源。如果你的 ISP 没有提供全面的\
  \ Linux 新闻组，你可以浏览 [`groups.google.com/`](http://groups.google.com/)。\n\n主要的 Linux\
  \ 和 Linux 相关新闻组如下：\n\n- alt.os.linux.dial-up——使用 PPP 拨号\n- alt.os.linux.mandriva——关于\
  \ Mandriva Linux\n- alt.os.linux.slackware——使用 Slackware\n- alt.os.linux.ubuntu——使用\
  \ Ubuntu\n- comp.os.linux.advocacy——关于 Linux 及其他问题的激烈讨论\n- comp.os.linux.alpha——在\
  \ Alpha 上使用 Linux\n- comp.os.linux.announce——通用 Linux 公告\n- comp.os.linux.answers——新\
  \ Linux FAQ 和其他信息\n- comp.os.linux.development.apps——使用 Linux 开发工具\n- comp.os.linux.development.system——构建\
  \ Linux 内核\n- comp.os.linux.embedded——嵌入式设备开发\n- comp.os.linux.hardware——为各种硬件配置\
  \ Linux\n- comp.os.linux.m68k——在摩托罗拉 68K 系列 CPU 上使用 Linux\n- comp.os.linux.misc——杂杂\
  \ Linux 主题\n- comp.os.linux.networking——网络与 Linux\n- comp.os.linux.portable——在笔记本电脑上使用\
  \ Linux\n- comp.os.linux.powerpc——使用 PPC Linux\n- comp.os.linux.security——Linux\
  \ 安全问题\n- comp.os.linux.setup——Linux 安装主题\n- comp.os.linux.x——Linux 和 X 窗口系统\n-\
  \ comp.windows.x.apps——使用 X 客户端\n- comp.windows.x.i386unix——用于 UNIX PC 的 X\n- comp.windows.x.intrinsics——X\
  \ Toolkit 主题\n- comp.windows.x.kde——关于 KDE 和 X 的讨论\n- comp.windows.x.motif——关于 Motif\
  \ 编程\n- comp.windows.x——关于 X 的讨论\n- linux.admin.*——两个用于 Linux 管理员的新闻组\n- linux.debian.*——关于\
  \ Debian 的 30 个新闻组\n- linux.dev.*——25 个或更多 Linux 开发新闻组\n- linux.help——获取 Linux 帮助\n\
  - linux.kernel——Linux 内核\n\n## 邮件列表\n\n\n\n\n\n邮件列表是关于几乎任何主题的交互式或摘要形式的电子讨论。要使用邮件列表，你通常需要发送一封邮件请求订阅列表，然后通过主列表邮件发送器的回复消息来确认订阅。一旦你订阅了交互形式的列表，发送到列表的每条消息都会出现在你的邮箱收件箱中。然而，许多列表提供摘要形式的订阅，将一天或半天的流量浓缩在单条消息中。除非你设置了邮件过滤，否则通常更倾向于摘要形式。\n\
  \n主要的 Ubuntu 邮件列表在此列出了详细信息，但还有许多与 Linux 相关的列表。你可以使用典型的邮件列表搜索页面（例如 [www.lsoft.com/lists/list_q.html](http://www.lsoft.com/lists/list_q.html）上的页面）搜索几乎所有的在线邮件列表。\n\
  \n# GNOME 和 KDE 邮件列表\n\nGNOME 用户和开发者应该知道，通过 [`mail.gnome.org/`](http://mail.gnome.org/)\
  \ 可以获得两个多个邮件列表。KDE 用户也可以通过浏览 [www.kde.org/mailinglists.html](http://www.kde.org/mailinglists.html)\
  \ 上的 KDE 相关邮件列表来受益。\n\n# Ubuntu 项目邮件列表\n\nUbuntu 项目一直在不断扩展，因为有许多新用户不断首次发现 Ubuntu。通过参与\
  \ Ubuntu 的邮件列表之一，你将发现许多能够回答你问题的资深用户。这些列表侧重于 Ubuntu 的使用、测试、开发以及参与 Ubuntu 的开发：\n\n\
  * [`lists.ubuntu.com/mailman/listinfo/ubuntu-security-announce`](http://lists.ubuntu.com/mailman/listinfo/ubuntu-security-announce)—来自\
  \ Ubuntu 开发者的安全公告。\n* [`lists.ubuntu.com/mailman/listinfo/ubuntu-announce`](http://lists.ubuntu.com/mailman/listinfo/ubuntu-announce)—关于\
  \ Ubuntu 的公告。\n* [`lists.ubuntu.com/mailman/listinfo/ubuntu-users`](http://lists.ubuntu.com/mailman/listinfo/ubuntu-users)—Ubuntu\
  \ 发布用户之间的讨论。\n* [`lists.ubuntu.com/mailman/listinfo/ubuntu-devel`](http://lists.ubuntu.com/mailman/listinfo/ubuntu-devel)—来自\
  \ Ubuntu 测试版开发者和测试者的查询和报告。\n\n# 互联网相对聊天\n\n互联网相对聊天 (IRC) 是许多 Linux 开发者和用户的一种常用通信形式和论坛，因为它允许对信息和想法进行交互、实时的交换。要使用\
  \ IRC，你必须拥有 IRC 客户端，以及托管你想要讨论的频道的网络和服务器地址。\n\n你可以使用 `irc.freenode.net` IRC 服务器，或\
  \ [www.freenode.net/](http://www.freenode.net/) 上列出的服务器之一与其他 Ubuntu 用户聊天。当前的一些频道如下如下：\n\
  \n* #Ubuntu—关于 Ubuntu 的通用聊天。\n* #edubuntu—关于 Edubuntu 的通用聊天。\n* #xubuntu—关于 Xubuntu\
  \ 的通用聊天。\n* #kubuntu—关于 Kubuntu 的通用聊天。\n\n如需查看更多频道，请访问 [`help.ubuntu.com/community/InternetRelayChat`](https://help.ubuntu.com/community/InternetRelayChat)\
  \ 查看“官方”频道的完整列表。\n\n然而，Google 也可以帮助你找到其他可探索的频道。在搜索选项中输入发行版名称和 IRC，以检索与你需求相关的任何 IRC\
  \ 频道信息。如需获取开始 IRC 的帮助，请访问 [www.irchelp.org/](http://www.irchelp.org/)。你可能会发现有趣的频道包括：\n\
