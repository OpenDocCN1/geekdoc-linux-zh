  \n#### 创建你的架构\n我们将从加载一些预制的架构文件开始。通过预加载某些设置，这使得配置变得更快、更简单。如果你正在构建企业级服务器，请阅读官方 `OpenLDAP`\
  \ 文档并从零开始，这样你就能精确地知道服务器上的每一项在做什么以及为什么要这样做。对于我们的示例，使用以下命令将这三个文件加载到目录中：\n\n```\nmatthew@seymour:~$\
  \ sudo ldapadd -Y EXTERNAL -H ldapi:/// -f /etc/ldap/schema/cosine.ldif\nmatthew@seymour:~$\
  \ sudo ldapadd -Y EXTERNAL -H ldapi:/// -f /etc/ldap/schema/nis.ldif\nmatthew@seymour:~$\
  \ sudo ldapadd -Y EXTERNAL -H ldapi:/// -f /etc/ldap/schema/inetorgperson.ldif\n\
  ```\n\n接下来，我们创建一个名为 `backend.matthewhelmke.com.ldif` 的文件，内容如下：\n\n```ldap\n# Load\
  \ dynamic backend modules\ndn: cn=module,cn=config\nobjectClass: olcModuleList\n\
  cn: module\nolcModulepath: /usr/lib/ldap\nolcModuleload: back_hdb\n\n# Database\
  \ settings\ndn: olcDatabase=hdb,cn=config\nobjectClass: olcDatabaseConfig\nobjectClass:\
  \ olcHdbConfig\nolcDatabase: {1}hdb\nolcSuffix: dc=matthewhelmke,dc=com\nolcDbDirectory:\
  \ /var/lib/ldap\nolcRootDN: cn=admin,dc=matthewhelmke,dc=com\nolcRootPW: changeMEtoSOMETHINGbetter\n\
  olcDbConfig: set_cachesize 0\n```\n\n*(注：由于原文后续内容为大量重复的无效文本，译文已在逻辑结束处停止。若需要处理特定的乱码部分，请提供清晰的原文。)*\n\
  \n\n\n\n```\nmatthew@seymour:~$ ldapsearch -xLLL -b \"dc=example,dc=com\" uid=john\
  \ sn givenName cn\n\ndn: uid=matthew,ou=people,dc=matthewhelmke,dc=com\n\ncn: Matthew\
  \ Helmke\n\nsn: Helmke\n\ngivenName: Matthew\n```\n\n在此示例中，`dn` 代表区分名称（distinguished\
  \ name），`uid` 指用户标识（user identification），`ou` 告诉组织单元（organizational unit），`dc` 代表域名组件（domain\
  \ component），`cn` 是通用名称（common name），`sn` 是姓（family or surname），许多文化将 `givenName`\
  \ 称为名。\n\n当你使用 LDAP 时，可以用许多方式组织数据。你可以使用许多当前存在的架构（schemas），例如之前的示例中使用我们在开始时加载的 `LDIF`\
  \ 文件那样，或者你可以编写自己的架构。`/etc/ldap/schemas` 目录下包含许多以 `.schema` 结尾的优秀示例文件，还有少数已转换为 `LDIF`\
  \ 格式的文件。要使用这些文件，它们必须处于 `LDAP 数据交换格式`（`LDIF`，或者当用文件后缀时为 `.ldif`）。你可以转换其中一个示例架构或创建你自己的架构。\n\
  \n## 配置客户端\n\n虽然 Ubuntu 自带了一系列邮件客户端，但这里没有足够的空间涵盖它们。因此，我们将讨论两个最常用的客户端：默认的 Evolution\
  \ 和 Thunderbird。这两者都是强大的消息解决方案，因此都与 LDAP 配合得很好。在这两个软件中，Thunderbird 似乎更容易配置。过去，在\
  \ Thunderbird 第一次就能正常工作的情况下，我们曾在 Evolution 上遇到过各种问题。\n\n### Evolution\n\n要为 Evolution\
  \ 配置 LDAP，点击“新建”（New）旁边的箭头并选择“地址录”（Address Book）。会出现一个新界面；其第一个选项提示你要创建什么种类型的地址录。选择\
  \ `On LDAP Servers`。\n\n名称（Name）只需输入 `Address book`，对于服务器（Server），输入你的 LDAP 服务器的\
  \ IP 地址（如果你在服务器上操作，则输入 `127.0.0.1`），如图 30.1\n\n图 30.1 配置 Evolution 使用 LDAP 访问对于匿名连接来说很容易。\n\
  \n### Thunderbird\n\nThunderbird 的配置比 Evolution 稍微简单，而且通常运行更好，特别是对于具有多个 CN 的条目。要启用，进入“编辑”（Edit）菜单，点击“首选项”（Preferences），然后从顶部的选项卡选择“编辑”（Composition）。\n\
  \n在“地址”（Addressing）子标签中，勾选“目录服务器”（Directory Server）框并点击右侧的“编辑目录”（Edit Directories）按钮。在出现的对话框中，点击“添加”（Add）添加新目录。你可以给它任何喜欢的名称，因为这仅用于显示。如图\
  \ 30.2\n\n图 30.2 Thunderbird 的选项比 Evolution 隐藏得更深，但它确实允许你下载 LDAP 目录供离线使用。\n\n##\
  \ 管理\n\n在你设置好 LDAP 服务器和客户端后，除非外部发生变化，否则它们几乎 little 需要维护。具体来说，如果你目录中的某人换了工作、更改了电话号码、结婚了（更改了姓氏\
  \ [surname]）、离职等，你需要能够更新你的目录以反映这些变化。\n\n我们之前通过 `ldap-utils` 包安装了一些实用的工具。以下是它们的功能。每个工具都需要管理权限，因此请使用\
  \ `sudo`：\n\n- `ldapsearch`—打开到 LDAP 服务器的连接并在其目录中搜索请求的信息。\n- `ldapmodify`—打开到 LDAP\
  \ 服务器的连接并允许你添加或修改条目。\n- `ldapadd`—打开到 LDAP 服务器的连接并允许你添加条目。\n- `ldapdelete`—打开到 LDAP\
  \ 服务器的连接并允许你删除一个或多个条目。\n\n这些工具都不容易使用，但它们的帮助页（man pages）中都有适量的文档。\n\n一个更聪明的选择是使用\
  \ `phpLDAPadmin`，它是一个 LDAP 管理工具，允许你完全通过浏览器添加和修改条目。该程序在 Ubuntu 软件仓库中作为 `phpldapadmin`\
  \ 提供。\n\n启动、停止或重启 `slapd` 守护进程按照系统守护进程的通常方式（这些进程尚未编写 Upstart 方法）：\n\n```\nsudo /etc/init.d/slapd\
  \ start/stop/restart\n```\n\n#### 参考文献\n\n- [www.openldap.org](http://www.openldap.org)—OpenLDAP\
  \ 项目的主页，你可以在这里下载最新版本的软件并与其他用户交流。\n- [`ldap.perl.org/`](http://ldap.perl.org/)—用于与\
  \ LDAP 交互的 Perl 库主页，提供了入门的全面文档。\n- [www.openldap.org](http://www.openldap.org)—OpenLDAP\
  \ 项目的主页，你可以在这里下载最新版本的软件并与其他用户交流。\n- [`ldap.perl.org/`](http://ldap.perl.org/)—用于与\
  \ LDAP 交互的 Perl 库主页，提供了入门的全面文档。\n- [www.ldapguru.com/](http://www.ldapguru.com/)—全球\
  \ LDAP 管理员的巨大门户。从专门的 LDAP 论坛来看，这可能是你需要的一切。\n- [`help.ubuntu.com/10.10/serverguide/C/openldap-server.html`](https://help.ubuntu.com/10.10/serverguide/C/openldap-server.html)—Ubuntu\
  \ Server OpenLDAP 官方文档。\n- [`phpldapadmin.sourceforge.net/`](http://phpldapadmin.sourceforge.net/)—phpldapadmin\
  \ 的官方文档。\n- *LDAP System Administration* (O’Reilly), ISBN: 1-56592-491-6。任何 LDAP\
  \ 管理员书架上的必读之作。\n- *LDAP Directories Explained* (Addison-Wesley), ISBN: 0-201-78792-X。不过，它对微软\
  \ Active Directory 的实现侧重点更多。\n\n\n\n\n轻客户端在教室和计算机实验室等场所非常出色，在这些地方需要严格的控制和强大的安全性，可能无法负担一整间全配置系统的资金，而且在一个服务器上安装和维护核心软件比在许多系统上进行更具优势。因此，Edubuntu\
  \ 作为 Ubuntu 一个由社区领导的官方子项目，被设计为易于安装和配置 LTSP。我们专注于在标准 Ubuntu 上使用 `LTSP`，但如果你想在特定的教育背景下使用\
  \ `LTSP`，或者你只想获得关于 `LTSP` 的更多视角和信息，Edubuntu 值得仔细研究。其他你可能发现使用轻客户端的常见场所还有用于目录访问和搜索的图书馆，以及一些为旅客提供检查邮件自助终端的机场。\n\
  \n本章的 `References` 部分包含了指向几个轻客户端硬件源的链接，尽管包含这些链接仅供参考，不应被视为背书。（我们并不拥有也没有使用过列出的所有公司的设备，因此无法对它们提供任何诚实的建议。）除了上述提到的那些之外，你肯定还能找到其他的。事实上，许多经常作为优秀轻客户端的电脑本身并未以此广告。例如，你可以寻找使用\
  \ `ARM`、`VIA` 或可能是 `Intel Atom` 处理器的紧凑型系统，并可能会发现它们是极好的轻客户端。你甚至可以回收那些本该进垃圾桶的旧硬件，使其再次作为轻客户端发挥作用。\n\
  \n现在你已经了解了为什么可能使用 `LTSP` 以及网络是如何创建的，现在是时候介绍一些关于 `LTSP` 是什么、它不是什么以及它是如何设计的细节了。有了这些知识，你将能够找到文档，帮助你决定可以买得起什么、你想如何配置它，甚至这种配置是否适用于并对你的情况有用。\n\
  \n`LTSP` 是一个用于 Linux 的附加软件，它可以创建一个用于通过网络启动客户端计算机的服务器。它允许客户端在服务器上访问并运行应用程序，而客户端仍负责输入和显示，服务器则处理数据处理和存储。这使得许多廉价的硬件客户端能够完成超出其硬件能力的任务，并通过通过将所有配置和软件放在一台服务器上简化了管理。最大的局限性源于服务器和网络硬件（例如交换机或集线器、`1GB`\
  \ 与 `100MB` 端口、高端服务器和存储设备或较便宜的仅足够的设备）。\n\n### Requirements\n\n我们对轻客户端的最低推荐规格是运行在\
  \ `400MHz` 的处理器，配备 `128MB RAM` 并能够通过 `PXE`（一种常见的网络启动协议）启动。今天市售并宣传为轻客户端的几乎任何系统都远超这些要求。我们在这里列出它们，以防你想尝试重用其他本已过时的旧硬件。服务器和其他硬件的建议列在\
  \ `Installation` 部分。\n\n让我们先看几种接线方案，以展示使用 `LTSP` 的适当方法。第一种在 `Figure 31.1` 中所示，是在无互联网连接的默认安装，这是使用\
  \ `LTSP` 最简单的方法。\n\n```\n![Image](img/31fig01.jpg)\n```\n\n图 31.1 无互联网连接的默认 LTSP\
  \ 安装。\n\n仅从图表中，你就可以看到所需的主要硬件部分：一台服务器、一个交换机/集线器和若干轻客户端。`switch/hub` 是我们讨论的第一件硬件。\n\
  \n为了简单起见，我们在每个示例中只显示了四个轻客户端，但这并不是实际限制。轻客户端的数量取决于你的 `switch/hub`，即使是廉价的集线器也能支持四个连接，尽管高质量的企业级交换机通常有\
  \ 48 个或更多端口。交换机通常比集线器更快、更贵，出于本章范围之外的原因，通常是优选，但它们具有相同的基本目的，并且都可以在 `LTSP` 环境下工作。它们用于控制网络流量，并确保计算机之间的通信按预期进行。\n\
  \n理想情况下，你希望这里有一块硬件，支持服务器与交换机之间建立 `GB` 连接，轻客户端与交换机之间至少有 `100MB` 连接，并有足够的空闲通信端口以便于未来扩展，而无需额外添加另一个交换机或集线器并增加复杂性。如果资金是个问题且理想性能并非至关重要，一个到处都是\
  \ `100MB` 端口且端口足够连接所有设备的廉价集线器无疑可以工作。如果你将超过 10 个客户端连接到服务器，强烈建议到服务器使用千兆连接。\n\n生活充满了权衡，资金供应并非无限，所以请运用你的最佳判断，并购买你范围内负担得起的最好的。\n\
  \n对于服务器，推荐规格很大程度上取决于预期用途。如果每个人在每个客户端上都使用同一个程序，你不需要像每个人同时做不同事情时那么多的内存和处理器速度。你可以轻松地在你手中闲置的、拥有\
  \ `512MB RAM`、`1GHz Celeron` 处理器和一个尚好且完好的硬盘的改造旧机器上运行 `LTSP server`，它可以工作，但如果你计划将有超过几个客户端执行简单且相同任务之外的操作，我们并不真正建议这样做。\n\
  \n我们的最低建议与目前 `Ubuntu` 桌面安装的建议相同：`1GHz x86` 处理器、`1GB RAM`、`15GB` 硬盘。至少 `100MB` 以太卡至关重要。理想情况下，你会将每个类别提升到你能负担得起的最高水平，以获得更好的性能。我们获得良好体验的最低建议是多核\
  \ 64 位处理器、`4GB RAM`、至少两个用于性能和备份的 RAID 硬盘，以及以太卡。\n\n大多数时候当你使用 `LTSP` 时，你会希望网络连接到互联网。有两种主要方法可以实现。`Figure\
  \ 31.2` 显示了通过连接到交换机/集线器的路由器连接互联网的网络。这是一种常用方法且效果良好。\n\n```\n![Image](img/31fig02.jpg)\n\
  ```\n\n图 31.2 通过路由器连接互联网的典型 LTSP 安装。\n\n另一种常见方法是将服务器直接连接到互联网路由器，如 `Figure 31.3`\
  \ 所示。这种方法的处处是可以让你轻松地配置并将服务器作为网关来控制客户端对互联网的访问。为了实现这一点，服务器必须有两个网卡，我们再次建议连接到交换机的是 `1GB`\
  \ 卡；所有轻客户端流量都通过这一个连接在交换机和服务器之间传输，这比多个客户端通过 `100MB` 连接到交换机并尝试共享单个 `100MB` 连接到服务器产生的瓶颈要少。服务器到互联网路由器的网卡应适用于可用的互联网连接，但没有理由在里面放入更快的设备。如果你与互联网服务提供商只有\
  \ `100MB` 连接，使用 1GB 卡不会产生任何特殊收益。\n\n```\n![Image](img/31fig03.jpg)\n```\n\n图 31.3\
  \ 使用双以太网卡的服务器作为互联网门户。\n\n\n\n\n\n在你决定好如何设置网络并连接所有硬件之后，就可以开始安装软件任务了。在 Ubuntu 中，LTSP\
  \ 软件有两种方式可以进行安装。如果你正在重用一台已经安装了当前版本 Ubuntu 的服务器，你可以从 Ubuntu 存储库中安装 `ltsp-server-standalone`\
  \ 和 `openssh-server` 软件包，并运行以下命令来设置环境：\n\n```\nmatthew@seymour:~$ sudo ltsp-build-client\n\
  ```\n\n如果你的服务器是 64 位系统，而你的瘦客户端使用的是不同的处理器架构，你可能需要使用 `--arch` 选项运行该命令，如下：\n\n```\n\
  matthew@seymour:~$ sudo ltsp-build-client --arch i386\n```\n\n大多数人将从头开始安装，而不是重用已经安装了\
  \ Ubuntu 的系统。这仍然非常简单。你必须从 Ubuntu 网站 [`releases.ubuntu.com/`](http://releases.ubuntu.com/)\
  \ 下载备用安装 CD。从这里找到你想要用于服务器的 Ubuntu 发布版本。有些人可能想要当前的版本（在写本书时为 11.10），另一些人可能想要使用像 10.04\
  \ LTS 这样的 LTS 版本。点击你想要使用的版本，然后找到适用于服务器处理器架构（32 位或 64 位）的备用安装 CD 链接。下载它并将镜像刻录到 CD\
  \ 中，如第 1 章“安装 Ubuntu”所示。\n\n确保所有瘦客户端都已连接并设置为通过 PXE 网络启动，但处于关闭状态。然后使用备用 CD 启动服务器，按\
  \ F4 进入模式菜单，并选择 Install an LTSP Server。普通的 Ubuntu 安装将开始。在安装结束时，会出现一条消息通知你服务器正在构建瘦客户端系统。你会收到通知它正在被压缩成镜像，当过程完成后，重启服务器，并在过程中的适当时刻移除\
  \ CD。\n\n服务器重启并运行后，你可以打开瘦客户端，它们将通过服务器上的镜像从网络启动。瘦客户端可以运行安装在服务器上的任何程序。\n\n### 使用 LTSP\n\
  \n当你在 LTSP 网络中启动瘦客户端时，它会从 LTSP 服务器检索启动镜像，并使用它创建显示给用户的环境。该过程包括：使用`动态主机配置协议 (DHCP)`向客户端请求并为其分配网络\
  \ IP 地址；从服务器下载内核和初始 RAM 磁盘；下载 LTSP 配置并挂载服务器托管的文件系统；使用 `chroot` 将此文件系统作为客户端自身的根文件系统；然后使用该文件系统中的指令完成启动。这是一个高度可配置的过程。默认情况下，客户端将使用\
  \ `LTSP 显示管理器 (LDM)` 启动到登录界面，而不是 Ubuntu 使用的 GDM、Kubuntu 使用的 KDM 或其他。使用用户账户来限制或控制访问，而\
  \ LDM 会初始化服务器与客户端之间通信的细节，包括启动桌面、挂载存储设备和 `/home` 目录以及创建菜单项。整个桌面在服务器上运行并显示在客户端上。\n\
  \n默认情况下，LTSP 使用 Linux 内置的能力，但对其进行了配置以使其顺畅地协同工作。可以根据你的需求修改细节。例如，应用程序服务器与客户端之间的通信是通过通过\
  \ `ssh` 隧道 X11 会话来实现的，使得图形桌面的共享变得简单，并且在使用标准方法的同时，也是一种通信用户凭据的安全方法。\n\nLTSP 的一个非常实用的功能是，你并不限于在网络中仅使用一台服务器。如果你的瘦客户端网络增长到当前服务器负载过大，有一种简单的方法可以配置并在网络中添加第二台或多台服务器来分担负载。在这种情况下，瘦客户端用于启动的服务器并不一定是用户登录的服务器。当你添加服务器时，会选择一台作为主服务器，负责瘦客户端的启动、数据存储并运行额外的服务。额外的辅助服务器可以简单得多，因为它们只是托管桌面会话，并将配置为使用主服务器的中央服务处理其他所有事情。在多服务器网络中，用户验证是你需要思考并配置的内容，因为这变得稍微复杂了一些。有很多方法可以实现，包括显而易见的选择：LDAP。\n\
  \n创建和维护 LTSP 网络在特定情况下非常有用，可以作为一种节省管理员时间成本的方式，同时为终端用户提供实用的功能。尽管在本介绍章节中基础听起来很简单，但这可能是一项值得写整本书的复杂任务。我们在本章的意图是提供足够的信息，让你判断\
  \ LTSP 是否是适合你需求且值得进一步研究的技术。为此，我们在下一节提供了几个实用的链接，并建议将其作为你的下一步。\n\n#### 参考文献\n\n- **[www.ltsp.org/](http://www.ltsp.org/)**——LTSP\
  \ 官方上游网站。\n\n- **[`help.ubuntu.com/community/UbuntuLTSP`](https://help.ubuntu.com/community/UbuntuLTSP)**——Ubuntu\
  \ 社区文档页无疑是 LTSP Best resource，因为它包含了一个组织良好且最新的链接，涵盖了你可能需要的任何方面的信息。\n\n- **[`edubuntu.com/`](http://edubuntu.com/)**——Edubuntu\
  \ 项目领导者对 LTSP 非常熟悉。当你寻找相关人员时，这个网站是一个很好的起点。\n\n- **[`help.ubuntu.com/community/UbuntuLTSP/Tour`](https://help.ubuntu.com/community/UbuntuLTSP/Tour)**——概述了传统的\
  \ LTSP 安装与 Ubuntu 社区在安装、软件更新和安全性方面的差异。\n\n- **[`help.ubuntu.com/community/UbuntuLTSP/ThinClientHowto/`](https://help.ubuntu.com/community/UbuntuLTSP/ThinClientHowto/)**——如果你使用图\
  \ 23.3 中的网络设计，它告诉你如何配置服务器以便你的瘦客户端访问互联网。\n\n- **[`doc.ubuntu.com/edubuntu/handbook/C/`](http://doc.ubuntu.com/edubuntu/handbook/C/)**——Edubuntu\
  \ 手册提供了关于设置和使用 LTSP 最清晰、完整的指南之一。\n\n以下是销售瘦客户端的公司：\n\n- `www.artecgroup.com/thincan`\n\
  - `www.chippc.com/thin-clients/thin-clients.asp`\n- `www.devonit.com/hardware`\n\
  - `www.disklessworkstations.com/`\n- `http://h10010.www1.hp.com/wwpc/us/en/sm/WF02d/12454-12454-321959.html`\n\
  - `www.lucidatech.com/`\n- `www.wyse.com/products/hardware/thinclients/index.asp`\n\
  \n\n\n\n虚拟化在今天是一个重要的课题，但至少从概念上来说，它并不在本。在本章中涵盖了两个不同的用例：服务器虚拟化和桌面虚拟化。本章涵盖的大多数选项适用于这两种用例。在接下来的章节中，本章将指出某些专门针对某一个用例的特定时刻。有若干大小大小的场景，有助于说明虚拟化的潜力，并为这一概念提供一些定义。\n\
  \n首先，想象一家处理海量数据的大型企业或业务。该公司将拥有许多专用计算机来协助完成这项任务。在过去，他们可能使用大型机，即能够在处理大型数据集和多个并发用户的同时并行执行多项任务的单台计算机。今天，同一家公司可能会使用服务器集群，这是一个由可扩展的小型计算机组成的网络，其中可以有特定的服务器专门用于精确的任务。\n\
  \n问题是，其中某些服务器并没有达到其容量利用率。例如，一个工资发放服务器在某些时间可能被频繁使用，但在其他时间可能几乎处于闲置状态。这似乎是资源的浪费。\n\n\
  如果系统管理员能够将所有这些机器的资源池化，然后根据需要分配这些资源将会怎样？她可以通过虚拟化来实现这一点。\n\n在其他时候，需要尚不存在且长期内并不需要的服务器。统计部门可能对某个大项目产生一次性的额外处理能力需求。设置一台专用服务器需要很长时间，而且为了一项一次性任务付出这种努力是很合理的。\n\
  \n如果系统管理员能够为特定任务轻松地创建和删除服务器，让它们在需要时以完全配置的形式出现，并在需求消失后消失，从而释放物理资源供其他用途将会怎样？他可以通过虚拟化来实现。\n\
  \n可以使用虚拟化创建物理服务器网络，其中每台服务器的物理资源被汇总在一起，然后根据管理员的指定分发。这就像是你不再拥有 10 台每个有 4 个处理器、8GB\
  \ RAM 和 100GB 物理磁盘存储的服务器，而是现在拥有一个具有 40 个处理器、80GB RAM 和 1TB 磁盘空间的巨大资源池。这些资源随后就可以被虚拟机使用。\n\
  \n`虚拟机 (VM)` 是运行在虚拟化层（通常称为虚拟机管理程序或 hypervisor）之上的计算机。它在运行定义的、离散的物理资源上运行的意义上并不是真实的，但它执行着与“真实”计算机相同的任务。虚拟机运行的虚拟化层为虚拟机定义了一组虚拟接口，这些接口在虚拟机的操作系统看来就像是真实的网卡、内存、硬盘等。在某种意义上，虚拟化欺骗了虚拟机中的客体操作系统，使其认为自己运行在虚拟化软件模拟的特定物理设备上，而虚拟化软件负责与实际硬件交互的细节，而这些细节甚至可以改变而不影响虚拟机。这被称为\
  \ `hardware emulation`（硬件仿真），有时缩写为 emulation。\n\n虚拟机是灵活的；它们分配的资源可以更改，在某些情况下不需要任何停机时间。可以根据需要快速创建虚拟机，并在不再需要时将其删除，使其曾经使用的资源重新回到池中。对于至关重要但通常很少资源的服务器，可以使用比池中任何物理服务器少得多的资源来创建。其他对于较大任务需要的服务器可能可以利用池中许多物理服务器的资源。\n\
  \n创建虚拟机并保存其镜像是可能的，这样每次创建虚拟机时，无需从安装操作系统开始，虚拟机启动时将带有完整的操作系统和已安装的程序，所有程序已配置好协同工作以完成所需的任务。一个不错的技巧是在本地运行一组服务器，然后从云计算池（如\
  \ Amazon 的 `EC2`、Ubuntu Enterprise Cloud（使用 Eucalyptus）、Ubuntu Cloud Infrastructure（使用\
  \ OpenStack）或 OpenStack）添加计算资源，以根据需要在其网络上启动虚拟机，在它们运行期间付费，然后删除它们（参见 第 33 章，“云中的 Ubuntu”）。这节省了大量的时间和金。\n\
  \n某些读者可能会想：“听起来很棒，但我只运行一台机器，而且是我的台式电脑（或笔记本电脑）。”虚拟化对你可能也有用。你是否曾经想过测试与你正在使用的不同的操作系统？也许你发现你需要运行一个只在\
  \ Windows 上运行的特定程序，但你的系统安装了 Ubuntu。也许你想要运行 Ubuntu 的最新开发版本以帮助进行测试，但你又不想将其作为你的主系统操作系统。你可能想尝试另一个\
  \ Linux 发行版甚至 BSD。在过去，做这些事情可能涉及对硬盘进行分区并并排安装两个操作系统。这种方法行得通，但你无法轻松地从一个系统移动数据到另一个，而且你不能同时运行两个操作系统。如果可以在同一台机器上作为客体运行另一个操作系统，那不是很好吗？通过虚拟化你可以做到。\n\
  \n虚拟化存在权衡，取决于所使用的软件。某些虚拟化软件作为另一个操作系统之上的额外层运行。如果你想在本地台式机上运行的同时测试某些东西，这太棒了，但在创建新服务器时可能会增加一些不必要的、有时无法接受的延迟。其他虚拟化软件运行在“裸金属”上或附近，这意味着虚拟化软件要么是操作系统内核的一部分，要么作为操作系统运行，且它与物理资源之间没有其他层。这种方法更快，但在桌面上并不那么方便，至少对于技术不是那么先进的用户来说是这样。\n\
  \n### KVM\n\n\n\n\n\n`Kernel-based Virtual Machine (KVM)` 是 Linux 内核的一部分。`KVM` 不执行硬件仿真，而仅提供底层任务。它需要第二层在用户空间中运行。这比在另一个操作系统之上用户空间运行整个虚拟化过程要快得多。`KVM`\
  \ 设计用于启用了 `VT-x` 或 `AMD-V` 扩展的处理器。在 Ubuntu 中，使用 `KVM` 管理虚拟机是通过使用 `libvert` 和 `QEMU`\
  \ 完成的。你可以通过安装并运行 `kvm-ok` 包来检查系统是否启用了这些扩展。这是一个简单的命令行工具，如果系统适用则输出 `0` 并退出，否则输出非 `0`。\n\
  \n首先从 Ubuntu 软件仓库安装以下软件包：`qemu-kvm`、`libvert-bin`、`virtinst` 和 `bridge-utils`：\n\
  \n- `qemu-kvm` 是 `KVM` 必要的用户空间组件。\n- `libvirt-bin` 是一个 C 工具包的二进制文件，用于与 Linux 的虚拟化能力进行交互，目前不仅支持\
  \ `KVM`，还支持 `XEN`、`VirtualBox` 等。\n- `virtinst` 是一组创建虚拟机的命令行工具。\n- `bridge-utils`\
  \ 是一组用于配置 Linux 以太网连接的实用程序。\n\n你可能想要添加 `virt-viewer`，它为虚拟机提供了良好的 GUI 和 VNC 接口，以及\
  \ `virt-manager`，它提供了一个管理虚拟机的良好 GUI。如果已安装，可以在应用程序的 Dash 列表中找到。\n\n注销并重新登录，以确保自动将你的用户添加到\
  \ `libvertd` 组的操作生效。\n\n默认情况下，使用 `KVM` 作为客机安装的任何操作系统都具有访问网络服务的权限，但对网络上的其他机器不可见。例如，它可以下载软件更新并浏览网页，但不能作为其他系统可访问的服务器运行。默认情况下，虚拟机接收\
  \ `10.0.2.0/24` 范围内的 IP 地址，并且从虚拟机内部可以使用 `10.0.2.2` 访问主机。这对于简单的用途，例如测试其他操作系统、使用 `scp`\
  \ 来回拷贝文件，或从主机到客机建立 `虚拟专用网络 (VPN)` 连接，应该是足够的。\n\n## 桥接网络\n\n如果你想更改网络设置以启用虚拟机作为外部可访问的服务器，你需要桥接网络。这允许虚拟机使用物理接口连接到外部网络，使得它们在网络其余部分看起来就像任何其他典型服务器。请注意，执行此操作时你不能使用默认的\
  \ Network Manager 来控制被桥接的硬件。此外，这仅适用于有线硬件而非无线硬件。如果你需要帮助理解这里使用的概念，请参见第 17 章，“网络](#ch17.html_ch17)”。\n\
  \n首先，安装 `libcap2-bin`。接下来，你需要通过设置 `cap_net_admin` 来赋予 `QEMU` 管理网络的能力。如果你是 64 位系统，请使用以下：\n\
  \n```bash\nmatthew@seymour:~$ sudo setcap cap_net_admin=ei /usr/bin/qemu-system-x86_64\n\
  ```\n\n如果你是 32 位系统，请使用这个：\n\n```bash\nmatthew@seymour:~$ sudo setcap cap_net_admin=ei\
  \ /usr/bin/qemu\n```\n\n然后，通过在 `/etc/network/interfaces` 中添加这些行创建一个名为 `br0` 的桥接接口，以使用\
  \ DHCP 或你想自行配置的网络设置：\n\n```text\nauto br0\niface br0 inet dhcp\n      bridge_ports\
  \ eth0\n      bridge_stp off\n      bridge_fd 0\n      bridge_maxwait 0\n```\n\n\
  通过输入以下命令重启网络：\n\n```bash\nmatthew@seymour:~$ sudo /etc/init.d/networking restart\n\
  ```\n\n最后，你需要创建使用此桥接网络的客机虚拟机。手动定义你的客操作系统使用新的 `br0` 接口，就像你通常在该操作系统中所做的那样。\n\n有几种方法可以创建用于\
  \ `KVM` 的虚拟机。一种方法是 `vmbuilder`。这是一个 Python 脚本，最适用于你打算在上面运行 Ubuntu JeOS 的服务器，JeOS\
  \ 是一种专门的、非常轻量的 Ubuntu 服务器变体，它包含一个经过优化的内核，仅包含作为虚拟服务器运行所需的基础元素，特别是在 `KVM` 和 `VMware`\
  \ 下。安装 `python-vm-builder` 来获取该包。你从命令行运行 `vmbuilder` 并带有两个必要的参数：虚拟化软件和你将运行的发行版。然而，可用的选项和自定义项非常多。这里有一个示例，使用\
  \ Ubuntu 11.04 (Natty Narwhal) 版本的 i386 架构的虚拟变体（例如 JeOS）为 `KVM` 构建一个虚拟机，同时覆盖之前的任何版本的虚拟机，并指示\
  \ `libvert` 通知本地虚拟化环境将生成的虚拟机添加到可用虚拟机列表中，给新虚拟机分配特定的 IP 地址、主机名 `lovelace` 并使用 `br0`\
  \ 桥接接口。呼！一个命令里有这么多内容：\n\n```bash\nmatthew@seymour:~$ sudo vmbuilder kvm ubuntu --suite\
  \ natty --flavour virtual --arch i386 -o --libvirt qemu:///system --ip 192.168.0.100\
  \ --hostname lovelace --bridge br0\n```\n\n你可以从帮助文件中学习更多信息：\n\n```bash\nmatthew@seymour:~$\
  \ vmbuilder kvm ubuntu --help\n```\n\n由于 `vmbuilder` 非常非常专业化，我们在这里专注于使用来自 `virtinst`\
  \ 的工具，因为它们更可能吸引普通观众。然而，如果你正在寻找运行在 `KVM` 或 `VMware` 安装上的服务器虚拟机，你绝对想更深入地探索 `vmbuilder`。不过，你可能不需要这样做。一组官方的、预构建的且受\
  \ Ubuntu 支持的虚拟机镜像可以从 [`cloud-images.ubuntu.com`](http://cloud-images.ubuntu.com)\
  \ 下载。这些是 Ubuntu 在 EC2 中使用的相同镜像。\n\n## 注意\n\nUbuntu Server 的开发者之一 Dustin Kirkland\
  \ 在一篇博文中概述了一种预设 Ubuntu Server 安装的方法，使过程更快。你可以在 [`blog.dustinkirkland.com`](http://blog.dustinkirkland.com)阅读它。\n\
  \n## virtinst 工具\n\n`virtinst` 由几个工具组成。我们在这里关注其中两个：`virt-install` 用于配置新的虚拟机；以及 `virt-clone`\
  \ 用于克隆虚拟机。你可以使用 `virt-install` 执行与 `vmbuilder` 类似的操作。主要区别在于可用的选项，以及 `virt-install`\
  \ 还可以创建包含 GUI 的桌面镜像，并可以使用 VNC 访问。关于 VNC 的讨论，请参见第 18 章，“使用 SSH 和 Telnet 进行远程访问](#ch18.html_ch18)”。\n\
  \n这里有一个示例：\n\n```bash\nmatthew@seymour:~$ sudo virt-install -n hopper -r 512 --disk\
  \ path=/var/lib/libvert/images/hopper.img,size=20 -c /dev/cdrom --accelerate --connect=qemu:///system\
  \ --vnc --nosole\n```\n\n在前面的示例中，我们发现了以下选项：\n\n- `-n hopper` 定义新虚拟机的名称。\n- `-r 512`\
  \ 指定分配给虚拟机的内存量，单位为兆。\n- `--disk path=...` 是虚拟磁盘的路径。它可以是文件、分区或逻辑卷。在这里我们在 `/var/lib/libvert/images`\
  \ 中创建一个 20GB 的 `hopper.img` 文件。\n- `-c /dev/cdrom` 是主机光驱设备设备路径。你也可以使用 ISO 文件。\n\
  - `--accelerate` 启用内核加速。\n- `--connect` 定义要使用的虚拟化程序。\n- `--vnc` 使用 VNC 虚拟控制台导出虚拟机。\n\
  - `--noconsole` 防止自动连接到虚拟机的控制台。\n- `-v` 创建完全虚拟化的虚拟机。\n\n要拷贝虚拟机，请使用 `virt-clone`：\n\
  \n```bash\nmatthew@seymour:~$ sudo virt-clone -o hopper -n knuth -f /var/lib/libvert/images/knuth.img\
  \ --connect=qemu:///system\n```\n\n在前面的示例中，我们发现了以下选项：\n\n- `-o hopper` 定义源或源虚拟机名称。\n\
  - `-n knuth` 定义新虚拟机的名称。\n- `-f` 定义新虚拟机使用的文件、分区或逻辑卷路径。\n- `--connect` 定义要使用的虚拟化程序。\n\
  \n\n\n\n\n```\nmatthew@seymour:~$ virsh -c qemu:///system start hopper\n```\n\n\
  要停止虚拟机，请使用以下命令：\n\n```\nmatthew@seymour:~$ virsh -c qemu:///system shutdown hopper\n\
  ```\n\n一旦虚拟机安装并运行，你就可以使用配置好的 IP 地址和 `ssh` 等工具连接到它。你也可以通过以下命令使用 GUI：\n\n```bash\n\
  matthew@seymour:~$ virt-viewer -c qemu:///system hopper\n```\n\n你可以通过连接到以下地址使用 GUI\
  \ 管理你的虚拟机：\n\n```bash\nmatthew@seymour:~$ virt-manager -c qemu:///system\n```\n\n\
  如果你感兴趣于使用 KVM 测试 Ubuntu 开发版本的简单方法，请参考第 35 章、“帮助 Ubuntu 测试与质量保证”以及关于 Test Drive 的讨论，Test\
  \ Drive 自动化了整个过程，包括下载特定的 Ubuntu ISO 文件。\n\n### VirtualBox\n\nVirtualBox 使用起来比 KVM\
  \ 容易得多，尤其是如果你只是想在 Ubuntu 之上运行第二个操作系统。它由 innotek GmbH 创建，后被 Sun Microsystems 收购，现在在收购\
  \ Sun 后由 Oracle 拥有并开发。VirtualBox 安装在另一个操作系统之上，因此对于对每个处理器周期都至关重要的计算密集型活动，它并不是理想选择。然而，对于测试或因为需要特定应用程序而运行另一个操作系统，它是棒的。VirtualBox\
  \ 可以运行在大多数 UNIX 类型的操作系统上，如 Linux、BSD 和 Mac OS X（也支持 Windows）。\n\nUbuntu 软件仓库中提供了一个版本的\
  \ VirtualBox，但但通常情况下，从 VirtualBox 网站下载是更好的主意。访问 [www.virtualbox.org/wiki/Downloads](http://www.virtualbox.org/wiki/Downloads)。从那里，你可以下载你可能使用的任何操作系统的版本，在\
  \ Linux 页面上包含一个 Ubuntu DEB 文件，它可以使用`高级软件包工具 (APT)` 进行安装，因此包管理不是问题。然而，这还让你快速方便地访问下载扩展包（extension\
  \ pack），该扩展包在 Ubuntu 仓库中是不可用的，并且可以快速方便地完成安装。扩展包添加了一些优秀但专有的功能，这些功能无法在主程序所使用的 GPL\
  \ 协议下提供，例如从 VirtualBox 中的客户虚拟机连接到主机计算机 USB 端口的能力。\n\n安装完成后，使用以下命令在命令行启动 VirtualBox：\n\
  \n```\nmatthew@seymour:~$ virtualbox\n```\n\n如果你希望关闭终端并保持 VirtualBox 运行，可以在命令后加上与符号（`&`）在后台运行\
  \ VirtualBox，例如：\n\n```bash\nmatthew@seymour:~$ virtualbox &\n```\n\n无论哪种方式，当你完成后，只需关闭\
  \ GUI 程序，VirtualBox 就会关闭。当你运行其中任何一个时，都会出现 GUI（参见图 32.1）。\n\n![Image](img/32fig01.jpg)\n\
  \n图 32.1 Oracle VM VirtualBox Manager。\n\n在这里，你可以通过选择左上角的“New”（新建）创建一个新虚拟机。通过选择“Settings”（设置）更改任何已安装虚拟机的设置。通过选择“Start”（启动）启动任何已安装虚拟机。通过选择“Discard”（删除）删除虚拟机。你可以使用右上角的“Details”（详情）查看当前选中虚拟机详情，或使用“Snapshots”（快照）查看现有虚拟机的已保存快照。一切都可以从\
  \ GUI 进行配置。VirtualBox 使用既简单又直观，即使对于完全初学者也是如此。\n\n通过 GUI，你可以克隆机器、导出它并将其导入到另一台运行 VirtualBox\
  \ 的机器上。提供了一个用于脚本编写的命令行界面，专注于虚拟机管理活动。你可以以无头模式运行 VirtualBox 并使用`远程桌面协议 (RDP)` 访问它。这些活动已超出了本书的范围，但对于想要远程运行虚拟机的人来说，可以让\
  \ VirtualBox 变得稍微有趣一点（尽管大多数花此精力的人可能可能会直接使用 KVM 并通过 VNC 连接到虚拟机）。\n\n### VMware\n\n\
  VMware 是一个面向企业的虚拟化平台。他们提供一个可以在桌面端免费运行的功能限制版本，并销售全功能版本。它运行良好，易于使用，并且功能比 VirtualBox\
  \ 更好。它还需要每年购买新许可证，而且许可证并不便宜。他们的企业服务器产品被许多人认为是业务领域最强大且功能最全的。VMware 运行在裸机上；它是安装在 VMware\
  \ 环境中所有服务器上的操作系统。然后，所有资源都从一个中心位置进行控制。虚拟机可以在运行时从系统中的一台物理机器移动到另一台，而不会丢失可用性且没有停机。这甚至可以根据管理员设置的标准（如带宽、可用内存或处理器负载）自动完成。其许可费用也相当昂贵。VMware\
  \ 主要设计供企业环境中的大型公司使用。它在这里值得被提及，但目标读者并不是本书的受众群体。\n\n### Xen\n\nXen 是一个广为人知的开源虚拟化平台。它被研究人员、爱好者、开发者和其他人士广泛使用。提供虚拟服务器的网络托管公司经常使用\
  \ Xen。通常情况下，Xen 安装在裸机上，就像 VMware 一样。也可以按照主机/客户方案安装在另一个操作系统之上。然而，2008 年，Ubuntu 决定不再支持\
  \ Xen。相反，Ubuntu 社区将精力集中在 KVM 上。这并不是说一个比另一个好的价值陈述，而是对于对于没有资源为两个相似平台提供高质量支持的 Ubuntu\
  \ 社区来说，KVM 似乎更合适。在 Ubuntu 上运行 Xen 是可能的，但没有保证。由于这个原因，如果倾向于 Xen，许多人选择使用 Xen 作为主要平台的\
  \ Linux 发行版，如 SUSE、Red Hat 或 CentOS。在本书编写期间，开始传言说 Ubuntu 将在不久的再次支持 Xen，但目前还没有可靠的消息。\n\
  \n#### 参考文献\n\n- [www.linux-kvm.org](http://www.linux-kvm.org)——KVM 的主页。\n- [www.virtualbox.org](http://www.virtualbox.org)——VirtualBox\
  \ 的主页。\n- [www.vmware.com](http://www.vmware.com)——VMware 的主页。\n- [www.xen.org](http://www.xen.org)——Xen\
  \ 的主页。\n\n\n\n\n为了实现这一计算机工程壮举，需要使用按需虚拟系统建立特殊的网络，这些系统仅在需要时消耗资源，并在未使用时将资源释放给他人使用。虚拟化是实现这一概念的技术。这可以通过本地第三方虚拟化平台如\
  \ `VMware`、`VirtualBox`、`Parallels` 等来实现（参见第 32 章）“Ubuntu 上的虚拟化”）。Ubuntu 还提供了另一个选项，即\
  \ Ubuntu Cloud，它将虚拟化扩展到云端，是本章的重点。除了作为一个出色的云托管平台外，Ubuntu Server 的开发还强烈意图使其成为一个出色的云客户。随着时间的推移，`Ubuntu\
  \ Cloud Guest`这一术语将越来越流行。\n\n## SysAdmin vs. DevOps\n\n维护系统运行的传统头衔是系统管理员（`administrator`）或\
  \ `sysadmin`（有时称为 `ops`，即运维）。创建运行在这些系统上的软件的人员，传统头衔是软件开发人员。在过去的几年里，出现了一个新头衔 `DevOps`。`DevOps`\
  \ 结合了系统管理员和开发人员的许多才能和职责，但通常侧重于云计算环境并有一些特定的改进。他们并非纯粹属于某一方，而且通常无法完美地归入“工程师”等其他现有类别，但他们确实结合了所有这些角色的许多技能，并增加了类似于\
  \ QA 的关注，以确保新功能不会破坏之前运行的任何内容。DevOps 人员开发运行在云资源上的大型应用程序，同时通过自动化和配置管理简化这些资源的编排。本章不仅针对\
  \ DevOps 人员，本章还描述了这些人可能喜欢的工具和环境。\n\nUbuntu Cloud（曾称为 `Ubuntu Enterprise Cloud (UEC)`）是\
  \ Canonical 提供的一系列应用程序，包含在 Ubuntu Server 版中。这些应用程序使得安装和配置基于 Ubuntu 的云变得简单。该软件是免费且开源的，但\
  \ Canonical 也提供付费的技术支持。\n\nUbuntu Cloud 起初基于 `Eucalyptus`。从 Ubuntu 11.10 开始，Ubuntu\
  \ Cloud 将基于 `OpenStack`。`OpenStack` 和 `Eucalyptus` 都受到 Ubuntu 和 Canonical 的支持，目前尚未宣布停止在包括\
  \ 10.04 LTS 在任何之前的 Ubuntu 版本中支持 `Eucalyptus`，因此预计它至少还将支持几年，直到这些版本达到生命终点。然而，精力和关注已转向\
  \ `OpenStack`。在编写本文时，如果您是为了测试或临时使用以外的任何目的创建云部署，目前可能希望考虑使用 Ubuntu 10.04 LTS。它将一直支持服务器到\
  \ 2015 年 4 月，而 11.10 只支持服务器 18 个月，这意味着您需要更早升级。本章涵盖了 `Eucalyptus` 和 `OpenStack`。\n\
  \n> 注意：`Ubuntu Enterprise Cloud (UEC)` 绑定 10.04 LTS 和 `Eucalyptus`。随着从 11.10 开始转向\
  \ `OpenStack`，未来的名称将变为 `Ubuntu Cloud` 或 `Ubuntu Cloud Infrastructure`。\n\n## 为什么用云？\n\
  \n企业和机构多年来一直在计算机网络。有很多原因，但通常构建网络是因为使用多台计算机可以让特定的计算或数据处理任务变得更简单、更快。网络的大小通常取决于需要完成的任务。构建网络通常涉及对需求进行详细调查、分析这些需求，并收集必要的硬件和软件以满足当前需求，并在资金允许的情况下可能留出一些增长空间。\n\
  \n云计算旨在通过在互联网上提供计算能力和存储等资源服务来使变得更容易，这些服务易于远程访问、按需可用、易于配置和扩展并具有高度动态性。在理想情况下，这既节省时间又省钱。硬件、存储、网络和软件被抽象为服务，而不是手动构建和配置，然后在需要额外资源时按需本地访问。有时这些抽象被称为\
  \ `基础设施即服务 (IAAS)`、`平台即服务 (PAAS)` 和 `软件即服务 (SAAS)`。\n\n一些最大的优势是：可以轻松地向云中添加新资源、大型服务器池内置冗余带来的固有的容错能力，以及仅在资源资源时计费的支付计划。将过程中的复杂性抽象化也有一个巨大的好处；客户端执行他们想要执行的任务，而云计算平台负责根据需要添加资源的细节，而最终用户感知不到这一过程。`虚拟机\
  \ (VMs)` 在需要时被创建和使用，并在不再需要时立即销毁，释放系统资源供其他用途。\n\n## Ubuntu Cloud 和 Eucalyptus\n\n\
  基于 Ubuntu 10.04 LTS 的 Ubuntu Cloud 主要基于 `Eucalyptus`，`Eucalyptus` 是一种 GPL 软件，旨在提供云计算和云存储平台，这些平台既是免费的（自由上的自由和价格上的免费），又完全兼容\
  \ Amazon 的 EC2 云计算和 S3 云存储平台。`Eucalyptus` 服务通过与 EC2/S3 兼容的`应用程序接口 (APIs)` 可用，因此为\
  \ `Amazon Web Services (AWS)` 编写的客户端工具也可以用于 `Eucalyptus`。\n\n基于 10.04 LTS 和 `Eucalyptus`\
  \ 的 Ubuntu Enterprise Cloud 由几个组件组成。我们从节点（node）开始，节点是一个能够运行基于内核的虚拟机 (KVM) 作为其虚拟机管理程序的服务器。虚拟机程序是一种允许在单台硬件上运行多个虚拟机的软件，它为每个虚拟机提供一个虚拟平台并监控虚拟机的性能、资源使用和需求。这允许多个操作系统共享硬件资源。其他虚拟机程序可用，例如\
  \ `Xen`，但 Ubuntu 选择了 `KVM` 作为默认选项。\n\n后续组件是节点控制器 (NC) 和集群控制器 (CC)。`NC` 运行在每个节点上并控制该节点上的所有虚拟机。`NC`\
  \ 运行在主机操作系统及其上方的 `CC` 之间，充当中间人，查询操作系统以发现可用资源以及该节点上运行的虚拟机状态和数量，并将这些信息报告给 `CC`。然后\
  \ `CC` 管理运行在该节点和其他节点上的实例的网络，并确保云控制器 (CLC) 获取这些信息。\n\n`CLC` 是整个云的主前端。它为客户端服务提供 API\
  \ 并处理所有请求和响应，在客户端工具和 Ubuntu Cloud 组件之间通过 Web 服务通信。`CLC` 还提供了管理基础设施部分的 Web 界面。这是监控资源可用性的地方。界面还有两个控制器：存储控制器\
  \ (SC) 和 Walrus 存储控制器 (WS3)。`SC` 提供创建持久存储设备的方法，类似于 Amazon 的弹性块存储 (EBS) 设备，这些设备是与云实例分离创建的块存储设备，并旨在高可靠性、高可用性和可访问。`WS3`\
  \ 是一个简单的存储服务，使用与 Amazon S3 API 兼容的 REST 和 SOAP API，用于存储虚拟机镜像、快照以及存储和提供文件。\n\n这个高度复杂的系统在图\
  \ 33.1 中所示。\n\n\n\n\n![Image](img/33fig01.jpg)\n\n图 33.1 一个 Ubuntu 云。\n\n## 部署/安装基础：公有云还是私有？\n\
  \n基于 Eucalyptus 部署 Ubuntu Cloud 有两种方式：在私有云上或在公有云上。两者各有优缺点。本节将介绍选择时需要考虑的因素。我们还将探讨一种将两者结合的方法。\n\
  \n公有 Ubuntu 云构建在 Amazon 的 `EC2` 之上。这意味着你的本地硬件要求极低，启动成本低，部署快速且易于扩展。这对于测试非常有用，但对于生产环境可能不是一个好主意。这种工作方式的缺点是，你无法从物理上控制运行云的硬件。对于许多人来说，这是一个优点，但可能不适用于高安全性需求。虽然你独立控制着公有云上的软件和进程，但可能有人担心谁能访问这些机器。虽然如果\
  \ Amazon 的数据中心和机器不安全，它们将无法长久，但某些应用程序和数据极其敏感，你无法无法承担任何外部风险的代价。法律限制（例如来自《萨班斯-奥克斯利法案》）有时会迫使组织做出\
  \ IT 策略决策，并使公有选项变得不可。在 `EC2` 上运行 Eucalyptus 已证明对许多人来说性能不如人意，因此，对于轻流量测试之外的任何用途，这不是最佳选择。\n\
  \n私有 Ubuntu 云创建于你拥有并控制的硬件上。这需要大量的初期投入，但你可以获得将所有内容运行在公司防火墙后的后的安全性，并且完全了解谁能够物理上访问你的机器，以及谁在网络上监听。\n\
  \n需要考虑的一点是可以先将 Ubuntu 云作为私有云启动，然后从那里创建指向公共服务的接口。也许你更倾向于将所有数据存储在私有云上，但想在公有云上使用某些服务和应用程序。如果你的公司既有“必须安全并在内部持有”又有“我们仍希望避开窥探，但如果发生了什么，不会是灾难性的”的需求，那么这是一个值得探索的途径。这种方法的大问题是在公有服务器和私有服务器之间移动数据；如果你有大量数据，这可能是无法负担的。一如既往，请进行你的尽职调查。\n\
  \n## 公有\n\n在 Amazon 服务器上部署公有云既快速又简单。首先，访问 [`aws.amazon.com/`](http://aws.amazon.com/)\
  \ 并注册账户。然后，登录登录后进入“我的账户”（Your Account）、安全凭据（Security Credentials），定义安全设置以管理和访问你的服务。\n\
  \n接下来，你需要一个工具来启动和停止实例。有很多此类工具，但我们关注两个。一个是 `Euca2ools`，它是 Eucalyptus 提供的一系列命令行工具，通过\
  \ Web 服务与 Amazon `EC2` 和 `S3` 服务交互。这些工具是 Ubuntu Server 默认安装的；你可以通过“参考文献”部分提供的链接在\
  \ `Euca2ools` 用户指南中了解更多关于其用法的信息。我们将在本章稍后的部分介绍 `Euca2ools` 的基本命令。另一个工具是 Canonical\
  \ 提供的付费服务，名为 `Landscape`。它提供了一个基于 Web 的图形用户界面 (GUI)，用于与 Amazon 云服务交互并管理你的 Ubuntu\
  \ 云。它同时支持 Amazon 上的公有部署和自有设备上的私有安装。Canonical `Landscape` 网站的链接也位于“参考文献”部分中。\n\n\
  工具就绪后，你使用它来选择并启动你的机器实例。你之后也将使用此工具来管理实例。许多 Ubuntu VM 镜像已经发布到 Amazon `EC2`，并可以立即用于部署。你可以在\
  \ [`cloud-images.ubuntu.com`](http://cloud-images.ubuntu.com) 中感兴趣的特定 Ubuntu 发布版本下找到列表。\n\
  \n最后一步是访问你的实例，以设置你想要在云上提供的应用程序。你将使用前面提到的工具来管理你的云。\n\n## 私有\n\n在自己的机器上安装 Ubuntu Cloud\
  \ 要复杂得多，尽管需求相同。在 Amazon 的服务器上部署时，大部分复杂性都由 Amazon 处理。在开始之前，请检查你是否拥有所需的硬件。至少你需要两台服务器。一台作为前端，你需要一个或多个节点。\n\
  \n对于前端，或任何运行这些系统中的一个或多个的系统——`CLC`、`CC`、`WS3/SC`——必须满足 表 33.1 所示的基本要求。\n\n### 表 33.1\
  \ CLC, CC, WS3 和 SC 的基本要求\n\n![Image](img/33tab01.jpg)\n\n对于运行节点控制器（node controller）和实例的节点，你需要满足\
  \ 表 33.2 所示的要求。\n\n### 表 33.2 节点控制器和实例的要求\n\n![Image](img/33tab02.jpg)\n\n当你确认设备符合或超过要求后，从\
  \ [`releases.ubuntu.com/`](http://releases.ubuntu.com/) 下载 Ubuntu Server 安装磁盘，并点击你想要使用的发布版本（例如\
  \ 10.04 LTS）。确保你下载的是服务器安装 CD。将其刻录到磁盘中。\n\n启动时，选择“Install Ubuntu Enterprise Cloud”（安装\
  \ Ubuntu 企业云）。安装程序会检查并检测是否存在 Eucalyptus 云。由于目前不存在，你至少需要安装 `CLC`。如果这是唯一的后端系统并将运行所有服务，请确保包含\
  \ `WS3`、`CC` 和 `SC` 组件。会被要求命名你的集群并提供 Ubuntu 云 可以使用并分配给实例的 IP 地址范围。通常是 `192.168.1.125`\
  \ 到 `192.168.1.240`。允许安装完成。\n\n要安装节点控制器，确保你打算作为节点的系统已连接到运行 `CLC` 的网络。逐一引导服务器安装 CD\
  \ 并再次选择 Ubuntu Cloud。它应该检测到集群并为你预选节点。确认并完成安装。当节点重启时，它已准备好注册。\n\n节点注册应该是自动的，包括交换安全外\
  \ (SSH) 密钥、正确配置服务、向云的其他部分发布它们的存在、运行对应版本的 `uec-component-listener` 以及验证注册。如果你发现失败，手动执行这些步骤的说明可以在\
  \ [`help.ubuntu.com/community/UEC/CDInstall`](https://help.ubuntu.com/community/UEC/CDInstall)\
  \ 获取。\n\n\n\n\n```bash\nmatthew@seymour:~$.euca$ ln -s ~/.euca/eucarc ~/.eucarc\n\
  ```\n\n接下来，你需要在服务器上设置 EC2 API 和 AMI 工具。检查是否已安装了 `euca2ools` 包。如果是，你可以通过这种方式获取本地集群的可用性详情：\n\
  \n```bash\nmatthew@seymour:~$.euca/eucarc$ euca-describe-availability-zones verbose\n\
  \nAVAILABILITYZONE   myowncloud              192.168.1.1\nAVAILABILITYZONE   |-\
  \ vm types             free / max    cpu    ram  disk\nAVAILABILITYZONE   |- m1.small\
  \             0004 / 0004   1     192     2\nAVAILABILITYZONE   |- c1.medium   \
  \         0004 / 0004   1     256     5\nAVAILABILITYZONE   |- m1.large        \
  \     0002 / 0002   2     512     10\nAVAILABILITYZONE   |- m1.xlarge          \
  \  0002 / 0002   2     1024    20\nAVAILABILITYZONE   |- c1.xlarge            0001\
  \ / 0001   4     2048    20\n```\n\n如果一切看起来正常，你就可以开始安装镜像了。最简单的方法是通过 Web 界面从商店进行。像之前一样通过\
  \ `https://<cloud-controller-ip-address>:8443/` 访问界面，这次点击“Store（商店）”选项卡。你将看到一个可以下载和安装的可用镜像列表。这里提供了有关如何运行镜像的信息。\n\
  \n要从命令行运行镜像，你首先需要创建一个密钥对，以便以 root 身份登录该实例。以下是实现此点的简单方法：\n\n```bash\nif [ ! -e ~/.euca/secretkey.priv\
  \ ]; then\n    mkdir -p -m 700 ~/.euca\n    touch ~/.euca/secretkey.priv\n    chmod\
  \ 0600 ~/.euca/secretkey.priv\n    euca-add-keypair secretkey > ~/.euca/secretkey.priv\n\
  fi\n```\n\n你可以为密钥命名任何你喜欢的名称，如果你忘记了哪些密钥，可以运行 `euca-describe-keypairs` 来获取系统中存储的已创建密钥列表。然后，你需要使用以下命令允许访问每个实例的\
  \ 22 端口：\n\n```bash\nmatthew@seymour:~$.euca/eucarc$ euca-authorize default -P tcp\
  \ -p 22 -s 0.0.0.0/0\n```\n\n然后你可以使用以下命令创建你注册镜像的实例：\n\n```bash\nmatthew@seymour:~$.euca/eucarc$\
  \ euca-run-instances $EMI -k mykey -t m1.small\n```\n\n你可能拥有同一个镜像的多个实例。第一次运行实例时，系统需要一段时间来启动，因为它正在建立镜像缓存。虚拟机镜像很大。你可以使用以下命令观察是否已启动：\n\
  \n```bash\nmatthew@seymour:~$.euca/eucarc$ watch -n5 euca-describe-instances\n```\n\
  \n当状态从 `pending（等待中）` 变为 `running（运行中）` 时，记录分配给实例的 IP 地址，并使用以下命令进行连接：\n\n```bash\n\
  matthew@seymour:~$.euca/eucarc$ IPADDR=$(euca-describe-instances | grep $EMI | grep\
  \ running | tail -n1 | awk '{print $4}')\nmatthew@seymour:~$.euca/eucarc$ ssh -i\
  \ ~/.euca/mykey.priv ubuntu@$IPADDR\n```\n\n完成后，你可以退出 SSH 连接并终止实例，方法如下：\n\n```bash\n\
  matthew@seymour:~$.euca/eucarc$ IPADDR=$(euca-describe-instances | grep $EMI | grep\
  \ running | tail -n1 | awk '{print $4}')\n```\n\n\n\n\n\n- `nova-api`: API 服务器提供了一个接口，允许外部系统与云基础设施进行交互。\n\
  - `rabbit-mq`: 消息队列服务器，通过异步调用与其他 Nova 组件（如调度器或网络控制器）进行通信。\n- `nova-compute`: 计算节点的宿主机实例。它们根据从消息队列收到的请求执行操作。实例根据调度器管理的调度算法部署在可用的计算节点上。\n\
  - `nova-network`: 网络控制器负责为计算节点分配 IP 地址、配置 VLAN、配置网络并实现安全组（security groups）。\n- `nova-volume`:\
  \ 卷工作节点（volume worker）管理基于`逻辑卷管理器 (LVM)` 的存储卷。它们负责创建和删除卷、在实例上挂载和卸载存储卷，并为实例提供持久化存储。\n\
  - `nova-scheduler`: 调度器使用可调算法从可用资源池中确定应该使用哪些计算、网络或存储卷服务器。调度策略可以根据服务器负载、可用区或随机概率进行配置。\n\
  \n## 存储基础设施 (Swift)\n\nSwift 是一个对象存储系统。它可以扩展到多个 PB 级和数十亿对象。它是弹性的，具有内置冗余和故障转移机制。Swift\
  \ 设计用于存储分布在通用硬件上的大量对象。\n\n## 镜像服务 (Glance)\n\nGlance 是一个虚拟机镜像的查找和检索系统。它可以使用三个后端之一：OpenStack\
  \ 对象存储、S3 存储，或使用 OpenStack 对象存储作为中间节点的 S3 存储。\n\n## 安装\n\n在这个简单的示例中，我们使用了三台物理机器。之前提到的所有组件都运行在\
  \ Server 1 上，但计算节点由 Server 2 表示。第三台机器是客户端（Client），用作管理一切的人机界面。对于此示例，我们使用表 33.3 所示的设置。\n\
  \n表 33.3 基础 OpenStack 安装设置\n\n![Image](img/33tab03.jpg)\n\n### 准备 Server 1\n\n从\
  \ 64 位 Ubuntu 11.10 服务器光盘启动物理机器。从菜单中选择“Install Ubuntu Server”并继续基础安装，同时使用本节后续提到的特定定制进行进行。我们将在设置好基础环境后，在过程的后期安装\
  \ Glance 和 Nova 软件包。\n\n选择手动分区硬盘的选项，并创建一个足够大的专用分区，用于容纳网络所需的任何及所有存储（通过 `nova-volume`），并将分区类型设置为\
  \ Linux LVM。使用专用分区来存储这些数据将便于日后通过添加额外资源进行扩展。\n\n创建名为 `localadmin` 的第一个用户。\n\n你需要了解此安装程序将要运行的网络详细信息。使用这些信息设置第一个接口的\
  \ IP 地址。\n\n在安装过程的 Packages 菜单中，仅安装 `openssh-server`。\n\n安装完成后，在 `/etc/apt/sources.list`\
  \ 中启用 Universe 存储库，更新软件包列表并升级所有已安装的软件包：\n\n```\nlocaladmin@turing:~$ sudo apt-get\
  \ update\n\nlocaladmin@turing:~$ sudo apt-get upgrade\n```\n\n安装 `bridge-utils`：\n\
  \n```\nlocaladmin@turing:~$ sudo apt-get install bridge-utils\n```\n\n重启服务器并以 `localadmin`\
  \ 身份登录。\n\n将以下内容替换到 `/etc/network/interfaces`：\n\n```\nauto lo\niface lo inet loopback\n\
  \nauto eth0\niface eth0 inet static\naddress 10.10.10.2\nnetmask 255.255.255.0\n\
  broadcast 10.10.10.255\ngateway 10.10.10.1\ndns-nameservers 10.10.10.100\n\nauto\
  \ br100\niface br100 inet static\nbridge_ports eth1\nbridge_stp off\nbridge_maxwait\
  \ 0\nbridge_fd 0\naddress 192.168.3.1\nnetmask 255.255.0.0\nbroadcast 192.168.255.255\n\
  ```\n\n重启网络：\n\n```\nlocaladmin@turing:~$ sudo /etc/init.d/networking restart\n\
  ```\n\n由于此台服务器将作为所有节点的 `网络时间协议 (NTP)` 服务器，我们希望它能与官方 NTP 服务器同步。安装 NTP 服务器：\n\n```\n\
  localadmin@turing:~$ sudo apt-get install ntp\n```\n\n通过确保 `/etc/ntp.conf` 中包含以下两行，使其在未连接互联网时也能提供服务：\n\
  \n```\nserver 127.127.1.0\nfudge 127.127.1.0 stratum 10\n```\n\n重启 NTP 服务使更改生效：\n\
  \n```\nlocaladmin@turing:~$ sudo /etc/init.d/ntp restart\n```\n\n安装 Glance：\n\n\
  ```\nlocaladmin@turing:~$ sudo apt-get install glance\n```\n\n安装 MySQL Server：\n\
  \n```\nlocaladmin@turing:~$ sudo apt-get install -y mysql-server\n```\n\n配置 MySQL。首先，编辑\
  \ `/etc/mysql.my.cnf` 将 `bind` 地址更改为：\n\n```\nbind-address = 0.0.0.0\n```\n\n重启\
  \ MySQL 服务器：\n\n```\nlocaladmin@turing:~$ sudo restart mysql\n```\n\n在这些步骤中将 `secretpassword`\
  \ 替换为你的 MySQL 密码。如果你在安装 MySQL 时没有设置密码，请现在设置：\n\n```\nlocaladmin@turing:~$ mysqladmin\
  \ -u root password secretpassword\n```\n\n创建一个名为 `nova` 的数据库：\n\n```\nlocaladmin@turing:~$\
  \ mysql -u root -p \"CREATE DATABASE nova;\"\n```\n\n赋予 `root` 用户所有权限：\n\n```\n\
  localadmin@turing:~$ mysql -u root -p \"GRANT ALL PRIVILEGES ON nova.* TO 'root'@'%'\
  \ WITH OPTION;\"\n```\n\n安装 `nova` 组件：\n\n```\nlocaladmin@turing:~$ sudo apt-get\
  \ install rabbitmq-server nova-common nova-api nova-network nova-volume nova-objectstore\
  \ nova-scheduler glance-api glance-registry\n```\n\n\n\n\n\n```bash\nlocaladmin@turing:~$\
  \ sudo nova-manage user admin novaadmin\n```\n\n创建一个名为 `proj` 的项目：\n\n```bash\n\
  localadmin@turing:~$ sudo nova-manage project create proj novaadmin\n```\n\n创建一个目录来下载\
  \ nova 凭据，并下载 ZIP 文件：\n\n```bash\nlocaladmin@turing:~$ mkdir /home/localadmin/creds\n\
  ```\n\n生成并保存访问和管理 `nova` 云所所需的凭据：\n\n```bash\nlocaladmin@turing:~$ sudo nova-manage\
  \ project zipfile proj novaadmin\n```\n\n`/home/localadmin/creds/novacreds.zip`\n\
  \n你需要使用 `novacreds.zip` 文件来运行 `euca2ools`。它必须被复制到任何你想运行 `euca2ools` 命令的机器上。在这里，我们使用\
  \ Server 1 来演示此过程，但你需要将这些凭据复制到任何其他要运行 `euca2ools` 管理该云的机器上，并遵循接几个步骤。\n\n进入 `creds`\
  \ 文件夹并解压 `.zip` 内容：`cacert.pem`、`cert.pem`、`novarc` 和 `pk.pem`。\n\n```bash\nlocaladmin@turing:~$\
  \ cd /home/localadmin/creds\nlocaladmin@turing:~$ unzip novacreds.zip\nlocaladmin@turing:~$\
  \ sudo chown localadmin:localadmin /home/localadmin/creds/ -R\n```\n\n`novarc` 文件包含了环境变量，在使用某些\
  \ `euca2ools` 命令之前必须识别这些变量。通过源化该文件来设置它们：\n\n```bash\nlocaladmin@turing:~$ source\
  \ /home/localadmin/creds/novarc\n```\n\n重启所有与 `nova` 相关的服务：\n\n```bash\nlocaladmin@turing:~$\
  \ sudo /etc/init.d/libvirt-bin restart; sudo restart nova-network;\nsudo restart\
  \ nova-compute; sudo restart nova-api; sudo restart nova-objectstore; sudo restart\
  \ nova-scheduler; sudo restart nova-volume; sudo restart glance-api; sudo restart\
  \ glance-registry\n```\n\n确认凭据已应用且 `nova` 设置恰当：\n\n```bash\nlocaladmin@turing:~$\
  \ euca-describe-availability-zones verbose\n```\n\n如下所示的将确认安装成功：\n\n```\nAVAILABILITYZONE\
  \  nova available\nAVAILABILITYZONE  |- server1\nAVAILABILITYZONE  | |- nova-compute\
  \ enabled : -) 2011-08-13 12:32:50\nAVAILABILITYZONE  | |- nova-scheduler enabled\
  \ : -) 2011-08-13 12:32:48\nAVAILABILITYZONE  | |- nova-network enabled : -) 2011-08-13\
  \ 12:32:49\nAVAILABILITYZONE  | |- nova-volume enabled : -) 2011-08-13 12:32:49\n\
  ```\n\n最后一个任务是安装和设置 Nova/OpenStack dashboard，这是一个用于运管理的 Web 界面。\n\n先安装 Bazaar，以便从\
  \ Launchpad 下载所需的软件：\n\n```bash\nlocaladmin@turing:~$ sudo apt-get install -y bzr\n\
  localadmin@turing:~$ sudo easy-install virtualenv\n```\n\n从 Launchpad 匿名检出当前的 OpenStack\
  \ dashboard 代码：\n\n```bash\nlocaladmin@turing:~$ sudo bzr init-repo .\nlocaladmin@turing:~$\
  \ sudo bzr branch lp:openstack-dashboard -r 46 /opt/osdb\nlocaladmin@turing:~$ cd\
  \ /opt/osdb\nlocaladmin@turing:~$ sudo sh run_tests s.sh\nlocaladmin@turing:~$ cd\
  \ openstack-dashboard\n```\n\n编辑 `/opt/osdb/openstack-dashboard/local/localsettings.py`\
  \ 以包含连接到 `nova-api` 所需的细节。安装详情可以在之前创建的 `novarc` 文件中找到，并且与这些内容不同，特别是密钥：\n\n```python\n\
  NOVA_DEFAULT_ENDPOINT = 'http://localhost:8773/services/Cloud'\nNOVA_DEFAULT_REGION\
  \ = 'nova'\nNOVA_ACCESS_KEY = 'b6a7e3ca-f894-473b-abca-84329d9829fa:proj'\nNOVA_SECRET_KEY\
  \ = '2d61a361-965a-4ed6-966a-d9f543b42531'\nNOVA_ADMIN_USER = 'novaadmin'\nNOVA_PROJECT\
  \ = 'proj'\n```\n\n为了让 dashboard 发送通知邮件，需要配置 `简单邮件传输协议 (SMTP)` 服务器。我们现在就这一点。\n\n\
  进一步编辑 `/opt/osdb/openstack-dashboard/local/localsettings.py` 以包含连接到你的邮件服务器所需的细节，根据需要进行自定义：\n\
  \n```python\nEMAIL_HOST = 'turing.example.com'\nEMAIL_PORT = 25\nEMAIL_USER = \n\
  EMAIL_PASSWORD =\nEMAIL_USE_TLS = 'True'\n```\n\n为 dashboard 创建数据库。当收到提示时，提供为为 dashboard\
  \ 创建的管理员账户所需的名称、电子邮件和密码：\n\n```bash\nlocaladmin@turing:~$ sudo tools/with_venv.sh\
  \ dashboard/manage.py syncdb\n```\n\n启动默认的 `python-django` 服务器，指定你想让 dashboard 可用的端口。在此示例中，我们使用端口\
  \ 8000：\n\n```bash\nlocaladmin@turing:~$ sudo tools/with_venv.sh dashboard/manage.py\
  \ runserver 8000\n```\n\n\n\n\n下载之前创建的凭据，以便在此台机器上使用 `euca2ools`：\n\n```bash\nlocaladmin@watson:~$\
  \ mkdir /home/localadmin/creds\nlocaladmin@watson:~$ cd /home/localadmin/creds\n\
  localadmin@watson:~$ scp localadmin/home/localadmin/creds/novacreds.zip\nlocaladmin@watson:~$\
  \ unzip creds.zip\n```\n\n挂载 `novarc` 文件并测试与 API 服务器的连接：\n\n```bash\nlocaladmin@watson:~$\
  \ source novarc\nlocaladmin@watson:~$ euca-describe-availability-zones verbose\n\
  ```\n\n输出结果与我们配置 Server 1 时类似：\n\n```\nAVAILABILITYZONE  nova available\nAVAILABILITYZONE\
  \  |- server1\nAVAILABILITYZONE  | |- nova-compute enabled : -) 2011-08-13 12:32:50\n\
  AVAILABILITYZONE  | |- nova-scheduler enabled : -) 2011- 08-13 12:32:48\nAVAILABILITYZONE\
  \  | |- nova-network enabled : -) 2011-08-13 12:32:49\nAVAILABILITYZONE  | |- nova-volume\
  \ enabled : -) 2011-08-13 12:32:49\n```\n\n### 创建镜像\n\n在 Client 1 上创建一个原始（raw）镜像。这代表了\
  \ VM 的主硬盘，因此请确保为其分配足够的空间：\n\n```bash\nlocaladmin@watson:~$ kvm-img create -f raw\
  \ server.img 5G\n```\n\n下载你想要安装的操作系统的 ISO 文件。本示例使用 Ubuntu：\n\n```bash\nlocaladmin@watson:~$\
  \ wget http://releases.ubuntu.com/oneric/ubuntu-11.10-server-amd64.iso\n```\n\n\
  使用 OS 安装程序程序 ISO 启动 KVM 实例以开始安装。这里的最后一个选项在端口 `0` 上设置了 `虚拟网络计算 (VNC)` 显示，我们用它通过 VNC\
  \ 连接到 VM：\n\n```bash\nlocaladmin@watson:~$ sudo kvm -m 256 -cdrom ubuntu-11.04-server-amd64.iso\
  \ -drive file=server.img,if=scsi,index=0 -boot d -net nic -net user -nographic ~-vnc\
  \ :0\n```\n\n使用 VNC 连接到 VM。在这种情况下，`10.10.10.4` 是 Client 的 IP 地址：\n\n```bash\nlocaladmin@watson:~$\
  \ vncviewer 10.10.10.4 :0\n```\n\n在安装期间，创建一个挂载在 `/` 的单个 `ext4` 分区。不需要交换分区（swap）。安装完成后，重新启动\
  \ VM：\n\n```bash\nlocaladmin@newmachine:~$ sudo kvm -m 256 -drive file=server.img,if=scsi,index=0,boot=on\
  \ -boot c -net nic -net user -nographic -vnc :0\n```\n\n添加所有你想要安装的包。至少更新任何默认包并安装\
  \ SSH：\n\n```bash\nlocaladmin@newmachine:~$ sudo apt-get update\nlocaladmin@newmachine:~$\
  \ sudo apt-get upgrade\nlocaladmin@newmachine:~$ sudo apt-get install openssh-server\
  \ cloud-init\n```\n\n从 `/etc/udev/rules.d` 移除网络持久化规则，因为它们会导致网络接口使用非预期的 `eth0` 名称进行启动：\n\
  \n```bash\nlocaladmin@newmachine:~$ sudo rm -rf /etc/udev/rules.d/70-persistent-net.rules\n\
  ```\n\n关闭 VM。从 Client 端，我们将新 VM 上传到 OpenStack，它需要一个 `ext4` 镜像。我们现在对其进行提取：\n\n```bash\n\
  localadmin@watson:~$ sudo losetup -f server.img\nlocaladmin@watson:~$ sudo losetup\
  \ -a\n```\n\n这将为你提供如下输出：\n\n```\n/dev/loop0: [0801]:16908388 ($filepath)\n```\n\n\
  注意回环设备的名称（此处为 `/dev/loop0`）。使用该名称找到分区的起始扇区：\n\n```bash\nlocaladmin@watson:~$ sudo\
  \ fdisk -cul /dev/loop0\n```\n\n这将为你提供如下输出：\n\n```\nDisk /dev/loop0: 5368 MB, 5368709120\
  \ bytes\n149 heads, 8 sectors/track, 8796 cylinders, total 10485760 sectors\nUnits\
  \ = sectors of 1 * 512 = 512 bytes\nSector size (logical/physical): 512 bytes /\
  \ 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisk identifier:\
  \ 0x00072bd4\nDevice      Boot Start  End       Blocks  Id System\n/dev/loop0p1\
  \ *   2048         10483711 5240832 83 Linux\n```\n\n注意 `/dev/loop0p1` 分区的起始扇区。将此数字乘以\
  \ 512，以获得字节偏移量的正确值（2048 x 512 = 1048576）。\n\n卸载 `loop0` 设备：\n\n```bash\nlocaladmin@watson:~$\
  \ sudo losetup -d /dev/loop0\n```\n\n```现在使用偏移量值仅挂载 `loopp1` 分区：\n\n```bash\nlocaladmin@watson:~$\
  \ sudo losetup -o 1048576 server.img\nlocaladmin@watson:~$ sudo losetup -a\n```\n\
  \n这将为你提供如下输出：\n\n```\n/dev/loop0: [0801]:16908388 ($filepath) offset 1048576\n```\n\
  \n注意设备的挂载点。将整个分区拷贝到新新文件中：\n\n```bash\nlocaladmin@watson:~$ sudo dd if=/dev/loop0\
  \ of=serverfinal.img\n```\n\n这为我们提供了所需的 `ext4` 文件系统镜像，`serverfinal.img`。\n\n卸载 `loop0`\
  \ 设备：\n\n```bash\nlocaladmin@watson:~$ sudo losetup -d /dev/loop0\n```\n\n为了使此镜像适用于作为云实例，我们需要调整\
  \ `/etc/fstab`，因为 `nova-compute` 可能会在启动实例时调整磁盘大小。这可能会导致磁盘的通用唯一标识符 (UUID) 失效。相反，我们使用文件系统标签来标识分区。\n\
  \n回环 `serverfinal.img`：\n\n```bash\nlocaladmin@watson:~$ mount -o loop serverfinal.img\
  \ /mnt\n```\n\n在 `fstab` 中，你会看到类似的内容：\n\n```\nUUID=e7f5af8d-5d96-45cc-a0fc-d0d1b2f31c\
  \ / ext4 errors=remount-ro 0 1\n```\n\n这需要替换为以下：\n\n```\nLABEL=ucafrootfs / defaults\
  \ 0 0\n```\n\n现在从 `/mnt/boot` 将内核和 `initrd` 镜像拷贝到 `/home` 目录。这些在创建并上传完整的虚拟镜像到 OpenStack\
  \ 时使用：\n\n```bash\nlocaladmin@watson:~$ cp /mnt/boot/vmlinuz-2.6.38-7-server /home\n\
  localadmin@watson:~$ cp /mnt/boot/initrd.img-2.6.38-7-server /home\n```\n\n卸载 `loop`\
  \ 分区：\n\n```bash\nlocaladmin@watson:~$ umount /mnt\n```\n\n更改 `serverfinal.img`\
  \ 的文件系统标签为 `ucafrootfs`：\n\n```bash\nlocaladmin@watson:~$ sudo tune2fs -L ucafrootfs\
  \ serverfinal.img\n```\n\n现在我们准备好将镜像上传到 OpenStack，使用 Glance：\n\n```bash\nlocaladmin@watson:~$\
  \ euca-publish --kernel vmlinuz-2.6.38-7-server --ramdisk initrd.img-2.6.38-7-server\
  \ \n```\n\n这需要一些时间，你可以通过此命令检查状态：\n\n```bash\nlocaladmin@watson:~$ euca-describe-images\n\
  ```\n\n当镜像完全上传并就绪后，它们会被列出，每个镜像的输出如下：\n\n```\nID          NAME        STATUS\n...\
  \         server-image  active\n```\n\n如果你不想使用不同的内核和磁盘镜像来创建可启动镜像，可以简化过程，跳过与 `ext4`\
  \ 镜像相关的之前的步骤：\n\n```bash\nlocaladmin@watson:~$ euca-bundle -i server.img\nlocaladmin@watson:~$\
  \ euca-upload -b mybucket -m /tmp/server.img\nlocaladmin@watson:~$ euca-register\
  \ mybucket/server.img\n```\n\n### 实例管理\n\n当你启动一个 VM 时，会发生很多事情。`scheduler` 分配资源，网络管理器分配\
  \ IP 地址，实例启动并进行管理，最终它会被终止并关闭。有很多方法可以管理此过程。适用于 OpenStack 和 Eucalyptus 实例的方法是 `euca2ools`。另一种是\
  \ OpenStack 控制面板。因为你之前在章节中读过 `euca2ools`，在这里你通过我们在本节中安装的 GUI 获得快速概览。控制面板中的实例管理通过一系列标签页和菜单选项完成。在这里你可以轻松找到如何创建密钥、启动或终止注册镜像，或者显示运行实例的控制台输出。\n\
  \n\n\n\nVOLUME vol-00000002 1 nova available (proj, None, None, None) 2011-08-21T11:19:52Z\n\
  \n卷一次挂载到一个运行中的实例。如果列表显示卷为可用（available），则它可以被挂载到实例。\n\n要将存储卷挂载到运行中的实例，请使用以下命令：\n\n\
  ```bash\nlocaladmin@watson:~$ euca-attach-volume -i i-00000009 -d /dev/vdb vol-00000002\n\
  ```\n\n该卷对实例显示为一个额外的 SCSI 磁盘。登录实例并正常挂载磁盘。如果尚未执行此操作，你必须在使用之前格式化磁盘。\n\n要卸载卷，请使用以下命令：\n\
  \n```bash\nlocaladmin@watson:~$ euca-detach-volume vol-00000002\n```\n\n## 网络管理\n\
  \n网络管理由 `nova-network` 完成，它直接与 `nova-compute` 交互，以确保运行中的实例已正确配置，以便在本地网络内以及与更广泛的互联网进行通信。每个实例可以有两个关联\
  \ IP 地址：一个用于本地云网络之外的公共通信，另一个用于信任本地网络内的私有通信。\n\n存在三种网络管理选项：扁平网络（flat network）、扁平动态主机配置协议（DHCP）网络和虚拟局域网（VLAN）。VLAN\
  \ 是默认选项。可以通过修改 `nova.conf` 中的选项选择其他选项：\n\n```ini\n--network_manager = nova.network.manager.FlatManager\n\
  --network_manager = nova.network.manager.FlatDHCPManager\n--network_manager = nova.network.manager.VlanManager\n\
  ```\n\n无论使用哪一种，都可以使用以下命令为实例设置公共和私有 IP：\n\n```bash\nlocaladmin@watson:~$ sudo nova-manage\
  \ network create 192.168.3.0/24 1 255\nlocaladmin@watson:~$ sudo nova-manage floating\
  \ create 10.10.10.2 10.10.10.224/27\n```\n\n按照如下方式将 IP 关联到实例：\n\n```bash\nlocaladmin@watson:~$\
  \ euca-allocate-address 10.10.2.225\n```\n\n## OpenStack 命令入门\n\n在本章前面的 `euca2ools`\
  \ 入门指南列出了大量命令。在这里，我们只需要一个主命令，但它有许多选项。一旦安装了 Nova 包，帮助页面（man pages）提供了有关如何使用这些选项的宝贵信息：\n\
  \n- `nova-manage user`—可以管理用户。\n- `nova-manage project`—可以管理项目。\n- `nova-manage\
  \ role`—可以管理角色。\n- `nova-manage db`—可以管理数据库。\n- `nova-manage flavor`—可以管理实例类型。\n\
  - `nova-manage service`—可以管理服务。\n\n## 学习更多\n\n带有 OpenStack 的 Ubuntu Cloud 有许多此处未讨论的特性。其中包括使用组来指定访问特定资源的角色的安全性，以及用于管理实例的\
  \ Firefox HybridFox 插件。请访问官方 Ubuntu Cloud 网站查看这些及更多内容。\n\n### Landscape\n\nLandscape\
  \ 在第 9 章提到的“管理软件”中出现过，是 Canonical 提供的一款企业级系统管理和监控工具。它可以监控本章讨论的这类 Ubuntu Cloud 服务器。Landscape\
  \ 是 Canonical 名为 Ubuntu Advantage 的付费服务的一部分。\n\n### Juju\n\n尽管在本文编写时的官方文档说 Juju\
  \ 尚未准备好供生产环境使用，但它非常有趣，并且具有足够的潜力值得介绍。很有可能在书籍出版时，Juju 已经完全准备就绪。Juju 被描述为云端的 APT。APT\
  \ 在安装、配置和启动复杂的软件堆栈及服务的方面表现出色，但前提是所有这些操作只发生在一个系统上。Juju 将这种能力扩展到了多台机器。通常情况下，Linux\
  \ 服务器是为了执行类似的任务而设置的。可能会部署多个具有相似配置的物理机器在网络中协同工作，可能是为了负载均衡或冗余，以防止在某一台故障或过载时发生停机。系统管理员是创建和编排这些网络的专家。然而，传统上需要逐个设置每台机器，配置其软件设置等。\n\
  \n多年来已经出现了一些工具来帮助完成这项巨大的任务，例如 Chef 和 Puppet；关于这些工具的更多信息，请参阅第 9 章。Juju 对服务器的作用就像包管理器对单个系统所做的那样。它允许你跨多台服务器快速、方便地部署服务，简化了配置过程，并专门为云服务器而设计。就像\
  \ Chef 的配方（recipes）一样，这些服务使用标准化的通信公式（formulas）进行部署，例如这些公式可能由不同的人编写。\n\nJuju 不同于\
  \ Chef 和 Puppet 的地方在于，Juju 的公式被称为 charms（护符），它们封装了服务，定义了服务向或其他服务暴露或消费配置数据的所有方式。这在\
  \ Juju charm 中可以通过多种方式实现，通过 shell 脚本或使用 solo 模式下的 Chef 本身。此外，Juju 通过跟踪其可用资源（如 EC2、Eucalyptus\
  \ 或 OpenStack 机器）并根据需要添加或删除它们来编排配置。\n\n随着 Juju 达到稳定，它有望成为一个强大的工具。Juju 11.10 计划通过\
  \ Ubuntu Universe 软件仓库提供。希望它能在 12.04 版本达到稳定。\n\n## Orchestra\n\nUbuntu Orchestra\
  \ 项目是一系列从 Ubuntu 服务器部署 Ubuntu 服务器的最佳实践。它旨在协助部署数量达数十、数百或数千的云服务器。计划是将 Ubuntu Orchestra\
  \ 直接安装到一台服务器的裸机上，从那里配置并设置所有其他裸机；可以快速方便地实现整个数据中心。部署后，Orchestra 提供：\n\n- **Ubuntu\
  \ Orchestra 配置服务器**——基于 Cobbler ([`fedorahed.org/cobbler/`](https://fedorahed.org/cobbler/))，它在配置新服务器时自动化任务。它添加了\
  \ `squid-deb-proxy` 服务器来缓存安装包的本地副本，以便后续安装可以在局域网速度下进行。目标是让网络安装在无人的情况下可靠运行。\n- **Ubuntu\
  \ Orchestra 监控服务器**——它使用 Nagios 监控由 Orchestra 部署的所有节点。\n- **Ubuntu Orchestra 日志服务器**——它使用\
  \ `rsyslog` 提供全面的远程日志。\n- **Ubuntu Orchestra 客户端**——这些是使用 Juju 配置的其余服务器。它们都是从默认\
  \ Ubuntu 服务器开始增加了一些：Byobu（参阅第 11 章，“命令行大师课”）；Capistrano，一个在多台服务器上运行脚本和部署 Web 应用程序工具；Juju；OpenSSH（参阅第\
  \ 18 章，“使用 SSH 和 Telnet 进行远程访问”）；Nagios ([www.nagios.org](http://www.google.org))；PowerNap，由\
  \ Ubuntu 开发者 Dustin Kirkland 编写的守护进程，根据一组配置偏好将运行中的系统带入低功率状态；`rsyslog`，著名的系统日志守护进程；`ntp`，使用网络时间协议同步时间；`squid-deb-proxy-client`\
  \ 利用安装在配置服务器上的 `squid-deb-proxy` 服务器。\n\n\n\n\n\n* [`cloud.ubuntu.com`](http://cloud.ubuntu.com)—Ubuntu\
  \ 云计算官方介绍。\n* [`eucalyptus.com/resources/overview`](http://eucalyptus.com/resources/overview)—Eucalyptus\
  \ 官方资源信息。\n* [`aws.amazon.com/`](http://aws.amazon.com/)—Amazon Web Services (AWS)\
  \ 主页。\n* [www.linux-kvm.org/page/Main_Page](http://www.linux-kvm.org/page/Main_Page)—KVM（基于内核的虚拟机）的主页。\n\
  * [`open.eucalyptus.com/wiki/Euca2oolsGuide_v1.1`](http://open.eucalyptus.com/wiki/Euca2oolsGuide_v1.1)—Euca2ools\
  \ 用户指南。\n* [www.openstack.org](http://www.openstack.org)—OpenStack 官方网站。\n* [www.canonical.com/enterprise-services/ubuntu-advantage/landscape/cloud-management](http://www.canonical.com/enterprise-services/ubuntu-advantage/landscape/cloud-management)—Canonical\
  \ 的 Landscape 是用于 Ubuntu Cloud 和 Amazon EC2 实例的商业化管理工具。\n* [`juju.ubuntu.com`](http://juju.ubuntu.com)—Juju\
  \ 的官方 Ubuntu 文档。\n\n# 第五部分 Linux 编程\n\n## 第 34 章 机会性开发\n\n### 本章内容\n* 版本控制系统\n*\
  \ 机会性开发简介\n* Launchpad\n* 快速上手\n* 地面控制\n* 桌面沙发 (Desktop Couch)\n* 自行车棚及其他工具\n* 参考文献\n\
  \n我们中有些人热爱编写程序代码。另一些人也有能力，但并不特别享受其中。本书的这一部分（第五部分，“Linux Linux”）主要面向第一类人：即那些热爱编码并想知道如何在\
  \ Ubuntu 中开始使用他们喜爱的工具的人。然而，它也适用于那些只想通过编写一个快速程序来完成某些有用事情并提供给其他 Ubuntu 用户，以解决某个特定需求的人，但他们无兴趣学习如何成为软件包维护者、上传到官方软件仓库等等。我们把这种过程称为**机会性开发**，即终端用户为问题编写一个快速的解决方案。这与具有专业规划、需求收集、设计、流程和步骤的系统化开发形成了鲜明对比。\n\
  \n如果你的最终目标是严肃、持续的开发并帮助官方打包，我们在“参考文献”部分中提供了几个链接；但为了入门，让我们看看一些可以帮助满足那种需求的方法——即写出一些东西，然后快速、方便地将其提供给他人。我们从有关版本控制系统的信息开始，然后对\
  \ Ubuntu 社区的一些倡议进行简要调查，以激发你的兴趣，并帮助你了解如果想进一步开展工作让你的程序供他人使用，应该去哪里寻找联系并开始。\n\n### 版本控制系统\n\
  决定是否将这些信息包含在本章是很困难的。一方面，只想快速解决需求的人可能对设置版本控制系统感兴趣。另一方面，这些系统并不难设置，特别是当使用每节中讨论的类代码托管网站协助时，而且如果代码要在你的系统之外生存，它们就具有极高的价值。\n\
  \n尽管 `make` 可以用于管理小型软件项目（参见第 39 章，“适用于 Ubuntu 的 C/C++ 编程工具”），但较大的软件项目需要文档管理、源代码控制、安全保障和修订跟踪，因为源代码在开发过程中会经历一系列变化。版本控制系统为这类大型软件项目管理提供了工具。存放在版本控制中的文件更改会被记录跟踪。一个开发者可以检出（check\
  \ out）一个文件，在本地环境中对其进行修改，并在将这些更改保存到版本控制系统之前进行测试。如果后来发现某些更改是不需要的，可以从被跟踪的文件找到并并它们。不同的版本控制系统管理项目的方式不同；有些使用中央仓库，另一些则使用分布式格式，任何一个副本都可以成为主副本。\n\
  \n接下来的几节介绍了目前最常用的三个版本控制系统。你肯定听说过其他的，而且新的系统每几年就会出现一个。每个系统都有其优点和好处。在章末的“参考文献”部分，你将在读完本章对每个系统的简短基础介绍后，找到一个学习更多关于\
  \ Subversion、Bazaar、Mercurial 和 Git 的资源列表，以丰富你的知识。\n\n> **注意**  \n> Subversion 和\
  \ Mercurial 仍在被大量使用，但今天大多数开发者在新建项目中已转向 Git 和 Bazaar。在阅读接下来的几节时请记住这一点。\n\n#### 使用\
  \ Subversion 管理软件项目\nSubversion 最初创建于 2000 年，用于替代较旧的版本控制系统并发版本控制系统 (`CVS`)。那时，CVS\
  \ 已经有 10 年历史了，尽管它很好地完成了任务，但缺少一些开发者想要的功能。它正在被积极开发并广泛使用。\n\n在 Subversion 中，你以客户端/服务器模式从存储代码的仓库中检出一个文件。然后，你检出的所有文件的更改都会被跟踪。Subversion\
  \ 可用于项目范围内的版本回溯或分支。它还可以用于防止或解决开发者之间产生的冲突条目或更改。使用 Subversion 进行源码控制是从命令行完成的，如下例所示。你首先需要从\
  \ Ubuntu 仓库安装 Subversion，它的名为 `subversion`。\n\n你可以通过以下方式创建一个仓库：\n\n```bash\nsvnadmin\
  \ create /path/to/your_repo_name\n```\n\n要向仓库添加新项目，首先进入要放入仓库的代码目录。然后创建三个子目录：`branches`、`tags`\
  \ 和 `trunk`。将你的所有文件移动到 `trunk` 中并输入：\n\n```bash\nsvn import project file:///your_repo_name\
  \ -m \"First Import\"\n```\n\n要从现有的中央仓库检出代码，使用：\n\n```bash\nsvn checkout file:///your_repo_name/your_project/trunk\
  \ your_project\n```\n\n在更改后提交代码，使用 `-m` 标记添加注释，这是一个很好的习惯，这样其他人就知道 `commit` 包含的内容：\n\
  \n```bash\nsvn commit -m \"This fixes bug 204982.\"\n```\n\n从主仓库更新本地仓库中的源代码，以确保你拥有其他开发者提供的最新更改，使用：\n\
  \n```bash\nsvn update\n```\n\n向仓库添加新文件，使用以下：\n\n```bash\nsvn add file_or_dir_name\n\
  ```\n\n从仓库中删除文件，使用：\n\n```bash\nsvn delete file_or_dir_name\n```\n\n许多使用 Subversion\
  \ 的开源项目使用 SourceForge 托管代码，它也支持 Git 和 Mercurial。与后续几节中讨论的其他代码托管网站一样，SourceForge\
  \ 是寻找对你有用或你可能通过参与做出贡献的开源软件项目的好地方。你可以在 [`sourceforge.net`](http://sourceforge.net)\
  \ 找到它。\n\n#### 使用 Bazaar 管理软件项目\n\n\n\n\n\nBazaar 由 Canonical 创建，并于 2007 年首次发布，用于托管\
  \ Ubuntu 以及其他的所有开发文件。它正在活跃开发并被广泛使用，不仅是 Canonical 和 Ubuntu 的开发者，还包括许多其他开源项目。本章稍后介绍的\
  \ Launchpad 使用了 Bazaar。\n\nBazaar 支持在有中央仓库或无中央仓库的情况下进行工作。它会跟踪你检出的任何及所有文件的更改，包括文件的多个版本。Bazaar\
  \ 的功能与 Subversion 类似，但通常被认为更易用。源码控制通过命令行完成，如下例所示。你首先需要从 Ubuntu 软件存储库安装 Bazaar，在其中它被称为\
  \ `bzr`。\n\n创建一个新仓库有两种方法。如果你是从空目录开始，请使用以下命令：\n\n```\nmatthew@seymour:~$ bzr init\
  \ your_project_name\n```\n\n如果你是为现有项目创建仓库，请进入项目的顶层目录并输入以下命令：\n\n```\nmatthew@seymour:~$\
  \ bzr init\nmatthew@seymour:~$ bzr add .\n```\n\n要从现有的中央仓库检出代码，请使用此命令：\n\n```\n\
  matthew@seymour:~$ bzr checkout your_project_name\n```\n\n在提交代码之前检查你的更改，可以使用 `bzr\
  \ diff` 或 `bzr cdiff`。它们的作用相同，但 `bzr cdiff` 会带有彩色输出：\n\n```\nmatthew@seymour:~$\
  \ bzr cdiff\n```\n\n在完成更改后提交代码，使用 `-m` 标志添加注释，这是一个好习惯，这样其他人就能知道 `commit` 包含的内容：\n\
  \n```\nmatthew@seymour:~$ bzr commit -m \"This fixes bug 204982.\"\n```\n\n在 Bazaar\
  \ 中，`commit` 不会更改远程文件；它只将更改提交到你的本地副本。如果你想让其他人看到你的更改，你必须将更改 `push` 到他们那里：\n\n```\n\
  matthew@seymour:~$ bzr push sftp://path.to.main/repository\n```\n\n要从主仓库更新本地仓库中的源码，以确保你拥有其他开发者的最新代码更改，请使用以下命令：\n\
  \n```\nmatthew@seymour:~$ bzr update\n```\n\n许多使用 Bazaar 的开源项目使用 Launchpad 托管其代码，本章稍后会介绍\
  \ Launchpad，因为 Ubuntu 的开发发生在那里。你可以在 [`launchpad.net`](http://launchpad.net) 找到它。\n\
  \n## 使用 Mercurial 管理软件项目\n\nLinux 内核曾使用一个免费使用但不开源的版本控制系统和代码托管服务。这通常是 Linux 社区内自由软件倡导者之间紧张的根源。随后，该服务宣布其将转向付费计划，并提供了一些过渡时间。由于这一决定，诞生了两个新的版本控制系统。Mercurial\
  \ 是其中一个；Git 是另一个。两者最初都是为了托管 Linux 内核代码而编写的。Git 由主内核开发者 Linus Torvalds 本人最初编写（仅用了两周），并胜出了。然而，更广泛的开源开发社区才是最终赢家，因为诞生了两个有趣且实用的版本控制系统。\n\
  \nMercurial 由开发者 Matt Mackall 创建，目前仍由他主导。它采用分布式架构，并设计为快速运行，即使在处理大型代码库时也是如此。它的命令与\
  \ Subversion 相似，这使得过渡和初始使用变得快速且简单。一个有趣的特性是 Mercurial 是可扩展的；可以从项目的 wiki 安装扩展，或由用户编写以更改工作方式或在不更改原始代码的情况下添加功能。源码控制通过命令行完成，如下例所示。你首先需要从\
  \ Ubuntu 软件存储库安装 Mercurial，在其中它被称为 `mercurial`。\n\n> Note\n> 水的化学符号是 Hg。这就是为什么 Mercurial\
  \ 命令使用 `hg`。\n\n要创建一个新仓库，请创建一个空项目目录：\n\n```\nmatthew@seymour:~$ hg init your_project_name\n\
  ```\n\n然后将你的文件添加到目录中。如果你不在该目录，请 `cd` 进入该目录并输入以下命令：\n\n```\nmatthew@seymour:~$ hg\
  \ add\n```\n\n第一次提交代码或在完成更改后提交，使用 `-m` 标志添加注释，这是一个好习惯，这样其他人就能知道 `commit` 包含的内容：\n\
  \n```\nmatthew@seymour:~$ hg commit -m 'First commit.'\n```\n\n在 Mercurial 中，`commit`\
  \ 不会更改远程文件；它只将更改提交到你的本地副本。如果你想让其他人看到你的更改，你必须将更改 `push` 到他们那里：\n\n```\nmatthew@seymour:~$\
  \ hg push\n```\n\n要从主仓库更新本地仓库中的源码，以确保你拥有其他开发者的最新代码更改，使用此命令：\n\n```\nmatthew@seymour:~$\
  \ hg update\n```\n\n许多使用 Mercurial 的开源项目使用 Bitbucket 托管其代码。你可以在 [`bitbucket.org`](http://bitbucket.org)\
  \ 找到它。\n\n## 使用 Git 管理软件项目\n\nGit 由 Linux 内核之 Linus Torvalds 创建，并于 2005 年首次发布，用于托管\
  \ Linux 内核的所有开发文件。它现在由 Junio Hamano 领导的大型团队活跃开发，并被许多其他开源项目广泛使用。\n\nGit 在没有中央仓库的情况下工作，并以与其他版本控制系统不同的视角工作，同时实现了相同的目标。每个被\
  \ Git 跟踪的目录作为一个独立的仓库，对于其中包含任何内容都有完整的历史和源码更改。不需要跟踪。源码控制通过命令行完成，如下例所示。你首先需要从 Ubuntu\
  \ 软件存储库安装 Git，在其中它被称为 `git`。\n\n要创建一个新仓库，进入项目的顶层目录并输入以下命令：\n\n```\nmatthew@seymour:~$\
  \ git init\n```\n\n要从现有的中央仓库检出代码，你必须先告诉 Git 该仓库在哪里：\n\n```\nmatthew@seymour:~$ git\
  \ add origin git://path.to.repository/proj.git\n```\n\n然后你可以从该仓库将代码拉取本地：\n\n```\n\
  matthew@seymour:~$ git pull git://path.to.repository/proj.git\n```\n\n向仓库添加新文件，请使用以下命令：\n\
  \n```\nmatthew@seymour:~$ git add file_or_name\n```\n\n从仓库中删除文件，使用此命令：\n\n```\n\
  matthew@seymour:~$ git rm file_or_name\n```\n\n在完成更改后提交代码，使用 `-m` 标志添加注释，这是一个好习惯，这样其他人就能知道\
  \ `commit` 包含的内容：\n\n```\nmatthew@seymour:~$ git commit -m 'This fixes bug 204982.'\n\
  ```\n\n在 Git 中，`commit` 不会更改远程文件；它只将更改提交到你的本地副本。如果你想让其他人看到你的更改，你必须将更改 `push` 到他们那里：\n\
  \n```\nmatthew@seymour:~$ git push git://path.to.repository/proj.git\n```\n\n许多使用\
  \ Git 的开源项目使用 GitHub 托管其代码。你可以在 [`github.com`](http://github.com) 找到它。\n\n### 机会性开发简介\n\
  \n你有一个程序的想法，可以通过自动化重复性任务来节省时间。你计划让它有一个漂亮的图形界面，你认为可能还有其他其他人想在程序编写后使用这个工具。问题是，你全职工作，有家庭，并且已经有很多无法获得关注的侧边项目。你可能不能或不愿意坐下来研究\
  \ Ubuntu 如何打包程序以将其引入官方软件存储库。（如果你愿意，请参阅“References”部分中的链接。）\n\n\n\n\n过去，在这一时刻你通常只有一个简单的选择：编写程序并将其放在网站上让其他人发现——并希望可能有人会发现它很有用，制作一个\
  \ DEB 包，并将其上传到 Debian 或 Ubuntu 仓库。如果你的目标仅仅是编写你的工具并让 Ubuntu 用户可以使用该软件，那么这不再是唯一的选项了。现在，你需要在技术上精通编写任何你想要编写的代码，并且需要能够理解复杂的系统，但\
  \ Ubuntu 正在降低编写这些代码将其推向更广泛社区的复杂性。这让只想解决某个特定问题的开发者能够如愿为，而无需阅读大量关于他们预计很少使用或仅使用一次的工具的文档。\n\
  \n## Launchpad\n\n要开始之前，你需要在 Launchpad 上注册一个账户（请参见图 34.1）。Launchpad 是一个为了简化软件开发中的通信、协作和流程而创建的基础设施。它由\
  \ Canonical 开发并支持，Canonical 是支持 Ubuntu 社区的公司，但它被许多软件项目使用，其中几个项目并不属于 Ubuntu 社区。\n\
  \n![Image](img/34fig01.jpg)\n\n图 34.1 Launchpad 是 Ubuntu 开发的起点。\n\nLaunchpad 是 Ubuntu\
  \ 开发发生的地方。它集成了之前介绍的版本控制系统 Bazaar，使得跟踪软件代码的变化变得简单得多，并允许在必要时撤销这些更改，同时跟踪谁执行了这些操作。Launchpad\
  \ 还整合了 Soyuz，这是一种分发和归档管理软件，负责处理 Launchpad 内部的软件包构建。\n\n对于使用 Launchpad 的开发者来说，这意味着过程变得简单了一些。他们可以集中在编写和编辑代码上，让\
  \ Launchpad 处理更改的跟踪和包的创建。对于编写和维护需要源码版本控制等的大型项目的活跃开发者非常有用。它还托管了错误报告和跟踪、邮件列表、软件界面翻译等许多功能。这大部分内容超出了本章的范围，但对严肃的开发者来说具有很大意义。\n\
  \n我们感兴趣的是，注册的 Launchpad 用户可以创建一个`个人包归档 (PPA)`。这是一种让程序可用的更简单的方法。任何拥有 PPA 的人都可以上传源代码以构建成包。这些包将可以在\
  \ apt 仓库中可用，该仓库可以添加到任何 Ubuntu 用户的源仓库列表中，并使用 Ubuntu 中的任何标准包管理工具（如 `apt`、Ubuntu 软件中心和\
  \ Synaptic）下载或删除。每个 Launchpad PPA 的网页上都包含了说明，描述如何添加该仓库，这成为分享软件的一种简单方法，即使是最是不技术的终端用户也可以添加和删除它。图\
  \ 34.2 显示了 Google Chromium 稳定版本的 PPA。\n\n![Image](img/34fig02.jpg)\n\n图 34.2 用于\
  \ Google Chromium 稳定版本的 Launchpad PPA。\n\n## Quickly\n\n几位非常有经验且才华横溢的 Ubuntu 开发者聚在一起。这些人是知道如何编程并享受其中的人。同时，他们希望\
  \ Linux 上的编程变得简单且有趣，并决定对某些人来说这并不有趣，因为学习可能太难了。为了入门，有太多的选择、太多的工具以及需要阅读和学习的文档。他们经历了一个“如果”的时刻：如果我们能写一个程序，对一些非常主观的选择做出决定会怎样？\n\
  \n\n\n\n```\n-rw-r--r--   1 matt matt  191 2010-07-31 15:42 matthewsapplication.desktop.in\n\
  -rw-r--r--   1 matt matt   76 2010-07-31 15:42 .quickly\n-rw-r--r--   1 matt matt\
  \ 2956 2010-07-31 15:42 setup.py\n-rw-r--r--   1 matt matt 2837 2010-07-31 15:42\
  \ setup.pyc\n```\n\n按照如下方式，使用 Glade 编辑你新应用程序的默认 GUI：\n\n```bash\nmatthew@seymour:~$\
  \ quickly design\n```\n\n这将弹出一个美化的界面，帮助你创建应用程序所需的所有操作、容器、组件等（参见图 34.4）。\n\n![Image](img/34fig04.jpg)\n\
  \n图 34.4 Quickly 使用 Glade 帮助创建用户界面。\n\n在 `gedit` 中修改应用程序行为并编辑 Python 代码（参见图 34.5）：\n\
  \n```bash\nmatthew@seymour:~$ quickly edit\n```\n\n![Image](img/34fig05.jpg)\n\n\
  图 34.5 代码文件在 `gedit` 中以相邻标签页的形式打开，以便快速方便地编辑。\n\n通过运行以下命令测试你的新应用程序：\n\n```bash\n\
  matthew@seymour:~$ quickly run\n```\n\n你可以使用此命令创建应用程序的包构建，这推荐用于测试：\n\n```bash\n\
  matthew@seymour:~$ quickly package\n```\n\nQuickly 最令人兴奋的功能之一是它与 Launchpad 集成，可以加速处理\
  \ PPA 的过程。你需要一个 Launchpad 账户。执行此操作有两个等效命令：\n\n```bash\nmatthew@seymour:~$ quickly\
  \ release\n```\n\n以及\n\n```bash\nmatthew@seymour:~$ quickly share\n```\n\n如果你有一定的开发经验，可以为\
  \ Quickly 创建模板（例如 ubuntu-application 模板），这些模板对编程语言等许多内容做了特定决定。Quickly 还很年轻并处于活跃开发中，但已经非常好用。请查看“参考文献”部分获取更多信息。\n\
  \n### Ground Control（地面控制）\n\n软件协作可能是困难的。由于工具的复杂性，进入这个世界的门槛相当高。你是否遇到过程序问题并能够找出错误所在——也许你甚至能为它编写一个快速的软件补丁——但不知道如何将该补丁提交给原始开发者？这种情况经常发生。想象一下某人发现了\
  \ Python 代码中的一个拼写错误，并想通过修复它来帮助开发者节省时间。\n\nGround Control 旨在简化软件项目中的此类和其他协作。它将大多数开发者使用并熟悉的技术和工作流带到\
  \ Ubuntu 桌面，让普通的非开发者终端用户也能使用。它本质上是一个内置在 Ubuntu 桌面中的版本控制系统，可以使用标准的 Ubuntu GNOME 文件浏览器直接与\
  \ Launchpad 和 Bazaar 交互。当你使用 Quickly 或其他方法自己编写软件并通过 PPA 在 Launchpad 上发布它时，这也非常有用。这时可能会有人来向你提供错误修复，而这些人可能对后台工具的技术熟练程度更低。\n\
  \n可以通过 Ubuntu 软件存储库、Ground Control 网站 ([`launchpad.net/groundcontrol`](https://launchpad.net/groundcontrol))\
  \ 或从该网页链接的每日构建 PPA 安装 Ground Control `groundcontrol`。程序出现在菜单的“系统-偏好-Ground Control\
  \ 配置”中，如图 34.6 所示，你需要运行它以赋予 Ground Control 与你的 Launchpad 账户交互的能力。这也是你完成 Ground Control\
  \ 使用后注销的工具。如果你没有 Launchpad 账户，Ground Control 会帮助你注册。\n\n![Image](img/34fig06.jpg)\n\
  \n图 34.6 点击“登录 Launchpad”开始使用 Ground Control。\n\n登录时，Ground Control 会从 Launchpad\
  \ 获取你的 Launchpad 凭据，包括你上传的 `ssh` 密钥。`ssh` 密钥是安全连接所需的特殊代码；它识别你的身份，以便系统和其他使用它的人能够确定代码是谁上传的。你可以使用已上传到\
  \ Launchpad 账户的现有 `ssh` 密钥。如果你没有 `ssh` 密钥，Ground Control 会帮助你创建一个。然后 Ground Control\
  \ 会自动更新你的本地 Bazaar 配置。\n\n然后，当你使用 GNOME 文件浏览器（又名 Nautilus）查看与你之前使用的 Bazaar 分支相关的目录时，它会为你提供与之交互的工具。在你第一次运行\
  \ Ground Control 配置工具后，你发现在主目录中有一个名为 `Projects` 的新文件夹。从现在起，如果你想登录 Ground Control，也可以在该文件夹中通过点击“识别您的身份”按钮来操作，如图\
  \ 34.7 所示。\n\n![Image](img/34fig07.jpg)\n\n图 34.4 Quickly 使用 Glade 帮助创建用户界面。（等等，让我根据提供的文本重新对齐图片编号）。\n\
  \n*根据文本流进行的修正：*\n- 图 34.4: Quickly 使用 Glade...\n- 图 34.5: 代码文件打开...\n- 图 34.6: 点击登录\
  \ Launchpad...\n- 图 34.7: 识别您的身份...\n- 图 34.8: 确认窗口...\n- 图 34.9: 新功能...\n- 图 34.10:\
  \ 搜索 chromium...\n- 图 34.11: 新选项...\n- 图 34.12: 选择分支...\n\n让我们更仔细地重新格式文本的特定部分：\n\
  \n登录时，Ground Control 会从 Launchpad 获取你的 Launchpad 凭据，包括你上传的 `ssh` 密钥。`ssh` 密钥是安全连接所需的特殊代码；它识别你的身份，以便系统和其他使用它的人能够确定代码是谁上传的。你可以使用已上传到\
  \ Launchpad 账户的现有 `ssh` 密钥。如果你没有 `ssh` 密钥，Ground Control 会帮助你创建一个。然后 Ground Control\
  \ 会自动更新你的本地 Bazaar 配置。\n\n然后，当你使用 GNOME 文件浏览器（又名 Nautilus）查看与你之前使用的 Bazaar 分支相关的目录时，它会为你提供与之交互的工具。在你第一次运行\
  \ Ground Control 配置工具后，你发现在主目录中有一个名为 `Projects` 的新文件夹。从现在起，如果你想登录 Ground Control，也可以在该文件夹中通过点击“识别您的身份”按钮来操作，如图\
  \ 34.7 所示。\n\n![Image](img/34fig07.jpg)\n\n图 34.7 向 Ground Control 识别您的身份。\n\n登录后，注意确认框（参见图\
  \ 34.8），并观察文件器的变化。\n\n![Image](img/34fig08.jpg)\n\n图 34.8 确认窗口使用了你的 Launchpad 详情。\n\
  \n![Image](img/34fig09.jpg)\n\n图 34.9 新功能出现。\n\n如果你点击“获取项目”，将进入一个搜索窗口。输入你想查找的项目名称并点击“查找”开始搜索。图\
  \ 34.10 显示了搜索结果。\n\n![Image](img/34fig10.jpg)\n\n图 34.10 搜索单词 chromium。\n\n当你选择时，`Projects`\
  \ 中会创建一个项目的子目录。假设你想要主开发分支，它是列表中的第一个。但是，如果你与某人合作代码的特定部分或其他图标，你可以找到并下载该分支。选择该分支，在右下角赋予一个本地名称，并点击“确定”。图\
  \ 34.11。\n\n![Image](img/34fig11.jpg)\n\n图 34.11 新选项出现。\n\n你必须输入 `ssh` 密钥密码（你在创建\
  \ `ssh` 密钥时创建）来确认你的身份，以便该代码上的活动可以追溯。这有助于防止（或至少追踪）想要制造麻烦的恶意活动，并有助于跟踪或删除上传的错误。它会找到所有的修订并将代码下载到你的计算机上。\n\
  \n![Image](img/34fig12.jpg)\n\n图 34.12 选择从哪个分支下载代码。\n\n\n\n\n\n`Bikeshed` 由 Dustin\
  \ Kirkland 于 2010 年 9 月启动，该项目旨在封装他编写的一系列工具，这些工具是他作为 Canonical Ubuntu Server 团队的\
  \ Ubuntu 开发者为了解决某些个人需求而编写的，或者是他认为对其他人有用的工具。每个优秀的开发者、系统管理员和 DevOps 专家最终都会编写脚本来执行他们认为有用的特定任务。该项目自\
  \ Dustin 将这些工具收集在一起并向世界开放时开始。欢迎更广泛的 Ubuntu 社区提供建议或提交补丁以改进它们。该项目自述为“一组随机的有用工具和实用程序，它们要么不适合其他任何地方，或者尚未被更合适的项目接受。可以将此包想象成一个‘孤儿院’，工具在这里直到被慈爱且接受的父母收养。”Bikeshed\
  \ 在 Launchpad 项目页面上的口号是“当其他人在争论某个工具应该放在何处时，我们把它放在自行车棚（bikeshed）里。”\n\n为了表感谢，本节的大部分内容许可来自\
  \ Dustin 的博客 [`blog.dustinkirkland.com`](http://blog.dustinkirkland.com)、与他的直接交流或工具的帮助页（man\
  \ pages）。Dustin 还编写了 `Byobu`，该工具在第 11 章末尾的“命令行大师课”中有所介绍。\n\n本节的第一组工具可以通过从 Ubuntu\
  \ 仓库安装 `bikeshed` 包来获取。Bikeshed 有时作为一个孵化器，存放特定的工具直到它们准备好作为一个独立的包存在，或者被接收到现有的包中。所有工具都从命令行运行，大多数都有实用的帮助页。（其他的仍在编写中。）\n\
  \n### Bikeshed 的当前内容如下：\n\n- `apply-patch` 封装了 patch 工具，通过自动检测补丁裁剪级别（strip level）使其更易使用。\n\
  - `bch` 确定当前 Bazaar (`bzr`) 树中已修改的文件，打开 `debian/changelog` 进行编辑，使用 `dch` 并为当前的修改文件列表添加\
  \ `changelog` 条目。\n- `bzrp` 与 `bzr` 相同，区别是将输出通过到分页器（pager），以便于阅读。\n- `col1` 分割并打印指定的列，其中要打印的列是你运行的脚本程序的名称（`col1`\
  \ 到 `col9`）。`col2` 到 `col9` 是 `col1` 的符号链接；其行为仅根据调用的名称而改变。例如，与其使用 `awk '{print $5}'`，你可以使用\
  \ `col5`。\n- `dman` 从 [`manpages.ubuntu.com`](http://manpages.ubuntu.com) 远程检索帮助页，但在本地系统上读取。这对于阅读本地系统未安装的工具的帮助页非常有用。\n\
  - `pbget` 获取由 `pbput` 或 `pbputs` 上传到 pastebin 的内容。\n- `pbput` 将文本文件、二进制文件或整个目录结构上传到\
  \ pastebin。它与之后介绍的 `pastebinit` ，但增加了对二进制的支持并仅使用 [`pastebin.com`](http://pastebin.com)。\n\
  - `pbputs` 的操作与 `pbput` 完全相同，但在上传前会提示用户输入密码以使用 `gpg` 对内容进行加密。`pbget` 在请求文件时会自动提示用户输入预共享密码。\n\
  - `release-build` 获取 Launchpad PPA 中 `bzr` 项目的信息，使用特定参数并将项目作为上游项目构建，然后可以发布到 Ubuntu。\n\
  - `release` 为 Ubuntu 创建项目发布版本。\n- `socks-prox` 建立一个加密连接，通过 `socks` 代理进行流量隧道。\n-\
  \ `system-search` 对一组系统命令、软件包、文档和文件进行统一搜索。\n- `uquick` 执行快速服务器安装。\n- `what-provides`\
  \ 确定哪个软件包提供了你路径中的某个特定二进制文件。\n- `wifi-status` 监控无线接口的连接状态和相关信息。\n\nBikeshed 的内容可能会随时间变化。如果你是在其编写一或两年后阅读这些内容的，其中某些工具可能已经毕业成为独立工具，或者被添加到了更正式的上游包中。你可以随时查看\
  \ Launchpad 页面以查找 Bikeshed 内容的最新列表。\n\n本节中的其余工具并不是 Bikeshed 的实际部分，但它们要么是从 Bikeshed\
  \ 毕业并拆分为自由工具的，要么是由 Dustin 或 Ubuntu 社区的其他人员独立开发的。所有工具都从命令行运行并具有实用的帮助页。\n\n### 你可以在\
  \ Ubuntu 仓库中找到并可能想要了解的其他有用工具包括：\n\n- `pastebinit` 是一个脚本，可以将文件或命令结果上传到你指定的 pastebin，并返回\
  \ URL。它由另一位 Ubuntu 开发者 Stéphane Graber 编写，可以在 [`launchpad.net/pastebinit`](https://launchpad.net/pastebinit)\
  \ 或 Ubuntu 仓库中找到。默认情况下，它使用 [`pastebin.com`](http://pastebin.com)，但可以配置使用其他站点，如 [`paste.ubuntu.com`](http://paste.ubuntu.com)。\n\
  - `run-one` 运行一个具有唯一参数的唯一命令实例。这在 cron 任务中非常有用，当你不希望有多个副本时。\n- `run-this-one` 与 `run-one`\
  \ 完全相同，但它会使用 `pgrep` 找到并杀死属于该用户的任何匹配进程。\n- `keep-one-running` 操作与 `run-one` 完全相同，区别是每当\
  \ `COMMAND` 退出（无论退出码是否为零）时，它都会生成 `COMMAND [ARGS]`。\n- `ssh-import-id` 使用连接到公密钥服务器（默认为\
  \ [`launchpad.net`](https://launchpad.net)）获取一个或多个用户的公钥，并将其添加到当前用户的 `~/.ssh/authorized_keys`\
  \ 文件。\n- `bootmail` 由 `cron` 调用，在每次系统重启时发送电子邮件。它从 `/etc/bootmail/recipients` 读取一个或多个逗号分隔的电子邮件地址列表，然后遍历\
  \ `/etc/bootmail/logs` 中由空格分隔的文件列表以构建邮件。这对于知道远程系统何时重启非常有用。\n- `rootsign` 使用仅 root\
  \ 用户可用的公私钥对对标准输入进行密码学签名，并将结果输出到标准输出，适合传递给 `mail`。该工具是为了供 `bootmail` 使用，但也可以被其他人使用。它对于确保\
  \ cron 任务发送的邮件具有真实性非常好。\n\n#### 参考文献\n\n- **[`subversion.apache.org/`](http://subversion.apache.org/)**—Subversion\
  \ 的主网站。\n- **[`bazaar.canonical.com/en/`](http://bazaar.canonical.com/en/)**—Bazaar\
  \ 的主网站。\n- **[`mercurial.selenic.com`](http://mercurial.selenic.com)**—Mercurial\
  \ 的主网站。\n- **[`git-scm.com/`](http://git-scm.com/)**—Git 的主网站。\n- https://launchpad.net/**—Launchpad\
  \ 是一个开源网站，托管代码、跟踪 bug 并帮助开发者和用户协作与共享。\n- **[`launchpad.net/ubuntu/+ppas`](https://launchpad.net/ubuntu/+ppas)**—个人软件包存档（PPA）允许上传源代码并将其构建为\
  \ .deb 包，并作为 apt 仓库提供给他人。\n\n\n\n\n\n- [www.pygtk.org/](http://www.pygtk.org/)，基于\
  \ [`www.gtk.org/`](http://www.gtk.org/)——PyGTK 是 Ubuntu 开发者在 Python 中使用 GTK 创建 GUI\
  \ 界面时最常用的工具包，这也是 `ubuntu-application` 模板设置的任务。\n- [`glade.gnome.org/`](http://glade.gnome.org/)—一个用于\
  \ GTK 的界面设计器。\n- [www.freedesktop.org/wiki/Specifications/desktopcouch](http://www.freedesktop.org/wiki/Specifications/desktopcouch)、[`couchdb.apache.org/`](http://couchdb.apache.org/)\
  \ 以及 [`launchpad.net/desktopcouch`](https://launchpad.net/desktopcouch)—Desktop\
  \ Couch 是一种由 Ubuntu One 和许多桌面程序的数据存储格式，用于方便集成数据存储、计算机之间的复制复制以及到程序中的同步。\n- [`projects.gnome.org/gedit/`](http://projects.gnome.org/gedit/)—gedit\
  \ 是 GNOME 桌面环境中的默认文本编辑器。\n- [`launchpad.net/groundcontrol`](https://launchpad.net/groundcontrol)\
  \ 和 [`ground-control.org/`](http://ground-control.org/)—Ground Control 将 Launchpad\
  \ 的功能和实用性集成到你的 Ubuntu 桌面。\n- [`wiki.ubuntu.com/DeveloperStackTour`](https://wiki.ubuntu.com/DeveloperStackTour)—这个进行中的\
  \ wiki 页面计划作为进入 Ubuntu 世界的新开发者的第一站。在这里你将学习工具和流程。\n- [`launchpad.net/bikeshed`](https://launchpad.net/bikeshed)—Bikeshed\
  \ 的主页。\n\n# 第 35 章 协助 Ubuntu 测试与质量保证\n\n## 本章内容\n- 社区团队\n- 错误搜索小队\n- 测试驱动\n- 参考文献\n\
  \n有很多方法可以帮助 Ubuntu 社区创建、完善和推广该操作系统。有些具有高度的技术性，例如编写代码或打包程序以包含在软件存储库中。有些技术性较低，例如帮助在本地推广\
  \ Ubuntu，或者通过博客发布社区的趣闻新闻。在中间某个位置，偏向技术一侧，有一项非常欢迎更多社区参与的任务。\n\n这是一个相当简短且刻意模糊的章节。如果志愿者测试要对开发者有所帮助而不是变成困扰，它需要的不仅仅是随兴趣的投入。因此，本章涵盖了如何参与的基础知识和一些机会，但不是精确的细节。如果你感兴趣（我们希望你在读完本章后依然是感兴趣的），下一步是访问章节末尾列出的网站。\n\
  \n### 社区团队\n两个社区团队都欢迎能够遵循指示、细心且有方法、并注重细节的志愿者。这两个团队都致力于在开发周期内完善发行版，以帮助 Ubuntu 变得完美。\n\
  \nUbuntu QA 团队直接关注发行版的整体质量，尝试默认程序和配置，并尝试“搞坏”它们。目标是在开发周期内发现 Bug 并提交清晰的报告，尝试在终端用户知道它们之前修复它们。这里的目标是产品改进和质量控制或质量保证。\n\
  \n这些都是巨大的任务。即使有几位 Canonical 员工全职工作，几乎不可能测试每种硬件配置或用例。同样，无法猜测用户会尝试用哪些创意方式来执行开发者设计以不同执行的任务。当目标是为尽可能的人创造良好的体验时，尽可能测试这些选项是关键。这就是为什么志愿者既受到欢迎又被积极招募。\n\
  \n这些也是非常严格的任务。测试和 Bug 报告（或修复）需要仔细的关注，以确保报告的问题清晰，并包含开发者可以重复的步骤。这使他们能够找到问题所在并更容易地修复它们。并不是每个人都适合这类工作，但那些能够清晰准确、并能遵循测试计划和程序中给出指示的人，价值连城。你可能不会因为测试获得公众声誉，但如果你能做好工作，将获得与你一起测试的同事的荣誉。\n\
  \n你会注意到接下来的团队描述中存在一些重叠。这是因为团队之间合作非常紧密。虽然每个团队都有主攻，但每个团队有时都会执行相似的任务。即使是单个团队的网页也相互链接，并提供类似的信息，以协助并引导任何感兴趣的志愿者参与他们认为自己最有胜任的任务。\n\
  \n#### Ubuntu 测试团队\nUbuntu 测试团队的成员最广为人知的是他们在发布周的工作，当时他们帮助验证所有的 CD 和 DVD 镜像。他们也在发布周期内运行，测试\
  \ Beta 版本和发布候选版。此外，在稳定版的更新包推送到用户之前，会对这些包进行测试。他们通过启用一个名为 `-proposed` 的新软件存储库，并在软件进入\
  \ `-updates` 存储库之前对其进行测试来实现此。此外，他们通过协调沟通以及在遇到特定测试需求时积极寻找并联系额外的志愿者来帮助开发者。\n\n要开始之前，你需要一个\
  \ Launchpad 账户。然后，通过 Launchpad 上的团队页面 [`launchpad.net/ubuntu-testing`](https://launchpad.net/ubuntu-testing)\
  \ 加入 Ubuntu 测试团队。订阅团队的邮件列表 [`lists.ubuntu.com/mailman/listinfo/ubuntu-qa`](https://lists.ubuntu.com/mailman/listinfo/ubuntu-qa)\
  \ 也是一个好主意。当需要测试人员时，Launchpad 团队列表和邮件列表是寻求帮助者的初始联系点。\n\n参与测试有很多方法；每种方法对时间和技术技能的要求各不相同。有些任务快速而简单，而有些可能更复杂。有些测试是通用的，而有些则涉及特定的功能、应用程序和硬件。有些测试是自动化的，需要下载并安装特定的测试软件。其他则以指令列表的形式给出。许多技能水平和大多数时间安排都存在机会。\n\
  \n#### QA 团队\nQA 团队侧倾向于开发和使用工具来实现流程自动化。这使得使用工具的人能够非常快速地针对代码库运行大量测试，同时确保他们精确地探测所需的内容。他们的大部分工作对于硬件认证、逻辑测试和\
  \ Bug 发现非常有用。他们开发了一套面向 Ubuntu 开发者的工具集名为 `ubuntu-qa-tools`；一个用于 *Linux 桌面测试项目 (LDTP)*\
  \ 的库 `Mago`，以简化在更广泛的 Linux 桌面领域内对 Ubuntu 进行测试；一个直接测试并发送测试数据到 Launchpad 的框架 `Checkbox`，等等。\n\
  \n### 错误搜索小队\n\n\n\n\n\n人们参与 Ubuntu 测试的最早途径之一是 Bug Squad（错误小队）。这些志愿者是大多数提交给 Ubuntu\
  \ 漏洞的初始联系人。他们阅读错误报告，以判断漏洞是否真实（例如，它不应该是像“Ubuntu 无法工作”这样模糊的描述，而应该是具体的且可衡量的），该漏洞是否提交到了正确的软件包中，以及每份报告是否包含了充分的信息供开发人员解决问题。如果错误报告符合这些标准，Bug\
  \ Squad 将决定应该通知哪位开发者或团队。有时在分检过程中，他们可能会向报告者寻求更多信息。他们试图确定漏洞的严重程度，并可能为报告分配优先级设置。\n\n\
  ## Test Drive (测试驱动)\n\n志愿者和开发者使用的一个值得提及的特定工具是 Test Drive。Dustin Kirkland 是 Canonical\
  \ Ubuntu Server 团队的一名 Ubuntu 开发者。他一直在寻找一种简单的方法，使用 `KVM` 或 `VirtualBox` 等虚拟机下载并运行最新的\
  \ Ubuntu 每日开发快照。像任何不想重复执行任务的优秀开发者一样，他编写了一个工具来自动化这个过程。在创建 Test Drive 时，他将其设置为可配置，以便根据用户的喜好使用不同设置的虚拟机。它甚至可以下载并运行通过\
  \ URL 访问的任何 ISO，这意味着它可以用于在开发周期期间下载和运行其他发行版的镜像。\n\nTest Drive 的编写方式使得即使是非技术的 Ubuntu\
  \ 用户也能持续地测试 Ubuntu 的开发版本。Test Drive 以 `testdrive` 的形式存在 Ubuntu 仓库中。它通过命令行运行，尽管一个图形界面（GUI）前端正在开发中，可能在本书出版时可用。\n\
  \n当你运行该程序时，会看到一个菜单：\n\n```\nmatthew@seymour:~$ testdrive\n\nWelcome to Testdrive!\n\
  \n  1. Ubuntu Desktop (oneiric-amd64)\n\n      +-cache--> [2011-07-24 00:08:09]\
  \ oneiric-desktop-amd64.iso\n\n  2. Ubuntu Desktop (oneiric-i386)\n      +-cache-->\
  \ [2011-07-24 00:08:09] oneiric-desktop-i386.iso\n\n  3. Ubuntu Alternate (oneiric-amd64)\n\
  \  4. Ubuntu Alternate (oneiric-i386)\n  5. Ubuntu DVD (oneiric-amd64)\n  6. Ubuntu\
  \ DVD (oneiric-i386)\n  7. Ubuntu Server (oneiric-amd64)\n  8. Ubuntu Server (oneiric-i386)\n\
  \  9. Other (prompt for ISO URL)\n\nSelect an image to testdrive [1]:\n```\n\n输入数字来下载并运行特定的\
  \ ISO。如你所见，上面的示例来自 Oneric Ocelot 的开发周期，它最终变成了 Ubuntu 11.10。\n\nTest Drive 的配置存储在一个简单的文本文件中，易于理解和编辑（尽管许多使用\
  \ Test Drive 的人可能永远不需要编辑它）。Test Drive 会在多个位置查找 `testdriverc` 文件，包括默认位置 `/etc/testdriverc`\
  \ 以及用户 `/home` 目录下的 `/home/matthew/.testdriverc` 和 `/home/matthew/.config/testdrive/testdriverc`。\n\
  \n这是一个示例：\n\n```\n# This is the global configuration file for the testdrive(1) utility.\n\
  \n[testdrive-common]\n\n# CACHE 是用于缓存 ISO 和磁盘镜像的目录\n# Default: $HOME/.cache/testdrive\n\
  #CACHE = /path/to/your/cache\n\n# CACHE_IMG 和 CACHE_ISO 将分别默认为 $CACHE/img 和 $CACHE/iso。\n\
  # 如果你需要，可以显式设置（特别是当你尝试\n# 从 /dev/shm 运行镜像时，这很有趣。请确保那里有足够的空间！！！）\n#CACHE_IMG = /dev/shm\n\
  \n# CLEAN_DIG 将运行结束时删除刚刚生成的镜像。默认情况下，\n# 镜像会被保留，除非没有发生更改（即创建了磁盘镜像，但实际上没有尝试安装）。\n\
  # 如果从 /dev/shm 运行镜像，则默认将删除镜像\n#（内存是受限的资源，我们不应过度分配它）\n#CLEAN_IMG = False\n\n# VIRT\
  \ 是要使用的虚拟机管理器类型\n# VIRT 可以是 'kvm'、'virtualbox' 或 'parallels' 之一\nVIRT = kvm\n#VIRT\
  \ = virtualbox\n#VIRT = parallels\n\n# MEM 是给虚拟机客体的内存大小（单位为 MB）\n# Default: 384\n\
  MEM = 384\n#MEM = 512\n#MEM = 1024\n\n# 如果在 KVM 中运行，SMP 是给虚拟机客体的处理器数量\n# 默认值是主机的\
  \ CPU 数量\n#SMP = 1\n\n# DISK_SIZE 是磁盘镜像的大小\n# 注意这是一个稀疏 qcow2 文件，因此它在文件系统中\n# 实际上不会占用那么多空间。\n\
  # Default: 6G\nDISK_SIZE = 6G\n#DISK_SIZE = 10G\n```\n\n\n\n\n虽然 Perl 最初被设计为一种数据提取和报告生成的语言，但它深受许多\
  \ Linux 系统管理员的青睐，因为它可以用于创建填补 shell 脚本能力与编译 C 程序之间空白的程序（参见第 13 章“自动化任务与 Shell 脚本](#ch13.html_ch13)”以及第\
  \ 39 章“Ubuntu 的 C/C++ 编程工具”）。Perl 相比其他 UNIX 工具的另一个优势是它可以处理并从二进制文件中提取数据，而 `sed` 和\
  \ `awk` 则不能。\n\n***\n\n### 注意\n\n在 Perl 中，“事情有多种方法”（there is more than one way to\
  \ do it）。这是 Perl 的非官方格言，它出现的频率之高通常缩写为 `TIMTOWTDI`。\n\n***\n\n### 简介\n\n你可以在 shell\
  \ 命令行中使用 Perl 执行单行程序，但大多数程序（通常以 `.pl` 结尾）是作为命令运行的。这些程序通常可以在任何计算机平台上运行，因为 Perl 已经移植到几乎每一个操作系统。\n\
  \nPerl 程序用于支持许多 Ubuntu 服务，例如系统日志。例如，如果你安装了 `logwatch` 软件包，`logwatch.pl` 程序会在每天早上\
  \ 6:25 由系统上的 `crond`（调度）守护进程运行。Perl 支持的其他 Ubuntu 服务还包括：\n\n• 用于本地和网络备份的 Amanda\n\
  • 使用 `faxrunqd` 程序进行传真打印\n• 由 Perl 文档过滤程序支持的打印\n• 使用 `sensors-detect` Perl 程序设置硬件传感器监控\n\
  \n#### Perl 版本\n\n截至本文，来自 Perl 网站的 Perl 当前生产版本是 5.14.1（即 `Perl version 5 point 14,\
  \ patch level 1`）。这是 Ubuntu 11.10 发布代码冻结时提供的版本，也是 Ubuntu 软件仓库中提供的版本。Perl 是默认安装的。\n\
  \n如果你愿意，可以从 [www.perl.com](http://www.perl.com) 下载代码并从源码构建最新版本，尽管 Ubuntu 以及大多数（所有所有？）Linux\
  \ 和类 Unix 发行版（包括 Mac OS X）已经默认安装了稳定且高质量的 Perl。更新版本可能会出现在 Ubuntu 软件仓库中，但通常只有可以通过更新系统来安装的安全修复。参见第\
  \ 9 章“管理软件](#ch09.html_ch09)”查看如何快速获取 Ubuntu 可用更新列表。\n\n你可以通过在 shell 提示符处输入 `perl\
  \ -v` 来确定安装了什么版本的 Perl。如果你正在安装最新的 Ubuntu 发行版，你应该拥有在你的 Ubuntu 版本软件收集和定稿时提供的最新 Perl\
  \ 版本。\n\n#### 一个简单的 Perl 程序\n\n本节介绍了一个非常简单的 Perl 程序示例，帮助你开始使用 Perl。虽然对于经验 Perl 高手来说这微不足道，但对于想要学习更多\
  \ Perl 的新用户来说，一个短小的示例是必要的。\n\n为了让你了解 Perl 编程的绝对基础，列表 36.1 演示了一个打印短信息的简单 Perl 程序。\n\
  \n列表 36.1 一个简单的 Perl 程序\n\n***\n\n```perl\n#!/usr/bin/perl\n\nprint \"Look at all\
  \ the camels!\\n\";\n```\n\n***\n\n输入该内容并保存为名为 `trivial.pl` 的文件。然后使用 `chmod` 命令（见下侧边栏）使该文件可执行，并在命令行提示符运行它。\n\
  \n***\n\n### 命令行错误\n\n如果你收到消息 `bash: trivial.pl: command not found` 或 `bash: ./trivial.pl:\
  \ Permission denied`，说明你要么输入的命令行不正确，要么忘记了使用 `chmod` 命令将 `trivial.pl` 设置为可执行：\n\n\
  ```bash\nmatthew@seymour:~$ chmod +x trivial.pl\n```\n\n你可以按照如下方式强制在当前目录执行命令：\n\n\
  ```bash\nmatthew@seymour:~$ ./trivial.pl\n```\n\n或者你可以像这样用 Perl 运行程序：\n\n```bash\n\
  matthew@seymour:~$ perl trivial.pl\n```\n\n列表中的示例程序是一个两行的 Perl 程序。输入程序并运行它（使用 Perl\
  \ 或将程序设为可执行）展示了如何创建你的第一个 Perl 程序，全球的 Linux 用户每天都在重复这一过程。\n\n***\n\n***\n\n### 注意\n\
  \n`#!` 通常被读作 `she-bang`，它是 `sharp`（音乐家对 `#` 字符的名称）和 `bang`（感叹号的另一个名称）的缩写。这种表示也用于\
  \ shell 脚本。有关编写 shell 脚本的更多信息，请参见第 13 章“自动化任务与 Shell 脚本](#ch13.html_ch13)”\n\n***\n\
  \n`#!` 行技术上完全不是 Perl 代码的一部分。`#` 字符表示该行的剩余部分是注释。注释是给 shell 的信息，告诉它应该去哪里寻找运行此程序的可执行文件。解释器会忽略注释行。\n\
  \n这种做法的例外包括 `#` 字符位于引号字符串中，以及它被用作正则表达式的分隔符。注释对于记录你的脚本有用，如下：\n\n```perl\n#!/usr/bin/perl\n\
  \n# 一个简单的打印问候的示例\n\nprint \"hello there\\n\";\n```\n\n代码块（例如可能出现在循环或条件语句分支中的代码）用大括号\
  \ (`{}`) 表示。例如，这里有一个无限循环：\n\n```perl\n#!/usr/bin/perl\n\n# 一个简单的打印问候的示例\n\nwhile\
  \ (1) {\n    print \"hello there\\n\";\n}\n```\n\nPerl 语句以分号（`;`）结束。由于 Perl 不关心空白字符，Perl\
  \ 语句可以跨越多行。`\\n` 是换行的转义序列。\n\n***\n\n### 提示\n\n使用 `perldoc` 和 `man` 命令是获取有关已安装 Perl\
  \ 版本更多信息的简单方法。要学习如何使用 `perldoc`，请输入：\n\n```bash\nmatthew@seymour:~$ perldoc\n```\n\
  \n要获取关于 Perl 的介绍信息，你可以使用这两个命令中的任意一个：\n\n```bash\nmatthew@seymour:~$ perldoc perl\n\
  matthew@seymour:~$ man perl\n```\n\n获取 Perl 文档的概述或目录，请使用 `perldoc` 命令，如下所示：\n\n\
  ```bash\nmatthew@seymour:~$ perldoc toc\n```\n\n文档非常详尽且组织良好。Perl 包含了许多手册页作为简要指南，但学习更多\
  \ Perl 的方法可能是阅读它的 `perlfunc` 文档，它列出了所有的 Perl 函数及其用法。你可以通过使用 `perldoc` 脚本并在命令行输入\
  \ `perldoc perlfunc` 查看此文档。你也可以在线访问 [`perldoc.perl.org/perlfunc/`](http://perldoc.perl.org/perlfunc/)\
  \ 找到文档。\n\n***\n\n### Perl 变量与数据结构\n\nPerl 是一种弱类型语言，意味着它不要求你声明数据类型（例如存储在特定变量中的值的类型）。例如，C\
  \ 语言要求你声明某个特定变量是整数、字符、结构或其他任何类型。Perl 变量可以是任何需要的类型，并在需要时更改类型。\n\n#### Perl 变量类型\n\
  \nPerl 有三种变量类型：*标量、数组*和*哈希*。使用不同的字符表示每种变量类型，因此你可以同时对每个类型使用相同的名称。\n\n标量变量用 `$` 字符表示，例如\
  \ `$penguin`。标量可以是数字或字符串，根据需要可以在它们之间切换类型。如果你将数字视为字符串，它就变成了字符串。如果你将字符串视为数字，如果这样做合理，它会被转换为数字；否则，它通常求结果为\
  \ `0`。例如，字符串 `\"76trombones\"` 在数值计算中会被求评为数字 `76`，但字符串 `\"polar bear\"` 的求值为 `0`。\n\
  \n\n\n\n\nPerl 数组用 `@` 符号表示，例如 `@fish`。`array`（数组）是一个通过索引数字引用的列表，从第一个元素的编号 `0` 开始，就像在\
  \ `C` 和 `awk` 中一样。数组中的每个元素都是标量值（scalar value）。由于标量值用 `$` 符号表示，数组中的单个元素也用 `$` 符号表示。\n\
  \n例如，`$fish[2]` 指向 `@fish` 数组中的第三元素。这会让一些人感到困惑，但类似于 `C` 中的数组，其中第一个数组元素是 `0`。\n\n\
  哈希（Hashes）用 `%` 符号表示，例如 `%employee`。`hash` 是键值对列表。哈希中的单个元素通过名称而不是索引引用（不像数组）。同样，由于值是标量，单个元素使用\
  \ `$` 符号。\n\n例如，`$employee{name}` 从哈希中为你获取一个值。处理哈希的两个有用函数是 `keys` 和 `values`。`keys`\
  \ 函数返回一个包含哈希所有键（keys）的数组，而 `values` 返回一个哈希所有值（values）的数组。使用这种方法，列表 36.2 中的 Perl\
  \ 程序将显示环境中的所有值，就像输入 `bash` 终端的 `env` 命令一样。\n\n#### 列表 36.2 显示 `env` 哈希的内容\n\n```\n\
  #!/usr/bin/perl\n\nforeach $key (keys %ENV)  {\n\n  print \"$key = $ENV{$key}\\\
  n\";\n\n}\n```\n\n### 特殊变量\n\nPerl 拥有多种特殊变量，它们通常看起来像标点符号——`$_`、`$!`、`and $]`——并且对于简写代码极其有用。`$_`\
  \ 是默认变量，`$!` 是操作系统返回的错误消息，而 `$]` 是 Perl 版本号。\n\n`$_` 也许是这些变量中最有用的。你将在本章经常看到该变量。`$_`\
  \ 是 Perl 的默认变量，在没有指定参数时使用。例如，以下两个语句是等价的：\n\n```\nchomp;\nchomp($_);\n```\n\n以下循环是等价的：\n\
  \n```\nfor $cow (@cattle) {\n    print \"$cow says moo.\\n\";\n}\n\nfor (@cattle)\
  \         {\n    print \"$_ says moo.\\n\";\n}\n```\n\n要查看特殊变量的完整列表，请参阅 `perlvar`\
  \ 手页。\n\n### 运算符\n\nPerl 支持多种执行各种操作的运算符。有 `comparison`运算符（如其名所示，用于比较值）、`compound`运算符（用于组合操作或多次比较）、`arithmetic`运算符（用于执行数学运算）以及特殊的字符串常量。\n\
  \n#### 比较运算符\n\nPerl 使用的比较运算符与 `C`、`awk` 和 `csh` 终端使用的类似，用于指定和比较值（包括字符串）。比较运算符通常用在\
  \ `if` 语句或循环。Perl 拥有用于数字和字符串的比较运算符。表 36.1 显示了数值比较运算符及其行为。\n\n**表 36.1 Perl 中的数值比较运算符**\n\
  \n![Image](img/36tab01.jpg)\n\n表 36.2 显示了字符串比较运算符及其行为。\n\n**表 36.2 Perl 中的字符串比较运算符**\n\
  \n![Image](img/36tab02.jpg)\n\n#### 复合运算符\n\nPerl 使用复合运算符，类似于 `C` 或 `awk` 中的运算符，它们可以将其他操作（如比较或算术）组合成更复杂的逻辑形式。表\
  \ 36.3 显示了复合模式运算符及其行为。\n\n**表 36.3 Perl 中的复合模式运算符**\n\n![Image](img/36tab03.jpg)\n\
  \n#### 算术运算符\n\nPerl 支持多种数学运算。表 36.4 总结了这些运算符。\n\n**表 36.4 Perl 算术运算符**\n\n![Image](img/36tab04.jpg)\n\
  \n你也可以在算术语句中使用比较运算符（如 `==` 或 `<`）和复合运算符（`&&`、`||` 和 `!`）。它们在为 `false` 时求值为 `0`，在为\
  \ `true` 时求值为 `1`。\n\n#### 其他运算符\n\nPerl 支持许多不属于上述任何类别的运算符。表 36.5 总结了这些运算符。\n\n\
  **表 36.5 其他 Perl 运算符**\n\n![Image](img/36tab05.jpg)\n\n除了逗号运算符和条件表达式外，这些运算符也可以与赋值运算符一起，类似于加法（`+`）可以与赋值（`=`）组合得到\
  \ `+=`。\n\n#### 特殊字符串常量\n\nPerl 支持具有特殊含义或无法从键盘输入的字符串常量。\n\n表 36.6 显示了 Perl 支持的大多数常量。\n\
  \n**表 36.6 Perl 特殊字符串常量**\n\n![Image](img/36tab06.jpg)\n\n### 条件语句：`if` 和 `else`\n\
  \nPerl 提供了两个条件语句，`if` 和 `unless`，它们的功能相反。`if` 允许你在满足某些条件时执行代码。相反，`unless` 在某些条件不满足时执行语句。\n\
  \n#### `if`\n\n`if/else` 的语法如下：\n\n```\nif (condition) {\n  statement(s)\n} elsif\
  \ (condition) {\n  statement of code\n} else {\n  statement of code\n}\n```\n\n\
  `condition` 是一个返回 `true` 或 `false` 的测试。例如，列表 36.3 使用了 `if/else` 结构：\n\n```\n列表 36.3\
  \ if/else\nif ($favorite eq \"chocolate\") {\n  print \"I like chocolate too.\\\
  n\";\n} elsif ($favorite eq \"spinach\") {\n  print \"Oh, I do not like spinach.\\\
  n\";\n} else {\n  print \"Your favorite food is $favorite.\\n\";\n}\n```\n\n####\
  \ `unless`\n\n`unless` 的工作方式与 `if` ，只是方向相反。当条件为 `false` 时，`unless` 执行语句：\n\n```\n\
  unless ($name eq \"Rich\") {\n  print \"Go away, you're not allowed here!\\n\";\n\
  }\n```\n\n注意：你可以用更自然的语言重述前面的示例，例如：\n\n`print \"Go away!\\n\" unless $name eq \"\
  Rich\";`\n\n### 循环\n\n*loop*（循环）是多次重复程序操作的方法。一个简单的例子是倒计时器，在告诉你蛋煮好了之前执行 30 次任务（等待秒）。\n\
  \n循环结构（也称为控制结构）可以用于在某些条件适用时迭代代码块，或者当代码遍历（评估）值列表时进行，可能将该列表作为参数。Perl 拥有四种循环结构：`for`、`foreach`、`while`\
  \ 和 `until`。\n\n#### `for`\n\n`for` 结构根据一组定义的条件执行 `statement`（代码块）：\n\n```\nfor\
  \ (start condition; end condition; increment function) {\n  statement(s)\n}\n```\n\
  \n`start` 条件在循环开始时设置。每次执行循环时，都会执行 `increment` 函数，直到达到结束条件。这看起来非常传统的 `for/next` 循环。以下代码是\
  \ `for` 循环的示例：\n\n```\nfor ($i=1; $i<=10; $i++) {\n  print \"$i\\n\"\n}\n```\n\n\
  #### `foreach`\n\n`foreach` 结构为列表或数组中的每个元素执行语句块：\n\n```\n@names = (\"alpha\",\"\
  bravo\",\"charlie\");\n\nforeach $name (@names) {\n  print \"$name sounding off!\\\
  n\";\n}\n```\n\n\n\n\n循环变量 `($name`（在示例中）不仅仅是被赋值为数组元素的值；它还是该元素的别名。这意味着如果你修改了循环变量，你实际上是在修改数组。如果没有指定循环数组，则可以使用\
  \ Perl 的默认变量 `$_`：\n\n```perl\n@names = (\"alpha\",\"bravo\",\"charlie\");\n\nforeach\
  \ (@names) {\n  print \"$_ sounding off!\\n\";\n}\n```\n\n这种语法可能非常方便，但也可能导致代码不可读。请为以后要维护你代码的可怜人考虑一下（那可能就是你自己）。\n\
  \n***\n\n### Note\n\n`foreach` 经常被缩写为 `for`。\n\n***\n\n### `while`\n\n`while` 只要特定条件为真，就会执行一个语句块：\n\
  \n```perl\nwhile ($x<10) {\n      print \"$x\\n\";\n      $x++;\n}\n```\n\n记住，条件可以是任何返回真值或假值的表达式。例如，它可以是一个函数调用：\n\
  \n```perl\nwhile ( InvalidPassword($user, $password) ) {\n      print \"You've entered\
  \ an invalid password. Please try again.\\n\";\n      $password = GetPassword;\n\
  }\n```\n\n### `until`\n\n`until` 是 `while` 语句的完全相反。只要特定条件为假（或者说，直到它变为真），它就会执行一个语句块：\n\
  \n```perl\nuntil (ValidPassword($user, $password)) {\n  print \"YSdpgm_m Sdpgm_m\
  \ You have entered an invalid password. Please try again.\\n\";\n  $password = GetPassword;\n\
  }\n```\n\n### `last` 和 `next`\n\n你可以使用 `last` 语句强制 Perl 提前结束循环。`last` 类似于 C 语言的\
  \ `break` 命令；退出循环。如果你决定在不结束循环本身的情况下跳过循环的剩余内容，可以使用 `next`，它类似于 C 语言的 `continue` 命令。遗憾，这些语句对\
  \ `do ... while` 不起。\n\n不过，你可以使用 `redo` 跳转到循环（由标签标记）或跳转到调用它的它的循环内部：\n\n```perl\n\
  $a = 100;\n\nwhile (1) {\n  print \"start\\n\";\n  TEST: {\n    if (($a = $a / 2)\
  \ > 2) {\n      print \"$a\\n\";\n      if (--$a < 2) {\n        exit;\n      }\n\
  \      redo TEST;\n    }\n  }\n}\n```\n\n在这个简单的示例中，变量 `$a` 在无尽循环中被反复操作和测试。单词 *start*\
  \ 只会被打印一次。\n\n### `do ... while` 和 `do ... until`\n\n`while` 和 `until` 循环首先评估条件。通过在条件之前应用\
  \ `do` 块，改变了这种行为。使用 `do` 块时，条件最后被评估，这导致块的内容至少执行一次（即使条件为假）。这与 C 语言中的 `do ... while\
  \ (conditional)` 语句相似。\n\n### 正则表达式\n\nPerl 最强大的地方在于文本和文件操作，这是通过使用 `regular expression\
  \ (regex)` 库实现的。正则表达式与与 shell 的通配符处理和文件名扩展功能完全不同（请参见 第 13 章，“自动化任务和 Shell 脚本`），它允许高效且轻松地完成复杂的模式匹配和替换。\n\
  \n例如，以下代码行将文本行中每次出现的字符串 `bob` 或字符串 `mary` 替换为 `fred`：\n\n```perl\n$string =~ s/bob|mary/fred/gi;\n\
  ```\n\n在不涉及过多细节的情况下，表 36.7 解释了上述行的含义。\n\n表 36.7 对 `$string =~ s/bob|mary/fred/gi;`\
  \ 的解释\n\n![Image](img/36tab07.jpg)\n\n如果你对细节感兴趣，可以在命令行中输入 `man 7 regex` 通过 man 手页的\
  \ regex (7) 部分获取更多信息。\n\n尽管将一个字符串替换为另一个字符串似乎是一项相当细微的任务，但在其他语言（例如 C）中完成相同工作所需的代码是相当令畏的，除非有外部库额外子程序的支持。\n\
  \n### 访问 Shell\n\nPerl 可以通过 `\\` 语法向 shell 输入命令，为你执行你通常可能执行的任何过程。例如，列表 36.4 中的代码打印了目录列表。\n\
  \n列表 36.4 使用反引号访问 Shell\n\n***\n\n```perl\n$curr_dir = 'pwd';\n\n@listing = 'ls\
  \ -al';\n\nprint \"Listing for $curr_dir\\n\";\n\nforeach ($file (@listing) {\n\
  \  print \"$file\";\n}\n```\n\n***\n\nNote\n\n`\\` 语法使用上述位于按键上方的反引号\n\n***\n\n```perl\n\
  use Shell;\n```\n\n***\n\n```perl\n$rc = 0;\n\nif ($rc == 0) {\n  print \"system\
  \ succeeded\";\n} else {\n  print \"system failed\";\n}\n```\n\n***\n\n```perl\n\
  perl -MCPAN -e shell\n```\n\n***\n\n```perl\nuse qw(cp);\n```\n\n```perl\ncp;\n\
  ```\n\n***\n\n```perl\nuse Time::CTime;\n```\n\n***\n\n```perl\nsystem('cp /home/httpd/logs/access.log\
  \ /tmp/httpd.log');\n```\n\n***\n\n```perl\n$rc = system('cp /home/httpd/logs/access.log\
  \ /tmp/httpd.log')\n== 0 or die \"system failed: ?\";\n```\n\n***\n\n### 代码示例\n\n\
  以下章节包含了一些你可能想用 Perl 运行的一些示例。\n\n#### 发送邮件\n\n\n\n\n你可以通过多种方式让 Perl 发送电子邮件。经常看到的一种方法是打开指向\
  \ `sendmail` 命令的管道（pipe）并向其发送数据（如 Listing 36.5 所示）。另一种方法是使用 `Mail::Sendmail` 模块（可以通过\
  \ CPAN 获取），它直接使用 socket 连接发送邮件（如 Listing 36.6 所示）。后者速度更快，因为不需要启动外部进程。请注意，为了让 Listing\
  \ 36.5 中的 Perl 程序正常工作，你的系统中必须运行着 `sendmail`。\n\n### 列表 36.5 使用 `Sendmail` 发送邮件\n\
  \n```perl\n#!/usr/bin/perl\n\nopen (MAIL, \"| /usr/sbin/sendmail -t\"); # 使用 -t\
  \ 防止用户恶意滥用\n\nprint MAIL <<EndMail;\n\nTo: you\\\n\nFrom: me\\\n\n_____________________________________________________________________________\n\
  Subject: A Sample Email\\nSending email from Perl is easy!\\n\n\n.\n\nEndMail\n\n\
  close MAIL;\n```\n\n### 注意事项\n\n电子邮件地址中的 `@` 符号必须经过转义，否则 Perl 会尝试将其评估为同名的数组。也就是说，`dpitts@mk.net`\
  \ 会导致问题，因此你需要使用 `dpitts\\@`。\n\n用于打印邮件消息的语法被称为 *here document*（在此文档/字符串）。其语法如下：\n\
  \n```perl\nprint <<EndText;\n\n.....\n\nEndText\n```\n\n`EndText` 的值在块的开始和结束处必须完全一致，包括任何空白字符。\n\
  \n### 列表 36.6 使用 `Mail::Sendmail` 模块发送邮件\n\n```perl\n#!/usr/bin/perl\n\nuse Mail::Sendmail;\n\
  \n%mail = ( To => 'you@there.com',\n\n  From => 'me@here.com',\n  Subject => 'A\
  \ Sample Email\",\n  Message => \"This is a very short message\"\n  );\n\nsendmail(%mail)\
  \ or die $Mail::Sendmail::error;\n\nprint \"OK. Log says:\\n\", $Mail::Sendmail::log;\n\
  use Mail::Sendmail;\n```\n\nPerl 会忽略哈希中最后一个元素后的逗号。将其留在那里是很方便的；如果你想向哈希中添加项，则不需要添加逗号。这纯粹是一个风格决定。\n\
  \n### 使用 Perl 安装 CPAN 模块\n\n你可以使用 `-M` 和 `-e` 命令通过 Perl 交互式地从 CPAN 存档中下载并安装 Perl\
  \ 模块。使用如下的 Perl 命令启动该过程：\n\n```bash\nperl -MCPAN -e shell\n```\n\n当你按下回车键时，你会看到一些介绍信息，并被要求选择初始的自动或手动配置，这在任何下载或安装之前都是必须的。输入\
  \ `no` 并按回车，让 Perl 自动为下载和安装过程进行配置；或者如果你愿意，只需按回车手动配置下载和安装。如果你使用手动配置，则必须回答一系列关于路径、缓存、终端设置、程序位置等的问题。设置将保存在当前目录下名为\
  \ `.cpan` 的目录中。\n\n完成后，你将看到 CPAN 提示符：\n\n```bash\ncpan>\n```\n\n要让 Perl 检查你的系统，然后下载并安装大量模块，请使用\
  \ `install` 关键字，在提示符处指定 Bundle，然后按回车，如下：\n\n```bash\ncpan> install Bundle::CPAN\n\
  ```\n\n要下载所需的模块（使用 Listing 36.6 中的示例），使用如下 `get` 关键字：\n\n```bash\ncpan> get Mail::Sendmail\n\
  ```\n\n模块的源码将被下载到 `.cpan` 目录中。你可以使用 `install` 关键字构建并安装该模块，如下：\n\n```bash\ncpan>\
  \ install Mail::Sendmail\n```\n\n获取、构建和安装模块的整个过程也可以通过 Perl 的 `-e` 选项在命令行完成，如下：\n\
  \n```bash\nperl -MCPAN   -e \"install Mail::Sendmail\"\n```\n\n另外注意，在单引号（‘ ’）内不需要转义\
  \ `@` 符号。Perl 不会在单引号内进行*变量插值*（评估变量），但在双引号和 here strings（类似于 `<<` shell 操作）内会进行插值。\n\
  \n#### 清理日志\n\n许多程序维护着各种日志。通常，日志中的许多信息是冗余的或毫无用处的。Listing 36.7 显示的程序会从文件中包含特定单词或短语的所有行，因此可以清除你认为不重要的行。例如，你可能移除\
  \ Apache 错误日志中所有源自你的测试客户端机器的行，因为你知道那些错误信息是在测试期间产生的。\n\n### 列表 36.7 清理日志文件\n\n```perl\n\
  #!/usr/bin/perl\n\n# 使用此程序要小心！\n# 这将移除包含给定单词的所有行\n# 用法:  remove <word> <file>\n\n\
  $word=@ARGV[0];\n$file=@ARGV[1];\n\nif ($file)  {\n  # 打开文件读取\n  open (FILE, \"\
  $file\") or die \"Could not open file: $!\";      @lines=<FILE>;\n  close FILE;\n\
  \  # 打开文件写入\n  open (FILE, \">$file\") or die \"Could not open file for writing:\
  \ $!\";\n  for (@lines)  {\n    print FILE unless /$word/;\n  } # End for\n  close\
  \ FILE;\n} else {\n  print \"Usage:  remove <word> <file>\\n\";\n}  #  End if...else\n\
  ```\n\n该代码使用了几个地道的 Perl 表达式来保持简洁。它使用 `<FILE>` 符号将文件读入数组中；除非行与命令行上给出的模式匹配，否则它会将行写回文件。\n\
  \n如果 `open` 语句失败，`die` 函数会杀死程序操作并显示错误消息。错误消息中的 `$!`（在特殊变量章节中提到）是操作系统返回的错误消息。它很可能是类似\
  \ `'file not found'` 或 `'permission denied'`。\n\n#### 发布到 Usenet\n\n如果你工作中的某部分需要定期发布到\
  \ Usenet——例如发布一个 FAQ 列表——那么下面的 Perl 程序可以为你自动完成这一过程。在代码示例中，发布的文本是从一个文本文件中读取的，但你的输入可以来自任何地方。\n\
  \nListing 36.8 显示的程序使用了 `Net::NNTP` 模块，它是发行版的一部分。你可以通过命令行输入 `'perldoc Net::NNTP'`\
  \ 获取关于该模块的更多文档。\n\n### 列表 36.8 向 Usenet 发布文章\n\n```perl\n#!/usr/bin/perl\n\n# 加载数据到\
  \ @post\nopen (POST, \"post.file\");\n@post = <POST>;\nclose POST;\n\n# 导入 NNTP\
  \ 模块\nuse Net::NNTP;\n$NNPhost = 'news';\n# 尝试连接远程主机\n# 失败时打印错误消息\n$nntp = Net::NNTP->new($NNPhost)\n\
  \  or die \"Cannot contact $NNPhost: $!\";\n# $nntp->debug(1);\n$nntp->post()\n\
  \  or die \"Could not post article: $!\";\n# 发送文章头部\n$nntp->datasend(\"Newsgroups:\
  \ news\\n\");\n$nntp->datasend(\"Subject: FAQ - Frequently Asked Questions\\n\"\
  );\n$nntp->datasend(\"From: ADMIN <root\\\n$nntp->datasend(\"\\n\\n\");\n# 为 @post\
  \ 数组中的每一行发送它\nfor (@post)     {\n  $nntp->datasend($_);\n} # End for\n$nntp->quit;\n\
  ```\n\n#### 单行命令\n\nPerl 擅长的一种媒介是单行命令。人们极力将任务简化为一行 Perl 代码。Perl 有一个颇不实际的难读之名。事实是，你可以在任何语言中写出难读的代码。Perl\
  \ 允许用多种方法实现某些功能，这自然会导致人们尝试最晦奥的方法。\n\n以 Randal Schwartz 命名的施瓦茨变换（Schwartz transform）是一种以非明显方式排序数组的方法。`sort`\
  \ 函数按字母顺序排序数组；这非常显而易见。如果你想按第三个单词按字母顺序对字符串数组排序呢？你可能想要更有用的，例如按文件大小对文件列表排序？施瓦茨变换创建一个包含你想排序的信息的新列表，并引用原始列表。这里是一个按长度排序字符串的简单示例：\n\
  \n```perl\n@sorted_by_length =\n```\n\n\n\n\n```perl\nmap { $_ => [0] }        \
  \     # 原始列表\nsort { $a=>[1] <=> $b=>[1] } # 按转换后的值排序\nmap { [$_, length($_)] }\
  \  # 映射为元素长度列表\n@list;\n```\n\n由于每个操作符作用于其立即右侧的内容，因此从右到左（或从下到上，按照这里的书写方式）阅读它会很有帮助。\n\
  \n第一个作用于列表的是 `map` 操作符。它将列表转换为哈希表（hash），其中键（keys）是列表元素，值（values）是每个元素的长度。在这里你可以放入用于排序的转换代码。\n\
  \n下一个操作符是 `sort` 函数，它根据值对列表进行排序。\n\n最后，通过提取键将哈希表转换回数组。现在，该数组已经处于所需的顺序了。\n\n## 命令行处理\n\
  \nPerl 非常擅长解析各种程序的输出。许多人使用如 `awk` 和 `sed` 等工具完成这项任务。Perl 为你执行这些任务提供了更丰富的词汇。下面的示例非常简单，但它说明了你如何使用\
  \ Perl 切分某些输出并对其处理。在示例中，Perl 被用于列出所有大于 10KB 的文件：\n\n```bash\nmatthew@seymour:~$\
  \ ls -la | perl -nae 'print \"$F[8] is $F[4]\\n\" if $F[4] > 10000;'\n```\n\n`-n`\
  \ 切换表示我想对输出的每一行运行 Perl 代码。`-a` 切换自动将输出分割为 `@F` 数组。`-e` 切换表示 Perl 代码将跟在命令行。\n\n###\
  \ 相关的 Ubuntu 和 Linux 命令\n\n在 Linux 上使用 Perl 时，你会用到这些命令和工具：\n\n- `a2p`—一个用于将 `awk`\
  \ 脚本转换为 Perl 的过滤器。\n- `find2perl`—一个用于使用 `find` 命令从命令行创建 Perl 代码的实用。\n- `perldoc`—一个用于读取\
  \ Perl 文档的 Perl 工具。\n- `s2p`—一个用于将 sed 脚本转换为 Perl 的过滤器。\n- `vi`—`vi`（实际上是 `vim`）文本编辑器。\n\
  \n#### 参考文献\n\n- *Sams Teach Yourself Perl in 21 Days, Second Edition*, by Laura\
  \ Lemay, Sams Publishing.\n- *Sams Teach Yourself Perl in 24 Hours, Second Edition*,\
  \ by Clinton Pierce, Sams Publishing.\n- *Learning Perl, Third Edition*, by Randal\
  \ L. Schwartz, Tom Phoenix, O’Reilly & Associates.\n- *Programming Perl, Third Edition*,\
  \ by Larry Wall, Tom Christiansen, and Jon Orwant, O’Reilly & Associates.\n- *Effective\
  \ Perl Programming: Writing Better Programs with Perl*, by Joseph Hall, Addison-Wesley\
  \ Publishing Company.\n- *Mastering Regular Expressions*, by Jeffrey Friedl, O’Reilly\
  \ & Associates.\n- **[www.perl.com](http://www.perl.com)**—这是查找关于 Perl 各种信息的地方，从历史、文化到实用的提示。这里也是为你的系统下载\
  \ Perl 解释器的地方。\n- **[`cpan.perl.org`](http://cpan.perl.org)**—CPAN 是寻找 Perl 模块和程序的地方。如果你用\
  \ Perl 编写了你认为特别有东西，可以将其提供给 Perl 社区。\n- **[`perldoc.perl.org/index-faq.html`](http://perldoc.perl.org/index-faq.html)**—常见\
  \ Perl 查询的 FAQ 索引；该网站提供了快速搜索 Perl 问题答案的方便方法。\n- **[`learn.perl.org`](http://learn.perl.org)**—在线学习\
  \ Perl 的地方之一。如果你掌握了 Perl，请去 [`jobs.perl.org`](http://jobs.perl.org)。\n- **[www.pm.org](http://www.pm.org)**—Perl\
  \ Mongers 是本地 Perl 用户组。你所在的地区可能有一个。Perl 倡导网站是 [www.perl.org](http://www.perl.org)。\n\
  \n## 第 37 章：使用 PHP\n\n### 本章内容\n\n- PHP 简介\n- 基础函数\n- 处理 HTML 表单\n- 数据库\n- 参考文献\n\
  \n本章向你介绍 PHP 编程的世界，从作为 Web 脚本语言和命令行工具的角度出发。PHP 最初代表 *personal home page*（个人主页），因为它是一组\
  \ Perl 脚本的集合，旨在方便创建主页上常见的留言板、公告板和其他交互脚本。然而，从那些早期开始，它接受了两次重大更新（PHP 3 和 PHP 4），以及在\
  \ PHP 5 中进行了大幅修订，而 PHP 5 是 Ubuntu 附带的版本。\n\nPHP 成功的部分在于它与数据库的强大集成——它早期的用途几乎总是利用数据库后端。在\
  \ PHP 5 中，引入了两个大的新数据存储机制：`SQLite`，这是一个强大的本地数据库系统；以及 `SimpleXML`，这是一个旨在让 *可扩展标记语言\
  \ (XML)* 解析和查询变得容易的*应用程序编程接口 (API)*。正如你随着时间推移所看到的，PHP 开发者工作得非常好：`SQLite` 和 `SimpleXML`\
  \ 都易于学习和使用。\n\n#### 注意事项\n\nUbuntu 存储库提供了许多 PHP 软件包。基础包就叫 `php5`，但你可能还想添加扩展，如 `php5-ldap`、`php5-mysql`\
  \ 或 `php5-pgsql`。\n\n### PHP 简介\n\n从外观上来说，PHP 是 Java 和 Perl 的混合体，它汲取了两者的优点并成功地将其合并为一种语言。Java\
  \ 部分包括强大的面向对象系统、抛出程序异常的能力，以及这两种语言都从 C 借用的通用风格。从 Perl 借用的是“它应该就能运行”的心态，即易用性优于严谨性。因此，你会在\
  \ PHP 中发现“实现某事的方法不止一种”。这也意味着可能以不那么理想的方式或在不考虑良好安全性的情况下完成任务。许多人因此这一点而批评 PHP，但对于简单的任务，或者如果编写得当，它可以是一门非常好的语言，并且易于理解和使用，特别是对于快速创建网站。\n\
  \n#### 进入退出 PHP 模式\n\n与 PHP 的先驱不同，你将 PHP 代码嵌入到 HTML 中，而不是相反。在 PHP 之前，许多网站的大部分使用标准\
  \ HTML，通过链接到 Perl 页面来处理。有了 PHP 后，你的所有页面都可以处理并包含 HTML。这是 PHP 受受欢迎的巨大因素。\n\n每个 PHP\
  \ 文件都由 PHP 处理并寻找要执行的代码。PHP 将找到的所有文本视为 HTML，直到它发现以下四者之一：\n\n- `<?php`\n- `<?`\n-\
  \ `<%`\n- `<script language=\"php\">`\n\n第一种选项是进入 PHP 模式的首选方法，因为它保证有效。\n\n在 PHP\
  \ 模式下，你可以通过 `?>`（对应 `<?php` 和 `<?`）、`%>`（对应 `<%`）或 `</script>`（对应 `<script language=\"\
  php\">`）退出。这段代码示例演示了进入和退出 PHP 模式：\n\n```\nIn HTML mode\n<?php\necho \"In PHP mode\"\
  ;\n?>\nIn HTML mode\nIn <?php echo \"PHP\"; ?> mode\n```\n\n### 变量\n\nPHP 中的所有变量都以符号开头。与许多其他语言不同，PHP\
  \ 没有不同数据类型的变量。它们都以 `$` 开头，并且可以相互转换。因此，PHP 是一种弱类型语言，这意味着你不需要声明变量包含特定类型的数据；你只需随意使用即可。\n\
  \n将列表 37.1 中的代码保存到名为 `ubuntu1.php` 的新文件中。\n\n列表 37.1 在 PHP 中测试类型\n\n```php\n<?php\n\
  $i = 10;\n$j = \"10\";\n$k = \"Hello, world\";\necho $i + $j;\necho $i + $k;\n?>\n\
  ```\n\n要运行该脚本，打开控制台并进入你保存文件的目录。然后输入此命令：\n\n```bash\nmatthew@seymour:~$ php ubuntu1.php\n\
  ```\n\n\n\n\n如果 PHP 安装正确，你应该会看到输出 `2010`，这实际上是两个结果。`20` 是 `10 + 10`（`$i` 加上 `$j`）的结果，而\
  \ `10` 是在文本字符串 `Hello, world` 上加上 10 的结果。这两个操作都不都不太直观。虽然 `$i` 被设置为数字 `10`，但 `$j`\
  \ 实际上被设置为文本值 `\"10\"`，它们并不是一回事。将 10 加上 10 得到 20 正如你所想象的那样，但给 `\"10\"`（字符串）加上 10\
  \ 则会强制 PHP 在相加之前将 `$j` 转换为整数。\n\n运行 `$i + $k` 是将另一个字符串加到一个数字，但这次字符串是 `Hello, world`\
  \ 而不仅仅是字符串中的数字。尽管如此，PHP 仍然尝试转换它，但将任何非数字字符串转换为数字都会将其转换为 `0`。因此，第二个 `echo` 语句最终输出的是\
  \ `$i + 0`。\n\n正如你现在应该猜到的那样，调用 `echo` 会将值输出到屏幕。现在，它直接打印到你的控制台，但 PHP 内部有一套复杂的输出机制，允许你打印到控制台、通过\
  \ Apache 向网络浏览器发送文本、通过网络发送数据等。\n\n现在你已经了解了 PHP 如何处理不同类型的变量，理解你所可以使用的类型选择是非常重要的，如表\
  \ 37.1 所示。\n\n### 表 37.1 PHP 变量类型\n\n![Image](img/37tab01.jpg)\n\n前四个可以被视为简单变量，后三个可以被视为复杂变量。数组仅仅是变量的集合。你可能有一个数字数组（一个班级所有孩子的年龄）；一个字符串数组（所有温布卢网球冠军的名字）；甚至可以有一个数组的数组，被称为`多维数组`。在下一节将更深入地介绍数组，因为它们在定义方式上是独特的。\n\
  \n对象用于定义和操作一组属于唯一实体的变量。每个对象都有自己的一组个人变量，以及操作这些变量的函数。对象通常用于建模现实世界中的物品。你可能会定义一个代表电视的对象，带有变量如\
  \ `$CurrentChannel`（可能是整数）、`$SupportsHiDef`（布尔值）等。\n\n在所有复杂变量中，最容易理解的是资源。PHP 有许多可用的扩展，允许你连接数据库、处理图形，甚至调用\
  \ Java 程序。因为它们都是外部系统，它们需要特有的数据类型，PHP 无法通过其他六种数据类型中的任何一种来表示。因此，PHP 将它们的自定义数据类型存储在资源中——这些数据类型对\
  \ PHP 没有意义，但可以被创建它们的外部库使用。\n\n#### 数组\n\n数组是我们 PHP 最喜爱的部分，因为它的语法智能且易于阅读，同时又能够实现你需要的强大功能。你需要了解四个术语来理解数组：\n\
  \n- 数组由许多 `elements`（元素）组成。\n- 每个元素都有一个 `key`（键），用来定义它在数组中的位置。数组中给定的键只能有一个元素。\n\
  - 每个元素都有一个 `value`（值），即与键关联的数据。\n- 每个数组都有一个 `cursor`（游标），用于指向当前的键。\n\n前三个经常使用，最后一个用得较少。数组游标将在本章后面的\
  \ `基础函数` 中介绍，但我们现在来看其他三个。在 PHP 中，你的键可以是几乎任何内容：整数、字符串、对象或其他数组。你甚至可以混合使用键，使得一个键是数组；另一个是字符串，依此类推。所有这些情况中唯一的例外是浮点数：你不能将浮点数作为数组的键。\n\
  \n向数组添加值有两种方法：使用 `[]` 运算符（它是数组特有的），以及使用 `array()` 伪函数。当你想要向现有数组添加条目时，应该使用 `[]`，而使用\
  \ `array()` 来创建一个新数组。\n\n用代码总结所有这些内容，列表 37.2 显示了一个创建一个未指定键的数组的脚本，在不带键和带有不同类型键的情况下为其添加各种项，进行一些打印，然后清除数组。\n\
  \n**列表 37.2 操作数组**\n\n```php\n<?php\n\n  $myarr = array(1, 2, 3, 4);\n\n  $myarr[4]\
  \ = \"Hello\";\n\n  $myarr[] = \"World!\";\n\n  $myarr[\"elephant\"] = \"Wombat\"\
  ;\n\n  $myarr[\"foo\"] = array(5, 6, 7, 8);\n\n  echo $myarr[2];\n\n  echo $myarr[\"\
  elephant\"];\n\n  echo $myarr[\"foo\"][1];\n\n  $myarr = array();\n\n?>\n```\n\n\
  初始数组创建了四个元素，我们为其分配了值 `1`、`2`、`3` 和 `4`。由于没有指定键，PHP 自动为我们分配键，从 0 开始递增——初始数组包含四个元素，我们为其分配了值\
  \ 1-4。随后有 `$myarr[4] = \"Hello\"`，`$myarr[] = \"World!\"`，`$myarr[\"elephant\"]\
  \ = \"Wombat\"`，`$myarr[\"foo\"] = array(5, 6, 7, 8)`，`$myarr[2]`，`$myarr[\"elephant\"\
  ]`，`$myarr[\"foo\"][1]`，`$myarr = array()`。\n\n*(Note: The repetitive sentences\
  \ in the original source text were omitted in the translation to maintain clarity,\
  \ as per standard documentation engineering practices regarding source errors).*\n\
  \n\n\n\n### 注释\n\n在代码中添加简短的注释是推荐的，而且通常是大型软件公司的要求。在 PHP 中，你有三种注释样式可供选择：`//`、`/* */`\
  \ 和 `#`。第一种（双斜杠）指示 PHP 忽略直到行尾的所有内容。第二种（斜杠和星号）指示 PHP 忽略所有内容，直到遇到 `*/`。最后一种（井号）的作用与\
  \ `//` 相似，包含它是因为它在 shell 脚本语言中很常见。\n\n此代码示例演示了 `//` 和 `/* */` 之间的区别：\n\n```php\n\
  <?php\n\n  echo \"This is printed!\";\n\n  // echo \"This is not printed\";\n\n\
  \  echo \"This is printed!\";\n\n  /* echo \"This is not printed\";\n\n  echo \"\
  This is not printed either\"; */\n\n?>\n```\n\n通常更倾向于使用 `//`，因为它是确定的。然而，使用 `/* */`\
  \ 很容易因为忘记注释的开始和结束位置而引入代码错误。\n\n***\n\n注意\n\n与认为相反，在 PHP 脚本中编写注释对脚本的执行速度几乎没有影响。如果使用代码缓存，那么极微小的速度差异会被完全消除。\n\
  \n***\n\n### 转义序列\n\n有些字符无法无法输入的，但你几乎肯定会经常需要使用其中的一些。例如，你可能想使用一个 ASCII 字符作为换行符，但你无法输入它。相反，你需要使用转义序列：`\\\
  n`。同样，你可以用 `\\r` 打印回车符。了解这二者非常重要，因为在 Windows 平台上，你需要使用 `\\r\\n` 来实现换行。如果你不计划在其他地方运行脚本，则无需担心这个问题。\n\
  \n回到我们写的第一个脚本，记得它打印了 `2010` 是因为我们添加了 `10 + 10` 然后是 `10 + 0`。我们可以使用转义序列来重写它，如下：\n\
  \n```php\n<?php\n\n  $i = 10;\n\n  $j = \"10\";\n\n  $k = \"Hello, world\";\n\n\
  \  echo $i + $j;\n\n  echo \"\\n\";\n\n  echo $i + $k;\n\n  echo \"\\n\";\n\n?>\n\
  ```\n\n这一次，PHP 在每个数字后面都打印了一个新行，这很明显输出是 `20` 和 `10` 而不是 `2010`。注意，转义序列必须在双引号中使用，因为它们在单引号中将不起作用。\n\
  \n三个常见的转义序列是：`\\\\`，意思是“忽略反斜杠”；`\\\"`，意思是“忽略双引号”；以及 `\\'`，意思是“忽略单引号”。当字符串内部包含引号时，这一点非常重要。如果我们有一个像如\
  \ `\"are you really Conan O'Brien?\"` 这样包含单引号的字符串，那么这段代码将无法工作：\n\n```php\n<?php\n\
  \n  echo 'Are you really Conan O'Brien?';\n?>\n```\n\nPHP 会看到起始引号，一直读到 `O’Brien`\
  \ 中的 `O`，然后将 `O` 之后的引号视为字符串的结束。`Brien?` 部分将看起来像一段文本片段并导致错误。在这里你有两个选择：你可以用双引号将字符串括起来，或者使用\
  \ `\\'` 对单引号进行转义。\n\n如果你选择转义路径，它看起来会像这样：\n\n`echo 'Are you really Conan O\\'Brien?';`\n\
  \n虽然它们对于短文本字符串是一种整洁的解决方案，但要小心过度使用转义序列。HTML 充满了引号，转义它们可能会变得非常混乱：\n\n`$mystring =\
  \ \"<img src=\\\"foo.png\\\" alt=\\\"My picture\\\" width=\\\"100\\\" height=\\\"\
  200\\\" />\";`\n\n在这种情况下，最好使用单引号来包裹文本，因为这样视觉上舒服得多。\n\n### 变量替换\n\nPHP 允许使用三种方法定义字符串：单引号、双引号或\
  \ heredoc 符号。这里不讨论 heredoc，因为它与另外两种方法相比相当罕见，但单引号和双引号的作用完全相同，只有一个微小的区别：变量替换。\n\n\
  考虑以下代码：\n\n```php\n<?php\n\n  $age = 25\n\n  echo \"You are \";\n\n  echo $age;\n\
  ?>\n```\n\n这种作为字符串的一部分打印变量的方法特别笨。幸运的是，如果你把变量放在字符串内部，PHP 会执行变量替换，将变量替换为它的值。这意味着我们可以这样重写代码：\n\
  \n```php\n<?php\n\n  $age = 25\n\n  echo \"You are $age\";\n?>\n```\n\n输出结果是相同的。单引号和双引号的区别在于，单引号字符串不会进行变量替换。这里有一个例子：\n\
  \n```php\n<?php\n\n  $age = 25\n\n  echo \"You are $age\";\n\n  echo 'You are $age';\n\
  ?>\n```\n\n第一个 `echo` 打印 `You are 25`，但第二个打印 `You are $age`。\n\n### 运算符\n\n现在我们有了可以处理的数据值，我们也需要一些运算符来使用。我们已经使用过\
  \ `+` 将变量相加，但 PHP 中还有许多其他运算符可以处理算术、比较、赋值和其他运算符。`Operator”（运算符）只是对执行操作（如加法或减法）的东西\
  \ Fancy 说法。然而，`operand”（操作数）对你来说可能是全新的。考虑这个操作：\n\n`$a = $b + c;`\n\n在这个操作中，`=` 和\
  \ `+` 是运算符，而 `$a`、 `$b` 和 `$c` 是操作数。除了 `+`，你已经知道 `-`（减）、`*`（乘）和 `/`（除），但表 37.2 提供了更多。\n\
  \n表 37.2 PHP 运算符\n\n![Image](img/37tab02.jpg)\n\n至少还有 10 个运算符没有列出；但公平地说，你不太可能使用它们。即使是列表中的某些运算符使用频率也很低（例如位与\
  \ `AND`）。尽管如此，位或 `OR` 运算符被经常使用，因为它允许你组合值。\n\n这是一个演示某些运算符的代码示例：\n\n```php\n<?php\n\
  \n  $i = 100;\n\n  $i++; // $i 现在是 101\n\n  $i--; // $i 现在又是 100\n\n  $i += 10;\
  \ // $i 是 110\n\n  $i = $i / 2; // $i 是 55\n\n  $j = $i; // $ $j 和 $i 都是 55\n\n\
  \  $i = $j % 11; // $i 是 0\n\n?>\n```\n\n最后一行使用了取模运算（modulus），这让一些人需要花一点精力来理解。`$i\
  \ % 11` 的结果是 `0`，因为 `$i` 被设置为 `55`，而取模的原理是将左操作数（`55`）除以右操作数（`11`）并返回余数。55 除以 11\
  \ 正好 5 次，因此余数为 0。\n\n连接运算符点号 `.` 听起来比实际要可怕：它只是将字符串连接在一起。例如：\n\n```php\necho \"Hello,\
  \ \" . \"world!\";\n\necho \"Hello, world!\" . \"\\n\";\n?>\n```\n\nPHP 中有两个这里没有涵盖但又频繁使用的“特殊”运算符。在我们看它们之前，了解比较运算符（如\
  \ `<`、`<=` 和 `!=`）如何在条件语句内部使用的重要的。\n\n### 条件语句\n\n在条件语句中，你指示 PHP 根据测试结果采取不同的操作。例如，你可能想让\
  \ PHP 检查变量是否大于 10，如果是，则打印消息。这都是通过 `if` 语句实现的，它的格式如下：\n\n```\nif (条件) {\n  // 如果条件为真执行的操作\n\
  } else {\n  // 否则执行的可选操作\n}\n```\n\n`your condition` 部分可以填充任何数量你想让 PHP 评估的条件，这就是比较运算符大显身手的地方。例如：\n\
  \n```php\nif ($i > 10) {\n  echo \"11 or higher\";\n} else {\n  echo \"10 or lower\"\
  ;\n}\n```\n\nPHP 查看条件并比较 `$i` 与 `10`。如果大于 10，它将整个操作操作替换为 `1`；否则，替换为 `0`。因此，如果 `$i`\
  \ 是 `20`，结果如下：\n\n```php\nif (1) {\n  echo \"11 or higher\";\n} else {\n  echo \"\
  10 or lower\";\n}\n```\n\n\n\n\n在条件语句中，除 0 以外的任何数字都被认为等同于布尔值 `true`；因此 `1` 始终评估为\
  \ `true`。字符串也有类似的情况：如果你的字符串包含任何字符，它就会评估为 `true`，而空字符串评估为 `false`。这非常重要，因为你随后可以通过\
  \ `&&` 或 `||` 运算符在另一个条件中使用这个 `1`。例如，如果你想检查 `$i` 是否大于 `10` 且小于 `40`，你可以这样写：\n\n```php\n\
  if ($i > 10 && $i < 40) {\n  echo \"11 or higher\";\n} else {\n  echo \"10 or lower\"\
  ;\n}\n```\n\n如果我们假设 `$i` 被设置为 `50`，第一个条件 `($i > 10)` 被替换为 `1`，第二个条件 (`$i < 40`)\
  \ 被替换为 `0`。这两个数字数字随后被 `&&` 运算符使用，该运算符要求左右操作数都为 `true`。由于 `1` 等同于 `true`，而 `0` 不是，因此\
  \ `&&` 操作数被替换为 `0`，条件失败。\n\n`=`、`==`、`===` 和类似的运算符很容易被混淆，通常是编程错误的根源。第一个单等号 `=` 将右操作数的值赋值给左操作数。然而，你经常会看到这样的代码：\n\
  \n```php\nif ($i = 10) {\n  echo \"The variable is equal to 10!\";\n} else {\n \
  \ echo \"The variable is not equal to 10\";\n}\n```\n\n这是错误的。它并不是在检查 `$i` 是否等于 `10`，而是将\
  \ `10` 赋值给 `$i` 并返回 `true`。我们需要的是 `==`，它用于比较两个值的相等性。在 PHP 中，这种方式得到了扩展，还存在 `===`（三个等号），它检查两个值是否完全相同，而不仅仅是相等。\n\
  \n这种区别微小但非常重要：如果你有一个字符串值为 `\"10\"` 的变量，并将其与数字 `10` 进行比较，它们是相等的。因此，PHP 会转换类型并检查数字。然而，它们并不相同。要被视为相同，两个变量必须相等（即具有相同的值）并且具有相同的数据类型（即都是字符串、都是整数，以此此类推）。\n\
  \n***\n\n### Note\n\n将函数调用放在条件语句中而不是直接比较，是一种常见的做法。例如：\n\n```php\nif (do_something())\
  \ {\n```\n\n如果 `do_something()` 函数返回 `true`（或等于 `true` 的值，如非零数字），则该条件语句评估为 `true`。\n\
  \n***\n\n### 特殊运算符\n\n三元运算符和执行运算符与我们目前看到的运算符原理不同。幸运的是，三元运算符在 PHP 中很少使用，因为它实际上只是一个压缩的条件语句。推测它的出现是因为某人需要代码尽可能少地占用空间，因为它确实没有让\
  \ PHP 代码变得更易读。\n\n三元运算符的工作方式如下：\n\n```php\n$age_description = ($age < 18) ? \"child\"\
  \ : \"adult\";\n```\n\n在没有解释的情况下，这段代码基本上没有意义；然而，它会展开为以下五行代码：\n\n```php\nif ($age\
  \ < 18) {\n  $age_description = \"child\";\n} else {\n  $age_description = \"adult\"\
  ;\n}\n```\n\n三元运算符之所以这样命名，因为它有三个操作数：一个要检查的条件（上一个代码中的 `$age < 18`）、条件为 `true` 时的结果（`\"\
  child\"`）以及条件为 `false` 时的结果（`\"adult\"`）。尽管我们希望你永远不需要三元运算符，但至少知道它是如何工作的是有重要的，以防你偶然遇到它。\n\
  \n另一个特殊运算符是执行运算符，即反引号符号 ``` `。反引号的位置取决于你的键盘，但它可能就在数字 1 键的左侧（Tab 键上方）。执行运算符执行反引号内的程序，返回程序输出的任何文本。例如：\n\
  \n```php\n<?php\n  $i = 'ls –l';\n  echo $i;\n?>\n```\n\n这会执行 `ls` 程序，并传入 `-l`（小写\
  \ L）以获取长格式，并将其所有输出存储在 `$i` 中。你可以让命令变得任意长或任意复杂，包括管道到其他程序。你还可以在命令中使用 PHP 变量。\n\n###\
  \ 切换 (Switching)\n\n在一个地方放置多个 `if` 语句是丑陋、缓慢且容易出错的。考虑 列表 37.3 中的代码。\n\n列表 37.3 多个条件语句导致丑陋的代码\n\
  \n```php\n<?php\n  $cat_age = 3;\n  if ($cat_age == 1) {\n    echo \"Cat age is\
  \ 1\";\n  } else {\n    if ($cat_age == 2) {\n      echo \"Cat age is 2\";\n   \
  \ } else {\n      if ($cat_age == 3) {\n        echo \"Cat age is 3\";\n      }\
  \ else {\n        if ($cat_age == 4) {\n          echo \"Cat age is 4\";\n     \
  \   } else {\n          echo \"Cat age is unknown\";\n        }\n      }\n    }\n\
  \  }\n?>\n```\n\n尽管它确实可以工作，但这是解决该问题的糟糕方案。更好的方案是使用 `switch`/`case` 块，它将之前的代码转换为列表\
  \ 37.4 所示的内容。\n\n列表 37.4 使用 `switch`/`case` 块\n\n```php\n<?php\n  $cat_age = 3;\n\
  \  switch ($cat_age) {\n    case 1:\n      echo \"Cat age is 1\";\n      break;\n\
  \    case 2:\n      echo \"Cat age is 2\";\n      break;\n    case 3:\n      echo\
  \ \"Cat age is 3\";\n      break;\n    case 4:\n      echo \"Cat age is 4\";\n \
  \     break;\n    default:\n      echo \"Cat age is unknown\";\n  }\n?>\n```\n\n\
  ### 循环 (Loops)\n\nPHP 有四种可以多次执行代码块的方法：`while`、`for`、`foreach` 和 `do...while`。在这四种中，`do...while`\
  \ 很少使用；其他的非常流行，你将会遇到它们。\n\n最基础的循环是 `while` 循环，只要给定的条件为 `true`，它就会执行代码块。因此，我们可以用以下代码编写一个无限循环——一个持续运行的代码块：\n\
  \n```php\n<?php\n  $i = 10;\n  while ($i >= 10) {\n    $i += 1;\n    echo $i;\n\
  \  }\n?>\n```\n\n循环块检查 `$i` 是否大于或等于 10，如果该条件为 `true`，则给 `$i` 加 1 并打印。然后它回到循环条件。由于\
  \ `$i` 从 10 开始且我们只向它增加数字，所以该循环会无限持续。通过两个微小的变化，我们可以让循环从 10 倒数到 0：\n\n```php\n<?php\n\
  \  $i = 10;\n  while ($i >= 0) {\n    $i -= 1;\n    echo $i;\n  }\n?>\n```\n\n所以，这次我们检查\
  \ `$i` 是否大于或等于 0，并在每次循环迭代中将其减 1。注意，在最后它不需要 `break`。\n\n`while` 循环通常用于你不确定代码需要循环多少次的情况，因为\
  \ `while` 会一直循环直到外部因素停止它。\n\n使用 `for` 循环，你通过提供声明、条件和动作来对其操作指定精确的限制。也就是说，你指定了一个或多个在循环首次运行时应该设置的变量（声明），你设置了导致循环终止的情况（条件），并告诉\
  \ PHP 在每次循环迭代中应该更改什么（动作）。最后这部分是 `for` 循环与 `while` 循环真正的区别所在：你通常告诉 PHP 在每次迭代中更改条件变量。\n\
  \n我们可以使用 `for` 循环重写从 10 倒数到 0 的脚本：\n\n```php\n<?php\n  for($i = 10; $i >= 0; $i\
  \ -= 1) {\n    echo $i;\n  }\n?>\n```\n\n\n\n这一次，我们不需要在循环外部为 `$i` 指定初始值，也不需要在循环内部更改\
  \ `$i`；这些都是 `for` 语句的一部分。实际的代码量实际上是相同的，但就此目的而言，`for` 循环可以说更加整洁，因此更容易阅读。使用 `while`\
  \ 循环时，变量 `$i` 是在循环外部声明的，因此没有显式地绑定到循环中。\n\n第三种循环类型是 `foreach`，它专门用于数组和对象，尽管它很少用于数组以外的任何地方。`foreach`\
  \ 循环遍历数组的每个元素（或对象中的每个变量），并可以同时提供键名（key）和值。\n\n在最简单的形式下，`foreach` 循环如下：\n\n```php\n\
  <?php\n  foreach($myarr as $value) {\n    echo $value;\n  }\n?>\n```\n\n这会遍历我们之前创建的\
  \ `$myarr` 数组，将每个值赋给 `$value` 变量。我们可以对其进行修改，以便从数组中获取键和值，如下所示：\n\n```php\n<?php\n\
  \  foreach($myarr as $key => $value) {\n    echo \"$key is set to $value\\n\";\n\
  \  }\n?>\n```\n\n正如你所推测的，这次数组键进入 `$key`，而数组值进入 `$value`。`foreach` 循环的一个重要特性是，它从数组的开始执行到结束，然后停止——我们所说的*开始*，指的是第一个添加的项，而不是最小索引数字。这个脚本展示了这种行为：\n\
  \n```php\n<?php\n  $array = array(6 => \"Hello\", 4 => \"World\",\n            \
  \     2 => \"Wom\", 0 => \"Bat\");\n  foreach($array as $key => $value) {\n    echo\
  \ \"$key is set to $value\\n\";\n  }\n?>\n```\n\n如果你尝试这个脚本，你会发现 `foreach` 按照 `6`、`4`、`2`、`0`\
  \ 的原始顺序打印数组，而不是 `0`、`2`、`4`、`6` 的数字顺序。\n\n`do...while loop` 的工作方式与 `while` 循环类似，异常条件出现在代码块的末尾。尽管这种微小的语法差异意义重大，因为\
  \ `do...while` 循环至少执行一次。考虑这个脚本：\n\n```php\n<?php\n  $i = 10;\n  do {\n    $i -=\
  \ 1;\n    echo $i;\n  } while ($i < 10);\n?>\n```\n\n在不运行脚本的情况下，你认为它会做什么？一种可能性是它什么都不做；`$i`\
  \ 被设置为 `10`，条件规定代码只有在 `$i` 小于 `10` 时才循环。然而，`do...while` 循环总是执行一次，所以发生的情况是 `$i` 被设置为\
  \ `10`，PHP 进入循环，递减 `$i`，打印它，然后第一次检查条件。此时，`$i` 确实小于 `10`，因此代码循环，`$i` 再次递减，重新检查条件，`$i`\
  \ 再次递减，以此此类推。这实际上是一个无限循环，应该被避免！\n\n如果你想在循环完成之前退出循环，可以使用我们之前用于退出 `switch`/case` 块的相同\
  \ `break` 语句。如果你发现自己处于嵌套循环（循环内部的循环）中，这就会变得更有趣。这是一个常见的情况。例如，你可能想遍历棋盘上所有的行，并对每一行遍历每一列。调用\
  \ `break` 只退出一个循环或 `switch`/case`，但你可以使用 `break 2` 退出两个循环或 `switch`/cases`，或者使用\
  \ `break 3` 退出三个，以此此类推。\n\n### 包含其他文件\n\n除非你将自己限制在最简单的编程项目中，否则你会在某个时刻想要在脚本之间共享代码。这最基本的需求是为网站准备一个标准的头部和页脚，只有正文内容发生变化。然而，你可能发现自己有一组经常使用的自定义函数，将这些函数简单地复制并粘贴到使用它们的每个脚本中将是一个极其糟糕的做法。\n\
  \n包含其他文件的最方法是使用 `include` 关键字。将此脚本保存为 `include1.php`：\n\n```php\n<?php\n  for($i\
  \ = 10; $i >= 0; $i -= 1) {\n    include \"echo_i.php\";\n  }\n?>\n```\n\n然后将此脚本保存为\
  \ `echo_i.php`：\n\n```php\n<?php\n  echo $i;\n?>\n```\n\n如果你运行 `include1.php`，PHP\
  \ 会从 10 循环到 0，每次包含 `echo_i.php`。对于 `echo_i.php` 来说，它只是打印 `$i` 的值，这是执行原本简单操作的一种疯狂方法，但它确实演示了包含的文件是如何共享数据的。注意\
  \ `include1.php` 中的 `include` 关键字是在 PHP 块内部，但我们在 `echo_i.php` 内部重新开启了 PHP。这很重要，因为\
  \ PHP 会为每个新文件退出 PHP 模式，所以你始终有一个一致的入口点。\n\n### 基础函数\n\nPHP 拥有大量的内置函数，允许你操作字符串、连接数据库等。这里没有空间涵盖即使\
  \ 10% 的内容。\n\n### 字符串\n\n有很多内置函数用于处理字符串。这里没有空间覆盖即使 10% 的内容。最常用的函数是 `strlen()`，它接收字符串并返回长度，如下：\n\
  \n```php\n<?php\n  $ourstring = \"  Hello World!  \";\n  echo strlen($ourstring);\n\
  ?>\n```\n\n如果你执行这个脚本，你会发现 `strlen` 输出的是字符串的字符数，包括空格。如果你想得到去掉空格后的长度，可以使用 `trim()`\
  \ 函数，它可以移除字符串两端的空白字符：\n\n```php\n<?php\n  $ourstring = \"  Hello World!  \";\n \
  \ echo strlen(trim($ourstring));\n?>\n```\n\n`trim()` 函数会返回去除了两端空白字符的字符串，如下所示：\n\
  \n```php\n<?php\n  $ourstring = \"  Hello World!  \";\n  echo trim($ourstring);\n\
  ?>\n```\n\n此外，`ltrim()` 用于移除左侧，`rtrim()` 用于移除右侧：\n\n```php\n<?php\n  $ourstring\
  \ = \"  Hello World!  \";\n  echo ltrim($ourstring); // 输出 Hello World!\n  echo\
  \ rtrim($ourstring); // 输出  Hello World!\n?>\n```\n\n还有一些函数用于替换字符串。`str_replace()`\
  \ 允许你搜索并替换文本：\n\n```php\n<?php\n  $ourstring = \"The quick brown dog jumps over\
  \ the lazy dog.\";\n  echo str_replace(\"dog\", \"fox\", $ourstring);\n?>\n```\n\
  \n`str_replace()` 还可以接收数组作为参数，一次性替换多个项：\n\n```php\n<?php\n  $ourstring = \"The quick\
  \ brown dog jumps over the lazy dog.\";\n  $search = array(\"dog\", \"lazy\");\n\
  \  $replace = array(\"fox\", \"cat\");\n  echo str_replace($search, $replace, $ourstring);\n\
  ?>\n```\n\n最后，`strpos()` 用于查找子字符串在字符串中的位置：\n\n```php\n<?php\n  $ourstring = \"The\
  \ quick brown dog jumps over the lazy dog.\";\n  echo strpos($ourstring, \"dog\"\
  ); // 输出 16\n?>\n```\n\n\n\n第二个补充是，由于我们实际上只改变了一个字符（从 `B` 改为 `F`），我们完全不需要使用函数。PHP\
  \ 允许你通过在大括号（`{` 和 `}`）内指定字符位置来读取（并修改）字符串中的字符。和数组一样，字符串是从零开始的，这意味着在变量 `$ourstring`\
  \ 中，`$ourstring{0}` 是 `T`，`$ourstring{1}` 是 `h`，`$ourstring{2}` 是 `e`以此此类推。我们可以使用这种方法代替\
  \ `str_replace()`：\n\n```php\n<?php\n  $ourstring = \"  The Quick Brown Box Jumped\
  \ Over The Lazy Dog  \";\n  $ourstring{18} = \"F\";\n  echo $ourstring;\n?>\n```\n\
  \n你可以使用 `substr()` 函数提取字符串的部分，该函数接受字符串作为第一个参数，起始位置作为第二个参数，以及可选的长度作为第三个参数。可选参数在 PHP\
  \ 中很常见。如果你不提供它们，PHP 会假定一个默认值。在这种情况下，如果你只指定前两个参数，PHP 将从起始位置复制到字符串末尾。如果你指定第三个参数，PHP\
  \ 将从开始处复制相应数量的字符。\n\n我们可以通过将起始位置设置为 `38` 编写一个简单的脚本来打印 `\"Lazy Dog\"`，考虑到 PHP 从 0\
  \ 开始计算字符串位置，这会从第 39 个字符开始复制到字符串末尾：\n\n```php\necho substr($ourstring, 38);\n```\n\
  \n如果我们只想打印单词 `Lazy`，则需要使用可选的第三个参数将长度指定为 `4`，如下所示：\n\n```php\necho substr($ourstring,\
  \ 38, 4);\n```\n\n`substr()` 函数也可以配合负的第二个和第三参数使用。如果你只指定第一两个参数并为第二个参数提供负数，`substr()`\
  \ 将从字符串末尾倒数。因此，与其为第二个参数指定 `38`，我们可以使用 `-10`，这样它就会取字符串的最后 10 个字符。使用负的第二个参数和正的第三参数是从字符串末尾倒数，然后使用向前的长度。我们可以通过从末倒数\
  \ 10 个字符，然后向前取 4 个字符来打印 `\"Lazy\"`：\n\n```php\necho substr($ourstring, -10, 4);\n\
  ```\n\n最后，我们也可以使用负的第三参数，它同样从字符串末尾倒数。例如，使用 `\"-4\"` 作为第三个参数意味着取除最后四个字符以外的所有内容。还是疑惑吗？这个代码示例应该会解释清楚：\n\
  \n```php\necho substr($ourstring, -19, -11);\n```\n\n这会从字符串末尾倒数 19 个字符（这使其位于 `Over`\
  \ 中的 `O` 处），然后从那里开始复制到字符串末尾前 11 个字符的所有内容。这会打印 `Over The`。同样的内容可以使用 `-19` 和 `8`，甚至\
  \ `29` 和 `8` 来编写；方法不止此一种。\n\n接下来，`strpos()` 函数返回特定子字符串在字符串内部的位置；然而，它最常用于回答这个问题：“这个字符串是否包含某个特定的子字符串？”\
  \ 你你需要向它传递两个参数：一个干草（haystack）和一个针（needle）。（是的，这和 `str_replace()` 的顺序不同。）\n\n在最基础的用法中，`strpos()`\
  \ 可以在短语中找到 `Box` 的第一个实例，如下：\n\n```php\necho strpos($ourstring, \"Box\");\n```\n\n\
  这输出 `18`，因为那是 `Box` 中 `B` 开始的位置。如果 `strpos()` 无法在父字符串中找到子字符串，它会返回 `false` 而不是位置。不过，更有用的是检查字符串是否包含某个子字符串的能力；检查我们的字符串是否包含单词\
  \ `The` 的第一次尝试可能像这样：\n\n```php\n<?php\n  $ourstring = \"The Quick Brown Box Jumped\
  \ Over The Lazy Dog\";\n  if (strpos($ourstring, \"The\")) {\n    echo \"Found 'The'!\\\
  n\";\n  } else {\n    echo \"'The' not found!\\n\";\n  }\n?>\n```\n\n注意，我们临时移除了\
  \ `$ourstring` 前头和结尾的空白，并且我们正在使用 `strpos()` 的返回值作为我们的条件语句。它的读法是：“如果找到了字符串，就打印一条消息；如果没有，就打印另一个消息。”但真的是这样吗？\n\
  \n运行脚本，你会看到它打印了 `\"not found\"` 消息。原因在于，如果没找到子字符串，`strpos()` 返回 `false`，否则返回它开始的位置。如果你还记得，在\
  \ PHP 中，任何非零数字都等于 `true`，这意味着 `0` 等于 `false`。考虑到这一点，我们短语中第一个 `The` 的字符串索引是多少？因为\
  \ PHP 的字符串是从零开始的，而且我们不再有字符串两侧的空格，`The` 位于位置 `0`，我们的条件语句将其求结果为 `false`（因此，这就是问题所在）。\n\
  \n这里的解决方案是检查全等（identicality）。我们知道 `0` 和 `false` 是相等的，但它们不是全等的，因为 `0` 是整数，而 `false`\
  \ 是布尔值。所以，我们需要重写条件语句来查看 `strpos()` 的返回值是否是全等的。\n\n```php\n<?php\n  $ourstring =\
  \ \"The Quick Brown Box Jumped Over The Lazy Dog\";\n  if (strpos($ourstring, \"\
  The\") !== false) {\n    echo \"Found 'The'!\\n\";\n  } else {\n    echo \"'The'\
  \ not found!\\n\";\n  }\n?>\n```\n\n### 数组\n\n处理数组并不是易事，但 PHP 通过提供可以排序、洗乱、交叉和过滤的函数使其变得更容易。常用的函数是\
  \ `array_unique()`，它接受一个数组并返回删除重复值后的数组。同样在洗乱领域的是 `shuffle()` 函数。注意 `shuffle()` 不返回数组；它直接打乱数组。最后一个演示函数是\
  \ `in_array()`，它接受一个值作为第一个参数，一个数组作为第二个参数，如果该值在数组中则返回 `true`。\n\n排除这些，我们可以关注更有趣的函数，其中两个是\
  \ `array_keys()` 和 `array_values()`。它们都接受数组作为参数，分别返回由键或值组成的新数组。`array_values()`\
  \ 函数是创建相同数据但没有键的新方法。这通常用于对数组键进行了编号、删除了元素并想要重新排序的情况。\n\n`array_keys()` 函数创建一个新数组，其值是旧数组的键，如下：\n\
  \n```php\n<?php\n  $myarr = array(\"foo\" => \"red\", \"bar\" => \"blue\", \"baz\"\
  \ => \"green\");\n  $mykeys = array_keys($myarr);\n  foreach($mykeys as $key =>\
  \ $value) {\n    echo \"$key = $value\\n\";\n  }\n?>\n```\n\n这输出 `\"0 = foo\"`、`\"\
  1 = bar\"` 和 `\"2 = baz\"`。\n\n有几个函数专门用于数组排序，但只有两个被广泛使用：`asort()` 和 `ksort()`，前者按值排序数组，后者按键排序数组。对于上一个示例中的数组\
  \ `$myarr`，按值排序将产生顺序为 `bar/blue`、`baz/green` 和 `foo/red` 的数组。按键排序将得到顺序为 `bar/blue`、`baz/green`\
  \ 和 `foo/red` 的元素。和 `shuffle()` 函数一样，`asort()` 和 `ksort()` 都是原地操作，这意味着它们不返回值，而是直接修改传递的参数。为了兴趣起，你还可以使用\
  \ `arsort()` 和 `krsort()` 分别进行反值排序和反键排序。\n\n这个代码示例按值反向排序，然后像以前一样打印它：\n\n```php\n\
  <?php\n  $myarr = array(\"foo\" => \"red\", \"bar\" => \"blue\", \"baz\" => \"green\"\
  );\n  arsort($myarr);\n  foreach($myarr as $key => $value) {\n    echo \"$key =\
  \ $value\\n\";\n  }\n?>\n```\n\n\n\n之前在讨论常量时，我们提到了 `extract()` 函数，它可以将一个数组转换为独立的变量；现在是时候开始真正使用它了。你需要提供三个变量：要提取的数组、你希望为变量添加的前缀，以及你想要使用的前缀。从技术上讲，后两个参数是可选的，但在实际操作中，你应该始终使用它们来正确地为变量划分命名空间并保持组织整洁。\n\
  \n第二个参数必须是以下值之一：\n\n- `EXTR_OVERWRITE`—如果变量已经存在，则覆盖它。\n- `EXTR_SKIP`—如果变量已经存在，则跳过它并处理下一个变量。\n\
  - `EXTR_PREFIX_SAME`—如果变量已经存在，则使用第三个参数中指定的前缀。\n- `EXTR_PREFIX_ALL`—无论变量是否存在，都为所有变量加上第三个参数中的前缀。\n\
  - `EXTR_PREFIX_INVALID`—仅当变量名无效时（例如以数字开头）才使用前缀。\n- `EXTR_IF_EXISTS`—仅提取已经存在的变量。我们从未见过这种用法。\n\
  \n你还可以可选地使用位逻辑 `OR` 运算符 `|` 来添加 `EXTR_REFS`，让 `extract()` 对提取出的变量使用引用。通常情况下，优先使用\
  \ `EXTR_PREFIX_ALL`，因为它保证了命名空间。只有当你需要更改变量并让这些更改反映在数组中，才需要 `EXTR_REFS`。\n\n下一个脚本使用\
  \ `extract()` 将 `$myarr` 转换为独立的变量 `$arr_foo`、 `$arr_bar` 和 `$arr_baz`：\n\n```php\n\
  <?php\n  $myarr = array(\"foo\" => \"red\", \"bar\" => \"blue\", \"baz\" => \"green\"\
  );\n  extract($myarr, EXTR_PREFIX_ALL, 'arr');\n?>\n```\n\n注意数组键为 `\"foo\"`、`\"\
  bar\"` 和 `\"baz\"`，前缀为 `\"arr\"`，但最终变量将是 `$arr_foo`、 `$arr_bar` 和 `$arr_baz`。PHP\
  \ 会在前缀和数组键之间插入下划线。\n\n## 文件\n\n正如你从书的其他部分学到的，UNIX 哲学是“一切皆文件”。在 PHP 中也是如此：一组基本文件函数适用于打开和操作文件，但这些函数也可以用于打开和操作网络套接字（sockets）。我们在这里这两者都涵盖。\n\
  \n两个基础的文件读写函数让执行这些基本操作变得简单。它们是 `file_get_contents()`，它只接受文件名作为参数，并将文件内容作为字符串返回；以及\
  \ `file_put_contents()`，它接受文件名作为第一个参数，并将写入的数据作为第二个参数。\n\n使用这两个函数，我们可以编写一个脚本，从文件\
  \ `filea.txt` 读取所有文本并将其写入另一个文件 `fileb.txt`：\n\n```php\n<?php\n  $text = file_get_contents(\"\
  filea.txt\");\n  file_put_contents(\"fileb.txt\", $text);\n?>\n```\n\n由于 PHP 允许像处理文件一样处理网络套接字，我们也可以使用\
  \ `file_get_contents()` 从网站读取文本，如下：\n\n```php\n<?php\n  $text = file_get_contents(\"\
  http://www.slashdot.org\");\n  file_put_contents(\"fileb.txt\", $text);\n?>\n```\n\
  \n使用 `file_get_contents()` 的问题在于它会一次性将整个文件加载到内存中；如果你有大文件或者许多用户访问的小文件，这并不可实际。另一种方法是分段加载文件，可以通过以下五个函数实现：`fopen()`、`fclose()`、`fread()`、`fwrite()`\
  \ 和 `feof()`。这些函数名中的 `f` 代表 `file`（文件），因此它们打开、关闭、读取和写入文件以及套接字。最后一个函数 `feof()` 在到达文件末尾时返回\
  \ `true`。\n\n`fopen()` 函数需要一些学习才能正确使用，但表面上看起来很直接。它的第一个参数是你想要打开的文件名，这很简单。然而，第二个参数是你指定如何操作文件的地方，你应该指定以下内容之一：\n\
  \n- `r`—只读；它会覆盖文件。\n- `r+`—读写；它会覆盖文件。\n- `w`—只写；它会删除现有内容并覆盖文件。\n- `w+`—读写；它会删除现有内容并覆盖文件。\n\
  - `a`—只写；追加到文件末尾。\n- `a+`—读写；追加到文件末尾。\n- `x`—只写，但仅当文件不存在时。\n- `a+`—读写，但仅当文件不存在时。\n\
  \n可选地，你还可以添加 `b`（例如 `a+b` 或 `rb`）来切换到二进制模式。如果你希望脚本及其写入的文件在其他平台上平畅运行，则建议这样做。\n\n\
  当你调用 `fopen()` 时，你应该存储返回值。它是一个被称为“文件句柄”（file handle）的资源，其他文件函数都需要它来完成工作。例如，`fread()`\
  \ 函数接受文件句柄作为第一个参数，将读取的字节数作为第二个参数，并在返回值中返回内容。`fclose()` 函数接受文件句柄作为唯一参数并释放文件。\n\n\
  因此，我们可以写一个简单的循环来打开文件、分段读取、打印这些片段，然后关闭句柄：\n\n```php\n<?php\n  $file = fopen(\"filea.txt\"\
  , \"rb\");\n  while (!feof($file)) {\n    $content = fread($file, 1024);\n    echo\
  \ $content;\n  }\n  fclose($file);\n?>\n```\n\n现在只剩下 `fwrite()` 函数，它接受文件句柄作为第一个参数，将要写入的字符串作为第二个参数。你还可以提供一个整数作为第三参数，指定要写入字符串的字节数，但如果排除此项，`fwrite()`\
  \ 将写入整个字符串。\n\n如果你还记得，可以使用 `a` 作为 `fopen()` 的第二个参数来向文件追加数据。因此，我们可以将其与 `fwrite()`\
  \ 结合，编写一个每次执行都向文件添加一行文本的脚本：\n\n```php\n<?php\n  $file = fopen(\"filea.txt\", \"\
  ab\");\n  fwrite($file, \"Testing\\n\");\n  fclose($file);\n?>\n```\n\n为了让脚本更有趣一点，我们可以引入一个新函数\
  \ `filesize()`，它接受文件名（不是文件句柄，而是实际文件名字符串）作为唯一参数，并以字节返回文件大小。使用这个新函数后，脚本变为：\n\n```php\n\
  <?php\n  $file = fopen(\"filea.txt\", \"ab\");\n  fwrite($file, \"The filesize was\"\
  \ . filesize(\"filea.txt\") . \"\\n\");\n  fclose($file);\n?>\n```\n\n虽然 PHP 会自动为你清理文件句柄，但最好还是你自己使用\
  \ `fclose()`。\n\n## 杂杂\n\n几个函数不属于其他类别，因此被涵盖在本文中。第一个是 `isset()`，它接受一个或多个变量作为参数，如果它们已被设置则返回\
  \ `true`。需要注意的是，如果变量的值被设置为会被评估为 `false` 的值（例如 `0` 或空字符串），`isset()` 仍然会返回 `true`，因为它不检查值。\n\
  \n`unset()` 函数也接受一个或多个变量作为参数，简单地删除该变量并释放内存。通过这两个函数，我们可以编写一个脚本来检查变量是否存在，如果存在，则将其删除（参见示例\
  \ 37.5）。\n\n### 示例 37.5 设置和取消设置变量\n\n```php\n<?php\n  $name = \"Ildiko\";\n  if\
  \ (isset($name)) {\n    echo \"Name was set to $name\\n\";\n    unset($name);\n\
  \  } else {\n    echo \"Name was not set\";\n  }\n  if (isset($name)) {\n    echo\
  \ \"Name was set to $name\\n\";\n    unset($name);\n  } else {\n    echo \"Name\
  \ was not set\";\n  }\n?>\n```\n\n该脚本运行两次相同的 `isset()` 检查，但第一次检查后它 `unset()` 了变量。因此，它会打印\
  \ `\"Name was set to Ildiko\"`，然后打印 `\"Name was not set\"`。\n\n\n\n\nPHP 中可能最常用的函数是\
  \ `exit`，尽管纯洁者会告诉你，它实际上是一个语言构造结构而不是函数。`exit` 一旦执行就会立即终止脚本的处理，这意味着后续代码将不会被执行。这其实就是全部了；它几乎不值得举例，但为了确保起见，这里有一个：\n\
  \n```php\n<?php\n\n  exit;\n\n  echo \"Exit is a language construct!\\n\";\n\n?>\n\
  ```\n\n该脚本不会打印任何内容，因为 `exit` 在 `echo` 之前。\n\n我们可以保证你会经常使用的一个函数是 `var_dump()`，它会将变量的信息（包括它的值）转到屏幕上。这对数组来说无价，因为它会打印每一个值，如果其中一个或多个元素是数组，它会打印这些数组的所有元素，以此类推。要使用此函数，只需将变量作为唯一参数传递即可：\n\
  \n```php\n<?php\n\n  $drones = array(\"Graham\", \"Julian\", \"Nick\", \"Paul\"\
  ); own  var_dump($drones);\n\n?>\n```\n\n该脚本的输出如下：\n\n```\narray(4) {\n  [0]=>\n\
  \  string(6) \"Graham\"\n  [1]=>\n  string(6) \"Julian\"\n  [2]=>\n  string(4) \"\
  Nick\"\n  [3]=>\n  string(4) \"Paul\"\n}\n```\n\n`var_dump()` 函数被广泛用作基础调试技术，因为它是将变量数据打印到屏幕上进行验证的最简单方法。\n\
  \n最后，我们简要讨论一下正则表达式；重点在于*简要*，因为正则表达式的语法在本书的其他地方有所介绍，而与 PHP 相关的唯一之处在于你运行这些表达式时将使用的函数。你可以选择\
  \ Perl 兼容正则表达式 (PCRE) 或 POSIX 扩展正则表达式，但在提供的功能方面，它们之间其实没有太大区别。对于本章，我们使用 PCRE 表达式，因为据我们所知，其他\
  \ PHP 程序员更多地使用它们。\n\n主要的 PCRE 函数有 `preg_match()`、`preg_match_all()`、`preg_replace()`\
  \ 和 `preg_split()`。我们从 `preg_match()` 开始，因为它提供了最基础的功能：如果一个字符串匹配正则表达式，则返回 `true`。`preg_match()`\
  \ 的第一个参数是你想要搜索的正则表达式，第二个参数是用于匹配的字符串。因此，如果我们想检查一个字符串是否包含 `Best`、`Test`、`rest`、`zest`\
  \ 或任何以不区分大小写的字母开头并包含 `est` 的单词，可以使用以下 PHP 代码：\n\n```php\n$result = preg_match(\"\
  /[A-Za-z]est/\", \"This is a test\");\n```\n\n由于测试字符串匹配表达式，`$result` 被设置为 `1` (`true`)。如果你将字符串更改为不匹配的结果，你将得到\
  \ `0` 作为返回值。\n\n下一个函数是 `preg_match_all()`，它会给你一个包含所有找到的匹配项的数组。然而，为了使其最有用，它接收一个作为引用传递的数组以填充匹配项，并将其返回值保存为找到的匹配数量。\n\
  \n我们建议你使用 `preg_match_all()` 和 `var_dump()` 来感受该函数是如何工作的。这个示例是一个很好的开始：\n\n```php\n\
  <?php\n\n  $string = \"This is the best test in the west\";\n  $result = preg_match_all(\"\
  /[A-Za-z]est/\", $string, $matches);\n\n  var_dump($matches);\n\n?>\n```\n\n输出如下：\n\
  \n```\narray(1) {\n  [0]=>\n  array(3) {\n    [0]=>\n    string(4) \"best\"\n  \
  \  [1]=>\n    string(4) \"test\"\n    [2]=>\n    string(4) \"west\"\n  }\n}\n```\n\
  \n你会发现，`$matches` 数组实际上是多维的因为它因为它一个元素，该元素本身是一个包含我们正则表达式所有匹配项的数组。这是是因为我们的表达式没有*子表达式*，这意味着没有使用括号进行独立匹配。如果有子表达式，每个子表达式在\
  \ `$matches` 数组中都有自己的元素，包含它自己的匹配数组。\n\n接下来，`preg_replace()` 用于将所有匹配正则表达式的子字符串更改其他内容。使用此方法的方法非常简单：你用正则表达式搜索某些内容并提供替换。然而，更有用的变体是*反向引用*，将匹配项作为替换的一部分。对于我们的示例，假设你写了一篇关于\
  \ PHP 的教程，但想处理文本，使每个对函数的引用都跟着一个指向 PHP 手册的链接。\n\nPHP 手册页 URL 的格式为 `www.php.net/<somefunc>`（例如\
  \ `www.php.net/preg_replace`）。我们需要匹配的字符串是函数名，这是一个字母组成的字符串，可能还混合了数字和下划线，并以两个括号 `()`\
  \ 结尾。作为替换，我们将使用找到的匹配并用链接包裹它。\n\n```php\n<?php\n  $regex = \"/([A-Za-z0-9_]+)\\)/\"\
  ;\n  $replace = \"<a href=\\\"www.php.net/$1\\\">$1</a>\";\n  $haystack = \"Check\
  \ out the exit() and var_dump() functions.\";\n  $result = preg_replace($regex,\
  \ $replace, $haystack);\n\n  echo $result;\n?>\n```\n\n\n\n\n如果你愿意，可以学习 PHP 支持的所有连接和操作每个数据库的独立函数，但一个更明智（或至少更简单）的想法是使用\
  \ `PEAR::DB`。`PEAR::DB` 是 PHP 支持的数据库上的一个抽象层，这意味着你只需要编写一次代码，通过经过极微的更改，它就能运行在每个数据库服务器上。\n\
  \nPEAR 是 PHP 的脚本存储库，包含了许多针对常见问题的工具和预写解决方案。`PEAR::DB` 可能是 PEAR 项目中最流行的部分，但值得查看一下\
  \ PEAR 网站，看看是否有其他其他引起你注意的内容。\n\n要使用 `PEAR::DB` 的基本功能，你需要学习如何连接到数据库、运行 SQL 查询以及处理结果。这不是一个\
  \ SQL 教程，所以我们假设你已经熟悉这门语言。为了教程的起见，我们还假设你正在使用一个名为 `dentists` 的数据库和一个名为 `patients`\
  \ 的表，该表包含以下字段：\n\n- `ID`—主键，自动递增整数，用于存储每个患者的唯一数字\n- `Name`—一个 `varchar(255)` 字段，用于存储患者姓名\n\
  - `Age`—整数\n- `Sex`—1 表示男性，2 表示女性\n- `Occupation`—一个 `varchar(255)` 字段，用于存储患者职业\n\
  \n同样为了教程的起见，我们使用 IP 地址为 `10.0.0.1` 的数据库服务器，运行 MySQL，用户名为 `ubuntu`，密码为 `alm65z`。你需要将这些细节替换为你自己的；使用\
  \ `localhost` 连接到本地服务器。\n\n使用 `PEAR::DB` 的第一步引入标准的 `PEAR::DB` 文件 `DB.php`。你的 PHP\
  \ 将配置为在 PEAR 目录中查找 `include()` 文件，因此你不需要提供任何目录信息。\n\n`PEAR::DB` 是面向对象的，你在创建初始 DB\
  \ 对象的同时指定连接详情。这是通过使用一个类似 URL 的系统实现的，该系统可以直接指定数据库服务器类型、用户名、密码、服务器和数据库名称。在你在这里指定了数据库服务器后，其他所有内容都被抽象了，这意味着你只需要更改连接行即可将代码移植到另一个数据库服务器。\n\
  \n第一个脚本连接到我们的服务器并打印状态消息（参见列表 37.6）。\n\n### 列表 37.6 通过 `PEAR::DB` 连接数据库\n\n```php\n\
  <?php\n  include(\"DB.php\");\n  $dsn = \"mysql://ubuntu:alm65z@10.0.0.1/dentists\"\
  ;\n  $conn = DB::connect($dsn);\n  if (DB::isError($conn)) {\n    echo $conn->getMessage()\
  \ . \"\\n\";\n  } else {\n    echo \"Connected successfully!\\n\";\n  }\n?>\n```\n\
  \n你应该能够看到连接字符串是如何拆解的。首先是服务器名称，然后是用冒号分隔的用户名和密码，接着是 `@` 符号，后面是要连接的 IP 地址，最后是斜杠和数据库名称。注意对\
  \ `connect` 的调用是 `DB::connect()`，它直接调用 `PEAR::DB` 并返回一个数据库连接对象存储在 `$conn` 中。变量名\
  \ `$dsn` 用于存储连接详情，因为它是数据源名称（data source name）的常用缩写。\n\n如果 `DB::connect()` 成功连接到服务器，它会返回一个我们可以用来运行\
  \ SQL 查询的数据库对象。如果没有，我们将得到一个返回错误，可以使用 `getMessage()` 等函数对错误进行查询。在上一个脚本中，如果连接失败，我们会打印错误信息，但成功时我们也只打印一条消息。接下来，我们更改它，以便在连接成功后运行\
  \ SQL 查询。\n\n运行 SQL 查询是通过我们数据库连接的 `query()` 函数完成的，传入我们想要执行的 SQL。这会返回一个可以用于获取数据的查询结果。这个查询结果可以被认为是一个多维数组，因为它包含许多行数据，每行都有许多列属性。这是通过使用\
  \ `fetchInto()` 函数提取的，该函数遍历查询结果，将每行数据转换为数组并作为返回值返回。你需要向 `fetchInto()` 传递两个参数，指定数据应该存储在何处以及你希望如何存储。除非你有特殊需求，否则为第二个参数指定\
  \ `DB_FETCHMODE_ASSOC` 是一个明智之举。\n\n列表 37.7 显示了新脚本。\n\n### 列表 37.7 通过 `PEAR::DB`\
  \ 运行查询\n\n```php\n<?php\n  include(\"DB.php\");\n  $dsn = \"mysql://ubuntu:alm65z@10.0.0.1/dentists\"\
  ;\n  $conn = DB::connect($dsn);\n  if (DB::isError($conn)) {\n    echo $conn->getMessage()\
  \ . \"\\n\";\n  } else {\n    echo \"Connected successfully!\\n\";\n    $result\
  \ = $conn->query(\"SELECT ID, Name FROM patients;\");\n    while ($result->fetchInto($row,\
  \ DB_FETCHMODE_ASSOC)) {\n      extract($row, EXTR_PREFIX_ALL, 'pat');\n      echo\
  \ \"$pat_ID is $pat_Name\\n\";\n    }\n  }\n?>\n```\n\n前半部分与上一个脚本相同，所有的新操作都发生在连接成功后。\n\
  \n遵循“不要把你可以自己清理掉的事情留给 PHP 处理”这句说法，当前的脚本存在问题。我们没有清理查询结果，也没有关闭数据库连接。如果这段代码在一个运行几分钟的长脚本中使用，这将是极大的资源浪费。幸运的是，我们可以通过调用\
  \ `$result->free()` 和 `$conn->disconnect()` 来释放与这两个相关的内存。如果我们在脚本末尾添加这两个函数调用，它就完整了。\n\
  \n#### 参考文献\n\n- [www.php.net](http://www.php.net)—查找信息的最佳地方是 PHP 在线手册。它是详尽的、编写良好的并且定期更新。\n\
  - [www.phpbuilder.net](http://www.phpbuilder.net)—一个大型 PHP 脚本和教程网站，你可以在那里学习新技术，还可以与其他开发者聊天。\n\
  - [www.zend.com](http://www.zend.com)—一家由 PHP 两个核心开发者之一创立的公司的主页。Zend 开发并销售专有软件，包括强大的\
  \ IDE 和代码缓存，以帮助 PHP 开发者。\n- [`pear.php.net/`](http://pear.php.net/)—PEAR 项目的主页包含大量可以下载和尝试的软件，并为所有内容提供了详尽的文档。\n\
  - [www.phparch.com/](http://www.phparch.com/)—虽然有很多 PHP 杂志，但 *PHP Architect* 可能是领先的。它在线免费发布部分文章，其论坛也不错。\n\
  \n\n\n\n\n大多数其他语言的核心都是一组开发者，但 Python 的核心是 Guido van Rossum——它的创造者、之父以及“终身仁慈独裁者 (BDFL)”。尽管\
  \ Guido 现在在 Python 工作上花费的时间较少，但他从本质上来说仍然拥有否决语言更改的权利，这使得 Python 在多年的开发中保持了一致性。最终结果是，用\
  \ Guido 自己的话：“即使你实际上对语言设计一无所知，你也能看出 Python 是一种非常简单的语言。”\n\n本章构成了一个 Python 的“快速入门”教程，旨在为你提供编写基础脚本所需的所有信息，并引导你关注可以进一步学习的资源。\n\
  \n目前有两个支持的 Python 版本在运行。Python 2.x 版本（当前的生产发布版本为 2.7）是向后兼容的现状，是任何使用过 Python 一年或两年的人都学过的版本，也是你发现并阅读的现有代码中最可能被使用的版本。Python\
  \ 3.x 是最新的分支（当前的生产发布版本为 3.1.4），具有许多亮眼的新特性。\n\nPython 3.x 不向向后兼容，大多数为 2.x 编写或用于 2.x\
  \ 的程序都需要一些调整才能在 3.x 上运行。这应该是你任何关于使用 Python 决策的考虑因素：你是否希望在许多机器上运行你的程序，可能包括一些只安装了旧版本的机器？新版本是否包含了你想要和需要的功能（包括软件库），因为并不是所有的库都已为\
  \ 3.x 重写（例如 `Twisted` 和 `Django`）？如果迁移是一项艰巨的任务，你可能希望暂时坚持使用 2.x。\n\n这两个版本都将支持一段时间，但如果你预计将使用你编写的内容很长时间，你可能想尝试在\
  \ 3.x 中编写，但如果发现 3.x 目前存在重大的阻塞限制，要做好退回 2.x 的准备。不过，语言本身已经准备就绪，并受到了使用过两个版本的人的好评。Python\
  \ 官方网站将帮助你做出明智的决定；在 `http://wiki.python.org/moin/Python2orPython3` 中对每个版本的优缺点有清晰的讨论。\n\
  \n本章以 Python 2.x 版本为中心，因为在本书编写的 2010 年底以及更新的 2011 年年中，大多数人仍然在使用该版本，但我们尝试指出 3.x 中存在应当考虑的重大差异之处。如果你是第一次学习\
  \ Python，你可能想从查看 3.x 系列开始，因为它是未来，并且很可能已经包含了你需要的一切。Ubuntu 10.10 默认安装了 Python 2.6.6，仓库中提供了\
  \ 2.7，这是我们本章侧重于 2.x 系列的另一个原因（尽管目前的 3.x 在仓库中可用，并且可以轻松安装）。\n\n***\n\n### Note\n\n\
  本章是对 Python 的非常基础的介绍。由于这个原因，我们涵盖的几乎所有内容在 2.x 和 3.x 中都是相同的。我们在前面以及随后的几处注释中提到了差异，以便想学习更多知识的读者以后不会感到惊讶。除非另有说明，你应该发现我们在本章中所说的内容也适用于任何版本。\n\
  \n***\n\n### Linux 上的 Python\n\n大多数 Linux 和 UNIX 版本（包括 Mac OS X）都预装了 Python。这部分是为了方便，因为它是一种非常流行的脚本语言——而且如果用户以后想运行脚本，就节省了以后安装的时间——另一部分是因为\
  \ Linux 发行版包含的许多重要或有用程序是用 Python 编写的。例如，Ubuntu 软件中心就是一个 Python 程序。\n\nPython 二进制文件安装在\
  \ `/usr/bin/python`（或 `/usr/bin/python3`）；如果你运行它，就会进入 Python 交互式解释器，你可以在其中输入命令并立即执行。虽然\
  \ PHP 也有交互模式（使用 `php -a` 激活），但它既没有 Python 强大也不灵活。\n\n与 Perl、PHP 和其他脚本语言一样，你也可以通过在脚本开头添加指向\
  \ `/usr/bin/python` 的 shebang 行 (`#!`) 然后将文件设置为可执行，来执行 Python 脚本。\n\n运行 Python 脚本的第三种方法是通过\
  \ `mod_python`，这是一个 Apache 模块，将 Python 解释器嵌入到 服务器中，允许你使用 Python 编写 Web 。你可以从 Ubuntu\
  \ 仓库安装。\n\n出于本介绍的考虑，我们使用交互式 Python 解释器，因为它在你输入命令时会提供即时反馈。\n\n本章使用了交互式解释器，因此你熟练使用它至关重要。要开始，请打开终端并运行命令\
  \ `python`。你应该看到类似下面的内容，可能有不同的版本号和日期：\n\n```bash\nmatthew@seymour:~$ python\n\n\
  Python 2.7.1+ (r271:86832, Apr 11 2011, 18:13:53)\n\n[GCC 4.5.2] on linux2\n\n输入\
  \ \"help\", \"copyright\", \"credits\" 或 \"license\" 获取更多信息。\n>>>\n```\n\n`>>>`\
  \ 是你输入内容的地方，你可以这样设置和获取变量：\n\n```python\n>>> python = 'great'\n>>> python\n'great'\n\
  >>>\n```\n\n在第一行中，`python` 被设置为 `'great'`；在第二行中，读取了 `python`。第三行，`>>>` 是提示符，第四行，`python`\
  \ 是值。完成后，按 `Ctrl+D` 退出。\n\n### Python 基础\n\nPython 是一种与其他语言完全不同的语言，但它是如此符合逻辑，以大多数人都能学会。你已经看到如何轻松地分配字符串了，但在\
  \ Python 中，几乎一切都那么简单——只要你记住语法。\n\n#### 数字\n\nPython 处理数字的方式比某些语言更精确。它拥有所有的普通运算符——例如用于加法的\
  \ `+`、`-` 用于减法、`/` 用于除法和 `*` 用于乘法——但它增加了 `%` 用于取模（余数）、`**` 用于幂以及 `//` 用于地板除。它对于使用哪种类型的数字也是具体的，如下例所示：\n\
  \n```python\n>>> a = 5\n>>> b = 10\n>>> a * b\n50\n>>> a / b\n0\n>>> b = 10.0\n\
  >>> a / b\n0.5\n>>> a // b\n0.0\n```\n\n第一次除法返回 `0` 是因为 `a` 和 `b` 都是整数（整数），所以 Python\
  \ 按整数除法。通过将 `b` 转换为 `10.0`，Python 将视为浮点数，因此除法现在按浮点值计算，得到 `0.5`。即使 `b` 是浮点，使用 `//`——地板除也会将其向下取整。\n\
  \n使用 `**`，你可以很容易看到 Python 如何处理整数：\n\n```python\n>>> 2 ** 30\n1073741824\n>>> 2 **\
  \ 31\n2147483648L\n```\n\n第一个语句计算 `2` 的 `30` 次方（即 2... 乘以 2 乘以 2 乘以...），第二个语句计算\
  \ `2` 的 `31` 次方。注意第二个数字结尾有一个大写的 `L`——这是 Python 在告诉你这是一个长整数。长整数与普通整数之间的区别很小但很重要：普通整数可以使用\
  \ CPU 上的指令进行计算，而长整数——因为它们可以像你需要的那么大——需要在软件中计算，因此速度较慢。\n\n\n\n\n在指定大数字时，你不需要在末尾加上\
  \ `L`——Python 会为你处理。此外，如果一个数字最初是普通数字，然后超过了它的边界，Python 会自动将其转换为长整数（long integer）。反过来则不然：如果你有一个长整数，并将其除以另一个数字，以至于结果可以存储为普通整数，它仍然是一个长整数：\n\
  \n```\n>>> num = 999999999999999999999999999999999L\n>>> num = num / 1000000000000000000000000000000\n\
  >>> num\n999L\n```\n\n你可以使用类型转换在数字类型之间进行转换，如下：\n\n```python\n>>> num = 10\n>>> int(num)\n\
  10\n>>> float(num)\n10.0\n>>> long(num)\n10L\n>>> floatnum = 10.0\n>>> int(floatnum)\n\
  10\n>>> float(floatnum)\n10.0\n>>> long(floatnum)\n10L\n```\n\n你不需要担心你正在使用的是整数还是长整数；Python\
  \ 会为你处理好一切，所以你可以专注于编写正确的代码。在 3.x 系列中，Python 整数类型自动为大数字提供了额外的精度，而在 2.x 中，对于大于普通整数类型设计处理范围的数字，你需要使用单独的长整数类型。\n\
  \n## 关于字符串的更多信息\n\nPython 将字符串存储为**不可变的字符序列**——这是一个充满术语的说法，意思是“它是一个字符集合，一旦设定，就无法在不创建新字符串的情况下进行更改”。序列在\
  \ Python 中非常重要。主要有三种类型，字符串就是其中一种，它们共享一些属性。当你学习下一节的列表时，可变性（Mutability）的概念就会变得非常有意义。\n\
  \n正如你在上一个示例所示，你仅用一个等号就可以为 Python 中的字符串赋值，如下：\n\n```python\n>>> mystring = 'hello';\n\
  >>> myotherstring = \"goodbye\"\n>>> mystring\n'hello'\n>>> myotherstring;\n'goodbye'\n\
  >>> test = \"Are you really Bill O'Reilly?\"\n>>> test\n\"Are you really Bill O'Reilly?\"\
  \n```\n\n第一个示例将字符串封装在单引号中，第二个和第三个则在双引号中。然而，打印第一个和第二个字符串时，它们都以单引号显示，因为 Python 不区分两者。第三个示例是例外；它使用双引号是因为字符串本身包含一个单引号。在这里，Python\
  \ 使用双引号打印字符串，因为它知道其中包含单引号。\n\n由于字符串中的字符是顺序存储的，你可以通过指定你感兴趣的字符来对其索引。和大多数其他语言一样，这些索引是从\
  \ 0 开始的，这意味着你需要请求字符 `0` 来获取字符串中的第一个字母。例如：\n\n```python\n>>> string = \"This is a\
  \ test string\"\n>>> string\n'This is a test string'\n>>> string[0]\n'T'\n>>> string\
  \ [0], string[3], string [20]\n('T', 's', 'g')\n```\n\n最后一行显示了如何通过逗号同时请求多个索引。你可以使用此方法打印整个第一个单词：\n\
  \n```python\n>>> string[0], string[1], string[2], string[3]\n('T', 'h', 'i', 's')\n\
  ```\n\n然而，为了该目的，你可以使用不同的概念：切片（slicing）。序列的 `slice` 提取了一组索引。例如，你可以这样提取出第一个单词：\n\n\
  ```python\n>>> string[0:4]\n'This'\n```\n\n那里的语法意思是“从位置 0（包括 0）开始，到位置 4（不包括）结束”。因此，`[0:4]`\
  \ 复制了索引为 `0`、`1`、`2` 和 `3` 的项。你可以省略索引的任何一方，它将从开始或到结束复制：\n\n```python\n>>> string\
  \ [:4]\n'This'\n>>> string [5:]\n'is a test string'\n>>> string [11:]\n'est string'\n\
  ```\n\n你也可以省略两个数字，它将给你整个序列：\n\n```python\n>>> string [:]\n'This is a test string'\n\
  ```\n\n稍后你会确切知道为什么要这样做，但目前还有许多其他字符串内置属性会让你的生活更轻松。例如，你可以使用 `+` 和 `*` 运算符来拼接（连接）和重复字符串，如下：\n\
  \n```python\n>>> mystring = \"Python\"\n>>> mystring * 4\n'PythonPythonPythonPython'\n\
  >>> mystring = mystring + \" rocks! \"\n>>> mystring * 2\n'Python rocks! Python\
  \ rocks! '\n```\n\n除了使用运算符外，Python 字符串还带有一系列内置方法。你可以使用 `capitalize()`（首字母大写，其余小写）、`lower()`（全部小写）、`title()`（每个单词的首字母大写）和\
  \ `upper()`（全部大写）来改变字母的大小。你还可以使用 `islower()`、`istitle()` 和 `isupper()` 检查字符串是否匹配某些情况；这也扩展到了\
  \ `isalnum()`（如果字符串仅包含字母和数字则返回真）和 `isdigit()`（如果字符串全是数字则返回真）。\n\n这个示例演示了这些的一些用法：\n\
  \n```python\n>>> string\n'This is a test string'\n>>> string.upper()\n'THIS IS A\
  \ STRING'\n>>> string.lower()\n'this is a string'\n>>> string.title()\n'This Is\
  \ A String'\n>>> string.isalnum()\nFalse\n```\n\n2.x 和 3.x 之间的区别之一是引入了新的字符串类型。这里有一个示例：\n\
  \n```\n>>> foo = \"\"\"\n...foo\n...bar\n...baz\n...blippy\n...\"\"\"\n>>> foo\n\
  'foo\\nbar\\nbaz\\nblippy'\n```\n\n在切片中使用负索引是一个很酷的功能。这里有一个示例：\n\n```python\n>>>\
  \ bar=\"news.com\"\n>>> bar[-1]\n'm'\n>>> bar[-4:]\n'.com'\n>>>bar[-10:]\n'google'\n\
  ```\n\n### 列表\n\nPython 内置的列表类型是一种序列，就像字符串一样。然而，它们是可变的，这意味着它们可以被更改。列表类似于数组，按给定的顺序存储一组元素。你可以对它们进行循环、索引访问和切片操作：\n\
  \n```python\n>>> mylist = [\"python\", \"perl\", \"php\"]\n>>> mylist\n['python',\
  \ 'perl', 'php']\n>>> mylist + [\"java\"]\n['python', 'perl', 'php', 'java']\n>>>\
  \ mylist * 2\n['python', 'perl', 'php', 'python', 'perl', 'php']\n>>> mylist[1]\n\
  'perl'\n>>> mylist[1] = \"c++\"\n>>> mylist[1]\n'c++'\n>>> mylist[1:3]\n['c++',\
  \ 'php']\n```\n\n方括号符号是非常重要的：你不能对列表使用括号 `(` 和 `)` 或大括号 `{` 和 `}`。\n\n这变得非常重要，因为\
  \ Python 默认只复制变量的引用，而不是整个变量。例如：\n\n```\n>>> list1 = [1, 2, 3]\n>>> list2 = [4, list1,\
  \ 6]\n>>> list1\n[1, 2, 3]\n>>> list2\n[4, [1, 2, 3], 6]\n```\n\n列表可以是*嵌套*的，这意味着你可以将一个列表放在另一个列表中。然而，可变性在这里开始变得，所以这听起来可能复杂。如果你记得，不可变字符串序列的定义是一个字符集合，一旦设定，就无法在不创建新字符串的情况下更改。列表是可变的（相对于不可变），这意味着你可以在不创建新列表的情况下更改你的列表。\n\
  \n\n\n\n这里有一个嵌套列表。`list2` 包含 `4`，然后是 `list1`，最后是 `6`。当你打印 `list2` 的值时，你可以看到它也包含了\
  \ `list1`。现在，让我们继续后续：\n\n```python\n>>> list1[1] = \"Flake\"\n>>> list2\n[4, [1,\
  \ 'Flake', 3], 6]\n```\n\n在第一行中，我们将 `list1` 中的第二个元素（记住，序列是从 0 开始索引的！）设置为 `Flake`\
  \ 而不是 `2`；然后我们打印 `list2` 的内容。正如你所看到的，当 `list1` 改变时，`list2` 也更新了。其的原因是 `list2` 存储的是\
  \ `list1` 的引用，而不是 `list1` 的拷贝；它们共享同一个值。\n\n我们可以通过对 `list2` 进行两次索引来证明这种操作是双向的，如下：\n\
  \n```python\n>>> list2[1][1] = \"Caramello\"\n>>> list1\n[1, 'Caramello', 3]\n```\n\
  \n第一行的意思是：“获取 list2 中的第二个元素（list1）以及该列表的第二个元素，并将其设置为‘Caramello’。”然后打印 `list1` 的值，你可以看到它已经改变了。这就是可变性的本质：我们可以在不创建新列表的情况下修改我们的列表。然而，编辑字符串会创建一个新字符串，而让旧字符串保持不变。例如：\n\
  \n```python\n>>> mystring = \"hello\"\n>>> list3 = [1, mystring, 3]\n>>> list3\n\
  [1, 'hello', 3]\n>>> mystring = \"world\"\n>>> list3\n[1, 'hello', 3]\n```\n\n当然，在引用是默认值的情况下，这引发了关于如何在不使用引用的情况下进行拷贝的问题。对于列表来说，答案是使用\
  \ `[:]` 切片，这是我们之前看过的。它从第一个元素到最后一个元素（包含最后一个在内）进行切片，本质上是进行了不带引用的拷贝。它的样子如下：\n\n```python\n\
  >>> list4 = [\"a\", \"b\", \"c\"]\n>>> list5 = list4[:]\n>>> list4 = list4 + [\"\
  d\"]\n>>> list5\n['a', 'b', 'c']\n>>> list4\n['a', 'b', 'c', 'd']\n```\n\n列表有它们自己的内置方法集合，例如\
  \ `sort()`、`append()` 和 `pop()`。后两个在列表末尾添加和删除单个元素，其中 `pop()` 还会返回被删除的元素。例如：\n\n\
  ```python\n>>> list5 = [\"nick\", \"paul\", \"julian\", \"graham\"]\n>>> list5.sort()\n\
  >>> list5\n['graham', 'julian', 'nick', 'paul']\n>>> list5.pop()\n'paul'\n>>> list5\n\
  ['graham', 'julian', 'nick']\n>>> list5.append(\"Rebecca\")\n```\n\n此外，字符串的一个有趣方法返回一个列表：`split()`。它接受一个字符作为分割符符，然后给你一个列表，列表中的每个元素都是字符串的一个块。例如：\n\
  \n```python\n>>> string = \"This is a test string\";\n>>> string.split(\" \")\n\
  ['This', 'is', 'a', 'test', 'string']\n```\n\n列表在 Python 中被广泛使用，尽管随着语言的成熟，这种情况正在缓慢变化。列表的比较和排序方式在\
  \ `3.x` 中发生了变化，因此在你尝试执行这些任务时，务必检查最新文档。\n\n### 字典\n\n与列表不同，字典是没有固定顺序的集合。相反，它们有一个\
  \ `key`（元素的名称）和一个 `value`（元素的内容），Python 会根据性能最大化将它们放置在任何需要的地方。定义字典时，你需要使用大括号 `{}`\
  \ 和冒号 `:`。你从一个左括号开始，然后给每个元素一个键和一个值，用冒号隔开，如下：\n\n```python\n>>> mydict = { \"perl\"\
  \ : \"a language\", \"php\" : \"another language\" }\n>>> mydict\n{'php': 'another\
  \ language', 'perl': 'a language'}\n```\n\n这个示例有两个元素，键为 `perl` 和 `php`。然而，当打印字典时，我们发现\
  \ `php` 在 `perl` 之前——Python 并没有尊重我们输入的顺序。我们可以使用普通代码对字典进行索引：\n\n```python\n>>> mydict[\"\
  perl\"]\n'a language'\n```\n\n由于字典没有固定的序列，我们无法进行切片，或通过位置进行索引。与列表一样，字典是可变的，也可以嵌套；然而，与列表不同，你不能使用\
  \ `+` 合并两个字典。因此，两个具有相同的键会导致冲突。相反，你应该使用 `update()` 方法，它通过覆盖键来合并两个数组。你也可以使用 `keys()`\
  \ 方法返回所有键的列表。\n\n字典在 `3.x` 中的用法存在细微差异，例如需要调用列表方法来一次性生成所有值以便打印。再次强调，在继续学习时请务必检查最新文档，因为功能上有几处变化，某些工具的行为变得不同甚至消失，而其他新功能被向后移植了。\n\
  \n### 条件与循环\n\n到目前为止，我们只是在看数据类型，这应该向你展示 Python 数据类型有多强大。然而，没有条件语句和循环，你就无法编写复杂的程序。\n\
  \nPython 拥有大部分标准的条件检查，例如 `>`（大于）、`<=（小于等于）和 `==`（等于），它也添加了一些新的，例如 `in`。例如，我们可以使用\
  \ `in` 来检查字符串或列表是否包含给定的字符/元素：\n\n```python\n>>> mystring = \"J Hacker\"\n>>> \"\
  r\" in mystring\nTrue\n>>> \"Hacker\" in mystring\nTrue\n>>> \"hacker\" in mystring\n\
  False\n```\n\n最后一个例子演示了它是如何区分大小的。我们也可以对列表使用运算符：\n\n```python\n>>> mylist = [\"soldier\"\
  , \"sailor\", \"tinker\", \"spy\"]\n>>> \"tailor\" in mylist\nFalse\n```\n\n对这些复杂数据类型的其他比较是逐项进行的：\n\
  \n```python\n>>> list1 = [\"alpha\", \"beta\", \"gamma\"]\n>>> list2 = [\"alpha\"\
  , \"beta\", \"delta\"]\n>>> list1 > list2\nTrue\n```\n\n`list1` 的第一个元素（`alpha`）与\
  \ `list2` 的第一个元素（`alpha`）比较，因为它们是相等的，所以检查下一个元素。那个也是相等的，所以检查第三个元素，它是不同的。在字母表中，`gamma`\
  \ 中的 `g` 在 `delta` 中的 `d` 之后，因此 `gamma` 被认为大于 `delta`，而 `list1` 被认为大于 `list2`。\n\
  \n循环有两种类型，两种同样灵活。例如，`for` 循环可以遍历字符串中的字母或列表中的元素：\n\n```python\n>>> string = \"Hello,\
  \ Python!\"\n>>> for s in string: print s,\n...\nH e l l o , P y t h o n !\n```\n\
  \n`for` 循环获取字符串中的每个字母并将其赋值给 `s`。然后使用 `print` 命令将其打印到屏幕上，但注意末尾的逗号；这告诉 Python 不要在每个字母后插入换行。省略号（`...`）的存在是因为\
  \ Python 允许你在循环中输入更多代码；你需要再次按回车让循环执行。\n\n相同的结构可以用于列表：\n\n```python\n>>> mylist =\
  \ [\"andi\", \"rasmus\", \"zeev\"]\n>>> for p in mylist: print p\n...\nandi\nrasmus\n\
  zeev\n```\n\n在 `print` 语句后没有逗号，每个项目都会单独占一行。\n\n另一种循环是 `while` 循环，它看起来相似：\n\n```python\n\
  >> while 1: print \"This will loop forever!\"\n...\nThis will loop forever!\nThis\
  \ will loop forever!\nThis will loop forever!\nThis will loop forever!\nThis will\
  \ loop forever!\n(etc)\n\nTraceback (most recent call last):\n  File \"<stdin>\"\
  , line 1, in ?\nKeyboardInterrupt\n```\n\n这是一个无限循环（它会一直打印该文本），所以你需要按 `Ctrl+C` 中断它并恢复控制。如果你想使用多行循环，你需要准备好使用\
  \ 键：Python 通过记录使用的缩进级别来处理循环块。有些人认为这很讨厌人；另一些人则欣赏它强制用户编写整洁的代码。然而，我们大多数人只是专注于编程。\n\n\
  例如：\n\n```python\n>>> i = 0\n>>> while i < 3:\n...     j = 0\n...     while j <\
  \ 3:\n...         print \"Pos: \" + str(i) + \",\" + str(j) + \")\"\n...       \
  \  j += 1\n...     i += 1\n...\nPos: (0,0)\nPos: (0,1)\nPos: (0,2)\nPos: (1,0)\n\
  Pos: (1,1)\nPos: (1,2)\nPos: (2,0)\nPos: (2,1)\nPos: (2,2)\n```\n\n\n\n\n你可以使用 `break`\
  \ 和 `continue` 关键字来控制循环。`break` 会退出循环并立即继续后续处理，而 `continue` 则跳转到下一次循环迭代。\n\n我们在\
  \ 3.x 中再次发现了许多细微的变化。大多数条件判断和循环的工作方式保持不变，但由于我们在本节中提到了这一点，我们应该注意：`print` 在 3.x 中不再是一个语句，而是一个函数调用。这为我们讨论函数提供了一个非常友好的过渡。\n\
  \n### 函数\n\n其他语言——例如 PHP——在执行代码之前会读取并处理整个文件，这意味着你可以在函数定义之前调用它，因为编译器在尝试调用该函数之前会先读取该函数的定义。Python\
  \ 则不同：如果你在尝试调用函数时还没有到达该函数的定义，就会得到一个错误。这种行为背后的原因是 Python 实际上会为你的函数创建了一个对象，这反过来意味着两点：第一，你可以在脚本中多次定义同名函数，并让脚本在运行时选择正确的那个。第二，你只需要使用\
  \ `=` 就可以将函数赋值给另一个名称。\n\n函数定义以 `def` 开始，然后是函数名、括号和参数列表，最后是一个冒号。函数的内容需要比定义至少缩进一级。因此，通过函数赋值和动态声明，你可以编写一个以巧妙方式打印正确问候的脚本：\n\
  \n```\n>>> def hello_english(Name):\n    print \"Hello, \" + Name + \"!\"\n\n>>>\
  \ def hello_hungarian(Name):\n    print \"Szia, \" + Name + \"!\"\n\n>>> hello =\
  \ hello_hungarian\n>>> hello(\"Paul\")\nSzia, Paul!\n\n>>> hello = hello_english\n\
  >>> hello(\"Paul\")\n```\n\n注意，函数定义不包含类型信息。如前所述，函数是无类型的。这样做的好处是你可以写一个函数来完成几件事：\n\
  \n```python\n>>> def concat(First, Second):\n    return First + Second\n\n>>> concat([\"\
  python\"], [\"perl\"])\n['python', 'perl']\n\n>>> concat(\"Hello, \", \"world!\"\
  )\n'Hello, world!'\n```\n\n这演示了 `return` 语句如何将值传给调用者，同时也演示了函数如何对列表执行一种操作，而对字符串执行另一种操作。这里的魔法是由对象实现的。我们写一个函数告诉两个对象将它们彼此相加，而对象本质上就知道如何这样做。如果它们不知道——例如，用户可能传递了一个字符串和一个整数——Python\
  \ 会为我们捕获错误。然而，正是这种“放手不管，让对象自己解决问题”的态度让函数变得如此灵活。我们的 `concat()` 函数理论上可以拼接字符串、列表或 `zonks`——这是某人创建的、允许相加的数据类型。要点在于，我们并不限制函数能做什么。虽然听起来可能很俗气，但唯一的限制是你的想象力。\n\
  \n### 面向对象\n\n读到这里后，如果你已经使用了多年类 C 语言，听到 Python 的面向对象机制非常灵活，并且可能会让你感到惊讶，这并不意外。\n\n\
  学习 Python `面向对象编程 (OOP)` 的最好方法就是直接实践。这里有一个基础脚本，它定义了一个类，创建了该类的对象并调用了一个函数：\n\n```python\n\
  class Dog(object):\n    def bark(self):\n        print \"Woof!\"\n\nfluffy = Dog()\n\
  fluffy.bark()\n```\n\n定义类正如预料的那样是以 `class` 关键字开始，后面跟着你正在定义的类名和冒号。该类的内容需要缩进一级，以便\
  \ Python 知道它何时结束。注意，括号内的对象是为了用于继承，这将在稍后讨论。目前，你最少需要知道的是，如果你的新类不是基于现有类，你应该像前面的代码所示，在括号内放入对象。\n\
  \n类内部的函数工作方式与普通函数相同（尽管它们通常被称为方法）；主要的区别在于它们都至少接受一个参数，通常称为 `self`。这个参数被填充为调用该函数的对象的名称，并且你需要显式地使用它。创建类的实例是通过赋值完成的。你不需要像其他语言那样的任何关键字——提供括号就让创建行为显而可见。\n\
  \n#### 类变量和对象变量\n\n每个对象都有自己的变量，你可以独立于相同类型的对象来操作这些变量。此外，某些类变量为所有类设置了默认值，并可以进行全局操作。这个脚本演示了创建两个\
  \ `dog` 类的对象，每个对象都有自己的名称：\n\n```python\nclass Dog(object):\n    name = \"Lassie\"\
  \n    def bark(self):\n        print self.name + \" says 'Woof'\"\n    def set_name(self,\
  \ name):\n        self.name = name\n\nfluffy = Dog()\nfluffy.bark()\npoppy = Dog()\n\
  poppy.set_name(\"Poppy\")\npoppy.bark()\n```\n\n输出：\nLassie says 'Woof'\nPoppy says\
  \ 'Woof'\n\n在这里，每只狗都从 `Lassie` 开始，但它被自定义了。请记住，Python 是按引用赋值，这意味着每个对象都有指向类变量的引用，当我们使用\
  \ `set_name()` 方法进行赋值时，该引用丢失了。这意味着我们没有更改的任何引用都可以进行全局操作。因此，如果我们更改了类的变量，该类中所有没有为该变量设置自身值的实例，也会随之改变。例如：\n\
  \n```python\nclass Dog(object):\n    name = \"Lassie\"\n    color = \"brown\"\n\n\
  fluffy = Dog()\npoppy = Dog()\nprint fluffy.color\nDog.color = \"black\"\nprint\
  \ puppy.color\nfluffy.color = \"yellow\"\nprint fluffy.color\nprint puppy.color\n\
  ```\n\n所以，狗的默认颜色是 `brown`——`fluffy` 和 `poppy` 对象开始都是 `brown`。然后，使用 `Dog.color`，我们将默认颜色设置为\
  \ `black`，因为这两个对象都没有设置过自己的颜色值，所以它们被更新为 `black`。倒数第三行使用 `poppy.color` 为 `poppy` 对象设置了自定义颜色值——`poppy`\
  \ 变成了 `yellow`，而 `fluffy` 和通用的 `dog` 类仍然保持为 `black`。\n\n#### 构造函数和析构函数\n\n为了帮助你自动化对象的创建和删除，你可以轻松地覆盖两个方法：`__init__`\
  \ 和 `__del__`。这些是 Python 在类实例化和释放时调用的方法，分别被称为`构造函数`和`析构函数`。\n\n拥有自定义构造函数在你需要为每个创建的对象接受一组参数时非常有用。例如，你可能希望每只狗在创建时都有自己的名称，你可以通过以下代码实现这一点：\n\
  \n```python\nclass Dog(object):\n    def __init__(self, name):\n        self.name\
  \ = name\n\nfluffy = Dog(\"Fluffy\")\nprint fluffy.name\n```\n\n如果你在创建 `Dog` 对象时没有提供\
  \ `name` 参数，Python 会报告错误并停止。当然，你可以请求你想要的任何数量的构造函数参数，但最好只请求你需要的，并用其他函数来填充剩余部分。\n\n\
  另一方面是析构方法，它允许你对对象销毁时发生的情况有更多控制。通过使用这两个方法，我们可以在对象创建和删除时打印消息来展示对象的生命周期：\n\n```python\n\
  class dog(object):\n    def __init__(self, name):\n        self.name = name\n  \
  \      print self.name + \" is alive!\"\n    def __del__(self):\n        print self.name\
  \ + \" is no more!\"\n\nfluffy = Dog(\"Fluffy\")\n```\n\n\n\n\n析构函数的作用是让你有机会释放分配给该对象的资源，或者可能向文件记录某些内容。请注意，虽然可以重写\
  \ `__del__` 方法，这是一个非常危险的想法，因为无法保证当解释器退出时，仍然存在的对象的 `__del__` 方法一定会被调用。Python 官方文档在这一处对很好地解释了这一点：[`docs.python.org/reference/datamodel.html#object.__del__`](http://docs.python.org/reference/datamodel.html#object.__del__)。\n\
  \n## 类继承\n\nPython 允许你通过从一个或多个类中继承一个类来重用代码。例如，狮子、老虎和熊都是哺乳动物，因此它们拥有许多相似的属性。在这种情况下，你并不希望在它们之间反复复制和粘贴函数；更明智（也更简单）的方法是创建一个哺乳动物类，定义所有共享的功能，然后让每种动物都继承该类。\n\
  \n考虑以下代码：\n\n```python\nclass Car(object):\n    color = \"black\"\n    speed = 0\n\
  \    def accelerate_to(self, speed):\n        self.speed = speed\n    def set_color(self,\
  \ color):\n        self.color = color\n\nmycar = Car()\nprint mycar.color\n```\n\
  \n这创建了一个具有默认颜色的 `Car` 类，并提供了一个 `set_color()` 函数，以便人们更改自己的颜色。现在，你开什么去上班？是汽车吗？当然是，但它很可能是福特、道奇、吉普或其他品牌；你不会买到没有品牌的汽车。另一方面，你也不希望为每个品牌都定义一个类（如\
  \ `Ford`），并为它提供 `accelerate_to()`、`set_color()` 以及基础汽车拥有的任何其他方法，然后对法拉利、日产等重复同样的操作。\n\
  \n解决方案是使用继承：定义一个 `car` 类，其中包含所有品牌的所有共享函数和变量，然后从该类进行继承。在 Python 中，你通过在 `class` 声明的括号中放入要继承的类名来实现这一点，如下：\n\
  \n```python\nclass Car(object):\n    color = \"black\"\n    speed = 0\n    def accelerate_to(self,\
  \ speed):\n        self.speed = speed\n    def set_color(self, color):\n       \
  \ self.color = color\n\nclass Ford(Car): pass\nclass Nissan(Car): pass\n\nmycar\
  \ = Ford()\nprint mycar.color\n```\n\n`pass` 指令是一个空语句；意味着我们的类不包含任何新内容。然而，由于 `Ford`\
  \ 和 `Nissan` 类继承自 `car` 类，它们获得了由父类提供的 `color`、`speed`、`accelerate_to()` 和 `set_color()`。请注意，在\
  \ `Ford` 和 `Nissan` 的类名后不需要加 `object`，因为它们继承自已存在的类：`car`。\n\n默认情况下，Python 会赋予你父类拥有的所有方法，但你可以通过为需要它的类提供新的实现来重写它们。例如：\n\
  \n```python\nclass Modelt(car):\n    def set_color(self, color):\n        print\
  \ \"Sorry, Model Ts 只有黑色的!\"\n\nmyford Ford()\nFord.set_color(\"green\")\n\nmycar\
  \ = Modelt()\nmycar.set_color(\"green\")\n```\n\n第一辆车是作为 `Ford` 创建的，因此 `set_color()`\
  \ 将正常工作，因为它使用了来自 `car` 类的方法。然而，第二辆车是作为 `Model T` 创建的，它有自己的 `set_color()` 方法，因此该调用将失败。\n\
  \n这提供了一个有趣的场景：如果你重写了一个方法，但仍然想调用父类的方法该怎么办？例如，如果允许更改 `Model T` 的颜色只是需要额外付费，那么：\n\n\
  ```python\nclass Modelt(car):\n    def set_color(self, color):\n        print \"\
  Sorry, Model Ts 只有黑色的!\"\n\nmyford Ford()\nFord.set_color(\"green\")\n\nmycar =\
  \ Modelt()\nmycar.set_color(\"green\")\n```\n（注：此处示例代码中似乎存在细微语法错误如 `myford Ford()`\
  \ 应为 `mycar = Ford()`，翻译时保留原文逻辑）\n\n\n\n对于某些程序，例如短的 shell 脚本或用于在文件中搜索文本的 Perl 单行命令，运行速度的差异可以忽略不计。在桌面电脑上，你的音乐播放器是用\
  \ Python 编写的可能并不重要，如果它运行很慢，购买一台新的、更快的桌面系统可能是一个可以接受方案。\n\n然而，在某些应用程序中，运行程序所需的时间会有巨大差异。例如，使用运行缓慢的语言对科学数据进行计算，特别是在高性能计算（HPC）资源（如超级计算机集群）上进行时，是愚蠢的；为了利用该平台，使用你可用的最快语言（如\
  \ C）既节省时间又节省成本。\n\n这种观点在 Matthew Helmke 与德克萨斯大学奥斯汀分校德克萨斯先进计算中心副主任 Dan Stanzione\
  \ 的一次对话中得到了加强。Stanzione 表示，HPC 计算资源非常昂贵，因此，花经费请一位一年的优秀的 C 程序员，通常比在 HPC 系统上运行用 Perl\
  \ 或 Python 编写的生物信息学程序要明智得多。正如他所说：“如果你的电脑花费 2000 美元，那么程序员的时间就是主要成本，这才是驱动软件开发的动力。如果你的电脑价值高达\
  \ 1000 万美元或更多，那么让程序员额外花一个月、一年或几十年时间进行软件优化是非常值得的。坚强起来，用 C 语言编写吧。”\n\n***\n\n### 在\
  \ Linux 下使用 C 语言编程\n\nC 是与 Linux 或 BSD 等类 Unix 操作系统关联最频繁的编程语言。自 20 世纪 70 年代以来，Unix\
  \ 操作系统及其应用程序大部分用 C 语言编写。由于 C 语言不直接依赖任何特定的硬件架构，Unix 是最早的可移植操作系统之一。换句话说，构成 Unix 的大部分代码并不知道也不在乎实际上运行在哪种电脑上。特定机器的特性被隔离在\
  \ Unix 内核的几个模块中，这使得你在移植到不同的硬件架构时可以很容易地修改它们。\n\nC 是一种编译语言，这意味着你的 C 源代码首先由预处理器分析，然后首先翻译成汇编语言，然后转换为适用于目标\
  \ CPU 的机器指令。随后，汇编器从机器指令创建二进制文件（或对象文件）。最后，链接器将对象文件链接到任何所需的外部软件支持。C 程序存储在以 `.c` 扩展结尾的文本文件中，并且始终包含一个例程或函数，例如\
  \ `main()`，除非该文件是包含文件（带有 `.h` 扩展，也称为头文件），其中共享变量定义或其他数据或声明。函数是执行 C 程序编写时要完成的任务中每一步的命令。\n\
  \n***\n\n### 注意\n\nLinux 内核大部分用 C 语言编写，这就是为什么 Linux 能够支持许多不同的 CPU。要了解更多关于从源码构建 Linux\
  \ 内核的信息，请参见 第 21 章“内核与模块管理”。\n\n***\n\nC++ 是 C 的面向对象扩展。由于 C++ 是 C 的超集，因此 C++ 编译器可以正确编译\
  \ C 程序，并且可以在 C++ 中编写非面向对象的代码。反之则不然：C 编译器无法编译 C++ 代码。\n\nC++ 通过提供面向对象设计和代码所需的必要特性，扩展了\
  \ C 的能力。C++ 还提供了一些特性，例如将函数与数据结构关联的能力，而不需要使用基于类的面向对象技术。由于这些原因，C++ 语言允许现有的 Unix 程序随着时间的推移转向采用面向对象。\n\
  \nC++ 编程的支持由 `gcc` 提供，当你编译 C++ 代码时，使用 `g++` 运行它。\n\n### 使用 Ubuntu 提供的 C 语言项目管理工具\n\
  \nUbuntu 包含了许多让 C/C++ 程序员生活更简单的工具。有用于创建程序（编辑器）、编译程序（`gcc`）、创建库（`ar`）、控制源码（Git, Mercurial,\
  \ Subversion）、自动化构建（`make`）、调试程序（`gdb` 和 `ddd`）以及确定效率低下之处（`gprof`）。\n\n以下章节介绍了 Ubuntu\
  \ 包含的一些编程和项目管理工具。如果你有一定的 Unix 经验，你将熟悉这些大多数程序，因为它们是程序员软件套的传统补充。\n\n#### 使用 `make`\
  \ 构建程序\n\n你使用 `make` 命令来自动构建和安装 C 程序，对于这来说，它是一个简单的工具。然而，如果你想创建自己的自动化构建，你需要学习 `make`\
  \ 使用的特殊语法；接下来的章节将引导你完成基本的 `make` 设置。\n\n#### 使用 Makefile\n\n`make` 命令通过使用 Makefile\
  \ 自动构建和更新应用程序。Makefile 是一个文本文件，其中包含关于传递给编译器预处理器、编译器、汇编器和链接器的选项的指令。Makefile 还规定了（其他其他）特定代码模块需要编译哪些源码文件（以及相应的编译器命令行），以及构建程序需要哪些代码模块——这种机制称为依赖检查。\n\
  \n`make` 命令的妙之处在于它的灵活性。你可以配合简单的 Makefile 使用 `make`，也可以编写包含许多宏、规则或命令的复杂 Makefile，这些命令可以在单个目录中工作或递归遍历你的文件系统来构建程序、更新系统，甚至作为文档管理系统运行。`make`\
  \ 命令适用于几乎任何程序，包括 TeX 等文本处理系统。\n\n你可以使用 `make` 来编译、构建和安装软件软件包，使用如下简单的命令：\n\n```\n\
  matthew@seymour:~$ sudo make install\n```\n\n你可以使用默认的 Makefile（通常称为 `Makefile`，大写\
  \ M），或者可以使用 `make` 的 `-f` 选项指定任何 Makefile，例如 `MyMakeFile`，如下：\n\n```bash\nmatthew@seymour:~$\
  \ sudo make -f MyMakeFile\n```\n\n取决于你 Makefile 的内容，可能还有其他选项。你可能有一个名为 `hi.c` 的源文件，只需运行\
  \ `make hi`，其中 make 会自动计算需要做什么来构建最终的可执行文件。可以通过 `make -p` 查看 `make` 的内置规则。\n\n#####\
  \ 使用宏和 Makefile 目标\n\n配合宏使用 `make` 可以使程序可移植。宏允许其他操作系统的用户通过指定本地值来轻松配置程序构建，例如任何所需软件工具的名称和位置或路径。在示例中，宏定义了编译器名称（`CC`）、安装程序（`INS`）、程序应安装的位置（`INSDIR`）、链接器查找所需库的位置（`LIBDIR`）、所需库的名称（`LIBS`）、源代码（`SRC`）、中间对象文件（`OBJS`）以及最终程序的名称（`PROG`）：\n\
  \n```makefile\n# 一个骨架程序的示例 makefile\nCC= gcc\nINS= install\nINSDIR = /usr/local/bin\n\
  LIBDIR= -L/usr/X11R6/lib\nLIBS= -lXm -lSM -lICE -lXt -lX11\nSRC= skel.c\nOBJS= skel.o\n\
  PROG= skel\n\nskel:  ${OBJS}\n\t${CC} -o ${PROG} ${SRC} ${LIBDIR} ${LIBS}\n\ninstall:\
  \ ${PROG}\n\t${INS} -g root -o root ${PROG} ${INSDIR}\n```\n\n\n\n上一个示例中的缩进行使用的是制表符（tabs），而不是空格。这一点非常！人类很难看出这种区别，但\
  \ `make` 可以识别。如果你在 Linux 下首次开始构建程序时，`make` 报告了困惑的错误，请检查项目的 `makefile` 是否使用了制表符以及其他正确的格式。\n\
  \n***\n\n使用前示例中的 `makefile`，你可以这样构建程序：\n\n```bash\nmatthew@seymour:~$ sudo make\n\
  ```\n\n要构建 makefile 的特定组件，你可以在命令行使用目标（target）定义。要只构建程序，你可以使用 `make` 配合 `skel` 目标，如下：\n\
  \n```bash\nmatthew@seymour:~$ sudo make skel\n```\n\n如果你对目标对象的任何元素（例如源代码文件）进行了任何更改，`make`\
  \ 会自动重新构建该目标。这一功能是使用 `make` 管理开发项目的便利之处之一。要一步完成程序的编译和安装，你可以这样指定 `install` 目标：\n\n\
  ```bash\nmatthew@seymour:~$ sudo make install\n```\n\n较大的软件项目在 `makefile` 中可能有许多传统的目标，例如：\n\
  \n- `test`——对最终软件运行特定测试。\n- `man`——使用 `man` 宏处理包含文件或 `troff` 文档。\n- `clean`——删除任何剩余的对象文件。\n\
  - `archive`——清理、归档并压缩整个源代码树。\n- `bugreport`——自动收集并邮送一份构建或错误日志的副本。\n\n大型应用程序可能需要数百个源代码文件。编译和链接这些应用程序是一项复杂且容易出错的任务。`make`\
  \ 工具可以帮助你组织从许多源文件构建复杂应用程序的可执行形式的过程。\n\n## 使用 `autoconf` 工具来配置代码\n\n`make` 命令只是 Ubuntu\
  \ 自带的几种编程自动化工具之一。还有其他工具，例如 `pmake`（可实现并行 make）、`imake`（一种依赖关系驱动的 makefile 生成器，用于构建\
  \ X11 客户端）、`automake` 以及较新的工具之一的 `autoconf`，后者用于构建可以用来配置程序源码包的 shell 脚本。\n\n为 Linux\
  \ 构建许多以源码形式分发的软件软件包，需要使用 GNU 的 `autoconf` 工具。该程序会构建一个名为 `configure` 的可执行 shell 脚本，执行该脚本时，它会自动根据目标主机（你的\
  \ Linux 系统）上安装的软件资源或依赖项（如编程工具、库和相关程序）检查并定制客户端的源码构建。\n\n许多以源码形式下载的 Linux 命令和 X 图形客户端都包含了\
  \ `configure 脚本`。要配置源码包、构建软件并安装新程序，`root` 用户可能如下使用该脚本（在解压源码并进入生成的构建目录之后）：\n\n```bash\n\
  matthew@seymour:~$ ./configure ; make ; sudo make install\n```\n\n`autoconf` 程序使用一个名为\
  \ `configure.in` 的文件，该文件包含基础规则集或一组宏。`configure.in` 文件是通过 `autoscan` 命令创建的。构建一个可以执行的\
  \ `configure` 脚本还需要一个 makefile 模板，名为 `Makefile.in`。虽然可以手动创建检查依赖 `configure` 脚本，但你也可以使用图形化项目开发工具（如\
  \ KDE 的 KDevelop 或 GNOME 的 Glade）轻松克服任何复杂的依赖关系。（更多信息，请参见本章节后面的“图形化开发工具”部分。）\n\n\
  ## 调试工具\n\n调试既是科学也是艺术。有时，最简单的工具——代码列表——就是最好的调试工具。但在其他情况下，你需要使用其他的调试工具。其中三个工具是 `splint`、`gprof`\
  \ 和 `gdb`。\n\n### 使用 `splint` 检查源代码\n\n`splint` 命令类似于传统的 UNIX `lint` 命令：它静态地检查源代码中可能的问题，并具有许多额外功能。即使你的\
  \ C 代码符合 C 标准并通过了编译，它仍然可能包含错误。`splint` 执行许多类型的检查并提供详尽的错误信息。例如，这个简单的程序可能顺利编译并运行：\n\
  \n```bash\nmatthew@seymour:~$ gcc -o tux tux.c\nmatthew@seymour:~$ ./tux\n```\n\n\
  但 `splint` 命令可能会指出源码中的一些严重问题：\n\n```bash\nmatthew@seymour:~$ splint tux.c\n\nSplint\
  \ 3.1.2 --- 29 Apr 2009\n\ntux.c: (in function main)\n\ntux.c:2:19: Return value\
  \ (type int) ignored: putchar(t[++j] -...\n  Result returned by function call is\
  \ not used. If this is intended, can cast\n  result to (void) to eliminate message.\
  \ (Use -retvalint to inhibit warning)\nFinished checking --- 1 code warning\n```\n\
  \n你可以像使用 `splint` 命令的 `-strict` 选项获取更详细的报告：\n\n```bash\nmatthew@seymour:~$ splint\
  \ -strict tux.c\n```\n\n`gcc` 也通过使用大量的警告（通过 `-Wall` 和 `-pedantic` 选项）支持诊断：\n\n```bash\n\
  matthew@seymour:~$ gcc -Wall tux.c\ntux.c:1: warning: return type defaults to 'int'\n\
  tux.c: In function 'main':\ntux.c:2: warning: implicit declaration of function 'putchar'\n\
  ```\n\n### 使用 `gprof` 跟踪函数时间\n\n你使用 `gprof`（分析）命令来研究程序是如何消耗时间的。如果程序使用 `-p` 标志进行编译和链接，在执行时会创建一个\
  \ `mon.out` 文件，其中包含每个函数被调用的频率以及在函数中花费的时间的数据。`gprof` 解析并显示这些数据。对 `gprof` 生成的输出进行分析有助于你确定性能瓶颈所在。使用优化编译器可以加速。\n\
  \n### 使用 `gdb` 进行符号调试\n\n`gdb` 工具是一个符号调试器。当程序使用 `-g` 标志编译时，符号表会被保留，并可以使用符号调试器来跟踪程序。基本技术是在发生核心转储（core\
  \ dump，一个包含崩溃程序所用内存快照的文件）后调用 `gdb` 并获取堆栈跟踪（stack trace）。堆栈跟踪指示发生核心转储的源码行以及为了到达该行而调用的函数。通常，这足以识别问题了。但这并不是\
  \ `gdb` 的限制。\n\n`gdb` 还提供了一个交互式调试程序的环境。通过带程序调用 `gdb` 允许你设置断点、检查变量值并监控变量。如果你怀疑某行代码附近存在问题，可以在该行设置断点并运行\
  \ `gdb`。当到达该行时，执行会被中断。你可以检查变量值、检查堆栈跟踪并观察程序环境。你可以单步执行程序以检查值。你可以在任何点恢复执行。通过使用断点，你可以在代码中发现许多\
  \ bug。\n\n`gdb` 的图形 X Window 界面被称为 *Data Display Debugger* 或 `ddd`。\n\n## 使用 GNU\
  \ C 编译器\n\n如果你在安装 Ubuntu 时选择了安装开发工具包（或者可能是之后使用 `synaptic`），那么你应该已经有了 *GNU C 编译器*（`gcc`）。GNU\
  \ C 编译器有许多不同的可用选项，其中许多与与其他 UNIX 系统上可用的 C 和 C++ 器的选项相似。查看 `gcc` 的手册页或信息文件可以获取完整的选项列表和描述。\n\
  \n***\n\n> 注意\n\nGNU C 编译器是 GNU 编译器集（GNU Compiler Collection）的一部分，该合集还包含了针对其他几种语言的编译器。\n\
  \n***\n\n当你使用 `gcc` 构建 C 程序时，编译过程分几个步骤进行：\n\n\n\n\n\n# 1. 编译过程\n\n**1.** 首先，C 预处理器会解析文件。为此，它会按顺序读取行、包含头文件并执行宏替换。\n\
  \n**2.** 编译器解析修改后的代码以确定是否使用了正确的语法。在此过程中，它会构建一个符号表并创建一个中间对象格式。大多数符号都被分配了特定的内存地址，但在其他模块中定义的符号（例如外部变量）则没有。\n\
  \n**3.** 编译的最后一个阶段是 `linking`（链接），它将不同的文件和库连接在一起，并通过解析之前未解析的符号来链接这些文件。\n\n***\n\n\
  ## 注意\n\n如果你遵循严格的 ANSI 规则，大多数 C 程序可以使用 C++ 编译器进行编译。例如，你可以使用 GNU C++ 编译器编译标准的 `hello.c`\
  \ 程序（每个人的第一个程序）。通常，你将文件命名为 `hello.cc`、`hello.C`、`hello.c++` 或 `hello.cxx`。GNU C++\
  \ 编译器接受这些任何一个名称。\n\n***\n\n## 图形化开发工具\n\nUbuntu 包含了许多可在 X 会话期间使用的图形化原型设计和开发环境。如果你想为\
  \ KDE 或 GNOME 构建客户端软件，你可能会发现 `KDevelop`、`Qt Designer` 和 `Glade` 程序非常有帮助。你可以使用这些程序中的每一个来为交互式窗口客户端构建图形化框架，并可以使用它们每一个来自动生成支持你的程序自定义界面所需的代码骨架。\n\
  \n### 使用 KDevelop 客户端\n\n你可以从应用程序菜单或终端窗口的命令行（如下所示）图 39.1 启动 `KDevelop` 客户端：\n\n\
  ```bash\nmatthew@seymour:~$ kdevelop &\n```\n\n![Image](img/39fig01.jpg)\n\n图 39.1\
  \ KDE 的 Kdevelop 是一个用于 Linux 的快速原型设计和客户端构建工具。\n\n按下回车键后，`KDevelop` 安装向导会运行，引导你通过几个简短的向导对话框，以设置并确保稳定的构建环境。然后你必须再次运行\
  \ `kdevelop`（通过命令行或点击桌面面板上“编程”菜单下的菜单项）。随后你会看到 `KDevelop` 主窗口，可以通过选择 `KDevelop` 的项目菜单并点击\
  \ New（新建）菜单项来启动项目。\n\n你可以通过逐步向导对话框来开始构建项目。当你点击 Create（创建）按钮时，`KDevelop` 会自动生成 KDE\
  \ 客户端源目录中通常包含的文件（包括 `configure` 脚本，它检查依赖项并生成客户端的 makefile）。要测试你的客户端，你可以先点击 Build\
  \ 菜单下的 Make 菜单项（或按 F8），或者直接点击 Execute（执行）菜单项（或按 F9），客户端会自动构建。你可以使用 `KDevelop` 创建\
  \ KDE 客户端、`Konqueror` 浏览器的插件、KDE `kicker`面板小组件、KDE 桌面主题、基于 Qt 库的客户端，甚至是用于 GNOME\
  \ 的程序。\n\n### 用于 GNOME 开发的 Glade 客户端\n\n如果你喜欢使用 GNOME 及其开发工具，Glade GTK+ GUI 构建器可以在构建程序的基本骨架时帮助你节省精力和时间。从桌面面板的“编程”菜单启动\
  \ `Glade`。\n\n当你启动 `Glade` 时，家目录下会创建一个名为 `Projects` 的目录，你会看到一个主窗口以及两个浮动的调色板（Palette）和属性（Properties）窗口（参见图\
  \ 39.2，该图显示了一个为主窗口添加了日历组件的基本 GNOME 客户端）。你可以使用 `Glade` 的文件菜单保存空项目，然后通过从调色板窗口点击并添加用户界面元素开始构建你的客户端。例如，你可以先点击调色板窗口的\
  \ Gnome 按钮，然后点击创建你新客户端的主窗口。会出现一个带有菜单和工具栏的窗口——这就是新 GNOME 客户端的基础框架。\n\n![Image](img/39fig02.jpg)\n\
  \n图 39.2 你可以使用 GNOME Glade 客户端来构建和预览自定义 GNOME 程序的图形化界面。\n\n#### 参考文献\n\n- [www.cprogramming.com](http://www.cprogramming.com)—学习\
  \ C 和 C++ 的有用网站。\n- [`gcc.gnu.org/`](http://gcc.gnu.org/)—`gcc`（GNU 编译器集合）的主网站。\n\
  - [www.gnu.org/software/autoconf/autoconf.html](http://www.gnu.org/software/autoconf/autoconf.html)—更多关于\
  \ GNU 项目的 `autoconf` 工具以及如何构建可移植软件项目的信息。\n- [`qt.nokia.com`](http://qt.nokia.com)—Qt\
  \ 主网站。\n- [`glade.gnome.org`](http://glade.gnome.org)—Glade GNOME 开发者工具的主页。\n- [www.kdevelop.org](http://www.kdevelop.org)—托管\
  \ KDevelop 项目最新版本 KDE 图形化开发环境 KDevelop 的网站。\n- *The C Programming Language*, by\
  \ Brian W. Kernighan and Dennis M. Ritchie, Prentice Hall. \n- *The Annotated C++\
  \ Reference Manual*, by Margaret A. Ellis and Bjarne Stroustrup, ANSI Base Document.\n\
  - *Programming in ANSI C*, by Stephen G. Kochan, Sams Publishing.\n- *Sams Teach\
  \ Yourself C in 21 Days*, by Peter Aitken, Sams Publishing.\n- *C How Program and\
