  \ 索引\n\n## 关于作者\n\n`Matthew Helmke` 是 Ubuntu 社区的活跃成员。他曾在 2006 年至 2011 年担任 Ubuntu\
  \ 论坛委员会成员，为 Ubuntu 论坛（[www.ubuntuforums.org](http://www.ubuntuforums.org））提供领导和监督，并在欧洲、中东和非洲的\
  \ Ubuntu 地区成员审批委员会工作过两年。他曾在多家杂志和网站上写过关于 Ubuntu 的文章，是 *The Official Ubuntu Book*\
  \ 的首席作者，并合著了 *The VMware Cookbook*。他在 The iPlant Collaborative（[www.iplantcollaborative.org](http://www.iplantcollaborative.org））工作，该机构由国家科学基金会资助，正在构建世界上首个生物科学网络基础设施。Matthew\
  \ 早在 1987 年在大学的 `Vax` 上学习 `LISP` 时首次使用了 `Unix`。他曾仅使用自由开源软件经营过业务，担任过顾问，并于最近获得了亚利桑那大学的信息资源与图书馆科学硕士学位。你可以在\
  \ `matthewhelmke.com` 了解更多关于 Matthew 的信息，或通过 matthew@matthewhelmke.com 给他发邮件提供错误报告或建议。\n\
  \n`Andrew Hudson` 是一位专注于 `Linux` 写作的自由记者。他在基于 `Red Hat` 和 `Debian` 的 Linux 发行版及部署方面拥有丰富经验，经常可以看到他坐在键盘前纯粹出于兴趣在调整各种设置和配置文件。他住在英国威尔特郡郡（Wiltshire），与妻子\
  \ Bernice 和儿子 John 生活在一起。Andrew 不喜欢 `Emacs`。可以通过 andy.hudson@gmail.com 与他联系。\n\n\
  `Paul Hudson` 是公认的开源技术专家。他还是一名专业开发者，以及 *Future Publishing* 的全职记者。他的文章发表在 *MacFormat*、*PC\
  \ Answers*、*PC Format*、*PC Plus* 和 *Linux Format* 上。Paul 对所有形式的自由软件充满热情，并混合使用 `Linux`\
  \ 和 `BSD` 来驱动桌面和服务器。Paul 喜欢 `Emacs`。可以通过 [`hudzilla.org`](http://hudzilla.org) 与他联系。\n\
