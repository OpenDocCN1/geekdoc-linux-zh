  \ 均保持不变 。\n\n\n\n无数书籍都关注初级用户。但本书并非其中之一。在*Ubuntu Unleashed*中，我们的目标是编写恰好的内容，让你从现状达到你想要或需要达到的目标。这本书不是为那些希望或需要详细列出每一个步骤的新手准备的，尽管我们偶尔也会这样做。这本书是为那些希望了解“可以做什么”以及“如何开始做”的人准备的。互联网是一个极其强大的参考工具，因此这不是一本详尽的参考书。这本书是一项帮助你洞清全局的工具；让你学习你所寻求的足够知识，同时也确保没有凭据正确启动的问题。\n\
  \n### 系统管理员、程序员与 DevOps\n\n系统管理员（或 `Sysadmins`）承担着巨大的责任，负责保持服务器和网络持续运行且无故障；他们的角色有时被称为“运维”（`operations`），他们在幕后处理软件安装/配置及安全，使他人能够高效地使用这些系统。他们赢得高度尊重，尽管工作经常被低估，但薪水优厚，且对计算机系统拥有完全控制权。这也带来了巨大的责任——追求最大的运行时间/可用性使得\
  \ Ubuntu 成为完美的服务器操作系统，书中涵盖了许多所需的知识。\n\n程序员（“开发者”）利用 Ubuntu 等平台在此类基础设施之上创建应用程序，非常适合编写、测试\
  \ Web 应用、桌面/服务器项目以及进行新语言实验，因此通过书中的内容帮助开启职业道路。\n\nDevOps 结合了开发者与运维的角色，弥合了兴奋感与稳定性之间过时的对立，寻求平衡并消除了团队内部的沟通障碍，通过云计算、虚拟化和更敏捷的方法获得巨大成果，有效地为终端客户提供服务。它提供了对这两项技能的基础性理解，希望在全文中保持平衡的呈现。随附的\
