  - 如果一切都停止工作（且你没有看到冒烟），这可能是 ISP 或电话公司的故障。休息一下，给他们一些时间来修复。\n- 永远不要在睡眠不足或咖啡因摄入过量时配置网络连接；你明天不得不重做。\n\
  \n***\n\n## 相关的 Ubuntu 和 Linux 命令\n\n在你的 Ubuntu 系统中管理网络连接性时，你将使用这些命令：\n\n- `dhclient`—自动获取并为网卡（NIC）设置\
  \ IP 信息。\n- `ethereal`—GNOME 图形界面网络扫描器。\n- `ufw`—Ubuntu 的基本防火墙工具。\n- `ifconfig`—显示并管理\
  \ Linux 网络设备。\n- `iwconfig`—显示并设置无线网络设备参数。\n- `route`—显示并管理 Linux 内核路由表。\n- `ssh`—OpenSSH\
  \ 远程登录客户端，telnet 的首选替代方案。\n- `nm-connection-editor`—Ubuntu 配置网络连接的 GUI 工具。\n\n***\n\
