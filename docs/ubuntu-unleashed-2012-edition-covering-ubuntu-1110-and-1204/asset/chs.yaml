  \n## 检查 Google Chrome 和 Chromium\n\n过去一年中关注科技新闻的人都听说过 Google Chrome 的爆发性出现（参见图 4.2）。这种新浏览器快速、安全、可以通过扩展程序扩展，并且是极客桌面上最火的新玩具……它基于\
  \ WebKit 和其他技术，下载和渲染快速，同时符合标准，你可以在 www.google.com/chrome?platform=linux 了解更多关于轻松安装的信息!<br>\n\
