  \ 7 Other Ubuntu Desktops 其他 Ubuntu 操作系统界面章节介绍:\n\n您在安装统一面板时使用的是标准 Unity 主题（参见第\
  \ 3 章：工作于某种显示风格）。该用户图形交互界面的具体优点吸引了许多使用者……不过有些人可能具有特殊的偏好或喜欢动手尝试新事物；本章将讨论除 Main Crispenery\
  \ 以外的几种部署选择及其强弱项以及如何安装。并非全部可用的选项，而是对比较受欢迎的一些做出提纲挈领地描述，帮助读者涉足 Linux 系统多样化视觉呈现领域中去（这一行业抽象程度较高，请注意不同终端间行为差异）。\n\
  \n---\n\n双引号含义警告框：\n当您装备好基础板块的同时，也让系统中的另一个个性化部件共存是完全可行的。本书所列举的各套解决方案都能与原有的经典版配合运作，只需每次登录挑选一个来用就可以轻易测试而无需承担太大风险，因为回归旧熟悉环境十分简单直接明了，不做作不绕圈子，非常透明公开灵活，配置自由度极高。\n\
  \n### Desktop Environments\n \n所谓“美化操作台”本质上是一个图形化的应用程序，用户在特定电脑屏幕上通过模拟实体办公桌概念让互动更容易理解。正如办公室里常用的文件夹存放着执掌公用事务所需的信息资料，数字化科技产物进一步拓展这种设计，新增了专用工具集，允许人们根据业务需求创造、修改、删除那些记录，相比现实世界更高效且能力更强……\
  \  \n窗口管理机制是另一种比喻式信息管理方式，把隐藏在后端的复杂运算具象化呈现在上文提到的那个可视化平面上。文件和目录图标随你摆弄就象用手挪动纸质物件那样直观方便，流程还包括绘制窗口所需的各类控件(*)\
  \ 配套代码使命给后台分发指令同时反馈前台画面。例如把一个档案从一个位置移动到别处仅需拖拽一步完成，实际上整个范本在处理过程当中持续侦听总览管理器传递来的重定位要求，随后指示相关组件即时更新展示状态变化。\n\
  \nUbuntu 的资源库收纳了所有主流现成的改良外观布置包和一套使其简便易安的模式，甚至敢闯的人自己探索额外非官方渠道也能装载的实施策略不在本文议题范围内，不再赘述！\
  \   \n有时人们也情愿保留整套皮肤更换其中某个子系统默认可替代，比如传统顶栏结构名为 Metacity，它的表现稳健扎实但是若硬件支持绚丽特效也会改用 Compiz，否则依旧回退朴素模式；更有甚者会选择\
  \ Enlightenment 那种独特有趣的（见图表）。  \n\n\\[插入图片标签\\]: graphics/_07 fig0 jpg_ 附带说明：以上是一副独特的具有一定吸引力装饰插件范例透视结果。事实上我们下面的探讨范围限定为原生样式，加入那几条注重用户体验式的衍生版本如\
  \ KDE 合体后的专有款 Xfce 比起普适源码编译出的初稿也是毫不逊色，同时也收录库里只要是愿意挖掘就行。当然这次就到此为止啦！\n\n接下来我们将正式开始把这个基于\
  \ KDE 为核心调整的生产卖点是始于一九九六年梦想打造质优集成度高感受细腻的无偿开源规划一贯立足最终用户而非仅仅替管理员提供单纯几何架构。这点很重要，因为它初心就是想贯彻普通人尽享便利不必读懂暗流涌动。现今这个观点蔓延至同行，尤其\
  \ GNOME 乃后来分裂方，缘起产权分歧导致的另一派系，今天许可证都已平等人权，所以二者理念略有所不同：极简主义安静的简约风对比高调花哨多变，参数实际哪个都高级精良手工精巧，没什么高低之分，绝对是自由世界的象牙塔，你说呢？干脆两个试一把便知你是哪边儿的～\n\
  \n```plaintext\n无实质代号变动全局基本沿用例示转换确保行内变量按声明圈注反勾括后用显要度标示忽略原本存在的刻意加粗斜双重调节必要时清理掉多余分离合并混乱分段补全遗失核心意思\n\
  ```\n\n\n\nKubuntu 是一个早期在 Ubuntu 社区启动的项目，其简单目标是允许用户在 Ubuntu 中安装和使用 KDE。为了让那些已经知道自己更喜欢\
  \ KDE（而非 GNOME）的用户更方便操作，你可以下载 Kubuntu 的安装光盘——它相当于去掉了 GNOME、加入了 KDE 以及一些特定于 Kubuntu\
  \ 增强功能的 Ubuntu。你也可以通过从 Ubuntu 软件仓库中安装`kubuntu-desktop`包来在标准版 Ubuntu 上同时使用 GNOME\
  \ 和 Kubuntu。\n\n基于不同桌面环境对于图形化用户界面所采用的“核心哲学”（或称设计理念），衍生出了一系列风格多样化的 Linux 发行版本；因此不仅仅是视觉外观各异更深层次体现在交互方式与模块组织逻辑上有着显著区别这使得每个人都能找到最契合自己工作流或直觉偏好的选择：有些人偏好极致简约而另一些人则渴望高度可定制性以及功能丰富的一体化体验无论最终导向哪种方向这种多样性本质上增强了整个生态系统的健壮性与适应性也意味着开发者群体可以更灵活地针对特定硬件配置性能瓶颈乃至应用场景做出优化调整从而推动技术边界持续扩展并且在此过程中为终端使用者带来前所未有的掌控感及满足度因为它们不再需要妥协现有框架提供的有限选项而是能够依据真实需求主动塑造自己的计算环境真正实现了自由软件的核心理念\n\
  \n## Xfce and Xubuntu\n\nXfce 是一种比 GNOME 或 KDE 都要轻量级的桌面环境所需内存和处理能力更低因而通常建议在老机器上使用但这个定位对它来说其实并不公平因为它在现代硬件上也表现出色而且经常是出于其他原因而被认为是高质量的选择\
  \ ——作为一种遵循传统 UNIX 哲学 ：做好一件事且做得出彩并善于与其他组件协作的系统每一个组成部分都是相互独立的可以根据个人的意愿添加移除或用具备相同功能的其他程序进行替换由\
  \ xfce 创的内容及其涵盖服务均按简单的接口规范运作使得外部应用程序能便捷地与它们通信一方面人们看到 xfce 会认为它的集成度和流畅度不及那两大主流桌面的另一方面这也象征着假使你想用\
  \ GNOME 文件管理器(nautilus)取代 xfce 自带的那款(Thunar)，只需把 Nautilus 装上然后要么两个并行保留至自行决定是否彻底删掉\
  \ Thunar 也行完全没问题这一特性正是促使多任务少依赖极具弹性根本所在原本研发部署 xubuntu 承担制造一个较轻盈相似版的 ubuntu 运行老旧硬机上因为它代码链套较轻随着时间推移有些人就会意图中感知到其对环境的偏爱现已不局限最初上述情景越来越不再是关注的焦点反而是模组构架配上操作的顺滑赢得了大众的心这个发布也因此吸收了一些来自\
  \ Ubuntu 对其常用 GNOME 自定制的精华添入单个别预设位置如今我们看到的是一个融合 Ubuntu Gnome 元素以及其他两者未涵盖的特色美妙结合物目前的即使依然耗用内存周期少于标准型正统或其兄弟版只以这些指标来衡量它还远不公平若要搭配\
  \ Xfce 获取可以通过指令 `sudo apt-get install xubuntu-desktop`\n\n```\napt install -y Software\
  \ to get this environment: sudo apt update && sudo, optionally include additional\
  \ customization packages like vanilla-x11.\n```\n\nIf you want the exact steps for\
  \ installing on a clean system it is recommended following official documentation\
  \ as package names might vary slightly across releases but typically running these\
  \ commands works in most supported versions of Ubuntu:\n\n```\n# For current LTS\
  \ (22 or newer)\napt search kde desktop # check availability\nNext command will\
  \ do actual installation :\nsudo apt install core components if needed first then\
  \ proceed with entire metapackage.\nIn older terminal use similarly named ones!\"\
  \ The above explanation applies universally regardless of packaging differences\
  \ between distributions; always refer to upstream information when encountering\
  \ issues.\n\n## LXde & Lubuntu\n前面提及的全部官方认可的派生品种类齐全受到各界认可并在社区有良好声誉本节将要介绍一款仍在努力争取同类地位但目前还比较新颖实验性的项目\
