  \ 移除需要第三方仓库的旧方法 ----------------\n___\n下一节将介绍电子邮件--\n\n### 选择电子邮件客户端\n\n在 Unix 早期，终端工具看起来大多非常原始，但它们允许普通用户处理电子消息、编写和阅读，有时其令人惊讶的复杂能力超出了预期。然而，当大规模采用发生时，对友好\
  \ GUI 的需求激增，很快出现了许多程序，其中一些兼容 Linux、Windows、Mac OS X 以及传统的 Unix——\n\n### 演变\n\n直到\
  \ Ubuntu 11.10，演变标准虽然认为其简单，但低估了它的实用性，它不仅能处理邮件，还能管理联系人、日历和任务 -> 图四——说明见下方 ……\n它需要某些组件的知识（输入地址服务器协议（使用\
  \ POP、IMAP）、用户名、密码、发送 SMTP 等），除了这些基础知识外，配置即可成功完成。许多人转向了 Gmail 等网邮箱，YAHOO 开始下降，但其独特之处在于取消了电子邮件组件的选择，不再选择典型的代理，而是与现有的日历格式\
  \ CalDAV 交互（启用远程使用的集成面板，默认状态）\n\n### Mozilla Thunderbird\n被正确地认为是 Firefox 的姐妹版，更新后的版本成为处理处理邮件和网络馈送的主要工具，额外的插件增强了体验，包括\
  \ Usenet 新闻阅读器——\n\n\n参考图像图五显示了在全球范围内的存在，该轻量级程序在处处运行。此外，通过避免引入外部包来减少错误，预装的仓库确保了稳定性\
  \ ——...\n＃＃ 其他邮件客户端 已经很不错！！\nClaws 很受欢迎，提供了拼写检查和输入功能，适合对内存开销敏感的大环境；Mutt 是老牌管理员喜爱的非图形界面，因为它可以配置和\
  \ GP 密钥签名；Alpine 提供了改进的 Pine 变体，是 KDE 爱好者的选择，包含在许多发行版中，均可在软件商店中获取 ……\t\t\t\t\t\t\
  \n/// RSS 阅读器——————\nWEB 2 互联网时代得益于大型门户的采用而繁荣，主要优势是无论位置何，都能快速消费所选网站，消除了手动访问的需求，通过多种方式（包括浏览器）即可访问全文！\n\
  \nFirefox 实现了实时书签并分组到名为 NEWS 的文件夹中，简化了扫描标题和挑选感兴趣项目的过程（图六）。但局限性显示出摘要缺乏详细文本，专门的阅读器解决了这个问题，因此\
  \ Liferea 成为一个出色的选择（如图七所示）。\n\n\n\n\n它默认没有安装，但你可以从仓库中以 `liferea` 的名称获取。安装完成后，你可以在“应用程序”-“互联网”->“Liferea”菜单中找到它。\n\
  \n默认情况下，Liferea 提供了许多 RSS 订阅，包括 `Planet Debian`、`Groklaw` 和 `Slashdot`。添加新订阅非常简单。你可以在\
  \ `Feeds` 菜单下选择 `New Subscription`，并将 RSS 馈源的 URL 粘贴到框中。随后，Liferea 将检索通过该字段获取的所有当前项目，并在左侧显示馈源名称供你选择和开始阅读。\n\
  \n## 带有共情能力的即时消息与视频会议\n\n即时消息是人们在网络上互动最大的方式之一。AOL 是这背后的主要力量，尤其是在美国，但其他网络和系统很快进入了市场，为用户提供了丰富的选择。\n\
  \n即时消息不再仅仅是一个消费级工具，现在已成为企业世界的一部分，许多公司部署了内部即时消息软件进行协作。\n\nEmpathy 是 Ubuntu 的默认消息程序；你可以在“应用程序”-“互联网”->“Empathy”菜单中找到它，并如图\
  \ 4.8 所示。它支持文本、语音和视频聊天，还支持使用 `Google Talk`、`AIM` 等常用协议进行文件传输。你只需要知道自己在特定服务的账户信息并将其输入\
  \ Empathy——剩下的工作就非常简单了。\n\n![Image](img/04fig08.jpg)\n\n图 4.8 Empathy 易于设置和使用，非常适合进行协作。\n\
  \n你可以在 [`help.ubuntu.com/community/Empathy`](https://help.ubuntu.com/community/Empathy)\
  \ 学习关于 Empathy 的更多。\n\n## 互联网中继聊天\n\n如 `RFC 2812` 和 `RFC 2813` 文档所示，`互联网中继聊天 (IRC)`\
  \ 协议用于文本会议。像邮件和新闻一样，IRC 使用客户端/服务器模型。虽然个人个人设置和运行 IRC 服务器很罕见，但这是可以实现的。大多数人使用公共 IRC\
  \ 服务器并通过 IRC 客户端访问它们。IRC 也是 Ubuntu 社区开发者之间最喜爱的、最常见的快速通信形式，所以如果你对此感兴趣，你一定会想学习使用这个工具。\n\
  \nUbuntu 在仓库中提供了许多图形 IRC 客户端，包括 `XChat`、`Pidgin` 和 `Quassel`。你甚至可以使用 Empathy，尽管其他产品更适合这项特定任务。Ubuntu\
  \ 还在仓库中提供了控制台客户端 `epic` 和 `irssi`，供那些避开 X 和图形界面的用户使用。不要笑——实际上有很多人这样做，而不仅仅是服务器管理员，特别是因为它们可以在远程服务器上运行，并通过\
  \ `Byobu` 或 `Screen` 经 `安全外壳 (SSH)` 进行访问，从而允许它们在那个远程服务器上 24/7 全天运行。有关关于 `Byobu`\
  \ 和 `Screen` 的更多信息，请参阅第 11 章“命令行大师课”。如果你还没有喜欢的 IRC 客户端，你应该尝试尝试所有的一个。\n\n`XChat`\
  \ 是一个非常流行的 IRC 客户端，也是使用 Ubuntu 的 IRC 新手最常见的推荐选择，因此我们用它作为示例。安装程序后，你可以在 `/usr/share/docs/xchat`\
  \ 找到 `XChat` 的文档。在开始之前阅读这些文档是个好主意，因为它们包含了介绍并涵盖了 IRC 的基础知识。\n\n`XChat` 允许你为自己分配最多三个昵称。你还可以指定你的真实姓名和用户名。因为许多人选择不在\
  \ IRC 聊天中使用真实姓名，你可以自由地在提供的任何空间中输入任何你喜欢的名称。你可以选择多个昵称；你可能会因为某个名称被某个 IRC 通道封禁，然后你可以使用另一个名称重新加入。如果这对你来说有些幼稚，那么你已经开始了解许多\
  \ IRC 通道中的那种行为类型了（但不是那些进行严肃开发者和 Ubuntu 社区交互的频道）。\n\n当你打开 `XChat` 主界面时，会出现一个 IRC\
  \ 服务器列表，如图 4.9 所示。双击选择服务器后，你可以通过选择 `Window`（窗口）->`Channel List`（频道列表）来查看该服务器上可用通道列表。`XChat`\
  \ 频道列表窗口会出现。在该窗口中，你可以选择加入你感兴趣的话题的频道。要加入频道，只需双击它。Ubuntu 使用 `irc.freenode.net` 作为服务器，主要的支持频道是\
  \ `#ubuntu`。\n\n![Image](img/04fig09.jpg)\n\n图 4.9 XChat 主界面显示了可供选择的公共服务器列表。\n\n\
  ***\n\n### IRC 狂野的一面\n\n不要对公共 IRC 服务器上大量淫秽的话题和粗俗语言的使用感到惊讶。关于 IRC 咒骂这一主题的幽默版观察，请参阅\
  \ [www.irc.org/fun_docs/nocuss.html](http://www.irc.org/fun_docs/nocuss.html)。该网站还提供了一些关于维护\
  \ IRC 礼仪的提示，如果你不想成为那些脏话的目标，这些是关重要的。以下是一些是最重要的 IRC 礼仪规则：\n\n- 不要使用彩色文本、全大写文本、闪烁文本或“蜂铃声”（通过向终端发送\
  \ `^G` 引起的蜂鸣声）。\n- 尊重他人。\n- 忽略行为不当的人。\n\n***\n\n在你选择一个频道后，你就可以加入对话，它以屏幕文本的形式出现。新消息会在屏幕上滚动。示例请参见图\
  \ 4.10。你可以在 [`help.ubuntu.com/community/InternetChat`](https://help.ubuntu.com/community/InternetChat)\
  \ 继续学习 IRC 知识。\n\n![Image](img/04fig10.jpg)\n\n图 4.10 加入你喜爱的发行版的聊天室。\n\n> 提示 你可以建立自己的\
  \ IRC 服务器，尽管 Ubuntu 未提供。设置服务器对于不熟悉 Linux 或 IRC 的人来说是一个任务。流行的服务器是 `ircd`，你可以从 ftp://ftp.irc.org/server/\
  \ 获取。在下载 `ircd` 之前，查看 `README` 文件以确定你需要的文件，并阅读 [www.irchelp.org/irchelp/ircd/](http://www.irchelp.org/irchelp/ircd/)。\n\
  \n***\n\n### Usenet 新闻组\n\n小组的概念改变了人们交换信息的方式。Usenet 网络新闻系统创建了一种与很多人进行电子通信的方法。正如你所看到的，Usenet\
  \ 的许多概念都体现在其他协作形式中。\n\nUsenet 新闻组充当公共公告板系统的形式。任何用户都可以订阅单个新闻组，并向新闻组发送（或发布）消息（称为文章），以便新闻组的其他订阅者阅读它们。某些新闻组包含管理员，他们必须在发布之前对其进行批准。这些被称为*受控新闻组*。其他新闻组是开放的，允许任何订阅成员发布消息。当文章发布到新闻组时，它会被传输到新闻网络中的所有其他主机。\n\
  \n> 注意 新闻组的文章格式遵循互联网标准文档 *请求意见 (RFC)* 1036 中定义的严格指南。每篇文章都必须包含两个不同的部分：头部行和消息正文。\n\
  \n\n\n标题行标识了文章的发布时间和作者信息。消息正文应仅包含标准 ASCII 文本字符。新闻文章中不应发布二进制字符或文件。为绕过此限制，二进制文件通过使用标准的\
  \ UNIX `uuencode` 程序或更新的 *多用途互联网邮件扩展（MIME）*协议转换为文本数据。生成的文本文件随后被发布到新闻组中。新闻组的读者可以将发布的文本文件解码回原始的二进制形式。\n\
  \n---\n\n针对共同主题而发布的文章集合称为一个话题（thread）。当用户回应其他已发布的消息时，一个话题可以包含许多篇文章。某些新闻阅读器程序允许用户根据所属的话题来追踪文章，这有助于简化用户在高度可能无法协同编辑的众多帖子中的组织工作\
  \ 。<!--中文注释：清理残留？我将移除它-->\n\n**提示**\n-   无异常代码复制操作符定义负面怀疑质量利益对待文字回答算法平滑驱动即时提及合作伙伴该提示“]在任何非线性化任何第二个选项中值得注意的是\
