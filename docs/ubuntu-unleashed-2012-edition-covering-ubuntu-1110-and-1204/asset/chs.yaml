  \n## 第 40 章. 使用 Mono\n\n***\n\n## 本章内容\n\n- 为什么要使用 Mono？\n- MonoDevelop\n- 在 Mono\
  \ 上构建\n- 参考文献\n\n***\n\n### 为什么要使用 Mono？\n\nLinux 已经有许多编程语言可用，所以为什么要费心使用 Mono 和\
  \ .NET 呢？以下是我的五个理由：\n\n- .NET 是“一次编译，到处运行”；这意味着你可以在 Linux 上编译代码并在 Windows 上运行，反之亦然。\n\
  - Mono 支持 C#，C# 是一种类 C 语言，具有许多改进，使其面向对象并更易使用。\n\n\n\n\n- .NET 包含自动垃圾回收机制，消除了内存泄漏的可能性。\n\
  - .NET 使用了内置的安全检查，以确保缓冲区溢出和许多类型的漏洞已成为过去式。Mono 使用高性能的即时编译（JIT）编译器针对其运行的平台对您的代码进行优化。这允许您在\
  \ 32 位机器上编译代码，然后在 64 位机器上运行，并让代码在运行时进行动态重新编译，以获得最佳的 64 位性能。\n\n到此时，Mono 听起来可能开始像\
  \ Java 了，事实上，它与 Java 具有许多共同属性。然而， Mono 具有以下改进：\n\n- C# 语言修正了 Java 的许多令人困扰的问题，同时保留了其垃圾回收机制。\n\
  - .NET 的设计允许您将多种语言编译为相同的字节码，包括 C#、Visual Basic .NET 等许多其他语言。\n- Mono 甚至有一个特殊项目（称为\
  \ `IKVM`），它可以将 Java 源代码编译为可以在 Mono 上运行的 .NET 代码。\n- Mono 完全开源！\n\n无论您是正寻求创建命令行程序、图形用户界面应用程序，甚至是网页，Mono\
  \ 都拥有您所需的所有功能和能力。\n\nMono 由几个组件组成，包括 C# 编译器、Mono 运行时、基础类库（Base Class Library）和 Mono\
  \ 类库（Mono Class Library）。\n\nC# 编译器包含了编译 C# 1.0、2.0 和 3.0 (ECMA) 代码的所有功能。该编译器能够编译自身，速度快，并包含一个测试套件。C#\
  \ 编译器提供了应用程序可以调用的多种服务，如下：\n\n- `mcs`—引用 1.0 规范库并支持 C# 1.0 和 C# 3.0（但不支持泛型以及任何依赖于泛型的功能），在\
  \ Ubuntu 软件仓库中被称为 `mono-cms`。\n- `gmcs`—引用 2.0 规范库并支持完整的 C# 3.0 语言，在 Ubuntu 软件仓库中被称为\
  \ `mono-gcms`，并在 Ubuntu 10.10 中默认安装。\n- `smcs`—引用 2.1 规范库，支持完整的 C# 3.0 语言，用于创建 Moonlight（Silverlight\
  \ 的 Mono 版本）应用程序。在 Ubuntu 软件仓库中不可用。\n- `dmcs`—针对 C# 4.0 语言，在 Ubuntu 软件仓库中不可用。\n\n\
  列表中的前三个都是同一个编译器，只是默认设置不同。列表中的最后一个是新的，并将成为 Mono 2.8 的默认编译器。\n\nMono 运行时使用 ECMA `Common\
  \ Language Infrastructure (CIL)`。这是一个类似于 Java 虚拟机的运行时。它提供了一个`即时编译 (JIT)` 编译器、一个`提前编译\
  \ (AOT)` 编译器、库加载器、垃圾回收器、线程系统和互操作性功能。执行引擎 `mono` 可以作为独立进程使用。它本身作为一个 JIT 或 AOT 代码生成器运行。通过\
  \ `--full-aot` 参数，它可以在不涉及 JIT 的情况下以完全静态的模式运行。您可以复用现有的 C 和 C++ 代码，并通过通过脚本或通过将 Mono\
  \ 嵌入应用程序中来扩展这些代码。\n\nMono 类库为 .NET 提供了一系列基础类。它的设计旨在兼容许多平台，包括 Windows、macOS 和 Linux。它为文件\
  \ I/O、网络和数据结构等常见任务提供了广泛的类。基础类库是 .NET 框架的核心，为所有 .NET 应用程序提供了必要的构建块。\n\n\n\n`Main()`\
  \ 是 MonoDevelop 和 Visual Studio .NET 中可执行程序集的默认入口点。为了能够在 .NET Framework 的许多库上进行绘图，你需要在文件顶部添加\
  \ `using` 语句——默认情况下，只包含了 `using System;`，这允许你访问控制台并写入你的 Hello World! 消息。\n\n如果你有\
  \ C 或 C++ 经验，你会发现 C# 中没有头文件（header files）；你的类定义及其实现都都在同一个文件中。你可能还会注意到 `Main()` 方法接受参数\
  \ `\"string[] args\"`，这意味着我们将从命令行传递参数，这在 C# 术语中意为“一个字符串数组”。C 从未有过原生的“string”数据类型，而\
  \ C++ 直到非常后期才获得这种这种类型，因此这两种语言都倾向于使用过时的 `char*` 数据类型来指向字符字符串。在 C# 中，`\"string\"`\
  \ 是一个独立的数据类型，并带有内置功能，例如替换子字符串的能力、去除空格的能力以及根据你的需要将其转换为大写或小写的能力。字符串在 .NET 中开箱即支持 Unicode，所以你又少了一个需要担心的问题。\n\
  \n你可能注意到的最后一件事——至少，如果你查看了 MonoDevelop 放置你编译程序的目录（通常为 `/path/to/your/project/bin/Debug`）——就是\
  \ Mono 使用了类似 Windows 的 `.exe` 文件扩展名，因为 Mono 的目标是与 Microsoft .NET 保持 100% 兼容，这意味着你可以将你的\
  \ Hello World 程序在不修改的情况下运行在 Windows 机器上，并打印出相同的消息。\n\n## 打印参数\n\n我们将扩展这个小程序，让它打印所有给它的参数，每行一个。在\
  \ C# 中，令人惊讶的是，这只需要一行代码。将此代码添加到你程序中现有的 `Console.WriteLine()` 行之后：\n\n```cs\nforeach\
  \ (string arg in args) Console.WriteLine(arg);\n```\n\n`foreach` 关键字是一种特殊的循环，旨在遍历任何集合（在本例中是一个数组）。`for`\
  \ 循环在 C# 中也存在，允许你循环固定次数；`while` 循环也存在，允许你持续循环，直到条件不再为真或遇到 `break` 语句——条件控制循环，而 `break`\
  \ 语句会在需要或包含时允许退出。但 `foreach` 循环的设计是从头到尾遍历集合。你可以作为你想要的任何类型的变量来获取每个值——前面的代码写着 `string\
  \ arg in args`，意思是“对于 `args` 中的每个数组元素，将其作为类型为 `string` 的变量 `arg` 给我”。由于 `args` 已经是一个由许多\
  \ `string` 组成的数组，因此这里没有发生数据类型转换——但如果你想转换类或执行类似的操作，就会发生。你使用 `for` 循环而不是 `foreach`\
  \ 循环的一个原因可能是你需要确定集合中的索引，例如寻找最小值或最大值。在 `foreach` 循环中，当前迭代没有可用索引，就像在 `while` 循环中一样。\n\
  \n获取每个参数后，调用 `WriteLine()` 将其打印出来。无论是一个参数还是一百个参数——甚至完全没有参数（在这种情况下，循环根本不会执行），这种方法都有效。\n\
  \n## 创建你自己的变量\n\n你可以在 C# 中使用匿名类型和 `var` 变量声明。你也可以非常精确地指定变量类型。大多数时候，你可以使用 `int` 并让\
  \ C# 来处理细节。让我们修改程序以接受两个参数，将它们作为数字相加，然后打印结果。这给了你机会在一个地方看到变量定义、转换和数学运算。将 `Main()`\
  \ 方法修改为：\n\n```cs\nusing System;\n\nnamespace AddNumbers\n{\n    class MainClass\n\
  \    {\n        public static void Main (string[] args)\n        {\n           \
  \ int num1 = int.Parse(args[0]);\n            int num2 = int.Parse(args[1]);\n \
  \           Console.WriteLine(\"Sum of two parameters is: \" + (num1 + num2));\n\
  \        }\n    }\n}\n```\n\n使用 `Run`、`Run With`、`Custom Parameter` 运行这段新代码。如你所示，每个变量都带有类型（`int`）和名称（`num1`\
  \ 和 `num2`），这样 C# 就知道如何处理它们。`args` 数组包含字符串，因此我们使用 `int.Parse()` 方法将字符串转换为整数。最后，两个字符串的实际相加是在方法结束时进行的。注意\
  \ C# 足够聪明，可以让整数 +整数相加（在 `num1` + `num2` 的情况下），而字符串 + 整数会将整数附加到字符串末尾（在“Sum of two\
  \ parameters is:” + `num1` + `num2` 的结果的情况下）。这不是偶然：C# 会尝试智能地转换数据类型，只有当它无法在不丢失数据的情况下转换类型时才会警告你。例如，如果你尝试将\
  \ 64 位整数视为 32 位整数，它会警告你，因为你可能会丢弃大量数据。你可以使用 `int.TryParse()` 来尝试条件解析，它还会返回一个布尔响应。\n\
  \n### 添加一些错误检查\n\n现在，如果用户不提供两个参数，你的程序会以糟糕的方式崩溃。这很容易解决：`args` 是一个数组，数组可以显示它们的大小。如果大小与你的预期不符，你可以退出。\n\
  \n在 `Main()` 方法开头添加这段代码：\n\n```cs\nif (args.Length != 2) {\n    Console.WriteLine(\"\
  You must provide exactly two parameters!\");\n    return;\n}\n```\n\n这里的这段新代码是 `return`，它是一个\
  \ C# 关键字，强制退出当前方法。由于 `Main()` 是唯一被调用的方法，这产生了终止程序的效果，因为用户没有提供两个参数。你也可以指定 `Main()`\
  \ 方法的返回类型为 `int`，这样就会返回退出代码而不是在没有任何反馈的情况下返回。如果该可执行文件要被另一个工具在命令行工具链中使用，且该工具在你工具运行后需要反馈，这将特别有用。\n\
  \n通过使用 `args` 的 `Length` 属性，你现在可以编写自己的 `Main()` 方法，根据提供的参数数量执行不同的操作。要正确实现这一点，你需要使用\
  \ `else` 语句并嵌套多个 `if` 语句，如下：\n\n```cs\nif (args.Length == 2) {\n    /// 任意操作\n}\
  \ else if (args.Length == 3) {\n    /// 其他\n} else if (args.Length == 4) {\n   \
  \ /// 更多\n} else {\n    /// 仅在上述条件都不满足时执行\n}\n\n### 基于 Mono 库进行开发\n\nUbuntu 自带了几个\
  \ Mono 构建的程序，例如 Tomboy 和 gBrainy。它还带了大量支持 .NET 的库，其中一些你可能之前已经安装了。Mono 的优点在于，就像许多其他面向对象的语言一样，它让你能够非常轻松地在这些库的基础上进行构建：你只需要通过\
  \ `using` 语句导入它们即可开始。\n\n为了演示构建更复杂的 Mono 应用有多么简单，我们将使用 Gtk#（GNOME 开发的标准 GUI 工具包）制作一个。\n\
  \n#### 使用 Gtk# 创建 GUI\n\n\n\n\nGtk# 从 GNOME 2.16 版本开始首次包含在 GNOME 中，但在那之前已经使用了多年，因此已经非常成熟。MonoDevelop\
  \ 自带了一个名为 `GTK# Designer` 的 GUI 设计器，它可以让你将 GUI 元素拖放到窗口中进行设计。\n\n要在 MonoDevelop 中开始，请转到\
  \ `File`（文件）、`New`（新建）、解决方案），选择 `C#`，然后选择 `Gtk# 2.0` 项目。将其命名为 `GtkTest`，并取消勾选让 MonoDevelop\
  \ 为解决方案创建独立目录的复框。点击 `Forward`。在 `New Solution Project Features` 窗口中，所有需要的选项已选中，只需点击\
  \ `OK`。\n\n你会发现这次 `Main.cs` 包含了稍多一点，因为它因为它创建并运行 Gtk# 应用程序。然而，创建 GUI 的实际代码位于左侧窗格的\
  \ `User Interface` 部分。如果你打开该组，将看到 `Stock Icons` 和 `MainWindow`。双击 `MainWindow` 可弹出\
  \ MonoDevelop 的 GUI 设计器。\n\n点击屏幕左侧的 `Toolbox`，将不同的窗口控件拖放到你的表单上，查看它们具有哪些属性。\n\n现在，将一个按钮控件拖到你的表单上。它会自动占据窗口上的所有空间。如果你不想发生这种情况，可以尝试先放置一个容器，然后将按钮放入其中。例如，如果你想在顶部有一个菜单栏，然后是日历，最后是状态栏，你应该先将\
  \ `VBox` 窗格拖到窗口上，然后将这些控件分别拖入 `VPane`（主 GUI 创建工作区）的各个部分。\n\n你的按钮默认显示文本 `GtkButton`\
  \ 并使用变量名 `button1`。点击选中它，然后点击右侧的 `Properties` 并在 `Button Properties` 组中查找 `Label`。将标签更改为\
  \ `Hello`。属性窗格的正上方有一个标记为 `Properties` 的标签（你现在所在的地方），另一个是 `Signals`。信号是发生在控件上的事件，例如鼠标悬停在其上、有人打字，或者我们感兴趣的，当按钮被点击时。在\
  \ `Button Signals` 组中找到 `Clicked` 并双击它。MonoDevelop 会自动切换到代码视图，并带有一个预创建的处理按钮点击的方法。\n\
  \n在方法中输入此代码：\n\n```\nbutton1.Label = \"World!\";\n```\n\n如果你想更改按钮的变量名，可以在同一个 `Properties`\
  \ 标签页中使用第一个项目 `Name` 进行修改。更改 `Name` 值，你的变量名就会改变。按下 `F5` 编译并运行，然后尝试点击按钮。\n\n####\
  \ 参考文献\n\n- [www.mono-project.com/](http://www.mono-project.com/)—Mono 项目主页包含了大量信息，可以帮助你入门。如果你急需某些内容，也可以从这里下载新的\
  \ Mono 版本。\n- [www.monodevelop.com/](http://www.monodevelop.com/)—MonoDevelop 项目有自己的网站，这是查找更新的最佳地点。\n\
  - [www.icsharpcode.net/OpenSource/SD/](http://www.icsharpcode.net/OpenSource/SD/)—MonoDevelop\
  \ 起于 SharpDevelop 的移植。如果你恰好在 Windows 上使用双系统，这可能对你来说非常有用。\n- [`msdn.microsoft.com/vcsharp/`](http://msdn.microsoft.com/vcsharp/)—我们在书中没有打印很多微软的\
  \ URL，但这个非常重要：它是他们 C# 项目的主页，可以被认为是 C# 本身的精神家园。\n- Jesse Liberty 的 *Programming C#*\
  \ (O’Reilly, ISBN 0-596-00699-3) 紧凑、全面且价格具有竞争力。\n- 如果你时间非常紧迫并想要最详细的内容（承认，可读性相当有限），你应该尝试\
  \ *The C# Programming Language*，该书由 C# 的创造者 Anders Hejlsberg 合著（Addison-Wesley,\
  \ ISBN: 0-321-33443-4）。\n- 对于关于 .NET 框架及其提供的所有功能的通用书籍，你可能会发现 *.NET Framework Essentials*\
  \ (O’Reilly, ISBN: 0-596-00505-9）很有用。\n\n## 第 41 章 使用其他流行的编程语言\n\n* * *\n\n本章内容\n\
  \n- Ada\n- Clojure\n- COBOL\n- Erlang\n- Fortth\n- Fortran\n- Groovy\n- Haskell\n\
  - Java\n- JavaScript\n- Lisp\n- Lua\n- Ruby\n- Scala\n- Vala\n- 参考文献\n\n* * *\n\n\
  本书包含几个专门介绍 Ubuntu 上最常用语言的章节，直到本版本一直缺乏对这些多样语言的任何介绍。本章的目标是介绍许多不同的语言——有些是老的，有些是新的。介绍包含了每种语言的安装和入门信息，让你了解它们。有时\
  \ Ubuntu 中包含的语言版本可能过旧，或者是一个自由版本（指意义上的自由）而不是官方的专有版本。如果你发现你需要实时的版本或未提到的版本，请查看参考文献部分以查找大多数语言的更多信息链接。\n\
  \n本章的组织非常棘手。最初的想法是根据语言的知名程度对章节进行排序，但这是有问题的。旧语言通常具有更高的名称认知度，尽管较新的语言可能更常用。我们该如何衡量流行程度并用它来对编程语言列表排序呢？使用这些语言的人倾向于对他们偏好的语言产生强烈的情感纽带，就像极客对文本编辑器（Emacs\
  \ 对比 vi）、电子邮件程序（基于 Web 的对比 Thunderbird 与 Mutt）以及更重要的事务（如漫画宇宙，Marvel 对比 DC）一样。最终，似乎字母顺序是最好的。如果你喜欢的语言没有包含在本版本中，而你认为它应该被包含在未来的版本中，请将你的建议和理由发送邮件给作者\
  \ `matthew@matthewhelmke.com` 以供考虑。本章并不教你如何使用这些\n\n### Ada\n\nAda 基于 Pascal。它以 Ada\
  \ Lovelace（1815–1852）的名字命名，她编写了第一个设计用于机器处理的算法，特别是查尔斯·巴贝奇创建的机械计算设备。\n\n该语言因在嵌入式系统中的应用而闻名，特别是在航空和航空电子领域。Ada\
  \ 以其可靠高效的实时语言而闻名。它最常见于飞机系统、空中交通控制、铁路系统和医疗设备。它也经常用作计算机科学课程的教学语言。\n\n语言亮点包括静态类型、并发、同步消息传递、保护对象、模块化和异常处理。Ada\
  \ 是面向对象的，拥有像 I/O 和容器等标准库，与 C 等其他语言有良好的接口，并且与分布式系统和数值处理配合得很好。\n\n\n\n\n\n要在 Ubuntu\
  \ 上使用 Ada，你可以在你喜欢的文本编辑器中编写程序。要进行编译，你需要 `gnat` 软件包，它是 `GNU Ada Compiler`。你可能想要考虑\
  \ `gnat-gps`，它会安装 Gnat 编程系统，这是一个专门为 Ada 和 C 语言设计的`集成开发环境 (IDE)`。\n\n### Clojure\n\
  \nClojure 是一种较新的 Lisp 方言，运行在 `Java Virtual Machine (JVM)` 上。它专为通用目的设计。它鼓励函数式编程，并旨在使编写多线程应用程序变得更容易。因为与\
  \ Java 紧密集成，Clojure 应用可以打包并部署到 JVM 环境，而不会增加复杂性。它还提供了对 Java 框架的便捷访问，且 Clojure 的数据结构都实现了标准的\
  \ Java 接口。\n\n闭包（Closures）编程中非常常见，特别是在函数式编程语言中，包括 Clojure。（这个名字据传是 `closure` 和 `Java`\
  \ 的结合。）通常情况下，变量被设计为仅在定义的函数内有效。闭包是一种临时弯曲这一规则的方法。闭包从一个函数开始，允许函数中的一个或多个变量的值在函数外部可用，同时在函数内部保持维护。另一种说法是，闭包是函数与该函数定义时作用域内的变量的组合；函数可以引用这些变量，即使它们在函数被调用时已不在作用域内。当你使用具有一等函数（即函数可以像变量一样被传递）的编程语言进行工作时，闭包是一种在不使用对象或类的情况下提供封装的方便方法。闭包的一个用例场景是：一个函数被完全封装在另一个函数内部，但仍然能够读取存在于所在函数的变量状态。\n\
  \nClojure 与大多数语言不同之处在于，你通常不需要安装 Clojure 本身；它只是一个加载到 `JVM` 中的库。你并不直接与之交互；而是使用构建工具和编辑器/IDE\
  \ 集成（当然，当你使用 REPL 进行交互时除外——无论如何，你从未从命令行运行过名为“clojure”的工具）。这个过程超出了本章简短介绍的范围；然而，你可以使用两种方法之一快速上手：\n\
  \n* 安装 `clojure`。除其他外，这会安装一个 REPL（读取-评估-打印循环，一种交互式编程环境），可以通过在命令行输入 `clojure` 来使用。当你安装此软件包时，你就获得了在\
  \ `JVM` 中使用 Clojure 需要的一切，但你需要设置开发环境来使用 Clojure。请参考每个环境的文档获取说明。注意，Clojure 最流行、甚至是事实上的标准构建工具是\
  \ Leiningen，它添加了一些非常有用的功能，如管理项目依赖、轻松启动 REPL 甚至安装 Clojure 本身。更多信息请参见 [`github.com/technomancy/leiningen#readme`](https://github.com/technomancy/leiningen#readme)。\n\
  \n* 你可以使用 [www.try-clojure.org](http://www.try-clojure.org) 在在线 REPL 中尝试 Clojure。\n\
  \n### COBOL\n\nCOBOL，`Common Business Oriented Language`（通用业务面向语言），自 20 世纪 60 年代以来一直存在，是最老的编程语言之一，仍然是（遗留）业务应用程序的主导语言。大多数大型业务应用（如工资单和会计）都是用\
  \ COBOL 编写的，大多数精通它的程序员已经退休了。就业市场上存在一些愿意学习它并愿意支持那些稳定、信赖且仍在到处运行的旧应用程序的年轻程序员。如果你能够理解\
  \ COBOL 中建模的业务流程并能将其与现代技术相结合，这一点尤为真实，而这通常不是一项容易的任务。\n\nCOBOL 的语法设计旨在模仿人类自然语言。通常，新手可以阅读\
  \ COBOL 源代码并对其功能有一个大致的了解，即使读者几乎或完全没有编程经验。早期 COBOL 中一个在较新版本中已弃用的有趣特性是自修改代码，这曾可能产生一些有趣的情况。COBOL\
  \ 一直带有某种争议，正如埃格尔·迪斯特拉（Edsger Dijkstra）曾评论道：“使用 COBOL 会损害思想；因此，对其进行教学应该被视为犯罪行为。”\n\
  \n要在 Ubuntu 上使用 COBOL，你可以在你喜欢的文本编辑器中编写程序。要进行编译，你需要 `open-cobol` 软件包，它将程序翻译成 C 语言。\n\
  \n### Erlang\n\n根据官网，“Erlang 是一种用于构建可扩展应用程序的编程语言。它的用途包括电信、银行、电子商务和即时消息。Erlang 的运行时系统内置了对并发、分布和容错的支持。Erlang\
  \ 最大的优势是能够创建大量并发进程，每个进程的开销都很低，并允许它们通过消息处理系统与另一个通信。Erlang 是一种声明式的函数式语言，包含了实时垃圾回收和代码热插功能，即使它们运行不在同一台机器上也可以相互通信。你必须在代码中显式地允许这一点，但这种能力是内置在语言运行时和语法中的，而不是第三方库。”\n\
  \n要在 Ubuntu 上使用 Erlang，你可以在你喜欢的文本编辑器中编写程序。要进行编译，你需要 `erlang` 软件包，它会安装 Erlang/OTP\
  \ 运行时、应用程序、源码、代码示例以及 Emacs 的编辑模式。\n\n### Forth\n\nForth 首次出现于 20 世纪 70 年代。它是一种交互式的、过程的命令式语言，具有无类型数据，作为\
  \ shell 。指令集可以被保存并编译为字节码程序。它本身是一个非常小的语言，因此在引导加载程序和嵌入式系统中非常有用，甚至被 NASA 用于航天应用。\n\n\
  从表面上看，Forth 是一种简单的语言，但它具有高度的可扩展性。本质上，程序员创建一个字典，从一小组预定义的词开始。这些词以新的方式组合以扩展词汇并创建可以执行的新操作。这是非常强大的，但也是危险的。缺乏标准可能导致水平平平的程序员创建不明的词汇集，使得其他人无法维护他们编写的内容。然而，那些严谨、有组织且深思熟虑的程序员已经在\
  \ Forth 中创建了复杂且可维护的程序，这些程序已在多个平台上使用了几十年。\n\n也许 Forth 可以被描述为为经验丰富的程序员设计的语言，他们可以处理对\
  \ CPU 的完全控制，并希望在极其有限的环境中构建复杂的系统。如果你年龄足够大，还记得 HP 计算器和它们的“反波兰”表示法（即操作符放在操作数之后），你会发现\
  \ Forth 非常熟悉。\n\n要在 Ubuntu 上使用 Forth，请安装 `gforth` 软件包，它是 Forth 编程环境的 GNU 实现。\n\n\
  ### Fortran\n\n\n\n\nFortran 是 IBM 在 20 世纪 50 年代开发的，用于工程和科学应用。它在以数值计算为主的科学领域迅速普及。今天，许多同样的\
  \ Fortran 程序仍在气象建模和预测、流体动力学以及化学和物理的某些领域被维护和使用。在 2010 年的一篇文章中，Oracle 工程师 Eugene Loh\
  \ 将 Fortran 称为最常用且也许是高性能计算的理想语言（[`queue.acm.org/detail.cfm?id=1820518`](http://queue.acm.org/detail.cfm?id=1820518)）。\n\
  \nFortran 是一种简洁的语言，可以用相对少的语句编写复杂的应用程序。它是一种具有面向对象能力的过程语言。它在数值计算方面表现出色，通常被用作编写程序以测试超级计算机的语言。\n\
  \n在 Ubuntu 上使用 Fortran，你可以在你喜欢的文本编辑器中编写程序。编译时，你需要 `gfortran` 包，这是 GNU Fortran 95\
  \ 编译器，它可以在 `gcc` 编译器支持的平台上编译 Fortran 95。它使用 `gcc` 后端生成优化后的代码。\n\n### Groovy\n\n\
  Groovy 像 Clojure 一样是为 JVM 设计的。它的是为了让 Java 开发者能够使用来自 Python 和 Ruby 等流行语言的闭包和动态类型等特性。它使用类似\
  \ Java 的语法，让这些程序员感到很熟悉。它可以被编译为标准的 Java 字节码，并在任何 Java 项目中使用。它也可以动态用于脚本、、模板或编写单元测试。\n\
  \n在 Ubuntu 上使用 Groovy，你必须首先安装一个 JVM。然后，你需要 `groovy` 包。你就可以通过在命令行输入 `groovysh` 在\
  \ shell 中运行 Groovy 代码，通过输入 `groovyConsole` 在交互式控制台中运行，或者通过在命令行输入 `groovy` 前缀加上脚本文件名来运行特定的\
  \ Groovy 脚本，如下所示：\n\n```\nmatthew@seymour:~$ groovy scriptname.groovy\n```\n\n###\
  \ Haskell\n\nHaskell 是一种纯函数式编程语言。它内置了并发和并行机制，并对与其他语言集成有良好的支持。在这方面，它与 Erlang 相似。从\
  \ 1990 年开始，它一直作为一个开源项目进行开发，拥有强大的社区投入和参与。Haskell 使用惰性求值，这意味着表达式的求值会被推到最后时刻，直到需要其值为止。这通过避免不必要的或重复评估显著加快了运行速度。\n\
  \n在 Ubuntu 上使用 Haskell，请安装 `haskell-platform`，这是一个工具和库的套件，包含了最重要且支持最好的组件。它是为寻找可用库的\
  \ Haskell 开发者提供的起点。要进行编译，你需要 `ghc` 包，它是 `Glorious Glasgow Haskell Compilation system\
  \ (GHC)`，一个用于 Haskell 的编译器。\n\n### Java\n\nJava 由 Sun Microsystems 创建（现归 Oracle\
  \ 所有），是一种“编写一次，随处运行”的语言。Java 程序被编译为字节码，该字节码可以在任何 `JVM` 上运行。为了让 Java 代码运行，硬件平台上必须存在\
  \ `Java Virtual Machine (JVM)`，但要在不同的硬件平台上运行它，不需要重新编译程序本身。Java 是面向对象的，为虚拟机编写程序指令通常比为真实机器编写要容易。Java\
  \ 语法与 C 和 C++ 相似，但简单一些，低级功能较少。它目前是是最流行的编程语言之一。最初，Java 技术是专有的并由 Sun 授权使用。2007 年 5\
  \ 月，在被 Oracle 收购几年后，Sun 完成了大部分 Java 技术在 GNU GPL 下的重新授权和发布。（部分他们无法重新授权，因为他们不拥有代码的版权。）\n\
  \nJava 使用自动垃圾回收在对象不再被使用时从内存中移除它们。这让程序员无需思考内存管理。它包含一个名为 Swing 的图形用户界面库。\n\n大多数 Java\
  \ 开发在 IDE 中进行，Ubuntu 存储库提供了几个 IDE 供选择。最流行的包括 Eclipse ([www.eclipse.org](http://www.eclipse.org))\
  \ 和 NetBeans ([www.netbeans.org](http://www.netbeans.org))。这些工具都包含了插件，可以帮助程序员引入和使用库、编译为字节码，并快速高效地完成许多其他任务。\n\
  \n在 Ubuntu 上用 Java 编程，你可以在你喜欢的文本编辑器或 IDE 中编写程序。要进行编译，你需要 `default-jdk` 包，它会安装适用于相应硬件的\
  \ Java 开发工具包。\n\n### JavaScript\n\nJavaScript 是一种面向对象的函数式编程语言，主要为脚本设计。它支持闭包、动态和弱类型，其语法受到\
  \ C 和 Java 的影响，尽管它与两者都没有关系（除了与 Java 在名字上的巧合相似）。JavaScript 的设计是为了供 Netscape 浏览器使用，作为在\
  \ Web 客户端运行短程序的方法。这个名字是 20 世纪 90 年代 Netscape 与 Sun 之间营销协议的结果，旨在利用 Java 的热度让 JavaScript\
  \ 成为 Web 上闪眼、新的编程语言。你偶尔会看到使用其原始名称 ECMAScript 的 JavaScript。JavaScript 的商标现在由 Oracle\
  \ 根据技术创建者（包括 Netscape 的后继者 Mozilla）的许可拥有。\n\nJavaScript 无疑是 Web 最流行的脚本语言，广泛应用于 Web\
  \ 应用程序。结合 HTML 和 CSS，它被用于创建有趣、多样且强大的网站。JavaScript 催生了许多如 Node.js 和 JSP 等扩展和开发包。它通常与\
  \ XML 等技术结合，使用 Ajax 创建交互式网站。信息通常使用 `JavaScript Object Notation` 或 JSON 传递，它正迅速成为\
  \ XML 的继任者。无论人们喜欢还是讨厌 JavaScript，它都被公认为程序员的“必知”技术。\n\n在 Ubuntu 上使用 JavaScript，你可以在你喜欢的文本编辑器中编写程序。不需要特殊操作。将脚本放在某处并用你的网络浏览器打开即可。\n\
  \n### Lisp\n\nLisp 比 Fortran 稍微年轻，因此它不是本章讨论的最古老的语言。它首次于 1958 年发布。之前讨论过的 Clojure\
  \ 是 Lisp 的一种方言。Lisp 的设计用于处理列表。链表是该语言的主要数据结构。它最初被创建作为计算机程序的实用数学表示法，但作为人工智能研究的程序而流行起来。\n\
  \n多年来，Lisp 有许多版本和许多方言。今天最常用的“普通 Lisp”可能是 ANSI Common Lisp，它也有多个实现。在 Ubuntu 上使用 ANSI\
  \ Common Lisp，请安装 `clisp` 包。在命令行中输入 `clisp` 调出 REPL（你可以通过输入 `quit` 退出）。\n\n许多 Lisp\
  \ 程序员倾向于使用 Emacs 作为他们的编辑器，它是用一种名为 elisp 的 Lisp 方言编写的。Emacs 包含了许多对 Lisp 有用的工具，并有其他插件可用。从这里，可以将代码保存到文件中、进行编译，并使其作为程序运行而不是从\
  \ REPL 界面运行。\n\n另一个有趣的 Lisp 方言是 Scheme，它也可以从 Ubuntu 存储库获得，但本章未涵盖。\n\n### Lua\n\n\
  \n\n\nLua 是一种 20 世纪 90 代在巴西创建的脚本语言。它与 Scheme 相似并基于它。它是一种具有内存管理和垃圾回收机制的动态类型过程语言。它非常小，通常用于嵌入式应用。可以在任何带有\
  \ C 编译编译平台上编译。Lua 还具有可扩展性，并以简单而不简单闻名。它最初设计用于扩展应用程序，但经常被用于独立和通用需求。\n\n要在 Ubuntu 上使用\
  \ Lua，你可以在你喜欢的文本编辑器中编写程序。要运行它们，你需要 `lua50` 包，它是 Lua 解释器。在命令行中输入 `lua` `programName`\
  \ 即可运行程序。\n\n### Ruby\n\n在 Ruby 中，一切都是对象。每个对象都可以拥有自己的属性和方法。你可以使用闭包（在 Ruby 中称为块）。你不需要声明变量，并且只有单继承。Ruby\
  \ 包含垃圾回收、异常处理，并可以通过编写 C 扩展进行扩展。Ruby 在不同方面受到了 Lisp、Perl、Python 和 Smalltalk 的深度影响，最初设计用于系统管理类型的脚本。\n\
  \n大多数 Ruby 程序员似乎倾向于将 Ruby 与一个名为 Rails 的 Web 应用程序框架结合使用，这就是人们的 `Ruby on Rails`。该框架与\
  \ DRY 哲学——“不要重复”紧密相关。每条信息都存储在一个单一、无二的地方。Ruby on Rails 运行在 Apache 或 Nginx 等 Web 服务器上，并可以使用\
  \ Ruby Gems ([rubygems.org](http://rubygems.org)) 进行扩展。\n\n要在 Ubuntu 上使用 Ruby，你可以在你喜欢的文本编辑器中编写程序。要运行它们，你可以从\
  \ Ubuntu 存储库中安装解释器包 `ruby1.8`。因为 Ruby 变化频繁，官方 Ruby 文档建议*不要*使用发行版的包管理器，而是直接从其官方网站下载最新版本。\n\
  \n### Scala\n\nScala 的名称源于“可扩展语言”（scalable language）。它设计为随用户的需求而增长。Scala 运行在 JVM\
  \ 上。它适用于函数式和面向对象的编程。Scala 程序与 Java 字节码兼容，你可以从其中一种语言调用另一种语言。还支持 .NET 框架。Scala 的语法比\
  \ Java 简洁得多。程序编写通常更短。像 Ruby 一样，在 Scala 中一切都是对象。类型是推断的，不需要显式声明。像 Clojure 一样，它符合许多人希望在\
  \ JVM 上执行函数式编程的愿。\n\n要在 Ubuntu 上使用 Scala，你可以在你喜欢的文本编辑器中编写程序。要编译，你需要 `scala` 包。编译时使用\
  \ `scalac` `sourceFile`，使用解释器运行时使用 `scala` `sourceFile`。\n\n### Vala\n\nVala 是一种非常新的语言。它的设计目的是通过将现代语言的特性引入\
  \ C，来简化 GNOME 桌面环境开发人员者的生活。其语法与 C# 非常相似。Vala 是一种编译语言，但它不是直接编译为字节码，而是编译为 C，然后使用每个特定平台的\
  \ C 编译器进行编译。\n\n在 C 中，程序员必须手动管理内存中的引用。在 Vala 中，如果使用内置引用类型而不是普通指针，这将是自动的。Vala 还使用\
  \ GNOME GObject 系统来提供引用计数。在大多数情况下，Vala 的使用者主要是开发 GNOME 的人员，这是合理的，因为这正是开发 Vala 的原因。时间将证明它是否会获得更广泛的关注。\n\
  \n要在 Ubuntu 上使用 Vala，你可以在你喜欢的文本编辑器中编写程序。要编译，你需要 `valac` 包，它是 Vala 编译器。然后你需要使用 C\
  \ 编译器（如第 39 章“Ubuntu 的 C/C++ 编程工具”中描述的 GNU C 编译器）来编译输出。\n\n#### 参考文献\n\n- [`www.adaic.org/`](http://www.adaic.org/)—Ada\
