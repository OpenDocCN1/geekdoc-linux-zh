  \n\n\nX 的较新版本还包含了对形状形状窗口（即非矩形窗口）、图形化登录管理器（也称为 `display managers`）以及压缩字体的支持。X 的每个版本都带来了更多旨在增强用户体验的功能，包括能够自定义\
  \ X 客户端应用程序的外观，甚至细化到按钮和窗口。大多数办公和家庭环境在本地机器上运行 Linux 和 X。更具见识的公司和用户利用 X 的网络功能特性，实现了瘦客户端环境，并允许使用专门为该公司设计的定制化桌面。从单一位置启动应用程序让系统管理员的工作变得简单得多，因为他们只需要在一台机器上工作，而不是多台机器。\n\
  \n## 使用 X\n\n`X.Org`（`[www.x.org](http://www.x.org)`）是 Ubuntu 使用的 `X` 服务器。基础发行版包含许多软件包，包括服务器、支持和开发库、字体、各种客户端以及文档。Ubuntu\
  \ 仓库中还提供了 1000 多个 `X` 客户端、字体和文档。\n\n`/usr` 目录及其子目录包含了大部分 `Xorg` 软件。以下是一些重要的子目录：\n\
  \n- `/usr/bin`—这是 `X` 服务器和各种 `X` 客户端的位置。（注意，并非所有 `X` 客户端都需要活跃的 X 会话。）\n- `/usr/include`—这是开发\
  \ `X` 客户端和图标等图形资源所需文件的路径。\n- `/usr/lib`—此目录包含支持 `X` 服务器和客户端所需的软件库。\n- `/usr/lib/X11`—此目录包含字体、默认客户端资源、系统资源、文档以及在\
  \ X 会话期间和各种 `X` 客户端使用的其他文件。你会在 `/usr/lib` 目录下找到一个名为 `X11` 的指向此目录的符号链接。\n- `/usr/lib/modules`—此路径指向\
  \ X 服务器使用的驱动程序和 X 服务器模块，使其能够使用各种显卡。\n\n如果你选择使用图形化桌面，系统上将安装运行活跃本地 `X` 会话所需的主要组件。这些组件是\
  \ `X` 服务器、杂杂字体、`terminal client`（即提供 shell 提示符访问的程序）以及一个名为 `window manager` 的客户端。窗口管理器管理屏幕显示，包括重叠和平铺窗口、命令按钮、标题栏以及其他屏幕装饰和功能。\n\
  \n## `xorg.conf` 文件的元素\n\n传统上，`Xorg` 最重要的文件是 `xorg.conf` 配置文件。该文件包含了对 `X` 正常运行至关重要的配置信息，通常在安装\
  \ Ubuntu 期间创建。\n\n### BulletProofX\n\nUbuntu 现在带有一个名为 `BulletProofX` 的实用功能。简而言之，它的设计旨在无论发生什么情况都能工作。因此，在发生破坏你主\
  \ `X` 系统的灾难性事件时，你仍然可以通过图形化方式回到功能完全的基于 `X` 的系统。\n\n现代版本的 `Xorg` 默认不创建 `xorg.conf`\
  \ 文件。相反，以 `*.conf` 结尾的各种文件位于 `/usr/share/X11/xorg.conf.d` 目录中，并在 X 启动时在读取任何 `xorg.conf`\
  \ 之前自动加载。这些文件每个都可以包含一个或多个与 `xorg.conf` 使用相同格式的章节。用户可以像传统那样在 `/etc/xorg.conf` 中创建文件并继续进行自定义配置，但该文件默认不会创建。上述提到的单个文件中包含的内容不应更改，但你可以通过创建自己的自己的\
  \ `xorg.conf` 文件来覆盖这些设置。\n\n### 注意\n\n我们从这里开始提到使用 `xorg.conf` 文件，但请记住前面的信息以防混淆。\n\
  \n让我们来看 `xorg.conf` 的可能内容，以便你了解 `X` 正在寻找什么。`xorg.conf` 文件的组件（或章节）指定了 `X` 会话或 `server\
  \ layout`（服务器布局），以及服务器使用的文件路径、任何直接与服务器相关的选项、所需的任何可选支持模块、与连接到系统的鼠标和键盘相关的信息、安装的显卡、正在使用的显示器以及\
  \ Ubuntu 使用的分辨率色彩深度。这些是核心组件：\n\n- `ServerLayout`—定义显示，定义一个或多个屏幕布局，并命名输入设备。\n- `Files`—定义颜色、字体或字体服务器端口号的位置。\n\
  - `Module`—告诉 `X` 服务器要加载哪些图形显示支持代码模块。\n- `InputDevice`—定义输入设备，如键盘和鼠标；可以使用多个设备。\n\
  - `Monitor`—定义任何连接的显示器的能力；可以使用多个显示器。\n- `Device`—定义一个或多个显卡，并指定启用或禁用哪些可选功能（如果有）。\n\
  - `Screen`—定义一个或多个分辨率、色彩深度、可能还有默认色彩深度以及其他设置。\n\n接下来的章节提供了这些元素的简要描述；`xorg.conf` 的\
  \ man 页面包含了你可以用于自定义桌面设置的所有选项和其他关键字的完整文档。\n\n### `ServerLayout` 章节\n\n如前所述，`xorg.conf`\
  \ 文件的 `ServerLayout` 章节定义了显示和屏幕布局，并命名了输入设备。来自自动配置的 `xorg.conf` 的典型 `ServerLayout`\
  \ 章节可能如下：\n\n```\nSection \"ServerLayout\"\n      Identifier \"single\"\n      Screen\
  \ \"Screen0\" 0\n      InputDevice \"Mouse0\" \"Core\"\n      InputDevice \"Keyboard0\"\
  \ \"Core\"\n      InputDevice \"DevInput\" \"Core\"\n```\n\n在此示例中使用了单一显示（数字指定屏幕），并使用了两个输入设备\
  \ `Mouse0` 和 `Keyboard0`。\n\n### `Files` 章节\n\n`xorg.conf` 文件的 `Files` 章节可能如下：\n\
  \n```\nSection \"Files\"\n      RgbPath \"/usr/lib/X11/rgb\"\n      FontPath \"\
  unix/:7100\"\n```\n\n此章节列出了可用的颜色（在 `rgb.txt` 文件中）以及字体服务器的端口号。字体服务器 `xfs` 在启动时运行，不需要活跃的\
  \ X 会话。如果不使用字体服务器，`FontPath` 条目可以列出 `/usr/lib/X11/fonts` 下的每个字体目录，如下所示：\n\n```\n\
  FontPath \"/usr/lib/X11/fonts/100dpi\"\nFontPath \"/usr/lib/X11/fonts/misc\"\nFontPath\
  \ \"/usr/lib/X11/fonts/75dpi\"\nFontPath \"/usr/lib/X11/fonts/type1\"\nFontPath\
  \ \"/usr/lib/X11/fonts/Speedo\"\n```\n\n这些目录包含了 X 会话期间可用的字体。字体服务器通过使用 `/etc/X11/fs`\
  \ 下的 `config` 文件进行配置。该文件包含了字体服务器使用的字体列表或目录。通过在该文件中添加 alternate-server 条目并重启字体服务器，你可以指定在\
  \ X 会话期间使用的远程字体服务器。这有助于集中字体支持并减少本地存储需求（尽管 Ubuntu 安装的近 5000 种字体需要 25MB）。\n\n### `Module`\
  \ 章节\n\n`xorg.conf` 文件的 `Module` 章节指定了为 X 会话加载的可加载模块或驱动程序。该章节可能如下：\n\n```\nSection\
  \ \"Module\"\n      Load \"dbe\"\n      Load \"extmod\"\n      Load \"fbdevhw\"\n\
  \      Load \"glx\"\n      Load \"record\"\n      Load \"freetype\"\n      Load\
  \ \"type1\"\n      Load \"dri\"\n```\n\n这些模块从特殊的显卡支持到字体光化器不等。模块位于 `/usr/lib/modules`\
  \ 目录下的子目录中。\n\n\n\n\n### `InputDevice` 部分  \n\n`InputDevice` 部分用于配置特定设备，例如键盘或鼠标，如下例所示：\
  \  \n\n```  \nSection \"InputDevice\"  \n        Identifier  \"Keyboard0\"  \n \
  \       Driver      \"kbd\"  \n        Option  \"XkbModel\"      \"pc105\"  \n \
  \       Option  'XkbLayout'     \"'us'\"   \nEndSection  \n  \nSection “ Input Device”\
  \    \n\tIdentifier “Mouse0”      \n\tDriver      “mouse”      \n\tOption      ”Protocol”“IMPS/2 (无线)???(原文即如此)”\
  \   \n\t\n...（此处为代码块格式调整） End Section ``` … （注：[以上是直接根据要求格式化]）\n\n实际上正确的输出应严格遵循规则：\n\
  \n```\n\n\n\n\nUbuntu 让切换到另一个窗口管理器或桌面环境变得相当轻松。我们所说的`desktop environment`（桌面环境）不仅指窗口管理器，还包括一系列相关的应用程序，例如生产力工具或配置工具。\n\
  \n首先，你需要确保系统中已安装了相关的桌面环境；实现此点的最简单方法是安装相关的`*-desktop` 软件包（如侧边栏“Ubuntu 家族”中所述）。例如，你可以通过安装\
  \ `kubuntu-desktop` 软件包来实现这一点（在选择 KDE 桌面的情况下）；只需搜索“desktop”并寻找 Xubuntu 或 Kubuntu\
  \ 等。等下载和安装完成后（你可能想等待时喝杯咖啡，因为这些软件包包含了大量的依赖项，下载、安装和配置需要一些时间），你就可以切换环境了。\n\n接下来，你需要注销\
  \ Ubuntu。当你回到登录页面时，像往常一样选择你的名称，然后选择你想要使用的桌面会话。第 7 章 简要介绍了 Ubuntu 存储库中除 Unity 之外的一些桌面环境。\n\
  \n### Unity 入门指南\n\nUnity 对 GUI（图形用户界面）了一种全新的尝试。它是在用户界面专业人士和图形设计师的帮助下创建的，旨在提供清晰任务执行方式的同时追求优雅、美观和高效。Unity\
  \ 是一个长期项目，其开发步骤与 Ubuntu 每六个月一次的发布周期相契合。每一个新的 Ubuntu 版本都受益于新功能和扩展功能。Unity 虽然是新的，但它的受欢迎程度已经在日益增长，并被认为\
  \ GUI 开发的前沿，不仅是对于 Linux，而且对于广义的人机交互领域。本节将介绍基本功能和用法，然后进入可能会令高级用户兴奋的特定细节。\n\n***\n\
  \nMark Shuttleworth 论 Unity\n\n“我们对 Unity 的目标是在 Linux 桌面上实现前所未有的易用性、视觉风格和性能。”\n\n\
  ——源自 2011 年 8 月 16 日的一篇博客文章；[www.markshuttleworth.com/archives/717](http://www.markshuttleworth.com/archives/717)\n\
  \n***\n\n### 桌面\n\n当你启动计算机并登录 Unity 会话时，你将看到图 3.1 所示的桌面。此屏幕由许多部分组成，本章将对每一部分进行描述。\n\
  \n![Image](img/03fig01.jpg)\n\n图 3.1 Ubuntu Unity 的默认外观。\n\n### 启动器 (Launcher)\n\
  \n屏幕左侧是一个垂直栏。这是启动器（参见图 3.2）。启动器中的图标代表正在运行的程序或设置为始终显示在启动器中的程序。点击图标打开程序。右键点击图标可获取更多选项，包括将项目始终保留在启动器中的选项。\n\
  \n![Image](img/03fig02.jpg)\n\n图 3.2 默认启动启动器。\n\n启动器中的一个特殊图标是工作区切换器。它位于主菜单的底部。\n\
  \n### 工作区 (Workspaces)\n\n工作区允许你在多个虚拟屏幕上组织工作。这防止了单个屏幕上打开过多的窗口而导致混乱。工作区允许你在多个虚拟屏幕上组织工作。这防止了单个屏幕上打开过多的窗口而导致混乱。\n\
  \n### Dash  (The Dash)\n\nDash 是 Ubuntu 中主要的搜索和应用程序启动器。它默认位于屏幕左侧，但可以移动到顶部。Dash 允许你搜索应用程序、文件甚至程序。\n\
  \n\n\n通常，高级用户希望避免使用鼠标。除非绝对必要，否则他们不想将手从键盘上移开，因为这样做会降低他们的速度。以下是本书读者可能会欣赏的一些更有用的键盘快捷键，其中许多可以通过安装来自\
  \ Ubuntu 软件源名为 `CompizConfig Settings Manager`（参见第 9 章）的软件包来进行配置或调整：\n\n-   使用 `特殊键`（即\
  \ Windows 键）打开 Dash。按 `Esc` 可在不选择任何内容的情况下关闭。\n-   点击启动器中的中间按钮图标可打开多个程序实例；笔记本电脑可通过同时点击左右键实现。\n\
