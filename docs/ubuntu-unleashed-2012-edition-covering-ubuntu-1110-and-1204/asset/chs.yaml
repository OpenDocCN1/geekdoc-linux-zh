  \n### 听音乐\n\n如果你和我们一样，你可能是一个巨大的音乐爱好者。拥有大量音乐收藏的缺点之一是必须存储这么多 CD 碟的的物理问题。如果能把它们全部收纳在某个地方，但又能在需要时随时访问所有音乐，那不是太好了吗？一些制造商尝试过相当笨重的点唱机，一次可以存储\
  \ 250 张 CD。这主要的缺点是寻找某首特定的歌曲可能需要几个小时，必须一张一张地循环播放 CD，希望它符合你的心情。\n\n幸运对你我来说，Ubuntu\
  \ 在处理 CD 方面非常出色，甚至允许你将所有的 CD 收藏“刻录”到一个巨大的可搜索音乐库中，让你能够快速创建播放列表，并让你能够创建自己的自定义 CD。开始使用再简单不过了，主要因为\
  \ Ubuntu 预配置了你启动所需的所有内容。\n\n### Rhythmbox\n\nRhythmbox 是一个实用的应用程序，当你向电脑插入音频 CD 时，它可以播放这些\
  \ CD。它还尝试从互联网获取有关该 CD 的信息。如果成功，你会在 Rhythmbox 中看到 CD 的名称。\n\n当你准备好播放 CD 时，只需点击“设备”部分下的\
  \ CD 名称并点击“播放”按钮。你还可以定义 CD 是应该循环播放直到停止，还是你想随机播放音乐（随机化播放列表）。\n\n当然，仅仅听 CD 并没有真正改变什么；Rhythmbox\
  \ 的作用就像普通的 CD 播放器，允许你听特定的曲目，并通过使用播放列表或按艺术家排序来定义你想要听音乐的方式。真正的乐趣从点击工具栏上的“复制到库”按钮开始。Rhythmbox\
  \ 会开始从你的 CD 中提取（或刻录）音频，并将其存储在 `/home` 目录下的 `Music` 目录中。\n\n根据光驱驱动的速度和计算机的性能，刻录过程完成一张完整的\
  \ CD 可能需要长达 15 分钟。在此过程中，Rhythmbox 会自动将文件添加到你的媒体库，你可以通过点击 Rhythmbox 屏幕左侧的“音乐”按钮来访问它，如\
  \ 图 6.3 所示。\n\n![Image](img/06fig03.jpg)\n\n图 6.3 Rhythmbox 显示了你可用的音乐列表。\n\n在 Rhythmbox\
  \ 界面中，你可以轻松浏览艺术家列表或专辑标题列表，这会影响屏幕底部显示的曲目列表。每个艺术家和专辑后面的数字告诉你有该特定条目分配了多少曲目，在你点击它们之前给你一个提示。双击任何条目都会自动开始播放音乐。例如，双击艺术家的名字会导致与该艺术家相关的音乐轨道开始播放。当曲目开始播放时，Rhythmbox\
  \ 会尝试获取 CD 封面，并将其显示在屏幕的左下角。\n\n你可以用 Rhythmbox 做更多事情，包括下载和收听播客。一个很好的起点是 Ubuntu UK\
  \ 播客：[`podcast.ubuntu-uk.org/`](http://podcast.ubuntu-uk.org/)。你只需要点击该页面上的源的 RSS\
  \ 链接，复制链接 URL，然后进入 Rhythmbox。在那里，按下 `Ctrl+P`，或者转到“音乐 -> 新播客源”，将链接粘贴到字段中并点击“添加”按钮。Rhythmbox\
  \ 然后会联系服务器并尝试下载你所选播客的最新集。\n\nRhythmbox 曾是 Ubuntu 默认安装的，在 Ubuntu 软件中心仍然可用，但已被 Banshee\
  \ 取代。Banshee 现在默认安装，将在下文中讨论。\n\n### Banshee\n\nBanshee 是另一个音乐应用程序，可以处理音乐的刻录和播放、下载封面、与便携播放器同步，甚至可以播放视频（参见图\
  \ 6.4）。它与 Rhythmbox 有类似的外观和感受，但维护更积极。\n\n![Image](img/06fig04.jpg)\n\n图 6.4 Banshee\
  \ 为你提供了一个整洁的界面来浏览你的音乐收藏。\n\n## 使用 Sound Juicer 将音乐导入 Ubuntu\n\nUbuntu 自带的一个方便实用工具是\
  \ Sound Juicer，位于“应用程序 -> 音频与视频”下的“音频 CD 提取器”。Sound Juicer 会自动检测你何时安装了 CD，并尝试从互联网检索曲目详情。从那里，它将\
  \ CD 曲目刻录为 Ogg 文件存储在你的文件系统中。你可以在 图 6.5 中看到 Sound Juicer 的工作过程。\n\n![Image](img/06fig05.jpg)\n\
  \n图 6.5 使用 Sound Juicer 创建你自己的数字音乐收藏。\n\n### 在 Ubuntu One 中购买音乐\n\n第 4 章，“互联网”提到了\
  \ Ubuntu One 云存储存储。如果你注册了免费账户，不仅可以在 Ubuntu 服务器上存储文件，还可以访问 Ubuntu One 音乐商店。该商店直接集成在\
  \ Rhythmbox 中（在编写本文时，已计划将其添加到 Banshee）。在 Rhythmbox 中，只需点击左侧窗口中的 Ubuntu One 链接即可开始（如\
  \ 图 6.6 所示）。\n\n![Image](img/06fig06.jpg)\n\n图 6.6 Ubuntu One 音乐商店。\n\n## 图形处理\n\
  \n在短时间内，数字相机和数字图像已变得极其流行，以至于一些传统的胶片制造商完全转向数字化。这种巨大的增长导致了处理数字图像的应用程序增加。Linux 得益于其快速开发，现在被高度评价为编辑数字图像的多媒体平台。\n\
  \nUbuntu 默认在“应用程序 -> 图形”安装了实用的 Shotwell 照片管理器（参见图 6.7）。该程序与 iPhoto 类似，包含了许多用户所需的简单工具，如消除红眼、裁剪、色彩调整以及与\
  \ Facebook、Flickr 和 Picasa 等在线照片网站交互。\n\n![Image](img/06fig07.jpg)\n\n图 6.7 对于大多数人来说，Shotwell\
  \ 照片管理器的简单工具已经足够。\n\n### GNU 图像处理程序 (GIMP)\n\n可用的图形客户端之一是 GIMP。GIMP 是一个免费的、遵循 GPL\
  \ 的图像编辑器，具有强大的功能，可以导入和导出 30 多种不同的图形格式，包括使用 Adobe Photoshop 创建的文件。它经常与 Photoshop\
  \ 相比，GIMP 代表了 GNU 项目的首批重大成功之一。Linux 中的许多图像都是使用 GIMP 制作的。\n\n\n\n`GIMP` 默认不安装，但当你从仓库安装它后，可以在\
  \ `Applications`、`Graphics`、`GIMP Image Editor` 菜单找到它。\n\n第一次启动 GIMP 时，你会看到一个安装对话框，然后是一系列对话框，显示关于本地\
  \ GIMP 目录创建和内容的相关信息。该目录可以包含个人设置、偏好、外部应用程序资源文件、临时文件以及编辑器使用的外部软件工具的符号链接。\n\n---\n\n\
  ## Photoshop 有哪些是 Gimp 没有的？\n\n尽管 GIMP 非常强大，但它确实缺少 Adobe Photoshop 提供的两个对某些图形专业人士非常重要的功能。\n\
  \n第一个功能是为商业印刷机生成色彩分离的能力（CMYK，即青色、品红、黄色和黑色）。GIMP 使用的是 RGB（红、绿、蓝），这对于视频显示很棒，但对于印刷机并不理想。第二个功能是\
  \ GIMP 缺少 Pantone 色（专利色彩规范），以确保精确的色彩匹配。这些缺陷可能不会持续多久。一个 CMYK 插件已经在工作了（早期版本可能可以从 [`queue.yellowmagic.info/software/separate-plus/index.html`](http://queue.yellowmagic.info/software/separate-plus/index.html)\
  \ 获取），而且 Pantone 问题可能在不久将来得到解决。\n\n如果这些功能对你来说很重要，那么 GIMP 是一个很好的工具。如果你必须使用 Adobe\
  \ Photoshop，你可能想要尝试使用 Wine Code；有大量关于在使用这些工具的情况下在 Linux 上成功运行 Photoshop 的报告，尽管 Ubuntu\
  \ 和 Photoshop 发布非常频繁，请检查 [www.winehq.org/](http://www.winehq.org/) 获取最新信息，后再假设它能工作。\n\
  \n完成初始化后，GIMP 的主窗口和工具箱外观（见图 06-8）。主窗口包含用于选择绘制、移动、查看、放大或缩小、使用喷笔绘画、涂抹、复制、填充以及选择颜色的工具。\n\
  ![Image](img/)6 fig8.jpg  \n图<br>右击图像窗口可访问图叠菜单</figure>\n\n#### 使用扫描仪的方法\n\n随着数字摄影兴起扫描仪的需求同样减少但仍然需要时\
  \ Ubnt 使得操作简单默认可从应用程序图形简便扫描中找到。此软件设计只能做两件事：拍照片。它几乎没有太多设置，却能满足大多数用户要求，如所示\n \n【插图】（显示说明文字）\n\
  \n你也可以配合各种类型图片到拍摄器中。喜欢折腾参数选项的人或者那些相较于简易带来更大灵活度的可能都会选用该套件。如果还没安装的话请安装下；随后运行即可获得海量调节项也可以独立使用。启动方式可在应用一栏找到对应条目。名为外观下的相关类别还有其它实用程序可供调用。拓展链接支持手册页码位于文件系统树根目录内。暂略收尾处理前效果另存配置保存才稳定等等。需注意细节非必要不赘述亦属常规流程。总之熟悉基础功能后便能轻松上手掌握更多技巧还可查询官方文档获取最新资料与社区反馈解决问题。谢谢阅读期待下次再见\
  \ —— **编者注**。】\n\n现在讨论有关格式化的工作：\n通过各种技术目（例如无损压缩即在保证画质前提下减小体积）等原因催生了不同规范其中有些受专利保护，比如早年公开源码界反对的\
  \ GIF 模式，因为持有者直到后来才开始行使权利而非事先声明索要版税引起争议。若想观察编辑某份图案先弄清类型才能选择合适的仪器。文件名后缀是最直观线索，其次了解每个组件所支持的家族分类列表如下：\n\
  \n- **BPM**(`.bmp`)—源于微软环境的位映射；\n \n - ***JPEG**（省略部分扩展避免冗余导致超长字符串影响排布美观恕未能在此完整展示全部详细情况敬请谅解如有需求请联系作者进行针对性调整补充---结束---\n\
  \nTip:\n\n如果您希望手动完成一些复杂任务，可以在终端利用库中所提供的几十种命令行转换器，它们均可被脚本语言直接调用并能通过管道串联实现批量流水作业。所有结果最终由以下三大模块划分整理归纳形成标准输出形态以专有名词组成关系网络以便后续加工复用。详情参考对应帮助文本中的单元描述包括相应配套子命令集总纲索引表语法示例见附录章节。此处不再展开举例仅供学习交流之用。尽管如此核心思想仍保持一致请大家放心运用不必担心遗漏风险。正确做法即对照原样摘抄逐一检查确认无误后再进入下一步，否则可能导致随机错误发生。重复尝试无济于事，建议慎重考虑后期维护成本并在生产环境中做好备份工作以免造成不可挽回损失。特此提醒望周知！\n\
  \n有时你想处理的某一个资源采用格式既不适合当前编写平台也不能适配目标产出介质，这就需要设法把它经过多种变化的转变过程延伸至理想状态——典型工具有 GNU ImageMagick\
  \ 携带便道函数，快捷简历中也有专门完成的静态模型，再进一步则是默认就有的 `NET` `PG` 队伍，他们复杂度低、门槛高、适应性广是首选方案。我们用一段代码演示具体用法：\n\
  \n```\nmathew@Seymour:~$ Convert image.GIF imag.png\n```\n\n这个翻译可以将带有统一识别标识的所有成员互相切换，同时也能更改颜色深度、规格尺寸，为进一步增添边框标注旋转旋转阴影等绘图技法提供支撑。其他与之关联的任务还包括展现动画验证及导入导出。整个框架总共支起超过一百三十个不同类型的典藏范例，详见官网。最后则提到几个作为根基但未进一步发展的高频项目摘要信息列举如此造成的连锁反应。由此看来结构内部还蕴含着更深层次的逻辑推演空间等待探索。我们将在接下来的研究中继续阐述这部分内容，感谢观看！\n\
  \n\n\n调整或旋转图像文件最简单的方法是从存储库中安装 `nautilus-image-converter` 包。这允许你可以在文件浏览器中查看文件时（例如从“位置”、“图片”文件夹中）右键点击图像，并选择菜单选项来调整或旋转一张或多张图像，无需打开另一个程序。\n\
  \n### 截屏\n\n你可以使用图形处理工具捕获显示在计算机屏幕上的图像。虽然这种技术被用于本书的制作，但它有更广泛的；“一图胜千言”这句老言并非没有道理。有时候，展示一个示例比描述它要简单。\n\
  \n捕取的屏幕图像（也称为屏幕抓取或截图）可以用于说明应用程序显示中的错误（例如字体问题），或复杂到无法手动抄写的错误对话框。你可能只是想与朋友分享你精心设计的自定义桌面配置图像，或者为你的书面文档添加插图。\n\
  \n在使用默认的 GNOME 桌面时，你可以利用内置的截屏机制（`gnome-panel-screenshot`）。你可以通过按下 Print Screen 键来使用此工具。（Alt+Print\
  \ Screen 仅对桌上焦点的窗口进行截图。）捕取的图像以 PNG 格式保存。你也可以在 Dash 栏中搜索“take screenshot”来找到该工具。\n\
  \n## 在 Ubuntu 中使用数字相机\n\n大多数用于 Ubuntu 使用的数字相机分为两类：摄像头（连接到计算机接口的小型低分辨率相机）或将图像数据记录在磁盘或内存卡上以便在\
  \ PC 上下载和查看的手持数字相机。Ubuntu 支持这两种类型。其他类型的相机，例如直接通过有线或无线连接连接到网络的监控摄像头，在 Linux 计算机上使用不需要特殊支持（网络连接和查看软件外）。\n\
  \nUbuntu 支持数百种不同的数字相机，从早期的并行口（基于 CPiA 芯片）相机到今天的 USB 相机。你甚至可以在 Ubuntu 上使用英特的 QX3\
  \ USB 显微镜。以下章节描述了 Ubuntu 支持的一些较常用的静态相机硬件和软件。\n\n### 手持数字相机\n\n由于 Linux 世界的良好发展，你可以通过\
  \ USB 接口将几乎任何数字相机插入计算机，Ubuntu 会自动将相机识别为 USB 大容量存储设备。你甚至可以设置 Ubuntu 在插入相机时进行识别，以便它自动为你导入照片。\n\
  \n### 使用 Shotwell 照片管理器\n\nUbuntu 默认带有一个名为 Shotwell Photo Manager 的相当好的照片管理器，它包含了简单的调整工具（见图\
  \ 6.10）。你可以将照片导入 Shotwell，为它们分配标签，进行排序和整理，甚至将它们上传到你喜欢的互联网照片托管网站，例如 Facebook、Flickr\
  \ 和 Picasa。\n\n![Image](img/06fig10.jpg)\n\n图 6.10 使用 Shotwell Photo Manager 浏览你的照片集并修正小问题。\n\
  \n## 在 Ubuntu 中刻录 CD 和 DVD\n\nLinux 通常通过互联网以 ISO 镜像的形式发行，这些镜像已准备好写入 CD 或 DVD。因此，如果你必须下载并安装\
  \ Linux 发行版，学习刻录光盘是关重要的。你可以 CD 和 DVD 执行以下操作：\n\n- 记录和存储多媒体数据，如备份文件、图形图像和音乐。\n- 从音乐\
  \ CD 中提取音频轨道（`ripping` 指从音乐 CD 中提取音乐轨道）并为个人使用制作自己的音乐 CD。\n\n尽管像 U 盘之类的 USB 存储设备让\
  \ CD 和 DVD 几乎像软盘一样罕见，但它们并没有完全消失，许多人仍然觉得它们很有用。只要事实依然如此，我们就希望确保这些信息可用。\n\n### 使用 Brasero\
  \ 创建 CD 和 DVD\n\n虽然对于快速刻录和在 shell 脚本中使用，命令行技术已经足够，但刻录 CD 和 DVD 的命令行技术对许多人来说都是一个笨拙的选择（但我们将在本章稍后的部分仍然介绍这种方法，因为其他人觉得它有用且符合需求）。幸运的是，Ubuntu\
  \ 提供了几个图形客户端，最有用的是 Brasero。\n\nBrasero 是一个易于使用的图形 CD 和 DVD 刻录程序，默认安装。你可以在菜单的“应用程序”、“声音和视频”、“Brasero\
  \ 光刻录器”中找到它。\n\nBrasero 采用基于项目的方法进行光盘刻录，启动时弹出一个向导，你可以从中选择四个经常执行的不同任务。图 6.11 显示了打开界面。Brasero\
  \ 还会记住之前的“项目”，让你能够快速创建光盘的多个副本，如果你计划给朋友家人传递 Ubuntu 的副本，这是理想的。\n\n![Image](img/06fig11.jpg)\n\
  \n图 6.11 Brasero 为你提供了一种创建数据和音频 CD 及 DVD 的直观方式。\n\n刻录数据 CD 或 DVD 只需要在打开界面上选择选项，并将从左侧目录树中想要包含的文件拖到右侧的放置区域即可。如果你在刻录器中插入空白\
  \ CD 或 DVD，Brasero 会监控光盘大小，并在你达到或超过限制时通知你。它还会创建 ISO 文件，光盘镜像包含了如果你在一个文件中刻录真实的 CD\
  \ 或 DVD 时介质上存在的所有内容，并且可以被计算机文件系统挂载，如果你想创建同一张光盘的多个副本，或者想共享光盘镜像（可能使用 U 盘或通过互联网），这将有用。\n\
  \n最后，点击“刻录”（Burn）按钮，为光盘输入标签，Brasero 开始创建你的新 CD 或 DVD。创建 CD 或 DVD 的时间取决于写入的数据量驱动的速度。\n\
  \n### 使用命令行创建 CD\n\n在 Linux 中，通过命令行创建 CD 是两个步骤的过程。你首先创建一个 ISO9660 格式的镜像，然后将镜像写入\
  \ CD。ISO9660 是光盘 ROM 的默认文件系统。\n\n使用 `mkisofs` 命令创建 ISO 镜像。`mkisofs` 命令有很多选项（完整列表请参见\
  \ man 页），但可以使用以下命令进行快速刻录：\n\n```\nmatthew@seymour:~$ mkisofs -r -v -J -l -o /tmp/our_special_cd.iso\
  \ /source_directory\n```\n\n示例中的选项如下：\n\n- `-r`: 设置更有用的文件权限。`UID` 和 `GID`（个人和组用户\
  \ ID 要求）设置为 `0`，所有文件全局可读可搜索，且所有文件都设置为可执行（针对 Windows 系统）。\n- `-v`: 显示详细信息（而不是简短信息），让你看到处理过程中发生的情况；如果发生问题，这些信息可以帮助你解决。\n\
  - `-J`: 使用 Joliet 扩展用于 ISO9660，以便你的使用 Windows 的朋友更容易读取 CD。\n- `-l`: 允许 31 字符文件名；DOS\
  \ 不喜欢，但其他人都喜欢。\n- `-o`: 定义写入镜像（即输出）的目录及其名称。`/tmp` 目录为此目的很方便，但镜像可以放在任何你有写入权限的地方。\n\
  \n\n\n\n\n• `/source_directory` — 指示源目录的路径，即包含你想要纳入的文件所在的目录。可以通过某些方法在该指定路径下附加额外路径并排除特定目录（和文件）；所有这些内容均在手册页中有详细说明，如果你需要处理这种复杂情况的话。简单的解决方案是构建一个新的目录树并用你要复制的文件填充它，然后使用该目录作为源来制作镜像。\n\
  \n还提供了许多其他选项，包括使 CD 可引导的选项。\n\n创建 ISO 镜像后，你可以使用 `cdrecord`命令将其写入 CD：\n\n```\nmatthew@seymour:~$\
  \ cdrecord -eject -v speed=12 dev=0,0,0 /tmp/our_special_cd.iso\n```\n\n本例中使用的选项如下：\n\
  \n*   `-eject` — 当写入操作完成时弹出 CD。\n*   `-v` — 显示详细信息。\n*   `speed=`—设置速度；速率取决于单个驱动器的能力。如果驱动器或刻录介质质量较差，可以使用较低的速度来实现良好的刻录效果。\n\
  *   `dev=`——指定 CD 刻录机的设备编号。\n\n***\n\n**注意**\n\n你也可以在来自原文的长串“仅保留格式”部分中使用符合上述要求的编译代码等价技术现实整齐数据平衡ē并以常规标准模板化的中文校准文书避免歧义交切误以为并未自指残余度已清零外加间隔针织型号平稳覆盖不可否认我们回归路线拟好随后精准翻转点到服从稳定调和闭合循环保证输出纯洁完美竞技匹配\U0001F9EC\
