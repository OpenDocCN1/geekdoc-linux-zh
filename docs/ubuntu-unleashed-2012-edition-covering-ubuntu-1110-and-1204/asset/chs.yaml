  \             202308 KB\nShmem:                        1036 KB\nSlab:          \
  \               29248 KB\nReclaimable:                   107356 KB\nUnreclaim: \
  \                    1892 KB\nKernelStack:                   592 KB\nPageTables:\
  \                   30108 KB\nNFS_Unstable:                   0 KB\nBounce:    \
  \                    0 KB\nWritebackTmp:                   0 KB\nCommitLimit:  \
  \             10815352 KB\nCommitted_AS:                1553172 KB\nVmallocTotal:\
  \           34359738367 KB\nVmallocUsed:                    342300 KB\nVmallocChunk:\
  \           34359387644 KB\nHardwareCorrupted:               0 KB\nHugePages_Total:\
  \               0\nHugePages_Free:                0\nHugePages_Rsvd:           \
  \     0\n```\n\n### 导航 Linux 文件系统\n\n在 Linux 文件系统中，与它的前身 UNIX 一样，一切都是文件：数据文件、二进制文件、可执行程序，甚至是输入和输出设备。这些文件放置在一系列目录中，目录就像文件夹。目录无非特殊类型的文件，包含其他文件/目录的列表。这些文件和目录用于创建分层结构，以便逻辑地放置特定类型。在本章后面的部分，我们将讨论\
  \ Linux 文件系统的标准层次结构。首先，你将学习如何导航并与文件系统交互。\n\n> 注意：包含内容的目录称为*父目录*，其内容称为*子目录*，例如 `\"\
  /home/matthew/Documents\"` 是 `/home/matthew`（其父目录）的子目录。\n\n#### 使用 ls 列出目录内容\n\n\
  `ls` 命令列出当前目录的内容。它通常单独使用，但 `ls` 还有许多选项（也称为开关）可用，可以为你提供更多信息。如果你像之前描述的那样刚刚登录，此命令将列出你用户主目录中的文件和目录：\n\
  \n```\nmatthew@seymour:~$ ls\n```\n\n\n\n\n\n文档 音乐文件 file.txt 图片 音乐\n\n### 注意事项\n\
  本章中所有的目录列表为了节省空间都进行了缩写。\n\n`ls` 命令本身只显示名称列表。其中一些是文件，另一些是目录。如果我知道我在找什么，但不记得确切名称，这非常有用。然而，在这种情况下使用\
  \ `ls` 具有一些局限性。首先，它不显示隐藏文件。隐藏文件使用以点（`.`）作为第一个字符的文件名。它们通常用于特定程序的配置，且不经常访问。由于这个原因，它们没有被包含在基础目录列表中。你可以通过给命令添加开关来查看所有隐藏文件，例如：\n\
  \n```bash\nmatthew@seymour:~$ ls -a\n\n.               .bash_logout    Documents\
  \       Music\n..              .bashrc          file.txt        Pictures\n.bash_history\
  \   .config          .local          .profile\n```\n\n关于目录中的每个项目还有更多可用信息。要包含文件/目录权限、所有者和组等细节（这些将在本章的稍后部分进行讨论），以及大小、最后修改日期和时间，请输入以下命令：\n\
  \n```bash\nmatthew@seymour:~$ ls -al\n\ntotal 608\ndrwxr-xr-x 38 matthew matthew\
  \   4096 2011-06-04 08:20 .\ndrwxr-xr-x  2 root    root       4096 2011-05-16 16:48\
  \ ..\n-rw-------  1 matthew matthew   421 2011-06-04 10:27 .bash_history\n-rw-r--r--\
  \  1 matthew matthew   220 2011-05-16 16:48 .bash_logout\n-rw-r--r--  1 matthew\
  \ matthew   3353 2011-05-16 16:48 .bashrc\ndrwxr-xr-x 13 matthew matthew  4096 2011-05-21\
  \ 10:42 .config\ndrwxr-xr-x  2 matthew matthew  4096 2011-05-16 17:07 Documents\n\
  -rw-r--r--  1 matthew matthew   335  2011-05-16 16:48 file.txt\ndrwxr-xr-x  3 matthew\
  \ matthew  4096 2011-05-16 17:07 .local\ndrwxr-xr-x  2 matthew matthew  4096 2011-05-16\
  \ 17:07 Music\ndrwxr-xr-x  3 matthew matthew  4096 2011-05-16 18:07 Pictures\n-rw-r--r--\
  \  1 matthew matthew   675 2011-05-16 16:48 .profile\n```\n\n现在的列表（此处已缩写）以每行一个项目的形式给出，但采用多列显示。列表开头是目录中的项目数量（包括文件和子目录；请记住这里的列表是缩写的）。然后，细节所示所示\
  \ 图 10.1。\n\n![Image](img/10fig01.jpg)\n\n图 10.1 解码详细目录列表的输出。\n\n这些细节将在本章稍后在“处理权限”部分进行更完整的讨论。\n\
  \n另一个有用的开关是：\n\n```bash\nmatthew@seymour:~$ ls -R\n```\n\n此命令扫描并列出当前目录下所有子目录的内容。这可能会产生大量信息，因此你可能想将输出重定向到文本文件，以便方便地浏览：\n\
  \n```bash\nmatthew@seymour:~$ ls -laR > listing.txt\n```\n\n### 提示\n上命令将 `ls -laR`\
  \ 的输出发送到名为 `listing.txt` 的文件中，并展示了命令行的部分威力。在命令行中，你可以使用文件作为输入，也可以生成文件作为输出。有关重定向的更多信息，请参阅\
  \ 第 1 章。同时，请注意你可以使用 `less listing.txt` 逐部分读取该文本文件的内容，使用方向键在文件中导航（或按 Enter 移动到下一行），空格键移动到下一页，完成后按\
  \ `q`。\n\n### 使用 `cd` 切换目录\n使用 `cd` 命令在文件系统中从一个目录移动到另一个。这可能帮助你记住这个命令的意思是“切换目录”。`cd`\
  \ 最基本的用法是：\n\n```bash\nmatthew@seymour:~$ cd subdirectory\n```\n\n这会在当前目录查找并带你进入。你也可以为目录指定精确的位置，例如：\n\
  \n```bash\nmatthew@seymour:~$ cd /home/matthew/stuff/\n```\n\n`cd` 命令还可以配合几个快捷方式使用。例如，要快速回到当前目录的父目录，使用：\n\
  \n```bash\nmatthew@seymour:~$ cd ..\n```\n\n从文件系统的任何地方返回主目录，使用：\n\n```bash\nmatthew@seymour:~$\
  \ cd\n```\n\n你也可以使用环境变量 `$HOME`来实现相同的操作。环境变量将在 第 1 章 中更详细地讨论。输入此命令返回主目录：\n\n```bash\n\
  matthew@seymour:~$ cd $HOME\n```\n\n你可以通过波浪号 (`~`) 实现相同的操作：\n\n```bash\nmatthew@seymour:~$\
  \ cd ~\n```\n\n#### 使用 `pwd` 查找当前目录\n使用 `pwd` 提醒你在文件系统中的位置。\n\n### 处理权限\n在 Linux（以及\
  \ UNIX）中，文件系统中的一切内容（包括目录和设备）都是一个文件。你系统上的每个文件都有一组基于所有权的相应权限。这些权限通过对谁可以读取、写入或执行文件设置特定设置来提供安全性。这些权限是为文件的所有者、文件所属组的成员以及所有其他人单独设置的。\n\
  \n你可以通过使用 `umask` 命令查看创建文件的默认权限，或者通过 `touch` 命令和 `ls` 长格式列表查看：\n\n```bash\nmatthew@seymour:~$\
  \ touch file\nmatthew@seymour:~$ ls -l file\n-rw-r--r-- 1 matthew matthew 0 2010-06-30\
  \ 13:06 file\n```\n\n在此示例中，`touch` 命令用于快速创建文件。`ls` 命令报告文件的以下内容（从左到右）：\n\n- **文件类型**：输出前面的字母指示了文件类型。连字符（如上例）表示普通文件，`d`\
  \ 表示目录，`c` 表示字符设备（如 `/dev/ttyS0`），`b` 表示块设备（如 `/dev/sda`）。\n- **权限**：所有者、组和其他人的权限（我们将在本节稍后讨论这些权限）。\n\
  - **链接数**：数字 `1` 表示只有一个文件，而任何其他数字都表示可能有多个硬链接。链接使用 `ln` 命令创建。硬链接是文件的精确副本，但它可能位于系统的其他地方。也可以创建符号链接，但只有根用户可以创建目录的硬链接。\n\
  - **所有者**：拥有文件的账户；这是文件创建者，但你可以使用 `chown` 命令更改此设置。\n- **组**：访问文件的组；这是文件创建者的主组，但你可以使用\
  \ `chgrp` 命令更改此设置。\n- **文件大小和创建/修改日期**：最后两个元素表示以字节计算的文件大小以及创建或最后修改的日期。\n\n### 分配权限\n\
  在 Linux 下，权限按所有者、组和其他人分组，每组都分配读、写和执行权限，如下：\n\n| 所有者 | 组 | 其他 |\n| :--- | :--- |\
  \ :--- |\n| rwx | rwx | rxw |\n\n权限可以使用记忆字符或八进制字符指示。记忆字符列如下：\n\n- `r` 表示所有者、所有者组的成员或其他人可以打开并读取文件。\n\
  - `w` 表示所有者、所有者组的成员或其他人可以打开并写入文件。\n\n\n\n\n- `x` 表示所有者、所有者所在组的成员或其他人员执行文件（或读取目录）的权限。\n\
  \n在之前名为 `file` 的文件示例中，所有者 `matthew` 具有读写权限。任何名为 `matthew` 组的成员只能读取该文件。所有其他用户也只能读取该文件。请注意，由\
  \ root 操作员（使用 `sudo` 或 root 账户）创建的文件默认权限会根据 shell 分配的 `umask` 设置而不同。\n\n许多用户倾向于使用基于八进制（base\
  \ 8）值的数值代码来表示权限。以下是这些值的含义：\n\n- `4` 表示读取权限。\n- `2` 表示写入权限。\n- `1` 表示执行权限。\n\n在八进制表示法中，上述示例文件的权限设置为\
  \ `664`（读 + 写或 `4` + `2`，读 + 写或 `4` + `2`，只读或 `4`）。尽管你可以使用任何形式的权限表示法，但在视觉化并理解权限如何编号后，八进制易于快速使用。\n\
  \n***\n\n### Note\n\n在 Linux 中，你可以创建组以根据权限分配某些用户对公共目录和文件的访问权限。你可能将财务部的所有人分配到一个名为\
  \ `accounting` 的组，并允许该组访问应付账款文件，同时禁止其他部门的访问。定义的组由 root 操作员维护，但你可以使用 `newgrp` 命令临时加入其他组以访问文件（只要\
  \ root 操作员已将你添加到其他组）。你也可以通过修改文件的组权限来允许或拒绝其他组对你的文件的访问。\n\n***\n\n### 目录权限\n\n在 Linux\
  \ 中，目录也是文件。例如，再次使用 `ls` 命令显示如下权限所示：\n\n```\nmatthew@seymour:~$ mkdir directory\n\
  matthew@seymour:~$ ls -ld directory\ndrwxr-xr-x  2 matthew  matthew  4096 2010-06-30\
  \ 13:23 directory\n```\n\n在这个示例中，使用 `mkdir` 命令来创建目录。`ls` 命令及其 `-ld` 选项用于显示关于目录的权限和其他信息（而不是其内容）。在这里你可以看到目录的权限值为\
  \ `755`（读 + 写 + 执行或 `4` + `2` + `1`，读 + 执行或 `4` + `1`，读 + 执行或 `4` + `1`）。\n\n这表明所有者可以对目录进行读写，并且由于执行权限，还可以列出目录的内容。组成员和所有其他用户只能列出目录内容。注意，目录需要执行权限才能查看其内容。\n\
  \n你还应该注意到 `ls` 命令的输出在权限字段开头开头有一个 `d`。此字母指定该文件是一个目录；普通文件在相应位置留空。其他文件（如指定块设备或字符设备的文件）会有不同的字母。\n\
  \n例如，如果你检查 Linux 串口的设备文件，将看到以下内容：\n\n```\nmatthew@seymour:~$ ls -l /dev/ttyS0\n\
  crw-rw---- 1 root dialout 4, 64 2010-06-30 08:13 /dev/ttyS0\n```\n\n在这里，`/dev/ttyS0`\
  \ 是字符设备（如串口通信端口，由 `c` 指定），由 root 所有并供 `dialout` 组中的任何人访问。该设备的权限为 `660`（读 + 写，读 +\
  \ 写，无权限）。\n\n另一方面，如果你检查 IDE 硬盘驱动器的设备文件，你会看到：\n\n```\nmatthew@seymour:~$ ls -l /dev/sda\n\
  brw-rw-- -- 1 root disk 8, 0 2010-06-30 08:13 /dev/sda\n```\n\n在这个示例中，`b` 指定块设备（一种按块传输和缓存数据的设备），具有相似的权限。你在\
  \ Linux 系统中会遇到的其他设备条目包括由 `s` 指定的符号链接。\n\n### 使用 `chmod` 修改文件权限\n\n你可以使用 `chmod`\
  \ 命令更改文件的权限。该命令使用多种形式的命令语法，包括八进制形式或助符形式（如 `u`、`g`、`o` 或 `a` 以及 `rwx` 等）来指定所需的更改。`chmod`\
  \ 命令可用于添加、删除或修改文件或目录权限，以保护、隐藏或开放其他用户对文件的访问（root 账户或具有超级用户权限并使用 `sudo` 的用户除外，两者都可以访问\
  \ Linux 系统上的任何文件或目录）。\n\n`chmod` 选项的助符形式如下（配合加号字符 `+` 时添加，配合减号 `-` 时删除）：\n\n- `u`—添加或删除用户（所有者）的读、写或执行权限。\n\
  - `g`—添加或删除组的读、写或执行权限。\n- `o`—添加或删除文件组之外的其他用户的读、写或执行权限。\n- `a`—添加或删除所有用户的读、写或执行权限。\n\
  - `r`—添加或删除读取权限。\n- `w`—添加或删除写入权限。\n- `x`—添加或删除执行权限。\n\n### 文件权限与 `chgrp`\n\n你可以使用\
  \ `chgrp` 命令更改文件所属的组：\n\n```\nmatthew@seymour:~$ chgrp wheel filename\n```\n\n###\
  \ 使用 `chown` 修改文件权限\n\n你可以使用 `chown` 命令更改文件的所有者：\n\n```\nmatthew@seymour:~$ chown\
  \ matthew filename\n```\n\n你也可以同时使用 `chown` 命令更改文件的组：\n\n```\nmatthew@seymour:~$\
  \ chown matthew:wheel filename\n```\n\n### 理解设置用户 ID 和组 ID 权限\n\n两种类型的权限是“设置用户 ID”（即\
  \ *suid*）和“设置组 ID”（即 *sgid*）。这些设置在程序中使用时，允许运行该程序的用户具有该程序的所有者或组所有者权限。这些设置使得任何人都可以运行该程序，而无需修改每个用户的权限以包含该程序的特定权限。\n\
  \n一个带有 suid 权限的常用程序是 `passwd` 命令：\n\n```\nmatthew@seymour:~$ ls -l /usr/bin/passwd\n\
  -rwsr-xr-x 1 root root 42856 2010-01-26 10:09 /usr/bin/passwd\n```\n\n此设置允许普通用户（以\
  \ root 身份）执行该命令，对仅 root 可访问的文件 `/etc/passwd` 进行更改。\n\n\n\n\n你也可以使用 `chfn` 命令分配类似的权限。该命令允许用户更新或更改\
  \ `/etc/passwd` 中的 `finger` 信息。你通过在三个八进制值前面加上 `4`（或助记符 `s`）来完成这种权限修改。\n\n### 注意\n\
  其他可能具有 suid 或 guid 权限的文件包括 `at`、`rcp`、`rlogin`、`rsh`、`chage`、`chsh`、`ssh`、`crontab`、`sudo`、`sendmail`、`ping`、`mount`\
  \ 以及若干 UUCP 工具。许多程序（如游戏）也可能具有这种权限以访问音频设备。\n\n具有 suid 或 guid 权限的文件或程序有时会产生安全漏洞，因为它们绕过了正常的权限限制。如果这种权限扩展到一个带有固有安全缺陷的可执行二进制文件（命令），问题就会变得更加严重，因为它可能导致任何系统用户或入侵者获得\
  \ root 权限。在过去的漏洞利用中，这通常发生在用户向有漏洞的命令提供意外输入（例如长路径名或选项）时；命令会执行失败，随后用户将看到 root 提示符。尽管\
  \ Linux 开发人员不断警惕糟糕的编程习惯，但新的漏洞层出不穷，并会意想不到地出现，特别是在那些尚未经过同行开发者评审的新版软件包中。\n\n精通的 Linux\
  \ 系统管理员会将系统中存在的 suid 或 guid 文件数量降至最低。可以使用 `find` 命令显示系统上的所有此类文件：\n\n```\nmatthew@seymour:~$\
  \ sudo find / -type f -perm /6000 -exec ls -l {} \\;\n```\n\n### 注意\n`find` 命令非常有用，可以用于许多目的，例如在备份操作之前或期间。\n\
  \n请注意，程序并不非要从你的系统中删除。如果你的用户确实不需要使用该程序，你可以移除任何人对该程序的执行权限。作为 root 操作员，你必须决定是否允许用户例如在你的系统上挂载和卸载\
  \ CD-ROM 或其他介质。虽然基于 Linux 的操作系统可以配置得兼顾易用性和便利性，但允许 `mount` 等程序具有 suid 可能不是最佳的安全策略。其他可能更改\
  \ suid 权限的候选对象包括 `chsh`、`at` 或 `chage` 命令。\n\n### 操作文件\n管理家目录下的文件涉及使用一个或多个易记的命令。\n\
  \n### 使用 `touch` 创建文件\n要在当前目录下创建一个名为 `filename` 的空文件，请使用以下命令：\n\n```\nmatthew@seymour:~$\
  \ touch filename\n```\n\n要编辑此文件，你必须使用文本编辑器。第 11 章 中讨论了几个编辑器。然而，创建一个空文件有时是有用的，因为由于文件关联的时间和日期信息，这会创建一个访问记录。你也可以使用\
  \ `touch` 更新这些信息（称为时间戳），而无需访问或修改文件。\n\n你可以通过更改 `touch` 之后的内容在不同位置创建文件。如果我已经在家目录下了，要在\
  \ `/home/matthew/randomdirectory` 中创建一个新文件，可以使用以下命令：\n\n```\nmatthew@seymour:~$\
  \ touch randomdirectory/newfile\n```\n\n或者从任何地方使用绝对路径，我使用这个命令：\n\n```\nmatthew@seymour:~$\
  \ touch /home/matthew/randomdirectory/newfile\n```\n\n或者从任何地方使用路径快捷方式，我使用以下命令：\n\
  \n```\nmatthew@seymour:~$ touch ~/randomdirectory/newfile\n```\n\n### 使用 `mkdir`\
  \ 创建目录\n要在当前目录下创建一个名为 `newdirectory` 的空目录，请使用此命令：\n\n```\nmatthew@seymour:~$ mkdir\
  \ newdirectory\n```\n\n你可以通过更改 `mkdir` 之后的内容在不同位置创建目录。如果我已经在 `/home` 目录下，要在 `/home/matthew/music`\
  \ 中创建一个新目录，可以使用以下命令：\n\n```\nmatthew@seymour:~$ mkdir music/newdirectory\n```\n\n\
  或者从任何地方使用绝对路径，我可以使用这个：\n\n```\nmatthew@seymour:~$ mkdir /home/matthew/music/newdirectory\n\
  ```\n\n或者从任何地方使用路径快捷方式，我使用以下命令：\n\n```\nmatthew@seymour:~$ mkdir ~/music/newdirectory\n\
  ```\n\n`-p` 选项非常有价值。它允许在父目录不存在时，同时创建目录及其父目录。这确实可以节省大量时间。如果父目录已存在，命令将正常工作。例如，假设我要创建一个包含两层子目录的新目录。在这个例子中，`music`\
  \ 和 `newdirectory` 已经存在，但需要创建 `subdir1` 和 `subdir2`：\n\n```\nmatthew@seymour:~$\
  \ mkdir -p ~/music/newdirectory/subdir1/subdir2\n```\n\n### 使用 `rmdir` 删除目录\n要删除名为\
  \ `directoryname` 的空目录，请使用以下命令：\n\n```\nmatthew@seymour:~$ rmdir directoryname\n\
  ```\n\n你可以通过更改 `rmdir` 之后的内容在不同位置移除目录。如果我已经在 `/home` 目录下，要在 `/home/matthew/music`\
  \ 中移除目录，可以使用以下命令：\n\n```\nmatthew@seymour:~$ rmdir music/directoryname\n```\n\n\
  或者从任何地方使用绝对路径，我可以使用这个：\n\n```\nmatthew@seymour:~$ rmdir /home/matthew/music/directoryname\n\
  ```\n\n或者从任何地方使用路径快捷方式，我使用以下命令：\n\n```\nmatthew@seymour:~$ rmdir ~/music/directoryname\n\
  ```\n\n使用 `rmdir` 目录时，该目录必须为空。然而，你可以使用 `rm` 删除包含内容的目录。\n\n### 警告\n你无法轻松恢复通过 `rmdir`\
  \ 或 `rm` 删除的任何内容，因此务必谨慎操作。以后没有方法恢复它们。只有专业的数据恢复服务可能恢复这些文件，即使如此也耗资昂贵。\n\n#### 使用 `rm`\
  \ 删除文件或目录\n要删除名为 `filename` 的文件，使用此命令：\n\n```\nmatthew@seymour:~$ rm filename\n\
  ```\n\n你可以通过更改 `rm` 之后的内容在不同位置移除目录。如果我已经在 `/home` 目录下，要在 `/home/matthew/randomdirectory`\
  \ 中移除目录，可以使用以下命令：\n\n```\nmatthew@seymour:~$ rm randomdirectory/filename\n```\n\n\
  或者从任何地方使用绝对路径，我可以使用这个：\n\n```\nmatthew@seymour:~$ rm /home/matthew/randomdirectory/filename\n\
  ```\n\n或者从任何地方使用路径快捷方式，我使用以下命令：\n\n```\nmatthew@seymour:~$ rm ~/randomdirectory/filename\n\
  ```\n\n如果你尝试使用 `rm` 删除空目录，将收到一条错误信息：``rm: cannot remove 'random': Is a directory``在这种情况下，你必须使用\
  \ `rmdir`。然而，你可以使用 `rm` 删除目录及其内容。\n\n### 警告：此处有巨龙（操作极度危险）\n如果你选择删除目录，请确保该目录的所有内容都是你已知且不需要的。以后没有方法恢复它们。此外，要小心不要有多余的空格、输错目录名称，或使用\
  \ `sudo` 删除你不该删除的东西。Linux 赋予了你巨大的力量，它会让你使用这种力量而不会对其质疑；那是人类的责任。\n\n要删除目录及其所有内容，请使用\
  \ `-R` 递归开关。该开关适用于许多命令，而不只是 `rm`：\n\n```\nmatthew@seymour:~$ rm -R /home/matthew/randomdirectory/\n\
  ```\n\n`randomdirectory` 中的所有内容以及目录本身将被删除。\n\n### 使用 `mv` 移动或重命名文件\n在 Linux 世界，移动文件和重命名文件是同一件事。无论你是移动目录，还是在同一目录下将一个文件名重命名为另一个，只需记住一个命令。要将名为\
  \ `filename` 的文件从 `~/documents` 移动到 `~/archive`，请使用此命令：\n\n```\nmatthew@seymour:~$\
  \ mv documents/filename archive\n```\n\n\n\n\n\n注意，目标路径中不包含文件名。这里的目标路径必须是一个存在的目录。如果不是，文件将被重命名为所使用的术语。一些示例将更清楚地说明这一点。\n\
  \n要重命名当前目录下的一个文件，可以使用以下命令：\n\n```\nmatthew@seymour:~$ mv oldfilename newfilename\n\
  ```\n\n要在将文件从 `~/documents` 移动到 `~/archive` 的同时对其重命名，可以使用此命令：\n\n```\nmatthew@seymour:~$\
  \ mv documents/oldfilename archive/newfilename\n```\n\n或者在任何地方使用绝对路径，可以使用以下命令：\n\
  \n```\nmatthew@seymour:~$ mv /home/matthew/documents/oldfilename /home/matthew/archive/newfilename\n\
  ```\n\n或者在任何地方使用路径快捷方式，可以使用此命令：\n\n```\nmatthew@seymour:~$ mv ~/documents/oldfilename\
  \ ~/archive/newfilename\n```\n\n### 使用 `cp` 复制文件\n\n复制的操作与移动类似，但它会在原始位置保留原文件。要将名为\
  \ `filename` 的文件从 `~/documents` 复制到 `~/archive`，请使用此命令：\n\n```\nmatthew@seymour:~$\
  \ cp documents/filename archive\n```\n\n注意，目标路径中不包含文件名。这里的目标路径必须是一个存在的目录。如果不是，文件将被重命名为所使用的术语。一些示例将更清楚地说明这一点。\n\
  \n要复制当前目录下的一个文件，可以使用以下命令，它的效果与 `mv` 完全相同，区别是操作后两个文件都存在：\n\n```\nmatthew@seymour:~$\
  \ cp oldfilename newfilename\n```\n\n要在将文件从 `~/documents` 复制到 `~/archive` 的同时对其重命名，可以使用此命令：\n\
  \n```\nmatthew@seymour:~$ cp documents/oldfilename archive/newfilename\n```\n\n\
  或者在任何地方使用绝对路径，可以使用以下命令：\n\n```\nmatthew@seymour:~$ cp /home/matthew/documents/oldfilename\
  \ /home/matthew/archive/newfilename\n```\n\n或者在任何地方使用路径快捷方式，我可以使用此命令：\n\n```\nmatthew@seymour:~$\
  \ cp ~/documents/oldfilename ~/archive/newfilename\n```\n\n### 使用 `cat` 显示文件内容\n\
  \n要在屏幕上查看名为 `filename` 的文本文件内容，请使用此命令：\n\n```\nmatthew@seymour:~$ cat filename\n\
  ```\n\n注意，文本显示在你的屏幕上，但你无法以任何方式编辑或处理该文本。当你想要文件内容但不需要进行任何更改时，此命令非常方便。终端文本编辑器将在第 11\
  \ 章中介绍。此命令对短文件效果最好，因为长文件的内容滚动得太快，来不及阅读。\n\n### 使用 `less` 显示文件内容\n\n当你需要从命令行查看较长文本文件的内容时，可以使用\
  \ `less`。它会产生分页输出，这意味着每次屏幕填满时输出都会停止。然后你可以使用上、下箭头键以及翻页上、翻页键来滚动文件内容。最后，使用 `q` 退出并返回命令行：\n\
  \n```\nmatthew@seymour:~$ less filename\n```\n\n在 UNIX 早期有一个可以提供分页输出的程序叫做 `more`。它是第一个分页输出程序，但不包含向上和向下滚动的功能。`less`\
  \ 的编写是为了增加这一功能，并且它的名字带有一点黑客幽默，因为“`less` 是 `more`”。你也可以使用 `more`，但今天它仅仅是 `less` 的别名。\n\
  \n### 使用通配符和正则表达式\n\n这些命令中的每一个都可以与模式匹配字符串配合使用，这些被称为`通配符`或`正则表达式`。例如，要删除当前目录下所有以字母\
  \ `abc` 开头的文件，可以使用以目标文件名的前三个字母开头的表达式。然后追加一个星号（`*`）来匹配所有这些文件。使用如下 `rm` 命令的命令行：\n\n\
  ```\nmatthew@seymour:~$ rm abc*\n```\n\nLinux Shell 识别许多类型的文件命名通配符，但这与 Linux 命令支持使用更复杂表达式的能力不同。更多关于使用通配符的知识可以在第\
  \ 11 章“命令行大师课”以及第 13 章“自动化任务与 Shell 脚本编写”中学习。\n\n***\n\n**注意**\n\n你也可以通过阅读 `grep`\
  \ 手页（`man grep`）学习更多关于使用表达式的知识，但因为 `man` 和 `grep` 在第 11 章中都有介绍，此处提及它仅是为了引起你的兴趣。\n\
  \n***\n\n## 以 Root 身份操作\n\nRoot（超级用户账户）是 UNIX 和 Linux 系统上的一个特殊账户和用户。需要超级用户权限部分原因是因为给重要的系统配置文件分配了限制性的文件权限。你必须拥有\
  \ root 权限才能编辑这些文件，或访问和修改某些设备（如硬盘）。以 root 身份登录时，你对系统拥有完全控制权，这可能是危险的。\n\n当你以 root\
  \ 身份工作时，只需简单调用 `rm` 命令即可破坏运行中的系统，如下：\n\n```\nmatthew@seymour:~$ rm -rf /\n```\n\n\
  此命令行不仅会删除文件和目录，还会清空文件系统。\n\n以 root 登录可能是危险的。只有当你配置系统时，才应该以超级用户身份运行命令。在 Ubuntu 中，可以使用\
  \ `sudo` 来执行。例如，如果你想编辑系统表（描述本地或远程存储设备及其类型和位置的简单文本文件），可以使用如下 `sudo`：\n\n```\nmatthew@seymour:~$\
  \ sudo nano -w /fstab\n```\n\n***\n\n**警告**\n\n在编辑任何系统或服务配置文件之前，创建一个备份副本。然后确保在禁用换行的情况下启动文本编辑器。如果你在禁用换行的情况下编辑配置文件，可能会在内容中插入异常的回车符和换行符，导致配置的服务失败。按照习惯，几乎所有的配置文件都格式为\
  \ 80 字符宽度，但并非如此。默认情况下，`vi` 和 `emacs` 编辑器不换行。\n\n***\n\n### 创建用户\n\n当 Linux 系统管理员创建一个用户时，`/etc/passwd`\
  \ 中会创建该用户的条目。系统还在 `/home` 下创建一个命名的目录。例如，如果你创建一个名为 `heather` 的用户，该用户的家目录就是 `/home/heather`。\n\
  \n***\n\n**注意**\n\n在本章中，你将学习如何从命令行管理用户。有关用户管理的更多信息，请参见第 12 章“管理用户”，包括使用图形化管理工具进行操作。\n\
  \n***\n\n使用 `useradd` 命令并配合用户名称，可以快速创建一个用户：\n\n```\nmatthew@seymour:~$ sudo useradd\
  \ heather\n```\n\n创建用户后，你还必须使用 `passwd` 命令为其创建初始密码：\n\n```\nmatthew@seymour:~$ sudo\
  \ passwd heather\n```\n\n输入两次新密码。如果不为新用户创建初始密码，该用户将无法登录。\n\n\n\n\n\n你可以使用 `useradd`\
  \ 命令及其 `-D` 选项来查看新用户的默认设置，如下所示：\n\n```\nmatthew@seymour:~$ useradd -D\n\nGROUP=100\n\
  HOME=/home\nINACTIVE=-1\nEXPIRE=\nSHELL=/bin/sh\nSKEL=/etc/skel\nCREATE_MAIL_SPOOL=no\n\
  ```\n\n这些选项显示了默认组 ID、主目录、账户和密码策略（永久有效且无密码过期限制）、默认 shell 以及包含 shell 默认值的目录。\n\n`useradd`\
  \ 命令有许多命令行选项。该命令可用于设置新用户密码的策略和日期、分配登录 shell、分配组成员身份以及用户账户的其他方面。欲需更多信息，请参阅 `man useradd`。\n\
  \n### 删除用户\n\n使用 `userdel` 命令从你的系统中删除用户。该命令会从系统的 `/etc/passwd` 文件中删除用户条目。你还应该使用命令的\
  \ `-r` 选项来删除用户的所有文件和目录（例如位于 `/var/spool/mail` 下的用户邮件池文件）：\n\n```\nmatthew@seymour:~$\
  \ sudo userdel -r andrew\n```\n\n如果你不使用 `-r` 选项，则必须手动删除 `/home` 下的用户目录以及用户的 `/var/spool/mail`\
  \ 队列。\n\n## 关系统\n\n使用 `shutdown` 命令关闭你的系统。`shutdown` 命令有许多不同的命令行选项（例如在预定时间关机），但干净地关闭\
  \ Linux 最快的方法是使用 `-h` 或 `halt` 选项，后跟单词 `now` 或数字零 (`0`)，如下所示：\n\n```\nmatthew@seymour:~$\
  \ sudo shutdown -h now\n```\n\n或者\n\n```\nmatthew@seymour:~$ sudo shutdown -h 0\n\
  ```\n\n要包含定时关机并向所有活动用户发送相关消息，请使用 `shutdown` 的时间和消息选项，如下所示：\n\n```\nmatthew@seymour:~$\
  \ sudo shutdown -h 18:30 \"系统将于今晚 6:30 进行维护并关机。请在此之前保存工作并注销，否则可能会丢失数据。\"\n```\n\n\
  此示例将关闭你的系统，并在关机（或重启）前 15 分钟向所有活动用户提供警告。关闭正在运行的服务器可能被认为是激进的，特别是当有活动用户或正在进行重要数据交换（如正在备份）时。一种很好的方法是预先警告用户。这可以通过编辑系统的每日消息（Message\
  \ of Day, MOTD）文件 `motd` 来，当用户使用命令行界面登录时，系统会显示该消息，这在多用户系统中很常见。\n\n过去，创建自定义的 MOTD\
  \ 只需要使用文本编辑器并更改 `/etc/motd` 的内容。然而，这在 Ubuntu 中已经发生了变化，因为开发者添加了使用 `cron` 自动并定期更新\
  \ MOTD 中包含某些有用信息的方法。要修改 MOTD 的更新方式，你应该安装 `update-motd` 并阅读其帮助页。\n\n你也可以将停机设为常规计划的一部分，也许可以与安全审计、软件更新或硬件维护重合。\n\
  \n你只应该在以下几个非常特定的原因关闭 Ubuntu：\n\n-   你没有在使用这台电脑，且没有其他用户登录或预计会需要或使用该系统（例如你的个人桌面电脑或笔记本电脑），并且你想节省电力。\n\
  -   你需要执行需要停止任何或所有系统服务的系统维护。\n-   你想更换核心硬件。\n\n***\n\n**提示**\n\n如果你怀疑入侵者已经渗透了你的系统，请勿关闭电脑；而是将机器与任何或所有网络断开，并对你的硬盘制作备份副本。你可能还想让机器保持运行，以检查内存内容和系统日志。这些情况的例外是：系统仅包含微不足的数据文件和非本质服务（例如仅用于运行\
  \ 浏览器的个人电脑），并且你无打算试图追踪入侵者可能更改了什么（无论是为了修复损坏还是尝试使用计算机取证捕获他们），而是计划仅仅简单地擦除所有内容并从头开始重建或重新安装系统。\n\
  \n***\n\n### 重启系统\n\n你也应该使用 `shutdown` 命令重启你的系统。干净地重启 Linux 最快的方法是使用 `-r` 选项以及单词\
  \ `now` 或数字零 (`0`)：\n\n```\nmatthew@seymour:~$ sudo shutdown -r now\n```\n\n或者\n\
  \n```\nmatthew@seymour:~$ sudo shutdown -r 0\n```\n\n如果在错误的时间执行重启和关机（例如在备份期间或关键文件传输期间，这会引起系统用户的愤怒），可能会产生严重后果。然而，基于\
  \ Linux 的操作系统设计为以有序的方式正确停止活动系统服务。你可以用于关机和重启 Linux 的其他命令是 `halt` 和 `reboot` 命令，但\
  \ `shutdown` 命令更加灵活。\n\n## 阅读文档\n\n虽然你在这书中学习了使用 Ubuntu 的基础，但你仍需要时间通过练习来精通并解决 Linux\
  \ 操作系统及你的发行版中更复杂的问题。与任何操作系统一样，当你继续使用 Linux 时，可以预计遇到一些问题或困惑的问题。寻求这些问题帮助的首选地方是系统自带的文档；如果你在那里找不到所需的信息，请查看\
  \ Ubuntu 网站。\n\n### 使用 Apropos\n\nLinux 与 UNIX 一样是自文档系统，可以通过 `man` 命令访问帮助页。你可以使用\
  \ `apropos` 命令（例如配合关键词 `partition`）来查找与分区相关的命令，如下：\n\n```\nmatthew@seymour:~$ apropos\
  \ partition\n```\n\n### 使用帮助页\n\n要了解命令或程序，请使用 `man` 命令加上命令名称。帮助页存储在 `/usr/share/man`\
  \ 和 `/usr/local/share/man` 等位置，但你不需要知道这些。要阅读帮助页，例如 `rm` 命令的帮助页，请如下使用 `man` 命令：\n\
  \n```\nmatthew@seymour:~$ man rm\n```\n\n按下回车键后，`less` 命令（一种 Linux 分页器）会显示帮助页。`less`\
  \ 命令是一个文本浏览器，你可以通过它向前或向后滚动文档，以获取更多关于命令的信息。输入字母 `h` 获取帮助，使用正斜杠 (`/`) 输入搜索字符串，或按 `q`\
  \ 退出。\n\n***\n\n**注意**\n\nLinux 包含的数百个命令几乎每个都有帮助页；但某些命令没有，或者只有简单的页面。你也可以使用 `info`\
  \ 命令读取某些命令的更详细信息，或作为其他命令的替代。例如，要获取更多关于 `info` 的信息（它的帮助页非常详尽），请如下使用 `info` 命令：\n\n\
  ```\n$ info info\n```\n\n\n\n\n使用方向键浏览文档，按 `q` 退出阅读。\n\n***\n\n在命令行工作时，通常会使用以下程序和内置\
  \ shell 命令。这些命令按类别分类，帮助你理解命令的用途。如果你需要查找使用该命令的完整信息，可以在命令的帮助页（man page）中查找到这些信息。\n\
  \n• **管理用户和组**—`chage`, `chfn`, `chsh`, `edquota`, `gpasswd`, `groupadd`, `groupdel`,\
  \ `groupmod`, `groups`, `mkpasswd`, `newgrp`, `newusers`, `passwd`, `umask`, `useradd`,\
  \ `userdel`, `usermod`\n\n• **管理文件和文件系统**—`cat`, `cd`, `chattr`, `chmod`, `chown`,\
  \ `compress`, `cp`, `dd`, `fdisk`, `find`, `gzip`, `ln`, `mkdir`, `mksfs`, `mount`,\
  \ `mv`, `rm`, `rmdir`, `rpm`, `sort`, `swapon`, `swapoff`, `tar`, `touch`, `umount`,\
  \ `uncompress`, `uniq`, `unzip`, `zip`\n\n• **管理运行中的程序**—`bg`, `fg`, `kill`, `killall`,\
  \ `nice`, `ps`, `pstree`, `renice`, `top`, `watch`\n\n• **获取信息**—`apropos`, `cal`,\
  \ `cat`, `cmp`, `date`, `diff`, `df`, `dir`, `dmesg`, `du`, `env`, `file`, `free`,\
  \ `grep`, `head`, `info`, `last`, `less`, `locate`, `ls`, `lsattr`, `man`, `more`,\
  \ `pinfo`, `ps`, `pwd`, `stat`, `strings`, `tac`, `tail`, `top`, `uname`, `uptime`,\
  \ `vdir`, `vmstat`, `w`, `wc`, `whatis`, `whereis`, `which`, `who`, `whoami`\n\n\
  • **控制文本编辑器**—`ed`, `jed`, `joe`, `mcedit`, `nano`, `red`, `sed`, `vim`\n\n• **控制界面和网络命令**—`bing`,\
  \ `elm`, `ftp`, `host`, `hostname`, `ifconfig`, `links`, `lynx`, `mail`, `mutt`,\
  \ `ncftp`, `netconfig`, `netstat`, `pine`, `ping`, `pump`, `rdate`, `route`, `scp`,\
  \ `sftp`, `ssh`, `tcpdump`, `traceroute`, `whois`, `wire-test`\n\n#### 参考文献\n\n\
  • **[https://help.ubuntu.com/community/UsingTheTerminal]**—关于使用终端的 Ubuntu 社区帮助页。\n\
  \n• **[https://help.ubuntu.com/community/LinuxFilesystemTreeOverview]**—关于 Linux\
  \ 文件系统树概述的 Ubuntu 社区帮助页。\n\n• **[https://help.ubuntu.com/community/RootSudo]**—一个\
  \ Ubuntu 社区页面，解释了 `sudo`、默认使用它的背后的哲学以及如何使用它。\n\n## 第 11 章 命令行大师课\n\n***\n\n本章内容\n\
  \n• 为什么要使用命令行？\n• 使用基础命令\n• 重定向输出和输入\n• 组合命令\n• 使用环境变量\n• 使用常用文本编辑器\n• 处理压缩文件\n\
  • 使用 `byobu` 使用多个终端\n• 参考文献\n\n***\n\n一些 Linux 用户喜欢关注现的图形环境——他们急于告诉新用户使用 Linux 时命令行并不是关重要的。虽然有一些图形用户界面（GUI）桌面，而且这种说法在很大程度上是正确的，但避免命令行会限制你的选择并让某些任务变得更加困难。命令行界面是力量和灵活性的所在，而那些避免学习如何使用它的人也在限制自己的能力。已经有整本书专门涵盖了命令行的深度和广度。认为两个章节就能让任何读者成为真正的大师是愚蠢的。我们最大的希望是提供足够的信息，让任何读者都能通过命令行执行所有基础和重要的任务，同时激励读者去开启发现一切的征程。在《Unix\
  \ 编程艺术》（*The Art of Unix Programming*）中，埃里克·雷蒙德写了一个完美说明命令行与 GUI 力量对比的短故事。经许可，这里转载，供你阅读：\n\
  \n一天晚上，福大师和 Nubi 参加了一个程序员聚会，互相学习。其中一个程序员询问 Nubi 他和师父属于哪个门派。在得知他们是“Unix 大道”的追随者后，那个程序员表现出蔑视。\n\
  \n“Unix 的命令行工具是粗糙且落后的，”他嘲讽道。\n\n“现代且设计得当的操作系统都是通过图形用户界面完成一切的。”\n\n福大师沉默了，指了指月亮。旁边的一只狗开始对着大师的手叫着。\n\
  \n“我不懂你！”程序员说。\n\n福大师保持沉默，指着一张佛像。然后他指着一扇窗。“你想告诉我什么？”程序员问。\n\n福大师指了指那个程序员的头。然后他指了指一块石头。\n\
  \n“你为什么不能表达清楚？”程序员要求道。福大师若思地皱了皱眉，敲了敲程序员的鼻子，然后把他扔进了附近的垃圾桶。\n\n正当程序员试图从垃圾中挣脱时，那只狗走过来在他身上撒了尿。在那一刻，程序员悟了。\n\
  \n尽管这个故事很幽默，但它确实说明了有些事情是 GUI 并不好的。进入命令行：它是一个强大且灵活的操作环境，而且——如果你练习的话——实际上也可以很有趣！\n\
  \n在本章中，你将学习如何掌握命令行，以便通过它执行所有基础和重要的任务，同时激励读者去不断探索。我们还将查看三个最流行的文本编辑器。\n\n### 为什么要使用命令行？\n\
  \n对于大多数人来说，从 GUI 转向命令行是一个有意识的选择，尽管现在很少有人将其作为完全放弃 GUI 的绝对选择。\n\n使用命令行的原因包括：\n\n•\
  \ 你想要组合两个或多个命令。\n• 你想要使用仅在 shell 中提供的命令或参数。\n• 你正在纯文本系统中工作。\n• 你已经使用了很长时间，并且在那里感到很自在。\n\
  \n## 使用基础命令\n\n\n\n\n\n无法知道一个普通的命令行用户会使用多少命令，但如果我们必须猜测的话，认为大约是 25 个。其中一些命令在第 10\
  \ 章中介绍过，但在这里将进行更深入的介绍。另一些对读者来说是全新的。还有一些仅在列表中提到，用以给读者提供进一步学习的思路。以下是每个命令行用户都想要学习的命令：\n\
  \n* `cat`—打印文件内容。\n* `cd`—切换目录。\n* `chmod`—更改文件访问权限。\n* `cp`—复制文件。\n* `du`—打印磁盘占用情况。\n\
  * `emacs`—编辑文本文件。\n* `find`—通过搜索查找文件。\n* `gcc`—编译 C/C++/Fortran 程序。\n* `grep`—在输入中搜索字符串。\n\
  * `less`—用于对输出进行分页过滤。\n* `ln`—在文件之间创建链接。\n* `locate`—通过索引查找文件。\n* `ls`—列出当前目录下的文件。\n\
  * `make`—编译并安装程序。\n* `man`—显示用于阅读的手手册页。\n* `mkdir`—创建目录。\n* `mv`—移动文件。\n* `ps`—列出进程。\n\
  * `rm`—删除文件和目录。\n* `ssh`—使用安全壳连接到其他机器。\n* `tail`—打印文件的最后几行。\n* `top`—打印资源使用情况。\n\
  * `vim`—编辑文本文件。\n* `which`—打印命令的位置。\n* `xargs`—从其输入执行命令。\n\n还有许多其他常用的命令——`cut`、`diff`、`gzip`、`history`、`ping`、`su`、`tar`、`uptime`、`who`\
  \ 等，如果你能理解这里列出的 25 个，就有足够的技能来组合你自己的命令了。\n\n请注意，我们说的是“理解”命令，而不是“知道它们所有可能的参数和用法”。这是因为几个命令虽然很常用，但只有有特定需求的人才会以复杂的方式使用它们。`gcc`\
  \ 和 `make` 就是很好的例子：除非你计划成为程序员，否则你不需要担心这些命令，偶尔输入 `make` 和 `make install` 即可。如果你想学习更多关于这两个命令的内容，请参见第\
  \ 39 章“Ubuntu 的 C/C++ 编程工具”。同样，`emacs` 和 `vim` 都是拥有自己文本界面的文本编辑器，将在在本章后文中介绍，而 SSH\
  \ 将在第 18 章详细介绍，“使用 SSH 和 Telnet 进行远程访问”。\n\n剩下 20 个命令，每个命令都有许多参数来定制其实际功能。再次，我们可以消除大部分内容，因为许多参数是生僻且很少使用的，而且在你\
  \ Linux 生命周期中少数几次需要它们时，你只需要阅读手册页即可。\n\n我们将逐一介绍这些命令，解释使用它们的最常用方法。有一个例外：`xargs` 命令要求你理解如何将命令组合在一起，我们将在章节的相关部分介绍。\n\
  \n### 使用 `cat` 打印文件内容\n\nUbuntu 的许多 shell 命令都在处理字符串，因此如果你想能够向它们提供文件内容，你需要能够将这些文件作为文本输出。进入\
  \ `cat` 命令，它可以打印你传递给它的任何文件的内容。\n\n它最基本的用法如下：\n\n```bash\nmatthew@seymour:~$ cat\
  \ myfile.txt\n```\n\n这会打印 `myfile.txt` 的内容。对于这种用法，通常有两个额外的参数被使用：`-n` 为输出行编号，`-s`（“压缩”）一次最多打印一个空行。也就是说，如果你的文件有\
  \ 1 行文本、10 行空行、1 行文本、10 行空行，以此此类推，`-s` 会显示第一行文本、一个空行、下一行文本、一个空行，以此此类推。当你结合 `-s`\
  \ 和 `-n` 使用时，`cat` 只对打印出的行进行编号——显示为行的 10 行空行将计为 1 行。\n\n此命令打印关于你的 CPU 的信息，去掉多个空行并对输出进行编号：\n\
  \n```bash\nmatthew@seymour:~$ cat -sn /proc/cpuinfo\n```\n\n你也可以使用 `cat` 同时打印多个文件的内容，如下所示：\n\
  \n```bash\nmatthew@seymour:~$ cat -s myfile.txt myotherfile.txt\n```\n\n在那条命令中，`cat`\
  \ 在输出中合并了 `myfile.txt` 和 `myotherfile.txt`，去掉了多个空行。重要的一点是 `cat` 在输出中不区分文件；没有打印文件名，两者之间没有额外的间隔符。这允许你将这\
  \ 2 个文件视为 1 个，或者通过在命令行中添加更多文件，将 20 个文件视为 1 个。\n\n### 使用 `cd` 切换目录\n\n切换目录无疑是没有任何选项的，对吧？并非如此。`cd`\
  \ 实际上比大多数人想象的要灵活。与这里的大多数其他命令不同，`cd` 并不是一个独立的命令（通常是 shell 内建的，取决于你使用的 shell），但它可以让你在目录中自由移动。\n\
  \n`cd` 最基本的用法是这样的：\n\n```bash\nmatthew@seymour:~$ cd somedir\n```\n\n这会在当前目录下查找\
  \ `somedir` 并进入。你也可以指定一个绝对路径，如下：\n\n```bash\nmatthew@seymour:~$ cd /home/matthew/stuff\n\
  ```\n\n`cd` 的神奇之处在于它可以处理相对路径。如果你想进入当前目录下的子目录，可以直接输入它的名字。如果你想返回，可以使用：\n\n```bash\n\
  matthew@seymour:~$ cd ..\n```\n\n这会返回上一级目录。如果你想回到用户主目录，可以输入：\n\n```bash\nmatthew@seymour:~$\
  \ cd ~\n```\n\n如果你想回到上一个所在的目录，可以使用：\n\n```bash\nmatthew@seymour:~$ cd -\n```\n\n\
  这会切换到上一个目录。\n\n\n\n\n\n在第 9 行，`CDPATH` 被设置为 `/usr`。选择这一值是因为 Ubuntu 拥有 `/usr/local`\
  \ 目录，这意味着我们的当前目录（`/home/matthew/empty`）和我们的 `CDPATH` 目录（`/usr`）都包含本地子目录。在第 10 行，在\
  \ `/home/matthew/empty` 目录中，我们使用了 `cd local`。这一次，`bash` 将我们切换到 `/usr/local`，并打印了新目录以确保我们知道它做了什么。\n\
  \n第 12 行和第 13 行带我们回到上一个目录 `/home/matthew/empty`。在第 14 行，`CDPATH` 被设置为 `.:/usr`。`:`\
  \ 是目录分隔符，这意味着 `bash` 应该首先查找当前目录 `.`，然后是查找 `/usr` 目录。在第 15 行，再次执行了 `cd local`，这次移动到了\
  \ `/home/matthew/empty/local`。注意 `bash` 仍然打印了新目录；每当它在 `CDPATH` 中查找目录时，它都会这样做。\n\n\
  ### 使用 `chmod` 更改文件访问权限\n\n你对 `chmod` 的用法可以通过一个简单的参数 `-c` 得到极大扩展。该参数指示 `chmod` 打印它在操作过程中所做的所有更改列表，这意味着我们可以捕获输出并将其用于其他用途。例如：\n\
  \n```\nmatthew@seymour:~$ chmod -c 600 *\nmode of '1.txt' changed to 0600 (rw------)\n\
  mode of '2.txt' changed to 0600 (rw------)\nmode of '3.txt' changed to 0600 (rw------)\n\
  matthew@seymour:~$ chmod -c 600 *\nmatthew@seymour:~$\n```\n\n在这里执行了带有 `-c` 参数的\
  \ `chmod` 命令，你可以看到它输出了操作结果：三个文件被更改为 `rw------`（仅用户可读写）。然而，当再次执行该命令时，没有返回输出。这是因为\
  \ `-c` 只打印它所做的更改。已经符合你所设置的权限的文件将保持不变，因此不会被打印。\n\n还有两个值得关注的参数：`--reference` 和 `-R`。第一个允许你指定一个文件作为权限的模板，而不是自己指定权限。例如，如果你想让当前目录下的所有文件具有与\
  \ `/home/matthew/myfile.txt` 文件相同的权限，你可以使用：\n\n```\nchmod --reference /home/matthew/myfile.txt\
  \ *\n```\n\n你可以使用 `-R` 来启用递归操作，这意味着可以用它来 `chmod` 一个目录，它将更改该目录以及该目录下所有文件和子目录的权限。你可以使用\
  \ `chmod -R 600 /home` 将 `/home` 下的每个文件和目录更改为所有者可读写。\n\n### 使用 `cp` 复制文件\n\n和后文介绍的\
  \ `mv` 一样，`cp` 是一个容易使用和掌握的命令。然而，尽管有两个参数非常强大，但很少被使用（这很遗憾）。它们是 `--parents` 和 `-u`。第一个将文件的完整路径复制到新目录；第二个仅在源文件比目标文件新时才复制。\n\
  \n使用 `--parents` 需要稍微解释一下，这里有一个例子。你有一个文件 `/home/matthew/desktop/documents/work/notes.txt`，并想将其复制到\
  \ `/home/matthew/backup` 文件夹。你可以执行普通的 `cp`，但这将得到 `/home/matthew/backup/notes.txt`，以后你怎么知道它是从哪里来的呢？如果你使用\
  \ `--parents`，文件将被复制到 `/home/matthew/backup/desktop/documents/work/notes.txt`。\n\
  \n`-u` 参数非常适合同步两个目录，因为它允许你运行如 `cp -Ru myfiles myotherfiles` 的命令，并让 `cp` 重新复制已更改的文件`-R`\
  \ 参数意味着递归，允许你复制目录内容。\n\n### 使用 `du` 打印磁盘占用\n\n`du` 命令打印当前目录内每个文件和目录的大小。它最基本的用法简单不过了：\n\
  \n```\nmatthew@seymour:~$ du\n```\n\n这会输出一个目录列表以及它们的文件所占的空间。你可以通过 `-a` 参数进行修改，该参数指示\
  \ `du` 打印单个文件以及目录的大小。另一个实用的参数是 `-h`，它让 `du` 使用人类可读的大小，如 18M (18MB)，而不是 17532（相同的字节数，未四舍五）。最后一个实用的基础选项是\
  \ `-c`，它打印文件的总大小。\n\n因此，使用 `du`，我们可以获取 `/home` 目录中每个文件的大小输出，采用人类可读格式，并在结尾带有总结，如下：\n\
  \n```\nmatthew@seymour:~$ du -ahc /home/matthew\n```\n\n两个高级参数处理你想要从计数中排除的文件名。第一个是\
  \ `--exclude`，它允许你指定一个用于排除文件的模式。该模式是标准的 Shell 文件匹配模式，而不是正则表达式，这意味着你可以使用 `?` 匹配单个字符，或使用\
  \ `*` 匹配零或多个字符。你可以指定多个 `--exclude` 参数来排除几个模式。例如：\n\n```\nmatthew@seymour:~$ du --exclude=\"\
  pattern\" --exclude=\"pattern2\" /path\n```\n\n（注：原文在 exclude 部分是碎片化的，我根据上下文进行了重构）。\n\
  \n### 使用 `find` 搜索文件\n\n`find` 命令是大多数人记忆中要强大的命令之一。最基本的用法是：\n\n```\nmatthew@seymour:~$\
  \ find -name \"*.txt\"\n```\n\n这在当前目录及其所有子目录中搜索以 `.txt` 结尾的文件。之前的搜索查找 `.txt` 但不是\
  \ `.TXT`、`.Txt` 或其他变体。要进行不区分大小写的搜索，请使用 `-iname` 而不是 `-name`。你可以可选指定搜索位置，如下：\n\n\
  ```\nmatthew@seymour:~$ find /home -name \"*.txt\"\n```\n\n另一个实用的测试是 `-size`，它允许你指定匹配的大小。你可以以字节指定大小，并可选使用\
  \ `+` 或 `-` 表示大于或小于。例如：\n\n```\nmatthew@seymour:~$ find /home -name \"*.txt\" -size\
  \ 100k\nmatthew@seymour:~$ find /home -name \"*.txt\" -size +100k\nmatthew@seymour:~$\
  \ find /home -name \"*.txt\" -size -100k\n```\n\n第一个查找正好 100KB 的文件，第二个是大于 100KB，最后一个是小于\
  \ 100KB。\n\n接下来，`-user` 选项允许你指定要查找的文件的所有者。因此，要搜索 `/home` 中所有以 `.txt` 结尾、小于 100KB\
  \ 且属于用户 `matthew` 的文件，你可以使用：\n\n```\nmatthew@seymour:~$ find /home -name \"*.txt\"\
  \ -size -100k -user matthew\n```\n\n你可以通过在它们前指定 `-not` 来反转任何条件。例如，你可以在 `-user matthew`\
  \ 之前添加 `-not` 来查找除 `matthew` 之外的所有匹配文件：\n\n```\nmatthew@seymour:~$ find /home -name\
  \ \"*.txt\" -size -100k -not -user matthew\n```\n\n\n\n\n你可以添加任意数量的 `-not` 参数甚至可以使用\
  \ `-not -not` 来让它们相互抵消。（是的，这并没有意义。）但请记住，`-not -size -100k` 实际上等同于 `-size +100k`，区别在于前者会匹配恰好\
  \ 100KB 的文件，而后者不会。\n\n你可以使用 `-perm` 来指定文件应具有的权限才能被匹配。这很复杂，所以请仔细阅读。权限的指定方式与 `chmod`\
  \ 命令相同：`u`代表用户，`g`代表组，`o`代表其他，`r`代表读，`w`代表写，`x`代表执行。然而，在给出权限之前，你需要指定 `+`、`-` 或空格。如果你既没有指定\
  \ `+` 也没有指定 `-`，则文件必须完全匹配你给出的模式。如果你指定 `-`，则文件必须匹配你指定的所有模式。如果你指定 `+`，则文件必须匹配你指定的任何一个模式。感到困惑了吗？\n\
  \n通过一些示例可以消除这种困惑。接下来的命令查找所有权限为 `o=r`（其他用户可读）的文件。注意，如果你删除了 `-name` 参数，它等同于 `*`，因为所有文件名都会被匹配：\n\
  \n```\nmatthew@seymour:~$ find /home -perm -o=r\n```\n\n该查询将返回所有设置了 `o=r`的文件。这些文件可能还具有\
  \ `u=rw` 和其他权限，但只要它们拥有 `o=r`，就会匹配。接下来的查询匹配所有设置了 `o=rw` 的文件：\n\n```\nmatthew@seymour:~$\
  \ find /home -perm -o=rw\n```\n\n然而，该查询不会匹配 `o=r` 或 `o=w` 的文件。要被匹配，文件必须对其他用户是可读且可写的。如果你想匹配可读或可写（或两者都可），你需要使用\
  \ `+`，如下所示：\n\n```\nmatthew@seymour:~$ find /home -perm +o=rw\n```\n\n同样，接下来的查询只匹配对用户、组和其他用户均可读的文件：\n\
  \n```\nmatthew@seymour:~$ find /home -perm -ugo=r\n```\n\n而此查询只要文件对用户、或组、或其他用户、或这三者的任意组合可读，就会匹配：\n\
  \n```\nmatthew@seymour:~$ find /home -perm +ugo=r\n```\n\n如果你既不使用 `+` 也不使用 `-`，你就是在指定要搜索的精确权限。例如，接下来的查询搜索用户、组和其他用户均可读，但任何人都不可写或可执行的文件：\n\
  \n```\nmatthew@seymour:~$ find /home -perm ugo=r\n```\n\n你可以根据需要对权限进行尽可能具体的指定。例如，此查询查找所有用户、组和其他用户均可读且用户可写的文件：\n\
  \n```\nmatthew@seymour:~$ find /home -perm ugo=r,u=w\n```\n\n要查找其他用户不可读的文件，请使用 `-not`\
  \ 条件，如下所示：\n\n```\nmatthew@seymour:~$ find /home -not -perm +o=r\n```\n\n现在，进入 `find`\
  \ 命令最高级的方面：`-exec` 参数。它允许你在每次匹配成功时执行一个外部程序，并在你想要的地方传入匹配的文件名。它有非常特定的语法：你的命令及其参数应紧跟在\
  \ `-exec` 之后，并以 `\\;` 结束。你可以使用 `{}`（相邻的左右括号）在任何点插入匹配的文件名。\n\n因此，你可以匹配整个系统上所有大于 10KB（即从\
  \ `/` 开始递归搜索，而不是像我们之前的示例那样从 `/home` 开始），属于 `matthew` 且其他用户不可读的文本文件，然后使用 `chmod`\
  \ 开启读取，如下：\n\n```\nmatthew@seymour:~$ find / -name \"*.txt\" -size +10k -user matthew\
  \ -not -perm +o=r -exec chmod o+r {} \\;\n```\n\n当你输入自己的 `-exec` 参数时，务必在 `\\;` 之前包含一个空格。否则，可能会看到类似\
  \ `missing argument to '-exec'` 的错误。\n\n你现在知道为什么有些人认为 `find` 命令很可怕了吗？很多人学习的 `find`\
  \ 知识仅足以以非常基础的方式使用它，但希望如果你给它一个机会，你会发现它能做多少事情。\n\n### 使用 `grep` 在输入中搜索字符串\n\n`grep`\
  \ 命令与 `find` 一样，如果用得当，是非常强大的搜索工具。但与 `find` 不同的是，`grep` 处理任何文本，无论是文件中的还是仅仅标准输入中的。\n\
  \n`grep` 的基本用法如下：\n\n```\nmatthew@seymour:~$ grep \"some text\" *\n```\n\n这会在当前目录（但不包括子目录）中搜索字符串\
  \ `some text`，并打印匹配行以及文件名。要在子目录中启用递归搜索，请使用 `-r` 参数，如下：\n\n```\nmatthew@seymour:~$\
  \ grep -r \"some text\" *\n```\n\n每当在文件中匹配到字符串时，就会打印文件名和匹配内容。如果文件包含多个匹配项，每个匹配项都会被打印。你可以使用\
  \ `-l` 参数（小写 `L`）更改此行为，它强制 `grep` 只打印包含至少一个匹配项的文件名。\n\n### 使用 `less` 分页输出\n\n`less`\
  \ 命令允许你以比 `cat` 命令更方便的方式查看大量文本。例如，你的 `/etc/passwd` 文件可能超过一个屏幕的内容，所以如果你运行 `cat /etc/passwd`，你就无法看到顶部的行。使用\
  \ `less /etc/passwd` 允许你使用光标键自由上下滚动输出。输入 `q` 退出并返回 shell。\n\n\n\n\n我们已经讨论了 `less`\
  \ 可以接受多少参数，但它们可以提炼为三个非常有用的参数：`-M`、`-N` 和 `+`。添加 `-M`（这与 `-m` 不同）可以在 `less` 中启用详细提示。`less`\
  \ 不再仅仅打印一个冒号和闪烁的光标，还会打印文件名、当前显示的行号、总行数以及你阅读文件的百分比。添加 `-N`（同样，这与 `-n` 不同）可以启用行号。\n\
  \n最后一个选项 `+` 允许你向 `less` 传递一个命令并在其启动时执行。要使用此功能，你首先需要知道在 `less` 中可用的命令，这意味着我们需要转向\
  \ `less` 输入的第二类：你在 `less` 运行期间输入的内容。\n\n基础导航键是上、下、左、右方向键；`Home` 和 `End`（用于跳转到文件的开头和结尾）；以及\
  \ `Page Up` 和 `Page Down`。除此之外，最常用的命令是 `/`，它启动文本搜索。你输入想要搜索的内容并按回车，`less` 就会找到 `first`\
  \ 匹配并高亮所有后续匹配项。再次输入 `/` 并按回车，`less` 将跳转到下一个匹配项。其反向是 `?`，它向后搜索文本。输入 `?`，输入搜索字符串并按回车以进入该字符串的上一个匹配项，或者直接使用\
  \ `?` 并按回车进入当前位置之前的下一个匹配项。你可以交替使用 `/` 和 `?`：先用 `/` 搜索内容，然后用 `?` 向后移动。\n\n使用 `/`\
  \ 和 `?` 进行搜索通常与前面提到的 `+` 命令行参数配合使用，该参数会在文件加载后向 `less` 传递一个执行命令。例如，你可以告诉 `less` 加载文件并将光标放在搜索\
  \ `hello` 的第一个匹配处，如下所示：\n\n```\nmatthew@seymour:~$ less +/hello myfile.txt\n```\n\
  \n或者，将光标放在搜索 `hello` 的最后一个匹配处：\n\n```\nmatthew@seymour:~$ less +?hello myfile.txt\n\
  ```\n\n除了光标键外，控制主要涉及输入数字然后按键。例如，要跳转到第 50 行，输入 `50g`；要跳转到文件的 75% 处，输入 `75p`。你还可以通过按\
  \ `m` 然后输入单个字母在文件中设置不可见的标记点。稍后在同一个 `less` 会话中，你可以按 `'`（单引号）然后输入该字母，它就会带你回到相同的位置。你可以设置最多\
  \ 52 个标记，命名为 a–z 和 A–Z。\n\n`less` 的一个巧妙功能是，你可以随时按 `v` 在你的文本编辑器中打开文件。这默认是 `vim`，但你可以通过设置\
  \ `EDITOR` 环境变量为其他内容来更改它。\n\n如果你读到了这里，你使用 `less` 的方法已经比大多数用户好了。此时，你可以合理地跳到下一节，并认为自己已经精通了\
  \ `less`。然而，如果你想成为 `less` 大师，还有两件事需要学习：如何同时查看多个文件以及如何运行 shell 命令。\n\n像 Linux 中大多数其他基于文件的命令一样，`less`\
  \ 可以接受多个文件作为参数。例如：\n\n```\nmatthew@seymour:~$ less -MN 1.txt 2.txt 3.txt\n```\n\n\
  这会将所有三个文件加载到 `less` 中，从 `1.txt` 开始。在查看多个文件时，`less` 通常会告诉你当前处于哪个文件，并对其进行编号：屏幕底部应该显示\
  \ `1.txt (file 1 of 3)`。然而，某些情况会使这些信息消失，所以你仍然应该使用 `-M`。\n\n你可以通过输入冒号然后按 `n` 进入下一个文件，或按\
  \ `p` 进入上一个文件来在文件之间跳转；从现在起这些被称为 `:n` 和 `:p`。你可以通过输入 `:e` 并提供文件名来打开另一个文件进行查看。这可以是任何你有权限读取的文件，包括本地目录之外的文件。使用\
  \ `Tab` 键补全文件名。通过这种方式打开的文件将插入到你当前位置之后，所以如果你正在查看 4 个文件中的第 1 个并打开了一个新文件，新文件将被编号为 5\
  \ 个中的第 2 个并立即打开查看。要关闭文件并从列表中移除，使用 `:d`。\n\n同时查看多个文件对搜索有影响。默认情况下，`less` 只在一个文件中进行搜索，但很容易在所有文件中进行搜索。当你输入\
  \ `/` 或 `?` 进行搜索时，在后面跟一个 `*`。你应该看到 `EOF-ignore` 后面跟着搜索提示符。现在你可以输入搜索内容，它将在当前文件中搜索；如果没有找到，它将在后续文件中继续查找，直到找到匹配项为止。重复搜索通过按\
  \ `Esc` 然后按 `n` 或 `N` 完成。小写选项跨文件正向重复搜索，大写选项则反向重复。\n\n你需要知道的最后一点是，你可以从 `less` 进入\
  \ shell 并执行命令。此最简单的方法是输入 `!` 并按回车。这会启动一个 shell 并让你像像常一样输入你想要的所有命令。输入 `exit` 返回 `less`。你也可以在后面输入特定的命令。\n\
  \n### 使用 `ln` 创建文件链接\n\n两种链接都有它们自己的用途。创建硬链接是在同一磁盘上备份文件的极佳方法。例如，如果你删除了其中一个位置的文件，它在另一个位置仍然存在。符号链接非常流行，因为它们允许文件出现在某个位置，例如你可以将网站存储在\
  \ `/var/www/live`，将一个建设中的停留页面存储在 `/var/www/construction`。\n\n### 提示\n\n`shred` 命令用随机数据覆盖文件内容，从而实现安全删除。由于这直接影响文件内容而非仅仅是文件名，这意味着所有硬链接到\
  \ inode 的文件名都会受到影响。\n\n两种链接都使用 `ln` 命令创建。默认情况下，它创建硬链接，但你可以通过传递 `-s` 参数创建符号链接。语法为\
  \ `ln [-s] something somewhere`，例如：\n\n`ln -s myfile.txt mylink` 创建了指向 `myfile.txt`\
  \ 的符号链接 `mylink`。你在这里没有看到它，但我创建的文件是 341 字节。这在以后很重要。去掉 `-s` 创建硬链接。你可以通过运行 `ls -l`\
  \ 来验证链接是否已创建。你的符号链接看起来像这样：\n\n```\nlrwxrwxrwx  1 matthew matthew  5 Feb 19 12:39\
  \ mylink -> myfile.txt\n```\n\n\n\n\n\n注意观察文件属性以 `l`（小写 `L`）开头表示链接，并且 `ls -l` 也会打印链接指向的位置。符号链接的大小始终非常小；上一个链接的大小为\
  \ 5 字节。如果你创建一个硬链接，它看起来会像这样：\n\n```\n-rw-rw-r   2 matthew matthew   341 Feb 19 12:39\
  \ mylink\n```\n\n这次文件具有普通属性，但第二个数字是 2 而不是 1。该数字表示指向此文件的硬链接数量，这就是为什么现在是 2。文件大小也与上一个文件名相同，因为它是文件本身，而不仅仅是一个指针。\n\
  \n符号链接在 Linux 中被广泛使用。被取代的程序（例如 `sh`）现在指向了它们的替代者（在此例中为 `bash`），而库的版本控制也是通过符号链接实现的。例如，链接到\
  \ `zlib` 的应用程序会加载 `/usr/lib/libz.so`。在内部，这只是一个指向实际 `zlib` 库的符号链接：`/usr/lib/libz.so.1.2.1.2`。这使得可以安装多个版本的库，而无需应用程序开发人员担心这些特定细节。\n\
  \n### 使用 `locate` 从索引中查找文件\n\n当你使用 `find` 命令时，它在你每次请求文件时都会递归地搜索每个目录。正如你所想象的，这很慢。幸运的是，Ubuntu\
  \ 自带了一个 `cron` 任务，每晚都会为系统上的所有文件创建一个索引。搜索这个索引的速度极快，这意味着如果你要查找的文件自上次索引创建以来一直存在，那么这就是首选的搜索方式。\n\
  \n要在索引中查找文件，请使用 `locate` 命令后跟你想要查找的文件名，如下：\n\n```\nmatthew@seymour:~$ locate myfile.txt\n\
  ```\n\n在较现代的计算机（1.5GHz 或更高）上，`locate` 应该能够在一秒内返回所有匹配的文件。这种速度的代价是缺乏灵活性。你可以搜索匹配的文件名，但与\
  \ `find` 不同，你无法搜索大小、所有者、访问权限或其他属性。你唯一可以更改的是大小写敏感性；使用 `-i` 参数可以进行不区分大小写的搜索。\n\n尽管\
  \ Ubuntu 每晚都会重新构建文件名索引，但你可以随时通过运行 `sudo updatedb` 命令来强制重建。这通常需要几分钟时间，但一旦完成，新数据库将立即可用。\n\
  \n### 使用 `ls` 列出当前目录下的文件\n\n`ls` 命令和 `ln` 一样，是你认为非常直观的命令之一。它列出文件，但它可能到底有多少个选项呢？按照真正的\
  \ Linux 风格，答案是有很多，尽管如此，你只需要知道几个就能大显身手！\n\n基本用法就是简单的 `ls`，它列出当前位置下的文件和目录。你可以使用普通的通配符对其进行过滤，因此所有这些都是有效的：\n\
  \n```\nmatthew@seymour:~$ ls *\nmatthew@seymour:~$ ls *.txt\nmatthew@seymour:~$\
  \ ls my*ls *.txt *.xml\n```\n\n任何匹配这些过滤器的目录都会递归进入一层。也就是说，如果你运行 `ls my*` 并且你有文件 `myfile1.txt`、`myfile2.txt`\
  \ 和名为 `mystuff` 的目录，那么匹配的文件会被先打印。然后 `ls` 会打印 `mystuff` 目录的内容。\n\n自定义 `ls` 输出的最常用参数如下：\n\
  \n- `-a`—包含隐藏文件。\n- `-h`—使用人类可读的大小。\n- `-l`—（小写 `L`）启用详细列表。\n- `-r`—反向排序。\n- `-R`—递归列出目录。\n\
  - `-s`—显示大小。\n- `--sort`—对列表排序。\n\nLinux 中所有以点开头的文件都是隐藏的，这包括你 `/home` 目录下的 `.gnome`\
  \ 目录，以及 `.bash_history` 和表示当前目录和父目录的隐含目录 `.` 和 `..`。默认情况下，`ls` 不显示这些文件，但如果你运行 `ls\
  \ -a`，它们就会显示。你也可以使用 `ls -A` 显示除 `.` 之外的所有隐藏文件。\n\n`-h` 参数需要配合 `-s` 参数一起，如下：\n\n\
  ```\nmatthew@seymour:~$ ls -sh *.txt\n```\n\n这会以人类可读的格式输出每个匹配文件的大小，例如 108KB 或 4.5MB。\n\
  \n使用 `-l` 参数可以获取更多关于文件的信息。它不仅仅是提供文件名，而是得到如下输出：\n\n```\ndrwxrwxr-x 24 matthew matthew\
  \  4096 Dec 24 21:33 arch\n-rw-r--r--  1 matthew matthew 18691 Dec 24 21:34 COPYING\n\
  -rw-r--r--  1 matthew matthew 88167 Dec 24 21:35 CREDITS\ndrwxrwxr-x  2 matthew\
  \ matthew  4096 Dec 24 21:35 crypto\n```\n\n这显示了四个匹配项，并打印了关于每个项目的大量信息。第一行显示 `arch`\
  \ 目录；你可以看到开头的 `d`，表示这是一个目录。数字 `24` 显示指向此文件的硬链接数量。`rwxrwxr-x` 显示权限。所有者和组都是 `matthew`。`4096`\
  \ 是以字节为单位的大小，而 `Dec 24 21:33` 是修改时间。\n\n接下来的行以 `-rw-r--r--` 开头，表示普通文件。`1` 显示只有一个硬链接。大小\
  \ `18691` 和 `88167` 单位是字节。\n\n### 使用 `man` 读取手册页\n\n该休息一下脑力休息了：`man` 命令很容易用。大多数人只使用主题参数，例如\
  \ `man gcc`。然而，还有两个命令与 `man` 配合使用非常有用：`whatis` 和 `apropos`。\n\n`whatis` 命令返回另一个命令的单行描述，这与该命令手册页顶部的文字相同。例如：\n\
  \n```\nmatthew@seymour:~$ whatis ls\nls (1) - list directory contents\n```\n\n输出解释了\
  \ `ls` 的作用，同时也提供了该命令的手册页章节号，以便你进一步查询。\n\n`apropos` 命令接收搜索字符串作为参数，并返回所有匹配搜索的手册页。例如，`apropos\
  \ mixer` 返回以下列表：\n\n```\nalsamixer (1) - soundcard mixer for ALSA soundcard driver\n\
  mixer (1) - command-line mixer for ALSA soundcard driver\naumix (1) - adjust audio\
  \ mixer\n```\n\n所以，使用 `apropos` 来帮助你查找命令，使用 `whatis` 来告诉你命令的作用。\n\n\n\n\n\n有一个巧妙的技巧是，我们为\
  \ `less` 学到的许多提示和技巧在查看 man 页（手动帮助页）时同样适用（例如，使用 `/` 和 `?` 进行搜索）。这是 UNIX 系统优之处之一：在某个领域获得的知识往往对你在其他领域有所益。\n\
  \n你可以使用许多其他命令来搜索文件系统，包括：\n\n• `whereis` 命令——返回命令的位置（例如，`/bin`、`/sbin` 或 `/usr/bin/command`）及其对应的\
  \ man 页，该 man 页是以标准手册格式作为文件已经包含在你的计算机中的该命令的条目。\n\n• `whatis` 命令——返回命令 man 页的单行摘要。\n\
  \n• `locate file`——返回所有匹配文件的位置；这是一种搜索系统的极快方法，因为 `locate` 搜索的是包含你系统中所有文件索引的数据库。然而，该数据库（大小为几兆字节，命名为\
  \ `mlocate.db`，位于 `/var/lib/mlocate` 目录下）默认在每天 6:25 构建，不包含工作期间或晚上创建的文件路径。如果你不让机器持续运行，可以以超级用户权限运行\
  \ `updatedb` 命令来手动启动数据库的构建。更高级的用户可以通过更改调用该命令的 `cron` 任务来更改数据库更新的时间。`/etc/cron.daily`\
  \ 中有一个名为 `mlocate` 的脚本，它作为数据库每日维护的一部分执行此操作。你需要从 `/etc/cron.daily` 中删除该脚本并将其放入根 `crontab`\
  \ 中，或者更改每日任务的运行时间。如果你现在不知道如何操作，可以在阅读并理解了第 13 章“自动化任务与 Shell 脚本编写](#ch13.html_ch13)”以及其中对\
  \ `cron` 的讨论后再回来，此时之前的描述就会变得清晰了。\n\n• `type name`——返回如果名称被用作命令时将如何被解释。这通常显示选项或将要使用的二进制文件的位置。例如，`type\
  \ ls` 返回 `ls is aliased to 'ls –color=auto'`。\n\n### 使用 `mkdir` 创建目录\n\n创建目录就像听起来那么简单，尽管有一个你应该注意的参数：`-p`。如果你在\
  \ `/home/matthew` 并且想创建目录 `/home/matthew/audio/sound`，你会得到如下错误：\n\n```\nmkdir: cannot\
  \ create directory 'audio/sound': No such file or directory\n```\n\n乍一看，这似乎是不对；`mkdir`\
  \ 无法创建该目录，因为它不存在。它的实际意思是无法创建 `sound` 目录，因为 `audio` 目录不存在。这就是 `-p` 参数派用用场：如果你尝试在一个不存在的目录内创建目录（如上所示），`-p`\
  \ 会连父目录一起创建。\n\n```\nmatthew@seymour:~$ mkdir -p audio/sound\n```\n\n这首先创建 `audio`\
  \ 目录，然后在里面创建 `sound` 目录。\n\n### 使用 `mv` 移动文件\n\n这个命令是最简单的命令之一。`mv` 有两个非常有用的参数：`-f`\
  \ 在不询问的情况下覆盖文件；以及 `-u` 仅当源文件比目标文件新时才移动它。仅此。\n\n### 使用 `ps` 列出进程\n\n这是这里讨论的第三也是最后一个“本应该是简单的，但并非如此”的命令。`ps`\
  \ 命令列出进程，并对其操作提供了极其强大的控制力。\n\n首先需要知道的是，`ps` 通常与所谓的 BSD 风格参数一起使用。在“通过 `find` 搜索文件”一节中，我们讨论了\
  \ UNIX 风格、GNU 风格和 X 风格参数（分别为 `-c`、`--dosomething` 和 `-dosomething`），但 BSD 风格参数不同，因为它们使用不带连字符的单字母。\n\
  \n因此，`ps` 的默认用法列出所有正在运行的附加到终端的进程。然而，你可以通过添加 `x` 参数要求它列出附加到任何终端（实际上是没有任何终端）的所有进程：`ps\
  \ x`。你可以通过 `a` 参数要求列出所有用户的进程，或将其与 `x` 结合来列出所有用户、附加到终端或其他的进程：`ps ax`。\n\n然而，与强大的\
  \ `u` 选项相比，这两者都显得微不足道，后者开启了以用户为导向的输出。在实践中，这产生了巨大的差异，因为你可以获得重要的字段，如所有者的用户名、使用了多少\
  \ CPU 时间和内存、进程何时启动等。由于这会输出大量信息，所以你可能想尝试添加 `f` 参数，它通过使用 ASCII 艺术将父命令与其子命令连接起来，创建一个进程树。你可以将目前为止的所有选项与此命令结合：`ps\
  \ faux`。（是的，凭借一点想象力，你可以用参数拼出单词。）\n\n你可以使用 `--sort` 参数来控制返回数据的顺序。它接受 `a +` 或 `a -`（尽管\
  \ `+` 是默认值），后跟你想要排序的字段：`command`、`%cpu`、`pid` 和 `user` 都是常用的选项。如果你使用负号，结果将反转。接下来的命令列出按\
  \ CPU 使用率降序排列的所有进程：\n\n```matthew@seymour:~$ ps aux --sort=-%cpu\n```\n\n`ps` 还有许多其他参数，包括大量的兼容选项。如果你有时间阅读\
  \ man 页，可以尝试一下。\n\n### 使用 `rm` 删除文件和目录\n\n`rm` 命令只有一个感兴趣的参数：`--preserve-root`。到现在你应该知道使用\
  \ `sudo` 执行 `rm -rf /` 会破坏你的安装，因为 `-r` 表示递归，`-f` 表示强制（不提示确认）。笨拙的人可能会因为错错位置而意外执行此命令。例如：\n\
  \n```\nmatthew@seymour:~$ rm -rf / home/matthew\n```\n\n这次命令的意思是删除 `/` 然后删除 `home/matthew`——结果完全不同！你可以通过\
  \ `--preserve-root` 参数来阻止这种情况发生，它通过此消息阻止你：\n\n```\nrm: it is dangerous to operate\
  \ recursively on '/'\n```\n\n使用 --preserve-root 来覆盖此安全机制。\n\n然而，没有人希望每次运行 `rm` 时都输入\
  \ `--preserve-root`，所以你可以将此行添加到 `/home` 目录下的 `.bashrc` 文件中：\n\n```\nalias rm='rm\
  \ --preserve-root'\n```\n\n该别将在未来的 `bash` 会话中为所有 `rm` 调用添加 `--preserve-root`。Ubuntu（以及\
  \ Debian，可能还有其他发行版）现在默认已经这样做，并不是通过添加别名，而是通过将 `--preserve-root` 设置为命令的默认值。\n\n###\
  \ 使用 `tail` 输出文件尾\n\n如果你想查看正在写入的日志文件，或者监控用户正在发生的操作，你需要能够跟踪变化的日志文件。在这些情况下，你需要 `tail`\
  \ 命令，它打印文件的最后几行并在添加新行时更新。此命令告诉 tail 打印 `/var/log/httpd/access_log`（Apache 访问日志）：\n\
  \n```\nmatthew@seymour:~$ tail /var/log/httpd/access_log\n```\n\n要让 tail 保持运行并随文件变化而更新，请添加\
  \ `-f` 参数（跟随）：\n\n```\nmatthew@seymour:~$ tail -f /var/log/httpd/access_log\n```\n\
  \n\n\n可以通过指定 `--pid` 参数将 `tail -f` 的生命周期与某个进程的存在挂钩。当你这样做时，`tail` 将继续追踪你请求的文件，直到它发现由`进程\
  \ ID (PID)` 标识的进程不再运行，此时它将停止 `tail`。\n\n如果你在命令行上指定了多个文件，`tail` 会同时追踪这两个文件，并在输入源发生变化时打印文件头。在\
  \ `follow` 模式下，按 `Ctrl+C` 终止 `tail`。\n\n### 使用 `top` 打印资源使用情况\n\n`top` 命令在这个列表中与众不同，因为它接受的极少数参数很少被使用（如果说用过的话话）。相反，它有许多可以在运行时使用的命令，可以使用这些命令来自定义显示给你的信息。为了从这些说明中获得最大的收益，请打开两个终端窗口。在第一个窗口中，运行程序\
  \ `yes` 并让它持续运行；在第二个窗口中，运行 `top`。\n\n`top` 的默认排序顺序会先显示 CPU 占用率最高的任务。这里的第一个命令应该是你刚刚从另一个终端启动的\
  \ `yes` 进程，但应该还有很多其他进程。首先，我们想过滤掉所有其他用户，专注于运行 `yes` 的用户。要做到这一点，按 `u` 并输入你运行 `yes`\
  \ 时使用的用户名。当你按下回车键时，`top` 会过滤掉不是由该用户运行的进程。\n\n下一步是杀死 `yes` 命令的 PID，因此你需要理解每个重要字段的含义：\n\
  \n- `PID`—进程 ID\n- `User`—进程所有者\n- `PR`—优先级\n- `NI`— nice 性值（Niceness）\n- `Virt`—以\
  \ KB 为单位的虚拟内存大小\n- `Res`—以 KB 为单位的驻留内存大小\n- `Shr`—以 KB 为单位的共享内存大小\n- `S`—状态\n- `%CPU`—CPU\
  \ 使用率\n- `%Mem`—内存使用率\n- `Time+`—CPU 时间\n- `Command`—正在运行的命令\n\n除非你有特定问题，否则其中几个字段并不重要的。我们感兴趣的是\
  \ `PID`、`User`、`Niceness`、`%CPU`、`%MEM`、`Time+` 和 `Command`。一个进程的 `Niceness` 是与系统上其他一切相比，CPU\
  \ 分配给它的时间比例：19 是最低的，-19 是最高的。\n\n解释了列后，你应该找到早些启动的错误 `yes` 命令的 PID；它通常是 `PID` 下方的第一个数字。现在输入\
  \ `k`，输入该 PID 并按回车。系统会提示你输入一个信号值（你想要杀死进程的方式），默认提供 15。信号 15（也称为 `SIGTERM`，表示终止）是请求进程关闭的礼貌方式，所有没有完全失控的进程都应该对其做出响应。给\
  \ `top` 几秒钟来更新自己，希望 `yes` 命令应该已经消失了。如果没有，你需要更强有力的手段：再次输入 `k`，输入 PID 并按回车。当提示要发送信号时，输入\
  \ `9` 并按回车以发送 `SIGKILL`，即“无论你喜不喜欢，都强制终止”。\n\n你可以通过按 `f` 选择要显示的字段。会出现一个新屏幕，列出所有可能的字段，以及切换它们可见性所需的按字母。被选中的字段用星号标记，并带有相应的字母，如下所示：\n\
  \n- `A`: PID = Process Id\n\n如果你按 `a` 键，屏幕将变为：\n\n`a`: PID = Process Id\n\n当你完成选择后，按回车键返回带有你常规列选择的普通\
  \ `top` 视图。\n\n你也可以按 `F` 选择你想用于排序的字段。这与字段选择屏幕的工作方式相同，不同之处你一次只能选择一个字段。同样，在做出选择后按回车返回\
  \ `top`，它将使用新的排序进行更新。\n\n如果你按 `B`，将启用文本加粗。默认情况下，这会给某些标题栏以及任何当前正在运行的程序（相对于睡眠状态的程序）加粗，但如果你按\
  \ `x`，你还可以启用排序列的加粗。你可以使用 `y` 切换运行进程的加粗。\n\n最后一个要尝试的命令是 `r`，它允许你对进程进行 `renice`——或调整\
  \ nice 值。你需要输入进程的 PID，按回车并输入一个新的 nice 值。请记住，19 是最低的，-20 是最高的；任何小于 0 的值都被认为是“高”的，应该谨慎使用。\n\
  \n### 使用 `which` 打印命令的位置\n\n`which` 的目的是告诉你如果你输入某个命令，将会执行哪个精确命令。例如，`which mkdir`\
  \ 返回 `/bin/mkdir`，告诉你运行命令 `mkdir` 运行的是 `/bin/mkdir`。\n\n### 重定向输出和输入\n\n有时，命令的输出太长，无法在一个屏幕上查看。在其他情况下，将输出保存为文件可能会有优势，以便稍后编辑。你使用\
  \ `cat` 或 `less` 无法做到这一点，至少按照我们目前描述的方式使用它们不能。好消息是：使用重定向是可以的。\n\n命令在标准位置获取输入并给出输出。这被称为标准输入和标准输出。默认情况下，标准输入配置为键盘的输出，因为数据从键盘进入计算机；标准输出配置为屏幕，因为计算机向用户显示命令的结果。\n\
  \n\n\n\n\n在接下来的章节信息中加入重定向的力量，你将最终开始理解精通命令行的用户所拥有的潜能和力量，以及为什么这么多学习命令行的人如此喜爱它。\n\n\
  ## 组合命令\n\n到目前为止，我们一直只是单独使用命令，而且在实践中大部分情况下也是如此的。然而，这些命令的一些真正威力在于将它们组合在一起的能力，以获得你完全想要的结果。有一些我们还没有过的额外小命令经常被用作“胶水”**，因为它们只做一件非常简单的事情，就能让更复杂的流程运行。\n\
  \n我们看过的所有命令都会将其信息打印到屏幕上，但这通常是灵活的。有两种方法控制输出去向：管道（piping）和输出重定向（output redirection）。管道是一个命令输出与另一个命令输入之间的连接器。使用管道不是将输出发送到终端，而是将输出直接发送到另一个命令作为输入。输出重定向的工作方式类似于类似，但通常用于文件。我们将先查看管道，然后是输出重定向。\n\
  \n我们目前看过的两个命令是 `ps` 和 `grep`：进程列表器和字符串匹配器。我们可以将两者结合，找出现在哪些用户在玩 Nethack：\n\n```\n\
  matthew@seymour:~$ ps aux | grep nethack\n```\n\n这创建了一个当前正在运行的所有进程列表，并将该列表发送给 `grep`\
  \ 命令，该命令会过滤掉所有不包含 `nethack` 单词的行。Ubuntu 允许你理智地连接尽可能多的命令。例如，我们可以添加 `wc` 命令（它统计输入中的行数、单词数和字符数），来精确计算\
  \ Nethack 运行了多少次：\n\n```\nmatthew@seymour:~$ ps aux | grep nethack | wc -l\n```\n\
  \n`-l` 参数（小写 `L`）用于 `wc` 只打印行数。\n\n以这种方式使用管道通常比使用 `-exec` 参数进行查找更优，仅仅因为许多人认为 `find`\
  \ 是一门“黑艺术”，因此任何不频繁使用它的东西都更好。这正是 `xargs` 命令派上用场：它将一个命令的输出转换为另一个命令的参数。\n\n为了一个很好的例子，考虑一下之前的那个庞大的\
  \ `find` 命令：\n\n```\nmatthew@seymour:~$ find / -name \"*.txt\" -size +10k -user\
  \ matthew -not -perm +o=r -exec chmod o+r {} \\;\n```\n\n它从 `/` 开始搜索每个目录中匹配 `*.txt`、大小大于\
  \ 10KB、由用户 `matthew` 所有且其他人没有读取权限的文件。然后，它对每个文件执行 `chmod`。这是一个复杂的命令，不熟悉 `find` 工作原理的人在理解它时可能会遇到困难。因此，我们可以做的是将其拆分为两个——对\
  \ `find` 的调用和对 `xargs` 的调用。最理想的转换看起来像这样：\n\n```\nmatthew@seymour:~$ find / -name\
  \ \"*.txt\" -size +10k -user matthew -not -perm +o=r | xargs chmod o+r\n```\n\n\
  这消除了命令末尾令人困惑的 `{} \\;`，但执行的功能相同，而且更快。两者之间的速度差异是因为在 `find` 中使用 `-exec` 会导致它为每个文件执行一次\
  \ `chmod`。然而，`chmod` 一次可以接受很多文件，由于我们每次都使用相同的参数，我们应该利用这一点。第二个命令使用 `xargs` 调用时带了 `find`\
  \ 的所有输出，因此节省了多次命令调用。`xargs` 命令会自动将输入放在行的末尾，因此之前的命令可能像这样：\n\n```\nmatthew@seymour:~$\
  \ xargs chmod o+r file1.txt file2.txt file3.txt\n```\n\n不过，并不是每个命令都接受多个文件，如果你指定了\
  \ `-l` 参数，`xargs` 会为其输入中的每一行执行一次命令。如果你想检查它正在做什么，使用 `-p` 参数让 `xargs` 在执行每个命令之前提示你。\n\
  \n为了获得更强的控制，`-i` 参数允许你指定匹配行应该放置在命令中的精确位置。如果你需要这些行出现在命令结束之前，或者需要它出现多次，这就很重要。无论何种，使用\
  \ `-i` 参数也会启用 `-l` 参数，以便每行都单独发送给命令。下一个命令找到 `/home/matthew` 中所有大于 10,000KB（10MB）的文件，并将它们复制到\
  \ `/home/matthew/archive`：\n\n```\nmatthew@seymour:~$ find /home/matthew -size +10000k\
  \ | xargs -i cp {}\n./home/matthew/archive\n```\n\n将 `find` 配合 `xargs` 使用是一个特殊情况。人们经常在可以使用参数就能很好地完成工作时却使用管道。例如，这两个命令是完全相同的：\n\
  \n```\nmatthew@seymour:~$ ps aux --sort=-%cpu | grep -v 'whoami'\nmatthew@seymour:~$\
  \ ps -N ux --sort=-%cpu\n```\n\n前者打印所有用户和进程，然后将其传递给 `grep`，后者会过滤掉所有包含程序 `whoami`\
  \ 输出（我们的用户名）的行。因此，第一行打印按 CPU 使用率排序的所有进程。第二行没有。\n\n## 使用环境变量\n\n登录时会有许多变量被分配并加载。这些变量被称为环境变量，可以用于定制你的环境。以下列表包含环境变量，以及\
  \ shell 如何使用它们的描述：\n\n- PWD—提供当前工作目录的完整路径，供 `pwd` 命令使用，例如 `/home/matthew/Documents`。\n\
  - USER—声明用户名，为 `matthew`。\n- LANG—设置默认语言，为 `English`。\n- SHELL—声明当前 shell 的名称和位置，例如\
  \ `/bin/bash`。\n- PATH—设置执行文件的默认位置，例如 `/bin`、`/usr/bin` 等。\n- TERM—设置使用的终端类型，例如\
  \ `vt100`，这在使用文本编辑器等面向屏幕的程序时很重要。\n\n你可以使用 `echo $变量名` 打印环境变量的当前值，如下：\n\n```\nmatthew@seymour:~$\
  \ echo $USER\nmatthew\n```\n\n### 注意\n\n每个 shell 都有自己的功能集和语言语法，以及独特的默认环境变量。你可以使用\
  \ `env` 或 `printenv` 命令显示所有环境变量，如下：\n\n```\nmatthew@seymour:~$ env\nORBIT_SOCKETDIR=/tmp/orbit-matthew\n\
  SSH_AGENT_PID=1729\nTERM=xterm\nSHELL=/bin/bash\nWINDOWID=71303173\nGNOME_KEYRING_CONTROL=/tmp/keyring-qTEFTw\n\
  GTK_MODULES=canberra-gtk-module\nUSER=matt\nhew\nSSH_AUTH_SOCK=/tmp/keyring-qTEFTw/ssh\n\
  DEFAULTS_PATH=/usr/share/gconf/gnome.default.path\nSESSION_MANAGER=local/seymour:/tmp/.ICE-unix/1695\n\
  USERNAME=matthew\nXDG_CONFIG_DIRS=/etc/xdg/xdg-gnome\nDESKTOP_SESSION=gnome\n```\n\
  \n\n\n\n`PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games`\n\
  \n`PWD=/home/matthew`\n\n`hew`\n\n`GDM_KEYBOARD_LAYOUT=us`\n\n`LANG=en_US.utf8`\n\
  \n`GNOME_KEYRING_PID=1677`\n\n`MANDATORY_PATH=/usr/share/gconf/gnome.mandatory.path`\n\
  \n`GDM_LANG=en_US.utf8`\n\n`GDMSESSION=gnome`\n\n`HISTCONTROL=ignoreboth`\n\n`SPEECHD_PORT=7560`\n\
  \n`SHLVL=1`\n\n`HOME=/home/matt`\n\n`hew`\n\n`LOGNAME=matt`\n\n`hew`\n\n`LESSOPEN=|\
  \ /usr/bin/lesspipe %s`\n\n`DISPLAY=:0.0`\n\n`LESSCLOSE=/usr/bin/lesspipe %s %s`\n\
  \n`XAUTHORITY=/var/run/gdm/auth-for-matthew-PzcGqF/database`\n\n`COLORTERM=gnome-terminal`\n\
  \n`OLDPWD=/var/lib/mlocate`\n\n`_=/usr/bin/env`\n\n此简略列表显示了一些常用变量。这些变量由包含在 `/etc`、`/etc/skel`\
  \ 或用户 `/home` 目录下的配置或资源文件设置。例如，你可以在 bash 的默认设置中找到位于 `/etc/profile` 和 `/etc/bashrc`，以及你\
  \ `/home` 目录下的 `.bashrc` 或 `.bash_profile` 文件。请查阅 `bash` 的帮助页（man page）以获取有关使用这些配置文件的详细信息。\n\
  \n最重要的环境变量之一是 `$PATH`，它定义了可执行文件的位置。例如，如果你作为一个普通用户，尝试使用一个不在你的 `$PATH` 中的命令（例如虚构的\
  \ `command` 命令），你会看到类似的内容：\n\n```bash\nmatthew@seymour:~$ command\n-bash: command:\
  \ command not found\n```\n\n如果你尝试执行的命令存在于 Ubuntu 软件仓库中，但尚未安装在你的系统中，Ubuntu 会返回安装命令安装命令：\n\
  \n```bash\nmatthew@seymour:~$ command\nThe program 'command' is currently not installed.\
  \ You can install it by typing:\nsudo apt-get install command\n```\n\n然而，你可能知道 `command`\
  \ 已经安装在你的系统中，你可以通过 `whereis` 命令验证这一点，如下：\n\n```bash\nmatthew@seymour:~$ whereis\
  \ command\ncommand: /sbin/command\n```\n\n你也可以通过输入它的完整路径或完整的目录规范来运行该命令，如下：\n\n```bash\n\
  matthew@seymour:~$ /sbin/command\n```\n\n如示例所示，`command` 命令确实已经安装。发生的情况是默认情况下，`/sbin`\
  \ 目录不在你的 `$PATH` 中。原因之一是，`/sbin` 目录下的命令通常只供 root 用户运行。你可以通过编辑 `/home` 目录下的 `.bash_profile`\
  \ 文件将 `/sbin` 添加到你的 `$PATH` 中（如果你默认使用 bash shell，就像大多数 Linux 用户一样的话）。寻找以下行：\n\n\
  `PATH=$PATH:$HOME/bin`\n\n然后你可以编辑此文件（也许可以使用本章稍后讨论的文本编辑器之一），以添加 `/sbin` 目录，如下：\n\n\
  `PATH=$PATH:/sbin:$HOME/bin`\n\n保存文件。下次你登录时，`/sbin` 目录就会在你的 `$PATH` 中。立即使用此更改的一种方法是使用\
  \ bash shell 的 `source` 命令读取 `.bash_profile` 中的新设置，如下：\n\n```bash\nmatthew@seymour:~$\
  \ source .bash_profile\n```\n\n现在你可以运行位于 `/sbin` 目录下的命令，而无需显式输入完整路径。\n\n某些 Linux\
  \ 命令还使用环境变量来获取配置信息（例如，通信程序寻找类似于 `BAUD_RATE` 的变量，该变量可能表示默认调制速度）。\n\n为了尝试环境变量，你可以修改\
  \ `PS1` 变量来操作 shell 提示符的外观。如果你正在使用 `bash`，可以使用内置的 `export` 命令来更改 shell 提示符。例如，如果你的默认\
  \ shell 提示符看起来如下：\n\n```bash\nmatthew@seymour:~$\n```\n\n你可以使用 `PS1` 变量这样改变它的外观：\n\
  \n```bash\n$ PS1='$OSTYPE r00lz ->'\n```\n\n按下回车键后，你会看到以下内容：\n\n```bash\nlinux-gnu\
  \ r00lz ->\n```\n\n* * *\n\n### 注意事项\n\n查阅 `bash` 帮助页以获取其他可用于提示符设置的变量。\n\n* * *\n\
  \n### 使用常用的文本编辑器\n\nLinux 发行版包含许多名为文本编辑器的应用程序，你可以它们创建文本文件或编辑系统配置文件。文本编辑器类似于文字处理程序，但通常功能较少，仅处理文本文件，并且可能支持也可能不支持拼写检查或格式化。文本编辑器在功能和易用性上各不相同，并且可以在几乎每个\
  \ Linux 发行版中找到。你系统中安装的编辑器数量取决于你在系统中安装了哪些软件包。\n\n更流行的基于控制台的文本编辑器包括：\n\n- `emacs`——全面的\
  \ GNU `emacs` 编辑环境，它远不止是一个编辑器；请参见本章后后的“使用 `emacs`”部分。\n- `nano`——一个简单的文本编辑器，类似于经典的\
  \ `pico` 编辑器（它是以前包含的）。\n- `vim`——对 `vi` 编辑器的改进版本（我们在本章中称之为 `vi`，因为它有一个 `vi` 的符号链接）。\n\
  \n某些设计用于终端运行的编辑器有：\n\n- `gedit`——用于 GNOME 的 GUI 编辑器，默认已安装。\n- `kate`——一个 KDE 编辑器。\n\
  - `kedit`——另一个 KDE 编辑器。\n\n学习如何使用文本的编辑器（如 `vi` 或 `nano`）的一个很好的原因是维护操作从不在在 GUI 下进行。如果你的系统出现任何问题且无法登录\
  \ GUI，请考虑这一点。\n\n* * *\n\n### 注意事项在你花时间熟悉非标准编辑器之前，请考虑这一点。我们包含的所有三个编辑器都是可用的。其中两个\
  \ `nano` 和 `vi` 几乎在任何地方都安装。如果你花时间学习非标准编辑器，你会发现自己必须在每个系统中都安装它，而不是使用已有的软件。你可以自由使用任何你喜欢的文本编辑器，但我们强烈建议你至少掌握这些标准工具的基本知识。\n\
  \n* * *\n\n### 使用 `nano`\n\n排在第一个是因为它的学习曲线最简单。它既不是强大的也不是最受专家认可的，但 `nano` 是一个体面的文本编辑器，可以从命令行运行，通常非常适合编辑配置文件等快速任务。\n\
  \n学习如何使用 `nano` 既快速又简单。你可能需要在具有最小化安装的 Linux 系统或没有提供更广泛可用文本编辑器的远程服务器上进行编辑。几乎可以百分之百确定\
  \ `nano` 是可用的。\n\n你可以像这样使用 `nano` 命令启动编辑会话：\n\n```bash\nmatthew@seymour:~$ nano\
  \ file.txt\n```\n\n当你开始编辑时，你会在屏幕上看到文本，顶部有一个标题栏，底部有一系列简单命令。该编辑器非常简单，你不需要任何指令就可以使用。这里是基本命令，以便你与其他列出的编辑器进行比较（`^`\
  \ 是 Control 键）：\n\n\n\n\n\n- **光标移动**—方向键（左、下、上、右）、Page Up 和 Page Down 键，或使用 `^y`\
  \ 和 `^v` 向上页和向下页\n- **添加字符**—在光标位置输入\n- **删除字符**—退格键（Backspace）或删除键（Delete）\n- **退出**—`^x`（提示是否保存更改）\n\
  - **获取帮助**—`^g`\n\n### Note\n`nano` 确实非常易用，但这并不意味着高级用户无法使用它。花一点时间阅读 `Help` 的内容，可以发现该编辑器一些更有趣、更强大的功能。\n\
  \n## 使用 `vi`\n\n在几乎每个 UNIX 和 Linux 系统上都能找到编辑器是 `vi` 编辑器，它最初由 Bill Joy 编写。这个简单用但功能极其强大的编辑器有一套有些晦涩的命令集，但你只需要寥少数命令就能使用它。虽然许多丰富的\
  \ UNIX 和 Linux 用户在计算过程中会广泛使用 `vi`，但许多只进行快速、简单编辑的用户可能不需要它的全部功能，并且可能倾向于使用更易用的文本编辑器，如\
  \ `nano`。铁杆的 GNU 粉丝和程序员通常使用 `emacs` 处理几乎一切。\n\n然而，学习如何使用 `vi` 是一个好主意。你可能需要在一个最小化安装的\
  \ Linux 系统或一个没有提供更多可用文本编辑器的远程服务器上编辑文件。几乎可以百分之百确定 `vi` 是可用的。\n\n你可以这样使用 `vi` 命令启动编辑会话：\n\
  \n```\nmatthew@seymour:~$ vi file.txt\n```\n\n`vi` 命令通过使用插入模式（或编辑模式）和查看模式（或命令模式）工作。\n\
  \n当你第一次开始编辑时，你处于查看模式。你可以使用方向键或其他导航键（如后文所示）来滚动文本。要开始编辑，按下 `i` 键插入文本，或按下 `a` 键追加文本。完成后，使用\
  \ Esc 键从插入或追加模式切换出来，进入查看模式（或命令模式）。要输入命令，输入冒号（`:`），然后跟上命令，例如输入 `w` 写入文件，并按回车。\n\n\
  尽管 `vi` 支持许多复杂的编辑操作和众多命令，但你可以使用几个基础命令来完成工作。这些基础 `vi` 命令如下：\n\n- **光标移动**—`h`, `j`,\
  \ `k`, `l`（左、下、上、右）\n- **删除字符**—`x`\n- **删除行**—`dd`\n- **模式切换**—Esc, Insert（或 `i`）\n\
  - **退出**—`:q`\n- **不保存退出**—`:q!`\n- **运行 shell 命令**—`:sh`（使用 `'exit'` 返回）\n- **保存文件**—`:w`\n\
  - **文本搜索**—`/`\n\n### Note\n使用 `vimtutor` 命令快速学习如何使用 `vi` 的键盘命令。该教程需要不到 30 分钟，它教新用户如何启动或停止编辑器、导航文件、插入和删除文本，以及执行搜索、替换和插入操作。\n\
  \n## 使用 `emacs`\n\nRichard M. Stallman 的 GNU `emacs` 编辑器和 `vi` 一样，包含在 Ubuntu 和几乎所有其他\
  \ Linux 发行版中。与其他 UNIX 和 Linux 文本编辑器不同，`emacs` 不仅仅是一个简单的文本编辑器。它是一个编辑环境，可以用于编译和构建程序，并作为电子日记、预约本和日历。用它编写和发送电子邮件、读取\
  \ Usenet 新闻，甚至玩游戏。这种能力的原因是 `emacs` 包含一个内置语言解释器，它使用 Elisp（emacs LISP）编程语言。Ubuntu\
  \ 默认没有安装 `emacs`。要使用 `emacs`，你需要安装的包名为 `emacs`。参见第 9 章，“管理软件](#ch09.html_ch09)。”\n\
  \n你可以这样启动 `emacs` 编辑会话：\n\n```\nmatthew@seymour:~$ emacs file.txt\n```\n\n### Tip\n\
  如果你在使用 X11 时启动 `emacs`，编辑器会在自己的浮动窗口启动。要强制 `emacs` 显示在终端窗口而不是自己的窗口内（如果在远程计算机登录时非常有用），请使用\
  \ `-nw` 命令行选项，例如：`emacs -nw file.txt`。\n\n`emacs` 编辑器使用了大量的按键和命名命令，但你可以通过基础命令子集与它工作。这些基础命令中的许多需要你按住\
  \ Ctrl 键，或者先按下 *meta* 键（通常映射到 Alt 键）。表 11.1 列出了基础命令。\n\n表 11.1 `emacs` 编辑命令\n\n\
  ![Image](img/11tab01.jpg)\n\n学习如何使用 `emacs` 的最佳原因之一是你可以使用几乎所有相同的按键来编辑 `bash` shell\
  \ 命令行上的命令，尽管可以更改默认使用 `vi` 键位绑定。另一个原因是，像 `vi` 一样，`emacs` 在几乎每个 UNIX 和 Linux 系统上都可以安装，包括\
  \ Apple 的 Mac OS X。\n\n## 处理压缩文件\n\n另一个文件管理操作是文件的压缩和解压缩，或者文件和目录存档的创建、列出和扩展。Linux\
  \ 发行版通常包含几种压缩实用，可以使用它们创建、压缩、扩展或列出压缩文件和存档的内容。这些命令包括：\n\n- `bunzip2`—解压压缩文件。\n- `bzip2`—压缩或扩展文件和目录。\n\
  - `gunzip`—解压压缩文件。\n- `gzip`—压缩或扩展文件和目录。\n- `tar`—创建、扩展或列出压缩或未压缩的文件或目录存档，这些被称为*磁带存档*（tape\
  \ archives）或 *tarballs*。\n\n这些命令大部分都非常易于使用。然而，其中最常用的 `tar` 命令有一套相当复杂的命令行选项和语法。这种灵活性和强大是它受欢迎的一部分；你可以通过记住几个简单的命令行选项来快速学会使用\
  \ `tar`。例如，要创建一个目录的压缩存档，使用 `tar` 的 `czf` 选项，如下：\n\n```\nmatthew@seymour:~$ tar czf\
  \ compressedfilename.tgz directoryname\n```\n\n结果是指定目录的压缩存档（以 `.tgz` 结尾的文件）。在前面的选项中添加字母\
  \ `v` 可以在创建存档时查看所添加的文件列表。要列出压缩存档的内容，将 `c` 选项替换为字母 `t`，如下：\n\n```\nmatthew@seymour:~$\
  \ tar tzf archive\n```\n\n但是，如果存档有很多文件，更好的调用方式（以便方便地阅读或滚动输出）是这样的：\n\n```\nmatthew@seymour:~$\
  \ tar tzf archive | less\n```\n\n要扩展压缩存档的内容，使用 `tar` 的 `zxf` 选项，如下：\n\n```\nmatthew@seymour:~$\
  \ tar zxf archive\n```\n\n`tar` 工具会解压缩指定的存档并在当前目录提取内容。\n\n## 使用 `byobu` 使用多个终端\n\
  \n许多 Linux 老兵一直很喜欢并使用 `screen` 命令。`screen` 设计是为了让你轻松地用一个终端控制多个终端会话。虽然 `screen` 一直是一个受欢迎且实用的工具，但出现了一个更好的工具叫做\
  \ `byobu`；它是 `screen` 的增强版本。*Byobu* 是日语，指装饰性的多面板折叠屏，通常用作隔断。\n\n想象这样一个场景：你通过*安全外壳\
  \ (SSH)* 连接到服务器并在远程 shell 中工作。你需要打开另一个 shell 窗口以便并排运行它们；例如，你想在一个窗口中显示 top 的输出，同时在另一个窗口中输入。你会做什么？大多数人会打开另一个\
  \ SSH 连接，但这既浪费又必要。像 `screen` 一样，`byobu` 是一个终端复用器，这是一个高级术语，指一个让你可以在一个终端内运行多个终端的程序。\n\
  \n\n\n\n学习 `byobu` 的最佳方法就是亲自尝试。所以，打开控制台，输入 `byobu` 然后按回车键。你的屏幕会闪烁一下，然后被一个新控制台取代，底部的面板中会显示新信息。现在，让我们对终端做些操作吧。运行\
  \ `top` 并让它保持运行。按下 `F2`。你的提示符会再次清除，让你能够输入命令。运行 `uptime` 命令。\n\n随堂测试：那个正在运行 `top`\
  \ 的旧终端怎么了？当然了，它仍在运行。你可以输入 `F3` 返回它。输入 `F4` 回到你的 `uptime` 终端。当你查看其他终端时，其他终端中的命令仍会正常继续运行，因此你可以进行多任务处理。以下是\
  \ `byobu` 中的一些基础命令：\n\n- `F2`—创建一个新窗口。\n- `F3`—跳转到上一个窗口。\n- `F4`—跳转到下一个窗口。\n- `F9`—打开\
  \ Byobu 菜单用于帮助和配置。\n\n要关闭 `byobu` 内的终端，只需正常使用 `exit` 或 `Ctrl+d` 退出即可。当你退出 `byobu`\
  \ 中打开的最后一个终端会话时，程序也会关闭，并回到你启动 `byobu` 时使用的普通终端会话。\n\n然而，退出 `byobu` 会话还有两种替代方案：锁定和断开。第一种通过\
  \ `F12` 激活，会锁定对屏幕数据的访问，直到你输入系统密码。\n\n第二种是 `screen` 最强大的功能，在 `byobu` 中同样运行完美：你可以退出并去做一会儿其他事情，以后再连接；`screen`\
  \ 和 `byobu` 都会从你离开的地方继续。例如，你可以在桌前打字，分离会话并回家，重新连接，然后就像什么都没有发生一样继续。此外，从 `screen` 或\
  \ `byobu` 运行的所有程序在 `screen` 或 `byobu` 断开连接时仍继续运行。如果有人在锁定状态下（使用 `Ctrl+a+x`）关闭了你的终端窗口，它还会自动为你断开连接。\n\
  \n要断开连接，按下 `F6`。你将返回启动 `screen` 或 `byobu` 的提示符，可以继续工作、关闭已打开的终端，甚至完全注销。当你想要重新连接时，运行命令\
  \ `screen -r` 或 `byobu -r`。在此期间，你可以直接运行 `screen` 或 `byobu` 开启新会话而不恢复之前的会话，但如果你重视自己的理智，这样做并不明智。你可以根据需要多次断开并重新连接同一个会话，这可能意味着你再也不需要丢失会话。\n\
  \n尽管这仅仅展示了 `byobu` /`screen` 功能的一角，但希望你能看到它是有多用。查看各自的 man 页以了解更多信息。\n\n#### 参考文献\n\
  \n- [www.gnu.org/](http://www.gnu.org/)—GNU 项目的网站，包含了许多命令行软件的手手册和下载包。\n- [`oreilly.com/linux/command-directory/`](http://oreilly.com/linux/command-directory/)—丰富的\
  \ Linux 命令选择及其功能说明，取自 O’Reilly 的优秀书籍 *Linux in a Nutshell*，该书是一本 Linux 命令字典。\n-\
  \ [www.tuxfiles.org/linuxhelp/cli.html](http://www.tuxfiles.org/linuxhelp/cli.html)—几个简短的命令行教程。\n\
  - [www.linuxcommand.org/](http://www.linuxcommand.org/)—自称为“你的一站式命令行商店！”它包含了大量关于控制台的有用信息。\n\
  - 从底层螺丝架构层面理解 UNIX 的工作原理既具挑战性又能获回报，有几本很好的书籍可以指引你前进。也许最好的是 Eric Raymond 编写的 *The\
  \ Art of UNIX Programming* (Addison-Wesley 出, ISBN: 0-13-142901-9)，它专注于 UNIX 背后的哲学，并成功融入了大量关于命令行的内容。\n\
  - [www.vim.org/](http://www.vim.org/)—Linux 发行版自带的 `vim` (vi 克隆) 编辑器主页。在此处查看该编辑器的更新、错误修复和新闻。\n\
  - [www.gnu.org/software/emacs/emacs.html](http://www.gnu.org/software/emacs/emacs.html)—FSF\
  \ GNU `emacs` 编辑环境的主页；你可以在这里找到额外的文档以及最新版本源代码的链接。\n- [www.nano-editor.org/](http://www.nano-editor.org/)—GNU\
  \ `nano` 编辑器环境的主页。\n- O’Reilly 的 *The UNIX CD Bookshelf* (ISBN: 0-596-00392-7) 将七本备受推崇的书合为一，尽管零售价超过了\
  \ 120 美元。然而，它的深度和广度是无可比拟的。\n\n## 第 12 章 管理用户\n\n* * *\n\n本章\n\n- 用户账户\n- 管理组\n-\
  \ 管理用户\n- 管理密码\n- 为普通用户授予系统权限\n- 磁盘配额\n- 相关命令\n- 参考文献\n\n* * *\n\n如果没有用户，系统管理员的生活将很无聊，但也轻松得多。现实中，一个完全没有用户的系统是不可能的，因此学习如何有效地管理和维护你的用户至关重要。无论你是创建一个用户账户，还是修改包含数百个用户账户的组，用户管理的原理都是相同的。用户管理和维护包括分配和管理\
  \ `/home` 目录、制定良好的密码策略，以及应用有效的安全策略（包括磁盘配额、文件和目录权限等内容）。我们在本章中查看所有这些领域以及你可能会发现的不同类型的用户。\n\
  \n### 用户账户\n\n你通常会在 Linux 系统上遇到三种类型的用户：超级用户（super user）、普通用户（day-to-day user）和系统用户（system\
  \ user）。每种类型对于系统的正常运行都至关重要。要在 Linux 环境中高效安全地工作，学习这三者的区别是必须的。\n\n所有访问系统的用户都必须拥有系统中账户。Ubuntu\
  \ 使用 `/etc/passwd` 文件来存储系统中存在的用户账户信息。无论类型如何，所有用户在文件中都有一行条目，包含其用户名（通常用于登录系统）、加密后的密码字段（包含\
  \ `X` 表示存在密码）、用户 ID（通常称为 UID）和组 ID（通常称为 GID）。最后两个字段显示了 `/home` 目录的路径（通常为 `/home/username`）以及用户的默认\
  \ shell（新用户的默认为 `/bin/bash`）。此外还有一个名为 GECOS 的字段，它使用逗号分隔的列表来记录账户或用户信息；通常当使用该字段时，它会记录用户的全名和联系信息。\n\
  \n> 尽管密码字段包含 `X`，但这并不意味着你在这里看到的是实际密码。所有密码都以加密格式存储在 `/etc/shadow` 中以确保安全。每需要密码时，Ubuntu\
  \ 会自动引用该文件。\n\n\n\n\n\n遵循 UNIX 风格操作系统的长期传统，Ubuntu 使用了成熟的 UNIX 文件所有权和权限系统。首先，这些系统中的一切内容都被视为一个文件，并且所有文件（包括目录和设备）都可以被分配一个或多个读取、写入和执行权限。这三个“标记”也可以根据需要分配给三个类别中的每一个：文件所有者、组组成员或系统中的任何其他人。一个文件的安全性就源于这些权限以及文件所有权。作为系统管理员（也常称为\
  \ `super user`，即超级用户），你有责任有效地管理这些设置，并确保用户拥有适当的 `UIDs` 和 `GIDs`。最重要的是，系统管理员可以通过这些文件权限，将敏感文件对不应具有访问的用户锁定。\n\
  \n## 超级用户/Root 用户 (The Super User/Root User)\n\n无论系统中有多少系统管理员，只能有一个超级用户账户。超级用户账户更常被称为\
  \ `root user`，它对系统的所有方面拥有完全且全面的控制权。他们可以访问文件系统的任何部分；读取、更改或删除任何文件；授予和撤销对文件和目录的访问；并可以在系统上执行任何操作，如果他们愿意，甚至可以销毁系统。root\
  \ 用户的独特之处在于它的 `UID` 为 `0` 且 `GID` 也为 `0`。\n\n换句话说，root 用户对你的系统拥有最高权力。考虑到这一点，重要的一点是你不要一直以\
  \ root 身份进行工作，因为你可能会无意中给系统造成严重破坏，甚至导致其完全无法使用。相反，只有当你需要为了 root 权限对系统进行特定更改时，才依赖 root。一旦完成工作，你就可以切换回普通用户账户继续工作。\n\
  \n在 Ubuntu 中，你使用 `sudo` 命令以 root（即超级用户）权限执行命令，如下所示：\n\n```\nmatthew@seymour:~$ sudo\
  \ apt-get update\n```\n\n系统会提示你输入密码，在输入时密码不会显示在屏幕上。输入密码后按回车。Ubuntu 随后执行该命令（在本例中是更新可用软件信息），就像你以\
  \ root 身份运行它一样。\n\n## Root 用户 (The Root User)\n\n如果你用过其他 Linux 发行版，你可能会对 `sudo`\
  \ 命令的使用感到困惑，因为并不是所有的发行版都使用它。简而言之，Ubuntu 允许系统上的第一个用户使用 `sudo` 命令获取完全 root 权限。它还禁用了\
  \ root 账户，因此实际上无人可以使用 `root` 用户名登录。\n\n在其他 Linux 发行版中，你通过发布命令 `su -nd` 并在提示时输入 root\
  \ 密码来切换到 root 用户。这将进入 root 提示符，显示为井号（`#`）。从这里开始，你可以执行任何想要的命令。要在 Ubuntu 中进入 root\
  \ 提示符，你需要执行命令 `sudo -i`，在你输入密码后，它将为你提供其他 Linux 发行版中熟悉的提示符。当你完成 root 身份的工作后，只需输入\
  \ `exit` 并按回车即可返回普通用户提示符（`$`）。\n\n普通用户是指那些登录系统并使用它执行非管理任务（如文字处理或电子邮件）的人员。这些用户不需要进行系统范围的更改或管理其他用户。然而，他们可能想要更改特定于账户的设置（例如桌面背景）。取决于系统管理员（root\
  \ 或超级用户）想要行使多少控制权，普通用户可能无法做到。\n\n超级用户使用文件和目录权限向普通用户授予权限（在第 10 章“命令行快速上手](#ch10.html_ch10)”中已介绍）。例如，如果超级用户不想让你更改\
  \ `~/.profile` 中的设置（`~` 是代表你的 `/home` 目录的 shell 快捷方式），root 可以更改权限，使你可以读取该文件但不能写入。\n\
  \n## 注意事项 (Caution)\n\n由于作为超级用户可能会犯下灾难性错误，请务必始终作为普通用户使用系统，并仅临时使用你的超级用户权限执行特定的管理任务。在\
  \ Ubuntu 中这更容易记忆，因为 `sudo` 是默认的，且 root 账户最初是被禁用的。如果你在多用户系统上工作，请将此建议视为绝对法则；如果 root\
  \ 删除了错误的文件或杀杀了错误的进程，对系统的结果可能是灾难性的（很可能对拥有和运营它的业务也是如此）。在个人系统上，你可以随心所欲。以 root 运行会让很多事情变得更容易，但安全性大大降低，我们仍然不建议这样做。然而，在任何环境下，以\
  \ root 运行的风险都是巨大的，我们无法强调在 root 身份工作时保持谨慎有多么重要。\n\n第三类用户是系统用户。系统用户不是一个人，而是系统在日常运行各种服务期间使用的管理账户。例如，名为\
  \ `www-data` 的系统用户拥有 Apache Web 服务器以及所有相关文件。只有该用户和 root 可以访问这些文件；其他人无法访问或更改这些文件。系统用户没有家目录或密码，也不允许通过登录提示符访问系统。\n\
  \n你可以在 `/etc/passwd` 文件中找到系统中所有用户的列表。\n\n## 用户 ID 和组 ID (User IDs and Group IDs)\n\
  \n计算机从本质上讲是面向数字的机器。它通过被称为 `用户 ID (UID)` 和 `组 ID (GID)` 的数字来识别用户和组。屏幕上显示的字母名称只是为了方便使用。\n\
  \n如前提到的，root 用户是 `UID 0`。`1` 到 `499` 之间的数字以及数字 `65534` 是系统用户（有时也称为逻辑用户或伪用户）。普通用户拥有从\
  \ `1000` 开始的 `UID`；Ubuntu 从该数字开始顺序分配。\n\n在极少数例外，GID 与 UID 相同。\n\nUbuntu 为每个 `1000`\
  \ 及以上的 `UID` 创建一个私有的 GID。系统管理员可以将其他用户添加到 GID，或者创建一个全新的组并将用户添加到其中。与 Windows NT 和某些\
  \ UNIX 变体不同，Ubuntu 中的组不能是另一个组的成员。\n\n## 文件权限 (File Permissions)\n\n正如你从第 4 章“在网上](#ch04.html_ch04)”中学到的，有三种类型的权限：读取、写入和执行（`r`,\
  \ `w`, `x`）。对于任何文件或目录，权限被分配给三个类别：用户、组和其他。在本节中，我们关注组权限。在在此之前，我们想强调三个用于更改文件或目录组、用户或访问权限的命令：\n\
  \n- `chgrp`—更改文件或目录的组所有。\n- `chown`—更改文件或目录的所有者。\n- `chmod`—更改文件或目录的访问权限。\n\n这些命令可以用于在你的\
  \ Ubuntu 系统中重现现实组织结构和权限（参见下一节“管理组”）。例如，人力资源部门可以通过使文件对可访问目录中的任何人可读（但不可写），从而向所有员工共享健康福利备忘录。公司研发部门的程序员虽然可以访问彼此的源代码文件，但没有\
  \ HR 薪资表或人事档案的读取或写入权限（而且也不希望人力资源部或市场部窥探研发部门）。\n\n\n\n\n\n这些命令用于从命令行方便地管理组和文件的所有权及权限。了解这些命令至关重要，因为在某些情况下你可能只能通过命令行界面进行工作，例如当一位心意良好但操作失误的系统管理员为\
  \ `X11` 设置了错误的权限，导致系统无法使用图形界面工作。（不，我们不会讲那个故事，但如果你按过那些按键，大多数系统管理员都有类似的惨痛经历。）\n\n\
  ***\n\n**用户刻板印象**\n\n正如许多职业一样，对于用户和系统管理员也出现了一些夸大的刻板印象。许多刻板印象包含真实元素的元素，并夹杂着大量的夸张和幽默，有助于我们理解这些被刻板印象化的对象的特征和差异。`luser`（普通用户）和\
  \ `BOFH`（对用户和管理员的并不那么友好的称呼）的刻板印象，起到了警示教育的作用，描述了计算社区中哪些行为是可接受的，哪些是不可接受的。\n\n理解这些刻板印象可以让你更好地定义系统管理员、用户和其他人的适当与不适当的角色。你可以在\
  \ Wikipedia 上找到每个词的描述：[`en.wikipedia.org/wiki/BOFH`](http://en.wikipedia.org/wiki/BOFH)\
  \ 和 [`en.wikipedia.org/wiki/Luser`](http://en.wikipedia.org/wiki/Luser)。\n\n***\n\
  \n### 管理组\n\n组可以使用户管理变得简单得多。你不需要为每个用户单独分配权限，而是可以使用组来快速方便地授予或撤销大量用户的权限。设置组权限允许你为协作工作设置工作区，并控制可以使用哪些设备（如外部驱动器或\
  \ DVD 刻机）。这种方法代表了一种安全的方法，可以将系统资源的访问限制为那些需要它们的用户。例如，系统管理员可以将 `matthew`、`ryan`、`heather`、`holly`、`debra`\
  \ 和 `mark` 用户放入名为 `unleashed` 的新组中。这些用户可以创建用于小组工作的文件，并使用 `chgrp` 将这些文件的组改为 `unleashed`。\n\
  \n现在，`unleashed` 组中的每个人（除 `root` 之外没有其他人）都可以操作这些文件。系统管理员可能会创建一个由该组所有的目录，以便其成员有一个方便的访问的地方来存储这些文件。系统管理员还可以将\
  \ `sonya` 和 `nicole` 等其他用户加入组，并在他们完成工作后移除用户。系统管理员可以将用户 `matthew` 设为组管理员，这样 `matthew`\
  \ 就能决定如何更改组成员身份。你还可以对 DVD 刻机设置限制，使得只有 `matthew` 可以刻录 DVD，从而保护敏感材料不落入他人手中。\n\n####\
  \ 列出组\n\n不同的 UNIX 操作系统以各种方式实现组的概念。Ubuntu 使用一种名为 `UPG (用户私有组)` 的方案，默认情况下，所有用户都会分配到一个与自己用户名同名的组中。（用户的用户名和组名完全相同）。系统上的所有组都列在\
  \ `/etc/group` 文件。\n\n以下是 `/etc/group` 文件部分示例：\n\n```\nmatthew@seymour:~$ cat /etc/group\n\
  root:x:0:\ndaemon:x:1:\nbin:x:2:\nsys:x:3:\nadm:x:4:matthew\ntty:x:5:\ndisk:x:6:\n\
  mail:x:8:\nnews:x:9:\nfax:x:21:matthew\nvoice:x:22:\ncdrom:x:24:matthew\nfloppy:x:25:matthew\n\
  tape:x:26:matthew\nwww-data:x:33:\ncrontab:x:107:\nssh:x:109:\nadmin:x:115:matthew\n\
  saned:x:116:\ngdm:x:119:\nmatthew:x:1000:\nntp:x:122:\n```\n\n在这个示例中，你看到了许多组，大部分用于服务（邮件、新闻等）和设备（软盘、磁盘等）。正如前面提到的，系统服务组允许这些服务对其文件拥有所有权和控制权。例如，如前文所示，将\
  \ `postfix` 添加到邮件组，允许 `postfix` 应用程序按照邮件系统决定组访问其文件的方式来访问邮件文件。将普通用户添加到设备组中，允许该普通用户根据组所有者授予的权限使用设备。例如，将用户\
  \ `matthew` 添加到 `cdrom` 组允许 `matthew` 使用光驱设备。你将在下一节中学习如何从组中添加和删除用户。\n\n#### 组管理工具\n\
  \nUbuntu 提供了几个用于管理组的命令行工具，但也提供了相应的图形化工具。大多数丰富的系统管理员倾向于使用命令行工具，因为它们快速易用，在没有图形用户界面的情况下也始终可用，而且当系统管理员想要编写快速程序来执行重复性任务时，可以将它们包含在他们编写的脚本中。\n\
  \n以下是最常用的组管理命令行工具：\n\n- `groupadd`—此命令创建并添加新组。\n- `groupdel`—此命令删除一个已存在的组。\n- `groupmod`—此命令创建组名或\
  \ `GIDs`，但不会向组添加或删除成员。\n- `gpasswd`—此命令创建组密码。每个组都可以有一个组密码和一个管理员。使用 `-A` 参数将用户指定为管理员。\n\
  - `useradd -G`—该参数在创建用户时将用户添加到组。\n- `usermod -G`—此命令允许在用户未登录的情况下将用户添加到组。\n- `grpck`—此命令检查\
  \ `/etc/group` 文件是否存在拼写错误。\n\n假设我们的电脑上有一个 DVD 刻机（`/dev/sd0`），系统管理员希望普通用户 `ryan`\
  \ 使用它。以下是授予 `ryan` 权限的过程：\n\n1. 使用 `groupadd` 命令添加组：\n```\nmatthew@seymour:~$ sudo\
  \ groupadd dvrw\n```\n2. 使用 `chgrp` 命令更改设备的所有组：\n```\nmatthew@seymour:~$ sudo chgrp\
  \ dvrw /dev/sd0\n```\n3. 使用 `usermod` 命令将批准的用户添加到组：\n```\nmatthew@seymour:~$ sudo\
  \ usermod -G dvrw ryan\n```\n4. 使用 `gpasswd` 命令将 `ryan` 设为组管理员：\n```\nmatthew@seymour:~$\
  \ sudo gpasswd -A ryan\n```\n\n现在 `ryan` 拥有使用该设备的权限，超级用户或 `ryan` 加入组的其他人也是如此。\n\n\
  系统管理员还可以使用 Ubuntu 提供的图形界面，如图 12.1](#ch12.html_ch12fig01) 所示。该界面可以通过菜单“系统 -> 管理 ->\
  \ 用户和组”访问。\n\n请注意，图形界面并没有所有的组命令和选项。这限制了 GUI 的实用性，使其仅适用于最常用的命令。你将在本章的下一节中学习更多关于 Ubuntu\
  \ 用户管理器 GUI。\n\n### 管理用户\n\n必须创建用户、分配 UID、提供 `/home` 目录、为其主目录提供初始文件，并分配到组，以便他们安全高效地使用系统资源。在某些情况下，系统管理员可能或需要限制用户对特定文件和文件夹的访问，还要限制账户可以使用的磁盘空间。\n\
  \n\n\n\n与组一样，Ubuntu 提供了几个命令行工具来管理用户，但也提供了图形化工具执行这些操作。大多数经验丰富的系统管理员更倾向于使用命令行工具，因为它们快速易用，即使在没有图形界面（GUI）的情况下也可用，而且当系统管理员想要编写一个快速程序来执行重复性任务时，这些工具可以包含在他们编写的脚本中。以下是管理用户最常用的命令：\n\
  \n- `useradd`—此命令向系统添加新用户账户。其选项允许系统管理员指定用户的 `/home` 目录和初始组，或者使用默认的 `/home` 目录和组分配创建用户（基于新账户的用户名）。\n\
  - `useradd -D`—此命令设置创建用户的 `/home` 目录、账户过期日期、默认组和命令 shell 的系统默认值。请参阅 `useradd` 手帮助页中的特定选项。在不带任何参数的情况下使用时，它会显示系统的默认值。用户的默认文件集位于\
  \ `/etc/skel`。\n\n***\n\n### 注意\n\n最初用于填充新用户主目录的文件集保存在 `/etc/skel` 中。这对于系统管理员来说非常方便，因为任何需要通用应用的特殊文件、链接或目录都可以放在\
  \ `/etc/skel` 中，并且会自动为每个新用户复制并带有适当的权限：\n\n```\nmatthew@seymour:~$ ls -la /etc/skel\n\
  \ntotal 32\ndrwxr-xr-x   2 root root  4096 2010-04-25 12:14 .\ndrwxr-xr-x 154 root\
  \ root 12288 2010-07-01 16:30 ..\n-rw-r--r--   1 root root   220 2009-09-13 22:08\
  \ .bash_logout\n-rw-r--r--   1 root root   3103 2010-04-18 19:15 .bashrc\n-rw-r--r--\
  \   1 root root   179 2010-03-26 05:31 examples.desktop\n-rw-r--r--   1 root root\
  \   675 2009-09-13 22:08 .profile\n```\n\n每行提供了文件权限、该文件或目录名下的文件数量、文件所有者、文件组、文件大小、创建日期和文件名。\n\
  \n如你所见，这里的每个文件都属于 root。`useradd` 命令会将 `/etc/skel` 中的所有内容复制到新的主目录，并将文件所有权和权限重置为新用户。\n\
  \n某些用户文件可能存在且系统管理员不希望用户更改；可以对 `/home/username` 中这些文件的权限进行重置，使用户可以读取它们但无法写入它们。\n\n\
  ***\n\n- `userdel`—此命令完全删除用户账户（从而消除该用户的家目录及其包含的所有文件）。\n- `passwd`—此命令更新密码管理系统使用的“身份验证令牌”。\n\
  \n***\n\n### 提示\n\n要锁定用户的账户，请使用以下命令：\n\n```\nmatthew@seymour:~$ sudo passwd -l username\n\
  ```\n\n这会在用户的加密密码前面加一个 `!`（感感叹号，也称为 bang）；撤销该过程的命令使用 `-u` 选项。\n\n***\n\n- `usermod`—此命令更改多个用户属性。最常用的参数是更改\
  \ shell 的 `-s` 和更改 UID 的 `-u`。在用户登录或运行进程时，无法进行任何更改。\n- `chsh`—此命令更改用户的默认 shell。对于\
  \ Ubuntu 而言，默认 shell 是 `/bin/bash`，被称为 Bash 或 Bourne Again Shell。\n\n#### 添加新用户\n\
  \n通过命令行方法添加用户非常简单，可以在单行内完成。在接下来的示例中，系统管理员使用 `useradd` 命令添加新用户 `heather`。`adduser`\
  \ 命令（在某些 UNIX 系统上找到变体）是 `useradd` 的符号链接，因此两个命令的作用相同。在例示例中，我们使用 `-p` 选项设置用户请求的密码；使用\
  \ `-s` 设置她的特殊 shell（代替默认的 bash shell），并使用 `-u` 选项指定她的 UID。（如果我们使用默认设置创建用户，则不需要使用这些选项。）我们想要做的一切都可以在一行完成：\n\
  \n```\nmatthew@seymour:~$ sudo useradd heather -p c00kieZ4ME -s /bin/zsh -u 1042\n\
  ```\n\n系统管理员也可以使用 Ubuntu 提供的图形界面。你可以在“系统-管理-用户和组”菜单中找到它。在这里，系统管理员正在向系统添加新用户，其中用户\
  \ `heather` 使用 `bash` 命令 shell。\n\n我们使用以下步骤添加与前面的命令相同的账户，但使用的是图形化的用户管理器界面：\n\n1.\
  \ 从“系统-管理-用户和组”菜单中启动 Ubuntu 用户管理器图形化界面。\n2. 点击“添加用户”按钮弹出“添加用户”对话框（请回阅图 12.1）。\n\
  3. 在表单中填写新用户信息。\n4. 分配一个良好的密码。\n5. 在列表中选中新用户并点击“高级”。\n6. 你可以根据需要在此更改权限设置，然后点击“高级”选项卡。\n\
  7. 打开 Shell 下拉菜单选择所需的 shell。\n8. 使用 ID 框右侧的箭头调整 UID，或直接在框中输入大于 1000 的数字。系统将防止你分配已被占用的数字。\n\
  9. 点击“确定”保存设置。\n\n注意，该用户被手动分配了 UID 1042，因为这是她在连接到这台机器时的 UID。系统通过 UID 数字而不是名称来跟踪用户。即使账户名称相同，如果分配了不同的\
  \ UID，两台机器也不会将 `heather` 识别为同一个用户。\n\n\n\n\n\n`ac` 命令提供用户以小时为单位的累计连接时间信息。它访问 `/var/log/wtmp`\
  \ 文件作为信息源。`ac` 命令在 shell 脚本中最为有用，用于生成供管理层审查的操作系统使用情况报告。请注意，要使用 `ac` 命令，你必须从 Ubuntu\
  \ 仓库安装 `acct` 软件包。\n\n***\n\n### 提示\n有趣的是，一种名为*时间扭曲*（time warp）的现象可能会发生，即 `wtmp`\
  \ 文件中的某条条目跳回过去，导致 `ac` 显示用户占用的时间异常巨大。尽管这可以归因于与系统时有关的一些无害因素，但系统管理员应该对其进行调查，因为这也可能是安全泄露的结果。\n\
  \n***\n\n`last` 命令搜索 `/var/log/wtmp` 文件，并列出自该文件首次创建以来所有登录和注出的用户。存在 `reboot` 用户是为了让你知道自上次重启以来有谁用户登录过系统。`last`\
  \ 的伴侣命令是 `lastb`，它显示所有失败的或无效的登录尝试。这对于判断合法用户是否遇到问题或黑客是否正尝试访问非常有帮助。\n\n***\n\n###\
  \ 注意\n你计算机上的计费系统跟踪用户使用统计，并存储在当前的 `/var/log/wtmp` 文件中。该文件由 `init` 和 `login` 进程管理。如果你想深入计费系统，请使用\
  \ GNU info 系统：`info accounting`。\n\n***\n\n### 管理密码\n密码是 Linux 安全不可或缺的一部分，也是对用户而言可见度最高的部分。在本节中，你将学习如何为系统建立最小密码策略、密码存储在何处，以及如何为用户管理密码。\n\
  \n#### 系统密码策略\n有效的密码策略是良好的系统管理计划的基础部分。该策略应涵盖以下内容：\n\n• 允许和禁止的密码\n• 强制更改密码的频率\n•\
  \ 丢失或忘记密码的找回或替换\n• 用户对密码的处理\n\n#### 密码文件\n密码文件为 `/etc/passwd`，它是系统上所有用户的数据库文件。每行的格式如下：\n\
  \n`username:password:uid:gid:gecos:homedir:shell`\n\n除了 `gecos` 字段外，其他字段都是自而易见的。该字段用于存储关于用户的杂杂信息，例如用户的全名、办公室地址、办公和家庭电话号码，以及可能的简短文本消息。出于安全和隐私考虑，该字段现在很少使用，但系统管理员应该意识到它的存在，因为\
  \ `gecos` 字段会被 `finger` 和 `mail` 等传统 UNIX 程序使用。因此，它通常被称为*finger 信息字段*。该字段中的数据用逗号分隔；可以使用\
  \ `chfn`（更改 `finger`）命令修改 `gecos` 字段。\n\n注意，`/etc/passwd` 文件中的所有字段都用冒号分隔。如果某个字段没有可用信息，该字段为空，但所有冒号都会保留。\n\
  \n如果密码字段中出现星号（*），则该用户将不允许登录。为什么存在此功能？为了能够方便地禁用用户并在以后（可能）恢复，而无需重新创建。完成此任务传统 UNIX\
  \ 方法是由系统管理员手动编辑此字段。Ubuntu 通过本章前面提到的 `passwd -l` 命令提供了更优雅的方法。\n\n若干服务作为伪用户运行，通常具有\
  \ root 权限。这些就是之前提到的系统或逻辑用户。出于安全考虑，你不希望这些账户用于普通登录，因此将它们的 shell 分配为 `/sbin/nologin`\
  \ 或 `/bin/false`，从而禁止这些账户的任何登录。\n\n`/etc/passwd` 列表显示如下（为了简洁进行了省略）：\n\n```\nmatthew@seymour:~$\
  \ cat /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\nbin:x:2:2:bin:/bin:/bin/sh\n\
  sys:x:3:3:sys:/dev:/bin/sh\ngames:x:5:60:games:/usr/games:/bin/sh\nman:x:6:12:man:/var/cache/man:/bin/sh\n\
  mail:x:8:8:mail:/var/mail:/bin/sh\nnews:x:9:9:news:/var/spool/news:/bin/sh\nuucp:x:10:10:uucp:/var/spool/uucp:/bin/sh\n\
  www-data:x:33:33:www-data:/var/www:/bin/sh\ngnats:x:41:41:Gnats Bug-Reporting System\
  \ (admin):/var/lib/gnats:/bin/sh\nnobody:x:65534:65534:nobody:/nonexistent:/bin/sh\n\
  messagebus:x:102:106::/var/run/dbus:/bin/false\navahi:x:105:111:Avahi mDNS daemon,,,:/var/run/avahi-daemon:/bin/false\n\
  couchdb:x:106:113:CouchDB Administrator,,,:/var/lib/couchdb:/bin/bash\nhaldaemon:x:107:114:Hardware\
  \ abstraction layer,,,:/var/run/hald:/bin/false\nkernoops:x:109:65534:Kernel Oops,,,:/var/run/kernoops:/bin/false\n\
  gdm:x:110:110:Gnome Display,,,:/var/run/gdm:/bin/false\nmatthew:x:1000:1000:Matthew,,,/home/matthew:/bin/bash\n\
  systemd-network:x:120:120:Systemd Network Management,,,/bin/\nlist:x:61:61:list,,,/var/lib/listd:/sbin/nologin\n\
  lp:x:42:42:lp,,,/var/spool/lp:/sbin/nologin\nmail:x:38:38:mail:$6$wtML.v4$.I5WeTp9tgGkIjTVqPrJ4uR5p6T0/VUqY21/Ir70:14564:9999\n\
  backup:x:33:34:backup,,,/var/backup:/sbin/nologin\nuicd:x:39:39:uicd,,,/var/lib/uicd:/sbin/nologin\n\
  irc:x:99:99:irc,,,/var/lib/ircd:/sbin/nologin\nmessage:x:36:36:message,,,/var/lib/messagebus:/sbin/nologin\n\
  list:x:61:61:list,,,/var/lib/listd:/sbin/nologin\nnews:x:45:45:news,,,/var/spool/news:/bin/false\n\
  ```\n\n\n\n\n\n- 最后一个字段是“预留”字段，目前未分配给任何用途。\n\n请注意，Ubuntu 默认禁用了密码过期日期和警告功能。这些功能在家庭系统中并不常用，通常甚至在小型办公室也不使用。如果需要存在密码过期策略，则由系统管理员负责建立并强制执行。\n\
  \n`/etc/shadow` 文件的权限应设置为普通用户无法对其进行写或读取：该文件的权限应设置为 `600`。\n\n***\n\n# 深度解析 PAM\n\
  \n`可插件认证模块（Pluggable Authentication Modules，PAM）` 是一套处理计算机上身份验证任务的库系统。它使用了四个管理组：账户管理、身份验证管理、密码管理和会话管理。这允许系统管理员选择各个应用程序如何验证用户。Ubuntu\
  \ 已经为你预装并预配置了所有必要的 `PAM` 文件。\n\nUbuntu 中的配置文件位于 `/etc/pam.d`。这些文件以它们所控制的服务命名，格式如下：\n\
  \n`type control module-path module-arguments`\n\n`type` 字段是规则所属的管理组。`control` 字段告诉\
  \ `PAM` 在身份验证失败时做什么。最后两项处理所使用的 `module` 及其所需的参数。使用 `PAM` 的程序通常带有 `/etc/pam.d` 目录的配置。为了获得更高的安全性，系统管理员可以默认项。配置错误可能会导致不可预测的结果，因此在修改之前请备份配置文件。Ubuntu\
  \ 提供的默认设置对于家庭和小办公室用户已经足够。\n\n下面显示了一个带有上述格式的 `PAM` 配置文件示例。这是 `/etc/pam.d/gdm` 的内容：\n\
  \n```\n#PAM-1.0\n\nauth    requisite      pam_nologin.so\nauth    required     \
  \   pam_env.so readenv=1\nauth    required        pam_env.so readenv=1 envfile=/etc/default/locale\n\
  auth    sufficient      pam_succeed_if.so user ingroup nopasswd\n@include common-auth\n\
  \nauth    optional        pam_gnome_keyring.so\n@include common-account\n\nsession\
  \ [success=ok ignore=ignore module_unknown=ignore default=bad]\npam_selinux.so open\n\
  \nsession required      pam_limits.so\n@include common-session\n\nsession [success=ok\
  \ ignore=ignore module_unknown=ignore default=bad]\npam_selinux.so close\nsession\
  \ optional      pam_gnome_keyring.so auto_start\n@include common-password\n```\n\
  \n令人的是，即使 `PAM` 文档也指出，为了有效地使用它，你并不需要（也不想）了解关于 `PAM` 的许多内容。你可能只需要系统管理员指南。可以在 [www.kernel.org/pub/libs/pam/Linux-PAM-html/Linux-PAM.html](http://www.kernel.org/pub/libs/pam/Linux-PAM-html/Linux-PAM.html)\
  \ 找到。\n\n***\n\n# 用户密码管理\n\n选择合适的用户密码始终是一个权衡的过程。像 `password` 这样的密码（别笑——它在现实世界中被用得太频繁，且会导致灾难性的后果）对于入侵者来说太容易猜到了。简单的单词或数字组合（例如来自街道地址或出生日期）也是如此。你会惊讶于有多少人使用像\
  \ `123456`、`iloveyou`、`Qwerty` 或 `abc123` 这样容易猜的密码。\n\n相比之下，像 `2a56` 这样的密码无疑会给入侵者（或审计员）带来极大困难。然而，这种密码太难记忆，以至于密码所有者可能会把它写在显示器的便利贴上。\n\
  \n系统管理员通过 `/etc/shadow` 文件中的设置控制密码更改的频率。超级用户可以使用文本编辑器或 `chage` 命令更改这些设置。（详情请参阅 `shadow`\
  \ 和 `chage` 手页。）\n\n#### 批量更改密码\n\n在大型系统中，可能会出现大量用户及其密码需要处理的情况。超级用户可以使用 `chpasswd`\
  \ 命令批量更改密码，该命令接受如下格式的每行一个用户名/密码对输入：\n\n```\nmatthew@seymour:~$ sudo chpasswd username:password\n\
  ```\n\n通过将用户名/密码对列表重定向到命令，可以*批量*更改密码。可以根据第 11 章“命令行大师课”获取的信息构建相应的 shell 脚本。\n\n\
  此外，Ubuntu 还提供了 `newusers` 命令来从文本文件批量添加用户。该命令也允许添加用户。\n\n### 为普通用户授予系统权限\n\n有时，普通用户需要以\
  \ root 身份运行命令。以 root 运行命令有两种方法。第一种方法适用于你是超级用户（启用的 root 账户）和普通用户的所有者；第二种方法适用于你不是普通用户。讨论这些超本章的范围，但为了讨论起见，假设我们正处于其中一种情况。让我们来看每种。\n\
  \n#### 使用 `su` 命令临时切换用户身份\n\n这种情况场景要求存在 root 账户，而 root 账户在 Ubuntu 中默认是不启用的，且 Ubuntu\
  \ 社区通常不推荐这样做。然而，某些情况下这样做是合理的。\n\n如果你作为超级用户拥有启用的 root 账户，但由于正在执行非管理任务而以普通用户身份登录，并且发现你需要做某些只有超级用户才能做的事情怎么办？`su`\
  \ 命令就是为此设计的。\n\n***\n\n### 注意\n\n一个常见的误解是 `su` 命令是 *super user*（超级用户）的缩写——它实际上只是“替换用户”（substitute\
  \ user）。一个重要但经常被忽略的区别是 `su` 和 `su -` 之间。在前者中，你变成了该用户但保留了自己的环境变量（如路径）。在后者中，你继承了该用户的环境。这在你使用\
  \ `su` 变成超级用户 root 时最为明显。如果不附加 `-` 符号，你就不会继承包含 `/bin` 或 `/sbin` 的路径变量，因此当你直接 `su`\
  \ 到 `root` 时，必须始终输入这些命令的完整路径。\n\n不要忘记，在标准的 Ubuntu 系统上，第一个创建的用户被归类为 root，而真正的 root\
  \ 账户是禁用的。要启用 root 账户，你在命令行输入 `sudo passwd` 命令并输入你的密码和新的 root 密码。完成后，你就可以 `su` 到\
  \ root。我们建议在此之前阅读内容，以确保你理解 root 账户默认不启用的原因：[`help.ubuntu.com/community/RootSudo`](https://help.ubuntu.com/community/RootSudo)。\n\
  \n\n\n\n\n`su` 命令会启动一个新的 shell，同时更改现有用户的 `UID` 和 `GID`，并自动更改与该用户相关的环境变量，这被称为*继承环境*。有关环境变量的更多信息，请参阅第\
  \ 4 章。\n\n`su` 命令的语法如下：\n\n```bash\nmatthew@seymour:~$ su option username arguments\n\
  ```\n\n`su` 的 man 帮助页（man page）提供了更多细节，但这里是 `su` 命令的一些亮点：\n\n- `-c, --command COMMAND`:\
  \ 使用 `-c` 将单个 `COMMAND` 传递给 shell。\n- `-m, --preserve-environment`: 不重置环境变量。\n-\
  \ `-l`: 为被替换的用户进行完全的登录模拟，与单独指定一个连字符（dash）的效果相同。\n\n你可以通过不同的方式调用 `su` 命令，产生不同的结果。通过单独使用\
  \ `su`，你可以成为 root 用户，但保留了你的普通用户环境。这可以通过更改前后使用 `printenv` 命令来验证。注意，工作目录（你可以执行 `pwd`\
  \ 命令来打印当前工作目录）并没有改变。通过执行以下命令，你成为 root 并继承 root 的环境：\n\n```bash\nmatthew@seymour:~$\
  \ su –\n```\n\n通过执行以下命令，你成为该用户并继承超级用户的环境——这是一个非常实用的工具。（记住：继承环境源于在命令中使用连字符；如果省略它，你将保留“旧”环境。）要切换到另一个用户，请在命令行上指定不同的用户名：\n\
  \n```bash\nmatthew@seymour:~$ su - other_user\n```\n\n当退出身份并返回你的普通用户身份时，请使用 `exit`\
  \ 命令。例如，当以普通用户登录时：\n\n```bash\nmatthew@seymour:~$ su – root\n```\n\n系统提示输入密码：\n\n\
  ```\nPassword:\n```\n\n当输入正确的密码后，会出现 root 用户的提示符：\n\n```bash\nroot~#\n```\n\n要返回普通用户身份，只需输入以下：\n\
  \n```bash\nroot~# exit\n```\n\n这将带带回普通用户的提示符：\n\n```bash\nmatthew@seymour:~$\n```\n\
  \n如果你需要允许其他用户以 root 权限访问某些命令，必须给他们 root 账户的密码（通常称为 root 密码），以便他们可以使用 `su`；这绝对不是一个安全的解决方案。下一节描述了一种更灵活、安全的方法，允许普通用户执行选定的\
  \ root 任务，这也是 Ubuntu 中共享和使用超级用户权限的首选方法。\n\n### 偶尔授予 root 权限：`sudo` 命令\n\n通常需要委托\
  \ root 在系统上行使的一些权限。对于大型系统来说，这是合理的，因为没有某个人能一直随命执行超级用户功能。问题在于 UNIX 权限带有“全有或全无”的权威性。引入\
  \ `sudo`，这是一种允许分配一个、几个或所有仅限 root 的系统命令的应用程序。\n\n> ### 注意\n> 正如前面所述，`sudo` 命令在 Ubuntu\
  \ 中无处不在，因为它是默认使用的。如果你想进入 root shell，从而避免对每个命令都输入 `sudo`，只需输入 `sudo -i` 来获取 root\
  \ 提示符。要返回普通用户提示符，请输入 `exit` 并按回车。再次强调，这有点危险，因为如果你不留神并忘记退出 root，可能会对系统造成严重破坏。通常最好选择一种方法并坚持使用，Ubuntu\
  \ 社区一直使用并推荐对每个命令使用 `sudo`，即使这很麻烦，因为它是一个很好的提醒，让你思考自己正在做什么。\n\n配置完成后后，使用 `sudo` 非常简单。授权用户只需在需要超级用户权限的命令前加上\
  \ `sudo`，如下所示：\n\n```bash\nmatthew@seymour:~$ sudo command\n```\n\n当输入命令时，`sudo`\
  \ 会检查 `/etc/sudoers` 文件以查看用户是否有权行使超级用户权限；如果是，则 `sudo` 将在一段时间内有效。随后系统会提示用户输入密码（以保持可追溯性并提供某种安全措施），然后该命令就像由\
  \ root 发出的一样运行。在分配的时间内（Ubuntu 中默认为 15 分钟），可以一次或多次再次使用 `sudo` 而需再次输入密码。如果未授权的用户尝试执行\
  \ `sudo` 命令，系统日志将记录该未授权的尝试，并向超级用户发送邮件通知。\n\n有三个 man 帮助页与 `sudo` 相关联：`sudo`、`sudoers`\
  \ 和 `visudo`。第一个涵盖命令本身，第二个涵盖 `/etc/sudoers` 文件的格式，第三个涵盖用于 `/etc/sudoers` 的特殊编辑器。你应该使用这个特殊的编辑命令，因为它会检查文件的解析错误并锁定文件以防止他人同时编辑。`visudo`\
  \ 命令使用 `vi` 编辑器，因此你可能需要快速回顾第 11 章中“与 `vi` 工作”章节下的 `vi` 编辑命令。通过执行以下 `visudo` 命令开始编辑：\n\
  \n```bash\nmatthew@seymour:~$ sudo visudo own\n```\n\n默认的 `/etc/sudoers` 文件如下：\n\
  \n```bash\n# /etc/sudoers\n#\n# 此文件必须用 visudo 进行编辑。\n#\n# 此文件控制用户对命令的访问。\n# 权限规范字段具有以下格式：\n\
  #    user      host=(runas)  command\n#\n# user 是用户或组的名字（以 % 为前缀）。\n# host 是允许用户运行命令的机器。\n\
  # 如果未指定，默认为所有主机。\n# runas 是执行命令的用户账户。\n# 它默认是调用 sudo 的用户。\n# command 是用户允许运行的命令列表。\n\
  #\n# 可以使用别名来定义用户、组、主机和\n# 命令，使 sudoers 文件更具读性。\n# UserAlias\n# HostAlias\n# EnvAlias\n\
  # CmndAlias\n#\n# 可以在这里设置默认值。例如：\n#    Defaults    env_tag=value\n#\n#    Defaults\
  \    env_reset\n#\n#    Defaults\n#    Defaults    root=(ALL:ALL:ALL) ALL\n#\n#\
  \    Defaults:root\n#    envenv_keep=ALL\n```\n\n默认的 `/etc/sudoers` 文件看起来像这样：\n\n\
  ```bash\n# /etc/sudoers\n#\n# 此文件必须用 visudo 进行编辑。\n...（此处省略重复内容以保持逻辑一致性）\n#    Defaults:root\n\
  #    envenv_keep=ALL\n#    root            ALL\n```\n（注：上述文本内容存在截断/乱码；基于上下文）\n\n\
  `sudo` 行的默认格式如下：\n\n```\nuser      host=(runas)  command\n```\n\n`user` 是用户或组的名字（以\
  \ % 为前缀）。`host` 是允许用户运行命令的机器。如果未指定，默认是所有主机。`runas` 是执行命令的用户账户。它默认是调用 sudo 的用户。`command`\
  \ 是用户允许运行的命令列表。\n\n可以使用别名来定义用户、组、主机和命令，使 sudoers 文件更具读性。\nUserAlias\nHostAlias\n\
  EnvAlias\nCmndAlias\n\n可以在这里设置默认值。例如：\n    Defaults    env_tag=value\n\n    Defaults\
  \    env_reset\n\n    Defaults\n    Defaults    root=(ALL:ALL:ALL) ALL\n\n    Defaults:root\n\
  \    envenv_keep=ALL\n\n    root            ALL\n```\n\n`host_computer` 可以用 `ALL`\
  \ 表示所有主机，用 `localhost` 表示本地机器。`sudoers` 行中的 `command` 可以是 `ALL`、特定命令列表，或者是以 `!`\
  \ 开头的特定命令限制。再次，`sudoers` man 帮助页提供了细节，但这里有几个例子：\n\n如果我们添加\n\n```\n%wheel (ALL) NOPASSWD:\
  \ ALL\n```\n\n任何添加到 `wheel` 组的用户都可以无密码执行任何命令。\n\n假设我们想允许用户 `john` 跨网络通过图形界面添加用户。我们将添加以下行：\n\
  \n```\njohn ALL=/users-admin\n```\n\n或者我们可能只想在其本地计算机授予权限：\n\n```\njohn 192.168.1.87=/usr/bin/users-admin\n\
  ```\n\n如果我们想允许编辑器组在系统范围内无密码地删除文件，我们使用：\n\n```\n%editors ALL=NOPASSWD: /bin/rm\n\
  ```\n\n如果我们想允许所有用户在 `localhost` 上无密码地挂载光驱，操作如下：\n\n```\nALL localhost=NOPASSWD:/sbin/mount\
  \ /dev/scd0 /mnt/cdrom /sbin/umount /mnt/cdrom\n```\n\n在构建 `sudoers` 文件时也可以使用通配符。也可以使用别名，方便定义用户和组。`sudoers`\
  \ man 帮助页包含了一些示例，而 [www.komar.org/pres/sudo/toc.html](http://www.komar.org/pres/sudo/toc.html)\
  \ 提供了关于大公司使用 `sudo` 的说明和注释。\n\n以下命令向用户展示其有权使用的命令列表：\n\n```bash\nmatthew@seymour:~$\
  \ sudo –l\n```\n\n* * *\n\n添加额外的 sudo 用户\n\n\n\n\n如前所述，Ubuntu 默认通过 `sudo` 命令赋予第一个创建的用户完全\
  \ root 权限。如果你需要为其他用户添加此功能，可以通过将每个用户添加到 `admin` 组来轻松实现，或者使用用户管理器（User Manager）工具允许他们管理系统，你可以在编辑用户属性时在“用户权限”选项卡中找到该选项。\n\
  \n* * *\n\n### 磁盘配额 (Disk Quotas)\n\n在拥有许多用户的大型系统中，你通常需要控制用户可以使用的磁盘空间量。磁盘配额专门为此目的而设计。配额按分区管理，可以为单个用户设置，也可以为组设置；组配额不需要与组内个人配额的总和一样大。\n\
  \n当创建文件时，用户和组都拥有这些文件；文件的所有权始终是文件元数据的一部分。这使得基于用户和组的配额易于管理。\n\n* * *\n\n### 注意事项\n\
  \n磁盘配额管理在家庭系统中并不真正有用，也没有必要，在小型办公室系统中也很少见。在这两种情况下，你都不可能看到或实现这一功能。\n\n* * *\n\n要管理磁盘配额，你必须在系统中安装\
  \ `quota` 和 `quotatool` 包。Ubuntu 的配额管理默认未启用，传统上一直由系统管理员手动启用和配置。系统管理员使用配额命令族，例如使用\
  \ `quotacheck` 初始化配额数据库文件，使用 `edquota` 设置和编辑用户配额，使用 `setquota` 配置磁盘配额，以及使用 `quotaon`\
  \ 或 `quotaoff` 控制服务。（其他实用程序还包括 `warnquota`，用于自动向超过磁盘空间使用限制的用户发送邮件。）\n\n### 实现配额\n\
  \n即使在你的 Ubuntu 系统上安装了配额软件包，配额默认也是禁用的。当安装并启用配额后，你可以通过查看 `/etc/fstab` 文件的第四字段来查看哪些分区启用了用户配额、组配额或两者都启用。例如，`/etc/fstab`\
  \ 中的其中一行显示 `/home` 分区已启用了配额：\n\n```\n/dev/hda5      /home      ext3         defaults,usrquota,grpquota\
  \ 1 1\n```\n\n启用了配额的分区根目录下将包含 `quota.user` 或 `quota.group` 文件（如果都启用了两种类型的配额，则两个文件都包含），这些文件包含实际的配额。这些文件的权限应为\
  \ `600`，以便用户无法读取或写入它们。（否则，用户会更改它们以为他们的音乐文件和艺术收藏留出大量空间。）要初始化磁盘配额，必须重新挂载分区。通过以下命令可以轻松完成：\n\
  \n```\nmatthew@seymour:~$ sudo mount -o ro,remount partition_to_be_remounted mount_point\n\
  ```\n\n底层的控制台工具（带有 man 页）如下：\n\n• `quotaon`, `quotaoff`—切换分区配额的开启或关闭。\n• `repquota`—关于用户和组的摘要状态报告。\n\
  • `quotacheck`—更新配额状态（比较新旧磁盘使用表）；在 `fsck` 之后运行。\n• `edquota`—一个基础的配额管理命令。\n\n####\
  \ 手动配置配额\n\n手动配置配额涉及更改系统文件系统表 `/etc/fstab` 中的条目，以便为文件系统的指定部分添加 `usrquota` 挂载选项。作为一个简单文件系统的示例，可以这样启用配额管理：\n\
  \n```\nLABEL=/             /             ext3    defaults,usrquota       1 1\n```\n\
  \n也可以通过 `grpquota` 选项启用组级配额。作为 root 操作员，你必须在文件系统的指定部分（使用我们创建用户配额的示例）创建一个名为 `quota.user`\
  \ 的文件，如下：\n\n```\nmatthew@seymour:~$ sudo touch /quota.user\n```\n\n然后你应该使用 `quotaon`\
  \ 命令开启配额使用：\n\n```\nmatthew@seymour:~$ sudo quotaon –av\n```\n\n然后你可以使用 `edquota`\
  \ 命令编辑用户配额，以设置文件系统使用的硬限制和软限制。在编辑用户配额时，会启动默认系统编辑器（除非更改了 `EDITOR` 环境变量，否则为 `vi`）。\n\
  \n任何用户都可以通过以下命令查询自己的配额情况：\n\n```\nmatthew@seymour:~$ quota –v\n```\n\n* * *\n\n\
  ### 注意事项\n\nUbuntu 不支持任何允许你配置磁盘配额的图形化工具。配额可以在 [www.tldp.org/HOWTO/Quota.html](http://www.tldp.org/HOWTO/Quota.html)\
  \ 找到 Quota mini-HOWTO。\n\n* * *\n\n#### 相关的 Ubuntu 命令\n\n你使用这些命令来管理 Ubuntu 中的用户账户：\n\
  \n• `ac`—用户账户统计命令。\n• `change`—设置或修改用户密码过期策略。\n• `chfn`—创建或修改 `/etc/passwd` 中的用户指\
  \ 信息。\n• `chgrp`—修改组组成。\n• `chmod`—更改文件权限。\n• `chown`—更改文件所有权。\n• `chpasswd`—批量修改用户密码的命令。\n\
  • `chsh`—修改用户的 shell。\n• `groups`—显示现组组成。\n• `logname`—显示用户的登录名。\n• `newusers`—批量用户管理命令。\n\
  • `passwd`—创建或修改用户密码。\n• `su`—以另一个用户执行 shell 或命令。\n• `sudo`—管理特定的执行权限。\n• `useradd`—创建、修改或管理用户。\n\
  • `usermod`—编辑用户的登录配置文件。\n\n#### 参考文献\n\n• [`tldp.org/HOWTO/User-Authentication-HOWTO/`](http://tldp.org/HOWTO/User-Authentication-HOWTO/)—User-Authentication\
  \ HOWTO 描述了如何存储和使用用户及组信息。\n• [`tldp.org/HOWTO/Shadow-Password-HOWTO.html`](http://tldp.org/HOWTO/Shadow-Password-HOWTO.html)—Shadow-Password\
  \ HOWTO 深入探讨了影子密码的细节，甚至讨论了为什么你可能不想使用它们。\n• [`tldp.org/HOWTO/Security-HOWTO/`](http://tldp.org/HOWTO/Security-HOWTO/)—必读的\
  \ HOWTO，Security HOWTO 提供了良好的安全概述。与本章特别适用于关于创建账户、文件权限和密码安全的章节。\n• [`tldp.org/LDP/sag/html.html`](http://tldp.org/LDP/sag/html.html)—通用的指南，Linux\
  \ 系统管理员安全指南中有关于限制和监控用户的有趣章节。\n\n\n\n\n在 Ubuntu 中有三种调度命令的方法，它们的工作原理各不相同。第一种是 `at`\
  \ 命令，它可以指定在今天之后的特定日期时间运行命令。第二种是 `batch` 命令，它实际上是一个脚本，会将你重定向到 `at` 命令并设置一些额外的选项，以便你的命令在系统空闲时运行。最后一个选项是\
  \ `cron` 守护进程，它是 Linux 在给定时间执行任务的方式。\n\n### 使用 `at` 和 `batch` 调度以后的任务\n\n如果你有一个耗时较长的任务想要运行，但不想在登录状态下执行它，可以使用\
  \ `at` 命令告诉 Ubuntu 稍后运行。要使用 `at`，你需要告诉它你想运行的时间，然后按回车。随后，你将看到一个以 `at>` 开头的新提示符，你在那里输入直到按下\
  \ `Ctrl+D` 之前的所有内容都将是你让 `at` 执行的命令。\n\n当指定的时间到达时，`at` 会逐个按顺序执行每个操作，这意味着后面的命令可以依赖先前的命令的结果。在接下来的示例中，`at`\
  \ 将在下午 5 点后不久运行，在网络应该空闲的时候下载并提取最新的 Linux 内核：\n\n```bash\nmatthew@seymour:~$ at now\
  \ + 7 hours\nat> wget http://www.kernel.org/pub/linux/kernel/v3.0/linux-3.0.tar.bz2\n\
  at> tar xvfjp linux-3.0.tar.bz2\nat> <EOT>\n\njob 2 at 2011-07-08 20:01\n```\n\n\
  指定 `now + 7 hours` 为时间的结果正如你预期：`at` 在晚上 8 点运行，因此该命令将在明天凌晨 3 点后不久运行。\n\n如果你有一个更复杂的任务，可以使用\
  \ `-f` 参数让 `at` 从文件中读取命令，如下所示：\n\n```bash\necho wget http://www.kernel.org/pub/linux/kernel/v3.0/linux-3.00.tar.bz2\\\
  ;\ntar xvfjp linux-3.0.tar.bz2 > myjob.job\nat -f myjob.job tomorrow\n```\n\n如你所见，`at`\
  \ 对它接受的时间格式非常灵活；你可以通过三种方式指定时间：\n\n- 使用 `now` 参数，你可以指定相对于当前时间的几分钟、小时、天或周。例如，`now\
  \ + 4 weeks` 将在今天 1 个月后运行命令。\n- 你还可以指定几个特殊时间，包括 `tomorrow`（明天）、`midnight`（午夜）、`noon`（中午）或\
  \ `teatime`（下午 4 点）。如果你没有为 `tomorrow` 指定具体时间，你的任务将被设置为从当前时间起精确 24 小时后。\n- 你可以使用\
  \ `HH:MM MM/DD/YY` 格式指定精确的日期时间（例如，`16:40 22/12/12` 表示 2012 年 12 月 22 日的下午 4:40）。\n\
  \n当你提交任务时，`at` 会报告任务编号、执行日期和时间；队列标识符以及任务所有者（你）。它还会捕捉你所有的环境变量并将它们与任务一起存储，这样当你的任务运行时，它可以恢复这些变量，从而保留你的执行环境。\n\
  \n任务编号和任务队列标识符都很重要。当你使用 `at` 调度任务时，它默认被放入队列 \"a\" 中，这意味着它将在你指定的时间运行，并占用正常的资源。\n\n\
  另一个可选命令是 `batch`，它实际上只是一个带有几个额外选项并调用 `at` 的 shell 脚本。这些选项（如果你感兴趣，则是 `-q b -m now`）设置\
  \ `at` 在队列 b (`-q b`) 上运行，在完成后向用户发送邮件 (`-m`)，并立即运行 (`now`)。队列部分是至关重要的：调度在队列 b 上的任务只有在系统负载低于\
  \ 0.8 时才会执行——也就是说，当系统没有满负荷运行时。此外，它以较低的 niceness 值（优先级）运行，这意味着队列任务的 niceness 值通常为\
  \ 2，而 b 队列任务的 niceness 为 4。\n\n由于 `batch` 始终将 `now` 指定为时间，因此你不需要指定自己的时间；它会在系统空闲时立即运行。默认\
  \ niceness 为 4 意味着批处理命令获取的系统资源比队列任务（`at` 的默认值）少，也比大多数其他程序少。你可以选择性地使用 `at` 指定其他队列。队列\
  \ c 以 niceness 为 6 运行，队列 d 以 niceness 为 8 运行，依此类推。但重要的是，系统负载只在命令运行之前检查。如果负载低于 0.8，你的批处理任务将运行。如果系统负载随后升高超过\
  \ 0.8，你的批处理任务将继续运行，得益于它的 niceness 值，它会在后台运行。\n\n当你提交任务执行时，也会返回一个任务编号。如果你忘记了这个编号，或者只想查看你调度以后运行的任务列表，使用不带参数的\
  \ `atq` 命令。如果你以普通用户身份运行，它只打印你的任务；以超级用户身份运行将打印所有人的任务。输出格式与提交任务时相同，你可以获得每个任务的 ID 号、执行时间、队列\
  \ ID 和所有者。\n\n如果你想删除任务，请使用 `atrm` 命令加上要删除的任务 ID。接下来的示例展示了如何使用 `atq` 和 `atrm` 列出任务并删除其中一个：\n\
  \n```bash\nmatthew@seymour:~$ atq\n14      2012-01-20 23:33 a matthew\n16      2012-02-03\
  \ 22:34 a matthew\n17      2012-01-25 22:34 a matthew\n15      2012-01-22 04:34\
  \ a matthew\n18      2012-01-22 01:35 b matthew\n\nmatthew@seymour:~$ atrm 16\n\
  matthew@seymour:~$ atq\n14      2012-01-20 23:33 a matthew\n17      2012-01-25 22:34\
  \ a matthew\n15      2012-01-22 04:34 a matthew\n18      2012-01-22 01:35 b matthew\n\
  ```\n\n### 使用 `cron` 循环运行\n\n如果你只想在以后某个日期执行单个任务，`at` 和 `batch` 命令很好用，但如果你想频繁运行任务，它们就那么好了。相反，`cron`\
  \ 守护进程是为了根据系统（和用户）请求循环执行任务而存在的。`cron` 守护进程的权限系统与 `at` 类似：列在 `cron.deny` 文件中的用户不允许使用\
  \ `cron`，列在 `cron.allow` 文件中的用户允许。空的 `cron.deny` 文件（默认）意味着都可以设置任务。空的 `cron.allow`\
  \ 文件意味着除了 root 之外无人可以设置任务。\n\n任务有两种类型：系统任务和用户任务。只有 root 可以编辑*系统*任务，而任何出现在 `cron.allow`\
  \ 或未出现在 `cron.deny` 中的用户都可以运行*用户*任务。系统任务通过 `/etc/crontab` 文件控制，其默认内容如下：\n\n```cron\n\
  SHELL=/bin/sh\nPATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin\n\
  \n# m h dom mon dow user  command\n17 *     * * *   root   cd / && run-parts --report\
  \ /etc/cron.hourly\n25 6     * * *   root   test -x /usr/sbin/anacron || ( cd /\
  \ && run-parts --report /etc/cron.daily )\n47 6     * * 7   root   test -x /usr/sbin/anacron\
  \ || ( cd / && run-parts --report /etc/cron.weekly )\n52 6     1 * *   root   test\
  \ -x /usr/sbin/anacron || ( cd / && run-parts --report /etc/cron.monthly )\n```\n\
  \n\n\n\n前两行指定了使用哪个 shell 来执行任务（默认使用拥有 `crontab` 文件的用户的 shell，通常为 `/bin/bash`），以及将要使用的可执行文件的搜索路径。重要的一点是，要避免在此路径语句中使用环境变量，因为在任务运行时，这些变量可能尚未设置。\n\
  \n下一行以井号（`#`）开头，因此被视为注释并忽略。接下来的四行是重要部分：它们是任务本身。\n\n每个任务由七个字段指定，定义了运行时间、所有者和命令。前五个字段以一种非常奇特的顺序指定执行时间：分钟（0–59）、小时（0–23）、每月几（1–31）、月份（1–12）以及星期几（0–7）。对于星期，0\
  \ 和 7 都是周日，这意味着 1 是周一，3 是周三，以此此类推。如果你想指定“所有值”（即每分钟、每小时、每天等），请使用星号 `*.`。\n\n下一个字段指定了任务所有者的用户名。当任务执行时，它将使用此处指定的用户名。最后一个字段是待执行的命令。\n\
  \n因此，第一个任务会在每月每每天的每小时的第 17 分运行，并执行命令 `run-parts /etc/cron.hourly`。`run-parts` 命令是一个简单的脚本，用于运行指定目录（在本例中为\
  \ `/etc/cron.hourly`）中的所有程序。因此，在这种情况下，任务将在 00:17（午夜 17 分）、01:17、02:17、03:17 等执行，并使用\
  \ `cron.hourly` 目录中列出的所有程序。\n\n下一个任务会在每月每每天的第 6 点第 25 分运行，执行 `run-parts /etc/cron.daily`。由于小时的限制，该脚本每天运行一次，即早上\
  \ 6:25。注意，它使用的是第 25 分而不是第 17 分，以防止每日任务与每小时任务冲突。你只需通过观察它们运行的命令，就能猜出接下来两个任务的作用。\n\n\
  在上述四个目录（`cron.hourly`、`cron.daily`、`cron.weekly` 和 `cron.monthly`）中的，都包含了一组由 `run-parts`\
  \ 执行的 shell 脚本。例如，在 `cron.daily` 中，你会看到像 `logrotate`（处理日志文件备份）和 `makewhatis`（更新\
  \ `whatis` 数据库）之类的脚本。如果你愿意，可以将其他系统任务添加到这些目录中，但务必确保你的脚本是正确的。\n\n### 注意\n\n`cron`\
  \ 守护进程每分钟读取所有系统 `crontab` 文件和所有用户 `crontab` 文件一次（在分钟整时；即 6:00:00、6:01:00 等）以检查是否有更改。然而，它发现的任何新任务在至少过去\
  \ 1 分钟后才会被执行。\n\n例如，如果现在是 6:01:49（即早上 6 点过 1 分钟再过 49 秒），而你设置了一个 `cron` 任务在 6:02\
  \ 运行，它将不会执行。在 6:02，`cron` 守护进程将重新读取配置文件并看到新任务，但它还无法执行它。如果你将任务设定为每天早上 6:02 运行，它将在第二天早晨以及随后的每个早晨执行。\n\
  \n删除任务时也存在相同的情况。如果现在是 6:01:49，而你有一个计划在 6:02 运行的任务，删除它不会产生任何影响：`cron` 会在重新读取 `crontab`\
  \ 文件检查更改之前运行它。然而，在它重新读取 `crontab` 文件并注意到该任务不存在后，它在随后的日子里将不再执行。\n\n指定日期还有其他方法。例如，你可以通过连字符或逗号使用一组日期和时间，例如小时\
  \ 9–15 会 9, 10, 11, 12, 13, 14 和 15 点执行（从早上 9 点到下午 3 点），而 9, 11, 13, 15 则会错过偶数小时。注意，重要的是不要在这些集合中加入空格，因为\
  \ `cron` 守护进程会将其解释为下一个字段。你可以使用斜杠（`/`）定义步长值表示时间划分：小时的 `*/4` 表示“全天每 4 小时一次”，而 `0-12/3`\
  \ 表示“从午夜到中午每 3 小时一次”。你还可以使用三个字母的缩写来指定日期和月份名称，而不是数字：星期使用 Sun, Mon, Tue, Fri, Sat；月份使用\
  \ Jan, Feb, Mar, Oct, Nov, Dec。\n\n除了系统任务外，还有针对拥有正确权限的用户的用户任务。用户任务存储在 `/var/spool/cron`\
  \ 目录中，每个用户都有一个以其用户名命名的文件（例如 `/var/spool/cron/philip` 或 `/var/spool/cron/root`）。这些文件的内容包含了任务。\n\
  \n\n\n\n# 简介\n\n对 shell 命令行能力有基本的了解可以帮助你编写更好的 shell 脚本。如果你在读完这段简短介绍后想学习更多关于命令行的知识，请查看第\
  \ 11 章，“命令行大师](#ch11.html_ch11)”。你可以使用 shell 命令行执行许多不同的任务，包括以下：\n\n• 使用模式匹配或表达式的程序搜索文件或目录。这些命令包括\
  \ GNU `gawk`（链接为 `awk`）和 `grep` 系列命令，包括 `egrep` 和 `fgrep`。\n\n• 从文件或命令获取数据并向其发送数据，这被称为\
  \ `input` 和 `output` 重定向。\n\n• 将程序的输出馈送或过滤到另一个命令（通过`pipes` 管道调用）。\n\nshell 还可以拥有内置\
  \ `job-control` 命令，可以将命令行作为后台进程启动、挂起运行中的程序、选择性地检索或杀死正在运行或挂起的程序，并执行其他类型的进程控制。\n\n\
  可以使用分号分隔命令，在单条命令行上运行多个命令：\n\n```\nmatthew@seymour:~$ w ; free ; df\n\n18:14:13 up\
  \  4:35,  2 users,  load average: 0.97, 0.99, 1.04\n\nUSER     TTY      FROM   \
  \               LOGIN@   IDLE   JCPU  PCPU WHAT\nmatthew     tty7     :0       \
  \        13:39    4:35m 24:34   0.32s gnome-session\nmatthew     pts/0   :0.0  \
  \             17:24   0.00s  1.19s  4.98s gnome-terminal\n\n             total \
  \    used      free    shared    buffers  cached\nMem:       4055692     1801104\
  \   2254588           0     134096    757532\n-/+ buffers/cache:     909476    \
  \ 3146216\n\nSwap:      8787512           0    8787512\n\nFilesystem           1K-blocks\
  \     Used Available Use% Mounted on\n/dev/sda1          14421344     6509276  \
  \   7179508  48% /\nnone               2020136       336     2019800   1% /dev\n\
  none               2027844       3004     2024840   1% /dev/shm\nnone          \
  \     2027844       224     2027620   1% /var/run\nnone               2027844  \
  \         0     2027844   0% /var/lock\nnone               2027844           0 \
  \    2027844   0% /lib/init/rw\n/dev/sda6          284593052 144336704 125799860\n\
  ```\n\n\n\n\n\n在本示例中，shell 会不断向你正在输入的 `cat` 命令提供输入（input），直到识别出模式 `DONE` 为止。随后，输出文件\
  \ `simple_script` 被保存，并对其内容进行验证。这种技术也可以用于脚本，以根据各种命令的输出创建内容，并定义输入结束符或分隔符。\n\n###\
  \ 管道数据传输\n\n许多 Linux 命令可以在单个连接的命令行中协同工作，以将数据从一种形式转换为另一种形式。以这种方式将 Linux 命令串联在一起被称为使用或创建\
  \ `pipes`（管道）。管道在命令行中通过管道操作符（`|`）创建。例如，可以使用管道从单条命令行中执行复杂的任务，如下所示：\n\n```bash\nmatthew@seymour:~$\
  \ find /d2 -name '*.txt' -print | xargs cat | \\\ntr ' ' '\\n' | sort | uniq >output.txt\n\
  ```\n\n此示例获取 `find` 命令的输出，通过 `xargs` 向 `cat` 命令提供 `/d2` 目录下所有文本文件的文件名称。然后，所有匹配文件的内容将通过\
  \ `tr` 命令处理，将数据流中的每个空格转换为回车符。接着，对单词流进行排序，并使用 `uniq` 命令删除相邻的相同行。输出结果是一个原始单词列表，随后保存到名为\
  \ `output.txt` 的文件中。\n\n### 后台处理\n\nshell 允许你通过在命令行末尾使用波浪号（`&`）启动一个命令并将其作为进程在后台运行。这种技术通常用于\
  \ X 终端窗口的命令行，以启动客户端并返回命令行。例如，使用 `xterm` 客户端启动另一个终端窗口，可以使用以下命令：\n\n```bash\nmatthew@seymour:~$\
  \ xterm &\n[3] 1437\n```\n\n回显的数字显示了一个数字（在本例中为 3），这是一个 `job`（作业）编号或 shell 进程引用编号，以及一个\
  \ `process ID`（进程 ID）或 PID（在本例中为 1437）。可以使用 shell 内置的 `kill` 命令配合作业号杀死 `xterm` 窗口会话，如下：\n\
  \n```bash\nmatthew@seymour:~$ kill %3\n```\n\n或者可以使用 `kill` 命令配合 PID 杀死进程，如下：\n\n\
  ```bash\nmatthew@seymour:~$ kill 1437\n```\n\n后台处理可以用于 shell 脚本启动耗时较长的命令，例如备份：\n\
  \n```bash\nmatthew@seymour:~$ tar -czf /backup/home.tgz /home &\n```\n\n### 编写和执行\
  \ shell 脚本\n\n为什么要编写和使用 shell 脚本？shell 脚本可以节省时间和打字量，特别是当你每天多次使用相同的命令行时。虽然你可以使用历史功能（在使用\
  \ `bash` 时按向上或向下方向键，或使用 `history` 命令），但 shell 脚本可以通过命令行参数替换和内置帮助增加灵活性。\n\n尽管 shell\
  \ 脚本的执行速度不会比 C 等计算机语言编写的程序快，但 shell 程序可能比编译后的程序更小。shell 程序除了 shell 本身或系统中安装的现有命令外不需要任何额外的库支持。创建和测试\
  \ shell 脚本的过程通常比开发等功能的 C 语言命令更简单更快速。\n\n***\n\n#### 注意\n\nUbuntu 包含的数百个命令实际上都是 shell\
  \ 脚本，互联网上还有许多其他优秀的 shell 脚本示例——快速搜索即可获得来自来自 Linux 用户和开发者的在线教程和脚本指南链接。例如，用于从文本控制台启动\
  \ X Window 会话的 `startx` 命令是大多数用户每天使用的 shell 脚本。要学习更多关于使用 `bash` 编写脚本，请参见本章最后“参考”部分列出的“高级\
  \ Bash 脚本指南”。你还会发现 *Sams Teach Yourself Shell Programming in 24 Hours* 是一本学习更多如何使用\
  \ shell 构建自定义命令的有用指南。\n\n***\n\n当你学习编写和执行第一批 shell 脚本时，请从简单但实用的任务脚本开始。从短示例开始，随着你经验和知识的增长不断扩展脚本。大量使用注释（以井号\
  \ `#` 开头的行）来记录你脚本的每个部分。包含作者声明和脚本概述作为额外帮助，并附上创建日期或版本号。使用 `vi` 等文本编辑器编写 shell 脚本，因为它不会自动换行。换行可能会破坏脚本语法并导致问题。如果你使用\
  \ `nano` 编辑器，请包含 `-w` 标志以禁用自动换行。\n\n在本节中，你将学习如何编写一个简单的 shell 脚本，以便每次登录时设置若干 `aliases`（命令别名）。你不需要每次登录都输入所有别名，可以使用文本编辑器（如\
  \ `vi`）将它们放入文件中，然后执行该文件。通常这些更改保存在 `/etc` 目录下的系统级 shell 配置文件中以便对所有用户生效，或者存在主目录下的\
  \ `.bashrc`、`.cshrc`（如果你使用 `tcsh`）或 `.bash_profile` 文件中。\n\n以下是 `myenv` 的内容，这是一个为此目的创建的示例\
  \ shell 脚本（用于 `bash`）：\n\n```bash\n#!/bin/sh\nalias ll='ls -L'\nalias ldir='ls -aF'\n\
  alias copy='cp'\n```\n\n此创建了别名，或命令同义词，用于 `ls` 和 `cp` 命令的简写。`ll` 别名提供了详细目录列表：`ldir`\
  \ 别名是 `ls` 命令但打印指示符（针对目录）。`copy` 别名与 `cp` 命令相同。你可以尝试并添加常用的选项。\n\n你可以通过多种方式执行 `myenv`。如示例所示，你可以通过\
  \ `chmod` 命令使 `myenv` 可执行：\n\n```bash\nmatthew@seymour:~$ ls -l myenv\n-rwxr-xr-x\
  \ 1 matthew matthew 2010-07-08 19 myenv\n```\n\n#### 运行新 shell 程序\n\n你可以通过多种方式运行新\
  \ shell 程序。每种方法的结果都相同，这证明了在 Linux 中使用 shell 的灵活性。一种方法是从命令行像执行 Linux 命令一样执行文件 `myenv`：\n\
  \n```bash\nmatthew@seymour:~$ ./myenv\n```\n\n使用特定 shell（如 `pdksh`）执行 `myenv` 的第二种方法如下：\n\
  \n```bash\nmatthew@seymour:~$ pdksh my```\n```文件名 `myenv` 作为参数传递给文件。第三种方法需要在主目录下创建一个名为\
  \ `bin` 的目录，然后将新 shell 程序拷贝到该目录。然后你无需指定特定位置或使用 shell 即可运行程序。操作如下：\n\n```bash\nmatthew@seymour:~$\
  \ mkdir bin\nmatthew@seymour:~$ mv myenv bin\n```\n\n这种这样做是因为 Ubuntu 默认将执行路径 `$HOME/bin`\
  \ 包含在 shell 环境中。你可以通过将 `env` 命令的输出通过管道传递给 `fgrep` 来查看名为 `PATH` 的环境变量：\n\n```bash\n\
  matthew@seymour:~$ env | fgrep PATH\n/usr/kerberos/bin:/usr/local/bin:/usr/bin:/bin:/usr/X11R6/bin:/sbin:/home/matthew/bin\n\
  ```\n\n\n\n\n永远不要在 `$PATH` 中包含 `.` 来执行当前目录下的文件或命令——这会带来严重的安全风险，特别是对于 root 操作员而言，如果\
  \ `.` 位于你 `$PATH` 搜索顺序的最前端，则更为如此。破解者放在 `/tmp` 等目录下的木马脚本可能被恶意利用，如果当前工作目录属于你的 `$PATH`，它们将被立即执行。\n\
  \n## 存储系统范围使用的 Shell 脚本\n\n执行命令 `myenv` 后，你应该能够从命令行使用 `ldir` 获取当前目录下的文件列表，并使用 `ll`\
  \ 获取显示属性的文件列表。然而，使用 `myenv` 中新命令的最佳方法是将它们放入 shell 的登录或配置文件（profile）中。对于 Ubuntu 以及几乎所有的\
  \ Linux 用户来说，默认 shell 是 `bash`，因此你可以通过将这些命令放入 `/etc/bashrc` 文件，让系统上的所有人都能这些命令。`tcsh`\
  \ 的系统范围别名包含在 `/etc/profile.d` 目录下扩展名为 `.csh` 的文件中。`pdksh` shell 也可以使用这些命令别名。\n\n\
  ## 注意\n\n登录后要使用 `bash` 以外的 shell，请从命令行使用 `chsh` 命令或在 X 会话期间 `system-config-users`\
  \ 客户端。系统会要求输入密码（如果使用 `system-config-users` 则输入 root 密码）以及新 shell 的位置和名称（参见表 13.1）。新\
  \ shell 将成为你的默认 shell，前提是它的名称位于 `/etc/shells` 可接受系统 shell 列表中。\n\n## 通过特定的 shell\
  \ 解释 Shell 脚本\n\n大多数 shell 脚本开头使用 *shebang 行*（`#!`）来控制运行脚本使用的 shell 类型；此行会调用名为 `bash`\
  \ 的 `sh` 指令：\n\n```\n#!/bin/sh\n```\n\nshebang 行（是“sharp”和“bang”的缩写，即 `#` 和 `!`\
  \ 的两种名称）告诉 Linux 内核使用某个特定的命令（一个 shell，或者在其他脚本中可能是 `awk` 或 Perl）来解释文件的内容。使用 shebang\
  \ 行是所有 shell 脚本的通用做法。例如，如果你使用 `bash` 编写一个 shell 脚本，但希望脚本的执行方式就像是由 Bourne shell `sh`\
  \ 运行一样，那么脚本的第一行将包含 `#!/bin/sh`，这是指向 `bash` shell 的链接。将 `bash` 作为 `sh` 运行会导致 `bash`\
  \ 表现得像 Bourne shell。这就是指向 `bash` 的符号链接 `sh` 的原因。\n\n## Shebang 行\n\nshebang 行是一个魔数，定义在\
  \ `/usr/share/magic` 中——这是 Linux `file` 命令用于识别魔数的文本数据库。许多不同的 Linux 命令都使用魔数来快速识别文件类型，其数据库格式记录在名为\
  \ `magic` 的手册页第五部分中（通过 `man 5 magic` 读取）。例如，Linux `file` 命令可以使用魔数来显示脚本的身份（无论使用什么文件名），显示为使用特定\
  \ shell 或 `awk`、Perl 等解释器运行 shell 脚本。\n\n你还可能通过不同的 shell 发现你的脚本可以使用不同或新的环境变量。例如，如果你从\
  \ `bash` 命令行启动 `csh`，你会发现几个新变量或定义略有不同的变量，如下：\n\n```\nmatthew@seymour:~$ env\n...\n\
  VENDOR=intel\nMACHTYPE=i386\nHOSTTYPE=i386-linux\nHOST=thinkpad.home.org\n```\n\n\
  另一方面，bash 可能会提供这些变量或同名但定义略有不同的变量，如下：\n\n```bash\n$ env\n...\nHOSTTYPE=i386\nHOSTNAME=thinkpad.home.org\n\
  ```\n\n尽管 shebang 行的行为没有 POSIX 定义，但在编写 shell 脚本时，其使用的变体可能证明很有帮助。例如，如 `wish` 手册页所述，你可以使用一个\
  \ shell 来帮助执行 shell 脚本内部调用的程序，而无需硬编码程序的路径名。`wish` 命令是一个窗口 *工具控制语言*（`tcl`）解释器，可用于编写图形化客户端。避免使用程序的特定路径名可以增加\
  \ shell 脚本的可移植性，因为并不是每个 UNIX 或 Linux 系统在相同位置都拥有同的程序。\n\n例如，如果你想使用 `wish` 命令，你的第一直觉可能是写成这样：\n\
  \n```bash\n#!/usr/local/bin/wish\n```\n\n虽然这在许多其他操作系统上可以运行，但脚本在 Linux 下会失败，因为 `wish`\
  \ 位于 `/usr/bin` 目录下。然而，如果你这样写命令行：\n\n```bash\n#!/bin/sh\nexec wish \"$@\"\n```\n\
  \n你就可以使用 `wish` 命令（可以作为二进制文件或 shell 脚本本身）。\n\n## 在 Shell 脚本中使用变量\n\n在为 Linux 编写\
  \ shell 脚本时，你会处理三种类型的变量：\n\n- **环境变量**：系统环境的一部分，你可以在 shell 程序中使用它们。可以定义新变量，并且某些变量（如\
  \ `PATH`）可以在 shell 程序中进行修改。\n- **内置变量**：Linux 提供的变量，例如命令行上使用的选项（被 shell 解释为*位置参数*）。与环境变量不同，你无法修改它们。\n\
  - **用户变量**：在脚本内部定义的变量，但在脚本外部不可用。\n\nshell 编程与其他语言的一个主要区别在于，变量是*不类型类型*的——即你不需要指定变量是数字还是字符串，等等。\n\
  \n## 给变量赋值\n\n假设你想使用名为 `lcount` 的变量来计数循环次数。你可以如下所示声明并初始化该变量：\n\n> **注意**\n> 在 `pdksh`\
  \ 和 `bash` 中，你必须确保等号（`=`）前后没有空格。\n\n要在变量中存储字符串，可以使用如下形式：\n\n```bash\nvar=string\n\
  ```\n\n如果字符串包含空格，可以使用前述形式：\n\n```bash\nvar=\"string with spaces\"\n```\n\n## 访问变量值\n\
  \n你可以通过在变量名前加上美元符号（`$`）来访问变量的值。也就是说，如果变量名为 `var`，你可以通过 `$var` 访问它。\n\n如果你想将 `var`\
  \ 的值赋值给变量 `lcount`，可以这样做：\n\n```bash\nlcount=$var\n```\n\n### 位置参数\n\n可以通过命令行或其他\
  \ shell 脚本向 shell 程序传递选项。这些选项由 Linux 以位置参数的形式提供给 shell 程序，具有特殊名称。第一个参数存储在名为 `1`（数字\
  \ 1）的变量中，可以在程序内通过 `$1`访问。第二个参数存储在名为 `2` 的变量中，可以在程序内通过 `$2`访问，以此此类推。调用 shell 程序时，可以省略编号较高的位置参数。\n\
  \n在开发更高级的 shell 程序时，了解如何使用这些位置参数以及如何访问从命令行获取的变量是必要的。\n\n### 位置参数的简单示例\n\n例如，如果 shell\
  \ 脚本 `mypgm` 期望两个参数——例如名字和姓氏——你可以只带一个参数（名字）调用该 shell 脚本。然而，你不能只带第二个参数（姓氏）。\n\n这是一个名为\
  \ `mypgm1` 的 shell 脚本，它接受一个参数（名字）并将其显示在屏幕上：\n\n```bash\n#!/bin/sh\n#Name display\
  \ program\nif [ $# -eq 0 ]\nthen\n  echo \"Name not provided\"\nelse\n```\n\n\n\n\
  \n```bash\necho \"Your name is \"$1\"\nfi\n```\n\n如果你执行 `mypgm1`，如下所示：\n\n```bash\n\
  matthew@seymour:~$ bash mypgm1\n```\n\n你会得到以下输出：\n\nName not provided\n\n然而，如果你执行\
  \ `mypgm1`，如下所示：\n\n```bash\nmatthew@seymour:~$ bash mypgm1 Heather\n```\n\n你会得到以下输出：\n\
  \nYour name is Heather\n\nshell 程序 `mypgm1` 还说明了 shell 编程的另一个方面：Linux 内核提供的 shell\
  \ 内置变量。在 `mypgm1` 中，内置变量 `$#` 提供传递给 shell 程序的位置参数数量。你将在本章的下一个主要章节中学习更多关于使用内置变量的知识。\n\
  \n### 使用位置参数从命令行访问和检索变量\n\n在脚本中使用位置参数对于需要使用带有复杂参数的管道命令的命令行来说非常有帮助。如果某些命令不经常使用，包含位置参数的\
  \ shell 程序会更加方便。例如，如果你使用连接了语音调制解调器的 Ubuntu 系统作为自动答答机，你可以编写一个脚本来执行命令，检索并播放语音消息。以下几行将保存的音频文件（`.rmd`\
  \ 或语音电话格式）转换并将结果管道到你系统的音频设备：\n\n```bash\n#!/bin/sh\n\n# 在 /var/spool/voice/incoming\
  \ 中播放语音消息\nrmdtopvf /var/spool/voice/incoming/$1 | pvfspeed -s 8000 | \\\npvftobasic\
  \ >/dev/audio\n```\n\n然后可以使用此脚本（可能命名为 `pmm`）轻松播放语音消息：\n\n```bash\nmatthew@seymour:~$\
  \ pmm name_of_message\n```\n\n包含位置参数的 shell 脚本通常用于自动化常规和单调的工作，例如系统日志报告生成、文件系统检查、用户资源统计、打印机使用统计以及系统、网络或安全管理任务。\n\
  \n### 使用简单脚本自动化任务\n\n你可以使用简单的脚本，例如检查系统日志中的某些关键词。如果脚本通过系统的调度表 `/etc/crontab` 运行，它可以帮助实现安全监控监控。通过将现有\
  \ Linux 命令的输出能力与 shell 的语言功能相结合，你可以快速构建一个实用的脚本来执行通常需要多行命令的任务。例如，你可以创建一个名为 `greplog`\
  \ 的短脚本，如下：\n\n```bash\n#!/bin/sh\n\n#    name:  greplog\n#      use:  使用关键词对指定日志进行\
  \ grep\n# version:  v.01 08aug02\n#\n#  author: bb\n#\n# usage: greplog [keyword]\
  \ [logpathname]\n#\n#  bugs: 没有检查参数数量是否正确\n# 使用关键词搜索和日期构建报告名称\nlog_report=/tmp/$1.logreport.`date\
  \ '+%m%d%y'`\n# 构建包含系统类型、主机名、日期和时间的报告头\necho \"==============================================================\"\
  \ \\\n      >$log_report\necho \"          S Y S T E M  M O N I T O R  L O G\" >>$log_report\n\
  echo uname -a >>$log_report\necho \"Log report for\" `hostname -f` \"on\" `date\
  \ '+%c'`      >>$log_report\necho \"==============================================================\"\
  \ \\\n      >>$log_report ; echo \"\" >>$log_report\n# 记录日志搜索开始\necho \"Search for->\"\
  \ $1 \"starting\" `date '+%r'` >>$log_report\necho \"\" >>$log_report\n# 从日志文件 ($2)\
  \ 获取并保存关键词 ($1) 的 grep 结果\ngrep -i $1 $2 >>$log_report\n# 构建时间页脚\necho \"\" >>$log_report\n\
  echo \"End of\" $log_report at `date '+%r'` >>$log_report\n# 将报告邮件给 root\nmail -s\
  \ \"Log Analysis for $1\" root <$log_report\n# 清理并删除报告\nrm $log_report\nexit 0\n\
  ```\n\n在这个示例中，脚本创建了变量 `$log_report`，它将是临时报告的文件名。关键词（`$1`）命令行上的第一个参数用作文件名的一部分，加上当前日期（更好的方法是使用\
  \ `$$` 代替日期，这将把脚本的 PID 作为文件扩展）。接下来，将包含某些格式化文本的报告头、`uname` 命令的输出以及主机名和日期添加到报告中。然后记录搜索开始，并将日志中关键词的任何匹配项添加到报告中。最后添加一个包含报告名称和时间的页脚。报告以搜索词作为邮件主题发送给\
  \ root，并删除临时文件。\n\n你可以通过手动运行脚本并向其提供一个关键词和系统日志 `/var/log/messages` 的路径来测试脚本，如下：\n\
  \n```bash\nmatthew@seymour:~# greplog FAILED /var/log/messages\n```\n\n\n\n\n如果字符串包含嵌入空格，你可以用双引号（″）将字符串括起来，这样\
  \ shell 将把整个字符串视为一个整体，而不是多个实体。\n\n例如，如果你在 shell 程序中如下所示将 `abc def` 的值（`abc` 后面跟着一个空格，然后是\
  \ `def`）赋值给变量 `x`，你将得到一个错误，因为 shell 会尝试将 `def` 作为一个独立的命令来执行：\n\n![Image](img/t0253_01.jpg)\n\
  \n如果你如下所示用双引号括住字符串，shell 将该字符串作为单个命令执行：\n\n![Image](img/t0253_02.jpg)\n\n双引号会解析字符串中所有的变量。以下是\
  \ `pdksh` 和 `bash` 的示例：\n\n```\nvar=\"test string\"\nnewvar=\"Value of var is $var\"\
  \necho $newvar\n```\n\n以下是 `tcsh` 的相同示例：\n\n```bash\nset var=\"test string\"\nset\
  \ newvar=\"Value of var is $var\"\necho $newvar\n```\n\n如果你执行包含上述三行的 shell 程序，你将得到以下结果：\n\
  \nValue of var is test string\n\n### 使用单引号保持变量不扩展\n\n你可以用单引号（′）将字符串括起来，以停止 shell\
  \ 扩展变量和解释特殊字符。当用于后者的目的时，单引号是一个`转义字符`，类似于反斜杠（你将在下一节中学习它）。在这里，你将学习如何使用单引号来避免在 shell\
  \ 脚本扩展变量。未扩展的变量在输出中保持其原始形式。\n\n在以下示例中，前述示例中的双引号已改为单引号：\n\npdksh 和 bash:\n\n```bash\n\
  var='test string'\nnewvar='Value of var is $var'\necho $newvar\n```\n\ntcsh:\n\n\
  ```bash\nset var = 'test string'\nset newvar = 'Value of var is $var'\necho $newvar\n\
  ```\n\n如果你执行包含这三行的 shell 程序，你将得到以下结果：\n\nValue of var is $var\n\n正如你所看到的，变量 `var`\
  \ 在结果中保持了原始格式，而不是被扩展。\n\n### 使用反斜杠作为转义字符\n\n正如你之前学到的，反斜杠（`\\`）用作转义字符，阻止 shell 将其其后的字符解释为特殊字符。假设你想将\
  \ `$test` 的值赋值给一个变量 `var`。如果你使用以下命令，shell 会读取特殊字符 `$` 并将 `$test` 解释为变量 `test` 的值。`test`\
  \ 没有被赋予值；`var` 中存储了一个空值，如下所示：\n\n![Image](img/f0254_01.jpg)\n\n遗憾的是，这种赋值在 `bash`\
  \ 和 `pdksh` 中可能有效，但在 `tcsh` 中使用时会返回“未定义变量”的错误。使用以下命令可以将 `$test` 正确存储在 `var` 中：\n\
  \n![Image](img/f0254_02.jpg)\n\n美元符号前的反斜杠（`\\$`）指示 shell 将 `$` 解释为任何其他普通字符，而不赋予任何特殊含义。你也可以在\
  \ `$test` 变量周围使用单引号（′）来获得相同的结果。\n\n### 使用反引号将字符串替换为输出\n\n你可以使用反引号（`` ` ``）字符来指示\
  \ shell 在执行时将字符串替换为它的输出。这被称为命令替换。当你想要将命令执行的结果存储在变量中时，可以在 shell 程序中使用此特殊字符。例如，如果你想统计当前目录下名为\
  \ `test.txt` 的文件的行数并将结果存储在名为 `var` 的变量中，你可以使用以下命令：\n\n![Image](img/t0255_01.jpg)\n\
  \n### `pdksh` 和 `bash` 中表达式的比较\n\n比较值或评估相似数据之间的差异——例如文件信息、字符字符串或数字——是一项名为`表达式比较`（comparison\
  \ of expressions）的任务。表达式比较是在 shell 程序中使用逻辑来完成任务的不可或缺的一部分。两个操作符（数字或字符串）的逻辑比较方法在不同的\
  \ shell 中其实现方式略有不同。在 `pdksh` 和 `bash` 中，可以使用名为 `test` 的命令来实现表达式比较。在 `tcsh` 中，你可以写一个表达式来实现相同的功能。\n\
  \n本节涵盖了使用 `pdksh` 或 `bash` shell 的比较操作。在章节的稍后部分，你将学习如何在 `tcsh` shell 中比较表达式。\n\n\
  `pdksh` 和 `bash` 的 shell 语法提供了一个名为 `test` 的命令来比较字符串、数字和文件。`test` 命令的语法如下：\n\n```\n\
  test expression\nor\n[ expression ]\n```\n\n`pdksh` 和 `bash` 以相同的方式处理 `test` 命令的两种形式。`test`\
  \ 命令支持以下类型的比较：\n\n* 字符串比较\n* 数字比较\n* 文件操作符\n* 逻辑操作符\n\n#### 字符串比较\n\n可以使用以下运算符比较两个字符串表达式：\n\
  \n* `=`—比较两个字符串是否相等。\n* `!=`—比较两个字符串是否不相等。\n* `-n`—评估字符串长度是否大于零。\n* `-z`—评估字符串长度是否等于零。\n\
  \n以下是在名为 `compare1` 的 shell 程序中比较两个字符串 `string1` 和 `string2` 时使用这些运算符的示例：\n\n```bash\n\
  #!/bin/sh\nstring1=\"abc\"\nstring2=\"abd\"\nif [ $string1 = $string2 ]; then\n\
  \    echo \"string1 equal to string2\"\nelse\n    echo \"string1 not equal to string2\"\
  \nfi\nif [ $string1 != $string2 ]; then\n    echo \"string1 is not equal to string2\"\
  \nelse\n    echo \"string1 equal to string2\"\nfi\nif [ -n $string1 ]; then\n  \
  \  echo \"string1 is not empty\"\nelse\n    echo \"string1 is empty\"\nfi\nif [\
  \ -z $string1 ]; then\n    echo \"string1 is empty\"\nelse\n    echo \"string1 is\
  \ not empty\"\nfi\n```\n\n如果你执行 `compare1`，你将得到以下结果：\n\nstring1 not equal to string2\n\
  string1 is not equal to string2\nstring1 is not empty\nstring1 is not empty\n\n\
  #### 数字比较\n\n可以使用以下运算符两个数字：\n\n* `-eq`—比较两个数字是否相等。\n* `-ge`—比较一个数字是否大于等于另一个。\n*\
  \ `-le`—比较一个数字是否小于等于。\n* `-ne`—比较两个数字是否不相等。\n* `-gt`—比较一个数字是否大于另一个。\n* `-lt`—比较一个数字是否小于另一个。\n\
  \n以下 shell 程序比较三个数字 `number1`、`number2` 和 `number3`：\n\n```bash\n#!/bin/sh\nnumber1=5\n\
  number2=10\nnumber3=5\nif [ $number1 -eq $number3 ]; then\n    echo \"number1 equal\
  \ to number3\"\nelse\n    echo \"number1 not equal to number3\"\nfi\nif [ $number1\
  \ -ne $number2 ]; then\n    echo \"number1 not equal to number2\"\nelse\n    echo\
  \ \"number1 equal to number2\"\nfi\nif [ $number1 -gt $number2 ]; then\n    echo\
  \ \"number1 is greater than number2\"\nelse\n    echo \"number1 is not greater than\
  \ number2\"\nfi\nif [ $number1 -ge $number3 ]; then\n    echo \"number1 is greater\
  \ or equal to number3\"\nelse\n    echo \"number1 is not greater or equal to number3\"\
  \nfi\nif [ $number1 -lt $number2 ]; then\n    echo \"number1 is less than number2\"\
  \nelse\n    echo \"number1 is not less than number2\"\nfi\nif [ $number1 -le $number3\
  \ ]; then\n    echo \"number1 is less or equal to number3\"\nelse\n    echo \"number1\
  \ is not less or equal to number3\"\nfi\n```\n\n当你执行该 shell 程序，你将得到以下结果：\n\nnumber1\
  \ is equal to number3\nnumber1 not equal to number2\nnumber1 is not greater than\
  \ number2\nnumber1 is greater or equal to number3\nnumber1 is less than number2\n\
  number1 is less or equal to number3\n\n\n\n`number1` 不等于 `number2`\n\n`number1`\
  \ 不大于 `number2`\n\n`number1` 大于或等于 `number3`\n\n`number1` 小于 `number2`\n\n`number1`\
  \ 小于或等于 `number3`\n\n## 文件运算符\n\n以下运算符可以作为文件比较操作符：\n\n- `-d`—确定一个文件是否为目录。\n- `-f`—确定一个文件是否为普通文件。\n\
  - `-r`—确定一个文件是否设置了读取权限。\n- `-s`—确定一个文件是否存在且长度大于零。\n- `-w`—确定一个文件是否设置了写入权限。\n- `-x`—确定一个文件是否设置了执行权限。\n\
  \n假设当前目录下有一个名为 `compare3` 的 shell 程序，该目录下还包含一个名为 `file1` 的文件和一个名为 `dir1` 的子目录。假设\
  \ `file1` 的权限为 `r-x`（读取和执行权限），`dir1` 的权限为 `rwx`（读取、写入和执行权限）。该 shell 程序的代码如下：\n\n\
  ```sh\n#!/bin/sh\n\nif [ -d $dir1 ]; then\n   echo \"dir1 is a directory\"\nelse\n\
  \   echo \"dir1 is not a directory\"\nfi\n\nif [ -f $dir1 ]; then\n   echo \"dir1\
  \ is a regular file\"\nelse\n   echo \"dir1 is not a regular file\"\nfi\n\nif [\
  \ -r $file1 ]; then\n   echo \"file1 has read permission\"\nelse\n   echo \"file1\
  \ does not have read permission\"\nfi\n\nif [ -w $file1 ]; then\n   echo \"file1\
  \ has write permission\"\nelse\n   echo \"file1 does not have write permission\"\
  \nfi\n\nif [ -x $dir1 ]; then\n   echo \"dir1 has execute permission\"\nelse\n \
  \  echo \"dir1 does not have execute permission\"\nfi\n```\n\n如果你执行该 shell 程序，将得到以下结果：\n\
  \ndir1 is a directory\nfile1 is a regular file\nfile1 has read permission\nfile1\
  \ does not have write permission\ndir1 has execute permission\n\n## 逻辑运算符\n\n逻辑运算符用于使用布尔逻辑比较表达式，该逻辑使用代表\
  \ `NOT`、`AND` 和 `OR` 的字符来比较值：\n\n- `!`—对逻辑表达式取反。\n- `-a`—逻辑与（AND）两个逻辑表达式。\n- `-o`—逻辑或或（OR）两个逻辑表达式。\n\
  \n这个名为 `logic` 的示例使用了上一个 `compare3` 示例中提到的文件和目录：\n\n```sh\n#!/bin/sh\n\nif [ -x\
  \ file1 -a -x dir1 ]; then\n   echo file1 and dir1 are executable\nelse\n   echo\
  \ at least one of file1 or dir1 are not executable\nfi\n\nif [ -w file1 -o -w dir1\
  \ ]; then\n   echo file1 or dir1 are writable\nelse\n   echo neither file1 or dir1\
  \ are executable\nfi\n\nif [ ! -w file1 ]; then\n   echo file1 is not writable\n\
  else\n   echo file1 is writable\nfi\n```\n\n如果你执行 `logic`，它将产生以下结果：\n\nfile1 and\
  \ dir1 are executable\nfile1 or dir1 are writable\nfile1 is not writable\n\n## 使用\
  \ `tcsh` 比较表达式\n\n如所述，`tcsh` 中比较表达式的方法与 `pdksh` 和 `bash` 使用的方法不同。本节演示的表达式比较使用了 `tcsh`\
  \ shell 环境必需的语法。\n\n### 字符串比较\n\n以下运算符可以比较两个字符串表达式：\n\n- `==`—比较两个字符串是否相等。\n- `!=`—比较两个字符串是否不相等。\n\
  \n以下示例在 shell 程序 `compare1` 中比较了两个字符串 `string1` 和 `string2`：\n\n```tcsh\n#!/bin/tcsh\n\
  \nset string1 = \"abc\"\nset string2 = \"abd\"\n\nif (string1 == string2) then\n\
  \   echo \"string1 equal to string2\"\nelse\n   echo \"string1 not equal to string2\"\
  \nendif\n\nif (string2 != string1) then\n   echo \"string2 not equal to string1\"\
  \nelse\n   echo \"string2 equal to string1\"\nendif\n```\n\n如果你执行 `compare1`，你将得到以下结果：\n\
  \nstring1 not equal to string2\nstring2 not equal to string1\n\n### 数字比较\n\n这些运算符可以比较两个数字：\n\
  \n- `>=`—比较一个数字是否大于或等于另一个数字。\n- `<=`—比较一个数字是否小于或等于另一个数字。\n- `>`—比较一个数字是否大于另一个数字。\n\
  - `<`—比较一个数字是否小于另一个数字。\n\n下一个示例在名为 `compare2` 的 shell 程序中比较了两个数字 `number1` 和 `number2`：\n\
  \n```tcsh\n#!/bin/tcsh\n\nset number1=5\nset number2=10\nset number3=5\n\nif (number1\
  \ > number2) then\n   echo \"number1 is greater than number2\"\nelse\n   echo \"\
  number1 is not greater than number2\"\nendif\n\nif (number1 >= number3) then\n \
  \  echo \"number1 is greater than or equal to number3\"\nelse\n   echo \"number1\
  \ is not greater than or equal to number3\"\nendif\n\nif (number1 < number2) then\n\
  \   echo \"number1 is less than number2\"\nelse\n   echo \"number1 is not less than\
  \ number2\"\nendif\n\nif (number1 >= number3) then\n   echo \"number1 is greater\
  \ than or equal to number3\"\nelse\n   echo \"number1 is not greater than or equal\
  \ to number3\"\nendif\n\nif (number1 < number2) then\n   echo \"number1 is less\
  \ than number2\"\nelse\n   echo \"number1 is not less than number2\"\nendif\n```\n\
  *(注：由于原文文本中 `tcsh` 示例部分存在逻辑重复和混乱，翻译时已根据上下文逻辑进行了对齐处理，以保持格式一致性)*\n\n#### `for` 语句\n\
  \n\n\n\n`for` 语句用于在指定的条件为真时，每次执行一组命令。`for` 语句有多种格式格式。`pdksh` 和 `bash` 使用的第一种格式如下：\n\
  \n```bash\nfor curvar in list\ndo\n    statements\ndone\n```\n\n如果你想对 `list` 中的每个值执行一次\
  \ `statements`，则应该使用这种形式。在每次迭代中，列表的当前值会被赋值给 `vcurvar`。`list` 可以是一个包含若干项的变量，也可以是一个由空格分隔的值列表。第二种格式如下：\n\
  \n```bash\nfor curvar\ndo\n    statements\ndone\n```\n\n在这种格式下，`statements` 会为传递给\
  \ shell 程序的每个位置参数执行一次。在每次迭代中，位置参数的当前值会被赋值给变量 `curvar`。\n\n这种形式也可以写为：\n\n```bash\n\
  for curvar in $@\ndo\n    statements\ndone\n```\n\n请记住，`$@` 提供了传递给 shell 程序的的位置参数列表，其引用方式与用户最初调用命令的方式一致。\n\
  \n在 `tcsh` 下，`for` 语句被称为 `foreach`。其格式如下：\n\n```bash\nforeach curvar (list)\n  \
  \  statements\nend\n```\n\n在这种格式下，`statements` 会为 `list` 中的每个值执行一次，并且在每次迭代中，`list`\
  \ 的当前值会被赋值给 `curvar`。\n\n假设你想将目录中的每个文件备份到名为 `backup` 的子目录。你可以在 `pdksh` 和 `bash`\
  \ 中执行以下操作：\n\n```bash\n#!/bin/sh\nfor filename in *\ndo\n    cp $filename backup/$filename\n\
  \    if [ $? -ne 0 ]; then\n        echo \"copy for $filename failed\"\n    fi\n\
  done\n```\n\n在前面的示例中，为每个文件创建了备份。如果复制失败，则生成一条消息。\n\n在 `tcsh` 中相同的示例如下：\n\n```bash\n\
  #!/bin/tcsh\nforeach filename (`/bin/ls`)\n    cp $filename backup/$filename\n \
  \   if ($? != 0) then\n        echo \"copy for $filename failed\"\n    endif\nend\n\
  ```\n\n#### `while` 语句\n\n`while` 语句可以在指定的条件为真时执行一系列命令。一旦指定的条件评估为假，循环就会终止。如果指定的条件初始评估即为假，则循环可能完全不会执行。你应该谨慎使用\
  \ `while` 命令，因为如果指定的条件永远不为假，循环将永远不会终止。\n\n### 无限循环在 Shell 程序中的用处\n\n无限循环有时是有用的。例如，你可以使用几行脚本来轻松地构建一个简单的命令，持续监控网络接口的\
  \ 802.11b 链路质量：\n\n```bash\n#!/bin/sh\nwhile :\ndo\n    /sbin/iwconfig eth0 | grep\
  \ Link | tr '\\n' '\\r'\nDone\n```\n\n脚本输出搜索结果，然后通过 `tr` 命令对输出进行格式化。结果是一个不断更新的单行信息的简单动画：\n\
  `Link Quality:92/92 Signal level:-11 dBm Noise level:-102 dBm`\n\n这种技术也可以用于为 X 创建一个图形化监控客户端，输出网络接口的流量信息和活动情况：\n\
  \n```bash\n#!/bin/sh\nxterm -geometry 75x2 -e \\\nbash -c \\\n\"while :; do \\\n\
  \      /sbin/ifconfig eth0 | \\\n      grep 'TX bytes' |\n      tr '\\n' '\\r' ;\
  \ \\\ndone\"\n```\n\n这个简单的示例使用了 bash 命令行脚本（通过 `-c` 启用）来重复执行命令行。该命令行将 `ifconfig`\
  \ 命令的输出通过给 `grep`，`grep` 搜索 `ifconfig` 的输出，然后将包含字符串 `\"TX bytes\"` 的行传递给 `tr` 命令。随后，`tr`\
  \ 命令删除行末尾的回车符，以便在 `/xterm X11` 终端窗口中显示信息，窗口大小由 `-geometry` 选项自动调整：\n`RX bytes:4117594780\
  \ (3926.8 Mb) TX bytes:452230967 (431.2 Mb)`\n\n无限循环非常有用，以至于 Linux 包含一个可以重复执行给定命令行的命令。例如，你可以通过\
  \ `sensors` 命令快速获取系统硬件健康状况的报告。但与其使用 shell 脚本无限循环输出，你可以使用 `watch` 命令重复该信息并提供简单的动画：\n\
  \n`$ watch \"sensors -f | cut -c 1-20\"`\n\n在 `pdksh` 和 `bash` 中，`while` 控制结构使用以下格式：\n\
  \n```bash\nwhile expression\ndo\n    statements\ndone\n```\n\n在 `tcsh` 中，使用以下格式：\n\
  \n```tcsh\nwhile (expression)\n    statements\n```\n\n如果你想相前五个数字，可以在 `pdksh` 和 `bash`\
  \ 中使用如下：\n\n```bash\ncurvar=0\nwhile [ $curvar -lt 5 ]\ndo\n    curvar=$((curvar\
  \ + 1))\ndone\n```\n\n在 `tcsh` 中，相同的内容可以写为：\n\n```tcsh\nset curvar = 0\nwhile ($curvar\
  \ < 5)\n    set curvar = $curvar + 1\nend\n```\n\n\n\n\n`shift` 语句用于从左到右逐处理位置参数。正如你记得的，位置参数被标识为\
  \ `$1`、`$2`、`$3` 等。`shift` 命令的效果是将每个位置参数向左移动一位，并且当前的 `$1` 参数将丢失。\n\n当你编写用户可以传递各种选项的\
  \ shell 程序时，`shift` 语句非常有用。根据指定的选项，随后的参数可能具有不同的含义，或者可能完全不存在。\n\n`shift` 命令的格式如下：\n\
  \n```\nshift  number\n```\n\n参数 `number` 是要移动的位数，是可选的。如果不指定，默认值为 `1`；即参数向左移动一位。如果指定了，参数将向左移动\
  \ `number` 位。\n\n## `if` 语句\n\n`if` 语句通过求值逻辑表达式来做出决策。在 `pdksh` 和 `bash` 中，`if` 条件具有以下格式：\n\
  \n```bash\nif [ expression ]; then\n    Statements\nelif [ expression ]; then\n\
  \    Statements\nelse\n    Statements\nfi\n```\n\n`if` 条件可以嵌套。也就是说，一个 `if` 条件可以包含另一个\
  \ `if` 条件。`if` 条件不一定有 `elif` 或 `else` 部分。如果 `if` 语句中指定的任何表达式为真（且后续的 `elif` 语句为真），则执行\
  \ `else` 部分。单词 `fi` 用于表示 `if` 语句的结束，这在有嵌套 `if` 条件时非常有用。在这种情况下，你应该能够匹配 `fi` 和 `if`，以确保所有的\
  \ `if` 语句都编写正确。\n\n在下面的 `bash` 或 `pdksh` 示例中，变量 `var` 可以具有两个值之一：`Yes` 或 `No`。任何其他值都是无效的。可以如下编写代码：\n\
  \n```bash\nif [ $var = \"Yes\" ]; then\n    echo \"Value is Yes\"\nelif [ $var =\
  \ \"No\" ]; then\n    echo \"Value is No\"\nelse\n    echo \"Invalid value\"\nfi\n\
  ```\n\n在 `tcsh` 中，`if` 语句有两种形式。第一种形式类似于 `pdksh` 和 `bash` 的形式，如下：\n\n```tcsh\nif\
  \ (expression) then\n    Statements\nelse if (expression) then\n    Statements\n\
  Else\n    Statements\nendif\n```\n\n使用变量 `var` 只有两个值 `Yes` 和 `No` 的示例，其在 `tcsh`\
  \ 中的编码方式如下：\n\n```tcsh\nif ($var == \"Yes\") then\n    echo \"Value is Yes\"\nelse\
  \ if ($var == \"No\" ) then\n    echo \"Value is No\"\nelse\n    echo \"Invalid\
  \ value\"\nendif\n```\n\n`tcsh` 中 `if` 条件的第二种形式如下：\n\n```tcsh\nif (expression) command\n\
  ```\n\n在这种格式下，只有当表达式求值为真时才能执行单个命令。\n\n## `case` 语句\n\n`case` 语句用于根据匹配指定变量的离散值或值范围执行语句。在大多数情况下，如果你有很多条件，可以使用\
  \ `case` 语句代替 `if` 语句。\n\n`pdksh` 和 `bash` 的 `case` 语句格式如下：\n\n```bash\ncase str\
  \ in\n    str1 | str2)\n        Statements;;\n    str3|str4)\n        Statements;;\n\
  \    *)\n        Statements;;\nesac\n```\n\n你可以为每个条件指定若干个离散值——例如 `str1`、`str2` 等——或者可以使用带有通配符的值指定值。最后一个条件应该是星号（`*`），当不满足其他任何条件时将执行它。对于每个指定的条件，将执行直到双分号（`;;`）的所有关联语句。\n\
  \n你可以编写一个脚本，当你提供月份数字作为参数时，它会输出月份名称。如果你提供的数字不在 1 到 12 之间，你会收到一条错误消息。该脚本如下：\n\n```bash\n\
  #!/bin/sh\ncase $1 in\n    01 | 1) echo \"Month is January\";;\n    02 | 2) echo\
  \ \"Month is February\";;\n    03 | 3) echo \"Month is March\";;\n    04 | 4) echo\
  \ \"Month is April\";;\n    05 | 5) echo \"Month is May\";;\n    06 | 6) echo \"\
  Month is June\";;\n    07 | 7) echo \"Month is July\";;\n    08 | 8) echo \"Month\
  \ is August\";;\n    09 | 9) echo \"Month is September\";;\n    10) echo \"Month\
  \ is October\";;\n    11) echo \"Month is November\";;\n    12) echo \"Month is\
  \ December\";;\n    *) echo \"Invalid parameter\";;\nesac\n```\n\n你需要在每个条件下的语句以双分号（`;;`）结束。如果不这样做，下一个条件下的语句也会被执行。\n\
  \n`tcsh` 的 `case` 语句格式如下：\n\n```tcsh\nswitch (str)\n    case str1|str2:\n      \
  \  Statements\n        break\n    case str3|str4:\n        Statements\n        break\n\
  \    default:\n        Statements\nend\n```\n\n你可以为每个条件指定若干个离散值——如 `str1`、`str2`\
  \ 等——或者可以使用通配符指定一个值。最后一个条件应该是 `default`，当不满足其他任何条件时执行。对于每个指定的条件，将执行直到 `break` 的所有语句。\n\
  \n之前为 `pdksh` 和 `bash` 显示的给定月份数字时输出月份的示例，可以在 `tcsh` 中这样写：\n\n```tcsh\n#!/bin/tcsh\n\
  set month = 5\nswitch ($month)\n    case 1: echo \"Month is January\" ; break\n\
  \    case 2: echo \"Month is February\" ; break\n    case 3: echo \"Month is March\"\
  \ ; break\n    case 4: echo \"Month is April\" ; break\n    case 5: echo \"Month\
  \ is May\" ; break\n    case 6: echo \"Month is June\" ; break\n    case 7: echo\
  \ \"Month is July\" ; break\n    case 8: echo \"Month is August\" ; break\n    case\
  \ 9: echo \"Month is September\" ; break\n    case 10: echo \"Month is October\"\
  \ ; break\n    case 11: echo \"Month is November\" ; break\n    case 12: echo \"\
  Month is December\" ; break\n    default: echo \"Oops!\" ; break\nend\n```\n\n##\
  \ `break` 和 `exit` 语句\n\n你应该注意另外两个语句：`break` 语句和 `exit` 语句。\n\n`break` 语句用于终止循环，如\
  \ `for`、`until` 或 `repeat` 命令。\n\n`exit` 语句用于退出 shell 程序。你可以在 `exit` 后面跟一个数字。如果当前\
  \ shell 程序被另一个 shell 程序调用，调用程序可以检查状态（`$?` 或 `$status` 变量，取决于 shell）并做出相应的决策。\n\n\
  ## 在 Shell 脚本中使用函数\n\n与其他语言一样，shell 程序也支持函数。函数是执行特定过程的 shell 程序片段；你可以在 shell 程序多次调用同一个函数。函数有助于消除编写\
  \ shell 程序时的重复代码。\n\n以下是 `pdksh` 和 `bash` 中函数的格式：\n\n```bash\nfunc(){\n    Statements\n\
  }\n```\n\n你可以这样调用函数：\n\n```bash\nfunc param1 param2 param3\n```\n\n参数 `param1`、`param2`\
  \ 等是可选的。你也可以作为一个字符串传递参数——例如 `$@`。函数可以解析参数，就像它们是从命令行作为参数传递给 shell 程序一样，但是在脚本内部传递的。例如，下面的脚本使用了一个名为\
  \ `Displaymonth()` 的函数，当你传递超出 1 到 12 范围的月份数字时，它会显示月份或错误消息。此示例适用于 `pdksh` 和 `bash`：\n\
  \n```bash\n#!/bin/sh\nDisplaymonth() {\n    case $1 in\n        01 | 1) echo \"\
  Month is January\";;\n        02 | 2) echo \"Month is February\";;\n        03 |\
  \ 3) echo \"Month is March\";;\n        04 | 4) echo \"Month is April\";;\n    \
  \    05 | 5) echo \"Month is May\";;\n        06 | 6) echo \"Month is June\";;\n\
  \        07 | 7) echo \"Month is July\";;\n        08 | 8) echo \"Month is August\"\
  ;;\n        09 | 9) echo \"Month is September\";;\n        10) echo \"Month is October\"\
  ;;\n    esac\n}\n```\n\n\n\n\n\n```bash\n11) echo \"Month is November\";;\n12) echo\
  \ \"Month is December\";;\n*) echo \"Invalid parameter\";;\nesac\n}\n```\n\nDisplaymonth\
  \ 8\n\n上一个程序显示以下输出：\n\nMonth is August\n\n### References\n\n- [www.gnu.org/software/bash/bash.html](http://www.gnu.org/software/bash/bash.html)—GNU\
  \  项目的 `bash` 主页。\n- [www.tldp.org/LDP/abs/html/](http://www.tldp.org/LDP/abs/html/)—Mendel\
  \ Cooper 的《高级 Bash 脚本指南》。\n- [www.freeos.com/guides/lsst/](http://www.freeos.com/guides/lsst/)—Linux\
  \ Shell 脚本教程。\n- [`kornshell.com/`](http://kornshell.com/)—Korn Shell 官方网站。\n- [`web.cs.mun.ca/~michael/pdksh/`](http://web.cs.mun.ca/~michael/pdksh/)—`pdksh`\
  \ 主页。\n- [www.tcsh.org/](http://www.tcsh.org/)—在此了解更多关于 `tcsh` 的信息。\n- [www.zsh.org/](http://www.zsh.org/)—在此处详细查看\
  \ `zsh`。\n\n## 第 14 章 启动过程\n\n本章内容\n\n- 启动时运行的服务\n- 开始启动加载过程\n- 手动启动和停止服务\n- 使用\
  \ Upstart\n- 参考文献\n\n在本章中，你将学习如何将任务转换为随系统启动而运行的服务，以及将它们转换为可以手动启动和停止的服务。你还将学习整个启动过程。\n\
  \n当你打开电源开关后，启动过程便开始，计算机执行存储在名为 `BIOS` 的芯片中的代码；无论你安装了什么操作系统，这一过程都会发生。Linux 启动过程从被称为\
  \ `boot loader`（引导加载程序）的代码加载 Linux 内核开始，直到出现登录提示符时才结束。\n\n作为系统管理员，你将使用在本章中学习的技能来控制系统的服务并管理计算机上的运行级别（runlevels）。理解系统服务和状态的管理对于理解\
  \ Linux 的工作原理（尤其是在多用户环境中）至关重要，并将帮助你理清 Ubuntu 系统某些配置文件的奥秘。此外，对处理任务调度的 `cron` 守护程序的良好了解对于所有水平的管理员来说都是至关重要的，因此你可能希望将这些知识与第\
  \ 13 章“自动化任务与 Shell 脚本](#ch13.html_ch13)”结合起来。\n\n### 启动时运行的服务\n\n尽管大多数人认为电脑要么开启要么关闭，但在\
  \ Ubuntu 和通用的 Linux 中，中间还存在许多状态。这些状态被称为 `runlevels`（运行级别），它们定义了启动时启动哪些系统服务。这些服务只是在后台运行的应用程序，为你的系统提供某些功能，例如从鼠标获取信息并发送到显示器；或者服务可以监控分区以查看它们是否还有足够的剩余空间。服务通常在启动过程中加载并运行（也称为启动），就像\
  \ Microsoft Windows 服务的方式一样。在内部，Ubuntu 使用一个名为 Upstart 的系统，而不是经典的 SysVinit，但 Upstart\
  \ 有一个特殊的向后兼容层，可以以 Linux 老手习惯的方式使用运行级别，处理那些不由 Upstart 处理的服务。关于 Upstart 的更多信息将在后文中介绍。\n\
  \n你可以通过配置和排序启动脚本，以及使用 Ubuntu 自带的各种系统管理工具，来管理计算机的几乎每个方面以及它启动后的行为。在本章中，你将学习如何使用这些启动脚本和系统管理工具。本章还针对软件配置或从系统中引入/移除各种硬件时可能出现的问题提供了排除和修复建议。\n\
  \n### 开始启动加载过程\n\n尽管 Linux 的实际启动加载机制在不同的硬件平台上（如 SPARC、Alpha 或 PowerPC 系统）各异，但运行\
  \ Ubuntu 的 Intel 架构 PC 在整个产品线中通常使用相同的机制。这一过程通过基本输入/输出系统，即 BIOS 完成。BIOS 是存储在主板芯片上的应用程序，用于初始化主板上的硬件（通常还包括连接到主板的硬件）。BIOS\
  \ 让系统准备好加载并运行我们识别为操作系统的软件。\n\n作为最后一步，BIOS 代码会寻找一种被称为引导加载程序（boot loader）或启动代码的特殊程序。这段短代码中的指令告诉\
  \ BIOS Linux 内核所在、它应该如何被加载到内存中以及它应该如何被启动。\n\n如果一切顺利，BIOS 将寻找可启动的卷，如软盘、CD-ROM、硬盘、RAM\
  \ 磁盘、USB 驱动器或其他介质。\n\n> 注意：Linux 非常灵活，可以从 CD-ROM 上的多个镜像启动，通过使用 PXE（读作“pixie”）或 NetBoot\
  \ 通过网络启动，或者在通过串口或网络连接发送控制台显示器的无头服务器上启动。目前人们甚至致力于在 [www.coreboot.org/](http://www.coreboot.org/)\
  \ 创建一种特殊的 Linux BIOS，它将缩短启动过程，因为 Linux 不需要典型 BIOS 提供的许多服务。\n\n> 注意：如果 BIOS 检测到硬件问题，启动过程将失败，且\
  \ BIOS 会通过系统扬声器发出几声蜂鸣。这些“蜂鸣声代码”指示了 BIOS 遇到的问题性质。代码在不同制造商之间有所不同，对该阶段发生问题的诊断超本书的范围，且不涉及\
  \ Linux。如果你遇到问题，请查阅主板说明书或联系主板制造商。\n\n接下来，BIOS 在启动卷上寻找分区引导区中的启动代码，也称为第一块硬盘的主引导记录（MBR）。MBR\
  \ 包含引导加载程序代码和分区表——可以把它想象成书的索引，加上关于如何开始这本书的少量注释。如果 BIOS 找到了引导加载程序，它会将引导加载程序代码加载到内存中。此时，BIOS\
  \ 的工作已经完成，并将系统控制权交给引导加载程序。\n\n引导加载程序在磁盘上定位 Linux 内核并将其加载到内存中。在该任务完成后，引导加载程序将系统控制权交给\
  \ Linux 内核。你可以看到一个过程如何在另一个过程的基础上进行构建，这种方法使得许多不同的操作系统能够在相同的硬件上运行。\n\n\n\n\n\n从通义上说，内核管理系统资源。作为用户，你并不经常与内核直接交互，而是与你正在使用的应用程序交互。Linux\
  \ 将每个应用程序称为一个进程，内核为每个进程分配一个称为 `process ID (PID)` 的数字。在传统上，Linux 内核会加载并运行一个名为 `init`\
  \ 的进程，它被称为“所有进程的祖先”，因为它启动了后续的所有进程。Ubuntu 已经用 `Upstart` 替换了 `init`，该工具由 Ubuntu 开发者编写并提供给任何发行版使用，但我们将首先介绍传统方法，因为\
  \ `Upstart` 允许那些尚未配置好处理的服务实现向后兼容性。我们稍后会讨论 Upstart。\n\n启动过程的下一步传统上从 Linux 内核加载的消息开始开始，随后会有一系列打印在屏幕上的消息，为你显示每个命令的状态。如果失败，将显示错误消息。在启动时可以向内核传递\
  \ `quiet` 选项来抑制许多此类消息。Ubuntu 默认不显示这些消息，而是使用一个由 Fedora/Red Hat 开发者创建的名为 `Plymouth`\
  \ 的启动过程，该过程速度快且包含精美的启动界面。\n\n如果启动过程在此处停止，系统将处于空闲状态，屏幕将为空。为了让系统对用户有用，我们需要启动系统服务。这些服务是允许我们与系统交互的一些应用程序。\n\
  \n### 系统服务与运行级别\n\n`init` 命令传统上将 Linux 系统引导到特定的系统状态，通常称为其 `runlevel`（运行级别）。\n\n\
  运行级别决定了启动许多可用系统服务中的哪些，以及它们启动的顺序。有一个特殊的运行级别用于停止系统，还有一个特殊的运行级别用于系统维护。正如你所看到的，还有其他用于特殊目的运行级别。\n\
  \n传统上，你使用运行级别来管理 Linux 上运行的系统服务。所有这些特殊文件和脚本在安装期间设置，但你可以手动更改和控制它们。\n\n### 运行级别定义\n\
  \n在传统的 Linux 系统中，运行级别定义在 `/etc/init.d`。某些发行版使用传统的 `/etc/inittab` 文件来管理启动服务。自从 `Upstart`\
  \ 创建并用于启动过程以来，Ubuntu 已经多年没有使用它，因此默认情况下该文件不存在。然而，如果你过去使用过它并想在 Ubuntu 中创建一个，它将被读取并遵循。由于它在\
  \ Ubuntu 中不是标准配置，我们不涵盖 `/etc/inittab`。\n\n每个运行级别都告诉 `init` 命令启动或停止哪些服务。虽然所有运行级别可能都有自定义定义，但\
  \ Ubuntu 采用了一些运行级别标准：\n\n- **Runlevel 0**——被称为“halt”（停止），该运行级别用于关闭系统。\n- **Runlevel\
  \ 1**——这是一个特殊的运行级别，定义为“single”（单用户），将 Ubuntu 引导到 root 权限 shell 提示符，只有 root 用户可以登录。它关闭了网络、X\
  \ 和多用户访问。这是维护或救援模式。它允许系统管理员在系统上执行工作、备份或修复配置或其他文件。\n- **Runlevel 2**——这是 Ubuntu 的默认运行级别。\n\
  - **Runlevels 3–5**——这些运行级别在 Ubuntu 中未使用，但在其他 Linux 发行版中常用。\n- **Runlevel 6**——该运行级别用于重启系统。\n\
  \n运行级别 1（也称为单用户模式或维护模式）最常用于修复文件系统，并在忘记密码时更改系统的 root 密码。具有机器物理访问权限的入侵者也可以使用运行级别 1\
  \ 访问你的系统。\n\n> **注意**：永远不要忘记不受控制的物理访问等同于向入侵者保证了访问数据的权限。\n\n### 引导到默认运行级别\n\nUbuntu\
  \ 默认引导到运行级别 2，这意味着它像正常一样启动系统，并让你留在 X 系统中查看图形化登录提示符。它通过查看 `/etc` 中的 `rc*.d` 目录来确定运行级别\
  \ 2 需要加载的内容。Ubuntu 包含了从 `rc0.d` 到 `rc5.d` 以及 `rcS.d` 的目录。\n\n假设值为 `1`，`rc` 脚本将执行\
  \ `/etc/rc.1` 目录下的所有脚本，然后启动图形登录。\n\n如果 Ubuntu 引导到运行级别 1，例如，将执行 `/etc/rc1.d` 目录下以字母\
  \ `K` 开头的脚本，紧接着是以字母 `S` 开头的脚本：\n\n```\nmatthew@seymour:~$ ls /etc/rc1.d/\n\nK10jackd\
  \      K20rsync            K20vboxdrv      K80cups      S70pppd-dns\nK15pulseaudio\
  \  K20saned            K20winbind      README      S90single\nK20acpi-support K20saslauthd\
  \      K74bluetooth S30proc\nK20kernelops   K77ntp             S70dns-clean\n```\n\
  \n这些脚本（与 `rc*.d` 目录中的所有脚本一样）实际上是指向 `init.d` 目录中系统服务的符号链接。`rc` 链接以字母和数字开头，表示该服务应该被杀死\
  \ (K) 还是启动 (S)，并向 `init.d` 脚本传递 stop 或 start 值。前缀中的数字决定了它们启动的顺序。数字本身并没有无神不可的，但某些服务需要在其他服务启动之前运行。例如，你不希望系统在先启动网络和\
  \ NFS 服务的情况下尝试挂载 `Network File System (NFS)`。\n\n### 理解 `init` 脚本和初始化的最后阶段\n\n每个\
  \ `init.d` 脚本都包含在接收参数时执行操作的逻辑。这种逻辑可能是一个简单的 switch 语句，如下所示：\n\n```\ncase \"$1\" in\n\
  \  start)\n    start\n    ;;\n  stop)\n    stop\n    ;;\n  restart)\n    restart\n\
  \    ;;\n  reload)\n    reload\n    ;;\n  status)\n    status\n    ;;\n  condrestart)\n\
  \    [ -f /var/lock/subsys/smb ] && restart || :\n    ;;\n  *)\n    echo \"Usage:\
  \ $0 {start|stop|restart|status|condrestart}\"\n    exit 1\n    ;;\nesac\n```\n\n\
  虽然脚本可以自定义系统从通电开始运行的方式，但在不更换内核的情况下，这种脚本方法也意味着不需要完全停机即可启动、停止、升级或安装新服务。\n\n注意，并不是所有脚本都使用这种方法，并且可能会向服务传递其他消息，例如\
  \ restart、reload 或 status。此外，并不是所有脚本都响应相同的消息（start 和 stop 除外，它们按照约定必须接受），因为服务可能需要特殊命令。\n\
  \n在所有系统脚本运行之后，你的系统已配置完毕，所有必要的系统服务都已启动。如果你使用的是 5 以外的运行级别，init 进程的最后一个动作是启动用户 shell——`bash`、`tcsh`、`zsh`\
  \ 或任何可用的命令行 shell。\n\n\n\n\n\n你可以在 Dash（Dash）中搜索“启动应用程序”（Startup Applications）（见图\
  \ 14.1）来配置启动时运行的服务。在这里，Ubuntu 列出了所有允许在引导启动时自动启动的服务。这些服务通常默认都是启用的，但你可以取消勾选不需要的服务并点击“确定”。不建议为了“让运行变快”而随机禁用服务。某些服务对于计算机的持续运行至关重要，例如图形登录管理器和系统通信总线。\n\
  \n![Image](img/14fig01.jpg)\n\n图 14.1 你可以通过切换服务对话框中的复选框来启用或禁用 Ubuntu 的启动服务。\n\n\
  ## 更改运行级别 (Runlevels)\n\n在对系统服务和运行级别进行更改后，可以使用 `telinit` 命令在正在运行的 Ubuntu 系统上动态更改运行级别。这种更改运行级别的方法允许系统管理员修改运行系统中的选定部分，以更改服务或使已有的更改生效（例如重新分配网络接口的网络地址）。\n\
  \n例如，系统管理员可以使用 `telinit` 命令配合 `S` 选项快速将系统切换到维护模式或单用户模式，如下：\n\n```bash\nmatthew@seymour:~$\
  \ sudo telinit S\n```\n\n`telinit` 命令使用 `init` 命令来更改运行级别并关闭当前运行的服务。\n\n在引导到单用户模式后，你可以返回多用户模式，如下所示：\n\
  \n```bash\nmatthew@seymour:~$ sudo telinit 2\n```\n\n**提示：** Linux 充满了快捷键：如果你在提示符处输入\
  \ `exit` 退出单用户 shell，你将回到默认运行级别，而无需担心使用 `telinit`。\n\n## 排除运行级别问题\n\n在 Ubuntu Ubuntu\
  \ 中，除非发生某些故障，否则在特定的运行级别下重新排序或更改系统服务是非常少见的。但系统管理员应该对 Linux 如何启动以及如何控制服务的基本了解，以便进行故障排除或诊断问题。通过使用额外的工具（例如使用\
  \ `dmesg | less` 命令在启动后读取内核输出，或通过 `cat /var/log/messages | less` 检查系统日志），可以在遇到棘手的驱动程序或服务故障时获取更详细的细节信息。\n\
  \n为了更好地了解如何在 Ubuntu 中排查服务问题，请查看典型服务相关问题的诊断和解决。\n\n在示例中，X 将无法启动：你没有看到桌面显示，计算机似乎对键盘输入没有响应。X\
  \ 服务器可能陷入了循环并反复失败，也可能在带有或不带错误消息的情况下退出到 shell 提示符。\n\nX 服务器仅会在运行级别 2 中尝试重新启动自己，因此，要确定\
  \ X 服务器是否陷入了循环，请尝试切换到运行级别 1。\n\n**提示：** 如果你正在多用户系统上工作并可能无意中中断其他用户的工作，请先让他们保存当前工作，然后切换到更安全的运行级别，例如单用户模式。\n\
  \n运行命令 `telinit 1` 切换到运行级别 1。将此开关切换到运行级别 1 将停止 X 服务器尝试重新启动。\n\n现在，你可以轻松地检查错误并尝试修复它。\n\
  \n首先，尝试“裸运行”启动 X 服务器（即不同时启动窗口管理器）。如果你成功了，将看到一个中间有一个大 X 的灰色屏幕。如果是这样，请使用 `Ctrl+Alt+Backspace`\
  \ 组合键杀掉 X，并查看你的窗口管理器配置。（此配置取决于你选择了哪种窗口管理器。）\n\n假设 X 无法“裸运行”。如果我们查看 Xorg 的日志文件（它在\
  \ `/var/log` 目录中有明确的标识），我们将关注任何以 `(EE)`（特殊错误代码）开头的行。如果家目录中存在此类文件，我们还可以检查错误日志文件 `.xsessions-error`。\n\
  \n如果我们发现错误行，错误的原因对我们来说可能明显，也可能不。Linux 社区的优秀之处在于，你极可能第一个遇到该错误的人。将错误信息（或最好是它的唯一部分）输入\
  \ [www.google.com/linux](http://www.google.com/linux)，并发现其他人对该问题的看法。你可能需要调整搜索以获得可用的结果，但那种详细程度超出了本章的范围。像以前一样进行调整并重新测试，直到成功。\n\
  \n修复 X 配置并使用 `startx` 启动 X。根据需要重复操作。\n\n**注意：** 在对任何配置文件进行任何更改之前，务必对原始未修改的文件创建一个备份副本。我们的做法是在副本上添加扩展名\
  \ `.original`，因为这是一个唯一且无歧的标识符。\n\n如果你需要恢复原始配置文件，不要重命名它，而是将其复制回原始名称。\n\n## 手动启动和停止服务\n\
  \n如果你更改了系统服务的配置文件，通常需要停止并重启服务以读取新配置。如果你正在重新配置 X 服务器，从运行级别 2 切换到运行级别 1 通常更便于进行测试，然后切换回运行级别\
  \ 2 以重新启用图形登录。如果服务配置不当，停止并重启它直到配置正确，比重启整个机器要容易得多。\n\n管理服务（以 root 身份）的传统方法是在命令行上调用服务的\
  \ `/etc/init.d` 路径并带有相应的关键字（如 `start`、`status` 或 `stop`）。例如，启动 Apache Web 服务器，调用\
  \ `/etc/init.d/apache2` 脚本：\n\n```bash\nsudo /etc/init.d/apache2 start\n```\n\n\
  ```\nStarting apache 2.2 web server [OK]\n```\n\n脚本执行相应的程序并报告它们的状态。停止服务同样简单，使用 `stop`\
  \ 关键字。\n\n## 使用 Upstart\n\nUpstart 最初是为了 Ubuntu 开发的。它目前被越来越多的发行版（包括 Fedora 9 及之后、Maemo\
  \ 平台以及 Google 的 Chrome OS）使用。Upstart 是 `/sbin/init` 守护进程和 System-V 初始化系统的基于事件的替代品。它处理启动期间的任务和服务启动，并在关机期间停止它们。它在系统运行时监控它们，并旨在成为一种根据发生的特定事件自动启动任务和服务的机制，而不是手动调用脚本来启动或停止。\n\
  \n基本上，在 Upstart 中，任务和服务的启动停止是由事件驱动的。事件会在其他任务和服务启动停止时产生，并可以从系统的任何其他进程接收。如果服务意外死亡可能会重新生成，与\
  \ `init` 守护进程的通信通过 D-Bus 进行。计划中但尚未实现的功能包括按时间间隔或预定时间或当文件或目录更改时创建事件，以及创建用户可以自己启动和停止的用户服务。这意味着最终\
  \ Upstart 任务甚至可以取代经典的 `cron`，并实现以前在任何 UNIX 或 Linux 版本上无法实现的功能。\n\n目前，Upstart 被用于启动和关机，并不是所有的服务都编写了\
  \ Upstart 任务。存在的任务如预期的存在于 `/etc/init` 中，并可以像 `init` 任务一样通过基本方式访问。如果存在 Upstart 任务而你尝试传统方法管理它，将得到类似下面的消息：\n\
  \n\n\n\n\n```\nmatthew@seymour:~$ sudo /etc/init.d/ufw stop\n```\n\n不要通过 `/etc/init.d`\
  \ 调用 `init` 脚本，请使用 `service(8)` 工具（例如，`service ufw stop`）。由于你尝试调用的脚本已转换为 Upstart\
  \ 任务，你也可以使用 `stop(8)` 工具（例如，`stop ufw`）。\n\n在这种情况下，要启动或停止 Ubuntu 的“简单配置防火墙 (UFW)”，你只需输入\
  \ `sudo start ufw` 或 `sudo stop ufw` 即可。非常简单。\n\nUpstart 仍然非常新且处于深度开发中。目前没有多少文档，而这是刻意为之。进程和功能尚未定型，因此在扩展基础的同时，开发团队认为保持细节的某种模糊性是最好的，这样可以防止快速变化的信息在传播过程中产生大量工作量，或者导致以后在公共知识库中无法修复或替换错误或已更改的信息。如果你想了解更多关于\
  \ Upstart 的信息，从从 http://upstart.ubuntu.com/](http://upstart.ubuntu.com/) 开始。随着开发的持续，预计将发布更多细节，但如果你是那种喜欢玩弄最新新玩具且不畏惧脏手的急躁类型，那么通过一些挖掘，你应该能够通过该网站和计算机上已安装示例找到你想要或需要的内容。\n\
  \n#### 参考文献\n\n- **[`usr/src/linux/init/main.c`](http://usr/src/linux/init/main.c)**——学习\
  \ Linux 如何启动的最佳地点。真的是非常引人入胜的读物。从源头获取。你需要安装内核源码才能阅读此内容。\n- **[`help.ubuntu.com/community/Grub2`](https://help.ubuntu.com/community/Grub2)**——关于\
  \ GRUB2 的 Ubuntu 社区文档。\n- **[www.ibm.com/developerworks/linux/library/l-grub2/index.html](http://www.ibm.com/developerworks/linux/library/l-grub2/index.html)**——迁移到\
  \ GRUB2 的 IBM 指南。尚未完成的手可以在 [www.gnu.org/software/grub/manual/](http://www.gnu.org/software/grub/manual/)\
  \ 找到。\n\n## 第 15 章 系统监控工具\n\n* * *\n\n本章\n\n- 基于控制台的监控\n- 图形化进程和系统管理工具\n- KDE 进程与系统监控工具\n\
  - 企业级服务器监控\n- 参考文献\n\n* * *\n\n为了保持系统处于最佳状态，你需要能够对其进行紧密监控。这在企业环境中至关重要的，因为在那里运行时间至关重要，任何系统故障和停机都可能非常昂贵。无论是检查进程是否存在异常的守护进程，还是密切关注\
  \ CPU 和内存的使用情况，Ubuntu 都提供了丰富的工具，可以根据你的需要提供尽可能少或多的反馈。本章将介绍一些基础监控工具，以及旨在让你的系统运行得更久的策略。某些监控工具涵盖了网络连接、内存和硬盘使用情况，在本章中，你将学习如何结合图形界面和命令行工具来操作活跃的系统进程。\n\
  \n### 基于控制台的监控\n\n熟悉 UNIX 系统管理的管理员已经知道在大多数 UNIX 变体中常见的 `ps` 或进程显示命令。由于 Linux 和 UNIX\
  \ 之间的紧密关系，它也包含了此命令，让你能够看到系统上运行的当前进程、其所有者以及资源消耗情况。\n\n尽管 Linux 内核有自己独特的架构，但它也受益于对\
  \ `/proc` 文件系统的增强使用，这是许多 UNIX 变体中常见的虚拟文件系统。通过 `/proc` 文件系统，你可以直接与内核通信以获取正在发生的情况。开发者倾向于使用\
  \ `/proc` 文件系统从内核提取信息，并将其转换为人类可读的格式。关于 `/proc` 文件系统的完整讨论超出了本书的范围。为了更好地了解其包含的内容，你可以查看\
  \ [`en.tldp.org/LDP/Linux-Filesystem-Hierarchy/html/proc.html`](http://en.tldp.org/LDP/Linux-Filesystem-Hierarchy/html/proc.html)，这是一个非常深入的指南。\n\
  \n进程也可以在命令行进行控制，这很重要，因为你有时可能只有命令行界面。每当应用程序或命令（无论是从命令行还是点击图标）启动时，来自内核的进程会被分配一个称为进程\
  \ ID (PID)。当程序通过命令行启动时，shell 会显示此数字：\n\n```\nmatthew@seymour:~$ gedit &\n\n[1] 9649\n\
  ```\n\n在这个示例中，`gedit` 在后台运行，(`bash`) 报告了一个 shell 作业号（情况下为 `[1]`）。作业号或作业控制是 shell\
  \ 特有的功能，允许进行不同形式的进程控制，例如将程序发送或挂起到后台以及检索后台进程。\n\n#### 使用 kill 命令控制进程\n你可以使用 shell\
  \ 内置的 `kill` 命令通过 PID 停止运行进程。该命令请求内核停止运行进程并回收系统内存。例如，要停止示例中的 gedit，可以使用以下 `kill`\
  \ 命令：\n\n```\nmatthew@seymour:~$ kill 9656\n```\n\n在你按下回车键，然后再按一次回车键后，shell 会报告以下内容：\n\
  \n```\n[1]+  Terminated          gedit\n```\n\n\n\n\n`kill` 命令是一个基础的 UNIX 系统命令。你可以通过向界面输入命令来与运行中的进程进行通信，例如在文本编辑器中输入时。但某些进程（通常是系统进程而非应用程序进程）在没有此类界面的情况下运行，你同样需要一种与它们通信，因此我们使用了信号系统。`kill`\
  \ 系统通过向进程发送信号来实现这一点，你可以用它与任何进程进行通信。`kill` 命令的一般格式如下：\n\n```\nmatthew@seymour:~$\
  \ kill option PID\n```\n\n注意，如果你对一个你不拥有的进程使用 `kill`，你需要拥有超级用户权限，并在 `kill` 命令前加上\
  \ `sudo`。\n\n许多信号选项可以用单词或数字的形式发送，但大多数选项只对程序员感兴趣。最常用的之一就是我们之前用来杀死 `gedit` 使用的那个：\n\
  \n```\nmatthew@seymour:~$ kill PID\n```\n\n这告诉 PID 为 `PID` 的进程停止；你提供实际的 `PID`。然而，如果没有信号选项，无法保证进程会被杀死，因为程序可以捕获、阻塞或忽略某些终止信号（这是设计的初衷，是一件好事）。\n\
  \n```\nmatthew@seymour:~$ kill -9 PID\n```\n\n这包含一个无法被捕获的 `kill` 信号（`9` 是 `SIGKILL`\
  \ 信号的数字）；当之前的普通 `kill` 命令不起时，可以使用这种组合。但要小心。使用这种方法不允许进程优雅地关闭，而通常倾向于优雅关闭，因为它可以关闭进程可能正在使用的资源，并确保在进程消失之前写入日志等信息。\n\
  \n```\nmatthew@seymour:~$ kill -1 PID\n```\n\n这是“挂断”——停止——的信号，并且还会清理所有相关的进程（`1`\
  \ 是 `SIGHUP` 信号的数字）。\n\n当你精通进程控制和作业控制后，你将学习许多 `kill` 选项的用途。你可以在 `kill` 的 man 页中找到信号选项的列表。\n\
  \n### 使用优先级调度和控制\n\n没有任何进程可以随心所欲地使用系统资源（CPU、内存、磁盘访问等）。毕竟，内核的主要功能是公平地管理系统资源。它通过为每个进程分配一个优先级来实现这一点，使得某些进程可以获得更好的系统资源访问，而某些进程可能需要等待更久才能轮到它们。优先级调度可以是管理支持关键应用程序的系统或在必须为特定任务预留或分配\
  \ CPU 和 RAM 使用量的情况下的重要工具。Ubuntu 自带的两个实用程序包括 `nice` 和 `renice` 命令。（`nice` 是 GNU `Coreutils`\
  \ 软件包的一部分，而 `renice` 继承自 BSD UNIX。）\n\n`nice` 命令通过其 `-n` 选项使用，配合范围在 `-20` 到 `19`\
  \ 之间的参数，按优先级从高到低排序（数字越小，优先级越高）。例如，要以低优先级运行 Conky 客户端，可以使用如下 `nice` 命令（本章稍后会更详细介绍\
  \ Conky）：\n\n```\nmatthew@seymour:~$ nice -n 12 conky &\n```\n\n`nice` 命令通常用于磁盘或\
  \ CPU 密集型任务，这些任务可能会干扰系统或导致系统变慢。`renice` 命令可重置运行进程的优先级，或控制用户所有的所有进程的优先级和调度。普通用户只能通过此命令数值上增加进程优先级（即降低任务重要性），但具有超级用户权限的用户可以使用\
  \ `sudo` 访问完整的 nice 调度范围（-20` 到 `19`）。\n\n系统管理员还可以使用 `time` 命令来了解完成任务（如 shell 脚本）所需的时间以及所需系统资源的比例。（这里，`time`\
  \ 用于测量经过的时间时长；处理民用时间和恒星时间的命令是 `date` 命令。）该命令与另一个命令（或脚本）的名字作为参数使用如下：\n\n```\nmatthew@seymour:~$\
  \ sudo time -p find / -name conky\n```\n\n```\n/home/matthew/conky\n/etc/conky\n\
  /usr/lib/conky\n/usr/bin/conky\nreal 30.19\nuser 1.09\nsys 2.77\n```\n\n命令输出显示了从开始到结束的时间，以及所需的用户时间和系统时间。你可以查询的其他因素包括内存、CPU\
  \ 使用率和文件系统输入/输出（I/O）统计。更多细节见 `time` 命令的 man 页。\n\n几乎所有的图形进程监控工具都包含某种形式的进程控制或管理。早期移植到\
  \ Linux 的许多工具都是旧版 UNIX 程序的克隆版本。一个熟悉的监控（并控制）程序是 `top`。`top` 命令基于 `ps` 命令，提供一个基于文本的不断更新的控制台输出，显示当前运行的\
  \ CPU CPU 密集型进程。可以这样启动它：\n\n```\nmatthew@seymour:~$ top\n```\n\n按下回车键后，你将看到一个如图\
  \ 15.1 所示的显示。`top` 命令有几个交互命令：按下 `h` 显示帮助屏幕；按下 `k` 提示你输入要杀死的进程 `PID`；按下 `n` 提示你输入要更改优先级的进程\
  \ `PID`。（注：原文此处存在大量重复描述，已根据要求精简处理并保留核心信息）。\n\n`top` 命令使用相当数量的内存，因此你希望在使用时保持谨慎。当你完成操作后，只需按下\
  \ `q` 退出。\n\n### 使用 `free` 显示空闲和已用内存\n\n尽管 `top` 包含了一些内存信息，但 `free` 工具以千字节为单位显示空闲和已用内存量。（`-m`\
  \ 切换以兆字节为单位显示）。在一个系统上，输出如下：\n\n```matthew@seymour:~$ free\n              total \
  \       used        free      shared  buff/cache\nMem:           4055680      3327764\
  \       727916        94922      280944      209768\nSwap:          878512     \
  \        0      878512\n```\n\n此输出描述了一个拥有 4GB RAM 内存和 8GB 交换区的机器。注意没有使用交换，机器负载不高。Linux\
  \ 在内存管理方面非常出色，并为未来的工作“获取”所有可用内存。\n\n一个实技巧是使用 `watch` 命令；它默认每两秒重新运行一次命令。如果你使用\n\n\
  ```\nmatthew@seymour:~$ watch free\n```\n\n另一个系统监控工具是 `vmstat`（虚拟内存统计）。该命令报告进程、内存、I/O\
  \ 和 CPU 情况，通常提供自上次启动以来的平均值；或者你可以通过告诉它秒为单位的时间间隔和迭代次数来让它报告当前期间的情况，如下：\n\n```\nmatthew@seymour:~$\
  \ vmstat 5 10\n```\n\n使用 `uptime` 命令查看自上次启动以来多久，并了解负载平均值的大致；数字越大负载越高。\n\n\n\n\n\
  执行此操作很容易，主要通过 `df` 命令，如下：\n\n```\nmatthew@seymour:~$ df\n```\n\n仅使用该命令就会返回此输出：\n\
  \n```\nFilesystem             1K-blocks      Used Available Use% Mounted on\n/dev/sda1\
  \              14421344   6584528   7104256  49% /\nnone                   2020124\
  \      348   2019776   1% /dev\nnone                   2027840     2456   2025384\
  \   1% /dev/shm\nnone                   2027840      220   2027620   1% /var/run\n\
  none                   2027840        0   2027840   0% /var/lock\nnone         \
  \          2027840        0   2027840   0% /lib/init/rw\n/dev/sda6             284593052\
  \ 147323812 122812752  55% /home\n```\n\n在这里你可以看到挂载在系统上的每个驱动器，以及已用空间、可用空间、磁盘总使用百分比，最后是它们在系统中的挂载位置。\n\
  \n除非你擅长心算，否则你可能会发现很难准确计算出这些数字在兆字节（MB）和千字节（GB）中的含义，因此建议使用 `-h` 参数使输出变为人类可读的，如下：\n\
  \n```\nmatthew@seymour:~$ df -h\n\n```\nFilesystem           Size  Used Avail Use%\
  \ Mounted on\n/dev/sda1               14G  6.3G  6.8G  49% /\nnone             \
  \      2.0G  348K  2.0G   1% /dev\nnone                   2.0G  2.4M  2.0G   1%\
  \ /dev/shm\nnone                   2.0G  220K  2.0G   1% /var/run\nnone        \
  \           2.0G        0  2.0G   0% /var/lock\nnone                   2.0G    \
  \    0  2.0G   0% /lib/init/rw\n/dev/sda6              272G  141G  118G  55% /home\n\
  ```\n\n### 磁盘配额\n\n磁盘配额是按用户或组限制磁盘空间使用的一种方法。虽然在本地工作站上很少使用（如果用的话），但在企业级计算中，配额绝对是一种标准。限制磁盘空间的使用不仅可以节省资源，还可以通过限制任何用户消耗的磁盘空间来提供操作安全保障。磁盘配额将在第\
  \ 12 章中详细介绍。\n\n### 图形进程与系统管理\n\nGNOME 和 KDE 桌面环境提供了丰富的监控工具。菜单、按钮等图形界面元素，以及包括实时负载图在内的图形输出，使得这些工具易于使用。Ubuntu\
  \ 自带了需要活动会话（某些情况下需要 root 权限）的客户端。如果你在本地查看图形工具，而它们运行在服务器上，那么你必须在本地机器上正确安装并配置 X。你必须正确配置\
  \ X11 环境变量（如 `$DISPLAY`）来使用该软件，或者在连接远程主机时使用 `ssh` 客户端的 `-X` 。\n\n### 系统监器\n\n在标准\
  \ Ubuntu 桌面查找图形监控工具的第一个地方是菜单中的“系统 -> 管理 -> 系统监器”。这个工具信息丰富、易于使用和理解，非常有用。它具有关于系统配置、运行进程、可用资源和文件系统的选项页。\n\
  \n### Conky\n\nConky 是一个高度配置且相当复杂的系统监控器，它占用系统资源，可以提供任何内容的信息。缺点是你需要学习如何配置它。仅仅从软件仓库安装\
  \ Conky 只是个开始。但对于我们这些希望在桌面上始终显示特定信息的人来说，它是无价的，花时间研究它是值得的。我们在这里提供了一个示例，但要真正体会 Conky\
  \ 的力量、灵活性可能性，请访问 `http://conkyhardcore.com/` 以及 Ubuntu 论坛上的这个长贴 `http://ubuntuforums.org/showthread.php?t=281865`。\n\
  \nConky 使用文本文件进行配置，通常使用短脚本启动。图 15.6 所示的示例来自 Matthew 桌面的个人配置，旨在作为一个让你入门的简单示例。在这个示例中，Matthew\
  \ 使用两个文件来运行 Conky。第一个称为 `conkyrc`，是一个文本文件，包含了你在图 15.6 中看到的内容的配置细节：\n\n```\n# 使用\
  \ Xft?\nuse_xft yes\n# 启用 Xft 时的 Xft 字体\nxftfont Ubuntu:size=9\n# 对齐下方起始点的像素数\n\
  #minimum_size 10 10\ngap_x 13\ngap_y 45\n# 文本对齐，其他可能的值已注释\n#alignment top_left\n\
  alignment top_right\n#alignment bottom_left\n#alignment bottom_right\n# 添加空格以防止内容移动？这只影响某些对象。\n\
  use_spacer right\n# 从已用内存中减去文件系统缓冲区？\nno_buffers yes\n# 使用双缓冲（减少闪烁，对所有人有效）\ndouble_buffer\
  \ yes\n# 允许图标出现、窗口移动和透明\nown_window yes\nown_window_type override\n# 如果你想让 Conky\
  \ 在后台运行\nbackground yes\n# 更新间隔（秒）\nupdate_interval 1\ncpu_avg_samples 1\nnet_avg_samples\
  \ 1\n# 开始显示配置 -\nTEXT\n${alignc}${color #EA6B36}$sysname\n${alignc}${color #EA6B36}${exec\
  \ cat /etc/issue} on $machine $hostname\n${color #EA6B36}Time:${color #E7E7E7} \
  \ $time\n${color #EA6B36}Load average:${color #E7E7E7}  $loadavg\n${color #EA6B36}Current\
  \ CPU usage:${color #E7E7E7}  ${color #EA6B36}CPU0:${color\n#E7E7E7}  ${cpu cpu0}%\
  \  ${color #EA6B36}CPU1:${color\n#E7E7E7}  ${cpu cpu1}%  ${color #EA6B36}CPU2:${color\n\
  #E7E7E7}  ${cpu cpu2}%  ${color #EA6B36}CPU3:${color\n#E7E7E7}  ${cpu cpu3}%  ${color\
  \ #EA6B36}CPU4:${color\n#E7E7E7}  ${cpu cpu4}%  ${color #EA6B36}CPU5:${color\n#E7E7E7}\
  \  ${cpu cpu5}%  ${color #EA6B36}CPU6:${color\n#E7E7E7}  ${cpu cpu6}%  ${color #EA6B36}CPU7:${color\n\
  #E7E7E7}  ${cpu cpu7}%\n```\n\n\n\n\n${color #EA6B36}CPU 使用率          ${alignr}PID\
  \     CPU%    MEM%\n\n${color #E7E7E7} ${top name 1}${alignr}${top pid 1}   ${top\
  \ cpu 1}   ${top mem 1}\n\n${color #E7E7E7} ${top name 2}${alignr}${top pid 2} \
  \  ${top cpu 2}   ${top mem 2}\n\n${color #E7E7E7} ${top name 3}${alignr}${top pid\
  \ 3}   ${top cpu 3}   ${top mem 3}\n\n${color #EA6B36}内存使用\n\n${color #E7E7E7} ${top_mem\
  \ name 1}${alignr}${top_mem pid 1}   ${top_mem cpu 1}\n\n${top_mem mem 1}\n\n${color\
  \ #E7E7E7} ${top_mem name 2}${alignr}${top_mem pid 2}   ${top_mem cpu 2}\n\n${top_mem\
  \ mem 2}\n\n${color #E7E7E7} ${top_mem name 3}${alignr}${top_mem pid 3}   ${top_mem\
  \ cpu 3}\n\n${top_mem mem 3}\n\n${color #EA6B36}RAM 使用率：color #E7E7E7} $mem/$memmax\
  \ - $memperc% $membar\n\n${color #EA6B36}交换分区使用：color #E7E7E7} $swap/$swapmax -\
  \ $swapperc% ${swapbar}\n\n${color #EA6B36}进程：color #E7E7E7} $processes  ${color\n\
  \n#EA6B36}运行中：color #E7E7E7} $running_processes ${color #EA6B36}\n\n${color #EA6B36}硬盘:\n\
  \n  / ${color #E7E7E7}${fs_used /}/${fs_size /} ${fs_bar /}\n\n  ${color #EA6B36}/TheLair\
  \ ${color #E7E7E7}${fs_used /media/TheLair}/${fs_size\n\n/media/TheLair} ${fs_bar\
  \ /media/TheLair}\n\n${color #EA6B36}无线网络：\n\n  ${color #EA6B36}ESSID：${color #E7E7E7}${wireless_essid\
  \ wlan0}  ${color\n\n#EA6B36}AP：${color #E7E7E7}${wireless_ap wlan0}\n\n ${color\
  \ #EA6B36}${exec iwconfig wlan0 | grep \"Frequency\" | cut -c 24-44}\n\n  ${color\
  \ #EA6B36}模式：${color #E7E7E7}${wireless_mode wlan0}  ${color\n\n#EA6B36}比特率：${color\
  \ #E7E7E7}${wireless_bitrate wlan0}\n\n  ${color #EA6B36}本地 IP ${color #E7E7E7}${addr\
  \ wlan0}  ${color #EA6B36}连接\n\n质量：${color #E7E7E7}${wireless_link_qual_perc wlan0}\n\
  \n  ${color #EA6B36}总下载：${color #E7E7E7}${totaldown wlan0}\n\n  ${color #EA6B36}总上传：${color\
  \ #E7E7E7}${totalup wlan0}\n\n  ${color #EA6B36}下载速度：${color #E7E7E7}${downspeed\
  \ wlan0}${color #E7E7E7}\n\n${color #EA6B36} 上传速度：${color #E7E7E7}${upspeed wlan0}\n\
  \n  ${color #E7E7E7}${downspeedgraph wlan0 15,150 ff0000 0000ff} $alignr${color\n\
  \n#E7E7E7}${upspeedgraph wlan0 15,150 0000ff ff0000}\n\n${color #EA6B36}有线网络：\n\n\
  \  ${color #EA6B36}本地 IP ${color #E7E7E7}${addr eth0} ${color #EA6B36}\n\n  ${color\
  \ #EA6B36}总下载：${color #E7E7E7}${totaldown eth0}\n\n  ${color #EA6B36}总上传：${color\
  \ #E7E7E7}${totalup eth0}\n\n  ${color #EA6B36}下载速度：${color #E7E7E7}${downspeed\
  \ eth0}${color #E7E7E7}\n\n  ${color #EA6B36} 上传速度：${color #E7E7E7}${upspeed eth0}\n\
  \n  ${color #E7E7E7}${downspeedgraph eth0 15,150 ff0000 0000ff} $alignr${color\n\
  \n#E7E7E7}${upspeedgraph eth0 15,150 0000ff ff0000}\n\n${color #EA6B36}公网 IP ${color\
  \ #E7E7E7}${execi 5 curl 'http://***a-website-that-returns-your-ip-address–see-below***'}\n\
  \n${color #EA6B36}端口 / 连接数：\n\n${color #EA6B36}入站：${color #E7E7E7}${tcp_portmon\
  \ 1 32767 count}  ${color\n\n#EA6B36}出站：${color #E7E7E7}${tcp_portmon 32768 61000\
  \ count}  ${color\n\n#EA6B36}总计：\n\n\n\n\n\n* [http://sourceforge.net/projects/schedutils/]—提供实时调度实用工具的各种项目主页。\n\
  * [www.ethereal.com/]—`ethereal`客户端主页。\n* [https://help.ubuntu.com/community/VNC]—在\
  \ Ubuntu 上设置虚拟网络计算（VNC）远程桌面软件。\n\n# 第 16 章 备份\n\n### 本章内容\n\n* 选择备份策略\n* 选择备份硬件和介质\n\
  * 使用备份软件\n* 复制文件\n* 配置文件的版本控制\n* 系统救援\n* 参考文献\n\n本章探讨了通过创建备份副本来保护数据、在必要时还原这些数据，以及在发生灾难性的硬件或软件故障时恢复数据的实践。本章将让你充分理解合理备份实践的原因。你可以利用此地的信息对哪些策略最适合你做出明智选择。本章还向你展示了如何独立执行某些类型的数据恢复和系统还原，并对何时寻求专业帮助提供了建议。\n\
  \n### 选择备份策略\n\n备份总是一种权衡。任何备份都会持续消耗时间、金和精力；备份必须经过监控、验证、索引和存储，并不断购买新介质。听起来很贵吗？不备份的代价是丢失你的关键数据。从头重新创建数据需要时间和金钱，如果重新做一遍的成本高于备份相关的成本，你就应该进行备份。从根本上说，备份无非为你或你的业务防止财务损失的保险。\n\
  \n制定并学习使用有效备份策略的第一步是选择适合你的策略。首先，你必须了解一些最常见（以及不常见）的数据丢失原因，以便更好地理解你的系统所面临的威胁。然后，你需要评估自己的系统、其使用情况和使用者、可用的硬件和软件资源以及你的预算限制。接下来的章节将详细介绍这些问题，并提供一些备份系统示例以及讨论它们的用途。\n\
  \n#### 为什么会发生数据丢失\n\n文件消失有很多原因：它们可能因为硬件故障导致数据丢失；你的注意力可能分散，导致不小心删除了或覆盖了文件。某些数据丢失是自然灾害和其他你无法控制的因素造成的。龙卷风、洪水或地震可能会发生，水管可能破裂，或者建筑可能起火。在这样的灾难中，你的数据以及硬件很可能会被毁。不满的员工可能会为了报复而破坏文件或硬件。任何设备都会故障，而且它们会在某个时刻失效——最可能是在它绝对不能故障的时候。\n\
  \n#### 案例\n\nHarris 最近对富富 500 高管的一项调查显示，大约三分之二的人在备份和灾难恢复计划上存在问题。你呢？\n\n数据还可能因为在尝试写入磁盘时发生故障而丢失。其他应用程序、实用程序和驱动程序可能编写得不好、存在\
  \ Bug（今天最常听到的话是“仍是测试版质量”），可能会遭受某些损坏，未能正确写入你刚刚创建的所有重要数据。如果发生这种情况，你的数据文件内容将是无法识别的垃圾，对任何人都没有用处。\n\
  \n所有这些意外和灾难都为拥有良好的备份策略提供了重要理由；然而，数据丢失最频繁的原因是人为错误。我们中谁没有用旧版本覆盖过新文件，或者无意中删除了需要的文件？这不仅适用于数据文件，也适用于配置文件和二进制文件。在浏览邮件列表、Usenet\
  \ 新闻组贴文或在线论坛时，删除整个 `/home`、`/usr` 或 `/lib` 等目录的故事似乎再常见不过了。在一个不经常修改或更新的稳定服务器上，你可以选择将\
  \ `/usr` 挂载为只读，以防止写入或删除其中的任何内容。错误地更改配置文件而不保存原始文件以备万一还原（这通常是因为人员配置不当）是另一个常见错误。\n\n\
  #### 提示\n\n要对即将编辑的配置文件进行备份，请使用 `cp` 命令：\n\n```\nmatthew@seymour:~$ cp filename filename.original\n\
  ```\n\n要还原它，使用以下命令：\n\n```\nmatthew@seymour:~$ cp filename.original filename\n```\n\
  \n永远不要编辑或移动 `*.original 文件`，否则原始副本将丢失。你可以将文件的模式改为不可写；这样如果你尝试删除它，系统将阻止你并收到警告。\n\n\
  适当的备份可以帮助你以最小的麻烦从这些问题中恢复，但你必须花精力保持备份更新、验证它们的完整性，并在不同的灾难场景下练习恢复数据。\n\n#### 评估你的备份需求和资源\n\
  \n现在你已经意识到需要某种计划来保护数据，像大多数人一样，对这一前景感到不知所措。关于数据备份和恢复已有大量的书籍、文章和白皮书。这个话题之所以如此复杂，是因为每个解决方案都是独特的。\n\
  \n然而，做出决策的方法非常简单。你通过询问以下问题开始过程：\n\n* 哪些数据必须受到保护？\n* 数据变化的频率是多少？\n\n这两个问题的答案决定了数据的重要性、数据量以及备份频率。这反过来决定了备份介质。只有这样才能选择适应所有这些考虑的软件（你将在本章后面学习如何选择备份软件、硬件和介质）。\n\
  \n可用资源是选择备份策略时的另一个重要考虑因素。备份需要时间、资金和人员。从确定你在所有资源方面面临的限制开始你的规划活动。然后，根据这些限制制定计划，或者通过对备份需求和成本进行仔细评估，为增加更多资源的必要性提供辩护。\n\
  \n#### 提示\n\n如果你不愿意或无法评估自己的备份需求并选择备份解决方案，大量的咨询顾问、硬件供应商和软件供应商非常乐意帮助你。在所在地区选择其中之一的最佳方法是询问其他\
  \ UNIX 和 Linux 系统管理员（通过用户组、讨论组或邮件列表找到），他们愿意分享经验并提供建议。如果你无法获得推荐，请要求咨询人员提供参考资料并进行核实。\n\
  \n许多人在制定计划时没有考虑时间因素。某些备份设备比其他设备快，某些恢复方法也比其他的快。你在做选择时需要考虑这一点。\n\n\n\n\n为了制定备份计划，你需要确定备份的频率。备份的必要频率取决于你系统中重要数据的变化快慢。在家庭系统中，大多数文件从不更改，少数文件每天更改，有些文件每周更改一次。处理这些情况不需要制定任何复杂的策略。对于家庭使用，一种良好的策略是频繁地备份关键数据（到任何种的可移动介质上），并每周备份一次配置和其他文件。\n\
  \n在具有多个用户的大型系统企业级，则需要不同的方法。某些关键数据在不断变化，而且重新创建它们的成本非常高昂；这通常涉及复杂且昂贵的解决方案。我们大多数人处于这些极端之间的某个位置。评估你的系统及其用途，以确定你处于这一光谱的什么位置。\n\
  \n备份方案和硬件可以是复杂的也可以简单的，但它们都要求一个可行的计划和忠实的执行。即使是最好的备份计划，如果不执行过程、不验证数据以及不定期进行数据恢复练习，也是徒劳的。无论你选择何种备份方案，务必确保包含以下三个原则：\n\
  \n- **要有计划**——设计一个符合你需求的计划，并准备与任务相应的设备。这涉及到评估影响你正在备份的数据的所有因素。我们将在本章后面的部分详细介绍细节。\n\
  - **执行计划**——忠实地完成备份策略的每个部分，然后验证存储在备份中的数据。损坏数据的备份对任何人都没有用。即使是备份操作也可能出错。\n- **练习你的技能**——定期练习从你的备份系统中恢复数据，这样当灾难来临时，你已经准备好（并能够）从备份计划的力量中受益。（有关恢复数据，请参见\
  \ `Using Backup Software` 章节。）请记住，你的备份计划中的缺陷完全可能在你尝试恢复时才会显现。）\n\n# 良好的实践\n\n你必须创建属于自己的最佳备份计划，但这里是构成任何可靠备份程序基础的一些构建模块：\n\
  \n- 维护关键数据的多份副本。\n- 为备份标记标签。\n- 将备份存储在气候控制且安全的区域。\n- 对关键数据进行安全的异地存储。许多公司选择银行金库作为异地存储地，这是被高度推荐的。\n\
  - 建立合理且可以严格遵守的备份策略。尝试在系统一致时（即没有数据正在被写入）备份你的数据，这通常是在半夜。\n- 跟踪谁有权访问你的备份介质，并将人数保持尽可能低。如果可以，只允许可信的人员接触你的备份。\n\
  - 定期验证备份并练习从它们恢复数据。\n- 定期检查备份介质的缺陷并定期更换它们（如果数据敏感，请先销毁其上的数据）。\n\n# 评估备份策略\n\n既然你已经确信需要备份，你需要一个策略。要具体说明一个理想策略是很困难的，因为每个用户或管理员的策略将是高度个性化的，但这里有几个通用的示例：\n\
  \n- **家庭用户**——在家里，用户拥有 Ubuntu 安装 DVD，重新安装只需不到一小时，因此时间问题不是主要考虑因素。家庭用户想要备份任何更改过的配置文件，保留任何下载过的文件的存档，并保留在使用任何应用程序时创建的任何数据文件的存档。除非家庭用户有一个持续备份有用的特殊项目，否则每周备份可能足够了。家庭用户可能会使用\
  \ `DVD-RW`、外部硬盘或其他可移动介质进行备份。\n- **小型办公室**——许多小型办公室倾向于使用与家庭用户相同的策略，但更有可能每天备份关键数据并使用手动更改的磁带驱动器。如果他们有存储充足的磁带驱动器，他们可能会有一个全系统备份，因为从磁带恢复比从\
  \ CD 重新安装要快。他们还可能使用 `CD-RW` 或 `DVD` 刻录机备份。虽然他们会使用脚本来自动化备份，但大部分工作可能是手动完成的。\n- **小型企业**——这里备份开始需要更高级设备，例如带有全自动备份功能的自动加载磁带驱动器。商业备份软件通常在这一级别引入，但一个预算有限的熟练系统管理员可以使用本章讨论的基础应用程序之一。备份是高度结构化的，并由专门的系统管理员监督。\n\
  - **大型企业**——这些是最可能使用昂贵的、专有的、高度自动备份解决方案的设置。在这个级别，数据意味着钱，数据丢失意味着丢钱，恢复数据的延迟也意味着金钱损失。这些系统管理员知道备份是必要的保险，并以此制定计划。\n\
  \n这一切是否意味着企业级备份优于家庭用户做的备份？完全不是。使用 Ubuntu 的“小人物”可以做得和企业运营一样好，代价是在过程中投入更多时间。通过研究高级策略，我们可以将有用的概念应用到各个领域。\n\
  \n# 注意\n\n如果你是一个新的系统管理员，你可能会继承现有的备份策略。花些时间检查它，看看它是否满足组织的当前需求。思考你的组织真正需要什么样的备份保护，并确定当前策略是否满足该需求。如果不满足，请更改策略。考虑用户是否正在执行当前策略，如果没有，原因是什么不执行。\n\
  \n# 备份级别\n\nUNIX 使用“备份级别”的概念作为一种简写方式，指代相对于上一次备份备份了多少数据。它的工作方式如下：\n\n级别 0 备份是全备份。下一个备份级别是\
  \ 1。\n\n其他数字级别的备份将备份自从该级别或数值更高级别的上一次备份以来更改的所有内容。（例如，`dump` 命令提供了 10 种不同的备份级别）。例如，第\
  \ 3 级后接第 4 级会生成一个自全备份的增量备份，而第 4 级后接第 3 级会生成两者之间的差异备份。\n\n接下来的章节将检查今天使用的许多策略中的几种。许多策略是基于这些示例方案的其中其中可以作为为你自己构建的策略的基础。\n\
  \n## 简单策略\n\n如果你只需要备份几个配置文件和小一些数据文件，将它们拷贝到 USB 盘上，开启写保护开关，并将其存放在安全的地方。如果你只需要更多的备份存储容量，可以将重要文件拷贝到\
  \ `CD-RW` 磁盘（大小最大 700MB）或 `DVD-RW` 磁盘（大小最大 8GB）。许多用户已切换到使用外部硬盘进行备份，因为它们变得越来越便宜，并且可以存储大量数据。\n\
  \n除了配置和数据文件之外，还应该存档每个用户的 `/home` 目录和整个 `/etc` 目录。这两个目录之间，该备份包含了小型系统的大部分重要文件。然后，如果有必要，在完全重新安装\
  \ Ubuntu 后，你可以轻松地从选择的备份介质设备恢复这些数据。\n\n\n\n专家们常说，如果你数据量超过了软磁盘的容纳能力，你真的需要一个正式的备份策略。因为软磁盘只能容纳略大于\
  \ 1MB 的数据（而且现在已经极其过时），也许我们应该把这改为“如果你数据量超过了一个廉价 USB 闪盘的容纳能力”。无论如何，接下来的章节将讨论一些正式的备份策略。为了方便起见，我们以磁带质备份作为示例，因为它们在过去非常流行且是标准，即使在人们转向移动硬盘和云存储等新选择时，它们仍然相当常见。\n\
  \n## 定期全备\n\n这种备份策略涉及按每周、每两周或其他周期对整个文件系统进行备份。备份的频率取决于被备份的数据量、数据更改的频率以及丢失这些更改的成本。\n\
  \n这种备份策略的执行并不复杂，可以使用本章后部分讨论的可插拔硬盘驱动器来实现。如果你连接到网络，可以将数据镜像到另一台机器上（最好是异地）；`rsync` 工具特别适合这项任务。请注意，这并不能解决对文件近期状态存档的需求；它仅提供了更新完成时的系统快照。\n\
  \n## 增量备份结合全备\n\n这种方案涉及每周执行一次整个系统的全备，并每天对前一天发生变化的文件进行增量备份，这开始变得像中大型系统管理员传统上所使用的方法。\n\
  \n这种备份方案可以通过两种方式进行改进。其一，每次增量备份都可以以原始全备为参考进行进行。换句话说，在级 0 备份之后，接的是一系列级 1 备份。这种备份方案的优点是，恢复时只需要两块磁带（全备和最近的增量备份）。但因为引用了全备，在频繁使用的的系统上，每个增量备份可能会很大（并变得越来越大）。\n\
  \n另一种，每个增量备份可以以上一次增量备份为参考。这是一个级 0 备份，后跟一个级 1 备份，然后是级 2 备份，依此类推。增量备份速度更快（每次数据量较少），但需要每块磁带才能恢复一个完整的系统。再次，这是一个经典的权衡决策。\n\
  \n现代商业备份应用（如 `Amanda` 或 `BRU`）有助于组织管理复杂备份计划和跟踪备份介质的过程。自己使用经典的 `dump` 或采用 shell 脚本运行\
  \ `tar` 要求系统管理员亲自处理所有的组织工作。出于如此，复杂的备份情况通常由供应商包装、销售并支持的商业软件和专用硬件来处理。\n\n## 数据镜像或\
  \ RAID 阵列\n\n在充足（通常是昂贵的）的硬件资源下，你始终可以将数据镜像到其他地方，本质上是在手头保留一份数据的实时副本。如果不涉及大量数据，这通常是一个廉价且可行的解决方案。使用独立磁盘冗余（RAID）阵列（在其某些形式）可以在磁盘故障时提供恢复。\n\
  \n注意，RAID 阵列和镜像系统写入损坏数据和写入有效数据一样。此外，如果文件被删除，RAID 阵列不会保存它。RAID 阵列最适合保护运行系统的当前状态，而不是用于备份需求。\n\
  \n### 选择\n\n只有你才能决定什么对你的情况最好。在阅读完书中的备份选项后，制定一些示例备份计划；运行几个可能的场景并评估你选择的有效性。\n\n除了你学关于备份策略的所有其他信息外，在做选择时有两个值得的黄金法则：\n\
  \n- 如果备份策略和策略太复杂（这对大多数安全问题也是如此），它最终会被忽视并作废。\n- 最好的方案通常是策略的组合；使用实用的方法。\n\n## 选择备份硬件和介质\n\
  \n任何可以存储数据的设备都可以用于备份，但那就像是说任何带轮子的东西都能带你进行跨国旅行一样。试图将 10GB 的数据塞进一大堆 CD-RW 中是一次令人沮败的尝试，而使用昂贵的自动磁带设备来保存一份邮件副本则是对资源的浪费。\n\
  \n许多人使用他们已有的硬件进行备份操作。许多消费级工作站配有 DVD-RW 驱动器，但它们通常不具备执行和存储多次全备所需的充足空闲磁盘空间。\n\n在本节中，你将了解一些最常用的备份硬件，以及如何评估它们对你备份需求的适用性。随着大容量设备变得越来越廉价（2TB\
  \ 硬盘现在的价格大约为 100 美元），针对小型企业和家庭用户的备份硬件决策变得更有趣了。\n\n### 可移动存储介质\n\n选择正确的介质并不像过去当软磁盘是唯一选择时那么简单了。如今，大多数机器都有\
  \ DVD-ROM 驱动器，可以读取但不能写入 DVD，这排除了它们用于备份的可能性。相反，USB 硬盘和固态“优盘”接管了以前由软磁盘占据的领域。你可以花不到\
  \ 10 美元买到一个 4GB 的硬盘，如果你多处比较，甚至可以以优惠的价格买到 128GB 的容量。USB 硬盘和固态硬盘都高度可便携。`Ubuntu` 对这些硬盘的支持非常好，而且存储空间正在增加而价格持续下降。一个\
  \ 1TB 的 USB 移动硬盘花费约 50 美元。USB 硬盘最大的优点是数据传输速度和便携性。\n\n### CD-RW 和 DVD+RW/-RW 驱动器\n\
  \n与软磁盘和某些移动磁盘相比，CD-RW 驱动器及其姐妹机 DVD+RW/-RW 可以存储大量数据，对小型企业有用。曾经昂贵的刻录机和介质现在已成为商品价格，但用于自动备份大量数据的自动换盘机仍然昂贵。CD\
  \ 和 DVD 存储相对于磁带设备的优点是，存档的未压缩文件系统可以挂载并像硬盘一样随机访问其文件（这使得单个文件的恢复更容易）。\n\n每张 CD-RW 磁盘可以存储\
  \ 650MB 到 700MB 的数据（介质提供的两种容量价格相近）；较大的数据块可以拆分以适应多张磁盘。某些备份程序支持这种存储方式。在刻录和验证后，介质的保质期至少为十年或更久。\n\
  \n坦率地说，这些是过时的技术，尽管它们还没有完全消失，但使用 CD 或 DVD 进行备份的情况已经大幅减少。不久后，它们将像软磁盘和驱动器一样罕见。\n\n\
  #### 网络存储\n\n\n\n\n\n对于网络备份存储，远程硬盘阵列为数据存储提供了一种解决方案。随着大规模存储设备成本的下降和对更大存储空间需求的日益增长，Linux\
  \ 提供了并支持网络存储（`NAS` 或网络附属存储）。这些系统是装满了硬盘及其相关控制电路的机柜，以及用于管理所有内容的特殊软件。这些 NAS 系统连接到网络，充当一个巨大的（且昂贵的）海量存储设备。\n\
  \n更简单、简单的网络存储可以在具有足够存储空间的远程桌面型机器上实现（配备多达八块 `1TB` 硬盘已经是巨大的存储空间，使用现成零件即可轻松），但这样该机器（以及本地系统管理员）必须处理备份、保护和恢复自身数据的所有问题，不是吗？几家硬件供应商提供了不同尺寸的产品。\n\
  \n## 磁带驱动备份\n\n磁带驱动从初就应用于计算机行业。磁带存储在行业中非常流行，以至于 `tar` 命令（最常用的归档命令）源于 `tape archive`（磁带存档）一词。磁带的容量和耐用性随类型而异，从几千字节到数百千字节不等，相应的设备和介质成本也随之增加。自动装带磁带驱动系统可以容纳超过文件系统容量的归档。\n\
  \n> **提示**\n> 旧的磁带设备在二手设备市场上很常见，对于已经超出受限备份设备选项的小型业务来说可能有用。\n\nLinux 对磁带设备支持良好，在维护得当的情况下极其可靠。考虑到其存储容量和重复使用的能力，磁带本身是非常便宜的。然而，请注意，磁带会随着时间的推移而老化，而且由于是机械设备，磁带驱动可能会故障。\n\
  \n> **警告**\n> 忽视清洁、对齐和维护磁带驱动将使你的数据面临风险。磁带本身也容易受到机械损坏和老化。硬件维护是良好备份策略的一部分。永远不要忘记，硬件故障是何时发生而非是否发生的问题。\n\
  \n## 云存储\n\n如亚马逊的 `AWS` 和 `S3` 或 Canonical 的 `Ubuntu One` 等服务提供了一种离线创建和存储备份的方法。较大的公司也可以创建自己的离线在线存储选项。在这些及类似的情况下，数据被复制并远程存储在专门为该目的设置的文件服务器上。数据备份可以根据客户的计划和需求进行非常灵活的调度。这些选项通常比普通家庭用户需要的要贵，但并不总是如此，例如\
  \ `Ubuntu One` 提供的高达 `2GB` 的免费存储空间，可以轻松地与你的 `Ubuntu` 桌面同步，并提供付费增加空间的的选项。\n\n云存储是一种近期出现并日益受欢迎的备份解决方案，但它也是一项快速变化的技术。要了解更多此处提到的选项，请查看\
  \ [`one.ubuntu.com/`](https://one.ubuntu.com/) 和 [`aws.amazon.com/s3/`](http://aws.amazon.com/s3/)。虽然这些不是唯一的此类服务，但它们对该概念提供了很好的介绍。如果你想自己动手，你绝对想看看\
  \ `www.ubuntu.com/cloud` 上的 `Ubuntu Enterprise Cloud`。\n\n## 使用备份软件\n\n由于存在许多情况，`tar`\
  \ 提供了许多选项。为了简单起见，假设你每天进行增量备份。\n\n> **注意**\n> `tar` 命令与 `find` 配合使用定位文件。对于备份系统，`find`\
  \ 与硬件配合。\n\n## `tar`: 最基础的备份工具\n\n`tar` 命令用于创建归档文件。例如，这里是备份 `/etc` 的命令：\n\n```bash\n\
  sudo tar cvf etc /etc\n```\n\n或者，如果将 `tar` 的输出发送到标准输出并重定向到文件：\n\n```bash\nsudo tar\
  \ cv /etc > etc.tar\n```\n\n 使用 使用 `tar` 创建全和增量备份\n\n如果你想创建一个全备份，以下命令将创建一个整个系统的\
  \ `bz2` 压缩 tar 包：\n\n```bash\nsudo tar cvjf backup.bz2 /\n```\n\n要执行增量备份，你必须找到自上次备份以来更改的所有文件。要找到这些文件，请使用\
  \ `find` 命令：\n\n```bash\nsudo find / -newer name_of_backup_file ! -a -type f -print\n\
  ```\n\n将我们的 `find` 命令的输出通过管道传递给 `tar`，如下所示：\n\n```bash\nsudo find / -newer name_of_backup_file\
  \ ! -type d -print | tar czT - backup_file_name_or_device\n```\n\n> **注意**\n> `-T`\
  \ 选项从缓冲区获取文件名（`-` 是缓冲区的简写名称）。\n\n### 使用 `tar` 从归档中恢复文件\n\n`tar` 中的 `xp` 选项从备份中恢复文件并保留文件属性，同时\
  \ `tar` 会创建它所需的任何子目录。你应该使用 `tar` 的 `tvf` 选项在提取之前列出归档中的文件，这样你就知道它们将被放置在何处。\n\n\n\n\
  \n\n例如，要恢复使用 `bzip2` 压缩的 `tar` 归包，请使用以下：\n\n```bash\nmatthew@seymour:~$ sudo tar\
  \ xjvf ubuntutest.tar.bz2\n```\n\n要列出用 `bzip2` 压缩的 `tar` 归包的内容，请使用这个：\n\n```bash\n\
  matthew@seymour:~$ sudo tar tjvf ubuntutest.tar.bz2\n```\n\n```bash\ntar: Record\
  \ size = 8 blocks\ndrwxr-xr-x matthew/matthew           0 2010-07-08 14:58 other/\n\
  -rwxr-xr-x matthew/matthew      1856 2010-04-29 14:37 other/matthew helmke public.asc\n\
  -rwxr-xr-x matthew/matthew      170 2010-05-28 18:11 backup.sh\n-rwxr-xr-x matthew/matthew\
  \      1593 2009-10-11 10:38 backup method\n```\n\n注意，由于路径没有以反斜杠开头，它们是相对路径，并将安装到你的当前工作目录中。如果它们是绝对路径，它们将精确安装在路径所在的位置。\n\
  \n### GNOME File Roller\n\nGNOME 桌面归档图形化应用 File Roller (`file-roller`) 可以 `tar`、`gzip`、`bzip`、`compress`、`zip`、`rar`、`lha`\
  \ 以及其他几种压缩格式查看、提取和创建归档文件。注意，File Roller 仅是实际提供这些压缩格式的命令行工具的前端；如果没有安装这些工具，File Roller\
  \ 就无法使用该格式。\n\n### 注意事项\n\n如果你选择了一个安装软件不支持的压缩格式，File Roller 不会报错，直到你尝试创建归档之后才会报错。因此，请先安装任何所需的压缩工具。\n\
  \nFile Roller 与 GNOME 桌面环境集成良好，可以与 Nautilus 文件管理器提供方便的拖放功能。要创建新归档，选择“Archive（归档）”、“New（新建）”以打开“新建归档”对话框，并导航到你想存放归档的目录。在“新建归档”对话框底部的“Selection:\
  \ /root”文本框中输入你的归档名称。使用“Archive type”下拉菜单选择压缩方法。现在，从 Nautilus 将你想要包含的文件拖入 File Roller\
  \ 窗口的空白区域，动画图标将显示文件正在被包含在新归档中。完成后，之前为空的 File Roller 窗口中会出现文件列表。要保存归档，选择“Archive（归档）”、“Close（关闭）”。打开归档只需使用“Archive（归档）”、“Open（打开）”对话框选择相应的归档文件。你可以在\
  \ [`help.ubuntu.com/community/File%20Roller`](https://help.ubuntu.com/community/File%20Roller)\
  \ 了解更多。\n\nUbuntu 还提供了 KDE 的 `ark` 和 `kdat` GUI 工具用于备份；它们仅在安装期间选择 KDE 桌面时才会安装，但你可以通过\
  \ Synaptic 搜索找到它们。传统上，归档是系统管理员的功能，而不被认为是个人用户的任务，因此认为没有必要复杂的 GUI。备份也被视为一项脚本驱动的自动化任务，在这种任务中\
  \ GUI 的用处并不大。虽然对系统管理员来说确实如此，但家庭用户通常想要更具吸引力且更容易使用的东西，这正是 `ark` 创建时要填补的空白。\n\n###\
  \ KDE `ark` 归档工具\n\n你可以通过命令行启动 `ark`。它与 KDE 桌面集成（就像 File Roller 之于 GNOME 那样），所以如果你使用\
  \ KDE，它可能是一个更好的选择。该应用程序提供了一个图形界面，用于查看、创建、添加和从归档文件中提取内容。`ark` 提供了若干配置选项以确保其与 Microsoft\
  \ Windows 的兼容性。你可以从 KDE 桌面或 Konqueror 文件浏览器拖放文件来添加或提取文件，也可以使用 `ark` 菜单。\n\n只要安装了相关的命令行程序，`ark`\
  \ 就可以处理 `tar`、`gzip`、`bzip2`、`zip` 和 `lha` 文件（后四者是通过压缩归档文件来节省空间的压缩方法）。\n\n在启动程序本身后打开现有的归档。你可以向归档中添加文件和目录，或从归档中删除它们。打开归档后，你可以提取其所有内容或单个文件。你还可以使用模式（例如所有\
  \ `*.jpg` 文件）进行搜索来选择文件。\n\n从 File 菜单中选择 New（新建）可以创建新归档。你然后输入归档名称，提供相应的扩展名（`.tar`、`.gz`\
  \ 等），然后按照意愿添加文件和目录。\n\n### Déjà Dup\n\nDéjà Dup 是一个带有实用 GUI 的简单备份工具。它支持本地、远程或云备份。它可以对你的数据进行加密和压缩，以实现安全快速的传输等功能。在\
  \ Dash（活动）中搜索 Déjà Dup（参见图 16.1）。\n\n![Image](img/16fig01.jpg)\n\n图 16.1 Déjà Dup\
  \ 图标在 Dash 中很容易找到。\n\n从 Déjà Dup Backup Preferences（Déjà Dup 备份偏好）开始。此菜单会弹出一个配置向导，允许你设置备份存储位置、备份内容、自动备份计划等。以下截图说明了操作过程（参见图\
  \ 16.2）、16.3 和 16.4。\n\n![Image](img/16fig02.jpg)\n\n图 16.2 存储选项包括云存储、本地、通过 FTP\
  \ 或 SSH 等。\n\n![Image](img/16fig03.jpg)\n\n图 16.3 设置你想要备份或排除的文件和文件夹。\n\n![Image](img/16fig04.jpg)\n\
  \n图 16.4 设置自动备份计划。\n\n完成配置后点击 Close（关闭）。当你准备好在稍些时候运行 Déjà Dup 时，点击 Dash 中相同的图标。这将显示带有\
  \ Overview（概览）选项页的界面。点击 Restore（恢复）从之前的备份中恢复。点击 Back Up Now（立即备份）使用已启用的设置进行备份（参见图\
  \ 16.5）。\n\n![Image](img/16fig05.jpg)\n\n图 16.5 从 Déjà 概览进行备份和恢复非常简单。\n\n### Back\
  \ In Time\n\n对于许多用户来说，Back In Time 是 Déjà Dup 的可行替代方案。它可以很容易从 Ubuntu 软件中心获取，运行稳定，界面清晰易懂，实际上实际上是良好工具的\
  \ GUI 前端。\n\nBack In Time 使用 `rsync`、`diff` 和 `cp` 来监控、创建和操作文件，并使用 `cron` 调度运行时间。这些命令行工具的使用将在本文稍后介绍。Back\
  \ In Time 是一个为 GNOME 设计的良好的 GUI 前端，也适用于 Ubuntu 的 Unity 界面。Back In Time 在 Ubuntu\
  \ 软件中心还提供了一个独立的 KDE 前端包，如果那是你的偏好。如果你使用标准的 Ubuntu 界面，从 Ubuntu 软件中心安装名为 `nautilus-actions`\
  \ 的包以获取某些备份功能的右键菜单访问。\n\n第一次运行 Back In Time 时，会对驱动器进行快照。这需要很长时间，取决于你的数据量。你指定要备份的文件和目录以及备份位置。然后设置备份计划。程序将处理其余工作。\n\
  \n要进行恢复，从屏幕左侧列表中选择最近的快照（参见图 16.6）。然后浏览右侧的目录和文件列表，直到找到你感兴趣的文件。你可以右键点击文件查看弹出菜单，从菜单中打开文件、将文件复制到所需位置，或查看文件的各种快照并进行比较，以确定你想恢复哪一个。\n\
  \n![Image](img/16fig06.jpg)\n\n图 16.6 Back In Time 让查找和恢复文件变得简单。\n\n\n\n\nBack In\
  \ Time 保留了多个操作和活动日志、文件更改及版本，是一个非常有用的工具。但它确实有一个主要的缺点：目前，它仍然无法调度网络上的备份任务。如果你是将数据备份到第二个硬盘，或者你的系统始终挂载着一个网络驱动驱动器，那么这就不是问题。然而，如果你想备份到云存储或通过\
  \ `ssh` 进行备份，这个工具可能不符合你的需求。\n\n你可以在 [`backintime.le-web.org`](http://backintime.le-web.org)\
  \ 找到 Back In Time 的官方文档。\n\n### Unison\n\nUnison 是一项跨平台的文件同步工具，支持 Linux、其他 UNIX\
  \ 变体（如 Solaris 和 Mac OS X）以及 Windows。一旦设置好，它就可以双向且跨平台同步文件。如果两端都进行了更改，文件将在双端更新。当发生文件冲突时（例如在每个系统上都修改了同一个文件），系统会提示用户决定如何处理。Unison\
  \ 可以使用包括 `ssh` 在内的许多协议跨网络进行连接。它可以同时连接并同步许多系统，甚至连接云端。\n\nUnison 是宾夕法尼亚大学几位学者开发的一项研究项目。它已不再作为研究项目进行活跃开发，但似乎仍在持续维护，并进行错误修复和极少数的功能添加。原始开发者声称他们仍每天都在使用它，因此它并没有被完全遗弃。\n\
  \nUnison 强大且可配置配置。它的基础基于 `rsync`，但增加了一些功能，使其实现了通常只有版本控制系统才具备的功能。请参阅第 34 章“机会性开发”以了解这些内容，在本章稍后备份配置文件的部分也对其进行了简要提及。\n\
  \n尽管该项目不再是任何开发者的主要关注，但仍有许多在使用 Unison，而且它经常获得媒体报道，正如最近的一篇 *Linux Journal* 文章中所提到的。正因如此，在本章中提到了它，如果你感兴趣，它可能值得你投入时间和精力。Unison\
  \ 以免费的 GPL 许可证发布，因此你可能决定深入研究其代码。开发者没有时间定期维护它，但欢迎补丁和贡献。如果这个项目听起来对你有吸引，请访问 [www.cis.upenn.edu/~bcpierce/unison/](http://www.cis.upenn.edu/~bcpierce/unison/)。\n\
  \n### 使用 Amanda 备份应用程序\n\nAmanda 是由马里兰大学大学城分校创建的一个强大的网络备份应用程序。Amanda 是一个健壮的备份和恢复应用程序，最适用于具有足够容量自动加载磁带的无人值备份。它受益于良好的用户支持和文档。\n\
  \nAmanda 的功能包括压缩和加密。它旨在用于高容量磁带、floptical、CD-R 和 CD-RW 设备。\n\nAmanda 使用 GNU `tar`\
  \ 和 `dump`；它旨在用于无人值的自动磁带备份，不适用于交互式或临时的备份。Amanda 对磁带设备的支持非常稳健，文件恢复也相对简单。尽管 Amanda\
  \ 不支持旧版本的 Macintosh 客户端，但它使用 Samba 备份 Microsoft Windows 客户端，以及任何可以使用 GNU 工具的 UNIX\
  \ 客户端（包括 Mac OS X）。由于 Amanda 运行在标准的 GNU 工具之上，即使 Amanda 服务器不可用，也可以在恢复盘上使用这些工具进行文件恢复。文件压缩可以在客户端或服务器上进行，从而减轻需要备份的性能较弱机器的计算负载。\n\
  \n> **注意**\n> \n> Amanda 不支持大于单磁带的 `dump` 镜像，并且每次运行都需要一张新磁带。如果你忘记更换磁带，Amanda 会继续尝试备份，直到你插入新磁带，但这些备份无法按你预期的方式捕捉数据。不要使用太小的磁带或忘记更换磁带；否则你将对结果不满意。\n\
  \nAmanda 没有图形界面（GUI）。配置遵循传统的 UNIX 传统，通过编辑位于 `/etc/amanda` 的文本配置文件来完成。Ubuntu 的默认安装包含一个示例\
  \ `cron` 文件，因为预计你将使用 `cron` 定期运行 Amanda。客户端工具通过包 `amanda-client` 进行安装；Amanda 服务器称为\
  \ `amanda-server`。请将两者都安装。在备份方案方面，Amanda 会动态计算一个优的方案并据此进行调度。可以强制它遵循传统方案，但其他工具可能更适合这项工作。\n\
  \nAmanda 的 man 页（客户端是 `amdump`）编写得很好且有用，它既解释了 Amanda 的配置，又详细介绍了实际上构成 Amanda 的几个程序。在\
  \ `/etc/amanda` 中找到的配置文件注释详尽；它们提供了许多示例来协助你配置。\n\n该程序的主页是 [www.amanda.org](http://www.amanda.org)。在那里你可以找到关于订阅邮件列表的信息，以及与\
  \ Amanda 相关项目的链接和常见问题解答（FAQ）。\n\n### 备备份软件\n\n商业和其他免费软件备份产品确实存在；BRU 和 Veritas 是有效商业备份产品的良好示例。以下是一些\
  \ Ubuntu 未预装的实用免费软件备份工具：\n\n*   **flexbackup**——这个备份工具是一个大型 Perl 脚本文件，使得 `dump`\
  \ 和 `restore` 变得更容易使用。通过使用带有 `-help` 参数的命令可以 `flexbackup` 的命令语法。它可以使用 `afio`、`cpio`\
  \ 和 `tar` 在本地或通过 `rsh` 或 `ssh` 网络创建并恢复归档。它的主页是 [www.edwinh.org/flexbackup/](http://www.edwinh.org/flexbackup/)。注意，它已经很久没有收到任何更新或更改了。\n\
  *   **afio**——该工具创建 `cpio` 格式的归档，但比 `cpio` 更好地处理输入损坏（`cpio` 根本不处理输入损坏）。它在交互操作期间支持多卷归档并可以创建压缩归档。如果你觉得有必要使用\
  \ `cpio`，你可能想查看 [`freshmeat.net/projects/afio/`](http://freshmeat.net/projects/afio/)\
  \  `afio`。\n\n### 复制文件\n\n通常，当你只有几个文件需要防止丢失或损坏时，简单地将单个文件复制到另一个存储介质比为它们创建归档更有意义。你可以使用\
  \ `tar`、`cp`、`rsync` 甚至 `cpio` 命令来执行此操作，还可以名为 `mc` 的方便的文件管理工具。使用 `tar` 是传统的选择，因为旧版本的\
  \ `cp` 有时处理符号链接和权限并不良好，导致这些属性（文件的特征）丢失；`tar` 处理这些文件属性的方式更好。`cp` 已经改进以修复这些问题，但 `tar`\
  \ 仍然被更广泛的使用。`rsync` 最近被添加到 Ubuntu 中，它是文件镜像（特别是通过网络进行时）极极选择。\n\n为了说明如何使用文件复制作为备份技术，这里的示例展示了如何复制（而非归档）目录树。该树包含了符号链接和具有我们需要保持完的特殊文件权限的文件。\n\
  \n#### 使用 `tar` 复制文件\n\n\n\n\n\n将文件复制到另一个位置的方案之一是使用 `tar` 命令；你只需要创建一个 `tar` 文件，并将其传递给\
  \ `tar` 以在新位置进行解压。要实现这一点，首先切换到源目录。然后，整个命令如下：\n\n```bash\nmatthew@seymour:~$ tar\
  \ -cvf files | (cd target_directory ; tar -xpf)\n```\n\n在此命令中，`files` 是你想要包含的文件名；使用\
  \ `*` 可以包含整个当前目录。\n\n以下是该命令的工作原理：你已经切换到了源目录，并带有 `cvf` 参数执行了 `tar`，这些参数告诉 `tar` 执行以下操作：\n\
  \n• `c`—创建归档。\n• `v`—详细模式；列出正在处理的文件，以便我们看到它正在运行。\n• `f`—归档的文件名将紧随其后。（在本例中，它是 `-`。）\n\
  \n以下 `tar` 命令对于创建备份目的的文件副本非常有用：\n\n• `l`—留在本地文件系统中（这样你就不会包含远程卷卷）。\n• `atime-preserve`—不要更改文件的访问时间，即使你现在正在访问它们（为了归档目的保留旧的访问信息）。\n\
  \n`tar` 文件的内容（临时存储在名为 `-` 的缓冲区中）随后被传递给第二个表达式，该表达式将文件提取到目标目录。在 shell 编程中（参见第 13 章“自动化任务与\
  \ Shell 脚本”），用括号括起表达式会导致其在子 shell 中运行并优先执行。\n\n首先，我们切换到目标目录，然后：\n\n• `x`—从 `tar`\
  \ 归档中提取文件。\n• `p`—保留权限。\n• `f`—文件名将为 `-`，即存储 `tar` 归档文件的临时缓冲区。\n\n### 压缩、加密和发送 `tar`\
  \ 流\n\n上一节中使用 `tar` 命令的文件复制技术也可以用于跨局域网（LAN）或互联网快速、安全地复制目录结构（使用 `ssh` 命令）。利用这些技术的一种方法是使用以下命令行首先压缩指定目录的内容，然后将压缩并加密的归档流解压到远程主机上的指定目录中：\n\
  \nbash\nmatthew@seymour:~$ tar -cvzf data_folder | ssh remote_host '( cd ~/mybackup_dir;\
  \ tar -xvzf )'\n```\n\n`tar` 命令用于创建、列出和压缩名为 `data_folder` 目录中的文件。输出通过 `ssh`（安全 Shell）命令管道传递到名为\
  \ `remote_host` 的远程计算机。在远程计算机上，流将被提取并保存到名为 `/~/mybackup_dir` 的目录中。系统会提示输入密码以发送流。\n\
  \n### 使用 `cp` 复制文件\n\n要复制文件，我们可以使用 `cp` 命令。当用于简单复制时，命令的通用格式如下：\n\n```bash\nmatthew@seymour:~$\
  \ cp -a source_directory target_directory\n```\n\n`-a` 参数等同于给出 `-dpR`，具体如下：\n\n\
  • `-d`—保留符号链接（通过不对其进行引用），并复制它们指向的文件，而不是复制链接本身。\n• `-p`—在可能的情况下保留所有文件属性。（文件所有权可能会干扰。）\n\
  • `-R`—递归复制目录。\n\n`cp` 命令还可以通过使用 `-avR` 命令行选项来快速复制目录并保留权限。使用这些选项可以保留文件和目录权限，提供详细输出，并递归复制和重建子目录。在备份期间，还可以通过这样重定向标准输出来创建备份日志：\n\
  \n```bash\nmatthew@seymour:~$ sudo cp -avR directory_to_backup destination_vol_or_dir\
  \ 1 > /root/backup_log.txt\n```\n\n或者\n\n```bash\nmatthew@seymour:~$ sudo cp -avR\
  \ ubuntu /test2 1 > /root/backup_log.txt\n```\n\n此示例在名为 `/test2` 的卷上对名为 `/ubuntu`\
  \ 的目录进行了复制，并在 `/root` 下保存了名为 `backup_log.txt` 的备份报告。\n\n### 使用 `mc` 复制文件\n\nMidnight\
  \ Commander（可在 Universe 仓库中找到，软件包名为 `mc`；请参见第 9 章“管理软件”以了解如何启用 Universe 和 Multiverse\
  \ 仓库）是一个命令行文件管理器，对于复制、移动和归档文件及目录非常有用。Midnight Commander 的外观和感觉与著名的 DOS Norton Commander\
  \ 类似。在 shell 提示符处执行 `mc`，会显示文件的双面板视图。它包含用于操作文件的下拉菜单选项和功能键。它还使用自己的虚拟文件系统，使其能够挂载 FTP\
  \ 目录并显示 `tar` 文件、`gzip tar` 文件（`.tar.gz` 或 `.tgz`）、`bzip` 文件、DEB 文件和 RPM 文件的内容，并从中提取单个文件。正如此如此，`mc`\
  \ 还包含一个针对 `ext2/3` 分区的未删除文件虚拟文件系统。通过使用 `cd` “切换目录”到 FTP 服务器的 URL，你可以使用 FTP 传输文件。Ubuntu\
  \ 默认选择的字体使得 `mc` 在 tty 控制台（相对于 xterm）中使用时显示效果非常难看。\n\n### 使用 `rsync`\n\n备份的一个老喜爱是\
  \ `rsync`。此命令使用了 `rsync` 的多个选项，并将它们放在一个易于记忆和运行的脚本中。首先，创建一个空文件并命名为 `backup.sh`：\n\
  \n```bash\nmatthew@seymour:~$ sudo touch backup.sh\n```\n\n然后，使用你喜欢的文本编辑器将以下命令输入文件并保存：\n\
  \n```bash\nsudo rsync --force --ignore-errors --delete --delete-excluded --exclude-from=/home/matt-exclude.txt\
  \ --backup --backup-dir=`date +%Y-%m-%d` -av / /media/externaldrive/backup/\n```\n\
  \n将文件设为可执行：\n\n```bash\nmatthew@seymour:~$ sudo chmod +x backup.sh\n```\n\n可以在命令行中使用\
  \ `sudo sh ./backup.sh` 运行脚本，或者作为自动的 `cron` 任务运行。以下是该命令中正在发生操作的概述。基本上，`rsync` 被告知复制所有新增和更改的文件（要备份的内容），并从现有备份中删除源端上已删除的文件（并将其备份在特殊目录中，以确保安全）。它被告知备份副本的存放位置，并提供了有关如何处理处理过程中特定问题的详细说明。阅读\
  \ `rsync` 手页以获取更多选项并根据你的需求进行自定义。\n\n\n\n\n\n* `--backup-dir=`date +%Y-%m-%d``—为之前提到的文件创建一个备份目录，其格式类似于：2010-07-08。\n\
  * `-av`—告诉 `rsync` 使用归档模式（archive mode）和详细模式（verbose mode）。\n* `/`—表示要备份的目录。在这种情况下，它是源的根目录，因此文件系统中的所有内容都被备份。你可以在此处填写\
  \ `/home` 来备份所有用户目录，或者为文件系统列出一份要排除的目录列表。\n* `/media/externaldrive/backup/seymour`—将备份目标设置为\
  \ `/backup/seymour` 目录，它位于挂载在 `/mount/externaldrive` 的外部硬盘上。\n\n（此处为翻译说明说明）\n\n\
  若要从此备份恢复到相同的原始位置，你需要反转其中的某些细节，并可能省略其他细节。类似下面的命令就非常有效：\n\n```\nmatthew@seymour:~$\
  \ sudo rsync --force --ignore-errors --delete --delete-excluded /media/externaldrive/backup/seymour\
  \ /\n```\n\n### 配置文件的版本控制\n\n为了在配置文件损坏或被错误编辑时确保安全并方便恢复，建议使用版本控制系统。事实上，这被认为是行业最佳实践。目前有很多高质量的版本控制系统可用，例如\
  \ Git、Subversion、Mercurial 和 Bazaar。如果你已经有一个喜欢的系统（也许是你用于代码项目的那个），你可以按照本节描述的方法，使用该版本控制系统进行操作。这里的建议是为了让大家开始考虑为配置文件使用版本控制的想法，并为不熟悉版本控制的人介绍一些常用且文档齐全的选项。首先，是一些背景知识。\n\
  \n版本控制系统的设计目的是为了方便撤销对文件进行的更改，即使在文件已保存之后也是。每个系统的实现方式略有不同，但基本思想是不仅保存文件的当前版本，还保存之前存在的每一个版本。某些版本控制系统通过每次保存整个文件来实现；另一些则使用元数据来仅描述每个版本之间的差异。无论何种，都可以回滚到文件的之前的版本，将文件恢复到更改之前的状态。编写软件的开发者非常清楚快速方便地做到这一点的力量和益处；不再需要文件编辑器记住文件在何处、修改了什么甚至是如何被编辑的技术细节。当问题发生时，只需将文件恢复到之前的状态即可。版本控制系统还能告知用户在每次保存时每个文件何时以及如何发生了变化。\n\
  \n对配置文件使用版本控制系统意味着每次更改配置时，这些更改都会被记录和跟踪。这能够轻松发现入侵者（如果配置被未经授权的人尝试重置，例如重置 Apache 设置，以便入侵者可以在你的服务器上运行恶意\
  \ Web 服务或站点），轻松地从错误和故障中恢复，并轻松发现软件升级在配置中启用或包含的新功能或设置。\n\n许多较旧且著名的工具都能完成此任务，例如 `changetrack`，它就是一个很好的例子。它们都试图让跟踪配置文件更改的工作变得更容易、更快速，但随着版本控制系统的进步，大多数工具提供的额外益处非常少。\n\
  \n#### 警告\n使用任何版本控制系统跟踪密码等敏感数据都存在风险。使用任何版本控制系统跟踪密码等敏感数据时应谨慎。\n\n#### 配置\n默认情况下，`etckeeper`\
  \ 使用 Git。在 Ubuntu 上，这被改为 `bzr`，因为 `bzr` 是 `etckeeper` 的默认值。\n\n首先，编辑 `/etc/etckeeper.conf`\
  \ 以使用你想要的版本控制系统、软件包管理器，以及设置是否每天自动提交更改。\n\n一旦从 Ubuntu 安装了 `etckeeper`，必须从命令行启动它：\n\
  \n```\nmatthew@seymour:~$ etckeeper init\n```\n\n如果你是手动编辑文件，请确保使用你的版本控制系统提交更改，或使用以下命令：\n\
  \n```\nmatthew@seymour:~$ etckeeper commit \"Changed prompt\"\n```\n\n引号中的消息应该反映刚刚进行的更改。这使得读取日志和查找准确更改变得简单得多。\n\
  \n恢复或撤销文件更改将直接使用你的版本控制系统来完成。例如，假设你在 `/etc/bash.bashrc` 中做了更改，该文件用于设置你的 `bash` shell\
  \ 的默认值。你在某处读到要更改提示符，但不喜欢结果。然而，由于更改正在被跟踪，你可以将其回滚到之前的版本。由于 `bzr` 是 Ubuntu 中 `etckeeper`\
  \ 的默认值，以下是使用 `bzr` 完成操作的方法。首先，检查日志找到上一次更改的提交号：\n\n```\nmatthew@seymour:~$ bzr log\
  \ /etc/bash.bashrc\n```\n\n------------------------------------------------------------\n\
  revno: 2\ncommitter: matthew <matthew@seymour>\nbranch nick: seymour etc repository\n\
  timestamp: 2011-07-16 11:08:22 -0700\n\nmessage:\n  Changed /etc/bash.bashrc\n------------------------------------------------------------\n\
  revno: 1\ncommitter: matthew <matthew@seymour>\nbranch nick: seymour etc repository\n\
  timestamp: 2011-07-16 11:00:16 -0700\n\nmessage:\n  Changed /etc/bash.bashrc\n------------------------------------------------------------\n\
  \n我知道更改是在最近的修订中进行的，标记为 `revno 2`（修订号二），因此现在我们回滚到该版本：\n\n```\nmatthew@seymour:~$\
  \ bzr revert –revision 2 /etc/bash.bashrc\n```\n\n\n\n\n\n今天，程序员、系统管理员和开发者类型通常使用版本控制来备份他们的点文件（dotfiles）。点文件是用户\
  \ `/home` 目录下的配置文件和目录，所有这些文件都以点开头，例如 `.bashrc`。并不是所有软件都会备份这些文件，而且由于这些文件通常由高技术水平的人员根据个人需求进行定制，因此备份它们是一个好主意。人们通常使用版本控制系统。一个名为\
  \ `dotdee` 的 Ubuntu 新程序可以对这种以 `.d` 结尾并存储在 `/etc` 中的不同类型的配置文件或目录执行此任务。你可以在第 9 章中找到关于\
  \ `dotdee` 的更多信息。\n\n# 系统救援\n\n总会有需要进行系统救援工作的时候。这种需求通常出现在系统甚至无法启动 Linux 导致你无法恢复任何文件时。这个问题通常与引导加载程序或分区表有关，但也有可能是关键系统文件被无意删除或损坏了。如果你一直在妥善备份，那么这类系统故障可以通过全量恢复轻松恢复（尽管速度可能很快）。尽管如此，自上次计划备份以来，可能某些价值的当前数据尚未备份，且发现备份归档损坏、不完整或缺失。全量恢复也需要你可能没有的时间。如果导致系统故障的问题仅仅是损坏的引导加载程序、损坏的分区表、缺失的库或配置错误，快速修复即可让系统恢复运行，然后就可以轻松检索数据。\n\
  \n在本节中，你将学习一些快速尝试的方法，用于系统无法启动时修复损坏的引导加载程序或恢复你的数据。\n\n## Ubuntu 救援盘\n\nUbuntu 安装\
  \ DVD 作为一个活动 DVD 运行得很好。要使用它，请插入光盘并重启电脑，像你最初安装 Ubuntu 并从 DVD 运行那样从 DVD 启动即可。\n\n\
  ## 恢复 GRUB2 引导加载程序\n\n恢复损坏的系统的 GRUB2 文件最简单的方法就是直接替换它们。这仅适用于 Ubuntu 9.10 或更高版本，并且仅当系统使用\
  \ GRUB2 时（如果最初是使用 9.10 或更高版本安装的，则会使用 GRUB2；但如果使用的是旧版本的 Ubuntu 安装并升级的，则可能不会，因为 GRUB2\
  \ 在版本升级期间不会自动安装）。\n\n开始之前，使用活动 DVD 启动，并在“应用程序->辅助工具->终端”菜单中打开终端。然后确定硬盘的哪个分区存有 Ubuntu\
  \ 安装，你可以通过以下命令发现它：\n\n```bash\nmatthew@seymour:~$ sudo fdisk –l\n```\n\n除非你自定义了安装（在这种情况下，你可能已经知道分区方案和\
  \ Ubuntu 的安装位置），否则该分区可能位于名为 `sda` 的驱动器的第一个分区上，你现在可以使用以下命令挂载它：\n\n```bash\nmatthew@seymour:~$\
  \ sudo mount /dev/sda1 /mnt\n```\n\n这会将驱动挂载到当前文件系统（从活动 DVD 运行）的 `/mnt` 处，你可以根据需要对其进行读取和修改。接下来，在该设备设备上重新安装\
  \ GRUB2：\n\n```bash\nmatthew@seymour:~$ sudo grub-install -root-directory=/mnt/\
  \ /dev/sda\n```\n\n此时，重启（使用你的硬盘而不是活动 DVD），一切都应该正常了。重启完成后，输入以下：\n\n```bash\nmatthew@seymour:~$\
  \ sudo update-grub\n```\n\n这将刷新 GRUB2 菜单并完成恢复。你可以在 [`help.ubuntu.com/community/Grub2`](https://help.ubuntu.com/community/Grub2)\
  \ 找到很多关于 GRUB2 的有用信息。\n\n 从无法启动的硬盘保存文件\n\n如果恢复 GRUB2 引导加载程序失败且你仍然无法从硬盘启动，请尝试使用活动\
  \ DVD 恢复数据。如前所示启动并挂载硬盘，然后连接外部存储设备（如 USB 优存盘或外部硬盘）。然后，从挂载的驱动器将你想保存的文件复制到外部驱动器。\n\n\
  如果你完全无法挂载驱动器，你的选择将变得有限且成本可能更高。可能是硬件已故障，或者文件系统已严重损坏。在任何情况下，恢复要么是不可能的，要么更加困难，如果数据对你很重要，最好交给专家处理。但好消息是，你一直在进行定期备份，对吧？所以，你可能只丢失了一天或可能一周的工作，可以买一个新驱动器，安装并从头开始，将备份中的数据放到你新硬件上的新\
  \ Ubuntu 安装中。\n\n每位经验丰富的系统管理员都遇到过这种情况，因为没有任何硬件是完美无缺的。我们预料会偶尔发生硬件故障，这就是我们为数据建立良好备份和恢复方案的原因。系统管理员分为两类：一类是在发生时丢失数据，另一类是建立了良好方案的人。提前预警并保持明智。\n\
  \n如果你没有备份（这对大多数系统管理员一生中只会发生一次，因为他们会从错误中学习），请立即停止操作硬盘。你恢复数据的最佳办法将非常昂贵，但你应该寻找专门从事此任务的公司并付钱让他们完成。如果你的数据不值得花费恢复费用而你想尝试自己恢复，可以尝试，但这不是胆小者能胜的任务，通常情况下，数据直接丢失了。再次强调，故事的教训是定期备份，检查备份以确保它们有效，并反复如此。在需要执行之前练习恢复，也许可以使用一个不重要的且即使犯错也不会造成伤害的测试系统。\n\
  \n#### 参考文献\n\n- [`help.ubuntu.com/community/BackupYourSystem`](https://help.ubuntu.com/community/BackupYourSystem)—这是学习和检查\
  \ Ubuntu 备份方法的起点。\n- [www.tldp.org/](http://www.tldp.org/)——Linux 文档项目提供了关于备份和磁盘恢复的多个\
  \ HOWTO 文档。\n- [`book.git-scm.com/`](http://book.git-scm.com/)—Git 社区书籍。\n- [`svnbook.red-bean.com/`](http://svnbook.red-bean.com/)—《使用\
  \ Subversion 版本控制》。\n\n\n\n\n\n开源技术的一大优势（而 Linux 特别是如此）是它可以毫不费力地跨多个网络环境和互联网。由于对标准互联网协议\
  \ `TCP/IP` 的强有力支持，Linux 可以与所有 UNIX 变体通信，包括 Mac OS X、Windows（借助 Samba 的帮助）、NetWare\
  \ (IPX)，甚至是如 DECNET 和 Banyan Vines 等较旧的协议。许多组织将 Linux 作为互联网网关，允许许多不同的客户端通过 Linux\
  \ 访问互联网，并通过电子邮件和即时消息进行通信。最重要的是它对 `IPv6` 的内置支持，这种技术很快就会看到显著的大规模采用。可以说，无论你遇到何种网络协议，Linux\
  \ 都能以某种方式与之协同工作。\n\n本章涵盖了网络和互联网连接性，因为大多数网络最终都会以某种形式连接到互联网。你将学习如何正确地完成基础工作，包括在 Ubuntu\
  \ 中配置和管理网络网卡（`NICs`）和其他网络服务。你还将了解如何从命令行管理网络服务——万一你受限于命令行提示符环境，这同样是一节重要的课程。我们还查看了入站和出站网络流量的连接选项，以及`点对点协议\
  \ (PPP)` 的重要性。\n\n在本章中，我们重点关注文本接口和手动配置。我们还包含了 Ubuntu 中基础图形化网络管理的概述，这正变得越来越流行。`图形用户界面\
  \ (GUI)` 已变得更加稳定、有用且易于理解，以至于这将成为大多数桌面用户与网络交互的方式。然而，这是一本为想要了解系统内核的高级用户准备的书，所以让我们卷起袖子准备吧。\n\
  \n### 基础：`localhost` 接口\n\n在成功连接到网络甚至互联网之前，首先需要一个 `localhost` 接口，有时被称为环回接口，但通常被称为\
  \ `lo`。`TCP/IP` 协议（参见本章后面的“Networking with TCP/IP”部分）使用此接口为你的计算机分配 IP 地址，并且 Ubuntu\
  \ 建立 `PPP` 接口也需要它。\n\n#### 检查环回接口的可用性\n\n通常你不需要手动创建环回接口，因为 Ubuntu 在安装过程中会自动为你创建一个。要检查该接口是否已设置，你可以使用\
  \ `ifconfig` 命令，它会列出所有可用的网络接口，包括如果存在的话 `lo` 接口，如下：\n\n```\nmatthew@seymour:~$ ifconfig\n\
  \nlo      Link encap:Local Loopback\n\n          inet addr:127.0.0.1  Mask:255.0.0.0\n\
  \n          inet6 addr: ::1/128 Scope:Host\n          UP LOOPBACK RUNNING  MTU:16436\
  \  Metric:1\n          RX packets:270 errors:0 dropped:0 overruns:0 frame:0\n  \
  \        TX packets:270 errors:0 dropped:0 overruns:0 carrier:0\n          collisions:0\
  \ txqueuelen:0\n          RX bytes:20748 (20.7 KB)  TX bytes:20748 (20.7 KB)\n```\n\
  \n你在示例中看到的是环回接口存在且激活的证据。`inet addr` 是分配给 `localhost` 的 IP 数字，通常为 `127.0.0.1`，配合\
  \ `255.0.0.0` 的广播掩码，并且该接口上的活动很少（`RX` = 接收，`TX` = 发送）。如果你的输出与之前所示不同，你必须在完成本节其余部分后手动配置\
  \ `localhost` 接口。你还可以看到分配给 `lo` 的 `IPv6` 地址，即 `::1/128`，被称为 `inet6 addr`。\n\n####\
  \ 手动配置环回接口\n\n`localhost` 接口的 IP 地址指定在一个文本配置文件中，Ubuntu 使用该文件记录各种全网范围 IP 地址。该文件名为\
  \ `/etc/hosts`，通常存在于系统中，即使它是是空的。Linux 内核和其他网络工具使用该文件，以便它们能够访问本地 IP 地址和主机名。如果你没有配置任何其他网络接口，可能会发现该文件看起来如下：\n\
  \n```\n127.0.0.1    localhost\n\n127.0.1.1    seymour\n\n# 以下行对于支持 IPv6 的主机来说是理想的\n\
  \n::1      localhost ip6-localhost ip6-loopback\n\nfe00::0 ip6-localnet\n\nff00::0\
  \ ip6-mcastprefix\n\nff02::1 ip6-allnodes\n\nff02::2 ip6-allrouters\n\nff02::3 ip6-allhosts127.0.0.1\
  \       localhost\n```\n\n第一行定义了特殊的 `localhost` 接口并为其分配了 IP 地址 `127.0.0.1`。你可能会听到或读到\
  \ `localhost`、loopback（环回）和 dummy interface（虚拟接口）等术语；所有这些术语都是使用 IP 地址 `127.0.0.1`。环回接口一术语用于描述\
  \ Linux 网络驱动程序看起来就像机器正在与一个仅由一台机器组成的网络通信；内核在同一台计算机上自我发送和接收网络流量。这有时被称为虚拟接口，因为该接口并不真实存在；从外部世界来看，它不是一个真实的地址；它仅存在于本地机器，用于欺骗内核让内核以及任何需要网络接口才能运行的网络感知程序认为有一个可用的接口。\n\
  \n\n\n\n\n剩余的行用于 IPv6，除了以 `::1` 开头的行外都可以忽略。它用于定义 IPv6 的 `localhost` 连接，你可以在终端中使用\
  \ `ping6` 命令对其进行测试，如下所示：\n\n```\nmatthew@seymour:~$ ping6 -c 3 ::1\n\nPING ::1(::1)\
  \ 56 data bytes\n\n64 bytes from ::1: icmp_seq=1 ttl=64 time=0.102 ms\n\n64 bytes\
  \ from ::1: icmp_seq=2 ttl=64 time=0.140 ms\n\n64 bytes from ::1: icmp_seq=3 ttl=64\
  \ time=0.140 ms\n\n--- ::1 ping statistics ---\n\n3 packets transmitted, 3 received,\
  \ 0% packet loss, time 1998ms\n\nrtt min/avg/max/mdev = 0.102/0.127/0.140/0.020\
  \ ms\n```\n\n## 使用 TCP/IP 进行网络连接\n\n任何基于 UNIX 主机的网络基础构建单元都是`传输控制协议/互联网协议 (TCP/IP)`套件，它包含了三个协议，尽管缩写中只体现了两个。该套件由由\
  \ IP 协议 (IP)`、`传输控制协议 (TCP)`和`用户数据报协议 (UDP)`组成。`IP` 是基础协议。`TCP/IP`套件是基于`packet`（包）的，这意味着数据在发送端会被拆分成小块以传输到接收端。将数据拆分成可管理的数据包可以实现更快、更准确的传输。在\
  \ TCP/IP 中，所有数据都通过 `IP` 数据包传输，这就是为什么地址被称为 IP 地址。它是该套件的最低层。\n\n`TCP` 也是一种基于连接的协议。在两台机器之间传输数据之前，它们之间会建立一个连接。当建立连接时，数据流会被发送给\
  \ `IP` 并拆分成包，然后进行传输。在接收端，数据包会被按顺序排列并发送到正确的应用程序端口。`TCP/IP` 成了互联网的基础；没有它，互联网将是一个完全不同的地方，如果它真的存在过话。相比之下，`UDP`\
  \ 是一种无连接协议。使用此协议的应用只需选择目的地并开始发送。`UDP` 通常用于少量数据或在快速且可靠的网络上。如果你对 `TCP/IP` 的内部机制感兴趣，请参阅本章末尾`References`部分以查找更多信息。\n\
  \n## Ubuntu 与网络连接\n\n你的网卡很可能在安装 Ubuntu 期间已经配置好了。你可以使用 `ifconfig` 命令或 Ubuntu 的图形化网络配置工具来编辑系统的网络设备信息，或在系统上添加或删除网络设备。Ubuntu\
  \ 包含了数百个网络命令和实用程序——多到在本章中无法涵盖，但对于涵盖两三卷内容来说绰绰有余。\n\n几乎所有的以太网卡都可以在 Linux 下，以及许多 PCMCIA\
  \ 有线和无线网卡。好消息是，许多 USB 无线网络设备在 Linux 下也运行良好，随着每个新版本的 Linux 内核，支持的设备越来越多。你可以在 `[www.linux-usb.org/](http://www.linux-usb.org/)`\
  \ 查看 Linux USB 项目的最新进展，或验证你的设备是否支持。\n\n读完本章后，你可能想了解更多用于 Linux 的其他图形化网络客户端。例如，GNOME\
  \ `ethereal` 客户端（更多信息访问 `[www.ethereal.com/](http://www.ethereal.com/)`）可以监控局域网内的所有流量或特定类型的流量。另一个客户端\
  \ `Nmap` 可扫描特定主机的开放端口和其他运行的服务（更多信息访问 `[`nmap.org/`](http://nmap.org/)`）。\n\n## TCP/IP\
  \ 路由\n\n要理解 Linux 联网，你需要了解 `TCP/IP` 地址的基础知识。互联网 IP 地址（也称为`公网`IP 地址）与`局域网 (LAN)`\
  \ 内部使用的地址不同。互联网 IP 地址由美国互联网数字机构分配（针对美国及其他一些主机），地址为 `[www.arin.net/](http://www.arin.net/)`。需要互联网地址的实体向该机构申请分配地址。该机构向`互联网服务提供商\
  \ (ISP)` 分配一个或多个 IP 地址块，然后 ISP 将其分配给他们的订阅用户。\n\n你会很快识别出 `TCP/IP` 地址的当前形式，即 `IP 版本\
  \ 4 (IPv4)`。在这种方法中，`TCP/IP` 地址表示为一系列四个进制数字：一个以点点十进制格式表示的 32 位值，例如 `192.168.0.1`。每组数字被称为一个\
  \ `octet`（字节，由八个 1 或 0 组成，例如用 `10000000` 表示 `128`），范围从 0 到 255。\n\n第一个字节通常决定了网络属于哪种\
  \ `class`（类）。网络分为三类：\n\n- **A 类网络**——由第一个字节范围从 1 到 126 的网络组成。只有 126 个 A 类网络，每个网络最多包含\
  \ 16,777,214 台主机。（如果你在计算的话，潜在的主机数量。）\n- **B 类网络**——由第一个字节范围从 128 到 191 的网络组成。有 16,382\
  \ 个 B 类网络，每个网络有 65,534 台主机。\n- **C 类网络**——由第一个字节范围从 192 到 223 的网络组成。有 2,097,150\
  \ 个 C 类网络，每个网络最多 254 台主机。\n\n注意，`10.` 网络保留用于局域网使用，`127.0.0.1` 用于回环地址。`D` 类网络保留用于组播地址，`E`\
  \ 类地址被认为是实验性的，因此开放。\n\n这些类别是标准的，但子掩码也决定了你的网络所属类别。子掩码决定了 IP 地址的哪部分代表网络，哪部分代表主机。不同类别的常用子掩码如下：\n\
  \n- **A 类**：`255.0.0.0`\n- **B 类**：`255.255.0.0`\n- **C 类**：`255.255.255.0`\n\n\
  由于互联网主机 IP 地址的分配，现在无法获取 A 类网络。获取 B 类网络也几乎不可能（所有地址都已发放，但某些公司据愿意出售），随着互联网使用的持续增长，C\
  \ 类网络的可用性正在迅速下降。\n\n## 当前 IP 地址的局限性\n\n当前的 `IPv4` 地址方案基于 32 位编号，限制了可用 IP 地址的数量约为\
  \ 41 亿个。在互联网增长的早期，许多公司和组织（特别是美国）被分配了大量的 IP 地址块，这导致了“开放”地址的短缺。即使仔细地分配连接互联网的主机 IP\
  \ 地址，并使用`网络地址转换 (NAT)` 为连接互联网的计算机后的机器提供入出站通信，互联网仍可能耗尽可用地址。\n\n\n\n\n为了解决这个问题，目前正在实施一种名为\
  \ `IP version 6 (IPv6)` 的新方案。它使用了一种基于 128 位地址的庞大地址解决方案，有足够的空间包含更多关于特定主机或设备的信息，例如\
  \ `global positioning server (GPS)` 或序列号。尽管关于整个 IPv6 地址内容的内容的具体细节尚未最终确定，但所有与互联网相关的组织似乎都认为，必须采取措施来提供更多地址。\n\
  \n你可以在 [www.arin.net/knowledge/v4-v6.html](http://www.arin.net/knowledge/v4-v6.html)\
  \ 和 [www.arin.net/resources/request.html](http://www.arin.net/resources/request.html)\
  \ 获得 IPv4 和 IPv6 在 IP 地址分配策略方面的差异，以及获取 IP 地址的注册过程的良好概述。\n\nUbuntu 支持对 IPv6 的使用，并包含了许多符合\
  \ IPv6 寻址规范的网络工具。\n\n然而，迁移到 IPv6 的过程非常缓慢，因为大多数的计算机操作系统、软件、硬件、固件和用户仍然停留在 IPv4 的思维中。支持\
  \ IPv6 需要重写许多网络实用程序、当前使用的操作系统部分，以及路由和防火墙硬件中的固件。\n\n## 在 Ubuntu 中使用 IP 伪装 (IP Masquerading)\n\
  \n三块 IP 地址保留用于内部网络和未直接连接互联网的主机。地址范围从 10.0.0.0 到 10.255.255.255，即 1 个类 A 网络；从 172.16.0.0\
  \ 到 172.31.255.255，即 16 个类 B 网络；以及从 192.168.0.0 到 192.168.255.255，即 256 个类 C 网络。为企业或家庭构建局域网时请使用这些\
  \ IP 地址。选择哪一类取决于你网络上的主机数量。\n\n内部网络的互联网访问可以由运行 Ubuntu 的 PC 或路由器提供。该主机或设备连接到互联网，并作为互联网网关，向你的局域网发送和接收信息。该主机在作为互联网网关的同时，还应该作为防火墙，保护你的网络免受恶意数据和用户的攻击。\n\
  \n以这种方式使用的 PC 通常至少有两个网络接口。一个连接到互联网，另一个连接到局域网上的计算机（通过集线器或交换机）。某些宽带设备还集成了四个或更多交换网络接口。数据随后通过\
  \ `NAT` 在局域网和互联网之间传输，这在 Linux 领域有时被称为 `IP masquerading`（IP 伪装）。\n\n### 注意\n\n不要对你的局域网依赖单点保护，特别是当你使用无线网络、提供拨号服务或允许移动用户（笔记本电脑或\
  \ PDA）从内部或外部访问你的网络时。依赖“护城河心态”的公司、机构和个人经常令他们失望发现，这种安全方法很容易被攻破。请确保你的网络操作伴有一项强调多级安全访问的安全策略，并在每台服务器和工作站上都构建防护——这在使用\
  \ Linux 时是可以轻松完成的。\n\n## 端口 (Ports)\n\n你网络上的大多数服务器承担有多个任务。例如，Web 服务器通常必须同时提供标准页面和安全页面。你可能在同一台主机上运行\
  \ FTP 服务器。因此，应用程序提供了可使用的 `ports` 来为特定的软件服务建立“直接”连接。这些端口帮助 TCP/IP 区分服务，以便数据能够到达正确的应用程序。如果你检查文件\
  \ `/etc/services`，你将看到常用端口及其用途。例如，对于 FTP、HTTP 和 POP3（邮件检索服务器），你将看到以下内容：\n\n```\n\
  ftp      21/tcp\nhttp     80/tcp      http      # WorldWideWeb HTTP\npop3     110/tcp\
  \     pop-3     # POP version 3\n```\n\n示例中 `/etc/services` 定义的端口分别是 FTP 的 21、HTTP\
  \ 的 80 和 POP3 的 110。其他一些常用端口分配还有用于 `Simple Mail Transport Protocol (SMTP)` 的 25\
  \ 和用于 `Secure Shell (SSH)` 远程登录的 22。注意，这些端口并不是固定不变的，你可以配置服务器响应不同的端口。例如，尽管端口 22 在\
  \ `/etc/services` 中被列为 SSH 的常用默认端口，但可以通过编辑其配置文件 `/etc/ssh/sshd_config` 来配置 `sshd`\
  \ 服务器监听不同的端口。默认设置（用井号 `#` 注释掉）如下：\n\n```\n#Port 22\n```\n\n编辑条目以使用不同的端口，确保选择一个未使用的端口号，如下：\n\
  \n```\nPort 2224\n```\n\n保存更改，然后重启 `sshd` 服务器。（请参阅第 13 章，“自动化任务与 Shell 脚本”，查看如何重启服务。）远程用户现在必须通过端口\
  \ `2224` 访问主机，这可以使用 `ssh` 的 `-p`（端口）选项来实现，如下：\n\n```\n$ ssh -p 2224 remote_host_name_or_IP\n\
  ```\n\n## 网络组织 (Network Organization)\n\n随着网络规模的扩大，妥善地组织网络寻址过程变得越来越困难。为少于 254 台设备的类\
  \ C 网络设置网络寻址是简单的。但为一个拥有类 A 网络和许多不同用户的大型全球公司设置寻址可能极其复杂。如果你的公司少于 254 个 `hosts`（指的是任何需要\
  \ IP 地址的设备）且所有工作组可以共享信息，单个类 C 网络就足够了。\n\n### 子网划分 (Subnetting)\n\n在类 A 和类 B 网络中，可以划分称为\
  \ `subnets` 的独立网络。子网被视为地址定义中的主机部分。例如，在 128. 类 B 网络，你可以有一台地址为 128.10.10.10 的计算机，另一台地址为\
  \ 128.10.200.20 的计算机；这些计算机属于同一个网络（128.10.），但属于不同的子网（128.10.10. 和 128.10.200.）。由于由于，两台计算机之间的通信需要路由器或交换机。子网对于划分公司内部的工作组非常有帮助。\n\
  \n子网经常用于隔离不需要相互交互的工作组成员之间传递的信息。例如，如果你的公司规模足够大，拥有自己的人资源部门和薪资部门，你可以将这些部门主机放在自己的子网中，并使用路由器配置限制连接到该子网的主机。这种配置防止了非指定部门的网络人员查看\
  \ HR 和薪资人员处理的机密信息。\n\n子网的使用还允许你的网络增长到 254 个主机并共享 IP 地址。通过适当的路由配置，用户可能甚至不知道与同事处于不同的子网。子网划分的另一个常见用途是跨越地理区域的网络。对于在芝加哥和伦敦都有办公室的公司来说，让两个办公室位于同一个子网是不现实的，因此每个办公室使用独立的子网是最佳解决方案。\n\
  \n### 子网掩码\n\nTCP/IP 使用子网掩码来显示 IP 地址的哪是网络部分，部分是主机部分。子网掩码通常被称为 `netmasks`。对于纯类 A\
  \ 网络，掩码是 255.0.0.0；对于类 B 网络，掩码是 255.255.0.0；对于类 C 网络，掩码是 255.255.255.0。子网掩码也可用于偏离标准分类。\n\
  \n\n\n\n通过自定义网络掩码，你可以根据需要对网络进行子网划分。例如，你的网络有一个单 C 类地址。你有对网络进行子网划分的需求。虽然使用普通的 C 类子网掩码无法实现这一点，但你可以更改掩码来将网络划分为多个子网。通过将最后一个字节更改为大于零的数字，你可以将网络划分为所需的任意子网。\n\
  \n有关如何创建自定义子网掩码的更多信息，请参阅 *Sams Teach Yourself TCP/IP Network Administration in 21\
  \ Days* 中第 6 天“子网掩码的艺术”章节。该章节非常详细介绍了如何创建自定义网络掩码，并解释了如何为每个子网上的主机创建地址快速查询表。《Linux\
  \ 网络管理员指南》在 [www.tldp.org/LDP/nag2/index.html](http://www.tldp.org/LDP/nag2/index.html)\
  \ 中也提供了关于如何创建子网的良好信息。\n\n## 广播、单播和多组播地址\n\n信息可以通过三种地址到达系统：单播、多组播和广播。每种地址的使用取决于所发送信息的目的，如下文所示：\n\
  \n- **单播 (Unicast)**——向某一个特定的主机发送信息。单播地址用于 `Telnet`、`FTP`、`SSH` 或任何需要在一对一信息交换中共享的信息。虽然子网/网络上的任何主机都可能看到传输的信息，但只有一台主机是预期的接收者，并将对接收到的信息采取行动。\n\
  - **多组播 (Multicasting)**——向共享某个应用程序的计算机组广播信息，例如视频会议客户端或在线游戏应用程序。参与会议或游戏的所有机器都需要在精确的时间获取相同的信息才能发挥作用。\n\
  - **广播 (Broadcasting)**——向网络或子网上的所有主机传输信息。*动态主机配置协议 (DHCP)* 在 DHCP 客户端寻找 DHCP 服务器以获取其网络设置时使用广播消息，而*反向地址解析协议\
  \ (RARP)* 使用广播消息进行硬件地址到 IP 地址的解析。广播消息在网络 IP 地址的所有主机字节中使用 `.255`。（（`10.2.255.255`\
  \ 将广播到你的 B 类网络中的每个主机。）\n\n## 网络连接硬件设备\n\n正如本章开头所述，网络连接是 Linux 操作系统的优势之一。本节涵盖了用于基础网络的设备类别。请注意，本节讨论的是硬件设备，而不是\
  \ Linux 网络设备，后者将在“使用网络配置工具”节中讨论。\n\n### 网络接口卡\n\n计算机必须有一个*网络接口卡 (NIC)* 来连接到网络。目前，网络连接有几种拓扑结构（连接计算机的方式）。这些拓扑结构从旧的且大多已过时的\
  \ `10BASE-2` 到较新且流行的无线 Wi-Fi 或 `802.11` 网络。\n\n每个 `NIC` 都有一个唯一的地址（硬件地址，称为*媒体访问控制\
  \ [MAC]*），用于识别该 NIC。该地址由六对用由冒号（`:`）分隔的十六进制位组成。MAC 地址看起来像这样：`00:60:08:8F:5A:D9`。硬件地址用于\
  \ `DHCP`参见本章稍后的“动态主机配置协议”节）来识别特定的主机。它还被*地址解析协议 (ARP)*和*反向地址解析协议 (RARP)* 用于将主机映射到\
  \ IP 地址。\n\n本节涵盖了用于连接到你网络的不同类型的 `NIC`。\n\n#### 令牌环 (Token Ring)\n\n令牌环网络由 IBM 开发。正如名称所示，网络被设置成环形。一个“令牌”从一个主机传递另一个主机，表示接收主机有传输数据的权限。\n\
  \n令牌环的最大传输速率为 `16Mbps`（每秒 1600 万位）。与 `10BASE-2` 和 `10BASE-5` 不同，令牌环使用的是所谓的*非屏蔽双绞\
  \ (UTP)* 电缆。这种电缆看起来非常像连接电话和墙壁的线。几乎所有的令牌环 `NIC` 都能被 Linux 识别。\n\n#### 10BASE-T\n\n\
  `10BASE-T` 长期以来一直是标准。大量网络仍在使用它。`10BASE-T` 也使用 UTP 电缆。`10BASE-T` 并不是配置成环形，而是主要使用星型架构。在这种架构中，所有主机都连接到一个中心位置（通常是集线器，你稍后将在“集线器和交换机”节中学习）。所有数据都发送给所有主机，但只有目标主机会对单个数据包采取行动。`10BASE-T`\
  \ 的传输速率为 `10Mbps`。\n\n`10BASE-T` 的最大段长度为 100 米（约 325 英尺）。有许多 `10BASE-T` `NIC` 制造商，大多数被\
  \ Ubuntu 识别。\n\n#### 100BASE-T\n\n`100BASE-T` 在千禧年前流行，在保持与 `10BASE-T` 相同管理便利性的同时，将速度提高了\
  \ 10 倍。对于大多数网络来说，从 `10BASE-T` 升级到 `100BASE-T` 就像更换 `NIC` 一样简单。`100BASE-T` 的数据发送到所有主机，但只有目标主机会对单个数据包采取行动。`100BASE-T`\
  \ 的传输速率为 `100Mbps`。\n\n`100BASE-T` 的最大段长度为 100 米（约 325 英尺）。有许多 `100BASE-T` `NIC`\
  \ 制造商，大多数被 Ubuntu 识别。\n\n\n\n\n如果布线已经就绪，现在将台式电脑或大型服务器升级为无线连接可能并不实用。无线网络通常仍然比传统的有线网络慢。然而，随着新协议的广泛采用（例如\
  \ `802.11n`，以及较旧的 `802.11b` 和目前在使用且常见的 `802.11g`），以及更符合标准且廉价的无线 `NICs` 的引入，这种情况正在发生变化。某些\
  \ `802.11g` NICs` 的工作速度可达 `108Mbps`，表面上看比 `100BASE-T` 有线网络快。但在实践中，它要慢得多：除非你的网络环境墙壁像纸一样薄，否则你通常可以将\
  \ Wi-Fi 网络设备的报告速度减半，因此 `108Mbps` 的速度大约只有 `100BASE-T` 的一半。新的 `802.11n` 承诺速度是 `802.11g`\
  \ 的七倍，但 `802.11n` 的采用和实现中的标准化进程较为缓慢。\n\n随着每个新版本的 Linux 内核发布，越来越多的无线 `NICs` 具有兼容性。尽管如此，通常获取品牌的无线\
  \ `NICs` 更好，因为你有更大的机会获得兼容。无线网络将在本章稍后的部分进行讨论。\n\n## 网线\n\n目前有三种类型的网络线：同轴电缆、`UTP`\
  \ 和光纤。同轴电缆（现在很少使用）看起来非常像连接电视到电缆插座或天线的同轴电缆。`UTP` 看起来很像从手机连接到墙壁插座的电缆（插座要宽一点）。光纤看起来有点像立体音响上使用的\
  \ RCA 线，或者像家里家用电器上的电线（两个独立的段连接在一起）。以下章节将更详细地讨论 `UTP` 和光纤网络线。\n\n### 非屏蔽双线对\n\n`UTP`\
  \ 使用颜色编码的细铜线对来传输数据。`UTP` 的六个类别每种都有不同的用途：\n\n- `Category 1` (`Cat1`)——用于语音传输，例如你的电话。每条线仅使用一对线（一根传输，一根接收）。使用\
  \ `RJ-11` 插头将电缆连接到电话和墙壁。\n- `Category 2` (`Cat2`)——用于早期的 Token Ring 网络。传输速率为 `4Mbps`，数据传输速率慢。也使用\
  \ `RJ-11` 插头进行电缆连接。\n- `Category 3` (`Cat3`)——用于 `10BASE-T` 网络。传输速率为 `10Mbps`。使用三对电缆发送和接收信号。`Cat3`\
  \ 电缆可以使用 `RJ-11` 或 `RJ-45` 插头，通常首选较小的 `RJ-11`。`RJ-45` 插头的设计与 `RJ-11` 类似，但更大，可以处理多达四对线，更多地用于\
  \ `Cat5` 电缆。\n- `Category 4` (`Cat4`)——用于现代 Token Ring 网络。传输速率为 `16Mbps`，由于公司正在转向更好的替代方案，它变得越来越常见。使用\
  \ `RJ-45` 插头进行电缆连接。\n- `Category 5` (`Cat5`)——`UTP` 类别中最快，传输速率高达 `1000Mbps`。它同时用于\
  \ `100BASE-T` 和 `1000BASE-T` 网络，并使用四对线。`Cat5` 电缆出现在 `10BASE-T` 网络流行的时期，价格并不比 `Cat3`\
  \ 电缆贵多少。因此，大多数 `10BASE-T` 网络使用 `Cat5` `UTP` 而不是 `Cat3`。`Cat5` 电缆使用 `RJ-45` 插头。\n\
  - `Category 6` (`Cat6`)——同样额定为 `1000Mbps`，这种电缆有两种形式：用于短距离的线股型（25 米，约 80 英尺）和用于长达\
  \ 100 米（约 325 英尺）的单芯型，但不应弯曲。\n\n### 光纤\n\n光纤（`fiber`）通常为橙色或红色。传输速率为 `100Mbps`，最大长度为\
  \ `100 公里`（62 英里）。光纤使用双叉插头连接到设备。由于它使用光而不是电来传输信号，它具有几个优势：没有电磁干扰的可能性，而且更难被接入和窃听。\n\
  \n## 集线器和交换机\n\n集线器和交换机用于在星型架构网络上将多个主机连接在一起。它们具有任意数量的连接；常见的尺寸有 4、8、16、24 和 48 个连接（端口）；每个端口都有一个灯，在建立网络连接时会亮（链路灯）。使用它们可以让你轻松扩展网络；当你需要添加新连接时，只需添加新的集线器或交换机即可。每个单元都可以连接到网络上的其他集线器或交换机，通常通过集线器或交换机上的称为\
  \ `uplink`（上行）的端口。这使得通过上行端口连接的两个集线器或交换机可以像一个集线器或交换机一样工作。让网络中的所有主机连接到一个中心位置可以更容易排除问题故障。如果一个主机宕机，其他主机都不会受到影响。\n\
  \n\n\n路由器可以将数据从一个网络传输到另一个网络，并允许对数据进行过滤。路由器最适合用于将你的网络连接到外部网络（例如互联网）。例如，如果你有一个内部内网的\
  \ Web 服务器，不希望人们从互联网访问它，你可以使用路由器的过滤器来阻止来自网络上的 80 端口。这些过滤器也可以用于阻止特定主机访问互联网。出于这些原因，路由器也被称为`智能网关`。\n\
  \n路由器的复杂程度和价格范围很大，从花费数千美元的企业级思科路由器，到为家庭或小型办公室设计、花费不到百美元的消费品牌。\n\n## 初始化新网络硬件\n\n\
  Ubuntu 的所有初始网络配置和硬件初始化通常在安装期间完成。然而，有时你可能需要重新配置系统的网络，例如当主机需要移动到不同的子网或不同的网络，或者当你更换了计算机的任何网络硬件时。\n\
  \n当内核识别到网卡（NIC）或其他网络设备连接到系统时，Linux 会在内存中创建网络接口。这些接口与其他 Linux 接口（如串口通信口）不同，在 `/dev`\
  \ 目录中没有对应的设备文件。除非你的内核内置了对特定网卡的支持，否则必须告诉 Linux 加载特定的内核模块来支持你的网卡。超过 100 个此类模块位于 `/lib/modules/2.6.XX-XX/kernel/net`\
  \ 目录下（其中 `XX-XX` 是你的内核版本）。\n\n在使用 Linux 时，可以通过多种方式初始化网卡。当你首次安装 Ubuntu 时，自动硬件探测会检测并配置你的系统使用任何已安装的网卡。如果你删除了原始网卡并将其更换为不同品牌和型号，除非你配置\
  \ Ubuntu 在启动时使用自动硬件检测，否则系统不会自动检测并初始化该设备。Ubuntu 会在启动时检测到旧网卡的缺失和新网卡的存在。\n\n如果你不使用自动硬件检测和配置，可以通过以下方法初始化网络硬件：\n\
  \n- 手动编辑 `/etc/modprobe.conf` 文件，提示系统在重启后识别并支持新硬件\n- 使用 `modprobe` 命令手动加载或卸载新设备的内核模块\n\
  \n接下来的章节将详细详细介绍这些方法。\n\n### 编辑 `/etc/modprobe.conf` 文件\n\n当你第一次查找该文件时，它可能并不存在，因此你可能需要在文本编辑器中创建一个空白文件。你可以手动编辑\
  \ `/etc/modprobe.conf` 文件以添加模块依赖项（也称为`指令`），以支持新的网卡或其他网络设备。该条目包含设备名称及其相应的内核模块。添加此条目后，Linux\
  \ 内核会在重启后识别你的新网络硬件。Ubuntu 在启动时会运行模块依赖检查。\n\n例如，如果你的系统使用 RealTek 网卡，可以使用如下条目：\n\n\
  ```\nalias eth0 8139too\n```\n\n示例条目告诉 Linux 内核加载 `8139too.o` 内核模块以支持 `eth0` 网络设备。另一方面，如果你安装了\
  \ Intel 以太 Pro 网卡，则使用如下条目：\n\n```\nalias eth0 eepro100\n```\n\n如果有需要，可以使用一个或多个选项项将参数传递给内核模块，以正确配置你的网卡。查看\
  \ `modprobe.conf` 手页获取更多关于使用条目的信息。有关网卡内核模块的更多细节，请检查模块源代码。（目前尚无帮助页，这对任何愿意编写文档的人来说都是很好的机会）。\n\
  \n### 使用 `modprobe` 手动加载内核模块\n\n你不需要使用 `/etc/modprobe.conf` 条目来为你的新网络设备初始化内核支持。作为\
  \ root 用户（使用 `sudo`），你可以使用 `modprobe` 命令结合模块名称手动手动加载或卸载设备的内核模块。例如，使用以下命令行启用示例的 RealTek\
  \ 网卡：\n\n```\nmatthew@seymour:~$ sudo modprobe 8139too\n```\n\n按下回车后，你将看到来自内核环形缓冲区消息报告的设备，你可以通过\
  \ `dmesg` 命令显示它。以下是该命令输出的一部分：\n\n```\nmatthew@seymour:~$ dmesg\n\n...\neth0: RealTek\
  \ RTL8139 Fast Ethernet at 0xce8ee000, 00:30:1b:0b:07:0d, IRQ 11\neth0: Identified\
  \ 8139 chip type ORTL-8139C'\neth0: Setting half-duplex based on auto-negotiated\
  \ partner ability 0000.\n...\n```\n\n注意，此时尚未为设备分配 IP 地址或其他设置。Linux 可以使用多个以太网接口，第一个以太网设备编号为\
  \ `eth0`，第二个为 `eth1`，以此此类推。内核识别的每个不同以太网设备可能会根据其内核模块报告额外的或不同的信息。例如：\n\n```\nmatthew@seymour:~$\
  \ dmesg\n\n...\neepro100.c:v1.09j-t 9/29/99 Donald Becker http://cesdis.gsfc.nasa.gov/linux/drive/eepro100.html\n\
  eepro100.c: $Revision: 1.36 $ 2000/11/17 Modified by Andrey V.\n```\n\n\n\n\n`ifconfig`\
  \ 用于配置你的网络接口。你可以使用它执行以下操作：\n\n- 激活或停用你的网卡（NIC）或更改网卡模式。\n- 更改机器的 IP 地址、子网掩码或广播地址。\n\
  - 创建 IP 别名以允许网卡上使用多个 IP 地址。\n- 为点对连接设置目标地址。\n\n你可以通过一条命令根据需要更改任意数量或不更改这些选项。该命令的基本结构如下：\n\
  \n`ifconfig [network device] options`\n\n[Table 17.1] 显示了 `ifconfig` 选项的一个子及其用法。\n\
  \n### 表 17.1 `ifconfig` 选项\n\n![Image](img/17tab01.jpg)\n\n`ifconfig` 的 man 页显示了其他选项，使你的机器能够与\
  \ AppleTalk、Novell、IPv6 等多种网络类型接口。再次，请阅读 man 页以获取有关这些网络类型的详情。\n\n> 注意\n> 混杂模式（Promiscuous\
  \ mode）会导致网卡接收网络上的所有数据包。它通常用于网络嗅探。多组播模式（Multicasting mode）允许网卡接收网络上的所有多组播流量。\n\n\
  如果没有给出任何参数，`ifconfig` 将显示活动接口的状态。例如，在没有参数且有一个活动并配置的网卡的情况下，`ifconfig` 的输出看起来所示：\n\
  \n```\nmatthew@seymour:~$ ifconfig\n\neth0      Link encap:Ethernet  HWaddr 00:90:f5:8e:52:b5\n\
  \          UP BROADCAST MULTICAST  MTU:1500  Metric:1\n          RX packets:0 errors:0\
  \ dropped:0 overruns:0 frame:0\n          TX packets:0 errors:0 dropped:0 overruns:0\
  \ carrier:0\n          collisions:0 txqueuelen:1000\n          RX bytes:0 (0.0 B)\
  \  TX bytes:0 (0.0 B)\n          Interrupt:30 Base address:0xc000\nlo          Link\
  \ encap:Local Loopback\n          inet addr:127.0.0.1  Mask:255.0.0.0\n        \
  \  inet6 addr: ::1/128 Scope:Host\n          UP LOOPBACK RUNNING  MTU:16436  Metric:1\n\
  \          RX packets:314 errors:0 dropped:0 overruns:0 frame:0\n          TX packets:314\
  \ errors:0 dropped:0 overruns:0 carrier:0\n          collisions:0 txqueuelen:0\n\
  \          RX bytes:25204 (25.2 KB)  TX bytes:25204 (25.2 KB)\nwlan0      Link encap:Ethernet\
  \  HWaddr 00:16:ea:d4:58:88\n          inet addr:192.168.1.106  Bcast:192.168.1.255\
  \  Mask:255.255.255.0\n          inet6 addr: fe80::216:eaff:fed4:5888/64 Scope:Link\n\
  \          UP BROADCAST RUNNING MULTICAST  MTU:1500  Metric:1\n          RX packets:325832\
  \ errors:0 dropped:0 overruns:0 frame:0\n          TX packets:302754 errors:0 dropped:0\
  \ overruns:0 carrier:0\n          collisions:0 txqueuelen:1000\n          RX bytes:207381807\
  \ (207.3 MB)  TX bytes:40442735 (40.4 MB)\n```\n\n该输出非常易理解。`inet` 条目显示接口的 IP 地址。`UP`\
  \ 表示该接口已就绪可用，`BROADCAST` 表示接口连接到支持广播消息的网络（`ethernet`），`RUNNING` 意味着接口正在运行，而 `LOOPBACK`\
  \ 显示哪个设备（`lo`）是回环地址。`eth0` 上的最大传输单元（`MTU`）为 `1500` 字节。这决定了可以通过此接口传输的最大数据包的大小（有时为了性能增强会将其“调优”其他值）。`Metric`\
  \ 是一个 0 到 3 之间的数字，与从接口放入路由表中的信息量有关。数字越小，信息量越少。\n\n`ifconfig` 命令可用于显示信息或控制特定接口（见表\
  \ 17.1）。例如，要停用主机上的第一个设备，请使用 `ifconfig` 命令、接口名称和 `down`：\n\n```\nmatthew@seymour:~$\
  \ sudo ifconfig eth0 down\n```\n\n你也可以通过指定主机名或 IP 地址来配置并激活设备。例如，要使用特定 IP 地址配置并激活（启动）`eth0`\
  \ 接口，请使用 `ifconfig` 命令：\n\n```\nmatthew@seymour:~$ sudo ifconfig eth0 192.168.2.9\
  \ netmask 255.255.255.0 up\n```\n\n如果你在系统的 `/etc/hosts` 文件中定义了主机（参见本章稍后的网络配置部分），你可以根据定义的主机名配置并激活接口，如下：\n\
  \n```\nmatthew@seymour:~$ sudo ifconfig eth0 dog.hudson up\n```\n\n下一节解释了如何配置你的系统。\n\
  \n### `/sbin/route`\n\n`route` 命令用于配置你的网络，它在 `ifconfig` 初始化接口后用于在内存中构建路由表并显示路由信息。`route`\
  \ 通常用于设置到其他网络或其他主机的静态路由。要显示路由表，使用不带选项的 `route` 命令。显示将类似于：\n\n```\nmatthew@seymour:~$\
  \ route\n\nKernel routing table\nDestination     Gateway         Genmask       \
  \  Flags  Metric  Ref  Use Iface\n192.168.1.0     0.0.0.0         255.255.255.0\
  \   U       2     0    0 wlan0\nlink-local      0.0.0.0         255.255.0.0    \
  \ U      1000    0    0 wlan0\ndefault         192.168.1.0     0.0.0.0         UG\
  \      0     0    0 wlan0\n```\n\n在第一列中，`Destination` 是接收主机的 IP 地址（如果位于 `/etc/hosts`\
  \ 或 `/etc/networks` 中，则是主机名）。`default` 条目是该机器的默认网关。`Gateway` 列列数据包到达目标必须通过的网关。星号（`*`）意味着数据包直接到达主机。`Genmask`\
  \ 是子网掩码。`Flags` 列可以包含多个条目。在我们的示例中，`U` 验证已启用，`G` 指定 `Destination` 需要通过网关。`Metric`\
  \ 列显示到 `Destination` 的距离。某些守护进程使用此来确定最佳路由。`Ref` 列被某些 UNIX 变体用于传递路由引用。Linux 不使用。`Use`\
  \ 列指示此条目被查询的次数。最后，`Iface` 列是对应条目的接口名称。\n\n对 `route` 命令使用 `-n` 选项将相同的信息，用 IP 地址替换名称和星号（`*`），看起来如下：\n\
  \n```\nmatthew@seymour:~$ /sbin/route -n\n\nKernel routing table\nDestination  \
  \   Gateway         Genmask         Flags  Metric  Ref  Use Iface\n192.168.1.0 \
  \    0.0.0.0         255.255.255.0   U       2     0    0 wlan0\nlink-local    \
  \  0.0.0.0         255.255.0.0     U      1000    0    0 wlan0\n0.0.0.0        \
  \ 192.168.1.0     0.0.0.0         UG      0     0    0 wlan0\n```\n\n\n\n\n\n你也可以使用\
  \ `route` 命令为特定主机配置一个直接（点对点）连接。例如，假设你有一个包含两台电脑的家庭网络。其中一台电脑有一个调制解调器，通过它连接到你的业务网络。你通常在另一台电脑上工作。你可以使用以下命令通过\
  \ `route` 命令建立通过特定主机的连接：\n\n```\nmatthew@seymour:~$ sudo route add -host 198.135.62.25\
  \ gw 149.112.50.65\n```\n\n上面的示例将带有调制解调器的电脑设置为你正在使用的电脑的网关。如果你有一个连接到互联网的网关或防火墙，这种类型的命令非常有用。`route`\
  \ 命令还有许多其他用途，例如操作默认数据包大小。请查看这些用途的 man 手页（帮助文档）。\n\n#### `/bin/netstat`\n\n`netstat`\
  \ 命令用于显示你的网络状态。它有几个参数，可以根据你的喜好显示多或少的信息。服务通过 `sockets`（两台计算机之间的应用程序到应用程序连接）列出。你可以使用\
  \ `netstat` 在表 17.2 中显示信息。\n\n表 17.2 `netstat` 选项\n\n![Image](img/17tab02.jpg)\n\
  \n该命令还有其他可用选项，但它们的使用频率较低。与 `route` 命令一样，man 手页可以提供关于所有选项和参数的详细信息。\n\n#### 网络配置文件\n\
  \n如前所述，可以通过修改五个网络配置文件来更改系统的基本网络交互：\n\n* `/etc/hosts`—地址、主机名和别名的的列表。\n* `/etc/services`—网络服务和端口连接。\n\
  * `/etc/nsswitch.conf`—Linux 网络信息服务配置。\n* `/etc/resolv.conf`—`域名系统服务 (DNS)` 域（搜索）设置。\n\
  * `/etc/host.conf`—网络信息搜索顺序（默认情况下，先是 `/etc/hosts`，然后是 DNS）。\n\n修改这些文件后，更改将生效。与大多数配置文件一样，可以在注释前添加井号（`#`）注释。所有这些文件都有\
  \ man 手页，你可以在其中找到更多信息。\n\n##### 向 `/etc/hosts` 添加主机\n\n`/etc/hosts` 文件是 IP 到主机名的映射。如果你没有使用\
  \ DNS 或其他命名服务，并且连接到大型网络，此文件可能会变得非常大，管理起来会非常头疼。一个小的 `/etc/hosts` 文件可能如下：\n\n```\n\
  127.0.0.1       localhost\n127.0.1.1       optimus\n\n# 以下行对于支持 IPv6 的主机是理想的\n::1\
  \      ip6-localhost ip6-loopback\nfe00::0 ip6-localnet\nff00::0 ip6-mcastprefix\n\
  ff02::1 ip6-allnodes\nff02::2 ip6-allrouters\nff02::3 ip6-allhosts\n```\n\n第一条是回环条目。第二条是机器名称。如果网络上没有使用命名服务，`myhost`\
  \ 能够通过名称识别的唯一主机是 `yourhost`。（网络上的 IP 地址仍然可以使用。）\n\n##### `/etc/services` 中的服务设置\n\
  \n`/etc/services` 文件将端口号映射到服务。前几行看起来如下。（`/etc/services` 文件可能非常长，超过 500 行。）\n\n```\n\
  # 每行描述一个服务，格式如下：\n#\n# service-name port/protocol [aliases ...]  [# comment]\ntcpmux\
  \      1/tcp           # TCP 端口服务复用器\ntcpmux      1/udp           # TCP 端口服务复用器\n\
  rje         5/tcp           # 远程作业输入\nrje         5/udp           # 远程作业输入\necho\
  \        7/tcp\necho        7/udp\ndiscard     9/tcp           sink null\ndiscard\
  \     9/udp           sink null\nsystat      11/tcp          users\n```\n\n通常情况下，每个服务有两个条目，因为大多数服务可以使用\
  \ TCP 或 UDP 进行传输。通常在初始配置 `/etc/services` 之后，你不需要更改它。\n\n##### 使用 `/etc/nsswitch.conf`\
  \ 修改命名服务\n\n`nsswitch.conf` 文件最初由 Sun Microsystems 开发，用于指定访问服务的顺序。经常修改的条目是 `hosts`。它的部分内容如下：\n\
  \n```\npasswd: files dns\ngroup: files dns\nhosts: files dns\nnetworks: files dns\n\
  services: files dns\nethers: files dns\nrpc: files dns\n```\n\n##### 使用 `/etc/resolv.conf`\
  \ 设置域名服务器\n\n`/resolv.conf` 由 DNS 使用，示例所示：\n\n```\nnameserver 192.168.1.1\nnameserver\
  \ 8.8.8.8\nsearch mydomain.com\n```\n\n这设置了要使用的域名。如果你使用 DHCP，此文件的内容将自动设置。\n\n#####\
  \ 使用 `/etc/host.conf` 设置搜索顺序\n\n`/host.conf` 文件列出了你的机器搜索主机名解析的顺序。默认设置如下：\n\n```\n\
  order hosts, bind\n```\n\n在这个示例中，主机首先检查 `hosts` 文件，然后进行查找。还有几个选项控制命名服务的使用。`nosof`\
  \ 可以是系统安全的一个良好选项。它比较标准 DNS 查询和反向查找（主机到 IP，再从 IP 到主机），如果两者不匹配则查找失败。缺点是经常使用了代理服务，会导致查找失败，因此你希望谨慎使用它。\n\
  \n#### 使用图形化配置工具\n\nUbuntu 在桌面用户使用图形化配置工具配置网络方面做了很大改进。对于大多数人来说，你了解的所有知识都包含在第二章“安装后配置”中的\
  \ Network Manager 章节。对于其他人，可以通过右键点击顶部栏上的网络图标并从菜单中选择“编辑连接”来配置你的网络连接，如图 17.1](#ch17.html_ch17fig01）所示。在打开的网络连接窗口中，你可以从各种连接类型进行配置，包括有线、无线、移动宽带、VPN\
  \ 和 DSL，如图 17.2](#ch17.html_ch17fig02）所示。默认情况下，每项都设置为自动配置，大多数用户不需要更改可用设置。如果你确实需要，只需选择相应的选项卡并点击“添加”按钮；然后你可以根据需要进行配置和微调，如图\
  \ 17.3](#ch17.html_ch17fig03）中的无线连接示例所示。\n\n```\nnm-connection-editor\n```\n\n\n\
  \n\n\n正如其名所示，动态主机配置协议（DHCP）用于为连接到网络的主机进行配置。DHCP 允许网络管理员在网卡（NIC）激活后连接网络时，为每个主机配置所有的\
  \ TCP/IP 参数。这些参数包括自动为网卡分配 IP 地址、在 `/etc/resolv.conf` 中设置名称服务器条目，以及为主机配置默认路由和网关信息。本节首先描述了如何使用\
  \ DHCP 为你的网卡获取 IP 地址分配，然后介绍了如何使用 Ubuntu 快速设置并启动 DHCP 服务器。\n\n* *\n\n### 笔记本\n\n\
  你可以通过阅读 RFC 2131，“动态主机配置协议”，可以在 [www.ietf.org/rfc/rfc2131.txt](http://www.ietf.org/rfc/rfc2131.txt)\
  \ 了解更多关于 DHCP 的信息。\n\n* *\n\n### DHCP 如何工作\n\nDHCP 通过持有可能连接到网络的网络客户端的标识信息，提供了网络参数的持久化存储。最常见的三个标识信息对如下：\n\
  \n• **网络子网/主机地址**——主机用于随意连接到网络。\n\n• **子网/主机名**——允许指定的主机连接到子网。\n\n• **子网/硬件地址**——允许特定客户端从\
  \ DHCP 获取主机名后连接到网络。\n\nDHCP 还会为客户端分配临时的或永久的网络（IP）地址。当临时分配（称为租约）超时时，客户端可以请求延长租约；或者，如果不再需要该地址，客户端可以放弃该地址。对于将永久连接到有可用地址的网络的主机，DHCP\
  \ 会分配无限的租约。\n\nDHCP 为你的网络带来了一些优势。首先，它将分配 IP 地址的责任从网络管理员（管理员可能会不小心分配重复的 IP 地址）转移到了\
  \ DHCP 服务器。其次，DHCP 能够更好地利用有限的 IP 地址。如果用户由于某种原因离开办公室，该用户的主机可以释放其 IP 地址以供其他主机使用。\n\
  \n像生活中的大多数事情一样，DHCP 并不完美。不能仅通过 DHCP 配置服务器，因为 DNS 并不知道 DHCP 为主机分配了哪些地址。这意味着在仅通过 DHCP\
  \ 配置的机器上无法进行 DNS 查询；因此，无法提供服务。然而，当使用子网/主机名或子网/硬件地址标识符时，DHCP 可以根据 DNS 条目进行分配。\n\n\
  * *\n\n### 笔记本\n\n使用注册主机名通过 DHCP 配置服务器的问题正在通过动态 DNS（Dynamic DNS）解决，当它完全开发后，将允许 DHCP\
  \ 向 DNS 注册 IP 地址。这将允许你注册一个域名（例如 [matthewhelmke.com](http://matthewhelmke.com)），并能够轻松地访问该域名的\
  \ Web 服务器，而无需对特定主机使用静态 IP 地址。要克服的最大障碍是启用允许每个连接到系统的主机更新 DNS 带来的安全影响。一些公司，如 Dyn.com（[www.dyndns.org/](http://www.dyndns.org/)），已经已经提供了动态\
  \ DNS 服务，并拥有适用于 Linux 的客户端。\n\n* *\n\n### 在安装和启动时激活 DHCP\n\nUbuntu 默认将你的网络接口设置为使用\
  \ DHCP，因为这是设置网络接口最的方法。对于你的网卡使用动态或 DHCP 分配的 IP 接入方案，广播地址被设置为 `255.255.255.255`，因为用于\
  \ IP 配置的 DHCP 客户端 `dhclient` 初始并不知道 DHCP 服务器所在的位置，因此请求必须传输到每个网络直到服务器回复。\n\n为你的网卡使用\
  \ DHCP 的指令可以在 `/etc/network/interfaces` 下找到，其中有一行写着 `dhcp`。\n\n获取 DHCP 设置的其他特定设置保存在名为\
  \ `dhclient.conf` 的文件中，位于 `/etc/dhcp3/dhclient.conf` 目录下，并记录在 `dhclient.conf` 手页中。`dhcpoptions`\
  \ 手页中也记录了超过 100 多个选项。\n\n然而，使用 DHCP 并不那么复杂。如果你想使用 DHCP 并且知道网络上有一个服务器，你可以通过 `dhclient`\
  \ 快速配置你的网卡，如下：\n\n```\nmatthew@seymour:~$ sudo dhclient\n\nInternet Systems Consortium\
  \ DHCP Client V3.1.3\n\nCopyright 2004-2009 Internet Systems Consortium.\n\nAll\
  \ rights reserved.\n\nFor info, please visit https://www.isc.org/software/dhcp/\n\
  \nListening on LPF/eth0/00:90:f5:8e:52:b5\n\nSending on   LPF/eth0/00:90:f5:8e:52:b5\n\
  \nListening on LPF/virbr0/ee:1a:62:7e:e2:a2\n\nSending on   LPF/virbr0/ee:1a:62:7e:e2:a2\n\
  \nListening on LPF/wlan0/00:16:ea:d4:58:88\n\nSending on   LPF/wlan0/00:16:ea:d4:58:88\n\
  \nSending on   Socket/fallback\n\nDHCPDISCOVER on eth0 to 255.255.255.255 port 67\
  \ interval 7\n\nDHCPDISCOVER on wlan0 to 255.255.255.255 port 67\n\nDHCPOFFER on\
  \ eth0 to 255.255.255.255 port 67\n\nDHCPOFFER on wlan0 to 255.255.255.255 port\
  \ 67\n\nDHCPREQUEST on eth0 to 255.255.255.255 port 67\n\nDHCPREQUEST on wlan0 to\
  \ 255.255.255.255 port 67\n\nDHCPACK on eth0 to 255.255.255.255 port 67\n\nDHCPACK\
  \ on wlan0 to 255.255.255.255 port 67\n```\n\n### DHCP 软件安装和配置\n\nUbuntu 默认将你的网络接口设置为使用\
  \ DHCP，因为这是设置网络接口最简单的方法。DHCP 客户端和服务器的安装非常直接，因为 Ubuntu 已经包含了 `dhclient`，你不需要启用它。\n\
  \n#### `dhclient`\n\nDHCP 在安装时会自动启用，所以你不需要担心。使用 `synaptic` 或 `apt-get`。\n\n####\
  \ `dhclient`\n\n然而，你可以微调 `dhclient` 的工作以及它获取信息的方式。你可能不需要这种精力；但如果你需要，可以创建一个名为 `dhclient.conf`\
  \ 的文件并保存到 `/etc`。\n\n* *\n\n### 注意\n\n你不应该直接用任何旧文件覆盖 `dhclient.conf`，因为这样做会导致痛苦的问题。相反，请这样复制文件：\n\
  \n```\nmatthew@seymour:~$ sudo cp /etc/dhcp3/dhclient.conf /etc/dhcp3/dhclient.conf.backup\n\
  ```\n\n这样，如果出现任何问题，你可以通过将备份恢复到原始位置来替换修改的文件。\n\n* *\n\n`dhclient.conf` 的一些选项包括：\n\
  \n- timeout time——在放弃尝试之前等待的时间（默认为 60 秒）。\n\n- retry time——在重试之前等待的时间（默认为 5 分钟）。\n\
  \n- select-timeout time——在选择 DHCP 报价之前等待的时间（默认为 0 秒）。\n\n- reboot time——在尝试获取之前设置的\
  \ IP 之前等待的时间（默认为 10 秒）。\n\n- renew date——续约 IP 租约，其中 `date` 的格式为 `<weekday> <year>/<month>/<day>\
  \ <hour>:<minute>:<second>`，例如 `3 2010/7/7 22:01:01` 代表 2010 年 7 月 7 日星期三晚上 10:01:01。\n\
  \n更多关于附加设置的信息请参考 `dhclient.conf` 手页。\n\n### DHCP 服务器\n\n再次，在你的计算机上安装 DHCP 服务器最简单的方法是使用\
  \ `synaptic` 或 `apt-get` 获取 `dchp3-server` 包。如果你有此意，可以去 *Internet Software Consortium\
  \ (ISC)* 网站下载并自行构建源码。然而，我们建议你留在 Ubuntu 仓库中的包，因为在有安全更新时很容易更新。\n\n\n\n\n如果你决定从 ISC\
  \ 网站下载源码进行安装，安装过程将非常简单。只需解压你的 `tar` 文件，在源码目录根目录下运行 `./configure`，运行 `make`，最后，如果没有错误，运行\
  \ `make install`。这会将 DHCP 守护进程所需的所有文件放置在正确的位置。如果你有磁盘空间，最好在确认 DHCP 运行正常之前保留源码文件；否则，你可以删除源码树。\n\
  \n***\n\n### 注意事项\n\n无论你选择哪种安装方法，请确保已创建一个名为 `/etc/dhcp3/dhcpd.leases` 的文件。该文件可以是空的，但为了让\
  \ `dhcpd` 正常启动，它必须存在。\n\n***\n\n## 使用 DHCP 配置网络主机\n\n使用 DHCP 配置网络看起来可能很复杂，但如果你的需求很简单，实际上非常容易。如果你的网络较为复杂，取决于取决于你想让\
  \ DHCP 承担多少工作，服务器配置可能需要花费更多精力。\n\n配置服务器需要一些思考和部分工作。幸运的是，这些工作只需要编辑单个配置文件 `/etc/dhcp3/dhcpd.conf`。若要在系统启动时启动服务器，请使用\
  \ `service` 或 `ntsysv` 命令。\n\n`/etc/dhcp3/dhcpd.conf` 文件包含了运行 `dhcpd` 所需的所有信息。Ubuntu\
  \ 在 `/usr/share/doc/dhcp*/dhcpd.conf.sample` 中包含了一个示例的 `dhcpd.conf`。DHCP 服务器源码文件中也包含一个示例的\
  \ `dhcpd.conf` 文件。\n\n可以将 `/etc/dhcp3/dhcpd.conf` 文件看作由三部分组成。第一部分包含了 DHCP 本身的配置。这些配置包括：\n\
  \n* **设置域名称**——`option domain-name \"example.org\"`\n* **设置 DNS 服务器**——`option domain-name-servers\
  \ ns1.example.org, ns2.example.org`（可以替换 IP 地址。）\n* **设置默认和最大租约时间**——`default-lease-time\
  \ 3600` 和 `max-lease-time 14400`\n\n第一部分的其他设置还包括服务器是否为主服务器（权威服务器）以及 DHCP 应该使用什么类型的日志。这些设置被视为默认值，在更复杂的情况下，可以通过配置中的子网和主机部分进行覆盖。\n\
  \n***\n\n### 注意事项\n\n`dhcpd.conf` 文件在每个命令语句后都需要加上分号（`;`）。如果你的配置文件有错误或运行不正常，请检查此处。\n\
  \n***\n\n`dhcpd.conf` 的下一部分处理你的 DHCP 服务器服务的不同子网；这部分非常直观。每个子网都是单独定义的，看起来如下：\n\n``````\n\
  subnet 10.5.5.0 netmask 255.255.255.224 {\n  range 10.5.5.26 10.5.5.30;\n  option\
  \ domain-name-servers ns1.internal.example.org;\n  option domain-name \"internal.example.org\"\
  ;\n  option routers 10.5.5.1;\n  option broadcast-address 10.5.5.31;\n  default-lease-time\
  \ 600;\n  max-lease-time 7200;\n}\n```````\n\n这定义了 `10.5.5.0` 子网的 IP 地址分配。它定义了从\
  \ `10.5.5.26` 到 `10.5.5.30` 的 IP 地址范围，动态分配给位于该子网主机。此示例表明，可以在配置文件的子网部分设置任何 TCP/IP\
  \ 选项。它显示了子网将连接到哪个 DNS 服务器，这对于 DNS 服务器负载均衡很有帮助，或者可以限制通过 DNS 能够访问的主机。它定义了域名称，因此你可以在网络上拥有多个域。它还可以更改默认和最大租约时间。\n\
  \n如果你想让服务器忽略特定的子网，可以采取以下操作：\n\n``````\nsubnet 10.152.187.0 netmask 255.255.255.0\
  \ {\n\n}\n```````\n\n这为 `10.152.187.0` 子网未定义任何选项；因此，DHCP 服务器会忽略它。\n\n你的 `dhcp.conf`\
  \ 的最后一部分用于定义主机。如果你希望网络上的某个计算机具有特定的 IP 地址或其他针对该主机的特定信息，这会很有用。完成主机部分的关键是知道主机的硬件地址。正如你在本章早些章节的“网络用硬件设备”部分中学到的，硬件地址用于在配置时区分主机。你可以使用之前描述的\
  \ `ifconfig` 命令获取硬件地址。硬件地址位于 `eth0` 行，标记为 `Hwaddr`。\n\n``````\nhost hopper {\n \
  \ hardware ethernet 08:00:07:26:c0:a5;\n  fixed-address hopper.matthewhelmke.com;\n\
  }\n```````\n\n此示例针对硬件地址为 `08:00:07:26:c0:a5` 的主机，并进行 DNS 查询为 `hopper.matthewhelmke.com`\
  \ 分配 IP 地址。\n\n***\n\n### 注意\n\n记住，为了避免问题，局域网上应只配置一个 DHCP 服务器。Windows NT 服务器默认安装了\
  \ DHCP 服务器。由于没有配置文件供其查找，DHCP 在旧操作系统上可能无法正常工作。检查你的 NT 服务器是否存在这种情况并禁用 DHCP；之后，你的其他启用\
  \ DHCP 的主机应该配置正确。\n\n### 注意事项\n\n`dhcpd.conf` 文件可以使用大量的选项：有整本书专门介绍 DHCP。最全面的书籍是《DHCP\
  \ 手册》。前面的示例让你的 DHCP 服务器和客户端运行起来。DHCP 服务器发行版包含一个 `dhcpd.conf` 文件示例，你可以将其作为网络模板。\n\
  \n## 无线网络\n\n自 20 世纪 90 年代初第一个标准开发出来以来，Linux 就支持无线网络。随着计算机变得越来越小，对无线网络的需求日益增加；同时，传输速度不断提高。创建无线网络有多种方法。以下章节将介绍一些用于初始化、配置和管理\
  \ Ubuntu 系统无线网络的 Linux 命令。\n\n#### Ubuntu 对无线网络的支持\n\nUbuntu 自带的 Linux 内核对无线网络提供了广泛支持。用于配置、管理或显示无线连接信息的无线工具包括：\n\
  \n* `iwconfig`—设置无线网络接口的网络名称、加密、传输速率和其他功能。\n* `iwlist`—显示无线接口的信息，如速率、功率水平或使用的频率。\n\
  * `iwpriv`—用于设置无线网络接口的漫游等可选功能。\n* `iwspy`—显示多个节点的无线统计数据。\n\n\n\n\n无线设备的支持情况各异，但大多数现代（即\
  \ 2005 年之后）的无线设备应该都能 Ubuntu 上运行。通常情况下，Linux 无线设备软件（通常以内核模块的形式存在）支持创建一个以太网设备，该设备可以使用\
  \ `ifconfig` 等传统接口工具进行管理——设备的无线功能则通过各种无线软件工具进行管理。\n\n例如，当一个无线网络设备首次被识别并初始化使用时，驱动程序很可能会报告一个新的设备：\n\
  \n```\nzd1211rw 5-4:1.0: firmware version 4725\nzd1211rw 5-4:1.0: zd1211b chip 050d:705c\
  \ v4810 \\\nhigh 00-17-3f AL2230_RF pa0 G--ns\nzd1211rw 5-4:1.0: eth2\nusbcore:\
  \ registered new interface driver zd1211rw\n```\n\n此输出（来自 `dmesg` 命令）显示 `eth2` 设备已报告。如果使用了\
  \ DHCP，设备将自动加入最近的无线子网并自动分配 IP 地址。如果没有使用，下一步是使用 `iwconfig` 等无线工具设置无线设备的各种参数。`iwconfig`\
  \ 命令结合设备名称（在此例中为 `eth2`）显示状态：\n\n```\nmatthew@seymour:~$ iwconfig eth2\neth2   \
  \   IEEE 802.11b/g  ESSID:\"SKY35120\"  Nickname:\"zd1211\"\n              Mode:Managed\
  \  Frequency:2.462 GHz  \\\nAccess Point: 00:18:4D:06:8E:2A\n              Bit Rate=24\
  \ Mb/s\n              Encryption key:0EFD-C1AF-5C8D-B2C6-7A89-3790-07A7-AC64-0AB5\\\
  \n-C36E-D1E9-A230-1DB9-D227-2EB6-D6C8   Security mode:open\n              Link Quality=100/100\
  \  Signal level=82/100\n              Rx invalid nwid:0  Rx invalid crypt:0  Rx\
  \ invalid frag:0\n              Tx excessive retries:0  Invalid misc:0   Missed\
  \ beacon:0\n```\n\n此示例显示了连接到名为 `SKY35120` 网络的 24Mbps 连接。若要更改参数（例如传输速率），可以使用 `iwconfig`\
  \ 命令的命令行选项，如下所示：\n\n```\nmatthew@seymour:~$ sudo iwconfig eth0 rate 11M\n```\n\n\
  `iwconfig` 命令支持的其他选项包括 `essid`，用于设置网卡通过名称连接到特定网络；`mode`，用于允许网卡自动从访问点获取设置或连接到另一个无线主机；以及\
  \ `freq`，用于设置通信时使用的频率。附加选项还包括 `channel`、`frag`、`enc`（用于加密）、`power` 和 `txpower`。这些选项的详细信息和示例请参见\
  \ `iwconfig` 的手册页。\n\n然后，你可以使用 `ifconfig` 命令或 Ubuntu 图形化工具来设置设备网络参数，接口将像在有线局域网中一样工作。`iwconfig`\
  \ 命令的一个方便的输出是链路质量输出，它可以用于 shell 脚本或其他图形实用程序以进行信号监控。\n\n## 无线网络的优势\n\n无线网络的优势在于其移动性和潜在的范围。如果你有一组足够大的天线网络，你的网络可以延伸许多英里。这将是一个昂贵的网络，但它能够轻松突破办公室的砖墙限制。\n\
  \n无线网络对于大学校园也是一个巨大的优势，随着越来越多的学生期望在宿舍里有网络连接，无线网络消除了拆墙布线安装电缆的需求。无线网卡的价格非常合理，可以根据需要轻松发放给每位学生。\n\
  \n家庭用户也可以从无线网络中受益。对于那些无法对家庭进行有线网络改装的人来说，这是一个潜在的解决方案。此外，无线网络消除了连接不同房间电脑时沿踢脚线和天花板运行的杂线条。有了无线家庭网络，你甚至不再限于室内。根据路由器的发射功率，你可以坐在后院，在打字时看着云朵。\n\
  \n选择正确的无线设备类型是一个重要的决定。接下来的章节将讨论当前用于无线网络的协议之间的一些基本区别。\n\n## 在可用无线协议中进行选择\n\n电气电子工程师协会\
  \ (IEEE) 从 1990 年开始认真考虑无线网络。这是无线局域网标准工作小组首次引入 802.11 标准时期。该小组大致基于蜂窝网络使用的架构制定了标准。无线网络由基站控制，基站可以只是连接到网络上的发射器，或者在今天更常见的是路由器。\n\
  \n较大的网络可以使用多个基站。具有多个基站的网络通常称为 `distribution systems`（分布系统）。分布系统可扩大覆盖范围并支持无线主机漫游。你也可以使用外部全向天线来增加覆盖范围，或者在需要时使用点对点或定向天线来连接远处的计算机或网络。目前，最便宜的无线\
  \ Linux 网络是使用支持 N 的设备（如访问点）构建的，虽然 N 标准尚未正式通过，因为 IEEE 仍在讨论完整的 N，这意味着它们实现的是草案标准。\n\
  \n一种早期标准 802.11a 比 802.11b 提供更高的传输速率，且 802.11a 网卡是常见的。基于 802.11g 的设备提供了 802.11a\
  \ 的速度提升，并与 802.11b 兼容，这些设备很常见。其他无线协议包括蓝牙，它提供高达 720Kbps 的数据传输。蓝牙用于短距离设备通信（例如打印机），典型范围仅为\
  \ 10 米。蓝牙与 802.11 网络冲突，因为它也使用 2.4GHz 频。你可以在 `www.bluetooth.com/` 获取更多信息。\n\n802.11\
  \ 标准规定无线设备使用 2400MHz 到 2483.5MHz 的频率范围。这是北美和欧洲使用的标准。然而，由于日本法律规定，无线网络限制在 2471MHz\
  \ 到 2479MHz。在这些范围内，每个网络被分配了最多 79 个不重叠的频率通道。这减少了两个相邻无线网络在同一时间使用相同通道的概率。它还允许跳频，这可以用于安全。\n\
  \n### 越网络到互联网\n\nUbuntu 支持多种连接互联网和使用资源的方式。在本书版本的 Ubuntu 中，你会有许多互联网相关的软件，你还可以从各种来源下载数百个额外的免费实用程序。要使用这些程序，你必须有一个良好的互联网连接。\n\
  \n在本节中，你将学习如何使用调制解调器和点点协议 (PPP) 在 Ubuntu 中设置互联网连接，以及数字用户线路 (DSL) 和电缆调制解调器等其他连接方法。几年前，让拨号连接工作非常困难——因此本书有一整章章都在讨论它。现在，只要你有硬件调制解调器，配置就会非常简单。\n\
  \n\n\n\n\n尽管许多丰富的 Linux 用户继续使用手动脚本来建立互联网连接，但新用户和经验丰富的系统管理员都会发现 Ubuntu 的图形化网络配置界面要用得多。在本章中，你将学习如何使用\
  \ Internet 连接向导，以及如何配置 Ubuntu 提供拨入 PPP 支持。本章还描述了如何使用 Roaring Penguin 的 DSL 工具通过电缆调制调器连接管理连接。\n\
  \n## 通用配置信息\n\n尽管 Ubuntu 在配置互联网连接方面提供了极大的灵活性，但这种灵活性是以复杂性增加为代价的。要在 Ubuntu 中配置互联网连接，你必须比从`互联网服务提供商\
  \ (ISP)` 通常提供的信息了解更多连接过程的细节。在本节中，你将学习应该询问哪些问题以及如何使用这些信息。\n\n某些 ISP 并不了解 Linux，或者不愿在他们的服务中支持它。幸运的是，这种态度正在迅速变化，大多数\
  \ ISP 都在使用兼容 Linux 的标准协议提供服务，即使他们（或其技术支持人员）并没有意识到自己的 ISP 对 Linux 是友好的。你只需要为了所需的信息稍加努力即可。\n\
  \n如果你是少数仍在使用拨号号调制调器账户的人之一（在 Linux 中称为其所使用的点点协议 `PPP`），你的 ISP 将为你的电脑提供静态或动态的`网协议\
  \ (IP)` 地址。动态 IP 地址每次每次拨号时都会更改，而静态 IP 地址则保持不变。ISP 还可能自动为你的电脑提供`域名服务 (DNS)` 服务器的名称。你需要知道电脑建立连接时拨号的电话号码；你的\
  \ ISP 也会提供该号码。你还需要一个工作的调制调器，并知道调制调器的设备名称（通常为 `/dev/modem`）。\n\n> 注意\n> 大 IP 地址是由\
  \ ISP 动态分配的；ISP 拥有一个地址池，你获得任何可用的地址。从 ISP 的角度来看，少量的地址可以服务大量人数，因为并不是所有人都会同时在线。对于大多数互联网服务，动态\
  \ IP 运行良好，因为将该信息路由到你那里是 ISP 的工作，而且它位于你和你想要使用的服务之间。但动态 IP 地址会更改，如果有人需要在同一个地址找到你（例如，你运行着网站或文件传输站点），那么一个每次登录都会更改的\
  \ IP 将无法很好工作。为此，你需要静态 IP。由于你的 ISP 无法将该 IP 与其他客户复用，因此它对静态 IP 的收费可能会比动态 IP 高。普通消费者不需要静态\
  \ IP 的好处，因此乐意为动态分配的 IP 支付更费用。此外，DNS 信息可以通过 ISP 通过 DHCP 自动提供。\n\n如果你正在使用 DSL 访问或电缆调制调器，你可能会通过\
  \ DHCP 动态 IP，或者可能被分配静态 IP。如果你使用 DHCP，可能会自动获得 DNS 服务器的名称，或者你必须手动设置 DNS（在这种情况下，你需要知道\
  \ DNS 服务器的 IP 地址）。\n\n在所有情况下，你必须知道你的用户名、密码，以及其他服务的邮件服务器和新闻服务器名称。如果你专门要求，可以从你的 ISP\
  \ 那里获取这些信息。\n\n> 注意\n> 本中的信息将帮助你理解并避免许多连接问题，但你可能仍遇到连接问题。请手留 ISP 技术帮助服务的电话号码，以防无法建立连接。但请注意，很少有\
  \ ISP 提供 Linux 支持，如果你的特殊情况无法通过从书中获得的知识来处理，你可能需要向精通 Linux 的朋友或 Linux 用户寻求帮助。当然，最好的寻找地方是互联网。使用\
  \ Google 的 Linux 页面（[`www.google.com/linux/`](http://www.google.com/linux/))）来研究问题，并查看其他用户是否发现了修复方法或规避方案。\n\
  \n## 配置数字用户线访问\n\nUbuntu 同样支持使用`数字用户线 (DSL)` 服务。尽管它将可用的不同 DSL 类型称为 `xDSL`（包括 ADSL、IDSL、SDSL\
  \ 和其他口味的 DSL 服务），但它们都可以使用 Internet 连接向导进行配置。DSL 服务通常提供 256Kbps 到 24Mbps 的传输速度，并通过铜质电话线从数据中心传输数据到单个用户站点（例如，你的家里）。许多\
  \ DSL 服务（技术上，是电缆而非 DSL）提供非对称速度，其中下载速度大于上传速度。\n\n> 注意\n> DSL 服务是一种“始终在线”的类型互联网服务，尽管你可以使用位于“系统-管理-网络”下的网络配置工具在\
  \ Ubuntu 下关闭连接。始终在线的连接会让你的电脑暴露在黑客的恶意攻击之下，黑客在互联网上搜寻试图访问其他计算机系统。除了关闭此类连接的能力外，Ubuntu\
  \ 还预配置为不监听任何网络端口，这意味着任何访问你电脑的尝试都将失败，因为 Ubuntu 将拒绝该请求。这相当于在你的电脑周围围了一道 12 英尺高的钢栅。\n\
  \nDSL 连接要求你的电脑或笔记本电脑中有一个以太网 NIC（有时是 Linux 中不易支持的 USB 接口）。许多用户还会配置具有至少两个 NIC 的网关、防火墙或其他电脑，以与局域网共享连接。我们在本章早些部分查看了硬件和协议问题。除了在安装\
  \ Ubuntu 期间解决的问题，防火墙或路由器的高级配置超出了本书的范围。\n\n### 理解以太网 PPP\n\n与提供静态 IP 地址的 ISP 建立 DSL\
  \ 连接很容易。不幸的是，许多 DSL 商使用一种名为`以太网的点对点协议 (PPPoE)`的 PPP 协议类型，通过将 PPP 信息封装在以太网帧内部提供动态\
  \ IP 地址分配和身份验证。Roaring Penguin 的 `rp-pppoe` 客户端可以在 Roaring Penguin 网站（[`www.roaringpenguin.com/penguin/pppoe/rp-pppoe-3.8.tar.gz`](http://www.roaringpenguin.com/penguin/pppoe/rp-pppoe-3.8.tar.gz)）获取，这些客户端使得难以配置的\
  \ PPPoE 连接变得容易处理得多。你可以下载并安装新版本。（请参见本章末尾“参考文献”部分中的 Roaring Penguin 链接。）\n\n\n\n\n\
  当 ISP（互联网服务商）最初推出 ADSL 服务时，他们通常会提供 ADSL 调制解器。然而，在世界许多地方，这些调制解器是可选的，这是一件好事，因为许多人选择带有内置调制解器的路由器来创建专用连接。在美国，这些设备很少见，但如果你愿意花钱，通常可以用市售调制解器替换随提供的调制解器。无论哪种方式，使用路由器都可以避免很多麻烦，并让你能够轻松将一个以上的计算机连接到互联网连接。请注意，如果你使用的是电缆连接，它们通常带有一根以太网，在这种情况下你只需要一个路由器（美国几乎所有的互联网接入方式都是这样工作的，因为调制解器/路由器一体机在美国很稀有）。购买前请咨询你的\
  \ ISP，以确保你最终使用的任何路由器都能得到他们的支持。你可能会发现你的 ISP 甚至作为软件包的一部分提供路由器。\n\n## 手动配置 PPPoE 连接\n\
  \n只有当你使用 ISP 提供的调制解器而不是路由器时，才需要使用这些步骤。在 Ubuntu 上手动设置 DSL 连接的基本步骤包括连接适当的硬件，如果你使用来自\
  \ Roaring Penguin 的 `rp-pppoe`，则运行一个简单的配置脚本。\n\n首先，将你的 DSL 调制解器连接到电话线，然后将以太网线从调制解器插入电脑的网卡。如果你计划与局域网其他部分共享\
  \ DSL 连接，你需要至少两个网卡：指定的 `eth0`（用于局域网）和 `eth1`（用于 DSL 连接）。\n\n以下示例假设你有多台计算机，并在局域网上共享\
  \ DSL 连接。\n\n首先，以 root 身份登录，并确保你的第一个 `eth0` 设备已启用并处于启动状态（可以使用 `ifconfig` 命令）。接下来，启动另一个接口，但按如下方式分配空\
  \ IP 地址：\n\n```bash\nmatthew@seymour:~$ sudo /sbin/ifconfig eth1 0.0.0.0 up\n```\n\
  \n现在使用 `adsl-setup` 命令配置你的系统，如下：\n\n```bash\nmatthew@seymour:~$ sudo /sbin/adsl-setup\n\
  ```\n\n你将看到一个文本脚本，并被要求输入用户名和用于连接的以太网接口（如 `eth1`）。然后你会被要求使用“按需”服务或让连接一直保持（直到被 root\
  \ 操作员关闭）。如果需要，你还可以设置以秒为单位的超时。如果你还没有配置系统的 `/etc/resolv.conf` 文件，你会被要求输入 ISP DNS 服务器的\
  \ IP 地址。\n\n之后，系统会提示你输入两次密码，并且必须选择使用的防火墙类型和 IP 伪装。（你之前在本章前面的“在 Ubuntu 中使用 IP 伪装”部分学习过\
  \ IP 伪装。）实际配置将自动完成。在今天，使用防火墙至关重要，除非你打算自己编写一套防火墙规则（相关讨论超出了本书的范围），否则请选择此选项。在你选择了防火墙和\
  \ IP 伪装设置后，你会被要求确认、保存并实施设置。你还有一个允许用户管理连接的选择，这对于家庭用户来说是一个实用的选项。\n\n系统的 `/etc/sysconfig/network-scripts/ifcfg-ppp0`、`/etc/resolv.conf`、`/etc/ppp/pap-secrets`\
  \ 和 `/etc/ppp/chap-secrets` 文件将被修改。\n\n配置完成后，使用 `adsl-start` 命令启动连接和 DSL 会话，如下：\n\
  \n```bash\nmatthew@seymour:~$ sudo /sbin/adsl-start\n```\n\nDSL 连接应该是瞬时完成的，但如果发生问题，请检查。DSL\
  \ 连接应该是几乎瞬时完成的，但如果发生问题，请检查。\n```\n。你可能会发现你的 ISP 甚至作为软件包的一部分提供路由器。由于所有的互联网接入方式都是这样工作的，因为调制解器/路由器一体机在美国很稀有）。\n\
  \n```bash\nmatthew@seymour:~$ sudo /sbin/adsl-setup\n```\n```\n```\n```\n```bash\n\
  matthew@seymour:~$ sudo /sbin/adsl-start\n```\n``````bash\nmatthew@seymour:~$ sudo\
  \ /sbin/adsl-start\n```\n```\n```。\n```\n```\n\n```\n\n## 拨号上网配置\n\n大多数 ISP 提供拨号连接，因为\
  \ PPP 是用于串口线的一种快速高效的协议。PPP 设计用于双向网络；TCP/IP 提供了数据传输协议。你不需要理解 PPP 的细节就可以使用它，设置 PPP\
  \ 非常简单。你可以通过命令行手动配置 PPP，也可以使用 Ubuntu 的网络工具图形化配置。每种方法产生相同的结果。\n\nPPP 使用系统的几个组件。第一个是名为\
  \ `pppd` 的守护进程，它控制 PPP。第二个是名为高级数据链路 (HDLC) 的驱动程序，它控制机器之间流。PPP 的第三个组件是名为 chat 的例程，在你需要时为你拨号到对面。尽管\
  \ PPP 有许多可调参数，但默认设置对大多数人有效。Ubuntu 包含了一些实用的工具来让你的拨号连接运行。在本节中，我们将查看两种可以让你上网的方法。\n\n\
  第一种方法是使用 `pppconfig` 配置，这是一个帮助你配置特定拨号设置的命令行实用。\n\n```bash\nmatthew@seymour:~$ sudo\
  \ pppconfig\n```\n\n在第一次连接之前，你需要通过以下命令将自己添加到 `dip` 和 `dialout` 组：\n\n```bash\nmatthew@seymour:~$\
  \ sudo adduser YOURHERE dip\nmatthew@seymour:~$ sudo adduser YOURHERE dialout\n\
  ```\n\n完成这些后，只需发布 `pon` 命令进行连接，使用 `poff` 命令断开连接。你可以创建多个不同的配置文件，并可以使用命令 `pon profilename`\
  \ 启动特定的配置，再次使用 `poff` 命令断开连接。\n\n### 注意\n\n许多软件调制解器无法与 Linux 工作，因为制造商不会发布关于它们的编程信息或提供\
