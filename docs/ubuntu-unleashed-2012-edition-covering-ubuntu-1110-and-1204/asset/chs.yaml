  \n\n\n\n\n如果你是 Linux 新手，那么选择这本书是明智之举。Sams Publishing 出版的 *Unleashed* 系列旨在深入探讨主题，兼顾初学者和高级用户，帮助他们提升知识与技能至全新水平。Ubuntu\
