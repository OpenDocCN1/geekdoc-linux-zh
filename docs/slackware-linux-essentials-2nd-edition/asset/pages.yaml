  md: '# 13.3 DNS Tools


    Domain Name Service (DNS for short) is that magical protocol that allows your
    computer to turn meaningless domain names like www.slack.com into meaningful IP
    address like 64.57.102.34. Computers can''t route packets to www.slack.com, but
    they can route packets to that name''s IP address. This gives us a convenient
    way to remember names. Without DNS we''d have to keep a mental database of just
    what IP address belongs to what computer, and that''s assuming the IP address
    doesn''t change. Clearly using names for computers is better, but how do we map
    names to IP addresses?


    # host


    host(1) can do this for you. host is used to map names to IP addresses. It is
    a very quick and simple utility without a lot of functions.


    ```

    % host www.slack.com

    www.slack.com is an alias for slack.com.

    slack.com has address 64.57.102.34

    ```


    But let''s say for some reason we want to map an IP address to a domain name;
    what then?


    # nslookup


    nslookup is a tried and true program that has weathered the ages. nslookup has
    been deprecated and may be removed from future releases. There is not even a man
    page for this program.


    +   - nslookup 64.57.102.34

    Note: nslookup is deprecated and may be removed from future releases.

    Consider using the ''dig'' or ''host'' programs instead. Run nslookup with the
    ''-sil[ent]'' option to prevent this message from appearing.

    Server: 192.168.1.254

    Address: 192.168.1.254#53'
