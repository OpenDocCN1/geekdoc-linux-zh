    # Command Keys


    As mentioned above, Emacs uses Control and Alt combinations for commands. The
    usual convention is to write these with C-letter and M-letter, respectively. So
    C-x means Control+x, and M-x means Alt+x. (The M is used instead of A because
    originally the key was not the Alt key but the Meta key. The Meta key has all
    but disappeared from computer keyboards, and in Emacs the Alt key has taken over
    its function.)


    Many Emacs commands consist of sequences of keys and key combinations. For example,
    C-x C-c (that is Control-x followed by Control-c ) quits Emacs, C-x C-s saves
    the current file. Keep in mind that C-x C-b is not the same as C-x C-b. The former
    means Control-x followed by Control-b, while the latter means Control-x followed
    by ''b''.


