  md: '# Network File System (NFS)


    NFS (or Network File System) was originally written by Sun for their Solaris implementation
    of Unix. While it is significantly easier to get up and running when compared
    to SMB, it is also significantly less secure. The primacy insecurity in NFS is
    that it easy to spoof user and group id''s from one machine to another. NFS is
    an unauthenticated protocol. Future versions of the NFS protocol are devised to
    enhance security, but these are not common at the time of writing.


    NFS configuration is governed by the /etc/exports file. When you load the default
    /etc/exports file into an editor, you''ll see a blank file with a line comment
    on top. We''ll need to add a line to the exports file for each directory that
    we wish to export, with a listing of client workstations that will be allowed
    to access that file. For instance, if we wished to export directory /home/foo
    to workstation Bar, we would simply add the line:


    /home/foo Bar (rw)


    for our /etc/exports. Below, you will find the example from the man page for the
    exports file:


    ```

    # sample /etc/exports file

    /

    /projects master(rw) trusty(rw,no_root_squash proj).*.domain(rw)

    /usr *.domain(ro)@trusted(rw)

    /home/joe pc001(rw,all_squash,anonuid=150,anongid=100)

    /pub ro, insecure,all_squash

    ```


    As you can see, there are various options available, but most should be clear
    from this example.


    NFS works under the assumption that a given user on one machine in a network has
    the same user ID on all machines across the network. When an attempt is made to
    read or write from a NFS client to an NFS server, a UID is passed as part of the
    read/write request. This UID is treated the same as if read/write request originated
    on the local machine. As you can see, if one arbitrarily specify a given UID when
    accessing resources on a remote system, Bad Things (tm) could'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Chapter 5 Network Configuration


    and would happen. As a partial hedge against this, each directory is mounted with
    the root_squash option. This maps the UID for any user claiming to be root to
    a different UID, preventing root access to the files or folders in the exported
    directory. root_squash seems to be enabled by default as a security measure, but
    the authors recommend specifying it anyway in your /etc/exports file.


    You can also export a directory directly from the command line on the server using
    the exportfs command as follows:


    ```

    # exportfs -o rw,no_root_squash Bar:/home/foo

    ```


    This line exports the /home/foo directory to the computer “Bar” and grants Bar
    read/write access. Additionally, the NFS server will invoke root_squash, which
    means any user on Bar with a UID of “0”(root’s UID) will have the same privileges
    as root on the server. The syntax does look strange (usually when a directory
