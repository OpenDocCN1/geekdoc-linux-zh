    # slocate


    The slocate(1) command searches the entire filesystem instead of the actual filesystem.
    The database is set to automatically update every morning, so you have a somewhat
    fresh listing of files on your system. You can manually run updatedb(1) to update
    the slocate database (before running updatedb by hand, you must first `su` to
