  md: '# Chapter 8 The Shell


    its name gets stamped on as the default. If you specified a name for your computer
    during setup, you should see it instead of darkstar.


    As for the login... If this is your first time, you''ll want to log in as root.
    You''ll be prompted for a password; if you set one during the setup process, that''s
    what you''re looking for. If not, just hit enter. That''s it—you''re in!


    # Root: The Superuser


    Okay, who or is root? And what''s it doing with an account on your system?

    Well, in the world of Unix and similar operating systems (like Linux), there are
    users and then there are users. We''ll go into this in more detail later, but
    the important thing to know is that root is the user above all; root is all-powerful
    and all-knowing, and nobody disobey root. It isn''t allowed. root is what we call
    a ‘superuser’, and rightly so. And best of all, root is you.


    Cool, huh?


    If you''re not sure: that''s very cool. The catch is, though, root is inherently
    allowed to break anything it so desires. You might want to skip ahead to Section
    12.1.1 and see adding a user; then login as that user and work from there. The
    traditional wisdom is that it''s best to become the superuser when absolutely
    necessary, so as to minimize the possibility of accidentally breaking something.


    By the way, if you decide to be root while you''re logged in as someone else,
    no problem. Just use the su(1) command. You''ll be asked for root''s password
    and then it will make root until you exit or logout. You can also become any other
    user using su, provided you know that user''s password: su login, for instance,
    would make you.


    Note: root is allowed to su to any user, without requiring their password.'
