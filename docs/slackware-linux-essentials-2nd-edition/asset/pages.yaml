    similarity to the dir command. By itself, ls(1) will list the files in the current
    directory. To see what''s in your root directory, you could use these commands:


    ```

    % cd /

    % ls

    bin cdr dev home lost+found proc sbin tmp var

    boot cdrom etc lib mnt root suncd usr vmlinux

    ```'
