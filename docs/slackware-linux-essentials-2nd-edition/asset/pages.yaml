    /var/X11R6/lib/xinit/xinitrc.fwwm2

    /var/X11R6/lib/xinit/xinitrc.openwin

    /var/X11R6/lib/xinit/xinitrc.twm

    ```


    We get more than we were looking for, and quickly too. With these commands, you
    should be able to find whatever you''re looking for on your Linux system.


    # /etc/rc.d Directory


    The system initialization files are stored in the /etc/rc.d directory. Slackware
    uses the BSD-style layout for its initialization files as opposed to System V
    init scripts, which tend to make configuration changes much more difficult without
    using a program specifically designed for that purpose. In BSD-init scripts, each
    runlevel is given a single rc file. In System V, each runlevel is given its own
    directory, each'
