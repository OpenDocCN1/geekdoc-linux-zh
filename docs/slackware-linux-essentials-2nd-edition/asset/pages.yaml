- img_proc: true
  md: '# Chapter 3 Installation


    absolutely required, resulting in a broken system. On the other hand, you can
    control exactly what goes onto your system. Simply select the packages from each
    series that you want installed. This is not recommended for the new user, as it
    is easy to shoot yourself in the foot.


    The custom and tag path options are also for advanced users. These options allow
    you to install based upon custom tag files that you created in the distribution
    tree. This is useful for installing large numbers of machines fairly quickly.
    For more information on using tag files, see Section 18.4.


    After selecting your installation method, one of few things will happen. If you
    selected full or menu, a menu screen will appear, allowing you to select the packages
    to be installed. If you selected full, packages will immediately start installed
    to the target. If you selected newbie, packages will be installed until an optional
    package is reached.


    Note that it is possible to run out of space while installing. If you selected
    too many packages for the amount of free space on the target device, you will
    have problems. The safest thing to do is to select some software and add more
    later, if you need it. This can easily be done using Slack’s package management
    tools. For this information, see Chapter 18.


    # CONFIGURE


    The configure section allows you to do some basic system configuration, now that
    the packages have been installed. What you see here depends in large part upon
    the packages you have installed. You will, however, always see the following:


    # Kernel selection


    Here you will be asked to select a kernel to install. You can install the kernel
    from the boot disk you used to install, the Slack CD-ROM, or from another floppy
    which you (always thinking ahead) have prepared. Or you can elect to skip, in
    which case the default kernel will be installed and play will continue to the
    dealer’s left.'
