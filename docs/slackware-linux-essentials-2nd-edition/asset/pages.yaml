    names to IP addresses? No one wants to type in 72.9.234.112 into their web browser
    to reach www.slackbook.org. After all, who other than the authors would memorize
    that IP address? We need to setup DNS, but how? That''s where /etc/resolv.conf
    comes into play.


    Chances you already have the proper options in /etc/resolv.conf. If you setup
    your network connection using DHCP, the DHCP server should handle updating this
    file for you. (Technically the DHCP server just tells dhcpcd what to put, and
    it obeys.) If you need to manually update your DNS server list though, you''ll
    need to edit /etc/resolv.conf. Below is an example:


    ```

