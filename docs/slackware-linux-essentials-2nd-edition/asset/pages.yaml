  md: '# Chapter 18 Slack Package Management


    # upgradepkgg old_package_name%new_package_name


    upgradepkgg works by first installing the new package and then removing the old
    package so that old files are no longer around on the system. If the upgraded
    package name has changed, use the percent sign syntax to specify the package (the
    one that is installed) and the new package (the one you are upgrading to).


    If you pass the ROOT environment variable before upgradepkg, that path will be
    used for the root directory. This is useful for setting up new drives for your
    root directory. They will typically be mounted to /mnt or something other than
    /.


    upgradepkg is not flawless. You should always back up your configuration files.
    If they get removed or overwritten, you will want a copy of the originals for
    any needed repair work.


    Just as with installpkg removepkg, you can specify several packages or use wildcards
    for the package name.


    # rpm2tgz/rpm2targz


    The Red Hat Package Manager is a popular packaging system available today. Many
    software distributors are offering their products in RPM format. Since this is
    not our native format, we do not recommend people rely on them. However, some
    things are only available as an RPM (even the source).


    We provide a program that will convert RPM packages to our native .tgz format.
    This will allow you to extract the package (perhaps with explodepkgg) to a temporary
    directory and examine its contents.


    The rpm2tgz program will create a Slackware package with a .tgz extension, rpm2targz
    creates an archive with a .tar.gz extension.'
