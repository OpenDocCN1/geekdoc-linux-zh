    # Screen


    But about situations where there are no virtual terminals? What then? Fortunately,
    slackware includes a beautiful screen manager aptly named screen. screen is a
    terminal emulator that has virtual terminal like capabilities. Executing screen
    flashes a brief introduction, then dumps to a terminal. Unlike the standard virtual
    terminals, screen has its own commands. All screen commands are prefixed with
    a Ctrl+A keystroke. For example, Ctrl+A+C will create a new terminal session.
    Ctrl+A+P switches to the previous terminal.


    screen also supports detaching and re-attaching to screen sessions which are particularly
    useful for remote sessions via ssh and telnet, (more on later). Ctrl+A+D will
    detach from the currently running screen. Executing screen -r will list all running
    screen sessions you may reattach to.


    ```

    % screen -r

    There are several suitable screens on:

    1212.pts-1.redtail (Detached)

    1195.pts-1.redtail (Detached)

    1225.pts-1.redtail (Detached)

    17146.pts-1.sanctuary (Dead ???)

    Remove dead sessions with ''screen -wipe''.

    Type ''screen [-d] -r [pid].tty.host'' to resume one of them.

    ```


    Running screen -r 1212 will reattach to the first session. I mentioned earlier
    how useful this was for remote sessions. If I were to login to a remote slackware
    server via ssh, and my connection was severed by some chance occurrence such as
    a local power failure, whatever I was doing at that moment would instantly persist,
    which can be a horrible thing for your server. Using screen prevents this by detaching
    my session if my connection is dropped. Once my connection is restored, I can
    reattach to my screen session and resume where I left off.


