- img_proc: true
  md: '# Chapter 11 Process Control


    Common daemons are sendmail, BIND, apache, and NFS. They typically listen for
    some request from a client, and return information to it upon request.


    Second, there is now more information about STAT: It shows the status of the process.
    s stands for sleeping; the process is waiting for something to happen. z stands
    for a zombie process. A zombied process is one whose parent has died, leaving
    the child processes behind. This is not a good thing. D stands for a process that
    has entered an uninterruptible sleep. Often, these processes refuse to die when
    passed a SIGKILL. You can read more about SIGKILL in the next section on kill
    . W stands for paging. A dead process is marked with an x. A process marked τ
    is traced, or stopped. R means the process is runnable.


