    which videoFree resolution you would like to use. This is the resolution that
    is also used by the XFree86 frame buffer server. If you do not want the console
    to run in a special video mode, selecting normal will keep the standard 80x25
    text mode in use.


    The next part of the LILO configuration is selecting where you want it installed.
    This is probably the most important step. The list below explains the installation
    places:


    # Root


    This option installs LILO to the beginning of your Linux root partition. This
    is the safest option if you have other operating systems on your computer. It
    ensures that other boosters are not overwritten. The disadvantage is that LILO
    will only load from here if your Linux drive is the first drive on your system.
    This is why many people chose to create a very small /boot partition as the first
    drive on their system. This allows the kernel and LILO to be installed at the
    beginning of the drive where LILO can find them. Previous versions of LILO contained
    an infamous flaw known as the “1024 cylinder limit”. LILO was unable to boot kernels
    on partitions past the 1024th cylinder. Recent editions of LILO have eliminated
    this problem.


    # Floppy


    This method is even safer than the previous one. It creates a boot floppy that
    you can use to boot your Linux system. This keeps the booter off the hard disk
    entirely, so you only boot this floppy when you want to use Slackware. The flaws
    with this method are obvious. Floppies are notoriously fickle, prone to failures.
    Secondly, the boot loader is no longer self-contained within the computer. If
    you lose your floppy disk, you''ll have to make another to boot your system.


    # MBR


    You will want to use this method if Slackware is the only operating system on
    your computer, or if you will be using LILO to choose between multiple operating
    systems on your computer. This is the most preferred method for'
