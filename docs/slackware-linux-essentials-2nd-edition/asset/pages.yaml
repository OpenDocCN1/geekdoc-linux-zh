- img_proc: true
  md: '# Chapter 4 System Configuration


    containing numerous init scripts. This provides an organized structure that is
    easy to maintain.


    There are several categories of initialization files. These are system startup,
    run-levels, network initialization, and System V compatibility. As per tradition,
    we’ll lump everything else into another category.


    # System Startup


    The first program to run under Slack besides the Linux kernel is init(8). This
    program reads the /etc/initab(5) file to see how to run the system. It runs the
    /etc/rc.d/rc.s script to prepare the system before going into your desired runlevel.
    The rc.s file enables your virtual memory, mounts your filesystems, cleans up
    certain log directories, initializes Plug and Play devices, loads kernel modules,
    configures PCMCIA devices, sets up serial ports, and runs System V init scripts
    (if found). Obviously rc.s has a lot on its plate, but here are some scripts in
    /etc/rc.d that rc.s will call on to complete its work:


    ```

    rc.S

    ```


    This is the actual system initialization script.


    ```

    rc.modules

    ```


    Loads kernel modules. Things like your network card, PPP support, and other things
    are loaded here. If this script finds rc.netdevice, it will run that as well.


    ```

    rc.pcmcmia

    ```


    Probes for and configures any PCMCIA devices that you might have on your system.
    This is most useful for laptop users, who probably have a PCMCIA modem or network
    card.


    ```

    rc.serial

    ```


    Configures your serial ports by running the appropriate setserial commands.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# Chapter 4 System Configuration


    rc.sysinit


    Looks for System V init scripts for the desired runlevel and runs them. This is
    discussed in more detail below.


    # Runlevel Initialization Scripts


    After system initialization is complete, init moves on runlevel initialization.
    A runlevel describes the state that your machine will be running in. Sound redundant
    Well, the runlevel tells init if you will be accepting multiuser logins or just
    a single user, whether or not you want network services, and if you will be using
    the X Window System or agetty(8) to handle logins. The files below define the
    different runlevels in Slack Linux.


    rc.0


    Halt the system (runlevel 0). By default, this is symlinked to rc.6.


    rc.4


    Multiuser startup (runlevel 4), but in X11 with KDM, GDM, or XDM as the login
    manager.


    rc.6


    Reboot the system (runlevel 6).


    rc.K


    Startup in single user mode (runlevel 1).


    rc.M


    Multiuser mode (runlevels 2 and 3), but with the standard text-based login. This
    is the default runlevel in Slackware.'
