  md: '# Chapter 14 Security


    # iptables -P INPUT DROP

    iptables -P FORWARD DROP


    When everything is denied, you can start allowing things. The first thing to allow
    is any traffic for sessions which are already established:


    # iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT


    So as not to break any applications that communicate using the loopback address,
    it is usually wise to add a rule like this:


    # iptables -A INPUT -s 127.0.0.0/8 -d 127.0.0.0/8 -i lo -j ACCEPT


    This allows any traffic to and from 127.0.0.0/8 (127.0.0.0 - 127.255.255) on the
    loopback (lo) interface. When creating rules, it is a good idea to be specific
    as possible, to make sure that your rules do not inadvertently allow anything
    evil. That said, rules that allow too little mean rules and more typing.


    The next thing to do would be allow access to specific services running on your
    machine. If, for example, you wanted to run a web server on your machine, you
    would use a rule like this:


    # iptables -A INPUT -p tcp --dport 80 -i ppp0 -j ACCEPT


    This will allow access from any machine to port 80 on your machine via the ppp0
    interface. You may want to restrict access to this service so that only certain
    machines can access it. This rule allows access to your web service from 64.57.102.34:


    # iptables -A INPUT -p tcp -s 64.57.102.34 --dport 80 -i ppp0 -j ACCEPT


    Allowing ICMP traffic can be useful for diagnostic purposes. To do this, you would
    use a rule like this:


    # iptables -A INPUT -p icmp -j ACCEPT


    Most people will also want to set up Network Address Translation (NAT) on their
    gateway machine, so that other machines on their network can access the Internet


