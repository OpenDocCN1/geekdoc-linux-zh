  md: '# # Chapter 6

    X Configuration


    Starting with Slack-10.0, the X Window environment in Slack is provided by Xorg.
    X is responsible for providing a graphical user interface. It is independent from
    the operating system, unlike Windows or the MacOS.


    The X Window System is implemented through many programs that run in users. The
    two main components are the server and the window manager. The server provides
    the lowlevel functions for interacting with your video hardware, thus it is system
    specific. The window manager sits on top of the server and provides the user interface.
    The advantage to this is you can have many different graphical interfaces by simply
    changing the window manager you use.


    Configuring X can be a complex task. The reason for this is the vast numbers of
    video cards available for the PC architecture, most of which use different programming
    interfaces. Luckily, most cards support basic video standards known as VESA, and
    if your card is among them you''ll be able to start X using the startx command
    right out of the box.


    If this doesn''t work with your card, or if you''d like to take advantage of the
    highperformance features of your video card such as hardware acceleration or 3-D
    hardwendering, then you''ll need to reconfigure X.


    To configure X, you''ll need to make an /etc/X11/xorg.conf file. This file contains
    lots of details about your video hardware, mouse, and monitor. It''s a very complex
    configuration file, but fortunately there are several programs to help create
    for you. We''ll mention a few of them here.'
  merge: -1
  pgno: 96
- img_proc: true
