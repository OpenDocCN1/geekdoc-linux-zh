  md: '# 13.9 FTP Clients


    FTP stands for the File Transfer Protocol. It allows you to send and receive files
    between two computers. There is the FTP server and the FTP client. We discuss
    the client in this section.


    For the curious, the “client” is you. The “server” is the computer that answers
    your FTP request and lets you login. You will download files from and upload files
    to the server. The client cannot accept FTP connections, it can only connect to
    servers.


    # ftp


    To connect to an FTP server, simply run the ftp(1) command and specify the host:


    +   * ftp <hostname> [port]


    If the host is running an FTP server, it will ask for a username and password.
    You can log in as yourself or as ‘anonymous’. Anonymous FTP sites are very popular
    for software archives. For example, get Slackware Linux via FTP, you must use
    anonymous FTP.


    Once connected, you will be at the ftp> prompt. There are special commands for
    FTP, but they are similar to other standard commands. The following shows some
    of the basic commands and what they do:


    Table 13-1. ftp commands


    | Command | Purpose |

    |---|---|

    | ls | List files |

    | cd <dirname> | Change directory |

    | bin | Set binary transfer mode |

    | ascii | Set ASCII transfer mode |

    | get <filename> | Download a file |

    | put <filename> | Upload a file |'
  merge: -1
