- img_proc: true
  md: '# Chapter 5 Network Configuration


    The Samba project has existed since 1991, when it was originally written to link
    an IBM PC running NetBIOS with a Unix server. These days, SMB is the preferred
    method for sharing file and print services over a network for virtually the entire
    civilized world because Windows supports it.


    Samba''s configuration file is /etc/samba/smb.conf; one of the most well commented
    and documented configuration files you will find anywhere. Sample shares have
    setup for you to view and modify for your needs. If you need tighter control the
    man page for smb.conf is indispensable. Since Samba is documented so well in the
    places I''ve mentioned above, we will not rewrite the documentation here. We will,
    however, quickly cover the basics.


    smb.conf is broken down into multiple sections: one section per, and a global
    section for setting options that are to be used everywhere. Some options are only
    valid in the global section; some are only outside the global section. Remember
    that the global section can be over-ridden by any other section. Refer to the
    man pages for more information.


    You will most likely wish to edit your smb.conf file to reflect the network settings
    for your LAN. I would suggest modifying the items listed below:


    ```

    [global]

    # workgroup = NT-Domain-Name or Workgroup-Name, eg: LINUX2

    workgroup = MYGROUP

    ```


    Change the workgroup name to reflect the workgroup or domain name that you are
    using locally.


    ```

    # server string is the equivalent of the NT Description field

    server string = Samba Server

    ```


    This will be the name of your Slackware computer displayed in the Network Neighborhood
    (or My Network Places) folder.


    # Security mode. Most people will want user level security.

    # security_level.txt for details. NOTE: To get the behaviour of

    # Samba-1.9.18, you''ll need to use "security = share".'
