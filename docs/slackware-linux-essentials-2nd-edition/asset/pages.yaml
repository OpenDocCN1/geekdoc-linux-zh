  md: "# Chapter 3 Installation\n\nNow we create the partitions with the **n** command:\n\
    \n```\nCommand (m for help): **n**\nCommand action\n  e extended\n  p primary\
    \ partition (1-4)\n**p**nPartition number (1-4):**1**\nFirst cylinder (0-1060,\
    \ +size or +sizeM or +sizeK (0-1060, default 1060):**+64M\nLast cylinder or +size\
    \ or +sizeM or +sizeK\n```\n\nYou need to make sure you create partitions. The\
    \ first partition is going to be our swap partition. We tell fdisk to make partition\
    \ number 1 primary partition. We start it at cylinder 0 and for the ending cylinder\
    \ we type +64M. This will give us a 64 megabyte partition for swap (The size of\
    \ the swap partition you need depends on the amount of RAM you have. It is conventional\
    \ that a swap space double the size of your RAM be created.). Then we define primary\
    \ partition number 2 starting at the first available cylinder and going all the\
    \ way to the end of the drive.\n\n```\nCommand (m for help):**n**\nCommand action\n\
    \  e extended\n  p primary partition (1-4)\n**p**nPartition number (1-4):**2**\n\
    First cylinder (124-1060, default 124):**124**\nLast cylinder or +size or +sizeM\
    \ or +sizeK (124-1060, default 1060):**1060\n```\n\nWe are almost done. We need\
    \ to change the type of the first partition to type 82 (Linux swap). Type **t**\
    \ to change the type, select the first partition, and type **82**. Before writing\
    \ your changes to the disk, you should look at the new partition table one last\
    \ time. Use the **p** in `fdisk` to display the partition table. If everything\
    \ looks good, type **w** to write your changes to the disk and quit `fdisk`."
