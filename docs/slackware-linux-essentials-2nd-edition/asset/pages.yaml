    \ way to kick everyone (including yourself) off the system:\n\n```\n# killall\
    \ bash\n```\n\nSometimes a regular kill doesn't get the job done. Certain processes\
    \ will not die with a kill. You'll need to use a more potent form. If pesky PID\
    \ 4747 wasn't responding to your kill request, you could do the following:\n\n\
    ```\n% kill -9 4747\n```\n\nThat will almost certainly cause 4747 to die. You\
    \ can do the same thing with killall. What is this is sending a different signal\
