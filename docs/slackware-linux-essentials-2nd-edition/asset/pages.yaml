    All of the clients discussed below are text-based. A lot of Windows users may
    be against this, but you will find that a text based client is very convenient,
    especially when checking mail remotely. Fear not, there are many graphical e-mail
    clients such as KDE''s Kmail. If you wish to use one of those check its help menu.


