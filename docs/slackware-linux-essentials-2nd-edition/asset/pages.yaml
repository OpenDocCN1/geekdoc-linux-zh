  md: '# Chapter 1 An Introduction to Slackware


    based on aing system, as well as the concept of package management, which allows
    users to easily add, remove, or upgrade software packages on their systems.


    There are many reasons why Slackware is Linux’s oldest distribution. It does not
    try to emulate Windows, it tries to be Unix-like as possible. It does not try
    to cover up processes with fancy, point-and-click GUIs (Graphical User Interfaces).
    Instead, it puts users in control by letting them see exactly what’s going on.
    Its development is not rushed to meet deadlines-each version comes out when it
    is ready.


    Slackware is for people who enjoy learning and tweaking their system to do exactly
    what they want. Slackware’s stability and simplicity are why people will continue
    to use it for years to come. Slackware currently enjoys a reputation as a solid
    server and a no-nonsense workstation. You can find Slackware desktops running
    nearly any window manager or desktop environment, or none at all. Slackware servers
    power businesses, acting in every capacity that a server can be used in. Slackware
    users are among the most satisfied Linux users. Of course, we''d say that :^)


    # 1.3 Open Source and Free Software


    Within the Linux community, there are two major ideological movements at work.
    The Free Software movement (which we''ll get into in a moment) is working toward
    the goal of making all software free of intellectual property restrictions. Followers
    of this movement believe these restrictions hamper technical improvement and work
    against the good of the community. The Open Source movement is working toward
    most of the same goals, but takes a more pragmatic approach to them. Followers
    of this movement prefer to base their arguments on the economic and technical
    merits of making source code freely available, rather than the moral and ethical
    principles that drive the Free Software Movement.


    At the other end of the spectrum are groups that wish to maintain tighter controls
    over their software.


    The Free Software movement is headed by the Free Software Foundation, a fund-raising
    organization for the GNU project. Free software is more of an ideology.'
