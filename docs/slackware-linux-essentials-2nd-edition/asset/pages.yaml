- img_proc: true
  md: '# Chapter 12

    Essential System

    Administration


    Whoa whoa whoa whoa.... I know what you’re thinking. ‘I’m not a system administrator!
    I don’t even want to be a system administrator!''


    Fact is, you are the administrator of any computers for which you have the root
    password. This might be your desktop box with one or two users, or it might be
    a big server with several hundred. Regardless, you''ll need to know how to manage
    users, and how to shut down the system safely. These tasks seem simple, but they
    have some quirks to keep in mind.


    # 12.1 Users and Groups


    As mentioned in Chapter 8, you shouldn’t normally use your system logged in as
    root. Instead, you should create a normal user account for everyday use, and use
    the root account only for system administration tasks. To create a user, you can
    either use the tools supplied by Slack, or you can edit the password files by
    hand.


    # Supplied Scripts


    The easiest way to manage users and groups is with the supplied scripts and programs.
    Slack includes the programs adduser, userdel(8), chfn(1), chsh(1), and passwd(1)
    for dealing with users. The commands groupadd(8), groupdel(8),'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# Chapter 12 Essential System Administration


    and groupmod(8) are dealing with groups. With the exception of chfn, chsh, and
    passwd, these programs are generally only run as root, and are therefore located
    in /usr/bin. chfn, chsh, and passwd can be run by anyone, and are located in /usr/bin.


    Users can be added with the adduser program. We''ll start out by going through
    the whole procedure, showing all the questions that are asked and a brief description
    of what everything means. The default answer is in the brackets, and can be chosen
    for almost all the questions, unless you really want to change something.


    ```

    # adduser

    Login name for new user []: jellyd

    ```


    This is the name that the user will use to login. Traditionally, login names are
    eight characters or fewer, and all lowercase characters. (You may use more than
    eight characters, or use digits, but avoiding doing so unless you have a fairly
    important reason.)


    You can also provide the login name as an argument on the command line:


    ```

    # adduser jellyd

    ```


    In either case, after providing the login name, adduser will prompt for the user
    ID:


    ```

    User ID (''UID'') [ defaults to next available ]

    ```


    The user ID (UID) is how ownerships are really determined in Linux. Each user
    has a unique number, starting at 1000 in Slackware. You can pick a UID for the
    new user, or you can just let adduser assign the user the next free.


    ```

    Initial group [users]:

    ```


    All users are placed into the users group by default. You might want to place
    the new user into a different group, but it is not recommended unless you know
    what you''re doing.


    Additional groups (comma separated) []:'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Chapter 12 Essential System Administration


    This question allows you to place the new user into additional groups. It is possible
    for a user to be in several groups at the same time. This is useful if you have
    established groups for things like modifying web sites, playing games, and so
    on. For example, some sites define group wheel as the only group that you can
    use the su command. Or, a default Slack installation uses the sys group for users
    authorized to play sounds through the internal sound card.


    ```

    Home directory [/home/jellyd]

    ```


    Home directories default to being placed under /home. If it’s possible that you
    have moved the home directories to a different location (or to many locations).
