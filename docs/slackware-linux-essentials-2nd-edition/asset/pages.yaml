- img_proc: true
  md: 'That’s a whole lot of information. Basically, it adds information including
    what user started the process, how much of the system resources the process is
    using (%CPU, %MEM, VSZ, and RSS columns), and on what date the process was started.
    Obviously, that’s a lot of information that could come handy for a system administrator.
    It also brings up another point: the information now goes off the edge of the
    screen that you cannot see. The -w option will force ps to wrap long lines.



    It’s not terribly pretty, but it does the job. You now get the complete listings
    for each process. There’s even more information that you can display about each
    process. Check out the very in-depth man page for ps. However, the options shown
    above are the most popular ones and will be the ones you need to use the most
    often.


    # 11.4 kill



    On occasion, programs misbehave and you’ll need to put them back in line. The
    program for this kind of administration is called kill(1), and it can be used
    for manipulating processes in several ways. The most obvious use of kill is to
    kill off a process. You’ll need to do this if a process has run away and is using
    up lots of system resources, or if you’re just sick of it.



    in order to kill off a process, you’ll need to know its PID or its name. To get
    the PID, use the ps command as discussed in the last section. For example, to
    kill off process 4747, you’d issue the following:


    ```

    $ kill 4747

    ```



    There’s another variety of the kill command called killall(1). This program does
    exactly what it says: it kills all the running processes that have a certain name.
    If you wanted to kill off all the running vim processes, you could type the following'
