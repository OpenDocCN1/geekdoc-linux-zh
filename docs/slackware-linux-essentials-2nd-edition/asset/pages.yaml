  md: '# Chapter 15 Archive Files


    All the above statements are equivalent. In each case, the archive is unpacked
    inside your home directory and the original uncompressed archive is left in place.


    So what good is being able to uncompress these archives if you can''t make them?
    Well, tar handles that too. In most cases it''s as easy as removing the “-x” option
    and replacing it with the “-c” option.


    ```

    $ tar -cvzf filename.tar.gz

    ```


    In this command, the -c option tells tar to create an archive, while the -z option
    runs the resulting archive through gzip to compress it. filename.tar.gz is the
    file you want to create.


    Specifying the “-f” option isn''t always necessary, but is typically good practice
    anyway. Without it, tar writes to standard output, which is usually desired for
    piping tar’s output to another program, like so.


    ```

    $ tar -cv filename.tar | gpg --encrypt

    ```


    That command creates an non-compressed archive of the current directory, pipes
    the tarball through gpg which encrypts and compresses the tarball, making realistically
    impossible to read by anyone other than the person knowing the secret key.


    # 15.4 zip


    Finally, there are two utilities that can be used on zip files. These are very
    common in the Windows world, so Linux has programs to deal with them. The compression
    program is called zip(1), and the decompression program is called unzip(1).


    ```

    $ zip foo *

    ```


    This will create the file foo.zip, which will contain all the files in the current
    directory. zip will add the .zip extension automatically, so there’s no need to
    include that in the file name. You can also recurse through the current directory,
    zipping up any directories that are also laying around:


    193'
