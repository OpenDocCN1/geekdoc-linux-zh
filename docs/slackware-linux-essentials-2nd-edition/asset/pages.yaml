- img_proc: true
  md: '# Chapter 3 Installation


    This will display all sorts of information about your current partitions. Most
    people pick a free drive to install to and then remove any existing partitions
    on it to create room for the Linux partitions.


    > **Warning: IT IS VERY IMPORTANT THAT YOU BACK UP ANY INFORMATION YOU WANT TO
    SAVE BEFORE DESTROYING THE PARTITION IT LIVES ON.**


    There is no easy way to recover from deleting a partition, so always back up before
    playing with them.


    Looking at the table of partition information you should see a partition number,
    the size of the partition, and its type. There''s more information, but don''t
    worry about for now. We are going to delete all of the partitions on this drive
    to create the Linux ones. We run the `d` command to delete those:


    ```

    Command (m for help): **d**

    Partition number (1-4): **1**

    ```


    This process should be continued for each of the partitions. After deleting the
    partitions we are ready to create the Linux ones. We have decided to create one
    partition for our root filesystem and for swap. It is worth noting that Unix partitioning
    schemes are the subject of many flame wars, and most users will tell you the best
    way to do it. At a minimum, you should create one partition for / and one for
    swap. Over time, you''ll develop a method that works well for you.


    I use two basic schemes. The first is for a desktop. I make 4 partitions, /,home,
    /usr/local, and swap. This lets me re-install or upgrade the installation under
    without wiping my data files under /home or my custom compiled applications under
    /usr/local. For servers, I often replace the /usr/local partition with a /var
    partition. Many servers store information on that partition and having it kept
    separate from / has certain performance benefits. For now, we''re sticking with
    just two partitions: / and swap.


    23'
  merge: -1
