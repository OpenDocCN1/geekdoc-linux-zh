    To remove a single file, specify its name when you run rm:


    ```

    % rm file1

    ```


    If the file has write permissions removed, you may get a permission denied error
    message. To force removal of the file no matter what, pass the -f option, like
    this:


    ```

    % rm -f file1

    ```


    To remove an entire directory, you use the -r and -f options together. This is
    a good example of how to delete the entire contents of your hard drive. You really
    don’t want to do this. But here’s the command anyway:'
  merge: -1
  pgno: 150
- img_proc: true
  md: '```

    # rm -rf /

    ```


    Be very careful with rm; you can shoot yourself in the foot. There are several
    command line options, which are discussed in detail in the online manual page.


    # rmdir


    rmdir(1) removes directories from the filesystem. The directory must be empty
    before it can be removed. The syntax is simply:


    ```

    # rmdir <directory>

    ```


    This example will remove the hejaz subdirectory in the current working directory:


    ```

    # rmdir hejaz

    ```


    If that directory does not exist, rmdir will tell you. You can also specify a
    full path to a directory to remove, as this example shows:


    ```

    # rmdir /tmp/hejaz

    ```


    That example will try to remove the hejaz directory inside the /tmp directory.


    You can also remove a directory and all of its parent directories by passing the
    -p option.


    ```

    # rmdir -p /tmp/hejaz

    ```


    This will first try to remove the hejaz directory inside /tmp. If that is successful,
    will try to remove /tmp. rmdir will continue this until an error is encountered
    or the entire tree specified is removed.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# 10.7 Aliasing files with ln


    ln(1) is used to create links between files. These links can be either hard links
    or soft (symbolic) links. The differences between the two kinds of links were
    discussed in Section 9.3. If you wanted to make a symbolic link to the directory
    /var/media/mp3 and place the link in your home directory, you would do this:


    ```

    # ln -s /var/media/mp3 ~mp3

    ```


    The -s option tells ln to make a symbolic link. The next option is the target
    of the link, and the final option is what to call the link. In this case, it will
    just make a file mp3 in your home directory that points to /var/media/mp3. You
    can call the link itself whatever you want by just changing the last option.


    Making a hard link is just as simple. All you have to do is leave off the -s option.
    Hard links may not normally refer to directories or span file systems, however.
    To create a hard link /usr/bin/mutt to /usr/bin/mutt, simply type the following:


    ```

    # ln /usr/bin/mutt /usr/bin/email

    ```'
  merge: -1
  pgno: 152
