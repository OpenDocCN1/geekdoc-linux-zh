  md: '# Chapter 8 The Shell


    # Wildcard Matching


    Nearly every shell recognizes some characters as being substitutes or abbreviations
    that mean anything goes here. Such characters are aptly named wildcards; the most
    common are * and ?. By convention, ? usually matches any single character. For
    instance, suppose you''re in a directory with three files: ex1.txt, ex2.txt, and
    ex3.txt. You want to copy all of them (using the cp command we learned in Section
    10.5.1) to another directory, say /tmp. Typing cp ex1.txt ex2.txt ex3.txt /tmp
    is entirely too much work. It''s much easier to type cp ex?.txt /tmp; the ? will
    match each of the characters “1”, “2”, and “3”, and in turn will be substituted.


    What''s you say? That''s still too much work? You''re right. It''s appalling;
    we have labor laws to protect us from that sort of thing. Fortunately, we also
    have *. As was already mentioned, * matches “any number of characters”, including
    0. So if those three files were the only ones in the directory, we could simply
    say cp */ and get them all in one fell swoop. Suppose, though there is also a
    file called ex.txt and one called hejaz.txt. We want to copy ex.txt but not hejaz.txt;
    cp * /tmp will do that for us.


    cp ex?.txt /tmp, would, of course, only get our original three files; there''s
    no character in ex.txt to match ?, so it would be left out.


    Another wildcard is the bracket pair [ ]. Any characters inside the brackets will
    be substituted in place of the [ ] to find matches. Confounding? It''s not too
    bad. Suppose instance, we have a directory containing the following 8 files: a1,
    a2, a3, a4, aA, aB, aC, and aD. We want to find the files ending in numbers; [
    ] will do this for us.


    ```

    ls a[1-4]

    a1 a2 a3 a4

    ```


    But what we really want is just a1, a2, and a4? In the previous example we used
    to mean all values between 1 and 4. We can also separate individual entries with
    commas.


    104'
