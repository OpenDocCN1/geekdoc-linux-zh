- img_proc: true
  md: '# Chapter 3 Installation


    If you’re running a Microsoft OS, you’ll need to use the RAWRITE.EXE program,
    which is included in the distribution tree in the same directories as the floppy
    images. Again assuming that bare.i is your disk image file and your floppy drive
    is A:, open a DOS prompt and type the following:


    ```

    C:\write a: bare.i

    ```


    # 3.3 Partitioning


    After booting from your preferred media, you will need to partition your hard
    disk. The disk partition is where the Linux filesystem will be created and where
    Slackwill be installed. At the very minimum we recommend creating two partitions;
    one for your root filesystem (/) and one for swap space.


    After the root finishes loading, it will present you with a login prompt. Log
    in as root (there is no password). At the shell prompt, run either cfdisk(8) or
    fdisk(8). The cfdisk program provides a more user-friendly interface than the
    regular fdisk program, but does lack some features. We will briefly explain the
    fdisk program below.


    Begin by running fdisk for your hard disk. In Linux, the hard disks do not have
    drive letters, but are represented by a file. The first IDE hard disk (primary
    master) is /dev/hda, the primary slave is /dev/hdb, and so on. SCSI disks follow
    the same type system, but are in the form of /dev/sdx. You will need to start
    fdisk and pass it your hard disk:


    ```

    # fdisk /dev/hda

    ```


    Like good Unix Programs, fdisk gives you a prompt (thought you were getting a
    menu, right?). The first thing you should do is examine your current partitions.
    Do that by typing p at the fdisk prompt:


    ```

    Command (m for help): p

    ```'
  merge: -1
