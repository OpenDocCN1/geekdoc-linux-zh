    # 5.6 Network File Systems


    At this point, you should have a working TCP/IP connection to your network. You
    should be able to ping other computers on your internal network and, if you have
    have configured an appropriate gateway, you should also be able to ping computers
    on the Internet itself. As we know, the whole point in bringing a computer up
    on a network is to access information. While some people might bring a computer
    up on a network just for the fun of it, most people wish to be able to share files
    and printers. They wish to be able to access documents on the Internet or play
    an online game. Having TCP/IP installed and functional on your new Slack system
    is means to that end, but with just TCP/IP installed, functionality will be very
    rudimentary. To share files, we will have to transfer them back and forth using
    either FTP or SCP. We cannot browse files on new Slack computer from the Network
    Neighborhood or My Net Places icons on Windows computers. We''d like to be able
    to access files on other Unix machines seamlessly.


    Ideally, we''d like to be able to use a network file system to allow us transparent
    access to our files on other computers. The programs that we use to interact with
    information stored on our computers really do not to know on what computer a given
    file is stored; they just need to know that it exists and how to get to it. It
    is then the responsibility of the operating system to manage access to that file
    through the available file systems and network file systems. The two most commonly
    used network file systems are SMB (as implemented by Samba) and NFS.


    # SMB/Samba/CIFS


    SMB (for Server Message Block) is a descendant of the older NetBIOS protocol that
    was initially used by IBM in their LAN Manager product. Microsoft has always been
    fairly interested in NetBIOS and it''s successors (NetBEUI, SMB and CIFS).'
