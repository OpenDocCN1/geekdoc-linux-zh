  md: '# Chapter 10 Handling Files and Directories


    # # 10.4 Creation: touch and mkdir


    # touch


    touch(1) is used to change the timestamp on a file. You can change access timestamps
    and modification timestamps with this command. If the file specified does not
    exist, touch will create a zero length file with the name specified. To mark a
    file with the current system time, you would issue this command:


