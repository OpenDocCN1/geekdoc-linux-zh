    # 6.4 xwmconfig


    For years, Unix was used almost exclusively as the operating system for servers,
    with the exception of Apple''s programs exclusively for high-powered professional
    workstations. Only the technically inclined were likely to use a Unix-like operating
    system, and the user interface reflected this fact. GUIs tended to be fairly bare-bones,
    designed to run a few necessarily graphical applications like CAD programs and
    image renderers. Most file and system management was commanded at the command
    line. Various vendors (Sun Microsystems, Silicon Graphics, etc) were selling workstations
    with an attempt to provide a cohesive ''look and feel'', but the wide variety
    of GUI toolkits in use by developers led inevitably to the dissolution of the
    desktop''s uniformity. A scrollbar might not look the same in different applications.
    Menus might appear in different places. Programs would have different buttons
    and checkboxes. Colors ranged widely, and were generally hard-coded in each toolkit.
    As the users were primarily technical professionals, none of them mattered.


    With the advent of free Unix operating systems and the growing number and variety
    of graphical applications, X has recently gained a wide desktop user base. Most
    users, of course, are accustomed to the consistent look and feel provided by Microsoft''s
    Windows or Apple''s macOS; the lack of such consistency in X-based applications
    became a barrier to their wider acceptance. In response, two open source projects
    have been undertaken: The K Desktop Environment, or KDE, and the GNU Network Object
    Model Environment, known as GNOME. Each has a variety of applications, from taskbars
    to file managers and office suites, written with the same GUI toolkit and tightly
    integrated to provide a uniform, consistent desktop.


    The differences in KDE and GNOME are generally fairly subtle. They each look different
    from the other, because each uses a different GUI toolkit. KDE is based on the
    Qt library from Troll AS, while GNOME uses GTK, a toolkit originally'
  merge: -1
