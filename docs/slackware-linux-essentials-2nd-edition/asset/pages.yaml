    loaded into its own buffer. Furthermore, Emacs has several special buffers, which
    do not contain a file but are used for other things. Such special buffers usually
    have a name that starts and ends with an asterisk. For example, the buffer that
    Emacs shows when it is first started, is the so-called *scratch* buffer. The *scratch*
    buffer, you can type text in the normal way, but that text is typed not saved
