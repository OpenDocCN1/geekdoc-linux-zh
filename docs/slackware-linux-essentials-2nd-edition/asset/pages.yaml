  md: '# 13.10 Talking to Other People


    # wall


    wall(1) is a quick way to write a message to the users on a system. The basic
    syntax is:


    ```

    % wall [file]

    ```


    This will result in the contents of [file] being displayed on the terminals of
    all currently logged in users. If you don''t specify a file, wall will read from
    standard input, so you can just type your message, and end with Ctrl+d.


    wall doesn’t have many features, and apart from letting your users know you’re
    about to do some serious maintenance to the system, or even reboot it, so they
    have time to save their work and log off :)


    # talk


    talk(1) allows two users to chat. It splits the screen in half, horizontally.
    To request a chat with another user, use this command:


    ```

    % talk <person> [ttyname]

    ```'
