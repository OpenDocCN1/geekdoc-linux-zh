  md: '# Chapter 10 Handling Files and Directories


    That is the pipe character (shift backslash). The pipe is short for saying the
    output of `ls` and feed it into `more`. You can pipe just about anything through
    the `more` command, not just `ls`. Piping is also covered in Section 8.2.3.


    # less


    The `more` command is quite handy, but often you will find that you have advanced
    the screen you wanted. more does not provide a way to go back. The `less(1)` command
    provides this functionality. It is used in the same way as the `more` command,
    so, `less` is more than `more`. Joost Kremers puts it in this way:


    > `less` is more, but more `more` than `more` is, so `more` is less `less`, use
    more `less` if you want less `more`.


    # most


    Where `more` and `less` leave off, `most(1)` picks back up. If `less` is more
    than `more`, `most` is more than `less`. Whereas the other pagers can only display
    one file at a time, `most` is capable of viewing any number of files, as long
    as each file’s window is at least 2 lines long. `most` has a lot of options, check
    the man page for full details.


