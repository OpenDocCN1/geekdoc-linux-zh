    partition. The unwritten rule is to use twice the amount of RAM you have in disk
    space. A 64MB system would have 128MB of swap, and so on. Adequate space is the
    discussion of many flames on IRC and Usenet. There’s no truly ‘tight’ way to do
    it, but sticking with the rule above should be sufficient.


