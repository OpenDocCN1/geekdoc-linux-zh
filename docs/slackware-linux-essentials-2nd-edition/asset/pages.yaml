  md: 'find things. I mean, you could go looking through directories, but there are
    quicker ways. There are four main file search commands available in Slackware.


    # which


    The first is the which(1) command. which is usually used to locate a program quickly.
    It just searches your PATH and returns the first instance it finds and the directory
    path to it. Take this example:


    ```

    ```bash

    /bin/bash

    ```

    ```


    From that you see that bash is in the /bin directory. This is a very limited command
    for searching, since it only searches your PATH.


    # whereis


    The whereis(1) command works similar to which, but can also search for man pages
    and source files. A whereis search for bash should return:


    +   - whereis bash

    bash: /bin/bash /usr/bin/bash /usr/man/man1/bash.1.gz


    This command not only told where the actual program is located, but also the online
    documentation is stored. Still, this command is limited. What if you wanted to
    search for a specific configuration file? You can''t use which or whereis for
    that.


    # find


    The find(1) command allows the user to search the filesystem with a rich collection
    of search predicates. Users may specify a search with filename wildcards, ranges
    of modification or creation times, or other advanced properties. For example,
    to search for the default xinitrc file on the system, the following command could
    be used.'
