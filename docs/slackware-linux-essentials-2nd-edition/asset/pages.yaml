- img_proc: true
  md: '# Chapter 6 X Configuration


    xdm is the graphical login manager shipped with the X.org system. It''s ubiquitous,
    but not as fully features as alternatives. kdm is the graphical login manager
    shipped with KDE, The K Desktop Environment. Finally, gdm is the login manager
    shipped with GNOME. Any of the choices will allow you to log in as any user, and
    choose what desktop you wish to use.


    Unfortunately, Slack doesn''t include a nice program like xwmconfig for choosing
    login manager to use, so if all three are installed you may have to do some editing
    to choose your preference. But first, we''ll discuss how to boot into a graphical
    environment.


    In order to start X at boot, you need to boot into run-level 4. Levels are just
    a way of telling init(8) to do something different when it starts the OS. We do
    this by editing the config file for init,/etc/inittab.


    ```

    # These are the default runlevels in Slack:

    # 0 = halt

    # 1 = single user mode

    # 2 = unused (but configured the same as runlevel 3)

    # 3 = multiuser mode (default Slack runlevel)

    # 4 = X11 with KDM/GDM/XDM (session managers)

    # 5 = unused (but configured the same as runlevel 3)

    # 6 = reboot

    ```


    ```

    # Default runlevel. (Do not set to 0 or 6)

    id:3:initdefault:

    ```


    In order to make Slack boot to a graphical environment, we just change the 3 to
    a 4.


    ```

    # Default runlevel. (Do not set to 0 or 6)

    id:4:initdefault:

    ```


    Now Slack will boot into runlevel 4 and execute /etc/rc.d/rc.4. This file starts
    up X and calls whatever login manager you''ve chosen. So, how do we choose login
    managers? There are a few ways to do this, and I''ll explain them after we look
    at rc.4.'
  merge: -1
