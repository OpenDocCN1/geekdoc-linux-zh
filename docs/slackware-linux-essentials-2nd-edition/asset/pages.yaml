  md: '# Chapter 16


    # Vi


    vi(1) is the standard Unix text editing program, and while mastering it is not
    as essential as it once was, is still a very rewarding goal. There are several
    versions (clones) of vi available, including vi, elvis, vile, and vim. One of
    these is available on just about any version of Unix, as well as on Linux. All
    of these versions include the same basic feature set and commands, so learning
    one clone should make it easy to learn another. With the variety of text editors
    included Linux distributions and Unix variants these days, many people no longer
    use vi. Still, it remains the most universal text editor across Unix and Unix
    work-alikes. Mastering vi means you should never be sitting at a Unix machine
    and not be comfortable with at least one powerful text editor.


    vi includes a number of powerful features including syntax highlighting, code-formatting,
    a powerful search-and-replace mechanism, macros, and more. These features make
    it especially attractive to programmers, web developers, and the like. System
    administrators will appreciate the automation and integration with the shell that
    is possible.


