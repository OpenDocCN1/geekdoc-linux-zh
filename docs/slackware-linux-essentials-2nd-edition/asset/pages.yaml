  md: '# Installation Methods


    # Floppy


    While it was once possible to install all of Slack Linux from floppy disks, the
    increasing size of software packages (indeed, of some individual programs) forced
    the abandonment of the floppy install. As late as Slack version 7.1 a partial
    install was possible using floppy disks. The A and N series could be nearly entirely
    installed, providing a base system from which to install the rest of the distribution.
    If you are considering a floppy install (typically on older hardware), it is typically
    recommended to find a base CD, or use an older release. Slack 4.0 is still very
    popular for this reason, as is 7.0.


    Please note that floppy disks are still required for a CD-ROM install if you do
    not have a bootable CD, as well as for an NFS install.


    # CD-ROM


    If you have the bootable CD, available in the official disc set published by Slack
    Linux, Inc. (see the section called Getting Slack), a CD-based installation will
    be a bit simpler for you. If not, you will need to boot from floppies. Also, if
    you have special hardware that makes usage of the kernel on the bootable CD problematic,
    you may need to use specialized floppies.


    As of Slack version 8.1, a new method is used for creating the bootable CDs, which
    does not work as well with certain flaky BIOS chips (it is worth noting that most
    Linux CDs suffer from this these days). If that is the case, we recommend booting
    from a floppy disk.


    Section 3.2.3 and Section 3.2.5 provide information on choosing and creating floppies
    from which to boot, should this be necessary.'
  merge: -1
