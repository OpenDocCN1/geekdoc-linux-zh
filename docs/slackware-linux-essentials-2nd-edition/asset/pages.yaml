  md: '# 3.2 System Requirements


    An easy Slackware installation requires, at minimum, the following:


    Table 3-2. System Requirements


    | Hardware | Requirement |

    |---|---|

    | Processor | 586 |

    | RAM | 32 MB |

    | Disk Space | 1GB |

    | Media Drive | 4x CD-ROM |


    If you have the bootable CD, you will probably not need a floppy drive. Of course,
    it stands to reason that if you don''t possess a CD-ROM drive, but if you do a
    full install, you will need floppy drive to a network install. A network card
    is required for an NFS install. See the section called NFS for more information.


    The disk space requirement is somewhat tricky. The 1GB recommendation is usually
    safe for a minimal install, but if you do a full install, you will need around
    two gigabytes of available hard disk space plus additional space for personal
    files.. Most users don''t do a full install. In fact, many Slackware on as little
    as 100MB of hard disk space.


    Slackware can be installed to systems with less RAM, smaller hard drives, and
    weaker CPUs, but doing so will require a little elbow grease. If you''re up for
    a little work, take a look at the LOWMEM.TXT file in the distribution tree for
    a few helpful hints.


    # The Software Series


    For reasons of simplicity, Slackware has historically been divided into software
    series. Once called ''disk sets'' because they were designed for floppy-based
    installation, the software series are now used primarily to categorize the packages
    included in Slackware. Today, floppy installation is no longer possible.'
