    # 第17 章 Emacs


    在文本模式下，Tab 键仅仅是跳转到下一个制表位，但在许多编程语言模式下，**Tab** 键会根据当前所在的块深度对当前行进行缩进。


    上述模式被称为主模式（major modes）。每个缓冲区（buffer）恰好有一个主模式。此外，一个缓冲区可以拥有一个或多个辅助模式（minor modes）。辅助模式提供了对某些编辑任务可能有用的额外功能。例如，如果你按下
    INSERT 键，就会调用覆盖写模式（overwrite-mode），其行为符合你的预期。还有一个自动填充模式（auto-fill-mode），它与文本模式（text-mode）或
    LaTeX 模式（latex-mode）结合使用非常方便：它可以让你输入的每行在达到特定字符数后自动换行。如果没有 auto-fill-mode，你必须使用
    **M-q** 来填充一个段落。（你也可以用它在编辑完段落中的文本后重新格式化段落，如果它变得不再整齐的话的话。）


    ## 打开文件


    要在 Emacs 中打开一个文件，


    ```

    C-x C-f

    ```


    Emacs 会询问你文件名，并为你填充一些默认路径（通常是 ~/）。在你输入文件名后（可以使用 **Tab** 补全并按 **ENTER**），Emacs
    将在一个新缓冲区中打开该文件并在屏幕上显示该缓冲区。


    > **注意：** Emacs 会自动创建一个新缓冲区，不会将文件加载到当前缓冲区。


    要在 emacs 中创建一个新文件，你不能直接开始输入。你必须先为它创建一个缓冲区，并想好文件名。你通过输入 **C-x C-f** 并输入文件名来实现，就像打开一个已存在的文件一样。Emacs
    会注意到你输入的文件不存在，并创建一个新缓冲区并在极型缓冲区（minibuffer）中报告“New file ...)”。


    当你输入 C-x C-f 然后输入目录名而不是文件名时，Emacs 会创建一个缓冲区，你可以在其中找到该目录下所有文件的列表。你可以将光标移动到要查找的文件上并输入空格，Emacs
    就会打开它。（实际上，你还可以在这里执行更多操作，如删除、重命名和移动文件等。此时 Emacs 处于 dired-mode，这本质上是一个简单的管理器。）


    当你输入了 C-x C-f 但突然改变主意时，可以输入 C-g 取消操作。C-g 几乎适用于任何你想取消已开始但不想完成的操作或命令的地方。


    ## 17.4 基础编辑


    当你打开一个文件后，你可以用光标在其中移动。光标键和 PgUp、PgDn 的行为符合你的预期。Home 和 End 键跳转到行首和行尾。（在较旧版本中，它们实际上会跳转到缓冲区的开头和结尾。）然而，还有
    Control 和 Meta (Alt) 键组合可以移动光标。因为执行这些操作不需要将手移动到键盘的其他部分，一旦习惯，速度会快得多。最重要的并行命令列在表
    17-1 中。


    注意，许多 Meta 命令与 Control 命令是对应的，区别在于它们操作的单位更大：C-f 向前移动一个字符，M-f 向前移动整个单词等。


    另外注意，M-< 和 M-> 分别需要你输入 Shift+Alt+逗号和 Shift+Alt+点，因为 < 和 > 分别在 Shift+逗号和 Shift+点上。（除非你的键盘布局与标准美式布局不同。）


    注意 C-k 会删除光标到行尾的所有文本（通常称为“杀死”），但不会删除行本身（即不删除最后的换行符）。只有当光标后没有文本时，它才会删除该行。换句话说，为了删除整行，你必须将光标放在行首，然后按两次
    C-k：第一次删除，第二次再次删除。


    ### 表 17-1. 基础 Emacs 编辑命令


    | 命令 | 结果 |

    |---|---|

    | C-b | 向后移动一个字符 |

    | C-f | 向前移动一个字符 |

    | C-n | 向移动一行 |

    | C-p | 向上移动一行 |

    | C-a | 到行首 |

    | C-e | 到行尾 |

    | M-b | 向后移动一个单词 |

    | M-f | 向前移动一个单词 |

    | M-} | 向前移动一个段落 |

    | M-{ | 向后移动一个段落 |

    | M-a | 向后移动一个句子 |

    | M-e |向前移动一个句子 |

    | C-d | 删除光标下的字符 |

    | M-d | 删除到当前单词末尾 |

    | C-v | 向移动一屏（即 PgDn） |

    | M-v | 向上移动一屏（即 PgUp） |

    | M-> | 到缓冲区开头 |

    | C-_ | 撤销上一次更改（可以重复）；注意你实际上需要输入 Shift+Control+连字符。 |

    | C-k | 删除到行尾 |

    | C-s | 向前搜索 |

    | C-r | 向后搜索 |


    ## 17.5 保存文件


    为了保存文件，你输入


    ```

    C-x C-s

    ```


    Emacs 会询问你文件名，并为你填充一些默认路径（通常是 ~/）。在你输入文件名后（可以使用 **Tab** 补全并按 **ENTER**），Emacs
    将在一个新缓冲区中打开文件并在屏幕上显示该缓冲区。

