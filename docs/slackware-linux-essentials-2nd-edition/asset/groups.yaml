    # Chapter 12 Essential System Administration


    Runlevel 0 is halt mode. Telling `init` to enter runlevel 0 will cause all processes
    to be killed off, the filesystems unmounted, and the machine to be halted. This
    is a perfectly acceptable way to bring down the system. On many laptops and modern
    desktop computers, this will also cause the machine to be turned off.


    ## telinit 6


    Runlevel 6 is reboot mode. All processes will be killed off, the filesystems will
    be unmounted, and the machine will be rebooted. This is a perfectly acceptable
    method of rebooting the system.


    For the curious, when switching to runlevel 0 or 6, by using `shutdown`, `halt`,
    or `reboot`, the script `/etc/rc.d/rc.6` is run. (The script `/etc/rc.d/rc.0`
    is another symbolic link, to `/etc/rc.d/rc.6`). You can customize this file to
    your tastes—but be sure to test your changes carefully!


    There is one last method of rebooting the system. All the other methods require
    you to be logged in as `root`. However, it is possible to reboot the machine even
    if you aren''t root, provided that you have physical access to the keyboard. Using
    **Control+Alt+Delete** (the “three-fingered salute”) will cause the machine to
    immediately reboot. (Behind the scenes, the `shutdown` command is called for when
    you use **Control+Alt+Delete**) The salute doesn’t work when using X Windows—you
    may need to use **Control+Alt+F1** (or another function key) to switch to a non-X
    Terminal before using it.


    Finally, the file that ultimately controls every aspect of startup and shutdown
    is `/etc/inittab`(5). In general, you should not need to modify this file, but
    it may give you insight into why some things work the way they do. As always,
    see man pages for further details.


    # Chapter 13

    # Basic Network Commands


    A network consists of several computers connected together. The network can be
    simple as a few computers connected in your home or office, or as complicated
    as a large university network or even the entire Internet. When your computer
    is part of a network, you have access to those systems either directly or through
    services like mail and the web.


    There are a variety of networking programs that you can use. Some are handy for
    performing diagnostics to see if everything is working properly. Others (like
    mail readers and web browsers) are useful for getting your work done and staying
    in contact with other people.


    ## 13.1 ping


    ping(8) sends an ICMP ECHO_REQUEST packet to the specified host. If the host-responds,
    you get an ICMP packet back. Sound strange? Well, you can ‘ping’ an IP address
    to see if a machine is alive. If there is no response, you know something is wrong.
    Here is an example conversation between two Linux users:


    - User A: Loki''s down again.

    - User B: Are you sure?

    - User A: Yeah, I tried paging it, but there''s no response.


    It''s instances like these make ping a very useful day-to-day command. It provides
    a very quick way to see if a machine is up and connected to the network. The basic
    syntax is:


    - * ping www.slackware.com


    There are, of course, several options that can be specified. Check the ping(1)
    page for more information.


    ## 13.2 traceroute


    Slackware''s traceroute(8) command is a very useful network diagnostic tool. traceroute
    displays each packet travels as it tries to reach its destination. You can see
    how many "hops" to the Slackware web site you reach with this command:


    ```

    traceroute www.slackware.com

    ```


    Each host will be displayed, along with the response times at each host. Here
    is an example:


    ```

    traceroute to www.slackware.com (204.216.27.13), 30 hops max, 40 byte packets

    | 1 zuul.tdn(192.168.1.1) 0.409 ms 1.032 ms 0.303 ms |

    | 2 207.171.227.254 (207.171.227.254) 18.218 ms 32.473 ms 32.433 ms |

    | 3 border-sf-2-0-4-arius(205.134.230.254) 15.662 ms 15.731 ms 16.142 ms |

    | 4 pb-nap-cl.net(198.32.128.20) 20.741 ms 23.672 ms 21.378 ms |

    | 5 E0CL-SFO-03-E0X0.US.CL.NET (165.113.55.3) 22.293 ms 21.532 ms 21.29 ms |

    | 6 TI-CDROM-00-EX.US.CL.NET (165.113.118.2) 24.544 ms 42.955 ms 58.843 ms |

    | 7 www.slackware.com (204.216.27.13) 38.115 ms 53.033 ms 48.328 ms |

    ```


    traceroute is similar to ping it uses ICMP packets. There are several options
    that you can specify with traceroute. These options are explained in the man page.


    ## 13.3 DNS Tools


    Domain Name Service (DNS for short) is that protocol that allows your computer
    to turn meaningless names like www.slackware.com into meaningful IP address like
    64.57.102.34. Computers can''t route packets to www.slackware.com, but they can
    route to that name. DNS gives us a convenient way to remember names. Without DNS
    we''d have to keep a mental database of just what IP address belongs to, assuming
    the IP address doesn''t change. Clearly using names is better, but how do we map
    names to IP addresses?


    host(1) can do this for you. host is used to map names to IP addresses. It is
    a very quick and simple utility without a lot of functions.


    ```

    host www.slackware.com

    slackware.com is an alias for slackware.com.

    slackware.com has address 64.57.102.34

    ```


    But let''s say for some reason we want to map an IP address to a domain name;
    what then?


    nslookup is a tried and true program that has aged. nslookup has been deprecated
    and may be removed from future releases. There is not even a man page for this
    program.


    ```

    nslookup 64.57.102.34

    ```

    Note: nslookup is deprecated and may be removed from future releases. Consider
    using ''dig'' or ''host'' programs instead. Run nslookup with the -x option to
    prevent this message from appearing. Server: 192.168.1.254 Address: 192.168.1.254


    ## dig


    The main tool in the pack, domain information gather, dig(1) for short, is the
    go-to program for finding DNS information. dig can grab just anything from a DNS
    server including reverse lookups, CNAME, MX, TXT records. dig has many command
    line options and if you''re not familiar with it you should read its extensive
    manual.


    ```

    dig @192.168.1.254 www.slackware.com mx

    ;>> DIG 91.2 <<192.168.1.254 www.slackware.com mx

    ;; global options: print

    ;; answer:

    ;; ->HEADER opcode: QUERY, STATUS: NOERROR, id: 26362

    ;; flags: qr rd ra; Query: 1, ANSWER: 2, AUTHORITY: 2, ADDITIONAL: 2


    ;; QUESTION SECTION:

    ;;www.slackware.com. IN MX


    ;; ANSWER SECTION:

    ;;www.slackware.com. 76634 IN CNAME slackware.com.

    ;;slackware.com. 86400 IN MX 1 slackware.com.


    ;; AUTHORITY SECTION:

    ;;slackware.com. 86400 IN NS ns1.slackware.com.

    ;;slackware.com. 86400 IN NS ns2.slackware.com.


    ;; ADDITIONAL SECTION:

    ;;ns1.slackware.com. 160333 IN A 64.57.100.2

    ;;ns2.slackware.com. 160333 IN A 64.57.100.3


    ;; Query time: 149 msec

    ;; SERVER: 192.168.1.254(192.168.1.254)

    ;; WHEN: Sat Nov 6 16:59:31 2004

    ;; MSG SIZE rcvd: 159

    ```


    This should give you an idea how dig works. ‘@192.168.1.254’ specifies the dns
    server to use. ‘www.slack.com’ is the domain name I am performing a lookup on,
    and ‘mx’ is the type of lookup I am performing. The above query tells me that
    e-mail to www.slack.com will instead be sent to mail.slack.com for delivery.


    ## 13.4 finger


    finger(1) will retrieve information about the specified user. You give finger
    a username or an email address and it will try to contact the necessary server
    and retrieve the username, office, telephone number, and other pieces of information.
    Here is an example:


    ```

    finger johnc@idsoftware.com

    ```


    finger can return the username, status, phone numbers, and files referred to as
    ‘dot plan’ and ‘dot project’. Of course, the information returned varies with
    each finger server. The one included with Slack returns the following information
    by default:


    - Username

    - Room number

    - Home phone number

    - Work phone number

    - Login status

    - Email status

    - Contents of the .plan file in the user’s home directory

    - Contents of the .project file in the user’s home directory

    '
