    # Using Kernel Modules


    Kernel modules are another name for device drivers that can be inserted into a
    running kernel. They allow you to extend the hardware supported by your kernel
    without needing to pick another kernel or compile one yourself.


    Modules can also be loaded and unloaded at any time, even when the system is running.
    This makes upgrading specific drivers easier for system administrators. A new
    module can be compiled, the old one removed, and a new one loaded, all without
    rebooting the machine.


    Modules are stored in the /lib/modules/kernelversion directory on your system.
    They can be loaded at boot time through the rc.modules file. This file is very
    well commented and offers examples for major hardware components. To see a list
    of modules that are currently active, use the lsmod(1) command:


    ```

    # lsmod

    Module Size Used by

    parport_pc 7220 0

    parport 7844 0 [parport_pc]

    ```


    You can see here that I only have the parallel port module loaded. To remove a
    module, you use the rmmod(1) command. Modules can be loaded by the modprobe(1)
    or insmod(1) command. modprobe is usually safer because it will load any modules
    that the one you''re trying to depend on.


    A lot of users never have to load or unload modules by hand. They use the kernel
    autoloader for module management. By default, Slack includes kmod in its kernels.
    kmod is a kernel option that enables the kernel to automatically load modules
    as they are requested. For more information on kmod and how it is configured,
    see /usr/src/linux/Documentation/kmod.txt. You''ll need to have the kernel source
    package, or downloaded kernel source from http://kernel.org.


    More information can be found in the man pages for each of these commands, plus
    the rc.modules file.'
