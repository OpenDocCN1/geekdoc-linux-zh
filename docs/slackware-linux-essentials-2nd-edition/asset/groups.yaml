    # Chapter 2


    # Help


    Often there are times when you might need help with a specific command, setting
    up a program, or getting a piece of hardware to work. Maybe you simply want to
    understand a given command better, or see what other options are available to
    use with it. Luckily, there are a variety of ways that you can get the help you’re
    looking for. When you install Slack you have the option of installing packages
    from the ‘F’ series which includes FAQs and HOWTOs. Programs also come with help
    about their options, configuration files, and usage.


    ## 2.1 System Help


    man


    The man (short for ‘manual’) is the traditional form of online documentation in
    Unix and Linux operating systems. Comprised of specially formatted files, the
    ‘man pages’, are written for the vast majority of commands and are distributed
    with the software itself. Executing man somecommand will display the man page
    for (naturally) the command specified, in our example this would be the imaginary
    program command.


    As you might imagine, the amount of man pages can quickly add up, becoming overly
    confusing and seriously complicated, even for an advanced user. So, for this reason,
    man pages are grouped into enumerated sections. This system has been around for
    a very long time; enough so that you will often see commands, programs, and even
    programming library functions referred to with their man section number.


    For example:


    You might see a reference to man(1). The numbering tells you that “man” is documented
    in section 1 (user commands); you can specify that you want the section 1 man
    page for ''man'' with the command man 1 man. Specifying the section that man should
    look in is useful in the case of multiple items with the same name.


    # Table 2-1. Man Page Sections


    | Section | Contents |

    | --- | --- |

    | Section 1 | user commands (intro only) |

    | Section 2 | system calls |

    | Section 3 | C library calls |

    | Section 4 | devices (e.g., hd, sd) |

    | Section 5 | file formats and protocols (e.g., wtmp, /etc/passwd, nfs) |

    | Section 6 | games (intro only) |

    | Section 7 | conventions, macro packages, etc. (e.g., nroff, ascii) |

    | Section 8 | system administration (intro only) |


    In addition to man(1), there are the commands what(1) and apropos(1) available
    to you, whose shared purpose is to make it easier to find information in the man
    system.


    The command whatis gives a very brief description of system commands, somewhat
    in the style of a pocket command reference.


    Example:


    ```

    % whatis

    whatis (1) - search the whatis database for complete words

    ```


    # Chapter 2 Help


    The command apropos is used to search for a man page containing a given keyword.


    Example:


    ```

    $ apropos wav - a sampling utility that dumps CD audio data into wav sound

    cddawav (1) - Xirom Creditcard Netwave device driver

    netwave_cs (4) - simple decoder, Ogg Vorbis file to PCM audio file (WAV or RAW)

    goggdec (1) - (4)

    awavelan (4) - AT&T GIS WaveLAN device driver

    wavelan_cs (4) - AT&T GIS WaveLAN PCMCIA device driver

    wlan_cs (4) - Lucent WaveLAN/IEEE 802.11 device driver

    ```


    If you''d like further information on any of these commands, read their man pages
    for the details. ; )


    # /usr/doc Directory


    The source for most packages that we build comes with some sort of documentation.
    README files, usage instructions, license files, etc. Any sort of documentation
    that comes with the source is included and installed on your system in the /usr/doc
    directory. Each program will (usually) install its own documentation in the order
    of:


    ```

    /usr/doc/$program-$version

    ```


    Where $Program is the name of the program you are wanting to read about, and $version
    is (obviously) the appropriate version of software package installed on your system.


    For example, to read the documentation for the command man(1) you would want to
    cd to:


    ```

    $ cd /usr/doc/man-$version

    ```


    If reading the appropriate man page(s) doesn''t provide you with enough information,
    or address what you''re looking for in particular, the /usr/doc directory should
    be your next stop.


    # Chapter 2 Help


    # HOWTOs and mini-HOWTOs


    It is in the truest spirit of the Open Source community that brings us to the
    HOWTO/mini-HOWTO collection. These files are exactly what they sound like - documents
    and guides describing how to do stuff. If you install the HOWTO collection, the
    HOWTOs will be in /usr/doc/HOWTOs and the mini-HOWTOs in /usr/doc/mini-HOWTOs.


    Also included in the same series is a collection of FAQs, which is an acronym
    which stands for


    Frequently Asked Questions


    These documents are written in a ‘Question and answer’ style for (surprise) Frequently
    Asked Questions. If you install the FAQs during setup, you will find them in /usr/doc/FAQs.
    These files are well worth reading whenever you''re not sure how to proceed. Good
    stuff!


    ## 2.2 Online Help


    In addition to the documentation provided and installable with the Slack Operating
    System, there are a vast multitude of online resources available for you to learn
    as well.


    # The Official Website and Help Forums


    The Official Website¹


    The Official Slack website is sometimes out of date, but still contains information
    relevant to the latest versions. At one time an active forum existed there before
    a horde of trolls, troublemakers, and whiners descended on the forum. Maintaining
    the forum was beginning to be too much work, and Pat shut it down. One can find
    that old forum back and running with searchable archives of the old data.


    After the forums were taken down, Pat chose to endorse linuxquestions.org as the
    official forum for Slack Linux.


    # E-mail Support


    Everyone who purchases an official CD is entitled to free installation support
    via e-mail from the developer. That having said, please keep in mind that we,
    the developers, (and a vast majority of users) of Slack are of ‘The Old School’.
    That means that we prefer to help those who have a sincere interest and are willing
    to help themselves in the process. We will always do our best to help everyone
    emails us with support questions. However, Please check your documentation and
    the website (especially the FAQs and maybe some of the forums listed below) before
    e-mailing. You may get a faster answer that way, and the less e-mail we have to
    answer, obviously the sooner we will be of assistance to those that need.


    The e-mail address for technical support is: support@slackware.com. Other e-mail
    addresses and contact information are listed on the website.


    # Slack Linux Mailing Lists


    We have several mailing lists, available in digest and normal forms. Check the
    instructions for how to subscribe.


    > 1 http://www.slackware.com

    '
