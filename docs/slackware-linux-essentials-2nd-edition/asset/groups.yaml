    LILO 放置在硬盘的 MBR（主引导记录）、根 Linux 分区的超级块中，或在软磁盘上。


    ## 网络


    网络配置子章节实际上是 `netconfig`。更多信息请参见第 5.1 节。


    ## X 窗口管理器


    此子章节允许你为 X 选择默认窗口管理器。关于 X 和窗口管理器的更多细节，请参第 6 章。


    | 为 X 选择默认窗口管理器 | |

    | :--- | :--- |

    | 请选择与 X 系统配合使用的默认窗口管理器。这将定义计算机所使用的图形用户界面样式。KDE 和 GNOME 提供了最多的功能。具有 Windows 或
    MacOS 经验的人会发现其中任何一个很好用。其他窗口管理器更节省系统资源，或提供其他的独特功能。 | |

    | xinitrc.kde | KDE: 桌面环境 |

    | xinitrc.gnome | GNU 网络对象模型环境 |

    | xinitrc.xfce | 无胆醇桌面环境 |

    | xinitrc.blackbox | blackbox 窗口管理器 |

    | xinitrc.fluxbox | fluxbox 窗口管理器 |

    | xinitrc.wmaker | WindowMaker |

    | xinitrc.fwwm2 | F(?) 虚拟窗口管理器（版本 2.xx） |

    | xinitrc.fwwm95 | 具有 Windows 外观和感受的 FVWM2 |

    | xinitrc.twm | 窗口管理器（非常基础） |

    | < 确定 > | < 取消 > |


    无论你安装了哪些包，configure 最后会做的一件事就是询问你是否想继续设置 root 密码。出于安全考虑，这可能是一个好主意；就像 Slackware
    中的几乎所有其他东西一样，这由你决定。


    # 第 4 章


    ## 系统配置


    在配置系统更高级的部分之前，学习系统是如何组织的以及可以使用哪些命令来搜索文件和程序是一个好主意。了解你是否需要编译自定义内核以及执行该操作的步骤也是很好的。本章将让你熟悉系统结构和配置文件。然后，你就可以继续配置系统的更高级的部分了。


    ### 4.1 系统概述


    在深入研究各种配置方面之前，理解 Linux 系统是如何组合在一起的。。Linux 系统与 DOS、Windows 或 Macintosh 系统有显著不同（基于
    Unix 的 Mac OS X 除外），但这些章节将帮助你熟悉布局，以便你可以轻松配置系统以满足你的需求。


    ## 文件系统布局


    Slack Linux 与 DOS 或 Windows 系统之间第一个明显的区别是文件系统。首先，我们不使用驱动器字母来表示不同的分区。在 Linux 下，有一个主目录。你可以将其比
    DOS 下的 c: 盘。你系统上的每个分区都挂载在主目录下的一个目录。这就像是一个不断扩展的硬盘。


    我们将主目录称为根目录（root）。这是文件系统层次结构的起点。每个文件和目录都在根之下。根目录由正斜杠 `/` 表示。


    '
