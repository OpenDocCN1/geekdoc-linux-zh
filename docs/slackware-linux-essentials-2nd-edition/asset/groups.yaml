    # 13.10 与其他人交谈


    ## wall


    wall(1) 是向系统中的所有用户发送消息的快速方法。其基本语法如下：


    ```

    % wall [file]

    ```


    这会将 [file] 的内容显示在所有当前登录用户的终端上。如果你不指定文件，wall 将从标准输入读取，因此你只需要输入消息，并以 Ctrl+d 结束即可。


    wall 并没有多少功能，它的作用是让你的用户知道你正准备对系统进行一些重大的维护，甚至是重启系统，这样他们就有时间保存工作并注销 :)


    ## talk


    talk(1) 允许两个用户进行聊天。它将屏幕水平平分为两半。要请求与另一个用户聊天，请使用此命令：


    ```

    % talk <person> [ttyname]

    ```


    第 13 章 网络命令


    ### 图 13-7. talk 会话中的两个用户


    ![](img/1d848cb703597efcdc9149b6ee756285_199_0.png)


    如果你只指定了用户名，则假设聊天请求是本地的，因此只会查询本地用户。如果你想在特定的终端上呼叫用户（如果该用户登录了多次），则需要 ttyname。talk
    所需的信息可以通过 w(1) 命令获取。


    talk 也可以呼叫远程主机上的用户。对于用户名，你只需要指定一个邮箱地址。talk 将尝试联系该主机上的远程用户。

    talk 的功能相当局限。它只支持两个用户并且是半双工的。


    ## ytalk


    ytalk(1) 是 talk 的后兼容替代品。它随 Slackware 一起作为 ytalk 命令提供。语法相似，但有几处不同：


    ```

    % ytalk <username>[#tttyname]

    ```


