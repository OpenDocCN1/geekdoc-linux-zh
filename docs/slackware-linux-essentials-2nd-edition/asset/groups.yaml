    # Chapter 5 Network Configuration


    ## 5.6 Network File Systems


    At this point, you should have a working TCP/IP connection to your network. You
    should be able to ping other computers on your internal network and, if you have
    configured an appropriate gateway, you should also be able to ping computers on
    the Internet itself. As we know, the whole point in bringing a computer up on
    a network is to access information. While some people might bring a computer up
    on a network just for the fun of it, most people wish to be able to share files
    and printers. They wish to be able to access documents on the Internet or play
    an online game. Having TCP/IP installed and functional on your new Slack system
    is means to that end, but with just TCP/IP installed, functionality will be very
    rudimentary. To share files, we will have to transfer them back and forth using
    either FTP or SCP. We cannot browse files on new Slack computer from the Network
    Neighborhood or My Net Places icons on Windows computers. We''d like to be able
    to access files on other Unix machines seamlessly.


    Ideally, we''d like to be able to use a network file system to allow us transparent
    access to our files on other computers. The programs that we use to interact with
    information stored on our computers really do not to know on what computer a given
    file is stored; they just need to know that it exists and how to get to it. It
    is then the responsibility of the operating system to manage access to that file
    through the available file systems and network file systems. The two most commonly
    used network file systems are SMB (as implemented by Samba) and NFS.


    ## SMB/Samba/CIFS


    SMB (for Server Message Block) is a descendant of the older NetBIOS protocol that
    was initially used by IBM in their LAN Manager product. Microsoft has always been
    fairly interested in NetBIOS and it''s successors (NetBEUI, SMB and CIFS).


    The Samba project has existed since 1991, when it was originally written to link
    an IBM PC running NetBIOS with a Unix server. These days, SMB is the preferred
    method for sharing file and print services over a network for virtually the entire
    civilized world because Windows supports it.


    Samba''s configuration file is /etc/samba/smb.conf; one of the most well commented
    and documented configuration files you will find anywhere. Sample shares have
    setup for you to view and modify for your needs. If you need tighter control the
    man page for smb.conf is indispensable. Since Samba is documented so well in the
    places I''ve mentioned above, we will not rewrite the documentation here. We will,
    however, quickly cover the basics.


    smb.conf is broken down into multiple sections: one section per, and a global
    section for setting options that are to be used everywhere. Some options are only
    valid in the global section; some are only outside the global section. Remember
    that the global section can be over-ridden by any other section. Refer to the
    man pages for more information.


    You will most likely wish to edit your smb.conf file to reflect the network settings
    for your LAN. I would suggest modifying the items listed below:


    ```

    [global]

    # workgroup = NT-Domain-Name or Workgroup-Name, eg: LINUX2

    workgroup = MYGROUP

    ```


    Change the workgroup name to reflect the workgroup or domain name that you are
    using locally.


    ```

    # server string is the equivalent of the NT Description field

    server string = Samba Server

    ```


    This will be the name of your Slackware computer displayed in the Network Neighborhood
    (or My Network Places) folder.


    # Security mode. Most people will want user level security.

    # security_level.txt for details. NOTE: To get the behaviour of

    # Samba-1.9.18, you''ll need to use "security = share".


    security = user


    You''ll almost certainly wish to implement user level security on your Slack system.


    - # You may wish to use password encryption. Please read

    # ENCRYPTION.txt, Win95.txt and WinNT.txt in the Samba

    # documentation,

    # Do not enable this option unless you have read those documents

    encrypt passwords = yes


    If encrypt passwords is not enabled, you will not be able to use Samba with NT4.0,
    Win2k, WinXP, and Win2003. Earlier Windows operating systems did not require encryption
    to share files.


    SMB is an authenticated protocol, meaning you must supply a correct username and
    password in order to use this service. We tell the samba server that usernames
    and passwords are valid with the smbpasswd command. smbpasswd takes a couple of
    common switches to tell it to add traditional users, or add machine users (SMB
    requires that you add the computers'' NETBIOS names as machine users, restricting
    what computers can authenticate from).


    Adding a user to the /etc/samba/private/smbpasswd file.

    # smbpasswd -a user


    Adding a machine name to the /etc/samba/private/smbpasswd file.

    # smbpasswd -a -m machine


    - adduser machine$


