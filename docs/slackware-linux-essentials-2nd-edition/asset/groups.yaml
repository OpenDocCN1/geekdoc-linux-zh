    # 第5章 网络配置


    ## 5.6 网络文件系统


    此时，你应该已经建立了与网络可以正常工作的 TCP/IP 连接。你应该能够 ping 内部网络上的其他计算机，如果你配置了适当的网关，还应该能够 ping
    互联网上的计算机。正如我们所知，将计算机接入网络的主要目的就是访问信息。虽然有些人可能只是为了好玩而将计算机接入网络，但大多数人希望能够共享文件和打印机。他们希望能够访问互联网上的文档或玩在线游戏。在新的
    Slack 系统上安装并运行 TCP/IP 是实现这一目的手段，但仅安装 TCP/IP，其功能将非常简陋。要共享文件，我们必须使用 FTP 或 SCP 来回传输文件。我们无法在
    Windows 计算机的“网络邻居”或“我的网络位置”图标上浏览 Slack 计算机上的文件。我们希望能够无缝地访问其他 Unix 机器的文件。


    理想情况下，我们希望能够使用网络文件系统来透明地访问其他计算机上的文件。我们用于与计算机存储的信息交互的程序实际上并不需要知道文件存储在哪台计算机上；它们只需要知道该文件存在以及如何获取它。此时，由操作系统负责通过可用的文件系统和网络文件系统管理对该文件的访问。最常用的两种网络文件系统是
    SMB（由 Samba 实现）和 NFS。


    ## SMB/Samba/CIFS


    SMB（Server Message Block）是旧版 NetBIOS 协议的后代，最初由 IBM 在其 LAN Manager 产品中使用。微软一直对
    NetBIOS 及其继者（NetBEUI、SMB 和 CIFS）非常感兴趣。


    Samba 项目自 1991 年以来一直存在，它最初是为了连接运行 NetBIOS 的 IBM PC 与 Unix 服务器而编写的。如今，由于 Windows
    支持，SMB 已成为几乎整个文明世界通过网络共享文件和打印服务的选方法。


    Samba 的配置文件是 `/etc/samba/smb.conf`；这是你随处能找到注释最详细、文档最完整的配置文件之一。它已经设置了示例共享，供你根据需要查看和修改。如果你需要更严格的控制，`smb.conf`
    的 man 页面是不可或缺的。由于我在上面提到的地方对 Samba 的文档非常详尽，我们不会在这里重写这些文档。然而，我们将快速介绍基础知识。


    `smb.conf` 分为多个部分：每个部分对应一个，还有一个用于设置全局生效选项的全局部分。某些选项仅在全局部分有效；某些仅在全局部分之外有效。记住，全局部分可以被任何其他部分覆盖。更多信息请参考
    man 页面。


    你很可能想要编辑 `smb.conf` 文件以反映你局域网的网络设置。我建议修改列出的项目：


    ```

    [global]

    # workgroup = NT-Domain-Name or Workgroup-Name, eg: LINUX2

    workgroup = MYGROUP

    ```


    更改工作组名称以反映你本地使用的工作组名或域名。


    ```

    # server string 等同于 NT Description 字段

    server string = Samba Server

    ```


    这将是你的 Slackware 计算机在“网络邻居”（或“我的网络位置”）文件夹中显示的名称。


    # 安全模式。大多数人想要用户级安全。

    # 详情请查看 security_level.txt。注意：要获得

    # Samba-1.9.18 的行为，你需要使用 "security = share"。


    security = user


    你几乎肯定会在你的 Slack 系统上实现用户级安全。


    - # 你可能希望使用密码加密。请阅读 Samba

    # 文档中的 ENCRYPTION.txt、Win95.txt 和 WinNT.txt，

    # 在阅读这些文档之前不要启用此选项

    encrypt passwords = yes


    如果未启用 `encrypt passwords`，你将无法与 NT4.0、Win2k、WinXP 和 Win2003 使用 Samba。早期的 Windows
    操作系统不需要加密即可共享文件。


    SMB 是一个认证协议，这意味着必须提供正确的用户名和密码才能使用此服务。我们通过 `smbpasswd` 命令告诉 Samba 服务器用户名和密码是有效的。`smbpasswd`
    带有几个常用开关，用于添加传统用户或添加机器用户（SMB 要求将计算机的 NETBIOS 名称作为机器用户添加，以限制哪些计算机可以进行验证）。


    向 `/etc/samba/private/smbpasswd` 文件添加用户。

    # smbpasswd -a user


    向 `/etc/samba/private/smbpasswd` 文件添加机器名。

    # smbpasswd -a -m machine


    - adduser machine$


    ## 网络文件系统 (NFS)


    NFS（或网络文件系统）最初由 Sun 为其 Solaris 版本的 Unix 编写。虽然与 SMB 相比，它更容易上手运行，但其安全性也明显低得多。NFS
    的主要不安全性在于很容易从一台机器伪造用户 ID 和用户组 ID。NFS 是一个未认证的协议。未来的 NFS 协议版本旨在增强安全性，但在本文写作时这些并不常见。


    NFS 配置由 `/etc/exports` 文件管理。（*此处由于重复内容已省略*）


    NFS 配置由 `/etc/exports` 文件管理。（*此处由于重复内容已省略*）


    ## 第6章 X 配置


    从 Slack-10.0 开始，Slack 中的 X 窗口环境由 Xorg 提供。X 负责提供图形界面。它独立于 Windows 或 macOS。两个主要组件是服务器和窗口管理器。服务器提供与视频硬件交互的低级函数，因此它是特定系统的。窗口管理器运行在服务器之上并提供用户界面。这种设计的优点是你可以通过切换使用的窗口管理器来获得图形界面。


    配置 X 需要创建一个 `/etc/X11/xorg.conf` 文件。该文件包含了关于你的视频硬件、鼠标和显示器的大量详细信息。这是一个非常复杂的配置文件，但幸运的是有很多程序可以帮助创建。我们在这里提到其中几个。


