    # 5.2 Network Hardware Configuration


    Having decided that you wish to bring your Slackware machine on to some form of
    network, the first thing you''ll need is a Linux-compatible network card. You
    will need to take a little care to ensure that the card is truly Linux-compatible
    (please refer to the Linux Documentation Project and/or the kernel documentation
    for information on the current status of your proposed network card). As a general
    rule, you will most likely be pleasantly surprised by the number of networking
    cards that are supported under the more modern kernels. Having said that, I''d
    suggest referring to any of the various Linux hardware compatibility lists (such
    as The GNU/Linux Beginners Group Hardware Compatibility Links¹ and The Linux Documentation
    Project Hardware HOW²) that are available on the Internet before purchasing your
    card. A little extra time spent in research can save days or even weeks to troubleshoot
    a card that isn''t compatible with Linux at all.


    When you visit the Linux Hardware Compatibility lists available on the Internet,
    and when you refer to the kernel documentation installed on your machine, it would
    be wise to know which kernel module you''ll need to use to support your network
    card.


