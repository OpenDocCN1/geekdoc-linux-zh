    exclamation point after the “q” like so:


    :q!


    The exclamation point usually means to force some action. We’ll discuss it and
    other key combinations in further details later.


    You can also start vi with a pre-existing file. For example, the file /etc/resolv.conf
    would be opened like so:


    ```

    vi /etc/resolv.conf

    ```


    Finally, vi can be started on a particular line of a file. This is especially
    useful for programmers when an error includes the line your program bonded. For
    example, you could start vi on line 47 of /usr/src/linux/init/main.c like so:


    ```

    vi +47 /usr/src/linux/init/main.c

    ```


    vi will display the given file and place the cursor in the specified line. The
    case where you specify a line that is after the end of the file, vi will place
    the cursor on the last line. This is especially helpful for programmers, as they
    can jump straight to the location in the file that an error occurred, without
    having to search for it.


    # 16.2 Modes


    vi operates in various modes, which are used to accomplish various tasks. When
    you first start vi, you are placed into command mode. From this point, you can
    issue various commands to manipulate the text, move around in the file, save,
    quit, and change modes. Editing the text is done in insert mode. You can quickly
    move between modes with a variety of keystrokes, which are explained below.


    # Command Mode


    You are first placed into command mode. From this mode, you cannot directly enter'
