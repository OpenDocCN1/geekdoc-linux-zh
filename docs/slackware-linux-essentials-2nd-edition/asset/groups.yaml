    The NFS selection prompts for your network information and the network information
    for NFS server. The NFS server must be set up in advance. Also note that you cannot
    use hostnames, you must use the IP addresses for both your machine and the NFS
    server (there is no name resolver on the setup disk). Naturally you must have
    used `network.dsk` floppy to add support for your network controller.


    The premounted directory offers the most flexibility. You can use this method
    to install from things such as Jaz disks, NFS mounts over PLIP, and FAT filesystems.
