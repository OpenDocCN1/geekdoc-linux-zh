    # Preface


    ## Intended Audience


    The Slack Linux operating system is a powerful platform for Intel-based computers.
    It is designed to be stable, secure, and functional as both a high-end server
    and powerful workstation.


    This book is designed to get you started with the Slack Linux operating system.
    It''s not meant to cover every single aspect of the distribution, but rather to
    show what it is capable of and give you a basic working knowledge of the system.


    As you gain experience with Slack Linux we hope you find this book to be a handy
    reference. We also hope you''ll lend it to all of your friends when they come
    asking about that cool Slack Linux operating system you''re running.


    While this book may not be an edge-of-your-seat novel, we certainly tried to make
    it as entertaining as possible. With any luck, we''ll get a movie deal. Of course,
    we also hope you are able to learn from it and find it useful.


    And now, on with the show.


    ## Changes from the First Edition


    This second edition is the culmination of years of hard work by the dedicated
    members of the Slack Documentation Project. The following are the major changes
    in this new edition:


    - Chapter 3, Installation, has been modified with new screenshots of the installer,
    and reflects changes in disk-sets, and CD installation.

    - Chapter 4, System Configuration, has been updated with new information about
    Linux 2.6.x kernels.

    - Chapter 5, Network Configuration, has been expanded with further explanation
    of Samba, NFS, and DHCP. A section on wireless networking has also been added.
    This chapter now reflects major changes in how Slackware handles network setup.

    - Chapter 6, X Window System, has been substantially rewritten for Xorg based
    systems. This chapter now also covers the xdm graphical login manager.

    - Chapter 13, Basic Network Commands, has been enhanced with information additional
    network utilities.

    - Chapter 14, Security, is a new chapter with this edition. It explains how to
    keep a Slackware Linux system secure.

    - Chapter 17, Emacs, is a new chapter with this edition. It describes how to use
    Emacs, a powerful editor for Unix.

    - Chapter 18, Package Management, has been updated with information about SlackBuild
    scripts.

    - There are many other changes, both minor and major, to reflect changes in Slackware
    as it has matured.


    ## Organization of this Book


    Chapter 1, Introduction

    Provides introductory material on Linux, Slackware, and the Open Source and Free
    Software Movements.


    Chapter 2, Help

    Describes the help resources available on a Slackware Linux system and online.


    Chapter 3, Installation

    Describes the installation process step-by-step with screenshots to provide an
    illustrative walk-through.


    Chapter 4, System Configuration

    Describes the important configuration files and covers kernel recompilation.


    Chapter 5, Network Configuration

    Describes how to connect a Slackware Linux machine to a network. Covers TCP/IP,
    PPP/dial-up, wireless networking, and more.


    Chapter 6, The X Window System

    Describes how to setup and use the graphical X Window System in Slackware.


    Chapter 7, Booting

    Describes the process by which a computer boots into Slackware Linux. Also covers
    dual-booting with Microsoft Windows operating systems.


    Chapter 8, The Shell

    Describes the powerful command line interface for Linux.


    Chapter 9, Filesystem Structure

    Describes the filesystem structure, including file ownership, permission, and
    linking.


    Chapter 10, Handling Files and Directories

    Describes the commands used to manipulate files and directories from the command
    line interface.


    Chapter 11, Process Control

    Describes the powerful Linux process management commands used to manage multiple
    running applications.


    Chapter 12, Essential System Administration

    Describes basic system administration tasks such as adding and removing users,
    shutting down the system properly, and more.


    Chapter 13, Basic Network Commands

    Describes the collection of network clients included with Slackware.


    Chapter 14, Security

    Describes many different tools available to help keep your Slackware system secure,
    including iptables and tcpwrappers.


    Chapter 15, Archive Files

    Describes the different compression and archive utilities available for Linux.


    Chapter 16, vi

    Describes the powerful vi text editor.


    Chapter 17, Emacs

    Describes the powerful Emacs text editor.


    Chapter 18, Slackware Package Management

    Describes the Slackware package utilities and the process used to create custom
    packages and tagfiles.


    Chapter 19, ZipSlack

    Describes the ZipSlack version of Linux that can be used from Windows without
    requiring an installation.


    Appendix A, The GNU General Public License

    Describes the license terms under which Slackware Linux and this book can be copied
    and distributed.


