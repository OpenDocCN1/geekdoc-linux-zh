    \ to carrier.liza.net closed.\n```\n\nThere you see me making an ssh connection\
    \ to carrier@liza.net, and checking the permissions on the MANIFEST file.\n\n\
    ## 13.7 email\n\nElectronic mail is one of the most popular things one can do\
    \ on the Internet. In 1998, it was reported that more electronic mail was sent\
    \ than regular mail. Under Slackware, we provide a standard mail server, and several\
    \ mail clients. All of the clients below are text-based. A lot of Windows users\
    \ may against this, but you will find that a text based client is very convenient,\
    \ especially when checking mail remotely. Fear not, there are many graphical-mail\
    \ clients such as KDE's Kmail. If you wish to use one of those check its help\
    \ menu.\n\n## pine\n\npine(1) is not elm. Or the saying goes. The University of\
    \ Washington created their program for Internet news and email for their students.\
    \ pine is one of most popular email clients in use today and is available for\
    \ nearly every flavor of Unix and even Windows.\n\n## Figure 13-2. The Pine main\
    \ menu\n\n| PINE 4.5 | MAIN MENU | Folder: INBOX 2 Messages |\n|---|---|---|\n\
    | ? | | Get help using Pine |\n| C | COMPOSE MESSAGE | Compose and send a message\
    \ |\n| I | MESSAGE INDEX | View messages in current folder |\n| L | FOLDER LIST\
    \ | Select a folder to view |\n| A | ADDRESS BOOK | Update address book |\n| S\
    \ | SETUP | Configure Pine Options |\n| Q | QUIT | Leave the Pine program |\n\n\
    You will see a menu of commands and a row of command keys at the bottom. pine\
    \ is indeed a complex program, so we will not discuss every feature about it.\
    \ To see what's in your inbox, type i. Your messages are listed with their date,\
    \ author, and subject. Highlight the message you want and press enter to view\
    \ it. Press r will start a reply to the response, type Ctrl+X to send it. You\
    \ can press i to get back to the message listing. If you want to delete a message,\
    \ press d. It will mark the highlighted message for deletion. pine deletes the\
    \ mail when you exit the program. pine also lets your mail in folders. You can\
    \ get a listing of folders by pressing l. At the message listing, press s to save\
    \ it to another folder. It will ask for the folder name to write the message to.\
    \ pine offers many, many features; you should definitely have a look at the man\
    \ page for more information. It will contain the latest information about the\
    \ program.\n\n## elm\n\nelm(1) is another popular text-based email client. Though\
    \ not quite as user friendly as pine, it's definitely been around a lot longer.\n\
    \nFigure 13-3. Elm main screen\n\n```\nMailbox is '/var/mail/root/' with 2 messages\
    \ [ELM 2.5 PL6]\n1 Sep 17 Patrick J. Volker (174) Welcome to Linux (Slackware\
    \ 9.1)!\n0 2 Sep 17 (45) Register with the Linux counter pr\n```\n\nyou can use\
    \ any of the following commands by pressing the first character; d)delete or u)ndelete\
    \ mail, m)ail a message, r)reply or f)oward mail, q)uit to read a message, press\
    \ <return>. j = move down, k = move up, ? = help Command:\n\nBy default, you are\
    \ placed in your inbox. The messages are listed with the message number, date,\
    \ sender, and subject. Use the arrow keys to highlight the message you want. Press\
    \ Enter to read the message. To compose a new message, type m at the main screen.\
    \ The d key will flag a message for deletion. And the r key will reply to the\
    \ current message you are reading. All of these keys are displayed at the bottom\
    \ of the screen with a prompt. The man page discusses elm in more detail, so you\
    \ will probably want to consult that before using elm.\n\n## mutt\n\n“All mail\
    \ clients suck. This one just sucks less.” mutt’s original interface was based\
    \ on elm with added features found in other popular mailclients, resulting in\
    \ a hybrid mutt.\n\nSome of mutt’s features include:\n\n- color support\n- message\
    \ threading\n- MIME and PGP/MIME support\n- pop3 and imap support\n- support for\
    \ multiple mailbox formats (mbox, MMDF, MH, maildir)\n- highly customizable\n"
