    Slackware provides more than a dozen precompiled kernels that you can pick from,
    each with a standard set of drivers and additional specific drivers. You can run
    one of the precompiled kernels or you can build your own kernel from source. Either
    way, you need to make sure your kernel has the hardware support your system needs.


    # /kernels Directory on the Slackware CD-ROM


    The precompiled Slackware kernels are available in the /kernels directory on the
    Slackware CD-ROM or on the FTP site in the main Slackware directory. The available
    kernels as new releases are made, the documentation in that directory is always
    the authoritative source. The /kernels directory has subdirectories for each kernel
    available. The subdirectories have the same name as their accompanying boot disk.
    In each subdirectory you will find the following files:


    | File | Purpose |

    |---||

    | System.map | The system map file for this kernel |

    | bImage | The actual kernel image |

    | config | The source configuration file for this kernel |


    To use a kernel, copy the System.map and config files to your /boot directory
    and copy the kernel image to /boot/vmlinuz. Run /sbin/liic(8) to install LILO
    for the new kernel, and then reboot your system. That''s all there is to installing
    a new kernel.


    The kernels that end with a .i IDE kernels. That is, they include no SCSI support
    in the base kernel. The kernels that end with .s are SCSI kernels. They include
    all the IDE support in .i kernels, plus SCSI support.


