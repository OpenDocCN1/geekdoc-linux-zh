    # 5.5 Wireless


    Networking is still a relatively new thing in the world of computers, yet is quickly
    catching on as more people begin to purchase laptops and want networking on the
    go, without having to fool with some old twisted pair cable. This trend doesn''t
    appear to be slowing down. wireless networking isn''t yet as strongly supported
    in Linux as traditional wired networking.


    There are three basic steps to configuring an 802.11 wireless Ethernet card:


    +   1. Hardware support for the wireless card


    +   2. Configure the card to connect to a wireless access point


    +   3. Configure the network


    # Hardware Support


    Hardware support for a wireless card is provided through the kernel, either with
    a module or built in to the kernel. Generally, most newest Ethernet cards are
    provided through kernel modules, so you''ll want to determine the appropriate
    kernel module and load it through /etc/rc.d/rc.modules. netconfig may not detect


    67'
