    alt.os.linux.slackware, better known as aols (not to be confused with AOL®!) is
    one of the most active places to find technical help with Slack problems. Like
    every Usenet newsgroup, a few unhelpful participants (‘trolls’) can mar the experience
    with constant arguing. Learning to ignore the trolls and identifying the truly
    helpful people is key to making the most of this resource.


