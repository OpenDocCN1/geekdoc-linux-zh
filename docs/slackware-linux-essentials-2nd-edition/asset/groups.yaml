    # 安装方法


    ## 软盘 (Floppy)


    虽然曾经可以通过软盘安装整个 Slack Linux，但软件包体积的不断增大（事实上，某些单独程序也是如此）迫使人们放弃了软盘安装。直到 Slack 7.1
    版本，仍然可以使用软盘进行部分安装。A 系列和 N 系列几乎可以完全安装，提供一个基础系统，从该系统安装发行版的其余部分。如果你正在考虑使用软盘安装（通常是在旧款硬件上），通常建议找到一张基础
    CD，或者使用旧版本。由于这个原因，Slack 4.0 仍然非常流行，7.0 也是如此。


    请注意，如果你没有可启动 CD，那么在进行 CD-ROM 安装以及 NFS 安装时仍然需要软盘。


    ## 光盘 (CD-ROM)


    如果你有可启动 CD（可在 Slack Linux, Inc. 出版的官方光盘集中获得，参见“获取 Slack”章节），那么基于 CD 的安装对你来说会简单一些。如果没有，你将需要从软盘启动。此外，如果你有特殊硬件，导致启动
    CD 上的内核使用出现问题，你可能需要使用特殊的软盘。


    从 Slack 8.1 版本开始，使用了一种新方法来创建启动 CD，这种方法在某些不稳定的 BIOS 芯片上运行不佳（值得注意的是，如今大多数 Linux
    CD 都受到此影响）。如果是如此，我们建议从软盘启动。


    第 3.2.3 节和第 3.2.5 节提供了在必要时选择和创建用于启动软盘的信息。


    # 第 3 章 安装


    ## NFS


    NFS（网络文件系统）是让远程机器可以使用文件系统的一种方法。NFS 安装允许你从网络上的另一台计算机安装 Slack。你正在安装的机器需要配置为将 Slack
    发行版树导出到你安装的机器。这显然涉及一些 NFS 知识，这些将在第 5.6 节中介绍。


    可以通过 PLIP（通过并行口）、SLIP 和 PPP 等方法进行 NFS 安装（但不是通过调制解器连接）。然而，我们建议在条件允许的情况下使用网卡。毕竟通过打印机端口安装操作系统将是一个非常非常缓慢的过程。


    ## 启动盘 (Boot Disk)


    启动盘是你实际启动以开始安装的软盘。它包含一个压缩的内核镜像，用于在安装期间控制硬件。因此，这是非常不可少的（除非你像“CD-ROM”章节讨论的那样从 CD
    启动）。启动盘位于发行版树中的 `bootdisks/` 目录。


    Slack 启动盘多到数不完（也就是说大约有 16 个）。启动盘的完整列表及其每个描述可以在 Slack 发行版树的 `bootdisks/README.TXT`
    文件中找到。然而，大多数人可以使用 `bare.i`（用于 IDE 设备）或 `scsi.s`（用于 SCSI 设备）启动盘镜像。


    请查看第 3.2.6 节有关如何从镜像制作磁盘的说明。


    启动后，系统将提示你插入根盘。我们建议你只需配合启动盘的要求进行操作。


    ## 根盘 (Root Disk)


    根盘包含安装程序和安装期间使用的文件系统。它们也是必须的。根盘镜像位于目录树中。你需要从 `install.1` 和 `install.2` 镜像制作两个根盘。在这里你也可以找到
    `network.dsk`、`pcmcia.dsk`、`rescue.dsk` 和 `bootmgr.dsk` 磁盘。


    ## 辅助盘 (Supplemental Disk)


    如果你正在执行 NFS 或安装到带有 PCMCIA 设备的系统，则需要辅助盘。辅助盘位于发行版树中的 `rootdisks` 目录，文件名 `network.dsk`
    和 `pcmcia.dsk`。最近又添加了如 `rescue.dsk` 和 `bootmgr.dsk` 等其他辅助盘。救援盘是一个在 4MB RAM 驱动器中运行的小型软盘镜像。它包含了一些基础网络工具和
    vi 编辑器，用于对故障机器进行快速修复。`bootmgr.dsk` 用于启动其他设备。如果你的 CD-ROM 驱动器无法启动 Slack CD，请使用它启动。它将提示你进行不同的启动项，并可能提供一种绕过缺陷
    BIOS 的方便方法。


    根盘加载后将指导你如何使用辅助盘。


    ## 制作磁盘 (Making the Disks)


    一旦选择了启动盘镜像，就需要将其放入软盘中。根据你用于制作磁盘的操作系统，过程略有不同。如果你运行的是 Linux（或几乎任何 Unix 类的操作系统），你需要使用
    `dd(1)` 命令。假设 `bare.i` 是你的磁盘镜像文件，且软盘驱动器是 `/dev/fd0`，制作 `bare.i` 软盘的命令为：


    ```

    % dd if=bare.i of=/dev/fd0

    ```


    如果你运行的是 Microsoft OS，你需要使用 `RAWRITE.EXE` 程序，它包含在发行树中与软盘镜像相同的目录下。同样假设 `bare.i`
    是你的磁盘镜像文件，且软盘驱动器为 `A:`，打开 DOS 提示符并输入以下内容：


    ```

    C:\write a: bare.i

    ```


    ## 3.3 分区 (Partitioning)


    从你优的介质启动后，你需要对硬盘进行分区。磁盘分区是创建 Linux 文件系统以及安装 Slack 的地方。我们至少建议创建分区：一个用于根文件系统 (/)，另一个用于交换空间
    (swap)。


    根加载完成后，它将向你显示登录提示。以 root 身份登录（没有密码）。在 shell 提示符处运行 `cfdisk(8)` 或 `fdisk(8)`。`cfdisk`
    程序提供了比 `fdisk` 更友好的界面，但缺少了一些功能。我们将在下文中简要介绍 `fdisk` 程序。


    首先为你的硬盘运行 `fdisk`。在 Linux 中，硬盘没有驱动器号，而是用文件表示。第一个 IDE 硬盘（主）是 `/dev/hda`，从设备是 `/dev/hdb`，以此此类推。SCSI
    磁盘遵循相同的系统，但格式为 `/dev/sdx`。你需要启动 `fdisk` 并传递你的硬盘：


    ```

    # fdisk /dev/hda

    ```


    像良好的 Unix 程序一样，`fdisk` 会给你一个提示符（你以为你会看到菜单吗？）。你应该做的第一件事是检查当前分区。在 fdisk 提示符处输入 `p`
    执行：


    ```

    Command (m for help): p

    ```


    这将显示关于当前分区的所有信息。大多数人选择一个空硬盘进行安装，然后移除其上的现有分区以为 Linux 分区留出空间。


    > **警告：在破坏信息所在的分区之前，务必备份任何想要保存的信息。**


    删除分区没有简单的恢复方法，因此在操作之前请务必备份。


    查看分区信息表，你应该看到分区编号、分区大小及其类型。还有其他信息，但现在无用担心。我们将删除此驱动器上的所有分区以创建 Linux 分区。我们运行 `d`
    命令来删除它们：


    ```

    Command (m for help): **d**

    Partition number (1-4): **1**

    ```


    此过程应对每个分区继续。删除分区后，我们准备好创建 Linux 分区了。我们决定创建一个用于根文件系统和交换空间的分区。


    '
