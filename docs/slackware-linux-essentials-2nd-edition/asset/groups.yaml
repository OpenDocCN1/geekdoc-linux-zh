    cp 还有许多选项，在线手册页中进行了详细讨论。\n\n### mv\n\nmv(1) 将文件从一个地方移动到另一个地方。听起来很简单，不是吗？\n\n```\n\
    % mv oldfile /tmp/newfile\n```\n\nmv 有几个命令行选项，在 man 手页中有详细说明。在实践中，mv 几乎从不配合命令行选项使用。\n\
    \n## 10.6 删除：rm 和 rmdir\n\n### rm\n\nrm(1) 文件和目录树。DOS 用户会注意到它与 del 和 deletree\
