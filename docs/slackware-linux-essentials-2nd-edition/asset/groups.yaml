    ## 第 7 章：启动


    启动你的 Linux 系统过程有时很简单，有时则很困难。许多用户在电脑上安装了 Slackware 后就结束了。他们只需开机即可使用。而在其他情况下，仅仅启动机器可能是一项性任务。对于大多数用户来说，Slackware
    包含了用于启动 Slack Linux 的 LILO 和 Loadlin。LILO 可以从硬盘分区、硬盘的主引导记录（MBR）或软盘运行，是一个非常通用的工具。Loadlin
    则从 DOS 命令行工作，通过终止 DOS 并调用 Linux。


    另一个流行的启动 Linux 的工具是 GRUB。Slackware 不包含也不官方支持 GRUB。Slackware 在发行版内部包含的内容方面遵循“经久考验”的标准。虽然
    GRUB 运行良好且包含了 LILO 不具备的功能，但 LILO 凭借经过证明的记录，可靠地处理引导程序的所有基本任务。由于资历较短，GRUB 还没有完全达到那种地位。由于它没有包含在
    Slackware 中，我们在这里不讨论它。如果你想使用 GRUB（可能它是随另一个 Linux 操作系统一起提供的，而你想用它进行双系统），请咨询 GRUB
    的文档。


    本节涵盖了 Slackware 包含的两个启动器 LILO 和 Loadlin。它还解释了一些典型的双系统场景以及你可以如何进行设置。


    ### 7.1 LILO


    Linux 加载器（Linux Loader，简称 LILO）是 Linux 系统上常用的启动器。它具有很强的配置性，可以轻松用于启动其他操作系统。


    Slack Linux 附带了一个名为 liloconfig 的菜单驱动型配置工具。该程序在安装过程中首次运行，但你也可以以后在提示符处输入 `liloconfig`
    来调用它。


    LILO 从 `/etc/lilo.conf(5)` 文件读取其设置。它并不是每次启动时都读取，而是在每次运行 LILO 时才被读取。每当你进行配置更改时，必须重新将
    LILO 安装到引导扇区。许多 LILO 错误由于修改了 `.lilo.conf` 文件，但未能重新运行 LILO 来安装这些更改。liloconfig 会帮助你构建配置文件，以便你为系统安装
    LILO。如果你更倾向于手动编辑 `/etc/lilo.conf`，那么重新安装 LILO 只需在提示符处输入 `/sbin/lilo`（以 root 身份）。


    当你第一次调用 liloconfig 时，它看起来像这样：


    **图 7-1. liloconfig**


    ![](img/1d848cb703597efcdc9149b6ee756285_111_0.png)


    如果这是你第一次设置 LILO，你应该选择 simple（简单）。否则，如果你熟悉 LILO 和 Linux，可能会发现选择 expert（专家）速度更快。选择
    simple 将开始 LILO 配置。


    如果内核帧缓冲区支持（frame buffer support）被编译到你的内核中，liloconfig 将询问你想要使用哪种视频的分辨率。这个分辨率也是
    XFree86 帧缓冲区服务器使用的分辨率。如果你不想让控制台在特殊的视频模式下运行，选择 normal（普通）将保持标准的 80x25 文本模式。


    LILO 配置的下一部分是选择你想安装的位置。这可能是最重要的一步。下面的列表解释了安装位置：


    - **Root（根目录）**：此选项将 LILO 安装到你的 Linux 根分区的开头。如果你电脑上有其他操作系统，这是最安全的选项。它确保其他引导器不会被覆盖。缺点是，如果你的
    Linux 硬盘是系统上的第一块硬盘，LILO 将只从这里加载。这就是为什么许多人选择创建一个非常小的 `/boot` 分区作为系统上的第一个分区。这允许内核和
    LILO 安装在硬盘的开头，LILO 可以在那里找到它们。旧版本的 LILO 包含一个被称为“1024 柱限制限制”的缺陷。LILO 无法启动位于 1024
    柱之后分区上的内核。最新版本的 LILO 已消除了这个问题。


    - **Floppy（软盘）**：这种方法比前一种更安全。它会创建一个启动软盘，你可以用它启动你的 Linux 系统。这让引导器完全离开硬盘，因此只有在你想使用
    Slackware 时才启动此软盘。这种方法的缺陷显而易见。软盘因极其不稳定而闻名，容易故障。其次，引导程序不再包含在计算机内部。如果你丢失了软盘，你必须再制作一个来启动系统。


    - **MBR（主引导记录）**：如果 Slackware 是你电脑上唯一的操作系统，或者你将使用 LILO 在电脑上的多个操作系统之间进行选择，你将需要使用这种方法。这是安装
    LILO 的最优方法，并适用于几乎任何计算机系统。


    **警告：**此选项将覆盖你在 MBR 中的任何其他引导器。


    在选择安装位置后，liloconfig 将写入配置文件并安装 LILO。就是这样。如果你选择 expert（专家）模式，你将收到一个特殊菜单。此菜单允许你调优
    `/etc/lilo.conf` 文件，将其他操作系统添加到你的启动菜单中，并设置 LILO 在启动时传递特殊的内核参数。专家菜单看起来如下：


    **图 7-2. liloconfig 专家菜单**


    | 专家级 LILO 安装 |

    | :--- |

    | 此菜单引导配置文件并安装 LILO。如果你选择专家模式，你将收到一个特殊菜单。此菜单允许你调优 `/etc/lilo.conf` 文件，将其他操作系统添加到你的启动菜单中，并设置
    LILO 在启动时传递特殊的内核参数。 |

    | 向你的启动菜单中添加其他操作系统 |

    | 设置 LILO 在启动时传递特殊的内核参数 |

    | 跳过 LILO |

    | 查看当前 lilo 配置 |


    ### 7.2 LOADLIN


    Slackware 附带的另一个启动选项是 LOADLIN，LOADLIN 是一个 DOS 可执行文件，可以从 DOS 系统启动 Linux。它需要 DOS
    分区。这种方法比前一种更安全。它会创建一个启动软盘，你可以用它启动你的 Linux 系统。这让引导器完全离开硬盘，因此只有在你想使用 Slackware 时才启动此软盘。这种方法的缺陷显而易见。软盘因极其不稳定而闻名，容易故障。其次，引导程序不再包含在计算机内部。如果你丢失了软盘，你必须再制作一个来启动系统。


    ### 7.3 双系统


    许多用户将他们的电脑设置为同时启动 Slackware Linux 和另一个操作系统。我们在下方描述了若干种典型的双系统场景，以防你在设置系统时遇到困难。


    #### Windows


    在电脑上同时安装 MS Windows 和 Linux 可能是最常见的双系统场景。你有许多方法可以设置启动，本节将涵盖其中。


    '
