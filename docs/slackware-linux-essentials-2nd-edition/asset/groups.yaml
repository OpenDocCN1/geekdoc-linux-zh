    directory to your PATH. In that case, you probably want to do something like this:


    ```bash

    $ export PATH=$PATH:/some/new/directory

    ```

    Note the use of $PATH: when you want bash to interpret a variable (replace it
    with its value), tack $ onto the beginning of the variable''s name. For instance,
    `echo $PATH` will echo the value of PATH, in my case:


    ```bash

    $ echo $PATH

    /usr/local/lib/bin:/usr/local/bin:/usr/bin:/bin:/usr/X11R6/bin:

    /usr/openwin/bin:/usr/games:../usr/local/ssh2/bin:/usr/local/ssl/bin:

    /usr/share/texmf/bin:/usr/local/sbin:/usr/sbin:/home/logan/bin

    ```


