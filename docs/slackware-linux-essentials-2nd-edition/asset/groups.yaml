    most of the same goals, but takes a more pragmatic approach to them. Followers
    of this movement prefer to base their arguments on the economic and technical
    merits of making source code freely available, rather than the moral and ethical
    principles that drive the Free Software Movement.


    At the other end of the spectrum are groups that wish to maintain tighter controls
