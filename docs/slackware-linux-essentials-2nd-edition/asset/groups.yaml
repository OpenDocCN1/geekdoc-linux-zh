    Another FAQ


    # Usenet Groups (NNTP)


    Usenet has long been a place for geeks to gather and help one another. There are
    few newsgroups dedicated to Slack Linux, but they tend to be filled with very
    few knowledgeable people.


    ```

    alt.os.linux.slackware

