- md: "\n## Chapter 15 Archive Files\n\nAll the above statements are equivalent. In\
    \ each case, the archive is unpacked inside your home directory and the original\
    \ uncompressed archive is left in place.\n\nSo what good is being able to uncompress\
    \ these archives if you can't make them? Well, tar handles that too. In most cases\
    \ it's as easy as removing the “-x” option and replacing it with the “-c” option.\n\
    \n```\n$ tar -cvzf filename.tar.gz own```\n\nIn this command, the -c option tells\
    \ tar to create an archive, while the -z option runs the resulting archive through\
    \ gzip to compress it. filename.tar.gz is the file you want to create.\n\nSpecifying\
    \ the “-f” option isn't always necessary, but is typically good practice anyway.\
    \ Without it, tar writes to standard output, which is usually desired for piping\
    \ tar’s output to another program, like so.\n\n```\n$ tar -cv filename.tar | gpg\
    \ --encrypt own```\n\nThat command creates an non-compressed archive of the current\
    \ directory, pipes the tarball through gpg which encrypts and compresses the tarball,\
    \ making realistically impossible to read by anyone other than the person knowing\
    \ the secret key.\n\n## 15.4 zip\n\nFinally, there are two utilities that can\
    \ be used on zip files. These are very common in the Windows world, so Linux has\
    \ programs to deal with them. The compression program is called zip(1), and the\
    \ decompression program is called unzip(1).\n\n```\n$ zip foo * own```\n\nThis\
    \ will create the file foo.zip, which will contain all the files in the current\
    \ directory. zip will add the .zip extension automatically, so there’s no need\
    \ to include that in the file name. You can also recurse through the current directory,\
    \ zipping up any directories that are also laying around:\n\n```\nzip -r foo *\
    \ own```\n\nDecompressing files is easy, as well.\n\n```\nunzip foo.zip own```\n\
    \nThis will extract all the files in the file foo.zip, including any directories\
    \ in the archive.\n\nThe zip utilities have several advanced options for creating\
    \ self-extracting archives, leaving out files, controlling compressed file size,\
    \ printing out what will happen, and much more. See the man pages for zip and\
    \ unzip to find out how to use these options.\n\n## Chapter 16\n\n## Vi\n\nvi(1)\
    \ is the standard Unix text editing program, and while mastering it is not as\
    \ essential as it once was, is still a very rewarding goal. There are several\
    \ versions (clones) of vi available, including vi, elvis, vile, and vim. One of\
    \ these is available on just about any version of Unix, as well as on Linux. All\
    \ of these versions include the same basic feature set and commands, so learning\
    \ one clone should make it easy to learn another. With the variety of text editors\
    \ included Linux distributions and Unix variants these days, many people no longer\
    \ use vi. Still, it remains the most universal text editor across Unix and Unix\
    \ work-alikes. Mastering vi means you should never be sitting at a Unix machine\
    \ and not be comfortable with at least one powerful text editor.\n\nvi includes\
    \ a number of powerful features including syntax highlighting, code-formatting,\
    \ a powerful search-and-replace mechanism, macros, and more. These features make\
    \ it especially attractive to programmers, web developers, and the like. System\
    \ administrators will appreciate the automation and integration with the shell\
    \ that is possible.\n\nOn Slackware Linux, the default version of vi available\
    \ is elvis. Other versions - including vim and gvim - are available if you've\
    \ installed the proper packages. gvim is an X Window version of vim that includes\
    \ toolbars, detachable menus, and dialog boxes.\n\n## 16.1 Starting vi\n\nvi can\
    \ be started from the command line in a variety of ways. The simplest form is\
    \ just:\n\n```\n% vi\n```\n\n# Figure 16-1. A vi session.\n\n```c\nvoid TabReset(Tabs\
    \ tabs)\n{\n  int i;\n  for (i = 0; i < TAB_ARRAY_SIZE; i++)\n    tabs[i] = 0;\n\
    \  for (i = 0; i < MAX_TABS; i += 8)\n    TabSet(tabs, i);\n}\ntabs.c\nif (tmp\
    \ == Typecalloc(Char, length) == 0)\n  SysError(ERROR_SREALLOC);\n*sbufaddr tmp\
    \ = tmp;\nfor (i = k = 0; i < nrow; i++) {\n  k += BUF_HEAD;\n  for (j = BUF_HEAD;\
    \ j < old_max_ptrs; j++) {\n    memcpy(tmp, baset[k++], ncol);\n  }\n  tmp +=\
    \ ncol;\n}\n```\n\nThis will start up vi with an empty buffer. At this point,\
    \ you'll see a mostly blank screen. It is now in ‘command mode’, waiting for you\
    \ to do something. For a discussion of the various vi modes, see the Section 16.2.\
    \ In order to quit out of vi, type the following:\n\n:q\n\nAssuming that there\
    \ have been no changes to the file, this will cause vi to quit. If there have\
    \ been changes made, it will warn you that there have been changes and tell you\
    \ how to disregard them. Disregarding changes usually means appending an exclamation\
    \ point after the “q” like so:\n\n:q!\n\nThe exclamation point usually means to\
    \ force some action. We’ll discuss it and other key combinations in further details\
    \ later.\n\nYou can also start vi with a pre-existing file. For example:\n\n```\n\
    vi filename own\n```\n\n## 16.2 Modes\n\nvi operates in various modes, which are\
    \ used to accomplish tasks. When you first start vi, you are placed in command\
    \ mode. From this point, you can manipulate the text, search, quit, save, load\
    \ files, and more. This is intended only to be an introduction to the modes. For\
    \ a description of the various commands, see Section 16.7.\n\n### Command Mode\n\
    \nYou are first placed in command mode. From this mode, you cannot directly enter\
    \ text or edit what is already there. However, you can manipulate the text, move\
    \ around the file. \n\nPerhaps the most often used command in command mode is\
    \ changing to insert mode. This is accomplished by hitting the i command. The\
    \ cursor changes, and INSERT is displayed at the bottom of the screen (note that\
    \ this does not happen in all clones of vi). From there, all your keystrokes are\
    \ entered into the current buffer and are displayed to the screen. To get back\
    \ into command mode, hit the ESCAPE key.\n\nCommand mode is also where you move\
    \ around the file. On some systems, you can use the arrow keys to move around.\
    \ On other systems, you may need to use the more traditional keys of “hjkl”. Here\
    \ is a simple listing of how these keys are used to move around:\n\n- h move left\
    \ one character\n- j move down one character\n- k move up one character\n- l move\
    \ right one character\n\nSimply press a key to move. As you will see later, these\
    \ keys can be combined with a number to move much more efficiently.\n\nYou can\
    \ combine a number with the movement keys to move around several characters.\n\
    \nMany of the commands that you will use in command mode begin with a colon. For\
    \ example, quitting with q, as discussed earlier. The colon simply indicates that\
    \ it is a command, while the “q” tells vi to quit. Other commands are an optional\
    \ number, followed by a letter. These commands do not have a colon before them,\
    \ and are generally used to manipulate the text.\n\nFor example, deleting one\
    \ line from a file is accomplished by hitting dd. This will remove the line that\
    \ the cursor is on. Issuing the command 4dd would tell vi to remove the line that\
    \ the cursor is on and the three after that. In general, the number tells how\
    \ many times to perform the command.\n"
  mdcn: "\n\n## 第15章 归档文件\n\n上述所有语句都是等价的。在每情况下，归包都会解压到你的主目录下，而原始未压缩的归包保留在原地。\n\n如果你无法创建这些归包，那么解压它们有什么用呢？其实\
    \ tar 也能处理这一点。在大多数情况下，只需移除“-x”选项并将其替换为“-c”选项即可。\n\n```\n$ tar -cvzf filename.tar.gz\
    \ own\n```\n\n在此条命令中，-c 选项告诉 tar 创建一个归包，而 -z 选项则将生成的归包通过 gzip 运行压缩。`filename.tar.gz`\
    \ 是你想要创建的文件。\n\n指定“-f”选项并不总是必须的，但通常情况下这是一种良好的习惯。如果不指定它，tar 会将结果写入到标准输出，这通常用于将\
    \ tar 的输出通过管道传给另一个程序，如下：\n\n```\n$ tar -cv filename.tar | gpg --encrypt own\n\
    ```\n\n该命令创建了当前目录的非压缩归包，并将其通过管道传给 gpg，由 gpg 对 tar 包进行加密和压缩，使得除了知道密钥的人之外，其他人在现实中无法读取。\n\
    \n## 15.4 zip\n\n最后，有两个可以用于 zip 文件的工具。这些工具在 Windows 世界非常常见，因此 Linux 也有程序来处理它们。压缩程序被称为\
    \ zip(1)，而解压缩程序被称为 unzip(1)。\n\n```\n$ zip foo * own\n```\n\n这将创建 `foo.zip` 文件，其中包含当前目录下的所有文件。zip\
    \ 会自动添加 .zip 扩展名，因此不需要在文件名中包含它。你也可以递归处理当前目录，将任何存在的目录也一起压缩：\n\n```\nzip -r foo\
    \ * own\n```\n\n解压文件同样简单。\n\n```\nunzip foo.zip own\n```\n\n这将会提取 `foo.zip` 文件中的所有文件，包括归包中的任何目录。\n\
    \nzip 工具具有多个高级选项，可用于创建自解压归包、排除文件、控制压缩文件大小、打印将要发生的操作等。请查看 zip 和 unzip 的手册页（man\
    \ pages）以了解如何使用这些选项。\n\n## 第16章\n\n## Vi\n\nvi(1) 是标准的 Unix 文本编辑程序，虽然精通它不再像以前那样必不可少，但仍然是一个非常有价值的目标。目前有多个版本的\
    \ vi（克隆版本）可用，包括 vi、elvis、vile 和 vim。其中一个版本适用于任何版本的 Unix，以及 Linux。所有这些版本都包含相同的\
    \ Basic功能集和命令，因此学习其中一个克隆版本会让学习另一个变得容易。鉴于如今 Linux 发行版和 Unix 变体中包含了各种文本编辑器，许多人不再使用\
    \ vi。尽管如此，它仍然是 Unix 及其 Unix 兼容系统中最通用的文本编辑器。精通 vi 意味着当你坐在 Unix 机器前时，至少不应该不熟悉一个强大的文本编辑器。\n\
    \nvi 包含了许多强大的功能，包括语法高亮、代码格式化、强大的搜索替换机制、宏等。这些功能使得它对程序员、Web 开发者等等人特别有吸引力。系统管理员也会欣赏其实现的自动化以及与\
