    # 命令键


    如上所述，Emacs 使用 Control 和 Alt 组合作为命令。通常的惯例分别是 C-x 和 M-x。C-x 表示 Control+x，M-x 表示
    Alt+x。许多命令由一系列按键组成。例如，当你打开文件时，Emacs 会在缓冲区中提示其名称。


    从一个缓冲区切换到另一个缓冲区可以使用命令 C-x b。这会提示你输入缓冲区名称（缓冲区名称通常是你正在编辑的文件名），并会给出一个默认选择，按回车即可切换到该缓冲区。


    如果你想切换到默认以外的缓冲区，只需输入其名称。注意，你可以使用 Tab 补全缓冲区名称的前几个字母。


    ## 17.2 缓冲区


    在 Emacs 中，“缓冲区”（buffers）的概念至关重要。你打开的每个文件都会加载到自己的缓冲区中。此外，Emacs 还有几个特殊缓冲区，它们不包含文件用于其他用途。此类缓冲区通常以星号开头。例如，Emacs
    启动时显示的缓冲区是所谓的 *scratch* 缓冲区。*scratch* 缓冲区可以正常地输入文本，但这些文本在 Emacs 关闭时不会被保存。


    你还需要了解另一个特殊缓冲区，那就是命令行缓冲区。这个缓冲区只有一行，并且始终显示在屏幕上：它是 Emacs 窗口的最后一行，用于执行需要输入的命令。


    你可以通过 C-x C-b 获取缓冲区列表。此命令通常会将屏幕分成二，上半部分显示你工作的缓冲区，下半部分显示一个名为 *Buffer List* 的新缓冲区。该缓冲区包含了所有的缓冲区及其大小、模式，以及这些缓冲区正在访问（Emacs
    中是这样称的）的文件（如果有的话）。你可以通过 C-x l 消除这种分屏。


    > 注意：在 X 环境下，缓冲区列表也可以通过菜单栏中的 Buffer 菜单获取。


    ## 17.3 模式


