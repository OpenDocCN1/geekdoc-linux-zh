    # Modems


    Like LAN cards, modems can connect with various support options. Until recently,
    most modems were 8 or 16 bit ISA cards. With the efforts of Intel and motherboard
    manufacturers everywhere to finally kill off the ISA bus completely, it is common
    now to find that most modems are external modems that connect to a serial USB
