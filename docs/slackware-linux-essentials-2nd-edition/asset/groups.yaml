    If you typed /sbin/ifconfig -s, you would see a short summary of all interfaces.


    If you typed /sbin/ifconfig -h, you would see help information for the command.


    DHCP (Dynamic Host Configuration Protocol) is a means by which an IP address is
    assigned to a computer. The DHCP client in Linux is /sbin/dhcpcd. If you load
    /etc/rc.d.inet1 in your favorite editor, you will notice that /sbin/dhcpcd is
    called about midway through the script. dhcpcd will also track the amount of time
    left on the lease and will automatically contact the DHCP server with a request
    to renew the lease when necessary. DHCP can also control related information,
    such as what ntp server to use, what route to take, etc.


    Setting up DHCP on Slack is simple. Just run netconfig and select DHCP when offered.
    If you have more than one NIC and do not wish eth0 to be configured by DHCP, just
    edit the /etc/rc.d/rcinet1.conf file and change the related variable for your
    NIC to "YES".


    # Static IP


    Static IP addresses are fixed addresses that only change if manually told to.
    They are used in any case where an administrator doesn''t want the IP information
    to change, such for internal servers on a LAN, any server connected to the Internet,
    and networked routers. With Static IP addressing, you assign an address and leave
    it at that. Other machines know that you are always at that certain IP address
    and can contact you at that address always.


    /etc/rc.d/rcinet1.conf


