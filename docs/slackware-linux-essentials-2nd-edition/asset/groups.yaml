    # 7.3 Dual Booting


    Many users set up their computers to boot Slackware Linux and another operating
    system. We''ve described several typical dual boot scenarios below, in case you
    are having difficulty setting up your system.


    # Windows


    Setting up a computer with both MS Windows and Linux is probably the most common
    dual boot scenario. There are numerous ways you can setup the booting, this section
    will cover two.


    Often times setting up a dual boot system, a person will devise a perfect plan
    for where everything should go but mess up the installation order. It is very
    important to understand that operating systems need to be installed in a certain
    order for a dual boot setup to work. Linux always offers control over what, if
    anything, gets written to the Master Boot Record. Therefore, it''s advisable to
    install Linux last. Windows would be installed first, since it will always write
    its booter to the Master Boot Record, overwriting any entry Linux may have put
    there.'
