    ## 第 5 章 网络配置


    在这种情况下，我们的任务仅仅是在双引号之间填写正确的信息。这些变量在启动时会被 /etc/rc.d/rc.inet1 调用，用于设置网卡（nics）。对于每个网卡，只需输入正确的
    IP 信息，或者为 USE_DHCP 输入“YES”。Slackware 会按照发现网卡的顺序，使用此处此处处的信息启动接口。


    `DEFAULT_GW` 变量为 Slack 设置默认路由。在没有指定其他路由的情况下，你的计算机与互联网上其他计算机之间的通信必须通过该网关。如果你使用
    DHCP，通常不需要输入任何内容，因为 DHCP 服务器会指定要使用的网关。


    ### /etc/resolv.conf


    好了，你已经有了 IP 地址，有了默认网关，甚至可能还有一千万美元（分我们一点吧），但如果你无法将域名解析为 IP 地址，那这些又有什么用呢？没有人想在网络浏览器中输入
    72.9.234.112 来访问 www.slackbook.org。毕竟，除了作者之外，谁能记住那个 IP 地址呢？我们需要设置 DNS，但如何设置呢？这就是
    /etc/resolv.conf 发挥用场的地方。


    你可能已经在 /etc/resolv.conf 中有了正确的选项。如果你使用 DHCP 设置网络连接，DHCP 服务器应该会为你更新此文件。（从技术上说，DHCP
    服务器只是告诉 dhcpcd 写入什么，而它会照做。）但如果你需要手动更新 DNS 服务器列表，则编辑 /etc/resolv.conf。以下是一个示例：


    ```

    # cat /etc/resolv.conf

    nameserver 192.168.1.254

    search lizella.net

    ```


    第一行非常简单。`nameserver` 指令告诉我们查询哪些 DNS 服务器。必要时，这些总是 IP 地址。你可以列出任意数量的服务器。Slackware
    会乐意地一个接一个地检查，直到有一个返回匹配项为止。


    第二行稍微有点意思。`search` 指令为我们提供了一个在进行 DNS 请求时假设的域名列表。这允许我们仅通过 FQN（完全限定域名）的第一部分来连接到机器。例如，如果
    ‘slack.com’在你的搜索路径中，你只需将网络浏览器指向 http://store 即可访问 http://store.slack.com。


    ```

    # ping -c 1 store

    PING store.slack.com (69.50.233.153) : 56 data bytes

    64 bytes from 69.50.233.153 : icmp_seq=0 time=0.251 ms

    1 packets transmitted, 1 packets received, 0 packet loss

    round-trip min/avg/max = 0.251/0.251/0.251 ms

    ```


    ### /etc/hosts


    现在 DNS 正常工作了，但如果我们想绕过 DNS 服务器，或者为不在 DNS 中的机器添加一个 DNS 条目怎么办？Slackware 包含了一个良好的
    /etc/hosts 文件，它包含了 DNS 名称及其应匹配的 IP 地址本地列表。


    ```

    # cat /etc/hosts

    127.0.0.1 localhost localhost.localdomain

    192.168.1.101 redtail

    172.14.66.32 foobar.slack.com

    ```


    在这里你可以看到 localhost 的 IP 地址为 127.0.0.1（始终保留给 localhost），redtail 可以 192.168.1.101
    访问，而 foobar.slack.com 是 172.14.66.32。


    ## 5.4 PPP


    许多人仍然通过某种拨号连接到互联网。最常见的方法是 PPP，尽管 SLIP 偶尔仍在使用。设置你的系统与远程服务器进行 PPP 通信非常简单。我们包含了一些工具来帮助你设置。


    ### pppsetup


    Slackware 包含一个名为 pppsetup 的程序，用于配置你的系统使用你的拨号账户。它的外观和感觉与我们的 netconfig 程序相似。要运行该程序，请确保你已以
    root 身份登录。然后输入 `pppsetup` 运行。你应该看到类似这样的屏幕：


    程序将提出一系列问题，你需要为其提供相应的答案。例如你的设备、调制解器初始化字符串和 ISP 电话号码。某些项目会有默认值，在大多数情况下你可以接受它们。


    程序运行后，它会创建一个 `ppp-go` 程序和一个 `ppp-off` 程序。这两个程序分别用于启动和停止 PPP 连接。这两个程序位于 /usr/sbin
    中，需要 root 权限才能运行。


    ### /etc/ppp


    对于大多数用户来说，运行 pppsetup 就足够了。然而，可能会出现你想调整 PPP 守护进程使用的某些值。所有的配置信息都保存在 /etc/ppp 中。以下是不同文件的用途：


    - ip-down: 该脚本由 pppd 在 PPP 连接结束后运行。当 ppp 连接成功时，pppd 也会运行此脚本。请将任何你想在成功连接后运行的命令放在此文件中。

    - options: pppd 的通用配置选项。


