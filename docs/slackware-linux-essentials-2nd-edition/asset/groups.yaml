    This temporary file gets removed once the editor quits under normal conditions.
    This means that the temporary copy will still be around if crashes. When you go
    back to edit the file again, you will be prompted for action to take. In most
    cases, a large amount of your unsaved work can be recovered. elvis will also send
    you a mail (from Graceland, enough :) telling you that a backup copy exists.


