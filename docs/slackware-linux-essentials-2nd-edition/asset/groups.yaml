    然后你应该检查 slackware-$VERSION 目录根下的 CHECKSUMS.md5 文件（也在 /patches 目录或 patches 中）或发送给
    slackware-security 邮件列表的邮件进行对比。


    如果你有一个包含 md5sum 值的文件，可以使用 md5sum 的 -c 选项来源它。


    ```

    $ md5sum -c CHECKSUMS.md5

    ./ANNOUNCE.10_: OK

    ./BOOTING.TXT: OK

    ./COPYING: OK

    ./COPYRIGHT.TXT: OK

    ./CRYPTO_NOTICE.TXT: OK

    ./ChangeLog.txt: OK

    ./FAQ.TXT: FAILED

    ```


    如你所示，任何 md5sum 评估为正确的文件列为“OK”，而失败的文件被标记为“FAILED”（是的，这是对你智力的侮辱。你为什么要忍受我？）


    ## 第 15 章


    ## 归档文件


    ### 15.1 gzip


    gzip(1) 是 GNU 压缩程序。它接收单个文件并对其压缩。基本用法如下：


    - gzip filename


    生成的文件将命名为 filename.gz，并且通常比输入文件小。注意 filename.gz 将替换 filename。这意味着尽管存在压缩副本，但 filename
    将不再存在。普通的文本文件压缩效果良好，而 jpeg 图像、mp3 以及其他此类文件压缩效果不好，因为它们已经压缩过了。这种基本用法是最终文件大小和压缩时间的平衡。可以通过以下方式实现最大压缩：


    - gzip -9 filename


    这将花费更长时间来压缩文件，但结果将是 gzip 能达到的最小尺寸。在命令行选项中使用较低的值将使其压缩速度更快，但文件不会被得充分压缩。


    解压缩压缩包可以使用两个命令完成，它们实际上是同一个程序。gzip 会解压缩任何带有识别文件扩展名的文件。识别的扩展名可以是以下任何一个：.gz, -gz,
    .z, -z, 或 -Z。第一种方法是对调用 gunzip(1)，如下所示：


    - gunzip filename.gz


    这会在当前目录下留下 infile 的解压缩版本，并从文件名中剥离 .gz 扩展名。gzip 实际上是 gzip 的一部分，与 gzip -d 等同。因此，gzip
    经常被读作 gunzip，因为那个名字听起来更酷。:^)


    ### 15.2 bzip2


    bzip2(1) 是安装在 Slack Linux 上的另一种压缩程序。它使用与 gzip 不同的压缩算法，这带来了一些优势和缺点。bzip2 的主要优势是压缩后的文件。bzip2
    的压缩效果几乎总是优 gzip。在某些情况下，这可能导致文件大幅缩小。对于使用慢调制调器连接的人来说，这是一个巨大的优势。还要记住，当从公共 ftp 服务器下载软件时，下载
    .bz2 文件而不是 .gz 文件通常是良好的网络礼仪。bzip2 的缺点是压缩和解压缩所需比 gzip 更长。


    解压缩压缩包可以使用两个命令完成，它们实际上是同一个程序。gzip 会解压缩任何带有识别文件扩展名的文件。识别的扩展名可以是以下任何一个：.gz, -gz,
    .z, -z, 或 -Z。第一种方法是对文件调用 gunzip(1)，如下所示：


    - gunzip filename.gz


    ### 15.3 tar


    tar(1) 是 GNU 归档器。它可以将多个文件和目录合并成单个文件，称为 tar 包（tarball）。这对于分发软件和备份数据非常有用。tar 有许多选项，但常用的包括：


    - -c 创建新归档文件

    - -x 提取归档文件

    - -v 列出归档内容

    - -f 指定归档文件

    - -z 通过 gzip 过滤

    - -j 通过 bzip2 过滤


    例如，要创建一个目录的压缩 tar 归档，你可以使用：


    ```

    tar -czvf archive.tar.gz directory/

    ```


    要提取归档，你可以使用：


    ```

    tar -xzvf archive.tar.gz

    ```


    '
