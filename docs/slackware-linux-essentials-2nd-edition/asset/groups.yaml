    \ Slack package. The syntax is as follows:\n\n```\n# upgradepkg package_name\n\
    ```\n\nor\n\n```\n# upgradepkg old_package_name%new_package_name\n```\n\nupgradepkgg\
    \ works by first installing the new package and then removing the old package\
    \ so that old files are no longer around on the system. If the upgraded package\
    \ name has changed, use the percent sign syntax to specify the package (the one\
    \ that is installed) and the new package (the one you are upgrading to).\n\nIf\
    \ you pass the ROOT environment variable before upgradepkg, that path will be\
    \ used for the root directory. This is useful for setting up new drives for your\
    \ root directory. They will be mounted to /mnt or something other than /.\n\n\
    Just as with upgradepkg, you can specify several packages or use wildcards for\
    \ the package name. \n\n## 18.3 Making Packages\n\nMaking packages can be either\
    \ easy or difficult. Not all software packages are written by their programmers\
    \ to compile the same way. Many have compile time options that are not all included\
    \ in the packages. Perhaps you need some of this functionality; you'll need to\
    \ compile your own package then. Fortunately for many Slack packages, you can\
    \ find SlackBuild scripts in the source code.\n\n## SlackBuild Scripts\n\nSlackBuild\
    \ scripts are executable shell scripts that you run as root to configure, compile,\
    \ and create Slackware packages. You can freely modify these scripts in the source\
    \ directory and run them to create your own versions of the default Slackware\
    \ packages.\n\n## 18.4 Making Tags and Tagfiles (for setup)\n\nThe Slack setup\
    \ program handles installation of the software packages on your system. There\
    \ are files that tell the setup program which packages must be installed, which\
