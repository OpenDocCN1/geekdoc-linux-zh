    # 11.4 kill



    On occasion, programs misbehave and you’ll need to put them back in line. The
    program for this kind of administration is called kill(1), and it can be used
    for manipulating processes in several ways. The most obvious use of kill is to
    kill off a process. You’ll need to do this if a process has run away and is using
    up lots of system resources, or if you’re just sick of it.



    in order to kill off a process, you’ll need to know its PID or its name. To get
    the PID, use the ps command as discussed in the last section. For example, to
    kill off process 4747, you’d issue the following:


    ```

    $ kill 4747

    ```



    There’s another variety of the kill command called killall(1). This program does
    exactly what it says: it kills all the running processes that have a certain name.
    If you wanted to kill off all the running vim processes, you could type the following'
- md: '

    # Chapter 11 Process Control


    command:


    ```bash

    % killall vim

    ```


    Any and all vim processes you have running will die off. Doing this as root kill
    off all the vim processes running for all users. This brings up an interesting
    way to kick everyone (including yourself) off the system:


    ```bash

    # killall bash

    ```


    Sometimes a regular kill doesn''t get the job done. Certain processes will not
    die with a kill. You''ll need to use a more potent form. If pesky PID 4747 wasn''t
    responding to your kill request, you could do the following:


    ```bash

    % kill -9 4747

    ```


    That will almost certainly cause 4747 to die. You can do the same thing with killall.
    What this is is sending a different signal to the process. A regular kill sends
    a SIGTERM (terminate) signal to the process, which tells it to finish what it''s
    doing, clean up and exit. kill -9 sends a SIGKILL (kill) signal to the process,
    which essentially drops it. The process is not allowed to clean-up, and sometimes
    bad things like data corruption could occur by killing something with a SIGKILL.
    There''s a whole list of signals at your disposal. You can get a listing of signals
    by typing following:


    ```bash

    % kill -1

    1) SIGHUP 2) SIGANT 3) SIGQUIT 4) SIGILL

    5) SIGTRAP 6) SIGABRT 7) SIGBUS 8) SIGFPE

    9) SIGKILL 10) SIGUSR1 11) SIGSEGV 12) SIGUSR2

    13) SIGPIPE 14) SIGALRM 15) SIGTERM 17) SIGCHLD

    18) SIGCONT 19) SIGSTOP 20) SIGTSTP 21) SIGTIN

    22) SIGTOU 23) SIGURG 24) SIGCPU 25) SIGXFSZ

    26) SIGVTALRM 27) SIGPROF 28) SIGWINCH 29) SIGIO

    30) SIGPWR

    ```


    The number must be used for kill, while the minus names the leading “SIG” can
    be used with killall. Here''s another example:


    ```bash

    % killall -KILL vim

    ```


    A final use of kill is to restart a process. Sending a SIGHUP will cause most
    processes to re-read their configuration files. This is especially helpful for
    telling system processes to re-read their config files after editing.


