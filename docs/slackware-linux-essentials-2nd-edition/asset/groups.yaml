    # # Chapter 10

    Handling Files and Directories


    Linux aims to the most Unix-like it can be. Traditionally, Unix operating systems
    have command-line oriented. We do have a graphical user interface in Slackware,
    but the command-line is still the main level of control for the system. Therefore,
    it is important to understand some of the basic file management commands.

    The following sections explain the common file management commands and provide
    examples of how they are used. There are many other commands, but these will help
    you get started. Also, the commands are only briefly discussed here. You will
    find more detail in the accompanying man pages for each command.


    # ## 10.1 Navigation : ls, cd, and pwd


    ls

    This command lists files in a directory. Windows and DOS users will notice its
    similarity to the dir command. By itself, ls(1) will list the files in the current
    directory. To see what''s in your root directory, you could use these commands:


    ```

    % cd /

    % ls

    bin cdr dev home lost+found proc sbin tmp var

    boot cdrom etc lib mnt root suncd usr vmlinux

    ```'
  - '[PAGE 143]


    # Chapter 10 Handling Files and Directories


    The problem a lot of people have with that output is that you cannot easily tell
    what is a directory and what is a file. Some users prefer that is add a type identifier
    to each listing, like this:


    ```

    $ ls -FC

    bin/  cdr/  dev/  home/  lost+found/  proc/  sbin/  tmp/  var/

    boot/  cdrom/  etc/  lib/  mnt/  root/  sunced/  usr/  vmlinux

    ```


    Directories get a slash at the end of the name, executable files get an asterisk
    at the end of the name, and so on.


    ls can also be used to get other statistics on files. For example, to see the
    creation dates, owners, and permissions, you would look at a long listing:


    ```

    $ ls -l

