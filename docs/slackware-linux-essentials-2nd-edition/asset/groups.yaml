    free.


    # The other use of telnet


    Now that we have convinced you not to use the telnet protocol anymore to log into

    remote machine, we''ll show you a couple of useful ways to use telnet.


    You can also use the telnet command to connect to a host on a certain port.


    ```

    % telnet <hostname> [port]

    ```


    This can be quite handy when you quickly need to test a certain service, and you

    need full control over the commands, and you need to see what is going on.

    You can interactively test or use an SMTP server, a POP3 server, or an HTTP server,

    etc. this way.


