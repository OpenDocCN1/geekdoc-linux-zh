    # Chapter 13 Basic Network Commands


    It''s instances like these make ping a very useful day-to-day command. It provides
    a very quick way to see if a machine is up and connected to the network. The basic
    syntax is:


    +   * ping www.slackware.com


    There are, of course, several options that can be specified. Check the ping(1)
    page for more information.


    # 13.2 traceroute


    Slackware''s traceroute(8) command is a very useful network diagnostic tool. traceroute
    displays each a packet travels as it tries to reach its destination. You can see
    how many "hops" to the Slackware web site you reach with this command:


    ```

    traceroute www.slackware.com

    ```


    Each host will be displayed, along with the response times at each host. Here
    is an example:


    ```

    traceroute to www.slackware.com (204.216.27.13), 30 hops max, 40 byte packets

    | 1 zuul.tdn(192.168.1.1) 0.409 ms 1.032 ms 0.303 ms |

    | 2 207.171.227.254 (207.171.227.254) 18.218 ms 32.473 ms 32.433 ms |

