- md: "\nNote that there are several xinitrc.* files in /var/X11R6/lib/xinit that\
    \ correspond to various window managers and GUIs. You can use any of those, if\
    \ you like.\n\n## 6.4 xwmconfig\n\nFor years, Unix was used almost exclusively\
    \ as the operating system for servers, with the exception of Apple's programs\
    \ exclusively for high-powered professional workstations. Only the technically\
    \ inclined were likely to use a Unix-like operating system, and the user interface\
    \ reflected this fact. GUIs tended to be fairly bare-bones, designed to run a\
    \ few necessarily graphical applications like CAD programs and image renderers.\
    \ Most file and system management was commanded at the command line. Various vendors\
    \ (Sun Microsystems, Silicon Graphics, etc) were selling workstations with an\
    \ attempt to provide a cohesive 'look and feel', but the wide variety of GUI toolkits\
    \ in use by developers led inevitably to the dissolution of the desktop's uniformity.\
    \ A scrollbar might not look the same in different applications. Menus might appear\
    \ in different places. Programs would have different buttons and checkboxes. Colors\
    \ ranged widely, and were generally hard-coded in each toolkit. As the users were\
    \ primarily technical professionals, none of them mattered.\n\nWith the advent\
    \ of free Unix operating systems and the growing number and variety of graphical\
    \ applications, X has recently gained a wide desktop user base. Most users, of\
    \ course, are accustomed to the consistent look and feel provided by Microsoft's\
    \ Windows or Apple's macOS; the lack of such consistency in X-based applications\
    \ became a barrier to their wider acceptance. In response, two open source projects\
    \ have been undertaken: The K Desktop Environment, or KDE, and the GNU Network\
    \ Object Model Environment, known as GNOME. Each has a variety of applications,\
    \ from taskbars to file managers and office suites, written with the same GUI\
    \ toolkit and tightly integrated to provide a uniform, consistent desktop.\n\n\
    The differences in KDE and GNOME are generally fairly subtle. They each look different\
    \ from the other, because each uses a different GUI toolkit. KDE is based on the\
    \ Qt library from Troll AS, while GNOME uses GTK, a toolkit originally developed\
    \ for The GNU Image Manipulation Program (or The GIMP, for short). As separate\
    \ projects, KDE and GNOME each have their own designers and programmers, with\
    \ different development styles and philosophies. The result in each case, however,\
    \ has been fundamentally the same: a consistent, tightly integrated desktop environment\
    \ and application collection. The functionality, usability, and sheer prett of\
    \ both KDE and GNOME rival anything available on other operating systems.\n\n\
    The best part, though, is that these advanced desktops are free. This means you\
    \ can have either or both (yes, at the same time). The choice is yours.\n\nIn\
    \ addition to the GNOME and KDE desktops, Slack includes a large collection of\
    \ window managers. Some are designed to emulate other operating systems, some\
    \ for customization, others for speed. There’s quite a variety. Of course you\
    \ can install as many as you want, play with them all, and decide which you like\
    \ the most.\n\nTo make desktop selection easy, Slack also includes a program called\
    \ xwmconfig that can be used to select a desktop or window manager. It is run\
    \ like so:\n\n```\n% xwmconfig\n```\n\n## Figure 6-5. Desktop Configuration with\
    \ xorgconfig\n\n-SELECT DEFAULT WINDOW MANAGER FOR X -\nPlease select the default\
    \ window manager to use with the X Window System. This will define the style of\
    \ graphical user interface the computer uses. KDE and GNOME provide the most features.\
    \ People with Windows or MacOS experience will find either easy to use. Other\
    \ window managers are easier on system resources, or provide other unique features.\n\
    \n| | |\n| :--- |\n| xinitrc.kde | KDE: K Desktop Environment |\n| xinitrc.gnome\
    \ | GNU Network Object Model Environment |\n| xinitrc.xfce | The Cholesterol Free\
    \ Desktop Environment |\n| xinitrc.lightbox | The blackbox window manager |\n\
    | xinitrc.fluxbox | The fluxbox window manager |\n| xinitrc.wmaker | WindowMaker\
    \ |\n| xinitrc.fwwm2 | F(?) Virtual Window Manager (version 2.xx) |\n| xinitrc.fwwm95\
    \ | FVWM2 with a Windows look and feel |\n| xinitrc.twm | Tab Window Manager (very\
    \ basic) |\n\nYou'll be given a list of all the desktops and window managers installed.\
    \ Just select the one you want from the list. Each user on your system will need\
    \ to run this program, since different users can use different desktops, and not\
    \ everyone will want the default one you selected at installation.\n\nThen just\
    \ start up X, and you're good to go.\n\n## 6.5 xdm\n\nAs Linux becomes more and\
    \ more useful as a desktop operating system, many users find it desirable for\
    \ the machine to boot straight into a graphical environment. For this, you will\
    \ need to tell Slack to boot straight into X, and assign a graphical login manager.\
    \ Slack ships with three graphical login tools, xdm(1), kdm, and gdm(1).\n\nxdm\
    \ is the graphical login manager shipped with the X.org system. It's ubiquitous,\
    \ but not as fully features as alternatives. kdm is the graphical login manager\
    \ shipped with KDE, The K Desktop Environment. Finally, gdm is the login manager\
    \ shipped with GNOME. Any of the choices will allow you to log in as any user,\
    \ and choose what desktop you wish to use.\n\nUnfortunately, Slack doesn't include\
    \ a nice program like xwmconfig for choosing login manager to use, so if all three\
    \ are installed you may have to do some editing to choose your preference. But\
    \ first, we'll discuss how to boot into a graphical environment.\n\nIn order to\
    \ make a graphical environment, we just change the 3 to 4.\n\nNow Slack will boot\
    \ into whatever login manager you've chosen. So, how do we choose managers? There\
    \ are a few ways to do this, and I'll explain them after we look at rc.4.\n\n\
    As you can use, rc.4 first checks to see if gdm is executable, and if it runs.\
    \ Second on the list is kdm, and finally xdm. One of choosing a login manager\
    \ is to simply remove the ones you don’t wish to use removepegkg. You can find\
    \ out more about removepegkg in Chapter 18.\n\nAdditionally, you can execute the\
    \ permission from those files that you don’t want to use. We discuss chmod in\
    \ Chapter 9.\n\nFinally, you can comment out the lines for the login manager you\
    \ don’t want to use.\n\n```\n# Try to use gnome’s gdm session manager:\n# if [\
    \ -x /usr/bin/gdm ]; then\n# exec /usr/bin/gdm -nodaemon\n# fi\n```\n\n```\n#\
    \ Not there? OK, try to use KDE’s kdm session manager:\nif [ -x /opt/kde/bin/kdm\
    \ ]; then\nexec /opt/kde/bin/kdm -nodaemon\nfi\n```\n\n```\n# If all you have\
    \ is XDM, I guess it will have to do:\nif [ -x /usr/X1R6/bin/xdm ]; then\nexec\
    \ /usr/X1R6/bin/xdm -nodaemon\nfi\n```\n\n```\nif [ -x /usr/X11R6/bin/xddm ];\
    \ then\n  exec /usr/X11R6/bin/xddm -nodaemon\nfi\n```\n\nAny lines preceded by\
    \ the hash mark (#) are considered comments and the shell silently passes them.\
    \ Thus, even if gdm is installed and executable, the shell (in this case bash)\
    \ won't bother checking for it.\n"
  mdcn: "\n\n请注意，/var/X11R6/lib/xinit 下有多个 `xinitrc.*` 文件，它们分别对应不同的窗口管理器和图形界面。如果你喜欢的话，可以使用其中任何一个。\n\
    \n## 6.4 xwmconfig\n\n多年来，Unix 几乎专门用作服务器操作系统，除了苹果专门为高性能专业工作站开发的程序外。只有具有技术倾向的人才可能可能使用类\
    \ Unix 操作系统，用户界面也反映了这一事实。图形界面（GUI）往往非常简陋，旨在运行少数必要的图形化应用程序，如 CAD 程序和图像渲染器。大多数文件和系统管理都是通过命令行完成的。不同的供应商（如\
    \ Sun Microsystems、Silicon Graphics 等）在销售工作站时，尝试提供统一的“外观和感受”，但开发者使用的 GUI 工具包极其多样化，不可避免地导致了桌面统一性的瓦解。滚动条在不同的应用程序中看起来可能不同。菜单可能出现在不同的位置。程序会有不同的按钮和复选框。颜色范围很大，且通常在每个工具包中都是硬编码的。由于用户主要是技术专业人员，这些细节并不重要。\n\
    \n随着自由 Unix 操作系统的出现以及图形化应用程序数量和种类的增加，X 最近获得了了广泛的桌面用户群。当然，大多数用户习惯了微软 Windows 或苹果\
    \ macOS 提供的一致的外观和感受；X 应用程序中缺乏这种一致性成为了它们被广泛接受的障碍。作为回应，启动了两个开源项目：K 桌面环境（简称 KDE）和\
    \ GNU 网络对象模型环境（称为 GNOME）。它们都包含各种应用程序，从任务栏到文件管理器和办公套件，这些程序都是用相同的 GUI 工具包编写，并紧密集成在一起，以提供一个统一、一致的桌面。\n\
    \nKDE 和 GNOME 之间的差异通常非常微妙。它们看起来不同，是因为它们各自使用了不同的 GUI 工具包。KDE 基于来自 Troll AS 的 Qt\
    \ 库，而 GNOME 使用 GTK，GTK 是最初为“自由 GNU 图像处理程序”（或简称为 GIMP）开发的工具包。作为独立的项目，KDE 和 GNOME\
    \ 各自拥有自己的设计师和程序员，具有不同的开发风格和哲学。然而，每种情况的结果在根本上都是相同的：一个一致、紧密集成的桌面环境和应用程序集合。KDE 和\
    \ GNOME 的功能性、易用性以及纯美感足以与任何其他操作系统上的可用产品媲美。\n\n最棒的部分是，这些高级桌面是免费的。这意味着你可以选择其中一个或两者都要（是的，可以同时拥有）。选择权在于你。\n\
    \n除了 GNOME 和 KDE 桌面之外，Slack 还包含了大量的窗口管理器集合。有些是为了模拟其他操作系统设计的，有些是为了自定义，有些则是为了速度。种类非常多。当然，你可以安装尽可能多，尽情尝试它们，然后决定你最喜欢哪一个。\n\
    \n为了方便选择桌面，Slack 还包含一个名为 `xwmconfig` 的程序，用于选择桌面或窗口管理器。它的运行方式如下：\n\n```\n% xwmconfig\n\
    ```\n\n## 图 6-5. 使用 xwmconfig 配置桌面\n\n-为为 X 选择默认窗口管理器 -\n请选择与 X 窗口系统一起使用的默认窗口管理器。这将定义计算机使用的图形用户界面样式。KDE\
    \ 和 GNOME 提供的功能最多。有 Windows 或 MacOS 经验的人会发现其中任何一个都很容易使用。其他的窗口管理器对系统资源的消耗较小，或者提供其他独特特性。\n\
    \n| | |\n| :--- | :--- |\n| xinitrc.kde | KDE: K 桌面环境 |\n| xinitrc.gnome | GNU\
    \ 网络对象模型环境 |\n| xinitrc.xfce | 无胆固桌面环境 |\n| xinitrc.lightbox | blackbox 窗口管理器\
    \ |\n| xinitrc.fluxbox | fluxbox 窗口管理器 |\n| xinitrc.wmaker | WindowMaker |\n|\
    \ xinitrc.fwwm2 | F(?) 虚拟窗口管理器 (版本 2.xx) |\n| xinitrc.fwwm95 | 具有 Windows 外观和感受的\
    \ FVWM2 |\n| xinitrc.twm | 窗口管理器 (非常基础) |\n\n你将得到一个所有已安装桌面和窗口器的列表。只需从列表中选择你想要的一个即可。系统上的每个用户都需要运行此程序，因为不同的用户可以使用不同的桌面，而且并不是每个人都想用你安装时选择的默认桌面。\n\
    \n然后只需启动 X，你就可以使用了。\n\n## 6.5 xdm\n\n随着 Linux 作为桌面操作系统变得越来越有用，许多用户发现机器直接启动到图形环境是理想的。为了这一点，你需要告诉\
    \ Slack 直接启动到 X，并分配一个图形登录管理器。Slack 自带了三个图形化登录工具：xdm(1)、kdm 和 gdm(1)。\n\nxdm 是随\
    \ X.org 系统一起分发的图形登录管理器。它无处不在，但功能没有替代品丰富。kdm 是随 KDE（K 桌面环境）一起分发的图形登录管理器。最后，gdm\
    \ 是随 GNOME 分发的登录管理器。任何一种选择都允许你以任何用户身份登录，并选择你想使用的桌面。\n\n遗憾的是，Slack 并没有包含一个像 `xwmconfig`\
    \ 那样的漂亮程序来选择使用的登录管理器，所以如果三个都安装了，你可能需要进行一些编辑来选择你的喜好。但首先，我们将讨论如何启动到图形环境。\n\n为了创建一个图形环境，我们只需将\
    \ 3 改为 4。\n\n现在 Slack 将启动到你选择的任何登录管理器。那么，我们如何选择管理器呢？有几种方法可以实现，我将在查看 rc.4 之后解释它们。\n\
    \n正如你所见，rc.4 首先检查 gdm 是否可执行。列表中的第二个是 kdm，最后是 xdm。选择登录管理器的方法之一是直接移除你不需要的（removepegkg）。你可以在第\
    \ 18 章找到更多关于 removepegkg 的信息。\n\n此外，你可以修改你不需要的文件的权限。我们在第 9 章讨论过 chmod。\n\n最后，你可以注释掉你不需要的登录管理器行。\n\
    \n```\n# 尝试使用 gnome 的 gdm 会话管理器：\n# if [ -x /usr/bin/gdm ]; then\n# exec /usr/bin/gdm\
    \ -nodaemon\n# fi\n```\n\n```\n# 如果那里没有？好吧，尝试使用 KDE 的 kdm 会话管理器：\nif [ -x /opt/kde/bin/kdm\
    \ ]; then\nexec /opt/kde/bin/kdm -nodaemon\nfi\n```\n\n```\n# 如果你只有 XDM，我想它只能用了：\n\
    if [ -x /usr/X1R6/bin/xdm ]; then\nexec /usr/X1R6/bin/xdm -nodaemon\nfi\n```\n\
    \n```bash\nif [ -x /usr/X11R6/bin/xddm ]; then\n  exec /usr/X11R6/bin/xddm -nodaemon\n\
    fi\n```\n\n任何以井号（#）开头的行都被视为注释，shell 会静静地跳过它们。因此，即使 gdm 已安装且可执行，shell（在此例中为 bash）也不会去检查它。\n\
    \n"
