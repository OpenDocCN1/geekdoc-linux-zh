    < Select > < Continue >


    The target section is where your other (non-swap) partitions are formatted and
    mapped to filesystem mount points. A list of the partitions on your hard disk
    will be displayed. For each partition, you will be given the option of whether
    to format that partition or not. Depending on the kernel used, you can choose
    between reiserfs (the default), ext3, ext2, jfs, and xfs. Most people use either
    reiserfs or ext3. In the near future we may see support for reiserfs4 slip in.


    The first option in the target section is the selection of a partition on which
    to install your root (/) filesystem. After that, you will be able to map other
    partitions to files as you choose. (For instance, you may want your third partition,
    say /dev/hda3, to be your home filesystem. This is just an example; map the partitions
    as you see fit.


    # SOURCE


    The source section is where you select the source media from which you are installing
    Slackware. Currently there are four sources to choose from. These are CD-ROM,
    NFS, or a premounted directory.'
