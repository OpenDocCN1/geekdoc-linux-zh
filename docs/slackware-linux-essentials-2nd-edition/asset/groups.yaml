    darkstar:/bin$ cd usr\nbash: cd: usr: No such file or directory\ndarkstar:/bin$\
    \ cd /usr\ndarkstar:/usr$ ls\nbin\ndarkstar:/usr$ cd bin\ndarkstar:/usr/bin$\n\
    ```\n\nNotice without the preceding slash, it tries to change to a directory in\
