    但在没有虚拟终端的情况下该怎么办？幸运的是，slackware 包含一个非常漂亮的屏幕管理器，恰恰地命名为 screen。screen 是一个具有类似虚拟终端功能的终端模拟器。执行
    screen 会显示一段简短的介绍，然后输出到终端。与标准的虚拟终端不同，screen 有它自己的命令。所有 screen 命令都以 Ctrl+A 键组合开头。例如，Ctrl+A+C
    将创建一个新的终端会话。Ctrl+A+P 切换到上一个终端。


    screen 还支持分离（detach）和重新连接（attach）screen 会话，这对于通过 ssh 和 telnet 进行远程会话特别有用（稍后详细介绍）。Ctrl+A+D
    将分离当前运行的 screen。执行 `screen -r` 将列出所有可能重新连接的运行 screen 会话。


