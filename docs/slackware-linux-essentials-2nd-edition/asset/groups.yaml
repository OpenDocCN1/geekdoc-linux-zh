  mdcn: "\n\n## 第 3 章 安装\n\n现在我们使用 **n** 命令创建分区：\n\n```\nCommand (m for help): **n**\n\
    Command action\n  e extended\n  p primary partition (1-4)\n**p**nPartition number\
    \ (1-4):**1**\nFirst cylinder (0-1060, +size or +sizeM or +sizeK (0-1060, default\
