    # Chapter 16 Vi


    ters at a time. For example, 10k would move up ten lines on the screen.


    Command mode can also be used to cut and paste, insert text, and read other files
    into the current buffer. Copying text is accomplished with the y key (y stands
    for yank). Copying the current line is done by typing yy, which can be prefixed
    with a number to yank more lines. Then, move to the location for the copy and
    hit p. The text is pasted on the line after the current one.


    Cutting text is done by typing dd, and p can be used to paste the text back into
    the file. Reading from another file is a simple procedure. Just type tr, followed
    by a space and the file name that contains the text to be inserted. The file''s
    contents will be pasted into the current buffer on the line after the cursor.
    More sophisticated vi clones even contain filename completion similar to the shell''s.


    The final use will be covered is searching. Command mode allows for simple searching,
    as well as complicated search-and-replace commands that make use of a powerful
    version of regular expressions. A complete discussion of regular expressions is
    beyond the scope of this chapter, so this section will only cover simple means
    of searching.


    A simple search is accomplished by hitting the / key, followed by the text that
    you are searching for. vi will search forward from the cursor to the end of the
    file for a match, stopping when it finds one. Note that inexact matches will cause
    vi to stop as well. For example, a search for "the" will cause vi to stop on "then",
    "therefore", and so on. This is because all of those words match.


    After vi has found the first match, you can continue on the next match simply
    by hitting the / key followed by enter. You can also search backwards through
    the file by replacing the slash with the ? key. For example, searching backwards
    through the file for "the" would be accomplished by typing ?the.


    # Insert Mode


    Inserting and replacing text is accomplished in insert mode. As previously discussed,
    you can get into insert mode by hitting i from command mode. Then, all text that
    you type is entered into the current buffer. Hitting the ESCAPE key takes you
    back to command mode.


    Replacing text is accomplished in several ways. From command mode, hitting r will
    allow you to replace the one character underneath the cursor. Just type the new
    character and it will replace the one under the cursor. You will then be immediately
    placed back in command mode. Hitting R allows you to replace as many characters
    as you''d like. To get out of this replacement mode, just hit ESCAPE to go back
    into command mode.


    There is yet another way to toggle between insertion and replacement. Hitting
    the INSERT key from command mode will take you into insert mode. Once you are
    in insert mode, the keyboard''s INSERT key serves as a toggle between insert and
    replace. Hitting it once will allow you to replace. Hitting it once more will
    again allow you to insert text.


    # 16.3 Opening Files


    vi allows you to open files from command mode as well as specifying a file on
    the command line to open. To open the file /etc/lilo.conf:


    ```

    :e etc/lilo.conf

    ```


    If you have made changes to the current buffer without saving, vi will complain.
    You can still open the file without saving the current buffer by typing :e!, followed
    by a space and the filename. In general, vi''s warnings can be suppressed by following
    the command with an exclamation mark.


    If you want to reopen the current file, you can do so simply by typing :e!. This
    is particularly useful if you have somehow messed up the file and want to reopen
    it.


    Some vi clones (for example, vim) allow for multiple buffers to be open at the
    same time. For example, to open the file 09-vi.sgml in my home directory while
    another file was open, I would type:


    ```

    :split ~/09-vi.sgml

    ```


    The new file is displayed on the top half of the screen, and the old file is displayed
    in the bottom half of the screen. There are a lot of commands that manipulate
    the split screen, and many of these commands start to resemble something out of
    Emacs. The best place to look up these commands would be the man page for your
    vi clone. Note that many clones do not support the split-screen idea, so you might
    not be able to use it at all.


    # 16.4 Saving Files


    There are several ways to save files in vi. If you want to save the current buffer
    to the file randomness, you would type:


    ```

    :w randomness

    ```


    Once you''ve saved the file once, saving it again is as simple as typing :w. Any
    changes will be written out to the file. After you''ve saved the file, you are
    dumped back into command mode. If you want to save the file and quit vi (a very
    common operation), you would type :wq. That tells vi to save the current file
    and quit back to the shell.


    On occasion, you want to save a file that is marked as read-only. You can do this
    by adding an exclamation point after the write command, like so:


    ```

    :w!

    ```


    However, there will still be instances where you cannot write the file (for example,
    you are attempting to edit a file that is owned by another user). When this happens,
    vi will tell you that it cannot save the file. If you really want to edit the
    file, you''ll have to come back and edit it as root (preferably) the owner of
    that file.


    # 16.5 Quitting vi


    One way to quit vi is through :wq, which will save the current buffer before quitting.
    You can also quit without saving with :q or (more commonly): :q!. The latter is
    used when you''ve modified the file but not wish to save any changes to it.


    On occasion, your machine might crash or vi might crash. However, both elvis and
    vim will take steps to minimize the damage to any open buffers. Both editors save
    the open buffers to a temporary file on occasion. This file is usually named similarly
    to the open file, but with a dot at the beginning. This makes the file hidden.


    This temporary file gets removed once the editor quits under normal conditions.
    This means that the temporary copy will still be around if crashes. When you go
    back to edit the file again, you will be prompted for action to take. In most
    cases, a large amount of your unsaved work can be recovered. elvis will also send
    you a mail (from Graceland, enough :) telling you that a backup copy exists.


    # 16.6 Configuration


    Your vi clone of choice can be configured in several ways.


    A variety of commands can be entered in command mode to set up vi just you like
    it. Depending on your editor, you can enable features to make programming easier
    (like syntax highlighting, auto-indenting, and more), set up macros to automate
    tasks, enable textual substitutions, and more.


    Almost all of these commands can be put into a configuration file in your home
    directory. elvis expects a .exrc file, vim expects a .vimrc file. Most of the
    setup commands that can be entered in command mode can be placed in the configuration
    file.


    Discussing all these options and the differences between the editors is quite
    an involved subject. For more information, check out the main page or web site
    for your preferred editor. Some editors (like vim) have extensive help within
    the editor that can be accessed with the help command, or something similar. You
    can also check out the O''Reilly book Learning the vi Editor by Lamb and Robbins.


    Many common programs in Linux will load a text file in vi by default. For example,
    your crontabs will start up by default. If you do not like vi and would like another
    editor to be started instead, all you need to do is set the VISUAL environment
    variable to the editor you prefer. For information on setting environment variables,
    see the section called Environment Variables in Chapter 8. If you want to make
    sure that your editor will be the default every time you login, add the VISUAL
    setting to your .bash_profile or .bashrc.


    # 16.7 Vi Keys


    This section is a quick reference of many common vi commands. Some of these were
    discussed earlier in the chapter, while many will be new.


    Table 16-1. Movement


    | Operation | Key |

    |--- | --- |

    | left, down, up, right | h, j, k, l |

    | To the end of the line | $ |

    | To the beginning of the line | ^ |

    | To the end of the file | G |

    | To the beginning of the file | :1 |

    | To line 47 | :47 |


    Table 16-2. Editing


    | Operation | Key |

    | --- | --- |

    | Removing a line | dd |

    | Removing five lines | 5dd |

    | Replacing a character | r |

