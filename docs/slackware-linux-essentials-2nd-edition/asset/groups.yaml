    # Chapter 9

    Filesystem Structure


    We have already discussed the directory structure in Slackware Linux. By this
    point, you should be able to find files and directories that you need. But there
    is more to the filesystem than just the directory structure.


    Linux is a multiuser operating system. Every aspect of the system is multiuser,
    even the filesystem. The system stores information like who owns a file and who
    can read it. There are other unique parts about the filesystems, such as links
    and NFS mounts. This section explains these, as well as the multiuser aspects
    of the filesystem.


    # 9.1 Ownership


    The filesystem stores ownership information for each file and directory on the
    system. This includes what user and group own a particular file. The easiest way
    to see this information is with the ls command:


    ```

    % ls -l /usr/bin/wc

    -rwxr-xr-x 1 root 7368 Jul 30 1999 /usr/bin/wc

    ```


    We are interested in the third and fourth columns. These contain the username
    and group name that owns this file. We see that the user “root”and the group “bin”own
    this file.


    We can easily change the file owners with the chown(1) (which means ‘change owner’)
    and chgrp(1) (which means ‘change group’) commands. To change the file owner to
    daemon, we would use chown:'
  - '[PAGE 133]


    # Chapter 9 Filesystem Structure


    ```

    # chown daemon /usr/bin/wc

    ```


    To change the group owner to “root”, we would use chgrp:


    ```

    # chgrp root /usr/bin/wc

    ```


    We can also use chown to specify the user and group owners for a file:


    ```

    # chown daemon:root /usr/bin/wc

    ```


    In the above example, the user could have used a period instead of a colon. The
    result would be the same; however, the colon is considered better form. Use of
    the period is deprecated and may be removed from future versions of chown to allow
    usernames with periods in them. These usernames tend to be very popular with Windows
    Exchange Exchange Servers and are encountered commonly in email addresses such
    as: mr.jones@example.com. In slackware, administrators are advised to stay away
    from usernames because some scripts still use the period to indicate the user
    and group of a file or directory. In our example, chmod would interpret mr.jones
    as user “mr” and group “Jones”.


    File ownership is a very important part of using a Linux system, even if you are
    the only user. You sometimes need to fix ownerships on files and device nodes.


    # 9.2 Permissions


    Permissions are the other important part of the multiuser aspects of the filesystem.
    With these, you can change who can read, write, and execute files.


    The permission information is stored as four octal digits, each specifying a different
    set of permissions. There are owner permissions, group permissions, and world
    permissions. The fourth octal digit is used to store special information such
    as set user ID, set group ID, and the sticky bit. The octal values assigned to
    the permission modes (they also have letters associated with them that are displayed
    by programs such as is and can be used by chmod:'
  - '[PAGE 134]


    # Table 9-1. Octal Permission Values


    | Permission Type | Octal Value | Letter Value |

    |---|---|---|

    | ‘sticky” bit | 1 | t |

    | set user ID | 4 | s |

    | set group ID | 2 | s |

    | read | 4 | r |

    | write | 2 | w |

    | execute | 1 | x |


    You add the octal values for each permission group. For example, if you want the
    group permissions for “read” and “write”, you would use “6” in the group portion
    of the permission information.


    bash’s permissions are:


    ```

    $ ls -1 /bin/bash

    -rwxr-xr-x 1 root      bin 477692 Mar 21 19:57 /bin/bash

    ```


    The first dash would be replaced with a ‘d’ if this was a directory. The three-permission
    groups (owner, group, and world) are displayed next. We see that the owner has
    read, write, and execute permissions (rwx). The group has only read and execute
    (r-x).


    How would we set permissions on another file to resemble bash’s? First, let’s
    make an example file:


    ```

    $ touch /tmp/example

    $ ls -l /tmp/example

    -rw-rw-r-- 1 david      users 0 Apr 19 11:21 /tmp/example

    ```


    We will use chmod(1) (which means ‘change mode’) to set the permissions on the
    example file. Add the octal numbers for the permissions you want. For the owner
    to have read, write, and execute, we would have a value of 7. Read and execute
    would have 5. Run those together and pass them to chmod like this:


    ```

    $ chmod 755 /tmp/example

    ```'
