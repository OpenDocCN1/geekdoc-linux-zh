    SMB is an authenticated protocol, meaning you must supply a correct username and
    password in order to use this service. We tell the samba server that usernames
    and passwords are valid with the smbpasswd command. smbpasswd takes a couple of
    common switches to tell it to add traditional users, or add machine users (SMB
    requires that you add the computers'' NETBIOS names as machine users, restricting
    what computers can authenticate from).


    Adding a user to the /etc/samba/private/smbpasswd file.

