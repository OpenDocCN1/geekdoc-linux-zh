- md: "\nThe first four items can be set with the chfn command. It stores those values\
    \ in the /etc/passwd file. To change the information in your .plan or .project\
    \ file, just edit them with your favorite editor. They must reside in your home\
    \ directory and must be called .plan and .project.\n\nMany users finger their\
    \ own account from a remote machine to quickly see if they have new email. Or,\
    \ you can see a user's plan or current project.\n\nLike many commands, finger\
    \ has options. Check the man page for more information on what special options\
    \ you can use.\n\n## 13.5 telnet\n\nSomeone once stated that telnet(1) was the\
    \ coolest thing he had ever seen on computers. The ability to remotely log in\
    \ and do stuff on another computer is what separates Unix and Unix-like operating\
    \ systems from other operating systems.\n\ntelnet allows you to log in a computer,\
    \ just as if you were sitting at the terminal. Once your username and password\
    \ are verified, you are given a shell prompt. From here, you can do anything requiring\
    \ a text console. Compose email, read newsgroups, move files around, and so on.\
    \ If you are running X and you telnet to another machine, you can run X programs\
    \ on the remote computer and display them on yours.\n\nTo login to a remote machine,\
    \ use this syntax:\n\n```\ntelnet <hostname>\n```\n\nIf the hosts responds, you\
    \ will receive a login prompt. Give it your username and password. That's it.\
    \ You are now at a shell. To quit your telnet session, use either the exit command\
    \ or the logout command.\n\n> **Warning:** telnet does not encrypt the information\
    \ it sends. Everything is sent in plain text, even passwords. It is not advisable\
    \ to use telnet over the Internet. Instead, consider the Secure Shell. It encrypts\
    \ all traffic and is available free.\n\n## The other use of telnet\n\nNow that\
    \ we have convinced you not to use the telnet protocol anymore to log into remote\
    \ machine, we'll show you a couple of useful ways to use telnet.\n\nYou can also\
    \ use the telnet command to connect to a host on a certain port.\n\n```\n% telnet\
    \ <hostname> [port]\n```\n\nThis can be quite handy when you quickly need to test\
    \ a certain service, and you need full control over the commands, and you need\
    \ to see what is going on. You can interactively test or use an SMTP server, a\
