    ## mail


    mail is a command line driven client. It is very primitive and offers pretty much
    nothing in the way of user interfaces. However, mail is handy for times you need
    to quickly script something. Note that mail creates symbolic links to mailx at
    /usr/bin/mail. Any of these three commands executes the same program. In fact,
    you will likely see mailx referred to.


    The basic command line is:


    ```

    mailx <subject> <addr>

    ```


    mailx reads the message body from standard input. So you can type text and hit
    Ctrl+D when finished with the message. Here is an example of mailing a file to
    another person:


    ```

    cat random.c | mailx -s "Here’s function" df@example.net

    ```


    The man page explains more of what mail can do, so you will probably want to have
    a look at that before using it.


    ### 1.8 Browsers


    The first thing people think about when they hear the word Internet is ‘surfing
    the net’. Or looking at websites using a web browser. This is probably by far
    the most popular use of the Internet for the average user. Slackware provides
    graphical web browsers in the ‘X’ series, as well as text mode browsers in the
    ‘N’ series. We’ll take a quick look at some of the most common options below.


    ## lynx


    lynx is a text-based web browser. It is a very quick way of looking up something
    on the Internet. Sometimes graphics get in the way if you know exactly what you’re
    after. To start lynx, just type lynx at the prompt:


    You may specify a site for lynx to open:


    ```

    lynx http://www.slackware.com

    ```


    lynx prints the command keys and what they do at the bottom of the screen. The
    up and down arrow keys move around the document, Enter selects the highlighted
    link, and the left arrow goes back to the previous page. Typing d will download
    the currently selected file. The g command brings up the Go prompt, where you
    can give lynx a URL to open.


    There are many other commands in lynx. You can either consult the man page, or
    type h to get the help screen for more information.


