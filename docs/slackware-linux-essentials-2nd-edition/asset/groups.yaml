    % screen -r

    有几个可用的 screen：

    1212.pts-1.redtail (Detached)

    1195.pts-1.redtail (Detached)

    1225.pts-1.redtail (Detached)

    17146.pts-1.sanctuary (Dead ???)

    使用 ''screen -wipe'' 删除无效会话。

    输入 ''screen [-d] -r [pid].tty.host'' 来恢复其中一个。

    ```


    运行 `screen -r 1212` 将重新连接到第一个会话。我之前提到过这对远程会话有多用。如果我通过 ssh 登录到远程 slackware 服务器，而连接由于意外情况（如本地断电）而中断，我当时正在做的任何操作都会立即持续，这对你的服务器来说可能是糟糕的。使用
    screen 通过在连接掉线时分离会话来防止这种情况。一旦连接恢复，我就可以重新连接到我的 screen 会话并从离开的地方继续。


    ## 第 9 章 文件系统结构


    我们已经讨论了 Slackware Linux 中的目录结构。到目前，你应该能够找到你所需的文件和目录。但文件系统不仅仅是目录结构。


    Linux 是一个多用户操作系统。系统的每个方面都是多用户的，甚至文件系统也是。系统存储信息如谁拥有文件以及谁可以读取。文件系统还有其他独特部分，例如链接和
