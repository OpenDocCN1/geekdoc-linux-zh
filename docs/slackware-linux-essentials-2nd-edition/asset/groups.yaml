    如你所见，大部分内容是关于账户过期信息的。如果你不使用过期信息，只需用某些特殊值填充少数字段。否则，在填充这些字段之前，你需要进行一些计算和决策。对于新用户，只需在密码字段中放入一些随机乱码。现在不用担心密码是什么，因为你一分钟后就会更改它。密码字段中不能包含的唯一字符是冒号。同样将“密码更改以来的数”字段留空。像示例条目中那样填写
    `0`、`9999` 和 `7`，并留空其他字段。


    （对于那些认为看到了我上面的加密密码并认为自己有机会攻入我的系统的人，尽管去吧。如果你能破解那个密码，你就知道了防火墙系统的密码。那可有用了 : ))


    在典型的 Linux 系统上，所有普通用户都是“users”组的成员。然而，如果你想创建一个新组或将新用户添加到额外的组，你需要修改 `/etc/group`
    文件。这是一个典型的条目：


    ```

    cvs::12:chris,logan,david,root

    ```


    字段是组名、组密码、组 ID 和组成员，用逗号分隔。创建一个新组只需添加一行带有唯一组 ID 的新行，并列出所有想要在该组的用户。任何在该新组中的已登录用户都必须注销并重新登录更改才能生效。


    此时，使用 `pwck` 和 `grpck` 命令来验证你所做的更改是否一致可能是好的。首先，使用 `pwck -r` 和 `grpck -r`：`-r`
    不进行任何更改，但会列出如果你在不带该开关运行命令时会被要求执行的更改。你可以利用此输出来决定是否需要进一步修改任何内容、是否不带 `-r` 运行 `pwck`
    或 `grpck`，或者保持原样。


    此时，你应该使用 `passwd` 命令为用户创建一个正式的密码。然后，使用 `mkdir` 在你在 `/etc/passwd` 文件中输入的位置创建新用户的家目录，并使用
    `chown` 将新目录的所有者更改为新用户。


    删除用户只需删除所有针对该用户的条目即可。从 `/etc/passwd` 和 `/etc/shadow` 中删除该用户的条目，并从 `/etc/group`
    文件中的任何组中删除该登录名。如果你愿意，还可以删除用户的家目录、邮件池文件和他们的 crontab 条目（如果存在的话）。


    删除组也类似：从 `/etc/group` 中删除该组的条目即可。


    ## 12.3 正常关机


    妥善关闭系统是非常重要的。仅仅通过电源开关关闭可能会导致严重的文件系统损坏。在系统运行时，即使你没有做任何事情，文件也处于被使用状态。记住，后台一直有许多进程在运行。这些进程正在管理系统并保持许多文件打开状态。当系统电源关闭时，这些文件没有被正常关闭并可能会损坏。取决于损坏哪些文件，系统可能会变得完全不可用！无论何情况下，你下次重启时都必须经过漫长的文件系统检查程序。


    **注意：** 如果你的系统配置了日志文件系统（journaling filesystem），如 ext3 或 reiser，你将受到文件系统损坏的部分保护，且重启时的文件系统检查将比使用不带日志的文件系统（如
    ext2）要短。然而，这种安全网不能作为不当关机的借口。


