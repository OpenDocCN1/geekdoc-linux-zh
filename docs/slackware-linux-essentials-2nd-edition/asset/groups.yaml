    # SlackBuild Scripts


    Slack packages are built in many different ways by necessity. Not all software
    packages are written by their programmers to compile the same way. Many have compile
    time options that are not all included in the packages Slack uses. Perhaps you
    need some of this functionality; you''ll need to compile your own package then.
    Fortunatelyately for many Slack packages, you can find SlackBuild scripts in the
    package''s source code.


    So what is a SlackBuild script? SlackBuild scripts are executable shell scripts
    that you run as root to configure, compile, and create Slackware packages. You
    can freely modify these scripts in the source directory and run them to create
    your own versions of the default Slackware packages.


    # 18.4 Making Tags and Tagfiles (for setup)


    The Slackware setup program handles installation of the software packages on your
    system. There are files that tell the setup program which packages must be installed,
    which ones are optional, and which ones are selected by default by the setup program.


    A tagfile is in the first software series directory and is called tagfile. It
    lists the packages in that particular disk set and their status can be:


    Table 18-3. Tagfile Status Options


    | Option | Meaning |

    | --- | --- |

    | ADD | The package is required for proper system operation |

    | SKP | The package will be automatically skipped |

    | REC | The package is not required, but recommended |

    | OPT | The package is optional |


    The format is simply:'
- md: '

    ```

    package_name: status

    ```


    One package per per line. The original tagfiles for each software series are stored
    as tagfile.org. So if you miss up yours, you can restore the original one.


    Many administrators prefer writing their own tagfiles and starting the installer
    and selecting ''Full''. The setup program will read the tagfiles and perform the
    installation according to their contents. If you use REC or OPT, a dialog box
    will be presented to the user asking whether or not they want a particular package.
    Therefore, it is recommended that you stick with ADD and SKP when writing tagfiles
    for automated installs.


    Just make sure your tagfiles are written to the same location as the originals.
    Or you can specify a custom tagfile path if you have custom tagfiles.


    ## Chapter 19


    ## ZipSlack


    ### 19.1 What is ZipSlack?


    ZipSlack is a special version of Slack Linux. It''s an already installed copy
    of Slack that''s ready to run from your DOS or Windows partition. It''s a basic
    installation, you do not get everything that comes with Slackware.


    ZipSlack gets its name from the form it''s distributed in, a big .ZIP file. Users
    of DOS and Windows will probably be familiar with these files. They are compressed
    archives. The ZipSlack archive contains everything you need to get up and running
    with Slackware.


    It is important to note that ZipSlack is significantly different from a regular
    installation. Even though they function the same and contain the same programs,
    their intended audiences and functions differ. Several advantages and disadvantages
    of ZipSlack are discussed below.


    One thing, you should always review the documentation included in the actual ZipSlack
    directory. It contains the latest information regarding installation, booting,
    and general use of the product.


    ## Advantages


    - Does not require repartitioning of your hard disk.

    - Great way to learn Slackware Linux without stumbling through the installation
    process.


    ## Disadvantages


    - Uses the DOS filesystem, which is slower than a native Linux filesystem.

    - Will not work with Windows NT.


    ### 19.2 Getting ZipSlack


    Obtaining ZipSlack is easy. If you have purchased the official Slackware Linux
    CD set, you already have ZipSlack. Just find the CD that contains the zslack directory
    and place it in your CD-ROM drive. It''s usually the third or fourth disc, but
    always trust the labels over this documentation as the disk it resides on is prone
    to change.


    If you want to download ZipSlack, you should first visit our ‘Get Slack’ web page
    for the latest download information:


    ```

    http://www.slackware.com/getslack/

    ```


    ZipSlack is part of each Slackware release. Locate the release you want, and go
    to that directory on the FTP site. The latest release directory can be found at
    this location:


    ```

    ftp://slackware.com/pub/slackware/slackware/

    ```


    You''ll find ZipSlack in the /zipslack subdirectory. ZipSlack is offered as one
    .ZIP file or floppy-sized chunks. The chunks are in the /zipslack/split directory.


    Don''t stop at just the .ZIP files. You should also download the documentation
    files and any boot images that appear in the directory.


    ## Installation


    Once you''ve downloaded the necessary components, you''ll need to extract the
    .ZIP file. Be sure to use a 32-bit unzipper. The size and filenames in the archive
    are too much for a 16-bit unzipper. Examples of 32-bit unzippers include WinZip
    and PKZIP for Windows.


    ZipSlack is designed to be extracted directly to the root directory of a drive
    (such as C: or D:). A LINUX directory will be created that contains the actual
    Slack installation. You''ll also find the files necessary to booting the system
    in that directory as well.


    After you''ve extracted the files, you should have a \LINUX directory on the drive
    of your choosing (we''ll use c: from here on).


    ### 19.3 Booting ZipSlack


    There are several ways to boot ZipSlack. The most common is to use the included
    LINUX.BAT to boot the system from DOS (or from DOS mode under Windows 9x). This
    file must be edited to match your system before it will work.


    Start by opening the C:\LINUX\LINUX.BAT file in your favorite text editor. At
    the top of the file you will notice a large comment. It explains what you need
    to edit in this file (and also what to do if you are booting from an external
    Zip drive). Don''t worry if you don''t understand the `root=` setting. There are
    several examples, feel free to pick one and try it. If it doesn''t work, you can
    edit the file again, comment out the line you uncommented, and pick another one.


    After you uncomment the line you want by removing the ''rem'' at the beginning
    of the line, save the file and exit the editor. Bring your machine into DOS mode.


    A DOS prompt window in Windows 9x will not work.


    Type C:\LINUX\LINUX.BAT to boot the system. If all goes well, you should be presented
    with a login prompt.


    Log in as root, with no password. You’ll probably want to set a password for root,
    as well as adding an account for yourself. At this point you can refer to the
    other sections in this book for general system usage.


    If using the LINUX.BAT file to boot the system didn’t work for you, you should
    refer to the included c:\LINUX\README.1ST file for other ways to boot.


    ## Glossary


    ### Account

    All the information about a user, including username, password, home directory.


    ### Background

    Any process that is running without user intervention is said to be background.


    ### Boot disk

    A floppy disk containing operating system from which a computer can be started.


    ### Compile

    To convert source code to machine-readable binary.


    ### Daemon

    A program designed to run in the background and, without intervention, perform
    a specific task.


    ### Darkstar

    The default hostname in Slackware if you do not specify some other name.


    ### Desktop Environment

    A graphical user interface (GUI) that runs atop X Window System and provides such
    features as integrated applications, cohesive look-and-feel between window management.


    ### Device driver

    A chunk of code in the kernel that directly controls hardware.


    ### Device node

    A special type of file in /dev that represents hardware.


    ### DNS

    Domain Name Service. A system in which networked computers are given names which
    translate to numerical addresses.


    ### Domain name

    A computer’s DNS name, excluding its host name.


    ### Dot file

    In Linux, files which are to be hidden have filenames beginning with a dot (''.'').


    ### Dotted quad

    The format of IP addresses, so called because it consists of four numbers (range
    0-255 decimal) separated by periods.


    ### Dynamic loader

    When programs are compiled under Linux, they usually use pieces of code (functions)
    from external libraries. When such programs are run, those libraries must be found
    and the required functions loaded into memory. This is the job of the dynamic
    loader.


    ### Environment variable

    A variable set in the user’s shell which can be referenced by that user or programs
    run by that user within that shell. Environment variables are generally used to
    store preferences and default parameters.


    ### Epoch

    A period of history; in Unix, “The Epoch” begins at 00:00:00 January 1, 1970.
    This is considered the ‘dawn of time” by Unix and Unix-like operating systems,
    and all other time is calculated relative to this date.


    ### Filesystem

    A representation of stored data in which ‘files’ of data are kept organized ‘directories’.
    The filesystem is the nearly universal form of representation for data stored
    to disks (both fixed and removable).


    ### Foreground

    A program that is accepting or controlling a terminal’s input is said to be running
    in the foreground.


    ### Framebuffer

    A type of graphics device; in Linux, this most often refers to the software framebuffer,
    which provides a standard interface to programs while keeping specific hardware
    drivers hidden from them. This layer of abstraction frees programs of the need
    to speak to various hardware drivers.


    ### FTP

    The File Transfer Protocol. FTP is a very popular method of transferring data
    between computers.


    ### Gateway

    A computer through which data on a network is transferred to another network.

