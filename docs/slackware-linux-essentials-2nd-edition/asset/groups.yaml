    # Chapter 17 Emacs


    Text mode, the Tab key simply jumps to the next tab stop, but in many programming
    language modes, the **Tab** key indents the current line according to the depth
    of the block line is in.


    The modes mentioned above are called major modes. Each buffer has exactly one
    major mode. Additionally, a buffer can have one or more minor modes. A minor mode
    provides additional features that may be useful for certain editing tasks. For
    example, if you hit the INSERT key, you invoke overwrite-mode, which does what
    you''d expect. There is also an auto-fill-mode, which is handy in combination
    with text-mode or latex-mode: it causes each line that you type to be automatically
    wrapped once the line reaches a certain number of characters. Without auto-fill-mode,
    you have to use **M-q** to fill out a paragraph. (Which you can also use to reformat
    a paragraph after you''ve edited some text in it and it is no longer nicely filled.)


    ## Opening files


    To open a file in Emacs,


    ```

    C-x C-f

    ```


    Emacs will ask you for the name of the file, filling in some default path for
    you (which is usually ~/ ). After you type the filename (you can use **Tab** completion
    and hit **ENTER**, Emacs will open the file in a new buffer and display that buffer
    on the screen.


    > **Note:** Emacs will automatically create a new buffer, it will not load the
    file into the current buffer.


    In order to create a new file in emacs, you cannot just go typing right away.
    You first have to create a buffer for it, and come up with a filename. You do
    this by typing **C-x C-f** and typing a filename, just as if you were opening
    an existing file. Emacs will notice that the file you typed doesn’t exist, and
    will create a new buffer and report ‘New file)’ in the minibuffer.


    When you type C-x C-f and then enter a directory name instead of a filename. Emacs
    will create a new buffer in which you will find a list of all the files in that
    directory. You can move the cursor to the file you are looking for and type ,
    and Emacs will open it. (There are in fact a lot more actions you can perform
    here, such as deleting, renaming and moving files, etc. Emacs is now in dired-mode,
    which is basically a simple manager.)


    When you have typed C-x C-f and suddenly change your mind, you can type C-g to
    cancel the action. C-g works almost everywhere where you want to cancel an action
    or command that you’ve started but don’t want to finish.


    ## 17.4 Basic Editing


    When you have opened a file, you can course of move around in it with the cursor.
    The cursor keys and PgUp, PgDn do what you’d expect. Home and End jump to the
    beginning and end of the line. (In older versions, they would actually jump to
    the beginning and end of the buffer.) However, there are also Control and Meta
    (Alt) key combos that move the cursor around. Because you do not need to move
    your hands to another part of the keyboard for these, they are much quicker when
    you used to them. The most important commands are parallel are listed in Table
    17-1.


    Note that many Meta commands are parallel to the Control except that they operate
    on larger units: C-f goes forward one character, M-f goes forward an entire word,
    etc.


    Also note that M-< and M-> require you to type Shift+Alt+comma and Shift+Alt+dot
    respectively, since < and > are on Shift+comma and Shift+dot. (Unless of course
    you have a different keyboard layout from the standard US layout.)


    Note that C-k deletes (kills, as it is commonly called) all the text after the
    cursor to the end of the line, but doesn''t delete the line itself (i.e., it doesn''t
    delete the final newline). It only deletes the line if there was no text after
    the cursor. In other words, in order to delete a complete line, you have to put
    the cursor at the beginning of the line, and then hit C-k twice: once to delete
    and once to delete.


    ### Table 17-1. Basic Emacs Editing Commands


    | Command | Result |

    |---|---|

    | C-b | go one character back |

    | C-f | go one character forward |

    | C-n | go one line down |

    | C-p | go one line up |

    | C-a | go to the beginning of the line |

    | C-e | go to the end of the line |

    | M-b | go one word back |

    | M-f | go one word forward |

    | M-} | go one paragraph forward |

    | M-{ | go one paragraph backward |

    | M-a | go one sentence backward |

    | M-e | go one sentence forward |

    | C-d | delete the character under the cursor |

    | M-d | delete until the end of the current word |

    | C-v | go down one screen (i.e., PgDn) |

    | M-v | go up one screen (i.e., PgUp) |

    | M-> | go to the beginning of the buffer |

    | C-_ | undo the last change (can be repeated); note that you actually have to
    type Shift+Control+hyphen for this. |

    | C-k | delete to end of line |

    | C-s | forward search |

    | C-r | backward search |


    ## 17.5 Saving Files


    In order to save a file, you type


    ```

    C-x C-s

    ```


    Emacs will ask you for the name of the file, filling in some default path for
    you (which is usually ~/ ). After you type the filename (you can use **Tab** completion
    and hit **ENTER**, Emacs will open the file in a new buffer and display that buffer
    on the screen.


    > **Note:** Emacs will automatically create a new buffer, it will not load the
    file into the current buffer.


    In order to create a new file in emacs, you cannot just go typing right away.
    You first have to create a buffer for it, and come up with a filename. You do
    this by typing **C-x C-f** and typing a filename, just as if you were opening
    an existing file. Emacs will notice that the file you typed doesn’t exist, and
    will create a new buffer and report ‘New file)’ in the minibuffer.


    When you type C-x C-f and then enter a directory name instead of a filename. Emacs
    will create a new buffer in which you will find a list of all the files in that
    directory. You can move the cursor to the file you are looking for and type ,
    and Emacs will open it. (There are in fact a lot more actions you can perform
    here, such as deleting, renaming and moving files, etc. Emacs is now in dired-mode,
    which is basically a simple manager.)


    When you have typed C-x C-f and suddenly change your mind, you can type C-g to
    cancel the action. C-g works almost everywhere where you want to cancel an action
    or command that you’ve started but don’t want to finish.


    ## Quitting Emacs


    To quit Emacs, you type


    ```

    C-x C-c

    ```


    Emacs will ask you if you want to save your changes. If you type **y**, it will
    save the file and quit. If you type **n**, it will quit without saving. If you
    type **!**, it will quit without asking.

