    0。所以，如果那三个文件是目录中的唯一文件，我们只需要说 `cp * /` 就能一气呵成把它们全部过去。但假设目录下还有一个名为 `ex.txt` 的文件和一个名为
    `hello.txt` 的文件。我们复制 `ex.txt` 但 `hello.txt`；`cp ex* /tmp` 就能做到。当然，`cp ex?.txt
    /tmp` 只获取我们的三个文件；因为 `ex.txt` 中没有匹配 `?` 的字符，所以它会被跳过。


