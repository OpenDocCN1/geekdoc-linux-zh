    | UP/k' - 向上一行 |\n| LEFT/h' - 向左滚动 |\n| RIGHT/t' - 向右滚动 |\n| 0 - 移动到文件开头 |\n|\
    \ HOME/g' - 移动到文件开头 |\n| END/G' - 移动到文件末尾 |\n| '/' - 向前搜索 |\n| < OK > ( 6%) |\n\
    \n## KEYMAP\n\n如果你需要美国“qwerty”布局以外的键位映射，你可能想看看这一节。它提供了许多备用布局供你键盘使用。\n\n## 第 3\
    \ 章 安装\n\n### 键盘映射表选择\n你可以选择以下键盘映射之一。\n如果不选择键盘映射，'us.map'（美式键盘映射）是默认值。使用 UP/DOWN\
    \ 箭头和 PageUp/PageDown 滚动整个选项列表。\n\n```\nqwerty/us.map\nazerty/azerty.map\nazerty/be-latin1.map\n\
    azerty/fr-latin1.map\nazerty/fr-latin9.map\nazerty/fr-pc.map\nazerty/fr.map\n\
    azerty/wangbe.map\nazerty/be2.map\ndvorak/ansi-dvorak.map\ndvorak/l.map\n\n```\n\
    \n< OK >\n\n## ADDSWAP\n\n### 检测到交换空间\nSlackware Setup 检测到分区：\n\n| 设备 | 开始 | 结束\
    \ | 块 |\n| :--- | :--- | :--- | :--- |\n| /dev/da1 | | | |\n| /dev/da2 | | | |\n\
    | /dev/da3 | | | |\n| /dev/da4 | | | |\n\n你希望将此作为交换分区吗？\n\n< Yes > < No >\n\n\
    ## TARGET\n\n选择 Linux 安装分区：\n\n| /dev/da1 | |\n| :--- | :--- |\n| /dev/da2 | |\n\
    | /dev/da3 | |\n| /dev/da4 | |\n\n< Select > < Continue >\n\n## SOURCE\n\nsource\
    \ 部分是你选择从何处安装的地方。有四种源可选：CD-ROM、NFS 或挂载目录。\n\n| 来源选择 |\n| :--- |\n| 请选择用于安装的媒体\
