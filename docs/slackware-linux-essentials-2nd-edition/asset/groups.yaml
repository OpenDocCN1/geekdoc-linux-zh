    ## 8.4 虚拟终端


    你正在处理某项工作，突然决定需要做其他事情。你可以放下手头的工作并切换任务，但这是一个多用户系统，对吧？你可以同时登录你想要的任何次数，对吧？你为什么要一次只做一件事呢？


    你不需要。我们无法为一台机器配备多个键盘、鼠标和显示器；大多数人希望按照自己的意愿进行。显然，硬件不是解决方案。剩下的就是软件了，Linux 在这方面表现出色，提供了“虚拟终端”，或“VTs”。


    通过按下 `Alt` 和功能键，你可以在虚拟终端之间切换；每个功能键都对应一个。Slackware 默认登录在 6 个 VT 上。`Alt+F2` 将带你进入第二个，`Alt+F3`
    带你进入第三个。


    其余功能键留给了 X 会话。每个会话使用自己的 VT，从第七个（`Alt+F7`）开始递增。在 X 中，`Alt+Function` 键键组合被 `Ctrl+Alt+Function`
    代替；所以如果你在 X 中并想回到文本登录（而不退出你的 X 会话），Ctrl+Alt+F3 将带你进入第三个。（假设你正在使用第一个 X 会话，Alt+F7
