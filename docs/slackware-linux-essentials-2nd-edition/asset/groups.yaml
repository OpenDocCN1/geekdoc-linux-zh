    ## 11.4 kill


    On occasion, programs misbehave and you’ll need to put them back in line. The
    program for this kind of administration is called kill(1), and it can be used
    for manipulating processes in several ways. The most obvious use of kill is to
    kill off a process. You’ll need to do this if a process has run away and is using
    lots of system resources, or if you’re just sick of it.


    in order to kill off a process, you’ll need to know its PID or its name. To get
    the PID, use the ps command as discussed in the last section. For example, to
    kill off process 4747, you’d issue the following:


    ```

    $ kill 4747

    ```


    There’s another variety of the kill command called killall(1). This program does
    exactly what it says: it kills all the running processes that have a certain name.
    If you wanted to kill off all the running vim processes, you could type the following

    '
  mdcn: '


    ```

    % jobs

    [1] Stopped vim

    [2]- Stopped amp

    [3]+ Stopped man ps

    ```


    这向你显示了所有后台进程的列表。如你所见，它们都已停止。这意味着这些进程处于挂起状态。数字是所有后台进程的一种标识符。旁边带有加号的 ID（man ps）是在当你直接输入
    `fg` 时，将被调回前台运行的进程。


    如果你想让 `vim` 回到前台，你会输入：


    ```

    % fg 1

    ```


    然后 `vim` 就会回到控制台。如果你在通过拨号连接时只打开了一个终端，那么将进程置于后台会非常有用。你可以在该终端上运行几个程序，并定期地在它们之间来回切换。


    ## 11.3 ps


    现在你已经知道如何在从命令行启动的多个进程之间来回切换了。你还知道一直有很多进程在运行。那么，你会列出所有这些程序吗？嗯，你可以使用 `ps(1)` 命令。这个命令有很多选项，所以我们在这里只介绍最重要的几个。若要查看完整的列表，请参阅
    ps 的 man 页面。ps 页面在 2.1.1 节中有详细介绍。


    只需输入 `ps` 即可获取终端上运行的程序列表。这包括前台进程（包括你正在使用的任何 shell，当然还有 `ps` 本身）。列出的还有你可能正在运行的后台进程。很多时候，列表会非常短：


    ### 图 11-1. 基本 ps 输出


    ```

    $ ps

    PID TTY TIME CMD

    7923 tty0 00:00:00 bash

    8059 tty0 00:00:00 ps

    ```


    即使是这些进程也不多，但信息是非常典型的。无论运行了多少进程，使用普通的 `ps` 你都会得到相同的列。这些都意味着什么？


    嗯，PID 是进程 ID。所有运行中的进程都被赋予一个唯一的标识符，范围在 1 到 32767 之间。每个进程会被分配一个空闲的 PID。当进程退出（或被杀死，正如你在下一节中看到的）时，它会放弃
    PID。当达到最大 PID 时，下一个空闲 PID 将绕回曾经出现过的最低值。


    TTY 列指示进程在哪个终端上运行。执行简单的 ps 只列出运行在当前终端上的程序，因此所有进程在 TTY 列中都提供相同的信息。如你所见，两个进程都运行在
    typ0 上。这表明它们要么是远程运行，要么是从某种 X 终端运行的。


    TIME 列表示进程运行的 CPU 时间。这与进程运行的实际时间不同。请记住 Linux 是一个多任务操作系统。一直有很多进程在运行，这些进程每个获得进程时间的一小部分。因此，TIME
    列显示的每个进程运行时间应该比它们实际运行的时间短得多。如果你在 TIME 列中看到超过几分钟的时间，可能意味着出了问题。


    最后，CMD 列显示了程序实际上是什么。它只列出程序的基名，而不列出任何命令行选项或类似信息。要获取这些信息，你需要使用 ps 的许多选项之一。我们稍后会讨论这一点。


