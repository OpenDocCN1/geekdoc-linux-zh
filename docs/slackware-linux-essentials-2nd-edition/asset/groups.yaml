    | GNOME | GNOME 桌面环境。 |

    | K | Linux 内核源代码。 |

    | KDE | K Desktop 环境。一个与 MacOS 和 Windows 共享许多外观特征的 X 环境。KDE 需要 Qt 库在此系列中。 |

    | KDEI | KDE 桌面的国际化软件包。 |

    | L | 库。许多程序需要的动态链接库。 |

    | N | 网络程序。守护进程、邮件程序、telnet、新闻阅读器等。 |

    | T | LaTeX 文档格式系统。 |

    | TCL | 工具命令语言。 |

    | X | X 窗口系统。 |

    | XAP | 不是主要桌面环境的 X 应用程序（例如 Ghostscript 和 Netscape）。 |

    | Y | BSD 控制台游戏 |


