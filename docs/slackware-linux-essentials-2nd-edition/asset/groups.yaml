    # Chapter 1 Emacs


    mands that require some input are executed. For example, when you open a file,
    Emacs will ask for its name in the minibuffer.


    Switching from one buffer to another can be done with the command C-x b. This
    will prompt you for the name of a buffer (a buffer''s name is usually the name
    of the file you are editing in), and it gives a default choice, which is normally
    the buffer that you were in before you switched to or created the current buffer.
    Just hitting Enter will switch to that default buffer.


    If you want to switch to another buffer than the default offered by Emacs, just
    type its name. Note that you can use so-called Tab-completion here the first few
    letters of the buffer''s name and hit Tab then will complete the name of the buffer.
    Tab completion works everywhere in Emacs where it makes sense.


    You can get a list of buffers by hitting C-x C-b. This command will usually split
    the screen in two, displaying the buffer you were working in the top half, and
    a new buffer called *Buffer List* in the bottom half. This buffer contains a list
    of all the buffers, their sizes and modes, and the files, if any, those buffers
    are visiting (as it is called in Emacs). You can get rid of this split screen
    by typing C-x l.


    > Note: Under X, the list of buffers is also available in the Buffer menu in the
