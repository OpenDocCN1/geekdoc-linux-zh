    ## Chapter 15


    ## Archive Files


    ### 15.1 gzip


    gzip(1) is the GNU compression program. It takes a single file and compresses
    it. The basic usage is as follows:


    - gzip filename


    The resulting file will be named filename.gz and will usually be smaller than
    the input file. Note that filename.gz will replace filename. This means that filename
    will not longer exist, even though a zipped copy will. Regular text files will
    compress nicely, while jpeg images, mp3s, and other such files will not compress
    well as they are already compressed. This basic usage is a balance of final file
    size and compression time. The maximum compression can be achieved like so:


    - gzip -9 filename


    This will take a longer time to compress the file, but the result will be as small
    as gzip can make it. Using lower values for the command line option will cause
    it to compress faster, but the file will not be compressed.


    Decompressing zipped files can be done using two commands, which are really just
    the same program. gzip will decompress any file with a recognized file extension.
    A recognized extension can be any of the following: .gz, -gz, .z, -z, or -Z. The
    first method is to call gunzip(1) on a file, like so:


    - gunzip filename.gz


    This will leave a decompressed version of infile in the current directory, and
    the .gz extension will be stripped from the filename. gzip is really part of gzip
    and is identical to gzip -d. As such, gzip is often pronounced gunzip, as that
    name sounds cooler. :^)


    ### 15.2 bzip2


    bzip2(1) is an alternative compression program installed on Slack Linux. It uses
    a different compression algorithm from gzip, which results in some advantages
    and some disadvantages. The main advantage for bzip2 is the compressed file. bzip2
    will almost always compress better than gzip. In some instances, this can result
    in dramatically smaller files. This can be a great advantage for people on slower
    modem connections. Also remember, when downloading software from a public ftp
    server, it''s generally good netiquette to download the .bz2 files instead of
    .gz files. The disadvantage for bzip2 is that it takes more time to compress and
    decompress than gzip.


    Decompressing zipped files can be done using two commands, which are really just
    the same program. gzip will decompress any file with a recognized file extension.
    A recognized extension can be any of the following: .gz, -gz, .z, -z, or -Z. The
    first method is to call gunzip(1) on a file, like so:


    - gunzip filename.gz


    ### 15.3 tar


    tar(1) is the GNU archiver. It can take multiple files and directories and combine
    them into a single file, called a tarball. This is very useful for distributing
    software and backing up data. There are many options for tar, but the most common
    ones are:


    - -c create a new archive

    - -x extract an archive

    - -v list the contents of an archive

    - -f specify the archive file

    - -z filter through gzip

    - -j filter through bzip2


    For example, to create a compressed tar archive of a directory, you would use:


    ```

    tar -czvf archive.tar.gz directory/

    ```


    To extract the archive, you would use:


    ```

    tar -xzvf archive.tar.gz

    ```

