    # 安装


    在使用 Slackware Linux 之前，你必须先获取并安装它。获取 Slackware 就像购买或在互联网上免费下载一样简单。只要你对电脑有一定的一些基础知识并愿意学习其他事情，安装它也同样。安装程序本身是一个一步步就班的过程。因此，你可以非常快速地启动并运行。事实上，Slackware
    拥有所有全功能 Linux 发行版中安装时间最短的之一。


    # 3.1 获取 Slackware


    # 官方光盘和盒装套装


    官方 Slackware Linux CD 组由 Slackware Linux, Inc. 提供。该 CD 包含 4 张光盘。第一张包含基础服务器安装所需的所有软件以及窗口系统。第二张
    CD 是一张“现场”CD；即可以启动的 CD，它可以安装到 RAM 中，并提供一个临时安装供你玩玩玩，或者用于数据或机器救援。这张 CD 还包含了一些软件包，如
    KDE 和 GNOME 桌面环境。第二张 CD 上还包含了一些小礼物，包括“extra”文件夹中的许多非核心软件包。第三张和第四张 CD 包含了所有 Slackware
    的源代码，以及本书的原版。


