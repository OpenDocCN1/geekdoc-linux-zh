    下一个选项是 **newbie**。此选项将安装所选系列中的所有必需软件包。对于所有其他软件包，它会提供一个提示，你可以选择 ''Yes''（是）、''No''（否）或
    ''Skip''（跳过）。Yes 和 No 的显而易见，Skip 将进入下一个软件系列。此外，你将看到每个软件包的描述和大小要求，帮助你决定是否需要。我们建议新用户使用此选项，因为它能确保你安装了所有必需软件包。但是，由于有提示，速度有点慢。


    Menu 是 newbie 选项更快速、更高级的版本。对于每个系列，都会显示一个菜单，你可以从中选择你想要安装的所有非必需软件包。必需软件包不会显示在此菜单中。


    对于更高级的用户，安装提供了 **expert**（专家）选项。这允许你对安装哪些软件包进行完全控制。你可以取消勾选绝对必需的软件包，这将导致系统损坏。相反，你可以精确控制哪些内容进入你的系统。只需从每个系列中选择你想要安装的软件包。这不建议新用户使用，因为很容易自食其果。


    custom 和 tag path 选项也是面向高级用户的。这些选项允许你根据在发行树中创建的自定义 tag 文件进行安装。这对于快速地安装大量机器非常有用。关于使用
    tag 文件的更多信息，请参见第 18.4 节。


    选择安装方法后，将发生几种情况之一。如果你选择了 full 或 menu，将出现菜单屏幕，允许你选择要安装的软件包。如果你选择了 full，软件包将立即安装到目标位置。如果你选择了
    newbie，软件包将一直安装，直到遇到一个可选软件包。


    注意，安装过程中可能会耗尽空间。如果你针对目标设备的可用空间选择了过多的软件包，你就会遇到问题。最安全的做法是先选择一些软件，如果需要，以后再添加。这可以使用
    Slack 的软件包管理工具轻松完成。有关此信息，请参见第 18 章。


    ## 配置


    软件包安装后，配置部分允许你进行一些基础系统配置。你在这里看到的内容很大程度上取决于你安装的软件包。然而，你始终会看到以下：


    ### 内核选择


    在这里，将被要求选择一个要安装的内核。你可以从用于安装的启动盘、Slack CD-ROM，或另一张你（总是提前考虑）准备好的软盘中安装内核。你也可以选择跳过，在这种情况下，将安装默认内核并继续后续。


    ### 安装 Linux 内核


    为了让你的系统正确启动，必须安装内核。如果你一直使用安装启动盘的内核 (/vmlinuz) 到这里，你应该将其安装为你的系统内核 (/boot/vmlinuz)。如果你确定自己在做什么，也可以从
    Slack CD 安装你选择的内核，或从软盘安装内核。你也可以跳过此菜单，使用任何已安装的内核（例如 A 系列的通用内核）。你想选择哪种选项？


    | bootdisk | 使用安装启动盘中的内核 |

    | cdrom | 使用 Slackware CD 中的内核 |

    | floppy | 从 DOS 软盘安装 zimage 或 bimage |

    | skip | 跳过此菜单（使用默认的 /boot/vmlinuz） |


    < OK > < 取消 >


    ### 制作启动盘


    为以后以后制作一个启动盘可能是一个好主意。你可以选择格式化软盘然后创建两种类型启动盘之一。第一类型是简单的，它只是（你信吗）将内核写入软盘。更灵活（且非常推荐）的选项是
    lilo，它无疑会创建一个 lilo 启动盘。更多信息请参见第 7.1 节中的 LILO。当然，你也可以选择直接继续，在这种情况下将不会制作启动盘。


    ### 制作启动盘


    强烈建议为你的系统制作一个（或两个）启动盘。（此处由于原文存在大量重复文本，已按要求清理）


    '
