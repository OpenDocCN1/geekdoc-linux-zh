    \ 中使用 **p** 显示分区表。如果一切看起来良好，输入 **w** 将更改写入磁盘并退出 `fdisk`。\n\n## 3.4 setup 程序\n\n\
    一旦你创建了分区，就可以安装 Slackware 了。安装过程的下一步是运行 `setup(8)` 程序。要执行此操作，只需在 shell 提示符下输入 `setup`。`setup`\
    \ 是一个菜单驱动的系统，用于实际安装 Slack 软件包并配置你的系统。\n\n- Linux Setup (version 9.1.0)--欢迎来到 Slack\
    \ Linux Setup。使用 UP/DOWN 键以及 SPACE 和 ENTER 键选择选项。也可以使用交替键：'+'、'-' 和 TAB。\n\n|\
    \ HELP | 读取 Slack Setup HELP 文件 |\n| :--- | :--- |\n| KEYMAP | 如果你没有使用美式布局，请重新映射你的键盘\
