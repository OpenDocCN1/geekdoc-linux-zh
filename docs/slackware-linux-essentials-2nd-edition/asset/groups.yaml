    # 7.2 LOADLIN


    The other booting option that comes with Slackware Linux is LOADLIN, LOADLIN is
    a DOS executable that can be used to start Linux from a running DOS system. It
    requires the Linux kernel to be on the DOS partition so that LOADLIN can load
    it properly boot the system.


    During the installation process, LOADLIN will be copied to root''s home directory
    as a .ZIP file. You will need to copy the Linux kernel (typically /boot/vmlinux)
    and the LOADLIN file from root''s home directory to the DOS partition.


    LOADLIN is useful if you would like to make a boot menu on your DOS partition.
    A menu could be added to your AUTOEXEC.BAT file that would allow you to pick between
    Linux or DOS. A choice of Linux would run LOADLIN, thus booting your Slackware
    system. This AUTOEXEC.BAT file under Windows 95 will provide a sufficient boot
    menu:


    ```

    @ECHO OFF

    SET PROMPT=$PSG

    SET PATH=C:\Windows;C:\WINDOWS\COMMAND;C:\nCLS

    ECHO Please Select Your Operating System:

    ECHO.

    ECHO [1]ing Linux

    ECHO [2] Windows 95

    ECHO.

    CHOICE /C:12 "Selection? ->"

    IF ERRORLEVEL 2 GOTO WIN

    IF ERRORLEVEL 1 GOTO LINUX

    :WIN

    CLS

    ECHO Starting Windows 95...

    WIN

    GOTO END

    ```


