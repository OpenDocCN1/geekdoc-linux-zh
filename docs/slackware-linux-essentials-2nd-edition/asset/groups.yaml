    # Chapter 17

    Emacs


    While *vi* (with its clones) is without a doubt the most ubiquitous editor on
    Unix-like systems, Emacs comes in a good second. Instead of using different ‘modes’,
    like vi does, it uses **Control** and **Alt** key combinations to enter commands,
    in much the same way that you can use **Control** and **Alt** key combinations
    in a word processor and indeed in many other applications to execute certain functions.
    (Though it should be noted that the commands rarely correspond; so while modern
    applications use Ctrl-C/ X/ V for copying, cutting and pasting, Emacs uses different
    keys and actually a somewhat different mechanism for this.)


    Also unlike *vi*, which is an (excellent) editor and nothing more, Emacs is a
    program with near endless capabilities. Emacs is (for the most part) written in
    Lisp, which is a very powerful programming language that has the peculiar property
    that every program written in it is automatically a Lisp compiler of its own.
    This means that the user can extend Emacs, and in fact write completely new programs
    ‘In Emacs’.


    As a result, Emacs is not just an editor anymore. There are many add-on packages
    for Emacs available (many come with the program’s source) that provide sorts of
    functionality. Many of these are related to text editing, which is after all Emacs’
    basic task, but it does not store that. There are for example several spreadsheet
    programs for Emacs, there are databases, games and news clients (the one being
    Gnus), etc.


    There are two main versions of Emacs: GNU Emacs (which is the version that comes
    with *Slackware*) and XEacs. The latter is **not** a version for Emacs running
    under X. In fact, both Emacs and XEacs run on the console as XEmacs was once started
    as a project to tidy up the Emacs code. Currently, both versions'
