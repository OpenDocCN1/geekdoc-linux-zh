    # Command Keys


    As mentioned above, Emacs uses Control and Alt combinations for commands. The
    usual convention is to write these with C-letter and M-letter, respectively. So
    C-x means Control+x, and M-x means Alt+x. (The M is used instead of A because
    originally the key was not the Alt key but the Meta key. The Meta key has all
    but disappeared from computer keyboards, and in Emacs the Alt key has taken over
    its function.)


    Many Emacs commands consist of sequences of keys and key combinations. For example,
    C-x C-c (that is Control-x followed by Control-c ) quits Emacs, C-x C-s saves
    the current file. Keep in mind that C-x C-b is not the same as C-x C-b. The former
    means Control-x followed by Control-b, while the latter means Control-x followed
    by ''b''.


    # 17.2 Buffers


    In Emacs, the concept of ''buffers'' is essential. Every file that you open is
    loaded into its own buffer. Furthermore, Emacs has several special buffers, which
    do not contain a file but are used for other things. Such special buffers usually
    have a name that starts and ends with an asterisk. For example, the buffer that
    Emacs shows when it is first started, is the so-called *scratch* buffer. The *scratch*
    buffer, you can type text in the normal way, but that text is typed not saved
    when Emacs is closed.


    There is one other special buffer you need to know about, and this is the minimax.
    This buffer consists of only one line, and is always on the screen: it is the
    very last line of the Emacs window, below the status bar for the current buffer.
    The minib is where Emacs shows messages for the user, and it is also the place
    where com-'
