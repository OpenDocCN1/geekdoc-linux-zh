    # Chapter 13 Basic Network Commands


    Non-authoritative answer:

    www.slackware.com canonical name = slackware.com.

    Name: slackware.com

    Address: 64.57.102.34


    # dig


    The meanest dog in the pound, the domain information groper, dig(1) for short,
    is the go-to program for finding DNS information. dig can grab just about anything
    from a DNS server including reverse lookups, CNAME, MX, SP, and TXT records. dig
    has many command line options and if you''re not familiar with it you should read
    through it''s extensive man.


    ```

    % dig @192.168.1.254 www.slackware.com mx

    ;>> DIG 9.2.2 <<192.168.1.254 www.slackware.com mx

    ;; global options: printcmd

    ;; answer:

    ;; ->HEADER--<< opcode: QUERY, STATUS: NOERROR, id: 26362

    ;; flags: qr rd ra; Query: 1, ANSWER: 2, AUTHORITY: 2, ADDITIONAL: 2


    ;; QUESTION SECTION:

    ;;www.slackware.com. IN MX


    ;; ANSWER SECTION:

    ;;www.slackware.com. 76634 IN CNAME slackware.com.

