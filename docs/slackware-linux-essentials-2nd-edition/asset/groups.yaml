    # 第1章 Slackware Linux 简介


    开源组织（Open Source Initiative）。许多公司想要发布源代码，但不想使用 GPL。由于他们无法从根本上改变 GPL，他们获得了提供自己的许可证并由该组织认证的机会。


    自由软件基金会（Free Software Foundation）和开源组织（Open Source Initiative）致力于相互帮助，但它们并不是同一实体。自由软件基金会使用特定的许可证并根据该许可证提供软件。开源组织寻求对所有开源许可的支持，包括来自自由软件基金会的许可。双方各自主张使源代码免费可用的理由有时会导致这两个运动产生分歧，但这两个意识形态迥异的群体正朝着同一个目标努力，这一事实为双方的努力增添了可。


    # 第2章


    # 帮助


    通常，你可能需要在使用特定命令、设置程序或让硬件正常工作所需的帮助。也许你只是想更好地理解某个命令，或者查看可以使用该命令的哪些其他选项。幸运的是，你有多种方法可以获取你寻找的帮助。在安装
    Slack 时，你可以选择安装“F”系列软件包，其中包含了 FAQ（常见问题解答）和 HOWTO。程序还附带有关于其选项、配置文件和用法的帮助信息。


    ## 2.1 系统帮助


    man


    man（“manual”的缩写）是 Unix 和 Linux 操作系统中在线文档的传统形式。它由特殊格式的文件（即“man 页”）组成，为大多数命令编写，并随软件本身分发。执行
    `man somecommand` 将显示指定命令（当然地）的 man 页，在我们的示例中，这将是虚拟的程序 `command`。


    正如你所想象的，man 页的数量可能会迅速增加，变得极其混乱且非常复杂，即使对于高级用户也是如此。因此，man 页被分为若干编号的章节。这个系统已经存在了很久，久到你经常会看到命令、程序甚至编程库函数通过其
    man 章节编号来被引用。


    例如：


    你可能会看到对 `man(1)` 的引用。编号告诉你“man”在第 1 节（用户命令）中有记录；你可以通过命令 `man 1 man` 指定你想要查看 ''man''
    的第 1 节 man 页。在多个项目具有相同名称的情况下，指定 man 查找的章节是有用的。


    # 表 2-1. Man 页章节


    | 章节 | 内容 |

    | --- | --- |

    | 章节 1 | 用户命令（仅限介绍） |

    | 章节 2 | 系统调用 |

    | 章节 3 | C 库调用 |

    | 章节 4 | 设备（例如 hd, sd） |

    | 章节 5 | 文件格式和协议（例如 wtmp, /etc/passwd, nfs） |

    | 章节 6 | 游戏（仅限介绍） |

    | 章节 7 | 惯例、宏包等（例如 nroff, ascii） |

    | 章节 8 | 系统管理（仅限介绍） |


    除了 `man(1)` 外，你还可以使用 `what(1)` 和 `apropos(1)` 命令，它们的共同目的是更容易在 man 系统中查找信息。


    `whatis` 命令对系统命令提供非常简短的描述，类似于口袋命令参考书。


    示例：


    ```

    % whatis

    whatis (1) - 在 whatis 数据库中的完整单词

    ```


    # 第2章 帮助


    `apropos` 命令用于搜索包含给定关键词的 man 页。


    示例：


    ```

    $ apropos wav - a sampling utility that dumps CD audio data into wav sound

    cddawav (1) - Xirom Creditcard Netwave device driver

    netwave_cs (4) - simple decoder, Ogg Vorbis file to PCM audio file (WAV or RAW)

    goggdec (1) - (4)

    awavelan (4) - AT&T GIS WaveLAN device driver

    wavelan_cs (4) - AT&T GIS WaveLAN PCMCIA device driver

    wlan_cs (4) - Lucent WaveLAN/IEEE 802.11 device driver

    ```


    如果你想获得其中任何命令的更多信息，请阅读它们的 man 页获取详情； ;)


    # /usr/doc 目录


    我们构建的大多数软件包源码都带有某种文档。README 文件、使用说明、许可证文件等。随源码提供的任何文档都会包含并安装在你系统的 `/usr/doc` 目录下。每个程序（通常）会按照以下顺序安装自己的文档：


    ```

    /usr/doc/$program-$version

    ```


    其中 $Program 是你想要阅读的程序名称，$version 是（显然地）安装在你的系统上的软件包的相应版本。


    例如，要读取命令 `man(1)` 的文档，你需要切换到：


    ```

    $ cd /usr/doc/man-$version

    ```


    如果阅读相应的 man 页（页）不能为你提供足够的信息，或者不能解决你特别寻找的内容，`/usr/doc` 目录应该是你的下一个停靠站。


    # 第2章 帮助


    # HOWTOs 和 mini-HOWTOs


    正是开源社区真正的精神带我们来到了 HOWTO/mini-HOWTO 集合。这些文件正如其名所示——描述如何做某事的文档和指南。如果你安装了 HOWTO 集合，HOWTOs
    将位于 `/usr/doc/HOWTOs`，mini-HOWTOs 将位于 `/usr/doc/mini-HOWTOs`。


    同一系列中还包含一个 FAQ 集合，它是以下内容的缩写：


    Frequently Asked Questions（常见问题解答）


    这些文档以“问答”的形式编写，用于解决（惊喜的）常见问题。如果你在安装过程中安装了 FAQs，你将在 `/usr/doc/FAQs` 中找到它们。当你不确定如何继续时，这些文件非常值得阅读。好东西！


    ## 2.2 在线帮助


    除了 Slack 操作系统提供并可安装的文档外，还有大量的在线资源供你学习。


    # 官方网站和帮助论坛


    官方网站¹


    Slack 官方网站有时会过时，但仍然包含与最新版本相关的信息。曾经，那里存在过一个活跃的论坛，直到一群喷子、捣乱者和发牢者入侵了该论坛。维护论坛开始变成一项过量的工作，于是
    Pat 将其关闭了。你可以在那里找到那个重新运行的旧论坛，带有旧数据的可搜索存档。


    在论坛被关闭后，Pat 选择了 linuxquestions.org 作为 Slack Linux 的官方论坛。


    # 电子邮件支持


    每个购买了官方 CD 的人都有权通过开发者的电子邮件获得免费的安装支持。尽管如此，请记住，我们开发者（以及 Slack 的绝大多数用户）都是“老派”的。这意味着我们更倾向于帮助那些有诚意兴趣并在过程中愿意自力为之的人。我们会尽力帮助向我们发送支持问题邮件的人。然而，在发送电子邮件之前，请检查你的文档和网站（特别是
    FAQs 以及下文列出的某些论坛）。这样你可能会获得更快的回答，而且我们需要回答的邮件越少，显然我们就能更快地为那些需要帮助的人提供援助。


    技术支持的电子邮件地址是：support@slackware.com。其他电子邮件地址和联系方式列在网站上。


    # Slack Linux 邮件列表


    我们有邮件列表，提供摘要（digest）和普通格式。查看如何订阅的说明。


    > 1 http://www.slackware.com


    '
