    # 6.5 xdm


    As Linux becomes more and more useful as a desktop operating system, many users
    find it desirable for the machine to boot straight into a graphical environment.
    For this, you will need to tell Slack to boot straight into X, and assign a graphical
    login manager. Slack ships with three graphical login tools, xdm(1), kdm, and
