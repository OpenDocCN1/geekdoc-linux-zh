    # The Official Website and Help Forums


    The Official Slack Website¹


    The Official Slack Linux website is sometimes out of date, but still contains
    information relevant to the latest Slack versions. At one time an active forum
    existed there before a horde of trolls, troublemakers, and whiners descended on
    the forum. Maintaining the forum was beginning to be too much work, and Pat shut
    it down. One can find that old forum back up and running with searchable archives
    of the old data at http://www.local.com/phorum/.


    After the forums were taken down on http://slack.com, several other sites sprang
    up with forum support for Slack. After much thought, Pat chose to endorse www.linuxquestions.org
    as the official forum for Slack Linux.


    # E-mail Support


    Everyone who purchases an official CD is entitled to free installation support
    via e-mail from the developer. That having said, please keep in mind that we,
    the developers, (and a vast majority of users) of Slack are of ‘The Old School’.
    That means that we prefer to help those who have a sincere interest and are willing
    to help themselves in the process. We will always do our best to help everyone
