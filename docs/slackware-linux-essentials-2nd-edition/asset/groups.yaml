    # 第17 章

    Emacs


    虽然 *vi*（及其克隆版本）无疑是 Unix 类系统上最通用的编辑器，但 Emacs 紧随其后。Emacs并不像 vi 那样使用不同的“模式”，而是使用
    **Control** 和 **Alt** 键组合来输入命令，这与你在文字处理器以及实际上许多其他应用程序中使用 **Control** 和 **Alt**
    键组合来执行某些功能非常相似。（但需要注意的是，这些命令很少对应；因此虽然现代应用程序使用 Ctrl-C/X/V 进行复制、剪切和粘贴，但 Emacs 使用不同的键，并且实际上使用某种完全不同的机制。）


    此外，与 *vi* 不同，vi 只是一个（优秀的）编辑器且仅此而已，而 Emacs 是一个功能几乎无限的程序。Emacs（大部分）是用 Lisp 编写的，Lisp
    是一种非常强大的编程语言，它有一个奇属性：用它编写的每个程序都会自动成为自己的 Lisp 编译器。这意味着用户可以扩展 Emacs，事实上可以在“Emacs
    内部”编写完全新的程序。


    因此，Emacs 不仅仅是一个编辑器了。Emacs 有许多可用的扩展包（许多随程序源码提供），它们提供了各种功能。其中许多与文本编辑有关，这毕竟是 Emacs
    的基本任务，但它并不局限于此。例如，Emacs 还有几个电子表格程序，有数据库、游戏和新闻客户端（其中一个是 Gnus）等。


    Emacs 有两个主要版本：GNU Emacs（*Slackware* 附带的版本）和 XEmacs。后者**并不是**运行在 X 环境下的 Emacs 版本。事实上，Emacs
    和 XEmacs 都可以都运行在控制台上，因为 XEmacs 曾是作为一个清理 Emacs 代码的项目启动的。目前，两个版本都在被积极开发，而且两个开发团队之间实际上有大量的互动。对于本章，使用
    Emacs 还是 XEmacs 并不重要，它们之间的差异对普通用户来说并不相关。


    ## 17.1 启动 emacs


    可以通过在 shell 中直接输入 emacs 来启动 Emacs。当你运行 X 时，Emacs 会（通常）弹出一个自己的 X 窗口，顶部通常有一个菜单栏，你可以在那里找到最重要的功能。启动时，Emacs
    会首先显示欢迎信息，几秒后将你带 *scratch* 缓冲区。（参见第 17.2 节。）


