    # Chapter 9 Filesystem Structure


    ```

    ls -l /tmp/example

    -rwxr-xr-x 1 david  users  0 Apr 19 11:21 /tmp/example

    ```


    Now you may be thinking, “Why didn’t it create a file in the first place?” The
    answer is simple, bash includes a nice little built-in called umask. This is included
    with Unix shells as well, and controls what file permissions are assigned to newly
    created files. We discussed bash built-ins to some degree in Section 8.3.1. umask
    takes a little getting used to. It works very similar to chmod, only in reverse.
    You specify the octal values you do not wish to have present in newly created
    files. The default umask is 0022.


    ```

    umask

    0022

    umask 0077

    touch tempfile

    ls -l tempfile

    -rw------- 1 david  users  0 Apr 19 11:21 tempfile

    ```


    See the man page for bash for more information.


    To set special permissions with chmod, add the numbers together and place them
    in the first column. For example, to make it set user ID and set group ID, we
    use 6 as the first column:


    ```

    chmod 6755 /tmp/example

    ls -l /tmp/example

    -rws-sr-x 1 david  users  0 Apr 19 11:21 /tmp/example

    ```


    If the octal values confuse you, you can use letters with chmod. The permission
    groups are represented as:


    | Owner | u |

    | Group | g |

    | World | o |

    | All of the above | a |'
  - '[PAGE 136]


    # Chapter 9 Filesystem Structure


    To do the above, we would have to use several command lines:


    ```

    % chmod a+rx /tmp/example

    % chmod u+w /tmp/example

    % chmod ug+s /tmp/example

    ```


    Some people prefer the letters over the numbers. Either way will result in the
    same set of permissions.


    The octal format is even faster, and the one you see most used in shell scripts.
    Sometimes the letters are more powerful. For example, there’s no easy way to change
    one group of permissions while preserving the other groups on files and when using
    the octal format. This is trivial with the letters.


    ```

    % ls -l /tmp/

    --rw-xr-x 1 alan users 0 Apr 19 11:21 /tmp/example0

    --rw-xr-x 1 alan users 0 Apr 19 11:21 /tmp/example1

    ---r--r-- 1 alan users 0 Apr 19 11:21 /tmp/example2

    % chmod g-w /tmp/example?

    --rw-r--x 1 alan users 0 Apr 19 11:21 /tmp/example0

    --rw------ 1 alan users 0 Apr 19 11:21 /tmp/example1

    ---r--r-- 1 alan users 0 Apr 19 11:21 /tmp/example2

    ```


    We mentioned user ID and set group ID permissions in several places above. You
    may be wondering what this is. Normally when you run a program, it is operating
    under your user account. That is, it has all the permissions that you have as
    a user. The same is true for the group. When you run a program, it executes under
    your current program. With set user ID you can force the program to always run
    as the program owner (such as ‘root’). Set group ID is the same, but for the group.


    Be careful with this, set user ID and set group ID programs can open major security
    holes on your system. If you frequently set user ID programs that are owned by
    root, you are allowing anyone to run that program and run it as root. root has
    no restrictions on the system, you can see how this would pose a major security
    problem. In short, it’s not bad to use user ID and set group ID permissions, just
    use common sense.


