  - '[PAGE 145]


    # Chapter 10 Handling Files and Directories


    # pwd


    The pwd command is used to show your current location. To use the pwd command
    just type pwd. For example:


    ```

    % cd /bin

    % pwd

    /bin

    % cd /usr

    % cd bin

    % pwd

    /usr/bin

    ```


    # 10.2 Pagers: more, less, and most


    # more


    more(1) is what we call a pager utility. Oftentimes the output of a particular
    command is too big to fit on one screen. The individual commands do not know how
    to fit their output to separate screens. They leave this job to the pager utility.


    The more command breaks the output into individual screens and waits for you to
    press the space bar before continuing on to the next screen. Pressing the enter
    key will advance the output one line. Here is a good example:


    ```

    % cd /usr/bin

    % ls -1

    ```


    That should scroll for a while. To break up the output by screen, just pipe it
    through more:


    ```

    % ls -1 | more

    ```'
  - '[PAGE 146]


    # Chapter 10 Handling Files and Directories


    That is the pipe character (shift backslash). The pipe is short for saying the
    output of `ls` and feed it into `more`. You can pipe just about anything through
    the `more` command, not just `ls`. Piping is also covered in Section 8.2.3.


    # less


    The `more` command is quite handy, but often you will find that you have advanced
    the screen you wanted. more does not provide a way to go back. The `less(1)` command
    provides this functionality. It is used in the same way as the `more` command,
    so, `less` is more than `more`. Joost Kremers puts it in this way:


    > `less` is more, but more `more` than `more` is, so `more` is less `less`, use
    more `less` if you want less `more`.


    # most


    Where `more` and `less` leave off, `most(1)` picks back up. If `less` is more
    than `more`, `most` is more than `less`. Whereas the other pagers can only display
    one file at a time, `most` is capable of viewing any number of files, as long
    as each file’s window is at least 2 lines long. `most` has a lot of options, check
    the man page for full details.


    # 10.3 Simple Output: cat and echo


    # cat


    `cat(1)` is short for ‘concatenate’. It was originally designed to merge text
    files into one, but can be used for many other purposes.


    To merge two or more files into one, you simply list the files after the `cat`
    command and then redirect the new output to a file. `cat` works with standard
    input and standard'
  - '[PAGE 147]


    output, so you have to use the shell redirection characters. For example:


    ```

    % cat file1 file2 > bigfile

    ```


    This command takes the contents of file1, file2, and file3 and merges it all together.

    The new output is sent to standard out.


    One can also use cat to display files. Many people cat text files through the
    more or less commands, like this:


    ```

    % cat file1 | more

    ```


    That will display the file1 file and pipe it through the more command so that
    you only get one screen at a time.


    Another command to use cat for copying files. You can copy any file around with
    cat, like this:


    ```

    % cat /bin/bash > ~/mybash

    ```


    The /bin/bash program is copied to your home directory and named mybash.

    cat has many uses and the ones discussed here are just a few. Since cat makes
    extensive use of standard input and standard output, it is ideal for use in shell
    scripts or part of other complex commands.


    # echo


    The echo(1) command displays the specified text on the screen. You specify the
    string to display after the echo command. By default echo will display the string
    and print a newline character after it. You can pass the -n option to suppress
    the printing of the newline. The -e option will cause echo to search for escape
    characters in the string and execute them.'
- md: "\n# Chapter 10 Handling Files and Directories\n\n## 10.4 Creation: touch and\
    \ mkdir\n\n### touch\n\ntouch(1) is used to change the timestamp on a file. You\
    \ can change access timestamps and modification timestamps with this command.\
    \ If the file specified does not exist, touch will create a zero length file with\
    \ the name specified. To mark a file with the current system time, you would issue\
    \ this command:\n\n```\n$ ls -al file\n-rw-r--r-- 1 root 9779 Feb 7 21:41 file\n\
    $ touch file\n$ ls -al file\n-rw-r--r-- 1 root 9779 Feb 8 09:17 file\n```\n\n\
    There are several options for touch, including options to specify which timestamp\
    \ to modify, the time to use, and many more. The online manual page discusses\
    \ these in detail.\n\n### mkdir\n\nmkdir(1) will create a new directory. You simply\
    \ specify the directory to create when you run mkdir. This example creates the\
    \ hejaz directory in the current directory:\n\n```\n$ mkdir hejaz\n```\n\nYou\
    \ can also specify a path, like this:\n\n```\n$ mkdir /usr/local/hejaz\n```\n\n\
    The -p option will tell mkdir to make any parent directories. The above example\
    \ will fail if /usr/local does not exist. The -p option will create /usr/local\
    \ and /usr/local/hejaz:\n\n```\n% mkdir -p /usr/local/hejaz\n```\n\n## 10.5 Copy\
    \ and Move\n\n### cp\n\ncp(1) copies files. DOS users will notice its similarity\
    \ to the copy command. There are many options for cp, so you should have a look\
    \ at the man page before using it.\nA common use is to use cp to copy a file from\
    \ one location to another. For example:\n\n```\n% cp hejaz /tmp\n```\n\nThis copies\
    \ the hejaz file from the current directory to the /tmp directory.\n\nMany users\
    \ prefer to keep the timestamps preserved, as in this example:\n\n```\n% cp -a\
    \ hejaz /tmp\n```\n\nThis ensures that the timestamps are not modified in the\
    \ copy.\n\nTo recursively copy the contents of a directory to another directory,\
    \ you would issue this command:\n\n```\n% cp -R mydir /tmp\n```\n\nThat will copy\
    \ the mydir directory to the /tmp directory.\n\nAlso if you wish to copy a directory\
    \ or a file and keep all its old permissions time stamps and keep it exactly the\
    \ same use cp -p.\n\n```\n% ls -l file\n-rw-r-- 1 root vlad 4 Jan 1 15:27 file\n\
    % cp -p file /tmp\n% ls -l /tmp/file\n-rw-r-- 1 root vlad 4 Jan 1 15:27 file\n\
    ```\n\ncp has many more options that are discussed in detail in the online manual\
    \ page. \n\n### mv\n\nmv(1) moves files from one place to another. Sounds simple\
    \ enough, doesn't it?\n\n```\n% mv oldfile /tmp/newfile\n```\n\nmv has a few command\
    \ line options that are detailed in the man page. In practice, mv is almost never\
    \ used with commandline options.\n\n## 10.6 Deletion: rm and rmdir\n\n### rm\n\
    \nrm(1) removes files and directory trees. DOS users will notice the similarity\
    \ to both del and deletree commands. rm can be very dangerous if you do not watch\
    \ yourself. While it is sometimes possible to retrieve a recently deleted file,\
    \ it can be complicated (and potentially costly) and is beyond the scope of this\
    \ book.\n\nTo remove a single file, specify its name when you run rm:\n\n```\n\
    % rm file1\n```\n\nIf the file has write permissions removed, you may get a permission\
    \ denied error message. To force removal of the file no matter what, pass the\
    \ -f option, like this:\n\n```\n% rm -f file1\n```\n\nTo remove an entire directory,\
    \ you use the -r and -f options together. This is a good example of how to delete\
    \ the entire contents of your hard drive. You really don’t want to do this. But\
    \ here’s the command anyway:\n\n```\n# rm -rf /\n```\n\nBe very careful with rm;\
    \ you can shoot yourself in the foot. There are several command line options,\
    \ which are discussed in detail in the online manual page.\n\n### rmdir\n\nrmdir(1)\
    \ removes directories from the filesystem. The directory must be empty before\
    \ it can be removed. The syntax is simply:\n\n```\n# rmdir <directory>\n```\n\n\
    This example will remove the hejaz subdirectory in the current working directory:\n\
    \n```\n# rmdir hejaz\n```\n\nIf that directory does not exist, rmdir will tell\
    \ you. You can also specify a full path to a directory to remove, as this example\
    \ shows:\n\n```\n# rmdir /tmp/hejaz\n```\n\nThat example will try to remove the\
    \ hejaz directory inside the /tmp directory.\n\nYou can also remove a directory\
    \ and all of its parent directories by passing the -p option.\n\n```\n# rmdir\
    \ -p /tmp/hejaz\n```\n\nThis will first try to remove the hejaz directory inside\
    \ /tmp. If that is successful, will try to remove /tmp. rmdir will continue this\
    \ until an error is encountered or the entire tree specified is removed.\n\n##\
    \ 10.7 Aliasing files with ln\n\nln(1) is used to create links between files.\
    \ These links can be either hard or soft (symbolic). The differences between the\
    \ two were discussed in Chapter 9.\n\n# Chapter 11 Process Control\n\nEvery program\
    \ that is running is a process. These processes range from system (daemons) to\
    \ programs started by users. Every process has a unique ID, called a PID. When\
    \ a process is started, it becomes a child of the process that started it. The\
    \ process that started it is called the parent process.\n\nProcesses can be controlled\
    \ and monitored through signals. \n\n## 11.1 Backgrounding\n\nIf you need the\
    \ program to run without taking up your terminal, this is called running in the\
    \ background, and there are a few ways to do it.\n\nThe first way to background\
    \ a process is by adding an ampersand to the command line when you start the program.\
    \ For example, assume you wanted to use a player to play a directory full of mp3,\
    \ but you needed to do something else on the same terminal. The following command\
    \ would start it in the background:\n\n```\n$ player &\n```\n\nThe program will\
    \ run as normal, and you are returned to a prompt. The other way to background\
    \ a process is to do so while it is running. First, start a program. While it\
    \ is running, hit Ctrl+Z. This suspends the process. A suspended process is basically\
    \ paused. It momentarily stops running, but can be started again at any time.\
    \ Once you have suspended a process, you are returned to a prompt. You can background\
    \ the process by typing:\n\n```\n$ bg\n```\n\nNow the suspended process is running\
    \ in the background.\n\n## 11.2 Foregrounding\n\nIf you need to interact with\
    \ a backgrounded process, you can bring it back into the foreground. If you've\
    \ only got one backgrounded process, you can bring it back by typing:\n\n```\n\
    $ fg\n```\n\nIf the program is not done running, the program will take control\
    \ over your terminal and you will not be returned to a prompt. Sometimes, the\
    \ program will finish running while backgrounded. In this instance, you'll get\
    \ a message like this:\n\n```\n[1]+ Done    /bin/ls $LS_OPTIONS\n```\n\nThat tells\
    \ you that the backgrounded process (in this case ls) has completed. It is possible\
    \ to have several processes backgrounded at once. When this happens, you'll need\
    \ to know which process you want to bring back to the foreground. Just typing\
    \ fg will foreground the process that was last backgrounded. What if you had a\
    \ whole list of processes in the background? Luckily, bash includes a command\
    \ to list all the processes. It's called jobs and gives output like so:\n"
  mdcn: "\n\n# 第 10 章 处理文件和目录\n\n## 10.4 创建：touch 和 mkdir\n\n### touch\n\ntouch(1)\
    \ 用于更改文件的时间戳。你可以使用此命令更改访问时间和修改时间戳。如果指定的文件不存在，touch 将创建一个指定名称的长度为 0 的文件。要用当前系统时间标记一个文件，可以执行此命令：\n\
    \n```\n$ ls -al file\n-rw-r--r-- 1 root 9779 Feb 7 21:41 file\n$ touch file\n\
