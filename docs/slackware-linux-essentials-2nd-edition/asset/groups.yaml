    ```\n\n你需要确保已经创建了分区。第一个分区将是我们的交换分区（swap partition）。我们告诉 fdisk 将编号为 1 的分区作为主分区。我们从扇道\
    \ 0 开始，并在结束扇道处输入 `+64M`。这将为我们提供一个 64 兆的交换分区（你需要的交换分区的大小取决于你的 RAM 内存。通常的做法是创建一个比\
    \ RAM 大两倍的交换空间）。然后我们定义 2 号主分区，从第一个可用扇道开始一直到硬盘末尾。\n\n```\nCommand (m for help):**n**\n\
    Command action\n  e extended\n  p primary partition (1-4)\n**p**nPartition number\
    \ (1-4):**2**\nFirst cylinder (124-1060, default 124):**124**\nLast cylinder or\
    \ +size or +sizeM or +sizeK (124-1060, default 1060):**1060**\n```\n\n我们几乎就完成了。我们需要将第一个分区的类型更改为类型\
