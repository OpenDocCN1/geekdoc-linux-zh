    # Chapter 11


    # Process Control


    Every program that is running is called a process. These processes range from
    things like the X Window System to system programs (daemons) that are started
    when the computer boots. Every process runs as a particular user. Processes that
    are started at boot time usually run as root or nobody. Processes that you start
    will run as you. Processes started as other users will run as those users.


    You have control over all the processes that you start. Additionally, root has
    control over all processes on the system, including those started by other users.
    Processes can be controlled and monitored through several programs, as well as
    shell commands.


    # 11.1 Backgrounding


    Programs started from the command line start up in the foreground. This allows
    you to see all the output of the program and interact with it. However, there
    are several occasions when you''d like the program to run without taking up your
    terminal. This is called running the program in the background, and there are
    a few ways to do it.


    The first way to background a process is by adding an ampersand to the command
    line when you start the program. For example, assume you wanted to use the command
    line mp3 player amp to play a directory full of mp3s, but you needed to do something
    else on the same terminal. The following command line would start up amp in the
    background:


    ```

    $ amp *.mp3 &

    ```'
  - '[PAGE 155]


    # Chapter 11 Process Control


    The program will run as normal, and you are returned to a prompt.

    nThe other way to background a process is to do so while it is running. First,
    start up a program. While it is running, hit Control+.z. This suspends the process.
    A suspended process is basically paused. It momentarily stops running, but can
    be started up again at any time. Once you have suspended a process, you are returned
    to a prompt. You can background the process by typing:


    ```

    $ bg

    ```


    Now the suspended process is running in the background.


    # 11.2 Foregrounding


    If you need to interact with a backgrounded process, you can bring it back into
    the foreground. If you''ve only got one backgrounded process, you can bring it
    back by typing:


    ```

    $ fg

    ```


    If the program is not done running, the program will take control over your terminal
    and you will not be returned to a prompt. Sometimes, the program will finish running
    while backgrounded. In this instance, you''ll get a message like this:


    ```

    [1]+ Done    /bin/ls $LS_OPTIONS

    ```


    That tells you that the backgrounded process (in this case ls - not terribly interesting)
    has completed.


    It is possible to have several processes backgrounded at once. When this happens,
    you''ll need to know which process you want to bring back to the foreground. Just
    typing fg will foreground the process that was last backgrounded. What if you
    had a whole list of processes in the background? Luckily, bash includes a command
    to list all the processes. It''s called jobs and gives output like so:'
- md: '

    ```

    % jobs

    [1] Stopped vim

    [2]- Stopped amp

    [3]+ Stopped man ps

    ```


    This shows you a list of all the processes that are backgrounded. As you can see,
    they are all stopped. This means that the processes are suspended. The number
    is a sort of ID for all the backgrounded processes. The ID with a plus sign beside
    it (man ps) is the process that will be foregrounded if you just type `fg`.


    If you wanted to foreground `vim`, you would type:


    ```

    % fg 1

    ```


    and `vim` would spring back up to the console. Backgrounding processes can be
    very useful if you only have one terminal open over a dialup connection. You can
    have several programs running on that terminal, periodically switching back and
    forth between them.


    ## 11.3 ps


    So now you know how to switch back and forth between several processes you''ve
    started from the command line. And you also know that there are lots of processes
    running all the time. So do you list all of these programs? Well, you make use
    of the `ps(1)` command. This command has a lot of options, so we''ll only cover
    the most important ones here. For a complete listing, see the man page for ps.
    pages are covered in-depth in Section 2.1.1.


    Simply typing `ps` will get you a listing of the programs running on your terminal.
    This includes the foreground processes (which include whatever shell you are using,
    and of course, `ps` itself). Also listed are backgrounded processes you may have
    running. Many times, that will be a very short listing:


    ### Figure 11-1. Basic ps output


    ```

    $ ps

    PID TTY TIME CMD

    7923 tty0 00:00:00 bash

    8059 tty0 00:00:00 ps

    ```


    Even this is not a lot of processes, the information is very typical. You’ll get
    the same columns using regular ps no matter how many processes are running. What
    does it all mean?


    Well, the PID is the process ID. All running processes are given a unique identifier
    which ranges between 1 and 32767. Each process is assigned the free PID. When
    a process quits (or is killed, as you will see in the next section), it gives
    up its PID. When the max PID is reached, the next free one will wrap back to the
    lowest one ever.


    The TTY column indicates which terminal the process is running on. Doing a plain
    ps will only list the programs running on the current terminal, so all the processes
    give the same information in the TTY column. As you can see, both processes are
    running on typ0. This indicates that they are either running remotely or from
    an X terminal of some variety.


    The TIME column indicated how much CPU time the process has been running. This
    is different from the actual amount of time that a process runs. Remember Linux
    is a multitasking operating system. There are many processes running all the time,
    and these processes each get a small portion of the process’s time. So, the TIME
    column should show much less time for each process than it actually takes to run.
    If you see more than several minutes in the TIME column, it could mean something
    is wrong.


    Finally, the CMD column shows what the program actually is. It only lists the
    base name of the program, not any command line options or similar information.
    To get that information, you’ll need to use one of the many options to ps. We’ll
    discuss that shortly.


    You can get a complete listing of the processes running on your system using the
    right combination of options. This will probably result in a long listing of processes
    (fifty-five on my laptop as I write this sentence), so I''ll abbreviate the output:


    ```

    % ps -ax

    PID TTY     STAT TIME COMMAND

    1 ?       S    0:03 init [3]

    2 ?       SW   0:13 [kflush]

    3 ?       SW   0:14 [kupdate]

    4 ?       SW   0:00 [kpiod]

