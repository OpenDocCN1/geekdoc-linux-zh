    # 13.10 Talking to Other People


    ## wall


    wall(1) is a quick way to write a message to the users on a system. The basic
    syntax is:


    ```

    % wall [file]

    ```


    This will result in the contents of [file] being displayed on the terminals of
    all currently logged in users. If you don''t specify a file, wall will read from
    standard input, so you can just type your message, and end with Ctrl+d.


    wall doesn’t have many features, and apart from letting your users know you’re
    about to do some serious maintenance to the system, or even reboot it, so they
    have time to save their work and log off :)


    ## talk


    talk(1) allows two users to chat. It splits the screen in half, horizontally.
    To request a chat with another user, use this command:


    ```

    % talk <person> [ttyname]

    ```


    Chapter 13 Basic Network Commands


    ### Figure 13-7. Two users in a talk session


    ![](img/1d848cb703597efcdc9149b6ee756285_199_0.png)


    If you specify just a username, the chat request is assumed to be local, so only
    local users are queried. The ttyname is required if you want to ring a user on
    a specific terminal (if the user is logged in more than once). The required information
    for talk can be obtained from the w(1) command.


    talk can also ring users on remote hosts. For the username you simply specify
    an email address. talk will try to contact remote user on that host.

    talk is somewhat limited. It only supports two users and is half-duplex.


    ## ytalk


    ytalk(1) is a backwards compatible replacement for talk. It comes with Slackware
    as the ytalk command. The syntax is similar, but has a few differences:


    ```

    % ytalk <username>[#tttyname]

    ```


    Figure 13-8. Two users in a ytalk session


    ```

    ================ YTalk version 3.1.1 ==

    test


    n= root@192.168.1.132#tty1 =

    this is a test

    ```


    The username and terminal are specified the same as under talk, except you must

    put them together with the hash mark (#).


    ytalk offers several advantages:


    - It supports more than two users.

    - A menu of options that can be brought anytime with Esc.

    - You can shell out while still in the talk session.

    - Plus more...


    If you''re a server administrator, you''ll want to make sure that the ntalk port
    is enabled in /etc/inetd.conf. ytalk needs that to work properly.


    # Security


    Security on any system is important; it can prevent people launching attacks from
    your machine, as well as protect sensitive data. This chapter is all about how
    to start securing your Slack box against script kiddies, crackers and rogue hamsters
    alike. Bear in mind that this is only the start of securing a system; security
    is a process, not a state.


    ## 14.1 Disabling Services


    The first step after installing Slackware should be to disable any services you
    don''t need. Any services could potentially pose a security risk, so it is important
    to run as few services as possible (i.e. only those that are needed). Services
    are started from two main places - inetd and init scripts.


    ### Services started from *inetd*


    A lot of the daemons that come with Slackware are run from *inetd(8)*. inetd is
    a daemon that listens on all the ports used by services configured to be started
    by it and spawns an instance of the relevant daemon when a connection attempt
    is made. Daemons started from *inetd* can be disabled by commenting out the relevant
    lines in /etc/inetd.conf. To do this, open this file in your favorite editor (e.g.
    vi) and you should see lines similar to this:


    ```

    telnet stream tcp nowait root /usr/sbin/tcpd in.telnetd

    ```


    You can disable this service, and any others you don''t need, by commenting them
    out (i.e. adding a # (hash) symbol to the beginning of the line). The above line
    will then become:


    ```

    #telnet stream tcp nowait root /usr/sbin/tcpd in.telnetd

    ```


    After inet has been restarted, this service will be disabled. You can restart
    inet with the command:


    ```

    # kill -HUP $ (cat /var/run/inetd.pid)

    ```


    ### Services started from init scripts


    The rest of the services started when the machine starts are started from the
    init scripts in /etc/rc.d/. These can be disabled in two different ways, the first
    being to remove the execute permissions on the relevant init script and the second
    being to comment out the relevant lines in the init scripts.


    For example, SSH is started by its own init script at /etc/rc.d/rc.sshd. You can
    disable this using:


    ```

    # chmod -x /etc/rc.d/rc.sshd

    ```


    For services that don''t have their own init script, you will need to comment
    out the relevant lines in the init scripts to disable them. For example, the portmap
    daemon is started by the following lines in /etc/rc.d/rc.inet2:


    ```

    # This must be running in order to mount NFS volumes.

    # Start the RPC portmapper:

    if [ -x /sbin/rpcmap ]; then

    echo "Starting RPC portmapper: /sbin/rpcmap"

    /sbin/rpcmap

    fi

    # Done starting the portmapper.

    ```


    This can be disabled by adding # symbols to the beginnings of the lines that don''t
    start with them, like:


    ```

    # This must be running in order to mount NFS volumes.

    # Start the RPC portmapper:

    # if [ -x /sbin/rpcmap ]; then

    # echo "Starting RPC portmapper: /sbin/rpcmap"

    # /sbin/rpcmap

    # fi

    ```


    These changes will only take effect after either a reboot or changing from runlevel
    3 or 4. You can do this by typing the following on the console (you will need
    to log in again after changing to runlevel 1):


    - telinit 1

    - telinit 3


    ## 14.2 Host Access Control


    ### iptables


    iptables is the packet filtering program for Linux 2.4 and above. The 2.4 kernel
    (to be exact) was first introduced into Slackware (as an option) in version 8.0
    and was made the default in Slackware 8.1. This section only covers its usage
    and you should check http://www.netfilter.org/ for more details. commands can
    be entered into /etc/rc.d/firewall, Note that iptables has to be set executable
    for these rules to take effect at startup. commands can essentially lock you out
    of your own machine. Unless you are 100% confident in your skills, ensure you
    have local access to the machine. The first thing most people should do is set
    the default policy for each chain to DROP:


    ```

    iptables -P INPUT DROP

    iptables -P FORWARD DROP

    ```


    When everything is denied, you can start allowing things. The first thing to allow
    is any traffic for sessions which are already established:


    ```

    iptables -A INPUT -m state ESTABLISHED,RELATED -j ACCEPT

    ```


    So as not to break any applications that communicate using the loopback address,
    it is usually wise to add a rule like this:


    ```

    iptables -A INPUT -s 127.0.0/8 -d 127.0.0/8 -i lo -j ACCEPT

    ```


    This allows any traffic to and from 127.0.0/8 (127.0.0.255) on the loopback (lo)
    interface. When creating rules, it is a good idea to be specific as possible,
    to make sure that your rules do not inadvertently anything evil. That said, rules
    that allow too little mean more typing.


    The next thing to do would be to allow access to specific services running on
    your machine. If, for example, you wanted to run a web server on your machine,
    you would use a rule like this:


    ```

    iptables -A INPUT -p tcp --dport 80 -i ppp0 -j ACCEPT

    ```


    This will allow access from any machine to port 80 on your machine via the ppp0
    interface. You may want to restrict access to this service so that only certain
    machines can access it. This rule allows access to your web service from 64.57.102.34:


    ```

    iptables -A INPUT -p tcp -s 64.57.102.34 --dport 80 -i ppp0 -j ACCEPT

    ```


    Allowing ICMP traffic can be useful for diagnostic purposes. To do this, you would
    use a rule like this:


    ```

    iptables -A INPUT -p icmp -j ACCEPT

    ```


    Most people will also want to set up Network Address Translation (NAT) on their
    gateway machine, so that other machines on their network can access the Internet
    through it. You would use the following rule to do this:


    ```

    iptables -t nat -A POSTROUTING -o ppp0 -j MASQUERADE

    ```


    You will also need to enable IP forwarding. You can do this temporarily, using
    the following command:


    ```

    # echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    To enable IP forwarding on a more permanent basis (i.e. so that the change is
    kept after a reboot), you will need to open the file /etc/rc.d/rc.inet2 in your
    favorite editor and change the following line:


    ```

    IPV4_FORWARD=0

    ```


    ...to this:


    ```

    IPV4_FORWARD=1

    ```


    For more information on NAT, see the NAT HOWTO.


    ## tcpwrappers


    tcpwrappers controls access to daemons at the application level, rather than at
    the IP level. This can provide an extra layer of security at times when IP-level
    access controls (e.g. Netfilter) are not functioning correctly. For example, if
    you recompile the kernel but forget to include iptables support, your IP level
    protection will fail but tcpwrappers will still help protect your system.


    Access to services protected by tcpwrappers can be controlled using /etc/hosts.allow
    and /etc/hosts.deny.


    The majority of people would have a single line in the /etc/hosts.deny file to
    deny access to all daemons by default. This line would be:


    ```

    :: all

    ```

