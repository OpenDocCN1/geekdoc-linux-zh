    ```

    zip -r foo *

    ```


    Decompressing files is easy, as well.


    ```

    unzip foo.zip

    ```


    This will extract all the files in the file foo.zip, including any directories
    in the archive.


    The zip utilities have several advanced options for creating self-extracting archives,
    leaving out files, controlling compressed file size, printing out what will happen,
    and much more. See the man pages for zip and unzip to find out how to use these
    options.'
