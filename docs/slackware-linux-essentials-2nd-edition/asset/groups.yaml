    ### 1.9 FTP Clients


    FTP stands for File Transfer Protocol. It allows you to send and receive files
    between two computers. There is the FTP server and the FTP client. We discuss
    the client in this section. For the curious, the “client” is you. The “server”
    is the computer that answers your request and lets you download and upload files
    to the server. The client cannot accept connections, it can only connect to servers.
    To connect to an FTP server, simply run ftp <hostname> <port>. If the host is
    running an FTP server, it will ask for a username and password. You can log in
    as yourself or as ‘anonymous’. Anonymous sites are very popular for software archives.
    For example, get Slackware via FTP, you must use anonymous FTP. Once connected,
    you will be at the ftp prompt. There are special commands for FTP, but they are
    similar to standard commands. The following shows some of the basic commands and
    what they do:


    Table 13-1. ftp commands


    | Command | Purpose |

    |---|---|

    | ls | List files |

    | cd <dirname> | Change directory |

    | bin | Set binary mode |

    | ascii | Set ASCII mode |

    | get <filename> | Download a file |

    | put <filename> | Upload a file |

    | hash | Toggle hash stats |

    | tick | Toggle byte counter indicator |

    | prom | Toggle interactive mode for downloads |

    | mget <mask> | Download a file or group of files; wildcards are allowed |

    | mput <mask> | Upload a file or group of files; wildcards are allowed |

    | quit | Log off the server |


    You can also use some of the following commands which are quite self-explanatory:
    chmod, delete, rename. For a complete list of commands and their meaning, just
    type help to see a complete list on screen. FTP is a simple program to use, but
    lacks the user interface that many of us are used to nowadays. The man page discusses
    some of the line options for ftp(1).


    ## ncftp


    ncftp (pronounced "Nik-F-T-P") is an alternative to the traditional ftp client
    that comes with Slackware. It is still a text-based program, but offers many advantages
    over ftp, including:


    - Tab completion

    - Bookmarks file

    - More liberal wildcard uses

    - Command history


    By default, ncftp will try to log anonymously to the server you specify. You can
    force ncftp to present a login prompt with the "-u" option. Once logged in, you
    can use the same commands in ftp, only you''ll notice a nicer interface, one that
    works more like bash.


    ```

    ncftp /pub/linux/slackware > cd slackware-current/

    it last modified on Wed Jun 19 16:24:21 2002 - 258 days ago

    CWD command successful.

    cd .. ...ware/slackware-current > ls

    BOOTING.TXT FAQ.TXT bootdisks/

    CHECKSUMS FILELIST.TXT extra/

