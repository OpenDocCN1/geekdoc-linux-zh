    The LInux LOader. LILO is the most widely-used Linux boot manager.'
  - '[PAGE 256]


    # LOADLIN


    LOADLIN is a program that runs under MS DOS or Windows and boots a Linux system.
    It is most commonly used on computers with multiple operating systems (including
    Linux and DOS/Windows, of course).


    # Man section


    Pages in the standard Unix online manual ("man") are grouped into sections for
    easy reference. All C programming pages are in section 3, system administration
    pages in section 5, etc.


    # MBR


    The Master Boot Record. A reserved space on a hard drive where information on
    what to do when booting is stored. LILO or other boot managers can be written
    here.


    # Motif


    A popular programming toolkit used in many older X programs.


    # MOTD


    Message of the Day. The motd (stored in Linux in /etc/motd) is a text file that
    is displayed to all users upon logging in. Traditionally, it is used by the system
    administrator as a sort of ‘bullet board” for communicating with users.'
  - '[PAGE 257]


    # Mount point


    An empty directory in a filesystem where another filesystem is to be ‘mounted’,
    or grafted on.


    # Nameserver


    A DNS information server. Nameservers translate DNS names to numerical IP addresses.


    # Network interface


    A virtual representation of a network device provided by the kernel. Network interfaces
    allow users and programs to talk to network devices.


    # NFS


    The Network Filesystem. NFS allows the mounting of remote filesystems as if they
    were local to your computer and thus provides a transparent method of file sharing.


    # Octal


    Base-8 number system, with digits 0-7.


    # Pager


    An X program that allows the user to see and switch between multiple ‘desktops’.'
  - '[PAGE 258]


    # Partition


    A division of a hard drive. Filesystems exist on top of partitions.


    # PPP


    Point-to-Point Protocol. PPP is used mainly for connecting via modem to an Internet
    Service Provider.


    # Process


    A running program.


    # Root directory


    Represented as “”, the root directory exists at the top of the filesystem, with
    all other directories branching beneath it in a “file tree”.


    # Root disk


    The disk (usually fixed) on which the root directory is stored.


    # Routing table


    The set of information the kernel uses in ‘routing’ network data around. It contains
    such tidbits as where your default gateway is, which network interface is connected
    to which network, etc.'
  - '[PAGE 259]


    # Runlevel


    The overall system state as defined by init. Runlevel 6 is rebooting, runlevel
    1 is ‘single user mode’; runlevel 4 is an X login, etc. There are 6 available
    runlevels on a Slackware system.


    # Secure shell


    An encrypted (thus secure) method of logging in remotely to a computer. Many secure
    shell programs are available; both a client and server are needed.


    # Service


    The sharing of information and/or data between programs and computers from a single
    ‘server’ to multiple ‘clients’, HTTP, FTP, NFS, etc. are services.


    # Shadow password suite


    The shadow password suite allows encrypted passwords to be hidden from users,
    while the rest of the information in the /etc/passwd file remains visible to all.
    This helps prevent brute-force attempts at cracking passwords.


    # Shell


    Shells provide a commandline interface to the user. When you’re looking at a text
    prompt, you’re in a shell.'
  - '[PAGE 260]


    # Shell builtin


    A command built into the shell, as opposed to being provided by an external program.
    For instance, `bash` has a `cd` builtin.


    # Signal


    Unix programs can communicate between each other using simple ‘signals’, which
    are enumerated and usually have specific meanings. `kill -l` will list the available
    signals.


    # SLIP


    Serial Line Interface Protocol. SLIP is a similar protocol to PPP, in that it’s
    used for connecting two machines via a serial interface.


    # Software package


    A program and its associated files, archived and compressed into a single file
    along with any necessary scripts or information to aid in managing the installation,
    upgrade, and removal of those files.


    # Software series


    A collection of related software packages in Slackware. All KDE packages are in
    the ‘kde’ series, networking packages in the ‘h’ series, etc.'
  - '[PAGE 261]


    # Source code


    The (more or less) human-readable code in which most programs are written.

    Source code is compiled into ‘binary’ code.


    # Standard Error (stderr)


    The Unix-standard output stream for errors. Programs write any error messages
    on stderr, so that they can be separated from normal output.


    # Standard Input (stdin)


    The Unix-standard input stream. Data can be redirected or piped into a program’s
    stdin from any source.


    # Standard Output (stdout)


    The Unix-standard output stream. Normal text output from a program is written
    to stdout, which is separate from the error messages reported on stderr and can
    be piped or redirected into other programs’ stdin or to a file.


    # Subnet


    An IP address range that is part of a larger range. For instance, 192.168.1.0
    is a subnet of 192.168.0.0 (where 0 is a mask meaning ‘undefined’); it is, in
    fact, the `:1” subnet.'
  - '[PAGE 262]


    # Superblock


    In Linux, partitions are discussed in terms of blocks. A block is 512 bytes. The
    superblock is the first 512 bytes of a partition.


    # Supplemental disk


    In Slackware, a floppy disk used during installation that contains neither the
    kernel (which is on the boot disk) nor the root filesystem (which is on the disk),
    but additional needed files such as network modules or PCMCIA support.


    # Suspended process


    A process which has been frozen until killed or resumed.


    # Swap space


    Disk space used by the kernel as ‘virtual’ RAM. It is slower than RAM, but because
    disk space is cheaper, swap is usually more plentiful. Swap space is useful for
    holding lesser-used data and as a fallback when physical RAM is exhausted.


    # Symbolic link


    A special file that simply points to the location of another file. Symbolic links
    are used to avoid data duplication when a file is needed in multiple locations.'
  - '[PAGE 263]


    # Tagfile


    A file used by the Slackware setup program during installation, which describes
    a set of packages to be installed.


    # Terminal


    A human-computer interface consisting of at least a screen (or virtual screen)
    and some method of input (almost always at least a keyboard).


    # Toolkit, GUI


    A GUI toolkit is a collection of libraries that provide a programmer with code
    to draw ‘widgets’ such as scrollbars, checkboxes, etc. and construct a graphical
    interface. The GUI toolkit used by a program often defines its ‘look and feel’.


    # UID


    User Identifier. A unique number that identifies a user to the system. UIDs are
    used by most programs instead of usernames because a number is easier to deal
    with; usernames are generally only used when the user has to see things happen.


    # VESA


    Video Electronics Standards Association. The term ‘VESA” is often used to note
    a standard specified by said Association. Nearly all modern video adapters are
    VESA-compliant.'
- md: '

    ## Virtual terminal


    The use of software to simulate multiple terminals while using only a single set
    of input/output devices (keyboard, monitor, mouse). Special keystrokes switch
    between virtual terminals at a single physical terminal.


    ## Window manager


    An program whose purpose is to provide a graphical interface beyond the simple
    rectangle-drawing of the X Window System. Window managers generally provide titlebars,
    menus for running programs, etc.


    ## Working directory


    The directory in which a program considers itself to be while running.


    ## Wrapper program


    A program whose sole purpose is to run other programs, but change their behavior
    in some way by altering their environments or filtering their input.


    ## X server


