    # # Chapter 8


    # # The Shell


    In a graphical environment, the interface is provided by a program that creates
    windows, scrollbars, menus, etc. In a commandline environment, the user interface
    is provided by a shell, which interprets commands and generally makes things usable.
    Immediately after logging in (which is covered in this chapter), users are put
    into a shell (bash) and allowed to go about their business. The shell serves as
    an introduction to the shell, and to the most common shell among Linux users--
    the Bourne Again Shell (bash). For more detailed information on anything in this
    chapter, check out the bash(1) man page.


    # ## 8.1 Users


    # ## Logging In


    So you''ve booted, and you''re looking at something that looks like this:


    ```

    Welcome to Linux 2.4.18

    Last login: Wed Jan 1 15:59:14 -0500 2005 on tty6.

    darkstar login:

    ```


    Hmm.. nobody said anything about a login. And what''s a darkstar? Don''t worry;
    you probably didn''t accidentally fire up a hyperspace comm-link to the Empire''s
    artificial moon. (I''m afraid the hyperspace comm-link protocol isn''t currently
    supported by the Linux kernel. Maybe the 2.8 kernel branch will at last provide
    this oft looked-for for support.) No, darkstar is just the name of one of our
    computers, and'
  - '[PAGE 123]


    # Chapter 8 The Shell


    its name gets stamped on as the default. If you specified a name for your computer
    during setup, you should see it instead of darkstar.


    As for the login... If this is your first time, you''ll want to log in as root.
    You''ll be prompted for a password; if you set one during the setup process, that''s
    what you''re looking for. If not, just hit enter. That''s it—you''re in!


    # Root: The Superuser


    Okay, who or is root? And what''s it doing with an account on your system?

    Well, in the world of Unix and similar operating systems (like Linux), there are
    users and then there are users. We''ll go into this in more detail later, but
    the important thing to know is that root is the user above all; root is all-powerful
    and all-knowing, and nobody disobey root. It isn''t allowed. root is what we call
    a ‘superuser’, and rightly so. And best of all, root is you.


    Cool, huh?


    If you''re not sure: that''s very cool. The catch is, though, root is inherently
    allowed to break anything it so desires. You might want to skip ahead to Section
    12.1.1 and see adding a user; then login as that user and work from there. The
    traditional wisdom is that it''s best to become the superuser when absolutely
    necessary, so as to minimize the possibility of accidentally breaking something.


    By the way, if you decide to be root while you''re logged in as someone else,
    no problem. Just use the su(1) command. You''ll be asked for root''s password
    and then it will make root until you exit or logout. You can also become any other
    user using su, provided you know that user''s password: su login, for instance,
    would make you.


    Note: root is allowed to su to any user, without requiring their password.'
- md: '

    ## 8.2 The Command Line


    ### Running Programs


    It''s hard to get much accomplished without running a program; you might be able
    to prop something up with your computer or hold a door open, and some will make
    the most lovely humming noise when running, but that''s really about it. And I
    think we can all agree that its use as a humming doorstop isn''t what brought
    the personal computer the popularity it now enjoys.


    So, remember how almost everything in Linux is a file? Well, that goes for programs,
    every command you run (isn''t built into the shell) resides as a file somewhere.
    You run a program simply by specifying the full path to.


    For instance, remember that `su` command from the last section? Well, it''s actually
    in the `/bin` directory: `/bin/su` would run nicely.


    So why, then, just typing `su` work? After all, you didn''t say it was in `/bin`.
    It could just as easily have been in `/user/local/shares/`, right? How did it
    know? The answer to that lies in the PATH environment variable; most shells have
    either PATH or something very much like PATH. It basically contains a list of
    directories to look in for programs you try to run. When you run `su`, your shell
    runs through its list of directories, checking each one for an executable file
    `su` that it could run; the first one it came to, it ran. This happens whenever
    you run a program without specifying a full path to; if you get a “Command not
    found’ error, that only means the program you tried to run isn''t in your PATH.
    (Of course, this would be true if the program does not exist at all...) We discuss
    environment variables in more depth in Section 8.3.1.


    Remember also that `.` is shorthand for the current directory, so if you happened
    to be in `/bin`, `./su` would have worked as an explicit path.


    ### Wildcard Matching


    Nearly every shell recognizes some characters as being substitutes or abbreviations
    that mean anything goes here. Such characters are aptly named wildcards; the most
    common are `*` and `?`. By convention, `?` usually matches any single character.
    For instance, suppose you''re in a directory with three files: `ex1.txt`, `ex2.txt`,
    and `ex3.txt`. You want to copy all of them (using the cp command we learned in
    Section 10.5.1) to another directory, say `/tmp`. Typing `cp ex1.txt ex2.txt ex3.txt
    /tmp` is entirely too much work. It''s much easier to type `cp ex?.txt /tmp`;
    the `?` will match each of the characters “1”, “2”, and “3”, and in turn will
    be substituted.


    What''s you say? That''s still too much work? You''re right. It''s appalling;
    we have labor laws to protect us from that sort of thing. Frankly, we also have
    `*`. As was already mentioned, `*` matches “any number of characters”, including
    0. So if those three files were the only ones in the directory, we could simply
    say `cp * /` and get them all in one fell swoop. Suppose, though there is also
    a file called `ex.txt` and one called `hello.txt`. We want to copy `ex.txt` but
    not `hello.txt`; `cp ex* /tmp` will do that. `cp ex?.txt /tmp` would, of course,
    only get our three files; there''s no character in `ex.txt` to match ?, so it
    would be left out.


    Another wildcard is the bracket pair `[]`. Any characters inside the brackets
    will be substituted in place of `[]` to find matches. It''s not too bad. Suppose
    instance we have a directory containing the following files: `a1`, `a2`, `a3`,
    `a4`, `aB`, `aC`. We want to find the files ending in numbers; `ls [0-9]` will
    do this for us. But what we really want is just `a1`, `a2`, and `a4`. In the previous
    example we used `[1-4]` to mean all values between 1 and 4. We can also separate
    individual entries with commas. I know what you''re thinking now, “Well about
    letters?” Linux is case-sensitive, meaning that `a` and `A` are different characters
    and only related in your mind. Capitals always come before letters, so `A` come
    before `a`. Continuing with our earlier example, if we wanted files a1, and A1,
    we can find them quickly with `[aA]`. Note, if we had included a hyphen instead
    of a comma, we would have gotten incorrect results. We can also combine hyphen
    and comma strings.


    ```

    % ls [A,a]

    a1 a2 a4

    ```

    ```bash

    % ls [A-d]

    a1 b1 d1

    ```


    ### Input/Output Redirection and Piping


    (Here comes something cool.) You know what that is? That''s me running `ps` to
    see which processes are running; ps is covered in Section 8.3. That''s not the
    cool part. The cool part is `>` which means, roughly, take the output from `ps`
    and write it to a file called `output`. But wait, it gets cooler.


    ```

    % ps | less

    ```

    That one takes the output from `ps` and pipes it through `less`, so I can scroll
    through it at my leisure.


    ```

    $ ps >> output

    ```

    This is the third commonly used redirector; it does the same thing as `>`, except
    that `>>` will append output from `ps` to the file `output`, if said file exists.
    If not, like `>`, it will be created. There is also a `<` operator, which means
    take your input from the following, it''s not used so often.


    ```bash

    $ ps < file.txt

    ```

    Redirection gets really fun when you start piling it up:


    ```

    $ ps | tac >> output

    ```

    That will run `ps`, reverse the lines of its output, and append those to the file
    `output`. You can stack as many of these as you want; just be careful to remember
    that they get interpreted from left to right. See the bash(1) man page for more
    detailed information on redirection.


    ## 8.3 The Bourne Again Shell (bash)


    ### Environment Variables


    A Linux system is a complex beast, and there''s a lot to keep track of, lot of
    little details that come into play in your normal interactions with various programs
    (some of which you might not need to be aware of). Nobody wants to pass a bunch
    of options to every program that gets run, telling it what kind of terminal is
    being used, the hostname of the computer, how their prompt should look...


    #### Example 8-1. Listing Environment Variables with set


    ```bash

    set

    PATH=/usr/local/lib/bin:/usr/local/bin:/usr/bin:/bin:/usr/X11R6/bin:

    /usr/openwin/bin:/usr/games:../usr/local/ssh2/bin:/usr/local/ssl/bin:

    /usr/share/texmf/bin:/usr/local/sbin:/usr/sbin:/home/logan/bin

    PIPETESTATUS=[0]

    PPID=4978

    PS1=\h:\w\$

    PS2=''=''

    PS4=''+''

    PWD=/home/logan

    QTDIR=/usr/local/lib/qt

    REMOTEHOST=ninja.today

    SHELL=/bin/bash

    ```


    So as a coping mechanism, users have what''s called an environment. The environment
    defines the conditions in which programs run, and some of this definition is variable;
    the user can alter and play with it, as is only right in a Linux system. Pretty
    much any shell will have environment variables (if not, it''s probably not a very
    usable shell). Here we will give an overview of the commands bash provides for
    manipulating its environment variables.


    `set` by itself will show you all of the environment variables that are currently
    defined, as well as their values. Like most built-ins, it can also do several
    things (with parameters); we''ll leave it to the bash(1) man to cover that, though.
    Example 8-1 shows an excerpt from a `set` command run on one of the author''s
    computers. In this example the PATH variable that was discussed earlier. Programs
    in any of those directories can be run simply by typing the base filename.


    #### unset VARIABLE


    `unset` will remove any variables that you give it, wiping out both the variable
    and its value; bash will forget that variable ever existed. (Don''t worry. Unless
    it''s something you explicitly defined in shell session, it''ll probably get redefined
    in any session.)


    ```bash

    $ export VARIABLE=some_value

    ```

    Now, export is truly handy. Using it, you give the environment variable VARIABLE
    the value “some_value if VARIABLE didn''t exist, it does now. If VARIABLE already
