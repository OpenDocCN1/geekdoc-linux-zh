    # 13.4 finger


    finger(1) will retrieve information about the specified user. You give finger
    a username or an email address and it will try to contact the necessary server
    and retrieve the username, office, telephone number, and other pieces of information.
    Here is an example:


    ```

    finger johnc@idsoftware.com

    ```


    finger can return the username, status, phone numbers, and files referred to as
    ‘dot plan’ and ‘dot project’. Of course, the information returned varies with
    each finger server. The one included with Slack returns the following information
    by default:


    +   * Username

    * Room number

    * Home phone number

    * Work phone number

    * Login status

    * Email status

    * Contents of the .plan file in the user’s home directory

    * Contents of the .project file in the user’s home directory


