    \ to run again |\n| Exit | Exit Pkgtool |\n| < OK > | < Cancel > |\n\nInstallation\
    \ is offered from the current directory, another directory, or from floppy disks.\
    \ Simply select the installation method you want and pkgtool will search for location\
    \ for valid packages to install.\n\nYou may also view a list of installed packages,\
    \ as shown in Figure 18-2.\n\nFigure 18-2. Pkgtool view mode\n\n![](img/1d848cb703597efcdc9149b6ee756285_239_0.png)\n\
    \nIf you want to remove packages, select the remove option and you will be presented\
    \ with a checklist of all the installed packages. Flag the ones you want to remove\
    \ and select OK. pkgtool will remove them.\n\nSome users prefer this utility to\
    \ the command line utilities. However, it should be noted that the command line\
    \ utilities offer many more options. Also, the ability to upgrade packages is\
    \ only offered through the command line utilities.\n\n## installpkg\n\ninstallpkg(8)\
    \ handles installation of new packages on the system. The syntax is as follows:\n\
    \n```\n# installpkg option package_name\n```\n\nThree options are provided for\
    \ installpkg. Only one option can be used at a time.\n\nTable 18-1. installpkg\
    \ Options\n\n| Option | Effects |\n| --- | --- |\n| -m | Performs a makepkg operation\
    \ on the current directory. |\n| -warn | Shows what would happen if you installed\
    \ the specified package. This is useful for production systems so you can see\
    \ exactly what would happen before installing something. |\n| -r | Recursively\
    \ install all packages in the current directory and down. The package name can\
    \ use wildcards, which would be used as the search mask when recursively installing.\
    \ |\n\nIf you pass the ROOT environment variable before installpkg, that path\
    \ will be used for the root directory. This is useful for setting up new drives\
    \ for your root directory. They will be mounted to /mnt or something other than\
    \ /.\n\nThe installed package database entry is stored in /var/log/packages. The\
    \ entry is really just a plain text file, for each package. If the package has\
    \ a postinstallation script, it is written to /var/log/scripts/\n\nYou may specify\
    \ several packages or use wildcards for the package name. Be advised that installpkg\
    \ will not tell you if you are overwriting an installed package. It will simply\
    \ install right on top of the old one. If you want to ensure that old files from\
    \ the previous package are safely removed, use upgradepkg.\n\n## removepkg\n\n\
    removepkg(8) handles removing installed packages from the system. The syntax is\
    \ as follows:\n\n```\n# removepkg option package_name\n```\n\nFour options are\
    \ provided for removepkg. Only one option may be used at a time.\n\nTable 18-2.\
    \ removepkg Options\n\n| Option | Effects |\n| --- | --- |\n| -copy | The package\
    \ is copied to the preserved packages directory. This creates a tree of the original\
    \ package without removing it. |\n| -keep | Saves temporary files created during\
    \ the removal. Really only useful for debugging purposes. |\n| -preserve | The\
    \ package is removed, but copied to the preserved packages directory at the same\
    \ time. |\n| -warn | Shows what would happen if you removed the package. |\n\n\
    If you pass the `ROOT` environment variable before `removepkg`, that path will\
    \ be used for the root directory. This is useful for setting up new drives for\
    \ your root directory. They will typically be mounted to `/mat` or something else\
    \ than `/`.\n\nremovepkg looks at the other installed packages and only removes\
    \ files unique to the package you specify. It will also scan the postinstallation\
    \ script for the specified package and remove any symbolic links that were created\
    \ by it.\n\nDuring the removal process, a status report is displayed. After the\
    \ removal, the package database entry is moved to `/var/log/removed_packages`\
    \ and the postinstallation script is moved to `/var/log/removed_scripts`.\n\n\
    Just as with `upgradepkg`, you can specify several packages or use wildcards for\
