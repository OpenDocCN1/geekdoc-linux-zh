    archives. The ZipSlack archive contains everything you need to get up and running
    with Slackware.


    It is important to note that ZipSlack is significantly different from a regular
    installation. Even though they function the same and contain the same programs,
    their intended audiences and functions differ. Several advantages and disadvantages
    of ZipSlack are discussed below.


    One thing, you should always review the documentation included in the actual ZipSlack
    directory. It contains the latest information regarding installation, booting,
    and general use of the product.


    # Advantages


    +   - Does not require repartitioning of your hard disk.'
  - '[PAGE 247]


    Great way to learn Slackware Linux without stumbling through the installation
    process.


    # Disadvantages


    +   - Uses the DOS filesystem, which is slower than a native Linux filesystem.


    +   - Will not work with Windows NT.


    # 19.2 Getting ZipSlack


    Obtaining ZipSlack is easy. If you have purchased the official Slackware Linux
    CD set, you already have ZipSlack. Just find the CD that contains the zslack directory
    and place it in your CD-ROM drive. It''s usually the third or fourth disc, but
    always trust the labels over this documentation as the disk it resides on is prone
    to change.


    If you want to download ZipSlack, you should first visit our ‘Get Slack’ web page
    for the latest download information:


    ```

    http://www.slackware.com/getslack/

    ```


    ZipSlack is part of each Slackware release. Locate the release you want, and go
    to that directory on the FTP site. The latest release directory can be found at
    this location:


    ```

    ftp://slackware.com/pub/slackware/slackware/

    ```


    You''ll find ZipSlack in the /zipslack subdirectory. ZipSlack is offered as one
    .ZIP file or floppy-sized chunks. The chunks are in the /zipslack/split directory.


    Don''t stop at just the .ZIP files. You should also download the documentation
    files and any boot images that appear in the directory.'
  - '[PAGE 248]


    # Installation


    Once you''ve downloaded the necessary components, you''ll need to extract the
    .ZIP file. Be sure to use a 32-bit unzipper. The size and filenames in the archive
    are too much for a 16-bit unzipper. Examples of 32-bit unzippers include WinZip
    and PKZIP for Windows.


    ZipSlack is designed to be extracted directly to the root directory of a drive
    (such as C: or D:). A LINUX directory will be created that contains the actual
    Slack installation. You''ll also find the files necessary to booting the system
    in that directory as well.


    After you''ve extracted the files, you should have a \LINUX directory on the drive
    of your choosing (we''ll use c: from here on).


    # 19.3 Booting ZipSlack


    There are several ways to boot ZipSlack. The most common is to use the included
    LINUX.BAT to boot the system from DOS (or from DOS mode under Windows 9x). This
    file must be edited to match your system before it will work.


    Start by opening the C:\LINUX\LINUX.BAT file in your favorite text editor. At
    the top of the file you will notice a large comment. It explains what you need
    to edit in this file (and also what to do if you are booting from an external
    Zip drive). Don''t worry if you don''t understand the `root=` setting. There are
    several examples, feel free to pick one and try it. If it doesn''t work, you can
    edit the file again, comment out the line you uncommented, and pick another one.


    After you uncomment the line you want by removing the ''rem'' at the beginning
    of the line, save the file and exit the editor. Bring your machine into DOS mode.


    A DOS prompt window in Windows 9x will not work.


    Type C:\LINUX\LINUX.BAT to boot the system. If all goes well, you should be presented
    with a login prompt.'
