    # Chapter 9 Filesystem Structure


    # 9.3 Links


    Links are pointers between files. With links, you can have files exist in many
    locations and be accessible by many names. There are two types of links: hard
    and soft.


    Hard links are names for a particular file. They can only exist within a single
    filesystem and are only removed when the real name is removed from the system.
    These are useful in some cases, but many users find the soft link to be more versatile.


    The soft link, also called a symbolic link, can point to a file outside of its
    filesystem. It is actually a small file containing the information it needs. You
    can add and remove soft links without affecting the actual file. And since a symbolic
    link is actually a small file containing its own information, it can even point
    at a directory. It''s rather common to have /var/tmp actually be a symbolic link
    to /tmp for example.


    Links do not have their set of permissions or ownerships, but instead reflect
    those of the file they point to. Slack uses mostly soft links. Here is a common
    example:


    ```

    $ ls -1 /bin/sh

    rwxrxr-x 1 root 4 Apr 6 12:34 /bin/sh -> bash

    ```


    The shell under Slack is actually bash. Removing links is done using rm. The ln
    command is used to create links. These commands will be discussed in more depth
    in Chapter 10.


    It''s very important to be careful about symlinks in particular. Once, I was working
    on a machine that was consistently failing to back-up tape each night. Two links
    had been made to directories beneath each other. The back-up software kept appending
    some directories to the tape until it was out of space. Normally, a set of checks
    will prevent creating a symlink in this situation, but ours was a special case.'
  - '[PAGE 138]


    # 9.4 Mounting Devices


    As was previously discussed in Section 4.1.1, all the drives and devices in your
    computer are one big filesystem. Various hard drive partitions, CD-ROMs, and floppies
    are all placed in the same tree. In order to attach these devices to the filesystem
    so that you can access them, you have to use the mount(1) and umount(1) commands.


    Some devices are automatically mounted when you boot up your computer. These are
    listed in the /etc/fstab file. Anything that you want to be mounted automatically
    gets an entry in that file. For other devices, you''ll have to issue a command
    every time you use the device.


    fstab


    Let''s look at an example of the /etc/fstab file:


    ```

    % cat /etc/fstab

    /dev/sda         / ext2 defaults 1 1

    /dev/sda2        /usr/local ext2 defaults 1 1

    /dev/sda4        /home ext2 defaults 1 1

    /dev/sdb1        /swap swap defaults 0 0

    /dev/sdb3        /export ext2 defaults 1 1

    none             /dev/pts devpts gid=5,mode=620 0 0

    none             /proc proc defaults 0 0

    /dev/fd0         /mnt ext2 defaults 0 0

    /dev/cdrom       /mnt/cdrom iso9660 ro 0 0

    ```


    The first column is the device name. In this case, the devices are five partitions
    spread across two SCSI hard drives, two special filesystems that don''t need a
    device, a floppy, and a CD-ROM drive. The second column is where the device will
    be mounted. This needs to be a directory name, except in the case of a swap partition.
    The third column is the filesystem type of the device. For normal Linux filesystems,
    this will be ext2 (second extended filesystem). CD-ROM drives are iso9660, and
    Windows-based devices will be either mdos or vfat.'
  - '[PAGE 139]


    # Chapter 9 Filesystem Structure


    The fourth column is a listing of options that apply to the mounted filesystem.
    defaults is fine for just about everything. However, read-only devices should
    be given the ro flag. There are a lot of options that can be used. Check the fstab(5)
    man page for more information. The last two columns are used by fsck and other
    commands that need to manipulate the devices. Check the man page for that information
    as well.


    When you install Slack Linux, the setup program will build much of the fstab file.


    # mount and umount


    Attaching another device to your filesystem is easy. All you have to do is use
    the mount command, along with a few options. Using mount can simplified if the
    device has an entry in the /etc/fstab file. For example, let''s say that I wanted
    to mount my CD-ROM drive and that my fstab file looked like the example from the
    previous section. I would mount like so:


    +   * mount /cdrom


    Since there is an entry in fstab for that mount point, mount knows what options
    to use. If there wasn''t an entry for that device, I would have to use several
    options for mount:


    +   * mount -t iso9660 -o ro /dev/cdrom /cdrom


    That command includes the same information as the example fstab did, but we''ll
    go over all the parts away. The -t iso9660 is the filesystem type of the device
    to mount. In this case, it would be the iso9660 filesystem which is what CD-ROM
    drives most commonly use. The -o ro tells to mount the device read-only. The /dev/cdrom
    is the name of the device to mount, and /cdrom is the location on the filesystem
    to mount the drive.


    Before you need to remove a floppy, CD-ROM, or other removable device that is
    currently mounted, you''ll have to unmount it. That is done using the umount command.'
- md: "\nDon't ask where the 'h' went because we couldn't tell you. You can use either\
    \ the mounted device or the mount point as the argument to umount. For example,\
    \ if you wanted to unmount the CD-ROM from the previous example, either of these\
    \ commands would work:\n\n```\n# umount /dev/cdrom\n# umount /cdrom\n```\n\n##\
    \ 9.5 NFS Mounts\n\nNFS stands for the Network Filesystem. It is not really part\
    \ of the real filesystem, but can be used to add parts to the mounted filesystem.\n\
    \nLarge Unix environments often share the same programs, sets of home directories,\
    \ and mail spool. The problem of getting the same copy to each machine is solved\
    \ with NFS. We can use NFS to share one set of home directories between all of\
    \ the workstations. The workstations then mount NFS share as if it were on their\
    \ own machines.\n\nSee Section 5.6.2 and the man pages for exports(5), nfsd(8),\
    \ and mount(8) for more information.\n\n## Chapter 10\nHandling Files and Directories\n\
    \nLinux aims to be the most Unix-like it can be. Traditionally, Unix operating\
    \ systems have been command-line oriented. We do have a graphical user interface\
    \ in Slackware, but the command-line is still the main level of control for the\
    \ system. Therefore, it is important to understand some of the basic file management\
    \ commands.\n\nThe following sections explain the common file management commands\
    \ and provide examples of how they are used. There are many other commands, but\
    \ these will help you get started. Also, the commands are only briefly discussed\
    \ here. You will find more detail in the accompanying man pages for each command.\n\
    \n## 10.1 Navigation : ls, cd, and pwd\n\n### ls\nThis command lists files in\
    \ a directory. Windows and DOS users will notice its similarity to the dir command.\
    \ By itself, ls(1) will list the files in the current directory. To see what's\
    \ in your root directory, you could use these commands:\n\n```\n% cd /\n% ls\n\
    bin cdr dev home lost+found proc sbin tmp var\nboot cdrom etc lib mnt root suncd\
    \ usr vmlinux\n```\n\nThe problem a lot of people have with that output is that\
    \ you cannot easily tell what is a directory and what is a file. Some users prefer\
    \ that ls adds a type identifier to each listing, like this:\n\n```\n$ ls -FC\n\
    bin/  cdr/  dev/  home/  lost+found/  proc/  sbin/  tmp/  var/\nboot/  cdrom/\
    \  etc/  lib/  mnt/  root/  suncd/  usr/  vmlinux\n```\n\nDirectories get a slash\
    \ at the end of the name, executable files get an asterisk at the end of the name,\
    \ and so on.\n\nls can also be used to get other statistics on files. For example,\
    \ to see the creation dates, owners, and permissions, you would look at a long\
    \ listing:\n\n```\n$ ls -l\ndrwxr-xr-x 2 root root 4096 May 7 09:11 bin/\ndrwxr-xr-x\
    \ 2 root root 4096 Feb 24 03:55 boot/\ndrwxr-xr-x 2 root root 4096 Feb 18 01:10\
    \ cdr/\ndrwxr-xr-x 14 root root 6144 Oct 23 18:37 dev/\ndrwxr-xr-x 4 root root\
    \ 28672 Mar 5 18:01 dev/\ndrwxr-xr-x 10 root root 4096 Mar 8 03:31 etc/\ndrwxr-xr-x\
    \ 8 root root 4096 Mar 8 03:31 home/\ndrwxr-xr-x 3 root root 4096 Jan 23 21:29\
    \ lib/\ndrwxr-xr-x 2 root root 16384 Nov 1 08:53 lost+found/\ndrwxr-xr-x 2 root\
    \ root 4096 Oct 6 12:47 mnt/\ndr-xr-xr-x 62 root root 0 Mar 4 15:32 proc/\ndrwxr-xr-x\
    \ 12 root root 4096 Feb 26 02:06 root/\ndrwxr-xr-x 5 root root 4096 Feb 17 07:02\
    \ sbin/\ndrwxr-xr-x 1 root root 2048 Oct 25 10:51 suncd/\ndrwxr-xr-x 4 root root\
    \ 8724 Mar 7 20:42 tmp/\ndrwxr-xr-x 21 root root 4096 Aug 24 03:04 usr/\ndrwxr-xr-x\
    \ 18 root root 4096 Mar 8 03:32 var/\n```\n\nSuppose you want to get a listing\
    \ of the hidden files in the current directory. The following command will do\
    \ that:\n\n```\nls -a\n  .. bin cdrom home mnt sbin usr\n  . dev tmp vmlinux\n\
    ```\n\nFiles beginning with a period (called dot files) are hidden when you run\
    \ ls. You will only see them if you pass the -a option.\n\nThere are many more\
    \ options that can be found in the manual page. The cd command is used to change\
    \ working directories. You simply type cd followed by the path name to change.\
    \ Here are some examples:\n\n```\n~$ cd /bin\n$ usr\nNo such file or directory\n\
    $ /\n```\nThe cd command is not like the other commands. It is a builtin command.\
    \ Shell builtins are discussed in Section 8.3. This may not make any sense to\
    \ you right now. Basically it means there is no man page for this command. Instead,\
    \ you have to use help.\n\n### pwd\nThe pwd command is used to show your current\
    \ location. To use the pwd command just type pwd. For example:\n\n```\n% cd /bin\n\
    % pwd\n/bin\n```/\n\n## 10.2 Pagers: more, less, and most\n\n### more\nmore(1)\
    \ is what we call a pager utility. Oftentimes the output of a particular command\
    \ is too big to fit on one screen. The individual commands do not know how to\
    \ fit their output to separate screens. They leave this job to the pager utility.\n\
    \nThe more command breaks the output into individual screens and waits for you\
    \ to press the space bar before continuing on the next screen. Pressing the enter\
    \ key will advance the output one line. Here is a good example:\n\n```\n% cd /usr/bin\n\
    % ls -l\n```\nThat should scroll for a while. To break up the output by screen,\
    \ just pipe it through more:\n\n```\n% ls -l | more\n```\nThat is the pipe character\
    \ (|). The pipe is short for saying the output of `ls` and feed it into `more`.\
    \ You can pipe just about anything through the more command, not just `ls`. Piping\
    \ is also covered in Section 8.2.3.\n\n### less\nThe `more` command is quite handy,\
    \ but often you will find that you have advanced the screen you wanted. more does\
    \ not provide a way to go back. The `less(1)` command provides this functionality.\
    \ It is used in the same way as the `more` command, so `less` is more than `more`.\
    \ Joost Kremers puts it in this way:\n\n> `less` is more, but more than more is,\
    \ so more is less, use less if you want less more.\n\n### most\nWhere `more` and\
    \ `less` leave off, `most(1)` picks back up. If `less` is more than `more`, `most`\
    \ is more than `less`. Whereas the other pagers can only display one file at a\
    \ time, `most` is capable of viewing any number of files, as long as each file’s\
    \ window is at least 2 lines long. `most` has a lot of options, check the man\
    \ page for full details.\n\n## 10.3 Simple Output: cat and echo\n\n### cat\n`cat(1)`\
    \ is short for ‘concatenate’. It was originally designed to merge text files into\
    \ one, but can be used for many other purposes.\n\nTo merge two or more files\
    \ into one, you simply list the files after the `cat` command and then redirect\
    \ the new output to a file. `cat` works with standard input and standard output,\
    \ so you have to use the shell redirection characters. For example:\n\n```\n%\
    \ cat file1 file2 > bigfile\n```\nThis command takes the contents of file1, file2,\
    \ and file3 and merges it all together. The new output is sent to standard out.\n\
    \nOne can also use cat to display files. Many people cat text files through the\
    \ more or less commands, like this:\n\n```\n% cat file1 | more\n```\nThat will\
    \ display the file1 file and pipe it through the more command so that you only\
    \ one screen at a time.\n\nAnother command to use cat for copying files. You can\
    \ copy any file around with cat, like this:\n\n```\n% cat /bin/bash > ~/mybash\n\
    ```\nThe /bin/bash program is copied to your home directory and named mybash.\n\
    cat has many uses and the ones discussed here are just a few. Since cat makes\
    \ extensive use of standard input and standard output, it is ideal for use in\
    \ shell scripts or part of other complex commands.\n\n### echo\nThe echo(1) command\
    \ displays the specified text on the screen. You specify the string to display\
    \ after the echo command. By default echo will display the string and print a\
    \ newline character after it. You can pass the -n option to suppress the printing\
    \ of the newline. The -e option will cause echo to search for escape characters\
    \ in the string and execute them.\n"
  mdcn: "\n\n不要问 'h' 去到哪里了，因为我们无法告诉你。你可以使用挂载的设备或挂载点作为 `umount` 的参数。例如，如果你想从上一个示例中卸载\
    \ CD-ROM，以下任一命令均有效：\n\n```\n# umount /dev/cdrom\n# umount /cdrom\n```\n\n## 9.5\
    \ NFS 挂载\n\nNFS 代表网络文件系统（Network Filesystem）。它实际上并不是真实文件系统的一部分，但可以用于向挂载的文件系统添加部分内容。\n\
    \n大型 Unix 环境通常共享相同的程序、一组家目录和邮件队列。在每台机器上获取相同副本的问题通过 NFS 解决。我们可以使用 NFS 在所有工作站之间共享一组家目录。工作站随后将\
    \ NFS 共享挂载，就像它在它们自己的机器上一样。\n\n更多信息请参阅第 5.6.2 节以及 exports(5)、nfsd(8) 和 mount(8)\
    \ 的帮助页。\n\n## 第 10 章\n处理文件和目录\n\nLinux 的目标是尽可能变得类 Unix。传统上，Unix 操作系统是以命令行为导向的。虽然\
    \ Slackware 中有图形用户界面，但命令行仍然是系统的主要控制级别。因此，理解一些基础文件管理命令非常重要。\n\n接下来的章节解释了常用的文件管理命令，并提供了它们的用法示例。还有许多其他命令，但这些将帮助你入门。此外，这里对命令进行了简要讨论。你将在每个命令附带的帮助页找到更详细的信息。\n\
    \n## 10.1 导航：ls, cd, 和 pwd\n\n### ls\n此命令列出目录中的文件。Windows 和 DOS 用户会注意到它与 `dir`\
    \ 命令的相似性。单独使用 `ls(1)` 将列出当前目录下的文件。要查看根目录下的内容，可以使用以下命令：\n\n```\n% cd /\n% ls\n\
    bin cdr dev home lost+found proc sbin tmp var\nboot cdrom etc lib mnt root suncd\
    \ usr vmlinux\n```\n\n许多人对该输出的一个问题是，你无法轻易判断什么是目录，什么是文件。有些用户更倾向于让 `ls` 在每个列项中添加类型标识符，如下：\n\
    \n```\n$ ls -FC\nbin/  cdr/  dev/  home/  lost+found/  proc/  sbin/  tmp/  var/\n\
    boot/  cdrom/  etc/  lib/  mnt/  root/  suncd/  usr/  vmlinux\n```\n\n目录名称末尾会有一个斜杠，可执行文件名称末尾会有一个星号，以此此类推。\n\
    \n`ls` 还可以用于获取文件的其他统计信息。例如，要查看创建日期、所有者和权限，你需要查看长列表：\n\n```\n$ ls -l\ndrwxr-xr-x\
    \ 2 root root 4096 May 7 09:11 bin/\ndrwxr-xr-x 2 root root 4096 Feb 24 03:55\
    \ boot/\ndrwxr-xr-x 2 root root 4096 Feb 18 01:10 cdr/\ndrwxr-xr-x 14 root root\
    \ 6144 Oct 23 18:37 dev/\ndrwxr-xr-x 4 root root 28672 Mar 5 18:01 dev/\ndrwxr-xr-x\
    \ 10 root root 4096 Mar 8 03:31 etc/\ndrwxr-xr-x 8 root root 4096 Mar 8 03:31\
    \ home/\ndrwxr-xr-x 3 root root 4096 Jan 23 21:29 lib/\ndrwxr-xr-x 2 root root\
    \ 16384 Nov 1 08:53 lost+found/\ndrwxr-xr-x 2 root root 4096 Oct 6 12:47 mnt/\n\
    dr-xr-xr-x 62 root root 0 Mar 4 15:32 proc/\ndrwxr-xr-x 12 root root 4096 Feb\
    \ 26 02:06 root/\ndrwxr-xr-x 5 root root 4096 Feb 17 07:02 sbin/\ndrwxr-xr-x 1\
    \ root root 2048 Oct 25 10:51 suncd/\ndrwxr-xr-x 4 root root 8724 Mar 7 20:42\
    \ tmp/\ndrwxr-xr-x 21 root root 4096 Aug 24 03:34 usr/\ndrwxr-xr-x 18 root root\
    \ 4096 Mar 8 03:32 var/\n```\n\n假设你想获取当前目录中隐藏文件的列表。以下命令可以实现此操作：\n\n```\nls -a\n\
    \  .. bin cdrom home mnt sbin usr\n  . dev tmp vmlinux\n```\n\n以点开头的文件（称为点文件）在运行\
    \ `ls` 时是隐藏的。只有当你传递了 `-a` 选项时，才能看到它们。\n\n在手册页中可以找到更多选项。`cd` 命令用于更改工作目录。你只需输入 `cd`\
    \ 后跟路径名称即可进行更改。这里是一些示例：\n\n```\n~$ cd /bin\n$ usr\nNo such file or directory\n\
    $ /\n```\n`cd` 命令与其他命令不同。它是一个内置命令。Shell 内置命令将在第 8.3 节中讨论。这在现在对你来说可能没有任何意义。基本上，这意味着该命令没有帮助页。相反，你必须使用\
    \ `help`。\n\n### pwd\n`pwd` 命令用于显示你的当前位置。使用 `pwd` 命令只需输入 `pwd`。例如：\n\n```\n% cd\
    \ /bin\n% pwd\n/bin\n```\n\n## 10.2 分页器：more, less, and most\n\n### more\n`more(1)`\
    \ 是我们所的分页器工具。通常，特定命令的输出太大，无法容纳在一个屏幕上。单个命令不知道如何将它们的输出适配到不同的屏幕。它们将这项工作留给了分页器工具。\n\
    \n`more` 命令将输出拆分为单独屏幕，并等待你按下空格键后再继续到下一页。按回车键将输出向下移动一行。这是一个很好的示例：\n\n```\n% cd\
    \ /usr/bin\n% ls -l\n```\n这应该会滚动一会儿。要将输出按屏幕滚动，你可以将其传递给 `more`：\n\n```\n% ls -l\
    \ | more\n```\n\n### less\n`more` 命令是非常实用的，但通常你需要发现它提供回溯的功能。`less(1)` 命令提供了这种功能。\n\
    \n### most\n当 `more` 和 `less` 停止时，`most(1)` 会接管。由于其他分页器一次只能显示一个文件，但 `most` 能够查看任意数量的文件，只要每个文件至少有\
    \ 2 行长。`most` 有许多选项，请查看帮助页。\n\n## 10.3 简单输出：cat 和 echo\n\n### cat\n`cat(1)` 是“连接”的缩写。它最初设计用于合并文本文件，但也可许多许多用途。\n\
    \n要将两个或多个文件合并为一个，你只需在 `cat` 命令后列出文件，然后将新输出重定向到文件。`cat` 使用标准输入输出，因此你必须使用 shell\
    \ 重定向字符。例如：\n\n```\n% cat file1 file2 > bigfile\n```\n此命令获取 file1、file2 和 file3\
    \ 的内容并将它们合并。新输出发送到标准输出。\n\n也可以使用 `cat` 显示文件。许多人将文本文件通过 `more` 或 `less` 命令，如下：\n\
    \n```\n% cat file1 | more\n```\n这将显示 file1 文件并将其通过 `more` 命令，以便你一次查看一个屏幕。\n\n\
    另一个使用 `cat` 复制文件命令。你可以使用 `cat` 复制任何文件，如下：\n\n```\n% cat /bin/bash > ~/mybash\n\
    ```\n/bin/bash 程序被复制到你的家目录并命名为 mybash。\n`cat` 有许多用途，这里讨论的只是其中几个。由于 `cat` 大量使用标准输入输出，它非常适合用于\
    \ shell 脚本或作为复杂命令的一部分。\n\n### echo\n`echo(1)` 命令在屏幕上显示指定的文本。你在 `echo` 命令后指定要显示的字符串。默认情况下，`echo`\
    \ 会显示字符串并打印一个换行符。你可以传递 `-n` 选项来抑制打印换行符。`-e` 选项会让 `echo` 搜索字符串中的转义字符并执行它们。\n\n"
