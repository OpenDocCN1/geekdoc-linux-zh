    # 12.2 Users and Groups, the Hard Way


    Of course, it is possible to add, modify, remove users and groups without using
    the scripts and programs that come with Slack. It’s not really difficult, although
    after reading this process, you’ll probably find it easier to use the scripts.
    However, it’s important to know how your password information is actually stored,
    in case you ever need to recover this information and don’t have the Slack tools
    available.


    First, we’ll add a new user to the `/etc/passwd(5)`, `/etc/shadow(5)`, and `/etc/group(5)`
    files. The `passwd` file holds some information about the users on your system,
    (strange enough) not their passwords. This was once the case, but was halted long
    ago for security reasons. The `passwd` file must be readable by all users, but
    you don’t want encrypted passwords world-readable, as-would-be intruders can use
    the encrypted passwords as a starting point for decrypting a user’s password.
    Instead, the encrypted passwords are kept in the shadow file, which is only readable
    by root, and everyone’s password is entered into the `passwd` file simply as “x”.
    The `group` file lists all the groups and who is in each.


    You can use the `vipw` command to edit the `/etc/passwd` file safely, and the
    `vig` command to edit the `/etc/group` file safely. Use `vipw -s` to edit the
    `/etc/shadow` file safely. (‘Safely’ in this context means someone won’t be able
    to modify the file you’re editing at the moment. If you’re the only administrator
    of your system, you’re probably safe, but it’s best to get into good habits from
    the start.)


    Let’s examine the `/etc/passwd` file and look at how to add a new user. A typical
    entry in `passwd` looks like this:'
- md: '

    ## Chapter 12 Essential System Administration


    ```

    chris:x:1000:Chris Lumens,Room 2,,/home/chris:/bin/bash

    ```


    Each line is an entry for one user, and fields on each line are separated by a
    colon. The fields are the login name, encrypted password ("x") for everyone on
    a Linux system, since Linux uses shadow passwords, user ID, group ID, the optional
    finger information (separated by commas), home directory, and shell. To add a
    new user by, add a new line at the end of the file, filling in the appropriate
    information.


    The information you add needs to meet some requirements, or your new user may
    have problems logging in. First, make sure that the password field is a x, and
    both the user name and user ID is unique. Assign the group, either 100 (‘users’
    group in Linux) or your default group (use its number, not its name). Give the
    user a valid home directory (which you’ll create later) and shell (remember, valid
    shells are listed in /etc/shells).


    Next, we''ll need to add an entry to the /etc/shadow file, which holds the encrypted
    passwords. A typical entry looks like this:


    ```

    chris:$1$w9bsw/N9$uwlr2bRER6yBS.CAEP7R::11055:09999:7:::

    ```


    Again, each line is an entry for one person, with each field delimited by a colon.
    The fields are (in order) login name, encrypted password, days since the Epoch
    (January 1, 1970) that the password was last changed, days before the password
    may be changed, days after which the password must be changed, days before expiration
    that the user is notified, days after expiration that the account is disabled,
    days since the Epoch that the account is disabled, and a reserved field.


    As you can see, most of this is for account expiration information. If you aren’t
    using expiration information, you only need to fill in a few fields with some
    special values. Otherwise, you’ll need to do some calculations and decision making
    before you can fill those fields in. For a new user, just put some random garbage
    in the password field. Don’t worry about what the password is right now, because
    you are going to change it in a minute. The only character you cannot include
    in the password field is a colon. Leave the ‘days since password was changed’
    field blank as well. Fill in 0, 99999, and 7 just as you see in the example entry,
    and leave the other fields blank.


    (For those of you who think you see my encrypted password above and believe you''ve
    got a leg up on breaking into my system, go right ahead. If you can crack that
    password, you''ll know the password to a firewalled system. Now that''s useful
    : ))


    All normal users are members of the “users” group on a typical Linux system. However,
    if you want to create a new group, or add the new user to additional groups, you''ll
    need to modify the /etc/group file. Here is a typical entry:


    ```

    cvs::12:chris,logan,david,root

    ```


    The fields are group name, group password, group ID, and group members, separated
    by commas. Creating a new group is a simple matter of adding a new line with a
    unique group ID, and listing all the users you want to be in the group. Any users
    that are in this new group and are logged in will have to log out and log back
    in for those changes to take effect.


    At this point, it might be good to use the pwck and grpck commands to verify the
    changes you''ve made are consistent. First, use pwck -r and grpck -r: the -r switch
    makes no changes, but lists the changes you would be asked to make if you run
    the command without the switch. You can use this output to decide whether you
    need to further modify any, to run pwck or grpck without the -r switch, or to
    leave them as they are.


    At this point, you should use the passwd command to create a proper password for
    the user. Then, use mkdir to create the new user''s home directory in the location
    you entered into the /etc/passwd file, and use chown to change the owner of the
    new directory to the new user.


    Removing a user is a simple matter of deleting all of the entries that exist for
    that user. Remove the user''s entry from /etc/passwd and /etc/shadow, and remove
    the login name from any groups in the /etc/group file. If you wish, delete the
    user''s home directory, the mail spool file, and their crontab entry (if they
    exist).


    Removing groups is similar: remove the group''s entry from /etc/group.


    ## 12.3 Shutting Down Properly


    It is very important that you shut down your system properly. Simply turning the
    power off with the power switch can cause serious filesystem damage. While the
    system is on, files are in use even if you aren''t doing anything. Remember that
    there are many processes running in the background all the time. These processes
    are managing the system and keep a lot of files open. When the system''s power
    is switched off, these files are not closed properly and may become corrupted.
    Depending on what files become damaged, the system might be rendered completely
    unusable! In any case, you''ll have to go through a long filesystem check procedure
    on the next reboot.


    **Note:** If you configured your system with a journaling filesystem, ext3 or
    reiser, you''ll be partially protected from filesystem damage, and your filesystem
    check on reboot will be shorter than if you had used a filesystem without journaling,
    like ext2. However, this safety net is no excuse for improperly shutting down
    your system! A journaling FS is meant to protect your files from events beyond
    your control, not from your own laziness.


    In any case, when you want to reboot or power down your computer, it is important
    to do so properly. There are several ways of doing so; you can pick whichever
    one you think is the most fun (or least amount of work). Since a shutdown and
    a reboot are similar procedures, most of the ways for powering off the system
    can also be applied to reboot.


    The first method is through the `shutdown(8)` program, and it is probably the
    most popular. `shutdown` can be used to reboot or turn off the system at a given
    time, and can display a message to all the logged-in users of the system telling
    them that the system is going down.


    The most basic use of shutdown to power down the computer is:


    ```

    # shutdown -h now

    ```


    In this case, we are not going to send a custom message to the users; they will
    see `shutdown`''s default message. “now” is the time we want to shutdown, and
    `-h` means to halt the system. This is not a very friendly way to run a multi-user
    system, but it works fine on your home computer. A better method on a multi-user
    system would be to give everyone a little advance warning:


    ```

    # shutdown -h +60

    ```


    This would shutdown the system in one hour (60 minutes), which would be fine on
    a normal multiuser system. Vital systems should have their downtime scheduled
    far in advance, and you should post warnings about the downtime in any appropriate
    locations used for system notifications (email, bulletin board, /etc/motd, whatever).
    Rebooting the system uses the same command, but substitutes “-r” for “-h”:


    ```

    # shutdown -r now

    ```


    You can use same time notation with `shutdown -r` that you could with `shutdown
    -h`. There are a lot of other things you can do with `shutdown` to control when
    to halt or reboot the machine; see the main page for more details.


    The second way of shutting down or powering off the computer is to use `halt(8)`
    and `reboot(8)` commands. As the names indicate, `halt` will immediately halt
    the operating system, and `reboot` will reboot the system. (`reboot` is actually
    just a symbolic to `halt`.) They are invoked like so:


    ```

    # halt

    # reboot

    ```


    A lower-level way to reboot or shutdown the system is to talk directly to `init`.
    All the other methods are simply convenient ways to talk to `init`, but you can
    directly tell it what to do using `telinit(8)` (note that it only has one ‘1’).
    Using `telinit` will tell `init` what runlevel to drop into, which will cause
    a special script to run. This script will kill or spawn processes as needed for
    that runlevel. This works for rebooting and shutting down because both of those
    are special runlevels.


    ```

    # telinit 0

    ```

