    ## Chapter 9 Filesystem Structure


    ```bash

    ls -l /tmp/example

    -rwxr-xr-x 1 david  users  0 Apr 19 11:21 /tmp/example

    ```


    Now you may be thinking, “Why didn’t it create a file in the first place?” The
    answer is simple, bash includes a nice little built-in called umask. This is included
    with Unix shells as well, and controls what file permissions are assigned to newly
    created files. We discussed bash built-ins to some degree in Section 8.3.1. umask
    takes a little getting used to. It works very similar to chmod, only in reverse.
    You specify the octal values you do not wish to have present in newly created
    files. The default umask is 0022.


    ```bash

    umask

    0022

    umask 0077

    touch tempfile

    ls -l tempfile

    -rw------- 1 david  users  0 Apr 19 11:21 tempfile

    ```


    See the man page for bash for more information.


    To set special permissions with chmod, add the numbers together and place them
    in the first column. For example, to make it set user ID and set group ID, we
    use 6 as the first column:


    ```bash

    chmod 6755 /tmp/example

    ls -l /tmp/example

    -rws-sr-x 1 david  users  0 Apr 19 11:21 /tmp/example

    ```


    If the octal values confuse you, you can use letters with chmod. The permission
    groups are represented as:


    | Owner | u |

    | :--- | :--- |

    | Group | g |

    | World | o |

    | All of the above | a |


    To do the above, we would have to use several command lines:


    ```bash

    % chmod a+rx /tmp/example

    % chmod u+w /tmp/example

    % chmod ug+s /tmp/example

    ```


    Some people prefer the letters over the numbers. Either way will result in the
    same set of permissions.


    The octal format is even faster, and the one you see most used in shell scripts.
    Sometimes the letters are more powerful. For example, there’s no easy way to change
    one group of permissions while preserving the other groups on files and when using
    the octal format. This is trivial with the letters.


    ```bash

    % ls -l /tmp/

    --rw-xr-x 1 alan users 0 Apr 19 11:21 /tmp/example0

    --rw-xr-x 1 alan users 0 Apr 19 11:21 /tmp/example1

    ---r--r-- 1 alan users 0 Apr 19 11:21 /tmp/example2

    % chmod g-w /tmp/example?

    --rw-r--x 1 alan users 0 Apr 19 11:21 /tmp/example0

    --rw------ 1 alan users 0 Apr 19 11:21 /tmp/example1

    ---r--r-- 1 alan users 0 Apr 19 11:21 /tmp/example2

    ```


    We mentioned user ID and set group ID permissions in several places above. You
    may be wondering what this is. Normally when you run a program, it is operating
    under your user account. That is, it has all the permissions that you have as
    a user. The same is true for the group. When you run a program, it executes under
    your current program. With set user ID you can force the program to always run
    as the program owner (such as ‘root’). Set group ID is the same, but for the group.


    Be careful with this, set user ID and set group ID programs can open major security
    holes on your system. If you frequently set user ID programs that are owned by
    root, you are allowing anyone to run that program and run it as root. root has
    no restrictions on the system, you can see how this would pose a major security
    problem. In short, it’s not bad to use user ID and set group ID permissions, just
    use common sense.


    ## 9.3 Links


    Links are pointers between files. With links, you can have files exist in many
    locations and be accessible by many names. There are two types of links: hard
    and soft.


    Hard links are names for a particular file. They can only exist within a single
    filesystem and are only removed when the real name is removed from the system.
    These are useful in some cases, but many users find the soft link to be more versatile.


    The soft link, also called a symbolic link, can point to a file outside of its
    filesystem. It is actually a small file containing the information it needs. You
    can add and remove soft links without affecting the actual file. And since a symbolic
    link is actually a small file containing its own information, it can even point
    at a directory. It''s rather common to have /var/tmp actually be a symbolic link
    to /tmp for example.


    Links do not have their set of permissions or ownerships, but instead reflect
    those of the file they point to. Slack uses mostly soft links. Here is a common
    example:


    ```bash

    $ ls -l /bin/sh

    rwxrxr-x 1 root 4 Apr 6 12:34 /bin/sh -> bash

    ```


    The shell under Slack is actually bash. Removing links is done using rm. The ln
    command is used to create links. These commands will be discussed in more depth
    in Chapter 10.


    It''s very important to be careful about symlinks in particular. Once, I was working
    on a machine that was consistently failing to back-up tape each night. Two links
    had been made to directories beneath each other. The back-up software kept appending
    some directories to the tape until it was out of space. Normally, a set of checks
    will prevent creating a symlink in this situation, but ours was a special case.


    ## 9.4 Mounting Devices


    As was previously discussed in Section 4.1.1, all the drives and devices in your
    computer are one big filesystem. Various hard drive partitions, CD-ROMs, and floppies
    are all placed in the same tree. In order to attach these devices to the filesystem
    so that you can access them, you have to use the mount(1) and umount(1) commands.


    Some devices are automatically mounted when you boot up your computer. These are
    listed in the /etc/fstab file. Anything that you want to be mounted automatically
    gets an entry in that file. For other devices, you''ll have to issue a command
    every time you use the device.


    ### fstab


    Let''s look at an example of the /etc/fstab file:


    ```bash

    % cat /etc/fstab

    /dev/sda         / ext2 defaults 1

    /dev/sda2        /usr/local ext2 defaults 1

    /dev/sda3        /home ext2 defaults 1

    /dev/sda4        /swap ext2 defaults 0

    /dev/sdb1        /export ext2 defaults 1

    /dev/sdb2        /pts devpts mode=620 0

    none             /proc proc defaults 0

    /dev/fd0         /mnt defaults 0

    /dev/cdrom       /mnt/cdrom iso9660

    ```


    The first column is the device name. In this case, the devices are partitions,
    filesystems, floppy, and CD-ROM drive. The second column is where the device will
    be mounted. This needs to be a directory name, except in the case of swap. The
    third column is the filesystem type of the device. For normal Linux filesystems,
    this will be ext2 extended filesystem. CD-ROM drives are iso9660, and Windows-based
    devices will be either or vfat.


    The fourth column is a listing of options that apply to the mounted filesystem.
    defaults is fine for just everything. However, read-only devices should be given
    the ro flag. There are a lot of options that can be used. Check the fstab(5) man
    page for more information. The last two columns are used by fsck and other commands
    that need to manipulate the devices. Check the man page for that as well.


    When you install Slack Linux, the setup program will build much of the fstab file.


    ### mount and umount


    Attaching another device to your filesystem is easy. All you have to do is use
    the mount command, along with a few options. Using mount can simplified if the
    device has an entry in the /fstab file. For example, let''s say that I wanted
    to mount my CD-ROM drive and that my fstab file looked like the example from the
    previous section. I would mount like so:


    -- mount /cdrom


    Since there is an entry in fstab for that mount point, mount knows what options
    to use. If there wasn''t an entry for that device, I would have to use several
    options for mount:


    ```bash

    % mount -t iso9660 -o ro /dev/cdrom /cdrom

    ```


    That command includes the same information as the example fstab did, but we''ll
    go over all the parts away. The -t iso9660 is the filesystem type of the device
    to mount. In this case, it would be the iso9660 filesystem which is what CD-ROM
    drives most commonly use. The -o ro tells to mount the device read-only. The /dev/cdrom
    is the name of the device to mount, and /cdrom is the location on the filesystem
    to mount the drive.


    Before you need to remove a floppy, CD-ROM, or other removable device that is
    currently mounted, you''ll have to unmount it. That is done using the umount command.

