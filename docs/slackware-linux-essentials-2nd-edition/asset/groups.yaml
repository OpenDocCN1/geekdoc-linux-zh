    NT partition

    4. Edit C:\BOOT.INI under Windows NT to add a Linux option


    Installing Windows NT should be fairly straightforward, as installing Linux. From
    there, it gets a little more tricky. Grabbing the first 512 bytes of the Linux
    partition is easier than it sounds. You will need to be in Linux to accomplish
    this. Assuming your Linux partition is /dev/hda2, issue this command:


    ```

    # dd if=/dev/hda2 of=/tmp/bootsect.lnx bs=1 count=512

    ```


    That''s it. You now need to copy bootsect.lnx to the Windows partition. Here''s
    where we run into another problem. Linux does not have stable write support for
    the NTFS filesystem. If you installed Windows NT and formatted your drive as NTFS,
    you will need to copy this file to a FLAT floppy and then read it under Windows
    NT. If you formatted the Windows NT drive as FAT, you can simply mount it under
    Linux and copy the file over. Either way, you will want to get /tmp/bootsect.lnx
    from the Linux drive to C:\BOOTCT.LNX on the Windows drive.


    The last step is adding a menu option to the Windows NT boot menu. Under Windows
