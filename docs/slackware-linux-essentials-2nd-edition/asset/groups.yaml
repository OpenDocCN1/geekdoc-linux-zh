    # Chapter 12 Essential System Administration


    Runlevel 0 is halt mode. Telling `init` to enter runlevel 0 will cause all processes
    to be killed off, the filesystems unmounted, and the machine to be halted. This
    is a perfectly acceptable way to bring down the system. On many laptops and modern
    desktop computers, this will also cause the machine to be turned off.


    # # telinit 6


    Runlevel 6 is reboot mode. All processes will be killed off, the filesystems will
    be unmounted, and the machine will be rebooted. This is a perfectly acceptable
    method of rebooting the system.


    For the curious, when switching to runlevel 0 or 6, by using `shutdown`, `halt`,
    or `reboot`, the script `/etc/rc.d/rc.6` is run. (The script `/etc/rc.d/rc.0`
    is another symbolic link, to `/etc/rc.d/rc.6`). You can customize this file to
    your tastes—but be sure to test your changes carefully!


    There is one last method of rebooting the system. All the other methods require
    you to be logged in as `root`. However, it is possible to reboot the machine even
    if you aren''t root, provided that you have physical access to the keyboard. Using
    **Control+Alt+Delete** (the “three-fingered salute”) will cause the machine to
    immediately reboot. (Behind the scenes, the `shutdown` command is called for when
    you use **Control+Alt+Delete**) The salute doesn’t work when using X Windows—you
    may need to use **Control+Alt+F1** (or another function key) to switch to a non-X
    Terminal before using it.


    Finally, the file that ultimately controls every aspect of startup and shutdown
    is `/etc/inittab`(5). In general, you should not need to modify this file, but
    it may give you insight into why some things work the way they do. As always,
    see man pages for further details.'
