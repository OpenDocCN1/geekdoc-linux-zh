    # Chapter 5 Network Configuration


    a request on the Local Area Network for a DHCP server to assign it an IP address.
    The DHCP server has a pool (or scope) of IP addresses available. The server will
    respond to this request with an IP address from the pool, along with a lease time.
    Once the time for a given IP address lease has expired, the client must contact
    the server again and repeat the negotiation.


    The client will then accept the IP address from the server and will configure
    the requested interface with the IP address. There is one more handy trick that
    DHCP clients use for negotiating the IP address that they will be assigned, however.
    The client will remember its last assigned IP address, and will request the server
    to re-assign that IP address to the client upon next negotiation. If possible,
    the server will do so, but if not, a new address is assigned. So, the negotiation
    resembles the following:


    +   * Client: Is there a DHCP server available on the LAN?

    * Server: Yes, there is. Here I am.

    * Client: I need an IP address.

    * Server: You may take 192.168.10.10 for 19200 seconds.

    * Client: Thank you.


    +   * Client: Is there a DHCP server available on the LAN?

    * Server: Yes, there is. Here I am.

    * Client: I need an IP address. The last time I talked, I had 192.168.10.10;

    * May I have it again?

    * Server: Yes, you may (or No, you may not: 192.168.10.12 instead).

    * Client: Thank you.


    The DHCP client in Linux is /sbin/dhcpcd. If you load /etc/rc.d.inet1 in your
    favorite text editor, you will notice that /sbin/dhcpcd is called about midway
    through the script. This will force the conversation shown above. dhcpcd will
    also track the amount of time left on the lease for the current IP address, and
    will automatically contact the DHCP server with a request to renew the lease when'
