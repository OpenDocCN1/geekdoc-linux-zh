    Table 18-3. Tagfile Status Options\n\n| Option | Meaning |\n| --- | --- |\n| ADD\
    \ | The package is required for proper system operation |\n| SKP | The package\
    \ will be automatically skipped |\n| REC | The package is not required, but recommended\
    \ |\n| OPT | The package is optional |\n"
