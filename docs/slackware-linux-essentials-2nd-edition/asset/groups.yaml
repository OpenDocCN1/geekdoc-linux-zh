    \ | 选择要安装的软件类别 |\n| INSTALL | 安装所选软件 |\n| CONFIGURE | 重新配置你的 Linux 系统 |\n| EXIT\
    \ | 退出 Slack Linux Setup |\n\nsetup 过程如下：你按照列出的顺序逐步执行 setup 程序中的每个选项。（当然，你可以自由地选择几乎任何顺序进行操作，但很可能结果并不理想。）使用向上和向下箭头键选择菜单项，并可以使用左右箭头键选择“确定（Okay）”和“取消（Cancel）”。或者，每个选项都有对应的键，该键在选项名称中高亮显示。选项是可以标记的（那些用\
