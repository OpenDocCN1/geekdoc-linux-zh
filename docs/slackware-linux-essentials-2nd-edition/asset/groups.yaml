    # 13.5 telnet


    Someone once stated that telnet(1) was the coolest thing he had ever seen on computers.
    The ability to remotely log in and do stuff on another computer is what separates
    Unix and Unix-like operating systems from other operating systems.


    telnet allows you to log in a computer, just as if you were sitting at the terminal.
    Once your username and password are verified, you are given a shell prompt. From
    here, you can do anything requiring a text console. Compose email, read newsgroups,
    move files around, and so on. If you are running X and you telnet to another machine,
    you can run X programs on the remote computer and display them on yours.


    To login to a remote machine, use this syntax:


    ```

    telnet <hostname>

    ```


    If the hosts responds, you will receive a login prompt. Give it your username
    and password. That''s it. You are now at a shell. To quit your telnet session,
    use either the exit command or the logout command.


    > **Warning:** telnet does not encrypt the information it sends. Everything is
    sent in plain text, even passwords. It is not advisable to use telnet over the
    Inter-'
