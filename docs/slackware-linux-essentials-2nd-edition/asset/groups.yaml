  - "[PAGE 45]\n\n# Chapter 3 Installation\n\nNow we create the partitions with the\
    \ **n** command:\n\n```\nCommand (m for help): **n**\nCommand action\n  e extended\n\
    \  p primary partition (1-4)\n**p**nPartition number (1-4):**1**\nFirst cylinder\
    \ (0-1060, +size or +sizeM or +sizeK (0-1060, default 1060):**+64M\nLast cylinder\
    \ or +size or +sizeM or +sizeK\n```\n\nYou need to make sure you create partitions.\
    \ The first partition is going to be our swap partition. We tell fdisk to make\
    \ partition number 1 primary partition. We start it at cylinder 0 and for the\
    \ ending cylinder we type +64M. This will give us a 64 megabyte partition for\
    \ swap (The size of the swap partition you need depends on the amount of RAM you\
    \ have. It is conventional that a swap space double the size of your RAM be created.).\
    \ Then we define primary partition number 2 starting at the first available cylinder\
    \ and going all the way to the end of the drive.\n\n```\nCommand (m for help):**n**\n\
    Command action\n  e extended\n  p primary partition (1-4)\n**p**nPartition number\
    \ (1-4):**2**\nFirst cylinder (124-1060, default 124):**124**\nLast cylinder or\
    \ +size or +sizeM or +sizeK (124-1060, default 1060):**1060\n```\n\nWe are almost\
    \ done. We need to change the type of the first partition to type 82 (Linux swap).\
    \ Type **t** to change the type, select the first partition, and type **82**.\
    \ Before writing your changes to the disk, you should look at the new partition\
    \ table one last time. Use the **p** in `fdisk` to display the partition table.\
    \ If everything looks good, type **w** to write your changes to the disk and quit\
    \ `fdisk`."
  - "[PAGE 46]\n\n# 3.4 The setup Program\n\nOnce you have created your partitions,\
    \ you are ready to install Slack. The next step in the installation process is\
    \ running the setup(8) program. To do so, simply type setup at the shell prompt.\
    \ setup is a menu-driven system for actually installing the Slack packages and\
    \ configuring your system.\n\n- Linux Setup (version 9.1.0)-- Welcome to Slack\
    \ Linux Setup. Select an option using the UP/DOWN keys and SPACE and ENTER. Alternate\
    \ keys may also be used: '+', '-', and TAB.\n| HELP | Read the Slack Setup HELP\
    \ file |\n| KEYMAP | Remap your keyboard if you're not using a US one |\n| ADDSWAP\
    \ | Set up your swap partitions |\n| TARGET | Set up your target partitions |\n\
    | SOURCE | Select source media |\n| SELECT | Select categories of software to\
    \ install |\n| INSTALL | Install selected software |\n| CONFIGURE | Reconfigure\
    \ your Linux system |\n| EXIT | Exit Slack Linux Setup \n\nThe setup process goes\
    \ something like this: You step through each option in the setup program, in the\
    \ order they are listed. (Of course, you are free to do things in almost any order\
    \ you choose, but chances it isn’t going to work out well.) Menu items are selected\
    \ using the up and down arrow keys, and the “Okay” and ‘Cancel”buttons can be\
    \ chosen by using the left and right arrow keys. Alternatively, each option has\
    \ a corresponding key, which is highlighted in the option name. Options are flaggable\
    \ (those indicated with a [x]) are toggled using the spacebar.\n\nOf course, all\
    \ of that is described in the “help” section of setup, but we believe in giving\
    \ our readers money’s worth."
