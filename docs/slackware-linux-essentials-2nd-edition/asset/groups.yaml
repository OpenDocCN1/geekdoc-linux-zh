    ```

    % ls [A,a]

    a1 a2 a4

    ```

    ```bash

    % ls [A-d]

    a1 b1 d1

    ```


    ### 输入/输出重定向与管道


    （这里有一个很酷的东西。）你知道那是什么吗？那是我运行 `ps` 来查看哪些进程正在运行；`ps` 在第 8.3 节中介绍过。那不是酷的地方。酷的地方是 `>`，它大致意味着获取
