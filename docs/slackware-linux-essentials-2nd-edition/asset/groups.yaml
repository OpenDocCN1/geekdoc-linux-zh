    # Using LILO


    Most people will want to use LILO to choose between Linux and Windows. As stated
    above, you should install Windows first, then Linux.


    Let''s say you have a 40GB IDE hard disk as the only drive in your system. Let''s
    also say that you want to give half of that space to Windows and half of that
    space to Linux. This will present a problem when trying to boot Lilo.


    ```

    20GB Windows boot (C:)

    1GB Linux root (/\)

    19GB Linux /usr (/usr)

    ```


    You would also want to set aside an adequate amount of space for a Linux swap
    partition. The unwritten rule is to use twice the amount of RAM you have in disk
    space. A 64MB system would have 128MB of swap, and so on. Adequate space is the
    discussion of many flames on IRC and Usenet. There’s no truly ‘tight’ way to do
    it, but sticking with the rule above should be sufficient.


    With your partitions laid out, you should proceed to install Windows. After that
    is set up and running, you should install Linux. The LILO installation needs special
    attention. You will want to select the expert mode for installing LILO.


    Begin a new LILO configuration. You will want to install it to Master Boot Record
    so that it can be used to choose between the two operating systems. From the menu,
    add your Linux partition and add your Windows (or DOS) partition. Once that’s
    complete, you can install LILO.


    Reboot the computer. LILO should load and display a menu you select between the
    operating systems you have installed. Select the name of the OS you wish to load
    (these names were selected when you setup LILO).


    LILO is quite a configurable boot loader. It’s not just limited to booting Linux
    or DOS. It can boot just about anything. The man pages for lilo(8) and lilo.conf(5)
    provide more detailed information.


    What if LILO doesn’t work? There are instances LILO just won’t work on a particular
    machine. Fortunately, there is another way to dual Linux and Windows.


    # Chapter 7 Booting


    # Using LOADLIN


    This method can be used if LILO doesn''t work on your system, or if you just don''t
    want to set up LILO. This method is also ideal for the user that reinstalls Windows
    often. Each time you reinstall Windows, it will overwrite the Master Boot Record,
    destroying any LILO installation. With LOADLIN, you are not subject to that problem.
    The biggest disadvantage is that you can only use LOADLIN to boot Linux.


    With LOADLIN, you can install the operating systems in any order desired. Be careful
    about installing things to the Master Boot Record, you do not want to do that.
    LOADLIN relies on the Windows partition bootable. So during the Slackware installation,
    make sure you skip the LILO setup.


    After installing the operating systems, copy the loadlin.zip (where X is a version
    number, such as 16a) from root''s home directory to your Windows partition. Also
    copy your kernel image to the Windows partition. You will need to be in Linux
    for this work to do. This example shows how to do:


    ```

    # mkdir /win

    # mount -t vfat /dev/hdal /win

    # mkdir /win/linux

    # cd /root

    # cp loadlin* /win/linux

    # cp /boot/vmlinuz /win/linux

    # cd /win/linux

    # unzip loadlin16a.zip

    ```


    That will create a C:LINUX directory on your Windows partition (assuming it''s
    /dev/sda1) and copy over the necessary stuff for LOADLIN. After doing this, you
    will need to reboot into Windows to set up a boot menu.


    Once in Windows, get to a DOS prompt. First, we need to make sure the system is
    set to not boot into the graphical interface.


    ```

    C:\> cd \

    C:\> attrib -r -a -s -h MSDOS.SYS

    C:\> edit MSDOS.SYS

    ```


    Add this line to the file:


    ```

    BootGUI=0

    ```


    Now save the file and exit the editor. Now edit C:\AUTOEXEC.BAT so we can add
    a boot menu. The following provides an example of what a boot block menu in AUTOEXEC.BAT
    would look like:


    ```

    cls

    echo System Boot Menu

    echo.

    echo 1 - Linux

    echo 2 - Windows

    echo.

    choice /c:12 "Selection? -> "nif errorlevel 2 goto WIN

    if errorlevel 1 goto LINUX

    :LINUX

    cls

    echo "Starting Windows..."

    cd \linux

    loadlin c:\linux\vmlinuz root=/dev/hda2 ro

    goto END

    :WIN

    cls

    echo "Starting Windows..."

    win

    goto END

    :END

    ```


    The key line is the one that runs LOADLIN. We tell it the kernel to load, the
    Linux root partition, and that we want mounted read-only initially.


    The tools for these two methods are provided with Slack Linux. There are numerous
    booters on the market, but these should work for most dual boot setups.


    # Deprecated Windows NT Hack


    This is the least common dual booting situation. In the days of old, LILO was
    unable to boot Windows NT, requiring Linux users to hack NTLDR, which presented
    severe problems than dual booting between Windows 9x and Linux. Understand that
    the following instructions are deprecated. LILO has been able to boot Windows
    NT/2000/XP/2003.


    1. Install Windows

    2. Install Linux, making sure you skip the LILO setup

    3. Get the first bytes of the partition

    4. Edit C:\INI to add entries

