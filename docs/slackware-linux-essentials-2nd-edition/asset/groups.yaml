    # Chapter 16 Vi


    text or edit what is already there. However, you can manipulate the text, search,
    quit, save, load new files, and more. This is intended only to be an introduction
    to the command mode. For a description of the various commands, see Section 16.7.


    Probably the most often used command in command mode is changing to insert mode.
    This is accomplished by hitting the i command. The cursor changes shapes, and
    INSERT -- is displayed at the bottom of the screen (note that this does not happen
    in all clones of vi). From there, all your keystrokes are entered into the current
    buffer and are displayed to the screen. To get back into command mode, hit the
    ESCAPE key.


    Command mode is also where you move around the file. On some systems, you can
    use the arrow keys to move around. On other systems, you may need to use the more
    traditional keys of “hjkl”. Here is a simple listing of how these keys are used
    to move around:


    +   - h move left one character

    - j move down one character

    - k move up one character

    - l move right one character


    Simply press a key to move. As you will see later, these keys can be combined
    with a number to move much more efficiently.


    Many of the commands that you will use in command mode begin with a colon. For
    example, quitting with q, as discussed earlier. The colon simply indicates that
    it is a command, while the “q” tells vi to quit. Other commands are an optional
    number, followed by a letter. These commands do not have a colon before them,
    and are generally used to manipulate the text.


    For example, deleting one line from a file is accomplished by hitting dd. This
    will remove the line that the cursor is on. Issuing the command 4dd would tell
    vi to remove the line that the cursor is on and the three after that. In general,
    the number tells how many times to perform the command.


    You can combine a number with the movement keys to move around several characters.'
