    \ bytes\nContent-Length: 192\nConnection: close\n```\n\nContent-Type: text/html\n\
    \n```\nConnection closed by foreign host.\n%\n```\n\nYou can do the same for other\
    \ plain-text protocols, as long as you know what port to connect to, and what\
    \ the commands are.\n\n## 13.6 The Secure shell\n\nToday, secure shell basks in\
    \ the adoration that telnet once enjoyed. ssh(1) allows one to make a connection\
    \ to a remote machine and execute programs as one were physically present; however,\
    \ ssh encrypts all the travelling between the two computers so if others intercept\
