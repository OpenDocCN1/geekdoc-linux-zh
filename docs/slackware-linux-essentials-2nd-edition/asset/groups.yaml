  - "[PAGE 144]\n\n# Chapter 10 Handling Files and Directories\n\n```\nls -a\n  bin\
    \ cdrom home mnt sbin usr\n  .. boot dev lib proc sunced var\n  .pwrchute_tmp\
    \ cdr etc last+found root tmp vmlinux\n```\n\nFiles beginning with a period (called\
