    ## Chapter 3 Installation


    | SELECT PROMPTING MODE |

    | Now you must select the type of prompts you''d like to see during the installation
    process. If you have the drive space, the ''full'' option is quick, easy, and
    by far the most toolproof choice. The ''newbie'' mode provides the most information
    but is much more time-consuming (presenting the packages one by one) than the
    menu-based choices. Otherwise, you can pick packages from menus using ''expert''
    or ''menu'' mode. Which type of prompting would you like to use? |

    | full | Install everything (almost 2 GB of software) |

    | newbie | Use verbose prompting (and follow tagfiles) |

    | menu | Choose groups of packages from interactive menus |

    | expert | Choose individual packages from interactive menus |

    | custom | Use custom tagfiles in the package directories |

    | tagpath | Use tagfiles in the subdirectories of a custom path |

    | help | Read the prompt menu help file |

    | < OK | < Cancel > |


    The **full** option will install every package from all software series you chose
    in the ''select'' section. There is no further prompting. This is the easiest
    installation method, since you do not need to make any decisions on the actual
    packages to install. Of course, this option also takes up the most hard drive
    space.


    The next option is **newbie**. This option installs all of the required packages
    in the selected series. For all other packages, it offers a prompt where you can
    select ''Yes'', ''No'', or ''Skip''. Yes and No do the obvious, Skip will go ahead
    to the next software series. Additionally, you will see a description and size
    requirement for each package to help you decide if you need it. We recommend this
    option for new users, as it ensures that you get all the required packages installed.
    However, it is a little slow because of the prompting.


    Menu is a faster and more advanced version of the newbie option. For each series,
    a menu is displayed, from which you can select all the non-required packages you
    want to install. Required packages are not displayed on this menu.


    For the more advanced user, install offers the **expert** option. This allows
    you complete control over what packages get installed. You can deselect packages
    that are absolutely required, resulting in a broken system. On the other hand,
    you can control exactly what goes onto your system. Simply select the packages
    from each series that you want installed. This is not recommended for the new
    user, as it is easy to shoot yourself in the foot.


    The custom and tag path options are also for advanced users. These options allow
    you to install based upon custom tag files that you created in the distribution
    tree. This is useful for installing large numbers of machines fairly quickly.
    For more information on using tag files, see Section 18.4.


    After selecting your installation method, one of few things will happen. If you
    selected full or menu, a menu screen will appear, allowing you to select the packages
    to be installed. If you selected full, packages will immediately start installed
    to the target. If you selected newbie, packages will be installed until an optional
    package is reached.


    Note that it is possible to run out of space while installing. If you selected
    too many packages for the amount of free space on the target device, you will
    have problems. The safest thing to do is to select some software and add more
    later, if you need it. This can easily be done using Slack’s package management
    tools. For this information, see Chapter 18.


    ## CONFIGURE


    The configure section allows you to do some basic system configuration, now that
    the packages have been installed. What you see here depends in large part upon
    the packages you have installed. You will, however, always see the following:


    ### Kernel selection


    Here you will be asked to select a kernel to install. You can install the kernel
    from the boot disk you used to install, the Slack CD-ROM, or from another floppy
    which you (always thinking ahead) have prepared. Or you can elect to skip, in
    which case the default kernel will be installed and play will continue to the
    dealer’s left.


    ### INSTALL LINUX KERNEL


    in order for your system to boot correctly, a kernel must be installed. If you''ve
    made this far using the installation bootdisk''s kernel (/vmlinuz), you should
    probably install it as your system kernel (/boot/vmlinuz). If you''re sure you
    know what you''re doing, you can also install your choice of kernels from the
    Slack CD, or a kernel from a floppy disk. You can also skip this menu, using whatever
    kernel has been installed already (such as a generic kernel from the A series).
    Which option would you like?


    | bootdisk | Use the kernel from the installation bootdisk |

    | cdrom | Use a kernel from the Slackware CD |

    | floppy | Install a zimage or bimage from a DOS floppy |

    | skip | Skip this menu (use the default /boot/vmlinuz) |


    < OK > < Cancel > >


    ### Make a boot disk


    Making a boot disk for future use is probably a good idea. You will have the option
    of formatting a floppy and then creating one of two types of boot disk. The first
    type, simple, simply (go figure) writes a kernel to the floppy. A more flexible
    (and highly recommended) option is lilo, which will of course create a lilo boot
    disk. See LILO in Section 7.1 for more information. Of course, you may also choose
    to simply continue, in which case no boot disk will be made.


