    # 17.3 Modes


    Every buffer in Emacs has an associated mode. This mode is very different from
    the idea of modes in vi: a mode tells you what kind of buffer you are in. For
    example, there is text-mode for normal text files, but there are also modes such
    as c-mode for editing C programs, sh-mode for editing shell scripts, latex-mode
    for editing LaTeX files, mail-mode for editing email and news messages, etc. A
    mode provides special customizations and functionality that is useful for the
    kind of file you are editing. It is even possible for a mode to redefine keys
    and key commands. For example, in'
