    # Chapter 1

    # An Introduction to Slackware Linux


    ## 1.1 What is Linux?


    Linus Torvalds started Linux, an operating system kernel, as a personal project
    in 1991. He started the project because he wanted to run a Unix-based operating
    system without spending a lot of money. In addition, he wanted to learn the ins
    and outs of the 386 processor. Linux was released free of charge to the public
    so that anyone could study it and make improvements under the General Public License.
    (See Section 1.3 and Appendix A for an explanation of the license.) Today, Linux
    has grown into a major player in the operating system market. It has been ported
    to run on a variety of system architectures, including HP/Compaq’s Alpha, Sun’s
    SPARC and UltraSPARC, and Motorola’s PowerPC chips (through Apple Macintosh and
    IBM RS/6000 computers). Hundreds, if not thousands, of programmers all the world
    now develop Linux. It runs programs like Sendmail, Apache, and BIND very popular
    used to run Internet servers. It''s important to remember that the term “Linux”
    really refers to the kernel - the core of the operating system. This core is responsible
    for controlling your computer''s processor, memory, hard drives, and peripherals.
    That''s all Linux really does: It controls the operations of your computer and
    makes sure that all of its programs behave. Various companies and individuals
    bundle the kernel and various programs together to make an operating system. We
    call each bundle a Linux distribution.


    # Chapter 1 An Introduction to Slackware Linux


    ## A Word on GNU


    The Linux kernel project began as a solo endeavor by Linus Torvalds in 1991, but
    as Isaac Newton once said, “If I have seen further, it is standing on the shoulders
    of giants.” When Linus Torvalds began the kernel the Free Software Foundation
    had already established the idea of collaborative software. They entailed their
    effort GNU, a recursive acronym that means simply ‘GNU’s Not Unix’. GNU software
    ran the Linux kernel from day 1. Their compiler gcc was used to compile the kernel.
    Today many GNU tools from gcc to gnutar are still at the basis of every Linux
    distribution. For this reason many of the Free Software Foundation’s proponents
    feel that their work should be given the same credit as the Linux kernel. They
    strongly suggest that all Linux distributions should refer to themselves as GNU/Linux.


    This is the topic of many flamewords, surpassed only the ancient vi versus emacs
    holy war. The purpose of this book is not to fan the fires of this discussion,
    but rather to clarify the terminology for neophytes. When one sees GNU/Linux it
    means a Linux distribution. When they can either be referring to the kernel, or
    to a distribution. It can be rather confusing. Typically the term GNU/Linux isnt
    used because it’s a mouth full.


    ## 1.2 What is Slackware?


    Slackware, started by Patrick Volkerding in late 1992, and initially released
    to the world on July 17, 1993, was the first Linux distribution to achieve widespread
    use. Volkerding learned of Linux when he needed an inexpensive LISP interpreter
    for a project. One of the distributions available at the time was SLS Linux from
    Soft Landing Systems. Volkerding used SLS Linux, fixing bugs as he found them.
    Eventually, he decided to merge all of these bugfixes into his own private distribution
    that he and his friends could use. This private distribution gained popularity,
    so Volkerding decided to name it Slackware and make it publicly available. Along
    the way, Patrick added new things to Slackware; a user friendly installation program
    based on a Unix system, as well as the concept of package management, which allows
    users to easily add, remove, or upgrade software packages on their systems.


    There are many reasons why Slackware is Linux’s oldest distribution. It does not
    try to emulate Windows, it tries to be Unix-like as possible. It does not try
    to cover up processes with fancy, point-and-click GUIs (Graphical User Interfaces).
    Instead, it puts users in control by letting them see exactly what’s going on.
    Its development is not rushed to meet deadlines-each version comes out when it
    is ready.


    Slackware is for people who enjoy learning and tweaking their system to do exactly
    what they want. Slackware’s stability and simplicity are why people will continue
    to use it for years to come. Slackware currently enjoys a reputation as a solid
    server and a no-nonsense workstation. You can find Slackware desktops running
