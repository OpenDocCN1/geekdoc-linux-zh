    # Chapter 6 X Configuration


    developed for The GNU Image Manipulation Program (or The GIMP, for short). As
    separate projects, KDE and GNOME each have their own designers and programmers,
    with different development styles and philosophies. The result in each case, however,
    has been fundamentally the same: a consistent, tightly integrated desktop environment
    and application collection. The functionality, usability, and sheer prett of both
    KDE and GNOME rival anything available on other operating systems.


    The best part, though, is that these advanced desktops are free. This means you
    can have either or both (yes, at the same time). The choice is yours.


    In addition to the GNOME and KDE desktops, Slack includes a large collection of
    window managers. Some are designed to emulate other operating systems, some for
    customization, others for speed. There’s quite a variety. Of course you can install
    as many as you want, play with them all, and decide which you like the most.


    To make desktop selection easy, Slack also includes a program called xwmconfig
    that can be used to select a desktop or window manager. It is run like so:


    ```

    % xwmconfig

    ```'
