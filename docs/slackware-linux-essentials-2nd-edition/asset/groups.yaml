    ## Chapter 4 System Configuration


    users. The answer is a definite maybe. There are few instances where you will
    need to compile a kernel specific to your system. Most users can use a precompiled
    kernel and the loadable kernel modules to achieve a fully working system. You
    will want to compile a kernel for your system if you are upgrading kernel versions
    to one that we do not currently offer in Slackware, or if you have patched the
    kernel to get special device support that is not in the native kernel source.
    Anyone with an SMP system will definitely want to compile a kernel with SMP support.
    Also, many users find a custom kernel runs much faster on their machine. You may
    find it useful to compile the kernel with optimizations for the specific processor
    in your machine.


    Building your own kernel is not that hard. The first step is to make sure you
    have the kernel source installed on your system. Make sure that you installed
    the packages from the K series during the installation. You will also want to
    make sure you have the D series installed, specifically the C compiler, GNU make,
    and GNU binutils. In general, it is a good idea to have the D series installed
    if you are planning any kind of development. You can also download the latest
    kernel source from http://www.kernel.org/mirrors.


    ## Linux Kernel version 2.4. Compilation


    ```bash

    % su -

    Password:

    # cd /usr/src/linux

    ```


    The first step is to bring the kernel source into its base state. We issue this
    command to do that (note, you may wish to back-up the .config file as this command
    will delete it without warning):


    ```bash

    # make mrconfig

    ```


    Now you can configure the kernel for your system. The current kernel offers three
    ways of doing this. The first is the original text-based question and answer system.
    It asks a bunch of questions and then builds a configuration file. The problem
    with this method is that if you mess up, you must start over. The method that
    most people prefer is the menu driven one. Lastly, there is an X-based kernel
    configuration tool. Pick the one you want and issue the appropriate command:


    ```bash

    # make config (text-based Q&A version)

    # make menuconfig (menu driven, text-based version)

    # make xconfig (X-based version, make sure you are in X)

    ```


    ### Figure 4-1. Kernel Configuration Menu


    Linux Kernel v2.2.16 Configuration


    Arrow keys navigate the menu. <Enter> selects submenus --->.

    Highlighted letters and hotkeys. Press <Y> includes, <N> excludes,

    <M> modularizes features. Press <Esc><Esc> to exit, <?> for help

    Legend: [*] built-in [ ] excluded <M> module < module capable


    | Main Menu |

    | :--- |

    | Code maturity level options ---> |

    | Processor type and features ---> |

    | Loadable module support ---> |

    | General setup ---> |

    | Plug and Play support ---> |

    | Block devices ---> |

    | Networking options ---> |

    | Telephony Support ---> |

    | SCSI support ---> |

    | Network device support ---> |

    | Amateur Radio support ---> |

    | \| < Select > < Exit > < Help > |


    New users will probably find menuconfig to be the easiest to use. Help screens
    are provided that explain the various parts of the kernel. After configuring your
    kernel, exit the configuration program. It will write the necessary configuration
    files. Now you can prepare the source tree for a build:


    ```bash

    # make dep

    # make clean

    ```


    The next step is to compile the kernel. First try issuing the bzImage command
    below.


    ```bash

    # make bzImage

    ```


    This may take a while, depending on your CPU speed. During the build process,
    you will see the compiler messages. After building the kernel image, you will
    want to build any parts of the kernel that you flagged as modular.


    ```bash

    # make modules

    ```


    We can now install the kernel and modules that you compiled. To install the kernel
    on a Slack system, these commands should be issued:


    - mv /boot/vmlinuz /boot/vmlinuz.old

    - cat arch/i386/boot/bzImage > /vmlinuz

    - mv /boot/System.map /boot/System.map.old

    - cp System.map /boot/System.map

    - make modules_install


    You will want to edit /etc/lilo.conf and add a section to boot your old kernel
    in case your new one does not work. After doing that, run /sbin/lilo to install
    the new kernel compilation boot block. You can now reboot with your new kernel.


    ## Linux Kernel Version 2.6.x


    The compilation of a 2.6 kernel is only slightly different from a 2.4 or a 2.2
    kernel, but it is important that you understand the differences before delving
    in it. It''s no longer necessary to run make dep and make clean. Also, the kernel
    compilation process is not as verbose as the 2.6 kernel series. This results in
    a build process that is easier to understand, but has some shortcomings as well.
    If you have trouble building the kernel, it''s highly recommended that you turn
    verbosity back up. You can do this simply by appending V=1 to the build. This
    allows you to get more information that could help a kernel developer or other
    friendly geek aid you in resolving the issue.


    ```bash

    # make bzImage V=1

    ```


    ## Using Kernel Modules


    Kernel modules are another name for device drivers that can be inserted into a
    running kernel. They allow you to extend the hardware supported by your kernel
    without needing to pick another kernel or compile one yourself.


    Modules can also be loaded and unloaded at any time. They are stored in /lib/modules.
    In general, it is a good idea to have the D series installed if you are planning
    any kind of development. You can also download the latest kernel source from http://www.kernel.org/mirrors.


    To see a list of active modules, use lsmod:


    ```text

    lsmod

    Module Size Used

    parport 0 0

    ```


    To remove a module, use rmmod(1) command. To load a module, use insmod(1) command.
    For more advanced management, use modprobe(1) which is safer and handles dependencies
    automatically.

