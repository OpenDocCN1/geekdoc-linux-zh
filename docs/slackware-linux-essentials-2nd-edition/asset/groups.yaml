    # Chapter 3


    # Installation


    Before you can use Slackware Linux, you''ll have to obtain and install it. Getting
    Slackware is as easy as purchasing it or downloading it for free over the Internet.
    Installing it is also easy as long as you have some basic knowledge about your
    computer and are willing to learn a few other things. The installation program
    itself is very much a step-by-step process. Because of this, you can be up and
    running very quickly. In fact, Slackware boasts one of the lowest installation
    times of any full-featured Linux distribution.


    # 3.1 Getting Slackware


    # The Official Disc and Box Sets


    The official Slackware Linux CD set is available from Slackware Linux, Inc. The
    CD consists of 4 disks. The first disk contains all the software needed for a
    basic server install, and the Window system. The second cd is a “live” cd; that
    is, a bootable cd that installs into RAM and gives you a temporary installation
    to play around with or a data or machine rescue. This cd also contains a few packages
    such as the KDE and GNOME desktop environments. A few goodies are included on
    the second cd including many non-vital packages in the “extra” folder. The third
    and fourth CDs contain the source code to all of Slackware, along with the original
    edition of this book.


    One may also purchase a boxed set that includes the 4 disks and a copy of this
    book, as well as lots of neat Slackware gear to show off your geek pride. CD subscriptions


    # Chapter 3 Installation


    are available at a reduced rate also.


    The preferred method for shopping for Slackware merchandise is online on the Slackware
    store.


    ```

    http://store.slackware.com

    ```


    You can also call or e-mail your order in.


    # Table 3-1. Slackware Linux, Inc. Contact Information


    | Method | Contact Details |

    | --- | --- |

    | Telephone | 1-(925) 674-0783 |

    | Website | http://store.slackware.com |

    | Email | orders@slackware.com |

    | Postal | 1164 Claremont Drive, Brentwood, CA 94513 |


    # Via the Internet


    Slackware Linux is also freely available over the Internet. You may email in your
    support questions, but higher priority will be given to those who have purchased
    the official CD set. With that said, we get a lot of e-mails and our time is rather
    limited. Before e-mailing for support consider reading Chapter 2 first.


    The official Slackware Linux Project website is located at:


    ```

    http://www.slackware.com/

    ```


    The primary FTP location for Slackware Linux is:


    ```

    ftp://ftp.slackware.com/pub/slackware/

    ```


    Bear in mind that our ftp site, while open for general use, does not have unlimited
    bandwidth. Please consider using a mirror near you to download Slackware. An incomplete
    list of mirrors can be found on our site at http://www.slackware.com/getslack.


    # 3.2 System Requirements


    An easy Slackware installation requires, at minimum, the following:


    # Table 3-2. System Requirements


    | Hardware | Requirement |

    |---|---|

    | Processor | 586 |

    | RAM | 32 MB |

    | Disk Space | 1GB |

    | Media Drive | 4x CD-ROM |


    If you have the bootable CD, you will probably not need a floppy drive. The disk
    space requirement is somewhat tricky. The 1GB recommendation is usually safe for
    a minimal install, but if you do a full install, you will need around twoabytes
    of available disk space. Slackware can be installed to systems with less RAM,
    smaller hard drives, and weaker CPUs, but doing so will require a little elbow
    grease. If you''re up for a little work, take a look at the LOWMEM.TXT file in
    the distribution tree for few helpful hints.


    # Software Series


    For reasons of simplicity, Slackware has historically been divided into software
    series. Once called ''disk sets'' because they were designed for floppy-based
    installation, the software series are now used primarily to categorize the packages
    included in Slackware. Today, floppy installation is no longer possible.


    # Chapter III Installation


    The following is a brief description of each software series.


    # Table 3-3. Software Series


    | Series | Contents |

    |---|

    | A | The base system. Contains enough software to get up and running and have
    a text editor and basic communication program. |

    | AP | Various applications that do not require the X Window System. |

    | D | Program development tools. Compilers, debuggers, interpreters, and man pages
    are all here. |

    | E | GNU Emacs. |

    | F | FAQs, HOWTos, and other miscellaneous documentation. |

    | GNOME | The GNOME desktop environment. |

    | K | The source code for the Linux kernel. |

    | KDE | The K Desktop Environment. An X environment which shares a lot of look-and-feel
    features with MacOS and Windows. The Qt library, which KDE requires, is also in
    this series. |

    | KDEI | Internationalization packages for the KDE desktop. |

    | L | Libraries. Dynamically linked libraries required by many other programs.
    |

    | N | Networking programs. Daemons, mail programs, telnet, news readers, and so
    on. |

    | T | LaTeX document formatting system. Tk, Tcl, and TkDesk. |

    | TCL | The Tool Command Language. Tk, Tcl, and TkDesk. |

    | X | The base X Window System. |

    | XAP | X Applications that are not part of a major desktop environment (for example,
    Ghostscript and Netscape). |

    | Y | BSD Console games |

    '
