    but is much more time-consuming (presenting the packages one by one) than the
    menu-based choices. Otherwise, you can pick packages from menus using ''expert''
    or ''menu'' mode. Which type of prompting would you like to use? |

    | full | Install everything (almost 2 GB of software) |

    | newbie | Use verbose prompting (and follow tagfiles) |

    | menu | Choose groups of packages from interactive menus |

    | expert | Choose individual packages from interactive menus |

    | custom | Use custom tagfiles in the package directories |

    | tagpath | Use tagfiles in the subdirectories of a custom path |

    | help | Read the prompt menu help file |

    | < OK | < Cancel > |


    The **full** option will install every package from all software series you chose
    in the ''select'' section. There is no further prompting. This is the easiest
    installation method, since you do not need to make any decisions on the actual
    packages to install. Of course, this option also takes up the most hard drive
    space.


    The next option is **newbie**. This option installs all of the required packages
    in the selected series. For all other packages, it offers a prompt where you can
    select ''Yes'', ''No'', or ''Skip''. Yes and No do the obvious, Skip will go ahead
    to the next software series. Additionally, you will see a description and size
    requirement for each package to help you decide if you need it. We recommend this
    option for new users, as it ensures that you get all the required packages installed.
    However, it is a little slow because of the prompting.


    Menu is a faster and more advanced version of the newbie option. For each series,
    a menu is displayed, from which you can select all the non-required packages you
    want to install. Required packages are not displayed on this menu.


    For the more advanced user, install offers the **expert** option. This allows
    you complete control over what packages get installed. You can deselect packages
    that are


