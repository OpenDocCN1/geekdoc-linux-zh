    \ shell 提示符。从这里，你可以执行任何需要文本控制台的操作：撰写邮件、阅读新闻组、移动文件等。如果你正在运行 X 并 `telnet` 到另一台机器，你可以在远程计算机上运行\
    \ X 程序并将它们显示在你的机器上。\n\n要登录远程机器，请使用以下语法：\n\n```\ntelnet <hostname>\n```\n\n如果主机响应，你将收到登录提示符。输入你的用户名和密码。就这样。你现在处于一个\
