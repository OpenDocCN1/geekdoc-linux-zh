    # 第一章

    # Slackware Linux 简介


    ## 1.1 什么是 Linux？


    Linus Torvalds（林纳·托瓦兹）于1991年作为一个个人项目启动了 Linux——一个操作系统内核。他启动这个项目是因为想在不花费大量资金的情况下运行基于
    Unix 的操作系统。此外，他还想学习 386 处理器的各种细节。Linux 免费向公众发布，以便任何人都可以根据通用公共许可证（GPL）对其研究和改进。（有关许可证的解释，请参见第1.3节和附录A。）今天，Linux
    已成为操作系统市场中的主要力量。它被移植到各种系统架构上，包括 HP/Compaq 的 Alpha、Sun 的 SPARC 和 UltraSPARC，以及
    Motorola 的 PowerPC 芯片（通过 Apple Macintosh 和 IBM RS/6000 计算机）。现在全球有成百上千的程序员在开发 Linux。它运行诸如
    Sendmail、Apache 和 BIND 等非常流行的用于运行 服务器的程序。要记住，“Linux”这个术语实际上指的是内核——操作系统的核心。这个核心负责控制你电脑的处理器、内存、硬盘和外设。这就是
    Linux 所做的全部：它控制你电脑的操作并确保其所有程序运行正常。不同的公司和个人将内核和各种程序打包在一起形成一个操作系统。我们将每个程序包称为 Linux
    发行版。


    # 第一章 Slackware Linux 简介


    ## 关于 GNU 的说明


    Linux 内核项目是 Linus Torvalds 在1991年作为个人努力开始的，但正如艾萨克·牛顿曾说过的：“如果我看得更远，是因为我站在巨人的肩膀上。”当
    Linus Torvalds 开始开发内核时，自由软件基金会已经建立了协作软件的概念。他们投入精力开发 GNU，这是一个递归缩写，简单来说就是“GNU''s
    Not Unix”（GNU 不是 Unix）。GNU 软件从第一天起就运行 Linux 内核。他们的编译器 `gcc` 被用于编译内核。今天，从 `gcc`
    到 `gnutar` 的许多 GNU 工具仍然是每个 Linux 发行的基础。由于这个原因，自由软件基金会的许多支持者认为，他们的工作应该获得与 Linux
    内核同等的声誉。他们强烈建议所有 Linux 发行版都应该自称为 GNU/Linux。


    这是一个引发许多争论的话题，仅次于古老的 vi 与 emacs 之间的“圣战”。本书的目的不是为了助长这场讨论的火，，而是为初学者澄清术语。当你看到 GNU/Linux
    时，它意味着一个 Linux 发行版。它既可以指的是内核，也可以指的是一个发行版。这可能会相当困惑。通常不使用 GNU/Linux 这个术语是因为它太拗了。


    ## 1.2 什么是 Slackware？


    Slackware 由 Patrick Volkerding 于1992年后期启动，并于1993年7月17日首次向世界发布，是第一个获得广泛使用的 Linux
    发行版。Volkerding 在为一个项目需要一个廉价的 LISP 解释器时得知了 Linux。当时提供的发行版之一是来自 Soft Landing Systems
    的 SLS Linux。Volkerding 使用 SLS Linux，并在发现漏洞时修复。最终，他决定将所有这些修复合并到自己的私有发行版中，供他和朋友使用。这个私有发行版获得了人气，因此
    Volkerding 决定将其命名为 Slackware 并向公众开放。在此过程中，Patrick 为 Slackware 添加了新功能：一个基于 Unix
    系统的用户友好安装程序，以及包管理概念，这允许用户在他们的系统中轻松地添加、删除或升级软件包。


    有很多原因导致 Slackware 是 Linux 最古老的发行版。它并不试图模拟 Windows，而是试图尽可能像 Unix。它并不试图用花哨的、点点式的
    GUI（图形用户界面）来掩盖进程。相反，它通过让用户看到确切发生的情况来让他们掌握控制权。它的开发并没有为了赶截止日期而仓忙——每个版本在准备就绪时就会发布。


    Slackware 适合那些喜欢学习和调整自己的系统以完全按照自己的想法运行的人。Slackware 的稳定和简单是人们在未来几年内继续使用它的原因。Slackware
    目前被誉为可靠的服务器和务实的工作站。你可以发现 Slackware 运行在任何窗口管理器或桌面环境中，或者完全没有。Slackware 服务器在任何可以使用的范围内运行。Slackware
    用户是用户中最满意的。当然，我们可以说^)


    ## 1.3 开源与自由软件


    在 Linux 社区内部，有两个主要的思想运动在运作。自由软件运动（我们稍后会介绍）正致力于使所有软件免受知识产权限制。该运动的支持者认为这些限制阻碍了技术改进。开源运动也致力于相同的目标，但采取了更务实的方法。开源运动的支持者倾向于基于代码免费提供的经济和技术优势来提出论点，而不是道德和伦理原则。在光谱的另一端是那些希望对软件保持更严格控制的团体。


    自由软件运动由自由软件基金会领导，该基金会是 GNU 项目的筹款组织。自由软件更多地是一种意识形态。


    经常使用的表达是“言论上的自由，而非金钱上的自由”（free in speech, not free in beer）。本质上，自由软件是尝试为用户和开发者保证某些权利。这些自由包括为了任何原因运行程序、研究和修改源代码、重新发布你做的任何修改。为了保证这些自由，创建了
    GNU 通用许可证（GPL）。简而言之，GPL 提供分发许可的编译程序必须提供源代码，只要以源代码形式提供修改，就可以对程序进行修改。这保证了一旦程序向社区“开放”，除非每个部分代码的作者（包括修改部分）同意，否则无法“关闭”。大多数
    Linux 程序都采用 GPL 许可。


    注意的是，GPL 对价格没有做任何规定。尽管听起来可能很奇怪，你可以对自由软件收费。“免费”部分是指你对源代码的自由，而不是你为软件支付的价格。（然而，一旦有人卖给你或给你一个
    GPL 许可的编译程序，他们就有义务提供源代码。）


    另一个流行的许可证是 BSD 许可证。与 GPL 相比，BSD 许可证不要求发布程序的源代码。只要满足几个条件，根据 BSD 许可证发布的软件允许以源代码或二进制形式重新分发。作者的信誉不能作为该程序的某种广告。它还免除了作者因使用源代码可能产生的损害的责任。Linux
    中包含的许多软件都是 BSD 许可的。


    在年轻的开源运动的前沿，开源倡议（OSI）是一个纯粹为了获得开源软件支持的组织，即既提供源代码又提供现成程序的软件。他们不提供特定的许可证，而是支持各种类型的开源许可证。

