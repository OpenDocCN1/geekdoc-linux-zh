    At this point, the xorgconfig program will ask if you''d like to save the current
    configuration file. Answer yes, and the X configuration file is saved, completing
    the setup process. You can start X now with the startx command.


    # 6.2 xorgsetup


    The second way to configure X is to use xorgsetup, an automagical configuration
    program that comes with Slackware.


    To run xorgsetup, log in as root and type:


    ```

    # xorgsetup

    ```


    If you''ve already got an /etc/X11/xorg.conf file because you''ve already configured
    X, you''ll be asked if you want to backup the existing config file before continuing.
    The original file will be renamed to /etc/X11/xorg.conf.backup.


    # 6.3 xinitrc


    xinit(I) is the program that actually starts X; it is called by startx(I), so
    you may not have noticed it (and probably don''t really need to). Its configuration
    file, however, determines which programs (including the window manager) are run
    when X starts up. xinit first checks your home directory for a .xinitrc file.
    If the file is found, it gets run; otherwise, /var/X11R6/lib/xinit/xinitrc (the
    systemwide default) is used. Here''s a simple xinitrc:


    ```

    #!/bin/sh

    # $XConsortium: xinitrc.cpp, v 1.4 91/08/22 11:41:34 rws Exp $


    userresources=$HOME/.Resources

    ermodmap=$HOME/.Xmodmap

    sysresources=/usr/X11R6/lib/X11/xinit/.Resources

    sysmodmap=/usr/X11R6/lib/X11/xinit/.Xmodmap

    ```'
