    # Installation Methods


    ## Floppy


    While it was once possible to install all of Slack Linux from floppy disks, the
    increasing size of software packages (indeed, of some individual programs) forced
    the abandonment of the floppy install. As late as Slack version 7.1 a partial
    install was possible using floppy disks. The A and N series could be nearly entirely
    installed, providing a base system from which to install the rest of the distribution.
    If you are considering a floppy install (typically on older hardware), it is typically
    recommended to find a base CD, or use an older release. Slack 4.0 is still very
    popular for this reason, as is 7.0.


    Please note that floppy disks are still required for a CD-ROM install if you do
    not have a bootable CD, as well as for an NFS install.


    ## CD-ROM


    If you have the bootable CD, available in the official disc set published by Slack
    Linux, Inc. (see the section called Getting Slack), a CD-based installation will
    be a bit simpler for you. If not, you will need to boot from floppies. Also, if
    you have special hardware that makes usage of the kernel on the bootable CD problematic,
    you may need to use specialized floppies.


    As of Slack version 8.1, a new method is used for creating the bootable CDs, which
    does not work as well with certain flaky BIOS chips (it is worth noting that most
    Linux CDs suffer from this these days). If that is the case, we recommend booting
    from a floppy disk.


    Section 3.2.3 and Section 3.2.5 provide information on choosing and creating floppies
    from which to boot, should this be necessary.


    # Chapter 3 Installation


    ## NFS


    NFS (the Network File System) is a way of making filesystems available to remote
    machines. An NFS install allows you to install Slack from another computer on
    your network. The machine from which you are installing needs to be configured
    to export the Slack distribution tree to the machine to which you''re installing.
    This, of course, involves some knowledge of NFS, which is covered in Section 5.6.


    It is possible to perform an NFS install via such methods as PLIP (over a parallel
    port), SLIP, and PPP (though not over a modem connection). However, we recommend
    the use of a network card if available. After all, installing an operating system
    through your printer port is going to be a very, very slow process.


    ## Boot Disk


    The boot disk is the floppy you actually boot from to begin the installation.
    It contains a compressed kernel image which is used to control the hardware during
    installation. Therefore, it is very much required (unless you''re booting from
    CD, as discussed in the section called CD-ROM). The boot disks are located in
    the bootdisks/directory in the distribution tree.


    There are more Slack boot disks than you can shake a stick at (which is to say
    about 16). A complete list of boot disks, with a description of each, is available
    in the Slack distribution tree in the file bootdisks/README.TXT. However, most
    people are able to use the bare.i (for IDE devices) or scsi.s (for SCSI devices)
    boot disk image.


    See Section 3.2.6 for instructions on making a disk from an image.


    After booting, you will be prompted to insert the root disk. We recommend that
    you just humor the boot disk and play along.


    ## Root Disk


    The root disks contain the setup program and a filesystem which is used during
    installation. They are also required. The root disk images are located in the
    directory tree. You''ll have to make two root disks from the install.1 and install.2
    images. Here you can also find the network.dsk, pcmcia.dsk, rescue.dsk, and bootmgr.dsk
    disks.


    ## Supplemental Disk


    A supplemental disk is needed if you are performing an NFS or installing to a
    system with PCMCIA devices. Supplemental disks are in the rootdisks directory
    in the distribution tree, with the filenames network.dsk and pcmcia.dsk. Recently
    other supplemental disks as rescue.dsk and bootmgr.dsk have been added. The rescue
    disk is a small floppy image that runs in a 4MB RAM drive. It includes some basic
    networking utilities and the vi editor for quick fixes on busted machines. The
    bootsmgr.dsk is used to boot other devices. Boot off if your CD-ROM drive doesn''t
    want to boot the Slack CDs. It will prompt you for different things to boot and
    may offer a convenient way to work around a buggy BIOS.


    The root disk will instruct you on the use of supplemental disks when it is loaded.


    ## Making the Disks


    Once you''ve selected a boot disk image, you need to put it on a floppy. The process
    is slightly different depending on which operating system you''re using to make
    the disks. If you''re running Linux (or pretty any Unix-like OS) you''ll need
    to use the dd(1) command. Assuming bare.i is your disk image file and your floppy
    drive is /dev/fd0, the command to make a bare.i floppy is:


    ```

    % dd if=bare.i of=/dev/fd0

    ```


    If you’re running a Microsoft OS, you’ll need to use the RAWRITE.EXE program,
    which is included in the distribution tree in the same directories as the floppy
    images. Again assuming that bare.i is your disk image file and your floppy drive
    is A:, open a DOS prompt and type the following:


    ```

    C:\write a: bare.i

    ```


    ## 3.3 Partitioning


    After booting from your preferred media, you will need to partition your hard
    disk. The disk partition is where the Linux filesystem will be created and where
    Slackwill be installed. At the very minimum we recommend creating two partitions;
    one for your root filesystem (/) and one for swap space.


    After the root finishes loading, it will present you with a login prompt. Log
    in as root (there is no password). At the shell prompt, run either cfdisk(8) or
    fdisk(8). The cfdisk program provides a more user-friendly interface than the
    regular fdisk program, but does lack some features. We will briefly explain the
    fdisk program below.


    Begin by running fdisk for your hard disk. In Linux, the hard disks do not have
    drive letters, but are represented by a file. The first IDE hard disk (primary
    master) is /dev/hda, the primary slave is /dev/hdb, and so on. SCSI disks follow
    the same type system, but are in the form of /dev/sdx. You will need to start
    fdisk and pass it your hard disk:


    ```

    # fdisk /dev/hda

    ```


    Like good Unix Programs, fdisk gives you a prompt (thought you were getting a
    menu, right?). The first thing you should do is examine your current partitions.
    Do that by typing p at the fdisk prompt:


    ```

    Command (m for help): p

    ```


    This will display all sorts of information about your current partitions. Most
    people pick a free drive to install to and then remove any existing partitions
    on it to create room for the Linux partitions.


    > **Warning: IT IS VERY IMPORTANT THAT YOU BACK UP ANY INFORMATION YOU WANT TO
    SAVE BEFORE DESTROYING THE PARTITION IT LIVES ON.**


    There is no easy way to recover from deleting a partition, so always back up before
    playing with them.


    Looking at the table of partition information you should see a partition number,
    the size of the partition, and its type. There''s more information, but don''t
    worry about for now. We are going to delete all of the partitions on this drive
    to create the Linux ones. We run the `d` command to delete those:


    ```

    Command (m for help): **d**

    Partition number (1-4): **1**

    ```


    This process should be continued for each of the partitions. After deleting the
    partitions we are ready to create the Linux ones. We have decided to create one
    partition for our root filesystem and for swap.

    '
