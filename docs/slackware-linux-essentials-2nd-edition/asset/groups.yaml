    \n```\n# rm -rf /\n```\n\n使用 rm 时要非常小心；你可能会自掘坟墓。它有几个命令行选项，在在线手册页中进行了详细讨论。\n\n\
    ### rmdir\n\nrmdir(1) 从文件系统中删除目录。目录在删除之前必须是空的。语法简单如下：\n\n```\n# rmdir <directory>\n\
