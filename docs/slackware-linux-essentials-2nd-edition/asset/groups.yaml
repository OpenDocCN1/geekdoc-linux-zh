    ## 8.4 Virtual Terminals


    You''re in the middle of working on something and you decide you need to do something
    else. You could drop what you''re doing and switch tasks, but this is a multi-user
    system, right? And you can log in as many times simultaneously as you want, right?
    Why should you have to do one thing at a time?


    You don''t. We can''t have multiple keyboards, mice, and monitors for one machine;
    changes are most of us you want them. Clearly, hardware isn''t the solution. That
    leaves software, and Linux steps up on this one, providing “Virtual terminals”,
    or “VTs”.


    By pressing `Alt` and a function key, you can switch between virtual terminals;
    each function key corresponds to one. Slack logins on 6 VTs by default. `Alt+F2`
    will take you to the second one, `Alt+F3` to the third,


    The rest of the function keys are reserved for X sessions. Each session uses its
    own VT, beginning with the seventh (`Alt+F7`) and going up. In X, the `Alt+Function`
    key combination is replaced with `Ctrl+Alt+Function`; so if you are in X and want
    to get back to a text login (without exiting your X session), Ctrl+Alt+F3 will
    take you to the third. (Alt+F7 will take you back, assuming you''re using the
    first X session.)


    ## Screen


    But about situations where there are no virtual terminals? What then? Fortunately,
    slackware includes a beautiful screen manager aptly named screen. screen is a
    terminal emulator that has virtual terminal like capabilities. Executing screen
    flashes a brief introduction, then dumps to a terminal. Unlike the standard virtual
    terminals, screen has its own commands. All screen commands are prefixed with
    a Ctrl+A keystroke. For example, Ctrl+A+C will create a new terminal session.
    Ctrl+A+P switches to the previous terminal.


