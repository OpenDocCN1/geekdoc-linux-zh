    either through the netconfig script, or you may edit /etc/rc.d/rcinet1.conf. In
    /etc/rc.d/rcinet1.conf, you will notice:


    ```

    IPADDR[0]=""

    NETMASK[0]=""

    USE_DHCP[0]=""

    DHCP_HOSTNAME[0]=""

    ```


    Then further at the bottom:


    ```

    GATEWAY=""

    ```

