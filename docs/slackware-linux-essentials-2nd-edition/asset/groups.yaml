    # Chapter 18 Slack Package Management


    A software package is a bundle of related programs that are ready for install.
    When you download a source code archive, you have to configure, compile, and install
    it by hand. With a software package, this has already been done for you.


    There''s a myth that''s going around ever since RedHat debuted RedHat Package
    Manager, that Slackware has no package tool. This simply couldn''t be further
    from the truth. Slackware has always included a package manager, even before RedHat
    existed.


    Apparently many people in the Linux community think that a pack manager by definition
    include dependency checking. Well, that simply isn''t the case, as Slackware most
    certainly does not. This is not to say that Slackware packages don''t have dependencies,
    but rather that its package manager doesn''t check for them. Dependency management
    is left up to the sysadmin, and that''s the way we like.


    ## 18.1 Overview of Package Format


    Before learning the utilities, you should become familiar with the format of a-package.
    In Slack, a package is simply a tar archive file that has been compressed with
    gzip. Packages are built to be extracted in the root directory.


    Here is a fictitious program and its example package:


    ```

    ./usr/bin/

    usr/bin/makehejaz

    usr/doc/

    usr/doc/makehejaz-1.0/COPYING

    usr/doc/makehejaz-1.0/README

    usr/man/

    usr/man/manl

    usr/man/manl/makehejaz.1.gz

    install/

    install/doinst.sh

    ```


    The package system will extract this file in the root directory to install it.
    An entry in the package database will be created that contains the contents of
    this package so that it can be upgraded or removed later.


    Notice the install/ subdirectory. This is a special directory that can contain
    a post-installation script called doinst.sh. If the package system finds this
    file, it will execute after installing the package.


    Other scripts can be embedded in the package, but those are discussed more in
    detail in Section 18.3.2 below.


    ## 18.2 Package Utilities


    There are four main utilities for package management. They perform installation,
    removal, and upgrades of packages.

