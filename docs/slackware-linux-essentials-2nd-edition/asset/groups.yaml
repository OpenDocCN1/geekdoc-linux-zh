    # 16.4 Saving Files


    There are several ways to save files in vi. If you want to save the current buffer
    to the file randomness, you would type:


    ```

    :w randomness

    ```


    Once you''ve saved the file once, saving it again is as simple as typing :w. Any
    changes will be written out to the file. After you''ve saved the file, you are
    dumped back into command mode. If you want to save the file and quit vi (a very
    common operation), you would type :wq. That tells vi to save the current file
    and quit back to the shell.


    On occasion, you want to save a file that is marked as read-only. You can do this
    by adding an exclamation point after the write command, like so:


    ```

