    ### 1.9 FTP 客户端


    FTP 代表文件传输协议（File Transfer Protocol）。它允许在两台计算机之间发送和接收文件。分为 FTP 服务器和 FTP 客户端。我们在本节讨论客户端。对于好奇的人来说，“客户端”就是你。“服务器”是响应你的请求并让你下载和上传文件到服务器的计算机。客户端不能接受连接，只能连接到服务器。要连接到
    FTP 服务器，只需运行 `ftp <hostname> <port>`。如果主机运行 FTP 服务器，它会要求用户名和密码。你可以以自己的身份或以“anonymous”（匿名）身份登录。匿名站点对于软件存档非常流行。例如，通过
    FTP 获取 Slackware，你必须使用匿名登录。一旦连接，你将处于 ftp 提示符。FTP 有一些特殊命令，但与标准命令相似。以下显示了一些基本命令及其作用：表
    13-1. ftp 命令


    | 命令 | 作用 |

    |---|---|

    | ls | 列出文件 |

    | cd <dirname> | 目录 |

    | bin | 设置二进制模式 |

    | ascii | 设置 ASCII 模式 |

    | get <filename> | 下载文件 |

    | put <filename> | 上传文件 |

    | hash | 切换统计 |

    | tick | 切换计数器 |

    | prom | 交互模式 |

    | mget <mask> | 下载文件或组；允许通配符 |

    | mput <mask> | 上传文件或组；允许通配符 |

    | quit | 退出服务器 |


    你还可以使用一些显而易见的命令：chmod, delete, rename。要查看命令列表及其含义，只需输入 `help` 并在屏幕上显示。FTP 是一个简单的程序，但缺乏我们现在习惯的用户界面。man
    页面讨论了 ftp(1)的一些命令行选项。


