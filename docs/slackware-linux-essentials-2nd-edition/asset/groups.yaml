    \n### mkdir\n\nmkdir(1) 将创建一个新目录。在运行 mkdir 时，只需指定要创建的目录即可。此示例在当前目录下创建 hejaz 目录：\n\
    \n```\n$ mkdir hejaz\n```\n\n你也可以指定路径，例如：\n\n```\n$ mkdir /usr/local/hejaz\n```\n\
    \n-p 选项会告诉 mkdir 创建任何父目录。如果 /usr/local 不存在，上面的示例将失败。-p 选项将创建 /usr/local 和 /usr/local/hejaz：\n\
    \n```\n% mkdir -p /usr/local/hejaz\n```\n\n## 10.5 复制和移动\n\n### cp\n\ncp(1) 复制文件。DOS\
    \ 用户会注意到它与 copy 命令的相似之处。cp 有许多选项，因此在使用之前你应该查看 man 手页。\n常见的用法是使用 cp 将文件从一个位置复制到另一个位置。例如：\n\
    \n```\n% cp hejaz /tmp\n```\n\n这会将当前目录下的 hejaz 文件复制到 /tmp 目录。\n\n许多用户更倾向于保留时间戳，如示例所示：\n\
    \n```\n% cp -a hejaz /tmp\n```\n\n这确保了时间戳在复制过程中不会被修改。\n\n要递归地复制目录的内容到另一个目录，你需要执行此命令：\n\
