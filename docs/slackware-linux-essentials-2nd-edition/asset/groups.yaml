    # System Startup


    The first program to run under Slack besides the Linux kernel is init(8). This
    program reads the /etc/initab(5) file to see how to run the system. It runs the
    /etc/rc.d/rc.s script to prepare the system before going into your desired runlevel.
    The rc.s file enables your virtual memory, mounts your filesystems, cleans up
    certain log directories, initializes Plug and Play devices, loads kernel modules,
    configures PCMCIA devices, sets up serial ports, and runs System V init scripts
    (if found). Obviously rc.s has a lot on its plate, but here are some scripts in
    /etc/rc.d that rc.s will call on to complete its work:


    ```

    rc.S

    ```


    This is the actual system initialization script.


    ```

    rc.modules

    ```


    Loads kernel modules. Things like your network card, PPP support, and other things
    are loaded here. If this script finds rc.netdevice, it will run that as well.


    ```

    rc.pcmcmia

    ```


    Probes for and configures any PCMCIA devices that you might have on your system.
    This is most useful for laptop users, who probably have a PCMCIA modem or network
    card.


    ```

    rc.serial

    ```


    Configures your serial ports by running the appropriate setserial commands.'
