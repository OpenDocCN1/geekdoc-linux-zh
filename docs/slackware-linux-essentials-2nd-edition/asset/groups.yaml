    ## Chapter 5 Network Configuration


    In this case, our task is merely to place the correct information between the
    double-quotes. These variables are called by /etc/rc.d/rc.inet1 at boot time to
    set up the nics. For each NIC, just enter the correct IP information, or put “YES”
    for USE_DHCP. Slackware starts the interfaces with the information placed here
    in the order they are found.


    The DEFAULT_GW variable sets up the default route for Slack. Communications between
    your computer and other computers on the Internet must pass through that gateway
    if no other route is specified for it. If you are DHCP, you will usually not need
    to enter anything, as the DHCP server will specify your gateway to use.


    ### /etc/resolv.conf


    Ok, so you''ve got an IP address, you''ve got a default gateway, you may even
    have ten million dollars (give us some), but what good is that if you can''t resolve
    names to IP addresses? No one wants to type in 72.9.234.112 into their web browser
    to reach www.slackbook.org. After all, who other than the authors would memorize
    that IP address? We need to set up DNS, but how? That''s where /etc/resolv.conf
    comes into play.


    Chances you already have the proper options in /etc/resolv.conf. If you set up
    your network connection using DHCP, the DHCP server should handle updating this
    file for you. (Technically the DHCP server just tells dhcpcd what to put, and
    it obeys.) If you need to manually update your DNS server list though, you''ll
    need to edit /etc/resolv.conf. Below is an example:


    ```

    # cat /etc/resolv.conf

    nameserver 192.168.1.254

    search lizella.net

    ```


    The first line is simple. The nameserver directive tells us what DNS servers to
    query. By necessity these are always IP addresses. You may have as many listed
    as you like. Slackware will happily check one after the other until one returns
    a match.


    The second line is a little more interesting. The search directive gives us a
    list of domain names to assume whenever DNS request is made. This allows us to
    contact a machine by only the first part of the FQN (Fully Qualified Domain Name).
    For example, if ‘slack.com’ were in your search path, you could reach http://store.slack.com
    by just pointing your web browser at http://store.


    ```

    # ping -c 1 store

    PING store.slack.com (69.50.233.153) : 56 data bytes

    64 bytes from 69.50.233.153 : icmp_seq=0 time=0.251 ms

    1 packets transmitted, 1 packets received, 0 packet loss

    round-trip min/avg/max = 0.251/0.251/0.251 ms

    ```


    ### /etc/hosts


    Now we''ve got DNS working fine, what if we want to bypass our DNS server, or
    add a DNS entry for a machine that isn''t in DNS? Slackware includes the lovely
    /etc/hosts file which contains a local list of DNS names and IP addresses they
    should match to.


    ```

    # cat /etc/hosts

    127.0.0.1 localhost localhost.localdomain

    192.168.1.101 redtail

    172.14.66.32 foobar.slack.com

    ```


    Here you can see that localhost has an IP address of 127.0.0.1 (always reserved
    for localhost), redtail can be reached at 192.168.1.101, and foobar.slack.com
    is 172.14.66.32.


    ## 5.4 PPP


    Many people still connect to the Internet through some kind of dialup connection.
    The most common method is PPP, though SLIP is still occasionally used. Setting
    up your system to speak PPP to a remote server is pretty easy. We''ve included
    a few tools to help you in setting it up.


    ### pppsetup


    Slackware includes a program called pppsetup to configure your system to use your
    dialup account. It shares a look and feel similar to our netconfig program. To
    run the program, make sure you are logged in root. Then type pppsetup to run it.
    You should see a screen like this:


    The program will present a series of questions, to which you will feed it appropriate
    answers. Things like your device, the modem initialization string, and the ISP
    phone number. Some items will have a default, which you can accept in most cases.


    After the program runs, it will create a ppp-go program and a ppp-off program.
    These are used to start and stop, respectively, the PPP connection. The two programs
    are located in /usr/sbin and need root privileges to run.


    ### /etc/ppp


    For most users, running pppsetup will be sufficient. However, there may be an
    instance where you want to tweak some of the values used by the PPP daemon. All
    of the configuration information is kept in /etc/ppp. Here is a list of the different
    files are for:


    - ip-down: This script is run by pppd after the PPP connection is ended. This
    script is run by pppd when there''s a successful ppp connection. Put any commands
    you want run after a successful connection in this file.

    - options: General configuration options for pppd.


    (Note: The provided OCR text for the later pages became corrupted/repetitive from
    page 88-90. Based on the logical flow of the manual provided, the coherent sections
    have been processed above.)

