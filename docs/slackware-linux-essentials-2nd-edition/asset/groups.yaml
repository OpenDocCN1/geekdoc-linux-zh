    # Chapter 17

    Emacs


    While *vi* (with its clones) is without a doubt the most ubiquitous editor on
    Unix-like systems, Emacs comes in a good second. Instead of using different ‘modes’,
    like vi does, it uses **Control** and **Alt** key combinations to enter commands,
    in much the same way that you can use **Control** and **Alt** key combinations
    in a word processor and indeed in many other applications to execute certain functions.
    (Though it should be noted that the commands rarely correspond; so while modern
    applications use Ctrl-C/X/V for copying, cutting and pasting, Emacs uses different
    keys and actually a somewhat different mechanism for this.)


    Also unlike *vi*, which is an (excellent) editor and nothing more, Emacs is a
    program with near endless capabilities. Emacs is (for the most part) written in
    Lisp, which is a very powerful programming language that has the peculiar property
    that every program written in it is automatically a Lisp compiler of its own.
    This means that the user can extend Emacs, and in fact write completely new programs
    ‘In Emacs’.


    As a result, Emacs is not just an editor anymore. There are many add-on packages
    for Emacs available (many come with the program’s source) that provide sorts of
    functionality. Many of these are related to text editing, which is after all Emacs’
    basic task, but it does not store that. There are for example several spreadsheet
    programs for Emacs, there are databases, games and news clients (the one being
    Gnus), etc.


    There are two main versions of Emacs: GNU Emacs (which is the version that comes
    with *Slackware*) and XEmacs. The latter is **not** a version for Emacs running
    under X. In fact, both Emacs and XEmacs run on the console as XEmacs was once
    started as a project to tidy up the Emacs code. Currently, both versions are being
    actively developed, and there is in fact much interaction between the two development
    teams. For the present chapter, it is immaterial whether you use Emacs or XEmacs,
    the differences between them are not relevant to the normal user.


    ## 17.1 Starting emacs


    Emacs can be started from the shell by simply typing emacs. When you are running
    X, Emacs will (normally) come up with its own X window, usually with a menu bar
    at the top, where you can find the most important functions. On startup, Emacs
    will first show a welcome message, and after a few seconds will drop you in the
    *scratch* buffer. (See Section 17.2.)


    ```

    File Edit Options Buffers Help

    Welcome to GNU Linux operating system.

    Get help         C-h (Hold down CTRL and press h)

    Emacs manual     C-h r

    Emacs tutorial    C-t           Undo changes C-x u

    Buy manuals      C-h C-m             Exit Emacs

    Browse manuals   C-h i               C-x C-c

    Activate menubar  F10 or ESC or M-

    (C-c) means use the CTRL key. ''M-'' means the Meta (Alt) key.

    If you have no Meta key, you may instead ESC followed by the character.

    GNU Emacs 23.0.0.2 (1686-pc-linux-gnu), X toolkit, Xaw3 scroll bars

    of 2005-03-25 on slackware

    Copyright (C) 2004 Free Software Foundation, Inc.

    ```


    Emacs comes with ABSOLUTELY NO WARRANTY: Type C-h C for full details.

    Emacs is Free Software—as in Freedom—so you can redistribute copies of Emacs and
    modify it; type C-h C-c to see the conditions.

    C-h C-d for information on getting the latest version.


    If an Emacs session crashed recently, type M-x recover-session RET to recover
    the files you were editing.


    ```

    GNU EMACS

    For information about the GNU Project and its goals, type C-h C-p.

    ```


    You can also start Emacs on an existing file by typing


    ```

    * emacs /etc/resolv.conf

    ```


    This will cause Emacs to load the specified file when it starts up, skipping the
    welcome message.


    # Command Keys


    As mentioned above, Emacs uses Control and Alt combinations for commands. The
    usual convention is C-x and M-x, respectively. C-x means Control+x, and M-x means
    Alt+x. Many commands consist of sequences of keys. For example, when you open
    a file, Emacs will ask for its name in the minibuffer.


    Switching from one buffer to another can be done with the command C-x b. This
    will prompt you for the name of a buffer (a buffer''s name is usually the name
    of the file you are editing), and it gives a default choice, which is normally
    the buffer you were in before you switched or created the current buffer. Just
    hitting Enter will switch to that default buffer.


    If you want to switch to another buffer than the default offered by Emacs, just
    type its name. Note that you can use so-called Tab-completion the first few letters
    of the buffer''s name and hit Tab then complete the name of the buffer.


    ## 17.2 Buffers


    In Emacs, the concept of ''buffers'' is essential. Every file that you open is
    loaded into its own buffer. Furthermore, Emacs has several special buffers, which
    do not contain a file but are used for other things. Such buffers usually start
    with an asterisk. For example, the buffer that Emacs shows when it first started
    is the so-called *scratch* buffer. The *scratch* buffer, you can type text in
    the normal way, but that text is not saved when Emacs is closed.


    There is one other special buffer you need to know about, and this is the minibuffer.
    This buffer consists of only one line, and is always on the screen: it is the
    very last line of the Emacs window, where commands that require some input are
    executed.


    You can get a list of buffers by hitting C-x C-b. This command will usually split
    the screen in two, displaying the buffer you were working in the top half, and
    a new buffer called *Buffer List* in the bottom half. This buffer contains a list
    of all the buffers, their sizes and modes, and the files, if any, those buffers
    are visiting (as it is called in Emacs). You can get rid of this split screen
    by typing C-x l.


    > Note: Under X, the list of buffers is also available in the Buffer menu in the
    menu bar.


    ## 17.3 Modes


    Every buffer in Emacs has an associated mode. This mode is very different from
    the idea of modes in vi: a mode tells you what kind of buffer you are in. For
    example, there is text-mode for normal text files, but there are also modes such
    as c-mode for editing C programs, sh-mode for editing shell scripts, latex-mode
    for editing LaTeX files, mail-mode for editing email and news messages, etc. A
    mode provides special customizations and functionality that is useful for the
    kind of file you are editing. It is even possible for a mode to redefine keys
    and key commands.

