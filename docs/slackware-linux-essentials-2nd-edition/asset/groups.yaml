    # 13.7 email


    Electronic mail is one of the most popular things one can do on the Internet.
    In 1998, it was reported that more electronic mail was sent than regular mail.
    It is indeed common and useful.


    Under Slackware, we provide a standard mail server, and several mail clients.
    All of the clients discussed below are text-based. A lot of Windows users may
    be against this, but you will find that a text based client is very convenient,
    especially when checking mail remotely. Fear not, there are many graphical e-mail
    clients such as KDE''s Kmail. If you wish to use one of those check its help menu.


    # pine


    pine(1) is not elm. Or so the saying goes. The University of Washington created
    their program for Internet news and email out of a need for an easy mail reader
    for their students.  pine is one of the most popular email clients in use today
    and is available for nearly every flavor of Unix and even Windows.'
