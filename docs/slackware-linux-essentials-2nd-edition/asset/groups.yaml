    it is VITALLY important to research your prospective modem purchase, particularly
    if you are considering purchasing a PCI modem. Many, if not most,


    # Chapter 5 Network Configuration


    PCI modems available on store shelves these days are WinModems. WinModems lack
    some basic hardware on the modem card itself; the functions performed by this
    hardware are typically offloaded onto the CPU by the modem driver and the Windows
    operating system. This means that they do not have the standard serial interface
    that PPPD will be expecting when you try to dial out to your Internet Service
    Provider.


    If you want to be absolutely sure that the modem you''re purchasing will work
    with Linux, purchase an external hardware modem that connects to the serial port
    on your PC. These are guaranteed to work better and be less trouble to install
    and maintain, though they require external power and tend to cost more.


    There are several web sites that provide drivers and assistance for configuring
    WinModem based devices. Some users have reported success configuring and installing
    drivers for the various winmodems, including Lucent, Conex, and Rockwell chipsets.
    The required software for these devices is not an included part of Slackware,
    and varies from driver to driver, we will not go into detail on them.


    # PCMCIA


    As part of your Slackware install, you are given the opportunity to install the
    pcmcia package (in the “A” series of packages). This package contains the applications
    and setup files required to work with PCMCIA cards under Slackware. It is important
    to note that the pcmcia package only installs the generic software required to
    work with PCMCIA cards under Slackware. It does NOT install any drivers or modules.
    The available modules and drivers will be in the /lib/modules/uname-r/pcmcia directory.
    You may need to do some experimentation to find a module that will work with your
    network card.


    You will need to edit /etc/pcmcia/network.opts (for an Ethernet card) or /etc/pcmcia/wireless.opts
    (if you have a wireless networking card). Like most Slackware configuration files,
    these two files are very well commented and it should be easy to determine which
    modifications need to be made.


