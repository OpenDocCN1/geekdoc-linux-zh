  md: '# The Signalman


    "Halloa! Below there!"


    When he heard my voice the train signalman turned his head quickly, as if startled.
    Instead of looking up to where I stood on an embankment, he looked down the train
    tracks, toward the red light near the tunnel entrance. There was something strange
    about his behavior.


    "Halloa! You, below!" I repeated. This time, raising his eyes, he saw my figure
    high above him. He stared hard at me without replying.


    "Is there any path by which I can come down and speak to you?"


    He motioned with his flag toward a point where I found a path down to the tracks.


    I had almost reached the bottom when I glanced again at the signalman. Even from
    that distance, the way he stood, and the expression of alarm on his face, seemed
    to suggest that my arrival filled him with fear.


    When I was almost close enough to reach out and touch him, he took a step backward.


    "You look at me," I said, forcing a smile, "as if you dreaded me."


    "I wasn''t sure if I had seen you before,"


    "Me? Where?" I asked, surprised.


    "There," he said, pointing at the red light that he had been staring at earlier.


    "My good fellow, I never was there, swear."


    ![](img/924655fb7a904241de0515cec7265848_11_0.png)'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'His uneasiness disappeared once we were both convinced that we had never met
    before. I must confess that I was intrigued by him.


    We began to talk. He told me that his work required a great deal of exactness
    and watchfulness, and that he spent many hours alone at his post.


    He invited me inside his hut. He was interrupted by a bell several times and had
    to read off messages and send replies. Once he had to stand outside the door and
    display a flag as a train passed. I saw that he was very exact and dutiful in
    his job. I would have thought him to be one of the most reliable of men to have
    this post, except that during our conversation broke off twice. He turned his
    face toward the bell when it did not ring, opened the door of the hut, looked
    out towards the red light near the mouth of the tunnel, and returned with the
    same frightened look on his face that he had when first met me. I was mystified
    by his strange behavior.


    > “You seem to be a man who is quite satisfied with his life,” I lied, in order
    to see if he would tell me.


    > “I believe I used to be so. But I am troubled, sir,”


    > “What is your trouble?”


    > “It is very, very difficult to speak of,” he said in a whisper. “If ever you
    make me another visit, I will try to tell you it. And if you come, don’t shout
    out, ‘Halloa! Below there!’ By the way, why did you use those words?”


    > “Heaven knows. I did yell something like that—


    > “Not like that. You used those very words. I know them well.”


    > “Then I said them, no doubt, because I saw you below,”


    > “For no other reason? You had no feeling that they were suggested to you in
    any supernatural way?”


