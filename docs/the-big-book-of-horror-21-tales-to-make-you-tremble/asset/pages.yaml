  md: '"Certainly not!"


    And with that we agreed to meet the following night.


    When I arrived, he was waiting for me. We entered the hut and sat down by the
    fire.


    Then he revealed to me his startling tale.


    "I took you for someone else yesterday evening. I''m troubled about other person."


    "Who is it? Does he look like me?"


    "I don''t know. I never saw his face. He covered it with his left hand while violently
    waving his right arm."


    He imitated the gesture that he had just described, waving his arm as if say,
    "For God''s sake, clear the way. Get away from there!"


    The signalman continued, "One moonlit night I heard a voice cry, ''Halloa! Below
    here! Look out! Look out!'' I saw that person standing by the red light near the
    tunnel, waving just as I showed you. The red light is the danger signal for this
    place. I ran towards the figure, calling, ''What''s wrong?'' He stood just outside
    the blackness of the tunnel with his sleeve away, when he disappeared. I ran right
    up to him, and was about to pull the sleeve away I rushed into the tunnel with
    my lantern until I confirmed that he really was gone. Then I ran back to my hut
    and telegraphed, ''An alarm has been given. Is anything wrong?" The answer came
    back, ''All is well."


    I interrupted his story at that point to observe that it permits it was his imagination,
    since so many hours alone may sometimes lead to hallucinations.


    "No. Within six hours after the strange appearance, a famous accident on this
    line happened, and within ten hours the dead and wounded were brought along through
    the tunnel right by the place where the figure had stood."'
