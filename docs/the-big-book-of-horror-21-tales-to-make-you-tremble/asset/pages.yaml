  md: 'I soon realized that Roderick Usher never left the house and that its dark
    atmosphere had affected his state of mind. I also realized it was impossible to
    cheer up my friend''s mood. We spent many solemn hours reading and painting. I
    listened to his confessions. In one of our conversations, Usher told me he believed
    the theory that inanimate objects experienced feelings, including the very stones
    that made up his family home.


    One evening, Usher informed me abruptly that Lady Madeline had died. He stated
    his intention of preserving the body for two weeks in one of the mansion''s vaults
    because the family burial ground was far away and unprotected, and certain medical
    men were overeager to examine Madeline''s body. I didn''t oppose this unnatural
    precaution as I felt it was harmless. We put the body in a coffin and carried
    it down to the vault. The door to the vault was made of solid iron, and we closed
    it securely on our way.


    Some days later my friend''s illness grew worse. His mind seemed to be struggling
    with some secret that he needed the courage to reveal, and he appeared to be listening
    to some imaginary sound.


    Usher''s condition terrified me. One stormy night, about a week after Lady Madeline''s
    death, a nervousness overcame me, and I could not sleep. Shaking with terror,
    I threw on my clothes. Soon afterward I heard a gentle knock on my door and Usher
    entered. "Have you not seen it? You have not seen it? Stay! You shall!" The look
    in his eyes was pure madness, and when I did not answer him he rushed to one of
