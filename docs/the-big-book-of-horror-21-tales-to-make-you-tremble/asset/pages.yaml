  md: '# Part I

    Death


    Death—and what lies after it—are the biggest human mysteries

    of all. The end of life still baffles us despite medical and scientific

    achievements over the centuries. There is no better seed for a scary

    story than how humans lose their lives, or how the dead might

    come back to the living...


    In tales of horror, violent deaths often intrude upon the daily

    lives of characters through visitations by ghosts, the living dead,

    vampires, and other creatures from beyond the grave. Some of the

    usual settings are cemeteries, morgues, and tombs.


    In this section, you will find tales of ghosts that give warnings,

    demons that bewitch the unspecting, vampires that haunt the living,

    and grisly murders with unexpected and horrifying outcomes.


    Let yourself wander through the grim labyrinths of these

    stories full of chilling suspense, intrigue, and untimely deaths.'
