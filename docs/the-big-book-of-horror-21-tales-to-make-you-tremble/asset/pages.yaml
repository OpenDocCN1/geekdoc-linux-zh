  md: '# Gustavo Adolfo Bécquer


    # The Green Eyes


    "The deer is wounded. We must cut him off! Don''t let him get to Alamos spring!
    If he reaches that water, we will lose him! cried Iñigo, the master huntsman.


    The dogs and riders raced toward the spot that Iñigo was pointing to, but it was
    useless. The wounded deer slipped through the bushes to the path that led to the
    spring.


    At that moment, the leader of the party arrived. He was Don Fernando, the eldest
    son of the Marquis of Almenar. "What is this, you superstitious fool?" he shouted
    insultingly at Iñigo. "Don''t let that deer escape! Do you think I have come out
    to hunt to let the wolves finish my work for me"


    "Sire, no one dares follow the path that leads to Alamos spring. Anyone who does
    so most certainly fall into the hands of the evil spirit that lives in its waters.
    You can''t cross the spring without bringing a horrible disaster down on your
    head. Any hunted animal that takes shelter in that mysterious spring is lost to
    us."


    "Lost! Evil spirits! The Devil take them! I''d rather lose my soul than my prize
    escape."


    And having said this, Don Fernando galloped after the deer in the direction of
    the infamous spring. Iñigo''s efforts to stop him had been useless.


    Days later, Don Fernando was sad and gloomy. Iñigo spoke to him. "Since that day
    that you rode to the spring I have noticed a great change in you. Since It seems
    as if an evil sorceress has cast a spell on you. You are depressed.


