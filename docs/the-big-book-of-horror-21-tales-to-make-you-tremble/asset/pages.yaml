    crack in the wall that made its way from the roof to the ground in a zigzag direction.
    The crack seemed to draw a gnarly grin across the mansion''s face. I followed
    the servant down dark, somber, mazelike corridors. The entire house seemed to
    be filled with an ill-smelling decay.


    The sitting room was large and high ceilinged. Dark draperies hung on the walls.
    Only uncomfortable-looking furniture of the windows were clearly visible; the
    rest were hidden in a sickness demise. I felt that I breathed the air of sorrow.
    Deep gloom hung over all.


    Roderick Usher stood as I entered. He seemed to make an enormous struggle to greet
    me with liveliness. I hardly recognized him. His lips were thin and as; his face
    ghostly pale; his hair so thin it seemed to float like cobwebs. Even his eyes
    glittered wildly.


    A strange nervousness characterized his words and gestures. He spoke of how he
    had been to see me and of the illness that was consuming him. It was a family
    evil—one for which he despised of finding a cure. He suffered from an exaggeration
    of the senses. His eyes were tortured by a faint light. He could eat only the
    mildest of foods and wear clothes of the soft texture. Almost every noise irritated
    him. It seemed to me to be bounded by madness and terror.


    “I am going to die of this. Sooner or later, life and my reason will both abandon
    me,” Usher told me, and while he spoke, a mysterious figure slowly passed by without
    noticing our presence and disappeared. I watched with surprise and dread. It was
