  md: '"Worse than that. My grandfather was butler here in time of Sir Domnick. It
    was a fine estate back then. There were wonderful parties in these halls and everyone
    was welcome."


    "How did it come to this ruin?" I asked, intrigued.


    The old man sat down next to me and eagerly began his story.


    "This was a happy place when Sir Dominick inherited it. But he quickly got into
    debt with his drinking and gambling. One night, he told me my grandfather, old
    Connor Hannon, that the last of his money was gone.


    "Then he said, Connor, I am going into the forest. They say the Devil gives you
    money at night, and the next day it turns into nothing but pebbles and nutshell.
    I am going to see if I have a bit of luck and he plays fair with me."


    "And without another word, Sir Dominick walked out into the night. He did not
    feel the cold wind, nor fear death, nor think of anything but the shame he had
    brought on his family name.


    "He went into Murroa Wood, thinking that he might hang himself from one of the
    tall oak trees if nothing else happened. He walked toward a strong, old oak tree.
    At that moment a handsome, well-dressed young horseman appeared. He greeted Sir
    Dominick."


