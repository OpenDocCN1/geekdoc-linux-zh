  md: '# The Facts in the Case of M. Valdemar


    It is no wonder that the extraordinary case of M. Valdemar has led to much public
    discussion. Until now we have kept the case secret, thus an exaggerated account
    has made its way into society. It is now necessary that I give the facts.


    I have studied hypnotism for a long time. I wished to learn about a specific aspect
    of this subject: hypnosis in a state close to death. It remained to be seen whether
    in such condition a patient could be hypnotized and whether death itself might
    be stopped by the process.


    In looking for a subject, I thought of my friend M. Ernest Valdemar. The doctors
