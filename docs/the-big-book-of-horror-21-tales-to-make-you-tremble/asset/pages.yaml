  md: '# Edgar Allan Poe


    # Morella


    I regarded Morella with affection from the day I first met her. I was very fond
    of her, but I never mistook this fondness for true love. Still, we became so close
    that we married. I never came to love her, but she was so loyal to me that I felt
    a great happiness. She attached herself to me alone.


    Morella''s intelligence was tremendous and far-reaching. I became her pupil, abandoning
    myself to her guidance. However, I was soon surprised to find that she had a maddening
    enthusiasm. She was a tireless reader of German books devoted to the study of
    spiritualism. She tormented me by reading dull, tedious passages. Yet, over time,
    I began to crave her recitations. They became our main subject of conversation.


    Morella was particularly interested in the question of whether or not the identity
    we possess through life is lost at death. Hour after hour I would linger by her
    side, listening to the music of her voice until its unearthed melody was touched
    by terror and a shadow fell upon my soul. Joy faded into horror, and beautiful
    things became hideous. I began to feel disgust for these gloomy reflections and
    for the way Morella talked to me about her books. I was bored with my wife and
    her dreary duties.


    Soon I could no longer put up with the melancholy tone of her voice and the feel
    of her pale, cold hands. I despised the lusterless look in her eyes and the way
    she was totally devoted to my studies. My grievance grew until everything about
    Morella provoked a sense of repulsion in me. I was possessed by something wicked
    and felt a mad desire for her days to be ended. I realized this and did not complain,
    yet she was human and in need of affection. Thus, she began to pine away. Her
    appearance grew more and more horrible—the pallor of her face, the darkness in
    her eyes—and my soul would sicken when I looked at her. I longed for her immediate
    death. I cursed the days that seemed to lengthen and hasten as her gentle declined
    while her fragile spirit still clung to this world.


    Finally one autumn evening, she called me to her bedside.'
