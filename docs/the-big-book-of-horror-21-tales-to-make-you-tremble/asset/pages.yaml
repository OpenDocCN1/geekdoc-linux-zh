    in their places, except one broken bottle on the floor.


    Shortly afterward, Margot and the sergeant were married. On their wedding day,
    they brought along the bottle with the green label that he had taken from the
    wine cellar. The sergeant and his wife drank from it to celebrate their wedding.
    The bottle was as green as celery, the wine was as red as blood.


    Nine months later the dressmaker gave birth to a child . . but this was no ordinary
    child. The baby’s parents were greatly distressed by the horns, not to mention
    his green color and the bump at the base of his spine that slowly took on the
    appearance of a tail. They went to doctors who told them they couldn’t cut the
    tail off without putting the child’s life in danger. They also tried all sorts
    of treatments to change the green skin color, but nothing worked.


    The sergeant and the dressmaker could not get over the sorrow their little son
    brought them. Each day he became more mischievous, stubborn, and bad tempered.
    Their disappointment drove them to drink. The sergeant only drank from bottles
    with red labels and his wife only from green.


    Every time the sergeant found himself in a drunken stupor, he dreamed of the woman
    in the pool of blood. And every time Margot indulged in too much wine, she saw
    a terrible Devil, who would whisper in her ear: “Why are you so surprised to see
    me? Didn’t you drink from the green bottle? Am I not the father of your child?


    In this way the sergeant paid for believing in God or the Devil, and the dressmaker
    for her greed.


    And what became of the monster child? When he reached the age of thirteen, he
    disappeared. And nobody ever came across him again.


