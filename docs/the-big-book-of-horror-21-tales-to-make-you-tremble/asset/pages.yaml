  md: '# Edward Lucas White


    # The House of the Nightmare


    I first caught sight of the house as the road I was driving down came out into
    open country and I left the woods behind. The sun was going down. To the right
    side of the road, I was dazzled by the white glow of a tall stone. A line of trees
    hid it from me, and when I saw the stone again I was amazed. Now it was on the
    left side of the road! I lost sight of the stone again going around a curve, and
    when the road straightened out the stone once more on on the right. I was puzzled
    and wanted to discover what was going on. I meant to stop to take a good look
    at the stone, but in my bewilderment I sped up the car and it leaped forward.
    Suddenly I lost control. I steered wildly, but everything I touched went wrong.
    My car skidded and crashed into a large tree.


    When I woke up I was lying in a ditch, looking up the last rays of sunlight. I
    sat up, and, while much shaken, I found I was not bleeding and no bones were broken.
    My car, however, was wrecked.


