  md: '# Robert Louis Stevenson


    # The Body Snatcher


    Every night at a small inn, a few friends and I would gather to have drinks. One
    night the landlord mentioned that a rich man had fallen ill at the inn and had
    sent for a famous doctor from London.


    Fettes, an old drunken Scotsman who never missed his nights together, suddenly
    became angry when he saw the doctor about to leave the inn.


    “McFarlane! Toddy McFarlane!” he shouted, giving the doctor a scornful look.


    The London man almost staggered when he saw Fettes, glanced behind him fearfully,
    and then in a startled voice exclaimed, “Fettes! You!”


    “Yes, me. Did you think I was dead, too?”


    “Hush, hush!” exclaimed the doctor. “This meeting is so unexpected.” The great
    doctor regained his calm and tried to make a few friendly remarks. Fettes interrupted
    him rudely.


    “Have you seen him again?” he demanded.


    At those words, the celebrated doctor cried out with a sharp, horrible wail and,
    and hands over his head, fled through the door like a thief.


    Following this strange, unsettling scene, all of us wanted to know what had had
    happened between the doctor and Fettes.


    It turned out that in his youth Fettes had studied medicine in Edinburgh. He had
    some talent and a famous anatomy professor, who I shall here call Mr. K, made
    him his number two assistant. Toddy McFarlane was his number one.


