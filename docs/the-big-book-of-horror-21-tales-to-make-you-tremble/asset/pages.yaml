  md: '# Eugene Field


    # The Werewolf


    In the reign of Egbert the Saxon, there lived in England a maiden named Yseult
    who was beloved by all, both for her goodness and for her beauty. She attracted
    interest from many young men, though all sought to win her hand, she loved only
    one: Harold, the grandson of Siegfried the Teuton. Another young man, Alfred,
    loved Yseult and was angry that she favored Harold.


    So one day Alfred said to Harold, "It is said that a curse fell on your grandfather.
    Is it right that Siegfried should rise from his grave and have Yseult as his wife?"Then
    he added, "Good sir, why do you turn so white when I speak your grandfather''s
    name?"


    What Alfred said disturbed Harold deeply. "Why do you taunt me with my father''s
    memory?"


    "Because there are some stories told by our ancestors that we should not forget.

    As time those words would not let Harold sleep in peace, and Alfred''s bitter
    smile haunted him. He knew very well Alfred had meant.


    Siegfried the Teuton, Harold''s grandfather, had been a cruel, bloodthirsty man.
    Legend says that a curse had fallen upon him and it had been slumbering for a
    century, but Harold knew, it was awakening in his own blood, passed down from
    grandfather to grandson.


    Of his grandfather, Harold remembered only the legend. He also had a sharp spear
    that had been left by the witch. Brunhilde, who was said to be responsible for
    the curse.


    Harold knew that the curse possessed him yet didn''t tell Yseult for fear that
    she would not love him the truth. Whenever he felt the curse burning in him he
