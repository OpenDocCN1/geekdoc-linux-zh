  md: 'One of Fettes'' duties was to receive the dead bodies that were used for dissection
    in Mr. K''s classes. Having enough corpses for the students was a constant problem.
    Every night sinister men arrived at the laboratory with fresh corpses. Mr. K had
    given Fettes instructions to pay the men right away and ask no questions.


    Fettes asked himself a lot of questions. Was it right to keep silent about this
    kind of activity? He was correct in suspecting that some of the bodies were victims
    of murder? He overcame his doubts until one night when McFarland himself knocked
    at the door, carrying a corpse who Fettes recognized as being a man called Gray.
    Just the evening before, Fettes and McFarland had been at a tavern with Gray.
    Gray had treated McFarland with great contempt and rudeness.


    After McFarland came into the laboratory with Gray''s body, he ordered, "Pay me
    and register the corpse in the book."


    "I''ve always wondered if these corpses had been murdered." Fettes replied, "and
    now I have proof."


    "Very clever, Fettes! And you will continue to be clever if you keep your mouth
    shut. Dr. K would not be very pleased if his prize students get him into trouble
    with the law. You can''t stop now; you''re involved. Besides, three days from
    now you''ll be laughing at your fears."


    McFarland departed and left Fettes alone with his regrets. If he told the truth
    now, he would get himself into trouble as accomplice in handling the corpses.
    All he had to do was stay silent. Fettes would have given the world to have been
