  md: 'An unpleasant shudder crept over me, but I tried my best to ignore it.


    “This was just a year ago. About six months later, towards the red light and saw
    the spectre again. This time he was silent. He put both hands in front of his
    face in a gesture of mourning.”


    “Did you go up to him?”


    “I came inside. I thought I was going to faint and had to sit down. I went to
    the door the ghost was gone.”


    “And nothing more?”


    “That day, when a train came out of the tunnel, I noticed that there was a lot
    of confusion in one of the cars. I signaled the driver to stop. He put his brake
    on and when the engine had stopped completely, I heard terrible screams. A beautiful
    young lady had died instantly in one of the compartments.”


    I could think of nothing to say and my mouth was very dry.


    The signalman went on, “The spectre came back just week ago, by the red light.
    One day he’s, the next day he isn’t. He calls to me, ‘Below there! Look out! He
    stands waving, makes those gestures of ‘For God’s sake, clear the way!’ and rings
    my bell.”


    I asked him about the ringing of the bell, which struck me as peculiar.


    “Yesterday, when you were here, it rang twice.”


    “Why, see how your imagination misleads you I didn’t hear the bell ring?”


    “You didn’t hear it, because when the ghost rings the bell, it makes a strange
    vibration. I don’t wonder that you failed to hear it. But I did.”


    “And when you looked out those two times, did the spectre seem to be there?”


    “He was there. Both times.”


    We went outside together. “Do you see it?”


    “No, sir. He is not there now.”


