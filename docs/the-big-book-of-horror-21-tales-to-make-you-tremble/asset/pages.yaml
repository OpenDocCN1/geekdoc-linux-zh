- img_proc: true
  md: 'peculiar scratching noise. It sounded like a very large cat clawing the wood
    floor. The scratching grew louder and seemed alarmingly close, then grew weaker
    and more distant until it finally stopped, as if the mysterious perpetrator of
    the noise had moved close to the bed and then further away.


    The strangeness of this experience left Mr. and Mrs. B bewildered, and the worry
    they felt would not let them go back to sleep until four o''clock in the morning.
    But thereafter they awoke again with another start to find someone, or something,
    had yanked the bedspread and sheets off the bed while they had slept. Mrs B lit
    a lamp, but they saw nothing unusual, except that their bedcovers had disappeared.
    Shocked, they rushed out of the room and spent the rest of the night in their
    own bedroom.


    The following morning, they went back to Mrs. Rose''s room and found the bedspread
    and sheets rolled up in a bundle on the bed. The bedspread was only tangled up
    in a ball, but the sheets were completely ripped and shredded. Mrs. B refused
    to spend another night in that haunted room. Mr. B, on the other hand, stubbornly
    insisted on spending another night there to try and solve the mystery.


    That evening, Mr. B went to asleep, leaving the lamp still lit. Just as he began
    to fall asleep, he heard the same noise as the night before. He sat up and saw
    in front of him a sorrowful, ragged old man, looking at him with an expression
    of scorn. On his head he wore a peculiar cap made of cat skin, and his fleshless,
    bony hands had extremely long, sharp nails like those of a feline. In spite of
