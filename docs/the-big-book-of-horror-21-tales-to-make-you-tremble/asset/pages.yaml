  md: 'She spoke of things beyond her years and experience. Her wisdom appalled my
    senses. How could nature have made two beings that were so alike in everything?
    How could I avoid having hideous thoughts about the wild tales of my entombed
    Morella? A worm of fear ate at my heart.


    My daughter remained nameless upon the earth until I finally decided to have her
    baptized. I took her to the church and even at the last minute I had serious doubts
    as to what name to give her. I thought of the names of the wise and the beautiful,
    names of the happy and the good. But when the priest inclined his head to hear
    the name, there was only one that came to my mind. What fiend spoke out of the
    depths of my soul in the silence of the night to prompt me to whisper the name
    Morella?


    And what then caused the features of my daughter to convulse and her skin to turn
    the color of death? It seemed impossible that the girl could have heard the name,
    but the moment I said it she turned her eyes toward heaven, fell outstretched
    on the black slabs of our ancestral vault, and responded, “I am here!”


    My fears had come true. The stars faded from heaven and the earth grew dark. I
    could hear her the tortured wind in my ear, whispering the name Morella. With
    my own hands, I carried my daughter to the tomb. When I laid the second Morella
    in the vault, I laughed a long and bitter laugh—for the remains of her mother
    were gone!'
