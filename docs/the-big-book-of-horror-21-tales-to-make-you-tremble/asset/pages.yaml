    \ events. But tomorrow I will die and today I would like to unburden my soul.\n\
    \nFrom my infancy I was known for my gentle nature and good heart. I was especially\
    \ fond of animals, and they gave me great pleasure. There is something so unselfish\
    \ and noble in the love of an animal.\n\nI married very young and was lucky to\
    \ find a wife who felt the same affection for animals as I did. We had a very\
    \ handsome dog, goldfish, birds, rabbits, a small monkey, and a cat. This cat\
    \ was large, entirely black, and extremely intelligent. My wife used to remind\
