    The day has come. I am going to die,” she said as I kissed her forehead. “I know
    that you never loved me, but though you have despised me in life, you will adore
    me in death.

    Morella!


    Yes, I repeat: I am dying. You will live the rest of your days in sorrow and fright
    because you have not known how to take advantage of the joy that was right in
    front of you. When I am dead my spirit will live on our daughter.


    And so it was. The moment Morella died, our daughter was born. The last breath
    of the mother was the daughter’s first. From the beginning the girl showed an
    incredible resemblance to her mother, and she grew strangely in size and intelligence.
    I loved her with a love more intense than I had believed it possible to feel for
    another human being.


    But this heaven of pure affection soon darkened and grief swept over me. My child’s
    eyes were the image of those eyes that I had never loved. Her smile, her high
    forehead, her pale fingers were exact copies of her dead mother. But far more
    terrible to me was that as my daughter’s mind developed, she acted more and more
    like Morella. The sad musical tones of her speech, her phrases and expressions:
    they were precisely the same as her mother’s!


    ![](img/924655fb7a904241de0515cec7265848_66_0.png)'
  - '[PAGE 67]


    ![](img/924655fb7a904241de0515cec7265848_67_0.png)'
  - '[PAGE 68]


    She spoke of things beyond her years and experience. Her wisdom appalled my senses.
    How could nature have made two beings that were so alike in everything? How could
    I avoid having hideous thoughts about the wild tales of my entombed Morella? A
    worm of fear ate at my heart.


    My daughter remained nameless upon the earth until I finally decided to have her
    baptized. I took her to the church and even at the last minute I had serious doubts
    as to what name to give her. I thought of the names of the wise and the beautiful,
    names of the happy and the good. But when the priest inclined his head to hear
    the name, there was only one that came to my mind. What fiend spoke out of the
    depths of my soul in the silence of the night to prompt me to whisper the name
    Morella?


    And what then caused the features of my daughter to convulse and her skin to turn
    the color of death? It seemed impossible that the girl could have heard the name,
    but the moment I said it she turned her eyes toward heaven, fell outstretched
    on the black slabs of our ancestral vault, and responded, “I am here!”


    My fears had come true. The stars faded from heaven and the earth grew dark. I
    could hear her the tortured wind in my ear, whispering the name Morella. With
    my own hands, I carried my daughter to the tomb. When I laid the second Morella
    in the vault, I laughed a long and bitter laugh—for the remains of her mother
    were gone!'
