    ## Gerard de Nerval


    ## The Green Monster


    Let me tell you the story of one of the oldest inhabitants in Paris. He is called
    the "Devil Vauvert." Historians say he has been living in Paris for centuries.


    He seems to have lived at first in the castle of Vauvert, which had a bad reputation
    and was partly demolished. A monastery was built in its place. A nephew of the
    pope, who had been accused of having dealings with the Devil, died there.


    Years later, rumors about this Devil again cast their shadow over the city. Every
    evening mysterious noises come from an abandoned house, built on the ruins of
    the castle and the convent. It was said that those noises were the work of the
    Devil. Frightened neighbors told the lieutenant of police, who sent men to investigate.


    As they approached the building, they were amazed to hear loud laughter and the
    clinking of glasses coming from the wine cellar. Judging from the noise, it sounded
    like a large number of people were having a party, so the police went to fetch
    reinforcements.


    Toward morning, enough police arrived to enter the house. They found nothing after
    searching all day and came back outside. But when night fell the noises started
    again, louder than ever. This nobody dared to go back inside because it was clear
    that there was nothing in the cellar bottles, and therefore it must be the Devil
    making all that noise. The police remained outside and asked the clergy to pray
    for them. The priests sent holy water to sprinkle a window in the basement. But
    the noise continued.


    After a week of looking for volunteers to make another inspection of the house,
    a sergeant, braver than the rest, agreed to go into the haunted cellar in return
    for a large sum of money. If he died in the cellar, the money would be given to
    the dressmaker he was in love with, Margot. She had always refused to marry him
    since he was only a sergeant with no fortune. But with this money, he would become
    a new man, rich enough to wed.


    Before going down into the cellar, the sergeant boldly declared that he believed
    neither in God nor the Devil. He shouted that he believed in the law alone and
    would get to the bottom of this mystery.


    He put a sword between his teeth and took a gun in each hand. When he opened the
    cellar door a most extraordinary sight met his eyes. All bottles were dancing!
    The bottles with green labels danced the gentlemen''s parts, and those with red
    labels danced the ladies'' parts. This wild party had its own orchestra. The empty
    bottles played as wind instruments; the broken bottles clashed like cymbals; and
    the cracked ones made a shrill violin section. Feeling very relieved by the sight
    of nothing but dancing bottles, the sergeant forgot his fears and joined the party.


    He chose a beautiful bottle with a red label as a partner and they danced together.
    There was loud laughter throughout the cellar. The sergeant, intrigued and distracted,
    let the bottle go and it smashed into pieces on the floor.


    At that instant the party stopped and cries of fear came from every part of the
    cellar. The sergeant was shocked as he watched the spilt wine turn into a pool
    of blood where the body of a woman took shape, her blonde hair soaked in the wet
    blood. She lay on the floor by the sergeant''s feet.


    Terrified, he grabbed a bottle with a green label, shouting. "I''ll at least get
    one of you!” The only reply was a roar of hellish laughter, which followed the
    sergeant as he ran upstairs.


