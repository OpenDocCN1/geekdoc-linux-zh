    # Guy de Maupassant


    # The Hand


    People crowded around the judge, M. Bermutier, who was giving his opinion a strange
    crime that was the talk of Paris.


    A woman cried out, "It''s supernatural! The truth will never be known."


    The judge turned to her. "True, it is likely that the actual facts will never
    be discovered, but the word ''supernatural'' has nothing to do with it. We are
    faced with a crime so well planned that the mystery surrounds it prevents us from
    figuring it out. It is not the first time this has happened. I handled a case
    just as mysterious as this one. It has still not been solved."


    "Oh! Tell us about it!" people exclaimed.


    M. Bermutier smiled. "I will tell you, but do not think that I believe anything
    in this case has to do with the supernatural. It is simply a case that has not
    been explained.


    "Here are the facts: I was once a judge in a small city in Corsica. One day I
    learned that an Englishman named John Rowell had rented a house there for a few
    years


    "As a judge, I thought best to get some information about this man, but it was
    impossible learn anything. I had to be satisfied with keeping an eye on him, but
    I could find nothing suspicious about him."


    "The rumors about him were growing, so I decided to meet this stranger. I regularly
    went hunting near his property. At last I had the luck of shooting a partridge
    right in front of the Englishman. I offered him


    ![](img/924655fb7a904241de0515cec7265848_35_0.png)'
  - '[PAGE 36]


    him the partridge, he accepted, and in return he invited me to his home.


    "As casually as possible, I asked him a few questions about his life. He told
    me of his travels in Africa, Asia, and America. He said that he had had many adventures
    and had hunted the fiercest animals, including elephants and tigers, so I asked.
    ''Are all these animals dangerous?''


    "He laughed, replying, ''Man is the most dangerous. I have hunted man.''

    Then he invited me into his parlour to see his weapons. In the midst of the conversation,
    I noticed something strange that captured my attention. Against a square of red
    velvet, a black object was displayed. I went closer and saw that it was ''a human
    hand. The skin had been removed to show the blackened flesh beneath. The overwhelmingly
    long fingers were attached by enormous tendons that still had pieces of skin clinging
    to them in places. It had yellow nails. It looked as though it had been chopped
    off with an ax. A strong chain fastened the wrist to the wall.


    "I asked Sir John Rowell about it, and he explained that it was the hand of his
    worst enemy.

    The Englishman went went on to say that the chain on the


    ![](img/924655fb7a904241de0515cec7265848_36_0.png)'
  - '[PAGE 37]


    was was to hold it in place. I thought this was a joke and said,

    ‘The chain is useless now. The hand won''t run away.’ Sir Rowell answered, ‘It
    always wants to go away. This chain is needed.’

    I didn''t know if he was insane or joking.


    We met on a number of other occasions, and noticed that he kept loaded revolvers
    in his parlor,nasas though in fear of some attack. Then I stopped

    visiting him. There were no more rumors;

    people had lost interest in him.


    “A year went by and one morning my servant awakened me with the news that Sir
    Rowell had been murdered during the night.

    I went to his house right away. The Englishman had been strangled in the parlor.
    His face still wore an expression of horror, and his shirt was ripped. He held
    something between

    theeth, and his neck was pierced by five holes, which were covered in blood.


    “The doctor examined the marks on the neck for a long time.He seems to have been
    strangled by a skeleton,’ the doctor announced.


    “This information chilled me, and I immediately glanced up at the wall, looking
    for the terrible hand. It was not there.

    The chain was hanging down, broken.


    ![](img/924655fb7a904241de0515cec7265848_37_0.png)'
- md: '

    “Then I went back to the body and in the mouth I found a finger, half rotten,
    covered with dried blood. The Englishman had torn off the index finger of the
    murdering hand with his teeth.


    “The servant’s testimony was this: For several months Sir Rowell was very anxious.
    He had received many letters, which he would burn. He went to bed very late and
    locked himself in. He always kept weapons within reach. Often at night he would
    talk loudly as if he were arguing with someone. At times I found him angrily whipping
    the hand that was on the wall in the parlor, which disappeared at the very hour
    of the crime:


    “About three months after Sir Rowell’s murder, I had a nightmare. I seemed to
    see the horrible hand running over my walls like a spider. The next day the police
    brought me the blackened hand, which they had found on top of Sir Rowell’s grave.
    The index finger was missing.


    “And that is the story, ladies and gentlemen. I believe that the owner of the
    hand was not dead. He came to get it with his other one. I just don’t know how.”


    One woman murmured, “No it it can’t be that.”


    The judge, still smiling, simply answered, “I told you my explanation would not
    satisfy you.”


