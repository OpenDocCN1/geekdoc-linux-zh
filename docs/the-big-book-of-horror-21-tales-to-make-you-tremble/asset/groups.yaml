    Gentlemen, I am delighted to have relieved you of your suspicions. My tormentors''
    disappearance gave me a feeling of peace that I had not experienced for many years.
    At that moment I regained my cheerfulness, slept soundly, and began to enjoy being
    in my own home. I breathed as a free man and believed my future joy was secure.


    Four days later the police began to investigate my wife’s disappearance. They
    searched my house completely, going down into the cellar three or four times.
    I felt no fear. My heart beat calmly as if I was wholly innocent. The police were
    satisfied and began to leave, but the happiness in my heart was too strong to
    be restrained. Before the police departed, I could not help but offer them a parting
    speech.


    "I wish you all health to have relieved you. By the way, this is a very well-made
    house. These cellar walls are solidly built."


    Out of pure vanity I began to rap on the wall with my cane precisely at the place
    where my wife was hidden, to show them how strong the walls were. When the cane
    hit the wall, it was answered by a voice within the tomb! At first it sounded
    like the sobbing of a child, but it soon grew stronger, until it turned into a
    terrifying, inhuman howl, a wail of horror and triumph. I staggered to the opposite
    wall, almost fainting. Fear rendered me helpless.


    For one moment the police remained motionless in terror and awe. But then they
    began to find out what was behind the wall. They scraped off the plaster, removed
    the bricks, and there appeared the lifeless corpse of my unfortunate wife. To
    everyone’s surprise we saw, sitting on the top of her head, the cat—alive. Its
    mouth was open, fiercely showing its teeth, and its single eye seemed to spit
    fire. Here was the beast that had brought me to commit murder and whose voice
    had given me away, sending me to the hangman’s noose. Without realizing it, I
    had walled up the black cat inside the tomb!


