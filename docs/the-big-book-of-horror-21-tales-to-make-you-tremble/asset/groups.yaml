    ## Part II

    Disease and Madness


    Disease and madness are another source of mystery and have an inspiring terror;
    in fact, a number of Lovecraft horror writers however have been afflicted with
    illnesses of the mind and body that led them to write about these subjects.


    In the sequel, you will find exciting accounts of the terrifying psychological
    effects of early treatments, unexplained diseases, and demeaning horrors.


    You will also find stories concerning very real and terrible events that occurred
    during the Spanish Inquisition, a bloody era beginning the fifteenth century when
    the monarchy and the church of Spain persecuted all they claimed guilty of crimes
    against The Faith; punishments ranged from public shame to burning at the stake.
    The Spanish tribunals tortured many who dared to re-live in haunting and unimaginable
    tales.


    You might want to leave the light on after you read these series of madness, disease,
    hallucinations, and the cruel harrow of torture.


    ## Edgar Allan Poe


    ### The Fall of the House of Usher


    I had spent the whole day traveling by horseback under heavy, dark clouds when
    I finally came upon the melancholy House of Usher and the dreary land surrounding
    it.


    I felt a sense of gloom at first glance. I looked upon the bleak walls of the
    house and the empty windows and felt a sinking of the heart. I was plunged into
    despair. I found myself at the brink of a lurid pond. In its black waters I gazed
    on the upside-down reflection of that somber mansion with its ghastly-like windows
    and shuddered.


    Nevertheless, it was my plan to spend time in that house. The letter I had received
    from Roderick Usher, a close childhood friend, had touched me. He wrote that he
    was suffering from a terrible illness—and begged me to visit him as the cheerfulness
    of my company would help relieve his sickness.


    The ancient Usher family was known for their extraordinary sensitivity, which
    had given the family a number of fine artists. In addition, the house had always
    been passed down from father to son, thus giving the estate name House of Usher—for
    the family and the house were like one being.


    ![](img/924655fb7a904241de0515cec7265848_41_0.png)


    I rode my horse to the door and a servant received me. I noticed a barely visible
    crack in the wall that made its way from the roof to the ground in a zigzag direction.
    The crack seemed to draw a gnarly grin across the mansion''s face. I followed
    the servant down dark, somber, mazelike corridors. The entire house seemed to
    be filled with an ill-smelling decay.


    The sitting room was large and high ceilinged. Dark draperies hung on the walls.
    Only uncomfortable-looking furniture of the windows were clearly visible; the
    rest were hidden in a sickness demise. I felt that I breathed the air of sorrow.
    Deep gloom hung over all.


    Roderick Usher stood as I entered. He seemed to make an enormous struggle to greet
    me with liveliness. I hardly recognized him. His lips were thin and as; his face
    ghostly pale; his hair so thin it seemed to float like cobwebs. Even his eyes
    glittered wildly.


    A strange nervousness characterized his words and gestures. He spoke of how he
    had been to see me and of the illness that was consuming him. It was a family
    evil—one for which he despised of finding a cure. He suffered from an exaggeration
    of the senses. His eyes were tortured by a faint light. He could eat only the
    mildest of foods and wear clothes of the soft texture. Almost every noise irritated
    him. It seemed to me to be bounded by madness and terror.


    “I am going to die of this. Sooner or later, life and my reason will both abandon
    me,” Usher told me, and while he spoke, a mysterious figure slowly passed by without
    noticing our presence and disappeared. I watched with surprise and dread. It was
    Usher’s sister, Lady Madeline, the only relative he had left, who was now close
    to death. Her disease had long puzzled the doctors, and she was gradually wasting
    away. It was this great sorrow that had caused the beginning of Usher’s illness


    I soon realized that Roderick Usher never left the house and that its dark atmosphere
    had affected his state of mind. I also realized it was impossible to cheer up
    my friend''s mood. We spent many solemn hours reading and painting. I listened
    to his confessions. In one of our conversations, Usher told me he believed the
    theory that inanimate objects experienced feelings, including the very stones
    that made up his family home.


    One evening, Usher informed me abruptly that Lady Madeline had died. He stated
    his intention of preserving the body for two weeks in one of the mansion''s vaults
    because the family burial ground was far away and unprotected, and certain medical
    men were overeager to examine Madeline''s body. I didn''t oppose this unnatural
    precaution as I felt it was harmless. We put the body in a coffin and carried
    it down to the vault. The door to the vault was made of solid iron, and we closed
    it securely on our way.


    Some days later my friend''s illness grew worse. His mind seemed to be struggling
    with some secret that he needed the courage to reveal, and he appeared to be listening
    to some imaginary sound. One stormy night, about a week after Madeline''s death,
    a nervousness overcame me, and I could not sleep. Shaking with terror, I threw
    on my clothes. Soon afterward I heard a gentle knock on my door and Usher entered.
    "Have you not seen it? You have not seen it? Stay! You shall!" The look in his
    eyes was pure madness, and when I did not answer him he rushed to one of the windows
    and threw it to the storm. A furious gust of wind swept through the room, nearly
    lifting us off our feet. We had no glimpse of the moon or stars, yet the glow
    of an unnatural light surrounded the house.


    "Close the window," I shouted, leading Usher from the room to a seat. "The air
    is not good for your condition. This is a terrible storm. Here is one of your
    favorite romances."


    "Ethelred lifted up his mace and cracked, ripped, and tore the door open." I started
    for I thought I heard, from some far away part of the mansion, an echo of the
    very cracking sound described in the story. It must have been the sounds of the
    storm outside, I continued. "The good Ethelred brought down his mace on the dragon,
    which fell before him with a shriek so piercing that Ethelred had put his hands
    over his ears." Here I stopped abruptly for there could be no doubt that I heard
    a low but horrible sound, which seemed to come from some distant part of the house
    and was far too similar to how I had imagined the shrieking of the dragon.


