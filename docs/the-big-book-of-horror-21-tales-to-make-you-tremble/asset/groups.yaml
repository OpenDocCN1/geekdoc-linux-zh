    would get to the bottom of this mystery.


    He put a sword between his teeth and took a gun in each hand. When he opened the
    cellar door a most extraordinary sight met his eyes. All bottles were dancing!
    The bottles with green labels danced the gentlemen''s parts, and those with red
    labels danced the ladies'' parts. This wild party had its own orchestra. The empty
    bottles played as wind instruments; the broken bottles clashed like cymbals; and
    the cracked ones made a shrill violin section. Feeling very relieved by the sight
    of nothing but dancing bottles, the sergeant forgot his fears and joined the party.


    He chose a beautiful bottle with a red label as a partner and they danced together.
    There was loud laughter throughout the cellar. The sergeant, intrigued and distracted,
    let the bottle go and it smashed into pieces on the floor.


    At that instant the party stopped and cries of fear came from every part of the
    cellar. The sergeant was shocked as he watched the spilt wine turn into a pool
    of blood where the body of a woman took shape, her blonde hair soaked in the wet
    blood. She lay on the floor by the sergeant''s feet.


    Terrified, he grabbed a bottle with a green label, shouting.

    I''ll at least get one of you!” The only reply was a roar of hellish laughter,
