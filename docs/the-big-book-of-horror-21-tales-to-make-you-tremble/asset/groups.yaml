    # Edgar Allan Poe


    # # The Pit and the Pendulum


    I was sick in agony when they untied me, and I was allowed to sit before the court
    of black-robed judges of the Inquisition. Their grotesque lips appeared thin and
    white as paper. I felt my senses were leaving me. The dread sentence of death
    handed down by the judges was the last thing I heard before silence and stillness
    swallowed me. I blacked out.


    My first sensation after that was of my heart beating loudly. Then came a shuddering
    terror and a full memory of the trial, the judges, and the sentence. I was lying
    on my back, unbound. I reached out my hand and touched something damp and hard.
    I tried to imagine what it could be. Finally, I opened my eyes and my worst fears
    were confirmed. The blackness of endless night surrounded me. Yet not for a moment
    I think myself actually dead. I wished to know where I was. Was it a dungeon?
    I thrust my arms wildly around. I felt nothing. I had been left to die of starvation
    in this world of darkness?


    My outstretched at last found a stone wall, which was smooth, cold, and slimy.
    I groped my way around my prison in order to determine its shape, out of a slight
    curiosity, but without hope, the Inquisition had already decided my fate. I found
    that the cell was not circular but rather had many different angles. It seemed
    to be quite large, and the floor was moist and slippery. I stepped on a torn piece
    of my robe and fell violently. My chin rested on the floor of the prison, but
    the rest of my face touched nothing. I reached out my arm and shuddered to find
    that I had fallen at the edge of a circular pit. A peculiar smell of decay came
    from it.


    ![](img/924655fb7a904241de0515cec7265848_55_0.png)'
  - '[PAGE 56]


    I had no idea how deep the pit was, so I managed to remove a small piece of stone
    from the floor and let it fall into the abyss. For many seconds I heard it dash
    against the sides of the pit until length there was a splash of water and loud
    echoes.


    I was horrified to think of that pit as the instrument of my doom.


    Shaking all over, I groped my way back to the wall. Fear kept me awake for many
    long hours. Then a deep sleep fell upon me, a sleep like death itself.


    When once again I opened my eyes, the objects around me were visible due to a
    faint light. I saw that my prison was smaller than I thought and square in shape.
    The walls were metallic, and in the center of the stone floor yawned the circular
    pit from whose jaws I had so narrowly escaped.


    It took great effort to see all this for now lay on my back, bound by a long strap
    to a wood frame. The strap wound around me, leaving only my head free.


    Looking up, I saw that a huge piece of metal shaped like a pendulum hung from
    the ceiling. It was moving—sweeping slowly from side to side. I watched it for
    some minutes, somewhat in fear but more in wonder, until I


    ![](img/924655fb7a904241de0515cec7265848_56_0.png)'
  - '[PAGE 57]


    realized with horror that the sweep of the pendulum was increasing, and worse
    still, it was getting lower and lower! I now observed that it formed a crescent
    of glittering steel, sharp as a razor, and that it hissed as it swung through
    the air, its steel blade pointed toward me.


    As long hours of horror passed, the pendulum continued to creep steadily down.
    All I could do was wait. Inch by inch, the huge blade came closer. I could hear
    its terrible hissing. Down and still it came. I shrank at every sweep. I saw that
    it was aimed to pierce my heart. I prayed. Growing frantic at the pendulum''s
    slow pace, I prayed for a speedier descent.


    At the same time, troops of rats began climbing out of the pit and swarmed the
    wood frame I lay on. In their greedy hunger, the rats bit my fingers and the strap
    that bound me. The repulsive vermin gave me faint hope. They leaped on me by hundreds
    and gnawed the strap all over. They pressed at my throat, and their cold lips
    sought my own. I felt like I was suffocating. Despite my horrific disgust, I lay
    still until I felt the loosening of my bonds. The rats had bitten through the
    strap. The pendulum swung again, pressing on my chest and cutting through the
    robe I wore. Quickly, I rolled over and managed to fall onto the floor out of
    the reach of the deadly blade. I was free!


    Free, and still in the grasp of the Inquisition. At a wave of my hand, the rats
    scurried away, back into the pit. The motion of the pendulum stopped, and it was
    drawn back into the ceiling. I was being watched. Free—hah! I had barely escaped
    death in one form of agony; when I observed that something strange was happening
    to the walls of the cell. They were moving!


    The square cell was no longer square. The walls glowed red-hot, like heated iron,
    and slowly changed the prison into a diamond shape that was getting narrower and
    narrower. Terrified, I attempted to hold the walls back. I smelled my flesh burn
    and shrieked in pain.'
