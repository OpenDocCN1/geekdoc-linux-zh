    # Guy de Maupassant


    # # He?


    My dear friend, it is not easy for you to understand, is it? You must believe
    I have gone mad. Perhaps I have, but not for the reasons that you think.


    Yes, I am getting married. I know that you would never have thought me capable
    of such a thing since I like my freedom too much. No, I am getting married because
    I am afraid of being alone.


    I do not want to spend one more night on my own. I want to feel that there is
    someone close by, a being who can speak to me. Someone who possesses reason. The
    state of my mind is so wretched that you will pity me. Solitude now fills me with
    a terrible anxiety.


    You still do not understand, do you? I must tell you more. I am not afraid of
    danger—if a thief were to break into my house I should confront him without fear.
    I am not afraid of ghosts. I don''t believe in the supernatural. What frightens
    me . . . is myself! My own fearful mind!


    For some time I have been terrified by thinking this panic I feel may last forever.
    I feel a genuine terror of everything around me—the walls, the furniture, familiar
    objects. Above all, I am afraid of my own horrible thoughts and the loss of my
    reason. If I say something, I fear my own voice. If I walk somewhere, I fear what
    might be lurking behind the door, in the cabinet, under the bed. So I just shut
    myself up in my own room, get into bed, and tremble under the sheets.


    The fear which I now live with began last year, on a damp autumn evening. I had
    just dined, and my servant had left the room. I felt tired without any reason
    for it. I walked


    ![](img/924655fb7a904241de0515cec7265848_51_0.png)'
- md: '

    up and down, unable to work, unable to read. I was unhappy and despairing. My
    house seemed more silent than it had ever been before. I was weighed down by loneliness.
    A growing restlessness made me move from one place to another with no purpose.
    I was feverish and then suddenly a cold shiver ran down my back. I lit the fire
    and watched the flames. But soon I felt that I could not possibly remain in the
    house so I rushed out.


    I thought of visiting some friends to calm myself. I went to three houses but
    had the bad luck to find no one at home. Finally, I took a walk, hoping I would
    run into someone I knew. For a long time I wandered about with no destination
    in mind, until late that night I decided to go home.


    When I returned, I found the door closed but not locked. In the darkened sitting
    room the fire was still going. I then noticed somebody sitting in my armchair
    by the fire, warming his feet. He wasn''t facing me so I could only see the back
    of his head. I wasn''t frightened, however, because I thought it was some friend
    who had arrived while I was out, and that the porter had given him the key so
    he could wait for me inside. He seemed to be asleep, and I went over to wake him
    up. His right arm was hanging down, his feet were crossed, and his head was tilted.
    I wondered what it could be and reached out to touch his arm. But my hand touched
    only the armchair. There was nobody there—he had disappeared!


    I shrank back from the chair, feeling some horrible peril had come my way. Then
    I turned around, sensing there was somebody behind me. No one was there. I turned
    back to the armchair. Again, there was no one there.

    I felt extremely confused, so upset that I was ready to collapse.


    I decided to stop this madness and forced myself to calm down. No doubt it had
    been a momentary hallucination, nothing more. My eyes had been deceived. It was
    an optical illusion and that was all.


    I walked up and down, hummed a little tune, and went to bed. I felt peaceful until
    an overpowering urge forced me to get up and look around the room. I imagined
    I saw the man sitting in the armchair but when I lit a candle, there was no one
    there. I hid the chair behind my bed.


    I finally fell asleep. My dreams brought back to me the image of that man seated
    in the armchair. I woke up with a start and lit the candle again, not wanting
    to fall back asleep. Twice, however, sleep overcame me, and each time the dream
    was repeated—it all seemed so real. At dawn I was finally able to relax escape
    my torment for a little while. I slept until noon.


    The next day I was convinced that it had been feverish. I had been ill. I had
    a nightmare and a big fool. I spent the evening away from home and enjoyed myself
    tremendously. I dined in a fine restaurant and went to the theater. But when the
    time came to go back home, I was overcome by uneasiness. I was afraid of seeing
    some new hallucination. For more than an hour I wandered the streets, but I did
    not wish to act again like an idiot and returned home.


    I stood outside my door for a good while before putting the key in the lock. I
    kicked open the door and looked fearfully toward the place where the armchair
    had been. What a relief—there was no one there! And yet I turning around, and
    the shadows disturbed me. Since then every night is a torture for me. He haunts
    me, appearing in my dreams. Who or what is he? I try to reason with myself. I
    know he will not show himself again. But he remains in my thoughts, pressing against
    my nerves, eating at my heart.


    I know the answer is that I must abandon my solitude. If there were two of us
    here, I feel certain that he would go away forever. He is here simply because
    I am alone. And that, my friend, is why I am getting married.


