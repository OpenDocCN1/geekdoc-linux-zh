    \n我拼命地试图唤醒病人，看起来快成功了。房间里的每个人都准备好看到病人醒来。但没有人能对实际发生的事情做好准备。\n\n当我正用尽所能复活瓦尔德马时，“死人了！死人了！死人了！”的尖叫从他的舌头迸发而出，他的身体突然在我的手中崩塌并腐烂了。可怜的瓦尔德马先生只剩了一滩恶臭、令人呕的液体。\n\
