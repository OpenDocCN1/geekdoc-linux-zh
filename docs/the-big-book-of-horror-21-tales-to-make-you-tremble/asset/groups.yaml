    The day has come. I am going to die,” she said as I kissed her forehead. “I know
    that you never loved me, but though you have despised me in life, you will adore
    me in death.

    Morella!


    Yes, I repeat: I am dying. You will live the rest of your days in sorrow and fright
    because you have not known how to take advantage of the joy that was right in
    front of you. When I am dead my spirit will live on our daughter.


    And so it was. The moment Morella died, our daughter was born. The last breath
    of the mother was the daughter’s first. From the beginning the girl showed an
    incredible resemblance to her mother, and she grew strangely in size and intelligence.
    I loved her with a love more intense than I had believed it possible to feel for
    another human being.


    But this heaven of pure affection soon darkened and grief swept over me. My child’s
    eyes were the image of those eyes that I had never loved. Her smile, her high
    forehead, her pale fingers were exact copies of her dead mother. But far more
    terrible to me was that as my daughter’s mind developed, she acted more and more
    like Morella. The sad musical tones of her speech, her phrases and expressions:
    they were precisely the same as her mother’s!


    ![](img/924655fb7a904241de0515cec7265848_66_0.png)


    ![](img/924655fb7a904241de0515cec7265848_67_0.png)


    She spoke of things beyond her years and experience. Her wisdom appalled my senses.
    How could nature have made two beings that were so alike in everything? How could
    I avoid having hideous thoughts about the wild tales of my entombed Morella? A
    worm of fear ate at my heart.


    My daughter remained nameless upon the earth until I finally decided to have her
    baptized. I took her to the church and even at the last minute I had serious doubts
    as to what name to give her. I thought of the names of the wise and the beautiful,
    names of the happy and the good. But when the priest inclined his head to hear
    the name, there was only one that came to my mind. What fiend spoke out of the
    depths of my soul in the silence of the night to prompt me to whisper the name
    Morella?


    And what then caused the features of my daughter to convulse and her skin to turn
    the color of death? It seemed impossible that the girl could have heard the name,
    but the moment I said it she turned her eyes toward heaven, fell outstretched
    on the black slabs of our ancestral vault, and responded, “I am here!”


    My fears had come true. The stars faded from heaven and the earth grew dark. I
    could hear her the tortured wind in my ear, whispering the name Morella. With
    my own hands, I carried my daughter to the tomb. When I laid the second Morella
    in the vault, I laughed a long and bitter laugh—for the remains of her mother
    were gone!


    # Edward Lucas White


    # The House of the Nightmare


    I first caught sight of the house as the road I was driving down came out into
    open country and I left the woods behind. The sun was going down. To the right
    side of the road, I was dazzled by the white glow of a tall stone. A line of trees
    hid it from me, and when I saw the stone again I was amazed. Now it was on the
    left side of the road! I lost sight of the stone again going around a curve, and
    when the road straightened out the stone once more on the right. I was puzzled
    and wanted to discover what was going on. I meant to stop to take a good look
    at the stone, but in my bewilderment I sped up the car and it leaped forward.
    Suddenly I lost control. I steered wildly, but everything I touched went wrong.
    My car skidded and crashed into a large tree.


    When I woke up I was lying in a ditch, looking up the last rays of sunlight. I
    sat up, and, while much shaken, I found I was not bleeding and no bones were broken.
    My car, however, was wrecked.


    ![](img/924655fb7a904241de0515cec7265848_69_0.png)


    I got to my feet and examined my car. Everything was ruined except for my baggage.
    As I was looking over my things, I noticed a boy standing near the ditch and staring
    at me. He was stocky, barefoot, and wore pants rolled up to his knees. I noticed
    he had a split upper lip, a harelip. He said nothing, so I addressed him.


    “Where is the nearest garage?”


    “Eight miles away,” he answered.


    I asked if he could take me to get the damage repaired, but he told me that there
    were no horses or any means of transportation at the house. He also told me that
    the next house was six miles away. It would be completely dark before I got there.


    “May I sleep in your house tonight?”


    “You come in if you want to,” he said, “and sleep if you can. House is all messy.
    Ma’s been dead three year now, and Dad’s away. Nothin’ to eat but flour and moldy
    bacon.”


    “Well, I have some food,” I answered, picking up one of my suitcases and asking
    him to carry the other.


    “You can come in if you’re a mind to,” he said, “but you got to carry your own
    stuff.” He did not say this rudely, but simply stated it mildly, as we walked
    to the house. The house was low and overgrown, and the windows were like blind
    eyes. We entered the house, and it was dark and smelled of dust. The boy lit a
    candle and showed me to a room.


    “Where shall I sleep?” I asked.


    “In there,” he said, pointing to a bed.


    I lay on the bed, but I could not sleep. The house was full of noises, and I heard
    the wind blowing through the trees. I heard the floor creaking under my feet,
    and I heard the rats in the walls. I was afraid of the dark.


    The next morning, I woke up and found the sun shining. The boy was waiting for
    me. We ate some breakfast of bread and cheese, and then we talked for a while.
    He told me about his father, who was away working in the mines. He told me about
    his mother, who had died years ago. He told me that he lived alone in the house.


    “Why is your father so away?” I asked.


    “He hasn''t come back,” he replied.


    “What happened to your mother?” I asked.


    “She died three years ago,” he said.


    “Death of what?” I asked.


    “She was sick,” he said.


    I felt a pity for the boy. He was so lonely and alone. I decided to stay with
    him as long as I could. I helped him fix the car, and we worked together every
    day.


    One day, we finally fixed the car. I was ready to leave. “Thank you for everything,”
    I said.


    “You welcome,” he said.


    I got into the car and drove away. I looked back at the house, but it was already
    gone. I wondered if I would ever see him again, but I knew that I would not. The
    house was a place of mystery, and the boy was a strange child. I would never forget
    him.

