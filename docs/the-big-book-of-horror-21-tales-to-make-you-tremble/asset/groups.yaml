    It was she who first noticed that the white spot the cat had on its chest had
    changed. The white hair had turned into a shape that was distinct and recognizable—and
    for this time, above all, that I loathed and dreaded the monstrous cat—for its
    white hair formed the shape of a noose!


    I was wretched. I knew no rest by day or night. The monster would not leave me
    alone. One afternoon my wife and I went down to the cellar. The cat followed me
    down the steep stairs and almost tripped me. That angered me so much that I seized
    an ax, aiming a blow at the animal that would have been fatal. The blow was stopped
    when my wife grabbed my arm and held it with all her strength. This infuriated
    me when even more. I seemed to go mad, and in a rage, I struck my wife in the
    head with the ax.


    When I realized that I had killed her, I decided, quickly and coldly, that I had
    to hide her body. An idea occurred to me that I thought was quite brilliant: I
    would conceal the body behind a wall in the cellar. The walls of the cellar were
    loosely constructed and the plaster was soft from the damp. In one of the walls
    I found a bulge where an old fireplace had filled up to look like the rest of
    the cellar.


    I scraped off the plaster and removed the bricks. Then I propped the body of my
    wife in the fireplace, covered the hole again with bricks, and plastered it over.
    When the work was finished, I looked all over the house for the cat that had caused
    me so much wretchedness, determined to put it to death. But the cat was nowhere
    to be found—it fled the house forever! I would never look on that animal again!'
