    # Sheridan Le Fanu

    Sir Dominick’s Bargain


    I was called to the south of Ireland on business, and since I had never been there
    before, I wanted to explore the region. On my first journey, I caught a glimpse
    of a great old house that had fallen into ruin. Drawn by curiosity, I went through
    the gate and, as the door opened, I wandered through the rooms with their rotting
    ceilings and imagined the mansion full of happy people. I sat down on a great
    stairway of oak. The silence was total until suddenly I heard the unpleasant words,
    "Food for worms, dead and rotten." Looking up,


    I saw a sharp-faced, little old man sneering down at me from a window seat, feet
    dangling.


    He jumped down. "This was once a great house, sir. Did you know that?"


    "No."


    "Yes, it was. You are in the Dunoran house, owned by the Sarsfield family. Sir
    Dominick Sarsfield was the last to live here. Do you see that mark, sir?" he asked,
    pointing to a stain on the wall. "That’s a splash of blood. It’s been there for
    a hundred years."


    "Sir Dominick was murdered, then?"


    "Worse than that, sir.\"


    "He killed himself?"


    ![](img/924655fb7a904241de0515cec7265848_85_0.png)'
  - '[PAGE 86]


    "Worse than that. My grandfather was butler here in time of Sir Domnick. It was
    a fine estate back then. There were wonderful parties in these halls and everyone
    was welcome."


    "How did it come to this ruin?" I asked, intrigued.


    The old man sat down next to me and eagerly began his story.


    "This was a happy place when Sir Dominick inherited it. But he quickly got into
    debt with his drinking and gambling. One night, he told me my grandfather, old
    Connor Hannon, that the last of his money was gone.


    "Then he said, Connor, I am going into the forest. They say the Devil gives you
    money at night, and the next day it turns into nothing but pebbles and nutshell.
    I am going to see if I have a bit of luck and he plays fair with me."


    "And without another word, Sir Dominick walked out into the night. He did not
    feel the cold wind, nor fear death, nor think of anything but the shame he had
    brought on his family name.


    "He went into Murroa Wood, thinking that he might hang himself from one of the
    tall oak trees if nothing else happened. He walked toward a strong, old oak tree.
    At that moment a handsome, well-dressed young horseman appeared. He greeted Sir
    Dominick."


    ![](img/924655fb7a904241de0515cec7265848_86_0.png)'
  - '[PAGE 87]


    "''Sir,'' the stranger said, ''I am recruiting for my master. You will find that
    my money will not turn into pebbles.'' And he showed him a big bag full of gold.


    "I''m willing to make a bargain. I will serve you for seven years and then you
    will serve me. Today is the last day of the month of February. When the seven
    years have passed, I will come to get you at the very moment when February changes
    to March.


    "Sir Dominick said he would think about it. When he arrived home, his grandfather
    received him with great joy and together they counted the money. There was more
    than his luck, which had dreamed of. But as the days passed Sir Dominick saw his
    luck, which had gotten better, turn bad once more. A man from Dublin came to claim
    new debts, and another denied that he had received payment of a big bill. Unable
    to find a way out of this trouble, Sir Dominick decided to seek out the mysterious
    nobleman.


    "That night my grandfather kept Sir Dominick''s crucifix for him. He did not want
    to receive money from the Evil One while wearing it. White as a sheet of paper,
    he went out


    ![](img/924655fb7a904241de0515cec7265848_87_0.png)'
  - '[PAGE 88]


    into the woods. He thought about turning back, confessing his deeds to the clergy,
    and trying to lead a good life, but then he saw the horseman step out from behind
    the oak.


    "I see that you liked the money, but that it wasn''t enough,"the man said."From
    now on you have only to approach this tree and I will come to you. Fortune will
    be your friend and your debts will be over."


    "Sir Dominic could barely utter a word in his terror but managed to voice his
    agreement. The Evil One took out a needle and bid Sir Dominic to take three drops
    of blood from his arm. With that blood he made Sir Dominic write words he didn''t
    understand on two sheets of paper. The Devil kept one paper and the other he sunk
    into Sir Dominic''s arm at the very place where his blood had been drawn. The
    Devil then made Sir Dominic''s flesh close over and his bargain was sealed.


    "Very quickly Sir Dominic''s luck began to change. He got out of debt and poured
    in, making him richer and richer. He bet on the right horse every time and won
    every card game. Good times returned to the Dunoran house, and his halls were
    again crowded with guests.


    "But something continued to worry my grandfather''s master. One night he returned
    to the woods. The Devil was waiting for him, and he was now dressed in rags. He
    was twice as big as he had been before and looked absolutely horrifying. No one
    knows what happened at that meeting, but from that day Sir Dominic was not the
    same man. He wouldn''t laugh or even speak. At last he lost heart altogether and
    sent for the bishop.


    "The bishop advised Sir Dominic to repent his sins, abandon his bad habits, and
    be a good man until the seven years had passed. And that was what he did.


    "Time went by and the fateful day arrived. The bishop and Sir Dominic shut themselves
    in his room and


