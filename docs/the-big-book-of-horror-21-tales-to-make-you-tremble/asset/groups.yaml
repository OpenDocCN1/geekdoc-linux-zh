    ## 热尔曼·德·内瓦尔


    ## 绿色怪物


    让我给你们讲一个巴黎最古老居民的故事。他被称为“沃韦尔特魔鬼”。历史学家说，他已经在巴黎生活了几个世纪。


    他起初住在沃韦尔特城堡里，那座城堡名声不好，后来被部分拆除。后来那里建立了一座修道院。一位被指控与魔鬼有往来的教皇侄在那里去世。


    多年后，关于这个魔鬼的传闻再次笼罩了这座城市。每天晚上，一座建在城堡和修道院废墟上的废弃房子里传出神秘的声音。据说那些声音是魔鬼的作的。恐惧的邻居告诉了警察副长，他派人去调查。


    当他们靠近建筑时，惊讶地听到酒窖里传出响亮的笑声和碰杯杯声。从声音判断，似乎有很多人正在聚会，于是警察去请援兵。


    临晨时，足够足够的警察进入了房子。他们搜寻了一天后一无所获，回到了外面。但当夜幕降临，声音再次响起，比以往任何时候都要响。没有人敢再回进去，因为显然酒窖里的瓶子是空的，因此一定是魔鬼在制造那些噪音。警察留在外面，请求神职人员为他们祈祷。神父送来圣水洒在地下室的一扇窗户上。但噪音持续。


    在寻找志愿者进行下一次检查一周后，一个比其他人更勇敢的军士同意为了一笔巨款进入那间闹鬼的酒窖。如果他死在酒窖里，这笔钱将给给他心爱的缝纫师玛戈特。她一直拒绝嫁给他，因为他只是一个没有财产的军士。但有了这笔钱，他将变成一个全新的自己，富有到足以结婚。


    在下到酒窖之前，军士大胆地宣布，他既不信上帝也不信魔鬼。他大声宣布他只相信法律，并且会破解这个谜团。


    他在嘴里咬着一把剑，手里各拿着一把枪。当他打开酒窖门时，一个极其异常的景象映入眼帘。所有的瓶子都在跳舞！绿色标签的瓶子跳着绅舞，红色标签的瓶子跳着女士舞。这场狂野的派对有它们自己的乐队。空瓶子当作风乐器；破碎的瓶子像長一样碰撞；裂开的瓶子发出尖锐的小提琴声。看到看到的只是跳舞的瓶子而感到非常松口气，军士忘记了恐惧，加入了派对。


    他选择了一个带红色标签的美瓶作为舞伴，他们一起跳舞。酒窖里到处都是响亮的笑声。军士被好奇和分心了，松开了瓶子，瓶子在地上碎成碎片。


    在那瞬间，派对停止了，恐惧的尖叫从酒窖的每个角落传出来。军士惊坏了，他看着洒出的酒变成了一滩血，一个女人的身体在那里成形，她金色的头发浸在湿湿的血中。她躺在军士脚边的地板上。


    他惊恐了，抓住一个绿色标签的瓶子，大喊道：“我至少能抓到你们一个！”唯一的回答是地狱般的笑声，在军士跑上楼时紧随在他身后。


