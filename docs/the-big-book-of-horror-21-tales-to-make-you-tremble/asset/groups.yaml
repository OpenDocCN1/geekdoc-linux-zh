    ## The Field Werewolf


    In the reign of Egbert the Saxon, there lived in England a maiden named Yseult
    who was beloved by all, both for her goodness and for her beauty. She attracted
    interest from many men, though all sought to win her hand, she loved only one:
    Harold, the grandson of Siegfried the Teuton. Another young man, Alfred, loved
    Yseult and was angry that she favored Harold. So one day Alfred said to Harold,
    "It is said that curse fell on your grandfather. Is it right that Siegfried should
    rise from his grave and have Yseult as his wife?" Then he added, "Good sir, why
    do you turn so white when I speak your grandfather''s name?"


    What Alfred said disturbed Harold deeply. "Because there are some stories told
    by our ancestors that we should not forget." Those words would not let Harold
    sleep in peace. Siegfried''s grandfather had been a cruel, bloodthirsty man. Legend
    says that curse had fallen upon him and had been slumbering for a century, but
    Harold knew it was awakening in his own blood, passed down from grandfather to
    grandson. Harold remembered only the legend. He also had a sharp spear that had
    been left by the witch who was said to be responsible for the curse. Harold knew
    that the curse possessed him yet did not tell the truth. Whenever he felt the
    curse burning in him he would tell Yseult that he had to hunt wild boar or stag.
    Although Harold went away many times, Yseult suspected no wrong for she loved
    and trusted him completely. But still, Harold lived in dread that Alfred would
    find out his terrible secret. Greatest terror was that the curse would seize him
    when he was with Yseult and he would do some evil to her.


    ![](img/924655fb7a904241de0515cec7265848_105_0.png)


    In those days the kingdom of Egbert the Saxon was being ravaged by a werewolf
    that even the bravest men terrified. Legend told that this werewolf was a man
    by day and a wolf who viciously slaughtered people by night. About that time Yseult
    asked Harold to accompany her to a feast. Harold replied that he had been summoned
    to Normandy on an important mission and would be gone for some time. "I beg you
    not to go without tomorrow’s feast," he said. Yseult was hurt and angry as she
    had been looking forward to the feast for months. Harold fell to his knees to
    plead with her "Last night, dear love, I dreamed that an old man cursed me. While
    I was sleeping he took control of me, saying, ''Go, search, and kill! Kill and
    let the blood flow!'' I was trapped in the body of a savage wolf. I ran through
    the woods. Thorns pierced my flesh. Voices telling me, ''Go, search, and kill!
    Kill and let the blood flow!'' And I felt a terrible thirst for blood. Then I
    came to the sacred grove. The old man showed me a young maiden and ordered me,
    ''Kill her!'' I sprang upon her and tore into her flesh with my fangs."


    ![](img/924655fb7a904241de0515cec7265848_106_0.png)![](img/924655fb7a904241de0515cec7265848_106_1.png)


    Harold had scarcely finished telling his dream when Alfred walked in the room.
    Yseult told Alfred of her desire to go to the sacred grove and of Harold''s dream.
    "Those fears are childish," cried Alfred boastfully. "I will accompany you to
    the feast with my men, and you will have no need to be afraid."


    Harold saw that he could not deny Yseult her wish, so he fetched old Siegfried''s
    spear and gave it to her, saying, "Take this spear with you. Farewell, oh my beloved.
    How you will love me when you know of my sacrifice. Farewell forever." And with
    that Harold went off to Normandy, leaving Yseult in wonder.


    The next night Yseult set off with Alfred, his men, and Siegfried''s spear. The
    feast was very lively. There was singing and dancing and great merriment. But
    suddenly the music stopped and the terrible figure of the werewolf appeared. His
    eyes fixed on Yseult. He ran to attack her and all Alfred''s men fled in fear.
    Only Alfred remained, hurling his lance straight at the beast.


    ![](img/924655fb7a904241de0515cec7265848_107_0.png)


    The weapon broke into pieces as soon as it touched the werewolf. It was useless.


    The werewolf crouched in wait for a moment, and Yseult fearlessly raised the spear
    that Harold had given her and threw it at the werewolf. As the spear flew through
    the air the werewolf gave a cry of human agony, and for an instant, Yseult saw
    something familiar in his eyes. Then the spear pierced the creature''s chest just
    above the heart, and the werewolf fell dead.


    There was great joy at Yseult''s brave deed, but she had no wish to celebrate.
    She sent for Harold right away, giving orders that no one should rest until he
    was found. Entering his bedroom, they saw Harold lying on his bed. "He sleeps,"
    said one. "See, he holds Yseult''s portrait in his hand."


