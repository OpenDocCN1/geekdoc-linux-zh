    You no longer go out to hunt with your friends. And what do you do alone in the
    forest from dawn to dusk?


    After a long silence, Don Fernando answered the huntsman.

    "Inigo, you are old now and known these places since you were a child. You, who
    have hunted for half a lifetime, tell me, have you never happened to see the woman
    who lives in those woods?


    "A woman!" the huntsman explained in amazement.


    "Yes, a beautiful creature. I thought I''d be able to keep this secret to myself,
    but I suffer too much. My heart seems breaking. Please help me solve the mystery
    that surrounds this woman to exist only for me. Nobody else knows her. Nobody
    else has her. Nobody can tell me about anything her.


    "Ever since that day that I went to Alanos spring, despite your terrible warning,
    I''ve been filled with a longing for solitude. The spring is a place of incomparable
    loneliness. Under the thick leaves of the poplars, the spring trickles through
    a cleft in a rock. Its bright water drops fall gently through the leaves into
    the pond. They make a heavenly music. The first day that I rode to the waters
    I thought I saw something very strange: a woman''s eyes gazing at me from the
    depths of the pond.


    "I''ve gone back in search of those eyes every day since then. I thought my imagination
    was playing tricks on me. Then finally I found her wearing a long, graceful gown
    that trailed into the water. Her beauty was beyond words. Her hair was gold, and
    her eyes were a remarkable color—


    "The green eyes!"


    ![](img/924655fb7a904241de0515cec7265848_18_0.png)


    “How did you know her eyes were green?”


    I do not know this woman, but my parents told me as a child never to go near the
    spring. They told me many times that the spirit or demon that lives in its waters
    has green eyes. Don Fernando, I beg you, do not go back there again, or you will
    pay with your life for so boldly tainting those waters!


    Don Fernando was deaf to his servant’s warning. From the first time I saw those
    eyes, I was bewitched. My only desire is to look on them. All I love most in this
    world I would give up for just one glance from those eyes.”


    A tear ran down Inigo’s cheek. “May God’s will be done,” he murmured.


    Time passed, and one day Don Fernando knelt down before the pond to give himself
    to those captivating emerald eyes.


    “Who are you, creature of the waters? Every day I have come here to win your love.
    Talk to me!”


    And she, beautiful and pale, finally spoke to him.


    “And if I were a demon?”


    Don Fernando hesitated for a minute. He broke out into a cold sweat. His eyes
    widened as he gazed more deeply into the woman’s bright, shining eyes. Then he
    cried out in a burst of passion. “I—


    “Fernando,” answered the beauty of the waters, “I love you even more than you
    love me for I am pure of spirit—an immortal. I am not like a human woman. I am
    worthy of you for you are better than other men. Do you see the plants waving
