    # Guy de Maupassant


    ## The Hand


    People crowded around the judge, M. Bermutier, who was giving his opinion on a
    strange crime that was the talk of Paris.


    A woman cried out, "It''s supernatural! The truth will never be known."


    The judge turned to her. "True, it is likely that the actual facts will never
    be discovered, but the word ''supernatural'' has nothing to do with it. We are
    faced with a crime so well planned that the mystery surrounding it prevents us
    from figuring it out. It is not the first time this has happened. I handled a
    case just as mysterious as this one. It has still not been solved."


    "Oh! Tell us about it!" people exclaimed.


    M. Bermutier smiled. "I will tell you, but do not think that I believe anything
    in this case. It was long ago, when I was a judge in Corsica. One day I learned
    that an Englishman named Rowell had rented a house there for a few years. rumors
    about him were growing, so I decided to visit him.


    I went to him, and he invited me into his parlor. We met on a number of other
    occasions, and I noticed that he kept loaded revolvers in his parlor, as though
    in fear of some attack. As casually as possible, I asked him about his life. He
    told me of his travels in Africa, Asia, and America. He said that he had many
    adventures and had hunted elephants and tigers, so I asked, ''Are these animals
    dangerous?''


    He laughed, replying, ''Man is the most dangerous.'' In the midst of the conversation,
    I noticed something that captured my attention. Against a square of velvet, a
    black object was displayed. I went closer and saw it was a human hand. The skin
    had been removed to show the blackened flesh. The overwhelmingly fingers were
    attached by enormous tendons that still had pieces of skin clinging to them. It
    had yellow nails. It looked as though it had been chopped off with an ax. A strong
    chain fastened the wrist to the wall.


    I asked Sir Rowell about it, and he explained that it was the hand of his worst
    enemy. The Englishman went on to say that the chain was to hold it in place. I
    thought this was a joke and said, ''The chain is useless now. The hand won''t
    away away.'' Rowell answered, ''It always wants to go away. This chain is needed.''
    I didn''t know if he was insane or joking.


    I stopped visiting him. There were no more rumors; people had lost interest in
    him.


    A year went by and one morning my servant awakened me with the news that Sir Rowell
    had been murdered during the night. I went to his house right away. The Englishman
    had been strangled in the parlor. His face still wore an expression of horror,
    and his shirt was ripped. He held something between his teeth, and his neck was
    pierced by five holes, which were covered in blood.


    The doctor examined the marks on the neck for a long time. ''He seems to have
    been strangled by a skeleton,'' the doctor announced.


    This information chilled me, and I immediately glanced up at the wall, looking
    for the terrible hand. It was not there. The chain was hanging down, broken.


