    # John William Polidori


    # The Vampire


    One winter, a man named Lord Ruthven who had never before been seen in society
    began to visit the most refined houses in London. His peculiar behavior and deathly
    pallor aroused curiosity, but his distant manner in no way prevented the ladies
    from finding him attractive, for he was charming and had a look about him that
    suggested high morals.


    A wealthy orphan Aubrey, who lived alone with his sister, became particularly
    interested in him. When he met Lord Ruthven, he believed him to be an extraordinary
    man and pictured him as the hero in a romance. Aubrey decided to travel through
    Europe and invited Lord Ruthven along. Lord Ruthven accepted.


    During the journey, Aubrey studied Lord Ruthven''s character. He discovered that
    Lord Ruthven was generous with people in need when they had given in to vice or
    laziness, but he had no sympathy for people who lived virtuous lives yet suffered
    terrible difficulties. Lord Ruthven also sought out the most decadent spots in
    each city and had a fondness for leading innocent young girls into wickedness.
    Aubrey wanted to beg him to stop this behavior, but Lord Ruthven remained completely
    aloof. In Aubrey''s imagination, he began to take the appearance of something
    supernatural.


    The two separated and Aubrey arrived in Greece, where he soon met a young girl,
    Ianthe, who won his heart. She told him an ancient legend of the vampire, who
    passed years among friends, feeding upon the lives of lovely females to prolong
    his existence. Aubrey was skeptical, and Ianthe urged him to believe her


    ![](img/924655fb7a904241de0515cec7265848_21_0.png)


    for it was said that those who questioned the vampire''s existence were forced
    to believe it was true through heartbreaking evidence. Aubrey convinced her that
    there could be no truth to her fears, despite his suspicions about the supernatural
    power of Lord Ruthven.


    One night, in spite of Ianthe''s protests, Aubrey journeyed to a lonely spot where
    he was attacked by someone with superhuman strength and nearly choked to death.
    But as daylight came, the enemy rushed away. On this same night Aubrey''s beloved
    Ianthe was found murdered. There was blood on her neck and chest, and upon her
    throat were the marks of fangs. She cried with horror. "A vampire! A vampire!"


    The strangeness of this death left Aubrey deeply disturbed, and the young Englishman
    began to suffer from spells of delirium. Heartbroken and on the brink of madness,
    he stayed in Athens. To his surprise, a few days after the girl''s death, Lord
    Ruthven reappeared. He came to visit Aubrey, and this time his behavior was perfect.
    He took care of Aubrey, and only when he could see that Aubrey was getting better
    did he become distant again, smiling at Aubrey with a look of cruel pleasure on
    his face.


    Once again Aubrey and Lord Ruthven traveled together. Attacked by thieves on their
    journey, Lord Ruthven received a fatal bullet wound. On his deathbed Lord Ruthven
    asked Aubrey to grant him a final wish.


    > "Swear to me that you will conceal all that you know about me and tell no one
    that I have died." Aubrey gave Lord Ruthven his oath. Lord Ruthven sank laughing
    upon his pillow and breathed no more.


    After all these horrors, Aubrey returned to London. His sister helped him recover.
    He soon decided that he would


    ![](img/924655fb7a904241de0515cec7265848_22_0.png)


    please her by presenting her in society. He organized a fancy reception, and the
    event was a success. But something occurred that once again left him disturbed.
    During the festivities, he gazed on the figure of Lord Ruthven, risen from the
    dead, and heard his voice command, “Remember your oath!”


    After that, Aubrey shut himself up in his room for months. A doctor looked after
