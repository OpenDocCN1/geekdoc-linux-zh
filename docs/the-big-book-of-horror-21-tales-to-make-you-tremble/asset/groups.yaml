    # Edgar Allan Poe


    # The Fall of the House of Usher


    I had spent the whole day traveling by horseback under heavy, dark clouds when
    I finally came upon the melancholy House of Usher and the dreary land surrounding
    it.


    I felt a sense of gloom at first glance. I looked upon the bleak walls of the
    house and the empty windows and felt a sinking of the heart. I was plunged into
    despair. I found myself at the brink of a lurid pond. In its black waters I gazed
    on the upside-down reflection of that somber mansion with its ghastly-like windows
    and shuddered.


    Nevertheless, it was my plan to spend time in that house. The letter I had received
    from Roderick Usher, a close childhood friend, had touched me. He wrote that he
    was suffering from a terrible illness—and begged me to visit him as the cheerfulness
    of my company would help relieve his sickness.


    The ancient Usher family was known for their extraordinary sensitivity, which
    had given the


