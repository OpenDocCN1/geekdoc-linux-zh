    # Edward Lucas White


    # The House of the Nightmare


    I first caught sight of the house as the road I was driving down came out into
    open country and I left the woods behind. The sun was going down. To the right
    side of the road, I was dazzled by the white glow of a tall stone. A line of trees
    hid it from me, and when I saw the stone again I was amazed. Now it was on the
    left side of the road! I lost sight of the stone again going around a curve, and
    when the road straightened out the stone once more on on the right. I was puzzled
    and wanted to discover what was going on. I meant to stop to take a good look
    at the stone, but in my bewilderment I sped up the car and it leaped forward.
    Suddenly I lost control. I steered wildly, but everything I touched went wrong.
    My car skidded and crashed into a large tree.


    When I woke up I was lying in a ditch, looking up the last rays of sunlight. I
    sat up, and, while much shaken, I found I was not bleeding and no bones were broken.
    My car, however, was wrecked.


    ![](img/924655fb7a904241de0515cec7265848_69_0.png)'
  - '[PAGE 70]


    I got to my feet and examined my car. Everything was ruined except for my baggage.
    As I was looking over my things, I noticed a boy standing near the ditch and staring
    at me. He was stocky, barefoot, and wore pants rolled up to his knees. I noticed
    he had a split upper lip, a harelip. He said nothing, so I addressed him.


    “Where is the nearest garage?”


    “Eight miles away,” he answered.


    I asked if he could take me to get the damage repaired, but he told me that there
    were no horses or any means of transportation at the house. He also told me that
    the next house was six miles away. It would be completely dark before I got there.


    “May I sleep in your house tonight?”


    “You come in if you want to,” he said, “and sleep if you can. House is all messy.
    Ma’s been dead three year now, and Dad’s away. Nothin’ to eat but flour and moldy
    bacon.”


    “Well, I have some food,” I answered, picking up one of my suitcases and asking
    him to carry the other.


    “You can come in if you’re a mind to,” he said, “but you got to carry your own
    stuff.” He did not say this rudely, but simply stated it mildly, as if it were
    an obvious fact.


    Along the way to the house I noticed an unpleasant smell of rotting flowers and
    plants. When we arrived, I saw that the house was run-down and neglected. The
    walls were of gray stone, and the green shutters had faded to almost the same
    color as the stone. I was so loaded down with things that I could not open the
    door, so I asked the boy to do it.


    “Open it yourself,” he replied, disagreeably, but in a matter-of-fact


    ![](img/924655fb7a904241de0515cec7265848_70_0.png)'
  - '[PAGE 71]


    way that seemed natural. I put down my things and opened the door. The hall smelled
    damp and moldy.


    The boy put me in a room that was very close to the front door. I could barely
    see anything for there was no light."Better get a lamp,” I said to the boy.


    “No lamp,” he declared. “No candle. Mostly I get abed before dark.”


    I managed to find three candles in one of my bags and lit one. My room was very
    simple: a bed, two chairs, a wobbly bureau, and a small table. It settled in and
    then asked the boy, who had not moved or spoken, to show me to the kitchen, where
    I lit two more candles.


    I started a fire in the fireplace and cooked dinner with the food I brought. I
    invited the boy to join me.


    “I ain’t hungry,” he said. “I’ve had supper.” I found surprising for a boy his
    age. All the boys I knew were hearty eaters. To my surprise, for the mid-June
    evening was hot, the boy went up to the fire and got so close to the flames that
    I was afraid he would burn himself, though he seemed not to mind.


    “Are you cold?” I asked him.


    “I’m always cold.”


    When I stepped outside to have a smoke, the boy joined me on the porch. He sat
    on the ground while I sat on a rocking chair.


    “What do you do when your father is not here?” I asked him.


    “Nothin’. Just fool ‘round.”


    “Do you ever see your neighbors?”


    “Don’t no neighbors never come here,” he stated. “Say they’re afraid of the ghosts.”


