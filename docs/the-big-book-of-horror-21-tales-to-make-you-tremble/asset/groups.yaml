    我想起去拜访一些朋友来让自己冷静下来。我去了三家房子，但运气很糟糕，家里空无人。最后，我出去散了散步，希望能遇到我认识的人。在很长的时间里，我无目的地在徘荡着，直到那天深夜我决定回家。


