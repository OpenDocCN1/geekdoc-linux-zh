    long black hair standing just outside the window. The man growled like a beast,
    ‘Tell your master I have come for our bargain. I expect him here this minute.’”


    “My grandfather ran upstairs to tell Sir Dominick what had happened. Sir Dominick
    tried to gain time, but the man downstairs just growled that he would come up
    for him. The master of the house walked down the stairs. The stranger seized Sir
