  mdcn: "\n一种奇特的抓挠声。那听起来像是一只非常大的猫爪在抓挠木地板。抓挠声越来越大，似乎近得令人心惊，然后变得微弱而遥远，直到最后停止了，仿佛那个制造噪音的神秘凶手先是到了床边，然后又远去。\n\
    \n这种经历的诡异让比先生夫妇不知所措，他们感到的焦虑让他们直到凌晨四点也无法入睡。但在那之后，他们再次被惊醒，发现当他们睡觉时，有人（或某种东西）把床罩和床单从床上扯走了。比夫人点起灯，但他们什么异常都没有看到，除了他们的被子消失了。他们大惊失色，冲出房间，剩下的晚上都在自己的卧室里度过。\n\
    \n第二天早上，他们回到罗斯太太的房间，发现床罩和床单被卷成一团放在床上。床罩只是纠缠成了一个球，但床单被完全撕碎成了碎片。比夫人拒绝在那间间闹鬼的房间里再住一晚。而比先生却固执地坚持在那里再住一晚，试图解开这个谜团。\n\
    \n那天晚上，比先生睡着了，灯依然还亮着。正当他开始入睡时，他听到了和前晚一样的声音。他坐起来，看到面前有一个忧郁、破烂不堪的老人，正用蔑视的神情看着他。他头上戴着一顶猫皮制成的奇特帽子，那双没有肉、骨感的手有着极长且尖利的指甲，像猫科动物一样。尽管内心恐惧，比先生还是开口了。\n\
    \n> “你在这里做什么？”他质问道。“你想干什么？”\n\n老人并没有回答，而是开始猛烈嚎叫，像一只准备攻击的猫，然后开始用爪子撕碎床单。当他撕碎床单时，比先生捡起床旁的一根手杖试图击那个入侵者，但手杖直接穿透了那个凶猛的老人，仿佛他根本不是由肉骨组成的。\n\
    \n![](img/924655fb7a904241de0515cec7265848_110_0.png)\n\n那个幽灵生物后退了，像猫一样喵叫着，消失在墙壁之中，没有留下任何痕迹。\n\
    \n第二天，比先生夫妇坚信那个房间里真的发生了超自然现象。他们决定永远封锁那个房间，继续租用房子里的其他房间。\n\n多年后，在一次家庭聚会上，这对夫妇向一位来自金斯顿的访手表哥讲述了这些离奇事件。在好奇和想要帮助亲人解谜的愿望驱动下，水手请求让他们他在那间被诅咒的房间住一晚。他是一个勇敢强力的男子，以判断力好闻称。于是比先生夫妇同意打开房间。水手把自己锁在里面。尽管他很勇敢，而且他不相信鬼，但他立刻就睡着了。\n\
    \n床的剧烈晃动让他突然醒来。那个戴着猫皮帽的幽灵正从床脚恶地盯着他。水手想要起来追他，但猫人退缩了，愤怒地喵叫着消失在墙壁中。片刻后听到了剧烈的撞击声，仿佛房间墙内有人在猛撞。一块巨大的石膏从天花板上掉落。\n\
    \n表哥无恙地出来，但再也没有人进入过那间被诅咒的房间。比先生夫妇搬走了，去了另一个城市生活。那个幽灵猫人再也没有出现过。\n\n![](img/924655fb7a904241de0515cec7265848_111_0.png)\n\
    \n![](img/924655fb7a904241de0515cec7265848_112_0.png)\n\n## 他们的人生轨迹被不幸标记……\n\n\
    ### 查尔斯·狄更\n(1812–1870)\n狄斯的童年贫困且艰难。他不幸的婚姻以与妻子告终。狄斯是史上最受欢迎的小说家之一，写过许多令人胆寒的恐怖故事，如《孤星儿》、《大卫·柯波菲德》、《双期望》和《圣诞歌》。\n\
    58岁去世\n\n### 洛夫克特\n(1890–1937)\nH.P. 洛夫克特的大脑中充满了古老而奇异的秘密。他以宇宙恐怖而闻名，这种恐怖源于现实，并服务于他在各种类型和体裁中的想象。洛夫克特常与爱德华·艾伦·波相比。\n\
