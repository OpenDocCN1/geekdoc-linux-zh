    ## Villiers de L''Isle Adam


    ## A Torture of Hope


    The much respected Pedro Arbuez Espila, sixth prior of the Dominicans of Segovia
    and third Grand Inquisitor of Spain, walked down to a secret dungeon. He entered
    a tiny, dirty room after unlocking a massive door that creaked open. The floor
    was covered with filthy straw. The walls were stained with blood. The only objects
    in the room were a pitcher, a dish, and an instrument of torture. A man in rags
    sat chained to the wall by heavy iron rings.


    The prisoner was Rabbi Abarbanel, a Jew from Aragon, accused by the church of
    usury, or lending money at a high rate of interest, and of cruel treatment of
    the poor. For more than a year he had been tortured daily, but he had not given
    up his faith. His loyalty to his God and to his ancestors gave him the courage
    to resist torture.


    With tears of pity in his eyes, the inquisitor approached the trembling rabbi.

    "My son, you have suffered enough. Your trials are about to end. Sleep this evening
    in peace. Tomorrow you will be burned at the stake. You will burn along with other
    condemned nonbelievers. Death will take at least two hours; you will burn little
    by little, thanks to the damp, frozen clothes we will put you in. And you will
    be number forty-three, placed in the last rank, so you will have the time to accept
    the true God and be redeemed."


    Two guards were sent to unchain the wretched prisoner, and the inquisitor embraced
    the rabbi with true affection. After this tender gesture, Pedro Arbuez D''Espila
    prayed that the Jew pardon what he had made him endure in order to reform him.
    Then the captive was left alone in the darkness.


    ![](img/924655fb7a904241de0515cec7265848_47_0.png)


    Rabbi Aser Abarbanel, half fainting, his lips parched, stared at the closed door.
    Closed? The word awoke a strange vision in his confusion. Was he hallucinating?
    He fancied had seen a tiny ray of light between the door and the wall. A flash
    of hope took hold of him. He dragged himself toward the door, and putting a finger
    into the crack, he pulled the door open. By some extraordinary luck, the key had
    been turned before the door was fully locked.


    The rabbi looked outside into the corridor. He saw no door, yet somewhere in the
    distance, the way might lead to freedom. His hope was stubborn. His faith brought
    him one last chance.


    He moved slowly, dragging himself along the ground. He forced himself to cry out
    in pain at his open wounds.


    All of a sudden he heard footsteps. A trembling fit seized him. This, no doubt,
    would be the end. He squeezed himself into a recess in the wall. The friar hurried
    along, carrying a torture instrument for tearing flesh. He disappeared. It was
    a miracle! In shock, the rabbi remained still for nearly an hour.


    Finally he began again to crawl toward his possible escape. The corridor seemed
    to go on forever, but he never stopped his slow advance until he again heard footsteps.
    The forms of two inquisitors, in conversation, came nearer, and the rabbi pressed
    himself against the wall. When they were almost next to him, the footsteps stopped.
    The rabbi was certain that all hope was gone. He prayed to God.


    The two inquisitors continued talking and one looked straight at the rabbi. Under
    his gaze, the rabbi nearly fainted, but the inquisitor seemed to look without
    seeing him. Then, still speaking, they continued on their way.


    They had not seen him! A hideous thought came to the rabbi: Perhaps he was already
    dead and that''s why no one could see him. But a persistent hope and desire to
    end his imprisonment gave him the strength to continue. He started once more crawling
    on his hands and knees. All at once, he came to a little door at the end of the
    passage. There was no lock! He pushed the door and it opened.


    “Hallelujah!” sighed the rabbi as he was welcomed by fresh air and beautiful gardens
    that opened into the countryside. He breathed the wonderful air and stretched
    out his arms before him to give thanks to God who had given him his mercy.


    And then he seemed to feel answering arms surround him and press him tenderly
    against his chest. A tall figure looked down on him. Happily, the rabbi looked
    up at the figure and gasped, staring in fright.


    Horror of horrors! He was embracing the Grand Inquisitor himself! And the Grand
    Inquisitor was gazing at him with eyes full of tears, like a shepherd who has
    at last found a lost sheep who had strayed far from the fold.


    Pedro Arbuje D''Espila clasped the rabbi against him gently, while the rabbi choked
    with anguish. The Grand Inquisitor looked down at the rabbi and scolded him gently,
    ‘What, my child? On the eve of what could be your salvation you would try to leave
    us?”


    The heartbroken rabbi realized in a sudden agonizing flash that everything that
    had happened to him that evening had been one last horrible torture. He had been
    put through the torture of hope.


