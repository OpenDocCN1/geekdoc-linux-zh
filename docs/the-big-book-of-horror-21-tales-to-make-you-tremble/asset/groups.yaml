    ## The Murders in the Rue Morgue


    Solving mysteries requires imagination. It is not enough to have a talent for
    simple calculation. It is important to have the ability to analyze, pay such careful
    attention to the smallest detail that the truth becomes untangled.


    One morning my friend, Monsieur Auguste Dupin, and I were reading through a Paris
    newspaper when we came upon a striking headline: EXTRAORDINARY MURDERS.


    The article described how the previous night the bodies of a Madame L''Espanaye
    and her daughter, Mademoiselle Camille, had been found in their home in the Rue
    Morgue. According to the article, the neighbors were awakened by terrible shrieks
    coming from the fourth floor. Aided by two policemen, the neighbors were able
    to break down the door to the building. The screaming stopped as they rushed upstairs.
    Then the neighbors heard two angry voices, which fell silent before they reached
    the fourth-floor apartment. When they entered, they found an astounding sight.


    -furniture was broken and scattered about, including a mattress thrown onto the
    floor. Near the fireplace there were bloodstains and tufts of gray human hair
    pulled out by the roots. A bloody razor rested on a chair, and two bags of gold
    coins were open on the ground. When the search began, the body of the daughter,
    Camille, was found. The discovery was truly horrifying—her body had been jammed
    into the chimney. The face of the young woman was scratched. Upon her throat were
    marks of fingernails: She had apparently been strangled to death.


    The mother''s corpse was later found in the backyard. Her throat had been brutally
    cut. The newspaper pointed out that no motive had been discovered for this terrible
    bloodshed. The police were completely mystified.


    The next day new details of the event were published. The headline read: THE TRAGEDY
    IN THE RUE MORGUE.


    The newspaper cited the statements of the witnesses. Most of the witnesses were
    neighbors who had participated in the discovery of the murders. All of them explained
    that the deceased mother and daughter had been very solitary, receiving few visitors.
    A laundress stated that the mother and daughter seemed to get along with each
    other and gave the mother her good pay for her services. They had lived peacefully
    in the house for over six years.


    Of the two voices heard shouting the night of the murder, one was described as
    gruff and the other as shrill. All of the witnesses were certain that the gruff
    voice spoke in French, perhaps with a foreign accent, and a few heard the voice
    exclaimed "My God! As for the shrill voice, no one had understood a word it said.
    Some claimed it was speaking Spanish, while others thought the language had been
    Italian, German, or Russian. However, none of the witnesses could be sure because
    neither spoke nor understood these languages.


    Statements were also taken from the ladies'' banker and the bank''s clerk. The
    banker''s statement was of particular interest. Madame L''Espanaye had withdrawn
    four thousand gold francs three days before her death.


    The clerk reported that he had brought the bags to her home. When he arrived there,
    the daughter had helped her mother carry the bags of money upstairs.


    My friend Dupin was greatly interested in the matter. I realized that he made
    no comment about the murders because he was silently analyzing the facts, turning
    them over in his mind, and letting his imagination work out the details of the
    case. When we read that the bank clerk had been arrested, Dupin finally spoke
    out.


    “We will make nothing of this mystery by simply reading a few statements by witnesses.
    It would be an interesting pastime for both of us to do our part to clear up these
    murders. I have a certain friendship with the chief of police, and he will permit
    us to have a look at the scene of the crime.”


    When Dupin received authorization from the police chief, we set out for the Rue
    Morgue. Before we went up to the fourth floor, Dupin wished to take a look at
    the outside of the building.


    First we walked around to the back of the block, and then we examined the front
    of the building, from top to bottom. The two policemen at the door let us pass
    when we showed our permit. We climbed the stairs and went into the fourth-floor
    apartment. Both of the bodies were still there.


    ![](img/924655fb7a904241de0515cec7265848_27_0.png)


    The room had been left in the same disorder in which it had been found, and my
    friend examined everything in great detail, including the corpses. We spent hours
    poring over that gruesome scene.


    Dupin remained thoughtful throughout the day and did not wish to speak of the
    matter until the following evening. We were in his home when he asked me. “What
    did you notice that was peculiar about that apartment?


    “Nothing that we had read in the newspaper,” I answered, agreeing with the rest
    of Paris that this was an unsolvable mystery and that it would be impossible to
    catch the murderer.


    “This case has been considered impossible to solve because the police are confused
    by the lack of motive; he told me. However, just because the case is unusual does
    not mean it is difficult. I can assure you that the bank clerk is innocent. And
    though it may come as a surprise, we are now waiting for the visit of a man who,
    though he is not guilty, is involved in the case.


    Dupin handed me a pistol. He told me to hide it in my jacket and to be prepared
    for the arrival of the suspect. It seemed that he knew almost everything needed
    to know, so I listened to the rest of his story with great interest.


    “The murders were committed by a third person. It is totally impossible for Madame
    L’Espanaye to have first killed her daughter and then committed suicide. She lacked
    the strength to force the girl’s body into the chimney.


    “The testimony of the witnesses to the two voices is clear. The gruff voice is
    that of a man who speaks French, but no one has been to properly describe the
    shrill voice. One witness was able to understand a single word said! You could
    suppose that it was perhaps the voice of someone from Asia or Africa, but there
    are not many Asians or Africans in Paris, so this is unlikely.


    “My examination of the body of Mademoiselle Camille provided me with an important
    clue. The prints on her neck were so wide apart that it seems impossible to a
    human being could have hands that big.


    ![](img/924655fb7a904241de0515cec7265848_28_0.png)


    In addition, the body was so forcefully pushed up into the chimney that not even
    two men could have done it.


    "Now remember the odd disorder of the room, the gold francs still left there,
    the brutality of the scene. What does your imagination tell you?


    "The crime must have been committed by a madman"


    "Not a madman, but an animal! Only an animal has the superhuman strength and brutality
    necessary to accomplish such murders!"


    I stared at Dupin in absolute astonishment.


    "I found a ribbon in the backyard next to Madame L''spanaye''s body. It is the
    sort of thing that Maltese sailors often use to tie their hair. It is also well
    known that sailors often bring back to Europe from their voyages to the tropics
    to sell them for money. I made a sketch of the marks on Mademoiselle Camille''s
    neck and the distance between the marks and found that they matched perfectly
    with the digits of an orangutan.


    The animal must have escaped with the razor during the night and climbed through
    the window at the back of the building. The sailor followed it, and when he reached
    the house he found the terrible scene of carnage and death. Undoubtedly he exclaimed,
    ''My God!'' upon discovering the horrible mess. The beast grew frightened when
    it was its master and tried to hide what it had done. It drew Madame L''Espanaye
    out the window into the backyard and also tried to get the daughter out of the
    way by thrusting her up the chimney"


    His story was interrupted abruptly when someone knocked on the door. From the
    other side someone asked in French, with a foreign accent, ''Monsieur Dupin? I
    saw your advertisement in the newspaper about an orangutan you found. It''s mine!"


    The man was, in fact, a Maltese sailor. He, like myself, had not imagined that
    anyone would come to connect the orangutan with the murders. Later, the bank clerk
    was released from jail, the orangutan captured, and Dupin was very pleased with
    having outsleuthed the Paris police!


