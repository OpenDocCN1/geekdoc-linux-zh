    # The Outsider


    For me, memories of childhood are filled with fear, loneliness, and sadness. And
    yet I cling to those memories.


    I don''t know where I was born. I only remember the shadows and cobwebs of the
    castle where I lived. The crumbling stones of the corridors were always damp,
    and there was a horrible stench everywhere, like that of rotting corpses. It was
    never light inside the castle, nor was there any sun outdoors, since the trees
    grew taller than the highest parts of the castle. Only a ruined black tower rose
    above the darkness of the forest. But it could only be climbed by scaling sheer
    wall.


    Someone must have cared for me when I was a child, I can''t remember who. I can''t
    recall any living creatures in the castle but rats and spiders. My there was nothing
    grotesque in the bones and skeletons that shared the silence with me. For me they
    were more natural than the living beings shown in illustrated books that I read.


    I do not remember hearing any human voice in all those years—not even my own.
    I didn''t even know what I looked like since there were no mirrors in the castle.
    I believed that I must look like the children drawn and painted in my books.


    Outside, under the dark trees, across from the stinking moat, I would dream about
    what I read—the laughter, the joyful crowds, a sunny world beyond the endless
    forest. I tried to escape, but as I went deep into the woods I grew afraid and
    ran back to the castle.


    I dreamed and waited, until I could wait no more. I decided to climb the ruined
    black tower that reached the trees. Even if I fell, it was better to glimpse the
    sky and die, than live forever without seeing the outside world.


    In the twilight, I arrived at the bottom of those broken stone stairs and began
    climbing. When the steps ended, I continued by clinging to small footholds. I
    went


