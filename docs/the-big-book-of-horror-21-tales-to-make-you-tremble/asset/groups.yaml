    # Eugene Field


    # The Werewolf


    In the reign of Egbert the Saxon, there lived in England a maiden named Yseult
    who was beloved by all, both for her goodness and for her beauty. She attracted
    interest from many young men, though all sought to win her hand, she loved only
    one: Harold, the grandson of Siegfried the Teuton. Another young man, Alfred,
    loved Yseult and was angry that she favored Harold.


    So one day Alfred said to Harold, "It is said that a curse fell on your grandfather.
    Is it right that Siegfried should rise from his grave and have Yseult as his wife?"Then
    he added, "Good sir, why do you turn so white when I speak your grandfather''s
    name?"


    What Alfred said disturbed Harold deeply. "Why do you taunt me with my father''s
    memory?"


    "Because there are some stories told by our ancestors that we should not forget.

    As time those words would not let Harold sleep in peace, and Alfred''s bitter
    smile haunted him. He knew very well Alfred had meant.


    Siegfried the Teuton, Harold''s grandfather, had been a cruel, bloodthirsty man.
    Legend says that a curse had fallen upon him and it had been slumbering for a
    century, but Harold knew, it was awakening in his own blood, passed down from
    grandfather to grandson.


    Of his grandfather, Harold remembered only the legend. He also had a sharp spear
    that had been left by the witch. Brunhilde, who was said to be responsible for
    the curse.


    Harold knew that the curse possessed him yet didn''t tell Yseult for fear that
    she would not love him the truth. Whenever he felt the curse burning in him he
    would tell Yseult that he had to hunt wild boar or stag. Although Harold went
    away many times, Yseult suspected no wrong for what she loved and trusted him
    completely. But still, Harold lived in fear. He knew that Alfred watched him and
    was tormented by


    ![](img/924655fb7a904241de0515cec7265848_105_0.png)'
  - '[PAGE 106]


    a dread that Alfred would find out his terrible secret. But greatest terror was
    that the curse would seize him when he was with Yseult and that he would do some
    great evil to her.


    In those days the kingdom of Egbert the Saxon was being ravaged by a werewolf
    that had even the bravest men terrified. Legend told that this werewolf was a
    man by day and a wolf who viciously slaughtered people by night.


    About that time Yseult asked Harold to accompany her to a big feast for the feast.
    Harold replied that he had been summoned to Normandy on an important mission and
    would be gone for some time. “I beg you not to go without tomorrow night’s feast,”
    he said.


    Yseult was hurt and angry, as she had been looking forward to the feast for many
    months.


    Harold fell to his knees to plead with her. “It is the werewolf I fear. Last night,
    dear love, I dreamed that an old man


    cursed me. While I sleeping he took control of me, saying, ''Go, search, and kill!
    Kill and let the blood flow!'' Suddenly I was trapped in the body of a savage
    wolf. I ran through the woods. Thorns pierced my flesh. Voices telling me, ''Go,
    search, and kill! Kill and let the blood flow!'' And I felt a terrible thirst
    for blood. Then I came to the sacred grove. The old man showed me


    ![](img/924655fb7a904241de0515cec7265848_106_0.png)


    ![](img/924655fb7a904241de0515cec7265848_106_1.png)'
  - '[PAGE 107]


    a young maiden and ordered me, ''Kill her!'' I sprang upon her and tore into her
    flesh with my fangs.''


    Harold had scarcely finished telling his dream when Alfred walked in the room.
    Yseult told Alfred of her desire to go to the sacred grove and of Harold''s dream.


    ''Those fears are childish,'' cried Alfred boastfully. ''I will accompany you
    to the feast with my men, and you will have no need to be afraid.''


    Harold saw that he could not deny Yseult her wish, so he fetched old Siegfried''s
    spear and gave it to her, saying, ''Take this spear with you. Farewell, oh my
    beloved. How you will love me when you know of my sacrifice. Farewell forever.''
    And with that Harold went off to Normandy, leaving Yseult in wonder.


    The next night Yseult set off with Alfred, his men, and Siegfried''s spear. The
    feast was very lively. There was singing and dancing and great merriment.


    But suddenly the music stopped and the terrible figure of the werewolf appeared.


    He eyes were fixed on Yseult.

    He ran to attack her and all Alfred''s men fled in fear. Only Alfred remained,
    hurling his lance straight


    ![](img/924655fb7a904241de0515cec7265848_107_0.png)'
  - '[PAGE 108]


    at the beast. The weapon broke into pieces as soon as it touched the werewolf.
    It was useless.


    The werewolf crouched in wait for a moment, and Yseult fearlessly raised the spear
    that Harold had given her and threw it at the werewolf. As the spear flew through
    the air the werewolf gave a cry of human agony, and for an instant, Yseult saw
    something familiar in his eyes. Then the spear pierced the creature''s chest just
    above the heart, and the werewolf fell dead.


    There was great joy at Yseult''s brave deed, but she had no wish to celebrate.
    She sent for Harold right away, giving orders that no one should rest until he
    was found. A man appeared who said he had seen Harold going into his house that
    very evening, Yseult, Alfried, and the other guests rushed to his home.


    Entering his bedroom, they saw Harold lying on his bed. "He sleeps," said one.
    "See, he holds Yseult''s portrait in his hand." But Harold was not asleep.


    His face was calm and handsome, but his clothes were red with the blood that came
    from a wound in his chest—a gaping, ghastly spear wound just above his heart.

    The werewolf lay dead.


    ![](img/924655fb7a904241de0515cec7265848_108_0.png)'
  - '[PAGE 109]


    # B House...in Camden-Hill


    Mr. and Mrs. B lived without any troubles or strange occurrences in their house
    in Camden-Hill. It was a fairly large house and had enough rooms for the couple
    to rent out some of them. With this aim, they hired a businessman who worked on
    turning their home into a boardinghouse that would bring in some extra money.


    They rented their rooms at reasonable prices, and their tenants were civil servants
    and employees who earned modest salaries. The business did quite well. But one
    day a lodger named Mr. Rose abruptly told Mr. and Mrs. B that he was leaving his
    room because it was “bewititched.” It was a pleasant, airy room that looked out
    onto the garden. The couple found what the lodger said very peculiar. Since they
    had never slept in the room, they wished to find out for themselves whether or
    not their lodger''s complaint had any truth to it.


    From the very first they had to admit that Mr. Rose had not been lying. The night
    of the experiment the couple awoke between one and two in the morning to a


    ![](img/924655fb7a904241de0515cec7265848_109_0.png)'
- md: '

    peculiar scratching noise. It sounded like a very large cat clawing the wood floor.
    The scratching grew louder and seemed alarmingly close, then grew weaker and more
    distant until it finally stopped, as if the mysterious perpetrator of the noise
    had moved close to the bed and then further away.


    The strangeness of this experience left Mr. and Mrs. B bewildered, and the worry
    they felt would not let them go back to sleep until four o''clock in the morning.
    But thereafter they awoke again with another start to find someone, or something,
    had yanked the bedspread and sheets off the bed while they had slept. Mrs. B lit
    a lamp, but they saw nothing unusual, except that their bedcovers had disappeared.
    Shocked, they rushed out of the room and spent the rest of the night in their
    own bedroom.


    The following morning, they went back to Mrs. Rose''s room and found the bedspread
    and sheets rolled up in a bundle on the bed. The bedspread was only tangled up
    in a ball, but the sheets were completely ripped and shredded. Mrs. B refused
    to spend another night in that haunted room. Mr. B, on the other hand, stubbornly
    insisted on spending another night there to try and solve the mystery.


    That evening, Mr. B went to asleep, leaving the lamp still lit. Just as he began
    to fall asleep, he heard the same noise as the night before. He sat up and saw
    in front of him a sorrowful, ragged old man, looking at him with an expression
    of scorn. On his head he wore a peculiar cap made of cat skin, and his fleshless,
    bony hands had extremely long, sharp nails like those of a feline. In spite of
    his terror, Mr. B succeeded in speaking.


    > “What are you doing here?” he demanded. “What do you want?”


    Instead of answering, the old man began to howl fiercely, like a cat to attack,
    and then he started ripping up the sheets with his claws. While he was shredding
    the sheets, Mr. B picked up a cane beside the bed and tried to hit the intruder,
    but the cane went right through the fierce old man as if he were not made of flesh
    and bones


    ![](img/924655fb7a904241de0515cec7265848_110_0.png)


    at all. The ghostly creature drew back, meowing like a cat, and disappeared through
    the wall without a day.


    The following day, convinced that something truly supernatural was going on in
    that room. Mr. and Mrs. B decided to lock it up forever and continue renting the
    other rooms in the house.


    Years later, at a family gathering, the couple spoke of the strange events to
    a cousin, a sailor from Kingston, who had come to visit. Prompted by curiosity
    and a desire to help his relatives solve the mystery, the sailor asked them to
    let him spend the night in the bewitched room. He was a bold, strong man, known
    for his good judgment. Thus Mr. and Mrs. B agreed to open up the room. The sailor
    locked himself in. Brave as he was, and because he did not believe in ghosts,
    he asleep at once.


    A strong movement of the bed woke him up suddenly. The ghost with the cat-skin
    hat was staring at him spitefully from the foot of the bed. The sailor began to
    get up to go after him, but the cat-man retreated, meowed furiously, and disappeared
    through the walls. Moments later blows of great violence were heard, as if someone
    within the walls of the room was beating against them. An enormous piece of plaster
    fell from the ceiling.


    The cousin came out unhurt, but no one ever went into that bewitched room again.
    Mr. and Mrs. B moved away and went to live in another town. The phantom cat-man
    was never seen again.


    ![](img/924655fb7a904241de0515cec7265848_111_0.png)


    ![](img/924655fb7a904241de0515cec7265848_112_0.png)


