    # Robert Louis Stevenson


    ## The Body Snatcher


    Every night at a small inn, a few friends and I would gather to have drinks. One
    night the landlord mentioned that a rich man had fallen ill at the inn and had
    sent for a famous doctor from London.


    Fettes, an old drunken Scotsman who never missed his nights together, suddenly
    became angry when he saw the doctor about to leave the inn.


    “McFarlane! Toddy McFarlane!” he shouted, giving the doctor a scornful look.


    The London man almost staggered when he saw Fettes, glanced behind him fearfully,
    and then in a startled voice exclaimed, “Fettes! You!”


    “Yes, me. Did you think I was dead, too?”


    “Hush, hush!” exclaimed the doctor. “This meeting is so unexpected.” The great
    doctor regained his calm and tried to make a few friendly remarks. Fettes interrupted
    him rudely.


    “Have you seen him again?” he demanded.


    At those words, the celebrated doctor cried out with a sharp, horrible wail and,
    with his hands over his head, fled through the door like a thief.


    Following this strange, unsettling scene, all of us wanted to know what had happened
    between the doctor and Fettes.


    It turned out that in his youth Fettes had studied medicine in Edinburgh. He had
    some talent and a famous anatomy professor, who I shall here call Mr. K, made
    him his number two assistant. Toddy McFarlane was his number one.


    ![](img/924655fb7a904241de0515cec7265848_31_0.png)


    One of Fettes'' duties was to receive the dead bodies that were used for dissection
    in Mr. K''s classes. Having enough corpses for the students was a constant problem.
    Every night sinister men arrived at the laboratory with fresh corpses. Mr. K had
    given Fettes instructions to pay the men right away and ask no questions.


    Fettes asked himself a lot of questions. Was it right to keep silent about this
    kind of activity? Was he correct in suspecting that some of the bodies were victims
    of murder? He overcame his doubts until one night when McFarland himself knocked
    at the door, carrying a corpse who Fettes recognized as being a man called Gray.
    Just the evening before, Fettes and McFarland had been at a tavern with Gray.
    Gray had treated McFarland with great contempt and rudeness.


    After McFarland came into the laboratory with Gray''s body, he ordered, "Pay me
    and register the corpse in the book."


    "I''ve always wondered if these corpses had been murdered." Fettes replied, "and
    now I have proof."


    "Very clever, Fettes! And you will continue to be clever if you keep your mouth
    shut. Dr. K would not be very pleased if his prize students get him into trouble
    with the law. You can''t stop now; you''re involved. Besides, three days from
    now you''ll be laughing at your fears."


    McFarland departed and left Fettes alone with his regrets. If he told the truth
    now, he would get himself into trouble as accomplice in handling the corpses.
    All he had to do was stay silent. Fettes would have given the world to have been
    a little braver, but he wasn''t. So Gray ended up just like all the other bodies,
    and Fettes kept quiet.


    McFarland proved right. Before the week was over,


    ![](img/924655fb7a904241de0515cec7265848_32_0.png)


    Some time later there was a crisis. There weren''t enough bodies for Dr. K''s
    classes. Fettes and McFarlane received the order to go to a country cemetery where
    they were to take the recently buried body of a farmer''s wife from her grave.
    They used a lantern to light up their gruesome work, until they thought it safer
    to put the light out. They continued digging in the dark. Eventually they got
    the corpse, which they wrapped in a sack, into their carriage. Their return journey
    was nightmarish. Pouring rain soaked them, and they traveled without any light.
    The body bounced at every bump, and soon the sacking was so wet that the outline
    of the corpse could be seen. It looked larger than it had been and not like the
    body of a woman. Fettes and McFarlane decided to stop, light the lantern, and
    open the sack. Their horror was beyond words—it was the lifeless body of Gray!


    Shocked, they leaped from the carriage. It went on carrying its only passenger—the
    corpse of the long dead and dissected Gray.


