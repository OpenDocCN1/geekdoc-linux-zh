    # William Hope Hodgson


    # # A Tropical Horror


    After three weeks of calm seas we find ourselves a hundred and thirty days from
    Melbourne, Australia. While I am waiting to take my night watch, I sit down to
    chat with Jody, the cabin boy. He talks for a long time, and suddenly I see panic
    in his eyes. I look, too, and my face contorts with horror. Rising over the side
    of the boat is a creature with an immense open mouth that sweeps toward us, like
    a tidal wave. The wide lips tentacles appear, and we cannot see the beast''s eyes—only
    that huge mouth. It climbs aboard the boat, shaking it horribly. It is an enormous
    pale monster that crouches on the deck with a hostile look. Then it moves swiftly
    to the barrels that hold our food. It smells them and smashes the ones that hold
    the salt pork. Even in the darkness I can see its sharp fangs, ten times bigger
    than a tiger''s.


    One of the sailors has come up on deck, roused by the noise, and right away I
    hear a horrible shriek. Disgusting sounds come from the mouth of the beast as
    it devours him. Hysteria reigns on deck while everyone rushes madly for the cabins
    below. I see that Jody has fainted. The only place close by where we can take
    refuge is the penthouse—the place on deck where the ship''s controls are kept.
    I pick Jody up in my arms, and the beast moves its head to look at us. I rush
    toward the open door as the monster makes ready to attack us. I fall through the
    door and manage to close it behind me. At that very instant the


