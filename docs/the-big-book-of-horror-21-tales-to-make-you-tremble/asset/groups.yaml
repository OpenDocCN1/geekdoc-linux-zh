    # Part I

    Death

    Death—and what lies after it—are the biggest mysteries of all. The end of life
    still baffles us despite scientific achievements over the centuries. There is
    no better seed for a scary story than how humans lose their lives, or how the
    dead might come back to the living.


    In tales of horror, violent deaths often intrude upon the daily lives of characters
    through visitations by ghosts, the living dead, vampires, and other creatures
    from the grave. Some of the usual settings are cemeteries, morgues, and tombs.


    In this section, you will find tales of ghosts that give warnings, demons that
    bewitch the unsuspecting, vampires that haunt the living, and grisly murders with
    unexpected outcomes.


    Let yourself wander through the grim labyrinths of these stories full of chilling
    suspense, intrigue, and untimely deaths.


    # The Signalman

    "Halloa! Below there!"


    When he heard my voice the train signalman turned his head quickly, as if startled.
    Instead of looking up to where I stood on an embankment, he looked down the train
    tracks, toward the red light near the tunnel entrance. There was something strange
    about his behavior.


    "Halloa! You, below!" I repeated. This time, raising his eyes, he saw my figure
    high above him. He stared hard at me without replying.


    "Is there any path by which I can come down and speak to you?"


    I had almost reached the bottom when I glanced again the signalman. Even from
    that distance, the way he stood, and the expression of alarm on his face, seemed
    to suggest that my arrival filled him with fear.


    When I was almost close enough to reach out and touch him, he took a step backward.


    "You look at me," I said, forcing a smile, "as if you dreaded me."


    "I wasn''t sure if I had seen you before,"


    "Me? Where?" I asked, surprised.


    "There," he said, pointing at the red light that he had been staring at earlier.


    "My good fellow, I never was there, swear."

