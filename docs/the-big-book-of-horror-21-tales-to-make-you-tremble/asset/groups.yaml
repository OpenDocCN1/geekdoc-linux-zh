    # The Facts in the Case of M. Valdemar


    It is no wonder that the extraordinary case of M. Valdemar has led to much public
    discussion. Until now we have kept the case secret, thus an exaggerated account
    has made its way into society. It is now necessary that I give the facts.


    I have studied hypnotism for a long time. I wished to learn about a specific aspect
    of this subject: hypnosis in a state close to death. It remained to be seen whether
    in such condition a patient could be hypnotized and whether death itself might
    be stopped by the process.


    In looking for a subject, I thought of my friend M. Ernest Valdemar. The doctors
    had given him three months to live. They had diagnosed tuberculosis. Valdemar
    accepted my proposal to use him for the experiment, and it was arranged that he
    would send him twenty-four hours before the doctors predicted he would die.


    When the moment of his death was approaching, I received a note from Valdemar.
    Soon I was in the dying man''s chamber. His face was leaden, and he was so skeletal
    that his cheekbones had broken through his skin. His pulse barely registered.


    I put off the beginning


    ![](img/924655fb7a904241de0515cec7265848_79_0.png)'
  - '[PAGE 80]


    of the experiment until the next day. It was the opinion of the doctors that he
    would die about midnight. I arrived at eight in the evening and the session began.
    A medical student took notes.


    First I asked Valdemar to state that he was willing to be hypnotized in his condition.
    In a voice that was feeble but clear, he said, "Yes. Though I fear it is too late."


    The session began with the techniques of hypnosis that I had already used successfully
    with him on other occasions, but it was not until ten o''clock that my efforts
    began to work. Around eleven I perceived definite signs of hypnosis. The glassy
    look in his eyes disappeared, and I was able to close his lids. His body went
    stiff, and he soon fell into a deep sleep. I confirmed that he was still breathing
    by putting a mirror to his lips. And with the patient in this state of calm, midnight,
