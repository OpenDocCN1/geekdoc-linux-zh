    # The Murders in the Rue Morgue


    ""Solving mysteries requires imagination. It is not enough to have a talent for
    simple calculation. It is important to have the ability to analyze, pay such careful
    attention to the smallest detail that the truth becomes untangled.


    One morning my friend, Monsieur Auguste Dupin, and I were reading through a Paris
    newspaper when we came upon a striking headline: EXTRAORDINARY MURDERS.


    The article described how the previous night the bodies of a Madame L''Espanave
    and her daughter, Mademoiselle Camille, had been found in their home in the Rue
    Morgue. According to the article, the neighbors were awakened by terrible shrieks
    coming from the fourth floor. Aided by two policemen, the neighbors were able
    to break down the door to the building. The screaming stopped as they rushed upstairs.
    Then the neighbors heard two angry voices, which fell silent before they reached
    the fourth-floor apartment. When they entered, they found an astounding sight.


    The room was in wild disorder—furniture was broken and scattered about, including
    a mattress thrown onto the floor. Near the fireplace there were bloodains and
    tufts of gray human hair pulled out by the roots. A bloody razor rested on a chair,
    and two bags of gold coins were open on the ground. When the search began, the
    body of the daughter, Camille, was found. The discovery was truly'
  - '[PAGE 26]


    # The Gazette


    horrifying—her body had been jammed into the chimney. The face of the young woman
    was scratched. Upon her throat were marks of fingernails: She had apparently been
    strangled to death.


    The mother''s corpse was later found in the backyard. Her throat had been brutally
    cut. The newspaper pointed out that no motive had been discovered for this terrible
    bloodshed. The police were completely mystified.


    The next day new details of the event were published. The headline read: THE TRAGEDY
    IN THE RUE MORGUE.


    The newspaper cited the statements of the witnesses. Most of the witnesses were
    neighbors who had participated in the discovery of the murders. All of them explained
    that the deceased mother and daughter had been very solitary, receiving few visitors.
    A laundress stated that the mother and daughter seemed to get along with each
    other and gave the mother her good pay for her services. They had lived peacefully
    in the house for over six years.


    Of the two voices heard shouting the night of the murder, one was described as
    gruff and the other as shrill. All of the witnesses were certain that the gruff
    voice spoke in French, perhaps with a foreign accent, and a few heard the voice
    exclaimed "My God! As for the shrill voice, no one had understood a word it said.
    Some claimed it was speaking Spanish, while others thought the language had been
    Italian, German, or Russian. However, none of the witnesses could be sure because
    neither spoke nor understood these languages.


    Statements were also taken from the ladies'' banker and the bank''s clerk. The
    banker''s statement was of particular interest. Madame L''Espanaye had withdrawn
    four thousand gold francs three days before her death.'
  - '[PAGE 27]


    The clerk reported that he had brought the bags to her home. When he arrived there,
    the daughter had helped her mother carry the bags of money upstairs.


    My friend Dupin was greatly interested in the matter. I realized that he made
    no comment about the murders because he was silently analyzing the facts, turning
    them over in his mind, and letting his imagination work out the details of the
    case. When we read that the bank clerk had been arrested, Dupin finally spoke
    out.


    “We will make nothing of this mystery by simply reading a few statements by witnesses.
    It would be an interesting pastime for both of us to do our part to clear up these
    murders. I have a certain friendship with the chief of police, and he will permit
    us to have a look at the scene of the crime.”


    When Dupin received authorization from the police chief, we set out for the Rue
    Morgue. Before we went up to the fourth floor, Dupin wished to take a look at
    the outside of the building.


    First we walked around to the back of the block, and then we examined the front
    of the building, from top to bottom. The two policemen at the door let us pass
    when we showed our permit. We climbed the stairs and went into the fourth-floor
    apartment. Both of the bodies were still there.


