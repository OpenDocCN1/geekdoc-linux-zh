- "# Bash 脚本编程：bash Shell 入门指南\n\n\n\n![](img/Image00000.jpg)\n\n\n\n\n\n\n\n## 介绍\n\
  Shell 是一个程序，用于接收你的命令并请求内核执行这些命令。它充当你与操作系统之间的中介；换句话说，它代表了系统的外层或接口。它接收你的指令并给你结果。然后它再次显示提示符，表示执行结束并等待你输入更多命令。这就是为什么\
  \ Shell 被称为命令解释器，类似于 Windows 中的 `command.com`。它还包含一种类似于高级语言的编程语言，并且非常强大，通过它可以解决你面临的任何问题。它的重要特性之一是可以创建一个包含一组程序的文件来创建另一个程序，这让你能够生成所谓的“脚本”。有很多类型的\
  \ Shell，但最著名和常用的是：\n- Bourne shell 包括 `sh`、`ksh`、`bash`。\n- C shell 包括 `csh`、`tcsh`。\n\
  如果你使用的是 Bourne shell，作为用户的用户的默认提示符是 `$`。\n\n## 什么是 Shell 提示符？\n提示符（无论是 `%` 还是 `$`）取决于你正在使用的\
  \ Shell 类型。当提示符出现时，意味着 Shell 正在等待你输入要执行的命令。如果你以任何系统管理员 `root` 的身份登录系统，提示符将会出现。\n\
  \n## 进程何时开始和结束？\n当你登录系统时，它从要求你输入用户名和密码开始，然后将其传递给登录程序以检查输入的数据。看起来像这样：\n```bash\n\
  username: \npassword: \n```\n在匹配的情况下，文件进程将执行，在此例中：\n```bash\n/bin/bash\n```\n当你退出时，Shell\
  \ 结束工作。通过输入命令可以更改进程类型：\n```bash\nexit\n```\n\n## 命令\n命令是一个你可以通过输入其名称并按回车来运行的程序。例如：`date`\
  \ 命令显示天、日期和小时。另一个例子是 `who` 命令，它显示该系统中所有用户的名称。\n\n### 简单命令\n从它的名字可以清楚地看出它是简单的，只包含程序名称，例如\
  \ `date` 和 `who`。\n\n### 复杂命令\n简单的程序名加上一个或多个参数。在 Bash 脚本的上下文中，我们正在告诉 `bash` Shell\
  \ 它应该做什么。一个 `bash` 脚本是一个纯文本文件，包含一系列命令。这些命令是我们通常会在命令行中自己输入的命令（如 `ls` 或 `cp`）。\n\n\
  ### 复合命令\n这些是组合了简单命令和复杂命令。它们通过分号 `;` 隔开。\n示例：\n```bash\ndate; who\n```\n\n## 什么是\
  \ Shell 脚本？\nShell 脚本是一个带有特定目的命令的文件。要创建脚本，创建一个扩展名为 `.sh` 的文本文件，例如 `myscript.sh`。要使文件可执行，使用\
  \ `chmod` 命令：\n```bash\nchmod +x myscript.sh\n```\n你就可以通过它的名称运行它。为了确保使用正确的 Shell，在脚本开头添加此行：\n\
  ```bash\n#!/bin/bash\n```\n\n# 第一章\n### 创建并运行 Bash 程序\n### 编写与命名\n变量名对大小写敏感；默认全大写，但局部变量可以使用小写命名。变量名不能与数字开头。要设置变量的值，使用：\n\
  ```bash\nVAR=\"value\"\n```\n注意，不要在引号周围留空格，否则会导致错误。要使用变量，使用 `$`：\n```bash\necho\
  \ $VAR\n```\n\n# 第二章\n### Bash 环境\nBash 环境可以在系统级整体设置，也可以为每个用户单独设置。配置文件用于控制 Shell\
  \ 的行为。\n\n### 算术表达式\nBash 允许将算术表达式作为 Shell 扩展之一进行求值，或者通过使用 `let` 命令。\n示例：\n```bash\n\
  let count=1 + 1\necho $count\n```\n\n"
