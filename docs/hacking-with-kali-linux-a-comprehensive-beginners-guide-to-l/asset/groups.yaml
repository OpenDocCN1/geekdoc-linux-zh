    \n### 级别 1：加密\n\n加密技术会对网络上的数据和通信进行 scrambling（扰乱/加密处理），这使得你的信息对于试图黑客入侵系统的人不可读。这些加密技术以密码或口令短语的形式出现，在允许连接到私有网络之前，你需要输入这些内容。WEP/WPA\
