    \ 57% 的人会打开来自他们不认识的地址的电子邮件。\n\n McAfee 在另一项研究中，最近公布了一份其认为明年主要在线威胁的列表。在提及的风险中，它提到了作为公司目标员工的“门户”绕过安全防线，以及旨在窃取银行信息的高级病毒。这些与\
    \ Eurobarometer 民调的结果相结合，对欧洲公民构成了令人担忧的风险。如果受访者意识到了互联网固有的危险，但却没有采取保护措施，那么可能的原因只有少数几种。首先，他们不感到受到网络犯罪的威胁；然而，鉴于有\
