    # 第 6 章


    ## 如何入侵无线网络


    ### 如何入侵 WiFi（无线）网络


    无线设备在路由器的传输半径内对任何人都是可访问的。这使得它们容易受到攻击。机场、餐厅、公园等公共场所都有热点网络。


    在本教程中，我们将向您介绍用于利用无线网络安全实现中弱点的常规技术。我们还将查看您可以采取的一些对策，以保护免受此类攻击。


    ### 什么是无线网络？


    无线网络是使用无线电波将计算机和其他设备连接在一起的计算机网络。其实施是在 OSI 模型的第 1 层（物理层）完成的。


    ### 如何访问无线网络？


    您需要一个支持无线网络的设备，例如笔记本电脑、平板电脑、智能手机等。您还需要位于无线网络接入点的传输半径内。大多数设备（如果打开无线网络选项）都会为您提供可用网络列表。如果系统没有密码保护，则必须点击连接。如果它受密码保护，则需要密码才能获取访问权限。


    ### 无线网络身份验证


    由于任何拥有无线设备的用户都可以轻松访问网络，因此大多数系统都受密码保护。让我们看看一些最常用的身份验证技术。


    #### WEP


    WEP 是 Wired Equivalent Privacy（有线等效隐私）的缩写。它是为 IEEE 802.11 WLAN 标准开发的。其目标是为提供与有线网络相当的隐私保护。WEP
    通过加密在网络上传输的数据来防止窃听，从而保持数据的安全。


    #### WEP 身份验证


    - **开放系统身份验证 (OSA)** – 此方法根据配置的访问策略，授予请求站点身份验证的访问权限。

    - **共享密钥身份验证 (SKA)** – 此方法向请求访问的站点发送加密挑战。站点使用其密钥对问题（挑战）进行加密，然后响应。如果加密后的挑战与 AP
    的值匹配，则授予访问权限。


    #### WEP 弱点


    WEP 存在重大的设计缺陷和漏洞。


    - 使用循环冗余校验 (CRC32) 检查数据包的完整性。通过捕获至少两个数据包，CRC32 完整性检查可以被破坏。攻击者可以修改加密流中的位和校验和，以使身份验证系统接受该数据包。这将导致未经授权的访问网络。

    - WEP 使用 RC4 加密算法来创建流密码。流密码的输入由初始向量 (IV) 和密钥组成。初始向量 (IV) 的长度为 24 位，而密钥可以是 40 位或
    104 位长。初始向量和密钥的总长度可以是 64 位或 128 位。密钥可能的较低值使其容易破解。

    - 弱初始向量组合无法充分加密。这使得它们容易受到攻击。

    - WEP 基于密码；这使其容易受到字典攻击。

    - 密钥管理实现不佳。更改密钥，特别是在大型网络上，具有挑战性。WEP 不提供集中式密钥管理系统。

    - 初始向量可以被重用。


    由于这些安全缺陷，WEP 已被弃用，转而使用 WPA。


    #### WPA


    WPA 是 Wi-Fi Protected Access（Wi-Fi 保护访问）的缩写。它是 Wi-Fi 联盟针对 WEP 中发现的弱点开发的一种安全协议。它用于加密
    802.11 WLAN 上的数据。它使用更高的初始向量 48 位，而 WEP 使用的是 24 位。它使用临时密钥来加密数据包。


    #### WPA 弱点


    - 碰撞避免实现可以被破坏。

    - 容易受到拒绝服务攻击。

    - 预共享密钥使用密码短语。弱密码短语容易受到字典攻击。


    #### 如何破解无线网络


    ##### WEP 破解


    破解是利用无线网络中的安全弱点并获取未经授权访问的过程。WEP 破解指的是对使用 WEP 实现安全控制的系统进行攻击。有两种类型的破解，即：


    - **被动破解** – 这种类型的破解在破解 WEP 安全之前不会影响网络流量。它很难被检测。

    - **主动破解** – 这种类型的攻击会增加网络流量的负载效应。与被动破解相比，它更容易被检测。与被动破解相比，它更有效。


    ##### WEP 破解工具


    - **Aircrack** – 网络嗅探器和 WEP 破解器。可以从... 下载（原文此处链接缺失或隐含）

    - **WEPCrack** – 这是一个开源程序，用于破解 802.11 WEP 密钥。它是 FMS 攻击的一种实现。

    - **Kismet** – 这可以包括无线检测器网络，无论是可见还是隐藏的，嗅探数据包，并检测入侵。

    - **WebDecrypt** – 此工具使用主动字典攻击来破解 WEP 密钥。它有自己的密钥生成器并实现了数据包过滤器。


    ##### WPA 破解


    WPA 使用 256 位预共享密钥或密码短语进行身份验证。短密码短语容易受到字典攻击和其他可用于破解密码的攻击。以下工具可用于破解 WPA 密钥。


    - **CowPatty** – 此工具用于通过暴力破解攻击来破解预共享密钥 (PSK)。

    - **Cain & Abel** – 此工具可用于解码来自其他嗅探程序（如 Wireshark）的捕获文件。捕获文件可能包含 WEP 或 WPA-PSK
    编码的帧。


    ##### 通用攻击类型


    - **嗅探** – 这涉及在数据包通过网络传输时拦截它们。捕获的数据随后可以使用诸如 Cain & Abel 等工具进行解码。

    - **中间人 (MITM) 攻击** – 这涉及在网络上窃听并捕获敏感信息。

    - **拒绝服务攻击** – 此攻击的主要意图是拒绝合法用户访问网络资源。FataJack 可用于执行此类型的攻击。


    ##### 破解无线网络 WEP/WPA 密钥


    有可能破解用于访问无线网络的 WEP/WPA 密钥。这样做需要软件、硬件资源和耐心。此类攻击的成功也可能取决于目标网络中用户活跃和不活跃的程度。


    我们将为您提供有助于入门的基本信息。Backtrack 可用于收集信息、评估漏洞和执行利用等。


    一些 Backtrack 包含的流行工具有：


    - Metasploit

    - Wireshark

    - Aircrack-ng

    - Nmap

    - Ophcrack


