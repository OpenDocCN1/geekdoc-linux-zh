    # CHAPTER 5


    # WHAT ARE VPN, TOR AND PROXY CHAINS AND HOW TO USE THEM FOR SECURITY


    What is a VPN?


    VPN stands for the virtual private network and is commonly used by organizations
    to provide remote access to a secure organizational system. For instance, you
    are working from home, and you need to access files in your computer at the office
    or connect to applications that are available only via your office network. If
    your office has VPN installed and your laptop or home computer is configured to
    connect to it, you can get what you need from the office without having to worry
    about the security of the data transported over the Internet.


    VPNs are also used to mask the IP address of individual computers within the Internet.
    These allow people to surf the Internet anonymously or access location-restricted
    services such as Internet television.


    Ordinary users would most likely be using a VPN in the second scenario. There
    are several VPN services offered over the Internet. For simple anonymous surfing,
    you can find a service as cheap as $5/month or even for free !


    But to get the total anonymizing experience, a premium VPN account is advisable.
    Most providers make this as easy as possible for prospective subscribers - no
    IP numbers to configure into web applications, no software to install, easy to
    follow instructions on how to set up the VPN, etc.


    That said, before subscribing to a VPN service, decide how you are going to use
    it: Is it merely for browsing web site content? Download torrents? Watch Internet
    television? Each provider has its terms and conditions for service, and some will
    include restrictions against "illegal" activities such as P2P file-sharing of
    intellectual property. It is best to look for and read the fine print before committing
    to anything.


    Another tip is to look for providers who offer a trial period for prospective
    subscribers. These indicate that the provider has confidence in their'
  - '[PAGE 45]


    product, and you will be able to judge if the service works for you. Check the
    Internet speed: Is the rate reliable, or are there certain times of the day when
    browsing or downloading is inconvenient? Assess the timeliness and quality of
    their technical support: How long before they respond to questions or help requests?
    How well do they understand your concerns, and were they able to help? Bottom
    line: Is the service worth the cost ?


    Online forums are good sources of feedback on particular VPN service providers.
    Customer testimonials are well and good, but then you hardly read anything negative
    in those. With online forums, if you read much negative feedback on a provider
    from different people, that may be a sign that you shouldn''t do business with
    that provider. In any case, you should try to get as much information as possible
    before subscribing.


