    But it does have its downsides. Here are the main cons of using Tor:

    - Slow speeds

    - Detectable by ISPs

    - Blocked by network administrators

    - Vulnerable to attacks


    Let’s look at each of these in a bit more detail.


    ### Slow speeds


    The major downside to using Tor is that it is quiet. Traffic isn’t going directly
    to its destination, so this will slow things down. Plus, the speed of traffic
    flowing between the nodes could be slower than your regular internet connection,
    further dampening the overall momentum.


    What’s more, the number of volunteer nodes available is minimal compared to the
    amount of traffic flowing through the network. The resulting congestion will slow
    down traffic, especially during peak periods.


    Due to these issues, the primary use of Tor is general browsing. It isn''t suitable
    for streaming or torrenting, or anything else that requires much bandwidth.


    ### Detectable by ISPs


    Another downside is that your ISP will be able to see that you''re using Tor.
    It won''t be able to read the contents of your traffic, but the fact that it detects
    you''re using Tor could have some repercussions. As mentioned earlier, using Tor
    alone is enough to raise suspicion from ISPs and authorities. One way around this
    is to use a VPN with Tor (more on that below).


    ### Blocked by network administrators


    Administrators of individual networks often block tor. One way around this is
    to use bridges that shouldn''t be detectable as Tor nodes. If the blockage is
    more sophisticated and uses deep packet inspection, you may need to use an additional
    tool, such as Pluggable Transports (see below). These will mask your Tor traffic
    as regular traffic to bypass the block.


    ### Vulnerable to attacks


    While it hasn''t been confirmed, there have been reports that traffic analysis
    on Tor has been successfully used to find incriminating evidence. One case that
    stands out is the Silk Road takedown of 2013. Silk Road was a marketplace run
    through the Tor network and was involved in the sale of an estimated $1 billion
    worth of drugs, along with other illicit goods and services.


    There are also the rumors mentioned above about exit node monitoring to be wary
    of. Bear in mind that these reports don''t appear to have been confirmed so that
    they can be viewed with skepticism.


    ## How to protect your privacy online with Tor Browser


    If you want to keep your web browsing private, you can use the Incognito mode
    in Chrome, Private Browsing in Firefox, InPrivate mode in Microsoft Edge, and
    so on. While this will prevent other people who use your computer from seeing
    your browsing history, it doesn''t restrict your ISP from monitoring the sites
    you are visiting. You might well want to for any number of reasons – browse the
    internet completely anonymously, and this is precisely what Tor Browser offers.


    Standing for The Onion Router, Tor offers multiple levels of protection to ensure
    that your online activities, location, and identity are kept entirely private.
    Here are the steps you need to follow to install and use Tor Browser.


    ### 1. Install and configure Tor Browser


    Start by downloading and installing the Tor Browser. Click Finish once the installation
    is complete, and Tor will launch for the first time. You''ll be greeted by a settings
    dialog that is used to control how you connect to the Tor network.


    In most cases, you should be able to click the Connect button, but if you connect
    to the internet through a proxy, you will need to click the Configure button to
    enter your settings.


    ### 2. Get online with Tor


    There will be a slight delay while Tor establishes a connection to the network
    via relays – the program warns that the initial link could take as long as several
    minutes – but once this connection has been made, the Tor browser will launch
    ready for use.


    Tor is based on the same code as Firefox, so if you have used Mozilla''s web browser,
    everything should seem reasonably familiar. Even if you haven''t used Firefox
    before, it should not take you long before you start to feel at home – it''s not
    so different from the likes of Edge, Chrome, and Safari.


    ### 3. Choose your security level


    Before you get started, it''s worth noting that using Tor Browser is a balancing
    act between privacy/security and web usability. By default, security is set to
    Standard – although this is still far more secure than any other web browser.


    If you would like to increase this, click the onion icon to the left of the address
    bar and select Security Settings. Use the Security Level slider to choose your
    preferred level of protection, bearing in mind the warnings that appear about
    the features that may stop working on the sites you visit.


    ### 4. Rethink your browsing habits


    To get the most from Tor, you need to change a few of your browsing habits – the
    first of these is the search engine you use.


    Rather than opting for the likes of Google and Bing, the recommendation is that
    you instead turn to Disconnect.me. This is a site that prevents search engines
    from tracking you online, and you can use it in conjunction with Bing, Yahoo,
    or DuckDuckGo.


    While we''re on the subject of changing habits, you also need to avoid installing
    browser extensions, as these can leak private information.


    ### 5. Understand Tor circuits


    As you browse the internet, the Tor browser helps to keep you secure by avoiding
    direct connecting to websites. Instead, your connection is bounced around between
    multiple nodes on the Tor network, with each jump featuring anonymizing.


    This not only makes it all but impossible for a website to track who and where
    you are, it is also responsible for the slightly slow performance you will notice
    while browsing with Tor.


    If you feel performance is unusually low or a page is no longer responding, you
    can start a new Tor circuit by clicking the hamburger icon and selecting the ''New
    Tor Circuit for this Site'' option, which will force Tor to find a new route to
    the site.


    ### 6. Create a new identity


    The new circuit option only applies to the currently active tab, and it may be
    that you want a more drastic privacy safety net. Click the hamburger icon and
    select ''New Identity,'' bearing in mind that this will close and restart Tor
    to obtain a new IP address.


    When you connect to a site using Tor, you may notice that a pop-up appears warning
    you that a particular site is trying to do something that could potentially be
    used to track you. Just how often these messages appear will depend not only on
    the websites you visit but also on the privacy settings you have in place.


    ### 7. Use HTTPS


    An essential part of staying safe and anonymous online is ensuring that you use
    the HTTPS rather than HTTP versions of websites. So you don''t have to remember
    to do this for every site you visit, Tor Browser comes with the HTTPS Everywhere
    extension installed by default. This will try to redirect you to the secure version
    of any website if it is available, but you should keep an eye on the address bar
    as an extra safeguard.


    If you are connected to a secure site, you will see a green padlock icon. If this
    isn''t present, click the ''i'' icon for more information.


    ### 8. Access .onion sites


    The most secure way to connect to the internet through Tor, however, is to visit
    .onion sites. These are also known as hidden Tor services, and they are inaccessible
    to search engines; to find them, you have to visit them directly.


    These sites can only be accessed using Tor, but you do need to take care -- it''s
    quite common to come across sites with illegal content, selling illegal products,
    or promoting illegal activities.


    ### 9. Try Tor over VPN


    If you want to take your privacy to the next level, you can connect to a VPN before
    starting the Tor browser. The VPN will not be able to see what you''re doing in
    the Tor browser, and you''ll get the added benefit that no Tor node will be able
    to see your IP address. It will also prevent your network operators from even
    knowing that you are using Tor, which is helpful if the Tor Network happens to
    be blocked where you are.


