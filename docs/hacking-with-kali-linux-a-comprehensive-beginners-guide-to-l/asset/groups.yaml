    设置 VPN 是一个相当直接的过程。通常，你只需要一个用户名和服务器地址。一些智能手机占据主导地位，它们可以使用 PPTP 以及 L2TP/IPsec 协议来配置
    VPN。所有主要的操作系统也可以设置 PPTP 类型的 VPN 连接。获取一个 VPN 可能是你为你的企业能做的最好的事。通常，随着时间推移，协议数量和所提供的功能都会增长。你可以根据需求选择所需的
    VPN 类型。


    ## VPN 的工作原理


    随着我们中越来越多的人在移动中工作，从家中或携带个人设备到办公室，日益重要的是要拥抱 VPN 背后的技术，这些技术允许我们“远程接入”办公室网络，赋予我们利用这些灵活工作方式的优势。以下文章提供了关于它们如何工作的简要指南。


    ## 一个简短的定义


    VPN 是 Virtual Private Network（虚拟专用网络）的缩写，是一个涵盖各种技术的术语，这些技术允许用户通过公共网络（在实践中，通常指互联网）从远程位置安全地连接到网络。


    VPN 大致分为两种类型。第一种可以描述为远程访问，允许单个用户或设备通过互联网访问位于另一位置的网络。第二种可以称为站点到站点，涉及将一处的系统连接到另一处的网络。


    VPN 的关键特性在于它们允许不同网络之间的通信保持安全。也就是说，它们允许数据在系统之间传输，而不会被那些无权查看或访问的人看到或访问。为此，VPN 需要
    a) 首先确保正确的人能够访问虚拟网络，并 b) 防止人们在数据通过互联网传输时被拦截。


    VPN 在互联网上创建所谓的“隧道”，信息通过这些隧道传输，从而免受窥探者（也称为嗅探器）的触及。在纯概念上，隧道涉及在数据传输的一端加密信息，然后在另一端进行解码。


    它们通过在互联网上传输加密的数据包，并将发送和接收计算机视为已知设备（具有预定义地址），实际上将二者置于同一个（尽管是断开的）网络中，以此工作。为此，数据包由内部和外部包装组成。外部容器的职责是将内部包装从发送者网络的网关服务器传输到接收者网络的网关服务器，因此只包含关于其往返的网关服务器的信息。如果嗅探器拦截了数据包，他们只能看到这些信息，而看不到外部包装传输的数据，或者它正前往的目标终端计算机/设备，因为这些内容都是加密的。加密的内部数据包包含正在传输的实际数据，并包含有关目标网络上目标计算机地址以及发送网络上发送计算机地址的进一步信息——两者都被分配了
    IP 地址，定义了它们处于同一个虚拟（远程连接）网络中。外部数据包在到达目标网络上的 VPN 服务器时被解密，然后内部包装被路由到正确的目标计算机。


    这类似于在加密的内部数据包通过公共网络传输时在其周围放置一个保护气泡——嗅探器可以看到这个气泡要去哪里，但他们不知道里面有什么。气球只有在到达其目标网络时才能被剥离，而指定的目标计算机只能在该网络上解密其内容。


    有各种技术用于生成和解释这些加密数据包，例如 IPSec（Internet Protocol Security，互联网协议安全）和 TLS（Transport
    Layer Security，传输层安全），以及一些取决于特定 VPN 提供者的专有技术。然而，它们都有相同的目的和目标：允许计算机通过开放的公共网络安全地加入远程网络。


    ## VPN 有多安全？


    谈到互联网安全，用户应当小心。在许多 Wi-Fi 热点中都有恶意方，正等待黑入用户的个人信息。如果未得到适当保护，电子邮件、即时消息和信用卡信息等敏感信息都有被黑客窃取的风险。这时，虚拟专用网络（或称
    VPN）就派上了用场。然而，大多数不了解 VPN 构成的用户可能会质疑其安全性。VPN 可以以反病毒软件和防火墙无法做到的方式保护用户。尽管这些程序可以与
    VPN 配合使用，但它们只保护设备本身。它们并不保护传输到设备或从设备传输出的数据。


    以下是 VPN 在 internet 安全方面可以带来的一些优势：


    - 防止深度包检测


    互联网服务提供商（ISP）以追踪用户在线活动而闻名。ISP 利用这些信息作为检查、限速和优先处理从用户设备发送和接收的数据的手段。这意味着未使用 VPN 连接的用户速度会变慢。当用户使用安全的
    VPN 访问互联网时，他们克服了深度包检测。ISP 无法看到用户的活动。他们只能看到用户正在与 VPN 服务器通信。用户发送和接收的所有信息都是加密且私密的。


    - 放心通过 Wi-Fi 连接


    使用移动设备连接互联网的用户会利用咖啡馆、餐厅、机场、图书馆等地的免费 Wi-Fi 连接。这样做会使用户的信息面临风险。Wi-Fi 连接通常没有安全性。任何人都可以使用。这意味着黑客和其他恶意第三方可以轻松地访问用户的设备。他们窃取未受保护设备上的敏感信息并安装恶意软件。使用
    VPN 可以确保无论用户在哪里连接互联网，其数据都不会受到威胁。


    - 消除数据包嗅探器的威胁


    数据包嗅探器是一种可以合法和非法使用的软件。黑客使用数据包嗅探器窃取用户的个人信息和其他有价值信息。这可能包括即时通讯对话、敏感的信用卡信息和电子邮件。有了
    VPN，数据包嗅探器最初只会看到乱码。它无法解密。


    - 适用于各种设备


    VPN 可用于许多设备，包括台式计算机、笔记本电脑、平板电脑、智能手机，甚至许多无线路由器。在设置 VPN 时，用户可以有多种协议选项可供选择


