    Everything you wanted to know about Tor but was afraid to ask.


    If you’re interested in online privacy, then you’ve no doubt heard about Tor (The
    Onion Router). The Tor Network (or just “Tor”) is an implementation of a program
    that was initially developed by the US Navy in the mid-1990s. It enables users
    greater anonymity online by encrypting internet traffic and passing it through
    a series of nodes.


    Chances are, you have lots of questions about this project you’d like answered
    before you jump in. However, due to the negative associations, many people make
    with Tor and related projects, it’s understandable that potential users are afraid
    to discuss their interests.


    In this post, I’ll ask (and answer) those questions for you. I’ll explain everything
    you need to know about Tor, including how anonymous it is, whether it’s legal,
    and if you still need to connect to a VPN while using Tor.


    ## What Is Tor, and how does it work?


    The Tor network, often referred to as “Tor,” is a volunteer-run system that helps
    make internet use more anonymous.


    When a user is connected to Tor (often through the Tor browser), their outgoing
    internet traffic is rerouted through a random series of at least three nodes (called
    relays) before reaching its destination (the website the user wants to visit).
    Your computer is connected to an entry node, and the final node traffic passes
    through is the exit node, after which it reaches its destination (the website
    you want to visit). Incoming traffic is rerouted similarly.


    A simplified version of how Tor works (Source: EFF via Wikimedia)


    Aside from passing through several nodes, the traffic is encrypted, multiple times
    in fact. It loses a level of encryption at each node but is never fully decrypted
    until it leaves the exit node for its destination.


    Each node has an identifying IP address, which is also encrypted. The only IP
    address visible to the destination website is that of the final node, known as
    the exit node.


    In total, the Tor network is currently made up of about 7,000 relays (nodes) and
    800 bridges. Bridges are similar to relays, but they are not listed in the Tor
    directory. They may also be used as a website or app blocks traffic from a detected
    Tor node.


    ## Does Tor hide IP address?


    While connected to the Tor network, the activity will never be traceable back
    to your IP address. Similarly, your Internet Service Provider (ISP) won’t be able
    to view information about the contents of your traffic, including which website
    you’re visiting.


    Your ISP will see that you’re connecting to a Tor entry node, and the website
    you’re visiting will know the IP address of the Tor exit node.


    ## How to use Tor: getting started


    The simplest way to use Tor is through the Tor browser. These are a Firefox-based
    application that can be downloaded and installed on your computer.


    Versions are available for macOS, Windows, and Linux. Once you’ve downloaded and
    installed, you’ll be able to access clearnet and .onion sites through the browser.


    In some cases, the use of the Tor browser may block. As mentioned earlier, using
    a bridge should overcome this issue. In the past, this was fairly complex but
    is a lot easier in the latest version. You’ll need first to locate a bridge and
    then configure it with the Tor browser.


    ## Does Tor make you anonymous?


    It’s complicated, if not impossible, to become truly anonymous online, but Tor
    can undoubtedly help you get there. All of your traffic arriving at its destination
    will appear to come from a Tor exit node so that it will have the IP address of
    that node assigned to it. Because the traffic has passed through several additional
    nodes while encrypted, it can’t be traced back to you.


    However, one of the issues lies in trusting the operator of the exit node. If
    you’re visiting an unencrypted (non-HTTPS) website, it’s possible the node operator
    can track your activity and view your information. They could collect data such
    as which webpages you’re considering, your login information, the content of your
    messages or posts, and the searches you perform. Although, there’s no way to trace
    that information back to you or even back to the entry node.


    It’s worth noting that using the Tor browser only protects traffic going through
    that connection and won’t anonymize other apps on your computer (although many
    can configure to the Tor network via other means). Also, your ISP can still see
    that you’re using Tor. For improved privacy, you can use a VPN alongside the Tor
    browser.


    ## What is the darknet, and how is Tor related to it?


    If you’re familiar with the term, the “clear net,” you’ll know that it refers
    to the portion of the internet that can be freely accessed, that is, without Tor
    or an alternate browser. On the other side, you have the deep web. These include
    content that isn’t indexed by search engines, including outdated content, private
    files, and web pages that have barred search engines from crawling them.


    Also, within the deep web is the darknet. This content can usually only be accessed
    using special tools like Tor. The darknet houses some legitimate websites, but
    it is better known for being a place rife with illicit activity.


    You can access the clear net with Tor, but you can also access darknet websites,
    specifically .onion sites. These are sites that only people using the Tor browser
    can access and have .onion as part of their URL. They are also referred to as
    “Tor hidden services.”


    They’re not indexed by search engines and can be challenging to find if you don’t
    know where to look. Tor protects the anonymity of the operators of .onion sites,
    so it would be difficult to find out who is running them. Of course, the combination
    of both operator and user anonymity is what makes the darknet ideal for criminal
    activity.


    The (now seized) website for the infamous AlphaBay marketplace was a .onion site.
    (Source: US Department of Justice via Wikipedia)


    That being said, there are plenty of legitimate websites that have .onion versions.
    For example, VPNs are geared toward privacy-conscious users, and some offer .onion
    versions of their site, ExpressVPN being one example. You can even set up a .onion
    site of your own through the Tor browser.


    ### Why would someone want to use Tor?


    As mentioned, Tor is often associated with illegal activity and users wanting
    to access the dark web. Because of this, there is often an assumption that anyone
    using Tor must be up to no good. On the contrary, Tor can be used by privacy-conscious
    users for day-to-day browsing on clearnet sites, to help maintain user anonymity
    and privacy while online.


    There are a vast number of reasons your average internet user might want to be
    more anonymous. These include stopping ISPs and third parties collecting data
    about online activity, bypassing censorship, protecting children’s privacy, or
    researching taboo topics, such as birth control or religion.


    There are also many professions in which it would be necessary or helpful to keep
    an anonymous online profile. Some of those legitimately using Tor include:


    - Journalists

    - Law enforcement officers

    - Activists

    - Whistleblowers

    - Business executives

    - Bloggers

    - Militaries

    - IT professionals


    Although Tor doesn’t track what users are doing online, it does offer aggregate
    statistics telling you where users are located. You can see graphs by country
    and read about events that may have contributed to drastic changes in user numbers.


    For example, the above graph shows the number of US users connecting over the
    past year. In the dated commentary below each chart, Tor provides notes about
    things like updates, outages, and significant events such as government blockages.


    ## Is using Tor legal?


    The nature of Tor indeed makes it a popular choice among criminals wanting to
    access some of the shadier parts of the darknet and conduct criminal activities.
    These include buying or selling illegal products or services or participating
    in forums that spread hate speech and encourage extremism.

