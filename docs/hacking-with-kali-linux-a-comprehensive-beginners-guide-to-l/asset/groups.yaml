    you alter that name and not use the default name. Modify it to a name that doesn''t
    ultimately reveal who is the one who owns this wireless network, such as your
    surname - this is especially essential if you''re living in a dense population
    area, for instance, an apartment building.


    ## 4. Restrict the Wifi''s range


    Restricting the transmit range will decrease the possibility of someone looking
    to hack your network. In many homes, the Wireless may be detected from outside
    of it, and there''s generally no reason for this. Limit the transmission range,
    go outside your property, and look to find out if it could be discovered from
    there. When possible, you may relocate your router towards the center of the household
    to gain optimum coverage without creating blind spots caused by the restricted
    Wireless network range.


    ## 5. Alter the router''s interface security password


    The router''s password is the password you need to type whenever logging in to
    the web interface. Technically if the hacker can connect to the access point''s
    web interface then it''s already too late, and the hacker has gained access to
    the wireless network already, but this is a good precaution step to take, and
    it will limit the control that the hacker has over your wireless network.


    ## 6. Check who is connected to the network


    If you suspect that an intruder is using your WiFi, then most wireless routers
    have a feature that enables you to check the IP and MAC addresses of each device
    that''s logged in to your access point. You can check out that list and make sure
    that you know each of the devices. This list is frequently named active DHCP list
    or something like that.


    When you put into practice these pointers, then you''ve got a great chance versus
    even the most motivated hackers. Enabling these options takes little time, and
    the security gain is incredibly considerable. All of the tips are important. However,
    the most vital one is encryption password, in case you don''t adopt this tip,
    then your network''s security is completely broken.


    ## How to Detect a Hacker Attack


    Most computer vulnerabilities can be exploited in a variety of ways. Hacker attacks
    may use a single specific exploit, several exploits at the same time, a misconfiguration
    in one of the system components, or even a backdoor from an earlier attack.


    Due to this, detecting hacker attacks is not an easy task, especially for an inexperienced
    user. This article gives a few basic guidelines to help you figure out either
    if your machine is under attack or if the security of your system has been compromised.
    Keep in mind just like with viruses, and there is no 100% guarantee you will detect
    a hacker attack this way. However, there''s a good chance that if your system
    were hacked, it would display one or more of the following behaviors.


    ### Windows machines:


    - Suspiciously high outgoing network traffic. If you are on a dial-up account
    or using ADSL and notice an unusually high volume of the network traffic, especially
    when your computer is idle or not necessarily uploading data, then your computer
    may have been compromised. Your computer may be being used either to send spam
    or by a network worm, which is replicating and sending copies of itself. For cable
    connections, this is less relevant - it is quite common to have the same amount
    of outgoing traffic as incoming traffic even if you are doing nothing more than
    browsing sites or downloading data from the Internet.


    - Increased disk activity or suspicious looking files in the root directories
    of any drives. After hacking into a system, many hackers run a large scan for
    any new documents or files containing passwords or logins for bank or payment
    accounts such as PayPal. Similarly, some worms search the disk for files containing
    email addresses to use for propagation. If you notice significant disk activity
    even when the system is idle in conjunction with suspiciously named files in standard
    folders, this may be an indication of a system hack or malware infection.


    - A large number of packets which come from a single address being stopped by
    a personal firewall. After locating a target (e.g., a company''s IP range or a
    pool of home cable users), hackers usually run automated probing tools that try
    to use various exploits to break into the system. If you run a personal firewall
    (a fundamental element in protecting against hacker attacks) and notice an unusually
    high number of stopped packets coming from the same address, then this is a good
    indication that your machine is under attack. The good news is that if your firewall
    is reporting these attacks, you are probably safe. In this case, the solution
    is to block the offending IP temporarily until the connection attempts to stop.
    Many personal firewalls and IDS have such a feature built-in.


    - Your resident antivirus suddenly starts reporting that backdoors or trojans
    have been detected, even if you have not done anything out of the ordinary. Although
    hacker attacks can be sophisticated and innovative, many rely on known trojans
    or backdoors to gain full access to a compromised system. If the resident component
    of your antivirus is detecting and reporting such malware, this may be an indication
    that your system can be accessed from outside.


    ### Unix machines:


    - Suspiciously named files in the /tmp folder. Many exploits in the Unix world
    rely on creating temporary files in the /tmp standard folder, which is not always
    deleted after the system hack. The same is true for some worms known to infect
    Unix systems; they recompile themselves in the /tmp folder and use it as ''home.''


    - Modified system binaries such as ''login'', ''telnet'', ''FTP'', ''finger''
    or more complex daemons, ''sshd'', ''ftpd'' and the like. After breaking into
    a system, a hacker usually attempts to secure access by planting a backdoor in
    one of the daemons with direct access from the Internet, or by modifying standard
    system utilities which are used to connect to other systems. The modified binaries
    are usually part of a rootkit and, generally, are ''stealth'' against direct,
    simple inspection. In all cases, it is a good idea to maintain a database of checksums
    for every system utility and periodically verify them with the system offline,
    in single-user mode.


    - Modified /etc/passwd, /etc/shadow, or other system files in the /etc folder.
    Sometimes hacker attacks may add a new user in /etc/passwd, which can be remotely
    logged in to at a later date. Look for any suspicious usernames in the password
    file and monitor all additions, especially on a multi-user system.

