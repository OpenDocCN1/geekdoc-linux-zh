    ## Sometimes we install a proxy server, but only specific programs such as Firefox
    and Google Chrome provide proxy settings. Luckily, we can use a command-line utility
    called proxychains to redirect any application to go through our proxy server.
    This tutorial will show you how to set it up on Debian, Ubuntu, OpenSUSE, Fedora,
    CentOS/Red Hat, Arch Linux, and their derivatives.


    If you don’t know how to set up a proxy server, then check out this post to learn
    shadowsocks proxy. After that, come back here.


    ## Install proxy chains on Linux


    ### Debian/Ubuntu/Linux Mint/Elementary OS


    ```

    sudo apt-get install proxychains

    ```


    ### OpenSUSE Leap 42.1


    Proxy chains are available from the packman repository.


    ```

    sudo zypper install proxychains

    ```


    ### Fedora


    ```

    sudo dnf install proxychains

    ```


    ### CentOS/Red Hat


    ```

    sudo yum install proxychains

    ```


    ### Arch Linux


    ```

    sudo pacman -S proxychains-ng

    ```


    On Kali Linux, proxy chains are installed by default.


    ## Add a Proxy Server to Proxychains


    Open the configuration file.


    ```

    sudo nano /etc/proxychains.conf

    ```


    At the end of the file, add your proxy like this:


    ```

    socks5 127.0.0.1 1080

    ```


    `socks5` is the proxy type, and you can add other types as well, such as HTTP,
    https, socks4, etc. depending on your situation. `127.0.0.1` is the proxy host,
    and `1080` is the port on which the proxy server listens. Again, change them to
    your specific situation.


    The default proxy is `socks4 127.0.0.1 9050`, which you can safely remove.


    ## Set a Default DNS Server


    It’s highly recommended that you change the default `4.4.2.2` DNS server to something
    else, such as Google’s DNS server `8.8.8.8` / `8.8.4.4`. Or OpenDNS server `203.67.222.222`
    / `203.67.220.220`. Open the resolv configuration file.


    ### Debian/Ubuntu


    ```

    sudo nano /usr/lib/proxyresolv

    ```


    ### Linux Mint/Elementary OS


    ```

    sudo nano /usr/lib/proxychains3/proxyresolv

    ```


    ### Fedora/CentOS/Red Hat/OpenSUSE


    ```

    sudo nano /usr/bin/proxyresolv

    ```


    Find the following line:


    ```

    DNS_SERVER=4.4.2.2

    ```


    Change its value to something like `8.8.8.8`. Then save and close the file. On
    Arch Linux, there’s no `proxyresolv` config file.


    ## Test


    Just prepend `proxychains` to any command you execute like the following.


    ```

    proxychains youtube-dl -citv https://www.youtube.com/channel/<channel-id>

    ```


    If you are using `youtube-dl`, then you may know that it has no built-in support
    for socks proxy, but Proxychains will redirect `youtube-dl` to go through the
    proxy server.


    ## Quiet Mode


    By default, proxychains will output its activity to the terminal. If you don’t
    want to see this information, then you can disable it by editing `/etc/proxychains.conf`
    file.


    # CHAPTER 6


    ## HOW TO HACK A WIRELESS NETWORK


    ### How to Hack WiFi (Wireless) Network


    Wireless networks are accessible to anyone within the router’s transmission radius.
    These make them vulnerable to attacks. Hotspots are available in public places
    such as airports, restaurants, parks, etc.


    In this tutorial, we will introduce you to conventional techniques used to exploit
    weaknesses in wireless network security implementations. We will also look at
    some of the countermeasures you can put in place to protect against such attacks.


    ### What is a wireless network?


    A wireless network is a network that uses radio waves to link computers and other
    devices together. The implementation is done at Layer 1 (physical layer) of the
    OSI model.


    ### How to access a wireless network?


    You will need a wireless network-enabled device such as a laptop, tablet, smartphones,
    etc. You will also need to be within the transmission radius of a wireless network
    access point. Most devices (if the wireless network option is turned on) will
    provide you with a list of available networks. If the system is not password protected,
    then you have to click on connect. If it is password protected, then you will
    need the password to gain access.


    ### Wireless Network Authentication


    Since the network is easily accessible to everyone with a wireless network-enabled
    device, most systems are password protected. Let’s look at some of the most commonly
    used authentication techniques.


    #### WEP


    WEP is the acronym for Wired Equivalent Privacy. It develops for IEEE 802.11 WLAN
    standards. Its goal was to provide the privacy equivalent to that provided by
    wired networks. WEP works by encrypting the data been transmitted over the network
    to keep it safe from eavesdropping.


    #### WEP Authentication


    - **Open System Authentication (OSA)** – this method grants access to station
    authentication requested based on the configured access policy.

    - **Shared Key Authentication (SKA)** – This method sends to an encrypted challenge
    to the station requesting access. The station encrypts the problem with its key
    then responds. If the encrypted challenge matches the AP value, then access is
    granted.


    #### WEP Weakness


    WEP has significant design flaws and vulnerabilities.


    - The integrity of the packets is checked using Cyclic Redundancy Check (CRC32).
    A CRC32 integrity check can compromise by capturing at least two packs. The bits
    in the encrypted stream and the checksum can be modified by the attacker so that
    the authentication system accepts the packet. These lead to unauthorized access
    to the network.

    - WEP uses the RC4 encryption algorithm to create stream ciphers. The stream cipher
    input is made up of an initial value (IV) and a secret key. The length of the
    initial value (IV) is 24 bits long, while the secret key can either be 40 bits
    or 104 bits long. The total length of both the initial value and secret can either
    be 64 bits or 128 bits long. The lower possible value of the secret key makes
    it easy to crack it.

    - Weak Initial values combinations do not encrypt sufficiently. These make them
    vulnerable to attacks.

    - WEP is based on passwords; this makes it vulnerable to dictionary attacks.

    - Keys management are poorly implement. Changing keys, especially on large networks,
    is challenging. WEP does not provide a centralized key management system.

    - The initial values can be reused.


    Because of these security flaws, WEP has been deprecated in favor of WPA.


    #### WPA


    WPA is the acronym for Wi-Fi Protected Access. It is a security protocol developed
    by the Wi-Fi Alliance in response to the weaknesses found in WEP. It is used to
    encrypt data on 802.11 WLANs. It uses higher Initial Values 48 bits instead of
    the 24 bits that WEP uses. It uses temporal keys to encrypt packets.


    #### WPA Weaknesses


    - The collision avoidance implementation can be broken.

    - It is vulnerable to denial of service attacks.

    - Pre-shares keys use passphrases. Weak passphrases are susceptible to dictionary
    attacks.


    #### How to Crack Wireless Networks


    ##### WEP cracking


    Cracking is the process of exploiting security weaknesses in wireless networks
    and gaining unauthorized access. WEP cracking refers to exploits on systems that
    use WEP to implement security controls. There are two types of cracks namely;


    - **Passive cracking** – this type of cracking does not affect the network traffic
    until the WEP security has been cracked. It is difficult to detect.

    - **Active cracking** – this type of attack has an increased load effect on network
    traffic. It is easy to detect compared to passive cracking. It is effective compared
    to passive cracking.


    ##### WEP Cracking Tools


    - **Aircrack** – network sniffer and WEP cracker. Can be downloaded from

    - **WEPCrack** – this is an open-source program for breaking 802.11 WEP secret
    keys. It is an implementation of the FMS attack.

    - **Kismet** – this can include wireless detector networks, both visible and hidden,
    sniffer packets, and detect intrusions.

    - **WebDecrypt** – this tool uses active dictionary attacks to crack the WEP keys.
    It has its key generator and implements packet filters.


    ##### WPA Cracking


    WPA uses a 256 pre-shared key or passphrase for authentications. Short passphrases
    are vulnerable to dictionary attacks and other attacks that can be used to crack
    passwords. The following tools can be used to break WPA keys.


    - **CowPatty** – this tool is used to crack pre-shared keys (PSK) using a brute
    force attack.

    - **Cain & Abel** – this tool can be used to decode capture files from other sniffing
    programs such as Wireshark. The capture files may contain WEP or WPA-PSK encoded
    frames.


    ##### General Attack types


    - **Sniffing** – this involves intercepting packets as they are transmitting over
    a network. The captured data can then be decoded using tools such as Cain & Abel.

    - **Man in the Middle (MITM) Attack** – this involves eavesdropping on a network
    and capturing sensitive information.

    - **Denial of Service Attack** – the primary intent of this attack is to deny
    legitimate users network resources. FataJack can be used to perform this type
    of attack.


    ##### Cracking Wireless network WEP/WPA keys


    It is possible to break the WEP/WPA keys used to gain access to a wireless network.
    Doing so requires software and hardware resources and patience. The success of
    such attacks can also depend on how active and inactive users of the target network
    are.


    We will provide you with essential information that can help you get started.
    Backtrack can be used to gather information, assess vulnerabilities, and perform
    exploits, among other things.


    Some of the popular tools that backtrack have included;


    - Metasploit

    - Wireshark

    - Aircrack-ng

    - Nmap

    - Ophcrack

