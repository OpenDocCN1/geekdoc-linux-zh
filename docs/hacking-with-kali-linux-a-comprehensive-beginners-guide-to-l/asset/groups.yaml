    - **编码者（CD）和病毒编写者**：希望将自己视为精英的程序员；他们编写代码，但不是供个人使用。他们拥有用于实验的“动物园”网络。他们留给其他人将系统引入“野外”或互联网。（杰里米·昆特纳的《黑客心理学
    101》）；

