    # A Quick Definition


    VPN is an abbreviation of Virtual Private Network and is a term that covers a
    whole range of technologies that allow users to securely connect to a network
    from a remote location via a public network, which, in practice, usually means
    the internet.


    There are broadly two types of VPN. The first can be described as remote access
    and allows an individual user or device to access a network in another location
    across the internet. The second can be referred to as site-to-site and involves
    connecting a system in one place to a network in another.


    The key feature of a VPN is that they allow communications between separate networks
    to be secure. That is, they allow data to travel between systems without being
    seen or accessed by those that should not be able to do so. To do this, a VPN
    needs to a) make sure the right people access the virtual network in the first
    place and b) prevent people from intercepting any data as it travels across the
    internet.


    VPNs create what are termed ''tunnels'' across the internet, through which the
    information can travel out of the reach of prying eyes, or sniffers as they are
    known. In the purest sense, tunnels involve the encryption of information at one
    end of the data transfer, and then it is decoding at the other.


    They work by transferring encrypted packets of data across the internet and treating
    the sending and receiving computers as known devices (with predefined addresses)
    effectively on the same (albeit disconnected) network. To this end, the packets
    comprise an inner and outer package. The outer container has the job of transporting
    the inner pack across the internet from the gateway server on the sender''s network
    to the gateway server on the receiver''s web and, therefore, only contains information
    about the gateway servers to which it is going to and fro. If sniffers intercept
    the packets, they only see this information and not what the outer pack is transporting
    data, or which terminal computer/device it is heading for, as this is all encrypted.
    The encrypted inner packet contains the actual data that is being transferred
    and has further information on the address of the destination computer on the
    destination network as well as the sending computer on the sending network - both
    of which have been assigned IP'
  - '[PAGE 48]


    addresses which define them as being on the same virtual (remotely connected)
    network. The outer packets are decrypted when they reach the VPN server on the
    destination network, and the inner packs are then routed to the correct destination
    computer.


    It is analogous to putting a protective bubble around the encrypted inner packet
    while it is traveling across public networks - sniffers can see where this bubble
    is going, but they don''t know what is in it. The balloon can only be peeled away
    when it reaches its destination network, while the specified destination computer
    can only decrypt its contents on that network.


    There are a variety of technologies that are used to generate and interpret these
    encrypted packets such as IPSec (Internet Protocol Security) and TLS (Transport
    Layer Security) as well as a few proprietary technologies depending on the VPN
    provider in question. However, they all have the same purpose and aim: to allow
    computers to join remote networks across open public networks securely.


    # How Secure Is A VPN?


    When it comes to Internet security, users should be careful. There are malicious
    parties at many Wi-Fi hotspots, waiting to hack into a user''s personal information.
    Sensitive information such as emails, instant messages, and credit card information
    are all susceptible to being hacked if they are not ade q  uately secured. These
    are where a Virtual Private Network, or VPN, comes in handy. However, most users
    who do not know what a VPN consists of are likely to q  uestion how secure they
    are. A VPN can protect users in ways that anti-virus software and firewalls cannot.
    Though these programs can use in conjunction with the VPN, they only protect the
    device itself. They do not protect data transmitted to or from the device.


    Here are some advantages that a VPN can offer in terms of Internet security:


    Prevent Deep Packet Inspection'
  - '[PAGE 49]


    Internet Service Providers, or ISPs, are known for tracking user activities online.
    ISPs use this information as a means of inspecting, throttling, and prioritizing
    the data that are sent to and from user devices. These mean slower speeds for
    users who don''t connect with a VPN. When users access the Internet using a secure
    VPN, they defeat deep packet inspection. The ISP is not able to see the user''s
    activities. They are only able to see that they are communicating with the VPN''s
    server. All of the information the user sends and receives is encrypted and private.


    # Connect Via Wi-Fi without Worry


    Users who connect to the Internet using mobile devices take advantage of free
    Wi-Fi connections at coffee shops, restaurants, airports, libraries, and more.
    Doing so puts the user''s information at risk. Wi-Fi connections typically have
