    \n### 级别 3：路由器配置页面上的预设密码和用户名\n\n每个路由器页面都有用户名和密码。默认情况下，用户名是“admin”，密码是“admin”或“password”。有一个所有路由器品牌通用的密码。当然，任何黑客或犯罪分子都知道这些密码，因此如果他们能连接到你的网络，就可以调整路由器的配置页面，这可能导致你的系统或路由器无法使用。\n\
    \n### 级别 4：防火墙设置\n\n你的路由器内置防火墙。此防火墙阻止其他人访问你的网络及连接的计算机。你可以调整防火墙设置，允许网络中的所有应用程序上网，或根据设置精确调整，仅允许特定应用程序连接。根据版本和品牌，你的操作系统可能也有自己的防火墙设置，这也有助于保护网络安全。\n\
    \n### 级别 5：防病毒和反间谍软件\n\n无论强调多少次都不为过：保护计算机免受病毒、间谍软件和恶意软件侵害有多么重要。每天都有成千上万个这类恶意程序被创建，如果你不更新安全软件，你很可能会感染，因为计算机上的病毒定义未更新。\n\
    \n## 如何保护计算机免受黑客攻击\n\n无论你是否一直在使用互联网，保护数据仍然最佳。\n\n这是一个事实：无论你是去年、上个月甚至昨天才与互联网服务提供商连接，你仍然容易在系统中引入恶意软件。\n\
    \n这些形式的恶意软件可以获取你在计算机上做的任何数据或活动。以键盘记录器为例。键盘记录器有方法在你不知情的情况下安装自身。一旦安装并在后台运行，它将捕捉你执行的每个鼠标和键盘事件。因此，如果你碰巧检查电子邮件——你输入用户名和密码——并且你的键盘记录器处于活动状态，可以\
