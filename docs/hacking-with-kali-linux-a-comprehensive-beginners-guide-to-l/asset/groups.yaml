    Entertainment, or Airlines, the security of the data and classified information
    is becoming famous day by day. Competitors can go to any extent to have the inside
    knowledge of their opponents.


    It is estimated that close to 2 million Ethical hackers were required by 2010-2011
    by various industries, to safeguard their assets from dangerous and anti-social
    elements.


    Post 9/11 terrorist attack in the US, the International Council of Electronic
    Commerce Consultants or EC-Council was established to provide the required cushion
    against such type of attacks on Information Systems around the globe. This formation
    soon had the support of various subject matter experts around the world, and several
    certifications and standards were thus developed.


    Ethical Hacking and Countermeasures 6 is one among these certifications, targeting
    the enthusiasts who are aiming for a long-term career in this domain. The determination
