    Level 3: Pre-set password and username on router’s configuration page


    Each router page has its username and password. By default, the username is “admin,”
    and the password is either “admin” or “password.” There is one passcode that is
    universal to all router brands. Of course, any hacker or criminal will know these
    passcodes, so if they can connect to your network, they can tweak the configuration
    page of your router, and this can render your system or router, unusable.


    Level 4: Firewall settings


    Your router has its firewall that is built-in within the system. This firewall
    prevents other people from accessing your network and the computers connected
    to it. You can adjust your firewall settings to allow all applications in your
    network to get online, or adapt it accurately for your settings to allow only
    specific apps to connect. Your operating system, depending on its version and
    brand, may also have its firewall settings, which can also help secure your network.


    Level 5: Anti-virus and anti-spyware software


    It cannot be emphasized enough how important it is to protect your computer from
    viruses, spyware, and malware. Thousands of these malicious programs are created
    every day, and if you don’t update your security software, chances are, you will
    still be prone to be infected because virus definitions are not updated on your
    computer.


    # **How to Defend Your Computer Against Hackers**


    Whether or not you’re using the internet all the time, it is still best to keep
    your data protected.


    Here’s a fact: Regardless if you just hooked up with an internet service provider
    last year, last month, or even just yesterday, you are still prone to getting
    malicious software into your system.


    These forms of malicious software can get every data or activity that you do on
    your computer. Take a key logger, for example. Key loggers have their way of installing
    itself without you knowing it. The moment it’s'
