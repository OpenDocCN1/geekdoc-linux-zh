    an unsecured wireless network is dangerous from wireless connection stealers and
    tappers. Learn about two types of wireless network setup and two ways to secure
    your wireless connection.


    Infrastructure wireless network connection


    There are two types of wireless network connections. Infrastructure network connection
    and ad-hoc network connection. The infrastructure uses a router or a gateway that
    provides an IP address to each device and shares the internet connection. For
    example, you have a desktop and a laptop. For the computer or the desktop to connect
    wirelessly, the router or gateway should have wireless capability. The standard
    setup is the modem connected to the router, then the laptop and desktop could
    be connecting wired or wirelessly .


    Ad-hoc wireless network connection


    This type of relationship does not need any router or gateway. Ad-hoc connection
    involves two wireless devices that communicate directly. A good example would
    be two laptops. You can set up an ad-hoc connection on one of the computers. One
    of the machines will serve as a server and will broadcast its ad-hoc name. The
    second computer will scan for an ad-hoc signal and should detect computer number
    one. You will give an option to connect to the ad-hoc network.


    Wireless Security


    The wireless signal that is being broadcasted by your router can be secured or
    unsecured. The unprotected message allows an unauthorized user to connect to your
