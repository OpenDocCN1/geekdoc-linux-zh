    with fdisk, you won''t get any output). You''ll get output that will look something
    (not exactly) like this, showing a single drive — “/dev/sda” — containing three
    partitions (/dev/sda1, /dev/sda2, and /dev/sda5):


    Now, plug your USB drive into an available USB port on your system, and run the
    same command, “sudo fdisk -l” a second time. Now, the output will look something
    (again, not exactly) like this, showing an additional device which wasn''t there
    previously, in this example “/dev/sdb,” a 16GB USB drive:


    Proceed to (carefully!) image the Kali ISO file on the USB device. The example
    command below assumes that the ISO image you''re writing is named “Kali-Linux-2017.1-amd64.iso”
    and is in your current working directory. The blocksize parameter can be increased,
    and while it may speed up the operation of the dd command, it can occasionally
    produce unbootable USB drives, depending on your system and a lot of different
    factors. The recommended value, “bs=512k”, is conservative and reliable.


    ```

