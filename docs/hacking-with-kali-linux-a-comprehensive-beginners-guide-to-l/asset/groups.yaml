    \n### 级别 2：SSID 广播\n\n默认情况下，你网络的默认名称是你路由器的品牌。这个网络名称也被称为 SSID。禁用 SSID 广播可以保护你免受黑客、身份盗窃罪犯以及其他怀有恶意动机、可能入侵你网络的人的侵害。\n\
