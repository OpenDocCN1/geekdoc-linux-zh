    另一个缺点是你的 ISP 能够看到你正在使用 Tor。它无法读取你的流量内容，但检测到你在这一点可能会产生一些后果。如前所述，仅仅使用 Tor 就足以引起
    ISP 和当局的怀疑。绕过此问题的一种方法是使用带有 Tor 的 VPN（下文将有更多介绍）。


    ### 被网络管理员封锁


    单个网络的管理员通常会封锁 Tor。绕过此问题的一种方法是使用桥接（bridges），它们不应该被检测为 Tor 节点。如果封锁更加复杂并使用了深度包检查，你可能需要使用额外的工具，例如可插拔传输协议（Pluggable
    Transports，见下文）。这些工具会将你的 Tor 流量伪装成常规流量，以绕过封锁。


