    \n### 防病毒软件\n\n虽然你选择的操作系统可能具有内置软件来处理特定威胁，但如果没有安装完整、专用的防病毒程序，很难获得针对不断变化的病毒世界频繁更新的保护。许多此类软件可以便宜购买，并收取年度费用，但如果你负担不起，那么有很多可靠的提供商提供其产品的免费版本。任何保护都比没有保护好。\n\
    \n### 常识\n\n作为一般法则，不要打开那些你未预期的或来自你不认识的地址的电子邮件。然而，无论来源如何，使用电子邮件时都要谨慎。某些病毒可以访问你朋友的电子邮件账户，并转发充满病毒的垃圾邮件给该地址簿中的所有人。如果你突然收到来自朋友的消息，也许只需快速核实一下那是不是真的。\n\
