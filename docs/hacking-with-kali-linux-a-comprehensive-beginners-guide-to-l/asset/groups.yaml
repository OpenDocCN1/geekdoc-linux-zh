    \n### 警惕“云存储”\n\n云存储是一种完全在线进行的数据存储形式。它向用户提供免费或廉价使用其服务器的机会，许多人用它来“归档”文档等。这是一项创新且有用的服务。然而，要警惕在“云”中存储任何包含个人或机密信息的内容，因为它因不安全而声名狼藉。\n\
    \n## 学习网络安全基础\n\n如今，电脑已成为我们生活中不可或缺的一部分。这要求 IT 专业人员对 IT 安全基础有很好的理解。这些安全基础需要了解保护信息保密性、完整性和可用性所需的控制措施。\n\
