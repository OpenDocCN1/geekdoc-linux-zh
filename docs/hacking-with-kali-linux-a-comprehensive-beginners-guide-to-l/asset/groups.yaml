    you begin a download, you should always read the licensing agreement, which may
    contain a clause allowing other software to be downloaded with the software you
    want. Hackers know that people seldom read these agreements, yet having these
    kinds of requirements makes the downloading entirely legitimate.


    **What to do:** Most browsers allow you to remove toolbars. Check all your toolbars
    and if you have any doubts about a toolbar, remove it. If you can''t find the
