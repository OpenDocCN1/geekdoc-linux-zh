    hired in IT sectors to continuously monitor and identify potential vulnerabilities
    and take action according to that.


    ## Six (6) Sure Signs You Have Been Hacked


    There are several ways in which antivirus scanners try to detect malware. Signature-based
    detection is the most common method.


    This involves searching the contents of a computer''s programs for patterns of
    code that match known viruses. The anti-virus software does this by checking systems
    against tables that contain the characteristics of known viruses. These tables
    are called dictionaries of virus signatures.


    Because thousands of new viruses are being created every day, the tables of virus
    signatures have to be continuously updated as the anti-virus software is to be
    effective. But even if the software is being updated daily, it usually fails to
    recognize new threats that are less than 24 hours old.


    To overcome this limitation and find malware that has not yet been recognized,
    anti-virus software monitors the behavior of programs, looking for abnormal behavior.
    This technique is called heuristics. The software may also use system monitoring,
    network traffic detection, and virtualized environments to improve their chances
    of finding new viruses.


    Nevertheless, anti-virus software is never 100 percent successful, and every day
    new malware infects computers throughout the world.


    ## Getting hacked


    There are three main ways you can get infected with malware.


    These are:

    - (a) running unpatched software, i.e. software that you have failed to update;

    - (b) falling for a desirable freebie and downloading a Trojan horse along with
    the freebie;

    - (c) responding to fake phishing emails.


    If you can manage to avoid these three failings, you won''t have to rely so much
    on your anti-virus software.


    Expecting that someday someone will release anti-virus software that can detect
    all viruses and other malware with complete accuracy is a vain hope. The best
    you can do is to keep your security up to date, avoid the three main ways you
    can get infected, and learn to recognize the signs that suggest your computer
    has been hacked so that you can take appropriate action.


    Here are some sure signs you''ve been hacked and what you can do about it.


    ### 1. Fake antivirus messages


    A fake virus warning message popping up on the screen is a pretty sure sign that
    your computer has been hacked—provided you know it''s fake. (To be able to recognize
    a phony warning, you need to know what a certain virus warning from your anti-virus
    software looks like.) The signal will reassure you by saying that it can scan
    your system to detect the malware.


    Clicking no or cancel to stop the scan won''t help because your computer has already
    been compromised. The purpose of the fake virus warning (which will always find
    lots of illnesses that need to be eliminated) is to lure you into buying their
    virus removal service or other product.


    Once you click on the link provided for that purpose, you will likely land on
    a very professional-looking website. There you''ll be invited to buy and download
    the product by filling in your credit card details.


    Bingo! As well as having complete control of your system, the hacker now has your
    personal financial information.


    **What to do:** As soon as you see the fake virus warning message, turn off your
    computer. Reboot it in safe mode (no networking) and try to uninstall the newly
    installed software (which can often be uninstalled just like a regular program).


    Then, whether you succeed in uninstalling the rogue program or not, restore your
    system to the state it was in before you got hacked. Nowadays, you can typically
    revert to a previous state with just a few clicks.


    Once you have turned back the clock, to speak, healthily restart your computer
    and make sure that the fake virus warning has gone. Then do a complete anti-virus
    scan to eliminate any traces of the malware.


