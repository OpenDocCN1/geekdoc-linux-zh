    replacing the data with a scrambled string of nonsense. This nonsense can be turned
    back into the original data using the key shared by the two machines. This encryption
    is virtually unbreakable and, when it is used for business communications, it
    dramatically increases the level of safety that the business enjoys. It''s also
    great for personal connections. VPN services use encryption, among other methods,
    to keep information safe.


