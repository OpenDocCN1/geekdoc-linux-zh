    # Cracking Wireless Network Keys


    Cracking wireless network keys requires the patience and resources mentioned above.
    At a minimum, you will need the following tools:


    - A wireless network adapter with the capability to inject packets (Hardware)

    - Kali Operating System

    - Be within the target network’s radius. If the users of the target network are
    actively using and connecting to it, then your chances of cracking it will be
    significantly improved.

    - Patience, cracking the keys may take a bit of time depending on several factors,
    some of which may be beyond your control. Factors beyond your control include
    users of the target network using it actively as you sniff data packets.


    ## How to Secure Wireless Networks


    In minimizing wireless network attacks, an organization can adopt the following
    policies:


    - Changing default passwords that come with the hardware

    - Enabling the authentication mechanism

    - Access to the system can be restricted by allowing only registered MAC addresses.

    - Use of strong WEP and WPA-PSK keys, a combination of symbols, numbers, and characters
    reduces the chance of the keys being cracked using a dictionary and brute force
    attacks.

    - Firewall Software can also help reduce unauthorized access.


    ## Hacking Activity: Crack Wireless Passwords


    In this practical scenario, we are going to use Cain and Abel to decode the stored
    wireless network passwords in Windows. We will also provide useful information
    that can be used to crack the WEP and WPA keys of wireless networks.


    ### Decoding Wireless Network Passwords Stored in Windows


    Download Cain & Abel from the link provided above.


    1. Open Cain and Abel.

    2. Ensure that the Decoders tab is selected then click on Wireless Passwords from
    the navigation menu on the left-hand side.

    3. Click on the button with a plus sign.


    Assuming you have connected to a secured wireless network before, you will get
    results similar to the ones shown below.


    The decoder will show you the encryption type, SSID, and the password that was
    used.


    ## Summary


    - Outsiders can see wireless network transmission waves; this poses many security
    risks.

    - WEP is the acronym for Wired Equivalent Privacy. It has security flaws, which
    make it easier to break compared to other security implementations.

    - WPA is the acronym for Wi-Fi Protected Access. It is more secure compared to
    WEP.

    - Intrusion Detection Systems can help detect unauthorized access.

    - A good security policy can help protect a network.


    ## What Is Ethical Hacking EC0-350 Certification Exam?


    Ethical Hacking and Countermeasures 6 (CEHv6) Certification is also known as the
    EC0-350 test. Being conducted by EC-Council, this is one of the most prominent
    certifications in the ethical hacking field.


