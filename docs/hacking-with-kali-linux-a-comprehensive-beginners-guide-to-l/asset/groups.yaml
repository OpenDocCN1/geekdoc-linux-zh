    gears and gadgets. However, wireless networks are very vulnerable to intruder
    attacks, especially if you don''t have it secured. With most American homes subscribing
    to wireless internet, the more important is it to obtain these networks and the
    computers connected to it, using different levels of security.


    Level 1: Encryption


    Encryption technologies scramble data and communications over the network, which
    makes your information unreadable to people who might try to hack into the system.
    These encryption technologies come in the form of passwords or passphrases that
    you have to key in before you are allowed to connect to a private network. WEP/WPA
    security ensures that only persons who know the passphrase will be able to connect
    to the system and take advantage of its internet connectivity.


    When creating passwords for your network, avoid using your phone number, birth
    date, or anything that might contain easily guessed information about yourself.
    Creating strong passwords is the key to protecting your network from potential
    threats.


    Level 2: SSID Broadcasting


    By default, the default name of your network is your router''s brand. This network
    name is also known as the SSID. Having them disabled will protect you from hackers,
    identity theft criminals, and other people with malicious motives who might hack
    into your network.


    Disabling your SSID will make your network "invisible." No one will detect that
    your system is open, so if there are any hackers around'
