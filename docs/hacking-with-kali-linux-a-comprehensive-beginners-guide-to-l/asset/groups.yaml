    # HACKERS, CYBERPUNKS, et al


    Hackers or crackers do not monopolize cyber Crime. The pedophile, thief, or drug
    dealer in your community who hire computer experts to carry out their illegal
    activities online are as guilty and despicable.


    Just like the criminals roaming out in the real world, Cyber felons are a bunch
    of psychologically imbalanced and misguided citizens who happen to have the dexterity
    to commit electronic transgressions or hire a computer expert to do the job and
    will never get enough despite their Cyber Glory and ''con q uests.''


    Still, the tendency to commit a crime lies hidden in wholesome images, while the
    unsuspecting are often caught by surprise. What you don''t see is sometimes what
    you get.


    > Hackers cannot be strictly stereotyped. Peter Shipley, Chief Security architect
    for the Big Five firm KPMG, avers: "I know many hackers, including one who spends
    an hour and a half in the gym every day. He is built. I know of knock-down gorgeous
