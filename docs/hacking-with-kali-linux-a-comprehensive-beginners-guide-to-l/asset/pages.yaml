- pgno: 66
  md: 'proxy host, and 1080 is the port on which the proxy server listens. Again,
    change them to your specific situation.


    The default proxy is socks4 127.0.0.1 9050, which you can safely remove.


    # Set a Default DNS Server


    It’s highly recommended that you change the default 4.4.2.2 DNS server to something
    else, such as Google’s DNS server 8.8.8.8/8.8.4.4. Or OpenDNS server 203.67.222.222/203.67.220.220.
    Open the resolv configuration file.


    Debian/Ubuntu


    ```

    sudo nano /usr/lib/proxyresolv

    ```


    Linux Mint/Elementary OS


    ```

    sudo nano /usr/lib/proxychains3/proxyresolv

    ```


    Fedora/CentOS/Redhat/OpenSUSE


    ```

    sudo nano /usr/bin/proxyresolv

