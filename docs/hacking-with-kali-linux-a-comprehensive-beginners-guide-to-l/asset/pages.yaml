- pgno: 13
  md: 'It seems like you can''t watch the news without finding out about a new major
    security bug or corporate hacking scandal. Heartbleed and Shellshock scared many
    internet users, and soon articles on enhancing cybersecurity started popping up
    everywhere. Small business owners need to be especially savvy about cybersecurity
    since so much of their business base on the web. Here are some things you need
    to know about keeping your business safe online, as well as what to do in the
    event of a security breach.


    +   - No business is too small to be vulnerable to hackers. According to the National
    Cyber Security Alliance, 71% of cyber attacks target small businesses, and almost
    half of the small businesses reported have attacked. Even more alarmingly, Experian
    has found that 60% of small businesses who are victims of a cyber attack go out
    of business within six months. The NCSA reported three reasons that small businesses
    are often targeted: they don''t have the resources to respond to an attack, information
    like credit card numbers is often less heavily guarded, and small businesses may
    be partnered with larger corporations and give hackers access to those companies.


    +   - Be sure that all devices dealing with the company network or any company
    data have reliable anti-virus and anti-malware software. These are basic, but
    easily overlooked, precaution against malicious files and other attacks. Your
    network should also have a firewall to protect the network as a whole.


    +   - Educate your employees. In addition to making sure that everyone in your
    company is familiar with your security system, it may be useful to train employees
    on basic Internet safety and security. There are lots of online resources that
    raise awareness about phishing scams, security certificates, and other cybersecurity
    basics.


    +   - Create strong passwords. For any resources re q uiring passwords on your
    system, create (and have employees create) complex passwords that aren''t subject
    to social engineering or easy guessing. There are many guides available on the
    web about how to create strong passwords.


    +   - Use encryption software if you deal with sensitive information regularly.
    That way, even if your data is compromised, the hacker won''t be able to read
    it.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '+   • Limit administrator privileges to your system. Set up the proper access
    boundaries for employees without administrator status, especially when using non-company
    devices. Limit administrator privileges to those who need them, and limit access
    to sensitive information by time and location.


    +   • Look into cyber insurance. Cybersecurity breaches generally aren''t covered
    by liability insurance, but if you''re looking to protect sensitive data, talk
    to an insurance agent about your options.


    +   • Back up your data weekly, either to a secure cloud location or to an external
    hard drive. That way, if your server goes down, you''ll still have access to your
    data. Boardroom Executive Suites'' Cloud Computing Services by SkySuite are an
    ideal tool in this area.


    +   • If you''ve determined that there was a security breach, figure out the scope
    of the attack. These are an excellent time to call in a consultant who is an expert
    in cybersecurity. These will both give you a sense of what damage you need to
    mitigate and point to whether it was a generic mass-produced attack or a specifically
    targeted one.


    +   • Once you''ve conducted this investigation, pull all of your systems offline
    to contain the damage.


    +   • Repair affected systems. You can use master discs to reinstall programs
    on your devices. Then, with the help of your consultant, figure out where the
    gaps are in your security system. To prevent another attack from happening, use
    this as a learning experience to make your protection stronger.


    +   • Be honest, transparent, and timely in your communication with your customers.
    Let them know what happened and what you''re doing to fix it.


    # 5 Cyber Security Mistakes Most Companies Make


    Cybersecurity falls under the responsibility of everyone, not just information
    technology professionals. As with personal security, individuals must pay attention
    to their surroundings and their actions.


    There are several areas that businesses and employees fail to pay attention to
    regarding cybersecurity. These are in no order of importance, as all are critical.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Lack of training for staff


    When we raise our children, we make sure they know to look both ways before crossing
    the street, not to take candy from strangers, and never to get in a car with someone
    they don''t know. To all of us, this is common sense as we received this same
    education ourselves.


    With cybersecurity, the same principles apply. Don''t open attachments from unknown
    sources. Don''t go to websites that appear suspicious. Don''t tell anyone your
    password(s).


    Businesses must make sure they have education for all employees regarding these,
    and other, basic cybersecurity concepts. The training should occur at new hire
    orientation, and it makes sense to have annual or semi-annual reviews.


    # Failure to limit/log access


    Who has access to what data? What IT Administrator modified the directory structure?
    Who changed permissions? Do all employees have access to HR files? Does any unnecessary
    person have access to financial records? Are there logs showing who accessed what
    data?


    Most of the answers to these questions will be "we don''t know," and that''s a
    problem to acknowledge and address. Companies need to utilize built-in tools to
    log access, and, when necessary, purchase third party software for greater control
    and granularity. Not only can tracking access prevent a data breach, but it also
    enables organizations to find out what happened when data loss does occur.


    # Caring about corporate data


    Most employees focus on their day to day jobs. They are not necessarily concerned
    with intellectual property at their company. Vast numbers of employees don''t
    even know what data is critical to the success of their business.


    Employees understand that financial and human resource records deserve protection;
    that''s not enough.


    Staff must also know about core data critical to the company so they can make
    sure and take proper action when dealing with that information and when dealing
    with others who have responsibility for protecting that data.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Understanding cyber threats


    Phishing. Spoof. Worm. Trojan horse. Pharming. Hijack attack. All key terms in
    the cybersecurity world and, with few exceptions, most people do not know what
    these expressions mean.


    Along with primary education, it makes sense for organizations to make sure the
    staff knows what these attacks are and how to protect against them. There are
    several terms and threats that individuals are familiar with; it''s the responsibility
    of businesses to help employees understand additional dangers. Common sense goes
    a long way, and with adding simple communication, companies can ensure employees
    know what to look for and how to act when issues arise.


    # Spending money in the wrong areas, or not at al l


    Too often, businesses focus on revenue generation opportunities and ROI when spending
    money. Companies must take a defensive posture, as well. There doesn''t mean only
    spending money on networking e口uipment and edge devices to protect their information
    assets, and they must understand the extent of the threats and spend in numerous
    areas.


    Firewalls, extranets, and intrusion detection systems are all well and good; however,
    they only protect companies from specific types of attacks. Businesses must take
    a holistic view of cybersecurity and invest as necessary. Cybersecurity is an
    investment and should view as such through the budgeting process.


    Everyone must take ownership of cybersecurity. In today''s world, with significant
    data breaches occurring seemingly weekly, impacting millions of people, it''s
    imperative to pay attention and share in the responsibility for data protection.


    Through education, logging, corporate understanding data, knowledge of threats,
    and proper cybersecurity investments, companies will find greater security. When
    companies have data protection, investors, employees, and consumers receive peace
    of mind and clarity that they are as secure as possible.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# CHAPTER 2


    # HOW TO INSTALL THE KALI LINUX AND HOW TO MAKE A KALI BOOTABLE USB DRIVE


    At times, we have sensitive data; we would prefer to encrypt using full disk encryption.
    With the Kali Installer, you can initiate an LVM encrypted install on either Hard
    Disk or USB drives. The installation procedure is very similar to a “normal Kali
    Linux Install,” except for choosing an Encrypted LVM partition during the installation
    process.


    Kali Linux Encrypted Installation Re q uirements


    Installing Kali Linux on your computer is a natural process. First, you’ll need
    compatible computer hardware. The hardware re q uirements are minimal, as listed
    below, though the better device will naturally provide better performance. The
    i386 images have a default PAE kernel so that you can run them on systems with
    over 4GB of RAM. Download Kali Linux and either burn the ISO to DVD or prepare
    a USB stick with Kali Linux Live as the installation medium.


    Installation Prerequisites


    +   - A minimum of 20 GB disk space for the Kali Linux install .

    +   - RAM for i386 and amd64 architectures, minimum: 1GB, Recommended: 2GB or
    more.

    +   - CD-DVD Drive / USB boot support


    Preparing for the Installation


    +   - Download Kali Linux.

    +   - Burn The Kali Linux ISO to DVD or Image Kali Linux Live to USB.

    +   - Ensure that your computer is set to boot from CD / USB in your BIOS.


    Kali Linux Installation Procedure


    To start your installation, boot with your chosen installation medium. It would
    be best if you were greeted with the Kali Linux boot menu. Choose a Graphical
    or a Text-Mode install. In this example, we decided on a GUI install.'
  merge: -1
  img_proc: true
