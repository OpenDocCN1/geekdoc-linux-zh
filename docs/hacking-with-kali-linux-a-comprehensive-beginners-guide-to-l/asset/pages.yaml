- pgno: 67
  md: '# ## CHAPTER 6

    ### HOW TO HACK A WIRELESS NETWORK


    How to Hack WiFi (Wireless) Network


    Wireless networks are accessible to anyone within the router’s transmission radius.
    These make them vulnerable to attacks. Hotspots are available in public places
    such as airports, restaurants, parks, etc.


    In this tutorial, we will introduce you to conventional techniques used to exploit
    weaknesses in wireless network security implementations. We will also look at
    some of the countermeasures you can put in place to protect against such attacks.


    What is a wireless network?


    A wireless network is a network that uses radio waves to link computers and other
    devices together. The implementation is done at Layer 1 (physical layer) of the
    OSI model.


    How to access a wireless network?


    You will need a wireless network-enabled device such as a laptop, tablet, smartphones,
    etc. You will also need to be within the transmission radius of a wireless network
    access point. Most devices (if the wireless network option is turned on) will
    provide you with a list of available networks. If the system is not password protected,
    then you have to click on connect. If it is password protected, then you will
    need the password to gain access.


    Wireless Network Authentication


    Since the network is easily accessible to everyone with a wireless network-enabled
    device, most systems are password protected. Let’s look at some of the most commonly
    used authentication techniques.


    WEP


    WEP is the acronym for Wired E_q uivalent Privacy. It develops for IEEE 802.11
    WLAN standards. Its goal was to provide the privacy e_q uivalent to that provided
    by wired networks. WEP works by encrypting the data been transmitted over the
    network to keep it safe from eavesdropping.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# WEP Authentication


    Open System Authentication (OSA) – this method grants access to station authentication
    requ ested based on the configured access policy .


    Shared Key Authentication (SKA) – This method sends to an encrypted challenge
    to the station requesting access. The station encrypts the problem with its key
    then responds. If the encrypted challenge matches the AP value, then access is
    granted.


    # WEP Weakness


    WEP has significant design flaws and vulnerabilities.


    The integrity of the packets is checked using Cyclic Redundancy Check (CRC32).
    A CRC32 integrity check can compromise by capturing at least two packs. The bits
    in the encrypted stream and the checksum can be modified by the attacker so that
    the authentication system accepts the packet. These lead to unauthorized access
    to the network.


    WEP uses the RC4 encryption algorithm to create stream ciphers. The stream cipher
