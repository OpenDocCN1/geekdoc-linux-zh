- pgno: 24
  md: '# CHAPTER 3


    # INTRODUCTION TO WIRELESS NETWORK HACKING AND HOW TO SCAN NETWORK


    Wireless Network Type and Security


    A wireless network connection is gaining popularity nowadays. This type of relationship
    is easy to set up, and most of the time, reliably provided that it set up correctly.
    Most of the houses and even offices are using a wireless network connection. However,
    an unsecured wireless network is dangerous from wireless connection stealers and
    tappers. Learn about two types of wireless network setup and two ways to secure
    your wireless connection.


    Infrastructure wireless network connection


    There are two types of wireless network connections. Infrastructure network connection
    and ad-hoc network connection. The infrastructure uses a router or a gateway that
    provides an IP address to each device and shares the internet connection. For
    example, you have a desktop and a laptop. For the computer or the desktop to connect
    wirelessly, the router or gateway should have wireless capability. The standard
    setup is the modem connected to the router, then the laptop and desktop could
    be connecting wired or wirelessly .


    Ad-hoc wireless network connection


    This type of relationship does not need any router or gateway. Ad-hoc connection
    involves two wireless devices that communicate directly. A good example would
    be two laptops. You can set up an ad-hoc connection on one of the computers. One
    of the machines will serve as a server and will broadcast its ad-hoc name. The
    second computer will scan for an ad-hoc signal and should detect computer number
    one. You will give an option to connect to the ad-hoc network.


    Wireless Security


    The wireless signal that is being broadcasted by your router can be secured or
    unsecured. The unprotected message allows an unauthorized user to connect to your
    sign and get a free internet connection. If the much-'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'unauthorized user is connecting to your router, it will eat up your bandwidth
    resulting in slow internet. Not to mention, they can also hack into your computer
    since you already connected to one network.


    Wired Equivalent Privacy (WEP), Wi-Fi Protected Access (WPA) & MAC Address


    This type of wireless security is widely using due to its simplicity. Both WEP
    and WPA allow a user to produce a password, and from this password, it will convert
    to decimal or hexadecimal. The string generated from the password is longer. Thus
    they are secure.


    Wireless adapter has a unique identification number called Media Access Control
    (MAC) address. Unregistered MAC addresses will not be allowed to connect by the
    router.


    # Secure Your Home Wireless Network And Keep Hackers Out


    One of the most important, yet under-implemented features of any home wireless
    network is secure. Many people worry only about file sharing and network printing.
    But many people underestimate the need for security or do not understand it. Safety
    is important because unlike traditional wired networks, wireless signals are transmitted
    across a broader spectrum and thus can be easily picked up.


    With the ever-growing threat of identity theft, you want to take the steps necessary
    to secure your home wireless network. There are some minor threats and significant
    threats to your personal information. On the small side, an intruder may easily
    connect to your unsecured wireless network and use it for free internet access.
    These are called piggybacking. These are minor threats to your privacy.


    A significant threat is a hacker who is looking to attack your network and hack
    into it and access your files and personal data. Once they have this, they can
    quickly start stealing your identity or selling it to someone who will.


    Wireless security can quickly implement by following a few guidelines. One of
    the essential features is MAC address filtering. Each computer has a unique MAC
    address. In your network configuration, you enter the MAC addresses of your PCs
    and laptops. Any other equipment that specifies in your network will block you
    from accessing it.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Another vital network security feature is disabling the broadcast of the SSID,
    or name of your network. It is best to refer to the manufacturer''s documentation
    for specifics. Most of the re q uired security features built in the wireless
    router, and this is the first point that needs to be secured. Many of the security
    settings are turned off by default. Make sure you turn them on for the best security.


    You can secure and manage your network yourself if you have the time, or you can
    buy a home networking software package that does it for you automatically. There
    are some excellent programs out there for under $30 that will secure and repair
    your home network.


    Setting Up A Secure Home Wireless Network - 2 Simple Steps To Protect Your Privac
    y


    Securing a home wireless network is a two-step process. The first step is to ensure
    network security by securing the wireless access point or router. All of this
    can usually do through the web-based software interface of the device by typing
    in the default address of ''192.168.0.1'', or ''192.168.1.1''.


    The first thing that needs to be changed is the administrator''s username and
    password. Many networks are hacked into, simply because nobody bothered changing
    the default values. These are the same as most VCRs still blinking noon because
    no one turned the time. Once it has done, enable MAC address filtering and add
    computers based on their MAC address. This option will allow only those specified
    computers to connect to the network but will not, however, guarantee total security.


    The network SSID defines a name for the network. The default value of this should
    change to a loose and long string. This value should be written down in a safe
    place and entered into the machines that are allowed to connect. Disabling the
    broadcast of the network SSID also provides an extra layer of security as the
    network will not advertise itself to outsiders.


    Encryption should also be enabled. The default encryption usually is weak and
    can break easily. Typically WEP (Wireless E q uivalent Privacy) is used for data
    encryption. However, where available, try and use WPA-PSK encryption. This method
    uses 256-bit encryption for transmitting data, and the key also changes, so it
    provides a far more secure alternative to WEP .'
