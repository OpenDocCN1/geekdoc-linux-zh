- pgno: 31
  md: 'that sent between you and the router and reveal your usernames, passwords or
    everything else that''s sent between your devices, regardless of whether you are
    using SSL. This attack is known as "Man In The Middle" or MITM, and it can easily
    be performed by even a rookie hacker rather quickly. Securing your Wireless will
    significantly lessen the chance of this occurring. Almost all hackers that try
    to get into WiFi''s will soon give up attempting to hack a secure wireless network
