    # ### How To Protect Your Wireless Network Against Hackers


    Creating a wireless network at your house is an excellent idea; it''s straughtforward
    to do, plus it enables you to surf the net conveniently from anywhere at your
    house. The problem is that lots of people are unaware of the danger that''s added
    when using the home Wireless in an insecure manner.


    If you want to protect your WiFi to prevent your neighbors from using up your
    bandwidth, then sure that''s a sound cause to protect your WiFi. However, it mustn''t
    be your primary worry. The most significant problem with insecure WiFis happens
    when a hacker is able to connect to your WiFi, if he succeeds on doing that then
