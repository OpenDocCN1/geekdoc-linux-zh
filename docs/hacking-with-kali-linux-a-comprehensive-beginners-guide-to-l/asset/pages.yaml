  md: '# INTRODUCTION


    # Ethical Hacking – What Is the Need to Learn


    This process is done by computer, and network experts called Ethical or white
    hat hackers. These people analyze and attack the security system of an organization
    to find and expose weaknesses that crackers can exploit and take advantage of
    it is essential to understand that unlike crackers, ethical hackers get permission
    from the relewant authority to go on and test the security of their information
    system. Cookies cause harm and loss to an organization and affect negatively to
    the integrity, availability, and confidentiality of an information system. So
    how did the concept of ethical hacking came up, and how is it done?


    The field of ethical hacking has been there in the computer world now for a while.
    Today, this subject has continued to gain much attention due to the increased
    availability and usage of computer resources and the internet. This growth and
    expansion of computer infrastructure have provided another avenue for interaction,
    and so has attracted significant organizations in businesses and governments.
    These bodies want to fully take advantage of the benefits offered by technology
