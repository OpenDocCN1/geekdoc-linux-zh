    by intruders or outsiders who are going to use their data for other purposes outside
    the ones that intended. By so doing, their privacy is going to be interfered with,
    something that is not desirable to many people, if not all.


    Due to the above-raised fear, organizations sought to find a way to approach and
    counter this problem. They came to discover that one of the best methods they
    can use to limit and control the threat posed by'
