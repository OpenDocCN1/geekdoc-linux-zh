    +   2. Utilize a strong encryption password


    I''m sure you hear this phrase a lot "Use a strong password," and numerous people
    are thinking to themselves that on WiFi, it''s not too crucial new flash - On
    WiFi, it''s vital to use strong passwords. It''s a piece of cake for a hacker
    to use a program that scans the WiFi for millions of password combinations in
    mere minutes and crack it. Use at least eight to ten characters and a mixture
