- fmt: '

    The `/usr` directory is a monster. Articles could be written just to explain it
    all. But to keep things short and sweet, the `/usr` is where all of your ''secondary''
    programs are stored. Given you love your music player, but it''s not crucial to
    your operating system actually functioning. So instead of putting all the executables
    in `/bin`, we break it up a bit. We place crucial system programs in `/bin` and
    non-critical programs into `/usr/bin`. The `/usr` directory could be seen as the
    Windows equivalent as `C:Program Files`.


    # The Not Temporary Files: `/var`


    ## `/var` (for varying or variable)

    `/var` acts like `/tmp` in the sense that the files located are ''temporary''
    but less ''temporary'' than those in `/tmp`. What this really means is the `/tmp`
    directory will most be deleted every time the system reboots, while the files
    in `/var` will not. `/var` is a place to keep ''persistent'' files. An example
    would be log files. Most system administrators wouldn''t want to delete their
    log files on every reboot, but the files could be removed or ''shrunk'' to a more
    manageable level at the administrator''s whim.


    Another example would be the `/var/mail` directory. It contains the mail being
    sent to users on the system. Some users will have hundreds of messages, while
    other users will have a few or none. The directory is growing and shrinking depending
    on the usage by the users. So in order to keep the disk usage under manageable
    levels, we place this activity under `/var`. On large systems, the system administrator
    will use a separate hard drive and ''mount'' the hard drive at `/var`. This allows
    the frequent disk access to remain on one hard drive and keep the overall system
    speedy.


    # How To Install Linux


    Linux Training - Linux Installation Help - How To Install the Linux OS from a
    New Download


    You can install Linux from CD or DVD onto a new computer system. This will allow
    you to learn how to use Linux to get real, practical Linux training and experience.
    In this article, we''re talking about a new system that doesn''t already have
    an operating system (like Windows) on it.


    You can download the Linux OS (operating system) as a Linux ISO file and burn
    it to CD or DVD yourself, or you can order Linux on CD or DVD and have it mailed
    to you.


    Linux Tips: Linux ISO files are large. Only download Linux if you have high-speed
    Internet access. You can buy and have the Linux OS delivered to you by mail very
    cheaply. Just do an Internet search for "list of linux cds" or "list of linux
    dvdds".


    Linux Tips: Linux DVDs hold a lot more programs than CDs. Order a Linux DVD version
    and you will have more software programs than a CD version and you will need fewer
    DVDs!


    # 7 Steps to Install Linux on a New Computer


    ### 1. Document Your Linux Settings

    During Linux installation, you need to specify some settings. These include the
    Linux programs and desktops you want installed, networking settings and disk sizes.


    ### 2. Boot with the Linux CD or DVD and Start the Linux Installation

    Do the steps to set up your system to boot from it. Shut down your system and
    boot it with the first Linux CD DVD and start the Linux installation routine.


    ### 3. Specify Your Linux Installation

    Follow the on-screen prompts and put in the settings you documented in Step 1.


    ### 4. Create a Regular ("Non-root") User

    You log in to work on a Linux system as a Linux "user", with a username and password.
    You can log in as the `root` user or as a "non-root" user. You log in and work
    on the Linux OS as the `root` user when you need to do system administration tasks.
    For example, you work as the `root` user to run a Linux command to create a new
    user, or do the steps to install a Linux server.


    When you install Linux, the `root` user is always created automatically for doing
    system tasks. However, for security reasons, you should never log in to a Linux
    desktop as the `root` user. At some point during the installation routine, you
    will be asked if you want to create one or more "regular" (non-root) Linux users.
    Always create at least one regular Linux user and log in as this user to do day-to-day
    tasks.


    ### 5. Let the Linux OS Install on Your Hard Disk

    After you specify the Linux installation settings and create one or more new Linux
    users, the installation routine will copy the Linux OS and software programs onto
    the hard disk in the system, and then reboot.


    ### 6. Log In to Test the System

    Once the system reboots, log in as a "regular" (non-root) Linux user to test that
    you can do work as this user. At this point, the Linux desktop appears and you
    can run Linux programs to test the system.


    Linux Tips: Remember not to log in to a Linux desktop as the `root` user. Test
    the `root` user by logging in as a regular Linux user and opening a terminal emulation
    window. Then run the `su` command to log in and work as the `root` user.


    ### 7. Have fun!

    The Linux OS is an amazing and extremely reliable system. And there are thousands
    of Linux software programs for all kinds of uses.


    By installing and running Linux you can get lots of great practical training experience
    while working with Linux. You can log in and work on the Linux OS as the `root`
    user. To get Linux there are two methods.


    ## Linux Training - Linux Installation Help - Linux Live CDs & Installation


    ## Two methods of getting Linux:

    1. Install Linux from CD DVD

    2. Boot from live CDs (without installing)


    ## Linux Live CDs - Pros

    1. The Linux OS boots and runs in a few minutes.

    2. A lengthy installation is not required.

    3. If you install Linux on Windows, you need to back up your system before you
    may damage Windows.

    4. You only need to get 1 live CD or DVD.


    ## Linux Live CDs - Cons

    1. The Linux OS and software programs are not copied onto the hard disk.

    2. You do not get system administration tasks.

    3. Linux DVDs hold more programs than CDs.

