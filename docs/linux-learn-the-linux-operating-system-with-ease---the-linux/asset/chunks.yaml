    # 深入理解 Linux


    ## 理解 Linux 文件系统


    Linux 在硬盘上组织文件的方式与 Windows 处理此任务的方式大不相同。从 Windows 转来的新 Linux 用户有时在目录间移动时会遇到困难，或者认为
    Linux 应该以与 Windows 相同的方式管理文件。


    这篇文章旨在帮助新用户掌握如何在新安装的系统中穿梭目录。需要说明的一个关键点是：Windows 处理的是“驱动器”（drives），如你的 C 盘或 D 盘；而
    Linux 处理的是被称为“挂载点”（mount points）的东西。这些是其他硬盘、CD/DVD 刻录机等连接到根分区的位置。别担心，稍后这一切都会变得意义明确。


    ### 一切从根目录开始：/


    被简单地称为 `/` 的根目录是起点。在不涉及技术细节的情况下，根目录的作用就像 Windows 中的“C 盘”。没有根分区，Linux 系统无法完全启动，就像删除
    `C:\WINDOWS` 文件夹会让你的 Windows 电脑无法运行一样。


    ### 它位于：/bin


    `/bin` 文件夹存放重要的系统程序。`bin` 是“binary”（二进制）的缩写。一些流行的程序：`date`、`less`、`more`、`cat`、`dmsg`。这些程序对于启动和完整的操作系统至关重要。虽然你可能永远不会亲自使用这些程序之一，但系统依赖于某些程序。


    ### 一切开始的地方：/boot


    顾名思，`/boot` 是文件存放的地方，主要是内核（kernel）。没有内核，就没有系统。`/boot` 中的另一个关键程序是引导加载程序（bootloader）。就像
    Linux 需要内核运行一样，引导加载程序是为了安装内核并启动。


    ### 每个设备都是文件：/dev


    在 Linux 中，每个设备都是一个文件。这意味着当你将硬盘连接到系统时，它会获得一个设备文件，允许系统与其交互。当内核找到新硬盘时，它会被分配一个文件 `/dev/sda`。`/dev`
    是目录，`sda` 是连接到硬盘的文件。所以如果你想格式化整个硬盘，可以输入命令 `dd if=/dev/null of=/dev`。`/dev/null`
    是一个“位桶”（bit bucket），意味着进入那里的一切东西都会被删除。


    ### 配置：/etc


    Linux 作为一个可定制的系统，将所有程序的配置文件保存在此目录中。大多数程序带有合理的默认值。但如果你想更改它怎么办？`/etc` 存储了大量文本文件，供你自定义程序的运行方式。需要注意的一点是
    `/etc` 管理全局默认设置。这意味着如果你更改此目录下的文件，它将影响整个系统。


    ### 共享库：/lib


    `/lib` 目录是将所有软件库保留在中心位置的方法。这里大部分（如果不是所有）文件都有 `.so` 扩展名，让你知道是共享对象文件（shared object
    files）。这些文件有助于防止被称为“软件膨胀”（software bloat）的问题。Windows 也有这些文件；它们被称为动态链接库，简称为 DLL。作为一名普通的
    Linux 用户，你可能永远不需要更改此文件夹中的任何内容。取决于你如何在计算机上安装软件，如果你的软件“依赖”另一个程序才能运行，你可能会遇到“缺少共享对象”的问题。Windows
    对应的对应物是“DLL 地狱”。


    ### 当你没有正确关机时：/lost+found


    此目录用于用户没有正确关闭系统（在系统仍在运行时直接关机）。在下次启动时，系统将尝试通过扫描硬盘上的损坏文件来自我修复，并尝试修复任何出现的问题。如果发现任何内容，它将被放置在
    `/lost+found` 目录，供系统管理员（你！）查看和检查。


    ### 挂载点所在地：/mnt 和 /media


    `/mnt` 和 `/media` 用于将其他设备附加到根目录。在 Windows 中，当你插入 USB 闪盘时，系统会给它分配一个字母（E:）。取决于你使用哪个
    Linux 发行版，设备会自动挂载，或者需要由用户手动挂载。大多数新版本会将其放在其中一个目录中。你可以浏览 `/mnt` 或 `/media` 内的文件。由于每个发行版都不同，因此无法与你的结果匹配。`/media`
    是 Linux 的新特性。旧版本主要使用 `/mnt` 来管理这些设备，但 `/media` 是默认的挂载位置。Linux 你在任何地方挂载（只要你有权限）。所以将其挂载到
    `/bin/` 或 `/var/log` 下通常不是个好主意，而 `/mnt` 和 `/media` 目录会让这变得更容易。


    ### 可选目录：/opt


    当没有其他合适的位置时，用户可以在这里安装软件。大多数主流发行版都有软件仓库，允许用户轻松地添加和删除大量程序。但当你需要一个不在仓库中的程序时怎么办？为了将软件包与外部包分离，有时安装它们的最佳方式是把它们放在
    `/opt`。这种做法并不常见，尽管每个发行版都不同。有些发行会将流行的 KDE 放在 `/opt`，而另一些则不会。我的个人准则是：当你安装的软件默认使用此目录时（Google
    Earth 程序就是如此），或者我正在安装一个不在软件仓库中的程序时使用 `/opt`。


    ### 内核目录：/proc 和 /sys


    这两个目录都包含了关于系统状态的丰富信息。proc/cpuinfo` 等文件包含了有关 CPU 的信息（速度、厂商、缓存大小）。`/proc` 目录正在逐渐被
    `/sys` 取代。


    ### 你曾在此，现已离开：/tmp


    `/tmp` 目录是“temporary”（临时）的缩写。所以考虑到这一点，我相信你可以推断出使用此目录的原因。你没错，是为了管理临时文件。程序可能会产生大量的“垃圾输出”，或需要写入文件来处理任务，但一旦任务完成文件就可以被删除。此目录提供了一个中心位置来执行这些操作，而不会让你的其他目录被这些文件填充。


    ### 程序所在地：/usr


