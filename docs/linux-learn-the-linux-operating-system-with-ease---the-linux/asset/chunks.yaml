    # Point Number 1: Don''t let any doubleclicks you discourage you.


    What you''re about to accomplish is within the realm of absolute possibility.
    You CAN use `Linux` to maintain your website, enhance it, optimize it and much
    more. None of this is beyond your ability. Socially perpetuated self-doubt, mass-belief
    that it''s all just too complicated and the pervasive notion that `Linux` is comprehensible
    only to computer science majors and "techies" are myths and falsehoods.


    You can master Linux as easily as you can master your ABCs. If that seems like
    over-simplification, believe me when I tell you it''s not. Remember how much easier
    it was to remember LMNOP than it was the rest of the alphabet? In simplistic terms,
    you''ll be learning how to help yourself by learning how to use Linux` to your
    advantage in much the same way. We''ll start with the parts that come easily,
    and the rest will fall into place over time, seemingly without effort!


    # Point Number 2: In order to make any of this work, your service provider will
    have to offer you the option of using a "shell account." This is the most common
    terminology for direct access to the underlying operating system. "Shell access"
    is also commonly understood. If you are already being hosted, be sure to use these
    terms when requesting the access you''ll need. All service providers understand
    what a "shell account," or "shell access" is and will be able to let you know,
    immediately, whether or not they offer their users that option.


    Tip: If you are in the consideration phase, and looking for a hosting provider,
    be sure to ask them if they offer you the option of a "shell account," or "shell
    access." It''s your call in the end, but, if they don''t, I would advise that
    you continue your search for a provider elsewhere.


    Tip: Most providers offer "shell accounts," or "shell access," but they don''t
    make a point of letting you know. In my experience, it''s never near the top of
    the list of features the hosting provider offers, and, most times, you have to
    go to the support page, or elsewhere, to find out. You just need to ask. If it''s
    something they offer, they''ll give it to you (however grudgingly); usually with
    simple login instructions. Hosting providers generally don''t like the thought
    of "regular" users mucking about with the underlying operating system, so they
    generally don''t make it a point to let you know you have this option!


    # Point Number 3: Now you''re going to need to get to your shell.


    This is a piece of puzzle that most service providers will assume you know how
    to. We''ll assume for the moment you don''t. For our purposes we''ll assume your
    provider is named `XYZ.com` and you already have access to the internet and that
    connection active when you connect to your "shell."


    There are certain things you''re going to need in order access your account; some
    you''ll have to get yourself and some you''ll most likely have from your service.


    Most importantly, you''ll need your connection information. You will get this
    from your service. It should include:


    1. The host name or IP address of the server you''ll need to connect to order
    your account (e.g. `webhost.com` or `somename.com`). You''ll almost never given
    IPs IPs. Your service provider should, however, include this information along
    with the server name (e.g. `webhost.com` - IPs: `192.68.24.176`). Having IPs to
    connect to can be advantageous if, for some reason, you can''t reach the server
    via the host name.

    2. Your login information. This will simply be a name and password.

    3. The method by which you can access your account. Generally this will be `SSH`
    (Secure Shell), but some hosts still use `Telnet` (Telecommunication Network).
    Don''t let the definitions I''ve included in parentheses put you off. They''re
    simply provided for completeness and shouldn''t concern you at this point. Their
    strict "definitions" may never concern you - They don''t concern me and I''ve
    been in the business for well over a!


    Basically, the difference between the two connection methods is as the internet
    as-is. This is one of the reasons most providers use `SSH`. `SSH` sends information
    over the internet in "encrypted" form. That is, `Telnet` is an "unsecure" protocol,
    while `SSH` is considered "secure." It''s much harder (if not nearly impossible)
    for someone to hack into your connection and "see" what you''re typing if the
    information is encrypted. Encrypted information is protected. Unencrypted information
    (what you''ll be sending if you use `Telnet`) can be read (by the proper hacker)
    as if he or she were looking over your shoulder watching you type!


    Tip: Don''t accept `Telnet` if it''s offered as a connection option. Insist on
    `SSH`. If `SSH` is not available from your provider, there are other options you
    can pursue, but they''re beyond the scope of this article.


    Next, you''ll need a method by which to connect, using the information given to
    you by your hosting provider. This is simply going to some software "client" that
    you''ll use to connect. `SSH` clients are available and can be downloaded at various
    sites on the internet (search for "SSH client"). You''ll be prompted with the
    number of options available!


    Tip: Using SSH client makes you feel better. They are powerful and highly effective
    clients. Almost all work out of the box (just start them up and look for a button
    that says "new connection," or something similar, and then you''ll be prompted
    with the host, user name and password received from your hosting provider. Just
    connect and you''re logging into your shell!


    # Point Number 4: Now, strangely enough (with most providers), you''ll be prompted
    with a "menu" once you login to your "shell." This will generally provide you
    with options such as editing files, sending email, uploading or downloading files,
    etc. A text-based menu is generally easy to follow. Options are presented on a
    numbered menu (possibly with letter alongside), you select the number (or letter)
    of the option you want to use and then you do whatever until you exit and come
    back to the menu. A simple menu might look like this:


    ```

    ---- Welcome to XYZ.com Shell Access -----

    1. Edit Files (e)

    2. Send Email (s)

    3. Upload Files (u)

    4. Download Files (d)

    5. Linux Shell (l)

    6. Quit (q)

    Enter your option

    ```


    Tip: If you use any option and it isn''t obvious how you can get back to the menu
    system, you can generally get back there by "killing" whatever program you''ve
    launched by selecting your option. This can usually be done by typing one of the
    following "control-character" sequences. `ctl+c`, `ctl+x`, `ctl+v`, `ctl+d`. The
    key combinations described here are simply the typing of two keys at once (denoted
    by the + symbol), so for `ctl+c` you would type the "control" key (usually "ctl"
    or "ctrl" on your keyboard) while simultaneously typing the "c" key. Just type
    them both at the same time. Nothing to it!


    Please note that all of these options may disconnect you completely from your
    server and should be used only after you''ve saved any work you''re doing.


    Not to worry; if you do get disconnected, all you need to do is connect again.
    Of course, any and/or all of these options may do nothing at all. If you just
    "need to disconnect and can find no remedy in your shell account, you can always
    take the guaranteed step of closing your SSH client.


    Now you have arrived!

