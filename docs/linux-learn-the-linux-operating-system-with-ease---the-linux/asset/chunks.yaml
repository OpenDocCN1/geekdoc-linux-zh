  trans: "\n\n```bash\nbash sudo nano /etc/docker/daemon.json\n```\n\n添加一个 `dns` 键，并将一个或多个\
    \ IP 地址作为值。如果文件已有内容，你只需要添加或编辑 `dns` 行即可。\n\n```json\n{\n  \"dns\": [\"8.8.8.8\"\
    , \"8.8.4.4\"]\n}\n```\n\n如果你的内部 DNS 服务器无法解析公共 IP 地址，请包含至少一个可以解析这些的 DNS 服务器，这样你就可以连接到\
    \ Docker Hub，并且你的容器可以解析互联网域名。\n\n保存并关闭文件。\n\n重启 Docker 守护进程。\n\n```bash\nsudo\
    \ service docker restart\n```\n\n通过尝试拉取镜像来验证 Docker 是否可以解析外部 IP 地址：\n\n```bash\n\
    docker pull hello-world\n```\n\n如有必要，通过 ping 主机名验证 Docker 容器是否可以解析内部主机名：\n\n```bash\n\
    docker run --rm -it alpine ping -c4 <my_internal_host>\n```\nPING google.com (192.168.1.2):\
    \ 56 data bytes\n64 bytes from 192.168.1.2: seq=0 ttl=41 time=7.597 ms\n64 bytes\
    \ from 192.168.1.2: seq=1 ttl=41 time=7.635 ms\n64 bytes from 192.168.1.2: seq=2\
    \ ttl=41 time=7.660 ms\n64 bytes from 192.168.1.2: seq=3 ttl=41 time=7.677 ms\n\
    \n## 禁用 dnsmasq\n\n### Ubuntu\n如果你不想更改 Docker 守护进程配置以使用特定的 IP 地址，请按照以下指令在 NetworkManager\
    \ 中禁用 `dnsmasq`。\n\n- 编辑 `/etc/NetworkManager/NetworkManager.conf` 文件。\n- 在行首添加\
    \ `#` 字符来注释掉 `dns=dnsmasq` 行：\n```bash\n# dns=dnsmasq\n```\n- 保存并关闭文件。\n- 重启 `NetworkManager`\
    \ 和 `Docker`。作为替代方案，你也可以重启系统。\n\n```bash\nsudo restart network-manager\nsudo restart\
    \ docker\n```\n\n### RHEL, CentOS, 或 Fedora\n在 RHEL、CentOS 或 Fedora 上禁用 `dnsmasq`：\n\
    \n1. 禁用 `dnsmasq` 服务：\n```bash\nsudo service dnsmasq stop\nsudo systemctl disable\
    \ dnsmasq\n```\n2. 使用 Red Hat 文档手动配置 DNS 服务器。\n\n## 通过防火墙允许访问远程 API\n\n如果你在运行\
    \ Docker 的同一台主机上运行了防火墙，并且你想从另一个主机访问 Docker Remote API 且已启用了远程访问，那么你需要配置防火墙允许 Docker\
    \ 端口的入站连接，该端口在启用 TLS 传输时默认为 2376，否则为 2375。\n\n### UFW 特定指令\nUFW（简单防火墙）默认丢弃所有转发入站流量。如果你想从另一个主机访问\
    \ Docker Remote API 且已启用远程访问，你需要配置 UFW 允许 Docker 端口的入站连接，该端口在启用 TLS 传输时默认为 2376，否则为\
    \ 2375。默认情况下，Docker 在使用 TLS 运行。如果不使用 TLS，强烈建议不要从远程主机访问 Docker Remote API，以防止权限提升攻击。\n\
    \n配置 UFW 并允许 Docker 端口的入站连接：\n- 验证 UFW 是否启用：\n```bash\nsudo ufw status\n```\n\
    - 如果 `ufw` 未启用，剩余步骤将无于事。\n- 编辑 UFW 配置文件，通常为 `/etc/default/ufw` 或 `/etc/ufw.conf`。将\
    \ `DEFAULT_FORWARD_POLICY` 设置为 `ACCEPT`：\n```bash\nDEFAULT_FORWARD_POLICY=\"ACCEPT\"\
    \n```\n- 保存并关闭文件。\n- 如果你需要启用从外部主机访问 Docker Remote API 并理解安全影响（请参见此操作前的配置），请配置\
    \ UFW 允许 Docker 端口的入站连接，如果不使用 TLS，端口为 2375，如果使用则为 2376：\n```bash\nsudo ufw allow\
    \ 2376\n```\n- 重新加载 UFW：\n```bash\nsudo ufw reload\n```\n\n## 你的内核不支持 cgroup swap\
    \ 限制\n在处理镜像时，你可能会看到类似的消息：\n`WARNING: Your kernel does not support swap limits.\
    \ Limitation discarded.`\n\n如果你不需要这些功能，可以忽略该警告。你可以按照以下指令在内核中启用这些功能。内存和交换空间计算会产生约总可用内存\
    \ 1% 的开销以及 10% 的整体性能下降，即使 Docker 未在运行。\n\n- 以具有 sudo 权限的用户身份登录 Ubuntu。\n- 编辑 `/etc/default/grub`\
    \ 文件。\n- 添加或编辑 `GRUB_CMDLINE_LINUX` 行以添加以下两个键值对：\n```bash\nGRUB_CMDLINE_LINUX=\"\
    cgroup_enable=memory swapaccount=1\"\n```\n- 保存并关闭文件。\n- 更新 GRUB：\n```bash\nsudo\
    \ update-grub\n```\n- 如果你的 GRUB 配置文件语法错误，将发生错误。在这种情况下，重复步骤 3 和 4：重启系统。内存和交换空间将已启用，警告将不再出现。\n\
    \n## 50 个实用的 Linux 应用\n如果你是 Windows 的难民，你可能会觉得 Linux 世界有点困惑，纳闷如何在获得 Windows 所有功能的同时，仍然享受\
    \ Linux 提供的服务。不要担心！Linux 不再那么难用了，它正变得越来越用户友好。因此，你可能在想应该安装哪些应用程序。以下是 Linux 用户喜爱的一系列实用且合理的应用程序，按推荐顺序排序。\n\
    \n如果你使用 Ubuntu 或 Mint，大多数这些应用程序可以在内置的软件中心 GUI 中找到，或者可以通过命令行安装。随着 Linux 经验的增加，你可能会发现自己更倾向于使用终端，但每个人对什么最适合自己都有自己的偏好。\n\
    \n### 终端命令\n`sudo apt install [packages]`\n\n1. **Thunderbird（雷鸟）**：自从带给我们 Firefox\
    \ 的时代起，Thunderbird 就是 Mozilla 的电子邮件客户端。虽然它仍在维护并持续发布各种错误修复，但已经有一段时间没有重大更新了。但真的，一个邮件客户端需要多大的“更新”呢？它可以发送和接收邮件吗？可以吗？好的，那么它的任务就完成了。\n\
    2. **Geary**：GNOME 3 桌面自带的邮件客户端。使用纯 GNOME 3 桌面的发行版（如 Fedora）可能会默认安装它。\n3. **Evolution（进化）**：不仅是一个邮件客户端，它作为一个完整的个人信息管理套件，包括日历等工具。它的功能与\
    \ Microsoft Outlook 非常相似，并根据需要连接到 Microsoft Exchange 服务器。\n4. **Firefox 或 Chrome**：常见，你知道它们是什么。但与其之间二选一，你也可以采取折中方案两个都安装！某些\
    \ Firefox 扩展在 Chrome 中没有，反之亦然。而且你可能想在两个浏览器之间区分某些书签和扩展，例如一个用于工作，一个用于娱乐。\n5. **LibreOffice**：作为\
    \ Microsoft Office 的 Linux 替代品，它可以完成 Microsoft Office 的所有功能，而且你不需要为它支付数百美元。大多数发行版默认包含\
    \ LibreOffice。\n6. **gscan2pdf**：一个用于扫描文档为 PDF 格式的简单程序，学生可能会发现它很有用，当你需要上传官方文件时也有帮助。\n\
    7. **KeePass**：如果你已经拥有太多账号和密码，到了无法在脑中记住所有它们的地步，那么 KeePass 对你将非常有用。它是一个密码管理器，可以将你所有的用户名和密码存储在加密数据库中。只需确保不要忘记\
    \ KeePass 密码即可！\n8. **VirtualBox**\n\n"
- fmt: '

    If you want to experiment with different Linux distributions, or different operating
    systems in general, you can install `VirtualBox` and run a virtual machine inside
    of your actual machine. Performance won’t be as good as a native OS installation,
    but if your system has enough resources you’ll notice minimal performance degradation.


    ### 9. WizNote

    A Linux alternative to Evernote, OneNote, and other similar note taking applications.


    ### 10. gdebi

    If you’re running a Debian-based system (such as Ubuntu or Mint), occasionally
    won’t be able to find certain software in the official repositories and you’ll
    have to install a `.deb` package (or install a PPA, if applicable). `gebi` allows
    you to execute `.deb` packages, which will install that particular software (you
    can think of `.deb` files as the Ubuntu/Mint/Debian equivalent to `.exe` files
    in Windows).


    ### 11. XDM or uGet

    Download managers. I personally don’t like download managers (with the exception
    of `DownloadAll` for Firefox, but that’s only used in certain cases), but some
    people do. In my opinion, browsers’ built-in download managers are sufficient.
    But hey, it’s your system, install whatever you like.


    ### 12. UFW/GUFW

    The Linux firewall. `GUFW` is the GUI version of `UFW`, which is typically run
    in a command line terminal. Super simple to configure and enable/disable, definitely
    less of a headache than Windows Firewall.


    ### 13. GIMP

    Linux’s answer to Photoshop. Probably the most popular image editor on Linux.


    ### 14. Pinta

    If you don’t need all the bells and whistles of GIMP, Pinta is a Linux alternative
    to MS Paint.


    ### 15. BleachBit

    The Linux equivalent to Windows’ CCleaner, with some extra features such as secure
    file shredding. Linux systems don’t typically need much cleaning in the first
    place, but when they do, `BleachBit` is handy tool to have.


    ### 16. ScudCloud

    An unofficial Linux client for the Slack messaging program (not to be confused
    with Slackr). If your organization communicates on Slack, you’ll want this. Slack
    itself has a Linux app that’s currently available for Ubuntu and Fedora.


    ### 17. Synaptic

    A package manager, installed by default on many but not all. It provides an alternative
    way to install and remove. Many advanced users prefer it over the included Software
    Center on distributions.


    ### 18. Dropbox

    Cloud storage, and they have an official native client! Something Google Drive
    lacks.


    ### 19. VLC

    The video player that will play anything requested. If you’re tired of always
    having to find codecs on Windows, `VLC` solves that problem for you. It can also
    play audio files as a downloader along with several hidden features not many know.


    ### 20. Unity Tool

    For Ubuntu systems, some advanced configurations aren’t included in a GUI by default
    and have to be via command. `Unity Tool` provides a GUI for these advanced configurations,
    most for GTK. There’s also a GNOME Tweak for desktops.


    ### 21. Sublime

    A beautiful text editor, and favorite among many developers. It’s free to try
    indefinitely, a rarity for Linux distributions as the majority are paid.


    ### 22. Atom

    Another beautiful text editor, with no price tag.


    ### 23. Notepad++

    If you’re fan of Notepad++ on Windows, you’ll be glad to know it has a Linux port
    called `Notepadqq`. May not be in your distribution’s official repositories, but
    you can always add a PPA or install the package manually.


    ### 24. Brackets

    Another text editor. They all do the same thing, they just have different sets
    of bells.


    ### 25. Cheese

    Linux’s webcam application. Some video chat apps require it as a dependency.


    ### 26. Gparted

    The GUI version to Linux’s command `parted`. Used for disk management (i.e. formatting
    and partitions).


    ### 27. CrashPlan

    Backup utility for Linux. Remember, if your data isn’t backed up in at least 2
    other places, it doesn’t exist.


    ### 28. Kodi

    All in one media player, similar to `VLC` in terms of functionality. Also used
    to run Steam on Arch Linux.


    ### 29. Genymotion

    If you develop for Android, you’ll need something to test your code on. `Genymotion`
    is an Android emulator so that you can test your Android apps without having to
    actually use an Android device.


    ### 30. Tomahawk

    An all-in-one music player that allows you to connect all of your music accounts
    (Spotify, YouTube, Last.fm, and more) together in one seamless application.


    ### 31. GNOME System Monitor

    Part of the GNOME desktop, the system monitor allows you to view information about
    your system in real time, such as CPU usage, RAM usage, temperatures, bandwidth,
    storage space, and more.


    ### 32. Conky

    The Linux alternative to Rainmeter on Windows. Generally used for system monitoring,
    `conky` will display lightweight “skins” on your desktop. Configuration is a bit
    hard but you can find help.


    ### 33. Transmission

    A torrent client, installed by default.


    ### 34. BitTorrent

    Another torrent client with no price.


    ### 35. Deluge

    A torrent-based client for torrents.


    ### 36. FileZilla

    Offering both client and server version, `FileZilla` is the best if you need it.


    ### 37. Steam

    Steam works on Linux now, many games are Windows only but you can use Proton to
    run them.


    ### 38. Wine

    A compatibility layer to run Windows applications on Linux.


    ### 39. Bottles

    A tool to manage `Wine` prefixes easily.


    ### 40. Lutris

    A platform for managing and playing games from sources on Linux.

