  trans: '


    # 第一点：不要让任何双击失败挫败了你。


    你即将完成的事情处于绝对可能的范围内。你**可以**使用 `Linux` 来维护你的网站、增强它、优化它以及更多。这一切都并非超出你的能力范围。社会所延续的自我怀疑、认为这一切太复杂的从众心理，以及认为
    `Linux` 只有计算机科学专业的学生和“技术极客”才能理解的普遍观念，都是神话和谎言。


    你可以像掌握字母表一样轻松掌握 Linux。如果这听起来像是过于简化，请相信我的话，这并非如此。还记得记住 LMNOP 比字母表的其他部分容易得多吗？简单来说，你将通过学习如何利用
    `Linux` 来帮助自己，方式大同。我们将从容易的部分开始，其余部分将随着时间的推移迎刃而解，似乎毫不费力！


    # 第二点：为了让这一切得以运行，你的服务提供商必须为你提供使用“shell 账户”（shell account）的选项。这是直接访问底层系统的最常用术语。“shell
    访问”（shell access）也被广泛理解。如果你已经在使用托管服务，在请求所需的访问权限时，请务必使用这些术语。所有的服务提供商都理解“shell 账户”或“shell
    访问”，并能够立即告知他们是否为用户提供该选项。


    提示：如果你处于考虑阶段并正在寻找托管提供商，请务必询问他们是否提供“shell 账户”或“shell 访问”选项。最终由由你决定，但如果他们不提供，我建议你继续寻找其他提供商。


    提示：大多数提供商提供“shell 账户”或“shell 访问”，但他们不会特意让你知道。根据我的经验，这绝不会出现在托管提供商提供的功能列表的最顶端，大多数时候，你必须去支持页面或其他地方才能找到。你只需要问。如果这是他们提供的服务，他们就会给你（无论多么不情愿）；通常会附带简单的登录说明。托管提供商通常不喜欢“普通”用户折腾底层操作系统，因此他们通常不会特意让你知道你有这个选项！


    # 第三点：现在，你需要进入你的 shell。


    这是大多数服务提供商假设你已经如何操作的拼图碎片。我们暂时假设你还。为了方便起见，我们假设你的提供商名为 `XYZ.com`，并且你已经连接了互联网，且在连接你的“shell”时连接处于激活状态。


    为了访问你的账户，你可能某些东西；有些你需要自己获取，有些你可能从服务处获得。


    最重要的是，你需要连接信息。你将从服务处获得这些信息。它应该包括：


    1. 连接到你的账户所需的服务器主机名或 IP 地址（例如 `webhost.com` 或 `somename.com`）。你几乎不会被直接给你 IP 地址。然而，你的服务提供商会将此信息与服务器名称一同提供（例如
    `webhost.com` - IPs: `192.68.24.176`）。如果由于某种原因无法通过主机名访问服务器，那么拥有用于连接的 IP 将会有优势。

    2. 你的登录信息。这简单来说用户名和密码。

    3. 你访问账户的方法。通常这将会是 `SSH`（安全外壳），但某些主机仍在使用 `Telnet`（电信网络网络）。不要让我在括号中提供的定义吓退了你。它们只是为了完整性而提供的，在目前阶段你不必考虑它们。它们严格的“定义”可能永远与你无关——它们与我无关，我已经在这个行业干了多年了！


    基本上，这两种连接方式的区别就像互联网本身一样。这就是大多数提供商使用 `SSH` 的原因之一。`SSH` 在互联网上以“加密”形式发送信息。也就是说，`Telnet`
    是一个“不安全”协议，而 `SSH` 被认为是“安全的”。如果信息是加密的，别人想要黑入你的连接并“看到”你输入的内容困难得多（如果不是的话）。加密信息受到保护。未加密的信息（如果你使用
    `Telnet` 时将发送的内容）可以被（合适的黑客）读取，就像他们站在你身后看着你打字一样！


    提示：如果 `Telnet` 作为连接选项提供，不要接受。坚持使用 `SSH`。如果你的提供商不支持 `SSH`，你还有其他可以尝试，但它们超出了本文的范围。


    接下来，你需要一种使用托管提供商提供的信息进行连接的方法。这简单就是使用一个你用来连接的软件“客户端”。`SSH` 客户端有很多，并可以在互联网上的各种网站下载（搜索“SSH
    client”）。系统会提示你有多少可用选项！


    提示：使用 SSH 客户端让你感觉更好。它们是强大且高效的客户端。几乎所有功能都是开箱即用的（只需启动它们并寻找标有“new connection”或类似字样的按钮，然后系统就会提示你）。使用
    SSH 客户端时会被提示输入从托管提供商处获得的主机、用户名和密码。只需连接，你就进入了你的 shell！


    # 第四点：现在，奇怪的是（对于大多数提供商），一旦你登录“shell”，就会收到一个“菜单”。这通常会为你提供编辑文件、发送电子邮件、上传或下载文件等选项。文本菜单通常易于操作。选项显示在一个编号列表中（可能附带字母），你选择想要使用的选项数字（或字母），然后进行操作直到返回菜单。一个简单的菜单可能如下：


    ```

    ---- Welcome to XYZ.com Shell -----

    1. Edit Files (e)

    2. Send Email (s)

    3. Upload Files (u)

    4. Download Files (d)

    5. Linux Shell (l)

    6. Quit (q)

    Enter your option

    ```


    提示：如果你使用了某个选项但不知道如何返回菜单，通常可以通过“杀死”你启动的任何程序来返回菜单。这通常可以通过输入以下一个控制字符序列来完成。`ctl+c`、`ctl+x`、`ctl+v`、`ctl+d`。这里描述的键组合只是同时按下两个键（用
    + 符号表示），所以对于 `ctl+c`，你需要在按下键盘上的“control”键（通常标记为“ctl”或“ctrl”）的同时按下“c”键。只需同时输入它们即可。非常简单！


    请注意，所有选项都可能导致你与服务器完全断开，应在保存正在进行的工作后使用。


    不用担心；如果确实断开了，你需要做的只是重新连接。当然，任何或所有选项都可能无效。如果你只是需要断开连接并在 shell 账户中找不到补救办法，你始终可以关闭
    SSH 客户端这一万无一失的方法。


    现在你到达了！


