- fmt: "\nRed Hat provides a facility for automating installs, which can be very useful.\
    \ Simply put create a text file with various specifications for the install, and\
    \ point the Red Hat installer at it, then sit back and let it go. This is very\
    \ useful if rolling out multiple machines, or giving users a method of recovery\
    \ (assuming their data files are safe). You can get more information at: http://www.redhat.com/mirrors/LDP/HOWTO/KickStart-HOWTO.html.\
    \ The configuration file can also be placed on a tftp server, in a directory named\
    \ for the IP address of the client, thus using a dhcp/tftp server you can completely\
    \ automate installs for machines if you know the MAC addresses of the client machine.\n\
    \n# Filesystem layout and structuring\n\nThere are a number of common attacks/exploits\
    \ in Linux (and UNIX) that can be reduced in risk and significance with a proper\
    \ directory and partition structure. One of the most common denial of service\
    \ attacks is to fill up the disk space with junk data, this can also happen unintentionally\
    \ with software that experiences a problem. This is typically defended against\
    \ by assigning root a set percentage of the disk space as reserve (usually 5-10%),\
    \ so on a 10 gig disk users would not be able to use the last 500 megs, this would\
    \ be reserved for root. This doesn't do you any good however if something running\
    \ as root, that generates log files, goes nuts, or is attacked and made to generate\
    \ massive log files. The next big attack that takes advantage of disk setup would\
    \ be `/tmp` races, and core dumps, programs that create links or files improperly\
    \ without checking to make sure they exist first, especially programs that run\
    \ as root. An attacker can then link `/tmp/foo` to `/etc/passwd` and potentially\
    \ add a account, wipe the password database out, and so on.\n\nMount options can\
    \ be used to mount a partition read only, not allow execution of programs, and\
    \ other useful things. You may encounter difficulties using these options however,\
    \ for example if you mount `/usr` as read only you will have significantly more\
    \ work when upgrading system components, especially on critical servers (such\
    \ as e-commerce machines) that need to be up and running, but also require critical\
    \ updates. More useful options are `nosuid` (no setuid or setgid files), `noexec`\
    \ (no executables) and `nodev` (no device files).\n\nSo with this in mind we have\
    \ several guidelines:\n\n- Put filesystems that users can write to on separate\
    \ partitions\n- Put filesystems with critical system components/configuration\
    \ on separate partitions\n- Consider mounting some partitions with system binaries\
    \ as read-only (this will make upgrades difficult), mounting `/bin/` and `/etc/`\
    \ however will make booting difficult (depending on your)\n\nSome not-exec flags\n\
    \nIf you mount `/tmp` as `noexec` it will not run, \n\nOne of the most common\
    \ denial of service attacks is to fill up the disk space with junk data, this\
    \ can also happen unintentionally with software that experiences a problem. This\
    \ is typically defended against by assigning root a set percentage of the disk\
    \ space as reserve (usually 5-10%), so on a 10 gig disk users would not be able\
    \ to use the last 500 megs, this would be reserved for root. This doesn't do you\
    \ any good however if something running as root, that generates log files, goes\
    \ nuts, or is attacked and made to generate massive log files. The next big attack\
    \ that takes advantage of disk setup would be `/tmp` races, and core dumps, programs\
    \ that create links or files improperly without checking to make sure they exist\
    \ first, especially programs that run as root. An attacker can then link `/tmp/foo`\
    \ to `/etc/passwd` and potentially add a account, wipe the password database out,\
    \ and so on.\n\nMount options can be used to mount a partition read only, not\
    \ allow execution of programs, and other useful things. You may encounter difficulties\
    \ using these options however, for example if you mount `/usr` as read only you\
    \ will have significantly more work when upgrading system components, especially\
    \ on critical servers (such as e-commerce machines) that need to be up and running,\
    \ but also require critical updates. More useful options are `nosuid` (no setuid\
    \ or setgid files), `noexec` (no executables) and `nodev` (no device files).\n\
    \nSo with this in mind we have several guidelines:\n\n- Put filesystems that users\
    \ can write to on separate partitions\n- Put filesystems with critical system\
    \ components/configuration on separate partitions\n- Consider mounting some partitions\
    \ with system binaries as read-only (this will make upgrades difficult), mounting\
    \ `/bin/` and `/etc/` however will make booting difficult (depending on your)\n\
    \nSome not-exec flags\n\nIf you mount `/tmp` as `noexec` it will not run, \n\n\
    # Hardening your Linux\n\nIf you are running Mandrake / Red Hat or a similar Linux\
    \ you can use the Bastile hardening script available at: http://www.bastile-linux.org/.\
    \ It will disable various servers, install login banners and generally automates\
    \ many of the tasks a security administrator will have do\n\n# Conclusion\n\n\
    Linux, like most UNIX systems uses a directory structure based off `/`, which\
    \ directories like `/home`, `/tmp`, `/usr`, and so on. These directories can be\
    \ placed on the same partition, or separate partitions, separating them properly\
    \ can have security (and performance) benefits. There are also a number of mounting\
    \ options that can be used to prevent common problems and attacks.\n\nThanks again\
    \ for taking the time to read this book!\n\nYou should now have a good understanding\
    \ of the Linux operating system, it’s benefits and how to properly use it.\n\n\
    If you enjoyed this book, please take the time to leave me a review on Amazon.\
    \ I appreciate your honest feedback, and it really helps me to continue producing\
