  trans: '


    `/usr` 目录是一个庞然大物。甚至可以写几篇文章来专门解释它。但为了简单明了，`/usr` 是存储你所有“次要”程序的地方。考虑到你喜欢你的音乐播放器，但它对操作系统的实际运行并非关重要。因此，我们没有将所有可执行文件都放在
    `/bin` 中，而是对其进行了拆分。我们将关键的系统程序放在 `/bin` 中，将非关键程序放入 `/usr/bin`。`/usr` 目录可以看作 Windows
    中的 `C:Program Files`。


    # 非临时文件：`/var`


    ## `/var`（代表变化的或可变的）

    `/var` 的作用类似于 `/tmp`，即其包含的文件是“临时性”的，但比 `/tmp` 中的文件没那么“临时”。这意味着这意味着 `/tmp` 目录在每次系统重启时大部分内容都会被删除，而
    `/var` 中的文件则不会。`/var` 是存放“持久性”文件的地方。日志文件就是一个例子。大多数系统管理员都不希望在每次重启时都删除日志文件，但管理员可以根据喜好删除这些文件或将其“缩小”到易于管理的水平。


    另一个例子是 `/var/mail` 目录。它包含了发送给系统用户的邮件。某些用户会有数百条消息，而其他用户只有几条或没有。该目录根据用户的使用情况而增长或缩小。因此，为了将磁盘占用保持在易于管理的范围内，我们将此类活动放在
    `/var` 下。在大型系统中，系统管理员将使用一个独立的硬盘并将将其“挂载”到 `/var`。这允许频繁的磁盘访问保持在一块硬盘上，从而保持整个系统的快速。


    # 如何安装 Linux


    Linux 培训 - Linux 安装帮助 - 如何从新下载安装 Linux 操作系统


    你可以从 CD 或 DVD 将 Linux 安装到新的计算机系统上。这将允许你学习如何使用 Linux 获取真实、实用的 Linux 培训和经验。在本文，我们讨论的是一个尚未安装操作系统（如
    Windows）的新系统。


    你可以将 Linux 操作系统下载为 Linux ISO 文件并自己刻录到 CD 或 DVD 中，你也可以订购 CD 或 DVD 版 Linux 并通过邮寄给你。


    Linux 提示：Linux ISO 文件很大。只有在你拥有高速互联网连接的情况下才下载 Linux。你可以非常廉地购买并通过邮寄接收 Linux 系统。只需在互联网上搜索“list
    of linux cds”或“list of linux dvdds”即可。


    Linux 提示：Linux DVD 包含的程序比 CD 多得多。订购 Linux DVD 版本将获得比 CD 版本更多的软件程序，而且需要的 DVD 更少！


    # 在新电脑上安装 Linux 的 7 个步骤


    ### 1. 记录你的 Linux 设置

    在 Linux 安装过程中，你需要指定某些设置。这些包括你想要安装的 Linux 程序和桌面、网络设置以及磁盘大小。


    ### 2. 使用 Linux CD 或 DVD 启动并开始 Linux 安装

    执行步骤使你的系统能够从其启动。关闭系统并使用第一张 Linux CD DVD 启动并开始 Linux 安装程序。


    ### 3. 指定你的 Linux 安装信息

    按照屏幕提示操作，并输入你在步骤 1 中记录的设置。


    ### 4. 创建普通（“非 root”）用户

    你以 Linux “用户”的身份登录 Linux 系统工作，拥有用户名和密码。你可以以 `root` 用户身份登录，也可以以“非 root”用户身份登录。当你需要执行系统管理任务时，以
    `root` 用户身份登录并在 Linux 操作系统上工作。例如，你以 `root` 用户身份运行 Linux 命令来创建新用户，或执行安装 Linux 服务器的步骤。


    当你安装 Linux 时，系统会自动创建一个用于系统任务的 `root` 用户。然而，出于安全考虑，你不永远应以 `root` 用户身份登录 Linux 桌面。在安装程序运行的某个阶段，系统会询问你是否想创建一个或多个“普通”（非
    root）Linux 用户。务必至少创建一个普通 Linux 用户，并以该用户身份登录执行日常任务。


    ### 5. 让 Linux 操作系统安装在你的硬盘上

    在指定 Linux 安装设置并创建一个或多个新 Linux 用户后，安装程序将把 Linux 操作系统和软件程序复制到系统的硬盘上，然后重启。


    ### 6. 登录测试系统

    系统重启后，以“普通”（非 root）Linux 用户身份登录，测试你是否可以以该用户身份工作。此时，Linux 桌面会出现，你可以运行 Linux 程序来测试系统。


    Linux 提示：记住不要以 `root` 用户身份登录 Linux 桌面。通过以普通 Linux 用户身份登录并打开终端模拟窗口来测试 `root` 用户。然后运行
    `su` 命令以 `root` 用户身份登录并工作。


    ### 7. 享受其中吧！

    Linux 操作系统是一个神奇且极其可靠的系统。有数千种用于各种用途的 Linux 软件。


    通过安装和运行 Linux，你可以在学习 Linux 时获得很多优秀的实践经验。你可以以 `root` 用户身份登录并操作 Linux。获取 Linux 有两种方法。


    ## Linux 培训 - Linux 安装帮助 - Linux Live CDs 与安装


    ## 获取 Linux 的两种方法：

    1. 从 CD DVD 安装 Linux

    2. 从 Live CDs 启动（不安装）


    ## Linux Live CDs - 优点

    1. Linux 操作系统可以在几分钟内启动并运行。

    2. 不需要漫长的安装过程。

    3. 如果你在 Windows 上安装 Linux，在可能损坏 Windows 之前需要备份系统。

    4. 你只需要 1 张刻光 CD 或 DVD。


    ## Linux Live CDs - 缺点

    1. Linux 操作系统和软件程序没有复制到硬盘上。

    2. 你无法执行系统管理任务。

    3. Linux DVD 包含的程序比 CD 多。


