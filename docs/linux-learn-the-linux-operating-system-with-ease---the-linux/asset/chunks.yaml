    as you explore your new environment. Be cautious, but have fun. It''s one of the
    best ways to learn!


    # Getting A Better Understanding Of Linux


    ## Understanding the Linux File System


    The way Linux organizes its files on the hard drive is vastly different from how
    Windows handles this task. New Linux users coming from Windows sometimes have
    a hard time maneuvering though directories or come with notions that Linux should
    manage its files in the same vein as Windows.


    This article was written to help new users get a grasp on moving through directories
    on their new installation. One key point to make is Windows deals with "drives"
    as in your C: drive or D: drive, Linux deals with something called mount points.
    These are locations where other hard drives, CD/DVD burners, etc... connect to
    the root partition. Don''t worry it will all make sense later on.


    ### All Begins With Root: /


    The root directory known simply as `/` is the starting point. Without getting
    to technical, the root directory acts like the ''C: Drive'' in Windows. A Linux
    system cannot fully boot without a root partition, in the same way as deleting
    your C:WINDOWS folder will make your Windows computer operable.


    ### It''s In: /bin


    The `/bin` folder holds important system programs. The `bin` is short for ''binary''.
    Some of the popular programs: `date`, `less`, `more`, `cat`, `dmsg`. These programs
    are essential in order to start and have a complete operating system. While you
    may never use one of these programs personally, the system relies on some of them.


    ### Where Everything Starts: /boot


    As the name implies, `/boot` is where files reside, mainly the kernel. Without
    the kernel, you don''t have a system. Another crucial program in /boot is the
    bootloader. Just like Linux needs the kernel to function. The bootloader is there
    to install the kernel and begin.


    ### Every Device Is A File: /dev


    In Linux, every device is a file. What this means is, when you connect a hard
    drive to your system it gets a device file that allows the system to interact
    with it. When the kernel locates a new hard drive it is assigned a file `/dev/sda`.
    The `/dev` is the directory and `sda` is the file that connects to the hard drive.
    So if you wanted to format your whole drive you could type the command `dd if=/dev/null
    of=/dev`. `/dev/null` is a "bit bucket" meaning everything that gets to it gets
    deleted.


    ### Configurations: /etc


    Linux, being a customizable system keeps all programs config files in this directory.
    Most programs come with a sensible default. But what happens if you want to change
    it? `/etc` holds a slew of text files for you to customize how your programs operate.
    An important not to make is `/etc` manages global defaults. What this means is
    if you change a file this directory, it will affect the whole system.


    ### Shared Libraries: /lib


    The `/lib` directory is a way to keep all software libraries in central location.
    Most (if not all) files here have an extension of `.so` to let you know they are
    shared object files. These files helpat helps prevent a problem known as ''software
    bloat''. Windows also has these files; they are called Dynamic Linked Libraries
    or DLL for short. As a regular Linux user, you will most likely never have to
    change anything in this folder. Depending on how you install software on your
    computer, you might come across a ''missing shared object'' problem if your software
    "depends" on another program to function. The Windows equivalent is ''DLL hell''.


    ### When You Don''t Shut Down Correctly: /lost+found


    This directory is used when the user does not shut down the system correctly (turning
    it off when the system is still up and running). Upon the next boot, the system
    will try and correct itself by scanning the hard drive for corrupt files and try
    to correct any problems that arise. If anything is found, it will be placed in
    the `/lost+found` directory for the systems administrator (you!) to see and look
    over.


    ### Mount Points Live: /mnt and /media


    The `/mnt` and `/media` are for attaching other devices to root directory. In
    Windows, when you insert a USB thumb, the system gives it a letter (E:). Depending
    on which Linux distribution you use, the device will either mount or the user
    has to mount. Most new place it in one of directories. You will be able to browse
    the files within `/mnt` or `/media`. Each distribution is different so could not
    match your results. `/media` is the new to Linux. Most older exclusively used
    `/mnt` to manage these devices, but `/media` is default location to mount. Linux
    allows you to mount device anywhere (as long as you have permissions). So it completely
    feasible to mount one under `/bin/mount` or `/var/log`. This is usually not a
    good idea and the `/mnt` and `/media` directories put in make this easier.


    ### Optional Directory: /opt


    This is where users can install software if no other suitable location can be
    used. Most software from major distributions have software repositories which
    allow users to easily add and remove tons of programs. But what happens when you
    need a program that isn''t in the repository? In order to separate software packages
    from external packages sometimes the best way to install them is putting them
    in `/opt`. This practice is rarely used though each distribution is different.
    Some will place the popular KDE into `/opt`, while others won''t. My personal
    rule of thumb is to use `/opt` when the software you are installing defaults to
    this directory (The Google Earth program does this) or I am installing a program
    that I didn''t get in the software repository.


    ### The Kernel''s Directory: /proc and /sys


    Both of these directories hold a wealth of information about the status of your
    system. Files like `/proc/cpuinfo` contain information about your CPU (speed,
    vendor, cache size). The `/proc` directory is slowly being faded out in favor
    of `/sys`.


    ### You Were Here And Now Your Gone: /tmp


    The `/tmp` directory is short for ''temporary''. So with that in mind, I am sure
    you can deduce why this directory is used. You got it, to manage temporary files.
    Programs can generate a lot of ''junk output'' or need to write to a file to handle
    a task but the file can be deleted once the task is completed. This directory
    provides a central location to do this and not fill your other directories with
    these files.


    ### Where the Programs Live: /usr

