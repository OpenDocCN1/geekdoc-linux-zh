    Red Hat 提供了一项自动化安装的工具，这非常有用。简单来说，创建一个包含各种安装规范的文本文件，并将 Red Hat 安装程序指向该文件，然后就可以静心等待它运行了。如果你在部署多台机器或为用户提供恢复方法时（假设其数据文件是安全的），这种方法会非常有用。你可以在此处获取更多信息：http://www.redhat.com/mirrors/LDP/HOWTO/KickStart-HOWTO.html。配置文件也可以放在
    tftp 服务器上，并放在以客户端 IP 地址命名的目录中，这样通过使用 dhcp/tftp 服务器，如果你知道客户端机器的 MAC 地址，就可以完全实现机器的自动化安装。


    # 文件系统布局与结构


    在 Linux（以及 UNIX）中存在许多常见的攻击/利用手段，通过合理的目录和分区结构，可以降低这些攻击的风险和影响。最常见的拒绝服务攻击之一是用垃圾数据填满磁盘空间，这也可能在软件出现问题时无意中发生。通常的防御方法是为
    root 用户分配固定百分比的磁盘空间作为预留空间（通常为 5-10%），因此在 10 GB 的磁盘上，用户无法使用最后的 500 MB，这部分空间将保留给
    root。但是，如果某个以 root 身份运行并生成日志文件的程序出现故障，或者受到攻击导致生成海量日志文件，这种方法对你毫无处。下一种利用磁盘设置的大型攻击是
    `/tmp` 竞态条件和核心转储（core dumps），即程序在不先检查文件是否存在的情况下不当创建创建链接或文件，特别是以 root 身份运行的程序。攻击者可以将
    `/tmp/foo` 链接到 `/etc/passwd` 并可能添加账户、清空密码数据库等。


    挂载选项可用于将分区设为只读、禁止执行程序以及其他有用功能。然而，在使用这些选项时可能会遇到困难，例如，如果你将 `/usr` 挂载为只读，那么在升级系统组件时你的工作量将大大增加，特别是对于那些需要保持运行又需要进行关键更新的关键服务器（例如电子商务机器）。更有用的选项是
    `nosuid`（不使用 setuid 或 setgid 文件）、`noexec`（不执行可执行文件）和 `nodev`（不允许设备文件）。


    考虑到这些，我们有几条准则：


    - 将用户可以写入的文件系统放在单独的分区上

    - 将包含关键系统组件/配置的文件系统放在单独的分区上

    - 考虑将某些包含系统二进制文件的分区挂载为只读（这将使升级变得困难），但挂载 `/bin/` 和 `/etc/` 将导致启动变得困难（取决于你的……）


    某些 noexec 标志


    如果你将 `/tmp` 挂载为 `noexec`，它将无法运行，


