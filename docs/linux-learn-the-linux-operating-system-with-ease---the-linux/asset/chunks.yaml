    If you want to create a sub-directory inside a new directory then use `-p` option
    with `mkdir`. I am going to create a directory called `distro` along with a sub-directory
    called `opensuse` inside it. If I run the `mkdir` command with `/distro/opensuse`
    as the path, it will throw an error that the directory `distro` doesn''t exist.
    That''s when the option `p` comes at play and creates all the directories in the
    given path:


    ```

    mkdir -p /home/swapnil/Downloads/distros/opensuse

    ```


    This command will create new directory `distros` and sub-directory `opensuse`
    inside it.


    ### And now let''s delete them


    If you want to delete any file or directory the command is `rm` (for files) and
    `rm -r` (for directories). You need to be very careful with this command because
    if you fail to give the correct path of the file or directory then it will remove
    everything from the current directory and you may lose precious data. The command
    is simple:


    ```

    rm /path-of-the-directory-or-file

    ```


    If I want to remove the opensuse directory, the command would be:


    ```

    rm -r /home/swapnil/Downloads/distros/opensuse/

    ```


    However, if you want to delete all the content of a directory without deleting
    the directory itself use the `*` wildcard with a slash. Let''s say I want to delete
    all the content of opensuse directory:


    ```

    rm /home/swapnil/Downloads/distros/opensuse/*

    ```


    If there are sub-directories inside, for example, opensuse directory then you
    will need that `-r` option to also delete the sub-directories:


    ```

    rm -r /home/swapnil/Downloads/distros/opensuse/*

    ```


