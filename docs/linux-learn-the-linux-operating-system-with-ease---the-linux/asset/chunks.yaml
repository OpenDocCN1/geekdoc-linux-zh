    ## 介绍

    Linux 系统让初学者感到畏畏，因为他们偶尔需要输入一两个命令。然而，Linux 命令（更准确地说是 shell 命令）遵循一种相当逻辑化且合理的模式，你只需要习惯它即可！大多数
    shell 命令长度大约为 3 个字母，最多 4 个字母。更频繁使用的命令通常会进一步缩短。


    `man` 命令是“manual”（手册）的缩写，即 Linux 系统预装的文档，用于帮助你解决用户遇到的常见问题。这些 `man(ual)` 页面显然不是为初学者准备的独立指南，而是应该作为参考材料，用来证实你在其他地方学到或尝试过的内容。


    `info` 命令是另一种查找 GNU 信息和故障排除参考材料的方法。它与 man 页面并不完全相同，因为它提供了使用“超链接”的空间，以便于你浏览所需的材料。它还有用于翻页的快捷键。


    `date` 命令自言自义。它会告诉你系统当前的和日期。在这些日子里，`date` 命令将显示日期和月份（或年份）。


    `ls` 命令旨在帮助你列出所选目录的内容。这意味着你将看到目录中的所有文件和目录。该命令具有开关（switches），可以修改其行为和功能。例如，在 `ls`
    之后添加 `-l` 将为你提供当前所在目录的更详细描述。你将看到关于文件权限、日期、大小所有者的详细信息。`-a` 开关帮助你查看目录中的所有文件，包括隐藏文件（以
    `.` 开头的隐藏文件）。


    如果你忘记了当前所在的目录，输入 `pwd`，它会打印当前目录。一旦你了解了这一点，就可以使用 `cd` 命令在 Linux 系统中导航了，`cd` 代表“change
    directory”（更改目录）。这可以在相对路径和绝对路径上运行，即你可以通过指定整个目录来操作，从 `/`（根目录）到你想要去的目录/文件。否则，你也可以使用
    `.` 或 `..`。后者告诉编译器你想进入当前目录的父目录，从而避免了输入整个路径。


    当你开始处理简单文件（如文本文件）时，`cat` 命令大派用场。它能“连接”（concatenate）一个或多个文本文件的内容，让你看到它们的内容。


    `ps` 命令列出当前系统终端运行的所有进程。


    本页中的 shell 命令是入门 Linux 环境的好方法。它们足够简单，让你了解整个系统是如何工作的，并可能帮助你以后尝试更高级的步骤！


    ## 如何入门

    用于易于使用和管理的基础 Linux - 入门！


    欢迎来到更简单的网站管理的起点！


    本章是系列教程的第一部分，面向拥有普通托管网站的普通用户；即那些对互联网底层没有海量技术知识的人。我们将看到，利用托管服务商更“复杂”的部分其实很容易，而且也能让你的网站管理变得更容易。我将为你提供一个简单的
    Linux 使用路线图，我相信这不仅对你有益，最终将赋予你更大的能力。


    好消息是：你不需要妥协！


    在适当的情况下，你可以增强挖掘网站潜力的能力，而且讽刺的是，通过利用底层操作系统，你可以增加你的“易用性”。


