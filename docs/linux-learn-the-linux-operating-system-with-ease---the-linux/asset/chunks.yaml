- fmt: '

    Linux Tips: Before getting a Linux live CD / DVD, do some research to make sure
    you can save your work. Some Linux live distributions let you save your data and
    some don''t. For example, the Ubuntu Linux live CD allows you to save your work
    to a USB flash drive.


    Linux Live CDs - Cons


    1. Although booting from a Linux live CD / DVD is faster than doing a complete
    Linux installation, you still need to wait while your system boots from the live
    CD / DVD every time your system starts. If you usually keep your system turned
    on, this isn''t an issue.

    2. You may not be able to save your work. Some Linux live CD / DVD distributions
    allow you to save your work and some don''t.

    3. You need to boot from the Linux live CD / DVD every time your system starts.
    This may not be very convenient if you need to put other CDs or DVDs in the drive
    while running Linux "live". Any time you need to put something in your drive,
    you have to remove the live CD / DVD. This also increases the likelihood that
    your live CD or DVD will become damaged.


    Linux Tips: Keep a copy of your current Linux live CD handy in case your working
    copy becomes damaged.


    Either way, installing Linux or using Linux live CDs (or Linux live DVDs), is
    an excellent way to get Linux training so you can learn how to use Linux.


    # First Steps With Linux


    ## Trying Linux for the First Time: A Beginner’s Guide


    You’re probably familiar with Windows and/or Mac OS. But they aren''t the only
    operating systems available. A popular alternative is Linux. In this chapter,
    Leslie Lutomski introduces Linux and what you need to know to give it a try.


    I''m constantly surprised by people who tell me they''d like to try Linux, but
    think it''s “too hard”.


    There seems to be a common misunderstanding that Linux is “for geeks”. Certainly,
    this was once the case: dedicated users compiled their own kernels, and it wasn''t
    for the faint-hearted.


    But Linux has come a long way since those days. So, if you''ve never tried it,
    or tried it many years ago and gave up, I''d encourage you to think again.


    ### Choose Your Flavor


    Linux comes in many "flavors", or "distributions"—normally referred to as distros.
    Some of these are aimed firmly at a mainstream audience, and I''d suggest using
    one of these to get your feet wet. The best known of these is possibly Ubuntu,
    which is the one I use and the one I''ll concentrate on here. Linux Mint is also
    popular, but there are many more.


    ### Difficult or Not?


    So is it difficult to use? Not in my experience. The first thing I noticed when
    we switched to Ubuntu was the sudden reduction in the number of distress calls
    I received from my husband. He seemed to experience fewer problems using Linux
    than he had on Windows, and seemed to feel more confident trying things for himself
    rather than panicking that he might “break something”. I suggested Xubuntu for
    an old friend who had never used a computer of any kind and she got it.


    ### What Are the Benefits?


    For many people, cost will be a consideration. Most popular distributions—and
    their software—are free to download and use. For others, open nature.


    Linux is also less susceptible to viruses than Windows. The main reason for this
    is simply that most viruses are designed to target Windows machines and will have
    no effect on Linux. It''s not true that Linux systems are immune to viruses, but
    they are rare. Documentation can be found here.


    This added security is one reason to choose it for older friends. Although Linux
    viruses are rare, ClAV is free and helps you don''t inadvertently download and
    pass viruses to friends with Windows.


    ### Will Linux Be Compatible with My Hardware?


    Linux will run well on most PCs, although if you have the very cutting-edge technology,
    you may find it''s not supported. On the other hand, installing Linux can be a
    great way to breathe new life into old hardware. Some distributions are designed
    to be lightweight—such as the Ubuntu variant Xubuntu—and will perform well on
    systems with limited resources. It''s also possible to run Linux on Mac, although
    I have no experience of this. The Ubuntu Forums—a great source of help and support—have
    a dedicated section for Apple hardware users.


    ### How to Choose a Distro?


    The easiest way is simply to try one and see if you like it. Many distributions
    are free to download, after which you can burn them to DVD. They can then be run
    as a “live” CD/DVD. In other words, you boot your system from the DVD—or a USB
    drive—and run the OS from there. It doesn''t have to be installed, and nothing
    is written to your hard drive—although you should be able to access files on your
    hard drive while in Linux. This is a great way to get a feel for the distro at
    no risk, and it also lets you check there are no problems with your hardware.
    The Ubuntu site provides very clear tutorials for getting all this done.


    ### How Do I Install It?


    Again, this is a simple process. The “live” CD/DVD includes options to install
    the system, should you choose to do so, and will walk you through the process.
    You can choose to install alongside another OS—either on the same drive or separate—and
    run dual. This allows you to use either system. You can run it in a VM. If you
    decide to install Ubuntu or its variant, as a dual-boot or standalone, the process
    is as simple as answering a few questions and sitting back while Linux does the
    work. If you''re installing alongside an existing OS, Ubuntu will take care of
    it. We warned that Linux uses a different filesystem than Windows. While Linux
    will be able to read and write to Windows partition, Windows won''t read the Linux
    partition. If you''re dual-booting and need to access files from both systems,
    ensure you save them to a partition formatted as FAT. My experience of this as
    a first-time user was not straightforward. I added a second hard drive for Ubuntu
    and installation went smoothly. Afterwards, I booted into Ubuntu and everything
    was great—until I tried to boot Windows and couldn''t. After a brief panic, I
    headed off to the Ubuntu Forums, where somebody walked me through a couple of
    possible solutions until found one which worked for me. That was years ago, and
    the only time I had an issue like that.


    ### What About Other Software?


    This is probably the ultimate determinant of whether or not Linux is for you.
    On one hand, you have access to a great deal of free, easy-to-install software;
    on the other, many popular applications are not available for Linux. You can,
    of course, run a VM, or an alternative is to use Wine, which is a kind of translation
    layer for Windows software. Wine website maintains an Application Database that
    gives guidance on how well each application runs under Wine. Often this can vary
    greatly, depending on the version of the software, as in these results for Photoshop:
    I had good successes with old games and smaller apps, but generally speaking,
    I use native Linux alternatives. LibreOffice (a fork of OpenOffice) comes installed
    as standard, as does Firefox. Chromium is the native Linux version of the Chrome
    browser and supports many of the same extensions. GIMP is a near replacement for
    Photoshop, although opinions vary on how well it compares. In addition to the
    bundled applications, other software is easy to install from the repositories.
    Ubuntu now comes with the Ubuntu Software Centre, which is a graphical interface
    that lets you find software by category. I tend to prefer the older Synaptic Package
    Manager. You can search for an application by name or keyword.


    ### What About Updates?

