- fmt: '

    All technical security measures will eventually fail or be vulnerable to an attacker.
    This is why you must have multiple layers of protection. Firewalls are not enough,
    you may accidentally forget a rule or leave yourself exposed while initializing
    a ruleset, use `tcp_wrapper` to restrict access to services as well where possible.
    Restrict which users can access these services, especially if only a few users
    need access. Encrypt traffic where possible so that attackers cannot easily sniff
    usernames and passwords or hijack sessions. Since security measures will fail
    you also need a strong audit and logging process so that you can later find out
    what went wrong and how bad it is.


    ## Technical problems


    These are just a handful of thousands of specific technical problems facing security
    administrators.


    ### Network Connectivity


    One of the biggest challenges is the increase in network connectivity. If you
    have a machine that is not connected to any other machines an attacker will generally
    need to gain physical access. This of course greatly narrows down the number of
    attackers. However with everything connected to the Internet there are over 100
    million people that can potentially get into your machine.


    ### Insecure defaults


    This is one of the problems that has caused no end of security problems since
    day one. Vendors typically ship their operating systems with insecure defaults
    (i.e. finger, telnet, ftp, etc.) meaning that administrators must expend a lot
    of effort to close security problems before they can even start to proactively
    secure their systems and networks.


    ### Legitimate access vs. a break in


    Because you must grant legitimate users access to resources there is always the
    potential for attackers to gain access. Attacker can guess authentication credentials
    (i.e. weak passwords), steal them (password sniffing), exploit flaws in the server
    itself and so on.


    ### Minimizing access and privilege


    When possible restrict access. If you do not need to run finger turn it off and
    remove it. An attacker cannot exploit finger if it isn''t present. Keep users
    off of servers if possible, if they need shell accounts for some reason set a
    separate system and partition it off from the rest of your network. Lock down
    workstations where possible, set BIOS passwords, secure the boot sequence, do
    not give them administrative access.


    ## Linux Administrator''s Security Guide


    ### Linux Installation


    How you install Linux will have a big impact on how much you will be able to secure.
    If you install Linux from an untrusted source you could potentially end up with
    an installation that has backdoors or other security issues. If you install packages
    you do not need and forget out there is a greater chance that someone will be
    able to break in. As well are security tasks that are best handled during installation,
    attempting to do them can be trouble.


    #### Verifying packages and files


    Issues of install packages and files are safer. Buying Linux on CD from a vendor
    such as Red Hat store is relatively safe and chances of acquiring a trojaned CD
    is unlikely. Installing Linux via ftp from a remote server provides an attacker
    ways to replace packages with modified versions. The good news is public/private
    cryptography most vendors have a keypair they use to sign packages, you can verify
    these signatures with the public key. These public keys can be downloaded online
    and most vendors include them on their CDs. A list of vendor key names, IDs, fingerprints
    and the keys themselves are available.


    You first need to download the vendors PGP or GnuPG key, for example Red Hat’s
    signing key has the identity of "security@redhat.com" and the fingerprint is:
    CA20 8686 2BD6 9DFC 65F6 ECC4 2191 80CD DB42 A60E


    Generally speaking you can download the vendor keys from their websites, and many
    vendors ship the key on their CDs. To verify a directory full of RPMs this simple
    script will automate the task:


    ```bash

    [user@server RPMS]# for a in *.rpm

    do

    rpm -K $a >> ~/sign-log

    done

    ```


    The file sign-log should consists of lines like:

    ElectricFence-2.2.2-5.i386.rpm: md5 gpg OK

    ImageMagic-5.2.2-5.i386.rpm: md5 gpg OK

    ImageMagick-devel-5.2.2-5.i386.rpm: md5 gpg OK

    Inti-0.5preview-1.i386.rpm: OK


    You cannot secure your installation very well if an attacker manages to compromise
    the system before you even install it. While it is rare for an attacker to try
    and compromise installation media it is certainly possible. The first step is
    to verify the packages and installation files on your installation media, this
    can be done by checking GnuPG signatures on the RPMs/etc, and the other files,
    although finding the signatures of the other files or MD5 sums is relatively tricky
    it is possible. The next step is to secure the system providing the files and
    the path between this system and the machine you are installing on. This is very
    easy with a CD-ROM, and much more if doing FTP or NFS over a system you do not
    control. It is suggested you use a server that you control to host installation
    files.


    CDs are typically the easiest to install from and relatively secure. If you purchase
    CDs from the vendor it is unlikely they have been compromised, all you do is simply
    from them and install the software. You can leave the machine offline for the
    installation and if you burn updates onto a CD you can easily update the system
    without needing to bring it online. It is recommended to keep CDs around that
    you can install as needed.


    Installing from local harddrive is also a relatively secure way of installing.
    Simply partition the drive first (if you are installing Linux to it) and then
    copy the files onto partition, boot the system and you go. Installing from the
    harddrive provides benefits of installing from CD without need to burn CDs. As
    well you can easily copy all updates to the drive and then install them on the
    first reboot and bring the system completely to date. Additionally with the increased
    availability of external hardrives utilizing FireWire and USB ports it is relatively
    easy to plug a harddrive into system without needing to take it apart (assuming
    of installation disk supports it).


    #### Network (FTP / NFS)


    These two methods are very convenient, all you need is a single disk (typically)
    and a server with all the files. Simply mirror the directory structure you need
    (typically something like `/pub/redhat/7.1/en/i386`) and then make it accessible
    via ftp (anonymous or username/password required) or via NFS (to the IP or subnet
    you use for installations). The files only need to be readable, there is absolutely
    no need for writing to them and in fact you are probably better off removing the
    write bit for all to prevent "accidents". These network methods can also be combined
    with automated installations such as Kickstart, or you can do your own custom
    installation sorts (by removing packages you do not want for example). If you
    choose to do network installs it is critical that the NFS/FTP server remains secure,
    to this end I highly recommend using a protected subnet, not attached to your
    main network if possible.


    #### Automating installs


    Automating installs can relieve tedium and prevent security problems. If you have
    to do 100 Linux installs chances are you will make error if you have to do them
    each manually. However if you can create an automated installation that is secured
    then it is much less likely that you will have problems.


    Red Hat Kickstart

