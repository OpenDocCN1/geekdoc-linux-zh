  trans: '


    所有的技术安全措施最终都会失败或容易受到攻击者的利用。这就是为什么你必须建立多层防护。仅靠防火墙是不够的，你可能会无意中忘记某条规则，或者在初始化规则集时让自己暴露在风险，尽可能使用
    `tcp_wrapper` 来限制对服务的访问。限制哪些用户可以访问这些服务，特别是只有少数用户需要访问时。尽可能对流量进行加密，以便攻击者无法轻易嗅探用户名和密码，或劫持会话。由于安全措施可能会失效，你还需要一个强大的审计和日志流程，以便日后查出出了什么问题以及情况有多严重。


    ## 技术问题


    这些只是安全管理员面临的成千上万特定问题的冰一角。


    ### 网络连接


    最大的挑战之一是网络连接性的增加。如果你有一台没有连接到任何机器的机器，攻击者通常需要获得物理访问。这无疑在很大程度上缩小了攻击者的数量。然而，随着万物连接到互联网，有超过
    1 亿人可能进入你的机器。


    ### 不安全的默认设置


    这是自从第一天起就引起无数安全问题的问题之一。供应商通常在发行操作系统时带有不安全的默认设置（例如 finger、telnet、ftp 等），这意味着管理员在能够开始主动加固其系统和网络之前，必须花费大量精力来关闭这些安全漏洞。


    ### 合法访问 vs. 破入


    由于你必须授予合法用户访问资源的权限，因此攻击者始终有获得访问可能。攻击者可以猜测身份验证凭据（例如弱密码）、窃取凭据（密码嗅探）、利用服务器本身的漏洞等。


    ### 最小化访问和权限


    尽可能限制访问。如果你不需要运行 finger，请将其关闭并删除。如果 finger 不存在，攻击者就无法利用它。如果可能，不要让用户留在服务器上；如果他们由于某些原因需要
    shell 账户，请为此设置一个单独的系统并将其与你的网络其余部分隔离开。尽可能锁定工作站，设置 BIOS 密码，保护启动序列，不要给他们管理员权限。


    ## Linux 体系员安全指南


    ### Linux 安装


    你如何安装 Linux 将对你所能够实现的加固程度产生巨大影响。如果你从不可信的源安装 Linux，你可能会得到一个带有后门或其他安全问题的安装版本。如果你安装了不需要的软件包并忘记删除，那么别人闯入的可能性就会更大。此外，某些安全任务最好在安装期间处理，尝试在之后完成可能会带来麻烦。


    #### 验证软件包和文件


    安装软件包和文件的操作相对安全。从 Red Hat 商店等供应商处购买 CD 版 Linux 是相对安全的，获取带木马 CD 的可能性很小。通过远程服务器从
    ftp 安装 Linux 会为攻击者提供将软件包替换为修改版本的机会。好消息是公钥/私钥加密，大多数供应商都有一对用于签名软件包的密钥对，你可以用公钥验证这些签名。这些公钥可以在网上下载，且大多数供应商会在他们的
    CD 中包含它们。可以获取供应商密钥名称、ID、指纹和密钥本身的列表。


    你首先需要下载供应商的 PGP 或 GnuPG 密钥，例如，Red Hat 的签名密钥身份为 "security@redhat.com"，其指纹为：CA20
    8686 2BD6 9DFC 65F6 ECC4 2191 80CD DB42 A60E


    通常情况下，你可以从他们的网站下载供应商密钥，许多供应商会在其 CD 中附带密钥。要验证一个包含多个 RPM 的目录，这个简单的脚本可以完成该任务：


    ```bash

    [user@server RPMS]# for a in *.rpm

    do

    rpm -K $a >> ~/sign-log

    done

    ```


    sign-log 文件应该包含如下行：

    ElectricFence-2.2.2-5.i386.rpm: md5 gpg OK

    ImageMagic-5.2.2-5.i386.rpm: md5 gpg OK

    Imageick-5.2.2-5.i386.rpm: md5 gpg OK

    Inti-0.5-preview.i386.rpm: md5 gpg OK


    通常情况下，你可以从他们的网站下载供应商密钥，许多供应商会在其 CD 中附带密钥。要验证一个包含多个 RPM 的目录，这个简单的脚本可以完成该任务：


    ```bash

    [user@server RPMS]# for a in *.rpm

    do

    rpm -K $a >> ~/sign-log

    done

    ```


    sign-log 文件应该包含如下行：

    ElectricFence-2.2.2-5.i386.rpm: md5 gpg OK

    ImageMagic-5.2.2-5.i386.rpm: md5 gpg OK

    Imageick-5.2.2-5.i386.rpm: md5 gpg OK

    Inti-0.5-preview.i386.rpm: md5 gpg OK


    由于安全措施可能会失效，你还需要一个强大的审计和日志流程，以便日后查出出了什么问题以及情况有多严重。


    （注：由于提供的文本中存在部分重复和逻辑断层，翻译时已根据技术文档语境进行了平滑处理，并保持了 Markdown 格式的完整性。）


