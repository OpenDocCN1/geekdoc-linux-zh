    # 加固你的 Linux


    如果你正在运行 Mandrake / Red Hat 或类似的 Linux，可以使用在此处获取的 Bastile 加固脚本：http://www.bastile-linux.org/。它将禁用各种服务器、安装登录横幅，并通俗地自动化安全管理员需要完成的许多任务


    # 结论


    Linux 与大多数 UNIX 系统一样，使用基于 `/` 的目录结构，例如 `/home`、`/tmp`、`/usr` 等。这些目录可以放在同一个分区上，也可以放在单独的分区上，合理地分离它们可以在安全（和性能）带来益处。还有许多挂载选项可以防止常见的问题和攻击。


