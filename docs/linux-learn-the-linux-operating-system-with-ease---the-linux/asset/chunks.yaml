    ## Introduction

    The Linux system often intimidates beginners, because of the need to type in a
    command or two ever now and then. However, Linux commands (or shell commands,
    to put it more accurately) follow a rather logical and sensible pattern and all
    you need to do is get used to it! Most shell commands are roughly 3, or at most
    4 letters long. The more frequently needed commands are shortened further usually.


    The `man` command is a reference to ''manual'', i.e. the documentation that comes
    preloaded in Linux systems to help you with common problems faced by a user. These
    `man(ual)` pages are certainly not meant to be standalone guides for beginners,
    but instead, they need to be used as reference material to corroborate what you''ve
    learnt/tried elsewhere.


    The `info` command is another way to look up reference material for GNU information
    and troubleshooting suggestions. It isn''t completely the same as the man pages,
    as there is a scope for using ''hyperlinks'', to make it easier to browse through
    the material you need. There are shortcuts for scrolling through pages.


    The `date` command is self-explanatory. It will tell you about the current time
    and date on system. On those days, the `date` command will display a date and
    month (or year).


    The `ls` command is meant to help you list the contents of the directory you choose.
    This means that you will get to see all files and directories in your directory.
    This command has switches to modify its behavior and function. For example, adding
    `-l` after `ls` will give you a more detailed description of the directory you''re
    in. you''ll get to see details about file permissions, dates, sizes and owners.
    The `-a` switch helps you see all the files in your directory including hidden
    (hidden files starting with a ''.'')


    In case you lose track of the directory you are in, type `pwd`, which prints the
    current directory. Once you''ve got to know that, you can navigate around the
    Linux system using the `cd` command, where `cd` stands for ''change directory''.
    This can work on both relative and absolute terms, i.e., you can work by specifying
    the entire directory, starting from `/` (the home directory) to the directory/file
    you want to go. Otherwise, you can also use the `.` or `..`. The latter tells
    the compiler you want to go to the parent directory of your current one, making
    it an easy alternative to typing the entire path every.


    When you start working with simple files, like text files, the `cat` command will
    come in handy. It ''concatenates'' the content of one or more text files, letting
    you see all of the text they contain.


    The `ps` command lists all the processes currently running on your system in your
    current terminal.


    The shell commands in this page are a good way to start off in the Linux environment.
    They are simple enough for you to get an idea of how the entire system works,
    and will probably help you to try more advanced steps later!


    ## How To Get Started

    Basic Linux For Ease of Use and Management of Hosted Website - Getting Started!


    Welcome to the beginning of a path to simpler website administration!


    This chapter is the first in a series aimed at the average user with the average
    hosted website; someone without a vast amount of hyper-technical knowledge about
    the guts of the internet. We will see that utilizing the more "complicated" part
    of the hosting provider''s service can be easy and can make your website management
    easier as well. I will provide you with a basic road map to simple Linux utilization
    that I believe, will benefit both and, ultimately, empower you better


    The good news is: you don''t have to settle!


    Given the right circumstances, you can enhance your ability to maximize the potential
    of your website, and, ironically, increase your "Ease Of Use" by making use of
    that underlying operating system.


