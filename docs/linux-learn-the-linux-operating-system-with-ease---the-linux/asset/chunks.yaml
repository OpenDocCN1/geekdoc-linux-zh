  trans: '


    如果你想尝试不同的 Linux 发行版，或泛指不同的操作系统，你可以安装 `VirtualBox` 并在实际机器内部运行虚拟机。性能可能不如原生操作系统安装得好，但如果你的系统有足够的资源，你会发现性能下降微乎其微。


    ### 9. WizNote

    Evernote、OneNote 以及其他类似笔记软件的 Linux 替代方案。


    ### 10. gdebi

    如果你运行基于 Debian 的系统（如 Ubuntu 或 Mint），偶尔可能在官方仓库中找不到某些软件，此时你必须安装 `.deb` 软件包（或在适用时安装
    PPA）。`gdebi` 允许你执行 `.deb` 包，从而安装该特定软件（你可以将 `.deb` 文件认为是 Ubuntu/Mint/Debian 相当于
    Windows 中的 `.exe` 文件）。


    ### 11. XDM 或 uGet

    下载管理器。我个人不喜欢下载管理器（Firefox 的插件 `DownloadAll` 除外，但那只在某些情况下使用），但有些人确实喜欢。在我看来，浏览器内置的下载管理器足够了。但嘿，这是你的系统，安装任何你喜欢的即可。


    ### 12. UFW/GUFW

    Linux 防火墙。`GUFW` 是 `UFW` 的 GUI 版本，而 `UFW` 通常在命令行终端运行。配置和启用/禁用非常简单，绝对比 Windows
    防火墙少让人疼。


    ### 13. GIMP

    Linux 版的 Photoshop。可能是 Linux 上最流行的图像编辑器。


    ### 14. Pinta

    如果你不需要 GIMP 的所有花哨功能，Pinta 是 MS Paint 的 Linux 替代方案。


    ### 15. BleachBit

    Windows 上 CCleaner 的 Linux 等软件，带有一些额外功能，如安全文件粉碎。Linux 系统通常不需要进行太多清理，但当需要时，`BleachBit`
    是一个非常有用的工具。


    ### 16. ScudCloud

    Slack 消息程序的非官方 Linux 客户端（不要与 Slackr 混淆）。如果你的组织在 Slack 上进行通信，你需要这个。Slack 本身有一个
    Linux 应用程序，目前已支持 Ubuntu 和 Fedora。


    ### 17. Synaptic

    一个包管理器，在许多但并非所有发行版中默认安装。它提供了一种安装和删除软件的替代方法。许多高级用户更喜欢它 own 发行版自带的软件中心。


    ### 18. Dropbox

    云存储，而且他们有官方原生客户端！这是 Google Drive 缺乏的。


    ### 19. VLC

    可以播放任何请求视频的播放器。如果你厌倦了在 Windows 上总要寻找解码器，`VLC` 为你解决了这个问题。它还可以作为下载器播放音频文件，并带有许多许多人不知道的隐藏功能。


    ### 20. Unity Tool

    对于 Ubuntu 系统，某些高级配置默认不包含在 GUI 中，必须通过命令行进行。`Unity Tool` 为这些高级配置提供了 GUI，大部分针对 GTK。对于桌面版，还有一个
    GNOME Tweak。


    ### 21. Sublime

    一个精美的文本编辑器，是许多开发者的最爱。它可以无限免费试用，这在 Linux 发行版中是稀奇的，因为大多数都是付费的。


    ### 22. Atom

    另一个精美的文本编辑器，没有价格。


    ### 23. Notepad++

    如果你是 Windows 上 Notepad++ 的粉丝，你会很高兴地知道它有一个名为 `Notepadqq` 的 Linux 移植。它可能不在你发行版的官方仓库中，但你可以随时添加
    PPA 或手动安装该包。


    ### 24. Brackets

    另一个文本编辑器。它们的功能都相同，只是有一套不同的花哨功能。


    ### 25. Cheese

    Linux 的摄像头应用程序。某些视频聊天软件将其作为依赖项。


    ### 26. Gparted

    Linux 命令 `parted` 的 GUI 版本。用于磁盘管理（即格式化和分区）。


    ### 27. CrashPlan

    Linux 备份实用程序。记住，如果你的数据没有至少在另外两个地方备份，那么它就不存在。


    ### 28. Kodi

    全合一媒体播放器，功能上与 `VLC` 类似。也用于在 Arch Linux 上运行 Steam。


    ### 29. Genymotion

    如果你为 Android 开发，你需要一些东西来测试你的代码。`Genymotion` 是一个 Android 模拟器，让你可以在不实际实际使用 Android
    设备的情况下测试你的 Android 应用。


    ### 30. Tomahawk

    一个全功能音乐播放器，允许你将所有的音乐账户（Spotify、YouTube、Last.fm 等）连接到一个无缝衔接的应用程序中。


    ### 31. GNOME 系统监器

    GNOME 桌面的一部分，系统监视器允许你实时查看系统信息，例如 CPU 使用率、RAM 使用率、温度、带宽、存储空间等。


    ### 32. Conky

    Windows 上 Rainmeter 的 Linux 替代方案。`conky` 通常用于系统监控，它会在你的桌面上显示轻量级的“皮肤”。配置有点困难，但你可以找到帮助。


    ### 33. Transmission

    一个 BitTorrent 客户端，默认安装。


    ### 34. BitTorrent

    另一个免费的 BitTorrent 客户端。


    ### 35. Deluge

    一个基于 BitTorrent 的种子下载客户端。


    ### 36. FileZilla

    提供客户端和服务器版本，如果你需要的话，`FileZilla` 是最佳选择。


    ### 37. Steam

    Steam 现在可以在 Linux 上运行了，许多游戏仅限 Windows 版，但你可以使用 Proton 来运行它们。


    ### 38. Wine

    一个在 Linux 上运行 Windows 应用程序的兼容性层。


    ### 39. Bottles

    一个轻松管理 `Wine` 前缀的工具。


    ### 40. Lutris

    一个在 Linux 上管理和运行各种来源游戏的平台。


