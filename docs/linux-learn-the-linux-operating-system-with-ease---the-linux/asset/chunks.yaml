  trans: '

    Linux 提示：在获取 Linux 启动 CD / DVD 之前，请进行一些研究，以确保你可以保存工作。某些 Linux 启动版允许你保存数据，而有些不能。例如，Ubuntu
    Linux 启动 CD 允许你将工作保存到 USB 闪存驱动。


    Linux Live CDs - 缺点


    1. 虽然从 Linux 启动 CD / DVD 启动比完整的 Linux 安装快，但每次系统启动时，你仍然需要等待系统从启动 CD / DVD 加。如果你通常保持系统开启，这并不是问题。

    2. 你可能无法保存工作。某些 Linux 启动 CD / DVD 发版允许你保存工作，而另一些不能。

    3. 每次启动系统都需要从 Linux 启动 CD / DVD 启动。如果你在“现场”运行 Linux 的时候需要向光驱器放入其他 CD 或 DVD，这可能非常不方便。每当你需要向光驱器放入东西时，都必须移除启动
    CD / DVD。这还增加了你的启动 CD 或 DVD 损坏的概率。


    Linux 提示：手留一份当前的 Linux 启动盘副本，以防工作副本损坏。


    无论如何，安装 Linux 或使用 Linux 启动 CD（或 Linux 启动 DVD），都是获取 Linux 培训的极佳方式，让你学习如何使用 Linux。


    # Linux 初步


    ## 首次尝试 Linux：新手指南


    你可能对 Windows 和/或 Mac OS 非常熟悉。但它们并不是唯一的操作系统。一个流行的替代方案是 Linux。在本章节中，Leslie Lutomski
    将介绍 Linux 以及你在尝试它之前需要了解的知识。


    对于那些告诉我他们想尝试 Linux 但认为它“太难了”的人，我感到惊讶。


    似乎存在一个常见的误解，认为 Linux 是“给极客准备的”。确实，这曾经是事实：专用用户会编译自己的内核，这不适合胆子小的人。


    但从那时起，Linux 已经取得了长足的发展。所以，如果你从未尝试过，或者多年前尝试过并放弃了，我鼓励你重新考虑一下。


    ### 选择你的“口味”


    Linux 有许多“口味”或“发行版”——通常被称为 distros。其中一些版本明确面向主流受众，我建议使用其中一个来尝试一下。这些版本中最广为人知的可能是
    Ubuntu，这也是我使用的版本，也是我在这里重点介绍的版本。Linux Mint 也很流行，但还有很多其他的。


    ### 困难还是容易？


    它用起来困难吗？根据我的经验，并不困难。当我们切换到 Ubuntu 时，我注意到的第一点是我丈夫发出的求救信号突然减少了。他似乎在使用 Linux 时遇到的问题比在
    Windows 上要少，而且似乎更有信心自己尝试事物，而不是恐慌自己可能会“弄坏某些东西”。我向一位从未用过任何电脑的老朋友推荐了 Xubuntu，她接受了。


    ### 有什么好处？


    对于许多人来说，成本会是一个考虑因素。大多数流行的发行版以及它们的软件——都是免费下载和使用的。对于其他人来说，则是开放的本性。


    Linux 也比 Windows 更不容易受到病毒攻击。其主要原因仅仅是大多数病毒都是为 Windows 机器设计的，对 Linux 无产生影响。Linux
    系统对病毒并不是免疫的，但它们很罕见。你可以在这里找到文档。


    这种增加的安全性是我为老朋友选择 Linux 的原因之一。虽然 Linux 病毒很少见，但 ClAV 是免费的，它可以帮助你避免无意中下载并将病毒传给使用
    Windows 的朋友。


    ### Linux 与我的硬件兼容吗？


    Linux 在大多数 PC 上都能良好运行，尽管如果你拥有非常尖端的技术，你可能会发现它不受支持。另一方面，安装 Linux 是让旧硬件焕发新生的极佳方法。某些发行版被设计为轻量级——例如
    Ubuntu 的变体 Xubuntu——在资源有限的系统上运行良好。在 Mac 上运行 Linux 也是可能的，尽管我没有这方面的经验。Ubuntu 论坛——一个极好的帮助和支持来源——为
    Apple 硬件用户提供了专门板块。


    ### 如何选择发行版？


    最简单的方法就是直接尝试一个看看你是否喜欢。许多发行版都可以免费下载，之后你可以将它们刻录到 DVD。然后它们就可以作为“现场”CD/DVD 运行。换句话说，你从
    DVD（或 USB 驱动器）启动系统，并从那里运行操作系统。它不需要安装，没有任何内容会被写入你的硬盘——尽管在 Linux 中，你仍然应该能够访问硬盘上的文件。这是在无风险的情况下对发行版建立感觉的绝佳方式，它还让你检查硬件是否没有问题。Ubuntu
    网站提供了非常清晰的教程来完成这一切。


    ### 我该如何安装它？


    再次，这是一个简单的过程。“现场”CD/DVD 包含了安装系统的选项（如果你选择这样做的话），并将引导你完成整个过程。你可以选择与另一个操作系统一起安装——在同一个驱动器上或分开的——并运行双系统。这允许你使用任何一个系统。你可以在虚拟机
    (VM) 中运行。如果你决定安装 Ubuntu 或其变体（无论是双启动还是独立安装），该过程就像回答几个问题并坐等 Linux 完成完成工作一样简单。如果你是与现有操作系统一起安装，Ubuntu
    会处理好一切。我们警告过 Linux 使用的文件系统与 Windows 不同。虽然 Linux 能够读写 Windows 分区，但 Windows 无法读取
    Linux 分区。如果你是双启动并需要从两个系统访问文件，请确保将它们保存到格式为 FAT 的分区。我作为新手的这种体验并不直观。


    ### 其他软件如何？


    这可能是决定 Linux 是否适合你的终极因素。一方面，你可以获得大量免费、易于安装的软件；另一方面，许多流行的应用程序在 Linux 上并不可用。你当然可以运行虚拟机，另一种替代方案是使用
    Wine，它是一种 Windows 软件的翻译层。Wine 网站维护了一个应用程序数据库，提供了每个应用程序在 Wine 下运行情况的指导。通常这差异很大，取决于软件的版本，正如这些
    Photoshop 的结果所示：我对旧游戏和小型应用取得了较好的成功，但总来说，我使用原生 Linux 替代品。LibreOffice（OpenOffice
    的分支）作为标准配置安装，Firefox 也是。Chromium 是 Chrome 浏览器的原生 Linux 版本，并支持许多扩展程序。GIMP 是 Photoshop
    的接近替代品，尽管人们对其对比效果如何意见不一。除了捆绑应用程序外，其他软件也可以从存储库轻松安装。Ubuntu 现在带有一个 Ubuntu 软件中心，这是一个图形化界面，让你按类别查找软件。


    ### 如何更新？


