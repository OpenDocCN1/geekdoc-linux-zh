    command line.


    # The Basics Of Administration And Security In Linux


    ## Introduction to Computer Security


    What is computer security?


    Security is risk management. - unknown


    "A computer is secure if you can depend on it and it''s software to behave as
    you expect" - Practical UNIX and Internet Security


    Security is: availability, consistency, access control, data confidentiality,
    authentication. - http://www.sun.com/security/overview.html


    "The principal objective of computer security is to protect and assure the confidentiality,
    integrity, and availability of automated information systems and the data they
    contain." - http://cssrc.nist.gov/publications/secpubs/cssclaw.txt


    There are numerous definitions for "computer security", and most of them are correct.
    Essentially computer security means enforcement of usage policies, this must be
    done since people and software have flaws that can result in accidents, but also
    because someone may want to steal your information, use your resources inappropriately
    or simply deny you the use of your resources.


    ### Security Policy


    Security policy is enforcement of your organization''s goals. Security goals will
    vary greatly, for example a bank is more concerned about confidentiality and integrity
    of their account anything else, while a pornographic website is probably more
    about processing cards. There is an amount of security technology available, from
    software and implementations. You cannot properly implement without a solid idea
    of what your goals are. Home users connecting to the office need to use VPN? If
    your policy states that all files and transfers must be encrypted across a "trusted"
    network then the answer is yes. What authentication methods are acceptable for
    services that can be reached from Internet? Do you require strong passwords, tokens,
    biometric authentication, or some combination? The data you collect from remote
    sites, is it important that this data is collected, or is it important that this
    data remains secret? Data that is remote telemetry is probably not as sensitive
    as credit numbers.


    Some security policies need to be exceptionally broad and general, for example
    the policy for JANET, the backbone network for England states:


    #### Monitoring and Enforcement


    19. It follows from the policy of responsibility backed by written site agreements,
    that there must be some method for UKERN to enforce the possible disconnection
    envisaged by the AUP, and to provide full access and assistance to law enforcement
    agencies where necessary.


    20. The JANET-CERT has therefore been given the responsibility (in conjunction
    with UKERN) to:

    * Monitor use of the network, as far as possible while respecting privacy, either
    in response to information about a specific threat, or generally because of a
    received situation

    * Require a primary site, through its nominated contact, to rectify any omission
    in its duty of responsibility

    * Where a site is unable or unwilling to cooperate, report the issue to UKERN
    and initiate the procedure for achieving an emergency disconnection

    * Obtain evidence and pass on information as necessary in order to assist an investigation
    by a law enforcement agency

    * Provide support and coordination for investigations into breaches of security


    On the other hand security policy can be fine:

    All internal email must be encrypted with `PGP` or `GnuPG` using a key of at least
    1024 bits that is signed by an authorized signer. The more detailed and technically
    oriented a policy the harder it will be to follow and keep. The actual details
    of implementing a policy should be hidden from it. Keeping it secret is a better
    idea than rolling it all into the policy.


    ### Acceptable Use


    Another content of computer security is AUP (Acceptable Use Policy). This is a
    document that states what a user of resources may or not do with them. It is part
    of a contract and is signed when purchased. Many acceptable policies generally
    forbid actions that are illegal, potentially annoying to others (and hence cause
    problems for the provider) or are offensive (such as pornography). Other standard
    clauses include "this notice may change at any time without warning" and "we can
    terminate your service at any time if you violate this policy". Generally speaking
    the majority of AUPs are reasonable and will not be a problem for normal users.
    These are a good compliment to a security policy as they set out in concrete terms
    what a user is or not allowed to do, and as they are often part of a contract
    it allows provider to enforce their security policy when a user attempts to violate
    or has violated it.


    ### Privacy Policy


    Privacy policies are interesting that they are supposed to prevent an organization
    (typically a company) from violating some aspects of a user''s security (specifically
    the confidentiality of their information). Unfortunately the majority of privacy
    policies contain clauses like "this policy may change at any time without warning"
    or are simply discarded when a company decides to profit off a user''s information
    (such as name, address, credit card details, purchase history, etc.).


    ### Security is a process


    You only need to make one mistake or leave one flaw available for an attacker
    to get in. This of course means that most sites will eventually be broken into.
    Witness the effects of Code Red, an Nimda, both of which were highly successful
    exploiting well known and long solved vulnerabilities in the Microsoft IIS server.
    Regularly apply patches (after testing them). Regularly scan network for open
    ports. Scan servers with intrusion testing software such as Nessus. Audit file
    permissions and make sure there are no unexpected setuid or setgid binaries.


