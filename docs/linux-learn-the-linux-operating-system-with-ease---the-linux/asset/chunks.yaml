  trans: '

    一款功能强大的 Linux 视频编辑器。功能与 Windows Movie Maker 类似。像 Audacity 一样，它并非专业录音室级别，但对于想要制作
    YouTube 视频的普通用户来说已经足够了。当我视频超过 60-90 分钟时，我遇到了一些性能问题，但不确定是 OpenShot 的问题，还是我的硬件跟不上。


    ### 46. `Handbrake`

    桌面录屏软件，适用于屏幕录制、游戏实况和教程视频。


    ### 47. `RecordMyDesktop`

    同上，桌面录屏软件。


    ### 48. `Kazam`

    另一个屏幕录制/屏幕截屏应用程序。


    ### 49. `winFF`

    视频转换器，如果你有一个某种格式的视频但需要将其转换为另一种格式，它会非常有帮助。


    ### 50. `Nmap`

    网络映射工具，允许你查看网络上的开放端口和其他各种资源，如果你关注安全并想要尽可能加固你的网络，这个工具非常实用。


    # 如何使用 Linux 命令行


    ## 如何使用 Linux 命令行：CLI 基础


    用一个 Shell 统治一切，用一个 Shell 找到它们，用一个 Shell 把它们带回来，并在同一个发行版中将它们绑定。


    命令行是 Linux 系统的许多优势之一。为什么它是一个优势？没有单一的答案；有很多种答案。我同意图形用户界面（GUI）让用户更易地与系统进行交互，这也是新用户开始使用
    Linux 时可能需要的；这也是我在 2005 年开始学习 Linux 时所需要的。但随着我作为一个用户日益成熟，我发现 CLI（命令行界面）比比摆弄工具的按钮要高效得多。


    CLI 还允许用户不依赖于特定的发行版。看看 Ubuntu 的衍生版本，即使它们使用相同的代码库，它们在执行相同任务时使用的工具也不同。同一发行版上的不同桌面环境需要不同的方式来执行相同的任务。用户在切换发行版时，必须忘记并重新学习相同操作的过程。此外，如果我们在
    Fedora、openSUSE 和 Arch 之间移动，情况会变得复杂。


    但一旦你理解基于 Debian 的系统中 `apt-get` 或 `dpkg` 是管理软件所需的命令，生活就会变得简单。这时无论你是在 Ubuntu 上还是
    Lubuntu 上就不重要了。


    当我依赖 GUI 时，过去会担心某个特定的发行版是否具有该功能——这完全关乎某些功能是否通过 GUI 显示或隐藏。一个简单的例子是，Gnome 的 Nautilus
    不允许批量重命名文件，而 KDE 的 Dolphin 可以。结果是某个发行版或桌面环境（DE）的用户在尝试其他项目时会犹豫不决，担心找不到相同的工具。Gnome
    用户不需要牺牲这种实用的功能，多亏了命令行。但这并不是全部原因。它还能节省被 GUI 消耗的系统。所以，如果你在一个低配置的系统上，命令行比 GUI 更好。人们认为命令行很难；它其实更像是给你的电脑发短信，告诉它该做什么。所以在在没有进一步学习之前，听起来可能很奇怪。


    ### 获取 Shell


    Shell 基本上是一个将你输入的命令/指令的“文本”转换为计算机可以执行格式的程序。它有一组命令结构；不同的操作系统使用不同的结构进行转换。


    Linux 有许多可用的 Shell，最常用的是 `bash`（Bourne Again Shell），由 GNU 项目编写。另一个流行且功能强大的 Shell
    是 `zsh`，它通过插件提供了许多增强。


    ### 安装 Shell


    在大多数 Linux 发行版中，默认都安装了 `bash`。如果你想安装 `zsh`，可以使用包管理器。例如在 Ubuntu/Debian 上：


    ```bash

    sudo apt install zsh

    ```


    安装完成后，你可以通过更改默认 Shell 来使用它：


    ```bash

    chsh -s $(which zsh)

    ```

    注意：这通常需要重新登录才能生效。


    ### 基础命令


    当你打开 Shell 时，通常会进入你的家目录。


    #### `ls`

    列出当前目录下的文件和文件夹。

    - `ls -l`：显示详细列表（权限、大小、日期等）。

    - `ls -a`：显示所有文件（包括以 . 开头的隐藏文件）。

    - `ls -lh`：以易读格式显示文件大小。


    #### `cd`

    切换目录。

    - `cd 路径`

    - `cd ..`：返回上一级目录。

    - `cd ~`：回到家目录。


    #### `mkdir`

    创建新目录。

    ```bash

    mkdir my_folder

    ```


    #### `touch`

    创建一个空文件。

    ```bash

    touch file.txt

    ```


    #### `rm`

    删除文件或目录。

    - `rm filename`：删除文件。

    - `rm -r foldername`：递归删除目录及其内容（谨慎使用）。

    - `rm -rf`：强制删除，无需提示。


    #### `cp`

    复制文件或目录。

    - `cp source destination`

    - `cp -r source destination`：复制目录。


    #### `mv`

    移动文件或重命名文件。

    - `mv source destination`：移动。

    - `mv old_name new_name`：重命名。


    #### `cat`

    查看文件内容。

    ```bash

    cat filename.txt

    ```


    #### `grep`

    在文件中搜索文本。

    ```bash

    grep "search_term" filename.txt

    ```


    #### `head` & `tail`

    查看文件的开头或结尾。

    - `head filename.txt`：查看前 10 行。

    - `tail filename.txt`：查看最后 10 行。

