  md: '# # Saving and Executing Your Code


    While working in the IDLE Shell is perfectly fine for small code snippets, it''s
    not designed for entering longer program listings. In this section you''re going
    to be introduced to the IDLE Editor, where you will be working from now on.


    # ## EDITING CODE


    You will eventually reach a point where you have to move on inputting single lines
    of code into the Shell. Instead, the IDLE Editor will allow you to save and execute
    your Python code.


    +   **STEP 1** First, the Python IDLE Shell and when it''s up, click on File >
    New File. This will open a new window with Untitled as its name. This is the Python
    IDLE editor and within you can enter the code to create your programs.


    +   **STEP 3** You can see that the same colour coding is in place in the IDLE
    Editor as it is in the Shell, enabling you to better understand what''s going
    with your code. However, to execute the code you need to first save it. Press
    F5 and you get a Save... Check open.


