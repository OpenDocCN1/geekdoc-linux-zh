    # # User Input


    We''ve seen some basic user interaction with the code from a few of the examples
    earlier, so now would be a good time to focus solely on how you would get input
    from the user then and present it.


    # USER FRIENDLY


    The type of input you want from the user will depend greatly on the type of program
    you''re coding. For example, a game may ask for a character''s name, whereas a
    database ask for personal details.


    +   **STEP 1** If it''s not already, open the Python 3 IDLE Shell, and start a
    New File in the Editor. Let''s begin with something really simple:


    ```

    print("Hello")

    firstname=input("What is your first name?")

    print("Thanks")

    surname=input("And what is your surname?")

    ```


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_27_0.png)


    +   **STEP 3** Now that we have the user''s name stored in a couple of variables
    we can call them when we need:

    print("Welcome", firstname, surname, ". I hope you''re well today.")


    +   **STEP 2** Save and execute the code, and as you already no doubt suspected,
    in the IDLE program will ask for your first name, storing it in a variable firstname,
    then for your surname, storing it in its own variable (surname):


    +   **STEP 4** Run the code and you can see a slight issue, the full stop after
    the surname a blank space. To eliminate this we add a plus sign to the comma in
    the code:

    print("Welcome", firstname, surname + ". I hope you''re well today.")


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_27_1.png)


    ```

    Python 3.4.2 Shell

