  md: '# # Starting Python for the First Time


    If you''re using the new Raspberry Pi together with its latest release of the
    Pi OS, you will need to manually install the Python IDLE. This is due to the Pi
    team removing the core Python IDLE in favour of their own coding editor.


    # ## STARTING PYTHON


    For those using the PI4 and new Raspberry, drop into a Terminal and enter: sudo
    apt-get install idle3. Older versions of Raspberry already have the official Python
    IDLE pre-installed.


    ### STEP 1

    With the Raspberry desktop loaded, click on the Menu button by Programming > Python
    3 (IDLE). This opens the Python 3 Shell. Windows and Mac users can find the Python
    3 IDLE Shell within the Windows Start menu or via Finder.


    ### STEP 3

    For example, in the Shell enter: **2+2** After pressing Enter, the next line displays
    the answer: 4. Python has taken the ''code'' and produced the relevant output.


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_11_0.png)


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_11_1.png)


    ### STEP 2

    The Shell is where you can enter code and see the responses and output of code
    you programmed into Python. This is a kind of sandbox, where you are able to try
    out some code and procedures.


    ### STEP 4

    The Python Shell acts very much like a calculator, since code is basically a series
    of mathematical interactions with the system. Integers, which are the infinite
    sequence of numbers can be added, subtracted, multiplied and so on.


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    help(''copyright'', ''credits'' or ''license'') for more information.

    (C) 4.9.1 on Linux

    ```


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    help(''copyright'', ''credits'' or ''license'') for more information.

    >>> 2+2

    4

    >>> 23453*645452

    15133933256

    >>> 650000/12345

    52.65249088761243

    >>> 987652999*43024

    424907623576

    ```'
