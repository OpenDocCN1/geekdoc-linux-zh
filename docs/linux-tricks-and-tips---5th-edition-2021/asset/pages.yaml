  md: '# # Creating Functions


    Now that you''ve mastered the use of variables and user input, the next step is
    to tackle functions. You''ve already used a few functions, such as the print command
    but Python enables you to define your own functions.


    # ## FUNKY FUNCTIONS


    A function is a command that you enter into Python to do something. It''s a little
    piece of self-contained code that takes data, works on it and returns the result.


    +   **STEP 1** It''s not just-data that a function works. They can do manner of
    useful things in Python, as sort data, change items from one format to another
    and check the length or type of items. A function is a short word followed by
    brackets. For example, `len()`, `list()` or `type()`.


    +   **STEP 3** You can pass variables through functions in much the same manner.
    Let''s assume you want the number of letters in a person''s surname, you could
    use the following code (enter the text editor for this example):


    ```

    name=input("Enter your surname: ")

    count=len(name)

    print("Your surname has,", count, "letters in.")

    ```


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_29_0.png)


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_29_1.png)


    Press and to execute it.


    +   **STEP 2** A function takes data, usually a variable, works on it depending
    on how the function is programmed to return the end value. The data being worked
    goes inside the brackets, so if you want to know how many letters are in antidisestablishmentarianism,
    you''d enter: `len(''antidisestablishmentarianism'')` and the number 28 would
    return.


    +   **STEP 4** Python has tens of functions built into it, far too many to get
    into the limited space available here. However, if you want to navigate to docs.python.org/3/library/functions.html
    these are the predefined functions, but since users have created more, they''re
    not the only ones available.


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> type(''copyright", "credits" or "license") for more information.

    <class ''str''>n>>> len(''antidisestablishmentarianism'')

    28

    ```


    ```

    >>> input("Enter your surname: ")

    Maynard

    >>> count=len(''Maynard'')

    >>> print("Your surname has,", count, "letters in.")

    Your surname has, 7 letters in.


    ```'
