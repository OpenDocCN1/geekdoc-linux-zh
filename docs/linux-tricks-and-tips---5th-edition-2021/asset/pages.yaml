    ### STEP 5 However, if you want the latest, cutting edge

    version, you need to build Python from source. Start

    by entering these commands in the Terminal:


    ```

    sudo apt-get install build-essential checkinstall

    sudo apt-get install readline-dev libsqlite2-dev

    libncurses5-dev libssl-dev libsqlite3-dev tk-dev

    libdbm-dev libncurses5-dev libz2-dev

    ```


    David-Midt


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_10_0.png)


    ### STEP 8 Within the Python folder:


    ```

    ./configure

    sudo make altinstall

    ```


    This could take a while depending on the speed of your computer.

    Finished, use python3.7 --version to check the

    latest version. You now have Python 3.7 installed alongside

    older Python 3.x and Python 2.


    ### STEP 6 Open your web browser and go to the

    Python download page: www.python.org/

    Downloads. Click on the downloaded file. This opens a dialogue box;

    choose a location and start the download.


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_10_1.png)


    ### STEP 9 For the GUI, you need to enter the following

    command in the Terminal:


    ```

    sudo apt-get install idle3

    ```


    The IDE can be started with the installed idle3. Now that

    IDLE runs from the one you installed from source.


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_10_2.png)


    ### STEP 7 In the Terminal, we will find the following

    commands: cd Downloads/. Using the Python source code with: tar -xvf Python-

    3.Y.Y.tgz (replace Y.Y with the version you downloaded)

    ded. Enter the newly unzipped folder with cd

    Python-3.Y.Y/


    ### STEP 10 You also need Pip (Inst Packages) which is a

    tool to help you install modules and extras.

    Use: sudo apt-get install python3-pip


    When PIP is installed, check for the latest update using:

    pip install --upgrade pip

    When complete, the Terminal and Python 3.x will be available

    hour the Programming in your system.'
