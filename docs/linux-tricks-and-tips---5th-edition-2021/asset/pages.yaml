  md: "# USER ERROR\n\nUser input is often a paralysing mistake in code. For example,\
    \ the user is supposed to enter a number for their age and enter it in letters.\
    \ Often a user can enter so much input that overflows internal buffer, thus causing\
    \ the code crashing. Watch those user inputs and clear whatever state is needed\
    \ from.\n\n```\nEnter an integer number\nYou have entered wrong input\nYou have\
    \ entered wrong input\nYou have entered wrong input\nsdfas2312312\nYou have entered\
    \ wrong input\n1323s2x32x32x32x\nThe number is: 12\nProcess returned (0x0) execution\
    \ time: 21.49 s\nPress any key to continue.\n```\n\n![](img/8be85e08b9ef86e0a62cd21bd550837a_64_0.png)\n\
    \n# BACKUPS\n\nAlways make a backup of your work, with a secondary backup for\
    \ any changes you've made. Mistakes can be rectified if there's a good backup\
    \ in place to revert to those times something goes wrong. It's much easier to\
    \ start where you left off, rather than starting from the\n\n![](img/8be85e08b9ef86e0a62cd21bd550837a_64_1.png)\n\
    \n# RE-INVENTING THE WHEEL\n\nYou can easily spend days trying to fathom out section\
    \ of code to achieve a good result and it's frustrating and often time-wasting.\
    \ While it's rewarding to solve the problem, often the same code is out there\
    \ on the Internet. Don't re-invent the wheel, look to see if someone else has\
    \ done it first.\n\n# SECURE DATA\n\nIf you're writing code to deal with usernames\
    \ and passwords, or other sensitive data, ensure that the data isn't clear. Learn\
    \ how to create a function to encrypt sensitive data prior to feeding into a routine\
    \ that can transmit or store it may be able to view it.\n\n![](img/8be85e08b9ef86e0a62cd21bd550837a_64_2.png)\n\
    \n![](img/8be85e08b9ef86e0a62cd21bd550837a_64_3.png)\n\n# HELP!\n\nAsking for\
    \ help is something most of us has struggled with in the past. Will the people\
