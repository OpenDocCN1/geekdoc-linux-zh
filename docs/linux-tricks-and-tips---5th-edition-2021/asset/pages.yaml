  md: '# Python on Linux


    # Python Modules


    Think of modules as an imported into your Python code to enhance and extend its
    capabilities. There are countless modules available, and the Pi has most of them
    pre-installed; as many Linux distros.


    # MASTERING MODULES


    In this instance we''re using Windows 10 to demonstrate installing modules, since
    they''re already there in PI OS. The steps apply for these Linux distro do not
    feature any modules, but we don''t worry about cross compatibility.


    # STEP 1


    Although good, the built-in functions within Python are limited. The use of modules,
    however, allows us to make more sophisticated programs. As you are aware, modules
    are Python scripts that are imported, such as import math.


    # STEP 3


    The result is an error in IDLE, as the Pygame module is not recognised or installed
    in Python. To install a module we can use PIP (Pip Inst Packages). Close down
    IDLE shell and drop into a command prompt, or Terminal session.


    ```

    pip install pygame

    ```


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_33_0.png)


    # STEP 2


    Some modules, especially on the Raspberry Pi, are included by default; the Math
    module being a prime example. Sadly, other modules are available. A good example
    on non-PI platforms is Pygame, which contains many functions to create games.
    Try: import pygame.


    # STEP 4


    The PIP installation requires an elevated status due to installing packages at
    different locations. Windows users can search for CMD via the Start button and
    right-click the result to Run as Administrator. Linux and Mac use the sudo, with
    sudo pip install.


    ```

    Command Prompt

