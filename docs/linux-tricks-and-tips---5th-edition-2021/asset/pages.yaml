  md: "# Data Types\n\nThis is mainly due to the conversion from binary in the compiler\
    \ and that the IEEE 754 double precision standard occupies 64-bits of data, with\
    \ 52-bits are dedicated to the significant digits in a floating-point number)\
    \ and roughly 3.5-bits are holding the values 0 to 9. If you divide 53 by 3.5,\
    \ then you arrive at 15.14287, which is 15 digits.\n\n```\nDataTypes.cpp\n#include\
    \ <iostream>\nusing namespace std;\ndouble PI = 3.141592653589723846;\nint main()\
    \ {\n    cout.precision(22);\n    cout << PI;\n}\n```\n\nTo be honest, if you're\
    \ creating code that needs to be more than fifteen decimal places, then you wouldn't\
    \ be using C++, you would use some specific scientific language like C++ as the\
    \ connective tissue between the two languages.\n\nYou can create your own types,\
    \ using an alias-like system typeef. For example:\n\n```\n#include <iostream>\n\
    using namespace std;\ntypeef int metres;\n```\n\n```\nint main() {\n    int distance;\n\
    \    distance = 15;\n    cout << \"distance in meters is: \" << distance;\n}\n\
    ```\n\nAgain and run the code, as you can see from the window line, the number\
