  md: "# Data Types\n\nVariables, as you see, store information that the programmer\
    \ can then call up, and manipulate if required. Variables are simply reserved\
    \ memory locations that store the values the programmer assigns, depending on\
    \ the data type used.\n\n# THE VALUE OF DATA\n\nThere are many different types\
    \ available for the programmer in C++, such as an integer, float, Boolean, character\
    \ and so on. It is widely accepted that there seven basic types, called Primitive\
    \ Built-in Types; you can create your own data types that need ever arise within\
    \ your code.\n\n| Type | Command |\n|---|---|\n| Integer | int |\n| Floating Point\
    \ | float |\\| Character | char |\n| Boolean | bool |\n| Double Point | double\
    \ |\n| Wide Character | wchar_ |\n| No Value | void |\n\nThese basic types can\
    \ be extended using the following modifiers: Long, Short and Signed. Using this\
    \ means the modifiers can expand the minimum and maximum range values for each\
    \ type. For example, the int data type has a default value of -2147483648 to 2147483647,\
    \ a fair value, you could use.\n\nIf you were to use one of the modifiers, the\
    \ range alters:\n\n+   unsigned int = 0 to 4294967295\nSigned int = -2147483648\
    \ to 2147483647\nShort = -32768 to 32767\nUnsigned Short = 0 to 65535\nSigned\
    \ Short = -32768 to 32767\nLong = -2147483648 to 2147483647\nSigned Long = -2147483648\
    \ to 2147483647\nUnsigned Long = 0 to 4294967295\n\nNaturally you can use either\
    \ the basic type or the modifier, as there is plenty of range provided with each\
    \ data type. However, it's considered C++ programming practise to use the modifiers\
    \ when possible.\n\nThere are issues when the modifiers though. Double represents\
    \ a double-point value, which you can use for incredibly accurate numbers but\
    \ those are only accurate up to the fifteenth decimal place. There's also the\
    \ problem displaying others in C++: by using the cout function, in that by default\
    \ outputs only the first few decimal places, in you can combat\n\nby adding a\
    \ cout.precision() function and adding a value inside the brackets then you're\
    \ still limited by the accuracy of the double data type. For example, this could\
    \ code:\n\n```\n#include <iostream>\nusing namespace std;\nint main() {\n    double\
    \ PI = 3.14159265358979323846;\n    cout << PI;\n}\n```\n\n```\n#include <iostream>\n\
    using namespace std;\nint main() {\n    double PI = 3.14159265358979323846;\n\
    \    cout << PI;\n}\n```\n\nBuild and run the code as you can see the output is\
    \ 3.14159, representing its limitations in accuracy.\n\nYou can also use the aforementioned\
    \ cout.precision, for greater accuracy. You can push all the way up to 22 decimal\
    \ places, with the following code:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    double PI = 3.14159265358979323846;\n    cout.precision(22);\n\
    \    cout << PI;\n}\n```\n\n```\n(program executed with code: 0)\nPress return\
    \ to continue\n```"
