  md: "# # Conditions and Loops\n\n![](img/8be85e08b9ef86e0a62cd21bd550837a_31_0.png)\n\
    \nConditions and loops are what make a program interesting; they can be simple\
    \ or rather complex. How you use them depends greatly on what the program is trying\
    \ to achieve; they could be the number of lives left in a game or just displaying\
    \ a countdown.\n\n# ## TRUE CONDITIONS\n\nKeeping conditions simple to begin with\
    \ learning to program a more enjoyable experience. Let's start then by checking\
    \ if something is TRUE, then doing else if it isn't.\n\n+   - **STEP 1** Let's\
    \ create a new Python program that will ask the user to input a word, then check\
    \ to see if it's a four-letter word or not. Start with File > New File, and begin\
    \ with the input:\n\n```\nword=input(\"Please enter a four-letter word: \")\n\
    ```\n\n![](img/8be85e08b9ef86e0a62cd21bd550837a_31_1.png)\n\n+   - **STEP 3**\
    \ Now you can use an if statement to check if the word, length is equal to four\
    \ and print a friendly confirmation if it applies to the rule:\n\n```\nword=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word)\nif word_length ==\
    \ 4:\n    print(word,\"is a four-letter word. Well done.\")\n```\n\nThe double\
    \ equal == means check if something is equal to something\n\n![](img/8be85e08b9ef86e0a62cd21bd550837a_31_2.png)\n\
    \n+   - **STEP 2** We can create a new word, then use the len function and pass\
    \ the word through it to get the total number of letters the user has entered:\n\
    \n```\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    ```\n\n![](img/8be85e08b9ef86e0a62cd21bd550837a_31_3.png)\n\n+   - **STEP 4**\
    \ The colon at the end of if Python tells you that the statement is true after\
    \ the colon indented. Next, move back to the beginning of the Editor:\n\n```\n\
    word=input(\"Please enter a four-letter word: \")\nword_length=len(word)\nif word_length\
    \ == 4:\n    print(word,\"is a four-letter word. Well done.\")\nelse:\n    print(word,\"\
    is not a four-letter word.\")\n```\n\n![](img/8be85e08b9ef86e0a62cd21bd550837a_31_4.png)\n\
