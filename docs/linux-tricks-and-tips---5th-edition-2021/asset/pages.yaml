  md: "# Working with Variables\n\nWe've seen some examples of variables in our Python\
    \ code but it's always worth going through the way they operate and how Python\
    \ creates and assigns certain values to a variable.\n\n# VARIOUS VARIABLES\n\n\
    You'll be working with the Python 3 IDLE Shell in this tutorial. If you haven't\
    \ already, open Python 3 or close the previous IDLE Shell to clear up any code.\n\
    \nIn some languages you're required to use a dollar sign to denote a string, which\
    \ is a variable made of multiple characters, such as a name of a person. In Python\
    \ this isn't necessary. For example, in the Shell enter: name=\"David Howard\"\
    \ (or use your own name, unless you're also called David Howard)\n\n+   STEP 1\n\
    \nYou've previously seen that variables can be concatenated using the plus symbol\
    \ between the variable names. In our example we can use: print(name + \": \" +\
    \ title). The middle part between the quotations allows us to add a colon and\
    \ space, as variables are connected without spaces, so we need to add them manually.\n\
    \n```\nPython 3.4.2 Shell\nFile Edit Shell Debugging Windows help\n>>> Oct 19\
    \ 2014, 13:31:11\n[GCC 4.9.2] on line\n>>> type = \"credit\" or \"license\" for\
    \ more information.\n>>> name = \"David Howard\"\n>>> print(name)\nDavid Howard\n\
    >>>\n```\n\n```\nPython 3.4.2 Shell\nFile Edit Shell Debugging Windows help\n\
