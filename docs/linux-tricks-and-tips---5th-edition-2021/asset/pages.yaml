  md: '# Did You Know...


    # Debugging


    DID YOU KNOW... that the word debugging in computing terms comes from Admiral
    Grace Hopper, who back in the ''40s was working on a monolithic Harvard Mark II
    electromechanical computer. According to legend Hopper found a moth stuck in a
    relay, thus stopping the system from working. Removal of the moth was hence called
    debugging.


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_36_0.png)'
