  md: "# Structure of a C++ Program\n\nCOMMENTS Lines that begin with a double slash\
    \ are comments. This means they won't be executed by the compiler. Comments are\
    \ designed to help you, or another programmer looking at your code, explain what's\
    \ going on. There are two types of comment: // covers multiple lines and /* covers\
    \ single line.\n\n<< The two chevrons used here are insertion operators. This\
    \ means that whatever follows the chevrons is inserted into the std::cout. In\
    \ this case they're 'Hello, world!' which are to be displayed on the screen when\
    \ you compile and execute the code.\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    \nint main() {\n\n    // My first C++ program\n}\n```\n\n```\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    // My first C++\
    \ program\n    cout << endl;\n}\n```\n\nSTD white stands for something different,\
    \ in C++ it means standard. It's part of the Standard Namespace in C++, which\
    \ covers a number of different statements and commands. You can leave the std::\
    \ part out of the code but must be declared at the start using namespace std,\
    \ not both. For example:\n\nOUTPUT Leading on, \"Hello, world!\" is what you want\
    \ to appear on the screen when the code is executed. You can enter whatever you\
    \ like, as long as it's inside the quotation marks. Some brackets are reneeded,\
    \ depending on the compiler. The '\\n' part indicates a new line to be inserted.\n\
    \n```\n#include <iostream>\nusing namespace std;\n```\n\n```\nhelloworld.cpp\n\
    #include <iostream>\n\nint main() {\n    // My first C++ program\n    std::cout\
    \ << \"Hello, world!\\n\";n}\n```\n\n```\n// My first C++ program\ncout << \"\
    Hello, world!\\n\"\n```\n\nCOUT In this example we are using cout, which is a\
    \ part of the Standard Namespace, why it's there is we're asking C++ to use it\
    \ from that particular namespace. Cout means Character Output, which displays,\
    \ or prints to the screen. If you leave std::cout out, you have to declare it\
    \ at the start of the code, as mentioned previously\n\n; AND) Finally you can\
    \ see that lines within a function block (except empty) end with a semicolon.\
    \ marks the end of the statement; all statements in C++ must have one at the end\
    \ or the compiler fails to build. The very last line has the closing brace to\
    \ indicate the end of the main function.\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    // My first C++ program\n    cout <<\
    \ \"Hello, world!\\n\";n}\n```"
