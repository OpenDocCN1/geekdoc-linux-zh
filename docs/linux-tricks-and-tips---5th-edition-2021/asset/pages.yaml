    The Raspberry Pi makes for a great coding base on which to learn C++. You won''t
    need any complicated, third-party IDEs or to install any extra components. Everything
    you need to get started is already built into the Pi.


    # HELLO, WORLD!


    It''s traditional in programming for the first code to be entered out the words
    ''Hello, World!'' to the screen. Interestingly, this dates back to 1968 using
    a language called BCPL.


    You can use the Geasy Programmer''s Editor to write, compile and execute your
    C++ code on the Raspberry Pi. You can find Geasy as the first entry in the Programming
    section from the main Raspberry Pi Menu. Click the Geasy icon to open and start
    coding.


    It doesn''t look like much at the moment but you can get into what the C++ headers
    mean in the code. Geasy uses syntax highlighting, meaning it-colours the code
    depending on the language. Activate this, save the code by clicking on File >
    Save As. Now name the code helloworld.cpp and click the Save button.


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_41_0.png)


