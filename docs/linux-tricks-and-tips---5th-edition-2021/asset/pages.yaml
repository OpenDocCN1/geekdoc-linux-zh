  md: "# # How to Set Up Python in Linux\n\nWhile the Raspberry Pi's operating system\
    \ contains the latest, stable version of Python, other distros don't come with\
    \ Python 3 preinstalled. If you're not going down the Pi route, then here's how\
    \ to check and install Python for Linux.\n\n# ## PYTHON PENGUIN\n\nLinux is such\
    \ a versatile operating system that it's difficult to nail down one way of doing\
    \ something. Different distributions go about installing software in different\
    \ ways, so we're sticking with Linux Mint for this particular tutorial.\n\n+ \
    \  STEP 1 First you need to ascertain which version of Python is currently installed\
    \ in your Linux system. To begin, drop into a Terminal session from your desktop\
    \ or hit the Ctrl+Alt+T keys.\n\n+   STEP 3 In our case we have both Python 2\
    \ and 3 installed; as long as Python 3.x.x is installed, the code in our tutorials\
    \ will work. It's always worth checking to see if the distro has been updated\
    \ with the latest versions, so enter: `sudo apt-get update && sudo-get upgrade`\
    \ to update the system.\n\n![](img/8be85e08b9ef86e0a62cd21bd550837a_9_0.png)\n\
    \n+   STEP 2 Next enter `python --version` in the Terminal. You should have the\
    \ output indicating version x.x of Python. By default, most Linux distros come\
    \ with both Python 2 and 3, so there's plenty of clone to check still available\
    \ for Python 2. Now enter `python3 --version`\n\n+   STEP 4 Once the update and\
    \ upgrade completes, `python3 --version` to see if Python 3.x is installed or\
    \ even updated; as long as you have Python 3.x, you're running the most recent\
    \ version. The numbers after the 3 include patches and updates. If they're unnecessary\
    \ but can provide some new elements.\n\n```\ndavid@david-Mint:~ $ python --version\n\
    Python 2.7.15\ndavid@david-Mint:~ $ python3 --version\nPython 3.6.7\ndavid@david-Mint:~\
    \ $\n```\n\n![](img/8be85e08b9ef86e0a62cd21bd550837a_9_1.png)\n\n```\nReading\
    \ package lists...Done\nBuilding dependency tree...Done\nReading dependency information...Done\n\
    The following NEW packages will be installed:\n  linux-image-5.4.0-101-generic_amd64\
    \ [62.4 MB]\n  linux-headers-5.4.0-101-generic_amd64 [35.2 MB]\n  linux-generic-5.4.0\
    \ [1.2 KB]\n33 packages will be upgraded, 3 newly installed, 0 to remove.\nAfter\
    \ this operation, 98 MB of additional disk space will be used.\\Do you want to\
    \ continue? [Y/n] Y\nSelecting linux-image-5.4.0-101-generic_amd64 (5.4.0-101.1)\n\
    Unpacking linux-image-5.4.0-101-generic_amd64 (5.4.0-101.1)\nSetting up linux-image-5.4.0-101-generic_amd64\
    \ (5.4.0-101.1)...\nSelecting linux-headers-5.4.0-101-generic_amd64 (5.4.0-101.1)\n\
    Unpacking linux-headers-5.4.0-101-generic_amd64 (5.4.0-101.1)\nSetting up linux-headers-5.4.0-101-generic_amd64\
    \ (5.4.0-101.1)...\nSelecting linux-generic-5.4.0 (5.4.0)\nUnpacking linux-generic-5.4.0\
    \ (5.4.0)\nSetting up linux-generic-5.4.0 (5.4.0)...\nProcessing triggers for\
    \ linux-image-5.4.0-101-generic (5.4.0-101.1)\ndavid@david-Mint:~ $\n```"
