  md: "# STEP 5\n\nThe principal works are the same as the previous code. The user's\
    \ input, is stored in a string, because it contains multiple characters, and retrieved\
    \ in the second cout line. As the variable 'name' doesn't change, then you can\
    \ recall whenever you like.\n\n```\ncout << \"Your name: David\\nHello, David.\
    \ I hope you're well today\\\";\n\n main() {\n    string name;\n    cout << \"\
    Programmed with code: 0\\\";\n    return finish;\n}\n```\n\n# STEP 6\n\nYou can\
    \ change input requests to the user just make sure you have a variable to store\
    \ the input. Let's assume you use the user to enter two numbers:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    int num1, num2;\n    cout\
    \ << \"Enter two whole numbers: \\\";\n    cin >> num1 >> num2;\n    cout << \"\
    You entered \" << num1 << \" and \" << num2 << \"\\n\";\n}\n```\n\n# STEP 8\n\n\
    While cin works well for most input tasks, it has a limitation. Always considers\
    \ spaces as a terminator, so for just single words use getline as the first argument\
    \ and the variable as the second:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    string mystr;\n    cout << \"Enter a sentence: \\\"\
    ;\n    getline(cin, mystr);\n    cout << \"Your sentence is: \" << mystr.size()\
    \ << \" characters.\\n\";\n}\n```\n\n# STEP 9\n\nBuild and execute the code, then\
    \ enter a sentence with spaces. If you don't read the code replace getline with\
    \ cin >> and try again, the result displays the numbers of characters up to the\
    \ first.\n\n# STEP 7\n\nLikewise, input data can be manipulated once you have\
    \ it stored in a string. For instance, ask the user for two numbers and do some\
    \ math:\n\n```\n#include <iostream>\nusing namespace std;\n\nint main() {\n  \
    \  float num1, num2;\n    cout << \"Enter two numbers: \\\";\n    cin >> num1\
    \ >> num2;\n    cout << num1 << \" + \" << num2 << \" is: \" << num1 + num2 <<\
    \ \"\\n\";\n}\n}\n```\n\n# STEP 10\n\nGeteline is a command that C++ programmers\
    \ forget to include. The terminating space is away and you can't figure out where\
    \ your code is not working. It's best to use getline(cin, variable) in future:\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nint main() {\n    string name;\n\
    \    cout << \"Enter your full name: \\\";\n    getline(cin, name);\n    cout\
    \ << \"Hello, \" << name << \"\\n\";\n}\n```"
