  md: "# User Interaction\n\nThere's nothing quite satisfying as creating a program\
    \ that responds to you. This basic user interaction is one of the most taught\
    \ aspects of any language and with it you're able to do much more than simply\
    \ greet the user by your name.\n\n# HELLO, DAVE\n\nYou have already used cout,\
    \ the standard output stream, throughout your code. Now you're going to be using\
    \ cin, the standard input stream, to prompt a user response.\n\n+   - Anything\
    \ that you want the user to input into the system memory needs to be stored somewhere\
    \ so it can be retrieved and used. Therefore, any input must first be declared\
    \ to be used by the user. Start creating a blank C++ file with headers.\n\nThe\
    \ cin command works in the opposite way from the cout command. With the first\
    \ line you use chevron. Cin uses facing chevrons, indicating an input. Output\
    \ 'What is your age?' to the screen, as indicated with the chevron. The input\
    \ is put into the integer age and called up in the second cout command. Build\
    \ and run the code.\n\n```\ninclude <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    int age;\n    cout << \"What is your age: \";\n    cin >> age;\n    cout\
    \ << \"\\nYou are \" << age << \" years old.\\\\n\";n}\n\n```\n\nThe data type\
    \ of the variable must also match the type of input you want from the user. For\
    \ example, to ask a user age, you would use an integer like this:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    int age;\n    cout <<\
    \ \"What is your age: \";\n    cin >> age;\n}\n\n```\n\nIf you are asking a question,\
    \ you need to store the input as a string; to ask the user name, you would use:\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nint main() {\n    string name;\n\
    \    cout << \"What is your name: \";\n    cin >> name;\n    cout << \"\\nHello,\
    \ \" << name << \". I hope you're well today?\\\\n\";n}\n\n```\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    int age;\n    cout <<\
    \ \"What is your age: \";\n    cin >> age;\n    cout << \"\\nYou are \" << age\
    \ << \" years old.\\\\n\";n}\n\n```"
