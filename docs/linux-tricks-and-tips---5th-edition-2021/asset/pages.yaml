  md: "# Working with Variables\n\nSTEP 5 However, you cannot combine strings and\
    \ integer type variables in the same command, as you would need to either enter\
    \ one into the other or vice versa. When you try to combine both, you get an error\
    \ message:\n\n```\nPython 3.4.2 (default. Oct 19 2014, 13:01:55)\n>>> David Howard\n\
    >>> print(\"credits\" or \"license\" for more information.)\n>>> name = \"Howard\"\
    \n>>> type(name)\n<class 'str'>\n>>> age = 44\n>>> type(age)\n<class 'int'>\n\
    >>> print(\"Descended from Vikings\")\nDescended from Vikings\n>>> print(age)\n\
    44\n>>> print(\"I am \" + age + \" years old.\")\nTypeError: can't concatenate\
    \ 'int' to 'str' implicitly\n```\n\nSTEP 8 This presents a problem of when you\
    \ want to work with a number that has been inputted by the user, as age + 10 will\
    \ not work due to being string and integer. Instead, you need to:\n\n```\nint(age)\
    \ + 10\n```\n\nThis will Cast the age string into an integer that can be worked.\n\
    \n```\nPython 3.4.2 (default. Oct 19 2014, 13:01:55)\n>>> David Howard\n>>> print(\"\
    credits\" or \"license\" for more information.)\n>>> print(\"How old are you?\"\
    )\n>>> age = input()\n>>> type(age)\n<class 'str'>\n>>> age + 10\nTraceback (most\
    \ recent call last):\n  File \"stdin\", line 1, in <module>\nTypeError: can't\
    \ concatenate sequence of 'str' and 'int' objects\n>>> int(age) + 10\n```\n\n\
    STEP 6 This is a process called Typecasting. The Python code is:\n\n```\nprint\
    \ (character + \" \" + str(age) + \" years old.\")\n```\n\nNotice that in the\
    \ last example, you don't need the spaces between the words when using commas\
    \ as comma treats each argument separately.\n\n```\n>>> print (name, age)\nTraceback\
    \ (most recent call last):\nFile \"<stdin>\", line 1, in <module>\nTypeError:\
    \ can't concatenate 'int' to 'str' implicitly\n>>> print(\"is, \" + age + \" years\
    \ old.\")\nDavid Howard: Descended from Vikings is 44 years old.\n>>> David Howard:\
    \ Descended from Vikings is 44 years old.\n```\n\nSTEP 9 This is the use of Typecasting\
    \ also when dealing with floating point arithmetic: decimal numbers. For example:\n\
    \n```\n19.99\n```\n\nNow enter type(shift) and you'll see that Python has the\
    \ number as a 'float', because value contains a decimal point.\n\n```\nPython\
    \ 3.4.2 (default. Oct 19 2014, 13:01:55)\n>>> David Howard\n>>> print(\"credits\"\
    \ or \"license\" for more information.)\n>>> type(shift)\n<class 'float'>\n```\n\
    \nSTEP 7 Another example of Typecasting when you are asked for an input from the\
    \ user, such as for example,\n\n```\nenter= input(\"How old are you?\")\n```\n\
    \nAll data from the input command is a string variable.\n\nSTEP 10 When combining\
    \ integers and floats Python usually converts the integer to a float, but just\
    \ remember that Python doesn't return the value correctly. When converting a float\
    \ to an integer, Python will always round to the nearest integer, called truncating;\
    \ in case of 19.99 it becomes\n\n```\nPython 3.4.2 (default. Oct 19 2014, 13:01:55)\n\
    >>> David Howard\n>>> print(\"credits\" or \"license\" for more information.)\n\
    >>> How old are you? 44\n>>> type(enter)\n<class 'str'>\n```\n\n```\nPython 3.4.2\
    \ (default. Oct 19 2014, 13:01:55)\n>>> David Howard\n>>> print(\"credits\" or\
    \ \"license\" for more information.)\n>>> How old are you? 44\n>>> type(float(enter))\n\
    <class 'float'>\n>>> int(float(enter))\n<class 'int'>\n```\n\n![](img/8be85e08b9ef86e0a62cd21bd550837a_26_0.png)"
