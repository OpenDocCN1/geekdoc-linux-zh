  md: '# # Your First Code


    Essentially, you''ve already written your first piece of code with the ''print(“Hello
    everyone!)'' function from the previous tutorial. However, let''s expand and look
    at entering your code and playing around with some other Python examples.


    #  PLAYING WITH PYTHON


    With most languages, computer or human, it''s all about remembering and applying
    the right words to the right situation. You''re not born knowing these, so you
    need to learn them.


    +   * **STEP 1** If you''ve chose Python 3, reopen it in whichever operating system
    version you prefer. In the Shell, enter the following:


    ```

    print("Hello

    ```


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_13_0.png)


    +   * **STEP 3** You can see that instead of the number 4, the screen output is
    2+2 you asked to be printed to the IDLE Shell; the quotation marks are defining
    what''s being output to the total of 2+2 you need to remove


    ```

    print(2+2)

    ```


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_13_1.png)


    +   * **STEP 2** Just as predicted, the word Hello appears in the Shell as blue,
    indicating output from a string. It''s fairly straightforward and doesn''t require
    much explanation. Now try:


    ```

    print("2+2")

    ```


    +   * **STEP 4** You can continue as such, printing 2+2, 464+234 and so on to
    the Shell. An easier way is to use a variable, which we will cover in detail later.
    For now, enter:


    ```

    a=2

