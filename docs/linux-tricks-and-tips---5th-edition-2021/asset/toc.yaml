- - '##'
  - 步骤 5 为你的代码输入一个名称，例如 'print hello'，然后点击保存按钮。一旦 Python 代码被保存，它就会被执行，输出结果将在 IDLE
    Shell 中详细显示。在这种情况下，输出为 'Hello everyone!'
- - '##'
  - 步骤 8 让我们扩展代码，并输入上一个教程中的几个示例：
- - '##'
  - 步骤 6 这是你编写大部分 Python 代码的地方。将其输入编辑器中，按下 F5，保存代码并查看 Shell 中的输出。根据你是否请求了变量，某些内容会有所不同，但本质上，这是我们在书中将一直使用的过程，除非另有说明。
- - '##'
  - 步骤 9 如果你点击 OK 按钮，文件将被新的代码条目覆盖，并在 Shell 中执行输出。对于这几行代码来说不是问题，但如果你正在编辑文件，覆盖可能会变成问题。相反，使用编辑器内的
    File > Save（文件 > 另存为）来创建备份。
- - '##'
  - 步骤 7 如果打开保存的 Python 代码文件，你会发现它以 .py 扩展结尾。这是 Python 的默认名称。你创建的任何代码可以是从网络资源下载的任何代码都属于你。只需确保代码是适用于
    Python 3 的。
- - '##'
  - 步骤 10 创建一个新文件。打开编辑器，创建一个新实例（File > New File from the Shell，文件 > 从 Shell 新建文件）。输入以下内容并保存为
    hello：
