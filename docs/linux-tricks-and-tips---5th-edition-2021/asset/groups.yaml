    第一批在受控系统外（即进入野外）传播的程序病毒之一被称为 Elk Cloner，它是由 15 岁的 Rich Skrenta 在 1982 年 编写的。


    Elk Cloner 设计用于感染 Apple DOS 3.3 操作系统，并附带在一个游戏中。当游戏玩五十次时，病毒就会激活，它不会显示游戏，而是破坏屏幕并显示一诗：


    Elk Cloner: 一个具有个性的程序


    它会粘着在你所有的磁盘上

    它会渗透你的芯片

    是的，它是 Cloner！


    它会像胶水一样粘着你

