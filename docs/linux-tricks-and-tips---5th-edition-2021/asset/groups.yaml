    ## Your First C++ Program


    The Raspberry Pi makes for a great coding base on which to learn C++. You won''t
    need any complicated, third-party IDEs or to install any extra components. Everything
    you need to get started is already built into the Pi.


    ### HELLO, WORLD!


    It''s traditional in programming for the first code to be entered is to de-out
    the words ''Hello, World!'' to the screen. Interestingly, this dates back to 1968
    using a language called BCPL.


    You can use the Geany Programmer''s Editor to write, compile and execute your
    C++ code on the Raspberry Pi. You can find Geany as the first entry in the Programming
    section from the main Raspberry Pi Menu. Click the Geany icon to open and start
    coding.


    It doesn''t look like much at the moment but you can get into what the C++ headers
    mean in the code. Geasy uses syntax highlighting, meaning it colors the code depending
    on the language. Activate this, save the code by clicking on File > Save As. Now
    name the code helloworld.cpp and click the Save button.


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_41_0.png)


    The Geasy editor is quite powerful while still being easy to use. All the code
    you enter in the main window is numbered to help you keep track of your code.
    For now, in line 1, enter:


    ```cpp

    #include <iostream>

    ```


    The colour coding helps a lot when you are coding. Now press Enter and start a
    new command on line 3. Enter the following:


    ```cpp

    int main()

    ```


    Note: there''s no space between the brackets.


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_41_1.png)


    ## Your First C++ Program


    ### STEP 5

    On the next line, below main(), a curly bracket:


    This can be done by pressing Shift and the key to the right of P on an English
    UK keyboard layout:


    ### STEP 8

    Now you need to close the code, inserting the opposite curly bracket. On line
    7 enter:


    Note that you won''t need to backspace to the start of the line, removing the
    indent; by entering the curly bracket Geany jumps to the correct part of the line,
    ending the code block.


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_42_0.png)


    ### STEP 6

    Notice that Geany has automatically created a slight indent. This is to denote
    the structure of C++ and it''s where the meat of the code is entered. Now enter:


    ```cpp

    //My first C++ program

    ```


    ### STEP 9

    Essentially, these are your first steps into the world of coding in C++. We will
    look at the structure of the code in more detail on the next couple of pages;
    for now, click the Save button represented by a filing cabinet with a green downward
    pointing arrow.


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_42_1.png)


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_42_2.png)


    ### STEP 7

    Note again the colour change. Press Return at the end of the previous step and
    then enter:


    ```cpp

    std::cout << "Hello, world!";

    ```


    ### STEP 10

    If you haven''t done so already, it''s always advisable to create a blank folder
    where you can save all your code. You can have one for Python and C++ or a single
    folder coded, whichever you prefer. It''s not a necessity, just good housekeeping.


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_42_3.png)


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_42_4.png)


    ## Structure of a C++ Program


    C++ has a very defined structure and way of doing things. Miss something out,
    even as small as a semicolon, and your entire program will fail to be compiled
    and executed. Many a professional programmer has fallen out of sloppy structure.


    ### <C++ STRUCTURE>


    Learning the basics of programming, you begin to understand the structure of a
    program. The commands may be different from one language to the next but you can
    start to see how the code works.


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_43_0.png)


    C++ was invented by Danish student Bjarne Stroustrup in 1979, as a part of his
    PhD thesis initially C with Classes, was called C++, which added features to the
    already popular C programming language, while making it a more user-friendly environment
    through a new structure.


    ```cpp

    int main() initiates the declaration of a function, which is a group of code statements
    under the main name. All C++ code begins at the main function, regardless of whatever
    it lies within the code.

    ```


    ```cpp

    helloworld.cpp

    1 #include <iostream>

    2

    3 int main()

    ```


    **INCLUDE** The structure of a C++ program is quite precise. C++ code begins with
    a directive: `#include <`. The directive instructs the pre-processor to include
    a section of the C++ code. For example: `#include <iostream>` includes the header
    to support input/output operations.


    **BRACES** The open brace (curly brackets) is something that you may not have
    come before, especially if you''re used to Python. The open brace indicates the
    beginning of the main function and all the code that belongs to that function.


    ```cpp

    helloworld.cpp

    1 #include <iostream>

    2

    3 int main()

    4 {

    5

    6

    7

    8}

    ```


    **COMMENTS** Lines that begin with a double slash are comments. This means they
    won''t be executed by the compiler. Comments are designed to help you, or another
    programmer looking at your code, explain what''s going on. There are two types
    of comment: `//` covers multiple lines and `/* */` covers single line.


    **<<** The two chevrons used here are insertion operators. This means that whatever
    follows the chevrons is inserted into the `std::cout`. In this case they''re ''Hello,
