    print("You now have,", a, "lives left!")


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_23_1.png)


    - STEP 2 运行代码将在 IDLE Shell 窗口返回行：The value of A is, 10，这是我们预期的。现在，添加一些你通常在代码中看到的注释：


    - 设置 A 的初始值为 10

    a=10

    # 打印 A 的当前值

    print("The value of A is", a)

