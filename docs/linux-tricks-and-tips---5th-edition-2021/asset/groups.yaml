    - 步骤 2 如果你的代码已准备就绪，查看菜单栏图标行那里有一个红色砖块图标。这是“构建（Build）”，点击它可以运行代码，检查其是否符合 C++ 标准以查看是否存在阻止运行的错误。


    - 步骤 4 成功构建后，是时候执行它了。在构建图标旁边有一个纸飞机图标，这是“运行（Run）”图标。你无法运行未构建或位置存在错误的代码。点击运行图标。


