    \    * cover several lines\n    * without the need to add more slashes */\n\n\
    \    cout << \"And greetings from C++\";\n}\n```\n\n```cpp\n/* This comment_can\n\
    * cover several lines\n* without the need to add more slashes */\n```\n\nThankfully,\
    \ many do this automatically but be aware of it when using IDEs.\n\n## Variables\n\
    \nVariables differ slightly when using C++ as opposed to Python. In Python, you\
    \ can simply state that 'a' equals 10 and a variable is assigned. However, in\
    \ C++ a variable must be declared with its type before it can be used.\n\n## THE\
    \ DECLARATION OF VARIABLES\n\nYou can declare a C++ variable by using statements\
    \ in the code. There are several distinct types of variable you can declare. Here's\
    \ how it works.\n\n- **STEP 1** Open up a new, blank C++ file and enter the usual\
