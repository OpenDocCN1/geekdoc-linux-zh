    \ << b;\n```\n\nThe `cout << \"\\n\";` part places a new line between the output\
    \ of 10 and 5.\n\n```cpp\nVariables.cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\nint a;\nint b;\na = 10;\nb = 5;\ncout << a;\ncout << \"\\\
    n\";\ncout << b;\n}\n```\n\n- **STEP 2** Start by creating two variables, a and\
    \ b, with having one value of 10 and the other 5. Use the data type to declare\
    \ these variables. Within the curls use:\n\n```cpp\nint a;\nint b;\na = 10;\n\
    b = 5;\n```\n\n- **STEP 4** Naturally you can declare a new variable, call it\
    \ and output some simple arithmetic:\n\n```cpp\nint result;\nresult = a + b;\n\
    cout << result;\n```\n\nInsert the code into the code as the screenshot.\n\n```cpp\n\
