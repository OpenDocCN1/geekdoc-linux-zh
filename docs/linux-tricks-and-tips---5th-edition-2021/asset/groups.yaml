    # C++ Linux


    # Using Comments


    While comments may seem like a minor element to the many lines of code combine
    to make a game, application or even an entire operating system, in fact they''re
    probably one of the most important factors.


    # THE IMPORTANCE OF COMMENTING


    Comments inside code are basically human readable descriptions detail what the
    code is doing at that particular point. They don''t sound especially important
    but without comments is one of the frustrating things unless you''re a professional
    or just starting out.


    In short, code should be commented in such manner as to effectively describe the
    purpose of a line, section or individual elements. You should get into the habit
    of commenting as much as possible so that someone who doesn''t know how about
    programming can understand what you are doing by reading it.


    In a professional environment, comments are vital to the success of the code and
    ultimately, the company or project. In an organisation, many programmers work
    in teams alongside engineers, developers, analysts and managers. If part of the
    team that''s writing a piece of software for the company, your comments help save
    a lot of time when doing something wrong and another team has to pick up and follow
    the trail to inside.


    The best comments are always concise and link the code logically, detailing what
    the program hits a line or section. You don''t need to comment on every line.
    Something along the lines of: if xequals zero then do that; it''s going to be
    obvious to the reader. However, if x equals something that drastically changes
    the program for the user, such as they''ve run out of lives, it certainly needs
    to be commented.


    Even if the code is yours, you should write comments if you are sharing with others
    publicly. This way you can return to code and understand why you did it or where
    it went wrong, or what worked terribly.


    Comments are good practice and you will understand how to add a comment when needed,
    unless it''s second nature.


    Place yourself in the shoes of someone''s job is to find out what''s wrong with
    your program. A program has excess of 8000 lines of code, spread across several
    different modules. You may also need a little help from the original programmers
    in order to make sense of a good comment.


