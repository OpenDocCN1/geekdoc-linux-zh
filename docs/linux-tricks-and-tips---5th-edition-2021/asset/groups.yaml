    \ 语句开始。如果这检查是否为真，则运行缩进的代码：\n\n```python\nx = 0\nwhile x < 10:\n    print(x)\n\
    \    x = x + 1\n```\n\n步骤 3 `For` 循环是另一个例子。`For` 用于遍历数据范围，通常是存储在方括号中的列表形式变量。例如：\n\
    \n```python\nwords=(\"Cat\", \"Dog\", \"Unicorn\")\nfor word in words:\n    print(word)\n\
    ```\n\n![](img/8be85e08b9ef86e0a62cd21bd550837a_32_1.png)\n\n步骤 2 `If` 和 `while`\
