    print("Hello everyone!")

    ```


    Just enter it into the IDE as you''ve done in the previous steps.


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_12_0.png)


    **STEP 8** The Python IDE is a configurable environment. if you don''t like the
    way colours are represented, then you can change them via Options > Configure
    IDE and Clicking on the Highlighting Tab. We don''t recommend that, as you won''t
    be seeing the same as screenshots.


    **STEP 6** This is a bit more like it, since you''ve produced your first bit of
    code. The Print command is self-explanatory, if you think. Python 3 requires the
    brackets as well as quotes in order to output the content to the screen, then
    you can see ''hello world''.


    **STEP 9** Just like most other programs, regardless of the operating system,
    there are numerous shortcut keys. You won''t have room for them all unless you
    use Options > Configure IDE and the Keys tab, then you can see a list of the current
    bindings.


    ```python

    >>> print("Hello everyone!")

    Hello everyone!

    ```


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_12_1.png)


    **STEP 7** You have noticed the colour coding within the Python IDE. The colours
    represent different elements of code. they are:


    **STEP 10** The Python IDE is a power interface and all of the GUI toolkits''ve
    actually been written in Python if you want to know many the ins and outs of the
    Shell, we recommend you take a moment to view www.python.org/library/idle.html,
    which details many of the IDE''s features.


    | Black - Data and Variables | Blue - User Functions |

    | --- | --- |

    | Green - Strings | Red - Comments |

    | Purple - Functions | Light Red - Error Messages |

