    \ within your code.\nto extend your example, use:\n\n```python\nimport random\n\
    import math\nfor i in range(5):\n    print(random.randint(1, 25))\nprint(math.pi)\n\
    ```\n\n![](img/8be85e08b9ef86e0a62cd21bd550837a_34_0.png)\n\nSTEP 6 The modules\
    \ contain the extra code needed to achieve a certain result within your own code,\
