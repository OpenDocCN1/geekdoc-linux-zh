    \ in could look like\n\n```cpp\nint a = 10;\nint b = 5;\nint result = a + b;\n\
    ```\n\n```cpp\ncout << result;\n```\n\nSTEP 8: The previous steps create the variable\
    \ StartLives, which is a global variable. In a game, for example a player's lives\
    \ go up or down depending on how well or bad they're doing. When the player restarts\
    \ the game, the StartLives returns to its default status 3. Here we've assigned\
    \ 3 lives, subtracting\n\n```cpp\nVariables.cpp\n#include <iostream>\nusing namespace\
    \ std;\nint StartLives = 3;\nint main() {\nStartLives = 1;\ncout << StartLives;\n\
    }\n```\n\nSTEP 9: The modern C++ compiler is far more intelligent than most programmers\
