    ## STEP 5


    你也可以使用运算符来获取除法留下的余数。例如：


    # 10/3


    将显示 3.333333333，即 3.3 循环小数。如果你现在输入：


    # 10%3


    这将显示 1，即 10 除以 3 得到的余数。


