    27960110291170634

    ** 1/2

    0.5

    ** 6/2

    3

    ** 2*3

    6

    ** (1+2)*4

    12

    ** 1/2

    0.5

    ** 10/3

    3.3333333333333335

    ** 10%3

    1

    1000000000

    ```


    ## STEP 8


    format(3, ''b'')


    format 命令将一个值 3 转换为由格式规范（''b'' 部分）控制的格式化表达式。


    ```

    ** 2**2

    4

    ** (2+3)

    5

    ** 1/2

    0.5

    ** 6/2

    3

    ** 3.3333333333333335

    3

    ** 2**2

    4

    ** SP**10

    1000000000

    ''011''

    ** format(3, ''b'')

    3

    ```


    ## STEP 6


    接下来我们使用幂运算符（或指数）来计算某个数值的幂，你可以在键盘上使用双乘号符号或连字符。


    # 2**2


    # 10**10


    本质上，它是 2x2，但我们相信你已经了解数学运算符背后的基础。这在 Python 中是这样工作的：


    ```

    ** 6/2

    3

    ** 2*3

    6

    ** (1+2)*4

    12

    ** 1/2

    0.5

    ** 10/3

    3.3333333333333335

    3

    ** 10**10

    10000000000

    ```


    ## STEP 9


    布尔值（Boolean）是一个逻辑真（true）或假（false）的逻辑语句。我们可以用它们来比较数据，查看它们是否小于或大于另一个。在新文件中：


    ```

    a = 6

    print(1, a == 6)

    print(2, a == 7)

    print(3, a == 6 and b == 7)

    print(4, a == 7 and b == 7)

    print(5, not a == 7 and b == 7)

    print(6, a == 7 or b == 6)

    print(7, a == 7 or b == 6)

    print(8, not (a == 7 and b == 6))

    print(9, not a == 7 or b == 6)

    ```


    ## STEP 7


    数字和表达式不仅于此。Python 有许多内置函数来处理数字、绝对值、复数以及各种数学和 Python 语言。例如，要将数字转换为二进制，使用：


    # bin(3)


    ```

    ** 1/2

    0.5

    ** 6/2

    3

    ** 2*3

    6

    ** (1+2)*4

    12

    ** 15

    15

    ** 1/2

    0.5

    ** 10/3

    3.3333333333333335

    3

    ** 10**10

    10000000000

    ** bin(3)

    ''0b11''

    ```


    ## STEP 10


    执行步骤 9 中的代码，你可以看到一系列 True 或 False 语句，这取决于两个值（6 和 7）的结果！这是编程的一个重要部分。


