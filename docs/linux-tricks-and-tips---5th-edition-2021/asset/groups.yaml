- md: "\n## C++ Maths\n\nSTEP 5 The interesting math contents comes when you call\
    \ upon dozens of mathematical C++ Library. This header defines functions along\
    \ with other operations. Everything from computing square to tangent with two\
    \ parameters, to the value of Pi. You can call the header with:\n\nSTEP 8 Calculating\
    \ powers of numbers can be done with:\n\n```cpp\n#include <iostream>\n#include\
    \ <cmath>\nusing namespace std;\nint main() {\n  float number = 12;\n  cout <<\
    \ \"number to the power of 2 is \" << pow(number, 2) << \"\\n\";\n  cout << \"\
    number to the power of 3 is \" << pow(number, 3) << \"\\n\";\n  cout << \"number\
    \ to the power of 0.8 is \" << pow(number, 0.8) << \"\\n\";\n}\n```\n\n```cpp\n\
    maths.cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\nint main()\
    \ {\n  cout << \"the square root of \" << sqrt(134) << \"\\n\";\n}\n```\n\nSTEP\
    \ 6 Start by getting the square root of a number:\n```cpp\n#include <iostream>\n\
    #include <cmath>\nusing namespace std;\nint main() {\n  float number = 134;\n\
    \  cout << \"the square root of \" << sqrt(134) << \" is: \\n\";\n}\n```\n\nSTEP\
    \ 9 We created a float called number with the value of 12 and the power of 2 is\
    \ calculation happens. Of course, you can calculate powers and square roots without\
    \ using variables. For example, pow(12, 2) outputs the same value as the first\
    \ line in the code.\n\n| Calculation | Result |\n|---|---|\n| 12 to 2 | 144 |\n\
    | 12 to 3 | 1728 |\n| 12 to 0.8 | 7.3037 |\n\n```cpp\nmaths.cpp\n#include <iostream>\n\
    #include <cmath>\nusing namespace std;\nint main() {\n  float number = 134;\n\
    \  cout << \"the square root of \" << sqrt(134) << \" is: \\n\";\n}\n```\n\nSTEP\
    \ 7 We created a new float called number to display the square root of 134, the\
    \ value of the variable. Build and run the code and your answer is 11.5758.\n\n\
    The value of Pi is also stored in the math header library. It can be called up\
    \ with the M_PI function, or you can use it to:\n\n```cpp\n#include <iostream>\n\
    #include <cmath>\nusing namespace std;\nint main() {\n  double area, radius =\
    \ 1.5;\n  area = M_PI * radius * radius;\n  cout << \"area: \" << area << \"\\\
    n\";\n}\n```\n\n## User Interaction\n\nThere's nothing quite satisfying as creating\
    \ a program that responds to you. This basic user interaction is one of the most\
    \ taught aspects of any language and with it you're able to do much more than\
    \ simply greet the user by your name.\n\n### HELLO, DAVE\n\nYou have already used\
    \ cout, the standard output stream, throughout your code. Now you're going to\
    \ be using cin, the standard input stream, to prompt a user response.\n\n- Anything\
    \ that you want the user to input into the system memory needs to be stored somewhere\
    \ so it can be retrieved and used. Therefore, any input must first be declared\
    \ to be used by the user. Start creating a blank C++ file with headers.\n\nThe\
    \ cin command works in the opposite way from the cout command. With the first\
    \ line you use chevron. Cin uses facing chevrons, indicating an input. Output\
    \ 'What is your age?' to the screen, as indicated with the chevron. The input\
    \ is put into the integer age and called up in the second cout command. Build\
    \ and run the code.\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint\
    \ main() {\n    int age;\n    cout << \"What is your age: \";\n    cin >> age;\n\
    \    cout << \"\\nYou are \" << age << \" years old\\n\";\n}\n```\n\nThe data\
    \ type of the variable must also match the type of input you want from the user.\
    \ For example, to ask a user age, you would use an integer like this:\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    int age;\n    cout\
    \ << \"What is your age: \";\n    cin >> age;\n}\n```\n\nIf you are asking a question,\
    \ you need to store the input as a string; to ask the user name, you would use:\n\
    \n```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint\
    \ main() {\n    string name;\n    cout << \"What is your name: \";\n    cin >>\
    \ name;\n    cout << \"\\nHello, \" << name << \". I hope you're well today?\\\
    n\";\n}\n```\n\n### STEP 5\n\nThe principal works are the same as the previous\
    \ code. The user's input, is stored in a string, because it contains multiple\
    \ characters, and retrieved in the second cout line. As the variable 'name' doesn't\
    \ change, then you can recall whenever you like.\n\n```cpp\n#include <iostream>\n\
    #include <string>\nusing namespace std;\n\nint main() {\n    string name;\n  \
    \  cout << \"Enter your name: \";\n    getline(cin, name);\n    cout << \"Your\
    \ name: \" << name << \"\\nHello, \" << name << \". I hope you're well today\\\
    n\";\n    return 0;\n}\n```\n\n### STEP 6\n\nYou can change input requests to\
    \ the user just make sure you have a variable to store the input. Let's assume\
    \ you use the user to enter two numbers:\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    int num1, num2;\n    cout << \"Enter two\
    \ numbers: \";\n    cin >> num1 >> num2;\n    cout << \"You entered \" << num1\
    \ << \" and \" << num2 << \"\\n\";\n}\n```\n\n### STEP 7\n\nLikewise, input can\
    \ be manipulated once you have it in a string. For instance, ask the user for\
    \ two numbers:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    float num1, num2;\n    cout << \"Enter two numbers: \";\n    cin >> num1\
    \ >> num2;\n    cout << num1 << \" + \" << num2 << \" is: \" << num1 + num2 <<\
    \ \"\\n\";\n}\n```\n\n### STEP 8\n\nWhile cin works well for most tasks, it has\
    \ a limitation. Always considers spaces as a terminator, so for spaces use getline:\n\
    \n```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint\
    \ main() {\n    string mystr;\n    cout << \"Enter a sentence: \";\n    getline(cin,\
    \ mystr);\n    cout << \"Your sentence is \" << mystr.size() << \" characters.\\\
    n\";\n}\n```\n\n### STEP 10\n\ngetline is a command that C++ programmers forget\
    \ to include. It's best to use getline(cin, variable) in future:\n\n```cpp\n#include\
    \ <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    string\
    \ name;\n    cout << \"Enter your full name: \";\n    getline(cin, name);\n  \
    \  cout << \"Hello, \" << name << \"\\n\";\n}\n```\n"
  mdcn: "\n\n## C++ 数学\n\nSTEP 5 当你调用几十个数学 C++ 库时，有趣的数学内容就出现了。这个头文件定义了函数以及其他操作。从计算平方根到带有两个参数的正切值，再到\
    \ Pi 值。你可以通过如下调用调用头文件：\n\nSTEP 8 计算数字的次方可以通过方式完成：\n\n```cpp\n#include <iostream>\n\
    #include <cmath>\nusing namespace std;\nint main() {\n  float number = 12;\n \
    \ cout << \"number to the power of 2 is \" << pow(number, 2) << \"\\n\";\n  cout\
    \ << \"number to the power of 3 is \" << pow(number, 3) << \"\\n\";\n  cout <<\
    \ \"number to the power of 0.8 is \" << pow(number, 0.8) << \"\\n\";\n}\n```\n\
    \n```cpp\nmaths.cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\n\
    int main() {\n  cout << \"the square root of \" << sqrt(134) << \"\\n\";\n}\n\
    ```\n\nSTEP 6 从获取一个数字的平方根开始：\n```cpp\n#include <iostream>\n#include <cmath>\n\
    using namespace std;\nint main() {\n  float number = 134;\n  cout << \"the square\
    \ root of \" << sqrt(134) << \" is: \\n\";\n}\n```\n\nSTEP 9 我们创建了一个名为 number\
    \ 的 float 类型变量，其值为 12，并进行了 2 次方的计算。当然，你可以在不使用变量的情况下计算次方和平方根。例如，`pow(12, 2)` 输出的值与代码的第一行相同。\n\
    \n| 计算内容 | 结果 |\n|---|---|\n| 12 的 2 次方 | 144 |\n| 12 的 3 次方 | 1728 |\n| 12 的\
    \ 0.8 次方 | 7.3037 |\n\n```cpp\nmaths.cpp\n#include <iostream>\n#include <cmath>\n\
    using namespace std;\nint main() {\n  float number = 134;\n  cout << \"the square\
    \ root of \" << sqrt(134) << \" is: \\n\";\n}\n```\n\nSTEP 7 我们创建了一个新的 float 类型变量\
    \ number 来显示 134 的平方根，即变量的值。编译并运行代码，你的答案是 11.5758。\n\nPi 的值也存储在数学头文件库中。可以通过 `M_PI`\
    \ 函数调用它，或者用它来：\n\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace\
    \ std;\nint main() {\n  double area, radius = 1.5;\n  area = M_PI * radius * radius;\n\
    \  cout << \"area: \" << area << \"\\n\";\n}\n```\n\n## 用户交互\n\n没有什么比创建一个对你做出响应的程序更令人满足的。这种基础的用户交互是任何语言中最常教授的方面之一，通过它，你可以做比仅仅用你的名字问候用户多得多。\n\
    \n### 你好，DAVE\n\n你已经在整个代码中使用了 `cout`（标准输出流）。现在你将使用 `cin`（标准输入流）来提示用户响应。\n\n- \
    \  任何你想让用户输入到系统内存中的内容都需要存储在某处，以便可以检索和使用。因此，任何输入都必须先声明为供用户使用。开始创建一个带有头文件的空白 C++\
    \ 文件。\n\n`cin` 命令的工作方式与 `cout` 命令相反。在第一行中你使用了尖括号。`cin` 使用面向的尖括号，表示输入。在屏幕上输出“你多大了？”，如尖括号所示。输入被放入整数\
    \ `age` 中，并在第二个 `cout` 命令中调用。编译并运行代码。\n\n"
