    ## C++ 程序的结构


    C++ 有着非常明确结构和处理方式。漏掉任何内容，即使是一个微小的分号，你的整个程序将无法编译和执行。许多专业程序员都因为结构疏松而栽过头。


    ### <C++ 结构>


    学习编程基础后，你开始理解程序的结构。命令在不同语言之间可能不同，但你可以开始看到代码是如何运行的。


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_43_0.png)


    C++ 是丹麦学生 Bjarne Stroustrup 在 1979 年发明的，最初作为他博士论文的一部分称为带类的 C（C with Classes），后来被称为
    C++，它在已经在流行的 C 语言语言基础上增加了功能，同时通过新的结构使其成为更加用户友环境。


    ```cpp

    int main() 初始化了一个函数的声明，它是 main 命名下的一组代码语句。无论它位于代码的什么位置，所有 C++ 代码都从 main 函数开始。

    ```


    ```cpp

    helloworld.cpp

    1 #include <iostream>

    2

    3 int main()

    ```


    **INCLUDE（包含）** C++ 程序的结构非常精确。C++ 代码以指令开头：`#include <`。该指令指示预处理器包含一段 C++ 代码。例如：`#include
    <iostream>` 包含了支持输入输出操作的头文件。


    **BRACES（大括号）** 大括号（圆括号）是你可能没见过的东西，特别是如果你习惯了 Python 的话。大括号表示 main 函数以及所有属于该函数的代码的开始。


    ```cpp

    helloworld.cpp

    1 #include <iostream>

    2

    3 int main()

    4 {

    5

    6

    7

    8}

    ```


    **COMMENTS（注释）** 以双斜杠开头的行是注释。这意味着它们不会被编译器执行。注释的设计是为了帮助你，或者查看你代码的另一个程序员解释正在发生什么。注释有两种类型：`//`
    覆盖多行，`/* */` 覆盖单行。


    **<<（插入运算符）** 这里使用的两个尖括号是插入运算符。这意味着紧随尖括号的任何内容都会插入到 `std::cout` 中。在这种情况下，它们是 ''Hello,
    world!''，编译时显示在屏幕上。


    ## 编译与执行


    你已经创建了第一个 C++ 程序，现在你理解了背后的结构。让我们行动起来，编译并执行（或者如果你愿意，叫运行）程序，看看它是什么样子。


    ### 来自 C++ 的问候


    在 Geany 内部编译和执行代码非常简单，只需点击几个图标并查看结果即可。操作方法如下：


    - 步骤 1 如果你还没有打开，打开 Geany 并加载之前保存的 World 代码。确保没有可见的错误，注意窗口顶部。


