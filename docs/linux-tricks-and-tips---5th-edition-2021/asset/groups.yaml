    \ // or a forward slash and an asterisk /*. You've already seen some brief examples\
    \ but this is how they work.\n\n## STEP 1\n\nUsing the Hello World as an example,\
    \ you can easily comment on different sections of the code using the forward slash:\n\
    \n```cpp\n//My first C++ program\ncout << \"Hello, world!\"\n```\n\nhelloworld.cpp\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // My\
    \ First C++ program\n    cout << \"Hello, world!\";\n\n    cout << \"And greetings\
    \ from C++\";\n}\n```\n\n## STEP 4\n\nBe careful when commenting, especially with\
    \ comments, it's very easy to forget to add the closing asterisk and slash any\
    \ code that falls inside the comment block.\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    // My first C++ program\n    cout << \"\
    Hello, world!\" // This outputs the words 'Hello, world.'\n    /* comment lines\
    \ / without the need to add more slashes */\n\n    cout << \"And greetings from\
    \ C++\";\n}\n```\n\n## STEP 2\n\nHowever, you can also add comments to the end\
    \ of a line of code, in a better way with going on:\n\n`cout << \"Hello, world!\"\
    ; // This outputs the words 'Hello. world.' The // denotes a new line at an end\
    \ of a comment.`\n\nNote, you do not put a semicolon at the end of it. Because\
    \ it's a line in the code that is compiled by the compiler.\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    // My first C++ program\n\
    \    cout << \"Hello, world!\" // This outputs the words 'Hello, world.' The //\
    \ denotes a new line\n    cout << \"And greetings from C++\";\n}\n```\n\n## STEP\
    \ 5\n\nObviously if you try and build the code it errors out of complaining of\
    \ a missing bracket '}' to the end of the block. If you make it a few times, then\
    \ it can be time to go back and rectify it. The colouring of code helps you identify\
    \ this code.\n\n| Symbols | helloworld.cpp |\n| :--- | :--- |\n| Functions | #include\
    \ <iostream>\\nusing namespace std;\\nint main() {\\n// My First C++ program\\\
    ncout << \"Hello, world!\" // This outputs the words 'Hello, world.'\\n/* This\
    \ comment can cover several lines / without the need to add more slashes */\\\
    ncout << \"And greetings from C++\";\\n} |\n\n## STEP 3\n\nYou can comment out\
    \ several lines by using the forward slash and asterisk: /*\n\n```cpp\n/* This\
    \ comment\ncover several lines\nwithout the need to add more slashes */\n```\n\
    \nRemember to finish the comment block with the opposite asterisk and forward\
    \ slash.\n\n## STEP 6\n\nWith comments, it's good practice in C++ to comment the\
    \ block. This adds an asterisk to each line of comment to remember the comment\
    \ block before continuing with the code:\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    // My first C++ program\n    cout << \"\
