    \ can use in...\n\nSTEP 6: Specific to C++, you can also use the following to\
    \ assign values as soon as you declare them:\n\n```cpp\nint a (100);\nint b (5);\n\
    ```\n\nThen, from the C++ 2011 standard, using brackets:\n\n```cpp\nVariables.cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\nint a (100);\nint b (5);\n\
    int result (a + b);\ncout << result;\n}\n```\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nauto pi = 3.141593;\nint main() {\ndouble area = 1.5;\n\
    area = pi * radius;\ncout << area;\n}\n```\n\nSTEP 7: You can create global variables,\
    \ which are declared outside any function, and local variables. For example:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nauto pi = 3.141593;\nint\
    \ main() {\ndouble area = 1.5;\narea = pi * radius;\ncout << area;\n}\n```\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nauto pi = 3.141593;\nint main()\
    \ {\ndouble area = 1.5;\narea = pi * radius;\ncout << area;\n}\n```\n\n## Data\
    \ Types\n\nThere are many different types available in C++, such as integer, float,\
    \ boolean, double, and wide character. These are declared outside any function\
    \ or local within a function.\n\n## THE VALUE OF DATA\n\n| Type | Command |\n\
    | :--- | :--- |\n| Integer | int |\n| Floating Point | float |\n| Boolean | bool\
    \ |\n| Double | double |\n| Wide Character | wchar_ |\n| No Value | void |\n"
