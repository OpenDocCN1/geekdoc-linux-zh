    >>> [ 1 True

    >>> 2 False

    >>> 3 True

    >>> 4 True

    >>> 5 False

    >>> 6 True

    >>> 7 True

    >>> 8 False

    >>> 9 False

    >>> ]

    ```


    ## 使用注释


    在编写代码时，流程、每个变量的作用以及整个程序将如何运行都在你的脑海中。另一个程序员可以逐行阅读代码，但随着时间的推移，代码可能会变得难以阅读。


    ## # #注释！


    程序员使用通过对某些部分进行注释的方法来保持代码的可读性。例如，如果使用了一个变量，程序员会注释其预期的作用。这只是一种良好的习惯。


    - STEP 1 首先创建一个 IDLE 编辑器新实例（文件 > 新建文件），并创建一个简单的变量和打印命令：


