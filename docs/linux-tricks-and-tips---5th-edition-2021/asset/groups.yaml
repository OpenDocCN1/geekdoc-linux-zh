    # 开始学习 Python


    如果你正在使用新的树莓派及其最新版本的 Pi OS，你需要手动安装 Python IDLE。这是因为树莓派团队已经移除了核心的 Python IDLE，转而使用他们自己的代码编辑器。


    ## 开始使用 Python


    对于使用 PI4 和新款树莓派的用户，请进入终端并输入：`sudo apt-get install idle3`。旧版本的树莓派已经预装了官方的 Python
    IDLE。


    ### 步骤 1

    加载树莓派桌面后，点击菜单按钮中的“编程 (Programming) > Python 3 (IDLE)”。这将打开 Python 3 Shell。Windows
    和 Mac 用户可以在 Windows 开始菜单或访达（Finder）中找到 Python 3 IDLE Shell。


    ### 步骤 3

    例如，在 Shell 中输入：**2+2**。按下回车键后，下一行将显示答案：4。Python 接收了“代码”并产生了相应的输出。


