    \n## 真条件\n\n开始时保持条件简单会让学习编程成为一种更快的体验。让我们从检查某物是否为真（TRUE），如果不是则执行其他（else）开始。\n\n\
    - **步骤 1** 让我们创建一个新的 Python 程序，要求用户输入一个单词，然后检查它是否为四个字母单词。从文件 > 新建文件（File > New\
