    print("The value of A is", a)

    ```


    保存文件并执行它。


    - STEP 3 预留代码并执行它。你可以看到 IDLE Shell 中的输出仍然与之前相同，尽管增加了额外的行。简单来说，哈希符号（#）表示程序员可以插入的一行文本，用于在用户不察觉的情况下告知他们和他人正在发生什么。


    ![](img/8be85e08b9ef86e0a62cd21bd550837a_23_0.png)


    - STEP 2 运行代码将在 IDLE Shell 窗口返回行：The value of A is, 10，这是我们预期的。现在，添加一些你通常在代码中看到的注释：


    - 设置 A 的初始值为 10

    a=10

    # 打印 A 的当前值

    print("The value of A is", a)


    - STEP 4 假设我们创建的变量 A 是游戏中的生命次数。每当玩家死亡时，值就会减少 1。程序员可以在此处插入一条路由行：


    - a=1

