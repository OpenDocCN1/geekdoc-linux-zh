    ## IN-DEPTH

    ## Sniffnet


    well as the number of packets transmitted. On the far right, under the Bytes column,
    you will also find the volume of data that has been transferred per connection.


    view this text file, click on Full report to open it in your desktop environment''s
    standard text editor (Figure 3). The application updates the log in real-time.


    During testing, I found a few bugs. On Ubuntu 22.04, the software refused to open
    the report when I pressed the Full report button, but you can work around this
    by restarting the program. One more serious issue: Sniffnet deletes the logs almost
    immediately. Furthermore, Sniffnet does not resolve IP addresses into names—you
    have to manually do it and cannot copy snippets from the live log; you extract
    them after generating a log (if it serves). Sniffnet still has great potential
    for improvement.


    Sniffnet also colors data in the monitoring window. Incoming connections are shown
    in red, while outgoing are colored in blue. You can change this view by clicking
    a radio button. Most radio buttons display by the number of packets per connection,
    or most bytes sort by ascending descending or by volume of data transferred.


    If you want to change something during a run, click the arrow icon in the upper
    left to take you back to the main window. It is important to note that the filter
    is reset on every restart. If you need, you can save the logs after terminating
    the application or before restarting the software.


    ## Complete


    In its graphical view, Sniffnet shows you the most recent data. To track the traffic
    over time, Sniffnet logs all connections and their activities as a table in the
    file sniffnet_report.txt.


    If you want to see what''s happening with your network traffic, Sniffnet offers
    a self-explanatory solution for all levels of users. The tool analyzes capabilities;
    if you are having problems with your network connection, you will need to check
    the logs.


