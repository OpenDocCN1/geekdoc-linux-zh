    | 3: LOAD | .dynstr |

    | 4: LOAD | .rela.plt |

    | 5: LOAD | .text |

    | 6: DYNAMIC | .plt |

    | | .data |

    | | .got_plt |

    | | .bss |

    | | .dynamic |

    | | .symtab |

    | | .strtab |

