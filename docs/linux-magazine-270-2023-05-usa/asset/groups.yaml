    # ELF 文件格式


    ## 节的内容

    此示例并不需要表 1 中描述的所有节，但对 .text、.plt、.gdt 和 .rel_a 节的简要描述将让你了解这些节如何构建 32 位有符号值的结构。


    > .text 节执行程序列举 (4) 中的程序可执行代码。该代码调用 `puts` 将字符串打印到终端，并将控制权交还操作系统。


    x86-64 指令通常使用相对寻址。这意味着，例如，一个 CALL 的编码取决于距离调用处的距离（目标地址被编码）。这使得无法对一个无法适应在 32 位内的地址或函数调用进行编码。解决方案是使用过程链接表
    (plt) 和全局偏移表 (got)，它们在 .plt 和 .gdt 节中描述。PLT 包含该二进制文件本地的本地地址，因此其所有列表都可以通过 32 位相对调用进行访问。它使用
    `JMP` 指令跳转到真实函数，该地址由动态链接器放置在 GOT 中。PLT 和 GOT 还允许动态链接器仅在需要时才解析地址，从而加速加载过程。


    列表 5 定义了 .plt 和 .gdt 节的一些特征。我们需要使用 .rel_a 节来定义静态重定位的宏，使用之前提到的 24 字节结构（列表 6）。


    ## 列表 6：重定位


    ```

    01 macro RELOCATION symbol_name plane

    02 :

    03 ; 链接器必须填充的 qword 地址

    04 ; must fill in

    05 dq LOAD_BASE + plane + symbol_name@got

    06 ; 符号索引和类型，编码在

    07 ; 单个字中；

    08 dq (symbol_name# shl 32) or R_X86_64_JMP_SL

    09 ; 无地址。

    10 dq 0

    11 )

    12 ...

    13 ...

    14 ...

    15

    16 ; 实际重定位

    17 SECTION_REL_PLT:

    18

    19 RELOCATION count,index value

    20 RELOCATION exit,PLANES

    ```


    ## 导出与导入符号

    可执行文件通过链接导出符号 `environment` 和 `_start`，并导入 `puts` 和 `exit`。在列表 7 中，我将这些声明封装在一些便利宏中。


    ## 列表 7：导入与导出符号


    ```

    01 macro EXPORT count,index value 23 db (STR_GLOBAL shl 4) + ((ST_FUNC and Oxf))

    02 24 ; 我们不再为该符号提供更多

    03 25 信息，因为它本身

    04 ; 符号的可见性和类型 26 ; 已在另一个 ELF 对象中定义。

    05 ; 编码在字节中：\27 db

    06 (STR_GLOBAL shl 4) + ((ST_FUNC and Oxf))

    07 ; 使用“其他”字段。\28 db

    08 db 29 dq

    09 ; 符号所在的节。30 dq

    10 index 31 name#index = CSMBOL

    11 ; 32 CSMBOL = CSMBOL + 1

    12 ; 符号的虚拟地址。\34 dq

    13 value 35 ...

    14 ; 符号大小。\36 ...

    15 dq 8 37 dq

    16 name#index = CSMBOL 38 SECTION_DYNSYM

    17 ) 39 BEGIN_SYMBOLS

    18 40 NULL_SYMBOL

    19 macro IMPORT_FUNCTION name 41 IMPORT_FUNCTION puts

    20 42 IMPORT_FUNCTION exit

    21 ; 43 EXPORT_OBJECT environ, LINK_BSS, LOAD_BASE + PLANES + SLOT_environ

    22 dd name 44 EXPORT_OBJECT _program, LINK_DATA, LOAD_BASE + PLANES + SLOT__program

    ```


    ELF 经常会崩溃，但通常在崩溃前提供一些有帮助的信息。表 2 显示了使用 `readelf` 时的重要开关。


    ## 表 2：readelf 开关


    | 选项 | 说明 |

    |---|---|

    | -h | 打印 ELF 头部。 |

    | -s | 打印程序头以及节与段之间的关系。 |

    | -S | 打印有关节的详细信息。 |

    | -r | 打印重定位。 |

    | -x | 以十六进制打印节的内容。 |

    | -d | 打印动态节的内容。 |


    ## 调试手工的 ELF 镜像

    编写 ELF 文件很容易出错，`readelf` 工具对于检查 ELF 文件的有效性非常有用。可以快速识别损坏的文件。


    ## 信息

    - (1) FreeBSD: https://www.freebsd.org

    - (2) flat assembler: https://www.flatslammer.net

    - (3) 本项目的 Git 仓库：https://github.com/SamMaria1999/elf

    - (4) GNU Hash ELF 节：https://blogs.oracle.com/solaris/gnu-hash-elf-sections


    ## 结论

    我现在可以构建并运行 ELF 以确认其工作正常（图 2）。你可以轻松扩展我刚刚演示的 ELF 文件，在其文本节中包含更多的二进制代码。添加一个节是为了将任何共享头和函数的引用添加到相关节（包含线程本地存储等功能），并且访问程序参数可能需要特定的用例，这可能是将这
    500 多行汇编代码与编译器的输出结合以实现更高层次。它让你对二进制文件具有终极控制权，而无需诉助于十六进制这种粗糙的工具。


    ## 作者

    Alan Pbeam 是来自来自英国牛津郡的程序员兼作家。对于计算机，他得到过 Commodore 64（带有传奇的 BASIC）。他对编译器（尤其是 BASIC
    风格的）、汇编器、调试器、软件和历史有无尽的想象，同时也喜欢美食。


    ## Linux 杂志订阅

    扩展你的 Linux 技能：

    - 关于热门话题的深度文章，包括比特币、云计算等！

