    ## Fedora 37 Workstation and TUXEDO OS 2


    Two Terrific Distros on a Double-Sided DVD!


    ![](img/89cd889ee36b4c92cc520e4f74809806_5_0.png)


    ### Fedora 37 Workstation

    64-bit


    ### TUXEDO OS 2

    64-bit


    Fedora is a Red Hat-maintained community distro known for early adoption of new
    software components. The Fedora Workstation edition is focused on desktop operations
    in a professional setting. The Fedora 37 release includes the Gnome 43 desktop,
    which features a redesigned status menu and a major upgrade for the Files file
    manager. The latest Fedora also comes with updates to the support for human languages,
    as well as key updates to computer language components, including Python, glibc,
    and LLVM.


    TUXEDO OS is an Ubuntu-based Linux variant maintained by the European hardware
    vendor TUXEDO for use with their native Linux laptop systems. TUXEDO unveiled
    an ISO for general purpose Linux systems back in September, and they have also
    made their TUXEDO OS 2 release available to the public as a slim and responsive
    desktop system. TUXEDO OS 2 is based on Ubuntu 22.04. Who choose TUXEDO OS prefer
    the selection of native applications, the Flatpak package management system, and
    the attention to performance. In our tests, TUXEDO OS booted significantly faster
    than Ubuntu or Windows (see the article elsewhere in this issue).


