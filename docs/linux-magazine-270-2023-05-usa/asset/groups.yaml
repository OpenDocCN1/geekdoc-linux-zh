    # Energy-efficient programming with Go and beyond


    # Greener Coding


    Go has a reputation for producing energy-saving applications, but you still have
    to know what you are doing.

    By Tim Schürmann


    ![](img/89cd889ee36b4c92cc520e4f74809806_17_0.png)


    Applications use the processor in different ways, and those differences are reflected
    in the power bill. The programming language you choose has significant influence
    on energy consumption. But developers still need to go the extra mile to leverage
    the language''s capabilities.


    At glance, Go comes with efficiency: it has a lean syntax and smart Goroutines
    distribute tasks efficiently to the processor cores, avoiding a bloated runtime
    environment that manages complex class hierarchies or judges threads. The machine
    doesn''t seem to slow down as threads are added, converting the source code into
    a native and faster program, which means the computer can go back safer and save
    on energy.


    This contrasts with Java, where compiler converts the source code into bytecode
    which is then interpreted or executed by a virtual machine. This additional software
    layer slows down execution and costs unnecessary energy. The situation is even
    worse for interpreted languages: PHP and Python parse each line of code step-by-step.
    Numerous optimizations help, but they are still less, depending on the task. If
    you need to develop energy-efficient programs, you need Go for right? Or maybe
    not? The following looking at energy efficiency in Go is a useful entry for examining
    some more rules for more efficient coding.


    According to the study, compiling programming languages such as C and Go far more
    efficiently than interpreted counterparts such as PHP or Python. The results are
    less clear for languages that generate intermediate code. Java programs, for example,
    are more energy efficient than Go, but the virtual machine doesn''t seem to slow
    down – at not at the level of assumptions made in the trial, which has a bug in
    closer inspection.


    The SLE serves as a wake-up call for those who think they are automatically writing
    more efficient code just by choosing a clever look. This also points to the complexity
    of energy efficiency issues – the danger of making assumptions based on a single
    study.


    Initially researchers used only one compiler or interpreter for each language.
    Go compiler named Ti uses a framework to create highly optimized machine code
    for collectors [2]. The C code in the study was compiled exclusively using GCC.


    The Go compiler used version 1.6, and this was considered optimal at the time
    of the study. Of course, the other compilers and interpreters have also been revised
    and further optimized in the meantime. For example, PHP 8 can handle significantly
    more concurrent requests than its predecessors.


    # SLE Research


    Back in 2017, a team of researchers wanted to know which programming languages
    particularly energy-efficient applications. They presented the results of their
    study at the International Conference on Software Language Engineering (SLE [1]).


    # No Clouds


    The researchers used Computer Language Benchmark (Figure 2) for their measurements.
