    # LinkAce


    The LinkAce application is not synchronizing the existing bookmarks, but has an
    independent collection of bookmarks for later evaluation and archiving. Raspberry
    Pi is all you need for this—one is powerful enough. LinkAce uses PHP and a database
    in the browser. You can choose between MySQL, MariaDB, PostgreSQL or SQLite. The
    easiest way to set up LinkAce is through Docker.


    # Tags


    Tags and lists are used to classify links. Lists serve the purpose of bundling
    multiple links to a specific topic (Figure 10), tags are used for categorization.
    LinkAce also lets you optional guest access; the guest can see all links that
    do not classify as private. Access can be controlled separately for each tag,
    list, and link.


    Another way to share links is through link sharing, which is currently available
    for all different services. With an API key for the LinkAce API, your app can
    also be connected to other tools, which can then access and edit the data in LinkAce.


