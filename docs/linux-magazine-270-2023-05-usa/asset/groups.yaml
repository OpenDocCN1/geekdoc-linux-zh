    # NEWS

    ## Linux News


    ## Ubuntu No Longer Shipping with Flatpak


    Anyone who has followed the rise of universal package managers as Snap and Flatpak
    is fully aware of the difference between the two technologies and how one is more
    distribution agnostic than the other.


    I''m talking about Snap, which is driven by Canonical, the company that happens
    to be Ubuntu.


    Both Snap and Flatpak are great methods for installing software, especially applications
    that do not have ports to the more traditional package managers such as Apt and
    D. Snap and Flatpak make the installation of such tools as Spotify, Slack, and
    Skype considerably easier.


    Snap comes pre-installed with Ubuntu, the official Ubuntu spins, and many Ubuntu
    distributions. As well, official spins have also included Flatpak. The combination
    of Apt, Snap and Flatpak meant users had a plethora of applications to install.


    - Canonical has made the decision that Ubuntu spins are no longer shipped with
    Flatpak (https://help.ubuntu.com/community/ubuntu-22.04-34061). You can still
    install Flatpak on Ubuntu and any one of its spins from the standard repositories
    with the command `sudo apt-get install flatpak -y`.

    - This change affects all Ubuntu spins, including Kubuntu, Ubuntu Budgie, Ubuntu
    Kylin, Ubuntu MATE, Ubuntu Studio, and Ubuntu.


    ## openSUSE Leap 15.5 Beta


    You might not be surprised that the final release in openSUSE Leap 15 doesn''t
    include a lot of new features. In fact, this new release is quite brief in the
    features category. As expected, Leap 15.5 is really just bug fixes and new versions
    of the installed applications.


    However, tucked inside the list of new packages, you will find the migration tool,
    which makes it possible to migrate from one release to another with the ease of
    a GUI.


    The tool has been streamlined such that moving to the next release can be done
    with a single click. So, if you''re currently using an openSUSE Leap (or the 15.5
    Alpha), you can migrate to 15.5 with some of the new packages for openSUSE Leap
    15.5 include Python 3.10, systemd 252, KDE Plasma 5.27.101, and the Mesa 22.3
    graphics.


    openSUSE Leap was born in 2018, so it has had a good run so far. Anyone who wishes
    to get with the latest release of openSUSE Leap should check out the rolling release
    cycle, Tumbleweed (https://get.opensuse.org/tumbleweed/).


    However, for those who prefer a more traditional release cycle, Leap is the way
    to go. Download the beta version of openSUSE Leap (https://get.opensuse.org/leap/15.5/)
    and read the blog post about the release (https://news.opensuse.org/2023/02/21/leap-reaches-beta-phase/).


    ## Linux Kernel 6.2 Released with Hardware Support


    The latest Linux kernel has arrived and includes a number of improvements for
    hardware support, performance, and security.


    In a recent email to the LKML mailing list (https://lkml.org/lkml/2023/2/309),
    Lin Torvalds had to say: "But in the moment, please do 6.2 for testing. It''s
    not the latest release, as 6.1 ended up, but all regular releases will want some
    test time."


    Although 6.2 might not be "sexy", it still has plenty to offer. First up are improvements
    that include out-of-the-box support for Intel Graphics and On Demand. As well,
    Skylake CPUs have given a significant performance increase with an addition to
    address the Retbleeded CPU vulnerability.


    Linux 6.2 is also the latest kernel main support for Apple Silicon M1 Pro, Max,
    and Ultra. This particular work was upstreamed by the Linux team.


    Get the news in your inbox every two weeks.


    Subscribe FREE to Linux Update

    bit.ly/Linux-Update


    The NTFS3 driver includes the hidden files (to properly hide files when mounting
    Windows directories), nocase (for case-sensitive files and folders), which prevents
    renaming files and folders not allowed in Windows.


    Support has been added for the Sony Dualshock 4 game controllers, improved support
    for the OneX handling game console, for the Habana Gauss2 AI accelerator, and
    a number of improvements for ASUS motherboards.


    To find out of what''s gone into the 6.2 kernel, read parts one and two of the
    6.2 Merge window (part 1: https://lwn.net/Articles/917733/; part 2: https://lwn.net/Articles/918146/).


    ## Kubuntu Team Releases New Mini Desktop


    The NX GEN 2 is a small factor desktop pc with Ubuntu 22.04 pre-installed and
    plenty of power to help you be productive and entertained.


    The power behind this tiny computer shouldn''t surprise you, the specs. The NX
    GEN 2 comes with a 12th-gen Intel i7-12700 CPU with 16 cores running at 2.6GHz
    turbo boost, 8GB of DDR4-3200 RAM, and can handle up to 2TB NVMe SSD and a 4TB
    secondary SATA drive.


    The specs of the rest includes UHD Intel graphics, Wi-Fi 6E AX211, Bluetooth 5.3,
    3 USB-B ports, 1 USB-A port, audio/mic combo, 2 Thunderbolt ports, 1 RJ45 jack,
    and VESA monitor support.


    The NX GEN 2 has also been tested and configured for expansion. However, the graphics
    are suitable for most use cases. The pricing for NX GEN 2 starts at $995.00 for
    8GB of RAM and 250GB NVMe SSD. You can configure your NX GEN 2 on the official
    Kubuntu site (https://kubuntu.me/nextgen).


    ## US Cybersecurity Strategy Released


    The Biden administration has released a new Cybersecurity Strategy (https://www.whitehouse.gov/wp-content/uploads/2023/03/National-Cybersecurity-Strategy.pdf)
    to ensure full benefits of a safe and secure digital economy for everyone. The
    36-page document outlines the following fundamental shifts in US approach:


    - We must embrace the responsibility to defend cyberspace by shifting the burden
    away from individuals, small businesses, and local governments, to all of us that
    are most capable and best-positioned to reduce the risk of cyber attacks.

    - We must hold adversaries accountable for their actions.

    - We must also have incentives to foster long-term investments by creating a careful
    balance between defending ourselves against urgent threats and strategically planning
    for the future.


    The strategy recognizes the current threat environment and emphasizes the need
    to build collaboration among five pillars:


    - Defend critical infrastructure

    - Disrupt and dismantle threat actors

    - Shape market forces to drive security

    - Invest in a resilient future

    - Forge international partnerships to share goals


    The document notes that "this Administration is committed to improving cybersecurity
    through long-term efforts to achieve zero-trust architecture and modernize IT
    infrastructure."


    ## Zack''s Kernel News


    ## Reader Reactions


    Recently, I covered a discussion in which the kernel developers talked about Spectre
    and Retbleed security issues on 32-bit kernels on 64-bit hardware. The upshot
    was that by large the developers seemed to feel that users shouldn''t do this,
    and therefore there was no need for the developers to worry about that case.


    In response to that column, I received the following letter from Gary Dale which
    articulated a point of view the kernel folks may not have considered. I am including
    the letter here with permission:


    "I believe kernel developers underestimate how many people may be running 32-bit
    kernels and many other Raspberry Pi owners are just doing that for variety of
    reasons. In my particular case, I use my Pi 4 to run Kodi. When accessing Netflix,
    Prime and other streaming services requires the library which seems to exist in
    32-bit version. Unfortunately, 32-bit won''t install under multiplicity. The Raspberry
    Pi OS is noticeably faster than the 32-bit version so I''m stuck with the 32-bit
    version due to restrictions."


    "It can be argued that this is an artifact of the new Raspberry Pi OS and the
    ARM architecture. It is just one case where it is easy to run an OS that doesn''t
    match the hardware. Kernel developers should probably be dismissive of the potential
    problems."


    I was really glad to get Gary''s letter. If other readers shared thoughtful reactions
    like this one, "Reader Reactions" will become a regular part of this column. Reader
    reactions can always be sent to edit@linux-magazine.com. I read them all.


    ## Tracking Up-to-Date Kernel Documentation


    Carlos Bilbao recently took over maintenance of the kernel-docs.rst file in the
    kernel source, as well as the Spanish translation of that file. This file exists
    in the kernel''s larger directory hierarchy, which consists of many files, a variety
    of developer articles such as how to add a package or a new system call.


    The kernel-docs.rst file is a list of kernel documentation matters starting with
    the larger documentation directory that is part of it. It also lists published
    books, online resources from LWT.net, and on the top of the files: "the new that
    this one became again in the kernel mailing list like the same questions, for
    pointers to information, appeared again and"


    Carlos made a patch matching the official maintainer of this, and he also put
    out "I''m interested in adding new, more references to kernel-docs.rst. The document
    has been abandoned for a while but the 64-bit version is still important."


    Jonathan Corbeth, the maintainer of wiki, replied, "I haven''t had time to update
    this document a few years ago and concluded that was much hopeless. Yet there
    is ancient which what do you replace it? There is a vast amount of content there
    that will go obsolete just as quickly."


    But having that, Jonathan added, "I''m certainly not going to stand in the..."


    ## Chronicle

    Zack Brown reports on the latest news, views, dilemmas, and developments within
    the Linux kernel community.


    By Zack Brown


    Author

    The Linux kernel mailing list contains the core of development activities. Traffic
    volumes are immense, often reaching 10000 messages in a week, and with keeping
    to keep up with the entire scope of development is virtually impossible task for
    one person. One of the few souls to take on this task is Zack Brown.

