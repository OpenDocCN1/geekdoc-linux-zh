    # 创客空间 (MakerSpace)


    使用 Pi Zero 照外相机观察野生动物


    ## 花园游猎


    在毫无防备的情况下，你可以发现是谁在晚上造访了你的花园。*作者：Swen Hofpe*


    你可能怀疑野外动物在晚上会在你的花园里“开派对”。如果你想加入其中，我可以向你展示如何设置一个基于树莓派的野生动物监控系统，并且可以根据你的需求进行完全定制。


    Pi Zero 的主机将设置为 `phototrap`，这概括了它的任务。下一步是在你的主目录中为项目创建一个独立的文件夹。


    ## 功能


    对于想要专业系统和爱好者的小型外壳的人来说，照片并不是无用之物。我想要一个同样紧凑（图 1），但具有更创新性工作原理的设备。树莓派通过连接的摄像头捕捉照片。然而，它只有在被动红外（PIR）传感器检测到运动时（检测生物体的热辐射）才会开始工作。否则，电子设备将处于低功耗状态，这样照外相机就可以在野外停留数周。


    当相机被 PIR 传感器触发时，图像将写入树莓派的 SD 卡，文件名中带有时间戳。要检查是否有新图像，你可以在现场读取内存卡，或者将设备登录到家庭网络，通过
    WiFi 检查你发现了什么……


    对于相机型号，我决定采用带有过滤机制和光敏电阻的型号，它对亮度有响应且没有红外锁定，因为传统的树莓派 NoIR 摄像头在白天拍摄的照片看起来不会过曝，但颜色会稍有偏差。归根结底，这并没有区别，与当前的树莓派摄像头或高质量版本相比，分辨率略低也没有关系。关键在于探测和摄像头。较大的镜头也很好地适应了机壳并可以调节固定长度。


    树莓派 Zero 的功耗非常非常小，因此所有东西都可以放进一个紧凑的 microSD 卡中。我们将使其运行起来，需要下载新的 Pi OS 镜像并将其传输到
    microSD 卡。连接板后，通过配置启动选项和网络设置开始。


    你希望通过带有 SSH 的命令行界面（CLI）选择自动模式，然后在电脑的终端窗口中配置所有剩余设置。


    尽管有强大的电池和可选的太阳能电池板，但为了在野外尽可能保持功能，让树莓派持续运行并不是一个好主意。相反，你希望通过由 PIR 传感器触发的小型电子系统唤醒它，并在任务完成后将其关闭（图
    2）。


    通过电源进行切换，以便在不完全关闭电源的情况下长时间运行。此后，照外相机的节约监控将保持激活，直到下一次运动检测事件，构建该设备的脚本、接线图和其他有用信息可以从
    GitHub 项目 [1] 获得，英文版本的图纸可以从 Linux Magazine 网站 [2] 下载。


    ## 结构


    所有硬件组件都平滑地集成到一个带有橡胶密封圈的现成外壳中。相机有一个用于透镜、光电晶体管和运动探测器罩体的孔。盖子背面有一个实时时钟（RTC），侧面有一个用于
    OLED 显示的开口。我将电池位于左侧，Pi Zero 充电板和其他电子设备夹在右侧（3）。“零件列表”总结了所有组件。


    图 2：框图显示了如何开启和关闭 Pi Zero。


    在机壳受保护完当的底部，照外相机有用于外部充电的 SV 电源接口、红外光源以及连接到太阳能电池板的插头连接，太阳能电池板位于外壳的最顶部，充当防雨的小雨。


    所需的软件包含在 Python `fetootfa1e.py` 脚本中，它在相机启动后运行，然后控制电子设备通过查询树莓派串口来检测深度睡眠状态并……


    ## 零件列表


    - 树莓派 Zero W (1 或 2)

    - PIR 传感器

    - RTC 模块

    - OLED 显示器

    - 继电器模块

    - 电池

    - 过压保护

    - 充电电路

    - 电路板、各种电阻

    - 电容器、二极管、晶体管

    - 外壳、布线

    - 太阳能电池板（可选）

    - 红外射灯（可选）


    图 3：所有组件都可以轻松安装到小型外壳中。


