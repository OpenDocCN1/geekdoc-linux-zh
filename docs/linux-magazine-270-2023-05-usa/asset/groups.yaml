    ## Distro Walk – coreboot


    # Booting up the coreboot firmware alternative


    ## Core Strength


    Coreboot is an open source firmware alternative with an emphasis on speed and
    simplicity.


    By Bruce Bfield


    In the next few years, how you boot a computer could change drastically. A firmware
    alternative like coreboot [1] is well known and likely to become more popular
    as development accelerates, and it is now widely available. For one, coreboot
    is a major step forward for hardware. However, on hardware, coreboot boots four
    times faster than the familiar BIOS or UEFI, and depending on how it is configured,
    it even boots faster. The size of a BIOS once averaged over 100KB but the average
    size is now closer to 8MB, and it almost certainly contains obsolete and redundant
    code, which seriously slows boot time. By contrast, coreboot can frequently boot
    desktops and laptops at the start of a boot in seconds, whereas it takes minutes.
    "Not only that, but coreboot is designed to meet modern security standards, and
    being smaller than a conventional BIOS, provides a smaller attack surface. Yet
    another advantage is, that the architecture of coreboot is designed to have an
