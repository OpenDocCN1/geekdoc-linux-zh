    # MakerSpace


    Text-based menus and information pages


    # Whip It Up


    Whiptail interfaces add menus and information pages to your Raspberry Pi projects.
    By Pete Metcalfe


    Text interfaces can be extremely useful for Windows or secure shell (SSH) clients
    used to connect to Linux or Raspberry Pi systems. One of the simplest options
    for creating text interfaces is Whitail [1], which comes preinstalled on Raspberry
    and many Linux systems. The Raspberry Pi configuration tool, raspi-config, is
    a great illustration of how to use Whitail.


    Debian/Ubuntu machines with the command:


    ```

    sudo apt install whiptail

    ```


    A simple Whitail test shows the date/time in a message box:


    ```

    whiptail --title "Date"

    --messagebox "$(date)" 0 0

    ```


    In this article, Introduce Whitail with three small projects. The first creates
    a menu interface for common Linux diagnostics Raspberry Pi output pins, and the
    final uses Python to display Pi sensor data.


