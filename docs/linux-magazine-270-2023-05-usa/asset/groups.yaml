    # AKADEMY 峰会

    2023


    Akademy 是面向 KDE 社区成员、开发者、翻译者、设计师和朋友的年度世界峰会。欢迎加入我们！


    Akademy 2023 将在希腊塞洛洛尼和线上以混合形式举行。


    7月15日 - 21日


    ![](img/89cd889ee36b4c92cc520e4f74809806_14_0.png)


    # 封面故事


    绿色编码倡议


    ![](img/89cd889ee36b4c92cc520e4f74809806_15_0.png)


    # 节能软件仓库

    迈向绿色


    许多开源项目提供了分析软件能源消耗的工具。作者：Christian Kiibling


    这种趋势正开始变得显性：软件很少会浪费大量的能量。几个开源项目正在开发工具，用于研究和测量具体切消耗了多少能量。本文介绍了一些最具前景的工具。


    绿色软件基金会（GSF）由 Linux 基金会于 2022 年发起，其使命是“构建一个包含人员、标准、工具和最佳实践的系统，以创建绿色软件”。GSF 包括微软、英特尔和埃森等公司，由若干小组组成。在
    https://github.com/GreenSoftware-Foundation/ 已经提供了许多软件、工具和文档仓库。


    例如，开源工作组（openource-working）维护了一个名为 AWS Cost Green [2] 的仓库，其中包含指向其他节约工具和研究文章的链接，以及免费软件的链接。在此基础上，你还会找到气候组织的概述，以及如何使用（化石或可再生）绿色能源的应用需求。


    GSF 还强调了针对云端和机器学习的软件。例如，有一个指向 Green Cost Explorer [3] 的链接，这是一个 JavaScript 工具，它考虑了其运行的
    AWS 区域的能源类型。它能估算出使用了多少（化石或可再生）绿色能源应用。


    任何想要让自己的 IT 景观更加绿色的人，都可以在绿色软件模式（Green Software Patterns）中找到他们需要的内容。GSF Patterns
    项目收集了不同 IT 领域（AI、云、Web）的技巧和最佳实践 [10]。该规范提供了非常清晰的提示（或尽可能的图形化方式），来推荐行动建议（例如，压缩传输的数据）。


    该规范还附带了关注二氧化碳排放的 SCI 指标。值越低，软件对气候的损害就越小。SCI 分数衡量每单位 R 的二氧化碳排放量，其中单位可以是一个 API 调用、一个额外的用户或一次
    ML 训练。如果软件遵循针对 O（运行排放）和 M（隐含排放）的 SCI 关注，那么 O 就是软件及其底层硬件所需的能量。它表明，开发者可以将其集成到自己的应用程序中，以智能的方式利用波动的能源价格。Carbon
    Aware SDK 可以使用命令行或 Web API，结合非关键的机器学习工具。该 SDK 帮助将工作负载迁移到目前可再生能源廉价的其它区域；Alternative
    则帮助根据能源作为函数来限制操作。其背后的人们需要在数字完美的百分比范围内恢复二氧化碳的减量：


    | CPU 负载百分比 |

    | --- |

    | 80.00 |

    | 60.00 |

    | 40.00 |

    | 20.00 |


    # 绿色模式


    # 导览


    Kepler（Kubernetes 功率级执行器）依赖 ebb 从 Kubernetes 中提取功率统计。Experiment Impact Tracker
    [5] 和 Carbon-Tracker [6] 测量机器和深度学习预期的能量开销。该 GitHub 仓库还包含操作系统工具。例如，Linux 入目将带你进入
    PowerAPI [7] 和 PowerTOP [8]。


    例如，绿色柏林是一个总部位于德国的组织，他们认为如果数字化是可持续的，将对社会产生积极影响。绿色编码旨在开发开源测量工具来确定可持续基础设施的需求，并在绿色软件周围建立一个社区和生态系统。


    为此，绿色编码与可持续数字联盟（SIA 131）合作，这是一个由几家公司组成的联盟，拥有可持续数字基础设施的路线图。


    绿色使用 Green Metrics Tool [14]，这是一个基于容器的实用，目前用于实验和测试。绿色指标可以帮助你测量每个容器的空间、CPU 利用率百分比或全系统的功耗。Python
    API 填充指标，JavaScript Web 前端渲染结果（如图所示）：


    图 1：Green Metrics 对容器进行测量并将结果视觉化。


    绿色编码与 KDE Eco [15] 合作，后者是一个旨在为自由开源软件带来更多可持续性的创始倡议。初始目标是衡量自由开源软件的需求，以便帮助开发者之后优化软件。KDE
    项目提供了两个核心仓库 [16]：


    - 化石能源效率项目（FEEP [17]）根据“蓝天使”（Blue Angel）方法论创立。蓝天使是一个德国标准，通过分配标签来指定环保产品。FEEP 网站提供了一套测量方案。


    # 绿色倡议


    GSF 的工具人人可用，但基金会本身总部位于美国，主要由当地公司资助和维护。然而，欧洲也正在进行类似的努力。


