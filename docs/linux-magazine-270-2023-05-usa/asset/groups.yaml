    # Bookmark organization with floccus and LinkAce


    # Saved and Sorted


    LinkAce and floccus synchronize and manage bookmarks while storing your data locally.
    BY FERDINAND THOMMES


    Anyone who spends a lot of time on the web will repeatedly come across content
    that they want to save for future evaluation at a later stage. Traditionally,
    you would use your browser''s bookmark function to continue reading a web page
    you discover on your way home from work on your computer at home, and you use
    the browser''s bookmarks, this requires synchronization between devices.


    All browsers offer synchronization for this. As an example, consider Firefox Sync
    [1]. The drawback of these services is that data such as bookmarks, opens, tabs,
    and more are stored on the provider''s servers. Without wanting to imply anything,
    much better can you do than this if you prefer user behavior?


    This is remedied by applications such as the floccus [2] URL manager. LinkAce
    focuses on the secure synchronization of bookmarks between different mobile and
    stationary platforms and different browsers using a private cloud instance over
    WebDAV, Nextcloud, or Google Drive. LinkAce''s focus is more on archiving bookmarks
    and improving how they are organized on your own hardware.


    # floccus


    Imagine you want to sync the bookmarks stored in Firefox between your devices,
    using the Firefox account or other external services, by integrating your Nextcloud.
    This requires some preliminary work.


    In Nextcloud, you need to install and activate an app named Book, version 0.14
    or newer (1) via the app manager or the Nextcloud app [4]. And you need to set
    up the floccus sync extension in your browser of choice. The extension is also
    available for Android via F-Droid or the Google Play Store.


    # Backup


    Before starting to synchronize, it is a good idea to back up your bookmarks. This
    can be done in Firefox via Settings | Manage bookmarks | Import and Export. When
    you get here,


    ![](img/89cd889ee36b4c92cc520e4f74809806_72_0.png)


    Figure 1: The Bookmarks app is available for installation in the Nextcloud, as
    well as in the Nextcloud app store, as a prerequisite for running floccus.


    # LINUX VOICE LINKACE/FLOCCUS


    ![](img/89cd889ee36b4c92cc520e4f74809806_73_0.png)


    you can choose to back up as a JSON file or export as HTML. In Chrome, the first
    step is to go to Bookmarks in the settings and then to Export bookmarks via the
    hammer menu in the upper right. Exporting as HTML sense because the file can be
    imported directly into Nextcloud via Settings at the bottom left (Figure 2).


    At the same location you will find the Add to Nextcloud, which you can grab with
