    # COVER STORY


    Green Coding Initiatives


    ![](img/89cd889ee36b4c92cc520e4f74809806_15_0.png)


    # Repositories for energy-saving software

    Going Green


    A number of open source projects offers tools for analyzing energy usage in software.
    By Christian Kiibling


    It is starting to get out: Software rarely wastes a huge amount of energy. Several
    open source projects are developing tools for studying and measuring exactly how
    much. This article tours some of the most promising tools.


    The Green Software Foundation (GSF), which the Linux Foundation launched in 2022,
    has stated its mission to "Build a system of people, standards, tools, and best
    practices for creating green software." The GSF, includes companies such as Microsoft,
    Intel, and the Accenture, is organized into groups. There are already repositories
    with software, tools, and documents available at https://github.com/GreenSoftware-Foundation/.


    For example, Open Source Working Group (openource-working) maintains a repository
    called AWS Cost Green [2] with links to other tools and research articles on energy
    conservation, as well as links to free software. On top of this, you will find
    an overview of climate organizations, as well as how to use energy (fossil or
    renewable) Green energy usage application requirements.


    The GSF also highlights software for the cloud and machine learning. For example,
    there is a link to the Green Cost Explorer [3], a JavaScript tool that takes into
    account the energy types of the AWS regions it operates. It estimates how much
    energy is used (fossil or renewable) Green energy usage application.


    Anyone who is looking to make their own IT landscape greener will find what they
    are looking for in the Green Software Patterns. The GSF Patterns project collects
    tips and best practices for different fields of IT (AI, cloud, web) [10]. The
    specification provides very clear tips (or graphically as close to possible) to
    recommend recommendations for action (e.g., compress transferred data).


    The specification also attaches an SCI focus on CO2 emissions. The lower the value,
    the less climate-damaging the software uses. The SCI score measures CO2 emissions
    per unit R, where a unit can be an API call, an additional user, or ML training
    run. If the software follows the SCI focus for O (operational emissions) and M
    (bodied emissions), O is the energy required by the software and, of the underlying
    hardware. It shows that developers can integrate into their own applications to
    take advantage of fluctuating energy prices in an smart way. The Carbon Aware
    SDK, which can use either the command line or web API, with non-critical machine
    learning tools. The SDK helps move workloads to other regions where renewable
    energy is cheap at the moment, Alternative, helps to throttle back actions as
    a function of the energy. The people behind need to recover CO2 reductions in
    the digital-perfect percentage range:


    | CPU Load in % |

    | --- |

    | 80.00 |

    | 60.00 |

    | 40.00 |

    | 20.00 |


    # Green Patterns


    # Taking a Tour


    Kepler (the Kubernetes Power Level Executor, relies on ebb to extract power-statistics
    from Kubernetes. The Experiment Impact Tracker [5] and the Carbon-Tracker [6]
    measures the expected energy overhead for machine and deep learning. The GitHub
    repository has also operating-system tools. For example, the Linux entry takes
    you to to PowerAPI [7] and PowerTOP [8].


    Green Berlin, for example, is a German based organization that believes digitalization
    will have a positive impact on society if it is sustainable. Green Coding is to
    develop open-source measurement tools that determine the requirements of sustainable
    infrastructure, and to create a community and ecosystem around green software.


    To this end, Green Coding cooper with the Sustainable Digital Alliance (SIA 131),
    an alliance of several companies with a roadmap for sustainable digital infrastructure.


    Green uses the Green Metrics Tool [14], a container based utility that is currently
    intended for experimentation and testing. Green metrics can help you measure the
    space per container, the CPU utilization as a percentage, or the system-wide power
    consumption. A Python API fields the metrics, and a JavaScript web front renders
    the results (Figure):


    Figure 1: The Green Metrics takes measurements on containers and visualizes the
    results.


    Green Coding collaborates with KDE Eco [15], a founding initiative that aims to
    bring more sustainability to free open software. The initial aim is to measure
    the requirements of free and open software with a view to help developers optimize
    software later. The KDE project offers two central repositories [16]:


    - The Fossil Energy Efficiency Project (FEEP [17]) is founded by the Blue Angel
    methodology. Blue Angel is a German that assigns a label to designate environmentally
    friendly products. The FEEP website provides a measurement setup.


    # Green Initiatives


    The tools of the GSF are available to everyone, but the foundation itself is based
    in the US and is primarily funded and maintained by based corporations. However,
    similar efforts are taking place in Europe.


