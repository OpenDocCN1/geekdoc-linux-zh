    # 更完善的边界


    亲爱的读者：


    整个高科技领域正在崩溃吗？如果是这样，这并非第一次，但每当它崩溃时，都会以略有不同的方式回归，即使是暂时的坍塌也具有意义。近期科技界传出了更多裁员和连环事故，大多数人并不知晓背后的伦理问题。在激烈的美国国会，双方都在要求限制科技公司的力量。注册，或加入团队注册。这将向何方发展？在下一个周期中，所有的焦点都集中在亚马逊身上。


    美国联邦贸易委员会（FTC）的调查并不等同于美国司法部反垄断部门诉讼，但它可能标志着对于大鱼吃小鱼这一古老传统将采取更加强硬的立场。


    亚马逊的影响力确实令人惊叹。从你在线购买的零售商品到规模巨大的亚马逊云服务（AWS），该公司还拥有许多其他公司和产品，我们知道他们最近收购了米高影业（MGM
    Studios）。他们巨大的规模以及对不同市场的渗透使其难以被监控。通常情况下，企业往往为了利润最大化而推向极限。他们并没有违法，但有时（特别是在缺乏监管的行业中），推向极限与违法之间的界限并不总是明确的。边界在哪里取决于政府，而这需要资源和耐心。这类调查必须跑在企业前面，从长远来看，这对亚马逊和整个行业可能都是好事，因为更清晰的边界将带来更好的行为——以及受到未来调查的更好保护。


    针对亚马逊的调查数量非常惊人。这些包括反垄断、隐私、欺骗性会计以及所谓的“模式”（在用户界面内使用的操纵技巧，旨在诱导用户花钱或在他们想退出时注册）。在其他情况下，调查对象在没有预先罪名的情况下是无辜的；然而，目前的市场现状让政府面临做出成效的压力。


    反垄断问题很多，且可能产生最大的影响。亚马逊因其在在线零售市场的巨大份额一直备受关注。这是什么？一个面向所有人的自由市场，还是亚马逊创造的封闭性市场？答案是两者兼有，如果他们利用权力偏袒自己的产品而非其他产品，可能意味着麻烦。美国联邦贸易委员会（FTC）目前正在审查亚马逊最近收购
    iRobot（一家生产亚马逊品牌吸尘器的公司）的行为。


    隐私调查对亚马逊来说也并不新鲜。据报道，目前的调查包括对 Ring 门铃的研究（它可以告诉你谁在你的门前），以及 Alexa——这个按需播放流行歌曲的小型桌面助手。Alexa
    涉嫌违反了《儿童隐私保护法》。


    ![](img/89cd889ee36b4c92cc520e4f74809806_2.png)


    Joe Cas,

    主编


