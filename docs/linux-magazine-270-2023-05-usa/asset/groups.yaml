    originally released by Nintendo for Nintendo in 1991 and for the Switch console.
    The game was one of the first to create a wonderful story, challenging puzzles,
    and intuitive combat within an immersive environment that has never been covered
    but since. A game however itself is closely guarded by Nintendo, and it also contains
    the incredible dna of Zelda, the nostalgic hopes and dreams of millennials everywhere.
    Why this is so important that the zelda3 project has reverse-engineered the entire


    game into 80 thousand lines of C code, without infringing on any of the original
    game sets. You will need the original to retrieve the assets, and these are needed
