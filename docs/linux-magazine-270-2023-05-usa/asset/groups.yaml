    their own Linux distributions, whereas System''76''s Pop! has been failing for
    some time. TUXEDO OS was installed until September 2022, when TUXEDO customers
    released TUXEDO OS 1 as an ISO image. The version 2 release appeared at this time
    around. We decided to take a look at TUXEDO OS 2 preview.


    TUXEDO OS 2 is based on Ubuntu 22.04, but it comes up as TUXEDO OS 2 when you
    use `lsb_release` -a or display the `/etc/os-release` configuration. Nothing changes
    in the types of Ubuntu-style conventions: For example, there is no root account,
    and you need sudo to gain administrative privileges.


    If you do the 3.6GB installation with TUXEDO OS 2 lets you start the desktop (you
