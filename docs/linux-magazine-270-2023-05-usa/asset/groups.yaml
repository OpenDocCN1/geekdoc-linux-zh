    # INTRODUCTION LINUX VOICE


    Linux users are always looking for ways to make things better: better performance,
    smoother operations, safer surfing. One largely overlooked but most satisfying
    way to make things better is through little tweaks that add personality and elegance
    to the user experience. You don''t have to take what comes up on first boot –
    make it your own! In this month''s Linux Voice, we feature some cool desktop tools
    that might not change your life, but they could add a little lift to your desktop
    experience. We start with a look at pair of handy tools for managing browser bookmarks,
    floccus and LinkAce. Then we take a stroll with FSearch, a fast and handy search
    app. Finally, this months tutorial shows how to search DuckDuckGo from the command
    line with ddgr.


