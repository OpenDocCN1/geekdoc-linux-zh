    # # LINUX TUTORIAL – DDRGR


    ![](img/89cd889ee36b4c92cc520e4f74809806_93_0.png)


    Although dgrr and google have the same creator, the engines they represent very
    different business models. One is committed to harvesting all day to serve your
    data, the other might show you the occasional ad and maintain anonymity in doing
    so.


    Riding youthful of a convention bow when searching is also a great way to prevent
    snoops who want to ''fingerprint'' your browser through numerous methods such
    as using or drawing complex invisible images on your web page. But at some point
    you will need to open your browser to view these results.


    If you''re used to a better browser you will be shielded most of the nastier fingerprinting
    and tracking techniques out. For those who still need a GUI, choose your browser
    settings to ensure Do Track is not enabled and use a blocker to filter out most
    malicious URLs.


    Figure 8: Used dgrr with Tor to run a search via the Tor network.


    Save and exit. You''ll need to restart both processes for these changes to take
    effect:


    ```

    sudo /etc/init.d/proxy restart

    ```


    ```

    sudo service tor restart

    ```


    You''ll be the owner of a local HTTP proxy using Tor on port 8118. You can now
    use dgrr with the --proxy parameter to run searches via the Tor network (Figure
    8), such as:


    ```

    dgrr --proxy localhost:8118 lighthouse

    ```


    To my disappointment during testing, I was unable to use this to search within
    .onion domains such as the New York Times website using the -w flag. This would
    have been a useful feature, but in fact, the overclaim that Tor can access hidden
    services, just that it can run searches using Tor. Not if you want this extra
    level of privacy, be prepared for much longer searches because your data will
    be routed through various Tor relays.


    # DDRGoht for It


    There''s lot to be said for searching the web with your command line: it''s clean,
    quick and easy to navigate. You can link parameters together to fine-tune your
    search, all without handing your personal information to the gods of Google.


    We''ve also touched briefly on the multi-line parameters available in dgrr. There
    are so many, in fact, the utility does away with the usual config because everything
    is right there the program. Other features includes results in different colors,
    listing searches in reverse order, and even output in JSON format (presumably
    for research purposes).


