    ## Conclusions


    Systemd is suitable for many control tasks on Linux systems. You can manage Flatpak
    updates with systemd just half an hour of work. Once the timers and services are
    set, you can leave future Flatpak updates to the computer.


    This article is based on author Jordan Williams. You can copy the code for the
    listings from within the article to save time.


    If needed, you can do this a far more targeted way. To start the update at 6:00pm
    on the first Saturday of month, you would use the following entry: in line 1 of
    Listing 6. For the system-wide setup, use the command in line 2 instead. Finally,
    the call in line 3 tests to reload configuration files and restart all units.
    You can also run any making changes to the files.


    ```ini

    OnCalendar=*-1,17**:18:00:00

    ```


    The call can let you determine the next update will occur (Fig-4). If you get
    the correct output, also also know that the service is set correctly.


    You can read about systemd timers the Arch Linux Wiki if you are nested in a more
    in-depth article.


