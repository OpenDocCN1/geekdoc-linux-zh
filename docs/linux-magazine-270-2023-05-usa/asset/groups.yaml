- md: "\n# MakerSpace\n\nText-based menus and information pages\n\n# Whip It Up\n\n\
    Whiptail interfaces add menus and information pages to your Raspberry Pi projects.\
    \ By Pete Metcalfe\n\nText interfaces can be extremely useful for Windows or secure\
    \ shell (SSH) clients used to connect to Linux or Raspberry Pi systems. One of\
    \ the simplest options for creating text interfaces is Whiptail [1], which comes\
    \ preinstalled on Raspberry and many Linux systems. The Raspberry Pi configuration\
    \ tool, raspi-config, is a great illustration of how to use Whiptail.\n\nDebian/Ubuntu\
    \ machines with the command:\n\n```\nsudo apt install whiptail\n```\n\nA simple\
    \ Whiptail test shows the date/time in a message box:\n\n```\nwhiptail --title\
    \ \"Date\"\n--messagebox \"$(date)\" 0 0\n```\n\nIn this article, Introduce Whiptail\
    \ with three small projects. The first creates a menu interface for common Linux\
    \ diagnostics Raspberry Pi output pins, and the final uses Python to display Pi\
    \ sensor data.\n\nThis statement clears the terminal and shows a default background\
    \ with a message box centered in the window (Figure 2). The last two parameters\
    \ in the statement define the height and width of the dialog. The 0 0 at the end\
    \ of the line autosizes the message box.\n\n# Getting Started\n\nIf your system\
    \ does not have Whiptail, you can install it on Raspberry/\n\nThe Whiptail utility\
    \ provides a variety of controls, such as checklist, gauge,\n\n| Configuration\
    \ | Configure system |\n|---|---|\n| 1 Configuration | Configure display settings\
    \ |\n| 2 Display Options | Configure connections to peripherals |\n| 3 Network\
    \ Options | Configure performance settings |\n| 4 Performance Options | Configure\
    \ language and regional settings |\n| 5 Localization | Configure advanced settings\
    \ |\n| 6 Advanced Options | Use this in the latest version |\n| 9 About raspi-config\
    \ | Information about this configuration tool |\n\nFigure 1: The Raspberry Pi\
    \ configuration tool raspi-config uses Whiptail.\n\nFigure 2: Whiptail message\
    \ box.\n\n# MAKERSPACE Whiptail\n\n# Listing 1: Whiptail Menus\n\n```\n# 01 /bin/bash\n\
    # 02\n# 03 wmmenu.sh - Whiptail Menu with diagnostic tools\n# 04\n# 05\n# 06 true\n\
    # 07 -do\n# 08 selection=\\$(whiptail --title \"Diagnostics\" -nocancel\n  --menu\
    \ \"Select: 0 0 4\n  \"df\" Disk Space\n  \"vmstat\" Memory Stats\n  \"usb\" USB\
    \ Devices\n  \"Exit\" Close and Exit 3>&1&2 > 2&3)\n# 10\n# 11\n# 12 # Do an action\
    \ for the selected menu item\n# 13 case selection in\n# 14 \"df\")\n# 15 whiptail\
    \ --title \"Disk Space\" --msgbox \"$(df -h)\" 0 0\n# 16\n# 17 \"vmstat\")\n#\
    \ 18 whiptail --title \"Memory Stats\" --msgbox \"$(vmstat)\" 0 0\n# 19\n# 20\
    \ \"usb\")\n# 21 whiptail --title \"USB Devices\" --msgbox \"$(usb)\" 0 0\n# 22\n\
    # 23 \"Exit\")\n# 24\n# 25\n# 26 esac\n```\n\nFor applications the Whiptail utility\
    \ requires a set of redirection states, (3 >&1 1 >&2) at the end of the main command.\
    \ These redirections are a Bash trick to swap output (1, for file, and stderr).\
    \ By adding these statements Whiptail has a clean, error free menu for user input\
    \ and menu output. This example only uses an Ok button, the Cancel button is hidden\
    \ by the --nocancel parameter (line 9). In the next example the Cancel button\
    \ will exit the script.\n\n# Raspberry Pi Diagnostic\n\nThe goal of the Raspberry\
    \ Pi project is to create a simple interface that controls general purpose input/output\
    \ (GPIO) pins. For my setup I am using a Raspberry Pi Explorer HAT (attached on\
    \ top of pi) LEDs; other hardware could also be used. The first step for this\
    \ project is to install WiringPi, so that GPIO pins can be accessed and controlled\
    \ from Bash scripts. A Raspberry Pi with:\n\n```\nsudo apt-get install git-core\n\
    git clone https://github.com/pi-pi/WiringPi.git\ncd WiringPi\ngit pull\n./setup-build\n\
    ```\n\ndiagnostic tools, df (disk space usage), vmstat (virtual memory statistics),\
    \ and few menu line exits the script (Figure 3). The --menu option is defined\
    \ to exit with outer menu items (0-9). Each item has a line description and a\
    \ tag that is presented when that line is selected.\n\n# A Menu of Diagnostic\
    \ Tools\n\nThe menu is one of the most useful features in Whiptail. A main script\
    \ can present a top-level menu interface that links to submenus, information pages,\
    \ or applications. The menu format is:\n\n```\n[--menu <text> <height> <width>\n\
    <list>\n  <tag> <item>]\n```\n\nThe <item> text is the test string showing on\
    \ the menu line. The <tag parameter is the variable returned when the menu is\
    \ selected. The menu is typed by number, but you can also use index. In my example,\
    \ I will passing the diagnostic utility name as the tag. Listing 1 is a Whiptail\
    \ script that shows three Linux\n\n| Diagnostics | Memory Stats |\n|---|---|\n\
    | 12196 K total memory | 41364 K used memory |\n| 37269 K active memory | 58563\
    \ K activity |\n| 83121 K free | 39812 K buffer memory |\n| 67952 K cache | 29714\
    \ K swap |\n| 20918 K total swap | 14284 K free swap |\n| 14267 non-user cpu ticks\
    \ | 13653 user cpu ticks |\n| 50293 system cpu ticks |\n\nFigure 3: This Whiptail\
    \ menu shows diagnostic data.\n\nThe wiringpi library includes the GPIO command-line\
    \ utility you can use to read, write, and set the mode of GPIO pins. My hardware\
    \ has four LEDs on pins 0, 2, and 21 that I need to set up:\n\n```\n# Set the\
    \ LED pins as outputs\ngpio mode 7\ngpio mode 0\ngpio mode 2\ngpio mode 21\n```\n\
    \n| GPIO | LED (physical pin) |\n|---|---|\n| 7 | 7 (RED) pin 7 |\n| 0 | 12 (YELLOW)\
    \ pin 11 |\n| 2 | 13 (BLUE) pin 15 |\n| 21 | 4 (GREEN) pin 29 |\n\nOnce the GPIO\
    \ pins are set up, I can check their status manually:\n\n```\n# Toggle the status\
    \ on pin 7\ngpio toggle 7\n```\n\nThe syntax of radiolist is similar to a menu:\n\
    \n```\n-- radiolist <text> <height>\n--width> <height>\n--tag <status>\n```\n\n\
    The only difference is that you can indicate which entry is currently selected\
    \ by setting its status. The default radiolist returns two buttons, OK which returns\
    \ 0 when selected, and Cancel returns 1. The Pi radiolist script shows GPIO pins\
    \ the user can toggle (Figure 4). A while statement loops as long as the OK button\
    \ is selected (9 and 14). The radiolist checks a GPIO pin (line 17) and the <tag>\
    \ parameter displays the LED color and physical pin number.\n\n# Pi Sensor Python\
    \ Example\n\nbut the more accurate DHT22 module could also be used. This has three-pin\
    \ configuration with power, ground, and signal connections. The Python library\
    \ for the DHT11 and DHT22 is installed by:\n\n```\npip install Adafruit_DHT\n\
    ```\n\n# Listing 2: Whiptail Radiolist\n\n```\n# 01 /usr/bin/bash\n# 02\n# 03\
    \ wrdio.sh - toggle GPIO output pin\n# 04\n# 05 OK=\n# 06 # response=\"$status\"\
    \n# 07\n# 08 Cycle OK output, Enter Cancel to exit\n# 09 while [ \"$response\"\
    \ == \"OK\" ]; do\n# 10\n# 11 status=$(whiptail --Toggle GPIO Pin\n# 12 --backtitle\
    \ Raspberry PI'\n# 13 \"GPIO 7 -LED 7 (RED) physical pin 7\"\n# 14 \"GPIO 0 -LED\
    \ 12 (YELLOW) physical pin 11\"\n# 15 \"GPIO 2 -LED 13 (BLUE) physical pin 15\"\
    \n# 16 \"GPIO 21 -LED 4 (GREEN) physical pin 29\" \n# 17 2:1 12 2:3\n# 18\n# 19\
    \ # Get the response from the dialog\n# 20 response=$?\n# 21\n# 22 # Check if\
    \ an item returned a value\n# 23 if [ ${$status} -gt 0 ]; then\n# 24\n# 25 # Toggle\
    \ the status GPIO pin number\n# 26 gpio toggle $status\n# 27\n# 28 fi\n# 29 done\n\
    ```\n\nFor the final project, I want to show Raspberry Pi data in a message box.\
    \ My script uses low-cost DHT11 temperature and humidity sensor (around $3-10).\
    \ A python wrapper library offers all the Bash functionality. This library requires\
    \ that the basic whiptail be installed as a prerequisite. To install the library,\
    \ the example in Listing 3 imports the Adafruit_DHT and Whiptail libraries:\n\n\
    # Listing 3: Python DHT11 Sensor\n\n```\n# 01 /usr/bin/python\n# 02\n# 03 dht11.py\
    \ - DHT11 sensor data in a message box\n# 04\n# 05 import Adafruit_DHT\n# 06 from\
    \ whiptail import Whiptail\n# 07\n# 08 # Get the value for DHT11 on pin 4\n# 09\
    \ humid, temp = Adafruit_DHT.retread(1, 4)\n# 10\n# 11 # Create a message string\
    \ with sensor data\n# 12 msg = \"Temp:${temp}\\nHum:${humid}\"\n# 13\n# 14 # Create\
    \ a Whiptail object with titles and autosize\n# 15 w = Whiptail(title='Temperature\
    \ and Humidity',\n# 16 height = 0, width = 0)\n# 17\n# 18 # Show the data in a\
    \ message box\n# 19 w.msg(msg)\n```\n"
  mdcn: "\n\n# 创空间 (MakerSpace)\n\n基于文本的菜单和信息页面\n\n# 制作 (Whip It Up)\n\nWhiptail 接口为你的树莓派项目添加菜单和信息页面。作者：Pete\
    \ Metcalfe\n\n文本接口对于连接 Linux 或树莓派系统的 Windows 或安全外壳 (SSH) 客户端非常有用。创建文本接口的最简单选项之一是\
    \ Whiptail [1]，它预装在树莓派和许多 Linux 系统中。树莓派配置工具 `raspi-config` 是一个如何使用 Whiptail 的绝佳示例。\n\
    \n具有以下命令的 Debian/Ubuntu 机器：\n\n```\nsudo apt install whiptail\n```\n\n一个简单的 Whiptail\
    \ 测试会在消息框中显示日期/时间：\n\n```\nwhiptail --title \"Date\"\n--messagebox \"$(date)\"\
    \ 0 0\n```\n\n在本文中，将通过三个小项目介绍 Whiptail。第一个项目为常见的 Linux 诊断、树莓派输出引脚创建一个菜单界面，最后一个项目则使用\
    \ Python 显示树莓派传感器数据。\n\n此语句会清除终端并显示一个默认背景，并在窗口中心显示一个消息框（图 2）。语句中的最后两个参数定义了对话框的高度和宽度。行尾的\
    \ `0 0` 会自动调整消息框的大小。\n\n# 快速\n\n如果你的系统没有 Whiptail，你可以在树莓派上安装它。/\n\nWhiptail 工具提供了多种控制功能，例如检查列表、仪表表等，\n\
    \n| 配置 | 配置系统 |\n|---|---|\n| 1 配置 | 配置显示设置 |\n| 2 显示选项 | 配置与外围的连接 |\n| 3 网络选项\
    \ | 配置性能设置 |\n| 4 性能选项 | 配置语言和区域设置 |\n| 5 本地化 | 配置高级设置 |\n| 6 高级选项 | 在最新版本中使用此\
    \ |\n| 9 关于 raspi-config | 关于此配置工具的信息 |\n\n图 1：树莓派配置工具 `raspi-config` 使用 Whiptail。\n\
    \n图 2：Whiptail 消息框。\n\n# 创空间 Whiptail\n\n# 列表 1：Whiptail 菜单\n\n```\n# 01 /bin/bash\n\
    # 02\n# 03 wmmenu.sh - 带有诊断工具的 Whiptail 菜单\n# 04\n# 05\n# 06 true\n# 07 -do\n\
    # 08 selection=\\$(whiptail --title \"Diagnostics\" -nocancel\n  --menu \"Select:\
    \ 0 0 4\n  \"df\" 磁盘空间\n  \"vmstat\" 内存统计\n  \"usb\" USB 设备\n  \"Exit\" 关闭并退出\
    \ 3>&1&2 > 2&3)\n# 10\n# 11\n# 12 # 对所选的菜单项执行操作\n# 13 case selection in\n# 14\
    \ \"df\")\n# 15 whiptail --title \"Disk Space\" --msgbox \"$(df -h)\" 0 0\n# 16\n\
    # 17 \"vmstat\")\n# 18 whiptail --title \"Memory Stats\" --msgbox \"$(vmstat)\"\
    \ 0 0\n# 19\n# 20 \"usb\")\n# 21 whiptail --title \"USB Devices\" --msgbox \"\
    $(usb)\" 0 0\n# 22\n# 23 \"Exit\")\n# 24\n# 25\n# 26 esac\n```\n\n对于应用程序，Whiptail\
    \ 工具在主命令末尾需要一组重定向状态，`(3 >&1 1 >&2)`。这些重定向是一种 Bash 技巧，用于交换输出（1 代表文件输出，stderr 代表标准错误）。通过添加这些语句，Whiptail\
    \ 为用户输入和菜单输出提供了一个整洁、无错的菜单。此示例仅使用 `OK` 按钮，`Cancel` 按钮通过 `--nocancel` 参数隐藏（第 9 行）。在下一个示例中，`Cancel`\
    \ 按钮将退出脚本。\n\n# 树莓派诊断\n\n树莓派项目的目标创建一个控制通用输入/输出 (GPIO) 引脚的简单接口。对于我的设置，我使用一个树莓派\
    \ Explorer HAT（连接在树莓派顶部），LED；也可以使用其他硬件。该项目的第一步是安装 WiringPi，以便能够从 Bash 脚本访问并控制\
    \ GPIO 引脚。带有以下命令的树莓派：\n\n```\nsudo apt-get install git-core\ngit clone https://github.com/pi-pi/WiringPi.git\n\
    cd WiringPi\ngit pull\n./setup-build\n```\n\n诊断工具，`df`（磁盘空间使用），`vmstat`（虚拟内存统计），以及几个菜单项，最后一行会退出脚本（图\
