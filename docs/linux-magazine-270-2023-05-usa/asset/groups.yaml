    # Debian 12 to Ship with KDE Plasma 5.27


    In a break from tradition, Debian is opting to go the newest version of the KDE
    desktop for the testing bench. Debian is known for keeping applications that seem
    to out of date. The reason behind this is that "most of all" is primarily stable,
    and the stability means that each release includes only software that can run
    without problems.


    For those who prefer to use more up-to-date software, you can also install in
    some instances, such as a development environment - that can get a bit tricky.
    So, if you prefer Debian with an up-to-date KDE environment, you''ll be able to
    use it using the Debian testing.


    That version is Debian 12 (Bookworm). And that Bookworm is available in free seats,
    it certain KDE Plasma 5.27 will be up when the release Bookworm is out.


    KDE Plasma 5.27 includes a new window manager, a micro improved which offers tons
    of bugs, and further refinements of the desktop. This also releases with KDE Framework
    5.103 and KDE Gear 22.1.3.


    To find out more about Debian 12 release, read the official release plan (https://wiki.debian.org/PkgQtde/BookwormReleasePlan).
    At the time of, Bookworm is scheduled to hit the hard freeze around March 12.
    The full free release dates have to meet.


    # Planet Computers Launches ARM-Based Desktop PCs


    The XR series will launch with XR1 (4-core CPU, 4GB of RAM, XR2 (8-core CPU, a
    Mali-G610 GPU), from 4GB to RAM, and 32GB of internal storage) and from 32GB to
    256GB of storage.


    Both options offer dual Ethernet and WiFi 6


    Both devices include a color touchscreen that gives you access to different options,
    the time/date, and also, the Power button. You can pre-order the XR series now
    at the Planet Computer site (https://planetcomputer.co.uk/). The XR1 sells for
    $614.00 and the XR2 for $774.00.

