    # 封面故事

    ## 节能软件


    Node.js 运行时。相比之下，TypeScript 版本必须在完成一个计算后执行另一个计算，速度比 JavaScript 和 Go 的实现慢。研究表明，TypeScript
    使用的时间是完全相同的 JavaScript 的数倍。


    使用 workers 执行的并行计算。当你需要等待某个操作完成时，也会发生类似的情况。如果客户端在短时间内频繁调用无响应的服务器，会导致功率消耗。回调或推送消息可以确保更高的效率。计算框架通过其通道和监听器进行通信。Go
    通过网络包中的通道和监听器支持这一点。


    OCIS 由微服务组成，每个微服务执行不同的任务。虽然通信服务在性能以及相应的能量方面占了大部分成本，但如果微服务之间相互发送请求，这种“乒乓球”就会消耗能量。如果所有连接的系统都必须设置新的配置，电费也会增加。处理架构更改所需的节点数量不可避免地跨网络，这些消息需要进行通信和评估。在分布式系统中，可以通过降低通信频率来节省能量。


    如果使用了超出任务所需的神经网络，就会浪费大量的能量。对环境有害的 AI 就像是糟糕的 AI。


    此外，许多依赖 Python 的 AI 编程人员倾向于使用 Python。他们依靠使用 Python 来加速计算。其中一种是使用 Cython，它将 Python
    代码转换为 C 或直接在 C 中实现。如果你开发模型，你需要设计并训练它们，使其尽可能节能。如果你对节能变体使用预编译示例……


    ### 优点与缺点


    此外，编程语言各有其优缺点。某些脚本语言的源代码很短。解释器处理这些指令的速度很快，脚本的运行效率与编译后的版本相当，且更容易维护。


    此外，语言是为特定目的身定制的。例如，Python 主要用于数据分析，但在处理复杂的数值运算时速度较慢。如果你需要数值分析，Go 的函数式编程方法是一个很好的选择。它更适合用
    Go 创建的服务器服务和主程序。该语言具有许多高效的字符串操作，有些操作在 Go 中执行效率极高。


    由于 Go 已经存在多年，用它编写的程序也相当独特。像 C、Python 或 PHP 等成熟的编程语言也是如此。如果过于频繁，低效开发的系统和旧库可以帮助节省能量。OCIS
    的开发者以某些遗留格式开发了他们的扁平存储实现。与众不同，OCIS 不需要昂贵的数据库。


    ### 饥饿的 AI


    训练神经网络能为任务带来更高的准确性，之后工作的时间就越长。但通过计算这所需的功率，在极端情况下，其排放的二氧化碳甚至比它们的使用寿命还要多 [14]。如果你是……


    ### 如果你进行自己的测量……


    归结底，只有你的测量才能帮助发现代码消耗了多少能量。这些测量应该在开发阶段实时进行。例如，你可以使用 IoT 测量能量消耗。


    然而，你需要使用辅助算法来检查能量消耗，Go 程序缺乏这种能力。观察者早在 2019 年开发了一个用于检查能量消耗的分析工具；在他们看来，除了 CPU 之外，其他系统为执行的某些短代码段提供了能量消耗值
    [15]。在……


    ```go

    // Pointers

    // Go 有指针。指针持有值的内存地址

    // 类型 * 是一个指向 int 的指针。它的值为 nil。


    var p *int

    // 运算符操作其指向操作数的指针。


    var i = 42

    // * 运算符表示指针的值。


    fmt.Printf("%d", *p) // 读取指针 p

    // 这被称为“解引用”或“间接”

    与 C 不同，Go 没有指针算术。

    ```


    图 5：指针加速了 Go 中的内存访问和数据传输。借此，你可以快速更改变量的内容而无需复制它。


    在发布之前，还没有开发者可以使用的用于测量能量消耗的库。


    但至少标准库中包含了一些调试函数。例如，`debug` 包包含了你可以用来触发垃圾回收的函数。`ReadStats()` 从 `runtime` 包提供了内存使用信息，你可以用
    `metrics` 包生成输出。


    公司共享少数大文件还是极大量数量的小文件，其结果是有区别的。在测量中，你需要考虑平均值。


