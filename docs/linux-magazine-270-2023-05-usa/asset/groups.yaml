    # WRITE FOR US


    Linux Magazine is looking for authors to write articles on Linux and the tools
    of the Linux environment. We like articles on useful solutions that solve practical
    problems. The topic could be a desktop tool, a command utility, a network monitoring
    application, a homegrown script, or anything with the potential to save a Linux
    user time and time. Our goal is tell our readers stories they haven''t already
    read, especially in interesting fixes, new tools, and applications that readers
    might not know about We also love articles on advanced tools for our readers who
    do know – stories that take a traditional approach and put to work in a novel
    or creative way.


    Topics to include our hearts:


    +   - Security

    - Advanced Linux tuning and configuration

    - Internet of Things

    - Scripting

    - Artificial intelligence

    - Open protocols and open standards


    If you have something that to share, just reach out – we might be interested!

    Please send us articles about products made by a company for free, even if it''s
    an open source tool that is useful for everyone. We use website-style "Top 10
    Items" or articles over superficial treatments that leave the all to the reader.
    We like complete solutions, with lots of details. Go deep, not get.

    We have some couples that could help you with these.

    Please send us your proposals for thoughtful and practical articles:


    +   - Cryptocurrencies

    - System hacks


    Please indicate your length 1-2 pages and send to: edit@linux-magazine.com.

    Please in the subject line that your message is an article proposal.


