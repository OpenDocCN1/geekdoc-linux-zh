    # MADDOG''S DOGHOUSE


    A new effort to recover the history of open source

    is underway. BY JOHN "MADDOG" HALL


    # Historical Record


    Recently, a friend of mine posted about a new initiative to engage "Open Source
    Pioneers" to record their legacy—with digital recordings about open source history.
    It seems like a well-conceived, much-needed effort to capture these stories, (as
    my friend pointed out) many of the people who were in their 30s when the Linux
    kernel was started (1991) are now in their 60s and


    and billions of dollars. Generating and distributing your programs in binary format
    was not without the time, and the software cost so much that on a per-unit basis
    that the software delivered to a user with a developer "attached" to the managers
    they would spend a few days getting their source code compiled and working on
    their computer. Software was protected by "secret" and contract law, but not by


    The creators of this project, called the Free and Open Source Foundation (now
    FOSS), did manage to link to Richard M. Stallman and his efforts to start the
    GNU project and the Free Software, while the whole "Era" was moved back a few
    years to 1983, which happened to be the time I joined Digital Equipment Corporation
    (DEC) to work on their proprietary Unix systems which were based on source and
    proprietary to DEC.


    There were other system vendor groups, such as the Digital Equipment Corporation''s
    user Society (DECUS) and IBM SHARE, who had libraries of software contributed
    by their members and available to other users for the cost of duplicating (to
    paper tape) and distribution. As a student I ordered the copy of the software
    and learned how to program in assembly language rather than C.


    Open source, for me, started in 1986 when I was fourteen years old. My father
    subscribed to a number of magazines named "Popular-Something," "Popular Mechanics,
    and Open Electronics. Each were some of them, with Popular Mechanics and Electronics
    being talk about the technologies of the day and often would include blueprints
    and circuit diagrams for building things described in the articles—something printed
    in parts or on separate pages.


    In 1978, some computers like the Altar and other simple computers (in kit form)
    were made; there were "bulletin boards" sold by users through dial-up demos, and
    as magazines like Kilobaud Microelectronics [5], BYTE [4], and Dr. Dob''s [6]
    provided source code for programs that allowed hobbyists to run on their home
    computers. Operating systems using CP/M enabled, some of these programs were born
    in infancy, but many were made of source code, in BASIC, or other languages.


    As I got older, Electronics were very expensive in those days, and I often had
    to take old records and TVs to get the parts I needed (transistors, capacitors,
    tubes, etc.) to build the thing I wanted to build. A single transistor cost $50,
    and that was like up half my father''s pay at the time.


    This increased when I started taking classes in the class of three years ago.
    I was moved to study electrical engineering when I went to college.


    knowledge of open source started with the GNU project; it is just that it was
    not what we called it "open source."


