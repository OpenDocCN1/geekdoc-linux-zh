    ### Traffic Monitor


    Network traffic remains a closed book for many users. Sniffnet lets less experienced
    users monitor their network traffic with ease. By Erik Bärwald.


    The start-up window opens with filter options (Figure 1). On the right, you can
    specify the desired Internet protocols and transport protocols by enabling the
    appropriate ratios. All available versions are enabled by toggling IPv4 and IPv6,
    as well as TCP and UDP. On the far right, you can select a dozen protocols from
    a drop-down list. Sniffnet also shows controls into the account in the default
    setting.


    > Monitoring network traffic is part of the admin''s daily grind. Most admins
    use Wireshark because of its wealth of functions and its availability in most
    distributions. Professional users primarily need in-depth knowledge to use it.
    Sniffnet provides results in a simple, intuitive, and clear-cut interface.


    If you are using a DEB package manager, you can install the precompiled DEB package
    from the project''s GitHub page instead; this removes the need to install rust
    first. On the left of the start-up window, you will find network interfaces available
    on your system. Sniffnet lists both physical and virtual interfaces. Consequently,
    you may need to select the desired interface. After adjusting basic settings,
    click Start to see the available data and the active monitoring window (Figure
    2). At the top, you will see a constantly updated display showing the number of
    packets passing through the network interface per second.


    Sniffnet is a cross-platform Rust application. For the program to work correctly,
    you will definitely need to resolve some dependencies. When done, call `sudo sniffnet`.


