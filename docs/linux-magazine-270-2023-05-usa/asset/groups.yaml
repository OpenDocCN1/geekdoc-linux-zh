    ## IN-DEPTH ELF File Format


    ### A Deep Dive into the ELF File Format


    ### Elf Quest


    Linux and other Unix-based systems use the ELF file format for executables, object
    code, and shared libraries. Take a peek inside to learn how an ELF file is organized.
    Alan Guy Pilbeam


    An object file is a black box that you can never really see. You can''t just open
    it and read it. We have some understanding of that it contains instructions for
    the computer to do something of a computer, but we''re used to thinking of compiled
    program code as a mystery. If you take a closer look, the structure is not as
    opaque as you might. Like most other Unix-like operating systems, program code
    in the Executable and Linkable Format (ELF) superseded the less-flexible format
    and is now standard in Linux since 1995 and in FreeBSD [1] since 1998. An ELF
    file contains the processor-specific instructions that the CPU actually executes.
    It also contains other information relating to:

    - how and where to load the object into memory

    - dynamic linking

    - any public exported (or imported) by the object

    - debugging


    Much of this functionality is only documented in the source code for kernels and
    toolchains themselves or in obscure parts of the text. Understanding the ELF format
    is essential for writing a compiler, assembler, or linker for the Linux platform.


    The best way to study the structure of an ELF file is to watch one come together.
    In this article, I''ll show you how to construct an ELF file from scratch using
    an x86 macro-assembler. Fasm supports the creation of "flat" binary files, meaning
    that the programmer determines (broadly speaking)


