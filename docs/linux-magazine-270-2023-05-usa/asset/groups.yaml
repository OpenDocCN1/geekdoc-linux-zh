    # 新闻


    技术、趋势和工具的更新


    # 本月新闻


    - Gnome 44 候选版已上线

    - Flathub 投票成为标准 Linux 应用商店

    - Debian 12 将搭载 KDE Plasma 5.27

    - Planet Computers 发布基于 ARM 的 Linux 桌面电脑

    - 更多在线内容

    - Ubuntu 不再附带 Flatpak

    - openSUSE Leap 搭载 Flatpak

    - Linux 内核 6.2 支持新硬件

    - Kubuntu 焦点版发布新的微型桌面

    - 美国国家网络安全战略发布


    ## Gnome 44 候选版已上线


    Gnome 44 迈出了一步。许多 Gnome 粉丝已经测试了 Beta 版本，并发现它是开源环境开发的下一个完美选择。根据写作时（2023 年 3 月 22
    日）的预测功能，这个候选版本正处于完美的时机问炉。


    令人惊讶的是，开发团队在桌面上增加了一些更改。没有新功能，但有更多的 Bug 修复和清理。此外，还直接支持 Wayland 的 `fractional_scale_v1`。这意味着你将能够测试多显示器设置下的分比例缩放。


    你还将在快速菜单中获得选项，例如已连接的蓝牙设备列表。此外，快速设置现在将包含一个截图按钮和后台应用程序。


    扩展功能在 Gnome 43 中被移除，但多亏于社区的需求，它们在 Gnome 44 候选版中回归了。其他亮点包括：设置守护进程在活动 15 分钟后进入睡眠、Gnome
    控制中心的菜单和标题经过了微调、Gnome Boxes 允许在创建虚拟机时无需为 GDM 管理器选择操作系统进行代码清理，以及 Gnome Music 现在在“歌曲”视图下运行时占用更内存。


    在此处阅读更多关于 Gnome 44 候选版的信息：https://discourse.gnome.org/t/44-released/14444


    ## Flathub 投票成为标准 Linux 应用商店


    Linux 拥有许多种管理器和应用商店。有 Apt、DNF、Yum、Zypper、Pacman、Gnome Software、Discover 和 Snap。


    对于现代 Linux 发行版，你也可以将 Snap 和 Flathub 加入其中。这些工具在一段时间内一直努力获得市场关注。然而，在过去的几年里，这些通用包管理器变得越来越流行。


    但在它们中只有一个正在投票成为 Linux 的事实标准应用商店。


    ### Flathub 已获得 10 万美元资金，并目标是再筹集 15 万。目标是为更高的运营成本做准备，并实现全职员工。这发生在 Canonical 宣布之后，Canonical
    宣布所有官方 Ubuntu 衍生版将不再默认附带 Flatpak。


    最近，Robert McQueen（https://ramcq.com/2023/03/07/flathub-in-2023/）不仅指出 Flatpak 的增长有多强劲（每天下载量超过
    70 万次），而且


    # 新闻 # 更多在线内容


    表示他们计划建立一个独立的法律实体来拥有和运营 Flathub（目前 Flathub 由 Freedesome 托管）。


    Mcqueen 在博客中说：“在我看来，Flatpak 解决了阻碍 Linux 在桌面端主流增长和接受的最大技术问题……即开发者难以以易于发现的方式发布他们的工作。Flatpak
    极大地帮助了开发者。”


    对于 Flathub 带来的带来的未来，“Flatpak 的构建将帮助用户。”


    # 《Linux 杂志》


    http://www.linux-magazine.com


    # 管理员 HPC


    http://www.admin-magazine.com/HPC/


    # Waterfall - 环境模块


    - Jeff Layton


    环境模块对于高性能计算是必不可少的，它允许你在不同编译器、库之间切换。


    # 管理员在线


    http://www.admin-magazine.com


    # 加密与解密文件


    - Matthias Weiß


    这些工具是 Go 和 Rust 的实现。


    # Debian 12 将搭载 KDE Plasma 5.27


    打破传统，Debian 选择采用最新的 KDE 桌面版本。Debian 以不包含过时的软件闻名。这背后的原因是“大多数”主要是稳定性，这意味着每次发布只包含运行无问题的软件。


    对于那些倾向于使用更新软件的用户，你也可以在某些情况下进行安装——这可能会有点复杂。因此，如果你喜欢带有最新 KDE 环境的 Debian，你可以通过 Debian
    测试使用。


    该版本是 Debian 12 (Bookworm)。而且当 Bookworm 发布时，可以确定 KDE Plasma 5.27 将是可用。


    KDE Plasma 5.27 包含一个新的窗口管理器、一个改进了许多 Bug 的微框架，以及对桌面的进一步优化。它还将配合 KDE Framework 5.103
    和 KDE Gear 22.1.3 发布。


    要了解更多关于 Debian 12 发布的信息，请阅读官方发布计划（https://wiki.debian.org/PkgQtde/BookwormReleasePlan）。目前，Bookworm
    预计在 3 月 12 日左右进入硬冻。完整的免费发布日期待定。


    # Planet Computers 发布基于 ARM 的桌面电脑


    XR 系列将推出 XR1（4 核 CPU、4GB 内存）XR2（8 核 CPU、Mali-G610 GPU，从 4GB 内存到 32GB 到 256GB 内部存储）。这两种选择都提供双以太网接口和
    WiFi 6


    两款设备都包含彩色触摸屏，你可以访问不同的选项、时间/日期，以及电源按钮。你现在可以在 Planet Computer 网站预订 XR 系列（https://planetcomputer.co.uk/）。XR1
    售价 614.00 美元，XR2 售价 774.00 美元。


