    # Reader Reactions


    Recently, I covered a discussion in which the kernel developers talked about Spectre
    and Retbleed security issues cropping on 32-bit kernels on 64-bit hardware. The
    upshot was that by large the developers seemed to feel that users shouldn''t do
    this, and therefore there was no need for the developers to worry about that specific
    case.


    In response to that column, I received the following letter from Gary Dale, which
    articulated a point of view the kernel folks may not have considered. I am including
    the letter here, with permission. Gary let:


    > I believe kernel developers underestimate how many people may be running 32-bit
    kernels and I lot of other Raspberry Pi owners, are just doing that for a variety
    of reasons.


    > "In my particular case, I use my Pi 4 to run Kodi. When accessing Netflix, Prime
    and other streaming services requires the library which seems to exist in a 32-bit
    version. Unfortunately, 32-bit won''t install under multiplicity. The Raspberry
    Pi OS is noticeably faster than the 32-bit version so I''m stuck with the 32-bit
    version due to restrictions."


    > "It can be argued that this is an artifact of the new Raspberry Pi OS and the
    ARM architecture. It is just one case where it is easy to run an OS that doesn''t
    match the hardware. Kernel developers should probably be dismissive of the potential
    problems."


    I was really glad to get Gary''s letter. If other readers shared thoughtful reactions
    like this one, "Reader Reactions" will become a regular part of


    this column. Reader reactions can always be sent to edit@linux-magazine.com. I
    read them all.


