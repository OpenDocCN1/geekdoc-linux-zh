    install ddgr` 安装。由于它是用 Python 编写的，你也可以使用 `pip3` 安装器。运行 `sudo pip3 install ddgr`。


    如果这些选项可用，或者你非常关注隐私，也可以克隆 Git 仓库并作为独立可执行文件运行：


    ```bash

    git clone https://github.com/jarn/ddgr

    ```


    使用 `cd` 切换到 ddgr 目录并运行 `./ddgr`。你需要 Python 3.7 才能使用它。你可以通过运行 `python3 --version`
    来检查 Python 版本。如果你希望将 DDGR 中的 URL 复制到剪贴板，你需要安装 xclip、xsel 或 clipboard-clipboard。如果你使用的是基于
    Debian 或 Ubuntu 的 Linux，它应该已经安装了 xclip。


    除非你另有说明，否则工具将在你的默认浏览器中提供搜索结果，因此在继续之前，请确保已正确设置了此项。


    ## 起飞


    一旦安装了 ddgr，只需简单运行 `ddgr 关键词` 即可搜索。例如，输入 `ddgr lighth` 查看所有“灯塔”。该工具将列出 DuckDuckGo
    搜索的前 10 条结果。


    系统会提示你先接受使用条款，因为它设计得非常友好。在第一次运行搜索时输入 `yes` 并回车查看所有可用选项。


    如果你想打开某个搜索结果，只需输入索引数字（例如 3）并按回车。这将直接打开页面。


    如果你已经准确找到了你寻找的内容，只需输入索引数字即可查看 x 条搜索结果。使用 `p` 返回结果列表，或使用 `r` 重新搜索。


    你可以使用切换来搜索结果中的 URL。如果你有剪贴板（见上文），还可以用 `Ctrl+C` 复制索引数字（例如 3）。如果你想在不运行另一个程序的情况下再次搜索，只需在多功能框中输入关键词并按回车。如果你在运行另一个搜索时添加
    `d` 标志，ddgr 将保留原始的搜索参数。这对于你想要微调搜索结果非常有帮助。


    ![](img/89cd889ee36b4c92cc520e4f74809806_90_0.png)


    图 2：使用 -n 标志限制搜索结果的数量。输入结果的索引将在浏览器中打开。


    默认情况下，ddgr 将为你显示任何搜索词的前 10 条结果。这可能会产生大量文本并使操作变得困难。经常，你可以使用许多命令行参数来调整你的 DuckDuckGo
    搜索。


    最有用的功能之一是 -n，你可以用它更改显示的搜索结果数量（图 2）。例如，要一次显示三个“灯塔”的搜索结果，使用 `ddgr lighth -n 3`。


    如果你在寻找特定的搜索术语，可以将关键词包含在引号中，就像搜索 Google 等基于浏览器的搜索引擎时一样，例如：


    > ddgr We men hold to be true themselves, all men are equal


    你还可以使用 `filetype` 参数搜索特定类型的文件。例如，在我们寻找《独立宣言》中特定摘的示例中，你也可以使用 ddgr 锁定仅包含该短语的 PDF
    类型（图 3）：


