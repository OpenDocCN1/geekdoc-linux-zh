    Unlike, Fsearch inserts a space in the search term as an AND. For example, if
    you are looking for all occurrences of AUTH in /var/directory, type /var/auth.
    If you match case when query contains at least one upper case (Figure 5) in the
    search tab, will find both “AUTH” and “auth” (Figure 6).


    You can also use the new operators to search by size, modification date, file
    extension, content length, and match type, to find any file larger than 1GB, you
    would type


    ```

    ext:size:>1gb

    ```


    ![](img/89cd889ee36b4c92cc520e4f74809806_81_1.png)


    The program also lets you create queries with the OR and NOT operators. For example,
    to find all JPEG and PNG files modified last month “cat” or “dog” in the name,


    ```

    (cat OR dog) ext:jpg;png date:lastmonth

    ```


    On GitHub, the project extends the syntax and provides a couple of examples [8].


    ## Outlook


    Boxder provides users with a peek at planned extensions and versions which will
    be incorporated into Fsearch on GitHub. In the near future, among others, to introduce
    live updates of the database and use inotify to automatically detect changes to
    directories or files [10]. In addition, it will be possible to filter for certain
    file types during indexing such as size or length. fsearch 1.5 is expected to
    support bookmarks as well as search history, and 0.6 is expected to show thumbnails
    for supported files. An implementation for the command line is on the roadmap.
    That would make it easier to write extensions for KDE, for example.


