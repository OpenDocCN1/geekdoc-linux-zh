    # Thorium Nova


    When you read this that a game is a ''bridge simulator'', you thought it might
    be a recreation of the classic game. It is not, not like Bridge Constructor, where
    you are traversing some kind of chaos or river. This bridge simulator takes its
    inspiration from Star Trek, structural engineering, and the game is in the command
    center of a spaceship. Thorium Nova is a sequel to Thorium, which was an attempt
    at space-base bridge simulator. A true modern classic, there are different stations
    for controlling aspects of the ship, including captain, navigation, tactical planning,
    and communications.


    Each role has its own interface, its skill set, and its set of challenges. Most
    importantly, this is a multiplayer game, with different players taking control
    of different station, and everyone needs to work cooperatively to make the ship
    work.


    The game runs itself and other players control it through the browser. By default,
    it is automatically set when you run up the first game. One of the main aims of
    the game is to be as accessible as possible, and browser-based means almost anyone
    can join. When players join, they can choose their station, or be assigned by
