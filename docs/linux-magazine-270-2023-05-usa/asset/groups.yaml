    ## Gnome 44 Release Candidate Now Available


    Gnome 44 is up the next step. Many Gnome fans have tested the beta version and
    found it to be the next perfect for open source environment development. With
    the projected features, at the time of writing, March 22, 2023, this release candidate
    is coming at the perfect time.


    Surprisingly, the development team has added a few changes to the desktop. No
    new features but more bug fixes and cleans. There is also direct support for Wayland''s
    fractional_scale_v1. What this means is you''ll be able to test fractional scaling
    for multiple monitor setups.


    You''ll also have options in the Quick menu, such as a list of connected Bluetooth
    devices. Also, the Quick settings will now include a Screenshot button and a background
    apps.


    The expanding features were removed in Gnome 43, but thanks to a demanding community,
    they are back for the Gnome 44 release candidate. Other goodies include: the Settings
    Daemon goes to sleep after 15 minutes of inactivity, the Gnome Control Center
    menu and caption have been slightly revamped, and Gnome Boxes allows the creation
    of virtual machines without code cleanup for the GDM manager selecting an operating
    system entry, and Gnome Music now uses less memory when running in the "Songs"
    view.


    Read more about Gnome 44 release candidate here: https://discourse.gnome.org/t/44-released/14444


    ## Flathub Voting to Become the Standard Linux App Store


    Linux has a plethora of managers and app stores. There''s Apt, DNF, Yum, Zypper,
    Pacman, Gnome Software, Discover, and Snap.


    For modern Linux distributions, you can also add Snap and Flathub to the mix.
    Those have, for some time, struggled to gain traction. However, over the past
    couple of years, those universal package managers have gained popularity.


    But only one of them is voting to become the facto standard app store for Linux.


    Flathub secured $100,000 in funding and is aiming for $150,000 more. The goal
    is to prepare for higher operating costs and to reach an all full-time staff.
    This comes on the heel of Canonical''s announcement announcing all official Ubuntu
    spin-offs will no longer ship with Flatpak by default.


    Recently, Robert McQueen (https://ramcq.com/2023/03/07/flathub-in-2023/) to not
    only state how strong the Flatpak is growing (with more than 700,000 downloads
    a day) but


    # NEWS # MORE ONLINE


    state they plan on establishing an independent legal entity to own and operate
    Flathub (which is currently hosted by Freedesome).


    Mcqueen says in blog, "Flatpak is, in my opinion, solved the largest technical
    issue which has held back the mainstream growth and acceptance of Linux on the
    desktop... namely, the difficulty for developers to publish their work in a way
    that makes it easy to discover, download (or sideload), for people in connecting
    environments), and he uses." "Flatpak builds on that to help users discover the
    work of developers and helps that work users in a timely manner."


    As far as what the future holds, the plan is to launch a new Flathub web experience,
    add verification features, that on on itself enables users to only see verified
    or affordable apps, enable direct upload as well as donations payments, and create
    Linux focus groups and an advisory board.


