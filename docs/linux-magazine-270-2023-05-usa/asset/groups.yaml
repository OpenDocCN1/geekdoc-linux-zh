    # ELF File Format


    ## Sections Contents

    This example does not require all the sections described in Table 1, but a brief
    description of .text, .plt, .gdt, and .rel_a sections will give you an indication
    of signed 32-bit value of how the sections are structured.


    > .text section executes the executable code for the program listing (4). The
    code calls puts to print a string to the terminal and returns control to the operating
    system.


    x86-64 instructions often use relative addressing. This means that, for example,
    a CALL is encoded depending on the distance from the call (the destination is
    encoded). This makes it impossible to encode an address or call function whose
    fit in 32 bits. The solution is the Procedure Link Table (plt) and the Global
    Offset Table (got), which are described in the .plt and .gdt sections. The PLT
    contains destinations that are local to the binary, so all of its lists can be
    reached by a 32-bit relative call. It uses a JMP instruction to jump to the real
    function, whose address dynamic linker has placed in the GOT. The PLT and GOT
    also allow the dynamic linker to resolve addresses only when required, speeding
    up the loading process.


    Listing 5 defines some characteristics for the .plt and .gdt sections. We need
    to use a .rel_a section to define a macro for static relocation, using the 24-byte
    structure earlier (listing 6).


    ## Listing 6: Relocations


    ```

    01 macro RELOCATION symbol_name plane

    02 :

    03 ; The address of the qword the linker

    04 ; must fill in:

    05 dq LOAD_BASE + plane + symbol_name@got

    06 ; Symbol index and type, encoded in a

    07 ; single word;

    08 dq (symbol_name# shl 32) or R_X86_64_JMP_SL

    09 ; No address.

    10 dq 0

    11 )

    12 ...

    13 ...

    14 ...

    15

    16 ; some actual relocations

    17 SECTION_REL_PLT:

    18

    19 RELOCATION count,index value

    20 RELOCATION exit,PLANES

    ```


    ## Exported and Imported Symbols

    The executable exports symbols, environment and _start, by link and imports puts
    and exit. In Listing 7, I wrap these declarations in some convenience macros.


    ## Listing 7: Imported and Exported Symbols


    ```

    01 macro EXPORT count,index value 23 db (STR_GLOBAL shl 4) + ((ST_FUNC and Oxf))

    02 24 ; We''re not providing any more

    03 25 information for this symbol as it is

    04 ; The symbol''s visibility and type 26 ; defined in another ELF object.

    05 ; encoded in a byte:\27 db

    06 (STR_GLOBAL shl 4) + ((ST_FUNC and Oxf))

    07 ; The "other" field is used.\28 db

    08 db 29 dq

    09 ; Section where symbol resides.30 dq

    10 index 31 name#index = CSMBOL

    11 ; 32 CSMBOL = CSMBOL + 1

    12 ; Virtual address of symbol.\34 dq

    13 value 35 ...

    14 ; Symbol size.\36 ...

    15 dq 8 37 dq

    16 name#index = CSMBOL 38 SECTION_DYNSYM

    17 ) 39 BEGIN_SYMBOLS

    18 40 NULL_SYMBOL

    19 macro IMPORT_FUNCTION name 41 IMPORT_FUNCTION puts

    20 42 IMPORT_FUNCTION exit

    21 ; 43 EXPORT_OBJECT environ, LINK_BSS, LOAD_BASE + PLANES + SLOT_environ

    22 dd name 44 EXPORT_OBJECT _program, LINK_DATA, LOAD_BASE + PLANES + SLOT__program

    ```


    ELF will often crash read, but usually provides some helpful information before
    crashing. Table 2 shows important switches when using read.


    ## Table 2: readelf Switches


    | Option | Description |

    |---|---|

    | -h | Prints the ELF header. |

    | -s | Prints the program headers and relationships between sections and segments.
    |

    | -S | Prints detailed information about sections. |

    | -r | Prints relocations. |

    | -x | Prints a section''s contents in hexadecimal. |

    | -d | Prints the contents of dynamic section. |


    ## Debugging a Handmade ELF Image

    Writing ELF files is prone to error, and the readelf utility is useful for checking
    the validity of ELF files. A corrupted file can be identified quickly.


    ## Info

    - (1) FreeBSD: https://www.freebsd.org

    - (2) flat assembler: https://www.flatslammer.net

    - (3) Git repository for this article: https://github.com/SamMaria1999/elf

    - (4) GNU Hash ELF Sections: https://blogs.oracle.com/solaris/gnu-hash-elf-sections


    ## Conclusion

    I can now build and run the ELF to confirm that it works (Figure 2). You could
    easily expand the ELF file I''ve just demonstrated with more binary code included
    in its text section. A section is added to add references to any shared headers
    and functions to the relevant sections (containing features, such as thread local
    storage), and accessing the program''s arguments may require use case, which might
    be to combine the +500 lines of assembler code with the output of a compiler for
