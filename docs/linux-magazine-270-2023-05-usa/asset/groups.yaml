    # LINUX 视图 LINKACE/FLINACUS


    新手们大家好。我使用了 Ubuntu 22.04 作为基础。若要在你的机器上设置 Docker 及其相关组件，请按照列表 1 所示进行操作。如果你使用的是不同的
    Ubuntu 版本，请将第 5 行中的 `james` 替换为你正在使用的 Ubuntu 版本。


    你可以在 https://github.com/docker/releases 检查版本 2.13.0（第 12 行）是否为最新版本。第 14 行和第 15
    行的内容可以让你确定当前安装的版本。


    进一步的步骤在 LinkAce 文档（16）中有描述。首先，你需要在 LinkAce 的基础版和高级版之间进行选择。如果你只想在本地使用 LinkAce，那么在容器中交付应用和数据库的基础版就足够了。对于网络访问，你需要在独立的容器中安装
    Web、服务器和数据库。另外，这增强了使用反向代理通过 HTTPS 进行安全保护，以便应用程序可以从外部访问。


    在安装方面，两种变体是相同的，只是你需要下载不同的 Compose 文件。我在这里将使用基础方法。在扩展变体中使用反向代理或负载均衡器的步骤可以在文档（16）中找到。


    首先，将 `linkace-docker-simple.zip` 或 `linkace-docker-advanced.zip` 下载到家目录下之前创建的文件夹中并解压
    zip 包。该文件包含了多种变体的 `docker-compose.yml` 文件以及各种问题，此外还有许可证和 README。扩展变体还包含了 `nginx.conf`
    和 `nginx.conf1` 文件。


    ## 设置密码


    在继续之前，你需要更改 `.env` 文件中的 `POSTGRES_PASSWORD` 和 `REDIS_PASSWORD`。如果你使用的是 MySQL 以外的数据库，请更改名称以匹配。保存后，使用
    `docker-compose up -d` 运行最终设置。之后可能需要几分钟时间，所有调用将按照 compose 文件中的规范运行。完成后，你将看到一个启动
    LinkAce Web 服务器的 URL。


    针对 LinkAce 的一些需要进一步采取的步骤（部分可选）总结在文档的 Setup Tutorial [17] 章节中。我将查看其中最重要的部分。首先，切换到右上角的书签。你可以将刚刚拖入的书签保存到你的书签栏中。就在下方，你将拥有创建
    API 令牌的功能。


