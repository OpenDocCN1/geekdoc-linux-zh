    - 9 notify: https://en.wikipedia.org/wiki/notify


    ## Conclusions


    There are many ways to search the filesystem on Linux depending on your requirements.
    Fsearch offers the most functions that you expect from a comfortable search application.
    After all, it is fast and starts as soon as you enter the term. The results can
    be filtered and sorted in many ways. It is hard to understand why fsearch is not
    part the many distributions, because in my humble opinion, the search engine is
    extremely capable. If you want to report bugs or need support, you can write to
