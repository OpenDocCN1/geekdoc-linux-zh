    # 新闻

    ## Linux 新闻


    ## Ubuntu 不再随发行 Flatpak


    任何关注过 Snap 和 Flatpak 等通用包管理器兴起的人，都完全清楚这两种技术之间的差异，以及为什么一种技术比另一种更具分发版无关性。


    我指的是 Snap，它由 Canonical 公司驱动，而这家公司恰好就是 Ubuntu 的母公司。


    Snap 和 Flatpak 都是安装软件极佳的方法，特别是对于那些没有为 Apt 和 D 等更传统的包管理器提供的应用程序。Snap 和 Flatpak
    让 Spotify、Slack 和 Skype 等工具的安装变得简单得多。


    Snap 预装在 Ubuntu、官方 Ubuntu 变体（spins）以及许多 Ubuntu 发行版中。此外，官方变体也包含了 Flatpak。Apt、Snap
    和 Flatpak 的结合意味着用户有大量的应用程序可以安装。


    - Canonical 已经决定 Ubuntu 变体将不再附带 Flatpak（https://help.ubuntu.com/community/ubuntu-22.04-34061）。你仍然可以通过标准存储库中的命令
    `sudo apt-get install flatpak -y` 在 Ubuntu 及其任何一个变体上安装 Flatpak。

    - 这一变化影响所有 Ubuntu 变体，包括 Kubuntu、Ubuntu Budgie、Ubuntu Kylin、Ubuntu MATE、Ubuntu
    Studio 和 Ubuntu。


    ## openSUSE Leap 15.5 Beta


    你可能对 openSUSE Leap 15 的最终发布版本没有包含太多新功能感到意外。事实上，这个新版本在功能方面非常简洁。正如预期的那样，Leap 15.5
    实际上只是错误修复和已安装应用程序的新版本。


    然而，在新软件包列表中，你会发现一个迁移工具，它让你能够通过图形界面轻松地从一个发布版本迁移到另一个版本。


    该工具已经过精简，只需点击一下即可迁移到下一个版本。因此，如果你正在使用 openSUSE Leap（或 15.5 Alpha），你可以迁移到 15.5，其中
    openSUSE Leap 15.5 的新包包括 Python 3.10、systemd 252、KDE Plasma 5.27.101 以及 Mesa 22.3
    图形驱动。


    openSUSE Leap 诞生于 2018 年，到目前为止表现良好。任何希望获取最新 openSUSE Leap 发布版本的人都应该查看滚动发布周期 Tumbleweed（https://get.opensuse.org/tumbleweed/）。


    然而，对于那些更倾向于传统发布周期的人，Leap 是更好的选择。下载 openSUSE Leap 的 beta 版本（https://get.opensuse.org/leap/15.5/）并阅读关于该发布的博客文章（https://news.opensuse.org/2023/02/21/leap-reaches-beta-phase/）。


    ## Linux 内核 6.2 发布，支持更多硬件


    最新的 Linux 内核已经发布，针对硬件支持、性能和安全性包含了多项改进。


    在最近发给 LKML 邮件列表（https://lkml.org/lkml/2023/2/309）的邮件中，Lin Torvalds 说道：“但目前，请对
    6.2 进行测试。它不是最新的发布，就像 6.1 结束那样，但所有常规发布都需要一些测试时间。”


    尽管 6.2 可能并不“性感”，但它仍然有很多可提供的。首先是改进，包括对 Intel 图形和按需显示（On Demand）的开箱支持。此外，Skylake
    CPU 通过增加针对 Retbleeded CPU 漏洞的修复获得了显著性能提升。


    Linux 6.2 也是 Apple Silicon M1 Pro、Max 和 Ultra 的最新内核主支持。这项特定工作由 Linux 团队提交到了上游。


    每两周在你的收件箱中获取新闻。


    免费订阅 Linux Update

    bit.ly/Linux-Update


    NTFS3 驱动包含了隐藏文件（以便在挂载 Windows 目录时正确隐藏文件）、`nocase`（用于区分大小写的文件和文件夹），这防止了重命名 Windows
    中不允许的文件和文件夹的操作。


    已添加对 Sony Dualshock 4 游戏控制器的支持，改进了对 OneX 游戏主机的支持、对 Habana Gauss2 AI 加速器的支持，以及对
    ASUS 主板的若干项改进。


    要了解 6.2 内核包含哪些内容，请阅读 6.2 合并窗口的第一和第二部分（第一部分：https://lwn.net/Articles/917733/；第二部分：https://lwn.net/Articles/918146/）。


    ## Kubuntu 团队发布新微型桌面


    NX GEN 2 是一款预装了 Ubuntu 22.04 的小型桌面电脑，拥有足够的动力帮助你高效工作和享受娱乐。


    这台微型电脑背后的动力规格不会让你感到惊讶。NX GEN 2 配备第 12 代 Intel i7-12700 CPU，具有 16 核心，以 2.6GHz 睿频加速运行，8GB
    DDR4-3200 RAM，并可以处理高达 2TB 的 NVMe SSD 和 4TB 的 SATA 硬盘。


    其余规格包括 UHD Intel 图形、Wi-Fi 6E AX211、蓝牙 5.3、3 个 USB-B 端口、1 个 USB-A 端口、音频/麦克风组合接口、2
    个 Thunderbolt 端口、1 个 RJ45 接口以及 VESA 显示器支持。


    NX GEN 2 还经过了扩展测试和配置。不过，其显卡适用于大多数使用场景。NX GEN 2 的价格从 $995.00 起（配 8GB 内存和 250GB
    NVMe SSD）。你可以在官方 Kubuntu 网站（https://kubuntu.me/nextgen）上配置你的 NX GEN 2。


    ## 美国网络安全战略发布


    拜登政府发布了新的网络安全战略（https://www.whitehouse.gov/wp-content/uploads/2023/03/National-Cybersecurity-Strategy.pdf），以确保每个人都能从安全可靠的数字经济中获益。这份
    36 页的文件概述了美国方法的以下根本性转变：


    - 我们必须承担防御网络空间的责任，将负担从个人、小企业和地方政府转移到我们所有最有能力、且最适合降低网络攻击风险的人身上。

    - 我们必须让对手对其行为负责。

    - 我们还必须通过激励措施来促进长期投资，在防御紧迫威胁与对未来进行战略性规划之间建立仔细平衡。


    该战略承认了当前的威胁环境，并强调了建立五个支柱协作的必要性：


    - 防御关键基础设施

    - 破坏并瓦解威胁源者

    - 驱动市场力量

    - 投资未来

    - 建立国际合作伙伴关系


    该战略指出：“我们必须建立一个零信任架构来应对日益增长的威胁。”


    ## Zack 内核新闻


    ## 读者反馈


    最近，我报道了关于内核的一场讨论，内核人员讨论了 32-bit 系统的各种问题。反馈很多，针对该专栏，我收到一封来自 Gary 的信，他阐述了一个观点：“我认为内核人员低估了运行
    32-bit 系统的人数。在我特定的情况下，我使用 Pi 4 运行 Kodi。访问 Netflix、Prime 等其他流媒体服务需要该库，遗憾 32-bit
    版本无法满足。”


    “可以认为这是硬件的一种产物。内核人员可能应该关注这些问题。”


    我很高兴收到 Gary 的信。如果其他读者也能分享有见解的内容，“读者反馈”将成为本专栏的固定部分。读者反馈可以发送至 edit@linux-magazine.com。我会都会阅读。


    ## 编年

    Zack 报道 Linux 内核社区的最新新闻、观点、困境和进展。


    Zack Brown


    作者

    Linux内核邮件列表包含了开发活动的核心。流量巨大，每周经常达到 10000 条消息，对于一个人来说，跟上整个开发范围几乎是不可能的任务。承担这项任务的少数灵魂之一就是
    Zack Brown。


