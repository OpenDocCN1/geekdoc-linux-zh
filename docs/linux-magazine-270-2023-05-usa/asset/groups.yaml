    ## 发行版之旅 – coreboot


    # 启动 coreboot 固件替代方案


    ## 核心优势


    coreboot 是一种开源固件替代方案，强调速度和简单。


    作者：Bruce Bfield


    在未来几年里，你启动电脑的方式可能会发生巨大变化。像 coreboot [1] 这样的固件替代方案已经广为人知，随着开发的加速，可能会变得更加流行，而且现在已经广泛可用。首先，对于硬件来说，coreboot
    的启动速度比熟悉的 BIOS 或 UEFI 快四倍，取决于如何配置，它甚至更快。BIOS 的尺寸曾经平均超过 100KB，但现在的平均大小已接近 8MB，而且它几乎肯定包含了过时和冗余的代码，这严重减慢了启动时间。相比之下，coreboot
    经常可以在几秒内启动台式机和笔记本电脑，而后者则需要几分钟。“不仅如此，coreboot 的设计符合现代安全标准，而且由于比传统的 BIOS 更小，它提供了更小的攻击面。另一个优势是，coreboot
    的架构设计成了一个‘无法变砖’的更新过程。更新固件比在你的手机上安装 App 要容易得多。”在每一个方面，coreboot 都是计算机固件概念的彻底变革。


    coreboot 最初类似于 LinuxBIOS，于 1999 年创立于洛斯阿拉莫斯国家实验室（该实验室以研发而闻名）。


    你可以配合负载（payload）中指定的其他操作系统间接使用 coreboot。它还衍生了许多分支发行版，如 Libreboot [2] 和 Librecore
    [3]，它们在嵌入式系统和非 x86 架构上有许多项目。


    ## 作者


    Bruce Bfield 是一位计算机记者和软件编辑，专攻自由和开源软件。除了编写项目，他还教授现场课程和在线课程。事实上，他经常就 Coreboot (https://coreboot.wordpress.com)
    进行演讲。他还是 Printerpieces 的联合创始人，这是一个关于写作和技术艺术的博客地址：https://printerpieces.com/。


    ## Coreboot 如何工作


    开发者们已经意识到一种新固件解决方案的必要性。根据 coreboot 网站，coreboot 的设计旨在提供启动现代操作系统所需的最少指令。最小结构意味着
    coreboot 必须为其支持的每个芯片组进行修改，这虽然带来了进步，但往往会增加效率。coreboot 在 x86 机器上的启动 [5]（如时间轴图1 所示）：


    - bootblock：第一阶段用汇编语言编写，旨在为 coreboot 剩余过程设置环境。任务包括加载，它使用 CPU 缓存内存作为由环境管理的堆和栈空间。在
    x86 系统上，bootblock 还会从 16 位模式切换到 32 位模式。

    - vestage：一个可选阶段，如果通过 coreboot 构建，则会启动信任根。

    - romstage：为下一阶段使用缓存内存（cache DRAM）做准备。

    - postcar：使用缓存即内存（Cache-As-RAM）并加载负载（payload）。

    - ramstage：初始化硬件，包括 PCI、片上、图形设备、信任模块和 CPU。为操作系统准备初始表，并作为代码加载硬件和固件。

    - payloads：在固件存储器中携带一段软件，用于初始化启动操作系统的过程。可以看到两种负载：x86 BIOS 的实现以及 TianoCore（UEFI
    的开源版本）。BIOS 的核心就是 coreboot。对于长期用户来说，可能会发现无法读取启动过程的输出，因为已经被重定向了，而不是到 /var/log/dmesg
    或 stdout。


    图 1 还说明了 EDK II coreboot 平台规范实现的 coreboot 阶段。


    ## System76: 示例实现


    根据维基百科，提供了 coreboot 的设备，包括一些基于 x86 的 Chromebook，以及来自 Laptop Chip、Minifree（原 Gluglug）、PC
    Engines、Pyrys、System76 和 Star Labs 的设备。这些电脑大部分是笔记本，有些是翻新的，但这个列表在过去几年里一直在增长。


    我对 coreboot 的实践经验来自最近从 System76 购买的设备。在过去的几年里，System76 已成为 Linux 电脑的主要制造商。每台电脑都带有一个标准的
    BIOS。然而，他们逐渐切换到了 System76 的 coreboot Darter。截至 2023 年 3 月，官方 coreboot 将引入该公司的台式机、服务器和迷你
    PC。


    在 System76 的 Darter 上，传统的 BIOS（图 2 和 UEFI 实现）之后出现的情况令人震惊。早期版本 Darter 的 BIOS 有
    38 个顶级项目，包括规范以及安全启动、雷电和电源管理的设置。相比之下，图 3 所示的当前 Darter coreboot 启动菜单（通过按键访问）也令人震惊。


    | 阶段 | 说明 | 位置 |

    | :--- | :--- | :--- |

    | bootblock | 第一阶段，设置环境，从 16 位切换到 32 位 | CPU 缓存 |

    | vestage | 可选阶段，启动信任根 | - |

    | romstage | 为下一阶段使用缓存内存 | 缓存 |

    | postcar | 使用缓存即内存加载负载 | RAM |

    | ramstage | 初始化硬件 (PCI、片上、图形、CPU) | 系统内存 |

    | payloads | 初始化操作系统启动 (BIOS 实现或 TianoCore) | 固件存储 |


    图 1 还说明了 EDK II coreboot 平台规范实现的 coreboot 阶段。


    | 阶段 | 阶段 | 阶段 | 阶段 | 阶段 | 阶段 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | bootblock | SEC | vestage | PEI | romstage | PEI |

    | postcar | PEI | ramstage | DXE | payloads | DXE |


    图 2：传统的 BIOS 实现。

    图 3：System76 coreboot 菜单。

    图 4：coreboot 配置选项。


    ## 评论

    发行版之旅 – coreboot


    许多有用信息可以在 System76 Open Control (EC) 中找到，带有如何自定义键盘、风扇和电池的说明。Purism 的 Libra 14
    [6] 广告拥有“更少的二进制块 (less blob)”并强调安全性。但是。


    欢迎来到革命

    coreboot 面临严重的障碍。它通常必须绕过专用代码，这消耗了时间并损害了开源哲学。也许，这种保守主义倾向于既定的 BIOS 和 UEFI 标准，因为它们比熟悉感并不差。预料到或意识到刷机有多困难，这足以让最愤世嫉俗的人信服。期待在的未来能做出更好的
    coreboot。


    可能，coreboot 最大的障碍需要它自己的实现。尽管如此，分离负载的使用带有限制，并带来了另一个优势：在项目本身 [7] 以及像 System76 早期零售商中，都组织良好且清晰。


    coreboot 的天然优势是显而易见的，以至于其未来的主导并非偶然。仅仅看到电脑启动比你快


