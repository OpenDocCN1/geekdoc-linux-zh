    是一种低资源工具，它可以将目录和文件关联到你指定的某个位置，仅在配置文件的这种情况下。对于一个以 Linux 内核为特征的命名空间包来说，breezy 在不使用符号链接（symlinks）的情况下完成了所有这些操作，而符号链接通常用于不同位置之间的硬链接。但符号链接会让你难以理解你的文件在哪里、某些内容是否已备份，以及另一个链接之上堆叠了多少个链式链接。


    breezy 则更好。它通过为你创建的每个配置使用独立的命名空间来实现分区。你可以将一个配置定义为源、目标（mux.conf）以及一个重定向（~/mux.conf）用于简单的文件重定向，或者是目录（这是默认值）。它可以轻松设置使得某个规则只适用于一个位置，因此你可以为不同的位置对同一配置使用一套规则。如果你需要启动或运行所有命令，可以使用
    breezy 后面跟上配置名称。每个命令都会认为它正在从开发者编码在程序中的任何路径访问资源，而你正在秘密地将输入和输出重定向到选择的位置。这是一个清理杂乱配置文件，或堆积着几十个没有经过“近藤万理子式”整理的文件的主目录的绝佳方法。


