    # Garden Safari


    Armed with no sneaking suspicion you can discover who pays a visit to your garden
    at night. *By Swen Hofpe*


    You might have a suspicion that wild animals are partying in your garden at night.
    If you want to come along, I can show you how to set up a wildlife monitoring
    system that is based on a Raspberry Pi and can be completely tailored to your
    needs.


    The Pi Zero will have the hostname phototrap, which sums up to its task. The next
