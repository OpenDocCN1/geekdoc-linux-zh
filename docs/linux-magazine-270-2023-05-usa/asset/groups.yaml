    防火墙的过滤规则非常复杂。作为 iptables 的继任者，nftables 简化了创建和维护防火墙规则的过程。作者：Frank Hofmann


    无论你是正在训练成为一名 IT 专家、管理网络，还是在准备 Linux 认证（LPIC-2）[1]，你都无法避免对网络上的数据包进行过滤。特别是 iptables，它是用于过滤流量的规则。iptables
    和 ipfw 属于 netfilter 项目，常用于管理 Linux、FreeBSD/NetBSD 以及 Ubuntu OpenIPama 上的防火墙规则。


    然而，iptables 特别变得有些不从心，尤其是程序代码变得越来越复杂。项目中的微小变化往往会影响所有规则。iptables、arptables 和 ebtables-all
    都源自同一个代码库，但并不是模块的形式存在。


    它们依赖于代码重复，这导致了四者随着时间的推移而逐渐分离。iptables 是维护得最好的，而 nftables 已被证明是内部实现的，deables 尚未完成。


    这种局面促使 netfilter 在 2009 年开始开发 iptables 的继任者 nftables [4]。nftables 的前三个字母用于替换 ipt。其声明的开发目标包括更高的吞吐量、针对变化的需求具有更强的扩展性，特别是——模块化的结构和更好的易用性。从
    Linux 3.13（2014 年 1 月）开始，nftables 成为 Linux 内核的一部分 [6]，成为经过 netfilter 项目验证的内部组件。


    自 2019 年 7 月初发布 Debian 10 "Buster" 以来，Debian 也使用了 nftables [7]，这反过来影响了 Ubuntu
    和 Linux Mint 等衍生版本，以及 Red Hat Linux (RHEL) 和 CentOS 7 及此后的版本。所有主流发行版现在都包含了 iptables，以便在默认启用
    nftables，但至少可以运行。


    # 删除与创建


    要创建防火墙规则，你需要 iptables (IPv4)、iptables (IPv6) 和 arables（以太网帧）命令行工具。Netfilter 用一个工具
    nft 代替了它们，你可以使用它来设置系统上转发、修改或丢弃数据包的所有规则。


    虽然 iptables 使用各种过滤器以及 INPUT、FORWARD 和 OUTPUT 三个处理链来转发数据包，但你必须为 nftables 定义自己以便其识别。


    该工具依赖于两个库：libnm（一个 Netlink 库）和 libnft（用户态库）[10]。这导致了 Linux 内核代码的减少，且对 nftables
    的微改不会导致重新构建内核。


    我们确保正确的模型已加载到系统内核中，或者通过 `modinfo`（图 1）和 `lsmod`（图 2）命令检查模块。这已得到确认（如图 1 和图 2 所示），你可以开始使用
    nft。


    # 基础配置


    最初，nftables 从一个完全为空的规则集开始；或者作为用户定义的表、链和规则。用户（或管理员）创建表、链以及到 Linux 内核头文件的钩子（hooks），然后在链中填充相应的规则。上述所有步骤都使用
    `nft` 命令完成，你以 root 身份执行。


    ```

    root@debbian:~# modinfo of tables

    filename=/lib/modules/4.9.0-amd64/kernel/net/netfilter/nft_tables.ko

    alias=nftnetlink_family

    author=Patrick Hardy <kaber@trash.net>

    depends=Y

    type=nftlink

    verime=

    root@debbian:~# 4.9.0-amd64 SMP mod unload modifications

    ```


    图 1：`modinfo` 输出提供了有关模块的信息。


    列表 1 展示了如何定义一个阻止（目前）任何数据包通过的防火墙。第 1 行类型：为 filter 创建一个 IP 表。为 filter 添加一个链。第 3
    行添加了一条规则来丢弃（drop）数据包（nft）。


    ```

    frank@debbian:~# With:

    ```


    图 2：你使用 `lsmod` 查看系统内核是否已加载了该模块。


    ```

    root@debbian:~# nft list ruleset

    family ip {

    tables ipv4 {

    chain input ( # handle 1 )

    type filter hook input priority 0; policy accept;

    drop handle 2

    root@debbian:~

    ```


    ```


    ![](img/89cd889ee36b4c92cc520e4f74809806_60_0.png)


    图 3：`nft list ruleset` 命令列出了所有规则。


    # 列表 1：定义防火墙


    01 # nft add table ip

    02 # nft add chain ip input (type filter hook input priority 0);

    03 # nft add rule ip filter input drop

    04 # nft list ruleset -a

    05 # nft delete rule ip input handle 2


    # 列表 2：进入入站数据包


    ### 允许端口 22 的入站数据包。

    ### 使用 iptables:

    # iptables -A INPUT -p tcp --dport 22 -m con --state NEW,ESTABLISHED -j ACCEPT

    # iptables -A OUTPUT -p tcp --sport 22 -m con --state ESTABLISHED -j ACCEPT

    ### 使用 nft:

    # nft add rule ip filter input tcp dport 22 ct established, accept


    # 列表 3：添加两个端口

    # nft add rule ip filter input tcp dport { 22, 80, 443 } ct established, accept


    # 基础操作


    在编写规则时，开发者依赖伯克利数据包过滤器（BPF）和经典的 `tcpdump` 作为指南，因此不需要从头学习一切。此外，nft 还提供了地址族的成员。定义的族类包括
    arp (ip)、bridge (inet)、inet (IPv4 和 IPv6) 和 ip6 (IPv6)，用于让入站数据包到达第 3 层规范。内核使用
    nft 作为翻译器，并保持与 Linux 内核进行微小的虚拟通信。


    # 深度解析


    在适当的情况下，我将根据之前的示例对比 iptables 和 nft 中的拼写和调用。列表 2 展示了如何同时在 iptables 和 nft 中为入站数据包开启
    22 端口。你会注意到 nft 将其简化为具有更简单语法的命令。在初始化防火墙之前，你应该在配置文件 `firewall.config` 的开头添加 `flush
    ruleset`。


    # Info


    - [1] LPIC-2: https://lpi.org/certifications/lpic-2-overview

    - [2] nftables 项目: https://nftables.org

    - [3] 流量规则: https://iptables.org

    - [4] nftables: https://nftables.org

    - [5] iptables 继任者: https://nftables.org

    - [6] nftables: https://nftables.org

    - [7] Debian: https://nftables.org

    - [8] Hello nftables, Goodbye iptables!: https://nftables.org

    - [9] libnft: https://github.com

    - [10] libfilter: https://github.com

    - [11] iptables vs. nft: https://nftables.org

    - [12] BPF: https://en.wikipedia.org/wiki/Packet_Filter)

    - [13] tcpdump: https://tcpdump.org

    - [15] ISO 规范: https://en.wikipedia.org/wiki/OSI_model

    - [16] Mininet: https://mininet.org


    如果你需要从 iptables 转换为 nft 增加 80 和 443 端口，`iptables-translate` 命令可以将 iptables 规则转换为
    nft（列表 5）。


    创建习惯，人类很难改变。


    # 结论


    Nftables 有将多个工具整合到一个伞下，使得网络安全变得更容易。为了彻底测试新的规则集，你可以根据需要使用树莓派，或者使用 VirtualBox 自己创建虚拟测试。


    # 保存与恢复


    请注意列表 3 中的空格必须与所示完全，否则 Bash 会选择并导致相同的问题，这可以通过非常合适的方式来解决。


    类似于 iptables，nftables 配置可以保存到文件中。列表 4 的第 1 行将当前规则集列到 `firewall.config` 文件，第 2
    行恢复配置。


    # 作者


    Frank Hoffmann 活跃于柏林、日内瓦和开普敦，是一名开发者、LPI 认证培训师，他也是 Debian 管理帮助书的作者（http://www.dbm.org/index.html）。


    # 致谢


    作者感谢 Axel Bert 和 Werner Hue 在本文准备期间提供的反馈。


    # 列表 4：保存 nftables 配置


    ```

    # nft list ruleset > firewall.config

    # # nft -f firewall.config

    ```


