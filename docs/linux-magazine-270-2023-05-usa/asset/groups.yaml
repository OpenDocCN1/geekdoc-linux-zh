    ## Fedora 37 Workstation 与 TUXEDO OS 2


    双面 DVD 上的两款精彩发行版！


    ![](img/89cd889ee36b4c92cc520e4f74809806_5_0.png)


    ### Fedora 37 Workstation

    64位


    ### TUXEDO OS 2

    64位


    Fedora 是一个由 Red Hat 维护的社区发行版，以尽早采用新软件组件闻名。Fedora Workstation 版本专注于专业环境下的桌面操作。Fedora
    37 版本包含了 Gnome 43 桌面，该桌面具有重新设计的状态菜单，并对文件（Files）管理器进行了重大升级。最新的 Fedora 还带来了对人类语言支持的更新，以及对计算机语言组件的关键更新，包括
    Python、glibc 和 LLVM。


    TUXEDO OS 是一个基于 Ubuntu 的 Linux 变体，由欧洲硬件供应商 TUXEDO 维护，用于其原生 Linux 笔记本电脑系统。TUXEDO
    在去年 9 月发布了通用 Linux 系统的 ISO 镜像，他们还将 TUXEDO OS 2 推向公众，作为一个轻量且响应迅速的桌面系统。TUXEDO OS
    2 基于 Ubuntu 22.04。选择 TUXEDO OS 的用户喜欢原生应用程序、Flatpak 包管理系统以及对性能的关注。在我们的测试中，TUXEDO
    OS 的启动速度明显快于 Ubuntu 或 Windows（参见本期其他位置的文章）。


