    If you like it, the LinkAce demo without any procedures before installing. There
    are three options to choose from setting up on your own system: The easiest way
    is a prepared Docker Compose file that installs all the required components [13].
    If you want more control over the process, you can use the Docker image from Docker
    Hub [14] as an alternative. As a third option, you can install all components
    manually on your server [15].


