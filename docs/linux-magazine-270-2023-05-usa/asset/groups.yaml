    # 内核新闻


    对于任何想要更新和维护此文档的人，Carlos 试图澄清维护首次编辑时涉及的潜在问题，而 Jonathan 关于文档会多快过时的预言是正确的。而且，确实有必要让文件保持更新，但这种工作对于单一维护者来说是非常困难的。


    他建议了一个他和其他人可以遵循的标准流程。为了测试“过期合并”功能，他建议他进入文件并删除所有超过三年的内容，“除了功能性书籍或我们的存档除外”。


    在更新文件方面，Carlos 认为应该向那些产生并将并将列入文档的人员开放访问权限。他说：“Lorenzo Stoaks 是 Linux 管理子系统的一位作者。Lorenzo
    联系我并说：‘我可以把我的工作添加到这篇文档中，并向 linux-docs 的一些信息订阅者介绍这个新资源。’”


    Essence 也能找到内容创作者并与他联系，从而减轻了文件维护者在持续研究方面的部分负担。他补充道：“当我们开始时，几年后，我们得到了一个同样经过编辑的列表。”


    Jonathan 提出了异议，随后 Carlos 开始编写新的补丁来记录文件内部的变化。


    看到文档工作不断找到新方法来保持相关性是一件好事。维护或内核相关文档的人士将联系 Carlos 并保持 kernel-docs 文件的更新。


    关于未来最佳路径的性讨论。他的公司 hexDEV 已经编写了一个名为 LIN 的内核驱动程序。其主要目的是为主线内核 Linux 适配并讨论 LIN API。但它已经可以作为
    Linux 节点进行生产性使用。他补充道：“我们正在寻找基于 Linux 的 LIN 项目合作伙伴以寻求资金。”


    Oliver Hartkopf 回复说，Linux 开源项目存在，“并且通过试验性适配实现了 LIN 协议（这正是 Linux 内核主要所做的）。”


    Christoph 知道那个项目，并在原始邮件中甚至抄送了该项目的主要开发者之一的 Dave Pisa。他指出：“当出现用于 LIN 的内部内核 API 时，这个（LIN
    的线路驱动接口）就可以调整并最终进入主线。”


    Pavel 本身回复说，他非常乐意获取一些实际硬件；并对他在项目中遇到的某些实现上的困难进行简要的技术说明。


    同时，Ryan Edwards 说：“我花了很多时间来解决 LIN 问题。在 TTL 的情况下，我能实现的最好结果是头部附近的延迟为 40ms，而响应超过了主站的时间。这是在用户态完成的，我假设内核解决方案会更好地满足时间要求，但这仅适用于嵌入
    UART 的设备。”


    Christoph、Pavel 和 Ryan 深入研究了这一棘手问题，并尝试保持对他们都旨在实现的应用程序接口（API）的讨论。Andrew Lynn Cameron
    说：“对于我们的网络方面，我们非常努力让硬件变得完全不特殊。它是透明运行的。一个例子是以太网交换机，Linux 将其连接到普通的 Linux 接口。你可以以正常方式在端口上设置
    IP 地址，也可以以正常方式向 linux 驱动程序添加端口。如果交换机可以在硬件中完成桥接，linux bridge 将卸载到硬件，”


    # 汽车空间中的 Linux


    Christoph Fritz 希望在 Linux 中支持局部连接网络（LIN）。LIN 是一种为汽车制造商安装的标准网络协议，旨在防止不兼容系统的泛滥。


    Christoph 发布了补丁，希望依靠内核开发者来实现：“但对于用户来说，这只是给桥接添加了一个端口，没什么特殊的。”


    Andrew 补充说：“请尽量避免任何硬件上的特殊化。我们不希望软件有特殊之处，也不要为不同的内核提供两个 API。只需使用一个适用于……的通用（Universal）API。”


    讨论在随后很快就结束了，但似乎至少有几位内核开发者关注汽车网络和 Linux 标准。很可能是这些开发者之一识别了如何通过最通用的 API 进入内核的问题。


    思考这些是有趣的。公司是否可以使用 Linux 作为它们的内核操作系统，这样像 Linux 支持这样的功能对于我们的控制车辆就具有相关性，即由用户驾驶自己的汽车并对其进行定制？另一种可能是，Linux
    变得越来越多地成为控制车辆，由用户驾驶自己的汽车并进行定制。许多车主愿意逆向工程他们汽车上的各种特定平台协议。我确信这一切最终会产生一些有趣的结果。


    # 文件系统与加密


    Niels van Dersch 指出，支持加密的文件系统列表（可能对内核控制车辆有用）能够为某些文件系统启用加密，而某些不能。他提出了一个简单的内核配置，允许加密和解密。“他被坑了。”


    因此，Ted 完全不喜欢这个主意。他评论道：“我不确定添加这个选项的动机是什么。” “根据我的记忆，在脚本开发的的早期，我们有一个针对每个文件系统的 CONFIG_FS
    配置，但我们显然将其删除了，只是我们不再使用 CONFIG_FS 来启用 POSIX ACLs 或 ext4，而是为了简化内核配置。”


    Niels Mint 认为内核讨论是他想法的巨大动力。他说：“这只是发送了这封 RFC。我们对 Cefs 的加密感兴趣。我们对作为网络文件系统的 Cefs
    的加密感兴趣，但对于……”


    他指出内核讨论是他想法的巨大动力。他说：“这只是发送了这封 RFC。我们对 Cefs 的加密感兴趣。我们对作为网络文件系统的 Cefs 的加密感兴趣，但对于……”


    Niels Mint 认为内核讨论是他想法的巨大动力。他说：“这只是发送了这封 RFC。我们对 Cefs 的加密感兴趣。我们对作为网络文件系统的 Cefs
    的加密感兴趣，但对于……”


    Niels Mint 认为内核讨论是他想法的巨大动力。他说：“这只是发送了这封 RFC。我们对 Cefs 的加密感兴趣。我们对作为网络文件系统的 Cefs
    的加密感兴趣，但对于……”


    （注：Niels van Dersch 指出，支持加密的文件系统列表（可能对内核控制车辆有用）能够为某些文件系统启用加密，而某些不能。他提出了一个简单的内核配置，允许加密和解密。“他被坑了。”


