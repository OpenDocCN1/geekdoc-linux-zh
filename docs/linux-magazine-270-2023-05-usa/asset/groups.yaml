    # Linux 教程 – DuckDuckGo


    尽管 duckduckgo 和 google 拥有同一个创始人，但它们代表的引擎有着截然不同的业务模式。一个致力于全天候收集数据来服务你，另一个则可能偶尔向你展示广告，并在过程中保持匿名性。


    在搜索时顺应传统的做法也是防止窥探者的好方法，他们企图通过多种方法（如在你的网页上使用或绘制复杂的隐藏图像）对你的浏览器进行“指纹识别”。但在某些时刻，你仍然需要打开浏览器查看这些结果。


    如果你习惯了更好的浏览器，你将被挡掉大部分恶性的指纹识别和跟踪技术。对于仍然需要 GUI 的用户，请选择浏览器设置以确保禁用跟踪，并使用拦截器过滤掉大多数恶意
    URL。


    图 8：使用 duckduckgo 和 Tor 通过 Tor 网络运行搜索。


    保存并退出。你需要重启这两个进程以使更改生效：


    ```

    sudo /etc/init.d/proxy restart

    ```


    ```

    sudo service tor restart

    ```


    你将拥有一个在端口 8118 上运行基于 Tor 的本地 HTTP 代理。你现在可以使用 `--proxy` 参数配合 duckduckgo 通过 Tor
    网络运行搜索（图 8），例如：


    ```

    duckduckgo --proxy localhost:8118 lighthouse

    ```


    令我在测试失望的是，我无法使用 `-w` 标记在 .onion 域名（如纽约时报网站）进行搜索。这本应是一个很有用的功能，但事实上，关于 Tor 可以访问隐藏服务的说法被夸大了，它只是可以使用
    Tor 进行搜索。如果你想要这种更高级别的隐私，请做好面对更长时间搜索的准备，因为你的数据将通过各种 Tor 中继进行路由。


    # 命令行 DuckDuckGo


    使用命令行搜索网页有很多优点：它简洁、快速且易于导航。你可以将参数链接在一起以精调你的搜索，而无需将你的个人信息交给 Google 的神灵。


    我们还简要提到了 duckduckgo 中提供的多行参数。事实上，参数非常多，以至于该工具取消了通常配置，因为一切都在程序中。其他功能包括不同颜色的结果、反序列出搜索，甚至输出
    JSON 格式（可能用于研究目的）。


