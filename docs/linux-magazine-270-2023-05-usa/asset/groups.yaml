    Bash and Python scripts each have the own benefits and rewards, but the end result
    produces the same interface. Figure 5 shows the Raspberry Pi hardware and the
    sensor data in a Whiptail message box interface.


    # Summary


    Whiptail, pioneered on Raspberry, is a simple tool for creating text-based interfaces.
    If you need more functionality, take a look at Dialog [3] which supports all the
    Whiptail features and about the Raspberry presentation boxes. The two features
    I specifically liked about Dialog are custom colors and the ability to refresh
    pages with a time-out parameter.


