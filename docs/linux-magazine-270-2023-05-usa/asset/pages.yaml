    # A simpler packet filter


    # Traffic rules


    Filter rules for firewalls are tricky. As successor to iptables, nftables simplifies
    the process of creating and maintaining firewall rules. By Frank Hofmann


    Whether you are training to become an IT specialist, managing networks, or preparing
    for the Linux certification (LPIC-2) [1], you can''t avoid filtering packets on
    the network. Iptables, in particular, the rules for filtering traffic. iptables
    and ipfw, the netfilter project are commonly used to manage firewall rules on
    Linux, FreeBSD/NetBSD and Ubuntu OpenIPama.


    However, iptables is getting a little lost in particular, the program code becomes
    increasingly complex. Small changes in the project have tended to affect all rules.
    iptables, iptables, and ebtables-all come from the same codebase, but not in the
    form of modules.


    they rely on code duplication, which has resulted in the four drifting apart over
    time. Iptables has been the best maintained, while nftables has been proven in-house
    deables are still unfinished.


    This situation prompted the netfilter to launch the development of an iptables
    successor, nftables [4], as of 2009. The first two letters in nftables are needed
    to replace ipt. The stated development goals include higher throughput, greater
    scalability with a view to changing requirements, and in particular - a modular
    structure better usability. Starting with Linux 3.13 (January 2014), nftables
    is part of the Linux kernel [6], proven in-house components by the netfilter project.


    Since the release of Debian 10 "Buster" in early July 2019, Debian also uses nftables
    [7], which in turn has affected derivatives such as Ubuntu and Linux Mint, as
    well as Red Hat Linux (RHEL) and CentOS 7 and later. All major distributions now
    include iptables for necessarily enable nftables by default, but at least operational.


    # Removals and Creations


    To create firewall rules, you need the iptables (IPv4), iptables (IPv6), and artables
    (Ethernet frames) command-line tools. Netfilter replaces them with one tool nft,
    which you can use to set all the rules for forwarding, modifying, or dropping
    packets on the system.


