  md: '# LINKACE/FLOCCUS LINUX VOICE


    whether it be bidirectional. Floccus is protected with a password, which you set
    at the bottom of the window. Credentials


    LinkAce takes care of the saved URLs. It also performs a periodic Line Check if
    enabled (Figure 8).


    Do the same with other devices by installing floccus and configuring it. The software
    offers a manual [5] and an FAQ [6] for it. If you want to synchronize your add-ons,
    and open tabs with your bookmarks, a self-hosted Firefox sync is the better choice.


    if a link is no longer available or has been moved, you will be notified and can
    prevent it. In detail, saved links can be backed up to the LinkAce Archive Machine
    Function (9). All saved links can be exported as HTML, imported into a browser,
    or kept as a backup. Other supported backup targets include commercial accounts
    [10] and S [11].


    # LinkAce


    The LinkAce application is not synchronizing the existing bookmarks, but has an
    independent collection of bookmarks for later evaluation and archiving. Raspberry
    Pi is all you need for this—one is powerful enough. LinkAce uses PHP and a database
    in the browser. You can choose between MySQL, MariaDB, PostgreSQL or SQLite. The
    easiest way to set up LinkAce is through Docker.


    # Tags


    Tags and lists are used to classify links. Lists serve the purpose of bundling
    multiple links to a specific topic (Figure 10), tags are used for categorization.
    LinkAce also lets you optional guest access; the guest can see all links that
    do not classify as private. Access can be controlled separately for each tag,
    list, and link.


    Another way to share links is through link sharing, which is currently available
    for all different services. With an API key for the LinkAce API, your app can
    also be connected to other tools, which can then access and edit the data in LinkAce.


    # Installation


    If you like it, the LinkAce demo demo without any procedures before installing.
    There are three options to choose from setting up on your own system: The easiest
    way is a prepared Docker Compose file that installs all the required components
    [13]. If you want more control over the process, you can use the Docker image
    from Docker Hub [14] as an alternative. As a third option, you can install all
    components manually on your server [15].


    # Clear Cut


    The app offers three ways to add new URLs. First, the existing bookmarks in the
    browsers can be imported as HTML. You can export URLs directly into the interface
    (Figure 7). There is also a bookmark that you can drag from your browser''s bookmarks
    bar to store the web pages you visit in the database.


