  md: '# # TUTORIAL – DDGR LINUX VOICE


    already: For instance, on Ubuntu systems, it''s just a case of running `apt-get
    install` `ddgr`. There''s also a version in the Snap Store, which you can install
    with `snap install ddgr`. Because it is written in Python, you can also use `pip3`
    installer. Run `sudo pip3 install ddgr`


    If these options are available or you''re privacy conscious, you can also clone
    the Git repository and run it as a standalone executable with:


    ```

    git clone https://github.com/jarn/ddgr

    ```


    Use `cd` to switch to the ddgr directory and run `./ddgr`. You''ll need to have
    Python 3.7 to use it. You can check your version in Python by running `python3
    --version`. If you want to be able to copy URLs from DDGR to the clipboard, you''ll
    need to install either xclip, xsel, or clipboard-clipboard. If you''re using a
    Debian or Ubuntu-based [ [of Linux], it should already have xclip installed.


    The utility will offer search results in your default browser unless you tell
    it otherwise, so make sure you have this set up in correctly before continuing.


    # Taking Flight


    Once ddgr is installed, simply run your search with `ddgr KEYWORD`. For instance,
    type `ddgr lighth` to view all "lighthouses". The utility will list the first
    10 results from DuckDuckGo search.


    You''ll be prompted to accept the terms of de-usage to first as it is actually
    designed very kindly. Type `yes` and enter the first time you run a search to
    see all the available options.


    If you want to open a search result just type the index number (e.g., 3) and hit
    Enter. This will open the page directly.


    If you''ve found exactly what you''re looking for, you only need to enter an index
    number to see the x-number of search results. Use `p` to return to the list of
    results or `r` to search again.


    You can use a toggle to search URLs within results. You can also copy URLs with
    `Ctrl+C` to copy the index number (e.g., 3) if you have a clipboard (see above).
    If you want to search again without running another, just enter the keywords at
    the omnibox and hit Enter. If you add the `d` flag to running another search,
    ddgr will retain the search parameters for the original. This will be very helpful
    if you want to fine-tune your search results.


    ![](img/89cd889ee36b4c92cc520e4f74809806_90_0.png)


    Figure 2: Use the -n flag to limit the number of search results. Enter the index
    for a result to open in your browser.


    On the Wing ddgr will show you the top 10 results for any search term. This can
    produce huge amounts of text and making something difficult. Frequently, you can
    use a number of command-line parameters to tweak your DuckDuckGo searches.


    One of the most useful features is -n, which you can use to change the number
    of search results displayed (Figure 2). For instance, to show three search results
    for "lighthouses" at a time, use `ddgr lighth -n 3`


    If you''re looking for a specific search term, then you can include keywords in
    quotes, just as you would when searching a browser-based search engine like Google,
    for example:


    > ddgr We men hold to be true themselves, all men are equal


    You can also use ddgr to search specific types of files using the filetype parameter.
    For instance, in an example where we look for a specific extract from the Declaration
    of Independence, you could also use ddgr to lock to only types of PDFs containing
    that phrase (Figure 3):


    > ddgr We men hold to be true themselves, all men are equal filetype:pdf


    ![](img/89cd889ee36b4c92cc520e4f74809806_90_1.png)


    Figure 3: The example shows searching for certain types of files like pdfs.


    ![](img/89cd889ee36b4c92cc520e4f74809806_90_2.png)


