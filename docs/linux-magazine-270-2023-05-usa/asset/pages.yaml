    # Flatpak updates with systemd

    AUTOMATIC UPDATE


    You can automate Flatpak updates without a package manager using systemd''s services
    and timers. By Ferdinand Thommes


    Iterative package systems such as Flatpak, Snap, and App are becoming increasingly
    popular. They offer advantages for both developers and users. For example, experimental
    versions can be tested without interfering with the


    distribution''s package management system. You can run several versions of a software
    tool for comparison purposes without interfering with each other. Distribution-agnostic
    Flatp simplify a developer''s job because software only needs to be built in a
    single format.


    Flatpaks also present some disadvantages. In the view of low storage media, it
    is up to whether Flatpak''s greatly increased space requirement poses a disadvantage.
    However, the behavior of Flatpak poses a clear disadvantage.


