    # A Word on Tor


    DuckDuckGo has a good relationship with the Tor Project, given that their search
    engine is used by The Tor Browser. The Project said they DuckDuckGo because DuckDuckGo
    has even its own Tor hidden service, (.onion) address and operates on its own
    Tor exit node [10]\nIn light of this, if you want to run DuckDuckGo searches over
    Tor, by the simplest way is to


    download and use the Tor Browser, which also doesn''t record any activity and
    is optimized for privacy. It also does support searches over Tor with some extra
    help. The utility itself can connect to the Internet via an HTTPS proxy. The command-line
    utility uses a SOCKS proxy, so in order to get the two working, you need to use
    a caching web proxy as Proxify.


    ```

    sudo apt-get install proxy

    ```


    Next, configure Proxify to use Tor by editing /etc/proxy/config:


    ```

    sudo nano /etc/proxy/config

    ```


    Scroll to the end and add


    ```

    forward-socks :localhost:9050

    ```


