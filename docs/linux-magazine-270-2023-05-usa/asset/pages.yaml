  md: '# Program Headers


    Each header describes a segment in the loaded image. Program Headers don''t have
    any raw data associated with them, which the loader uses to allocate memory that
    will be populated with data from or more segments. One can use the loader to map
    the .dynamic section by PH_DYNAMIC in declaring segments, via macro (Listing 2).

    I then declare a program header with a single macro invocation:


    The raw data appears at the end of the ELF file. This raw data consists of executable
    code, program data as global objects, and information. Some ELF files might contain
    debugging data in DWARF format.

    Table 1 shows some common names and their descriptions. Most of these need little
    explanation. Note that the capitalized names in the source code don''t exist in
    the final ELF file; they''re just labels for the benefit of the assembler. Section
    names are common but vary. For information on the .gnuhash section, see "GNU ELF
    Sections" [4]; the accompanying Git repository provides a small utility that generates
    a GNU-hash for any purpose.

    As with program headers, section headers have a common format, so we can declare
    a section header with just one invocation:


    ```

