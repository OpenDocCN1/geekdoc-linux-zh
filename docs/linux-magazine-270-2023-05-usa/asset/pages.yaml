    # US Cybersecurity Strategy Released


    The Biden administration has released a new Cybersecurity Strategy (https://www.whitehouse.gov/wp-content/uploads/2023/03/National-Cybersecurity-Strategy-2023.pdf)
    to ensure full benefits of a safe and secure digital economy for everyone. The
    36-page document outlines the following "fundamental shifts" in the United States
    approach strategy:


    +   - We must embrace the responsibility to defend cyberspace by shifting the
    burden of cybersecurity away individuals, small businesses, and local governments,
    and to all of us that are most capable and best-positioned to reduce the risk
    of cyber attacks.

    - We must hold adversaries accountable for their actions.

    - We must also have incentives to foster long-term investments by creating a careful
    balance between defending ourselves against urgent threats and simultaneously
    strategically planning for and investing in a resilient future

    - The strategy recognizes the current threat environment and emphasizes the need
    to build collaboration among the five pillars:

    - Defend critical infrastructure

    - Disrupt and dismantle threat actors

    - Shape market forces to drive security and resilience

    - Invest in a resilient future

    - Forge international partnerships to share shared goals


    The document notes that "this Administration is committed to improving Federal
    cybersecurity through long-term efforts to achieve a zero-trust architecture (https://www.fossil.org/what-does-zero-trust-mean)
    and modernize IT and OT infrastructure."\nSee the official full summary for a
    checklist (https://www.whitehouse.gov/briefing-room/statements-releases/2023/03/02/fact-sheet-biden-harris-announces-national-cybersecurity-strategy/).'
