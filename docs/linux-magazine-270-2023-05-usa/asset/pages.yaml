    \ Leap 15 doesn't include a lot of new features. In fact, this new release is\
    \ quite brief in the features category. As expected, Leap 15.5 is really just\
    \ bug fixes and new versions of the installed applications.\n\nHowever, tucked\
    \ inside the list of new packages, you will find the migration tool, which makes\
