    logs in. Only the user (or an administrator) is authorized to


    Because Flatpak has no other plans for updates, the responsibility falls on the
    desktop environment. For this, I put a method that lets users automatically update
    the Flatpaks on their systems based on the help of the system and session manager.
    This method not relies


    ### System and User

    Flatpaks can be installed in both the user and the system context. Accordingly,
    you need to create separate services and matching times for both contexts.


    The /etc/systemd/ contains two subdirectories (including /user/ and /system/)
    which contain the service files depending on their purposes (1).


    ```

    # in the folder /etc/systemd/user/

    [Unit]

    Description=Update user Flatpaks

    [Service]

    Type=oneshot

    ExecStart=/usr/bin/flatpak --update -user

    [Install]

    WantedBy=user.target

    ```


    # ### Listing 1: User-Specific Service


    # ### Listing 3: System-Wide Service


    ```

    # update-flatpak-services.service

    # in the folder /etc/systemd/

    [Unit]

    Description=Update system Flatpaks

    [Service]

    After=network-online.target

    ExecStart=/usr/bin/flatpak --update

    [Install]

    WantedBy=multi-user.target

    ```


    # ### Listing 2: Editing the File


    ```

    # sudo nano /etc/systemd/user/update-user-flatpak.service

    ```


    # ### Listing 4: User-Specific Timer


    ```

    # update-flatpak.timer

    # in /etc/systemd/user/

    [Unit]

    Description=Update user Flatpaks daily

    [Timer]

    OnCalendar=daily

    Persistent=true

    [Install]

    WantedBy=multi-user.target

    ```'
