    # Booting up the coreboot firmware alternative


    # # Core Strength


    Coreboot is an open source firmware alternative with an emphasis on speed and
    simplicity.


    By Bruce Bfield


    in the next few years, how you boot a computer could change drastically. A firmware
    alternative like coreboot [1] is well known and likely to become more popular
    as development accelerates, and it is now widely available. For one, coreboot
    is a major step forward for hardware. However, on hardware, coreboot boots four
    times faster than the familiar BIOS or UEFI, and depending on how it is configured,
    it even


    bomb. Today, coreboot major contributors include manufacturers such as AMD and
    Intel, and motherboard vendors such as MSI, and well as various participants in
    the Google Summer of Code. Supported architectures include x86_64, ARM64, RISC-V,
    as well as AMD-V and other software-on-chip platforms. In Linux, coreboot supports
    BSD, OpenBSD, and Windows 2000 and later.


    size of a BIOS once averaged over 100KB but the average size is now closer to
    8MB, and it almost certainly contains obsolete and redundant code, which seriously
    slows boot time. By contrast, coreboot can frequently boot desktops and laptops
    at the start of a boot in seconds. For whereas it takes minutes. "Not only that,
    but coreboot is designed to meet modern security standards, and being smaller
    than a conventional BIOS, provides a smaller attack surface. Yet another advantage
    is, that the architecture of coreboot is designed to have an unbrickable update
    process. Updating firmware is much easier than installing your app on your mobile
    phone". In every way, coreboot is a total overhaul of the concept of computer
    firmware.


    Originally like LinuxBIOS, coreboot was founded in 1999 at Los Alamos National
    Laboratory, the research and development facility it is known for.


    You can use coreboot indirectly with other operating systems specified in the
    payload. It has also spawned a number of spin-off distributions such as the Libreboot
    [2] and Librecore [3], which have many projects on embedded systems and non-x86
    architectures.


