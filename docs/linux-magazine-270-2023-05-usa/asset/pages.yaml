    Older boards are designed for operation with a coin battery manually. If you want
    to use a CR2032 cell you must remove the battery to avoid long-term damage. When
    running on a Raspberry Pi, you can optionally remove the pull up resistors to
    the VCC pin. Check the I2C bus


