    Sniffnet


    Analyze network traffic with Sniffnet


    # # Traffic Monitor


    Network traffic remains a closed book for many users. Sniffnet lets less experienced
    users monitor their network traffic with ease. By Erik Bärwald


    The start-up window opens with filter options (Figure 1). On the right, you can
    specify the desired Internet protocols and transport protocols by enabling the
    appropriate ratios. All available versions are enabled by toggling IPv4 and IPv6,
    as well as TCP and UDP. On the far right, you can select a dozen protocols from
    a drop-down list. Sniffnet also shows controls into the account in the default
    setting.


    > Monitoring network traffic is part of the admin''s daily grind. Most admins
    use the graphical Wireshark tool because of its wealth of functions and its availability
    in most distributions. Professional users primarily need in-depth network knowledge
    to use it. The new Sniffnet project targets experienced users, providing results
    in a simple, intuitive, and clear-cut interface.


    first set to the command line 2 of Listing 1. The installation routine requires
    some interactive interface and prints status messages at the prompt. You install
    Sniffnet itself in the terminal using the rust package manager.


    If you are using a DEB package manager, you can install the precompiled DEB package
    from the project''s GitHub page instead; this removes the need to install rust
    packages first.


    On the left of the start-up window, you will find the network interfaces available
    on your system. Sniffnet lists both the physical and virtual interfaces and physical
    interfaces. Consequently, you may need to select the desired interface if this
    doesn''t meet your need. After adjusting the basic settings, click Start to see
    the available data and the active monitoring window (Figure 2). At the top, you
    will see a constantly updated graphical display showing the number of packets
    passing through the network interface per second.


    # Installation


    Sniffnet is a cross-platform Rust application (1). You don''t have the Rust programming
    language on your system,


    For the program to work correctly, you will definitely need to resolve some dependencies
    (3) line 8, regardless of the installation path. When done, call Sniffnet with
    `sudo sniffnet`


    # Listing 1: Sniffnet install


    ```

    01 ### Rust install

    02 ### curl --proto ''=https'' --tlsv1.2 -sSf https://sh.rustup.rs | sh

    03 ### Set install sniffnet rust

    04 ### cargo install

    05 ### Install Sniffnet as a DEB

    06 ### sudo apt install sniffnet-linux

    07 ### Install dependencies

    08 ### sudo apt install libpcap-dev libconf--config-dev

    ```'
