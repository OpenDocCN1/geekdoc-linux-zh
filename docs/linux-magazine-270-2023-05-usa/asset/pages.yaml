  md: '# EDITORIAL


    Welcome


    # # BETTER BOUNDARIES


    Dear Reader,


    Is the whole high-tech scene imploding? If so, it won''t be the first but every
    time it implodes, it comes back a little different, even temporary implosions
    are relevant. The layoffs, with more pile-ups circulating through the tech world
    announced recently. Most were unaware of the ethics behind. Members of both parties
    in the ferocious US Congress are clamoring to reign in the power of their tech.
    sign up, or sign up team. Where will this lead? For this next cycle, all eyes
    are on Amazon.


    An investigation from the FTC is not exactly a lawsuit from the US Department
    of Justice Antitrust Division, but it could signal a more hawkish stance regarding
    the venerable tradition of big fish swallowing little fish. On the other hand,
    the Antitrust Division seems to be on the trail.


    Amazon''s reach is truly breathtaking. The retail items you buy online, to the
    colossal Amazon Web Services business, the company also owns lots of other companies
    and products we know they recently purchased MGM Studios. Their massive size and
    penetration into many different markets makes it difficult to keep an eye on them.
    Businesses, in general, often push the limits to maximize profit. They don''t
    break the law, but sometimes, especially in industries that are unregulated, pushing
    the limits and breaking the law is not always clear. It is up to the government
    to define where the limits are, and that can take care of itself, resources, and
    patience. These kinds of investigations have to outrun, and in the long run, that
    could be good for Amazon and the industry in general, because clearer boundaries
    will lead to better behavior - and better protection from future investigations.


    The number of investigations into Amazon is really quite extraordinary. They include
    antitrust, privacy, deceptive accounting, and so-called patterns (manipulative
    tricks played within a user interface to make the user spend money, sign up when
    they want to quit). In others cases, the subject is innocent without prior guilt;
    however, the current state of the market is the pressure for the government to
    make something stick.


    The antitrust issues are many, and could have the biggest implications. Amazon
    has been under scrutiny for its massive share of the online retail market. What
    is it? A free market for all, or a captive market created by Amazon? The answer
    is both, which is illegal, if they use their power to favor their own products
    over others, it could mean trouble. The US Federal Trade Commission (FTC) is currently
    reviewing whether Amazon''s recent purchase of iRobot, a company that makes vacuum
    cleaners that sell under Amazon brand, as well as its acquisition of Medical


    Privacy investigations are also nothing new for Amazon. According to reports,
    current investigations include a look at the Ring doorbell, which tells you who
    is at your front door (and also, allegedly, tells Amazon who is at your front).
    And Alexa, that little desktop assistant that favors pop songs on demand? She
    is under scrutiny for violating the Children''s Privacy Protection Act.


