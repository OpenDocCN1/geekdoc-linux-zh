  md: "# NEWS Linux News\n\n# ## Ubuntu No Longer Shipping with Flatpak\n\nAnyone\
    \ who has followed the rise of universal package managers as Snap and Flatpak\
    \ is fully aware of the difference between the two technologies and how one is\
    \ more distribution agnostic than the other.\n\nI'm talking about Snap, which\
    \ is driven by Canonical, the company that happens to be Ubuntu.\n\nBoth Snap\
    \ and Flatpak are great methods for installing software, especially applications\
    \ that do not have ports to the more traditional package managers such as Apt\
    \ and D. Snap and Flatpak make the installation of such tools as Spotify, Slack,\
    \ and Skype considerably easier.\n\nSnap comes pre-installed with Ubuntu, the\
    \ official Ubuntu spins, and many Ubuntu distributions. As well, official spins\
    \ have also included Flatpak. The combination of Apt, Snap and Flatpak meant users\
    \ had plethora of applications to install.\n\n+   * Canonical has made the decision\
    \ that Ubuntu spins are no longer shipped with Flatpak (https://help.ubuntu.com/community/ubuntu-22.04-34061).\
    \ You can still install Flatpak on Ubuntu and any one of its spins from the standard\
    \ repositories with the command `sudo apt-get install flatpak -y`.\n* This change\
    \ affects all Ubuntu spins, including Kubuntu, Ubuntu Budgie, Ubuntu Kylin\n \
    \           \n* This change affects all Ubuntu spins, including Kubuntu, Ubuntu\
    \ Budgie, Ubuntu Kylin, Ubuntu MATE, Ubuntu Studio, and Ubuntu.\n\n# ## openSUSE\
