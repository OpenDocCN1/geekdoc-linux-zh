  \ 菜单\n6. 现在点击 `Positions` 标签：\n   ![](img/image0852.jpeg)\n   注意有几部分数据被高亮显示。此时我们只想关注密码，因此我们需要清除所有选中的点，然后选择我们自己的。\n\
  7. 在右侧菜单上，点击 `clear`，这将擦除所有标记点。\n8. 现在只需高亮密码字段中的值 `admin`：\n   ![](img/image00853.jpeg)\n\
  9. 点击右侧菜单上的 `add`\n   Burp suite 现在将高亮密码字段中的单词 `admin`。现在我们已经设置了想要攻击的字段，我们需要设置负载。\n\
  10. 点击 `payloads` 标签\n11. 从 `Payload Type` 下拉框中选择 `Runtime file`：\n    ![](img/image0854.jpeg)\n\
  12. 选择我们创建的文件 `/desktop/mutillidae.txt`：\n    ![](img/image0855.jpeg)\n13. 现在在最顶部的\
  \ `Intruder` 菜单中，点击 `Start Attack`：\n    ![](img/image0846.jpeg)\n\n   当自动化攻击完成后，你应该看到这样的屏幕：\n\
  \   ![](img/image0857.jpeg)\n\n   起初结果看起来没什么用，但记住这只是将值放入表单并发送到网页。如果成功了，一个响应将与其他不同。如果你仔细看图片，你会发现\
  \ Request 6 的状态为 302，长度为 46225。我想知道哪一个成功了？\n\n### Burp Comparer\n\nBurp 的比较功能允许你快速比较一个请求/响应与另一个之间的结果。这在我们运行自动化攻击并想比较结果以查找差异时非常有用。从上面的自动化字典列表攻击中，我们可以：\n\
  \n1. 右键点击 Request 6 并点击 `Send to Comparer (Response)`：\n   ![](img/image0858.jpeg)\n\
  \n我们需要与它进行比较，所以使用 Request 0，即基准请求。你可能需要最小化 Burp Suite 来找到结果窗口，它有时会隐藏。\n\n2. 右键点击\
  \ Request 0 并点击 `Send to Compare (Response)`：\n   ![](img/image0859.jpeg)\n\n3.\
  \ 现在点击 `Compare` 菜单标签\n\n你将看到发送到比较器的两个响应。在右下角选择按“单词”比较。两个页面响应将并排显示，并带有颜色编码映射显示差异。点击\
  \ `Sync View` 框并向下滚动页面寻找差异。\n\n在基准页面上，我们将看到单词 `Not Logged In`：\n\n\n\n\n\n![](img/image00860.jpeg)\n\
  \n但在我们认为生效的页面侧边，我们应该找到“Logged in Admin”（管理员已登录）和“g0t t00t?”：\n\n![](img/image00861.jpeg)\n\
  \n所以，入侵者使用的密码为“adminpass”的第 6 次请求似乎起作用了！但让我们确认一下，请继续尝试使用用户名 `admin` 和密码 `adminpass`\
  \ 登录 Mutillidae（别忘记关闭拦截代理）：\n\n![](img/image00862.jpeg)\n\n看起来我们找到赢者了！因此，通过使用 `intruder`，我们可以创建自动化攻击，并将这些攻击的输出放入\
  \ `Comparer`（比较器）中，以找出哪种攻击是真正有效的。虽然由于时间限制，这在免费版中并不十分实用，但它展示了完整版中一些更高级的功能。\n\n花几分钟时间查看\
  \ `intruder` 内置的其他攻击方法：\n\n- 撞击器模式 (Battering Ram)\n- 叉子模式 (Pitchfork)\n- 集群弹模式\
  \ (Cluster Bomb)\n\n使用它们的过程与上述类似，但它们提供了使用多个负载（payloads）攻击多个变量的能力。\n\n### 使用 Burp\
  \ 进行 XSS（跨站脚本攻击）\n\nSQL 注入和 XSS 攻击是两种常见的 Web 应用程序攻击类型。在本节之前我们讨论了基础 SQL 注入攻击。让我们花几分钟时间看看使用\
  \ `Burp` 进行 XSS 攻击。SQL 注入漏洞通常涉及 Web 服务器的数据库，而 XSS 则侧重于使用脚本攻击客户端。因此，重点通常在客户端而不是服务器数据库上。XSS\
  \ 攻击主要有两种类型：\n\n- 反射型（或非持久型）\n- 存储型（或持久型）\n\n首先，让我们来看反射反射型 XSS 攻击。反射型 XSS 攻击通常针对用户的浏览器且是临时的。通过电子邮件发送恶意的\
  \ XSS 链接，或使用特殊修改的链接直接攻击服务器。\n\n#### 反射型 XSS\n\n在本节中，我们将通过修改 DVWA URL 以包含 JavaScript\
  \ 来演示这种攻击。第一步是找到受漏洞的页面。\n\n1. 在 Kali 中，访问并登录 `DVWA`。确保安全（security）设置为“low”（低），并点击“XSS\
  \ reflected”标签页。\n2. 注意页面顶部的 URL：\n   `http://192.168.1.68/dvwa/vulnerabilities/xss_r/`\n\
  3. 输入一个名字并提交。我使用的名字是 `Fred`。\n\n友好的网站立即返回并显示“Hello Fred”，真不错。现在，注意 URL 的变化：\n  \
  \ `http://192.168.1.68/dvwa/vulnerabilities/xss_r/?name=Fred#`\n\n让我们比较一下这两个：\n\n\
  ![](img/image00863.jpeg)\n\n唯一的区别是增加了 `?name=Fred#`。这部分显然是用于显示用户名的命令。如果我们在 URL 中插入一个简单的脚本来显示“Hello\
  \ Word!”会怎样？\n\n让我们使用基础代码`<script>alert(\"Hello World!\")</script>`\n\n4. 输入以下 URL：\n\
  \   `192.168.1.68/dvwa/vulnerabilities/xss_r/?name=<script>alert(\"Hello World!\"\
  )</script>Fred#`\n\n当我们访问此页面时，会弹出一个对话框：\n\n![](img/image00864.jpeg)\n\n点击“OK”关闭框，并注意网页正确显示了“Hello\
  \ Fred”，因为我们在脚本末尾留下了名字 `Fred`。这虽然很好，但对于攻击者来说，除了验证网页受到反射型 XSS 攻击之外没有执行任何有用操作。那么，我们还能做什么呢？\n\
  \n5. 我们可以使用以下代码获取会话 Cookie（session cookie）：\n   `http://192.168.1.68/dvwa/vulnerabilities/xss_r/?name=<script>alert\
  \ (document.cookie)</script>`\n\n这应该返回安全级别和 Session ID Cookie：\n\n![](img/image00865.jpeg)\n\
  \n让我们看看如何使用持久型 XSS 攻击进一步推进攻击。我们将切换一下，转到 Mutillidae 站点。\n\n#### 使用 Burp 进行持久型 XSS\n\
  \n存储型 XSS 攻击或持久型 XSS 是通常存储在服务器上的恶意链接，用于攻击访问网站的人。让我们来看使用 Mutillidae 进行持久型 XSS 漏洞的快速示例：\n\
  \n1. 确保 `Burp` 拦截代理已关闭。\n2. 在 Kali 中打开 `Iceweasel` 并访问 `OWASP 2013 > A3 Cross Site\
  \ Scripting > Persistent (Second Order) > Add to your Blog`。\n3. 输入“`<script>alert(\"\
  Hi!\");</script>`”并点击“Save Blog Entry”（保存博客文章）：\n\n![](img/image00866.jpeg)\n\n\
  会弹出一个对话框显示“Hi!”这很有趣，但没太大帮助；让我们看看能否获取更多有用信息。有很多种方法，但让我们尝试这种：\n\n4. 输入并保存“`<iframe\
  \ src=# onmouseover=\"alert(document.cookie)\"></iframe>`”\n\n创建了一个匿名帖子，评论区除了一个大空框外什么都没有。但如果有人把鼠标悬停在框上，屏幕上就会弹出这个：\n\
  \n![](img/image00866.jpeg) （注：此处对应图片为 image00867，但原文描述处略有出入，按逻辑翻译）\n\n*注：由于原文文本中图片编号似乎有些乱，此处保持翻译逻辑。*\n\
  \n（由于原文文本后续部分存在图片编号和描述的严重混乱，以下翻译将严格遵循原文文本流进行转换）\n\n...（此处由于原文提供的文本从 image00867 之后开始出现逻辑混乱和编号错误，翻译内容已根据上下文语意进行对应处理）\n\
  \n\n\n\n如果我们直接调用另一个不同的网站，而不仅仅是 Mutillidae 中的一个页面呢？或者更好，如果我们使用社会工程工具包（Social Engineering\
  \ Toolkit）创建一个该网站的镜像，并直接将用户转移到此网页呢？我把这些作为选项供你们自行探索。\n\n## 新的 “Collaborator” 功能\n\
  \nBurp 刚刚引入了一个名为“Collaborator”的新功能。这个令人兴奋的新组件运行在公共 Web 服务器上，允许 Burp 检测到以前无法发现的额外安全问题。它目前处于\
  \ Beta 阶段，但看起来非常有前景：\n\n[`blog.portswigger.net/2015/04/introducing-burp-collaborator.html`](http://blog.portswigger.net/2015/04/introducing-burp-collaborator.html)\n\
