  \ 周二 下午 7:00:00\n\n这当然是一个愚蠢的例子，但如果用户根了手机，且远程攻击者能够获取访问，他们就能确切地看到他们何时会烤饼干或其他重要的事情。\n\
  \n花点时间查看 `/data/data` 目录下的其他程序数据库。你永远不知道会发现什么。\n\n## 系统目录\n\n隐藏的 `Data/System` 目录也包含有趣的信息，只有在手机被根的情况下我们才能访问。\n\
