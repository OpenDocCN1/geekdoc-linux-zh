  \ `PowerShell`，我们直接从我们的 Kali Web 服务器下载了文件到本地系统，绕过了 Windows Web 服务器对 `.php` 文件的下载限制。\n\
  \n好了，这可能非常让人困惑。让我们花一点时间回顾一下到目前为止我们所做的。我们学习了可以在命令注入漏洞的网页中输入系统命令。然后我们看到了如何在我们的 Kali\
  \ 系统上托管一个带有 Metasploit 后门的 PHP shell，并将其发送到有漏洞的目标网站（包括 Linux 和 Windows）。\n\n现在 PHP\
  \ shell 已经下载到目标 Web 服务器上，我们只需要访问 shell 所在的位置，它就会执行。\n\n## 远程执行 Shell\n\n我们在 Kali\
