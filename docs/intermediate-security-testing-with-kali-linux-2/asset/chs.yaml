  \ DNS 查找页面：\n\n![](img/image00766.jpeg)\n\n5. 现在在 Hostname 查找框中：\n\n    1. 输入 `192.168.1.1\
  \ & `，然后，\n    2. 粘贴整个 PowerShell 加密命令：\n\n6. 点击“Lookup DNS”\n\n网站将处理一秒钟，然后返回一个像这样的屏幕：\n\
  \n![](img/image00768.jpeg)\n\n\n\n\n它显示了“results for”并回显了我们输入的整个命令，但它并没有说明 shell\
  \ 是否成功上传。不过，如果我们进入 Windows 7 系统并对 Mutillidae 目录执行目录列表，就能看到我们的 shell：\n\n`robots-txt.php`\n\
  \n`robots.txt`\n\n`secret-administrative-pages.php`\n\n`set-background-color.php`\n\
