  \ [`github.com/mattifestation/PowerSploit/blob/master/Exfiltration/Out-Minidump.ps1`](https://github.com/mattifestation/PowerSploit/blob/master/Exfiltration/Out-Minidump.ps1)\n\
  \n## 第 32 章\n\n## 数字取证框架\n\n数字取证框架 (Digital Forensics Framework, DFF) 是一个功能丰富的取证平台，被新手和专业取证人员均使用。在配合写保护器（write\
  \ blocker）正确使用时，它可以在不以任何方式修改数据的情况下为法律案件保留数字证据。这远超本书的范围；更多信息请参阅制造商网站和用户手册。我们将仅将其作为一个恢复数据的工具来看待。\n\
  \n数字取证框架（DFF）是一个功能丰富的取证平台，被新手和专业取证人员均使用。在配合写保护器正确使用时，它可以在不以任何方式修改数据的情况下为法律案件保留数字证据。这远超本书的范围；更多信息请参阅制造商网站和用户手册。我们将仅将其作为一个恢复数据的工具来看待。\n\
  \n我们将仅查看 DFF 作为一个工具，用于恢复并分析有趣的痕迹。\n\nDFF 也可以通过命令行界面使用。\n\n作者：Arx \n网站：[`blog.gentilkiwi.com/`](http://blog.gentilkiwi.com/)\n\
  \n### 创建硬盘镜像\n\nPowerSploit 是一个了不起的工具！\n\n在本节中，我们学习了从远程会话的内存中提取数据并分析其中有趣的痕迹。我知道市场上还有其他取证程序可以实现同样的功能，而且这种方法并不是法律案件中所需数据的取证完备保存方式，但手动操作这个过程非常有趣，并为渗透测试员开启了一些有趣的可能性。\n\
  \n\n\n\n\n此 NTFS 驱动器镜像包含了我们可以查看/恢复的删除文件。\n\n2. 将 `control.dd` 文件保存到我们的分析目录中。我们将使用\
  \ `DFF` 对此镜像进行快速分析。\n\n3. 你可以从 Kali Forensics 菜单启动 `dff gui`，或者直接在命令行中输入 `dff-gui`\
  \ 启动：\n\n![](img/image01120.jpeg)\n\n4. 点击 `Open Evidence`（打开证据）。\n\n5. 点击绿色加号并选择\
  \ `control.dd` 文件。\n\n6. 点击 `OK` 加载镜像文件。\n\n打开的证据窗口将关闭并带你回到主 gui 界面。起初似乎没有发生，但你会发现\
  \ `Logical Files`（逻辑文件）旁边现在有一个小的 `+` 号。\n\n![](img/image01121.jpeg)\n\n7. 点击左侧 Name\
  \ 窗口中的 `Logical Files`。\n\n8. 主窗口现在应该显示一个名为 `control.dd` 的文件。\n\n9. 双击 `control.dd`\
  \ 然后选择 `always`（总是）或 `yes`（是）：\n\n![](img/image01122.jpeg)\n\n10. `control.dd` 上出现了一个加号。\n\
  \n11. 再次双击 `control.dd`。\n\n现在显示两个分区：NTFS 和 NTFS 未分配空间（unallocated）：\n\n![](img/image01123.jpeg)\n\
  \n12. 双击 `NTFS` 将出现一个文件列表：\n\n![](img/image01124.jpeg)\n\n任何颜色标记为红色的文件都是已删除但可以恢复的文件。如果你点击程序文件，`DFF`\
  \ 将以 `Hex`（十六进制）格式显示该文件。点击视频或图像，`DFF` 将立即显示该文件（即使已被删除）。\n\n13. 点击 `MVC-577V.MPG`\
  \ 文件，底部窗口将出现视频预览：\n\n![](img/image01125.jpeg)\n\n14. 点击 `Deleted.JPG` 文件，你将看到这个：\n\
  \n![](img/image01126.jpeg)\n\n15. 右键点击 `Scientific control.mp3` 文件。注意这里没有视频预览。\n\
  \n16. 左键点击文件并从菜单中点击 `Extract`（提取）。\n\n17. 选择一个目标文件夹并点击 `Okay`。\n\n文件将从驱动器镜像中提取并存储在你选择的目录中。如果你进入该目录并尝试播放它，什么都不会发生。有些不对。问题在于该文件实际上是一个\
  \ Word 文档，某人重命名了它试图欺骗分析人员。如果你将文件重命名为 `.doc` 并用 Word 打开它，你将看到这个：\n\n![](img/image01127.jpeg)\n\
  \n### 结论\n\n在本节中，我们查看了获取驱动器镜像的不同方法。然后我们使用 `Digital Forensics Framework`（数字取证框架）执行了一些基础的文件恢复。安全人员可以使用这些技术来发现隐藏或删除的文件，这些文件可能包含用于获取更多关于目标的信息、公司内部信息，甚至可能是用户保存在文件中的密码（而不是贴在键盘下的便利贴上）。\n\
  \n## 资源\n\n- NIST 取证镜像 - [`www.cfreds.nist.gov/`](http://www.cfreds.nist.gov/)\n\
  \n## 第 33 章\n\n## 取证命令\n\n我们将通过快速查看几个未被涵盖的但可能让安全测试人员感兴趣的取证工具来结束取证章节。\n\n### Autopsy\n\
  \nAutopsy 是一个非常流行的磁盘镜像分析工具。它作为 Web 服务器和客户端运行，因此需要额外的步骤来设置你的取证案件信息并选择要分析的驱动器镜像。\n\
  \n![](img/image01128.jpeg)\n\n对于本教程，我们将再次使用 NIST CFReDS 取证镜像。\n\n1. 从 Kali Forensics\
  \ 菜单或在终端中输入 `autopsy` 启动 Autopsy Web 服务器。\n\n![](img/image01129.jpeg)\n\n2. 现在在\
  \ Kali 中打开 `Iceweasel` 并访问提供的 `http` 地址（如上所示所示）。\n\n![](img/image01130.jpeg)\n\n\
  3. 点击 `New Case`（新建案例）。\n\n4. 输入案例名称，并填写任何你想要的其他信息。我们将案例命名为 `test`。\n\n5. 点击 `New\
  \ Case` 保存信息。\n\n6. 接下来，点击 `Add Host`（添加主机）。\n\n7. 添加任何你想要的信息或直接再次点击 `Add Host`。\n\
  \n8. 现在点击 `Add Image`（添加镜像）。\n\n9. 选择 `Add Image File`（添加镜像文件）。\n\n10. 现在输入镜像位置并输入：\n\
  \    - 输入镜像文件的路径，`/root/Desktop/analysis/control.dd`\n    - 对于选项 2，确保已选择 `Partition`（分区）。\n\
  \    - 选项 3，将导入方法更改为 `Copy`（复制）。\n    - 点击 `Next`（下一步）。\n\n![](img/image01131.jpeg)\n\
  \n11. 接下来我们可以为镜像创建 `MD5` 哈希值；如果想验证验证镜像没有更改，这将非常有用。你还会看到文件系统信息。现在，我们将保持默认的 `Ignore`（忽略）并点击\
  \ `Add` 继续。\n\n12. 镜像现在已复制到 Autopsy 证据库。完成后按 `OK`：\n\n![](img/image01132.jpeg)\n\
  \n我们现在进入了 Autopsy 主界面。我们应该看到我们的镜像文件已导入程序，并保存为 `mount C:/`，文件系统类型为 `ntfs`：\n\n![](img/image01133.jpeg)\n\
  \n13. 点击 `Analyze`（分析）。\n\n14. 现在点击 `File Analysis`（文件分析）：\n\n![](img/image01134.jpeg)\n\
  \n你应该能看到分区内容的完整列表。任何删除的文件都应该以红色显示。你可以查看这些文件、获取详细报告或导出它们。\n\n### 退出程序\n\n在主控制面板上：\n\
  - 点击 `Close`（关闭）。\n- 点击 `Close Host`（关闭主机）。\n- 点击 `Close Case`（关闭案例）。\n- 然后，关闭浏览器。\n\
  \n最后，回到打开的 Autopsy 终端窗口，通过按下 `Cntrl-C` 关闭 Autopsy 进程。\n\n![](img/image01135.jpeg)\n\
  \n### Dumpzilla\n\n工具作者：Busindre\n\n工具网站：[`www.dumpzilla.org/`](http://www.dumpzilla.org/)\n\
  \nDumpzilla 是一个有趣的程序，它可以分析 Firefox 缓存并返回大量信息。根据用户手册，返回的数据包括：\n- Cookies + HTML 5\n\
  - 用户偏好\n- 代理设置\n- 下载\n- Web 表单\n- 历史记录\n- 书签\n- 保存的密码\n\n只需运行 dumpzilla 指向你的浏览器缓存位置并使用\
  \ `--All` 关即可：\n- 打开 Kali 终端\n- 输入 `dumpzilla /root/.mozilla/firefox/[Profile.default]/--All`\n\
  \n这会返回满屏的信息，然后显示摘要图表，最后返回终端提示符。\n\n![](img/image01136.jpeg)\n\n如果你能获得用户 Firefox\
  \ 的副本，这在渗透测试中可能是非常有用的。\n\n![](img/image01135.jpeg)\n\n### Extundelete\n\n工具作者：Nic\
  \ Case\n\n工具网站：[`extundelete.sourceforge.net/`](http://extundelete.sourceforge.net/)\n\
  \nExtundelete 是一个用于基于 Linux 的 ext3 或 ext4 分区的删除恢复工具。如果你的目标是 Ubuntu 或 Linux Mint\
  \ 系统，并且你想查看驱动器上删除了哪些文件，这个工具就会非常有用。你也可以将 Kali 刻录到 CD 中，在意外删除文件的计算机上启动它，并使用此命令恢复它们。\n\
  \n可用选项：`extundelete --help`\n\n![](img/image01137.jpeg)\n\n基本用法：`extundelete [device-file]\
  \ --restore-file [restore-location]`\n\n![](img/image01135.jpeg)\n\n### Foremost\n\
  \n工具作者：美国政府、Jesse Kornblum、Kris Kendall 和 Nick Mikus\n\n工具网站：[`foremost.sourceforge.net/`](http://foremost.sourceforge.net/)\n\
  \nForemost 是一个非常快速的文件雕刻恢复（file carving）程序，最初由美国政府创建。它可以从内存转储中恢复文档和图片。\n\n你可以使用多种类型的镜像采集扩展，如\
  \ `dd`、`raw`、`iso`、`vmem` 等。Foremost 默认创建一个名为 `output` 的输出目录，并将所有恢复的制品放在该目录下，并带有一个\
  \ `audit.txt` 文件。要再次运行程序，输出目录必须为空，或者你必须选择不同的输出文件夹。\n\n可用选项：`foremost -h`\n\n![](img/image01138.jpeg)\n\
  \n让我们针对 Volatility 章节中的 Windows 7 内存镜像采集运行 foremost，看看我们可以恢复哪些图片和 Office 文档文件：\n\
  \n\n\n\n\n- 切换目录到 `~/Desktop/analysis`\n- 输入 `foremost -t jpeg,gif,png,doc -i [memorydumpfilename.raw]`\n\
  \n![](img/image01139.jpeg)\n\n现在打开 `output` 目录并检查子目录以查看恢复的文件。在我使用的 Windows 7 内存捕获文件上运行此命令，恢复了大量的社交媒体个人资料。\n\
  \n![](img/image01135.jpeg)\n\n### Galleta\n\n工具作者：Keith J. Jones\n\n工具网站：[`sourceforge.net/projects/odessa/files/Galleta/`](http://sourceforge.net/projects/odessa/files/Galleta/)\n\
  \n`Galleta` 允许你获取 Internet Explorer 的 cookie 文件并将其导出为可读格式。只需从目标系统的 IE 缓存中复制你想要查看的\
  \ cookie 文件并通过 `Galleta` 运行它即可。\n\n![](img/image01140.jpeg)\n\n如果我们用文本编辑器打开上方显示的\
  \ `cookie:dan@youtube.com/` 文件，我们会看到如下内容：\n\n`VISITOR_INFO1_LIVEqgAdQ_pQEUUyoutube.com/1024315294723047521861561944030426235`\n\
  \n但如果我们通过 `Galleta` 运行该文件并将其输出新的文本文件中：\n\n![](img/image01141.jpeg)\n\n然后在电子表格程序中打开它，我们看到如下内容：\n\
  \n![](img/image01142.jpeg)\n\n![](img/image01135.jpeg)\n\n### iPhone Backup Analyzer\n\
  \n工具作者：Mario Piccinelli\n\n工具网站：[`ipbackupanalyzer.com/`](http://ipbackupanalyzer.com/)\n\
  \n`iPhone Backup Analyzer` (`IBA`) 是一个允许你查看 iPhone 备份的工具。`IBA` 在 Kali 仓库中，但似乎没有安装在当前版本的\
  \ Kali 中。\n\n- 安装输入：`apt-get install iphone-backup-analyzer`\n- 运行输入：`iphone-backup-analyzer`：\n\
  \n![](img/image01143.jpeg)\n\n这个工具似乎仅适用于 iTunes 中的实际 iPhone 备份，而不适用于取证手机镜像。因此，你需要访问实际备份才能使用此实用。该工具返回短信、图像、联系人信息——所有这些对取证人员和安全测试人员来说都具有巨大的价值。\n\
  \n### 结论\n\n安全领域和取证领域之间存在大量重要信息的重叠。在本节中，我们最后查看了可以用于安全测试的取证工具。\n\n## 资源\n\n- Kali\
  \ 取证工具 - [`tools.kali.org/forensics`](http://tools.kali.org/forensics)\n\n# 物联网\n\
  \n## 第 34 章\n\n## 物联网\n\n联网设备或现在所说的“物联网”（Internet of Things）正非常流行。拿过那个精巧的硬件装置，添加一个嵌入式\
  \ Web 服务器，你就可以从世界上任何地方查看并控制它——多么棒的主意！但遗憾的是，由于盲目追求变得更加用户友好和方便，安全性被忽视了，即使在那些用于保护重要设施的设备中也是如此。\n\
  \n物理安全设备用于保护重要的建筑、房间、数据等。这些设备包括：\n\n- 运动探测器\n- 烟雾探测器--摄像头\n- 电子锁\n- 窗窗报警器\n- 火灾探测器\n\
  \n但如果我们通过 `Galleta` 运行该文件并将其输出新的文本文件中：\n\n\n\n\n\n![](img/image01149.jpeg)\n\n摄像头应该位于\
  \ `10.1.1.128-255` 范围内。果不其然，当我从设备 ping 它们时，我收到了响应。有趣的是，该系统的客户端控制软件在视频流中断时，往往只将最后记录的画面作为静态图像显示。因此我在想，如果我们直接从命令行远程关闭摄像头的\
  \ `eth0:poe` 网络接口（`ifconfig down`），会发生什么呢？请对此思考一下。\n\n## 满处都是密码\n\n我确实找到了几个配置文件，通过研究这些文件发现了一些有趣的信息，如下：\n\
  \n```ini\nINI_GROUP_NAME_ADMIN         = \"admin\";\nINI_GROUP_NAME_USER       \
  \   = \"user\";\nINI_SYS_USER_ADMIN           = \"admin\",\nINI_SYS_USER_ADMIN_PWD\
  \       = \"admin\",\nINI_SYS_USER_LOCAL           = \"user\",\nINI_SYS_USER_LOCAL_PWD\
  \       = \"user\",\nINI_USER_USER_LOCAL          = \"user\",\nINI_USER_USER_LOCAL_PWD\
  \      = \"user\",\nINI_DEFAULT_USER_NAME        = \"default\",\nINI_DEFAULT_USER_PWD\
  \         = \"tluafed\"\n```\n\n当然，这些都是简单的密码，你难道对一个楼宇安防设备有别的预期吗？我在文件系统中观察了一会儿，发现我可以修改系统服务，这一切都是因为厂家使用了简单（且公开已知）的密码。我可以花更多时间研究我还能做什么，但实际上，`whoami`\
  \ 命令已经给了我真正需要知道的所有：\n\n![netcat embedded root](https://cyberarms.files.wordpress.com/2014/06/netcat-embedded-root)\n\
  \n我们确实拥有该设备的 `root` 或神级访问权限。真不错……幸好设备没有被设计放在你的防火墙之外，否则任何人都可以轻易获得 root 权限。哦，等一下，这个本就是打算放在防火墙之外的\
  \ IoT 设备！厂家用于保护 root 账户的密码不仅是公开的，而且还是一个小于六个字母的简单密码！即使我没有从网上获取密码，我也可以在很短时间内通过暴力破解破解它。如果像这样的密码通过卡巴斯基的安全检查（`https://blog.kaspersky.com/password-check/`），它返回的可能破解结果是：\n\
  \n![](img/image01151.jpeg)\n\n四十秒！足够蜗牛爬九英寸的时间了。快速查看设备用户文件（`cat /etc/passwd`）显示开发者在这个小型设备上创建了\
  \ 40 多个用户名。他们对所有其他用户也使用简单密码的概率有多大？更糟糕，厂家似乎在两年前就收到了 root 密码公开显示的通知，但仍然没有修复此问题。\n\n\
  ## 大批量利用 IoT 设备\n\n如果我们的目标不是单一设备，而是某家使用了多台此类设备的大型公司呢？我们如何找到并访问所有它们呢？让我们尝试一下 Metploit\
  \ 内置的 telnet 扫描器。Telnet 扫描器允许你输入用户名和密码的组合，或者使用密码列表并扫描网络以寻找成功的 Telnet 登录。如下所示，它轻松地扫描了我们的网络并发现了我们的摄像头系统。然后它使用我们提供的凭据（密码已脱敏）创建了一个\
  \ telnet 会话：\n\n![](img/image0152.jpeg)\n\n设置选项并运行扫描器。我们希望它扫描整个 `192.168.1.0/24`\
  \ 范围，并对该范围内的每个系统尝试这些凭据。这将模拟在大型网络中搜索类似设备：你将看到很多失败的连接，但过了一会儿（务必将线程设置为 `254` 或等待很久！）你将看到成功的登录：\n\
  \n![](img/image0154.jpeg)\n\n如果我们显示并连接到它找到的会话：\n\n![](img/image0155.jpeg)\n\n##\
  \ 终结游戏\n\n通过一次快速的安全测试，我们发现这台开箱即用的楼宇安防设备完全不安全。正如我多次提到的，如果这个设备像预期的那样放置在公司防火墙之外，它将成为黑客的攻击目标。如果他们想禁用摄像头，可以停止控制摄像头系统的单个服务，或者如果他们想，只需运行这些命令中的一个：\n\
  \n![](img/image0156.jpeg)\n\n或者这个？\n\n![](img/image0157.jpeg)\n\n但这么简单的操作真的有效吗？我的意思是，你真的可以远程关闭一个楼宇安防设备吗？确实可以，这里是运行上述命令后\
  \ DVR 控制屏幕的视图：\n\n![E:\\Screen Shot 2015-07-28 at 5.24 PM.png](img/image0158.jpeg)\n\
  \n与其仅仅关掉设备，我想知道如果他们格式化驱动器会发生什么？当然，你会丢失所有存储的视频，但我好奇这是否会让设备完全无法使用？再次，这是一个值得思考的问题。\n\
  \n## 但它在防火墙内，它是安全的\n\n你可能会认为这种攻击只有在攻击者位于设备同一局域网时才可能。如果设备和外部世界之间有防火墙，那么外部人员就不应该能够干扰它。或者你是这样想的。\n\
  \n在本章中系统来自一家美国公司，他们使用的是一个品牌的中国设备。某一天，系统停止了工作。我能看到它，但 DVR 软件不再工作了。我重新安装了软件并从多台电脑尝试，但无效。我与他们的技术支持反复周旋。直到有一天，它又开始工作了。我再次联系他们的技术支持，被告知问题已经解决——他们“更新了他们的服务器上的软件”，这解决了问题。我向他们揭明，让自己处于客户端软件和物理设备之间的通信环中是一个严重的问题，特别是对于一个位于防火墙后的安全设备来说！\n\
  \n我多次向他们强调，仅仅因为他们对远程服务器进行维护就会导致楼宇安防设备宕机，这是不合理的。整个过程持续了大约两周，但在每个阶段，我不断得到公司代表的“保证”，认为只要系统运行正常，一切都是好的——完全是疯狂！\n\
  \n### 结论\n\n我知道这一节非常短，但希望它向你证明了，你不能盲目地信任任何联网的物理安全设备或任何 IoT 设备已经得到了制造商的妥善保护。令人的是的是，考虑到这台设备没有提供更改暴露在网络上的默认密码的方法，而且在公开暴露多年后，新设备仍然在使用相同的简单\
  \ root 密码。\n\n\n\n\n\n# 安全概述\n\n- 补丁与更新\n- 防火墙与入侵防御系统 (IPS)\n- 反病毒软件/网络安全程序\n- 限制服务与用户权限\n\
  - 使用脚本拦截程序\n- 使用长复杂的密码\n- 网络安全监控\n- 日志\n- 用户教育\n- 扫描你的网络\n- 最后，使用攻击性安全\n\n虽然没有系统可以保证\
  \ 100% 安全，但通过使用这些技术，我们可以让系统变得变得更难攻破。\n\n## 补丁与更新\n\n如果可能的话，请使用最新版本的操作系统。在连接互联网的网络环境中使用过时的操作系统真的不是一个好主意。如果你仍在使用\
  \ `Windows XP`，你需要至少更新到 `Windows 7`。微软对 `Windows XP`（以及 `Office 2003`）的官方支持已于 2014\
  \ 年 4 月 8 日结束。这意味着它不再接收安全更新或支持。`Windows 10` 具有一些非常好的新安全功能，例如自动检测你的标准反病毒软件是否被卸载或禁用，然后自动开启\
  \ `Windows Defender`。它还具有反混淆恶意代码的能力，然后通过 `反恶意软件扫描接口` (`AMSI`) 进行进行扫描。\n\n确保你的操作系统和所有软件都是最新版本。此外，还要确保\
  \ `Adobe` 产品、`Java` 和网络浏览器以及 `Office` 软件都定期更新补丁。\n\n确保你所有设备的硬件固件（特别是面向网的设备：`路由器`、`交换机`、`NAS`、`摄像头`、`嵌入式服务器设备等）都是最新的并定期检查。\n\
  \n如果你在一个大型企业环境中，永远不要完全信任补丁更新管理系统。要手动检查重要系统。我见过多个公司服务器在自动安装关键服务包时报错，但补丁管理服务器却显示所有服务器已更新且无错误。\n\
  \n## 防火墙与 IPS\n\n始终使用防火墙，不要在没有防火墙的情况下将任何系统连接到实时互联网。为你的入站互联网连接设置防火墙，并确保每个独立系统都在使用软件防火墙。\n\
  \n创建入站规则（Ingress Rules）和出站规则（Egress Rules）策略来监控或控制进出你网络的信息。在最简单的水平，阻止与你不开展业务的国家进行通信。更高级的系统将允许你控制允许进入和离开你网络的数据类型和协议。\n\
  \n使用 Web 应用防火墙（`WAF`）保护 Web 应用服务器。尽管这些不能保证你能阻止所有针对 Web 应用的恶意攻击。应用程序安全专家强烈建议，即使部署了\
  \ `WAF`，也要安全地编写你的 Web 应用并进行漏洞测试。`入侵防御系统`是非常棒的，当用于`网络安全监控`类型的系统时效果更好（参见下文主题）。\n\n\
  将你的网络划分为区域也是一种非常有效的措施，可以防止黑客在某个区域被破坏时访问你的整个企业网络。\n\n## 反病毒/网络安全程序\n\n诚实，我对`反病毒`程序持矛盾态度。虽然它们能阻止许多威胁，但在\
  \ 20 年的计算机支持工作中，我也见过它们不断被绕过。任何坚定的现代黑客都会研究你的公司，试图找出你使用的是哪种反病毒程序。然后他们将定制他们的利用代码来绕过该品牌的\
  \ `AV`。如果他们无法确定你在运行什么，就会选择一种可以绕过大多数知名 `AV` 的程序。\n\n并不是所有反病毒软件都是平等的。某些 `AV`/`互联网`\
  \ 安全程序已经非常擅长阻止目前非常流行的脚本威胁。做些功课，了解顶尖反病毒软件对当前威胁的表现如何，然后选择一个最符合你公司需求的程序。\n\n## 限制服务与权限级别\n\
  \n关闭服务器和系统上不需要的网络服务和协议。服务器的攻击面越小越好。`Microsoft` 多年来通过改变其服务器产品，使其默认几乎不运行任何服务，根据需要添加服务。\n\
  \n此外，要尽快让旧服务器下线。很多公司会留一台旧服务器在线，以防需要从中获取某些东西，随着时间的推移，它要么被忘记要么没有更新。\n\n永远不要让普通用户为了非管理员任务使用高安全凭据。严格限制\
  \ `Root` 和 `Administrator` 级别的使用。在 `Windows` 系统上，将受损的管理员账户提升到神级的 `System` 账户几乎是非常容易。如果受损的账户只是\
  \ `user` 级别，就会困难得多。\n\n系统管理员在执行管理功能时应使用管理员级账户，然后切换回非管理员账户执行普通计算功能。\n\n## 使用脚本拦截程序\n\
  \n许多现代在线威胁使用某种程度脚本语言。使用如 Giorgio Maone 开发的 Mozilla 扩展 `NoScript` 等脚本拦截程序。这是阻止许多威胁的简单解决方案。`NoScript`\
  \ 阻止脚本在你访问的任何新网站上自动运行。它也很容易允许某些脚本运行，或完全将某个网站加入白名单。`NoScript` 还会记住你的设置，当你访问常用站点时，脚本会被阻止或允许。\n\
  \n我也喜欢由 José María Signanini 和 Felix Shnirini 开发的 Mozilla 扩展 `Ghostery`。`Ghostery`\
  \ 允许你阻止网站上的跟踪脚本、分析和不想要的广告。已有多次报告显示黑客攻击，黑客能够在热门网站的广告服务中插入带有恶意软件的广告。\n\n最后，在可行的情况下启用网络浏览器的隐私功能。不要让它们存储密码或历史记录，并检查像\
  \ `BleachBit` 这样的程序定期清理浏览器缓存是否对你的公司有效。\n\n## 使用长复杂的密码\n\n这不言而明，但不仅要你的计算机系统（以及在线设备！），还要为你所有的在线账户使用长复杂的密码。密码越长越复杂，攻击者破解它所需的时间越长。使用大写字母和小写字母、数字和符号的组合。\n\
  \n为你每个在线账户使用不同的密码，这样即使一个账户被攻破，攻击者也无法使用它访问你拥有的其他账户。在可用时，始终使用多因素身份验证。\n\n## 网络安全监控\n\
  \n我是`网络安全监控` (`NSM`) 的忠实粉丝。如果你运行自己的网络却不知道那是什么，请跑出去（不要走）去购买 Richard Bejtlich 写的《The\
  \ Tao of Network Security Monitoring, Beyond Intrusion Detection》。\n\n基本上 `NSM`\
  \ 是一个捕获你所有网络流量的系统（有时在网络中的多个点），并对其进行入侵或异常分析系统。如果你认为你负担不起 `NSM` 系统，请重新考虑。最常用的系统之一是免费的！\n\
  \n由 Doug Burks (`http://blog.securityonion.net/`) 创建的 `Security Onion` 是一个极其强大且功能丰富的\
  \ `NSM`，完全免费的。你只需要一台性能不错的电脑来运行它，一个网络分路器和至少两个网卡。`Security Onion` 允许你捕获网络流量，然后分析问题并在并在界面中通过报警提醒你。\n\
  \n以下是 Security Onion 运行的几张截图。第一张显示了当我尝试对网络上的系统运行 `Backtrack`（`Kali` 的之前的版本）的 `Autopwn`\
  \ 时触发的一系列警报：\n\n![](img/image01159.jpeg)\n\n你可以看到有多个警告和警报。最后一行记录了一次警报 172 次（CNT\
  \ 列）！\n\n\n\n\n\nSecurity Onion 能够捕获你网络上的 `TOR` 使用。`TOR` 是一种匿名协议，它通过在全球范围内跳转的加密通信来帮助用户实现匿名。`TOR`\
  \ 可用于善意，但黑客也利用 `TOR` 来隐藏他们的攻击。\n\n以下是我在受 Security Onion 监控的测试网络中使用 `TOR` 时发生的情况：\n\
  \n![](img/image01160.jpeg)\n\n注意弹出了多个黄色的“Known TOR Exit Node Traffic”（已知 TOR 出口节点流量）报警。\n\
  \nSecurity Onion 大量功能和工具，使得分析和跟踪网络流量变得简单得多，并具有存储所有网络流量进行分析的能力。\n\n## 日志记录\n\n这基本上是上一个主题的延续。确保在关键交换机、路由器、防火墙和系统上启用安全日志。最好让关键设备和系统将安全日志发送到\
  \ `syslog` 服务器，这样你就可以拥有一份它们的副本（以防黑客擦除系统日志），并方便事件响应。这在最坏情况发生时，有助于在跨设备之间追踪恶意用户和流量。许多基础级防火墙路由器现在甚至包含了\
  \ `syslog` 功能。\n\n## 教育你的用户\n\n如果你的用户允许恶意程序在你的网络上运行，你所有的“深度防御”都是徒劳的。黑客进入你内部网络最常见的方法之一是用户运行电子邮件中的恶意附件，或从网站运行恶意脚本。\n\
  \n教用户避免打开未请求的或可疑的附件，或访问可疑网站。有些公司通过张贴标语鼓励安全的计算机上网技术，并提醒在在线账户中使用复杂的唯一密码，并取得了成功。\n\n\
  欲了解更多信息，美国计算机应急响应小组 (US CERT) 在以下网址建立了一个非常好的参考和警报网站：[`www.us-cert.gov/ncas/tips/`](http://www.us-cert.gov/ncas/tips/)。\n\
  \n## 扫描你的网络\n\n在坏蛋之前扫描你的网络以发现安全问题。仅使用 `Shodan` ([`www.shodan.io/`](https://www.shodan.io/))\
  \ 就会暴露你网络上那些你可能遗忘的系统。大公司通常有许多运行旧版操作系统和 Web 软件的公开系统。不要忘记检查摄像头、开放设备以及打印机，它们可能会提供过多的信息，如内部网络信息、`SNMP`\
  \ 字符串和用户账户。\n\n此外，使用开源（如 `OpenVas`）或商业安全扫描系统（如 `NESSUS`）扫描你的整个网络安全问题。`OpenVas` 预装在\
  \ `Kali` 中，虽然让它运行需要一些过程，但网上有大量的教程。\n\n## 学习攻击性计算机安全\n\n最后，学习像书中介绍的那种攻击性计算机安全技术。我们已经涵盖了攻击性系统安全中最基础的技术。市上有大量的书籍和安全培训研讨会。学习渗透技术（使用\
  \ `Kali` 等产品），然后通过 `Metasploitable` 和 `Mutillidae` 等工具来尝试你的技能。\n\n联系你当地的 `OWASP`\
  \ 分会或其他地区的其他安全小组。参加安全会议并在安全领域建立人脉。许多人在被问好问题时并不介意帮忙。`SANS` 也有一些棒的课程。\n\n一旦经过培训并熟练，在获得管理层许可的情况下，测试你网络系统的安全性。\n\
  \n### 结论\n\n我只想花几分钟感谢你阅读我的书。如果你有任何意见或建议，或者只是想说“你好！”，请告诉我，我很乐意收到你的反馈！\n\n你可以通过 Cyberarms@live.com\
  \ 联系我。\n\n此外，请查看我的博客 `cyberarms.wordpress.com` 和我的 Twitter 账号 `@Cyberarms` 以获取最新的计算机安全新闻和教程。\n\
  \n这个项目花费了相当的时间（实际上我是一半年前开始的，并且几乎完成了，只是在 `Kali 2.0` 发布时更新了它），但如果反馈积极，我计划编写第三本也是最后一本使用高级技术的\
  \ `Kali` 书。\n\n再次感谢！\n\n顺颂商祺，\n\nDaniel Dieterle\n\n## 资源\n\n- 选择和保护密码 - [`www.us-cert.gov/ncas/tips/ST04-002`](http://www.us-cert.gov/ncas/tips/ST04-002)\n\
