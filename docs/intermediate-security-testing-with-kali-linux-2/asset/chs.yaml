  11/07/2007  09:03 AM              562,688 install.exe\n```\n\n## 运行 Windows 系统和网络命令\n\
  \n我们不仅限于目录命令；还可以运行几乎任何不需要额外输入的系统命令。\n\n例如：\n\n 计算机用户 - `192.168.1.1 & net user`:\n\
