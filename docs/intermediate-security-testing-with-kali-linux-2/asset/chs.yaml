  \n\n\n\n\n# 从远程系统提取 Word 文档\n\n既然我们一直在研究从内存转储中提取信息，在回到更传统的取证工具之前，让我们花一点时间从安全的角度深入探讨一下。我之前非常喜欢\
  \ W00tsec 写的一篇关于从内存转储中提取 RAW 图像的文章：\n\n[`w00tsec.blogspot.com/2015/02/extracting-raw-pictures-from-memory.html`](http://w00tsec.blogspot.com/2015/02/extracting-raw-pictures-from-memory.html)\n\
  \n我想如果能在渗透测试期间使用相同的流程从远程 Windows 系统内存中提取文本数据，那将非常有趣——而且你确实可以做到！在本章中，我们将看到如何从远程机器的内存中提取实时数据，将其解析为可见文本，并在\
  \ Kali 中进行分析。我们将从 Word、Outlook 以及三个主流浏览器的 Facebook 消息中恢复数据。本章使用了一个不同的 Windows 7\
  \ 系统作为目标。区别在于，我使用了一个运行着 Office 2010 的更新版 Windows 7。如果你有类似的系统，可以尽管按照示例操作；如果没有，这仍然会是一次非常有意思的阅读。\n\
  \n## 从 Word 中恢复数据\n\n我们将从一个已经激活的远程 Metasploit Meterpreter 会话开始。基本上，我们欺骗测试系统运行了一个带有陷阱的文件，该文件创建了一个指向我们\
  \ Kali 系统的后门。我们想要获取远程内存，但只需要 Word 进程使用的内存。按照 w00tsec 的教程，我们只需要使用 SysInternals 的\
  \ `ProcDump` 命令。\n\n`ProcDump` 可以从微软 TechNet 网站下载：\n\n [`technet.microsoft.com/en-us/sysinternals/dd996900.aspx`](https://technet.microsoft.com/en-us/sysinternals/dd996900.aspx)\n\
  \n它是 SysInternals 套件的一部分。该命令允许你从特定进程提取活动 RAM。你可能还想下载 SysInternals 的 `Strings` 程序：\n\
  \n [`technet.microsoft.com/en-us/sysinternals/bb897439.aspx`](https://technet.microsoft.com/en-us/sysinternals/bb897439.aspx)\n\
  \n`Strings` 是 Linux 命令的 Windows 版本，我们稍后会用到。\n\n![](img/image01095.jpeg)\n\n1. 这两个程序都需要通过\
  \ Meterpreter 上传到目标系统：\n\n![](img/image01096.jpeg)\n\n2. 接下来，在 Metasploit DOS shell\
  \ 中输入 `tasklist` 并按回车查看远程 Windows 系统上运行了什么（起可能什么都不显示，如果没有，请等几秒并再次按下回车键，你应该就能看到下面的屏幕了）：\n\
  \n![](img/image01097.jpeg)\n\n在列表下方，我们看到用户开启了一个 MS Word 会话（`WINWORD.EXE`）：\n\n![processes](img/image01098.jpeg)\n\
  \n3. 使用 `-ma` 交换和进程名 `WINWORD.EXE` 运行 `procdump` 命令，最后我们将生成的 dump 文件命名为 `worddump`，如下：\n\
  \n```\nprocdump -ma WINWORD.EXE worddump\n```\n\n![](img/image01099.jpeg)\n\n我们现在在远程系统上存储了一个名为\
  \ `worddump.dmp` 的内存转储。该文件很大， 424 MB，我们可以直接把该文件下载回 Kali 系统——但我们可以将其缩小。我们实际上只需要寻找内存转储中的文本。这里有两个选择：我们可以使用\
  \ SysInternals 的 `Strings` 程序处理数据转储并提取所有文本（显著减小下载大小），或者我们可以将整个文件批量下载回 Kali 系统，并使用\
  \ Linux 的 `strings` 命令进行解析。\n\n选择权交给你，但可以说，仅使用两个程序的默认设置，Linux 版本的解析文件效果似乎要好得多。但基本上两个版本的命令是一样的，`strings\
  \ word.dmp > word.txt`。\n\n所以如果我们想在远程系统上运行它：\n\n```\nC:\\Users\\Dan\\Downloads\\\
  Procdump>strings worddump.dmp > worddump.txt\n```\n\nSysInternals 的 `strings` 程序将解析文件中的\
  \ ASCII 字符串并将其保存为文本文件。注意大小差异：\n\n![](img/image01100.jpeg)\n\n或者我们可以直接使用 Meterpreter\
  \ download 命令将大型 dmp 文件拉到 Kali 系统，然后在上面运行 Linux strings 命令。\n\n### 在 Kali 中分析\n\n\
  现在如果我们在 Kali 中打开生成的文本文件，会看到大量信息——系统设置、系统上设置的变量，我甚至发现了提到的注册表项。在我的机器上我发现了这个（使用 Linux\
  \ strings 命令产生）：\n\n![Kali Strings Result](img/image01101.jpeg)\n\n或者由 Windows SysInternals\
  \ Strings 命令产生的：\n\n![](img/image01102.jpeg)\n\n与我在 Windows 7 上打开的 Word 文档相比：\n\n\
  ![Original Document](img/image01103.jpeg)\n\n如你所示，我在 Windows 7 系统上打开的 Nmap 用户手册已成功从内存远程获取，并可以在\
  \ Kali 系统上查看！\n\n## 从 Outlook 提取数据\n\n对其他程序使用这种技术也得到了有趣的结果。任何在 Outlook（`OUTLOOK.EXE`\
  \ 进程）期间打开的电子邮件也可以从 RAM 中恢复。这里是我在 Outlook 中从归档文件夹打开的一封邮件副本：\n\n![](img/image01104.jpeg)\n\
  \n从内存获取数据：\n\n![](img/image01105.jpeg)\n\n运行 Linux Strings 命令产生：\n\n![](img/image01106.jpeg)\n\
  \n如你所示，我们能够从 RAM 中恢复一份 HTML 格式的邮件副本！\n\n## 恢复 Facebook 对话\n\n同样，你可以恢复任何过的 Facebook\
  \ 帖子或即时消息。我登录了 Facebook 并查看了两个过去的对话，并开始了一个新对话。Chrome、Firefox 和 Internet Explorer\
  \ 中的所有消息文本都是恢复的。Chrome 和 IE 似乎有用户 ID（我假设是发送者接收者）以及每个帖子的日期时间戳，类似于这个模拟的：\n\n`mid.2347362976674:1a1272a35b3`\n\
  \n`XtBI`\n\n`March 11, 2015 11:15 am`\n\n`So, what are you up to today?`\n\n但 Firefox\
  \ 的转储看起来像这样：\n\n`ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ`\n\n`So, what are you up to\
  \ today?ZZZZZZZZ`\n\n`ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ`\n\nFirefox 只显示消息文本，除了“Zs”字符串外没有其他信息。我不确定，但看起来\
  \ Firefox 在存储到 RAM 中时可能会加密某些信息，尽管当我查看原始 `.dmp` 文件时，Firefox 转储中可以使用一些日期/时间戳。\n\n\
  此外，Firefox 在内存中只创建一个进程，而 IE 和 Chrome 会创建几个（IE 有两个打开的进程，Chrome 有四个）。其中一个 IE 进程中没有任何关于\
  \ Facebook 的内容，Facebook 数据全在一个单一内存进程转储中。Chrome 似乎将 Facebook 数据分散在它的四个运行进程中的三个中。\n\
  \n这里是 Chrome 的 tasklist 视图：\n\n![](img/image01107.jpeg)\n\n这并没有太大区别，因为所有消息文本似乎都在单个进程中。\n\
  \n## 使用 Procdump & Mimikatz 提取密码\n\n\n\n\n最后，我们可以使用——没错，你猜对了——PowerShell 来从进程中提取内存。`PowerSploit`\
  \ 中的 `Out-Minidump` 命令可以非常简单地创建一个进程的微转储（mini-dump），然后对其进行分析以获取痕迹（artifacts），或者将其传递给\
  \ `Mimikatz` 来转储密码。由于我们已经介绍了如何使用 `PowerSploit` 命令，并展示了如何操作内存转储，我将这部分内容作为一个挑战留给读者去探索：\n\
  \n[`github.com/mattifestation/PowerSploit/blob/master/Exfiltration/Out-Minidump.ps1`](https://github.com/mattifestation/PowerSploit/blob/master/Exfiltration/Out-Minidump.ps1)\n\
  \n如果你遇到困难且无法解决，这里有一个由 Chris Campbell (@obscuresec) 提供的分步演示视频：\n\n[`www.youtube.com/watch?v=Rz9lYMVhTEM`](https://www.youtube.com/watch?v=Rz9lYMVhTEM)\n\
  \nPowerSploit 是一个了的工具！\n\n### 结论\n\n在本节中，我们学习了如何从远程会话的内存中提取数据并分析其中有趣的痕迹。我知道市场上还有其他取证程序可以实现同样的功能，而且这种方法并不是法律案件中所需数据的取证完备保存方式，但手动操作这个过程非常有趣，并为渗透测试员开启了一些有趣的可能性。\n\
  \n防御此类攻击的最佳方法是遵循针对社会工程和钓鱼类类型攻击的良好安全规范。攻击者需要对你的系统拥有远程连接或本地访问权限才能从你的内存中提取项目。一如既往，不要打开电子邮件中未知或未请求的附件。对从同事账号发送的听起来的链接保持警惕，并在浏览网页时使用脚本拦截器和良好的杀毒互联网安全程序。企业应始终使用能够存储和分析流量以检测恶意行为的产品。最后，系统的良好的物理安全也很重要。加固位置、使用开机密码以及加密卷始终是一个好主意。\n\
