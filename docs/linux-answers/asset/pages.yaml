    Partition Magic can reclaim disk space if you''ve removed a distro.


    ![](img/ae9fa465fbf72f37444db778719b1c0f_39_0.png)


    You basically have two problems, one of which is fixing your boot manager, the
    other is to reclaim the space from your hard drive. The boot partition is easily
    fixed. You don''t say whether you installed SUSE again on the new drive, or which
    boot manager you are using (grub or Lilo).


    In either case you will need to edit the configuration files. First of all, determine
    which old distro you wish to remove is (preferably hda something, if it is on
    the same drive as Windows). Next, find the appropriate configuration file. If
    you are using grub you''ll find this at:

    - /boot/grub/menu.list

    - /etc/fstab


    +   - /boot/grub/menu.list

    - /etc/fstab


    Using your favourite editor (e.g. emacs, vi or whatever) load the file and remove
    the sections that make reference to lilo on the old drive. For lilo this will
    be something like:

    ```

    image=/vmlinuz

    label=linux

    root=/dev/hda

    read-only

    ```


    ```

    image=/vmlinuz

    label=linux

    root=/dev/hda

    read-only

    ```


    Make sure you remove all the lines between the image and the next image section.
    The process is similar for grub. For Lilo, you now need to run lilo from a terminal
    to update the settings. When you reboot, the old partition should be gone. Reclaiming
    the space from the old partition is a slightly different matter, especially if
    you want to


    use it under Windows. If you are unsure of what you are doing, you are better
    off using commercial Windows tools to reclaim the space and add it back into your
    partitions.

    If you want to do the Linux way, use Parted (www.gnu.org/software/parted), and
    in either case, make sure that you read the documentation thoroughly and make
    backups, as you can thrash all your data otherwise.


