    # Canon Can


    There are three kernel drivers that you need to be concerned about. First, the
    IDE tape driver - which allows your drive access via the interface/dev/hda0 (as
    you have only one tape drive); secondly, the SCSI emulation driver - which fools
    your system into thinking ATAPI devices are SCSI; and third, the SCSI driver (in
    combination with the previous one) are created via dev/sda


    If your lucky, these drivers will already be kernel modules installed on your
    system. Look in the directories /lib/modules/<KVER>/build for files ide-tape ide-scsi
    and in /lib/modules/<KVER>/scsi for (where <KVER> is your kernel version). If
    they are all there, then you can choose your drive either dev/hda or dev/sda without
    any extra kernel.


