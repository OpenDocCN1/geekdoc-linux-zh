  md: '# Miscellaneous


    The VFS error you are experiencing suggests that it is trying to use the wrong
    partition as your / partition, or the correct partition is actually corrupt in
    some way The ''03:05'' means it is trying to mount the device with a major number
    of 3, and a minor number 5, which is /dev/sda5 Since you received that error after
    defrag in windows, it would suggest that Windows has corrupted your Linux partition,
    either by not ignoring the partition or because it does not know when the Windows
    partition finishes properly. In either case, you will need to restart Mandrake
    8.0, as you can consider that the data was on the drive to be lost.


