    When compiling against a library (whether a shared or static), your compiler needs
    to know where to find header files that define the library''s API, it also needs
    to find the library code itself. It will look for these things in a number standard
    places. Standard libraries will be in the directories /lib and /usr/lib and headers
    will be in /usr/include. The compiler


    Some packages, however, include scripts which make includes and libraries easier.
    GTK+ uses the gtk-config tool which will print out the necessary headers, library
    path and libraries for compiling programs against GTK+. To compile, you can do
    something:


    ```

    gcc myprogram.c gtk-config --cflags --libs

    gcc myprogram.o gtk-config --libs -o my

    ```


