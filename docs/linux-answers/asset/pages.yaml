    The best of way tackling this is to convert the RPM packages into debs and then
    install them as normal. This is achieved with the tool alien which can be found
    on the distro CD in the main section. To convert a package called package.rpm,
    you will need to log in as root, and then assuming that the RPM is in your current
    directory:


    ```

    alien package.rpm

    ```


    After some processing, this will churn out a package package.deb in the same directory.
    You can install it as normal with dpk. The software will be under the control
    of the package management system as you usual and all the dependencies will be
    care of:


    Most distributions will happily run on all systems, although some are compiled
    with optimisations for Pentium CPUs. This won''t stop it working on a 486, but
    you may have the older option. Usually, with low-spec machines, the problem is
    the amount of stuff the distribution installs, rather than what the packages are
    optimised for so you''ll definitely want to do a custom installation and not include
    things which you don''t need. The biggest CPU hog on low-spec machines is X, so
    if you can get away with just using a command line and typing your skills, then
    you will find your machine is a lot happier, quicker and more usable.


    ```

    dpkg -install

    package.deb

    ```


    While this method works perfectly well, it is less than ideal. You should really
    consider building and installing software from the source code.


