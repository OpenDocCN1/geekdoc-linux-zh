    You need to use a font that supports the extended ANSI characters used within
    the prompt. Popular fonts are Nexus and Shine, both of which should be easily
    located via any popular search engine for nex10.pcf and shine.pcf.

    You then need to tell your font server that these fonts exist, and you can do
    this by copying the .pcf,.pgz files to /usr/share/X11/FF7/misc/ and running mkfdfont
    from that directory. You will need to restart the font server with /etc/rc.d/init.xfs
    restart, or if the fonts are being handled by X directly, with xtset refresh.
    You will need to tell your terminal emulator, be it xterm, Eterm or your KDE terminal,
    which font to use will be either ''nexus'' or ''shine''.


