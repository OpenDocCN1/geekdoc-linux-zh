    header files, installed which cause a whole load of problems. You should check
    /usr/local/lib "libGL", and delete anything which exists, also check /usr/local/include/GL.
    Once you have deleted these, you''ll have to run /sbin/ldconfig as root, then
    to build your programs.


    You are right. Debian uses dpkg, where RPM is used on distributions such as RedHat
    and Mandrake. If you are able to extract the RPM, you can use the alien to convert
    it to a dpkg package, and then install it. You can get alien with apt install

    It is worth noting that Debian ''testing'' and ''unstable'' are two distributions
    of Debian. ''testing'' is what we call Debian 3.0, or Woody, and ''unstable''
    contains unstable packages. If you have testing and unstable listed in /etc/apt/sources.list,
    then you will use the packages from unstable as will have higher version numbers,
    which may be a problem if the packages do not install properly.


    It''s quite like when you are trying to compile cube, the Makefile is not aware
    of the location of GL so does not include the appropriate -GL -GLU options for
