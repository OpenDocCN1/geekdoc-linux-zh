    The standard CD burning software for Linux is cdrecord (available from freshmeat.net),
    but requires the use of the ide-scsi module, so that your IDE burner appears as
    a device on virtual SCSI bus. This sounds complicated, but it involves nothing
    more than compiling a few extra modules and making sure they load correctly by
    adding the following to /etc/modules


