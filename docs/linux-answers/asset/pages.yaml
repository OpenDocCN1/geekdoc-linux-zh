  md: '# Virus? What virus?


    I have recently read an article about Linux, which I found to be a little dismissive
    and dangerously inaccurate, as it says that Linux is virtually immune and that
    there is no anti-virus software.


    To set the record straight, I would like to offer my advice and opinions. Firstly,
    I think people should be warned while Linux is nowhere as dumb as to willy-nilly
    execute macros and scripts like some over-excited daemon, a Linux server or workstation
    is indeed harbour viruses. For instance, if you were sent an email attachment
    that originated from an infected MS user, sending it to on would make you responsible
    for the spread of the virus.


    This be a particularly good reason for running some sort of virus defence, particularly
    on a Samba server or all those MS users trying to potentially store infected data
    and e-mails! Autoloading of modules is made easy with /etc/modules.


    The second point that I would like to make is that McAfee have both a Linux and
    Unix-based version of its virus software. For a very reputable corporate company
    and we use McAfee Total Virus Defence, or TVD as also known. The drawback is that
    this particular software doesn''t appear to provide on-demand scanning or interception
    of hard drive reads/writes. I could be wrong but I''ve never found the feature
    to turn it off.


    After installing it, you need either a manual scan or set a Cron job to schedule
    regular scans. Again, a Cron job would be an obvious candidate for a Samba server
    providing storage services to Windows front end clients, maybe a daily scan prior
    to backup would be a sensible precaution.


    And in answer to a possible question that you might be thinking of: I do run anti-virus
    software on Linux: McAfee TVD.


    Kevin Yoo


    You are quite right saying that it does go far beyond the Linux machine. On any
    sort of network, as long as there is one point of failure, as a Windows machine
    and an ignorant user, it''s very difficult to appropriately secure every machine
    on that network, without complex firewall rules and protocol specific filters.


    It''s far better to have the anti-virus software on the Windows machines, than
    on the Linux machine(s). If you have a Samba share, and Windows systems are accessing
    files from there, they will pick up the virus and block it. It is, naturally,
    better to have the virus detected on the machine propagating it in the first instance,
    rather than have a separate machine providing the virus checking features.


    As well as the Linux machine to access files and distribute emails, then it will,
    more-likely, also the internet, the ISPs mail server as well as a few other sources
    of infected files it will also have a single solution which fixes the problem
    for the whole lot, rather than just one of them, which is more widely preferred


    In many respects, a daily virus scan is worse than not having one at all, on many
    occasions, users will probably assume that they are safe. But any virus will have
    up to propagate beyond your network, and not to your Windows machines. There are
    certainly a large proportion of Viruses which are distributed via email servers,
    and many SMTP servers, such as Exim and Sendmail, have filtering options for that
    style of virus.'
