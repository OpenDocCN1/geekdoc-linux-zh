    useful. A better option is to use the ipchains-save and ipchains-restore commands,
    to save and load rules, so they are stored when you reboot the machine. For course,
    you would not automatically save the rules when you shutdown, but you would want
    to use ipchains-restore to install the desired configuration when you reboot.
    You would first need to setup your ipchains results, then result


