    # Mounting Dos


    I have two questions: how can I access my DOS partition from Linux? And, how can
    I access my second DOS hard drive?


    Gene, via email


    Mount a DOS partition is easy with Linux. The only thing you really need to know
    is what your DOS drives are (e.g. for the first IDE drive, hdb for the second
    etc.). Mounting the drive is done with following command:


    ```

    mount -t vfat /dev/hdb1 /mntdos

    ```


    You can mount your second hard disc using mount -t vfat /dev/hdb1


    The secret is to get the man command to output pages in PostScript (PS). This
    is how you can. For example, man -s will dump the man page for the command to
    the console as a PS file


    Now we have a handy format, we can get on saving some paper. The command psnap
    (which is part of the GNU tools packages) takes a normal PS file, and outputs
    a PDF with multiple pages of the source file on each page. For example, ''psnap
    -4 source.ps.ps so will reformat ps on sheet of paper and store the result in
    des.ps. Pnap has loads of options to control the style and formatting of its output,
    check its documentation.


    We can combine this all on the command line with pipes. To print the man page
    with two pages per sheet, use something like: ''man -t psnap -2 lpr


    # Priority


    Is it possible to prioritise tasks or applications running under Linux? I''d like
    to encode MP3s in the background while getting on with my usual work, but it seems
    to demand so much processor time that other things are not painfully slow.


    How do I list the contents of a tar archive without unpacking it? This has been
    driving me mad. Please help!


    Paul, via email


