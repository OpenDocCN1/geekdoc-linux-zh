    Perhaps the simplest way is to save the file you want to get a word count on and
    use the tool wc to print the statistics. For example, try the following:


    ```

    wc -w myfile.txt

    ```


    This code will display the number of words in myfile.txt.


    Another way is to use the Emacs-matches function. This counts the number of times
    a regular expression is matched in a buffer from the cursor point to the end of
    that buffer). To count all the words in a document, move the cursor to the start
    of the buffer and hit META-X to enter the mini-buffer. Enter the following command:


    ```

    count-matches

    ```


    After you have entered the code, press Return. You will then be asked to enter
    the regular expression to match for. Enter this next command:


    ```

    \w*

    ```


    After you have done this, hit Return. Emacs will print the number of matches,
    in this case it will


    The ''\c'' of the above expression matches the start of a word: either at the
    start of a line, after some non-word characters as punctuation. The ''\w'' pattern
    matches any character which can form part of a word (which characters depends
    on the mode you are in). So ''\w*'' matches any number of word constituent characters.
    Essentially, what we are doing is counting the number of times and just gobbling
    the rest of each word there.


    Ideally, you would want to write your own function in Elisp and add it to your
