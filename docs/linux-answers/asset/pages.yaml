    A short question and the nice answer is that generally you don''t need to. The
    ext2 filesystem is more intelligent than the various Windows filesystems in it
    tries really hard not to fragment files when writing to disk. As long as your
    drive is not too full, ext2 usually manages to keep them in a fairly fragmented
    state.


    You can see how fragmented a drive is, when your system boots. Linux will check
    with fs. For each partition it will print out a report telling you how many files
    are ''contiguous''. This is a measure of how fragmented the drive is. If it is
    less than 10 percent, don''t worry about it.


    The issue is complicated with Mac floppies, because these can be split into resource
    and data folders. Linux HFS supports two schemes for respecting folders,


    If you really fragment the drive, there is a tool available defrag to do the job.
    This is probably available with your Linux distro, but it will defrag an ext2
    partition, but the catch is that the partition must be unmounted for it. It''s
    not much good for working on your root partition, for example, unless you build
    your own floppy with defrag on.


    And, anyway, not everybody trusts defrag, so another solution is to back up the
    partition in question, format and restore its contents. This method takes advantage
