    # Ghostscript


    How do I use Ghostscript to display PostScript or EPS files? Is there a special
    version for PDF too?


    Ghostscript automatically recognise PostScript, EPS and PDF files. It will go
    ''filename'' in X and will show a window displaying that file. You would be better
    off using a graphical front-end for Ghostscript though, rather than just gs alone.
    GhostView or a similar package. For PDF files you can also use ''xpdf'', which
    comes with most distributions, or which is available from this site: www.freshmeat.net.


    # How much free?


    +   - I have several drives attached to my Linux setup and one or another is always
    running out of space. I know that I have a lot of stuff, and I have used to find
    out how much stuff there is in various directories. However, I need to know how
    much free space is on each partition.


    This isn''t so tough; you simply have to use du, df (short for disk free). This
    will show you the percentage and amount of space which is available on each drive,
    and much more besides should you care to know!


