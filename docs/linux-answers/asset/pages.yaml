    problem I think what you are doing failing to use BASH properly. There are two
    ways to execute a command or program using BASH and other shells. Firstly, you
    can place the executable file in the PATH that BASH checks for commands. The PATH
    is normally defined in the .bash file you''ll find in your home directory, and
    is stored as an environment variable. Type: $PATH to see the current path on your
    system.


    There is another way to execute a program, which is to give it a path in front
