  md: '# Networking


    Without knowing which ISP you are using, it is difficult to give specific details,
    but a tool such as kppp or gnome-ppp can be used to configure a dial-up interface.
    Simply pop in the detail, username, password and any specific authentication options,
    and hopefully you will find yourself connected to the Internet. If you are using
    an SDN TA, rather than a standard serial modem, you should look in the direction
    of the ISDN4linux software, or at www.isdn4linux.com.


    To share the Internet connection with other machines on the network you require
    to complete IP Masquerading support into the kernel. If you are unfamiliar with
    recompiling the kernel, there are HOWtos on web sites, linux.com/howtos/; If you
    rebuild the kernel and reboot, then you should have ipchains release 1.9 installed.
    If not, head along to your nearest Mandrake mirror and install it.


    Assuming your LAN is using 10.11.0.24/255.255.0 as the network, on eth0 and your
    internet is 10.1.1.1, you simply do:


    ```

    ipchains -P forward DENY

    ipchains -A forward -i eth0 -s 10.11.0.24 -j MASQ

    echo 1 > /proc/net/ipv4/forward

    ```


    After setting the gateway for the other machines to 10.11; they should be able
    to access the Internet once you have supplied them with appropriate name server
    IPs.


    # Reader response


    I have enclosed some details that may help you sort out your modem setup-perhaps,
    you would forward it on.


    I have configured my modem (US Robotics 56K voice 9190 & a Creative sound card
    (Vibra 16) with both Red and Mandrake. Both were quite difficult, achievable.
    Configure the sound card using Drakon or the command pppdump-from a command line.
    This creates file in /etc isappnp.conf. This has the settings for the card and
    the modem. Alternatively, use Drakon in Mandrake and adjust the settings for the
    DMA8 and DMA16 until you get a sound test. The file is created using your method.
    My settings are:


    (CONFIGURE CTL0070/1 (LD 0 (DMA 0 (CHANNEL 3)) DMA 1 (CHANNEL 7)) (INT (IRQ 5
    (MODEM))) (IO 0 (SIZE 8) (BASE 0X220)) (NAME "Creative Labs SoundBlaster Voice
    16" (ACT Y))


    Set up the modem using Windows, if you read interrupts IRQ from My Computer>Properties.
    Then reboot into Linux.


    To set up your modem, copy the /etc/doc/serial 2.X/serial file (read manual pages
    (serial modem) and set HOW TO, create a file serial.conf in /etc with a text editor
    to change the first line of "serial.conf" ###ASAVE###


    At a command line set ttyS3 then repeat for ttyS1, ttyS2, using the name of the
    settings.


    I set my modem to tty2, IRQ 3, UART 16550x003e to ensure there are no conflicts)
    (you may want to play with these the modem to work after e.g. tty2 will save the
    setting if you have changed the linuxconf settings.


    Run linuxconfig and change the modem setting to ttyS i the tty (com) you have
    configured your modem to e.g. tty2 stop. This will save the setting to a file
    called serial.conf


    Test the modem, and if it says "modem" by changing the 00 setting or IRQ or ttyX.
    If it says "modem not", it is possibly incorrect or symlinked. After each change
    of the serial setting repeat /etc/rc.d/init.d stop


    If the modem works, copy the files serial.conf, isappnp.conf and isappnp.gone
    for a floppy in case you restart the system.


    For the ISP information, you will need to enter the IP address of the ISP into
    KPPP (Freever & BT are quite good at providing this information - why not change)


    Reboot the system.


    Hopefully this will result in the soundcard and modem working.


    SJ Walker


