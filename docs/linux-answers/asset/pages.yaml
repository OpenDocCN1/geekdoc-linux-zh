    Supermount behaves like any other filesystem, it automatically mounts the filesystem
    when you access it.


    ```

    mount -t supermount

    <super-options>,--<sub-options>

    <mount_point> <mnt> <mount_point>

    ```


    would be an example supermount command, with <super-options>containing options
    for the supermount, as filesystem=dev=<sub-options> contains options for the subfilesystem,
    as the floppy disk CD-ROM. <mnt> is the point for the file system.

    This is translated to a /etc/stab option, which is similar to:

