    various client and server programs and which ones will depend on whether the Linux
    machine is acting as a print server or as a workstation printing to the NetWare
    network. It should be available as a part of the Linux distribution you are using.
    For example, the ncpfs client, nprint, will allow you to insert files into a remote
    printer queue on a NetWare server.


