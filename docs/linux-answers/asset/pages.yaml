    A command sandwiched between these quotes is executed and its output substituted
    into the command line.

    nYou can also make things easier with some variables. GCC will also look for includes
    in the directories specified by -I INCLUDE_PATH and for libraries specified by
    LIBRARY_PATH (g++ will also look for in CPLUS_INCLUDE_PATH). For export:


    It is not too difficult to build an RPM, but it is a rather more involved process
    than we have a time to cover in much detail here. See the RPM HowTo at www.rpm.org
    for more detailed information.


    ```

    LIBRARY_PATH=/usr/local/lib

    will make sure gcc looks for libs in. A better solution is to use makefiles and
    define variables to hold the necessary paths.

    ```


    The basic steps are to get the source code, turn any changes you make to the source
    to get it to build on your distro into a patch and create a spec file. The spec
    file contains various meta-information about the package to build – name, version
    numbers, dependencies, etc. – and instructions on how to build the package. It
    also contains various scripts to take care of actually installing, configuring
    and removing the package from a system.


    Tools using autoconf will help automate things even more.

    The file /etc/ld.so.conf is no help when it comes to compiling programs. It is
    used to specify a list of extra paths (besides lib and /usr/lib) that the run-time
    linker will use for shared libraries. If you want to install libraries in non-standard
    places and have them globally accessible you can add paths to this file. To modify
    /etc/ld.conf, you''ll need to be logged in as root and can also use a text editor
    /ld.conf to update the run-time linker''s library cache. You can also temporarily
    add paths to the library search path via the environment variable LD_LIBRARY_PATH.


    Building RPMs won''t differ between architectures and distro flavours, but different
    distributions have different standards governing how packages should be built.
    Mandrake, for example, have their own version of the RPM HowTo. Have a look at
    www.linux-mandrake.com/howtos/mdk-rpm.


    For example, try the following command:

    export LIBRARY_PATH=/usr/local/lib

    You should also look at the gcc documentation and the ld.so manpage for more information.


