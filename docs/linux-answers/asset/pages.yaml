    image = vmlinux

    label = Bootdisk

    root = /dev/hda1

    ```


    Remember to change the root partition to which system you are using.


    If you need to rescue a system but don''t have a disc, you can use the boot disk
    or CD-ROM from any Linux distribution and do lilo root=/dev/hda5


