    do you need to know what is associated; surely you need to know what''s in the
    file you are looking at?” Well, how do I do if I don''t know what program to use
    to open a file with a particular extension?


    I know how to use a text editor to edit .txt files and Gimp will work with .jpg
    files, what do I do with .tar files and other files that I''m left after unzipping
    them for download?


    What do I do with RPMs, source and debs? They all seem intriguing and I can''t
    wait to use them, whatever they are. Your help would drive me on keeping with
    Linux. At the moment, it''s an uphill struggle.


    Derek Logan, email


    Like in Linux, it depends on what software you are using. You seem concerned with
    the desktop and I assume you are using KDE or GNOME. With KDE, you can set file
    associations by opening a file manager (kfm) and selecting the Global MIME Types
    option from the Edit menu. This will present you with a directory of file classes:
    text, image, sound, etc. So, for example, to change the default for viewing GIF
    images, you would select the folder to open the images and then select GIF. A
    dialog will pop up, you will see the properties of the GIF filetype. By going
    to the Bindings page and looking at the bottom you''ll see a chooser labelled
    Default Application which will select you to a type of GIFs


    Things are much like with GNOME. Open the Control Center and select MIME Types
    from the list on the left. This will present a page with a list of files that
    your system has. To set a default for MP3 files, double-click on audio/x-mp3.
    Again, a dialog will pop up when you select this, that defaults to open, and edit
    MP3s. With GNOME you will use a specific command line tool for the you to launch,
    a placeholder %f where the place where the name of the file will be inserted.
    To use xMPlayer to play MP3s, you will enter xmps %


    For tar and other files, you may set up a file association to view or unpack them
    with a graphical tool, such as garchive or ark. With the GNOME file manager, you
    can just double-click on an access to its contents through the file manager


    RPMs are archive which contain software packaged for installation on Red Hat systems;
    debs are something for systems derived from Debian. You should use the appropriate
    tool for your distro to view, install these types of archives. The command rpm,
    unsurprisingly, handles RPM packages, while dpkg handles debs for Debian. If you
    don''t like using the shell, there are graphical alternatives like GNoPM for RPMs
    and Gnome-Qt for Debian packages.'
