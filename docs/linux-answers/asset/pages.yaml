  md: '# # PHP working


    I wanted to experiment with Personal Home Pages (PHP), so I decided to try running
    a few pages on my local machine. I got some of simple PHP stuff from a website
    and put it into page, but when I try to view it in a browser, all I get the actual
    text displayed on the page. My question is relatively straightforward. How do
    I get Personal Home Pages working?

    Andy Johnson, London


    Your question may be relatively straightforward, unfortunately the solution to
    your problem may not be quite as clear cut. Your problem could be caused by any
    of a number of factors. Because you are see the script as text, it is most likely
    that you have pasted the script into the page properly. Even if php is not working
    properly, the script would be hidden on most browsers.


    PHP scripts should look like this:


    ```

    <?php

    [your script]

    ?>

    ```


    This lets the web server know this part is script that needs to be interpreted
    before the page is sent to the server

    Secondly, you need to make sure the page has a php extension. Apache and other
    web servers often use this to emphas the fact that a page contains PHP script
    - if it doesn''t have the extension, it will not be processed at all.

    Finally, it''s a good idea to check that PHP is installed and working! You can
    quickly check by creating a file called "test.php":


    ```

    <?php

    phpinfo();

    ?>

    ```


    Now point your browser at it and you should see a colourful screen full of details
    on your PHP installation. If you get nothing, either PHP isn''t installed or your
    web server isn''t configured to use it. Most Apache installations are set up by
    drops


    include php these days - if you skipped installing PHP, you can source from www.php.net,
    or perhaps more easily, visit the download site for your distro (or hunt on your
    CD-ROMs) and install the package for your flavour of Linux.


