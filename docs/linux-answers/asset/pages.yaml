- img_proc: true
  md: '# Miscellaneous


    Linux processes have priorities ranging between -20 and 19 (-20 having the highest
    priority), but only the superuser can specify a negative priority or value. You
    can initiate a command via the ''nice'' program, setting a default nice level
    using `-n <value> <command>`, or if you''d change the priority of a current process,
    you can use `renice <pid>`.


    So, in order to use your MP3 encoder for less of the time, leaving more time for
    your other tasks, you want to get a nicer value (that is higher). Most tasks default
    to a level of 0 or if you haven''t changed the default.


    To find out the number of your task, you can use the ps command. ''ps -A'' will
    give you a list of all the current processes and their pid.


    A simpler way, if you are running KDE, is to use the KDE task manager. You can
    then select the task from list and renice it with the option from the Process
    menu.


    software, edit configurations or do anything, really. How do I logon as myself,
    but have all the power of being root? Juan, via email


    Running as root is usually a bad mistake waiting for, since a misplaced asterisk
    or a wrong command could potentially wreck your whole installation. There are
    couple ways to achieve privilege without actually logging in as root to do everything.


    The first method is to use the ''sudo'' command, which will allow you to create
    a root session whenever you need to.


    Another more powerful way is to use the ''sudo'' command. This lets you set up
    administrative privileges for particular users. You could let them run individual
    programs as root, or stop running programs as the superuser.


    # Archiving


    I understand how to use tar and how to unzip a zip file, but notice there are
    quite a few files that end with .bz2, which is a completely compression program.


    With ordinary files, I can just `tar xvf xxx.gz` to uncompress them, but with
    the .bz2 files I have uncompress twice. There is a way of doing this in one line?
    Phil, via email


    The easiest way to do this is to get the bzip2 to unpack to stdout and use a pipe
    to pass the decompressed file to the tar command for unarchiving. Using the line
    `bzip2 -c file.bz2 | tar xvf -` in a shell work.


    # Cron


    I understand that there is a program called cron which is used for running tasks
    at a specific time. I can''t seem to find any information on how to set this up.
    How you?


    There is a cron howto the following website: http://linux.com/howto You''ll also
    find it at your local LDP mirror. If you''d prefer an offline search, man 5 crontab
    gives the syntax, along with examples, of the /etc/crontab.


    # Backing up


    Could you please tell me what the best way of backing up my Linux partition is
    I have a CD-RW drive, but most of my Linux is on a 2GB partition.


    There are many different tools available for backing up under, so it really depends
    on your personal tastes and the medium. For the actual CD, ddrecord is ideal.
    You can create a cd image on your hard disk and use rsync (http://rsync.samba.org/)
    to update it with various parts of your hard disk,


