  md: '# Server


    ```

    :sd=/var/spool/lpd/lp

    name=confucius.local

    trp=dp500

    lp=/dev/null

    sh:

    ```


    The first line above is a comment, and the second is the start of the printer
    queue property. The latter defines the name of the printer queue and gives it
    the additional names of ''lp'' and ''desket''. So, for example, you could print
    to this remote printer with the following command


    ```

    lp -Q document

    lp -Qdesket document

    ```


    Note that the names of printer queues must be unique. If a client has a local
    printer, you must make sure the printer queue corresponds to the remote printer
    by a different name.


    The rest of the definition above sets various attributes for the printer. The
    Cl attribute specifies the location of the local spool directory for the printer.
    You have to create a spool directory on each client (it gets used when the network
    is down, for instance) as well as the printer server.


    The next line gives the address of the printer server - in this case, the machine
    ''confucius'' on the network ''localnet'' - and the following line gives the name
    of the printer queue to print to that machine. The ''lp'' attribute, when used
    with a local printer, gives the name of the device to print to, for example,/dev/lp.
    It''s not needed for setting up a remote printer, though, we just direct it to
    /dev/null. The final line is to suppress the printing of banner pages and headers.
    If you look at the printcap manage you will find more information on specifying
    a printer definition.


    Okay so the printer client knows about the remote printer. We have to tell the
    printer server which machines are allowed to use its printer. To do this, add
    the name of each machine to the file /etc/hosts.lp on the server.


