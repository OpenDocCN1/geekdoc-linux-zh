    # Startup


    How can I make a particular program running on startup? Helen, via email


    It depends exactly what you want it to start. If you mean start up, in boot time,
    simply add the command to /etc/initrc.local, not forgetting to add & to the command
    to make sure it runs in the background.


    If you want it started when you log under X, add a line to the run command either
    to the file ~/.xinitrc (if you launch X with startx) or the file -/.xsession (if
    you are using a display manager such as xwm, gdm or kdm)


    Again, if you forget the &,, the session will lock up until you kill the particular
    program. Unfortunately, it''s not as bad as locking your X session as it is locking
    the whole machine during boot up.


