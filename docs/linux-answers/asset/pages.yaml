  md: '# Installation


    Generally, when you want to install software, you need to be the ''root'' user
    rather than a regular user. The alternative is to install software in your home
    directory, so that you don''t need to do it, and it''s a lot simpler to install
    it system-wide as root.


    The easiest way to become the root user is to use su, which will ask you for the
    root password, then you will be given a root prompt. However, this changes your
    UID to root, and it does not have to use the full path to access some programs,
    such as ifconfig, ifconfig and route can be becoming annoying. Instead, you can
    do su -, which gives you a root login shell.


    An alternative is to use sudo, which allows you to run specific programs as per
    the /etc/sudoers for the user''s password, rather than root, it''s more secure,
    plus you can limit what programs a particular user is allowed to run as root,
    so they don''t have free reign over the entire system.


