  md: '# Working with Tables


    Maybe you don''t think of a table as a graphic presentation tool, but we sure
    do. Purists might say tables are simply used to lay out information graphically,
    but they aren''t considering the fact that information within tables can be animated
    in PowerPoint (more on that in Chapter 12) or can be changed into pictures and,
    therefore, become graphics in and of themselves.


    The bottom line is that tables are a wonderful tool for displaying information;
    you can compile information from a variety of sources and lump it all together
    into a single table that clearly outlines every detail. Easy to understand and
    use, tables can be added to a presentation through either an automatic process
    or a custom design.


    If you''ve got a presentation that seems heavy on bullets, consider using a table.
    Tables are a great way to break up the monotony of bulleted page after bulleted
    page, and the effects and options available in PowerPoint 2007 can make your tables
    look sharp and professional. Although you might not have considered using tables
    as a graphic presentation tool, you can design tables in new ways that will have
    you thinking twice about the entire idea.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_89_0.png)'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'In this chapter, we''ll explore how tables are created and edited. We''ll also
    show you how to use color effectively, as well as how to use the two different
    tabs that will appear when you create a table: The Table Tools Design tab and
    the Table Tools Layout tab.


    You add a table to your presentation in one of two ways: drawing it or by using
    a simple drawing box to specify the number of rows and columns. Both methods are
    accessed via the Insert tab in the Tables group. Either method is fine.


    To add to the table, click within a cell and then start typing. To change the
    font, font color, or font size of the, highlight the text and use the Font group
    on the Home tab to make the desired changes. You can also change text from cell
    to cell by using the Paragraph group tools on the Home tab. In individual cells
    or throughout the table (highlight specific areas to apply changes universally),
    you can


    # Creating Tables


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_90_0.png)


    +   - Align text differently.


    +   - Add bullets.


    +   - Change list levels.


    +   - Change line spacing.


    # THE EASY WAY


    To add a table to your presentation, click the slide, and then go to Insert |
    Table and select the number of rows and columns by dragging the cursor until you''ve
    selected the desired number (as shown above). Click in the final cell and the
    table will appear on your slide.


    # Add Rows or Columns


    After you''ve created the table on your slide, if you discover that you need an
    additional row, you can add one by highlighting a row and right-clicking. From
    the shortcut menu, select Insert | Insert Rows Above or Insert Rows'
