    | Pen Color and click the option you prefer. Then, using the mouse (which now
    appears as a pen on your screen) draw over the borders you want to change. The
    borders will instantly appear in the new border style you have selected. You can
    apply multiple border styles within a table by using this command, as shown in
    Figure 6-6. If you want to change the width of the border lines, you can do that
