  md: 'For example, an object that has been animated with the Appear effect will display
    sound and dimming options whereas an object that has been animated with the Diamond
    effect will display direction and sound options instead. You''ll need to take
    a close look at each object''s Effect tab to determine which options are available.

    The Timing tab will typically show standard timing options for every effect, though:


    +   - Start the animation on a mouse click, with a previous animation, or a certain
    amount of time after the last animation.


    +   - Delay Tell PowerPoint to delay the animation for a certain amount of time
    after the Start option selected.


    +   - Speed Select from Very Slow to Very Fast. A bonus is that it displays the
    exact time in seconds, which PowerPoint does not provide when you set the speed
    from the Animations tab or at the top of the Custom Animation pane.


    +   - Repeat Repeat the animation according to your preferences.


    +   - Rewind When Done Playing Use this option for movies; you can tell PowerPoint
    to rewind the animation when it finishes playing.


    +   - Triggers Choose to trigger an animation as part of a click sequence or start
    the animation when a different object on the slide slides.


    Figure 12-7 Each animated object can be modified quickly using the shortcut menu.


