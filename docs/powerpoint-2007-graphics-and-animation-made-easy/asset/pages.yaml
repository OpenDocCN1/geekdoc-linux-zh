  md: '# Arranging Movies and Clip Art on the Slide


    Once inserted, you can arrange movies and animated clip art anywhere on the slide
    by simply dragging them where you like. Let''s try this now.


    +   1. Go to the Insert tab.

    2. In the Media Clip group, select Movie.

