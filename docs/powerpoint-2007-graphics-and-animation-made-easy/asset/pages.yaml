    create exactly the clip art you want.

    The tools you will typically use when creating clip art are


    +   - The bucket

    - Line drawing tool

    - Pencil or freehand drawing tool

    - Airbrush

    - Shapes, such as oval, circle, square

    - Color chart


    # MEMO


    Want a transparent background in your clip art? Save the graphic as a new image,
    and then use the transparent feature in your graphics program to turn-the background
    transparent. Resave the new graphic to your hard drive. You can add drop shadows
    the same way; simply rescue your graphic with different names and apply the various
    features you want.


    Once you''re ready, the sky is the limit. Create a simple housing scene, for instance,
    using the rectangle shape for house frames, the line drawing tool for brushes,
    oval and circle shapes for trees or flowers, and coloring tools as desired. Once
    your drawing is complete, save it to your hard drive as a graphic file (GIF, TIFF,
    JPG, for example).

    Then, to add the new clip art to your Clip Organizer, Windows Vista can follow
    these steps:


