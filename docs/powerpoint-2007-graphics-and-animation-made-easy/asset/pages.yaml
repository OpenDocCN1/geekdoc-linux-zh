  md: '# PowerPoint 2007 Graphics and Animation Made Easy


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_94_0.png)


    Figure 6-4 The Table Tools Design tab


    # # The Table Tools Design Tab


    When you insert a table in PowerPoint 2007, the colors default to a combination
    of colors based on the theme you have chosen for the presentation. The header
    row will usually be a darker shade, whereas the rows below will alternate in lighter
    shades. Columns are typically delineated by white lines.


    This color scheme and format, however, might not be exactly what you need for
    your presentation. It might match your theme, but you may want to add more to
    your presentation. That''s when you''ll want to use the Table Tools Design tab,
    as shown in Figure 6-4. From this tab, you can change a variety of styles and
    colors associated with your table.


    # # Use Color to Make Your Point


    Color is a major factor in giving your table the impact to capture audience attention.
    You can keep the basic style of your table so it matches your overall presentation
    theme, yet easily changes the colors within it. As you play with color in a table,
    consider which pieces of information need to stand out for your audience and which
    pieces can be used more in the background.


    For example, perhaps you want the header row and any subsection rows of your table
    to pop out in bright yellow so the audience can easily see where new information
    rests within a table. Or maybe you want alternate color in columns or rows so
    the audience can identify different pieces of information in the table simply.
    Some presentations, on the other hand, might work better with a table that is
    completely uniform in color.


    > MEMO

    Don''t confuse the Table Tools Design tab with the standard Design on the Ribbon.
    The Table Tools Design tab commands allow you to change table formatting; the
    standard Design tab lets you make changes to other aspects of your presentation.


    82'
