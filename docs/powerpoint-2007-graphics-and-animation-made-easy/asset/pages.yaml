- img_proc: true
  md: '# Chapter 10 Adding a Movie to Your Presentation


    On the Effect tab, go to the Stop section and click After and enter the total
    number of slides you want the movie to play across.

    Once you''ve inserted your movie, you''ll see a new toolbar in the Tools Options
    tab. Let''s go through each of the groups and commands on this toolbar.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_155_0.png)


    In the play group, you can Preview your movie. Click the Preview icon to now see
    your movie in PowerPoint 2007.

    The Movie Options group has a number of commands, including:


    +   - **Slide Show Volume** From this command, you can adjust the volume of your
    movie or mute the sound altogether. The default volume is Medium.


    +   - **Play Movie** This command lets you select whether to play the movie automatically,
    which we selected, to play when clicked, or to play across the slides.


    +   - **Hide During Show** Check this box to hide the sound or movie during the
    slide show.


    +   - **Play Full Screen** Use this command for the movie to play on the entire
    screen.


    +   - **Loop Until Stopped** This command sets up the sound or movie to continue
    playing until manually stopped.


    +   - **Rewind Movie After Playing** This command automatically rewinds the movie
    back to the first frame once it''s finished playing.


    You can also access these options by clicking the arrow in the bottom-right


    143'
