    In this chapter, you learned how to move graphics back and forth between PowerPoint
    and Word, and you discovered different ways to format pictures,


    # FORMATTING AND THE BUILDING BLOCKS ORGANIZER


    Although most graphics move easily from Word to PowerPoint, some lose their formatting
    when moved. One example of this is when you use Quick Parts in the Insert tab.
    Quick Parts offers Building Blocks for tasks you use regularly. Quick Parts has
    headers and footers, cover pages, watercolors, text boxes, and more to help you
    put together a slick document. But although building blocks work well in Word,
    they do not translate well to PowerPoint. You''ll need to see which blocks you
    can use or adjust by copying and pasting them into a PowerPoint presentation.
    To access Building Blocks Organizer in Word by going to the Insert tab, and from
    the Text group, select Quick Parts | Building Blocks Organizer. Insert the building
    block you want to include in your Word document.


