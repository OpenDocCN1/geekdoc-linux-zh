    # The Table Tools Layout Tab


    Earlier in this chapter, we mentioned the Table Tools Layout tab as a method for
    inserting rows and columns and merging cells. You can also do a few more things
    about that which are worth noting from a graphics perspective. Figure 6-2 shows
    the Table Tools Layout tab.


    # DOs AND DON''TS


    Because of updates in PowerPoint 2007, you will discover some compatibility issues
    with earlier versions of PowerPoint. If your presentation will be used by people
    who don''t have PowerPoint 2007, you should be aware of problems that can arise
    concerning when people present views in earlier versions. As you build your tables,
    think about the audience and how the presentation will be viewed. Then review
    these Dos and Don''ts to be certain that your presentation can be viewed easily
    by your entire audience.


    +   - Use a Quick Style under Light, Medium, and Dark when working with backgrounds.

    - Use background fills as a shape.

    - Apply a Quick Style with a background shape.

    - Use visual effects (shadows, bevels, and so) or apply pictures, gradients, and
    texture fills to cells or text.

    - Use WordArt on text in table cells.

    - Change text orientation.


    +   Do...

    - Use No Style, Table Grid, or No Style, No Grid under Best Match For Document.

    - Use No Style, Table Grid, or No Style, No Grid when working with backgrounds.


    Don''t...'
