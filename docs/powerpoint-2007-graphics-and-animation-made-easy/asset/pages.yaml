    # Keep the Design Invisible


    When a design works, the work you put into it is pretty much invisible to the
    viewer. Take the automobile, for example. It doesn''t matter what you think of;
    they are extremely sophisticated and intricately designed. Most people rarely
    consider the years of work involved in the detailed design. They simply get in
    and drive, expecting the auto to work without any thought on their part. The reality
    of the design is invisible; the final product is used successfully to solve a
    problem (get people from point A to point B).


    If your slides are overweight with design concepts—if you try to carry too much
    onto a slide or illustrate many points at once—your design


    # GRAPHIC DESIGN TRENDS


    There is a graphic trend that arose from the work of architect Ludwig Mies der
    Rohe: Less is Mies, as he was referred to by most, is considered a modern architectural
    pioneer. He worked with intense clarity and minimalism in the post World War I,
    using contemporary materials such as glass and industrial steel to define interior
    spaces. His revolutionary idea needed a minimal framework alongside free-flowing
    space in order to provide balance and clarity. Why clutter the architecture with
    unnecessary details when the primary point of the structure was to connect people
    and activities?


    In graphic design, the less-is-more concept works in much the same way. Restraint,
    order, balance,


    harmony, and simplicity go a long way toward helping a reader recognize and retain
    the message you''re sending. John Maeda''s, The Laws of Simplicity (MIT Press),
    is a read that teaches people how to need and get more in business, technology,
    design, and life.

    To Maeda, simplicity and complexity will always need each other—in the world,
    the more something will stand out. The same idea can be applied to PowerPoint
    slides. As readers are constantly bombarded with increasingly complex items such
    as cell phones with 100-page instruction books, a refreshingly straightforward
    slide can drive home a point simply because it is so unlike the complex surroundings
    we live in.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_17_0.png)'
