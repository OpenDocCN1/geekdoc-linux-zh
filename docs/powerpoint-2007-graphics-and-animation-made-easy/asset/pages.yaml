- img_proc: true
  md: '# Where to Find Clip Art


    You can find clip art in different places. Most people go immediately to the Clip
    Art Collection, but if you stop there, you might just be missing out on some terrific
    clip art that can make the difference between a cheesy presentation and an imaginative
    one. Here are the places where you want to just find the right graphic for your
    presentation.


    # Clip Art Collections


    When you want to add clip art to a slide, the steps are very simple. Go to Insert
    | Illustrations | Clip Art and simply select the clip art you want from the pane
    that opens on the right side of your screen, as shown in Figure 5-1.

    This pane is the Clip Art pane. From it, you can access four different types of
    clip art collections:


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_74_0.png)


    +   - My Collections, which holds clips that you can create or add to your own
    collection.


    +   - Office Collections, which holds clips offered with Microsoft Office 2007.


    +   - Shared Collections, which includes clips typically available on shared servers
    or common workstations. A network administrator must create and export the collection
    for use.


    +   - Web Collections, which are clips available through the Microsoft Office
    Online collection.


    When you use the Clip Art pane, you can enter search terms, tell PowerPoint where
    to search, and specify the file types you want to look for.


    # Clip Art on Office Online


    To access clip art from Office Online, you need to be connected to the Internet.
    If a search in the Clip Art pane doesn''t yield what you''re looking for,


