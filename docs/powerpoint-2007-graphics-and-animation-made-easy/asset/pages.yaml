    # Understanding Table Style Options


    The Table Style Options group is used in conjunction with the Table Styles Gallery.
    Select or deselect a Table Style Option, and the instant styles shown in the Table
    Styles Gallery will change accordingly. The options are


    +   - Header Row Specially formats the top row of a table.

    - Total Row Applies to the bottom row of the table. This option tallies the column
    totals and displays them.

    - Banded Rows Formats even and odd rows differently so they are easy to read.

    - First Column Specifically formats the first column in a table.

    - Last Column Specially formats the last column in a table.

    - Banded Columns Formats even and odd columns differently to make them easier
    to read.


    > MEMO

    Need to remove the header line below the first row? Go to Style Options and deselect
    Header Row.'
