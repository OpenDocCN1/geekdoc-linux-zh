  md: '# PowerPoint 2007 Graphics and Animation Made


    vertical walls around the chart or the floor underneath it. You can either use
    the default selection provided by the presentation theme or apply your own colors.


    The 3-D Rotation command, however, allows you to change the orientation of the
    information in a 3D chart. The command opens a dialog box that lets you adjust
    3D presets that have been applied to the chart, the axes, the perspective of the
    entire chart, the default position of the chart within its box, the depth of chart
    elements, and chart scale, as shown below.


    Because every 3D chart can include so many different aspects, you''ll need to
    work with each chart individually to determine which of the options to use in
    a given situation. The beauty of PowerPoint 2007 is that the dialog makes easy
    to play with the options; just use the up and down arrows for the different options,
    and watch as the chart changes in relation to your choices.


    In 15-13, you can see how simply changing Chart Scale Depth from 130 to 660 percent
    can make a stunning difference in the look of the chart.


    # Using Analysis Commands


    When you use a chart in a presentation, you''re doing it (or be doing it) to help
    the audience understand how numerical data impacts them. To help with that, PowerPoint
    offers four analysis options that you can use to charts:


    +   - Trendlines Lines drawn on a chart that indicate the direction or trend of
    the data.


