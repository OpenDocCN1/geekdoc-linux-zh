  md: '# # The 3-D Rotation Command


    Occasionally, you''ll want to rotate WordArt. You can do this easily from the
    Format Text Effects dialog box or by selecting WordArt Styles | Text Effects |
    3-D Rotation. Let''s see how we can make changes from the Format Text Effects
    dialog box.


    +   1. Select your WordArt.

    2. In the Format Text Effects dialog box, select 3-D Rotation.

    3. In the Rotation section, click once on the Left button in the X: option: This
    will change the rotation to 355 degrees.

    4. In the Y: option, click the Down option one time. This will change the rotation
    to 355 degrees.

    5. In the Z: option, click Counter-Clockwise three times for a 15 percent rotation.

    6. Click Close.


    Figure 7-16 shows an example of rotated WordArt. You can rotate your WordArt in
    a variety of ways; experiment to see what you can do with 3-D rotation.


