    that helps catch any errors that might be visible to viewers when the slide show
    runs. By rehearsing, you can review animation timings, slide transitions, and
    special effects. Knowing how to rehearse your presentation before you add animations
    is helpful because you can check animations more effectively as you add them.


    To perform a review of your presentation and how your graphics look and act, you''ll
    need to open your presentation in Slide Show mode. To do that, open and go to
    the Slide Show tab. In the Start Slide command, click From Beginning, as shown
    in Figure 12-1.


    **Figure 12-1** You can start a slide from the beginning or from the current slide.


    Click the mouse as needed to move slides or watch as the slides play automatically.
    The slide show will play using the method you set. Note any slides where graphics
    are incorrect or animations appear differently than you anticipated. When the
    slide show finishes, click the screen to exit back into Design mode.


    Make any corrections needed to your graphics or animations, and then replay the
    slide show to be certain you''ve fixed any problems. You might need to repeat
    this process a few times, but the time spent is worth it if you can catch and
    fix mistakes before an audience sees the presentation.


