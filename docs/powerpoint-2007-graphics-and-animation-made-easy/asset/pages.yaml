  md: '# THE EASY WAY


    # Using the Adjust Command


    You can create different folders within the My Pictures folder to help organize
    your photos. As long as you categorize in a way that works for you, you''ll be
    able to find your pictures quickly and easily.


    Using the Adjust command group, you can change a picture to create the mood or
    special effects you like. The commands include:


    +   - Brightness to make your photo bleed or stand out more on a slide


    +   - Contrast to increase or lessen the photograph''s intensity


    +   - Recolor to create interesting color effects that work with the slide layout


    +   - Compress Picture for printing, screen view, and minimizing for sharing by
    email


    Let''s walk through how to use a few of these commands to create a mood for your
    pictures. Insert your picture as shown in Figure 3-1.


    After inserting your picture, follow these steps:


    +   1. Select the Brightness command and change the brightness to +20%.


    +   2. Select the Contrast command and change the contrast to +40%.


    +   3. Select the Recolor command and select a color. The color in Figure 3-2
    is Accent Color 6 Dark variation.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_41_0.png)


