  md: '# Using Built-In Animation Tools


    Now let''s move on the real meat of this chapter: Animations. When you work with
    animations, you''ll be using two key areas of PowerPoint: The Animations tab and
    the Custom Animation pane. Figure 12-2 shows the Animations tab and the command
    groups: Preview, Animations, and Transition To This Slide.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_180_0.png)


    Figure 12-2 The Animations tab


    Figure 12-3 shows the Custom Animation pane, which is opened by clicking Custom
    Animation in the Animations command group on the Animations tab.


    When you use the Animations tab, you can quickly access built-in animations. There
    are three basic animations that can be applied with a single click: Fade, Wipe,
    or Fly In. You can easily see how quickly those animations occur. The Custom Animation
    pane, on the other hand, provides a much more detailed list of animation options.
    We''ll explore the Animations options first, and then we''ll take a look at the
    possibilities available with the Custom Animation pane.


    # Applying Animations from the Animations Tab


    If you''re simply looking for a quick way to animate an object, you can use the
    Animations command group on the Animations tab. The Animate command offers three
    commonly used animation selections available through the drop-down menu:


    +   * Fade The object will move from invisible to visible. This animation is actually
    the opposite of fading, which implies an object will become paler.


    Figure 12-3 The Custom animation pane'
