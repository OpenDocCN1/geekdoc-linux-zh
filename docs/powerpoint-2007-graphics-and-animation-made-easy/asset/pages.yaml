- img_proc: true
  md: '# Working with Charts as Design Elements


    Charts are a great way to share numerical information with an audience. Whereas
    SmartArt is a good choice for other types of information, charts are really your
    best bet when you have to explain numbers. They are a great way to illustrate
    and compare numerical data.


    From the military to corporations around the world, charts are a universal method
    for sharing numerical data. Although we don''t know when the chart was first invented,
    it''s clear that once it was, the chart became a communication tool that could
    be used to bridge languages and cultures.


    With PowerPoint 2007, adding a professional looking chart to a presentation is
    a pretty simple process; the Quick Style Galleries you''ve seen in other areas
    of PowerPoint are also available with charts, and three different Ribbon tabs
    allow you to make modifications to your charts quickly and easily.


    In this chapter, we''ll cover the commands available with each of the chart Ribbon
    tabs and show you how to create eye-catching charts.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# A Quick Look at Charts


    Charts in PowerPoint are linked automatically to Excel spreadsheets, so when you
    create a new chart you''ll see an Excel spreadsheet open simultaneously on your
    screen. This nifty feature makes it easy to change or add chart data; you simply
    make the updates in the associated Excel spreadsheet and the information is applied
    to your PowerPoint chart automatically.


    PowerPoint offers eleven different types of charts to choose from.


    | Chart | Description |

    | --- | --- |

    | Area | Places data into horizontal areas that show the relationship of each
    part to the whole |

    | Bar | Uses horizontal bars to illustrate differences in individual pieces of
    data by using categories on the vertical axis and values on the horizontal axis
    |

    | Bubble | Arranges data in a scattered format on a chart; compares sets of three
    values |

    | Column | Uses vertical bars with categories organized along the horizontal axis
    and values along the vertical axis |

    | Doughnut | Organizes data as a percentage of an entire pie and can contain more
    than one data series |

    | Line | Plots data into lines and organizes categories on the horizontal axis
    and values along the vertical axis |

    | Pie | Organizes data similarly to a doughnut chart but only contains one data
    series |

    | Radar | Compares cumulative values of a number of data series |

    | Stock | Arranges data in a specific order to illustrate fluctuations in stock
    prices and can also be used for scientific data |

    | Surface | Shows the most favorable combinations between two sets of numeric
    data |

    | XY | Similar to bubble charts but compares just two sets of data |


    MEMO

    Creating a chart in Excel and importing it into PowerPoint is also a simple process.
    See Chapter 13 for more details.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Chapter 15 Working with Charts as Design Elements


    To insert a chart, go to the Insert tab and click Chart in the Illustrations command
    group. Select the type of chart you want, and click OK. For illustration purposes,
    we chose the 3-D Area chart.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_211_0.png)


    Once you''ve inserted the chart on your slide, a spreadsheet will open. Although
    you can easily use this spreadsheet to make changes to your data or chart information,
    go ahead and close it for now. We''ll show you how to open it on demand in "Working
    with Data Commands."

    Another you''ll notice once a chart has been added to a slide the addition of
    three new Ribbon tabs: The Chart Tools Design tab, the Chart Tools Layout tab,
    and the Chart Tools Format tab. In the following sections, we will explore each.


    # # The Chart Tools Design Tab


    Click your chart to activate the new tabs, and then click the Chart Tools Design
    tab. It will look similar to the one shown in Figure 15-1, although specific chart
    styles and layouts will differ if you have chosen a different chart than the one
    we''re using.


    199'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# PowerPoint 2007 Graphics and Animation Made


    From left to right, the Ribbon has four command groups: Type, Data, Chart

    Layouts, and Chart Styles.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_212_0.png)


    Figure 15-1 The Chart Tools Design tab


    # Using Type Options


    You have two simple choices in the Type command group: You can change

    the chart, or you can see the current chart as a template. If you select

    Change Chart Type, you''ll see the entire selection of available charts again.

    Just select a new one and click OK. The chart on your slide will automatically

    change.


    If you want to save and reuse a particular type of chart, you can save it as

    a chart template. Add the chart to the slide, and then go to the Chart Tools Design

    tab in the Type group, click Save As Template. The Chart selects folder,

    type name for your chart, and click Save.


    Figure 15-2 Select Switch

    Rows/Columns to change the

    orientation of information on

    a chart.


    # Working with Data Commands


    When you need to change the data in your chart, you

    have a couple of different options available

    the the Data command group. Your chart might

    be easier for you to understand, for

    example, if row and column data are reversed.

    ith that case, select the chart and Switch Row/

    Column. Figure 15-2 shows how a simple change

    can make a chart look different. The top-left chart

    is the original version, whereas the bottom left

    shows the chart after using this command.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_212_1.png)'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# MEMO


    To change plotting order of a data series in a chart quickly, go to the Chart
    Tools Design tab, and from the Data group, click Select Data and highlight the
    data series and click Move Up or Move Down.


    If you need to move the data to different locations in a chart, use the Select
    Data command. This opens the corresponding Excel spreadsheet, but it also opens
    the Select Data Source dialog box. This dialog box allows you to add, remove,
    move, and edit information or chart labels easily. You can also switch rows and
    columns using this dialog box.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_213_0.png)


    If you prefer to just use the Excel spreadsheet to make changes, click Edit Data
    in this command group to open the spreadsheet. When data changes in a linked Excel
    spreadsheet or when the data otherwise updating, click Refresh Data to reflect
    the changes in your chart.


    # Changing a Chart Layout


    If you decide that you still want to use the type of chart you''ve chosen, you''d
    like a different layout, the Chart Layouts command group is the place to go. For
    example, we chose a 3-D Area chart earlier in this chapter. Let''s assume we still
    want an Area chart, but we no longer it to be in 3D. In this case, we would choose
    a different chart layout by using the More arrow to open the Quick Style Gallery
    and select a new layout.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# PowerPoint 2007 Graphics and Animation Made Easy


    In Figure 15-3, the original 3D area chart is shown in the upper left where the
    new layout (Layout 6) is shown on the bottom right. The new layout provides chart
    and axis titles and substantially shortens the height of the chart itself.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_214_0.png)


    Figure 15-3 You can apply different layouts to the same type of chart.


    # Changing a Chart Style


    If you''re happy with the chart type and layout, but not so happy with the chart
    style, that''s easy to change, too. just click the More arrow in Chart Styles,
    and choose a new style from the gallery. You''ll typically see multiple choices
    for every chart type, from multicolored versions to totally contradict the theme
    you applied to your presentation.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_214_1.png)


    # The Chart Tools Layout Tab


    You can add a lot of details to your charts and work easily using the Chart Tools
    Layout tab, as shown in Figure 15-4. There are six command groups on this tab:
    Current Selection, Insert, Labels, Axes, Background, and Analysis.


    # Using Current Selection


    The Current Selection command group allows you to see which element of the chart
    is currently selected, and it gives you the ability to select and edit other elements
    instead.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# Chapter 15 Working with Charts as Design Elements


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_215_0.png)


    Figure 15-4 The Chart Tools Layout tab


    At the top of the command group is a drop-down box with a down arrow beside it.
    Click the down arrow, and the entire group of elements used in the chart will
    be shown. To select an element, just highlight it. For example, in Figure 15-5,
    you''ve selected Plot Area.


    Once an element has selected, you can change aspects of it by clicking Format
    Selection. The changeable aspects—such as Fill, Border Color, Shadow—will depend
    on the element you''ve chosen. Figure 15-6 shows the aspects available for the
    previously selected Plot Area element. Because the aspects are covered in several
    other chapters throughout this book, you won''t cover them here.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_215_1.png)


    If you make changes and then decide you don''t like them, you can start over by
    clicking Reset To Match Style. This resets the chart to the original theme style
    of the presentation.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_215_2.png)


    Figure 15-5 You can choose different elements to work with using the menu in the
    Current Selection group of the Chart Tools tab.


    Figure 15-6 Each chart element has various aspects that you can change.


    # Using the Insert Command Group


    The Insert command group doesn''t work the way you think it will when you''re
    working with charts. For example, if you select a chart element and insert a picture
    into it, you''ll be sorely disappointed because the picture simply won''t drop
    into the chart element.


    203'
