    # All About Borders


    To apply borders to your table, click the outside edge of the table and choose
    the Borders command and choose All Borders. If you need to change the border of
    a particular cell or group of cells, highlight the cells, and then select or deselect
    the border command (Inside, Outside, Top, Left, and so on). Figure 6-5 shows a
    table with some borders selected and others deselected.


