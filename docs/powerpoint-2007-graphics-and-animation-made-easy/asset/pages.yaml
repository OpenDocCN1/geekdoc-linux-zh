    Creating Layouts to Fit Your Content

    Layouts are everywhere these days. From MySpace pages to scraping to PowerPoint
    slides, the very layouts help you present information in a clear and direct fashion.
    In Chapter 1, we showed you how to access the built-in layouts offered by PowerPoint
    2007. Those layouts, however, are just the tip of the iceberg. In this section,
    we''ll show you how to create custom layouts to tell your story any way you want
    to.

    Remember, layouts help you drop in components of your slide''s content—don''t
    let them intimidate you. You need a graphic background to create eye-catching,
    informative-slide layouts. All you really need a bit of imagination and a willingness
    to try new ideas.

    PowerPoint gives you three different ways to create custom layouts.


    +   - You can use a blank slide and insert placeholders as needed.

    - You can use a built-in slide layout and move placeholders around desired.

    - You can add a layout to a slide master in Slide Master view and save the custom
    slide layout as explained in Chapter 1.


