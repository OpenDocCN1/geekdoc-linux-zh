    # # Comparing and Illustrating Content with SmartArt


    If you haven''t really used SmartArt yet, you''re going to be quite impressed
    by what it can do. If you have used it, then you know that it can make life substantially
    easier when designing a presentation. The beauty of SmartArt—a visual method for
    displaying your content—is that it turns simple text into dynamic graphics that
    are easy to read and understand. In particular, SmartArt lets you show concepts,
    processes, hierarchies, and other relationships in a visual way by providing preset
    graphics that you can simply drop your information into. You can customize both
    the look and layout of SmartArt and animate it as well.


    We''ll also show you how to work with charts, which are wonderful graphic elements
    that you can add to presentations in which you need to display numerical data.
    Charts aren''t quite as flexible as SmartArt, but you can still make them look
    professional using color and the Quick Styles Gallery.


    In this chapter, we''ll explain what SmartArt and charts entail and how they both
    work. You''ll learn'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'how to edit SmartArt, instantly change basic text into SmartArt, and perform
    a range of other tasks to make your SmartArt the coolest in town. Plus, you''ll
    discover how to change chart elements easily and apply a variety of elements to
    your charts to make them stand out from a graphic perspective.


    # SmartArt Overview


    SmartArt offers more than 80 different graphic layouts and can be used in PowerPoint
    2007, Word 2007, and Excel 2007. These 80 layouts are separated into seven groups:


    +   - List Use to display grouped, related, or even nonsequential information.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_134_0.png)


    +   - Process Use for showing sequential steps or subgroups.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_134_1.png)'
  merge: -1
  pgno: 134
- img_proc: true
  md: '+   * Cycle Use to show a continuing sequence of stages or relationships to
    a central idea.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_135_0.png)


    +   * Hierarchy Use to display groups of information and reporting relationships.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_135_1.png)


    # SMARTART VS. CHARTS


    You might think SmartArt simply duplicates the Chart function in PowerPoint, but
    these are truly two different types of tools. Whereas SmartArt helps you display
    information and ideas in a visual manner, charts help you illustrate numeric values
    or data if


    you''re trying to decide between the two, take a good look at the content you
    need to display. If it''s text-based, you''re probably better off with SmartArt.
    If it involves a lot of numbers, go with the Chart function.'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'Relationship Use to display information that overlaps or is somehow interrelated.
    This option is particularly good for showing comparisons.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_136_0.png)


    Matrix Use to show relationships of components to a whole.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_136_1.png)


    Pyramid Use to display proportional, interconnected, or hierarchical relationships.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_136_2.png)'
