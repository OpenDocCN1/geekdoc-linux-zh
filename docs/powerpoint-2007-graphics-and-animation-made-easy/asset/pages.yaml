    Pictures will increase the size of your PowerPoint 2007 file, so consider using
    the Compress Command in the Adjust group. This will save room on your hard drive
    and reduce download times, while maintaining picture quality. You can compress
    selected pictures or all of the pictures in the presentation. The compression
    default for PowerPoint 2007 is to compress pictures automatically when you save
    the presentation and to remove the cropped area of pictures automatically. To
    make changes to the default setting, select Compress in the Adjust group, select
    Options, and click the ones you want to change.


    # THE EASY WAY


    If you''re ever unhappy with your changes and want to start over again, click
    Reset Picture in the Adjust command group. This resets your picture to its original
