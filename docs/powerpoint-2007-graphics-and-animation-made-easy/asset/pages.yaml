  md: '# Creating Slide Layouts That Pop


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_13_0.png)


    PowerPoint 2007 is a terrific condensed tool to help others understand and remember
    information in a memorable way. Typically, PowerPoint presentations consist of
    slides that rely on a combination of words (text) and images (graphics and/or
    animations) to drive a home a point. The way you combine these elements creates
    the design (layout) of the slide. Layouts are crucial to making a slide understandable
    and unforgettable.


    By combining text and visual objects on a slide, you can reach nearly every member
    of an audience with your message. The trick to using PowerPoint graphics and animations
    effectively, however, is to place the objects on the slide in a pleasing manner.
    Too many objects on a single slide, for example, and the audience can lose the
    entire point you''re attempting to make. But a single object used properly will
    successfully capture an audience''s attention and drive home the information.


    In this chapter, we''ll take a look at some basic design concepts to help you
    lay out your text, graphics, and animations as effectively as possible. Understanding
    typography, design principles, and the basics of designing a layout set the foundation
    for creating powerful presentations using PowerPoint 2007.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Understanding Typography


    In its most basic form, typography is the art and technique of type design, characters,
    and arrangement. When we say type, we mean the text on your slide—type is how
    text on a page has been referred to for hundreds of years. The text should be
    on the page to produce a readable, articulate, and visually satisfying whole that
    makes it easy for readers to find what they want to read on a page.


    In the old days, setting typography was a very specialized occupation. Creating
    the text, designing the pages, and setting them for printing took special skill
    and knowledge. Text wasn''t just thrown onto a page; it was carefully set to emphasize
    certain stories or illustrations. That emphasis was thoughtfully designed to bring
    readers quickly to main points on a page and to lead them to other information
    on the same page. The goal, of course,


    to provide a memorable story so the reader could retain the information provided—just
    like you with a PowerPoint slide. Figure 1-1 shows an example of a 1949 newspaper
    page set by a typographer. The arrangement and appearance of the printed matter
    was carefully constructed to make a lasting impression upon the reader.


    See how the text (headline) is angled the reader''s attention with the most important
    stories (at least, according to the editor) in the largest size and lesser stories
    in smaller sizes? The layout isn''t funny, but it gets the point across Dinwiddie''s
    retirement and the unearthed of skeletons in a local river are the most important
    items for the reader to note, with blood bank and business profiles being less
    important. Your eye is drawn to the Dinwiddie and skeletal remains first and to
    the other stories next.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_14_0.png)


    Figure 1-1 The front page from the 1949 Loveland Round-up


    All too often, people forget that graphics and animations should be used to illustrate
    a point in a PowerPoint presentation. Often, that point is going to be'
