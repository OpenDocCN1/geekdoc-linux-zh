    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_16_0.png)


    # Applying Design Principles


    Think about the last magazine ad you read that really caught your eye. What was
    it about that had grabbed your attention? Maybe the text was so stunning that
    you couldn''t take your eyes off it. Or it might be the way that the entire ad
    put together... the ad simply drew you in, and you couldn''t read it. Whatever
    it was, the underlying element was a design that captured your attention long
    enough to deliver the advertiser''s message.


    Figure 1-4 Slide with text and simple, supporting graphics


    colors really appealed to you, or perhaps the image supporting the text was so
    stunning that the entire ad put together... the ad simply drew you in, and you
    couldn''t read it.


    As you''re working with graphics and animations in PowerPoint 2007, you''ll want
    to keep some basic design principles in mind. We''ve already addressed the concept
    of ensuring that your graphics and animations don''t overwhelm any text on the
    slide; the following design principles can help solidify the entire blueprint
    of the slide to help you truly deliver a powerful message to a viewer''s brain.


    # Create a Use for Your Design


    When you sit down to design a PowerPoint slide, think carefully about how the
    design will be used. Do you want to illustrate a point? Solve a problem for the
    reader? Inspire action? Don''t confuse the design you''re doing with art—art is
    personal expression. Design, however, is about getting people to use the information
    you''re providing.


    Typography Workbook: A Real-World Guide to Using Type in Graphic Design, by Timothy
    Samara, Rockport Publishers, 2006.


    Ask yourself: Does this work well? Does this


    Link'
