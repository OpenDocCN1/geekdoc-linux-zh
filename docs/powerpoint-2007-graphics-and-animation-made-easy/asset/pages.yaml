- img_proc: true
  md: '# Getting Started with WordArt


    To get to WordArt, follow these steps:


    +   1. Click the Insert tab.


    +   2. Go to the Text group and select the WordArt command.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_102_0.png)


    Your WordArt will appear like what''s shown in Figure 7-1. From here, you can
    type in your message and customize your text


    +   - Text Fill Lets you fill the text with a solid color, gradient, texture,
    or picture.


    +   - Text Outline Lets you define the text with the color, width, and style of
    line for the outline.


    # A WORD ON WORDS


    WordArt is simply designed to make your words memorable, but starting with strong,
    active verbs is the best way to make your presentation pop off the page. Active
    verbs take charge of the situation—or the slide—by giving the subject of your
    sentence the action directly. Look at this sentence:


    > The ball was thrown by the quarterback. This sentence is passive, showing the
    ball being thrown. Although this is a perfectly acceptable sentence, it''s not
    the most powerful way to tell your story quickly on a slide. Now look at this
    sentence:


    The quarterback threw the ball. This sentence shows the subject actively performing
    the action. The sentence is also shorter and takes less time to read. It helps
    your storyline along getting to the point quickly and effectively. Every time
    you write a headline on a slide, or without WordArt, check your verb to make sure
    you use the active tense. This evaluation can make a significant difference in
    getting your point across with more pizzazz. Now, enough of the English lesson.'
  merge: -1
  pgno: 102
