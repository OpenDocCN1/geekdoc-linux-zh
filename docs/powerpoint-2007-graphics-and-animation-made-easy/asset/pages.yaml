  md: '![](img/bf2a856bcd8fc3e8384ecc7137df5347_216_0.png)


    **Figure 15-7** You can insert pictures in chart elements, but you''ll need to
    use the Current Selection group insert instead of the Insert group.


    This command group is really—as far as we can tell—designed to help you drop in
    pictures, shapes, and text onto the slide without having to return to the Insert
    tab. If you want to make a chart element as a picture, as in Figure 15-7, select
    the chart element and then go to the Current Selection command group and select
    Format Selection | Fill | Picture Or Texture Fill | Insert From File. Select the
    picture you want from your hard drive, and click Close.


    # Working with Labels


    Some chart layouts will automatically provide you with a variety of chart labels,
    as a title or a legend. Others won''t. You can change or add chart labels using
    the Labels command. Most label options typically allow you to select from an even
    larger menu to truly customize the label; look for the More XX Options selection
    at the bottom of each label menu.


    +   - **Chart Title** Lets you add a title without moving or resizing the chart
    (Centered Overlay Title) or simply add a title to the chart, resizing and moving
    the chart as necessary (Above Chart).'
