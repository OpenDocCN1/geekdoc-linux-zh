  md: '![](img/bf2a856bcd8fc3e8384ecc7137df5347_119_0.png)


    # Creating Effective Shapes


    Shapes in PowerPoint 2007 lend themselves to a number of uses for work and play.
    Whether you need shapes for a flow chart or you simply want to show off the “star”
    of your family, shapes are a great way to highlight important points, people,
    and objects in your presentation.


    PowerPoint 2007''s ready-made shapes are the perfect start for using shapes, but
    you can also customize a shape to suit your needs. In this chapter, you''ll learn
    when to use shapes, how to add fill, outlines, and effects to shapes, and how
    to add text to a shape to give your message more punch. You''ll also learn how
    to edit a shape or create your own for those special messages that need a little
    more zing.'
