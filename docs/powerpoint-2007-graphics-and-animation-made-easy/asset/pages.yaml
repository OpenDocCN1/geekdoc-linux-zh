    Need handouts for your presentation in a hurry? PowerPoint 2007 offers you a quick
    way to create handouts so audience members can follow along with you, take notes,
    or simply have a source of information to refer to after the presentation. From
    your presentation, click the Microsoft Office button, and select Create Handouts
    In Microsoft Office Word. From the Send To Microsoft Office Word


    dialog box, select the layout you want or click Paste Link to link to the presentation.
    Paste Link ensures that any updates to the PowerPoint 2007 presentation appear
    in the Word document. Click OK after you make a selection and print the handouts
    from your Word document. Remember to keep your presentation in the same folder
    as your Word document so the links work properly.'
