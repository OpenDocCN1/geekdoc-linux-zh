  md: '# Illustrating with Pictures


    Using photographs is easy in PowerPoint 2007. Once you discover the simplicity
    of inserting pictures and creating unique looks for each of them, you''ll enjoy
    exploring your creativity. From setting the mood to highlighting a funny moment,
    PowerPoint 2007 makes the experience come alive for the first time whether you''re
    viewing pictures that mean a lot to you, or revisiting pictures. You''ll learn
    more about creating photo albums in Chapter 4. For now, let''s focus on the pictures
    themselves.


    In this chapter, you''ll learn how to adjust pictures and add special effects
    to create different moods and presentations. You''ll also discover how to use
    picture styles and shapes to tell an interesting story, as well as how cropping,
    sizing, and framing your picture can highlight specific details of your story.


    One of the fastest ways to become proficient in PowerPoint 2007 is to experiment
    with the many styles, special effects, and animations available. As you read through
    this book, remember that PowerPoint doesn''t always have to be used in a business
    setting. Take a few minutes with each section to discover how to make PowerPoint
    2007 presentations that are fun to create and will impress friends and family
    members.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_39_0.png)'
