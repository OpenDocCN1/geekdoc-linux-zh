    # Exploring Layout Concepts


    Now that you know about typography and the concept of keeping text easy-to-read,
    and you''ve learned a few basic design principles, it''s time to take a look at
    actual layout concepts. When


    Figure 1-8 Example of white space on a slide


    you''re designing a slide, layout refers to the way that you put all the elements
    together. The idea, of course, is to put both text and graphic elements into a
    layout that is visually pleasing and simple to read.


    There are many different ways to create layouts as there are people, so do not
    feel as if there is a perfect way to create a slide layout. However, layouts are
    nice and simple to use whereas require lots of time and effort. To create a slide
    layout, you will be using placeholders for text, clip art, photos, and other objects.


    As insert each placeholder, think carefully about its location on the slide. Although
    you can change a placeholder''s location at any time by clicking its border and
    dragging it to another location, you take the time up front to think about design
    principles, then you''ll save yourself time down the line.


    Any PowerPoint slide layout can include any or all of the following elements:


    +   * Title placeholder

    * Subtitle placeholder

    * Headers and footers


