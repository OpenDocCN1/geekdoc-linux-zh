    # Rotating and Flipping WordArt


    By now, you''ve learned a lot about rotating WordArt; however, in addition to
    setting WordArt on its side, the Rotate command lets you flip WordArt upside down.
    Select Rotate | Flip Vertical. Like the effect? No worries. If you don''t like
    it, simply select Rotate | Flip Horizontal to return your WordArt to your original
    position.


    You can access the Size And Position dialog box you learned about in Chapter 3
    by clicking More Rotation Options.


    So, what''s the most effective way to use WordArt? Sparingly. A little Word-Art
    goes a long way, so use it only when you need to make a powerful point that you
    want your audience to remember.


    In this chapter, you learned how to add fills, outlines, and effects to WordArt.
    You were also introduced to the Format Text Effects dialog box, you can perform
    a number of actions to refine and customize your WordArt. And using the Align,
    Rotate, and Flip commands give you more control over WordArt. You were also introduced
    to Shape Styles, which you''ll learn more in Chapter 8.'
