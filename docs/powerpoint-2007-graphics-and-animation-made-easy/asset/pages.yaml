- img_proc: true
  md: '# MEMO


    # Performance Considerations


    When selecting a picture to use for the background, be careful not to use something
    that competes with the movie. In Figure 1-2, the background photo has lighter,
    more subtle features, which makes it easier to adjust in grayscale. This type
    of image is better than a close up of an image with bold, well-defined lines that
    would detract from, not complement, the movie.


    When using movies in a PowerPoint 2007 presentation, remember that too much activity
    on a slide can completely halt the movie''s ability to play. By using a number
    of movies or animated clip art items can increase your presentation file size,
    which could lead to performance issues as well. To improve your presentation''s
    performance:


    +   1. Go to the Slide Show tab.

    2. In the Monitors group, click the down arrow in the Resolution field.

    3. Select 640x480 (Fastest, Lowest Fidelity).


    This option speeds up the performance while lowering the fidelity of the presentation.
    You will need to run the slide show in its entirety to see how clarity is affected.
    If the change is too dramatic, you can select the Use Current Resolution option
    or try the other options: the 1024x768 (Slowest, Highest Fidelity), which offers
    a crisp image but slows down the performance, or the 800x600 option, which is
    the “middle ground” between the two options.


    As a reminder, if you''re sending the presentation via email, be sure to zip or
    compress it before sending to ensure it goes through as fast as possible.


    In this chapter, you learned about when to consider movies as an option in your
    presentation, along with compatible file formats and conversion options. You also
    learned how to insert a movie or animated GIF into your presentation. You also
    saw two examples of using animated clip art with a movie or a picture as a background
    to the movie. In the next chapter, you''ll learn about many ways to use sound
    to enhance your presentation even more.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# Adding Sound To Your Presentation


    Like movies, sound can also add some life to your presentation. Whether you''re
    trying to establish a mood, offer a narration, or simply drive home an important
    point, sound can give some sizzle to the steak. In this chapter, you''ll learn
    how to insert sound files, how to start and stop the sounds, and how to set up
    objects and text to trigger the sounds. You''ll also learn how to add CDs and
    record a narration.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_161_0.png)'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# When Sound Is Appropriate


    Sound is wonderful when you''re using it to help you make a point. But how many
    websites you have clicked on only to be greeted with blaring sound because you
    forgot to turn down the volume? Startling, isn''t it?

    That''s why prudent with sound is your best bet. If you''re unveiling something
    new and different, a drum roll is appropriate. If you''ve achieved a significant
    company goal or objective, a little applause is in order. Or if you want some
    soothing background music during your presentation, sound can de the trick in
    communicating your message.


    The bottom line is to use sound for specific reasons to enhance your presentation
    and make your messages memorable.


    # Supported Sound File Formats


    PowerPoint 2007 supports the following file formats:


    +   - AIFF audio file Audio Interchange File Format (.aiff)

    - AU audio file Unix Audio (.au)

    - MIDI file Musical Instrument Digital Interface (.mid or .midi)

    - MP3 audio file MPEG Layer 3 (.mp3)

    - Windows audio file Wave Form (.wav)

    - Windows Media audio file Windows Media Audio (.wma)


    If your sound file is not in one of these formats, it will not play in PowerPoint-2007.
    However, you can convert it to one of these formats using a utility program, or
    add-in such as:


    +   - Microsoft Windows Media Encoder, a free program that makes files compatible
    with PowerPoint 2007. Visit http://www.microsoft.com/windows/windowsmedia/forpros/encoder/default.mspx
    for more information.'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'PFCMedia, an add-in that automates the formatting of multimedia. For more information,
    visit PFCMedia for PowerPoint at http://office.microsoft.com/en-us/marketplace/EM01213296132.aspx.


    When using sound files, you should note the difference between embedded and linked
    files, especially if you need to make changes. *Embedded* files are stored in
    the presentation file, whereas *linked* files are stored in their own files outside
    the presentation file. Here is information to help you determine when to use an
    embedded file or a linked file. You can use the Package For CD option to make
    it easier: Click the Microsoft Office icon and then Publish | Package For CD.
    You can copy the file to a folder or to a CD. The linked files are included as
    the default setting.


