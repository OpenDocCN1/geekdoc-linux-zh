- img_proc: true
  md: '# Adding a Movie to Your Presentation


    Movies in PowerPoint 2007 can really spice spice available to your presentation.
    With all the technology available to us today, why not use it to your advantage?
    This chapter on movies, along with the next chapter on sound, will keep all eyes—and
    ears—on your presentation. The more ways you present the information, the better
    chance your audience will comprehend and remember it.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_151_0.png)'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# How Movies Can Benefit a Presentation


    If you''ve been anywhere on the Internet, you''ll know that movies have become
    commonplace in our lives. Type video clips into your search engine and you''ll
    get an amazing array of results. You can easily see how people use videos to make
    others laugh or cry. Even if only motivated to find their fame and fortune through
    venues like YouTube, today''s population is comfortable watching movies in a variety
    of venues beyond the movie theater.


    Adding movies to your presentation may not help you achieve your own fame and
    fortune, but it can mean you''ve got your audience''s undivided attention in a
    world where messages are consistently coming at us. Including a movie in your
    presentation means you''ve taken your presentation to the next level—the entertainment
    level. And let''s face it: All audiences want to be entertained. So if you can
    add some pizzazz with a movie, go for it!


    Again, we remind you about what you learned in Chapter 1: Less is more. Focus
    your movie in an area where you really want to highlight a specific idea or storyline.
    Don''t add movies just because they''re fun—even though they are! Add movies to
    make your point in a stronger, more inviting way.


    # Supported Movie File Formats


    Before we get to movie specifics, let''s look at the movie file formats supported
    by PowerPoint 2007. You can insert these file formats into your presentation:


    +   * Windows Media file (.asf)

    * Windows Video file (.avi)

    * Movie file (.mpg or .mpeg)

    * Windows Media Video file (.wmv)


    If your movie is not in one of these formats, it will not play in PowerPoint 2007.
    However, you can convert it to one of these formats using a utility, program,
    or add-in. Try one of these:'
  merge: -1
  pgno: 152
- img_proc: true
  md: '+   1. Microsoft Windows Media Encoder A free program that makes files compatible
    with PowerPoint 2007. Visit http://www.microsoft.com/windows/windowsmedia/forpros/encoder/default.mspx
    for more information.


    +   2. PFCMedia An add-in that automates the formatting of multimedia. For more
    information, visit PFCMedia for PowerPoint at http://officemicrosoft.com/en-us/marketplace/EM0123296133.aspx


    # # Inserting a Movie from a File


    PowerPoint 2007 makes it easy to insert a movie that is in the correct file format.


    +   1. Go to the Insert tab.


    +   2. In the Media Clip group, select Movie.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_153_0.png)


    # # HOW MOVIES WORK WITHIN YOUR PRESENTATION


    An item to remember when you''re inserting movies into PowerPoint 2007: Movies
    are not embedded into the presentation itself. This means that you should always
    copy your movies into the same folder as your presentation so PowerPoint 2007
    can link to and find them. Even if you move the folder to another computer, you
    will still have your movies and presentation together. If you have problems running
    your movie, your first step will be to confirm both


    of these items are in the same folder. One way to make sure all the items are
    in one folder is to use the Package for CD option. Microsoft Office | Publish
    | Package for CD. From here, you can copy to a folder or CD, and when you click
    Options, you can choose how to package the presentation, whether to include linked
    files (which you''ll want to do when running a movie) or embedded TrueType fonts,
    and to include a password in order to run the presentation.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# PowerPoint 2007 Graphics and Animation Made Easy


    +   3. Click Movie From File.

    4. Select the movie you want to insert into the presentation.

    5. Click OK.


    You can also double-click the movie file to insert it into your presentation.

    You''ll see a Microsoft PowerPoint dialog box that asks you when you like to have
    the movie play. Your options are


    +   * Automatically This option means your movie plays when the slide displays.
    By using other media effects like animation, the movie will play after the animation.
    You can pause the movie by clicking it; restart it by clicking again.


    +   * When Clicked This option means your movie will play when you click it. This
    is also known as a trigger.


    +   * Play Across Slides This option plays the movie for the length of the movie
    file one time. It does not play the movie more than once. (To play the movie continuously,
    check the Loop Until Stopped checkbox in the Movie Options group.)


    # THE EASY WAY


    Want to be sure your movie plays for the entire presentation? From the Animations
    group, select Custom Animations. In the Play Movie dialog box, enter the 999 in
    the After field. This number appears as the default and is the maximum number
    you can enter. By doing this, you won''t have to adjust the value if you add or
    delete slides in the presentation.


    You can make changes to these options later, depending on how you want the movie
    to play. If you select the Play Across Slides option, you will need to go to the
    Animations tab. From the Animations group, go to the Animation | Custom Animation
    Pane. Click the line with the triangle, and then click the down arrow and choose
    Effect Options. You''ll see the Play Movie dialog box.


