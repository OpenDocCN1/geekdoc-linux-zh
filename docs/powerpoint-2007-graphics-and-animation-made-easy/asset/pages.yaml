  md: '# PowerPoint 2007 Graphics and Animation Made Easy


    corner of the Movie Options group. You''ll see the Movie Options dialog box that
    lets you adjust your movie according to your needs, along with checking the total
    movie playing time.


    We''ll explore the Arrange group commands later in this chapter, but let''s take
    a brief look at the Size group. As you learned in Chapter 3, the Size group lets
    you change the size of your picture or movie on the slide. You can make changes
    directly in the Size group, or if you click the arrow in the bottom-right corner
    of the log, you''ll see the Size And Position dialog box. You can size, scale,
    crop, or reset your picture to its original size. The Position tab lets you select
    where you want the picture on the slide.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_156_0.png)


    # MEMO


    When your movie is highlighted on the slide, you''ll see that the Picture Tools
    Format tab is available. This toolbar offers you the options you learned about
    Chapter 3. Although you can format how the movie displays on the slide when it''s
    not playing in any way you want, the shape of the picture will move to the background
    when the movie plays and the movie will revert to its original shape. When finished
    playing, the movie will return to the shape of the picture.


    # Inserting a Clip Movie


    You can also insert a clip movie, which is actually an animated GIF file and not
    really a movie. Instead, the file is a number of images that stream to create
    an animated effect.


    +   1. Go to the Insert tab.

    2. In the Media Clip group, select Movie.

    3. Click Movie From Clip Art Pane.


    The Clip Art pane will appear. This pane will be similar to the one you learned
    about Chapter 5, but you''ll be reviewing animated GIFs instead of still clip
    art. (This is because you inserted a Movie From Clip Organizer instead of the
    Clip Art command in the Illustrations group.)'
