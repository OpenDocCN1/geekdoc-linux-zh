    # # Think in Simple Terms


    Often, the simplest design is the one that works best. Think of the wheel, for
    instance: a simple circle, improved upon with different types of materials for
    different types of requirements, but at the core, always a simple circle.


    You don''t always need to break down your slide into the simplest common denominator,
    but you should take a look at your design and ask, "What can I remove without
    losing effectiveness?


    As you design your slides, thoughtfully consider what should be kept—and what
    can be tossed. If you''re always watching for those elements that distract from
    the audience experience, your designs will always be simple and easy for the audience
    to understand and retain.


    # # Play with Visual Balance


    If you carry a 20 pound backpack on your right shoulder for a mile, chances


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_18_0.png)


    you will eventually want to shift backpack to the other shoulder. Maybe you''ll
    want to shift the backpack so both shoulders are carrying the load instead of
    walking with one side of your body off-balance.


    When you design a slide, visual balance is often used—elements on the slide are
    arranged so that no single portion of the slide is too heavy or too light. Sometimes,
    however, you can drive home a point by purposely playing with the concept of balance.
    If you place a variety of elements in the lower-right corner of a slide, for example,
    the viewer''s eye will be drawn to that


    Figure 1-5 An example of horizontal balance


    portion of the slide. Figures 1-5 through 1-7 show some examples of how you can
    play with balance on PowerPoint slides.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'The point here is to allow yourself some leeway in your design. Try not to
    trap yourself into using the visual balance on every slide—your audience will
    be intrigued by minor variations from slide to slide. Using the same exact visual
    balance on every slide can cause boredom and create wandering eyes.


    # Use White Space, Don''t Ignore It


    When you''re designing layouts, any blank space on the slide is called *white
    space*. Don''t confuse white space with any colors you might have on the slide;
    *white space* is the term that refers only to empty space ... not a particular
    color.


    Although white space makes people nervous, it''s actually a good thing because
    it provides the reader''s eye with a bit of a break as she views the slide. If
    you''re the type of person who thinks every square inch on a slide needs to be
    filled, take a deep breath and remind yourself that white space is okay. Resist
    the urge to fill every spot on the slide, and your readers will thank you for
    it. In Figure 1-8, there is white space between each line of text and plenty of
    white surrounding the graphics as well. White space, by the way, isn''t always
    colored white. The term is used to denote blank space


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_19_0.png)


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_19_1.png)


    Link The Elements of Graphic Design: Space, Unity, Page Architecture, and Type,
    by Alexander Allworth Press, 2002.'
