    # MEMO


    If the Word document is in plain text and has no heading styles, PowerPoint will
    create an outline based on paragraphs created by hard returns when you press ENTER.
    For example, each item in a bulleted list is a paragraph and a title or subtitle
    is a paragraph.


    Selecting Embed Only The Characters Used In The Presentation helps to reduce file
    size. Clicking Embed All Characters makes it easier if others are editing your
    presentation.


    If you need to create a PowerPoint presentation based on an outline in a Word
    document, you can insert the outline directly in PowerPoint with a few mouse clicks.
    The Word formats you use are


    +   * .doc (Microsoft Word 97–2003)

    * .docx (Microsoft Word 2007)

    * .txt (Text file)

    * .rtf (Rich text format)'
