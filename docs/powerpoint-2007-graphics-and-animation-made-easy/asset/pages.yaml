  md: '# Chapter 11 Adding Sound to Your Presentation


    The sound icon will appear on the slide.

    In this chapter, you learned when to consider adding sound to your presentation,
    how to insert and adjust sound files, how to set up text and objects to trigger
    the sound, and how to use CDs and narrations to enhance your presentation. We
    briefly touched on animations in this chapter, but in the next chapter, you''ll
    learn about animations in more detail.


    # HOW DOES YOUR VOICE SOUND?


    When you''re recording a narration, be aware of how your voice sounds. For example,
    if you''re reading directly from a script, rephrase it a few times so you sound
    more natural instead of like you''re reading.

    Do you have a tendency to sound monotone? Look closely at where you''re reading
    and saying and find spots where you can offer a bit of inflection to make it interesting
    for the listener. The rise and fall of your voice can make the difference in whether
    you excite or bore the listener.

    Are you enunciating? Wake up that lazy tongue so it doesn''t list in the back
    of your throat or say hello-o-o-o lips that don''t open fully. Practice over-enunciating
    this phrase a few times to get your mouth warmed up: "The lips, the teeth, and
    the tip of the tongue." Over-enunciating may seem strange when you


    rehearse, but once you begin recording, you''ll fall into an easy and understandable
    rhythm that sounds natural.

    Does your voice have a tendency to go into the upper regions where only dogs can
    hear? Then keeping your voice in the lower ranges and record yourself as you practice.
    This way, you''ll know what sounds to the ear.

    No matter what voice issue is, you can improve it with concentrated practice and
    by recording yourself regularly. If you''re serious about making a change, hire
    a vocal coach who specializes in the word. Or many times, your local college or
    university; many times, an abbreviated class may be open to non-students during
    the semester.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_173_0.png)'
