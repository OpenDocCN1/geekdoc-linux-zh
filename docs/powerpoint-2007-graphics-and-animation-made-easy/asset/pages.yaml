- img_proc: true
  md: '# Animating with SmartArt


    All right, so now we get to the true fun of SmartArt: animation. Although we''ll
    explain animation in more detail in Chapter 12, we''ll show you a few things you
    can do with SmartArt right now. You can animate SmartArt just like you would almost
    any other object, but here are a few caveats:


    +   - First, the order in which the shapes appear in your SmartArt will dictate
    the order in which the animation plays. You can''t pick and choose which shapes
    will animate at a particular time, although you can, of course, reverse your entire
    SmartArt graphic to animate it if you like.


    +   - Second, treat each SmartArt graphic as the unique item it is. Animations
    will occur in different ways given the type of SmartArt involved, so we can''t
    possibly explain all the different combinations in a few paragraphs. When you
    begin animating SmartArt, allow yourself some extra time to play around. But don''t
    try to figure it all out when you''ve got a heavy deadline for your presentation.


    +   - Third, connecting lines between Smart shapes will not animate individually—they
    always associate with the second shape. Don''t bother trying to change it; you
    will just waste a lot of precious time on something that can''t be done.


    +   - Finally, use caution when you''re working with diagrams created in earlier
    versions of PowerPoint. If those diagrams are converted to SmartArt and animation
    is applied, the animation might get funky. You can try—it does work sometimes—but
    if you start having trouble, we recommend just starting from scratch or ditching
    the animation for that particular object.'
  merge: -1
