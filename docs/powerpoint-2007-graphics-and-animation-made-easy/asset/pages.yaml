  md: '# THE EASY WAY


    Want an even faster way to rotate WordArt? When the WordArt box is selected, the
    green dot at the top of the text box to rotate the text to the angle like. As
    you see in Figure 7-17, simply put your cursor over the dot. Turn to the right
    or left until you have the desired angle and release the cursor.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_113_0.png)


    Figure 7-17 WordArt rotation using the text box


    The Presets in the Format Text Effects also has a variety of rotations to choose
    from. In the Text section, select Keep Flat to flatten out your text, removing
    the 3D formatting. The Object Position | Distance From Ground command moves rotated
    WordArt to the left or right.


    # The Text Box Command


    You can make a number of changes to your text box using the Text Box command options
    in the Format Text Effect dialog box. In the Text Layout section, you can adjust
    where the WordArt falls inside the text box or rotate the WordArt so it appears
    sideways or stacked, depending on your needs.


    In the Autofit section, you can choose whether to resize the shape of the text
    box, or whether you need to apply Autofit to your text all. The Internal Margin
    section lets you decide the distance between the WordArt and the edges of the
    text box. It also lets you decide if you want to wrap text or put into columns.
    Let''s take a moment to look at this section from within the Format Text Effects
    dialog:


    +   1. Select your WordArt.

    2. Click the arrow in the bottom-right corner of the WordArt Styles group on the
    Drawing Tools tab.

    3. In the Format Text Effects dialog box, select the Text Box option.

    4. In the Text Layout section, select Middle for Vertical Alignment.

    5. In the Text Direction field, select Rotate All Text 90 Degrees.'
