  md: '# THE EASY WAY


    # Using Picture Styles and Shapes


    Preset gives you a way to instantly change your picture with default settings.
    From the Picture Format tab to Picture Styles | Picture Effects | Preset, from
    the drop-down menu, you can click a preset (try Preset 11 as an example), and
    your picture will automatically change to reflect this setting. This is the quickest
