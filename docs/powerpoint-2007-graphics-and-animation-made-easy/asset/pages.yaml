    # WHICH TYPES OF LEARNERS ARE IN YOUR AUDIENCE?


    Everyone learns differently. Some prefer to read information to absorb it, whereas
    others want to see the action in a visual format to retain it. In fact, seven
    primary learning-style types have been identified:


    +   * Visual Prefers learning with images, pictures, colors, and maps. SmartArt,
    relevant pictures, and other graphics work well for these people.

    * Aural Learns most easily by working with sounds and music. Using sounds in your
    person''s presentation can capture this person''s attention.

    * Verbal Learns equally well with written and spoken words. This person will do
    with bulleted text and nothing else on the slide.

    * Physical Learns best using the body or sense of touch to explore concepts. The
    people are the ones who can''t sit still during your presentation!


    +   * Logical Understand patterns, numbers, and connections well. These people
    tend to like charts and SmartArt.

    * Social Learns by bouncing off other people and working in groups. This person
    might come up to you after the presentation to make comments or ask for more information.

    * Solitary Learns through independent and deep analysis, which makes this person
    a tough sell using a group presentation. A solution is to offer this person the
    presentation to review on his own so he can review it at his leisure.


    When you present to an audience, no matter how small, remember that all types
    of learners might be present. Use a combination of graphics, animations, text,
    and to highlight key points; just be sure not to overwhelm your audience by placing
    all these items on the same slide!'
