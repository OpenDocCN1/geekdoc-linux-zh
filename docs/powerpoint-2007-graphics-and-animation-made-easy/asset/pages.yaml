    Have you ever seen a picture that stopped you in your tracks? Maybe it took your
    breath away or touched you. Or maybe it made you stop for a moment and chuckle.
    Although a picture itself can tell a story, the way the picture is presented can
    produce a dramatic effect. This section helps you better understand the difference
    a picture style or shape can make in telling your story pictures. Getting your
    message across visually can catch your audience in a way that words, spoken or
    written, cannot. PowerPoint 2007 gives you all the tools you need to stylize designs
    that turn everyday pictures into art.


    # Using the Picture Styles Gallery


    With the Picture Styles gallery, you can instantly frame your pictures using one
    of 23 different options, from soft or beveled edges to a thick, black frame. Let''s
    look at few options:


    +   - From the Picture Tools toolbar, click the scroll bar to the right of the
    Picture Styles command.


    +   - Hover your mouse over the different styles to see what each looks like.


    +   - Click to select the style you want to use.


    In Figure 3-6, we select Moderate Frame, White to outline the photo and bring
    attention to it. In Figure 3-7, the choice of Compound Frame, Black outlines the
    photo but gives it a more classic, stated effect. In Figure 3-8, selecting Soft
    Oval toned down the picture while giving it a beautiful effect.


    # MEMO


    To use the Picture Effects command, you''ll need to experiment with varying border
    thicknesses. Some of the effects need thicker borders to be visible, whereas others
    look more attractive with a thinner border. From the Picture Styles group, select
    Picture Borders. Click Weight and hover your mouse over the different line weights.
    Live Preview shows you the border weight. Then select the line weight you prefer.'
