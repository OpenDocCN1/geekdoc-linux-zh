    # THE WHITE SPACE SHAPES YOUR WORLD


    Shapes help us define our world. One of our exercises in early childhood was fitting
    the piece of the puzzle into the round hole, the square into the square hole,
    and so on.

    Artists are experts who see the world with a perspective that''s a little different
    than the rest of us. When they draw, they don''t simply draw the shape''s actual
    lines and curves. They focus on the shape''s lines, curves, shadows, and white
    space.

    For instance, when an artist draws a face, at the points where the light falls.
    Most portraits do


    not usual lines to define the lips, nose, and eyes. If you look closely, you''ll
