    # Editing a Shape from the Edit Shape Command


    The Edit Shape command lets you change a shape or turn it into a freeform shape.
    A freeform shape has curved and straight segments you can adjust. You''ll find
    the command in the Insert Shapes group.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_128_0.png)


    +   1. From the Insert Shapes group, click the Explosion 2 shape, the second shape
    in the Stars And Banners section.


    +   2. Select the Edit Shape command and then Convert To Freeform.


    +   3. Select the Edit Shape command again.


    +   4. Click Edit Points.


    In Figure 8-9, you see a number of points on the shape. From here, you can adjust
    the shape by dragging the points where you like. Figure 8-10 shows how a freeform
    shape can be reshaped and resized by dragging a few of the points.


    To change a shape from the Edit Shape command, simply click the shape and select
    Edit Shape | Change Shape and select the new shape.


    Use the Reroute Connectors command when you have a flow chart or diagram where
    two or more connectors connect the same two objects. This command moves all the
    lines they connect at the same points in the most direct way. If you want to reroute
    only one line, select the line before clicking Reroute Connectors.


    # MEMO


    When dragging points in a freeform shape like those in Figure 8-9, be careful
    to pull in a straight line or your shape could have twisted points that make the
    shape uneven and unbalanced.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_128_1.png)


    Figure 8-9 Editing points in a freeform shape'
