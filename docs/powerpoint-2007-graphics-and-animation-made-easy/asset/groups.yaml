    # 备忘


    只有矢量图形可以被轻松操作。大多数剪贴图（clip art）都是矢量图形，它们使用线条、曲线和形状分层构建；而扫描进计算机的照片和剪贴图通常不是。如果你在操作图形时遇到困难，可能是因为它不是矢量图形，无法进行操作。然而，大多数下载的剪贴图并没有以矢量格式保存。微软剪贴图可以操作，但除非网站特别说明，否则通常你无法调整来自网站的剪贴图。


    - 3. 选择我的选择。

    - 4. 找到剪贴图然后点击添加。


    # 操作剪贴图


    一旦你获得了所需的剪贴图，你可能发现它需要一些微调。例如，你可能找到了一个完美的猫插图，但那只猫是奇怪的绿色，而你更喜欢黑猫。在本节中，我们将向你展示如何通过不同的方式操作剪贴图，以获得你完全所需的剪贴图。


    大多数情况下，在操作剪贴图之前，你可能需要将其分层。这是因为大多数剪贴图包含多种颜色和图像，它们被组合在一个场景中，以创建最终的剪贴图。例如，在图 5-4
    中，排球运动员后面的天空是浅蓝色的。如果你想将天空改为深蓝色，必须取消整个图形的分组，以便选择包含天空的部分。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_79_0.png)


    图 5-4 背景为浅蓝色天空的排球场景


    注意，如果你不在快捷菜单中编辑“图片”，你的对象将无法转换为 Microsoft Office 绘制对象。要取消分组，请按照以下步骤操作：


    - 1. 右键点击图形。

    - 2. 从快捷菜单中点击编辑图片。如果你看到警告说图形是导入图片而不是组，点击“是”将其转换为 Microsoft Office 绘制对象。

    - 3. 再次右键点击图形。


    > 链接：《Clip Art Book: A Compilation of More Than 5,000 Illustrations and Designs》，Gerard
    Quinn 著，1992年。


    - 4. 选择组合 | 取消组合。图形显示应与此处显示的相似。

    - 5. 点击图形外部以减少你图形中所有的分组杂乱。

    - 6. 现在，选择你想更改的图形部分并按需要更改。


    在我们的示例中，我们将更改图形的天空颜色，因此选择了图形的天空部分。剪贴图颜色的步骤在下一节中。


    # 更改图形部分的颜色


    要更改图形某些部分的颜色，请遵循以下步骤：


    - 1. 选择需要更改颜色的图形部分。

    - 2. 转到绘图工具格式选项卡。点击“形状填充”。

    - 3. 从提供的调色板中选择新颜色（主题、标准颜色或最近颜色）。


    图形将反映你选择的颜色。图 5-5 显示现在的天空比图 5-4 中的天空要深得多；这是因为我们对天空应用了新的深蓝色。


    # 整个图形的外观和感觉


    如果你喜欢更改整个图形的外观，并且不想或不需要操作它的部分，那么这样做就非常简单。在取消分组之前，你可以为图形更改整体颜色、添加 3D 旋转、背景填充等。虽然这种方法不允许你对图形的局部应用更改，但它为为你的演示文稿创建一个独特的图形提供了一个选项。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_80_0.png)

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_80_1.png)


    要更改图形的整体外观，请遵循以下步骤：


    - 右键点击图形。

    - 从快捷菜单中选择“设置图片”。


    将出现设置图片对话框，左窗格已选择“图片”，如图 5-6 所示。


    在左窗格中，你会发现许多其他选项。当你选择不同的选项时，右窗格将根据所选项目发生变化。我们将简要回顾每个选项，以便理解可以实现什么；我们建议尝试每个选项，这样你就可以看到图形的微调如何产生巨大差异。


    # 图片


    选中“图片”选项后，你可以为图形重色、更改其亮度或对比度，或将图形恢复原始外观。


    - 点击“重色”按钮从预设颜色变体中选择。

    - 滑动滑块或使用上下箭头更改亮度和对比度。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_81_0.png)


    图 5-5 背景为深蓝色天空的排球场景


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_81_1.png)


    图 5-6 设置图片对话框允许你对图形进行多次更改。


    备忘

    当你完成更改后，点击设置图片对话框中的“关闭”，更改将应用到你的图形。


    # 填充


    此选项允许你在图形中添加或更改背景颜色。


    - 选择“无填充”移除背景。

    - 选择“实色填充”从颜色列表中选择。你可以通过滑动滑块或使用上下箭头更改颜色。

    - 选择“渐变填充”从各种渐变颜色、类型和方向中选择。选择“纹理填充”为你的图形添加图片。你可以从手机中获取内容。取消选择“图片作为纹理”使你的图形与幻灯片无缝融合。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_82_0.png)


    # 线颜色


    你可以使用此选项为图形添加实线或渐变线，以及更改颜色和透明度。


    # 线样式


    当你向图形添加线条时，可以使用此选项管理宽度、类型和样式。尝试端点和连接类型以修改边缘或角的观。


    # 阴影


    想让你的图形带有阴影吗？选择此选项，从预设选项中选择，或使用透明度、大小、模糊和距离功能自定义阴影。一种让阴影突出的方法：使用颜色混合。


    # 3D 格式


    当你对图形应用 3D 格式时，它可以让图形从页面跳出来。此选项在处理卡通时非常棒，但如果你在寻找让图形突出的方法，也可以尝试。选中“3D 格式”，你可以从倒斜、深度、轮廓和材质选项中进行选择。


