    # INTRODUCING PRESENTER VIEW


    One of the most helpful features in PowerPoint 2007 is Present View. This feature
    allows you to use monitors as you present the presentation as a slide show: One
    monitor displays the presentation as a slide show; the other monitor displays
    the slides along with other items that the audience never sees. For example, speaker
    notes are displayed on the second monitor so you can easily refer to them while
    presenting. You can also select slides out of sequence, preview slide text so
    you know exactly what''s going to happen when you next click the mouse, use your
    mouse as a pen to draw the audience''s attention to items on a slide, and black
    screen content as desired.


    To enable this feature, you need to have a computer with multiple monitor capability
    turned on or a laptop that has dual display features. Then, to turn on multiple-monitor
    support in PowerPoint 2007, go to the Slide Show and in the Monitors command group,
    select Present View. Then once the monitors are set up, go to the Slide Show tab
    and in the Set Up command group, select Set Up Slide Show. Select the options
    you want to use during presentation (as pen colors) and click OK. When you''re
    ready to present, go to the View tab and in the Presentation Views command group,
    select Slide Show.


    # Using Built-In Animation Tools


    Now let''s move on to the real meat of this chapter: Animations. When you work
    with animations, you''ll be using two key areas of PowerPoint: The Animations
    tab and the Custom Animation pane. Figure 12-2 shows the Animations tab and the
    command groups: Preview, Animations, and Transition To This Slide.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_180_0.png)

    Figure 12-2 The Animations tab


    Figure 12-3 shows the Custom Animation pane, which is opened by clicking Custom
    Animation in the Animations command group on the tab. When you use the Animations
    tab, you can quickly access built-in animations. There are three basic animations
    that can be applied with a single click: Fade, Wipe, or Fly In. You can easily
    see how those animations occur. The Custom Animation pane, on the other hand,
    provides a much more detailed list of animation options. We''ll explore the Animations
    options first, and then we''ll look at the possibilities available with the Custom
    Animation pane.


    # Applying Animations from the Animations Tab


    If you''re simply looking for a quick way to animate an object, you can use the
    Animations command group on the tab. The Animation command offers three commonly
    used selections available through the drop-down menu:


    - Fade The object will move from invisible to visible. This animation is actually
    the opposite of fading, which implies an object will become paler.


    Figure 12-3 The Custom animation pane


    # THE EASY WAY


    Live Preview occurs as the mouse hovers over each of the three choices, letting
    you quickly see how that animation will appear before you select.


    - Wipe The object will appear as if someone wiping onto the slide.

    - Fly In The object will fly in from the bottom of the slide.


    Click the animation you prefer. You can click Preview in the command group to
    see how your animation will appear. PowerPoint will apply a default speed of Fast.
    To change, go to the Transition To This Slide group and change the speed to Slow
    or Medium.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_181_0.png)


    # Applying Animations from the Animation Pane


    If you''re looking to do more with your animations than the few simple options
    provided on the Animations tab, you''ll need to use the Custom Animation pane.
    This pane lets you control how items appear on the slide and how multiple effects
    impact one another. The options vary depending on the animation applied to a given
    object include:


    - Add Effect Entrance, Exit, and Motion Path options. Each option then offers
    a menu of animation choices to select.

    - Remove lets you remove the animation applied to an object.

    - Start offers the choice of whether to start an animation on a mouse click, with
    a previous object, or a certain amount of time after a previous object appears
    on the slide.

    - Path offers the option to lock or unlock a path, edit points on a path, or reverse
    the path direction.

    - Speed offers animation options from Very Slow to Very Fast.

    - Size lets you select the size and direction an object grows.

    - Play lets you play the animation on demand.

    - Slide Show starts the slide show from the current slide.

    - Auto Preview shows you the animation.


    # PowerPoint 2007 Graphics and Animation Made Easy


    # Chapter 12 Creating and Using Animations


    # Creating and Using Animations


    Figure 12-4 These four animated objects are numbered separately.


    We''ll outline specific steps for you next, but first we want to see the Custom
    Animation pane at work. Here''s an example of how the Custom Animation pane can
    make a big difference: In Figure 12-4, the four graphics are set up as four animated
    objects. They are each set to fade separately into the document on individual
    mouse clicks. In Figure 12-5, those four separately animated objects have been
    grouped together.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_183_0.png)

    Figure 12-5 These four separate objects are animated as a single object and all
    appear with a single number, 0 in this case, on the slide itself. In the Custom
    Animation, they appear with the 0 next to the first object in the group, and the
    remaining items fall under without any number to indicate they follow the first
    object so they all fade onto the slide as a single, cohesive group. In addition,
    they have been set up to fade in automatically—just one click is required.


    The difference is in how the animations are set up in the Custom Animation pane.
    In Figure 12-4, each object is numbered 1 through 4. In Figure 12-5, each object
