    ## Combine Objects for a Single Animation


    To animate multiple objects as a single object like we showed in the previous
    example shown in Figure 12-5, follow these steps:


    - Select each object you want to animate, and apply the animation effect you want
    to each one individually.

    - In the Custom Animation pane, click the first object in the group you want to
    create. Press CTRL on your keyboard, and click to select the additional objects
    you want to include in the group.

    - Click the arrow to open the shortcut menu; select Start With Previous.


    The objects will now be linked together as a group.


    ## Apply Animations to Bulleted Text


    This animation is really easy to do and very effective with audiences because
    it keeps them from reading ahead as you present important points on a slide. Simply
    highlight the text in a bullet, and click Add Effect in the Custom Animation pane.
    Apply the effect you want, and select when you want to start. Applying the same
    effect to all bullets in a group is; switching effects can distract your audience.


    ## Adding Animations to Tables


    Animating parts of a table to be pretty easy in PowerPoint, PowerPoint 2007''s
    increased table sizes makes it more difficult. You can''t just ungroup and animate
    parts of a table like you could in previous versions. You can, however, apply
    some effects to a table to make it appear as parts of the table are animated.
    Essentially, you''re going to change your table from an object to a picture file
    and then ungroup parts of it and animate the specific parts you want.


    > A word of caution when linking objects to animate as a group: PowerPoint does
    exactly what you tell it to do; so you group them up or down in the Custom Animation
    pane, you will find the objects displaying when you expect them. You will have
    told PowerPoint to Start With Previous, however, so as objects move, they then
    become linked to new "Previous" items. Take your time and carefully lay out the
    slide before attempting to group objects together. Watch for "invisible" objects,
    objects that are now behind others as you worked on your slide. Hidden objects
    can make your animations strangely, so if you''re experiencing trouble take a
    close look for these issues in particular.


    ## MEMO


    At this point, you''ll see a second version of the table on your slide. This second
    version is actually a picture of your table. Don''t delete the original title
    until you''ve completed the entire process and are happy with the results. In
    fact, having the original title at the back of your presentation just in case
    you need the original again is a great idea.


    Animating a table is a pretty lengthy process; follow these steps slowly the first
    few times until you get the hang of them and you''ll discover it''s actually not
    that difficult to do.


    1. Select the table and go to the Home tab.

    2. Click Copy in the Clipboard command group.

    3. Click the arrow after Paste in the Clipboard command group.

    4. Click Paste Special.

    5. Click Picture (Enhanced Metafile).

    6. Click OK.

    7. Double-check to ensure your table is placed exactly where you want it on the
    slide. If you try to move it later, you could run into trouble.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_187_0.png)


