    ## 为项目符号文本应用动画


    这种动画非常容易制作，而且对观众非常有效，因为当你在幻灯片上演示要点时，它可以防止他们提前阅读。只需高亮项目符号中的文本，并在自定义动画窗格中点击“添加效果”。应用你想要的效果，并选择你想开始的时间。对组中的所有项目符号应用相同的效果是；切换效果会分散观众的注意力。


    ## 为表格添加动画


    在 PowerPoint 中为表格部分制作动画其实非常简单，但 PowerPoint 2007 增加的表格尺寸使其变得更加困难。你不能像以前的版本那样直接取消组合并对表格部分进行制作动画。然而，你可以对表格应用某些效果，使表格部分看起来像是有动画效果。基本上，你将把表格从对象转换为图片文件，然后取消其部分的组合，并对你想要的特定部分制作动画。


    > 在链接对象以成组制作动画时要留心：PowerPoint 完全按照你指示它去做；因此，无论你在自定义动画窗格中将它们分组还是取消分组，都会发现对象会在预期的时间显示。然而，你已经告诉
    PowerPoint “与上一个一起开始”，因此随着对象的移动，它们随后会链接到新的“上一个”项目。在尝试将对象分组之前，请花些时间仔细布局幻灯片。注意“不可见”对象，即在你处理幻灯片时现在位于其他对象后面的对象。隐藏的对象会让你的动画变得很奇怪，所以如果你遇到困难，请特别留意这些问题。


    ## 备忘


    在此时，你会在幻灯片上看到表格的第二个版本。第二个版本实际上是你表格的图片。在完成整个过程并对结果满意之前，不要删除原始标题。事实上，将原始标题留在演示文稿最后以防你可能再次需要它，这是一个好主意。


    为表格制作动画是一个相当长的过程；前几次缓慢地遵循这些步骤，直到你掌握了它们，你会发现实际上其实并不难。


    1. 选择表格并进入“首页”选项卡。

    2. 点击剪贴板命令组中的“复制”。

    3. 点击剪贴板命令组中“粘贴”后面的箭头。

    4. 点击“选择性粘贴”。

    5. 点击“图片（增强型元文件）”。

    6. 点击“确定”。

    7. 再次检查以确保你的表格准确地放置在幻灯片上想要的位置。如果你以后尝试移动它，可能会遇到麻烦。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_187_0.png)


    ## 简单方法


    然而，还有另一种制作项目符号文本的方法。点击文本框，然后进入“动画”选项卡。在“动画”旁边的“动画”命令组中，在“淡入”、“擦入”或“飞入”下选择“全部”或“按一级段落”。这种方法在自定义动画窗格中将所有项目符号文本绑定为一个组，这使得更容易在幻灯片上移动文本并保持项目符号动画效果。唯一的例外是，如果你选择“按一级段落”，文本将在第一次鼠标点击后一个接一个项目符号地自动出现，所以你可能想要更改计时。


    | 无动画 |

    | 无动画 |

    | 淡入 |

    | 按一级段落 |

    | 擦入 |

    | 一次性 |

    | 按一级段落 |

    | 飞入 |

    | 一次性 |

    | 按一级段落 |

    | 自定义 |

    | 动画 |


    > 备忘

    在“切换到幻灯片”命令组中使用“切换声音”和“切换速度”选项来添加声音或更改速度。


    ## 创建运动路径


    运动路径非常好玩，而且非常简单。**运动路径**用于你想让对象执行传统动画效果之外的操作时。你可以创建或使用 60 多个预设路径（见图 12-8）。


    要应用预设路径，请遵循以下步骤：


    1. 点击你想制作动画的对象。

    2. 在自定义动画窗格中，点击“添加效果”。

    3. 选择“运动路径”，点击显示的路径。

    4. 如果你想查看更多选项，点击“更多运动路径”，选择一种运动并点击“确定”。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_189_0.png)


    图 12-8 PowerPoint 2007 提供了 60 多个可以应用于对象的预设运动路径。


    一旦对对象应用运动路径，当自定义动画窗格打开时，运动将显示在幻灯片对象旁边，如图 12-9 所示。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_189_1.png)


    图 12-9 运动路径将显示在对象旁边。


    > 备忘

    完成后，不要尝试重新分组整个表格。


    要创建自己的自定义路径，请遵循以下步骤：


    1. 点击你想制作动画的对象。

    2. 在自定义动画窗格中，点击“添加效果”。

    3. 选择“运动路径 | 绘制自定义路径”，从显示的选项（直线、曲线、自由形状或涂鸦）中选择。

    4. 使用鼠标绘制对象的路径。


    ## 使用幻灯片切换添加动画


    幻灯片切换有助于观众从一个概念移动到另一个概念。在整个演示稿中使用相同的切换效果是一个好主意，但如果

