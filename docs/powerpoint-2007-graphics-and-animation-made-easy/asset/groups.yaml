  mdcn: '


    ## 选择声音的开始和停止方式


    PowerPoint 2007 中声音的默认设置是完整播放一次，但你可以为演示文稿调整开始和停止选项。在幻灯片上插入声音文件后，可以通过以下步骤更改声音开始的方式：


    1. 点击声音图标。

    2. 转到“动画 (Animations)”选项卡。

    3. 在“动画”组中选择“自定义动画 (Custom Animation)”。

    4. 在“自定义动画”窗格中，在“修改 (Modify: Play)”部分，点击“开始 (Start)”字段旁边的向下箭头。

    5. 选择你想要的声音启动方式：单击 (On Click)、上上一项 (With Previous) 或上一个幻灯片后 (After Previous Slide)。


    ## 从一个位置启动和停止声音


    如何从一个位置启动和停止声音呢？你可以在“播放声音”对话框中调整旁白的开始和停止方式。点击幻灯片上的声音图标。选择到“动画”选项卡，并在“动画”组中选择“自定义动画”。从“自定义动画”窗格中，选择带有三角形的行。点击向下箭头，然后选择“效果选项
    (Effect Options)”。当“播放声音”对话框出现时，转到“效果 (Effect)”选项卡，在“开始播放 (Start Playing)”部分，你可以选择：


    - 从头 (From Beginning)：立即开始声音

    - 从上一个位置 (From Last Position)：从上一个幻灯片开始声音

    - 从时间 (From Time)：在你指定的秒数延迟后开始声音


    在“播放声音”对话框的“停止播放 (Stop Playing)”部分，你可以停止声音。选项有：


    - 单击 (On Click)：默认设置，在你点击时停止声音

    - 当前幻灯片后 (After Current Slide)

    - 若干幻灯片后 (After a number of slides)：声音跨越幻灯片播放


    ## 设置幻灯片元素触发声音


    在 PowerPoint 2007 中添加带声音的文本或对象非常简单。让我们看看为符号文本添加声音的方法：


    1. 将符号文本添加到幻灯片中。

    2. 选亮你想要添加动画和声音的符号。

    3. 转到“动画”选项卡。

    4. 在“动画”组中，点击“动画”字段旁边的向下箭头。

    5. 选择你想要的符号出现方式（你将在第2章学习更多关于动画的内容）。

    6. 在“动画”组中点击“自定义动画”。

    7. 点击符号右侧的向下箭头。

    8. 选择“效果选项”。

    9. 在“效果”选项卡上的“增强 (Enhancements)”部分，点击“声音 (Sound)”字段旁边的向下箭头。

    10. 选择你想添加的声音。


    这将为所有符号添加相同的声音。如果你想为每个符号添加不同的声音，点击第一个符号文本左侧的向下箭头以显示。现在你可以看到所有符号了，点击要添加声音的符号右侧的向下箭头。然后选择“效果选项”，并在“效果”选项卡的“增强”部分，点击“声音”字段旁边的向下箭头。选择你想添加到此符号的声音。


    ## 在幻灯片放映中播放 CD


    有时你可能想在演示期间播放某首歌曲。在进行演示时，你可以轻松地使用 CD 中的音乐。只需记住，CD 与你的演示文稿是分开的；它没有链接或嵌入到演示文稿文件中。


    1. 将 CD 插入计算机的 CD 驱动器。

    2. 选择你希望音乐开始的幻灯片。

    3. 转到“插入 (Insert)”选项卡。

    4. 在“媒体剪辑”组中，选择“播放 CD音频 (Play CD Audio)”。

    5. 在“插入 CD音频”对话框中，输入起始（Start At）轨道号和结束（End At）轨道号。

    6. 根据需要更改时间框中的时间。

    7. 点击确定。

    8. 选择你希望 CD 何时播放：自动 (Automatically) 或 单击时 (When Clicked)。


    **备注：** 语音旁白会覆盖其他声音，一次只有一个声音在播放。如果你有其他要自动播放的声音，如果包含旁白，它们将不会播放。然而，如果你将声音设置为“单击时”播放，当你按照建立的顺序点击时，它们将继续播放。


    ## 在幻灯片放映中录制旁白


    在 PowerPoint 2007 演示文稿中录制旁白的功能，是那些需要更多信息来完善演示完美答案。你可以在演示之前或期间录制旁白，并可以选择为单张幻灯片或整个演示文稿录制旁白。


    要录制旁白，你的计算机需要声卡、麦克风和扬声器。这些选项在大多数最近的计算机上已成为标准配置，通常提供的足够满足你旁白需求的音质。如果你想增强声音，可以考虑升级声卡和/或购买直接插入计算机
    USB 端口的 USB 麦克风。


    按照以下步骤录制你的旁白：


    1. 点击你想开始录制的幻灯片。

    2. 转到“幻灯片”选项卡上的“设置 (Set Up)”组。

    3. 点击“录制旁白 (Record Narration)”。

    4. 在“录制旁白”对话框（如下所示）中，点击“设置麦克风级别 (Set Microphone Level)”。

    5. 读取“麦克风测试”对话框中的文本以测试音量并确保麦克风正常。

    6. 点击确定开始录制。


    **备注：** 为了确保不丢失录制开头或结尾的任何旁白，在移动到下一张幻灯片之前等一下。如果你移动得太快，记录可能会提前截止。


    当你点击确定时，旁白将嵌入演示文稿。如果你是链接旁白，请转到“录制旁白”对话框并勾选“链接 (Link)”复选框。


    ## 第11章 为演示文稿添加声音


    PowerPoint 2007 会自动记录在每张幻灯片上的时间。当对话框出现时，你可以保存这些旁白。记得将旁白和演示文稿保存在同一个文件夹中。


    要手动设置计时，转到“动画”选项卡和“切换此幻灯片”组。在“切换幻灯片”部分，勾选“于 (After)”复选框。输入让幻灯片留在屏幕上的秒数。


    要关闭计时，转到“幻灯片”选项卡并点击“设置幻灯片 (Set Up Slide)”进入“设置放映”对话框。在“切换幻灯片”部分，选择“手动 (Manually)”。要从“设置放映”对话框（如下所示）恢复计时，在“切换幻灯片”部分，选择“放映时使用计时
    (Using Timings, If Present)”。


    偶尔，你可能想在演示期间录制注释。


    1. 在演示文稿的普通视图中，选择要添加注释的幻灯片。

    2. 转到“插入”选项卡。

    3. 在“媒体剪辑”组中，点击“声音”。

    4. 选择“录制声音 (Record Sound)”。

    5. 在“录制声音”对话框中，点击“录制”并录制你的注释。

    6. 完成后，点击“停止”。

    7. 输入注释名称然后点击确定。


    '
