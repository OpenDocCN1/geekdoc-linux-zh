    ## 3D 旋转命令


    有时你可能想要旋转 WordArt。你可以通过“文本效果”对话框，或通过选择“WordArt 样式 | 文本效果 | 3D 旋转”轻松地做到。让我们看看如何从“文本效果”对话框进行更改。


