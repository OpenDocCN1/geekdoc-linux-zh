    +   1. Click the diagonal arrow at the bottom-right corner of the Size command
    to display the Size And Position dialog box.

    2. Adjust the height and width in the Size And Rotate section.

    3. Click Close.


    # TO CROP OR NOT TO CROP


    To crop or not crop? When deciding whether to crop or not, take a step back and
    look at the picture again. What stands out most? What part of the photo do you
    want to highlight or focus on?

    * Consider the Rule of Thirds, which was created by Renaissance painters who wanted
    a picture to tell a story. The Rule of Thirds states that if you mentally divide
    the picture with two vertical and two horizontal lines, all evenly spaced, you
    will create a grid of nine sections. To create the most aesthetically pleasing
    composition for your picture, the object you want to highlight should be placed
    at the intersection(s) of the lines.

    If you have a horizontal subject, it should lie on one of the horizontal lines.
    Vertical subjects should lie on one of the vertical lines. By not centering your
    subject exactly in the middle, you can crop your picture in the most interesting,
    inviting way. Basically, the Rule of Thirds can take your


    from blah to bam! Knowing this basic rule of photography will significantly increase
    the impact of your pictures. Remember this when looking at photos in a gallery
    or in your local library, and you will see the pattern. And remember, even the
    most famous painters used this rule of composition to design intriguing and interesting
    works of art.


    > For more information on the Rule of Thirds, see Langford''s Basic Photography,
    Eighth Edition: The Guide for Serious Photographers, by Michael Langford, Anna
    Fox, and Richard Sawdon Smith, Focal Press, 2007.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_51_1.png)


    39'
- md: '

    # MEMO


    When sizing by percentage, consider checking the Lock Aspect Ratio Relative To
    Original Picture Size boxes. This will ensure that your picture maintains the
    ratio of height to width as you increase or decrease its size.


    To size by percentage using the Size And Position dialog box, follow these steps:


    - 1. Click on the diagonal arrow at the bottom-right corner of the Size command
    group.

    - 2. In the Size And Position dialog box, select the picture size by adjusting
    the percentages in the Scale section.

    - 3. Click Close.


    The Size And Position dialog box also lets you rotate the picture, crop from the
    left, right, top, or bottom, and reset the picture to its original size. You can
    also position the picture on the slide from the Position tab.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_52_0.png)


    - 1. Select the Position tab.

    - 2. Adjust the position of picture on the slide by changing the inches from the
    Top-Left Corner or Center Of The Slide.

    - 3. Click Close.


    # Framing Pictures


    Picture borders can speak volumes when you present your pictures. A heavy border
    can intensify a photograph''s effect, whereas a light border gives a picture an
    airy feel.


    PowerPoint 2007 gives you many options to choose from.

    Below the Picture Shape command in the Picture Styles command group is Picture
    Border, which allows you to create a number of outlines for your pictures. You
    can create frames of different colors, thicknesses, and solid or patterned lines.
    Framing your picture in colors that complement it you highlight specific details
    within the picture''s composition. Let''s add a border to a previous picture.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_53_0.png)


    - 1. Select Picture Border.

    - 2. Click Width and select the thickness of the border.

    - 3. Click Picture Border again.

    - 4. Select a color for your border.


    # THE EASY WAY


    You can access a few commands quickly by right-clicking on the picture. This reveals
    a few options that allow you to cut, copy, paste, and format the picture. The
    Format Picture dialog box lets you choose from a number of ways to change your
    picture easily. You can also find the Format Picture dialog box by clicking the
    diagonal arrow in the bottom-right corner of the Picture Styles group.


    Figure 3-13 shows how a photo looks with a 6-point, solid black border. Figure
    3-14 shows the difference a light, dashed border can make at 2 1/4 points.

    Figure 3-15 shows how a border color can complement a picture.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_53_1.png)


    Figure 3-13 An example with a solid, black border


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_53_2.png)


    Figure 3-14 An example with a light, dashed border


    # THE EASY WAY


    Want to instantly add color and framing to a photo? You can access numerous preset
    options from the Home tab. Go to Drawing | Quick Styles and select a shape or
    line.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_54_0.png)


    Figure 3-15 A solid border that complements the colors in the picture


    # Creating Powerful Pictures


    Now that you''re familiar with the power of the Picture Tools Format tab in PowerPoint
    2007, let''s walk through a few ways you can use your new knowledge.


    PowerPoint 2007 presentations offer you a number of preset options that help you
    create your presentations faster. These options, located on the Design tab, and
    you''ll quickly progress in designing attention-getting presentations.


    Here''s a quick tutorial to help you practice some of the things you just learned.
    Figure 3-16 uses preset options to create a vibrant scene.


    - 1. Open a PowerPoint 2007 presentation.

    - 2. On the Home tab, click New Slide in the Slides command group.

    - 3. Select the Blank layout.

    - 4. Go to the Insert tab.

    - 5. In the Illustrations group, select Picture to add your picture.

    - 6. In the Picture Styles group, select a style from the Picture Styles gallery.


    # Chapter 3 Illustrating with Pictures


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_55_0.png)


    Figure 3-16 An example of using a preset color in the background


    # THE EASY WAY


    Want to add some spice to your backgrounds with one click? To get to the Format
    Background dialog box quickly, right-click on the background and make your adjustments.
    This dialog box lets you make background changes on only one slide and offers
    options to Apply To All slides or Reset Background to its original color, texture,
    and grade. For an easy way to achieve consistency from start-to-finish, use the
    Themes command on the Design tab.


    - 7. In the same group, click Picture Border and select a color for your border.

    - 8. Select Picture Effects.

    - 9. Select Reflection and then a reflection variation.

    - 10. Go to the Design tab.

    - 11. Select Background Styles.

    - 12. Choose the Format Background command.

    - 13. From the Fill screen, click Gradient Fill.

    - 14. Select a color from Preset Colors.

    - 15. Save the presentation.


    While preset options are excellent for designing presentations quickly, sometimes
    you''ll want to express your individuality with specific colors and designs.


    # PowerPoint 2007 Graphics and Animation Made Easy


    Let''s look at how you can customize your picture for your needs with another
    simple tutorial. The results are shown in Figure 3-17.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_56_0.png)


    - 1. Open a PowerPoint 2007 presentation.

    - 2. On the Home tab, select New Slide and then select Title And Content layout.

    - 3. Go to the Insert tab. Select Picture and add your picture.

    - 4. In the Picture Styles command group, select Picture Shape. Select Oval from
    the Basic Shapes section.


    Figure 3-17 Soften a slide to reflect a poignant moment.


    - 5. Select Picture Effects and select Accent Color 4, 18 pt Glow from the Variations
    section.

    - 6. Select Picture Border. Click Weight and select 4 ½ pt line.

    - 7. Go to the Design tab.

    - 8. Choose Background Styles.

    - 9. Choose the Format Background command.

    - 10. From the Fill screen, select Gradient Fill.

    - 11. In the Fill section, select Gradient Fill and then select a color from the
    options.

    - 12. Click Close.

    - 13. In the Title box, type your message.

    - 14. Save your presentation.


    Here''s another example of a quick, easy way to customize a slide. The slide layouts
    are an excellent starting point, but by your ingenuity can make slides jump off
    the page to delight, inspire, and humor. Figure 3-18 uses PowerPoint 2007 textures
    to bring a little fun to this beach scene.


    # Chapter 3 Illustrating Pictures


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_57_0.png)


    - 1. Open a PowerPoint 2007 presentation.

    - 2. Select Add Slide and select the Picture With Caption layout.

    - 3. From the Insert tab, select Picture and add your picture.

    - 4. Go to Picture Styles and select the style like.


    **Figure 3-18** A texture background can add to the picture''s story.


    - 5. Select Picture Border and change the color of the border.

    - 6. Go to the Design tab.

    - 7. Select Background Styles.

    - 8. Choose the Format Background command.

    - 9. From the Fill screen, select Picture Texture Fill.

    - 10. Choose the texture you like.

    - 11. Click Close.

    - 12. Type your message in the Title box and Text box.


    # Creating a Photo Album


    Now that you know how to use pictures to their full potential in PowerPoint 2007,
    you need a way to capture the spirit of your photos in an organized way. The Photo
    Album lets you have a little fun with presenting photos to family and friends.
    In this chapter, you''ll learn about photo albums and album layouts and discover
    how to create, edit, and add captions to your photos. You can use PowerPoint 2007''s
    themes for consistency throughout your album, and you''ll also learn how simple
    it is to create a black and white photo album for dramatic effect. You''ll even
    learn how to customize your layout by resizing photos and adding text boxes manually.


    Creating and editing a photo album in PowerPoint 2007 is easy. You have a number
    of options and layouts to choose from. You may want to say it with a caption or
    a title, or perhaps your photograph will tell a story without any words at all.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_59_0.png)

