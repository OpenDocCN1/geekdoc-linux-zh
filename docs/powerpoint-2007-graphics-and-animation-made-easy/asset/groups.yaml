    ## 图表工具格式选项卡


    在处理图表时，你可以使用的最后一个选项卡是图表工具格式格式选项卡，如图 15-15 所示。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_222_0.png)


    图 15-15 图表工具格式选项卡


    大部分情况下，你已经在书中多次看到这些格式选项了。第 7 章解释了如何使用 WordArt，第 8 章解释了处理形状的细差别。除了它仅适用于你正在处理的图表外，这方面没有什么真正的新内容。


    所以，如果你想通过应用 WordArt 让图表标题看起来很酷，就可以使用这个选项卡。点击文本框，应用所需的 WordArt 样式。对形状、分组、取消分组、调整文本框大小、网格线和选择窗也进行相同的操作——只需选择相关的图表元素，并使用该选项卡上的工具即可。


    如果这很难，我们会告诉你的！尽管这个选项卡在 PowerPoint 的其他功能区中是重复的，但它的美之处在于，当你处理图表时，它将所有这些命令直接呈现在面前。


    这确实是 PowerPoint 2007 的精髓所在。你需要的一切都在功能区选项上触手可及。正如你在整本书中所学到的，一旦进入了正确的选项卡，就能快速轻松地找到命令。你已经学习了许多关于
    PowerPoint 2007 图形和动画的新知识；只要知道使用正确的工具和命令，看起来像专业人士其实非常简单。


    > 备忘

    图表中较大的 3D 数据标记是否遮挡了较小的标记？选择需要移动的图表元素，然后转到图表工具选项卡，在“当前选择”命令组中，选择“深度轴 | 格式选项 | 逆序系列”。点击关闭。


