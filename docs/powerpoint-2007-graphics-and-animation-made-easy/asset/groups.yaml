    slides, the very layouts help you present information in a clear and direct fashion.
    In Chapter 1, we showed you how to access the built-in layouts offered by PowerPoint
    2007. Those layouts, however, are just the tip of the iceberg. In this section,
    we''ll show you how to create custom layouts to tell your story any way you want
    to.


