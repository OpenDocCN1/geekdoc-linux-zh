    ## Chapter 8 Creating Effective Shapes


    Using the Scribble command well requires little practice, especially if you''re
    using it for drawing. Take some time to get used to the sensitivity of your mouse
    and how much movement it takes to create. You may want to start small and then
    begin to make your movements bigger as you become more proficient.


    - From the Control Panel, reset your point. This helps significantly as you learn
    how to create shapes from scratch.


    In this chapter, you learned about a number of ways to use shapes in presentations.
    In addition to using shape fill, outline, and text, you also learned how to edit
    premade shapes and how to create your own.


    ## Comparing and Illustrating Content with SmartArt


    If you haven''t really used SmartArt yet, you''re going to be quite impressed
    by what it can do. If you have used it, you know it can make life easier when
    designing presentations. The beauty of SmartArt—a visual method for displaying
    content—is that it turns simple text into dynamic graphics that are easy to read
    and understand. In particular, SmartArt lets you show concepts, processes, and
    other relationships in a visual way by providing preset graphics you can simply
    drop information into. You can customize both the look and layout of SmartArt
    and animate it as well.


    We''ll also show you how to work with charts, which are wonderful graphic elements
    you can add to presentations where you need to display numerical data. Charts
    aren''t quite as flexible as SmartArt, but you can still make them look professional
    using color and Quick Styles.


    In this chapter, we''ll explain what SmartArt and charts entail and how both work.
    You''ll learn how to edit SmartArt, instantly change basic text into SmartArt,
    and perform a range of other tasks to make your SmartArt the coolest in town.
    Plus, you''ll discover how to change chart elements and apply a variety of elements
    to your charts to make them stand out from a graphic perspective.


    ### SmartArt Overview


    SmartArt offers more than 80 different graphic layouts and can be used in PowerPoint
    2007, Word 2007, and Excel 2007. These layouts are separated into seven groups:


    - List Use to display grouped, related, or even nonsequential information.

    - Process Use for showing sequential steps or subgroups.

    - Cycle Use to show a continuing sequence of stages or relationships to a central
    idea.

    - Hierarchy Use to display groups of information and reporting relationships.

    - Relationship Use to display information that overlaps or is somehow interrelated.
    This option is particularly good for showing comparisons.

    - Matrix Use to show relationships of components to a whole.

    - Pyramid Use to display proportional, interconnected, or hierarchical relationships.


    ### SMARTART VS. CHARTS


    You might think SmartArt simply duplicates the Chart function in PowerPoint, but
    these are truly two different types of tools. Whereas SmartArt helps you display
    information and ideas in a visual manner, charts help you illustrate numeric values
    or data. If you are trying to decide between the two, take a good look at the
    content you need to display. If it''s text-based, you''re probably better off
    with SmartArt. If it involves a lot of numbers, go with the Chart function.


