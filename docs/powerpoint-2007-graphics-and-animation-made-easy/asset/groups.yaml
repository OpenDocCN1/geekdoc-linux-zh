- md: '

    ## PowerPoint 2007 Graphics and Animation Made


    In the Excel spreadsheet that appears, enter your data as shown in Figure 13-2.
    The changes will appear on the chart in your presentation.


    In this chapter, you learned how simple it is to move Excel content to your PowerPoint
    presentation or to create your own Excel charts within PowerPoint. The next chapter
    covers moving graphics between Word and PowerPoint.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_200_0.png)


    Figure 13-2 An example of the Excel spreadsheet where you can add data to create
    a chart in PowerPoint 2007


    ## Moving Graphics Between Word and PowerPoint


    One of the best things about PowerPoint 2007 is the ability to move items back
    and forth between applications. Sure, you still need to watch out for a few things,
    but for the most part, moving graphics between PowerPoint 2007 and Word is pretty
    straightforward. In this chapter, we''ll look at how easy it is to move graphics
    between these applications; review the various ways you can format the object,
    text, or picture; and point out the exceptions to pasting in both applications.
    As a reminder, graphics can include clip art, pictures, charts, tables, or bulleted
    text.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_201_0.png)


    ## Moving a Graphic from PowerPoint to Word


    When you move a graphic from PowerPoint to Word, you have a few options, including
    resizing, that can help present the graphic accurately. From the Home tab in PowerPoint,
    go to the Clipboard group and select Copy (or CTRL-c). In Word, select the place
    in the document where you want to paste the graphic and Paste (or CTRL-v).


    When you paste into your Word document, you''ll see the Paste Options icon, as
    shown in Figure 14-1. From here, you can choose from several options for inserting
    your graphic.


    Here''s a rundown of what does and doesn''t move easily from PowerPoint to Word:


    - When moving pictures, shapes, SmartArt, and Clip Art to Word, you can select
    Paste As Picture, Keep Source Formatting, or Use Destination Theme.

    - When moving a table to Word, you can select Paste As Picture, Keep Source Formatting,
    or Match Destination Theme.

    - When moving a bulleted list to Word, you can select Paste As Picture, Keep Source
    Formatting, Match Destination Formatting, or Keep Text Only.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_202_0.png)


    Figure 14-1 The Paste Options icon appears next to the graphic when moving a graphic
    from PowerPoint to Word.


    - When moving a chart to Word, you can select Chart, Excel Chart, Paste As Picture,
    Keep Source Formatting, and Use Destination Theme.


    ## MEMO


    Anytime you select the Paste As Picture option, you cannot make changes to the
    graphic you''ve inserted. So if you need to adjust any of your graphics, make
    the changes in PowerPoint before pasting the graphic into Word.


    - When Moving SmartArt to Word, the only option that allows you to maintain the
    formatting is Paste As Picture. The other options—Keep Source Formatting, Match
    Destination Formatting, or Keep Text Only—will cause you to lose the Word formatting.


    Let''s review some of these options mean:


    - Paste As Picture Pastes the graphic in a picture

    - Keep Source Formatting: Maintains the original format from PowerPoint

    - Use Destination Theme, Match Destination Theme, or Match Destination Formatting:
    Inserts the graphic with the same document theme or format as the Word document

    - Keep Text Only: Pastes as text into the Word document

    - Chart: Pastes a chart linked to Excel data

    - Excel Chart: Includes the entire workbook


    ## Moving a Graphic from PowerPoint


    Moving a graphic from Word to PowerPoint is simple. From the Home tab in Word,
    go to the Clipboard group and select Copy (or press CTRL-C). In PowerPoint, select
    the slide where you want to paste the graphic and click Paste (or press CTRL-V).
    You''ll see the Paste Options icon appear. Click to decide how to insert your
    graphic.


    Sometimes, you''ll find a font that you really want to use in your presentation
    or document. You can embed TrueType fonts in Word and PowerPoint to ensure you
    have the look you want. The steps are similar in both programs, but we''ll look
    at how to do this in PowerPoint.


    - 1. Click the Microsoft Office button.

    - 2. Click PowerPoint Options.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_204_0.png)


    - 3. Select Save.

    - 4. In the Preserve Fidelity When Sharing This Presentation section, select Embed
    Fonts In The File, as shown next.


    ## PowerPoint Options


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_205_0.png)


    - 5. Click Embed Only The Characters Used In The Presentation checkbox.

    - 6. Click OK.


    ## MEMO


    If the Word document is in plain text and has no heading styles, PowerPoint will
    create an outline based on paragraphs created by hard returns when you press ENTER.
    For example, each item in a bulleted list is a paragraph and a title or subtitle
    is a paragraph.


    Selecting Embed Only The Characters Used In The Presentation helps to reduce file
    size. If you need to embed all characters in the font, uncheck that box. The following
    formats are supported:


    - .doc: Word 97

    - .docx: Word 2007

    - .txt: Text

    - .rtf: Rich text format

    - .pdf: Portable Document Format

    '
