    # 创建自定义布局


    最出色的 PowerPoint 演示是那些仔细考虑了受众和内容，并为两者提供最佳匹配的演示。例如，技术类观众不会被充斥着大量图表和微小细节的演示所困扰。然而，更通用的商务观众在第一次看到图表时就可能睡着了。这并不意味着你不应该对商务或学术观众使用图表——而是你需要深思一个自定义的布局，以帮助你的观众轻松地理解图表或保持他们的注意力。


    你演示文稿中的每张幻灯片都在讲述整个故事的一部分。你可以通过若干幻灯片引导观众从一个点移动另一个点，也可以在单张幻灯片中涵盖多个点。你可以使用颜色来引起对幻灯片特定项目的注意，或以独特的方式放置项目符号来惊喜并捕捉观众的注意力。


    在本章中，我们将查看如何在 PowerPoint 演示中使用自定义布局，以从第一张幻灯片就开始吸引观众的注意力——并在整个演示过程中保持观众的专注。


    # 规划你的演示


    在创建演示文时，如果你先在 PowerPoint 中创建一个大纲，将节省大量时间并避免烦恼。大纲不需要面面俱到，但它应该足够详细，以便你不需要反复思考下一张幻灯片要放什么。


    在第 1 章中，我们解释了 PowerPoint 工作区。在该工作区，“幻灯片”选项卡旁边是“大纲”选项卡。点击它，让我们添加几张幻灯片，你可以看到如何在
    PowerPoint 中轻松创建大纲。要开始添加，转到首页 | 幻灯片组 | 新幻灯片。然后按照以下步骤向空白演示添加共四张幻灯片：


    - 1. 添加标题。在幻灯片标题处，在标记为“单击添加标题”的文本中输入 Opening statement。


    # 大纲概览


    # 第 2 章 创建自定义布局


    2. 添加比较幻灯片。在标记为“单击添加标题的的文本框中输入 Objectives`。在左侧的比较框中，在副标题框中输入 Current year`，在右侧的比较框中，在副标题框中输入
    Upcoming fiscal year`，并在项目符号中输入 What will be done。


    3. 添加空白幻灯片。选择插入 | 文本 | 文本框向幻灯片上添加文本。在幻灯片上你喜欢的位置放置文本框。在文本框中输入 Supporting data。


    4. 添加标题和内容幻灯片。在标记为“单击添加标题”的文本框中输入 Ending statement。


    现在，你可能已经注意到在图 2-1 中，大纲中的 3 旁边没有出现文本。在步骤 3 中，你确实为那张幻灯片输入了文本。这是因为你将 3 作为空白幻灯片添加并在上面放置了单独的文本框。当你以这种方式添加幻灯片和文本时，即使幻灯片出现了，文本也不会出现在大纲中。大纲只识别内置布局中的文本，因此你需要通过从库中选择仅限标题布局为你的幻灯片添加一个布局。


    # PowerPoint 2007 图形和动画变得简单


    简单方法

    当你向演示文稿添加空白幻灯片时，转到首页 | 幻灯片 | 布局：从库中选择“仅限标题”布局，你的空白幻灯片现在就会应用一个简单的内置布局。在“仅限标题”布局提供的标题文本中输入你的大纲内容，然后查看之前空白的幻灯片现在在大纲中关联了文本。你的幻灯片本质上仍然是空白，但你现在可以从大纲中——以及图
    2-2 查看它应该包含什么信息。


    创建适应你内容的布局

    如今布局无处不在。从 MySpace 页面到网页采集到 PowerPoint 幻灯片，布局本身就能帮你以清晰直接的方式呈现信息。在第 1 章中，我们向你了如何访问
    PowerPoint 2017 提供的内置布局。然而，那些布局只是冰山一角。在本节中，我们将向你展示如何创建自定义布局来讲述你的故事。记住，布局帮助你以清晰直接的方式呈现信息——不要让它们吓到你。你只需要一点想象力并愿意尝试新想法，就能创建引人注目的幻灯片布局。PowerPoint
    提供了三种不同的方法创建自定义布局：


    - 你可以使用空白幻灯片并插入占位符。

    - 你可以使用布局并移动占位符。

    - 你可以在幻灯片母视图中添加布局，正如第 1 章所示。


    图 2-2 当内置布局应用到空白幻灯片时，大纲将显示文本。


    在本章中，我们将向你展示一些自定义布局的创意，以帮助你改进已有的内置布局。在正文中，可以包含各种元素


    设计秘密 50

    Rodney J. Moore 著

    Rockport Publishers, 2004


    这些技术当你只想更改演示时既简单又方便。


    - 形状

    - 图表

    - 图片

    - 表格

    - 智能图形

    - 项目


    首先，让我们看看标题幻灯片。这个内置布局有两个文本框：一个标题文本框和一个副标题框。默认文本是黑色的，大小是预先定义的。要自定义此简单的幻灯片，你可以添加公司
    Logo 或演讲者的照片。你还可以将文本占位符移动到幻灯片的其他区域，应用艺术字或颜色，或添加新的占位符


    图 2-3 显示了一个仅使用文本框的开场幻灯片。


    图 2-4 显示了如何自定义此标题幻灯片以提供关于你、你的公司和演示主题的更多信息。在自定义示例中，我们用彩色文本框突出显示了演示的主线，插入了演讲者的照片并配以解释其资历的文本框，并在幻灯片的右下角添加了出版者的
    Logo。


    两张幻灯片都是专业的；不同的文本放置以及一点点颜色对于眼睛如何被幻灯片所吸引有很大影响。这并不华丽，即使是这种小程度的自定义也能为你的演示增添活力。


    通过向幻灯片添加 PowerPoint 主题或背景颜色，你可以做出更戏剧的改变。但如果你在任何演示中使用过多的颜色对比。有时，使用的颜色越多，幻灯片就越令人混乱。


    接下来，让我们看看标题和内容幻灯片，如图 2-5 所示。在这张幻灯片中，你可以使用六种对象之一添加页面标题。布局已经安排好，你无法在保留顶部主文本框的情况下在幻灯片的主部分添加文本和对象。但如果你想在旁边显示图片和支持的项目符号呢？


    你可以通过重新调整文本/对象占位符的大小并在旁边插入项目符号文本框来实现这一点，如图 2-6 所示。我们使用绘图快速样式库为项目符号文本框添加了颜色。然后将两个对象稍微向彼此倾斜。


