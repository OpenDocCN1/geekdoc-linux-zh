    # Adding Effects


    Some of the real fun with table graphics comes adding effects to your table. These
    are all located on the Tools Design tab. You can typically apply effects to a
    single cell to help it pop out for viewers, or you can apply them to the entire
    table. Although applying effects to an entire table generally isn''t recommended
    because it can make the table more difficult to read, it can sometimes work. Some
    effects, however, will apply in a particular way to your table regardless of whether
    you''re trying to apply the effect to a single cell or the entire table, so you''re
    going to have to play around a little bit to see how each effect impacts your
    table.


    You can apply three main effects to a table: Cell Bevel, Shadow, and Reflection.


    With *Cell Bevel*, you can apply a bevel effect to individual cells in a table.
    This effect has the most impact when you need to spotlight a particular area of
    a table.


    To apply Cell Bevel, select the cells you want to spotlight; then go to the Table
    Styles command


    group, select Effects | Cell Bevel, and then choose a bevel option.


    *Shadow*, on the other hand, applies to the entire table. You can choose from
    inner and outer shadow options.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_97_0.png)


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_97_1.png)


