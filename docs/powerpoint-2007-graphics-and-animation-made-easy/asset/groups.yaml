    # HOW POWERPOINT ORGANIZES YOUR CLIPS


    | PowerPoint has another item that sounds similar to the Clip Art pane: The Clip
    Organizer houses many of the same clips you can find using the Clip Organizer
    on your hard drive where Powerpoint stores clips for you. It''s also a great place
    to gather and store your photos, animations, videos, and other media files along
    with the automatically stored clips from Office Online or elsewhere.

    As you add items to your collections, the Clip Organizer stores them for you and
    even lets you apply keys to the clips for easy searching. It sorts items into
    the categories you find in the Clip Art pane. Because the Clip Organizer is located
    on your hard drive, you can open and use the clips independent of any Microsoft
    Office program. just type **Clip Organizer** into the Start box in Vista and click
    Microsoft Organizer in the results to open it.

    The first time you open the Clip Organizer, let it scan your computer for photos
    and other media files so it can organize files however hard drive into separate
    collections. Files will remain in their original locations; PowerPoint just creates
    shortcuts to them | so you can quickly preview, open, or insert a file. You can
    also do this at any time if you have been using PowerPoint for a while. Just follow
    these steps:

    1. Click the Clip Organizer link at the bottom of the Clip Art pane.

    2. Click File In The Features – Microsoft Clip Organizer dialog box.

    3. Click Add To Organizer, and then click Automatically.

    4. In the Add To Organizer dialog box, click Processes. The process will take
    a few minutes.

    5. In the Auto Import Settings dialog box, select or clear the checkboxes for
    the folders you want the clips to be organized into.

    6. Click Catalog.

    7. Click OK.

    The entire process might take several minutes, but you can still work on your
    presentation as the Organizer tools in the background.


