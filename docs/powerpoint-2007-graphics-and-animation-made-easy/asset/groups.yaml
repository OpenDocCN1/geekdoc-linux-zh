    \nFigure 5-8 Various aspects of a graphic can be resized by editing the points\
    \ within it.\n\nTo edit points within your graphic, first ungroup the graphic\
    \ as explained earlier in “Manipulating Clip Art.” Then follow these steps:\n\n\
    - Right-click the section of the graphic that you want to edit.\n- From the shortcut\
    \ menu, click Edit Points. The section will now be outlined in red, with black\
    \ handles of differing sizes.\n\n![](img/bf2a856bcd8fc3e8384ecc7137df5347_85_1.png)\n\
    \nUsing your mouse, grab a black handle and pull it to its new location. You can\
    \ repeat the process multiple times until the section is modified to your liking.\n\
    \n## “Wash out” a Graphic\n\nWhen you use graphics in PowerPoint, you don’t want\
    \ them to overwhelm the audience and distract from your message. However, sometimes\
    \ the perfect graphic is just too bright to be used effectively in a presentation.\
    \ In cases like this, try “washing out” the graphic. This process makes a bright\
    \ graphic more subtle ![](img/bf2a856bcd8fc3e8384ecc7137df5347_86_0.png), and\
    \ it might be just what you might need. Figure-9 shows the difference between\
    \ an original graphic and a copy of it washed out using the light variation Background\
    \ Color 2 Light.\n\n**Figure 5-9** Graphics can be muted by applying a simple\
    \ wash to them.\n\nWash out a graphic, follow these steps:\n\n1. Right-click the\
    \ graphic.\n2. Select Format Picture. Select Picture.\n3. Do one of the following:\n\
    \    - Recolor and select one of the Color Modes or Variations.\n    - Change\
    \ brightness or contrast using the corresponding sliding handles or up and down\
    \ arrows.\n\n## MEMO\n\nWhen you're working with some pieces of clip art, you\
    \ might need to save the art as a picture in order to apply wash out techniques.\
    \ If you can't access the Picture tools in the Format Shape dialog box, this is\
    \ most likely the problem. Right-click the graphic and click Save As Picture,\
    \ and then save the file format you prefer.\n\n## Arranging Clip Art Objects on\
    \ Your Slide\n\nOnce your clip art objects look the way you want them to, you\
    \ can drop them into your slides. Remember to follow the design principles explored\
    \ in Chapter 1, and then follow these tips for arranging clip art as needed.\n\
    \n## MEMO\n\nWhen you paste clip onto a slide, you might decide to resize it quickly\
    \ by using sizing handles on the art. Be careful; pixelization is when the curves\
    \ of lines in your graphic take a stepped appearance. You can avoid this by saving\
    \ the art to your hard drive and resizing it using a graphics program. When the\
    \ resizing is complete, add it to your slide from its location on the hard drive.\n\
    \n## Use Alignment Options\n\nThere are some quick ways to position clip art and\
    \ other graphics on your slide. One feature you need to understand is alignment.\
    \ With a few mouse clicks, you can align graphics up, down, horizontally, and\
    \ in other ways. To find the alignment options, first select multiple graphics\
    \ and go to the Home tab. Select Drawing | Arrange | Align and choose from ten\
    \ different alignment options.\n\n## Use Order Options\n\nWhen you have graphics\
    \ placed on top of one another that need to be moved, you have two different methods\
    \ for rearranging them. The first is through the Selection Pane, as shown in Figure\
    \ 5-10, which is accessed through the Arrange group on either the other Drawing\
    \ Tools Format tab or the Picture Tools Format table. With the selection pane,\
    \ you can see a list of every single object on your slide, including text. Click\
    \ the item that you want to move, and use the up and down arrows at the ![](img/bf2a856bcd8fc3e8384ecc7137df5347_87_0.png)\
    \ Figure 5-10 The Selection Pane bottom of the pane to reorder the object you've\
    \ selected. However, the second way is our favorite method, so see The Easy Way.\n\
    \nIn this chapter, you discovered many different ways to work with clip art. Don't\
    \ be timid about playing with clip art. You'll find that the more familiar you\
    \ become with the features covered in this chapter, the easier it will be to create\
    \ the perfect graphics for your presentations. In the next chapter, we'll explain\
    \ how to work with tables in PowerPoint 2007.\n\n- Go to Home | Drawing | Arrange\
    \ and select an order option: Bring To Front, Send To Back, or Send Backward.\n\
    - Bring Forward, or Send Backward.\n- Bring To Front and Send To Back move items\
    \ all the way to the front or back, respectively.\n- Bring Forward or Send Backward\
    \ moves items one step.\n\n## THE EASY WAY\n\n## Working with Tables\n\nMaybe\
    \ you don't think of tables as graphics, but we sure do. Purists might say tables\
    \ are simply used to lay out information, but they aren't considering the fact\
    \ that information within tables can be animated in PowerPoint 2007 can make your\
    \ look sharp.\n\nIn this chapter, we'll explore how tables are created and edited.\
    \ We'll also show you how to use color effectively, as well as how to use the\
    \ two different tabs that will appear when you create a table: The Table Tools\
    \ Design tab and the Table Tools Layout tab.\n\nYou add a table to your presentation\
    \ in one of two ways: drawing it or by using a simple drawing box to specify the\
    \ number of rows and columns. Either method is fine. \n\nTo add to the table,\
    \ click within a cell and then start typing. To change the font, font color, or\
    \ font size of the, highlight the text and use the Font group on the Home tab\
    \ to make the desired changes. You can also change text from cell to cell by using\
    \ the Paragraph group tools on the Home tab. In individual cells or throughout\
    \ the table (highlight specific areas to apply changes universally), you can\n\
    \n## Creating Tables\n\n![](img/bf2a856bcd8fc3e8384ecc7137df5347_90_0.png)\n\n\
    - Align text differently.\n- Add bullets.\n- Change list levels.\n- Change line\
    \ spacing.\n\n## THE EASY WAY\n\nTo add a table to your presentation, click the\
    \ slide, and then go to Insert | Table and select the number of rows and columns\
    \ by dragging the cursor until you've selected the desired number (as shown above).\
    \ Click in the final cell and the table will appear on your slide.\n\n## Add Rows\
    \ or Columns\n\nAfter you've created the table on your slide, if you discover\
    \ that you need an additional row, you can add one by highlighting a row and right-clicking.\
    \ From the shortcut menu, select Insert | Insert Rows Above or Insert Rows\n"
