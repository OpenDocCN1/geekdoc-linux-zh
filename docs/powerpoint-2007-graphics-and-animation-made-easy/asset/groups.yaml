    | 水平翻转”即可让艺术字恢复原始位置。


    你可以通过点击“更多旋转选项”访问在第 3 章中学习过的“大小和位置”对话框。


    那么，使用艺术字最有效的方法是什么？少用。少量的艺术字就能起到很大作用，所以只有当你需要传达一个让观众记住的强力观点时，才使用它。


    在本章中，你学习了如何为艺术字添加填充、轮廓和效果。你还接触了“文本格式效果”对话框，可以在其中执行许多操作来精化和自定义你的艺术字。使用“对齐”、“旋转”和“翻转”命令让你对艺术字有更多的控制。你还学习了“形状样式”，你将在第
    8 章中学习更多。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_119_0.png)


    # 创建有效的形状


    PowerPoint 2007 中的形状在工作和娱乐中有许多用途。无论你是需要流程图的形状，还是仅仅想展示你家中的“明星”，形状都是在演示文稿中突出重点要点、人物和对象的绝佳方式。


    PowerPoint 2007 的内置形状是使用形状的完美起点，但你也可以根据需要对形状进行自定义。在本章中，你将学习在何时使用形状、如何为形状添加填充、轮廓和效果，以及如何向形状添加文本以使你的信息更有力。你还学习了如何编辑形状，或为那些需要更多新活感的特殊信息创建自己的形状。


    ## 何时使用形状


    在第 1 章中，你学习了“少即是多”。这是一个重要的设计概念，在你创建 PowerPoint 2007 幻灯片时将让你受益浅。要记住的最重要的一点是，在大量竞争注意力的信息中，一个惊艳的元素就能做出非凡的声明。稀疏地使用形状和其他选项是你创建具有戏剧性、令人记忆的幻灯片的最佳选择。


    花点时间确定你的信息。你想传达什么？你是试图让观众大笑，还是在传达一个动人的时刻？你是在用你最重要的卖点达成交易，还是在提供产品优势的高级概述？确定你想传达的内容是选择你将使用的形状的第一步。


    ## 选择和插入形状


    你可以在“插入”选项卡上找到“形状”命令：


    - 1. 转到“插入”选项卡。

    - 2. 从“插图”组，选择“形状”。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_120_0.png)


    # 第 8 章 创建有效的形状


    - 3. 从左侧显示的形状选项中，选择你喜欢的形状。

    - 4. 在幻灯片上放置该形状。![](img/bf2a856bcd8fc3e8384ecc7137df5347_121_0.png)

    ![](img/bf2a856bcd8fc3e834ecc7137df5347_121_1.png)


    # 绘图工具 格式


    绘图工具 格式选项卡提供了你手动对齐艺术字或其他对象所需的命令。在“绘图工具格式”中，你可以找到许多命令，如艺术字，这些内容在第 7 章中介绍过。


    ## 为形状添加填充


    当你位于“绘图工具 格式”选项卡时，有两种方法可以为形状添加填充。从“形状”组中选择：


    - 1. 转到“对齐”。

    - 2. 点击“形状填充”。

    - 3. 在“实时预览”中移动光标。

    - 4. 选择喜欢的颜色。


    如果你不喜欢默认网格设置，可以通过调整“网格和辅助线”对话框中“网格设置”部分的间距数字来更改。这将根据你的需要使网格单元变大或变小。


    要使用“对齐”命令在屏幕上显示绘制辅助线，选择“网格设置”，并在“网格和辅助线”对话框中，进入“设置”部分并选择“在屏幕上显示绘制辅助线”。虽然垂直和水平线（如下所示）设置为零，但你可以将它们移动到幻灯片上的任何位置，帮助你将艺术字与其他对象（包括图形、剪贴画等）对齐。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_118_0.png)


    | 网格和辅助线 | 对齐到 |

    | :--- | :--- |

    | [ ] 将对象对齐到网格 | |

    | [ ] 将对象对齐到其他对象 | |

    | 网格设置 | 间距：[ 0.083 ] 英寸 |

    | [ ] 在屏幕上显示网格 | |

    | 辅助线设置 | [ ] 在屏幕上显示绘制辅助线 |

    | 设置为默认 | 确定 | 取消 | |


    现在你将看到虚的垂直和水平线。这些线是供你参考的——在进行演示文稿之前，你需要取消选择“显示网格”命令。


    第二个命令“网格设置”允许你根据喜好调整设置。当选择选择此命令时，你会看到以下内容。


    在“对齐”部分，你可以选择对齐、与网格对齐或与其他对象对齐。艺术字默认设置为“对齐到网格”，但你也可以选择“对齐其他对象”以及同时对齐这两者。通过这种方式，PowerPoint
    2007 将为你完成大部分工作。


    # 形状的世界


    形状帮助我们定义世界。我们童年时的练习之一是将拼图碎片放入圆孔、方孔等。


    艺术家是专家，他们以我们不同的视角观察世界。当他们作画时，不仅仅是画形状的线条和曲线。他们关注形状的线条、曲线、阴影和空白。


    例如，当艺术家画一张脸时，光线落在的地方。大多数肖像并不使用线条来定义嘴唇、鼻子和眼睛。如果你仔细观察，你会发现艺术家利用阴影和空白来表现这些特征。


    花点时间思考你看到的日常形状。在你社区散步或坐在户外时观察周围。你会对每个形状中包含的空白和阴影量感到惊讶。在使用 PowerPoint 2007 创建形状时利用这些知识，你可以设计在幻灯片上栩栩如生的
    3D 效果。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_121_2.png)


    # PowerPoint 2007 图形和动画制作


    简单方法


    在“自定义”选项卡中看到你喜欢的颜色并只想快速获取它？查看上方“自定义”调色板中的白色光标。只需将光标拖到你需要的颜色，然后释放鼠标按钮。点击确定。这将帮助你使用不同深浅的颜色快速增强演示文稿中的形状。


    ![](img/bf2a856bcd8fc3e834ecc7137df5347_122_0.png)


    不确定想要什么颜色但想尝试一下？点击“更多填充”，然后选择“自定义”选项卡。在这里，你会看到 RGB（红、绿、蓝）颜色，可以通过拖动垂直条右侧的箭头或调整下方红、绿、蓝字段中的量来调整。


    如果你更倾向于不同的调色板，在“颜色模型”下拉列表中，选择


