    +   7. In the Adjust group, click Brightness and select +40%.


    +   8. In the Adjust group, click Contrast and select -40%.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_159_0.png)


    Figure 10-1 A movie, two animated GIFs, and text aligned using gridlines


    +   9. Go to the Picture Styles group and click Picture Border.


    +   10. Click Black, Text 1.


    +   11. Click Picture Border and select Weight.


    +   12. Select 3 point.


    Now you''ve created a grayscale background for your movie to run on. Go to the
    Insert tab, and in Media Clip group, select Movie | Movie From File, Select the
    movie you want to insert into the presentation. You should have a slide that looks
    similar to Figure 10-2. Adding the background gives some depth and interest to
    your slide.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_159_1.png)


    Figure 10-2 A movie running on a grayscale background'
  - '[PAGE 160]


    # MEMO


    # Performance Considerations


    When selecting a picture to use for the background, be careful not to use something
    that competes with the movie. In Figure 1-2, the background photo has lighter,
    more subtle features, which makes it easier to adjust in grayscale. This type
    of image is better than a close up of an image with bold, well-defined lines that
    would detract from, not complement, the movie.


    When using movies in a PowerPoint 2007 presentation, remember that too much activity
    on a slide can completely halt the movie''s ability to play. By using a number
    of movies or animated clip art items can increase your presentation file size,
    which could lead to performance issues as well. To improve your presentation''s
    performance:


    +   1. Go to the Slide Show tab.

    2. In the Monitors group, click the down arrow in the Resolution field.

    3. Select 640x480 (Fastest, Lowest Fidelity).


    This option speeds up the performance while lowering the fidelity of the presentation.
    You will need to run the slide show in its entirety to see how clarity is affected.
    If the change is too dramatic, you can select the Use Current Resolution option
    or try the other options: the 1024x768 (Slowest, Highest Fidelity), which offers
    a crisp image but slows down the performance, or the 800x600 option, which is
    the “middle ground” between the two options.


    As a reminder, if you''re sending the presentation via email, be sure to zip or
    compress it before sending to ensure it goes through as fast as possible.


    In this chapter, you learned about when to consider movies as an option in your
    presentation, along with compatible file formats and conversion options. You also
    learned how to insert a movie or animated GIF into your presentation. You also
    saw two examples of using animated clip art with a movie or a picture as a background
    to the movie. In the next chapter, you''ll learn about many ways to use sound
    to enhance your presentation even more.'
  - '[PAGE 161]


    # Adding Sound To Your Presentation


    Like movies, sound can also add some life to your presentation. Whether you''re
    trying to establish a mood, offer a narration, or simply drive home an important
    point, sound can give some sizzle to the steak. In this chapter, you''ll learn
    how to insert sound files, how to start and stop the sounds, and how to set up
    objects and text to trigger the sounds. You''ll also learn how to add CDs and
    record a narration.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_161_0.png)'
  - '[PAGE 162]


    # When Sound Is Appropriate


    Sound is wonderful when you''re using it to help you make a point. But how many
    websites you have clicked on only to be greeted with blaring sound because you
    forgot to turn down the volume? Startling, isn''t it?

    That''s why prudent with sound is your best bet. If you''re unveiling something
    new and different, a drum roll is appropriate. If you''ve achieved a significant
    company goal or objective, a little applause is in order. Or if you want some
    soothing background music during your presentation, sound can de the trick in
    communicating your message.


    The bottom line is to use sound for specific reasons to enhance your presentation
    and make your messages memorable.


    # Supported Sound File Formats


    PowerPoint 2007 supports the following file formats:


    +   - AIFF audio file Audio Interchange File Format (.aiff)

    - AU audio file Unix Audio (.au)

    - MIDI file Musical Instrument Digital Interface (.mid or .midi)

    - MP3 audio file MPEG Layer 3 (.mp3)

    - Windows audio file Wave Form (.wav)

    - Windows Media audio file Windows Media Audio (.wma)


    If your sound file is not in one of these formats, it will not play in PowerPoint-2007.
    However, you can convert it to one of these formats using a utility program, or
    add-in such as:


    +   - Microsoft Windows Media Encoder, a free program that makes files compatible
    with PowerPoint 2007. Visit http://www.microsoft.com/windows/windowsmedia/forpros/encoder/default.mspx
    for more information.'
  - '[PAGE 163]


    PFCMedia, an add-in that automates the formatting of multimedia. For more information,
    visit PFCMedia for PowerPoint at http://office.microsoft.com/en-us/marketplace/EM01213296132.aspx.


    When using sound files, you should note the difference between embedded and linked
    files, especially if you need to make changes. *Embedded* files are stored in
    the presentation file, whereas *linked* files are stored in their own files outside
    the presentation file. Here is information to help you determine when to use an
    embedded file or a linked file. You can use the Package For CD option to make
    it easier: Click the Microsoft Office icon and then Publish | Package For CD.
    You can copy the file to a folder or to a CD. The linked files are included as
    the default setting.


    | Embedded Sound Files | Linked Sound Files |

    | --- | --- |

    | Stored as part of the presentation. | Stored outside of the presentation file.
    |

    | Must be deleted, edited in original file format, and reinserted for changes
    to appear in the presentation. | Should be stored in the same folder as the presentation.
    Changes appear in the presentation when you make a change to the source file.
    |

    | If .wav files are less than 100KB (KB), you can embed them. | If .wav files
    are greater than 100KB or sound files are of any other media type, you must link
    them to, or embed them in, the presentation. |


    # Inserting Sound Files


    Adding sound to a PowerPoint 2007 file is similar to adding a movie, which you
    learned how to do in Chapter 10. You have four options for inserting sound files.'
  - '[PAGE 164]


    # PowerPoint 2007 Graphics and Animation Made Easy


    +   - Sound From File This option lets you insert a sound clip or music file.


    +   - Sound From Clip Organizer You can choose from sounds like applause or light
    piano or holiday music.


    +   - Play CD Audio Track You select the CD track you want to play during the
    presentation.


    +   - Record Sound This option allows you to record your own sound for your presentation.


    Now, we''ll insert the sound file from the Clip Organizer.


    +   1. Go to the Insert tab.

    2. In the Media Clip group, click Sound.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_164_0.png)


    +   3. Click Sound From Clip Organizer.

    4. Select the sound you want to insert into the presentation. A sound icon will
    appear on the slide.


    When you insert the sound, a Microsoft Office PowerPoint dialog box (shown next)
    asks when you would like to have the sound play. Your options are


    +   - Automatically Your sound will play when the slide appears.


    +   - When clicked When you click the sound icon, your sound will play. This is
    also known as a trigger.'
  - '[PAGE 165]


    # MEMO


    Be sure the sound file is long enough to play across the number of slides you
    need. You''ll find the sound time in the Play Sound box on the Sound Settings
    tab in the Information section. If you''d like to repeat the sound, check the
    Loop Until Stopped checkbox on the Sound Options group. The sound will continue
    playing until you find it easy to add sound after your presentation is completed,
    that way you''ll know when you want to add, remove, or loop the sound.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_165_0.png)


    PowerPoint offers another option on the Sound Tools Options tab. Go to the Sound
    Options group and select Play Sound Across


    Slides. This option plays the sound in its entirety one. (If you''d like to play
    the sound continuously, check the Loop Until Stopped checkbox in the Sound Options
    group.)

    —— you choose the Play Across Slides options, you''ll need to define the number
    of slides the sound should play across. Chapter 12 will cover animations in depth,
    but to establish the number of slides the sound needs to play across, follow these
    steps:


    +   1. Go to the Animations tab.

    2. In the Animations group, select Custom Animation.

    3. From the Custom Animation Pane, select the line with the triangle.

    4. Click the down arrow and then Effect Options.

    5. In the Play Sound dialog box, go to the Effect tab.

    6. In the Stop Playing section, select After and enter the number of slides the
    sound should play across.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_165_1.png)'
- md: '

    ## Selecting How Sounds Should Start and Stop


    The default setting for sound in PowerPoint 2007 is for the sound to play once
    in its entirety, but you can adjust the start and stop options for your presentation.
    To change the way the sound begins after you''ve inserted your sound file on the
    slide:


    1. Click the sound icon.

    2. Go to the Animations tab.

    3. Select Custom Animation in the Animations group.

    4. In the Custom Animation Pane, in the Modify: Play section, click the down arrow
    for the Start field.

    5. Choose the way you want the sound to start: On Click, With Previous, or After
    Previous Slide.


    ## Stopping and Starting Sound from One Location


    What about starting and stopping sound from one location? You can adjust the way
    your narration starts and stops in the Play Sound dialog box. Click the sound
    icon on your slide. Select the Animations tab, and in the Animations group, select
    Custom Animation. From the Custom Animation Pane, select the line with the triangle.
    Click the down arrow and then select Effect Options. When the Play Sound dialog
    box appears, go to the Effect tab and from the Start Playing section, you can
    select:


    - From Beginning to start the sound immediately

    - From Last Position to start the sound from the last slide

    - From Time to begin the sound after a time delay of seconds you''d like.


    In the Stop Playing section of the Play Sound dialog box, you can stop the sound.
    The options are:


    - On Click, the default setting, which stops the sound when you click

    - After Current Slide

    - After a number of slides for the sound to play across.


    ## Setting Up Slide Elements to Trigger Sounds


    Adding text or objects with sound is easy in PowerPoint 2007. Let''s look at ways
    to add sound to bulleted text:


    1. Add the bulleted text to your slide.

    2. Highlight the bullets you want to add animation and sound to.

    3. Go to the Animations tab.

    4. In the Animations group, click the down arrow next to the Animation field.

    5. Select the way you want your bullets to appear (You''ll learn more about animations
    in Chapter 2).

    6. Click Custom Animations in the Animations group.

    7. Click the down arrow to the right of the bullet.

    8. Select Effect Options.

    9. In the Enhancements section on the Effect tab, click the down arrow next to
    the Sound field.

    10. Select the sound you want to add.


    This will add the same sound to all bullets. If you want to add a different sound
    to each bullet, click the down arrow to the left of the first bulleted text to
    display. Now that you can see all bullets, click the down arrow to the right of
    the bullet you want to add sound to. Then Select Effect Options, and in the Enhancements
    section on the Effect tab, click the down arrow next to the Sound field. Select
    the sound you want to add to this bullet.


    ## Playing CDs with Slide Shows


    Sometimes you may want to play a certain song during your presentation. You can
    easily use music from a CD while giving your presentation. Just remember the CD
    is separate from your presentation; it is not linked to or embedded in the presentation
    file.


    1. Insert the CD into your computer''s CD drive.

    2. Select the slide that you want the music to begin on.

    3. Go to the Insert tab.

    4. In the Media Clips group, select Play CD Audio.

    5. In the Insert CD Audio dialog box, enter the Start At track number and the
    End At track number.

    6. Change the times in the time boxes as needed.

    7. Click OK.

    8. Select when you would like the CD to play: Automatically or When Clicked.


    **Memo:** Voice narration overrides other sounds, with only one sound playing
    at a time. If you have other sounds to play automatically, they will not play
    if a narration is included. If you have set the sounds to play When Clicked, however,
    they will continue to play when you click them in the order you established.


    ## Recording a Narration with Slide Shows


    The ability to record a narration with your PowerPoint 2007 presentation is the
    perfect answer for those when more information is needed for a fuller presentation.
    You can record a narration before or during a presentation, and you have the option
    of recording narration for one slide or for the entire presentation.


    To record the narration, you''ll need a sound card, microphone, and speakers on
    your computer. These options have become standard on most recently built computers
    and generally offer enough sound quality for your narration needs. If you want
    to enhance the sound, however, you can look into upgrading your sound card and/or
    purchasing a USB microphone that plugs directly into your computer''s USB port.


    To record your narration, follow these steps:


    1. Click the slide you want to begin the recording.

    2. Go to the Set Up group on the Slide tab.

    3. Click Record Narration.

    4. In the Record Narration dialog box (shown below), click Set Microphone Level.

    5. Read the text in the Microphone Check dialog box to test your volume and make
    sure your microphone is working.

    6. Click OK to begin recording.


    **Memo:** To make sure you don''t lose any of the narration at the beginning or
    end of recording, wait a moment before moving on to the next slide. If you move
    too quickly, the recording may cut off too soon.


    When you click OK, you''ll embed the narration into the presentation. If you''d
    prefer to link to the narration, go to the Record Narration dialog box and check
    the Link checkbox.


    ## Chapter 11 Adding Sound to Your Presentation


    PowerPoint 2007 automatically records the time spent on each slide. You can save
    these narrations when the dialog box appears. Remember to save your narrations
    and presentation in the same folder.


    To set the timings manually, go to the Animations tab and the Transition This
    Slide group. In the Advance Slide section, select the After checkbox. Enter the
    number of seconds you''d like for the slide to stay on the screen.


    To turn off the timings, go to the Slide tab and click Set Up Slide to access
    the Set Up Show dialog box. In the Advance Slides section, select Manually. To
    turn the timings back from the Set Up Show dialog (shown next), in the Advance
    Slides section, select Using Timings, If Present.


    Occasionally, you may want to record comments during a presentation.


    1. In the Normal view of the presentation, select the slide that you''ll add the
    comment to.

    2. Go to the Insert tab.

    3. In the Media Clips group, click Sound.

    4. Select Record Sound.

    5. In the Record Sound dialog box, click Record and record your comment.

    6. When you''re finished, click Stop.

    7. Type in the name of the comment and then click OK.

