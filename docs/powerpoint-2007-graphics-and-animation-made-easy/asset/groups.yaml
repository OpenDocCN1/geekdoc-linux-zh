    ## 引言


    你已经掌握了 PowerPoint 2007 的基础知识；现在是时候创建富有想象力的图形和动画来吸引观众的注意力了。作为 PowerPoint 的长期用户，我们设计这本书是为了帮助你尽可能轻松地理解和使用图形与动画，让你也能轻松地创建专业、精美的演示文稿。在书中，你将发现如何创建并有效应用
    SmartArt、WordArt、图表、表格、形状和自定义动画。你还将学习如何处理照片、剪贴、电影和声音，让你的演示文稿具有独特且专业的外观。


    除了关于使用 PowerPoint 2007 内置功能设计通用布局的信息外，这本书还解释了 PowerPoint 的十种基本图形和动画类型。书的最后一部分将讨论如何将
    PowerPoint 图形与 Excel 和 Word 使用，以及如何排练演示以验证你的图形和动画运行完美。


    在整本书中，你将发现：


    - 逐步说明和实用建议

    - 创建和应用 PowerPoint 2007 图形和动画的独特技巧

