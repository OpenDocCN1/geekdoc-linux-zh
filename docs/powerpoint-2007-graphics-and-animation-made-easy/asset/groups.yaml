    ## 第 10 章在演示文中添加视频


    - 1. 从“首页”选项卡，进入“幻灯片”组。

    - 2. 点击“新建幻灯片”并选择“空白”。

    - 3. 从“插入”选项卡的“插图”组，点击“图片”。

    - 4. 选择一张照片作为灯片的背景。

    - 5. 进入“图片工具格式”选项卡。

    - 6. 在“调整”组中，点击“重色”，并在“颜色模式”部分中选择“灰度”。

    - 7. 在“调整”组中，点击“亮度”并选择 +40%。

    - 8. 在“调整”组中，点击“对比度”并选择 -40%。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_159_0.png)


    图 10-1 使用网格线对齐的视频、两个动画 GIF 和文本


    - 9. 进入“图片样式”组并点击“图片轮边框”。

    - 10. 点击“黑色，文本 1”。

    - 11. 点击“图片轮边框”并选择“粗细”。

    - 12. 选择“3 ”。


    现在你已经为视频创建了一个灰度背景。进入“插入”选项卡，在“媒体剪辑”组中，选择“视频 | 从文件创建”，选择你想插入到演示文稿中的视频。你应该会得到一张与图
    10-2 类似的幻灯片。添加背景可以为你的幻灯片增添深度和趣味性。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_159_1.png)


    图 10-2 在灰度背景上运行的视频


    ## 备忘


    ## 性能考虑


    在选择图片作为背景时，注意不要使用与视频产生竞争的内容。在图 1-2 中，背景照片具有较亮、更微妙的特征，这使其在灰度模式下更容易调整。这种图像比具有粗壮、清晰线条的图像特写更好，后者会分散视频的注意力，而不是补充视频。


    在 PowerPoint 2007 演示中使用视频时，请记住幻灯片上的活动过多可能会完全停止视频的播放。使用多个视频或动画剪辑项目可能会增加演示文稿文件的大小，这可能导致性能问题。为了提高演示文稿的性能：


    - 1. 进入“放映”选项卡。

    - 2. 在“显示器”组中，点击“分辨率”字段中的向下箭头。

    - 3. 选择 640x480（最快，最低保真）。


    此选项在降低演示文稿保真度的同时提高了性能。你需要运行整个放映来查看清晰度受的影响。如果变化太剧烈，你可以选择“使用当前分辨率”选项或尝试其他选项：1024x768（最慢，最高保真），它提供清晰的图像但会减慢速度；或者
    800x600 选项，它是两者之间的“折中方案”。


    提醒一下，如果你通过电子邮件发送演示文稿，请确保在发送前将其压缩为压缩包，以确保尽可能快地发送。


    在本章中，你学习了何时考虑将视频作为演示文稿的选项，以及兼容的文件格式和转换选项。你还学习了如何向演示文稿中插入视频或动画 GIF。你还看到了两个使用动画剪辑并以视频或图片作为背景的示例。在下一章中，你将学习许多使用声音来进一步增强演示文稿的方法。


    ## 在演示文稿中添加声音


    与视频一样，声音也可以为你的演示文稿增添活力。无论你是在试图营造氛围、提供旁白，还是仅仅为了强调一个重要点，声音都能让表现锦上添花。在本章中，你将学习如何插入声音文件、如何开始和停止声音，以及如何设置对象和文本来触发声音。你还将学习如何添加
    CD 和录制旁白。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_161_0.png)


    ## 何时适用声音


    当你使用声音来辅助观点时，它是奇妙的。但你点击过多少个网站，却因为忘记关小音量而迎来了刺耳的响呢？这很令人惊讶，不是吗？

    这就是为什么谨慎使用声音是你的明智之举。如果你正在揭晓某种新颖、不同的事物，鼓点是合适的。如果你实现了一个重大的公司目标或任务，一点掌声是应该的。或者如果你想在演示期间配有一些舒缓的背景音乐，声音可以在传达你的信息时发挥作用。


    核心是针对特定原因使用声音来增强你的演示文稿并让你的信息记忆深刻。


    ## 支持的声音文件格式


    PowerPoint 2007 支持以下文件格式：


    - AIFF 音频文件（音频交换文件格式）

    - AU音频文件（Unix）

    - MIDI 文件（音乐数字接口）

    - MP3 音频文件（MPEG 层 3）

    - WAV 音频文件（Wave）

    - WMA 音频文件（Windows Media）


    如果你的声音不是这些格式，你可以使用工具将其转换为其中之一。


    ## 插入声音文件


    PowerPoint 2007 提供以下选项：


    - 来自文件的声音：这允许你插入声音。

    - 来自剪辑组织器的声音：你可以从等声音中选择。

    - 播放 CD 轨道：选择 CD 轨道。

    - 录制声音：这允许你录制自己的。


    现在，我们将从剪辑插入声音。


    - 1. 进入“插入”选项卡。

    2. 在“媒体剪辑”组中，点击“声音”。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_164_0.png)


    - 3. 点击“来自组织器”。

    4. 选择你想插入到演示文稿中的声音。幻灯片上会出现一个声音图标。


    当你插入声音时，PowerPoint 对话框（所示）会询问你希望何时播放。你的选项有：


    - 自动：声音将在幻灯片出现时播放。

    - 点击时：当你点击声音图标时，声音将播放。这也被称为。


    ## 备忘


    确保声音文件足够长，以跨越你需要的幻灯片。你可以在“设置”选项卡的“播放声音”框中找到声音时长。如果你想循环声音，请勾选“声音选项”组中的“循环”复选框。声音将一直播放，直到你发现在演示完成后添加它很方便，这样你就能知道何时添加、删除或循环声音。


    ## 性能考虑


    PowerPoint 在“声音选项”选项卡上提供了另一个选项。进入“声音选项”组并选择“跨幻灯片播放”。此选项会让声音完整地播放一次。（如果你想连续播放声音，请勾选“声音选项”组中的“循环”复选框。）


