    There is another way to animate bullet text, however. Click the text box, and
    then go to the Animations tab. In the Animations command group next to Animation,
    Select All Once or By 1st Level Paragraphs under Fade, Wipe, or Fly In. Using
    this method ties all the bulleted text as a group in the Custom Animation pane,
    which makes it easier to move text around the slide and maintain the bullet animation
    effects. The only caveat is here that the text will automatically appear bullet
    by bullet after the first mouse click if you choose By 1st Level Paragraphs, so
    you might want to change the timing.


