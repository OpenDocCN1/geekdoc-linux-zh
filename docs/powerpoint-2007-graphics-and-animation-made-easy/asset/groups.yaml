    # MEMO


    Only vector art can be easily manipulated. Most clip art graphics are vector art,
    which is built in layers using lines, curves, and shapes, photographs and clip
    art that have been scanned into a computer typically are not. If you''re having
    trouble manipulating a graphic, it''s probably because it is not vector and cannot
    be manipulated. Most downloaded clip art has not been saved in a vector format,
    however. Microsoft clip art can be manipulated, but generally you can''t tweak
    much clip art from sites unless the site specifies that.


    - 3. Select On My Own.

