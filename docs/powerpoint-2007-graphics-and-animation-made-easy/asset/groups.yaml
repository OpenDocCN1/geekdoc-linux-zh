    ## 轻松上手 PowerPoint 2007 图形与动画


    - 3. 点击“从文件插入电影”。

    4. 选择要插入到演示文稿中的电影。

    5. 点击“确定”。


    你也可以双击电影文件将其插入到演示文稿中。

    你将看到一个 Microsoft PowerPoint 对话框，询问你希望在何时播放电影。你的选项有：


    - **自动播放 (Automatically)**：此选项意味着电影会在幻灯片显示时开始播放。如果使用了动画等其他媒体效果，电影将在动画结束后播放。你可以通过点击电影来暂停播放，再次点击即可重启。

    - **单击时播放 (When Clicked)**：此选项意味着电影将在你点击它时播放。这也被称为“触发器”。

    - **跨幻灯片播放 (Play Across Slides)**：此选项将按电影文件的长度播放一次。它不会多次播放电影。（要连续播放电影，请勾选“电影选项”组中的“循环直到停止”复选框。）


    ## 简单方法


    想确保电影在整个演示过程中都播放吗？从“动画”组中，选择“自定义动画”。在“播放电影”对话框中，在“之后”字段中输入 999。此数字将显示为默认值，也是你可以输入的最大。通过这样做，即使你在演示文稿中添加或删除幻灯片，也不需要调整该值。


    你可以根据想要的播放方式随时对这些选项进行更改。如果你选择了“跨幻灯片播放”选项，你需要进入“动画”选项卡。从“动画”组，进入“动画 | 自定义动画窗格”。点击带有三角形的线条，然后点击向下箭头并选择“效果选项”。你将看到“播放电影”对话框。


    ## 第 10 章向你的演示文稿添加电影


    在“效果”选项卡上，转到“停止”部分，点击“之后”并输入你希望电影跨越播放的幻灯片总数。

    一旦你插入了电影，你将在“工具 选项”选项卡中看到一个新工具栏。让我们逐一查看此工具栏上的每个组和命令。


    在“播放”组中，你可以**预览 (Preview)** 电影。点击“预览”图标即可在 PowerPoint 2007 中查看你的电影。

    “电影选项”组包含多个命令，包括：


    - **幻灯片音量 (Slide Show Volume)**：通过此命令，你可以调整电影音量或完全静音。默认音量为中等。

    - **播放电影 (Play Movie)**：此命令允许你选择是自动播放（我们已选择的）、单击时播放或跨幻灯片播放。

    - **放映期间隐藏 (Hide During Show)**：勾选此框可在幻灯片放映期间隐藏声音或电影。

    - **全屏播放 (Play Full Screen)**：使用此命令让电影在整个屏幕上播放。

    - **循环直到停止 (Loop Until Stopped)**：此命令设置声音或电影持续播放，直到手动停止。

    - **播放后重播电影 (Rewind Movie After Playing)**：此命令在电影播放完成后自动将其回退到第一帧。


    你也可以通过点击“电影选项”组右下角的箭头来访问这些选项。你将看到“电影选项”对话框，让你根据需要调整电影，并检查电影的总播放时间。


    我们将在本章稍后的部分探索“排列 (Arrange)”组命令，但让我们简要查看一下“大小 (Size)”组。正如你在第 3 章中学学的，“大小”组允许你更改幻灯片上图片或电影的大小。你可以直接在“大小”组中进行更改，或者点击日志右下角的箭头，你将看到“大小和位置”对话框。你可以对图片进行调整大小、缩放、裁剪或重置为原始大小。“位置”选项卡允许你选择图片在幻灯片上的位置。


    ## 备忘录 (MEMO)


    当你的电影在幻灯片上被高亮时，你会发现“图片工具 格式”选项卡可用。此工具栏为你提供了在第 3 章中学过的选项。虽然你可以以任何想要的方式格式化电影在幻灯片上的显示方式，但当电影播放时，图片的形状将移动到背景，电影将恢复其原始形状。播放完成后，电影将返回图片的形状。


    ## 插入剪辑电影


    你还可以插入片段电影，它实际上是一个动画 GIF 文件，而不是真正的电影。相反，该文件是由一系列流以创建动画效果的图像组成的。


    - 1. 进入“插入”选项卡。

    2. 在“媒体片段”组中，选择“电影”。

    3. 点击“从剪贴面板插入电影”。


    剪贴面板将出现。此面板与你在第 5 章学过的类似，但你查看的是动画 GIF 而不是静态剪贴画。（这是因为你使用的是“从剪贴组织器插入电影”，而不是插组中的“剪贴画”命令。）


    在剪贴面板中，将光标悬停在右下角的黄色星形上方。“预览”对话框为你提供了 GIF 的预览。


