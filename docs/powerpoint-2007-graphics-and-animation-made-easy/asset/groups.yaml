    +   6. Click OK to begin recording.


    # MEMO


    To make sure you don''t lose any of the narration at the beginning or end of recording,
    wait a moment before moving on to the next slide. If you move too quickly, the
    recording may cut off too soon.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_170_1.png)


    When you click OK before start recording, you''ll embed the narration into the
