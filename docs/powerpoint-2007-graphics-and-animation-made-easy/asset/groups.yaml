    ## Chapter 10 Adding a Movie to Your Presentation


    - 1. From the Home tab, go to the Slides group.

    - 2. Click New Slide and select Blank.

    - 3. From the Insert tab in the Illustrations group, click Picture.

    - 4. Select a photo to use for the background of your slide.

    - 5. Go to the Picture Tools Format tab.

    - 6. In the Adjust group, click Recolor and select Grayscale in the Color Modes
    section.

    - 7. In the Adjust group, click Brightness and select +40%.

    - 8. In the Adjust group, click Contrast and select -40%.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_159_0.png)


    Figure 10-1 A movie, two animated GIFs, and text aligned using gridlines


    - 9. Go to the Picture Styles group and click Picture Border.

    - 10. Click Black, Text 1.

    - 11. Click Picture Border and select Weight.

    - 12. Select 3 point.


    Now you''ve created a grayscale background for your movie to run on. Go to the
    Insert tab, and in Media Clip group, select Movie | Movie From File, Select the
    movie you want to insert into the presentation. You should have a slide that looks
    similar to Figure 10-2. Adding the background gives some depth and interest to
    your slide.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_159_1.png)


    Figure 10-2 A movie running on a grayscale background


    ## MEMO


    ## Performance Considerations


    When selecting a picture to use for the background, be careful not to use something
    that competes with the movie. In Figure 1-2, the background photo has lighter,
    more subtle features, which makes it easier to adjust in grayscale. This type
    of image is better than a close up of an image with bold, well-defined lines that
    would detract from, not complement, the movie.


    When using movies in a PowerPoint 2007 presentation, remember that too much activity
    on a slide can completely halt the movie''s ability to play. By using a number
    of movies or animated clip art items can increase your presentation file size,
    which could lead to performance issues as well. To improve your presentation''s
    performance:


    - 1. Go to the Slide Show tab.

    - 2. In the Monitors group, click the down arrow in the Resolution field.

    - 3. Select 640x480 (Fastest, Lowest Fidelity).


    This option speeds up the performance while lowering the fidelity of the presentation.
    You will need to run the slide show in its entirety to see how clarity is affected.
    If the change is too dramatic, you can select the Use Current Resolution option
    or try the other options: the 1024x768 (Slowest, Highest Fidelity), which offers
    a crisp image but slows down the performance, or the 800x600 option, which is
    the “middle ground” between the two options.


    As a reminder, if you''re sending the presentation via email, be sure to zip or
    compress it before sending to ensure it goes through as fast as possible.


    In this chapter, you learned about when to consider movies as an option in your
    presentation, along with compatible file formats and conversion options. You also
    learned how to insert a movie or animated GIF into your presentation. You also
    saw two examples of using animated clip art with a movie or a picture as the background
    to the movie. In the next chapter, you''ll learn about many ways to use sound
    to enhance your presentation even more.


    ## Adding Sound To Your Presentation


    Like movies, sound can also add some life to your presentation. Whether you''re
    trying to establish a mood, offer a narration, or simply drive home an important
    point, sound can give some sizzle to the steak. In this chapter, you''ll learn
    how to insert sound files, how to start and stop the sounds, and how to set up
    objects and text to trigger the sounds. You''ll also learn how to add CDs and
    record a narration.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_161_0.png)


    ## When Sound Is Appropriate


    Sound is wonderful when you''re using it to help you make a point. But how many
    websites you have clicked on only to be greeted with blaring sound because you
    forgot to turn down the volume? Startling, isn''t it?

    That''s why prudent with sound is your best bet. If you''re unveiling something
    new and different, a drum roll is appropriate. If you''ve achieved a significant
    company goal or objective, a little applause is in order. Or if you want some
    soothing background music during your presentation, sound can de the trick in
    communicating your message.


    The bottom line is to use sound for specific reasons to enhance your presentation
    and make your messages memorable.


    ## Supported Sound File Formats


    PowerPoint 2007 supports the following file formats:


    - AIFF audio file Audio Interchange File Format

    - AU audio file Unix

    - MIDI file Musical Digital Interface

    - MP3 audio file MPEG Layer 3

    - WAV audio file Wave

    - WMA audio file Windows Media


    If your sound is not in these formats, you can convert it to one of these using
    a utility.


    ## Inserting Sound Files


    PowerPoint 2007 offers the following options:


    - Sound From File This lets you insert sound.

    - Sound From Clip Organizer You can choose from sounds like.

    - Play CD Track You select the CD track.

    - Record Sound This allows you to record your own.


    Now, we''ll insert the sound from the Clip.


    - 1. Go to the Insert tab.

    2. In the Media Clip group, click Sound.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_164_0.png)


    - 3. Click Sound From Organizer.

    4. Select the sound you want to insert into the presentation. A sound icon will
    appear on the slide.


    When you insert the sound, a PowerPoint dialog box (shown next) asks when you
    would like the to play. Your options are:


    - Automatically Your sound will play when the slide appears.

    - When clicked When you click the sound icon, your sound will play. This is also
    known as a.


    ## MEMO


    Be sure the sound file is long enough to play across the number of slides you
    need. You''ll find the sound time in the Play Sound box on the Settings tab. If
    you''d like to repeat the sound, check the Loop Stopped checkbox on the Sound
    Options group. The sound will continue playing until you find it easy to add sound
    after your presentation is completed, that way you''ll know when you want to add,
    remove, or loop the sound.


    ## Performance Considerations


    PowerPoint offers another option on the Sound Options tab. Go to the Sound Options
    group and select Play Across Slides. This option plays the sound in its entirety
    one. (If you''d like to play the sound continuously, check the Loop Stopped checkbox
    in the Sound Options group.)

