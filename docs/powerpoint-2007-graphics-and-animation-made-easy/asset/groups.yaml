    ## PowerPoint 2007 图形与动画快速上手


    图形。然而，在图 1-11 中，布局变得复杂得多。它使用了与图 1-10 相同的布局，但添加了 PowerPoint 主题，使得查找信息变得困难得多。


    因此，虽然某种布局在一种情况下看起来很极了，但在另一种情况下可能效果不佳。在创建布局时，只需记住这些事情，你很快就能在问题发生之前就发现它们。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_22_0.png)


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_22_1.png)


    图 1-10 纯色背景简单布局


    图 1-11 相同的布局但应用了 PowerPoint 主题和深色波浪背景


    链接：Graphic Design Solutions, Third Edition, by Robin Landa, Delmar Cengage Learning,
    2005


    ## PowerPoint 工作区


    当你设计 PowerPoint 布局时，你是在一个 PowerPoint 工作区内工作，该区域包含四个关键区域。如图 1-12 所示，PowerPoint
    工作区的四个区域为：


    - 幻灯片窗：在这里，你可以直接访问并处理演示文中的单个幻灯片。幻灯片窗用于设计实际幻灯片布局——你会添加占位符来创建设计。

    - 占位符：用于插入动画、文本、图表、图片和其他对象。

    - 幻灯片选项卡：你可以在这里查看每个幻灯片的缩略图。你可以在区域添加或删除幻灯片，或者点击并拖动缩略图来重新排列幻灯片。

    - 备注窗：你可以使用此部分输入关于特定幻灯片的备注。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_23_0.png)


    **备注**

    备注在演示时不会出现，但它们可以出现在演示文的打印版本中，并在放映视图中显示。


    图 1-12 PowerPoint 工作区包含四个工作区域。


    ## 向演示文中添加幻灯片


    在构建演示文稿时，你需要向其中添加幻灯片。要执行此操作，请遵循以下步骤：


    1. 转到“开始”选项卡。

    2. 点击“幻灯片”组中“新建幻灯片”按钮上的幻灯片图标。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_24_0.png)


    带有标题和文本区域的“标题和内容”幻灯片将自动放入你的演示文中。如果你只是想复制幻灯片并更改其中的几个项目，请按照以下步骤操作：


    1. 在“新建幻灯片”选项卡上选择要复制的幻灯片。

    2. 点击“新建幻灯片”命令旁边的箭头。

    3. 点击“复制所选幻灯片”，复制的幻灯片将自动为你添加。


    如果你想添加完全不同类型的幻灯片，请按照以下步骤操作：


    1. 转到“开始”选项卡。

    2. 点击“新建幻灯片”命令旁边的箭头。

    3. 从 Office 主题库中选择一种幻灯片格式。

    4. 点击你的选择将其添加到演示文中。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_24_1.png)


    第 1 章 创建惊艳的幻灯片布局


    **备注**

    如果你还没有选择布局或添加占位符，幻灯片母将是为空的。如果你已经在处理布局或选择了某种 PowerPoint 布局，则幻灯片母将包含该特定布局的元素和占位符。


    ## 使用幻灯片母和占位符


    PowerPoint 幻灯片母是幻灯片模板的一部分，通过使用占位符存储信息。当你使用幻灯片母时，你可以对单个幻灯片（母版）进行更改，这些更改将应用于整个演示文。例如，如果你想在演示文每个幻灯片的页脚中包含公司
    Logo，你可以在幻灯片母中添加一次，然后 Logo 就会显示在演示中的每个幻灯片上。当你添加新幻灯片时，它们也会包含 Logo。或者，你可以选择只为演示文中的某些类型幻灯片添加
    Logo。


    幻灯片母可以很容易地自定义。在幻灯片母中，布局用于以你喜欢的任何方式定位占位符（例如上述 Logo）。在开始创建演示文之前创建所有的幻灯片母是一个好主意；添加到演示文中的幻灯片始终基于幻灯片母。


    要创建幻灯片母，请遵循以下步骤：


    1. 转到“视图”选项卡。

    2. 点击“演示文”组中的“幻灯片母”。

    3. 工作区中将出现一个空白的幻灯片母，如图 1-13 所示。注意，左侧的“幻灯片母”和“大纲”选项卡已被“缩略图窗”取代，该窗显示了一个母幻灯片和多个布局幻灯片（也称为母版布局）。

    4. 点击 Microsoft 按钮。

    5. 点击“另存为”。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_25_0.png)


    图 1-13 幻灯片母视图


    ## PowerPoint 2007 图形与动画快速上手


    6. 为幻灯片母输入文件名。

    7. 点击模板类型。

    8. 保存。

    9. 转到“幻灯片母”选项卡并点击“关闭”。


    ## 添加新占位符


    要向幻灯片母中添加文本、图形或其他类型的占位符，请遵循以下步骤：


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_26_0.png)


    1. 在缩略图窗中，点击你想要添加的幻灯片。

    2. 转到“幻灯片母”选项卡，点击“插入占位符”旁边的箭头。

    3. 点击你想添加的类型：内容、文本、图片、表格、SmartArt、媒体。

    4. 点击该占位符。


    ## 在占位符中添加自定义文本


    你可能想对使用占位符的单个或多个布局添加自定义文本。如果是这样，请使用幻灯片母遵循以下步骤：


    1. 点击将承载自定义文本的幻灯片。

    2. 在文本占位符中输入自定义文本。例如，你可能希望你的幻灯片显示“在此处添加姓名”，以便其他使用模板的人知道在哪里输入信息。图 1-14 显示了一个示例。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_27_0.png)


    图 1-14 自定义文本的示例


    3. 转到“幻灯片母”选项卡并点击“关闭”。

    4. 转到“开始”选项卡。

    5. 点击“幻灯片”组中的“布局”。

    6. 点击带有自定义文本的幻灯片。PowerPoint 将将其添加到你的演示文中。


    **备注**

    如果你需要删除占位符，只需点击它的边界并按键盘上的 DELETE 键。


    ## 简单方法


    ## 重命名幻灯片母或布局


    要在幻灯片母视图中删除不需要的幻灯片，请右键点击缩略图窗中的幻灯片并选择“删除布局”。


    重命名幻灯片母：


    1. 点击要重命名的幻灯片母。

    2. 转到“幻灯片母”选项卡。

    3. 点击“编辑母版”组中的“重命名”。

    4. 在“重命名母版”对话框中，在“母版”框中输入新名称。

    5. 点击“重命名”。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_28_0.png)


    如果你在幻灯片母中创建一个想要命名的幻灯片布局，请遵循以下步骤：


    1. 在缩略图窗中，点击你想重命名的幻灯片布局。

    2. 转到“幻灯片母”选项卡。

    3. 点击“编辑母版”组中的“重命名”。

    4. 在“重命名布局”对话框中，在“布局”框中输入新名称。

    5. 点击“重命名”。


