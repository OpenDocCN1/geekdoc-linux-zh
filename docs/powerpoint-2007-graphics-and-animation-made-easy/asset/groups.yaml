    # Creating Custom Layouts


    The best PowerPoint presentations are the ones that carefully consider both audience
    and content and provide the best fit for both. Technical audiences, for example,
    aren''t going to be confused by a presentation filled with lots of charts and
    minute details. More general business audiences, however, might fall asleep the
    very first time they see a chart. That doesn''t mean you shouldn''t use a chart
    with a business or academic audience—just that you''ll need to think through a
    custom layout geared to help your audience follow the chart easily or keep their
    attention.


    Every slide in your presentation tells a piece of the overall story. You can move
    audiences from point to point using several slides, or you can cover multiple
    points in a single slide. You can use color to draw attention to a specific item
    on the slide or place bullets in a unique manner to surprise and capture the audience''s
    attention.


    In this chapter, we''ll look at how custom layouts can be used in PowerPoint presentations
    to grab the audience''s attention from the first slide—and keep the audience focused
    throughout the entire presentation.


    # Planning Your Presentation


    When you create a presentation, you''ll save a lot of time and aggravation if
    you create an outline in PowerPoint first. It doesn''t have to be exhaustive,
    but it should be detailed enough so you aren''t constantly trying to figure out
    what to put on your next slide.


    In Chapter 1, we explained the PowerPoint workspace. In that workspace, next to
    the Slides tab, is the Outline tab. Click that, and let''s add a few slides so
    you can see how easily you can create an outline within PowerPoint. To begin adding,
    go to Home | Slides Group | New Slide. Then follow these steps to add a total
    of four slides to a blank presentation:


