    ## 简单方法


    这里是快速更改所选照片的大小和位置的方法。右键点击照片并选择“选择并定位”。从此对话框中，你可以更改照片的大小以及照片在幻灯片上的位置。


    在图 4-4 中，我们由于颜色和线条选择了 Trek 主题。现在，输入你自己的标题，如果需要，选择照片下方的说明并根据需要进行更改。但这些仅仅是说明。如果你想添加更多文本，请添加文本框。让我们更改此布局以包含文本框。


