    # Creating a Shape from the Freeform or Scribble Commands


    In PowerPoint 2007, you can also create your own shapes from the Home tab. As
    we mentioned earlier, a freeform shape has curved and straight segments, whereas
    the Scribble command lets you create smooth curves or give your shapes the look
    of being drawn by hand with a pen. We''re sure you''ll find plenty of uses for
    both of these commands once you start using them in your presentations.


    +   1. Go to the Home tab.

    2. Click Shapes.

    3. From the Lines section, select Freeform.

    4. Create your shape anywhere on your slide.


