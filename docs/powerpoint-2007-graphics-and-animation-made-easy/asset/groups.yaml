    # Fill


    This option allows you to add or change background colors in your graphic.


    +   - Select No Fill to remove backgrounds.

    - Select Solid Fill | Color to see a list of color options. You can also change
    the background transparency by sliding the handle or using the up and down arrows
    next to Transparency.

    - Select Gradient Fill to select from a variety of gradient color options, types,
    and directions.

    - Select Or Texture Fill to add a picture or preset texture to your graphic. You
    can use pictures from your own collection or the PowerPoint Clip Art Collection.
    Select Include Content From Office Online to broaden your options. To make texture
    options appear in the graphic, deselect Tile Picture As Texture.

    - Select Slide Background Fill to make your graphic blend seamlessly with your
    slide.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_82_0.png)


    # Line Color


    You can line your graphics with a solid or gradient line using this option, as
    well as change line colors and transparency.


    # Line Style


    When you add lines to a graphic, you can manage the width, type, and style of
    the line using this option. Play with the Cap and Join types to modify the look
    of the edge or corners of the line. You won''t be able to add arrows that you''ve
    outlined using this option, but if you''re just working with a single line shape,
    this is where you would go to add arrows to a straight line.'
  - '[PAGE 83]


    # Shadow


    Want your graphic to cast a shadow? Select this option, and choose from either
    Preset options or set the shadow yourself using the Transparency, Size, Blur,
    Angle, and Distance features. One way to make a shadow stand out: Change your
    color using the Color blend.


    # 3-D Format


    When you apply a 3D format to a graphic, it can make your graphic pop off the
    page. This option is really terrific when working with cartoons, but try anyway
    if you''re looking for a way to make a graphic stand out. Sometimes this option
    can make a simple graphic look like a very cool button. 3-D Format selected, you
    can choose from Bevel, Depth, Contour, and Surface options.


    # HOW GRADIENT STOPS WORK


    Gradient stops like something fancy but are really just what the name says: They
    tell PowerPoint to stop various colors so the color can begin. Most people assume
    that gradients only come in two colors, you can actually have up to ten gradient
    colors within a graphic.


    Each gradient stop has a color associated with it, as well as a stop transparency
    option. The stop position is what limits the particular gradient stop to a specific
    location in the graphic; transparency dictates how bright or muted that portion
    of the gradient will be. In Figure 5-7, you can see a variety of gradients applied
    to the background of the volleyball scene. These were applied by adding ten gradient
    stops and applying a different color, position, and transparency to each.


    To add gradient stops to a graphic, right-click the graphic and click Format Picture.
    In the Format Picture dialog box, click Add. Our recommendation


    is to add color first using the Color blend, and then set the stop position by
    sliding the Stop Position handle or using the up and down arrows. Set transparency
    in the same way. Go ahead and play with this—will be pleasantly surprised how
    easy it is to add multiple colors to your graphics.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_83_0.png)


    Figure 5-7 In this enlargement of the volleyball scene, you can see numerous gradations
    in the background.'
