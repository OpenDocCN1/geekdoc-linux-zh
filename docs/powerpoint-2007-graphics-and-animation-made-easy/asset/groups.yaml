  - '[PAGE 73]


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_73_0.png)


    # Working with Clip Art


    When you think of adding graphics to a presentation, do you automatically think
    of using the clip art provided in PowerPoint? That''s not unusual. In fact, many
    people rely solely on clip art for presentations. It''s easy to find clip art
    to suit your needs, and it can illustrate a point in a fun way. That''s why people
    use clip art in a presentation, by the way, to liven up a slide in some way and
    complement text.


    Most clip art comes in the form of illustrations, line drawings, cartoons, or
    the term also includes photos, movies, sounds, or website icons. Before clip art
    became available through the Internet, artwork was actually cut out or "clipped"
    from books—hence the term clip art. The graphic would then be used to accompany
    the text in magazines, books, or other printed media. Today, of course, clip art
    can be used digitally on websites, in online newsletters or magazines, and in
    PowerPoint presentations.


    There''s more to clip art, however, than just dropping in a cute cartoon from
    the Clip Art Collection. You can manipulate the colors in the art, twist the art
    around, find art from Office Online or on the Internet, and use shared collections
    of clip art from corporate networks. In this chapter, we''ll explore all those
    options and give you a few more tips, too.'
- md: "\n## Where to Find Clip Art\n\nYou can find clip art in different places. Most\
    \ people go immediately to the Clip Art Collection, but if you stop there, you\
    \ might just be missing out on some terrific clip art that can make the difference\
    \ between a cheesy presentation and an imaginative one. Here are the places where\
    \ you want to just find the right graphic for your presentation.\n\n## Clip Art\
    \ Collections\n\nWhen you want to add clip art to a slide, the steps are very\
    \ simple. Go to Insert | Illustrations | Clip Art and simply select the clip art\
    \ you want from the pane that opens on the right side of your screen, as shown\
    \ in Figure 5-1.\nThis pane is the Clip Art pane. From it, you can access four\
    \ different types of clip art collections:\n\n![](img/bf2a856bcd8fc3e8384ecc7137df5347_74_0.png)\n\
    \n- My Collections, which holds clips that you can create or add to your own collection.\n\
    - Office Collections, which holds clips offered with Microsoft Office 2007.\n\
    - Shared Collections, which includes clips typically available on shared servers\
    \ or common workstations. A network administrator must create and export the collection\
    \ for use.\n- Web Collections, which are clips available through the Microsoft\
    \ Office Online collection.\n\nWhen you use the Clip Art pane, you can enter search\
    \ terms, tell PowerPoint where to search, and specify the file types you want\
    \ to look for.\n\n## Clip Art on Office Online\n\nTo access clip art from Office\
    \ Online, you need to be connected to the Internet. If a search in the Clip Art\
    \ pane doesn't yield what you're looking for, click Clip Art On Online at the\
    \ bottom of the Clip Art pane.\n\nThis takes you directly to the Clip Art section\
    \ of Microsoft Office Online, as shown in Figure 5-2. Here, you can download free\
    \ clip art, animations, and sounds.\n\nNotice in the left pane called Clip Art\
    \ Resources. This is a terrific resource, especially the Clip Art Tips & Help\
    \ section. It's worth checking out when you have a little time to play around.\
    \ At the top of the page you have a search function that lets you search all of\
    \ Office Online for clip art. This search option is far more expansive than the\
    \ one provided within PowerPoint, so this is a great place to look for additional\
    \ clip art if you don't find what you need during your initial search. You can\
    \ also use the Browse Clip Art And Media Categories section of the page to narrow\
    \ your search into preselected categories.\n\n![](img/bf2a856bcd8fc3e8384ecc7137df5347_75_0.png)\n\
    \nFigure 5-2 Microsoft Office devoting on an entire section to clip art.\n\n###\
    \ THE EASY WAY\n\nUnder Search In, most people leave where selected as the default.\
    \ To speed up the search process, you can remove the checkmark from box and choose\
    \ specific file types instead. Choosing a media file type is also a good idea\
    \ so you don't wind up with a movie, for example, when you just need a simple\
    \ piece of clip art.\n\n- Organize clips...\n- Clip art on Office Online\n- Tips\
    \ for finding clips\n\n## MEMO\n\nPowerPoint will fill downloaded clip art into\
    \ one or more folders based upon the tags provided by Microsoft Office Online.\
    \ The next time you perform a Clip Art pane search using any of these tags, such\
    \ as Animals, Maps, Travel, and so on, the clip art will appear.\n\nTo download\
    \ from this site, you'll need to install ActiveX Control for Office Online. It's\
    \ very fast, and instructions are provided on the site. Once that's done, you've\
    \ selected one or more clips of clip art, a Selection Basket will appear in the\
    \ left pane as shown.\n\n## Selection Basket\n\nSelected Items: 1  \nDownload\
    \ size: 533 KB (1 min @ 56 Kbps)\n\n- Review basket\n- Download Item 1\n\n###\
    \ THE EASY WAY\n\nIf you're searching for clip art and decide that you want to\
    \ download the clip from a single Office Online page, don't bother selecting photos\
    \ one by one. Instead, click Select in the bottom-left corner of the search results.\
    \ All items on the page will be selected and placed in your Select Basket for\
    \ download. The Page option will change to Deselect Page; click it to deselect\
    \ those items so you can move on in your search.\n\nFollow these steps to download\
    \ the clip art:\n\n- 1. Click Download (1) Item(s). (The actual text will vary\
    \ depending on how many items you've chosen.)\n- 2. From the Download screen,\
    \ click Download Now.\n- 3. Click Open.\n\nBe patient—the download might take\
    \ a while. When complete, the downloaded item(s) will appear on your hard drive\
    \ under My Collections in the Download Clips folder of the Clip Organizer, as\
    \ shown in Figure 5-3. Read “How PowerPoint Organizes Your Clips” to learn more\
    \ about the Clip Organizer.\n\n![](img/bf2a856bcd8fc3e8384ecc7137df5347_76_0.png)\n\
    \nFigure 5-3 Downloaded clips are filed in the My Collections folder.\n\n## Online\
    \ Searches\n\nWhile Microsoft Office Online might provide you with the clip art\
    \ you're seeking, the site doesn't always have what you need. In those situations,\
    \ perform an online search to find and get what you need. Just use your browser\
    \ and search engine (such as Google or Yahoo!) and enter the search terms for\
    \ the type of item you're seeking. One caution: Be sure that anything you download\
    \ from a site other than Microsoft Office Online doesn't have any copyright restrictions.\
    \ Many sites offer free clip art, but some have specific rules for how you use\
    \ that clip art. For example, some sites might allow you to download clip art\
    \ for personal use but not for corporate use. Don't ever assume that you won't\
    \ get caught using unauthorized clip art! We never know when the creator of that\
    \ clip art might be sitting in an audience watching your presentation.\n\n## Chapter\
    \ 5 Working with Clip Art\n\n## Creating Your Own Clip Art\n\nYou can create your\
    \ own clip art, so if you're not finding what you want in any of your searches,\
    \ then maybe it's time to put on the creativity and just make what you want. You\
    \ can create clip art in two primary ways: You draw what you want and scan it\
    \ into your computer, or you can create art using a graphics program such as Microsoft\
    \ Paint, which is included with Windows Vista. \n\n### HOW POWERPOINT ORGANIZES\
    \ YOUR CLIPS\n\nPowerPoint has another item that sounds similar to the Clip Art\
    \ pane: The Clip Organizer houses many of the clips you've downloaded. Every time\
    \ you add clip art to your collections, you can organize them into different folders.\
    \ The Clip Organizer is a great place to manage your clip art and ensure you can\
    \ find what you need quickly.\n\n| Feature | Description |\n| :--- | :--- |\n\
    | Clip Organizer | Houses many of the downloaded clips |\n| Folders | Based on\
    \ tags provided by Microsoft Office Online |\n| Tags | Used to categorize and\
    \ filter clip art |\n\nThe next time you perform a Clip Art pane search using\
    \ any of these tags, the clip art will appear.\n\nWant a transparent background\
    \ in your clip art? Save the graphic as a new image, and then use the transparent\
    \ feature in your graphics program to turn the background transparent. Resave\
    \ the new graphic to your hard drive. You can add drop shadows the same way; simply\
    \ rescue your graphic with different names and apply the various features you\
    \ want.\n\nOnce you're ready, the sky is the limit. Create a simple housing scene,\
    \ for instance, using the rectangle shape for house frames, the line drawing tool\
    \ for brushes, oval and circle shapes for trees or flowers, and coloring tools\
    \ as desired. Once your drawing is complete, save it to your hard drive as a graphic\
    \ file (GIF, TIFF, JPG, for example).\n\nThen, to add the new clip art to your\
    \ Clip Organizer, Windows Vista can follow these steps:\n\n1. Open the Clip Organizer.\
    \ (To open the Clip Organizer, type Clip in the Windows Vista Search box, and\
    \ then click Microsoft Clip Organizer to open it.)\n2. Select File | Add Clips\
    \ To Organizer.\n3. In the Import dialog box, select the folders.\n4. Click OK.\n\
    \n![](img/bf2a856bcd8fc3e8384ecc7137df5347_77.png)\n"
  mdcn: "\n\n## 在哪里寻找剪图\n\n你可以在不同的地方找到剪图。大多数人会立即前往“剪图收藏夹”，但如果你只停留在那里，你可能会错过一些极佳的剪图，这些素材可以让你的演示文稿从平庸变得富有想象力，反之亦然。以下是你为演示文稿寻找合适图形的地方。\n\
    \n## 剪图收藏夹\n\n当你想向幻灯片中添加剪图时，步骤非常简单。转到“插入 | 图形 | 剪图”，并只需从屏幕右侧弹出的窗格中选择你需要的剪图，如图\
