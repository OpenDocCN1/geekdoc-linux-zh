    # PowerPoint 2007 Graphics and Animation Made Easy


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_46_0.png)


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_46_1.png)


    Figure 3-6 A simple white frame highlights this picture.


    Figure 3-7 A black border offers a different perspective.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_46_2.png)


    Figure 3-8 An oval border with soft edges tones down the picture.


    > Link If you need pictures for your presentation, you can find them online in
    the Clip Art section of Microsoft Office Online. You can also type royalty free
    in your favorite search engine and you''ll find a number of sites that offer unlimited
    use of their photos. Some of these sites are free, whereas others charge fees.
    Never use a photograph in a presentation if you don''t have the proper permission
    to use it.


    # Chapter 3 Illustrating with Pictures


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_47_0.png)


    # MEMO


    # Creating Picture Shapes


    Can''t find the Picture toolbar? Simply select the picture and click the Picture
    Tools tab in red (shown above) at the top of your main toolbar.


    Picture Shapes offer an easy way to make a statement with your pictures. For example,
    if you want to send a message to stop or halt, you can use an octagon, or stop
    sign, shape. Or, if you want to progress, your picture as an arrow or use shape
    from the Flowchart, Picture Shapes let your pictures tell the story in an interesting
    way, which is a subtle but fun way to grab an audience''s attention.


    - 1. From the Picture Tools toolbar, select the Picture Shape in the Picture Styles
    command group.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_47_1.png)


    - 2. Select the shape you want to use.


    The shapes shown in Figures 3-9 and 3-10 help set the mood of their respective
    picture. Any effects you''ve added to your picture will remain when you change
    the picture shape.


    35


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_48_0.png)


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_48_1.png)


    Figure 3-9 This wave shape from the Stars and Banner section in Picture Shapes
    flows easily across the page.


    Figure 3-10 This cloud from the Basic Shapes section in Picture Shapes calls attention
    to a beautiful smile.


    # READY, AIM, SHOOT!


    Now that you''re more familiar with using pictures in PowerPoint 2007, let''s
    take a moment to look at how you can take the best pictures possible. Although
    you can create numerous styles, effects, borders, and so on, to communicate your
    message, starting with a good picture is always your best bet for ending with
    an eye-catching presentation.


    The first thing to understand is that spontaneous, unexpected moments sometimes
    produce the best pictures. No matter how much you plan, these moments can be readily
    captured when you have some photography basics under your belt. Every professional
    photographer will tell you that being aware and knowing your camera is the best
    way to get those candid, impromptu moments on film or captured in your digital
    camera.


    Every camera has its own nuances, and the way to understand these slight variations
    is easy: Spend time with your camera. Don''t just read the instructions and wait
    for a good opportunity. Play! Take your camera to wherever you are for a while
    and start shooting. Short of dropping it, you can''t break it, and practice. If
    it''s digital, you won''t be wasting film as you shoot. Learn about the different
    camera modes and the strength of your flash and when to use it. You''ll start
    getting the feel for your own camera, which means that when the opportunity comes
    along, you''ll be prepared and knowledgeable about the needed technical details.


    A basic photography book will show you how to hold your camera, keeping your arms
    close to your sides to steady yourself and focus your pictures. You may also invest
    in a tripod for situations that offer plenty of time to plan and set up. So...start
    shooting!


    # # Cropping, Sizing, and Framing


    ## Pictures for Maximum Effect


    Resizing and framing pictures in PowerPoint 2007 means you can focus on what matters
    most—whether it is your child''s bright smile, a business executive, or a group
    of friends laughing at dinner. When you edit pictures, you can add pictures styles,
    shapes, and borders in a variety of combinations.


    The beauty of cropping, sizing, and framing pictures means you can take a so-so
    picture and make it stand out on the slide. Don''t depend on these commands too
    much though. As you just learned, you''re better off starting with a great picture
    and using these commands to enhance the photograph, rather than vice versa.


    ## Cropping and Sizing


    The basic difference between cropping and sizing is changing the content of the
    picture versus changing the size of the picture. *Cropping* means you remove portions
    of the picture such as excess space that isn''t relevant. *Sizing* is simply making
    the picture bigger or smaller than its original.


    You can crop pictures in two ways from the Picture Tools Format toolbar: dragging
    the markers or by setting the height and width in inches.


    To crop by dragging the markers, follow these steps:


    - 1. Click Crop in the Size command group.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_49_0.png)


    - 2. Move your cursor to one of the markers.


    - 3. Drag the markers to resize the picture.


    - 4. Use the 4-way arrow to move the picture on the slide.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_50_0.png)


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_50_1.png)


    **Figure 3-11** Drag markers to size the picture.


    **Figure 3-12** An example of a cropped picture that focuses on the subject


    In Figure 3-11, the crop markers can be dragged easily to the appropriate size.
    Figure 3-12 displays the result of a tighter, more focused picture.


    To crop to size in inches, you can adjust your photo using the Size command group
    or the Size and Position dialog box. The Size command group is fast and easy,
    whereas the Size and Position dialog box gives you more options to select from
    as you crop the photo. For example, you can crop the photo but also its aspect
    ratio, tell PowerPoint to select the best scale for a slide show, position the
    photo differently on the slide, and even add alternative text for the photo if
    it will be used on a website presentation.


    To use the Size command group, just use the up and down arrows to make changes
    in the Height and Width boxes on the toolbar.


    # MEMO


    > At the bottom of the Size tab in the Size And Position dialog box, you''ll be
    able to see the original size of your photo. Click Reset and you can instantly
    reset your photo to that original size.


    # Chapter 3 Illustrating with Pictures


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_51_0.png)


    To crop a photo using the Size And Position dialog box, follow these steps:


    - 1. Click the diagonal arrow at the bottom-right corner of the Size command to
    display the Size and Position dialog box.

    - 2. Adjust the height and width in the Size And Rotate section.

    - 3. Click Close.


    # TO CROP OR NOT TO CROP


    To crop or not crop? When deciding whether to crop or not, take a step back and
    look at the picture again. What stands out most? What part of the photo do you
    want to highlight or focus on? Consider the Rule of Thirds, which was created
    by Renaissance painters who wanted a picture to tell a story. The Rule of Thirds
    states that if you mentally divide the picture with two vertical and two horizontal
    lines, all evenly spaced, you will create a grid of nine sections. To create the
    most aesthetically pleasing composition for your picture, the object you want
    to highlight should be placed at the intersection(s) of the lines. If you have
    a horizontal subject, it should lie on one of the horizontal lines. Vertical subjects
    should lie on one of the vertical lines. By not centering your subject exactly
    in the middle, you can crop your picture in the most interesting, inviting way.
    Basically, the Rule of Thirds can take your


    from blah to bam! Knowing this basic rule of photography will significantly increase
    the impact of your pictures. Remember this when looking at photos in a gallery
    or in your local library, and you will see the pattern. And remember, even the
    most famous painters used this rule of composition to design intriguing and interesting
    works of art.


    > For more information on the Rule of Thirds, see Langford''s Basic Photography,
    Eighth Edition: The Guide for Serious Photographers, by Michael Langford, Anna
    Fox, and Richard Sawdon Smith, Focal Press, 2007.


