    - 简报（Briefings）：关于相关人物、公司以及感兴趣的技术或主题的简短非技术背景介绍

    - 备忘录（Memos）：边注、提示和提醒，提供实用的建议或警告潜在的风险

    - 轻松方法（The Easy Way）：提供关于使用功能最佳方法的实用贴士，让你更轻松地完成任务


    在阅读每一章时，请留意这些有用元素。


    ## 创建引人注目的幻灯片布局


    PowerPoint 2007 是一个极佳的工具，可以帮助他人以令人深刻的方式理解并记住信息。通常，PowerPoint 演示由幻灯片组成，依靠文字（文本）和图像（图形和/动画）的组合来传递观点。你组合这些元素的方式形成了幻灯片的设计（布局）。布局对于使幻灯片易懂且难忘至关重要。


    通过结合幻灯片上的文本和视觉对象，你可以将信息传递给观众的每一个成员。然而，有效使用 PowerPoint 图形和动画的技巧是以美观的方式将对象放在幻灯片上。例如，单个幻灯片上的对象过多，观众可能会丢失你试图表达的观点。但使用良好的单个对象将成功吸引观众注意力并传递信息。


    在本章中，我们将介绍一些设计概念，帮助你尽可能有效地布局文本、图形和动画。理解排版、设计原则和布局设计的基础，为使用 PowerPoint 2007 创建强大的演示文稿奠定了基础。


    ## 理解排版


    排版最最形式的形式，是字体设计、字符和排列的艺术与技术。当我们说字体（type）时，我们指的是幻灯片上的文本——数百年来，人们一直这样称呼页面上的文本。文本应该出现在页面上，产生一个可读、清晰且视觉上令人愉悦的整体，让读者轻松在页面上找到他们想阅读的内容。


    过去，排版是一项非常专业的职业。创建文本、设计页面并进行打印设置需要特殊的技能和知识。文本并不是直接扔在页面上的；而是经过仔细设置以强调某些故事或插图。这种强调经过深思的设计，旨在让读者快速找到页面的要点，并引导他们查看同一页上的其他信息。目标当然是提供一个令人记忆的故事，让读者留住提供的信息——就像你制作
    PowerPoint 幻灯片一样。图 1-1 显示了一个由排字工人设计的 1949 年报纸页面示例。印刷内容的排列和外观经过仔细构建，以给读者留下深刻印象。


    看文本（标题）如何通过最大的字号将读者的注意力引向最重要的故事（至少根据编辑的观点如此），并用较小的字号处理次要故事？布局并不滑稽，但它传达了观点。Dinwiddie
    的退休和当地河流发现的骨骼是读者需要注意的最事项，而血库和公司简介次要重要。你的眼睛首先被 Dinwiddie 和骨骸吸引，然后是其他故事。


    （注：此处后续原文存在大量 OCR 重复内容，已根据要求进行处理，不再重复输出。）


