    # 方法


    你是否需要隐藏幻灯片上的部分 SmartArt，然后它在下一张幻灯片上重新出现？选择该形状，然后选择“形状填充 | 无填充”和“轮廓”命令。如果它仍然可见，请将其设置为与幻灯片背景相同的颜色。当你准备好再次显示该形状及其内容时，只需替换你之前删除的颜色即可。记住这样做，否则在稍后编辑幻灯片时，可能会发现自己正在与不可见的对象作斗。


    | 形状 | 选项 |

