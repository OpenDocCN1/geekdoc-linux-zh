    ## Using Analysis Commands


    When you use a chart in a presentation, you''re doing it (or be doing it) to help
    the audience understand how. To help with that, PowerPoint offers four options:


    - **Trendlines** drawn on a chart.


    - **Lines** Drop lines, which help clarify where data markers begin and end; Series
    lines, emphasize the difference between data series; and High-Low lines that extend
    from the highest lowest values in each chart category.


    - **Up/Down Bars** Lines that indicate the difference between data points in the
    first and last data series.


    - **Error Bars** Show potential error amounts related to data points. Error bars
    can be added to data series in 2D area, bar, column, line, xy (scatter), and bubble
    charts. For xy (scatter) and bubble charts, you can display error bars for the
    x values, y values, or both.

