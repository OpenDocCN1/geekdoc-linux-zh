    # 简单方法


    ## 使用“调整”命令


    你可以在“我的图片”文件夹中创建不同的文件夹来帮助整理照片。只要你按照适合自己的方式进行分类，就能快速、轻松地找到你的照片。


    使用“调整”命令组，你可以更改图片以创建你喜欢的氛围或特殊效果。这些命令包括：


    - **亮度**：让你的照片在幻灯片上更加融合或更突出

    - **对比度**：增加或减少照片的强度

    - **重着色**：创建与幻灯片布局匹配的有趣颜色效果

    - **压缩图片**：用于打印、屏幕查看以及减小以供电子邮件共享的体积


    让我们来看看如何使用其中几个命令来为你的照片营造氛围。如图 3-1 所示插入你的图片。


    插入图片后，按照以下步骤操作：


    - 1. 选择“亮度”命令，并将亮度更改为 +20%。

    - 2. 选择“对比度”命令，并将对比度更改为 +40%。

    - 3. 选择“重着色”命令并选择一种颜色。图 3-2 中的颜色是“强调色 6 变体”。深”。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_41_0.png)


    图 3-1 插入你的原始图片。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_42_0.png)


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_42_1.png)


    图 3-2 更改了亮度、对比度和颜色后的相同图片


    图 3-3 具有亮度变体的相同图片


    你的图片应该显示出显著变化，如图 3-3 与图 3-2 的区别。


    图片会增加你的 PowerPoint 2007 文件的大小，因此请考虑使用“调整”组中的“压缩”命令。这将节省硬盘空间并缩短下载时间，同时保持图片质量。你可以压缩选定的图片或演示中的所有图片。PowerPoint
    2007 的压缩默认设置是在保存幻灯片时自动压缩图片，并自动删除图片的裁剪区域。要更改默认设置，请选择“调整”组中的“压缩”，选择“选项”，并点击你想要更改的项目。


    # 简单方法


    如果你对更改不满意并想重新开始，请点击“调整”命令组中的“重置图片”。这会将你的图片重置为原始大小、亮度、颜色和对比度设置。想更换照片并使用另一张吗？点击“图片”直接转到“插入图片”对话框。


    ## 添加图片效果


    在为图片添加效果时，你可以从六种不同的效果类别中选择。PowerPoint 的默认设置永不对图片应用任何效果，因此如果你想对照片进行一些酷炫的操作，必须选择该选项。将光标悬停在每个类别中的各种选项上并观察。


    # 想象一下……


    图片在以文本格式呈现信息时可以起到重要作用。文本对于与观众交流是必须的，但如果没有进行美学设计使其易于理解，它可能会令人困惑。项目符号是分隔文本的一种方法，另一种方法是将它们策略地放置在幻灯片上。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_43_0.png)


    你可以通过使用彩色背景并在上方覆盖文字来快速吸引读者。这张照片的亮度和对比度经过调整，以确保文字清晰可见。如果你以这种方式使用照片，请调整亮度和对比度以确保文字清晰。风景图片通常适用于这种用途。许多风景照片在明暗区域之间有足够的对比度，因此你可以在幻灯片上安排清晰可见的文字。如果你决定选择某个特定选项，PowerPoint
    2007 的“实时预览”将向你精确展示图片的样子。以下是效果类别及其功能：


    - **阴影**：允许你为图片添加内影、外影或透视阴影。

    - **反射**：产生你照片的不同镜像。你可以从九种变体中进行选择。

    - **光晕**：让你的图片看起来非常亮亮。PowerPoint 有一个预设颜色库，你也可以点击库中的“更多光晕”来创建你的个性化光晕。

    - **软边缘**：允许模糊图片的边缘。随着软化，图片将减少多达 50%，取决于你选择的点数。

    - **斜面**：对你的图片应用不同的选项。有些是软的、具有深边缘、某些角度等。你可以为你的效果创建并添加 3D 选项。

    - **3D 旋转**：允许你立即为图片添加预设效果。


    ## 使用“调整”


    在“调整”选项卡中，你可以更改图片以创建或制作喜欢的特殊效果。

    - **亮度**：让照片与背景融合或从背景中脱出来

    - **对比度**：创建与你的照片匹配的有趣颜色效果

    - **锐度**：用于打印屏幕筛选或减小溢出部分


    另一个选项是在带项目符号的文本中添加图片。在幻灯片上插入带框的圆形图片可以增加趣味性。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_43_1.png)

