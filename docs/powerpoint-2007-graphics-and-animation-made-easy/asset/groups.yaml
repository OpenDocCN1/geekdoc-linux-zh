    # About the Authors


    S. E. Slack is a lifestyle and technology writer and author with more than 17
    years of experience in business writing. Since the early 1990s, she has been a
    fan of PowerPoint. She has used it extensively in both professional and personal
    settings and has trained others on how to use its various features. As a communications
    professional, she is skilled at using graphics and animations to support a point
    without detracting from the message at hand. She uses PowerPoint 2007 regularly
    and has created more than 50 online training clips on the topic.


    As a writer with more than 25 years of experience, Michelle I. Zavala is proficient
    in creating PowerPoint presentations in the business environment. She enjoys telling
    client stories in dynamic, interesting ways and credits PowerPoint 2007 for adding
    more punch to even the simplest presentations. She has developed PowerPoint presentations
    for a variety of audiences including customers, corporate executives, and stakeholders.


