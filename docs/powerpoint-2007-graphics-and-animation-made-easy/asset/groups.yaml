    ## PowerPoint 2007 Graphics and Animation Made Easy


    - 3. Click Movie From File.

    4. Select the movie you want to insert into the presentation.

    5. Click OK.


    You can also double-click the movie file to insert it into your presentation.

    You''ll see a Microsoft PowerPoint dialog box that asks you when you like to have
    the movie play. Your options are:


    - Automatically: This option means your movie plays when the slide displays. By
    using other media effects like animation, the movie will play after the animation.
    You can pause the movie by clicking it; restart it by clicking again.

    - When Clicked: This option means your movie will play when you click it. This
    is also known as a trigger.

    - Play Across Slides: This option plays the movie for the length of the movie
    file one time. It does not play the movie more than once. (To play the movie continuously,
    check the Loop Until Stopped checkbox in the Movie Options group.)


    ## THE EASY WAY


    Want to be sure your movie plays for the entire presentation? From the Animations
    group, select Custom Animations. In the Play Movie dialog box, enter the 999 in
    the After field. This number appears as the default and is the maximum number
    you can enter. By doing this, you won''t have to adjust the value if you add or
    delete slides in the presentation.


    You can make changes to these options later, depending on how you want the movie
    to play. If you select the Play Across Slides option, you will need to go to the
    Animations tab. From the Animations group, go to the Animation | Custom Animation
    Pane. Click the line with the triangle, and then click the down arrow and choose
    Effect Options. You''ll see the Play Movie dialog box.


    ## Chapter 10 Adding a Movie to Your Presentation


    On the Effect tab, go to the Stop section and click After and enter the total
    number of slides you want the movie to play across.

    Once you''ve inserted your movie, you''ll see a new toolbar in the Tools Options
    tab. Let''s go through each of the groups and commands on this toolbar.


    In the play group, you can Preview your movie. Click the Preview icon to now see
    your movie in PowerPoint 2007.

    The Movie Options group has a number of commands, including:


    - **Slide Show Volume**: From this command, you can adjust the volume of your
    movie or mute the sound altogether. The default volume is Medium.

    - **Play Movie**: This command lets you select whether to play the movie automatically,
    which we selected, to play when clicked, or to play across the slides.

    - **Hide During Show**: Check this box to hide the sound or movie during the slide
    show.

    - **Play Full Screen**: Use this command for the movie to play on the entire screen.

    - **Loop Until Stopped**: This command sets up the sound or movie to continue
    playing until manually stopped.

    - **Rewind Movie After Playing**: This command automatically rewinds the movie
    back to the first frame once it''s finished playing.


    You can also access these options by clicking the arrow in the bottom-right corner
    of the Movie Options group. You''ll see the Movie Options dialog box that lets
    you adjust your movie according to your needs, along with checking the total movie
    playing time.


    We''ll explore the Arrange group commands later in this chapter, but let''s take
    a brief look at the Size group. As you learned in Chapter 3, the Size group lets
    you change the size of your picture or movie on the slide. You can make changes
    directly in the Size group, or if you click the arrow in the bottom-right corner
    of the log, you''ll see the Size And Position dialog box. You can size, scale,
    crop, or reset your picture to its original size. The Position tab lets you select
    where you want the picture on the slide.


    ## MEMO


    When your movie is highlighted on the slide, you''ll see that the Picture Tools
    Format tab is available. This toolbar offers you the options you learned about
    Chapter 3. Although you can format how the movie displays on the slide when it''s
    not playing in any way you want, the shape of the picture will move to the background
    when the movie plays and the movie will revert to its original shape. When finished
    playing, the movie will return to the shape of the picture.


    ## Inserting a Clip Movie


    You can also insert a clip movie, which is actually an animated GIF file and not
    really a movie. Instead, the file is a number of images that stream to create
    an animated effect.


    - 1. Go to the Insert tab.

    2. In the Media Clip group, select Movie.

    3. Click Movie From Clip Art Pane.


    The Clip Art pane will appear. This pane will be similar to the one you learned
    about Chapter 5, but you''ll be reviewing animated GIFs instead of still clip
    art. (This is because you inserted a Movie From Clip Organizer instead of the
    Clip Art command in the Illustrations group.)


    In the Clip Art pane, hover your cursor above the yellow star in the bottom-right.
    The Preview dialog box gives you a preview of the GIF.


