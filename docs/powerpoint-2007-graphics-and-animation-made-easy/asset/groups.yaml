    # 备忘


    当你使用颜色对话框中的“自定义”选项卡时，请记录下 RGB 或 HSL 字段中的数字，并将它们保存在方便的地方。当你想要再次使用该颜色但不想在以前创建的形状中查找时，这可以节省时间。你也可以在“形状填充”、“形状轮廓”或“字体颜色”命令的下拉框中作为“最近颜色”找到它。


    HSL（色相、饱和度、亮度）。通过拖动垂直条右侧的箭头或调整色板下方的数值来调整颜色。


    PowerPoint 2007 有许多纹理，可以为你的形状提供精美的的填充。通过“纹理”命令，你可以获得许多选项，让你的形状在幻灯片上生动。


    1. 点击形状填充命令。

    2. 选择纹理。

    3. 选择一种你喜欢的纹理。


    图 8-1 使用了编织纹理，图 8-2 使用了白色大理石，图 8-3 使用了橡木纹理。花时间探索它们如何应用于你的演示文，或者从文件或剪贴画添加纹理。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_123_0.png)

    图 8-1 编织纹理

    图 8-2 白色大理石

    图 8-3 橡木纹理


    ## 为形状添加轮廓


    正如你在上一章关于 Word 的节中所学的那样，为对象添加轮廓可以产生巨大的差异。为形状添加轮廓的步骤与 WordArt 类似。从“绘图工具”选项卡，点击“形状轮廓”并选择一种颜色。在这里，你可以调整线条的粗细，并选择想要使用实线还是虚线。


    ## 添加形状效果


    使用形状效果可以为你的演示增添一些趣味。你可以使用这些效果创建微妙的光晕或添加一些深度。反射和柔化边缘是其他帮助你营造幻灯片氛围的选项。让我们来看看通过添加一些颜色和深度来快速更改形状：


    1. 点击形状命令，从“矩形”部分选择一个矩形。

    2. 点击形状填充命令，然后选择“橙色，强调 6，亮色 80%”。

    3. 点击形状轮廓命令，然后选择“红色，强调 2”。

    4. 再次点击形状轮廓命令，然后选择“粗细”和“6 磅”。

    5. 点击形状效果命令，然后“斜角”。

    6. 选择“槽纹”。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_125_0.png)

    图 8-4 斜角


    ## 为形状添加文本


    使用带有文本的形状可以通过文字与形状的迷人结合，真正地针对你想表达的内容。让我们使用以下命令创建一个带有文本的形状：


    1. 选择形状命令，从“块状箭头”部分选择右箭头。

    2. 点击形状填充命令，从“标准颜色”选项卡中选择绿色。

    3. 点击形状轮廓命令，从“标准颜色”选项卡中选择黄色。

    4. 再次点击形状轮廓命令，然后选择“粗细”和“6 磅”。

    5. 点击形状轮廓命令，并选择“虚线”和“方点”。

    6. 点击形状效果命令，然后从“投影”部分选择“透视左上角”。


    ## PowerPoint 2007 图形和动画变得简单


    你可以通过两种方式向形状中添加文本。一种方法是从“插入形状”组：选择“文本框”向你的形状添加文本。你也可以为你的形状添加 WordArt。从“WordArt
    样式”组，选择“快速样式”并选择你喜欢的样式。让我们为你创建的形状添加一些 WordArt 吧：


    1. 使用“WordArt 样式”组中的快速样式，选择“白色，外投影”。

    2. 选中文本并将字体字号增大到 96。

    3. 在选中 WordArt 时弹出的对话框中，选择*斜体*。

    4. 转到“文本轮廓”命令并将颜色更改为黄色。

    5. 转到“文本效果”并选择“发光”。

    6. 点击“更多发光颜色”。

    7. 选择“深蓝色，文本 2”。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_126_0.png)

    图 8-5 显示了形状以及 WordArt 的许多层次和效果。


    ## 编辑和调整形状大小


    有时，你会在特定情况下需要特定的形状。PowerPoint 2007 提供了根据需要编辑和更改预制形状的选项。你也可以从头创建自己的形状。我们将探索这两个选项，以便你在
    PowerPoint 2007 中具有更大的灵活性。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_126_1.png)

    图 8-5 为形状添加 WordArt


    ## 使用标记编辑预制形状


    转到“插入”选项卡。选择“形状 | 公式 形状”并选择“等号”。当形状被选中时，你会在形状框的每条垂直线上看到两个黄色菱形标记。将光标放在左侧的黄色菱形标记上，并稍微向下拖动。注意图
    8-6 中这是如何使线条变细的。现在将右侧垂直线上的黄色标记向上拖动一点。在图 8-7 中，注意线条之间的间距变大了。


    只要你的形状带有黄色标记，你就可以按照你喜欢的方式调整形状。让我们来看另一个我们可以调整的形状。在新幻灯片上，转到“插入”选项卡。然后选择“形状 | 块状箭头”。选择“左右箭头”。向下拖动右侧的黄色标记。向左拖动黄色标记。。图
    8-8 显示了一个根据特定形状需求调整过的预制箭头。


    ## 简便方法


    正在寻找一种格式化形状中文本和其他项目的快速方法吗？右键点击形状并选择“格式形状”。当你从此对话框调整填充、线条颜色、线条样式和阴影时，你还可以对 3D 格式、旋转、图片和文本框进行调整。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_127_0.png)

    图 8-6 使用左侧黄色标记编辑形状


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_127_1.png)

    图 8-7 使用右侧黄色标记编辑形状


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_127_2.png)

    图 8-8 调整过的预制箭头


    ## 创建有效的形状


    使用图 8-4 中的斜角效果可以为你的形状增加维度。


    ## 编辑形状


    当你使用“自由形状”工具创建形状时，可以使用“重新连接线条”命令重新路由任何线条。如果你只想重新路由某条线，请在点击它之前选中该线条。此命令会移动它们连接的所有线条。


    1. 选择形状命令，从“块状箭头”部分选择右箭头。

    2. 点击形状填充命令，从“标准颜色”选项卡中选择绿色。

    3. 点击形状轮廓命令，从“标准颜色”选项卡中选择黄色。

    4. 再次点击形状轮廓命令，然后选择“粗细”和“6 磅”。

    5. 点击形状轮廓命令，并选择“虚线”和“方点”。

    6. 点击形状效果命令，然后从“投影”部分选择“透视左上角”。


    ## 使用自由形状工具编辑形状


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_128_0.png)

    当你使用自由形状工具创建形状时，可以使用“重新连接线条”命令重新路由任何线条。如果你只想重新路由某条线，请在点击它之前选中该线条。此命令会移动它们连接的所有线条。


    1. 选择形状命令，从“块状箭头”部分选择右箭头。

    2. 点击形状填充命令，从“标准颜色”选项卡中选择绿色。

    3. 点击形状轮廓命令，从“标准颜色”选项卡中选择黄色。

    4. 再次点击形状轮廓命令，然后选择“粗细”和“6 磅”。

    5. 点击形状轮廓命令，并选择“虚线”和“方点”。

    6. 点击形状效果命令，然后从“投影”部分选择“透视左上角”。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_128_1.png)

    图 8-9 编辑自由形状中的点


    ## 备忘


    当你使用自由形状工具创建形状时，可以使用“重新连接线条”命令重新路由任何线条。如果你只想重新路由某条线，请在点击它之前选中该线条。此命令会移动它们连接的所有线条。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_129_0.png)

    图 8-10 编辑形状


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_129_1.png)

    图 8-11 编辑形状


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_129_2.png)

    图 8-12 创建形状


    ## 使用自由形状或草画命令创建形状


    在 PowerPoint 2007 中，你也可以从“开始”选项卡创建自己的形状。正如我们之前提到的，自由形状具有曲线和直线段，而“草画”命令允许你创建平滑的曲线或让你的形状看起来像是用笔手画的。我们相信，一旦你开始在演示文中使用它们，你就会发现这两个命令有很多用途。


    1. 转到“开始”选项卡。

    2. 点击“形状”。

    3. 从“线条”部分，选择“自由形状”。

    4. 在幻灯片上的任意位置创建你的形状。


