    # Separately Animate Objects


    To animate objects separately using the Custom Animation pane, follow these steps:


    1. Select the object you want to animate.

    2. In the Custom Animation pane, click Add Effect.

    3. Choose the effect you want (Entrance, Emphasis, Motion Path).

    4. Use the mini-menu to select the effect you want or click More Effects for additional
    options.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_184_0.png)


    That''s it—each item is now separately animated. In the Custom Animation pane,
    each animated object should be numbered separately. Beside each object you''ll
    see icons and identification for the object. For example, in Figure 12-6, each
    object is shown with a mouse icon to indicate the animation will occur on a mouse
    click; a symbol the mouse icon shows whether the animation is an entrance, exit,
    or emphasis; and every object is identified as a different picture.


    Also notice the down arrow in Figure 12-6. Click this arrow, and you''ll see the
    shortcut menu shown in Figure 12-7. This shortcut menu lets you change the effects
    and scheduling of animation. Click Effect Options or Timing and a dialog box will
    appear. The dialog box will be named according to the animation you''ve selected;
    you can select the Effect/or Timing tabs and make the changes appropriate for
    animation in question.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_184_1.png)

