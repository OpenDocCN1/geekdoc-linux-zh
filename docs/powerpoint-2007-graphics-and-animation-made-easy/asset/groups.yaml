    In）。您可以轻松看到这些动画是如何发生的。另一方面，自定义动画窗格提供了更详细的动画选项列表。我们将首先探索“动画”选项，然后查看“自定义动画”窗格提供的可能性。


    # 从动画选项卡应用动画


    如果您只是寻找一种快速为对象添加动画的方法，可以使用选项卡上的“动画”命令组。“动画”命令通过下拉菜单提供三种常用的备选项：


    - 淡出（Fade）：对象将从不可见变为可见。这种动画实际上是淡出的相反，淡出意味着对象将变得变浅。


    图 12-3 自定义动画窗格


    # 简便方法


    实时预览（Live Preview）会在鼠标悬停在三个选项中的任一个上时发生，让您在选择之前快速地看到该动画将如何出现。


    - 擦除（Wipe）：对象的出现方式就像有人在幻灯片上擦拭。

    - 飞入（Fly In）：对象将从幻灯片的底部飞入。


    点击您喜的动画。您可以点击命令组中的“预览”来查看您的动画将如何显示。PowerPoint 将应用默认的“快速”（Fast）速度。要进行更改，转到“切换到幻灯片”组并将速度更改为“慢速”（Slow）或“中等”（Medium）。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_181_0.png)


    # 从动画窗格应用动画


    如果您希望对动画的操作比“动画”选项卡上提供的几个简单选项更多，您需要使用“自定义动画”窗格。此窗格允许您控制项目在幻灯片上的出现方式以及多个效果如何相互影响。选项取决于对给定对象应用的动画，包括：


    - 添加效果（Add Effect）：进入、退出和运动路径选项。每个选项随后都会提供一个供选择的动画备选项项菜单。

    - 移除（Remove）：让您删除应用于对象的动画。

    - 启动（Start）：提供在点击鼠标时、随上一个对象、或在上一个对象出现在幻灯片上一段时间后启动动画的选择。

    - 路径（Path）：提供锁定或解锁路径、编辑路径点或反转路径方向的选项。

    - 速度（Speed）：提供从“非常慢”到“非常快”的动画选项。

    - 大小（Size）：让您选择对象增长的大小和方向。

    - 播放（Play）：让您按需播放动画。

    - 幻灯片放映（Slide Show）：从当前幻灯片开始放映。

    - 自动预览（Auto Preview）：向您展示动画。


