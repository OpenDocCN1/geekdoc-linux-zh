    # 图表概览


    PowerPoint 中的图表会自动链接到 Excel 电子表格，因此当你创建一个新图表时，你会看到屏幕上同时打开一个 Excel 表格。这项巧妙的功能可以轻松更改或添加图表数据；你只需要在相关的
    Excel 表格中进行更新，信息就会自动应用到你的 PowerPoint 图表中。


    PowerPoint 提供了十一种不同的图表供选择。


    | 图表 | 说明 |

    | --- | --- |

    | 面积图 | 将数据放入水平区域中，显示每个部分与整体之间的关系 |

    | 条形图 | 使用水平条形，通过垂直轴上的类别和水平轴上的数值来解释单个数据之间的差异 |

    | 气泡图 | 在图表上散点格式排列数据；比较三组三个值的集合 |

    | 柱形图 | 使用垂直条形，沿水平轴组织类别，沿垂直轴组织数值 |

    | 环形图 | 将数据组织为整个饼的百分比，并可以包含多个数据系列 |

    | 折线图 | 将数据绘制成线，沿水平轴组织类别，沿垂直轴组织数值 |

    | 饼图 | 数据组织方式与环形图类似，但仅包含一个数据系列 |

    | 达图 | 比较多个数据系列的累积值 |

    | 线图 | 按特定顺序排列数据以说明股票价格的波动，也可用于科学数据 |

    | 曲面图 | 显示两组数值数据之间最佳的组合 |

    | XY 图 | 与气泡图类似，但仅比较两组数据 |


    备注

    在 Excel 中创建图表并将其导入 PowerPoint 也是一个简单的过程。更多详情请参阅第 13 章。


    ## 第 15 章将图表作为设计元素使用


    要插入图表，转到“插入”选项卡并点击“插图”命令组中的“图表”。选择你需要的图表类型，并点击“确定”。为了说明，我们选择了 3D 面积图。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_211_0.png)


    一旦你在幻灯片上插入了图表，就会打开一个表格。虽然你可以轻松地使用此表格更改数据或图表信息，但请先将其关闭。我们将在“处理数据命令”中向你展示如何需要打开它。

    你还会注意到，一旦向幻灯片添加图表，就会三个新的功能区选项卡：图表工具设计、图表工具布局和图表工具格式。在接后的章节中，我们将探索每一个选项卡。


    ## 图表工具设计选项卡


    点击你的图表以激活新选项卡，然后点击“图表工具设计”选项卡。它看起来与图 15-1 所示，但如果你选择了与我们使用的不同的图表，特定的图表样式和布局将有所不同。


    ## PowerPoint 2007 图形和动画制作


    从左到右，功能区有四个命令组：类型、数据、图表布局和图表样式。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_212_0.png)


    图 15-1 图表工具设计选项卡


    ## 使用类型选项


    在“类型”命令组中有两个简单的选择：你可以更改图表，也可以将当前图表视为模板。如果你选择“更改图表类型”，将再次看到所有可用图表的选择。只需选择一个新的并点击“确定”。幻灯片上的图表将自动更改。


    如果你想保存并复用特定类型的图表，可以将其保存为图表模板。将图表添加到幻灯片，然后转到“类型”组中的图表工具设计，点击“另存为模板”。选择图表文件夹、为图表输入名称并点击“保存”。


    图 15-2 选择“切换行/列”来更改图表上信息的方向。


    ## 处理数据命令


    当你需要更改图表中的数据时，在数据”命令组中有几个可用选项。例如，如果行和列数据反转，你的图表可能会对你更容易理解。在这种情况下，选择图表并点击“切换行/列”。图
    15-2 显示了简单的更改如何让图表看起来不同。左上角的图表是原始版本，左下角显示使用此命令后的图表。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_212_1.png)


    ## 备注


    要快速更改图中数据系列的绘图顺序，转到图表工具设计选项卡，从“数据”组点击“选择数据”，高亮数据系列并点击“向上移动”或“向下移动”。


    如果你需要将数据移动到图中不同位置，请使用“选择数据”命令。这将打开相应的 Excel 电子表格，同时打开“选择数据源”对话框。此对话框允许你轻松地添加、删除、移动和编辑信息或图表标签。你还可以使用此对话框切换行和列。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_213_0.png)


    如果你只想使用 Excel 电子表格进行更改，点击此命令组中的“编辑数据”以打开表格。当链接的 Excel 电子表格中的数据变化或数据...


    ## 更改布局


    如果你对图表类型满意，但想要不同的布局，“布局”命令组是你要去的地方。例如，如果你选择一个图表元素并从中插入图片，你会非常失望，因为图片无法放入图表元素中。

