    ## A WORD ABOUT GRIDLINES


    You can eliminate, add, or modify gridlines in a chart by clicking the Gridlines
    command in the Axes group. Gridlines can be vertical, horizontal, or depth options.
    For audiences who are viewing the presentation in a large auditorium, try to stick
    with major gridlines as much possible. Minor gridlines can be useful when you''re
    dealing with important numbers that lie between major points on the chart''s grid,
    otherwise they can be distracting for an audience (see Figure 15-11).


    Most charts will come with gridlines as a default; those gridlines are typically
    the best way to display the chart. However, don''t be afraid to play around with
    gridlines to see how they change the look and feel of your chart. In some cases,
    you might just find that adding a depth gridline or removing minor gridlines can
    be the touch you need to make your chart''s information truly stand out.


