    Sally, thank you for believing in me. Your expertise, guidance, and humor made
    this a fun, rewarding experience.


    My thanks to Roger Stewart at McGraw-Hill for taking a chance on me and to Carly
    Stapleton at McGraw-Hill for coordinating the content seamlessly. Thank you also
    to Lee Ann Pickrell for paying attention to the details while making my words
    "gel" consistently across the pages and to Jennifer Kettell for dealing with the
    particulars involved in the technical edit.


    Many thanks to the behind-the-scenes folks who made the hard work look easy on
    the graphics and editing side of things. And thank you would not be complete without
    a shout-out to Neil Salkind, agent extraordinaire, and to Studio B.


    Last but not least, a heartfelt thank you to my family for bringing love and laughter
    into my life, and to God for loving me as only He can and blessing me as only
    He does.


    —Michelle I. Zavala


    ## Introduction


    You know the basics of PowerPoint 2007; now it''s time to create imaginative graphics
    and animations that capture your audience''s attention. As long-time users of
    PowerPoint, we''ve designed this book to help you understand and use graphics
    and animations as easily as possible so you, too, can create professional, polished
    presentations with ease. In this book, you will discover how to create and effectively
    apply SmartArt, WordArt, charts, tables, shapes, and custom animations. You''ll
    also learn how to work with photos, clip art, movies, and sounds to give your
    presentations a distinctive and professional look.


    Along with information on designing general layouts using PowerPoint 2007''s built-in
    features, this book also explains each of PowerPoint''s ten basic graphic and
    animation types. The final part of the book will discuss how to use PowerPoint
    graphics with Excel and Word, as well as how to rehearse your presentation to
    verify your graphics and animations are working perfectly.


    Throughout the book, you''ll find:


    - Step-by-step instructions and practical advice

    - One-of-a-kind tips for creating and applying PowerPoint 2007 graphics and animations

    - Screen captures, photos, and art wherever it is needed so you can visualize
    and understand the topic under discussion

    - Briefings, which are short, nontechnical backgrounders on relevant people, companies,
    and technologies or topics of interest

    - Memos, which are marginal notes, tips, and reminders that offer useful advice
    or warn you about potential hazards

    - The Easy Way, handy tips that provide information about the best way to use
    features so you can accomplish tasks more easily


    As you read each chapter, keep an eye out for these helpful elements.


