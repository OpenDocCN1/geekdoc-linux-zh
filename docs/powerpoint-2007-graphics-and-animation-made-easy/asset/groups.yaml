    ## 合并对象用于单个动画


    要像我们在图 12-5 所示将多个对象作为一个对象进行动画处理，请按照以下步骤操作：


    - 选择你想制作动画的对象，并为每个对象单独应用所需的动画效果。

    - 在自定义动画窗格中，点击你想要创建的组中的第一个对象。按键盘上的 CTRL 键，并点击选择要包含在组中的其他对象。

    - 点击箭头打开快捷菜单；选择“与上一个一起开始”（Start With Previous）。


