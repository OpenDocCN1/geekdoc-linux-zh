    # PowerPoint 2007 图形与动画轻松入门


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_46_0.png)


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_46_1.png)


    图 3-6 一个简单的白色边框突出了这张图片。


    图 3-7 黑色边框提供了一个不同的视角。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_46_2.png)


    图 3-8 带有柔和边缘的椭圆形边框缓了图片的视觉效果。


    > 链接 如果你需要为演示文寻找图片，可以在 Microsoft Office Online 的剪贴画（Clip Art）部分在网上查找。你也可以在自己喜爱的搜索引擎中输入“免版税”（royalty
    free），你会找到许多提供无限使用照片的网站。其中一些网站是免费的，而另一些则收费。如果你没有获得适当的使用许可，切勿在演示文中使用照片。


    # 第 3 章用图片插图


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_47_0.png)


    # 备忘录


    # 创建图片形状


    找不到图片工具栏？只需选择图片，然后点击主工具栏顶部红色的“图片工具”选项卡（如所示）。


    图片形状提供了一种通过图片传达观点的简便方法。例如，如果你想发送一个“停止”或“休顿”的消息，可以使用八角形（即停止标志）形状。或者，如果你想表示进展，可以将图片设为箭头，或使用流程图中的形状。图片形状可以让你的图片以有趣的方式讲述故事，这是一种微妙但趣味的吸引观众注意力的方法。


    - 1. 从“图片工具”工具栏中，在“图片样式”命令组中选择“图片形状”。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_47_1.png)


    - 2. 选择你想使用的形状。


    图 3-9 和 3-10 所示的形状有助于设定各自图片的情绪。当你更改图片形状时，你为图片添加的任何效果都将保留。


    35


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_48_0.png)


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_48_1.png)


    图 3-9 这种来自“图片形状”中“星形和旗帜”部分的波浪形状在页面上流畅地流动。


    图 3-10 这朵来自“图片形状”中“基本形状”部分的云朵引起了人们对美丽微笑的关注。


    # 准备，瞄准，射击！


    现在你更熟悉在 PowerPoint 2007 中使用图片了，让我们花点时间看看如何拍出最好的照片。尽管你可以创建许多样式、效果、边框等来传达你的信息，但从一张好的图片开始始终是你获得引人入目的演示文的最佳选择。


    首先要理解的是，自发的、意想不到的时刻有时会产生最好的照片。无论你如何计划，只要你具备一些摄影基础，这些时刻就能被轻松捕捉。每位专业摄影师都会告诉你，保持意识并了解你的相机是获得那些纪实、即兴瞬间胶片或在数码相机中捕捉到的最佳方法。


    每台相机都有自己的细微差别，理解这些细微变化的方法很简单：花时间陪伴你的相机。不要只看说明书并等待好机会。玩起来！把你的相机带到任何地方待一段时间并开始拍摄。除了掉地上，否则你是弄坏它的，尽管练习。如果是数码相机，你拍摄时就不会浪费胶卷。学习不同的相机模式、闪光灯强度以及何时使用它。你会开始对自己的相机产生感觉，这意味着当机会来临时，你已经做好了准备，并了解了所需的技巧细节。


    一本基础摄影书籍将教你如何手持相机，让手臂贴近身体以稳定自己并对图片聚焦。对于有充足时间进行计划和设置的情况，你也可以投资一个三脚架。所以……开始拍摄吧！


    # 裁剪、缩放和构图


    ## 达到最大效果的图片


    在 PowerPoint 2007 中调整图片大小和构图，意味着你可以关注最重要的部分——无论是你孩子灿烂的微笑、一位商业高管，还是一群在晚餐时大笑的朋友。当你编辑图片时，可以以各种组合添加图片样式、形状和边框。


    裁剪、缩放和构图图片的意义在于，你可以把一张平庸的图片让它在幻灯片上脱颖而出。但不要过度依赖这些命令。正如你刚刚学到的，从一张完美的图片开始并使用这些命令来增强照片，比反过来要好。


    ## 裁剪和缩放


    裁剪和缩放的基本区别是更改图片的内容与更改图片的大小。*裁剪*意味着你移除图片的部分，例如无关的冗余空间。*缩放*简单地让图片比原始尺寸大或更小。


    你可以通过“图片工具-格式”工具栏以两种方式裁剪图片：拖动标记或通过设置尺寸来裁剪。要通过拖动标记裁剪图片，步骤如下：


    - 1. 点击命令组中的“裁剪”。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_49_0.png)


    - 2. 选择你想使用的标记。


    - 3. 拖动标记来裁剪。


    - 4. 使用箭头在幻灯片上移动图片。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_50_0.png)


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_50_1.png)


    **图 3-11** 这种来自“图片形状”中“星形和旗帜”部分的波浪形状在页面上流畅地流动。


    **图 3-12** 这朵来自“图片形状”中“基本形状”部分的云朵引起了人们对美丽微笑的关注。


    在图 3-11 中，标记可以轻松移动以调整尺寸。**图 3-12** 显示了更紧凑的构图。


    要按尺寸裁剪图片，你可以使用“图片格式”组或“图片位置”对话框。“图片格式”组非常快捷，而“图片位置”对话框则提供了更多选择。例如，你可以使用它们来裁剪照片、在幻灯片上不同的放置照片，并为照片添加替代文本。要使用“图片格式”组，只需在高度和宽度框中使用。


    # 备忘录


    > 在“图片位置”对话框的“大小”选项卡中，你可以查看图片的原始尺寸。点击“重置”即可将照片恢复到原始尺寸。


    # 第 3 章用图片插图


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_51_0.png)


    使用“图片位置”对话框裁剪照片的步骤如下：


    - 1. 点击“大小”组右下角的对角箭头显示“图片位置”对话框。

    - 2. 在“大小和旋转”部分调整高度和宽度。

    - 3. 点击“关闭”。


    # 裁剪还是不裁剪？


    在决定是否裁剪时，向后退一步看这张图片。什么部分最突出？你想突出或关注照片的哪个部分？考虑三分法，它是为了让图片讲述故事的文艺复兴时期画家创造的。三分法规定，如果你在脑中用两条等间距的垂直线和两条水平线将图片划分，将创建九个区域。为了给图片创建最美的构图，你想突出的物体应该放在线条交叉处。如果你有一个水平主体，它应该位于其中一条水平线上。垂直主体应该位于其中一条垂直线上。通过不将主体正置于中心，你可以以最有趣、最吸引人的方式裁剪你的图片。基本上，三分法可以让你的图片


    从平庸变得惊艳！了解这一基础摄影规则将显著增加你照片的影响力。在画廊或当地图书馆看照片时记住这一点，你会发现这种模式。并且记住，即使是最著名的画家也使用这种构图规则来设计引人入胜且有趣的艺术品。


    > 有关三分法的更多信息，请参阅 Michael Langford, Anna Fox 和 Richard Sawdon Smith 著的《Langford''s
    Basic Photography, Eighth Edition: 专业摄影师指南》，F Press, 2007。


