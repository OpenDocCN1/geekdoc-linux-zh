    +   * Chart Pastes a chart linked to Excel data

    * Excel Chart Includes the entire workbook

    * Paste As A Picture Pastes the chart as a picture

    * Keep Source Formatting Retains the chart''s original formatting

    * Use Destination Theme Pastes and formats the chart using the presentation''s
    theme


    The Paste Options icon disappears if you move or click away from the chart when
    you paste it.'
