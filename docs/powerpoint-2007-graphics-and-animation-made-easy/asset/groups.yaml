    # Working with Charts as Design Elements


    Charts are a great way to share numerical information with an audience. Whereas
    SmartArt is a good choice for other types of information, charts are really your
    best bet when you have to explain numbers. They are a great way to illustrate
    and compare numerical data.


    From the military to corporations around the world, charts are a universal method
    for sharing numerical data. Although we don''t know when the chart was first invented,
    it''s clear that once it was, the chart became a communication tool that could
    be used to bridge languages and cultures.


    With PowerPoint 2007, adding a professional looking chart to a presentation is
    a pretty simple process; the Quick Style Galleries you''ve seen in other areas
    of PowerPoint are also available with charts, and three different Ribbon tabs
    allow you to make modifications to your charts quickly and easily.


    In this chapter, we''ll cover the commands available with each of the chart Ribbon
    tabs and show you how to create eye-catching charts.'
