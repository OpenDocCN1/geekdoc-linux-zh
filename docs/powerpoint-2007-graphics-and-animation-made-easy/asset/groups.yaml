    # PowerPoint 2007 Graphics and Animation Made Easy


    THE EASY WAY

    When you add a blank slide to a presentation, to Home | Slides | Layout: Choose
    the Title Only layout from the gallery, and your blank slide will now have a simple
    built-in layout applied to it. Enter text for your outline into the heading text
    provided by the Title Only layout, and then take a look at the previously blank
    slide now has text associated with it in the outline. Your slide is still essentially
    blank, but you can now see from the outline—and in Figure 2-2 what kind of information
    it should contain.


    Creating Layouts to Fit Your Content

