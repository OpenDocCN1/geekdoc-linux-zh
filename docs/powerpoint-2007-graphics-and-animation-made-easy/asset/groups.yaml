    ## Creating Motion Paths


    Motion paths can be a lot of fun to work with, and they are really simple to apply.
    A **motion path** is used when you want your object to do something beyond a traditional
    animation effect. You can create or use one of more 60 preset motion paths (see
    Figure 12-8).


    To apply a preset path, follow these steps:


    1. Click the object you want to animate.

    2. In the Custom Animation pane, click Add Effect.

    3. Select Motion Paths and click a path from the option shown.

    4. If you want to see more options, click More Motion Paths, select a motion,
    and click OK.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_189_0.png)


    **Figure 12-8** PowerPoint 2007 offers more than 60 preset motion paths that you
    can apply to an object.


    Once a motion path is applied to an object, the motion will be displayed next
    to the object on the slide when the Custom Animation pane is open, as shown in
    Figure 12-9.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_189_1.png)


    **Figure 12-9** Motion paths will be displayed next to the object.


    > MEMO

    Do not try to regroup the entire table when you''re done.


    To create your own custom path, follow these steps:


    1. Click the object you want to animate.

    2. In the Custom Animation pane, click Add Effect.

    3. Select Motion Paths | Draw Custom Path, Choose from the options shown (Line,
    Curve, Freeform, or Scribble).

    4. Using your mouse, draw the path for the object.


