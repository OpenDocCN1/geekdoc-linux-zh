    +   5. Select Picture Border and change the color of the border.

    6. Go to the Design tab.

    7. Select Background Styles.

    8. Choose the Format Background command.

    9. From the Fill screen, select Picture Or Texture Fill.

    10. Choose the texture you like.

    11. Click Close.

    12. Type your message in the Title box and Text box.


    In this chapter, you learned how to adjust the brightness, contrast, and color
    of any picture to create a specific mood, and how to add a style or shape to tell
    your story more effectively. You also learned the importance of cropping, sizing,
    and framing pictures to make them pop off the page. Combining all these elements
    means you''ll be able to create strong presentations.


    In the next chapter, you''ll learn how photo albums help tell your story in the
    best way possible.'
