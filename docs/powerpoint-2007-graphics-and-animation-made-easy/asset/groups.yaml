    ## 制作 PowerPoint 2007 图形和动画


    在出现的 Excel 表格中，按照图 13-2 所示输入数据。更改将出现在你演示文的图表上。


    在本章中，你学习了将 Excel 内容移动到 PowerPoint 演示文中或在 PowerPoint 中创建自己的 Excel 图表是多么简单。下一章将介绍如何在
    Word 和 PowerPoint 之间移动图形。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_200_0.png)


    图 13-2 Excel 表格示例，你可以在其中添加数据以在 PowerPoint 2007 中创建图表


    ## 在 Word 和 PowerPoint 之间移动图形


    PowerPoint 2007 的优点之一是在不同应用程序之间来回移动项目。当然，你仍然需要注意几点，但大多数情况下，在 PowerPoint 2007 和
    Word 之间移动图形是非常直接的。在本章中，我们将查看在这些应用程序之间移动图形有多简单；回顾格式化对象、文本或图片的各种方法；并指出在两个应用程序中粘贴时的例外情况。提醒一下，图形可以包括剪贴画、图片、图表、表格或项目符号文本。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_201_0.png)


    ## 将图形从 PowerPoint 移动到 Word


    将图形从 PowerPoint 移动到 Word 时，你有几个选项（包括调整大小），可以准确展示图形。从 PowerPoint 的“首页”选项卡中，进入“剪贴板”组并选择“复制”（或
    CTRL-c）。在 Word 中，选择文档中你想粘贴图形的位置并点击“粘贴”（或 CTRL-v）。


    当你粘贴到 Word 文档时，你会看到“粘贴选项”图标，如图 14-1 所示。从这里，你可以为插入图形选择几种选项。


    以下是从 PowerPoint 移动到 Word 时容易和不容易移动的内容概述：


    - 当将图片、形状、SmartArt 和剪贴画移动到 Word 时，你可以选择“粘贴为图片”、“保留源格式”或“使用目标主题”。

    - 当将表格移动到 Word 时，你可以选择“粘贴为图片”、“保留源格式”或“匹配目标主题”。

    - 当将项目符号列表移动到 Word 时，你可以选择“粘贴为图片”、“保留源格式”、“匹配目标格式”或“仅保留文本”。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_202_0.png)


    图 14-1 将图形从 PowerPoint 移动到 Word 时，图形旁边会出现“粘贴选项”图标。


    - 当将图表移动到 Word 时，你可以选择“图表”、“Excel 图表”、“粘贴为图片”、“保留源格式”和“使用目标主题”。


    ## 注意


    任何当你选择“粘贴为图片”选项时，都无法对插入的图形进行更改。因此，如果你需要调整任何图形，请在将其粘贴到 Word 之前在 PowerPoint 中进行更改。


    - 将 SmartArt 移动到 Word 时，唯一允许你保持格式的选项是“粘贴为图片”。其他选项——保留源格式、匹配目标格式或仅保留文本——会导致你丢失
    Word 格式。


    让我们回顾一下这些选项的含义：


    - 粘贴为图片：以图片形式粘贴图形

    - 保留源格式：保持来自 PowerPoint 的原始格式

    - 使用目标主题、匹配目标主题或匹配目标格式：按与 Word 文档相同的文档主题或格式插入图形

    - 仅保留文本：作为文本粘贴到 Word 文档

    - 图表：粘贴链接到 Excel 数据的图表

    - Excel 图表：包含整个工作簿


    ## 将图形从 PowerPoint


    将图形从 Word 移动到 PowerPoint 是简单的。从 Word 的“首页”选项卡中，进入“剪贴板”组并选择“复制”（或按 CTRL-C）。在 PowerPoint
    中，选择你想粘贴图形的幻灯片并点击“粘贴”（或按 CTRL-V）。你会看到“粘贴选项”图标出现。点击以决定如何插入图形。


    有时，你会发现一种非常想在演示文或文档中使用的字体。你可以在 Word 和 PowerPoint 中嵌入 TrueType 字体，以确保具有你想要的外。两个程序中的步骤相似，但我们将查看如何在
    PowerPoint 中执行。


    - 1. 点击 Microsoft Office 按钮。

    - 2. 点击 PowerPoint 选项。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_204_0.png)


    - 3. 选择 保存。

    - 4. 在“共享此演示文时保留保真度”部分，选择“在文件中嵌入字体”，如下。


    ## PowerPoint 选项


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_205_0.png)


    - 5. 点击“仅嵌入演示文使用的字符”复选框。

    - 6. 点击确定。


    ## 注意


    如果 Word 文档是纯文本且没有标题样式，按下 ENTER 键，PowerPoint 将根据硬回车创建的段落创建一个大纲。例如，项目符号列表中的每个项目都是段落，标题或副标题也是段落。


    选择“仅嵌入演示文使用的字符”有助于减小文件大小。如果你需要嵌入字体中的所有字符，请取消勾选框。支持以下格式：


    - .doc: Word 97

    - .docx: Word 2007

    - .txt: 文本

    - .rtf: 富文本格式

    - .pdf: 便携文档格式


