    on the slide.


    ## Rotating and Flipping WordArt


    By now, you''ve learned a lot about rotating WordArt; however, in addition to
    setting WordArt on its side, the Rotate command lets you flip WordArt upside down.
    Select Rotate | Flip Vertical. Like the effect? No worries. If you don''t like
    it, simply select Rotate | Flip Horizontal to return your WordArt to your original
    position.


    You can access the Size And Position dialog box you learned about in Chapter 3
    by clicking More Rotation Options.


    So, what''s the most effective way to use WordArt? Sparingly. A little Word-Art
    goes a long way, so use it only when you need to make a powerful point that you
    want your audience to remember.


    In this chapter, you learned how to add fills, outlines, and effects to WordArt.
    You were also introduced to the Format Text Effects dialog box, you can perform
    a number of actions to refine and customize your WordArt. And using the Align,
    Rotate, and Flip commands give you more control over WordArt. You were also introduced
    to Shape Styles, which you''ll learn more in Chapter 8.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_119_0.png)


    # Creating Effective Shapes


    Shapes in PowerPoint 2007 lend themselves to a number of uses for work and play.
    Whether you need shapes for a flow chart or you simply want to show off the “star”
    of your family, shapes are a great way to highlight important points, people,
    and objects in your presentation.


    PowerPoint 2007''s ready-made shapes are the perfect start for using shapes, but
    you can also customize a shape to suit your needs. In this chapter, you''ll learn
    when to use shapes, how to add fill, outlines, and effects to shapes, and how
    to add text to a shape to give your message more punch. You''ll also learn how
    to edit a shape or create your own for those special messages that need a little
    more zing.


    ## When to Use Shapes


    In Chapter 1, you learned that “less is more.” This is an important design concept
    that will serve you well as you create your PowerPoint 2007 slides. The main thing
    to remember is that one stunning element can make an extraordinary statement in
    the midst of messages on top of messages that are vying for attention. Using shapes
    as well as other options sparsely are your best bet for creating dramatic, memorable
    slides.


    Take a moment to determine your message. What are you trying to communicate? Are
    you trying to make your audience laugh, or are you conveying a poignant moment?
    Are you closing the deal with your most important selling points, or are you providing
    a high-level overview of the product’s benefits? Determining what you want to
    communicate will be the first step in selecting the shape you’ll use.


    ## Selecting and Inserting a Shape


    You’ll find the Shapes command on the Insert tab:


    - 1. Go to the Insert tab.

    - 2. From the Illustrations group, select Shapes.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_120_0.png)


    # Chapter 8 Creating Effective Shapes


    - 3. From the Shapes options, shown to the left, select the shape you prefer.

    - 4. Size and position the shape on the slide.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_121_0.png)

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_121_1.png)


    # The Drawing Tools Format Tab


    The Drawing Tools Format Tab is where you''ll find the most of the commands you
    need to take advantage of all that Shapes has to offer. Highlight the shape and
    then click the Drawing Tools Format Tab to see the complete toolbar. This toolbar
    has groups and commands like WordArt, which is described in Chapter 7.


    ## Adding Fill to a Shape


    Once you''re on the Drawing Tools Format Tab, you have two ways to add fill to
    a shape from the Shape Styles group. You can use the Shape command or choose an
    option from the Shape Styles Gallery. Let''s take a look at both methods.


    - 1. Go to the Shape group.

    - 2. Click Shape Fill.

    - 3. Roll your cursor over the colors for a Live Preview.

    - 4. Select the color you prefer.


    If you don''t like the colors in the Theme Colors section, you can find additional
    colors or create your own custom color. Click More Fill Colors and select the
    Standard tab and choose a color. To the right of the color palette, you''ll select
    the color you selected at the top of the square under New, while the Current color
    is shown below it. You can adjust the Transparency setting for the color at the
    bottom of the dialog box by entering a percentage or by dragging the scroll bar
    to right.


    # THE WHITE SPACE SHAPES YOUR WORLD


    Shapes help us define our world. One of our exercises in early childhood was fitting
    the piece of the puzzle into the round hole, the square into the square hole,
    and so on.


    Artists are experts who see the world with a perspective that''s a little different
    than the rest of us. When they draw, they don''t simply draw the shape''s actual
    lines and curves. They focus on the shape''s lines, curves, shadows, and white
    space.


    For instance, when an artist draws a face, at the points where the light falls.
    Most portraits do not usual lines to define the lips, nose, and eyes. If you look
    closely, you''ll see the artist used shadows and white space to create a representation
    of these features.


    Take a moment to think about everyday shapes you see. Look around where you''re
    walking in your neighborhood or sitting outside. You''ll be surprised at the amount
    of white space and shadows contained in each shape. Use this knowledge as you
    create your shapes in PowerPoint 2007, and you can design 3D effects that come
    alive on the slide.


