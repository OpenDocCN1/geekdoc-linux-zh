  mdcn: '


    # 第 12 章 创建和使用动画


    当你讨论不同的主要概念时，可以有效地添加主要的幻灯片切换效果来提醒观众注意变化。


    切换效果可以应用于单个幻灯片，也可以应用于演示文稿中的所有幻灯片。快速样式库使得应用切换效果变得非常简单，这是一种无需过多为演示文稿添加少量动画的简单方法。


    要在演示文稿的每张幻灯片上应用相同的相同的切换效果，请按照以下步骤操作：


    - 在普通视图下打开演示文稿。

    - 进入左侧窗格中的“幻灯片”选项卡。

    - 在“动画”选项卡中点击任意幻灯片缩略图。

    - 转到“此灯片切换”命令组，从快速样式库中点击一种切换效果。你可以使用“更多”箭头查看如左所示的完整库。

    - 在同一组中，点击“应用所有”。


    如果你希望每张幻灯片使用不同的切换效果，只需点击左侧窗格“幻灯片”选项卡上的幻灯片缩略图，并按照上述步骤操作（第6 步除外）。当你将鼠标悬停在各种切换选项上时，观察幻灯片以查看每个切换效果的实时预览。


    在本章中，你学习了如何以各种方式处理动画，包括内置动画和自定义效果。在下一章中，我们将向你展示如何将 Excel 导入 PowerPoint。


    | 无切换效果 | | | |

    | :--- | :--- | :--- | :--- |

    | 淡入和溶解 | | | |

    | 擦除 | | | |


    # 将 Excel 内容导入 PowerPoint 2007


    PowerPoint 2007 使得在演示文稿中使用 Excel 内容变得非常简单。你可以从 Excel 复制图表或工作表数据到你的演示文稿中，或者简单地在
    PowerPoint 中创建自己的图表。这将节省你的时间并避免很多烦恼，因为你只需要输入一次数据并将其移动到合适的位置。


    兼容性不仅可以节省时间，而且让演示文稿看起来更清晰、更专业的快速方法。让我们来看看如何通过几次鼠标点击将信息移动到 PowerPoint。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_193_0.png)


    # 从 Excel 发送图表到 PowerPoint


    如果你想将 Excel 表格中创建的图表复制到 PowerPoint，请按照以下步骤操作：


    1. 高亮 Excel 中嵌入的图表或表格。

    2. 在“首页”选项卡上，进入“剪贴板”组。

    3. 点击“复制”。

    4. 在 PowerPoint 2007 中，选择你想粘贴图表的演示幻灯片。

    5. 转到“首页”选项卡，并在“剪贴板”组中点击“粘贴”。

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_194_0.png)

    6. 点击图表旁的粘贴选项图标并选择以下之一：

    - 图表：粘贴链接到 Excel 数据的图表

    - Excel 图表：包含整个工作簿

    - 粘贴为：将图表作为图片粘贴

    - 保留源格式：保留图表的原始格式

    - 使用目标主题：使用演示文稿的主题粘贴图表


    如果你在粘贴时移动或点击图表以外的区域，粘贴选项图标将会消失。


    # 将工作表数据复制到 PowerPoint


    在 PowerPoint 2007 中，你可以将 Excel 工作表中的数据复制到 PowerPoint，在 PowerPoint 中创建 Excel 表格以直接输入数据，从其他格式粘贴数据，或添加超链接。


    - 在 Excel 中，从工作表中选择你想要复制的数据。

    - 转到“首页”选项卡中的“剪贴板”组。

    - 点击“复制”。

    - 在 PowerPoint 2007 中，选择你想粘贴数据的幻灯片。

    - 转到“首页”选项卡。

    - 在“剪贴板”组中，选择“粘贴”。

    - 点击幻灯片数据上的粘贴选项图标并选择以下之一：

    - 保留源格式：维持原始格式

    - 使用目标主题：使用应用于 PowerPoint 演示文稿的文档主题

    - 仅保留文本：将数据作为文本粘贴


    # PowerPoint 2007 图形和动画简单化


    选择“表格”选项卡以添加各种格式选项，如颜色、边框、填充和特殊效果。第 6 章描述了如何在 PowerPoint 2007 中使用表格。

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_196_0.png)


    如果你看不到粘贴图标，你可能需要开启它们。点击 Office 按钮，然后点击“粘贴选项”，如左所示。选择“剪切”、“复制”、“粘贴”、“显示粘贴选项”（如右所示）。如果你将内容粘贴到
    PowerPoint 表格，则不会出现粘贴选项图标。

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_196_1.png)


    你也可以直接在演示文稿中创建功能性的 Excel 表格。进入“插入”选项卡，从“表格”组中选择“Excel 表格”。幻灯片上将出现一个用于输入数据的表格，以及用于执行
    Excel 函数的命令，如图 13-1 所示。在表格被选中的时，使用上下箭头在表格中移动，或者简单地通过拖动边缘来调整表格大小。

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_197_0.png)


    图 13-1 可以直接在演示文稿中插入表格。


    如果你需要以其他格式（如工作表对象、位图或图片）粘贴数据，进入“首页”选项卡，从“剪贴板”组中选择“粘贴 | 特殊粘贴”。在“特殊粘贴”对话框中选择你要使用的格式。


    以下是粘贴到 PowerPoint 的几种选项：

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_197_1.png)


    - 如果以后需要编辑工作表，选择“Microsoft Excel 工作表对象”。此选项让你在不显示的情况下包含。

    - 如果你想作为对象链接嵌入 (OLE) 图标而不是实际内容，选择“Microsoft Excel 工作表对象”并勾选“显示为图标”。在演示文稿中点击图标即可查看内容。

    - 如果要在 Excel 发生更改时更新演示文稿中的表格，请选择“粘贴链接”。这将链接到源文件并保留原始格式。

    - 如果你想在演示文稿中包含指向源数据的超链接，请在“特殊粘贴”对话框中选择“创建超链接”。

    - 通过点击“粘贴”命令中的下拉箭头，你可以选择“粘贴为超链接”来插入指向源数据的超链接。（在附加超链接之前确保保存源数据，否则此选项将无效。）

    - 如果你想作为图片粘贴，可以选择“设备无关位图”、“位图”、“图片（增强元文件)”或“图片（Windows 元文件）”。

    - 要作为文本粘贴，点击“格式化文本 (RTF)”或“未格式化文本”。

    - 你也可以通过选择 HTML 格式来粘贴数据。

    - 当 Excel 工作表上的相关数据扩展时，你可以扩展粘贴到演示文稿中的范围。只需在复制之前为 Excel 数据范围定义名称，然后就可以粘贴该范围的链接。从“首页”选项卡选择“特殊粘贴粘贴”，在“特殊粘贴”对话框中，点击“粘贴链接”并在下拉列表中选择“Microsoft
    Excel 工作表对象”。此选项适用于复制非表格格式的数据。


    # 在 PowerPoint 中创建图表


    你可以通过在演示文稿中直接输入数据来创建 PowerPoint 图表。


    1. 进入“插入”选项卡。

    2. 在“插图”组中，点击“图表”。

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_199_0.png)

    3. 在“插入图表”对话框中，选择你要创建的图表类型。

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_199_1.png)

    4. 点击“确定”。


