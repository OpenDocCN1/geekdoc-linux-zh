    # WordArt Captivates!


    ## The 3-D Rotation Command


    Occasionally, you''ll want to rotate WordArt. You can do this easily from the
    Format Text Effects dialog box or by selecting WordArt Styles | Text Effects |
    3-D Rotation. Let''s see how we can make changes from the Format Text Effects
    dialog box.


    - 1. Select your WordArt.

    2. In the Format Text Effects dialog box, select 3-D Rotation.

    3. In the Rotation section, click once on the Left button in the X: option: This
    will change the rotation to 355 degrees.

    4. In the Y: option, click the Down option one time. This will change the rotation
    to 355 degrees.

    5. In the Z: option, click Counter-Clockwise three times for a 15 percent rotation.

    6. Click Close.


    Figure 7-16 shows an example of rotated WordArt. You can rotate your WordArt in
    a variety of ways; experiment to see what you can do with 3-D rotation.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_112_0.png)


    Figure 7-16 Rotated WordArt


    ## THE EASY WAY


    Want an even faster way to rotate WordArt? When the WordArt box is selected, the
    green dot at the top of the text box allows you to rotate the text to the angle
    you like. As you see in Figure 7-17, simply put your cursor over the dot. Turn
    to the right or left until you have the desired angle and release the cursor.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_113_0.png)


    Figure 7-17 WordArt rotation using the text box


    The Presets in the Format Text Effects also have a variety of rotations to choose
    from. In the Text section, select Keep Flat to flatten out your text, removing
    the 3D formatting. The Object Position | Distance From Ground command moves rotated
    WordArt to the left or right.


    ## The Text Box Command


    You can make a number of changes to your text box using the Text Box command options
    in the Format Text Effect dialog box. In the Text Layout section, you can adjust
    where the WordArt falls inside the text box or rotate the WordArt so it appears
    sideways or stacked, depending on your needs.


    In the Autofit section, you can choose whether to resize the shape of the text
    box, or whether you need to apply Autofit to your text all. The Internal Margin
    section lets you decide the distance between the WordArt and the edges of the
    text box. It also lets you decide if you want to wrap text or put into columns.
    Let''s take a moment to look at this section from within the Format Text Effects
    dialog:


    - 1. Select your WordArt.

    2. Click the arrow in the bottom-right corner of the WordArt Styles group on the
    Drawing Tools tab.

    3. In the Format Text Effects dialog box, select the Text Box option.

    4. In the Text Layout section, select Middle for Vertical Alignment.

    5. In the Text Direction field, select Rotate All Text 90 Degrees.


    # PowerPoint 2007 Graphics and Animation Made Easy


    Now the WordArt in Figure 7-18 is placed on its side and reads like book titles
    on a book spine. It may fall off the PowerPoint 2007 slide too, depending on the
    size of the WordArt. If this is the case, simply drag the overflow portion of
    the text back onto the slide.


    The next section, Autofit, will also help you resize the WordArt to fit the text
    box. For easier reading, we''ll use WordArt that runs horizontally rather than
    vertically. The Autofit default for WordArt is Resize Shape To Fit Text, which
    means that the text box adjusts itself to accommodate the WordArt as you type.
    The text box can be adjusted in two other ways as well. Let''s look at both options.


    Autofit adjusts either your shape or your text to make it for you automatically.
    Without this, text runs beyond bounds. Right-click your WordArt, and then select
    Format Text Effects. From the Format Text Effects dialog, select Text Box and
    then Do Not Autofit and close. Begin typing within your WordArt box. Notice how
    the text falls outside the text borders and onto the rest of the page, as in Figure
    7-19. You may sometimes need to select this option to accomplish a specific task
    in PowerPoint 2007, but its use is generally rare.


    Figure 7-18 WordArt rotated at 90 degrees resembles the spine of a book.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_114_0.png)


    Figure 7-19 WordArt without Autofit falls out of the text borders.


    The other option is to Shrink Text On Overflow. This means that as you type, the
    text will shrink to fit the box. From the Format Text Effects dialog, select Shrink
    Text On Overflow. Beginning within your WordArt text box. Figure 7-20 shows the
    result of the Shrink Text On Overflow option. This WordArt option works well as
    long as you don''t have too many words. Remember earlier we discussed using fewer
    words in WordArt? The fewer words you use in WordArt, the more powerful your message
    will be. The Text Box option in the Format Text Effects dialog box lets you change
    the internal margins to give you a bigger space. Let’s say you want to “frame”
    your WordArt with color. First, let’s change WordArt to its default Autofit position,
    Resize Shape To Fit Text. Now, let’s work with the Internal Margin section of
    Text boxes.


    - 1. In the Left field, change the margin to 1.5 inches.

    - 2. In the Right field, change the margin to 1.5 inches.

    - 3. In the Top field, change the margin to 1 inch.

    - 4. In the Bottom field, change the margin to 1 inch.

    - 5. Click Close.


    Figure 7-21 shows an example of how you can use the text box to create a frame
    for WordArt. Did you notice the text box reshaped itself


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_115_1.png)


    Figure 7-21 Changing internal margins creates a “frame” for WordArt.


    # Chapter 7 Using WordArt to Make Your Point


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_115_0.png)


    Figure 7-20 Using the Shrink Text On Overflow option


