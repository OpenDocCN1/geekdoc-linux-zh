  mdcn: '


    # 理解相灯片布局


    PowerPoint 2007 中的“相灯片”具有预设的布局，可以一次显示一张、两张或四张照片。你可以为每张照片添加页面标题或说明。从你的电脑中，你可以选择显示图片的方式，以突出显示每张照片。


    决定你的相灯片使用哪种布局取决于你想要传达的内容。你是在展示海滩度假时带有幽趣故事的照片吗？插入一个文本框，这样你就可以快速轻松地讲述你的故事。是否有一张描述美日的壮丽照片，本身就能说明一切？那么就显示细节，完全不需要任何说明。你可以为照片加框，也可以让它占据整个幻灯片。由你决定。


    布局对于富有格调地展示照片非常重要。现在让我们创建并布局你的相灯片吧。


    # 创建新相灯片


    PowerPoint 2007 让你只需几次鼠标即可创建一个新的相灯片。按照以下步骤创建相册：


    - 1. 选择“插入”选项卡。

    - 2. 从“插图”组中选择“相灯片”。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_60_0.png)


    - 3. 点击“新建相灯片”。


    现在你将看到一个显示相灯片选项的对话框。由于你将使用相灯片对话框（如下所示）来设计你的相册，请在完成所有选择之前保持对话框打开。只需在阅读本章时按照步骤操作，选择你喜欢的选项即可。在章章稍后的“添加说明和文本”部分插入说明后，你将创建并编辑你的相册，然后将创建几个相册以查看这些选项如何协同工作。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_61_0.png)


    # 相片内容部分


    相灯片对话框中的“相片内容”部分提供了许多命令。你将使用对话框的此部分来确定照片的外观。让我们看看插入和调整照片的不同方法：


    ## 简单方法


    > 想一次添加多张图片吗？在从文件夹中选择照片时，按住 CTRL 键并点击要包含的照片。这样你就可以一次插入多张照片。


    - 转到“相片内容”部分。

    - 在“从文件插入图片”下，点击“文件/磁盘”，如页所示。


    # PowerPoint 2007 图形和动画变得简单


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_62_0.png)


    - 3. 当“插入新图片”对话框出现时，选择要包含的图片。


    一旦你将照片放入相册中，它们将出现在相灯片对话框的“相灯片中的图片”字段中。当你高亮其中一张照片时，它将出现在“预览”字段中。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_62_1.png)


    | 向上/向下 | 对比 | 删除 | 亮度 | 旋转 | 50 |


    你可以通过点击向上或向下箭头重新排列图片顺序。你也可以通过高亮照片并点击“删除”来删除照片。

    在“预览”字段下方，你会看到三组命令。这些命令允许你：


    - 旋转图片。

    - 调整照片的对比度。

    - 调整照片的亮度。


    为了达到戏剧效果或只需以新的视角展示你的照片，请勾选“相片内容”部分中“图片选项”下的“所有图片黑白”复选框，搞定！现在你的相灯片有了引人目的新外观。要恢复原来的，只需取消勾选该框即可。


    # 使用相灯片布局


    相灯片对话框中的“相灯片布局”部分（如下页所示）提供了不同的页面布局、框形状和主题供你选择。转到“相灯片布局”部分，选择你想显示图片的方式。以下是“图片布局”字段中的选项：


    - 适应幻灯片：你的照片将覆盖整个幻灯片。

    - 1 张图片：你的照片将位于幻灯片正中央。

    - 2 张图片：你的照片将并排显示在幻灯片上。

    - 4 张图片：你的照片每页显示四张。

    - 带标题的 1、2 或 4 张图片：这为你的照片添加了标题，每页显示一张、两张或四张。


    # PowerPoint 2007 图形和动画变得简单


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_64_0.png)


    当你选择除“适应幻灯片”以外的图片布局时，你会发现“框形状”字段变得可用。从这里，你可以选择框样式。你可以从七种框选项中选择：


    - 矩形

    - 圆矩形

    - 简单框（白色）

    - 简单框（黑色）

    - 复合框（黑色）

    - 中心阴影矩形

    - 软边缘矩形


    当你选择任意图片布局或框时，你将在右侧看到预览。图 4-1 显示了矩形框的示例，而图 4-2 显示了复合框（黑色），图 4-3 显示了软边缘矩形。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_65_0.png)


    图 4-1 圆矩形框


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_65_1.png)


    图 4-2 复合框（黑色）


    # 在相灯片中使用主题


    现在你已经插入了照片、正确排序了，并选择了布局，你希望一致地展示你的图片。PowerPoint 2007 中的“主题”库是创建讲述你故事背景的完美工具。该库提供了鲜艳的色彩来营造轻松氛围，或更内敛的色彩以赋予幻灯片更专业的感。无论何种方式，每个主题的设计都会增强你的照片，并以最好的方式展示它们。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_65_2.png)


    图 4-3 软边缘矩形


    记住，由于你正在通过照片营造氛围并讲述故事，可以使用最有效地表达你想法的布局、框形状和主题。


    - 1. 在相灯片对话框的“相灯片布局”部分，点击“浏览”。


    # PowerPoint 2007 图形和动画变得简单


    ## 简单方法


    - 2. 查看“主题”并选择你喜欢的。


    想为相册中的所有照片添加说明吗？一旦你选择了布局，可以在相灯片对话框的“图片选项”下选择“所有图片下方说明”。


    - 3. 点击“选择”。


    # 添加说明和文本


    为你的相册添加文本非常简单。只需选中要添加文本的照片，在“相片内容”部分点击“新建文本框”，然后点击“更新”。你将获得带有照片和空文本框的新幻灯片。要在幻灯片上创建自己的文本框，选择“插入”选项卡，然后在“文本”组中选择“文本框”。然后在幻灯片上绘制你的文本框。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_66_0)


    使用“编辑相灯片”命令对你的相灯片进行更改。


    - 1. 打开你的 PowerPoint 2007 演示文稿。

    - 2. 转到“插入”选项卡。

    - 3. 从“插图”组中选择“相灯片”。

    - 4. 点击“编辑相灯片”。


    你会发现“编辑相灯片”对话框与相灯片对话框的选项相同。唯一的区别是，不是“创建”命令而是“更新”命令。从这里，你可以对你的相灯片进行任何调整。


    # 在相册中显示照片


    现在你已经创建了相灯片，让我们看看使用这些选项的一些方法。


    - 1. 转到“插入”选项卡。

    - 2. 从“插图”组中选择“相灯片”。


    ## 简单方法


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_67_1.png)


    需要快速更改图片吗？要更改相册中的照片，右键点击照片并选择“设置图片”。你将看到在第 3 章中学过的“设置图片”对话框。从这里，你可以调整填充、颜色、线条样式和阴影，以及其他选项。


    '
