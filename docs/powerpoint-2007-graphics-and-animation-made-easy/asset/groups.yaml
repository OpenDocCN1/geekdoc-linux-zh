    # # Change Color in Portions of a Graphic


    To change colors in certain portions of a graphic, follow these steps:


    +   1. Select the portion of the graphic where the color should be changed.


    +   2. Go to the Drawing Tools Format tab. Click Shape Fill.


    +   3. Select a new color from the color palette provided (Theme, Standard, or
    Recent Colors).


    The graphic will reflect the color you''ve chosen. Figure 5-5 shows a much darker
