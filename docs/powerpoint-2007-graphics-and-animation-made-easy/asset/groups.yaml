    # Using WordArt to Make Your Point


    WordArt in PowerPoint 2007 gets your message to your audience in an exciting way.
    Sure, they''re just words, but when you need to get your point across quickly
    and effectively in literally seconds, you can depend on WordArt to create a lasting
    impression.


    Remember, your PowerPoint 2007 presentations are telling a story and conveying
    a message. You want to use every opportunity to make sure those viewing the presentation
    are captivated enough to remember what you said. If they don''t find at least
    one “memorable moment,” you''ll feel like you wasted your time. So whether you''re
    presenting to family or friends, a group of coworkers or potential clients, you
    can use numerous features in PowerPoint 2007 to keep your presentation at the
    front of your audience''s minds.


    In this chapter, you will discover a variety of ways that WordArt can enhance
    your presentation, including applying fill, outlines, shapes, and effects. You''ll
    also learn how to align, rotate, and flip the art for maximum effect and how to
    use a dialog box that lets you make changes from one location.


    ## Getting Started with WordArt


    To get to WordArt, follow these steps:


    1. Click the Insert tab.

    2. Go to the Text group and select the WordArt command.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_102_0.png)


    Your WordArt will appear like what''s shown in Figure 7-1. From here, you can
    type in your message and customize your


    - Text Fill: Lets you fill the text with a solid color, gradient, texture, or
    picture.

    - Text Outline: Lets you define the text with the color, width, and style of line.


    ## A WORD ON WORDS


    WordArt is designed designed to make your words memorable, but starting with strong,
    active verbs is the best way to make your presentation pop. Every time you write
    a headline on a slide, or WordArt, check your verb to make sure you use the active
    tense.


    > MEMO

    The ball was thrown by the quarterback. This sentence is passive, showing the
    ball being thrown. Although this is a perfectly acceptable sentence, it''s not
    the most powerful way to tell your story. The quarterback threw the ball. This
    sentence shows the subject actively performing the action.


    ## MEMO


    If you want to change the style of your WordArt, select Quick Styles in the WordArt
    Styles and apply a style to selected text or all the text. If you want to remove
    the WordArt, choose WordArt Styles | Quick Styles | Clear WordArt.


    - *Text Effects*: Offers such as 3D rotation, glow, reflection, or shadow.


    ## WordArt Captivates!


    Figure 7-1 Here is one example of a simple WordArt style.


    Let''s see how applying these options with a few simple clicks can create an eye-catching
    message.


    ## Adding Fill to WordArt


    Once you have added WordArt to a slide, you might decide that the color isn''t
    exactly what you want. It''s easy to change it by following these steps:


    1. Type your message in the text box, and then highlight the text.

    2. Go to the WordArt Styles group.

    3. Select the Text Fill command.

    4. Hover your cursor over a few colors for a Live Preview of what the text will
    look like.

    5. Choose Red, Accent 2, Lighter 40%.


