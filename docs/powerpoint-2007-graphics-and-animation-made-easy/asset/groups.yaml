    ## 简单方法：创建自定义布局


    使用内置的“快速样式”库可以轻松自定义你的幻灯片。这些样式库是 PowerPoint 2007 推出的新功能，旨在帮助你对普通对象进行大幅更改。现在你可以为图形和动画添加
    3D、斜角、颜色、发光、边框等效果。


    # 点击添加标题


    - 点击添加文本


    用于制作效果的文本。我们使用“图片样式”库为图片添加了即时边框。所有这些效果和技术将在本书中进行解释。这里是另一个用于快速自定义的示例。谁说你必须将文本框放在页面顶部？当然，也许那里是大多数人放置标题的地方，但记住，这是你的幻灯片，你可以对它做任何你想做的事。有时，冲击来自于将元素放置在意想不到的地方。例如，在图
    2-7 中，内置的“双内容”幻灯片在其传统的顶部位置显示幻灯片标题，下方显示内容。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_35_0.png)


    **图 2-5** PowerPoint 2007 中基础的“标题和内容”幻灯片


    # 剑羚羊


    现在，让我们把标题文本框移动到页面底部，并将两个内容框向上拉。插入一些剪贴画（例如，为了说明某种比较），然后在标题文本框的底部输入你的标语。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_35_1.png)


    **图 2-6** PowerPoint 2007 中自定义的“标题和内容”幻灯片


    # 让 PowerPoint 2027 图形和动画变得简单


    | 点击添加标题 |

    | :--- |

    | 点击添加文本 | 点击添加文本 |


    如图 2-8 所示，你无需在每张幻灯片上都延续无聊的标题文本框，仍然可以传达核心观点。


    在接下来的几页中，你将看到一些额外的布局概念。看看它们是否能激发你的额外灵感。记住，你始终可以添加背景颜色和 PowerPoint 主题来获得更强的视觉冲击力。在这些示例中，我们想向你展示即使有大量的留白，你也可以创建具有影响力的简单自定义幻灯片。在本书的后部分，你将看到为其中一些简单的自定义想法添加动画如何给你的观众产生更大的影响。


    在自定义幻灯片时使用你自己的想象力……例如，一张图片能讲述一个故事吗？一张向上看楼梯的照片，配上简单的标题“我们正在那里”，能否让你的观众关注这个核心思想？


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_36_0.png)


    图 2-7 PowerPoint 2007 中基础的“双内容”幻灯片


    那么，起跑线上的跑步者可以表示某事的开始吗？或者一张日本禅意花园的照片，配上说明：“看起来简单，但其实并非如此？”


    - 这真的表达了我的观点吗？还是观众中的某人会问“又怎样？”


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_37_0.png)


    # 从任何地方获取灵感


    听取客户的意见让我们比竞争对手移动更快


    布局应该适应你的内容，而不是反过来。永远不要满足于不适合现有信息的布局。PowerPoint 有一些很好的基础布局，但你的信息并不总是能神奇地在这些有限的设计中起作用。


    如果你觉得创意枯竭了，可以看几本杂志。哪本吸引了你的目光？如果你特别喜欢某一本，将其基本元素复制到你的幻灯片上，并用你的图形和内容填充。


    | 高层长于实施变革 |

    | :--- |

    | ![GO](image_url) 各层级的问责制<br>可靠且改进的方案驱动我们全公司的问责制。 |

    | 新产品和服务<br>改进的产品和精简流程。<br>更快速的服务和支持。 |

    | ![GO](image_url) 双重业务模式<br>根据客户需求在我们业务模型中的位置提供客户服务。 |

    | ![GO](image_url) 独立<br>灵活的组织使我们能够更轻量、更精简并对你的需求做出快速响应。 |


    超市里的哪些产品吸引了你的注意力？包装上的某些特性让你倾向于选择一个而不是另一个，那么为什么不识别关键元素，然后尝试某种方式在你自己的布局中使用它呢？


    # 备忘


    几个额外的自定义技巧：

    - 将文本框移动到意想不到的地方。

    - 以意想不到的方式堆叠对象。

    - 使用颜色影响关键细节。

    - 平衡对象。

    - 不要平衡对象。

    - 将照片或图形以出人意料的方向旋转。

    - 将你需要共享的信息可视化，然后在幻灯片上创建该可视化。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_38_0.png)


