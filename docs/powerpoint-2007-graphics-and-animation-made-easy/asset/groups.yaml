    # Manipulating Clip Art


    Once you have the type of clip art you need, you might still find it requires
    some tweaking. For example, you might have found the perfect illustration of a
    cat, the cat is a weird green color and you would prefer a black cat. In this
    section, we''ll show you how to manipulate clip art in different ways to get the
    exact clip art you want.


    Most of the time before you can manipulate a piece of clip art, you will need
    to separate it into layers. That is because most clip art contains multiple colors
    and images that are grouped into a single scene to create the final piece of clip
    art. For example, in Figure 5-4, the sky behind the volleyball players is a light
    blue. If you wanted to change the sky to dark blue, you must ungroup the entire
    graph in order to select only the piece of the graphic containing the sky.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_79_0.png)


    Figure 5-4 Volleyball scene with a light blue sky in background


    Note that if you do not edit Picture in the shortcut menu, your object can''t
    be converted to a Microsoft Office drawing object. To ungroup a graphic, follow
    these steps:


    - 1. Right-click the graphic.

    - 2. Click Edit Picture from the shortcut menu. If you see a warning that the
    graphic is an imported picture instead of a group, click Yes to convert it to
    a Microsoft Office drawing object.

    - 3. Right-click the graphic again.


    > Link The Clip Art Book: A Compilation of More Than 5,000 Illustrations and Designs,
    by Gerard Quinn, 1992.


    - 4. Select Group | Ungroup. The graphic should display similarly to the one shown
    here.

    - 5. Click outside the graphic to reduce all the grouping clutter in your graphic.

    - 6. Now, select the piece of the graphic that you want to alter and make changes
    as desired.


    In our example, we will be changing the sky color of the graphic so we selected
    the sky portion of the graphic. Steps for clipping art colors are in the next
    section.


    # Change Color in Portions of a Graphic


    To change colors in certain portions of a graphic, follow these steps:


    - 1. Select the portion of the graphic where the color should be changed.

    - 2. Go to the Drawing Tools Format tab. Click Shape Fill.

    - 3. Select a new color from the color palette provided (Theme, Standard, or Recent
    Colors).


    The graphic will reflect the color you''ve chosen. Figure 5-5 shows a much darker
    sky now than the sky in Figure 5-4; that''s because we applied a new dark blue
    color to the sky.


    # Change the Look and Feel of the Entire Graphic


    If you prefer to change the entire look of the graphic, and you won''t or need
    to manipulate pieces of it, it''s very simple to do. You can change the overall
    color, add 3D rotation, background fill, and more to your graphics before you
    ungroup them. While this method doesn''t allow you to apply changes to portions
    of the graphic, it gives you an option for making a unique graphic for your presentation.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_80_0.png)

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_80_1.png)


    To change the overall look of a graphic, follow these steps:


    - Right-click the graphic.

    - From the shortcut menu, select Format Picture.


    The Format Picture dialog box will appear with Picture already selected in the
    left pane, as shown in Figure 5-6.


    In the left pane, you''ll find many other options. As you select different options,
    the right pane will change in relation to the chosen item. We''ll briefly review
    each option so you can understand what can be achieved; we recommend playing with
    each option so you can see how minor adjustments to a graphic can make a big difference.


    # Picture


    With the Picture option selected, you can recolor the graphic, change its brightness
    or contrast, or reset the graphic to its original look.


    - Click the Recolor button to select from preset color variations.

    - Slide the handle or use the up and down arrows to change brightness and contrast.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_81_0.png)


    Figure 5-5 Volleyball scene with dark blue sky in background


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_81_1.png)


    Figure 5-6 The Format Picture dialog box allows you to make multiple changes to
    your graphic.


    MEMO

    When you''re finished making changes, click Close in the Format Picture dialog
    box for the changes to be applied to your graphic.


    # Fill


    This option allows you to add or change background colors in your graphic.


    - Select No Fill to remove backgrounds.

    - Select Solid Fill | Color to see a list of color options. You can also change
    the background transparency by sliding the handle or using the up and down arrows
    next to Transparency.

    - Select Gradient Fill to select from a variety of gradient color options, types,
    and directions.

    - Select Or Texture Fill to add a picture or preset texture to your graphic. You
    can use pictures from your own collection or the PowerPoint Clip Art Collection.
    Select Include Content From Office Online to broaden your options. To make texture
    options appear in the graphic, deselect Tile Picture As Texture.

    - Select Slide Background Fill to make your graphic blend seamlessly with your
    slide.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_82_0.png)


    # Line Color


    You can line your graphics with a solid or gradient line using this option, as
    well as change line colors and transparency.


    # Line Style


    When you add lines to a graphic, you can manage the width, type, and style of
    the line using this option. Play with the Cap and Join types to modify the look
    of the edge or corners.


    # Shadow


    Want your graphic to cast a shadow? Select this option, and choose from Preset
    options or set the shadow yourself using the Transparency, Size, Blur, Angle,
    and Distance features. One way to make a shadow stand out: Change your color using
    the Color blend.


    # 3-D Format


    When you apply a 3D format to a graphic, it can make your graphic pop off the
    page. This option is really terrific when working with cartoons, but try anyway
    if you''re looking for a way to make a graphic stand out. 3-D Format selected,
    you can choose from Bevel, Depth, Contour, and Surface options.


    # HOW GRADIENT STOPS WORK


    Gradient stops like something fancy but are really just what the name says: They
    tell PowerPoint to stop various colors so the color can begin. Most people assume
    that gradients only come in two colors, you can actually have up to ten gradient
    colors within a graphic. Each gradient stop has a color associated with it, as
    well as a stop transparency option. The stop position is what limits the particular
    gradient stop to a specific location in the graphic; transparency dictates how
    bright or muted that portion of the gradient will be. In Figure 5-7, you can see
    a variety of gradients applied to the background of the volleyball scene. These
    were applied by adding ten gradient stops and applying a different color, position,
    and transparency to each.


    To add gradient stops to a graphic, right-click the graphic and click Format Picture.
    In the Format Picture dialog box, click Add. Our recommendation is to add color
    first using the Color blend, and then set the stop position by sliding the Stop
    Position handle or using the up and down arrows. Set transparency in the same
