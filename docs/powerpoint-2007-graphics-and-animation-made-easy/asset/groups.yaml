  - '[PAGE 59]


    # Creating a Photo Album


    Now that you know how to use pictures to their full potential in PowerPoint 2007,
    you need a way to capture the spirit of your photos in an organized way. The Photo
    Album lets you have a little fun with presenting photos to family and friends.
    In this chapter, you''ll learn about photo albums and album layouts and discover
    how to create, edit, and add captions to your photos. You can use PowerPoint 2007''s
    themes for consistency throughout your album, and you''ll also learn how simple
    it is to create a black and white photo album for dramatic effect. You''ll even
    learn how to customize your layout by resizing photos and adding text boxes manually.


    Creating and editing a photo album in PowerPoint 2007 is easy. You have a number
    of options and layouts to choose from. You may want to say it with a caption or
    a title, or perhaps your photograph will tell a story without any words at all.
    The wonderful thing about the Photo Album feature is that you get to display your
    photos the way you want to.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_59_0.png)'
- md: '

    # Understanding Album Layouts


    The Photo Album in PowerPoint 2007 has ready-made layouts to display your photos
    one at a time, two at a time, or four at a time. You can include a page title
    or a caption for each photo. From your computer, you can choose how to display
    pictures in the way that highlights each photo best.


    Determining which layout to use for your photo album depends on what you''re communicating.
    Are you showing pictures from your beach vacation that have a funny story to tell?
    Insert a text box so you can tell your story quickly and easily. Have a magnificent
    photo of a beautiful sunset that tells the story on its own? Then show the details
    with no caption at all. You can frame your photo or let it take the entire slide.
    It is your choice.


    Layouts are essential in displaying your photos with flair. Let''s create and
    lay out your photo album now.


    # Creating a New Photo Album


    PowerPoint 2007 lets you create a new photo album with just a couple of mouse
    clicks. Follow these steps to create your album:


    - 1. Select the Insert tab.

    - 2. From the Illustrations group, select Photo Album.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_60_0.png)


    - 3. Click New Photo Album.


    Now you''ll see a dialog box displaying your Photo Album options. Since you''ll
    be using the Photo Album dialog box (shown next) to design your album, keep the
    dialog box open until you''ve made all your selections. Simply follow along as
    you read through this chapter, selecting the options you like. After inserting
    captions in “Adding Captions and Text,” later in this chapter, you’ll create and
    edit your album, and then you’ll create a few albums to see how the options can
    work together.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_61_0.png)


    # The Album Content Section


    The Album Content section in the Photo Album dialog box offers you a number of
    commands. You’ll use this section of the dialog box to determine how your photos
    will appear. Let’s look at the different ways you can insert and adjust photographs:


    ## THE EASY WAY


    > Want to add more than one picture at a time? When selecting photos from your
    folder, press CTRL while clicking the photos you want to include. This way you
    can insert a number of photos at one time.


    - Go to the Album Content section.

    - Under Insert Picture From, click File/Disk, as shown on the next page.


    # PowerPoint 2007 Graphics and Animation Made Easy


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_62_0.png)


    - 3. When the Insert New Pictures dialog box appears, select the picture you want
    to include.


    Once you have your pictures in your album, they''ll appear in the Pictures In
    Album field in the Photo Album dialog box. When you highlight one of the pictures,
    it will appear in the Preview field.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_62_1.png)


    | Up & Down | Contrast | Remove | Brightness | Rotate | 50 |


    You can reorder pictures by clicking the up or down arrow. You can also delete
    a photo by highlighting the photo and clicking Remove.

    Beneath the Preview field, you''ll see three sets of commands. These commands
    let you:


    - Rotate the picture.

    - Adjust the contrast of the photo.

    - Adjust the brightness of the photo.


    For dramatic effect or simply to display your photos with a new perspective, check
    the All Pictures Black And White checkbox under Picture Options in the Album Content
    section and voila! Now your photo album has a striking new look. To change it
    back, simply uncheck the box.


    # Using Album Layouts


    The Album Layout section in the Photo Album dialog box (shown on the next page)
    gives you different page layouts, frame shapes, and themes to choose from. Go
    to the Album Layout section to select the way you want to display your pictures.
    Here are your options in the Picture Layout field:


    - Fit To Slide: Your photo will cover the entire slide.

    - 1 picture: Your photo will be centered on the slide.

    - 2 pictures: Your photos will appear side-by-side on the slide.

    - 4 pictures: Your photos will appear four to a page.

    - 1, 2, or 4 Pictures With Title: This adds a title to your photos, which are
    displayed one, two, or four pictures to a page.


    # PowerPoint 2007 Graphics and Animation Made Easy


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_64_0.png)


    When you choose a Picture Layout other than Fit To Slide, you''ll notice the Frame
    Shape field becomes available. From here, you can select the frame like. You can
    choose from seven frame options:


    - Rectangle

    - Rounded Rectangle

    - Simple Frame, White

    - Simple Frame, Black

    - Compound Frame, Black

    - Center Shadow Rectangle

    - Soft Edge Rectangle


    When you select either a picture layout or a frame, you''ll see a preview to the
    right. Figure 4-1 shows an example of a Rounded Rectangle frame, whereas Figure
    4-2 shows a Compound Frame, Black, and Figure 4-3 displays a Soft Edge Rectangle.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_65_0.png)


    Figure 4-1 A Rounded Rectangle frame


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_65_1.png)


    Figure 4-2 A Compound Frame, Black


    # Using Themes in a Photo Album


    Now that you''ve inserted your photographs, ordered them correctly, and selected
    a layout, you''ll want to present your pictures consistently. The Themes gallery
    in PowerPoint 2007 is the perfect tool to create the background to tell your story.
    The gallery offers vibrant colors for a lighthearted feel or more subdued colors
    to give your slides a more professional air. Either way, the design of each theme
    will enhance your photos and display them in the best way possible.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_65_2.png)


    Figure 4-3 A Soft Edge Rectangle


    Remember, since you are setting a mood and telling a story with photographs, you
    can use the layout, frame shape, and theme that express your thoughts most effectively.


    - 1. In the Album Layout section of the Photo Album dialog box, click Browse.


    # PowerPoint 2007 Graphics and Animation Made Easy


    ## THE EASY WAY


    - 2. Review the Themes and select the one you like.


    Want to add captions to all the photos in your album? Once you''ve selected your
    layout, you can add captions to all your slides. In the Photo Album dialog box,
    under Picture Options, select Captions Below All Pictures.


    - 3. Click Select.


    # Adding Captions and Text


    Adding text to your photo album is simple. Just highlight the photo you want to
    add text to the Album Content section and then under Insert Text, click New Text
    Box and then Update. You should have a new slide with your photo and an empty
    text box where you can type your text. To create your own text box on the slide,
    select the Insert tab and from the Text group, choose Text Box. Then draw your
    text box on the slide.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_66_0.png)


    # Editing a Photo Album


    You can make changes to your photo album using the Edit Album command.


    - 1. Open your PowerPoint 2007 presentation.

    - 2. Go to the Insert tab.

    - 3. Select Photo Album from the Illustrations group.

    - 4. Click Edit Album.


    You''ll see that the Edit Album dialog box has the same options as the Photo Album
    dialog box. The only difference is that, instead of the Create command, you''ll
    see the Update command. From here, you can make any adjustments to your photo
    album.


    # Displaying Photos in Photo Albums


    Now that you''ve created your photo album, let''s look at a few ways to use these
    options.


    - 1. Go to the Insert tab.

    - 2. From the Illustrations group, select Photo Album.


    ## THE EASY WAY


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_67_1.png)


    Need to change a picture quickly? To change a photo in your album, right-click
    on the photo and select Format Picture. You''ll see the Format Picture dialog
    box that you learned about in Chapter 3. From here, you can adjust the fill, color,
    line style, and shadow, with other options.

