    # Working with Table Styles


    The Table Styles group offers you other options beyond merely coloring your table.
    For example, you can add or remove borders for cells or enter any effects to your
    table by using Border commands. from this group and instantly change the table
    by using the Table Styles Gallery.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_95_0.png)


    # The Table Styles Gallery


    Within the Table Styles group is the Table Styles Gallery. This is a group of
    preset tables that you can choose to apply an overall look and feel instantly
    to your table. Click the More button (it looks like a down arrow with a line above
