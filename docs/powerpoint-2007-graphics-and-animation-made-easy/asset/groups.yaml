    box. The default for this command is Align To Slide, but you can align to the
    left, right, top, or bottom of the slide as needed. Take a few moments to explore
    these options. You can also move WordArt manually on the slide, but these commands
    give you plenty of options to choose from.


    # The View Gridlines and Grid Settings Commands


    Two of the most important commands you''ll need when positioning WordArt on your
    slide are View Gridlines and Grid Settings. Both of these will help you'
