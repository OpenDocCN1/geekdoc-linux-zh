    # MEMO


    Use the Shape Fill command to add texture or gradient to SmartArt shapes.


    Figure 9-8 SmartArt can be manipulated shape by shape by applying Shape Styles
    to individual shapes.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_145_0.png)


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_145_1.png)


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_145_2.png)


    # THE EASY WAY


    Do you need to hide a portion of SmartArt on a slide and then have it reappear
    on the next slide? Select the shape and then choose the Shape Fill | No Fill and
    Outline commands. If it is still visible, make it the same color as the background
    of your slide. When you''re ready to show that shape and its content again, simply
    replace the colors you removed. Just remember to do this, or you might find yourself
    fighting invisible objects when you edit the slide later.


    | Shape | Options |

    | --- | --- |

    | Top circle | Colored Outline, Accent 6 |

    | Top horizontal L | Subtitle Effect, Dark 1 |

    | Center circle | Subtle Effect, Accent 5 |

    | Middle wave | Colored Outline, Accent 5 |

    | Bottom circle | Intense Effect, Accent 5 |

    | Bottom horizontal box | Colored Fill, Accent 6 |


    # Change Colors and Borders of Individual Shapes


    Earlier we explained how to change colors through a piece of SmartArt. Here, we''ll
    show you how to change colors and borders within individual shapes. The command
    to change shape colors is located in the Shape Styles command group; select the
    shape where you want to change the color and then click Shape Fill and choose
    a new color.


    You can change the shape outline or border as easily as using the Shape Outline
    command in this same group. Select the shape where you want to change the border
    and then click Shape Outline and choose a new outline.


    # Add a Picture to a Shape Without a Picture Icon


    When a picture icon appears in SmartArt, it indicates that the shape can accept
    and automatically resize a picture to fit the specific shape involved. Your pictures
    don''t get too terribly distorted this way. However, you can still add pictures
    to other shapes if you like. Just be aware that they might be stretched a little
    oddly or otherwise look a tad goofy. You can always undo the command if you don''t
    like the picture looks, so give it a try by following these steps in any SmartArt
    shape that does not have a picture icon within it:


    - 1. Select the shape.

    - 2. Go to Shape Fill in the Shape Styles group.

    - 3. Click Picture.

    - 4. Select a picture and click Insert.


    The picture will be inserted into your graphic as shown in Figure 9-9. In the
    example, you can see how the photos are stretched; you can play with the shape''s
    size to see if that helps the photo look more normal.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_146_0.png)


    # Convert Slide Text to SmartArt Instantly


    You don''t have to start out with SmartArt as you build your slide; you can begin
    with text and then quickly convert that text to SmartArt if you prefer. Although
    the process works most effectively with bulleted text, you can make the conversion
    even with just one word or sentence. Here''s how to do it:


    - Type text on a slide.

    - Right-click the text box.

    - Select Convert To SmartArt.

    - Select a SmartArt shape.


    Your text will now appear as the SmartArt option you chose.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_147_0.png)


    # Animating with SmartArt


    All right, so now we get to the true fun of SmartArt: animation. Although we''ll
    explain animation in more detail in Chapter 12, we''ll show you a few things you
    can do with SmartArt right now. You can animate SmartArt just like you would almost
    any other object, but here are a few caveats:


    - First, the order in which the shapes appear in your SmartArt will dictate the
    order in which the animation plays. You can''t pick and choose which shapes will
    animate at a particular time, although you can, of course, reverse your entire
    SmartArt graphic to animate it if you like.


    - Second, treat each SmartArt graphic as the unique item it is. Animations will
    occur in different ways given the type of SmartArt involved, so we can''t possibly
    explain all the different combinations in a few paragraphs. When you begin animating
    SmartArt, allow yourself some extra time to play around. But don''t try to figure
    it all out when you''ve got a heavy deadline for your presentation.


    - Third, connecting lines between Smart shapes will not animate individually.


    - Finally, use caution when you''re working with deigned. To animate your SmartArt,
    follow these steps:


    - 1. Select the shape.

    - 2. Go to the Animations tab.

    - 3. In the Animations group, click the arrow to the right of Animate.

    - 4. Select an animation for you.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_149_0.png)


    # Adding a Movie to Your Presentation


    PowerPoint 2007 makes it easy to insert a movie that is in the correct format.


    - 1. Go to the Insert tab.

    - 2. In the Media Clip group, select Movie.

    - 3. Select a movie for you.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_151_0.png)


    # Inserting a Movie from a File


    PowerPoint 2007 makes it easy to insert a movie that is in the correct file format.


    - 1. Go to the Insert tab.

    - 2. In the Media Clip group, select Movie.

    - 3. Select a movie for you.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_153_0.png)

