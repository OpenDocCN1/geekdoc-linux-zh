    # A Quick Look at Charts


    Charts in PowerPoint are linked automatically to Excel spreadsheets, so when you
    create a new chart you''ll see an Excel spreadsheet open simultaneously on your
    screen. This nifty feature makes it easy to change or add chart data; you simply
    make the updates in the associated Excel spreadsheet and the information is applied
    to your PowerPoint chart automatically.


    PowerPoint offers eleven different types of charts to choose from.


    | Chart | Description |

    | --- | --- |

    | Area | Places data into horizontal areas that show the relationship of each
    part to the whole |

    | Bar | Uses horizontal bars to illustrate differences in individual pieces of
    data by using categories on the vertical axis and values on the horizontal axis
    |

    | Bubble | Arranges data in a scattered format on a chart; compares sets of three
    values |

    | Column | Uses vertical bars with categories organized along the horizontal axis
    and values along the vertical axis |

    | Doughnut | Organizes data as a percentage of an entire pie and can contain more
    than one data series |

    | Line | Plots data into lines and organizes categories on the horizontal axis
    and values along the vertical axis |

    | Pie | Organizes data similarly to a doughnut chart but only contains one data
    series |

    | Radar | Compares cumulative values of a number of data series |

    | Stock | Arranges data in a specific order to illustrate fluctuations in stock
    prices and can also be used for scientific data |

    | Surface | Shows the most favorable combinations between two sets of numeric
    data |

    | XY | Similar to bubble charts but compares just two sets of data |


    MEMO

    Creating a chart in Excel and importing it into PowerPoint is also a simple process.
    See Chapter 13 for more details.


    ## Chapter 15 Working with Charts as Design Elements


    To insert a chart, go to the Insert tab and click Chart in the Illustrations command
    group. Select the type of chart you want, and click OK. For illustration purposes,
    we chose the 3-D Area chart.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_211_0.png)


    Once you''ve inserted the chart on your slide, a spreadsheet will open. Although
    you can easily use this spreadsheet to make changes to your data or chart information,
    go ahead and close it for now. We''ll show you how to open it on demand in "Working
    with Data Commands."

    Another you''ll notice once a chart has been added to a slide the addition of
    three new Ribbon tabs: The Chart Tools Design tab, the Chart Tools Layout tab,
    and the Chart Tools Format tab. In the following sections, we will explore each.


    ## The Chart Tools Design Tab


    Click your chart to activate the new tabs, and then click the Chart Tools Design
    tab. It will look similar to the one shown in Figure 15-1, although specific chart
    styles and layouts will differ if you have chosen a different chart than the one
    we''re using.


    ## PowerPoint 2007 Graphics and Animation Made


    From left to right, the Ribbon has four command groups: Type, Data, Chart Layouts,
    and Chart Styles.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_212_0.png)


    Figure 15-1 The Chart Tools Design tab


    ## Using Type Options


    You have two simple choices in the Type command group: You can change the chart,
    or you can see the current chart as a template. If you select Change Chart Type,
    you''ll see the entire selection of available charts again. Just select a new
    one and click OK. The chart on your slide will automatically change.


    If you want to save and reuse a particular type of chart, you can save it as a
    chart template. Add the chart to the slide, and then go to the Chart Tools Design
    tab in the Type group, click Save As Template. The Chart selects folder, type
    name for your chart, and click Save.


    Figure 15-2 Select Switch Rows/Columns to change the orientation of information
    on a chart.


    ## Working with Data Commands


    When you need to change the data in your chart, you have a couple of different
    options available in the Data command group. Your chart might be easier for you
    to understand, for example, if row and column data are reversed. In that case,
    select the chart and Switch Row/Column. Figure 15-2 shows how a simple change
    can make a chart look different. The top-left chart is the original version, whereas
    the bottom left shows the chart after using this command.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_212_1.png)


    ## MEMO


    To change plotting order of a data series in a chart quickly, go to the Chart
    Tools Design tab, and from the Data group, click Select Data and highlight the
    data series and click Move Up or Move Down.


    If you need to move the data to different locations in a chart, use the Select
    Data command. This opens the corresponding Excel spreadsheet, but it also opens
    the Select Data Source dialog box. This dialog box allows you to add, remove,
    move, and edit information or chart labels easily. You can also switch rows and
    columns using this dialog box.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_213_0.png)


    If you prefer to just use the Excel spreadsheet to make changes, click Edit Data
    in this command group to open the spreadsheet. When data changes in a linked Excel
    spreadsheet or when the data... (Wait, the OCR ends here. I will only output what
    is provided).


