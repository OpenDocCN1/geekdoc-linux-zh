    ## Introduction


    You know the basics of PowerPoint 2007; now it''s time to create imaginative graphics
    and animations that capture your audience''s attention. As long-time users of
    PowerPoint, we''ve designed this book to help you understand and use graphics
    and animations as easily as possible so you, too, can create professional, polished
    presentations with ease. In this book, you will discover how to create and effectively
    apply SmartArt, WordArt, charts, tables, shapes, and custom animations. You''ll
    also learn how to work with photos, clip art, movies, and sounds to give your
    presentations a distinctive and professional look.


    Along with information on designing general layouts using PowerPoint 2007''s built-in
    features, this book also explains each of PowerPoint''s ten basic graphic and
    animation types. The final part of the book will discuss how to use PowerPoint
    graphics with Excel and Word, as well as how to rehearse your presentation to
    verify your graphics and animations are working perfectly.


    Throughout the book, you''ll find:


    - Step-by-step instructions and practical advice

    - One-of-a-kind tips for creating and applying PowerPoint 2007 graphics and animations

    - Screen captures, photos, and art wherever it is needed so you can visualize
    and understand the topic under discussion

    - Briefings, which are short, nontechnical backgrounders on relevant people, companies,
    and technologies or topics of interest

    - Memos, which are marginal notes, tips, and reminders that offer useful advice
    or warn you about potential hazards

    - The Easy Way, handy tips that provide information about the best way to use
    features so you can accomplish tasks more easily


    As you read each chapter, keep an eye out for these helpful elements.


    ## Creating Slide Layouts That Pop


    PowerPoint 2007 is a terrific condensed tool to help others understand and remember
    information in a memorable way. Typically, PowerPoint presentations consist of
    slides that rely on a combination of words (text) and images (graphics and/or
    animations) to drive home a point. The way you combine these elements creates
    the design (layout) of the slide. Layouts are crucial to making a slide understandable
    and unforgettable.


    By combining text and visual objects on a slide, you can reach nearly every member
    of an audience with your message. The trick to using PowerPoint graphics and animations
    effectively, however, is to place the objects on the slide in a pleasing manner.
    Too many objects on a single slide, for example, and the audience can lose the
    entire point you''re attempting to make. But a single object used properly will
    successfully capture an audience''s attention and drive home the information.


    In this chapter, we''ll take a look at some basic design concepts to help you
    lay out your text, graphics, and animations as effectively as possible. Understanding
    typography, design principles, and the basics of designing a layout set the foundation
    for creating powerful presentations using PowerPoint 2007.


    ## Understanding Typography


    In its most basic form, typography is the art and technique of type design, characters,
    and arrangement. When we say type, we mean the text on your slide—type is how
    text on a page has been referred to for hundreds of years. The text should be
    on the page to produce a readable, articulate, and visually satisfying whole that
    makes it easy for readers to find what they want to read on a page.


    In the old days, setting typography was a very specialized occupation. Creating
    the text, designing the pages, and setting them for printing took special skill
    and knowledge. Text wasn''t just thrown onto a page; it was carefully set to emphasize
    certain stories or illustrations. That emphasis was thoughtfully designed to bring
    readers quickly to main points on a page and to lead them to other information
    on the same page. The goal, of course, to provide a memorable story so the reader
    could retain the information provided—just like you with a PowerPoint slide. Figure
    1-1 shows an example of a 1949 newspaper page set by a typographer. The arrangement
    and appearance of the printed matter was carefully constructed to make a lasting
    impression upon the reader.


    See how the text (headline) is angled the reader''s attention with the most important
    stories (at least, according to the editor) in the largest size and lesser stories
    in smaller sizes? The layout isn''t funny, but it gets the point across. Dinwiddie''s
    retirement and the unearthed skeletons in a local river are the most important
    items for the reader to note, with blood bank and business profiles being less
