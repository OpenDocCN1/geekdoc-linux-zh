    ## The PowerPoint Workspace


    When you design a PowerPoint layout, you are working within a PowerPoint workspace,
    which has four key areas. As shown in Figure 1-12, the four areas of the PowerPoint
    workspace are


    - Slide pane: Here, you can directly access and work on individual slides within
    a presentation. The Slide pane is used to design the actual slide layout—you''ll
    add placeholders to create the design.

    - Placeholders: These are used to insert animations, text, charts, pictures, and
    other objects.

    - Slides tab: This tab is where you can see thumbnails of each slide. You can
    add or delete slides in this area or click and drag thumbnails to rearrange slides.

    - Notes pane: You can use this section to enter notes about a particular slide.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_23_0.png)


    **MEMO**

    Notes do not appear when a presentation is being shown, but they can appear in
    printed versions of the presentation and are displayed in the Presenter View.


    Figure 1-12 The PowerPoint workspace holds four working areas.


    ## Adding Slides to a Presentation


    As you build your presentation, you''ll need to add slides to it. To do that,
    follow these steps:


    1. Go to the Home tab.

    2. Click the slide icon on the New Slide button in the Slides group.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_24_0.png)


    A Title And Content Slide with title and text sections will automatically be placed
    into your presentation. If you simply want to duplicate a slide and change a few
    items on it, follow these steps:


    1. Select the slide you want to duplicate on the New Slide tab.

    2. Click the down arrow next to the New Slide command.

    3. Click Duplicate Selected Slides, and the duplicate slide will be added automatically
    for you.


    If you want to add a completely different type of slide, follow these steps:


    1. Go to the Home tab.

    2. Click the down arrow next to the New Slide command.

    3. Choose a slide format from the Office Theme gallery.

    4. Click your selection to add it to your presentation.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_24_1.png)


    Chapter 1 Creating Slide Layouts That Pop


    **MEMO**

    The Slide Master will only be blank if you haven''t already chosen a layout or
    added placeholders. If you''ve already been working on a layout or chosen one
    of the PowerPoint layouts, the Slide Master will contain the elements and placeholders
    of that particular layout.


    ## Working with Slide Masters and Placeholders


    PowerPoint Slide Masters are the part of a slide template that stores information
    through the use of placeholders. When you use a Slide Master, you can make changes
    to a single slide (master) and the changes will be applied collectively throughout
    your presentation. So, for example, if you want to include a company logo on every
    slide footer in your presentation, you can add it to the Slide Master once, and
    then the logo will be shown on every slide throughout your presentation. As you
    add new slides, these will also include the logo. Or, you can choose to add the
    logo only to certain types of slides in a presentation.


    Slide Masters can be easily customized. In a Slide Master, layouts are used to
    position placeholders (such as the logo just mentioned) in any way you want. It''s
    a good idea to create all your Slide Masters before you start creating a presentation;
    slides added into a presentation are always based on the Slide Masters.


    To create a Slide Master, follow these steps:


    1. Go to the View tab.

    2. Click Slide Master in the Presentation group.

    3. A blank Slide Master will appear in the workspace, as shown in Figure 1-13.
    Notice that the Slide Master and Outline tabs on the left have been replaced with
    the Thumbnail pane, which shows a master slide and multiple layout slides (also
    known as the master layout).

    4. Click the Microsoft Office button.

    5. Click Save As.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_25_0.png)


    Figure 1-13 Slide Master view


    ## PowerPoint 2007 Graphics and Animation Made Easy


    6. Type in a filename for the slide master.

    7. Click the template type.

    8. Save.

    9. Go to the Slide Master tab and click Close.


    ## Add New Placeholders


    To add text, a graphic, or other type of placeholder to the Slide Master, follow
    these steps:


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_26_0.png)


    1. In the Thumbnail pane, click the slide you want to add to.

    2. Go to the Slide Master tab and click the arrow next to Insert Placeholder.

    3. Click the type you want to add: Content, Text, Picture, Table, SmartArt, Media.

    4. Click the placeholder.


    ## Add Custom Text to a Placeholder


    You might want to add custom text to single or multiple layouts that use placeholders.
    If you do, follow these steps using the Slide Master:


    1. Click the slide that will hold the custom text.

    2. In the text placeholder, type the custom text. For example, you might want
    your slide to say "Add Names Here" so that others use the template know where
    to type information. Figure 1-14 shows an example.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_27_0.png)


    Figure 1-14 An example of how to place custom text


    3. Go to the Slide Master tab and click Close.

    4. Go to the Home tab.

    5. Click Layout in the Slides group.

    6. Click the slide with the custom text. PowerPoint will automatically add it
    to your presentation.


    **MEMO**

    If you need to remove a placeholder, just click its border and press DELETE on
    your keyboard.


    ## THE EASY WAY


    ## Rename a Slide Master or Slide Layout


    To remove an unwanted slide from a Slide Master view, right-click the slide on
    the Thumbnail pane and Delete Layout.


    To rename a Slide Master:


    1. Click the Slide Master to be renamed.

    2. Go to the Slide Master tab.

    3. Click Rename in the Edit Master group.

    4. In the Rename Master dialog box, type in the new name in the Master box.

    5. Click Rename.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_28_0.png)


    If you have created a new slide layout within a Slide Master that you want to
    name, follow these steps:


    1. In the Thumbnail pane, click the slide layout you want to rename.

    2. Go to the Slide Master tab.

    3. Click Rename in the Edit Master group.

    4. In the Rename Layout dialog box, type in the new name in the Layout box.

    5. Click Rename.

