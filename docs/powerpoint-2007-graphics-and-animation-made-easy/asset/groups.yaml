    如果您想将边框外观从默认的实线更改，请点击“绘制边框 | 笔颜色”并点击您喜欢的选项。然后，使用鼠标（现在它在屏幕上显示为笔）在您想要更改的边框上绘制。边框将立即以您选择的新边框样式出现。您可以使用此命令在表格内应用多种边框样式，如图
    6-6 所示。如果您想更改边框线的宽度，可以使用“笔画”进行操作。从提供的选项中选择新的粗细。


    ## 备忘录


    在更改边框属性之前，请确保您已选择了最终的“表格样式”。如果您更改了表格样式，您几乎会丢失已应用的所有边框更改。


    需要更改边框颜色吗？只需选择不同的“笔画边框”组，然后在您想要更改的边框上绘制。顺便提一下，您可以使用橡皮


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_96_1.png)


    84


    使用“绘制边框”组中的“橡皮”命令来擦除表格中的边框。只需点击它，然后使用鼠标擦除任何不喜欢的边框即可。


    ## 添加效果


    表格图形的真正乐趣在于为表格添加效果。这些效果都位于“设计”选项卡上。您通常可以将效果应用于单个单元格以帮助其在观众眼中脱颖而出，也可以将效果应用于整个表格。虽然通常不建议对整个表格应用效果，因为这可能会使表格难以阅读，但有时也是有效的。然而，某些效果无论您是尝试将效果应用于单个单元格还是整个表格，都会以特定的方式应用到您的表格上，因此您需要稍微尝试一下看看每种效果如何影响您的表格。


    您可以对表格应用三种主要效果：单元格斜角、阴影和倒反射效果。


    通过*单元格斜角*（Cell Bevel），您可以为表格中的单个单元格应用斜角效果。当您需要突出显示表格的特定区域时，这种效果的影响最大。


    要应用单元格斜角，请选择您想要突出显示的单元格；然后进入“表格样式”命令组，选择“效果 | 单元格斜角”，然后选择一个斜角选项。


    *阴影*（Shadow）则应用于整个表格。您可以从内阴影和外阴影选项中进行选择。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_97_0.png)

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_97_1.png)

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_97_2.png)


    | | | | | | |

    |---|---|---|---|---|---|

    | | | | | | | |

    | | | | | | |

    | | | | | | | |

    | | | | | | | |


    倒反射（Reflection）同样应用于整个表格。


    您可以将阴影和倒反射效果结合单元格斜角效果使用。


    ## 理解表格样式选项


    “表格样式选项”组与“表格样式”画库配合使用。选择或取消选择表格样式选项，表格样式画库中显示的即时样式将随之变化。这些选项是：


    - 标题行：专门格式化表格的第一行。

    - 汇总行：应用于表格的最后一行。此选项会计算列总和并显示它们。

    - 行斑纹：对偶数行和奇数行进行不同的格式设置，以便阅读。

    - 第一列：专门格式化表格的第一列。

    - 最后列：专门格式化表格的最后一列。

    - 列斑纹：对偶数列和奇数列进行不同的格式设置，使其更容易阅读。


    > 备忘录

    需要删除第一行下方的线条吗？进入“样式选项”并取消选择“标题行”。


    ## 第 6 章处理表格


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_99_0.png)


    图 6-7 和 6-8 显示了不同的表格样式选项如何影响画库选择。


    本章涵盖了 PowerPoint 中使用表格的大内容。您学习了如何使用表格样式添加颜色、表格样式选项和效果，并使用各种工具让您的表格脱颖而出，并清晰、简洁地传递信息。在下一章中，我们将展示您如何使用
    WordArt 来表达您的观点。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_99_0.png)


