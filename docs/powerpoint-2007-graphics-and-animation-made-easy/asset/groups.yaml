    # Cell Size


    While you can certainly grab the edges of cells or the entire table to drag resize
    the given item, you can also change the size of these items incrementally by using
    the Cell Size command group. (You can also use the Table Size group.) These options
    are particularly helpful when you have a table that needs to fit in a very specific
    location on your slide. This command group also offers you the options of equally
    distributing the height and width of rows or columns. Just click Distribute Rows
    or Distribute Columns and PowerPoint does the rest to be sure your columns and
    rows are perfectly sized.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_93_0.png)


    # Alignment


    You can customize the text margins of the cells in your table using the Cell Margins
    commands in the Alignment group. If the text is bumping against the edges of a
    cell, for instance, these commands can help you make the text more appealing to
    readers. You can select from preset options or Custom Margins to determine your
    own. In the Cell Layout dialog box, just specify the internal margins that you
    want. Figure 6-3 shows the difference between original text (left cell) and text
    placed within customized margins (right cell).


    You can also change the direction of text within the table cells using the Text
    Direction commands in the Alignment group. Highlight multiple cells to change
    text direction in more than one cell.


    # Table Size


    If you need to keep your table at a certain aspect ratio to make it work correctly
    on your slide, the Table Size command group is the place to get that done. Just
    place a mark in the box next to Lock Aspect Ratio.'
