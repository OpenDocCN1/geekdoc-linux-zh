    | t s |\n\n## Edit Points in a Graphic\n\nSometimes, you might want to change\
    \ the sizing or shapes in part of your graphic. In Figure 5-8, for example, the\
    \ left graphic shows sky, ocean, and sand in original proportions. The right graphic,\
    \ however, shows the sand at an angle to the ocean above it. The sand portion\
