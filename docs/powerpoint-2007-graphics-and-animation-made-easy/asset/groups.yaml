    totals and displays them.

    - Banded Rows Formats even and odd rows differently so they are easy to read.

    - First Column Specifically formats the first column in a table.

    - Last Column Specially formats the last column in a table.

    - Banded Columns Formats even and odd columns differently to make them easier
    to read.


