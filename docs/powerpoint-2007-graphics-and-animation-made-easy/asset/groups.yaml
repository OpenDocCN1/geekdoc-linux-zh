    ## Chapter 11 Adding Sound to Your Presentation


    The sound icon will appear on the slide.


    In this chapter, you learned when to consider adding sound to your presentation,
    how to insert and adjust sound files, how to set up text and objects to trigger
    the sound, and how to use CDs and narrations to enhance your presentation. We
    briefly touched on animations in this chapter, but in the next chapter, you''ll
    learn about animations in more detail.


    ## HOW DOES YOUR VOICE SOUND?


    When you''re recording a narration, be aware of how your voice sounds. For example,
    if you''re reading directly from a script, rephrase it a few times so you sound
    more natural instead of like you''re reading.


    Do you have a tendency to sound monotone? Look closely at where you''re reading
    and saying and find spots where you can offer a bit of inflection to make it interesting
    for the listener. The rise and fall of your voice can make the difference in whether
    you excite or bore the listener.


    Are you enunciating? Wake up that lazy tongue so it doesn''t list in the back
    of your throat or say hello-o-o-o lips that don''t open fully. Practice over-enunciating
    this phrase a few times to get your mouth warmed up: "The lips, the teeth, and
    the tip of the tongue." Over-enunciating may seem strange when you rehearse, but
    once you begin recording, you''ll fall into an easy and understandable rhythm
    that sounds natural.


    Does your voice have a tendency to go into the upper regions where only dogs can
    hear? Then keeping your voice in the lower ranges and record yourself as you practice.
    This way, you''ll know what sounds to the ear.


    No matter what voice issue is, you can improve it with concentrated practice and
    by recording yourself regularly. If you''re serious about making a change, hire
    a vocal coach who specializes in the word. Or many times, your local college or
    university; many times, an abbreviated class may be open to non-students during
    the semester.


    ## Creating and Using Animations


    Part of the fun of using graphics in a presentation is the ability to animate
    them to increase their visual impact. Almost any object, including text, single
    bullets, and list items, can be animated. Plus, you can apply animation effects
    to individual slides, the Slide Master, or custom layouts.


    With animation, you essentially bring a still object to life by allowing it to
    move on the slide. This movement is what captures the audience''s attention. The
    trick to effective animation, however, is to use restraint. Too much animation
    can become overwhelming for viewers, in which case they can''t focus on the information
    they want to retain.


    In this chapter, we''ll take a look at how animation can be used effectively in
    a presentation. We''ll also show you how to use built-in animations, create custom
    animations, and how to work with special animation effects. As a bonus in this
    chapter, we''ll also explain how to rehearse a presentation and use Presenter
    View. You''ll need these skills to be certain as your animations are coming across
    as effectively as you think they are.


    ## Overview of Animations


    In most cases, use the same animation feature for all objects on a single slide.
    For example, if you wipe in one object, wipe them all in. You can have them appear
    from different places, but your audience will be distracted if all items essentially
    appear on the screen in the same manner.


    When you work with animations, keep in mind the design principles mentioned in
    Chapter 1. Simplicity, really, is the key to using animations successfully. Usually,
    a single animation is plenty for a given slide. Sometimes, however, multiple animations
    might not be only useful but downright necessary.


    For example, bulleted lists can sometimes be overpowering on a slide. Easing viewers
    into a concept slowly by displaying bullets one at a time might be helpful. In
    this case, the use of multiple animations is the right choice: You can select
    an animation sequence that displays only as you click the mouse. This method keeps
    the pertinent point on the screen and allows you to control when the audience
    sees the next point. Audience members who might be tempted to read ahead without
    listening are thwarted, and you remain in control of how—and your content is displayed.


    On the other hand, if you use this approach also apply animations to each bullet
    as it appears (for instance, each bullet flies from the side or top of the slide,
    spinning as it drops into place), you might defeat the entire purpose of thoughtfully
    drawing your viewers through salient points one by one. Instead, their focus will
    be on wondering where the next bullet will come flying in.


    Animation speed is also an important consideration. Animate too many objects too
    quickly on a slide, and your audience might get dizzy. Animate too slowly, and
    your audience might drift off to sleep.


    Sound can be used in the animation process, too. Check out Chapter 11 for information
    about playing sounds as part of an animation sequence.


    In the end, rehearsing your show slide is critical so you can see what your audience
    will see. Look at your presentation from your perspective, and you just discover
    that a fun, quirky animation isn''t really that cool after.


    ## Rehearsing Your Presentation


    Before we get started with animations, let''s take a minute to get up to speed
    by rehearsing slide shows. Rehearsing is a way to preview your presentation.


    ## Chapter 12 Creating and Using Animations


    Rehearsing helps catch errors that might be visible to viewers when the slide
    runs. By rehearsing, you can check timings, slide transitions, and special effects.
    To rehearse your presentation before you add animations, you''ll need to open
    the presentation in Slide mode.


    ## THE EASY WAY


    Once you''ve confirmed that your graphics are behaving as they should, it''s a
    good idea to rehearse your presentation. Rehearsing gets you comfortable with
    the slide and lets you verify your slide show is correct. To rehearse a slide
    show, follow these steps:


    You can also start your slide show by clicking From Current Slide to start the
    show you are currently viewing


    - 1. Go to the Slide Show tab.

    - 2. In the Set Up group, click Rehearse Timings.


    Use the Rehearsal toolbar to advance to the next slide, pause, and repeat the
    slide as necessary. The toolbar also shows timings for individual slides as well
    as the overall presentation.


    If you want to keep the recorded slide timings, click Yes in the message box that
    appears after the last slide timing is set. If you do not, click No.


    If you keep the slide timings, the presentation will switch to Slide Sorter View
    to show the presentation and the time it takes to play each slide. The rehearsed
    timings will automatically advance the slides for the next time you play the slide
    show. Be careful here, however. Preset timings can advance slides before you are
    ready. This can cause your presentation to seem out of control in front of an
    audience. If you want to remove rehearsed slide timings temporarily, go to the
    Slide Show tab and clear the Use Rehearsed Timings checkbox in the Set Up group.

