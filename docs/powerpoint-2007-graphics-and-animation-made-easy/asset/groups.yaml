    each option so you can see how minor adjustments to a graphic can make a big difference.


    # Picture


    With the Picture option selected, you can recolor the graphic, change its brightness
    or contrast, or reset the graphic to its original look.


    +   - Click the Recolor button to select from preset color variations.


    +   - Slide the handle or use the up and down arrows to change brightness and
