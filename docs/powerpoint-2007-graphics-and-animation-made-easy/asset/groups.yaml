    # Chapter 12 Creating and Using Animations


    When you''re discussing different major concepts, you can effectively add a major
    slide transition to alert the audience to the change.


    Transitions can be applied to individual slides or to all slides in a presentation.
    A Quick Styles Gallery makes it very easy to apply transitions, and this can be
    a simple way to add a little animation to a presentation without much work on
    your part.


    To apply the same slide transition to every slide in a presentation, follow these
    steps:


    - Open the presentation in Normal View.

    - Go to the Slides tab in the left pane.

    - Click any slide thumbnail in the Animations tab.

    - Go to the Transition To This Slide command group, click a transition style from
    the Quick Styles Gallery. You can use the More arrow to see the entire gallery
    as shown to the left.

    - In the same group, click Apply To All.


    If you prefer a different slide transition to each slide, simply click the slide
    thumbnail on the Slides tab of the left pane and follow these same steps except
    for Step 6. As you hover your mouse over various transition options, watch the
    slide to see a Live Preview of each transition.


    In this chapter, you learned how to work with animations in a variety of ways,
    including built-in animations and custom effects. In the next chapter, we''ll
    show you how to import Excel into PowerPoint.


    | No Transition | | | |

    | :--- | :--- | :--- | :--- |

    | Fades and Dissolves | | | |

    | Wipes | | | |


    # Importing Excel Content into PowerPoint 2007


    PowerPoint 2007 makes it easy to use Excel content within your presentation. You
    can copy a chart or worksheet data from Excel to your presentation or simply create
    your own chart within PowerPoint. This will save you time and a lot of headaches
    because you enter the data only once and move it to the appropriate place.


    Compatibility is not only a time-saver but also a quick way to make your presentations
    look sharper and more professional. Let''s take a look at how you can move information
    to PowerPoint with just a few mouse clicks.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_193_0.png)


    # Sending a Chart from Excel to PowerPoint


    If you want to copy a chart created in an Excel spreadsheet to PowerPoint, follow
    these steps:


    1. Highlight the embedded chart or chart in Excel.

    2. On the Home tab, go to the Clipboard group.

    3. Click Copy.

    4. In PowerPoint 2007, select the presentation slide where you want to paste the
    chart.

    5. Go to the Home tab and in the Clipboard group, click Paste.

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_194_0.png)

    6. Click Paste Options icon to the chart and select one of these:

    - Chart pastes a chart linked to Excel data

    - Excel Chart includes the entire workbook

    - Paste As Picture pastes the chart as a picture

    - Keep Source Formatting retains the chart''s original formatting

    - Use Destination Theme pastes the chart using the presentation''s theme


    The Paste Options icon disappears if you move or click away from the chart when
    you paste it.


    # Copying Worksheet Data into PowerPoint


    In PowerPoint 2007, you can copy data from an Excel worksheet into PowerPoint,
    create an Excel spreadsheet in PowerPoint to enter your data directly, paste data
    from other formats, or add hyperlinks.


    - In Excel, select the data you want to copy from the worksheet.

    - Go to the Home tab in the Clipboard group.

    - Click Copy.

    - In PowerPoint 2007, select the slide you want to paste the data into.

    - Go to the Home tab.

    - In the Clipboard group, select Paste.

    - Click the Paste Options icon to the data on the slide and select one of the
    following:

    - Keep Source Formatting maintains the original format

    - Use Destination Theme uses the document theme applied to the PowerPoint presentation

    - Keep Text Only pastes the data as text


    # PowerPoint 2007 Graphics and Animation Made Easy


    Select the Table tab to add various formatting options such as color, borders,
    fill, and special effects. Chapter 6 describes how to use tables in PowerPoint
    2007.

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_196_0.png)


    If you don''t see the Paste icons, you may need to turn them on. Click the Office
    button and then click Paste Options, as shown on the left. Select Cut, Copy, Paste
    Show Paste Options (shown on the right). If you paste into a PowerPoint table,
    the Paste Options icon does not appear.

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_196_1.png)


    You can also create a functional Excel sheet directly in your presentation. Go
    to the Insert tab, and from the Tables group, select Excel Spreadsheet. A spreadsheet
    will appear on the slide for entering data, along with commands to perform Excel
    functions, as shown in Figure 13-1. Use the up and down arrows to move around
    in the spreadsheet when it is highlighted, or simply resize the spreadsheet by
    dragging the edges.

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_197_0.png)


    Figure 13-1 An spreadsheet can be inserted directly in your presentation.


    If you need to paste the data in another format such as a worksheet object, bitmap,
    or picture, go to the Home tab, and from the Clipboard group, select Paste | Paste
    Special. From the Paste Special dialog box, select the format you''d to use.


    Here are a few options for pasting into PowerPoint:

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_197_1.png)


    - If you need to edit the worksheet later, select Microsoft Office Excel Worksheet
    Object. This option lets you make the entire worksheet along with changing data
    that you don''t want to display.

    - If you want to paste the data using Object Linking and Embedding (OLE) and as
    a PowerPoint icon instead of including the actual content, select Microsoft Office
    Worksheet Object and select the Display As Icon checkbox. In your presentation,
    click the icon to see the content.

    - In the Paste Special dialog box, you can ensure the table in the presentation
    is updated when changes are made to the Excel by selecting Paste Link. This will
    link to the source file and maintain the original formatting from Excel.

    - In the Paste Special dialog box, you can select Attach Hyperlink if you want
    to include a hyperlink in the presentation to your source data in Excel.

    - By clicking the down arrow in the Paste command group, you can select Paste
    As Hyperlink to insert a hyperlink to the source data in Excel. (Be sure to save
    the source data before attaching a hyperlink or this option will not work.)

    - If you want to paste as a picture, you can select Device Independent Bitmap,
    Bitmap, Picture (Enhanced Metafile), or Picture (Windows Metafile).

    - To paste as text, click Formatted Text (RTF) or Unformatted Text.

    - You can also paste the data in the HTML format by selecting HTML Format.

    - You can expand the range of data pasted into your presentation when the correlating
    data on the Excel worksheet expands. Just define a name for the range of Excel
    data before you copy it, and then you can paste a link to that range. From the
    Home tab, go to the Clipboard group and select Paste | Paste Special. In the Paste
    Special dialog box, click Paste Link and select Microsoft Excel Worksheet Object
    from the drop-down list. This option works when you copy data that isn''t in table
    format in Excel.


    # Creating a Chart in PowerPoint


    You can create a chart in PowerPoint by entering data directly into the presentation.


    1. Go to the Insert tab.

    2. In the Illustrations group, click Chart.

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_199_0.png)

    3. From the Insert Chart dialog box, select the type of chart you want to create.

    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_199_1.png)

    4. Click OK.

