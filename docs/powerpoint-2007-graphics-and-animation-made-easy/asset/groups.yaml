    ## The Chart Tools Format tab


    The final tab available to you when working with charts is the Chart Tools Format
    tab, as shown in Figure 15-15.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_222_0.png)


    Figure 15-15 The Chart Tools Format tab


    For the most part, you''ve seen these formatting options several times already
    in this book. Chapter 7 explains how to work with WordArt,

    Chapter 8 explains the nuances of working with shapes. Except for the fact

    it only applies to the chart you''re working with, there''s nothing really new

    on this.


    So, if you want to make the title of a chart look cool by applying WordArt to
    it, it is the tab to use. Click the text box, and apply the WordArt styles

    desired. You do the same thing with shapes, grouping, ungrouping, sizing

    text boxes, gridlines, and the selection pane—simply select the chart element
    in question and use the tool on the tab.


    If it were difficult, we''d tell you! Even though this tab is redundant

    or other Ribbons in PowerPoint, it is beauty that it places all those commands

    right in front of you as you work on your chart.


    And truly is the beauty of PowerPoint 2007 in a nutshell, really.

    Everything you need is at your fingertips on a Ribbon tab. As you''ve learned

    throughout this book, once you''re on the right tab, you can find commands

    quickly and easily. How you''ve learned a few new things about graphics

    and animations with PowerPoint 2007; looking like a pro is easy when

    know the right tools and commands to use.


    > MEMO

    Are larger 3D data markers blocking smaller in your chart? Select the chart element
    that needs to be moved, and then go to the Chart Tools tab, from the Current Selection
    command group, select Depth Series Axis | Format Options | Series In Reverse Order.
    Click Close.


