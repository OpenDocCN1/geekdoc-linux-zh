    # Working with Tables


    Maybe you don''t think of a table as a graphic presentation tool, but we sure
    do. Purists might say tables are simply used to lay out information graphically,
    but they aren''t considering the fact that information within tables can be animated
    in PowerPoint (more on that in Chapter 12) or can be changed into pictures and,
    therefore, become graphics in and of themselves.


    The bottom line is that tables are a wonderful tool for displaying information;
    you can compile information from a variety of sources and lump it all together
    into a single table that clearly outlines every detail. Easy to understand and
    use, tables can be added to a presentation through either an automatic process
    or a custom design.


    If you''ve got a presentation that seems heavy on bullets, consider using a table.
    Tables are a great way to break up the monotony of bulleted page after bulleted
    page, and the effects and options available in PowerPoint 2007 can make your tables
    look sharp and professional. Although you might not have considered using tables
    as a graphic presentation tool, you can design tables in new ways that will have
    you thinking twice about the entire idea.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_89_0.png)'
