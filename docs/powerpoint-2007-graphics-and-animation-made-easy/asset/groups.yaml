    Use the Rehearsal toolbar to advance to the next slide, pause, and repeat the
    slide as necessary. The toolbar also shows timings for individual slides as well
    as the overall presentation.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_178_0.png)


    If you want to keep the recorded slide timings, click Yes in the message box that
    appears after the last slide timing is set. If you do not, click No.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_178_1.png)


    If you keep the slide timings, the presentation will switch to Slide Sorter View
    to show the presentation and the time it takes to play each slide.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_178_2.png)


    The rehearsed timings will automatically advance the slides for the next time
    you play the slide show. Be careful here, however. Preset timings can advance
    slides before you are ready. This can cause your presentation to seem out of control
    in front of an audience. If you want to remove rehearsed slide timings temporarily,
