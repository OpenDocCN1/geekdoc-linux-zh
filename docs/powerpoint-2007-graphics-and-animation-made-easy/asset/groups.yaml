    ## 操作标签


    某些图表布局会自动为你提供各种图表标签，如标题或图例。另一些则不会。你可以使用“标签”（Labels）命令来更改或添加图表标签。大多数标签选项通常允许你从更大的菜单中进行选择，以真正自定义标签；请查看每个标签菜单底部的“更多选项”（More
