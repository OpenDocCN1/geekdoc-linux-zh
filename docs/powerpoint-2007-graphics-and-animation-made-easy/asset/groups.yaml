    # THE EASY WAY


    If you''re searching for clip art and decide that you want to download the clip
    from a single Office Online page, don''t bother selecting photos one by one. Instead,
    click Select in the bottom-left corner of the search results. All items on the
    page will be selected and placed in your Select Basket for download. The Page
    option will change to Delect Page; click it to deselect those items so you can
    move on in your search.


    Follow these steps to download the clip art:


    +   1. Click Download (1) Item(s). (The actual text will vary depending on how
    many items you''ve chosen.)


    +   2. From the Download screen, click Download Now.


    +   3. Click Open.


    Be patient—the download might take a while. When complete, the downloaded item(s)
    will appear on your hard drive under My Collections in the Download Clips folder
    of the Clip Organizer, as shown in Figure 5-3. Read “How PowerPoint Organizes
    Your Clips” to learn more about the Clip Organizer.


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_76_0.png)


    > Figure 5-3 Downloaded clips are filed in the My Collections folder.


    # Online Searches


    While Microsoft Office Online might provide you with the clip art you''re seeking,
    the site doesn''t always have what you need. In those situations, perform an online
    search to find and what you need. Just use your browser and search engine (such
    as Google or Yahoo!) and enter the search terms for the type of item you''re seeking.
    One of caution: Be sure that anything you download from a site other than Microsoft
    Office Online doesn''t have any copyright restrictions. Many sites offer free
    clip art, but some have specific rules for how you use that clip art. For example,
    some sites might'
