    # Creating Effective Shapes


    Shapes in PowerPoint 2007 lend themselves to a number of uses for work and play.
    Whether you need shapes for a flow chart or you simply want to show off the “star”
    of your family, shapes are a great way to highlight important points, people,
    and objects in your presentation.


    PowerPoint 2007''s ready-made shapes are the perfect start for using shapes, but
    you can also customize a shape to suit your needs. In this chapter, you''ll learn
    when to use shapes, how to add fill, outlines, and effects to shapes, and how
    to add text to a shape to give your message more punch. You''ll also learn how
    to edit a shape or create your own for those special messages that need a little
    more zing.'
  - '[PAGE 120]


    # When to Use Shapes


    In Chapter 1, you learned that “less is more.” This is an important design concept
    that will serve you well as you create your PowerPoint 2007 slides. The main thing
    to remember is that one stunning element can make an extraordinary statement in
    the midst of messages on top of messages that are vying for attention. Using shapes
    as well as other options sparsely are your best bet for creating dramatic, memorable
    slides.


    Take a moment to determine your message. What are you trying to communicate? Are
    you trying to make your audience laugh, or are you conveying a poignant moment?
    Are you closing the deal with your most important selling points, or are you providing
    a high-level overview of the product’s benefits? Determining what you want to
    communicate will be the first step in selecting the shape you’ll use.


    # Selecting and Inserting a Shape


    You’ll find the Shapes command on the Insert tab:


    +   1. Go to the Insert tab.


    +   2. From the Illustrations group, select Shapes.


