    | 顶部水平 L 型 | 标题效果，内置 1 |

    | 中间圆形 | 微妙效果，强调色 5 |

    | 中间波浪 | 彩色轮廓，强调色 5 |

    | 下方圆形 | 强化效果，强调色 5 |

    | 下方水平框 | 填充，强调色 6 |


    # 修改单个形状的颜色和边界


    之前我们解释了如何通过整个 SmartArt 更改颜色。在这里，我们将为您展示如何更改单个形状内的颜色和边界。更改形状颜色的命令位于“形状样式”命令组中；选择想要更改颜色的形状，然后点击“形状填充”并选择新颜色。


    你可以像使用同一组中的“形状轮廓”命令一样轻松地更改形状轮廓或边界。选择想要更改边界的形状，然后点击“形状轮廓”并选择新的轮廓。


    # 在没有图片图标的情况下向形状添加图片


    当图片图标出现在 SmartArt 中时，表示该形状可以接受并自动调整图片大小以适应相关的特定形状。通过这种方式，你的图片不会发生严重的扭曲。然而，如果你喜欢，仍然可以向其他形状添加图片。只需注意，它们可能会被拉伸得有些奇怪，或者看起来有点呆。如果你不喜欢图片的样子，可以随时撤销命令，因此请按照以下步骤在任何没有图片图标的
    SmartArt 形状中尝试一下：


    - 1. 选择形状。

    - 2. 转到“形状样式”组中的“形状填充”。

    - 3. 点击“图片”。

    - 4. 选择图片并点击“插入”。


    图片将插入到你的图形中，如图 9-9 所示。在示例中，你可以看到照片是如何拉伸的；你可以调整形状的大小，看看是否有助于让照片看起来更正常。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_146_0.png)


    # 立即将幻灯片文本转换为 SmartArt


    在制作幻灯片时，你不需要从 SmartArt 开始；你可以先从文本开始，如果需要，可以将该文本快速转换为 SmartArt。虽然该过程在处理项目符号列表时最有效，但即使只有一个单词或句子也可以进行转换。以下是操作方法：


    - 在幻灯片上输入文本。

    - 右键点击文本框。

    - 选择“转换为 SmartArt”。

    - 选择一个 SmartArt 形状。


    你的文本现在将作为你选择的 SmartArt 选项出现。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_147_0.png)


    # 为 SmartArt 添加动画


    好了，现在我们到了 SmartArt 的真正趣味所在：动画。虽然我们将在第 12 章中详细解释动画，但我们将向你展示现在就可以用 SmartArt 做的一些事情。你可以像对几乎任何其他对象一样为
    SmartArt 添加动画，但这里有几点注意事项：


    - 第一，形状在 SmartArt 中出现的顺序将决定动画播放的顺序。你无法挑选哪些形状在特定时间执行动画，尽管你如果你喜欢，可以反转整个 SmartArt
    图形来制作动画。


    - 第二，将每个 SmartArt 图形视为一个唯一的项目。由于涉及的 SmartArt 类型，动画将以不同的方式发生，因此我们无法在几段文字中解释所有的组合。当你开始为
    SmartArt 添加动画时，给自己留出额外时间来尝试。但不要在演示文稿有严格截止日期时尝试弄懂所有问题。


    - 第三，智能形状之间的连接线将不会单独执行动画。


    - 最后，在处理设计时要小心。要为 SmartArt 添加动画，请按照以下步骤操作：


    - 1. 选择形状。

    - 2. 转到“动画”选项卡。

    - 3. 在“动画”组中，点击“动画”右侧的箭头。

    - 4. 选择一个动画。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_149_0.png)


    # 向你的演示文稿添加视频


    PowerPoint 2007 让插入格式正确的视频变得非常简单。


    - 1. 转到“插入”选项卡。

    - 2. 在“媒体剪辑”组中，选择“视频”。

    - 3. 选择一个视频。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_151_0.png)


    # 从文件插入视频


    PowerPoint 2007 让插入文件格式正确的视频变得非常简单。


    - 1. 转到“插入”选项卡。

    - 2. 在“媒体剪辑”组中，选择“视频”。

    - 3. 选择一个视频。


    ![](img/bf2a856bcd8fc3e8384ecc7137df5347_153_0.png)


