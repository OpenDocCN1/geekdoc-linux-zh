- pgno: 62
  md: '# Restrict access to kadmin login using the /etc/sudoers file:


    Run "nano /etc/sudoers" and add a block like:

    # Allow users in the ''kdc_admin'' group to run kdc_admin@EXAMPLE.COM

    %kdc_admin ALL=(NOPPASSWD: /usr/sbin/kadmin-local -p kdc_admin@EXAMPLE.COM


    %kdc_admin sets the rule applies to users in the kdc_admin group (create it using
    "groupadd kdc_admin")

    "ALL = NOPASSWD allows members to run kadmin-local without a password, but only
    when using the kdc_admin@EXAMPLE.COM with the -p option

    /usr/sbin/kadmin-local -p" simply executes the command with sudo.


    # Verification:


    Create a user account that belongs to the kdc_admin group you created, or as the
    newly created user.

    Run "sudo kadmin-local -p kdc_admin@EXAMPLE.COM"

    You should be prompted for the password of the kdc_admin (the one generated in
    step 2). If successful, you''ll enter kadmin-local mode impersonating the kdc_admin.


    # Other Admin commands


    +   - addprinc <principal> Adds a new principal (or service account) to the database

    - delprinc <principal> Deletes a principal from the Kerberos database

    - modprinc <principal> Modifies attributes of an existing principal

    - rename_principal <old> <new> Renames an existing principal in the Kerberos database

    - changepass Changes password of an existing principal

    - qpw <principal> Alias for password

    - listprinc Lists all principals in the Kerberos database

    - getprinc <principal> Retrieves displays information about a specific principal

    - ktadd -keytab <file> -princ <principal> Removes a key from a keytab (password
    authentication)

    - ktdestroy -keytab <file> Destroys a keytab (with caution)

    - getpolys Shows attributes of privileges of current user for kadmin-local CLI

    - addpol <policy> Adds a new policy to the Kerberos database (password rules,
    ticket lifetimes, etc.)

    - modpol <policy> Modifies attributes of an existing policy.

    - delpol <policy> Deletes a policy from the Kerberos database.

    - getpolicy <policy> Retrieves displays information about a specified policy.

    - purgekeys <principal> Removes all keys for a principal that are not the most
    recent.


    # SELinux Boolean


    +   - allow_http_kdc_init Access on TCP port 464 for administrative access to
    the KDC.

    - allow_kadmin_port Needs to support DDC clients using Kerberos.

    - allow_kerberos_t Enabling T TF traffic for the KDC

    - allow_kerberos_kt_get Enables Delegation of Granting Tickets (GTs)

    - allow_mit_rb5_migrate Needed if migrating Kerberos principals.

    - allow_smbd_rb5_init Required if using Kerberos for Samba authentication.

    - allow_login For SSH connections.

    - allow_unreserved_ports Allows applications to bind to privileged ports (ports
    1-1024)


    # SELinux File Contexts


    +   - /etc/krb5.conf

    - /var/lib/krb5/*

    - /var/log/krb5/*

    - Keytab=/etc/krb5.keytab

    - /usr/sbin/kadmin, /usr/sbin/krb5kdc

    - /run/krb5 (if used)


    ```

    firewall-cmd --permanent --add-service=krb5 # Opens default Kerberos ports (TCP
    88 and UDP 88)

    firewall-cmd --permanent --add-service=kadmin # Opens KDC administration port
    (TCP 464)

    iptables -A INPUT -p tcp --dport 88 -j ACCEPT

    iptables -A INPUT -p udp --dport 88 -j ACCEPT

    systemctl restart krb5kdc kadmin

    ```'
