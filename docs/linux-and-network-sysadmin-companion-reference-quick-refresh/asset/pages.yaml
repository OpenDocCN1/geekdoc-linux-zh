    192.168.1.10

    0000.aaaa.aaaa


    GLBP Group 1 Priority 150

    VLAN 50

    192.168.1.11

    0000.bbbb.bbbb


    VLAN 50

    192.168.1.12

    0000.cccc.cccc


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_180_0.png)


    Switch A


    Switch B


    Switch C


    AVG:

    All ARP Replies:

    for

    192.168.1.1


    Outbound

    Traffic to

    Gateways


    Redundancy is also inherent in the GLBP group: Switch A is the AVG, but the next-highest
    priority router can take over if the AVG fails.


    All routers have been given an AVF role for a unique virtual MAC address in the
    group.


    If one AVF fails, some clients remember the last-known virtual MAC address that
    was handed out. Therefore, another of the routers also takes over for the failed
    router, causing the virtual MAC address to remain alive at all times.


    Above is illustrated how these redundancy features react when the current active
    AVG fails. Before its failure, Switch A was the AVG because of its high GLBP priority.


    After it failed, Switch B became the AVG, answering ARP requests with the appropriate
    virtual MAC address for gateway 192.168.1.1.


    Switch A also had acting as an AVF, participating in the gateway load balancing.


    Switch B also picks up this responsibility, usings virtual MAC address 0007.b400.0102
    along the one Switch A had been using, 0007.b400.0101.


    Therefore, any hosts that know the gateway by any of their virtual MAC addresses
    still reach a live gateway or AVF.'
