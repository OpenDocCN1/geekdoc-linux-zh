    Config files


    Services (Systemd & init)


    /etc/sysconfig/nfs,/etc/exports /etc/init.d/nfs,/etc/init.d/rpcbind-service start,
    restart rpcbind start


    Permissions


    /etc/exports, file options, root stan (locking, status info) /etc/stab


    RPC


    Automount


    NFSv3 Common permissions in the /etc/exports


    Self-explanatory: read-rw), root_squash, and (no) -


    Forces requests from the root UID (0) on the client to map to the anonymous (usually
    nfssquash) on the server, to prevent accidental or malicious modifications by
    the root user on the client. Use ''chown nobody:shared'' for shared folder


    no_root_squash


    Provides access with full file permissions (unless ACL). Use this option with
    caution to prevent security risks.


    all_squash


    A more aggressive version of root_squash that maps all client UIDs to the anonymous
    user on the server, regardless of the client user (unless the client has special
    privileges).


    anonid/anonid


    Allow you to map UID and GID of the anonymous user to the server user for mapped
    clients when root_squash or all_squash is enabled. These have the same function
    as used with mount command


    sync/async


    You can specify rights for specific hosts or networks. In the access control list,
    you can use CIDR notation like 192.168.1.0/2


    NFSv4 introduced features


    Added options for inheritance and setting permissions for individual directories
    in /etc/exports


    +   - Root fault allows you to export a serving directory instead of a mount.

    - Allows you to send them access decisions

    - Access Control Lists (ACLs) on exported directories provides extensions for
    setfacl and getfacl to support NFS, for more granular access permissions for specific
    users and groups

    - Security options provide more granular authentication and authorization mechanisms
    using a Kerberos option. An older version of MLM (Network Lock Manager) is outdated,
    and NFS delegations (built into NFS) has been replaced. For security, Kerberos
    is the best solution. Kerberos options are krb5, kb55, and use kb5 for Kerberos
    security with encryption for data privacy and integrity protection. Kerberos is
    not widely known. There was also a service called nfs-server.service is integrated
    into nfs-server


    Some examples of the NFSv4/etc/exports


    /data/* (rw_squash, read access for all, all_squash for security- this is not
    without and advised)

    /directory/* -export=krb5,rw,root_squash,sync; # Consider Using ACLs instead of
    root_squash

    # Export with Kerberos, read-write access, squashing, and sync

    /home/users,nfsuser,user_acl=krb5) # Preferred access

    # Export /home/users with ACL, NFSv4, and Kerberos


    # Commands:


    Use exports to manage NFS exports. Options include -to currently listed directories:
    -a export all in /etc/exports. To add new exports -o options -id dir, -IP, and
    to remove exports -u /directory/ The command ''showmount''- gets info on NFS shares
    current; rpcbind nfs info into the NFS server''s RPC, nffstat statistics related
