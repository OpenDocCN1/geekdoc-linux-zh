    - selinuxveccon: selinuxvecc /bin/netstat

    - getpidvalue: Get previous security context used by specified process

    - matchpath: Checks if a file or directory has the SELinux context

    - matchc: Get security context associated with a file

    - labelpath: Find the first security context for a specified path

    - label_best_match: Checks if a path matches any SELinux policy

    - label_part: Matches part of a path name

    - selinux_check_access: Checks access against the loaded SELinux policy

    - validatetype: Checks if any file with a source type is allowed to the target
    type

    - gethomeidir: Generate context config file for home directories

    - sethomeconf: Compiled config file info

    - label_digest: Compute SHA-256 hash of a file''s security contexts

    - label_digest_all_partial_matches: Gets hashes of contexts that partially match
    a path


    +   * policycoreutils-devel, selinux-utils, policycoreutils-python-utils, troubleshoot-server,
    policycoreutils-gui, seools-console, checkpoint, selinux-policy-devel, seools-console-analysis'
