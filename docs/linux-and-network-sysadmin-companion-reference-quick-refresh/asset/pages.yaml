- pgno: 31
  md: '# netstat


    - gets values from /proc/net

    - often generically used as netstat -netup -tulpen (same thing, different mnemonic)

    - netstat''s successor ss (for "socket stats") uses almost identical command options
    (less to remember)


    +   --a list all ports

    -t for tcp

    -u for udp

    -l listening

    -p includes a PID/Program name field

    -s statistics for each network protocol udp/tcp/icmp/etc in one listing

    -n numeric only -s doesn''t use hostnames, port names, usernames. -n does oppose
    (-r in the ss command)

    to apply the -n option more specific, use --numeric-ports, --numeric-hosts, or
    --numeric-users

    -e for extended on certain subcommands

    -c for continuous output, sort of using watch command

    -r displays routing table

    -i displays list of all network interfaces (kernel interface)

    -ie displays with extended option, which looks like ifconfig output

    -verbose includes info like : netstat: no support for ''AF IPX on this system''

    -g will display the multicast group information

    -m or -masquerade to show NAT info

    -x lists legacy UNIX process sockets that are listed as their own process

    -w to list packets of the type raw


    As usual pipe to other tools. Use grep to search for traffic on unix: netstat
    -ap | grep ssh or grep "ESTAB" - Continuous list of active tcp connections: watch
    -d n0 netstat -atnp | grep E

    netstat -i | grep 1000 | wc -l to see if there is traffic on UNIX


    Some options in netstat vary slightly among different versions of UNIX: check
    your man


    # Migrating from the traditional UNIX-package to iproute2


    The netstat-package, which included ifconfig and other tools, was slated for deprecation
    over a decade ago, and started getting dropped around 2009. It applies to most
    distributions of Linux, BSD, Solaris, or another version of UNIX, if you want
    to stick to traditional net-tools package and ifconfig. On Linux, you can install
    it, but there are things it won''t work well with modern Linux networking


    Summary of changes to that if here to cover:

    - The netstat replacements provided by iproute2

    - Network Monitor (nmcli) to manage persistent configuration changes

    - The abandoning of outdated naming schemes for devices; a return to hardware-specific
    names


    | Deprecated | Replacement command(s) |

    | arp | ip n (ip neighbor) |

    | ifconfig | ip a (ip addr), ip link, -s (ip stats) |

    | itunnel | ip tunnel |

    | lwconfig | lw |

    | nameif | ip link, ifname |

    | netstat | ss, ip route (for netstat-r), ip -s link (for netstat -i), ip maddr
    (for netstat-g) |

    | route | ip r (ip route) |


    For an exhaustive comparison of these, please see Doug Vital''s blog entry at
    https://dougheital.wordpress.com/2011/12/21/deprecated-linux-networking-commands-and-their-replacements/'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# # The ip command


    ip address (or addr a) [add] | [del] | set] dev [interface]

    Address, IPv4 or v6, on the interface

    ip link (or l) [set | show] dev [interface]

    Link generally refers to interfaces/

    ip route (or r) [add] | [chg | repl | del | show] cache

    Route mostly replaces commands

    ip neighbor (or n) [add | chg | repl | del | show] dev [interface]

    Neighbor mostly replaces commands and also shows IPv6 NDP info


    The ip command has a HUGE list of "objects" like link, route, neighbor, and address
    that can be queried or configured. Explained more later, here is: addrible, rule,
    ntable, tunnel, untap, l2tp, mroute, mrule, monitor, xfrm, nets, tcp_metrics.
    The link object shows a huge list of types with their own pages


    Using the ip command allows settings but will not save the configuration - it''s
    not persistent. In order to make persistent changes, use the Network Manager package
    or edit the network scripts


    # ## Device naming:


    Traditionally, we have seen dev naming using eth0 or usb0, dev provides naming
    for some device types out of the box to make them more human-readable (like hard
    drives - /dev/sd1, /dev/hda2). It has been used so long that people don''t know
    or forgot it was an.


    BIOS naming on HW properties (physical naming) has returned, and here is what
    you will see of:

    - [em-1] for embedded NICs

    - [p-slot-number][port-number] - p6p1 = pci slot 6 port 1

    You might also see naming with VLAN and aliases. You may also see a dev name being
    used.


    If you prefer not to, can you add your options in GRUB:

    Add "netframes=biosdevname=0" to boot options

    Then write to grub config on disk boot: grub2-mkconfig -o /boot/grub2/grub.cfg


    # ## Examples of tasks - iproute2 and net-tools package equivalents


    ### Show All Connected Network Interfaces

    With net-tools: $ ifconfig

    With iproute2: $ ip link

    See also: "ip addr" for "ifconfig" and "ip s link" for "netstat -"


    ### Show IPv4 Address(es) of a Network Interface

    With net-tools: $ ifconfig eth1

    With iproute2: $ ip addr show dev eth1


    ### Show IPv6 address of a Network Interface

    With net-tools: $ ifconfig eth1

    With iproute2: $ ip -6 addr show dev eth1


    ### View the IP Routing Table

    With net-tools: $ route -n --or-- $ netstat -rn

    With iproute2: $ ip route show


    ### View Socket Statistics

    With net-tools: $ netstat --AND-- $ netstat -l

    With iproute2: $ ss --AND-- $ ss -l


    ### View the ARP Table

    With net-tools: $ arp -an

    With iproute2: $ ip neigh'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Activate or Deactivate Network Interface


    With net-tools: $ ifconfig eth1 [up | down]

    With iproute2: $ ip link set [up | down] eth1


    # Assign IPv4 address(es) to a Network Interface


    With net-tools: $ ifconfig eth1 10.0.0.1/24

    With iproute2: $ ip addr add 10.0.0.1/24 dev eth1


    # Remove an IPv4 address from a Network Interface


    In net-tools you end up assigning 0 to the interface. iproute2 can properly remove
    it.

    With net-tools: $ ifconfig eth1 0

    With iproute2: $ ip addr del 10.0.0.1/24 dev eth1


    # Assign or Remove an IPv6 address on a Network Interface


    With net-tools: $ ifconfig eth1 inet6 [add | del] ipv 2002:db5:0:f102::64

    With iproute2: $ ip -6 addr [add | del] dev 2002:db5:0:f102::64 dev eth1


    # Assign Multiple IP Addresses to an Interface


    With net-tools (subinterface aliases workaround):

    $ ifconfig eth0:1 192.168.10.10 mask 255.255.255.0 up

    $ ifconfig eth0:2 192.168.10.15 mask 255.255.255.0 up

    With iproute2:

    $ ip addr add 10.0.0.1/24 dev eth1

    $ ip addr add 10.0.0.2/24 dev eth1


    # Change the MAC Address of a Network Interface


    Before changing the MAC address, you need to activate the interface first.

    With net-tools: $ ifconfig eth1 [down | up]: ifconfig eth1 hw 08:00:27:75:2a:66

    With iproute2: $ ip link set dev [down | up]

    $ ip link set dev eth1 08:00:27:75:2a:67


    # Add or Modify a Default Route


    With net-tools: $ route [add | del] default gw 192.168.1.2 dev eth0

    With iproute2: $ ip route [add | replace] default 192.168.1.2 dev eth0 (replace
    is a command)


    # Add or Remove a Static Route


    With net-tools: $ route add -net 172.16.32/24 gw 192.168.1.1 dev eth0

    $ route del -net 172.16.32/04 dev

    With iproute2: $ ip route add 172.16.32/24 via 192.168.1.1 dev eth0

    $ ip route del 172.16.32/04


    # Add or Remove a Static ARP Entry


    With net-tools: $ arp -s 192.168.1.100 00:0c:29:c0:5a:ef

    $ arp -d 192.168.1.100

    With iproute2: $ ip neigh add 192.168.1.100 -ORN, ip addr 00:0c:29:c0:5a:ef dev
    eth0

    $ ip neigh del 192.168.1.100 dev eth0


    # Add, Remove or View Multicast Addresses


    With net-tools: $ ipaddr [add | del] 33:44:00:00:00:01 dev eth0

    $ ipaddr show dev eth0 -OR- netstat -g

    With iproute2: $ ip maddr [add | del] 33:44:00:00:00:01 dev eth0

    $ ip maddr list dev eth0'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'In order to persist changes, you should either use Network Manager, or manually
    edit the files it uses When running NM, manually editing those files is not recommended
    to do unless you have to, such as in a script or but, saying that isnt is not
    a way of bypassing us- Network Manager clutter what we put in it with its own,
    so telling it off its mechanisms can avoid that. [Unsurprisingly, Network Manager
    has a lot of dysfunctions for being resistant to manual edits]


    Network Manager has a GUI, and a text interface quite similar to it. It can be
    effective for doing a good range of tasks, but (as usual) the command line is
    much more flexible and granular. Generally those things we get done by entering
    individual commands, and also has a command prompt of it''s for advanced users.


    **nmcli [OPTIONS] OBJECT [ COMMAND ... ] | help**


    When using nmcli, the most important component in the command definition above
    is "object." Connections and devices are the most used objects.


    +   - a device is a network interface

    - a connection is a collection of configurations (e.g., home, work configs with
    different settings for everything)

    - so, you can have multiple connections for a device but only one can be active
    at time


    The general options pertain to output styles, formatting by using external scripts,
    etc. These include -l [erase] or -p [retry] for ease of viewing, -m [mode] table
    | multiline, -f [fields] <field1,field2, ...> if you only want to output some
    columns, etc.


    **The "device" is how you refer to specific devices, which use wifi or ethernet
    interfaces. They are you are going to your various "connection" objects


    Common device commands: status, show, connect, set, reconnect, disconnect, delete,
    monitor, and wif. Generally those commands would be followed by the file interface.
    The set command allows setting autoconnect and/managed on or off.


    Wifi with specific device interfaces as introduced in the excerpt:


    ```

    wifi [list <interface> [ssid <SSID>]

    wifi connect <SSID> [password <password-key-type>phrase] [interface <interface>]

    ifi hotspot <interface> [name <name>] [ssid <SSID>] [private yes no] [band a|bg]
    [channel <#>] [password

    wifi rescan <interface> [ssid <SSID> to scan ...]]

    ```


    **The nmcli "connection" has** a variety of commands: show, up, down, add, modify,
    clone, delete, reload, load, and import


    Status unless you call nmcli get by itself:

    STATE


    Tipping "nmcli connection" outputs hostname, and if you give one set at the end
    of it it is set.

    Tipping "nmcli general" outputs or changes the global domain and the domain name
    are.

    Tiping "nmcli connection permissions" calls permissions for authenticated operations,
    as seen below:


    ```

    $user@localhost$ nmcli g permissions

    VALUE

    org.freedesktop.NetworkManager.enable-disable-network yes

    org.freedesktop.NetworkManager.enable-disable-wifi yes

    org.freedesktop.NetworkManager.enable-disable-wimax yes

    org.freedesktop.NetworkManager.network-control no

