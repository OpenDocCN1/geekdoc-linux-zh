    2525 ? S 0:00 /usr/bin/gnome-session

    2561 ? S 0:00 /usr/bin/ssh-agent /bin/sh -c exec -1 /bin/bash /bin/bash -c /usr/

    ```


    The "F" option can show process as shown above


    ```

    [root@localhost ~] ps aux

    USER PID %CPU %MEM VSZ RSS STAT START TIME COMMAND

    root 1 0.0 0.0 2072 588 S 13:40 0:00 init [5]

    root 2 0.0 0.0 0 0 ? S 13:40 0:00 [migration/0]

    root 3 0.0 0.0 31 149 S 13:14 0:00 [ksoftirqd/0]

