- pgno: 15
  md: "# PS output columns:\n\nVSZ=virtual memory size, RSS=resident memory size,\
    \ STAT=(S=sleep, R=running, F represents number of forked processes, PPID parent\
    \ PID, WCHAN is the name of the kernel function the process is sleeping\n\n# States:\n\
    \n+   - Idle (sleeping >20 seconds).\n- R - Running or runnable (on run queue)\n\
    - S - Sleeping <20 seconds (waiting for an event to complete)\n- T - Stopped (either\
    \ by a job control signal or because it is traced)\n- D - Uninterruptible sleep\
    \ (usually IO)\n- U - Process in uninterruptible tail.\n- Z - Marks dead (zombie)\
    \ process\n- W - Paging not valid since the 2.6.xx kernel\n X - Dead (should never\
    \ be seen)\n\n# Additional status codes\n\n+   + - Is in the foreground group\
    \ of its control terminal.\n< - Has raised CPU scheduling priority,\nN - Has raised\
    \ CPU scheduling priority (setpriority(2)).\n> - Has exceeded soft limit on memory\
    \ requirements and is exceeding that; such a process is not swapped.\nA - Has\
    \ asked for demand paging page replacement\nE - Process is trying to exit.\n-\
    \ I - Multi-threaded (using CLONE, like NPTL threads)\nL - Has pages locked in\
    \ memory (for example, for raw I/O).\n- s - Is a session leader\n\n# Some examples\n\
    \nDisplay 5 CPU processes.\nDisplay elapsed time of processes\nView process in\
    \ realtime\nOutput PID, command, and nice value\nList by % cpu sed\nList by mem\
    \ (KB) usage\nDisplay process hierarchy in a tree style\n\n```\nps aux --sort=pcpu\
    \ | head -5\nps -e o pid,comm,etime\nwatch -n 1 'ps -o pid,comm,pcpu --sort=mem\
    \ | head -15'\nps -o pid,comm,cputime -g 594\nps -o rss,args | sed -b -kt1,in\
    \ | pr -TW$COLUMNS\nps -f --forest -C apache2\n```\n\nDisplay columns of a parent\
    \ process\n$ ps -o pid,uname,comm apache2\n\nPID USER COMMAND\n2359 root apache2\n\
    4524 www-data apache2\n4525 www-data apache2\n\nThe first process owned by root\
    \ is the main apache2 process and all other apache2 processes have forked out\
    \ of this. We now interrogate that:\n$ ps --pid 2359\n\n```\nPID TTY TIME CMD\n\
    4524 ? 00:00:00 apache2\n4525 ? 00:00:00 apache2\n```\n\n```\npstree outputs a\
    \ tree of processes, which can be preferred over ps --forest\n[root@localhost\
    \ ~# pstree\ninit-acpid\n  -ate\n  -auditd--audispd{auditd}\n    └(auditd)\n \
    \   └automount-4*[automount]}\n```"
