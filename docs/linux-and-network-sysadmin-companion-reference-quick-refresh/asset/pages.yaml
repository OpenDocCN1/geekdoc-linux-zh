- pgno: 230
  md: '# # TCP Ports - Interactions and Scanning


    SYN Synchronize. Initiates connection between hosts.

    ACK Acknowledge. Established connection between hosts.

    PUSH. System is buffering data.

    URG Urgent. Data in packets must be processed quickly.

    FIN Finish. No more connections.

    RST Reset the connection.


    ## TCP Connect and SYN stealth (half-open scans)

    TCP connect (-s) is the most reliable scan but also the most detectable as it
    attempts the standard 3-way handshake to operate. If port is open and unfiltered,
    it will think there is a connection attempt it is waiting for. When a SYN scan
    (-sS) receives an ACK response it will send RST to slam the connection. It is
    also much faster than inverse scans. To Nmap, SYN/ACK means port open, RST means
    port closed and no response (on retrying) or ICMP packet means it is filtered.


    Packet fragmentation can evade IDS filtering and detection. A SYN can be used
    in a way that the TCP header over several IP packets with few fellows. Some firewalls
    may block IP fragmentation, but not necessarily due to the effect on network performance

    Example: nmap -f -S 80 <target>`


    +   * When the port is open (or firewall-ed), no response comes from the host.

    * When the port is closed, a RST/ACK is received from the target


    ## Inverse TCP scans with various TCP flags (or no flags)

    It is often said these are called inverse because responses are only given by
    closed ports. Inverse TCP scans are named for the flags they use; they have Nmap
    -sF (FIN scan, when port is open), Nmap -sN (Null scan with no flags) and -sX
    (scan with FIN, PSH, and URG flags). Nmap also has a URG and PSH similar haircut
    (like -f URG). Having H and U, but does not yield more than the other results
    in a way that is unreliable (NULL, NFI and all you really need). A maimon scans
    packets with both the FIN and ACK flags. This is a method very useful but not
    in modern times.


    NULL, FIN and XMAS scans: if we get a RST, the port is closed. If it''s not, the
    method host doesn''t respond it''s either open or filtered


    Caveats: According to RFC 793, a RST/ACK packet must be sent for connection reset,
    when the port is closed on host side. So, only is effective when there is not
    a Windows OS. If an "ICMP unreachable" is returned Nmap scans the port firewall-filtered.
    Filter might get through some firewalls (FIN most likely), and sometimes no response
    doesn''t mean a port is open, since instead the packet was dropped by the firewall.

    Finally, ALL types of scans, just because a method can pass through a firewall
    does not necessarily mean it is filtering.


    ## ACK scans (not considered inverse)

    Sent with the ACK flag set, these determines ports are closed or open (or open/filtered).
    It is used to map firewall rulesets, determining whether they are stable or not
    ports are filtered, which usually means other scans and cross-referencing. The
    simplest usage shows below, determines whether a RST back means "unfiltered" (RFC
    793), and either an ICMP unreachable or no result at all are "filtered" (firewalls
    that block usually mean no response or send an ICMP destination unreachable)


    ```

    # nmap -sA -p1-100 -T4

    Not shown: 9984 filtered ports

    22/tcp unfiltered scan

    25/tcp unfiltered ...

    ```


    Forbidding anything outbound connections, is fine, blocking ACK packets without
    state doesn''t tell which side marked. Either way, the strategy is also quite
    common (netfilter/iptables, basic base-code, etc). Reference SYN scan below shows
    with both results: SYN scan sees 98/100 ports are, ACK scans are all filtered
    (all getting RST back). This is a statistic of "iptables -A INPUT - multiport
    -p tcp --destination-port 22,80 -j ACCEPT" on the firewall.


    ```

    # nmap -sa -p1-100 -T4

    Not shown: 98 filtered ports

    22/tcp open

    80/tcp filtered

    nmap done: 1 IP address (1 host) scanned in 3.81 seconds

    ```


    # nmap -sa -p1-100 -T4

    All 100 scanned ports on (192.168.1.191) are unfiltered:'
