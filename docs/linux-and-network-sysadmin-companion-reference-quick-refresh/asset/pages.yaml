    - You get a shell, almost nothing else (except for system in the background)

    - No services are started, no mount points, no sockets established.

    - Useful for running specific scripts that could be started independently.

    - Allows booting-by-bit, starting the various services and other units step-by-manually.


    In SysInit, services can define array commands. Examples would be service httpd

    graceful. Native systemd does not have this ability. Any service that defines
    an additional command in this

    would need to define some other, service-specific, way to accomplish this when
    writing a native system

    service definition. Check the package-specific release for any services that may
    have done this.'
