    db-bos-1.example.com


    # webservers in all cities

    [webservers:children]

    houston,webservers

    richmond,webservers


    # dbservers in all cities

    [dbservers:children]

    houston,dbservers

    richmond,dbservers


    # everything in the houston

    [houston:children]

    houston,webservers

    houston,dbservers


    # everything in the richmond

    [richmond:children]

    richmond,webservers

    richmond,dbservers


    # Group And Host Variables, Assign variables to:


    Houston has its own NTP servers, so for group up ntp.conf, we should use these:


    ```

    # file: ntp.conf

    tp: ntp-houston.example.com

    backup: backup-houston.example.com

    ```


    Webservers have some specific configuration that doesn''t make sense for the database
    servers:


    ```

    # file: group_vars/webservers.yml

    apacheRequestsPeriod: 3000

    ```


    Default/universal values, put them in a file called group_vars/all:


    ```

    # file: group_vars/all.yml

    tp: ntp-richmond.example.com

    backup: backup-richmond.example.com

    ```


    If needed, define specific hardware variables in a host_vars file, but avoid this
    unless you need to:


    ```

    # file: hosts

    ansible-bos-1.example.comyml

    fo_agent_port: 99

    bar_agent_port: 99

    ```


    Again, if we are using inventory sources, many groups are dynamically created.
    So tag like ''class:webservers'' would load in the file ''group_vars/var2_tag_class_webservers.yml''
    automatically.


    # Top Level Playbooks Are Separated By Role


    In site.yml, we import playbooks that define our entire infrastructure


    ```

    # file: site.yml

    - import-playbook:webservers.yml

    - import-playbook:dbservers.yml

    ```


    In a file like webservers.yml (also at the top level), map the configuration of
    webservers to the roles it performs:


    ```

    # file: webservers.yml

    hosts: webservers

    roles:

    - common

    - weblier

    ```


    You can choose to configure our infrastructure by "running" site.yml or run a
    subset (webservers.yml). This is analogous to the "limit" parameter but but a
    little more explicit: "ansible-playbook.site.yml -limit webservers" is the same
    as "ansible-playbook.webservers.yml"'
