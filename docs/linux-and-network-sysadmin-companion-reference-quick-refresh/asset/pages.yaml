  md: '# SysVinit - Directory Structures


    Generally, you will find in the /etc/ directory symlinks to stuff that is actually
    in the /etc/rc/ directory. This can cause confusion, since we have other symlink
    stuff for backward compatibility for systems that supported Upstart no longer
    do so. This writing ignores all of that and sticks to CentOS 5


    /etc/init.d is a symlink to the directory /etc/rc/init.d and the same with /etc/rc#.
    linking to /etc/rc#.d, also the same with scripts rc, rc.local and rc.sysinit,
    whose actual location is in the /etc/rc/ directory as well. Even though you will
    see these in /etc. Here are they actually:


    +   - /etc/rc.d/init.d/

    - /etc/rc.d/rc0/

    - /etc/rc.d/rc1/

    - /etc/rc.d/rc5/

    - /etc/rc.d/rc6/

    - /etc/rc.d/rc.local

    - /etc/rc.d/rc.sysinit


    ...and so on...


    Service''s scripts are in /etc/rc.d/Systeminit needs a script in /etc/rc.d/

    - Each managed service in scripts in /etc/rc.d/<servicename> are the top several
    lines


    ```

    #!/bin/bash

    # kudzu This script runs the kudzu hardware probe.

    # config: 34 05 95

    # description: This runs the hardware probe, and optionally configures \

    # changed hardware.

    # Source function library.

    /etc/init.d/functions

    ```


    Says that the script should be started in levels 3, 4, and 5, start priority 5,
    stop priority 95


    /etc/rc.d/init.d directory contents:

    - /etc/rc.d/init.d/acpid

    - /etc/rc.d/init.d/anron


    /etc/rc.d/init.d/ypbind

    /etc/rc.d/init.d/ym-updates


    Files in the /etc/rc.d directory are symlinks to the actual scripts for all of
    SysVinit managed programs in /etc/rc.d. For example


    As an example, here is a list of samples in /etc/rc.d/rc3:

    K8kva_supplicant S02v2-monitor

    K88cud S04readahead_early

    K89dis S05kudzu

    K91capi S06p6tables

    K9readahead_later S08iptables

    S00microcode_ctl S06mctrans'
