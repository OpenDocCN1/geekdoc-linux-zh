- pgno: 18
  md: "# The sysstat suite and sar\n\nThe sysstat includes the programs (CPU, I/O\
    \ stats), mstat (CPU stats), pidstat (stats on processes), nfiostat (NFS-related\
    \ stats), and cifsat (CIFS stats). The flagship of the suite is the sar collection\
    \ and reporting suite, beside them. Others have their own expansions afterwards\n\
    \n**sadc - System Activity Collector.** writes binary data to /var/log/ named\
    \ \"sa-dd\" (d is day of month)\n**sa1 -** query to run sadc with cron or system.\
    \ Collects and stores data in the system activity daily data file\n**sar - System\
    \ Activity Reporter** produces reports from sadc files. Writes ascii files to\
    \ /var/log/ named \"sa-dd\"\n**sa2 -** query to run with cron or system. Writes\
    \ a summarized daily activity report\n**sadf** outputs reports in CSV, XML, JSON,\
    \ etc. so you can output to other programs. Also SVG graphs.\n\nInstallation\n\
    \n+   - If installing from source: /configure --enable-install-cron, then **make\
    \ install**\n- The option --enable-install-cron makes sure to create /etc/rc.d/\
    \ for you\n- Installs executables using /usr/local/bin\n- (old issue?) Run echo\
    \ alias sar=LANG=C >> ~/.bashrc to ensure sar uses 24 hour clock\n\nEnsuring cron\
    \ is set up\n\n+   - If your version of sysstat didn't, create a file at /etc/cron.d\
    \ directory that contains the historical data.\n- vi /etc/cron.d/sysstat\n- */10\
    \ * * * root /usr/local/lib/sa/sa1 1\n- 53 23 ** root /usr/local/lib/sa/sa2 -A\n\
    \n+   - If installed from source, sadc and sa2 is probably in **/usr/local/lib/sa**\
    \ and **/usr/lib/sa/sa2**\n- If installed with a package manager, they may be\
    \ located in /usr/lib/sa/sa1 and /usr/lib/sa/sa2\n- The above runs sa1 to collects\
    \ data every 10 minutes, and completes data at midnight with sa2\n- sar is executed\
    \ with \"1 f\" - run once with 1 second interval\n\nLog management\n\nGenerated\
    \ logs are only kept for a limited time (usually ~28 days). One option is to have\
    \ a script back up before deletion; the configuration file /etc/sysconfig/sysstat\
    \ has a HISTORY parameter to the number of days you want to keep the log files.\
    \ The maximum is 28 days, but if set to some, logs will be stored in a month-by-month\
    \ directory. Then, logs will be pointing to a symbolic link as YYYYMMDD\n\n+ \
    \  **sar -U ALL 1** - report CPU usage (as %) every 1 sec, 3 mins; ALL options\
    \ give extended info\n**sar -f /var/log/sa/10** - reports for a specific day;\
    \ here for the 10th day of the month (in the file sa10)\n**sar -P 1** - the -P\
    \ specifies to report only on CPU core 1 (a quad-core with 0-3); -P ALL for all\
    \ cores\n**sar -f /var/log/sa/10** - most queries use the same syntax as above\
    \ - this querying metrics with -r\n**sar -p -d** - query for device blocks uses\
    \ the -p \"print pretty\" has driven file metrics with -us.\n\nGeneral options,\
    \ are -f to specify a day), ALL for extended info or items (config), -p for human\
    \ readable, then to specify frequency to run followed by how many times to run\
    \ before. There is also an option to start in a time, like **sar - 09:30:00**\
    \ for 9:30AM, can with -f to specify a day. Optional end time with -e\n\nThe most\
    \ used queries are -u (CPU), -r (memory), -s (swap), -b (I/O stats), -d (block\
    \ devices), -n (network)\nHere are some others:\n\n+   -q - queue size and load\
    \ average\n-w - processes created per second, and total number of contexts per\
    \ second\n-r - number of pages read, used, and cached per second by the system\n\
    -B - paging statistics. i.Number of KB in (and out) from disk per.\n-W - swap\
    \ statistics. i.Number swap in and out per second.\n\nNetwork activity has a number\
    \ of days; **sar n <keyword>** - where you can see: \n\n+   DEV - network device\
    \ stats for eth0, eth1\nICMP - ICMP4 network traffic\nEDEV - network device failure\
    \ stats\nICMP - ICMP4 network errors\nNFS - NFS client statistics\nTCP - TCPv4\
    \ network traffic\nNFSD - NFS server activity\nETCP - TCPv4 network errors\nSOCK\
    \ - sockets in use for IPv4\nUDP - UDP network traffic\nIP - IPv4 network traffic\n\
    SOCK6, IP6, ICMP6, UDP6 for IPv6\nEIP - IPv4 network errors\nell - all options\
    \ in one output: very useful."
