- pgno: 221
  md: '# Syntax for BGP Filtering Methods


    The old-school IOS ACLs we know might be like a good way to match traffic by prefix/subnet,
    but it can get to be a mess. Cisco IOS 10.2 came up with a better way with prefix-list,
    it helps to know why this was done.


    Here is an scenario: declare BGP neighbors, make a simple list to match one subnet,
    and apply it with **distribute-list** to go out updates, so we can say "don''t
    send routing updates from that **access-list 1** to this neighbor". This works.


    ```

    R1(config-router)# router bgp 3

    R1(config-router)# neighbor 172.162.1.2 remote-as 3

    R1(config-router)# neighbor 172.162.20.1 prefix-list as 1

    R1(config-router)# neighbor 172.162.20.1 distribute-list 1 out

    R1(config-router)# exit

    R1(config-config)# access-list 1 deny 172.168.10.0 0.0.0.255

    R1(config-config)# access-list 1 permit any

    ```


    Problems come up when aggregating the aggregate address of 172.16.0/16 but not
    the individual subnet- you need an extended ACL. The way those work with BGP route
    filters, the ACL will first match the network address and then match the subnet
    mask of prefix. To do this, both network and address are paired with their own
    wildcard bitmap and it looks like this confusingly,


    ```

    access-list 10 permit ip 172.16.0.0 0.255.255 255.255.255 0.0.0.0

    That is why IOS 10.2 gives us the prefix-list option.

    ```


    Prefix-List Syntax

    This example lists sent to the peer is only routing info for this specific matching
    subnet:


    ```

    R1(config-router)# prefix-list UPDATE172 permit 172.16.0/16

    R1(config-router)# router bgp 100

    R1(config-router)# neighbor 192.168.1.1 remote-as 200

    R1(config-router)# neighbor 192.168.1.1 prefix-list UPDATE172 out

    ```


    Applied to the updates sent to 192.168.1.1. Permits to 172.16.0/16 has implicit
    deny at end of the list for others 172.16.0/17 or 172.16.20/24


    ip prefix-list-name seq seq-value [permit|deny] network/cidr [ge-value|le-value]


    | Parameter | Description |

    |---|---|

    | list-name | seq | (Optional) A sequence number to the entry being created or
    deleted. |

    | seq-value | (Optional) Specifies sequence number. |

    | deny | Denies access to matching conditions. |

    | permit | Permits access to matching conditions. |

    | network/cidr | (Mandatory) The network address and length (in bits) of the netmask.
    |

    | ge-value | (Optional) Specifies the beginning or "from" value of a range |

    | le-value | (Optional) Applies le to the specified value. |

    | le-value | Specifies the end or "to" value of a range |


    +   - There is an implicit deny at the end of each prefix-list.

    - The range of sequence numbers that can be from 1 to 4,294,967.

    - A router tests prefix list matches from the lowest sequence number to the highest.

    - By numbering prefix-list statements, you can add new entries in any part of
    the list.

    - If no-prefix-list statements are applied to the first, next unnumbered entries
    are incremented by 5.


    ip prefix-list NY_ROUTES permit 192.168.0.0/24

    Permit with a netmask up to 24 bits in 192.168.0.0/8 - No sequence number- 0 gets
    the default 5

    ip prefix-list NY_ROUTES deny 192.168.0.0/25

    Deny network with 25 bits in 192.168.0.0/8 - No seq number- 10 is applied (+5)


    ip prefix-list HOUSTON seq 3 0.0.0.0/ ge 16 le 24

    Permit 0.0.0.0 with a network between 16 to 24 bits - No seq number- gets the
    default 5

    ip prefix-list HOUSTON seq 3 0.0.0.0/0

    Assigns a sequence number of 3 to this statement.


    no prefix-list TORONTO seq 10

    Removes sequence number 10 from the TORONTO list.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# AS_PATH Access Lists


    The AS_PATH attribute can be searched with regular expressions to match routing
    updates, and slap on an access-list label to filter or modify. Most of them look
    familiar. They can also be tested with **show ip bgp**


    +   * Matches the end of the input.

    * $ Matches an empty string in the AS_PATH field (the local device''s AS is blank;
    so this matches)

    * _ Matches a space, comma, left brace, right brace, or end of an input string

    * Matches any single character

    * Matches zero or more single-or-character patterns.


    To find all subnets reachable via autonomous system 65002 (AS_PATH begins with
    65002):


    ```

    R1#show ip bgp regexp ^65002_

    Next Hop      Network        Metric LocPrf  Path

    *172.16.0.0    192.168.2.1    100             65002 65003 65004

    *172.24.0.0    192.168.2.1    100

    ```


    ```

    show ip bgp regexp ^65002_ ... originating from autonomous system 65002

    show ip bgp regexp ^65002_ ... reachable via autonomous system 65002 (AS_PATH
    begins with 65002)

    show ip bgp regexp _65002_65005 ... translating through autonomous system 65005
    (AS_PATH contains 65005)

    show ip bgp regexp _2150 Will match 21150, 12157 or this is where "*" helps

    show ip bgp $ * Originates from THIS autonomous system (AS_PATH is blank)

    ```


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_222_0.png)


    # CE1 Configuration


    ```

    ip prefix-list ISP1 permit 0.0.0.0 ge 16 le 24

    ip as-path-access list 1 permit ^$

    router bgp 65000

    ```


    Prefix list which only permits routes with a mask between 16 and 24

    Creates an AS_PATH ACL matching routes that only originate from within autonomous
    system 65000


    ```

    neighbor 209.165.202.129 filter-list ISP1 in

    neighbor 209.165.202.129 filter-list 1 out

    ```


    Assigns ISP1 prefix list to neighbor 209.165.202.129 (ISP1) for all routes learned
    from neighbor

    Creates AS_PATH ACL matching 209.165.202.129 (ISP1) for routes sent sent to neighbor


    # CE2 Configuration


    ```

    ip prefix-list ISP2 permit 0.0.0.0 ge 16 le 24

    ip as-path-access list 1 permit ^$

    router bgp 65000

    ```


    Creates a prefix list which only permits routes with a mask between 16 and 24

    Creates an AS_PATH ACL list matching routes that only originate from within AS
    65000


    ```

    neighbor 209.165.200.225 prefix-list ISP2 in

    neighbor 209.165.200.225 filter-list 1 out

    ```


    Assigns ISP2 prefix list to neighbor 209.165.200.225 (ISP2) for all routes learned
    from neighbor

    Creates AS_PATH ACL matching 209.165.200.225 (ISP2) for routes sent to that neighbor'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Route Maps


    This example uses a prefix-list to catch updates 172.16.10.0/24 and label with
    "AS400_ROUTES". A route-map is created if it doesn''t match and fails through
    to the second rule, set a different weight attribute. This same mechanism can
    be used to make other changes, or specify what updates to in or out.


    Finally, at the end BGP process, add the neighbors and directs to check the route-map
    for the rules. Using the keyword "in" refers to routing updates in 192.168.1.7,
    and the keyword "out" is for routing updates we send out 192.168.1.7


    ```

    Host(config)#ip prefix-list AS400_ROUTES permit 172.16.10.0/24

    Creates a prefix-list that matches the 172.16.10.0/24 network to AS 400.

    Host(config)#route-map SETWEIGHT permit 10

    Creates a route map a sequence number of 10 assigned.

    Host(config)#route-map match address prefix-list AS400_ROUTES

    Matches condition under which routing is allowed, matching the AS400_ROUTES prefix
    list.

    Host(config)#route-map set weight 200

    Assigns a weight of 200 to any update that meets the condition of prefix list
    AS400_ROUTES.

    Host(config)#route-map SETWEIGHT permit 20

    Creates a second statement for a sequence number of 20 assigned.

    Host(config)#route-map set weight 100

    Assigns a weight of 100 to all updates/networks learned from outside (didn''t
    match) AS400_ROUTES

    Host(config)#route-map exit-list

    Returns to global configuration mode.

    Host(config)#router bgp 300

    Starts the BGP routing process.

    Host(config-router)#neighbor 192.168.1.7 route-map SETWEIGHT in

    Uses the route-map SETWEIGHT to filter all routes learned from neighbor 192.168.1.7.

    ```


    Route-map can apply regular and extended ACLs, prefix-lists, and AS_PATH ACLs.


    | BGP subcommand | Commands to create | What can be matched |

    |---|---|---|

    | neighbor-distribute-list (standard ACL) | access-list, ip access-list | Prefix,
    with WC mask |

    | neighbor-distribute-list (extended ACL) | access-list, ip access-list | Prefix
    and length; with WC mask for each |

    | neighbor-prefix-list | prefix-list | Exact or "first N" bits of prefix, plus
    range of prefix lengths AS_Path contents, all NLR where AS_Paths are matched considered
    to be a match |

    | neighbor filter-list | ip as-path-access-list | neighbor route-map | route-map
    | Prefix, length, AS_Path, and/or any other PA matchable within a BGP map |


    BGP Communities

    BGP communities are used to group networks that share common properties, regardless
    of network, autonomous system, or any physical boundaries. In large networks applying
    a common route through prefix list or access lists requires individual statements
    on each networking device. Using the BGP community attribute BGP neighbors, with
    common policies, can easily import and outbound route filters from the community
    tag that can reach large sets of routes a group of prefixes that should be treated
    the same way and alternative to matching prefixes using an access-list or prefix-list


    Communities are created with set community The aa:number identifier is the AS
    by an arbitrary identifier (which would look like 100:250) value can be entered
    on the same line. The options are for communities with specific rules built in


    ```

    set community aa:nn [add | local | as-advertise | no-export]

    add - Adds to existing community (one or more keywords)

    local - as community

    local-as (as "well-known community") advertised only to peers in local AS or within
    a sub-AS of a confederation.

    no-advertise - these are not advertised to any peer (internal or external).

    no-export routes are local-as but more strictly advertised to external peers.

    ```'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'When declaring neighbors, you can share communities with your neighbor x.x.x.x
    send-community. Here are some

    snippets demonstrating the use of communities:


    ```

    ip bgp-community-new-format

    access-list 101 permit ip host 6.6.6.0 255.255.255.250

    route-map Peer-R1 permit 10

    match address 101

    set community 10:300 109:02 33:40

    ```


    ```

    ip community-list 1 permit 100:300

    route-map Peer-R3 permit 10

    match community 1

    set local-preference 150

    ```


    ip community-list— Creates a community list for BGP and control access to it.

    match community— Matches a BGP community.

    set community-list-delete— Removes the community attribute of inbound or outbound
    update.

    show ip bgp community— Displays routes belonging to specific BGP communities.


    # BGP Confederations


    A BGP confederation divides our AS into sub-ASes to reduce the number of required
    IBGP peers. Within an AS we still

    require full-mesh IBGT between these sub-ASes we use something that looks EBGP
    but behaves like IBGP (called

    confederation bgp).


    ```

    R2(config-router)#router 24

    R2(config-router)#bgp-confederation identifier 2

    R2(config-router)#bgp-confederation peers 35

    R2(config-router)#neighbor 4.4.4.4 remote-as 24

    R2(config-router)#neighbor 4.4.4.4 update-source loopback 0

    R2(config-router)#neighbor 3.3.3.3 update-source loopback 0

    R2(config-router)#neighbor 3.3.3.3 bgp-multihop 2

    ```


