- pgno: 8
  md: '# /dev - Device Nodes


    - Device drivers mapping service requests to device access HW resources in a device
    tree

    - contains vietnam such as the device, with a minor # to identify device, major
    # to identify driver

    - acts as an interface between the OS and hardware; part of OS or installed on-demand


    # Device Tree


    - "a structure that lists all HW installed on a system and assigns device nodes
    to them."

    - auto generated by the computer''s RAM on startup, when a new device is installed,
    or when a device or system is configured.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_8_0.png)


    # Special Devices


    /dev/null Provides null characters (0 bytes) for writing into any program or file.
    It is used for generating an empty file of certain size.


    /dev/zero Does not provide any data to a program or file. It discards all data
    written to it. It is used as output the file which is not required by the user
    as a random number generator; gathers random input from device drivers and other
    sources,


    /dev/random Functions as its bits in an entropy pool, output as bytes to applications.
    When the pool is exhausted, we will block the reading until random input is collected.


    /dev/urandom Like /dev/random, except doesn''t block the application if the entropy
    pool is exhausted; also uses pseudorandom input (less secure)


    ```

    mkkn [OPTION] (NAME) (TYPE) [MAJOR MINOR]

    ```


    Create device files that are not present. Makes of major and minor node numbers
    of a device'
