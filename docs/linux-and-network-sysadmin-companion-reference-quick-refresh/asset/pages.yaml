- pgno: 27
  md: '# Example systemd Unit Scripts Contents


    It is not advised to edit unit scripts in /usr/lib/systemd/system/ - so they remain
    default/as-installed by packages. For custom changes, make copy to edit in /etc/systemd/system
    - this directory overrides defaults for you.


    Example Unit Script - /usr/lib/systemd/system/httpd.service contents:


    ```

    [Unit]

    Description=The Apache HTTP Server

    After=network.target remote-fs.target nss-lookup.target


    [Service]

    Type=notify

    EnvironmentFile=/etc/sysconfig/httpd

    ExecStart=/usr/bin/httpd OPTIONS -D FOREGROUND

    ExecReload=/usr/sbin/httpd OPTIONS -k graceful

    ExecStop=/bin/kill -WINCH ${MAINPID}

    KillSignal=SIGCNT

    PrivateTmp=true


    [Install]

    WantedBy=multi-user.target

    ```


    Example Target Unit Script - /usr/lib/systemd/system/multi-user.target contents:


    ```

    [Unit]

    Description=Multi-User System

    Documentation=man:systemd.special(7)

    Requires=basic.target

    Conflicts=rescue.service rescue.target

    After=basic.target rescue.service.target

    AllIsolate=yes

    [Install]

    Alias=default.target

    ```


    > "After" is what is loaded after this finishes activating

    "Requires" should be what needs to be loaded before and lvdisk.automount


    Example Custom Mount Scripts - /etc/systemd/system/lvdisk.mount and lvdisk.automount

    Needs a mount file and automount file with a matching name (mydisk5.automount
    mydisk5.mount)

    This is the way future versions of RHEL will likely automount instead of the /etc/fstab
    method


    ```

    # vim /etc/systemd/lvdisk.mount

    [Unit]

    Description=Example test mount

    [Mount]

    what = /dev/vgdisk/lvdisk

    where = /lvdisk

    type = xfs

    [Install]

    WantedBy=multi-user.target

    ```


    ```

    # vim /etc/systemd/lvdisk.automount

    [Unit]

    Description=Example test automount

    [Automount]

    where = /lvdisk

    [Install]

    WantedBy=multi-user.target

    ```


    Test it out - systemctl enable lvdisk.mount; systemctl start lvdisk.automount;
    mount | grep lvdisk'
  merge: -1
