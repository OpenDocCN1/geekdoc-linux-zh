- pgno: 9
  md: '# dmesg


    dmesg shows info about the hardware controlled by the kernel. CPU, memory, disk
    drives, network cards, etc.

    Shows the contents of /var/dmesg, which holds the kernel ring buffer (ring it
    dumps old messages as new ones come in, maintaining the same file size)


    It includes actions taken at startup, configuring hardware devices.

    See error messages as they occur with watch "dmesg | tail -20"

    Setting the level to 1 (-1) only allows messages to be seen.


    ```

    dmesg > kernel_msgs.txt - dump ring buffer contents into a file, handy for help
    troubleshooting

    ← Pipe output to more, less, head, tail, or grep with dmesg | grep memory

    ← cat /var/dmesg can generate similar output, running dmesg provides more control

    ```


    Some options for dmesg:


    | -C,--clear | Clear the ring buffer. you can still see logs stored in /var/dmesg
    files |

    | -c,--read | Clear the ring buffer after printing. |

    | -f,--facility | Restrict output to (comma separated) list of facilities |

    | -k,--kernel | Print kernel messages. |

    | -l,--level | Restrict output to (comma separated) list of levels. |

    | -r,--raw | Print the raw message buffer: |

    | -s,--buffer-size | Output size to query the buffer: 16392 by default. If you
    set it larger, you can view entire buffer. |

    | -u,--userspace | Print userspace messages. |

    | -x,--decode | Decode level (priority) to number readable prefixes. |

    | -n,--console-level | Set priority level that messages are logged using syslog
    level or number (- 1 or -1 alert prevents all messages except emergency) All levels
    are still written to /proc/kmsg, so syslog can be used to control exactly where
    kernel messages appear. When the -n option is used, dmesg will not print or clear
    the kernel ring buffer.|


    > - "dmesg Explained" article from Linux Gazette website explains dmesg lines

    - http://www.tld.org/LDP/issue59/nazario.html


    hal - Hardware Abstraction Layer (HAL) daemon provides all applications with data
    about current hardware.

    dbus - Desktop Bus - Inter-Process Communication (IPC) system

    - Allows processes to communicate with each other provides notification system
    for HAL events

    - Can start services for an application''s needs- applications register with dbus
    daemon to participate.

    - Can send wide alerts such as "new hardware detected" and "print queue modified."'
