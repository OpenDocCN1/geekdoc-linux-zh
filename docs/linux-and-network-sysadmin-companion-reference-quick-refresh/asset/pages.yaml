- pgno: 190
  md: '- Type I, or Router LSA, is created and activated by every router.

    - Each internal router has one Router LSA, each ABR has multiple Router LSAs,
    for each area.

    - Router LSAs are flooded throughout its (intended) area by sending a copy to
    all connected neighbors.

    Each one includes: all neighbors connected, the router interface area the LSA
    was sent


    # Basic LSA Layout (This can vary but a basic look)


    | 20-byte | V= on if | E= on if | B= on if | 0 [bits] | Number of Links: count
    of all router links [16 bits] |

    |---|---|---|---|---||

    | virtual link | ASBR | ABR | | |


    | Link identifier ID [32 bits] | |


    | Link Data [32 bits] | |


    | Type [8 bits] | Number TOS = 0 | Metric |

    |---|---|---|


    Starting from LSA ID again...


    An overview of Link State Advertisement Types


    | LSA Type | Description | Routing Table Code |

    |---|---|---||

    | 1 | Router LSA. Advertises intra-area routes. Generated by OSPF router to itself
    to peers. Flooded within the area. Represents networks as stub | O |

    | 2 | Network LSA. Generated by a DR, advertises routers on a multicass link.
    Flooded within the area. Represents the subnet and router interfaces connected
    to the subnet. | O |

    | 3 | Network Summary LSA. Advertises area routes. Generated by an ABR, flooded
    to areas. Defines the links (subnets) in the origin area, and cost, but no topology
    data "I am ABR and these are my area subnets" | OA |

    | 4 | ASBR Summary LSA. Advertises routes to reach each ABR. Generated and advertised
    by ABR. Flooded to adjacent areas. | OA |

    | 5 | AS External LSA. Advertises external routes (in another router domain) Generated
    by ASBR and flooded to adjacent areas. E1-metric increases at each area as it
    is passed through the network. E2-metric does not increase (this is the default).
    | O |

    | 6 | Multicast LSA. Used in multicast OSPF (MPOS) operations, not supported by
    Cisco IOS. | |

    | 7 | Not-stubby area (NSSA) LSA. Advertises routes in another router domain.
    Generated by an ASBR, advertised within a NSSA (instead of a type-5 LSA). Totally
    NSSA needs this rule-that why it accepts Type 4 LSA. N1-metric increases at each
    area as it is passed through the network. E2-metric does not increase (default).
    | O |

    | 8 | External LSAs. For OSPF and BGP interaction. Not implemented in Cisco. Another
    definition at Cisco says this is an IPv6 protocol: IPv6 link-local flooding scope
    covers ( beyond) routers attracted to the link, also gives a list of IPv6 prefixes
    to associate with the link. Allows the router to assert a collection of Options
    to associate with the LSA that will be originated for the link |

    | 9 | A router can migrate intra-area-prefix LSAs for each router or transit network,
    with a unique link-state ID. The link-state ID for each intra-area-prefix describes
    association to the router or network LSA and contains prefixes for stub and transit
    networks. | |

    | 10,11 | Opaque LSAs. Used for specific applications, these are generic LSAs
    to allow for easy extension of OSPF; for example type 10 has been adapted for
    MPLS, BGP, IPv6 stub. Other methods vendor-specific are becoming more defined.
    | |'
  merge: -1
  img_proc: true
