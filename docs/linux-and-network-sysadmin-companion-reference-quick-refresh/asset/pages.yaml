- pgno: 205
  md: "If you misconfigure network command, like 192.168.1.1 mask 255.255.255.0, BGP\
    \ will be for exactly 192.168.1.1/24 in the routing table. BGP won't announce\
    \ it to neighbors.\n\nIf you issue the command network 192.168.0.0 mask 255.255.255.0\
    \ to advertise a CIDR block, BGP will be for ONLY 192.168.0.0/16 in the routing\
    \ table. You may find 192.168.0.1/24 or 192.168.0.1/32; however, it may find never\
    \ 192.168.0.0/16. In this case, you can configure a static route towards a loopback\
    \ interface so BGP can find an exact match in the routing table: ip route 192.168.0.0\
    \ 255.255.255.0\n\n# BGP and Loopback Addresses\n\n+   - Recall that a loopback\
    \ interface provides a more robust configuration - never goes down, it adds more\
    \ stability than physical ones, and BGP will still operate if the link to the\
    \ interface fails.\n- The router can send the packet without being interrupted\
    \ because loopback is always up.\n If another interface tries to reach the loopback\
    \ it will be blocked when source doesn't match.\n\nWhen multiple links exist between\
    \ 2 BGP routers, and you would like to establish BGP neighborhood between them,\
    \ there are 2 options:\n- configure a connection for each physical interface,\
    \ consumes bandwidth and memory.\n- Configure connections using virtual (loopback)\
    \ interfaces, which requires less bandwidth and memory, and ensure the interface\
    \ always up/up.\n\neBGP assumes that neighbors are directly connected and peering\
    \ with the IP of that specific interface. If not, you must use neighbor ip-address\
    \ ebgp-multihop number-of-hops command. If you are peering with loopback IP addresses,\
    \ in iBGP, you must change the source to match the loopback neighbor ip-address\
    \ update-source interface\n\n> > eBGP assumes that internal neighbors might not\
    \ be directly connected, so this command is not needed. With loopback IP addresses\
    \ in iBGP, you must change the source to match the loopback neighbor ip-address\
    \ update-source interface\n\n```\nRouter(config-router)#neighbor 172.16.1.2 update-source\
    \ loopback\n```\n\n- Without neighbor update-source, iBGP will use the closest\
    \ IP interface to the peer. In the case of a point-to point eBGP session, this\
    \ command is not needed because there is only one path to BGP\n\nUsing loopback\
    \ and update-source for connections when iBGP or eBGP is considered a best practice.\
    \ It ensures an alternate route to the specific router is available if the physical\
    \ interface goes down"
