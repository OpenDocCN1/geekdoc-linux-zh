- pgno: 172
  md: '# IEEE Standard: VRRP Router Redundancy Protocol (RFC 2338)


    Almost the same as HSRP. Here, "master" takes the place of "active" in HSRP terms,
    and the rest are "backup.\nThe VRRP preempt option is enabled by default (switch
    that is the IP address will preempt, regardless of this

    explicit). Default priority is 100 (least extended)


    +   - Group number can be from 1-255. Priority range 1-255. The default is 100.

    - The virtual MAC is of form 0000.5e01.xx, where xx is a two-digit hex group number.

    - Sends advertisements to multicast 224.0.0.18 (VRRP), using IP protocol 112

    - Uses a timers for the virtual switch.

    - switches in a group must use the same timer values, or the group will not communicate.

    - Default timer value is in range 1-25 seconds; if you use the argument, you can
    change the timer to

    measure in milliseconds. The range is 1 to 99ms.


    | Switch#config interface vlan10 | (all of these are interface config) |

    | ip address 172.16.100.5 255.255.255.0 | Assigns IP address and mask to VLAN
    interface. |

    | vrrp 10 ip 172.16.100.1 | Enables VRRP to group IP of 172.16.100.1 (using a
    real IP interface here will make the router with that address become the member)
    |

    | vrrp 10 description Sales Group | Assigns a text description to the group. |

    | vrrp 10 priority 110 | Sets the priority level for VLAN. |

    | vrrp 10 preempt | This switch will take over as virtual switch master for group
    10 if it has a higher priority than the current one |

    | vrp 10 delay minimum 60 | This switch will preempt, only after a delay of 60
    seconds Configure the interval between successful advertisements by the virtual
    switch |

    | vrrp 10 timers advertise 15 | Configures a virtual switch backup, to learn the
    advertisement interval from the virtual switch. |

    | vrrp 10 timers | Disables/re-enables VRRP on the interface, in a way that the
    configuration is still retained. |

    | (no) vrrp shutdown | Reenables the VRRP group using the previous configuration.
    |

    | no vrrp shutdown | |

    | vrrp 10 authentication text otta | Plain-text auth for group 10 using the key
    lotta. |

    | vrrp 10 authentication md5 key-string winnipeg | MDS auth for group 10 using
    the key winnipeg. |


    # Object Tracking


    VRRP does not have a native tracking mechanism, but even better, it has the ability
    to track objects. This allows the VRRP master to lose its status if a tracked
    object (interface, SLA, and so on) fails.


    | track 1 interface fastethernet/0 line-protocol | Creates a tracked object, where
    the status of the uplink interface is tracked |

    | vrrp 1 track 10 decrement 30 | Track a previously created object and decrease
    the VRRP priority by 30 to shift the uplink interface |


    # Verifying VRRP (same for IPv6 and IPv4)


    | Switch#debug vrrp all | Displays all VRRP messages |

    | Switch#debug vrrp error | Displays all VRRP error messages |

    | Switch#debug vrrp 10 | Displays all detailed information about VRRP group 10
    |

    | Switch#debug vrrp interface vlan10 | Displays info about VRRP enabled on int
    Vlan10 |

    | Switch#debug vrrp interface vlan10 brief | Displays a brief summary of VRRP
    on int Vlan10 |


    # Debugging VRRP


    | Switch#debug vrrp all | Displays all VRRP messages |

    | Switch#debug vrrp error | Displays all VRRP error messages |

    | Switch#debug vrrp events | Displays all VRRP event messages |

    | Switch#debug vrrp packets | Displays messages about packets sent and received
    |

    | Switch#debug vrrp state | Displays messages about state transitions |


    VRRP is only partially supported on some Cisco hardware. appropriate Cisco IOS
    command and configuration guides.'
