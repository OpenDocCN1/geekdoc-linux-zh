  md: "# Traceroute\n\nTraceroute sends UDP datagrams for each hop- first, three with\
    \ a TTL field value set to 1 to cause the datagram to\ntime as soon as it hits\
    \ the first router, which responds with ICMP \"time exceeded\". Next, three more\
    \ with the TTL value set\nto the second router, and so forth, incrementing the\
    \ TTL for each hop. Since these datagrams try to access an invalid port\n(default\
    \ 33434) at the destination, the host will respond with ICMP \"port unreachable\"\
    \ which triggers the process to finish\n(Windows destinations use an ICMP echo\
    \ reply)\n\nOn Cisco, ping or traceroute without an IP address will allow you\
    \ to use extended versions of the programs.\nThis query for source and destination\
    \ IPs in order to run those programs between gateways specified by route,\ntbleshoot\
    \ routing, or packet loss; will determine the type of connectivity, to narrow\
    \ down where the problemncurs\n\n# Cisco IOS Traceroute example\n\n+   - Traceroute\n\
    - Router [ip]\n- Target IP address: 192.168.40.2\n- The address to which the path\
    \ is traced.\n- Source address: 172.16.23.2\n- Numeric display [n]\n- Timeout\
    \ in seconds [3]\n- Probe count [3]\n- Minimum Time to Live [1]\n- Maximum Time\
    \ to Live [30]\n- Port Number [33434]\n- Loose, Strict, Record, Tstamp, Verbe[none]\n\
    - Type sequence to abort.\n- Tracing the route to 192.168.40\n- 1 172.31.20.16\
    \ 16 msec 16 msec\n- 2 172.10.10.2 28 msec 28 msec 32 msec\n- 3 192.168.40.32\
    \ 38 msec 28 msec *\n\nCisco Traceroute returns these codes, for each node, there's\
    \ possible cause.\nm - gives, for each node, round-trip time (in milliseconds)\
    \ for the specified number of probes\n * The probe timed out - A device outside\
    \ the path may receive the probe or did not reply with an ICMP \"packet life\n\
    ceceeded\"\nA - Administratively prohibited - a firewall or router, may be blocking\
    \ the path and possibly other all of traffic; access lists.\n - Source quench\
    \ - A device on the path may be receiving much traffic; check queues.\nH - ICMP\
    \ unreachable message has been received - A routing path may have occurred.\n\n\
    # TCP Traceroute\n\nBoth tcp and traceroute work on the same principle. Employing\
    \ one for performing TCP traceroute is becoming\nmore of an option because it's\
    \ less to filter. All will generate ICMP error messages when the TTL expires.\
    \ Some\nfirewalls block the \"time exceeded\" ICMP packets. SYN packets will appear\
    \ in Traceroutes since firewalls block\nTCP packets that aren't part of able\n\
    \nIntro waits for an establishing TCP connection. When it sees it it will send\
    \ short-lived packets which appear as part\nof observed connection, trace can\
    \ do because it sees the packets, and knows the IP addresses, ports, and\nsequence\
    \ numbers. The short-lived packets are adjusted so that they will not disrupt\
    \ the TCP connection (they are sample\n\"ACK\" packets with no data by themselves,\
    \ the OS will simply ignore them)\n\nClassic traceroute relies on ICMP type 1\
    \ (Time exceeded) responses from each hop. If ICMP type 11 responses are\nbeing\
    \ blocked by your firewall, traceroute will not work. These packets are inbound,\
    \ outbound.\n\nSYN packets will cause either RST packet or a SYN ACK packet in\
    \ response when they reach their destination. There is\nmore about those sort\
    \ of TCP interactions and what they mean in the section on scanning\n\nIt is possible\
    \ to get ICMP type 3 code 4 responses instead of ICMP type 11 if you send a large\
    \ packet with the \"Do\nfragment\" flag set, though this is likely only to help\
    \ you find the path with the maximum MTU. You will normally only get the type\n\
    s response from one hop along the route. Not all of them.\n\nWindows has the pathping\
    \ utility, and there is also MTR (https://github.com/White-Triger/WinMTR). Older\
    \ tools vtrace and\nCheops which may need to use archive.org/WayBackMachine to\
    \ find."
