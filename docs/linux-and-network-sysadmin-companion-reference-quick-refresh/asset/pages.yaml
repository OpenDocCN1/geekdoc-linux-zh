- pgno: 177
  md: '# Typical 3 Switch GLBP Setup Example


    Three multilayer switches participating in a common GLBP group, with switch A
    elected AVG, to coordinate

    GLBP process, answer ARP requests for the virtual router 192.168.1.1.


    It has identical backup, and other two as AVG for the group, using default round-robin
    load balancing,

    each of the client PCs sends an ARP request to the virtual router address 192.168.1.1
    in turn, from left to right.

    Each time the AVG replies, the next sequential virtual MAC is sent back to a client.
    When the fourth PC sends a request,

    three virtual MAC addresses (and AVR routers) have been used, so the AVG cycles
    back to the first virtual MAC address.

    One GLBP group has been configured, clients know of only one gateway IP address:192.168.1.1,
    all uplinks are

    being used, and all routers are appropriately forwarding.


    | AVG | Standby AVG | AVR vMAC |

    | --- | --- | --- |

    | vMAC 0007.b400.0101 | vMAC 0007.b400.0102 | vMAC 0007.b400.0103 |

    | VLAN 50 | VLAN 50 | VLAN 50 |

    | 192.168.1.10 | 192.168.1.11 | 192.168.1.12 |

    | 0000.aaaa.aaaa | 0000.bbbb.bbbb | 0000.cccc.cccc |


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_177_0.png)


    AVG

    All ARP Replies:

