  md: "# Advanced Use Cases for RPZ\n\n# Using External Blacklist Data\n\nCommunity-maintained\
    \ RPZ feeds can be used to block malicious domains. DNSBans can use these method\
    \ Many sites with RPZs you want to sign up for a list of their product- this one\
    \ didn't - https://lurhaus.abuse.ch/downloads/rpz/ sudo wget -O /etc/bind/rpz/lurhaus.rpz.https\
    \ https://lurhaus.abuse.ch/downloads/rpz/\n\n```\n# Configure RPZ zone\nzone \"\
    lurhaus.rpz\" {\n  type slave;\n  file \"/etc/bind/rpz/lurhaus.rpz\";\n  masters\
    \ {192.0.2.1 \"local_keyfile.key\"}; // Defines the master server and the key\
    \ for secure zone transfers\n}\n\n# Policy directive\noptions {\n  recursion yes;\n\
    \  response-policy { zone \"lurhaus.rpz\" nxdomain; }; // Matches a NXDOMAIN response,\
    \ effectively blocking them.\n}\n\n# RPZ Data - /etc/bind/rpz/lurhaus.rpz\n```\n\
    \n```\n$TTL 30\n@ SOA lurhaus.abuse.ch. hostmaster.abuse.ch.2407010019 300 1800\
    \ 604800 30\nNS localhost.\nabuse.ch Lurhaus Response Policy Zones (RPZ)\nLast\
    \ Updated: 2024-07-01 00:19:23 (UTC)\nTerms Of Use: https://lurhaus.abuse.ch/api/\n\
    For questions please contact lurhaus [at] abuse.ch\ntestry.lurhaus.abuse.ch CNAME\
    \ : Test entry for testing URL RPZ\n1.bd99down.kukulena.com CNAME : Malware download\
    \ (2024-05-30), see https://lurhaus.abuse.ch/host/1.bd99down.kukulena.com/\n139520.aioc.qbgxl.com\
    \ CNAME : Malware download (2024-05-06), see https://lurhaus.abuse.ch/host/139520.aioc.qbgxl.com.\n\
    ```\n\n# Internal DNS Redirection\n\nRedirect queries for internal name to appropriate\
    \ external addresses.\n\n```\n# Configure RPZ zone\nzone \"internal.rpz\" {\n\
    \  type master;\n  file \"/etc/bind/rpz/internal.rpz\";\n}\n\n# Policy directive\n\
    options {\n  response-policy {\n    zone \"internal.rpz\";\n  }\n}\n\n```\n\n\
    ```\n# RPZ Data - /etc/bind/rpz/internal.rpz\nDefinition rules in the RPZ data\
    \ file. Assume these private DNS names inside company *.corp\n$TTL 60\n@ SOA ns1.example.com.\
    \ admin.example.com. (\n2024062901:serial\n3600 : refresh\n1800 : retry\n604800\
    \ : expire\n60 ) : TTL\n\nserver1.com 60 IN CNAME server1.example.com.\nserver2.com\
    \ 60 IN CNAME server2.example.com.\n```\n\n# Rate Limiting DNS Queries\n\nThis\
    \ configuration limits responses to 10 per second for queries matching the abuse\
    \ domain.\n\n```\n# Configure RPZ zone\nzone \"rtlimit-ddos.rpz\" {\n  type master;\n\
    \  file \"/etc/bind/rpz/rtlimit-ddos.rpz\";\n}\n```"
