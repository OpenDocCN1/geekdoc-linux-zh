- pgno: 86
  md: '# DNS Rcodes (Return Codes)


    NOERR | No Error. Query successful; valid response.

    FORMERR | Format Error (unable to interpret query format.)

    SERVFAIL | Server error processing request;

    XDOMAIN | FQDN doesn''t exist: "XDOMAIN"

    NOTIMP | Server doesn''t support query type

    REFUSED | Refused query; likely a policy, zone transfer

    NOTAUTH | Server not authorized for the zone.

    NOTZONE | Name not found in the zone.

    PEREQ | Failed prerequisites: YXDOMAIN, NRRSet, NXRRSet.


    # Domain Statuses (reported in queries)


    Depending on the Top Level Domain (TLD), there can be different status used by
    the underlying registry.


    COM and .NET domain names


    ACTIVE | Domain registered; functioning for websites or email.

    REGISTR-HOLD | On hold by registry; contact registrar.

    REGISTR-LOCK | On hold by registry, contact registrar.

    REGISTRY-LOCK | Registered domain; settings can''t change.

    REDEMPTIONPERIOD | Locked domain expired; 30 day hold before delete.

    PENDINGRESTORE | Expired domain being restored to ACTIVE.

    PENDINGDELETE | Domain expired 75 days ago; deleting soon.


    # ORG, BIZ, and INFO domain names


    OK | Domain active; for websites, email, or name servers.

    CLIENT_DELETE_PROHIBITED | Registry locked domain; cannot delete.

    SERVER_DELETE_PROHIBITED | Registry locked domain; cannot delete.

    CLIENT_HOLD | On hold; domain unusable.

    SERVER_HOLD | On hold; domain unusable.

    CLIENT_NEW_PROHIBITED | Registry locked domain; cannot renew.

    SERVER_NEW_PROHIBITED | Registry locked domain; cannot renew.

    CLIENT_TRANSFER_PROHIBITED | Registry locked domain; cannot transfer.

    SERVER_TRANSFER_PROHIBITED | Registry locked domain; cannot transfer.

    CLIENT_UPDATE_PROHIBITED | Registered domain; settings can''t change.

    SERVER_UPDATE_PROHIBITED | Registry locked domain; settings can''t change.

    INACTIVE | Domain unusable; name servers.

    PENDING_DELETE | Domain registration about to delete.

    PPENDING_TRANSFER

    PENDING_TRANSFER | Domain transferring; no modifications allowed.

    PENDING_VERIFICATION | Registry creating domain record.


    # DNS message format


    | QR | OPCODE | AA | TC | RD | RA | RE | AD | CD | RCODE |

    |---|---|---|---|---|---|---|---|---|-|

    | | | | | | | | | | |

    | | | | | | | | | | |

    | | | | | | | | | | |

    | | | | | | | | | | |

    | | | | | | | | | | |


    | QR | Query (0) or response (1)

    | OPCODE | Type of message being sent: Query (0), Inverse Query (1), Status Request
    (2)

    | AA | Authoritative answer indicates the name is authoritative for queried domain

    | TC | Truncation

    | RD | Recursion decision Response was truncated due to size limit (UDOP)

    | RA | Recursion available- The clients request recursive resolution

    | RE | Reserved for use

    | AD | The DNS server performs recursive queries

    | CD | Checking disabled (DNSSEC)

    | RCODE | Response type

    | QCOUNT | Number of queries in the Question section

    | ANCOUNT | Answer Count Number of resource records in the Answer (actual answers)

    | NSCOUNT | Authority Count Answer and authority sections are authenticated The
    clients requests the DNS for disabled DNSSEC validation [NoError(0), FormatError(1),
    ServerFailure(2), NameError(3), etc.]

    | ANCOUNT | Authority Count Number of resource records (authority name names)
    in Authority section

    | ARCOUNT | Additional Count Number of resource records in the Additional section'
  merge: -1
  img_proc: true
