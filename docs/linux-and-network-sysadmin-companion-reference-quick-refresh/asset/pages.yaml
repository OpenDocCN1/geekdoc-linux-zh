  md: '# Simple routing and switching trip HostA(172.16.10.2) pings HostB(172.16.20.5)
    over one router


    Note: this example ignores the issue mentioned in the ping section "what happens
    to the first ping?"


    +   1- ICMP ping process creates errors for its echo request, which is simply
    the alphabet in the data field. It is handed to IP to form a packet. At a minimum,
    this packet contains an IP source address, an IP destination address, and a Protocol
    with field 01


    +   3- IP checks if the destination IP address is a device on the local LAN or
    on a remote network. If the destination is on a remote network


    +   4- It finds the default GW 172.16.10.1, so the ARP cache is checked for the
    MAC if it has already been resolved. If the ARP cache doesn''t have an ARP record,
    it is sent out on local for 172.16.10.1, router sends, and the cache updated with
    the info and activity for it.


    It turns out the ARP table had it, so it''s the router''s interface with the MAC
    on Ethernet0, so its activity is set to 0, and the packet is then handed over
    to be part of the Data Link layer for framing.


    +   5- With destination and source MAC addresses, ether-type (0x0080 for IP) and
    the packet payload, the LAN driver is used to provide media access via the LAN
    (Ethernet), a frame is then generated, adding the FCS (the result of).


    +   6- Frame is given to the bit-by-bit. THE FRAME HAS FINALLY ENTERED THE NETWORK


    +   7- All devices on the collision domain get the bits, rebuild the frame, and
    run a CRC to compare the FCS for integrity. If the integrity check''s discarded
    (note: this counts if we are in a collision domain)


    +   8- If it passes, the destination MAC is checked to see if it matches one address.
    Eth0 on the router gets it, it checks the ether-type field and gives the packet
    to IP (if it is the destination).


    +   9- On the router packet layer checks it (doesn''t run a CRC like the Data
    Link layer does on the frame). Since the packet''s destination doesn''t match
    any of the addresses on the router''s interfaces, the router will look in its
    routing table. If there is no entry for 172.16.20.0 the packet will be discarded
    and an ICMP message is sent back. In this case it found the packet''s destination
    network unreachable message. Since the router sends "directly out to the eth1
    (for the destination)\, no protocols are routed.


    +   10- As IP hands the packet to Layer 2, the MAC of HostB''s address is found
    in the ARP cache, or an ARP request is sent out for it (just in steps 3-6). We
    can say that the packet has been switched to a buffer before it''s framing. It''s
    framed, and sent out, just like in steps 5 and 6. THE FRAME HAS LEFT THE ROUTER


    +   11-HostB receives the frame and immediately runs a CRC. If the result matches
    the information in the frame, the hardware destination address will be then checked.
    If the host finds a match, the Ether-Type field is finally checked to determine
    the Network protocol that the packet with (IPv4), and it is passed up the stack.


    +   12- IP gets the packet, runs a CRC on the header, checks the destination address
    and sees its own address, so it checks Protocol field to find which Layer 4 protocol
    generates the payload. DESTINATION REACHED!


    +   13- The payload is handed to ICMP, which indicates this is an echo request.
    ICMP responds to this by immediately discarding the packet and generating a new
    echo as reply.


    +   14- A packet is created including the source and destination addresses, Protocol
    field, and payload. The destination is now HostA.


    +   15- Steps 3-6 are repeated with HostB: getting it to the gateway''s IP address,
    getting the gateway MAC, framing it, and sending it to the router.


    +   16- The router''s interface receives the bits and builds a frame. The CRC
    is run, and the FCS field is checked to make sure the answer match. It''s handed
    to IP and 7-10 are repeated until sending back to HostA


    +   17- To the router, the device knows to get 172.16.10.0 out exit eth0, and
    the MAC for 172.16.10.2 is already coming from the routing ip to HostB, so it
    frames and sends out over the network. (LEAVES THE ROUTER)


    +   18- The destination host receives the frame, runs a CRC, checks the destination
    MAC, then looks at the Ether-Type field, saying it is handed off to the network,
    the Protocol field which says ICMP, and ICMP determines the packet to be an ICMP
    echo reply. ICMP acknowledges that it has received the reply by sending an exclamation
    point (!) to the user interface. ICMP then attempts to send four more requests
    to the destination host.'
