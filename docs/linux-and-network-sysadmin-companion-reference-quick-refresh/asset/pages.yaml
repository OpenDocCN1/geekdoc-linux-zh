- pgno: 53
  md: '/etc/auto.master: main configuration file - defines mount points, links to
    their map files, global options for autofs


    Each line in the type file follows this format: <mount_point> <map_file> <options>

    /etc/auto-identifier: Map files, referenced by the master map file, contains details
    on individual mount points.


    Each map file defines a specific configuration for a particular point. The format
    depends on the mype type:

    sfsmd.map_format: Traditional format that specifies the NFS server location, automaton
    behavior, access control.

    auto.master_format: Newer format that allows for inheritance and modular configuration
    based on directories.


    # NFSv3 Mount Options:


    nsize/ (read/write size): Maximum packet size per request the client will read
    or write from the NFS server. Increasing can improve performance for file reads,
    but values too large may lead to fragmentation and inconvenient network usage.


    bg/ (background/foreground): background allows the system to continue building
    while the NFS server is established, while foreground forces the mount until the
    NFS server is successfully completed before returning.


    async/: The default, async allows the client to acknowledge writes to the server
    before data is physically written to disk. Can improve performance but lead to
    data loss if the client crashes before the write is completed. Using sync ensures
    all data written to NFS is flushed to the server''s disk before the mount command
    returns. This can improve data integrity but also impact performance.


    noauto: prevents the system from automounting the NFS share during boot


    _netdev: Tells wait for the network interface to be configured before attempting
    the NFS mount

    tcp/udp: NFSv3 defaults to TCP, but UDP is used in specific scenarios (like low-latency
    networks) with trade-offs in reliability.


    # NFSv4 Mount Options:


    Building on NFSv3 options, NFSv4 introduces additional options to security favors
    and performance optimizations:


    +   - sec: kerb5/none: Use kerberos with encryption for data privacy and integrity
    protection. Kerb5 uses data without encryption. None is not recommended. Kerberos
    needs to be separately configured on the client and server. rpc_sec is a remnant
    of NFSv2 and no longer relevant.


    +   - nfsvers (NFS version): While the system might negotiate the NFS version
    with the server, you can explicitly specify nfsvers=4 to an NFSv4 mount.


    +   - minor_version (minor NFS version): This option allows specifying a minor
    version of NFSv4 if your server supports multiple versions.


    +   - readdirplus: This option enables the client to retrieve additional information
    about directory listings, improving performance for browsing directories on the
    NFS.


    Many NFSv3 mount options like rsize, wsize, sync/async, noauto, background/foreground
    and netdev are still relevant for performance tuning and basic behavior in NFSv4.


    # Kerberos setup


    Log in to the kerberos server

    Launch daemon.local to enable CLI

    Add the service principal


    ```

    ssh username@kerberos_server_ip

    addprinc -range keytabs=<nfs_server_hostname>

    ktadd -t /etc/kerb5.keytab $hostname=$hostname (hit return, type to exit CLI)

    ktadd username@nfs_server_ip >/etc/kerb5.keytab

    if not return, then exit

    ```


    Create a keytab file for NFS server

    Set permissions for keytab file

    Be sure /etc/keytabs has file shared

    Edit /etc/krb5conf


    Edit /etc/kerb5.conf check config

    Enable, start NFS and kerberos


    ```

    sudo chmod 400 /etc/kerb5.keytab; sudo chown root:root /etc/kerb5.keytab

    kerb5 -sp client, as demonstrated before

    sudo vi /etc/krb5.conf

    Add or implement entries PCGRSSGDARS="" and RPCGCSSGDARS=""

    sudo vi /etc/krb5.conf [domain = local], [realm = local]

    systemctl enable nfs-server kerberos; systemctl enable randbind; sudo systemctl
    start nfs-server

    mount -t nfs -o sec=kerb5 $server$share_name /mnt/nfs

    ```


    Run on client to verify it''s working

    firewall configuration: sudo firewall-cmd --add-service=nfs-server

    iptables options: sudo iptables -I INPUT -p tcp --dport 2049,111 -j ACCEPT

    List SELinux status with boolean -l | grep -i ''nfs'' | semanage context -l |
    grep -i ''nfs'''
