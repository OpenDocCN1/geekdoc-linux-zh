  md: '# Shortened version of what''s at https://robotmoon.com/ssh-tunnels/


    # Port forwarding - For a port from one system (local or remote) to another


    Local port forwarding- Connections from a port on a local system to a port on
    a remote host.

    To forward traffic on the SSH client to some destination through an SSH server.
    This lets you access remote services over an encrypted connection as if they were
    local sessions.


    Example use cases:


    +   - Accessing a remote service (remisc, memcached, etc.) listening on internet
    IPs

    - Locally accessing resources on a private network

    - Transparently proxying to a remote service


    If you want to use a secure connection to access a remote service that communicates
    over cleartext. For example, remisc and memcached use all plaintext protocols.
    If you securely access one of these services on a remote server over public networks,
    you can tunnel a connection from your local system to the remote server instead
    of having it listen over the public.


    SSH -L is from INSIDE-IP:port-OUTSIDE-ACCESS-IP:port SSHServerName


    ssh -L 127.0.0.1:8080:example.80 ssh-server


    Forward connections to 127.0.0.1:8080 on your local system to port 80 on example
    through ssh-server.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_236_0.png)


    The traffic between 8080:example.org is wrapped in an SSH tunnel, but the traffic
    between ssh-server and example.org is not. From the perspective of example.org
    the traffic originates from ssh-server.


    ssh -L *:8080:example.org:80 ssh-server


    Forward connections to port 8080 on all interfaces on your local system to example.org:80
    through a tunnel to a ssh-server.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_236_1.png)


    ssh -L 192.168.0.1:5432:127.0.0.1:5432 ssh-server


    Forward connections to 192.168.0.1:5432 on your local system to 127.0.0.1:5432
    on ssh-server. Note that 127.0.0.1 is localhost at the viewpoint of ssh-server.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_236_2.png)


    SSH configurations. Make sure:


    TCP forwarding enabled on the SSH server. In /etc/ssh/sshd_config set "AllowTcpForwarding
    yes"

    If''re forwarding ports on interfaces other than 127.0.0.1 you''ll need to enable
    GatewayPorts on your local system, either within ssh_config or as a command-line
    option

    In /etc/ssh/sshd_config set "GatewayPorts yes"


    Forwarding from privileged ports


    If you want to open a port (ports 1-1023) for forward traffic, you''ll need to
    run SSH with superuser privileges on the system that has the port.


    sudo -L 80:example.com:80 ssh-server


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_236_3.png)'
  merge: -1
