  md: '# # Subnet Shortcut


    Using binary AND: 1 and 1 = 1, all others = 0 (see below)


    What is the network number of the address 192.168.100.115 with a subnet mask of
    255.255.255.240?

    192.168.100.115 = 11000000.10101000.01100100.01110011

    255.255.255.240 = 11111111.11111111.11111111.11100000

    AND result = 11000000.10101000.01100100.01110000 = 192.168.100.112

    192.168.100.115 belongs to the 192.168.100.112 network when a mask of 255.255.255.240
    is used.


    It''s simpler: octets of the addresses with a common 255 or 0 can be ignored.

    What''s the broadcast for IP address 192.168.100.164 if it has a subnet mask of
    255.255.255.248?

    192.168.100.164 = 11000000.10100000

    255.255.255.248 = ...................11111000

    AND result = 11000000.10100000 = 192.168.100.160 (here''s our subnet)


    Separate network bits from host bits.

    255.255.255.248 = the first 24 bits are network bits - so the last 8 bits are
    host bits

    ---10000000. Change all host bits to 1, so it''s --- 10111111 = 192.168.100.167

    The broadcast of 192.168.100.164 is 192.168.100.167 when the subnet mask is 255.255.255.248.


    To what does 131.188.27 belong, if its subnet mask is 255.255.255.240?

    Based on the two shortcut rules, the answer should be 131.188.77.0

    So now you need to convert one to binary for the ANDing process:

    227 = 11100011

    240 = 11110000

    Therefore, the address is 131.188.24.


    # What subnet does this belong to?


    What subnet does 192.168.12/29 belong to?

    Our mask is a /29. The next boundary is 32. So 32-29=

    2^3 = 8 which we use as block size i.e. 2 to the power of 3 equals 8.


    We have borrowed from the last octet as the last bit is in the last list. We start
    from zero and count up in our block size.

    192.168.12.0

    192.168.12.8

    192.168.12.16

    ...

    192.168.12.72

    192.168.12.80

    Our address is 192.168.12.78 it must sit on the 192.168.12.72 subnet.


    What subnet does 172.16.116.4 sit on?

    Our mask is /19 and our next boundary is 24. Therefore 24-19=5. The block size
    is 2^5 = 32.

    We have borrowed into the third octet as 5 bits so we count up block size in the
    third octet. The subnets are:

    172.16.0

    172.16.32.0

    172.16.64.0

    172.16.96.0

    172.16.128.0

    Our address is 172.16.116.4 it must sit on the 172.16.96.0.


    What subnet does 10.34.67.24/12 sit on?

    Our mask is /12. Our next boundary is 16. Therefore 16-12=4, 2^4=16 which gives
    us our block size.

    We have borrowed from the second octet as 5 bits in the second octet we count
    up block size in the third octet. The subnets are:

    10.0.0.0

    10.16.0.0

    10.32.0.0

    10.48.0.0

    ......etc

    Our address is 10.34.67.24 it must sit on the 10.32.0.0.


    # What is the valid host range of the Nth subnet of abc.xxx.yy.zzz/**'
