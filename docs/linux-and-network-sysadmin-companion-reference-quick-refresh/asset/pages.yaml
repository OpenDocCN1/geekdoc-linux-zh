- pgno: 153
  md: '# VLAN Trunking Protocol (VTP)


    Designed as a method to manage VLANs across a large number of switches: addition,
    deletion, and renaming from a central point of control, all switches participating
    can use any VLANs. Add a VLAN on the server and it gets set up on others. Not
    used in modern networks, Cisco says best practice is keeping switches in "off"
    or "transparent" modes; you may never see it but may find it hard to disable or
    organize it.


    A switch can belong to just one management domain, and there is no communication
    between them. VTP advertisements contain info about the domain itself (including
    revision number), it''s VLANs and their info.


    VTP Modes: vtp mode (server | client | transparent)


    +   - Server mode (default)

    - full control over management of it''s domain. Each domain should have at least
    one server

    - advertisements to other switches in the domain, receives info to synchronize
    domain members

    - The first server defined in the network defines the domain that will be used
    by future VTP servers and clients.

    - Multiple VTP servers can coexist in a domain, and is recommended for redundancy.

    - There is no election for primary or secondary server

    - If one switch configured with a new VLAN or VTP parameter, others synchronize
    just as any


    +   Client mode:

    - listen to VTP advertisements from other switches and modify configurations accordingly.

    - forward/relay VTP messages out turn links to neighboring switches in the domain


    +   Transparent mode:

    - do not participate in VTP, does not advertise or synchronize its VLAN database
    with received advertisements.

    - create and delete VLANs that are local only to itself without changes being
    advertised

    - Works only as a relaying member.

    -[ VTP v1, transparent mode does not receive VTP info into its domain and VTP
    version number]

    -[ VTP v2 and v3, transparent mode does forward VTP advertisements regarding the
    VTP domain name]


    Off mode disables all VTP activity on the switch.


    Revision Numbers - when out adding hardware:


    VTP starts off at a revision to track the most recent information.

    The VTP server changes every change in domain it will advertise

    advertisement with a greater revision number than before it has new and updated
    information.


    Important:

    VTP VLAN data is saved in vlandat in flash memory is it even when the switch is
    off.

    Even a device can recover last known VTP/VLAN configuration from its database
    after it reboots. Even a device

    previously configured in client mode will send a summary advertisement from it''s
    vlandat after powering up and

    discovering it has a higher revision number.


    +   - Must be not to plug in a VTP enabled switch with a higher revision number,
    as it will obliterate VTP

    dabase information the domain it matches!


    +   - Always force revision number 0 before adding-EVEN if configured as a VTP
    client

    - On a new device, set to VTP domain and then change back to server - change the
    VTP domain to a bogus name

    - For control of your network use VTP transparent or off mode to prevent synchronization
    problems

    - Eliminate the for duplicate, overlapping VLANs in a large network with transparent
    mode. For example, two

    administrators might configure VLANs on switches in their respective areas but
    use the same VLAN identification or VLAN

    number. They could overlap if both administrators ever using VTP servers


    Domains use unsecured advertisements (default), but a password can be required
    to participants (secure mode)


    Cisco switches - default VTP server mode - forget to disable!

    Turns out that by default Cisco switches operate in VTP server mode for the management
    domain NULL (a blank string), no password. If it hears a VTP summary advertisement
    it automatically learns the VTP domain name, VLANs, revision number. This makes
    it easy to bring in a new switch in an exciting VTP domain.

    Be sure to remember that the new switch stays in VTP server mode until you change
    it.'
