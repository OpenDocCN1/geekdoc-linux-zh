  md: "# Dovecot Alternate Config (Use PAM to kerberos, then try LDAP)\n\nI wanted\
    \ to prioritize kerberos over LDAP, then try other methods after trying those\
    \ two. This meant invoking and /etc/sysconfig/sasauthd to handle the order of\
    \ things. A second solution was to use a PAM config for Dovecot which would handle\
    \ things in the order I wanted\n\n```\n# /etc/dovecot/conf d/10-auth.conf\n# Enable\
    \ specified authentication mechanisms for Dovecot\nauth_mechanisms = gssapi pam_scram-sha-256\
    \ scram-sha-1 digest-md5 crammd5\n# Set up password database to use pam, which\
    \ refers to lasauthd\npassdb {\n  driver = pam\n  args = session=yes docot\n```\n\
    \n```\n# User database using system's pam file (could also be ldap if needed)\n\
    userdb {\n  driver = password\n}\n```\n\n[The file /etc/dovecot/dovecot-imap.conf\
    \ is still relevant, but been and removed here since it is redundant]\n\n```\n\
    # Configure PAM to Dovecot to delegate order of operations\n```\n\nPAM configuration\
    \ files (stored in /etc/pam.d) have three domains of a programs operations define:\n\
    - Authentication management specifies how to verify the user's identity-authenticate\
    \ the user based on local credentials, kerberos, LDAP biometric input, SSO, or\
    \ MFA.\n- Account management verifies that the account is in good standing and\
    \ can be used for login (is not disabled or expired)\n- Session management configures\
    \ the session after successful login, to manage session, application resource\
    \ limits, set environment variables, configure user namespaces for the session,\
    \ or configure other session-related aspects.\n\nCreate or modify the PAM configuration\
    \ file for Dovecot, /etc/pam.d/dovecot:\n\n```\n# /etc/pam.d/dovecot\n#PAM-1.0\n\
    # Authentication management (these are listed in order they are to be attempted)\n\
    auth required pam_unix.so nullok\nauth sufficient pam_krb5.so use_first_pass\n\
    auth sufficient pam_ldap.so use_first_pass\nauth requisite pam_succeed_if.so so\
    \ uid >= 1000 quiet_success\nauth required pam_deny.so\n```\n\n```\n# Account\
    \ management\naccount required pam_unix.so\naccount sufficient pam_krb5.so\naccount\
    \ sufficient pam_ldap.so\n```\n\n```\n# Session management\nsession required pam_limits.so\n\
    session sufficient pam_krb5.so\nsession optional pam_ldap.so\n```\n\n```\n# pam_unix.so:\
    \ Checks the local /etc/passwd and /etc/shadow files.\n# pam_krb5.so: Integrates\
    \ Kerberos for authentication.\n# pam_ldap.so: Integrates LDAP for authentication.\n\
    # use_first_pass: Passes the password to the first module to subsequent ones to\
    \ avoid prompting the user multiple times.\n```\n\nAfter editing the PAM configuration,\
    \ restart the relevant services to apply the changes.\n\n```\n# Restart Services:\n\
    systemctl restart slaauthd\nsystemctl restart docot\n```\n\nYou can test PAM functionality\
    \ with tools like `dovecot auth test <username>"
