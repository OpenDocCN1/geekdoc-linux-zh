- pgno: 176
  md: '# Interface Tracking


    | --- | --- |

    | --- | --- |

    | Router(config)#track 2 interface fa0/1 line-protocol | Config FastEthernet0/1
    interface to be tracked. The line-protocol tracks which interface it is up |

    | Router(config-track)#exit | Notice prompt "config-track" ? for more options
    |

    | Router(config)#interface fastethernet0/0 | |

    | Router(config)#glbp 10 weighting 110 20 5 | Initial weighting value: upper/lower
    thresholds, for GW |

    | Router(config)#glbp 10 weighting 2 decrement 50 | Track the object and decrement
    the weight by 50 when the Fast Ethernet0/1 interface fails


    # Verifying GLBP


    | --- | --- |

    | --- | --- |

    | Router#show glbp | Displays GLBP information |

    | Router#show glbp brief | Displays a status of all GLBP groups |

    | Router#show glbp v10 | Displays information about GLBP group 10 |

    | Router#show glbp vlan10 | Displays GLBP information on interface Vlan10 |

    | Router#show glbp vlan20 | Displays GLBP group 10 info on interface Vlan20


    # Debugging GLBP


    | --- | --- |

    | --- | --- |

    | Router#debug condition glbp | Displays GLBP condition messages |

    | Router#debug glbp errors | Displays all GLBP error messages |

    | Router#debug glbp packets | Displays messages about packets sent and received
    |

    | Router#debug glbp terse | Displays a limited range of debugging messages


    A redirect timer is used to determine when the AVG stop using a virtual MAC address
    in ARP replies. The AVF corresponding to the old MAC address continues to act
    as stand-in gateway for any clients that try to use it.


    When the timeout timer expires, the old MAC address and the virtual forwarder
    are flushed from all the GLBP peers. The AVF assumes that the previously failed
    AVF will not return to service, the resources assigned to it must be reclaimed


    At this point, clients using the old MAC address in ARP caches must refresh the
    entry to obtain the new MAC address.


    The redirect timer defaults to 600 seconds (10 minutes) and can range from 0 to
    3600 seconds (1 hour). The timeout timer defaults to 14,400 seconds (4 hours)
    and can range from 700 to 64,800 seconds (18 hours). You can adjust these timers
    with the following interface configuration command:


    ```

    Switch(config-if)# track object-number interface type member/module/number (line-protocol)
    | ip routing

    ```


    The object-number is an arbitrary index (1 to 500) for weight adjustment. The
    condition that triggers adjustment can be line-protocol (the interface protocol
    is up) or ip routing. (IP routing is enabled, the interface has an IP address,
    and the interface is up).


    GLBP can also be used with IPv6. Rather than specifying an IPv6 address, use the
    following command to autconfigure the address:


    ```

    Switch(config-if)# glbp ipv6 autoconfigure

    ```'
