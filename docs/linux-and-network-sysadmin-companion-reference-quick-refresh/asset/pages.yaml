    The method is set with global configuration command. It''s set globally for the
    switch, not on a per-port basis.


    # Table 10-3 Types of EtherChannel Balancing Methods


    | Method Value | Hash Input |

    |---|-|

    | src-ip | Source IP |

    | dst-ip | Destination IP |

