  md: '# Ansible: Keywords For General Playbook Objects


    Common (to play, role, block and task objects)


    | | |

    | --- | --- |

    | any_errors_fatal | Force any unhandled tasks on any host to propagate to all
    hosts and end the play. |

    | become | Boolean that privilege escalation is used or not on Task execution.

    | become_facts | A string(s) to save the privilege escalation program when become
    becomes True.

    | become_method | Which method of privilege escalation is used (such as sudo or
    su).

    | become_user | User that you ''become'' after using privilege escalation (as
    permissions) Default is root.

    | ansible_become_pass | Provides the password for become directives

    | check_mode | A boolean if a task is executed in ''check'' mode

    | collections | UNDEFINED

    | connection | Allows you to choose the connection plugin for tasks to execute
    the target.

    | debugger | Enabling debug tasks based on state of the task. See Playbook debugger

    | diff | Toggle to tasks return ''diff'' information or not nothing.

    | environment | A dictionary containing env vars for the task upon execution.
    Does not affect Ansible configuration, it sets variables for the code executing
    the task.

    | ignore_errors | Boolean allows you to ignore unreachable hosts and continue
    with play. This does not affect other errors

    | ignore_unreachable | (ignore, errors) is useful for groups of volatile/ephemeral
    hosts.

    | module_defaults | Specific parameter values for modules.

    | name | Identifier. Used for documentation, in tasks/handlers.

    | no_log | Boolean that controls information

    | port | Used to define the default port used in connection.

    | remote_user | User used to log the target via the connection plugin.

    | run_once | Boolean that will bypass the host loop, forcing the task to attempt
    to execute on the first host available and afterwards anyway any results and to
    all hosts in the same batch

    | tags | Tags added to a task or included tasks, this also selecting subsets of
    tasks from CLI

    | vars | Dictionary/yaml variables


    # Play object-specific


    | | |

    | --- | --- |

    | fact_path | Set the path for the fact gathering controlled by gather factors.

    | force_handlers | Will force handler execution if they fail during the play.
    Will not trigger if the play itself fails.

    | gather_facts | Boolean that if it will automatically set the ''registry'' to
    the task for handlers.

    | gather_subset | Allows you to pass subset options to the fact gathering controlled
    by gather_subset.

    | gather_timeout | Allows you to set the timeout for the fact gathering controlled
    by gather_subset.

    | handlers | A section with tasks are treated as handlers, they won''t execute
    normally; only when after each section of tasks is a handler''s field is met.

    | hosts | List of groups, hosts or host pattern that translates into a list of
    hosts that is the play''s target.

    | max_fail_percentage | Percentage of errors in the current batch

    | order | Controls the sorting of how tasks are being executed for the play. Possible
    values are inventory (default), sorted, reverse, sorting, inventory and undefined.

    | post_tasks | A list of tasks to execute after the tasks section.

    | pre_tasks | List of tasks to execute before roles.

    | roles | List of roles to be inserted into the play

    | serial | Explicitly define how Ansible batches the execution of the current
    play on the play''s target

    | strategy | Allows you to choose the plugin for use of the play.

    | tasks | Main list of tasks in the play, they run after roles and before post_tasks.

    | vars_files | List of files that contains var in the play.

    | vars_prompt | List of variables to prompt.


    # Block object-specific


    | | |

    | --- | --- |

    | always | List of tasks, in a block, execute no matter if there is an error in
    the block or role.

    | block | List of tasks in a block.

    | delegate_facts | Boolean that allows you to apply facts to the delegate host
    instead of inventory_hostname.

    | delegate_to | Host to execute task instead of the target (inventory_hostname);
    use that host''s connections.

    | rescue | List of tasks in a block that run if there is a error in the main block
    list.

    | when | Conditional expression, if it defines an iteration of a task is run or
    not.'
