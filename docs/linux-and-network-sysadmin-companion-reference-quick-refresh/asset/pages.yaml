  md: 'It is beneficial to run a network sniffer such as Ethereal or tcpdump during
    testing to pick up unsolicited ICMP responses, including ICMP TTL exceeded (type
    10) messages, a routing loop, and "ICMP administratively prohibited" (type 3 code
    13) messages, indicating an ACL on a router or firewall.


    # OS Fingerprinting Using ICMP


    Another SNmap tool worth mentioning is Scans, a fingerprint of the Packeto suite
    by analyzing responses to ICMP probes. Keuptools contains a number of useful networking
    tools that are available at: http://www.dopra.com/read/php/packeto.html. For Windows,
    Foundation''s SuperScan is an excellent port scanning tool with good functionality,
    including banner grabbing. SuperScan is available from: http://examples.oreilly.com/network/tools/superscan4.zip


    Scand is designed with distinct SYN probing and background listening components
    that allow for very fast scanning. Inverse SYN cookies (using SHA1) tag-out probe
    packets, that false positive becomes nonexistent, as the listening component only
    registers responses with the correct SYN codes. Scand is much faster than bulk
    scanners, as Nmap.


    Unicscan (http://www.unicscan.com) is another tool that performs fast half-open
    scanning. It has some very useful features, and it is recommended for advanced
    users (UDP payload scan) at 10.3.0.1 within my environment, the responses are
