- pgno: 212
  md: 'The command show ip bgp shows the BGP topology database, which includes all
    the networks BGP knows about, the next nhop, some of the attributes, and the AS
    path for each route.


    ```

    route-server>show ip bgp

    BGP table version is 228573, local router ID is 12.0.1.28

    Status codes: s suppressed, d damped, h history, v valid, > best, *

    r RIB failure, s State

    Origin codes: i IGP, ? EGP, ? incomplete

    ```


    | Network | Next Hop | Metric | LocPrf | Weight |

    |---|---|---|---||

    | * 3.0.0.0 | 12.123.126 | | | 7018 2914 9304 80 i |

    | | 12.123.126 | | | 7018 2914 9304 80 i |

    | * 3.51.92.0/23 | 12.123.137 | | | 7018 |

    | | 12.122.154 | 2366 | | 7018 |

    | | 12.121.236 | | | |

    | * 8.6.6.0/24 | 12.123.137 | | | 7018 701 14744 14744 14726 i

    | | 12.125.145 | | | 7018 701 14744 14744 14726 i

    | | 12.123.236 | | | 7018 701 14744 14744 14726 i|


    Networks are listed in order.

    The first column lists each route''s status. They are one-character, squeezed
    together


    The asterisk (*) in the first column means the route has a next hop.

    Other options:

    s - suppressed: BGP knows about the network but is not advertising it, often if
    a summarized route is de-damped: BGP stopped advertising a network that flaps
    off until it is stable for a period of time.

    h - history: BGP knows this network but does not currently have a route to it.

    r - RIB failure: advertised route but not in routing table. Another could may
    have a route with a better AS.

    s - State: used with nonstop forwarding - route needs to be refreshed when the
    peer is restarted.


    The second column has a greater-than (>) beside the route that was selected as
    the best path to network. In example, the route selected for 3.0.0.0.


    The third column is in the example, which shows that the route learned from an
    external neighbor. A route learned from an IBGP neighbor would have an i in the
    third column. (a - aggregate, i)


    The fourth column lists the routes. Those without a subnet mask, as network 3.0.0.0,
    are our class mask. In the example, when the route learns from multiple sources,
    it lists only the network route.


    The fifth column lists the next-hop address for each route. This might or not
    be a directly connected router. A next-hop of 0.0.0.0 means the local router originating
    it (and/or, the router has no-BGP routes to the network.


    Inter-autonomous system metric - If a Med was value for route, it is listed in
    the Metric column: Notice that the advertisement for 3.51.92.0/23 at router 12.122.125
    has a Med value of 2366. Because the default Local Preference is used for each
    of routes, no local preference value is displayed. The Default Weight of 0 is
    listed,


    Toward is the AS path for each route. Reading from left to right, the first AS
    number is the adjacent AS we learned from the route. After, the AS path is traversed
    in order. The last AS number is listed in the AS. In the example, our route learned
    an advertisement about 3.0.0.0 from its neighbor AS 7018, which was about from
    AS 2914, which about from AS 9304. And AS 9304 learned the route from AS 80, which
    originated it. An AS path means that the route was originated in the AS


    In the AS path column, network 8.6.6.0 shows 14744 twice in its AS path list.
    Maybe 14744 has an extra copy of its AS name to make the path less attractive
    than the path through other autonomous systems. In this case it did not work the
    only paths to 8.6.6.0 this router knows all through AS 14744.


    +   The last column shows how BGP learned the route.

    - Networks 3.0.0.0 and 8.6.6.0 show an i in " for their origin codes. This means
    the originating router had a network statement for that route.

    - Networks 3.51.92.0 shows a "?" for its origin. This means the route was redistributed
    into BGP; BGP considers it "incomplete" route."


    +   - You will never see the third possibility'
