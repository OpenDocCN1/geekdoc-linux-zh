  md: "# Changing Parameters of Kernel Modules (Devices)\n\nmodprobe cdrom parameters.\
    \ These can be changed, only by unloading the module modprobe -r cdrom, modprobe\
    \ lockdoor=0 (example, to turn off the lockdoor boolean parameter)\n\n```\n$root@rhelserver\
    \ ~# lsmod\ncdrom\n$root@rhelserver ~]# modinfo cdrom\nfilename: \t\t/lib/modules/3.10.0-121.el7.x86_64/kernel/cdrom/cdrom.cdrom\n\
    version: \t\t85205948034DF7BB757\ndent: \t\t3.10.0-121.el7.x86_64 SMP mod\nvermag:\
    \ \t\tRed Hat Enterprise Linux kernel signing key\nsigner:\nsig_key: \t\t42:69:9E:EE:FF:C7:79:55:08:13:D4:F7:E8:1B:E8:74:91:08\n\
    sig_hasalgo: \t\tsha256\nparms:\t\tdebugp:bool\nparms:\t\tautoclock:bool\nparms:\t\
    \tautject:bool\nparms:\t\tlockdoor:bool\nparms:\t\tcheck_media:bool\nparms:\t\t\
    max_start:int\n```\n\nIt used to be modifying modprobe.conf could make changes\
    \ but in RHEL7 it changed\nThese are default settings for kernel modules, from\
    \ the associated rpm packages:\n/lib/modprobe/dlist-all.conf and /lib/modprobe/dlist-blacklist.conf\n\
    You don't need to edit them.\n\nInstead edit if /etc/modprobe.d/ - By default\
    \ it is the place to put custom conf files.\nsee man 5 modprobe.d - \"options\"\
    \ section). In this directory create/ cdrom.conf and add:\noptions cdrom lockdoor=0\n\
    \nGenerally you need to see the effects and freely reloading- the module isn't\
    \ enough.\nFor some modules you can look in /sys/module/ to find the driver, for\
    \ the module and see a file called dmesg (or something), it is up to the programmers\
    \ to find this kind of file. For cdrom it isn't. Using dmesg\n\n```\n$root@rhelserver\
    \ ~# dmesg | grep cdrom\ncoreize cdrom: Unit CD-ROM driver Revision: 320\n27396573\
    \ cdrom# ready device 0:45\n27397533 cdrom: Unit CD-ROM driver Revision: 320\n\
    27391741 sr0:0:0: attached scsi CD-ROM sr0\n2777002 usb 2-2: USB device found,\
    \ idvendorb0002,idproduct=0002\n2777005 usb 2-2: New USB device from Vendor, Product=1,SerialNumber=8\n\
    2777008 usb 2-2: Product: VMware Virtual USB Hub\n27827194 hub 2-2:1.0: USB Hub\
    \ found\n```\n\nFields in /etc/modprobe.d/ (or /etc/modprobe.conf)\n\n+   alias\
    \ (module name) Specify an alternate name for a module with a long name.\ninclude\
    \ (file) Add configuration lines to a file.\noptions (module name) (option) Options\
    \ to be added to each module before insertion into the kernel.\ninstall (module\
    \ name) (command) Run the command specified without inserting the module into\
    \ the kernel.\n\nDon't confuse with shared library files (kernel modules)\nThe\
    \ /usr and /lib directories are the default system library locations where the\
    \ shared libraries are kept.\nContains routines, which are used by various applications;\
    \ loaded into memory when links to them is\nloaded. They are then shared with\
