    \ it grows (slides) upward after each acknowledgment.\n\n*Positive acknowledgment\
    \ with retransmission*- The sender documents segment measured in bytes, then waits\
    \ for acknowledgment before sending the next segment. The transmitting machine\
    \ starts a timer and will retransmit if it expires before it gets an acknowledgment\
    \ from the receiving end.\n\n# The TCP Segment's Format and Header Fields\n\n\
