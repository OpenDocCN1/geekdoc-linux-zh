- pgno: 42
  md: "Security Enhanced Linux (SELinux) - https://selinuxproject.org/\nhttps://access.redhat.com/documentation/en-us/red_hat/html/selinux/index\n\
    \n+   - Provides an extra layer of security in Linux systems\n- Loads as a kernel\
    \ module, gets a pseudofsystem mount point like /proc\n- Restricts access by subjects\
    \ (users, processes) to objects (files) by using labels for them\n- Separates\
    \ users into 'confined domains', and one sandbox for everything else (unconfined_),\n\
    i.e., 'httpd' and 'ntpd' have their own sandboxes that are isolated from each\
    \ other\n- If a targeted process tries to access resources outside its confined\
    \ domain, access is denied and it is logged.\n- Provides mandatory access controls\
    \ (MACs) to extend the Linux discretionary access controls (DACs)\n- MAC-based\
    \ checks happen after the DAC-based checks\n- Security labels every object in\
    \ the system, attaching SELinux \"labels\"\n- An 'access vector cache' (AVC) stores\
    \ decisions (allow/deny) to speed up performance during runtime\nSide note: a\
    \ special pass about SELinux it doesn't install managers (1) This will some: sepolicy\
    \ manage -a -p\n/usr/share/man/man8 it never been resolved for over a decade or\
    \ now.\n\n# Basic Concept\n\nThis is the foundation of SELinux. Given these context,\
    \ subjects (processes) and objects (files), resources to define security relations\
    \ between them.\n- Applied, context by subjects (processes) and objects (files),\
    \ resources to define security relations between them.\n\"objects\" can be devices,\
    \ network interfaces, addresses, ports, sockets (and many defined in /proc)\n\
    - Rules dictate access by specifying permissions between subject types (domains)\
    \ and object types. They determine whether a subject is a confined object or is\
    \ denied access based on its own contexts.\n\nSecurity Levels: MCS and MLS (optional\
    \ security enhancements)\n\nThese are optional. If you don't change them they\
    \ will by using default values (usually not a concern).\n- Multi-Category (MCS):\
    \ Utilizes functional or departmental categories for access control within an\
    \ organization.\n- Multi-Level (MLS): Utilizes clearance levels or sensitivity\
    \ levels (Bell-La Patodia model)\nSince these are mostly optional, they will be\
    \ covered in this chapter. These also get installed after type enforcement.\n\n\
    # SELinux Modes\n\n+   - Multiple modes of SELinux functionality can be applied\
    \ on a system:\n- permissive - permission is granted, but are logged to /var/log/messages\
    \ (for testing)\n- enforcing - strictly enforces 'targeted policy' (default)\n\
    - disabled - only basic DACs are used\n\nUsing getenforce simply reports current\
    \ mode: enforcing, permissive, or disabled; sestatus gives more details:\n\n```\n\
    # sestatus\nSELinux status: enabled\nSELinux mount: SELinux\nCurrent mode: enforcing\
    \ --- current mode of operation\nMode from config file: permissive --- mode set\
    \ by /etc/sysconfig/selinux\n```\n\nTo change temporarily, setenforce 0 (permissive)\
    \ or setenforce 1 (enforcing) -or \"echo 1 > /selinux/enforce\"\n set the persistent\
    \ mode, edit the /etc/selinux/config (symlink to /etc/sysconfig/SELinux)\n\n```\n\
    >>> cat /etc/sysconfig/config\n# SELlinux can take one of these three values:\n\
    # enforcing - SELinux security policy is enforced.\n# permissive - SELinux prints\
    \ warnings instead of enforcing.\n# disabled - SELinux policy is loaded.\nSELinux=enforcing\n\
    # SELinux=can take one of these values:\n# targeted - Targeted processes are protected.\n\
    # minimum - Modification of targeted policy. Only selected processes are protected.\n\
    # mls - Multi Level Security protection.\nSELINTYPE=targeted\n```\n\nGenerally\
    \ advice is disabled SELinux. Some installations may call it, but permissive mode\
    \ should usually be enough.\nIf disabled, temporarily or to make changes to non-critical\
    \ items you, generally recommend restart after setting selinux\nin /etc/sysconfig/selinux\
    \ so it will affect effect checking/reloading (the system with switching from\
    \ enforcing to disabled)\nOn startup, service de also reads the switch, so what\
    \ matters for SELinux is in grub:\n  kernel/vmlinux-2.6.32-279.x86_64 root=/dev/md3\
    \ selinux=1 enforcing=0\nLinux=0 is disabled, it is enabled, and with the enforcing\
    \ setting, permissive is 0 and 1 is enforcing\n\nSELinux mode changes: setforce,\
    \ getforce, sestatus"
