    | --ask-vault-pass | Ask for password |

    | | Vault identity to use |

    | --vault-password | Vault password file |

    | --syntax-check | Perform a syntax check on the playbook, but do not execute
    |

    | -C, --check | Don''t make changes; instead, to predict some of the changes that
    may occur |

    | -D, --diff | When changing files, show differences in these files; --check |

    | -B, --back <SECONDS> | Run on retry, failure after X seconds (default=0) |

    | -P, --poll <POLL_INTERVAL> | Set the poll interval if -b (default=15) is ''fire''
    and fast |

    | -a, --args <MODULE_ARGS> | Module arguments |

    | -E, --extra-vars | Set additional variables as key-value or yaml/json, if filename
