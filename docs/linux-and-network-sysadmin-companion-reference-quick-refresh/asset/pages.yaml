- pgno: 192
  md: '# Stub Areas


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_192_0.png)


    In this next example, R2 and R3 share a stub area. Instead of propagating external
    routes (type 5 LSAs) into the area, the ABR injects a 3 LSA containing a default
    route into the stub area. This ensures that routers in the stub area will be able
    to route traffic without having to maintain all of the individual external routes.
    Because external routes are not received by the stub area, ABRs also do not forward
    type 4 LSAs from other areas into the stub.


    For an area to become a stub, all routers belonging to it must be configured to
    operate as such. Stub routers and non-stub routers will not form adjacencies.


    ```

    Router(config-router)# area 10 stub

    ```


    This idea of substituting a single default route for many specific routes can
    be applied to internal routes as well, which is the case of totally stubby areas.


    # Totally Stubby Areas


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_192_1.png)


    Like stub areas, totally stubby areas do not receive type 4 or 5 LSAs from their
    ABRs. However, they do not receive type 3 LSAs; all routing out of the area relies
    on the single default route injected by the ABR.


    A stub area is extended to a totally stubby area by configuring all of its ABRs
    with the no-summary parameter:


    ```

    Router(config-router)# area 10 stub no-summary

    ```'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# # Not-so-stubby Areas


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_193_0.png)


    NSSA makes use of type 7 LSAs, which are essentially type 5 LSAs in disguise.
    This allows an ASBR to advertise external links to an ABR, which converts the
    type 7 LSAs into type 5 before flooding them to the rest of the OSPF domain.


    NSSA can function as a stub or totally stubby area. To designate a normal (stub)
    NSSA, all routers in the area must be so configured:


    ```

    Router(config-router)# area 10 nssa

    ```


    Type 3 LSAs will pass into it, and type 1, 2, and 4. Unlike a normal stub area,
    the ABR will not inject a default route into an NSSA unless explicitly configured
    to do so. Traffic cannot be routed to external destinations without a default
    route, you''ll probably want to include one by banging default-information-originate
    (thanks to Adam for pointing this out).


    ```

    Router(config-router)# area 10 nssa default-information-originate

    ```


    To expand an NSSA as a totally stubby area, eliminating type 3 LSAs, all of its
    ABRs must be configured with the no-summary parameter:


    ```

    Router(config-router)# area 10 nssa no-summary

    ```


    The ABR of a totally stubby NSSA (or not-totally-stubby area, if you) injects
    a default route without any further configuration.


    # # Summary


    +   - **Standard areas** can contain LSAs of type 1, 2, 3, 4, and 5, and may contain
    an ASBR. The backbone is considered a standard area.

    - **Stub areas** can contain type 1, 2, and 3 LSAs. A default route is substituted
    for external routes.

    - **Totally stubby areas** can only contain type 1 and 2 LSAs, and a single type
    3 LSA. The type 3 LSA describes a default route, substituted for all external
    and inter-area routes.

    - **Not-stubby areas** implement stub or totally stubby functionality yet contain
    an ASBR. Type 7 LSAs generated by the ASBR are converted to type 5 by ABR to be
    flooded to the rest of the OSPF domain.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# EIGRP - Enhanced Gateway Routing Protocol


    - A "balanced hybrid" routing protocol, instead of link-state/distance vector.
    Sometimes "adv distance vector"

    - Sends routing table once, and uses partial updates for changes

    - Updates multicast 224.0.0.0, and the unicast IP of the neighbor EIGRP messages
    that are not received

    - Reliable Transport Protocol (RTP) to send - respond any update if specific.

    - For route poisoning (a route that has "failed" to either run or stop over the
    route); EIGRP uses 232-1 as "infinity" (over 4 billion), some IOS versions use
    up to 256-1 (over 10,000 trillion)


    EIGRP default are 5 and 15 seconds for Hello and Hold Intervals (Hold default
    3 Hello interval) Not required, but they should be the same for stability.


    For Neighborhood: same configured autonomous system number (ASN), the source IP
    in the Hello must be from same subnet as the interface, matching K values, and
    pass authentication process needed.


    3-steps when a router first joins a network, 3 tables to populate


    +   - Neighbor discovery: Hello messages discover neighboring EIGRP routers to
    add to neighbor table.

    - Topology exchange: Exchange full topology update, only partial updates as needed
    on changes

    - Routing table: Analyzes topology tables, lowest-metric route to each subnet


    Reported Distance (RD) and Feasible Distance (FD), Routing and Topology Tables

    - Reported/advertised distance (RD) is how a neighbor says it is from a remote
    network.

    - Feasible distance (FD) is what you find by adding that and how far away neighbor
    is.

    - The route with the lowest FD is the route you find - it''s the best candidate
    route.


    D 10.0.0.0/8 194560 172.16.10.2/32 00:27, Serial0

    D (DUAL) is the EIGRP advertised distance to 10.0.0.0/8 via 172.16.10.2.

    The (FD) is the EIGRP advertised distance of the routing protocol, which is the
    second feasible distance

    - the entire cost for your router to get 10.0.0.0/8 through that, 219546

    - The neighbor has a reported (advertised) distance (RD) between it and network
    10.0.0.0/0

    - Feasible Distance (FD), or total cost to that adds RD to the calculated distance
    to that router.


    Successor Routes and Feasible Successors

    Each router keeps information about adjacent neighbors in the neighbor table and
    the topology table hold all destinations advertisedised by the neighbors, with
    associated distance and metrics. That best path is called a successor route, and
    it is

    determined by which path has the lowest Feasible Distance.


    Also elected is a backup "feasible successor" route, which is kept in the topology
    table if they are needed. If a nonsuccor route''s RD is less than the FD of the
    successor, the route is a feasible successor route.

    Router has 3 routes/paths to get to Router A/ Subnet1


    | Router Neighbor Table: | Router E Routing Table |

    | Next Hop FD RD | Subnet 1 Metric 14,000, Through D |

    | Router B - 19000 | 15,000 | |

    | Router C - 17500 | 13000 < RD FD makes it |

    | Router D - 14000 | < FD FD makes it |


    The FD will determine the Successor, and Router D wins with a FD of 14000. You
    might think that the

    ext smallest FD would be the winner, right? Absolutely not. In the case of a Feasible
    Successor, we look at the Successor

    Route FD and a Reported Distance that is smaller than that. Router C wins as Feasible
    Successor by the rule

    it''s FD 13000 < FD of the Current Success at 14000.


    Verifying EIGRP - The Configuration and the Neighbor, Topology and Routing Tables

    show ip eigrp interfaces

    show ip eigrp detail

    show ip eigrp topology subnet/prefix

    show ip protocols

    show ip route

    show ip eigrp

    show ip neighbors

    show ip eigrp subnet mask

    show ip ip interfaces type number

    show ip route | section subnet'
  merge: -1
  img_proc: true
- pgno: 195
  md: "# EIGRP Metric Calculations\n\nMetric = $\\left(\\frac{10^8}{least-bandwidth}\\\
    right) + \\text{cumulative-delay} \\times 256$\n\nIn this formula, the term least\
    \ bandwidth represents the lowest-bandwidth link in the route, using a unit of\
    \ Kbps. For instance, if the slowest link in a route is 10Mbps Ethernet, the first\
    \ part of the formula is $10^8 / 10^4$, which equals 1000. If you use $10^4$ in\
    \ the formula 10Mbps is equal to 10000 Kbps (10 Kbps)\nCumulative-delay is the\
    \ sum of delay values for all outgoing interfaces in the route, in tens of microseconds\
    \ (usec) (most show commands, showing eigrp topology and interfaces, list in duencies)\n\
    You can set both bandwidth and delay for each link and delay commands.\n\n# A\
    \ Simple Example\n\nR1 learns about 10.13.0.24 from R2's update min. BW of 100,000\
    \ Kbps, and delay of 100 $\\mu$sec.\nR1's S1 has an interface bandwidth of 5544\
    \ Kbps and a delay of 2560\n-1.544 Mbps < 100,000 Kbps, or 100 Mbps. R1 needs\
    \ to use this slower bandwidth in the calculation, (data being squared down to\
    \ a smaller value).\nFor internal delay, the router adds its interface delay to\
    \ the delay listed in the EIGRP Update.\nThe update lists 100 units (tens of $\\\
    mu$sec).\nAdded R1's S1 is 2000 (tens of $\\mu$sec).\nMetric = $(10^8 / 5544)\
    \ + (200 \times 256) = 272416$\nLater - it is revisited, for Reported Distance\
    \ that R1 was FD for R2's calc at 272416; and the RD from R2 to 28\nMetric = $(10^8\
    \ / 100000) + (100 \times 256) = 28160$. So FD for R2's calc at 272416; and the\
    \ RD from R2 to 28160\nOn R1, it is listed in the ip route list with the AD/FD:\n\
    \n+   - D 10.13.0.24 [90/272416] - IP address for R2's Serial (ports)\ns ip route\
    \ might have some metric here, which shows the FD/RD\n- P 10.13.0.24, 1 successors,\
    \ FD 272416 (272416/28160), Serial/0\n\n# The Equation\n\nMetric = $[K1 \\times\
    \ [K2 \\times \\text{Bandwidth}] / [\\text{Delay} - K3] + [K5 \\times \\text{Reliability}\
    \ + K4]]$\n\n| K1 | |\n|---|---|\n| Bandwidth | lowest = bandwidth of the links\
    \ along the path - [1000000 / Kbps] * 256 |\n| K2 | |\n| K3 | Delay (Dc) = sum\
    \ of all the delays of the links along the path - [in tens of $\\mu$sec] * 256\
    \ |\n| K4 | Reliability (r)|\n| K5 | |\n\n- K values are multiples of the metric\
    \ calculation. Default values are K1=1, K2=0, K3=1, K4=0, K5=0.\n- K1 and K3 are\
    \ static. K2, K4, and K5 are variable, and we just get overhead calculating them\
    \ and reporting them if they are on. MTU is exchanged between EIGRP neighbors\
    \ but not. By default only K1 and K3 are enabled and we don't use K2 or (K4).\
    \ (only bandwidth and delay are used in the formula)\n\n# Serial Links and a Special\
    \ Problem\n\nSerial links default to 15444 and a delay of 20,000 $\\mu$sec. A\
    \ 64 kb serial link's bandwidth command is used to reflect the correct speed (instead\
    \ of the 1544)\n\n# EIGRP Configuration Commands\n\nrouter eigrp number\nnetwork\
    \ address [wildcard-mask] (address should match an int, and other wildcards are\
    \ unavoidable)\nrouter eigrp id value\nip hello-interval asrp time number\n [interfaces]\
    \ ip hold-time asrp time variance\n [interfaces] bandwidth value auto-summary\n\
    \ [interfaces] delay value\n\n# Failed Routes, DUAL Query and Reply to Routing\
    \ Table\n\nWhen a route fails, and there is no feasible successor, EIGRP uses\
    \ Diffusing Update Algorithm (DUAL) to choose a replacement. DUAL sends queries\
    \ for a loop-free route, and when it's found, DUAL adds to the routing table.\
    \ Messages confirm that a route exists, and would not create a loop. In networks,\
    \ convergence can still occur in more than 10 seconds."
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Basic IGP Routing in IPv4


    The three types of routing are static (in which routers are manually configured
    by the CLI), dynamic (in which the routers share routing information via a routing
    protocol), and default routing (in which a special route is configured for all
    traffic without a more specific destination network found in the table)


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_196_0.png)


    Basic layout to setup

    Central1 - in diagram is CORP

    Serial 0/0: 172.16.10/30

    Serial 0/1: 172.16.10.5/30

    Fa0/0: 10.10.10.1/24


    DFW - in diagram is SF

    S0/0: 172.16.10.2/30

    Fa0/0: 192.168.10.24


    HOU - in diagram is LA

    S0/0: 172.16.10.6/30

    Fa0/0: 192.168.20.24


    # Basic Local IPv4 Routing (Direct Connections)


    Every interface below should have "no shutdown" added. It has been removed for
    brevity

    Router(config)#hostname Central1

    Central1(config)#interface f0/0

    Central1(config)#description to LAN

    Central1(config)#ip address 10.10.10.1 255.255.255.0

    Central1(config)#interface s0/0

    Central1(config)#description WAN connection to DFW

    Central1(config)#ip address 172.16.10.1 255.255.255.252

    Central1(config)#interface s0/1

    Central1(config)#description WAN connection to HOU

    Central1(config)#ip address 172.16.10.5 255.255.255.252

    Central1#show controllers s0/0


    Interface Serial0/0

    Hardware is PowerQUICC MPC860

    DTE V.35 TX and RX clocks detected.

    Remember to set clock rates at the DCEs!


    ```

    Router(config)#hostname DFW

    DFW(config)#interface s0/0

    DFW(config)#description WAN connection to Central

    DFW(config)#ip address 172.16.10.2 255.255.255.252

    DFW(config)#clock rate 1000000 - DFW''s DCE to Central''s DCE -we need a clock
    rate!

    DFW(config)#interface s0/1

    DFW(config)#description DFW LAN

    DFW(config)#ip address 192.168.10.1 255.255.255.0

    ```


    ```

    Router(config)#hostname HOU

    HOU(config)#interface s0/0

    HOU(config)#description to Central1

    HOU(config)#ip address 172.16.10.6 255.255.255.252

    HOU(config)#clock rate 1000000 - HOU''s DCE to Central1''s DCE -we need a clock
    rate

    HOU(config)#interface f0/0

    HOU(config)#ip address 192.168.20.1 255.255.255.0

    HOU(config)#description LAN

    HOU(config)#show ip route *

    ```


    # Static Routing: Manually Adding to Routing Table


    ```

    Router(config)#ip route 172.16.3.0 255.255.255.0 192.168.2.4

    172.16.3.0 is the remote network, and 255.255.255.0 is it''s mask of the remote
    network.

    192.168.2.4 is the next hop that will be sent to. Can also be the interface out
    of it.

    ```'
