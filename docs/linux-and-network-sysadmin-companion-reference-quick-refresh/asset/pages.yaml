- pgno: 206
  md: '# BGP Path Attributes - Manipulating Path Selection


    Routes learned by BGP have properties as BGP attributes, and an understanding
    of how influence route selection is required for the design of robust networks.


    | PA | Description | Route Direction |

    |---|---|---|

    | NEXT_HOP | Next-hop address used to reach a prefix. | N/A |

    | Weight[1] | Range: 0-255, set when receiving updates. Not advertised to any
    BGP peers. Cisco proprietary. | Outbound |

    | LOCAL_PREF | Range: 0-32767, set when receiving updates to influence the choice
    of best route for all routers in an AS | Outbound |

    | AS_PATH (length) | The number of ASNs in the AS_PATH. | Outbound, Inbound |

    | ORIGIN | Value implying the route was injected into BGP; I (IGP), E (EGP), or
    (?). | Outbound |

    | Multi-Exit Discrim (MED) | Set and advertised metric in an AS, impacting the
    BGP decision of the other AS. Smaller is better. | Inbound |


    +   Four categories of attributes exists as:

    - **Well-known mandatory**: Must be recognized by all BGP routers, present in
    all BGP updates, and passed to other BGP routers. For example, AS path, origin,
    and next.

    - **Well-known discretionary**: Must be recognized by all BGP routers and passed
    to other BGP routers but need not be present in updates; for example, local preference.

    - **Optional transitive**: Might not be recognized but passed to other BGP routers.
    If not recognized, it is marked as partial, for example, aggregator, community.

    - **Optional non-transitive**: Might not be recognized by a BGP router and not
    passed to other routers, for example, Multi-Exit Discriminator (MED), originator.



    # BGP Path Selection Criteria


    +   1. Highest weight (local)

    2. Highest LOCAL_PREF (inside an AS is this)

    3. Choose routes that router originated (next-hop = 0.0.0.0)

    4. Shortest AS_PATH

    5. Lowest origin typecode - (i)IGP is lowest, (e)eBGP is lowest, and is ?

    6. Lowest metric of the same AS advises the possible routes)

    7. eBGP wins over any IGP route.

    8. Nearest IGP metric (lowest IGP metric)

    9. Oldest route (for eBGP to minimize the effects of route flapping)

    10. Lowest router ID.

    11. Lowest IP address.



    BGP only chooses one route as the best route (this, no load balancing). Step 1,
    2, and 4 are typically used to influence outbound, while for outbound routes.
    9, 10 and 11 aren''t used in a tie

    Mnemonic: N WILLAOMI


    | Step | Mnemonic Letter | Short Phrase | Which Is Better? |

    |---|---|---|---|

    | 0 | N | Next hop: reachable | If no route to reach Next_Hop, router cannot use
    this. |

    | 1 | W | Weight | Bigger weight. |

    | 2 | L | LOCAL_PREF | Locally injected routes | Locally injected ''network''
    is better than BGP/eBGP learned. |

    | 4 | A | AS_PATH length | Smaller paths win |

    | 5 | O | ORIGIN | Prefer i over E, E over ? |

    | 6 | M | MED | Multi-Exit Discriminator (MED) | Prefer e over i. |

    | 7 | N | Neighbor type | eBGP wins over IGP. |

    | 8 | I | IGP metric to Next_Hop | Smaller metric is used, considered tie. |

    | 9 | A | Age seniority | Oldest eBGP route |

    | 10 | O | think not OSPF | Route with lowest BGP RID |

    | 11 | S | think not OSPF | Route with lowest neighbor IP address |'
