  md: '# Process Management


    - Typing ctrl-z stops and places in the background, type bg to resume

    - Type jobs -l to see it listed as running (lists all background jobs)

    - Executing fg <job> with the number it is listed will bring it to the foreground

    - dd if=/dev/zero of=/null - Copying nothing to nowhere;

    - The & sends it to the background without having to stop and resume


    [A "shell job" is any command run from the shell. Processes to the shell from
    which they were started]

    nohup <test >test.output — makes process running when terminal/tty has been closed

    (means to run without attaching to process parental)


    Kill Signals

    kill -9 <PID> - brute-force terminate process

    kill <program-name> - affects all processes running


    | Num. | Name | Default Action | Description |

    |---|---|---||

    | 1 | SIGHUP | terminate process | Terminal hang- restarts the process. After
    doing so, the process will keep the PID that it had before. Useful for restarting
    a service after making changes to a configuration file. |

    | 2 | SIGINT | terminate process | Interrupt process - as ctrl-c key sequence
    |

    | 3 | SIGOUT | create core image | Quit program |

    | 4 | SIGABRT | create core image | Abort program (formerly SIGIOT) |

    | 9 | SIGKILL | terminate process | Brute-force; process will not clean up - resources
    allocated may remain allocated until the system is restarted |

    | 15 | SIGTERM | terminate process | Default allows process to clean up exiting


    CPU Priority

    "Niceness" for CPU priority - remember -20 is highest priority and 19 is the lowest.
    Default is 0

    - Use nice for starting programs: nice -19 /test.sh sets to 19 (or PID) - is not
    19, which would be set with ~19

    - Use nice for adjusting currently running processes: nice <priority> -user (or
    PID)

    - nice -1234 changes the value of the job with process is 1134 to 17; no dash
    for command option

    - Modify the priority of all processes that belong to a group or user with the
    -g and -u (instead of -p for process)

    - It is recommended changing nice values in steps of -5 at a time

    - Only root can apply negative nice values

    - You can set the nice value of a user or group in the /etc/security/limits.conf

    - It uses this syntax: [ username ] [ hard | soft ] priority [ nice value ]nuser1
    hard priority 1


    The -n value differs between nice and renice

    - In nice, the -n option adjusts the value from (0) and the "-" will work as minus.

    - Increase the priority: nice -5 /test.sh - Decrease the priority: nice 5 /test.sh

    - So using the -n makes it confusing with the whole issue of whether it is a minus
    or a simple hyphen

    - In renice, the -n option specifies the actual number so renice -n -19 -n 3534
    sets the value to -19

    If you have to miss with nice not, then it is sign to increase system resources
    (RAM, but primarily CPU) to handle the load on the server'
