- pgno: 173
  md: "# Cisco Proprietary: HSRP - Hot Standby Redundancy Protocol\n\n| interface\
    \ vlan10 | Make VLAN an - activate virtual interface (SVI) |\n| ip address 172.16.0.10\
    \ 255.255.255.0 | Assigns IP address and netmask. |\n| standby 1 172.16.0.1 [secondary]\
    \ | Activates HSRP group 1 and creates virtual IP address of 172.16.0.1 If interface\
    \ has HSRP IP addresses, you can add secondary to HSRP with a redundant standby\
    \ gateway address. |\n| standby 1 120 | priority value of 120 to standby group\
    \ 1. |\n\n+   - Group number can from 0 to 255. The default is 0.\n- Some Catalyst\
    \ switches limit to 16 group numbers: just make the group number the same (that,\
    \ is, 1) for VLAN interface. HSRP groups areにつき only on an interface: HSRP group\
    \ 1 on interface VLAN 10 is unique and independent from HSRP group 1 on interface\
    \ VLAN 11.\n- The actual interface and the virtual (standby) address and priority\
    \ must be configured in the subnet.\n- - priority default, which will result in\
    \ that switch being elected the active switch.\n- If priorities of all switches\
    \ in the group are equal, the switch with highest HSRP priority becomes active.\n\
    - HSRP hello - multicast 224.0.0.2 ('all routers') -- UDP port 985.\n- Only the\
    \ router (with the second-highest priority) monitors messages from the active\
    \ router.\n- Decreasing hello time allows a router to be detected more quickly,\
    \ which increases traffic on the router.\n- Router interface waits before becoming\
    \ active:\n\nDisabled -> Init -> Listen -> Speak -> Standby -> Active HSRP defines\
    \ the MAC address in the form 0000.0c07.axx, where xx represents the group number\
    \ as a two-digit hex value (Group 1 appears as 0000.0c07.ac1, Group 16 appears\
    \ as 0000.0c07.ac11).\n\n| show standby | Displays brief-line output of each standby\
    \ group |\\ | Displays HSRP information on the VLAN 1 group |\n\n| Defaults for\
    \ HSRP |\n| HSRP version | Version 1 (v1 and v2 have different packet structure)\
    \ |\n| HSRP groups | None configured |\n| standby group number | 0 |\n| standby\
    \ MAC address | System assigned as 0000.0c07.axx, XX is the HSRP group number.\
    \ For HSRP2, the MAC address will be 0000.0C9F.FXXX. |\n| standby priority | 100\
    \ |\n| standby delay | (no delay) |\n| standby track interface priority | 10 |\n\
    | standby hello time | 3 seconds |\n| standby holdtime | 10 seconds\n\nPreempt\
    \ - switch will take control of the active switch if local priority is higher\
    \ than priority of active switch\n\n| interface vlan10 | Designate this to preempt\
    \ |\n| standby 1 preempt delay minimum 180 reload 140 | Set preempt to 180 sec\
    \ since last was restarted or 140 sec since switch was reloaded |\\ standby delay\
    \ minimum 30 reload 60 | Delay for HSRP group initialization 30 sec when interface\
    \ comes up and 60 sec after reloads. |\n no standby 1 preempt delay | Disables\
    \ the preempt option | no standby 1 preempt | Disable the preempt option completely\n\
    \nIf a router is not already active, it cannot become active again until the current\
    \ router fails - even if its priority is higher than that of the active router.\
    \ When routers are being powered up or to a network, the first to bring up its\
    \ interface becomes the HSRP active router, even if it has the lowest priority\
    \ of all. This is setting preempt comes to the rescue.\n- Use reload to force\
    \ router to wait after it has been reloaded or before preempt (you should consider\
    \ and allow time for routing protocols (e.g.) that need to converge). Then after\
    \ interface is ready for HSRP."
