    Using to manage Mountpoints, Sockets, Devices Just Like Services

    The general systemctl commands that work with services do the same thing for mountpoints,
    sockets, and devices (which are as services). Simply specify in the name of "name.service"
    the proper item, as tmp.mount, cups.socket, or item.device. The list-unit files
    option uses the --type directive such as --type=device or --type=socket. Starting
    a mounting point mounts units and all mountpoints for #list-unit-files --systemctl
    list-unit-files --all mountpoints, for


    # systemctl [start | restart | reload | status | is-active | enable | disable
    | is-enabled | mask | unmask] tmp.mount


    | How to enable, disable or check if on boot (auto start) | # systemctl [is-active
    | enable | disable] http.service |

    | How to mask (making it impossible to stop) or unmask a service | # systemctl
    [mask | unmask] http.service |

    | List all services (enabled and disabled). | # systemctl list --type=service
    |

    | Start, stop, reload and check the status of a service | # systemctl [start |
    restart | reload | status] httpd.service |

    | Check all the dependencies of a service | # systemctl show httpd |

    | Get a list of dependencies for a service | # systemctl list-dependencies httpd.service
    |


    How to Kill a service using systemctl command.

    is it active or not running? ("active" is for for the target)


    | Get current CPU Shares of a service (default CPUShares = 1024) | # systemctl
    show -p CPUhares httpd.service |

    | Increase/decrease CPU share of a service | # systemctl set-property CPUhares=2000
    |

    | No unit specified fields default-target. Requires=, RequiresOverride=, Wants=,
    BindsTo=dependencies | # systemctl-gl |

    | List control groups hierarchically | # systemctl-cgroups |

    | List control groups by CPU, memory, Input and Output | # systemctl-cgtop


    To enable a service, you must be running the target you want the service to start.

    For example, on bluetooth.service in the graphical.target, you have to change
    the target first with isolate, then run enable.

    systemctl isolate graphical.target /etc/system/graphical.target.wants/bluetooth.service
    pointing to /usr/lib/systemd/system/bluetooth.service


    | How to start rescue mode | # systemctl rescue |

    | How to enter emergency mode. | # systemctl emergency |

