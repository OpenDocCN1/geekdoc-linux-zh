- pgno: 166
  md: "# Cisco's Port Aggregation Protocol (PAgP) and Link Aggregation Control Protocol\
    \ (LACP) - 802.3ad\n\n+   - Combines multiple parallel segments of equal speed\
    \ into EtherChannel (single interface)\n- Multiple segments of equal speed up\
    \ to 8 links.\n- Prevents STP convergence when only a single failure occurs; at\
    \ least one up, no STP convergence\n- Aggregated links load balancing on switches\
    \ (better use of bandwidth)\n\nCreate the port-interface, exit, then enter interface\
    \ config for ports and add them with a mode:\n\n```\nCat2950(config-if)# port-channel\
    \ 1 <exit>\nCat2950(config-if)# interface fa0/2\nCat2950(config-if)# channel-group\
    \ 1 mode\n```\n\n+   PAgP: channel-group 1 mode (desirable | auto)\nLACP: channel-group\
    \ 1 mode (active | passive)\nManually run with channel-group mode has no encapsulation;\
    \ \"on\" on both sides\n- One must be desirable or active to get the other to\
    \ begin negotiations (like trunks)\n- Number must remain the name of the switch\
    \ device. Another device could call it 4 or 5\n\nThree terms as synonyms: EtherChannel,\
    \ PortChannel, and Channel-group.\nThe channel-group configuration\nshow etherchannel\
    \ status of \"PortChannel\" instead of EtherChannel or channel-group\nshow spanning-tree\
    \ also Port-channel\n\n# Misconfiguration of channel-group commands:\n\n+   -\
    \ All members of a switch's specific interface needs to be using the same channel-group\
    \ number.\n- The neighboring switches can refer to that etherchannel as any number\
    \ they want (and no encapsulations).\n- If using the \"desirable\" keyword, it\
    \ must be PAgP and the other must use either \"desirable\" or \"auto\".\n- If\
    \ using \"active\" keyword, it's LACP; the other must use either \"active\" or\
    \ \"passive\".\n- No \"auto\" or \"passive\" key on switches? Then both wait for\
    \ the other to begin negotiations.\n- Don't mix LACP and PAgP commands on one\
    \ end or the other - the protocols do not match\n\nshow etherchannel [chan-group\
    \ f] | detail | port-channel | summary\n\n```\nSW1# show etherchannel 1 summary\n\
    Fs: D - down          P - bundled in port-channel\n   I - stand-alone s - suspended\n\
    \   H - Hot-standby (LACP only)\n   R - Layer3           S - Layer2\n   U - in\
    \ use           f - failed to allocate aggregator\n   M - not in use, minimum\
    \ links not met\n   u - unsuitable for bundling\n   w - waiting to be aggregated\n\
    \   d - default port\nNumber of channel-groups in use: 1\nNumber of aggregators:\
    \ 1\nGroup Port-channel Protocol Ports\n1 Po(SU) Fa0/14 (P) Fa0/15 (P)\n```\n\n\
    The show etherchannel summary command. The D code means that the channel itself\
    \ is down, with S meaning a Layer 2 EtherChannel. The bottom shows PortChannel(Po1)\
    \ as L2 EtherChannel in a down state (S)\n\"Down\" only refers to the EtherChannel\
    \ state - the two physical interfaces are connected (sh int status)\n\n# Configuration\
    \ Checks for EtherChannel\n\n+   Things need to be compatible. Watch for common\
    \ sense (no shutdown, speed, duplex)\n- Operational access or trunking state (all\
    \ must be access, or must be trunks)\n- On an access port, check the access VLAN;\n\
    - Trunk port? Check allowed VLAN list - switchport trunk allowed also the native\
    \ VLAN\n- Check STP interface settings (e. cost)\n\n![](img/4541d1f2c9832b9303a6df6c929f86f6_166_0.png)"
  merge: -1
  img_proc: true
