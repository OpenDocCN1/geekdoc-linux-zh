- pgno: 122
  md: '# # The OSI and DARPA TCP/IP Networking Models


    DEC/IBM (SNA) in 1980s, to 90s when TCP/IP prevailed and overook the OSI model

    The TCP/IP model is not a top-down comprehensive design reference - the purpose
    is illustrating the logical groups and scopes of functions needed. In general,
    direct or strict comparisons of the OSI and TCP/IP models should be avoided, because
    the layering in TCP/IP is not a principal design criterion. It is easier to understand
    the interaction of the various technologies.


    OSI Networking Model (DARPA''s TCP/IP stack remains, but with osi terminology)


    The DoD''s Application layer is split into 3 layers in the OSI. Transport is often
    still Hosted-to-Host in the DoD model, and it calls the network layer the Internet
    layer

    Finally, the Data and Physical layers are unified in the DOD model, and called
    the Network Access layer, as Network Interface, or Link layer.


    The OSI remains - the network stack is always referred to by its 7 layers. Additionally,
    layer 2 refers to data, and layer 4 for transport. The DOD model layers 5, 6,
    and 7 as one application layer.


    The TCP/IP and OSI stack are references of a layered architecture.


    Same-Layer Interactions are between two computers of the same layer (like HTTP
    to HTTP)

    Adjacent-Layer - A layer passes into neighboring layer (up or down) on the computer

    A layer''s data is referred to as Data Unit. Layer 2 is a L2DU, a IP packet is
    a L3DU, and a UDP or TCP segment is a LAPDU.

    An example of outgoing data, HTTP sends to TCP to put into a segment, then it
    sends to IP to pack up in a packet, and data-link frames it to go out as bits.
    Likewise, when a frame is pulled out of the incoming bits, the IP packet frames
    is unpacked, the segment to give to the adjacent transport, packed up the stack
    to be opened up, revealing a segment to give to the adjacent transport.


    | Source | Destination | Data |

    |---|---|---||

    | Packet | Source IP | Destination IP | Protocol | Segment |

    | Frame | Source MAC | Ether-Field | Packet | FCS |

    | Bits | 101101100011110000 |


    Layer 7 - Application Layer - Telnet, HTTP, FTP, SMTP, POP3, VoIP, SNMP. The OSI
    provides an interface between the communications

    software and applications that need to communicate outside the computer or on
    where the application resides. It also defines protocols for user authentication


    Layer 6 - Session Layer - ASCII, EBCDIC; de/compression, decompression and negative
    data formats, "

    standard data format." Includes JPEG, TIFF, GIF, PICT, MPEG, MIDI, etc. From a
    client to a server; three different modes:

    implex, half-duplex, and full-duplex. How to control, and end conversations (sessions).
    This includes the control

    of multiple bidirectional messages that can be associated with the transport layer''s
    port.


    Layer 4 - The Transport Layer - TCP, UDP, and SCTP handles how data sent/delivered
    over the network layer.

    The protocol, may provide for reliability, i.e., error recovery, and use flow
    control to prevent unnecessary

    congestion by sending data at a rate or at the rate that the network can accommodate.
    Multiplexing of data for different

    flows to applications on the same host is also performed (ports and sessions).
    Returning of the incoming data stream when

    packets arrive out of order.


    The Network Layer (Layer 3) defines end-to-end delivery of packets and facilitates
    access to accomplish this. It also

    defines how routing works and how routes are learned; and how to fragment a packet
    into smaller packets to accommodate media

    width with smaller transmission unit sizes. Examples include: IP, IPX, and ICMP.
    Both IP and IPX define logical addressing,

    routing the routing of information, and end-to-end rules.'
