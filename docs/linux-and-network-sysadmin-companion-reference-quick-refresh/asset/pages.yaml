- pgno: 30
  md: '# # The ifconfig Command


    This command is deprecated in Linux, but it is important to keep sharp when working
    with Solaris, AIX, HP-UX, BSD, and SCO UNIX.


    +   - Without arguments it will display all active interfaces, -a to also list
    inactive ones

    - You can specify the interface to view, like ifconfig eth0

    - Bring interfaces up or down with ifconfig eth0 up (or down) or ifup eth0 - (or
    if)

    - (note-routes to interfaces disabled with ifconfig and ifdown are not automatically
    disabled)


    **Changes with ifconfig NOT persistent after reboot**

    In BSD you may have to edit /etc/rc.conf

    In Linux edit appropriate interface file in /etc/sysconfig/network-scripts/


    +   **When you specify an interface, you can add these to its properties:**

    - Set an ip address with the syntax ifconfig eth0 172.16.25.125

    - Just like setting the address you can add mask 255.255.255.224 or broadcast
    172.16.25.63

    - Set an mtu mtu 1000

    - Change a MAC address with the "hw" argument - ifconfig eth0 hw 00:BB:DD:AA:FF

    - The states broadcast, multicast, and all can be turned off and on like prominent
    -promis

    - When considering capture packet, enter promiscuous mode with **promis** and
    disable with -promis

    - Similarly you can disable ARP - arp and re-enable it with arp

    - Adding an alias for an interface, but it adds rules on masks (see ifconfig adding)

    ifconfig eth0:172.16.25.127 - to disable alias simply bring it down ifconfig eth0:
    down

    note: some versions of ifconfig require the use of the config alias


    **delete** - Removes the specified network address. This is used when an address
    is incorrectly specified or when it is not longer needed. Increasing an ns address
    has the side effect of specifying the host portion of the network address. Removing
    all ns addresses allows you to re-specify the host address.


    **detach** - Removes an interface from the network interface list. If the last
    interface is detached, the network driver code is unloaded. In order for the interface
    route of an attached interface to be changed, that interface must be detached
    and added again with ifconfig.


    Other options:


    **group ID** and -group ID

    Adds/removes a group ID to the ID list (used in determining the value when forwarding
    packets that arrived on the interface.


    **metric <value>** - Sets the routing metric of the interface to the value specified
    by the Number variable. The default is 0 (zero). The routing metric is used by
    the routing protocol (the routed daemon). Higher metrics have the effect of making
    a route less favorable. Metrics are counted as addition hops to the destination
    network or host.


    **monitor -monitor**

    Enables/disables the underlying adapter to notify the interface layer of link
    status changes. The adapter must support link status notification. If multipath
    routing is used, alternate routes are selected when a link goes down.


    **checksum_offload** and **-checksum_offload

    Enables/disables the flag to indicate that TCP checksum should be offloaded to
    the adapter. Also resets the per-interface counter whether TCP checksum dynamically
    enable or disable offloading of checksum computation.


    The ifconfig command in Linux is part of the net-tools package, which has been
    deprecated (and not updated since April 2001). Other commands worked with ifconfig,
    ifdown, ifup, iwconfig, arp, route, iptunnel, ipaddrctl, brctl, etc. and even
    netstat were generally replaced with ip, ss, and in the iproute2 package, which
    has a separate section devoted to it.'
