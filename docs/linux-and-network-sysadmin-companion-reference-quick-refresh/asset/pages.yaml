- pgno: 126
  md: '# ICMP


    As it''s name implies, ICMP is a simple general messaging protocol, mostly about
    traffic stuff.


    IANA lists ICMPv4 and ICMP6 message types:

    http://www.iana.org/assignments/icmp-parameters/icmp-parameters.xml

    http://www.iana.org/assignments/icmpv6-parameters/icmpv6-parameters.xml


    From a network scanning perspective, the following types of ICMP messages are
    useful:

    Type 8 (echo) request a ping packets. Perform sweeping and identifying accessible
    hosts. Type 0 is the reply.

    Type 13 (timestamp request) get system time from host; in decimal, milliseconds
    since midnight GMT.


    # Common ICMP type 3 (destination unreachable) codes


    Firewalls and routers generate type 3 ICMP responses, providing insight into network
    configuration.


    +   1 - Host unreachable

    2 - Protocol unreachable

    3 - Port unreachable

    6 - Destination network unknown

    7 - Destination host unknown

    9 - Communication administratively prohibited (network)

    10 - Communication administratively prohibited (host)

    13 - Communication administratively prohibited (general)


    Cisco exams used to like mentioning "buffer full/source quench (deprecated Type
    3 msq 4)-router''s buffer for incoming datagrams is full.


    There is more on ICMP in the section about the PING and traceroute, since those
    also discuss TCP.


    ICMP error messages include a copy of the IPv4 header, plus at least the first
    8 bytes of data from the error-triggering frame. The length of ICMP error messages
    should not exceed 576 bytes. It is also intended to hold the type indicating the
    upper layers contained within.


    The ICMP field can be exploited, as in the "Ping of death", or large or fragmented
    ICMP packets are used for denial-of-service attacks. ICMP data can also be used
    to create covert tunnels for communication. There are more specific uses-encapsulation
    of IP packets into ICMP packets, leads to TCP session inclusion which opens the
    door for creative applications - there is also a telnet-like shell that can be
    opened.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Layer 2 - Data Link Layer


    ARP. MAC (IEEE 802.3, Ethernet, ISDN, FDDI, PPP, L2TP, HDLC) of a particular medium.
    Data link protocols also define the rules that determine when a device can send
    data over a header and trailer allows devices to successfully send and receive
    data.


    This layer transfers data between adjacent network nodes in a wide area network
    (WAN) or nodes on the same local area (LAN) segment. Frames do not cross the boundaries
    of a local network (these frames are encapsulated/replaced by new frames to the
    WAN). Internet routing and global addressing are higher-layer functions, allowing
    data link protocols to focus on local delivery, addressing and media arbitration
    (between parties contending for a medium, without collision). When devices attempt
    to use a shared medium, frames can occur. Data link protocols detect and recover
    from collisions, and provide mechanisms to prevent or reduce them.


    # Logical link sublayer


    The upper sublayer, LLC multiplexes protocols running at the link layer, and optionally
    provides flow control, acknowledgment and error notification. The LLC addressing
    and control of logical links between local devices: which are used for addressing
    over the transmission medium and controlling the data exchanged between the originator
    and recipient members. Basically provides services to the network layer and hides
    the rest of the data link layer. Is outlined by IEEE 802.2 - http://en.wikipedia.org/wiki/IEEE_802.


    # Media access sublayer


    The sublayer defines how to access the physical layer. Many methods use a shared
    medium (such as a single network cable, or series of cables that are electrically
    connected into a single virtual medium) it is necessary to have rules for managing
    the medium to avoid collisions. Examples include Ethernet''s CSMA/CD method of
    media access control, Token Ring avoidance. It also determines when one frame
    of data ends and the next one starts—frame synchronization. There are four means
    of frame synchronization: time-based, character counting, buffering and bit stuffing.


    MAC Services: physical addressing, channel-access control (CSMA/CD and CSMA/CA),
    LAN switching (packet switching), MAC filtering, Spanning Tree Protocol and Shortest
    Path Bridging (SPB), data packet queuing or scheduling, Store-forward switching
    or cut-through switching, Quality of Service (QoS) control, encoding schemes.
    It is outlined by IEEE 802.3 - http://en.wikipedia.org/wiki/IEEE_802.3


    # Network engineers have it easy


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_127_0.png)


    The MAC sublayer of layer 2 doesn''t have to deal with protocol stack inside with
    the gritty details of electrical properties of pins on connector, light modulation
    for fiber optics, things we never have to think about with the physical medium.


    Most networking classes never mention this—it is just ''layer 2 2nd half, layer
    1, da wire''. I guess they think it would make the students'' head explode or
    searching'
  merge: -1
