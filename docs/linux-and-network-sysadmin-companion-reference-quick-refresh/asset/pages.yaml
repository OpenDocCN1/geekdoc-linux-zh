  md: '# iostat - CPU and I/O Stats for Devices and Partitions


    iostat [option] [count]

    Interval times in seconds between each report, and count the number of reports
    generated before exiting.

    iostat **2 -5** - indicates a 2 sec interval, 5 iterations. If you don''t specify
    iterations it will run continuous.

    When run for the first time, the first report contains information since the system
    was built, while each subsequent report covers the period since the last report
    was generated, you may want to ignore the first.


    The first part of the normal output covers the CPU utilization, and should be
    self-explanatory from other tools like Top The two columns show %CPU time idle
    with an outstanding I/O request (lag waiting activity) and without an outstanding
    I/O request. If you only want to get this of the report, run iostat -c


    | Linux 2.6.31-17-generic (dt-laptop) | 03/24 | i686_0 (1 CPU) |

    |---|---|---||

    | avg-cpu: %user | %nice | %sys | %iowait | %rdq | %soft | %steal | %guest | %idle
    |

    | 25.99 | 0.08 | 7.43 | 12.77 | 53.03 |


    | Device: %util | Blk/s | Blk/wrt | Blk_read | Blk_wrt |

    |---|---|---|---|---||

    | sda | | 27.40 | 797.19 | 201.27 | 802208 |

    | sdb | 0.03 | 1.24 | | 0 | 1248 |


    The device has reports per second, number of blocks per second, number of blocks
    written, total of blocks read and total number of blocks written. When you use
    the -k (kilobytes) or -m (megabytes) to change the four columns to be expressed
    in human-readable terms instead of sectors for the only device report, run with
    iostat -k

    iostat -x gives stats in an extended report

    Adding a device identifier with a colon syntax will limit the report to the specified
    device

    In them it will show data on partitions, and -N gives LVM names and stats.

    For NFS use, iostat -n iostat -j activates inactive devices.

    Like anything, do output redirection to a file, or use awk to extract columns
    you need.

    Use /proc/stat, /proc/partitions, /proc/diskstats, /proc/self/mounts


    # mpstat - Multiprocessor Stats


    If you don''t specify a CPU, the CPU will show a global average of all of them.
    Specify with -P and put ALL to get stats on all CPUs.

    mpstat -P ALL


    | CPU | %user | %nice | %sys | %iowait | %rdq | %soft | %steal | %guest | %idle
    |

    |---|---|---|---|---|---|---|---|---||

    | 1:03:26 | all | 37.33 | 0.01 | 4.57 | 2.58 | 0.00 | 0.07 | 0.00 | 0.00 | 55.44
    |

    | 1:03:26 | all | 37.90 | 0.01 | 4.96 | 2.62 | 0.00 | 0.03 | 0.00 | 0.00 | 54.48
    |


    **mpstat -P 2 -5** - Like it with interval and count. The -P option shows reports
    for each processor, and -u shows CPU stats in case the other options are used.

    Easiest: **mpstat -A** is a quick and easy example of mpstat -u ALL


    pidstat 2 - five reports of CPU statistics for every active task in the system
    at two seconds.

    pidstat -r - for a focus on page page faults in memory statistics:


    | Time | UID | PID | minit | maxjit | VSZ | %MEM | Command |

    |---|---|---|---|---|---|---||

    | 1409816695 | 1000 | 3958 | 3378.22 | 0.0 | 707240 | 215972 | 5 | cinnamon |


    pidstat -d for disk I/O stats

    **pidstat -k 1643** for PID 1643 for all processes

    nEnter a string to match a process name like -http to start an executable with
    **pidstat -e <command>** to monitor it.

    **pidstat -T CHILD-1643** for the child processes of PID 1643. Only processes
    with non-zero statistics values are displayed. **-T ALL** means all child and
