    | Interface | Grp | Pwd | Pri | Address | Active router | Standby router |

    |---|---|---|---|---|---|---||

    | V150 | 1 | - | 150 | Standby 192.168.1.1 | 192.168.1.10 | local |

    | V150 | 1 | - | 7 | Listen | 0007.b400.0101 | 192.168.1.10 | - |

    | V150 | 1 | 2 | 7 | Listen | 0007.b400.0102 | 192.168.1.11 | - |

    | V150 | 1 | 3 | 7 | Listen | 0007.b400.0103 | 192.168.1.12 | - |


    Switch-B#


    # Switch-C# show glbp brief


    | Interface | Grp | Pwd | Pri | Address | Active router | Standby router |

    |---|---|---|---|---|---|---||

    | V150 | 1 | - | 100 Listen | 192.168.1.1 | 192.168.1.10 | 192.168.1.11 |

    | V150 | 1 | - | 7 | Listen | 0007.b400.0101 | 192.168.1.10 | - |

    | V150 | 1 | 2 | 7 | Listen | 0007.b400.0102 | 192.168.1.11 | - |

    | V150 | 1 | 3 | 7 | Active | 0007.b400.0103 | local | - |


    Notice that Switch A is in the Listen state for the AVG because there is a dash
    in the Fwd column and in Active state. It is acting as AFV for virtual forwarder
    number 1.


    Because GLBP has three routers, there are three virtual forwarders and virtual
    MAC addresses.


    Switch A is in the Listen state for forwarder numbers 2 and 3, waiting to be an
    active role in case one of those AVFs fails.


    Switch B is shown to have the Standby role, waiting to take over in case the AVG
    fails. It is the AFV for virtual forwarder number 2.


    Finally, Switch C has the lowest GLBP priority, so it stays in the Listen state,
    waiting for the active or standby AVG to fail. It is also the AFV for virtual
    forwarder number 3.'
