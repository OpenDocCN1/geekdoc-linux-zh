    Usingformed TCP flags to probe a target is known as an inverted technique because
    responses are sent back only by closed ports. RFC 793 states that if a port is
    closed on a host, an RST/ACK packet should be sent to reset the connection. To
    take advantage of this technique, attackers send probe packets with various TCP
    flag sets.


    Vscan is another Windows tool you can use to perform inverse TCP flag scanning.
    The utility doesn''t require installation of WinPcap network drivers, instead
    it uses raw sockets within Winsock 2 (present in Windows itself). Vscan is available
    from http://examples.oreilly.com/network/tools/vscan.zip.


    SING (Send ICMP Nasty Garbage) - http://sourceforge.org/projects/sing


    Ability to transmit and receive spoofed packets, MAC-spoofed packets, and the
    transmission of many other message types, including ICMP address mask, timestamp,
    and information, as well as router solicitation and advertisement messages


    ICMPscan - http://www.bindshield.net/tools/icmpscan Bulk scanner built from Nmap
    that sends types 8, 13, 15, and 17 ICMP; can process inbound responses by placing
    the network interface into promiscuous mode, identifying internal IP addresses
    and machines that respond from probes to subnet network and broadcast addresses.
    Because ICMP is a connectionless protocol, it is best practice to resend each
    probe (using -r) and set the timeout to 500 milliseconds (using -t). We also set
    the tool to listen in promiscuous mode for unsolicited responses (using the -c
