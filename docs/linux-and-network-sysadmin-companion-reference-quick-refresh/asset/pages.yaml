  md: '# Git Aliases


    $ git config --global alias.please --push --force-with-lease

    Team leads warn about forcing to a shared branch. Rebasing, amending, and squashing
    can rewrite some shared history\and spill duplicate commits over the repo. Force
    stamps the upstream branch with your local version, and any changes that you

    haven''t already fetched are erased from history. Git--force-with-lease checks
    that your local copy of the ref you''re overwriting is

    u-to-date first; that you''ve already fetched the changes you''re about to stomp.
    There you have only to type "git please"


    $ git config --global alias.commit --amend --no-edit

    Commit then realize you''d forgotten to save a file? Quickly amend any staged
    files into the last commit you created, re-using

    y existing commit message. So long as you haven''t pushed yet, no-one will be
    the wiser. Don''t amend published commits.


    Git It

    $ git config --global alias.it ''init git commit -m "root" --allow-empty''


    The first commit of a repo cannot be rebased by regular commits, so it''s good
    practice to create an empty commit in any repo

    root. "git both initializes and creates an empty root commit in one quick step.

    $ cd shiny-new-thing

    $ git it

    Initialized empty Git repo in /shiny-new-thing/git/


    Git Staaash

    $ git config --global alias.stash.stash --keep-index

    $ git config --global alias.stash.stash --include-untracked

    $ git config --global alias.stash.stash --all

    Takes any changes to tracked files in your work tree and stashes them for later,
    leaving you with a clean work tree to start

    hashing on everything. However if you''ve created new files and haven''t staged
    them, git stash won''t touch them by

    default, leaving you a dirty work tree, use stash. The contents of untracked or
    ignored files are not stashed by default;

    use stash. If in doubt, the long one will always restore your worktree to what
    looks like a fresh clone of your repo.


    ```

    git stash # any changes to tracked files

    git stash # untracked and tracked files

    git staaash

    git staaash # stash ignored, untracked, and tracked files

    ```


    Git Shortstatus

    $ git config --global alias.shortstatus --status --branch

    Git status inline has improved, but the output is overly verbose for those more
    familiar with Git. For example, git status emits 18

    lines to tell me you have a couple of staged, unstaged, and untacked changes.
    Git shortstatus tells me the same in three lines:

    $ git status

    ## master

    * AM test


    ```

    ?.gitignore

    ```


    Git Merc

    $ git config --global alias.merge --no-ff

    On re-basing workflows running a git merge to combine feature branches with the
    master is not ideal. With options,

    git merge uses a merge commit only if new changes are on the master branch, otherwise
    it fast-

    wards your master branch to point to the last commit on your feature branch. Without
    a merge commit it''s tricky to tell which

    code was developed on which branches in the git history. The --no-ff strategy,
    to create a merge commit.


    Git Gog (or "graph log")

    $ git config --global alias.log ''log --graph --abbrev-commit --decorate --all
    --format=format:%C(blue)%h%C(reset) - %C(cyan)%aD%C(dim white) --an%C(reset) %C(green)%%ar%C(reset)
    %C(yellow)%d%C(reset) %n%C(white)%s%C(reset)

    '''
