- pgno: 207
  md: '# BGP - Basic Configuration


    | | |

    |---|---|

    | router bgp 100 | Starts BGP routing process |

    | neighbor 192.31.7.1 remote-as 200 | Add a peer for sessions. The ASN tells if
    eBGP or iBGP |

    | network 172.135.250.0 | Well learned networks to advertise.

    | network 128.107.0.0 mask 255.255.255.255 | Specify an individual subnet.

    | (no) neighbor 24.1.1.2 shutdown | Disable- active session

    | timers bgp 90 240 | Timers. Keepalive (60sec) Holdtime (180sec)

    | neighbor 172.16.1.2 update-source loopback0 | Use this specific interface.

    | (no) synchronization | BGP routes are added to table by iBGP before


    Synchronization is disabled in later IOS. Using BGP meshes is preferable. Redistribution
    from BGP to an IGP when using BGP for MPLS is responsible and doable. Switch BGPGP
    is on avoiding loops


    # eBGP Next-Hop Behavior


    +   - The eBGP next-hop attribute is the IP address that is used to reach the
    advertising router; an edge router belonging to the autonomous system "next door".
    In most cases, the IP address of the connection between peers.

    - For iBGP, the eBGP next-hop address is not changed, carried into the local autonomous
    system as-is.

    - The next-hop-self command is a way to get around this (illustrated below)

    - R2 tells R3 that it will be the next-hop address when reaching reach networks
    outside its autonomous system.


    # Setup on R2:


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_207_0.png)


    | | |

    |---|---|

    | router bgp 64511 | Starts the BGP routing process.

    | neighbor 209.165.202.129 remote-as 64496 | Identifies R1 as an eBGP neighbor

    | neighbor 172.16.1.2 remote-as 64511 | Identifies R3 as an iBGP neighbor

    | neighbor 172.16.1.2 update-source loopback0 | Loopback0 IP is source for all
    BGP TCP packets to R3

    | neighbor 172.16.1.2 next-hop-self | Advertises itself as next hop for networks
    from other AS


    R3 will then use R2 as the next hop instead of using the eBGP next-hop of 209.165.202.129.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Here is another example in a slightly different setup where it is almost
    mandatory:


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_208_0.png)


    ```

    Router(config)#neighbor bgp 300

    Router(config-router)#neighbor 10.0.0.1 remote-as 100

    Router(config-router)#neighbor 10.0.0.1 next-hop

    - Forces all routes to 10.0.0.1 to advertise this next hop as next hop

    ```


    - Router C advertises 172.16.20.0 to Router A with next hop of 10.0.0.3 if the
    common media were Ethernet.

    - Routing will fail - Router A has no direct PVC to Router D and cannot reach
    the next hop

    - To remedy this, neighbor 10.0.0.3 next-self causes Router C to advertise itself
    as 10.0.0.3.

    - This happens in non-routed networks like Frame Relay or X.25 where BGP neighbors
    might not have direct access to all other neighbors on the same IP subnet.


    ```

    Router(config-router)#neighbor 10.0.0.1 next-hop-unchanged

    ```


    Enables an eBGP multipoint peer to propagate the next hop


    Do not use reflector settings


    This command should not be used on a route reflector, and the next-hop-self command
    should not be used to modify the next-hop attribute for a route reflector when
    this feature is enabled for a route reflector client.


    # eBGP Multipoint


    By default, eBGP neighbors exchange packets with a TTL of 1. Even though eBGP
    neighbors are usually directly connected (over a WAN) to establish sessions, sometimes
    one of the directly connected routers is unable to run BGP. The ebgp-multipoint
    allows for a logical connection to be made between peers, even if they are not
    directly connected - up to 25 hops away and still be able to create an eBGP session.
    The ebgp-multipoint is only used for eBGP sessions, and must be configured on
    each peer (end end). If you attempt eBGP session between loopbacks, BGP packets
    will be dropped due to an expired TTL.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_208_1.png)


    ```

    R1(config)# ip route 10.0.20.1 255.255.255.255 209.165.201.2

    - Define a static route to Loopback0 R2.

    R1(config)# router bgp 64496

    R1(config-router)# neighbor 10.0.20.1 remote-as 65111

    - Identifies a peer router at 10.0.20.1

    ```'
  merge: -1
  img_proc: true
- pgno: 209
  md: '```

    R1(config-router)# neighbor 10.20.10.29 update-source loopback0

    R1(config-router)# neighbor 10.20.10.2 ebgp-multihop 2

    ```


    -- Allows for two routers (not connected) to establish an eBGP session with TTL
    of 2.

    R2(config)# ip route 10.10.10.1 255.255.255.255 209.165.1

    -- Define a static route to Loopback0


    ```

    R2(config-router)# router bgp 64511

    R2(config-router)# neighbor 10.10.10.1 remote-as 64496

    R2(config-router)# neighbor 10.10.10.1 update-source loopback0

    R2(config-router)# neighbor 10.10.10.1 ebgp-multihop 2

    ```


    -- Allows for two routers (not connected) to establish an eBGP session with TTL
    of 2.


    # Loopbacks on bgp need-multihop


    If redundant links exist between two BGP neighbors and loopback addresses are
    used, you must configure bgp-multihop because the default TTL of 1. Otherwise,
    the router decrements the TTL before giving the packet to the loopback interface,
    meaning that the IP forwarding logic discards it. Configuring to 2 solves the
    problem.


    # Default Routes, default-origin to define to specific neighbors


    For a default route to reach all/peers you just use network 0.0.0.0 (it''s here
    in the routing table)

    For the default route 0.0.0.0 to be advertised to a specific neighbor, use network
    192.168.100.1-default-origin originate


    # BGP Peers


    To ease the configuring of large number of neighbors with identical or similar
    parameters (for example, route maps, filters, or lists), the concept of peer groups
    was introduced. Simply configure a peer group with all the neighbors that are
    to be applied to BGP peers. BGP neighbors are bound to the peer group, and the
    network administrator applies the peer group configuration to all of the BGP sessions.
    The result below, all four IBGP neighbors have the same BGP configuration assigned
    to them.


    | router bgp 65500 | Starts the BGP group process |

    | NEIGHBOR INTERNAL | Creates a BGP group called INTERNAL |

    | NEIGHBOR INTERNAL remote-as 65500 | Assigns a first parameter to the peer group
    |

    | NEIGHBOR INTERNAL next-hop-self update-source loopback0 | Assigns a second parameter
    to the peer group |

    | NEIGHBOR INTERNAL route-reflector-client | Assigns a third parameter to the
    peer group |

    | NEIGHBOR 192.168.1.2 peer-group ebgp-internal | Assigns a fourth parameter to
    the peer group |

    | NEIGHBOR 192.168.1.3 peer-group ebgp-internal | ... to neighbor R3 |

    | NEIGHBOR 192.168.1.4 peer-group ebgp-internal | ... to neighbor R4 |

    | NEIGHBOR 192.168.1.5 peer-group ebgp-internal | ... to neighbor R5 |


    A peer group can be, among others, configured to the following:


    +   - Use IP of a specific interface address to secure the TCP session or use
    next-hop/self feature

    - Use, or not use, like the BGP multihop, or MDS authentication on the BGP sessions.

    - Filter out any incoming or outgoing routes using a prefix list, filter list,
    and a route map.

    - Assign a weight value to the routers that are received.


    # MP-BGP


    Original BGP was designed for IPv4. Multicast BGP can run over IPv6, and MPLS
    - can exchange routes for IPv4, IPv6, or others. The extensions enable NEXT-HOP
    to carry IPv6 addresses and NLRI (Network Layer Reachability Information) to an
    IPv6 prefix, to TCP. The IPv4 and IPv6 use separate TCP connections.


    ```

    R1(config)# ipv6 unicast-route

    R1(config-router)# router bgp 65500

    R1(config-router)# neighbor 2001:db8::12:remote-as 65501

    R1(config-router)# address-family ipv4 unicast

    R1(config-af-ipv4)# address family configuration for unicast prefixes (default
    IPv4)

    R1(config-af-ipv4)# network 10.10.10.1 255.255.255.255

    R1(config-router)# address-family ipv6 unicast

    R1(config-af-ipv6)# address family configuration for unicast prefixes.

    R1(config-af-ipv6)# neighbor 2001:db8::12:activate

    R1(config-af-ipv6)# enables the exchange of IPv6 BGP info with IPv4. R2 neighbors
    auto-activate, which keyword is optional.

    R1(config-af-ipv6)# network 2001:db8::1/64

    ```


    Router2 had a reciprocal set of the commands to work with R1.

    Recall that the default is on IPv4 address (bgp router ipv4_address), IPv6 can
    still use it

    Troubleshoot with, show bgp ipv6 unicast [ optional: | neighbors ] and show ipv6
    route bgp'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Route Aggregation - Setting the Aggregate attribute


    +   - BGP router can merge overlapping routes (nondirectional routes to the same
    destination)

    - When making a best path decision, a router always chooses the more specific
    path.


    R1(config-router)#aggregate-address 172.16.0.255.255.0

    - Creates aggregate entry in the BGP table to cover BGP routes in range.

    - More specific routes will be hidden unless summary-only is used


    R1(config-router)#aggregate-address 172.16.0.0 255.255.0 summary-only

    - Creates aggregate route AND advertisement of more-specific routes.

    - Specific AS_PATH info on those subsets are lost.


    R1(config-router)#aggregate-address 172.16.0.0 255.255.0 as-set

    - Creates an aggregate entry that the path advertised is an AS_SET (list of AS_PATHS)


    Below is a use case of route aggregation: to send an aggregate address, we only
    need one of the specific routes configured. By configuring all of them, and not
    using summary-only they will all be sent, and the aggregate will be sent in case
    one of the networks goes down.


    ```

    Lockub(config-router)#bgp 1

    Lockub(config-router)#neighbor 10.1.1.2 remote-as 2

    Austin(config-router)#bgp 2

    Austin(config-router)#neighbor 10.1.1.1 remote-as 1

    Austin(config-router)#neighbor 172.16.0.0 mask 255.255.255.0

    Austin(config-router)#neighbor 172.16.1.0 mask 255.255.255.0

    Austin(config-router)#neighbor 172.16.2.0 mask 255.255.255.0

    Austin(config-router)#aggregate-address 172.16.0.0 255.255.255.252

    ```


    Thus, Lockub and Austin will have all these specific routes and the aggregate
    address in their BGP table

    Lockub#show ip bgp 172.16.0.0 255.25


    ```

    BGP routing table entry for 172.16.0.0/22, version 18

    Paths: (1 available, best #1)

    <text omitted>

    Origin IGP, localpref 100, valid, atomic-aggregate, best

    ```


    # Route Reflectors


    By default, a router advertises an EBGP route to eBGP and IBGP peers.

    If it receives through iBGP, it won''t advertise it to iBGP peers, as loop-prevention

    way for all IBGP routers to receive a route after it is originated into the AS
    is to have a full mesh of iBGP peers, which can get a complex network with a number
    of peers. Route reflectors resorting to that:


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_210_0.png)


    The objective is to allow R2 to advertise to R1 209.165.201.0/27 network learned
    from R3. Without these commands, R1 would never learn the 209.165.201.0/27 network
    without a full-mesh iBGP topology.


    | R2(config)#router bgp 65010 | Enters BGP routing configuration mode |

    | R2(config-router)#neighbor 10.1.1.1 route-reflector-client | Designates a BGP
    route reflector and the specified neighbor as a client |

    | R2(config-router)#neighbor 10.3.3.3 route-reflector-client | Designates a BGP
    route reflector and the specified neighbor as a client |'
  merge: -1
  img_proc: true
