  md: '# # Installing Kerberos Server (no FreeIPA)


    sudo dnf install krb5-server (client is krb5-workstation, krb5-libs, krb5-user)


    /etc/krb5.conf: Main configuration file; defines Kerberos KDC locations, encryption
    types, etc.

    /etc/krb5/kdc.conf: Configuration for the KDC (server-side) if you''re setting
    up a Kerberos server.

    /etc/krb5/logn.conf: Defines how Kerberos is used for authentication (login).

    /var/kerberos/keytab: Stores the master Kerberos keys for the KDC.


    Client-side commands:

    * `print` - For client users to get a ticket to access a Kerberos-protected service.

    * `list` - Lists all available Kerberos tickets by the user, for verifying and
    seeing lifetime, -f gives more info

    * `kdestroy` - Destroy a specific Kerberos ticket. For logging out of a service
    or freeing resources.


    Server-side commands:

    `kdb5` - Manages the Kerberos database, keytabs, and principals

    `admin.local` - Manages Kerberos principals and credentials: creating, modifying
    user accounts, resetting passwords, and managing keytabs by the KDC.


    Mentionable related commands:

    * `keyutils` - general-purpose tool for managing keys and keys, manage Kerberos
    keytabs alongside other manage tasks. (it doesn''t interact directly with the
    Kerberos database)

    * `sshd_module` - A standalone command, but a module used by the SSH daemon to
    enable Kerberos authentication for SSH connections.


    System Services:

    `kdb5.service (server-side)` - Manages the KDC daemon.

    `kdb5.admin.service (server-side)` - Manages the Kerberos administration daemon.


    Important Configurations:

    Realm: Unique identifier for your Kerberos domain (e.g., EXAMPLE.COM)

    DC Locations: Specify the hostname or IP address of your KDC servers.

    Default Encryption Type: Choose an appropriate encryption type (e.g., aes256-cts)

    Ticket: Set the expiration time for tickets.

    Client Principal: Define the principal name for your client (e.g., client@hostname).


    # Managing the Kerberos database, and principals with kdb5


    Create and initialize database and set master password

    Create new principal in <realm> with <password>

    Modify principal''s attributes (e.g., password, flags)

    Remove a principal from DB

    List all principals in <realm> with key versions (-kv)

    Create Keytab

    Add Entries to Keytab

    Merge Databases

    Disable database (expose sensitive information)

    Verify the Kerberos database


    ```

    kdb5 -r <realm> -s <keytab_file> -p <password>

    kdb5_addprinc -r <realm> -p <password> <principal>

    kdb5_modifyprincipal -r <realm> <principal>

    kdb5_deleteprincipal -r <realm> <principal>

    kdb5_list -r <realm> -kv

    kdb5_create -r <realm> -s <keytab_file>

    kdb5_addprinc -r <realm> -p <password> -t <keytab_file> <principal>

    kdb5_merge -s <target_keytab> <source_keytab1> <source_keytab2> ...

    kdb5_dump -r <realm> -f <output_file>

    kdb5_verify -r <realm>

    ```


    # Manage Kerberos database with kdbmin.local


    Create a new principal for KDC administration:

    `addprinc-kdc_admin@EXAMPLE.COM`: `kdc_admin@EXAMPLE.COM` is the principal name
    and EXAMPLE.COM representing the Kerberos realm name.

    Exit kdbmin.local by entering quit.


    Grant the kdc_admin permissions to manage the KDC:

    `kdbmin.local -p krb5/admin@EXAMPLE.COM` ktadd -k /etc/krb5.keytab kdc_admin@EXAMPLE.COM


    The first part "-p krb5/admin@EXAMPLE.COM" provides the password for the krb5/admin
    (usually the root principal) that has full administrative privileges in the Kerberos
    database.

    The second part "ktadd..." adds the key for the kdc_admin to the specified keytab
    file (/etc/krb5.keytab)'
