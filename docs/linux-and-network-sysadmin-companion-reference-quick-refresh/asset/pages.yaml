- pgno: 6
  md: '# Tuning Resources with sysctl


    /proc/sys/ - directories for all interfaces the kernel offers: abi, crypto, debug,
    fs, kernel, net, snmp, vm

    /proc/sys/kernel/ for core functionality, /proc/sys/net/ for networking, /proc/sys/vm/
    for virtual memory

    kernel for different parameters like "osrelease" or "hostname"

    cat /proc/net/ipv4/conf 1. Change this to echo 0 > ip_forward (not persistent)

    vm contains "swappiness" holding a value of 0-100 (eerness of kernel to swapping
    out unused memory)

    Default is 30. Greater value (60) might help kernel swap out faster. Change it
    the same way but it wouldn''t

    stick after reboot (not persistent).


    /etc/sysctl.conf contains the default system configurations that hold these sort
    of values. It should be edited if you want to change these values and have them
    stick after a reboot.


    sysctl -a - to display /proc/sys values

    sysctl -a | grep forward -- show forwarding/ routing files


    ```

    Just like in Java, net.ipv4.conf.mc would refer to file /proc/net/ipv6/conf/lo

    [root@server ~]# sysctl | grep forwarding

    net.ipv4.conf.all.forwarding = 0

    net.ipv4.conf.all.default.forwarding = 0

    net.ipv4.conf.default.forwarding = 0

    net.ipv4.conf.default.forwarding = 0

    net.ipv4.conf.ens33.forwarding = 0

    net.ipv4.conf.ens33.forwarding = 0

    net.ipv4.conf.lo.forwarding = 0

    net.ipv4.conf.lo.forwarding = 0

    net.ipv4.conf.lo.forwarding = 0

    net.ipv6.conf.all.forwarding = 0

    net.ipv6.conf.all.default.forwarding = 0

    net.ipv6.conf.default.forwarding = 0

    net.ipv6.conf.default.forwarding = 0

    net.ipv6.conf.ens33.forwarding = 0

    net.ipv6.conf.ens33.forwarding = 0

    net.ipv6.conf.lo.forwarding = 0

    net.ipv6.conf.lo.forwarding = 0

    ```


    On boot the sysctl process is started. In the past, it just checked /etc/sysctl.conf,
    which is now empty (as of RHEL). The file instructs that "default settings live
    in /usr/lib/sysctl.d/00-system.conf. To override these settings add new entries
    here, or in /etc/sysctl.d/<name>.conf

    So you can put your custom stuff in /etc/sysctl.conf, but putting them in an /etc/sysctl.d/<name>.conf
    might be more organized if many custom changes are applied

    Before you access scripts run sysctl -p. It will likely only contain /etc/sysctl.d/00-sysctl.conf
    which it turns out is a sample link to sysctl.


    /usr/lib/sysctl.d/ contains 00-system.conf 50-default.conf libvirt

    The numbers represent the order


    So, in /etc/sysctl.d/ run 99-ip-forward and put in net.ipv4.ip_forward = 1, save
    and on reboot should be able to route IP packets.


    The sysctl command promises to set the value and write the sysctl files. Sander
    Vogt (examples I just used in this section in /proc and kernel parameters) recommends
    setting it, instead to make sure by going directly to the source and echoing the
    value in /proc as demonstrated.


    # sysctl command options


    sysctl to modify kernel parameters at runtime. The parameters available are listed
    under /proc/sys/


    +   -w (variable)=[value] Write a parameter value/change the sysctl setting.

    -n Disable the printing of the key name while displaying the kernel parameters.

    -e Ignore errors about unknown keys.

    -A Display all the parameter values that are currently available.

    -A Display those in a tabular format.'
