    - testparam Verifies the syntax of /etc/samba/samba.conf before restarting the
    server.

    - smpasswd Changes Samba user account passwords.


    Systemd on the server (also include the client list)


    +   - smbd.service Main SMB/CIFS daemon, providing access to clients, handles
    file/print services.

    - nmbd.service Provides NetBIOS name service.

    - samba.service Allows Windows domain authentication.

    - samba-ad-dc.service Samba Active Directory Controller service


    Main config file /etc/samba/samba.conf (resources, user authentication, security,
    .)

    Optional configs: /etc/samba/samba-conf.security (config) or /etc/samba/smb.secrets
    (for sensitive information)


    /etc/samba.conf - shared directories or files using [sharesename]. permissions
    for users or/groups; LDAP and encryption options, and security


    +   Shares: Define directories or files using the [sharesename]

    Permissions: - read only = yes, writable = yes, and specific user/group entries.

    LDAP Integration: security = ads option and performing LDAP server details.

    Security Settings: Enhance security with these options:

    - encrypt passwords = yes - Encrypt passwords for password storage.

    map to guest = bad - Hide the shares from browse

    browable = no - Disables guest access

    valid users = @users - Restricts access to the local usernames or users in specified
    group.


    Example smb.conf

    [Global]


    ```

    workgroup = MYWORKGROUP Name of the network for network browsing

    server = My Samba Server Descriptive name for your Samba server

    security = ads Enable LDAP security for user authentication

    encrypt passwords = yes Encrypt passwords for added security

    map to guest = bad User access for the unauthenticated-users (which doesn''t exist!)

    log level = 0.0.0.1 Wins service for name resolution, logging access, and specifying
    interface to (not all)

    logging = file file-blocking # Log warnings and more messages

    log file = /var/log/samba.log Specify the log file location

    # Interfaces = 1 Listen only on the IP 192.168.1.0/24 subnet

    ```


    [Shared]


    ```

    path = /home/share Path the directory you want to share

    browable = no Hide this share from network browsing

    writable = yes Allow access to modifying and files

    read only = no Allow both reading and writing

    valid users = @share Grant access to only users in the "share_access" group

    mask = 0664 Example: New files get rw-rw-permissions (user:group)

    directory mask = 0775 Set default getwxwx-x permissions

    ```


    [Another]


    ```

    path = /var/www/html Path to the web directory (example)

    read only = yes Allow users to read only files in this share

    valid users = user2 @web_admins Grant access to specific users and a group

    # locking = ... Options for controlling multiple clients share access to files

    # oplocks = ... Options related to optimistic locking (advanced)

    # write cache = (read ''cache'') = yes Enabling cache writes/reads for faster
    performance

    The "map to guest = bad user" matches any user that fails authentication (denied)

    ```'
