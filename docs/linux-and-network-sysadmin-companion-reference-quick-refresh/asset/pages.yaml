    # NFSv4


    nfs-common, nfs4-acl, rpc-svc-gcs. For server, use nfs-kernel-server and nfs-utils
    /etc/exports, /etc/nfs/, /etc/nfs.conf (server) nfs-server.service and nfs-kernel-service,
