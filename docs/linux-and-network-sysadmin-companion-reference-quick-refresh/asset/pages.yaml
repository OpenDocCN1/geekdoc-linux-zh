- pgno: 50
  md: '# Nested RAID Levels


    RAID01 (RAID 0+1): Mirror of Stripes - A RAID0 array is Mirrored


    | RAID 0+1 |

    | RAID 1 |

    | RAID 0 | RAID 0 |

    |---|---|---||

    | A1 | A2 | A1 | A2 |

    | A3 | A4 | A3 | A4 |

    | A5 | A6 | A5 | A6 |

    | A7 | A8 | A7 | A8 |

    | Disk 0 | Disk 1 | Disk 2 | Disk 3 |


    RAID01 uses mirror of stripes, achieving both replication and sharing of data
    between disks. Better performance than RAID1, and better redundancy than RAID0.
    Data is mirrored and if you lose a drive in one stripe set, all data must be from
    the other stripe set. Read operations are faster, but write operations mirror
    the performance degradation of RAID1.


    The usable capacity of a RAID 01 array is the same as in a RAID 1 array made of
    the drives, in half of the drives is used to mirror the other half. At least four
    disks are required in a standard RAID 01 configuration, but larger arrays are
    also used.


    # RAID03


    | RAID 0+3 |

    | RAID 3 |

    | RAID 0 | RAID 0 |

    |---|---|---|---||

    | A1 | A2 | A3 | A4 |

    | A5 | A6 | A7 | A8 |

    | B1 | B2 | B3 | B4 |

    | B5 | B6 | B7 | B8 |

    | Disk 0 | Disk 1 | Disk 2 | Disk 3 | Disk 4 | Disk 5 |


    RAID03, also called RAID+3 is byte-level striping with dedicated parity is used.
    Essentially, a RAID3 is striped across RAID0 elements


    RAID 53 is an accepted term for a series of RAID-5 arrays (striped with distributed
    parity) across a RAID-3 array. For practical definition it is mostly the same
    thing, and it benefits aren''t important with other types.


    RAID10 (RAID 1+0): Strip of Mirrors - A RAID0 array is striped across RAID1 elements


    | RAID 1+0 |

    | RAID 0 |

    | RAID 1 | RAID 1 |

    |---|---|---|---||

    | A1 | A1 | A2 | A2 |

    | A3 | A3 | A4 | A4 |

    | A5 | A5 | A6 | A6 |

    | A7 | A7 | A8 | A8 |

    | Disk 0 | Disk 1 | Disk 2 | Disk 3 |


    RAID10 is similar to RAID01 with an exception that two used standard RAID levels
    are layered in the opposite order; thus, RAID 10 is a stripe of mirrors (RAID0
    array of RAID1s), which may be two or threeway mirrors and requires a minimum
    of four disks.


    A nonstandard "RAID10" can be implemented with few as two disks, and arrays of
    more than four disks are also possible.


    RAID 10 provides better throughput and latency than all other RAID levels except
    RAID 0 (which wins in throughput). Thus, it is the preferable level for I/O-intensive
    applications such as database, email, and web servers, as well as for any other
    use requiring high disk performance.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# RAID 50 RAID 5+0: RAID0 array is striped across RAID5 elements


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_51_0.png)


    RAID50 aka RAID 5+0, combines the block-level striping of RAID0 with the distributed
    parity of RAID5.

    As a RAID is striped across RAID5 elements, RAID5 configuration requires five
    drives. Example shows collections of 120 GB RAID5 sets together to make 720 GB
    of total storage space.


    One drive from each of the RAID5 sets could fail without loss of data; for example,
    a RAID5 configuration including three RAID5 sets can tolerate three potential
    drive failures. There is still RAID5''s inherent strain to rebuild a drive. As
    RAID was improved by RAID6, so its counterpart, RAID 60


    # RAID 60 (RAID 6+0): RAID0 array is striped across RAID6 elements


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_51_1.png)


    RAID 60, also called RAID 6+0, combines the block-level striping of RAID 0 with
    the distributed parity of RAID 6, resulting in a RAID 0 array striped across RAID
    6 elements. It requires at least six disks.


    # RAID 100 (RAID 10+0)


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_51_2.png)


    RAID100, sometimes called RAID 10+, is a stripe of RAID10s. This is logically
    equivalent to a wider RAID10 over hardware RAID 10. Being "striped two ways" as
    a RAID100 is described as a "plaid RAID"'
  merge: -1
  img_proc: true
