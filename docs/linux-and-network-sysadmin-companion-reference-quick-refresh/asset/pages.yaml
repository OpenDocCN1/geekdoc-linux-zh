- pgno: 159
  md: '# Spanning Tree (802.1D)


    Spanning Tree is a managed system where each port is in a forwarding or blocking
    state. Blocking state means the port doesn''t process any frames except STP messages-the
    switch physically recaves the frame on blocked port, but ignores it. if topology
    changes (a stop), STP convergence updates states. This system has a "root bridge"
    and uses IDs for each switch containing a priority & and MAC address. Distance
    to the root switch/bridge are measured as a "root cost" from each switch, and
    by controlling the forwarding and blocking of ports, ultimately, the Layer 2 staff
    can take over the network.


    # The Root Bridge/ Root Switch and the System''s Basics


    +   - The root is always the designated switch on all connected segments

    - All ports on the root switch are designated ports, in a forwarding state

    - Normal switches have a root port (lowest cost to the root switch); if it''s
    connected, it''s the root port.

    - Each switch has at least one designated port (DP) to the other non-root switches.

    - Similarly, a designated switch is chosen by "root cost" over all paths, ultimately,
    non-root switches connect to the root through their neighboring designated switch.

    - Through system of network builds up until either DPs or blocked

    - The designated port''s job is to send STP messages (BPDUs) back and from the
    root


    # Electing the Root Switch (more explanation in BID (ID) section)


    Root switch has the lowest priority field in its BID


    +   - If SW1 Priority = 4096 and SW2 Priority = 8192, SW1 is Root

    - If a priority tie occurs, switch with lowest MAC address in field is Root

    - If SW1 Pri= 4096 & MAC= 0200.xxxx.xxxx and SW2 Pri= 4096 & MAC= 0111.xxxx.xxxx,
    SW1 is Root


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_159_0.png)


    # Bridge Protocol Data Units (BPDUs) exchange info between switches


    Hello messages are a BDU containing

    - Root Bridge Id. Sender''s Bridge and root cost

    - Timer values on the root switch (hello, MaxAge, and forward delay)

    Configuration BPDUs originate from Root bridge. These are the majority of BPDUs
    on a healthy network

    Topology Change Notification (TCN) BPDUs sent to the Root bridge to activate that
    topology has changed. (notification and acknowledgement subtypes)


    # Timers


    - 2 second hello - Time period between being created by the root

    MaxAge- 10x hello timer (20 sec delay)-How long switch waits after no hello BPDUs,
    before changing states

    Forward delay- 15 secs - time interface goes from blocking to forwarding in each
    of the listening, learning states


    # Elect Designated Ports - the port with the lowest-cost on a LAN segment.


    (Hello msgs has a cost of 0 when they are the root switch) Cost by line type,
    2nd # is "long path cost":

    10 Mbps 100 200000

    100 Mbps 19 200000

    1 Gbps 4 20000

    10 Gbps 2 2000

    100 Gbps 200'
  merge: -1
  img_proc: true
- pgno: 160
  md: '![](img/4541d1f2c9832b9303a6df6c929f86f6_160_0.png)


    Both SW2 and SW3 list their respective cost to the root (cost 4 on SW2 and 5 on
    SW3). SW2 lists the lower cost, so SW2''s G0/1 is the designated port on LAN.
    The order is root cost, then best BID, then lowest neighbor priority, finally,
    lowest internal port number


    **50-second convergence delay**: STP is the interface in both learning and listening
    states for a time equal to the forward delay timer, which defaults to 15 seconds.
    A convergence event that causes an interface to change from blocking to forwarding
    requires 30 sec to transition to the state PLUS the MaxAge to first blocking


    **Temporary states when going from blocking to forwarding:**

    - Listening-doesn''t forward: does MAC table cleanup

    - Learning-doesn''t forward: learn the MAC address of received frames


    | State | Forwards? | Learns MCAs? | Transient or Stable? |

    | --- | --- | --- | --- |

    | Blocking | No | No | Stable |

    | Listening | No | No | Transitory |

    | Learning | No | Yes | Transitory |

    | Forwarding | Yes | Yes | Stable |

    | Disabled | No | No | Stable |


    **Rapid STP (IEEE 802.1w - RSTP):** (backward-compatible w/non-RST switches)

    - Hello time is 2 secs (3 x hello, 3 missed BDPUs)

    - **improves convergence from about 50 seconds to 10 seconds**


    - adds two types of port to immediately enter the forwarding state rather than
    passively for the network to converge.

    In addition to forwarding


    **Check Before Connecting New SW**


    When plugged into the network, SW sends hello BDPUs until it identifies the root
    bridge, then if it has a better (lower BID), that switches itself advertising
    as root and forwards towards the superior root. This is how an unauthorized or
    improperly valued device can screw up a STP topology - if one shows with a lower
    BID, convergence spreads it across the new switch and everything goes wacky.


    **PortFast**

    - Allows immediately change from blocking to forwarding. No listening or learning
    states

    - For endpoint/access devices (PCs) - NOT bridges/switches

    - Port (on interfaces receiving BDPU (not another switch) - w/o BDPU Guard can
    create loops

    - If VLAN vast, PortFast turns auto-automatically on when VLAN is used


    **BPDU Guard**

    - BDPU guards a port if any BDPUs are received and it prevents PortFast problems

    - STP opens up under the following security exposures:

    - Attacker switches with low STP priority and becomes the Root Switch

    - Attacker could plug into multiple ports/switches, become root, & forward (TCPDump)
    traffic

    Users can harm the LAN when they connect a non-STP switch (which can be counted
    in elections)'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# The Bridge ID - {Priority (4096-61440) + VLAN (0-4095) + the MAC address}


    STP Bridge ID (BID) is a unique 6-byte value: basically a priority field snapped
    onto a MAC address

    - 2-byte priority field The last 12 bits holds a VLAN ID 0-4096 (it''s basically
    a 16-bit number)

    - 6-byte system ID - the 48-bit MAC address

    The 2-byte priority field is separated into 2 parts


    4-bit priority field; the part that can be changed with the "priority" directive

    12-bit system ID extension - basically, just space for the VLAN ID


    | Original Format Bridge ID | 2 Bytes Priority (0-65,535) | 6 Bytes System ID
    (MAC Address) |

    |---| System Extension | 4 Bits (Multiple of 4096) | 12 Bits System ID Extension
    (Holds VLAN ID) | 6 Bytes System ID (MAC Address) |


    When the bits are written out, those leading 4 bits starting at the 4096 bit (the
    13th bit), so each number starting there would naturally be a multiple of 4096.
    Since VLAN IDs can range from 1 to 4094, it all makes perfect sense and looks
    a bit complicated like this:


    +   - Priority [4096-61440 + VLAN [1-4095]] + tack on the MAC address.

    Means, (0000000000000000) is your MAC address

    0000-[1111] ---- is priority in binary (other bits reserved to pulp a "priority"
    onto)

    We configure the priority field in square brackets:

    [1000] - 000000000000------ Default base priority of 32768 in binary

    [0110] - 000000000000------ Secondary root bridge designation in binary

    [????] - 000000000000------you can select a custom here for a priority (from 4096
    ? up to 61440)


    The Easy Way

    - spanning-tree vlan-id root primary [auto, this auto-sets this priority to become
    root now]

    isco switches use a default base priority of 32768

    If current root base priority > 24576, make base priority 24576.

    If 24576 or lower, sets base priority to highest multiple of 4096 that results
    in booting root.

    For our numbers below, 28672 is 0111 010000000000


    - spanning-tree vlan-id root secondary [again, this auto-sets it for us]

    A priority value worse than the primary switch but better than all the other switches.

    Sets the switch''s base priority to 28672 regardless of the current root priority
    value.

    For our numbers below, 28672 is 0111 010000000000


    The Hard Way

    It is much easier to designate root primary and secondary to do it yourself. If
    you insist on doing "spanning-

    tree vlan-id priority x


    - spanning-tree vlan-id root priority x

    A switch configured with VLANs 1 through 4, with a default priority

    32768 is a default STP priority of 32769 in VLAN 1, 32770 in VLAN 2, 32771 in
    VLAN 3, and so on. So, you can view

    t 16-bit base priority (as configured on the spanning-tree vlan-id priority x
    command) plus the VLAN ID.\n0001000000000000 = 4096

    0010000000000000 = 8192

    0100 = 16384, 1000 = 32768


    Vlan 1 was 32769, VLAN 2 32770, VLAN 10 32778

    1111: 61440 <-- if there are more than one bit turned on, things get weird. One
    trick is to pretend the VLAN-ID part is

    1''s so it flattens out to multiples of 4096, only when you are calculating


    Final word: when priorities make you uncomfortable, forget it. Use "root primary"
    and "root secondary"'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Determining the Root Switch and the Root Port on Noocent Switches


    Use show spanning-tree, show spanning-tree root to root any switches that have
    an RP; root switches do not have an RP, show spanning-tree identifies the local
    switch root directly: "This is the root". In show spanning-tree, the root column
    is empty if the local switch is root.


    Using spanning-tree vlan x on a few switches, recording the root, RP, and DP can
    quickly show you most STP facts. The RPs. If starting with SW1, SW1, and G0/1
    is an RP, then the root will be the switch on the other G0/1.


    # STP Tiebreakers When Choosing the Root Port


    The three tiebreakers are, in the order: lowest neighbor bridge ID, lowest neighbor
    priority, finally, lowest internal port number. Only root paths that are tied
    when thinking about tiebreakers.


    SW3 is not root and that it has a range of values from 0 to 255, with lower being
    better than 8. The first tiebreaker is the lowest neighbor''s BID. SW1''s BID
    value is lower than SW2''s, so SW3 chooses its G0/1 interface as its RP.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_162_0.png)


    **Figure 2-8** SW3''s Root Cost Calculation Ends in a Tie


    The last two tiebreakers come into play when two switches connect to each other
    with multiple links, as shown in above. In that case, a switch receives hellos
    on more one port from the neighboring switch, so the BIDs tie.


    So, SW2 becomes and needs to choose its RP. SW1''s root cost over each path will
    tie at 19. SW2 sends hellos over each link to SW1, so SW1 cannot break the tie
    based on SW1''s neighbor BID because both SW2''s BID. So, SW1 has to turn to the
    other tiebreakers.


    The next tiebreaker is configurable: checking the neighbor''s priority on each
    neighboring switch interface. Cisco switch ports to a default of 12, with a range
    of values from 0 to 255, with lower being better than 8. However, SW2''s Fa0/16
    is most likely with spanning-tree vlan 10 priority root 112. SW1 chooses that
    the neighbor has a priority of 112 on the top link and 128 on the bottom, so SW1
    uses its port (Fa0/14) as the root port.


    **Figure 2-9** Topology for the Last Two Tiebreakers for Root Port


    If the priority lies, which often does due to the default values, STP relies on
    an internal port number on the neighbor. Cisco switch assigns an internal identifier
    to identify each interface on the switch. The root looks for the neighbor''s lowest
    internal port number (as listed in the hello messages) and chooses its RP based
    on the lower number.


    With Fa0/16 having the lowest number, then Fa0/2, Fa0/3, and so- SW2''s Fa0/16
    would have a lower internal port number than Fa0/17, SW1 would learn these numbers
    in the hello; and SW1 would use its Fa0/14 as its RP. (In real life, most engineers
    would put these two links into an EtherChannel)'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'This figure notes the root, RPs, and DPs and each switch''s least cost to reach
    the root over its respective RP.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_163_0.png)


    BID:

    28,682:0200.2222.2222

    Root Cost: 20


    BID:

    32,778:0200.3333.3333

    Root Cost: 19


    Remember the order of the criteria:

    Lowest root cost, lowest BID, neighbor port priority, lowest internal port number


    Focus on the segments that connect the switches for a moment.

    SW2-SW4 segment: SW4 wins because of its cost of 19, compared to SW2''s cost of
    20.

    SW2-SW3 segment: SW3 wins because of its cost of 19, compared to SW2''s root cost
    of 20.

    SW3-SW4 segment: SW3 and SW4 tie on root cost, with 19. SW3 wins due to its better
    (lower) BID value.

    SW2 loses and does not become DP on the links to SW3 and SW4 even though SW2 has
    the better (lower) BID value.

    The first DP criteria is the lowest root cost, and SW2''s root cost happens to
    be higher than SW3''s and SW4''s.


    ```

    show spanning-tree vlan Bridge and Root0, timers; port roles for local switches,
    switch role for device.

    show spanning-tree vlan 10 root - lists root''s BID for each VLAN, local switch''s
    root cost and root port

