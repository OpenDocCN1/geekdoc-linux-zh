    iptables -INPUT -i eth0 -s 10.0.10.0/24 --dport 53 -j ACCEPT # DNS

    iptables -INPUT -i eth0 -s 10.0.10.0/24 --dport 67 -j ACCEPT # DHCP server broadcasts

    iptables -OUTPUT -o eth0 -udp 10.0.10.0/24 --dport 67 -j ACCEPT # DHCP leases,
