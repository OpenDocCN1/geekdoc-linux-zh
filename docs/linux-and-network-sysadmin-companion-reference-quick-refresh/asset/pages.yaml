  md: '# Class Subnetting - Subnetting for Hosts


    You are given 170.70.0 to start with, and are asked for:

    - two subnets that contain 1000 usable IP addresses.

    - one subnet that contains 500 usable IP addresses.

    - one subnet that contains 100 usable IP addresses.


    ```

    128 64 32 16 8 4 1

    ```


    So we are wanted and starting off with 170.70.0.0, 255.255.0.0

    To make the first subnet of 1000 hosts, we need to use the 3rd oct in the diagram
    this:


    ```

    32768 16384 8192 4096 2048 1024 512 256 ● 128 64 32 16 8 4 2 1

    ```


    1023 - This fits so we use it. 1024 marks where our first network bit is.

    This uses 10 bits (8 bits for the 4th octet + 2 used in the 3rd)

    32 bits-22 bits left for the network: 8 6 0 - 170.70.0/22

    The line drawn in the 3rd octet goes up to the 1023 mark.

    2 has a block size of 4, a subnet of 252 (256-4)

    The subnet mask is 255.255.252.0

    Broadcast is 170.70.3.255 - the next network is 170.70.4.0


    The second subnet starts at 170.70.4.

    We need 1000 hosts- what we get, so this is easy. Update the network number with
    increments of 4 as the block size. we already figured out. We know this is a /22
    subnet used- 23 (7 bits in 3rd octet)

    Subnet mask is 255.255.252.0

    Broadcast is 170.70.7.255 - the next network is 170.70.8.0


    Third subnet starts at 170.70.8.

    To make the subnet of 500 hosts:


    ```

    32768 16384 8192 4096 2048 1024 512 ● 256 ● 128 64 32 16 8 4 2 1

    ```


    511 - This fits so we use it. This equals 9 bits, leaving 23 (32 bits-9 bits)

    CIDR notation: 8 8 7 0

    170.70.8.23 with a block size of 2 Network bits used- 23 (512 leaves 7 bits in
    3rd octet)

    Subnet mask is 255.255.254.0

    Broadcast is 170.70.9.255 - the next network is 170.70.10.0


    Fourth subnet: 170.70.10.0.

    To make the subnet of 1000 hosts:


    ```

    32768 16384 8192 4096 2048 1024 512 ● 128 64 32 16 8 4 2 1

    ```


    127 - This fits so we use it. This equals 7 bits, leaving 25 (32 bits-7 bits)

    CIDR notation: 8 8 8 1 Count the bits used- 25 (12 leaves 1 bit in 4th octet)

    170.70.10.0/25 - We didn''t have to touch the third octet for this one.

    128 is the 25th bit, thus subnet mask is 255.255.255.128

    Broadcast is 170.70.10.127


    Next network will start at 170.70.10.128. 170.70.10.128 through 170.70.10.254
    are still unused!


    At the beginning, we determined how many bits, which is the first step. Here was
    easy- we found where we could fit 50 bits

    on the bit counting line, but notice that in a way we counted from the right side.
    Provisioning networks instead of hosts,

    we have to figure out how many bits will we need, and then count from the LEFT,
    adding to the original network numbers,

    borrowing from host bits.'
