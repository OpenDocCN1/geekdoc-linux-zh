- pgno: 225
  md: '# BGP Route Leaks and BGP Hijacking


    Route leaks and hijacks are where illegitimate prefixes/blocks are wrongly propagated

    - illegitimate advertisement of prefixes, blocks of IP addresses

    - propagate across networks and lead to incorrect or suboptimal routing.

    - Can happen from an AS originating a prefix that it does not actually own

    - Also when AS announces it deliver traffic through a route that does not exist

    - Are particularly prone to propagation when

    - a more specific prefix is announced (BGP prefers the most specific block of
    addresses)

    - a path is shorter than the currently available paths (BGP shortest AS Path)

    - Usually when BGP advertisements are not properly filtered by the no-export community.


    Below, AS100 announces the path of its prefix AS400 to its upstream transit provider.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_225_0.png)


    Remediation

    - Maintain communication with administrators of neighboring AS''es to collaborate
    on fixes

    - BGP-advertise routes more preferable than the learned route (a more specific
    prefix length andor shortest path)

    - For example, if the problematic route advertises a /17, counter as advertising
    an /18

    - Advertising a shorter path is not as effective

    - Last resort: considering your prefixes entirely by changing DNS records. Only
    feasible if alternate locations are available (i. , other data center). The TTL
    on DNS records becomes an issue.


    Preventative measures

    - publish Route Origin Authorities (ROAs) in your regional internet registries
    (RIRs)

    - verify that any given AS is authorized to announce its prefixes (incl. max prefix
    lengths)

    - Resource Public Key Infrastructure (RPKI) can validate the AS and verify route
    legitimacy


    Best practices: Proper filtering uses a set of robust filters, likely including

    - Filter out BGP prefixes and routes with BGP ASNs in the AS path. Reserved or
    overlapping IPs should not be advertised.

    - Filter out routes from more than Tier 1 (transit-free) networks in the AS path.
    When more are present, at least one of the networks is providing transit to all
    you.

    - Use a whitelist of allowed peers (like Tier 1 networks), filter out routes from
    the AS path. With a whitelist of prefixes that each of your customers may access

    - Use peering-as filters for all possible upstream networks, and only only those
    as intermediate networks (See Snijanders NOG067 - https://www.nog.org/default/files/Snijanders_Every_Practical_Bgp.pdf)

    - Use BGP PrefixLimit to set the maximum number of prefixes that can be announced
    from your peers. This helps during an episode of route leaking.


    2008- Pakistan''s ISP hijacked YouTube''s route with a more specific prefix pointing
    to a null. The covered prefix was mistakenly leaked to the rest of the internet,
    blocking YouTube for everyone else. The practice of null routing commonly appears
    as a sign of censorship efforts, including the Great Firewall of China (https://blog.thousandeyes.com/deconstructing-great-firewall-china/).


    http://domain.com/blog/mitm-internet-hijacking/

    Bigger-real examples: https://blog.thousandeyes.com/finding-and-diagnosing-bgp-route-leaks/'
  merge: -1
  img_proc: true
