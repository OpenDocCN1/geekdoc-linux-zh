    - Monitoring: Packet capture and output to text files for further processing by
    third party tools.

    - Attacking: Packet attacks, deauthentication, and access points and points via
    packet injection.

    airbase-ng - Configure access points

    aircrack-ng - Wireless password cracker

    airdecap-ng - Decrypt WEP/WPA2 capture files

    airmon-ng - Removes WEP masking from a pcap file

    airriver-ng - Provides status about the wireless drivers on your

    airplay-ng - Primary function is to generate traffic for the later use in aircrack-ng

    airmon-on and airmon-zc - This script can be used to enable monitor mode on wireless
    interfaces

    airdump-ng - For packet capturing of raw 802.11 files

    airdump-ng-oui-update - Downloads and parses IEEE OUI list

    aire - Designed to store and manage ssid and password

    airserv-ng - A wireless card server

