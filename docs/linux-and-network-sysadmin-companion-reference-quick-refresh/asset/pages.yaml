- pgno: 214
  md: '# Overview of Specific BGP Attributes


    The weight attribute is a proprietary Cisco attribute

    - configured locally on a router and is not propagated to any other routers.

    - applies when one router is used with multiple exit points out of an autonomous
    system

    - (local preference attribute is used when two or more routers provide multiple
    exit points)


    Routes with a higher weight are preferred when they reach the same destination.

    [value ranges from 0 to 65,535, 0 for learned routes, and 32,768 for locally injected
    routes]

    By default, the weight attribute is 32,768 for that router originates, and 0 for
    other paths.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_214_0.png)


    Houston(config)#router bgp 300

    HHouston(config-router)#neighbor 192.168.77.1 remote-as 100

    HHouston(config-router)#neighbor 192.168.77.1 weight 2000

    HHouston(config-router)#neighbor 192.168.219.1 remote-as 200

    HHouston(config-router)#neighbor 192.168.219.1 weight 1000


    Has Houston forward traffic to the 172.16.10.0 network through AS 100, because
    the routes entering AS 300 from AS 100

    have a higher weight attribute set compared to that routes advertised from AS
    200.

    When a router receives a BGP Update, that router can select the Weight either
    selectively, per route, using a route map, or for all

    routes learned from a single neighbor'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Local Preference Attribute


    - use force routers to prefer one exit point over leaving the AS

    - value is between 0 and 249,496,729. Higher is preferred, default is 100

    - It is local to the AS; it is exchanged with BGP peers - not advertised to eBGP
    peers.

    - Recall that BGP does not allow a router to advertise BGP-learned routes to iBGP
    peers


    ```

    Houston(config)#router bgp 256

    Houston(config-router)#neighbor 172.16.1.1 remote-as 100

    Houston(config-router)#neighbor 10.1.1.2 remote-as 256

    Houston(config-router)#bgp default local-preference 150

    Galveston(config)#router bgp 256

    Galveston(config-router)#neighbor 172.17.1.1 remote-as 300

    Galveston(config-router)#neighbor 10.1.1.1 remote-as 256

    Galveston(config-router)#bgp default local-preference 200

    ```


    Based on these two configurations, traffic for a remote network that can be reached
    through autonomous system 256 will be routed through Galveston.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_215_0.png)


    Using AS_PATH Access Lists with Route Maps to Manipulate the Local Preference
    Attribute

    Route maps provide more flexibility than the bgp default local-preference router
    configuration command.

    Houston(config)#router bgp 256

    Galveston(config-router)#neighbor 172.17.1.1 route-map SETLOCAL

    - reference route map SETLOCAL

    Galveston(config-router)#neighbor 10.1.1.1 remote-as 256

    Galveston(config)#ip path-access-list 7 permit *300

    - match as-path 7 permits updates where AS_PATH starts and ends with 300 (* and
    &)

    Houston(config-router)#route-map 10

    - creates route map SETWEIGHT, sequence number of 10

    Galveston(config-route-map)#match as-path 7 match BGP ACL 7

    Galveston(config-route-map)#set local-preference 200

    - assigns local pref of 200 to allow coming from autonomous system 300

    Galveston(config-route-map)#route-map SETLOCAL permit 20

    - close route map SETLOCAL to allow all other routes.


    In this example, using the route-map command, only updates received from AS 300,
    as specified in the ip as_path-list command, will have a local preference set
    to 200.

    Through the neighbor route-map command; in option is required for updates from
    an eBGP peer'
  merge: -1
  img_proc: true
- pgno: 216
  md: "# AS_PATH Attribute Prepending\n\nAS paths can be manipulated by prepending,\
    \ or adding extra ASNs to the AS_PATH. By this attribute's criteria, shortest\
    \ AS_PATH is preferred; making it longer advertises it as a less viable route.\n\
    \n```\nHouston(config)#router bgp 300\nHouston(config-router)#neighbor 192.168.219.0\
    \ remote-as 200\nHouston(config-router)#neighbor 192.168.220.2 remote-as 200\n\
    Houston(config-router)#neighbor 192.168.72.2 remote-as 100\nHouston(config-router)#neighbor\
    \ 192.168.72.2 route-map SETPATH out\n  - all routes out of 192.168.72 are filtered\
    \ with SETPATH route-map\nHouston(config-router)#route-map SETPATH permit 10\n\
    \  - set add 300 times to the AS_PATH before prepending to 192.168.72.2\n```\n\
    \nIn this scenario, you want to use the configuration of Houston to influence\
    \ the choice of paths in AS 600. Currently, the routers in AS 600 have reachability\
    \ information to the 192.168.219.0/24 network via two routes: AS 100 with AS_PATH\
    \ attribute of (100, 300), and AS 400 with AS_PATH attribute of (400, 200, 300).\
    \ Assuming that the values of all other attributes are same, the routers in AS\
    \ 600 will pick the shortest AS_PATH attribute: the route through AS 100. Then,\
    \ prepend, or add extra ASNs to the AS_PATH attribute for Houston to AS 100 to\
    \ have AS 600 select AS 400 as the preferred path of reaching the 192.168.219.0/24\
    \ network.\n\n![](img/4541d1f2c9832b9303a6df6c929f86f6_216_0.png)\n\nThe result\
    \ of this configuration is that, AS_PATH attribute of updates for network 192.168.219.0/24\
    \ AS 600 receives via AS 100 will be (100, 300, 300, 300), which is longer than\
    \ the value of the AS_PATH attribute of updates for network 192.168.219.0 that\
    \ AS 600 receives via AS 400 (400, 200, 300).\nAS 600 will choose AS 400 (400,\
    \ 200, 300) as the better path."
  merge: -1
  img_proc: true
- pgno: 217
  md: "# AS_PATH: Removing Autonomous Systems\n\nPrivate ASNs (64,512 to 65,535) cannot\
    \ be passed on the Internet because they are not unique. remove-private-as, to\
    \ strip private ASNs out of the AS_PATH list before advertised\n\n![](img/4541d1f2c9832b9303a6df6c929f86f6_217_0.png)\n\
    \n```\nRTB(config)#router bgp 1\nRTB(config)#router neighbor 172.16.100.2 remote-as\
    \ 65001\nRTB(config)#router neighbor 198.133.219.1 remove-as 7\nRTB(config)#router\
    \ neighbor 192.168.133.1 remove-private-as\n```\n\nMED Attribute (Multi-Exit Discriminator)\n\
    Also called the BGP metric, indicates the preferred path is into an AS between\
    \ eBGP neighbors.\n- AS AS specific value describing that hop- is not later to\
    \ the next peer.\n- A lower value is preferred over a higher value.\n- The default\
    \ value is 0. Change the default using the default-metric\n- By default, only\
    \ for paths from neighbors in the same AS. Override with bgp-compare-med\n\nBelow,\
    \ for routes AS 300 to choose from Houston and Galveston. This is where MED is\
    \ used by default (it is intended for), so it won't be looked at in the case of\
    \ AS 400 (Acapulco) unless is specifically told to\n\n![](img/4541d1f2c9832b9303a6df6c929f86f6_217_1.png)\n\
    \nExample: influence own router to choose Houston as the entry point for AS 300\
    \ to reach 192.168.100.0.\n\n```\nMazatlan(config)#router bgp 100\nMazatlan(config)#router\
    \ neighbor 10.2.0.1 remote-as 300\nMazatlan(config)#router neighbor 10.3.0.1 remote-as\
    \ 300\nMazatlan(config)#router neighbor 10.4.0.1 remote-as 400\nAcapulco(config)#router\
    \ bgp 400\nAcapulco(config)#router neighbor 10.4.0.2 remote-as 100\nAcapulco(config)#router\
    \ neighbor 10.4.0.2 route-map SETMEDOUT out\n  - create route map SETMEDOUT\n\
    Acapulco(config)#router neighbor 10.5.0.1 remote-as 300\nAcapulco(config)#route-map\
    \ SETMEDOUT permit 10\n  - create route map SETMEDOUT sequence number of 10\n\
    Acapulco(config)#route-map SETMEDOUT set metric 50\n  - set MED to 50\n```"
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Houston and Galveston have same setup with relative neighbor route statements.
    Below are MEDs they set:


    ```

    Houston(config-router)#neighbor 10.2.0.2-route-map SETMEDOUT

    Houston(config-router)#neighbor 10.1.0.2-route-map-300

    HHouston(config-map)#set metric 120

    Galveston(config-router)#neighbor 10.3.0.2-route-map-100

    Galveston(config-router)#neighbor 10.3.0.2-route-map SETMEDOUT

    Galveston(config-map)#set metric 200

    ```


    Mazatlan can only compare the MED attribute from Houston (120) to the MED attribute
    from Galveston (200) even though the route comes from Acapulco has the lowest
    value. Mazatlan will choose Houston as the best path for reaching 192.168.100.


    ```

    To force Mazatlan to include updates for network 192.168.100.0 from Acapulco in
    the comparison, use the bgp compare-med route map command:

    Mazatlan(config-router)#bgp 100

    Mazatlan(config-router)#neighbor 10.2.0.1-route-map-300

    Mazatlan(config-router)#neighbor 10.3.0.1-route-map-300

    Mazatlan(config-router)#neighbor 10.4.0.1-route-map-400

    Mazatlan(config-router)#bgp always-compare-med

    ```


    Assuming that all attributes are the same, Mazatlan will choose Acapulco as the
    best next hop for reaching network 192.168.100.0.


    The most recent IETF decision about BGP MED assigns value of infinity to a missing
    MED, making that route the least preferred. The Cisco IOS default is the opposite
    - treating routes without the MED attribute as having a MED of 0, making the route
    that is lacking the MED attribute the most preferred.


    +   - To configure the router to conform to the IETF standard, use bgp bestpath-missing-med


    # MED with a dual-homed ISP


    The enterprise can announce a MED that tells the ISP path into the enterprise
    is. As a result, the ISP can discriminate between the multiple exit points from
    ISP to the enterprise. These inbound routes into the enterprise from the ISP typically
    consist of one, or a few, public IP address ranges. An enterprise engineer prefers
    the top BGP as the best path to use for inbound routes (MED 10), and the bottom
    connection last (MED 30)


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_218_0.png)


    Step 1. E1 and E2 advertise 128.107.0.0/19, setting MED with outbound route map,
    to various settings: MED 10 sent by E1 to I1-1, MED 20 sent by E1 to I1-4, and
    MED 30 sent by E2 to I1-4.

    Step 2. I1-1 and I1-4 have an IBGP connection, so they learn each other''s routes
    and agree as which route wins based on MED.

    Step 3. I1-1 and I1-4 also tell the other routers inside ISP1, causing all inbound
    traffic to tunnel toward Router I1-1. (Remember MED is advertised by one AS into
    another, propagated within the AS, but not sent to another AS.)'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'Note that Routers I-1 and I-4 in this example could have chosen a better route
    based on the earlier best-path steps. However, a brief analysis of the steps tells
    us that unless someone makes an effort to override the effects of MED, these routers''
    best-path algorithms will use MED. Assuming that the enterprise and ISP agree
    to rely on MED, the earlier best-path steps should not matter.


