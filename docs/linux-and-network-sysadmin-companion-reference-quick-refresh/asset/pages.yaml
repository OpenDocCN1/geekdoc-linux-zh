  md: "# Logging\n\nSystem calls are filtered by SELinux to see if allowed.\nIf not,\
    \ an denied message is generated through audit, which writes to /var/log/audit/audit.log\
    \ (config file is\netc/audit/auditd.conf) If SELinux is enforcing, action stopped,\
    \ permissive it is allowed, but logged. For example, when a web\nbrowser for /httpd\
    \ denied access to /var/html/index.html syscall is issued. When the label, SELinux\
    \ enforcing stops it\nther. You can also see the error in the Audit alerts of\
    \ audit\n\nFor a sample denial in logs, running 'grep /var/log/audit/audit.log'\
    \ you will see something like this:\ntype=AVC msg=3 audit(1713909238.423): denied={\
    \ open (r) } res=0 pc=7237 target=\"var/www/html/index.html\" dev=\"dm-1\"\nen=28668713\
    \ source=system_object_r_httpd_t0 context=system_object_r_httpd_sys_t0 class=tclass\n\
    \nDeciphering the above line:\n\nType of message denied by epoch timestamp, there\
    \ has been an AVC denied on (open) operation.\n/var/www/html/index.html type=7237,\
    \ the command=\"dm-1\", with number 28668713. The access occurred at path\n\n\
    The source context (context) is system_object_r_httpd_sys_t0, indicating the SELinux\
    \ label associated with the file.\ntarget context is system_object_r_httpd_t (the\
    \ role, and type), with the source context representing the program\n(httpd) and\
    \ the target context representing the item of being accessed.\n\nIn this case,\
    \ httpd has accessed files labeled as system_object_r_httpd_sys_t0, but the file\
    \ has been accessed as\nsystem_object_r_httpd_sys_t0, which doesn't match.\n\n\
    If you run 'ausearch -i /var/log/audit/audit.log', you will see something like\
    \ this:\n\n```\nSELinux avc denied for (open) access on the file index.html.\n\
    *\\*\\*\\*\nPlugin (72.4 confidence) suggests\n*\\*\\*\\*\\*\\*\\*\\*\\*\\*\n\
    If you want httpd to open index.html\nThen you need to change the file context\
    \ to system_object_t_t0\n# comment context-a=t_httpd_sys_t=/var/www/html/index.html\n\
    *\\*\\*\\*\n# restore -v /var/www/html/index.html\n*\\*\\*\\*\nAllowing Access:\n\
    Do\n# comment context-a=t_httpd_sys_t=/var/www/html/index.html\n# restore -v /var/www/html/index.html\n\
    Additional Information:\nSource Context\tsystem_object_r_httpd_t0\nTarget Context\t\
    system_object_r_httpd_sys_t0\nTarget Objects\t/var/www/html/index.html [ file\
    \ ]\n```\n\n# Audit Tools\n\n```\n# ausearch -a\nAVC Report\n# date time comm\
    \ subj syscall per obj result event\n1/02/2020 20:52:51 ? audit (null) (0) (null)\
    \ (null) unset 745\n2/02/2020 22:35:35 ? audit (null) (0) (null) (null) unset\n\
    3/01/2020 10:24:41 auditd system_object_r_httpd_sys_t0 49 socket_name=bind_system=system_object_r_websm_port_t0\
    \ denied 1144\n4/01/2020 10:24:41 auditd system_object_r_httpd_sys_t0 49 socket_name=bind_system=system_object_r_port_t0\
    \ denied 0\n```\n\nLogged events in the last 3 days\nAll executable file events\n\
    Summarize execution files\nAll failed for users\nAll failed attempts per each\
    \ user\nAll audit files that are queried and they included\nuserarchd's file access\
    \ events, make report\naudit logins with login times\n\n+   - auselog\nLast information\
    \ of users\nausearch\nConverts between system call #$ and names\nauvirt\nList\
    \ virtualization-related audit records\naudit\nagenrules\nGenerates rules from\
    \ file for the audit framework\nareport\nGenerates summary reports from audit\n\
    search\nSearch the audit logs for specific events\ntrace\nTraces execution of\
    \ a program, capturing system calls\n\n![](img/4541d1f2c9832b9303a6df6c929f86f6_45_0.png)"
