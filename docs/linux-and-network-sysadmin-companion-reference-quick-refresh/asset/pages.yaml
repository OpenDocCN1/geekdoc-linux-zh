- pgno: 78
  md: '# Schedule Transfers During Off-Peak Hours


    While named doesn''t directly schedule transfers initiated by secondary servers,
    you can achieve a similar effect on the primary server. The transfer-service specifies
    the IP address the server uses for initiating outgoing transfers. You can combine
    this with firewall rules to restrict outbound traffic during peak hours, influencing
    transfer timing.


    zone "yourdomain.com"

    transfer-source { 10.0.0.1 }; // Replace with appropriate IP for outbound transfers

    };


    A safer easier method would be to leverage cron to schedule it

    This example uses a cron job to reload the BIND service to initiate a transfer
    during off-peak hours:


    ```

    # Edit the cron job for the BIND service (usually named bind)

    sudo crontab -u bind

    # Add the following line to schedule a transfer at 2:00 AM

    0 2 * * * /usr/sbin/rndc reload example.com

    ```


    # DNSSEC Key Pairs, ZSK and KSK, Secure Zone Transfers


    Key Creation: dnssec-key, tsig-key

    Generate Zone Signing Key (ZSK)


    ```

    # Generate a Zone Signing Key -n example.com

    dnssec-keygen -RSASHA256 -p 2048 -n example.com

    # Generate Key Signing Key (KSK) which validates DNSKEY records

    dnssec-keygen -RSASHA256 -p 4096 -f KSK example.com

    ```


    # This will create file keys with .key and .private extensions. These keys are
    used for signing the zone,

    tsig-key -hmac-sha256 tsig.key /etc/bind/tsig.key

    # This will create the TSIG file for actual zone transfers


    Signing the zone file, named.conf

    dnssec-signzone -o example.com -K example.com +008+12345 example.db

    -o example.com (zone domain), -K example.com +008+12345 (the KSK) example.db (zone
    file to sign)


    ```

    # Put keys and signed zone file in named.conf

    zone "example.com"

    type master;

    file "zones/example.db.signed"; // Use the signed zone file

    allow-transfer { key = /etc/bind/tsig.key }; // Secure transfers - reference key
    defined in tsig_key.conf

    notify yes; // Enable notifications

    also-notify { 192.168.1.10 }; // Secondary server to

    inline-signing yes; // Enable signing for automatic DNSSEC

    auto-dnssec; // Automatically maintain DNSSEC records

    max-transfer-time 60; // Limit the transfer time to 60 seconds

    transfer-format many-ansays; // Optimize transfer for efficiency

    };

    ```


    # Setting up secondary server


    Copy keys and zone file(s) from the primary

    scp /var/named/zones/example.com.db.signed /var/named/zones/example.com.db.signed

    scp /var/named/keys/example.com.+008+12345 key.key /var/named/keys/example.com.+008+12345
    key.key

    scp /etc/named/tsig.key.conf /etc/named/tsig.key.conf

    scp /var/named/keys/example.com.db.signed /var/named/keys/example.com.db.signed


    I am copying all manually to start without fresh (copy next on secondary). ZSK
    and KSK are managed on the primary, the secondary server only gets public keys
    to verify signatures, which are in DNSKEY records during zone transfers. Auto-dnssec
    and inline-signing features simplify this by managing keys and signatures automatically.


    ```

    type slave;

    file "zones/example.db.signed";nmasters { 192.168.1.1 }; // IP of the primary
    server

    alallow-notify { 192.168.1.10 }; // Allow notifications from the primary server

    key { /etc/bind/tsig.key.conf }; // Referencing the TSIG key for secure communication

    };

    ```


    Above the secondary server has also been given the line to get notifications from
    the primary. The lines for the primary were already added here, you''ll need these
    three lines in for:


    ```

    allow-transfer { key = /etc/named/tsig.key.conf }; // Secure transfers - reference
    key defined in tsig_key.conf

    notify yes;

    also-notify { 192.168.0.2 }; // Secondary server IP

    ```


    *'
