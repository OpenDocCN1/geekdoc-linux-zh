- pgno: 147
  md: "# Host Addressing: SLAAC and IPv6 (RFC 2373)\n\nStateless Auto-Configuration\
    \ (SLAAC) enables hosts to generate a unique address on their own. For this router\
    \ sends out a Router Advertisement (RA) periodically, and can send a Router Solicitation(RS)\
    \ to trigger an RA. The RA has the prefix and length to use, default gateway.\
    \ Before using the address, the host uses Duplicate Address Detection (DAD) to\
    \ make sure it's unique. Since DNS servers aren't in RA, DHCPv6 is still used.\
    \ (DAD takes the place of ARP in IPv6)\n\nFor the interface, the host uses a EUI-64\
    \ (Extended Unique Identifier) from the interface's MAC address (most likely),\
    \ or can optionally generate it. The EUI-64 creation works like this:\n\n+   1.\
    \ Split the (12-hex digit) MAC address in down the middle.\n2. Insert FFEFF between\
    \ the two halves.\n3. Invert the third bit of each byte.\n\nExamples:\nInterface\
    \ MAC address is aaa12:bbcc:d1234\n10101010 represents the first 8 bits of the\
    \ MAC address (aa) - the 7th bit it becomes 10101000.\nThe RA is A8 and the EUI-64\
    \ is: 2001:0db8:0:1a812:bbcc:fe1234 EUI-64\n\nMAC address 03b4:ba:1234\n0 in binary\
    \ is 00000011, the first 8 bits of the MAC address, which becomes 00000001\nThe\
    \ RA is 06, and the EUI-64 is: 2001:0db8:0:1934:baff:fe12:1234 EUI-64\n\nGenerating\
    \ EUI-64 is usually done for you:\nipv6 address 2001:0db8:1111:1111::64 eui-64\n\
    \n```\ninterface GigabitEthernet0/0\n ipv6 address 2001:0db8:1111:1111::64 eui-64\n\
    interface serial0/0\n ipv6 address 2001:0db8:1111:2::64 eui-64\n show ipv6 interface\
    \ brief\nfe80::ff:fe01:101 <---link-local, eui64\n2001:0db8:1111:1:0:fe:01:101\
    \ <---EUI64 global unicast address\nSerial0/0 (up/up)\nfe80::ff:fe01:101\n2001:0db8:1111:2:0:ff:fe01:101\n\
    ```\n\nCisco router, setting up SLAAC\n\n```\nenable\nRouter#configure terminal\n\
    Router(config)#ipv6 interface\nRouter(config-if)#ipv6 unicast-routing\nRouter(config-if)#ipv6\
    \ address [prefix]/prefix-length\nRouter(config-if)#no shutdown\n```\n\nProblems\
    \ with EUI-64\n\nIt has been pointed out that a user cannot connect directly to\
    \ any network if someone knows the EUI-64 identifier of that device, which could\
    \ be exploited as websites and apps using IPv6 identifier of a particular device\
    \ (whether malicious, monitoring, or benign). It is recommended that if the host\
    \ or router does not support autoconfig with Random Identifiers, that static IPv6\
    \ address should be used. (MS Windows generates by default a random ID for SLAAC)\n\
    \nBest answer to how to make random id instead of EUI-64:\nhttps://superuser.com/questions/243669/how-to-avoid-exposing-my-mac-address-when-using-ipv6"
  merge: -1
  img_proc: true
