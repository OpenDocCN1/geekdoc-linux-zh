- pgno: 239
  md: '# Transparent access to remote resource on a private network


    Let''s say there''s a repository on a private network that''s only accessible
    through a private server on the network. This server is not accessible to the
    public internet. You have direct access to the server, but don''t have VPN access
    to the private network.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_239_0.png)


    For convenience, you''d like to access this git repository if you were connecting
    to it directly from your local system. If you have SSH access to another server
    that''s accessible from your local system and the private server, you can accomplish
    this by establishing an SSH tunnel and using a tunnel of ProxyCommands directives.


    ```

    ssh -L 127.0.0.1:2222:127.0.0.1:2222 intermediate-host

    This forwards port 2222 from intermediate-host to port 22 on the private server.

    ```


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_239_1.png)


    Now, if you SSH to port 2222 from intermediate-host, you''re connecting to the
    SSH server on the private server despite the private server being accessible by
    the public internet.


    ```

    ssh -p 2222 user@localhost

    Now you can access the git repository as if you were on the private network.

    ```


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_239_2.png)


    If you''d like to make the backdoor even more convenient, you can add some directives
    to your local ~/.ssh/config:


    ```

    Host git.private.network

    HostName git.private.network

    ForwardAgent yes

    ProxyCommand ssh nc %h %p

    ```


    ```

    Host private

    HostName localhost

    Port 2222

    User private-user

    ForwardAgent yes

    ProxyCommand ssh tunnel@intermediate-host nc %h %p

    ```


    # SSH command-line flags


    +   -f Forks the ssh process into the background

    -n Prevents reading from STDIN

    -N Do not run remote commands. Used when only forwarding ports

    -T Disables TTY allocation


    Here''s an example of a command you would run to create an SSH tunnel in the background
    that forwards a local port through the ssh server:


    ```

    ssh -fNT -L 127.0.0.1:8080:example.org:80 ssh-server

    ```


    In some misconfigured systems using SSH you may not be able to gain a shell via
    ssh but you can port forward and such. There is an article discussing that: https://www.pixeltech.net/article/132852389-SSH-Security-and-You--bin-false-is-%2Anot%2A-security'
  merge: -1
  img_proc: true
