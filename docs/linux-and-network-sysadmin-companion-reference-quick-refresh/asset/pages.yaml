  md: '# Using Ps to Inspect Processes


    The ps command syntax styles. BSD style - options are not presented by dash (ps
    aux); UNIX/LINUX style -

    options are presented by a dash (ps -ef) "ps" is not the same as "ps -ax". "u"
    is used to show process of

    user, but "n" shows detailed information in the other mode. When used in Linux:

    example as "ps -f". Finally, options use the GNU style with double-dashes preceding
    a word, like --forest.


    Most often used is display processes. The "u" or "f" options provide more detailed
    info


    ```

    $ ps ax --or - ps ax

    $ ps -ef --or - $ ps -ef Using -f can sometimes be more effective than -f

    ```


    Other options (there are many):


    Piping to get info using the -C option can be more convenient

    Fields for sort -o options are available in the management section "Standard Format
    Specifications" (there are those)

    Rename the columns using the format "-o pid,user=USERNAME,cpu=USAGE,pmem,comm"

    When listing usernames, if the length is greater than 8 characters it will show
    the UID instead of username.

    As usual to "test" the list width. Sorting or remember to consider piping to head
    5 or tail -5 as needed, etc.


    Process attributes to query by sort, or by:


    The man page lists attributes you can interact using ps. Here are some of the
    commonly used ones:

    pid, comm (with the command name), cmd (with all arguments as a s), uname (username

    running process), pmem (percent of physical memory used), pcpu (percent of CPU
    used), nice (niceness value), etime (elapsed running time), state (one letter
    code), stat (multiple process state code listing)


    ```

    [root@localhost ~] ps aux

    P TID STAT TIME COMMAND

    1 ? S 0:00 init [5]

    2 ? S 0:00 [migration/0]

    2438 tty S+ 0:00 /sbin/mingetty ty

    2439 tty S+ 0:00 /sbin/mingetty ty

