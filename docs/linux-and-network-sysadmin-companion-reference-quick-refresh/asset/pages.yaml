  md: '# Docker Primer / Command Overview


    After 2017, most commands take the form of [command] [subcommand], being more
    specific to the intended item, (i.e., `docker container ...`; or `docker image
    ...`). Prior to these, commands such as `docker [command] [identifier]` were used,
    often pertaining to: docker attach, build, commit, cp, create, diff, events, exec,
    export, history, images, import, inspect, kill, load, login, logout, logs, port,
    ps, pull, push, restart, rm, mi, run, save, search, stats, stat, top, update,
    version, wait, etc.


    Below, with commands with names similar to Unix/Linux commands that name will
    not be explained (unless needed), their actions are predictable in context. prune
    always means unused.


    # System Information


    +   - docker events | info | df | prune | inspect | version | Displays system-wide
    info, events in realtime.

    - docker volume create | inspect | ls | rm | prune | update | Manage volumes that
    can use for data (persistent storage)

    - docker trust inspect | revoke | sign | key [generate] | load | signer [add]
    | remove

    - docker secret create | version | Checks layers for CVEs and give measures (or
    known secure images)

    - docker search | Search Docker Hub for images


    # Managing networks.


    +   - docker network create | ls | rm | prune | inspect | disconnect

    - docker container port


    # Container-specific commands


    +   - docker container start | stop | restart | rm | rename | run | kill | prune

    - docker container top | ps | stats | logs | port

    - docker container pause | unpause | Refers to processes within one or more containers

    - docker container exec | Execute a command in a running container

    - docker container cp | Copy/files between a container and the local filesystem

    - docker container diff | Inspect changes to files or directories on a container''s
    filesystem

    - docker container attach | Attach local input/output stream to a running container

    - docker container export | Export a filesystem as a tar archive

    - docker container commit | Create an image from a container''s changes

    - docker container update | Update information of one or more containers

    - docker container inspect

    - docker container wait | Blocks(s) until they stop, then return their Codes


    # Image-specific commands


    +   - docker build | Build images from a Dockerfile

    - docker image inspect | history | Tag adds a label

    - docker image ls | rm | prune | tag | Actions with local registry/repo

    - docker image pull | push | Load/Save to tarball or stdin. See docs for import
    and load

    - docker image tag | Create a TARGET that refers to SOURCE_IMAGE

    - docker image login | Note: To log in, use `docker login` to pull from a registry


    # Docker Compose commands (definition and multi-container applications)


    +   - docker compose build | Build or rebuild services

    - docker compose config | Parse, resolve and create compose file

    - docker compose start | stop | restart | rm | rename | run | kill |n- docker
    compose cp | exec | ls | ps | top | version | events | logs | push | | Same as
    the container equivalents

    - With Compose, it lists projects and lists images containers use

    - docker compose up | down | Starting to and stop/remove containers, networks

    - docker compose pause | unpause | Returns to the running containers of a service


    # Docker Build and Builder-X (BuildKit)


    +   - docker builder prune | Build an image from a Dockerfile, removes the build
    cache

    - docker buildx bake | build | Bake orders from a build file, directs to a build
    stage

    - docker buildx imagools inspect | Create a new image based on source images;
    show details of an image

    - docker buildx use | create | ls | rm | stop | inspect | jdu | Apply to a builders
    instances; removes cache


    +   - docker plugin create | disable | install | ls | rm | inspect | upgrade |
    push

    - docker plugin set | -change settings (not a type)

    Plugins extend Docker''s functionality and help users connect with other popular
    services

    Create a plugin from a roofs and configuration. Plugin data directory must contain
    config.json and roots directories.'
