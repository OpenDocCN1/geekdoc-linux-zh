- pgno: 197
  md: 'Below, 150 is the administrative distance goes if you want to override the
    default. This is set here because in the next example, we will add RIP, and using
    150 (rather than the default of 1) means we won''t have to remove static routes-
    RIP (120) will just override.


    # Administrative Distances (the smaller # wins out):


    | Connected | OSPF | 110 |

    | --- | --- | --- |

    | Static route | RIP | 120 |

    | EIGRP summary | 5 | BGP | 200 |

    | eBGP | 20 | Unknown | 255 |

    | EIGRP | | |


    ```

    Central(config-router)#rip 192.168.0.10/255.255.255.172.16.10.2 -- use the it
    out

    Central(config-router)#rip 192.168.0.20/255.255.255.0 -- use an interface out

    ```


    ```

    DFW(config-router)#rip 10.10.10.50/255.255.255.0 172.16.10.151

    DFW(config-router)#rip 172.16.10.45/255.255.255.252 172.16.10.151

    DFW(config-router)#rip 192.168.0.20/255.255.255.0 172.16.10.151

    ```


    ```

    HOU(config-router)#network t

    HOU(config-router)#rip 10.10.10.50/255.255.255.0 172.16.10.151

    HOU(config-router)#rip 172.16.10.45/255.255.255.252 172.16.10.151

    HOU(config-router)#rip 192.168.0.20/255.255.255.0 172.16.10.151

    ```


    A stub indicates that the networks in this design have only one way to reach all
    others; use only a default route. Here''s an alt config instead of typing in the
    static routes. to make this a "stub network" (first we turn out the routes that
    we configured):


    ```

    HOU(config-router)#network 10.10.10.50/255.255.255.0 172.16.10.151

    HOU(config-router)#network 172.16.10.45/255.255.255.252 172.16.10.151

    HOU(config-router)#network 192.168.0.20/255.255.255.0 172.16.10.151

    HOU(config-router)#network 0.0.0.0 0 172.16.10.151

    ```


    # Convert Static IPv4 to Dynamic IPv4 RIPv2


    As a shortcut, you can directly connect connected networks to know what to configure
    RIP with:


    | Interface | IP-Address | OK? | Method | Status | Protocol |

    | --- | --- | --- | --- | --- | --- |

    | FastEthernet/0 | 10.10.10.1 | YES | manual | up | |

    | Serial/0 | 172.16.10.1 | YES | manual | up | |

    | FastEthernet/1 | unassigned | | unset | admin. down | |

    | Serial/1 | 172.16.10.5 | YES | manual | up | |


    When we declare our routes in RIP, we need to refer to them in a clear way instead
    of the specific subnet. This is illustrated below. RIP then filters the subsets
    and fills in the routing table (RIP is NOT a classy routing protocol btw).


    ```

    Central(config-router)#network 10.0.0.0

    Central(config-router)#network 172.16.0.0

    Central(config-router)#version 2

    Central(config-router)#no auto-summary

    ```


    Add the default static route, and enter RIP to set default-interface to propagate
    it.


    ```

    Central(config-router)#route 0.0.0.0 0.0.0.0 Fa0/0

    Central(config-router)#rip

    Central(config-router)#default-information information

    ```


    ```

    DFW(config-router)#network 192.168.0.0

    DFW(config-router)#network 172.16.0.0

    DFW(config-router)#version 2

    DFW(config-router)#no auto-summary --disabling auto-summary makes RIP look at
    our subsets

    DFW(config-router)#do ip route

    ```'
  merge: -1
  img_proc: true
