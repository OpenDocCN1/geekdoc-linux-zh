  md: '# Layer 3 - Network/ Internet Layer - IPv4, IPv6, IPX, IPSec, ICMP.


    Has many features: logical addressing, routing (forwarding). Routing defines how
    devices (typically) forward to their final destination. Logical addressing defines
    how each device can have an address that is used by the routing process. Path
    determination does the work by routing protocols to allow all possible routes
    and determine the best way to move data. The network layer handles two types:
    data packets and route update packets. Ultimately, Layer 3 doesn''t care where
    a host is located- only where networks are and the best way to reach them.


    IPv4 (below) has more on in the following pages, in the form of a subnet chart
    and worksheet on subnet.


    | Bit 0 | Bit 4 | Bit 15 | Bit 31 |

    |---|---|---|--|

    | Version Header | length (4) | Priority of Service (8) | Total length (16) |

    | Identification (16) | Flags (3) | Fragmented offset (13) | |

    | Time to live (8) | Protocol (8) | Header checksum (16) | |

    | Source IP address (32) | | | |

    | Destination IP address (32) | | | |

    | Options (0 or 32 if any) | | | |

    | Data (varies any) | | | |


    Header length: LEN in 32-bit words.

    Priority/TOS/Precedence: how to handle the data. The first 3 bits are the priority
    bits, called the differentiated services bits.

    Total length: including header and data.

    Identification: Unique value used to differentiate fragmented packets from different
    dat.

    Fragmentation Flags: Specifies whether fragmentation should occur.

    Fragment offset: provides fragmentation and reassembly if the packet is large
    to put in a frame. It accommodates different

    Time To Live: TTL when packet is generated. If it doesn''t get to its go before
    the TTL expires, it drops.

    Protocol: Port of encapsulated payload; for example, TCP is port 6 or UDP is port
    17

    Header checksum: CRC on header.

    Source address: 32-bit IP address of sending station.

    Destination IP address: 32-bit IP address of the station which is destined for.

    Options: For network testing, debugging, security, and more.

    Data: The upper-layer data.


    | IP Header - Internet Protocol Datagram | Flags: %010 Do Not Fragment |

    |---|---|

    | Version: 4 | Fragment Offset: 0 |

    | Header Length: 5 | Time To Live: 60 |

    | Precedence: 0 | IP Type: 0x6 TCP |

    | Type of Service: %000 | Header Checksum: 0xd31 |

    | Unused: %000 | Source IP Address: 10.7.1.10 |

    | Total Length: 180 | Dest. IP Address: 10.7.1.10 |

    | Identifier: 22488 | No Internet Options Options


    Protocols found in the field of IP header.

    ICMP 1, TCP 6, UDP 17, IPv6 41, GRE 88, OSPF 89, L2TP 115

    For more: http://www.iana.org/assignment/protocols


    - IP packets in WiFi have a noticeably larger size, which is to hold not only
    the source and destination IP addresses of the workstation, but also the IP addresses
    of the access points on end we. We may get to that more in the section on WiFi.


    - IPv6 is used toward the end of the routing and switching mechanism, it has a
    lot to talk about those things and the differences in IPv6 v.s. IPv4 (not much
    but it keeps things simpler to explain in IPv4 terms first instead for people
    that might be new to all).'
