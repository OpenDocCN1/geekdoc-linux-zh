- pgno: 124
  md: '# The TCP handshake termination - quick overview:


    The Initial Sequence and Response Numbers (ISN and IRN) are exchanged TCP segments
    during network communication between a client and a server. These are central
    in a SYN flood defense known as SYN cookies.


    Here is a sample session:


    +   1. Client sends a SYN with an ISN of 164682717.

    2. Server replies with a SYN with ISN of 829007136 and an ACK of 164682717. The
    ACK reports the server expects the sequence number in this sequence (164682717)

    3. Client sends an ACK 829007136 to increment the IRN in the SYNACK, which also
    reports it from the server in this sequence (829007136) just like the server expects.


    | | | seq | ack |

    |---|---|---||

    | 1. Client: | SYN | 164682717 | ack 829007136 |

    | 2. Server: | SYNACK | seq 829007136 | ack 164682717 |

    | 3. Client: | ACK | seq 164682717 | ack 829007136 |

    | 4. Server: | ACK | seq 829007136 | ack 164682717 |

    | 5. Client: | ACK | seq 164682717 | ack 829007136 |


    Then later, server terminates the connection:


    | | | seq | ack |

    |---|---|---|||

    | 1. Client: | ACK | seq 164682733 | ack 829008191 |

    | 2. Server: | FIN-ACK | seq 829008199 | ack 164682734 |

    | 3. Client: | ACK | seq 164682734 | ack 829008200 |

    | 4. Server: | FIN-ACK? | seq 164682734 | ack 829008200 (yes, two different responses)|

    | 5. Client: | ACK | seq 164682735 |


    # User Datagram Protocol (UDP)


    There are times when it''s better to use UDP over TCP, one of when reliability
    is already taken care of the upper layers. If the packets arrive out of order,
    which happens in UDP, they''ll simply be pushed to the next layer in order they
    were received, without sequencing or other features TCP provides. A UDP header
    is only 8 bytes (compared to 20 bytes for TCP) - has 4 fields, of which 2 are
    zero. Checksum and checksum are optional in IPv4


    | | |

    |---||

    | Source Port: | 1065 |

    | Destination Port: | 5136 |

    | Length: | 41 |

    | Checksum: | 0x7a3c |

    | UDP Data Area: | 2...00 01 5a 96 00 00 00 00 00 11 00 00 0 |


    # Port numbers for communicating with users


    Ordered data transfer and data segmentation. Ports with numbers 0-1023 are considered
    well-known ports; ports with numbers 1024-49511 are assigned de, and ports with
    numbers 49512-65535 are dynamic, private or ephemeral ports.The source port is
    arbitrary - usually ephemeral port # to port 22 when listening the SSH connection
    on the other end . The virtual circuit is created by the source and destination
    port number plus the destination IP address and called by a socket.


    | 20-FTIP | 110 POP3 | 465 over ssl | 587 SMTP |

    | 22 SSH/SCP | 123 NPT | 636 LDAP over ssl |

    | 23 Telnet | 135 Microsoft RPC | 512 msec | 646 IMAP/IMAPS |

