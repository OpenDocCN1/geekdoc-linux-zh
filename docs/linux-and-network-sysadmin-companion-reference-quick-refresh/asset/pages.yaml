    - a multiplexer combines numbers of a single signal for transmission over the


    # Bulk Data Carrier Types


    Bites to bytes conversions

    A megabit (abbreviated as Mbps, Mbits/s) is a type of data transfer rates up to
    1,000,000 bits per second (this equals 1,000 kilobits per second). Because there
    are 8 bits in a byte, a transfer of 8 Mbps (Bytes) is equal to 1,000,000 bits
    per second (approximately 976 KB/s)

    8 bits = 1 byte; 1,000,000/8=125,000 bytes

    Bytes are made of eight bits, so one equals eight bits

    1 KB per second = 8 Kbps; 1 MB per second = 8 Mbps


    T-1 (US, Canada) and E-1 (Europe)

    Transmission System Level 1 - For connecting, time-division multiplexing. The
    T-carrier system (T1 and T3) refer to transport transport connecting to DS1 and
    DS3. DS0 supported 2.4 kbps/ channels, 48 bits per channels, 5.97 kbbits/ channels,
    56 channels, or 64 bits per channel, where ISDN and SDN are located. The base
    DSO system uses a single voice signal rate called at 64 kbps with bit-rate pulse
    modulation of 80 samples/sec which occurs up to 64kbps


    T1/DS1 - 24 channels (DS0): 64 kbps per channel/1.5Mbit/s total rate, 8 bits per
    forming. E-1 - 22 channels of 0.08 Mbit/s line rate

    T3/E3 - 28 T1s / 672 T1s - 44.78 Mbit/s; E13 = 16 circuits, 512 channels, 33.368
    Mbit/s

    In T/E1 one frame is same as one. Two methods of grouping these frames together:

    Super Frame (SF) combines 1233-bit frames into one. Extended Super Frame (ESF)
    uses 2493-bit frames into one.


