  md: '# # Switchports for Trunking and Access; related display commands


    switchport access vlan mode — defines the VLAN interfaces inside.[dot1q|isl] —
    almost use dot1q - you may have to do this.

    switchport trunk encapsulation [dot1q]

    switchport trunk dynamic auto | dynamic desirable

    dynamic auto — becomes a trunk if the interface is set to trunk or desirable-
    if not auto!

    dynamic desirable — becomes a trunk if neither is set to ANY trunk mode [default]

    switchport none - switchport trunk allowed 4,6,12,15 -- this should allow VLANs
    not specifically specified

    switchport trunk allowed [remove 4-8 | all]

    no switchport trunk native

    switchport trunk vlan 4

    switchport trunk pruning vlan [accept | except | none] | remove-vlan Specify VLANs
    eligible for pruning


    ## Proper way to remove VLANs from switch

    If you delete a VLAN from switch with "no vlan 30", it won''t disappear from the
    interface that it was configured

    added to it will remain in the switch configurations! (and cause fusion) Run,
    on those interfaces "switchport trunk

    allowed vlan remove 30" or "switchport allowed 10,20,40,50" then "no vlan 30"
    on the switch to remove it.


    show interfaces [#f] switchport — settings, status, trunking, access/voice/native
    VLAN

    show interfaces [#f] switchport — lists info on trunks (or the specific trunk)
    and the VLANs

    show vlan brief — each VLAN and assigned ports, but no trunks!

    show [vlan] — access and trunk ports in the VLAN

    show status — VTP mode, configuration and status info


    # ### Expecting Operational Mode Based on the Configured Operational Modes with
    DTP


    | Administrative Mode | Access | Dynamic Auto | Trunk | Dynamic Desirable |

    | :--- | :--- | :--- | :--- | :--- |

    | access | Access | Access | Access | Access |

    | dynamic auto | Access | Trunk | Trunk | Trunk |

    | trunk | Access | Trunk | Trunk | Trunk |

    | dynamic desirable | Access | Trunk | Trunk | Trunk |


    ### Port Security

    As soon as enable port-security, it defaults to violation shutdown and a maximum
    of 1 MAC address.

    switchport port-security interface

    switchport port-security violation restrict

    switchport port-security mac-address ba.bb.cc.de.ff [sticky, often used with maximum]

    switchport port-security maximum-value

    The maximum number of MAC addresses that can be assigned is one.

    A MAC value can also be set if there is a switch connected - receiving frames
    for multiple MACs

    switchport port-security violation [restrict | shutdown]

    port: unauthorized frames would be dropped

    restrict: authorized frames would be dropped and violation counter counted

    shutdown: disable the interface (er-disabled - this is the default action)

    show port-security interface


    To open an interface after port-security, you first issue "shutdown", then "no
    shutdown"


    ### Inter-VLAN Routing (IVR) and Switched Virtual Interfaces (SVIs)

    VLANs can''t route without a router or Inter-VLAN Routing. Implementing Inter-VLAN
    routing on a layer 3

    switch uses Switched Virtual Interfaces (SVIs).


    If each router is plugged into an access link, each of the routers'' interfaces
    would be the gateway address for

    e host in each respective VLAN. IVR in the "on a stick" (ROAS) implementation
    puts VLANs into a trunk to a layer 3

    device, which performs routing on logical interfaces and sends back out to the
    trunk on the proper VLAN. This

    can be done without the external router with a layer 3 switch, which seems a bit
    more efficient, and relying on the one external

    router creates a bottleneck, as well as a single point of failure.'
