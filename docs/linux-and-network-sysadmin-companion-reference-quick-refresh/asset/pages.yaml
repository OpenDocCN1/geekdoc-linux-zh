    ISDN - Integrated Services Network - Delivered over T1/E1


    ISDN has two levels of service:


    +   - Basic Rate Interface (2B+D):

    - BRI - 64kb/s bearer/user (B) channels (throughput)

    - 19.2kb/s signaling/delta (D) connection maintenance

    - PRI - Primary Rate Interface - hooked up directly to the telco central office

    - 23B on a T1 (1.554 Mbps)

    - 30B + 1 sync/alarm channel on an E1 (2.048 Mbps)

    - Community to deliver Public Switched Telephone Network (PSTN) to digital PBX
    (23 lines in one)

    - Fewer B channels can be used for a fraction of T1.

    - More channels can be used with more T1s, within certain design limits (PRI pairing)

    - PRI pairing uses NFAS (non-facility associated signaling) to accommodate itself


    ISDN Terminology:


    An R reference point resides between a non-ISDN device and a terminal adapter.


    An S/T reference point resides between a NT1 and a terminal endpoint 1 (TE1).


    A U reference point (terminal adapter) performs conversion between a non-ISDN
    device and a TE1 device.


    A reference point resides between a NT1 and the wall jack connecting back to an
    ISDN service provider.


    An NT1 (network termination 1) device interconnects a four-wire ISDN circuit and
    a two-wire ISDN circuit.'
