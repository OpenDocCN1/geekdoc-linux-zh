- pgno: 47
  md: '# # SELINux files and locations


    - /selinux/targeted/config file specifies the targeted SELINux policy. (policy
    modules, contexts, and configs)

    - /selinux/targeted/policy contains compiled binaries of policies

    - /selinux/targeted/contexts contains exactly that; the file_type cuts out system_r_unconfined_t

    - /selinux/targeted/contexts/file_contexts contains the default maps of directories
    and labels.

    Syntax for files: context = [-type] ( << <<name >>)

    Examples ("~” means a field of description (-d), and for block or character special
    fields) :

    - /home/[!*]* -d system_u_user_home_dir_t

    - /home/[!*]!/* -d system_u_user_home_dir_t

    - <<name>>


    The SELINux pseudofsystem (monitored as /proc) uses SELINux security contexts
    of processes, via virtual files. It is used by the OS and SELinux-commands to
    interact with it, obtain status and config


    The /selinux/targeted/src directory is created when the selinux-targeted-sources
    package.

    - /selinux/targeted/policy/source tree contains fc (file content) and te (type
    enforcement files)

    - /selinux/targeted/policy/file_contexts -- has info into the file_contexts (file
    resources, resources)

    - /selinux/targeted/policy/file_contexts/programs contains files for specific
    programs, commands (processes)

    - /selinux/targeted/policy/domains -- individual domains; the rules for specific
    programs or services

    - /selinux/targeted/policy/modules -- for policy rules for specific functionalities
    or components


    # Creating Policies for Unsupported Software/


    Custom policies are needed if you have a program that has not registered, or to
    change the defaults (i.e., httpd).


    You need to operate on the source directory to make policy customizations.


    The installed /selinux/targeted/src directory is where you can start running.

    Files named *.fc contain file definitions, others named *.te SELinux policy, Type
    Enforcement (TE) rules


    Here are the fundamental steps of compiling a policy:


    +   1. Edit then the .te file into a policy module (.mod file) and do error checking

    checkmodule -m -o <module_name> -n <module_name>

    2. Package the .mod file into a policy package (.pp file). The -f option specifies
    a *.fc file to use

    module_package -o <module_name> -m <module_name> -d -f <module_name>.fc

    3. Install the .pp file into the system''s running directory''s module directory:

    semodule -i <module_name>


    Once the .pp file is compiled and installed, the content in the .pp file is accessed
    by the system when it is reloaded and it''s active.


    The .fc file entry maps paths to SELinux security labels. Here are some examples
    for:

    /usr/bin/httpd_t_ httpd_t to access

    /var/www/html/ httpd_t_ httpd_sys_content_t to the web root

    /var/log/httpd/ httpd_t_ httpd_log_t to log


    Other options: to access configuration files (http_config_t); to write to logs

    (http_log_t) needs access to specific ports (port_tcp_t)

    The .te file entry defines how processes with a specific type (e.g., httpd_t)
    can interact with labeled objects (files, networks)

    SELinux allows to deny subject object:class(permissions)

    allow httpd_t httpd_sys_content_t (read); # Allow httpd to read web server content

    allow httpd_t httpd_var_log_t (write append); 445; # Allow httpd to connect to
    web ports

    allow httpd_t success_t (capability setsetuid); # Allow to gain elevated privileges
    for CGI scripts

    allow httpd_t enable_ftp_service (boolean; False); # Allow if httpd can run an
    FTP server

    if (httpd_inab_enable_ftp_service)

    allow httpd_t port_tcp_socket_name_bind; # Allow httpd to bind to port 21


    /selinux/: Primary configuration directory.

    /etc/: a link to /selinux/config which dictates default mode and policy

    /etc/selinux/restore.conf: For restoring contexts on reboot.

    /etc/selinux/manage.conf: Config file for the system utility

    /selinux/targeted/modules/booleans.local: Location for local boolean settings.

    /selinux/targeted/booleans: Directory for SELinux boolean settings.

    libmanage - Library provides an API for the manipulation of SELinux binary policies.'
  merge: -1
  img_proc: true
