  md: '# Task-specific


    The ''action'' to execute a task, it normally translates to a C(module) or action
    plugin.


    | action | description |

    | --- | --- |

    | args | Another way to add arguments to a task. A dictionary, keys map to options
    and values. |

    | async | Run a task asynchronously (if Claction) supports this; value maximum
    runtime in seconds. |

    | changed_when | Conditional expression that overrides the task''s normal ''changed''
    status. |

    | delay | Number of seconds to delay before this setting. This is only used in
    combination with unit. |

    | delegate_facts | Boolean that allows you to pass facts to a delegate host (inventory_hostname);
    use host''s connections. |

    | delegate_to | Host to execute task instead of the target (inventory_hostname);
    use host''s connections. |

    | failed_when | Conditional expression that overrides the task''s normal ''failed''
    status. |

    | local_action | Same as action but also delegate:_local |

    | loop | List for tasks to iterate over, saving each item in the item variable
    (set via loop_control) |

    | loop_control | Several keys allow you to modify/loop behaviour in a task. |

    | notify | List of handlers to run when the task has ''changed'' status. |

    | poll | Sets the timeout in seconds (default 10). Value of 0 is ''fire'' and
    forget |

    | register | Name of variable that will hold task status and return data. |

    | retries | Number of retries giving up in a loop. This is only used in combination
    with unit. |

    | until | Enables a ''retry'' loop will go on until the condition is met or we
    hit the retries limit. |

    | when | Conditional expression, that determines if a task is run or not. |

    | with_<lookup_plugin> | The same as loop but may adds the output of any lookup
    plugin to generate the item list. |


    # Ansible Commands


    ansible-host-path [options]


