    The -oA flag will generate output files for each scan, including a grep file that
    you can easily parse, and a full text (i.e. tcp.nmap) that is human-readable.
    These scans do not perform fingerprinting or analysis of the exposed networks


    Same procedure for ipv6 - first sweeping IPv6 address space for running common
