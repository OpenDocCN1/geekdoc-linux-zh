- pgno: 79
  md: "# Enable RNDC for Secure Remote Commands\n\nRNDC (Remote Name Daemon Control)\
    \ keys allow a secure secure control channel for commands to be issued to BIND\
    \ (e.g., RNDC restarting or reloading configurations).\n\nGenerating RNDC Keys\n\
    \nUse the mdc-confgen tool to generate an RNDC key. This command generates a key\
    \ with 512 bits\nmdc-confgen -a 512 < /etc/mdc.key\n\nPrimary server configuration\n\
    \n```\nConfigure mdc.conf and named.conf for RNDC:\nmdc.conf:\nkey \"mdc-key\"\
    : {\n  algorithm hmac-sha256;\n  secret \"base64-encoded-secret-key\"; // Your\
    \ RNDC secret key\n}\noptions {\n  default-key \"mdc-key\";\n  default-server\
    \ 127.0.0.1; // RNDC server\n  default-port 953; // RNDC port\n}\nnamed.conf:\n\
    include \"etc/mdc.key\";\ncontrols {\ninet 127.0.0.1 953 {\n  allow {127.0.0.1,\
    \ <secondary_serv_IP>, <workstation_IPs>; // Add IPs for machines that should\
    \ have RNDC access\n  keys (\"mdc-key\");\n}\n}\n```\n\nConfiguration on secondary\
    \ server:\nThe mdc.conf file is generally identical so it can be copied over.\
    \ Changes to named.conf are the same as the primary. Both the primary and secondary\
    \ servers should have the same RNDC key if RNDC should control both servers.\n\
    Transfer RNDC key: scp /etc/mdc.key user@secondary-server:/etc/bind/mdc.key\n\
    Transfer RNDC config file: scp /etc/mdc.conf user@secondary-server:/etc/mdc.conf\n\
    \n```\nUpdate named.conf to include the RNDC key:\ninclude \"etc/mdc.key\";\n\
    controls {\ninet 127.0.0.1 953 {\n  allow {127.0.0.1, <primary_serv_IP>, <workstation_IPs>;\n\
    \  keys (\"mdc-key\");\n}\n}\n```\n\nAny machines that should be able to send\
    \ RNDC commands to the servers will need BIND configured on them, have the key\
    \ and mdc conf configured to do so. When running RNDC commands, specify the IP\
    \ of the server:\nmdc -s 192.168.1.10 -k /etc/mdc.conf status"
