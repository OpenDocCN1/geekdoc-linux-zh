- pgno: 4
  md: 'Linux typically manages the extension .ko ("kernel object") since version 2.6
    (previous versions used the extension). Other OS''s- loadable kernel (kid) in
    FreeBSD; kernel extension (kit) in macOS; kernel extension module in AIX; kernel-mode
    driver in Windows NT. Linux modules are generally in subdirectories of /lib/modules/
    named for kernel driver. Numbering format same as Linux versioning- major.minor.patch
    numbers for minor version are developmental. /lib/modules/* files i, bridge.ko
    for network support


    After /etc/init defines the default runtime, it kicks off /etc/rsysinit to load
    modules

    **/etc/modprobe** -- associates aliases/drivers to drivers such as etho

    **alias eth0 natsmemi** says us natsmemi driver for eth0

    **/etc/modprobe/modprobe.conf** -- large set of autoloaded aliases

    **/etc/modprobe/blacklist and blacklist-com** -- aliases that are not loaded


    **modprobe <module>** -- loads/modules AND auto-depds their dependencies

    -v verbose; -r remove; -a add all; [list] modules in directory

    **insmod** - to insert 3rd party drivers/modules; common error: dependency error:
    "unresolved symbol..." inserts only specified module-if not depends; **modprobe**
    is preferred

    -e make persistent; -f prevent loading of the same module; -s only optional module
    name

    **modinfo <module>** - param fields variables and used in the system calls. -V
    version, -n name -a author -d description -p parameters

    depmod** - shows a startup script before modprobe to give dependency in- creates
    /lib/modules/modules.dep

    lmod - lists loaded modules. Includes number, size of dependencies and what it
    is used

    lsmod -l - will do sort of the system, with dependencies


