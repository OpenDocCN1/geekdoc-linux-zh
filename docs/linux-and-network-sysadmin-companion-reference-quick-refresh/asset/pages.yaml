  md: "# The ipa commands for user resource management\n\nipa <command> [options]\
    \ [arguments]\n<command> is the action (e.g., add, delete, etc.)\n<category> is\
    \ for example user, group, host, etc.) command\nMost categories typically have\
    \ the commands add, delete, modify, show all (or list), and find\n\n```\nipa config:\
    \ Manage FreeIPA server configuration files\nipa package: Manage FreeIPA packages\
    \ (installation, updates)\nipa profile: Manage FreeIPA profiles (configurations)\n\
    ipa server: Manage the FreeIPA server itself (installation, configuration)\nipa\
    \ version: Manage API configuration options within FreeIPA\nipa trust: Manage\
    \ relationships (e.g., with Active Directory)\nipa host: Manage FreeIPA hosts\
    \ (joining the identity)\nipa group: Manage groups for FreeIPA hosts (machines)\n\
    ipa network: Manage network services on the FreeIPA server\nipa dnsserver: Manage\
    \ FreeIPA's DNS server\nipa service: Manage FreeIPA services (requiring identity\
    \ management)\n join: Join a machine to a FreeIPA server without using the client\
    \ command.\nipa identity: Manage logical identities of identities\n fqdn: Manage\
    \ Fully Qualified Domain Names (FQDNs) associated with FreeIPA\nipa domains: Manage\
    \ domains integrated with FreeIPA\nipa dns: Manage DNS keys for DNS signing (for\
    \ DNSSEC)\nipa database: Manage database backups and restores\nipa restore/backup:\
    \ Create or load a backup of an IPA config into FreeIPA\n sync: Synchronize data\
    \ with external directories\nipa topology: Manage FreeIPA server topology (replica\
    \ management)\n vault: Manage FreeIPA vaults (secure storage for secrets)\nipa\
    \ ca: Manage Certificate Authorities (for internal PKI)\nipa cert: Manage certificates\
    \ (for TLS, user certificates)\nipa file: Manage Transport Layer Security (TLS)\
    \ certificates\nipa kerberos: Manage Kerberos tokens and keysets\nipa servicedelegation:\
    \ Manage service delegation rules (allow requests to request Kerberos tickets)\n\
    ipa realms: Manage realms for Kerberos authentication\nipa diagnose: Perform diagnostic\
    \ operations on the FreeIPA server\nipa monitor: Monitor the FreeIPA server's\
    \ health and status\n search: Search for users, groups, hosts, and other FreeIPA\
    \ objects\n user: Manage user password policies\n password: Reset or change passwords\
    \ for FreeIPA users and services\n powolicy (alias for usability): Manage password\
    \ policies (password complexity)\n ip shadow: Manage shadow password information\
    \ (with caution)\n user permissions: Manage individual permissions assigned to\
    \ users or groups\n rightssource: Manage rights sources for access control\n ip\
    \ role: Manage FreeIPA roles (sets of permissions)\n ip relation: Manage relationships\
    \ between FreeIPA objects (e.g., user-group membership)\n self map: Manage SELinux\
    \ maps\n ssh sshkey: Manage SSH keys for FreeIPA users and services\n hbacrule:\
    \ For Host-Based Access Control (HBAC) - ipa hbacvsgroup (groups)\n sudoccmd:\
    \ Manage sudo commands with sudo - ipa sudoccmdgroup for sudo command groups\n\
    \ id range: Manage ID ranges for mapping\n ip local: Manage locals used within\
    \ the FreeIPA server\n```\n\nFor details, you can use \"ipa help <category>\"\
    \ for any of these.\n\nOpen ports for FreeIPA functionality:\n TCP ports: 80,\
    \ 443 (HTTP/S for web interface), 389, 634 (LDAP/S), 53 (DNS), 88 (Kerberos for\
    \ Windows clients)\n UDP ports: 88 (Kerberos), 53 (DNS), 67 and 68 (DHCP)\n RPC\
    \ and rstatd use port numbers. Unless you have multiple FreeIPA servers or modules\
    \ that need it, you are quite safely not to worry about opening ports- this is\
    \ outside the scope of this writing."
