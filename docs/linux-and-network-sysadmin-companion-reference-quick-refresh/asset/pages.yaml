- pgno: 40
  md: '# Netfilter/iptables


    service iptables [ start | save | stop ]

    /sbin/iptables-save -- filename saves rules to STDOUT, default send to file

    /sbin/iptables-restore -- filename restores rules from STDIN, so give it the file

    /sbin/iptables --primary ACL modifier utility

    - Packet-processing is top-down by chain (order as rules reside in the same chain).

    - Rules that are more likely to be matched should be put in the chain higher up
    in the list (line numbers)

    - Modules to process or function with [/lib/iptables/]

    - Check if enabled: [grep -i config_netfilter /config/] -- you will find CONFIG_NETFILTER=y

    - /etc/sysconfig/iptables-config:

    - Opening /etc/sysconfig/iptables-config to "yes" to save written and implemented
    rules.

    IPTABLES_COUNTER_RESTART and ON_STOP set to "yes" to turn back packet counters
    from where they left off a stop or restart


    iptables -t table <action>-new packet<segment-name> -j <fate>

    filter (NAT change IP addresses/ports), mangle (mangle packets/segments TOS/TTL,
    etc)

    Rule actions:

    - -a (append) -D (delete) -I (insert) -L (list) -F (flush) -R (replace) -N (new)
    -E (rename)

    nChain:

    INPUT, OUTPUT, FORWARD, PREROUTING and PROSOUTING

    - -i [eth0] -i [eth1] * is wildcard, use for negation. Use -o for output interface

    L3 Packet Filter:

    -s ip-addr (source), -d ip-addr (destination), *i is wildcard

    L4 Segment Filter:

    -p [tcp] | [udp] | [icmp], -sport --dport port #, or any name in etc/services

    State/statfulness:

    -m for matching; -m state {NEW, ESTABLISHED(syn-related), INVALID

    fate (destination):

    DROP, ACCEPT, REJECT, REDIRECT (netfilter routing chain ports), LOG (logging)

    When available, -v or --verbose, --line-numbers with -L, enumerate rules (for
    insert and replace operations)


    4 defaults can(remove) and their chains in processing order:

    - Filter (default- inbound and outbound traffic rules) INPUT, FORWARD, OUTPUT

    - NAT (change IP addresses, ports) PREROUTING, OUTPUT AND PROSOUTING

    - Mangle (packet alteration) PREROUTING, INPUT, FORWARD, (OUTPUT) AND PROSOUTING

    - Raw (rarely- used) PREROUTING, OUTPUT


    The NAT table, consulted when a packet creates a new session in order:

    - PREROUTING (for incoming packets before they come in),

    - OUTPUT (for locally-generated packets before routing)

    - PROSOUTING (for altering packets as they are going to go out)

    The mangle table, used for specialized packet alteration.

    - PREROUTING (for incoming packets before routing)

    - INPUT (for packets coming into the box itself)

    - FORWARD (for packets being routed through the box)

    - OUTPUT (not recommended to use)

    - PROSOUTING (for altering packets as they are going to out)

    The raw table, used mainly for configuring exceptions from connection tracking
    using the NOTR target.

    - It registers the netfilter hooks with higher priority and is called before it_conrack,
    or any other iptables tables.

    - Built-in chains: PREROUTING (packets arriving, or any interface) OUTPUT (packets
    generated by local processes)


    | Permit SSH | iptables |

    | --- | --- |

    | Deny let | iptables - INPUT -p tcp --dport 22 -j ACCEPT |

    | Block all traffic NOT from specified IP | iptables - INPUT -p tcp --dport let
    -j DROP |

    | Drop all inbound traffic | iptables - INPUT -s ! 192.168.1.72 -j DROP'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Inserts as rule #1 in the INPUT chain iptables -I INPUT 1 -p tcp --dport 22
    -j DROP


    Delete rule #1 in INPUT chain iptables -D INPUT 1


    Delete first match of this iptables -D INPUT 1 -p tcp --dport telnet -j DROP


    Replace rule 1 with this rule iptables -R INPUT 1 -p tcp --dport 22 -j ACCEPT


    Z option zeros out count for chain iptables -Z INPUT


    Zero byte count in PREROUTING''s mangle table iptables -Z PREROUTING -t mangle


    Flush all rules from output filter iptables -F OUTPUT


    Flush all iptables -F


    Lists ICMP types for us to view iptables -p icmp --help


    Deny echo-reply from all hosts iptables -A INPUT -p icmp --icmp-type echo-request
    -j DROP


    Don''t reply to any hosts iptables -A OUTPUT -p icmp --icmp-type echo-request
    -j DROP


    Allow Incoming SSH on port 22 iptables -A INPUT -o eth -p tcp --dport 22 -m --state
    NEW,ESTABLISHED -j ACCEPT iptables -A OUTPUT -o eth -p tcp --dport 22 -m --state
    NEW,ESTABLISHED -j ACCEPT


    Restrict syslog access (gateway IP should have access iptables -A INPUT -p udp
    --dport 514 -s 192.168.1.1 -j ACCEPT iptables -A INPUT -p udp --dport 514 -s 192.168.1.1
    -j DROP


    Lock down NTP (129.6.15.22 and 29) are NOT iptables -A INPUT -p udp --dport 123
    -s 123 -s 192.168.1.25 -j ACCEPT iptables -A INPUT -p udp --dport 123 -s 192.168.1.0/24
    -j DROP


    MAC address filtering iptables -A INPUT -p tcp -m mac --source 64:00:26:f7:84:08
    --dport 8080,2043 -j DROP


    Set default policy to DENY iptables -P INPUT DROP


    NAT-port redirection iptables -t nat -A PREROUTING -p tcp --dport 2323 -j REDIRECT
    --to-ports 22


    Drop all webserver connections iptables -A INPUT -state NEW,ESTABLISHED -j multiport
    --dport 8043,80 -j DROP iptables -A OUTPUT -state NEW,ESTABLISHED -j multiport
    --dport 8043,80 -j DROP


    Make a new chain in mangle table iptables -N INTRANET -t mangle


    Rename a chain iptables -E INTRANET MY_SUBNET


    Replace/modify, all from INPUT from subnet to MY_SUBNET iptables -R INPUT 1 -s
    192.168.1.0/24 -j MY_SUBNET


    If NOT matched, pass back to origin chain, starting filter after the rule it left
    iptables -A MY_SUBNET -p tcp --dport 22 -j DROP


    Logging in /var/logmessages by default. Add exception "kern.node" to logging anything
    over "info" level and add line /etc/syslog.conf


    ```

    iptables - INPUT -p tcp --dport telnet -j LOG

    /dev/console and change to /var/log/firewall

    Put these at the top of the INPUT chain (or even better, a subscribed point to)
    Default level is "warning"

    iptables - INPUT -p tcp -m multiport --dport 8080,23 -j LOG

    iptables - INPUT -p tcp -m multiport --dport 8080,23 -j LOG

    iptables - INPUT -p tcp --dport 22 -j LOG --prefix "SSH ACCESS ATTEMPT: "

    iptables - INPUT -p tcp --dport 23 -j LOG --prefix "UNAUTHORIZED TELNET ACCESS
    ATTEMPT "

    --loglevel debug emerg etc

    --log-tcp-options

    --log-ip-options

    --log-tcp-sequence

    ```'
