    - semodule_package: Create policy module from current policy file (or unexpanded)
    package

    - makemodule: Package policy files

    - checkmodule: Check module file for errors, generate binary policy

    - checkpolicy: Check policy file for errors, generate binary policy file

    - sedmod: Disassemble a binary policy module

    - disasmb-selinux: Disassemble a binary SELinux policy


    # ## CONTEXT AND CONFIG FILE TOOLS


    +   - selinuxfiles: Displays the SELinux context

