  md: "The Data Link Layer (Layer 2) is concerned with data across one particular\
    \ link or media. The data link protocols define delivery across an individual\
    \ link. These protocols are necessarily concerned with the type of media in use.\
    \ Examples include IEEE 802.3/802.HDL, Frame Relay, PPP, FDDM, ATM. The lower\
    \ level works with standards governing the physical transmission medium (Layer\
    \ 1), including use of connector pins, electrical properties like voltage, etc.\n\
