- pgno: 7
  md: '# More on /proc and /sys

    /proc/cpuinfo - display cpu info

    /proc/net has files containing protocol information and settings, such as using
    netstat, ss

    /proc/meminfo - is used for unused and shared memory and buffers used by the kernel.

    /proc/version - produces most as unused

    /proc/cmdline - command line boot options passed to the kernel by the boot loader
    at boot.

    /proc/devices - list of device drivers (hardware) configured into the running
    kernel.

    /proc/filesystems - list of filesystems that are configured into the kernel for
    mounting

    /proc/partitions - partition info: the size and number of each partition, and
    number of blocks.

    /proc/memory - DMA hardware direct access to memory independent of the CPU.

    /proc/interrupt - lists the interrupt request (IRQ) channels in use.

    /proc/ioalloc - mapping of the memory allocated to each device and the input/output
    assignments for memory.

    /proc/modules - lists the kernel modules that the computer is currently using.

    /proc/bus - contains a file or directory for each USB device


    Original UNIX systems needed to access data structure user-space applications
    could find out about process attributes. Early programs like ps found out running
    processes by accessing `/dev/mem` or `/dev/kmem`, and retrieving the raw data.
    That requires root access, so the applications they have to be root or privileged.
    It is also not good to use system data directly to user-space. One solution was
    to make these types of info available through system calls, but creating new system
    calls or over to export process data wasn''t good either. The /proc filesystem
    was the answer- where interfaces and structures (directories and files) were kept
    in the system, as the underlying data structures in the kernel changed.


    On kernel virtual filesystems are made to reference hardware and resources:

    - *udev* uses the virtual filesystem `/dev` to put hardware (devices) representing
    them as interfaces so other they can talk to them

    - *sysctl* helps set up at `/proc` and `/sys` virtual filesystem representations
    of how the kernel modules and drivers to interact with /dev/ device files


    The /proc virtual filesystem was only made to hold legacy process information,
    system attributes from a few main systems. It is easily accessible from both kernel
    and user-space it got the reputation as the convenient place to put read/write
    system files to adjust settings, kernel and subsystem operation (cpuinfo, memory
    statistics, device information). Then again got grown in created clutter with
    device stack in different spots all over the place.


    The /sys virtual filesystem was implemented in kernel 2.5.2 (2003 or so) to organize
    many things, separate device and driver system information from /proc to add structure,
    provide a uniform way to expose system information and control points (settable
    attribute and drivers) to user-space. For each device found to put in /dev the
    kernel automatically creates entries in /sys when drivers are generated based
    on the driver type and their values (representing the device hierarchy)


    Many of the legacy system information and control points are also accessible in
    /proc - entries already added to /proc were allowed to remain for backward compatibility
    (special traditional items like CPU and memory). All new device busses and drivers
    are expected to expose their info and control via sysfs.

    Note: Many traditional UNIX-like operating systems use /sys as a mimic to the
    kernel source tree


    The /sys Directory Structure

    /sys/block - an entry for each block device (mostly drives data blocks)

    /sys/bus/devices/ - symlinks for each device - point to device''s directory under
    root/

    /sys/bus/driver/ has a directory for each device driver that is loaded

    /sys/class/ - has files for each class of devices

    /sys/devices lists devices, in a directory tree reflecting/representing the device
    hierarchy

    /sys/firmware/

    /sys/net/

    /sys/fs/ - where each exporting filesystem attributes its hierarchy - /fuse.txt

    /sys/dev/char/ and /sys/dev/block/ holds links named <major>:<minor> pointing
    to the appropriate


    Quick examples:

    Setting laptop brightness (non persistent) echo N > /sys/class/backlight/acpi_video0/brightness

    Get a network card''s MAC address cat /sys/class/net/en1s0/address'
