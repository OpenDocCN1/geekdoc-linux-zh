    | -u, --user --REMOTE_USER | Connect as this user (default=root) |

    | -k, --ask-pass | Ask for connection password |

    | --private-key, --key | Use this file to authenticate the connection |

    | -C, --connection <CONNECTION> | Connection type to use (default=smart) |

    | -T, --timeout <TIMEOUT> | Override the connection timeout in seconds (default=10)
