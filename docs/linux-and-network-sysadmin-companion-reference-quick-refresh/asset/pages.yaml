    \ displays topology table\nshow ip ospf traffic - shows the type and type of traffic\
    \ received\nshow protocols - shows the routing process ID and which protocols\
    \ are enabled, K values\nshow key-chain - display authentication info\nshow ip\
    \ ospf data - lots more links\n```"
