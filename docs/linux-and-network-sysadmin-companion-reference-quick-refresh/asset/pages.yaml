  md: '# DHCP Setup on Cisco Devices (IPv4)


    ```

    Switch(config)#service dhcp -- makes it''s enabled - "no service dhcp" turns it
    off

    Switch(config)#ip dhcp pool Sales_Wireless --create the pool

    Switch(config-dhcp)#network 192.168.10.0 255.255.255.0 --net and mask for pool

    Switch(config-dhcp)#default-router 192.168.10.1 --default gateway

    Switch(config-dhcp)#dns-server 4.4.4.4

    Switch(config-dhcp)#lease 3 15 --days, hours, minutes - default 24hours

    Switch(config)#exit

    Switch(config-dhcp)#dhcp excluded-address 192.168.10.1 192.168.10.10

    ```


    # DHCP Relay


    If you need to provide addresses from a DHCP server to hosts that aren''t on the
    same LAN as the DHCP server, you can configure your router interface to relay
    DHCP client requests.


    ```

    Router(config)#interface fa0/0

    Router(config-if)#ip helper-address 10.10.10.254

    ```


    The router and fa0/0 are on 192.168.10.1, 10.10.10.254 is obviously on a different
    subnet, but the DHCP server ip forwards-wards more than just DHCP client requests.


    # Verifying DHCP


    ```

    show ip dhcp binding -- List state information about each IP address currently
    leased

    show ip dhcp pool [poolname] -- Lists scope of addresses, plus status for leased
    addresses

    show ip dhcp conflict statistics -- Lists DHCP server statistics

    show ip dhcp conflict -- show duplicate addresses

    ```


    # More Pools Example


    ```

    Corp#config

    Corp(config)#ip dhcp excluded-address 192.168.10.1

    Corp(config)#ip dhcp excluded-address 192.168.10.250

    Corp(config)#ip dhcp pool SF_LAN

    Corp(config-dhcp)#network 192.168.10.0 255.255.255.250

    Corp(config-dhcp)#default-router 192.168.10.1

    Corp(config-dhcp)#dns-server 4.4.4.4

    Corp(config-dhcp)#exit

    Corp(config)#ip dhcp pool LA_LAN

    Corp(config-dhcp)#network 192.168.20.0 255.255.255.250

    Corp(config-dhcp)#default-router 192.168.20.1

    Corp(config-dhcp)#dns-server 4.4.4.4

    ```


    Add these to the two routers so they will forward DHCP:


    ```

    LA(config)#int f0/0

    LA(config-if)#ip helper-address 172.16.10.5

    ```


    ```

    SF(config)#int f0/0

    SF(config-if)#ip helper-address 172.16.10.1

    ```'
