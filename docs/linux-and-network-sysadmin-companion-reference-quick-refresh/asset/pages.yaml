  md: '# Centralized Management with LDAP


    ```

    1. Adding LDAP in named.conf

    dynamic-db "example" {

    library "ldap.so";

    arg "ldap://"; // No trailing slash here

    arg base="cn=dns,example,dc=com";

    arg "auth_method";

    arg "security"; // Add this line for improved security

    ```


    2. On the LDAP server, create a schema file, (e.g., /etc/dsir/slapd-instance_name/99-dns.ldap)
    with this in:


    ```

    dn: cn-schema

    objectClass: top

    objectClass: LdapSubentry

    objectClass: schema

    attributeTypes: (2.16.840.1.11370.3.11.18 NAME "DNSDOMAIN" EQUALITY equalA5Match
    SYNTAX "3.6.1.1.4.1466.115.121.16.21"

    caseIgnoreMatch:caseIgnoreA5MatchingSubstr subA5MatchingSubstr SYNTAX "3.6.1.1.4.1466.115.121.16.127"

    userApplications:X-ORIGIN LDAP schema for DNS)

    attributeTypes: (2.16.840.1.11370.3.11.17 NAME "DNSTREQUAL" EQUALITY equalInteger
    SYNTAX "3.6.1.1.4.1466.115.121.16.127"

    userApplications:X-ORIGIN LDAP schema for DNS)

    attributeTypes: (2.16.840.1.11370.3.11.18 NAME "DNSRECORD" EQUALITY equalA5Match
    ORDERING

    caseIgnoreMatch:caseIgnoreA5MatchingSubstr subA5MatchingSubstr SYNTAX "3.6.1.1.4.1466.115.121.16.127"

    userApplications:X-ORIGIN LDAP schema for DNS)

    objectClasses: (2.16.840.1.11370.3.22.3 NAME "Zone" TOP STRUCT MUST DNSName (dn=DNSTLL
    DNSRecord)

    ```


    3. Create files for zones you want to handle.

    This file is for zones. Add another indented block under these to manage. Save
    this to dns-zones.list


    ```

    # Zone for xyz321.dc=com

    dn: dc=xyz321,dc=com

    objectClass: top

    objectClass: dnsZone

    dnDomain: xyz321.dc=com

    dDNSTLL: 86400

    dnsRecord: SOA ns1.xyz321.dc.com.master.xyz321.com. 20240260 ; Serial 3600 : Refresh
    1800 : Retry 1209600 Expire ) Minimum TTL

    dnsRecord: ns1.xyz321.dc.com.

    dnsRecord: ns2.xyz321.dc.com.

    ```


    ```

    # Zone xyz321.dc=com

    dn: dc=xyz321,dc=com

    objectClass: top

    objectClass: dnsZone

    dnDomain: xyz321.dc=com

    dDNSTLL: 86400

    dnsRecord: A 192.0.2.1

    ```


    ```

    # Zone for abc123.dc=com

    dn: dc=abc123,dc=com [etc., dn=cn=admin,dc=example,dc=com]

    ```


    4. When completed, run this line of code (ldapadd ...) with your actual LDAP admin
    DN)\ldapadd -D "dn=cn=admin,dc=example,dc=com" -W multiple-dns-zones.ldif


    You can verify the successful addition of these entries by using the ldapsearch
    command\ldapsearch -x -b "dn=cn=admin,dc=example,dc=com" -W


    Later you can update that same ldif file with more zones (or changes), run ldapadd
    to update the database


    This deletes the wrong record, not the zone


    ```

    ldapmodify -D "dn=cn=admin,dc=example,dc=com" -W EOF dn: dc=xyz321,dc=com changetype:
    delete EOF

    If you delete a line it will delete that zone''s records too, to delete both you
