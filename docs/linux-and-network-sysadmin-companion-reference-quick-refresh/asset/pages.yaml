    # IP-v Static NAT


    ```

    R1(configif)#ip address 10.0.0.1 255.255.255.0

    R1(configif)#no shutdown

    R1(configif)#exit

    R1(configif)#interface serial 0/0

    R1(configif)#ip address 20.0.0.2 255.255.255.0

    R1(configif)#no shutdown

    R1(configif)#exit

    R1(configif)#ip route 30.0.0.0 255.0.0.0 20.0.0.0.1

    R1(configif)#ip nat inside source 10.0.0.2 50.0.0.1

    R1(configif)#interface fastEthernet 0/0

    R1(configif)#ip nat inside

    R1(configif)#ip nat outside

    R1(configif)#exit

    ```


    ```

    R0(configif)#interface fastethernet 0/0

    R0(configif)#ip address 30.0.0.1 255.255.255.0

    R0(configif)#no shutdown

    R0(configif)#exit

    R0(configif)#interface serial 0/0

    R0(configif)#ip address 20.0.0.1 255.255.255.0

    R0(configif)#clock rate 64000

    R0(configif)#bandwidth 64

    R0(configif)#no shutdown

    R0(configif)#exit

    ```


    ```

    R0(config)#ip route 50.0.0.0 255.255.255.0 20.0.0.2

    ```


    There is no direct route for 10.0.0.2: So PC from network of 30.0.0.0 will never
    know about it. They will access 50.0.0.1 as the web server IP. Ping 50.0.0.1 and
