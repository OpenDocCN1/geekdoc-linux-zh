    Change file ownership: ansible all -m file -a ''path=/tmp/my_directory owner=devops
    group=devops mode=0755'' --become -b *user-b* (with delete: absent)


    Creating directory with permissions: ansible all -m file -a ''path=/tmp/my_directory
    mode=0755'' --become -b


    To copy (files): ansible all -m copy -a ''src=ansible.cfg dest=/home/ansible/.ansible.cfg''
    --become=ansible owner=ansible group=ansible mode=0644


    Start (or restart) on hosts: ansible all -m service -a ''name=httpd state=started
    enabled''


    Check status: ansible all -m service -a ''name=httpd state=status''


    Restart service: ansible all -m service -a ''name=httpd state=restarted'' -u vag


    Using system module for start/restart/reload services: ansible all -m systemd
    -a ''name=nginx state=reloaded'' -i=prod-hosts


    Get file inventory: ansible all -m file -a ''path=/etc/ansible/hosts''


    Gather facts: ansible all -m setup -a ''name=system''


    Check the open ports: ansible all -m shell -a ''netstat -antlpn | grep listen''


    Get logging info: ansible all -m shell -a ''tail /var/log/syslog''


    Append line: ansible all -m shell -a ''echo "hello" >> /home/user''


    Install on RHEL-system: ansible all -m yum -a ''name=vim''


    Install on Debian-system: ansible all -m apt -a ''name=vim --update-cache''


    Run a cron job: ansible all -m cron -a ''name=daily-cron-all-servers schedule=0
    0 * * * job=/path/to/hour-cron-script''


    - With the cron 15 minutes specified with minutes=''15'' this is also a special-time-timeout
    daily or weekly for those


    +   - Using the list items to get very specific entity: ansible all -m setup -a
    ''systemd'' --limit=112.168.0.17 to limit matching to one ip on this one node
    - - can also be wildcarded with "*44" in all plugins and you can use the --limit="ansible:112.168.0.17"
    to exclude with, and --limit="ansible:!112.168.0.17" to include


    +   - The B-option method is most helpful to use in ad hoc command that may take
    some time in the background so you can continue to work in your terminal without
    without timing out.


    +   - The setup module access_facts variables, which can be so filtered. It is
    useful to find info using the filter utility:

    ansible appsevers -m ansible_hosts -a ''filter=ansible_distribution,ansible_distribution_version,ansible_memfree_mb''

    ansible_mem_total_mb, ansible_processor_cores, ansible_architecture=2"/dev/null


    In playbooks, it is useful to use the gather_facts instead, you do not need to
    call it, as it is automatically at the beginning of each playbook execution. Setup
    then will be used for more customized, on-demand queries (such as update facts
    after running jobs)'
