  md: '# Command Equivalents - SysUnit and systemd


    | Action | SysUnit | systemd |

    |---|---|--|

    | Start/restart/reload/status/of a service | service nptd [ start | stop | etc...
    ] | systemctl [ start | stop etc... ] nptd.service |

    | Restart a service if already running | service nptd restart | systemctl restart
    httpd.service |

    | Enable or disable service on startup | chconfig nptd [ off | on ] | systemctl
    [ enable | disable ] nptd.service |

    | Is service enabled at startup (runlevel?) | chconfig nptd | systemctl is-enabled
    nptd.service |

    | List services that can be started or stopped | ls /etc/rc.d/init/ | systemctl
    OR | systemctl list-units --type=service AND |

    | Used to list all the services and other units | | ls /etc/system/systemd/ *service
    | systemctl list-units --type=service |

    | Print table of services listing each if configured on or off | chconfig --list
    | ls /etc/system/systemd/ *wants/ |

    | Print a table of services that will be started when booting into graphical mode
    | chconfig --list | grep 50 | systemctl list-dependencies graphical.target |

    | List what services which is config''d on or | chconfig nptd --list | ls /etc/system/systemd/
    *wants/nptd.service |

