    ```

    root@kali:~ # icmapscan -nltu 10.3.0.1

    UDP open domain[53] from 10.3.0.1 to 128

    UDP open nbs-net[13] from 10.3.0.1 to 128

    ```


    UDP scans across tools may vary. Nmap provides a comprehensive option with -sV,
