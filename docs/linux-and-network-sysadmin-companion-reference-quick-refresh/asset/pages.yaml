- pgno: 231
  md: 'Nmap: 1 IP address (host up) in 0.70 seconds

    The ACK scan shows some packets are probably reaching the destination-host: firewall
    ports is always possible. Other scan types, such as FIN scan, may be able to determine
    which ports are open and thus infer the purpose of the hosts. While we may be
    able to establish TCP connections to those ports, which can be useful for determining
    which IP addresses are in use, OS detection tests, reveal IP ID and as a channel
    for commanding rootkits installed on machines. Such hosts may be zombies for an
    IP ID idle state.


    Two ways of interpreting info from ICMP scans can be revealing: checking the time-to-live
    (TTL) field and the WINDOW field of received packets


    It doesn''t tell us if a port is open or closed, but it tries to tell us if the
    firewall is stateful (keeps tracks of connections) or not (probably just denies
    incoming packets).

    If the firewall is stateful and just SYN packets, an ACK will get if it looks
    like a reply to something from the other side.

    If an open OR closed port receives an unexpected ACK, it should send a RST back.

    So if we get a RST back, then it means the firewall is non-stateful (or there''s
    no RST). If we don''t get a RST, or some ICMP unreachable sent, it''s most likely
    filtered.


    # TTL-Base Analysis:


    TTL value can be as a number of many hosts the packet has passed through

    Below, on the value of the packets returned by port 22 is 50, whereas the others
    return a value of 80. This suggests port 22 is open on the target host because
    the TTL returned is smaller than the TTL value of 64*.

    1: host 192.168.0.1 port 22: RST TTL 50 WIN 0x0

    2: host 192.168.0.20 port 23: RST TTL 80 WIN 0x0

    The firewalk assessment tool is mirror http://www.packetfactory.net/projects/firewalk/


    # Window-based Analysis:


    If window has non-zero value then the port is open, presumed filtered

    1: host 192.168.0.10 port 20: F -> : ttl: 64 win: 52

    2: host 192.168.0.20 port 23: F -> : win: 0


    The advantage of ACK flag probe scanning is detection (for both IDS and host-based
    systems).

    A disadvantage is relies on TCP/IP stack implementation bugs, which might be present
    in BSD-derived systems but not in

    other platforms.


    ```

    hping3 -A 72.14.207.99 -p 80 -c 1

    nmap -sW

    ```


    Some systems use a Positive size for open ports, and for closed. Fewer systems
    get the exact opposite. If you scan

    d get tons of ports and a few closed ones, it''s a chance. And some systems do
    not either, so you

    can always trust it.


    # IDLE scan: IP ID (IP fragment ID)


    Sends a spoofed source address to computer to find out what services are available
    for complete scan of a remote host.

    This is accomplished by spoofing another computer''s IP address. No packet is
    sent from your own IP address; instead,

    an host is used to scan the remote host and determine the open ports. This is
    done by observing the sequence number of

    zombie host and if the remote host checks the IP of the scanning, the IP of the
    zombie will show up. You


    As noted, to determine if port is open, SYN scan full or stealth, get back a RST
    if closed, SYN if open.

    Consider:

    - An unsolicited SYN is responded to a RST. An unsolicited RST will be ignored

    - Each packet has a fragment ID (IPID), incremented for each sent. Check to #
    of packets sent since probe


    Step 1) Send unsolicited SYNACK to the target to get a RST containing IP ID (say
    it is 31337)

    Step 2) Spoof the IP address of your zombie, and send a SYN packet to the target
    (port.80)

    - If the port is open, the target will send a SYNACK to the zombie and it will
    show a RST back to the target. (IP predicted is 31339)

    - If the port is closed, the target will send a RST back to the zombie host, and
    it won''t respond

    Step 3) Probe the target again with another SYNACK. The IP ID has been incremented
    by 2 from the last RST obtained in

    step 1 if the tested port on the target is open.'
