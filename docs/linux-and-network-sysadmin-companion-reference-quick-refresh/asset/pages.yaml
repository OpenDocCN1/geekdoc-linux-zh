- pgno: 74
  md: '# Review: Zone Transfer Types


    AXFR (Full Zone Transfer): Transfers the entire zone file, containing all DNS
    records for a domain, from the primary authoritative server to a secondary server.
    Due to its size, full transfers can be resource-intensive, especially for large
    domains.


    IXFR (Incremental Zone Transfer): Transfers only the updated parts of the zone
    file since the last successful transfer. This is the preferred method for updates
    as it reduces bandwidth consumption and server load. IXFR uses DNSSEC to cryptographically
    sign the transferred data, ensuring its authenticity and preventing tampering.


    # Review: Root Servers, TLD Servers, etc.


    Internet Names Authority (IANA) manages the root zone, which is composed of 13
    root servers. They don''t perform zone transfers due to the independence they
    maintain—relying instead on election. They delegate responsibilities of top-level
    domains (TLDs) like .com and .org to specific registries such as Verisign (.com)
    and ICANN (.org). PIR (Public Internet Registry) manages public TLDs, and IANA
    (for ICANN) infrastructure TLDs like .arp. The root zone contains information
    about the authoritative nameservers for each TLD. When a resolver initiates a
    query for a domain, the root servers simply point to the resolver in the direction
    of the appropriate TLD servers


    The TLD server lives in the hierarchy where root servers begin. A primary TLD
    server holds the authoritative zone file for the TLD, while secondary TLD servers
    perform zone transfers to the latest zone data from the primary. When a change
    is made to the zone file on the primary TLD server, a notification is sent to
    the secondary servers and they examine its content using a mechanism like SIGNIFY
    (part of DNSSEC). Secondary receive the notification and examine content to understand
    what was modified (e.g., a new domain added or an existing record updated). Based
    on the notification details and potentially a configured interval, the secondary
    server initiates a zone transfer to retrieve the data from the primary.


    If the zone file changes often, frequent updates might be more frequent (every
    few minutes). Each TLD server might have its own policies regarding update intervals,
    since there is also a trade-off between speed and efficiency; frequent updates
    can create more traffic, less frequent updates might introduce a propagation delay.


    # Review: DNS behavior - a self-visited website in a web browser


    You type the domain name you visited your web browser''s address bar or click
    a hyperlink


    Your PC''s DNS cache is checked. Does it have the IP or domain name cached?


    If no, does the OS have the IP or domain name cached?


    Recursive resolver at ISP takes responsibility for finding the answer to your
    query, including contacting other name servers.


    Iteration Process:


    +   Checks its cache to see if it has the info; if not, ask the appropriate TLD
    servers


    +   If not found, asks root nameservers for the right TLD servers


    The recursive resolver queries the TLD servers it was referred to


    TLD servers know the authoritative nameservers for this domain


    The recursive resolver contains the authoritative nameservers for domain name


    An authoritative nameserver caches its zone file containing the domain''s IP address.


    Once the recursive resolver receives the IP address, it sends it to your web browser.


    The recursive resolver will cache this information for future queries.


    Finished-website connection established.'
