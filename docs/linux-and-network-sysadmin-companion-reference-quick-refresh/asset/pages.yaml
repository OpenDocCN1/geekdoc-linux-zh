    # Layer 2 Protocols - ARP Resolution


    ARP was defined by RFC 826, and is used for for mapping an IPv4 address to a physical
    MAC address. In IPv6 the functionality of ARP is provided by Neighbor Discovery
    Protocol (NDP). When IP has a data to send, it must inform a Network Access protocol,
    such as Ethernet, of the destination address on the local network. If IP doesn''t
    find the hardware address, it must request the information.


    A continuing discussion about ARP is where Layer 2 and 3 begin, and it seems to
    also stretch across it. It is a good reminder that the OSI model is just-a conceptual
    model for design and development of protocols: this is an example (aren''t there
    many) where the real world is a bit less tangible and technical requirements might
    help bring the roadmap to reality. In this case it is best to be in Layer 2 and
    it is most that the LLC invokes service call the MAC sublayer in order to ARP
    the CAM table and layer 3


    # ARP - Address Resolution Protocol


    | Hardware Protocol Address Length: 6 |

    |---||

    | Protocol Address Length: 4 | Ethernet (10Mb) | 0x0800 (IP) |

    | Operation: 1 ARP Request |

    | Sender Hardware Address: 00:24:68:60:A5 |

    | Sender Internet Address: 172.16.10.3 |

    | Target Hardware Address: 00:00:00:00 (ignored) |

    | Target Internet Address: 172.16.10.10


    ARP related terms (or, with ARP in the name)


    > Inverse ARP is primarily used in Frame Relay (DLC) and ATM networks, which need
    the corresponding Layer 3 addresses before virtual circuits are used


    An ARP probe is an ARP request constructed with all-zero sender address. Before
    beginning to use an IPv4 address a host must test to see if the address is there,
    by broadcasting ARP packets


    A gratuitous ARP announcement updates any entries in the ARP table of others that
    receive the packet. Many operating systems perform this ARP during startup. It
    helps when a network address was changed and other hosts need to update ARP caches.
    Gratuitous ARP is also needed in learning networks and can be used to detect link-IP
    addresses in zerconf.


    ARP spoofing - ARP has no authentication, so replies can come from systems other
    than the one with the required address, resulting in man-in-the-middle and DoS
    attacks. An ARP proxy is a legitimate system that intercepts the intercepting
    data for that system, answers the ARP request on behalf of another system for
    which it will forward traffic, such as for that subnet.


    ARP mediation is WAN resolution of Layer 2 addresses through a Private Wire Service
    (PWS) when resolution protocols are used circuits–e.g., Ethernet on one and Frame
    Relay on the other. In IPv4, each device discovers the IP address of both local
    and remote CE devices and intercepts local Neighbor Discovery (ND) and Inner Neighbor
    Discovery to the connecting PE devices. The PE device responds to ARP requests
    using the IP address of the remote CE device and the hardware addresses of the
    local PE device.


    In IPv6, ARP is replaced with NDP (Neighbor Discovery Protocol) – each device
    discovers the IP address of both local and remote CE devices and intercepts local
    Neighbor Discovery (ND) and Inner Neighbor Discovery (IND) packets and forwards
    them to the remote PE device.'
