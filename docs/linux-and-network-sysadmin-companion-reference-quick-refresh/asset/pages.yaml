- pgno: 35
  md: 'The "radio" object doesn''t allow as you like. Like the networking object,
    the controls are over in the "device" object. You can turn them off with "nmcli
    radio wlan wan | all" referring to mobile network service and interface.


    ```

    $@localhost ~# nmcli radio wlan wan | all [ on off ]"

    WIFI-HW WIFI WWAN-HW WWANnenabled enabled disabled

    ```


    The "agent" object allows you to use policy management like polkit to govern permissions
    on things like the network on or off. Mechanisms like polkit are outside the scope
    of this document, but that''s the "agents" object enables.


    Finally, typing "nmcli monitor" simply turns on (or off) a facility that prints
    to log stdout when something in Network Manager changes.


    # General Use and Examples


    So, Network and NMCLI is when you need persistent configuration solutions, even
    if you are testing things. The ip command is for when you need things done at
    the moment quick, just don''t care if something is going to stick after a reboot
    or possibly get lost when you log out-, or you might just want something in a
    different format.


    # Quick NMCLI examples


    As you can see, most nmcli objects and commands can be truncated down a lot,


    +   - nmcli show - Find connections for different devices

    mcli con show eno1 - Get details on eno1

    mcli dev status - Get status of all devices


    ------We have an ethernet device object called "eno1" to let''s do stuff with:


    ```

    nmcli con add --name static type ethernet eno1 ipv4 192.168.122.10 gw4 192.168.122.121

    mcli con add --name static type eno1 autoconnect ipv4 192.168.122.1

    mcli dev status

    ```


    +   ------ Find out which is used

    mcli up static - nmcli up - Bring these connections

    mcli con show - Get this connection''s status


    ------So this make two connection objects (static and dhcp) pointing to the "static"
    connection object:


    ------Here, we are going to add information and a static IP address to the "static"
    connection object:


    ```

    nmcli con mod static +ipv4.dns 192.168.122.1 -- to specify a dns server

    mcli con mod static +ipv4.address 192.168.100.100/24 -- modify IP and gateway

    mcli con mod static +ipv4.address 10.0.0.10/24 -- add a secondary IP address

    ```


    ------All of the writes we doesn''t activate them - you need to reload the connection
    for them

    mcli con reload - Re-reads the config file if you can''t come down and bring it
    with you


    So, a few interesting things about this object.


    +   - Note that uses dotted notation to add the ipv4 addresses and dns. These
    are listed in the man page for nm-settings(5). [http://manpages.ubuntu.com/managers/zesty/man/nm-settings.5]

    - If you not specify a connection name when creating one, it is auto-generated
    as "type-interface-[number


    # The nmcli Prompt


    When you choose the "edit" option on an object, you get the nmcli prompt, and
    increase can directives that are way inside. To restart the connection "net-eth1"
    to DHCP (auto) instead of static:


    ```

    $@localhost ~# nmcli edit net-eth1

    > print all

    > remove ipv4.gateway

    > remove ipv4.address

    > set ipv4.method auto

    > set ipv4.dns 8.8.8.8 8.8.4.4

    > save all

    > quit

    ```'
