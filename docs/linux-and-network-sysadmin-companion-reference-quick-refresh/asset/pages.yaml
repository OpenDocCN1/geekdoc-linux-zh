- pgno: 49
  md: 'Striping increases retrieval performance by allowing multiple data readers
    and writers to work on a single data set at the same time. Mirroring provides
    redundancy for recovery. Parity ensures that complete data can be retrieved from
    one or more disks.


    # RAID 0: Disk striping


    Multiple sources can access bits of data at the same time, performance can be
    improved. No redundancy. One disk failure will result in data loss.


    # RAID 1: Disk mirroring - no interruption of data availability


    Description: Data is written to two or more disks. No master or redundancy, the
    disks are peers. Performance: Fast read (simultaneous), slower write (every writes
    twice)


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_49_0.png)


    OBSOLETE! RAID2 and 3 - Block-level striping; RAID4: Block level striping, dedicated
    parity disk RAID3 used an additional disk for parity. Since every write touches
    multiple disks, Obsolete! Slow! All spins in sync (spinlock); For highest transfer
    rates in sequential reads and writes Raid 4: Block-level striping, adding a cache
    to increases performance over RAID3. RAID5 killed off three.


    Performance: No single drive bottleneck, but rebuildings will degrade performance.
    Balances data availability andwrite performance. During rebuilds, write performance
    suffers if cache isn''t used.


    # RAID 5: Striiped with distributed parity (3-5 minimum)


    Description: A second drive failure during rebuild is fatal-never hot spot.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_49_1.png)


    # RAID 6: Dual parity


    Description: RAID 5 with an additional drive to guard against a second drive failure
    during a rebuild. In above example, it allows for 2 parity blocks per drive, instead
    of one.


    Performance: Since each parity region is calculated separately, the RAID 5 performance
    impact is doubled. Some performance loss during multi-drive parity calculations
    and background rebuilds.


    # RAID 6


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_49_2.png)'
