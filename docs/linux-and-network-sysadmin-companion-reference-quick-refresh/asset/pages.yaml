  md: '# Copper Ethernet Cabling Types


    | 10BASE2 (thinnet) | RG-58 coax | 10 Mbps | 185 meters |

    | 10BASE5 (thick) | RG-8 coax | 10 Mbps | 500 meters |

    | 10Base-T | Cat3 (POT) or Cat5 | 10 Mbps | 100 meters |

    | 100Base-T (fast ethernet) | Cat5 | 100 Mbit/s | 100MHz |

    | 1000Base-T (gigabit ethernet) | Cat5e | 1Gb/s | 100MHz |

    | 1000Base-T | Cat6 | 1Gb/s | 250MHz |

    | 10Base-T | Cat6a (not TIA/EIA rated) | 10Gb/s | 500MHz, shielded |

    | 10GBASE-T | Cat7 | 10Gb/s | 600MHz, shielded |


    Cat5/6 have same performance difference at different lengths and shorter; Cat
    5e achieve maximum efficiency at 55 meters. When using copper ethernet cables
    the length should not extend more than 100m (-328ft).


    # Power over Ethernet (PoE)


    Endspan PoE means power in switch. Midspan means a Power Injector is used to add
    power over each pair. Mode A (phantom): Power and data same twisted pairs; Mode
    B: Separate for power and data. IEEE 802.3af (802.3 type 1) specifies a max.15.4W,802.3at
    (type 2) specifies a max of 30W (typically 25W)


    # Other Cabling Types and Specifications


    All RG (Radio Guide) specs use a flexible Cat5 F-connector on coaxial cable. Bases
    means "baseband"

    RG-6 is commonly used by local cable to connect individual homes to the distribution
    point. For higher frequency signals over longer distances (~70 meters). RG-6 replaced
    by RG-7 with better shielding.

    RG-9 shorter distance, like component video; older shielding, susceptible to UHF
    interference, impedance of 75 Ohms.

    RG-6 was preferred for video.

    RG-58 - 10BASE2 max length 185 meters; impedance 50 Ohms. Better frequency range,
    shielding

    RG-8-10BASE5, 500 meters. RG-8 and -9 to replace RG-6 and RG-9

    -500 for heavy outdoor use (buried) - a FAT core, 75 Ohms, super-long range


    # Fiber Optics: LX FX and S''s can do MFP - Fx has full and half duplex (duplex)


    | 100Base-SX | 100Mbps | MMF (short wavelength laser) |

    | 100Base-FX | 100Mbps | 2km duplex, half-duplex | MMF |

    | 1000Base-LX | 1000Mbps | 10km SMF or 500m MMF (both SMF and MMF) |

    | 1000Base-LH | 1000Mbps | 10km | SMF |

    | 100Base-ZX | 1000Mbps | SMF |

    | 10GBASE-SR and SW | 10 Gbps | 300m (short reach) | MMF |

    | 10GBASE-LW | 10 Gbps | 10km | SMF |

    | 10GBASE-ER and -EW | 10 Gbps | 25km (long reach) | SMF |

    | 100GBASE-ER4 | 100 Gbps | 40km (extended reach) | SMF |

    | 100GBASE-SR10 | 100 Gbps | 100-125km | MMF |


    Advantages of fiber: difficult to monitor (tap), and no IR support, support long
    distances

    Multimode (MMF) refers to different light frequencies bouncing a fiber bundle;
    often uses LEDs (less expensive), so signal

    degrades at a shorter distance. The core is 62.5 microns or larger in diameter

    Singlemode (SMF) uses a single fiber with single frequency of light; more expensive-lasers
    to make the distance and increase

    signal. Typically uses a small carrying core of 8 to 10 microns in diameter.'
