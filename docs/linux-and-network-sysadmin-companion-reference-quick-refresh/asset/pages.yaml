    nmap -T6 -Pn -v -openU -sU -oA ipv6_udp -il/targets.txt


    # SCTP


    Stream Control Transmission Protocol (SCTP) is a protocol that sits alongside
    TCP and UDP. It provides transport of telephony data over IP, the protocol duplicates
    many of the reliability features of SS7, and underpins a larger family of protocols
    known as SIGRAN. SCTP is supported by operating systems IBM AIX, Oracle Solaris,
    HP-UX, Linux, Cisco IOS, and VxWorks.


    # SCTP chunk types


    | ID | Value | Description |

    |---|---|---|

    | 0 | DATA | Payload data |

    | 1 | INIT | Initiation |

    | 2 | INIT ACK | Initiation acknowledgement |

    | 3 | SACK | Selective acknowledgement |

    | 4 | HEARTBEAT | Heartbeat request |

    | 5 | HEARTBEAT ACK | Heartbeat acknowledgement |

    | 6 | ABORT | Abort |

    | 7 | SHUTDOWN | Shutdown |

    | 8 | SHUTDOWN ACK | Shutdown acknowledgement |

    | 9 | ERROR | Operation error |

    | 10 | COOKIE ECHO | Cookie |

    | 11 | COOKIE ACK | Cookie acknowledgement |

    | 12 | ECN | Explicit congestion notification echo |

    | 13 | CWR | Congestion window reduced |

    | 14 | SHUTDOWN COMPLETE | Shutdown complete |


    Tools such as Nmap and SING do not find information from private addresses (behind
    NAT), as low- levelful analysis of the traffic flowing into and out of a network
    is required. A simple example of this can be seen in the ISS BlackICE forensic
    event log in Figure 4-1 as a simple ICMP ping sweep is performed.'
