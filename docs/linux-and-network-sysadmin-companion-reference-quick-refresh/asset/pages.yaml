  md: "docker create | import | export | ls | rm | use | show | inspect | update Import/export\
    \ works with zip or tar data\n\nContext info metadata specifying a name, endpoint\
    \ configuration(s), TLS info, orchestrator(s), usually json files\n\ndocker checkpoint\
    \ create | annotate | rm\n\nCheckpoint and Restore allows you to freeze a container\
    \ by checkpointing it, which turns its state into a collection of files on disk.\
    \ Later, the container can be restored from the point it was frozen.\n\ndocker\
    \ manifest create | inspect | push\n\nA manifest holds info on image-name, sizes,\
    \ and design. The command runs for each arch it was built for. A manifest can\
    \ contain several images, intended for ል difference in different os/arch combinations,\
    \ so are often referred to as \"multi-arch images\". The command is experimental\
    \ and has been since 2017.\n\n# Docker Swarm Management Commands\n\nShould be\
    \ executed on a swarm manager node.\n\n| docker config | inspect | ls | Manage\
    \ Swarm config |\n| docker secret | inspect | ls | Password for Swarm manager\
    \ |\n| docker stack | deploy | ps | ls | rm | services | List of stacks, lists\
    \ services, outputs config details\n| docker service | create | deploy | rm |\
    \ inspect | Update Manager services\n| docker service | rollback | scale | ps\
    \ | rm | inspect | logs update\n| docker swarm | init | join-token | unlock-key\
    \ | join | leave |\n\n# Docker Run Options\n\ndocker run -name=container3 -it\
    \ [IMAGE] | Names the container, -keeps STDIN open, -t gives a pseudo-tty\ndocker\
    \ run -d ubuntu /bin/bash | -a a specific terminal alias, ubuntu is the image,\
    \ and is with -p port-to-port container mapping\ndocker run -p 8080:8080 /ubuntu\
    \ | Use the host port to publish to 80 (can be any host IP)\n\nDetached:\n\n+\
    \   - Running for detached containers in background. Allows closing the session\
    \ without stopping the container\n- Exits when the process starts exiting; using\
    \ -d --rm, it's removed from exit or when the daemon exits.\n- Don't send a command\
    \ | docker exec to start a detached container. This uses syntax: nginx -g daemon\
    \ off'.\n- To input/output with detached container use network connections or\
    \ shared volumes. These are required for I/O and this is why the -it option is\
    \ needed\n- The container stops logging to the terminal where 'run' was executed.\
    \ Network connections or shared volumes are preferred for why the -tty is provided\
    \ (provides TTY)\n\nForeground:\n\n+   - Default mode when -it is not specified.\
    \ The tty and stderr are attached if you use the -a option (no stdinin)\n- Using\
    \ the options \"-it\" is common to provide TTY connection, which you can also\
    \ say -stdin -a -stout -a\n\nNames are user-friendly UID and short identifiers\
    \ assigned by the Docker daemon. When networking\n\n# Docker Run Network Options\n\
    \n| --name=<container> | Network stack on Docker bridge\n| --container | Connect\
    \ to another container's network stack\n| --host | \n| --network=<name>|<container-id>\
    \ | Connect to a defined network\n| --none | None\n| --network-alias=<alias> |\
    \ Add node-aliases for the container\n| --add-host=<host>:<ip>|ip6 | Specifically,\
    \ set container's ethernet MAC, IPv4, or IPv6 addresses\n| --link | Set the 1st\
    \ container's host IPv4/IPv6 addresses\n| --dns | DNS servers\n\nBy default, networking\
    \ is on all containers disabled (with \"none\"); can make any outgoing connections-yet\
    \ mapping ports as previously seen here and linking to other containers with the\
    \ same bridge default. These are legacy Docker methods which have evolved. It's\
    \ obvious from the command list above are now more granular and natural to what\
    \ we expect from actual hardware.\n\nThis is part I of a Docker overview completely\
    \ being rewritten from scratch. Part II will finish networking, cover security\
    \ topics, builds files, and wrap the general topics"
