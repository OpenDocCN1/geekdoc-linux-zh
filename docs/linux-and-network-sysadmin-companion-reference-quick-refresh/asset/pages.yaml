    ST (Straight Tip) SC (Subscriber Connector) LC (Local Connector) MT-RJ


    The SC as called a subscriber, standard, or square connector. The MT-RJ is known
    by two names, the "Media Termination Recommended Jack" and "Mechanical Transfer
    Registered Jack". It has two fiber strands that is, a transmit strand and a receive
    strand included in a single connector. Despite the second nickname, it doesn''t
    lock into place or anything.


    The LC (Lucent/Local Connector) is a connector that connects to terminating device
    by pushing the connector into the terminating device with a "click" and can be
    removed by depressing the connector to pull it out. A Straight Tip connector is
    similar to the SC connector; most used with multimode; connects by pushing the
    connector into place. Multimodal Delay Distortion - on multi-mode fiber-optic
    cables when an initial transmission can reach the receiver after a second transmission


