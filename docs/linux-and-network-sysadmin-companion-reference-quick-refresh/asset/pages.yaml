- pgno: 175
  md: '# Cisco Proprietary GLBP - Gateway Load Balancing


    Introduced in Cisco IOS 12.2(4) for routers, but is not consistently supported
    across all platforms.

    - Group members elect one gateway to be the active gateway (AVG)

    - Members are active virtual forwards (AV), backup for AVG in the event it becomes
    unavailable.

    - The AVG assigns a different virtual MAC address to each AV (which becomes their
    identifier).

    - Each AV responsibility for forwarding packets to the virtual MAC address assigned

    - If an AV fails, others assume responsibility for the virtual MAC address

    - Precedence is priority value, or the highest IP address in the group

    - Multiple authentication and multiple available gateways, automatic failover

    - No configuring multiple groups or multiple gateway configurations using HSRP/VRRP

    - Maximum of four routers in each group. Technically the AVG is an AV (it is "special")

    - Up to 1024 routers as GLBP groups on each router''s physical interface (range
    0-1023)

    - Up to four AVs per group at a time, seconds can be backed up if one


    +   - Priority is 1-255, default 100. Higher is preferred.

    - Preemption is default for AVG; AVG prevent default of 30 seconds.

    - Hello timer 3 sec; range 1-60 sec. If msec is used, the timer will switch to
    msec, range of 50-60,000 ms.

    - Hold timer 10 sec; range 19-180 sec. If msec is used, the timer will switch
    to msec, range of 18,020-180,000 ms.

    - Virtual MAC have the form 0007.bxxx.xxxx - UDP 3222.

    - The 16-bit value represents xx.xx represents 0 bits followed by a 10-bit GLBP
    group.

    - Group number 8-yy is the virtual value for number forward.


    # Three types of load balancing


    Host-dependent uses MAC address of a host to determine which AV MAC address to
    use.

    - The option using virtual NAT (nat) needs each host to be returned to the virtual
    MAC address each time it sends an ARP request for its virtual IP.

    - Not recommended for where there are fewer than 20 hosts.

    - Weighted - a place using the forwarding capacity of router B, weighting value
    should be configured accordingly

    - If router A has twice the forwarding capacity of router B, weighting the group
    x where y is, where x is the group number, and y is the weighting value (1-254)

    - Router-based uses AV MAC address it sequentially in ARP requests for virtual
    IP.

    - If no load balancing is used, GLBP will operate as HSRP, the AVG will only request
    requests with its own AV MAC address, and all traffic will be directed to the
    AVG. Use no glbp load-balancing.


    It is recommended that you are extremely familiar with the design and mechanisms
    of GLBP that do not change the timers. Reset timers to default no glbp times,
    where x is group number.


    | router(config)#interface ethernet0 | (all of these are interface config mode)
    |

    | ip address 172.162.100.5/255.255.255.0 | Assign IP address and mask |

    | glbp 10 ip 172.162.100.1 | Put group 10 on int if/ this router has higher priority
    than current AV |

    | glbp 10 preempt | Take over AVG for group 10 if this router has higher priority
    over current AV

    | glbp 10 preempt delay 60 | Wait before preemption-AVG delay of 60 seconds

    | glbp 10 forwarder preempt | Take over AV for group 10 if this router has higher
    priority over current AV

    | glbp 10 forwarder preempt minimum 60 | Wait before preemption-AV delay of 60
    seconds

    | glbp 10 priority 150 | Sets the priority level of the router |

    | glbp 10 timers timers 15 | Configures hello timer 5 sec and the hold 15 sec

    | glbp 10 timers hello 2020 msec 60600 | Hello 2000 msec hold timer to 60600 msec
    GLBP for plain text authentication

    | glbp 10 authentication method text | Configures GLBP for text authentication

    | glbp 10 authentication md5 key-chain-value | Configures GLBP for MD5 authentication

    | glbp 10 load-balancing host-dependent | Load balance using the host-dependent
    method.

    | glbp 10 load-balancing weighted | Load balance using the weighted method.

    | glbp 10 weighting 80 | Set maximum weighting value for this interface

    | glbp 10 load-balancing round | Load balance using the round-robin method.


    Wei'
