  md: '# vmstat - Memory, Processes, Paging etc


    vmstat -a also displays active and inactive memory. Display units in KB and MB
    with -unit k m

    vmstat 2 - every 2 second interval, we want to see 5 polling groups (rows of data).
    Just like iostat, the first line is going to be bigger because it is generic overview
    of the last period of total system activity


    | proc | memory | swap | system | cpu |

    | r b w | swpd free buff cache | si so bo in cs us sy id wa |

    | 2 0 | 120 30180 1736 46696 0 | 0 424 25 134 77 5 9 86 |


    Fields definitions:

    Proc - r: Running for CPU; Uninterruptible sleeping (for I/O); Swapped out processes

    Memory - swpd: swap areas (in proc/swaps); free memory; buffers; cache: cache
    used

    Swap - si: Memory swapped in and out of disk - get more info about when top show
    swap usage

    IO - bo: Blocks received from/to block device (like a hard disk)

    System - in: interrupts; IRQs per second, including the clock; context switches
    per second.(When the CPU switches tasks among programs)

    CPU - us: user time, non-kernel code including time; sy: kernel code; system time
    - network, IO interrupts, etc; id: idle time. Prior to Linux 2.5.41, IO-wait time.


    ```

    vmstat -s helps more info dumped like this:

