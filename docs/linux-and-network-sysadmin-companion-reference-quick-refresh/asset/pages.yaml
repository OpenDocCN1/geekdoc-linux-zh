    QoS

    wirelessaver - Auto-magic tool that incorporates a number of techniques to seamlessly
    attack a WEP key

    Typical WPA-PSK: Cracking the wireless driver, bringing it back into monitor mode
    with airmon-ng, firing airdump-ng to capture packets, and using airplay-ng to
    inject deauthentication packets at a client, so that your four-way handshake can
    be captured when attempt to reauthenticate with the app. You run aircrack-ng to
    crack the shared key in the pcap file. Chances are slim if it won''t match in
