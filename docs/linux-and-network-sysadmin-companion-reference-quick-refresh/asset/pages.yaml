- pgno: 10
  md: '# # Important Log Locations and Usage!


    Commands for viewing, including those with ''relevant command'' listed: cat, tail,
    grep, less, zgrep, zmore, etc.


    | Log location | Relevant command | Comments |

    |---|---|---|

    | /var/log/messages | | Includes security related info- where PAM is logged (Ubuntu
    after nasty needs /var/log/syslog) |

    | /var/log/boot.log | | Self-explanatory see boot.log. for older logs |

    | /var/log/wtmp | last | Successful ("working") logins, logouts, reboots |

    | /var/log/btmp | last reboot | Shows history of failed login attempts (mnemonic
    "bad") |

    | /var/log/lastlog | lastlog | Shows recent users |

    | /var/log/secure | | Auth privileges messages, Boot and boot dmesg |

    | /var/root/install | dmesg | Is updated - to keep fresh files from history installs
    |

    | /var/log/anaconda.log | | System info on Red Hat Systems |

    | /var/log/dpkg.log | | dpkg logs for Details/removes (see also /apt/ directory)
    |

    | /var/log/yum.log | | yum command log for Red Hat installs |

    | /var/log/kern.log | | Kernel logs |

