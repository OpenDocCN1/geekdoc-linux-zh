  md: 'You can verify GLBP operation with the show glbp [brief] command. With the
    brief keyword, the GLBP roles are summarized showing the interface, GLBP group
    number (Grp), virtual forwarder (Fwd), GLBP priority (Pri), state, and addresses.


    # Switch-A# show glbp brief


    | Interface | Grp | Pwd | Pri | Address | Active router | Standby router |

    |---|---|---|---|---|---|---||

    | V150 | 1 | - | 200 | 192.168.1.1 | local | 192.168.1.11 |

    | V150 | 1 | - | 7 | Active | 0007.b400.0101 | local | |

    | V150 | 1 | 2 | 7 | Listen | 0007.b400.0102 | 192.168.1.11 | - |

    | V150 | 1 | 3 | 7 | Listen | 0007.b400.0103 | 192.168.1.12 | - |


    Switch-A#


