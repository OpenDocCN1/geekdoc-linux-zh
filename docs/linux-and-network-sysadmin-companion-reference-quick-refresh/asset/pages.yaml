  md: '# Some flags available in Nmap (https://nmap.org/book/man-briefiefs.html)


    ```

    TCP connect count -sR RPC -oN Normal output

    SYN scan -sL List/DNS scan -oX XML output

    FS scan -sF Idle case -oG Greppable output

    Xmas tree -sX OS detection -A Aok output

    Null scan -sPT TCP -T Paranoid Serial scan: 300 sec between

    Ping scan -sP SYN -T Sneaky Serial scan: 15 between scans

    UDP scan -sU UDP -T Polite | scan: 4 between scans

    Protocol scan -sB Protocol -T Normal Parallel scan: 300 sec, 0.3 sec/12

    ICMP ping -sI ICMP ping -T Aggressive, 300 sec timeout, 0.3 sec/1

    Windows scan -sM netmask -T Insane 15 sec timeout, 0.3 sec/6

    ```


    IP PROTOCOL SCAN

    Looks for supported protocols other than TCP; it sends raw packets with values
    in the protocol field of the header (somehow "clumped"). If we get a response
    in the same packet, it looks for ICMP Port Unreachable if it''s unsupported (somehow
    "weopen"). If we get some ICMP unreachable message, it''s probably filtered. If
    we don''t get anything, it''s either open (and filtered) or refused.


    FTP bounce scanning

    Hosts running outdated FTP services can use the PORT command (RFC 959 or technical
    description) for scanning. There is a flaw in the way FTP services makes connections
    using the PORT command allows data to be sent to user-specified hosts and ports.
    In their default configuration, the FTP services running on the older Unix-based
    platforms are affected


    The FTP bounce attack can have a more devastating effect if a writable directory
    exists where series of commands or other data can be entered into a file and then
    relayed via the PORT command to a specific port of a target host. For example,
    one could upload an email message to a FTP server and then send this message to
    the SMTP port of a mail server.


    +   1. The attacker connects to the control port (TCP port 21) of the FTP server
    that she is going to bounce attack and receives a passive response, forcing the
    FTP server to send data to a specific port of a specific host:

    QUOTE PASV

    227 Entering Passive Mode (64,128,246,22,56,185)

    2. A PORT command is issued, with an argument passed to the FTP server telling
    it

    to attempt a connection to a specific TCP port on the target server; for example,
    TCP port 23 out of 143.51.17.230:0,23

    200 PORT command successful.

    3. After the PORT scan successful, a LIST command is sent. The FTP server then
    sends the attempts to create a connection with the target host defined in the
    PORT command previously:


    ```

    LIST

    150 Opening ASCII mode connection for file list

    226 Transfer complete.

    If a 226 response is seen, then the port on the target is open. However, if a
    425 response is seen, the connection has been refused:\LIST

    425 Can build data: Connection refused

    nmap maps FTP port bounce scanning with the -p0 and -b flags in the following
    manner:

    nmap -p0 -b username:password@ftp-server:target host

    ```


    The -p0 flag must be used to ping of the target host, as it may not be accessible
    from your location (e.g., if you are bouncing through a multiphed FTP server).
    Also, you may not want your source IP address to appear in logs at the target
    site.


    Proxy bounce scanning

    Attackers bounce TCP ports through open proxy servers. On the level of poor configuration,
    the server will always allow a full-blown TCP port scan to be relayed. Using proxy
    servers to perform bounce scanning in this fashion is often time-consuming, so
    many attackers prefer to use open proxy servers by bouncing attacks through to
    the target host.


    ```

    ppsscan.c, a publicly available Unix-based tool to bounce port scans, can be found
    in source at:\http://examples.oreilly.com/networktools/tools/ppscan.c http://www.phreat.org/archives/unix/network-scanners/ppscan.c

    ```


    > (NMAP) When scanning hardened environments, you should use the -Pn flag to avoid
    scanning of each address within scope. A slower timing policy (such as -T2) is
    also helpful, as an aggressive policy will trigger SYN flood protection by firewalls'
