    # ICMP Echo/List scan


    ICMP echo scanning is used to discover live machines by pinging all the hosts
    in the target network. ICMP probes to

    t broadcast or network address are related to all the hosts in the subnet. The
    system will send ICMP

    reply to the message of ICMP echo probe.

    nmap -P 192.168.0.2 -OR --nmap -sn 192.168.0.2 -OR -nmap -sU -v 192.168.2.5


    # UDP Scanning -uV


    UDP sends packets to target port, often but some commonly known ports need a specific
    payload, as Nmap

    firewalls also drop packets without responding, and nmap might just drop packets
    or time out. A UDP response means it is

    open, may be either open or filtered (can''t tell), Nmap running with version
    detection (-uV) helps there

    a bit.

    If you get a UDP response, it''s open

    If the port is closed, it will likely show an ICMP port unreachable (type 3 code
    3)

    If it is another ICMP unreachable error (type 3, 1, 2, 9, 10, or 13) it''s filtered.


    Some OS limit the frequency of ICMP Port Unreachable messages, Nmap adjusts accordingly.
    Microsoft-based OSs do

    usually implement any type of ICMP rate limiting. Not useful for most type of
    attack, but it can reveal information about

    some exploitable services (DHCP, SNMP, NFS, etc.). Malware uses UDP

    nmap -uV 192.168.0.2'
