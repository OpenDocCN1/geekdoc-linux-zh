- pgno: 202
  md: '# Bigger Picture: Route Manager: wins


    Administrative Distance- Lowest score wins

    How the Route Table Manager (RTM) chooses from multiple active routing protocols
    available to get the same subnet advertised on one of them. Lower AD is chosen.


    To understand this, a directly connected device has an AD of 9 (as it should)


    | Static | 1 | IS-IS | 115 |

    |---|---|---||

    | EIGRP summary | 5 | RIP | 120 |

    | External BGP | 20 | external EIGRP | 170 |

    | Internal BGP | 90 | internal BGP | 200 |

    | OSPF | 110 | Unknown* | 255 |


    Timers - How to choose a good protocol in your days:

    These are the defaults. For reference to how to change them, like ''ip hello-interval
    eigrp'' or ''ip hold-time eigrp''


    | Protocol | Type | Hello/Keepalive | Hold/Dead | Notes |

    |---|---|---|---|---|n| RIP | DV | Update 30 sec | Timeout 180 sec; Flush 120
    sec | |

    | OSPF | SC | BC+10 sec | BC+40 sec (4x hello) | For NBMA 30 sec hello/ 120 sec
    dead (4x) |

    | EIGRP | AddDV | BC+5 sec | BC+15 sec (3x hello) | For NBMA 60 sec hello/ 180
    sec dead (3x) |

    | IS-IS | IS | 10 sec | Juniper 7 sec | Also has L1 and L2 timers. PiTP vs NBMA.
    For Juniper 9 sec. See documentation.

    | BGP | PathV | 60 sec keepalive | 180 sec (keepalive) | |


    OSPF Path Cost in Routing - Don''t get confused with Gateway Cost Training!

    Choosing the best route-reference=reference_bandwidth/interface_bandwidth.


    | Interface | Default Bandwidth (Kbps) | Formula (Kbps) | OSPF Cost |

    |---|---|---||

    | Serial | 1544 Kbps | 100,000/1544 | 64 |

    | Ethernet | 10000 Kbps | 100,000/10000 | 10 |

    | Fast Ethernet | 100000 Kbps | 100,000/100000 | 1 |


    The default ref bandwidth assumes the fastest link in the network at 100 Mbps.

    Use auto-cost reference-bandwidth 10000 to accommodate links up to 10 Gbps.


    Here are the rules for how to set your OSPF interface costs:

    - Set the cost individually, with ospf cost interface, to a value between 1-65535

    - To affect all routers on the device, use distance 80. This affects the AD of
    non-OSPF routes.\ Change interface bandwidth with the bandwidth speed command,
    with speed in Kbps

    - Change the reference bandwidth, using auto-cost reference-bandwidth ref-bw,
    in Mbps


    STP Path Cost:

    10 Mbps 2000000

    100 Mbps 200000

    1 Gbps 20000

    10 Gbps 200

    100 Gbps 200


    Distance vector metric:

    Split Horizon is not advertising the route back from where it learned from. Poison
    reverse leaves "where it came from" an unreachable link with "metric (16 for RIP).

    Split-horizon with poison reverse is a variant of split horizon advertising in
    which a router actively advertises routes as unreachable with metric (16 for RIP).
    The effect of such an announcement is to immediately remove looping routes before
    they can propagate through the network.


    The major disadvantage of poison routing is that it can significantly increase
    the size of routing advertisements in certain common topologies, but it also allows
    for the improvement of the overall efficiency of the network in case of faults.
    Split horizon happens if a neighboring router sends a route to a router, the receiving
    router will not propagate this route back on the same interface.


    With poisoning, when a router detects that one of its connected routes has failed,
    the router will poison the route by assigning an infinite metric to it and advertising
    it to neighbors. When a router advertises a poison route to its neighbors, neighbors
    break the rule of split horizon and send back to the originator the same poisoned
    route, called a poison reverse. In order to give the router enough time to propagate
    the poisoned route and ensure that no loops occur while propagation occurs, the
    routers implement a hold-down mechanism.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# BGP Overview


    +   - Built for reliability, scalability, control - not speed.

    - It is a path-vector protocol. Routing between ASs is called interdomain routing

    - It uses TCP port 179. BGP exchange information, triggered route updates and
    periodic keepalives.

    - The administrative distance for EBGP routes is 20, for IBGP routes is 200.

    - Rou run only one instance/process of BGP at a time; are called BGP speakers;
    neighbors are BGP peers

    - Networks not the local route will not be updated

    - Routes learned by BGP process are propagated by default but often filtered by
    a routing policy.

    - When an update reaches a network AS, it''s pruned from the list of ASs that
    have been updated. Once it receives an update, it examines the AS list. If it
    finds its own AS in that, the update is discarded (loop prevention/ split-horizon)

    - No summary and no synchronization defaults in BGP


    Because BGP uses TCP, for reliability, error recovery, and control.

    Before a BGP speaker can peer with neighbor must be statically defined; TCP-capable,
    it reachable. You also get the buffering and other TCP benefits (resilient segments
    if it reaches 0; acknowledgement may be delayed up to a 1 second to determine
    if any data should be sent); the underlying TCP connection can be shown with ''show
    tcp peer''.


    # Autonomous Systems and ASNs


    AS is a group of networks under a common administration. ASN range from 0 to 65,535,
    64,512 - 65,534 ASNs are private (private means can connect to only one other
    AS or multiple ASNs that cannot loop.


    | ASN range | 0 | 1-64,495 | 64,496-65,511 | 64,512-65,534 | 65 |

    | Purpose | Reserved | Public ASN | Documentation | Private ASN | Reserved |


    Public ASNs are assigned and registered by RIPE NCC, which are used in EBGP using
    the ''ebgp-neighbor-address private-advertise-as''.


    Path Attributes: AS PATH and routing


    +   - Path Attributes (AS PATH) are factors that allow BGP to select another route.
    By default, no BGP peers have been set, and BGP uses AS PATH when choosing the
    best route among many routes.

    - When a router advertises a route with AS, it will list the ASNs path go through,
    to help find the shortest path and prevent loops.

    - Looping is prevented by ignoring route updates that contain the current AS''s.


    # Internal and External BGP


    BGP peering: IBGP if AS, EBGP if AS. If the configured in a router''s BGP and
    neighbor statements match, BGP initiates an internal session (IBGP); otherwise
    an external session (EBGP).

    When connecting to an IBGP peer, no AS is added-not. To an EBGP peer, it''s AS
    is added.

    There are two types of routing:


    +   - Hot-potato routing: traffic exits the AS via the closest exit point.

    - Cold-potato routing: traffic exits the AS via the closest to the destination.


    # BGP Databases


    BGP uses three databases:


    +   - BGP DB, or RIB (Routing Information Base): Networks connected to BGP, with
    paths AS PA - show ip bgp

    - Routing Table: Paths that used by the router, and the next hop for each - show
    ip route

    - Network Database: All configured BGP neighbors, show ip bgp


    # BGP States and Type Name


    The BGP process has different states, managed by a Finite State Machine (FSM).
    The states do not have specific names like''s in OSPF, just help type, active,
    and


    | State | Meaning |

    | Idle | Administratively down or waiting; needs TCP connection initiated by peer.
    Listening.

    | Connect | TCP handshake. If successful, router sends BGP session open and changes
    to Open. If not open, router connects the ConnectRetry timer and goes to Active
    if it reaches 0 while the router is in Connect state, timer is reset and another
    attempt is made, remaining in Connect.

    | Active | TCP connection, but no BGP peers means to send to peer. It''s trying
    again. If ConnectRetry timer expires, it kicks back to Connect. If peering fails
    fails, can also mean TCP session attempts were made from an unexpected IP address,
    which are rejected. If that''s the case, it stays in Active and resets ConnectRetry.
    (attack vector)?

    | OpenSent/ | TCP connection, an Open message has been sent to peer. Transitions
    to OpenReceive to wait for'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'OpenReceive initial keepalive received from peer into OpenConfirm state.

    If TCP disconnect, router terminates session, sets ConnectRetry timer, and goes
    back to Active.


    OpenConfirm messages finished, initial keepalive received. Sends Keepalives to
    peer to see match, and lists. On receipt of keepalive, moves to Established, else
    to Idle


    Established achieved after more Keepalives from peer. All neighbor parameters,
    the neighbor relationship works, and the peers can exchange Update messages.


    To check, use sh ip bgp summary. State/PRcode shows a numerical value for a state
    of Established-: if not in an Established state, the value in this heading lists
    the text name of the BGP state


    +   All BGP messages share the same header, composed of:

    - 16 byte field: set to 10 to detect a loss of synchronization.

    - 2 byte length field: total length of BGP message, range from 19 to 4096

    - There is a PA Field in Update (AS Path Attribute)

    - 1 byte type code, identify different BGP messages - the number (n) in below


    | Message (type) | Purpose |

    |---|---|

    | Open (1) | First code after TCP connection has established to get neighborhood
    started. BGP version, host ID, BGP identifier, optional authentication |

    | Keepalive (4) | Maintaining connection. Contains only header. Keepalives every
    60 sec by default. By default, hold time is x keepalive interval. Updates also
    reset keepalive interval |

    | Update (2) | Used to exchange paths and the associated prefix/length (NLRI)
    that uses those. Each contains a single set of paths and all NLRI. Also contains
    withdrawn routes.

    | Notification (3) | Errors with code, subtype, and data. Often signals resets
    connection |


    All prefixes, filtered by neighbor <ipaddr> route-map<name> in, are in the routing
    table for configuration.


    eBGP neighbor

    To configure BGP, you need at least 2 commands


    ```

    config/router bgp <asn>

    config/router# neighbor <ipaddr> remote-as<asn>

    ```


    +   For BGP neighbor relationship to,

    - TCP connection between them must first be established

    - Routers need complimentary neighbor <ipaddr> remote-as-<asn> with matching AS
    and the IP address of the interface for which TCP packets exit (if this is not
    explicitly defined)

    - BGP RID must not be the same

    - MDS authentication must pass (if configured)


    +   BGP RID is established by

    1) bg router-<rid> - OR -

    2) highest IP address of any upay loopback interfaces at BGP initialization

    3) highest IP address of any up/normal interface at BGP initialization


    To configure authentication, use <ipaddr> password <password> on both routers.
    The <ipaddr> refers to the IP address of the other router, which must be unique
    for identification connect.


    To verify neighbor, show ip bgp shutdown and show tcp peer to display the TCP
    connection

    Use neighbor <ipaddr> shutdown to shut down connection, move to Idle (keeps neighbor
    config).


    +   The ''neighbor'' command is configured with the peer-group, manner set of
    commands can be applied to all neighbors in the peer-group (either or internal,
    not both)

    Simplify configuration and updates.

    neighbor <name> peer-group

    neighbor <ipaddr> peer-group-<name>

    (neighbor must have ''neighbor remote-as as'')


    In most IGFs, the network command starts the routing process on an interface.

    In BGP, the command tells the router to originate an advertisement for network.


    +   - network does not have to be connected - it has to be in the routing table.

    - a network in an event AS (which is usually recommended, but next-hop-self sort
    of does) it


    +   BGP assumes you use the default subnet mask

    - need to advertise a subset? Use the optional keyword mask and specify the subnet
    mask to use

    - routing table must contain an exact match (prefix and subnet mask)


    Network declarations need to be SPECIFIC'
