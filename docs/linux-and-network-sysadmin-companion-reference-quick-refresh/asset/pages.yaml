    (realm): (Optional) Defines your FreeIPA name (e.g., EXAMPLE.COM).

    server_principal: (Optional) Specifies name for FreeIPA server. Autogenerates
    as @hostname=<realm>\nserver_certificate: (Optional) Path to the server certificate

    server_key: (Optional) Path to private key file associated with the server certificate

    ca_cert: (Optional) Path to CA certificate used by the FreeIPA server

    offline: (Optional) True means communication with other FreeIPA servers (isolated
    domains)


    DNS Settings:

