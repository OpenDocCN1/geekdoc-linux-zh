  md: '# Jumps host and proxyjump - Transparently connected to a remote host through
    intermediate hosts


    ssh -J user1@jump-host user2@remote-host

    ssh -o "ProxyJump user1@jump-host" user2@remote-host


    Establishes a SSH connection with jump-host and forwards TCP traffic to remote-host.
    The J command will work out of the box if jump-host already has SSH access to
    remote. If it does not, you can use agent forwarding to forward the SSH identity
    of your local computer to remote.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_238_0.png)


    ssh -J jump-host1,jump-host2 ssh-server

    To specify comma-separated jump hosts.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_238_1.png)


    ssh -o ProxyCommand="nc -X 5 -x localhost:3000 %h %p" user@remote-host

    Connecting to a remote server through a SOCKS proxy using local. From the perspective
    of the server, the originating IP is from proxy-host. However, the SSH connection
    itself is end-to-end encrypted so proxy host only sees an encrypted stream of
    traffic between the local system and remote-host.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_238_2.png)


    SSH client configuration

    To enable forwarding, you ssh-add to add your local SSH identity to your local
    ssh agent.

    The ssh command will also add the configured user, in when using the host check
    proxy. /etc/ssh/ssh_config will be for system-wide SSH client configuration settings


    # Reliable Tunnels - Keeping SSH tunnels open over network failures


    The commands listed above work on an ad-hoc host, but if you want to maintain
    SSH tunnels through network outages or unreliable connections, you''ll need to
    do some additional setup. Another is, by default, the TCP connection used to establish
    an SSH tunnel may time out after a period of inactivity. To prevent timeouts,
    you can configure the server and client to send heartbeat messages by adding into
    /etc/ssh/ssh_config:


    On the server,

    ClientAliveInterval 15

    ClientAliveCountMax 4

    On the client:

    ServerAliveInterval 15

    ServerAliveCountMax 4


    # Using AutoSSH to establish dropped connections


    While the above options may prevent a connection from dropping due to inactivity,
    they will not re-establish dropped connections. To ensure that an SSH tunnel will
    be re-established, use autossh, which builds an SSH tunnel and monitors its health.

    AutoSSH accepts the same arguments as port forwarding.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_238_3.png)


    autossh -R 2222:localhost:22 -M 0 -o ServerAliveInterval 10 -o ServerAliveCountMax
    3 - remote-host


    Using the -M 0 flag disables the health check proxy and allows the SSH client
    to handle the health checks. In this example, the SSH client expects the server
    to send a heartbeat every 10 seconds. If 3 heartbeats fail in a row, the SSH client
    exits, and AutoSSH will re-establish a new connection.'
