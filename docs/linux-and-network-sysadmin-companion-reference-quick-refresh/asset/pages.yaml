- pgno: 44
  md: "# # SELINux Boolean\n\nBooleans conveniently permit runtime adjustments to\
    \ SELinux without the need to modify or reload the policy, and activate specific\
    \ functionalities processes seamlessly.\n\n| boolean - List of items with descriptions,\
    \ if on or off, and the default value State Default Description |\n| SELINux boolean\
    \ | (off, off) | Allow ftp to read and write files in the user home directories\
    \ |\n| ftp_home_dir | (off, off) | Allow xdm login as systemd |\n| xdm_system_login\
    \ | (off, off) | Allow wen to manage nfs files |\n| ssh_root_rw_homedirs | (off,\
    \ off) | Allow ssh with root to read and write files in the user home directories\
    \ |\n| postgresql_can_rsync | (off, off) | Allow postgres to use ssh for sync-in-time\
    \ recovery |\n| authlogin_shadow | (off, off) | Allow user login programs to access\
    \ /etc/shadow |\n| httpd_can_relay | (off, off) | Allow httpd to act as a relay\
    \ |\n| openvpn_enable_homedirs | (off, off) | Allow openvpn to read home directories\n\
    \n```\ngetsebool - | grep http provides a different value\nhttpd_scripting_->\
    \ on\nhttpd_network_connect -> on\nTo change a value with setboolean: setboolean\
    \ httpd_enable_cgi off - Make persistent -P (on and off can be 0 or 1)\nChanging\
    \ booleans is not done with selinux, so use setboolean -P\n```\n\n# ## Disabling\
    \ Specific (Target) Policies While Running\n\nWe need to edit the items in /booleans\
    \ directory and toggle the boolean:\necho \"1\" > /etc/selinux/booleans/disable_trans\n\
    Restarting boots is required by SELinux to see if it needs to refresh the policies\n\
    echo \"1\" > /sbin/service/pending_boots\nRestart the affected service: service\
    \ httpd restart\nApache is now running in the undefined_domain\n\n# ## MLS/MCS\
    \ Levels Explained\n\nThe order of operations in SELinux is as follows:\n1. DAC\
    \ (Discretionary Access Control, Linux permissions are permitted by the host OS)\n\
    2. TE (Type Enforcement, the most basic SELinux operation) is inspected\n3. MLS\
    \ (Multi-Level Sensitivity label allows access control, i.e., secret, top secret)\n\
    4. MCS (Multi-Category for access control based on categories)\n\n```\n# SELINux\
    \ User MLS/MCS Range\n_default unconfined_u s0:s0:c0-23\nroot unconfined_u s0:s0:c0-23\n\
    system_u system_u s0:s0:c0-23\n```\n\nLogin name lists list users, and SELinux\
    \ User lists which SELinux user is mapped to. For SELinux processes use user and\
    \ levels which are accessible. Finally, for MLS/MCS access is allowed\n\n MLS\
    \ range is a pair of levels, written as low-high, or level of categories. For\
    \ example: s0:s0 is the same as s0.\nEach level is a sensitivity-category pair.\
    \ If there are categories, the level is written as sensitivity-category. If there\
    \ are no categories, it is written as sensitivity.\n\nA continuous series of categories\
    \ can be abbreviated, e.g. c0,c1,c2,c3,...,c20,c23.\nThe /etc/selinux/targeted/setfiles.conf\
    \ maps files (s0:c0) to human-readable format (ie.g. ConfidentialFile). This file\
    \ needs to have changes to be made by semanage rather than manually edited.\n\
    MLS sensitivity levels range from s0 as the least to s15 as the most sensitive.\n\
    Default unconfined SELinux has s0:c0-1023 authorized for all categories.\nMLS\
    \ has up to 1024 categories: c0 to c1023.\n\nMLS is based on the Bell-Padula model,\
    \ used in Label Security Policy (LSP) environments. You have to install the package\
    \ [e.g., drf install selinux-policy], and configure the default SELinux policy.\
    \ This is is incomplete-you have to configure it specifically for your needs and\
    \ what it has for your needs- upstream SELinux Reference Policy may have a policy\
    \ that requires reboot but MLS is not something you can just unbox and it is ready\
    \ to go. A full discussion of it is out of the scope of this writing for\n\n#\
    \ ## Star utility for backup (SELinux) tar\n\n```\ntar does not archive security\
    \ context labels. Star has its own package: star-1.5a25-6.i386\nstar -xattr -H=exastar\
    \ -f newarchive.tar folder/ --- extended attributes, -c create, -f for\nstar -xattr\
    \ -f newarchive.tar ---x to extract\n```"
