    \ air waves. This will be in an appendix of sorts to talk protocols sooner.\n\n\
    # Layer 4 - Transport Layer (aka Host-to-Host), end-to-end data services between\
    \ hosts. TCP is a protocol with sequencing, acknowledgments-communications between\
    \ the participating hosts. UDP is connectionless and there is no verification\
    \ either gets the other host.\n\nTCP implements reliable networking - requiring\
    \ acknowledgments, sequencing, and flow control will be used. The 3-way handshake\
    \ virtual circuit setup; less of programming, but for real-time VoIP, UDP is often\
    \ better using it in less overhead, but is less reliable\nConnection establishment\
    \ and termination: SYN->ACK->SYN and sin and, FIN->FIN->~FIN!\n\nThe types of\
    \ flow control are buffering, sequencing, and congestion avoidance.\nSliding window\
    \ - TCP allows the receiving to dictate the amount of data the sender can send\
