- pgno: 38
  md: '# Using iw with wpa_supplicant


    | Action | iwconfig (outdated) | iw replacement |

    | --- | --- | --- |

    | Getting info on wlan0 | iwconfig wlan0 | iw dev wlan0 link |

    | Connecting | iwconfig wlan0 ssid feed | iw wlan0 connect feed |

    | Set channel | iwconfig wlan0 ssid feed freq 2432M | iw wlan0 connect freq 2432
    |

    | WEP | iwconfig wlan0 ssid feed key 4:abcde | iw wlan0 connect keys 0:abcde |

    | Join-ad-hoc | iwconfig wlan0 mode ad-hoc | iw wlan0 set type ibss |

    | Leave-ad-hoc | iwconfig wlan0 ssid feed (softtimes worked) | iw wlan0 ibss join-ad-hoc
    2412 |

    | Leave-ad-hoc | | iw wlan0 ibss leave (always works) |


    For WPA/WPA2 encryption, use wpa_supplicant.


    # Managing connections with wpa_supplicant / iw cli


    +   1. Run ip to get the name of the wireless interface. If not showing, the driver
    might need install

    2. Create a file in /etc/wpa_supplicant.conf * containing the following configuration
    line:

    ctrl_interface=DIR=/run/wpa_supplicant GROUP=wheel update_config=1

    GROUP specifies groups which can manage wpa_supplicant, and leaving blank means
    root only.

    3. Initialize by running wpa_supplicant -B -i wlan0? -c /etc/wpa_supplicant/example.conf

    -B means run in background, -i specifies interface, and -c points to config file

    4. Running wpa_cli gives an interactive prompt.


    iw-cli commands


    scan - will run scan

    scan_results - will dump the scan results of all networks including ssid, security,
    mode, and bsd/ mac


    add_network - to specify a network - provide ssid listed in scan. Key Number at
    the beginning is arbitrary

    > add_network 0

    > set_network 0 ssid "LOCAL_W"

    > set_network 0 psk "password"

    > enable_network 0 - will attempt to associate with the network just configured

    > save_config


    Running ip should show then new IP info

    After running save_config, the following will be appended to your configuration
    file:

    network={

    ssid="LOCAL_W"

    pk="password"

    }


    Now, running wpa_supplicant -B -i wlan0? -c /etc/wpa_supplicant/example.conf will
    connect.


    # Notes on Kismet


    Most things are self-explanatory with Kismet is not much to cover. In the network,
    W is WEP (yes, none; other); <no_ssid> means the AP isn''t broadcasting it; ssid;
    T is type; P (request probe-no association); A (access); H (ad-hoc); T (turbole
    airket or Lucent); G (group); D (data-only with no controls)

    Flags include F (AP using factory default settings/ not configured); Ti, UI, A#,
    Mean an address range of # octets found via type of traffic; TCP, UDP, ARP, and
    DHCP discovery

    APs are listed alphabetically, yellow means encryption; red: default factory settings
    in use; secure networks (WEP, WPA etc.); and blue means SSID clicking on / SSID
    notcast

    The kismet layout can be modified in /etc/kismet/kismet_ui.conf


    Help keys use type "c" to see clients on an AP, "i" for detailed info on an AP,
    "r" can show a stats graph, "a" for general stats on all APs, "w" to show all
    alerts that have come up in the status window


    The program LinSSID is a Linux alternative to inSSID -- https://sourceforge.org/projects/linssid/'
