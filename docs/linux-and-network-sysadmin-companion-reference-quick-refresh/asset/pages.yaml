- pgno: 36
  md: '# Getting Rid of Network Manager


    To disable Network Manager on a system:

    $ systemctl stop NetworkManager.service AND systemctl disable NetworkManager


    On a systemV:

    $ sudo service NetworkManager stop AND chkconfig NetworkManager


    In Debian 7 or earlier:

    $ sudo /etc/init.d/network-manager stop AND update-rc.d network-manager


    In Ubuntu or Linux Mint:

    $ sudo stop network-manager AND echo "manual" | sudo /etc/init/network-manager.override


    Slackware:

    $ /etc/rc.d/rc.network stop chmod a -x /etc/rc.d/rc.network


    In some versions of NM, "stop" may also kill dhcp and wpa_supplicant, so be sure
    to check.

    After disabling Network Manager on Debian or Ubuntu, use /etc/network/interfaces
    to configure network interfaces.

    After disabling Network Manager on Fedora or CentOS, use /etc/sysconfig/network-scripts/ifcfg-ethX
    files to configure network interfaces.


    # To disable Network Manager only for eth1 (example)


    Network Manager automatically ignores any interfaces specified in the file /etc/network/interfaces
    (Debian/Ubuntu), or the proper config file inside the directory /etc/sysconfig/network-scripts/
    (RHEL/CentOS/Fedora)

    Let''s say your interface is eth0.


    +   - For RHEL-compliant, make a file for it in /etc/sysconfig/network-scripts/ifcfg-eth0

    DEVICE="eth0"

    NM_CONTROLLED="no" # this is most important


    ```

    HWADDR=54:BA:DB:37:F1:04

    TYPE=Ether

    BOOTPROTO=static

    NAME="eth0"

    UUID=55b0b6d0-0bb0-7ffb-45f1-d6dd65f3e03

    IPADDRESS=192.168.1.44

    NETMASK=255.255.255.0

    # Optional put these here or add them to their file: vi /etc/sysconfig/network

    NETWORKING=yes

    HOSTNAME=centos

    GATEWAY=192.168.1.1

    # Same thing with - or add into resolv.conf #vi /etc/resolv.conf

    nameserver 8.8.8.8 # Replace with your nameserver ip

    nameserver 192.168.1.1 # Replace with your nameserver ip

    DNS1=8.8.8.8 # another optional format if it works for you

    DNS2=8.8.4.4

    # The reason these is optional is how you would see per-interface file

    # different default gateways and DNS if you had too. Not Always guaranteed to
    work but there is it.

    ```


    +   - For Debian /Ubuntu - In /etc/network/interfaces, add information about the
    interface you want to disable NM on

    $ sudo vi /etc/network/interfaces

    # Find/add your eth0 entry to disable Network Manager

    allow-hotplug eth0

    iface eth0 static

    address 10.0.0.10

    netmask 255.255.255.0

    gateway 10.0.0.1

    dns-namesvers 8.8.8.8


    For this to work you need to ensure the network service will bring up eth1 upon
    boot (since NM isn''t doing it)

    Systemd systems: $ sudo systemctl enable network.service

    SysVinit systems: $ sudo chkconfig network


    Upon rebooting, verify that Network Manager is successfully disabled for eth0
    via nmcli command.'
