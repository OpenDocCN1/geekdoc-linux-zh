- pgno: 237
  md: '# Remote port forwarding - Forwards a to a remote system through another system


    To forward traffic on an SSH server to a destination through the SSH client or
    another remote host. This gives users on public access to resources on private
    networks. Example use cases:


    +   - Making a local development server available over a public network

    - Granting IP-restricted access back to a resource on a private network


    SSH -R is OUTSIDE-ACCESS-IP:port:TO-INSIDE-IP:port SSHServerName


    # ssh -R 8080:localhost:80 ssh-server


    Forwards traffic to all interfaces on port 8080 on localhost host port 80 on your
    local computer. If one of these interfaces is available to the public internet,
    traffic connecting to port 8080 will be forwarded to other services


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_237_0.png)


    # ssh -R 70.114.193.221:8080:localhost:80 ssh-server


    Forwards traffic to ssh-server:localhost on your local system but only allows
    to the SSH tunnel entrance on ssh-server from IP address 70.114.193.221. This
    requires the GatewayPorts clientspec in the configuration of your ssh_config.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_237_1.png)


    # ssh -R 8080:example.org:80 ssh-server


    Forwards traffic to all interfaces on ssh-server:8080:localhost:80 on your local
    system. From your local system, traffic is then forwarded to example.org. From
    the perspective of example the traffic is originating from your local system.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_237_2.png)


    # SSH server configurations set in /etc/ssh/sshd_config


    By default, forwarded ports are not accessible to the public internet. You need
    to add to your ssh_config on your remote server to forward public traffic to your
    local computer.


    GatewayPorts yes

    If you want specific clients to be allowed, you can use this instead:

    GatewayPorts clientspecified


    # Dynamic port forwarding: To forward traffic from a range of ports to a remote
    server


    Opens a SOCKS proxy on the SSH client that lets you forward TCP through the SSH
    server to a remote host.


    # ssh -D 3000 ssh-server


    Opens a SOCKS proxy on port 3000 of all interfaces on your local system. This
    allows you to forward traffic through the ssh-server on any port or destination.
    By default, SSH will use the SOCKS protocol, which forwards TCP and UDP traffic.


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_237_3.png)


    # ssh -D 127.0.0.1:3000 ssh-server


    Opens a SOCKS proxy on 127.0.0.1:3000 on your local system. If you have a SOCKS
    proxy running, you can configure your web browser to use the proxy to access resources
    as connections were originating from ssh-server. For example, if ssh had access
    to other servers within a private network, you could access those servers locally
    as if you were on the network, without a VPN. Test the proxy like this:

    curl -x socks://127.0.0.1:3000 https://example.com


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_237_4.png)


    # SSH client configuration - /etc/ssh/ssh_config


    If you want the SOCKS proxy to be available to more interfaces than localhost,
    GatewayPorts yes

    When configuring your ssh client, you can configure it with a command instead
    of editing manually:


    ```

    ssh -o GatewayPorts=yes -D 3000 ssh-server

    ```'
  merge: -1
  img_proc: true
