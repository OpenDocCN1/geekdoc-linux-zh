  md: '# Utilities in the bind-package: dig, nslookup


    The host command for DNS lookup (using OS resolvers)

    -a: Displays all records for a domain (as -v). -l: Lists all hosts in the specified
    zone (transfer).

    -C: Checks DNS configuration and zone files. -t type: DNS record to query (e.g.,
    A, MX, NS, etc.).

    -W <seconds> (timeout), -r: Forces TCP ip under, -U: IPv4 only, -p: IPv6 only,
    -v: verbose


    The nslookup command for DNS queries direct to DNS servers

    -type or query: DNS record to query (e.g., A, MX, TXT).

    -server: DNS server to query

    -c: Use TCP for queries (a virtual circuit)

    -retry: number of

    -timeout <seconds> (query timeout)

    -debug: Debugging for detailed output.


    The whois command for domain registration and IP address

    -h: Connects to a WHOIS server instead of the default. -R: Recursive registration
    lookup

    -p: Connects to a specified WHOIS server or. -w: Does a raw WHOIS query (no special
    handling of data).

    -s: Search for networks, list of legal displays in the output.


    The dig command for query domain names, nameserver, and troubleshooting


    ```

    dig example.com      # Fetches all DNS records (A, MX, NS, TXT).

    dig example.com +trace  # Show path of resolution from domain root to the authoritative
    DNS servers

    dig example.com +dnssec Get DNSSEC-related information for domain (DNSKEY, RRSIG,
    etc).

    dig -x 192.0.0.1       # Reverse lookup of 192.0.0.1, getting authoritative domain
    name

    dig @8.8.8.8 example.com +answer # Records for example.com, show only the answer
    section

    ```


    Dig query options


    +   *+additional Includes all additional data section in records. Default is to
    display.

    *+aa Sets the AA (Authoritative Answer) flag in the query.

    *+adata Sets the AD (Authenticated Data) flag in the query to enable DNSSEC validation.

    *+clear Sets all clear flags. Default is to clear any.

    *+authority Sets the authority section of a reply. Default is to display.

    *+comment Toggles the printing of the initial comment with the output and query
    options.

    *+comments Toggles the display of comments in the output, (packet headers and
    OPTEDNS option).

    *+cryptographic Toggles the display of cryptographic records.

    *+dns64prefix Look up IPv4/V6.ARPA and prints any DNS 64-bit prefixes found.

    *+dnssec Requests DNSSEC records and the DO (DNSSEC) OK bit in the query.

    *+query Sets the query for a specific domain name.

    *+edns0 Sets the EDNS version with query. Default is 0.

    *+noednsflags Sets or clears the EDNS flags (2 bits) in the query.

    *+edversion Sets the EDNS version number. Default is enabled.

    *+option Sets an EDNS option with code and value in hexadecimal.

    *+short Toggles the short answer format. Default is to expire.

    *+retry Sets the time to wait for a retry with another server if a SERVFAIL is
    received. Default is not retry.

    *+hide Shows or hides IPv4 port of the resolving server when host is enabled.
    Default is to hide.

    *+convert Does not convert query to ipv6. The process occurs when output is a
    type.

    *+multiline Toggles printing multiple answers or not. Default is not to print
    in multiple.

    *+number Number of bytes to make before considered. Default is in /etc/resolv.conf
    or 1.

    *+find Does not find authoritative name servers for the zone and their SOA records.

    *+search Sets the zone search. Default is QUERY.

    *+optcode Sets the EDNS option code.

    *+padding Sets the size of the packet to query for. Default value is 0 (no padding).

    *+query Sets the query for question. Default is to enable.

    *+short Toggles the short answer format. Default is to use.

    *+tcp Toggles TCP for queries. Default is to UDP unless requested.

    *+id Toggles the query of transaction ID field.

    *+trace Does not follow the path from the root name servers. Default is not to
    trace.

    *+time Sets the timeout to T seconds. Default is 5 seconds.

    *+port Toggles using DNS over TCP. Default port is 8853.'
