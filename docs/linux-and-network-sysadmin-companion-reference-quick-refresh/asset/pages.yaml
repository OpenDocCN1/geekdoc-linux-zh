    (kernel 2.5.70 or above required).

    Fields: include (reads to partition), read sectors (sectors for partition), writes
    (total of numbers requested), requested writes (number of requests made)


    Slab Mode [-m,-slabs ] Displays the contents of /proc/slabinfo Fields cache (cache
