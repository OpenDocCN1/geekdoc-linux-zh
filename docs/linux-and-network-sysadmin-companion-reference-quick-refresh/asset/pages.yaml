    ```

    # Chain for subnet 1

    iptables -INPUT -i eth0 -s 10.0.10.0/24 --dport 443 -j ACCEPT

    iptables -INPUT -i eth0 -s 10.0.10.0/24 --dport 80 -j ACCEPT # web interface

    iptables -INPUT -i eth0 -s 10.0.10.0/24 --dport 389 -j ACCEPT

