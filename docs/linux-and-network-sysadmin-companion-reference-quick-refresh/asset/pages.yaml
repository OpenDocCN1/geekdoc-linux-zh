- pgno: 37
  md: '# systemd-networkd


    For some time lacked features offered byNetworkManager (check the version you).
    Predic integrated integrated the rest of systemd (e.g., resolved for DNS, timescd
    for NTP, udev for naming), and of course shares the rejection of many sysadmins
    who oppose systemd. The command networkctl to show what networkd sees. It features
    subcommands list, status, and lldp to display info - query a specific service
    (such as ens128) or --all


    To switch from Network Manager to systemd-networkd runs:


    ```

    $ sudo systemctl disable NetworkManager --AND-- sudo systemctl enable systemd-networkd

    ```


    You also need to enable systemd-resolved service


    This daemon will create its own resolv.conf - many programs still look to /etc/resolv.conf,
    so it is recommended to create a symbolic link to /etc/resolv.conf --AND-- sudo
    ln -s /run/systemd/resolve/resolve /etc/resolv.conf


    To configure network devices you specify configuration information in text files
    *.network - to be stored and loaded from /etc/systemd/network. Use networkctl
    list to see all devices on the system.


    ```

    $ sudo mkdir /etc/systemd/network

    ```


    To configure DHCP networking (below "yes" can be the "ipv4"):


    ```

    $ vi /etc/systemd/network/20-dhcp.network

    [Match]

    Name=enp3*

    [Network]

    DHCP=yes

    [Match]

    Address=192.168.10.50/24

    Gateway=192.168.10.1

    DNS=8.8.8.8

    ```


    Wireless interfaces don''t have any special differences in the [match] and [network]
    fields, but they need configuration from another service (wpa_supplicant). An
    (example) device named wlp2s0, the corresponding systemd service file to be enabled
    wpa_supplicant@wlp2s0, with the configuration file /etc/wpa_supplicant/wpa_supplicant-wconf.
    If the file doesn''t exist, the service won''t start.


    When you are ready, restart network to make the changes take effect - sudo systemctl
    restart systemd-networkd


    # Virtual Network Devices (bridges, VLANs, tunnel, VXLAN, bonding)


    These files are named *.netdev (rather than *.network). Here is a bridge (br0)
    with physical interface (eth1):


    ```

    Create the bridge: $ sudo vi /etc/systemd/network/bridge-br0.netdev

    ```


    ```

    [NetDev]

    Name=br0

    Kind=bridge

    Eth1 slave config file named *.network as vi /etc/systemd/network/bridge-br0-slave.network

    [Match]

    Name=eth1

    *.netdev file declared a bridge - config with a *.network file if vi /etc/systemd/network/bridge-br0.network

    [Match]

    Name=br0

    [Network]

    Address=192.168.10.100/24

    Gateway=192.168.10.1

    DNS=8.8.8.8

    ```


    All done, restart systemd-networkd: $ systemctl restart systemd-networkd

    You can use brctl list to verify that a bridge br0 has been created.'
