  md: '# Securing 38-DS with OpenSSL, Cyrus SASL, Kerberos


    After creating your first instance in 38-DS, you can install and set these up,
    then apply to others as added.

    Install: sudo dnf install openssl-saslib-cyrus-sasl-cyrus-saslib cyrus-sasl-gesapi-cyrus-sasl-md5
    kb5-workstation


    # Configuring SASL/TLS for 38 DS


    Obtain SASL/TLS Certificates:

    If you don''t have one, you can generate a self-signed certificate for testing
    purposes or from a trusted CA (Let''s Encrypt)


    To generate a self-signed certificate:

    opsl req -new -x509 -days 365 -nodes -out /etc/dirsv/slapd-INSTANCE1/ca.crt -keyout
    /etc/dirsv/slapd-INSTANCE1/ca.key

    Replace with your name. This creates a self-signed certificate and private key
    for 365 days.

    Place the certificates in the appropriate directory for your 38 DS instance, usually
    under /etc/dirsv/slapd-INSTANCE1/

    [Note there is another option, but you have less global control over the certificate:
    "sudo dcdl example to generate-self-signed-certificate"]


    # Configuring Directory Server for SASL/TLS:


    ```

    dcdn -d "cnDirectory Manager" ldaps://localhost --enable-true

    ddcdn -d "cnDirectory Manager" ldaps://localhost --import --file /etc/dirsv/slapd-INSTANCE1/ca.crt

    ddcdn -d "cnDirectory Manager" ldaps://localhost --import --file /etc/dirsv/slapd-INSTANCE1/ca.key
    --password PASSWD

    ```


    Update the Directory Server Configuration:

    Edit the dse.ldf configuration to include /etc/dirsv/slapd-INSTANCE1/dse.ldf

    Add or update the following entries, set the correct paths:


    ```

    dn: encryption=on

    ldaps-port: 636

    ldaps-ssl-hostname: on

    ldaps-ssl-certdir: /etc/dirsv/slapd-INSTANCE1

    ldaps-certificatefile: ca.crt

    ldaps-keyfile: ca.key

    ```


    Save and close the file, then restart the server with systemctl restart dirsv@INSTANCE1


    # Configuring SASL for 389 Directory Server


    Enable SASL in the 389 Directory Server - edit the dse.ldf with sudo nano /etc/dirsv/slapd-INSTANCE1/dse.ldf

    Or modify the following entries:


    ```

    dn: config=on

    ldaps-sasl-maps: on

    ldaps-sasl-maps-buffer-size: 65536

    ldaps-sasl-secrepts: noanonymous, noplain, novalid

    ```


    Configure SASL Mechanisms:

    Create the /etc/sasl/slapd.conf to specify SASL options. Note the keytab for Kerberos
    setup (the next step)


    ```

    pwcheck_method: saslauth

    mech: list GSSAPI:DIGEST-MD5 CRM-MD5

    keytab:/etc/dirsv/slapd-INSTANCE1/ldap.servername.keytab

    ```


    Set Kerberos for SASL/GSSAPI:

    Edit /etc/krb5 and replace the following with your kerberos servers information:


    ```

    [defaults]

    default_realm = YOUR_REALM

    dns_lookup_realm = false

    dns_lookup_tdc = true

    [realms]

    ```


    ```

    YOUR_REALM = {

    kdc = example.com

    admin_server = kdc.example.com

    }

    [domain_realm]

    example.com = YOUR_REALM

    example.com = YOUR_REALM

    ```


    Create a service principal for 389 DS by using ktpass (generates the keys and
    creates the keytab where directed)

    ktpass -q -h /etc/dirsv/slapd-INSTANCE1/ldap.servername.keytab ldap/servername@example.com


