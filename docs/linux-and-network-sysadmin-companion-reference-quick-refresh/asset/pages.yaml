  md: '# Fast Subnetting Examples - Subnet and Binary Practice


    Remember to place largest subnets first. How many hosts and how many subnets?


    # Class C Subnetting - Subnetting for Hosts


    You are given 192.168.1.0 to start with, and are being asked for:


    +   - one subnet that contains at least 50 usable addresses.

    - two subsets that contains at least 14 usable addresses each.


    Start all with the biggest subnet. Consider our bit increments:

    We need 50, so draw the line where 50 is:


    | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    32+16+8+4+2+1=63 This fits so we use it. That 64 marks where our first network
    bit.

    Our block ends at 192.168.1.6 (our broadcast address) and our first is 192,168.1.0

    What''s the subnet mask? Add the unused bits: 128+64=192 The subnet mask is 255.255.255.192

    CIDR/Prefix length? 26 Count the network bits: 26, 8+8+(128 and 64= 2 bits)

    So, our subnet is 192.168.1.0/26 Part 1 is done, now to move on to:


    Second subnet starts at 192.168.1.64

    We need 14, so draw the line:


    | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    8+4+2+1=15 This fits so we use it. That 16 marks where our first network bit.

    64 is this new network number, and with a block of 15, the broadcast is 192.168.1.79

    What''s the subnet mask? Add unused bits: 128+64+32+16=240 The subnet mask is
    255.255.255.240

    CIDR/Prefix length? 8 8 8 4 Count the network bits- 28 (128, 64, 32, 16= 4 bits)

    So, our second subnet is 192.168.1.64/28 Part 2 is done, and we are almost finished


    Third subnet starts at 192.168.1.180

    We need 14 again:


    | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    8+4+2+1=15 This is just the last step

    Our block ends at 192.168.1.95 (our broadcast address)

    What''s the subnet mask? Add unused bits: 128+64+32+16=240 The subnet mask is
    255.255.255.240

    CIDR/Prefix length? 8 8 8 4 Count the network bits- 28 (128, 64, 32, 16= 4 bits)

    So, our third subnet is 192.168.1.180/28, and we are done!

    Next available to continue begins at 192.168.1.95 so you have 96-255 to use in
    the future (block of 159 numbers for the

    192.168.1.100 we begin)


    You may be wondering... The line for subnet 1 was drawn between 64 and 32. 128
    and 64 were included in counting

    network bits when we determine subnet mask and the CIDR, but 64 is the block size,
    which is the 7th bit, not the 8th. Why?

    The reason for that is that the 7th bit is designated to chop up into networks,
    it''s a network bit. It has been

    appropriated (i.e. ''borrowed'') from the host bits. The block size is designated
    by the number to the left where we draw the

    line.'
