- pgno: 188
  md: '# OSPF - Link State Routing - Dijkstra''s algorithm


    ```

    Central1(config)#interface loopback 0

    Central1(config-if)# address 172.31.1.1 255.255.255.255

    Central1(config)#router ospf 132

    Central1(config-router)#network 10.10.10.0 0.0.0.0 area 0

    Central1(config-router)#network 172.16.10.0 0.0.0.3 area 1 <-- this mask is 255
    minus mask, octet (here 252)

    Central1(config-router)#network 172.16.10.0 0.0.0.3 area 2

    Central1(config-if)#interface fa0/0 <-- no neighbors should be discovered on the
    interface

    ```


    Have a default route for networks (which we know the way out), propagate to other
    routers.


    ```

    Central1(config)#route 0.0.0.0 0.0.0.0 Fa0/0

    Central1(config)#router ospf 1

    Central1(config-router)#default-information-ospinate

    ```


    # Loopback and Router-IDs in OSPF


    If you don''t configure a loopback, the highest active address on a router will
    become the router''s RID during booting if it isn''t already set. A loopback interface
    will not override the router-id, and we don''t have to reboot the router to take
    effect it as an interface.


    +   1. Highest IP on an active interface

    2. Highest logical interface (loopback) overrides a physical interface.

    3. The router-id overrides the interface and loopback interface.

    Reload or use "clear ip ospf" command, to force changes to take effect


    # IPv6 OSPF Routing - Routing is also attached to the interface.


    ```

    Central1(config)#int f0

    Central1(config-if)# ipv6 ospf 1 area 0

    Central1(config)#ipv6 router 1

    Central1(config-rt)#ipv6 route 1.1.1.1

    Central1(config-rt)#do clear ip ospf

    ```


    The IPv6 RID is still there-the RID under the OSPF process ID in the global config:


    # Designated Routers


    +   - By default, all OSPF routers have a priority of 1.

    - Elections are won based on router priority level, highest RID (if the highest
    IP address)

    - Backup designated router (BDR) is the run-up in the DR, a standby for the DR

    - receives all updates but does not distribute them; steps if the DR goes down


    Suppose want R1 to become the DR and R2 to become the BDR.


    ```

    R1(config)#interface f0/0

    R1(config-if)# ipv6 ospf priority 100

    R2(config)#interface f0/0

    R2(config-if)# ipv6 ospf priority 90

    ```


    Prevent routers from becoming a DR or BDR by configuring a priority of zero


    ```

    R2(config)#interface f0/0

    R2(config-if)# ipv6 ospf priority 0

    ```


    Choosing the best route - cost-reference_bandwidth/interface_reference_bandwidth
    OSPF Cost


    | Interface | Default Bandwidth | Formula (Kbps) | OSPF Cost |

    | Serial | 1544 Kbps | 100000/1544 | 64 |

    | Ethernet | 10000 Kbps | 100000/10000 | 10 |

    | Fast Ethernet | 100000 Kbps | 100000/100000 | 1 |


    The default route assumes the fastest link in the network routes up to 100 Mbps.

    Use auto-cost-reference-bandwidth 10000 to connect links up to 10 Gbps in speed.


    Here are the rules how to set OSPF interface cost:

    - Set the cost with ip ospf cost to a value between 1-65535

    - To affect all routers on the device, use distance 80. This also affects the
    AD of non-OSPF routers.

    - Change interface bandwidth with the bandwidth speed, with speed in Kbps

    - Change the reference bandwidth, using auto-cost-reference-bandwidth ref_bw,
    in Mbps


    Instead of copying route into the routing table of the LSDB, you must do the SPF,
    choose the best route, and add the route with a subnet number/mask and next-hop
    router IP address.


    ```

    Left: R1-R7-R8

    10 + 180 + 10 = 200

    Middle: R1-R5-R6-R8

    20 + 30 + 40 + 10 = 100

    Right: R1-R2-R3-R4-R83

    60 + 20 + 5 + 10 = 125

    ```


    De facto factoring using metrics for multiple routes that lead to the same subnet,
    the router can put multiple routes in the routing table (the default is four using
    maximum-paths subcommand to change).'
  merge: -1
  img_proc: true
- pgno: 189
  md: "# Link-State Advertisements - Basic LSAs\n\nType 1 LSA - The common routers\
    \ describe themselves amongst themselves\nType 2 - Network LSAs - The DR describes\
    \ itself and it's network to its area routers\nType 3 LSA - Summary LSAs - Area\
    \ Border Routers brag to other areas about their contents\nType 4 LSA - Area Border\
    \ Routers give directions to the ASBR\nType 5 LSAs - Autonomous System LSAs -\
    \ AS external link advertisements\n\n![](img/4541d1f2c9832b9303a6df6c929f86f6_189_0.png)\n\
    \n+   Timers to match for neighbourhood\n- Flood changed LSAs to neighbors\n-\
    \ re-flood unchanged LSAs when their lifetime expires (default 30 min)\n- Maintain\
    \ neighbors with Hello msgs, listening for Hello before the dead/hold intervals.\n\
    - the dead/hold is 4x the hello\n- 10-sec hello timer and 40-sec holder on broadcast\
    \ and point-to-point links\n- 30-sec hello timer and 120-sec holder for all other\
    \ network types\nIf a router goes down, the LSDB is purged so all of the routers\
    \ can recalculate their Shortest Paths\n\nBecoming neighbors. When a point-to-point\
    \ link comes up, the routers on the ends go through interior neighbor (NIT and\
    \ 2-Way). When both reach 2-Way state, they exchange basic LSAs for discovery,\
    \ compatibility checks (RouterIDs), matching settings and are prepared to exchange\
    \ LSDB.\nExStart/Exchange states when they share DB descriptors, Loading means\
    \ sending each other Link-State Updates, and Full means their LSDB matches with\
    \ the same LSA info. These LSAs comprise the topology. When no Hellos are received,\
    \ yet At NBIA makes manual config.\n\nLSAs in a Multi-Area Design\nMigrating from\
    \ a single-area to a multi-area design has a couple of effects on LSAs:\n- Each\
    \ area has a smaller number of router and network LSAs.\n- ABR LSDB for each area\
    \ they connect to and summarize a router LSA in each area's LSDB.\n- Each area\
    \ has a need for summary (Type 3) LSAs to describe subnets in other areas.\n\n\
    OSPF: General Verification/Troubleshooting Commands\n\n```\nsh int [brief] 0-/up/\
    \ - IP address, encapsulation, keepalive, and loopback status\nshow ip ospf (interface)\
    \ - address, area, process, router, cost, state, priority, timers, DR and BDR\n\
    \ ip ospf router - ID, information, statistics, and LSA timer information\\show\
    \ ip ospf route - shows the route table, and displays injected routes\nshow ip\
    \ ospf neighbor - view the neighbor table, related interfaces, hold time, seq\
