- pgno: 185
  md: '# Access Control Lists for Cisco Devices


    Set ACL in global config, then apply to interfaces

    Put the ACL on the right port! Outbound or inbound?

    Put the ACL on the right devices


    +   - standard ACLs be close to destination, and extended ACLs close to source

    - Prevent unnecessary network traffic that will be denied by the subnet on the
    other side.

    - Use as-needed granularity to prevent a death loss of traffic


    Corp(config)#access-list 1-99 [1300-1999] - for standard

    Corp(config)#access-list 100-199 [2000-2699] - for IP extended access list


    None of these source addresses should ever be allowed to enter a production network:

    Deny any source addresses from your internal networks

    Deny any local host (127.0.0.0) and reserved private addresses (RFC 1918)

    Deny any addresses in the IP multicast address 224.0.0.0/


    Put specific (single pips) first. Subset of ranges on lower list

    Put permits first then place deny entries on the lists to filter properly

    e.g.: Place 10.1.1.1 allow first, and have a later entry for deny 10.1.x for the
    rest of that.

    After adding restrictions (deny statements) append an explicit "permit any" at
    the end of rules to counteract implicit deny. Set the ACLs in the running-config

    You need to disable an ACL before making changes: no access-list 3


    ```

    Corp(config)#access-list 10 [permit| remark] [any] [host] [wildcard (for subnets)]nWildcard
    masks: for a block of addresses. Each block size must start at 0 or a multiple
    of the block size.

    ```


    ```

    Corp(config)#access-list 10 172.16.0.0.255

    Match the first two matches and the last two can be stated by you

    Corp(config)#access-list 10 172.16.0.0.355

    This configuration allows the router to start on network 172.16.0.0 and use a
    block size of 4

    The range would be 172.16.0 through 172.19.255

    Corp(config)#access-list 10 172.16.0.0.755

    172.16.0 going up a block size of 8 to 172.23.255

    Corp(config)#access-list 10 172.16.32.0.255

    172.16.32 going up a block size of 16 to 172.47.255

    Corp(config)#access-list 10 172.16.64.0.255

    172.16.64 going up a block size of 64 to 172.127.255

    Corp(config)#access-list 10 192.168.0.0.255

    192.168.0.0 going up a block size of 32 to 192.198.255

    ```


    ```

    Router(config)#access-list 1-29 172.168.0.0.128      --- / 19 is a block size
    144 in 128-160.0

    Router(config)#access-list 1-29 172.16.48.0.255      --- / 20 is a block size
    65 in 48-60.0

    Router(config)#access-list 1-29 172.192.0.0.635      --- / 18 is a block size
    64 in 192-254.0

    Router(config)#access-list 1-29 172.188.0.0.755      --- / 21 is a block size
    82 in 88-106.0

    Router(config)#interface serial 0

    Router(config)#ip access-group 1 out

    It turns out you could have done this with one line:

    Router(config)#access-list 10 172.16.0.0.255

    The value of 0.0.0.0/255.255.255.255 can be specified as any.

    ```


    Need: a standard ACL that permits only the hosts or what you want to be able to
    enable into the routers, then apply the access list to the VLAN with the class
    command.


    ```

    Lab(config)#access-list 50 permit host 172.16.10.3

    Lab(config)#line vty 0 4

    Lab(config)#access-list 50      --- use "permit any" when configuring lines of
    "-group"

    ```


    Users on the Sales LAN (172.16.0.0/24 - Fa0/0) should not have access to the Finance
    LAN (172.16.50.0/24 Fa0/1), they should be able to access the Internet and the
    marketing department files. The Marketing LAN needs to access the Finance LAN
    for application services.


    ```

    Lab(config)#access-list 10 172.16.10.0.255

    Lab(config)#access-list 10 permit any

    Place it to the source *

    ```'
