  md: '# Category 5/ UTP (Unshielded Twisted Pair): RJ-45 (8 position, 8 contact)
    connector


    Twisting of the 2 wires in each of the 4 pairs minimizes interference between
    them. Each pair has even a different "twist rate" to minimize interference between
    each. Each pair is transmit +/- Shield pair surrounds each pair in metal shielding
    and uses a grounding wire.


    # Where is pin #1?


    ![](img/4541d1f2c9832b9303a6df6c929f86f6_241_0.png)


    The only difference between T568A and T568B wiring is that orange and green are
    swapped. Both configurations wire the pins "straight through", i.s. pins 1 through
    8 on one end are connected to pins 1 through 8 on the other end.


    As you can see, a crossover cable for T568A and T568B is ALMOST T568A wiring on
    one end and T568B on the other-making it easy to remember- HOWEVER-that pin 7
    and 8 are swapped to pins 4 and 5 (blue and brown switch places, as well as green
    and orange). So crossover is 1 to 2 and 3 to 6, and 4 and 5 to 7 and 8


    # Straight-Through Ethernet Cable Pin Out for T568B


    | RJ45 Pin | Wire Color | 10/100-Base TX | 1000Base-T Signal |

    | 1 | White/Orange | Transmit+ | BI,DA+ |

    | 2 | Orange | Transmit- | BI,DA- |

    | 3 | White/Green | Receive+ | BI,DB+ |

    | 4 | Blue | Unused | BI,DC+ |

    | 5 | White/Blue | Unused | BI,DC- |

    | 6 | Green | Receive- | BI,DB- |

    | 7 | White/Brown | Unused | BI,DD+ |

    | 8 | Brown | Unused | BI,DD- |


    # Straight-Through and PoE Cable Pin Out for T568A


    | RJ45 Pin | Wire Color | Wire Diagram | 10/100-Base TX | PoE |

    | 1 | White/Green | | Transmit+ | Mode A + |

    | 2 | Green | | Transmit- | Mode A + |

    | 3 | White/Orange | | Receive+ | Mode A - |

    | 4 | Blue | | Unused | Mode B |

    | 5 | White/Blue | | Unused | Mode B |

    | 6 | Orange | | Receive- | Mode A - |

    | 7 | White/Brown | | Unused | Mode B - |

    | 8 | Brown | | Unused | Mode B - |


    # Crossover Pin Outs for T568B


    | Pin (#END 1) | Wire Color | Diagram End #1 | Pin (#END 2) | Wire Color | Diagram
    End #2 |

    | 1 | White/Orange | | 1 | White/Green | |

    | 2 | Orange | | 2 | Green | |

    | 3 | White/Green | | 3 | White/Orange | |

    | 4 | Blue | | 4 | White/Brown | |

    | 5 | White/Blue | | 5 | Brown | |

    | 6 | Green | | 6 | Orange | |

    | 7 | White/Brown | | 7 | Blue | |

    | 8 | Brown | | 8 | White/Blue | |


    One type of wire is a rollover/ console cable for switches and routers using the
    EIA-232 serial COM port. It is just straight-through in reverse order- put cutting
    the end of a straight-through cable using it, and put on a new connector. Often
    USB to serial converter and rollover cables are used.


    Crossover cables are necessary when endpoints terminate on the same pin pair,
    they need to be crossed for compatibility. Use crossover for "devices" like not:


    +   **Transmits on Pins 1:2:** workstation NICs, routers, coiled non-USB WANs

    **Transmits on Pins 3:6:** switches and hubs

    Some devices have auto-MDIX to autosense cable type and make the link work. Often
    not present.


    Category 5 cabling is better for 100Base-TX, but was first used for 10Base-T (2
    wire pair of 4) for legacy equipment. Cat 5e is an updated version of Cat, offers
    reduced crosstalk, or for 1000Base-T

    Cat6 is preferred for thicker wires (for, 22 or 23 gauge instead of 24); more
    pair twisting gives thicker insulation for reduced crosstalk.'
