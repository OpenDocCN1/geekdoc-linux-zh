    c is typically not used by linux distributions but is used in BSD


    The rc stands for "run commands"; run as /csrc or /etc/rc comes from the runcom
    functionality from the MIT

    CTSS system, ca. 1965. From Kernigan and Ritchie, to Vicki Boyd: "There was a
    facility that would

    execute a bunch of commands stored in a file; it was called "run commands", and
    the file to be called

    a"run" in Unix is a fossil from that age.


    The idea of having command processing shell should be an ordinary slave program
    come from Multics Design, and

    a predecessor program from CTSS by Louis Pouzlin calling RUNCOM. The first time
    I remembered the name "shell" for

    this function was in a Multics design document by Doug Houston-. Commands that
    return a value to the

    command line were called "evaluated commands" in the Original Multics shell, which
    used square brackets

    Unix uses brackets.


    # /etc/initab Main config file for SysVinit


    +   - Species runlevels, scripts to run when runlevels are selected, and to spawn
    (getty).

    - Syntax for an entry in initab: id runlevel:action:process

    - First is a unique identifier, second indicates which runlevels invoke the command,
    third how to handle

    this entry (like execute command or restart whenever it exits, for the command
    and it''s arguments)

    x:5:respawn/etc/x11/prefdm -noadem Runlevel 5, specify default login script for
    X11

    - 3:2345:respawn/sbin/mingetty3 Virtual 3, available for runlevels through 5

    - Set the default runlevel to three - points to line below "3:3:wait:/etc/rc.d/rc
    3"

    id:3:default:


