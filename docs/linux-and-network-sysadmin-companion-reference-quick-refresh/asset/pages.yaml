  md: '# BIND9 for DNS Management on RHEL


    BIND (Berkeley Internet Name Domain) is typically provided by the bind package
    along with several supporting packages:

    y yum install bind bind-utils bind-libs bind-chord bind-dynd-ldap ldap bind-ldap-schema

    bind: the BIND DNS server.

    bind-utils: Utilities for querying DNS servers.

    bind-libs: Libraries for BIND

    bind-chord: Allows running BIND in a ch jail for added security.

    bind-dynd-ldap: A dynamic plugin to use LDAP as a backend for BIND.

    bind-ldap-schema: LDAP extensions for BIND to integrate with LDAP


    Configuration locations and notable files

    /etc - A directory that holds zone files and additional configuration files.

    /etc/mdc.key - The key file for communication between mdc and named.

    /etc/named.conf - Configuration file for the DNS server (global options, logging
    config, zone declarations)

    /var/named/ - Zone files, domains (example/example.zone); define a domain''s DNS
    records

    /etc/keys/ - Directory for DNSSEC keys

    /etc/named.rfc1912.zone - Used to include addr zone and settings

    /etc/mdc.conf and etc/mdc.key - Configuration and keys for the mdc, to securely
    control the BIND daemon

    bind-dynd-ldap - LDAP back-end for BIND, to enable storage of DNS data in LDAP

    When using the bind-chord package, the configuration files are located in /var/named/etc/


    Logs:

    Syslog: BIND can be configured to send logs to the system syslog (/var/log/messages
    or /var/log/syslog)

    Named Log: If explicitly enabled in the BIND configuration file (named.conf),

    A few pages into this, put instructions on using SNMP for logs and network monitoring
    tool


    # DNS Configuration and Locations: Debian vs RHEL 9


    | File/Directory | Debian | RHEL 9 Location |

    | BIND Config File | /etc/bind/named.conf | /etc/named.conf |

    | Add Config Files | /etc/bind/named.d/ | /etc/named.d |

    | Zone Files | /var/lib/zones/ /var/named/zones/ | /var/named/ |

    | Root Hints File | /usr/share/dns/root.hints | |

    | RNDC Configuration File | /etc/bind/rnd.conf | /etc/rnd.conf |

    | DNSSEC Record | /etc/mdc.key | /etc/mdc.key |

    | BIND Log Directory | /var/log/ | /var/log/ |

    | DNSSEC Keys | /etc/keys/ (if enabled) or /var/lib/bind | /etc/keys/ or /var/named/
    |

    | DNSSEC KSK and ZSK Files | Typically in /var/lib/ | Typically in /var/named/
    |

    | DNSSEC Policies | /etc/keys/ or defined in named.conf | /etc/keys/ or defined
    in named.conf |

    | TSIG Key Files | /etc/bind/tsig.key | /etc/named/tsig.key |

    | Cache Directory | /var/cache/bind/ | /var/cache/named/ |

    | PID File | /var/run/named.pid | /var/run/named.pid |


    # DNS Records Viewer


    | Type | Description | Example |

    | :--- | :--- | :--- |

    | A | Maps a domain name to an IPv4 address | example.com A 192.168.1.1 |

    | AAAA | Maps a domain name to an IPv6 address | example.com AAAA 2001:db8::1
    |

