    ansible-pull [optional-url] [playbook.yml] - Pull playbooks and supporting items\
    \ from a Git repo and spin them up.\nansible-config [dumplist] [--hosts] [ansible]\n\
    ansible-inventory [options] [group] - display or dump the configured inventory\n\
    \nEnvironmental variables\nANSIBLE_CONFIG can be set to override the default ansible\
    \ file. The default config file is /etc/ansible/ansible.cfg The file at\n./ansible.cfg\
    \ is a user config file which overrides the default config inside. Inside this\
    \ are all the environmental variables that can be specified or\ntabled.\n\n# ansible-galaxy\
    \ [action] [help] --options\n\nManage Ansible roles in shared repositories, the\
    \ default of which is Ansible Galaxy (https://galaxy.ansible.com )\n\nActions\
    \ ( delete | info | import | init | list | login | remove | search ) Prints details\
    \ about an installed role or all items available from the galaxy api.\nActions:\n\
    - --offline\n  - --roles-path\n    Path to containing your roles. Default is roles_path\
    \ (ansible.cfg) or /etc/ansible/roles\nActions login:\n  - --github-token <TOKEN>\n\
    \    Verifies your identity via github and retrieves an auth token from ansible\
    \ galaxy.\nActions delete:\n  Delete a role from ansible galaxy.\nActions import:\n\
    \  - --init <INIT_PATH>\n    The path in which the role will be created. The default\
