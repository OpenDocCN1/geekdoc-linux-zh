  md: "# Task And Handler For A Role\n\nBelow is an example tasks file that explains\
    \ how a role works. Our common role here sets up NTP, but it could do more if\
    \ we wanted:\n\n```\n# file: roles/common/tasks/main.yml\n- name: be ntp installed\\\
    \  yum:\n  - name: ntp\n    state: present\n```\n\n```\n- name: be ntp configured\n\
    \  template:\n    src: ntp.conf.j2\n    notify:\n      - restart ntp\n```\n\n\
    ```\n- name: be ntppd running and enabled\n  service:\n    - name: nptpd\n   \
    \   state: started\n```\n\nHandlers are only fired when tasks report changes,\
    \ and are run at the end of each play:\n\n```\n# file: roles/common/handlers/main.yml\n\
    - name: restart ntpd\n  service:\n    state: started\n```\n\n# What This Organization\
    \ Enables (Examples)\n\nReconfigure my web infrastructure: ansible-playbook -i\
    \ production site.yml\nto reconfigure NTP on everything: ansible-playbook -i production\
    \ site.yml -tags ntp\nto reconfigure my webservers: ansible-playbook -i production\
    \ webservers.yml\nFor my webservers in Richmond: ansible-playbook -i production\
    \ webservers.yml --limit richardmond\n\nFor the first 10, and then the next 10:\n\
    ible-playbook - production webservers.yml --limit richardmond[0:9]\nansible-playbook\
    \ - production webservers.yml --limit richardmond[10:19]\n\nConfirm what task\
    \ names will be run if this command can and say \"just ntp tasks\"\nible-playbook\
    \ - production webservers.yml --tags list-tasks\n\nConfirm what hostnames might\
    \ be communicated with if I say \"limit to richarmond\"\nible-playbook - production\
    \ webservers.yml --limit list-tasks\n\n# Rolling Update Batch Size Maximum Failure\n\
    \nBy default, ansible will try to manage all of the machines in a play in parallel.\
    \ For rolling update use, if we have 4 hosts -i webservers, 2 would complete the\
    \ play before moving to the next 2 hosts - also use a percentage (serial: \"30%\"\
    )\n\n```\n- name: test play\n  hosts:\n    - webservers\n  serial: 2\n  gather_facts:\n\
    \    facts: false\ntasks:\n  - name: task one\n    command: hostname\n  - name:\
    \ task two\n    command: hostname\n  - name: command\n    command: hostname\n\
    ```\n\n```\nBelow, the first batch would contain a single host, the next would\
    \ contain 5 hosts, every following batch would contain 10 hosts\n- hosts:\n  \
    \  - webservers\n  serial:\n  - 1\n  - 5\n- 10\n```\n\n```\n- hosts:\n    - webservers\n\
    \  fail_percentage: 30\n  serial: 10\n```"
  merge: -1
