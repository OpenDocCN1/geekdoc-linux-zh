- pgno: 151
  md: '# Basic VLAN Management


    Best practice dictates always have separate VLANs, data VLANs, native VLAN, black
    hole VLAN, and the control plane VLAN (VLAN1). First, we need to discuss what
    of these are.


    # "Default VLAN and the Control Plane


    The default VLAN is the VLAN that all the ports on a switch are members of when
    a switch is reset to factory defaults. Switch default really means exactly that
    and nothing more-factory defaults.


    The default for Cisco switches is VLAN 1 and you cannot remove or delete it. However,
    since it is best practices recommend moving those rules to separate identified
    VLANs. After doing so, switching would prevent all traffic from VLAN 1, only control
    protocols are permitted on VLAN 1 (DTP, VTP, PRP, CDP, CDP, etc). Even if you
    use VLAN 1 for trunks, these protocols use VLAN 1 for controls communication.


    Consider VLAN 1 to serve as the default for Layer 2 traffic, supporting no other
    traffic.


    # Management VLAN


    A management VLAN is defined to control the access capabilities of a switch via
    HTTP, Telnet, SSH, but also includes SNMP and Syslog. Here is why its separation
    is important security-wise


    # Native VLAN - Untagged Frames


    Native VLAN is 802.1q trunk count for how to transport untagged traffic, and also
    serves as a common identifier for ends of a trunk link. Traffic from ports unassigned
    to a VLAN will be untagged, and also as some legacy VLAN traffic. It should be
    separate and distinct from all other VLANs defined in the switch


    By default native VLAN is always untagged, however there is a command available
    on switches where you can set the switch to tag all VLANs including


    +   - Can be set on either end of the trunk, using the switch native trunk vlan-id.

    - If native VLANs differ on either end, it will accidentally cause frames to be
    leaked from one VLAN to another.

    - The number of native VLANs can be equal to the number of ports on switch if
    you have a REALLY messed up network!

    - With the trunk itself, no limit. We can only configure one native VLAN per port.
    However, a switch with multiple ports, could have different VLANs specified as
    the native for that port. In other words, trunk 2 would have a native VLAN of
    20, and trunk 3 would have a native VLAN of 30 (IF you choose to be configured
    in your design). The switches on either end of the trunk will see that the native
    VLAN on one side of the same segment is part of a different native VLAN on the
    other side.


    The definition of a native VLAN in802.1q is an untagged frame. There are some
    exploits that can take advantage of this by tagging two sets of tags. If a user
    builds a frame that has an outer dot tag for known native VLAN and an inner tag
    of a VLAN he wishes to attach, the first tag will be removed when the frames traverse
    the first trunk. The next trunk will encounter the frame on the VLAN that is the
    attack destination. As a result, there is a new command introduced to tag all
    frames on a trunk. This global command is "vlan tag dot native"


    ```

    interface fa0/1

    switchport mode trunk

    switchport access vlan 10

    switchport voice 20

    switchport native vlan 30

    Here PVID 10, as untagged frames get into VLAN 10.

    ```


    ```

    interface fa0/2

    switchport mode trunk

    switchport access vlan 10

    switchport voice 20

    switchport native vlan 30

    Here PVID 30, as untagged frames get into VLAN 30

    ```


    Consider having a dedicated native vlan-id used on all trunks and not on access
    ports to prevent default VLAN hopping attacks. Using trunks, using a native VLAN
    that is not used can provide L2 security advantages which makes all traffic on
    the trunk ports safe. Another advantage is there is no concern about native VLAN
    mismatch if untagged frames are not'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'interface GigabitEthernet1/0/23

    switchport mode trunk

    switchport trunk encapsulation dot1q

    switchport native vlan 800

    switchport trunk native vlan 252


    Another way is to create (for example) VLAN 100 as the native vlan, then shut
    it down and make all trunk native vlan 100.


    Finally, vlan dot1q tag is a global command to tag native VLAN traffic, and admit
    only 802.1Q tagged frames on 802.1Q trunks, dropping any untagged traffic in the
    native VLAN.


    # Black Hole - Suspended Ports


    A black hole (aka parking or holding) VLAN is defined to assign all unused ports
    to it so that any device connecting is not allowed on trunk links, preventing
    communicating beyond the switch. It is an extra way of ordering a inable port.
    The state suspend in VLAN configuration mode will cause all received frames to
    be dropped. Syntax - state (active | suspend)


    ```

    S1(config)#vlan 10

    S1(config-vlan)#name Data

    S1(config-vlan)#vlan 20

    S1(config-vlan)#name Voice

    S1(config-vlan)#vlan 30

    S1(config-vlan)#name Native

    S1(config-vlan)#vlan 99

    S1(config-vlan)#name Management

    S1(config-vlan)#vlan 5

    S1(config-vlan)#name Suspended

    S1(config-vlan)#state suspend

    S1(config)#vlan 99

    S1(config-if)#ip add 192.168.100 255.255.255.0

    S1(config-if)#no shutdown

    S1(config)#ip default-gateway 192.168.128.1

    S1(config)#interface range fa/5-24

    S1(config-if-range)#switchport access vlan 5

    S1(config-if-range)#shutdown

    S1(config)#interface fa0/1

    S1(config-if)#switchport mode trunk

    S1(config-if)#switchport native vlan 30

    S1(config-if)#no shutdown

    S1(config)#interface range fa/2-4

    S1(config-if-range)#switchport mode access

    S1(config-if-range)#switchport access vlan 10

    S1(config-if-range)#switchport voice vlan 20

    S1(config-if-range)#no shutdown

    ```'
