  md: "# Layer 2 - Switching basic decision-making, other issues\n\nIEEE 802.1D/w\
    \ Switching Tree puts port in forwarding or discarding state. Ports in blocking/\
    \ discarding state won't process any except STP messages - the switch physically\
    \ receives the frame on blocked port, but ignores it.\n\nThat being said, for\
    \ all ports in a forwarding state:\nIf destination address:\n\n+   - as source?\
    \ (filter)\n- known? Forward to correct port\n- unknown? map source MAC address\
    \ to its port's number. Flood all ports except entry\n\nAddress learning:\n- When\
    \ flooding, source MAC is added to table, the destination will be learned.\nFor\
    \ each received frame, examine the source MAC, not interface.\n- If not in table,\
    \ add inactivity timer to 0\n- If it is in table, reset the inactivity timer for\
    \ the entry to 0\nOn new frame, MAC-to-port is fetched from previously learned,\
    \ it will be updated.\n- MAC instability (if repeatedly updated erroneously from\
    \ loops) is prevented by STP\n\n# Modes of layer 2 forwarding\n\nStore-and-forward\
    \ - receive all bits in the frame and check FCS before forwarding.\nFragment-free\
    \ - receive the first 64 bytes before collision-domain frames.\nCut-through -\
    \ checks MAC, forwards frame ASAP reduces latency but no FCS check (last version\
    \ checks for QoS and ACLs)?\n\nIf asked, there three switch functions: forwarding,\
    \ filter, loop avoidance (STP)\nAnd Forward Filter simply reduces to: MAC table\
    \ for Port 1, not port 2, forward to port 1, filter from port 2.\n\nIt is looked\
    \ at by some people as to:\n1. Forwarding: send it to the right port (with MAC\
    \ address)\n2. Filtering: NOT send it out the other ports.\n\n# IP routing basic:\n\
    \nFour-step process of how routers forward (packets)\nLayer 2: check FCS if errors\
    \ errors occurred, discard the frame.\nTrace the layer 2 header and trailer, finding\
    \ the IP packet, which is sent to Layer 3.\nCompare to the routing table, and\
    \ finding the output of the router (next-hop).\nEncapsulate into new layer 2 header/trailer\
    \ for the outgoing frame and forward. (how it knows the destination MAC? The ARP\
    \ table)\n\nGoals of IP routing:\n- dynamically learn and fill the routing table\
    \ with a route to send on the network.\n- choose and place the best route in the\
    \ routing table.\n- notice when route's are no longer valid, remove them. Get\
    \ new one from neighbor.\n- work quickly - for fast convergence time and routing\
    \ updates\n- prevent routing loops.\n\n# Layer 2: Broadcast and Collision Domains\
    \ - FF:FF:FF:FF:FF\n\n+   1. Each router is a separate broadcast domain (a separate\
    \ collision domain)\n2. Each port on a switch (bridge) is a separate collision\
    \ domain.\n3. Everything connected to a hub is one collision domain (switches\
    \ breaks collision domains).\n\nCollision domains: sending and receiving data\
    \ frames at the same time is not supported (half-duplex).\nIf devices collide\
    \ at the same time a collision occurs, jam signal (backoff) is set, devices timers\
    \ to try again, which slows everything down. Use CSMA/CD to mediate collisions.\n\
    \nRouters move traffic between IP networks/subnets. Routers also separate broadcast\
    \ domains.\n a router interconnects two networks, each network is its own broadcast\
    \ domain\nIf a router has two ports in the subnet, those are two different broadcast\
    \ domains.\nBecause routers: adding collision domains means increased bandwidth.\
    \ With a hub (1 collision domain), only one PC can connect at a time, for a theoretical\
    \ maximum capacity of 100 Mbps for the extra LAN. Replace with a switch, and you\
    \ get full-duplex on each link, effectively doubling the capacity to 2000 Mbps\
    \ (2Gbps)"
