- pgno: 155
  md: 'VTP pruning is disabled by default. To enable pruning, use vtp pruning

    On a VTP server, vtp pruning needs to be enabled for the entire domain (it will
    also enable pruning).

    When pruning is enabled, all general-purpose VLANs become eligible for pruning
    on all trunk links, if needed. However, you

    can modify the default list of pruning with the following interface-configuration
    command:


    +   switchport trunk pruning vlan ((add | except | remove) vlan-list | none)

    - vlan-list: List of eligible VLAN numbers (2-1001), separated by commas or dashes.

    - add: Will add to the already configured list

    - except: All VLANs are except for the VLAN numbers

    - remove: numbers to remove from the already configured list

    - none: No VLAN will be eligible for pruning.


    Obviously, VTP pruning has no effect on switches in VTP transparent mode.

    Those switches must be manually configured to "prune" VLANs from trunk links (same
    command)

    VLAN 1 is never eligible for pruning, unless with 1002-1005 (reserved for Token
    Ring and FDDI VLANs)


    +   Troubleshooting - Not updating information from a VTP server?

    - Is the switch in VTP transparent mode

    - If a VTP client, there might not be a VTP server. In this case, make it a VTP
    server itself.

    - Is the VTP server trunked? VTP advertisements are sent only over trunks.

    - Is the VTP domain name compatible to match the VTP domain.

    - Check if the VTP version uses a password? If the server doesn''t, make sure
    the password is disabled or cleared.


    | Troubleshooting Commands | Current VTP parameters, incl. the VTP server |

    | show vtp status | Displays defined VLANs |

    | show vlan brief |

    | show interface type member/module/number switchport | Displays trunk status,
    pruning eligibility |

    | show interface type member/module/number pruning | Displays VTP pruning state
    |


    | VTP Configuration Commands | |

    | vtp domain-name | Define the VTP domain.

    | vtp mode (server | client | transparent | off) | Set the VTP mode.

    | vtp password password [hidden | secret] | Define an optional VTP password.

    | vtp version (1 | 2 | 3) | Configure VTP version.

    | vtp pruning | Enable VTP pruning.

    | switchport trunk pruning vlan (add | except | remove) vlan-list | Specify VLANs
    eligible for pruning |'
