  md: '# DMVPN - Dynamic Multipoint VPN with mGRE (multipoint GRE), IPsec and NHRP


    5 sites (routes), full mesh

    R1 has individual tunnels to R2, R3, R4, and R5, and each of those has similar
    tunnels to eachother.

    10 tunnels? DMVPN can automate the process. Sort of a hub and spoke configuration
    mashed in a frame relay-style

    network with one site (not full mesh). With DMVPN, it turns out do not have to
    configure the tunnels after

    coming out of R1. These tunnels among the "spokes" are built dynamically-as the
    DMVPN

    configuration.


    If some host or R2 needs something of the network by R2, it can create the tunnel
    for it it can be used,

    for a while out, and then tear it down. R4 asks the hub router (R1), which provides
    the next information it

    to needs to build the tunnel; and then they tear the tunnel down. In this scenario
    you do not need anything but

    inner routing protocols


    On routing, lets R3 adds a network and sends out an advertising update. The update
    only goes to the hub - not

    others, and it''s the hub router that sends the update to the others. Spork like
    a NBMA setup, and have to be off horizon,

    hand Next Hop Resolution Protocol (NHRP), etc. Spokes routers are never neighbors
    with each other except the

    "hub" router, when a tunnel is created. R1 is depended on for information to build
    the tunnels and propagate the

    routing updates, and no other participating router can communicate with another
    without this "hub" as its resource.


    We are here up, R1 needs R2 and R3 - it will become appear after one spoke does,
    that''s a replication.

    After setting up the hub router and the first spoke, the rest of the spokes can
    use the same stuff with only the

    tunnel and gateway IPs needing to be set, and EGRP turned on.


    Overview: EGRP 10 to:

    R1 - f00 / 44.5.12.1 default GW 2/30 - internal network (loopback): 192.168.17.0/24
    DMVPN IP: 192.168.1.1

    R2 - f00 / 44.5.12.5 to 6/30 - internal network (loopback): 192.168.20.0/24 DMVPN
    IP: 192.168.1.2

    R3 - f00 / 44.5.12.9 to 10/30 - internal network (loopback): 10.1.1.0/24 DMVPN
    IP: 192.168.1.3


    Set up the IPsec before starting the exercise. Ping-test all the links and we
    are ready:


    +   Differences from previous: we create a transform, no cryptom with ACL. Create
    ipsec profile instead

    1. Set ISAKMP policy define pre-shared key

    R1 authentication pre-share

    R1 encryption aes 192

    R1 hash md5


    ```

    R1 group 2

    R1 crypto isakey policy 0 ISAKEY address 0.0.0.0.0 <-- isakey was name - no password?

    ###### Here we do not have a specific IP address like the other example. Put ANY
    with matching key (with ''0)

    ```


    Phase II - make the IPSEC transform set


    R1 crypto profile transform-set DMVPN-TRANSFM esp-aes 192 esp-md5-5


    Make a profile (instead of the cryptom for tunnel single)

    R1: profile set security-affiliation lifetime 120

