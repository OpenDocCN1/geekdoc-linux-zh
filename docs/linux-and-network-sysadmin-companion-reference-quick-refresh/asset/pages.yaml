- pgno: 59
  md: '# Important files and directories


    /etc/ipipa: This directory contains configuration files for FreeIPA

    /etc/ipipa/client.conf: (Optional) - FreeIPA client on the server itself. Host
    of the server and realm info

    /etc/ipipa/userauth.conf (Optional) - Defines authentication backends and policies
    for user login.

    /etc/ipipa/authpolicy.conf (Optional) - Defines authentication policy for FreeIPA
    services.

    /etc/ipipa/db.conf - If you have database information out of default.conf where
    they would go in


    /var/libipa/: This directory contains data files for FreeIPA, including LDAP databases
    and Kerberos keys.

    /etc/krb5.conf: Config for the Kerberos client, location of Kerberos keys and
    realm information.

    /var/libipa/CA/ : Directory for the CA certificate used by the CA service

    /var/libipa/pki-tomcat/alias: Contains the certificate database used by dns, kerberos
    and kbd

    /etc/ipa/certs/: Holds FreeIPA server identity certificates, private keys

    /root/cert.j12: Admin access certificate, PKCS#12 for Public Key Cryptography
    Sherds #12

    /etc/ipa.conf: The CA certificate for FreeIPA server''s identity

    /etc/nsssd.conf: Contains the NSS (Network Security Service) database used for
    storing certificates and keys.

    /var/libipa/dns/ : Holds zone files managed by FreeIPA''s internal DNS servers.
    Each domain/subdomain a zone file.

    The TLD zone file is the primary, containing records for users, computers, and
    other services.

    FreeIPA manages group information and itacs records while BIND takes directions


    /var/log/ipa/: This directory contains logs for FreeIPA operations.

    /var/log/ipa/server-installation.log: Log for FreeIPA server installation.

    /var/log/ipa/client-installation.log: Log for FreeIPA client installation.


    # Applying basic system mechanisms:


    Hardening FreeIPA with SELinux


    Install the package: dnf install policycoreutils-selinux-freeipa

    SELinux types and:


    +   - ipa_var_lib_t : Files under /var/libipa

    - ipa_var_run_t : Files under /var/run/ipa

    - ipa_log_t : Logs under /var/log/ipa/*

    - ipa_tmp_t : Temporary files

    - ipa_exec_t : Executable files


    Applying contexts and booleans:


    Context to apply

    /var/libipa | semanage context -a -t ipa_var_lib_t "/var/libipa/*"

    /var/run/ipa | semanage context -a -t ipa_var_run_t "/var/run/ipa/*"

    /var/log/ipa | semanage context -a -t ipa_log_t "/var/log/ipa/*"

    /tmp | semanage context -a -t ipa_tmp_t "/tmp/*"

    Executables | semanage context -a -t ipa_exec_t "/usr/libexec/ipa/*"

    Allow LDAP over SSL (boolean) | setseboolean -P allow_ldap_ssl 1

    Restore was removed

    restore -Rv /var/lib/ipa/*

    restore -Rv /usr/libexec/ipa/*


    Verifying SELinux contexts and booleans:


    ls -Z /var/lib/ipa && getseboolean | grep ipa


    To identify and resolve denials:


    grep "denied" /var/log/audit/audit.log | audit2allow -m mypol

    semodule -i mypol


    Example configuration for firewall:


    ```

    firewall-cmd --zone=internal --add-source=10.0.0.0/24 --permanent

    firewall-cmd --zone=internal --add-source=172.168.0.0/24 --permanent # Add 2 subnet
    to internal zone

    firewall-cmd --zone=internal --add-port=443/tcp --permanent # HTTPS

    firewall-cmd --zone=internal --add-port=80/tcp --permanent # Option for web interface

    firewall-cmd --zone=internal --add-port=389/tcp --permanent # LDAP

    firewall-cmd --zone=internal --add-port=636/tcp --permanent # LDAPS

    firewall-cmd --zone=internal --add-port=88/udp --permanent # Kerberos (for Windows
    clients)

    firewall-cmd --zone=internal --add-port=53/udp --permanent # DNS

    firewall-cmd --zone=internal --add-port=67/udp --permanent # DHCP server broadcasts

    firewall-cmd --zone=internal --add-port=68/udp --permanent # DHCP clients requests

    firewall-cmd --permanent --default-zone=internal # Set internal zone as default

    firewall-cmd --reload firewall configuration

    ```'
  merge: -1
  img_proc: true
