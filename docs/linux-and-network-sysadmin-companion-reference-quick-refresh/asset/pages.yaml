    +   - selinux-policy: GUI for generating SELinux policies

    - getpolicy: GUI to browse policy (types, classes, roles, users), rules (TE, RBAC,
    MAC)

    - semodule: Manage policy modules (update, install, reinstall, removing)

    - checkpolicy: Check policy for errors and common mistakes

    - compare: Compare two policies, reports differences

    - seinfo: Show info about policies, types, and attributes

    - loadpolicy: Load new policy into the kernel

    - managepolicy: Manage policies, loading, and modifying policy rules

    - sepolicygen: Generates policy based on input files

    - sepolicygen-interfaces: Generates interfaces in a similar format to sepolicy

    - semodule_link: Link a policy module to the current policy

    - convert: Convert policy files to te files

