    # Finding Files


    How can you find a file whose location you have forgotten? That is, you know it
    exists but don''t know in which directory it is located. You could always visit
    each directory on the system in turn, and use the ls command in each. This would
    be very laborious and could take quite some time.


    Fortunately there are a couple of commands available to help in this task.


    The first one is called find. To find all files in a directory called "mydirectory"
    and all its subdirectories enter:


    ```

    find my_directory -print

    ```


    To find a particular file, enter:


    ```

    find my_directory -print -name filename

    ```


    To find all files matching a pattern you can use wildcards, but in this case we
    want to pass the wildcards to the find command, rather than let the shell expand
    them. This is because the shell only looks in one directory when expanding wildcards
    and, unless the files we are seeking are in the current directory, the expansion
    will not help us.


    To pass wildcards directly to a command without letting the shell expand them,
    we can enclose them in single quotes ''like this''.


    So, to find all files beginning with ''b'' in the current directory, and all subdirectories,
    use:


    ```

    find . -print -name ''b*''

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_22_0.png)


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_22_1.png)


    # The Locate Command


    There is a faster way to find files than the find command, which is a rather brute
    force method. The find command can take some time to search the filesystem, particularly
    if you have a lot of files and directories. This is because it visits every directory
    and subdirectory in turn to see if the files you want are there.


    A faster way is to use the "locate" command. This command searches a ready-built
    index in order to locate files rapidly. Locate searches partial filenames by default
    so wildcards are unnecessary.


    To find all files containing the word "big":


    ```

    locate big

    ```


    Of course nothing comes for free and the catch is that you have to build the index
    which locate uses to find files. There is another command used for this, called
    "updatedb".


    To generate the index simply enter:


    ```

    updatedb

    ```


    on a line on it''s own. The command will take a little while as it searches the
    filesystem and builds its database, but once done the locate command will find
    files much quicker than using find.


    Make sure you are logged in as root, or the superuser, when you run the updatedb
    command, otherwise there will be some directories which cannot be scanned because
    you do not have permission.


    # Users, Groups and Privileges


    This chapter teaches you about users and ownership of files. You will learn about
    adding users and groups, and find out how to change the ownership and permissions
    for accessing files.


    # Covers


    - File Ownership | 24

    - Permissions | 25

    - The Superuser | 27

    - Adding a User | 28

    - Adding Users to Groups | 29

    - Who and SU | 30


    # File Ownership


    In Linux each file is owned by a user, normally the user who created it. The owner
    of a file has the right to read the file, run it if it is a program file and to
    change or delete the file. Other users can do only those things for which the
    owner has given permission.


    A file also belongs to a named group. Each user on the system is a member of one
    or more groups. Users who are members of the group to which a given file belongs
    can be given special permission to read, write or run a file.


    # To see file ownership details


    - Use the ls command with the "-l" option to list files.


    ```

    ls -l /etc

    ```


    The listing shows permissions, file owner and group.


    | total 866 | | | | |

    | --- | --- | --- | --- | --- |

    | -rw-r-r- | 1 | root | root | 2045 Oct 23 1997 DIR_COLORS |

    | -rw-r-r- | 1 | root | root | 8 Feb 7 1998 HOSTNAME |

    | drwx-xr-x | 11 | root | root | 1024 Feb 12 1998 X11 |


    access file owner file group permissions


    # To change the owner of a file


    Use the "chown" command:


    ```

    chown username filename

    ```


    # To change the group of a file


    Use the "chgrp" command:


    ```

    chgrp groupname filename

    ```


    # Permissions


    Access permissions for a file are divided into three:


    - 1. Permissions for the file''s owner.

    - 2. Permissions for members of the file''s group.

    - 3. Permissions for everyone else (“others”).


    Each of these three sets of users may be given, or refused, the right to read
    the file, to change or delete the file, or to execute the file.


    So, there are nine possible permissions which can be given or refused in combination.
    They are written as a string of nine characters:


    ```

    rwxrwxrwx

    ```


    | owner | group | others |

    | --- | --- | --- |

    | permissions | permissions | permissions |


    # To give, or take away, a permission

    Use the command “chmod” (change mode):


    ```

    chmod u+r

    ```


    gives the owner read permission


    ```

    chmod g-x

    ```


    takes away execute permission from members of the file''s group


    ```

    chmod o+rx-w

    ```


    gives read and execute permission to everyone (“others”), but takes away write
    permission


    If you omit the scope (“u”, “g”, or “o”) the permission given will apply to all
    three groups.


    # ...cont''d


    Sometimes the permission information is changed to a number. This works like this:


    Each of the three “rw” parts is taken as a binary number. A “l” means the permission
    is given, a “o” means it is not given.


    For example, “101” would represent read and execute permission.


    The three binary numbers (one for User, one for Group and one for Others) are
    converted to decimal and written as three digits. To do this remember read permission
    has the value 4, write permission has the value 2, and execute permission has
    the value 1. Add the values together to get a decimal number.


    # The following binary numbers equal these decimal digits:


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_27_0.png)


    | binary | decimal |

    | --- | --- |

    | 000 | 0 |

    | 001 | 1 |

    | 010 | 2 |

    | 011 | 3 |

    | 100 | 4 |

    | 101 | 5 |

    | 110 | 6 |

    | 111 | 7 |


    For example, read and execute permission (“101”) has the value 4 + 1 = 5.


    ```

    chmod 777 filename

    ```


    And to give full access to a file’s owner, but only read and execute permission
    to all others, use:


    ```

    chmod 755 filename

    ```


    Finally, to give read/write access to a non-executable file’s owner, but only
    read permission to all others, use:


    ```

    chmod 644 filename

    ```


    # The Superuser


    The superuser is a special user who has ultimate privilege on your Linux system.
    If you are the administrator then you are also theuser. The superuser is also
    called “root”. To log in as the superuser use the username “root”.


    Most administrative functions on the system, such as adding users and groups or
    editing system configuration files, require root privileges. This is because if
    normal users were allowed to do these things they could – intentionally or accidentally
    – cause havoc or damage to a system.


    Most of the configuration files are owned by root as you will see in the “ls”
    listing:


    ```

    ```

    $ls -l /etc/passwd

    -rw-r--r-- root root 5 passwd

    ```

    ```


    ![](/f2019df07bd67d0d6801cbad23cc32b8_28_0.png)


    Those who will have this “S” icon at the top of the page:


    Which user to use?If you are the administrator you might want to use “root” all
    the time, make life easier. It is not recommended to do this because of the possibility
    of accidentally damaging the system. Root can access anyone’s files and delete
    or change them, even write-protected files. One typing mistake could be a disaster!
    The normal way to use root is to log in as a normal user most of the time, switching
    to root only when you need special privileges.


    You can switch to root either by logging into directly as “root”, or from a logged-in
    session by using the “su” command. See “Who and su” later (page 30).


    Programs which must run as root

    Some programs such as the “PPP daemon” have to be run as root. To allow normal
    users to run them you can make it “suid root:


    Add set-user-id to normal permissions (will run with owner’s permissions)


    ```

    ```

    chmod +s filename

    ```

