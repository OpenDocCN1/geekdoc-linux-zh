    # Adding a Printer


    Printers in Linux are configured in the /etc/printcap file which describes the
    printers you have connected and their capabilities.


    # Printer Ports


    If you have two or more printer ports, increase the number accordingly. For example:
    /dev/lpr, /dev/lpr2 and so on.


    # To add a printer manually


    It can be quite complex to add anything other than a text printer manually. To
    add support for graphics or multiple fonts, etc. you use one of the printer configuration
    utilities (for example RedHat printtool) or read the printing HOWTO document.


    > Edit /etc/printcap and add these lines:


    | printer name | spool directory |

    |---|---|

    | myprinter:\ | :sh:\ |

    | | :lp=/dev/lp0:\ |

    | | :sd=/var/spool/lpd/myprinter:| |


    2 Save the file, then add the spool directory.


    ```

    mkdir /var/spool/lpd/myprinter

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_113_0.png)


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_113_1.png)


    Don''t forget the backlash (\) on the end of every line of the entry, except the
    last. The:sh:\ line in printcap makes sure you don''t get a "header" page before
    every printout.


    # Filters


    # Carriage Returns


    Some printers will automatically do a carriage return when they get a line feed.
    Others will not. This could cause lines printed from a Linux text file to come
    out in steps like this:


    ```

    line1

    line2

    line3

    ```


    You can eliminate this problem by sending the text through a filter before printing.
    The filter will add a carriage return to each line feed character.


    # Adding the filter:


    > Create a new file in the printer''s spool directory called "filter". Insert
    these lines exactly as shown:


    ```

    # /bin/perl

    while(<STDIN>){chop $\$; print "$\r\n";};

    ```


    Add a line to /etc/printcap to use the filter:


    ```

    myprinter:\

    :sh:\

    :lp=/dev/lp0:\

    :if=/var/spool/lpd/myprinter/filter:\

    :sd=/var/spool/lpd/myprinter:

    ```


    More complex filters can be used to transform text and graphics into postscript
    or other graphic formats for your model of printer. This can be done using such
    software as MagicFilter – see the printing HOWTO for more information.


    Filtering is usually done with Ghostscript which contains filters for many modern
    printer types. This is best set up with a special printer setup utility like Linuxconf
    or RedHat''s printtool.


    # Setting up a printer with Print Tool


    If you don''t have a menu or an icon, you can start the RedHat control panel by
    entering “control-panel”.


    You can start the Print Tool by entering printtool or by clicking on this button
    in the RedHat control panel


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_115_0.png)


    You might have to install a more version of GhostScript to find your printer in
    the list. Get this from your Linux distributor''s internet site.


