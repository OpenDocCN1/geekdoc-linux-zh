    # ...cont''d


    Another preset shell variable is the search path, called PATH. This holds a list
    of directories which the shell looks in when you type a program name.


    When setting the path we normally don''t want to replace what''s already there,
    instead we want to add a new directory name to the end. We can do this by including
    the current value in the new string to be set:


    | Current value | separator | New directory name to add |

    |---|---|---|

    | PATH=$PATH:/etc/ppp | |


    PWD is a variable which holds the current directory. That means that this command:


    ```

    echo $PWD

    ```


    is the same as running the "pwd"command. More useful is the OLDPWD variable. This
    holds the name of the directory you were in you last did a "cd". Therefore you
    can quickly change back to your previous directory after perhaps checking a file
    in another directory. Enter:


    ```

    cd $OLDPWD

    ```


    Some variables which describe your terminal environment:


    +   - COLUMNS: Holds the number of columns in your display (normally 80)

    - LINES: The number of lines (normally 24)

    - TERM: What type of terminal are you using?

    - SHELL: The pathname of your default shell and some which describe this instance
    of Bash

    - BASH: The pathname of the program

    - BASH_VERSION: What you would expect'
- md: "\n## Shell Programming\n\nSometimes we want to perform a complex or repetitive\
    \ sequence of shell commands or programs in Linux. The easy way to do this is\
    \ write a script. A script is a file containing shell commands which can interact\
    \ with the user, repeat commands and make decisions.\n\nA simple script is the\
    \ \"ppp-on\" file we saw to start the dial-up internet connection. This script\
    \ simply sets a few shell variables, then runs the \"pppd\" program with the appropriate\
    \ options.\n\nLet's write a slightly more complex shell script which will make\
    \ backups of files to a removable zip disk. It should do the following things:\n\
    \n- Prompt the user for the name of the directory to backup\n- Check the removable\
    \ disk is mounted, or prompt the user to insert it\n- Create a backup filename\
    \ incorporating the date and time\n- Do the backup using \"tar\"\n\nTo create\
    \ the script, add the following commands to a file called \"zipup\":\n\n```bash\n\
    echo \"Enter Directory:\"\nread DIRNAME\nif [ -d /zipdrive/lost+found ]; then\n\
    \    echo \"Insert Disk\"\n    read A\n    mount /zipdrive\nfi\n```\n\n> Prompt\
    \ user and get a string from the user using the command.\n\n> If the lost+found\
    \ directory isn't there, the disk isn't mounted, so prompt the user and mount\
    \ it.\n\nThis will only work in BASH. See later how to use \"if\" in Tcsh.\n\n\
    ## ...cont'd\n\nTo run a shell script just enter its name at the shell prompt.\
    \ You might have to include the full directory path or ./ (for current directory)\
    \ on the name so the shell can find it. Remember to make it executable (with chmod)\
    \ before running it for the first time.\n\n- 3 Make a filename using the \"date\"\
    \ command.\n\n```bash\nFILENAME=\"bk`date` +\"%U%b%y`.tgz\"\necho \"Backing up\
    \ to $FILENAME\"\ntar czvf $FILENAME $DIRNAME/*\n```\n\n- 4 Backup files from\
    \ the directory into that filename with the \"tar\" command.\n\n### If...else...fi\n\
    \nas we saw in the backup example, we can use \"if\" to check for the existence\
    \ of a file. There are also other conditions we can use. The general form is:\n\
    \nIf you want to repeat a loop until a condition becomes true, instead of while\
    \ it is true, you can use: until condition do commands\n\n### While loops\n\n\
    sometimes we don't want to check for a condition only once, we want to continue\
    \ doing something while a condition is met, or is no longer true. You can do this\
    \ with a \"while\" loop:\n\n```bash\nwhile [ condition ]; do\ndo something\ndone\n\
    ```\n\nThe same condition parts can be used with the \"while\" test as with the\
    \ \"if\".\n\n## Conditions in Bash\n\nThe following table shows some of the conditions\
    \ you can use in \"if\" or \"while\" tests:\n\n| Condition | Description |\n|\
    \ :--- | :--- |\n| -d name | name is a directory |\n| -e name | name exists (file/directory)\
    \ |\n| -f name | name is a normal file |\n| -r name | name is readable |\n| -w\
    \ name | name is writable |\n| -x name | name is executable |\n| string1 = string2\
    \ | string1 is equal to string2 |\n| string1 != string | string1 is not equal\
    \ to string2 |\n| number -eq number | numbers are equal |\n| number -ne number\
    \ | numbers are not equal |\n| string1 -lt number 2 | string1 is less than number2\
    \ (also -le or equal) |\n| string1 -gt number2 | string1 is greater than number2\
    \ (also -ge or equal) |\n\n### Negatives\n\nBy preceding the condition part with\
    \ an exclamation mark (!) you can make it check for the condition being **not**\
    \ true. We used this in the test for the backup shell script.\n\n### Either/Or\n\
    \nIf you want to check for one condition or another being true you can use \"\
    -o\" to mean \"or\". You can also use \"-a\" to mean \"and\". This is shown below:\n\
    \n```bash\nif [ -r thefile -a -w thefile ] ; then\n    echo \"file is readable\
    \ and writeable\"\nfi\n```\n\n## \"For\" Loops\n\nIf you want to perform a certain\
    \ action a number of times you can use a “for” loop. The “for” command cycles\
    \ through a list of filenames or other words and performs commands on each one.\n\
    \nFor example: Print each file called something.txt, and rename it with “.printed”\
    \ on the end.\n\n```bash\nfor file in *.txt; do\n  lpr $file\n  mv $file $file.printed\n\
    done\n```\n\nThe list doesn’t have to be filenames. It could be words taken from\
    \ another command, or the contents of a file.\n\nFor example: Copy each word from\
    \ the “ls” man page to “wordlist.dat”, then sort it and remove duplicates.\n\n\
    ```bash\nfor word in `man ls`; do\n  echo $word >> wordlist.dat\ndone\nsort -fd\
    \ wordlist.dat | uniq\n```\n\n## The C shell\n\nIn “tcsh”, the Linux version of\
    \ the C shell, the “for” command is replaced with the “foreach” command. The syntax\
    \ is slightly different.\n\nFor example: Print all “.dat files”, each preceded\
    \ by “header.txt”.\n\n```bash\nforeach file ( *.dat )\n  lpr header.txt\n  lpr\
    \ $file\nend\n```\n\n## Return Codes\n\n![](img/f2019df07bd67d0d6801cbad23cc32b)\n\
    \nEvery program run returns a status code to the shell. You can check this status\
    \ using the special variable $?. A value of 0 indicates success, while any non-zero\
    \ value indicates an error.\n\nTo see the exit status of the last command run,\
    \ simply echo $?.\n\n| Status | Meaning |\n| :--- | :--- |\n| 0 | Success |\n\
    | non-zero | Error |\n\nA program can exit with a specific status code using the\
    \ `exit` command:\n\n```bash\nexit 1\n```\n\n![](img/f2019df07bd67d0d6801cbad23cc32b)\n\
    \nIf you want to check if a command failed, you can use $? in an \"if\" statement:\n\
    \n```bash\nif [ $? -ne 0 ]; then\n  echo \"Error in command\"\nfi\n```\n\n## Getopts\n\
    \nSome programs take formally named parameters and options, like -x or -P printer.\
    \ To make processing of this type of option easier use the \"getopts\" command.\
    \ Each time you call it, it gives you the next option and parameter, if it has\
    \ one.\n\nTo use it create a shell variable containing all the possible options.\
    \ Those which must take a parameter value are followed by a colon:\n\n## For example\n\
    \n```bash\nOPTS=\"abc\"\ngetopts $OPTS NEXT\n```\n\nAccept -a, -b, and -c with\
    \ a parameter.\n"
  mdcn: "\n\n## Shell 编程\n\n在 Linux 中，我们有时想要执行一组复杂或重复的 shell 命令或程序。实现这一点的简单方法是编写一个脚本。脚本是一个包含\
