    # Modules


    Some parts of the kernel, like certain device drivers, are not required all the
    time from boot-up. In order to save memory, the size of the kernel can be reduced
    by leaving these items out of the kernel and only loading them when required.
    This can be done by specifying M for module in the kernel configuration.


    Certain items should never be built as modules, for instance support for the ext2
    filesystem. If you are going to need continuous use of a kernel function, or if
    you need it at boot time, you should not specify it as a module. Otherwise it
    is a good idea to specify as many options as you can because the kernel image
    size will be reduced.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_175_0.png)


    To use modules make sure you enabled "Loadable Module Support" and "Kernel Daemon
    Support" when you configured the kernel.


    # Building Modules


    When you have configured and built the kernel you need to compile the modules.
    This is done like this:


    +   Build the modules.


    ```

    make modules

    ```


    +   Install the modules in their directories.


    ```

    make modules_install

    ```


    +   Generate module dependency list - so modules others depend on are loaded correctly.


    ```

    depmod -a

    ```


    +   Modules are loaded with "modprobe nodename". Unload with "rmmod nodename".


    +   List loaded modules with "Ismod".


    +   Instead of entering "modprobe" it is better to use "kerneld" which should
    be loaded at boot time. This may be the default for your distribution. When "kerneld"
    is running it will automatically load and unload modules as needed.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_175_1.png)


    To see how to pass parameters to modules see "sound as a module" in the next section.


    174 Linux in easy steps'
