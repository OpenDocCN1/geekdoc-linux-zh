    然后会出现主 xconfig 窗口：


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_173_0.png)


    点击你想配置的部分按钮


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_173_1.png)


    点击查看关于此选项的帮助信息


    点击将此选项包含在内核中

    点击排除此选项

    点击作为模块包含（参见“模块”）


    Linux 简易步骤


    # 编译新内核


    当你完成对新内核中所需的所有选项的选择后，你必须保存选项并退出配置程序。在 xconfig 中，点击“Save and Exit”按钮。在 menuconfig
    中，选择“Exit”然后在后续对话框中选择“Yes”：


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_174_0.png)


    选择“Yes”保存或选择“No”放弃你的配置


    下一阶段是构建编译内核所需的文件列表。


    ```

    make dep

    ```


    - 下一步，删除任何旧文件。


    ```

    make clean

    ```


    - 最后，编译内核。此命令将花费一些时间（长一小时），并创建一个压缩的内核镜像。


    ```

    make bzImage

    ```


    # 模块


    内核的一些部分（例如某些设备驱动程序）在启动时并不是总是需要的。为了节省内存，可以通过将这些项目排除在内核之外并在需要时加载它们来减小内核的大小。可以通过在内核配置中指定
    M 为模块来实现。某些项目永远不应该被构建为模块，例如对 ext2 文件系统的支持。如果你将需要使用该功能，或者在启动时需要它，则不应将其指定为模块。否则，尽可能指定许多选项是一个好主意，因为会减小内核镜像。


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_175_0.png)


    要使用模块，在配置内核时确保启用了“Loadable Module Support”和“Kernel Daemon”。


    # 编译模块


    当你配置并编译内核后，你需要编译模块。操作如下：


    - 编译模块。


    ```

    make modules

    ```


    - 将模块安装到相应的目录。


    ```

    make modules_install

    ```


    - 生成依赖列表以便模块正确加载。


    ```

    depmod -a

    ```


    - 使用 modprobe 加载模块。使用 rmmod 卸载。


    - 列出已加载的模块。与其输入 modprobe，不如使用在启动时加载的 kmod，这可能是你发行版的默认设置。当 kmod 运行时，它会自动加载和卸载模块。


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_175_1.png)


    查看如何向模块传递参数请参见“模块”章节。Linux 简易步骤


    # 示例：启用声音


    在这里你可以看到在 Linux 中启用声音的完整示例。


    - 切换到 /usr/src/ 目录并以 root 身份进入 xconfig。


    ```

    # cd /usr/src/linux

    make xconfig

    ```


    - 找到并点击“Sound configuration”按钮。


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_176_0.png)


    - 点击启用声音。


    - 在列表中找到你的声卡并启用它。在这里你可以看到启用 Sound Blaster。


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_176_1.png)


    - 在框中输入配置参数。手动查找你的声卡，如果你可以进入 Windows，查看设备管理器中的属性页。


    - 要获取任何项的帮助，点击该按钮。


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_176_2.png)


    - 7 在声音配置上点击“Main Menu”，如果你想配置其他项目，点击“Next”。


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_177_0.png)


    - 8 在主 xconfig 菜单上点击“Save and Exit”。


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_177_1.png)


    - 9 重新构建内核。


    - 10 按照下一页描述安装并测试新内核。


    ```

    # make dep

    # make clean

    # make bzImage

    ```


    # 模块


    RedHat 版本的 Linux 有模块化声音系统。其他发行版可以使用标准声音驱动作为模块。要向模块传递参数，你需要添加到 /etc/conf.modules：


    - 在同一行输入参数。


    ```

    alias sound sb

    options sb_io=0x220 irq=7 dma=1 dma16=5

    mpu_io=0x330

    ```


    - 不使用 kmod 使用 modprobe sound 加载模块。“sb” 代表 soundblaster——你需要更改你的模块。你可以在 /lib/modules/X.X.XX
    目录中找到所有模块。将 X.X.XX 替换为你的内核版本。


    # 启动新内核


    一旦你编译了新内核，就需要尝试它。重要的是现在不要丢弃旧内核，因为新的可能是不正确的。


    # 使用 Lilo


    如果你通常使用 LILO 启动，你需要在其中添加一个部分：


    ```

    image=/usr/src/Linux/arch/i86/bzImage

    label=new

    root=/dev/hda3

    read-only

    ```


    输入此启动新内核 新内核镜像文件


    更改 lilo.conf 后，你必须运行 Lilo 使其生效。在提示符输入“lilo”。启动时你可以输入“new”。这将运行新内核。如果运行正常，你可以将内核镜像复制到通常的位置替换旧内核。不要忘记再次运行
    lilo。


    更改“lilo.conf”后必须运行“lilo”，否则你无法进入 Linux。


    # 使用 LoadLin


    如果你使用 LoadLin 从 Windows 或 DOS 会话启动 Linux，你必须将其复制到 C 盘才能启动。此此最佳方法是使用 mcopy，它是 Mtools
    包的一部分。配置 Mtools 以识别 C 盘并使用如下命令：


    ```

    mcopy /usr/src/Linux/arch/i86/bzImage

    C:\bzimage.new

    ```


    然后，在 Windows 或 DOS 中，将包含 LoadLin 命令的 LINUX.BAT 文件复制到新文件。将内核文件名更改为你刚刚复制的文件并测试它。


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_178_0.png)


