    ### If...else...fi\n\n正如我们在备份示例中看到的，我们可以使用 \"if\" 来检查文件是否存在。我们还可以使用其他条件。通用格式为：\n\
    \n如果你想让循环一直执行直到某个条件变为真，而不是在条件为真时执行，你可以使用：until condition do commands。\n\n### While\
    \ 循环\n\n有时我们不想只检查一次条件，而是希望在条件满足或不再满足时继续执行某些操作。你可以通过 \"while\" 循环来实现：\n\n```bash\n\
    while [ condition ]; do\ndo something\ndone\n```\n\n相同的条件部分可以像用于 \"if\" 一样用于 \"\
    while\" 测试。\n\n## Bash 中的条件\n\n下表显示了可以在 \"if\" 或 \"while\" 测试中使用的一些条件：\n\n| 条件\
    \ | 说明 |\n| :--- | :--- |\n| -d name | name 是一个目录 |\n| -e name | name 存在（文件/目录）\
    \ |\n| -f name | name 是普通文件 |\n| -r name | name 可读 |\n| -w name | name 可写 |\n\
    | -x name | name 可执行 |\n| string1 = string2 | string1 等于 string2 |\n| string1\
