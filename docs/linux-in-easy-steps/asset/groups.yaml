  - '[PAGE 148]


    # Making a Rescue Disk


    For a much useful rescue disk, in effect a complete Linux on one floppy, you need
    something like "tomsrtbt" available with other bootdisks from http://sunsite.unc.edu/pub/Linux/system/recovery/.
    Also see the Bootdisk Howto under /usr/doc directory.


    PCs and hard disks sometimes fail and it is wise to be prepared. In the event
    of a failure of your PC there may come a time when you can''t boot into Linux.
    All is not necessarily lost if you have a rescue disk which you can use to boot
    Linux and gain access to the system.


    RedHat Rescue Disk

    The RedHat installation CD has the capability to be used as a rescue disk. However,
    first you need to make a rescue floppy disk to use in the process:


    +   1 Mount the RedHat installation CD and change to the /dosutils/ directory


    +   2 Insert a blank diskette and enter this command


    ```

    dd if=rescue.img of=/dev/fd0 bs=72k

    ```


    +   3 To use the rescue disk: boot from the CD and enter "rescue" at the boot
    prompt. Insert the diskette when prompted


    Another type of rescue disk is a simple bootable floppy containing your Linux
    kernel. It will help you if you can''t boot from your hard disk, and will start
    up your normal Linux system from where you can run LILO or copy a kernel for loadlin


    Creating a Boot Disk

    You must be familiar with rebuilding the kernel for this process. See the next
    chapter for information on this if you are unsure.


    To create a bootable kernel on a floppy disk, insert a diskette and configure
    the kernel as normal. When it comes to build the kernel enter "make fdImage" instead
    of "make bImage"


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_148_0.png)'
  - '[PAGE 149]


    # Processes


    Each program running on Linux is called a process. There are many more processes
    running at one time than just the programs you have started. The boot process
    runs a number of processes known as “daemons” for things such as looking after
    the print queue and networking. You can see your own processes using the “ps”
    command:


    ```

    [fred@localhost fred]$ ps

    PID TTY STAT TIME COMMAND

    261 2 S 0:00 -bash

    337 2 S 0:00 sh /usr/X11R6/bin/startx

    338 2 S 0:00 xinit /usr/X11R6/lib/X11/xinit/xinitrc -

    342 2 S 0:13 fwm2 -cmd Fvwm4 -debug /etc/X11/AnotherLevel/fvwm2rc.m4

    412 2 S 0:00 /usr/X11R6/lib/X11/fvwm2//FvwmTaskBar9 4 /tmp/fvwmrca00351

    418 p0 S 0:00 bash

    487 p0 R 0:00 ps

    ```


    Process ID Terminal CPU Time Program

    (console or used window)


    This output shows the process ID and information about the programs running.'
