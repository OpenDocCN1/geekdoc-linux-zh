    tcsh

    ```


    ## 启动命令


    Bash 和 Tcsh 在启动时都会运行一个特殊的脚本。Bash 在你的主目录中查找一个名为“.bashrc”的文件。可以使用特殊的简写记法写为 ~/.bashrc。C
    shell 使用一个名为“.cshrc”的文件。


    ~ 意味着：我的主目录。~fred 意味着：Fred 的主目录。


    当 Shell 启动时，它通常处于两种模式之一：普通模式（Normal）或登录 Shell（Login Shell）。


    当它作为登录 Shell 运行时，它会运行另一个特殊的脚本，该脚本通常包含设置环境、更改提示符等命令。你在文本控制台中的第一个 Shell 默认是登录 Shell，并将运行特殊的启动脚本。你之后启动的任何
    Shell 都不会是，除非你特地使用下面的命令之一进行选择。


    对于 Bash，这种特殊的登录 Shell 脚本被称为“.bash_profile”，并且必须位于你的默认登录目录中。此外，登录 Shell 还会为所有用户运行
    /etc/profile。当你退出登录 Shell 时，Bash 将运行 .bash_logout。


    ### 启动登录 Shell (Bash)


    ```

    bash -login

    ```


    使用 -login 选项启动 shell


    对于 C shell，登录脚本被称为“.login”，同样位于你的主目录中。当你退出登录 Shell 时，C shell 还会执行一个名为“.logout”的文件。


    ### 启动登录 C shell：


    单独使用 -l 选项


    ```

    tcsh -1

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_122_0)


    ## Shell 命令


    有很多运行外部的命令。其中一些用于控制输出。我们可以使用重定向操作符 ">" 来指定输出的去向。例如，将命令的输出保存到文件：


    ```

    ls > filetxt

    ```


    我们还可以使用 "<" 重定向输入。例如：


    ```

    cat < filetxt

    ```


    管道符 "|" 用于将一个命令的输出发送到另一个命令的输入。例如：


    ```bash

    ls | grep "txt"

    ```


    ## Shell 变量


    有时我们希望 Shell 记住某些值。其中之一是你的主目录。通过在名称前加上 $ 来引用该值。例如：


    | echo $HOME | 显示目录 |

    |---|---|

    | /home/fred | |

    | cd $HOME | 切换 |


    设置变量的值时，等号前后不要留任何空格。


    输入名=值：


    ```

    MYVAR=12345

    ```


    变量名


    值


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_124_0)


    如果值包含空格，用双引号括起来，“如这样”。


    - 导出变量以便其他程序可用：


    ```

    export MYVAR

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_124_2)


    另一个预设的 Shell 变量是搜索路径，称为 PATH。它包含了 Shell 输入程序名称时查找的目录列表。


    在设置路径时，我们通常不想替换已有的内容，而是想在末尾添加一个新的目录名。我们可以通过将当前值包含在新字符串中来实现：


    | 当前值 | 分隔符 | 要添加的新目录名 |

    |---|---|---|

    | PATH=$PATH:/etc/ppp | |


    PWD 是一个包含当前目录的变量。这意味着命令：


    ```

    echo $PWD

    ```


    等同于运行 "pwd" 命令。更有用的是 OLDPWD 变量。它包含了上次执行 "cd" 时所在的目录名称。因此，在另一个目录检查某个文件后，你可以快速回到之前的目录。输入：


    ```

    cd $OLDPWD

    ```


    ...续


    描述你终端环境的一些变量：


    - COLUMNS：持有显示器的列数（通常为 80）

    - LINES：行数（通常为 24）

    - TERM：你使用的是什么类型的终端？

    - SHELL：你的默认 Shell 路径以及一些描述此 Bash 实例的路径

    - BASH：程序的路径

    - BASH_VERSION：你所预期的版本


    '
