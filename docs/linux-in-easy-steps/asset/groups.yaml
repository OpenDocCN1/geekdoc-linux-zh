- md: '

    When the Linux system boots up, the root filesystem is automatically mounted.
    Then it looks through the fstab file to find out which other filesystems to mount.
    They can be: Linux format (ext2), other formats such as DOS or Windows, removable
    disks like floppy disks or CD-ROMs, or special filesystems.


    All filesystems not marked with “noauto” in the flags field will be mounted. If
    an entry has “readonly” you will not be able to delete or change files in that
    directory or subdirectory.


    All automatically mounted Linux disks or partitions are checked when they are
    mounted.


    ## Special Filesystems


    Some entries in the fstab refer to special filesystems. One obvious is the “swap”
    entry. This is not even a filesystem, it is just an area of disk used by the operating
    system as a temporary memory store. This allows more programs to be run at the
    same time. Because it is not a filesystem the “swap” entry doesn''t have a mount
    point.


    The “proc” is the other special filesystem here. This is a kind of filesystem
    but is not located on any real disk, rather it is invented by the operating system
    at run-time. The mount point is “/proc” and if you look in this directory you
    will see many files describing the current state of the Linux system.


    ## Accessing Windows Files


    Although Linux is a very different operating system from Windows and cannot run
    Windows programs (at least without additional software), you might want to access
    files on your Windows disk from within Linux.


    You can do this by mounting the Windows disk like any other, fitting it into the
    Linux filesystem''s tree structure, and accessing files and folders (directories)
    as normal.


    Windows partitions will be either FAT, or FAT-32 format. In Linux, both are called
    "vfat".


    If your windows disk is the first hard disk on the PC, as would normally be the
    case, the partition name will be “/dev/hda1”.


    ### To mount a Windows disk


    - 1 Find out: the Linux name of the partition, the Filesystem type (vfat) and
    the mount point.

    - 2 If you haven''t already, create the mount point directory.


    ```

    mkdir /windows

    ```


    - 3 Either use the mount command:


    ```

    mount -t vfat /dev/hda1 /windows

    ```


    - 4 Or add the entry to the fstab file:


    ```

    /dev/hda1 /windows vfat defaults 0 0

    ```


    If you used the mount command you will find your windows files in the "/windows"
    directory. If you left it to fstab you will have to reboot to see them.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_37_0.png)


    36 Linux in easy steps


    ## CD-ROMs and Floppy Disks


    CDs, floppy disks and other removable disks, must also be mounted before they
    can be used. However they are distinct from fixed disk partitions because you
    will rarely want them to be mounted automatically when you boot, the disk will
    not generally be in the drive.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_38_0.png)


    Always use "umount" before removing a disk, otherwise you might lose data.


    To mount a removable disk we have to use the "mount" command when the disk is
    needed and the "umount" command when we have finished, and before it is removed.

    To make things easier we can take advantage of some additional options on the
    fstab entry:


    - "user" allows normal users to mount the disk

    - "noauto" prevents the disk from being mounted at boot


    Why do we want an entry in the fstab file if we don''t want the disk to be mounted
    automatically? Because then we can use a much simpler version of the "mount" command.


    ### To mount a floppy disk automatically


    Add this line to "/etc/fstab":


    ```

    /dev/fd0 floppy auto user,noauto 0 0

    ```


    2 Use this command to mount it: don''t users to automatically mount


    ```

    mount /floppy

    ```


    3 When you have finished use this command to unmount:


    ```

    umount /floppy

    ```


    Because of the entry in "/etc/fstab" any user can mount the disk (not just root,
    the superuser) and we are able to use a much reduced form of "mount". The fstab
    entry fills in the missing details – the device, filesystem type, and so on.


    Handling Disks and Files


    37


    ...cont''d


    Notice that we specified the filesystem type as “auto”. This allows us to use
    DOS/Windows or Linux format floppy disks equally without saying which type.


    ### This table shows different filesystem types


    | Disk | Device | Filesystem type |

    |---|---|---|

    | 3.5" floppy | fdo2,fdi2 | mdsos,vfat,ext2 |

    | IDE CD-ROM | hdb1/2,hdc1/2, etc. | iso09660 |

    | SCSI CD-ROM | sca1/2,scb1/2, etc. | iso09660 |

    | IDE Zip, etc | hdb1/2,hdc1/2, etc. | mdsos,vfat,ext2 |

    | SCSI Zip, etc | sca1/2,scb1/2 | mdsos,vfat,ext2 |


    The device name for IDE and SCSI devices will depend on which position the device
    is in, as for IDE disks. Once you know which position it is in you can create
    a “soft link” to it, for example, “/dev/cdrom”, which can be used in its place
    in the fstab file. To link “/dev/cdrom” to “/dev/hdcr”, use the following command:


    ```

    ln -s /dev/hdc1 /dev/cdrom

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_39_0.png)


    You have to create the mount point if it doesn''t exist.


    ### To mount a CD-ROM


    > Add this line to


    ```

    /dev/cdrom /cdrom auto user,noauto 0 0

    ```


    Use this command to mount it:


    ```

    mount /cdrom

    ```


    Don''t forget to use “umount” when you''ve finished!


    38 Linux in easy steps


    ## The "mtools" Package


    Linux is usually supplied with a set of programs known as "mtools". These programs
    enable you to access files on DOS or Windows floppy disks without having to mount
    and unmount them.


    The mtools programs can use the DOS-style names, i.e. "A:" or "C:". You need to
    use a configuration file to tell the tools which is which. The file is "/etc/mtools.conf"
    and should contain the following lines:


    ```

    drive a: file="/dev/fd0" exclusive

    drive b: file="/dev/fd1" exclusive

    ```


    Add more hard disk partitions if you have them, here.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_40_0.png)


    ```

    #First IDE hard disk partition

    drive c: file="/dev/hda1"

    ```


    Other mtools commands include "mcd" to change current DOS directory, "mtype" to
    display the contents of a file, "mren" to rename or move files, "mdel" to delete
    a file, "mdtree" to delete a whole directory and subdirectories, "mmd" to make
    a new directory, "mrd" to remove a directory, "xcopy" to copy a directory and
    all subdirectories.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_40_1.png)


    When you use mcopy you can omit the destination directory and filename, and it
    will transfer the files to:


    ```

    mdir C:\Windows

    ```


    To copy files from a DOS or Windows disk to:


    ```

    mcopy A:\.* /home

    ```


    ## CR/LF conversion


    When specifying filenames one useful option is "-t". This will treat the files
    as text and converts DOS-style line endings to Linux-style, allowing files to
    be read more easily:


    ```

    mcopy -t C:\Windows\readme.txt /usr/doc

    ```


    Handling Disks and Files


    39


    ## Dual Booting


    When you have installed Linux on a computer which already has Windows, you normally
    want to select to load Windows instead of Linux, perhaps to run some software
    which is not available for Linux. To do we need a way of selecting which operating
    system to load when we switch on.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_41_0.png)


    A partition is a disk with a letter like C: or D: in Windows. The "active" partition
    is the one which has been marked as the boot partition. This partition is the
    one which will be used for loading the operating system. If the active partition
    contains Windows then Windows will be loaded; if it contains Linux, on the other
    hand, Linux will be started when you boot. You can change the active partition,
    and thereby which operating system you load, by using "fdisk" or one of the third-party
    applications.


    It is quite inconvenient however to change the active partition each time you
    want to change from Linux to Windows or vice versa. Also, the frequent manipulation
    of the partition table is not to be encouraged generally, so there are several
    other ways to achieve our goal.


    # Loadlin


    Loadlin gives us a novel way to start Linux. After starting Windows in MSDOS mode,
    or switching to MSDOS, loadlin will load Linux over the top of the currently running
    operating system in memory (it doesn''t affect the disk). Loadlin needs a Linux
    kernel image on the Windows disk so it takes a little extra disk space (about
    a half megabyte).


    # LILO


    LILO is the Linux Loader and can be configured to give us a prompt at boot time
    in order that we can select which partition to boot from, and which operating
    system to load, and even which version to use. If none are selected Lilo can start
    a default.

