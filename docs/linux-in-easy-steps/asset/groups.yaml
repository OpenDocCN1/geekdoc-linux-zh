    # Resources


    Resources are a standard X way of supplying fixed parameters to programs. A resource
    is a named value and can be given either on the command line or in a resources
    file.


    # Format of resources


    A resource string has the following form: `application*attribute[*attribute]:value`


    The bracketed part is optional and depends on the resource you are setting.


    # Examples


    +   - XTerm*scrollYBar:on XTerm scrollbar on

    - XTerm*scrollYBarwidth:5 Set the width of the XTerm scrollbar.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_77_0.png)


    Read the man page for a command to find out which resources it supports.


    # Specifying Resources on the Command Line


    To set a resource value on the command line of a program, use the “xrm” option.
    You need to enclose the resource string in quotes as it contains asterisks which
    might be interpreted by the shell.


    # For Example


    (enter as one line)


    ```

    xterm -fg yellow -bg blue -xrm

    "XTerm*scrollYBar:on"

    ```


    # Specifying Resources in a File


    Create a file in your home directory called “.Xresources” and place each resource
    string, one per line.


    To make X read these resources in it starts up you need to use the “xrdb” command.
    Add the following line to your X start-up file:


    ```

    xrdb -merge $HOME/.Xresources

    ```'
