  - '[PAGE 117]


    # The Print Queue


    When you print a file it goes into a queue. Several files can be queued up waiting
    for one printer at any one time. When each job finishes the next one will be started.
    Separate printers have separate queues and a job on one printer doesn’t have to
    wait for jobs on another printer to finish.


    You can view the current print queue using the “lpq” command.


    ```

    lpq -Pmyprinter --printer name

    ```


    # Removing items from the queue


    If you own an item, that is if you submitted it to the queue in the first place,
    you can stop items from printing. This is only possible if they haven''t been
    printed yet. Note that modern printers have large buffers so a file could have
    been sent to the printer in its entirety even if nothing has come out yet.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_117_0.png)


    Of course the root user can delete anybody’s jobs.


    ```

    lprm -Pmyprinter --- job number

    ```


    # Controlling Print Queues


    The “lpc” command allows you to enable and disable printing on specific print
    queues. The table below shows some of the options:


    | lpc status printer | Show printer status |

    | lpc abort printer | Immediately terminate printing on printer |

    | lpc disable printer | Disable printing |

    | lpc enable printer | Re-enable printing |

    | lpc topq printer job | Move job to the top of the queue |'
