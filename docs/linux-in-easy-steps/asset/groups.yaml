    # DEP Packages


    The Debian Linux distribution uses packages in its own file format called DEP.
    These are installed using a program “dpkg”, or the menu-driven front end “dselect”.


    # To install a package


    ```

    dpkg -i filename

    ```


    # To list installed packages


    ```

    dpkg -l name

    ```

    optional package name to match


    # To remove (uninstall) a package


    ```

    dpkg -r packagen

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_142_0.png)


    # Using "dselect"


    This is a front-end to “dpkg”. Unfortunately as the man page admits, it is not
    very user-friendly to beginners. The basic idea is that a list of packages is
    maintained and when you enter “dselect” you have the following options:


    Enter "man dpkg" for more information on dpkg, and "man dselect" for information
    on how to use dselect. Inside dselect press “?” to see help on using dselect and
    how to interpret the package display.


    # Choose Access (where your package are files)


    This requires you to know the “/dev” name of your CD you are getting files from
    a CD-ROM.


    # Choose files to install/remove


    You are presented with a long list of packages and their current status. You can
    select to install or remove them by pressing + and -. Press Q to return to the
    main menu.


    # Install or Remove packages


    This stage normally takes some time as it goes through the whole list of all packages
    in the directory.


    # Configure installed packages


    Some packages have configuration steps which are necessary before you run them.
    This is the same as running “dpkg --configure".


    # Source Packages


    Sometimes a distributed software package is only suitable for your system if you
    have certain other packages, usually libraries, installed on your system. To avoid
    the problem of incompatible packages some software is distributed as “source”
    which then needs to be rebuilt before you can run it.


    Source packages may be source RPMs, or compressed tar files.


    ## To build a package from SRPM


    Enter this command to build the package:


    ```

    rpm --rebuild filename

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_143_0.png)


    You could use “glint” for step 2 instead.


    - 2 Change to the RedHat package directory, where the newly built package is located


    ```

    cd /usr/src/redhat/RPMS/i386

    ```

    and install the package using the “rpm” command.


    ## To build a package from a gzipped tar file


    - 1 Extract the file into a temporary directory.


    ```

    tar xvzf myarchive.tar

    ```


    - 2 Read any “readme” files that the package has. If there is a “configure” script,
    run it.


    ```

    ./configure

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_143_1.png)


    It is best to run “make” as your own user but use “root” to install the files.


    - 3 Run “make” to build the runnable files.


    ```

    make

    ```


    - 4 Install the runnable files.


    ```

    make install

    ```


    # Day to Day


    Here we deal with the day to day operation of a Linux system. You will learn how
    Linux starts up and shuts down and how to control this sequence. You will learn
    to protect yourself by creating a rescue boot disk, how processes run and how
    to manage them, managing disk space, and the operation of swap for virtual memory.
    You will also see some of the other commands you will come across in using your
    Linux system, including how to set the time.


    # Covers


    | Topic | Page |

    | :--- | :--- |

    | Shutting Down and Restarting | 144 |

    | Changing Runlevels | 145 |

    | The Init Sequence | 146 |

    | Making a Rescue Disk | 147 |

    | Processes | 148 |

    | Monitoring Processes | 151 |

    | Managing Disk Space | 153 |

    | Virtual Memory and Swap Files | 155 |

    | Looking at Files | 156 |

    | More about Disks and Files | 158 |

    | The Date Command | 160 |


    # Shutting Down and Restarting


    It is important that Linux is shut down properly before the power is switched
    off. Failing to do so could result in loss of data or corrupt disks. The correct
    way to shut down Linux is with the "shutdown" command.


    ```

    /sbin/shutdown -h now

    ```

    shutdown is in the /sbin/ directory Halt the system Shutdown right now


    If you have a system with power management and control of the power button, shutdown
    can turn the system off too. If the Kernel has been configured correctly the PC
    will turn off after halting.


    # Rebooting


    To reboot the system you simply use -r instead of -h:


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_145_0.png)


    ```

    /sbin/shutdown -r 17:30 "Reboot at 17:30"

    ```

    Reboot the system Shutdown at 17:30 Send this message to all users


    Most systems also have the following line in /etc/initittab which will cause the
    familiar "Ctrl+Alt+Del" key combination to run this command:


    # Cancelling a shutdown


    If you issue a shutdown with some time you can prevent it by using this command:


    ```

    /sbin/shutdown -c

    ```


    # Changing Runlevels


    When you learned about switching runlevels you saw that 4 is multi-user and 0
    is halt. You can also go to single-user by adding the word "single" after the
    normal boot command at LILO prompt.


    # The Init Sequence


    Linux uses the “Sys V” init sequence. This means that it follows the start-up
    conventions of the famous System V. These conventions determine the sequence of
    programs which are run when the system changes runlevel, including of course,
    when starting up or shutting down.


    # The Init Directories


    Each runlevel has its own directory under “etc/rc.d”. The directories are named
    “rcn.d”, where n is the runlevel, from 0 to 6. Each directory contains a series
    of shell scripts which are run in order of their names, when entering or leaving
    that particularlevel. Some files named with “Knn” are used to stop, or kill existing
    programs when entering that level. Others begin with “Snn” and are to start programs.


    Because these files need to exist in multiple directories, for each runlevel where
    the program is required, the actual scripts are located in “etc/rc.d/init.d” and
    the individual runlevel directories have soft links to them.


    # To add a Start-up Command


    - If a script does not exist for this program in “etc/rc.d/init.d” then you will
    need to add it. It will be called with a parameter “start” or a parameter “stop”.


    - cd to the directory for each runlevel where the command should be started


    ```

    /etc/rc.d/rc3.d

    ```


    - Add a link to the start-up script and the kill script if necessary:


    ```

    ln -s /etc/rc.d/init.d/myprog S99myprog

    ln -s /etc/rc.d/init.d/myprog K99myprog

    ```


    HOT TIP add a start-up command without the complications of these scripts, you
    can add a command to “etc/rc.d/local” which will be run after all other scripts.


