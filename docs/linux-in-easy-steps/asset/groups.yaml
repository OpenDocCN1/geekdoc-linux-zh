    在 Linux 中，每个文件都属于一个用户，通常是创建它的用户。文件的所有者有权读取文件、如果是程序文件则运行它，以及更改或删除文件。其他用户只能执行所有者许可的操作。


    文件还属于一个命名组。系统上的每个用户都是一个或多个组的成员。属于给定文件所在组的用户可以被赋予特殊权限来读取、写入或运行文件。


    # 查看文件所有权详情


    - 使用带有 `-l` 选项的 `ls` 命令列出文件。


    ```

    ls -l /etc

    ```


    列表显示了权限、文件所有者和组。


    | total 866 | | | | |

    | --- | --- | --- | --- | --- |

    | -rw-r-r- | 1 | root | root | 2045 Oct 23 1997 DIR_COLORS |

    | -rw-r-r- | 1 | root | root | 8 Feb 7 1998 HOSTNAME |

    | drwx-xr-x | 11 | root | root | 1024 Feb 12 1998 X11 |


