    # Structure of the Filesystem


    We saw before how the Linux filesystem is made up of a tree structure. You might
    have noticed that this structure doesn''t allow for addressing individual disks
    like C:, D: or A: in Windows.


    In Installing Linux (chapter one) we discussed how this is resolved. Each physical
    device, corresponding to a drive letter in DOS or Windows, is attached to the
    tree seamlessly as any other directory. This process is called Mounting the disk.


    Let''s take a closer look. If you only have one hard disk partition for Linux,
    then you have no choice – that is where the root of the filesystem will be located.
    Furthermore, all the subdirectories and files in them are located on that disk
    too. If you have more than one partition, which is quite common these days, you
    have to choose one to be the root partition. Normally you will choose one to use
    for swap, that for virtual memory which allows you to run more programs simultaneously.
    The swap partition doesn''t fit into the filesystem tree Now you can select where
    in your tree structure you want to place the other disks (partitions) you have
    for Linux. It is normal to allocate these to root-level directories according
    to their sizes.


    All these decisions will normally be made at installation time but sometimes you
    want to change the arrangement, for example, if you buy a bigger hard disk.


    Let''s imagine we have four available partitions, each of 500 MB. This may be
    from a 2 GB disk split into four, for example. If they were four partitions of
    our second disk they would have the names hdb1, hdb2, hdb3, and hdb4. One must
    be root. We can use one /home (for users to store their personal files on), one
    for /usr, for applications and some system files files and one for /var. Here
    we have separated critical files and variable-sized directories which is safer.'
  - '[PAGE 34]


    # ...cont''d


    The filesystem would look like this:


    ```

    / (hdb1)

    home (hdb2) usr (hdb3) var (hdb3)

    ```


    Other directories (dev, etc, tmp) would be on the same device as the root, that
    is hdb1. All files and subdirectories in these locations are stored on the hdb1
    partition.


    All files in /home and its subdirectories are stored on the hdb2 partition, and
    so on for /usr and /var over hdb3 and 4 respectively.


    The individual disks are hidden from us. The files all appear in the filesystem
    in their respective directories.


    # How to Mount a Disk


    Disks are mounted into the filesystem using the mount command. To mount a Linux-format
    disk on hdb2, and place it in /mnt, we use this command:


    ```

    mount -t ext2 /dev/hdb2 /mnt

    ```


    Linux disks are called “second extended filesystem” or “ext2” type disks. The
    “-t” parameter determines the type or format of the disk to be mounted. Other
    possible values are “msdos” for a DOS format disk, “vfat” for Windows 95 or 98
    and so on.


    The next parameter represents the name of the partition we are mounting. All devices
    have a special file in the /dev directory and we specify the name of this file
    here, i.e. /dev/hdb2”.


    The mount point is the directory in the tree where we want the disk to take root,
    for example, “/home”. This directory must exist but should not contain any files.
    If it does they will be covered up by the new disk and you won’t see them anyway.


