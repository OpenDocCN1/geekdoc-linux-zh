    # Both "more" and "less" can be used on their own with a filename, or as a filter.
    To use as a filter: "pipe" to the output of another command with "|".


    You can page through a file with the "more" command which works like "man". Press
    Space to go forward, b to go back, and q to quit.


    "More" is quite limited and Linux has its own more advanced version called "less".
    Less" understands all the commands which "more" does and others, including scrolling
    left and right (with the cursor control keys), and setting bookmarks and return
    to the man. The man page for "less" shows the full set and some of the most useful
    are listed below:


    | Return | |

    |---||

    | Move forward one line |

    | y | Move back one line |

    | Space | Move forward one page |

    | b | Move back one page |

    | q | Quit |

    | /string | Find string, looking forwards |

    | n | Find next occurrence |

    | ?string | Find string, looking backwards |

    | N | Find next backwards |

    | /string | Find next line which doesn''t contain |

    | g | Go to beginning of file |

    | G | Go to end of file |

    | nnp | Go to nn percent through the file |

    | m/letter | Mark current position with letter |

    | ''letter | Jump to mark letter |

    | e filename | Edit new file given by filename |

    | (or or { | Find corresponding closing ), ], or { |

    | )or or { | Find corresponding opening (, [, or { |'
  - '[PAGE 159]


    # More about Disks and Files


    We saw earlier in the book how we access disks and files. How is the filesystem
    created?


    # Disk Formatting


    Disks are formatted with the "mkfs" or "make filesystem" command. This command
    is a front end to several others, depending on which type of filesystem you are
    going to create. The syntax is:


    ```

    mkfs -t type [options] device [blocks]

    ```


    The options are specific to the type of filesystem being created. The standard
    Linux filesystem is called the 2nd extended filesystem and is denoted by "-t ext2".
    You can specify these options:


    +   -c Check for bad blocks

    -l filename Get list of bad blocks from filename

    -v Verbose output


    Generally you don''t need any of these options. Also, blocks is unnecessary as
    the formatter can work it out.


    # Example


    ```

    mkfs -t ext2 /dev/hdb1

    ```


    # Checking a Filesystem


    The "fsck" command will check the integrity of a filesystem, and repair any errors.
    Use it like this:


    ```

    fsck [options] [device]

    ```


    If the device is omitted you must specify -A option which means check all filesystems
    listed in the "/etc/fstab" file. If you add the -R option the root filesystem
    will not be checked.


    You can also specify a filesystem type with "-f type". This will make sure only
    filesystems of that type are checked.'
  - '[PAGE 160]


    # Soft and Hard Links


    A link is an alternative name for an existing file. It does not make a copy of
    the file but it adds a directory entry, possibly in another directory or on another
    disk, for a file or directory.


    Links can be hard or soft. A hard link must be on the same disk as the file being
    linked to because it is a new directory entry, indistinguishable from a real entry.
    Effectively the file exists twice, although the data is stored only once. If you
    delete a file which is hard linked, you must delete both directory entries before
    the file is actually deleted.


    Create a hard link like this:


    ```

    ln existingname(s) newname

    ```


    The existingname can be a directory or a filename, you have to add the -d option
    and you must be a superuser to create a hard link to a directory. If you specify
    more than one the newname must be a directory and a link is created in it for
    each of the existing files or directories listed.


    Creating Soft Links:


    A soft link is also known as a symbolic link. The link can span across disks and
    is visible in “ls -l”. In contrast to an ordinary user can create a link to a
    directory and if the existing file is removed the link remains (but doesn''t work
    any).


    Create a soft link with the “-s” option, like this:


    ```

    ln -s existingname(s) newname

    ```


    Symbolic links are frequently used to give a file or directory a generic name,
    even though the real file or directory may change. For example:


    Linking /dev/cdrom to /dev/hdd (Special device file)


    Linking /usr/X11R6/bin/X to X_svga (X server)


