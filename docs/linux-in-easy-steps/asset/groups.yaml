    the ":e" command for each one. Is there a quicker way? Of course there is:


    +   Edit the files by putting their names individually on the command line, or
    entering a pattern:

    ```

    vi *.txt

    ```


    The editor starts on the first file. Edit it, then move to the next file with
    ":n". When you reach the last file, or at any time, you can go back to the first
    with ":rew" (rewind).'
