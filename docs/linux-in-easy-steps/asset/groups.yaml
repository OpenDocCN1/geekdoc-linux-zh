    49 Editing and Searching files


    ## Searching for Strings


    There are several commands used to find strings in files you are editing:


    The search and replace commands are case-sensitive, so searching for "fred" won''t
    find "Fred".


    ### Find Forwards

    Press "/" then enter the string you want to find. The cursor will jump to the
    next occurrence of that string of characters. If the end of the file is reached
    the search "wraps around" and continues looking from the beginning of the file.


    ### Find Backwards

    To look backwards instead of forwards use "?" instead of /. To repeat the last
    search made in the opposite direction, use "F".


    ### Find Next

    After searching you just need to press "n" to find the next occurrence of the
    string, either forwards or backwards.


    ### Replacing text

    The replace command (actually "s" for substitute) is a "colon" command, so you
    have to press ":" before entering the command. It also acts on a range of lines.
    By default it will act on the current line. To work on more lines at once you
    have to enter a range, like this:


    | 20 | |

    | :--- | :--- |

    | 20, 30 | Lines 20 to 30 |

    | 1, $ | Whole file |


    ### Examples

    /this Find next occurrence of "this"

    ?X Find "X", looking backwards from cursor

    :1,$s/first word/1one/g


    Globally, i.e. all occurrences on a line | For all lines in file | Substitute
    Find this text | Replace with this


    50 Linux in easy steps


    ## Regular Expressions


    The search strings we have just seen are a simple example of what are called "regular
    expressions".


    ## Special Characters


    The following characters have special meanings:


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_52_0.png)


    The notation here can be used when searching for text in "vi".


    - * Matches any single character

    - * Matches zero or more occurrences of character c

    - ^ Represents the start of the line

    - $ Represents the end of the line

    - [cc] Matches any one of the list of characters cc.

    - [^cc] Any character except one of list

    - \< Represents the start of a word

    - \> Represents the end of a word


    Lists of Characters

    Inside square brackets "[" "]" a list is formed by simply placing characters one
    after the other, like "[abc]". This will match "a", "b", or "c". You can indicate
    a range of letters with a "-", e.g. "[a-z]" will match any lower case letter.


    Escaping Characters

    To find a special character in the text to match, you will have to "escape" it
    by preceding it with a backslash "\\". If you want to include a comma, escape
    it too ("\,"). Any character which normally has a special meaning may be escaped,
    including "[", "]", "\.", "*". You do not have to do this inside square brackets,
    they are treated as one of the list. If you wantant to include "-" or "]" in a
    list you will have to make it the first character in the list.


    ## Examples


    - [a-zA-Z] Any lower or uppercase letter

    - [A-Z] [a-z]* Any upper case letter followed by optional lower case letters,
    at the beginning of the line.


    ## Replacement Strings


    Regular expressions are not only used for search strings, that is those you are
    looking for. They can also be used in the strings you specify as replacements.
    The following special characters can be used in "vi" in the replacement part of
    a substitute command:


    - \ Escape character (as in the search string)

    - & Maps to the search string

    - ~ Maps to the last replacement string

    - \u Uppercase letter

    - \l Lowercase letter

    - \e Turn off \u or \l

    - \L Lowercase string

    - \U Uppercase string

    - \E Turn off \U or \L


    ## Examples


    - 1,$s/*/""/ Enclose every non-blank line in quotes

    Find one or more characters Replace with same string, plus quotes

    - 1,$s/^./\u& Change first letter of each line to uppercase


    ```

    s/\<[a-zA-Z][ ]*[0-9][^ ]*\U&\E Or L&g

    ```

    Start of Word Number Find words containing a number, replace with "WORD or word."
    For example, replace "H2O" with "H2O or h2o"


    Any Letter Anything except a space Anything except a space


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_53_0.png)


    ## Grep


    One story says that "grep" takes its name from g<expression>p after the command
    in the "ex" editor globally find regular expressions and print those lines. The
    more usual explanation is that it stands for General Regular Expression Parser.
    Either way, grep is one of the most useful Linux commands.


    Grep, simply put, is a utility for finding strings in files. You can run it directly
    on a file, or files, or you can use it as a filter in a pipeline.


    It is best to enclose search strings in quotes to avoid shell expansion:


    ```

    grep "this" myfile.txt

    ```

    Show all lines containing "this" in "myfile.txt"


    ```

    ls -1 | grep -c "^\[^A-Z]"

    ```

    Count how many files do not begin with a capital letter


    ## Useful Switches


    | -c | Only print a count of lines which match |

    | :--- | :--- |

    | -f | Don''t show filenames, only matching lines |

    | -l | Don''t show lines, only filenames |

    | -i | Ignore case |

    | -n | Print line numbers |

    | -v | Find lines which don''t match |

    | -w | Only match whole words with the expression |

    | -x | Only match whole lines with the expression |

    | -q | Quiet. No output, for use in shell scripts. Exit status is 0 if any matches
    are found, 1 otherwise. |


    ## Extended Regular Expressions


    Some commands understand a further set of special expression characters. These
    commands are “egrep” and “gawk”.


    ## Egrep


    Egrep stands for extended grep and works in a similar way to grep. Grep can be
    used with the “-e” switch instead.


    ## Gawk


    This is the GNU/Linux version of the standard Unix tool “awk” which is a scripting
    language used for text file processing. See the on-line documentation for more
    information about awk.


    ## Special Characters


    These characters will not work in “vi” but will work in “egrep”:


    - + Match one more

    - ? Match zero one

    - | Means “or”

    - ( ) Used to group

    - + Match one more

