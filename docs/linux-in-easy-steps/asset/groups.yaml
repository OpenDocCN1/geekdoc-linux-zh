    # # What is the Shell?


    A shell is a special program which gives you the familiar text mode prompt. You
    can use it to start other programs and it understands some special commands of
    its own. Sometimes these special commands are combined into a file which can be
    run all at once, in sequence. We call this a shell program or script.


    # ## Different shells


    There are several different shell programs in use in Linux. They have many similarities
    but there are differences in the way they interact with the user and the commands
    they understand. The original shell was called "sh", or simply "sh". The program
    to run this is in the "/bin" directory. Current Linux distributions still have
    "/bin/sh" but it is often a link to another shell. The most common shell in Linux
    today is called Bash, which stands for Bourne Again Shell, after the popular Bourne
    shell. Bash has more advanced features than the original Bourne shell and it is
    more user-friendly.


    A shell very popular with programmers is called the C shell. Linux has its own
    version "tcsh". This shell has more advanced shell-programming features and a
    different syntax for some operations.


    There are other shells such as the Korn shell (ksh) and Wish or Windowing shell,
    which has simple graphical capabilities. Here we will concentrate on Bash as it
    is a popular shell and the default for most users.


    Whenever you log on to a text console a shell is started automatically. In X you
    can start a shell by running a terminal window (such as Xterm, or Kterm in KDE).
    FVWM2 has a menu item to start a new shell which opens up a terminal window.


    If you want to start a new or different shell you can just type its name.'
