  - "[PAGE 1]\n\n# Commands\n\n# The X Window System\n\n| ls | Directory listing |\n\
    | ls -l | Long listing |\n| ls -a | Show hidden files |\n| cd dir | Change to\
    \ directory |\n| pwd | Show current directory |\n| cat files | Display or concatenate\
    \ file(s) |\n\n| startx | Enter the X Window System |\n| xset | Control the X\
    \ environment |\n| xterm | X terminal window |\n| xfm | The X filenamager |\n\
    | xedit | Text Editor |\n\n| cp source dest | Copy file and directories |\n| cp\
    \ -a source dest | Copy files and directories recursively, preserving attributes\
    \ |\n\n| mv oldname | Rename or move |\n| newname | file(s) |\n| rm files | Delete\
    \ file(s) |\n| mkdir dir | Make directory |\n| rmdir | Remove directory |\n\n\
    | find -name value | Find files named, starting from directory dir |\n| man command\
    \ | View online manual for command |\n\n| man -k keyword | Find manual pages related\
    \ to keyword |\n| grep string files | Find string in file(s) |\n| chmod attributes\
    \ | Change protection attributes of file(s) |\n| Ctrl+D or exit | Logout or exit\
    \ shell |\n| shutdown -r time | Shutdown and reboot |\n| shutdown -h time | Shutdown\
    \ and halt system |\n\n| The Vi Editor |\n| Ctrl+U, Ctrl+D | Cursor movement left,\
    \ up, right, down |\n| 0 | Scroll up and down screen |\n| $ | Go to end of line\
    \ |\n| : | Go to last line |\n| n | Go to line n |\n i | Insert at cursor |\n\
    | A | Append to end of line |\n| R | Replace characters |\n| O | Insert line below\
    \ |\n| ESC | Insert line above |\n| x | Leave insert mode |\n| dw | Delete character\
    \ |\n| dd | Delete line |\n| p (lower case) | Yank (copy) or deleted lines below\
    \ cursor |\n| P (upper case) | Put yanked or deleted lines above cursor |\n| /string\
    \ | Find string forwards |\n| ?string | Find string backwards |\n| n | Find next\
