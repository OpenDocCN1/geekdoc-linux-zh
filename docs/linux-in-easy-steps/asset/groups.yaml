    You might want to show usage in all directories but not any additional ones you
    have mounted. Use the “--one-file-system” option for this:


    ```

    du --one-file-system

    ```


    While “du” shows how much disk space has been used, it is sometimes more useful
    to know how much space you have left. The command to do this is “df”, it stands
    for Disk Free:


    ```

    [fred@localhost fred]$ df

    Filesystem 1024-blocks Used

    Available Capacity Mounted on

    /dev/hda7 497667 216255

    255710 46% /

    /dev/hdb5 4088540 615336

    3473204 15% /drivef/

    ```


    You can give “df” a disk name to report on, otherwise it shows all mounted disks.
    Alternatively you can give it a directory name and it will show the disk which
    that is on. You can see above that “df” also shows the percentage of the disk
    which is used up.'
- md: '

    # Virtual Memory and Swap Files


    Virtual memory is the name given to the memory which the operating system gives
    the impression you have. By constantly swapping “pages” from real memory to disk
    and back, it enables you to run many more programs or to open large data files.


    The area of disk used for this is called “swap” and is usually given a partition
    to itself. You may have done this when you installed Linux, by specifying a partition
    type as “swap”.


    ## Controlling Swap

    You can enable a swap device using the “swapon” command, and disable with “swapoff”:


    ### Using a swap file

    You can create a special file and use that instead of a disk partition. The file
    should be at least the size of your RAM, unless you have more than 64 Megabytes,
    in which case 64M swap should be enough.


    - Create an empty swap file with the “dd” command (Be careful to get this command
    exactly right)


    ```

    dd if=/dev/zero of=/swap bs=1024 count=32768

    ```


    | Number of blocks (this gives a 32M swapfile) | Swapfile name | Block Size=IK
    |

    | :--- | :--- | :--- |


    - Make swap space in this file: mkswap /swap 32768

    - Ensure the disk is synchronised with its cache: sync

    - Enable swapping to this file: swapon /swap


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_156_0.png)


    # Looking at Files


    We have seen how to edit a file with "vi" but what about just examining the contents
    without the possibility of changing it? There are several ways; the simplest is
    to use "cat" which just writes the file to the screen. Unfortunately this is not
    always useful, especially for a large file.


    ## Head and Tail


    These two commands allow you to see just the first few lines of a file or just
    the end. For example, to see the top 4 lines of this "ls" command:


    ```bash

    $ls -l /usr/lib | --lines=4

    total 4216

    lrwxr-xr-x 1 root root 16 Mar 21 15:48 X11 -> ../X11/lib/

    -rw-r--r 1 root root 1024 Sep 10 1998 cracklib_dict.htwm

    -rw-r--r 1 root root 214266 Sep 10 1998 cracklib_dict.pwd

    ```


    We, "head" is being used as a filter however this is not necessary. You can use
    "head" and "tail" on normal files too. A very common use of "tail" is to look
    at the end of a system log file:


    ```bash

    $ tail /var/log/dmesg

    FDC 0 is a National Semiconductor PC87306

    md driver 0.36.3 MAX_MD_DEV=4, MAX_REAL=8

    scsi : 0 hosts

    scsi : detected total.

    Partition check:

    hda: hda1 hda2 < hda5 hda6 hda7 > hda8 > hda3 hda4

    ddb: hdb1 hdb2 < hdb5 hdb6 hdb7 > hdb3 hdb4

    dd: 98304kB, 32/64 CHS, 4096 kBPs, 512 sector size, 2941 rpm

    hdd: no media in the drive

    VFS: Mounted root (ext2 filesystem) readily.

    ```


    A useful feature of tail is to continuously monitor the end of an output file.
    Use "tail -f" (for follow) to achieve this and interrupt it with Ctrl+C.


    # Both "more" and "less" can be used on their own with a filename, or as a filter.
    To use as a filter: "pipe" to the output of another command with "|".


    You can page through a file with the "more" command which works like "man". Press
    Space to go forward, b to go back, and q to quit.


    "More" is quite limited and Linux has its own more advanced version called "less".
    "less" understands all the commands which "more" does and others, including scrolling
    left and right (with the cursor control keys), and setting bookmarks and return
    to the man. The man page for "less" shows the full set and some of the most useful
    are listed below:


    | Return | |

    | :--- | :--- |

    | Move forward one line | |

    | y | Move back one line | |

    | Space | Move forward one page |

    | b | Move back one page |

    | q | Quit |

    | /string | Find string, looking forwards |

    | n | Find next occurrence |

    | ?string | Find string, looking backwards |

    | N | Find next backwards |

    | /string | Find next line which doesn''t contain |

    | g | Go to beginning of file |

    | G | Go to end of file |

    | nnp | Go to nn percent through the file |

    | m/letter | Mark current position with letter |

    | ''letter | Jump to mark letter |

    | e filename | Edit new file given by filename |

    | (or or { | Find corresponding closing ), ], or { |

    | )or or { | Find corresponding opening (, [, or { |


    # More about Disks and Files


    We saw earlier in the book how we access disks and files. How is the filesystem
    created?


    ## Disk Formatting

    Disks are formatted with the "mkfs" or "make filesystem" command. The command
    is a front end to several others, depending on which type of filesystem you are
    to create. The syntax is:


    ```bash

    mkfs -t type [options] device [blocks]

    ```


    The options are specific to the type being created. You can specify these options:

    - -c Check for bad blocks

    - -l Get list of bad blocks from filename

    - -v Verbose output


    Generally you don''t need any of these. Also, formatter can work it out.


    ### Example

    ```

    mkfs -t ext2 /dev/db1

    ```


    ## Checking Filesystem

    The "fsck" command will check the integrity of a filesystem, and repair any errors.
    Use it like this:


    ```bash

    fsck [options]

    ```

    If the device is omitted you must specify -A option which means check all filesystems
    listed in "/etc/fstab" file. If you add -R option the root filesystem will not
    be checked. You can also specify a type with "-f". This will make sure only filesystems
    of that type are checked.


    ## Soft and Hard Links

    A link is an alternative name for an existing file. It does not make a copy of
    the file but adds a new entry on the same disk. Links can be hard or soft. A hard
    link must exist twice, although the data is stored only once. If you delete the
    file, both entries are actually deleted.


    Create a hard link like this:

    ```bash

    ln existingname(s) newname

    ```


    ### Creating Soft Links

    A soft link is also known as a symbolic link. The link can span across disks and
    is visible in "ls -l". In contrast to an ordinary user you can create a link to
    a directory and if the existing file is removed the link remains. Create a soft
    link with the "-s" option, like this:


    ```bash

    ln -s existingname(s) newname

    ```


    Symbolic links are frequently used to give a file or directory a generic name,
    even though the real file or directory may change. For example:

    - Linking /dev/cdrom to /dev/hdd (Special device)

    - Linking /usr/X11/bin/X to X_svga (X server)


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_160_0.png)


    # The Date Command

    The "date" command is used to find out the current system date and/or time. The
    simplest form just displays the date and/or time:


    ```bash

    date

    Fri Dec 31, 1999 12:20

    ```


    ## Formatting the date and time

    A useful form of the command allows you to specify the format used in the output:
    sign indicates format. Special formatting characters:


    ```bash

    date +"The time is %H:%M"

    The time is 17:45

    ```


    ## Some format characters are:


    | | |

    | :--- | :--- |

    | %a | Abbreviated Day of Week |

    | %b | Abbreviated Month name |

    | %m | Month 01-12 |

    | %p | AM or PM |

    | %y | Two-digit year |

    | %U | Day of month 01-31 |

    | %A | Day of Week full name |

    | %B | Month full name |

    | %H | Hour 00-23 |

    | %I | Hour 01-12 |

    | %M | Minutes 00-59 |

    | %S | Seconds 00-59 |

    | %Y | Four-digit year |

    | %W | Week number 00-53 |


    > For the full list of formats see the man page for "date".


    There are some other options you can put in the format string which you can use
    to affect the look of the final output.


    | | |

    | :--- | :--- |

    | %% | Percent sign |

    | %%n | Newline |

    | %%t | Tab character |

    | - | Don''t pad with zeros |

    | - | Pad with spaces instead of zeros |


    The formatted output version of the date command can be useful to get the date
    or time into another command, for example to assign a variable for later use:


    ```bash

    DATE_AND_TIME=`date +%U%m%Y %H:%M:%S`

    echo $DATE_AND_TIME

    31121999 12:20:45

    ```

    Back-quotes to get the output of the date command into the shell variable


    ## Setting the time and date

    The date command can also be used to set the time. The command is:


    date -s MMddhmmyy[.ss].


    For example, to set the date and time to 09:00 on 31 December 1999:


    ```bash

    date -s 1231090099

    ```

