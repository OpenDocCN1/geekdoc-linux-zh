    ## Setting Up Loadlin


    Loadlin is a fairly simple procedure to set up and allows Linux to be started
    from a Windows session.


    > **Your Linux disk may call the kernel a different name, e.g, "Linux", and this
    file and "loadlin.exe" may be in another directory, e.g. "install".**


    Create a directory called Linux on your C: drive and copy the Linux kernel and
    the loadlin.exe file from your Linux boot disk into:


    ```

    mkdir c:\linux

    copy g:\autoboot\vmlinuz c:\linux

    copy g:\dosutils\loadlin.exe c:\linux

    ```


    > **If you are not using the original kernel from the installation disk, you could
    use "mcopy" to copy it from Linux to your Windows disk via a floppy disk, or even
    mount your Windows partition and copy it directly.**


