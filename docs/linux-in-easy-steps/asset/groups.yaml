    \n如果你想检查一个条件或另一个条件是否为真，可以使用 \"-o\" 表示“或”。你也可以使用 \"-a\" 表示“与”。如下所示：\n\n```bash\n\
    if [ -r thefile -a -w thefile ] ; then\n    echo \"file is readable and writeable\"\
    \nfi\n```\n\n## \"For\" 循环\n\n如果你想执行特定次数的某个操作，可以使用 “for” 循环。“for” 命令会遍历文件名或其他单词的列表，并对其中的每一项执行命令。\n\
    \n例如：打印每个名为 something.txt 的文件，并将其重命名为以 .printed 结尾。\n\n```bash\nfor file in *.txt;\
    \ do\n  lpr $file\n  mv $file $file.printed\ndone\n```\n\n列表非要是文件名。它可以是来自另一个命令的单词，也可以是文件的内容。\n\
    \n例如：将 “ls” 帮助页中的每个单词复制到 “wordlist.dat”，然后对其排序并去重。\n\n```bash\nfor word in `man\
    \ ls`; do\n  echo $word >> wordlist.dat\ndone\nsort -fd wordlist.dat | uniq\n\
    ```\n\n## C shell\n\n在 “tcsh”（C shell 的 Linux 版本）中，“for” 命令被 “foreach” 命令取代。语法略有不同。\n\
    \n例如：打印所有 “.dat” 文件，每个文件前加上 “header.txt”。\n\n```bash\nforeach file ( *.dat )\n\
    \  lpr header.txt\n  lpr $file\nend\n```\n\n## 返回码\n\n![](img/f2019df07bd67d0d681c)\n\
    \n每个运行的程序都会向 shell 返回一个状态码。你可以使用特殊变量 $? 来检查此状态。0 表示成功，任何非零值表示错误。\n\n要查看最后运行命令的退出状态，只需\
    \ echo $?。\n\n| 状态 | 含义 |\n| :--- | :--- |\n| 0 | 成功 |\n| 非零 | 错误 |\n\n程序可以使用\
    \ exit 命令以特定的状态码退出：\n\n```bash\nexit 1\n```\n\n![](img/f2019df07bd67d0d681c)\n\
    \n如果你想检查命令是否失败，可以在 \"if\" 语句中使用 $?：\n\n```bash\nif [ $? -ne 0 ]; then\n  echo\
    \ \"Error in command\"\nfi\n```\n\n## Getopts\n\n某些程序接受形式命名的参数和选项，例如 -x 或 -P printer。为了更方便地处理此类选项，请使用\
    \ \"getopts\" 命令。每次调用时，它都会给你下一个选项和参数（如果有的话）。\n\n要使用它，创建一个包含所有可能选项的 shell 变量。必须带有参数值的选项后跟一个冒号：\n\
    \n## 示例\n\n```bash\nOPTS=\"abc\"\ngetopts $OPTS NEXT\n```\n\n接受 -a、-b 和 -c 带有参数。\n\
    \n"
