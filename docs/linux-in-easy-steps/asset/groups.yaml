    \ head and tail on normal files. A very common use of tail is to look at the end\
    \ of a system log file: \n\nWe, \"head\" is being used as a filter however this\
    \ is not necessary. You can use \"head\" and \"tail\" on normal files too. A very\
    \ common use of \"tail\" is to look at the end of a system log file:\n\n```bash\n\
    $ tail /var/log/dmesg\nFDC 0 is a National Semiconductor PC87306\nmd driver 0.36.3\
    \ MAX_MD_DEV=4, MAX_REAL=8\nscsi : 0 hosts\nscsi : detected total.\nPartition\
    \ check:\nhda: hda1 hda2 < hda5 hda6 hda7 > hda8 > hda3 hda4\nddb: hdb1 hdb2 <\
    \ hdb5 hdb6 hdb7 > hdb3 hdb4\ndd: 98304kB, 32/64 CHS, 4096 kBPs, 512 sector size,\
    \ 2941 rpm\nhdd: no media in the drive\nVFS: Mounted root (ext2 filesystem) readily.\n\
    ```\n\nA useful feature of tail is to continuously monitor the end of an output\
    \ file. Use \"tail -f\" (for follow) to achieve this and interrupt it with Ctrl+C.\n\
    \n# Both \"more\" and \"less\" can be used on their own with a filename, or as\
    \ a filter. To use as a filter: \"pipe\" to the output of another command with\
    \ \"|\".\n\nYou can page through a file with the \"more\" command which works\
    \ like \"man\". Press Space to go forward, b to go back, and q to quit.\n\n\"\
    More\" is quite limited and Linux has its own more advanced version called \"\
    less\". \"less\" understands all the commands which \"more\" does and others,\
    \ including scrolling left and right (with the cursor control keys), and setting\
    \ bookmarks and return to the man. the man page for \"less\" shows the full set\
    \ and some of the most useful are listed below:\n\n| Return | |\n| :--- | :---\
    \ |\n| Move forward one line | |\n| y | Move back one line | |\n| Space | Move\
    \ forward one page |\n| b | Move back one page | |\n| q | Quit |\n| /string |\
    \ Find string, looking forwards |\n| n | Find next occurrence | |\n| ?string |\
    \ Find string, looking backwards | |\n| N | Find next backwards | |\n| /string\
    \ | Find next line which doesn't contain | |\n| g | Go to beginning of file |\
    \ |\n| G | Go to end of file | |\n| nnp | Go to nn percent through the file |\
    \ |\n| m/letter | Mark current position with letter | |\n| 'letter | Jump to mark\
    \ letter | |\n| e filename | Edit new file given by filename |\n| (or or or {\
    \ | Find corresponding closing ), ], or { |\n| )or or { | Find corresponding opening\
    \ (, [, or { |\n\n# More about Disks and Files\n\nWe saw earlier in the book how\
    \ we access disks and files. How is the filesystem created?\n\n## Disk Formatting\n\
    Disks are formatted. Disks are formatted with \"mkfs\" or \"make filesystem\"\
    . There are many types of filesystems. The most common for Linux are ext4, xfs,\
    \ vfat, btrfs, ext3, ext2, j2fs, and swap.\n\nTo format a partition, use the `mkfs`\
    \ command. For example, to format a partition as an ext4 filesystem:\n\n```bash\n\
    mkfs.ext4 /dev/sdb1\n```\n\nTo format a partition as an xfs filesystem:\n\n```bash\n\
    mkfs.xfs /dev/sdb1\n```\n\nTo format a partition as a vfat filesystem (often used\
    \ for USB drives and EFI partitions):\n\n```bash\nmkfs.vfat /dev/sdb1\n```\n\n\
    To format a partition as a btrfs filesystem:\n\n```bash\nmkfs.btrfs /dev/sdb1\n\
    ```\n\nTo format a partition as an ext3 filesystem:\n\n```bash\nmkfs.ext3 /dev/sdb1\n\
    ```\n\nTo format a partition as an ext2 filesystem:\n\n```bash\nmkfs.ext2 /dev/sdb1\n\
    ```\n\nTo format a partition as a j2fs filesystem:\n\n```bash\nmkfs.j2fs /dev/sdb1\n\
    ```\n\nTo format a partition as a swap partition:\n\n```bash\nmkfs.swap /dev/sdb1\n\
    ```\n\nAfter formatting a disk, you need to mount it to use it. You use the `mount`\
    \ command. For example, to mount `/dev/sdb1` to the `/mnt` directory:\n\n```bash\n\
    mount /dev/sdb1 /mnt\n```\n\nTo unmount a disk, use the `umount` command:\n\n\
    ```bash\numount /mnt\n```\n\nTo make a disk mount automatically at boot, you must\
    \ add an entry to the `/etc/fstab` file. Each entry should contain the device\
    \ (name or UUID), the mount point, the filesystem type, options, and the pass\
    \ number.\n\nExample entry in `/etc/fstab`:\n\n```\n/dev/sdb1  /mnt  ext4  defaults\
    \  0  2\n```\n\nIt is recommended to use the UUID of the device instead of the\
    \ device name, as device names can change. You can find the UUID using the `blkid`\
    \ command:\n\n```bash\nblkid\n```\n\n## Checking Filesystem\nOnce a filesystem\
    \ is formatted, you should check it for errors. The `fsck` command is used for\
    \ this. It is important not to check a filesystem while it is mounted. To check\
    \ a partition:\n\n```bash\nfsck /dev/sdb1\n```\n\nThe `fsck` command can also\
    \ be used to repair errors automatically:\n\n```bash\nfsck -y /dev/sdb1\n```\n\
    \n## Resizing Filesystems\nSometimes you need to resize a filesystem. The `resize2fs`\
    \ command is used for ext4 filesystems. To expand an ext4 filesystem to fill the\
    \ partition:\n\n```bash\nresize2fs /dev/sdb1\n```\n\nTo shrink an ext4 filesystem:\n\
    \n```bash\nresize2fs /dev/sdb1 10G\n```\n\n(Note: Shrinking a filesystem can be\
    \ risky and should be backed up first.)\n\n"
