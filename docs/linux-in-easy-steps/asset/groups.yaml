    # Adding a User


    Why add a user when, as root, you can do anything on the system? Precisely *because*
    you can do anything.


    It is considered bad practice to use root except when absolutely necessary because
    of the potential for accidental damage. Many important files on the system are
    owned by root and could easily be removed or changed by mistake if you are always
    logged in as root. It is preferable to set yourself up as an ordinary user without
    permission to affect these files.


    The command to add a user is:


    ```

    useradd -m username

    ```


    The "-m" option ensures the home directory is created


    This command must be run as root and will add a user and create a home directory
    for him/her, under the /home branch of the filesystem.


    # To set a password


    If you want to set a password (normal on a multi-user system), log on as that
    user and enter:


    ```

    passwd

    ```


    # To set the password of another user


    Only root can do this. Enter the command like this to another user''s password:


    ```

    passwd username

    ```'
  - '[PAGE 30]


    # Adding Users to Groups


    When you add a user he/she will be added to a group. Which group depends on your
    Linux setup. RedHat Linux by default will create a new group with the same name
    as the user and use that. Other versions may require a setting in a file “/etc/useradd.conf”.
    In any case you can specify the initial login group with the “-g” option.


    For example, to create user “fred” and add him to group “users” issue:


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_30_0.png)


    To prevent RedHat Linux from creating a name as the user, use the “-n” switch
    on the useradd command.


    ```

    useradd -g users fred

    ```


    # Multiple Groups


    You can also specify additional groups by using the “-G” switch. To create the
    same user, but add him to the groups “games” and “ops” use this command:


    ```

    useradd -g users -G games,ops fred

    ```


    This type of thing can be useful for controlling access to certain commands or
    files.


    # Existing Users


    If you want to add a user who already exists to a new group, perhaps to reflect
    his or her new status, you can use the usermod command to modify the user settings.
    This command takes the same switches as the user:


    ```

    usermod -g users -G games,ops,admin fred

    ```


    # Creating Groups


    To create a new group, use the “groupadd” command. The syntax is very simple,
    just what you would expect.


    For example, to create the group “ops”:


    ```

    groupadd ops

    ```'
