    # Directories and the Filesystem


    In common with other Unix systems and many other operating systems, Linux disks
    are organised into a logical tree structure formed of directories. Each directory
    is a container which can hold files (programs or data) and other directories.
    A directory held within a directory is sometimes known as a subdirectory. The
    base of the tree is known, not unreasonably, as the root. This is represented
    by the / (slash) symbol. The following diagram shows part of the Linux filesystem
    (starting from the root) and shows some common directories found within it:


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_17_0.png)


    Directories are sometimes folders.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_17_1.png)


    Some root level directories found on all Linux systems are:


    +   - /bin – contains executable programs ("binary") files which make up the commands
    of the operating system.

    - /boot – contains files related to booting the system, including the Kernel image
    itself (the core of the operating system which is loaded at boot time).

    - /dev – used for special files which represent devices on the system. Contained
    in this directory are files representing each hard disk and partition on the system,
    each serial and parallel port, mouse interface and all other devices.

    - /etc – this is a sort of “miscellaneous” directory which holds all kinds of
    files related to all kinds of things. Many system configuration files are in here
    such as the file which controls the X window server and local area network configuration
    files.

    - /home – contains the home directories of users on the system. That is, the directory
    a user finds when he logs on, and in which he has full ownership permissions.

    - /lib – libraries (shared program files) used by programs and the operating system
    are in this directory.


