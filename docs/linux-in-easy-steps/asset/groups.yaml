    # Sending mail with Mail and Sendmail


    It is also possible to use Mail to send messages. They are actually sent by a
    program called “sendmail” which is normally running in the background all the
    time (as a daemon).


    # Configuring Sendmail


    The first point to make is that the Mail/Sendmail combination will send mail with
    a From: address of your Linux login name@your Linux hostname. Make sure your Linux
    username is the same as your email username or people won’t be able to reply properly.


    Sendmail is configured with a file “/etc/sendmail.cf”. This file is quite complicated
    but there are really only two entries you need to set. The first is called the
    “Domain to Masquerade as”. This means the name of your internet mail address (not
    including the user or parts). Edit this file and find a line which begins DM.
    It may have a comment about masquerading over. Enter your email host and domain
    name:


    ```

    DMmyhost.isp.net

    ```


    Put your own email hostname here


    Next you have to enter the name of your ISP’s SMTP server. This is the computer
    which you send mail to for forwarding to the recipient. (Don''t confuse this with
    the POP3 server you get mail from.) It is labelled DSsmtp:


    ```

    DSsmtp.isp.net

    ```


    Put your own ISPs mail sending server here


    # Sending mail


    To actually send a message, use the Mail command:


    ```

    mail -s subject fred@somedomain.net

    Hi Fred

    EOT

    ```


    press Ctrl+D to send the mail'
