    # ...cont''d


    You can see all processes on the system by adding the "a"

    and "x" options:


    ```

    [fred@localhost fred]$ ps ax

    PID TTY STAT TIME COMMAND

    1 ? S 0:02 init

    2 ? SW 0:00 (kflushd)

    3 ? SW 0:00 (kswapd)

    4 ? SW 0:00 (md_thread)

