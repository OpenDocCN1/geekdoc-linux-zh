    - 1. Enter the name of the file(s) to find here

    - 2. Enter the directory to start the search in

    - 3. Check to search subdirectories too

    - 4. Advanced search options are on the other tabs

    - 5. Files found are underneath and may be opened by clicking on their names


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_92_2.png)


    ## The KDE CD Player


    This application is called "KSCD" and allows you to play audio CDs through your
