    当 Linux 系统启动时，根文件系统会自动挂载。然后，它会查找 `fstab` 文件以确定需要挂载哪些其他文件系统。它们可以是：Linux 格式 (ext2)、其他格式（如
    DOS 或 Windows）、如软盘或 CD-ROM 类的可移动磁盘，或者特殊文件系统。


    所有在标志（flags）字段中未标记为“noauto”的文件系统都将被挂载。如果某条目包含“readonly”，则你将无法删除或更改该目录或子目录中的文件。


    所有自动挂载的 Linux 磁盘或分区在挂载时都会进行检查。


    ## 特殊文件系统


    `fstab` 中的某些项指向特殊文件系统。其中显而易见的是“swap”项。这甚至不是一个文件系统，它只是操作系统用作临时内存存储的磁盘区域。这允许同时运行更多的程序。因为它不是文件系统，所以“swap”项没有挂载点。


    “proc”是这里的另一个特殊文件系统。它是一种文件系统，但它并不位于任何真实的磁盘上，而是操作系统在运行时创建的。挂载点是“/proc”，如果你查看这个目录，将看到许多描述
    Linux 系统当前状态的文件。


    ## 访问 Windows 文件


    虽然 Linux 与 Windows 完全不同的操作系统，且无法运行 Windows 程序（至少在没有额外软件的情况下），但你可能想从 Linux 内部访问
    Windows 磁盘上的文件。


    你可以像挂载其他磁盘一样挂载 Windows 磁盘，将其纳入 Linux 文件系统的树状结构中，并正常地访问文件和文件夹（目录）。


    Windows 分区将 FAT 或 FAT-32 格式。在 Linux 中，两者都被称为 "vfat"。


    如果你的 Windows 磁盘是 PC 上的第一块硬盘（通常如此），分区名称将是 "/dev/hda1"。


    ### 挂载 Windows 磁盘


    - 1 找出：分区的 Linux 名称、文件系统类型 (vfat) 和挂载点。

    - 2 如果你尚未创建，请创建挂载点目录。


    ```

    mkdir /windows

    ```


    - 3 或者使用 `mount` 命令：


    ```

    mount -t vfat /dev/hda1 /windows

    ```


    - 4 或者将该项添加到 `fstab` 文件中：


    ```

    /dev/hda1 /windows vfat defaults 0 0

    ```


    如果你使用了 `mount` 命令，将在 "/windows" 目录中找到你的 Windows 文件。如果你留给 `fstab` 处理，则需要重启才能看到它们。


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_37_0.png)


    36 Linux 快速入门


    ## CD-ROM 和软盘


    CD、软盘和其他可移动磁盘在使用之前也必须挂载。然而，它们与固定磁盘分区不同，因为你很少希望它们在启动时自动挂载，因为磁盘通常不在驱动器中。


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_38_0.png)


    在移除磁盘之前务必使用 "umount"，否则可能会丢失数据。


    要挂载可移动磁盘，我们需要在需要时使用 "mount" 命令，在完成并在移除磁盘之前使用 "umount" 命令。

    为了方便方便，我们可以利用 `fstab` 项中的一些额外选项：


    - "user" 允许普通用户挂载磁盘

    - "noauto" 防止磁盘在启动时被挂载


    如果我们不想让磁盘自动挂载，为什么还要在 `fstab` 文件中添加一项呢？因为我们可以使用简单得多的 "mount" 命令版本。


    ### 自动挂载软盘


    将此行添加到 "/etc/fstab"：


    ```

    /dev/fd0 floppy auto user,noauto 0 0

    ```


    2 使用此命令挂载它：不要让用户自动挂载


    ```

    mount /floppy

    ```


    3 当你完成后，使用此命令卸载：


    ```

    umount /floppy

    ```


    由于 "/etc/fstab" 中有该项，任何用户都可以挂载磁盘（而不只是 root，即超级用户），并且我们能够使用极极形式形式的 "mount"。`fstab`
    填补了缺失的细节——设备、文件系统类型等。


