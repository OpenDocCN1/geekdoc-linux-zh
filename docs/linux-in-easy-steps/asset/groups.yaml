    # Cut, Copy and Paste


    Vi has some commands for removing lines, and for pasting

    them back in. You can also make a copy of some lines for

    duplication elsewhere.


    # Cutting out text


    The command to remove a line is "dd". Generally, all Vi

    commands can be repeated a number of times by preceding

    the command with that number.


    To remove 5 lines, enter


    ```

    dd

    ```


    The lines removed may be discarded, or pasted at

    another point in the file.


    You can also delete words, with the "dw" command.

    Pasting (below) will paste in the word(s) removed.


    # Pasting commands


    | p | Insert line(s) below current line |

    | P | Insert line(s) above current line |


    Copying lines, without removing them, is done with the

    "Yank" command. Press "Y" to yank one line, or nY to

    yank n lines. The lines pulled into the yank buffer may be

    inserted using paste commands as above.'
