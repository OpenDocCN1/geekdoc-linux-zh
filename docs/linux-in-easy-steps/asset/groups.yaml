    # Why Reconfigure the Kernel?


    The Linux Kernel is the part of the operating system that provides the “glue”
    between the PC’s hardware and user programs, including your shell. There are many
    options for different types of hardware and it doesn’t make sense for all to be
    contained within the kernel as it would waste a lot of memory and disk space.


    Instead, a typical distribution kernel will have built-in support for many of
    the most common common hardware devices. You can tailor this to your specific
    needs.


    Other reasons for rebuilding the kernel are; to enhance performance by fine-tuning,
    or to upgrade to a new version.


    Kernel options can be compiled into the kernel – this means the relevant software
    is permanently in the memory. They can also be compiled as modules, which means
    that the software driver is loaded only when needed. This allows some memory to
    be saved and reduces the size of the kernel on disk. It is sensible to configure
    as many options as possible as modules, except for those which are needed at boot
    time or for which it would be inefficient.


    # Required packages


    Before you start to reconfigure the kernel you must make sure you have the development
    tools installed. You need GNU C compiler and development tools and the standard
    libraries. Additionally you will need the kernel sources. The full list you need
    is:


    +   - kernel-headers In “Glint” you will find this in the “Base/Kernel” group.

    - kernel-source Also in the “Base/Kernel group"

    - gcc In the “Development/Languages” group

    - glibc-devel In “Development/Libraries”

    - bin86 In “Development/Languages”

    - make In “Development/Building”'
- md: '

    # Config and Menuconfig


    You can configure the kernel with one of three commands. You need to answer a
    series of questions or set the modules and options you would like to configure
    into the kernel. The most basic is with the command "make config".


    ```

    # make config

    rm -f include/asm

    ( cd include ; -ln sf-asm-i386 asm)

    /bin/sh scripts/Configure arch/i386/config.in


    # Using defaults found in .config


    # Code maturity level options


    # Prompt for development and/or incomplete code/drivers (CONFIG_EXPERIMENTAL [N/y?])
    n


    # Processor type and features


    Processor family (386, 486/Cx486, 586/x5/x86/6x86, Pentium/K6/TSC, PPro/6x86MX)
    [PPro/6x86MX] 6x86

    ```


    Answer all the questions


    A much nicer way is to use "make menuconfig", which provides text-based windows
    and menus. It is shown here in a terminal window in X, but it can just as easily
    run from a text console:


    To use "menuconfig-fig" you must have the "ncurses-devel" package installed. In
    "Glint" this can be found under the "Development/libraries" section.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_172_0.png)


    Choose a section by scrolling up and down with the cursor keys.


    Move between fields with the Tab key, and select by pressing Enter.


    In each section, select an item to include it in the Kernel.


    In some items you must enter values.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_172_1.png)


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_172_2.png)


    # Using Xconfig


    If you have "X" the best way to configure the kernel is to use "make config".
    This will give you a fully graphical menu system for selecting the options you
    want to include in the Kernel. When you enter the command (in X) you will see
    the following on your terminal screen:


    ```

    [root@gnasher /root]# cd /usr/src/linux

    [root@gnasher linux]# make xconfig

    rm -f include/asm

    # # cd include; ln -sf asm-i386 asm

    make -C include kconfig.tk

    make[1]: Entering directory ''/usr/src/linux-2.2.2/scripts/''

    gcc -Wall -Wstrict-prototypes -02 -fomit-frame-pointer -c tkparse.o

    tkparse.c

    gcc -Wall -Wstrict-prototypes -02 -fomit-frame-pointer -c tkcond.o

    tkcond.c

    gcc -Wall -Wstrict-prototypes -02 -fomit-frame-pointer -c tkgen.o

    tkgen.c

    gcc -o tkparse tkparse.o tkgen.o

    cat header.tk ..//config.tk

    echo "../i386/config.in" >> kconfig.tk

    echo "set defaults" >> kconfig.tk

    echo "set ARCH "i386"" >> kconfig.tk

    cat tail.tk >> kconfig.tk

    chmod 755 kconfig.tk

    make[1]: Leaving directory ''/usr/src/linux-2.2.2/scripts/''

    wish -f scripts/kconfig.tk

    ```


    Then the main xconfig window will appear:


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_173_0.png)


    Click the button for the section you want to configure


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_173_1.png)


    Click for help about this option


    Click to include this option in the kernel Click to leave this option out Click
    to include as a module (see "Modules")


    Linux in easy steps


    # Building the new kernel


    When you have finished choosing all the options you want in the new kernel, you
    have to save the options and exit the config program. In xconfig click on the
    “Save and Exit” button. In menuconfig select “Exit” then “Yes” in the following
    dialog:


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_174_0.png)


    Select “Yes” to save or “No” to abandon your configuration


    The next stage is to build the list of files which need to be compiled to make
    the kernel.


    ```

    make dep

    ```


    - Next, remove any old files.


    ```

    make clean

    ```


    - And lastly, build the kernel. This command will take some time (up to an hour)
    and will create a compressed kernel image.


    ```

    make bzImage

    ```


    # Modules


    Some parts of the kernel, like certain device drivers, are not required all the
    time from boot-up. In order to save memory, the size of the kernel can be reduced
    by leaving these items out of the kernel and only loading them when required.
    This can be done by specifying M for module in the kernel configuration Certain
    items should never be built as modules, for instance support for ext2 filesystem.
    If you are going to need use of a function, or if you need it at boot time, you
    should not specify it as a module. Otherwise it is a good idea to specify as many
    options as you can because the kernel image size will be reduced.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_175_0.png)


    To use modules make sure you enabled "Loadable Module Support" and "Kernel Daemon"
    when you configured the kernel.


    # Building Modules


    When you have configured and built the kernel you need to compile the modules.
    This is done like this:


    - Build the modules.


    ```

    make modules

    ```


    - Install the modules in their directories.


    ```

    make modules_install

    ```


    - Generate module dependency list so modules depend are loaded correctly.


    ```

    depmod -a

    ```


    - Modules are loaded with modprobe. Unload with rmmod.


    - List loaded modules Instead of entering modprobe it is better to use kmod which
    should be loaded at boot time. This may be the default for your distribution.
    When kmod is running it will automatically load and unload modules as needed.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_175_1.png)


    To see how to pass parameters to modules see "Sound as a module" in the next section.
    Linux in easy steps


    # Example: Enabling sound


    Here you can see a complete example of building the kernel to enable sound in
    Linux.


    - Change to the /usr/src/ directory and, as root, enter make xconfig.


    ```

    # cd /usr/src/linux

    make xconfig

    ```


    - Find and click on the "Sound configuration" button.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_176_0.png)


    - Click to enable sound support.


    - Find your sound card in the list and enable it. Here you can see Sound Blaster
    enabled.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_176_1.png)


    - Enter the configuration parameters in the boxes. Find them out your sound card
    manual, or if you can boot into Windows look at the properties page in the device
    manager.


    - To get help on any item click the button.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_176_2.png)


    - 7 Click on "Main Menu" on the sound configuration, or "Next" if you want to
    configure other items.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_177_0.png)


    - 8 Click "Save and Exit" on the main xconfig menu.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_177_1.png)


    - 9 Rebuild the kernel.


    - 10 Install and test the new kernel as described on the next page.


    ```

    # make dep

    # make clean

    # make bzImage

    ```


    # Sound as a module


    The RedHat version of Linux has a modular sound system. Other distributions can
    use the standard sound drivers as modules. To pass the parameters to a module
    you need to add them to the "/etc/conf.modules" file:


    - Enter parameters - all on one line.


    ```

    alias sound sb

    options sb_io=0x220 irq=7 dma=1 dma16=5

    mpu_io=0x330

    ```


    - To load the module without kmod use modprobe sound.


    "sb" means soundblaster-you need to change to your module. You can find all the
    modules in the "/lib/modules/X.X.XX/misc" directory. Replace "X.X.XX" with the
    version of your kernel.


    # Booting the new Kernel


    Once you have built a new Kernel you will need to try it. It is important you
    don''t throw away your old kernel yet as the new one may not be correct.


    # With Lilo


    If normally you use LILO to boot you will need to add a new section to


    ```

    image=/usr/src/Linux/arch/i386/bzImage

    label=new

    root=/dev/hda3

    read-only

    ```


    Enter this to boot the new kernel New kernel image file


    After changing lilo.conf you have to run Lilo to make it effect. Enter "lilo"
    at the prompt. When you boot you can now enter "new". This will run the new Kernel.
    If it works properly you can copy the kernel image file to the usual location
    and replace your old kernel. Don''t forget to run lilo again.


    After changing "lilo.conf" you must run "lilo" or you won''t be able to boot into
    Linux.


    # With LoadLin


    If you use LoadLin to start Linux from a Windows or DOS session you will have
    to copy it to your C drive to be able to boot. The best way to do this is with
    mcopy, part of the Mtools package. Configure Mtools to recognise drive C and use
    a command like the following:


    ```

    mcopy /usr/src/Linux/arch/i386/bzImage

    C:\bzimage.new

    ```


    Then, in Windows or DOS, copy your LINUX.BAT file which contains the LoadLin command
    to a new file. Change the name of the Kernel file to the one you just copied and
    test it.


