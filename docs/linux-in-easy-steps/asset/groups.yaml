    # # Wildcards


    When entering commands or running programs you sometimes want to specify a range
    of filenames, which the command should act on. An example would be “List all the
    files whose name begins with b”. This is done by using “wildcard” characters in
    the filenames specified to the command. Each wildcard character matches many alternative
    characters.


    +   * Matches any string of characters


    +   ? Matches any single character


    These characters are used in combination with normal characters. So to list all
    files whose name begins with “b”, you could enter:


    ```

    ls b*

    ```


    What actually happens when you enter a wildcard filename is that the shell itself
    expands the wildcard, turning it into a list of matching filenames and passing
    the whole list to the command. If your directory contained two files beginning
    with “b”, such as “bigfile.txt” and “betal.dat”, the above command would be invisibly
    changed to:


    ```

    ls betal.dat bigfile.txt

    ```


    so the ls command shows just those two files. Since the wildcard expansion is
    done by the shell, we can use it for any commands we want to handle a list of
    files. We don''t need to worry about whether the command itself will understand
    the wildcard notation.


    For example, to copy all files from the /home/fred directory into the /home/john
    directory, enter the following:


    ```

    cp /home/fred/* /home/john

    ```


    This works because the cp command accepts a list of files on the command line
    and expects the last one to be a directory name in which to put them.'
