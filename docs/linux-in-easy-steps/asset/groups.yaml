    # 浏览网页


    传统的纯文本网页浏览器被称为 Lynx，它仍然包含在 Linux 发行版中。然而，考虑到现在大多数网页都具有很强的图形化，Lynx 仅适用于浏览程序文档或其他文本文件，因此显得有些过时了。如果你有
    KDE，可以使用 KMF 进行 Web 浏览，尽管它的功能比较有限且不包含 Java。


    最流行的浏览器之一是 Netscape Navigator。它是 Communicator 套件的一部分，正如我们稍后看到的，该套件包含了电子邮件软件，以及网页制作和
    Usenet 新模块。


    Netscape 可能会随你的 Linux 发行版一起提供，否则你可能在杂志附赠的 CD 光中找到它。如果没有，你将需要从 ftp.netscape.com
