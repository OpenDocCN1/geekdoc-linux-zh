    ![](img/f2019df07bd67d0d6801cbad23cc32b8_172_2.png)


    # 使用 Xconfig


    如果你有 "X"，配置内核的最佳方法是使用 "make config"。这将提供一个完全图形化的菜单系统，用于选择你想包含在内核中的选项。当你输入命令（在
