    # Other Mail Software


    It is not necessary to use any special mail software with Linux, as it does come
    with a set of text-mode mail tools.


    # Fetchmail


    Fetchmail is a utility which can check your mail on the remote server and can
    download any waiting messages. They are placed in the standard mail directory
    in your home directory and read using the “mail” program.


    # Configuring Fetchmail


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_108_0.png)


    Change the POP3 server name and the user and password for your internet account.


    +   Create a file in your home directory called “.fetchmailrc", containing these
    lines:


    +   2 Mail server address


    +   3 Protocol for mail communication (usually POP3)


    ```

    poll pop3.demon.co.uk proto pop3

    user fred

    password abcabcdef123

    ```


    +   4 Username for mail server


    +   5 Put the password for the mail server here, or let fetchmail prompt you


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_108_1.png)


    To get mail but leave it on the server “fetchmail --keep”.


    # Running Fetchmail


    Type “fetchmail” to get your mail. To only check messages, type “fetchmail --check”.


    # Reading mail


    Type “mail” to read mail. Pressing Return displays messages one at a time, d deletes
    the message. Enter q to quit from the mail program.


