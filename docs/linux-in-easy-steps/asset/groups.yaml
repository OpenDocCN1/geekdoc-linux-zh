- md: '

    ## Kernel Upgrading


    The kernel can be upgraded either as source or, if a binary package is available
    for your distribution such as an RPM, simply by installing the new package. This
    is easier but less flexible and if you have reconfigured the kernel, you won''t
    have the same configuration after upgrading unless you upgrade the kernel source
    and build that.


    ## Installing a new kernel source tree


    When a new Linux kernel is available the source is made available at http://www.kernel.org.
    this is the main Linux website and contains links to local mirror sites. You might
    also find the kernel source on a CD-ROM.


    The source is normally a gzipped tar package which needs to be uncompressed in
    the "/usr/src" directory:


    - Copy the tar file to the /usr/src directory and cd to this directory

    - Extract the files xvzf linux-2.2.5.tar.gz


    ```bash

    tar xvzf linux-2.2.5.tar.gz

    ```


    The directory "/usr/src/linux" is a link to the actual kernel source directory.
    Remake this link for the new version


    ```bash

    rm linux

    ln -s linux-2-2-5 linux

    ```


    Remove the old link Remake the link for the new version


    ![](img/f2019df07bd67d0d6801cbad23cc32b_179_0.png)


    ## Applying a Patch


    Because the kernel source is so big, increments in versions are released as patch
    files, which just contain the differences between the old and the new. To apply
    a patch, copy the patch file to "/usr/src" and cd to this directory, then apply
    the patch:


    ```bash

    bunzip2 patch-2.2.5.bz2

    patch < patch-2.2.5

    ```


    Uncompress patch Apply patch


    ## Getting On-line Help


    In this chapter we will see how to use the on-line manual to find out about Linux
    commands. You will learn about the Linux HOWTO database and where to get more
    information when you need it.


    ## Covers


    - The man command | 180

    - Info pages | 182

    - Getting Quick Help | 183

    - The Linux HOWTOs | 184

    - Package Documentation | 185

    - Other Sources of Information | 186


    ## The man Command


    It''s easy to get help on any Linux command as the entire manual is on-line, accessible
    from your hard disk. Included are manual pages for all user commands, system administration
    commands, file formats and for Linux programmers, run-time library functions and
    system calls.


    To view the entry for a particular command:


    - Enter man command

    - Press Return to scroll up a line, space for next page, and q to quit


    | CAT(1) | |

    | --- | --- |

    | NAME | cat - concatenate files and print on the standard output |

    | SYNOPSIS | cat [-benstuVAET] [-number] [-number-nonblank] [-squeeze-blank] [-show-nonprinting]
    [-show-ends] [-show-table] [-show-all] [-help] [-version] [file...] |

    | DESCRIPTION | This documentation is no longer being maintained and may be inaccurate
    or incomplete. The TexInfo file documentation is now the authoritative source.
    |


    This manual page documents the GNU version of cat. cat writes the contents of
    each given file, or the standard input if nodes are given or when a file named
    ''-'' is given, to the standard output.


    Name and brief description Longer description


    If you want to search for a word, press / then you type the word and press Return.


    The on-line manuals are organised into 7 sections. The sections are numbered like
    this:


    | 1 | User Commands |

    | 2 | Kernel system calls |

    | 3 | Standard library functions |

    | 4 | Special files |

    | 5 | File format information |

    | 6 | Games |

    | 7 | Miscellaneous |

    | 8 | System administration commands |

    | 9 | Non-standard kernel routines |


    Sometimes an entry appears in more than one section. The full name of a manual
    entry includes the section number in parentheses, for example *ls(3)*.


    When a word has an entry in more than one manual section you can tell the man
    command which section you want to see by entering the section number before the
    entry name on the man command.


    For example *kill* is both a user command and a system call for programmers. To
    see the user command enter:


    ```bash

    man 3 kill

    ```


    What do you do if you don''t know the name of the *man* entry?


    Using "*man -k keyword*" will find pages which contain the keyword in their list
    of keyword entries.


    **For more information about man use the command man man.**


    ## Info pages


    Many commands have more information available in the form of “Info” pages. These
    pages are browsable like man, although more advanced with hyperlinks between sections.
    In some cases the Info documentation is stated to be more up to date than the
    corresponding man page, although I have yet to find a man page which contains
    inaccurate information.


    To view an Info page on the cp command enter:


    ```bash

    info cp

    ```


    If you leave off the command name you will see an introductory page.


    Info pages are organised “nodes”. One node is a set of pages about a single topic.
    You can move through the pages of one node with the following keys:


    - Space Next Page

    - DEL Previous page


    Nodes form a chain with each node, other than the first and last in a chain, having
    a previous and a next node. Move to the previous node by pressing p and the next
    by pressing n. Pressing b takes you to the first node in the chain and e the last
    in the chain.


    Some pages contain menus. Menu items appear with an asterisk like this:


    - * Item


    To select a menu item press m then type the name of the menu item when asked.


    You can see a full list of command keys by pressing ? and to quit from the info
    viewer press q. A tutorial can be seen by pressing h which shows this in more
    detail, and you can return to the initial directory page by pressing d.


    ## Getting Quick Help


    Sometimes you know the command you want to use but are unable to remember the
    exact syntax of the command line option to use. For these cases many commands
    have quick help available which can be viewed by adding --help to the command.


    For example to display help on the “tar” command:


    ```bash

    tar --help

    ```


    The command above will show a page or two about the tar (tape archive) command
    which, despite its name, is the most common command used for creating disk archives.


    If the help is more than one page you can put it through a “pipe” into the “more”
    command. Enter it like this:


    ```bash

    tar --help | more

    ```


    Not all commands support this quick help. Some do it explicitly, that is using
    the --help option as above. Others don’t recognise this option but take the opportunity
    to show some brief information Other commands are less friendly however and do
    not give any such information.


    ## The Linux HOWTOs


    So far we have seen how to help on particular commands. Sometimes you want to
    know the details of how to get something done, which might involve several different
    commands. A good example would be “How do I get Quake running on Linux?”


    The HOWTO files, as their name implies, are intended to answer this type of question.
    Each one shows all the stages necessary to perform a certain task, or the different
    ways of doing something and gives you the exact commands to do it. You won’t learn
    much about the individual commands since the HOWTOs are supposed to be used by
    someone who already knows his or her way around a Linux system and just wants
    to know the steps involved in getting something complicated to work.


    The Quake HOWTO is a good example. It starts by explaining what you need and continues
    to tell you where you can get Quake. Then it goes into the installation procedure
    and how to run the various versions of Quake. Then it describes the various options
    available and so.


    You can see that the HOWTOs are designed to bring together all the little things
    you need to achieve a particular task. In the Quake HOWTO you can find out something
    about the MesaGL graphics system too, as this is required for one of the versions
    of Quake.


    Other subjects covered include how to run Linux in various foreign languages such
    as Spanish or Thai; how to use PCMCIA cards with Linux; other types of hardware
    such as UPS (uninterruptible power supplies) and setting up various services such
    as a web server or firewall.


    HOWTOs are normally provided with your Linux distribution and can be found under
    the /usr/doc branch. They may be in HTML or plain text format. If you want to
    get more HOWTOs, or get them in a different format as Postscript, point your web
    browser to: http://sunsite.unc.edu/LDP/HOWTO.

