    # DEP 包


    Debian Linux 发行版使用一种名为 DEP 的自定义文件格式包。这些包通过“dpkg”程序或菜单驱动的前端“dselect”进行安装。


    # 安装软件包


    ```

    dpkg -i filename

    ```


    # 列出已安装的软件包


    ```

    dpkg -l name

    ```

    可选的、用于匹配的包名


    # 移除（卸载）软件包


    ```

    dpkg -r packagen

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_142_0.png)


    # 使用 "dselect"


    这是“dpkg”的前端。遗憾的是，正如帮助页（man page）所承认的，它对初学者并不友好。其基本思想是维护一个软件包列表，当你输入“dselect”时，将有以下选项：


    输入“man dpkg”获取更多关于 dpkg 的信息，输入“man dselect”获取有关如何使用 dselect 的信息。在 dselect 内部按下“?”可以查看关于使用
    dselect 的帮助以及如何解释软件包显示。


    # 选择访问路径（你的软件包所在位置）


    这需要你知道从 CD-ROM 获取文件时 CD 设备的“/dev”名称。


    # 选择要安装/移除的文件


    你将看到一长串软件包及其当前状态。你可以通过按下 + 和 - 来选择安装或移除它们。按 Q 返回主菜单。


    # 安装或移除软件包


    此此阶段通常需要一些时间，因为它会遍历目录中所有软件包的完整列表。


    # 配置已安装的软件包


    某些软件包在运行之前需要执行一些配置步骤。这与运行“dpkg --configure”是相同的。


    # 源码包


    有时，如果你的系统上安装了某些其他软件包（通常是库），一个分发的软件包才适用于你的系统。为了避免包不兼容的问题，某些软件以“源码”形式分发，然后在运行它之前需要进行重新编译。


    源码包可能是源码 RPM 包，也可能是压缩的 tar 文件。


    ## 从 SRPM 构建软件包


    输入此命令构建软件包：


    ```

    rpm --rebuild filename

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_143_0.png)


    你可以改用“glint”执行第 2 步。


    - 2 切换到 RedHat 包目录，新构建的包位于此处


    ```

    cd /usr/src/redhat/RPMS/i386

    ```

    并使用“rpm”命令安装软件包。


    ## 从 gzip tar 文件构建软件包


    - 1 将文件提取到临时目录。


    ```

    tar xvzf myarchive.tar

    ```


    - 2 读取该包拥有的任何“readme”文件。如果有“configure”脚本，运行它。


    ```

    ./configure

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_143_1.png)


    最好以自己的用户身份运行“make”，但使用“root”安装文件。


    - 3 运行“make”构建可执行文件。


    ```

    make

    ```


    - 4 安装可执行文件。


    ```

    make install

    ```


    # 日常操作


    在这里处理 Linux 系统的日常操作。你将学习 Linux 如何启动和关闭，以及如何控制这一序列。你将学习通过创建救援启动盘来保护自己、进程如何运行以及如何管理它们、管理磁盘空间，以及虚拟内存的交换分区（swap）操作。你还将看到在使用
    Linux 系统时遇到的一些其他命令，包括如何设置时间。


    # 目录


    | 主题 | 页码 |

    | :--- | :--- |

    | 机与重启 | 144 |

    | 修改运行级别 (Runlevels) | 145 |

    | 初始化序列 | 146 |

    | 制作救援磁盘 | 147 |

    | 进程 | 148 |

    | 监控进程 | 151 |

    | 管理磁盘空间 | 153 |

    | 虚拟内存和交换文件 | 155 |

    | 查看文件 | 156 |

    | 关于磁盘和文件的更多 | 158 |

    | date 命令 | 160 |


    # 机与重启


    在关闭电源之前正常关闭 Linux 是关重要的。这样做可能会导致数据丢失或磁盘损坏。关闭 Linux 的正确方法是使用“shutdown”命令。


    ```

    /sbin/shutdown -h now

    ```

    shutdown 位于 /sbin/ 目录下 停止系统 立即关机


    如果你有一个系统带有电源管理和电源按钮控制，shutdown 也可以关闭系统。如果内核配置正确，PC 将在停止后关闭。


    # 重启


    要重启系统，你只需使用 -r 代替 -h：


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_145_0.png)


    ```

    /sbin/shutdown -r 17:30 "Reboot at 17:30"

    ```

    重启系统 在 17:30 关机 向所有用户发送此消息


    大多数大多数系统在 /etc/initittab 中也包含以下行，这会导致熟悉的“Ctrl+Alt+Del”组合键运行此命令：


    # 取消关机


    如果你下发出了一个带时间的关机命令，可以通过此命令取消它：


    ```

    /sbin/shutdown -c

    ```


    # 修改运行级别


    当你学习切换运行级别时，你会看到 4 是多用户模式，0 是关机。你也可以通过在 LILO 提示符的正常启动命令后添加“single”单词来进入单用户模式。


    # 初始化序列


    Linux 使用“Sys V”初始化序列。这意味着它遵循著名的 System V 启动约定。这些约定决定了系统更改运行级别时运行的程序顺序，包括启动和关机。


    # 初始化目录


    每个运行级别在“etc/rc.d”下都有自己的目录。这些目录命名为“rcn.d”，其中 n 是运行级别，从0 到 6。每个目录包含一组 shell 脚本，在进入或离开特定级别时按名称运行。某些以“Knn”命名的文件用于在进入该级别时停止杀死现有程序。其他以“Snn”开头用于启动程序。


    由于这些文件需要在多个目录中存在，对于需要该程序的每个运行级别，实际的脚本位于“etc/rc.d/init.d”，而各个运行级别目录拥有它们的软链接。


    # 添加启动命令


    - 如果“etc/rc.d/init.d”中没有该程序的脚本，则你需要添加它。调用它时将带有“start”参数或“stop”参数。


    - 切换到每个需要启动该命令的运行级别目录


    ```

    /etc/rc.d/rc3.d

    ```


    - 如果必要，添加启动脚本和杀死脚本的链接：


    ```

    ln -s /etc/rc.d/init.d/myprog S99myprog

    ln -s /etc/rc.d/init.d/myprog K99myprog

    ```


    小技巧 如果在不涉及这些脚本的复杂性的情况下添加启动命令，你可以将命令添加到“etc/rc.d/local”中，它将在所有其他脚本之后运行。


