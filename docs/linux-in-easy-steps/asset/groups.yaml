    # More about Crontabs


    # Output from Cron jobs


    Normally when a cron job runs the output is sent via the Linux “mail” command
    to the user who owns the job.


    You can send the output to a file by redirecting the output, like any other command:


    ```

    00 12 * * * root (date;df) >>/etc/cron.out

    ```


    Alternatively you can use the cron shell variable, “MAILTO”.


    # Cron Shell Variables


    Certain special variables are active in the crontab file:


    # USER


    The user to run the command as (not changeable).


    # HOME


    The user’s home directory.


    # SHELL


    The shell to use to run the command.


    # MAILTO


    Mail program to use. You can set it to “” to prevent mail being sent at all.


    To set a crontab shell variable just use this form:


    ```

    variable-name=value

    ```


    For example:


    ```

    SHELL=tcsh

    ```'
  - '[PAGE 169]


    # Organising the System Crontab


    Most Linux Distributions come with cronab pre-configured with certain jobs already
    set up. Examples are:


    +   * Delete files from /tmp

    * Manage system log files

    * Update the “locate” database


    In order to manage the various jobs some distributions divide them into categories
    such as “daily”, “weekly” and “monthly”, with each category having its own directory
    under “/etc”, for example:


    ```

    /etc/cron.daily

    /etc/cron.weekly

    /etc/cron.monthly

    ```


    The actual entry in the system crontab for each interval makes a call to a shell
    script called “run-parts”. This script will run each script or program found in
    the appropriate directory. For example the daily entry in “/etc/crontab” looks
    like this:


    | 01 01 * * root run-parts /etc/cron.daily |


    And in the directory “/etc/cron.daily” are the following scripts:


    ```

    updatedb.cron

    logrotate

    tmpgetwatch

    ```


    You can add other scripts here to be run once per day.


    The “run-parts” script simply uses a “for” loop to cycle through all files in
    the directory given as a parameter and executes each one.'
