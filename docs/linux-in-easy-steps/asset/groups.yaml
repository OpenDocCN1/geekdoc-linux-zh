    # RPM


    In addition to the “compressed tar” type of archive, are some package formats
    specially designed for easy installation and management of software packages.


    One of the best-known is “rpm” or RedHat Package Manager. Although invented by
    RedHat the program is open source and it is used by other Linux distributions
    too.


    RPM allows you to install, upgrade and remove software packages. It tracks dependencies
    and will not normally allow installation of a package if it depends on another
    package which you don’t have installed.


    RPM has both a command-line interface and a graphical interface called “Glint”.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_139_0.png)


    To install a package:


    ```

    rpm -i filename

    ```


    To upgrade a package:


    ```

    rpm -U filename

    ```


    To list installed packages:


    ```

    rpm -qa

    ```


    To query an installed package, or a file:


    ```

    rpm -qi packagename or

    rpm -qip filename

    ```


    To remove (uninstall) a package:


    ```

    rpm -e packagename

    ```'
