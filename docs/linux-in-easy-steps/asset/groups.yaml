    # 制作救援盘


    为了制作一个非常有用的救援盘（实际上是在单张软盘上运行完整的 Linux），你需要一个类似于 "tomsrtbt" 的工具，该工具可以从 http://sunsite.unc.edu/pub/Linux/system/recovery/
    与其他启动盘一起获取。另请 /usr/doc 目录下的 Bootdisk Howto。


    PC 和硬盘有时会故障，做好准备是明智的。一旦你的 PC 发生故障，可能会出现无法启动进入 Linux 的情况。如果你有一个救援盘，可以它它启动 Linux
    并访问系统，那么一切并非不可挽回。


    ### RedHat 救援盘

    RedHat 安装光盘具有作为救援盘的能力。但是，你首先需要制作一张救援软盘在此过程中使用：


    - 1 挂载 RedHat 安装 CD 并切换到 /dosutils/ 目录

    - 2 插入一张空白软片并输入此命令


    ```

    dd if=rescue.img of=/dev/fd0 bs=72k

    ```


    - 3 使用救援盘：从 CD 启动并在启动提示符处输入 "rescue"。在提示时插入软片


    另一种类型的救援盘是包含你的 Linux 内核的简单启动软盘。如果你无法从硬盘启动，它将帮助你启动正常的 Linux 系统，你可以在该系统中运行 LILO
    或复制一个内核供 loadlin 使用。


    ### 创建启动盘

    对于此过程，你必须熟悉重新构建内核。如果你不确定，请参阅下一章获取相关信息。


    要在软盘上创建可启动的内核，请插入软片并像往常一样配置内核。当进行构建内核时，输入 `make fdImage` 而不是 `make bImage`


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_148_0.png)


    # 进程


    在 Linux 上运行的每个程序都称为进程。同时运行的进程比你启动的程序要多得多。启动过程会运行许多被称为“守护进程”（daemons）的进程，处理打印队列和网络等事务。你可以使用“ps”命令查看自己的进程：


    ```

    [fred@localhost fred]$ ps

    PID TTY STAT TIME COMMAND

    261 2 S 0:00 -bash

    337 2 S 0:00 sh /usr/X11R6/bin/startx

    338 2 S 0:00 xinit /usr/X11R6/lib/X11/xinit/xinitrc -

    342 2 S 0:13 fwm2 -cmd Fvwm4 -debug /etc/X11/AnotherLevel/fvwm2rc.m4

    412 2 S 0:00 /usr/X11R6/lib/X11/fvwm2//FvwmTaskBar9 4 /tmp/fvwmrca00351

    418 p0 S 0:00 bash

    487 p0 R 0:00 ps

    ```


    进程 ID 终端 CPU 时间 程序（控制台或使用的窗口）


    此输出显示了进程 ID 以及正在运行程序的信息。


    你可以通过添加 "a" 和 "x" 选项来查看系统上的所有进程：


    ```

    [fred@localhost fred]$ ps ax

    PID TTY STAT TIME COMMAND

    1 ? S 0:02 init

    2 ? SW 0:00 (kflushd)

    3 ? SW 0:00 (kswapd)

    4 ? SW 0:00 (md_thread)

    5 ? SW 0.00 (md_thread)

    36 ? S 0:00 /sbin/kerneld

    155 ? S 0:00 syslog

    164 ? S 0:00 klogd

    186 ? S 0:00 crond

    198 ? S 0:00 inetd

    209 ? S 0:00 lpd

    230 ? S 0:00 sendmail: accepting connections on port 25

    ```


    在这里你可以看到某些系统进程的条目，例如打印守护进程 (lpd) 和 sendmail。注意进程 ID 从 1 开始。pid 为 1 的进程被称为 "init"，它是启动所有其他进程的进程。


    所有进程都由另一个进程启动。该进程被称为父进程，由它启动的进程被称为子进程。所有进程的最终父是 "init"，你可以在上一页看到它。每个进程都有一个进程 ID，或
    pid。你可以在 "ps" 列表中看到每个进程的 pid。要查看进程父的 pid，使用 l 选项。你可以看到这里的进程 ID 和父进程 ID 是不可见的（进程名不可见是因为行要长得多）：


    | FLAGS | UID | PID | PPID | PRI | NI | SIZE |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 100 | 500 | 261 | 1 | 0 | 0 | 1228 |


    进程 ID 父进程 ID。你可以看到此进程是在启动时由系统的 "init" 进程启动的


    # 停止进程

    你可以使用 "kill" 命令发送一个停止信号。这会向进程发送一个名为 "SIGTERM" 的信号，意思是“终止”。如果进程处于错误状态，或者它被程序设置为“捕获”
    SIGTERM 并忽略它或缓慢关闭，你可以使用 -9 选项立即杀死进程：


    ```

    kill -9 261

    ```


    终止 pid 为 261 的进程。只有在你确定进程已崩溃或无响应时才这样做，否则可能会丢失数据。


    # 监控进程

    有时你可能想查看进程正在做什么，例如如果你怀疑某个进程占用了过多内存或时间。执行此操作的命令是“top”，因为它按 CPU 使用率显示顶部进程。


    | | |

    | :--- | :--- |

    | up 1:38 users, load average: 0.24,0.12,0.04 | processes: 35 sleeping, 1 running,
    0 stopped |

    | CPU states: 7.1% user, 1.7% system, 0% nice, 1.4% idle | Mem: 63140K used, 21920K
    used, 41220K free, 18452K buff |

    | Swap: 0K used, 0K used, 0K free, 13812K cached | |

    ![](img/f2019df07bd67d0d6801cbad23cc32b8_152_png)


    # 优先级

    优先级范围从 -19（最高优先级）到 20（最低优先级），但用户只能设置正值。由于系统上的所有进程必须共享 CPU，每个进程都有一个决定其获得多少 CPU
    的优先级。你可以在“top”显示中可以看到。有一个影响进程优先级的命令是“nice”。以比通常低的优先级运行程序。一旦程序运行，你可以使用“renice”命令更改优先级。除非你是超级用户，否则你只能将优先级改为
    0 到 20 之间的值。


    ```

    renice -2 -p 301

    renice 15 -p 302

    ```


    将进程 301 的优先级降低2。将进程 302 的优先级改为15


    # ps 的其他选项

    如果你想知道是谁在运行什么，对 ps 使用 u 选项：


    ```

    ps ax

    ```


    输出将显示用户名。然后可以使用 "grep" 查看指定用户的进程：


    ```

    ps ax | grep fred

    ```


    这将仅显示 fred 的进程


    # 排序输出

    你可以使用 "--sort" 选项产生排序输出，后面跟着一个或多个排序键。例如：


    ```

    ps ax --sort "uid,-size,+stime"

    ```


    按用户 ID 排序。然后按使用内存倒序排序。最后按系统时间排序


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_153_0)


    # 早期版本的 KTop 有一个阻止显示的 bug。如果你看到这个，用鼠标微调窗口大小，KTop 就会正常运行。如果你有 KDE，可以使用 "ktop" 显示当前运行的进程。点击以“树”形式显示父子关系


    ![](img/f2019df07bd67d0d6801cbad23cc32b1.png)


    进程 ID. 运行的命令


    # 管理磁盘空间

    监控磁盘使用情况至关重要，以确保你用完空间。“du” 命令用于显示磁盘上使用了多少空间。如果没有指定，“du”将当前目录作为基准。它显示基目录及其下方所有子目录中的文件占用了多少空间：


    ```

