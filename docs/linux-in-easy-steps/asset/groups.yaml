    # Commands


    # The X Window System


    | ls | Directory listing |

    | ls -l | Long listing |

    | ls -a | Show hidden files |

    | cd dir | Change to directory |

    | pwd | Show current directory |

    | cat files | Display or concatenate file(s) |


    | startx | Enter the X Window System |

    | xset | Control the X environment |

    | xterm | X terminal window |

    | xfm | The X filenamager |

    | xedit | Text Editor |


    | cp source dest | Copy file and directories |

    | cp -a source dest | Copy files and directories recursively, preserving attributes
    |


    | mv oldname | Rename or move |

    | newname | file(s) |

    | rm files | Delete file(s) |

    | mkdir dir | Make directory |

    | rmdir | Remove directory |


    | find -name value | Find files named, starting from directory dir |

    | man command | View online manual for command |


    | man -k keyword | Find manual pages related to keyword |

    | grep string files | Find string in file(s) |

    | chmod attributes | Change protection attributes of file(s) |

    | Ctrl+D or exit | Logout or exit shell |

    | shutdown -r time | Shutdown and reboot |

    | shutdown -h time | Shutdown and halt system |


    | The Vi Editor |

    | Ctrl+U, Ctrl+D | Cursor movement left, up, right, down |

    | 0 | Scroll up and down screen |

    | $ | Go to end of line |

    | : | Go to last line |

    | n | Go to line n |

    | i | Insert at cursor |

    | A | Append to end of line |

    | R | Replace characters |

    | O | Insert line below |

    | ESC | Insert line above |

    | x | Leave insert mode |

    | dw | Delete character |

    | dd | Delete line |

    | p (lower case) | Yank (copy) or deleted lines below cursor |

    | P (upper case) | Put yanked or deleted lines above cursor |

    | /string | Find string forwards |

    | ?string | Find string backwards |

    | n | Find next |

    | wq | Save and quit |

    | q! | Quit without saving |


    # Redirection


    | command>file | Send output from command to file |

    | command<file | Get input to command from file |

    | command|2 | Send output from command|2''s input |

    | ''command*'' | Use output of command as part of another command |


    Everything on this page is case-sensitive


