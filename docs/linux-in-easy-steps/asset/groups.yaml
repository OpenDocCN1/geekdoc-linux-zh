    # Finding Files


    How can you find a file whose location you have forgotten? That is, you know it
    exists but don''t know in which directory it is located. You could always visit
    each directory on the system in turn, and use the ls command in each. This would
    be very laborious and could take quite some time.


    Fortunately there are a couple of commands available to help in this task.


    The first one is called find. To find all files in a directory called "mydirectory"
    and all its subdirectories enter:


    ```

    find my_directory -print

    ```


    To find a particular file, enter:


    ```

    find my_directory -print -name filename

    ```


    To find all files matching a pattern you can use wildcards, but in this case we
    want to pass the wildcards to the find command, rather than let the shell expand
    them. This is because the shell only looks in one directory when expanding wildcards
    and, unless the files we are seeking are in the current directory, the expansion
    will not help us.


    To pass wildcards directly to a command without letting the shell expand them,
    we can enclose them in single quotes ''like this''.


    So, to find all files beginning with ''b'' in the current directory, and all subdirectories,
    use:


    ```

    find . -print -name ''b*''

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_22_0.png)


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_22_1.png)'
  - '[PAGE 23]


    # The Locate Command


    There is a faster way to find files than the find command, which is a rather brute
    force method. The find command can take some time to search the filesystem, particularly
    if you have a lot of files and directories. This is because it visits every directory
    and subdirectory in turn to see if the files you want are there.


    A faster way is to use the "locate" command. This command searches a ready-built
    index in order to locate files rapidly. Locate searches partial filenames by default
    so wildcards are unnecessary.


    To find all files containing the word "big":


    ```

    locate big

    ```


    Of course nothing comes for free and the catch is that you have to build the index
    which locate uses to find files. There is another command used for this, called
    "updatedb".


    To generate the index simply enter:


    ```

    updatedb

    ```


    on a line on it''s own. The command will take a little while as it searches the
    filesystem and builds it''s database, but once done the locate command will find
    files much quicker than using find.


    Make sure you are logged in as root, or the superuser, when you run the updatedb
    command, otherwise there will be some directories which cannot be scanned because
    you do not have permission.'
