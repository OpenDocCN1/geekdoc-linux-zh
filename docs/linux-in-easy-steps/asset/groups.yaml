    49 文件的编辑与搜索


    ## 搜索字符串


    有几个命令可以用于在你正在编辑的文件中查找字符串：


    搜索和替换命令是区分大小写的，因此搜索 "fred" 不会找到 "Fred"。


    ### 向前查找

    按下 `/` 然后输入你想要查找的字符串。光标将跳转到该字符序列的下一个出现处。如果到达文件末尾，搜索将“回绕”并从文件开头继续查找。


    ### 向后查找

    若要向后查找而不是向前查找，请使用 `?` 代替 `/`。要重复以相反方向进行的上一次搜索，请使用 `F`。


    ### 查找下一个

    搜索之后，你只需要按下 `n` 即可找到字符串的下一次出现处，无论是向前还是向后。


    ### 替换文本

    替换命令（实际上是 "s" 即 substitute 的缩写）是一个“冒号”命令，因此你必须在输入命令之前按下 `:`。它也可以作用于行范围。默认情况下，它作用于当前行。要同时处理更多行，你必须输入一个范围，如下所示：


    | 20 | | |

    | :--- | :--- | |

    | 20, 30 | 第 20 到 30 行 |

    | 1, $ | 整个文件 |


    ### 示例

    /this 查找 "this" 的下一个出现处

    ?X 从光标处向后查找 "X"

    :1,$s/first word/1one/g


    | 全局，即行内所有出现处 | 针对文件中所有行 | 替换查找此文本 | 替换为此内容 |


    50 简易入门 Linux


    ## 正则表达式


    我们刚刚看到的搜索字符串是所谓“正则表达式”的一个简单示例。


    ## 特殊字符


    以下字符具有特殊含义：


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_52_0.png)


    这里的表示法可以用在 "vi" 中搜索文本时。


    - . 匹配任何单个字符

    - c* 匹配字符 c 的零次或多次出现

    - ^ 代表行的开始

    - $ 代表行的结束

    - [cc] 匹配列表 cc 中的任意一个字符。

    - [^cc] 匹配列表中的任何非列表字符

    - \< 代表单词的开始

    - > 代表单词的结束


    字符列表

    在方括号 `[` `]` 内部，通过简单将字符一个接一个放置形成列表，例如 `[abc]`。这将匹配 "a"、b" 或 "c"。可以用 "-" 指定字母范围，例如
    `[a-z]` 将匹配任何小写字母。


    字符转义

    若要查找文本中的匹配特殊字符，你必须通过在它前面加一个反斜杠 `\` 对其进行“转义”。如果你想包含一个逗号，也要进行转义（`"\,"`）。任何通常具有特殊含义的字符都可以转义，包括
    `[`、`]`、`\.`、`*`。在方括号内部不需要这样做，它们被视为列表中的一个成员。如果你想在列表中包含 "-" 或 "]"，你必须使其成为列表中的第一个字符。


    ## 示例


    - [a-zA-Z] 任何小写或大写字母

    - [A-Z][a-z]* 行首的任意大写字母，后跟可选的小写字母。


    ## 替换字符串


    正则表达式不仅用于搜索字符串（即你正在查找的内容），它们也可以用于你指定的替换字符串中。在 "vi" 替换命令的替换部分，可以使用以下特殊字符：


    - \ 转义字符（如搜索字符串中）

    - & 映射到搜索字符串

    - ~ 映射到上一个替换字符串

    - \u 大写字母

    - \l 小写字母

    - \e 关闭 \u 或 \l

    - \L 小写字符串

    - \U 大写字符串

    - \E 关闭 \U 或 \L


    ## 示例


    - 1,$s/*/""/ 将每个非空行用引号括起来

    查找一个或多个字符 替换为相同的字符串，外加引号

    - 1,$s/^./\u& 将每行的首字母更改为大写


    ```

    s/\<[a-zA-Z][ ]*[0-9][^ ]*\U&\E 或 L&g

    ```

    单词开始 数字 查找包含数字的单词，替换为“大写单词或小写单词。”例如，将 "H2O" 替换为 "H2O or h2o"


    任意字母 空格以外的任何内容 空格以外的任何内容


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_53_0.png)


    ## Grep


    有一种说法，“grep" 的名字源于 "ex" 编辑器中命令后的 g<expression>p，意为全局查找正则表达式并打印这些行。更常见的解释是它代表通用正则表达式解析器（General
    Regular Expression Parser）。无论哪种，grep 都是 Linux 最用的命令之一。


    简单来说，grep 是一个查找文件中字符串的实用。你可以直接对文件或多个文件运行它，也可以将其作为管道中的过滤器使用。


