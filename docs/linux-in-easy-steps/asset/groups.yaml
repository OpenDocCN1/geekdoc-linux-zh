  - '[PAGE 83]


    # Integrated Desktops


    There are numerous programs available to run on the window system – window managers,
    utilities, applications. Unfortunately they don''t generally have a consistent
    look and feel the ability to work together well. This can be achieved by using
    an integrated suite.


    There are two available: KDE and Gnome. KDE means “K” Desktop Environment. This
    was the first of the free integrated desktops available for Linux and is the most
    mature. Gnome is said to be more technically superior but is less mature than
    KDE.


    # Using KDE


    To use KDE you must obtain the QT graphics library and a number of KDE packages.
    The minimum packages you need to install are: KDE-Support, KDE-Libs, and KDE-Base.
    To be able to do much you should also install: KDE-Network, KDE-Graphics, KDE-Multimedia,
    KDE-Games, and KDE-Admin.


    Here you can see the KDE window manager, the task bar, and desktop panel which
    can accept “docked” or buttons. Some of the programs are around the screen. KDE
    has a file manager with a tree or icon or text views. It can look into compressed
    files and supports web browsing and ftp. KDE also allows applications to share
    data by fully integrated drag & drop.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_83_0.png)'
  - '[PAGE 84]


    # Installing KDE


    KDE uses a 3rd-party software library called QT. QT is produced by Troll Tech
    and comes in two versions: a free version and a commercial version. KDE is a free
    software suite and so it only needs the free version of QT which is available
    from the KDE site as well as Troll Tech. It''s also supplied with each Linux distribution
    which carries KDE.


    To install KDE you first have to install QT. If you anticipate building any KDE
    packages from source you will also need the "QT-Devel" package. This will be the
    case if you don''t have pre-built binary RPMs or TGZ packages for your distribution.


    You must install "KDESupport" first, then "KDELibs", followed by "KDEBase". After
    install all the other KDE packages you have. The KDE software installs by default
    into the "/opt/kde" directory. After installation check to see if you have a program
    called "usekde", located in the "/opt/kde/bin" directory. This comes with some
    RPM versions of KDE and makes life easier when installing.


    If you are building source packages you must build and install each one before
    building the next one.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_84_0.png)


    See chapter 9 for how to install packages.


    +   1. Install packages using "rpm". If you have binary "tgz" packages use tar
    to place the files in /opt/kde


    +   2. For each user, log in and run "usekde", if you have it


    +   3. Alternatively, add these lines to /etc/profile


    ```

    export KEDIR=/opt/kde

    export PATH=$KEDIR/bin:$PATH

    ```


    +   4. And edit "xinitrc" in your home directory to contain just this one line:


    ```

    $KEDIR/startkde

    ```'
