    # X 屏幕保护


    要使用 X 屏幕保护，你需要安装“xscreensaver”软件包。该包包含三个主要部分：持续运行并响应请求的屏幕保护守护进程（后台进程）；屏幕保护命令客户端，它用于请求服务器部分执行操作；以及所谓的图形“黑客技巧（hacks）”，这些模块是当
    xscreensaver 启动时用于显示不同模式的模块。


    ## 运行屏幕保护


    -   从你的 X 启动文件中运行后台进程


    ```

    xscreensaver&

    ```


    在启动界面消失之前，点击“demo”查看屏幕保护模块的演示。


    点击模块名称查看演示。该模块的命令显示如下。


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_78_0.png)


    # 设置偏好


    你可以通过点击演示窗口上的“preferences”按钮来设置偏好。或者，你可以使用命令行程序：


    ```

    xscreensaver-command -prefs

    ```


    - 输入屏幕保护启动前的时间

    - 输入屏幕保护模式切换前的时间

    - 输入屏幕锁定前的时间（需要登录密码）

    - 输入密码提示消失前的时间


    # 配置文件


    X 屏幕保护通过你家目录下名为“.xscreensaver”的文件进行配置。运行 xscreensaver 时会设置一个默认文件，你可以通过以下行项目：“timeout:
    n”、“cycle: n”、“lock: n”和“passwdTimeout: n”来更改上述偏好。你还可以使用“fade”开启屏幕保护淡入效果，并使用“unfade”淡出恢复正常状态。


    在每种情况下，n 是以分钟为单位的时间。


    你可以这样设置使用的程序：


    在默认配置文件或演示对话框中查找标准保护程序模块的命令行。


    每行末尾以反斜杠结束


    ```

    programs: qix -root \

    \n\ico -r -faces -sleep 1 -obj ico \

    \n

    ```


    使用反斜杠-n 表示换行。


    要运行的程序


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_79_0.png)


    # 直接登录 X


    当你启动 Linux 时，它会进入一个“运行级别（runlevel）”。运行级别决定了启动哪些程序。运行级别如下：


    | 级别 | 说明 |

    | :--- | :--- |

    | 0 | 停机 |

    | 1 | 单用户 |

    | 2 | 多用户，无网络 |

    | 3 | 带网络的多用户 |

    | 4 | 未使用 |

    | 5 | XII |

    | 6 | 重启 |


    这些运行级别在“inittab”文件中定义，该文件位于“/etc”目录。


    ```

    id:3:initdefault:

    ```


    有一个默认运行级别，由该文件中的项目指示。它是 3，这意味着当启动系统时将进入单用户模式。此运行级别不启动 X 窗口，因此你会看到登录提示。看到一个显示登录提示的窗口更好。使用名为“xdm”的程序或“显示管理器”可以这样做。为了启动
    xdm，我们可以更改“/etc/inittab”中的默认值为运行级别 5。


    ```

    id:5:initdefault:

    ```


    要更改默认值，将“3”改为“5”。


    # 运行级别


    进一步在“/etc/inittab”中查看进入运行级别 5 时运行的程序：


    ```

    x:5:respawn:/usr/X11R6/bin/xdm

    ```


    # XDM 命令


    如果你有 KDE，可以使用 KDM 代替 XDM。XDM 启动时会使用几个文件来告诉它做什么。这些文件位于 /etc/X11R6/xdm：


    - Xservers: 定义你的 X 服务器（显示器）

    - Xsetup_0: 在登录前启动程序

    - Session: 登录后启动程序


    通常默认设置是：在登录前启动控制台（你可以看到系统消息），并在登录后启动窗口管理器。


    # 更改登录前启动的程序


    ```

    Edit etc/X11R6/xdm/Xsetup_0

    ```


    - 添加要运行程序的行


    示例：


    ```

    xsetroot -solid blue

    ```


    如果你使用 KDM，Xsession 会接收你在 KDM 屏幕上选择的参数。你可以根据此参数让 Xsession 使用不同的窗口管理器。


    # 更改登录后启动的程序


    ```

    Edit etc/X11R6/xdm/Xsession

    ```


    - 添加要运行程序的行


    示例：


    ```

    xset -cursor-name top_left_arrow

    ```


