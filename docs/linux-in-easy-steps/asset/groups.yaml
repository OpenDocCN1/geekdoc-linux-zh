    ## Basic Concepts


    Although the vi editor has one of the most bizarre and seemingly non-user-friendly
    interfaces ever invented, it is worth learning how to use it, as it is the one
    editor which you can guarantee will be on every Unix or Linux system you might
    use.


    The first, and most important, thing to learn about vi is that it has two modes:
    Input mode, and Command mode. When you are in input mode everything you type goes
    to the screen, and into the file you are editing (the only exceptions to this
    are cursor-movement commands and the exit from input mode command.) When you are
    in command mode nothing you type will go into the file you are editing; rather
    it will be interpreted as a command to the editor to do something. Understanding
    is the key to understanding vi.


    ## An example


    - Start vi on a new file called "testfile".


    As usual, all commands are case-sensitive.


    - 2. Press "i" to enter input mode. Type some text, then press ESC.


    - 3. You are back in command mode. Press "0" and the cursor will return to the
    beginning of the line. Press "x" 5 times and on each stroke one letter of the
    1st word will be deleted.


    - 4. Now press ":". A colon prompt will appear on the bottom line. You are now
    in command entry mode. Type "q!" and press RETURN. This will quit vi without saving
    and return you to the shell prompt.


