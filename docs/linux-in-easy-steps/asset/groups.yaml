    # Opening Multiple Files


    Sometimes Vi you want to edit two or more files, copying data from one to another.
    This is easy with Vi.


    To copy lines between files


    +   1 Open the first file

    ```

    vi bigfile.txt

    ```


    +   2 Copy the lines you want to paste into the other file

    ```

    10Y

    ```


    +   3 Open the other file with the ":e" command

    ```

