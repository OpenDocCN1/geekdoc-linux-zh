    # Logging in


    When you start Linux you will see the login prompt. If this is the first time
    you are logging in the only user on the system will be the superuser, known as
    “root”.


    ## To log in


    - 1. Enter your username at the login prompt.


    | Red Hat Linux version 5.2 (Apollo) |

    | Kernel 2.2.2 on an i686 |

    | localhost Login: root |


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_15_0.png)


    You won''t see your password as you type it, so be careful to get it right!


    - 2. Enter your password at the prompt.


    password:


    - 3. If you have entered the username and password correctly, you will find yourself
    at the Linux prompt.


    ```

    [root@localhost root]$

    ```


    Username Computer Current directory


    ## Adding a User


    After you have logged in for the first time you need to add a user. To add a user
    “Fred” use the following command:


    ```

    useradd -m fred

    ```


    ## Setting a Password


    You can now set the password for your user. Use this command:


    ```bash

    passwd fred

    ```


    To log out, just press Ctrl+D.


    ## Entering Commands


    Linux provides several "virtual" consoles (normally six). This means you can log
    in up to six times and run different programs on each virtual screen. Change from
    one virtual screen to another by pressing Ctrl+Alt+number. For example: Ctrl+Alt+2
    to change to virtual console 2.


    When you have logged in with your new username you will be placed at the shell
    prompt. The shell is the program which accepts your commands and runs programs
    for you. We will learn more about the shell later.


    The prompt will appear as a $ sign which, by default on RedHat Linux, is prefixed
    with your username, the name of your Linux machine and the current directory name.


    There are two types of command you can enter at the shell prompt: Shell commands;
    and Programs.


    Shell commands instruct the shell itself to do something. They are used for job
    control and control of how the shell operates and your environment. Typing a program
    name causes the shell to go and find that program on the hard disk and then run
    it.


    ### Some shell commands are:


    | command | description |

    | :--- | :--- |

    | echo | Display text or other values on the screen |

    | cd | Change current working directory |

    | pwd | Print the current working directory on the screen |


    ### Some common programs are:


    | command | description |

    | :--- | :--- |

    | ls | List directory contents |

    | cp | Copy Files |

    | cat | Display the Contents of File(s) |


    We will learn more about all of these later.


    ## Directories and the Filesystem


    In common with other Unix systems and many other operating systems, Linux disks
    are organised into a logical tree structure formed of directories. Each directory
    is a container which can hold files (programs or data) and other directories.
    A directory held within a directory is sometimes known as a subdirectory. The
    base of the tree is known, not unreasonably, as the root. This is represented
    by the / (slash) symbol. The following diagram shows part of the Linux filesystem
    (starting from the root) and shows some common directories found within it:


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_17_0.png)


    Directories are sometimes folders.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_17_1.png)


    Some root level directories found on all Linux systems are:


    - /bin – contains executable programs ("binary") files which make up the commands
    of the operating system.

    - /boot – contains files related to booting the system, including the Kernel image
    itself (the core of the operating system which is loaded at boot time).

    - /dev – used for special files which represent devices on the system. Contained
    in this directory are files representing each hard disk and partition on the system,
    each serial and parallel port, mouse interface and all other devices.

    - /etc – this is a sort of “miscellaneous” directory which holds all kinds of
    files related to all kinds of things. Many system configuration files are in here
    such as the file which controls the X window server and local area network configuration
    files.

    - /home – contains the home directories of users on the system. That is, the directory
    a user finds when he logs on, and in which he has full ownership permissions.

    - /lib – libraries (shared program files) used by programs and the operating system
    are in this directory.

    - /mnt – this is a general mounting point (see later).

    - /opt – contains optional files and packages loaded onto the system.

    - /proc – this is not a real directory, it is simulated by the operating system.
    It shows many pieces of information about the hardware and software of the system.

    - /root – the home directory of the superuser,

    - /sbin – system binary files, i.e. executable programs which form part of the
    operating system.

    - /tmp – directory available to all users and programs for storing temporary files
    and data.

    - /usr – general directory containing several subdirectories with source code,
    executable programs, and whole application directories.

    - /var – this directory contains variable data like system logs, print spool files,
    and lock files.


    The location of any file on the system can be represented by writing first the
    root symbol, followed by the name of each directory, representing the sub-branch
    of the tree where the file resides. These elements are separated by more / symbols.


    For example: /home/fred/myfile.dat


    This notation is called a path. The example represents the file "myfile.dat" in
    the subdirectory "fred", located in the root-level directory "home".


    Linux filenames can be any length and are case sensitive. They can also contain
    spaces, although you may need to enclose the name in quotes (" and ”) when you
    pass a filename to a command, so that the command knows it is all one name.


    This means that "myfile", "MyFile", and "MYFILE" are all different names and may
    coexist in the same directory.


    # Introducing Linux


    # Basic File Handling Commands


    ## Directory Listing

    As shown on the previous table, you can enter "ls" to see a list of files in your
    current directory. ls can be used with various options which affect the way it
    shows the list:


    For example:


    - ls -1 Long listing, including file ownership, and time, and access permissions

    - ls -a Show all files, including hidden files (those whose name begins with a
    dot)

    - ls -t Order the list by date and time instead of alphabetically


    These options may be combined. Thus to show the most recent files, use:


    ```bash

    ls -ltr

    ```


    ## Copying and Moving files

    To copy files, use the cp command as follows:


    ```bash

    cp myfile file

    ```


    To move a file from one location to another, use the mv command. example:


    ```bash

    mv myfile subdirectory

    ```


    ## Deleting files

    You can delete files permanently using the rm command. For example:


    ```bash

    rm oldfile

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_20_0.png)


    ## Displaying the contents of a text file

    You can display the contents of a file with the “cat” command.


    ```bash

    cat myfile.txt

    ```


    If the file is longer than one screen you can display it a page at a time with
    more:


    ```bash

    more longfile.txt

    ```


    ## Wildcards

    When entering commands or running programs you sometimes want to specify a range
    of filenames, which the command should act on. An example would be “List all the
    files whose name begins with b”. This is done by using “wildcard” characters in
    the filenames. Each wildcard character matches many alternative characters.


    - * Matches any string of characters

    - ? Matches any single character


    These characters are used in combination with normal characters. So to list all
    files whose name begins with “b”, you could enter:


    ```bash

    ls b*

    ```


    What actually happens when you enter a wildcard filename is that the shell itself
    expands the wildcard, turning it into a list of matching filenames and passing
    the whole list to the command. If your directory contained two files beginning
    with “b”, such as “bigfile.txt” and “betal.dat”, the above command would be invisibly
    changed to:


    ```bash

    ls betal.dat bigfile.txt

    ```


    so the ls command shows just those two files. Since the wildcard expansion is
    done by the shell, we can use it for any commands we want to handle a list of
    files. We don''t need to worry about whether the command itself will understand
    the wildcard notation.


    For example, to copy all files from the /home/fred directory into the /home/john
    directory, enter the following:


    ```bash

    cp /home/fred/* /home/john

    ```


    This works because the cp command accepts a list of files on the command line
    and expects the last one to be a directory name in which to put them.

