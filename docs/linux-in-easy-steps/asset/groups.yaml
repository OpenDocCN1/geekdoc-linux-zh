  mdcn: '


    # 软件包文档


    许多软件包和程序都带有一套完整的文档，这些文档会随软件一起安装在 Linux 上。有时这些文档写得很好，有时则很糟糕。你可以在系统的 `/usr/doc`
    目录中找到它们。


    其中一些文档是纯文本格式，另一些是 HTML 格式（需要浏览器查看）。如果你没有图形化系统，可以使用基于文本的 浏览器 LYNX。


    # 如何阅读纯文本文档


    - 切换文件所在的目录

    - 使用 `vi` 命令查看文本文件


    # 如何使用 Lynx 查看 HTML 文档


    - 切换文件所在的目录

    - 使用 `lynx` 命令查看网页


    在 Lynx 中，你可以使用上、下方向键在“热链接”（hotlinks）之间移动。按右方向键从一个链接跳转到另一个页面，按左方向键返回。


    你可以通过按下 H 或 `?` 来获取 Lynx 的完整按键列表。


    # 其他信息来源


    除了许多关于 Linux 的书籍外，知识和信息的主要来源是互联网。网上有两个主要来源：出版文档和个人通信。


    针对特定软件包有可用文档，通常来自此类软件的生产商，但有时也来自第三方。在许多互联网搜索引擎之一中搜索很快就能找到此类文档。


    # Linux 文档项目 (LDP)


    查找关于不同 Linux 主题出版文档的最佳地点之一是 Linux 文档项目。LDP 的主页地址 http://www.metalab.unc.edu/LDP。LDP
    是一个独立的非营利组织，是 HOWTo 的所在地，并编写了关于以下主题的一些优秀且免费书籍：


    - 安装与入门

    - 用户指南

    - 内核编程


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_187_0.png)


    # 新闻组/邮件列表


    另一个查找的地方是新闻组和邮件列表。新闻组可以通过新闻阅读软件访问，其工作方式类似于电子邮件，是一个公共论坛，任何人都可以阅读，任何人都可以发表自己的观点（但必须与主题相关！）。有数千个各种主题的新闻组，但可以尝试
    Linux 相关的组，如 `comp.os.linux` 和 `linux.config`。


    邮件列表通过电子邮件运行，与新闻组有些相似，但更私密。你必须订阅才能阅读或发布消息，且它们的管理通常更严格。你可以在相关网站上找到邮件列表。


