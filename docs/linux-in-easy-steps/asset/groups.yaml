    # Making a Rescue Disk


    For a much useful rescue disk, in effect a complete Linux on one floppy, you need
    something like "tomsrtbt" available with other bootdisks from http://sunsite.unc.edu/pub/Linux/system/recovery/.
    Also see the Bootdisk Howto under /usr/doc directory.


    PCs and hard disks sometimes fail and it is wise to be prepared. In the event
    of a failure of your PC there may come a time when you can''t boot into Linux.
    All is not necessarily lost if you have a rescue disk which you can use to boot
    Linux and gain access to the system.


    ### RedHat Rescue Disk

    The RedHat installation CD has the capability to be used as a rescue disk. However,
    first you need to make a rescue floppy disk to use in the process:


    - 1 Mount the RedHat installation CD and change to the /dosutils/ directory

    - 2 Insert a blank diskette and enter this command


    ```

    dd if=rescue.img of=/dev/fd0 bs=72k

    ```


    - 3 To use the rescue disk: boot from the CD and enter "rescue" at the boot prompt.
    Insert the diskette when prompted


    Another type of rescue disk is a simple bootable floppy containing your Linux
    kernel. It will help you if you can''t boot from your hard disk, and will start
    up your normal Linux system from where you can run LILO or copy a kernel for loadlin


    ### Creating a Boot Disk

    You must be familiar with rebuilding the kernel for this process. See the next
    chapter for information on this if you are unsure.


    To create a bootable kernel on a floppy disk, insert a diskette and configure
    the kernel as normal. When it comes to build the kernel enter "make fdImage" instead
    of "make bImage"


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_148_0.png)


    # Processes


    Each program running on Linux is called a process. There are many more processes
    running at one time than just the programs you have started. The boot process
    runs a number of processes known as “daemons” for things such as looking after
    the print queue and networking. You can see your own processes using the “ps”
    command:


    ```

    [fred@localhost fred]$ ps

    PID TTY STAT TIME COMMAND

    261 2 S 0:00 -bash

    337 2 S 0:00 sh /usr/X11R6/bin/startx

    338 2 S 0:00 xinit /usr/X11R6/lib/X11/xinit/xinitrc -

    342 2 S 0:13 fwm2 -cmd Fvwm4 -debug /etc/X11/AnotherLevel/fvwm2rc.m4

    412 2 S 0:00 /usr/X11R6/lib/X11/fvwm2//FvwmTaskBar9 4 /tmp/fvwmrca00351

    418 p0 S 0:00 bash

    487 p0 R 0:00 ps

    ```


    Process ID Terminal CPU Time Program (console or used window)


    This output shows the process ID and information about the programs running.


    You can see all processes on the system by adding the "a" and "x" options:


    ```

    [fred@localhost fred]$ ps ax

    PID TTY STAT TIME COMMAND

    1 ? S 0:02 init

    2 ? SW 0:00 (kflushd)

    3 ? SW 0:00 (kswapd)

    4 ? SW 0:00 (md_thread)

    5 ? SW 0.00 (md_thread)

    36 ? S 0:00 /sbin/kerneld

    155 ? S 0:00 syslog

    164 ? S 0:00 klogd

    186 ? S 0:00 crond

    198 ? S 0:00 inetd

    209 ? S 0:00 lpd

    230 ? S 0:00 sendmail: accepting connections on port 25

    ```


    Here you can see the entries for some of the system processes like the Lineprinter
    Daemon (lpd) and sendmail. Notice the process IDs start from 1. The process with
    the pid of 1 is called "init", the process which starts all others.


    All processes are started by another process. That process is called the parent
    process, and those which it starts are called child processes. The ultimate parent
    of them all is "init", which you can see on the previous page. Each process has
    a Process ID, or pid. You can see the pid of each process in the "ps" listing.
    To see the pid of a process parent use the l option. You can see the process IDs
    and parent IDs here are not visible (The process names are not visible because
    the lines are much longer):


    | FLAGS | UID | PID | PPID | PRI | NI | SIZE |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 100 | 500 | 261 | 1 | 0 | 0 | 1228 |


    Process ID Parent ID. You can see this process was started by the system called
    "init" process at start-up


    # Stopping processes

    You can send a signal to stop with the "kill" command. This sends the process
    a called "SIGTERM" which means "terminate". If a process is in an error condition,
    or if it has programmed to "catch" SIGTERM and ignore it, or close down slowly,
    you can use the -9 option to kill the process immediately:


    ```

    kill -9 261

    ```


    Terminate process with pid 261. Only do this if you are sure the process has crashed,
    or is not responding as you could lose data.


    # Monitoring Processes

    Sometimes you may want to see what processes are doing, for instance if you suspect
    one is taking too much memory or time. The command to do this is “top” because
    it shows the top processes in terms of CPU usage.


    | | |

    | :--- | :--- |

    | up 1:38 users, load average: 0.24, 0.12, 0.04 | processes: 35 sleeping, 1 running,
    0 stopped |

    | CPU states: 7.1% user, 1.7% system, 0.0% nice, 1.4% idle | Mem: 63140K used,
    21920K used, 41220K free, 18452K buff |

    | Swap: 0K used, 0K used, 0K free, 13812K cached | |


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_152_png)


    # Priorities

    Priorities range from -19 (highest priority) to 20 (lowest priority), but users
    can only set positive values. As all processes on the system have to share the
    CPU, each process has a priority which determines how much share of the CPU it
    gets. You can see this on the “top” display. There is a command to affect priority
    of processes called “nice”. Run a program with a lower priority than usual. Once
    a program is running, you can change its priority with the “renice” command. You
    can only affect your processes unless you are the superuser, and you can only
    change the priority to a value between 0 and 20.


    ```

    renice -2 -p 301

    renice 15 -p 302

    ```


    Reduce the priority of process 301 by 2. Change the priority of process 302 to
    15


    # Other options to "ps"

    If you want to see who is running what, use the u option to ps:


    ```

    ps ax

    ```


    This will show the username on the output. You can then use "grep" to see the
    processes for a given user:


    ```

    ps ax | grep fred

    ```


    This will show only fred''s processes


    # Sorting the output

    You can produce a sorted output with the "--sort" option, followed by one or more
    sort keys. For example:


    ```

    ps ax --sort "uid,-size,+stime"

    ```


    Sort by User ID. Then by memory used, in reverse order. Then in order of system
    time


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_153_0)


    # Early versions of KTop had a bug which prevented the display from showing. If
    you see this, re-size the window a tiny amount with the mouse and KTop will run
    correctly. If you have KDE you can use "ktop" to show the currently running processes.
    Click to show processes as a "tree" showing parent-child relationships


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_153_1.png)


    Process ID. Command running


    # Managing Disk Space

    It is essential to monitor your disk usage to make sure you don''t run out of
    space. The “du” command is used to show how much space you have used on disks.
    If you don''t specify one, “du” uses the current directory as a base. It shows
    how much space is used in all files in the base directory and all subdirectories
    beneath it:


    ```

    fred@localhost fred]$ du /usr/src/redhat

    1 /usr/src/redhat/BUILD

    1 /usr/src/redhat/RPMS/i386

    1 /usr/src/redhat/RPMS/noarch

    3 /usr/src/redhat/RPMS

    1 /usr/src/redhat/SOURCES

    1 /usr/src/redhat/SPECS

    1 /usr/src/redhat/SRPMS

    8 /usr/src/redhat

    ```


    Disk space used in Kilobytes. This may produce a lot of output so it is possible
    to request just a summary of disk space usage:


    ```

    $ du --summarize /usr/src/redhat

    8 /usr/src/redhat

    ```


    Total space used in that directory and its subdirectories. You might want to show
    usage in all directories but not any additional ones you have mounted. Use the
    “--one-file-system” option for this:


    ```

    du --one-file-system

    ```


    While “du” shows how much disk space has been used, it is sometimes more useful
    to know how much space you have left. The command to do this is “df”, it stands
    for Disk Free:


    ```

    [fred@localhost fred]$ df

    Filesystem 1024-blocks Used

    Available Capacity Mounted on

    /dev/hda7 497667 216255

    255710 46% /

    /dev/hdb5 4088540 615336

    3473204 15% /drivef/

    ```


    You can give “df” a disk name to report on, otherwise it shows all mounted disks.
    Alternatively you can give it a directory name and it will show the disk which
    that is on. You can see above that “df” also shows the percentage of the disk
    which is used up.

