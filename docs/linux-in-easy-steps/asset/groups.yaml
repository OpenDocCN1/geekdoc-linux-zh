    ## The Shell


    This chapter will introduce the shell and explain the different types of shells.
    You will learn how to start shells and use some shell commands. You will find
    out what shell variables are and learn about shell programming.


    ## Covers


    - What is the shell? | 120

    - Shell commands | 122

