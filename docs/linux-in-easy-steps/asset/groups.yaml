    # The X File Manager


    XFM is the name of a program which allows you to view and perform operations on
    files and directories on disks. It also allows you to start applications and is
    really quite powerful.


    Before running xfm for the first time, enter "xfm.install" to set up the default
    configuration options.


    # To browse the hard disk


    Start the file manager by entering "xfm"


    Scroll up and down with left and right mouse buttons


    - File icons – Double-click to open, run, or drag to an application icon


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_70_0.png)


    Click to go up a directory level


    Move around the filesystem by clicking with the mouse


    - Folder icons – Double click to open


    You can’t type anything in the xfm dialog boxes unless the mouse pointer is inside
    the text field you are typing in.


    Using the "File" menu you can: Create a new (empty file); Move or rename a file;
    Create a soft link to a file; Delete a file; or Make a copy of a file.


    In the "View" menu are options to: Create a new folder (directory); Go to your
    home directory, or up a level; Empty a directory; Close the current xfm window.


    The "View" menu has options to select how your files and folders are shown: as
    Icons; as Text; or as a Tree. You can also sort the display by name, date or size;
    Filter by name so only some files are shown; Hide folders (so you can only see
    files in a directory); Mix up files and folders in the display (turning this option
    off places all folders in the window first, before any files are shown); and you
    can choose whether hidden files (those names begin with a dot) are shown.


    # File Types


    When you double-click a file what happens depends on the settings in the "xfmfrc"
    file. If the file is executable it will be run, otherwise its name will be matched
    against entries in the config file. Each entry looks like this:


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_71_0.png)


    ```

    pattern:icon:push action:drop action

    E.g. *:cxfm_c.xpm:xedit $*

    ```


    Clicking with the right mouse button on a file or folder gives a context menu
    which offers a choice of operations to the file or folder.


    # Clicking on a File


    The context menu for a file gives the option to edit, view, move or copy the file,
    create a soft link, delete the file, see file information, or change permissions.


    Permissions are shown as 9 boxes – click in each one to give or take away permission.


    | Owner | Group | Others |

    | --- | --- | --- |

    | w | x | w | x | w | x |

    | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

    | Ok | Restore | Cancel |


    Click to set or reset permissions


    # Clicking on a Folder


    The menu for a folder allows you to open the folder, move, copy or link, delete,
    see information, or set permissions.


    # The XFM Application Window


    When starting XFM you also see a second window called the Application Window.
    This window contains icons which represent application programs, groups of applications,
    and special operations you can perform.


    - HOT TIP: You can right-click the icons to delete, copy, and paste them.

    - Click application icons to start programs

    - Drag file to editor to edit

    - Click group icon to open another application group

    - Drag files to printer to print


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_72_0.png)


    - HOT TIP: Icon files for use in xfm are available in this folder: /usr/X11/R6/lib/X11/pixmaps

    - Click Diskette icon to mount and open window

    - Drag files to trash, and Click to open


    # Editing or Adding Application icons


    1. Right click on a blank area of the application window and choose "Install"

    2. Or Right click on an icon and choose "Edit"

    3. Fill in the name here

    4. Type default directory if required

    5. File to pass to command

    6. Name of icon file to use

    7. Command when double-clicked

    8. Command when file(s) dropped


    - HOT TIP: In the "drop action" field, use "*" to mean filenames.

    - HOT TIP: Special "action" commands include "EDIT" or "VIEW" for files, "OPEN"
    for directories, and "LOAD" to show another application icon.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_72_1.png)


    # Useful X Applications


    There are many applications you will use in X. To start a program for which don''t
    have have menu item, or an icon for, run an XTerm window and enter the program''s
    name at the shell prompt.


    # The Editor


    When editing text, sometimes you will use vi in an XTerm window. Other times you
    might want to use X editor. Start it by entering "xedit" or "xedit filename".


    Click to quit

    Click to save current file


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_73_0.png)


    Click on the "Load" button after choosing the file, to open a new file, enter
    its name here


    # To Find or Replace text


    Press Ctrl+S to search forwards, or Ctrl+R to search in reverse. Enter text to
    find or replace it if required. Click "Search", "Replace", or "Replace All".


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_73_1.png)


    # Xman


    This is an X application for showing the online manual pages (See also chapter
    13). Start it with "xman" and you will see the main window: Click for xman instructions,
    Click to see main page, Choose a manual section from the menu, Find the page you
    want in the list, click to display it. Scroll up and down the left and right mouse
    buttons.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_74_0.png)


    # The Window System


    # XClock


    This simple application does what you''d expect: displays a clock on the screen.
    Xclock accepts the following options on the command line:


    - analog: Display a round clock, as shown

    - digital: Display the date and time as text

    - hd: Set the colour of the hands

    - update: Update every secs. Less than 30 gives a second hand

    - chime: Chimes on the hour and half-hour


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_75_0.png)


    # XCalculator


    Run with "xcalc", this is a calculator type application. You can use the numerical
    keypad or click on the buttons.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_75_1.png)


    # XEyes


    This is a novelty application which displays a pair of eyes on the screen. They
    follow the mouse pointer, wherever it goes. You can set the colours with "fg",
    "bg", "outline", and "center" followed by a colour name.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_75_2.png)


    # XLoad


    This program displays a moving graph of the current processor load. Useful if
    you like to see that kind of thing. Options are:


    - hl: highlight colour

    - update: Update every secs

    - jumpscroll n: How to jump when the graph reaches the far right. Set to 1 for
    smooth scrolling

    - label: Label to put above the graph


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_75_3.png)


    # Standard Options


    Many X applications use the same methods of displaying their windows and consequently
    understand the same command line options. You have seen some already, but more
    are shown here:


    ```

    -geometry widthxheight+Xoffset+Yoffset

    ```


    Set size and position of the window. width and height are in pixels or characters,
    depending on the application. Xoffset is the number of pixels from the left edge,
    or the right edge if negative. Yoffset is the number of pixels from the top edge,
    or the bottom if negative. This means that the four corners of the screen are:


    - bg colour: Sets the background colour

    - bd colour: Sets the border colour

    - fg colour: Sets the foreground colour

    - fn colour: Sets the Font

    - bw n: Sets the Border width

    - title title-string: Sets the window title

    - xrm resource-setting: Sets a resource understood by that application.


    # Resources


    Resources are a standard X way of supplying fixed parameters to programs. A resource
    is a named value and can be given either on the command line or in a resources
    file.


    # Format of resources


    A resource string has the following form: `application*attribute[:attribute]:value`


    The bracketed part is optional and depends on the resource you are setting.


    # Examples


    - XTerm*scrollYBar:on: XTerm scrollbar on

    - XTerm*scrollYBarwidth:5: Set the width of the XTerm scrollbar.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_77_0.png)


    Read the man page for a command to find out which resources it supports.


    # Specifying Resources on the Command Line


    To set a resource value on the command line of a program, use the "xrm" option.
    You need to enclose the resource string in quotes as it contains asterisks which
    might be interpreted by the shell.


    # For Example


    (enter as one line)


    ```

    xterm -fg yellow -bg blue -xrm "XTerm*scrollYBar:on"

    ```


    # Specifying Resources in a File


    Create a file in your home directory called ".Xresources" and place each resource
    string, one per line.


    To make X read these resources when it starts up you need to use the "xrdb" command.
    Add the following line to your X start-up file:


    ```

    xrdb -merge $HOME/.Xresources

    ```

