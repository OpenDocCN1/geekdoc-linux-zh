    # 核心要点


    # in easy steps (轻松入门)


    David Nash


    # 命令


    # X 窗口系统


    | ls | 目录列表 |

    | ls -l | 详细列表 |

    | ls -a | 显示隐藏文件 |

    | cd dir | 切换目录 |

    | pwd | 显示当前目录 |

    | cat files | 显示或合并文件 |


    | startx | 进入 X 窗口系统 |

    | xset | 控制 X 环境 |

    | xterm | X 终端窗口 |

    | xfm | X 文件管理器 |

    | xedit | 文本编辑器 |


    | cp source dest | 复制文件和目录 |

    | cp -a source dest | 递归复制文件和目录并保留属性 |


    | mv oldname | 重命名或移动 |

    | newname | 文件 |

    | rm files | 删除文件 |

    | mkdir dir | 创建目录 |

    | rmdir | 目录 |


    | find -name value | 从目录 dir 开始查找名为 value 的文件 |

    | man command | 查看命令的在线手册 |


    | man -k keyword | 查找与关键词相关的帮助页 |

    | grep string files | 在文件中查找字符串 |

    | chmod attributes | 更改文件的保护属性 |

    | Ctrl+D or exit | 注销或退出 shell |

    | shutdown -r time | 关机并重启 |

    | shutdown -h time | 关机并停止系统 |


    | Vi 编辑器 |

    | Ctrl+U, Ctrl+D | 光标向左、上、右、下 |

    | 0 | 向上向下滚动屏幕 |

    | $ | 跳到行尾 |

    | : | 跳到最后一行 |

    | n | 跳到第 n 行 |

    | i | 在光标处插入 |

    | A | 在行尾追加 |

    | R | 替换字符 |

    | O | 在下方插入行 |

    | ESC | 在上方插入行 |

    | x | 退出插入模式 |

    | dw | 删除字符 |

    | dd | 删除行 |

    | p (小写) | 剪切（复制）或删除光标下方的行 |

    | P (大写) | 在光标上方放置剪切或删除的行 |

    | /string | 正向查找字符串 |

    | ?string | 反向查找字符串 |

    | n | 查找下一个 |

    | wq | 保存并退出 |

    | q! | 不保存退出 |


    # 重定向


    | command>file | 将命令的输出发送到文件 |

    | command<file | 从文件获取输入到命令 |

    | command|2 | 将命令的输出发送到错误输入 |

    | ''command*'' | 使用命令的输出作为另一个命令的一部分 |


