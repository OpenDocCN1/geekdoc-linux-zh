    as flexible. This type of zip file is not used very much in Linux as gzip is used
    in preference.


    # Compression Utilities


    There are several utility programs you can use to work with gzipped programs.
    These are special versions of normal Linux programs which have been modified to
    automatically uncompress their input files.


    | zcat | Uncompress gzipped file to standard output |

    | zcmp | Uncompress gzipped files and compare them |

    | zdiff | Uncompress gzipped files and show differences |

    | zgrep | Uncompress gzipped files and search for string |

    | zmore | Display uncompressed files a screenful at a time |

    | znew | Re-compress .Z files as .gz format |'
