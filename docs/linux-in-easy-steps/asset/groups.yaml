    # Browsing the Web


    The traditional text-only web browser is called Lynx, and is still supplied with
    Linux distributions. However it is a little dated given that most web pages out
    there are intensely graphical, and Lynx is really only suitable for browsing program
    documentation or other text files. If you have KDE you can use KMF for WWW browsing
    although it is a little limited and doesn''t include Java.


    One of the more popular browsers in use is Netscape Navigator. It comes as part
    of the Communicator suite, which includes email software as we will see shortly,
    plus web authoring and usenet news modules.


    Netscape may be supplied with your Linux distribution, otherwise you might find
    it on a CD given away with a magazine. Failing that you will need to download
    it from ftp.netscape.com.


    I recommend using the RPM package, if your Lynx distribution supports it, because
    it will make installation easier.


    # To install Netscape


    - 1. Copy the RPM file into a suitable directory

    - 2. Install using "rpm" or "Glint"

    - 3. You can run Netscape by entering "netscape", or "netscape -component-bar",


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_103_0.png)


    Click to browse the web


    Click to send or read mail


    # Netscape Navigator


    When you start the navigator window the screen looks like this:


    Navigation buttons


    Click for Bookmarks Menu


    Address Bar


    Current web page


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_104_0.png)


    Personal Toolbar Buttons


    ## Surfing the web


    To go directly to a web page, click in the address bar and enter the URL (address)
    of the page. Press return to load the page. As usual you can click on highlighted
    links or buttons in a page to jump to other pages.


    ## Navigation Bar


    - Back: Go to previous pages visited

    - Forward: Return if you pressed "back"

    - Home: Go to start page set in preferences


    ## Bookmarks


    You can store links to pages you frequently visit or which you might want to go
    back to, in the bookmarks menu.


    ## To store a bookmark


    - 1. Navigate to the page you want to store

    - 2. Select "Add Bookmark" to add the link, or "File Bookmark", then a submenu
    to add a bookmark to that submenu


    Connecting to the Internet


    ...cont''d


    # Managing Bookmarks

    You can change, move, or delete bookmarks with the "Manage Bookmarks" menu item.
    This window also allows you to add new submenus (folders) for bookmarks.


    File a bookmark in the Personal Toolbar Folder to make it appear as a button on
    your toolbar. If you create a new folder inside this folder, and place bookmarks
    in it, you will see a menu on the toolbar.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_105_0.png)


    Click + and - to expand and contract the tree


    Drag bookmarks between folders


    Folders containing groups of bookmarks


    # Proxy Servers


    Some ISPs provide a web proxy server. This is a computer on their local network
    where your browser can look first to find web pages. Many popular pages are held
    there and will be loaded quicker.


    # To configure a proxy


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_105_1.png)


    - 1. Select Preferences on the Edit menu

    - 2. Click here to select proxy configuration

    - 3. Then click the button

    - 4. Fill in the address of the http proxy server

    - 5. And the port number


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_105_2.png)


    104 Linux in easy steps


    # Using Netscape for Email


    To use Netscape Messenger for receiving email you will need an email account with
    a POP3 username and password. You will need an SMTP connection for sending email.


    # To set up the accounts


    - 1. Start messenger by clicking the button bar or selecting from the communicator
    menu

    - 2. Choose Preferences from the Edit menu


    Click on the arrow to expand mail preferences


    - 3. Click "Identity" then fill in your details in the boxes

    - 4. Click to select mail servers

    - 5. Select POP account and click on "Edit"


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_106_0.png)


    Click Remember Password if you don''t want to enter your POP3 password each time
    you get mail.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_106_1.png)


    - 6. Enter SMTP server name and username here

    - 7. Enter POP3 server name and account login name


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_106_2.png)


    # Receiving and reading mail


    - Click the Get Msg button


    Mail appears in the Inbox


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_107_0.png)


    - Double-click a message to open

    - Delete unwanted messages

    - Click to show message previews


    # Sending Mail


    - Click New Msg, or Reply when reading a message to get the message compose window

    - Click to send the message, or select Send Later on the File menu if you are
    not connected

    - Click in the box and type the recipient''s address

    - Click in the subject box and type the subject of the message.

    - Enter the message here. If you are sending to someone who can accept HTML mail
    you can make the mail more interesting with fonts and colours


    > Some people don''t like HTML mail because their software cannot display it.
    It''s safer to always send plain text.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_107_1.png)


    Linux in easy steps


    # Other Mail Software


    It is not necessary to use any special mail software with Linux, as it comes with
    a set of tools.


    # Fetchmail

    Fetchmail is a utility which can download messages. They are placed in your home
    directory.


    # Configuring Fetchmail

    Normally you would need a password to get files from.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_108_0.png)


    # Running Fetchmail

    To check mail, type “mail”.


    # Reading Mail

    Type “mail” to read messages. Press q to quit.


    # Sending Mail with Sendmail

    It is also possible to use Mail to send messages.


    # Configuring Sendmail

    Sendmail is configured with a file “etc/sendmail.cf”. This file is quite complicated
    but there are really only two entries you need to set. The first is called the
    “Domain to Masquerade as”. This means the name of your email address (not including
    the user). Edit this file and find a line which begins DM.


    ```

    DMmyhost.isp.net

    ```


    ```


    Next you have to enter the name of your ISP’s SMTP server. This is the computer
    which you send mail to for forwarding to the recipient. (Don''t confuse this with
    the POP3 server you get mail from.) It is labelled DSsmtp:


    ```

    DSsmtp.isp.net

    ```


    Put your own email sending server here


    # Sending Mail

    To actually send a message, use the Mail command:


    ```

    mail -s subject fred@somedomain.net

    Hi Fred

    EOT

    ```


    press Ctrl+D to send the mail


    # Copying Files with FTP

    Around the internet are many FTP servers which contain files for download. These
    files are mainly software packages but also multimedia files such as music, images
    and others.


    # Anonymous Access

    Normally you would need a password to get files from somebody''s computer. However
    a standard has emerged to allow anonymous access for anyone:


    Username: anonymous

    Password: your email address


    # Using FTP

    As usual there are graphical clients and a standard text-mode client.


    > Start FTP and connect to the remote site


    ```

    ftp sunsite.unc.edu

    Connected to sunsite.unc.edu.


    220- Welcome to UNC''s MetaLab ftp archives!

    User: anonymous

    Password:

    230 Guest login ok, access restrictions apply.

    ftp|

    ```


    FTP Prompt Log in with anonymous, and your email address for the password

