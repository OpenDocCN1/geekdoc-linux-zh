  - '[PAGE 9]


    # # What is Linux?


    Linux is an operating system for computers, just like MS-DOS, Windows and MacOS.
    Linux belongs to the Unix family of operating systems, a powerful type of system
    not found on home computers before Linux came along.


    Linux, however, can be used for many different purposes: at home for games, at
    work, on desktop workstations or on network servers. There is even a car stereo
    that plays digital music files and that runs on Linux.


    > HOT TIP Linux is pronounced with a short ''i'', something like ''Linn-Ucks''.


    The big thing about Linux is that it is free software. It means two things: firstly
    it means that you don''t have to pay for it and secondly that you can have complete
    access to the source code of Linux. You may then copy it, alter it and redistribute
    it to anyone else you want. The only condition is that the source must remain
    freely available to all.


    Although by the terms of the licence, no one can charge for Linux, you will have
    to pay for distribution. This could be on a plain CD-ROM, in a box with a manual
    or via the Internet. The charge for distribution will vary accordingly and in
    the latter case will be only telephone and Internet access fees (if any). Linux
    people like to say, “think free speech, not free.”


    > HOT TIP www.linux.org contains a wealth of information and links about every
    aspect of Linux distributions, Applications, Hardware, User Groups and more.


    This freedom means that Linux has a great deal of support from people all over
    the world who collaborate in it''s development and keep in touch via the Internet.
    As a result Linux has most of the features of any other PC operating system and
    in many cases outperforms its commercial rivals. Linux is known for its stability,
    maintaining that it very rarely “crashes” or needs to be rebooted, even when installing
    new software.


    When bugs are occasionally found, the open source community has an excellent record
    of responding quickly. Linux fixes are usually released within days, sometimes
    within hours, of a bug being discovered.'
- md: '

    # History


    Linux was developed in 1991 by a student at the university of Helsinki by the
    name of Linus Torvalds.


    He was dissatisfied with the facilities that were available to him in the university
    and decided it would be fun to write an operating system for himself. When he
    had something vaguely recognisable, he released it to a small group of enthusiasts
    known to him on the Internet. This group assisted Linus and contributed modifications
    and new features until the kernel of the operating system was working.


    The kernel of the operating system is the central core of the system, which interacts
    with the computer and provides services for the user and application programs
    to use. Around this kernel are many programs providing most of the commands available
    in Linux.


    www.linuxhq.org is the place to get the latest on the Linux kernel releases. It
    also has links to the latest kernel files for download.


    In Linux, these programs have mostly come from the GNU project. This aims to produce
    a completely free operating system based on the same principles as, and compatible
    with, the Unix operating system. GNU programs are all released under a licence
    called the GNU Public Licence, which describes the principles of free, open source
    software. It does not permit software covered by it to be reused, except as part
    of another package also covered by the GPL. In this way GNU software remains free.


    freshmeat.net has all the latest releases for Linux. It is updated throughout
    the day and has a members'' searchable archives.


    Since a number of the programs used with the Linux kernel are GNU programs, some
    people believe that the operating system should generally be known as GNU/Linux.


    Unfortunately for them the general public to shorten names not lengthening them,
    therefore it is unlikely that the term GNU/Linux will become popular.


    In 1994 Linux was released as version 1.0. It had over 100,000 users by this time
    and has since become much better known. It is estimated that there are at present
    8 million users worldwide. With some of the biggest IT vendors now supporting
    Linux this number is sure to continue rising.


    # Introducing Linux


    # ...cont''d


    Linux is under constant development. In order to ensure that a stable version
    is always available for normal users, whilst maintaining the development of new
    functions and new additions which might make the kernel a little less reliable,
    Linux has a split version number model.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_11_0.png)


    The kernel version number is displayed when you login to Linux.


    Versions with an even minor version number (the ''0'' in ''1.0'') are stable,
    whilst those with an odd minor version number (such as ''1.1'') are development
    or test versions of Linux.


    At the time of writing, the most recent stable version is 2.2. The old 2.1 development
    branch of Linux was incorporated into the previous stable version 2.0.36, and
    the result was 2.2.0, with a new development branch (2.3) to be started. New stable
    versions incorporating fixes and enhancements are added as 2.2.1 etc. and radical
    new features begin their life in the 2.3.0, 2.3.1 versions, and so on.


    Since version 1.0 Linux has had many extra features added by developers all over
    the world. Features such as:


    ## Graphical environments


    Providing windows and integrated desktops.


    ## Networking


    Providing interworking with the internet, other computers and with industry-standard
    platforms.


    ## Multimedia capabilities


    Sound, graphics and video.


    Linux has improved to the extent that major players in the computer industry are
    starting to take notice. Many major database and office tools are now being developed
    for Linux. Linux has now truly come of age.


    # 10 Linux in easy steps


    ## Installing Linux


    Here we describe how to install Red Hat Linux, one of the most popular Linux distributions.
    Your version might differ but all the important concepts will be there.


    > Throughout the Red Hat install program, use Tab to move from field to field.
    Press Space to select an item, press Return when you have finished that screen
    and remember all the on-screen messages!


    - Insert the Red Hat CD-ROM and boot the PC from it. If you cannot boot from the
    CD, restart your computer in MS-DOS mode, then go to the DOSUTILS directory on
    the CD-ROM and enter the following command:


    ```

    autoboot

    ```


    This will start the Linux install session.


    - Follow the on-screen prompts until you get to "installation class" and Select
    "Custom". This allows you to control the installation of Linux.


    - Select "Disk Druid" when asked. You will now have to choose a disk partition
    to hold your Linux installation.


    > See chapter three for more information about disks and partitions in Linux.


    ## Disks and Partitions


    A partition is like a logical disk, like C;, or D: in Windows. Normally you will
    have more drive letters than actual physical hard disks in your system. This is
    because the hard disk is partitioned into sections. In Linux the first hard disk
    is known as *hda* and the second as *hdb*. The partitions are numbered in sequence
    hda1, hda2, hdb1, and so on. Each physical disk will have one primary partition
    and a number of logical partitions. Windows calls the first primary partition
    on the second disk D: and so on through the disks. Next it gives letters in order
    to have all the other partitions on the first disk, then on the second, and so
    on.


    Because of this, changing the OS type to Linux on a partition can change your
    Windows drive letters. The best way to avoid this is to use the last logical partition
    on your system for Linux.


    # Introducing Linux


    # ...cont''d


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_13_0.png)


    | Mount Point | Device | Requested | Type |

    | :--- | :--- | :--- | :--- |

    | | hda3 | 500M | Win95 |


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_13_1.png)


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_13_2.png)


    # 12 Linux in easy steps


    # ...cont''d


    10 Next you will be asked a range of questions about: using a LAN (Local Area
    Network), which timezone you are and which services to start (the defaults should
    be adequate).


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_14_0.png)


    11 Older versions of Linux with kernels less than 2.2.0, use the names "lp1" and
    "lp2" for LPT1 and LPT2 respectively.


    12 Now choose a root password. "Root" is the name of the superuser, used for all
    administrative tasks on Linux so this is very important. Do not forget and don''t
    tell anyone!


    13 Now you have the option to make a bootdisk. It is recommended that you do so,
    as in an emergency it could be the only way you have of booting your Linux system.


    14 Finally configure the boot loader, LILO. This is the most important step as
    it allows you to actually boot into your new Linux installation. You have the
    choice of placing LILO on the partition with Linux or on the Master Boot Record
    (on your Windows partition). The latter option is recommended as this partition
    is normally the boot partition.


    If you do have an existing Windows partition make sure it is in the LILO configuration.
    You may want to set it to the default.

    '
  mdcn: '


    # 历史


    Linux 是由赫尔辛基大学的一位名叫 Linus Torvalds（托瓦尔兹）的学生在 1991 年开发的。


    他对大学提供的设施感到不满，决定为自己写一个操作系统会很有趣。当他写出一个大致可以识别的东西时，他将其发布给了互联网上认识的一小群爱好者。这组人帮助了 Linus
    并贡献了修改和新功能，直到操作系统的内核运行正常。


    操作系统的内核是系统的核心枢，它与计算机交互并为用户和应用程序提供服务。在这个内核周围有许多程序，提供了 Linux 中可以使用大部分命令。


    www.linuxhq.org 是获取 Linux 内核发布最新动态的地方。它还提供了最新内核文件下载的链接。


    在 Linux 中，这些程序大部分来自 GNU 项目。该项目旨在产生一个基于 Unix 操作系统相同原理且兼容的完全自由操作系统。GNU 程序均根据名为“GNU
    通用公共许可证”（GNU Public Licence）的许可证发布，该许可证描述了自由、开源软件的原则。它不允许受其许可保护的软件被重用，除非作为另一个同样受
    GPL 保护的软件包的一部分。通过这种方式，GNU 软件保持了自由。


    freshmeat.net 拥有 Linux 的所有最新版本。它全天更新，并拥有成员可搜索的存档。


    由于用于 Linux 内核的许多程序都是 GNU 程序，一些人认为操作系统通常应该被称为 GNU/Linux。


    遗憾的是，普通公众倾向于缩短名称而不是加长名称，因此 GNU/Linux 这个术语不太可能流行。


    1994 年，Linux 发布了 1.0 版本。到那时，它已经有了超过 10 万用户，并从那以后变得广为人知。据估计，目前全球有 800 万用户。随着现在一些最大的
    IT 供应商开始支持 Linux，这个数字将继续上升。


    # 介绍 Linux


    # ...续上


    Linux 正在处于不断开发中。为了确保普通用户始终有一个可用的稳定版本，同时维持可能使内核可靠性略微下降的功能和新新增的开发，Linux 采用了一种拆分版本号的模型。


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_11_0.png)


    当你登录 Linux 时，会显示内核版本号。


    次版本号为偶数（''1.0'' 中的 ''0''）的版本是稳定的，而次版本号为奇数（如 ''1.1''）的版本是 Linux 的开发或测试版本。


    在编写时，最新的稳定版本是 2.2。Linux 旧的 2.1 开发分支已合并到之前的稳定版本 2.0.36 中，结果是 2.2.0，并启动了一个新的开发分支（2.3）。包含修复和增强的新稳定版本将以
    2.2.1 等形式添加，而激性的新功能将从 2.3.0、2.3.1 等版本开始其生命。


    自 1.0 版本以来，世界各开发者为 Linux 添加了许多额外功能。功能如下：


    ## 图形化环境


    提供窗口和集成桌面。


    ## 网络


    提供与互联网、其他计算机以及行业标准平台的互操作性。


    ## 多媒体能力


    声音、图形和视频。


    Linux 的改进已经提高到计算机行业的主力企业开始关注它的地步。许多大型数据库和办公工具现在正在为 Linux 进行开发。Linux 现在已经真正成熟了。


    # 10 步上手 Linux


    ## 安装 Linux


    在这里我们描述如何安装红帽 Linux（Red Hat Linux），它是最流行的 Linux 发行版之一。你的版本可能不同，但所有重要概念都会在那里。


    > 在整个红帽安装程序中，使用 Tab 键在字段间移动。按 Space 键选择项目，在完成屏幕操作后按 Return 键，并记住屏幕上的所有信息！


    - 插入红帽 CD-ROM 并从其启动 PC。如果你无法从 CD 启动，请以 MS-DOS 模式重启电脑，然后进入 CD-ROM 上的 DOSUTILS 目录并输入以下命令：


    ```

    autoboot

    ```


    这将启动 Linux 安装会话。


    - 按照屏幕上的提示操作，直到进入“安装类型”（installation class）并选择“自定义”（Custom）。这允许你控制 Linux 的安装。


    - 在被询问时选择“磁盘精灵”（Disk Druid）。你现在必须选择一个磁盘分区来存放你的 Linux 安装。


    > 关于 Linux 中磁盘和分区的更多信息，请参见第三章。


    ## 磁盘与分区


    分区就像逻辑磁盘，类似于 Windows 中的 C: 或 D:。通常情况下，你系统中的驱动器号比实际物理硬盘要多。这是因为硬盘被分成了若干区域。在 Linux
    中，第一块硬盘被称为 *hda*，第二块硬盘被称为 *hdb*。分区按顺序 hda1、hda2、hdb1 等进行编号。每个物理磁盘将有一个主分区和若干逻辑分区。Windows
    将第二个磁盘上的第一个主分区命名为 D:，并此类推通过磁盘。接下来，它按顺序为第一个磁盘上的所有其他分区、然后是第二个，以此类推。


    由于由于，将分区上的操作系统类型更改为 Linux 可能会改变你的 Windows 驱动器号。避免这种情况最好的方法是使用系统的最后一个逻辑分区来安装 Linux。


    # 介绍 Linux


    # ...续上


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_13_0.png)


    | 挂载点 | 设备 | 请求大小 | 类型 |

    | :--- | :--- | :--- | :--- |

    | | hda3 | 500M | Win95 |


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_13_1.png)


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_13_2.png)


    # 12 步上手 Linux


    # ...续上


    10 接下来你会被问一系列问题，关于使用局域网（LAN）、你所在的时区以及启动哪些服务（默认设置应该足够）。


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_14_0.png)


    11 内核小于 2.2.0 的旧 Linux 版本分别使用 "lp1" 和 "lp2" 作为 LPT1 和 LPT2。


    12 现在选择 root 密码。“Root”是超级用户的名称，用于 Linux 上所有的管理任务，因此非常重要。不要忘记，不要告诉任何人！


    13 现在你有制作启动盘的选择。建议你这样做，因为在紧急情况下，这可能是你启动 Linux 系统的唯一方法。


    14 最后引导加载程序 LILO。这是最重要的一步，因为它允许你实际进入新安装的 Linux。你可以选择将 LILO 安装在 Linux 所在的分区，或安装在主引导记录（在你的
    Windows 分区上）。后后者是推荐的，因为该分区通常是启动分区。


    如果你确实有一个现有 Windows 分区，请确保它在 LILO 配置中。你可能希望将其设置为默认值。


    '
