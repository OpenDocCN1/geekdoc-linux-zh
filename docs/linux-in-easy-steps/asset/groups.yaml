    ## Creating a new Desktop Icon


    - 1. Right-click on the desktop and select "New..." then "Program" from the menu


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_86_0.png)


    - 2. Change the name to something appropriate & click OK


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_86_1.png)


    - 4. Click the "Execute" tab


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_86_2.png)


    - 5. Enter the program to execute


    - 6. You can specify a directory if necessary


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_86_3.png)


    - 7. Click to select an icon


    - 8. Click on an icon and then click "OK"


    - 9. Click "OK" in the main window. The desktop will now show the selected icon.
    Click it once to run the program.


    To add an icon to the panel, you must first create one on the desktop or in a
    folder window (Using KFM, page 88) then drag a copy of it to the panel.


    ## Automatically mounting Disks


    You can create an icon for a removable disk, like a CD-ROM, or a floppy disk,
    and it will automatically mount the disk and open a file manager window to view
    the disk when it is clicked.


    ## Creating a Device Icon


    - Make sure there is an entry for the device in `/etc/fstab` (see chapter 3)


    - Right-click on the desktop and select "New..." then "File System Device"


    - Right-click the new icon and select properties, then click on the "Device" tab


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_87_0.png)


    - Enter the name of the device in the `/dev` directory


    - Click on the icon buttons and select an icon to show when the disk is mounted,
    and one for when it is not mounted


    - When you click on the icon the disk will be mounted, the icon will change, and
    a KFM window will open to show the disk


    - To unmount the disk, right-click the icon and select "unmount"


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_87_1.png)


    KDE provides "mounted" and "unmounted" versions of icons for hard disks, floppy
    disks, and Zip disks.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_87_2.png)


    ## Using KWM


    KWM is the KDE window manager. Windows in KWM look like this:


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_88_0.png)


    The title bar shows the name of the program. If the name is too long it scrolls
    left and right.


    ### Multiple desktops

    KWM provides 2, 4, or 8 desktops to work on. You can keep different windows on
    different desktops, and switch between desktops using Ctrl+Alt+number or using
    the pager on the panel. Windows can be moved from one desktop to another using
    the window operations menu, and marked as “sticky” so they are visible on every
    desktop.


    ### KWM Keys

    - Alt+F1: Show “K” menu

    - Alt+F2: Run a program

    - Alt+F3: Show window operations menu

    - Alt+F4: Close window

    - Alt+Esc (or Ctrl+Esc): Show session window

    - Ctrl+Alt+Esc: Kill mode. Click on a window to kill a program. ESC cancels.

    - Alt+Tab: Switch to next window

    - Ctrl+Tab: Switch to next desktop


    HOT TIP

    You can redefine these keys using the KDE Control Centre.


    The K Desktop Environment 87


    ## Using KFM


    KFM is the KDE file manager. To start KFM use the button on the panel, the "File
    manager" item on the menu, or, to start a window on a particular directory, enter:


    ```

    kfmclient folder directory

    ```


    Up one directory level


    Back to previous


    Show home directory


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_89_0.png)


    Tree View. Click the triangles to expand or contract branches


    Address bar


    Folders – double click to enter


    Main view. Select "Icon", "Long" or "Text" view in the view menu


    Files


    KFM works on URLs (uniform resource locators, or internet addresses). It can be
    used as a file browser, a web browser, or an ftp client by entering an address
    of the right type in the address bar.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_89_1.png)


    If you are viewing a directory which contains a web page called "index.htm" or
    "index.html" KFM will display it if you enable "View as web page".


    For example:


    ```

    file:///home/fred

    http://www.kde.org

    ftp://sunsite.unc.org/pub/linux

    ```


    When browsing directories you can open a file by clicking on it. If KFM knows
    what application to use it it will open automatically, otherwise it will ask you
    which application to.


    For FTP, you can drag files between a KFM window opened on an FTP site and a local
    directory. The files will be copied transparently.


    ## Using KDE to dial the Internet


    KDE has a very easy-to-use internet dialier called KPPP. To use it you will need
    the following information from your internet service provider (ISP):


    - Number to dial

    - Type of authentication

    - IP address of name server(s) and your domain name

    - If you have a static IP address and if so, what it is

    - If you don''t know the type of authentication to try PAP or CHAP.


    - Click here to set up the connection

    - Click "New" to add an account

    - Enter name of account and number to dial

    - If your ISP requires a login process change authentication to "script",

    - Enter your domain name here

    - Enter your name server address then click "Add",

    - If you chose script authentication click click here and enter "expect" and "send"
    pairs


