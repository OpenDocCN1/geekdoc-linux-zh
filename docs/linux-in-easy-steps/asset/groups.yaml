    ## 内核升级


    内核可以通过源码形式进行升级，或者如果你的发行版提供了二进制包（如 RPM），则只需安装新包即可。这种方法更简单，但灵活性较低；而且如果你重新配置过内核，除非你升级了内核源码并重新构建，否则在升级后将无法获得相同的配置。


    ## 安装新的内核源码树


    当新的 Linux 内核发布时，源码会在 http://www.kernel.org 提供。这是 Linux 的主网站，包含了通往本地镜像站的链接。你也可能在
    CD-ROM 上找到内核源码。


    源码通常是一个 gzipped 压缩的 tar 包，需要在 "/usr/src" 目录下进行解压：


    - 将 tar 文件复制到 /usr/src 目录并进入该目录

    - 执行 tar xvzf linux-2.2.5.tar.gz 解压文件


    ```bash

    tar xvzf linux-2.2.5.tar.gz

    ```


    目录 "/usr/src/linux" 是指向实际内核源码目录的链接。为新版本重新创建此链接


    ```bash

    rm linux

    ln -s linux-2-2-5 linux

    ```


    删除旧链接并为新版本重新创建链接


    ![](img/f2019df07bd67d0d6801cbad23cc32b_179_0.png)


    ## 应用补丁


    由于内核源码非常巨大，版本的更新以补丁文件的形式发布，这些仅包含新旧版本之间的差异。要应用补丁，将补丁文件复制到 "/usr/src" 并进入该目录，然后应用补丁：


    ```bash

    bunzip2 patch-2.2.5.bz2

    patch < patch-2.2.5

    ```


    解压补丁并应用补丁


    ## 获取在线帮助


    在本章中，我们将学习如何使用在线手册来查找 Linux 命令。你将学习 Linux HOWTO 数据库，以及在需要时去哪里获取更多信息。


    ## 目录


    - man 命令 | 180

    - Info 页面 | 182

    - 获取快速帮助 | 183

    - Linux HOWTOs | 184

    - 软件包文档 | 185

    - 其他信息来源 | 186


    ## man 命令


    获取任何 Linux 命令的帮助都很容易，因为整个手册都是在线的，可以从硬盘访问。其中包含了所有用户命令、系统管理命令、文件格式，以及针对 Linux 程序员的运行时库函数和系统调用的手册页。


    要查看特定命令的条目：


    - 输入 man 命令

    - 按 Return 键向上滚动一行，按空格键翻页，按 q 退出


    | CAT(1) | |

    | --- | --- |

    | NAME | cat - 连接文件并打印到标准输出 |

    | SYNOPSIS | cat [-benstuVAET] [-number] [-number-nonblank] [-squeeze-blank] [-show-nonprinting]
    [-show-ends] [-show-table] [-show-all] [-help] [-version] [file...] |

    | DESCRIPTION | 此文档不再维护，内容可能不准确或不完整。TexInfo 文件文档现在是权威来源。 |


    此手册页记录了 GNU 版本的 cat。cat 将每个给定文件的内容（或在给出节点或给定名为 ''-'' 的文件时提供标准输入）写入标准输出。


    条名和简要描述 详细描述


    如果你想搜索某个单词，按 / 然后输入该单词并按 Return。


    在线手册被分为 7 个章节。章节编号如下：


    | 1 | 用户命令 |

    | 2 | 内核系统调用 |

    | 3 | 标准库函数 |

    | 4 | 特殊文件 |

    | 5 | 文件格式信息 |

    | 6 | 游戏 |

    | 7 | 其他 |

    | 8 | 系统管理命令 |

    | 9 | 非标准内核例程 |


    有时一个条目出现在多个章节中。手册条目的全名包含括号中的章节号，例如 *ls(3)*。


    当一个单词在多个手册章节中都有条目时，你可以在 man 命令的条目名称之前输入章节号，告诉 man 命令你想查看哪个章节。


    例如 *kill* 既是用户命令，也是程序员的系统调用。要查看用户命令，输入：


    ```bash

    man 3 kill

    ```


    如果你不知道 *man* 条目的名称该怎么办？


    使用 "*man -k keyword*" 可以找到在其关键词列表中包含该关键词的页面。


    **有关关于 man 的更多信息，请使用命令 man man。**


    ## Info 页面


    许多命令以“Info”页的形式提供了更多信息。这些页面可以像 man 一样浏览，但功能更先进，章节之间有超链接。在某些情况下，Info 文档被认为比相应的
    man 手页更新，尽管我尚未发现包含不准确信息的 man 手页。


    要查看关于 cp 命令的 Info 页面，输入：


    ```bash

    info cp

    ```


    如果你省略命令名，将看到一个介绍页。


    Info 页面按“节点”组织。一个节点是关于单个主题的一组页面。你可以通过以下按键在一个节点的页面间移动：


    - Space 下一页

    - DEL 上一页


    节点形成一个链，链中除第一个和最后一个外，每个节点都有上一个节点和下一个节点。按 p 移动到上一个节点，按 n 移动到下一个节点。按 b 回到链中的第一个节点，按
    e 去到链中的最后一个。


    有些页面包含菜单。菜单项显示如下：


    - *Item*


    选择菜单项按 m 然后输入菜单项名称。


    按 ? 查看完整的菜单列表，退出查看器按 q。教程可以通过 h 查看详情，返回初始页可以按 d。


    ## 获取快速帮助


    有时你知道要使用的命令，但不记得它的精确语法。对于这些情况，许多命令提供了快速帮助，可以通过为命令添加 --help 来查看。


    例如显示 tar 命令的帮助：


    ```bash

    tar --help

    ```


    上面的命令将显示关于 tar（归档）命令的一或两页内容，它是创建归档最常用的命令。


    如果帮助超过一页，你可以将其传递给 more 命令。输入：


    ```bash

    tar --help | more

    ```


    并不是所有命令都支持这种快速帮助。有些显式支持，如上面的 --help 选项。其他命令则不友好，不提供此类信息。


