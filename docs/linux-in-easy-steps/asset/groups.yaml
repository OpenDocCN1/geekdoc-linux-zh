  - '[PAGE 58]


    # Setting Up X


    The disadvantage to all this flexibility is that before you run X you have to
    configure it. Normally this will be done when you install Linux. This is not always
    the case, however, and you may want to change things later.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_58_0.png)


    www.xFree86.org is the website of XFree86 software provides the X window system
    in Linux.


    # The XFree86 Configuration File


    XFree86 keeps its configuration details in a file called "XF86Config" (capitalisation
    is important!). Unfortunately there are multiple places this file could reside,
    normally in the /etc directory, but possibly in various branches beneath this
    directory. Luckily you don''t have to edit this directly if you don''t want to
    because there are a couple of tools you can use to help.


    # XConfigurator


    This is the Red Hat version of xf86config, described below. Although textual,
    it colour to good effect and simulates windows and buttons. If you have this on
    your system it is preferable to xf86config.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_58_1.png)


    If you get the mouse type you won''t be able to use X properly. Exit X with Ctrl+Alt+
    Backspace and try again.


    # "xf86config"


    This program is supplied with XFree86. It asks a series of questions to which
    the answers are usually numbers chosen from a list. It starts by asking you about
    your mouse. Enter the number of your mouse type and answer any supplementary questions.


    Next you will be asked about your keyboard. Answer the questions about your keyboard
    layout.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_58_2.png)


    Don''t specify a high frequency unless you know it will work with your monitor.
    You can damage your monitor permanently!


    Now the more difficult questions start. You have to specify a monitor type. Unfortunately
    xf86config doesn''t make sense about monitor, only frequency ranges. Some preset
    types are given and you should choose one of these if you can, otherwise you will
    need your monitor manually to find out the horizontal and vertical frequencies.
    In doubt choose a low number (one of the first preset ones) and work up. You can
    damage your monitor if you specify too high a horizontal frequency.


    After that you have to choose your graphics card type.


    5 The X Window System'
  - '[PAGE 59]


    There is a long list of card types, if you can''t finds yours try to find one
    we with the same X chipset or a compatible one.


    The next question asks which X server you want to use. The sensible choice here
    is to take the last option offered – the one recommended in the list of cards.


    Now the program will offer to make a symbolic link to the X server. This is so
    that running “X” will always run the correct server, whichever one you you chose.
    Only say no if you know what you are doing and have a good reason.


    When that is done you have to enter the amount of memory you have on your display
    card. This is usually at least 4 Megabytes (4096K) although older cards will have
    less. If you enter a lower amount you will not be able to get such a high resolution
    display.


    You are prompted for the card name – this can actually be anything and it makes
    sense to accept the one prompted unless you used a compatible or generic one from
    the list. The next question is about RAMDAC, a feature of some display cards and
    you should normally skip this. Also say “no” to clockchip selection as most cards
    don’t have a programmable clock chip anyway.


    The program now asks if you want to probe the card – it is a good idea to say
    yes as it can get more information about the capabilities of the card.


    That’s the really technical stuff out of the way – now you have to choose resolutions
    and colours. There are four colour depths available:


    +   - 8 bits-per-pixel (256 colours)

    - 16 bits-per-pixel (64 thousand colours)

    - 24 and 32 bits (millions of colours)


    Some cards won''t work with them all. You will normally choose one (how to do
    this, later) but now you have to select a list of resolutions available in each
    colour depth.'
  - '[PAGE 60]


    They are given in text form “800x600” means 800 pixels horizontally and 600 pixels
    vertically. Unless you have a really good monitor (and good eyes) you shouldn''t
    choose greater than this if you have a 15” monitor. I recommend 1024x768 for 17”
    monitors and 1280x1024 for larger screens. From the menu set your chosen resolution
    to be the first one in the list. This is the one which will display when you start
    X.


    Finally you will be asked if you want to write the file to the default place.
    Accept this. Your X server is now configured and you can try it by entering “startx”.
    If there is a problem screen, it will return to a text screen with some errors
    displayed on screen. You can try the xf86config procedure again with some different
    choices. Try lower resolutions or a less ambitious monitor selection.


    When you are in X you can change the resolution by pressing Ctrl+Alt+numeric pad
    “+ and “-”. If you have to exit and can’t find a way out (perhaps you don’t have
    a window manager running) press Ctrl+Alt+backspace.


    # Choosing the Resolution and Number of Colours


    When you have a working X setup you will want to set the colour depth and resolution.
    You can set the resolution by making sure your resolution is first in the list.
    You can edit XF86Config (remember where xf86config wrote it) and find the line.
    Make sure you choose the right one as there will be several for different display
    types and colour


    To start X at the desired number of colours (or bits-pixel) you need to use “startx
    --bpp 16” or similar instead of just “startx”.


    If you use XDM or KDM to boot directly into X you should add “-bpp 16” or similar
    to the end of the server line in “/etc/X11/xdm/Xservers”. The line will then look
    like this:


    ```

    :0 local /usr/X11R6/bin/X -bpp 16

    ```'
  - '[PAGE 61]


    # Configuring X


    XSetRoot

    This program can be used to set up many aspects of the appearance of the X desktop.


    To set the background to a solid colour


    Enter "xsetroot -solid color"


    For example


    ```

    xsetroot -solid blue

    ```


    To set the background "wallpaper"


    The picture should be in bitmap format. Enter the following command:


    "xsetroot -bitmap filename"


    Some bitmaps are located in

    "usr/X11R6/include/X11R/bitmaps".


    For example (enter as one line):


    ```

    xsetroot -bitmap /usr/X11R6/include/X11/

    bitmaps/escherknot

    ```


    You can also set the background to be a uniform grey

    ("xsetroot -grey") or to a cross-hatch with independent X

    and Y spacing. Experiment with values between 1 and 16 for

    X and Y. ("xsetroot -mod X Y").


    Setting the cursor


    To set the cursor when it is outside of any windows, enter

    "xsetroot -cursor_name name"


    The default is an "X" (use name "X_cursor\). Some other\interesting names you
    can use are


    arrow; box_spiral; centre_ptr; circle; coffee_cup;

    diamond_cross; cross; cross_reverse; dot; dotbox;

    draft_large; draft_small; gumby; hand1; hand2; mouse;

    heart; spider; and top_left_arrow.


