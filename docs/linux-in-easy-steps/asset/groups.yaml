    # ...cont''d


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_62_0.png)


    When you have found XSet and XSetRoot settings that you like put the commands
    in your start-up file make them permanent.


    # XSet


    This program has a similar name to "xsetroot" but is concerned with setting up
    aspects of the X environment which are not visible.


    # DPMS


    If you have an "energy star" or DPMS-compliant monitor which can go into low-power
    modes to save energy you can use XSet to set the following times:


    ```

    xset dpms standby suspend off

    ```


    # Standby


    Time in seconds to go to "standby" mode. o=disable.


    # Suspend


    Time in seconds to go to "suspend" mode. o=disable.


    # Off


    Time in seconds to go into DPMS "off" mode. o=disable.

    You might find that you can only differentiate one or two of these modes, depending
    on your monitor.


    Example:


    ```

    xset dpms 120 240 300

    ```


    # Mouse Settings


    You can also use XSet to control mouse behaviour. The mouse pointer can be made
    to move at a higher speed after you have moved it by a certain number of pixels
    in a short time. To set the speed multiplier and the pixel threshold enter:


    ```

    xset m acceleration threshold

    ```


    A typical setting would be:


    ```

    xset m 4 3

    ```'
- md: '

    # Starting and Stopping X


    When you first log in to Linux you are in a text screen. You can start the X Window
    system by the command:


    ```

    startx

    ```


    When you enter this command the X server will start up and the display will switch
    to a graphical display. If you normally have 6 text virtual consoles, the X screen
    will be virtual terminal 7 so you can switch to a text screen with Ctrl+Alt+1
    and back to X with Ctrl+Alt+7.


    When the X server starts it will look for a file in your home directory called
    .xinitrc (with the dot). Any commands in this file will be run. This is normally
    used to start a Window Manager, to run any configuration commands like keyboard
    mapping, or to start X clients like the clock.


    If this file doesn''t exist it will look for the global xinitrc (without the dot)
    in the “etc/X11/xinit” directory and use this instead.


    When a Window Manager is specified it should be the last entry in the file. This
    will make sure that when you exit the Window Manager, X will exit as well.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_63_0.png)


    If you find your backspace key doesn''t work properly in X, try this command.


    Example: .xinitrc:


    ```

    xmodmap -e ''keycode 22 = BackSpace afterstep

    ```


    If there is a problem starting X the screen will return to text mode and you will
    see the results of the X server trying to start up on your screen. Normally this
    will be because there is a problem with the display settings; or some other hardware
    the wrong mouse type have been specified.


    # Stopping X


    XFree86 has a hot-key combination if you can''t exit normally. Pressing Ctrl+Alt+backspace
    will terminate X immediately and return to text mode.


    # Using the Mouse


    Normally in X a three-button mouse is expected. If you don''t have one you should
    specify 3-button emulation in the X configuration. When this option is enabled,
    pressing both left and right buttons together will act as the middle button.


    The effect of the different mouse buttons depends on the application software
    you are running and on the window manager you are using. However, one aspect that
    is universal is copying and pasting text.


    # How to copy text between windows


    - In the window with the text you want to copy, drag the cursor with the left
    mouse button to highlight the text to copy


    ```

    ls

    file1 file2

    file3 file4

    ```

    Drag to highlight text

    cursor


    - 2 Place the cursor in the window where you want to paste the text


    ```

    vi

    ```

    cursor


    - 3 Click the middle mouse button, and the text will be pasted into the new window


    ```

    vi file4

    ```


    # Scroll Bars


    Scroll bars are another important factor. In X the scroll bars, and buttons, etc.
    are called “widgets”. They are provided not by X but by the application programs
    themselves. In practice however there are several standard libraries of widgets
    which the application programs use, such as “Athena”, “Motif”, “GTK”, and “QT”.


    Most of these behave like those you see in Windows or other windowing environments
    but the Athena scrolls are slightly different. These Widgets are relatively old
    and look their age; unfortunately this also means that they are quite widespread.


    # Athena Scrollbar on XTerm


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_65_0.png)


    The Athena scrollbars have a slider part, just like any others, but the slider
    cannot be “grabbed” with the mouse to scroll up and down. Instead, to scroll down
    you must click with the left mouse button anywhere along the scroll bar’s length,
    and to scroll up click with the right mouse button.


    # The FVWM2 Window Manager


    One of the most popular window managers in use, and the default in Red Hat Linux,
    called FVWM2. This window manager can be made to behave in many ways similar to
    Windows, even having a similar "Start" menu.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_66_0.png)


    "Start" button Pop-Up Menu FVWM2 Taskbar Desktop Pager


    # Multiple Desktops


    FVWM2 as configured here has four "virtual" desktops. Windows can be dragged off
    the edge of the screen to the next desktop. This allows you to keep windows separate
    and reduce clutter. You could have a man page open on one screen, a terminal on
    another, and a web browser on a third.


    The desktop pager shows the layout of the windows and the windows you have on
    them. Click on part of the pager to jump to that virtual desktop. You can also
    use the following keys to move around the virtual space:


    - Ctrl+Arrows: Jump to another desktop in the direction of the arrow.

    - Alt+Arrows: Move the visible part of the screen smoothly around the virtual
    space.


    # Windows


    Windows can be moved around the FVWM2 desktop by clicking and dragging the menu
    bar with the mouse button. You can resize a window by clicking and dragging the
    edge of the window. Clicking the edge with the right button shows a menu which
    allows you to perform the following window operations:


    # Restore

    Restore a maximized window to default size.


    # Move

    Move a window around the screen.


    # Minimize

    Reduce a window to an icon, or, if you are running the FVWM2 taskbar and therefore
    have disabled icons, to disappear completely.


    # Maximize

    Enlarge a window to fill the screen.


    # Kill

    Terminate the program in the window immediately.


    # Close

    Close the window.


    # The Titlebar


    The titlebar can contain multiple buttons; it is usually configured to show one
    button at the top left which displays the window operations menu when clicked,
    and three on the right which perform the following: Minimize, Maximize, and Kill.


    # The FVWM2 Taskbar


    The taskbar shows a button for each window. The taskbar brings it to the front
    and restores it if it was minimized.


    # Focus


    The window which is currently taking input is said to have the focus. This is
    not always the window which is currently on top. This behaviour is configurable,
    but the default is normally like this:


    - Click on the title of a window to bring it to the top, and give it focus

    - Click in the body of a window which doesn''t have the focus, to give it focus
    (but not bring it to the top)


    You can still enter text and click in windows which have the focus, even if they
    not on top.


    # Configuration


    FVWM2 is very configurable. There are way too many options to describe. Configuration
    is done from a default file in `/usr/lib/X11/fwmrc`, although your distribution
    may be set up to `/etc/X11/fwmrc`.


    In either case it is recommended to copy this file to your home directory, and
    call it .fwmrc. Now you can experiment with changing the settings. Settings are
    generally hierarchical with base styles being set, the buttons and windows are
    given this style.


    The basic colours are set with the following line:


    DefaultColors WinBack TitleFore TitleBack


    For example:


    ```

    DefaultColors Black White Yellow Blue

    ```


    It is recommended that you read the FVWM2 man page and view any comments in the
    default file for more information.


    # XTTerm


    XTTerm is a terminal window application which allows you to enter shell commands
    and run text programs while you are using X. You can start XTTerm with the command
    xterm or select new shell on the menu.


    # Start-up options


    There are many command-line options which can be used with XTTerm. For instance
    you can set the foreground and background colours with "-fg" and "-bg". To use
    yellow text on a blue background use this command:


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_69_0.png)


    ```

    xterm -fg yellow -bg blue

    ```


    For other options see the xterm man page


    # XTTerm Menus


    The colours, and many other options, can be set through graphical menus once XTTerm
    is running. There are three menus, obtained by holding the Ctrl key and clicking
    the Left mouse button (Main menu), the Middle mouse button, or the Right mouse
    button (Font menu).


    The Main menu allows you to send signals to processes, and also to secure the
    keyboard. When this option is selected XTTerm takes control of the keyboard from
    the X Window system so no other process could listen in. This may be useful for
    entering passwords, and so on.


    The VT Menu allows you to set aspects of the terminal''s configuration. Useful
    options on this menu include enabling the scroll bar to see text which has scrolled
    off the top and setting auto wrapping of long lines.


    The Fonts menu allows you to set the font used in a range of sizes, ranging from
    "Unreadable" to "Huge".


