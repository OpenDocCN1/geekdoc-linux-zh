    ## The Window System


    In this chapter you will find out what the Window System is and how Linux uses
    it to provide graphical software. You will also see some desktop environments.


    ## Covers


    - About X

    - Setting Up X

    - Starting and Stopping X

    - Using the Mouse

    - FVWM Window Manager

    - XTerm

    - X File Manager

    - X Applications

    - Useful X

    - X Resources

    - X Screensaver

    - Logging to X


    ## About X


    The X Window System is the name of the software which provides Linux with the
    ability to run graphical software. Sometimes called “X”, this is actually just
    a set of standards. The free implementation provided with your Linux system is
    XFree86.


    ## Clients and servers


    Normally when we talk about servers we mean the faceless machine down the hall;
    the clients are PCs or dumb machines which access it. In X things are reversed.
    The X server provides the display; traditionally that was a dedicated X terminal
    but now is a special program running in your Linux PC. Think of the X server as
    the display driver. X clients are programs which use that display for input and
    output; the traditional X arrangement has them on the server down the hall but
    in Linux they are normally on the PC.


    ## Window Managers


    The X server provides the means to display windows, buttons, menus and so on,
    and also the means to get input from the keyboard and mouse. In short, it provides
    all the input and output However the X server doesn''t define the look and feel
    of the windows.


    The shape, colour, icon style, and behaviour all provided by the Window Manager.
    This is a special X client which makes make the system usable. You could run X
    with no window manager but the windows would have no frames, nor buttons to close
    them, nor anything explicitly provided by the program. To start a program you
    would have to find a shell prompt on a text screen. This sounds odd but allows
    the environment to be flexible. There are more than a dozen X window managers
    around which can give you the look and feel you want.

