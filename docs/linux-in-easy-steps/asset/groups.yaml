    # 连接互联网


    在本章中，你将学习如何将 Linux 系统连接到互联网和万维网。你将了解到如何配置自动拨号器，以及如何启动和使用浏览器。最后，你将学习使用 FTP 从远程服务器下载文件。


    # 目录


    - 设置你的连接 | 98

    - 拨号脚本 | 100

    - PAP/CHAP | 101

    - 浏览网页 | 102

    - 网景浏览器 (Netscape Navigator) | 103

