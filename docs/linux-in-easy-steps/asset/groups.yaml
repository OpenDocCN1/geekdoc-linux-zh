    ## C Shell Differences


    Most of the examples are here for Bash, since Bash is the usual default shell
    in Linux. Many people like to use tcsh and some differences are presented here:


    If you write a script for particular shell indicate it in the first line with
    a special comment which shows the path to the shell, like this: #!/bin/tcsh


    ## Assigning a value to a variable


    In Bash simply use name=value. In tcsh you have to use the "set" command:


    ```

    set name=value

    ```


    Additionally, to export the variable so that it is generally available, tcsh uses
    "setenv" instead of the Bash export:


    ```

    setenv name value

    ```


    ## Conditions


    In Bash, as we have seen, conditions are in square brackets with special codes
    like "eq". In tcsh use round parentheses and double equals signs:


    ```

    if ($STATUS==1)

    ```


    To test other relationships you can use > (greater-than), < (less-than), >= (greater-than
    or equals), <= (less-than or equals), and != for not-equals. The standard Bash
    tests for file properties (-f, -d, -x, -w, -r) also work in tcsh.


    ## Beginning loops


    In tcsh you don''t need to use "do" in a "while" or "until" loop.


    ## Ending loops and "if" bodies


    Bash uses "fi" to end an "if" and "done" to end loops. The "C" shell uses the
    somewhat more intuitive "endif" and simply "end" to close a loop:


    ```

    until ($STATUS==0)

    domycommand 1 2 3

    STATUS=$?

    end

    ```


    ## Packages and Archives


    In this chapter you will see how to create archive files and work with them. You
    will learn about the different ways of compressing files in Linux. You will also
    find out other ways of packaging software and learn how to use RPM packages. Finally
    you will learn what source packages are and why you might want to use them.


    ### Covers


    - The Tar Command | 134

    - GZip Compression | 135

    - BZip2 | 136

    - Other Compression Programs | 137

    - RPM Packages | 138

    - Glint | 139

    - Software Installation with Glint | 140

    - DEP Packages | 141

    - Source Packages | 142


    ## The Tar Command


    You may already be familiar with ZIP files in Windows. Linux does have the tools
    to read and write these files but the most commonly used type of archive file
    is the "tar" file. tar stands for "tape archive" and can be used for backing up
    to tape as well as creating archive files on disk. One tar file can hold many
    files by default they are not compressed.


    There are several graphical front-ends to tar although none of them dominates.
    We will look at the command-lines here.


    ### To create a tar archive


    Change to the directory where the files and/or directories to be archived are


    ```

    cd directory

    ```


    Use an asterisk (*) to mean all directories.


    Enter this command to zip up all the files and directories:


    ```

    tar cvf archive.tar filenames

    ```


    To view the contents of a tar file


    ```

    tar tvf archive.tar

    ```


    Make sure you are in the right directory when you extract files.


    To extract the contents of a tar file


    ```

    tar xvf archive.tar filenames

    ```


    If you leave out the filenames parameter in this command, all the files in the
    archive will be extracted. They are extracted to the current directory and any
    directory names in the archive are created as it goes.


    ## GZip Compression


    The most common form of file compression used in Linux is the GZip program. GZip
    is normally used in one of two ways: Compressing an individual file; or compressing
    a tar archive.


    WARNING: These commands replace the original file. To avoid use the -c option
    and redirect the output to a new filename.


    ### To compress an individual file


    This command replaces the original file. The compressed filename ends with ".gz"


    ```

    gzip myfile

    ```


    ### To uncompress an individual file


    ```

    gunzip myfile.gz

    ```


    ### Compressed tar archives


    ### To create a gzipped tar file


    ```

    tar cvzf myarchive.tar filenames

    ```


    ### To extract files from a gzipped tar file


    ```

    tar xvzf myarchive.tar filenames

    ```


    ## BZ2


    There is a newer form of zip which is becoming very popular as it can have a higher
    compression ratio than gzip. This program is called "BZ2" and is used in a similar
    way to gzip or gunzip.


    ### To compress a file


    ```

    bzip2 myfile

    ```


    ### To uncompress a file


    ```

    bzip -u myfile.bz2

    or bunzip2 myfile.bz2

    ```


    There is no "bunzip2" program. To uncompress you must use bzip2 with the -u option;
    or create a soft link to bzip2, called "bunzip2" and use that. The program will
    automatically uncompress as it is invoked as "bunzip2". To create the link enter
    this command (assuming that bzip2 is in the /usr/bin directory):


    ```

    ln -s bzip2 bzip2

    ```


    ### Compressing tar archives


    Some versions of tar can use bzip2 for compression. The archive file could be
    named something.tar.bz or something.tar.bz2.


    ### To create a bzipped tar file


    ```

    tar cvzf myarchive.tar filenames

    ```


    ### To extract files from a bzipped tar file


    ```

    tar xvzf myarchive.tar filenames

    ```


    ## Other Compression Programs


    | Utility | Command |

    | :--- | :--- |

    | zcat | zcat |

    | zcmp | zcmp |

    | zdiff | zdiff |

    | zgrep | zgrep |

    | zmore | zmore |

    | znew | znew |


    ## RPM


    There is a newer form of zip which is becoming very popular as it can have a higher
    compression ratio than gzip. This program is called "BZ2" and is used in a similar
    way to gzip or gunzip.


    ## Software Installation with Glint


    The graphical front-end to rpm is called Glint.

    '
