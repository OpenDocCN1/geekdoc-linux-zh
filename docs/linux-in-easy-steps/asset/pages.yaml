  md: '# The X Screensaver


    To use the X screensaver you need to install the "xcreensaver" package. The package
    comprises 3 main parts: the screensaver daemon (background process) which runs
    constantly and responds to requests; the screensaver command client, which requests
    that the server part does things; and the graphics "hacks", as they are called,
    which are the modules used for displaying different patterns when the xcreensaver
    kicks in.


    To run the screensaver


    +   Run the background process from your X start-up file


    ```

    xscreensaver&

    ```


    To see a demo of the screensaver modules click "demo" before the splash screen
    disappears


    Click on the module name to see a demo. The command for that module is shown below


