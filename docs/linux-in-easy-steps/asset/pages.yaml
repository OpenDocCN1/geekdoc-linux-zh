    412 2 S 0:00 /usr/X11R6/lib/X11/fvwm2//FvwmTaskBar9 4 /tmp/fvwmrca00351

    418 p0 S 0:00 bash

    487 p0 R 0:00 ps

    ```


    Process ID Terminal CPU Time Program

    (console or used window)


    This output shows the process ID and information about the programs running.'
