  md: '# Setting up your connection


    Before you try the manual setup The Internet uses a language, called a protocol,
    TCP/IP for communication between computers. When you dial up a modem your computer
    will use a special version of this protocol called PPP, or Point to Protocol.


    try here "WVDial" which claims to be completely automatic, and "EZPPPP" which
    is a graphical configuration tool.


    There are several graphical tools for configuring PPP but no clear standard as
    yet.


    # To configure PPP manually


    +   You will need to find out the phone number to dial, the method of authentication,
    and your ISP''s DNS nameserver address


    Find out the details from your Internet Service Provider before you begin. If
    you don''t know the method of authentication it is probably PAP or CHAP.


    +   Copy the default PPP configuration files (your version number vary)


    ```

    cd /usr/doc/ppp-2.3.5/scripts

    cp ppp-on /etc/ppp

    cp ppp-on-dialer /etc/ppp

    cp ppp-off /etc/ppp

    ```


    +   Edit /etc/ppp/ppp-on and change the values for your ISP details


    | These are the parameters | Phone number to dial |

    |---|---|

    | TELEPHONE=08451234567 | Dial-up username |

    | ACCOUNT=fred | Dial-up password |

    | PASSWORD=abcdefgh123 |

    | LOCAL_IP=0.0.0.0 |


    +   If you have a fixed IP address put it here, otherwise zeros


    Linux in easy steps'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# 5 Find the following line in /etc/ppp/ppp-on and ensure the directory path
    is correct:


    ```

    DIALER_SCRIPT=/etc/ppp/ppp-on-dialer

    ```


    6 There are 3 lines shown - each should be all on one line in the file and entered
    exactly as shown including the \ at the end of each line.


    Ensure the ppp-on script points to the correct port for your modem. Change according
    to the table below:


    ```

    exec /usr/sbin/pppd debug lock modem

    crtscts /dev/ttys0 \

    asyncmap 20A0000 escape FF kdebug 0

    $LOCAL_IP:$REMOTE_IP \

    noauth noipdefault netmask $NETMASK

    defaultroute connect $DIALER_SCRIPT

    ```


    | | | |

    |---|---||

    | COM1: | /dev/ttys0 | Change the number |

    | COM2: | /dev/tty1 | according to your modem |

    | COM3: | /dev/tty2 | |

    | COM4: | /dev/tty3 | |


    7 Edit /etc/resolv.conf and add your ISP''s nameserver address(es)


    Add an extra line if you have two nameserver addresses


    ```

    nameserver 111.222.333.444

    ```


    "ppp-on" script is now set up to run PPP using your modem. We still have to configure
    the dialier script so it can dial the number and log in to your ISP''s network.'
