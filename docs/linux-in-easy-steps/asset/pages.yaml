- img_proc: true
  md: '# Structure of the Filesystem


    We saw before how the Linux filesystem is made up of a tree structure. You might
    have noticed that this structure doesn''t allow for addressing individual disks
    like C:, D: or A: in Windows.


    In Installing Linux (chapter one) we discussed how this is resolved. Each physical
    device, corresponding to a drive letter in DOS or Windows, is attached to the
    tree seamlessly as any other directory. This process is called Mounting the disk.


    Let''s take a closer look. If you only have one hard disk partition for Linux,
    then you have no choice – that is where the root of the filesystem will be located.
    Furthermore, all the subdirectories and files in them are located on that disk
    too. If you have more than one partition, which is quite common these days, you
    have to choose one to be the root partition. Normally you will choose one to use
    for swap, that for virtual memory which allows you to run more programs simultaneously.
    The swap partition doesn''t fit into the filesystem tree Now you can select where
    in your tree structure you want to place the other disks (partitions) you have
    for Linux. It is normal to allocate these to root-level directories according
    to their sizes.


    All these decisions will normally be made at installation time but sometimes you
    want to change the arrangement, for example, if you buy a bigger hard disk.


    Let''s imagine we have four available partitions, each of 500 MB. This may be
    from a 2 GB disk split into four, for example. If they were four partitions of
    our second disk they would have the names hdb1, hdb2, hdb3, and hdb4. One must
    be root. We can use one /home (for users to store their personal files on), one
    for /usr, for applications and some system files files and one for /var. Here
    we have separated critical files and variable-sized directories which is safer.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# ...cont''d


    The filesystem would look like this:


    ```

    / (hdb1)

    home (hdb2) usr (hdb3) var (hdb3)

    ```


    Other directories (dev, etc, tmp) would be on the same device as the root, that
    is hdb1. All files and subdirectories in these locations are stored on the hdb1
    partition.


    All files in /home and its subdirectories are stored on the hdb2 partition, and
    so on for /usr and /var over hdb3 and 4 respectively.


    The individual disks are hidden from us. The files all appear in the filesystem
    in their respective directories.


    # How to Mount a Disk


    Disks are mounted into the filesystem using the mount command. To mount a Linux-format
    disk on hdb2, and place it in /mnt, we use this command:


    ```

    mount -t ext2 /dev/hdb2 /mnt

    ```


    Linux disks are called “second extended filesystem” or “ext2” type disks. The
    “-t” parameter determines the type or format of the disk to be mounted. Other
    possible values are “msdos” for a DOS format disk, “vfat” for Windows 95 or 98
    and so on.


    The next parameter represents the name of the partition we are mounting. All devices
    have a special file in the /dev directory and we specify the name of this file
    here, i.e. /dev/hdb2”.


    The mount point is the directory in the tree where we want the disk to take root,
    for example, “/home”. This directory must exist but should not contain any files.
    If it does they will be covered up by the new disk and you won’t see them anyway.


    3 Handling Disks and Files 33'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# The "fstab" File


    The root partition is automatically mounted when Linux boots. However, some way
    is needed to mount the other disks if we are to avoid entering a sequence of "mount"
    commands every time we start a Linux session.


    We have to tell Linux which disks to mount. The details are provided in a file
    called "fstab", located in the “/etc” directory.


    # Example fstab


    | /dev/hdb1 / ext2 defaults 1 1 |

    | /dev/hdb2 /home ext2 defaults 1 2 |

    | /dev/hdb3 /usr ext2 defaults 1 2 |

    | /dev/hdb4 /var ext2 defaults 1 2 |

    | /dev/hdb5 swap swap defaults 0 0 |

    | none /proc proc defaults 0 0 |


    The file is arranged in columns. There is a line for each partition which can
    be mounted. The columns are:


    | Device | The special file in the /dev directory for this disk or partition |

    | Mount Point | The directory where we are going to mount it |

    | Type | What type of disk it is |

    | Flags | Options such as "noauto" (don''t mount automatically) or "readonly"
    (mount for reading only) |

    | Error Dump | Set to "r" for Linux ext2 filesystems, "o" otherwise |

    | Check order | When to check this filesystem. "1" for root, "2" for other Linux
    disks, "o" for non-linux or removable disks |


    34 Linux in easy steps'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'When the Linux system boots up, the root filesystem is automatically mounted.
    Then it looks through the fstab file to find out which other filesystems to mount.
    They can be: Linux format (ext2), other formats such as DOS or Windows, removable
    disks like floppy disks or CD-ROMs, or special filesystems.


    All filesystems not marked with “noauto” in the flags field will be mounted. If
    an entry has “readonly” you will not be able to delete or change files in that
    directory or subdirectory.


    All automatically mounted Linux disks or partitions are checked when they are
    mounted.


    # Special Filesystems


    Some entries in the fstab refer to special filesystems. One obvious is the “swap”
    entry. This is not even a filesystem, it is just an area of disk used by the operating
    system as a temporary memory store. This allows more programs to be run at the
    same time. Because it is not a filesystem the “swap” entry doesn''t have a mount
    point.


    The “proc” is the other special filesystem here. This is a kind of filesystem
    but is not located on any real disk, rather it is invented by the operating system
    at run-time. The mount point is “/proc” and if you look in this directory you
    will see many files describing the current state of the Linux system.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# # Accessing Windows Files


    Although Linux is a very different operating system from Windows and cannot run
    Windows programs (at least without additional software), you might want to access
    files on your Windows disk from within Linux.


    You can do this by mounting the Windows disk like any other, fitting it into the
    Linux filesystem''s tree structure, and accessing files and folders (directories)
    as normal.


    Windows partitions will be either FAT, or FAT-32 format. In Linux, both are called
    "vfat".


    If your windows disk is the first hard disk on the PC, as would normally be the
    case, the partition name will be “/dev/hda1”.


    # ## To mount a Windows disk


    +   1 Find out: the Linux name of the partition, the Filesystem type (vfat) and
    the mount point.


    +   2 If you haven''t already, create the mount point directory.


    ```

    mkdir /windows

    ```


    +   3 Either use the mount command:


    ```

    mount -t vfat /dev/hda1 /windows

    ```


    +   4 Or add the entry to the fstab file:


    ```

    /dev/hda1 /windows vfat defaults 0 0

    ```


    If you used the mount command you will find your windows files in the "/windows"
    directory. If you left it to fstab you will have to reboot to see them.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_37_0.png)


    36 Linux in easy steps'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# CD-ROMs and Floppy Disks


    CDs, floppy disks and other removable disks, must also be mounted before they
    can be used. However they are distinct from fixed disk partitions because you
    will rarely want them to be mounted automatically when you boot, the disk will
    not generally be in the drive.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_38_0.png)


    Always use "umount" before removing a disk, otherwise you might lose data.


    To mount a removable disk we have to use the "mount" command when the disk is
    needed and the "umount" command when we have finished, and before it is removed.

    To make things easier we can take advantage of some additional options on the
    fstab entry:


    +   * "user" allows normal users to mount the disk

    * "noauto" prevents the disk from being mounted at boot


    Why do we want an entry in the fstab file if we don''t want the disk to be mounted
    automatically? Because then we can use a much simpler version of the "mount" command.


    # To mount a floppy disk automatically


    Add this line to "/etc/fstab":


    ```

    /dev/fd0 floppy auto user,noauto 0 0

    ```


    2 Use this command to mount it: don''t users to automatically mount


    ```

    mount /floppy

    ```


    3 When you have finished use this command to unmount:


    ```

    umount /floppy

    ```


    Because of the entry in "/etc/fstab" any user can mount the disk (not just root,
    the superuser) and we are able to use a much reduced form of "mount". The fstab
    entry fills in the missing details – the device, filesystem type, and so on.


    Handling Disks and Files


    # 37'
  merge: -1
  pgno: 38
- img_proc: true
  md: '...cont''d


    Notice that we specified the filesystem type as “auto”. This allows us to use
    DOS/Windows or Linux format floppy disks equally without saying which type.


    # This table shows different filesystem types


    | Disk | Device | Filesystem type |

    |---|---|--|

    | 3.5" floppy | fdo2,fdi2 | mdsos,vfat,ext2 |

    | IDE CD-ROM | hdb1/2,hdc1/2, etc. | iso09660 |

    | SCSI CD-ROM | sca1/2,scb1/2, etc. | iso09660 |

    | IDE Zip, etc | hdb1/2,hdc1/2, etc. | mdsos,vfat,ext2 |

    | SCSI Zip, etc | sca1/2,scb1/2 | mdsos,vfat,ext2 |


    The device name for IDE and SCSI devices will depend on which position the device
    is in, as for IDE disks. Once you know which position it is in you can create
    a “soft link” to it, for example, “/dev/cdrom”, which can be used in its place
    in the fstab file. To link “/dev/cdrom” to “/dev/hdcr”, use the following command:


    ```

    ln -s /dev/hdc1 /dev/cdrom

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_39_0.png)


    You have to create the mount point if it doesn''t exist.


    # To mount a CD-ROM


    > Add this line to


    ```

    /dev/cdrom /cdrom auto user,noauto 0 0

    ```


    Use this command to mount it:


    ```

    mount /cdrom

    ```


    Don''t forget to use “umount” when you''ve finished!


