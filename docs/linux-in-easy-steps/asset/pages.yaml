  md: '# ...cont''d


    All processes are started by another process. That process is called the parent
    process, and those which it starts are called child processes. The ultimate parent
    of them all is "init", which you can see on the previous page. Each process has
    a Process ID, or pid. You can see the pid of each process in the "ps" listing.
    To see the pid of a process parent use the l option. You can see the process IDs
    and parent IDs here are not visible (The process names are not visible because
    the lines are much longer):


    | FLAGS | UID | PID | PPID | PRI | NI | SIZE |

    | 100 | 500 | 261 | 1 | 0 | 0 | 1228 |


    Process ID Parent ID. You can see this process was started by the system called
    "init" process at start-up


    # Stopping processes

    You can send a signal to stop with the "kill" command. This sends the process
    a called "SIGTERM" which means "terminate". If a process is in an error condition,
    or if it has been programmed to "catch" SIGTERM and ignore it, or close down slowly,
    you can use the -9 option to kill the process immediately:


    ```

    kill 261

    ```


    Send terminate to process with pid 261

    Forcibly kill process 261


    ```

    kill -9 261

    ```


    Only do this if you are sure the process you are killing has crashed, or is not
    responding as you could lose data.


