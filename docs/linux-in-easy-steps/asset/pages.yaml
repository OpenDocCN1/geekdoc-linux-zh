  md: '# cont''d


    If you have KDE you can use KDM instead of XDM. Change /usr/X11R6/bin/xdm in initab
    to /opt/kde/bin/kdm


    When XDM starts it uses several files to tell it what to do. These are located
    in /etc/X11R6/xdm:


    Xservers: Defines your X servers (displays)


    XSetup_o: Starts programs before logging in Session: Start up programs when X
    proper starts after you have successfully logged


    Normally the defaults are adequate. These start the X console (so you can see
    any system messages) before logging in, and start a window manager after logging
    in.


    # To change the programs started before logging in


    ```

    Edit

    etc/X11R6/xdm/Xsetup_0

    ```


    +   Add lines for the programs you want to run


    For Example:


    ```

    xsetroot -solid blue

    ```


    If you are using KDM, the Xsession receives a parameter corresponding to the session
    type you choose on the KDM screen. You can make Xsession a different window manager
    depending on this parameter.


    # To change the programs started after you log in


    ```

    Edit

    etc/X11R6/xdm/Xsession

    ```


    +   Add lines for the programs you want to run


    For Example:


    ```

    xset -cursor-name top_left_arrow

    ```'
