  md: '# Opening Multiple Files


    Sometimes Vi you want to edit two or more files, copying data from one to another.
    This is easy with Vi.


    To copy lines between files


    +   1 Open the first file

    ```

    vi bigfile.txt

    ```


    +   2 Copy the lines you want to paste into the other file

    ```

    10Y

    ```


    +   3 Open the other file with the ":e" command

    ```

    :e nextfile.txt

    ```


    +   4 Paste into the new file at the right place

    ```

    p

    ```


    +   5 Return to the first file, if required

    ```

    :e#

    ```


    Sometimes you have to edit a whole sequence of files. You don''t want to enter
    the ":e" command for each one. Is there a quicker way? Of course there is:


    +   Edit the files by putting their names individually on the command line, or
    entering a pattern:

    ```

    vi *.txt

    ```


    The editor starts on the first file. Edit it, then move to the next file with
    ":n". When you reach the last file, or at any time, you can go back to the first
    with ":rew" (rewind).'
