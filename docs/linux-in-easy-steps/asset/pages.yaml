- img_proc: true
  md: '# LILO


    Lilo must be configured from Linux, normally during the installation process.
    Lilo''s options are held in a file called “lilo.conf”, in the “/etc” directory.


    Lilo configuration must be done by the root user.


    # To add a Lilo entry for a Windows partition


    +   Edit /etc/lilo.conf with “vi” or another text editor.


    ```

    vi /etc/lilo.conf

    ```


    Press TAB at the lilo boot prompt to see all the available options.


    +   Add these lines to the file. Make sure the hard disk name and the Windows
    partition name are correct.


    ```

    other=/dev/hda1

    label=Windows95

    table=/dev/hda

    ```


    +   Save and exit the file. Then Lilo.


    ```

    lilo

    ```


    # To add an additional Linux Entry


    +   Edit /etc/lilo.conf with “vi” or another text editor.


    ```

    vi /etc/lilo.conf

    ```


    +   Add lines to show the root partition name, the location of the kernel (image)
    file, and a suitable label.


    ```

    image=/boot/bzImage

    label=linux

    root=/dev/hda3

    read-only

    ```


    Setting a timeout allows the default system to load automatically after that length
    of time (in tenths of seconds).


    +   Save and exit the file. run lilo.


    ```

    lilo

    ```


    Other Options

    You can set these other options at the top of the lilo file:


    ```

    default=labelname

    timeout=time

    ```


