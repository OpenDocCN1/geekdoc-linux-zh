  md: '# The Hardware Clock


    Linux keeps a record of the current date and time internally, in memory. This
    time is set from the hardware clock when the PC is booted. When you set the time
    or date using the “date --set” command it is this internal time which is set.
    If you want to set the hardware clock to, also known as the CMOS clock, you have
    to use a different command.


    ```

    setclock

    ```


    Sets hardware clock to match the current system time


    You can see the state of the CMOS clock with the “clock” command. This command
    can also be used to set the system clock so that it is the same as the hardware
    clock, in effect to re-read the time from the hardware:


    ```

    clock -a

    ```


    Sets system clock to match the current CMOS hardware clock


    # Timezones


    If you tell the system timezone you are in and set the clock to GMT, the system
    will adjust your time correctly and allow for daylight-saving such as summer time.
    The list of possible timezones are in a file “/usr/share/zoneinfo/zone.tab”. There
    are special files for each timezone in the same directory and subdirectories.


    The current timezone is set by a symbolic link called “etc/localtime” linked to
    one of these special files.


    # Setting the Timezone


    On RedHat Linux there is a program to do this. It is called “timeconfig” and you
    can run it with “/sbin/timeconfig”. On other systems you may have to make the
    link yourself, for example:


    ```

    ln -s /usr/share/zoneinfo/Europe/London /etc/localtime

    ```


    This command is entered on one line.


