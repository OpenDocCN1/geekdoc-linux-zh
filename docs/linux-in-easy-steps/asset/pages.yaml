  md: '# The Dial script


    The dial script is a set of text strings with responses. The left-hand side shows
    what we expect to get from the modem, the right-hand side is what we send in response.
    You might need to change the prompts and/or responses to suit your ISP. If you
    don''t have to enter anything in a terminal window, omit the last 2 lines (and
    remove the \ at the end of the last remaining line). You might actually need to
    add one or more lines, for example to tell the remote end to go into PPP mode.


    special entries


    | exec /usr/sbin/chat | -v | |

    | TIMEOUT | 3 | |

    | ABORT | ''\nBUSY\'' | |

    | ABORT | ''\nNO ANSWER\r'' | |

    | ABORT | ''\nRINGING\r\n\rRINGING\r'' | |

    | '' | \rAT | |

    | ''OK+++c-OK'' ATH0 | |

    | TIMEOUT | 30 | |

    | OK | ATDT$TELEPHONE | |

    | CONNECT | '' '' | |

    | login:-login: | $ACCOUNT | |

    | assword: | $PASSWORD |


    Normally you will only have to change - or remove - the last 2 lines of this script.
    But make sure all lines except the last one ends with a ''\''


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_101_0.png)


    The login and password prompts don''t have their first letter because we don''t
    always know if they have a capital or lower-case letter.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_101_1.png)


    connected OK login password sends sends indicator prompt prompt username password


    Once this is done you can dial up by typing /etc/ppp/ppp-on. Disconnect using
    /etc/ppp/ppp-off. You might have to configure PAP or CHAP first.


    100 Linux in easy steps


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_101_2.png)'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# PAP/CHAP


    Some ISPs use script-type authentication, where you have to respond to a login
    and password prompt in a terminal window. Most use a system called PAP (Password
    Authentication Protocol) or CHAP (Challenge Authentication Protocol).


    # Setting up PAP or CHAP


    +   Edit the /etc/ppp/ppp-on-dialer file as described previously as far as the
    CONNECT line (with no \ on the end).


    +   Edit the "etc/ppp/ppp-on" file as before, but add the -pap user username or
    -chap user username to the last line, like this:


    ```

    exec /usr/sbin/pppd debug lock modem

    crtsmap /dev/ttys0 \

    asasyncmap 20A0000 escape FF kdebug 0

    $LOCAL_IP:$REMOTE_IP \

    noauth noipdefault netmask $NETMASK

    defaultroute connect $DIALER_SCRIPT

    -pap user fred

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_102_0.png)


    PAP authentication


    Your ISP authentication


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_102_1.png)


    +   Edit "etc/ppp/pap-secrets" (for PAP) or "/etc/ppp/chap-secrets" (for CHAP)
    and add the following last line:


    | username * password *


    Your ISP username Your ISP password'
