- img_proc: true
  md: '# Changing Runlevels


    When you learned about going straight to X after booting you saw that the start-up
    behaviour is determined by runlevels. Recall that runlevel 3 is standard multi-user
    mode and runlevel 4 or 5 is multi-user with X.


    When shutting down, the system goes to runlevel, 0, which is halt. Runlevel 6
    means reboot the system and you will guess that "shutdown -r" goes to this level.
    The default is normally set to 3 or 0 or 5 and you can imagine what the consequences
    would be of setting it to o or 6 (don''t try this!)


    When the system is set up to auto-start in X (runlevel 5), you might sometimes
    want to go back to runlevel 3, with no automatic X. Why might you want this? Perhaps
    to try a new X start-up program or window manager.


    You cannot normally exit XDM when it is started from initab the X server just
    restarts a new one. This is called "respawning".


    You can switch runlevels with the "telinit" command, like this:


    ```

    telinit 3

    ```


    This command will switch the current runlevel to 3 by stopping all the relevant
    processes and starting all those marked for runlevel 3 (see next section). This
    will allow you to go to ordinary multi-user mode (runlevel 3) from another runlevel,
    but without rebooting. In fact you never have to reboot Linux unless you are replacing
    or switching kernels. Most changes can be seen by logging out and logging back
    in. If a background process needs to be restarted you can start it manually or
    by changing runlevels.


    Sometimes you want to go to "single user mode" for maintenance purposes. In this
    mode only root can log in and a minimal set of services are started. You can do
    this by changing to runlevel "s".


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_146_0.png)


    You can also go to single-user mode by adding the word "single" after the normal
    boot command at LILO prompt.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# The Init Sequence


    Linux uses the “Sys V” init sequence. This means that it follows the start-up
    conventions of the famous Unix System V. These conventions determine the sequence
    of programs which are run when the system changes runlevel, including of course,
    when starting up or shutting down.


    # The Init Directories


    Each runlevel has its own directory under “etc/rc.d”. The directories are named
    “rcn.d”, where n is the runlevel, from 0 to 6. Each directory contains a series
    of shell scripts which are run in order of their names, when entering or leaving
    that particular runlevel. Some files named with “Knn” are used to stop, or kill
    existing programs when entering that level. Others begin with “Snn” and are to
    start programs.


    Because these files need to exist in multiple directories, for each runlevel where
    the program is required, the actual scripts are located in another directory called
    “etc/rc.d/init.d” and the individual runlevel directories have soft links to them.


    # To add a Start-up Command


    +   If a script does not exist for this program in “etc/rc.d/init.d” then you
    will need to add it. It will be called with a parameter “start” or a parameter
    “stop”.


    +   cd to the directory for each runlevel where the command should be started


    ```

    /etc/rc.d/rc3.d

    ```


    +   Add a link to the start-up script and the kill script if necessary:


    ```

    ln -s /etc/rc.d/init.d/myprog S99myprog

    ln -s /etc/rc.d/init.d/myprog K99myprog

    ```


    HOT TIP add a start-up command without the complications of these scripts, you
    can add a command to “etc/rc.d/local” which will be run after all other scripts.


    146 Linux in easy steps'
  merge: -1
