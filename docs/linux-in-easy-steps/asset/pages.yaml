- img_proc: true
  md: '# # Dual Booting


    When you have installed Linux on a computer which already has Windows, you normally
    want to select to load Windows instead of Linux sometimes, perhaps to run some
    software which is not yet available for Linux. To do we need a way of selecting
    which operating system to load when we switch on the PC.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_41_0.png)


    A partition is a disk with a letter like C: or D: in Windows. The "active" partition
    is the one which has been marked as the boot partition. This partition is the
    one which will be used for loading the operating system. If the active partition
    contains Windows then Windows will be loaded; if it contains Linux, on the other
    hand, Linux will be started when you boot. You can change the active partition,
    and thereby which operating system you load, by using "fdisk" or one of the third-party
    applications.


    It is quite inconvenient however to change the active partition each time you
    want to change from Linux to Windows or vice versa. Also, the frequent manipulation
    of the partition table is not to be encouraged generally, so there are several
    other ways to achieve our goal.


    # Loadlin


    Loadlin gives us a novel way to start Linux. After starting Windows in MSDOS mode,
    or switching to MSDOS, loadlin will load Linux over the top of the currently running
    operating system in memory (it doesn''t affect the disk). Loadlin needs a Linux
    kernel image on the Windows disk so it takes a little extra disk space (about
    a half a megabyte).


    # LILO


    Lilo is the Linux Loader and can be configured to give us a prompt at boot time
    in order that we can select which partition to boot from, and which operating
    system to load, and even which version to use. If none are selected Lilo can start
    a default. Lilo is normally configured during the Linux installation process but
    there are many ways to fine-tune it to achieve greater flexibility.'
  merge: -1
