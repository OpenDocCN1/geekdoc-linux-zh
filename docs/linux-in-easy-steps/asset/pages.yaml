    ls

    file1 file2

    file3 file4

    ```

    ```


    Drag to highlight text


    cursor


    +   2 Place the cursor in the window where you want to paste the text


    ```

    ```

    vi

    ```

    ```


    cursor


    +   3 Click the middle mouse button, and the text will be pasted into the new
    window


    ```

    ```

    vi file4

    ```

    ```'
