  md: '# Processes


    Each program running on Linux is called a process. There are many more processes
    running at one time than just the programs you have started. The boot process
    runs a number of processes known as “daemons” for things such as looking after
    the print queue and networking. You can see your own processes using the “ps”
    command:


    ```

    [fred@localhost fred]$ ps

    PID TTY STAT TIME COMMAND

    261 2 S 0:00 -bash

    337 2 S 0:00 sh /usr/X11R6/bin/startx

    338 2 S 0:00 xinit /usr/X11R6/lib/X11/xinit/xinitrc -

