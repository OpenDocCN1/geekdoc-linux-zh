  md: '# # Printing Documents


    Printing a text file can be done with the “lpr" command. This may be used as a
    command on its own or as a filter for other commands. E.g:


    ```

    1p -P myprinter myfile.txt

    ```


    To print "myfile.txt" on printer "myprinter"


    ```

    1s -1 | 1p -P myprinter

    ```


    To print the output from "ls -l",


    # ## The Default Printer


    You can specify the printer to use with the -P option. Many programs, lpr included,
    will use a default if one is defined like this:


    > > Edit your startup file, for example "$HOME/.bash_profile"


    +   2. Add the following lines to the end:


    ```

    PRINTER=myprinter

    export PRINTER

    ```


    # ## Formatting text


    You can use the "pr" command to format text into pages, complete with page numbers.
    For example, to print a listing of the "/etc" directory formatted into pages:


    ```

    1s -1 | pr | 1p -P myprinter

    ```


    # ## Printing from applications


    An application may have a printer selection window. Choose the printer from the
    window and click OK. It might have a place for you to enter the print command,
    like this:


