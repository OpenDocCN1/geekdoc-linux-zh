  md: "# Logging in to X directly\n\nWhen you start Linux it enters a “runlevel”.\
    \ The runlevel determines what programs start. The runlevels are:\n\n| | |\n|\
    \ 0 | Halt |\n| 1 | Single User |\n| 2 | Multiuser, no network |\n| 3 | Multiuser\
    \ with network |\n| 4 | Unused |\n| 5 | XII |\n| 6 | Reboot |\n\nThese runlevels\
    \ are defined in the “inittab” file, which is in the “/etc” directory.\n\n```\n\
    id:3:initdefault:\n```\n\nThere is a default runlevel, indicated by an entry in\
    \ that file like this. It is 3, which means that when you start the system it\
    \ will go into normal single-user mode. This runlevel does not start the X window\
    \ system so you see the text login prompt.\n\nIt would be nice to see a window\
    \ showing a login prompt instead. Using a program called “xdm”, or “X Display\
    \ Manager” we can do this. To start xdm we can change the defaults in “/etc/inittab”\
    \ to start in runlevel 5.\n\n```\nid:5:initdefault:\n```\n\nTo change the default,\
    \ change the “3” to “5”, like this.\n\nDefault runlevel\n\nFurther down in “/etc/inittab”\
    \ is a line showing which program will be run when you enter runlevel 5, like\
    \ this: \n\n```\nx:5:respawn:/usr/X11R6/bin/xdm -nodaemon\n```\n\nRunlevel 5 XDM\
    \ Command\n\nCheck the number here and use it in the default line above."
  merge: -1
