- img_proc: true
  md: '# Other Sources of Information


    Aside from the many published books Linux, the major source of knowledge and information
    is the Internet. There are two main sources on the net: published documents; and
    personal communications.


    There are documents available for specific software packages, often from the producers
    of such software but sometimes from third-parties. A search in one of the many
    Internet search engines will soon find such documentation.


    # The Linux Documentation Project


    One of the best places to find published documentation about several different
    Linux subjects is the Linux Documentation Project. The home address of the LDP
    http://www.metalab.unc.edu/LDP. The LDP is an independent, non-profit organisation
    which is the home of the HOWTo and has produced some excellent freely available
    books on the following subjects:


    +   * Installation and Getting Started

    * Users'' guide

    * Kernel Programming


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_187_0.png)


    # News/Mail Lists


    The other place to look is on the newsgroups and mailing lists. Newgroups are
    accessible with newsreader software and work a little like email, a public forum
    which anyone can read, and where anyone can post their views (but on-topic!).
    There are several thousand newsgroups on all manner of subjects but try the Linux
    ones such as comp.os.linux and linux.config


    Mailing lists work by email and are a little like newsgroups but more private.
    You have to subscribe to read or post messages and they tend to be a little more
    controlled. You can find mailing lists on relevant websites.'
