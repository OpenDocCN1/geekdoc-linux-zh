- img_proc: true
  md: '# Basic Concepts


    Although the vi editor has one of the most bizarre and seemingly non-user-friendly
    interfaces ever invented, it is worth learning how to use it, as it is the one
    editor which you can guarantee will be on every Unix or Linux system you might
    use.


    The first, and most important, thing to learn about vi is that is has two modes:
    Input mode, and Command mode. When you are in input mode everything you type goes
    to the screen, and into the file you are editing (the only exceptions to this
    are cursor-movement commands and the exit from input mode command.) When you are
    in command mode nothing you type will go into the file you are editing; rather
    it will be interpreted as a command to the editor to do something. Understanding
    is the key to understanding vi.


    # An example


    +   * Start vi on a new file called "testfile".


    As usual, all commands are case-sensitive.


    +   2. Press "i" to enter input mode. Type some text, then press ESC.


    +   3. You are back in command mode. Press "0" and the cursor will return to the
    beginning of the line. Press "x" 5 times and on stroke one letter of the 1st word
    will be deleted.


    +   4 Now press ":". A colon prompt will appear on the bottom line. You are now
    in command entry mode. Type "q!" and press RETURN. This will quit vi without saving
    and return you to the shell prompt.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_45_0.png)'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Some Useful Commands


    The tables below show some useful keys to use in command mode.


    # Changing Mode


    All the commands below go from command mode into input mode. Press ESC to change
    back again.


    | i | Insert before the character the cursor is on |

    | a | Insert after the character the cursor is on |

    | A | Append to the end of the line |

    | R | Replace characters, overtyping those already there |

    | o | Open up a new line below the current one |

    | O | Open up a new line above the current one |


    Use the normal arrows and PgUp/PgDn keys to move between lines in the file.


    # Cursor movement


    Use these keys in command mode.


    | G | Go to the last line of the file |

    | 0 | Go to the first character of the line |

    | $ | Go to the end of the line |


    # Miscellaneous Commands


    | J | Join current line to the next one |

    | /abc | Find "abc", look forwards in the file |

    | ?abc | Find "abc", look backwards |

    | n | Find next occurrence, in last direction searched |

    | z | Undo last command |

    | ZZ | Save file and Exit |

    | . | Repeat last command |'
