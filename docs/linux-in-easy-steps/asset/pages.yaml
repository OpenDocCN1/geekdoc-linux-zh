  md: '# Parameters


    What if you want to use a shell script, but want it to act on a different file
    or directory each time? Rather change the script each time, you can use parameters
    so the options are specified on the command line when you call it.


    As an example, let''s write a simple shell script to back up all the files in
    a given directory, to a named tar file. We will call this "mktar.bash":


    ```

    ```bash

    #!/bin/bash

    # mktar.bash - create tar file

    cd $1

    tar cvf $2 *

    if [ $? -ne 0 ]; then

    echo "Error in tar command"

    fi

    ```

    ```


    Use Bash for this script


    Change directory to first parameter


    Do the tar command


    a # means a comment Check return value from tar


    To run this script just enter its name – two parameters: a directory and a file.


    For example:


    ```

    mktar.bash mydir backup1.tar

    ```


    As you see above parameters are numbered shell variables. The name of the script
    itself is $0. The real parameters start with $1, then $2, $3 and so on.'
