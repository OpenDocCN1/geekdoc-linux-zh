  md: '# Other Mail Software


    It is not necessary to use any special mail software with Linux, as it does come
    with a set of text-mode mail tools.


    # Fetchmail


    Fetchmail is a utility which can check your mail on the remote server and can
    download any waiting messages. They are placed in the standard mail directory
    in your home directory and read using the “mail” program.


    # Configuring Fetchmail


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_108_0.png)


    Change the POP3 server name and the user and password for your internet account.


    +   Create a file in your home directory called “.fetchmailrc", containing these
    lines:


    +   2 Mail server address


    +   3 Protocol for mail communication (usually POP3)


    ```

    poll pop3.demon.co.uk proto pop3

    user fred

    password abcabcdef123

    ```


    +   4 Username for mail server


    +   5 Put the password for the mail server here, or let fetchmail prompt you


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_108_1.png)


    To get mail but leave it on the server “fetchmail --keep”.


    # Running Fetchmail


    Type “fetchmail” to get your mail. To only check messages, type “fetchmail --check”.


    # Reading mail


    Type “mail” to read mail. Pressing Return displays messages one at a time, d deletes
    the message. Enter q to quit from the mail program.


    # 107 Connecting to the Internet'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# Sending mail with Mail and Sendmail


    It is also possible to use Mail to send messages. They are actually sent by a
    program called “sendmail” which is normally running in the background all the
    time (as a daemon).


    # Configuring Sendmail


    The first point to make is that the Mail/Sendmail combination will send mail with
    a From: address of your Linux login name@your Linux hostname. Make sure your Linux
    username is the same as your email username or people won’t be able to reply properly.


    Sendmail is configured with a file “/etc/sendmail.cf”. This file is quite complicated
    but there are really only two entries you need to set. The first is called the
    “Domain to Masquerade as”. This means the name of your internet mail address (not
    including the user or parts). Edit this file and find a line which begins DM.
    It may have a comment about masquerading over. Enter your email host and domain
    name:


    ```

    DMmyhost.isp.net

    ```


    Put your own email hostname here


    Next you have to enter the name of your ISP’s SMTP server. This is the computer
    which you send mail to for forwarding to the recipient. (Don''t confuse this with
    the POP3 server you get mail from.) It is labelled DSsmtp:


    ```

    DSsmtp.isp.net

    ```


    Put your own ISPs mail sending server here


    # Sending mail


    To actually send a message, use the Mail command:


    ```

    mail -s subject fred@somedomain.net

    Hi Fred

    EOT

    ```


    press Ctrl+D to send the mail'
  merge: -1
