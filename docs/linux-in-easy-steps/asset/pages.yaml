  md: '# "For" Loops


    If you want to perform a certain action a number of times you can use a “for”
    loop. The “for” command cycles through a list of filenames or other words and
    performs commands on each one.


    For example: Print each file called something.txt, and rename it with “.printed”
    on the end.


    ```

    for file in *.txt do

    lpr $file

    mv $file $file.printed

    done

    ```


    The list doesn’t have to be filenames. It could be words taken from another command,
    or the contents of a file.


    For example: Copy each word from the “ls” man page to “wordlist.dat”, then sort
    it and remove duplicates.


    ```

    for word in `man ls` do

    echo $word >> wordlist.dat

    done

    sort -fd wordlist.dat | uniq

    ```


    # The C shell


    In “tcsh”, the Linux version of the C shell, the “for” command is replaced with
    the “foreach” command. The syntax is slightly different.


    For example: Print all “.dat files”, each preceded by “header.txt”.


    ```

    foreach file ( *.dat )

    lpr header.txt

    lpr $file

    end

    ```'
  merge: -1
