- img_proc: true
  md: '# Scroll Bars


    Scroll bars are another important factor. In X the scroll bars, and buttons, etc.
    are called “widgets”. They are provided not by X but by the application programs
    themselves. In practice however there are several standard libraries of widgets
    which the application programs use, such as “Athena”, “Motif”, “GTK”, and “QT”.


    Most of these behave like those you see in Windows or other windowing environments
    but the Athena scrolls are slightly different. These Widgets are relatively old
    and look their age; unfortunately this also means that they are quite widespread.


    # Athena Scrollbar on XTerm


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_65_0.png)


    The Athena scrollbars have a slider part, just like any others, but the slider
    cannot be “grabbed” with the mouse to scroll up and down. Instead, to scroll down
    you must click with the left mouse button anywhere along the scroll bar’s length,
    and to scroll up click with the right mouse button.'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# The FVWM2 Window Manager


    One of the most popular window managers in use, and the default in Red Hat Linux,
    called FVWM2. This window manager can be made to behave in many ways similar to
    Windows, even having a similar "Start" menu.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_66_0.png)


    "Start" button Pop-Up Menu FVWM2 Taskbar Desktop Pager


    # Multiple Desktops


    FVWM2 as configured here has four "virtual" desktops. Windows can be dragged off
    the edge of the screen to the next desktop. This allows you to keep windows separate
    and reduce clutter. You could have a man page open on one screen, a terminal on
    another, and a web browser on a third.


    The desktop pager shows the layout of the windows and the windows you have on
    them. Click on part of the pager to jump to that virtual desktop. You can also
    use the following keys to move around the virtual space:


    Ctrl+Arrows


    Jump to another desktop in the direction of the arrow.


    Alt+Arrows


    Move the visible part of the screen smoothly around the virtual space.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Windows


    Windows can be moved around the FVWM2 desktop by clicking and dragging the menu
    bar with the mouse button. You can resize a window by clicking and dragging the
    edge of the window. Clicking the edge with the right button shows a menu which
    allows you to perform the following window operations:


    # Restore


    Restore a maximized window to default size.


    # Move


    Move a window around the screen.


    # Minimize


    Reduce a window to an icon, or, if you are running the FVWM2 taskbar and therefore
    have disabled icons, to disappear completely.


    # Maximize


    Enlarge a window to fill the screen.


    # Kill


    Terminate the program in the window immediately.


    # Close


    Close the window.


    # The Titlebar


    The titlebar can contain multiple buttons; it is usually configured to show one
    button at the top left which displays the window operations menu when clicked,
    and three on the right which perform the following: Minimize, Maximize, and Kill.


    # The FVWM2 Taskbar


    The taskbar shows a button for each window. The taskbar brings it to the front
    and restores it if it was minimized.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# Focus


    The window which is currently taking input is said to have the focus. This is
    not always the window which is currently on top. This behaviour is configurable,
    but the default is normally like this:


    +   - Click on the title of a window to bring it to the top, and give it focus

    - Click in the body of a window which doesn''t have the focus, to give it focus
    (but not bring it to the top)


    You can still enter text and click in windows which have the focus, even if they
    are not on top.


    # Configuration


    FVWM2 is very configurable. There are way too many options to describe here. Configuration
    is done from a default file in `/usr/lib/X11/fwwm.fwwm2rc`, although your distribution
    may be set up to `/etc/X11/fwwm2/system.fwwm2rc`.


    In either case it is recommended to copy this file to your home directory, and
    call it `.fwwm2rc`. Now you can experiment with changing the settings. Settings
    are generally hierarchical with base styles being set, the buttons and windows
    are given this style with added attributes.


    The basic colours are set with the following line:


    DefaultColors WinFore WinBack TitleFore TitleBack


    For example:


    ```

    DefaultColors Black White Yellow Blue

    ```


    It is recommended that you read the FVWM2 man page and view any comments in the
    default configuration file for more information.'
  merge: -1
  pgno: 68
