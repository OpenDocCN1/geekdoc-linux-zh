- img_proc: true
  md: '# # What is the Shell?


    A shell is a special program which gives you the familiar text mode prompt. You
    can use it to start other programs and it understands some special commands of
    its own. Sometimes these special commands are combined into a file which can be
    run all at once, in sequence. We call this a shell program or script.


    # ## Different shells


    There are several different shell programs in use in Linux. They have many similarities
    but there are differences in the way they interact with the user and the commands
    they understand. The original shell was called "sh", or simply "sh". The program
    to run this is in the "/bin" directory. Current Linux distributions still have
    "/bin/sh" but it is often a link to another shell. The most common shell in Linux
    today is called Bash, which stands for Bourne Again Shell, after the popular Bourne
    shell. Bash has more advanced features than the original Bourne shell and it is
    more user-friendly.


    A shell very popular with programmers is called the C shell. Linux has its own
    version "tcsh". This shell has more advanced shell-programming features and a
    different syntax for some operations.


    There are other shells such as the Korn shell (ksh) and Wish or Windowing shell,
    which has simple graphical capabilities. Here we will concentrate on Bash as it
    is a popular shell and the default for most users.


    Whenever you log on to a text console a shell is started automatically. In X you
    can start a shell by running a terminal window (such as Xterm, or Kterm in KDE).
    FVWM2 has a menu item to start a new shell which opens up a terminal window.


    If you want to start a new or different shell you can just type its name.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# ...cont''d


    For example if you are in Bash and you want to run Tcsh:


    ```

    tcsh

    ```


    # Start-up commands


    Both Bash and Tcsh will run a special script when they start. Bash looks for a
    file called ".bashrc" in your home directory. This can be written using special
    shorthand notation as ~/.bashrc. The C shell uses a file called ".cshrc".


    ~ means: my home directory. ~fred means: Fred''s home directory.


    When a shell starts it is normally in one of two modes: Normal, or Login Shell.


    When it is acting as a login shell it will run another special script which usually
    contains commands to set up the environment, change your prompt, and so on. Your
    first shell in a text console will be a login shell by default and will run the
    special start-up script. Any subsequent shells you start will not be, unless you
    specifically select with one of the commands below.


    For Bash, this special login shell script is called ".bash_profile" and must also
    be located in your default login directory. Additionally, /etc/profile will also
    be run for all users by a login shell. When you exit a login shell Bash will run
    .bash_logout.


    # To start a login shell (Bash)


    ```

    bash -login

    ```


    Start the shell with the -login option


    For the C shell the login script is called ".login", again located in your home
    directory. The C shell will also execute a file called ".logout" when you exit
    a login shell.


    # To start a login C shell:


    Use the -l option on its own


    ```

    tcsh -1

    ```


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_122_0.png)'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Shell Commands


    There are many commands which don''t run an external program but run entirely
    within the shell. Some of these are used purely for controlling the operations
    of the shell. These commands are called shell commands.


    HOT TIP When running commands, use single quotes ('''') to prevent any shell characters
    being expanded. Double quotes ("") can also be used as variables and back-expanded.
    Single quotes ('''') containing another command cause the output of that command
    to be passed as arguments to the main command. Double-quotes can be used inside
    single quotes.


    So far you have seen how to start a program using the shell – simply type its
    name:


    ```

    bash

    ```


    A program can be run in the background, that is you get a shell prompt back immediately
    and cannot interact with the program, which continues to run by itself. To do
    this an ampersand as the last character:


    ```

    cp /cdrom/* /data& & [123]

    ```


    The program started and is given a process id of 123


    # Redirecting Input and Output


    All programs run in text send output to “standard output” and get input from “standard
    input”. These are the screen and keyboard. You can redirect them so a program
    reads its input from another file and sends its output elsewhere.


    HOT TIP In Bash, you can prevent the operator from accidentally overwriting an
    existing file by using the command "set -o noclobber" first.


    Send output of ls command to listing.txt


    ```

    ls > listing.txt

    ```


    Takes input from message.txt and display as a banner


    ```

    banner < message.txt

    ```


    # Pipes


    You can also send the output of one command directly to the input of another.
    This is done with the | (pipe) character. Several commands can be string together
    e.g:


    ```

    man ls | grep option | more

    ```'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# # Shell Variables


    Sometimes we want the shell to remember certain values. One of these is your home
    directory. The name of this directory and other values are stored in named strings
    called "shell variables". You can refer to the value stored in a shell variable
    by prefixing the name with a $ sign.


    For example:


    | echo $HOME | Display directory name |

    | /home/fred | |

    | cd $HOME | |


    Change to that directory


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_124_0.png)


    Don''t put any spaces before or after the equals sign.


    # To set the value of a shell variable


    Enter name=value:


    ```

    MYVAR=12345

