  md: '# # Entering Commands


    Linux provides several "virtual" consoles (normally six). This means you can log
    in up to six times and run different programs on each virtual screen. Change from
    one virtual screen to another by pressing Ctrl+Alt+number. For example: Ctrl+Alt+2
    to change to virtual console 2.


    When you have logged in with your new username you will be placed at the shell
    prompt. The shell is the program which accepts your commands and runs programs
    for you. We will learn more about the shell later.


    The prompt will appear as a $ sign which, by default on RedHat Linux, is prefixed
    with your username, the name of your Linux machine and the current directory name.


    There are two types of command you can enter at the shell prompt: Shell commands;
    and Programs.


    Shell commands instruct the shell itself to do something. They are used for job
    control and control of how the shell operates and your environment. Typing a program
    name causes the shell to go and find that program on the hard disk and then run
    it.


    ### Some shell commands are:


    | echo | Display text or other values on the screen |

    | cd | Change current working directory |

    | pwd | Print the current working directory on the screen |


    ### Some common programs are:


    | ls | List directory contents |

    | cp | Copy Files |

    | cat | Display the Contents of File(s) |


    We will learn more about all of these later.'
  merge: -1
