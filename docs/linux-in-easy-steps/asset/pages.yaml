  md: "# # XTTerm\n\nXTTerm is a terminal window application which allows you to enter\
    \ shell commands and run text programs while you are using X. You can start XTTerm\
    \ with the command \n\"xterm\" or select \"new shell\" on the FVWM2 menu.\n\n\
    # Start-up options\n\nThere are many command-line options which can be used with\
    \ XTTerm. For instance you can set the foreground and background colours with\
    \ \"-fg\" and \"-bg\". To use yellow text on a blue background use this command:\n\
    \n![](img/f2019df07bd67d0d6801cbad23cc32b8_69_0.png)\n\n```\nxterm -fg yellow\
    \ -bg blue\n```\n\nFor other options see the xterm man page\n\n# XTTerm Menus\n\
    \nThe colours, and many other options, can be set through graphical menus once\
    \ XTTerm is running. There are three menus, obtained by holding the Ctrl key and\
    \ clicking the Left mouse button (Main menu), the Middle mouse button, or the\
    \ Right mouse button (Font menu).\n\nThe Main menu allows you to send signals\
    \ to processes, and also to secure the keyboard. When this option is selected\
    \ XTTerm takes control of the keyboard from the X Window system so no other process\
    \ could \"listen in\". This may be useful for entering passwords, and so on.\n\
    \nThe VT Menu allows you to set aspects of the terminal's configuration. Useful\
    \ options on this menu include enabling the scroll bar to see text which has scrolled\
    \ off the top and setting auto wrapping of long lines.\n\n![](img/f2019df07bd67d0d6801cbad23cc32b8_69_1.png)\n\
    \nThe Fonts menu allows you to set the font used in a range of sizes, ranging\
    \ from \"Unreadable\" to \"Huge\""
