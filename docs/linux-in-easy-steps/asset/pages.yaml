  md: '# Cron


    You can schedule any program, or combination of programs, to run at any time of
    the day or night on any date, or at regular intervals, using the Linux scheduler,
    "Cron".


    Cron is a program which always runs in the background (as a "daemon") and the
    details of jobs which have been scheduled to run are kept in a file called "crontab".


    There are in fact two kinds of crontab files: the system crontab and user crontabs.


    # The System Crontab


    The system file is maintained by "root". It is edited directly using a text editor
    such as "vi". This file is used for scheduled system operations, for example:


    +   - System backups

    - Removing old log files

    - System status reporting

    - Updating system files or databases


    # User Crontabs


    User files are not maintained by "root", but by individual users. In contrast
    to the system crontab file they must be maintained using a special user command
    to get access to the file. This command is also called "crontab".


    User crontabs are used for users'' own scheduled jobs. For example:


    +   - Application reports

    - Running long jobs out of hours

    - Personal backups or file copying'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# The System Crontab


    The system crontab file is located in "/etc/crontab". Each entry contains five
    date and time fields which specify when to run the job.


    An entry looks like this:


    | Minutes Hour Date Month Day User Command |

    | --- | --- | --- | --- | --- | --- | --- |

    | Hour of the day | Day of month | Month or number | Day of the week | User to
    run as | Command to run |

    | Minutes past the hour | | | | | |


    Each field can contain a "* which means "all" or "any". A command will be run
    if the hours and minutes match, the month matches, or either the day of the month,
    or the day of the week matches.


    # Examples


    +   1. Every day at 01:00am, remove all files older than 2 days old from /tmp:

    00 01 * * * root find /tmp -mtime -2 -exec rm {} \;


    +   2. Every monday at 8:30, create a new login message:

    30 08 * * mon root cookie > /etc/motd


    +   3. Send a message to all logged in users after midnight on Jan 1st:

    01 00 01 jan * root echo Happy new year | wall'
  merge: -1
  pgno: 166
- img_proc: true
  md: "# User Crontabs\n\nThe user crontab follows a similar format as the system\
    \ one, but doesn’t have the “user” field as all commands are run as the owning\
    \ user. Each entry looks like this:\n\n```\nMinutes Hour Date Month Day * Command\n\
    ```\n\nAgain, each field can contain “*” to mean “all” or “any”.\n\n# Creating\
    \ a User Crontab\n\nEach user has their own crontab file so if you have never\
    \ set up one it won’t yet exist. To create it enter this command: \n\n```\ncrontab\
    \ -e\n```\n\nThis command will start the “vi” editor, or another if you export\
    \ the EDITOR shell variable with the name of your preferred editor.\n\nYou can\
    \ insert lines in the format described above. Once you have finished save and\
    \ exit the editor and your file will be stored away for cron to read and act upon.\n\
    \n# Viewing Your Crontab File\n\nIf you enter this command:\n\n```\ncrontab -l\n\
    ```\n\nYou will see your crontab file listed out to the screen.\n\n# To Change\
    \ or Add & Remove Entries\n\nUse the same command as when you created the file:\n\
    \n```\ncrontab -e\n```\n\nMake the necessary changes, save and exit the editor\
    \ and cron will re-read the file."
