    Always back up your disks resizing partitions in case of problems. Now add other
    partitions you want to use. It is normal to reserve a small partition (less than
    100 Megabytes) for “swap”. Other directories which may have their own partition
    include /home and /usr.


    Next you will be asked about swap. If you don''t have a partition for swap you
    can add a swap file later. Otherwise select the swap partition name.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_13_2.png)


    If you have the disk choose the development packages anyway, as Linux software
    is distributed as “source”, which will require these utilities to be able to run.
    Select the partitions just chosen so that they will be formatted for Linux files.


    The default set of packages is now displayed. Remember to select printer support
    if you need to use a printer, and all the development packages if you might want
    to do any programming.


    Now choose your mouse type. Remember to select “Emulate 3 Buttons” if your mouse
    only has two, as Linux needs three buttons. Next select your video card type.
    If yours is not listed try VGA or SVGA. The next stage is to choose your monitor.
    If you can''t find yours you can try Generic or Generic Multisync. When asked,
    allow it to probe your video card.


