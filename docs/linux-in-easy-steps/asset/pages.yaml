  md: '# Colon Commands


    If you press ":\(colon) a prompt will appear at the bottom of the screen. You
    can enter more complex commands here. Generally an exclamation mark "! overrides
    a command you would not normally issue, such as quit if you have not saved the
    file yet. It is a way of saying "yes, I''m sure".


    # Getting out of Vi


    | :w | Save (save) file to disk |

    | :w filename | Save as a new name |

    | :w! | Save read-only file (if you have permission) |

    | :q | Quit without saving |

    | :q! | Quit even if you have made changes |

    | :wq | Write file, then quit |


    # Other colon commands


    | :n | Go to line n |

    | $: | Go to last line of file |

    | : filename | Read file, insert at cursor position |

    | :! command | Run a shell command |

    | :sh | Run a temporary shell (CTRL-D returns) |'
