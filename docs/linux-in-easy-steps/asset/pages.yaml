  md: '# # GZip Compression


    The most common form of file compression used in Linux is the GZip program. GZip
    is normally used in one of two ways: Compressing an individual file; or compressing
    a tar archive.


    REWARE These commands replace the original file. To avoid use the -c option and
    redirect the output to a new filename.


    # ## To compress an individual file


    This command replaces the original file. The compressed filename ends with ".gz"


    ```

    ```gzip myfile```

    ```


    # ## To uncompress an individual file


    ```

    ```gunzip myfile.gz```

    ```


    # ## Compressed tar archives


    # ## To create a gzipped tar file


    ```

    ```tar cvzf myarchive.tar filenames```

    ```


    # ## To extract files from a gzipped tar file


    ```

    ```tar xvzf myarchive.tar filenames```

    ```'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# BZ2


    There is a newer form of zip which is becoming very popular as it can have a higher
    compression ratio than gzip. This program is called “BZ2” and is used in a similar
    way to gzip or gunzip.


    # To compress a file


    ```

    bzip2 myfile

    ```


    # To uncompress a file


    ```

    bzip -u myfile.bz2

    or bunzip2 myfile.bz2

    ```


    There is no “bunzip2” program. To uncompress you must use bzip2 with the -u option;
    or create a soft link to bzip2, called “bunzip2” and use that. The program will
    automatically uncompress as it is invoked as “bunzip2”. To create the link enter
    this command (assuming that bzip2 is in the /usr/bin directory):


    ```

    ln -s bzip2 bzip2

    ```


    # Compressing tar archives


    Some versions of tar can use bzip2 for compression. The archive file could be
    named something.tar.bz or something.tbz. Older versions do not directly support
    bzip2 but we can tell tar to use it as follows:


    # To create a bzipped tar file


    These commands are each one line.


    ```

    tar cvf myarchive.tar filenames --use-compress=bzip

    ```


    # To extract files from a bzipped tar file


    ```

    tar xvf myarchive.tar filenames --use-compress=bunzip

    ```'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Other Compression Programs


    There are some other compression programs used in Linux although gzip is the most
    common.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_138_0.png)


    To exchange files with non-Linux systems use compress rather than gzip and the
    Z option to Tar rather than z.


    # Compress and Uncompress


    These are the traditional Unix compression tools and are still in use in many
    Unix systems other than Linux. Files compressed with this command have the extension
    .Z (capital Z).


    # Zip and Unzip


    These are DOS/Windows PKZIP compatible zip tools although the commands are not
    as flexible. This type of zip file is not used very much in Linux as gzip is used
    in preference.


    # Compression Utilities


    There are several utility programs you can use to work with gzipped programs.
    These are special versions of normal Linux programs which have been modified to
    automatically uncompress their input files.


    | zcat | Uncompress gzipped file to standard output |

    | zcmp | Uncompress gzipped files and compare them |

    | zdiff | Uncompress gzipped files and show differences |

    | zgrep | Uncompress gzipped files and search for string |

    | zmore | Display uncompressed files a screenful at a time |

    | znew | Re-compress .Z files as .gz format |'
  merge: -1
