  md: '# # Basic File Handling Commands


    # ## Directory Listing

    As shown on the previous table, you can enter "ls" to see a list of files in your
    current directory. ls can be used with various options which affect the way it
    shows the list:


    For example:


    +   - ls -1 Long listing, including file ownership, and time, and access permissions

    - ls -a Show all files, including hidden files (those whose name begins with a
    dot)

    - ls -t Order the list by date and time instead of alphabetically


    These options may be combined. Thus to show a long-style listing in date and time
    order, but reversed so the most recent files are at the end of the list, use:


    ```

    ls -ltr

    ```


    # ## Copying and Moving files around

    To copy files, use the cp command as follows:


    ```

    cp myfile filecopy

    ```


    The destination (the second filename given) can also be the name of a directory.
    In this case the file is copied to a new file of the same name in that directory.


    To move a file from one location to another, use the mv command.


    The following command:


    ```

    mv myfile mysubdirectory

    ```


    will move "myfile" into the subdirectory named "mysubdirectory".'
  merge: -1
  pgno: 19
- img_proc: true
  md: '...cont''d


    The mv command is also used to rename files, for example:


    m myfile newname


    This will change the name of the file "myfile" so that it is called "newname".


    # Deleting files


    You can delete files permanently using the rm command (short for “remove\). For
    example:


    ```

    rm oldfile

    ```


    will permanently delete the file called "oldfile".


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_20_0.png)


    The "more" command is case-sensitive. Remember to q not Q.


    # Displaying the contents of a text file


    You can display the contents of a file with the “cat” command. This is short for
    concatenate, because the same command can be used to join files together.


    ```

    cat myfile.txt

    ```


    If the file is longer than one screen you can display it a page at a time with
    “more".


    ```

    more longfile.txt

    ```


    Press Space to show the next page. Press Return to show the next line and press
    “q” to quit and stop displaying the file.'
