  md: '# # Monitoring Processes


    Sometimes you may want to see what processes are doing, for instance if you suspect
    one is taking too much memory or process time. The command to do this is called
    “top” because it shows the top processes in terms of CPU usage.


    | 8:38pm up 1 min, 3 users, load average: 0.24, 0.12, 0.04 |

    | :--- |

    | 3 processes: 35 sleeping, 3 running, 0 zombie, stopped |

    | CPU states: 7.1% user, 1.7% system, 0.0% nice, 91.4% idle |

    | Mem: 63140K av, 21920K used, 41220K free, 18452K shrd, 1156K buff |

    | Swap: 0K av, 0K used, 0K free, 13812K cached |


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_152_0.png)


    # ## Priorities


    Priorities range from -19 (highest priority) to 20 (lowest priority), but users
    can only set positive values.


    As all the processes on the system have to share the CPU, each process has a priority,
    which determines how much share of the CPU it gets. You can see this on the “top”
    display. There is a command to affect priority of processes called “nice”.


    > Run "myprogram" with a lower priority than usual.


    Once a program is running, you can change its priority with the “renice” command.
    You can only affect your processes unless you are the superuser, and you can only
    change the priority to a value between 0 and 20.


    ```

    renice -2 -p 301

    renice 15 -p 302

    ```


    Reduce the priority of process 301 by 2

    Change the priority of process 302 to 15


