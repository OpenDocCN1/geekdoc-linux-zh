  md: '# Booting the new Kernel


    Once you have built a new Kernel you will need to try it. It is important you
    don''t throw away your old kernel yet as the new one may not be correct.


    # With Lilo


    If normally you use LILO to boot you will need to add a new section to


    ```

    image=/usr/src/Linux/arch/i386/bzImage

    label=new

    root=/dev/hda3

    read-only

    ```


    Enter this to boot the new kernel New kernel image file


    After changing lilo.conf you have to run Lilo to make it effect. Enter "lilo"
    at the prompt. When you boot you can now enter "new". This will run the new Kernel.
    If it works properly you can copy the kernel image file to the usual location
    and replace your old kernel. Don''t forget to run lilo again.


    After changing "lilo.conf" you must run "lilo" or you won''t be able to boot into
    Linux.


    # With LoadLin


    If you use LoadLin to start Linux from a Windows or DOS session you will have
    to copy it to your C drive to be able to boot. The best way to do this is with
    mcopy, part of the Mtools package. Configure Mtools to recognise drive C and use
    a command like the following:


    ```

    mcopy /usr/src/Linux/arch/i386/bzImage

    C:\bzimage.new

    ```


    Then, in Windows or DOS, copy your LINUX.BAT file which contains the LoadLin command
    to a new file. Change the name of the Kernel file to the one you just copied and
    test it.


    ![](img/f2019df07bd67d0d6801cbad23cc32b8_178_0.png)


    Kernel Configuration 177'
  merge: -1
