- pgno: 184
  md: 'Once you’re finished with the configuration, exit the first menu. The kernel
    will ask if you want to save the new configuration; select yes to write out the
    file and go to Section 7.3 (or no if you were just fooling around).


    The main menu has two handy options at the bottom of the box: load from and save
    to alternate files. If you want to save your kernel configuration for later use
    on this or another machine, use the Save Configuration to an Alternate File option
    to save it to a file.


    > NOTE

    > There’s a documentation directory /usr/src/linux/Documentation. This motley
    collection of documents contains everything from kernel-hacking instructions to
    driver notes. The configuration help often refers to files here.


    # The Processor


    Here are the various options under Processor type and features with a description
    of each.


    # Processor Family


    This selection enables optimizations for specific processors. The architectures
    are organized roughly by age. The kernel probably won’t run on a processor older
    than your selection (a 486 kernel will not work on a 386), though a 386 kernel
    works on everything (which is why many distributions install it as the default).


    # Math Emulation


    Linux needs a floating-point coprocessor to operate, but if you don’t have one,
    the kernel can emulate it. (This is only an issue for 386 and 486SX systems with
    no additional coprocessor.)


    # Loadable Module Support


    See Section 7.5 for a more detailed explanation of kernel modules.


    # Enable Loadable Module Support


    Only say no to this if you really know what you’re doing; otherwise accept the
    default.


    # Kernel Module Loader


    The kernel can attempt to load modules as needed. This offers the convenience
    of having a great number of kernel features available without loading them all
    by hand or compiling them directly into the kernel. For certain features this
    works particularly well; we’ll talk about them in Section 7.5.'
