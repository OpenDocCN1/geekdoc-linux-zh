- pgno: 166
  md: 'Special targets in a Makefile usually pop up if you type make and get a message
    saying "Use make target, where target is one of..." with a list of operating systems.
    If Linux is an option and it works, fine. If not, the author of the program has
    made too many assumptions about their particular distribution, or has done the
    build on a version of Linux much older than the one you''re using.


    # 6.6 Recommended Practices


    Certain ways of compiling and installing software can save time and frustration.
    A consistent method makes it easier to find things. However, if you strive to
    make all of your installed packages conform to the same scheme, you might have
    difficulty with a few oddballs that just don''t want to play along. There''s a
    tradeoff between how much time you spend installing a package and how much time
    you spend maintaining it.


    # Where and When to Compile Software


    The place to put all software that doesn''t come with the operating system is
    usually /usr/local, meaning that binaries go in /usr/local/bin, manual pages in
    /usr/local/man/man*, and so on. The default prefix of the GNU autoconf system
    is /usr/local, and most other packages default to this as well.


    There are good reasons to put software in /usr/local: It will survive an upgrade
    without much fuss, it''s easier to back up there, and if you install an enhanced
    version of a package that''s already in the operating system, you don''t clobber
    the old version.


    But why would you want to install a package your Linux distribution can install
    for you? Linux distributions try to pile in as much free software as possible,
    so whether you install programs yourself ultimately boils down to how much of
    your time you want to spend making users happy. Follow the following guidelines
    to make a determination.


    # Advantages of compiling programs yourself:


    +   - Distributing changes over the network becomes easier because there''s a
    common installation prefix.

    +   - The directory stays the same when you upgrade your operating system, and
    it''s easier to back up.

    +   - The newest version of a package always gets installed.

    +   - You can customize defaults if the package allows.

    +   - Optimizations are sometimes possible.

    +   - You usually get a better overview of how to use the package.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# **Disadvantages:**


    +   - It can take some time.

    +   - If no one actually uses the package, you’re wasting your time.


    # **Organization**


    Especially on larger sites, keeping track of what software has been installed
    can present quite a challenge. A helper package simply goes into /usr/local, you
    may find odd files and programs there and wonder where in the world they came
    from. Knowing the origins of files is important: Lingering files from an old version
    of a program may cause a newer version to malfunction.


    > *On traditional Unix networks, normal users never install packages in system
    directories. As for programs that users install in their home directories, administrators
    typically don’t care.*


    Many Unix software organization schemes have evolved over the years. We’ll go
    over just one: Encap. This scheme specifies where to put installed software and
    how to link it to the system so it’s available to all users. You can find extensive
    information for Encap at http://encap.cso.uiuc.edu/. The Encap system has the
    following advantages:


    +   - It keeps old versions of software packages intact.

    +   - You can identify everything in /usr/local by package.

    +   - It simplifies removal of old versions and of entire packages.

    +   - Encap usually requires very little extra configuration and works fine with
    autoconf.


    # **An Encap Example**


    Let’s go over an example configuration using the Encap scheme with our sample
    package, fdutils-5.3. Assume /opt has plenty of disk space; that’s where we will
    actually store our collection of locally installed programs, but we’ll use /usr/local
    as a launching point for them.


    After unpacking, configure the program:


    ```

    configure --prefix=/opt/fdutils/fdutils-5.3

    ```


    After running a make and a make install, cd to /opt/fdutils and run ln -sf fdutils-5.3
    default. Then cd to /opt/fdutils/default/bin and do this:'
  merge: -1
  img_proc: true
- pgno: 168
  md: '```

    # for file in *; do

    > ln -s /opt/fdutils/default/bin/$file /usr/local/bin/$file

    > done

    ```


    Similarly, in /opt/fdutils/default/man/man1:


    ```

    # for file in *; do

    > ln -s /opt/fdutils/default/man/man1/$file /usr/local/man/man1/$file

    > done

    ```


    Now the package is ready to run right out of /usr/local/bin. Other packages may
    have some other files, such as manual pages, for which you''ll need to create
    additional links.


    # PROBLEM 71


    Symptom: After upgrading a library, programs using that library experience a segfault,
    can''t find the library, or give wrong results.


    Problem: Shared libraries are inconsistent over upgrades.


    We have one caution about shared libraries. Their names change from one version
    to another, and this can create a horrible mess. Don''t, for example, make a /usr/local/lib/libfoo.so.1
    link to /opt/foo/default/lib/libfoo.so.1. If you''re going to be linking against
    a library later on, choose one of the following methods.


    Fix (case 1): If it''s a relatively small library like libpm, just make it a static
    library (that is, the library''s installed name will be libpm.a). If you want
    to make the library available to users for general development, put (for the pm
    example) a /usr/local/lib/libpm.a link to /opt/netpm/default/lib/libpm.a, as well
    as appropriate links for the include files in /opt/netpm/default/include. The
    standard configure option to make static libraries with the GNU autoconf system
    is --disable-shared.


    Fix (case 2): If it''s a big library, such as libgtk, you can make a shared library.
    However, as mentioned above, don''t make any links in /usr/local because this
    will cause upgrade problems. When compiling [libgtk, for example] use -I/opt/gtk/gtk-version/include
    and for linking, use the -L/opt/gtk/gtk-version/lib and -Wl,-rpath=/opt/gtk/gtk-version/lib
    options. You must use the version numbers instead of the default link, because
    a major upgrade of the library tends to wreak havoc on anything linked against
    it.


    Be especially careful about removing old versions of any packages containing shared
    libraries. Not only may the system contain programs linked against the old libraries,
    but your users may have also done so.'
