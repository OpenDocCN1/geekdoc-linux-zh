    Then there is the matter of the test command—a command in /bin, also identified
    by the left square bracket ([)—which often appears in start-up files. Innocent-looking
    tests like


    ```

    if [ "$F00" = 4 ]; then

    stuff

    ..

    fi

    ```


    actually use the bracket form of the test command to figure out whether $F00 is
    equal to 4. Try it yourself on the command line (remember that $? is the exit
    status of the last command that ran):


    ```

    $ [ 4 = 4 ]

    $ echo $?

