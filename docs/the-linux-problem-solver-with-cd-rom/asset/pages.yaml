    # Example 3: IP Masquerading


    IP masquerading is a handy feature for small networks, such as home networks that
    share one dial-up without a dedicated IP subnet. Other systems refer to it as
    NAT (Network Address Translation). In IP masquerading, one Internet-connected
    machine acts as the default Internet gateway for the other machines on the local
    network (even when they''re using dynamic address allocation from an ISP). When
    combined with proxy services (such as squid, a Web proxy server—see Chapter 4),
    IP masquerading can even improve performance through efficient caching. However,
    it doesn''t work with all protocols; it''s best at TCP.


    Take a typical home network, for example. Its first local subnet is 10.1.1.0 and
    the subnet mask is set to 255.255.255.0. Its primary network hardware is a 100BaseT
    Ethernet hub to which a Linux workstation, notebook, Power Mac G3, and the Linux
    router/gateway are connected. The gateway''s Ethernet interface (eth0) is set
    for the address 10.1.1.1 and configured for PPP on the ppp0 interface.


    The commands


    ```

    # ipchains -P forward DENY

    # ipchains -A forward -i ppp0 -j MASQ

    # echo 1 > /proc/sys/net/ipv4/ip_forward

    ```'
