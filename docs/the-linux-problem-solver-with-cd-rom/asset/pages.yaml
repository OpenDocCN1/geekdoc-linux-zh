- pgno: 189
  md: '# PROBLEM 81


    Symptom: You get the error message make: *** No targets. Stop.


    Problem: You don''t have the kernel source installed.


    Fix: Either you''re not in /usr/src/linux or the /usr/src/linux that came with
    your distribution is incomplete. Install the kernel source (see the previous section).


    # PROBLEM 82


    Symptom: You get the error message gcc: command not found.


    Problem: You don''t have the C compiler installed.


    Fix: Install the development series of packages (the one that contains gcc) for
    your distribution. Make sure it doesn''t walk over your kernel source or symbolic
    links to include file directories.


    # Make the Kernel Image


    Once you''ve successfully run these commands, you''re ready to make the kernel
    image itself. While there are a number of ways to do so, start with


    ```

    # make bzImage

    ```


    and you should see the actual object code built with output resembling this:


    ```

    scripts/split-include include/linux/autoconf.h include/config

    gcc -D_KERNEL_ -I/usr/src/linux-2.2.12/include -Wall -Wstrict-prototypes -O2 -fomit-frame-pointer
    -fno-strict-aliasing -pipe -fno-strength-reduce -m486 -malign-loops=2 -malign-jumps=2
    -malign-functions=2 -DCPU=586 -c -o init/main.o init/main.c

    ...

    ```


    > NOTE

    > This process takes a few minutes even on the fastest machines. If you''ve got
    a major problem with your build environment (such as a missing compiler), the
    make should abort early on in the process; you probably won''t even get past the
    make dep.'
