- pgno: 266
  md: '# ABOUT THE CD-ROM


    You''ll find the packages mentioned in the book in the support directory. We have
    split them up into further subdirectories by chapter. Here is a short index with
    descriptions.


    # support/introduction (Chapter 1)


    # foo.1: An example manual page


    The text uses this as an example of a manual page you can format manually. You
    can also use it as a template for writing your own manual pages.


    # support/nfsnisrstdist (Chapter 3)


    # expn-netgroup: Utility to expand NIS netgroups


    Because NIS netgroups tend to get too large for the underlying database library
    to support, they are often split up into several entries. This utility unifies
    these distributed netgroups.


    # rdist0: rdist, a remote file distribution program


    This is a popular package for distributing complex directory structures to one
    or many hosts at once.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# support/atalksamba (Chapter 4)


    **netatalk+asun: Netatalk, with the asun additions**


    The Netatalk package contains clients and servers that can interact with Macintosh
    AppleTalk networks.


    **InitappleTalk: init.d script for starting or stopping netatalk**


    This is a small script intended to start Netatalk at boot time. It follows the
    System V init.d system.


    # support/printing (Chapter 5)


    **printcap/：m4 printcap creation**


    These m4 macros facilitate the automatic generation of different printer configuration
    files from a single printer list.


    **LPRng-*.tgz: LPRng, advanced print spooler**


    The traditional print spoolers for Unix lack many modern features. LPRng allows
    for much more than simply sending a file to a printer.


    **ifhp-*.tgz: ifhp, advanced print filter**


    This print filter is intended for use with LPRng. Due to its high number of configuration
    options, ifhp may be the only print filter you ever need.


    # support/installsoft (Chapter 6)


    **fdutils-5.3.tar.gz: Floppy disk utilities**


    In the text, we use this as a package that uses the GNU autoconf system to facilitate
    configuration and compilation. It is a set of useful floppy disk utilities.


    **hello_w-0.00.tar.gz: Example package**


    Some packages don’t use the GNU autoconf system. This is a simple (somewhat contrived)
    sample that doesn’t do anything useful.


    # support/backupcrash (Chapter 8)


    **amanda: Package for automated backups**


    If you have a number of machines to back up, keeping track of regular backups
    is difficult to do by hand. Amanda schedules and runs automatic archiving.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# support/userenv (Chapter 9)


    # killx: Kills all active X applications


    In response to the problem of lingering X Window System applications after logout
    from an X terminal, Bill Fenner wrote this program. It turns out to be highly
    effective for xdm logouts as well.


