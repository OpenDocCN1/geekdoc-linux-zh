    **Symptom:** You get the error message Can''t mount root fs ...


    **Problem:** You recompiled the kernel, but it doesn''t boot all the way.


    **Fix:** First verify that you configured the correct root device into your boot
    system. If you''re using LILO, then /etc/lilo.conf must have a root=device line,
    where device is your root filesystem. If you don''t know what it is, check the
    output of the mount command on your working system.


    At the LILO boot: prompt, you can bypass this by giving root=device as a parameter
    to your image name (Linux root=/dev/hda1, for example). You can also do this with
    the CD-ROM accompanying this book at its boot prompt (that is, Linux root=/dev/hda1).


    If you have a root on a SCSI disk, there''s a good chance you forgot to configure
    the proper SCSI device driver. You need to configure the drivers for both the
    SCSI controller and the SCSI disks directly into the kernel, or the new kernel
    can''t see the disk.


    Finally, make sure you compiled the ext2 filesystem directly into the kernel.'
