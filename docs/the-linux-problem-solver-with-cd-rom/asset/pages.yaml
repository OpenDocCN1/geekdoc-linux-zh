    This library does not come with Red Hat.


    **Fix (case 3):** You may have an incomplete or incorrect compiler installation.
    You not only need a full set of include files in /usr/include, but also a set
    of Linux kernel include files in /usr/src/linux/include/linux. Verify these directories
    exist and contain files (you may need to install the Linux kernel''s source code),
    and also that /usr/include/linux is a symbolic link to /usr/src/linux/include/linux.


    **Fix (case 4):** It''s possible that you''re attempting to compile for an operating
    system other than Linux. Look over the Makefile and installation instructions
    to see if they make special mention of Linux. Look at the failed file around the
    place where the offending line of Linux directive is located, and eliminate it
    as described in the Skipping Lines subsection.


    # PROBLEM 78


    **Symptom:** You get an error message similar to


    ```text

    t.c:22: conflicting types for ''errtype''

    /usr/include/example.h:47: previous declaration of ''errtype''

    ```


    **Problem:** The programmer screwed up and put in a prototype that shouldn''t
    be there.


    **Fix:** This example shows an erroneous redeclaration of errtype on line 22 of
    t.c. /usr/include/example.h already made the correct declaration. Look at and
    around the offending line, and comment it out (see the Skipping Lines subsection).'
  merge: -1
