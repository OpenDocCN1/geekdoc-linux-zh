    \ box\n\n# XUSERFILESEARCHPATH\n\nThe environment variable XUSERFILESEARCHPATH\
    \ causes an X application to look in a place in addition to the usual app-defaults\
    \ search path. If, for example, you want to put files containing application defaults\
    \ (say, XTerm) into $HOME/lib/app-defaults, put this line in .bashrc or .cshrc:\n\
    \n```\nXUSERFILESEARCHPATH=$HOME/lib/app-defaults/XN*X\n export XUSERFILESEARCHPATH\n\
    ```\n\n# A Touch of Color\n\nEver wonder why, in spite of the fact that all sorts\
    \ of files in /usr/X11R6/lib/X11/app-defaults end with -color, your programs still\
    \ appear in monochrome? Try this on the command line:\n\n```\n$ XUSERFILESEARCHPATH=/usr/X11R6/lib/X11/app-defaults/XN-color*X\n\
    $ export XUSERFILESEARCHPATH\n```"
  merge: -1
