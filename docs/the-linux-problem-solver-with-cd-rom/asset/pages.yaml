- pgno: 13
  md: '# PREFACE


    Beneath the surface of the many graphical Unix environments that have come out
    in recent years is a world of diverse little programs and files. Linux is no exception
    to this. While it may seem overwhelming at first, you''ll soon realize that anything
    on the system can be altered by changing a file, or maybe compiling and installing
    a new program.


    The basic environment for systems administration in Linux is not much different
    than other Unix variants: it''s still a shell (command-line interface). Over the
    years, various tweaks have appeared which make some tasks much less painful (an
    example is the kernel configuration that you''ll see in Chapter 7).


    Repeated efforts have been made to give a graphical user interface to Unix systems
    administration. Invariably, these tend to do a decent job of configuring a base
    system and getting it running, but they fall short handling complex tasks. Unix
    software is highly configurable, and typically designed to work as independently
    as possible. To get a firm grip on your system, you must get comfortable with
    the shell, because it is the most efficient interface to the filesystem and currently
    running processes.


    If there''s one thing that you''re going to see throughout this book, it''s the
    phrase "Try to keep it simple." I can''t stress this enough, especially with regard
    to configuration files of any sort. The default files which come with most packages
    are usually reasonable places to start, although there are some notable exceptions
    (mostly with user environments). The larger and more complicated your configurations
    are, the more difficult they will be to understand and modify later. You''ll also
    minimize the risk that a later version of a package will be slightly incompatible
    with the old configuration files.


    Much of the material in this book takes root in traditional Unix systems administration.
    For example, Chapter 9 on user environments is as applicable to any Unix flavor
    as it is to Linux. However, this is not to say that things don''t change, and
    unfortunately, people tend to have a tendency to stick with their old ways for
    a bit longer than they should. A case in point is illustrated in Chapter 5 on
    printing: A great number of sites still run the older lpd printing daemons instead
    of LPRng. But that''s not to say that every new program should be embraced and
    the old stuff thrown out; new (and hence fairly untested) software isn''t known
    for its stability, after all.'
  merge: -1
  img_proc: true
