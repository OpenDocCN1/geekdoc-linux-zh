    # 2.5 Network Security


    Quite a few unsavory types play out there on the Internet, and it''s generally
    to your advantage not to let your Linux box become their playground. Whether they
    deface your Web site, run IRC bots, or remove all of your files, they invariably
    cost you two things: time and irritation. Don''t wait for a break-in to occur
    before securing your system.


    > NOTE

    > This section isn''t an all-encompassing guide to network security, but aims
    to solve some common security problems. A good place to start for in-depth security
    information (including topical information) is http://www.sans.org/.


    # Keep Things Simple


    Don''t run excess or questionable services on your Linux machine. (Unfortunately,
    some distributions do a pretty good job of starting as many services as possible
    by default.) Also, if only some remote hosts require certain services, limit the
    services to those hosts.


    Since most Internet services launch from inetd, the first place to look for excess
    services is /etc/inetd.conf (see Section 2.2 for a discussion on inetd). If inetd
    does not start a network service, probably init is starting it. Have a'
