- pgno: 224
  md: 'As mentioned in section 7.3, floppy drives and disks tend to be slow and unreliable,
    but you can get them to work reasonably well with the superformat program in the
    fdutils package.


    You can also use one of the RAWRITE programs supplied on the CD to write the image
    to the floppy in DOS. There are two versions (rawrite1 and rawrite2); see the
    README file in the tools/rawrite directory for more details.


    # Booting Up


    The boot image supports all processors (but does not include math coprocessor
    emulation). It also includes standard disks, SCSI disks, tapes, and CD-ROM support,
    as well as a number of controller drivers, including the Adaptec AIC7xxx controllers
    (a9x0 series) and NCR/Symbios controllers. It does not support non-ATAPI or non-SCSI
    drives.


    # PROBLEM 100


    Symptoms: The kernel can’t find the disk or the CD-ROM drive.

    Problem: The image on the CD doesn’t support the device.

    Fix: See the Different Boot Kernels subsection.


    When you boot off the CD-ROM, a message comes up:


    ```

    Linux Problem Solver

    Bootable CD

    boot:

    ```


    boot: is a prompt from the SYSLINUX system; it’s not LILO, but resembles it. The
    kernel image is named linux, and you can pass options to the kernel in the same
    way as with LILO.


    If you just press ENTER at the boot prompt, the kernel loads and runs a system
    from a small boot image (the same image you get when you make a floppy disk).
    This system includes a small init with two virtual consoles. The first console
    runs a setup script, and the second (accessed with the usual ALT-F2) starts a
    shell.


    The setup script asks if you want to mount the CD, and proceeds to mount it if
    possible. The boot image contains a number of small, stripped-down utilities (in
    case you need the CD-ROM drive for another purpose, or just can’t use it), but
    the CD contains many full versions of programs.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'You’ll notice other differences between the CD and the boot image once you
    start using them. For example, the shell that comes on the boot image is a very
    small sh version that doesn’t offer command-line editing and other stuff, but
    the CD includes a full-fledged bash. The same is true of text editors.


    How you go about trying to fix your system is up to you. Sometimes you won’t need
    to do much to get your system back in action. For example, if your CD-ROM is complicated
    to set up, you can just jump to the other virtual console with ALT+F2 after booting
    up and do a quick fix. However, some utilities aren’t available from the boot
    image.


    # Using an Intermediate RAM Disk


    If you need to use a utility on the CD-ROM along with a file on another CD, you
    can create a new, empty RAM disk and copy the utility from the boot CD-ROM to
    the RAM disk. Then you can unmount the boot CD-ROM, mount the other CD, and run
    the utility from the RAM disk.


    There are preconfigured RAM disks of any size from 1MB to 16MB. To attach a 5MB
    RAM disk to /rd, type this:


    ```

    # rd mount /rd 5

    ```


    The rd mount program is simply a script in the bin directory of the CD-ROM.


    > ACKNOWLEDGMENT We based the floppy boot image for the CD on the install/rescue
    image that comes with the Debian distribution. We appreciate the Debian team’s
    efforts at creating a lucid, easy-to-modify image.


    # Different Boot Kernels


    If you have some peculiar hardware that the kernel on the CD doesn’t support,
    you can make your own boot image. This image is a FAT filesystem; you just make
    a kernel that supports your device, then you replace the original on the disk
    image. First compile a suitable kernel as described in Chapter 7, including RAM
    disk and initrd support. Then mount the disk image like this:


    ```

    # mount -t msdos boot.bin /mnt -o loop=/dev/loop0,blocksize=1024

    ```'
