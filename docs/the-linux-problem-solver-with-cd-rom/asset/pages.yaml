    # Adding Kernel Support


    In addition to the ipchains command, your system needs to add kernel support for
    IP masquerading, which you’ll find buried beneath a few items in the kernel configuration
    (at least for version 2.2—see Chapter 7 for details on how to build a kernel).
    When you’re configuring the kernel, remember to go through these steps in the
    configuration menu:


    +   1. Under Networking options, choose Network firewalls.

    +   2. Go down a couple of lines and choose IP: Firewalling (this appears only
    after you choose Network firewalls).

    +   3. Go down a few lines and pick IP: Always defragment (required for masquerading).

    +   4. Choose IP: Masquerading (this should pop up along with IP: Firewalling).

    +   5. Include IP: ICMP masquerading among your options—it enables a few diagnostic
    tools such as ping and traceroute.


    The above procedure works fine for one local subnet, but let’s say that we have
    two. To get our ancient NeXT and some other toys connected—and because we’re too
    cheap to buy a dual-speed hub—we have a 10BaseT Ethernet hub for subnet 10.1.2.0
    (net mask 255.255.255.0). The gateway has an additional Ethernet interface, eth1,
    plugged into the slower hub and running at the address 10.1.2.1. After setting
    the default gateway to this address for the machines on this other subnet, we
    use the ipchains command:


    ```

    # ipchains -I forward -b -s 10.1.1.0/255.255.255.0 -d 10.1.2.0/255.255.255.0 -j
    ACCEPT

    ```


