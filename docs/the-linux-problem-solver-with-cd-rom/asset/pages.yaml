    a few manual pages in /usr/local/man.


    # PROBLEM 68


    Symptom: make install fails; error message in response to an install or cp command
    looks like the following:

    pathname: No such file or directory


    Problem: Makefile rule for install expects directories that don''t exist.


    Fix: These error messages can be persistently annoying if you run into a lot of
    them. The only way to get around it is to create the directories. The fastest
    way is with

    $ mkdir -p pathname

    This creates all parts of the pathname that don''t exist already.'
