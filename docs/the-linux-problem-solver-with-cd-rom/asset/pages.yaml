- pgno: 120
  md: '# 5


    # PRINTING


    # 5.1 Introduction


    Few tasks are as messy as printing under Unix, and Linux is no exception. Let’s
    face it, printers aren’t much fun—almost every model is unique in some way, and
    you run into an overwhelming number of different protocols and dialects.


    That said, few problems will anger your users more than not being able to print
    when they want to. We’ll try to cover as much about printing as possible in this
    chapter, from dealing with font problems to networked printing.


    Printer drivers, as other operating systems like Windows call them, do not exist
    as such under Linux and Unix. Other operating systems define a common meeting
    place for applications and printer drivers, ensuring uniform output. In stark
    contrast, practically every Linux application that prints graphics has its own
    built-in printer driver, which generates output right down to code for the printer.
    Some use auxiliary programs to generate printer output—an example is xfig, which
    requires the fig2dev package to print.


    Rather than attempt to make every program talk to a wide variety of printers,
    Unix programmers tend to support only PostScript, a page description language
    from Adobe. You can get most printers to support PostScript, but it takes time—not
    just to get the printer to work, but also to make the output look halfway decent.
    (If you have a Mac, good news—you can use the LaserWriter 8 driver to talk to
    a printer on a Linux machine.)'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'While a user can sometimes talk to a print device directly, print jobs under
    Linux generally run through a printer daemon. When a user sends a job to the printer
    daemon, the daemon spools it to a queue directory, where it waits its turn to
    go to the printer. Next, it passes through a print filter, and finally goes to
    the device itself. The filter turns the printer’s various bells and whistles (tray
    selection, duplex mode, and so on) on or off, and may also convert the job into
    a format the printer can understand—if your printer doesn’t have native PostScript
    support, the filter will probably include a rasterizer that interprets PostScript.


    In practice, setting up a printer involves three main steps:


    +   1. Installing the print filter software.

    +   2. Making sure the computer can talk to the printer.

    +   3. Putting it all together for the print daemon, lpd, in /etc/printcap.


    Step 1 is the time-consuming part. (Sections 5.3 and 5.4 below deal with the two
    main kinds of filters.) At one time, Step 2 was problematic because many printers
    connected to the serial port, and the various port settings had to be just right
    (not to mention that for Step 3, you had to code all of the ioctl settings in
    one hexadecimal stream). Not only has this become more uniform, but serial printers
    are no longer common.


    Before we can do much work with printers, we need to talk about the system that
    oversees print requests: the print daemon.


    # 5.2 Print Daemons


    Unfortunately, Unix has a messy set of three main print daemons, and we have to
    mention all of them.


    # lpsched


    Most System V-based machines include this. The less said about this system, the
    better (it has awkward queuing and obfuscated filters). However, it gets a mention
    because some programs try to print using its queuing programs.


    # Berkeley lpd


    BSD systems use this, and it’s standard on most Linux distributions. It’s an older
    program, but it works.


    # LPRng


    This new system resembles lpd, but has many enhancements and filters. Because
    they’re the ones found on most Linux distributions, we’ll cover only lpd and LPRng.
    Some distributions include a system called PLP, which you can think of as a predecessor
    to LPRng. Which one you choose depends mostly on the printers you have and the
    size of your installation.'
  merge: -1
  img_proc: true
- pgno: 122
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 123
  md: 'contains the name definitions of the printer; you give one of these to the
    -P option of the lpr commands. That is, to send a job to this printer, you might
    use

    $ lpr -Pst800 file

    where file is a PostScript file; in this example, you could use lp, PostScript,
    and ps as alternatives to st800. Each entry in /etc/printcap corresponds to one
    printer; the example above pertains to one Epson Stylus Color 800 printer.


    # PROBLEM 50


    **Symptoms:** lpd behaves oddly for one printer (jobs dropped, incorrect filtering,
    outright failure, and so on). Part of entry ignored.


    **Problem:** Missing colon or backslash in /etc/printcap file.


    **Fixes:** A colon must start and end all lines in a printcap entry (except the
    first line, which should not have a leading colon), and all lines but the last
    in an entry must end with a backslash. This entry is wrong because it lacks backslashes
    and leading colons:


    ```

    lp|PostScript|ps|st800|My Printer:


    lp:/dev/lp0:sd=/var/spool/lpd/st800:


    ...


    of=/usr/local/lib/filters/psof:

    ```


    This entry is correct—the backslashes and colons are underlined:


    ```

    lp|PostScript|ps|st800|My Printer:\

    :lp:/dev/lp0:sd=/var/spool/lpd/st800:\

    ...

    :of=/usr/local/lib/filters/psof:

    ```


    # A Typical Remote Printer Entry with lpd or LPRng


    A remote printer is one for which Linux does not do any queuing. When lpd gets
    a job for a remote printer, it simply passes the job along to another machine.
    This typical remote printer entry works with lpd or LPRng:


    ```

    remote|Printer on another Desk:\

    :lp:=sd=/var/spool/lpd/lj:\

    :mx#0:rm=mikado.example.com:rp=lp:

    ```'
  merge: -1
  img_proc: true
- pgno: 124
  md: "The remote host that receives the print jobs is mikado.example.com and the\
    \ name of the printer on that host is lp (usually defined in the remote host's\
    \ /etc/printcap).\n\n# Common /etc/printcap Components\n\nHere are some common\
    \ /etc/printcap parameters:\n\n# :sd=/some_directory:\n\nThe spool directory:\
    \ Files go into a queue here while they wait to print. This directory must exist,\
    \ and the print daemon (which usually runs as user daemon) must be able to write\
    \ to it. The spool directory for our first printcap example was /var/spool/lpd/st800.\n\
    \n> PROBLEM 51\n> \n> Symptom: Print jobs cause errors or simply disappear.\n\
    > Problem: Spool directory doesn't exist or lpd can't write to it.\n> Fix: If\
    \ you specified :sd=dirname: in /etc/printcap, make sure that the directory exists\
    \ and that lpd, which usually runs as daemon, can write to it. This directory\
    \ can cause a major hassle on larger networks where printers frequently come and\
    \ go—you can create them automatically with the printcap generation system described\
    \ in Section 5.5. A simple\n> # chmod -R daemon.daemon dirname\n> usually takes\
    \ care of most of these problems for small networks and print servers.\n\n# :lf=/some_directory/file:\n\
    \nThe log file: This is usually a file called log in the printer's spool directory.\
    \ The print daemon must be able to write to it.\n\n# :af=/some_directory/file:\n\
    \nThe accounting file: If your printer supports it, you can keep track of printer\
    \ use with this file."
  merge: -1
  img_proc: true
- pgno: 125
  md: '# PROBLEM 52


    Symptom: Printer accounting doesn''t seem to work.


    Problem: Accounting file is unwritable.


    Fix: As with the spool directory, daemon must be able to write to file as specified
    by af=file in the printcap.


    # :if=/some_directory/file:


    Print (input) filter: This is the generic filter through which all jobs pass before
    going to the printer. In addition to converting any plain text to PostScript,
    this filter also prepares the device for printing and in many cases actually sends
    the output to the device (for example, if it''s a network printer). If a printer
    doesn''t directly support PostScript, this filter converts PostScript to the printer''s
    native format.


    # :of=/some_directory/file:


    Output filter: This filter runs after a print job processes. The output filter
    is useful for cleanup or other between-job tasks, such as creating banner pages.


    # :mx#0:


    This sets the maximum file size. When set to 0 (as in this example), there is
    no limit on the file size. Because PostScript file size doesn''t bear much relation
    to the physical size of the job, it doesn''t make sense to keep this at anything
    but 0.


    # :sh:


    Suppress header page: The printing system defaults to printing a header (also
    known as a banner or burst) page, which identifies the user and job name. This
    flag turns the header page off, which is entirely inappropriate for most modern
    applications.


    # :rm=some_printer: and :rp=some_host:


    These signify the remote printer name and host. These options tell lpd that the
    printer isn''t attached locally and that it should send the job to some_host for
    printing on some_printer. (LPRng offers a much cleaner alternative—see LPRng Enhancements
    below.)


    Relevant man pages: printcap (5), lpd (8), lpq (1), lpr (1)'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Network Printer Access


    To allow other machines on your network (Linux, Unix, or otherwise) to access
    a printer on your computer, you''ll need to enable access control. Berkeley lpd
    has a very simple system that allows any host listed in /etc/hosts.lpd or /etc/hosts.equiv
    to print. (Remember that /etc/hosts.equiv is a more general-purpose file for hosts
    that can use rlogin without a password.)


    # LPRng Enhancements


    Berkeley lpd is old software that has survived simply because no one had much
    motivation to improve it. Times change, though, and so do printers and especially
    networks, which is why Patrick Powell developed LPRng. Its license is similar
    to perl''s—a GNU-style General Public License and Artistic License. In addition
    to the versions included on the CD-ROM, you can get it at http://www.astart.com/
    (AStart also provides commercial support). In this section, we''ll see some of
    LPRng''s more noteworthy improvements over lpd.


    # :lp=some_printer@some_host: in /etc/printcap


    This is an easy way to refer to remote printers.


    # Better User Control over Printer Options


    When you set different printer options with Berkeley lpd, each option requires
    an additional entry in /etc/printcap. For example, duplex printers have two /etc/printcap
    entries (and two different spool directories), with the name of one ending in
    -simplex (for single-sided output). Multiple entries for different print options
    are unnecessary with LPRng; instead, the user may specify options with -Z (as
    in -Zsimplex).


    # System V lpsched Emulation


    Certain programs are written to print with System V''s lp command, and you may
    find it hard to adapt them to BSD-style programs. LPRng provides lp, lpstat, and
    cancel programs, which behave much like the System V programs but queue with LPRng.


    # Flexible Configuration


    An /etc/lpd.conf in LPRng allows a number of configuration options, including
    where to find the printer database (instead of placing it in /etc/printcap).


    # Better Authentication and Security


    LPRng allows the use of Kerberos, and can support selective print permissions
    based on the user group and netgroup maps.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Using lpc to Control lpd


    Once you have your print spooling system up and running, you''ll periodically
    need to kill jobs, disable printing and spooling, and so on. The lpc program,
    usually meant to run as root, does the job, though it only manipulates the queue
    and spool. For diagnostics, look at the lps.


    You can run lpc interactively or in command-line mode. To enter interactive mode,
    run lpc without any arguments, then type in commands like status all at the prompt.
    You can also run certain commands by adding the command as an argument to the
    shell. Thus, if you enter lpc status all at your shell prompt, you''ll get the
    same result as by entering lpc first and then status all, but lpc will terminate
    immediately and you''ll get your shell back.


    # lpc Commands


    Some of the more useful lpc commands include:


    **clean all|printer** Removes all files in the queue for local printers. This
    can come in very handy when a printer has been down for some time and jobs have
    stacked up in its queue. When you use LPRng, the clean command is not available
    for lpc; use the clean argument to lprm instead.


    **disable all|printer** Disables the queue for a printer, making it impossible
    to send files to it.


    **abort all|printer** Disables printing, but allows users to queue jobs. Useful
    if you''re doing a quick fix to a printer.


    > Relevant man page: lpc (1)


    ![](img/8131acdd754b0d26c380a2035b509e34_127_0.png)


    # 5.3 PostScript Printers


    If your printer supports PostScript, to print a PostScript job you just send it
    to the printer. However, some complications may arise.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# PROBLEM 54


    Symptoms: Jobs disappear. Connections are refused.


    Problem: The spooler for a networked PostScript printer doesn''t handle queuing
    very well.


    Fix: While most network printers support the Berkeley lpd protocol directly, allowing
    you to treat each printer as if it''s on a remote machine, typically you should
    avoid this method because poor queuing, difficult accounting, and lack of options
    may result.


    Many network printers support direct connections on a special port (with HP printers,
    it''s port 9100). For that, you can use ifhp (a print filter for LPRng, which
    we''ll describe later). If your printer doesn''t support direct connections, you
    have a choice to make. On a smallish network, you can probably use the printer''s
    built-in lpd server. Otherwise, you may want to find some other way to talk to
    it—and frightening as this may sound, AppleTalk connections with Netatalk may
    be the solution.


    # HP, HP-Like Printers, and Other PostScript Printers


    HP''s laser printers are very popular, and many others on the market (such as
    those from Lexmark) work like them. The ifhp filter for LPRng is a good one to
    use with such printers, whether you connect to them directly through a parallel
    port, through a network, or by some other means. One excellent ifhp feature is
    the generation of appropriate PCL commands to the printer for options, such as
    alternative paper trays and duplex printing.


    > NOTE

    > All of the printcap examples here relate to LPRng only. With a little effort,
    you can get them to work with regular lpd; see below for a simple wrapper to help
    you do so.


    ifhp offers many different ways to specify options—through files, on the command
    line, and through the printcap—but you don''t need to use them all. Remember,
    the best configuration works predictably, and that''s often the simplest one.


    Install the ifhp package with whatever prefix you like (it''s on the CD-ROM in
    support/printing; see Chapter 6 for information on installation from source code).
    We''ll use /usr/local for our examples, so the filter will end up in /usr/local/lib/filters.


    # LPRng ifhp printcap


    Let''s get right to an LPRng printcap example for ifhp—this one is for an HP network
    printer:'
  merge: -1
  img_proc: true
- pgno: 129
  md: '```

    myprinter|MyPrinter|Printer on my desk:\

    :lP=myprinter.mydomain.com#9100:sD=/var/spool/lpd/myprinter:\

    :lf=/var/spool/lpd/myprinter/log:\

    :mx#0:sF:sh:\

    :if=/usr/local/lib/filters/ifhp:\

    :of=/usr/local/lib/filters/ofhp:

    ```


    Here, myprinter.mydomain.com is the printer’s network host name and 9100 is the
    TCP port to connect on. We’ve completely suppressed the header page (with :sh:).


    # PROBLEM 55


    Symptom: lpd complains that myprinter.example.com#9100 is not a device.


    Problem: You’re using ifhp with Berkeley lpd, and the device isn’t supported.


    Fix: The recommended fix is to ditch the old lpd and install LPRng. Barring that,
    you can fake a device and write a shell script wrapper for ifhp. To do this, first
    change the device to a null device with :lp=/var/spool/lpd/name/null: [see the
    section on AppleTalk printers later in the chapter for instructions on how to
    create the null device]. Then write a /var/spool/lpd/name/ifhp.wrapper script
    that looks like this:


    ```

    #!/bin/sh

    /usr/local/lib/filters/ifhp -Tdev=myprinter.example.com#9100 $@

    ```


    Now change the printcap to reflect the new filter with :if=/var/spool/lpd/name/ifhp.wrapper:


    If you don’t have a host name for the printer, you can use an IP address; if you
    haven’t set one, you’ll need to. You have several options for doing so—either
    by hand through the printer’s control panel, or with RARP/ARP, bootp, DHCP, tftp,
    or another method. Your best bet is to look at the printer manual, since printers
    can have very different requirements.


    Chances are if you have a network printer, you have some other machines on the
    network as well. If just one of those machines is a Linux or Unix machine, designate
    it as a print server with an /etc/printcap like the one above, and have the other
    machines treat the printer as a remote device; in'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'other words, they send their jobs to the print server for queuing and processing.
    (For the print server, take a look at the earlier section called Network Printer
    Access on remote printer access; the other machines will have entries that look
    like the remote printer example in Section 5.2.)


    Here’s another example, this one for an HP duplex printer attached locally to
    a parallel port:


    ```

    myprinter|MyPrinter|Printer on my desk:\

    :lP=/dev/lp0:sd=/var/spool/lpd/myprinter:\

    :lf=/var/spool/lpd/myprinter/log:\

    :mx#0:sf:sh:\

    :ifhp=duplex,status@:\

    :if=/usr/local/lib/filters/ifhp:\

    :of=/usr/local/lib/filters/ofhp:\

    :vf=/usr/local/lib/filters/ifhp -c:

    ```


    As the example above shows, the special ifhp= part of the printcap specifies various
    filter options. To turn an option off, put an "@" sign (@) at the end. In this
    example, note the status@ filter setting due to the parallel port connection.
    The device is /dev/lp0, the parallel port on most PCs (as of Linux kernel version
    2.2).


    There are two kinds of options: administrator options (also called -T options),
    and user options, which any user can access through the command line using -Z
    (also known as -Z options). For example, lpr -Zduplex allows two-sided printing
    if the printer supports it.


    The following options also provide language support. (We’re most interested in
    PostScript, but the others come in handy for selecting paper trays, turning modes
    on, and printing text.) You can enable any available language support options:


    +   PS or ps  PostScript

    +   pjl  PJL, Printer Job Language

    +   pcl  PCL, Printer Control Language


    > NOTE Separate multiple options with commas, as in :ifhp=duplex,status@:. To
    turn off both PJL and PCL, use :ifhp=pjl@,pcl@ in /etc/printcap.


    Other filter options include:


    # model=name


    ifhp predefines a number of printer models with their various capabilities and
    limitations. See the ifhp.conf file for a list.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# status


    This fetches the printer status. Since this requires a bidirectional connection
    and a printer that supports status in the first place, sometimes you must turn
    it off.


    # pagecount


    In order to do accounting, you need to get page counts.


    # no_ps_eoj, no_pcl_eoj


    Some printers don''t like the end-of-job code, which the ifhp filter sends at
    the beginning of each job to clear any lingering errors. Use these options to
    turn the code off for PostScript or PCL, as appropriate.


    # Selecting Other Options with ifhp.conf


    The options described above are the basic ones to start with, and they may be
    all you need. But what about selecting other options, such as duplex for double-sided
    printing? This is where a new file, ifhp.conf, comes into play.


    As it turns out, the default ifhp.conf file contains a large number of prebuilt
    option definitions for various printers, including default settings for most HPs.
    Type `less /etc/ifhp.conf` (or wherever you installed ifhp.conf), then type `/ps_user_opts`
    to jump to a line of user options that ifhp can make available. As the first line
    in the file, this should also include the default settings. Look them over to
    get an idea of what''s available, keeping in mind that your printer may not support
    all of them.


    # Two Parts to the ifhp.conf File


    The ifhp.conf file is very large and contains a tremendous amount of information,
    but you can divide it into two parts:


    **Part 1: _Default options and definitions._** Each option is defined as a printer
    code for each language. For example, the `ps_duplex` definition tells you what
    the filter will hand to the printer when PostScript is the active language. The
    `pcl_duplex` definition performs a similar function for PCL.


    **Part 2: _Specific printer definitions._** As in Part 1, each option is defined
    as a printer code, except that each printer configuration begins with a label
    enclosed in square brackets; for example, `[apple postscript ps]`. Search for
    apple in the ifhp.conf file to see this definition.


    > Part 2 is where the `model=name` option becomes relevant. If you put `:ifhp::model=apple:`
    in any entry in your `/etc/printcap`, ifhp will search for apple in the labels
    and use the modifications that configuration defines.


    ![](img/8131acdd754b0d26c380a2035b509e34_131_0.png)'
  merge: -1
  img_proc: true
- pgno: 132
