    # 8.5 Crash Recovery


    It may sound a little hackneyed, but don''t panic if you run into a serious problem
    with your system. Short of someone doing a little "fine-tuning" on your hard drive
    with a sledgehammer, getting your system back online is just a matter of putting
    files back in place.


    Before you jump into action to fix a system problem, make sure you have a very
    clear idea what is wrong and how to fix it. For example, if you deleted your init
    program, you should plan on booting the machine so you can access the filesystem
    (and a copy of init) and put init back. But don''t get carried away with planning:
    More often than not, a method you thought would work perfectly just won''t.


    # The Rescue CD-ROM


    In addition to containing tools that other sections of this book reference, the
    bundled CD-ROM can boot up your system with a bunch of crash recovery tools.


