    # PROBLEM 11


    Symptom: Your firewall machine is vulnerable to attack.

    Problem: False feeling of security.

    Fix: Don''t let the firewall machine accept connections on just any port from
    absolutely anything in the outside world. If the firewall machine can reach any
    part of the network with no problem, then intruders need only break into the firewall
