    # /etc/resolv.conf


    The file /etc/resolv.conf contains information for finding host names with DNS
    (domain name service). It usually contains the IP addresses of one or more name
    servers with some default domains to use as an optional suffix in searches. For
    example, under the setup


    ```

    search home.example.com example.com

    nameserver 10.0.0.2

    nameserver 10.0.0.3

    ```


    atlantic.home.example.com would be the first attempt at a valid host name for
    an attempted connection to a host called atlantic. If atlantic.home.example.com
    didn''t exist, atlantic.example.com would be the next attempt.


    # /etc/nsswitch.conf


    The file /etc/nsswitch.conf provides a flexible means of host name resolution
    and other system information. When a program wants to resolve a host name into
    an IP address, it makes a library call, which consults a number of files and services
    based on /etc/nsswitch.conf. For example, if the line


    ```

    hosts:    files dns

    ```


    appears in /etc/nsswitch.conf, files comes first, so initially the file /etc/hosts
    is consulted as a table of host names, and if nothing relevant is found there,
    dns becomes the active keyword and DNS is consulted. (See the subsection on /etc/resolv.conf
    above to see how to configure the DNS resolver.)


    # /etc/services


    Internet services run on a machine''s port, which has a numeric value. TCP examples
    include SMTP mailing on port 25, telnet on port 23, finger on port 79, and www
    (http) on port 80. However, programs don''t usually refer to the ports by number,
    so they map ports in /etc/services and convert names to numbers. Here''s an excerpt
    from one such file:


    ```

    ftp        21/tcp

    ssh        22/tcp    # secure shell

    ssh        22/ucp    # secure shell

    telnet     23/tcp

    # 24 - private

    smtp       25/tcp    mail

    ```'
