  md: '# PROBLEM 106


    **Symptoms:** The boot fails after mounting the root filesystem. You get a partial
    boot.


    **Problem:** init errors.


    **Fix:** Aside from deleting /sbin/init completely, in which case you’re stuck
    with the task of putting it back, the most likely cause of init not starting is
    that you’re mounting the wrong filesystem. Try giving the root=/dev/devname argument
    to LILO (or whatever you use to boot your kernel). If this doesn’t work, either
    the filesystem is corrupt and you need to fix it, or you need to compile the correct
    filesystem driver (ext2) into your kernel.


    On the other hand, if the root filesystem mounts but the system boots up only
    part of the way, there’s some problem in one of the rc*.d directories. Device
    drivers or network failures often cause rc*.d problems. First make sure all of
    the files are actually in place. Look carefully at the boot messages to see if
    you can tell which one is failing. If you can’t zero in on it, try renaming the
    start-up script links (in such a way that they don’t start upon boot), then rebooting
    the system.'
