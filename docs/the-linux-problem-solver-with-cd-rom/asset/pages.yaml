    # 2.4 Routing, IP Filters, Firewalls, and IP Masquerading


    After you''re familiar with network configuration on single hosts, you may need
    to use Linux to bind networks, filter out traffic, and act as a gateway to the
    Internet. The first step is to learn about subnets and routing. Then you can use
    ipchains to add more sophistication.


    # Basic Routing and Subnets


    A router is basically a computer that passes traffic between subnets (chunks of
    Internet address space assigned to a local network) through network ports. For
    a router to work, the subnets must have assigned, static IP addresses (in the
    case of leaf networks, your ISP assigns them). The router will have at least two
    network interfaces, one linking to the ISP and the other linking to the rest of
    the world.


    # Subnets


    Version 4 Internet addresses consist of 4 bytes, usually written in decimal form
    (as in 10.4.5.6). A host''s subnet is the part of the address identical on all
    hosts on the immediately surrounding local area networks. In one of the most common
    subnet configurations, only the address''s last byte varies (see the example below).'
  merge: -1
  img_proc: true
- pgno: 47
  md: '```

    00001010.00000100.00000101.00000110 (address)

    11111111.11111111.11111111.00000000 (subnet mask)

    00001010.00000100.00000101.xxxxxxxx (10.4.5.N, N = {1, .., 254}, network)

    ```


    The xxxxxxxx can be any eight-character string of 0s and 1s.


    When converted into binary, the first number in the subnet mask, 255, yields eight
    1s. Since 1 in the subnet mask means the corresponding binary digit in the IP
    address does not change, the number 255 (or eight 1s in binary) means the number
    on the address of an incoming packet must be the same as the corresponding number
    in the host’s address. Therefore, the subnet mask 255.255.255.0 stipulates that
    the first three numbers on the address of the incoming packet must be the same
    as the first three numbers of the host’s address, and that the last number can
    vary. The last number refers to a machine or network connected to the host. The
    subnet mask 255.255.255.0 is easy to work with, because you never have to do any
    binary conversion to figure out whether an address is local. Either the first
    three bytes (numbers) are the same, meaning that the host is part of the local
    network, or the host is somewhere else.


    > NOTE

    > For simple routers, this is more or less all you need to know for the moment.
    Skip to another section if you don’t want to see more complex examples.


    Part of a router’s work may be to distribute packets bound for different subnets.
    Let’s say you have one address space, 10.4.5.0, with the subnet mask 255.255.255.0.
    For some physical reason (such as different types of network interfaces), you
    have to split your address space into four subnets.


    The four new networks you propose are 10.4.5.0, 10.4.5.64, 10.4.5.128, and 10.4.5.192,
    which you get by taking all combinations of two bits in the last byte (you control
    the last byte, so you can do anything you want with it):


    ```

    00001010.00000100.00000101.00xxxxxx (10.4.5.N, N = {1, .., 62})

    00001010.00000100.00000101.01xxxxxx (10.4.5.N, N = {65, .., 126})

    00001010.00000100.00000101.10xxxxxx (10.4.5.N, N = {129, .., 190})

    00001010.00000100.00000101.11xxxxxx (10.4.5.N, N = {193, .., 254})

    ```


    The underlined bits are the ones that you’ve chosen to define the four new networks.
    Your router now must do a little extra work to figure out where to send packets
    based on their destination address. Of course, if the address doesn’t match 10.4.5,
    the router still knows that it should send the packet off to the outside world.
    But if the address does match, the router must also look at two more bits of the
    address—the first two in the last byte. Hosts on this subnet use a subnet mask
    of 255.255.255.192, which in binary is


    ```

    11111111.11111111.11111111.11000000

    ```


    You may also see networks specified in a form such as 10.4.2.0/24. The 24 is a
    shortcut for a net mask of 255.255.255.0. 24 is the number of leading 1s in the
    net mask.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# IP Forwarding


    Say you want to enable simple IP forwarding (sometimes known as gateways, a feature
    that allows network traffic to pass through your machine from one network to another)
    on your Linux machine. First set up all your network interfaces on the machine
    (with the proper subnet masks) so that it can reach everything it needs to (including
    any outside network accessible through the default gateway). Then tell the kernel
    you want to turn forwarding on:


    ```

    # echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    # Firewalls


    A firewall is a router that looks at a packet (usually the network address and
    port part of the packet) and decides whether to let it pass. A firewall alone
    won’t make your network particularly secure, and it can hinder throughput to the
    outside world, but at least it can hamper annoying things such as port scans.


    # IP Chains


    An IP chain is a list of rules the kernel uses to decide if it should let a packet
    pass, and in some cases how to route it. The three chains built into a kernel—input,
    output, and forward—come into play at different stages of packet routing.


    The kernel looks at the input chain when a packet comes in from the outside world
    and the output chain just before transmission of a packet to the outside world.
    The forward chain goes to work when a packet passes through the input chain and
    the kernel determines that its ultimate destination is not the local machine (that
    is, the kernel should route the packet back out again).


    Each rule in a chain has a target—the decision the kernel makes if the packet
    matches the rule. The rules follow one of these six targets:


    +   ACCEPT    Pass the packet through.

    +   DENY      Drop the packet.

    +   REJECT    Drop the packet and try to inform the host that created it.

    +   REDIRECT  On the input chain, intercept a packet and send it to a port on
    the local machine regardless of its original destination.

    +   RETURN    Stop trying to match rules and use the default (chain policy).

    +   MASQ      Use masquerading on the packet.


    The policy of a chain is the default target, and its values are limited to ACCEPT,
    DENY, REJECT, and MASQ. This combination of chains, rules, and targets is fundamental
    to firewalls, IP masquerading, and IP filters. If you’re running a firewall, you’ll
    use the forward chain to either throw out most general traffic or redirect it
    through a proxy server with the input chain. You may also use'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'the forward chain for masqueradi ... and the in...t chain to filter IP packets
    bound for the local machine


    Here is a brief list of some important ipchains options. Capital letters signal
    the start of a command; lowercase letters, the beginning of a rule.


    | Option | Description |

    |---|---|

    | -L [chain] | List chain and the rules under it. With no additional parameters,
    show all chains and all rules. |

    | -I chain | Insert a chain rule. |

    | -A chain | Append a chain rule. |

    | -D chain [num] | Delete a chain rule number num (1 by default). |

    | -P chain target | Set the policy of chain to target. |

    | -F [chain] | Delete all rules in chain (with no argument, in all chains). |

    | -R chain num | Replace rule num in chain. |

    | -s source | Specify the source network or address and optional ports. |

    | -d dest | Specify the destination network or address and optional ports. |

    | -j target | Jump to target if this rule matches. |

    | -b | Create two rules; the second will be the same as the one stated, but will
    swap the destination (-d) and source (-s). |

    | -v | Ask for verbose mode. |


    # Example 1: IP Filters


    Unlike firewalls, IP filters allow some or all machines to do the filtering themselves
    instead of making one machine look at all the packets passing through. Before
    incoming network packets are passed off to user programs, a machine with an IP
    filter has the kernel look at the packets and decide if it should throw them out.
    If configured to throw out incoming packets from most of the world on insecure
    ports (a large majority of them are), an IP filter can defend against a variety
    of attacks.


    Suppose you want to share a bunch of services with a group of machines on a local
    network, and these services are particularly vulnerable to denial-of-service attacks
    (or worse). You’d like to make all services but ssh unavailable to the outside
    world. We’ll go through each ipchains command you need to run, explaining them
    along the way.


    Let’s say that you want to allow any packet from your local network to pass to
    any of your host’s ports. If your host is at 10.1.1.2 and your local network is
    10.1.1.0, with a net mask of 255.255.255.0, the following would let everything
    from your network through:


    ```

    # ipchains -A input -s 10.1.1.0/255.255.255.0 -d 10.1.1.2 -j ACCEPT

    ```'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Yet you also want to allow connections from your host to the outside world.


    ```

    # ipchains -A input -j ACCEPT -p tcp ''! '' -y

    ```


    says to let response packets through.


    This rule allows use of ICMP tools like ping and traceroute (among others):


    ```

    # ipchains -A input -j ACCEPT -p icmp

    ```


    Some parts of Linux tend to break if the machine can''t talk to itself:


    ```

    # ipchains -A input -j ACCEPT -d localhost

    ```


    Since we have some trust in ssh, we allow connections on that port.


    ```

    # ipchains -A input -j ACCEPT -p tcp -d 10.1.1.2 ssh

    ```


    Everything''s now in place, with one exception that isn''t necessary if you use
