- pgno: 60
  md: '# ping


    The most basic of all network probing commands, ping sends roundtrip packets to
    remote hosts and reports how long they took to get there and back. Start it with


    ```

    $ ping remote-host

    ```


    CTRL-C stops it. When terminated, ping reports average the times and the percentage
    of packets lost. Not all remote hosts respond to a ping.


    The -f (flood ping) option to ping sends at least 100 packets per second. Normally
    loaded local Ethernet connections should have no trouble handling a flood ping,
    but when you have a flaky or underperforming connection, a significant number
    of flood ping packets get lost. With most versions of ping, you can only use the
    flood option when logged in as root.


    # netstat


    This command shows network connection status. If you’re having network problems,
    it’s important to know what you have connected to your machine. Typical usage
    is with an option or two to filter output: -t displays TCP connections only (usually
    what you’re looking for), and -n disables host name lookup (for those times when
    the network is so slow that the lookup hangs). The -a option lists every active
    port. An example of netstat in action is shown below.


    # PROBLEM 14


    Symptom: When using ping -f, many packets on the network get lost and excessive
    collisions occur.

    Problem: Older, poorly optimized network or bad wiring.

    Fix: Try to eliminate hardware such as thin Ethernet and cascaded hubs on 10Mbps
    networks. An Ethernet switch can help matters at certain bottlenecks, but even
    a 100Mbps shared hub can help. Also, look out for bad wiring, especially Category
    5 twisted-pair cable that doesn’t have the pairs aligned properly.


    ```

    $ netstat -t -u

    Active Internet connections (w/o servers)

    Proto Recv-Q Send-Q Local Address          Foreign Address        State

    tcp    0      0 10.1.2.1:3128          mikado:4310            FIN_WAIT2

    tcp    0      109 dialup-s229-8:1020    broadband.example.co:ssh ESTABLISHED

    tcp    0      0 dialup-s229-8:1023    broadband.example.co:ssh ESTABLISHED

    tcp    0      438 dialup-s229-8:2787    209.207.224.222:www    ESTABLISHED

    tcp    0      0 dialup-s229-8:2786    209.207.224.222:www    ESTABLISHED

    ```'
  merge: -1
  img_proc: true
