    After all, you don’t want to put a needless obstacle in the way of your users.
    Not only that, but they may come back and bother you about how to install an unfamiliar
    editor on a new system.


    That said, you should not provide large editor setup files. A little set showmatch
    in a .exrc file never hurt anyone, but avoid set showmode, autoindent, wrap margins,
    and so on because they actually change the editor’s appearance and behavior.


    # Pagers


    Unlike editors and shells, pagers (set with the PAGER environment variable) are
    fairly passive programs. All most users ever do with a pager is press the space-bar
    or ENTER key until they’ve read enough. A fairly good choice is less, with the
    LESS environment variable set to mie so the options -m, -i, and -e are on all
    of the time.


    Relevant man page: less (1)


