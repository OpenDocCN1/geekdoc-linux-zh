    # The /proc Filesystem


    /proc is a special type of filesystem in Linux that allows flexible interaction
    with processes and kernel parameters.


    If you try ls /proc, you get a list of files and directories pertaining to several
    parts of the currently running Linux system. One way to explore the contents of
    /proc is through experimentation. Try these two commands:


    ```

    $ cat /proc/cpuinfo

    $ cat /proc/$$/status

    ```


    The first command returns what the kernel knows about the processor inside the
    machine. In the second, the $$ expands to the process ID of the current shell
    (if you’re running bash), and the whole line returns the status of the shell process.
    These are examples of the two kinds of items you’ll find in the Linux /proc file
    system: kernel and process information.'
