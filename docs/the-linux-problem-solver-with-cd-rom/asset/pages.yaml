    dialog box with 386, 486, and other options. Move to your choice with the arrow
    keys and press ENTER when you are happy. (We''ll explain what the processor choice
    does in a moment.)


    > NOTE

    > The kernel configuration process has a help system with very comprehensive documentation
    for these options. To see the help for any option, type a question mark (?) after
    selecting the option. To leave the help and return to the configuration menu,
