    In addition to the Netscape, you should offer users some options for mail and
    news readers. Two popular full-terminal screen readers are mutt and pine. Of these,
    the older one, pine, has more users, but don’t let that keep you from recommending
    mutt for mail. emacs has a number of mail readers. Avoid elm, as it’s currently
    evolving into even more of a fossil than the old Berkeley mail program.


    As for news readers, the old standby is trn, but there are some doubts on its
    user friendliness. Alternatives include slrn and tin (and, of course, emacs and
    pine). Don’t forget to go out and start a flame war on Usenet about which one
    you choose.


