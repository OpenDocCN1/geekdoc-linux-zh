- pgno: 250
  md: '# PROBLEM 114


    Symptoms: Lingering processes [Netscape and FvwmTaskBar are big culprits here].


    Problem: Some X programs don’t die as they should when xdm resets the server.


    Fix: Using a program that destroys all windows at the end of the Xsession should
    take care of most such problems. Make sure you don’t have any exec lines in the
    Xsession when you do this, since nothing after an exec call ever executes. The
    source code for a program that handles this, called killx [Bill Fenner is the
    author], is included on the CD-ROM in support/userenv.


    To wrap it up, start xdm with your new configuration using the -config option.
    If your new xdm-config file is in /usr/local/etc/xdm-config, use


    ```

    # xdm -config /usr/local/etc/xdm-config

    ```


    Relevant man page: xdm (1)


    # X Resources


    X resources are a type of preferences for X Window System applications, although
    not all X programs use them. You’ll generally find them in two places: application
    default (app-default) files and users’ .Xdefaults files. They are plain text files,
    with entries on single lines. Here is a sample entry for changing the xterm text
    font:


    ```

    XTerm.vt100.font: -b&h-lucidatypewriter-medium-r-*-*-14-*-*-*-*-*-*-*

    ```


    The resource specification on the left consists of a bunch of classes and names
    in a hierarchy. Sometimes it’s well designed; sometimes it leaves a little to
    be desired. The so-called application class name (here, XTerm) is the first. A
    program’s app-defaults filename is the application class name (that is, if the
    program has an app-defaults file). Each X program has a different application
    class name, chosen by the programmer. The rest of the resource specification (here,
    .vt100.font) is a series of various widget class names and subclass names, ending
    with a name of a property (a widget is a partition of an X application’s appearance;
    it can be a grouping of other widgets, or a single element, such as a button).'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# PROBLEM 115


    Symptoms: Applications look hideous. You encounter unexpected changes in applications
    other than the one you’re trying to modify. X applications stop working.


    Problem: You’re using * to start a line in an X resource file:


    Fix: This is one of the worst things you can put in an .Xdefaults file:


    ```

    *foreground: blue

    ```


    Because this matches all applications’ class names [and the widget class names
    underneath], be ready for a lot of blue windows. Find the full name of the specific
    widget you want; tools like editres can help you.


    # Finding Widget Class Names with editres


    Figuring out a widget class name is usually the hardest part of changing that
    class’s setting. Manual pages usually help, but sometimes it’s just not that easy;
    they may talk about a name only as the last portion of a class hierarchy. When
    you just can’t track a name down and you’re willing to tear the entire widget
    tree apart, bring out the big guns in the form of a program called editres. You
    can also use editres to figure out undocumented settings for commercial programs.


    Although it comes with most modern X distributions, editres is not well known.
    It’s a somewhat crusty GUI for navigating the resources in X widget trees. Start
    it up without any arguments. When you get the window, pull down the Commands menu
    and select Get Tree (see Figure 9-1). The mouse pointer then changes to a cross.
    Move it to a simple application that’s running on your desktop (xclock, for example),
    then click. The editres window responds by showing a tree of names. If the tree
    is too large to fit in the entire window, use the map box in the upper left corner.


    Click on one of the leaf names on the right (such as "clock" for the xclock tree)
    to invert it, then select Show Resource Box from the Commands menu. A window pops
    up showing all the resource names under that leaf—but that’s not all (see Figure
    9-2). Select one that looks promising (like the foreground setting in xclock.clock—let’s
    say you’re having trouble with xclock’s foreground color). If you want to change
    the resource value of the current program (and you don’t mind too much if the
    program crashes), type an option (such as red for xclock.clock.foreground) in
    the box at the bottom, to the right of Enter Resource Value. Click on Apply to
    see if this actually changes the program. To get rid of the Resource Box window,
    click the close button, conveniently labeled as the Popdown Resource Box button.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/8131acdd754b0d26c380a2035b509e34_252_0.png)


    For a good time, try using editres on Netscape version 4—but only when you have
    nothing better to do.


    # Activating X Resources


    One of the more confusing aspects of X resources is how to activate them. It''s
    really not that hard. You just put entries in a .Xdefaults file and start the
    application. Unfortunately, startup scripts tend to use xrdb to force the server
    to store X resources for a session, overriding the .Xdefaults and app-defaults
    files.


    xrdb works through a mechanism called the RESOURCE_MANAGER of the X server, which
    presumably makes it easier for remote X applications (sent to a display other
    than the local machine''s) to adjust to the local quirks of the X server. However,
    overriding .Xdefaults and app-defaults files is a such a serious annoyance that
    you''ll start to wonder whether letting the X server store its own resources was
    a great idea in the first place.


    To see if an X Window session has used xrdb, enter this:


    ```

    $ xrdb -query

    ```


    To get rid of all xrdb-supplied resources all at once:


    ```

    $ xrdb -remove

    ```


    If you don''t see any effect, use the apprcs command to list the current resources
    for an application. For xterm, for example, you would use this:


    ```

    $ apprcs XTerm

    ```'
  merge: -1
  img_proc: true
