- pgno: 86
  md: "On the other hand, cmdspecial waits until the distribution has finished before\
    \ executing the program.\n\n# Dist Options\n\nAs mentioned above, you can specify\
    \ a global dist option on the command line with -o, as in this example using the\
    \ compare option:\n\n```\n$ rdist -ocompare\n```\n\nor in the Distfile with the\
    \ install command:\n\n```\n( stuff ) -> ( machine )\n    install -ocompare ;\n\
    ```\n\nThere are a lot of dist options, and not all are terribly useful—for example,\
    \ a better file system structure has largely superseded the need for a noexec\
    \ option. We’ll only describe the more commonplace, useful options. For the full\
    \ list, see the manual page.\n\n# compare\n\nNormally, rdist looks at the date\
    \ and the size of a file or directory to determine if it’s different on the remote\
    \ host. The compare dist option tells rdist to go all the way and compare the\
    \ file data itself.\n\nPROBLEM 26\n\nSymptoms: rdist is too slow. Machines and\
    \ network are slow during the rdist run.\nProblem: -ocompare is slow.\nFix: If\
    \ you use -ocompare, remember that you’re transferring all of your files across\
    \ the network because they have to get from one host to the other for comparison.\
    \ It’s good to use it every now and then for a sanity check on your machines,\
    \ but if you rdist on a regular basis, using -ocompare is extreme.\n\n# remove\n\
    \nEliminate all files on the remote machines that aren’t on the local machine."
  merge: -1
  img_proc: true
- pgno: 87
  md: "# younger\n\nIf a file you're distributing has a newer modification date on\
    \ the remote host, this command makes sure that you don't touch the file on the\
    \ remote host. This is particularly useful for debugging purposes when combined\
    \ with the verify dist option, because it tells you what files have been customized\
    \ on a remote host, then leaves them untouched.\n\n# nodescend\n\nDon't go into\
    \ subdirectories and examine their contents.\n\n# nochkwoner, nochkgroup, nochkmode\n\
    \nIgnore owner, group, and mode (permission) differences, respectively.\n\n# follow\n\
    \nResolve symbolic links and treat them as if they were real files or directories.\n\
    \n# Using ssh with rdist\n\nSince rsh isn't very secure, many systems administrators\
    \ opt to turn it off. If they do use it, they don't allow root access through\
    \ it. It is, however, possible to configure ssh to perform the same thing as rsh,\
    \ through either configuration or authorized keys. (For more information on ssh,\
    \ consult Chapter 2.) The process is different for ssh versions 1 and 2, so we'll\
    \ first go over version 1 and then talk about the next version.\n\n# PROBLEM 29\n\
    \n> **Symptoms:** Accidental transfer of large amounts of data. rdist gets into\
    \ infinite loops, filling up the disk.\n> \n> **Problem:** follow is a dangerous\
    \ dist option.\n> \n> **Fix:** Only use follow when you're absolutely sure what\
    \ it is you intend to copy—such as a single directory. You can, however, use nodescend\
    \ in combination with follow to get a flat directory free of symbolic links. Because\
    \ rdist will only install the first level of directories it sees when given the\
    \ nodescend dist option, your Distfile needs to reflect all files in a directory\
    \ (here, for a directory dir):\n> \n> ( dir/* ) -> ( machines )\n> \n> install\
    \ -ofollow,nodescend ;"
  merge: -1
  img_proc: true
- pgno: 88
  md: '# ssh Version 1


    To configure sshd to accept root logins without any questions, place this in the
    sshd_config file:


    ```

    PermitRootLogin yes

    ```


    (This is the default value for sshd, but ought to be pointed out in any case.)
    Then you''ll need the trusted host in root''s .shosts (or /etc/hosts.equiv) file,
    because rdist will not work if it gets any output other than that of rdistd.


    If you want to use authorized keys, first make sure the following is in the sshd_config
    file on the remote host:


    ```

    PermitRootLogin nopwd

    ```


    Now, on the machine where you''ll run rdist place


    ```

    # ssh-keygen -N '''' -b 1024

    ```


    to create two key files in root''s .ssh directory, identity and identity.pub.
    Copy the identity.pub file from that machine to the target machine in root''s
    .ssh/authorized_keys file, inserting from="hostname" at the beginning, where hostname
    is the name of the machine running rdist. The authorized_keys file should look
    like this (one long line):


    ```

    from="hostname" 1024 NN <big long string of numbers> root@hostname

    ```


    Also, make sure the host key (not the one you just created) for hostname is in
    ssh''s known_hosts file.


    # ssh Version 2


    For ssh version 2, do this instead:


    ```

    # ssh-keygen -P -b 1024

    ```


    You get the public and private keys in .ssh2 as the files id_dsa_1024_a and id_dsa_1024_a.pub
    (or similar). On the server, have both files present in root''s .ssh2 directory,
    and put this in a file called identification:


    ```

    IdKey id_dsa_1024_a

    ```


    Then, on the remote hosts, place only the id_dsa_1024_a.pub file into root''s
    .ssh2 directory. Add an additional file, authorization:


    ```

    Key id_dsa_1024_a.pub

    ```'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Verify that you can now ssh from one host to the other as root:


    ```

    # ssh remote_host whoami

    ```


    You should get root as a response.


    To put it all together, make a script (as described above) called distssh with
    this content:


    ```

    #!/bin/sh

    ssh -q $0

    ```


    You may want to give the full path name to ssh in this script, and you may also
    need to specify an extra option or two (we''ll get to that in a moment).


    To invoke rdist with this script instead of rsh, use the -P option:


    ```

    # rdist -P ./distssh

    ```


    # PROBLEM 30


    Symptom: Error message:


    machine: LOCAL ERROR: Unexpected input from server: ...


    Problem: Interference from ssh diagnostic warnings.


    Fix: Use the -q option to ssh, which attempts to turn off all warning messages—though
    it does not turn everything off. For example, if you use -c arcfour and ssh decides
    it wants to use blowfish instead, it tells you [and causes rdist to abort, if
    rdist is running ssh]. Still, this is useful for failed xauth commands and other
    noncritical warnings.


    # PROBLEM 31


    Symptom: rdist takes much longer with ssh than it does with rsh.


    Problem: Encryption can be CPU-intensive.


    Fix: Count on a performance penalty with ssh no matter what you do (the overhead
    can get up to a factor of three or so), but for older, slower machines, try a
    different cipher option to ssh. Most support blowfish, which is faster than the
    default of idea. Try adding -c blowfish to the arguments in your distssh script.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '> **NOTE**  Make sure the identity (or id_dsa_1024_a) file never leaves the
    server. If someone breaks into the server, change the keys immediately; if you
    don''t, you risk a very serious intrusion. Setting up IP filters to block out
    most of the world is a good idea first.


    # Larger-Scale Distributions


    If you''ve got a large network, keeping things uniform across your machines is
    important. All of your machines should have the same software set, and ideally
    you should be able to set it up without a large time commitment. A good practice
    is to set up one machine as a prototype for the rest. What''s important (and what
    many systems administrators forget) is not to lose touch with the programs your
    users really depend on.


    You basically have two choices with regard to which machine will run rdist. Either
    the prototype can run the rdist itself, or a more powerful server can do the task
    (the prototype does an rdist to the server first). If you have the resources,
    the latter option is preferable for two reasons. The first is that you can load
    this so-called rdist server with fast disks, which you wouldn''t typically put
    into a desktop machine. The second, more significant reason is that you can put
    a distribution set onto a disk other than the system disk. If you make the prototype
    run an rdist on its own system disk, a conflict will arise when the prototype
    accesses the system and files for distribution, slowing the process down considerably.


    Try to make your prototype machine one that gets fairly heavy use from an experienced
    user. If you have a staff of systems administrators, have one of them use it.
    Furthermore, when you are about to do a large rdist, test it on your own machine
    first. It''s much better to break only your own machine rather than your entire
    network!


    Next come the questions of what to distribute and when to perform rdist. In general,
    it''s fine to put items in /usr on all hosts. Only distribute /bin, /sbin, and
    /lib when you need to—for libc upgrades, base Linux utility fixes, and such tasks.


    /etc is a different story. If you plan to rdist stuff into /etc, run rdist with
    -overify first and make sure you aren''t walking over anything important like
    /etc/passwd.


    Relevant man pages: rdist (1), rsh (1), ssh (1)'
  merge: -1
  img_proc: true
