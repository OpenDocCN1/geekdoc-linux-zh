    As you can see, colons (:) separate the fields, and they are fairly straightforward.
    Only the second field, the encrypted password, deserves some mention. The example
    above shows a shadow password scheme, which puts the encrypted password into /etc/shadow,
    where the user can’t read it. This is meant as a security measure (although its
    effectiveness is somewhat dubious). Most major distributions use shadow passwords
    or give you the option.


    Unix does not keep a user’s password around in its original (plain-text or cleartext)
    form; that would make the password too easy to steal. Instead, it encrypts the
    passwords on the spot and stores them in encrypted form. When the user types a
    password, Unix encrypts it and matches it against the one on the system.


    On larger networks, it’s a hassle to maintain passwd files for many users across
    machines. That’s where systems like NIS come in (see Chapter 3).


