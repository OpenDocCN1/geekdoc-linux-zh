- pgno: 82
  md: '# 3.5 rdist


    Keeping software up to date over a bunch of machines is a simple matter of copying
    files from one machine to the rest and deleting outdated files as you go. The
    traditional Unix approach to this problem (before larger disks became more affordable)
    was to put the central distribution on a big server and make the rest of the clients
    mount them with NFS.


    However, this strategy has two disadvantages that make it unsuitable for modern
    machines. First and foremost, accessing files with NFS is much slower than with
    a filesystem on a local disk. Second, it places too much importance on the reliability
    of the big server. Network filesystems like Coda address the problems of speed
    and reliability, but as previously mentioned, these are either very expensive
    or buggy.


    The rdist (remote distribution) package copies a bunch of files around without
    asking too many questions, and it''s been around for years. It consists of two
    programs, rdist and rdistd (the client and the server). You can connect to the
    rdistd on a remote server in a couple of different ways, but the safest way is
    to have rdist use ssh or rsh to connect instead of rdistd''s network authentication
    mechanism. rdist consults a Distfile for its configuration (much like Makefile).


    We will assume you''re using rdist6. It''s standard on most Linux distributions,
    and in addition to various versions on the CD-ROM in support/nfsnisrdist, you
    can get the latest version from


    http://www.magnicomp.com/rdist/rdist.shtml


    Let''s start with a basic example of a Distfile.


    ```

    STUFF = ( www src )

    MACHINES = ( mikado atlantic )

    ${STUFF} -> ${MACHINES}

    ```


    This just says you want to mirror the directories www and src on the hosts mikado
    and atlantic. Try this as your personal user before executing it as root.


    If you run

    $ rdist


    it tries to connect to mikado and atlantic with rsh to dump the directories www
    and src onto those hosts. By default, rdist will not delete files and directories
    on a remote host.


    In order for rdist to function properly, it is essential that you have the ability
    to login to the remote host without a password.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# PROBLEM 25


    Symptom: Can''t rsh to remote hosts.


    Problem: You turned off rshd.


    Fix: For now, you can do one of two things while you get used to rdist.


    You can temporarily turn rsh back on by making the appropriate changes to /etc/inetd.conf
    (see Chapter 2), and adding this to your /etc/hosts.deny file:


    ```

    in.rshd: ALL except servername

    ```


    where servername is the machine on which you''re running rdist. (Don''t forget
    that you''ll need a .rhosts or hosts.equiv on the remote host because .rhosts
    in particular can create a security hole.)


    If, however, you can ssh to the remote host without a password (this requires
    matching host keys and authorized keys or hosts.equiv), just put the following
    code into a script called (for example) sish:


    ```

    #!/bin/sh

    ssh -q $0

    ```


    Then (assuming sish is in the current directory), you can use rdist as follows:


    ```

    $ rdist -P ./sish

    ```


    (We''ll get into more details on how to use ssh with rdist later.)


    # Options


    We''ve now introduced one of rdist''s options, -P. rdist has two kinds of options:
    normal (regular) and dist options. Regular options are the same as in other programs:
    path names, configuration files, flags, and so on. Dist options control the remote
    distribution, and are specified with -o on the command line, as in this example:


    ```

    $ rdist -oremove,younger,verify

    ```


    This line tells rdist to remove files that are present on the remote host, but
    aren''t in the local directory. It also instructs rdist to ignore files on the
    remote that have a newer modification time than those of the local copy, and to
    verify only (that is, to say what rdist needs to do) without actually doing it.


    A dist option in a Distfile looks like this:'
  merge: -1
  img_proc: true
- pgno: 84
  md: "```\n```text\n( www SRC ) -> ( mikado atlantic )\n    install -oremove,younger\
    \ ;\n```\n```\n\nThe second line is a command. In addition to specifying dist\
    \ options, commands allow even tighter distribution control by comparing certain\
    \ file parameters (such as the date). Here's more about commands.\n\n# Commands\n\
    \n# except, except_pat\n\nIgnore files and directories (don't update them). except\
    \ pat takes regular expressions as arguments and ignores files or directories\
    \ that match.\n\nExamples:\n\n```\n```text\nexcept lib ;\nexcept pat ^/usr/local/etc/.*\\\
    .conf$ ;\n```\n```\n\n> **PROBLEM 26**\n> \n> **Symptom:** Some files mysteriously\
    \ don't get updated.\n> \n> **Problem:** Going overboard with except_pat.\n> \n\
    > **Fix:** Use the --verify dist option and examine the output. Try to start all\
    \ expressions with a caret (^) and end them with a dollar sign ($). The regular\
    \ expression in\n> \n> ```text\n> except_pat etc/.*\\.conf ;\n> ```\n> \n> matches\
    \ files in /etc, /usr/etc, and /usr/local/etc (that is, if those directories are\
    \ among those specified for the dist in the first place).\n\n# install\n\nSpecify\
    \ options or alternate installation directories. We've already seen dist options\
    \ in examples such as\n\n```\n```text\ninstall -oremove,iglinks ;\n```\n```\n\n\
    For alternate installation directories, rdist behaves differently, depending on\
    \ the source files. For the Distfile\n\n```\n```text\n( stuff ) -> ( atlantic\
    \ pacific )\n    install -oremove newstuff ;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 85
  md: "the file or directory stuff is distributed as newstuff on the remote hosts.\
    \ However, the following Distfile demonstrates a different scenario:\n\n```\n\
    ( morestuff/one morestuff/two morestuff/3/4 stuff ) -> ( atlantic pacific )\n\
    \    install -oremove newstuff ;\n```\n\nIn this case, rdist puts morestuff/one\
    \ and morestuff/two into newstuff/one and newstuff/two on the remote hosts, but\
    \ morestuff/3/4 becomes newstuff/4, and stuff goes into newstuff/stuff!\n\nWhy\
    \ does rdist do this? It's trying to match items up, replacing as much of the\
    \ base directory as possible. If rdist knows for certain that the source path\
    \ name is a directory (in the case of morestuff and morestuff/3), it replaces\
    \ all of the path name with the argument to install (here, with newstuff). But\
    \ in our example, rdist doesn't know right away if stuff is a directory. If stuff\
    \ is just a file, trying to put its contents into newstuff would be pointless\n\
    \n# PROBLEM 27\n\nSymptom: rdist behaves differently with a single argument.\n\
    \nProblem: Design of rdist.\n\nFix: If your needs are fairly simple, use the whole\
    \ dist option (described below) to force items to appear in the target directory\
    \ without any path mangling. Try not to use the directory option to an rdist command\
    \ with any complex arguments, because the resulting directory structure can be\
    \ unpredictable. Split things up in the Distfile if you need to.\n\n# notify\n\
    \nSend the results of the rdist to a user, for example:\n\n```\nnotify foo@example.com\
    \ ;\n```\n\nThis option is really useful only if you want to notify different\
    \ people of specific changes within the same Distfile. Otherwise, you can just\
    \ log rdist's output to a file and mail it to the user(s).\n\n# cmdspecial, special\n\
    \nWhen a certain file is distributed to a machine, special instructs rdist to\
    \ run a program on that machine immediately. Here's an example for a syslogd and\
    \ its configuration file:\n\n```\nspecial /etc/syslog.conf \" /bin/kill -HUP `cat\
    \ /var/run/syslogd.pid`\"\n```"
  merge: -1
