- pgno: 38
  md: '> NOTE If you can get PPP to work with the configuration tool that came with
    your distribution, you can skip to the next section.


    # Starting pppd


    Most pppd invocations come in the form


    ```

    # pppd call isp

    ```


    Here, isp is the name of a remote system; /etc/ppp/peers/isp sets its options
    (see the pppd Options section). The name you give a remote system isn’t usually
    relevant. It must simply match the name of the configuration file in /etc/ppp/peers—unless
    you plan to use CHAP (see page 29). If you don’t know the name of the remote system,
    don’t worry—you can either figure it out from debug messages or just override
    it with a remotename option (see page 27).


    Options to pppd have a somewhat nonstandard form—for example:


    ```

    # pppd noauth defaultroute connect ''/usr/sbin/chat -v -f /etc/ppp/chat-foo''

    ```


    These options are quite verbose and vary from system to system—you’ll usually
    find pppd call system easier than writing long scripts.


    # Starting pppd: A Simple Example


    The dial-up to our organization is a fairly standard Cisco box. The command


    ```

    # pppd call compsci

    ```


    connects a home machine to this dial-up. The /etc/ppp/peers/compsci file contains
    the following:


    ```

    ttyS1 57600 crtscts

    connect ''/usr/sbin/chat -v -f /etc/ppp/chat-compsci''

    noauth

    defaultroute

    mru 1500

    ```


    (Note: This file specifies the serial device, ttyS1 [that is, /dev/ttyS1], and
    the connection speed, 57600 baud).


    The chat file /etc/ppp/chat-compsci is:


    ```

    ABORT "NO CARRIER"

    ABORT BUSY

    "" ATZ OK

    ATD\number CONNECT

    "" urname:

    ```'
  merge: -1
  img_proc: true
