    # 2.3 PPP Configuration


    Due to the large variety of ISPs and dial-out devices, successful PPP configuration
    can be elusive. To complicate matters, the PPP setup of every Linux distribution
    is somewhat different. This section explains the PPP programs, what they do, and
    which files they use.


    # pppd


    The pppd system daemon is at the heart of Linux PPP. It takes raw data from a
    device (usually a serial port connected to a modem), decodes the data stream,
    and talks to a network interface (ppp0, for example), which then acts like an
    Ethernet interface on the other side. (For the rest of this section, assume the
    device we''re talking about is a serial port attached to a modem.)'
