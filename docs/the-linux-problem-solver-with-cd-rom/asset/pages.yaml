  md: '# Test Your Image


    Once this process completes, it leaves you with a bzImage file in /usr/src/linux/arch/i386.
    This is a compressed kernel image; you’ll move it to a system directory later
    and tell the boot loader about it. But first you need a suitable test image—one
    that won’t screw up your current kernel before you have a working replacement.


    The safest way to make a test image is to write one to a floppy disk. It’s very
    important to use a floppy if this is the first time you’ve ever built a kernel.
    Put a formatted disk in your first floppy drive and enter:


    ```

    # make bzdisk

    ```


    This command compiles a new kernel and writes it to the floppy disk, attempting
    to use your current root partition parameters on that floppy disk. The end result
    is a boot disk. If you ran the make bzImage above, make won’t have to go through
    the process of making all the object files again, but because floppy disks are
    slow, you’ll still have to wait for the image to copy.


    # PROBLEM 83


    Symptom: A write to floppy fails. A boot from floppy fails.


    Problem: You’ve got trouble with your floppy disks.


    Fix: Your floppy might be bad, or it might need better formatting. Red Hat comes
    with a tool called fdformat—but superformat, which comes with the fdutils package,
    attempts to adjust to your floppy drive’s particular alignment. It’s one of the
    example packages in support/installsoft on the included CD-ROM, and you can also
    get it at http://www.tux.org/pub/knaff/fdutils/.


    Another way to test your boot image, and perhaps one to try once you’re familiar
    with LILO (see Chapter 8), is to add these three lines to /etc/lilo.conf:


    ```

    image=/usr/src/linux/arch/i386/boot/bzImage

    label=test

    read-only

    ```


    Then run lilo, and on reboot enter test at the LILO prompt. This test avoids the
    mess with the floppy disks, but if your /etc/lilo.conf wasn’t correct in the first
    place, you won’t be able to load your original kernel again. So it’s worth repeating
    this warning: If you’ve never recompiled a kernel before and'
