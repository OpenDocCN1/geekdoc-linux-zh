- pgno: 178
  md: '# 7


    # KERNEL UPGRADES


    # 7.1 Introduction


    The Linux kernel is the core of the operating system. It manages processes and
    resources, provides most of the hardware drivers, and handles the filesystem interface.
    The kernel is under constant development, so new drivers and bug fixes appear
    all the time.


    If you plan to recompile your kernel, you’re probably doing so to get better system
    performance, add a new device driver, or fix some bug. The fastest way to break
    a machine is to screw up the kernel. The good news, though, is that once you’re
    familiar with the kernel, you’ll find it relatively easy to recover from a broken
    kernel; it’s not as though you’ve filled your hard drive with null bytes.


    Sections 7.2, 7.3, and 7.4 outline the three steps involved in compiling a new
    kernel. Section 7.4 also contains detailed information on installing and booting
    the kernel—including how to use LILO (the Linux loader, also capable of dual-booting)
    and how to boot the kernel off a device other than a hard drive (for emergencies
    or bootstrapping).


    7.5 explains kernel modules and a few aspects of the automatic kernel module loader.
    Kernel modules are dynamically loadable parts of the kernel that can simplify
    the configuration process and eliminate wasted system resources. For example,
    if you rarely use FAT-based filesystems, you can compile them as modules and leave
    them out of the kernel most of the time. Many'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'device drivers, filesystems, and other options are available as modules. The
    automatic module loader attempts to make module insertion transparent by loading
    modules on demand from the kernel. Finally, if you dig yourself into a hole, 7.6
    will try to lift you out of there.


    # Kernel Source Code and Versions


    > NOTE

    > You''ll find all of the source code distributions for Linux kernels in ftp://ftp.kernel.org/pub/Linux/kernel,
    but for faster downloading use a server specific to your country code. For example,
    ftp.us.kernel.org offers a fast link for the United States.


    Version releases—2.0, 2.1, 2.2, and so on—classify the kernel. There are two different
    kinds of release series, and it''s important to recognize the differences between
    them.


    If you want to know which kernel you''re using, try the command uname -a. To see
    what version of the source code you have, look for the source code in /usr/src/linux.
    The top of /usr/src/linux/Makefile has the version number.


    Linux kernel versions have three numbers and have major.minor.patchleveltype names.
    The first number is called the major level, the second is the minor level, and
    the third is the patchlevel (in 2.3.34, the major level is 2, the minor level
    is 3, and the patchlevel is 34). A kernel release series is a set of kernel releases
    that share the same major and minor levels. Series identified by even numbers
    (1.0.x, 1.2.x, 2.0.x, 2.2.x, and so on) are production releases. Intended for
    stability, they contain code that has withstood considerable testing. Within a
    production series, the driver set is the same, and developers release new versions
    only for bug fixes.


    On the other hand, if the minor level is an odd number (1.1.x, 1.3.x, 2.1.x, 2.3.x,
    and so on), the kernel is a development kernel. These are released with an expectation
    of instability—basically, as a type of beta release. Early releases in a development
    series are particularly unstable, with driver interfaces gratuitously altered,
    new drivers added, and code removed without extensive cross-checking (that''s
    left to the people who develop the kernel). This instability can cause some or
    most of the kernel to break in sometimes dangerous ways, so unless you know exactly
    what you''re doing, stay away from development releases.


    > NOTE

    > Many distributions omit complete kernel source code by default (for example,
    the kernel-source-version.rpm in Red Hat 6.x distributions). Instead, they may
    include just the header files for /usr/include/linux and /usr/include/asm (sometimes
    not even those). If you don''t see a Makefile in /usr/src/linux, or you see less
    than several megabytes of stuff in there, you don''t have the complete source;
    you''ll need to get it if you want to build a kernel.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# What You Need to Build the Kernel


    To build a Linux kernel, you''ll need:


    +   - A C compiler (gcc) and make (found in the development packages of most distributions).


    +   - Two assembler and linker programs called as86 and ld86 (from bin86-0.4-7.rpm
    in Red Hat 6.0, dev86-version.rpm in later releases).


    > NOTE See /usr/src/linux/README for the version of gcc you need (found under
    ''COMPILING the kernel'' heading as recently as 2.2). (Use gcc -v to find your
    version number.) If your Linux distribution is at all recent, you won''t have
    a hopelessly outdated version of gcc.


    +   - Space—the source code is large. At version 2.2.12, a compiled kernel with
    a lot of modules took up 75MB. Unfortunately it''s hard to say how much space
    future versions will take.


    +   - A relatively fast computer with a decent amount of memory, if you plan to
    finish in any reasonable amount of time. It took me over an hour to compile a
    2.2 kernel on a 486 with 20MB of memory, but my newer machines were much faster.
    (If you want the kernel on a slow machine but don''t want the wait, you can compile
    it on a faster machine and then copy it to the slower one.)


    # Setting Up Kernel Source Code


    Before you can set up the kernel, you need to unpack the source. Unpacking the
    source is as easy as with the packages described in Chapter 6. You use either


    ```

    # cd /usr/src

    # umask 022

    # bzip2cat linux-version.tar.bz2 | tar xvf -

    ```


    or


    ```

    # cd /usr/src

    # umask 022

    # zcat linux-version.tar.gz | tar xvf -

    ```


    Your choice of unpacking command depends on the type of compression in your source
    file (see the underlined text above; an extension of .bz2 means you need the bzip2cat
    program, whereas .gz means you should use zcat).'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Put Your Unpacked Source Here


    Unpacking the file in /usr/src creates /usr/src/linux, so before you extract the
    contents of the tar file, you want to move whatever is already there out of the
    way:


    ```

    # mv /usr/src/linux /usr/src/linux.DIST

    ```


    You can decide what to do with the linux.old directory later.

    In fact, /usr/src/linux is an inconvenient name because it doesn’t reflect the
    version number. Many administrators prefer this:


    ```

    # cd /usr/src

    # mv linux linux-version

    # ln -s linux-version linux

    ```


    Then the unpacking of a new kernel looks like this:


    ```

    # cd /usr/src

    # rm linux

    # bzip2cat linux-version.tar.bz2 | tar xvf -

    # umask 022

    # ln -s linux-version linux

    ```


    The old version is still available in /usr/src/linux-version. Be careful, though;
    the source code is quite large, especially with object files in there, and if
    you leave too many old versions lying around, they take up a big chunk of space
    on your disk.


    # Checking Links


    Once you get the source code set up, check a few links. Try these commands:


    ```

    # ls -ld /usr/include/asm /usr/include/linux

    ```


    If the output has this in it:


    ```

    /usr/include/asm -> /usr/src/linux/include/asm

    /usr/include/linux -> /usr/src/linux/include/linux

    ```


    the C compiler will not have trouble with mismatched or missing kernel-specific
    include (header) files. If, however, asm and linux don’t exist or are real directories
    (instead of symbolic links), do this:


    ```

    # cd /usr/include

    # mv linux linux.DIST

    # mv asm asm.DIST

    # mv scsi scsi.DIST

    # ln -s /usr/src/linux/include/asm asm

    ```'
  merge: -1
  img_proc: true
- pgno: 182
  md: '```

    # ln -s /usr/src/linux/include/linux linux

    # ln -s /usr/src/linux/include/scsi scsi

    ```


    This moves the old directories out of the way and sets up links so the C compiler
    can find the right header files. Kernel configuration is the next step.


    # Distribution Kernels


    The kernels that come with Linux distributions are called generic kernels because
    they haven’t been tuned for any particular hardware or applications. They tend
    to work on most machines, and the implementation of the automatic kernel module
    loader has eliminated many problems with these kernels, such as excessive size
    or driver conflicts.


    Many distributions, including Red Hat, modify the standard kernel before shipping
    it. Thus, if you plan to install a new kernel apart from what your distribution
    offers, you should understand how the distribution’s kernel is managed so you
    don’t step on anything important.


    # 7.2 Configuring the Kernel


    When you configure the kernel, you decide which device drivers to include and
    which to build as modules, and you might also set some parameters. Although configuring
    the kernel is different from configuring any other software package, it’s a fairly
    easy process once you have the source code installed. To begin, issue these commands:


    ```

    # cd /usr/src/linux

    # make menuconfig

    ```


    The make menuconfig runs off and compiles a configuration program, then executes
    it. The configuration program is a full-screen text interface that uses the curses
    library, which comes standard with all distributions. It’s not the most glamorous
    tool around, but it gets the job done. You’ll see the opening main menu screen
    in Figure 7-1.


    The big box in the middle contains the kernel options. Navigate in this box with
    the up and down arrow keys; you’ll see the current selection highlighted or in
    a different color. The little strip at the bottom contains Select, Exit, and Help;
    you can move around here with the left and right arrows. An arrow (->) next to
    an item indicates a submenu; pressing ENTER brings up that submenu.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '[ ] MTRR (Memory Type Range Register) support

    [*] Symmetric multi-processing support


    This is where you have to make your first real choices. Processor family allows
