    65) have replaced the size field. The b means it is a block device (character
    devices have a c instead). The two numbers in place of the size are the major
    and minor device numbers. Each major number is assigned to one device driver,
    and the minor numbers go to the devices that use the driver (for example, an ATA/IDE
    driver, which handles disks, CD-ROMs, and other hardware). The kernel assigns
    the major and minor numbers.


