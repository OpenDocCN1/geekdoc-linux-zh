- pgno: 169
  md: 'Note that when, say, fdutils-5.4 comes out, all you need to do is configure
    --prefix=/opt/fdutils/fdutils-5.4, and then, after running a make and a make install,
    change the /opt/fdutils/default link. Because we contained everything for the
    previous version in one place (/opt/fdutils/fdutils-5.3), and there are no longer
    any specific links to that directory (we used /opt/fdutils/default instead), you
    don’t need to worry about problems installing the new version. Sometimes new versions
    of programs do change file names around—keep an eye out for that.


    So if you need to know what any item in /usr/local is, just use ls -l, and the
    link will tell you exactly what package it belongs to—for example:


    ```

    $ ls -l /usr/local/bin/superformat

    lrwxrwxrwx 1 root root 36 /usr/local/bin/superformat -> /opt/fdutils/default/bin/superformat

    ```


    # 6.7 Troubleshooting Failed Compiles


    So you ran a make, and things didn’t happen quite the way you planned. Perhaps
    it didn’t get past the compilation stage, or maybe the installed package doesn’t
    work properly. The reasons can range from trivial—for example, an incorrect library
    path—to very serious—a poorly programmed package or even a hardware problem. Unfortunately,
    you can’t tell exactly what the problem is unless you look at the source code.
    This does nonprogrammers little good. However, with a few guidelines you can guess
    at some common errors and develop appropriate fixes.


    # Reading Error Output


    First, though, you must know how to read error output. Say a compile fails, make
    terminates immediately, and the last message you get before the prompt looks like
    this:


    ```

    make: *** [target] Error 1

    ```


    Some step of the process required to satisfy the requirements for target has failed.
    Usually it’s a file name (probably an object file), and the compiler has failed
    to create it. (We’ll discuss strategies on how to fix that problem shortly, in
    Compiler Errors.)


    If you get an error message like this:


    make: *** [target] Error 1 (ignored)


    you can usually ignore it (an ignored error does not cause make to terminate).
    This error probably means make tried to create a directory or some other item
    that already existed, the command failed, and no one cares.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Compiler errors look like this:


    ```

    t.c:1: junk.h: No such file or directory

    t.c:5: ''stuff'' undeclared (first use this function)

    ```


    Compiler warnings (as distinguished from errors) are clearly marked as such:


    ```

    aaucars.c:128: warning: initialization from incompatible pointer type

    t.c:2: warning: unused variable ‘t’

    ```


    For the most part, you can ignore warnings. They don''t cause the compiler to
    stop. An excessive number of warnings like the first one above might signal possible
    run-time errors (in this case, make sure you''re using the right include files).
    If you''re not the programmer, just ignore the warnings like the second above.


    A Makefile sometimes turns on all compiler warnings (the -Wall option to gcc/egcs),
    because the programmer wants to know about them when developing the package. This
    often has the happy result that you get no warnings at all, but sometimes it goes
    the other way and you get a plethora. Because warnings appear inline with error
    messages, the actual errors can disappear amid a sea of warnings.


    Linker (ld) errors resemble compiler errors, except that they refer to an object
    file instead of a source file:


    ```

    foo.o: In function `baz'':

    foo.o(.text+0x62e): undefined reference to `__ctype_b''

    ```


    That wraps up how to identify basic errors and warnings. The next sections cover
    specific errors and their solutions.


    # General Errors


    **PROBLEM 72**


    **Symptom:** You see the following Error message: make: `Command not found.`


    **Problem:** You don''t have the make program installed on your system.


    **Fix:** Install make. If you''re missing make, you''re most likely also missing
    the rest of the development packages (see below).'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# PROBLEM 73


    **Symptom:** You see the following Error message: `make: prog:`

    Command not found.


    **Problem:** `make` can’t find the program called `prog` anywhere in its path.


    **Fix (case 1):** If `prog` is `cc`, `gcc`, `cpp`, `as`, or `ld`, you need to
    install the developer set of packages that came with your Linux distribution.
    The development packages have `gcc` (or `egcs`), the static libraries, include
    files, and binutils.


    If `prog` is a full path name such as `/usr/local/bin/prog`, the program may exist
    elsewhere on your system. Look for it and change the Makefile accordingly.


    **Fix (case 2):** `make` may have just built a program and is now trying to run
    it. If you don’t have a dot (`.`) in your path (you should not), either put this
    at the end of your path temporarily or change the Makefile to include `./` before
    `prog`.


    # PROBLEM 74


    **Symptom:** You just installed `foo` in `/usr/local/bin`, but even though `/usr/local/bin`
    is in your path, when you (or some user) try to run `foo`, it says


    `foo: Command not found.`


    **Problem:** Your shell is probably `tcsh` or `csh`, caching command names.


    **Fix:** Try the `rehash` command. This only works if the problem is that you’re
    using `tcsh` or `csh`. If you’re running a windowing system, you may need to restart
    the login session. Otherwise, use another shell.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# PROBLEM 75


    Symptom: make ran a command like this:


    ```

    cc -o t.o t.o -lX11.

    ```


    Then you got this error message:


    ```

    ld: cannot open -lX11: No such file or directory.

    ```


    Problem: The linker can''t find a library.


    Fix: Look for a file called either libX11.a (a static library) or libX11.so.n
    (a shared library), where n is some version number. You need to place the directory
    containing it in the linker arguments, usually LDFLAGS. Let''s say you found it
    in /usr/X11R6/lib. If you''re using an autoconf''ed package, configure it properly
    with


    ```

    $ LDFLAGS="-L/usr/X11R6/lib" ./configure.

    ```


    If you find a shared library, don''t forget to give the message to the run-time
    linker as well:


    ```

    $ LDFLAGS="-L/usr/X11R6/lib -Wl,-rpath=/usr/X11R6/lib" ./configure.

    ```


    # PROBLEM 76


    Symptom: You get the following error message:


    ```

    t.o: In function `main'':

    t.o(.text+0xd): undefined reference to `stuff''

    ```


    Problem: The linker couldn''t find a library call in a library or object file
    it received as input. You''re probably missing a library.


    Fix: Find the library containing the call (this can be difficult—use strings and
    ar if necessary). Let''s say you found it in libfoo.a. Put -lfoo in your LDFLAGS
    as described in the previous problem, keeping in mind that you may also need to
    add libfoo.a''s directory with -L, also described above.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Skipping Lines in .c and .h Files


    If you have to fool around with a source file, it''s probably because the compiler
    needs to get a line or two from it. Let''s say we have an excerpt from a file
    like this:


    ```

    ...

    #include <stdio.h>

    #ifdef JUNKOS

    #include <junk/extracrud.h>

    extern int junkerrno;

    #endif

    ...

    ```


    Notice the preprocessor directive, #ifdef JUNKOS, closing with an #endif, around
    two lines. This means if you define the macro (text substitution) JUNKOS, the
    preprocessor and compiler will read the next two lines. If you''re not running
    anything like JunkOS, then the compiler under Linux usually skips these lines.


    You define macros with either the -DMACRONAME[=value] flag to the C compiler (as
    in -DJUNKOS or -DSKY=blue) or in a source file with the #define directive (for
    example, #define SKY blue).


    To get rid of an offending line guarded by #ifdef directives, first attempt to
    make the outcome of the #ifdef test false. If you just can''t find the macro definition,
    there''s an #undef directive for undefining macros, but first try to find and
    verify the original definition. Other mismatches, especially those related directly
    to the operating system, can cause the same error to appear many times, and a
    program that manages to compile despite an incorrect configuration may not run
    properly.


    If #ifdef does not enclose an offending line, you may not have any choice but
    to exclude a line or two with #if 0 /endif, as in this example:


    ```

    #if 0

    #ifdef JUNKOS

    #include <junk/extracrud.h>

    extern int junkerrno;

    #endif

    #endif

    ```


    Even though it''s not a true comment, #if 0 /endif is safer than using /* and
    */ because you don''t run any risk of nested comments (which cause syntax errors).


    Never delete a line. Only comment out as a last resort, and be careful when you
    do it. For example, if we switched the second and third lines in the first example
    above, catastrophic-looking errors would result.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Compiler Errors


    Because of the nature of software development tools like the compiler and linker,
    we can’t give a one-size-fits-all fix for any error they produce (although programmers
    would love it). There are, however, a number of common cases.


    # PROBLEM 77


    Symptom: You get an error message like this:


    ```

    t.c:10: foo.h: No such file or directory.

    ```


    The compiler ran the C preprocessor [cpp] on t.c, which used the #include directive
    (on line 10) to read in another file, foo.h, but couldn’t find that file.


    Problem: Bad include path, or include file isn’t installed.


    Fix (case 1): If you have the include file installed on your system, then all
    you need to do is change the CFLAGS in the Makefile/Imakefile, or get configure
    to do it for you (see below). If you’re missing the file outright, there’s a chance
    it may not be critical and you can simply comment out the #include line in the
    source file, but that’s a very slim chance. If it’s a system file, chances are
    it has a different file name.


    If the include file isn’t rooted at /usr/include (or /usr/local/include), you
    need to tell the compiler’s preprocessor where to find it by giving cc or gcc
    the -Idirectory option, where directory is the root location of the include file.


    For example, if you get an error message stating that myjunk/junk.h couldn’t be
    found, and the file is actually in /usr/convoluted/include/my junk, you need to
    pass the option -I/usr/convoluted/include to the compiler.


    If a package uses the GNU autoconf system, you can do so (while maintaining optimization)
    with the following:


    ```

    $ CFLAGS="-O2 -I/usr/convoluted/include" ./configure

    ```


    Fix (case 2): You could be missing a library on your system (and may be coupled
    with a missing -l compiler option in Fix [case 1] above). Libraries come with
    .h files. Look at the package’s installation instructions to see if it mentions
    required libraries. Then see if you have the necessary libraries installed on
    your system. Find and install any missing libraries if possible.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# PROBLEM 77 (CONTINUED)


    One X library you may come across is Motif. The include files for it are in Xm
    and Motif subdirectories, usually in /usr/X11R6/include. It''s a commercial library,
    and most distributions walk-aware free clone called lesstif. You can get it from
