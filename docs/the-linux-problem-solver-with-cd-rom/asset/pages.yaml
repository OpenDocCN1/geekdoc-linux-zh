- pgno: 186
  md: 'stuff that appears after you compile RAM disk support directly into the kernel
    (not as a module) has a new twist. Some distributions, such as Red Hat use this
    on SCSI-only systems to avoid compiling SCSI drivers into the kernel. They first
    boot with an initial RAM disk, then load a kernel module on that RAM disk (one
    containing the driver for the SCSI controller), then mount the true / partition.
    You can wiggle out of this mess by compiling the SCSI driver you need directly
    into the kernel, and changing /etc/lilo.conf before you run lilo (the part of
    LILO that installs the boot sector); Section 7.4 offers more on the subject.


    # Networking Options


    You can accept the default values here for most systems. Network firewalls and
    the options that appear after you choose it may be important if you''re planning
    to do IP filtering or masquerading; turn to Section 2.4 for more details on that.


    # SCSI Support


    You usually know when you need SCSI support (you''ve got a SCSI host adapter),
    but the Linux kernel also considers external parallel port Zip drives to be SCSI
    devices.


    # SCSI Disk Support


    This turns on support for all sorts of hard disks, including removable-media disks.


    # SCSI Generic Support


    A number of miscellaneous devices use this driver, most commonly SCSI scanners
    and CD burners.


    # SCSI Low-Level Drivers


    Under this submenu, used to select drivers for individual SCSI controllers (host
    adapters), you may notice a few similar-looking entries if a device has more than
    one driver available (Symbios SCSI cards, for example), or if there is more than
    one version of the device (such as the two different versions of the parallel
    port Zip drive).


    # Network Device Support


    You''ll find the network interface drivers, Ethernet, PPP, SLIP, token ring, and
    others here.


    # Old CD-ROM Drivers


    If you''ve got an older system with a proprietary CD-ROM drive, you might find
    support for it here. Most of these drives came with sound cards in some of the
    first multimedia kits, like the ones from Creative Labs or even MediaVision.'
