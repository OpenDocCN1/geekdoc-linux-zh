    # Manual Page Paths


    man uses the MANPATH environment variable, similar to the PATH environment variable,
    to find manual pages. You should set it to something like this:


    ```

    /usr/local/man:/usr/man:/usr/X11R6/man:$HOME/man

    ```


    # Prompts


    In general, putting the kitchen sink into a prompt is a bad idea. We’ve seen a
    lot of elaborate prompts, from cryptic five-letter symbolic strings to multi-line
    monstrosities, and they have one feature in common: People only use prompts to
    figure out whether the command they just typed in has finished or not. So our
    advice is to keep prompts clear and simple: They can usually include the host
    name (unless you have really long host names), the login name, and perhaps a command
    number.


    Avoid goofy punctuation—characters like


    { } = & ? <word>


    will cause confusion.


    Also avoid using the shell’s default prompt (that is, what a shell yields when
    you don’t set any prompt in a startup file). Users often want to change the prompt,
    and they’ll go to great lengths to do so (even if they don’t need to). Havoc ensues
    when they modify their startup files without any guidance. To avoid this, create
    a simple prompt in the default shell startup file(s). Make it really obvious,
    as in this bash example, which yields username$ as the prompt:


    ```

    # Make a simple prompt

    PS1=$USER''\$ ''

    ```'
