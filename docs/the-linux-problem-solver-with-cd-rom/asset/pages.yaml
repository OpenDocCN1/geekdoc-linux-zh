- pgno: 145
  md: 'This takes *textfile* and prints what would normally be two pages onto one,
    as in Figure 5-1.


    # gv


    A GUI front end for previewing files with Ghostscript.


    # psnup


    A tool for printing multiple pages on one page. From time to time, psnup encounters
    a file that’s difficult to parse. Using Ghostscript to filter the file (later
    in this section) can help. While we mention it here as a separate utility, you
    probably don’t need to install psnup because a2ps has a psnup mode, too:


    ```

    $ a2ps -4 -o out.ps in.ps

    ```


    This example takes the file *in.ps* and outputs it on four sides per page in *out.ps*.


    # Additional Ghostscript Utilities


    Ghostscript also offers filters useful for calming down rogue PostScript files.
    In particular, you can turn a PostScript file into an Encapsulated PostScript
    (EPS) file with the following:


    ```

    $ gs -q -dBATCH -dNOPAUSE -sDEVICE=epswrite -sOutputFile=name.eps name.ps

    ```


    The input and output files are *name.ps* and *name.eps*. You will come across
    this mostly when users are attempting to include a file in their documents. Ghostscript
    also has PDF and non-EPS drivers—pdfwrite and pswrite.


    # Converting PostScript to a Bitmapped Format


    Ghostscript can convert PostScript to bitmaps in the same way it allows use of
    non-PostScript printers. This feature is particularly useful for Web site graphics,
    occasional presentations, and some other miscellaneous applications.


    Depending on how you installed Ghostscript, it may offer a number of graphics
    format drivers along with its printer drivers, so a command such as


    ```

    $ gs -q -dBATCH -dNOPAUSE -sDEVICE=jpeg -sOutputFile=name.jpg name.ps

    ```


    will create the jpeg file *name.jpg* from *name.ps*. (Most distributions outfit
    Ghostscript with quite a few graphics format drivers, including ppm, tiff, jpeg,
    and png.)'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Improving Your Conversions


    The results of this conversion may not look anywhere close to optimal, since they
    get rasterized at whatever resolution you pick with the -r option, and therefore
    exhibit jaggies and font problems. You can improve on this by antialiasing; here
    is one way to do so with a jpeg file:


    ```

    $ gs -r300 -q -dBATCH -dNOPAUSE -sDEVICE=ppmraw -sOutputFile=- name.ps | \ pnmscale
    -xscale .2 -yscale .2 | cjpeg -quality 75 > name.jpg

    ```


    Here, we''re first rasterizing the PostScript file at 300 dpi, creating ppm output,
    then sending that to a program called pnmscale, which reduces the size here to
    a fifth of the original, antialiasing in the process. Finally, the file goes to
    cjpeg, which creates a jpeg file with the quality set to 75 percent. The pnmscale
    comes from the pbmplus toolkit (included in Red Hat 6.x). To create other formats,
    replace the cjpeg portion of the command with something like this:


    ```

    $ pnmtopng > name.png

    ```


    or


    ```

    $ pnmtotiff > name.tiff

    ```


    You''ll usually have to tinker a little with options to get the best results.
    Finally, while the pbmplus toolkit is quite good at batch processing, you may
    still find a program like gimp very helpful for manual manipulation. Relevant
    man pages: gs (1), cjpeg (1), pnmtopnm (1), ppm (1)


    # 5.7 Troubleshooting


    When debugging print problems, it helps to know where to look for diagnostic output.
    If you run into a spooling problem, look first in your system log files in /var/log.


    To test a printer on a parallel port, enter a command similar to this:


    ```

    # cat testfile > /dev/lp0

    ```


    If the problem printer lies on the network, you should be able to telnet to a
    port on the printer to see if it''s working.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# PROBLEM 58


    **Symptom:** lpq or lpc reports that it can''t open the device.


    **Problem:** Bad permissions on the device or an incorrect device name.


    **Fix:** Device names and files change frequently. If you upgraded your kernel,
    make sure you specified the right drivers, and check the bootup messages in `/var/log`
    or with `dmesg` to make sure a device did not change its name—for example, lp1
    becoming lp0. Also make sure the print daemon can write to the device.


    # PROBLEM 59


    **Symptom:** Large files don''t print.


    **Problem:** The default maximum file size is too small.


    **Fix:** Set `mx#0:` in the printcap entry. The default for mx is 1MB, completely
    unrealistic for modern printers.


    # PROBLEM 60


    **Symptom:** lpq or lpc reports an I/O error.


    **Problem:** The device is not configured.


    **Fix:** Either the print daemon is trying to write to the wrong device (see the
    above problem) or the kernel doesn''t have the device driver configured. This
    happens most frequently with parallel ports, in the case of a recent kernel upgrade,
    or when the computer just didn''t have a printer previously. If you haven''t already
    done so, read Chapter 7 to upgrade your kernel. Then configure the kernel with
    parallel port support (under General setup), choose PC-style hardware, and make
    sure you''ve selected parallel printer support in Character devices. Then recompile
    the kernel and test the new version.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# PROBLEM 61


    Symptom: Output exhibits jaggies when printed through Ghostscript.


    Problem: Incorrect resolution for a printer.


    Fix: Adjust the print with the -r flag, as in -rXXX,YYY, where n is horizontal
    DPI and m is vertical DPI. Beware—your printer (or the driver) may not support
    the resolution you''re asking for, resulting in anything from curiously wide,
    cut-off pages to complete garbage spewing from the printer.


    # PROBLEM 62


    Symptom: Output is somewhat off-center, cuts off the bottom of the page, and so
    forth.


    Problem: You selected an incorrect paper size.


    Fix (case 1): Using Ghostscript, set the paper size with the -sPAPERSIZE=size
    option on the command line, with size as letter, a4, legal, and so on. To change
    Ghostscript''s default, look in the file gs_init.ps in the library directory for
    lines that resemble this:


    ```

    % Optionally choose a default paper size other than U.S. letter.

    % (a4)

    ```


    Remove the percent sign (%) in front of (a4) and change a4 to whatever paper size
    you want as the default. [Note that if you use gs as a screen viewer, this change
    takes effect there, too.] If for some reason you need to define a custom paper
    size, look in gs_statd.ps in the library directory.


    Fix (case 2): For text files printed with a2ps, use the --medium=type option to
    choose the media (where type is the medium type, like letter). If you want to
    make it a default, use the following in the a2ps configuration file (a2ps.cfg,
    found in an etc directory):


    ```

    Options: --medium=type

    ```'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# PROBLEM 63


    Symptom: Printer''s default NVRAM values keep getting screwed up.


    Problem: Some idiot keeps messing with your printer''s front panel.


    Fix: For example, if you want duplex mode as a default for your printers, and
    someone keeps changing it back to simplex on the front panel, you can either try
    to lock the panel or force a default. If you want to force it (we recommend this
    unless you have really meddling users, because after all you don''t want to have
    to remember printer passwords), when you''re running LPRng, put i:fn p=duplex:
    in your printcap file, making the default duplex. A user can override it for one
    job with lpr -Zsimplex. (Remember that users probably won''t know how to do this,
    and if it''s important they''ll come to you for help—unless they''ve read this
    book.)


    # PROBLEM 64


    Symptom: A user has a PostScript file that won''t print on a particular printer
    or won''t preview or print with Ghostscript.


    Problem: Nonstandard PostScript commands.


    Fix: This situation has no standard fix. Some PostScript files are simply corrupt
    and unprintable. Still, you might be able to get it working with one of two methods.


    One is to get a version of Adobe''s Acrobat Distiller and run it on the file to
    produce a PDF file. Then use Acrobat to print the PDF file to a PostScript Level
    1 file.


    Here''s another option: If Ghostscript can preview the file, you can use the pswrite
    filter in gs to smooth it out as mentioned in Section 5.6 in "Additional Ghostscript
    Utilities." Here''s a quick example—creating new-file.ps from file.ps:


    ```

    $ gs -q -dBATCH -dNOPAUSE -sDEVICE=pswrite -sOutputFile=new-file.ps file.ps

    ```'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# 6


    # INSTALLING SOFTWARE

    FROM SOURCE CODE


    # 6.1 Binary and Source Distributions


    Developers traditionally distributed packages for Unix as source code. There are
    various reasons for this: Binaries don’t work over different architectures and
    operating systems, it makes local modifications to programs possible, users can
    install bug fixes, and so on.


    Because source code is the most common way to distribute Unix packages, knowing
    how to install stuff from source is helpful even if you’re not a programmer. You
    may want to use a version that doesn’t have a binary release, configure it with
    different default options, or put it in a different place.


    Some administrators install as many packages as possible from source—anything
    the systems administrator doesn’t feel is a core part of a Unix system goes elsewhere
    on the system, usually in the /usr/local hierarchy. The main advantage to putting
    files in /usr/local is that everything there survives major operating system upgrades.


    Thankfully, building software is not nearly the hassle that it used to be. Most
    software is written in ANSI C, and widespread use of GNU autoconf has taken much
    of the pain out of configuration. (Of course, some packages just have to be different—deal
    with those as best you can.)'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 6.2 Required Tools


    The basic set of tools necessary for installing packages from source code consists
    of a C compiler, some associated tools, and a version of make. Most distributions
    call this the "development" set of packages. The tools are available with all
    Linux distributions (they are usually marked as optional). The following packages
    are the most important ones.


    # egcs or gcc C Compiler


    A C/C++ compiler is a must. gcc is the traditional standard here, but you may
    come across a version of egcs in your distribution. If you''re given a choice
    between egcs and gcc, and your gcc version isn''t at least version 2.95.1, choose
    egcs. In any case, the commands gcc and g++ should exist on your system.


    # Full Set of Header Files


    Header files (also called include files) contain operating system definitions
    the C compiler needs to compile almost any program (they usually have an extension
    of .h). In addition to the standard set (traditionally included in libc, also
    in glibc-devel packages in Red Hat distributions), you''ll need the kernel include
    files that come with the kernel source code. Some distributions don''t install
    any kernel source, and some may install only the header files that come with the
    source. Make sure you have a /usr/src/linux/include directory.


    # binutils


    This includes the assembler (as), linker (ld), and library archiver (ar), among
    other things. These programs process and glue together the C compiler''s output
    to make the final programs in machine code.


    # make


    make oversees the compilation process. You should have GNU make installed; some
    Makefiles depend on its nonstandard extensions. You may also want the BSD make
    (usually called pmake) if you''re looking at an item from one of the BSD projects.


    # perl


    Larry Wall''s "Swiss Army Chainsaw" of scripting languages—install it if you know
    what''s good for you. Many configuration scripts, code generators, parsers, and
    associated utilities depend on perl.


    # X Window System Header Files


    A distribution often defaults to not installing the include files and static libraries.
    You''ll really want the include files, and you may perhaps want to link statically
    (that is, without shared libraries—see the Shared Libraries section below).'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# How Does It All Fit Together?


    The source distribution contains a number of source files on which the compiler
    runs to create output specific to machines and operating systems. These output
    files are called object files. After building the object files, the compiler runs
    through them all and eventually invokes ln, the linker. In gathers all the code
    it needs from the object files (as well as code and references from system libraries),
    then creates an executable.


    Luckily, make automates the compilation and linking process. The make program
    reads a file called Makefile (sometimes makefile) to run the compiler and linker,
    and you usually use make install to put the programs in their proper place on
    the system. Sometimes you can run tests with make test.


    Because systems can vary so much, one Makefile simply won’t do for all Unix platforms.
    When installing a package in the bad old days, you always needed to edit the Makefile
    and change several settings in order to compile the program. It was time-consuming
    and could present a major headache, so various autoconfiguration programs were
    introduced to create the Makefile and some header files (the canonical example
    is Larry Wall’s Configure script, which came with rn and perl).


    Finally, the GNU autoconf system rose out of the mess, giving developers easy
    access to autoconfiguration. Since many packages now use GNU autoconf, we’ll address
    it in detail in Section 6.4.


    # Shared Libraries


    In the context of software development, a library is a collection of object files
    intended for inclusion by many programs; the linker copies the necessary code
    from a library into the executable program. The libraries are usually located
    in a lib directory like /usr/lib, and they end with .a; the standard static C
    library is /usr/lib/libc.a.


    Because the code in libraries can get quite large, and many programs use the same
    libraries, using a library can waste a lot of disk space and memory—hence the
    introduction of shared libraries. When you link a program against a shared library,
    the linker doesn’t copy code from the libraries; instead, it puts a reference
    to the libraries into the program. When the program runs, a part of the system
    called the run-time linker (or dynamic loader) is invoked, which looks for the
    library, and then pulls code into memory as needed, with only one copy of the
    library code in memory for all running programs. Shared libraries under Linux
    end with .so.number. Run ls /lib/libc.so* to have a look at your shared C library.


    To find out which shared libraries a particular package uses, run ldd on the executable:'
  merge: -1
  img_proc: true
