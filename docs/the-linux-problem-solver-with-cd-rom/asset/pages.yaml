    section. The prompt is somewhat complicated because we''re checking to see whether
    we have an interactive shell, and if so, whether we''re using tcsh or csh. The
    distinction between interactive and noninteractive is important with tcsh and
    csh, because alias definitions and terminal modifications in noninteractive shells
    can cause errors and incur performance penalties.


    # PROBLEM 111


    Symptom: Interactive shell commands in .cshrc unexpectedly run upon startup of
    noninteractive shells.


    Problem: .cshrc does not check to see if the shell is interactive or sets the
    prompt before the interactive check.


    Fix: Make sure the prompt variable checks to see if the shell is interactive (compare
    with $?prompt in the .cshrc example above). If you do this and the interactive
    commands still run unexpectedly, see whether you accidentally set the prompt somewhere
    before this check (make sure it''s not in any .login file).


    As with the .profile stuff in bash, tcsh reads a .login file if it considers a
    shell a login. Try to avoid using .login files, since they confuse matters when
    it comes to windowing systems.


    # 9.5 A Few X Window Start-up Files


    In addition to the shell start-up files, certain files related to the X Window
    System tend to cause additional problems when a user logs in: .xinitrc, .xsession,
    and .Xdefaults. In this section, we''ll go over these files, and we''ll also talk
    about the X Display Manager (xdm), used for console logins. We will not talk about
    how to set up a window manager. If you want advice on that, here it is: Make it
    as plain and simple as possible, because people will wonder about your bad taste
    if you embellish. Seriously, though, adding a huge number of obscure options will
    just annoy users. Furthermore, you''ll find it frustrating to maintain the configuration
    every time a new version of the window manager comes out, probably breaking all
    of your customized options.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# X Startup: .xinitrc and .xsession


    The difference between .xinitrc and .xsession is how you start the X Window System.
    If you run xinit or startx to start the server from a console, you''ll need a
    .xinitrc file; xdm-based systems use .xsession files.


    Starting X with startx or xinit is a pretty roundabout method: First you have
    to log in to a console, then you use another command to start the X server and
    clients (such as the window manager). Unfortunately, because of the many difficulties
    with PC graphics hardware, Linux installations often leave X server configuration
    until later, which means they boot into a console mode and expect the user to
    take it from there. As a consequence, the systems administrator never configures
    xdm, and gets used to starting the X server with xinit or startx.


    On the other hand, xdm starts up the X server at boot time and presents the user
    with a login window. Because starting the X server is usually the most system-intensive
    part of beginning a session, xdm saves a lot of time (see the X Startup: xdm section
    below for how to configure xdm).


    # .xinitrc and .xsession Files


    There really isn''t much difference between .xinitrc and .xsession files—they
    both start a window manager and some clients. These differences only matter in
    terms of X terminals (issues such as where the console messages go). To get around
    this, you can check for an X terminal in a startup file, but they''re becoming
    increasingly obsolete.


    Here’s a sample .xsession or .xinitrc file:


    ```

    ```sh

    #!/bin/sh


    # The background color and foreground colors (dark blue/white)

    BG=''#003''

    FG=white


    # Start up a terminal.

    xterm -geometry 80x24+50+50 &


    # Mail notification program.

    xbiff -geometry -100+0 -foreground $FG -background $BG &


    # Clock.

    xclock -geometry -0+0 -foreground $FG -background $BG -hands $FG &


    # Set the background color to a dark blue.

    xsetroot -solid $BG


    # Start the window manager.

    twm

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'The BG and FG variables are a cheap way of making the desktop uniform. Nothing
    much starts here, just a clock and xbitf. Avoid starting especially slow applications,
    such as file browsers and Netscape. The last item in the script generally controls
    a logout (here it''s the window manager, twm). When that program exits, the X
    session ends. All other continuously running clients such as xclock and xbitf
    go into the background with an ampersand (&).


    # PROBLEM 112


    Symptom: Users log in (with xdm login) and get kicked out again.


    Problem: A bad .xsession won''t let the user log in anymore.


    Fix: First, press F1 instead of the ENTER key after entering the password. This
    drops the user into failsafe mode, which runs an xterm. Then find out what''s
    wrong with the .xsession file; more often than not, it''s an inadvertent ampersand
    at the end of the last command in the list.


    # The Window Manager


    We can''t recommend which window manager to use. We selected twm because it comes
    with X11R6. However, twm can feel pretty inadequate on modern systems. It doesn''t
    really matter if you choose a window manager that has a Windows, Motif, or NEXTSTEP
    look and feel, or a totally different option, like Enlightenment. The crucial
    factors are stability and ease of maintenance.


    # PROBLEM 113


    Symptom: You get kicked out of an X session without running the .xsession.


    Problem: You have a nonexecutable .xsession file.


    Fix: Run chmod u+x .xsession. Also note how to get into fail-safe mode (in the
    previous problem box).


    # X Startup: xdm


    The X Display Manager (xdm) offers a way to log into X directly and avoid the
    lengthy startup of the X server. The xdm daemon starts the X server, places a
    login box on it, and upon login runs some startup programs (.xsession or a system
    default). When the user finishes the session, xdm does some cleanup and presents
    the login box again.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# xdm Configuration Files


    A number of configuration files control xdm; the default location off the X installation
    root is lib/X11/xdm, so on most Linux machines you''ll find xdm''s configuration
    files in /usr/X11R6/lib/X11/xdm.


    If you''re going to mess around with the xdm configuration (as you probably should,
    since its defaults aren''t very good), make another xdm directory somewhere else
    and copy all files in the default xdm directory over to the new one.


    The first item to change is the xdm-config file (in the new directory you just
    created, of course). Find these lines:


    ```

    DisplayManager.errorLogFile:  /usr/X11R6/lib/X11/xdm/xdm-errors

    DisplayManager.pidFile:     /usr/X11R6/lib/X11/xdm/xdm-pid

    DisplayManager.keyFile:     /usr/X11R6/lib/X11/xdm/xdm-keys

    ```


    Change them to the following:


    ```

    DisplayManager.errorLogFile:  /var/log/xdm-errors

    DisplayManager.pidFile:       /var/run/xdm.pid

    DisplayManager.keyFile:       /var/run/xdm.keys

    ```


    Then create the directory /var/run/xdmauth with node 700, and add these two lines:


    ```

    DisplayManager.authDir:      /var/run/xdmauth

    DisplayManager.requestPort:  0

    ```


    In the rest of the lines, such as


    ```

    DisplayManager.servers:      /usr/X11R6/lib/X11/xdm/Xservers

    ```


    change /usr/X11R6/lib/X11/xdm to the directory you created. For example, if you
    chose /usr/local/etc/xdm for the new location of xdm-config (the file you''re
    editing now), change the above line to this:


    ```

    DisplayManager.servers:      /usr/local/etc/xdm/Xservers

    ```


    Now remove the Xaccess file and replace it with an empty file. This tells xdm
    not to let anyone but the local server have a login window. You may want to use
    ipchains (described in Chapter 2) to turn off all incoming traffic on the xdmcp
    port (known to have security exploit problems).


    The Xresources file contains a bunch of definitions, including the setup for failsafe
    mode. The only features you may want to change here are the colors and fonts of
    the login box.


    Xsetup_0 runs programs auxiliary to the login box for display :0. By default,
    it contains code resembling this:'
  merge: -1
