  md: 'The kernel can identify the filesystem type, because the driver is not loaded.
    However, this slightly more verbose version of the command works fine:


    ```

    # mount -t msdos /dev/hda1 /dos

    ```


    Ideally, you’ll have everything you need in /etc/fstab (or the Automounter map),
    so you won’t have to do any of this as root.


    # Other Drivers


    Other drivers you might want to modularize and use with the kernel module loader
    are the loopback device, parallel port driver, ISDN drivers, SCSI generic and
    tape support, and other instances in which one piece of hardware or service has
    only one associated driver. On the other hand, it’s usually better to compile
    Ethernet and SCSI controller drivers straight into the kernel. These all use the
    same interface name (eth or scsi); the kernel usually has little idea what it’s
    looking for there.


    If you use the kernel module loader, put a line like the following in your system
    crontab file (/etc/crontab):


    ```

    00 * * * * root rmmod -a > /dev/null 2>&1

    ```


    This tells cron to remove all unneeded modules every hour (on the hour), reclaiming
    a little memory. (If you don’t have a system crontab file, put it in root’s crontab;
    it has a slightly different format. See Chapter 1 for details on cron.)


    # SCSI Modules


    Be especially careful when handling SCSI modules. If you use a SCSI drive as your
    root device, you should compile the driver for it directly into the kernel. You
    would have a hard time loading a module that’s located on a disk your kernel doesn’t
    know how to find yet. Red Hat follows this procedure anyway, though—it uses an
    initial RAM disk (initrd), putting the SCSI driver modules on the RAM disk image,
    then loading the modules right after the RAM disk mounts. You may use this system
    if you like, but it’s a roundabout method and takes much longer to set up for
    an upgrade. (As you might have surmised, you shouldn’t set up SCSI disk support
    as a module if your root partition is on a SCSI disk.)


    # PCMCIA Cards


    All PCMCIA drivers are modules, distributed not with the kernel but rather with
    another package, called pcmcia-cs. You can get it from http://pcmcia.sourceforge.org/.


    Because PCMCIA cards are hot-swappable modules, this system works quite well.
    When you have a card plugged in, the card manager daemon detects what kind of
    card it is, runs modprobe on the driver, and then option-'
