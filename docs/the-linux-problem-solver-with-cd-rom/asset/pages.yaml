  md: '# NOTE


    As with many of the other diagnostic programs, -n disables host name resolution,
    often speeding up the process quite a bit.


    arp This command lets you look at and play with your system’s ARP (address resolution
    protocol) cache. The ARP cache is a table that pairs hardware interface (such
    as Ethernet) addresses with Internet addresses. You’ll need to use arp if you
    switched Ethernet interfaces on a machine, or if a machine on your network is
    sending bad ARP data.


    The -a option shows the table; the -d hostname option deletes an ARP entry—for
    those times when you switch an Ethernet card on another machine and your cache
    is still out in left field; -s hostname hardware-address manually sets an entry
    in the cache. And -n disables name resolution, as in many other network diagnostic
    tools.


    tcpdump Use this command with discretion, since it is a packet sniffer that can
    look at any unencrypted data going across your network and may seriously invade
    privacy. It sets an interface to what is called promiscuous mode, and prints out
    any traffic it sees on the interface after application of a user-specified filter.
    It can find the origin of stray packets or make a general collection of statistics
    if your network is saturated. This mode also slows the machine’s network interface.


    Here’s an example run on the host 10.1.1.100:


    ```

    # tcpdump port ''telnet''

    Kernel filter, protocol ALL, datagram packet socket

