- pgno: 157
  md: '# Object Files


    There shouldn’t be any object files (ending in .o) in normal, clean, out-of-the-box
    distributions. If object files are present, proceed with caution. It may be that
    the software author cannot release certain source code, and in that case you may
    need to follow special instructions to link the object files into the final program.
    But if the author simply forgot to delete the files, not only should you delete
    them (they may not even be for the i x86 or Linux), but look out for other mistakes
    that pop up in a sloppy distribution—hard-coded file paths, incorrect compiler
    options, and so on.


    # 6.4 If a Package Uses GNU autoconf


    Building software has become much simpler since GNU autoconf’s rise in popularity.
    GNU autoconf generates a script called configure that looks over your system configuration
    and options to create a proper Makefile and local configuration header files.
    You typically need only run the configure script to build the package and make
    to compile it.


    First, though, make sure your program actually uses the autoconf system. If the
    main distribution directory includes files called configure, Makefile.in, and
    config.h.in, then the package uses autoconf.


    # Running configure


    Let’s run configure on a sample package, f dutils-5.3.tar.gz, a floppy disk utility
    package that you’ll find in support/installsoft on the included CD-ROM. Unpack
    it and run ./configure in the f dutils-5.3 directory. You’ll get output that resembles
    the following:


    ```

    creating cache ./config.cache

    checking whether make sets ${MAKE}... yes

    checking for gcc... gcc

    checking whether the C compiler (gcc ) works... yes

    ..

    ..

    creating doc/Makefile

    creating config.h

    ```


    The last two lines indicate that you’ve created a Makefile and config.h. Now type
    make. The compiler then runs on a number of files, with resulting output like
    this:


    ```

    make -C src all

    make[1]: Entering directory `/tmp/fdutils-5.3/src`

    gcc -Wall -g -O2 -I. -I. -DHAVE_CONFIG_H -DSYSCONFDIR=\"/usr/local/etc\" -c floppycontrol.c
    -o floppycontrol.o

    floppycontrol.c:259: warning: return type of `main'' is not `int''

    ..

    ```'
  merge: -1
  img_proc: true
