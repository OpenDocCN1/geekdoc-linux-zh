- pgno: 159
  md: '# Important configure Options


    The configure script takes options in typical GNU fashion (that is, in a --item=value
    format). These options are mainly for configuring a program with different defaults,
    but configure sometimes doesn’t get everything right; if this is the case, you
    can override certain defaults and checks on the command line. Here are some of
    the most important configure options:


    # --prefix=directory


    Changes the default installation prefix of /usr/local to directory. If you run
    ./configure --prefix=/tmp/fdutils on the fdutils package, the binaries would go
    in /tmp/fdutils/bin and the manual pages would go under /tmp/fdutils/man. Most
    packages stick strictly to their prefixes. Section 6.6 discusses further use of
    this option.


    # --bindir=directory, --sbindir=directory, and so on


    With these options, you can influence where individual types of programs go instead
    of defaults like prefix/bin and prefix/sbin.


    # --disable-shared


    This option keeps the package from creating shared libraries, if it has any. There
    are many reasons why you would not want to create a shared library. See the note
    in Section 6.6 under Organization for one reason, and have a look at Shared Libraries
    in Section 6.2 if you haven’t already.


    > NOTE configure options vary from package to package. Look at the output of ./configure
    --help for a (possibly incomplete) list of options.


    # Environment Variables


    Another way to influence configure is through the use of environment variables.
    Here’s an example (assuming you’re running bash):


    ```

    $ CFLAGS=''-O2 -I/usr/local/package/include'' ./configure

    ```


    Normally, configure uses both the -g (generate debugging information) and -O2
    (optimize 2 levels) options as the initial CFLAGS. Although you end up with optimized
    code, it includes a large amount of extra stuff, taking up much more disk space
    than necessary (although the code never occupies excess memory unless you’re actually
    using the debugger). If you’re not writing the program, you don’t need this extra
    stuff, so you only want to include the -O2 optimization option.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'The -I/usr/local/package/include make configure and the compiler look in /usr/local/package/include
    for include files. Sometimes certain include files aren’t in a standard place,
    and the CFLAGS environment variable is a handy way to convey the location to configure.


    Here’s another example to keep in mind—it solves problems with shared libraries:


    ```

    $ LDLAGS=''-L../lib -L/opt/stuff/lib -Wl,-rpath=/opt/stuff/lib''

    ```


    This tells configure and the linker to search in ../lib and /opt/stuff/lib for
    libraries, and causes the run-time linker to look in /opt/stuff/lib for shared
    libraries when you build and run the program. See Shared Libraries in Section
    6.2 for further discussion of shared libraries.


    # PROBLEM 69


    Symptom: configure fails with an error message such as configure: error: installation
    or configuration problem: C compiler cannot create executables.


    Problem: Bad compiler or linker options; missing tools.


    Fix: Check the end of the config.log file, where you should find at least some
    evidence of the error. The following example with a bogus compiler flag


    ```

    $ CFLAGS=BAR ./configure

    ```


    yields an error in the log file:


    ```

    configure:673: checking whether the C compiler (gcc BAR ) works

    configure:689: gcc -o conftest BAR  conftest.c 1>&5

    gcc: BAR: No such file or directory

    configure: failed program was:

    ...

    ```


    The first line above indicates the compiler used. The second line is the command
    that configure tried, the third is an error message from the compiler, and the
    rest is the source code of the program the compiler failed on. (configure generates
    these programs, which are otherwise unrelated to the package’s source code.)'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# 6.5 When the Package Doesn’t Use GNU autoconf


    Some more heavily used programs, such as Ghostscript and perl, don’t use the autoconf
    system. Categorization is difficult, but there are roughly three styles of such
    programs:


    # Edit Makefile and/or config.h


    This is the traditional Unix style. If a program expects you to edit some files
    just to make it build, the edits probably won’t be very complicated and may be
    unnecessary.


    # Imakefiles


    Widely used for X applications, imake is at the heart of building the base X distribution
    itself. This system works on prespecified templates.


    # Other Schemes


    These include anything from custom configuration scripts to Makefiles with special
    targets for different platforms. The latter scheme rarely works well; you may
    find these types of packages annoying at the very least.


    Even though packages tend to fall into one of these three slots, there is no single
    formula for building and installation when a package does not use autoconf. Its
    instructions, if available, usually tell you the specifics. If they don’t, or
    if it has no instructions whatsoever and you get really stuck, you have two choices:
    Either give up or find someone more experienced and ask for help. As always, if
    you choose the latter option, be considerate of their time.


    # Editing Makefile, config.h, and Variants


    If the source directory has a Makefile, perhaps config.h, and instructions that
    tell you to type make—or more likely (and with a much better sense of reality),
    to look over the Makefile and then run a make—you’ve come across a fairly standard
    build. Some of the more thoughtful packages tell you to copy some item like Makefile.dist
    to Makefile and edit Makefile (if you’re building Ghostscript, for example, you’d
    cp unix-gcc.mak Makefile and edit Makefile).


    # The Makefile


    The Makefile typically consists of two sections: a number of definitions in VARIABLE=value
    format, and a target section that defines what you must do to compile the package.
    When you edit a Makefile to configure a program, you’ll only change the section
    with the definitions.


    Let’s go through an example. Unpack the package hello_w-0.00.tar.gz on the included
    CD-ROM and cd hello_w-0.00. This is a sample program with'
  merge: -1
  img_proc: true
- pgno: 162
  md: '```

    a simplified Makefile. Copy Makefile.dist to Makefile and config.h.dist to

    config.h, then examine the Makefile. The first part looks like this:


    # CC=gcc

    # use -O to turn on the optimizer

    MYCFLAGS=-g

    # MYCFLAGS=-O

    DESTDIR=/usr/local

    BINDIR=$(DESTDIR)/bin

    MANDIR=$(DESTDIR)/man/man1

    # For X support, define -DHAVE_X and the include/lib directories

    # XTRA=-DHAVE_X

    # XINC=-I/usr/X11R6/include

    # XLIB=-L/usr/X11R6/lib -lX11 -lXt

    # -- Don''t edit below this line

    ...

    ```


    As in many Unix files, lines that begin with a hash mark (#) are comments. In
    a Makefile, hash marks often offer a quick means of specifying options. To activate
    the CC=gcc line, remove the hash mark and make sure it doesn''t get redefined
    a line or two later.


    CC specifies which C compiler to use. By default it''s cc, and since Linux''s
    cc is just a link to gcc, don''t bother with these lines.


    CFLAGS is set to debug flag -g without any optimization, hinting that you might
    want to use the -O option instead.


    The DESTDIR, BINDIR, and MANDIR definitions pertain to where to install the program
    when you make install. DESTDIR is set to a root directory, and the executables
    and manual pages in BINDIR and MANDIR, respectively. Notice the definition relative
    to DESTDIR; if you decide to install the program somewhere else instead of the
    default location, this saves tedious alterations to the Makefile, but keeps open
    the option of installing one part in a completely different place from the rest
    of the package. Sadly, not every Makefile allows this.


    The XTRA, XINC, and XLIB definitions, common to most here, suggest that the program
    supports X; if you have the X libraries and include files, you can build that
    support. The values here assume an X root at /usr/X11R6, the default on most current
    Linux systems. This name will probably change in the future as new versions of
    X appear.


    The most essential X definitions here are XINC and XLIB. XINC is the location
    of the X include files (preceded by -I), and XLIB shows where the libraries are
    and specifies which ones to use. Packages rely on a mix of variables for this.
    Ghostscript''s Makefile, for example, uses three variables instead of two: XINCLUDE,
    XLIBDIRS, and XLIBS. For some reason or other, they always seem to have a bizarre
    default, so look them over carefully.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# PROBLEM 70


    Symptom: At link time, you get errors like undefined reference to SM_some_symbol
    [or ICE_some_symbol].


    Problem: You need the SM and ICE libraries.


    Fix: Add the libraries to the list that contains -lX11 and others in the Makefile.


    # Editing the Makefile


    Now go ahead and edit the Makefile. Set the CFLAGS to optimize (with -O) and the
    DESTDIR to /tmp. Don''t bother with the X stuff yet; just type make. After the
    program builds, run it with ./hello (since this is just an example program, it
    isn''t terribly exciting). The lines pertaining to X don''t do much; if you uncomment
    them, make clean, and make again, the only real difference is that if you run
    ldd hello, you''ll see hello linked against a whole bunch of X libraries. You
    can do a make install if you like. Since you set the DESTDIR to /tmp, it''s harmless,
    and you can remove it at your leisure.


    # config.h


    The config.h file is another matter. This is a C header file with a bunch of definitions.
    When changing one of these, it''s particularly important to make sure you''re
    sticking to the C language. Try changing awfully to completely in config.h (in
    the example hello_w package), run a make to rebuild, and then see what ./hello
    does.


    # BSD or SVR4?


    This example program doesn''t include any real dependencies on the operating system,
    but others may. Since most Unix flavors are based on BSD or SVR4 (System V release
    4), one option that comes up often is a choice between those two. Linux tends
    to lean more toward the SVR4 side in terms of its include files and libraries,
    but nonetheless includes many BSD-isms such as the printing system. Choose SVR4,
    but keep in mind that you might need some BSD options as well.


    # Common Path Names


    You may have to fill in path names in a Makefile or header file before you build
    a package. Here is a short list of files and where most Linux systems keep them.
    Check out the file /usr/include/paths.h for a larger list, as well as the Linux
    File System Structure Standard (FSSNTD) at ftp://tsx-11.mit.edu/pub/linux/docs/linux-standards/fsstd.'
  merge: -1
