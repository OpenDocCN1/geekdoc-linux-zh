    # 8.6 Fixing Filesystems


    The cornerstone of repairing a damaged filesystem is the fsck program. It goes
    over the entire filesystem structure, finds errors, and repairs them if you want
    it to. It normally runs at boot time; because filesystem errors can lead to very
    serious problems, Unix systems make extra sure of filesystem stability.


    fsck itself is a wrapper program that calls the appropriate fsck for the filesystem.
    The fsck for a Minix filesystem, for example, will not work on a second extended
    filesystem. The real fsck programs are usually located in /sbin and named fsck.fs
    where fs is the target filesystem; two standard fscks on most systems are fsck.ext2
    (usually just a hard link to e2fsck) and fsck.minix.


    # Operating fsck Manually


    At times you’ll have to run fsck manually—don’t let this alarm you. Just run the
    following (for example, if the partition you need to check is /dev/hda1):


    ```

    # fsck /dev/hda1

    ```


    fsck checks /dev/hda1 for errors and if it finds any, asks if you’d like to fix
    them. It does this on an error-by-error basis, which can get very tedious if the
    disk has a lot of problems. Use fsck -p to force yes answers to the questions.


    If you have an /etc/fstab available, you can make fsck look up a device. In this
    example, fsck looks up the /home device:


    ```

    # fsck /home

    ```


    When no /etc/fstab is available, and you can’t remember the device name of the
    desired filesystem, use fdisk -l to list the current partition table (along with
    the device names) of a disk.


    > NOTE Do not run fsck on a currently-mounted filesystem unless it’s mounted read-only.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# PROBLEM 101


    Symptom: fsck can''t find a superblock or filesystem on a partition.


    Problem: You have a bad superblock.


    Fix: Superblocks contain data critical to the layout of a filesystem on the disk,
    and fsck needs to look at one of them to go over the partition. Creating a filesystem
    also creates a number of superblock backups. Normally fsck just looks at the normal
    superblock, but if it can''t find that superblock, it uses fsck''s -b option,
    like this:


    ```

    # fsck -b 8193

    ```


    This points fsck to another superblock. Normally, there are superblock backups
    at 8193 and 16385.


    # PROBLEM 102


    Symptom: You''re unable to remount / read-only.


    Problem: mount wants to change files to remount a filesystem.


    Fix: For /, use


    ```

    # mount -n -o ro,remount /

    ```


    # The Clean Bit


    Many filesystems have a clean bit, a parameter set to true when you mount the
    filesystem read-only or unmounted. The bit signals when the filesystem is in good
    condition and doesn''t need a check. This is most relevant at boot time, because
    people don''t want to wait hours for their computers to start up. However, it
    can sometimes get in the way if there''s a problem the operating system doesn''t
    know about (such as bad memory). If this is the case, use fsck''s -f option.


    Relevant man pages: fsck (8), e2fsck (8)


    # tune2fs and debugfs


    A program called tune2fs can sometimes resolve filesystem performance problems.
    These often stem from the previously mentioned maximal mount count (modified with
    tune2fs -c), plus the reserved blocks percentage (tune2fs -m). The manual clearly
    describes the rest of the options. As with fsck, don''t use this on a currently
    mounted filesystem unless it''s mounted as read-only.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# PROBLEM 103


    Symptom: Even though the filesystem is clean, a maximal mount count exceeded error
    forces full fsck at every boot, causing long boot times.


    Problem: You’ve exceeded the maximal mount count; a forced check doesn’t reset
    the counter.


    Fix: Go to single-user mode (for example, with init s), umount -a, remount / read-only
    (see above), and run fsck manually. This problem should not occur in modern installations.


    # PROBLEM 104


    Symptom: Even though you shut down the machine properly, the filesystem is always
    dirty upon reboot and requires a check.


    Problem: Unclean shutdown.


    Fix: This problem can be a little time-consuming to track down, but you can usually
    do it without too many headaches. Try this:


    +   1. Look at the single-user mode init runlevel (it will be in some rc*.d directory—check
    /etc/inittab as described in Chapter 1) and make sure there are no huge differences
    between it and the runlevel for reboot (if there are, it’s likely that you don’t
    have the reboot runlevel set correctly in /etc/inittab). The single-user mode
    version will start up a shell instead of a reboot.


    +   2. Go to single-user mode with init s (or whatever the appropriate runlevel
    is). Single-user mode should kill all processes and try to umount all filesystems
    except for /.


    +   3. Verify the last step by executing umount -a. If nothing else is running,
    you’ll just get a message saying that / is busy. If you get more messages, your
    reboot init configuration is probably not killing processes and unmounting all
    filesystems properly. If you do get that message and everything seems fine, skip
    to Step 5.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# PROBLEM 104 (CONTINUED)


    4. Check that the file before the actual reboot command (which should be the very
    last file that starts with S in the rc*.d directory for reboot) has umount -a
    and mount -n -o ro,remount / commands, in that order. On Debian systems, for example,
    this appears in /etc/rc6.d; the first file (actually a link) is S40umountfs, and
    you do the reboot with S90reboot. The commands should be in the files (unless
    someone removed them by hand), but a test inside the files may prevent the commands
    from running; if this is the case, find out and fix whatever is causing the tests
    to fail.


    You might also have a problem with lingering processes. Run a full process listing
    with ps auxw. There shouldn’t be all that many processes active. See if any on
    the list is running inappropriately in single-user mode (only some low-numbered
    kernel processes should use this mode). Kill off any process that looks wrong,
    then try the umount -a again.


    Once you’ve found the culprit, you have two ways to turn it off during system
    shutdown. The proper way (described in Chapter 1) is through the rc*.d convention
    for stopping services, scripts, or links to scripts starting with K; this convention
    makes init pass the stop argument to the script. The other way to turn off the
    problematic process is to do a generic kill-off by sending signals to all processes
    (for example, with killall5 -15 followed by killall5 -9). Most distributions do
    this near the end of their shutdown configuration (for example, in Debian it’s
    /etc/rc6.d/S20sendsigs). So if you see a problem here, the process is probably
    going into a bad zombie stage, which usually indicates driver problems, but also
    results from not giving it enough time to shut down.


    5. If none of the above seems relevant, you may just need to allow more time for
    shutdown. Do so with a sleep inside one of the init.d scripts after you’ve killed
    all processes.


    If you have really serious problems with a filesystem that fsck can’t fix, the
    debugfs utility can help by performing low-level actions. Take special care when
    using debugfs commands that change the filesystem; debugfs allows you to clear
    blocks and wipe out inodes.


    Like tune2fs, debugfs has a good manual page. When you use debugfs, either you
    want to look at the filesystem’s internal structure or the kernel is complaining
    about some bad inode that fsck can’t seem to find. In the latter case (probably
    a result of bad memory corrupting a cache), you’ll want debugfs’ clri command.'
