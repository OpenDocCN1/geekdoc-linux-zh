- pgno: 254
  md: 'Then run a program like oclock or editres. So why isn''t the %C customization
    resource set to -color for color displays, you ask? Well, that''s a good question—and
    we don''t have an answer.


    # XFILESEARCHPATH


    Steer clear of the environment variable XFILESEARCHPATH. This is a complete and
    absolute override of the normal app-defaults path. The only real reason to set
    this variable is when you''re explicitly trying to avoid loading X resources from
    a certain place. Its specification is like that of XUSERFILESEARCHPATH.


    If you really want to see a horrendous manual page on this stuff, have a look
    at XtResolvePathname (3).


    # Default .Xdefaults Files


    What should be in a default .Xdefaults file? Probably only this, which adds some
    comfort to xterm:


    ```

    XTerm.vt100.font: -b&h-lucidatypewriter-medium-r-*-*-14-*-*-*-*-*-*-*

    XTerm.vt100.scrollBar: on

    ```


    The more customization you add to users'' default .Xdefaults files, the greater
    chance you''ll make a mistake or enter some option that, once outdated, makes
    applications look terrible or otherwise go awry.


    # A Final Word on Simplicity


    Throughout this book, we''ve advocated simplicity. Whether it''s because log configuration
    files don''t hold up well over package upgrades, or because more bells and whistles
    means more can break, the overall goal is saving your time. In this chapter, simplicity
    is especially important because the default startup files for new users greatly
    affect how they learn the system. If you give them a very complicated setup that
    malfunctions at the drop of a hat, they''ll come to you for help more often than
    if you give them a setup they can understand quickly.


    But don''t remove all of your files in the ultimate pursuit of simplicity!'
  merge: -1
  img_proc: true
