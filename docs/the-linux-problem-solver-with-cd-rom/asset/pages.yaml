  md: '# PROBLEM 91


    **Symptoms:** The kernel is using too much memory, you''re running into driver
    conflicts, and so forth.


    **Problem:** Your system has a bloated kernel.


    **Fix:** If you don''t need a driver right now, don''t compile it into the kernel,
